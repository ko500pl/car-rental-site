<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ადმინი — საიტის მართვა</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;font-family:"Noto Sans Georgian",system-ui,sans-serif}
    #nc-root:empty::after{content:"იტვირთება…";display:block;padding:40px;text-align:center;color:#66788a}
  </style>
</head>
<body>
  <a href="/admin/bookings.html" style="position:fixed;z-index:9999;right:12px;top:12px;padding:10px 14px;border-radius:9px;background:#0b1724;color:#fff;text-decoration:none">ჯავშნების მართვა</a>
  <!-- ══════════════════════════════════════════════════════════════════════
       ადმინ-პანელი. ორი ვარიანტია — ერთი აქტიურია, მეორე კომენტარში.

       ვარიანტი 1 (აქტიური): Decap CMS — კარგად დოკუმენტირებული, Netlify-ის
       GitHub OAuth-თან პირდაპირ მუშაობს.

       ვარიანტი 2: Sveltia CMS — იგივე config.yml, გაცილებით სწრაფი და
       მოხერხებული ინტერფეისი. გადასართავად დააკომენტარეთ ქვედა ორი <script>
       და გააქტიურეთ Sveltia-ს ხაზი.
       ═══════════════════════════════════════════════════════════════════ -->

  <!-- ვარიანტი 2 — Sveltia CMS (გასააქტიურებლად მოხსენით კომენტარი)
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  -->

  <!-- ვარიანტი 1 — Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

  <script>
    // build.py-ის შემდეგ საიტი გადაიწყობა ავტომატურად (Netlify / GitHub Actions).
    // ცვლილების შენახვიდან საიტზე გამოჩენამდე გადის 1–2 წუთი.
    if (window.CMS) {
      CMS.registerPreviewStyle('/assets/style.css');
      CMS.registerEventListener({
        name: 'postSave',
        handler: () => console.log('[admin] შენახულია — საიტი 1–2 წუთში განახლდება'),
      });
    }
  </script>
</body>
</html>
