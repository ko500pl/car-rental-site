                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
              - {label: "ინგლისურად", name: en, widget: object, fields: [
                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
              - {label: "რუსულად", name: ru, widget: object, fields: [
                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
              - {label: "სპარსულად", name: fa, widget: object, fields: [
                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
              - {label: "ებრაულად", name: he, widget: object, fields: [
                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
              - {label: "არაბულად", name: ar, widget: object, fields: [
                  {label: "ქუჩა", name: street, widget: string},
                  {label: "ქალაქი", name: city, widget: string}]}
          - {label: "სოციალური ქსელები", name: social, widget: list,
             field: {label: "ბმული", name: url, widget: string}}

      - name: design
        label: "დიზაინი"
        file: content/settings/design.yml
        fields:
          - {label: "ლოგო (სურათი)", name: logo_image, widget: image, required: false,
             hint: "ცარიელი = ტექსტური ლოგო"}
          - {label: "ლოგოს სიმაღლე, px", name: logo_height, widget: string}
          - {label: "ძირითადი ფერი", name: color_brand, widget: color}
          - {label: "ბმულის / hover ფერი", name: color_brand_2, widget: color}
          - {label: "მუქი ფერი", name: color_brand_ink, widget: color}
          - {label: "აქცენტი", name: color_accent, widget: color}
          - {label: "ტექსტის ფერი", name: color_ink, widget: color}
          - {label: "მეორეხარისხოვანი ტექსტი", name: color_ink_2, widget: color}
          - {label: "ფონი", name: color_bg, widget: color}
          - {label: "ალტერნატიული ფონი", name: color_bg_2, widget: color}
          - {label: "ჩარჩოს ფერი", name: color_line, widget: color}
          - {label: "ფასის ფერი", name: color_ok, widget: color}
          - {label: "ფონტების სტეკი (CSS)", name: font_family, widget: string}
          - {label: "Google Fonts", name: google_fonts, widget: string, required: false,
             hint: "მაგ. Noto+Sans+Georgian:wght@400;700"}
          - {label: "ძირითადი ზომა, px", name: base_font_size, widget: string}
          - {label: "მომრგვალება, px", name: radius, widget: string}
          - {label: "მაქს. სიგანე, px", name: max_width, widget: string}
          - {label: "Hero-ს სტილი", name: hero_style, widget: select, options: [gradient, solid, image]}
          - {label: "Hero-ს ფონური სურათი", name: hero_image, widget: image, required: false}
          - {label: "სურათის დაბნელება (0–1)", name: hero_overlay, widget: string}

      - name: maps
        label: "რუკა, გზები და Traffic"
        file: content/settings/maps.yml
        fields:
          - {label: "პროვაიდერი", name: provider, widget: select, options: [tomtom, osrm], default: tomtom}
          - {label: "TomTom API key", name: tomtom_api_key, widget: string, required: false,
             hint: "გამოიყენება Leaflet-ში რეალური გზებისა და ცოცხალი მოძრაობისთვის"}
          - {label: "Traffic ფენა", name: traffic_enabled, widget: boolean, default: true}
          - {label: "რეალურ გზებზე მარშრუტი", name: routing_enabled, widget: boolean, default: true}
          - {label: "Traffic გამჭვირვალობა", name: traffic_opacity, widget: number, value_type: float, min: 0.1, max: 1, default: 0.82}
          - {label: "სარეზერვო მარშრუტი", name: fallback_provider, widget: select, options: [osrm, none], default: osrm}

      - name: categories
        label: "ავტომობილების კატეგორიები"
        file: content/settings/categories.yml
        fields:
          - label: "კატეგორიები"
            name: categories
            widget: list
            fields:
              - {label: "სისტემური კოდი", name: key, widget: string}
              - {label: "ქართულად", name: ka, widget: string}
              - {label: "ინგლისურად", name: en, widget: string}
              - {label: "რუსულად", name: ru, widget: string}
              - {label: "სპარსულად", name: fa, widget: string}
              - {label: "ებრაულად", name: he, widget: string}
              - {label: "არაბულად", name: ar, widget: string}

