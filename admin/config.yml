# ═══════════════════════════════════════════════════════════════════════════
#  ადმინ-პანელის კონფიგურაცია (Decap CMS)
#  ⚠️ გაშვებამდე შეცვალეთ: backend.repo — თქვენი GitHub რეპოზიტორია
# ═══════════════════════════════════════════════════════════════════════════
backend:
  name: github
  repo: ko500pl/car-rental-site
  branch: main
  base_url: https://api.netlify.com    # Netlify-ის GitHub OAuth შუამავალი
                                       # (Netlify → Site configuration → Access & security → OAuth → Install provider: GitHub)
  auth_endpoint: auth
  commit_messages:
    create: 'ადმინი: შეიქმნა {{collection}} "{{slug}}"'
    update: 'ადმინი: განახლდა {{collection}} "{{slug}}"'
    delete: 'ადმინი: წაიშალა {{collection}} "{{slug}}"'
    uploadMedia: 'ადმინი: ატვირთულია {{path}}'
    deleteMedia: 'ადმინი: წაშლილია {{path}}'

# ლოკალური ტესტირება:  npx decap-server  +  python3 -m http.server (dist)
# local_backend: true   # ჩართეთ მხოლოდ ლოკალური ტესტირებისას (npx decap-server)

media_folder: static/uploads
public_folder: /uploads

publish_mode: simple
locale: en
show_preview_links: true

# ─── ექვსენოვანი რედაქტირება (ka en ru fa he ar) ───────────────────────────
i18n: &i18n
  structure: single_file
  locales: [ka, en, ru, fa, he, ar]
  default_locale: ka

# ═══ ბლოკების საერთო აღწერა (მრავალჯერ გამოიყენება) ═══════════════════════
_blocks: &blocks
  label: "შიგთავსი (ბლოკები)"
  label_singular: "ბლოკი"
  name: blocks
  widget: list
  i18n: true
  types:
    - label: "სათაური H2"
      name: h2
      widget: object
      fields: [{label: "ტექსტი", name: text, widget: string, i18n: true}]
    - label: "სათაური H3"
      name: h3
      widget: object
      fields: [{label: "ტექსტი", name: text, widget: string, i18n: true}]
    - label: "აბზაცი"
      name: p
      widget: object
      fields:
        - {label: "ტექსტი", name: text, widget: text, i18n: true,
           hint: "მუშაობს **მსხვილი** და [ბმული](/pricing/)"}
    - label: "ყურადღების ბლოკი"
      name: note
      widget: object
      fields: [{label: "ტექსტი", name: text, widget: text, i18n: true}]
    - label: "სია (ბულეტებით)"
      name: ul
      widget: object
      fields:
        - {label: "პუნქტები", name: items, widget: list, field: {label: "პუნქტი", name: item, widget: string}, i18n: true}
    - label: "სია (დანომრილი)"
      name: ol
      widget: object
      fields:
        - {label: "პუნქტები", name: items, widget: list, field: {label: "პუნქტი", name: item, widget: string}, i18n: true}
    - label: "ცხრილი"
      name: table
      widget: object
      fields:
        - {label: "წარწერა ცხრილის თავზე", name: caption, widget: string, required: false, i18n: true}
        - {label: "პირველი სვეტი გამოკვეთილი", name: rowhead, widget: boolean, default: true, required: false}
        - {label: "სვეტების სათაურები", name: head, widget: list, field: {label: "სათაური", name: h, widget: string}, i18n: true}
        - label: "სტრიქონები"
          name: rows
          widget: list
          i18n: true
          fields:
            - {label: "უჯრები", name: cells, widget: list, field: {label: "უჯრა", name: c, widget: string}}
    - label: "ციფრების ზოლი"
      name: facts
      widget: object
      fields:
        - label: "ჩანაწერები"
          name: items
          widget: list
          i18n: true
          fields:
            - {label: "დასახელება", name: k, widget: string}
            - {label: "მნიშვნელობა", name: v, widget: string}
    - label: "ბარათები"
      name: cards
      widget: object
      fields:
        - label: "ბარათები"
          name: items
          widget: list
          i18n: true
          fields:
            - {label: "იარლიყი", name: tag, widget: string, required: false}
            - {label: "სათაური", name: title, widget: string}
            - {label: "ტექსტი", name: text, widget: text, required: false}
            - {label: "პუნქტები", name: list, widget: list, required: false, field: {label: "პუნქტი", name: i, widget: string}}
            - {label: "ფასი", name: price, widget: string, required: false}
    - label: "კითხვა-პასუხი (FAQ)"
      name: faq
      widget: object
      fields:
        - label: "კითხვები"
          name: items
          widget: list
          i18n: true
          fields:
            - {label: "კითხვა", name: q, widget: string}
            - {label: "პასუხი", name: a, widget: text}
    - label: "მოწოდების ბლოკი (CTA)"
      name: cta
      widget: object
      fields:
        - {label: "სათაური", name: title, widget: string, i18n: true}
        - {label: "ტექსტი", name: text, widget: text, i18n: true}
        - label: "ღილაკები"
          name: actions
          widget: list
          i18n: true
          fields:
            - {label: "წარწერა", name: label, widget: string}
            - {label: "ბმული", name: href, widget: string, hint: "მაგ. /contact/ — ენის პრეფიქსი ავტომატურად დაემატება"}
    - label: "ავტომობილების ბადე"
      name: cars
      widget: object
      fields:
        - label: "კატეგორია"
          name: category
          widget: select
          options: [economy, suv, business, offroad, minivan, van]

_seo_title: &seo_title
  {label: "გვერდის სათაური (title)", name: title, widget: string, i18n: true,
   hint: "≤ 70 სიმბოლო — ჩანს Google-ის შედეგებში"}
_seo_desc: &seo_desc
  {label: "აღწერა (meta description)", name: desc, widget: text, i18n: true,
   hint: "110–180 სიმბოლო"}
_seo_kw: &seo_kw
  {label: "საკვანძო სიტყვები", name: keywords, widget: string, i18n: true, required: false}

collections:
  # ───────────────────────────────────────────────────────────── გვერდები
  - name: pages
    label: "გვერდები"
    label_singular: "გვერდი"
    i18n: *i18n
    files:
      - name: index
        label: "მთავარი გვერდი"
        file: content/pages/index.yml
        i18n: true
        fields:
          - *seo_title
          - *seo_desc
          - *seo_kw
          - {label: "სათაური გვერდზე (H1)", name: h1, widget: string, i18n: true}
          - label: "ზედა ბლოკი (hero)"
            name: hero
            widget: object
            i18n: true
            fields:
              - {label: "პატარა წარწერა ზემოთ", name: kicker, widget: string}
              - {label: "შესავალი ტექსტი", name: lead, widget: text}
              - label: "ციფრები"
                name: facts
                widget: list
                fields:
                  - {label: "დასახელება", name: k, widget: string}
                  - {label: "მნიშვნელობა", name: v, widget: string}
          - *blocks

      - name: fleet
        label: "ავტოპარკი"
        file: content/pages/fleet.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: pricing
        label: "ფასები"
        file: content/pages/pricing.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: terms
        label: "პირობები"
        file: content/pages/terms.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: faq
        label: "ხშირი კითხვები"
        file: content/pages/faq.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: blog
        label: "ბლოგის მთავარი"
        file: content/pages/blog.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: map
        label: "რუკის გვერდი"
        file: content/pages/map.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: about
        label: "ჩვენ შესახებ"
        file: content/pages/about.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: contact
        label: "კონტაქტი"
        file: content/pages/contact.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

      - name: software
        label: "პროგრამა (Fleet House Manager)"
        file: content/pages/software.yml
        i18n: true
        fields: [*seo_title, *seo_desc, *seo_kw, {label: "H1", name: h1, widget: string, i18n: true},
                 {label: "შესავალი", name: lead, widget: text, i18n: true}, *blocks]

  # ──────────────────────────────────────────────────────── ავტომობილები
  - name: cars
    label: "ავტომობილები"
    label_singular: "ავტომობილი"
    folder: content/cars
    extension: yml
    format: yaml
    create: true
    slug: "{{fields.en.name}}"
    summary: "{{fields.en.name}} — {{fields.price_1_6}} ₾"
    sortable_fields: [order, price_1_6, category]
    i18n: *i18n
    fields:
      - {label: "სტატუსი", name: status, widget: select, default: draft,
         options: [{label: "მონახაზი", value: draft}, {label: "გამოქვეყნებული", value: published}, {label: "არქივი", value: archived}],
         hint: "ახალი ჩანაწერი გამოქვეყნებამდე ექვსივე ენაზე შეავსეთ"}
      - label: "კატეგორია"
        name: category
        widget: select
        options:
          - {label: "ეკონომ კლასი", value: economy}
          - {label: "კროსოვერი / SUV", value: suv}
          - {label: "ბიზნეს კლასი", value: business}
          - {label: "მაღალი გამავლობის 4x4", value: offroad}
          - {label: "მინივენი", value: minivan}
          - {label: "კომერციული ფურგონი", value: van}
      - {label: "რიგითობა (მცირე = ზემოთ)", name: order, widget: number, value_type: int, default: 99}
      - {label: "გამორჩეული", name: featured, widget: boolean, default: false, required: false}
      - {label: "მთავარი ფოტო", name: image, widget: image, required: false,
         hint: "რეკომენდებული ზომა 1200×750, WebP ან JPG"}
      - {label: "გალერეა", name: gallery, widget: list, required: false,
         field: {label: "ფოტო", name: img, widget: image}}
      - {label: "წლები", name: years, widget: string, hint: "მაგ. 2019–2023"}
      - {label: "ძრავი", name: engine, widget: string, hint: "მაგ. 2.5 hybrid / 2.0 petrol / 2.2 diesel"}
      - {label: "ტრანსმისია", name: transmission, widget: select, options: [automatic, manual]}
      - {label: "წამყვანი", name: drive, widget: select, options: [fwd, rwd, awd, 4wd]}
      - {label: "ადგილების რაოდენობა", name: seats, widget: number, value_type: int, min: 1, max: 20}
      - {label: "ჩემოდანი / მოცულობა", name: luggage, widget: string}
      - {label: "საწვავი / 100 კმ", name: fuel_100km, widget: string}
      - {label: "კლირენსი, მმ", name: clearance, widget: number, value_type: int, min: 80, max: 500}
      - {label: "ფასი 1–6 დღე, ₾", name: price_1_6, widget: number, value_type: int, min: 0,
         hint: "USD ავტომატურად გამოითვლება საიტის პარამეტრებში მითითებული კურსით და დამრგვალდება 10 დოლარამდე"}
      - {label: "ფასი 7–29 დღე, ₾", name: price_7_29, widget: number, value_type: int, min: 0}
      - {label: "ფასი 30+ დღე, ₾", name: price_30, widget: number, value_type: int, min: 0}
      - {label: "დეპოზიტი, ₾", name: deposit, widget: number, value_type: int, min: 0}
      - {label: "მოდელის სახელი", name: name, widget: string, i18n: true}
      - {label: "მოკლე აღწერა", name: summary, widget: string, i18n: true}
      - {label: "მახასიათებლები", name: features, widget: list, i18n: true,
         field: {label: "პუნქტი", name: f, widget: string}}
      - {label: "სრული აღწერა", name: body, widget: text, i18n: true, required: false}

  # ────────────────────────────────────────────────────────────── ბლოგი
  - name: posts
    label: "ბლოგი"
    label_singular: "სტატია"
    folder: content/posts
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    summary: "{{date}} — {{fields.ka.title}}"
    sortable_fields: [date]
    i18n: *i18n
    fields:
      - {label: "თარიღი", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {label: "სურათი", name: image, widget: image, required: false, hint: "1200×675"}
      - {label: "დრაფტი (არ გამოქვეყნდეს)", name: draft, widget: boolean, default: false, required: false}
      - *seo_title
      - *seo_desc
      - *seo_kw
      - {label: "შესავალი", name: lead, widget: text, i18n: true}
      - {label: "ტექსტი (Markdown)", name: body, widget: markdown, i18n: true}

  # ──────────────────────────────────────────────── ღირსშესანიშნაობები
  - name: attractions
    label: "ღირსშესანიშნაობები"
    label_singular: "ღირსშესანიშნაობა"
    folder: content/attractions
    extension: yml
    format: yaml
    create: true
    slug: "{{fields.en.name}}"
    summary: "{{fields.en.name}} — {{region}}"
    sortable_fields: [region, order, distance_tbilisi_km]
    i18n: *i18n
    fields:
      - {label: "სტატუსი", name: status, widget: select, default: draft,
         options: [{label: "მონახაზი", value: draft}, {label: "გამოქვეყნებული", value: published}, {label: "არქივი", value: archived}]}
      - label: "რეგიონი"
        name: region
        widget: relation
        collection: regions
        search_fields: [ka.name, en.name]
        value_field: "{{slug}}"
        display_fields: [ka.name]
      - label: "ტიპი"
        name: type
        widget: select
        options: [monastery, fortress, cave, canyon, waterfall, lake, mountain, nature,
                  town, museum, winery, spa, beach, ski, archaeology]
      - {label: "განედი (lat)", name: lat, widget: number, value_type: float,
         hint: "41.05–43.60 — რუკაზე ნიშნის ადგილი"}
      - {label: "გრძედი (lon)", name: lon, widget: number, value_type: float, hint: "39.95–46.75"}
      - {label: "სიმაღლე, მ", name: elevation, widget: number, value_type: int, default: 0}
      - {label: "UNESCO-ს ძეგლი", name: unesco, widget: boolean, default: false, required: false}
      - {label: "გამორჩეული", name: featured, widget: boolean, default: false, required: false}
      - {label: "რიგითობა რეგიონში", name: order, widget: number, value_type: int, default: 99}
      - {label: "მთავარი ფოტო", name: image, widget: image, required: false, hint: "1200×750"}
      - {label: "გალერეა", name: gallery, widget: list, required: false,
         field: {label: "ფოტო", name: img, widget: image}}
      - {label: "დათვალიერების დრო, სთ", name: visit_hours, widget: string, hint: "მაგ. 0.5, 1, 2, 4"}
      - {label: "საუკეთესო სეზონი", name: best_season, widget: select,
         options: [all, may-october, june-september, december-march]}
      - {label: "წელიწადში ღიაა", name: open_year_round, widget: boolean, default: true, required: false}
      - {label: "შესვლის საფასური", name: entry_fee, widget: string, hint: "free ან '15 ₾'"}
      - {label: "მანძილი თბილისიდან, კმ", name: distance_tbilisi_km, widget: number, value_type: int}
      - {label: "მართვის დრო თბილისიდან", name: drive_time_tbilisi, widget: string, hint: "H:MM, მაგ. 1:20"}
      - {label: "გზა", name: road, widget: select, options: [paved, mostly_paved, gravel, 4x4_only]}
      - {label: "საჭირო ავტომობილი", name: car_category, widget: select, options: [economy, suv, offroad]}
      - {label: "ახლომდებარე ობიექტები", name: nearby, widget: list, required: false,
         field: {label: "slug", name: s, widget: string}}
      - {label: "დასახელება", name: name, widget: string, i18n: true}
      - {label: "ერთი წინადადებით", name: short, widget: text, i18n: true}
      - {label: "სრული აღწერა", name: body, widget: text, i18n: true}
      - {label: "პრაქტიკული რჩევა", name: tip, widget: text, i18n: true}
      - {label: "მარშრუტი თბილისიდან", name: route, widget: text, i18n: true}

  # ────────────────────────────────────────────────────────── რეგიონები
  - name: regions
    label: "რეგიონები"
    label_singular: "რეგიონი"
    folder: content/regions
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    summary: "{{fields.ka.name}}"
    sortable_fields: [order]
    i18n: *i18n
    fields:
      - {label: "სტატუსი", name: status, widget: select, default: draft,
         options: [{label: "მონახაზი", value: draft}, {label: "გამოქვეყნებული", value: published}, {label: "არქივი", value: archived}]}
      - {label: "რიგითობა", name: order, widget: number, value_type: int}
      - {label: "რუკის ცენტრი — განედი", name: center_lat, widget: number, value_type: float}
      - {label: "რუკის ცენტრი — გრძედი", name: center_lon, widget: number, value_type: float}
      - {label: "რუკის მასშტაბი (zoom)", name: zoom, widget: number, value_type: int, default: 9}
      - {label: "ფერი რუკაზე", name: color, widget: color}
      - {label: "ფოტო", name: image, widget: image, required: false}
      - {label: "დასახელება", name: name, widget: string, i18n: true}
      - {label: "ერთი წინადადებით", name: short, widget: text, i18n: true}
      - {label: "აღწერა", name: body, widget: text, i18n: true}
      - {label: "მართვის პირობები", name: driving, widget: text, i18n: true}
      - {label: "ვისთვის გამოდგება", name: best_for, widget: list, i18n: true,
         field: {label: "პუნქტი", name: b, widget: string}}

  # ────────────────────────────────────────────────────────── მარშრუტები
  - name: routes
    label: "მარშრუტები"
    label_singular: "მარშრუტი"
    folder: content/routes
    extension: yml
    format: yaml
    create: true
    slug: "{{slug}}"
    summary: "{{fields.ka.name}} — {{days}} დღე"
    sortable_fields: [order, days, distance_km]
    i18n: *i18n
    fields:
      - {label: "სტატუსი", name: status, widget: select, default: draft,
         options: [{label: "მონახაზი", value: draft}, {label: "გამოქვეყნებული", value: published}, {label: "არქივი", value: archived}]}
      - {label: "რიგითობა", name: order, widget: number, value_type: int}
      - {label: "დღეები", name: days, widget: number, value_type: int}
      - {label: "ღამეები", name: nights, widget: number, value_type: int}
      - {label: "სულ მანძილი, კმ", name: distance_km, widget: number, value_type: int}
      - {label: "სულ მართვაში", name: drive_time_total, widget: string, hint: "მაგ. 9:30"}
      - {label: "საჭირო ავტომობილი", name: car_category, widget: select, options: [economy, suv, offroad]}
      - {label: "სეზონი", name: best_season, widget: select,
         options: [all, may-october, june-september, december-march]}
      - {label: "სირთულე", name: difficulty, widget: select, options: [easy, moderate, hard]}
      - {label: "ფოტო", name: image, widget: image, required: false}
      - label: "ობიექტები (რიგის მიხედვით)"
        name: waypoints
        widget: list
        field:
          label: "ღირსშესანიშნაობა"
          name: w
          widget: relation
          collection: attractions
          search_fields: [ka.name, en.name]
          value_field: "{{slug}}"
          display_fields: [ka.name]
      - label: "ხაზი რუკაზე (კოორდინატები)"
        name: polyline
        widget: list
        hint: "თითო წერტილი — [განედი, გრძედი]. რედაქტირება მხოლოდ საჭიროებისას."
        field: {label: "წერტილი", name: pt, widget: list, field: {label: "მნიშვნელობა", name: v, widget: number, value_type: float}}
      - {label: "დასახელება", name: name, widget: string, i18n: true}
      - {label: "ერთი წინადადებით", name: short, widget: text, i18n: true}
      - {label: "აღწერა", name: body, widget: text, i18n: true}
      - {label: "დღეების გეგმა", name: plan, widget: markdown, i18n: true}
      - {label: "რჩევები", name: tips, widget: list, i18n: true,
         field: {label: "რჩევა", name: t, widget: string}}

  # ────────────────────────────────────────────────────── საიტის პარამეტრები
  - name: settings
    label: "პარამეტრები"
    files:
      - name: site
        label: "საიტი და კონტაქტები"
        file: content/settings/site.yml
        fields:
          - {label: "დომენი", name: site_url, widget: string, hint: "მაგ. https://www.archirent.ge — ბოლოში / გარეშე"}
          - {label: "ბრენდი (ლათინურად)", name: rental_brand, widget: string}
          - {label: "ბრენდი (ქართულად)", name: rental_brand_ka, widget: string}
          - {label: "პროგრამის სახელი", name: software_brand, widget: string}
          - {label: "ტელეფონი", name: phone, widget: string}
          - {label: "ტელეფონი (E.164)", name: phone_e164, widget: string, hint: "მაგ. +995322000000"}
          - {label: "მობილური", name: mobile, widget: string}
          - {label: "მობილური (E.164)", name: mobile_e164, widget: string}
          - {label: "ელფოსტა", name: email, widget: string}
          - {label: "ელფოსტა (პროგრამა)", name: software_email, widget: string}
          - {label: "საფოსტო ინდექსი", name: address_zip, widget: string}
          - {label: "განედი", name: geo_lat, widget: string}
          - {label: "გრძედი", name: geo_lon, widget: string}
          - {label: "დაარსების წელი", name: founded, widget: string}
          - {label: "ავტოპარკის ზომა", name: fleet_size, widget: string}
          - {label: "USD კურსი", name: usd_rate, widget: number, value_type: float, min: 0.01,
             hint: "GEL იყოფა ამ კურსზე; მიღებული USD ავტომატურად მრგვალდება ქვემოთ მითითებულ ბიჯზე"}
          - {label: "USD დამრგვალების ბიჯი", name: usd_rounding, widget: number, value_type: int, min: 1, default: 10}
          - {label: "გახსნის დრო", name: opens, widget: string}
          - {label: "დახურვის დრო", name: closes, widget: string}
