# ═══════════════════════════════════════════════════════════════════════
#  Netlify — Fleet House. საიტს თავად Netlify აწყობს content/*.yml-იდან.
# ═══════════════════════════════════════════════════════════════════════
[build]
  command = "pip install -r requirements.txt && python3 build.py dist"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/planner/"
  to = "/map/#planner"
  status = 301

[[redirects]]
  from = "/:lang/planner/"
  to = "/:lang/map/#planner"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
