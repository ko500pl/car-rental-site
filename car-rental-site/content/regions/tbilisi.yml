ka:
  name: თბილისი
  short: >-
    საქართველოს დედაქალაქი მტკვრის ვიწრო ხეობაში — ძველი ქალაქი, გოგირდის აბანოები და თითქმის ყველა მარშრუტის
    საწყისი წერტილი.
  body: >-
    თბილისი მტკვრის ორივე ნაპირზე, ვიწრო ხეობაშია გაშენებული და ტყიან ქედებს შორისაა მოქცეული — სწორედ
    ეს რელიეფი ხსნის ქალაქის ხასიათს. ისტორიული ცენტრი იმდენად კომპაქტურია, რომ ფეხით მოიარება: ნარიყალას
    ციხე ქედზე, ქვემოთ აბანოთუბანი გოგირდის აბანოების აგურის გუმბათებით, და რამდენიმე ასეულ მეტრში ერთმანეთისგან
    მეჩეთი, სინაგოგა და სომხური ეკლესია.


    მეორე დღე ქალაქს უფრო ფართოდ ხსნის. მთაწმინდის ფუნიკულიორი პარკამდე და ქალაქის თავზე გაშლილ ტერასამდე
    აჰყავს მგზავრი. საქართველოს ეროვნული მუზეუმი რუსთაველზე კოლხური ოქროს განძსა და საბჭოთა ოკუპაციის
    მუდმივ ექსპოზიციას აჩვენებს. წმინდა სამების საკათედრო ტაძარი — უზარმაზარი და თანამედროვე — ავლაბრის
    ზემოთ დგას. ქალაქის მწვანე კიდეზე კუს ტბა და ეთნოგრაფიული ღია ცის ქვეშ მუზეუმია, სადაც საქართველოს
    ყველა კუთხიდან ჩამოტანილი ხის სახლებია აწყობილი, ჩრდილოეთით კი, თბილისის ზღვის ზემოთ, საქართველოს
    ისტორიის მემორიალის სვეტები დგას.


    სეზონურობა აქ ნაკლებად მნიშვნელოვანია, ვიდრე ქვეყნის სხვა კუთხეში: ყველაფერი მთელი წელი ღიაა. ივლისი
    და აგვისტო მძიმეა — ხეობა სიცხეს იჭერს — და დათვალიერება დილითა და საღამოს ჯობს. გაზაფხული და შემოდგომა
    საუკეთესო თვეებია, ზამთარი რბილია და თოვლი დიდხანს არ ჩერდება.


    ცენტრისთვის ორი დღეა საკმარისი, სამი — უფრო კომფორტული, თუ აბანოც გინდა, მუზეუმიც და უჩქარო საღამოც.
    სტუმრების უმეტესობა თბილისს ბაზადაც იყენებს: მცხეთა ნახევარ საათშია, გორი ერთ საათზე ცოტა მეტში, კახეთი
    ორზე ნაკლებში, ხოლო აეროპორტი ცენტრიდან ოც წუთში. სწორედ ამიტომ თბილისი ერთდროულად დანიშნულების ადგილიცაა
    და ის წერტილიც, სადაც ქართული საავტომობილო მარშრუტი იწყება და მთავრდება.
  driving: >-
    თბილისში მართვა მოგზაურობის ყველაზე ნაკლებად სასიამოვნო ნაწილია. მოძრაობა მკვრივია, ზოლების დისციპლინა
    სუსტი, მიკროავტობუსი იქ ჩერდება, სადაც მგზავრი ხელს აქნევს, და გადაადგილება ზოლიდან ზოლში ხშირად უჩვენებლოდ
    ხდება. სახიფათო ეს არაა, მაგრამ მოთმინებას მოითხოვს და არა თავდაჯერებულობას. ქალაქში ზღვარი 50 კმ/სთ-ია,
    მთავარ გამზირებზე კამერები ბევრია, პიკის საათებია დაახლოებით 08:30–10:00 და 17:30–19:30.


    ნამდვილი პრობლემა პარკირებაა. ცენტრალურ უბნებში ქუჩის პარკირება ზონალური და ფასიანია, კონტროლი კამერებით
    ხდება, აბანოთუბნისა და ძველი ქალაქის მიდამოებში კი ადგილი პრაქტიკულად არაა. სჯობს ფასიანი სადგომი
    ან სავაჭრო ცენტრის მიწისქვეშა პარკინგი და შემდეგ ფეხით სიარული. ძველი ქუჩები ვიწრო, ციცაბო და ხშირად
    ცალმხრივია — დიდი მანქანა აქ ტვირთია. ქალაქისთვის და მისგან გამავალი მაგისტრალებისთვის ეკონომ კლასი
    სავსებით საკმარისია.
  best_for:
  - ორდღიანი გაცნობა გამგზავრებამდე
  - ბაზა ერთდღიანი გასვლებისთვის — მცხეთა, გორი, კახეთი
  - გოგირდის აბანოები, აივნები და ღვინის ბარები
  - მანქანის აღება და ჩაბარება მოგზაურობის ბოლოს
en:
  name: Tbilisi
  short: >-
    Georgia's capital in a narrow valley on the Mtkvari — old town, sulphur baths and the starting point
    of almost every route.
  body: >-
    Tbilisi sits on both banks of the Mtkvari in a narrow valley, hemmed in by wooded ridges, and that
    shape explains most of the city. The historic centre is small enough to walk: Narikala Fortress on
    the ridge above, the brick domes of the Abanotubani sulphur baths in the gorge below, and within a
    few hundred metres of one another a mosque, a synagogue and an Armenian church.


    A second day opens the city up. The Mtatsminda funicular climbs to a park and a terrace high above
    the rooftops. The Georgian National Museum on Rustaveli holds the gold of the Colchian burials and
    the permanent exhibition on the Soviet occupation. Holy Trinity Cathedral, huge and modern, stands
    over Avlabari on the opposite bank. On the green edge of town, Turtle Lake sits beside the Open Air
    Museum of Ethnography, where timber houses brought from every province are reassembled among the trees,
    and further north the columns of the Chronicle of Georgia rise above the Tbilisi Sea.


    Seasons matter less here than anywhere else in the country, since everything is open year-round. July
    and August are heavy — the valley traps heat and the afternoons drag — so sightseeing works best early
    and late in the day. Spring and autumn are the good months. Winter is mild and snow rarely lasts more
    than a day or two.


    Two days cover the centre comfortably, three if you want a bathhouse, a museum and an unhurried evening.
    Most visitors also treat Tbilisi as a base: Mtskheta is half an hour out, Gori a little over an hour,
    Kakheti under two. It is both a destination and the place where a Georgian road trip begins and ends.
  driving: >-
    Driving in Tbilisi is the least enjoyable part of a Georgian trip. Traffic is dense, lane discipline
    is loose, minibuses stop wherever a passenger waves, and cars change lanes with little warning. None
    of it is dangerous at city speeds, but it rewards patience rather than assertion. The urban limit
    is 50 km/h, speed cameras are common on the main avenues, and the rush hours run roughly 08:30–10:00
    and 17:30–19:30.


    Parking is the real problem. Street parking in the central districts is zonal and paid, enforced by
    patrol cameras, and around Abanotubani and the Old Town there is effectively none. Use a paid lot
    or a shopping-centre garage and walk in. The old lanes are narrow, steep and frequently one-way, so
    a large car becomes a liability. An economy model handles the city and the highways out of it; see
    the [fleet](/fleet/) if the mountains come later.
  best_for:
  - Two days of city walking before heading out
  - A base for day trips to Mtskheta, Gori and Kakheti
  - Sulphur baths, carved balconies and wine bars
  - Collecting or returning a rental car
ru:
  name: Тбилиси
  short: Столица Грузии в узкой долине Куры — старый город, серные бани и отправная точка почти любого
    маршрута.
  body: >-
    Тбилиси лежит на обоих берегах Куры в узкой долине, зажатой лесистыми хребтами, и этот рельеф во многом
    объясняет характер города. Исторический центр можно обойти пешком: крепость Нарикала на гребне, внизу
    Абанотубани с кирпичными куполами серных бань, а в паре сотен метров друг от друга — мечеть, синагога
    и армянская церковь.


    Второй день раскрывает город шире. Фуникулёр Мтацминда поднимает к парку и террасе высоко над крышами.
    Национальный музей Грузии на Руставели показывает золото колхидских погребений и постоянную экспозицию
    о советской оккупации. Кафедральный собор Святой Троицы, огромный и современный, стоит над Авлабари
    на другом берегу. На зелёной окраине — Черепашье озеро и Этнографический музей под открытым небом,
    где среди деревьев собраны деревянные дома из всех уголков страны, а севернее, над Тбилисским морем,
    поднимаются колонны Хроники Грузии.


    Сезон здесь значит меньше, чем где-либо в Грузии: всё работает круглый год. Июль и август тяжёлые
    — долина держит жару, и днём город замирает, — поэтому осматривать его лучше утром и вечером. Весна
    и осень оптимальны, зима мягкая, снег держится редко дольше одного-двух дней.


    На центр достаточно двух дней, три — комфортнее, если хочется и бани, и музея, и неспешного вечера.
    Большинство гостей используют Тбилиси ещё и как базу: Мцхета в получасе, Гори чуть больше часа, Кахетия
    менее чем в двух.
  driving: >-
    Вождение в Тбилиси — наименее приятная часть поездки по Грузии. Поток плотный, дисциплина рядности
    слабая, маршрутки останавливаются там, где им махнули рукой, перестроения происходят почти без предупреждения.
    Опасного в этом мало, но требуется терпение, а не напор. В городе действует ограничение 50 км/ч, на
    главных проспектах много камер, часы пик — примерно 08:30–10:00 и 17:30–19:30.


    Настоящая проблема — парковка. В центральных районах она зональная и платная, контролируется патрульными
    камерами, а у Абанотубани и в Старом городе мест практически нет. Разумнее оставить машину на платной
    стоянке или в подземном паркинге торгового центра и идти пешком. Старые улицы узкие, крутые и часто
    односторонние — крупный автомобиль здесь только мешает. Для города и выездных магистралей вполне хватает
    машины эконом-класса.
  best_for:
  - Два дня знакомства с городом перед выездом
  - 'База для однодневных поездок: Мцхета, Гори, Кахетия'
  - Серные бани, резные балконы и винные бары
  - Получение и возврат арендованной машины
fa:
  name: تفلیس
  short: پایتخت گرجستان در دره‌ای باریک بر کرانهٔ متکواری — شهر قدیم، حمام‌های گوگردی و نقطهٔ آغاز تقریباً
    هر مسیر.
  body: >-
    تفلیس روی دو کرانهٔ متکواری در دره‌ای باریک نشسته است، میان ستیغ‌های جنگلی محصور، و همین شکل، بیشتر
    ویژگی‌های شهر را توضیح می‌دهد. مرکز تاریخی آن‌قدر جمع‌وجور است که پیاده گشتنی باشد: قلعهٔ ناریکالا
    بر فراز ستیغ، گنبدهای آجری حمام‌های گوگردی آبانوتوبانی در دل دره، و در فاصلهٔ چند صد متری از یکدیگر
    یک مسجد، یک کنیسه و یک کلیسای ارمنی.

    روز دوم شهر را باز می‌کند. فونیکولار متاتسمیندا تا پارک و مهتابی بلندی بالای بام‌ها می‌رود. موزهٔ
    ملی گرجستان در خیابان روستاولی طلای گورهای کلخی و نمایشگاه دائمی اشغال شوروی را نگه داشته است. کلیسای
    جامع تثلیث مقدس، بزرگ و مدرن، بر محلهٔ آولاباری در کرانهٔ مقابل مشرف است. در حاشیهٔ سبز شهر، دریاچهٔ
    لاک‌پشت کنار موزهٔ روباز مردم‌شناسی قرار دارد، جایی که خانه‌های چوبی آورده‌شده از همهٔ استان‌ها میان
    درختان دوباره برپا شده‌اند، و شمال‌تر ستون‌های «تواریخ گرجستان» بالای دریای تفلیس سر برافراشته‌اند.

    فصل‌ها اینجا کمتر از هر جای دیگر کشور اهمیت دارند، چون همه چیز تمام سال باز است. ژوئیه و اوت سنگین‌اند
    — دره گرما را در خود نگه می‌دارد و بعدازظهرها کش می‌آیند — بنابراین گشت‌وگذار در اول و آخر روز بهتر
    جواب می‌دهد. بهار و پاییز ماه‌های خوب‌اند. زمستان ملایم است و برف به‌ندرت بیش از یکی دو روز می‌ماند.

    دو روز مرکز شهر را به‌راحتی پوشش می‌دهد، و سه روز اگر حمام، موزه و یک شب بی‌عجله بخواهید. بیشتر مسافران
    تفلیس را پایگاه هم قرار می‌دهند: متسختا نیم ساعت، گوری کمی بیش از یک ساعت و کاختی کمتر از دو ساعت
    فاصله دارد. تفلیس هم مقصد است و هم جایی که سفر جاده‌ای گرجستان از آن آغاز می‌شود و به آن پایان می‌یابد.
  driving: >-
    رانندگی در تفلیس کم‌لذت‌ترین بخش سفر به گرجستان است. ترافیک سنگین است، رعایت خط عبور سست است، مینی‌بوس‌ها
    هر جا که مسافری دست تکان دهد می‌ایستند و خودروها بدون هشدار خط عوض می‌کنند. هیچ‌کدام در سرعت شهری
    خطرناک نیست، اما اینجا صبر جواب می‌دهد نه قاطعیت. محدودیت سرعت درون‌شهری 50 کیلومتر بر ساعت است، دوربین‌های
    کنترل سرعت در خیابان‌های اصلی فراوان‌اند و ساعات اوج ترافیک تقریباً 08:30 تا 10:00 و 17:30 تا 19:30
    است.

    مشکل واقعی پارکینگ است. پارک خیابانی در محله‌های مرکزی منطقه‌بندی‌شده و پولی است و با دوربین‌های گشتی
    کنترل می‌شود، و در اطراف آبانوتوبانی و شهر قدیم عملاً جایی برای پارک نیست. خودرو را در پارکینگ پولی
    یا گاراژ یک مرکز خرید بگذارید و پیاده بروید. کوچه‌های قدیمی باریک، شیب‌دار و اغلب یک‌طرفه‌اند، پس
    خودروی بزرگ اینجا دردسر است. یک مدل اقتصادی از پس شهر و بزرگراه‌های خروجی آن برمی‌آید؛ اگر بعداً کوهستان
    در برنامه است، [ناوگان](/fleet/) را ببینید.
  best_for:
  - دو روز پیاده‌روی در شهر پیش از راه افتادن
  - پایگاهی برای سفرهای یک‌روزه به متسختا، گوری و کاختی
  - حمام‌های گوگردی، بالکن‌های چوبی کنده‌کاری‌شده و بارهای شراب
  - تحویل گرفتن یا بازگرداندن خودروی کرایه‌ای
he:
  name: טביליסי
  short: בירת גאורגיה בעמק צר על גדות המטקווארי — העיר העתיקה, מרחצאות הגופרית ונקודת המוצא של כמעט כל
    מסלול.
  body: >-
    טביליסי יושבת על שתי גדות המטקווארי בעמק צר, כלואה בין רכסים מיוערים, והצורה הזאת מסבירה את רוב מה
    שקורה בעיר. המרכז ההיסטורי קטן דיו כדי לחצות אותו ברגל: מבצר נריקלה על הרכס שמעל, כיפות הלבנים של
    מרחצאות הגופרית באבאנוטובני למטה בערוץ, ובמרחק כמה מאות מטרים זה מזה מסגד, בית כנסת וכנסייה ארמנית.

    יום שני פותח את העיר. הפוניקולר של מטאצמינדה מטפס אל פארק ואל מרפסת תצפית גבוה מעל הגגות. המוזיאון
    הלאומי הגאורגי ברחוב רוסתאוולי מחזיק את זהב קברי קולכיס ואת התערוכה הקבועה על הכיבוש הסובייטי. קתדרלת
    השילוש הקדוש, ענקית ומודרנית, נישאת מעל שכונת אוולבארי בגדה הנגדית. בקצה הירוק של העיר שוכן אגם הצבים
    לצד מוזיאון האתנוגרפיה הפתוח, שבו הורכבו מחדש בין העצים בתי עץ שהובאו מכל מחוזות המדינה, וצפונה משם
    מתנשאים עמודי הכרוניקה של גאורגיה מעל ים טביליסי.

    העונות חשובות כאן פחות מבכל מקום אחר במדינה, כי הכול פתוח כל השנה. יולי ואוגוסט כבדים — העמק לוכד
    את החום ואחר הצהריים נמשך לאין סוף — ולכן עדיף לסייר מוקדם בבוקר ולקראת ערב. האביב והסתיו הם החודשים
    הטובים. החורף מתון והשלג נדיר ואינו מחזיק יותר מיום או יומיים.

    יומיים מכסים את המרכז בנוחות, שלושה אם רוצים גם מרחץ, גם מוזיאון וגם ערב ללא לחץ. רוב המבקרים מתייחסים
    לטביליסי גם כאל בסיס: מצחתה במרחק חצי שעה, גורי קצת יותר משעה, וקחתי פחות משעתיים. זהו גם יעד בפני
    עצמו וגם המקום שבו מסע הכביש הגאורגי מתחיל ומסתיים.
  driving: >-
    הנהיגה בטביליסי היא החלק הפחות מהנה בטיול בגאורגיה. התנועה צפופה, המשמעת בנתיבים רופפת, מוניות השירות
    עוצרות בכל מקום שבו נוסע מנופף, ומכוניות מחליפות נתיב כמעט בלי התראה. שום דבר מזה אינו מסוכן במהירויות
    עירוניות, אבל זה דורש סבלנות ולא נחישות. המהירות המותרת בעיר היא 50 קמ״ש, מצלמות מהירות נפוצות בשדרות
    הראשיות, ושעות העומס הן בערך 08:30–10:00 ו-17:30–19:30.

    החניה היא הבעיה האמיתית. החניה ברחובות המרכז מחולקת לאזורים, היא בתשלום ונאכפת במצלמות סיור, ובסביבות
    אבאנוטובני והעיר העתיקה כמעט אין חניה בכלל. השאירו את הרכב בחניון בתשלום או במרתף של קניון ולכו ברגל.
    הסמטאות הישנות צרות, תלולות ולעיתים קרובות חד-סטריות, ולכן רכב גדול הופך לנטל. דגם חסכוני מתמודד היטב
    עם העיר ועם הכבישים המהירים היוצאים ממנה; אם ההרים מגיעים בהמשך, הציצו ב[צי הרכבים](/fleet/).
  best_for:
  - יומיים של הליכה בעיר לפני היציאה לדרך
  - בסיס לטיולי יום למצחתה, לגורי ולקחתי
  - מרחצאות גופרית, מרפסות עץ מגולפות וברי יין
  - איסוף או החזרה של רכב שכור
ar:
  name: تبليسي
  short: عاصمة جورجيا في وادٍ ضيق على نهر متكفاري — المدينة القديمة وحمامات الكبريت ونقطة انطلاق كل مسار
    تقريباً.
  body: >-
    تقع تبليسي على ضفتي نهر متكفاري في وادٍ ضيق تحصره تلال مكسوة بالغابات، وهذا الشكل يفسر معظم ملامح
    المدينة. المركز التاريخي صغير بما يكفي لقطعه سيراً على الأقدام: قلعة ناريكالا على الحافة العلوية،
    وقباب الآجر لحمامات الكبريت في أبانوتوباني أسفل الوادي، وعلى بعد بضع مئات من الأمتار من بعضها مسجد
    وكنيس وكنيسة أرمنية.

    اليوم الثاني يفتح المدينة أكثر. يصعد قطار متاتسميندا المائل إلى حديقة وشرفة تطل من عل على السطوح.
    ويضم المتحف الوطني الجورجي في شارع روستافيلي ذهب مدافن كولخيس والمعرض الدائم عن الاحتلال السوفييتي.
    وتقف كاتدرائية الثالوث المقدس، الضخمة والحديثة، فوق حي أفلاباري على الضفة المقابلة. وعند الطرف الأخضر
    للمدينة تجد بحيرة السلاحف إلى جوار متحف الإثنوغرافيا المفتوح، حيث أُعيد تركيب بيوت خشبية جُلبت من
    كل الأقاليم بين الأشجار، وإلى الشمال ترتفع أعمدة «سجل جورجيا» فوق بحر تبليسي.

    المواسم أقل أهمية هنا منها في أي مكان آخر في البلاد، فكل شيء مفتوح طوال العام. يوليو وأغسطس ثقيلان
    — يحبس الوادي الحرارة وتطول فترة ما بعد الظهر — ولذلك تكون الجولات أفضل في أول النهار وآخره. الربيع
    والخريف هما أفضل الفصول هنا. والشتاء معتدل ونادراً ما يبقى الثلج أكثر من يوم أو يومين.

    يومان يغطيان المركز براحة، وثلاثة إن أردت حماماً ومتحفاً وأمسية بلا عجلة. ومعظم الزوار يتخذون تبليسي
    قاعدة أيضاً: متسخيتا على بعد نصف ساعة، وغوري أكثر قليلاً من ساعة، وكاخيتي أقل من ساعتين. فهي وجهة
    بحد ذاتها، وهي المكان الذي تبدأ منه رحلة الطريق الجورجية وتنتهي إليه.
  driving: >-
    القيادة داخل تبليسي أقل أجزاء الرحلة الجورجية متعة. الازدحام شديد، والالتزام بالمسارب ضعيف، وحافلات
    النقل الصغيرة تتوقف حيثما لوّح راكب، والسيارات تغيّر مسربها من دون إنذار يُذكر. لا شيء من ذلك خطير
    عند السرعات المدينية، لكنه يكافئ الصبر لا الحزم. الحد الأقصى داخل المدينة 50 كم/س، وكاميرات السرعة
    منتشرة على الجادات الرئيسية، وساعات الذروة تقع تقريباً بين 08:30 و10:00 وبين 17:30 و19:30.

    المشكلة الحقيقية هي وقوف السيارات. الوقوف في شوارع الأحياء المركزية مقسّم إلى مناطق ومدفوع وتراقبه
    كاميرات الدوريات، وحول أبانوتوباني والمدينة القديمة لا تكاد تجد مكاناً على الإطلاق. اترك السيارة في
    موقف مدفوع أو في مرآب مركز تجاري وامشِ. أزقة المدينة القديمة ضيقة وشديدة الانحدار وكثير منها باتجاه
    واحد، ولذلك تصبح السيارة الكبيرة عبئاً. سيارة اقتصادية تكفي للمدينة وللطرق السريعة الخارجة منها؛ وإن
    كانت الجبال في برنامجك لاحقاً فراجع [أسطولنا](/fleet/).
  best_for:
  - يومان من التجول سيراً في المدينة قبل الانطلاق
  - قاعدة لرحلات يومية إلى متسخيتا وغوري وكاخيتي
  - حمامات الكبريت والشرفات الخشبية المنقوشة وبارات النبيذ
  - استلام سيارة الإيجار أو إعادتها
