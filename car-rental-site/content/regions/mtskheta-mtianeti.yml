ka:
  name: მცხეთა-მთიანეთი
  short: ძველი დედაქალაქი მცხეთა და საქართველოს სამხედრო გზა ყაზბეგისკენ — ისტორია და მაღალმთიანი პეიზაჟი
    ერთ ღერძზე.
  body: >-
    მცხეთა-მთიანეთი თბილისიდან ჩრდილოეთით იწყება და კავკასიონის მთავარ ქედამდე აღწევს. სამხრეთი ნაწილი
    დაბალი და ისტორიულია: მცხეთა, საქართველოს პირველი დედაქალაქი, სვეტიცხოვლის საკათედრო ტაძრით, და მის
    ზემოთ, კლდის თხემზე, ჯვრის მონასტერი, საიდანაც არაგვისა და მტკვრის შერწყმა მთელი სიგრძით ჩანს. ორივე
    ძეგლი იუნესკოს სიაშია და თბილისიდან ნახევარ საათშია.


    ჩრდილოეთით საქართველოს სამხედრო გზა იწყება — ქვეყნის ყველაზე ცნობილი მარშრუტი. ჟინვალის ზურმუხტისფერი
    წყალსაცავი, მის ნაპირზე ანანურის ციხე-კომპლექსი, შემდეგ თანდათანობითი ასვლა გუდაურამდე, სადაც ზამთარში
    სათხილამურო კურორტია, ზაფხულში კი მეგობრობის მონუმენტი და ჯვრის უღელტეხილი 2379 მეტრზე. ქედის იქით
    ყაზბეგია: სტეფანწმინდა, გერგეტის სამების ეკლესია 2170 მეტრზე მყინვარწვერის ფონზე, დარიალის ხეობა და
    გველეთის ჩანჩქერები.


    გვერდით ხეობებში სულ სხვა სამყაროა. თრუსოს ხეობა მინერალური წყაროებითა და ჟანგისფერი ტრავერტინებით
    ხევის დასავლეთით იშლება და ერთ-ერთი ყველაზე უჩვეულო პეიზაჟია მთელ კავკასიონზე. ხევსურეთში კი შატილი
    დგას — ქვის კოშკებად შეკრული სოფელი ჩრდილოეთ საზღვართან, რომელიც ერთდროულად სოფელიცაა და ციხე-სიმაგრეც.
    ორივე მიმართულება მოკლე, მაგრამ მოთხოვნადი ერთდღიანი მარშრუტია და კარგ ამინდს საჭიროებს.


    სეზონურობა მკვეთრია და მარშრუტსაც ის კარნახობს. მცხეთა, ანანური და ჟინვალი მთელი წელი მისაწვდომია
    და თბილისიდან ერთ დღეში მშვიდად ლაგდება; გუდაური დეკემბრიდან მარტამდე მუშაობს თხილამურებისთვის და
    ზაფხულში პარაპლანისა და ველოსიპედის ადგილია; თრუსო და შატილი კი რეალურად ივნისიდან სექტემბრამდეა ღია.
    მცხეთას ნახევარი დღე ეყოფა, ყაზბეგს — სრული დღე, უმჯობესია ღამის გათევით სტეფანწმინდაში, რადგან დილის
    სინათლეში მყინვარწვერი ბევრად უკეთ ჩანს, ვიდრე შუადღის ნისლში.
  driving: >-
    სამხედრო გზა (S3) მთლიანად ასფალტიანია, მაგრამ ეს მთის მაგისტრალია და ამინდზეა დამოკიდებული. გუდაურსა
    და კობს შორის მონაკვეთი ზამთარში ზვავსაშიშია და ძლიერი თოვლის დროს პოლიცია მას საათებით ან დღეებით
    კეტავს; ნოემბრიდან მარტამდე ზამთრის საბურავები აუცილებელია, ჯაჭვი კი — სასურველი. დარიალის მიმართულებით
    ხშირად დგას სატვირთოების რიგი, რომელიც ვიწრო მონაკვეთებზე გასწრებას ართულებს.


    გერგეტის ეკლესიამდე ბოლო ექვსი კილომეტრი ციცაბო და დაზიანებულია — საჭიროა მაღალი კლირენსი ან ადგილობრივი
    ჯიპი. თრუსოსა და შატილის გზები გრუნტოვანია და მხოლოდ 4x4-ისთვისაა; დათვისჯვრის უღელტეხილი შატილისკენ
    დაახლოებით ივნისიდან ოქტომბრამდეა ღია. საწვავი აავსე ფასანაურში ან გუდაურში. ტიპური შეცდომაა ყაზბეგში
    ერთ დღეში ჩასვლა-დაბრუნება ზამთარში, სიბნელეში, უღელტეხილზე გადასვლით — [ავტოპარკში](/fleet/) მთისთვის
    უკეთესი ვარიანტებია.
  best_for:
  - ნახევარი დღე მცხეთაში — სვეტიცხოველი და ჯვარი
  - ორდღიანი გასვლა ყაზბეგში ღამის გათევით
  - ზამთრის თხილამურები გუდაურში
  - ჯიპ-მარშრუტები თრუსოსა და შატილში ზაფხულში
en:
  name: Mtskheta-Mtianeti
  short: >-
    The ancient capital Mtskheta and the Georgian Military Highway to Kazbegi — history and high mountains
    on one axis.
  body: >-
    Mtskheta-Mtianeti starts immediately north of Tbilisi and runs up to the main ridge of the Caucasus.
    Its southern end is low and historic: Mtskheta, Georgia's first capital, with Svetitskhoveli Cathedral
    in the middle of town, and above it on a rock spur the Jvari Monastery, looking down on the confluence
    of the Aragvi and the Mtkvari. Both are UNESCO-listed and both are half an hour from the capital.


    North of that begins the Georgian Military Highway, the country's most famous drive. The green water
    of the Zhinvali Reservoir, the fortified complex of Ananuri on its shore, then a long climb to Gudauri
    — a ski resort in winter, and in summer the way to the Russia-Georgia Friendship Monument and the
    Jvari Pass at 2,379 metres. Beyond the watershed lies Kazbegi: the town of Stepantsminda, Gergeti
    Trinity Church at 2,170 metres against the cone of Mount Kazbek, the Dariali Gorge and the Gveleti
    waterfalls.


    The side valleys are a different world again. Truso opens west of the highway with mineral springs
    and rust-coloured travertine terraces. In Khevsureti, Shatili is a village built as a single mass
    of stone towers near the northern border, reached over a high unpaved pass.


    Seasonality is sharp. Mtskheta, Ananuri and Zhinvali are open all year; Gudauri runs from December
    to March for skiing; Truso and Shatili are realistically June to September. Half a day covers Mtskheta,
    a full day gets you to Kazbegi, and a night in Stepantsminda makes it far better.
  driving: >-
    The Military Highway (S3) is paved for its whole length, but it is a mountain road and behaves like
    one. The stretch between Gudauri and Kobi is avalanche-prone, and in heavy snow the police close it
    for hours or days at a time; winter tyres are required from November to March and chains are worth
    carrying. Queues of freight lorries heading for the Dariali border crossing are common and make overtaking
    awkward on the narrow sections.


    The last six kilometres up to Gergeti Trinity are steep and badly broken — you need real ground clearance
    or one of the local jeeps. Truso and Shatili are unpaved and 4x4 only; the Datvisjvari Pass towards
    Shatili is usually open from June to October. Fill up in Pasanauri or Gudauri. The classic mistake
    is attempting Kazbegi as a winter day return and crossing the pass in the dark.
  best_for:
  - Half a day in Mtskheta for Svetitskhoveli and Jvari
  - A two-day run to Kazbegi with an overnight stop
  - Skiing at Gudauri between December and March
  - Summer 4x4 trips into Truso and Khevsureti
ru:
  name: Мцхета-Мтианети
  short: Древняя столица Мцхета и Военно-Грузинская дорога к Казбеги — история и высокогорье на одной
    оси.
  body: >-
    Мцхета-Мтианети начинается сразу к северу от Тбилиси и доходит до Главного Кавказского хребта. Южная
    часть низкая и историческая: Мцхета, первая столица Грузии, с собором Светицховели в центре города,
    а над ней на скальном отроге — монастырь Джвари, откуда виден слив Арагви и Куры. Оба памятника входят
    в список ЮНЕСКО и находятся в получасе от столицы.


    Дальше на север начинается Военно-Грузинская дорога, самый известный маршрут страны. Зелёная вода
    Жинвальского водохранилища, крепость Ананури на его берегу, затем долгий подъём к Гудаури — зимой
    это горнолыжный курорт, летом отсюда едут к монументу Дружбы и Крестовому перевалу на 2379 метрах.
    За водоразделом лежит Казбеги: посёлок Степанцминда, церковь Святой Троицы в Гергети на 2170 метрах
    на фоне конуса Казбека, Дарьяльское ущелье и водопады Гвелети.


    Боковые ущелья — совсем другой мир. Трусо уходит на запад от трассы, с минеральными источниками и
    ржаво-рыжими травертинами. В Хевсуретии стоит Шатили — село, собранное в единый массив каменных башен
    у северной границы.


    Сезонность резкая. Мцхета, Ананури и Жинвали доступны круглый год; Гудаури работает с декабря по март;
    Трусо и Шатили реально открыты с июня по сентябрь. На Мцхету хватит половины дня, на Казбеги нужен
    полный день, а лучше — с ночёвкой в Степанцминде.
  driving: >-
    Военно-Грузинская дорога (S3) асфальтирована на всём протяжении, но это горная трасса со всеми вытекающими.
    Участок между Гудаури и Коби лавиноопасен: при сильном снегопаде полиция закрывает его на часы, иногда
    на сутки. С ноября по март обязательна зимняя резина, цепи стоит возить с собой. К Дарьяли часто выстраивается
    очередь фур, и на узких отрезках обгон становится неприятным.


    Последние шесть километров к Гергетской церкви — крутой разбитый подъём, нужен реальный клиренс или
    местный джип. Дороги в Трусо и Шатили грунтовые, только для 4x4; перевал Датвисджвари в сторону Шатили
    обычно открыт с июня по октябрь. Заправляйтесь в Пасанаури или Гудаури. Типичная ошибка — ехать в
    Казбеги зимой одним днём и возвращаться через перевал в темноте.
  best_for:
  - 'Полдня в Мцхете: Светицховели и Джвари'
  - Двухдневная поездка в Казбеги с ночёвкой
  - Горные лыжи в Гудаури с декабря по март
  - Летние джип-выезды в Трусо и Хевсуретию
fa:
  name: متسختا-متیانتی
  short: پایتخت باستانی متسختا و بزرگراه نظامی گرجستان تا کازبگی — تاریخ و کوهستان بلند روی یک محور.
  body: >-
    متسختا-متیانتی درست از شمال تفلیس آغاز می‌شود و تا ستیغ اصلی قفقاز بالا می‌رود. بخش جنوبی آن کم‌ارتفاع
    و تاریخی است: متسختا، نخستین پایتخت گرجستان، با کلیسای جامع سوتیتسخوولی در میانهٔ شهر، و بالای آن
    روی زبانه‌ای صخره‌ای صومعهٔ جواری که بر محل به‌هم‌پیوستن آراگوی و متکواری مشرف است. هر دو در فهرست
    یونسکو ثبت شده‌اند و هر دو نیم ساعت با پایتخت فاصله دارند.

    شمال‌تر، بزرگراه نظامی گرجستان آغاز می‌شود؛ معروف‌ترین مسیر رانندگی کشور. آب سبزرنگ دریاچهٔ سد ژینوالی،
    مجموعهٔ مستحکم آنانوری بر ساحل آن، و سپس صعودی طولانی تا گودائوری — در زمستان پیست اسکی و در تابستان
    راهی به سوی بنای یادبود دوستی روسیه و گرجستان و گردنهٔ جواری در ارتفاع 2,379 متر. آن سوی خط تقسیم
    آب، کازبگی است: شهرکی زیر مخروط کوه کازبک، با کلیسای تثلیث گرگتی در ارتفاع 2,170 متر، تنگهٔ داریالی
    و آبشارهای گولتی.

    دره‌های جانبی جهانی دیگرند. تروسو در غرب بزرگراه باز می‌شود، با چشمه‌های معدنی و پلکان‌های تراورتن
    به رنگ زنگار. در خوسورتی، شاتیلی روستایی است که همچون تودهٔ یکپارچه‌ای از برج‌های سنگی نزدیک مرز شمالی
    ساخته شده و از راه گردنه‌ای بلند و خاکی به آن می‌رسند.

    فصل‌ها اینجا مرزهای تندی دارند. متسختا، آنانوری و ژینوالی تمام سال باز هستند؛ گودائوری از دسامبر تا
    مارس برای اسکی کار می‌کند؛ تروسو و شاتیلی عملاً از ژوئن تا سپتامبر در دسترس‌اند. نیم روز برای متسختا
    کافی است، یک روز کامل شما را به کازبگی می‌رساند و یک شب ماندن در آنجا کیفیت سفر را به‌کلی بالا می‌برد.
  driving: >-
    بزرگراه نظامی (S3) در تمام طول خود آسفالت است، اما جاده‌ای کوهستانی است و درست مثل جادهٔ کوهستان رفتار
    می‌کند. مسیر میان گودائوری و کوبی بهمن‌خیز است و در برف سنگین پلیس آن را ساعت‌ها یا حتی روزها می‌بندد؛
    از نوامبر تا مارس لاستیک زمستانی الزامی است و همراه داشتن زنجیر چرخ ارزش دارد. صف کامیون‌های باری
    به سوی گذرگاه مرزی داریالی معمول است و سبقت را در تنگناها دشوار می‌کند.

    شش کیلومتر پایانی تا کلیسای تثلیث گرگتی تند و به‌شدت آسیب‌دیده است — به ارتفاع کف واقعی یا یکی از
    جیپ‌های محلی نیاز دارید. راه‌های تروسو و شاتیلی خاکی‌اند و فقط با 4x4 قابل عبورند؛ گردنهٔ داتویسجواری
    به سوی شاتیلی معمولاً از ژوئن تا اکتبر باز است. باک را در پاساناوری یا گودائوری پر کنید. اشتباه کلاسیک،
    رفتن و بازگشتن به کازبگی در یک روز زمستانی و عبور از گردنه در تاریکی است.
  best_for:
  - نیم روز در متسختا برای سوتیتسخوولی و جواری
  - سفر دو روزه به کازبگی با یک شب اقامت
  - اسکی در گودائوری از دسامبر تا مارس
  - سفرهای تابستانی با 4x4 به تروسو و خوسورتی
he:
  name: מצחתה-מתיאנטי
  short: הבירה העתיקה מצחתה וכביש הצבא הגאורגי לקזבגי — היסטוריה והרים גבוהים על ציר אחד.
  body: >-
    מצחתה-מתיאנטי מתחילה מיד מצפון לטביליסי ומטפסת עד לרכס הראשי של הקווקז. הקצה הדרומי שלה נמוך והיסטורי:
    מצחתה, בירתה הראשונה של גאורגיה, עם קתדרלת סווטיצחוולי במרכז העיר, ומעליה על צוק סלעי מנזר ג'וארי,
    המשקיף על מפגש הנהרות אראגווי ומטקווארי. שני האתרים רשומים ברשימת אונסקו ושניהם במרחק חצי שעה מהבירה.

    מצפון לשם מתחיל כביש הצבא הגאורגי, נסיעת ההרים המפורסמת ביותר במדינה. המים הירוקים של מאגר ז'ינוואלי,
    מתחם המבצר אנאנורי על גדתו, עם הכנסייה המקושטת והמגדל שלו, ואז טיפוס ארוך אל גודאורי — אתר סקי בחורף,
    ובקיץ הדרך אל אנדרטת הידידות הרוסית-גאורגית ומעבר ג'וארי בגובה 2,379 מטר. מעבר לקו פרשת המים שוכנת
    קזבגי: עיירה למרגלות חרוט הר קזבק, כנסיית השילוש בגרגטי בגובה 2,170 מטר, ערוץ דריאלי ומפלי גוולטי.

    עמקי הצד הם עולם אחר לגמרי. טרוסו נפתח ממערב לכביש, עם מעיינות מינרליים ומדרגות טרוורטין בגוון חלודה,
    אחד הנופים היוצאי דופן בכל הקווקז. בחבסורתי עומד שאטילי, כפר שנבנה כגוש אחד של מגדלי אבן סמוך לגבול
    הצפוני, ואליו מגיעים דרך מעבר גבוה ולא סלול; הכפר הוא יישוב ומצודה בעת ובעונה אחת.

    העונתיות חדה. מצחתה, אנאנורי וז'ינוואלי פתוחים כל השנה; גודאורי פועלת מדצמבר עד מרץ לסקי; טרוסו ושאטילי
    נגישים למעשה מיוני עד ספטמבר. חצי יום מספיק למצחתה, יום שלם מביא אתכם לקזבגי, ולינה שם משפרת את הביקור
    לאין ערוך: באור הבוקר ההר נראה הרבה יותר טוב מאשר בערפל של אחר הצהריים.
  driving: >-
    כביש הצבא (S3) סלול לכל אורכו, אבל זהו כביש הרים והוא מתנהג ככזה. הקטע שבין גודאורי לקובי חשוף למפולות
    שלגים, ובשלג כבד המשטרה סוגרת אותו לשעות ואף לימים; מנובמבר עד מרץ חובה לנסוע עם צמיגי חורף וכדאי
    להחזיק שרשראות. תורים של משאיות בדרך למעבר הגבול בדריאלי הם עניין שבשגרה ומקשים על עקיפה בקטעים הצרים.

    ששת הקילומטרים האחרונים אל כנסיית השילוש בגרגטי תלולים ומרוסקים — נדרש גובה גחון אמיתי או אחד הג'יפים
    המקומיים. הדרכים לטרוסו ולשאטילי אינן סלולות ומיועדות ל-4x4 בלבד; מעבר דאטוויסג'ווארי לכיוון שאטילי
    פתוח בדרך כלל מיוני עד אוקטובר. תדלקו בפסאנאורי או בגודאורי. הטעות הקלאסית היא לנסוע לקזבגי ובחזרה
    ביום אחד בחורף ולחצות את המעבר בחשכה.
  best_for:
  - חצי יום במצחתה לסווטיצחוולי ולג'וארי
  - נסיעה בת יומיים לקזבגי עם לינה בדרך
  - סקי בגודאורי בין דצמבר למרץ
  - טיולי 4x4 בקיץ לטרוסו ולחבסורתי
ar:
  name: متسخيتا-متيانيتي
  short: العاصمة القديمة متسخيتا والطريق العسكري الجورجي إلى كازبيغي — التاريخ والجبال العالية على محور
    واحد.
  body: >-
    تبدأ متسخيتا-متيانيتي شمال تبليسي مباشرة وتمتد صعوداً حتى السلسلة الرئيسية للقوقاز. طرفها الجنوبي
    منخفض وتاريخي: متسخيتا، أول عاصمة لجورجيا، وفي وسطها كاتدرائية سفيتيتسخوفيلي، وفوقها على نتوء صخري
    يقوم دير جفاري المطل على ملتقى نهري أراغفي ومتكفاري. كلا الموقعين مدرج على قائمة اليونسكو، وكلاهما
    على بعد نصف ساعة من العاصمة.

    إلى الشمال يبدأ الطريق العسكري الجورجي، أشهر طرق البلاد للقيادة. المياه الخضراء لخزان جينفالي، ومجمع
    أنانوري المحصن على ضفته بكنيسته المنقوشة وبرجه، ثم صعود طويل إلى غوداوري — منتجع تزلج في الشتاء، وفي
    الصيف طريق إلى نصب الصداقة وممر جفاري على ارتفاع 2,379 متراً. وخلف خط تقسيم المياه تقع كازبيغي: بلدة
    تحت مخروط جبل كازبك، مع كنيسة الثالوث في غيرغيتي على ارتفاع 2,170 متراً، ومضيق داريالي وشلالات غفيليتي.

    الأودية الجانبية عالم آخر تماماً. ينفتح وادي تروسو غرب الطريق بينابيعه المعدنية ومصاطب الترافرتين
    ذات اللون الصدئ، وهو من أغرب المشاهد الطبيعية في القوقاز كله. وفي خيفسوريتي تقف شاتيلي، قرية بُنيت
    ككتلة واحدة من الأبراج الحجرية قرب الحدود الشمالية، ويُوصل إليها عبر ممر مرتفع غير معبّد.

    المواسم هنا حادة الحدود. متسخيتا وأنانوري وجينفالي مفتوحة طوال العام؛ وغوداوري تعمل من ديسمبر إلى
    مارس للتزلج؛ أما تروسو وشاتيلي فمتاحتان عملياً من يونيو إلى سبتمبر. نصف يوم يكفي لمتسخيتا، ويوم كامل
    يوصلك إلى كازبيغي، وليلة مبيت هناك ترفع مستوى الرحلة كثيراً: يبدو الجبل في ضوء الصباح أوضح بكثير مما
    يبدو في ضباب الظهيرة.
  driving: >-
    الطريق العسكري (S3) معبّد على امتداده كله، لكنه طريق جبلي ويتصرف على هذا النحو. المقطع بين غوداوري
    وكوبي معرّض للانهيارات الثلجية، وعند تساقط الثلوج الكثيفة تغلقه الشرطة لساعات أو لأيام؛ إطارات الشتاء
    إلزامية من نوفمبر إلى مارس، ويستحسن حمل السلاسل. وطوابير شاحنات الشحن المتجهة إلى معبر داريالي الحدودي
    أمر معتاد، وهي تجعل التجاوز صعباً في المقاطع الضيقة.

    الكيلومترات الستة الأخيرة صعوداً إلى كنيسة الثالوث في غيرغيتي شديدة الانحدار ومتهالكة — تحتاج إلى
    خلوص أرضي حقيقي أو إلى إحدى سيارات الجيب المحلية. طريقا تروسو وشاتيلي غير معبّدين ولا يصلحان إلا لسيارات
    الدفع الرباعي؛ وممر داتفيسجفاري نحو شاتيلي مفتوح عادة من يونيو إلى أكتوبر. املأ الخزان في باسانوري
    أو غوداوري. والخطأ الكلاسيكي هو محاولة الذهاب إلى كازبيغي والعودة في يوم شتوي واحد وعبور الممر في
    الظلام.
  best_for:
  - نصف يوم في متسخيتا لسفيتيتسخوفيلي وجفاري
  - رحلة يومين إلى كازبيغي مع مبيت
  - التزلج في غوداوري بين ديسمبر ومارس
  - جولات صيفية بالدفع الرباعي إلى تروسو وخيفسوريتي
