ka:
  name: კახეთი
  short: საქართველოს ღვინის მხარე ალაზნის ველზე — მარნები, ძველი ტაძრები, სიღნაღი და თუშეთის მთები ჩრდილოეთით.
  body: >-
    კახეთი საქართველოს ღვინის მხარეა და ყველაზე მარტივი რეგიონი ორი უჩქარო დღის გასატარებლად. ალაზნის
    ველი გომბორის ქედსა და კავკასიონის კედელს შორის ჩრდილო-აღმოსავლეთისკენ მიემართება და თითქმის ყველაფერი,
    რაც ღირს ნახვად, სწორედ ამ ღერძზეა. თელავი პრაქტიკული ცენტრია — ქალაქის შუაგულში ბატონის ციხე, ერეკლე
    II-ის რეზიდენცია დგას. სიღნაღი, ერთი საათით სამხრეთით, პატარა გალავანშემორტყმული ქალაქია ხანგრძლივი
    ზღუდით და ველზე გადაშლილი ხედით; მის გვერდით — ბოდბე, წმინდა ნინოს საძვალე.


    ტაძრები აქ ყველაზე ძველი ფენაა. ალავერდის საკათედრო ტაძარი ვენახებს ერთი მოქნილი მოძრაობით აღემატება;
    იყალთო აკადემიაც იყო და მონასტერიც; ნეკრესი ტყიანი ფერდობიდან იყურება; გრემი კი 1615 წელს დანგრეული
    სამეფო რეზიდენციის ნაშთია. წინანდლის მამული XIX საუკუნის სახლს, ინგლისურ პარკსა და მარანს ინახავს,
    ყვარელი და ყინძმარაულის ზონა კი იმის გასაგებად ღირს, როგორ მზადდება ნახევრად ტკბილი წითელი ღვინოები.


    რეგიონს ორი უკიდურესობა აქვს. სამხრეთ-აღმოსავლეთით დავით გარეჯა ზოლებიან ნახევრადუდაბნოშია, ვენახებისგან
    სრულიად განსხვავებულ პეიზაჟში. ჩრდილოეთით, აბანოს უღელტეხილის იქით, თუშეთი და ომალოა — მისაწვდომი
    მხოლოდ ზაფხულში და მხოლოდ 4x4-ით.


    ღვინო აქ მუზეუმის ექსპონატი არაა: ქვევრში დაყენების ტრადიცია ათასწლეულებს ითვლის და დღემდე ცოცხალია
    როგორც დიდ საწარმოებში, ისე ოჯახურ მარნებში, სადაც დეგუსტაცია ხშირად სუფრაში გადაიზრდება ხოლმე.


    საუკეთესო დროა სექტემბერი და ოქტომბერი, რთველის სეზონი, როცა ყველა ოჯახი ყურძენს წურავს და სოფლებში
    მუშაობა დილიდან საღამომდე დუღს. გაზაფხული მწვანეა და მშვიდი, ზაფხული ველზე ცხელი, ზამთარი კი ტაძრებისა
    და ქალაქებისთვის სავსებით გამოსადეგი, თუმცა მთები დახურულია. ორი დღე გულწრფელი მინიმუმია, სამი — თუ
    თუშეთიც სიაშია.
  driving: >-
    კახეთში ორი გზა შედის. კახეთის გზატკეცილი საგარეჯოსა და ბადიაურის გავლით უფრო გრძელია, სამაგიეროდ
    ბრტყელი და ნებისმიერ ამინდში საიმედო. გომბორის უღელტეხილის გზა თბილისიდან თელავამდე მოკლეა და ბევრად
    ლამაზი, მაგრამ ეს ნამდვილი მთის გადასასვლელია მკვეთრი მოსახვევებით და თოვლის ან ნისლის დროს იკეტება
    — ზამთარში წინასწარ გადაამოწმე. ხეობის შიგნით ასფალტი კარგია და მანძილები მოკლე.


    ორი მონაკვეთი განსაკუთრებულ პატივისცემას მოითხოვს. დავით გარეჯამდე ბოლო გზა უხეში და მტვრიანია — მაღალი
    კლირენსი გამოგადგება. აბანოს უღელტეხილი თუშეთისკენ სულ სხვა დონეა: გრუნტოვანი, ბარიერების გარეშე,
    2850 მეტრზე, ღიაა დაახლოებით ივნისიდან ოქტომბრის დასაწყისამდე და მხოლოდ ჯიპით არის დაშვებული.


    მეორე გულწრფელი გაფრთხილება ღვინოს ეხება. დეგუსტაცია რეგიონის აზრია, ალკოჰოლის ზღვარი კი პრაქტიკულად
    ნულოვანია — გამგზავრებამდე გადაწყვიტეთ, ვინ მართავს.
  best_for:
  - ორი დღე მარნებში, ტაძრებსა და ველის ქალაქებში
  - რთველი სექტემბერ-ოქტომბერში
  - პირველი, მარტივი გასვლა თბილისის მიღმა
  - თუშეთი და აბანოს უღელტეხილი ზაფხულში, ჯიპით
en:
  name: Kakheti
  short: >-
    Georgia's wine country on the Alazani Valley — cellars, ancient churches, the hill town of Sighnaghi
    and the Tusheti mountains.
  body: >-
    Kakheti is Georgia's wine country and the easiest region in which to spend two unhurried days. The
    Alazani Valley runs north-east between the Gombori ridge and the wall of the Greater Caucasus, and
    almost everything worth seeing lies along that axis. Telavi is the practical centre, with Batonis
    Tsikhe, the residence of King Erekle II, in the middle of town. Sighnaghi, an hour to the south, is
    a small walled hill town with a long rampart and a view over the whole valley; Bodbe Monastery, the
    burial place of St Nino, sits just outside it.


    The churches are the oldest layer. Alaverdi Cathedral rises above the vineyards in one clean sweep
    of eleventh-century stone. Ikalto was an academy as much as a monastery. Nekresi looks down from a
    wooded slope, and Gremi is what survives of a royal capital sacked in 1615. Tsinandali Estate keeps
    a nineteenth-century house, an English-style park and a cellar, while Kvareli and the Kindzmarauli
    zone are the place to work out how the semi-sweet reds are made.


    Two extremes bracket the region. In the south-east, David Gareja stands in a bare striped semi-desert,
    a landscape with nothing in common with the vineyards. In the north, beyond the Abano Pass, Tusheti
    and the village of Omalo are reachable only in summer and only in a four-wheel drive.


    September and October bring rtveli, the grape harvest, when every household is pressing. Spring is
    green and quiet, and winter still works for the churches and towns even though the mountains close.
    Two days is the honest minimum, three if Tusheti is on the list.
  driving: >-
    Two roads lead into Kakheti. The Kakheti Highway through Sagarejo and Badiauri is longer but flat
    and dependable in any weather. The Gombori Pass road from Tbilisi to Telavi is shorter and much prettier,
    but it is a genuine mountain crossing with tight bends, and it closes in snow or thick fog — check
    before choosing it in winter. Inside the valley the asphalt is good and distances between sites are
    short.


    Two sections deserve respect. The final approach to David Gareja is rough, dusty and much easier with
    ground clearance. The Abano Pass into Tusheti is another matter: an unsurfaced shelf road at 2,850
    metres with no barriers, usually open from June to early October, permitted only in a 4x4 and best
    left to drivers who have done it before.


    The other honest warning concerns wine. Tastings are the point of the region and Georgia enforces
    an effectively zero alcohol limit, so decide who drives before you leave.
  best_for:
  - Two days of cellars, cathedrals and valley towns
  - The rtveli grape harvest in September and October
  - A first, easy trip out of Tbilisi
  - Tusheti and the Abano Pass in summer, with a 4x4
ru:
  name: Кахетия
  short: Винный край Грузии в Алазанской долине — марани, древние храмы, городок Сигнахи и горы Тушети
    на севере.
  body: >-
    Кахетия — винный край Грузии и самый удобный регион для двух неспешных дней. Алазанская долина тянется
    на северо-восток между Гомборским хребтом и стеной Большого Кавказа, и почти всё интересное лежит
    вдоль этой оси. Практический центр — Телави, где прямо в городе стоит Батонис-цихе, резиденция царя
    Ираклия II. Сигнахи в часе южнее — маленький город на холме с длинной крепостной стеной и видом на
    всю долину; рядом монастырь Бодбе, место погребения святой Нино.


    Храмы здесь — самый древний слой. Собор Алаверди поднимается над виноградниками одним движением камня
    XI века. Икалто был не столько монастырём, сколько академией. Некреси смотрит вниз с лесистого склона,
    а Греми — то, что осталось от царской столицы, разорённой в 1615 году. Усадьба Цинандали хранит дом
    XIX века, парк в английском духе и винный погреб, а Кварели и зона Киндзмараули объясняют, как делают
    местные полусладкие красные.


    Регион обрамляют две крайности. На юго-востоке Давид Гареджи стоит в полосатой полупустыне — пейзаж,
    не имеющий ничего общего с виноградниками. На севере, за Абанским перевалом, лежат Тушети и село Омало,
    доступные только летом и только на внедорожнике.


    Лучшее время — сентябрь и октябрь, ртвели, когда виноград давят в каждом дворе. Весна зелёная и тихая,
    зима вполне годится для храмов и городков, хотя горы закрыты. Два дня — честный минимум, три — если
    в планах Тушети.
  driving: >-
    В Кахетию ведут две дороги. Кахетинское шоссе через Сагареджо и Бадиаури длиннее, но ровное и надёжное
    в любую погоду. Дорога через Гомборский перевал из Тбилиси в Телави короче и заметно живописнее, однако
    это настоящий горный перевал с плотными поворотами, и в снег или густой туман его закрывают — зимой
    уточняйте заранее. Внутри долины асфальт хороший, расстояния между объектами небольшие.


    Два участка требуют уважения. Последний подъезд к Давид Гареджи разбитый и пыльный, клиренс здесь
    очень помогает. Абанский перевал в Тушети — совсем другая история: грунтовая полка на 2850 метрах
    без отбойников, открытая примерно с июня до начала октября, разрешённая только для полноприводных
    машин и только опытному водителю.


    Второе честное предупреждение — про вино. Дегустации и есть смысл региона, а допустимый уровень алкоголя
    в Грузии практически нулевой: решите заранее, кто за рулём.
  best_for:
  - Два дня по винодельням, храмам и городкам долины
  - Ртвели — сбор винограда в сентябре и октябре
  - Первая простая поездка за пределы Тбилиси
  - Тушети и Абанский перевал летом, на внедорожнике
fa:
  name: کاختی
  short: سرزمین شراب گرجستان در درهٔ آلازانی — سردابه‌ها، کلیساهای کهن، شهرک تپه‌ای سیغناغی و کوهستان
    توشتی.
  body: >-
    کاختی سرزمین شراب گرجستان است و آسان‌ترین منطقه برای گذراندن دو روز بی‌شتاب. درهٔ آلازانی رو به شمال‌شرق
    میان ستیغ گومبوری و دیوار قفقاز بزرگ کشیده شده و تقریباً هر چیز دیدنی روی همین محور قرار دارد. تلاوی
    مرکز عملی منطقه است و باتونیس تسیخه، اقامتگاه ارکله دوم، در میانهٔ شهر ایستاده است. سیغناغی، یک ساعت
    جنوب‌تر، شهرکی کوچک روی تپه است با حصاری بلند و منظره‌ای بر تمام دره؛ صومعهٔ بودبه، آرامگاه سنت نینو،
    درست بیرون آن قرار دارد.

    کلیساها کهن‌ترین لایه‌اند. کلیسای جامع آلاوردی با یک خیز یکپارچه از سنگ سدهٔ یازدهم بالای تاکستان‌ها
    سر برمی‌آورد. ایکالتو به همان اندازه که صومعه بود، آکادمی هم بود. نکرسی از دامنه‌ای جنگلی به پایین
    نگاه می‌کند و گرمی بازماندهٔ پایتختی سلطنتی است که در 1615 غارت شد. ملک تسیناندالی خانه‌ای از سدهٔ
    نوزدهم، پارکی به سبک انگلیسی و یک سردابه را نگه داشته است، و کوارلی و منطقهٔ کیندزماراولی جایی است
    که درمی‌یابید سرخ‌های نیمه‌شیرین چگونه ساخته می‌شوند.

    دو حد نهایی، منطقه را در میان گرفته‌اند. در جنوب‌شرق، داوید گارجا در نیمه‌بیابانی برهنه و راه‌راه
    ایستاده است؛ چشم‌اندازی که هیچ شباهتی به تاکستان‌ها ندارد. در شمال، آن سوی گردنهٔ آبانو، توشتی و روستای
    اومالو فقط در تابستان و فقط با خودروی چهارچرخ‌محرک در دسترس‌اند.

    سپتامبر و اکتبر «رتولی» را می‌آورند، برداشت انگور، وقتی هر خانه‌ای مشغول فشردن است. بهار سبز و آرام
    است و زمستان هم برای کلیساها و شهرک‌ها کار می‌کند، هرچند کوهستان بسته می‌شود. دو روز حداقلِ صادقانه
    است و سه روز اگر توشتی در فهرست باشد.
  driving: >-
    دو راه به کاختی می‌رسد. بزرگراه کاختی از ساگارجو و بادیااوری طولانی‌تر است اما هموار و در هر آب‌وهوایی
    قابل اعتماد. جادهٔ گردنهٔ گومبوری از تفلیس به تلاوی کوتاه‌تر و به‌مراتب زیباتر است، اما گذرگاهی واقعاً
    کوهستانی با پیچ‌های تند است و در برف یا مه غلیظ بسته می‌شود — پیش از انتخاب آن در زمستان وضعیت را
    بررسی کنید. داخل دره آسفالت خوب است و فاصلهٔ میان جاذبه‌ها کوتاه.

    دو مسیر احترام می‌خواهند. رسیدن نهایی به داوید گارجا ناهموار و پرگردوخاک است و با ارتفاع کف بیشتر
    بسیار آسان‌تر می‌شود. گردنهٔ آبانو به سوی توشتی داستان دیگری است: جاده‌ای خاکی و طاقچه‌ای در ارتفاع
    2,850 متر بدون هیچ حفاظ، معمولاً از ژوئن تا اوایل اکتبر باز، فقط با 4x4 مجاز، و بهتر است به رانندگانی
    سپرده شود که پیش‌تر آن را رفته‌اند.

    هشدار صادقانهٔ دیگر به شراب مربوط است. مزه‌کردن جانِ این منطقه است و گرجستان عملاً حد صفر الکل را
    اجرا می‌کند، پس پیش از حرکت تعیین کنید چه کسی پشت فرمان می‌نشیند.
  best_for:
  - دو روز سردابه، کلیسای جامع و شهرک‌های دره
  - برداشت انگور «رتولی» در سپتامبر و اکتبر
  - نخستین سفر آسان از تفلیس به بیرون
  - توشتی و گردنهٔ آبانو در تابستان، با 4x4
he:
  name: קחתי
  short: ארץ היין של גאורגיה בעמק אלאזני — מרתפים, כנסיות עתיקות, עיירת הגבעה סיגנאגי והרי טושתי.
  body: >-
    קחתי היא ארץ היין של גאורגיה והאזור הקל ביותר לבלות בו יומיים בלי למהר. עמק אלאזני נמתח צפונה-מזרחה
    בין רכס גומבורי לחומת הקווקז הגדול, וכמעט כל מה שכדאי לראות שוכן על הציר הזה. טלאווי היא המרכז המעשי,
    עם שוק, מלונות ומסעדות, ובאמצע העיר עומד באטוניס ציחה, ארמונו של המלך ארקלה השני. סיגנאגי, שעה דרומה
    משם, היא עיירת גבעה מוקפת חומה עם טיילת חומה ארוכה ותצפית על כל העמק; מנזר בודבה, מקום קבורתה של נינו
    הקדושה, נמצא ממש בפאתיה.

    הכנסיות הן השכבה העתיקה ביותר. קתדרלת אלאוורדי מתנשאת מעל הכרמים בגוש אחד של אבן מן המאה ה-11. איקלטו
    הייתה אקדמיה לא פחות מאשר מנזר. נקרסי משקיפה ממדרון מיוער, וגרמי הוא מה שנותר מבירה מלכותית שנבזזה
    ב-1615. אחוזת צינאנדלי שומרת על בית מן המאה ה-19, על גן בסגנון אנגלי ועל מרתף, ואילו קווארלי ואזור
    קינדזמראולי הם המקום להבין בו כיצד נוצרים היינות האדומים החצי-מתוקים.

    שני קצוות תוחמים את האזור. בדרום-מזרח ניצב דוד גארג'ה במדבר-למחצה חשוף ומפוספס, נוף שאין לו דבר במשותף
    עם הכרמים. בצפון, מעבר למעבר אבאנו, טושתי והכפר אומאלו נגישים רק בקיץ ורק ברכב הנעה כפולה.

    ספטמבר ואוקטובר מביאים את הרתוולי, בציר הענבים, כשבכל בית דורכים יין. האביב ירוק ושקט, והחורף עדיין
    מתאים לכנסיות ולעיירות אף שההרים נסגרים. יומיים הם המינימום הכן, ושלושה ימים אם טושתי נמצאת ברשימה
    שלכם.
  driving: >-
    שתי דרכים מובילות לקחתי. כביש קחתי דרך סאגארג'ו ובאדיאורי ארוך יותר אבל שטוח ואמין בכל מזג אוויר.
    דרך מעבר גומבורי מטביליסי לטלאווי קצרה ויפה בהרבה, אך זהו מעבר הרים של ממש עם סיבובים חדים, והוא נסגר
    בשלג או בערפל כבד — בדקו לפני שאתם בוחרים בו בחורף. בתוך העמק האספלט טוב והמרחקים בין האתרים קצרים.

    שני קטעים דורשים כבוד. הגישה האחרונה לדוד גארג'ה משובשת ומאובקת וקלה בהרבה עם גובה גחון. מעבר אבאנו
    אל טושתי הוא סיפור אחר: דרך מדף לא סלולה בגובה 2,850 מטר בלי מעקות בטיחות, פתוחה בדרך כלל מיוני עד
    תחילת אוקטובר, מותרת רק ברכב 4x4 ועדיף להשאיר אותה לנהגים שכבר עשו אותה בעבר.

    האזהרה הכנה הנוספת נוגעת ליין. הטעימות הן כל העניין באזור הזה, וגאורגיה אוכפת סף אלכוהול אפס למעשה,
    ולכן החליטו עוד לפני היציאה מי נוהג.
  best_for:
  - יומיים של מרתפים, קתדרלות ועיירות עמק
  - בציר הרתוולי בספטמבר ובאוקטובר
  - טיול ראשון וקל מחוץ לטביליסי
  - טושתי ומעבר אבאנו בקיץ, עם רכב 4x4
ar:
  name: كاخيتي
  short: أرض النبيذ الجورجية في وادي ألازاني — أقبية وكنائس قديمة وبلدة سيغناغي على التل وجبال توشيتي.
  body: >-
    كاخيتي هي أرض النبيذ في جورجيا، وأسهل مناطق البلاد لقضاء يومين بلا استعجال. يمتد وادي ألازاني نحو
    الشمال الشرقي بين سلسلة غومبوري وجدار القوقاز الكبرى، وكل ما يستحق المشاهدة تقريباً يقع على هذا المحور.
    تيلافي هي المركز العملي، وفي وسطها يقوم باتونيس تسيخي، مقر الملك إيريكلي الثاني. أما سيغناغي، على
    بعد ساعة إلى الجنوب، فبلدة صغيرة على تل يحيط بها سور طويل يمكن السير فوقه ويطل على الوادي كله؛ ودير
    بودبي، حيث ترقد القديسة نينو، يقع خارجها مباشرة.

    الكنائس هي الطبقة الأقدم. ترتفع كاتدرائية ألافيردي فوق الكروم في كتلة واحدة من حجر القرن الحادي عشر.
    وكانت إيكالتو أكاديمية بقدر ما كانت ديراً. وتطل نيكريسي من منحدر مشجر، وغريمي هو ما تبقى من عاصمة
    ملكية نُهبت عام 1615. وتحتفظ ضيعة تسيناندالي ببيت من القرن التاسع عشر وحديقة على الطراز الإنجليزي
    وقبو للنبيذ، بينما كفاريلي ومنطقة كيندزماراولي هما المكان الذي تفهم فيه كيف تُصنع النبيذات الحمراء
    نصف الحلوة.

    طرفان متناقضان يحدّان الإقليم. في الجنوب الشرقي يقف ديفيد غاريجا في شبه صحراء عارية مخططة، مشهد لا
    يشبه الكروم في شيء. وفي الشمال، خلف ممر أبانو، لا يمكن الوصول إلى توشيتي وقرية أومالو إلا في الصيف
    وإلا بسيارة دفع رباعي.

    يجلب سبتمبر وأكتوبر موسم «رتفيلي»، أي قطاف العنب، حين يعصر كل بيت نبيذه. الربيع أخضر وهادئ، والشتاء
    ما زال صالحاً للكنائس والبلدات وإن أُغلقت الجبال. يومان هما الحد الأدنى الصادق، وثلاثة إن كانت توشيتي
    على القائمة.
  driving: >-
    طريقان يقودان إلى كاخيتي. طريق كاخيتي السريع عبر ساغاريجو وباديوري أطول لكنه مستوٍ ويُعتمد عليه في
    كل الأحوال الجوية. أما طريق ممر غومبوري من تبليسي إلى تيلافي فأقصر وأجمل بكثير، لكنه عبور جبلي حقيقي
    بمنعطفات ضيقة، ويُغلق عند الثلج أو الضباب الكثيف — تحقق من حالته قبل اختياره شتاءً. وداخل الوادي الإسفلت
    جيد والمسافات بين المواقع قصيرة.

    مقطعان يستحقان الاحترام. الوصول الأخير إلى ديفيد غاريجا وعر ومغبر ويصبح أسهل كثيراً مع خلوص أرضي مناسب.
    وممر أبانو نحو توشيتي شأن آخر تماماً: طريق رفّي غير معبّد على ارتفاع 2,850 متراً بلا حواجز حماية،
    يُفتح عادة من يونيو إلى أوائل أكتوبر، ولا يُسمح بسلوكه إلا بسيارة دفع رباعي، والأفضل تركه لسائقين
    سبق لهم أن قطعوه.

    والتحذير الصريح الآخر يخص النبيذ. التذوق هو جوهر الزيارة هنا، وجورجيا تطبق عملياً حد صفر للكحول، فاتفقوا
    قبل الانطلاق على من يقود.
  best_for:
  - يومان من الأقبية والكاتدرائيات وبلدات الوادي
  - موسم قطاف العنب «رتفيلي» في سبتمبر وأكتوبر
  - أول رحلة سهلة خارج تبليسي
  - توشيتي وممر أبانو صيفاً بسيارة دفع رباعي
