ka:
  name: სამეგრელო-ზემო სვანეთი
  short: სუბტროპიკული სამეგრელო კანიონებით და ზემო სვანეთი კოშკებით — ერთი რეგიონი, ორი სრულიად სხვა სამყარო.
  body: >-
    ეს ადმინისტრაციული ერთეული ორ სრულიად განსხვავებულ ქვეყანას აერთიანებს. ქვემოთ სამეგრელოა: თბილი,
    ნოტიო, ბრტყელი მხარე ჩაისა და ციტრუსის პლანტაციებით, ცენტრით ზუგდიდში, სადაც დადიანების სასახლის მუზეუმია
    — ევროპულ ყაიდაზე აშენებული რეზიდენცია ბოტანიკური ბაღით და ნაპოლეონის სახლთან დაკავშირებული კოლექციით.
    მარტვილის კანიონი აბაშის მდინარეზე ნავით მოსანახულებელი ხეობაა; ნოქალაქევი, იგივე არქეოპოლისი, გვიანანტიკური
    და ადრეშუასაუკუნეების ნაქალაქარია გალავნით და მიწისქვეშა გვირაბით მდინარემდე.


    ჩრდილოეთით გზა ენგურის კაშხალთან იწყებს ასვლას — თაღოვანი კაშხალი და მის უკან გრძელი, ფირუზისფერი
    ჯვრის წყალსაცავი — და სამ საათში სულ სხვა კლიმატში გადადის. ზემო სვანეთი მაღალმთიანი მხარეა საკუთარი
    ენით, სიმღერითა და ხუროთმოძღვრებით: მესტიაში ქვის საცხოვრებელ კოშკებს შორის სვანეთის მუზეუმია მდიდარი
    ხატებისა და ხელნაწერების კოლექციით, ზემოთ ჰაწვალისა და თეთნულდის სათხილამურო ტრასებია, ხოლო ჭალაადის
    მყინვარამდე ტყის ბილიკი მიდის. უშგული, ოთხი სოფლის ჯგუფი 2100 მეტრზე შხარის ძირში, იუნესკოს სიაშია.
    კორულდის ტბებამდე მხოლოდ ჯიპით ან ფეხით ადიან.


    სამეგრელოს თავისი სამზარეულო აქვს — მწვავე და კაკლიანი — და მეგრული ენა დღემდე ცოცხალია საოჯახო გარემოში;
    სვანეთში კი სვანური ისმის, სრულიად სხვა ენა იმავე ქართველურ ჯგუფიდან. ეს ორი კუთხე ერთმანეთს ავსებს
    და ერთ მარშრუტში ბუნებრივად ჯდება.


    სეზონურობა ორმაგია: სამეგრელო მთელი წელი მისაწვდომია, სვანეთი კი ივნისიდან სექტემბრამდე ჯობს, ზამთარში
    — მხოლოდ თხილამურებისთვის, როცა უშგულის გზა ხშირად დახურულია. სამი-ოთხი დღე გულწრფელი მინიმუმია, უმეტესობა
    კი მეტს უთმობს.
  driving: >-
    მთავარი ის არის, რომ ეს შორეული რეგიონია: მესტიამდე თბილისიდან დაახლოებით 470 კმ და რვა-ცხრა საათი.
    ერთ დღეში მისვლა და დაბრუნება არარეალურია — დაგეგმე ღამის გათევა ზუგდიდში, ქუთაისში ან პირდაპირ მესტიაში.


    ზუგდიდიდან მესტიამდე გზა ასფალტიანია და ტექნიკურად კარგი, მაგრამ 130 კილომეტრზე დაახლოებით სამი საათი
    მიდის: მუდმივი მოსახვევები, ვიწრო მონაკვეთები ენგურის ხეობაში, ქვათაცვენის ზონები და გზაზე მოსიარულე
    საქონელი. წვიმის ან თოვლის შემდეგ ქვები გზაზე ჩვეულებრივი მოვლენაა. ზამთარში მესტიამდე გზა ჩვეულებრივ
    ღიაა, თუმცა ზამთრის საბურავები და ჯაჭვი აუცილებელია.


    მესტიის ზემოთ ყველაფერი იცვლება. უშგულამდე ბოლო მონაკვეთი გრუნტოვანია და მაღალი გამავლობის მანქანას
    მოითხოვს, კორულდის ტბებამდე კი მხოლოდ 4x4 ადის. დაბალი კლირენსის მანქანით ამ გზებზე გასვლა დაზღვევითაც
    არ არის დაფარული. საწვავი ზუგდიდსა და მესტიაშია — შუალედში პრაქტიკულად არა.
  best_for:
  - ოთხდღიანი მარშრუტი ზუგდიდი-მესტია-უშგული
  - სვანური კოშკები და მაღალმთიანი პეიზაჟი ზაფხულში
  - მარტვილის კანიონი და ნოქალაქევი ერთ დღეში
  - ზამთრის თხილამურები ჰაწვალსა და თეთნულდზე
en:
  name: Samegrelo-Zemo Svaneti
  short: >-
    Subtropical Samegrelo with its canyons and Upper Svaneti with its towers — one region, two entirely
    different worlds.
  body: >-
    This administrative region joins two quite different countries. Below lies Samegrelo: warm, humid
    and flat, planted with tea and citrus, centred on Zugdidi and the Dadiani Palace museum, a European-style
    residence with a botanical garden and a collection connected to the Bonaparte family. Martvili Canyon
    on the Abasha river is visited by boat between limestone walls, and Nokalakevi, the Archaeopolis of
    Byzantine sources, preserves late antique walls and a tunnel running down to the river.


    Northwards the road begins to climb at the Enguri Dam, an arch dam with the long turquoise Jvari Reservoir
    behind it, and within three hours it delivers you into a different climate altogether. Upper Svaneti
    is a high mountain province with its own language, polyphony and architecture. Mestia holds the Svaneti
    Museum, rich in icons and manuscripts, among stone defensive towers; above it are the Hatsvali and
    Tetnuldi ski areas, and a forest path leads to the Chalaadi Glacier. Ushguli, a group of four villages
    at 2,100 metres beneath Mount Shkhara, is UNESCO-listed. The Koruldi Lakes are reached only on foot
    or by jeep.


    Seasonality is double. Samegrelo is accessible all year, while Svaneti is at its best from June to
    September, with a separate winter season for skiing. Three to four days is the minimum that makes
    sense, and most travellers give it more.
  driving: >-
    The first thing to accept is distance: Mestia is around 470 km from Tbilisi and eight to nine hours
    of driving. Doing it as a return trip in one day is not realistic, so plan a night in Zugdidi, Kutaisi
    or Mestia itself.


    The road from Zugdidi to Mestia is asphalt and technically sound, but 130 km takes roughly three hours:
    continuous bends, narrow sections in the Enguri gorge, rockfall zones and livestock on the carriageway.
    After rain or snowmelt, stones on the road are routine rather than exceptional. In winter the road
    to Mestia normally stays open, but winter tyres are required and chains are worth having.


    Above Mestia everything changes. The final stretch to Ushguli is gravel and needs a high-clearance
    vehicle; the track to the Koruldi Lakes is 4x4 only. Taking a low car onto either is not covered by
    rental insurance. Fuel is available in Zugdidi and Mestia and effectively nowhere in between, so fill
    up before the climb.
  best_for:
  - 'A four-day run: Zugdidi, Mestia and Ushguli'
  - Svan towers and high mountain scenery in summer
  - Martvili Canyon and Nokalakevi in a single day
  - Winter skiing at Hatsvali and Tetnuldi
ru:
  name: Самегрело-Земо Сванети
  short: Субтропическое Самегрело с каньонами и Верхняя Сванетия с башнями — один регион и два совершенно
    разных мира.
  body: >-
    Этот регион объединяет две совсем разные страны. Внизу лежит Самегрело: тёплое, влажное и плоское,
    с чайными и цитрусовыми плантациями, с центром в Зугдиди, где стоит дворец Дадиани — резиденция в
    европейском духе с ботаническим садом и собранием, связанным с семьёй Бонапартов. Мартвильский каньон
    на реке Абаша осматривают с лодки между известняковыми стенами, а Нокалакеви, известный византийским
    авторам как Археополис, сохранил позднеантичные стены и подземный ход к реке.


    К северу дорога начинает подъём у Ингурской ГЭС — арочная плотина и длинное бирюзовое Джварское водохранилище
    за ней, — и за три часа приводит в совершенно другой климат. Верхняя Сванетия — высокогорная область
    с собственным языком, многоголосием и архитектурой. В Местиа среди каменных боевых башен работает
    музей Сванетии с богатым собранием икон и рукописей, выше лежат горнолыжные зоны Хацвали и Тетнулди,
    а к леднику Чалаади ведёт лесная тропа. Ушгули, группа из четырёх сёл на 2100 метрах под Шхарой, входит
    в список ЮНЕСКО. К озёрам Корульди поднимаются только пешком или на джипе.


    У Самегрело своя кухня — острая, с орехом — и мегрельский язык до сих пор жив в семейном обиходе;
    в Сванетии звучит сванский, совсем другой язык той же картвельской группы. Эти два угла дополняют
    друг друга и естественно складываются в один маршрут.


    Сезонность двойная: Самегрело доступно круглый год, Сванетия лучше всего с июня по сентябрь, плюс
    отдельный зимний лыжный сезон, когда дорога на Ушгули часто закрыта. Минимум — три-четыре дня, и большинство
    путешественников отводит больше.
  driving: >-
    Первое, с чем нужно смириться, — расстояние: до Местиа от Тбилиси около 470 км и восемь-девять часов
    за рулём. Съездить туда и обратно за день нереально, поэтому планируйте ночёвку в Зугдиди, Кутаиси
    или самой Местиа.


    Дорога Зугдиди - Местиа асфальтирована и технически неплоха, но 130 км занимают около трёх часов:
    сплошные повороты, узкие участки в ущелье Ингури, зоны камнепада и скот на проезжей части. После дождя
    или таяния снега камни на асфальте — обычное дело. Зимой дорога до Местиа, как правило, открыта, но
    зимняя резина обязательна, а цепи стоит возить с собой.


    Выше Местиа всё меняется. Последний отрезок до Ушгули грунтовый и требует высокого клиренса, а к озёрам
    Корульди проедет только полный привод. Выезд туда на низкой машине страховкой аренды не покрывается.
    Заправки есть в Зугдиди и Местиа, между ними их практически нет.
  best_for:
  - Четыре дня по маршруту Зугдиди - Местиа - Ушгули
  - Сванские башни и высокогорье летом
  - Мартвильский каньон и Нокалакеви за один день
  - Зимние лыжи в Хацвали и Тетнулди
fa:
  name: سامگرلو-سوانتی علیا
  short: سامگرلوی نیمه‌گرمسیری با دره‌هایش و سوانتی علیا با برج‌هایش — یک منطقه و دو جهان کاملاً متفاوت.
  body: >-
    این منطقهٔ اداری دو کشور کاملاً متفاوت را به هم می‌دوزد. پایین‌دست سامگرلو است: گرم، مرطوب و هموار،
    کاشته‌شده از چای و مرکبات، با مرکزیت زوگدیدی و موزهٔ کاخ دادیانی، اقامتگاهی به سبک اروپایی با باغ
    گیاه‌شناسی و مجموعه‌ای مرتبط با خاندان بناپارت. درهٔ مارتویلی روی رود آباشا را با قایق میان دیواره‌های
    آهکی می‌بینند، و نوکالاکوی، همان آرکئوپولیس منابع بیزانسی، دیوارهای اواخر دوران باستان و تونلی رو
    به رودخانه را حفظ کرده است.

    رو به شمال، جاده از سد انگوری شروع به بالا رفتن می‌کند؛ دیواره‌ای قوسی به بلندی 271 متر با آبگیر فیروزه‌ای
    و کشیدهٔ جواری در پشت آن، و در سه ساعت شما را به اقلیمی کاملاً دیگر می‌رساند. سوانتی علیا ولایتی کوهستانی
    با زبان، آواز چندصدایی و معماری خاص خود است. مستیا موزهٔ سوانتی را در میان برج‌های دفاعی سنگی جای
    داده که از شمایل و دست‌نویس پر است؛ بالای آن پیست‌های هاتسوالی و تتنولدی قرار دارند و راهی جنگلی،
    حدود یک ساعت و نیم پیاده از پل جاده، به یخچال چالاادی می‌رسد. اوشگولی، مجموعه‌ای از چهار روستا در
    ارتفاع 2,100 متر زیر کوه شخارا، در فهرست یونسکو ثبت شده و از بلندترین روستاهای دائماً مسکون اروپاست.
    به دریاچه‌های کورولدی تنها پیاده یا با جیپ می‌رسند.

    فصل دوگانه است. سامگرلو تمام سال در دسترس است، در حالی که سوانتی از ژوئن تا سپتامبر در بهترین حالت
    خود است و فصل زمستانی جداگانه‌ای برای اسکی دارد. سه تا چهار روز حداقلی است که معنا دارد و بیشتر مسافران
    زمان بیشتری به آن می‌دهند.
  driving: >-
    نخستین چیزی که باید بپذیرید فاصله است: مستیا حدود 470 کیلومتر از تفلیس دور است و هشت تا نه ساعت رانندگی
    می‌خواهد. رفت و برگشت در یک روز واقع‌بینانه نیست، پس یک شب در زوگدیدی، کوتایسی یا خود مستیا برنامه‌ریزی
    کنید.

    جادهٔ زوگدیدی تا مستیا آسفالت است، اما 130 کیلومتر آن حدود سه ساعت طول می‌کشد: پیچ پشت پیچ، مقاطع
    باریک در تنگهٔ انگوری، مناطق ریزش سنگ و دام روی جاده. پس از باران یا آب‌شدن برف، سنگ روی جاده قاعده
    است نه استثنا. در زمستان جادهٔ مستیا معمولاً باز می‌ماند، اما لاستیک زمستانی الزامی است و زنجیر ارزش
    همراه بردن دارد.

    بالاتر از مستیا همه چیز عوض می‌شود. بخش پایانی تا اوشگولی شنی است و ارتفاع کف بالا می‌خواهد؛ مسیر
    دریاچه‌های کورولدی فقط 4x4 است و بردن خودروی کوتاه به آنجا تحت پوشش بیمهٔ اجاره نیست. سوخت در زوگدیدی
    و مستیا هست و در میان راه عملاً هیچ‌جا.
  best_for:
  - 'سفر چهارروزه: زوگدیدی، مستیا و اوشگولی'
  - برج‌های سوان و مناظر مرتفع در تابستان
  - درهٔ مارتویلی و نوکالاکوی در یک روز
  - اسکی زمستانی در هاتسوالی و تتنولدی
he:
  name: סמגרלו-סוואנטי העילית
  short: סמגרלו הסובטרופית עם הקניונים שלה וסוואנטי העילית עם המגדלים — אזור אחד ושני עולמות שונים לגמרי.
  body: >-
    האזור המנהלי הזה מחבר שתי ארצות שונות מאוד זו מזו. למטה שוכנת סמגרלו: חמה, לחה ושטוחה, נטועה מטעי
    תה והדרים ומכוסה צמחייה סבוכה, שמרכזה זוגדידי ומוזיאון ארמון דדיאני, מעון בסגנון אירופי עם גן בוטני
    ואוסף הקשור למשפחת בונפרטה. קניון מרטווילי על נהר אבאשה נצפה מסירה בין קירות גיר, ונוקאלקווי, היא
    ארכיאופוליס של המקורות הביזנטיים, שימרה חומות מן העת העתיקה המאוחרת ומנהרה היורדת אל הנהר.

    צפונה מתחיל הכביש לטפס בסכר אנגורי, קיר קשתי בגובה 271 מטר שמאחוריו משתרע מאגר ג'וארי הטורקיז הארוך,
    ותוך שלוש שעות הוא מעביר אתכם לאקלים אחר לגמרי. סוואנטי העילית היא מחוז הרים גבוה עם שפה, פוליפוניה
    ואדריכלות משלו. במסטיה נמצא מוזיאון סוואנטי, עשיר באיקונות ובכתבי יד, בין מגדלי אבן מבוצרים; מעליה
    אתרי הסקי הצוואלי וטטנולדי, ושביל יער מוביל אל קרחון צ'לאדי, כשעה וחצי הליכה מגשר הכביש. אושגולי,
    קבוצה של ארבעה כפרים בגובה 2,100 מטר למרגלות הר שחרה, רשומה ברשימת אונסקו והיא מן היישובים המאוכלסים
    דרך קבע הגבוהים באירופה. אל אגמי קורולדי מגיעים רק ברגל או בג'יפ.

    העונתיות כפולה. סמגרלו נגישה כל השנה, ואילו סוואנטי במיטבה מיוני עד ספטמבר, עם עונת חורף נפרדת לסקי.
    מי שרוצה גם את סמגרלו וגם את סוואנטי צריך לחלק את הימים בין השפלה להרים. שלושה עד ארבעה ימים הם המינימום
    ההגיוני, ורוב הנוסעים מקדישים לאזור הזה אפילו יותר.
  driving: >-
    הדבר הראשון שצריך לקבל הוא המרחק: מסטיה נמצאת כ-470 ק״מ מטביליסי ושמונה עד תשע שעות נסיעה. לעשות את
    זה הלוך ושוב ביום אחד אינו מציאותי, לכן תכננו לינה בזוגדידי, בקוטאיסי או במסטיה עצמה.

    הכביש מזוגדידי למסטיה סלול ותקין מבחינה טכנית, אבל 130 הקילומטרים אורכים כשלוש שעות: פניות רצופות,
    קטעים צרים בערוץ אנגורי, אזורי נפילת אבנים ובעלי חיים על הכביש. אחרי גשם או המסת שלגים אבנים על הדרך
    הן שגרה ולא חריג. בחורף הכביש למסטיה נשאר פתוח בדרך כלל, אך צמיגי חורף נדרשים וכדאי להחזיק שרשראות.

    מעל מסטיה הכול משתנה. הקטע האחרון לאושגולי הוא חצץ ודורש רכב עם גובה גחון; הדרך לאגמי קורולדי מיועדת
    ל-4x4 בלבד, והכנסת רכב נמוך לשם אינה מכוסה בביטוח ההשכרה. דלק יש בזוגדידי ובמסטיה ולמעשה בשום מקום
    ביניהן.
  best_for:
  - 'מסלול בן ארבעה ימים: זוגדידי, מסטיה ואושגולי'
