ar:
  name: سامغريلو-سفانيتي العليا
  short: سامغريلو شبه المدارية بأوديتها وسفانيتي العليا بأبراجها — إقليم واحد وعالمان مختلفان تماماً.
  body: >-
    يجمع هذا الإقليم الإداري بلدين مختلفين تماماً. في الأسفل تمتد سامغريلو: دافئة ورطبة ومنبسطة، مزروعة
    بالشاي والحمضيات، ومركزها زوغديدي ومتحف قصر دادياني، وهو مقر على الطراز الأوروبي بحديقة نباتية ومجموعة
    تتصل بعائلة بونابرت. ويُزار وادي مارتفيلي على نهر أباشا بالقوارب بين جدران كلسية، وتحتفظ نوكالاكيفي،
    وهي أركيوبوليس في المصادر البيزنطية، بأسوار من أواخر العصور القديمة وبنفق ينزل إلى النهر.

    وشمالاً يبدأ الطريق بالصعود عند سد إنغوري، وهو جدار قوسي بارتفاع 271 متراً يمتد خلفه خزان جفاري الفيروزي
    الطويل، وفي ثلاث ساعات يوصلك إلى مناخ آخر تماماً. سفانيتي العليا مقاطعة جبلية عالية لها لغتها وغناؤها
    متعدد الأصوات وعمارتها الخاصة. تضم ميستيا متحف سفانيتي، الغني بالأيقونات والمخطوطات، بين أبراج حجرية
    دفاعية؛ وفوقها منطقتا التزلج هاتسفالي وتيتنولدي، ويقود درب في الغابة، على بعد ساعة ونصف سيراً من جسر
    الطريق، إلى نهر تشالادي الجليدي. أما أوشغولي، وهي مجموعة من أربع قرى على ارتفاع 2,100 متر تحت جبل
    شخارا، فمدرجة على قائمة اليونسكو وهي من أعلى القرى المأهولة دائماً في أوروبا. ولا يُوصل إلى بحيرات
    كورولدي إلا سيراً أو بسيارة جيب.

    الموسمية هنا مزدوجة. سامغريلو متاحة طوال العام، بينما تبلغ سفانيتي أفضل حالاتها من يونيو إلى سبتمبر،
    مع موسم شتوي منفصل للتزلج. ثلاثة إلى أربعة أيام هي الحد الأدنى المعقول، ومعظم المسافرين يمنحون هذا
    الإقليم أكثر من ذلك.
  driving: >-
    أول ما ينبغي تقبله هو المسافة: ميستيا على بعد نحو 470 كم من تبليسي، وثماني إلى تسع ساعات من القيادة.
    والذهاب والعودة في يوم واحد غير واقعي، فخطط لمبيت في زوغديدي أو كوتايسي أو في ميستيا نفسها.

    الطريق من زوغديدي إلى ميستيا معبّد وسليم تقنياً، لكن 130 كيلومتراً تستغرق نحو ثلاث ساعات: منعطفات
    متواصلة، ومقاطع ضيقة في مضيق إنغوري، ومناطق سقوط صخور، ومواشٍ على الطريق. وبعد المطر أو ذوبان الثلوج
    تصبح الحجارة على الطريق قاعدة لا استثناء. وفي الشتاء يبقى طريق ميستيا مفتوحاً عادة، لكن إطارات الشتاء
    إلزامية ويستحسن حمل السلاسل.

    وفوق ميستيا يتغير كل شيء. المقطع الأخير إلى أوشغولي حصوي ويتطلب مركبة عالية الخلوص؛ ودرب بحيرات كورولدي
    للدفع الرباعي وحده، وإدخال سيارة منخفضة إلى أي منهما لا يغطيه تأمين الإيجار. الوقود متوفر في زوغديدي
    وميستيا ولا يكاد يوجد بينهما.
  best_for:
  - 'رحلة أربعة أيام: زوغديدي وميستيا وأوشغولي'
  - أبراج سفان ومشاهد الجبال العالية صيفاً
  - وادي مارتفيلي ونوكالاكيفي في يوم واحد
  - التزلج الشتوي في هاتسفالي وتيتنولدي
