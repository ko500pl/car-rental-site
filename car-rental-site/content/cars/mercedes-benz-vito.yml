ka:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 დიზელი · ავტომატი
  features:
  - 8 ადგილი
  - ტრანსფერებისთვის ოპტიმალური
  price_label: 200 ₾ / დღე
  body: >-
    თბილისში ტრანსფერების უმეტესობა ვიტოებით კეთდება და ერთი დღის შემდეგ მიზეზიც ცხადი ხდება. რვა ადგილი
    სამ რიგში, ბრტყელი იატაკი, ტროტუარის მხარეს მოსრიალე კარი და დიზელი, რომელიც დაახლოებით **8.0 ლ /
    100 კმ**-ს ხარჯავს — აეროპორტი–სასტუმრო–მარანი მარშრუტს იაფად და უპრობლემოდ ასრულებს.


    სალონი მარტივია და არა ფუფუნებითი; თუ ცალკეული სავარძლები და სრული სიჩუმე გჭირდებათ, უფრო დიდი მინივენები
    ნახეთ. სამაგიეროდ ვიტოს კატეგორიაში ყველაზე დაბალი ტარიფი აქვს — 200 ₾ დღეში, მესამე რიგის უკან ოთხი
    ჩემოდანი და იმდენად ვიწრო ძარა, რომ თბილისის ძველ უბნებში თავისუფლად მოძრაობს, რაც სრულზომიან ფურგონზე
    ვერ ითქმის.


    კლირენსი 165 მმ-ია, წამყვანი წინა, ამიტომ მარშრუტები ასფალტზე დაგეგმეთ: კახეთი, გორი, ბორჯომი, ქუთაისი,
    ბათუმი და მესტიამდე ასფალტი. უშგულის გრუნტი და თუშეთის გზა მხოლოდ მაღალი გამავლობის 4x4 კატეგორიისთვისაა
    — სხვა ავტომობილზე ხრეშზე მიღებული ზიანი დაზღვევის მიღმა რჩება. მძღოლი 23 წლიდან; დეტალები [პირობები](/terms/).
en:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 diesel · automatic
  features:
  - 8 seats
  - Ideal for transfers
  price_label: 200 ₾ / day
  body: >-
    Most transfer operators in Tbilisi run Vitos, and after a day in one the reason is obvious. Eight
    seats in three rows, a flat floor, a sliding door on the kerb side and a diesel engine returning around
    **8.0 l/100 km** — it handles the airport-to-hotel-to-winery routine cheaply and without drama.


    The interior is plain rather than luxurious; if you want individual seats and near-silence, look at
    the larger minivans. What the Vito gives you instead is the lowest daily rate in the category at 200
    ₾, four suitcases behind the third row, and a body narrow enough for the older streets of Tbilisi,
    which a full-size van is not.


    Clearance is 165 mm with front-wheel drive, so plan asphalt routes: Kakheti, Gori, Borjomi, Kutaisi,
    Batumi and the paved road as far as Mestia. The unpaved continuation to Ushguli and the road to Tusheti
    are restricted to the off-road 4x4 category — gravel damage in any other car falls outside the cover.
    Minimum driver age is 23; details on [Terms](/terms/).
ru:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 дизель · автомат
  features:
  - 8 мест
  - Оптимален для трансферов
  price_label: 200 ₾ / сутки
  body: >-
    Большинство трансферов в Тбилиси возят на Vito, и после первого же дня понимаешь почему. Восемь мест
    в три ряда, ровный пол, сдвижная дверь с тротуарной стороны и дизель с расходом около **8.0 л / 100
    км** — схема «аэропорт–отель–марани» отрабатывается дёшево и без нервов.


    Салон простой, а не роскошный: если нужны отдельные кресла и полная тишина, смотрите минивэны классом
    выше. Взамен Vito даёт самый низкий тариф в категории — 200 ₾ в сутки, четыре чемодана за третьим
    рядом и кузов достаточно узкий для старых тбилисских улиц, куда полноразмерный фургон уже не заедет.


    Клиренс 165 мм, привод передний, поэтому маршруты планируйте по асфальту: Кахетия, Гори, Боржоми,
    Кутаиси, Батуми и дорога до Местиа. Грунт до Ушгули и тушетская трасса — только для категории 4x4;
    повреждения на гравии вне этой категории страховка не покрывает. Водитель от 23 лет, подробности —
    на [Условия](/terms/).
fa:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 دیزلی · اتوماتیک
  features:
  - 8 صندلی
  - ایده‌آل برای ترانسفر
  price_label: 200 ₾ / روز
  body: >-
    بیشتر شرکت‌های ترانسفر در تفلیس با ویتو کار می‌کنند و پس از یک روز پشت فرمان آن دلیلش روشن می‌شود.
    هشت صندلی در سه ردیف، کف صاف، در کشویی در سمت پیاده‌رو و موتور دیزلی که حدود **8.0 لیتر در 100 کیلومتر**
    مصرف می‌کند — روال فرودگاه به هتل و از آنجا به شراب‌سازی را ارزان و بی‌دردسر انجام می‌دهد.


    فضای داخلی ساده است نه لوکس؛ اگر صندلی مجزا و سکوت کامل می‌خواهید، سراغ ون‌های بزرگ‌تر بروید. در عوض
    ویتو کم‌ترین نرخ روزانه این دسته را با 200 ₾ به شما می‌دهد، چهار چمدان پشت ردیف سوم جا می‌دهد و بدنه‌ای
    دارد به قدر کافی باریک برای خیابان‌های قدیمی تفلیس، کاری که از یک ون تمام‌اندازه برنمی‌آید.


    ارتفاع از زمین 165 میلی‌متر و دیفرانسیل جلو است، پس مسیرهای آسفالت را برنامه‌ریزی کنید: کاختی، گوری،
    بورجومی، کوتایسی، باتومی و جاده آسفالت تا مستیا. ادامه خاکی به سوی اوشگولی و جاده توشتی تنها به دسته
    آفرود 4x4 اختصاص دارد — خسارت جاده خاکی در هر خودروی دیگری خارج از پوشش است. حداقل سن راننده 23 سال؛
    جزئیات در صفحه [شرایط](/terms/).
he:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 דיזל · אוטומט
  features:
  - 8 מקומות
  - אידיאלי להסעות
  price_label: 200 ₾ / יום
  body: >-
    רוב מפעילי ההסעות בטביליסי עובדים עם ויטו, ואחרי יום אחד ברכב הסיבה ברורה. שמונה מקומות בשלוש שורות,
    רצפה שטוחה, דלת הזזה בצד המדרכה ומנוע דיזל שצורך כ-**8.0 ליטר ל-100 ק"מ** — הוא מבצע את השגרה של שדה
    תעופה–מלון–יקב בזול ובלי דרמות.


    הפנים פשוט ולא מפואר; אם אתם רוצים מושבים נפרדים ושקט כמעט מוחלט, הסתכלו על המיניוואנים הגדולים יותר.
    במקום זאת הוויטו נותן את התעריף היומי הנמוך בקטגוריה, 200 ₾, ארבע מזוודות מאחורי השורה השלישית ומרכב
    צר מספיק לרחובות הישנים של טביליסי, מה שוואן בגודל מלא אינו.


    מרווח הגחון 165 מ"מ וההנעה קדמית, ולכן תכננו מסלולי אספלט: קחתי, גורי, בורג'ומי, קוטאיסי, בטומי והכביש
    הסלול עד מסטיה. ההמשך הלא סלול לאושגולי והדרך לתושתי מוגבלים לקטגוריית השטח 4x4 — נזק מחצץ בכל רכב
    אחר נופל מחוץ לכיסוי. גיל הנהג המינימלי 23; פרטים בעמוד [תנאים](/terms/).
ar:
  name: Mercedes-Benz Vito
  summary: 2018–2022 · 2.1 ديزل · أوتوماتيك
  features:
  - 8 مقاعد
  - مثالية لعمليات النقل
  price_label: 200 ₾ / يوم
  body: >-
    معظم مشغّلي النقل في تبليسي يعملون بسيارات فيتو، وبعد يوم واحد خلف مقودها يتضح السبب. ثمانية مقاعد
    في ثلاثة صفوف، وأرضية مستوية، وباب منزلق من جهة الرصيف، ومحرك ديزل يستهلك نحو **8.0 لتر لكل 100 كم**
    — تؤدي روتين المطار ثم الفندق ثم مصنع النبيذ بثمن زهيد وبلا متاعب.


    المقصورة بسيطة لا فاخرة؛ فإن أردت مقاعد منفصلة وهدوءاً شبه تام، فانظر إلى الحافلات الصغيرة الأكبر.
    وما تمنحك إياه فيتو بدل ذلك هو أدنى سعر يومي في الفئة عند 200 ₾، وأربع حقائب خلف الصف الثالث، وهيكل
    ضيق بما يكفي لشوارع تبليسي القديمة، وهو ما لا تقدر عليه مركبة كاملة الحجم.


    الارتفاع عن الأرض 165 مم مع دفع أمامي، لذا خطّط لمسارات معبدة: كاخيتي، وغوري، وبورجومي، وكوتايسي،
    وباتومي، والطريق المعبد حتى ميستيا. أما الامتداد الترابي إلى أوشغولي والطريق إلى توشيتي فمقصوران على
    فئة الطرق الوعرة 4x4 — وأضرار الحصى في أي سيارة أخرى تقع خارج التغطية. الحد الأدنى لسن السائق 23 عاماً؛
    التفاصيل في صفحة [الشروط](/terms/).
