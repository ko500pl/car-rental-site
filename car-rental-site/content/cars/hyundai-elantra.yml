ka:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 ბენზინი · ავტომატი
  features:
  - 5 ადგილი, 2 ჩემოდანი
  - საწვავი ~6.5 ლ / 100 კმ
  - Apple CarPlay
  price_label: 82 ₾ / დღე
  body: >-
    ელანტრა იმ შემთხვევისთვისაა, როცა ეკონომ კლასის ფასი გინდათ, სივრცეზე კომპრომისის გარეშე. ეს სრულზომიანი
    სედანია და არა კომპაქტი: უკანა რიგში ფეხებისთვის ნამდვილი ადგილია, საბარგულში კი ორი დიდი ჩემოდანი
    და რამდენიმე რბილი ჩანთა თავისუფლად თავსდება.


    1.6 ბენზინის ძრავა ავტომატთან ერთად უპრეტენზიოა და მაგისტრალზე დაახლოებით **6.5 ლ / 100 კმ**-ს ხარჯავს,
    ქალაქში ოდნავ მეტს. სტანდარტულად აქვს Apple CarPlay — ეს კახეთსა და რაჭაში მნიშვნელოვანია, სადაც სასტუმრო
    სახლების მისამართები პირობითია და ტელეფონის ნავიგაცია ერთადერთი საიმედო ორიენტირია. ავტომატური კოლოფი
    თბილისის საცობებში დაღლილობას მნიშვნელოვნად ამცირებს, დეკემბრიდან აპრილამდე კი ავტომობილს ზამთრის
    საბურავები უდგას.


    ჩვეულებრივ ქირაობენ წყვილები კვირიანი მარშრუტისთვის და საქმიანი მოგზაურები, რომლებსაც დღეში 82 ₾-ად
    წყნარი და წარმოსადეგი ავტომობილი სჭირდებათ. დეპოზიტი 300 ₾-ია და გარბენი ქვეყნის შიგნით შეუზღუდავია.
    140 მმ კლირენსით ელანტრა ასფალტის მანქანაა — კახეთი, გორი, ბორჯომი, ბათუმი. გრუნტოვან უშგულსა და აბანოს
    უღელტეხილზე მოძრაობა მხოლოდ მაღალი გამავლობის 4x4 კატეგორიითაა ნებადართული; სრული წესი [კითხვები](/faq/)
    გვერდზეა ახსნილი.
en:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 petrol · automatic
  features:
  - 5 seats, 2 suitcases
  - Fuel ~6.5 l / 100 km
  - Apple CarPlay
  price_label: 82 ₾ / day
  body: >-
    Comfort per lari is what the Elantra does best. It is a full-size saloon rather than a compact, so
    rear passengers get real legroom and the boot swallows two large suitcases plus a couple of soft bags
    — noticeably more usable space than most cars at this end of the price list.


    The 1.6 petrol engine with an automatic gearbox is unfussy and returns around **6.5 l/100 km** on
    the motorway, a little more in Tbilisi traffic. Apple CarPlay comes as standard, which matters more
    than it sounds: phone navigation is the only reliable way to find guesthouses in Kakheti or Racha,
    where street addresses are approximate at best.


    Typical renters are couples on a week-long loop and business travellers who want a quiet, presentable
    car for 82 ₾ a day. With 140 mm of clearance the Elantra belongs on asphalt — Kakheti, Gori, Borjomi,
    Batumi. Gravel routes such as Ushguli or the Abano Pass to Omalo require an off-road 4x4; the full
    rule is explained on [FAQ](/faq/).
ru:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 бензин · автомат
  features:
  - 5 мест, 2 чемодана
  - Расход ~6.5 л / 100 км
  - Apple CarPlay
  price_label: 82 ₾ / сутки
  body: >-
    Elantra — вариант для тех, кому нужна цена эконом-класса без компромисса по простору. Это полноразмерный
    седан, а не компакт: сзади реально есть место для ног, а в багажник помещаются два больших чемодана
    и пара мягких сумок — заметно больше полезного пространства, чем у соседей по прайс-листу.


    Мотор 1.6 с автоматом неприхотлив и расходует около **6.5 л / 100 км** на трассе, чуть больше в тбилисских
    пробках. В базе есть Apple CarPlay, и это важнее, чем кажется: в Кахетии и Раче адреса гостевых домов
    условны, и навигация в телефоне — единственный надёжный ориентир.


    Обычно её берут пары на недельный маршрут и деловые гости, которым нужна тихая и презентабельная машина
    за 82 ₾ в сутки. Клиренс 140 мм означает асфальт: Кахетия, Гори, Боржоми, Батуми. Грунтовые дороги
    до Ушгули и перевал Абано открыты только для внедорожников 4x4 — правило целиком разобрано на [Вопросы](/faq/).
fa:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 بنزینی · اتوماتیک
  features:
  - 5 صندلی، 2 چمدان
  - مصرف سوخت ~6.5 لیتر / 100 کیلومتر
  - Apple CarPlay
  price_label: 82 ₾ / روز
  body: >-
    بهترین کاری که النترا انجام می‌دهد، آسایش در برابر هر لاری است. این خودرو یک سدان تمام‌اندازه است
    و نه کامپکت، بنابراین سرنشینان عقب فضای واقعی برای پا دارند و صندوق دو چمدان بزرگ به‌همراه چند ساک
    نرم را می‌بلعد — فضایی محسوس بیش از بیشتر خودروهای این بخش از فهرست قیمت.


    موتور 1.6 بنزینی با گیربکس اتوماتیک بی‌دردسر است و در بزرگراه حدود **6.5 لیتر در 100 کیلومتر** مصرف
    می‌کند، کمی بیشتر در ترافیک تفلیس. Apple CarPlay به‌صورت استاندارد نصب شده و این بیش از آنچه به نظر
    می‌رسد اهمیت دارد: مسیریابی با گوشی تنها راه مطمئن برای یافتن مهمان‌خانه‌ها در کاختی یا راچا است،
    جایی که نشانی خیابان در بهترین حالت تقریبی است.


    مستأجران معمول این خودرو زوج‌هایی در سفر یک‌هفته‌ای و مسافران کاری‌اند که خودرویی آرام و آبرومند با
    روزی 82 ₾ می‌خواهند. با 140 میلی‌متر فاصله از زمین، جای النترا روی آسفالت است — کاختی، گوری، بورجومی،
    باتومی. مسیرهای خاکی مانند اوشگولی یا گردنه آبانو به سمت اومالو به خودروی آفرود 4x4 نیاز دارند؛ شرح
    کامل این قاعده در [پرسش‌های متداول](/faq/) آمده است.
he:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 בנזין · אוטומט
  features:
  - 5 מקומות, 2 מזוודות
  - צריכת דלק ~6.5 ליטר / 100 ק"מ
  - Apple CarPlay
  price_label: 82 ₾ / יום
  body: >-
    נוחות לכל לארי היא מה שהאלנטרה עושה הכי טוב. זו סדאן בגודל מלא ולא מכונית קומפקטית, ולכן הנוסעים מאחור
    מקבלים מרווח רגליים אמיתי, ותא המטען בולע שתי מזוודות גדולות ועוד כמה תיקים רכים — הרבה יותר שטח שימושי
    מרוב הרכבים בקצה הזה של המחירון.


    מנוע 1.6 בנזין עם תיבה אוטומטית הוא מנוע חף מגחמות, וצורך כ-**6.5 ליטר ל-100 ק"מ** בנסיעה בין-עירונית,
    מעט יותר בפקקי טביליסי. Apple CarPlay מגיע כסטנדרט, וזה חשוב יותר משנשמע: ניווט מהטלפון הוא הדרך האמינה
    היחידה למצוא בתי הארחה בקחתי או בראצ'ה, שם כתובות רחוב הן הערכה גסה במקרה הטוב.


    השוכרים הטיפוסיים הם זוגות בסיבוב של שבוע ואנשי עסקים שרוצים רכב שקט ומכובד ב-82 ₾ ליום. עם מרווח
    גחון של 140 מ"מ מקומה של האלנטרה על אספלט — קחתי, גורי, בורג'ומי, בטומי. מסלולי חצץ כמו אושגולי או
    מעבר אבאנו לאומאלו מחייבים רכב שטח 4x4; הכלל המלא מוסבר בעמוד [שאלות נפוצות](/faq/).
ar:
  name: Hyundai Elantra
  summary: 2019–2023 · 1.6 بنزين · أوتوماتيك
  features:
  - 5 مقاعد، 2 حقيبة
  - استهلاك الوقود ~6.5 لتر / 100 كم
  - Apple CarPlay
  price_label: 82 ₾ / يوم
  body: >-
    أفضل ما تجيده إلنترا هو الراحة مقابل كل لاري. فهي سيدان كاملة الحجم لا سيارة مدمجة، ولذلك يحصل ركاب
    الخلف على مساحة حقيقية لأرجلهم، ويبتلع صندوقها حقيبتين كبيرتين وحقيبتين طريتين إضافيتين — مساحة أكثر
    فائدة بوضوح من معظم السيارات في هذا الطرف من قائمة الأسعار.


    محرك 1.6 بنزين مع ناقل حركة أوتوماتيكي محرك بلا متاعب، يستهلك نحو **6.5 لتر لكل 100 كم** على الطريق
    السريع، وأكثر قليلاً في زحام تبليسي. ويأتي Apple CarPlay قياسياً، وهو أهم مما يبدو: فالملاحة عبر الهاتف
    هي الوسيلة الموثوقة الوحيدة للعثور على بيوت الضيافة في كاخيتي أو راتشا، حيث تظل عناوين الشوارع تقريبية
    في أحسن الأحوال.


    المستأجرون المعتادون هم أزواج في جولة أسبوع ومسافرو أعمال يريدون سيارة هادئة ولائقة بـ 82 ₾ يومياً.
    وبارتفاع 140 مم عن الأرض، مكان إلنترا هو الأسفلت — كاخيتي وغوري وبورجومي وباتومي. أما المسارات الترابية
    مثل أوشغولي أو ممر أبانو إلى أومالو فتتطلب سيارة طرق وعرة 4x4؛ والقاعدة كاملة موضحة في [الأسئلة الشائعة](/faq/).
