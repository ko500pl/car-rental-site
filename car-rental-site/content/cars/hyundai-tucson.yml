ka:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 ბენზინი · AWD
  features:
  - 5 ადგილი, 3 ჩემოდანი
  - კლირენსი 181 მმ
  - პანორამული ჭერი
  price_label: 130 ₾ / დღე
  body: >-
    ტუსონი კროსოვერების კატეგორიაში ყველაზე იაფი შესვლაა და რეგიონული მოგზაურობის უმეტესობისთვის სავსებით
    საკმარისი ავტომობილია. 181 მმ კლირენსი და სრული წამყვანი ფარავს იმ გზებს, რომლებზეც სედანით სიარული
    უხერხულია: გერგეტისკენ ასვლა, ამბროლაურის ზემოთ სერპანტინები, სიღნაღის მარნებამდე ბოლო კილომეტრები.


    2.0 ბენზინის ძრავა პატიოსანია, თუმცა არა ეკონომიური — გათვალეთ დაახლოებით **8.5 ლ / 100 კმ**, მთაში
    კი მეტიც. სალონში პანორამული ჭერია და საქართველოს სამხედრო გზაზე ეს რეალურად ცვლის შთაბეჭდილებას:
    უკან მჯდომები ქედებს ფანჯარაზე დახრის გარეშე ხედავენ. ავტომატური კოლოფი და სრული წამყვანი ზამთარშიც
    კარგად მუშაობს ბაკურიანისა და გუდაურის მიმართულებით — დეკემბრიდან აპრილამდე ზამთრის საბურავები სტანდარტულად
    უდგას.


    საბარგულში სამი ჩემოდანი დგება, სალონში ხუთი ადამიანი კამათის გარეშე თავსდება. ჩვეულებრივ ქირაობენ
    წყვილები ათდღიან მარშრუტზე და ერთბავშვიანი ოჯახები. ტარიფი 130 ₾ დღეში, დეპოზიტი 600 ₾, მძღოლი 23
    წლიდან. სვანეთისა და თუშეთის გრუნტისთვის კვლავ მაღალი გამავლობის 4x4 გჭირდებათ — გამონაკლისები [პირობები](/terms/)
    გვერდზეა აღწერილი.
en:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 petrol · AWD
  features:
  - 5 seats, 3 suitcases
  - Ground clearance 181 mm
  - Panoramic roof
  price_label: 130 ₾ / day
  body: >-
    Renting a Tucson is the cheapest way into the crossover category, and for most regional trips it is
    all the car you need. Ground clearance of 181 mm and all-wheel drive cover the roads that put people
    off in a saloon: the climb towards Gergeti, the switchbacks above Ambrolauri, the last few kilometres
    to a winery outside Sighnaghi.


    The 2.0 petrol engine is honest rather than economical — count on around **8.5 l/100 km**, and more
    if you spend the day in low gears. Inside, the panoramic roof genuinely changes the drive along the
    Georgian Military Highway: passengers in the back can see the ridgelines without leaning into the
    window.


    Three suitcases fit in the boot and five people fit without argument. Renters are usually couples
    travelling for ten days or families with one child. The rate is 130 ₾ a day, the deposit 600 ₾, and
    the minimum driver age 23. For the unpaved roads of Svaneti and Tusheti you still need an off-road
    4x4 — the exclusions are set out on [Terms](/terms/).
ru:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 бензин · AWD
  features:
  - 5 мест, 3 чемодана
  - Клиренс 181 мм
  - Панорамная крыша
  price_label: 130 ₾ / сутки
  body: >-
    Tucson — самый доступный вход в категорию кроссоверов, и для большинства поездок по регионам этой
    машины достаточно. Клиренс 181 мм и полный привод закрывают те дороги, на которые не хочется соваться
    на седане: подъём к Гергети, серпантины выше Амбролаури, последние километры к марани под Сигнахи.


    Мотор 2.0 честный, но не экономичный — закладывайте около **8.5 л / 100 км**, а в горах и больше.
    В салоне панорамная крыша, и на Военно-Грузинской дороге она реально меняет впечатление: пассажиры
    сзади видят хребты, не наклоняясь к окну.


    Три чемодана входят в багажник, пятеро размещаются без споров. Чаще всего берут пары на десять дней
    и семьи с одним ребёнком. Тариф 130 ₾ в сутки, депозит 600 ₾, водитель от 23 лет. Для грунтовки Сванетии
    и Тушетии всё равно нужен внедорожник 4x4 — исключения перечислены на [Условия](/terms/).
fa:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 بنزینی · AWD
  features:
  - 5 صندلی، 3 چمدان
  - ارتفاع از زمین 181 میلی‌متر
  - سقف پانوراما
  price_label: 130 ₾ / روز
  body: >-
    اجاره توسان ارزان‌ترین راه ورود به دسته کراس‌اوور است و برای بیشتر سفرهای منطقه‌ای دقیقاً همان اندازه
    خودرویی است که لازم دارید. 181 میلی‌متر فاصله از زمین به‌همراه چهار چرخ محرک همان جاده‌هایی را پوشش
    می‌دهد که آدم را از رفتن با سدان منصرف می‌کنند: سربالایی گرگتی، پیچ‌های بالای آمبرولائوری، چند کیلومتر
    آخر تا یک شراب‌سازی بیرون سیغناغی.


    موتور 2.0 بنزینی صادق است، نه کم‌مصرف — روی حدود **8.5 لیتر در 100 کیلومتر** حساب کنید و بیشتر اگر
    تمام روز را با دنده سنگین بالا بروید. در کابین، سقف پانوراما واقعاً حال‌وهوای جاده نظامی گرجستان را
    عوض می‌کند: سرنشینان عقب بدون خم شدن به سمت پنجره خط الرأس کوه‌ها را می‌بینند.


    سه چمدان در صندوق جا می‌گیرد و پنج نفر بدون بحث می‌نشینند. مستأجران معمولاً زوج‌هایی با سفر ده‌روزه‌اند
    یا خانواده‌هایی با یک کودک. نرخ روزی 130 ₾، ودیعه 600 ₾ و حداقل سن راننده 23 سال است. برای جاده‌های
    خاکی سوانتی و توشتی همچنان به یک 4x4 آفرود نیاز دارید — استثناها در صفحه [شرایط](/terms/) آمده است.
he:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 בנזין · AWD
  features:
  - 5 מקומות, 3 מזוודות
  - מרווח גחון 181 מ"מ
  - גג פנורמי
  price_label: 130 ₾ / יום
  body: >-
    שכירת טוסון היא הדרך הזולה ביותר להיכנס לקטגוריית הקרוסאוברים, ולרוב הטיולים האזוריים היא בדיוק הרכב
    שדרוש. מרווח גחון של 181 מ"מ והנעה כפולה מכסים בדיוק את הדרכים שמרתיעות אנשים בסדאן: העלייה לכיוון
    גרגטי, הסרפנטינות מעל אמברולאורי, הקילומטרים האחרונים אל יקב מחוץ לסיגנאגי.


    מנוע 2.0 בנזין הוא כן יותר מאשר חסכוני — קחו בחשבון כ-**8.5 ליטר ל-100 ק"מ**, ויותר אם תבלו את היום
    בהילוכים נמוכים. בפנים, הגג הפנורמי באמת משנה את הנסיעה בכביש הצבא הגאורגי: הנוסעים מאחור רואים את
    קווי הרכס בלי להיצמד לחלון.


    שלוש מזוודות נכנסות לתא המטען וחמישה אנשים נכנסים בלי ויכוח. השוכרים הם בדרך כלל זוגות לעשרה ימים
    או משפחות עם ילד אחד. התעריף 130 ₾ ליום, הפיקדון 600 ₾ וגיל הנהג המינימלי 23. לדרכים הלא סלולות של
    סוואנטי ותושתי עדיין דרוש רכב שטח 4x4 — החריגים מפורטים בעמוד [תנאים](/terms/).
ar:
  name: Hyundai Tucson
  summary: 2020–2023 · 2.0 بنزين · AWD
  features:
  - 5 مقاعد، 3 حقائب
  - ارتفاع عن الأرض 181 مم
  - سقف بانورامي
  price_label: 130 ₾ / يوم
  body: >-
    استئجار توسان هو أرخص طريق للدخول إلى فئة الكروس أوفر، وهي في معظم الرحلات الإقليمية كل ما تحتاج إليه
    فعلاً. فارتفاع 181 مم عن الأرض والدفع الرباعي يغطيان تحديداً تلك الطرق التي تثني الناس عن السفر بسيارة
    سيدان: الصعود نحو غيرغيتي، والمنعطفات فوق أمبرولاوري، والكيلومترات الأخيرة إلى مصنع نبيذ خارج سيغناغي.


    محرك 2.0 بنزين محرك صادق أكثر منه اقتصادي — احسب نحو **8.5 لتر لكل 100 كم**، وأكثر إن أمضيت اليوم
    في التروس المنخفضة. وفي الداخل، يغيّر السقف البانورامي تجربة القيادة على الطريق العسكري الجورجي فعلاً:
    يرى الركاب في الخلف قمم الجبال دون أن يميلوا نحو النافذة.


    تتسع ثلاث حقائب في الصندوق ويجلس خمسة أشخاص دون جدال. والمستأجرون عادة أزواج يسافرون عشرة أيام أو
    أسر بطفل واحد. السعر 130 ₾ يومياً، والتأمين 600 ₾، والحد الأدنى لسن السائق 23 عاماً. أما الطرق غير
    المعبدة في سفانيتي وتوشيتي فما زالت تتطلب سيارة طرق وعرة 4x4 — والاستثناءات مذكورة في صفحة [الشروط](/terms/).
