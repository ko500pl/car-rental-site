ka:
  name: Ford Transit
  summary: 2019–2023 · 2.0 დიზელი · მექანიკა
  features:
  - 3 ადგილი, 11 მ³
  - ტვირთამწეობა 1200 კგ
  price_label: 185 ₾ / დღე
  body: >-
    თერთმეტი კუბური მეტრი სატვირთო სივრცე და 1 200 კგ ტვირთამწეობა ჩვენი კომერციული კლიენტების ამოცანების
    უმეტესობას ფარავს: მაღაზიის შევსება, ბინის გადატანა საბურთალოზე, სამონტაჟო ბრიგადა, რომელიც თვე მთელს
    თბილისსა და რუსთავს შორის მუშაობს. კაბინაში სამი ადგილი, მექანიკური კოლოფი და 2.0 დიზელი, რომელიც
    ცარიელზე დაახლოებით **9.5 ლ / 100 კმ**-ს მოიხმარს.


    ტრანზიტს დიდ ფურგონზე ადვილად პოულობთ ადგილს. 170 მმ კლირენსითა და ზომიერი სიმაღლით ის ეტევა მიწისქვეშა
    დატვირთვის ზონებში და ძველი უბნების ეზოს კარიბჭეებში, სადაც მაღალჭერიან ფურგონს ქუჩაში დგომა უწევს.


    აქ გრძელვადიანი ჯავშანი ნორმაა: ხელმისაწვდომია თვიური და წლიური კორპორატიული ხელშეკრულება, ძარაზე
    ბრენდირება შეთანხმებით დაიშვება, ხოლო დღიური 185 ₾ ვადის ზრდასთან ერთად მკვეთრად ეცემა. ორი წესი გახსოვდეთ:
    ტვირთი დამაგრებული უნდა იყოს — სატვირთო განყოფილების დაზიანებას სტანდარტული დაზღვევა არ ფარავს — და
    მესამე პირებისთვის საკურიერო თუ სატრანსპორტო საქმიანობა წინასწარ წერილობით თანხმობას საჭიროებს. მოგვწერეთ
    [კონტაქტი](/contact/).
en:
  name: Ford Transit
  summary: 2019–2023 · 2.0 diesel · manual
  features:
  - 3 seats, 11 m³
  - Payload 1,200 kg
  price_label: 185 ₾ / day
  body: >-
    Eleven cubic metres of load space and a payload of 1,200 kg cover the great majority of jobs our commercial
    clients bring us: a shop restocking, a flat moving across Saburtalo, an installation crew working
    between Tbilisi and Rustavi for a month. Three seats in the cab, a manual gearbox and a 2.0 diesel
    that uses about **9.5 l/100 km** unladen.


    The Transit is easier to place than a bigger van. With 170 mm of clearance and a moderate height it
    fits most underground loading bays and the courtyard gates of the older districts, where a high-roof
    van has to stay out on the street.


    Long bookings are the norm here. Monthly and annual corporate contracts are available, branding on
    the bodywork is permitted by arrangement, and the daily 185 ₾ falls sharply as the term grows. Two
    rules to keep in mind: the load must be secured, since damage to the cargo compartment is not covered
    by the standard insurance, and courier or haulage work for third parties needs written consent in
    advance. Write to us via [Contact](/contact/).
ru:
  name: Ford Transit
  summary: 2019–2023 · 2.0 дизель · механика
  features:
  - 3 места, 11 м³
  - Грузоподъёмность 1200 кг
  price_label: 185 ₾ / сутки
  body: >-
    Одиннадцать кубометров грузового отсека и грузоподъёмность 1 200 кг закрывают большинство задач, с
    которыми к нам приходят компании: пополнение магазина, переезд квартиры на Сабуртало, монтажная бригада,
    работающая месяц между Тбилиси и Рустави. Три места в кабине, механическая коробка и дизель 2.0 с
    расходом порядка **9.5 л / 100 км** порожняком.


    Transit проще «поставить», чем крупный фургон. Клиренс 170 мм и умеренная высота позволяют заезжать
    в подземные зоны погрузки и в дворовые арки старых районов, где высокому фургону остаётся только улица.


    Долгая аренда здесь — норма: доступны помесячные и годовые корпоративные договоры, брендирование кузова
    разрешено по согласованию, а суточные 185 ₾ с увеличением срока заметно снижаются. Два правила: груз
    должен быть закреплён — повреждения грузового отсека стандартная страховка не покрывает, — а курьерская
    работа и перевозки для третьих лиц требуют предварительного письменного согласия. Пишите нам через
    [Контакты](/contact/).
fa:
  name: Ford Transit
  summary: 2019–2023 · 2.0 دیزلی · دنده‌ای
  features:
  - 3 صندلی، 11 متر مکعب
  - ظرفیت بار 1,200 کیلوگرم
  price_label: 185 ₾ / روز
  body: >-
    یازده متر مکعب فضای بار و ظرفیت 1,200 کیلوگرم بخش بزرگی از کارهایی را که مشتریان تجاری ما می‌آورند
    پوشش می‌دهد: شارژ دوباره یک فروشگاه، اسباب‌کشی یک آپارتمان در سابورتالو، تیم نصبی که یک ماه میان تفلیس
    و روستاوی کار می‌کند. سه صندلی در کابین، گیربکس دستی و موتور 2.0 دیزلی که بدون بار حدود **9.5 لیتر
    در 100 کیلومتر** مصرف می‌کند.


    جای دادن ترانزیت از یک ون بزرگ‌تر آسان‌تر است. با 170 میلی‌متر فاصله از زمین و ارتفاع متعادل، در بیشتر
    محوطه‌های بارگیری زیرزمینی و دروازه‌های حیاط محله‌های قدیمی جا می‌شود، جایی که یک ون سقف‌بلند باید
    بیرون در خیابان بماند.


    رزروهای بلندمدت اینجا قاعده‌اند. قرارداد شرکتی ماهانه و سالانه در دسترس است، برندینگ روی بدنه با هماهنگی
    مجاز است و نرخ روزانه 185 ₾ با طولانی‌تر شدن مدت به‌شدت پایین می‌آید. دو قاعده را به یاد داشته باشید:
    بار باید مهار شود، چون خسارت محفظه بار در بیمه استاندارد پوشش ندارد، و کار پیک یا باربری برای اشخاص
    ثالث به اجازه کتبی پیشین نیاز دارد. از راه [تماس](/contact/) برای ما بنویسید.
he:
  name: Ford Transit
  summary: 2019–2023 · 2.0 דיזל · ידני
  features:
  - 3 מקומות, 11 מ"ק
  - כושר העמסה 1,200 ק"ג
  price_label: 185 ₾ / יום
  body: >-
    אחד-עשר מטרים מעוקבים של נפח העמסה וכושר נשיאה של 1,200 ק"ג מכסים את הרוב המכריע של העבודות שהלקוחות
    המסחריים שלנו מביאים: חנות שממלאת מלאי, דירה שעוברת ברחבי סבורטלו, צוות התקנה שעובד חודש בין טביליסי
    לרוסתאבי. שלושה מקומות בתא הנהג, תיבת הילוכים ידנית ומנוע דיזל 2.0 שצורך כ-**9.5 ליטר ל-100 ק"מ**
    בנסיעה ריקה.


    את הטרנזיט קל יותר למקם מוואן גדול יותר. עם מרווח גחון של 170 מ"מ וגובה מתון הוא נכנס לרוב רציפי הפריקה
    התת-קרקעיים ולשערי החצרות של השכונות הישנות, שם ואן עם גג גבוה נאלץ להישאר ברחוב.


    הזמנות ארוכות הן הנורמה כאן. חוזים עסקיים חודשיים ושנתיים זמינים, מיתוג על המרכב מותר בתיאום, והתעריף
    היומי של 185 ₾ יורד בחדות ככל שהתקופה מתארכת. שני כללים לזכור: את המטען חובה לקשור, שכן נזק לתא המטען
    אינו מכוסה בביטוח הסטנדרטי, ועבודת שליחויות או הובלה עבור צד שלישי מחייבת הסכמה בכתב מראש. כתבו לנו
    דרך [צור קשר](/contact/).
ar:
  name: Ford Transit
  summary: 2019–2023 · 2.0 ديزل · يدوي
  features:
  - 3 مقاعد، 11 م³
  - حمولة 1,200 كغ
  price_label: 185 ₾ / يوم
  body: >-
    أحد عشر متراً مكعباً من حيز التحميل وحمولة 1,200 كغ تغطي الغالبية العظمى من المهام التي يجلبها إلينا
    عملاؤنا التجاريون: متجر يعيد تعبئة مخزونه، وشقة تنتقل داخل سابورتالو، وفريق تركيب يعمل شهراً بين تبليسي
    وروستافي. ثلاثة مقاعد في المقصورة، وناقل حركة يدوي، ومحرك ديزل 2.0 يستهلك نحو **9.5 لتر لكل 100 كم**
    فارغاً.


    من الأسهل إيجاد مكان لترانزيت مقارنةً بمركبة أكبر. فبارتفاع 170 مم عن الأرض وبعلوّ معتدل تدخل معظم
    أرصفة التحميل تحت الأرض وبوابات أفنية الأحياء القديمة، حيث تضطر المركبة عالية السقف إلى البقاء في
    الشارع.


    الحجوزات الطويلة هي القاعدة هنا. عقود الشركات الشهرية والسنوية متاحة، ووضع العلامة التجارية على الهيكل
    مسموح بالاتفاق، وسعر 185 ₾ اليومي ينخفض بحدة كلما طالت المدة. قاعدتان تستحقان التذكر: يجب تثبيت الحمولة،
    لأن الضرر الذي يلحق بحيز الشحن غير مشمول بالتأمين القياسي، كما أن أعمال التوصيل أو النقل لحساب الغير
    تستلزم موافقة خطية مسبقة. راسلنا عبر [اتصل بنا](/contact/).
