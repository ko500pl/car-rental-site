ka:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 დიზელი · ავტომატი
  features:
  - 5 ადგილი, 3 ჩემოდანი
  - ადაპტიური კრუიზ-კონტროლი
  price_label: 290 ₾ / დღე
  body: >-
    გრძელი მანძილია ის, სადაც E-Class თავის ტარიფს იმართლებს. ადაპტიური კრუიზ-კონტროლი წინა ავტომობილთან
    დისტანციას თავად ინარჩუნებს თბილისი–ბათუმის მაგისტრალზე და 370 კმ-ის შემდეგ მანქანიდან იმ დაძაბულობის
    გარეშე გამოდიხართ, რომელსაც იაფი სედანი გიტოვებთ. 2.0 დიზელი წყნარი ტიპისაა: მაგისტრალზე დაახლოებით
    **6.2 ლ / 100 კმ**, ერთი ბაკი კი თბილისი–ბათუმს და ქუთაისამდე დაბრუნებას თავისუფლად ფარავს.


    უკანა წამყვანი ზამთარში გასათვალისწინებელია. მარილით დამუშავებულ ცენტრალურ მაგისტრალებზე ზამთრის საბურავებით
    პრობლემა არ არის, თუმცა კურორტისკენ გაუწმენდავ ასაწევზე წინა ან სრული წამყვანი უფრო მოსახერხებელია.


    ტიპური კლიენტები არიან დელეგაციები, ქორწილები და კომპანიები, რომლებიც სტუმრებს მასპინძლობენ — ხშირად
    მძღოლის სერვისით და არა თვითონ საჭესთან. ხუთი ადგილი, სამი ჩემოდანი, დღეში 290 ₾, დეპოზიტი 1 000 ₾,
    ასაკი 25 წლიდან. 130 მმ კლირენსით ის ასფალტზე რჩება; უშგულის გზა და თუშეთი მაღალი გამავლობის 4x4-ს
    მოითხოვს. სრული პირობები — [პირობები](/terms/).
en:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 diesel · automatic
  features:
  - 5 seats, 3 suitcases
  - Adaptive cruise control
  price_label: 290 ₾ / day
  body: >-
    Long distances are where the E-Class earns its rate. Adaptive cruise control holds the gap to the
    car in front on the Tbilisi–Batumi motorway, and after 370 km you step out without the stiffness a
    cheaper saloon leaves you with. The 2.0 diesel is the quiet sort: about **6.2 l/100 km** at highway
    speed, and one tank comfortably covers Tbilisi to Batumi and back as far as Kutaisi.


    Rear-wheel drive is worth a thought in winter. On the salted main highways it is untroubled on the
    winter tyres we fit from December to April, but on an unploughed climb to a ski resort a front- or
    all-wheel-drive car is the easier tool.


    Typical clients are delegations, weddings and companies hosting visitors — often with our chauffeur
    service rather than driving themselves. Five seats, three suitcases, 290 ₾ a day, a 1,000 ₾ deposit
    and a minimum age of 25. With 130 mm of clearance it stays on asphalt; the Ushguli road and Tusheti
    call for an off-road 4x4. The full conditions are on [Terms](/terms/).
ru:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 дизель · автомат
  features:
  - 5 мест, 3 чемодана
  - Адаптивный круиз-контроль
  price_label: 290 ₾ / сутки
  body: >-
    Длинные перегоны — то, ради чего берут E-Class. Адаптивный круиз-контроль сам держит дистанцию до
    идущей впереди машины на трассе Тбилиси–Батуми, и после 370 км вы выходите без той усталости, которую
    оставляет седан попроще. Дизель 2.0 из тихих: около **6.2 л / 100 км** на шоссе, одного бака хватает
    на дорогу до Батуми и обратно до Кутаиси.


    Задний привод зимой стоит держать в голове. На посыпанных солью магистралях с зимней резиной вопросов
    нет, но на нерасчищенном подъёме к горнолыжному курорту передний или полный привод удобнее.


    Типичные клиенты — делегации, свадьбы и компании, принимающие гостей; часто с нашим водителем, а не
    за рулём самостоятельно. Пять мест, три чемодана, 290 ₾ в сутки, депозит 1 000 ₾, возраст от 25 лет.
    С клиренсом 130 мм машина остаётся на асфальте: дорога к Ушгули и Тушетия требуют внедорожника 4x4.
    Полные условия — на [Условия](/terms/).
fa:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 دیزلی · اتوماتیک
  features:
  - 5 صندلی، 3 چمدان
  - کروز کنترل تطبیقی
  price_label: 290 ₾ / روز
  body: >-
    مسافت‌های طولانی همان جایی است که E-Class نرخش را توجیه می‌کند. کروز کنترل تطبیقی فاصله با خودروی
    جلو را در بزرگراه تفلیس–باتومی نگه می‌دارد و پس از 370 کیلومتر بدون آن خشکی و کوفتگی که یک سدان ارزان‌تر
    برایتان می‌گذارد پیاده می‌شوید. موتور 2.0 دیزلی از نوع ساکت است: حدود **6.2 لیتر در 100 کیلومتر**
    در سرعت بزرگراهی، و یک باک به‌راحتی تفلیس تا باتومی و بازگشت تا کوتایسی را پوشش می‌دهد.


    دیفرانسیل عقب در زمستان جای فکر کردن دارد. روی بزرگراه‌های نمک‌پاشی‌شده با لاستیک زمستانی که از دسامبر
    تا آوریل نصب می‌کنیم مشکلی ندارد، اما در سربالایی برف‌روبی‌نشده به سمت پیست اسکی، خودروی دیفرانسیل‌جلو
    یا چهار چرخ محرک ابزار ساده‌تری است.


    مشتریان معمول این خودرو هیئت‌ها، عروسی‌ها و شرکت‌هایی هستند که میهمان می‌پذیرند — اغلب با خدمات راننده
    ما به‌جای رانندگی شخصی. پنج صندلی، سه چمدان، روزی 290 ₾، ودیعه 1,000 ₾ و حداقل سن 25 سال. با 130 میلی‌متر
    فاصله از زمین روی آسفالت می‌ماند؛ جاده اوشگولی و توشتی به آفرود 4x4 نیاز دارند. شرایط کامل در صفحه
    [شرایط](/terms/) آمده است.
he:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 דיזל · אוטומט
  features:
  - 5 מקומות, 3 מזוודות
  - בקרת שיוט אדפטיבית
  price_label: 290 ₾ / יום
  body: >-
    מרחקים ארוכים הם המקום שבו ה-E-Class מצדיקה את המחיר שלה. בקרת שיוט אדפטיבית שומרת על המרווח מהרכב
    שלפניה בכביש טביליסי–בטומי, ואחרי 370 ק"מ אתם יוצאים ממנה בלי הנוקשות שסדאן זולה יותר משאירה. מנוע
    הדיזל 2.0 שייך לסוג השקט: כ-**6.2 ליטר ל-100 ק"מ** במהירות בין-עירונית, ומיכל אחד מכסה בנוחות טביליסי–בטומי
    וחזרה עד קוטאיסי.


    על ההנעה האחורית כדאי לחשוב בחורף. בכבישים הראשיים המפוזרים במלח היא אינה מתקשה עם צמיגי החורף שאנחנו
    מרכיבים מדצמבר עד אפריל, אבל בעלייה לא מפולסת אל אתר סקי רכב עם הנעה קדמית או כפולה יהיה הכלי הנוח
    יותר.


    הלקוחות הטיפוסיים הם משלחות, חתונות וחברות שמארחות אורחים — לרוב עם שירות הנהג שלנו ולא בנהיגה עצמית.
    חמישה מקומות, שלוש מזוודות, 290 ₾ ליום, פיקדון 1,000 ₾ וגיל מינימלי 25. עם מרווח גחון של 130 מ"מ היא
    נשארת על אספלט; הדרך לאושגולי ולתושתי מחייבת רכב שטח 4x4. התנאים המלאים בעמוד [תנאים](/terms/).
ar:
  name: Mercedes-Benz E-Class
  summary: 2019–2022 · 2.0 ديزل · أوتوماتيك
  features:
  - 5 مقاعد، 3 حقائب
  - مثبّت سرعة تكيّفي
  price_label: 290 ₾ / يوم
  body: >-
    المسافات الطويلة هي حيث تستحق الفئة E سعرها. فمثبّت السرعة التكيّفي يحافظ على المسافة من السيارة أمامك
    على طريق تبليسي–باتومي السريع، وبعد 370 كم تنزل منها دون التيبّس الذي تتركه سيدان أرخص. ومحرك الديزل
    2.0 من النوع الهادئ: نحو **6.2 لتر لكل 100 كم** على سرعة الطريق السريع، وخزان واحد يغطي بارتياح تبليسي–باتومي
    والعودة حتى كوتايسي.


    يستحق الدفع الخلفي وقفة في الشتاء. فعلى الطرق الرئيسية المرشوشة بالملح لا يجد أي صعوبة مع الإطارات
    الشتوية التي نركّبها من ديسمبر إلى أبريل، لكن على صعود غير مكسوح إلى منتجع تزلج تبقى سيارة بدفع أمامي
    أو رباعي هي الأداة الأسهل.


    عملاؤنا المعتادون هنا وفود وأعراس وشركات تستقبل زواراً — وغالباً مع خدمة السائق لدينا بدل القيادة
    الذاتية. خمسة مقاعد، وثلاث حقائب، و290 ₾ يومياً، وتأمين 1,000 ₾، وحد أدنى للسن 25 عاماً. وبارتفاع
    130 مم عن الأرض تبقى على الأسفلت؛ أما طريق أوشغولي وتوشيتي فيتطلبان سيارة طرق وعرة 4x4. الشروط كاملة
    في صفحة [الشروط](/terms/).
