ka:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 დიზელი · 4WD
  features:
  - 7–8 ადგილი
  - კლირენსი 210 მმ
  - ჯგუფური ტურების ფავორიტი
  price_label: 290 ₾ / დღე
  body: >-
    გიდები და ფოტოგრაფები დელიკას თვეებით ადრე ჯავშნიან, რადგან პარკში სხვა ავტომობილი ორივე ამოცანას
    ერთდროულად ვერ ასრულებს. ეს მინივენის ძარაა — 7–8 ადგილი, გვერდზე მოსრიალე კარები, მაღალი ფანჯრები,
    საიდანაც ყველა ხედავს — ნამდვილ 4WD შასიზე, 210 მმ კლირენსით.


    სწორედ ეს კომბინაცია იძლევა საშუალებას, რომ რვასულიანი ჯგუფი უშგულში ერთი მანქანით წავიდეს და არა
    ორი კროსოვერით: დელიკა მაღალი გამავლობის კატეგორიაშია, რომელსაც სვანეთისა და თუშეთის გრუნტოვან გზებზე
    მოძრაობის უფლება აქვს. 2.2 დიზელი ამ ზომისთვის ზომიერია — დაახლოებით **9.0 ლ / 100 კმ**, ავტომატი
    კი გრძელ ასაწევებს დრამატიზმს აცლის.


    კომპრომისებიც პატიოსანია: ავტომობილი მაღალია, ამიტომ მთის გვერდითი ქარი და დაბალი ავტოფარეხები ყურადღებას
    მოითხოვს, ხოლო რვავე ადგილის დაკავებისას ბარგის სივრცე მცირეა — ოთხი ჩემოდანი ბოლო რიგის დაკეცვის
    შემდეგ ეტევა. ტარიფი 290 ₾ დღეში, დეპოზიტი 1 200 ₾, მძღოლი 25 წლიდან. ზაფხულში თარიღები სწრაფად იკავება
    — დაგვირეკეთ ადრე [კონტაქტი](/contact/).
en:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 diesel · 4WD
  features:
  - 7–8 seats
  - Ground clearance 210 mm
  - A favourite for group tours
  price_label: 290 ₾ / day
  body: >-
    Guides and photographers book the Delica months in advance, because nothing else in the fleet does
    both jobs at once. It is a minivan body — seven to eight seats, sliding doors, upright windows everyone
    can see out of — sitting on a genuine four-wheel-drive chassis with 210 mm of ground clearance.


    That combination is why a group of eight can reach Ushguli in one vehicle instead of two crossovers:
    the Delica belongs to the off-road category that is permitted on the unpaved roads of Svaneti and
    Tusheti. The 2.2 diesel is modest for the size at roughly **9.0 l/100 km**, and the automatic gearbox
    takes the drama out of long climbs.


    The trade-offs are honest ones. It is tall, so mountain crosswinds and low garage entrances need attention,
    and with all eight seats occupied the space behind the rear row is small — four suitcases fit once
    that row is folded. The rate is 290 ₾ a day, the deposit 1,200 ₾, drivers from 25. Summer dates go
    quickly, so call early via [Contact](/contact/).
ru:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 дизель · 4WD
  features:
  - 7–8 мест
  - Клиренс 210 мм
  - Фаворит групповых туров
  price_label: 290 ₾ / сутки
  body: >-
    Гиды и фотографы бронируют Delica за месяцы вперёд: больше ни одна машина в парке не делает две работы
    сразу. Это кузов минивэна — семь-восемь мест, сдвижные двери, высокие окна, из которых видно всем
    — на настоящем полноприводном шасси с клиренсом 210 мм.


    Именно поэтому группа из восьми человек едет в Ушгули на одной машине, а не на двух кроссоверах: Delica
    относится к внедорожной категории, которой разрешён грунт Сванетии и Тушетии. Дизель 2.2 для таких
    габаритов скромен — порядка **9.0 л / 100 км**, а автомат снимает драматизм с долгих подъёмов.


    Компромиссы честные: машина высокая, поэтому боковой ветер в горах и низкие въезды в паркинги требуют
    внимания, а при всех занятых местах багажник за последним рядом невелик — четыре чемодана входят,
    если этот ряд сложить. Тариф 290 ₾ в сутки, депозит 1 200 ₾, водитель от 25 лет. Летом свободных дат
    мало, звоните заранее: [Контакты](/contact/).
fa:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 دیزلی · 4WD
  features:
  - 7–8 صندلی
  - ارتفاع از زمین 210 میلی‌متر
  - انتخاب محبوب تورهای گروهی
  price_label: 290 ₾ / روز
  body: >-
    راهنماها و عکاسان دلیکا را ماه‌ها زودتر رزرو می‌کنند، چون هیچ خودروی دیگری در ناوگان هر دو کار را
    هم‌زمان انجام نمی‌دهد. بدنه‌ای است از جنس ون — هفت تا هشت صندلی، درهای کشویی و شیشه‌های بلند که همه
    از آن بیرون را می‌بینند — که روی شاسی واقعی چهار چرخ محرک با 210 میلی‌متر فاصله از زمین نشسته است.


    همین ترکیب است که به گروهی هشت‌نفره اجازه می‌دهد با یک خودرو به‌جای دو کراس‌اوور به اوشگولی برسد:
    دلیکا در دسته آفرود قرار دارد که مجاز به تردد در جاده‌های خاکی سوانتی و توشتی است. موتور 2.2 دیزلی
    برای این ابعاد کم‌توقع است، حدود **9.0 لیتر در 100 کیلومتر**، و گیربکس اتوماتیک هیجان اضافی سربالایی‌های
    طولانی را می‌گیرد.


    معامله‌ها روشن است. خودرو بلند است، پس باد جانبی کوهستان و ورودی‌های کوتاه پارکینگ توجه می‌خواهند،
    و با هر هشت صندلی پر، فضای پشت ردیف آخر کوچک می‌شود — با خواباندن آن ردیف چهار چمدان جا می‌گیرد. نرخ
    روزی 290 ₾، ودیعه 1,200 ₾ و راننده از 25 سال. تاریخ‌های تابستان زود پر می‌شود، پس زودتر از راه [تماس](/contact/)
    خبر دهید.
he:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 דיזל · 4WD
  features:
  - 7–8 מקומות
  - מרווח גחון 210 מ"מ
  - מועדפת לטיולים קבוצתיים
  price_label: 290 ₾ / יום
  body: >-
    מדריכים וצלמים מזמינים את הדליקה חודשים מראש, כי שום רכב אחר בצי לא עושה את שתי העבודות בבת אחת. זה
    מרכב של מיניוואן — שבעה עד שמונה מקומות, דלתות הזזה וחלונות זקופים שכולם רואים מהם החוצה — שיושב על
    שלדת הנעה כפולה אמיתית עם מרווח גחון של 210 מ"מ.


    השילוב הזה הוא הסיבה שקבוצה של שמונה יכולה להגיע לאושגולי ברכב אחד במקום בשני קרוסאוברים: הדליקה שייכת
    לקטגוריית השטח שמותרת בדרכים הלא סלולות של סוואנטי ותושתי. מנוע הדיזל 2.2 צנוע ביחס לגודל, כ-**9.0
    ליטר ל-100 ק"מ**, והתיבה האוטומטית מוציאה את הדרמה מטיפוסים ארוכים.


    הוויתורים כאן הוגנים. הרכב גבוה, ולכן רוחות צד בהרים וכניסות חניון נמוכות דורשות תשומת לב, וכששמונת
    המושבים תפוסים השטח מאחורי השורה האחרונה קטן — ארבע מזוודות נכנסות רק לאחר קיפול השורה. התעריף 290
    ₾ ליום, הפיקדון 1,200 ₾, נהגים מגיל 25. תאריכי הקיץ נחטפים מהר, אז פנו אלינו מוקדם דרך [צור קשר](/contact/).
ar:
  name: Mitsubishi Delica D:5
  summary: 2016–2021 · 2.2 ديزل · 4WD
  features:
  - 7–8 مقاعد
  - ارتفاع عن الأرض 210 مم
  - المفضلة للجولات الجماعية
  price_label: 290 ₾ / يوم
  body: >-
    يحجز المرشدون والمصورون سيارة دليكا قبل أشهر، لأن لا شيء آخر في الأسطول يؤدي المهمتين معاً. فهي هيكل
    حافلة صغيرة — سبعة إلى ثمانية مقاعد، وأبواب منزلقة، ونوافذ عالية يرى الجميع من خلالها — يقوم على شاسيه
    دفع رباعي حقيقي بارتفاع 210 مم عن الأرض.


    هذا المزيج هو ما يتيح لمجموعة من ثمانية أشخاص بلوغ أوشغولي بمركبة واحدة بدل سيارتي كروس أوفر: فدليكا
    تنتمي إلى فئة الطرق الوعرة المسموح لها بدروب سفانيتي وتوشيتي غير المعبدة. ومحرك الديزل 2.2 متواضع
    الاستهلاك قياساً بالحجم، نحو **9.0 لتر لكل 100 كم**، بينما يزيل ناقل الحركة الأوتوماتيكي توتر الصعودات
    الطويلة.


    أما المقايضات فصريحة. المركبة مرتفعة، لذا تستدعي الرياح الجانبية في الجبال ومداخل المرائب المنخفضة
    بعض الانتباه، وعند شغل المقاعد الثمانية كلها تصبح المساحة خلف الصف الأخير صغيرة — وتتسع أربع حقائب
    بعد طي ذلك الصف. السعر 290 ₾ يومياً، والتأمين 1,200 ₾، والسائقون من 25 عاماً. مواعيد الصيف تنفد بسرعة،
    فبادر بالحجز عبر [اتصل بنا](/contact/).
