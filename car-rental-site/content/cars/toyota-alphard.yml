ka:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 ჰიბრიდი · ავტომატი
  features:
  - 7 ადგილი, 4 ჩემოდანი
  - ცალკეული სავარძლები მე-2 რიგში
  price_label: 310 ₾ / დღე
  body: >-
    ალფარდი ბიზნეს კლასის ავტომობილია, რომელსაც შემთხვევით შვიდი ადგილი აქვს. მეორე რიგში ორი ცალკეული
    სავარძელია სრულფასოვანი სახელჩამოსადებით და ისეთი დახრით, რომ თბილისის აეროპორტიდან კახეთამდე ორსაათიანი
    ტრანსფერი დასვენებად აღიქმება და არა გადაადგილებად. მოსრიალე კარები სასტუმროს ვიწრო შესასვლელებსა
    და ძველი უბნების ეზოებში ეხმარება.


    პრაქტიკულს კი 2.5 ჰიბრიდი ხდის: ამ ზომის ავტომობილისთვის დაახლოებით **7.5 ლ / 100 კმ** და თითქმის
    უხმო მოძრაობა ქალაქის სიჩქარეზე. მესამე რიგის უკან ოთხი ჩემოდანი თავსდება, რაც შვიდადგილიანისთვის
    იშვიათობაა.


    ძირითადად VIP ტრანსფერებზე, გადამღებ ჯგუფებზე და ოჯახებზე ქირავდება, რომლებისთვისაც სივრცე დინამიკაზე
    მნიშვნელოვანია; მძღოლის მოწვევაც შესაძლებელია. კლირენსი 160 მმ-ია და წამყვანი წინა — ესე იგი მარშრუტები
    ასფალტზე დაგეგმეთ: მაგისტრალები, კახეთი, მესტიამდე ასფალტი. მის მიღმა გრუნტი იწყება, გრუნტი კი 4x4-ის
    საქმეა და უშგული და ომალო ამ კატეგორიისთვის დახურულია. ტარიფი 310 ₾, დეპოზიტი 1 000 ₾ — თარიღები შეამოწმეთ
    [კონტაქტი](/contact/).
en:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 hybrid · automatic
  features:
  - 7 seats, 4 suitcases
  - Individual seats in the second row
  price_label: 310 ₾ / day
  body: >-
    Think of the Alphard as a business-class car that happens to seat seven. The second row has two individual
    seats with proper armrests and enough recline that a two-hour transfer from Tbilisi airport to Kakheti
    passes as rest rather than travel. Sliding doors help in tight hotel driveways and in the courtyards
    of the old districts.


    The 2.5 hybrid drivetrain is what makes it practical: roughly **7.5 l/100 km** from a vehicle this
    size, and near-silent running at city speeds. Four suitcases fit behind the third row, which is unusual
    for a seven-seater.


    We rent it mostly for VIP transfers, film crews and families who value space over sportiness, and
    a chauffeur can be arranged. Clearance is 160 mm and drive goes to the front wheels only, so plan
    asphalt routes: the main highways, Kakheti, the paved approach to Mestia. Beyond that the gravel begins,
    and gravel is 4x4 territory — Ushguli and Omalo are closed to this category. The rate is 310 ₾ a day
    with a 1,000 ₾ deposit; check dates through [Contact](/contact/).
ru:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 гибрид · автомат
  features:
  - 7 мест, 4 чемодана
  - Отдельные кресла во втором ряду
  price_label: 310 ₾ / сутки
  body: >-
    Alphard — это машина бизнес-класса, у которой по совместительству семь мест. Во втором ряду два отдельных
    кресла с полноценными подлокотниками и таким наклоном спинки, что двухчасовой трансфер из аэропорта
    Тбилиси в Кахетию воспринимается как отдых, а не как дорога. Сдвижные двери выручают в узких заездах
    к отелям и во дворах старых районов.


    Практичной машину делает гибрид 2.5: около **7.5 л / 100 км** при таких габаритах и почти бесшумное
    движение на городских скоростях. За третьим рядом помещаются четыре чемодана — для семиместного автомобиля
    это редкость.


    Берут его в основном под VIP-трансферы, съёмочные группы и семьи, которым простор важнее динамики;
    при необходимости дадим с водителем. Клиренс 160 мм, привод передний, так что маршруты асфальтовые:
    магистрали, Кахетия, дорога до Местиа. Дальше начинается грунт, а он — территория категории 4x4: Ушгули
    и Омало для минивэна закрыты. Тариф 310 ₾ в сутки, депозит 1 000 ₾; даты уточните через [Контакты](/contact/).
fa:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 هیبریدی · اتوماتیک
  features:
  - 7 صندلی، 4 چمدان
  - صندلی‌های مجزا در ردیف دوم
  price_label: 310 ₾ / روز
  body: >-
    آلفارد را خودرویی در کلاس بیزنس تصور کنید که اتفاقاً هفت نفر را جا می‌دهد. ردیف دوم دو صندلی مجزا
    با دسته‌های واقعی دارد و آن‌قدر می‌خوابد که یک ترانسفر دوساعته از فرودگاه تفلیس به کاختی به‌جای سفر،
    استراحت به حساب بیاید. درهای کشویی در ورودی‌های تنگ هتل‌ها و در حیاط محله‌های قدیمی به کار می‌آیند.


    سیستم 2.5 هیبریدی همان چیزی است که این خودرو را عملی می‌کند: حدود **7.5 لیتر در 100 کیلومتر** از خودرویی
    با این ابعاد، و حرکت تقریباً بی‌صدا در سرعت‌های شهری. چهار چمدان پشت ردیف سوم جا می‌شود، که برای یک
    خودروی هفت‌نفره غیرعادی است.


    بیشتر برای ترانسفرهای VIP، گروه‌های فیلم‌برداری و خانواده‌های فضادوست اجاره می‌رود؛ راننده هم قابل
    ترتیب است. ارتفاع 160 میلی‌متر است و نیرو تنها به چرخ‌های جلو می‌رود، پس مسیرهای آسفالت را برنامه‌ریزی
    کنید: بزرگراه‌های اصلی، کاختی و مسیر آسفالت تا مستیا. پس از آن جاده خاکی شروع می‌شود و خاکی قلمرو
    4x4 است — اوشگولی و اومالو به روی این دسته بسته‌اند. نرخ روزی 310 ₾ با ودیعه 1,000 ₾؛ تاریخ‌ها را
    از راه [تماس](/contact/) بررسی کنید.
he:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 היברידי · אוטומט
  features:
  - 7 מקומות, 4 מזוודות
  - מושבים נפרדים בשורה השנייה
  price_label: 310 ₾ / יום
  body: >-
    חשבו על האלפרד כעל רכב מחלקת עסקים שבמקרה יש בו שבעה מקומות. בשורה השנייה שני מושבים נפרדים עם משענות
    יד אמיתיות וזווית הטיה שהופכת הסעה של שעתיים משדה התעופה של טביליסי לקחתי למנוחה ולא לנסיעה. דלתות
    ההזזה עוזרות בכניסות מלון צרות ובחצרות השכונות הישנות.


    מערכת ההנעה ההיברידית 2.5 היא מה שהופך אותו למעשי: כ-**7.5 ליטר ל-100 ק"מ** מרכב בגודל כזה, ונסיעה
    כמעט אילמת במהירויות עירוניות. ארבע מזוודות נכנסות מאחורי השורה השלישית, דבר חריג ברכב בן שבעה מקומות.


    אנחנו משכירים אותו בעיקר להסעות VIP, לצוותי הפקה ולמשפחות שמעדיפות מרחב על פני נהיגה ספורטיבית, ואפשר
    להזמין גם נהג. מרווח הגחון 160 מ"מ וההנעה קדמית בלבד, ולכן תכננו מסלולי אספלט: הכבישים הראשיים, קחתי
    והדרך הסלולה עד מסטיה. משם מתחיל החצץ, וחצץ הוא טריטוריה של 4x4 — אושגולי ואומאלו סגורות בפני הקטגוריה
    הזאת. התעריף 310 ₾ ליום עם פיקדון של 1,000 ₾; בדקו תאריכים דרך [צור קשר](/contact/).
ar:
  name: Toyota Alphard
  summary: 2018–2022 · 2.5 هجين · أوتوماتيك
  features:
  - 7 مقاعد، 4 حقائب
  - مقاعد منفصلة في الصف الثاني
  price_label: 310 ₾ / يوم
  body: >-
    فكّر في ألفارد بوصفها سيارة من درجة رجال الأعمال تتسع مصادفةً لسبعة ركاب. ففي الصف الثاني مقعدان منفصلان
    بمساند أذرع حقيقية وبزاوية استلقاء تكفي لأن يمر انتقال مدته ساعتان من مطار تبليسي إلى كاخيتي بوصفه
    راحة لا سفراً. والأبواب المنزلقة تساعد في مداخل الفنادق الضيقة وفي أفنية الأحياء القديمة.


    ونظام الدفع الهجين 2.5 هو ما يجعلها عملية: نحو **7.5 لتر لكل 100 كم** من مركبة بهذا الحجم، وسير شبه
    صامت عند سرعات المدينة. وتتسع أربع حقائب خلف الصف الثالث، وهو أمر غير مألوف في سيارة بسبعة مقاعد.


    نؤجرها غالباً لعمليات نقل كبار الشخصيات، وفرق التصوير، والأسر التي تقدّر المساحة على المتعة الرياضية،
    ويمكن ترتيب سائق. الارتفاع عن الأرض 160 مم والدفع أمامي فقط، لذا خطّط لمسارات معبدة: الطرق السريعة
    الرئيسية، وكاخيتي، والطريق المعبد حتى ميستيا. وبعد ذلك تبدأ الدروب الترابية، والترابي مجال 4x4 — فأوشغولي
    وأومالو مغلقتان أمام هذه الفئة. السعر 310 ₾ يومياً مع تأمين 1,000 ₾؛ تحقق من المواعيد عبر [اتصل بنا](/contact/).
