ka:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 ბენზინი · ავტომატი
  features:
  - 5 ადგილი, 2 ჩემოდანი
  - საწვავი ~6.0 ლ / 100 კმ
  - კრუიზ-კონტროლი
  price_label: 88 ₾ / დღე
  body: >-
    ცოტა ავტომობილია ისეთი, რომელსაც ასე მშვიდად გადავცემთ ადამიანს, ვისაც საქართველოში მართვის გამოცდილება
    არ აქვს. კოროლა პროგნოზირებადია, საჭე მსუბუქი აქვს, ძველი თბილისის ვიწრო ქუჩებისთვის საკმარისად მოკლეა
    და იმ საიმედოობით გამოირჩევა, რომლითაც ეს მოდელი განთქმულია — ეს კი მნიშვნელოვანია, როცა დღე დილის
    შვიდზე სოფელში იწყება.


    1.6 ბენზინი ავტომატით დაახლოებით **6.0 ლ / 100 კმ**-ს მოიხმარს, კრუიზ-კონტროლი კი თბილისი–ბათუმის
    გრძელ სწორ მონაკვეთებს გაცილებით ნაკლებად დამღლელს ხდის. ხუთი ადგილი და ორი ჩემოდანი — წყვილისთვის
    ან პატარა ოჯახისთვის ზუსტად საკმარისი.


    - გამოდგება: კახეთის ღვინის მარშრუტები, ბორჯომი, ქუთაისი, შავი ზღვის სანაპირო

    - არ გამოდგება: ნებისმიერი გრუნტოვანი გზა — კლირენსი სულ 135 მმ-ია


    უშგულისა და ომალოს ხრეშზე მიღებული დაზიანება არა-4x4 ავტომობილზე დაზღვევით არ იფარება, ამიტომ ამ მარშრუტებს
    მაღალი გამავლობის კატეგორია სჭირდება. ტარიფი 88 ₾ დღეში, გრძელვადიან ჯავშანზე კი ნაკლები — იხილეთ
    [ფასები](/pricing/).
en:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 petrol · automatic
  features:
  - 5 seats, 2 suitcases
  - Fuel ~6.0 l / 100 km
  - Cruise control
  price_label: 88 ₾ / day
  body: >-
    Few cars are as easy to hand over to someone who has never driven in Georgia before. The Corolla is
    predictable, light on the steering, short enough for the narrow streets of the old town, and it carries
    the reliability record that made the model famous — a real consideration when your day starts in a
    village at seven in the morning.


    The 1.6 petrol automatic uses about **6.0 l/100 km**, and cruise control makes the long straight stretches
    of the Tbilisi–Batumi highway far less tiring. Five seats and two suitcases suit a couple or a small
    family.


    - Good for: the Kakheti wine routes, Borjomi, Kutaisi, the Black Sea coast

    - Not suitable: any unpaved road — clearance is only 135 mm


    Damage caused on the gravel tracks to Ushguli or Omalo is excluded from cover on non-4x4 cars, so
    those routes need a vehicle from the off-road category. The rate is 88 ₾ a day and falls for longer
    bookings — see [Prices](/pricing/).
ru:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 бензин · автомат
  features:
  - 5 мест, 2 чемодана
  - Расход ~6.0 л / 100 км
  - Круиз-контроль
  price_label: 88 ₾ / сутки
  body: >-
    Мало какую машину так спокойно отдаёшь человеку, который в Грузии за рулём впервые. Corolla предсказуема,
    руль лёгкий, габариты позволяют проехать по узким улицам старого Тбилиси, а надёжность у модели ровно
    та, из-за которой её и покупают, — это существенно, когда утро начинается в деревне в семь часов.


    Мотор 1.6 с автоматом тратит порядка **6.0 л / 100 км**, а круиз-контроль заметно облегчает длинные
    прямые участки трассы Тбилиси–Батуми. Пять мест и два чемодана — этого хватает паре или небольшой
    семье.


    - Подходит: винные маршруты Кахетии, Боржоми, Кутаиси, побережье

    - Не подходит: любая грунтовка — клиренс всего 135 мм


    Повреждения, полученные на грунтовых дорогах к Ушгули и Омало, на машинах вне категории 4x4 страховка
    не покрывает, поэтому такие маршруты требуют внедорожника. Тариф — 88 ₾ в сутки, при длительной аренде
    ниже: смотрите [Цены](/pricing/).
fa:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 بنزینی · اتوماتیک
  features:
  - 5 صندلی، 2 چمدان
  - مصرف سوخت ~6.0 لیتر / 100 کیلومتر
  - کروز کنترل
  price_label: 88 ₾ / روز
  body: >-
    کمتر خودرویی هست که بتوان با این آسودگی به کسی سپرد که هرگز در گرجستان رانندگی نکرده است. کرولا قابل
    پیش‌بینی است، فرمان سبکی دارد، برای کوچه‌های باریک شهر قدیم به اندازه کافی کوتاه است و همان سابقه
    اطمینان‌پذیری را دارد که این مدل را مشهور کرد — نکته‌ای کاملاً واقعی وقتی روزتان ساعت هفت صبح در یک
    روستا آغاز می‌شود.


    موتور 1.6 بنزینی با گیربکس اتوماتیک حدود **6.0 لیتر در 100 کیلومتر** مصرف می‌کند، و کروز کنترل مسیرهای
    مستقیم و طولانی بزرگراه تفلیس–باتومی را بسیار کم‌خسته‌تر می‌کند. پنج صندلی و دو چمدان برای یک زوج
    یا خانواده کوچک کافی است.


    - مناسب برای: جاده‌های شراب کاختی، بورجومی، کوتایسی و ساحل دریای سیاه

    - نامناسب برای: هر جاده خاکی — ارتفاع از زمین تنها 135 میلی‌متر است


    خسارت واردشده در مسیرهای خاکی اوشگولی یا اومالو برای خودروهای غیر 4x4 از پوشش بیمه خارج است، بنابراین
    آن مسیرها به خودرویی از دسته آفرود نیاز دارند. نرخ روزانه 88 ₾ است و برای رزروهای طولانی‌تر پایین
    می‌آید — به [قیمت‌ها](/pricing/) نگاه کنید.
he:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 בנזין · אוטומט
  features:
  - 5 מקומות, 2 מזוודות
  - צריכת דלק ~6.0 ליטר / 100 ק"מ
  - בקרת שיוט
  price_label: 88 ₾ / יום
  body: >-
    מעט מכוניות קל כל כך למסור למי שמעולם לא נהג בגאורגיה. הקורולה צפויה, ההגה שלה קל, היא קצרה מספיק
    לסמטאות העיר העתיקה, והיא נושאת את מוניטין האמינות שהפך את הדגם למפורסם — שיקול ממשי כשהיום שלכם מתחיל
    בכפר בשבע בבוקר.


    מנוע 1.6 בנזין עם תיבה אוטומטית צורך כ-**6.0 ליטר ל-100 ק"מ**, ובקרת השיוט הופכת את הקטעים הישרים
    והארוכים של הכביש טביליסי–בטומי למעייפים הרבה פחות. חמישה מקומות ושתי מזוודות מתאימים לזוג או למשפחה
    קטנה.


    - מתאים ל: דרכי היין של קחתי, בורג'ומי, קוטאיסי וחוף הים השחור

    - לא מתאים ל: כל דרך לא סלולה — מרווח הגחון הוא 135 מ"מ בלבד


    נזק שנגרם בדרכי החצץ לאושגולי או לאומאלו אינו מכוסה ברכבים שאינם 4x4, ולכן המסלולים האלה מחייבים רכב
    מקטגוריית השטח. התעריף הוא 88 ₾ ליום והוא יורד בהזמנות ארוכות — ראו [מחירים](/pricing/).
ar:
  name: Toyota Corolla
  summary: 2020–2023 · 1.6 بنزين · أوتوماتيك
  features:
  - 5 مقاعد، 2 حقيبة
  - استهلاك الوقود ~6.0 لتر / 100 كم
  - مثبّت سرعة
  price_label: 88 ₾ / يوم
  body: >-
    قليلة هي السيارات التي يمكن تسليمها بهذه الطمأنينة لمن لم يسبق له أن قاد في جورجيا. فكورولا سيارة
    يسهل التنبؤ بسلوكها، مقودها خفيف، وطولها مناسب لأزقة المدينة القديمة، وهي تحمل سجل الاعتمادية الذي
    جعل هذا الطراز مشهوراً — وهو اعتبار حقيقي حين يبدأ يومك في قرية عند السابعة صباحاً.


    يستهلك محرك 1.6 بنزين مع ناقل حركة أوتوماتيكي نحو **6.0 لتر لكل 100 كم**، ويجعل مثبّت السرعة المقاطع
    المستقيمة الطويلة على طريق تبليسي–باتومي أقل إرهاقاً بكثير. وخمسة مقاعد وحقيبتان تكفيان لزوجين أو
    لأسرة صغيرة.


    - مناسبة لـ: طرق النبيذ في كاخيتي، وبورجومي، وكوتايسي، وساحل البحر الأسود

    - غير مناسبة لـ: أي طريق غير معبّد — فالارتفاع عن الأرض 135 مم فقط


    الأضرار التي تقع على الدروب الترابية إلى أوشغولي أو أومالو غير مشمولة في السيارات من غير فئة 4x4،
    لذا تتطلب هذه المسارات مركبة من فئة الطرق الوعرة. السعر 88 ₾ يومياً وينخفض مع الحجوزات الأطول — انظر
    [الأسعار](/pricing/).
