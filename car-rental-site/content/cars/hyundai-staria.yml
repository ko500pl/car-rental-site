ka:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 დიზელი · ავტომატი
  features:
  - 8–9 ადგილი, 5 ჩემოდანი
  - მაღალი ჭერი
  price_label: 260 ₾ / დღე
  body: >-
    ცხრა ადგილი და პარკში ყველაზე ახალი ძარა — სტარიას მაშინ გადავცემთ, როცა ჯგუფი ჩვეულებრივ მინივენზე
    მეტი ხალხით ჩამოდის. მაღალი ჭერი აქ სტილის ელემენტი არ არის: ზრდასრული ადამიანი სალონში მოხრის გარეშე
    გადაადგილდება, ხოლო მინების ფართობი იმდენია, რომ ბოლო რიგშიც კავკასიონის ქედი ჩანს და არა წინა სავარძლის
    თავსაყრდენი.


    ტექნიკურად ეს 2.2 დიზელია სრული წამყვანითა და ავტომატით, ხარჯი დაახლოებით **8.8 ლ / 100 კმ** — ცხრაადგილიანისთვის
    ეკონომიური. 186 მმ კლირენსი რაჭისა და ყაზბეგის უხეშ ასფალტს მშვიდად უმკლავდება.


    ხუთი ჩემოდანი ყველა რიგის გამოყენებისას თავსდება და სწორედ ეს რიცხვი წყვეტს ჯავშნების უმეტესობას:
    ტურისტული ჯგუფები, სასკოლო მოგზაურობები, დიდი ოჯახების აეროპორტის ტრანსფერები. ტარიფი 260 ₾ დღეში,
    დეპოზიტი 1 000 ₾, მძღოლი 23 წლიდან. სრული წამყვანი მაღალ გამავლობას არ ნიშნავს — უშგული და ომალო მხოლოდ
    4x4 კატეგორიისთვისაა ღია; შეადარეთ [ავტოპარკი](/fleet/) გვერდზე.
en:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 diesel · automatic
  features:
  - 8–9 seats, 5 suitcases
  - High roof
  price_label: 260 ₾ / day
  body: >-
    Nine seats and the newest bodywork in our fleet — the Staria is what we hand over when a group arrives
    with more people than an ordinary minivan takes. The high roof is not a styling line: an adult can
    move down the cabin without stooping, and the glass area is large enough that passengers in the last
    row see the Caucasus ridge rather than the headrest in front of them.


    Mechanically it is a 2.2 diesel with all-wheel drive and an automatic gearbox, using about **8.8 l/100
    km** — economical for a nine-seater. Clearance of 186 mm takes the rough asphalt of Racha and Kazbegi
    in its stride.


    Five suitcases fit with every row in use, and that number decides most bookings: tour groups, school
    trips, airport transfers for large families. The rate is 260 ₾ a day, the deposit 1,000 ₾ and the
    minimum driver age 23. All-wheel drive is not the same thing as off-road clearance, though — Ushguli
    and Omalo remain open only to the 4x4 category, which you can compare on [Fleet](/fleet/).
ru:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 дизель · автомат
  features:
  - 8–9 мест, 5 чемоданов
  - Высокая крыша
  price_label: 260 ₾ / сутки
  body: >-
    Девять мест и самый свежий кузов в парке — Staria уходит тем группам, которые приезжают числом больше
    обычного минивэна. Высокая крыша здесь не элемент стиля: взрослый перемещается по салону не сгибаясь,
    а площадь остекления такая, что даже с последнего ряда виден Кавказский хребет, а не подголовник переднего
    кресла.


    Технически это 2.2 дизель с полным приводом и автоматом, расход около **8.8 л / 100 км** — для девятиместной
    машины экономично. Клиренс 186 мм спокойно переносит разбитый асфальт Рачи и Казбеги.


    Пять чемоданов входят при всех задействованных рядах, и именно это число решает большинство броней:
    туристические группы, школьные поездки, трансферы больших семей из аэропорта. Тариф 260 ₾ в сутки,
    депозит 1 000 ₾, водитель от 23 лет. При этом полный привод — не то же самое, что внедорожный клиренс:
    Ушгули и Омало открыты только для категории 4x4, сравнить можно на [Автопарк](/fleet/).
fa:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 دیزلی · اتوماتیک
  features:
  - 8–9 صندلی، 5 چمدان
  - سقف بلند
  price_label: 260 ₾ / روز
  body: >-
    نُه صندلی و تازه‌ترین بدنه ناوگان ما — استاریا همان خودرویی است که وقتی گروهی بزرگ‌تر از ظرفیت یک
    ون معمولی می‌رسد تحویل می‌دهیم. سقف بلند صرفاً یک خط طراحی نیست: یک بزرگسال می‌تواند بدون خم شدن در
    طول کابین راه برود، و سطح شیشه‌ها آن‌قدر بزرگ است که سرنشینان ردیف آخر به‌جای پشتی صندلی جلو، رشته‌کوه
    قفقاز را می‌بینند.


    از نظر فنی موتور 2.2 دیزلی با چهار چرخ محرک و گیربکس اتوماتیک دارد و حدود **8.8 لیتر در 100 کیلومتر**
    مصرف می‌کند — برای خودرویی نُه‌نفره اقتصادی است. ارتفاع 186 میلی‌متر آسفالت ناهموار راچا و کازبگی
    را بی‌دردسر پشت سر می‌گذارد.


    پنج چمدان با تمام ردیف‌های باز جا می‌شود و همین عدد است که بیشتر رزروها را تعیین می‌کند: تورهای گروهی،
    سفرهای مدرسه، ترانسفر فرودگاه برای خانواده‌های پرجمعیت. نرخ روزی 260 ₾، ودیعه 1,000 ₾ و حداقل سن راننده
    23 سال است. اما چهار چرخ محرک با ارتفاع آفرود یکی نیست — اوشگولی و اومالو تنها به روی دسته 4x4 باز
    می‌مانند که می‌توانید آن را در صفحه [ناوگان](/fleet/) مقایسه کنید.
he:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 דיזל · אוטומט
  features:
  - 8–9 מקומות, 5 מזוודות
  - גג גבוה
  price_label: 260 ₾ / יום
  body: >-
    תשעה מקומות והמרכב החדש ביותר בצי שלנו — הסטריה היא מה שאנחנו מוסרים כשמגיעה קבוצה גדולה יותר ממה
    שמיניוואן רגיל מכיל. הגג הגבוה אינו קו עיצובי בלבד: מבוגר יכול לעבור לאורך התא בלי להתכופף, ושטח הזיגוג
    גדול מספיק כדי שהנוסעים בשורה האחרונה יראו את רכס הקווקז ולא את משענת הראש שלפניהם.


    מבחינה מכנית מדובר במנוע דיזל 2.2 עם הנעה כפולה ותיבה אוטומטית, שצורך כ-**8.8 ליטר ל-100 ק"מ** — חסכוני
    לרכב בן תשעה מקומות. מרווח גחון של 186 מ"מ בולע בקלות את האספלט המחוספס של ראצ'ה וקזבגי.


    חמש מזוודות נכנסות כשכל השורות בשימוש, והמספר הזה מכריע את רוב ההזמנות: קבוצות תיירים, טיולי בית ספר
    והסעות שדה תעופה למשפחות גדולות. התעריף 260 ₾ ליום, הפיקדון 1,000 ₾ וגיל הנהג המינימלי 23. עם זאת,
    הנעה כפולה אינה זהה למרווח גחון של רכב שטח — אושגולי ואומאלו נשארות פתוחות רק לקטגוריית 4x4, שאותה
    אפשר להשוות בעמוד [צי הרכב](/fleet/).
ar:
  name: Hyundai Staria
  summary: 2021–2024 · 2.2 ديزل · أوتوماتيك
  features:
  - 8–9 مقاعد، 5 حقائب
  - سقف مرتفع
  price_label: 260 ₾ / يوم
  body: >-
    تسعة مقاعد وأحدث هيكل في أسطولنا — ستاريا هي ما نسلّمه حين تصل مجموعة أكبر مما تستوعبه حافلة صغيرة
    عادية. والسقف المرتفع ليس خطاً تصميمياً فحسب: يستطيع البالغ أن يتحرك داخل المقصورة دون أن ينحني، ومساحة
    الزجاج واسعة بما يكفي ليرى ركاب الصف الأخير سلسلة القوقاز بدل مسند الرأس أمامهم.


    ميكانيكياً هي محرك ديزل 2.2 مع دفع رباعي وناقل حركة أوتوماتيكي، يستهلك نحو **8.8 لتر لكل 100 كم**
    — وهو رقم اقتصادي لمركبة بتسعة مقاعد. وارتفاع 186 مم عن الأرض يتجاوز أسفلت راتشا وكازبيغي الخشن بلا
    عناء.


    تتسع لخمس حقائب مع استخدام كل الصفوف، وهذا الرقم هو ما يحسم معظم الحجوزات: المجموعات السياحية، والرحلات
    المدرسية، ونقل الأسر الكبيرة من المطار. السعر 260 ₾ يومياً، والتأمين 1,000 ₾، والحد الأدنى لسن السائق
    23 عاماً. غير أن الدفع الرباعي ليس كارتفاع سيارات الطرق الوعرة — فتبقى أوشغولي وأومالو مفتوحتين لفئة
    4x4 وحدها، ويمكنك مقارنتها في صفحة [الأسطول](/fleet/).
