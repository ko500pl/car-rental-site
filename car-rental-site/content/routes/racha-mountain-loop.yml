ka:
  name: რაჭის სამთო მარშრუტი
  short: 'სამი დღე რაჭაში: ქუთაისი, ტყიბული, ნიკორწმინდა, ამბროლაური, შაორი და ონი-შოვი.'
  body: >-
    რაჭა საქართველოს ყველაზე მშვიდი მთიანი რეგიონია — აქ არც ტურისტული ბრბოა და არც დიდი სასტუმროები,
    სამაგიეროდ არის ტყე, ტბები, ქვის სოფლები და ხვანჭკარის ვენახები. მარშრუტი ქუთაისიდან ტყიბულსა და ნაკერალას
    უღელტეხილზე ადის, შემდეგ ამბროლაურამდე და ონამდე მიდის, ბოლოს კი შოვის ალპურ ხეობაში სრულდება.


    პირველი დღე გრძელია: თბილისიდან ქუთაისამდე 230 კილომეტრია, შემდეგ ტყიბულის წყალსაცავი და ნაკერალას
    სერპანტინი, საიდანაც რაჭის მთები პირველად იშლება. უღელტეხილის შემდეგ **ნიკორწმინდის** XI საუკუნის
    ტაძარი დგას — ალბათ საქართველოში ყველაზე მდიდრულად მოჩუქურთმებული ფასადი, თითქმის მთლიანად რელიეფებით
    დაფარული. შემდეგ **შაორის წყალსაცავი** მოდის, წიწვოვან ტყეში ჩასმული, სადაც ზაფხულში ბანაობენ. მეორე
    დღე ამბროლაურიდან ონისკენ და შოვისკენ მიდის — რიონის ხეობა თანდათან ვიწროვდება და 1 600 მეტრზე წიწვნარებში
    სუბალპურ მდელოებზე გადის.


    რაჭა მათთვისაა, ვისაც სიმშვიდე და ბუნება უნდა და ტურისტული ინფრასტრუქტურა არ აკლია: აქ საოჯახო სასტუმროები,
    სოფლის სუფრა და თითქმის ცარიელი გზებია. გზა ამბროლაურამდე ასფალტია, თუმცა უღელტეხილზე ვიწრო და ხვეულია,
    ონის შემდეგ კი ხარისხი ეცემა — მაღალი კლირენსი აქ ნამდვილად სასარგებლოა. სეზონი მაისიდან ოქტომბრამდეა;
    ზამთარში ნაკერალა თოვლს იჭერს და გზა დღეებით შეიძლება დაიხუროს, ამიტომ ცივ სეზონში გამგზავრებამდე
    გზის მდგომარეობა აუცილებლად შეამოწმე.
  plan: >-
    **დღე 1 · თბილისი → ქუთაისი → ნიკორწმინდა → ამბროლაური (335 კმ, 5 სთ 30 წთ)**

    - 08:00 გასვლა თბილისიდან E60-ით, გაჩერება რიკოთის უღელტეხილზე.

    - 11:30 ქუთაისი: სადილი და მოკლე გასეირნება (1 სთ 30 წთ).

    - 14:00 ტყიბულის წყალსაცავი და ნაკერალას უღელტეხილი, ხედის მოედანი (45 წთ).

    - 15:30 **ნიკორწმინდის ტაძარი** — რელიეფები და გუმბათი (1 სთ).

    - 17:30 ჩამოსვლა ამბროლაურში, ღვინის სახლი და ხვანჭკარის დაგემოვნება (1 სთ).

    - ღამისთევა ამბროლაურში.


    **დღე 2 · შაორი, ონი და შოვი (150 კმ, 3 სთ)**

    - 09:00 **შაორის წყალსაცავი** წიწვოვან ტყეში, სეირნობა ნაპირზე (1 სთ 30 წთ).

    - 11:30 რიონის ხეობა ონისკენ, გაჩერება ბარაკონის ეკლესიასთან (45 წთ).

    - 13:00 ონი: ძველი ცენტრი და სადილი (1 სთ 30 წთ).

    - 15:30 შოვის ალპური ხეობა და მინერალური წყაროები (2 სთ).

    - 19:00 დაბრუნება; ღამისთევა ამბროლაურში ან ონში.


    **დღე 3 · ამბროლაური → თბილისი (330 კმ, 5 სთ 30 წთ)**

    - 09:00 ბაზრობა და ბოლო შესყიდვები ამბროლაურში (1 სთ).

    - 10:30 დაბრუნება ნაკერალასა და ტყიბულის გავლით.

    - 13:00 სადილი ქუთაისში (1 სთ 30 წთ).

    - 15:00 გამგზავრება E60-ით ზესტაფონისა და ხაშურის გავლით.

    - 19:30 თბილისში დაბრუნება.
  tips:
  - ნაკერალას უღელტეხილი ვიწრო და ხვეულია — ნისლში ნელა იარე, ონის შემდეგ კი გზის ხარისხი ეცემა.
  - საწვავი ქუთაისსა და ამბროლაურში აავსე — ონსა და შოვს შორის სადგური თითქმის არ არის.
  - რაჭაში სასტუმროები ცოტაა და უმეტესად საოჯახოა; ღამისთევა წინასწარ დაჯავშნე.
  - ხვანჭკარა ნამდვილი მხოლოდ ამბროლაურის ზონაშია — ყიდვისას ეტიკეტსა და მწარმოებელს დააკვირდი.
  - ზამთარში ნაკერალა თოვლს იჭერს და ზოგჯერ იკეტება; მაისი-ოქტომბერი გაცილებით უსაფრთხოა.
  - შოვისა და ონის მიდამოებში ბანკომატი ცოტაა — ნაღდი ფული წინასწარ აიღე.
en:
  name: Racha Mountain Loop
  short: 'Three days in Racha: Kutaisi, Tkibuli, Nikortsminda, Ambrolauri, Shaori and Oni.'
  body: >-
    Racha is the quietest mountain region in Georgia — no crowds, no large hotels, but forest, lakes,
    stone villages and the vineyards that produce Khvanchkara. The route climbs from Kutaisi through Tkibuli
    and over the Nakerala pass, runs on to Ambrolauri and Oni, and ends in the alpine valley of Shovi.


    The first day is long: 230 kilometres to Kutaisi, then the Tkibuli reservoir and the switchbacks of
    Nakerala, where the Racha ranges open up for the first time. Just beyond the pass stands **Nikortsminda**,
    an eleventh-century cathedral with what is probably the richest carved facade in the country, almost
    entirely covered in relief work. Then comes **Shaori reservoir**, set in pine forest at 1,100 metres,
    where locals swim in high summer. Day two follows the Rioni upstream from Ambrolauri through Oni to
    Shovi, where the valley narrows and the road climbs into subalpine meadows below the main Caucasus
    ridge.


    Racha suits travellers who want silence and landscape and do not need polished tourist infrastructure.
    The road is paved as far as Ambrolauri, though narrow and winding on the pass, and the surface deteriorates
    past Oni — ground clearance helps here. The season is May to October; in winter Nakerala catches snow
    and can close for days.
  plan: >-
    **Day 1 · Tbilisi → Kutaisi → Nikortsminda → Ambrolauri (335 km, 5 h 30 min)**

    - 08:00 Leave Tbilisi on the E60, break at the Rikoti pass.

    - 11:30 Kutaisi: lunch and a short walk (1 h 30 min).

    - 14:00 Tkibuli reservoir and the Nakerala pass viewpoint (45 min).

    - 15:30 **Nikortsminda Cathedral** — carvings and cupola (1 h).

    - 17:30 Arrive Ambrolauri; wine house and a Khvanchkara tasting (1 h).

    - Overnight in Ambrolauri.


    **Day 2 · Shaori, Oni and Shovi (150 km, 3 h)**

    - 09:00 **Shaori reservoir** in the pine forest, walk along the shore (1 h 30 min).

    - 11:30 The Rioni valley towards Oni, stop at Barakoni church (45 min).

    - 13:00 Oni: the old centre and lunch (1 h 30 min).

    - 15:30 The alpine valley of Shovi and its mineral springs (2 h).

    - 19:00 Drive back; overnight in Ambrolauri or Oni.


    **Day 3 · Ambrolauri → Tbilisi (330 km, 5 h 30 min)**

    - 09:00 Market and last purchases in Ambrolauri (1 h).

    - 10:30 Return over Nakerala and through Tkibuli.

    - 13:00 Lunch in Kutaisi (1 h 30 min).

    - 15:00 East on the E60 via Zestafoni and Khashuri.

    - 19:30 Back in Tbilisi.
  tips:
  - The Nakerala pass is narrow and winding — take it slowly in fog, and expect worse surface beyond Oni.
  - Fill up in Kutaisi and Ambrolauri; between Oni and Shovi there is almost nothing.
  - Accommodation in Racha is limited and mostly family-run — book your nights in advance.
  - Genuine Khvanchkara comes only from the Ambrolauri zone; check the label and producer before buying.
  - In winter Nakerala catches snow and can close for days; May to October is far safer.
  - ATMs are scarce around Oni and Shovi — take cash with you.
ru:
  name: Горная Рача
  short: 'Три дня в Раче: Кутаиси, Ткибули, Никорцминда, Амбролаури, Шаори и Они.'
  body: >-
    Рача — самый тихий горный регион Грузии: здесь нет толп и больших отелей, зато есть лес, озёра, каменные
    сёла и виноградники, дающие Хванчкару. Маршрут поднимается из Кутаиси через Ткибули и перевал Накерала,
    идёт дальше на Амбролаури и Они и заканчивается в альпийском ущелье Шови.


    Первый день длинный: 230 километров до Кутаиси, затем Ткибульское водохранилище и серпантин Накералы,
    откуда впервые открываются хребты Рачи. Сразу за перевалом стоит **Никорцминда** — собор XI века с,
    пожалуй, самым богатым резным фасадом в стране, почти целиком покрытым рельефами. Дальше **Шаорское
    водохранилище** в сосновом лесу на высоте 1 100 метров, где летом купаются местные. Второй день ведёт
    вверх по Риони от Амбролаури через Они к Шови: ущелье сужается, дорога поднимается к субальпийским
    лугам под Главным Кавказским хребтом.


    Рача — для тех, кому нужны тишина и пейзаж, а не отлаженная туристическая инфраструктура. До Амбролаури
    идёт асфальт, хотя на перевале дорога узкая и извилистая, а после Они покрытие заметно хуже — высокий
    клиренс тут пригодится. Сезон — с мая по октябрь; зимой Накерала ловит снег и может закрыться на несколько
    дней.
  plan: >-
    **День 1 · Тбилиси → Кутаиси → Никорцминда → Амбролаури (335 км, 5 ч 30 мин)**

    - 08:00 Выезд из Тбилиси по E60, пауза на Рикотском перевале.

    - 11:30 Кутаиси: обед и короткая прогулка (1 ч 30 мин).

    - 14:00 Ткибульское водохранилище и смотровая на перевале Накерала (45 мин).

    - 15:30 **Собор Никорцминда** — резьба и купол (1 ч).

    - 17:30 Приезд в Амбролаури, дом вина и дегустация Хванчкары (1 ч).

    - Ночёвка в Амбролаури.


    **День 2 · Шаори, Они и Шови (150 км, 3 ч)**

    - 09:00 **Шаорское водохранилище** в сосновом лесу, прогулка по берегу (1 ч 30 мин).

    - 11:30 Долина Риони в сторону Они, остановка у церкви Бараконе (45 мин).

    - 13:00 Они: старый центр и обед (1 ч 30 мин).

    - 15:30 Альпийское ущелье Шови и минеральные источники (2 ч).

    - 19:00 Возвращение; ночёвка в Амбролаури или Они.


    **День 3 · Амбролаури → Тбилиси (330 км, 5 ч 30 мин)**

    - 09:00 Рынок и последние покупки в Амбролаури (1 ч).

    - 10:30 Обратно через Накералу и Ткибули.

    - 13:00 Обед в Кутаиси (1 ч 30 мин).

    - 15:00 На восток по E60 через Зестафони и Хашури.

    - 19:30 Возвращение в Тбилиси.
  tips:
  - Перевал Накерала узкий и извилистый — в тумане езжайте медленно, а после Они покрытие хуже.
  - 'Заправляйтесь в Кутаиси и Амбролаури: между Они и Шови заправок почти нет.'
  - Жильё в Раче ограничено и в основном семейное — бронируйте ночёвки заранее.
  - Настоящая Хванчкара производится только в зоне Амбролаури; смотрите на этикетку и производителя.
  - Зимой Накерала ловит снег и может закрыться на дни; с мая по октябрь заметно безопаснее.
  - Банкоматов у Они и Шови мало — берите наличные с собой.
fa:
  name: حلقهٔ کوهستانی راچا
  short: 'سه روز در راچا: کوتایسی، تکیبولی، نیکورتسمیندا، آمبرولاوری، شااوری و اونی.'
  body: >-
    راچا آرام‌ترین منطقهٔ کوهستانی گرجستان است — بی‌ازدحام، بی‌هتل‌های بزرگ، اما با جنگل، دریاچه، روستاهای
    سنگی و تاکستان‌هایی که خوانچکارا از آن‌ها می‌آید. مسیر از کوتایسی از میان تکیبولی و گردنهٔ ناکرالا
    بالا می‌رود، تا آمبرولاوری و اونی ادامه می‌یابد و در درهٔ کوهستانی شووی پایان می‌گیرد.

    روز اول طولانی است: 230 کیلومتر تا کوتایسی، سپس آبگیر تکیبولی و سرپیچ‌های ناکرالا، جایی که رشته‌کوه‌های
    راچا برای نخستین بار باز می‌شوند. درست آن سوی گردنه **نیکورتسمیندا** ایستاده است، کلیسای جامعی از
    سدهٔ یازدهم که احتمالاً پرکارترین نمای کنده‌کاری‌شدهٔ کشور را دارد و تقریباً سراسر آن نقش برجسته است.
    سپس **آبگیر شااوری** می‌آید، در دل جنگل کاج در ارتفاع 1,100 متر، جایی که اهالی در اوج تابستان شنا
    می‌کنند. روز دوم رود ریونی را از آمبرولاوری از میان اونی تا شووی بالا می‌رود، جایی که دره تنگ می‌شود
    و جاده به مرغزارهای زیرآلپی زیر ستیغ اصلی قفقاز صعود می‌کند.

    راچا مناسب مسافرانی است که سکوت و چشم‌انداز می‌خواهند و به زیرساخت صیقلی گردشگری نیازی ندارند. جاده
    تا آمبرولاوری آسفالت است، هرچند روی گردنه باریک و پرپیچ، و بعد از اونی کیفیت سطح افت می‌کند — اینجا
    ارتفاع کف کمک می‌کند. فصل از ماه مه تا اکتبر است؛ در زمستان ناکرالا برف می‌گیرد و ممکن است روزها بسته
    شود.
  plan: >-
    **روز 1 · تفلیس → کوتایسی → نیکورتسمیندا → آمبرولاوری (335 کیلومتر، 5 ساعت و 30 دقیقه)**

    - 08:00 حرکت از تفلیس روی E60، استراحت در گردنهٔ ریکوتی.

    - 11:30 کوتایسی: ناهار و گشتی کوتاه (1 ساعت و 30 دقیقه).

    - 14:00 آبگیر تکیبولی و نقطهٔ دید گردنهٔ ناکرالا (45 دقیقه).

    - 15:30 **کلیسای جامع نیکورتسمیندا** — کنده‌کاری‌ها و گنبد (1 ساعت).

    - 17:30 رسیدن به آمبرولاوری؛ خانهٔ شراب و مزهٔ خوانچکارا (1 ساعت).

    - شب در آمبرولاوری.


    **روز 2 · شااوری، اونی و شووی (150 کیلومتر، 3 ساعت)**

    - 09:00 **آبگیر شااوری** در جنگل کاج، قدم زدن کنار ساحل (1 ساعت و 30 دقیقه).

    - 11:30 درهٔ ریونی به سوی اونی، توقف کنار کلیسای باراکونی (45 دقیقه).

    - 13:00 اونی: مرکز قدیمی و ناهار (1 ساعت و 30 دقیقه).

    - 15:30 درهٔ کوهستانی شووی و چشمه‌های معدنی آن (2 ساعت).

    - 19:00 بازگشت؛ شب در آمبرولاوری یا اونی.


    **روز 3 · آمبرولاوری → تفلیس (330 کیلومتر، 5 ساعت و 30 دقیقه)**

    - 09:00 بازار و آخرین خریدها در آمبرولاوری (1 ساعت).

    - 10:30 بازگشت از ناکرالا و از میان تکیبولی.

    - 13:00 ناهار در کوتایسی (1 ساعت و 30 دقیقه).

    - 15:00 شرق روی E60 از راه زستافونی و خاشوری.

    - 19:30 بازگشت به تفلیس.
  tips:
  - گردنهٔ ناکرالا باریک و پرپیچ است — در مه آهسته برانید و بعد از اونی سطح بدتری انتظار داشته باشید.
  - در کوتایسی و آمبرولاوری سوخت‌گیری کنید؛ میان اونی و شووی تقریباً هیچ چیز نیست.
  - اقامتگاه‌ها در راچا محدود و بیشتر خانوادگی‌اند — شب‌ها را از پیش رزرو کنید.
  - خوانچکارای اصل فقط از منطقهٔ آمبرولاوری می‌آید؛ پیش از خرید برچسب و تولیدکننده را بررسی کنید.
  - در زمستان ناکرالا برف می‌گیرد و ممکن است روزها بسته باشد؛ ماه مه تا اکتبر بسیار امن‌تر است.
  - خودپرداز در اطراف اونی و شووی کمیاب است — پول نقد همراه ببرید.
he:
  name: לולאת ההרים של רצ'ה
  short: 'שלושה ימים ברצ''ה: קוטאיסי, טקיבולי, ניקורצמינדה, אמברולאורי, שאורי ואוני.'
  body: >-
    רצ'ה היא אזור ההרים השקט ביותר בגאורגיה — בלי המונים ובלי מלונות גדולים, אבל עם יער, אגמים, כפרי אבן
    והכרמים שמהם בא החוונצ'קרה. המסלול מטפס מקוטאיסי דרך טקיבולי ומעל מעבר נאקרלה, ממשיך לאמברולאורי ולאוני
    ומסתיים בעמק האלפיני שובי.

    היום הראשון ארוך: 230 קילומטרים לקוטאיסי, אחר כך מאגר טקיבולי והסרפנטינות של נאקרלה, שם רכסי רצ'ה
    נפתחים בפעם הראשונה. ממש מעבר למעבר עומדת **ניקורצמינדה**, קתדרלה מן המאה ה-11 שחזיתה המגולפת היא
    כנראה העשירה במדינה, מכוסה כמעט כולה בתבליטים. אחריה מגיע **מאגר שאורי**, השוכן ביער אורנים בגובה
    1,100 מטר, שבו המקומיים שוחים בשיא הקיץ. היום השני עולה במעלה הריוני מאמברולאורי דרך אוני לשובי, שם
    העמק מצטמצם והכביש מטפס אל אחו תת-אלפיני מתחת לרכס הקווקז הראשי.

    רצ'ה מתאימה לנוסעים שרוצים שקט ונוף ואינם זקוקים לתשתית תיירותית מלוטשת. הכביש סלול עד אמברולאורי,
    אם כי צר ומתפתל במעבר, ואיכות המשטח יורדת אחרי אוני — כאן גובה גחון עוזר. העונה היא ממאי עד אוקטובר;
    בחורף נאקרלה תופס שלג ועלול להיסגר לימים.
  plan: >-
    **יום 1 · טביליסי → קוטאיסי → ניקורצמינדה → אמברולאורי (335 ק״מ, 5 שעות 30 דקות)**

    - 08:00 יציאה מטביליסי בכביש E60, הפסקה במעבר ריקוטי.

    - 11:30 קוטאיסי: ארוחת צהריים והליכה קצרה (1 שעה 30 דקות).

    - 14:00 מאגר טקיבולי ותצפית מעבר נאקרלה (45 דקות).

    - 15:30 **קתדרלת ניקורצמינדה** — הגילופים והכיפה (1 שעה).

    - 17:30 הגעה לאמברולאורי; בית יין וטעימת חוונצ'קרה (1 שעה).

    - לינה באמברולאורי.


    **יום 2 · שאורי, אוני ושובי (150 ק״מ, 3 שעות)**

    - 09:00 **מאגר שאורי** ביער האורנים, הליכה לאורך החוף (1 שעה 30 דקות).

    - 11:30 עמק הריוני לעבר אוני, עצירה בכנסיית בראקוני (45 דקות).

    - 13:00 אוני: המרכז הישן וארוחת צהריים (1 שעה 30 דקות).

    - 15:30 העמק האלפיני שובי והמעיינות המינרליים שלו (2 שעות).

    - 19:00 נסיעה חזרה; לינה באמברולאורי או באוני.


    **יום 3 · אמברולאורי → טביליסי (330 ק״מ, 5 שעות 30 דקות)**

    - 09:00 שוק וקניות אחרונות באמברולאורי (1 שעה).

    - 10:30 חזרה מעל נאקרלה ודרך טקיבולי.

    - 13:00 ארוחת צהריים בקוטאיסי (1 שעה 30 דקות).

    - 15:00 מזרחה בכביש E60 דרך זסטפוני וחשורי.

    - 19:30 חזרה לטביליסי.
  tips:
  - מעבר נאקרלה צר ומתפתל — סעו לאט בערפל, וצפו למשטח גרוע יותר אחרי אוני.
  - תדלקו בקוטאיסי ובאמברולאורי; בין אוני לשובי כמעט אין כלום.
  - מקומות הלינה ברצ'ה מעטים ורובם משפחתיים — הזמינו את הלילות מראש.
  - חוונצ'קרה אמיתי מגיע רק מאזור אמברולאורי; בדקו את התווית והיצרן לפני הקנייה.
  - בחורף נאקרלה תופס שלג ועלול להיסגר לימים; מאי עד אוקטובר בטוחים בהרבה.
  - כספומטים נדירים בסביבות אוני ושובי — קחו איתכם מזומן.
ar:
  name: حلقة راتشا الجبلية
  short: 'ثلاثة أيام في راتشا: كوتايسي وتكيبولي ونيكورتسميندا وأمبرولاوري وشاوري وأوني.'
  body: >-
    راتشا هي أهدأ الأقاليم الجبلية في جورجيا — لا زحام ولا فنادق كبيرة، بل غابة وبحيرات وقرى حجرية والكروم
    التي يأتي منها نبيذ خفانتشكارا. يصعد المسار من كوتايسي عبر تكيبولي وفوق ممر ناكيرالا، ثم يمضي إلى
    أمبرولاوري وأوني، وينتهي في وادي شوفي الجبلي.

    اليوم الأول طويل: 230 كيلومتراً إلى كوتايسي، ثم خزان تكيبولي ومنعطفات ناكيرالا، حيث تنفتح سلاسل راتشا
    لأول مرة. وخلف الممر مباشرة تقف **نيكورتسميندا**، كاتدرائية من القرن الحادي عشر تحمل على الأرجح أغنى
    واجهة منقوشة في البلاد، مغطاة كلها تقريباً بالنقوش البارزة. ثم يأتي **خزان شاوري**، القابع في غابة
    صنوبر على ارتفاع 1,100 متر، حيث يسبح الأهالي في ذروة الصيف. واليوم الثاني يتبع نهر ريوني صعوداً من
    أمبرولاوري عبر أوني إلى شوفي، حيث يضيق الوادي ويصعد الطريق إلى مروج تحت-ألبية أسفل سلسلة القوقاز الرئيسية.

    تناسب راتشا المسافرين الباحثين عن الصمت والمشهد ولا يحتاجون إلى بنية سياحية مصقولة. الطريق معبّد حتى
    أمبرولاوري، وإن كان ضيقاً وملتوياً عند الممر، وتتدهور حالة السطح بعد أوني — وهنا يفيد الخلوص الأرضي.
    الموسم من مايو إلى أكتوبر؛ وفي الشتاء يحتجز ناكيرالا الثلج وقد يُغلق أياماً.
  plan: >-
    **اليوم 1 · تبليسي → كوتايسي → نيكورتسميندا → أمبرولاوري (335 كم، 5 ساعات و30 دقيقة)**

    - 08:00 المغادرة من تبليسي على الطريق E60، واستراحة عند ممر ريكوتي.

    - 11:30 كوتايسي: الغداء وجولة قصيرة سيراً (1 ساعة و30 دقيقة).

    - 14:00 خزان تكيبولي ومطل ممر ناكيرالا (45 دقيقة).

    - 15:30 **كاتدرائية نيكورتسميندا** — النقوش والقبة (1 ساعة).

    - 17:30 الوصول إلى أمبرولاوري؛ بيت النبيذ وتذوق خفانتشكارا (1 ساعة).

    - المبيت في أمبرولاوري.


    **اليوم 2 · شاوري وأوني وشوفي (150 كم، 3 ساعات)**

    - 09:00 **خزان شاوري** في غابة الصنوبر، ومشي على ضفته (1 ساعة و30 دقيقة).

    - 11:30 وادي ريوني نحو أوني، مع وقفة عند كنيسة باراكوني (45 دقيقة).

    - 13:00 أوني: المركز القديم والغداء (1 ساعة و30 دقيقة).

    - 15:30 وادي شوفي الجبلي وينابيعه المعدنية (2 ساعة).

    - 19:00 العودة؛ المبيت في أمبرولاوري أو أوني.


    **اليوم 3 · أمبرولاوري → تبليسي (330 كم، 5 ساعات و30 دقيقة)**

    - 09:00 السوق وآخر المشتريات في أمبرولاوري (1 ساعة).

    - 10:30 العودة فوق ناكيرالا وعبر تكيبولي.

    - 13:00 الغداء في كوتايسي (1 ساعة و30 دقيقة).

    - 15:00 شرقاً على الطريق E60 عبر زيستافوني وخاشوري.

    - 19:30 العودة إلى تبليسي.
  tips:
  - ممر ناكيرالا ضيق وملتوٍ — قد ببطء في الضباب، وتوقع سطحاً أسوأ بعد أوني.
  - املأ الخزان في كوتايسي وأمبرولاوري؛ فبين أوني وشوفي لا يكاد يوجد شيء.
  - أماكن الإقامة في راتشا محدودة ومعظمها عائلي — احجز لياليك مسبقاً.
  - خفانتشكارا الأصلي لا يأتي إلا من منطقة أمبرولاوري؛ تحقق من الملصق والمنتج قبل الشراء.
  - في الشتاء يحتجز ناكيرالا الثلج وقد يُغلق أياماً؛ ومن مايو إلى أكتوبر أكثر أماناً بكثير.
  - أجهزة الصراف الآلي نادرة حول أوني وشوفي — خذ نقوداً معك.
