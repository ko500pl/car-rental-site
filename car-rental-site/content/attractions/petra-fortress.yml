ka:
  name: პეტრას ციხე (ციხისძირი)
  short: ბიზანტიური ციხის ნანგრევები კლდოვან კონცხზე ზღვის თავზე, ქობულეთსა და ბათუმს შორის.
  body: >-
    პეტრას ციხე ციხისძირში, კლდოვან კონცხზე დგას, რომელიც პირდაპირ ზღვაზე გადმოდის. ეს იმ იშვიათი ადგილთაგანია,
    სადაც ისტორიული ძეგლი და სანაპირო ხედი ერთ წერტილში ხვდება.


    ციხე VI საუკუნეში, იმპერატორ იუსტინიანეს დროს აშენდა და ბიზანტიის სტრატეგიულ საყრდენ პუნქტს წარმოადგენდა
    შავი ზღვის აღმოსავლეთ სანაპიროზე. სახელი „პეტრა" ბერძნულად კლდეს ნიშნავს და ზუსტად აღწერს ადგილს.
    ციხე ცნობილია ლაზიკის ომების ეპიზოდით — VI საუკუნის შუა წლებში ბიზანტიისა და სასანური ირანის დაპირისპირებამ
    სწორედ აქ მიაღწია კულმინაციას და პეტრა რამდენჯერმე გადავიდა ხელიდან ხელში.


    დღეს ტერიტორიაზე ნახავთ:


    - **კედლებისა და კოშკების ნაშთებს**, ნაწილობრივ აღდგენილს

    - **ბაზილიკის საძირკველს** კონცხის ზედა ნაწილში

    - **ხედს შავ ზღვასა და სანაპიროზე** ორივე მიმართულებით


    ვიზიტი მოკლეა — ერთი საათი სავსებით საკმარისია და ის კარგად ჯდება ქობულეთსა და ბათუმს შორის გადაადგილებისას.
    ტერიტორია ღიაა და ინფრასტრუქტურა მინიმალურია, სამაგიეროდ ხალხმრავლობა აქ თითქმის არასდროსაა, რაც ზაფხულის
    სანაპიროზე იშვიათობაა. ციხისძირის პლაჟი უშუალოდ ქვემოთაა, ამიტომ ისტორიული გაჩერება და ბანაობა ერთ
    ნახევარ დღეში ადვილად თავსდება.
  tip: >-
    საუკეთესო დროა საღამო, როცა მზე ზღვაზე ეშვება — ეს აქაური ხედის მთავარი მომენტია. ბილიკები ქვიანი
    და ადგილ-ადგილ ციცაბოა, ამიტომ დახურული ფეხსაცმელი აირჩიეთ; წვიმის შემდეგ ქვები ძალიან სრიალა ხდება.
    ჩრდილი მინიმალურია და ზაფხულის შუადღე აქ ცხელია. მანქანა მაგისტრალის პირას, მითითებულ ადგილას ტოვებთ.
    კაფეები და მაღაზიები ციხისძირისა და ქობულეთის მიმართულებითაა, ბანკომატი — ქობულეთში.
  route: >-
    თბილისიდან დაახლოებით 355 კმ და ხუთი საათი და 20 წუთია. მთელი გზა E60-ზე გადის: გორი, ხაშური, რიკოთის
    მაგისტრალი, ქუთაისი, სამტრედია და შემდეგ სანაპიროზე ქობულეთის მიმართულებით. ციხისძირი ბათუმ-ქობულეთის
    ტრასის პირას, პირდაპირ გზაზეა და შემობრუნება არ დაგჭირდებათ. მისასვლელი ასფალტია და ეკონომ კლასის
    ავტომობილი სავსებით საკმარისია. საწვავი ქობულეთში ან ბათუმში აავსეთ; ორივე 10-15 კმ-შია.
en:
  name: Petra Fortress, Tsikhisdziri
  short: Byzantine fortress ruins on a rocky headland above the sea, between Kobuleti and Batumi.
  body: >-
    Petra fortress stands at Tsikhisdziri on a rocky headland that drops straight to the sea. It is one
    of those rare places where a historic monument and a coastal view occupy the same point.


    The fortress was built in the sixth century under the emperor Justinian as a Byzantine strongpoint
    on the eastern Black Sea coast. The name Petra means "rock" in Greek and describes the site exactly.
    It is best known from the Lazic Wars: in the middle of the sixth century the confrontation between
    Byzantium and Sasanian Persia reached its climax here, and Petra changed hands several times during
    the campaigns.


    Today you will find on the site:


    - **Remains of walls and towers**, partly consolidated

    - **The foundations of a basilica** on the upper part of the headland

    - **A view over the Black Sea** and the coastline in both directions


    The visit is short — an hour is entirely enough — and it fits neatly into a drive between Kobuleti
    and Batumi. The site is open, the infrastructure minimal, but in exchange it is almost never crowded,
    which is unusual for anything on this stretch of coast in summer.
  tip: >-
    Late afternoon is the best time, when the sun drops toward the sea — that is the point of the view
    here. The paths are stony and steep in places, so wear closed shoes; after rain the rock becomes genuinely
    slippery. There is very little shade and midday in summer is hot. Park in the marked area beside the
    main road. Cafes and shops are along the road toward Kobuleti, and the nearest ATM is in Kobuleti
    itself, about ten minutes away.
  route: >-
    It is about 355 km and five hours twenty from Tbilisi. The whole route follows the E60: Gori, Khashuri,
    the Rikoti section, Kutaisi, Samtredia and then down the coast toward Kobuleti. Tsikhisdziri sits
    directly on the Kobuleti–Batumi road, so no detour or turning back is needed. The access is paved
    and an economy car is entirely sufficient. Fill up in Kobuleti or Batumi; both are ten to fifteen
    kilometres away, and there is a station on the main road nearby.
ru:
  name: Крепость Петра (Цихисдзири)
  short: Руины византийской крепости на скалистом мысу над морем, между Кобулети и Батуми.
  body: >-
    Крепость Петра стоит в Цихисдзири на скалистом мысу, который обрывается прямо к морю. Это одно из
    редких мест, где исторический памятник и морской вид оказываются в одной точке.


    Крепость построили в VI веке при императоре Юстиниане как византийский опорный пункт на восточном
    берегу Чёрного моря. Название «Петра» по-гречески означает «скала» и описывает место буквально. Известна
    крепость прежде всего по Лазским войнам: в середине VI века противостояние Византии и сасанидского
    Ирана достигло здесь кульминации, и Петра несколько раз переходила из рук в руки.


    Сегодня на территории вы найдёте:


    - **Остатки стен и башен**, частично законсервированные

    - **Фундаменты базилики** в верхней части мыса

    - **Вид на Чёрное море** и побережье в обе стороны


    Визит короткий — часа вполне достаточно — и хорошо вписывается в переезд между Кобулети и Батуми.
    Территория открытая, инфраструктура минимальная, зато людно здесь почти никогда не бывает, что для
    этого участка побережья летом редкость.
  tip: >-
    Лучшее время — ближе к вечеру, когда солнце опускается к морю: именно ради этого вида сюда и стоит
    заезжать. Тропы каменистые и местами крутые, обувь берите закрытую; после дождя камень становится
    по-настоящему скользким. Тени почти нет, летний полдень здесь жаркий. Машину оставляйте на обозначенной
    площадке у основной дороги. Кафе и магазины тянутся вдоль трассы в сторону Кобулети, ближайший банкомат
    — там же, минутах в десяти.
  route: >-
    От Тбилиси около 355 км и пять часов двадцать минут. Весь маршрут идёт по трассе E60: Гори, Хашури,
    Рикотский участок, Кутаиси, Самтредиа, затем спуск к побережью в сторону Кобулети. Цихисдзири расположено
    прямо на дороге Кобулети — Батуми, разворачиваться или делать крюк не придётся. Подъезд асфальтированный,
    машины эконом-класса вполне достаточно. Заправляйтесь в Кобулети или Батуми: оба в десяти-пятнадцати
    километрах, есть станция и на трассе рядом.
fa:
  name: دژ پترا، تسیخیسدزیری
  short: ویرانه‌های دژی بیزانسی روی دماغه‌ای صخره‌ای بالای دریا، میان کوبولتی و باتومی.
  body: >-
    دژ پترا در تسیخیسدزیری روی دماغه‌ای صخره‌ای ایستاده است که مستقیم به دریا فرو می‌ریزد. اینجا یکی از
    آن جاهای نادری است که یک بنای تاریخی و یک منظرهٔ ساحلی در یک نقطه جمع شده‌اند.


    دژ در سدهٔ ششم در روزگار امپراتور ژوستینیانوس همچون پایگاهی بیزانسی بر ساحل شرقی دریای سیاه ساخته
    شد. نام «پترا» در یونانی یعنی صخره و دقیقاً همین جا را وصف می‌کند. شهرت آن بیش از همه به جنگ‌های لازیک
    بازمی‌گردد: در میانهٔ سدهٔ ششم رویارویی بیزانس و ایران ساسانی درست همین‌جا به اوج رسید و پترا در جریان
    آن لشکرکشی‌ها بارها دست به دست شد.


    امروز روی محوطه **بازمانده‌های دیوارها و برج‌ها** را می‌بینید که بخشی از آن‌ها تثبیت شده است، **پی‌های
    یک باسیلیکا** در بخش بالایی دماغه، و **چشم‌اندازی به دریای سیاه** و خط ساحلی در هر دو سو. بازدید کوتاه
    است — یک ساعت کاملاً کافی است — و به‌خوبی در رانندگی میان کوبولتی و باتومی جا می‌گیرد. محوطه باز است
    و زیرساخت آن حداقلی، اما در عوض تقریباً هیچ‌وقت شلوغ نمی‌شود، و این برای هر نقطه‌ای از این نوار ساحلی
    در تابستان غیرعادی است.
  tip: >-
    بهترین وقت اواخر بعدازظهر است، وقتی خورشید به سوی دریا پایین می‌آید — منظرهٔ اینجا برای همین لحظه
    است. مسیرها سنگلاخ‌اند و جاهایی تند، پس کفش بسته بپوشید؛ پس از باران صخره واقعاً لغزنده می‌شود. سایه
    بسیار کم است و ظهر تابستان گرم. خودرو را در محوطهٔ علامت‌گذاری‌شده کنار جادهٔ اصلی بگذارید. کافه‌ها
    و مغازه‌ها در امتداد جاده به سوی کوبولتی‌اند و نزدیک‌ترین خودپرداز در خود کوبولتی است، حدود ده دقیقه
    دورتر.
  route: >-
    از تفلیس حدود 355 کیلومتر و پنج ساعت و بیست دقیقه راه است. تمام مسیر روی E60 می‌گذرد: گوری، خاشوری،
    مقطع ریکوتی، کوتایسی، سامتردیا و سپس پایین به سوی ساحل و کوبولتی. تسیخیسدزیری درست روی جادهٔ کوبولتی–باتومی
    است، پس نه انحرافی لازم است و نه بازگشتی. دسترسی آسفالت است و خودروی اقتصادی کاملاً کافی. باک را در
    کوبولتی یا باتومی پر کنید؛ هر دو ده تا پانزده کیلومتر فاصله دارند و پمپ‌بنزینی هم نزدیک جادهٔ اصلی
    هست.
he:
  name: מבצר פטרה, ציחיסדזירי
  short: חורבות מבצר ביזנטי על צוק סלעי מעל הים, בין קובולטי לבטומי.
  body: >-
    מבצר פטרה עומד בציחיסדזירי על לשון סלע שצונחת היישר אל הים. זהו אחד המקומות הנדירים שבהם מונומנט היסטורי
    ונוף חופי נמצאים באותה נקודה ממש, ואין צורך לבחור בין השניים.


    המבצר נבנה במאה השישית בימי הקיסר יוסטיניאנוס כמעוז ביזנטי בחוף המזרחי של הים השחור. השם פטרה פירושו
    "סלע" ביוונית והוא מתאר את המקום במדויק — מי שעומד למרגלות הצוק מבין מיד מדוע. הוא מוכר בעיקר ממלחמות
    לזיקה: באמצע המאה השישית הגיע כאן העימות בין ביזנטיון לפרס הסאסאנית לשיאו, ופטרה החליפה ידיים כמה
    פעמים במהלך המערכות.


    היום תמצאו באתר **שרידי חומות ומגדלים** שחלקם יוצבו, את **יסודות הבזיליקה** בחלק העליון של הצוק, ו**תצפית
    אל הים השחור** ואל קו החוף לשני הכיוונים. הביקור קצר — שעה מספיקה בהחלט — והוא משתלב יפה בנסיעה בין
    קובולטי לבטומי. האתר פתוח, התשתית מינימלית, אבל בתמורה כמעט אף פעם אין בו צפיפות, וזה דבר חריג בכל
    מה שנמצא על רצועת החוף הזאת בקיץ. ההגעה אינה דורשת עיקוף כלל: האתר יושב ממש על הכביש בין קובולטי לבטומי,
    ומי שנוסע לאורך החוף כמעט אינו מאבד זמן בעצירה כאן.
  tip: >-
    השעה הטובה ביותר היא אחר הצהריים המאוחר, כשהשמש יורדת אל הים — בשביל זה באים לתצפית הזאת. השבילים
    אבניים ותלולים במקומות, לכן נעלו נעליים סגורות; אחרי גשם הסלע נעשה חלקלק באמת. הצל מועט מאוד וצהרי
    הקיץ חמים. החנו במגרש המסומן לצד הכביש הראשי. בתי קפה וחנויות נמצאים לאורך הכביש לכיוון קובולטי, והכספומט
    הקרוב ביותר בקובולטי עצמה, כעשר דקות משם.
  route: >-
    מטביליסי מדובר בכ-355 ק״מ ובכחמש שעות ועשרים דקות. כל המסלול עובר על E60: גורי, חשורי, קטע ריקוטי,
    קוטאיסי, סמטרדיה ואז דרומה לאורך החוף לכיוון קובולטי. ציחיסדזירי יושבת ממש על כביש קובולטי–בטומי,
    ולכן אין צורך בעיקוף או בחזרה לאחור. הגישה סלולה ורכב חסכוני מספיק לחלוטין. תדלקו בקובולטי או בבטומי;
    שתיהן במרחק עשרה עד חמישה עשר קילומטרים, ויש גם תחנה על הכביש הראשי בסביבה.
ar:
  name: حصن بيترا، تسيخيسدزيري
  short: أطلال حصن بيزنطي على نتوء صخري فوق البحر، بين كوبوليتي وباتومي.
  body: >-
    يقف حصن بيترا في تسيخيسدزيري على نتوء صخري ينحدر مباشرة إلى البحر. وهو من الأماكن النادرة التي يجتمع
    فيها معلم تاريخي وإطلالة ساحلية في نقطة واحدة، فلا حاجة إلى الاختيار بين الاثنين.


    بُني الحصن في القرن السادس في عهد الإمبراطور جستنيان قاعدةً بيزنطية على الساحل الشرقي للبحر الأسود.
    واسم «بيترا» يعني الصخرة باليونانية، وهو يصف الموقع تماماً. وأشهر ما يُذكر به الحروب اللازية: ففي
    منتصف القرن السادس بلغت المواجهة بين بيزنطة وفارس الساسانية ذروتها هنا، وتبادلت الأيدي السيطرة على
    بيترا مرات عدة خلال تلك الحملات.


    وتجد في الموقع اليوم **بقايا أسوار وأبراج** جرى تدعيم بعضها، و**أساسات بازيليكا** في الجزء الأعلى
    من النتوء، و**إطلالة على البحر الأسود** وعلى الساحل في الاتجاهين. الزيارة قصيرة — ساعة تكفي تماماً
    — وتندرج بسلاسة في القيادة بين كوبوليتي وباتومي. الموقع مفتوح وبنيته التحتية بسيطة، لكنه في المقابل
    لا يكاد يزدحم يوماً، وهذا أمر غير مألوف لأي موقع على هذا الشريط الساحلي في الصيف. والوصول لا يتطلب
    أي انعطاف: الموقع على طريق كوبوليتي–باتومي مباشرة، ومن يقود على الساحل لا يكاد يخسر وقتاً بالتوقف
    هنا.
  tip: >-
    أفضل وقت هو أواخر العصر، حين تنحدر الشمس نحو البحر — فهذا هو مغزى الإطلالة هنا. الدروب حجرية وحادة
    في مواضع، فالبس حذاءً مغلقاً؛ وبعد المطر يصبح الصخر زلقاً فعلاً. الظل قليل جداً وظهيرة الصيف حارة.
    أوقف السيارة في المساحة المخصصة بجانب الطريق الرئيسي. المقاهي والمتاجر على امتداد الطريق نحو كوبوليتي،
    وأقرب صراف آلي في كوبوليتي نفسها، على بعد نحو عشر دقائق.
  route: >-
    المسافة من تبليسي نحو 355 كم وخمس ساعات وعشرين دقيقة. والمسار كله على E60: غوري وخاشوري ومقطع ريكوتي
    وكوتايسي وسامتريديا، ثم نزولاً على الساحل نحو كوبوليتي. وتقع تسيخيسدزيري على طريق كوبوليتي–باتومي
    مباشرة، فلا حاجة إلى انعطاف أو رجوع. الوصول معبّد وسيارة اقتصادية تكفي تماماً. املأ الخزان في كوبوليتي
    أو باتومي؛ كلتاهما على بعد عشرة إلى خمسة عشر كيلومتراً، وهناك محطة على الطريق الرئيسي قريبة.
