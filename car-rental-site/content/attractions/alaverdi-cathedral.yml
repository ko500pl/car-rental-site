ka:
  name: ალავერდის საკათედრო ტაძარი
  short: >-
    XI საუკუნის ორმოცდაათმეტრიანი ტაძარი ალაზნის ველზე — საუკუნეების განმავლობაში საქართველოს ყველაზე
    მაღალი ნაგებობა.
  body: >-
    ალავერდი ალაზნის ველის შუაგულში, თელავიდან ჩრდილო-დასავლეთით ოციოდე კილომეტრში დგას. ტაძარი XI საუკუნის
    დასაწყისში კახეთის მეფე კვირიკე III-ის დროს აშენდა და თითქმის ცხრაასი წლის განმავლობაში საქართველოში
    ყველაზე მაღალი ნაგებობა იყო — გუმბათის სიმაღლე ორმოცდაათ მეტრს აღწევს. ეს რიცხვი ქაღალდზე მშრალად
    ჟღერს, სინამდვილეში კი ეფექტი ძლიერია: ბრტყელ ველზე, სოფლების და ვენახების ფონზე, შენობა შორიდანვე
    ჩანს.


    მონასტერი უფრო ადრეულია — VI საუკუნეში ასურელმა მამამ იოსებ ალავერდელმა დააარსა და მისი სამარხი დღემდე
    ტაძარშია. ინტერიერი თითქმის ცარიელია და სწორედ ეს არის მთავარი შთაბეჭდილება: მაღალი, ვიწრო სივრცე,
    ზემოდან ჩამომავალი შუქი და კედლების ფრაგმენტული მოხატულობა, რომლის ნაწილი XV–XVI საუკუნეებით თარიღდება.
    აკუსტიკა განსაკუთრებულია.


    ტაძარს გარს XVII–XVIII საუკუნეების გალავანი და სამონასტრო ნაგებობები აკრავს: სატრაპეზო, აბანო, სამარხები.
    მონასტერს საკუთარი მარანი აქვს და ალავერდის ღვინის ტრადიცია — მონასტრის ბერების მიერ ქვევრში დაყენებული
    ღვინო — რეგიონის ერთ-ერთი ყველაზე ცნობილი ეტიკეტია. სექტემბერში აქ „ალავერდობის“ დღესასწაულია და ხალხმრავლობაა.
    ტაძრიდან კავკასიონის ქედი მთელი სიგრძით მოჩანს, ირგვლივ კი ვენახები და პატარა სოფლებია. გაზაფხულზე,
    როცა მთებს ჯერ კიდევ თოვლი ადევს, ხედი განსაკუთრებით მკვეთრია, შემოდგომაზე კი ალავერდის შემოგარენში
    რთველი მიდის და გზაზე ყურძნით დატვირთულ ტრაქტორებს გადააწყდებით.
  tip: >-
    ჩაცმის წესი მკაცრად სრულდება: ქალებს გრძელი კაბა და თავსაბურავი, მამაკაცებს გრძელი შარვალი — შორტში
    არ შეგიშვებენ; გასახვევები შესასვლელთანაა. მოდით დილით, როცა შუქი აღმოსავლეთის ფანჯრებიდან შემოდის
    და ტურისტების ნაკადი ჯერ არ დაწყებულა. მანქანა გალავნის წინ, უფასო მოედანზე დგება. საათი სავსებით
    საკმარისია. ტუალეტი ტერიტორიაზეა, კაფე კი მხოლოდ ახლომდებარე სოფელში.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ ჩრდილო-დასავლეთით ახმეტის მიმართულებით კიდევ
    თხუთმეტიოდე კილომეტრი — სულ დაახლოებით 110 კმ და ორი საათი. ველზე გასული გზა ბრტყელი და ასფალტიანია,
    ეკონომ კლასის მანქანა სავსებით საკმარისია; ტაძრისკენ მოსახვევი კარგად ჩანს და ბოლო კილომეტრი ვიწრო,
    მაგრამ მოასფალტებული ქუჩაა. საწვავს ავსებთ თელავში. თუ გომბორი თოვლის გამო დაკეტილია, გადით საგარეჯო–გურჯაანის
    გზით — ოცდაათი კილომეტრით მეტი.
en:
  name: Alaverdi Cathedral
  short: >-
    An eleventh-century cathedral rising fifty metres out of the Alazani plain — for centuries the tallest
    building in Georgia.
  body: >-
    Alaverdi stands in the middle of the Alazani plain, some twenty kilometres north-west of Telavi. The
    cathedral was raised in the early eleventh century under the Kakhetian king Kvirike III and remained
    the tallest building in Georgia for close to nine hundred years, its dome reaching about fifty metres.
    The figure reads dryly on paper, but the effect on the ground is considerable: on flat farmland, above
    villages and vineyards, the church is visible from a long way off and gives the whole valley its scale.


    The monastery is older than the cathedral. It was founded in the sixth century by **Joseph of Alaverdi**,
    one of the Assyrian Fathers, and his tomb is still inside the church. The interior is almost bare,
    and that is exactly the point — a tall, narrow volume, light falling from high windows, and fragments
    of wall painting, some of it dating to the fifteenth and sixteenth centuries. The acoustics are unusually
    good, and a service here is worth timing your visit around.


    A defensive wall of the seventeenth and eighteenth centuries encloses the cathedral together with
    a refectory, a bathhouse and burial vaults. The monastery keeps its own cellar, and Alaverdi wine
    — made by the monks in buried qvevri — is among the better-known labels of the region. The Alaverdoba
    feast in September fills the grounds.
  tip: >-
    The dress code is enforced: women need a long skirt and head covering, men long trousers, and shorts
    will not get you through the gate. Wraps hang by the entrance. Morning is the best time, with light
    coming through the eastern windows and the tour traffic not yet arrived. Parking is on the free forecourt
    outside the wall. An hour is genuinely enough. There is a toilet on site; the nearest café is in the
    neighbouring village.
  route: >-
    From Tbilisi take the Gombori Pass road to Telavi (95 km), then continue north-west towards Akhmeta
    for another fifteen kilometres or so — about 110 km and two hours in total. Once on the plain the
    road is flat, well-surfaced asphalt and an economy car is entirely adequate; the turning is clearly
    visible and the last kilometre is a narrow but paved village street. Fill up in Telavi. If Gombori
    is shut by snow, use the Sagarejo–Gurjaani highway instead, which adds roughly thirty kilometres.
ru:
  name: Собор Алаверди
  short: Собор XI века высотой около пятидесяти метров посреди Алазанской равнины — веками самое высокое
    здание Грузии.
  body: >-
    Алаверди стоит посреди Алазанской равнины, примерно в двадцати километрах северо-западнее Телави.
    Собор возвели в начале XI века при кахетинском царе Квирике III, и почти девятьсот лет он оставался
    самым высоким зданием Грузии — купол поднимается примерно на пятьдесят метров. На бумаге цифра звучит
    сухо, но на месте эффект сильный: на плоской равнине, над сёлами и виноградниками, храм виден издалека
    и задаёт масштаб всей долине.


    Монастырь старше собора. Его основал в VI веке **Иосиф Алавердский**, один из ассирийских отцов, и
    его гробница до сих пор находится внутри храма. Интерьер почти пустой, и в этом всё дело: высокий
    узкий объём, свет из верхних окон и фрагменты росписи, часть которой относят к XV–XVI векам. Акустика
    здесь редкая, и попасть на службу стоит специально.


    Собор окружает крепостная ограда XVII–XVIII веков вместе с трапезной, баней и усыпальницами. У монастыря
    есть собственный марани, а вино Алаверди, которое монахи делают в закопанных квеври, — одна из самых
    известных этикеток региона. В сентябре здесь проходит праздник Алавердоба, и территория заполняется
    людьми.
  tip: >-
    Дресс-код соблюдают строго: женщинам длинная юбка и платок, мужчинам длинные брюки, в шортах внутрь
    не пустят. Накидки висят у входа. Лучше приезжать утром, когда свет идёт из восточных окон, а экскурсионный
    поток ещё не начался. Парковка — на бесплатной площадке перед оградой. Часа вполне достаточно. Туалет
    есть на территории, ближайшее кафе — в соседнем селе.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави (95 км), затем на северо-запад в сторону Ахметы ещё
    около пятнадцати километров — всего примерно 110 км и два часа. По равнине дорога ровная и асфальтированная,
    машины эконом-класса вполне достаточно; поворот хорошо заметен, последний километр — узкая, но асфальтовая
    сельская улица. Заправляйтесь в Телави. Если Гомбори закрыт из-за снега, поезжайте по трассе через
    Сагареджо и Гурджаани — это добавит около тридцати километров.
fa:
  name: کلیسای جامع آلاوردی
  short: کلیسای جامعی از سدهٔ یازدهم که پنجاه متر از دشت آلازانی سر برمی‌آورد — قرن‌ها بلندترین بنای گرجستان.
  body: >-
    آلاوردی در میانهٔ دشت آلازانی و حدود بیست کیلومتری شمال‌غربی تلاوی ایستاده است. کلیسای جامع در آغاز
    سدهٔ یازدهم به فرمان کویریکه سوم، پادشاه کاختی، برپا شد و نزدیک به نهصد سال بلندترین بنای گرجستان
    ماند؛ گنبد آن به حدود پنجاه متر می‌رسد. این عدد روی کاغذ خشک به نظر می‌آید، اما اثر آن در محل چشمگیر
    است: بر زمین‌های کشاورزی صاف، بالای روستاها و تاکستان‌ها، کلیسا از فاصله‌ای دور دیده می‌شود و مقیاس
    کل دره را تعیین می‌کند.


    صومعه از خود کلیسا کهن‌تر است. آن را در سدهٔ ششم **یوسف آلاوردی**، یکی از پدران آشوری، بنیاد نهاد
    و آرامگاهش هنوز درون کلیساست. فضای داخلی تقریباً خالی است و دقیقاً همین نکتهٔ اصلی است: حجمی بلند
    و باریک، نوری که از پنجره‌های مرتفع فرو می‌ریزد، و پاره‌هایی از نقاشی دیواری که بخشی از آن به سده‌های
    پانزدهم و شانزدهم می‌رسد. آکوستیک به‌طور غیرعادی خوب است و ارزش دارد بازدید را با یک مراسم هم‌زمان
    کنید.


    حصاری دفاعی از سده‌های هفدهم و هجدهم کلیسا را همراه با غذاخوری، گرمابه و دخمه‌های تدفین در بر گرفته
    است. صومعه سردابهٔ خود را دارد و شراب آلاوردی — که راهبان در کوِوری‌های مدفون می‌سازند — از شناخته‌شده‌ترین
    برچسب‌های منطقه است. جشن آلاوردوبا در سپتامبر محوطه را پر می‌کند.
  tip: >-
    قواعد پوشش جدی اجرا می‌شود: زنان به دامن بلند و روسری نیاز دارند، مردان به شلوار بلند، و با شلوارک
    از دروازه رد نمی‌شوید. شال‌ها کنار ورودی آویزان است. صبح بهترین وقت است، وقتی نور از پنجره‌های شرقی
    می‌تابد و هنوز تورها نرسیده‌اند. پارکینگ در محوطهٔ باز بیرون حصار و رایگان است. یک ساعت واقعاً کافی
    است. سرویس بهداشتی در محل هست؛ نزدیک‌ترین کافه در روستای همسایه است.
  route: >-
    از تفلیس جادهٔ گردنهٔ گومبوری را تا تلاوی بگیرید (95 کیلومتر)، سپس حدود پانزده کیلومتر دیگر به شمال‌غرب
    به سوی آخمتا ادامه دهید — در مجموع حدود 110 کیلومتر و دو ساعت. روی دشت جاده صاف و آسفالت خوبی دارد
    و خودروی اقتصادی کاملاً کافی است؛ انشعاب به‌روشنی دیده می‌شود و کیلومتر آخر خیابانی روستایی، باریک
    اما آسفالته است. باک را در تلاوی پر کنید. اگر گومبوری زیر برف بسته باشد، به‌جای آن از بزرگراه ساگارجو–گورجاانی
    بروید که حدود سی کیلومتر اضافه می‌کند.
he:
  name: קתדרלת אלאוורדי
  short: קתדרלה מן המאה ה-11 המתנשאת חמישים מטר מעל מישור אלאזני — במשך מאות שנים המבנה הגבוה בגאורגיה.
  body: >-
    אלאוורדי עומדת בלב מישור אלאזני, כעשרים קילומטרים צפונית-מערבית לטלאווי. הקתדרלה הוקמה בתחילת המאה
    ה-11 בימי המלך הקחתי קוויריקה השלישי ונשארה המבנה הגבוה בגאורגיה קרוב לתשע מאות שנה, כשכיפתה מגיעה
    לגובה של כחמישים מטר. המספר נשמע יבש על הנייר, אבל בשטח האפקט ניכר: מעל שדות מישוריים, כפרים וכרמים,
    הכנסייה נראית ממרחק רב וקובעת את קנה המידה של העמק כולו.


    המנזר עתיק מן הקתדרלה. הוא נוסד במאה השישית בידי **יוסף מאלאוורדי**, אחד האבות האשורים, וקברו נמצא
    עד היום בתוך הכנסייה. הפנים כמעט ריק, וזו בדיוק הנקודה — חלל גבוה וצר, אור היורד מחלונות גבוהים ושברי
    ציורי קיר, שחלקם מן המאות ה-15 וה-16. האקוסטיקה טובה במיוחד, וכדאי לתזמן את הביקור סביב תפילה.


    חומת מגן מן המאות ה-17 וה-18 מקיפה את הקתדרלה יחד עם חדר אוכל, בית מרחץ וכוכי קבורה. למנזר מרתף משלו,
    ויין אלאוורדי — שהנזירים מייצרים בכדי קווברי קבורים — נמנה עם התוויות המוכרות באזור. חג האלאוורדובה
    בספטמבר ממלא את המתחם בעולי רגל, בדוכנים ובמשפחות שמגיעות מכל רחבי העמק ליום שלם.
  tip: >-
    קוד הלבוש נאכף: נשים זקוקות לחצאית ארוכה ולכיסוי ראש, גברים למכנסיים ארוכים, ובמכנסיים קצרים לא תעברו
    את השער. מטפחות תלויות ליד הכניסה. הבוקר הוא הזמן הטוב ביותר, כשהאור נכנס מהחלונות המזרחיים והאוטובוסים
    עוד לא הגיעו. החניה היא במגרש החופשי מחוץ לחומה. שעה אחת באמת מספיקה. יש שירותים במקום; בית הקפה הקרוב
    ביותר נמצא בכפר השכן.
  route: >-
    מטביליסי סעו בדרך מעבר גומבורי לטלאווי (95 ק״מ), ומשם המשיכו צפונה-מערבה לכיוון אחמטה עוד כחמישה עשר
    קילומטרים — כ-110 ק״מ ושעתיים בסך הכול. במישור הכביש שטוח ואספלט טוב, ורכב חסכוני מספיק לחלוטין; הפנייה
    נראית בבירור והקילומטר האחרון הוא רחוב כפרי צר אך סלול. תדלקו בטלאווי. אם מעבר גומבורי סגור בשלג,
    סעו במקומו בכביש סאגארג'ו–גורג'אני, שמוסיף כשלושים קילומטרים.
ar:
  name: كاتدرائية ألافيردي
  short: كاتدرائية من القرن الحادي عشر ترتفع خمسين متراً فوق سهل ألازاني — وظلت قروناً أعلى بناء في جورجيا.
  body: >-
    تقوم ألافيردي في وسط سهل ألازاني، على نحو عشرين كيلومتراً شمال غرب تيلافي. رُفعت الكاتدرائية في أوائل
    القرن الحادي عشر في عهد الملك الكاخيتي كفيريكي الثالث، وظلت أعلى بناء في جورجيا قرابة تسعمئة سنة،
    إذ تبلغ قبتها نحو خمسين متراً. يبدو الرقم جافاً على الورق، لكن أثره في الموقع كبير: ففوق أرض زراعية
    مستوية، وفوق القرى والكروم، تُرى الكنيسة من مسافة بعيدة وتمنح الوادي كله مقياسه.


    الدير أقدم من الكاتدرائية. أسسه في القرن السادس **يوسف الألافيردي**، أحد الآباء الآشوريين، وما زال
    قبره داخل الكنيسة. الداخل شبه خالٍ، وهذا بالضبط جوهر الأمر: حيز عالٍ ضيق، وضوء ينزل من نوافذ مرتفعة،
    وبقايا رسوم جدارية يعود بعضها إلى القرنين الخامس عشر والسادس عشر. والصوتيات جيدة إلى حد غير مألوف،
    ويستحق الأمر أن تضبط زيارتك على موعد قداس.


    ويحيط سور دفاعي من القرنين السابع عشر والثامن عشر بالكاتدرائية ومعها مائدة الرهبان وحمام ومدافن. وللدير
    قبوه الخاص، ونبيذ ألافيردي — الذي يصنعه الرهبان في جرار كفيفري مدفونة — من أشهر تسميات المنطقة. ويملأ
    عيد ألافيردوبا في سبتمبر ساحات الدير.
  tip: >-
    قواعد اللباس مطبقة فعلاً: تحتاج النساء إلى تنورة طويلة وغطاء رأس، والرجال إلى سروال طويل، ولن تمر
    من البوابة بسروال قصير. الأغطية معلقة عند المدخل. الصباح أفضل الأوقات، حين يدخل الضوء من النوافذ الشرقية
    وقبل وصول حافلات الجولات. الوقوف في الساحة المجانية خارج السور. ساعة واحدة تكفي فعلاً. توجد دورة مياه
    في الموقع؛ وأقرب مقهى في القرية المجاورة.
  route: >-
    من تبليسي اسلك طريق ممر غومبوري إلى تيلافي (95 كم)، ثم تابع شمالاً غرباً نحو أخميتا نحو خمسة عشر كيلومتراً
    أخرى — أي قرابة 110 كم وساعتين إجمالاً. وعلى السهل يكون الطريق مستوياً وإسفلته جيداً وسيارة اقتصادية
    تكفي تماماً؛ والمنعطف واضح، والكيلومتر الأخير شارع قروي ضيق لكنه معبّد. املأ الخزان في تيلافي. وإن
    أُغلق ممر غومبوري بالثلج فاسلك بدلاً منه طريق ساغاريجو–غورجاني، وهو يضيف نحو ثلاثين كيلومتراً.
