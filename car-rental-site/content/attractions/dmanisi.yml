ka:
  name: დმანისის არქეოლოგიური ნაქალაქარი
  short: >-
    ადგილი, სადაც აფრიკის გარეთ უძველესი ჰომინიდები აღმოაჩინეს — 1,8 მილიონი წლის ნაშთები და შუასაუკუნეების
    ქალაქი.
  body: >-
    დმანისი ორ სრულიად განსხვავებულ ისტორიას აერთიანებს. ერთი შუა საუკუნეებისაა: მაშავერასა და ფინეზაურის
    შესართავთან, კონცხზე, დგებოდა ქალაქი და ციხე, რომელიც XI–XIV საუკუნეებში ვაჭრობის მნიშვნელოვანი კვანძი
    იყო; შემორჩა გალავანი, აბანო, სამარხები და დმანისის სიონი — VI საუკუნის ბაზილიკა, რომელსაც XIII საუკუნეში
    მოჩუქურთმებული კარიბჭე დაემატა.


    მეორე ისტორია გაცილებით ღრმაა. 1991 წლიდან შუასაუკუნეების ფენების ქვეშ არქეოლოგებმა ჰომინიდების ნაშთები
    აღმოაჩინეს, რომელთა ასაკიც დაახლოებით **1,8 მილიონი წელია**. ეს დღემდე აფრიკის გარეთ ნაპოვნი უძველესი
    ადამიანისებრი ნაშთებია და მათ სახეობა ცალკე გამოყოფენ — Homo erectus georgicus. აღმოჩენილია ხუთი თავის
    ქალა, მათ შორის ის ორი, რომლებსაც საქართველოში ზეზვასა და მზიას უწოდებენ, ასევე ქვის იარაღები და ცხოველთა
    ძვლები.


    ადგილზე მუზეუმი და დაცული საექსპოზიციო ფარდულია, სადაც გათხრის ჭრილი ორიგინალურ სახეშია დატოვებული.
    ორიგინალური თავის ქალები თბილისში, საქართველოს ეროვნულ მუზეუმშია, დმანისში კი ასლები და ვრცელი ახსნა-განმარტება.
    გათხრები ზაფხულობით დღემდე გრძელდება და მუშაობის პროცესის დანახვაც შესაძლებელია. აღმოჩენამ დმანისში
    მნიშვნელოვნად შეცვალა წარმოდგენა იმაზე, თუ როდის დატოვეს პირველმა ადამიანისებრებმა აფრიკა — აქამდე
    ეს პერიოდი გაცილებით გვიანდელად ითვლებოდა. ამიტომ ეს პატარა და მოკრძალებული ადგილი მსოფლიო პალეოანთროპოლოგიის
    სახელმძღვანელოებში მოხვდა.
  tip: >-
    დმანისი გულშემატკივართათვის უფრო საინტერესოა, ვიდრე შემთხვევითი გამვლელისთვის — ნახეთ ჯერ ეროვნული
    მუზეუმის ექსპოზიცია თბილისში, შემდეგ კი ადგილი მეტ აზრს შეიძენს. ორი საათი საკმარისია მუზეუმისა და
    ნაქალაქარისთვის. ტერიტორია ღიაა, ჩრდილი მცირე — ქუდი და წყალი აუცილებელია. მანქანა შესასვლელთან დგება.
    კაფე და ბანკომატი მხოლოდ დმანისის ცენტრშია, ნაქალაქარიდან ოციოდე კილომეტრში.
  route: >-
    თბილისიდან გადით მარნეულის მიმართულებით, შემდეგ დასავლეთით — ბოლნისსა და კაზრეთზე დმანისამდე, სულ
    დაახლოებით 85 კმ და საათი და ორმოცდაათი წუთი. მარნეულამდე გზა ფართო და კარგია, შემდეგ ვიწროვდება,
    თუმცა ბოლომდე მოასფალტებული რჩება; ნაქალაქარამდე ბოლო ორიოდე კილომეტრი უხეშია, მაგრამ მშრალ ამინდში
    ჩვეულებრივი მანქანაც გაივლის. საწვავს ავსებთ მარნეულში ან ბოლნისში. თუ ბირთვისსაც გეგმავთ, ორივე ერთ
    დღეში ეტევა.
en:
  name: Dmanisi
  short: >-
    Where the oldest hominins outside Africa were found — 1.8 million year old remains beside a medieval
    town and basilica.
  body: >-
    Dmanisi holds two entirely different histories on the same promontory above the confluence of the
    Mashavera and Pinezauri rivers. The first is medieval: a town and citadel that served as a significant
    trading node between the eleventh and fourteenth centuries. What remains is the defensive wall, a
    bathhouse, burial vaults and **Dmanisi Sioni**, a sixth-century basilica to which a finely carved
    porch was added in the thirteenth.


    The second history is far deeper. From 1991, digging beneath the medieval layers, archaeologists recovered
    hominin remains dated to roughly **1.8 million years**. These are still the oldest human ancestors
    found anywhere outside Africa, and the finds are often assigned their own designation, Homo erectus
    georgicus. Five skulls have come out of the site, including the two known in Georgia as Zezva and
    Mzia, along with stone tools and the bones of the animals they were used on.


    There is a museum on site and a covered shelter over the excavation, where a section of the dig is
    left open in its original state so you can see the stratigraphy directly. The original skulls are
    in the Georgian National Museum in Tbilisi; Dmanisi displays casts with detailed explanation. Excavation
    continues each summer and visitors can often watch the work in progress.
  tip: >-
    Dmanisi rewards interest more than it rewards a casual stop — see the National Museum exhibition in
    Tbilisi first and the site itself will make far more sense afterwards. Two hours covers the museum
    and the medieval town. The ground is open with little shade, so bring a hat and water. Parking is
    at the entrance. Cafés and ATMs are only in Dmanisi town, about twenty kilometres from the site, so
    eat before or after.
  route: >-
    Leave Tbilisi towards Marneuli, then turn west through Bolnisi and Kazreti to Dmanisi — around 85
    km and an hour and fifty in total. The road is wide and good as far as Marneuli, then narrows, but
    stays paved almost the whole way. The final couple of kilometres to the site are rough, though an
    ordinary car gets through in dry weather. Fuel is available in Marneuli and Bolnisi. If you also plan
    Birtvisi, both fit into a single day.
ru:
  name: Дманиси
  short: 'Место, где нашли древнейших гоминид за пределами Африки: останки возрастом 1,8 млн лет и средневековый
    город.'
  body: >-
    Дманиси соединяет две совершенно разные истории на одном мысу над слиянием рек Машавера и Пинезаури.
    Первая средневековая: город и цитадель, бывшие в XI–XIV веках заметным торговым узлом. От них сохранились
    крепостная стена, баня, усыпальницы и **Дманисский Сиони** — базилика VI века, к которой в XIII столетии
    пристроили богато украшенный резьбой притвор.


    Вторая история гораздо глубже. С 1991 года, копая под средневековыми слоями, археологи извлекли останки
    гоминид возрастом около **1,8 миллиона лет**. Это до сих пор древнейшие предки человека, найденные
    за пределами Африки, и находкам нередко присваивают собственное обозначение — Homo erectus georgicus.
    С площадки происходят пять черепов, включая те два, которых в Грузии называют Зезва и Мзия, а также
    каменные орудия и кости животных.


    На месте работают музей и крытый павильон над раскопом, где часть шурфа оставлена открытой в исходном
    виде, так что стратиграфию видно напрямую. Оригинальные черепа хранятся в Национальном музее Грузии
    в Тбилиси, в Дманиси выставлены копии с подробными пояснениями. Раскопки продолжаются каждое лето,
    и за работой часто можно наблюдать.
  tip: >-
    Дманиси вознаграждает интерес, а не случайное любопытство: сначала посмотрите экспозицию Национального
    музея в Тбилиси, и на месте всё сложится гораздо лучше. Двух часов хватит на музей и средневековый
    город. Территория открытая, тени мало — нужны головной убор и вода. Парковка у входа. Кафе и банкоматы
    есть только в городе Дманиси, километрах в двадцати от площадки, так что поесть стоит заранее.
  route: >-
    Из Тбилиси выезжайте в сторону Марнеули, затем поворачивайте на запад через Болниси и Казрети к Дманиси
    — всего около 85 км и час пятьдесят. До Марнеули дорога широкая и хорошая, дальше сужается, но остаётся
    асфальтовой почти на всём протяжении. Последние пара километров к раскопкам разбиты, однако в сухую
    погоду проезжает и обычная машина. Заправиться можно в Марнеули и Болниси. Если планируете ещё и Биртвиси,
    оба места укладываются в один день.
fa:
  name: دمانیسی
  short: >-
    جایی که کهن‌ترین انسان‌تباران بیرون از آفریقا پیدا شدند — بقایای 1.8 میلیون ساله کنار شهری از سده‌های
    میانه و یک باسیلیکا.
  body: >-
    دمانیسی دو تاریخ کاملاً متفاوت را روی یک زبانهٔ خاکی بالای محل تلاقی رودهای ماشاورا و پینزااوری در
    خود جمع کرده است. اولی از سده‌های میانه است: شهر و ارگی که میان سده‌های یازدهم و چهاردهم گره تجاری
    مهمی بود. آنچه مانده دیوار دفاعی، یک گرمابه، دخمه‌های تدفین و **دمانیسی سیونی** است، باسیلیکایی از
    سدهٔ ششم که در سدهٔ سیزدهم رواقی با کنده‌کاری ظریف به آن افزوده شد.


    تاریخ دوم بسیار عمیق‌تر است. از 1991، با کندن زیر لایه‌های سده‌های میانه، باستان‌شناسان بقایای انسان‌تباران
    با قدمت تقریبی **1.8 میلیون سال** را بیرون آوردند. این‌ها هنوز کهن‌ترین نیاکان انسان‌اند که در هر
    جای بیرون از آفریقا پیدا شده‌اند و برای یافته‌ها اغلب نامی جداگانه به کار می‌رود: هومو ارکتوس گئورگیکوس.
    پنج جمجمه از این محوطه بیرون آمده، از جمله دو تایی که در گرجستان زِزوا و مزیا نام گرفته‌اند، همراه
    با ابزار سنگی و استخوان جانورانی که این ابزارها روی آن‌ها به کار رفته‌اند.


    در محل موزه‌ای هست و سرپناهی سرپوشیده روی کاوش، جایی که بخشی از گمانه در حالت اصلی خود باز نگه داشته
    شده تا لایه‌بندی را مستقیم ببینید. جمجمه‌های اصلی در موزهٔ ملی گرجستان در تفلیس نگهداری می‌شوند؛ دمانیسی
    قالب‌ها را با توضیح مفصل نمایش می‌دهد. کاوش هر تابستان ادامه دارد و بازدیدکنندگان اغلب می‌توانند کار
    را در جریان ببینند.
  tip: >-
    دمانیسی بیشتر به علاقه پاداش می‌دهد تا به توقفی گذری — اول نمایشگاه موزهٔ ملی در تفلیس را ببینید و
    بعد خود محوطه معنای بسیار بیشتری پیدا می‌کند. دو ساعت موزه و شهر سده‌های میانه را پوشش می‌دهد. زمین
    باز است و سایهٔ چندانی ندارد، پس کلاه و آب همراه ببرید. پارکینگ کنار ورودی است. کافه و خودپرداز فقط
    در شهر دمانیسی است، حدود بیست کیلومتر دورتر از محوطه، پس پیش یا پس از بازدید غذا بخورید.
  route: >-
    از تفلیس به سمت مارنئولی بروید و بعد به سمت غرب از بولنیسی و کازرتی به دمانیسی بپیچید — در مجموع حدود
    85 کیلومتر و یک ساعت و پنجاه دقیقه. جاده تا مارنئولی پهن و خوب است، بعد باریک می‌شود اما تقریباً تا
    آخر آسفالت می‌ماند. دو کیلومتر آخر تا محوطه ناهموار است، هرچند خودروی معمولی در هوای خشک رد می‌شود.
    سوخت در مارنئولی و بولنیسی هست. اگر بیرتویسی هم در برنامه‌تان است، هر دو در یک روز جا می‌شوند.
he:
  name: דמניסי
  short: >-
    המקום שבו נמצאו ההומינינים העתיקים ביותר מחוץ לאפריקה — שרידים בני 1.8 מיליון שנה לצד עיר מימי הביניים
    ובזיליקה.
  body: >-
    דמניסי מחזיקה שתי היסטוריות שונות לחלוטין על אותה לשון קרקע מעל מפגש הנהרות משאוורה ופינזאורי. הראשונה
    היא של ימי הביניים: עיר ומצודה ששימשו צומת מסחר חשוב בין המאה ה-11 למאה ה-14. מה שנותר ממנה הוא חומת
    ההגנה, בית מרחץ, מרתפי קבורה ו**דמניסי סיוני**, בזיליקה מן המאה השישית שאליה נוספה במאה ה-13 אכסדרה
    מגולפת בעדינות.


    ההיסטוריה השנייה עמוקה בהרבה. משנת 1991, בחפירה מתחת לשכבות ימי הביניים, חשפו הארכיאולוגים שרידי הומינינים
    המתוארכים לכ-**1.8 מיליון שנה**. אלה עדיין אבות האדם העתיקים ביותר שנמצאו בכל מקום מחוץ לאפריקה, ולממצאים
    מיוחסת לא פעם הגדרה משלהם, הומו ארקטוס גאורגיקוס. חמש גולגולות יצאו מן האתר, ובהן השתיים המוכרות בגאורגיה
    בשמות זזווה ומזיה, לצד כלי אבן ועצמות בעלי החיים שעליהם הופעלו.


    באתר יש מוזיאון וסככה מקורה מעל החפירה, שבה נותר חתך מן החפירה פתוח במצבו המקורי כדי שאפשר יהיה לראות
    את הסטרטיגרפיה ישירות. הגולגולות המקוריות נמצאות במוזיאון הלאומי הגאורגי בטביליסי; דמניסי מציגה יציקות
    עם הסבר מפורט. החפירה נמשכת בכל קיץ, והמבקרים יכולים לא פעם לראות את העבודה מתנהלת.
  tip: >-
    דמניסי מתגמלת עניין יותר משהיא מתגמלת עצירה מזדמנת — ראו קודם את התצוגה במוזיאון הלאומי בטביליסי,
    ואז האתר עצמו יתחבר הרבה יותר. שעתיים מכסות את המוזיאון ואת העיר מימי הביניים. השטח פתוח וכמעט בלי
    צל, אז קחו כובע ומים. החניה בכניסה. בתי קפה וכספומטים יש רק בעיירה דמניסי, כעשרים קילומטרים מהאתר,
    אז אכלו לפני או אחרי.
  route: >-
    צאו מטביליסי לכיוון מרנאולי, ואז פנו מערבה דרך בולניסי וקזרטי לדמניסי — כ-85 ק״מ ושעה וחמישים בסך
    הכול. הכביש רחב וטוב עד מרנאולי, אחר כך מצטמצם, אך נשאר סלול כמעט כל הדרך. שני הקילומטרים האחרונים
    אל האתר משובשים, אם כי רכב רגיל עובר במזג אוויר יבש. דלק זמין במרנאולי ובבולניסי. אם אתם מתכננים גם
    את בירתוויסי, שניהם נכנסים ליום אחד.
ar:
  name: دمانيسي
  short: >-
    حيث عُثر على أقدم البشرانيين خارج أفريقيا — بقايا عمرها 1.8 مليون سنة إلى جانب مدينة من العصور الوسطى
    وبازيليكا.
  body: >-
    تحفظ دمانيسي تاريخين مختلفين تماماً على النتوء نفسه فوق ملتقى نهري ماشافيرا وبينيزاوري. الأول من العصور
    الوسطى: مدينة وقلعة كانتا عقدة تجارية مهمة بين القرنين الحادي عشر والرابع عشر. وما بقي منها السور
    الدفاعي وحمّام وأقبية دفن و**دمانيسي سيوني**، وهي بازيليكا من القرن السادس أُضيف إليها في القرن الثالث
    عشر رواق دقيق النقش.


    أما التاريخ الثاني فأعمق بكثير. فمنذ 1991، بالحفر تحت طبقات العصور الوسطى، استخرج علماء الآثار بقايا
    بشرانيين يعود تاريخها إلى نحو **1.8 مليون سنة**. وهي حتى اليوم أقدم أسلاف البشر التي عُثر عليها في
    أي مكان خارج أفريقيا، وكثيراً ما تُنسب هذه الاكتشافات إلى تسمية خاصة بها: هومو إريكتوس جورجيكوس. وقد
    خرجت من الموقع خمس جماجم، منها الاثنتان المعروفتان في جورجيا باسمَي زيزفا ومزيا، إلى جانب أدوات حجرية
    وعظام الحيوانات التي استُعملت عليها.


    وفي الموقع متحف ومظلة مسقوفة فوق الحفرية، حيث تُرك قطاع من الحفر مفتوحاً على حاله الأصلية لترى الطبقات
    مباشرة. أما الجماجم الأصلية فمحفوظة في المتحف الوطني الجورجي في تبليسي؛ وتعرض دمانيسي نسخاً مصبوبة
    مع شرح مفصل. والتنقيب مستمر كل صيف، ويستطيع الزوار غالباً متابعة العمل وهو جارٍ.
  tip: >-
    تكافئ دمانيسي الاهتمام أكثر مما تكافئ وقفة عابرة — شاهد معرض المتحف الوطني في تبليسي أولاً، وعندها
    سيصير الموقع نفسه أوضح بكثير. وساعتان تغطيان المتحف ومدينة العصور الوسطى. والأرض مكشوفة بلا ظل يُذكر،
    فخذ قبعة وماءً. والموقف عند المدخل. أما المقاهي وأجهزة الصراف فلا توجد إلا في بلدة دمانيسي، على بعد
    نحو عشرين كيلومتراً من الموقع، فتناول طعامك قبل الزيارة أو بعدها.
  route: >-
    اخرج من تبليسي نحو مارنيولي، ثم انعطف غرباً عبر بولنيسي وكازريتي إلى دمانيسي — نحو 85 كم وساعة وخمسين
    دقيقة إجمالاً. الطريق عريض وجيد حتى مارنيولي، ثم يضيق لكنه يبقى معبّداً طوال الطريق تقريباً. والكيلومتران
    الأخيران إلى الموقع وعران، وإن كانت سيارة عادية تمر في الطقس الجاف. والوقود متوفر في مارنيولي وبولنيسي.
    وإن كنت تنوي زيارة بيرتفيسي أيضاً، فكلاهما يتسع ليوم واحد.
