ka:
  name: გელათის მონასტერი
  short: დავით აღმაშენებლის მიერ დაარსებული სამონასტრო და სააკადემიო კომპლექსი — იუნესკოს მსოფლიო მემკვიდრეობა.
  body: >
    გელათი ქუთაისიდან თერთმეტიმდე კილომეტრში, ბორცვზეა გაშენებული და საქართველოს შუა საუკუნეების მთავარ
    კულტურულ ცენტრად ითვლება. მონასტერი 1106 წელს დააარსა დავით IV აღმაშენებელმა — იმ მეფემ, რომელმაც
    ქვეყანა გააერთიანა და თურქ-სელჩუკები განდევნა. მისთვის გელათი მხოლოდ სავანე არ იყო: აქვე ჩამოყალიბდა
    აკადემია, სადაც ფილოსოფიას, გეომეტრიას, რიტორიკასა და ასტრონომიას ასწავლიდნენ, და თანამედროვეები მას
    „მეორე იერუსალიმსა და ახალ ათენს“ უწოდებდნენ.


    **გელათი იუნესკოს მსოფლიო მემკვიდრეობის ნუსხაშია** და ეს სტატუსი დღემდე ძალაშია.


    კომპლექსის ცენტრი ღვთისმშობლის მთავარი ტაძარია. მისი საკურთხევლის კონქში XII საუკუნის მოზაიკაა ღვთისმშობლისა
    და მთავარანგელოზების გამოსახულებით — შუა საუკუნეების კავკასიაში ერთ-ერთი უდიდესი შემორჩენილი მოზაიკა.
    კედლებზე XII–XVIII საუკუნეების ფრესკების ფენებია, მათ შორის ქართველ მეფეთა პორტრეტები.


    რას ნახავს სტუმარი:


    - ღვთისმშობლის ტაძარი მოზაიკითა და მრავალფენოვანი მოხატულობით

    - წმინდა გიორგისა და წმინდა ნიკოლოზის ეკლესიები

    - აკადემიის შენობა, სადაც ქვის სკამები დღემდე დგას

    - სამრეკლო და წყარო მის ქვეშ


    სამხრეთ კარიბჭესთან დავით აღმაშენებლის საფლავია. გადმოცემით, მეფემ თავად ითხოვა, რომ სწორედ შესასვლელში
    დაესვენებინათ, რათა შემომსვლელს მასზე გადაებიჯებინა — ეს მისი უკანასკნელი, სიმბოლური მოქმედება იყო.


    გელათის აკადემია საქართველოს შუა საუკუნეების განათლების ცენტრი იყო და მასთან დაკავშირებულია იოანე
    პეტრიწის სახელი. დღეს შენობა უსახურავოა, მაგრამ სწორედ ეს აძლევს მას განსაკუთრებულ განწყობას: ქვის
    გრძელი სკამები, დიდი სარკმლები და ხედი ეზოზე, სადაც ოდესღაც ლექციები იმართებოდა.
  tip: >-
    მოქმედი მონასტერია: ქალებს თავსაფარი და გრძელი კაბა სჭირდებათ, მამაკაცებს — გრძელი შარვალი. კარიბჭესთან
    ჩვეულებრივ დევს გადასაფარებლები, მაგრამ საკუთარი უფრო საიმედოა. მოზაიკის დასათვალიერებლად დილა ან
    საღამო ჯობია, როცა მზე საკურთხეველს ანათებს. ტაძრებში ხშირად სქელი ჩრდილი და სიგრილეა — ჟაკეტი ზაფხულშიც
    გამოგადგება. მანქანა კარიბჭესთან პარკინგზეა. კაფე და ტუალეტი შესასვლელთანაა, ბანკომატი — ქუთაისში.
  route: >
    თბილისიდან E60-ით მიდიხარ გორის, ხაშურისა და რიკოთის ახალი გვირაბებიანი მაგისტრალის გავლით ქუთაისამდე
    — ორას ოცდაათი კილომეტრი, დაახლოებით სამი საათი ოცი წუთი. ქუთაისიდან ჩრდილო-აღმოსავლეთით უხვევ და
    თერთმეტ კილომეტრში გელათშია. მთელი მარშრუტი ასფალტიანია, ბოლო მონაკვეთი ვიწრო, მაგრამ კარგ მდგომარეობაში.
    ეკონომ კლასი სავსებით საკმარისია. საწვავი და ბანკომატები ქუთაისში ბევრგანაა; მოწამეთა იმავე გზაზეა
    და ორივეს ერთ ჯერზე მოხვედრა ადვილია. ქუთაისში ღამის გათევა ამ მარშრუტს ბევრად ამარტივებს, რადგან
    ერთ დღეში დაბრუნება რვა საათზე მეტ ტარებას ნიშნავს.
en:
  name: Gelati Monastery
  short: The monastery and academy founded by David the Builder, and a UNESCO World Heritage Site.
  body: >-
    Gelati stands on a hillside eleven kilometres from Kutaisi and counts as the principal cultural centre
    of medieval Georgia. The monastery was founded in 1106 by David IV the Builder, the king who united
    the country and drove out the Seljuks. For him it was never only a religious house: an academy was
    established here teaching philosophy, geometry, rhetoric and astronomy, and contemporaries called
    it a second Jerusalem and a new Athens.


    **Gelati is inscribed on the UNESCO World Heritage List**, and that status remains current.


    The heart of the complex is the main Church of the Virgin. In the apse is a 12th-century mosaic of
    the Theotokos flanked by archangels — one of the largest surviving medieval mosaics in the Caucasus.
    The walls carry layers of fresco painted between the 12th and 18th centuries, including portraits
    of Georgian kings.


    What you see on site:


    - the Church of the Virgin with its mosaic and multi-layered wall painting

    - the churches of St George and St Nicholas

    - the academy building, where the stone benches still stand

    - the bell tower and the spring beneath it


    David the Builder's grave lies at the southern gate. By tradition the king asked to be buried in the
    entrance itself, so that everyone entering would step over him — a last, deliberately humble gesture
    from Georgia's most powerful medieval ruler.
  tip: >-
    This is an active monastery: women need a headscarf and long skirt, men long trousers. Wraps are usually
    available at the gate, but bringing your own is safer. Morning or late afternoon is better for the
    mosaic, when sunlight reaches the apse. The churches hold deep shade and stay cool, so a jacket is
    useful even in summer. Park at the lot by the gate. A cafe and toilets sit at the entrance; the nearest
    ATM is in Kutaisi.
  route: >-
    From Tbilisi take the E60 past Gori and Khashuri and through the new Rikoti tunnels to Kutaisi — 230
    km, about three hours twenty. From Kutaisi head northeast and cover the last eleven kilometres to
    Gelati. The whole route is paved, with the final section narrow but in good condition. An economy
    car is entirely sufficient. Fuel and ATMs are plentiful in Kutaisi. Motsameta Monastery sits on the
    same road, so combining both in one outing takes almost no extra driving.
ru:
  name: Монастырь Гелати
  short: Монастырь и академия, основанные Давидом Строителем, — объект Всемирного наследия ЮНЕСКО.
  body: >
    Гелати стоит на склоне в одиннадцати километрах от Кутаиси и считается главным культурным центром
    средневековой Грузии. Монастырь основал в 1106 году Давид IV Строитель — царь, объединивший страну
    и изгнавший сельджуков. Для него это была не просто обитель: здесь возникла академия, где преподавали
    философию, геометрию, риторику и астрономию, а современники называли её вторым Иерусалимом и новыми
    Афинами.


    **Гелати внесён в список Всемирного наследия ЮНЕСКО**, и этот статус действует по сей день.


    Центр комплекса — главный храм Богородицы. В конхе алтаря сохранилась мозаика XII века с изображением
    Богоматери и архангелов, одна из крупнейших уцелевших средневековых мозаик Кавказа. На стенах — слои
    фресок XII-XVIII веков, включая портреты грузинских царей.


    Что вы увидите:


    - храм Богородицы с мозаикой и многослойной росписью

    - церкви святого Георгия и святого Николая

    - здание академии, где до сих пор стоят каменные скамьи

    - колокольню и источник под ней


    У южных ворот находится могила Давида Строителя. По преданию, царь сам просил похоронить его прямо
    в проходе, чтобы каждый входящий переступал через него, — последний, намеренно смиренный жест самого
    могущественного правителя средневековой Грузии.


    Гелатская академия была центром средневекового образования Грузии, и с ней связано имя философа Иоанэ
    Петрици. Сегодня здание стоит без крыши, но именно это придаёт ему особое настроение: длинные каменные
    скамьи, большие оконные проёмы и вид во двор, где когда-то шли занятия.
  tip: >-
    Монастырь действующий: женщинам нужен платок и длинная юбка, мужчинам — длинные брюки. У ворот обычно
    лежат накидки, но своё надёжнее. Мозаику лучше смотреть утром или ближе к вечеру, когда солнце достаёт
    до алтаря. В храмах густая тень и прохладно, лёгкая куртка пригодится даже летом. Машину оставляйте
    на парковке у ворот. Кафе и туалеты — у входа, ближайший банкомат в Кутаиси.
  route: >-
    Из Тбилиси по трассе E60 мимо Гори и Хашури, через новые рикотские тоннели до Кутаиси — 230 км, около
    трёх часов двадцати минут. Из Кутаиси поворот на северо-восток и последние одиннадцать километров
    до Гелати. Весь маршрут асфальтирован, финальный участок узкий, но в хорошем состоянии. Достаточно
    машины эконом-класса. Заправки и банкоматы в Кутаиси на каждом шагу. Монастырь Моцамета стоит на той
    же дороге, так что объединить оба визита почти ничего не добавит к пробегу.
fa:
  name: صومعهٔ گلاتی
  short: صومعه و آکادمی‌ای که داوود سازنده بنیاد نهاد، و میراث جهانی یونسکو.
  body: >-
    گلاتی روی دامنه‌ای در یازده کیلومتری کوتایسی ایستاده است و مرکز فرهنگی اصلی گرجستان سده‌های میانه
    به شمار می‌رود. صومعه را در 1106 داوود چهارم، ملقب به سازنده، بنیاد نهاد؛ همان پادشاهی که کشور را
    یکپارچه کرد و سلجوقیان را بیرون راند. برای او این هرگز فقط یک سرای دینی نبود: اینجا آکادمی‌ای برپا
    شد که فلسفه، هندسه، بلاغت و نجوم درس می‌داد، و هم‌روزگارانش آن را اورشلیم دوم و آتن نو می‌خواندند.
    **گلاتی در فهرست میراث جهانی یونسکو ثبت شده است** و این جایگاه همچنان برقرار است.


    قلب مجموعه کلیسای اصلی مریم مقدس است. در کنج محراب موزاییکی از سدهٔ دوازدهم است که مریم را میان دو
    فرشتهٔ مقرب نشان می‌دهد — یکی از بزرگ‌ترین موزاییک‌های بازماندهٔ سده‌های میانه در قفقاز. دیوارها لایه‌های
    فرسکو از سدهٔ دوازدهم تا هجدهم را دارند، از جمله پرتره‌های پادشاهان گرجی. در محوطه جز همین کلیسا با
    موزاییک و نقاشی چندلایه‌اش، کلیساهای سنت گیورگی و سنت نیکولاس، ساختمان آکادمی که نیمکت‌های سنگی‌اش
    هنوز سر جای‌شان‌اند، و برج ناقوس با چشمه‌ای زیر آن قرار دارند.


    آرامگاه داوود سازنده کنار دروازهٔ جنوبی است. بنا بر روایت، پادشاه خود خواست که در همان مدخل به خاک
    سپرده شود تا هر که وارد می‌شود از روی او بگذرد — واپسین حرکت و عمداً فروتنانهٔ مقتدرترین فرمانروای
    گرجستان در سده‌های میانه.
  tip: >-
    این صومعه‌ای فعال است: زنان به روسری و دامن بلند نیاز دارند و مردان به شلوار بلند. معمولاً کنار دروازه
    پوشش هست، اما بردن مال خودتان مطمئن‌تر است. صبح یا اواخر بعدازظهر برای دیدن موزاییک بهتر است، وقتی
    نور خورشید به محراب می‌رسد. کلیساها سایه‌ای عمیق دارند و خنک می‌مانند، پس ژاکت حتی در تابستان به کار
    می‌آید. خودرو را در پارکینگ کنار دروازه بگذارید. کافه و سرویس بهداشتی کنار ورودی است؛ نزدیک‌ترین خودپرداز
    در کوتایسی.
  route: >-
    از تفلیس با E60 از کنار گوری و خاشوری و از میان تونل‌های تازهٔ ریکوتی تا کوتایسی بروید — 230 کیلومتر،
    حدود سه ساعت و بیست دقیقه. از کوتایسی به شمال‌شرق بپیچید و یازده کیلومتر آخر را تا گلاتی برانید. تمام
    مسیر آسفالت است و بخش پایانی باریک اما در وضعیت خوب. خودروی اقتصادی کاملاً کافی است. سوخت و خودپرداز
    در کوتایسی فراوان است. صومعهٔ موتسامتا روی همین جاده است، بنابراین دیدن هر دو در یک گشت تقریباً هیچ
    رانندگی اضافه‌ای نمی‌خواهد.
he:
  name: מנזר גלאטי
  short: המנזר והאקדמיה שייסד דוד הבנאי, ואתר מורשת עולמית של אונסקו.
  body: >-
    גלאטי עומד על מדרון במרחק אחד עשר קילומטרים מקוטאיסי ונחשב למרכז התרבותי המרכזי של גאורגיה של ימי
    הביניים. את המנזר ייסד ב-1106 דוד הרביעי הבנאי, המלך שאיחד את הארץ וגירש את הסלג'וקים. עבורו זה מעולם
    לא היה רק בית תפילה: כאן הוקמה אקדמיה שלימדה פילוסופיה, גיאומטריה, רטוריקה ואסטרונומיה, ובני הזמן
    כינו אותה ירושלים שנייה ואתונה חדשה. **גלאטי רשום ברשימת המורשת העולמית של אונסקו**, והמעמד הזה תקף
    עד היום.


    לב המתחם הוא כנסיית הבתולה הראשית. בקונכיית האפסיס נמצא פסיפס מן המאה ה-12 ובו התיאוטוקוס בין שני
    מלאכים — אחד הפסיפסים הגדולים ששרדו מימי הביניים בכל הקווקז. הקירות נושאים שכבות ציור מן המאה ה-12
    ועד ה-18, ובהן דיוקנאות של מלכי גאורגיה. בשטח עומדים לצד הכנסייה הזאת גם כנסיות גאורגיוס הקדוש וניקולאס
    הקדוש, בניין האקדמיה שספסלי האבן שלו עדיין במקומם, ומגדל הפעמונים והמעיין שתחתיו.


    קברו של דוד הבנאי נמצא בשער הדרומי. לפי המסורת ביקש המלך להיקבר בכניסה עצמה, כדי שכל הנכנס יצעד מעליו
    — מחווה אחרונה ומכוונת של ענווה מצד השליט החזק ביותר של גאורגיה בימי הביניים.
  tip: >-
    זהו מנזר פעיל: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים. ליד השער בדרך כלל יש כיסויים,
    אבל להביא משלכם בטוח יותר. הבוקר או שעות אחר הצהריים המאוחרות טובים יותר לפסיפס, כשאור השמש מגיע אל
    האפסיס. בכנסיות שורר צל עמוק והן נשארות קרירות, ולכן מעיל מועיל גם בקיץ. החנו במגרש שליד השער. בית
    קפה ושירותים נמצאים בכניסה; הכספומט הקרוב ביותר בקוטאיסי.
  route: >-
    מטביליסי סעו בכביש E60 ליד גורי וחשורי ודרך מנהרות ריקוטי החדשות עד קוטאיסי — 230 ק״מ, כשלוש שעות
    ועשרים. מקוטאיסי פנו צפונה-מזרחה ועשו את אחד עשר הקילומטרים האחרונים עד גלאטי. כל המסלול סלול, והקטע
    האחרון צר אך במצב טוב. רכב חסכוני מספיק לחלוטין. דלק וכספומטים יש בשפע בקוטאיסי. מנזר מוצמטה יושב
    על אותו כביש, כך ששילוב שניהם ביציאה אחת כמעט אינו מוסיף נסיעה.
ar:
  name: دير غيلاتي
  short: الدير والأكاديمية اللذان أسسهما داود الباني، وموقع تراث عالمي لليونسكو.
  body: >-
    يقوم غيلاتي على منحدر يبعد أحد عشر كيلومتراً عن كوتايسي، ويُعد المركز الثقافي الأول لجورجيا في العصور
    الوسطى. أسس الديرَ عام 1106 داود الرابع الباني، الملك الذي وحّد البلاد وطرد السلاجقة. ولم يكن بالنسبة
    إليه داراً للعبادة فحسب: فقد أُنشئت هنا أكاديمية تُدرّس الفلسفة والهندسة والبلاغة والفلك، وسماها معاصروه
    أورشليم الثانية وأثينا الجديدة. **وغيلاتي مدرج على قائمة التراث العالمي لليونسكو**، وهذه الصفة سارية
    حتى اليوم.


    وقلب المجمع كنيسة العذراء الرئيسية. ففي حنية المذبح فسيفساء من القرن الثاني عشر تصور والدة الإله بين
    رئيسي ملائكة — وهي من أكبر فسيفساء العصور الوسطى الباقية في القوقاز. وتحمل الجدران طبقات من الرسوم
    بين القرنين الثاني عشر والثامن عشر، ومنها صور لملوك جورجيا. وفي المجمع، إلى جانب هذه الكنيسة بفسيفسائها
    ورسومها المتعددة الطبقات، تقوم كنيستا القديس جيورجي والقديس نيقولا، ومبنى الأكاديمية الذي ما زالت
    مقاعده الحجرية في مواضعها، وبرج الأجراس والنبع تحته.


    ويقع قبر داود الباني عند البوابة الجنوبية. وتقول الرواية إن الملك طلب أن يُدفن في المدخل نفسه ليطأ
    فوقه كل داخل — إيماءة أخيرة متعمَّدة التواضع من أقوى حكام جورجيا في العصور الوسطى.
  tip: >-
    هذا دير عامل: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال إلى بنطال طويل. وعند البوابة أغطية عادة،
    لكن إحضار غطائك أضمن. والصباح أو أواخر بعد الظهر أفضل لرؤية الفسيفساء، حين يصل ضوء الشمس إلى الحنية.
    والكنائس تحتفظ بظل عميق وتبقى باردة، فالسترة مفيدة حتى في الصيف. اترك السيارة في الموقف عند البوابة.
    والمقهى ودورات المياه عند المدخل؛ وأقرب صراف آلي في كوتايسي.
  route: >-
    من تبليسي اسلك E60 مروراً بغوري وخاشوري وعبر أنفاق ريكوتي الجديدة حتى كوتايسي — 230 كم، نحو ثلاث ساعات
    وعشرين دقيقة. ومن كوتايسي اتجه شمالاً شرقاً واقطع الكيلومترات الأحد عشر الأخيرة إلى غيلاتي. المسار
    كله معبّد، ومقطعه الأخير ضيق لكنه بحالة جيدة. وسيارة اقتصادية تكفي تماماً. والوقود وأجهزة الصراف وفيرة
    في كوتايسي. ودير موتساميتا على الطريق نفسه، فضم الموقعين في جولة واحدة لا يضيف قيادة تُذكر.
