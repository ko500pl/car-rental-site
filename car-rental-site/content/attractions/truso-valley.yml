ka:
  name: თრუსოს ხეობა
  short: მინერალური წყაროების, ტრავერტინის ტერასებისა და მიტოვებული კოშკების ველური ხეობა ყაზბეგის სამხრეთით.
  body: >-
    **თრუსო ის ხეობაა, სადაც თითქმის არავინაა.** ის ყაზბეგიდან სამხრეთით, კობის მახლობლად იწყება და დასავლეთისკენ
    15-ზე მეტ კილომეტრზე გრძელდება თერგის სათავეებისკენ, სომხეთის ტიპის ველურ, უტყეო ლანდშაფტში. ეს სასაზღვრო
    ზონაა და სწორედ ამან შეინარჩუნა იგი თითქმის უცვლელად.


    ხეობის მთავარი თავისებურება მინერალური წყლებია. მიწიდან ამომავალი ნახშირორჟანგით გაჯერებული წყალი
    კირქვას ტოვებს და საუკუნეების განმავლობაში ქმნის **ტრავერტინის ტერასებს** — ნარინჯისფერ, ყვითელ და
    თეთრ კასკადებს, რომლებიც შორიდან თითქოს ყინულს ჰგავს. ყველაზე ცნობილი მათგანი აბანოს წყაროებია.


    გზაზე ნახავ:


    - აბანოს ტბას — მინერალური წყლის პატარა, კაშკაშა ფერის აუზს

    - მიტოვებულ სოფლებს ქვის თავდაცვითი კოშკებით: ქეთრისი, აბანო, რესი

    - ზაქაგორის ციხეს კლდის თავზე, ხეობის ბოლოსკენ

    - ალპურ საძოვრებს ცხვრის ფარებით და მწყემსების დროებით სადგომებით


    თრუსო არ არის ერთსაათიანი გაჩერება — ეს მთელი დღის მარშრუტია. ბევრი მოგზაური მანქანას ხეობის შესასვლელთან
    ტოვებს და 10–12 კმ ფეხით გადის, რაც ალბათ საუკეთესო ვარიანტია, თუ დრო და მდგრადი ამინდი გაქვს.


    ხეობის ისტორია ცალკე თემაა: აქ ოსური და ქართული სოფლები საუკუნეების განმავლობაში ერთმანეთის გვერდით
    იდგა, 1990-იან წლებში კი მოსახლეობამ თითქმის მთლიანად დატოვა ტერიტორია. დღეს ქვის სახლები უსახურავოდ
    დგას და ბალახი ეზოებში ადის — ეს ერთდროულად ლამაზი და მძიმე სანახავია, და თრუსოს იმ განწყობას აძლევს,
    რომელიც სხვა ხეობებში აღარ გვხვდება.
  tip: >-
    ეს სასაზღვრო ზონაა — პასპორტი ან პირადობა აუცილებლად თან იქონიე, სასაზღვრო პოლიციის პოსტი ხეობის შესასვლელთანაა
    და ისინი ამოწმებენ. სეზონი ივნისიდან სექტემბრამდეა; დანარჩენ დროს გზა თოვლითაა დახურული. ჩრდილი არსად
    არის, მზე 2200 მეტრზე მკაცრია — ქუდი, კრემი, სულ მცირე ორი ლიტრი წყალი. მაღაზია, ტუალეტი და კავშირი
    ხეობაში არ არის; ყველაფერი კობში ან სტეფანწმინდაში აიღე.
  route: >-
    თბილისიდან სამხედრო გზით ჯვრის უღელტეხილამდე, შემდეგ კობის მოსახვევი — 145 კმ და დაახლოებით სამი საათი.
    კობიდან თრუსოში შესვლა გრუნტის გზაა: 15 კმ ქვიანი, ღარტაფებიანი, რამდენიმე მდინარის ფონით. სედანი
    აქ არ გამოდგება — საჭიროა მაღალი კლირენსი და სასურველია სრული წამყვანი. წვიმის შემდეგ ფონები იზრდება
    და გზა შეიძლება საერთოდ გაუვალი გახდეს. საწვავი აუცილებლად აიღე პასანაურში ან გუდაურში, ხეობაში სადგური
    არ არსებობს. შესაფერისი ავტომობილი აირჩიე წინასწარ — [ავტოპარკი](/fleet/).
en:
  name: Truso Valley
  short: A wild valley of mineral springs, travertine terraces and abandoned towers south of Kazbegi.
  body: >-
    **Truso is the valley where there is almost nobody.** It begins near Kobi, south of Kazbegi, and runs
    west for more than fifteen kilometres towards the headwaters of the Terek, through bare, treeless,
    almost Central Asian scenery. It is a border zone, and that restriction is largely why it has stayed
    unchanged.


    The defining feature is mineral water. Carbon-dioxide-rich springs rise through the valley floor,
    depositing calcium carbonate as they cool, and over centuries these have built **travertine terraces**
    — orange, yellow and white cascades that from a distance look like frozen waterfalls. The best known
    are the Abano springs.


    Along the track you pass:


    - Abano lake, a small pool of vividly coloured mineral water

    - Abandoned villages with stone defensive towers: Ketrisi, Abano and Resi

    - Zakagori fortress on a rock spur towards the far end of the valley

    - Alpine pasture with sheep flocks and temporary shepherds' camps


    Truso is not a one-hour stop; it is a full day. Many travellers leave the car at the mouth of the
    valley and walk ten to twelve kilometres in and back, which is arguably the best way to do it if you
    have the time and the weather is settled.
  tip: >-
    This is a border zone: carry a passport or ID, because there is a border police post at the entrance
    and they do check. The season runs from June to September, and the rest of the year the track is closed
    by snow. There is no shade anywhere and the sun at 2,200 metres is harsh, so bring a hat, sunscreen
    and at least two litres of water per person. No shops, no toilets and effectively no mobile signal
    — stock up in Kobi or Stepantsminda.
  route: >-
    From Tbilisi take the Military Highway over the Jvari Pass and turn off at Kobi — 145 km, around three
    hours. From Kobi into Truso the road is gravel: fifteen kilometres of stony, rutted track with several
    river fords. A sedan is not an option here; you need real ground clearance and preferably four-wheel
    drive. After heavy rain the fords rise and the track can become impassable altogether. Fill up in
    Pasanauri or Gudauri, as there is no fuel in the valley. Choose the vehicle in advance from the [fleet](/fleet/).
ru:
  name: Трусо
  short: Дикое ущелье минеральных источников, травертиновых террас и заброшенных башен к югу от Казбеги.
  body: >-
    **Трусо — ущелье, где почти никого нет.** Оно начинается у Коби, южнее Казбеги, и уходит на запад
    более чем на пятнадцать километров к истокам Терека, среди голого, безлесного, почти среднеазиатского
    пейзажа. Это пограничная зона, и во многом именно поэтому долина осталась почти нетронутой.


    Главная особенность — минеральная вода. Насыщенные углекислым газом источники выходят прямо со дна
    долины и, остывая, откладывают карбонат кальция; за столетия так выросли **травертиновые террасы**
    — оранжевые, жёлтые и белые каскады, издали похожие на замёрзшие водопады. Самые известные — источники
    Абано.


    Вдоль дороги вы увидите:


    - Озеро Абано — небольшой водоём минеральной воды яркого цвета

    - Заброшенные сёла с каменными оборонительными башнями: Кетриси, Абано, Реси

    - Крепость Закагори на скальном выступе ближе к дальнему концу ущелья

    - Альпийские пастбища с отарами овец и временными стоянками чабанов


    Трусо — не остановка на час, а целый день. Многие оставляют машину у входа в ущелье и проходят десять-двенадцать
    километров пешком туда и обратно; при устойчивой погоде это, пожалуй, лучший способ.
  tip: >-
    Это погранзона: паспорт или удостоверение обязательно с собой, у входа стоит пост погранполиции и
    документы проверяют. Сезон — с июня по сентябрь, в остальное время дорогу закрывает снег. Тени нет
    нигде, солнце на 2200 метрах жёсткое: панама, крем и минимум два литра воды на человека. Магазинов,
    туалетов и устойчивой связи в ущелье нет — запасайтесь в Коби или Степанцминде.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге через Крестовый перевал, поворот у Коби — 145 км, около трёх
    часов. От Коби в Трусо идёт грунтовка: пятнадцать километров каменистой колеи с несколькими бродами.
    Седан здесь не вариант, нужен реальный клиренс и желательно полный привод. После сильных дождей броды
    поднимаются, и дорога может стать непроходимой вовсе. Заправляйтесь в Пасанаури или Гудаури, в ущелье
    топлива нет. Машину подберите заранее — [автопарк](/fleet/).
fa:
  name: درهٔ تروسو
  short: دره‌ای وحشی از چشمه‌های معدنی، مصطبه‌های تراورتن و برج‌های متروک، جنوب کازبگی.
  body: >-
    **تروسو دره‌ای است که تقریباً هیچ‌کس در آن نیست.** نزدیک کوبی، جنوب کازبگی، آغاز می‌شود و بیش از پانزده
    کیلومتر رو به غرب تا سرچشمه‌های ترگی پیش می‌رود، در چشم‌اندازی برهنه، بی‌درخت و کمابیش آسیای‌میانه‌ای.
    اینجا منطقهٔ مرزی است و همین محدودیت است که دره را دست‌نخورده نگه داشته است.


    ویژگی تعیین‌کنندهٔ آن آب معدنی است. چشمه‌های سرشار از دی‌اکسید کربن از کف دره بالا می‌آیند و هنگام
    سرد شدن کربنات کلسیم برجای می‌گذارند؛ طی سده‌ها همین رسوب **مصطبه‌های تراورتن** ساخته است — آبشارهای
    نارنجی، زرد و سفیدی که از دور یخ‌زده به نظر می‌رسند. شناخته‌شده‌ترین آن‌ها چشمه‌های آبانو است.


    در امتداد مسیر از دریاچهٔ آبانو می‌گذرید، آبگیر کوچکی از آب معدنی با رنگ‌های تند؛ از روستاهای متروک
    با برج‌های دفاعی سنگی — کتریسی، آبانو و رسی؛ از دژ زاکاگوری بر زبانه‌ای صخره‌ای نزدیک انتهای دره؛
    و از چراگاه‌های آلپی با گله‌های گوسفند و اردوگاه‌های موقت چوپانان. تروسو توقفی یک‌ساعته نیست؛ یک روز
    کامل است. بسیاری از مسافران خودرو را در دهانهٔ دره می‌گذارند و ده تا دوازده کیلومتر رفت و برگشت را
    پیاده می‌روند، که اگر وقت داشته باشید و هوا آرام باشد، شاید بهترین شیوهٔ دیدن آن باشد.
  tip: >-
    اینجا منطقهٔ مرزی است: گذرنامه یا کارت شناسایی همراه داشته باشید، چون در ورودی پاسگاه پلیس مرزی هست
    و واقعاً کنترل می‌کنند. فصل از ژوئن تا سپتامبر است و باقی سال برف مسیر را می‌بندد. هیچ سایه‌ای نیست
    و آفتاب در 2,200 متر تند است، پس کلاه، ضدآفتاب و دست‌کم دو لیتر آب برای هر نفر بردارید. نه مغازه‌ای
    هست، نه سرویس بهداشتی و عملاً نه آنتن موبایل — در کوبی یا استپانتسمیندا تدارک ببینید.
  route: >-
    از تفلیس بزرگراه نظامی را از گردنهٔ جواری بگیرید و در کوبی خارج شوید — 145 کیلومتر، حدود سه ساعت.
    از کوبی به درون تروسو جاده شنی است: پانزده کیلومتر مسیر سنگلاخ و شیاردار با چند گدار رودخانه. سدان
    اینجا گزینه نیست؛ به کلیرنس واقعی و ترجیحاً چهارچرخ‌محرک نیاز دارید. پس از باران سنگین گدارها بالا
    می‌آیند و مسیر ممکن است یکسره غیرقابل عبور شود. باک را در پاساناوری یا گودائوری پر کنید، چون در دره
    سوختی نیست. خودرو را از پیش از [ناوگان](/fleet/) انتخاب کنید.
he:
  name: עמק טרוסו
  short: עמק פראי של מעיינות מינרליים, מדרגות טרוורטין ומגדלים נטושים מדרום לקזבגי.
  body: >-
    **טרוסו הוא העמק שבו כמעט אין איש.** הוא מתחיל ליד קובי, מדרום לקזבגי, ונמשך מערבה יותר מחמישה עשר
    קילומטרים אל מקורות התרגי, בנוף חשוף, חסר עצים וכמעט מרכז-אסייתי. זהו אזור גבול, וההגבלה הזאת היא
    בעיקר הסיבה שהוא נותר בלתי משתנה.


    המאפיין המכונן שלו הוא המים המינרליים. מעיינות עשירים בפחמן דו-חמצני עולים מקרקעית העמק ומשקיעים סידן
    פחמתי בעודם מתקררים, ולאורך מאות שנים בנו אלה **מדרגות טרוורטין** — מפלים כתומים, צהובים ולבנים הנראים
    מרחוק כמפלים קפואים. המפורסמים שבהם הם מעיינות אבאנו.


    לאורך הדרך תעברו את אגם אבאנו, בריכה קטנה של מים מינרליים בגוון עז; כפרים נטושים ובהם מגדלי הגנה מאבן
    — קטריסי, אבאנו ורסי; את מבצר זקגורי על צוק סלעי לקראת קצה העמק; ומרעה אלפיני עם עדרי כבשים ומחנות
    רועים זמניים. טרוסו אינו עצירה של שעה; הוא יום שלם. נוסעים רבים משאירים את הרכב בפתח העמק והולכים
    עשרה עד שנים עשר קילומטרים פנימה ובחזרה, וזו כנראה הדרך הטובה ביותר לעשות זאת אם יש לכם זמן ומזג האוויר
    יציב.
  tip: >-
    זהו אזור גבול: שאו דרכון או תעודת זהות, כי בכניסה יש עמדת משמר גבול והם אכן בודקים. העונה נמשכת מיוני
    עד ספטמבר, ובשאר השנה השלג חוסם את הדרך. אין שום צל והשמש בגובה 2,200 מטר קשה, לכן הביאו כובע, קרם
    הגנה ולפחות שני ליטרים מים לאדם. אין חנויות, אין שירותים ולמעשה אין קליטה סלולרית — הצטיידו בקובי
    או בסטפנצמינדה.
  route: >-
    מטביליסי סעו בכביש הצבא מעל מעבר ג'וארי ופנו בקובי — 145 ק"מ, כשלוש שעות. מקובי אל תוך טרוסו הדרך
    היא חצץ: חמישה עשר קילומטרים של מסלול אבני ומחורץ עם כמה מעברות נהר. סדאן אינו אפשרות כאן; דרוש גובה
    גחון אמיתי ורצוי הנעה כפולה. אחרי גשם כבד המעברות עולות והמסלול עלול להפוך לבלתי עביר לחלוטין. תדלקו
    בפסאנאורי או בגודאורי, שכן בעמק אין דלק. בחרו את הרכב מראש מתוך [צי הרכבים](/fleet/).
ar:
  name: وادي تروسو
  short: واد بري من الينابيع المعدنية ومصاطب الترافرتين والأبراج المهجورة جنوب كازبيغي.
  body: >-
    **تروسو هو الوادي الذي لا يكاد يسكنه أحد.** يبدأ قرب كوبي جنوب كازبيغي ويمتد غرباً أكثر من خمسة عشر
    كيلومتراً نحو منابع تيرغي، في مشهد عارٍ خالٍ من الأشجار يكاد يكون آسيوياً وسطياً. وهو منطقة حدودية،
    وهذا القيد هو السبب الأكبر في بقائه على حاله من دون تغيير.


    والسمة التي تحدد ملامحه هي المياه المعدنية. فينابيع غنية بثاني أكسيد الكربون تنبع من قاع الوادي وترسب
    كربونات الكالسيوم وهي تبرد، وعلى مدى قرون بنت هذه الترسبات **مصاطب الترافرتين** — شلالات برتقالية
    وصفراء وبيضاء تبدو من بعيد كأنها شلالات متجمدة. وأشهرها ينابيع أبانو.


    وعلى امتداد المسلك تمر ببحيرة أبانو، وهي بركة صغيرة من ماء معدني زاهي اللون؛ وبقرى مهجورة فيها أبراج
    دفاعية حجرية — كيتريسي وأبانو وريسي؛ وبحصن زاكاغوري على نتوء صخري قرب طرف الوادي؛ وبمراعٍ جبلية فيها
    قطعان الغنم ومخيمات الرعاة المؤقتة. تروسو ليس وقفة ساعة واحدة بل يوم كامل. ويترك كثير من المسافرين
    سياراتهم عند مدخل الوادي ويمشون عشرة إلى اثني عشر كيلومتراً ذهاباً وإياباً، وهي على الأرجح أفضل طريقة
    لزيارته إن توفر الوقت واستقر الطقس.
  tip: >-
    هذه منطقة حدودية: احمل جواز سفر أو بطاقة هوية، فعند المدخل مركز لشرطة الحدود وهم يتحققون فعلاً. الموسم
    من يونيو إلى سبتمبر، وفي بقية السنة يغلق الثلج المسلك. لا ظل في أي مكان والشمس على ارتفاع 2,200 متر
    قاسية، فخذ قبعة وواقي شمس ولترين من الماء على الأقل لكل شخص. لا متاجر ولا دورات مياه ولا تغطية خلوية
    عملياً — تزود بما تحتاجه في كوبي أو ستيبانتسميندا.
  route: >-
    من تبليسي اسلك الطريق العسكري فوق ممر جفاري واخرج عند كوبي — 145 كم، نحو ثلاث ساعات. ومن كوبي إلى
    داخل تروسو الطريق حصوي: خمسة عشر كيلومتراً من مسلك حجري محفَّر فيه عدة مخاضات نهرية. السيارة الصالون
    ليست خياراً هنا؛ فأنت تحتاج خلوصاً أرضياً حقيقياً ويفضَّل دفعاً رباعياً. وبعد المطر الغزير ترتفع المخاضات
    وقد يصير المسلك غير سالك تماماً. تزود بالوقود في باسانوري أو غوداوري، فلا وقود في الوادي. اختر السيارة
    مسبقاً من [أسطولنا](/fleet/).
