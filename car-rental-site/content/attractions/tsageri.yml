ka:
  name: ცაგერი და ლეჩხუმი
  short: ლეჩხუმის ცენტრი ცხენისწყლის ხეობაში — ღვინის მხარე, ციხეები და ლაჯანურის წყალსაცავი.
  body: >
    ცაგერი ლეჩხუმის ადმინისტრაციული ცენტრია და მდინარე ცხენისწყლის ხეობაში, დაახლოებით ოთხას ოთხმოც მეტრზე
    მდებარეობს. ეს პატარა, მშვიდი ქალაქია, სადაც ტურისტული ინფრასტრუქტურა მინიმალურია — და სწორედ ეს არის
    მისი მთავარი ხიბლი. რაჭის მაღალმთიან მარშრუტებთან შედარებით ლეჩხუმი ბევრად უფრო ხელმისაწვდომია და
    მთელი სეზონის განმავლობაში ღიაა.


    ლეჩხუმი უპირველესად ღვინის მხარეა. აქ მოჰყავთ იშვიათი ჯიშები, მათ შორის **უსახელოური**, რომელიც მცირე
    რაოდენობით მზადდება და საქართველოს ერთ-ერთ ყველაზე ძვირფას წითელ ღვინოდ ითვლება. ცაგერისა და მიმდებარე
    სოფლების ოჯახური მარნები დეგუსტაციას სთავაზობენ სტუმრებს, ჩვეულებრივ წინასწარი შეთანხმებით.


    რას მოიცავს ერთდღიანი მარშრუტი:


    - ცაგერის ცენტრი, ბაზარი და ძველი ეკლესია

    - მურის ციხე ხეობის თავზე

    - ლაჯანურის წყალსაცავი ფირუზისფერი წყლით

    - ოჯახური მარნები ხეობის სოფლებში


    ცაგერი ასევე მოსახერხებელი შუალედური წერტილია სვანეთისკენ მიმავალ გზაზე, თუმცა ის მონაკვეთი ცალკე
    დაგეგმვას მოითხოვს. თუ რაჭაში მიდიხარ, ლეჩხუმი ბუნებრივი დამატებაა და მარშრუტს დიდ დროს არ ამატებს.


    ლეჩხუმი ისტორიულად ცალკე კუთხედ ითვლებოდა და მისი კულინარია რაჭისგანაც განსხვავდება: აქ მეტია თხილი,
    თაფლი და ველური მწვანილი. ცაგერის ბაზარზე სწორედ ეს პროდუქტები იყიდება, ხოლო შემოდგომაზე ვაშლისა და
    კომშის სეზონია.


    ლაჯანურის წყალსაცავი ცაგერიდან რამდენიმე კილომეტრშია და ზაფხულში მისი ფერი ღია ფირუზისფერამდე ხდება
    — ეს ხეობის ერთ-ერთი ყველაზე ფოტოგენური წერტილია.
  tip: >
    მარანში დეგუსტაცია წინასწარ შეათანხმე — ლეჩხუმის ოჯახური მარნები მცირეა და უსახელოური ყოველთვის არ
    არის ხელმისაწვდომი. წინასწარ განსაზღვრე, ვინ ატარებს მანქანას: საქართველოში ალკოჰოლის ზღვარი მკაცრია.
    ნაღდი ფული თან იქონიე, ბარათს ყველგან არ იღებენ. საწვავი ცაგერშია, თუმცა არჩევანი მცირეა. ბანკომატი
    ცენტრშია. სასტუმროები მოკრძალებულია, ჯავშანი სეზონზე სასურველია. ცაგერში დღის ტემპერატურა რაჭაზე მაღალია,
    ამიტომ ზაფხულში მსუბუქი ტანსაცმელი უფრო გამოგადგება, ვიდრე თბილი.
  route: >
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ ჩრდილოეთით ხეობაში ცაგერისკენ — სულ დაახლოებით სამას ოცდახუთი
    კილომეტრი და ხუთი საათი. ქუთაისის შემდეგ გზა ვიწროვდება და ცხენისწყლის ხეობას მიჰყვება: ასფალტი ძირითადად
    არსებობს, მაგრამ ადგილ-ადგილ დაზიანებულია, ხოლო ზოგიერთი სოფლის განშტოება ხრეშოვანია. მაღალი კლირენსი
    აქ კომფორტს მნიშვნელოვნად ზრდის. ზამთარში მონაკვეთი გამვლელია, მაგრამ ყინულიანი. საწვავი ქუთაისში
    აავსე. თუ სვანეთისკენ აგრძელებ, ცაგერიდან ლენტეხის გზა ცალკე დაგეგმვას მოითხოვს და მისი მდგომარეობა
    წინასწარ უნდა დააზუსტო.
en:
  name: Tsageri and Lechkhumi
  short: The centre of Lechkhumi in the Tskhenistskali valley — wine country, fortresses and the Lajanuri
    reservoir.
  body: >-
    Tsageri is the administrative centre of Lechkhumi, set in the valley of the Tskhenistskali river at
    around 480 metres. It is a small, quiet town with minimal tourist infrastructure, and that is precisely
    its appeal. Compared with the high mountain routes of Racha, Lechkhumi is far more accessible and
    stays open through the whole season.


    Lechkhumi is above all wine country. Rare varieties are grown here, including **Usakhelouri**, produced
    in tiny quantities and regarded as one of the most expensive red wines in Georgia. Family cellars
    in Tsageri and the surrounding villages offer tastings, usually by prior arrangement.


    A day here typically covers:


    - the centre of Tsageri, its market and old church

    - Muri fortress above the valley

    - the Lajanuri reservoir, with its turquoise water

    - family wine cellars in the valley villages


    Tsageri also works as a staging point on the way towards Svaneti, though that leg needs planning of
    its own. If you are already heading into Racha, Lechkhumi is a natural addition that costs little
    extra driving and gives the trip a lower-altitude, gentler second half.
  tip: >-
    Arrange cellar tastings in advance — Lechkhumi producers are small operations and Usakhelouri is not
    always available. Decide who is driving before the tasting begins, since Georgia enforces a strict
    alcohol limit. Carry cash, as cards are not accepted everywhere. There is fuel in Tsageri but little
    choice of station, and an ATM in the centre. Guesthouses are modest, and booking ahead in season is
    sensible.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head north into the valley towards Tsageri — around 325
    km and five hours in total. Past Kutaisi the road narrows and follows the Tskhenistskali gorge: asphalt
    exists for most of it but is broken in places, and several village turnoffs are gravel. Extra ground
    clearance improves the drive considerably. In winter the road remains passable but ices over. Fill
    the tank in Kutaisi, where the choice is far better.
ru:
  name: Цагери и Лечхуми
  short: Центр Лечхуми в долине Цхенисцкали — винный край, крепости и Ладжанурское водохранилище.
  body: >
    Цагери — административный центр Лечхуми, расположенный в долине реки Цхенисцкали на высоте около 480
    метров. Это маленький тихий город с минимальной туристической инфраструктурой, и в этом его главное
    обаяние. По сравнению с высокогорными маршрутами Рачи Лечхуми гораздо доступнее и открыт весь сезон.


    Лечхуми — прежде всего винный край. Здесь выращивают редкие сорта, в том числе **Усахелоури**, который
    производят в крошечных объёмах и считают одним из самых дорогих красных вин Грузии. Семейные марани
    в Цагери и окрестных сёлах принимают на дегустацию, обычно по предварительной договорённости.


    Что обычно входит в день:


    - центр Цагери, рынок и старая церковь

    - крепость Мури над долиной

    - Ладжанурское водохранилище с бирюзовой водой

    - семейные винные погреба в сёлах долины


    Цагери удобен и как промежуточная точка по дороге в Сванетию, хотя этот отрезок требует отдельного
    планирования. Если вы уже едете в Рачу, Лечхуми — естественное дополнение, которое почти не удлиняет
    маршрут и делает вторую половину поездки спокойнее.


    Лечхуми исторически считался отдельным краем, и его кухня отличается даже от рачинской: здесь больше
    фундука, мёда и дикой зелени. Именно эти продукты продают на рынке Цагери, а осенью начинается сезон
    яблок и айвы. Ладжанурское водохранилище лежит в нескольких километрах от города и летом становится
    светло-бирюзовым — это одна из самых фотогеничных точек долины.
  tip: >-
    Дегустацию в марани согласуйте заранее: хозяйства в Лечхуми небольшие, и Усахелоури есть в наличии
    далеко не всегда. Заранее решите, кто за рулём: в Грузии допустимый уровень алкоголя очень строгий.
    Держите при себе наличные, карты принимают не везде. Заправка в Цагери есть, но выбор невелик, банкомат
    — в центре. Гостевые дома скромные, в сезон лучше бронировать.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на север в долину в сторону Цагери — всего около 325 км и пять
    часов. За Кутаиси дорога сужается и идёт по ущелью Цхенисцкали: асфальт на большей части есть, но
    местами разбит, а часть съездов к сёлам гравийные. Повышенный клиренс заметно улучшает поездку. Зимой
    участок проходим, но обледеневает. Заправляйтесь в Кутаиси, где выбор значительно больше.
fa:
  name: تساگری و لچخومی
  short: مرکز لچخومی در درهٔ تسخنیستسکالی — سرزمین شراب، دژها و آبگیر لاجانوری.
  body: >-
    تساگری مرکز اداری لچخومی است و در درهٔ رود تسخنیستسکالی در ارتفاع حدود 480 متر نشسته است. شهری کوچک
    و آرام با کمترین زیرساخت گردشگری، و دقیقاً همین جذابیت آن است. در مقایسه با مسیرهای کوهستانی بلند
    راچا، لچخومی به‌مراتب دسترس‌پذیرتر است و در تمام فصل باز می‌ماند.


    لچخومی پیش از هر چیز سرزمین شراب است. ارقام کمیابی اینجا کشت می‌شود، از جمله **اوساخلوری** که به مقدار
    بسیار اندک تولید می‌شود و یکی از گران‌ترین شراب‌های سرخ گرجستان به شمار می‌رود. سردابه‌های خانوادگی
    در تساگری و روستاهای پیرامون مزه‌کردن ارائه می‌کنند، معمولاً با هماهنگی قبلی.


    یک روز اینجا معمولاً مرکز تساگری با بازار و کلیسای کهنش، دژ موری بالای دره، آبگیر لاجانوری با آب فیروزه‌ایش
    و سردابه‌های خانوادگی روستاهای دره را در بر می‌گیرد. تساگری همچنین ایستگاهی در راه سوانتی است، هرچند
    آن مرحله برنامه‌ریزی جداگانهٔ خود را می‌خواهد. اگر پیشاپیش راهی راچا هستید، لچخومی افزودنی طبیعی است
    که رانندگی چندانی اضافه نمی‌کند و به سفر نیمهٔ دومی کم‌ارتفاع‌تر و ملایم‌تر می‌دهد.
  tip: >-
    مزه‌کردن در سردابه‌ها را از پیش هماهنگ کنید — تولیدکنندگان لچخومی کوچک‌اند و اوساخلوری همیشه موجود
    نیست. پیش از آغاز مزه‌کردن روشن کنید چه کسی رانندگی می‌کند، چون گرجستان حد الکل را سختگیرانه اجرا
    می‌کند. پول نقد همراه داشته باشید، چون کارت همه‌جا پذیرفته نمی‌شود. در تساگری سوخت هست اما پمپ‌ها
    کم‌شمارند، و خودپرداز در مرکز شهر قرار دارد. اقامتگاه‌ها ساده‌اند و رزرو پیشاپیش در فصل عاقلانه است.
  route: >-
    از تفلیس E60 را تا کوتایسی بگیرید و سپس رو به شمال به درون دره به سوی تساگری بروید — روی‌هم حدود 325
    کیلومتر و پنج ساعت. پس از کوتایسی جاده باریک می‌شود و تنگهٔ تسخنیستسکالی را دنبال می‌کند: بیشتر مسیر
    آسفالت دارد اما جابه‌جا شکسته است و چند انشعاب روستایی شنی است. کلیرنس بیشتر رانندگی را به‌روشنی راحت‌تر
    می‌کند. در زمستان جاده باز می‌ماند اما یخ می‌بندد. باک را در کوتایسی پر کنید، جایی که انتخاب به‌مراتب
    بهتر است.
he:
  name: צאגרי ולצ'חומי
  short: מרכז לצ'חומי בעמק הצחניסצקלי — ארץ יין, מבצרים ומאגר לאג'אנורי.
  body: >-
    צאגרי היא המרכז המנהלי של אזור לצ'חומי, והיא שוכנת בעמק נהר הצחניסצקלי בגובה של כ-480 מטר. זו עיירה
    קטנה ושקטה עם תשתית תיירותית מזערית, וזה בדיוק מה שהופך אותה למושכת. בהשוואה למסלולי ההרים הגבוהים
    של רצ'ה, לצ'חומי נגישה הרבה יותר ונשארת פתוחה לאורך כל העונה.


    לצ'חומי היא קודם כול ארץ יין. גדלים כאן זני גפן נדירים, ובהם **אוסחלאורי**, המיוצר בכמויות זעירות
    מאוד ונחשב לאחד היינות האדומים היקרים ביותר בגאורגיה. מרתפים משפחתיים בצאגרי ובכפרים שסביבה מציעים
    טעימות, בדרך כלל בתיאום מראש.


    יום כאן כולל בדרך כלל את מרכז צאגרי על השוק והכנסייה העתיקה שבו; את מבצר מורי, שעומד על המדרון מעל
    העמק; את מאגר לאג'אנורי עם המים הטורקיזיים שלו; ואת מרתפי היין המשפחתיים בכפרי העמק. צאגרי משמשת גם
    נקודת ביניים בדרך אל סוואנטי, אם כי הקטע ההוא דורש תכנון בפני עצמו. ואם ממילא אתם עולים לרצ'ה, לצ'חומי
    היא תוספת טבעית שעולה מעט מאוד נסיעה ומעניקה לטיול חצי שני נמוך יותר ורך יותר.
  tip: >-
    תאמו את טעימות המרתף מראש — יצרני לצ'חומי הם עסקים קטנים ואוסחלאורי אינו זמין תמיד. החליטו מי נוהג
    עוד לפני שהטעימה מתחילה, שכן גאורגיה אוכפת סף אלכוהול נוקשה. שאו מזומן, כי לא בכל מקום מקבלים כרטיסים.
    יש דלק בצאגרי אך מבחר התחנות דל, וכספומט נמצא במרכז. בתי ההארחה צנועים, וכדאי להזמין מראש בעונה.
  route: >-
    מטביליסי סעו בכביש E60 עד קוטאיסי, ומשם צפונה אל תוך העמק לכיוון צאגרי — כ-325 ק"מ וכחמש שעות בסך
    הכול. אחרי קוטאיסי הכביש מצטמצם ועוקב אחר ערוץ הצחניסצקלי: אספלט קיים ברובו אך שבור במקומות, וכמה
    מהסתעפויות הכפרים הן חצץ. גובה גחון נוסף משפר את הנסיעה במידה ניכרת. בחורף הדרך נשארת עבירה אך מתכסה
    בקרח. מלאו את המיכל בקוטאיסי, שם המבחר טוב בהרבה.
ar:
  name: تساغيري وليتشخومي
  short: مركز ليتشخومي في وادي تسخينيستسكالي — أرض نبيذ وحصون وخزان لاجانوري.
  body: >-
    تساغيري هي المركز الإداري لإقليم ليتشخومي، وتقع في وادي نهر تسخينيستسكالي على ارتفاع نحو 480 متراً.
    وهي بلدة صغيرة هادئة ذات بنية سياحية محدودة جداً، وهذا بالضبط هو سر جاذبيتها. ومقارنة بمسارات راتشا
    الجبلية المرتفعة، فإن ليتشخومي أيسر وصولاً بكثير منها وتبقى مفتوحة طوال الموسم.


    وليتشخومي قبل كل شيء أرض نبيذ. تُزرع هنا أصناف نادرة من العنب، منها **أوساخيلوري**، الذي يُنتج بكميات
    ضئيلة جداً ويُعد من أغلى أنواع النبيذ الأحمر في جورجيا. وتقدم الأقبية العائلية في تساغيري وفي القرى
    المحيطة بها جلسات تذوق، بترتيب مسبق عادة.


    ويغطي يوم واحد هنا عادة مركز تساغيري بسوقه وكنيسته القديمة؛ وحصن موري القائم على المنحدر المطل على
    الوادي؛ وخزان لاجانوري بمياهه الفيروزية؛ والأقبية العائلية في قرى الوادي. وتصلح تساغيري أيضاً محطة
    على الطريق نحو سفانيتي، وإن كان ذلك المقطع يحتاج تخطيطاً خاصاً به. وإن كنت متجهاً أصلاً إلى راتشا،
    فليتشخومي إضافة طبيعية لا تكلف قيادة تُذكر وتمنح الرحلة نصفاً ثانياً أدنى ارتفاعاً وألطف إيقاعاً.
  tip: >-
    رتب جلسات التذوق مسبقاً — فمنتجو ليتشخومي مشاريع صغيرة وأوساخيلوري ليس متاحاً دائماً. احسم من سيقود
    قبل أن يبدأ التذوق، فجورجيا تطبق حداً صارماً للكحول. احمل نقداً، إذ لا تُقبل البطاقات في كل مكان.
    يتوفر الوقود في تساغيري لكن خيارات المحطات قليلة، وفي المركز جهاز صراف. بيوت الضيافة متواضعة، ويُستحسن
    الحجز مسبقاً في الموسم.
  route: >-
    من تبليسي اسلك طريق E60 حتى كوتايسي، ثم اتجه شمالاً إلى داخل الوادي نحو تساغيري — نحو 325 كم وخمس
    ساعات إجمالاً. بعد كوتايسي يضيق الطريق ويتبع مضيق تسخينيستسكالي: الإسفلت موجود في معظمه لكنه متآكل
    في مواضع، وعدة تفرعات نحو القرى حصوية. والخلوص الأرضي الإضافي يحسّن القيادة كثيراً. وفي الشتاء يبقى
    الطريق سالكاً لكنه يتجمد. املأ الخزان في كوتايسي حيث الخيارات أوفر بكثير.
