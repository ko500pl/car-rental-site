ka:
  name: ატენის სიონი
  short: VII საუკუნის ტაძარი ატენის ხეობაში, უნიკალური XI საუკუნის ფრესკებით და ისტორიული ვენახებით.
  body: >-
    **ატენის სიონი ჯვრის მონასტრის „უმცროსი ძმაა".** ის VII საუკუნეში აშენდა იმავე ტეტრაკონქული სქემით,
    რაც მცხეთის ჯვარშია, და მიიჩნევა, რომ ოსტატები პირდაპირ ჯვრის მოდელს იმეორებდნენ. ტაძარი გორიდან სამხრეთით,
    ტანას ხეობაში დგას, ციცაბო ფერდობებით და ვენახებით შემოსილ, ჩუმ ადგილას.


    მთავარი ღირებულება შიგნითაა. XI საუკუნის ფრესკები, რომლებიც აქ ნაწილობრივ შემორჩა, ქართული შუასაუკუნეების
    მხატვრობის საუკეთესო ნიმუშებია — განსაკუთრებით „ღვთისმშობლის მიძინება" და მაცხოვრის ციკლი. კედლებზე
    ასევე შემორჩა უძველესი ასომთავრული წარწერები, მათ შორის VIII–IX საუკუნეების გრაფიტი, რომელიც ისტორიკოსებისთვის
    ცალკე წყაროა.


    ხეობა თავად ცალკე მიზეზია ჩამოსვლისა:


    - ატენის ვენახები, სადაც ისტორიულად „ატენური ღვინო" იწარმეობდა და დღეს პატარა მარნებია აღდგენილი

    - ტანას ხეობის კლდოვანი კედლები და მდინარე, სადაც ზაფხულში გრილა

    - ატენის ციხის ნაშთები კლდის თავზე, ტაძრიდან რამდენიმე კილომეტრში


    ეს ის ადგილია, სადაც ტურისტული ავტობუსები არ დადის — უფლისციხის შემდეგ, სადაც ხალხმრავლობაა, ატენი
    განსაკუთრებით სასიამოვნო კონტრასტია.


    ტაძარი პატარაა და შიგნით დიდხანს დარჩენა არ გამოგივა, მაგრამ სწორედ ეს მასშტაბი მუშაობს: ოთხივე მხრიდან
    თანაბარი აფსიდები ისეთ სივრცეს ქმნის, სადაც ცენტრში დგომისას ყველა მიმართულება ერთნაირად იკითხება.
    აქვე შესამჩნევია მშენებლობის ორი ეტაპი — ქვედა ქვის ფენა უფრო ძველია, ზედა კი აღდგენის შედეგია. ხეობაში
    სეირნობა ტაძრის შემდეგ ბუნებრივი გაგრძელებაა: მდინარემდე რამდენიმე წუთია და ზაფხულში წყალთან საგრძნობლად
    გრილა.
  tip: >-
    ტაძარი ყოველთვის ღია არ არის — ხშირად კარი დაკეტილია და გასაღები მახლობელ სახლშია; მოთმინება და თავაზიანი
    კითხვა ჩვეულებრივ ჭრის საკითხს. ფრესკები სუსტ განათებაშია, ამიტომ დღის ნათელი საათები აირჩიე; ფოტოაპარატის
    ფლეში აკრძალულია. ჩაცმის წესები მოქმედებს. ინფრასტრუქტურა ხეობაში მინიმალურია: კაფე და ტუალეტი გორში
    აიღე. ერთი საათი ტაძარზე, კიდევ ერთი ხეობაზე სეირნობით.
  route: >-
    თბილისიდან E60-ით გორამდე (86 კმ, საათი და ათი წუთი), შემდეგ ქალაქიდან სამხრეთით ატენის ხეობის გზაზე
    გადაუხვევ და კიდევ 12 კმ გაივლი ტანას მდინარის გასწვრივ. გზა ძირითადად ასფალტია, თუმცა ვიწრო, ორმოებიანი
    მონაკვეთებით და რამდენიმე ვიწრო ხიდით — ფრთხილად წვიმის შემდეგ. სულ დაახლოებით 98 კმ და საათნახევარი.
    ეკონომ-კლასის ავტომობილი გამოდგება, თუმცა კროსოვერზე ბოლო კილომეტრები უფრო კომფორტულია. საწვავი აუცილებლად
    გორში აიღე — ხეობაში სადგური არ არის.
en:
  name: Ateni Sioni Church
  short: A 7th-century church in the Ateni gorge with outstanding 11th-century frescoes and historic vineyards.
  body: >-
    **Ateni Sioni is the younger sibling of Jvari.** Built in the 7th century on the same tetraconch plan
    as the church above Mtskheta, it is generally accepted that its masons were working directly from
    the Jvari model. It stands south of Gori in the Tana gorge, in a quiet spot enclosed by steep slopes
    and vineyards.


    The real treasure is inside. The surviving 11th-century frescoes are among the finest examples of
    medieval Georgian painting, particularly the Dormition of the Virgin and the cycle of the life of
    Christ. The walls also carry very early *asomtavruli* inscriptions, including 8th and 9th century
    graffiti that historians treat as a source in their own right.


    The gorge itself is a reason to come:


    - The Ateni vineyards, historic home of *atenuri* wine, with several small cellars working again

    - The rock walls of the Tana valley and the river, which keeps the gorge cool in summer

    - The ruins of Ateni fortress on a crag a few kilometres beyond the church


    Coach tours do not come here. After the crowds at Uplistsikhe, the emptiness of Ateni is a striking
    and welcome contrast, and the drive up the gorge is pleasant in its own right.
  tip: >-
    The church is not always open; the door is often locked with the key kept in a nearby house, and a
    patient, polite enquiry usually solves it. The frescoes are lit only by daylight, so come in the middle
    of the day, and flash photography is not allowed. Normal dress rules apply. Facilities in the gorge
    are minimal, so use cafés and toilets in Gori. Allow an hour for the church and another for a walk
    along the river.
  route: >-
    Take the E60 from Tbilisi to Gori (86 km, an hour and ten minutes), then turn south out of the town
    onto the Ateni gorge road and continue about 12 km along the Tana river. The road is mostly asphalt
    but narrow, with potholed sections and several single-lane bridges — take care after rain. In total
    roughly 98 km and an hour and a half. An economy car manages it, though a crossover makes the last
    few kilometres more comfortable. Fill up in Gori, as there is no fuel station in the gorge.
ru:
  name: Атени Сиони
  short: Храм VII века в Атенском ущелье с выдающимися фресками XI века и историческими виноградниками.
  body: >-
    **Атени Сиони — младший брат Джвари.** Храм построен в VII веке по той же тетраконховой схеме, что
    и церковь над Мцхетой, и принято считать, что мастера работали прямо по джварскому образцу. Он стоит
    южнее Гори, в ущелье реки Тана, в тихом месте среди крутых склонов и виноградников.


    Главная ценность внутри. Сохранившиеся фрески XI века — одни из лучших образцов средневековой грузинской
    живописи, особенно «Успение Богородицы» и цикл жизни Христа. На стенах есть и очень ранние надписи
    асомтаврули, включая граффити VIII–IX веков, которые историки рассматривают как самостоятельный источник.


    Само ущелье — отдельная причина приехать:


    - Атенские виноградники, историческая родина вина «атенури», где снова работают небольшие марани

    - Скальные стены долины Таны и река, благодаря которой летом здесь прохладно

    - Руины Атенской крепости на скале в нескольких километрах за храмом


    Автобусные туры сюда не заезжают. После многолюдного Уплисцихе пустота Атени производит сильное и
    приятное впечатление, да и сама дорога по ущелью хороша.
  tip: >-
    Храм открыт не всегда: дверь часто заперта, а ключ хранится в соседнем доме, и вежливый вопрос обычно
    решает проблему. Фрески освещаются только дневным светом, поэтому приезжайте в середине дня; снимать
    со вспышкой нельзя. Действуют обычные правила одежды. Инфраструктуры в ущелье почти нет, кафе и туалеты
    — в Гори. Закладывайте час на храм и ещё час на прогулку вдоль реки.
  route: >-
    По E60 из Тбилиси до Гори (86 км, час десять), затем из города на юг по дороге в Атенское ущелье и
    ещё около 12 км вдоль реки Тана. Дорога преимущественно асфальтовая, но узкая, с разбитыми участками
    и несколькими однополосными мостами — после дождя аккуратнее. Всего примерно 98 км и полтора часа.
    Машина эконом-класса справляется, но на кроссовере последние километры комфортнее. Заправляйтесь в
    Гори: в ущелье заправок нет.
fa:
  name: کلیسای آتنی سیونی
  short: کلیسایی از سدهٔ هفتم در تنگهٔ آتنی با فرسک‌های برجستهٔ سدهٔ یازدهم و تاکستان‌های تاریخی.
  body: >-
    **آتنی سیونی برادر کوچک‌تر جواری است.** این کلیسا در سدهٔ هفتم بر همان نقشهٔ چهارلپه‌ای کلیسای بالای
    متسختا ساخته شد و عموماً پذیرفته‌اند که معمارانش مستقیماً از الگوی جواری کار می‌کرده‌اند. جنوب گوری،
    در تنگهٔ تانا، در نقطه‌ای آرام میان دامنه‌های تند و تاکستان‌ها ایستاده است.


    گنجینهٔ واقعی داخل است. فرسک‌های بازمانده از سدهٔ یازدهم از بهترین نمونه‌های نقاشی گرجی سده‌های میانه‌اند،
    به‌ویژه خوابیدگی مریم و چرخهٔ زندگی مسیح. روی دیوارها کتیبه‌های بسیار کهن به خط *اسومتاورولی* هم هست،
    از جمله دست‌نوشته‌های سده‌های هشتم و نهم که مورخان آن‌ها را منبعی مستقل به شمار می‌آورند.


    خود تنگه دلیلی برای آمدن است:


    - تاکستان‌های آتنی، خاستگاه تاریخی شراب *آتنوری*، با چند سردابهٔ کوچک که دوباره کار می‌کنند

    - دیواره‌های صخره‌ای درهٔ تانا و رودخانه که در تابستان تنگه را خنک نگه می‌دارد

    - ویرانه‌های دژ آتنی بر صخره‌ای چند کیلومتر آن‌سوی کلیسا


    تورهای اتوبوسی به اینجا نمی‌آیند. پس از شلوغی اوپلیستسیخه، خلوتی آتنی تضادی چشمگیر و دلپذیر است و
    خود رانندگی در تنگه هم لذت‌بخش است.
  tip: >-
    کلیسا همیشه باز نیست؛ در اغلب مواقع قفل است و کلید در خانه‌ای همان نزدیکی نگهداری می‌شود، و یک پرس‌وجوی
    مؤدبانه و صبورانه معمولاً مشکل را حل می‌کند. فرسک‌ها فقط با نور روز روشن می‌شوند، پس میانهٔ روز بیایید،
    و عکاسی با فلاش ممنوع است. قواعد معمول پوشش برقرار است. امکانات در تنگه بسیار کم است، پس کافه و سرویس
    بهداشتی را در گوری استفاده کنید. یک ساعت برای کلیسا و یک ساعت برای قدم زدن کنار رودخانه در نظر بگیرید.
  route: >-
    از تفلیس E60 را تا گوری بگیرید (86 کیلومتر، یک ساعت و ده دقیقه)، سپس از شهر به سمت جنوب به جادهٔ تنگهٔ
    آتنی بپیچید و حدود 12 کیلومتر در امتداد رودخانهٔ تانا ادامه دهید. جاده بیشتر آسفالت است اما باریک،
    با بخش‌های چاله‌دار و چند پل تک‌بانده — پس از باران محتاط باشید. در مجموع حدود 98 کیلومتر و یک ساعت
    و نیم. خودروی اقتصادی از پس آن برمی‌آید، هرچند کراس‌اوور چند کیلومتر آخر را راحت‌تر می‌کند. باک را
    در گوری پر کنید، چون در تنگه پمپ‌بنزین نیست.
he:
  name: כנסיית אתני סיוני
  short: כנסייה מן המאה ה-7 בערוץ אתני, עם ציורי קיר יוצאי דופן מן המאה ה-11 וכרמים היסטוריים.
  body: >-
    **אתני סיוני היא אחותה הצעירה של ג'וארי.** היא נבנתה במאה ה-7 על אותה תוכנית טטרהקונכית של הכנסייה
    שמעל מצחתה, ומקובל להניח שהבנאים שלה עבדו ישירות לפי הדגם של ג'וארי. היא עומדת מדרום לגורי בערוץ טאנה,
    בפינה שקטה שסוגרים עליה מדרונות תלולים וכרמים.


    האוצר האמיתי נמצא בפנים. ציורי הקיר ששרדו מן המאה ה-11 נמנים עם הדוגמאות המשובחות ביותר של הציור הגאורגי
    מימי הביניים, ובעיקר הירדמות הבתולה ומחזור חיי ישו. על הקירות שמורות גם כתובות קדומות מאוד בכתב *אסומתאוורולי*,
    ובהן גרפיטי מן המאות ה-8 וה-9 שההיסטוריונים מתייחסים אליו כאל מקור בפני עצמו.


    הערוץ עצמו הוא סיבה לבוא:


    - כרמי אתני, ביתו ההיסטורי של יין ה*אתנורי*, עם כמה מרתפים קטנים שחזרו לעבוד

    - קירות הסלע של עמק טאנה והנהר, ששומר על קרירות בערוץ בקיץ

    - חורבות מבצר אתני על צוק כמה קילומטרים מעבר לכנסייה


    אוטובוסי תיירים אינם מגיעים לכאן. אחרי ההמונים באופליסציחה, הריקנות של אתני היא ניגוד בולט ומרענן,
    והנסיעה במעלה הערוץ נעימה בפני עצמה.
  tip: >-
    הכנסייה אינה פתוחה תמיד; הדלת נעולה לעיתים קרובות והמפתח נמצא באחד הבתים הסמוכים, ופנייה מנומסת וסבלנית
    פותרת את זה בדרך כלל. ציורי הקיר מוארים באור יום בלבד, לכן הגיעו באמצע היום, וצילום בפלאש אסור. כללי
    הלבוש הרגילים חלים. השירותים בערוץ מינימליים, אז השתמשו בבתי הקפה ובשירותים בגורי. הקציבו שעה לכנסייה
    ועוד שעה להליכה לאורך הנהר.
  route: >-
    סעו מטביליסי בכביש E60 עד גורי (86 ק״מ, שעה ועשר דקות), ואז פנו דרומה מחוץ לעיר אל כביש ערוץ אתני
    והמשיכו כ-12 ק״מ לאורך נהר טאנה. הכביש סלול ברובו אך צר, עם קטעים משובשים וכמה גשרים ברוחב נתיב אחד
    — היזהרו אחרי גשם. בסך הכול כ-98 ק״מ ושעה וחצי. רכב חסכוני מסתדר, אם כי קרוסאובר הופך את הקילומטרים
    האחרונים לנוחים יותר. תדלקו בגורי, שכן אין תחנת דלק בערוץ.
ar:
  name: كنيسة أتيني سيوني
  short: كنيسة من القرن السابع في وادي أتيني برسوم جدارية بديعة من القرن الحادي عشر وكروم تاريخية.
  body: >-
    **أتيني سيوني هي الشقيقة الصغرى لجفاري.** بُنيت في القرن السابع على المخطط الرباعي الحنيات نفسه الذي
    بُنيت عليه الكنيسة المطلة على متسخيتا، ويكاد يُجمع على أن بنّائيها عملوا مباشرة وفق نموذج جفاري. وهي
    تقف جنوب غوري في وادي تانا، في موضع هادئ تحصره منحدرات حادة وكروم.


    أما الكنز الحقيقي فداخلها. الرسوم الجدارية الباقية من القرن الحادي عشر من أرقى نماذج التصوير الجورجي
    في العصور الوسطى، ولا سيما رقاد العذراء ودورة حياة المسيح. وتحمل الجدران أيضاً نقوشاً بالغة القدم
    بخط *أسومتافرولي*، منها كتابات من القرنين الثامن والتاسع يعدّها المؤرخون مصدراً قائماً بذاته.


    والوادي نفسه سبب كافٍ للمجيء:


    - كروم أتيني، الموطن التاريخي لنبيذ *أتينوري*، وفيها عدة أقبية صغيرة عادت إلى العمل

    - الجدران الصخرية لوادي تانا والنهر الذي يبقي المكان بارداً في الصيف

    - أطلال حصن أتيني على صخرة تبعد بضعة كيلومترات خلف الكنيسة


    لا تصل حافلات الجولات إلى هنا. وبعد زحام أوبليستسيخي، يشكل خلاء أتيني تبايناً لافتاً ومريحاً، والقيادة
    صعوداً في الوادي ممتعة بحد ذاتها.
  tip: >-
    الكنيسة ليست مفتوحة دائماً؛ فالباب مقفل في الغالب والمفتاح محفوظ في بيت قريب، وسؤال مهذب صبور يحل
    المسألة عادة. ولا تُضاء الرسوم إلا بضوء النهار، فتعال في منتصف اليوم، والتصوير بالفلاش ممنوع. وتُطبق
    قواعد اللباس المعتادة. المرافق في الوادي شحيحة، فاستخدم المقاهي ودورات المياه في غوري. خصص ساعة للكنيسة
    وأخرى للمشي على ضفة النهر.
  route: >-
    اسلك الطريق E60 من تبليسي إلى غوري (86 كم، ساعة وعشر دقائق)، ثم انعطف جنوباً خارج المدينة إلى طريق
    وادي أتيني وتابع نحو 12 كم بمحاذاة نهر تانا. الطريق معبّد في معظمه لكنه ضيق، فيه مقاطع مليئة بالحفر
    وعدة جسور بمسرب واحد — فانتبه بعد المطر. والمسافة الإجمالية نحو 98 كم وساعة ونصف. سيارة اقتصادية تتدبر
    الأمر، وإن كانت الكروس أوفر تجعل الكيلومترات الأخيرة أكثر راحة. املأ الخزان في غوري، إذ لا محطة وقود
    في الوادي.
