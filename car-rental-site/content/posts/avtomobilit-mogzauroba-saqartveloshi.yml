ka:
  title: 7 საუკეთესო საავტომობილო მარშრუტი საქართველოში
  desc: >-
    ყაზბეგი, კახეთი, ბათუმი, სვანეთი, ვარძია, რაჭა და თუშეთი — მანძილი, გზაში გასატარებელი დრო, საჭირო
    კატეგორია, საფარი და სეზონი თითოეულ მარშრუტზე.
  keywords: >-
    საავტომობილო მარშრუტები საქართველო, road trip georgia, თბილისი ყაზბეგი მანქანით, კახეთის ღვინის გზა,
    სვანეთი მანქანით, თუშეთი 4x4, ვარძია მარშრუტი
  lead: >-
    საქართველოს მთავარი სანახაობები ერთმანეთისგან 100–500 კმ-ითაა დაშორებული და საზოგადოებრივი ტრანსპორტით
    მათი მოვლა რამდენიმე დღით მეტ დროს მოითხოვს. ქვემოთ შვიდი მარშრუტია — ზუსტი მანძილით, დროით და იმ
    ავტომობილის კატეგორიით, რომელიც თითოეულს ნამდვილად სჭირდება.
  body: >
    ## რატომ სჯობს ავტომობილი


    საქართველო კომპაქტური ქვეყანაა: თბილისიდან ყველა მთავარ რეგიონამდე ერთ დღეში მიდიხართ. პრობლემა მარშრუტიდან
    გადახვევაა — მონასტერი, ციხე ან ღვინის მარანი თითქმის ყოველთვის მაგისტრალიდან 5–20 კმ-ითაა მოშორებული
    და იქამდე მარშრუტკა არ დადის. სწორედ ამიტომ ავტომობილი დღეს 2–3-ჯერ მეტ ობიექტს გაჩვენებთ იმავე დროში.


    ჩვენს ტარიფში გარბენი საქართველოს ტერიტორიაზე შეუზღუდავია, ამიტომ დღეში 400 კმ-ის გავლა ფასზე არ აისახება.
    საწვავი მოქირავნის ხარჯია და მოქმედებს „სავსე → სავსე“ პრინციპი.


    ## შვიდი მარშრუტი ერთ ცხრილში


    | მარშრუტი | მანძილი (ერთი მხარე) | გზაში | კატეგორია | საფარი | სეზონი |

    |---|---|---|---|---|---|

    | თბილისი – ყაზბეგი | 155 კმ | 3 სთ | კროსოვერი, 130 ₾ | ასფალტი | მაისი–ოქტომბერი |

    | კახეთის ღვინის რგოლი | 250 კმ (რგოლი) | 5–6 სთ | ეკონომი, 75 ₾ | ასფალტი | სექტემბერი–ოქტომბერი
    |

    | თბილისი – ბათუმი | 370 კმ | 5 სთ | ბიზნესი, 210 ₾ | ავტობანი | მთელი წელი |

    | თბილისი – მესტია | 470 კმ | 8–9 სთ | კროსოვერი / 4x4 | ასფალტი (უშგული — გრუნტი) | ივნისი–სექტემბერი
    |

    | ბორჯომი – ბაკურიანი – ვარძია | 290 კმ (რგოლი) | 6 სთ | კროსოვერი, 130 ₾ | ასფალტი, ბოლოს უხეში |
    მთელი წელი |

    | თბილისი – ამბროლაური (რაჭა) | 330 კმ | 6 სთ | კროსოვერი, 130 ₾ | ვიწრო ასფალტი | ივნისი–ოქტომბერი
    |

    | ფშაველი – ომალო (თუშეთი) | 70 კმ | 4–5 სთ | მაღალი გამავლობის 4x4, 240 ₾ | გრუნტი | ივნისი–ოქტომბერი
    |


    ### 1. თბილისი – ყაზბეგი (სტეფანწმინდა)


    საქართველოს სამხედრო გზა ანანურის, ჟინვალის წყალსაცავისა და გუდაურის გავლით. 155 კმ, სამი საათი გაჩერებების
    გარეშე — რეალურად მთელი დღე. ასფალტი ბოლომდე კარგია, თუმცა გუდაურის სერპანტინი მოითხოვს გამოცდილებას.
    **რჩევა:** ბოლო საიმედო ბენზინგასამართი პასანაურშია; გუდაურის შემდეგ არჩევანი მკვეთრად მცირდება. გერგეტის
    სამების ეკლესიამდე ბოლო 6 კმ ციცაბო გრუნტია — მშრალ ამინდში კროსოვერი გაივლის, წვიმაში მხოლოდ 4x4.


    ### 2. კახეთის ღვინის რგოლი


    თბილისი – სიღნაღი – წნორი – თელავი – გომბორის უღელტეხილი – თბილისი. სულ დაახლოებით 250 კმ, ხუთი-ექვსი
    საათი საჭესთან, ორ დღეზე გაწერა ჯობია. ასფალტი მთელ მონაკვეთზეა, ეკონომ კლასი სავსებით საკმარისია.
    **რჩევა:** რთველზე მარნები დეგუსტაციას სთავაზობენ ყველას — წინასწარ განსაზღვრეთ, ვინ ატარებს. საქართველოში
    ალკოჰოლის ზღვარი ძალიან მკაცრია და შემოწმება ხშირია. მეორე მძღოლის დამატება 20 ლარი დღეშია.


    ### 3. თბილისი – ბათუმი შავი ზღვის სანაპიროზე


    370 კმ E60-ით: გორი, ხაშური, რიკოთის ახალი მაგისტრალი, ქუთაისი, სამტრედია, ქობულეთი. ხუთი საათი. ეს
    ქვეყნის საუკეთესო გზაა და აქ ბიზნეს კლასი თავს ამართლებს — ხმაურის იზოლაცია და ადაპტური კრუიზ-კონტროლი
    გრძელ მონაკვეთზე დაღლილობას ამცირებს. **რჩევა:** თბილისიდან 07:00-მდე გამოდით; საათი გვიან გასვლა
    ხაშურამდე 40 წუთს მატებს. ბათუმში დაბრუნება სავალდებულო არაა — ერთმხრივი გაქირავება 100 ლარიდან ჯდება.


    ### 4. სვანეთი და მესტია


    თბილისიდან მესტიამდე 470 კმ ზუგდიდის გავლით, რვა-ცხრა საათი. ერთ დღეში გაწევა შესაძლებელია, მაგრამ
    ქუთაისში ან ზუგდიდში ღამის გათევა ბევრად უფრო კომფორტულია. მესტიამდე ასფალტია და ნებისმიერი კატეგორია
    მიდის. **უშგულის 45-კილომეტრიანი მონაკვეთი გრუნტოვანია და მხოლოდ მაღალი გამავლობის 4x4 კატეგორიით
    არის ნებადართული** — სხვა კატეგორიით მიღებული დაზიანება დაზღვევით არ იფარება. **რჩევა:** მესტია–უშგული
    ორ საათს ითხოვს ერთ მხარეს, ამიტომ 09:00-ზე გამგზავრება სავალდებულოა.


    ### 5. ბორჯომი – ბაკურიანი – ვარძია


    თბილისიდან ბორჯომამდე 160 კმ (2.5 სთ), ბორჯომიდან ბაკურიანამდე 30 კმ სერპანტინი (45 წუთი), ბორჯომიდან
    ვარძიამდე 100 კმ ახალციხისა და ასპინძის გავლით (2 სთ). ერთადერთი მარშრუტია, რომელიც ზამთარშიც სრულფასოვნად
    მუშაობს: ბაკურიანი სამთო-სათხილამურო კურორტია. **რჩევა:** ვარძიის კომპლექსი 17:00-ზე იხურება — ახალციხეში
    გაჩერება მხოლოდ საწვავზე დაგეგმეთ, დათვალიერება რაბათის ციხისა უკან დაბრუნებისას სჯობს.


    ### 6. რაჭა და ამბროლაური


    თბილისი – ხაშური – ზესტაფონი – ამბროლაური, დაახლოებით 330 კმ და ექვსი საათი. ბოლო 60 კმ ვიწრო, კლდეში
    გამოკვეთილი ასფალტია, სადაც ორი მანქანის გაშორება ყურადღებას ითხოვს — ამიტომ კროსოვერი ჯობია სედანს.
    **რჩევა:** ამბროლაურის შემდეგ (შოვი, ღები) ბენზინგასამართი პრაქტიკულად აღარაა — ბაკი ამბროლაურში აავსეთ.
    ხვანჭკარის მარნები წინასწარ ჯავშანს ითხოვენ.


    ### 7. თუშეთი და აბანოს უღელტეხილი


    ფშაველიდან ომალომდე მხოლოდ 70 კმ-ია, მაგრამ გზაში ოთხიდან ხუთ საათამდე გადის: გრუნტი, სიგანე ერთი
    ავტომობილი, 2 850 მ სიმაღლის უღელტეხილი. **უღელტეხილი ღიაა დაახლოებით ივნისიდან ოქტომბრამდე და მოითხოვს
    მაღალი გამავლობის 4x4-ს, წინასწარ წერილობით შეთანხმებას და დამატებით 500 ლარიან ფრანშიზას.** **რჩევა:**
    ომალოში ბენზინგასამართი არ არის — სრული ბაკით ავიდეთ; დაძვრა 12:00-მდე, რომ დაღმართი სიბნელეში არ
    მოგიწიოთ.


    ## რომელი კატეგორია რომელ მარშრუტს


    - **ეკონომ კლასი (75 ₾)** — კახეთი, ბორჯომი, ქვემო ქართლი, ქალაქთაშორისი ასფალტი.

    - **კროსოვერი / SUV (130 ₾)** — ყაზბეგი, რაჭა, სვანეთი მესტიამდე, ოჯახური მოგზაურობა ბარგით.

    - **მაღალი გამავლობის 4x4 (240 ₾)** — უშგული, თუშეთი, შატილი, ნებისმიერი გრუნტი.

    - **მინივენი (200 ₾)** — 6–8 კაციანი ჯგუფი ერთ მარშრუტზე.


    სრული ტექნიკური მახასიათებლები [ავტოპარკის გვერდზეა](/fleet/), ტარიფები და დამატებითი სერვისები —
    [ფასების ცხრილში](/pricing/).


    ## რამდენიმე პრაქტიკული წესი


    1. დღეში 300 კმ-ზე მეტს ნუ დაგეგმავთ — მთის გზაზე საშუალო სიჩქარე 45 კმ/სთ-ია, არა 90.

    2. ბაკი მაშინ აავსეთ, როცა ნახევარზე ჩამოდის, არა მაშინ, როცა ცარიელია.

    3. საბურავები და დისკები CDW-ით არ იფარება — ორმოებს ფრთხილად გაუარეთ.

    4. გზის სტატუსი და ზვავის რისკი გამგზავრებამდე შეამოწმეთ; ეს განსაკუთრებით ეხება გუდაურს.

    5. მარშრუტის შეცვლა შესაძლებელია — უბრალოდ დაგვირეკეთ [კონტაქტის გვერდიდან](/contact/) და კატეგორიას
    შეგიცვლით, თუ გრუნტზე გასვლა გადაწყვიტეთ.


    დამატებითი კითხვები მარშრუტებზე და სეზონურ შეზღუდვებზე — [FAQ გვერდზე](/faq/).
en:
  title: 7 best road-trip routes in Georgia by car
  desc: >-
    Kazbegi, Kakheti, Batumi, Svaneti, Vardzia, Racha and Tusheti — distance, driving time, the vehicle
    category each route needs, road surface and best season.
  keywords: >-
    road trip Georgia, driving routes Georgia, Tbilisi to Kazbegi by car, Kakheti wine route, Svaneti
    by car, Tusheti 4x4, Vardzia road trip, car rental Georgia
  lead: >-
    Georgia's headline sights sit 100 to 500 km apart, and covering them by marshrutka costs days rather
    than hours. Here are seven routes with real distances, honest driving times and the vehicle category
    each one actually requires.
  body: >
    ## Why a car changes the arithmetic


    Georgia is a compact country: from Tbilisi you can reach any major region within a day. The difficulty
    is never the highway — it is the last 5 to 20 km, where the monastery, the fortress or the wine cellar
    sits and no public transport goes. That detour is exactly what a car buys you, and it is why the same
    week yields two or three times more stops.


    Mileage inside Georgia is unlimited on every one of our rates, so a 400 km day costs no more than
    a 40 km day. Fuel is the renter's expense under a full-to-full policy.


    ## All seven routes at a glance


    | Route | Distance (one way) | Driving time | Category | Surface | Best season |

    |---|---|---|---|---|---|

    | Tbilisi – Kazbegi | 155 km | 3 h | Crossover, 130 ₾ | Asphalt | May–October |

    | Kakheti wine loop | 250 km (loop) | 5–6 h | Economy, 75 ₾ | Asphalt | September–October |

    | Tbilisi – Batumi | 370 km | 5 h | Business, 210 ₾ | Motorway | All year |

    | Tbilisi – Mestia | 470 km | 8–9 h | Crossover / 4x4 | Asphalt (gravel to Ushguli) | June–September
    |

    | Borjomi – Bakuriani – Vardzia | 290 km (loop) | 6 h | Crossover, 130 ₾ | Asphalt, rough at the end
    | All year |

    | Tbilisi – Ambrolauri (Racha) | 330 km | 6 h | Crossover, 130 ₾ | Narrow asphalt | June–October |

    | Pshaveli – Omalo (Tusheti) | 70 km | 4–5 h | Off-road 4x4, 240 ₾ | Gravel | June–October |


    ### 1. Tbilisi – Kazbegi (Stepantsminda)


    The Georgian Military Road past Ananuri, the Zhinvali reservoir and Gudauri. 155 km and three hours
    without stops — realistically a full day with them. The asphalt is good the whole way, but the switchbacks
    above Gudauri reward an experienced driver. **Tip:** the last dependable petrol station is in Pasanauri;
    beyond Gudauri your options thin out fast. The final 6 km up to Gergeti Trinity Church is a steep
    dirt track — a crossover manages it dry, but after rain it is a 4x4 job only.


    ### 2. The Kakheti wine loop


    Tbilisi – Signagi – Tsnori – Telavi – Gombori Pass – Tbilisi. Around 250 km and five to six hours
    at the wheel, best spread over two days. It is asphalt throughout and economy class is entirely sufficient.
    **Tip:** during the September harvest every cellar offers a tasting to everyone in the car. Decide
    who drives before you arrive — Georgia enforces a very low blood-alcohol limit and checks are frequent
    in Kakheti at that time of year. A second named driver costs 20 GEL per day.


    ### 3. Tbilisi – Batumi along the Black Sea


    370 km on the E60 through Gori, Khashuri, the new Rikoti expressway, Kutaisi, Samtredia and Kobuleti.
    Five hours. This is the best road in the country, and it is where business class earns its rate: sound
    insulation and adaptive cruise control genuinely reduce fatigue over that distance. **Tip:** leave
    Tbilisi before 07:00 — an hour later adds about 40 minutes just to reach Khashuri. You do not have
    to drive back either; a one-way rental starts at 100 GEL.


    ### 4. Svaneti and Mestia


    470 km from Tbilisi to Mestia via Zugdidi, eight to nine hours. It can be done in one push, but an
    overnight stop in Kutaisi or Zugdidi makes far more sense. The road to Mestia is paved and any category
    will do. **The 45 km stretch on to Ushguli is gravel and is permitted only in the off-road 4x4 category**
    — damage taken there in any other car is not covered by the insurance. **Tip:** Mestia to Ushguli
    takes two hours each way, so a 09:00 start is not optional if you want to be back before dark.


    ### 5. Borjomi – Bakuriani – Vardzia


    Tbilisi to Borjomi is 160 km (2.5 h), Borjomi to Bakuriani a 30 km climb of switchbacks (45 min),
    and Borjomi to Vardzia 100 km through Akhaltsikhe and Aspindza (2 h). This is the one route that works
    just as well in winter, since Bakuriani is a ski resort. **Tip:** the Vardzia cave complex closes
    at 17:00, so treat Akhaltsikhe as a fuel stop on the way out and save Rabati Fortress for the return
    leg.


    ### 6. Racha and Ambrolauri


    Tbilisi – Khashuri – Zestaponi – Ambrolauri, roughly 330 km and six hours. The last 60 km are narrow
    asphalt cut into the rock, where passing an oncoming car takes real attention — which is why a crossover
    beats a saloon here. **Tip:** past Ambrolauri, towards Shovi and Ghebi, petrol stations effectively
    disappear. Fill up in Ambrolauri. The Khvanchkara cellars expect you to book ahead.


    ### 7. Tusheti and the Abano Pass


    It is only 70 km from Pshaveli to Omalo, and it takes four to five hours: gravel, one car wide, over
    a pass at 2,850 m. **The Abano Pass is open roughly from June to October, requires an off-road 4x4,
    prior written agreement with us and carries an additional 500 GEL excess.** **Tip:** there is no fuel
    station in Tusheti, so go up with a full tank, and set off before noon so the descent does not catch
    you in the dark.


    ## Matching the category to the route


    - **Economy class (75 ₾)** — Kakheti, Borjomi, Kvemo Kartli, any intercity asphalt.

    - **Crossover / SUV (130 ₾)** — Kazbegi, Racha, Svaneti as far as Mestia, family trips with luggage.

    - **Off-road 4x4 (240 ₾)** — Ushguli, Tusheti, Shatili, anything unpaved.

    - **Minivan (200 ₾)** — a group of six to eight travelling one route together.


    Full specifications are on the [fleet page](/fleet/), and rates with extras are in the [price list](/pricing/).


    ## Five practical rules


    1. Do not plan more than 300 km a day. On mountain roads your average is 45 km/h, not 90.

    2. Refuel at half a tank, not at the warning light.

    3. Tyres and wheels are not covered by CDW — treat potholes with respect.

    4. Check road status and avalanche warnings before departure, especially around Gudauri.

    5. Changing your plan is easy: call us from the [contact page](/contact/) and we will swap the category
    if you decide to add a gravel section.


    More on seasonal restrictions and route rules is on the [FAQ page](/faq/).
ru:
  title: 7 лучших автомобильных маршрутов по Грузии
  desc: >-
    Казбеги, Кахетия, Батуми, Сванетия, Вардзиа, Рача и Тушетия: расстояние, время в пути, нужная категория
    авто, покрытие дороги и лучший сезон для каждого маршрута.
  keywords: >-
    маршруты по Грузии на машине, road trip georgia, Тбилиси Казбеги на авто, винный маршрут Кахетия,
    Сванетия на машине, Тушетия 4x4, аренда авто в Грузии
  lead: >-
    Главные достопримечательности Грузии разбросаны на 100–500 км друг от друга, и на общественном транспорте
    их объезд занимает не часы, а дни. Ниже семь маршрутов с реальными расстояниями, честным временем
    в пути и категорией автомобиля, которая действительно нужна.
  body: >
    ## Почему машина меняет арифметику


    Грузия компактна: из Тбилиси до любого крупного региона можно добраться за день. Сложность никогда
    не в трассе, а в последних 5–20 км — именно там стоят монастырь, крепость или винный марани, и туда
    маршрутка не идёт. Автомобиль покупает вам именно этот съезд с трассы, поэтому за ту же неделю вы
    увидите в два-три раза больше.


    Пробег по территории Грузии не ограничен на всех наших тарифах, так что день на 400 км стоит столько
    же, сколько день на 40 км. Топливо оплачивает арендатор по принципу «полный → полный».


    ## Все семь маршрутов одной таблицей


    | Маршрут | Расстояние (в одну сторону) | Время в пути | Категория | Покрытие | Сезон |

    |---|---|---|---|---|---|

    | Тбилиси – Казбеги | 155 км | 3 ч | Кроссовер, 130 ₾ | Асфальт | май–октябрь |

    | Винное кольцо Кахетии | 250 км (кольцо) | 5–6 ч | Эконом, 75 ₾ | Асфальт | сентябрь–октябрь |

    | Тбилиси – Батуми | 370 км | 5 ч | Бизнес-класс, 210 ₾ | Автомагистраль | круглый год |

    | Тбилиси – Местиа | 470 км | 8–9 ч | Кроссовер / 4x4 | Асфальт (до Ушгули грунт) | июнь–сентябрь
    |

    | Боржоми – Бакуриани – Вардзиа | 290 км (кольцо) | 6 ч | Кроссовер, 130 ₾ | Асфальт, в конце разбитый
    | круглый год |

    | Тбилиси – Амбролаури (Рача) | 330 км | 6 ч | Кроссовер, 130 ₾ | Узкий асфальт | июнь–октябрь |

    | Пшавели – Омало (Тушетия) | 70 км | 4–5 ч | Внедорожник 4x4, 240 ₾ | Грунт | июнь–октябрь |


    ### 1. Тбилиси – Казбеги (Степанцминда)


    Военно-Грузинская дорога мимо Ананури, Жинвальского водохранилища и Гудаури. 155 км и три часа без
    остановок — на практике полный день. Асфальт хороший до конца, но серпантин над Гудаури требует опыта.
    **Совет:** последняя надёжная заправка — в Пасанаури, после Гудаури выбор резко сокращается. Последние
    6 км к церкви Гергети — крутой грунт: в сухую погоду кроссовер поднимется, после дождя — только 4x4.


    ### 2. Винное кольцо Кахетии


    Тбилиси – Сигнахи – Цнори – Телави – Гомборский перевал – Тбилиси. Около 250 км и пять-шесть часов
    за рулём, лучше разложить на два дня. Асфальт везде, эконом-класса более чем достаточно. **Совет:**
    в сентябрьский ртвели дегустацию предлагают всем, кто вышел из машины. Решите заранее, кто ведёт:
    допустимый уровень алкоголя в Грузии крайне низкий, а проверки в Кахетии в это время частые. Второй
    водитель в договоре — 20 лари в сутки.


    ### 3. Тбилиси – Батуми к Чёрному морю


    370 км по трассе E60 через Гори, Хашури, новую магистраль Рикоти, Кутаиси, Самтредиа и Кобулети. Пять
    часов. Это лучшая дорога в стране, и именно здесь бизнес-класс отрабатывает свой тариф: шумоизоляция
    и адаптивный круиз-контроль реально снижают усталость на такой дистанции. **Совет:** выезжайте из
    Тбилиси до 07:00 — час промедления добавляет около 40 минут только до Хашури. Возвращаться своим ходом
    необязательно: аренда в одну сторону стоит от 100 лари.


    ### 4. Сванетия и Местиа


    От Тбилиси до Местиа 470 км через Зугдиди, восемь-девять часов. Можно проехать за раз, но ночёвка
    в Кутаиси или Зугдиди намного разумнее. До Местиа асфальт, подойдёт любая категория. **Участок в 45
    км до Ушгули — грунтовый и разрешён только на внедорожниках 4x4:** повреждения, полученные там на
    другой категории, страховкой не покрываются. **Совет:** Местиа – Ушгули занимает два часа в одну сторону,
    поэтому старт в 09:00 обязателен, если хотите вернуться засветло.


    ### 5. Боржоми – Бакуриани – Вардзиа


    От Тбилиси до Боржоми 160 км (2,5 ч), от Боржоми до Бакуриани 30 км серпантина (45 минут), от Боржоми
    до Вардзиа 100 км через Ахалцихе и Аспиндзу (2 ч). Единственный маршрут, который полноценно работает
    и зимой: Бакуриани — горнолыжный курорт. **Совет:** пещерный комплекс Вардзиа закрывается в 17:00,
    поэтому в Ахалцихе планируйте только заправку, а крепость Рабати оставьте на обратный путь.


    ### 6. Рача и Амбролаури


    Тбилиси – Хашури – Зестафони – Амбролаури, примерно 330 км и шесть часов. Последние 60 км — узкий
    асфальт, вырубленный в скале, где разъезд со встречной машиной требует внимания; поэтому кроссовер
    здесь лучше седана. **Совет:** после Амбролаури, в сторону Шови и Геби, заправки практически исчезают
    — полный бак наливайте в Амбролаури. В марани Хванчкары стоит записаться заранее.


    ### 7. Тушетия и перевал Абано


    От Пшавели до Омало всего 70 км, а времени уходит четыре-пять часов: грунт шириной в один автомобиль,
    перевал на высоте 2 850 м. **Перевал Абано открыт примерно с июня по октябрь, требует внедорожника
    4x4, предварительного письменного согласования и дополнительной франшизы 500 лари.** **Совет:** заправок
    в Тушетии нет — поднимайтесь с полным баком и выезжайте до полудня, чтобы спуск не пришёлся на темноту.


    ## Какая категория под какой маршрут


    - **Эконом-класс (75 ₾)** — Кахетия, Боржоми, Квемо Картли, любой межгород по асфальту.

    - **Кроссовер / SUV (130 ₾)** — Казбеги, Рача, Сванетия до Местиа, семейная поездка с багажом.

    - **Внедорожник 4x4 (240 ₾)** — Ушгули, Тушетия, Шатили, любой грунт.

    - **Минивэн (200 ₾)** — группа из шести-восьми человек на одном маршруте.


    Полные характеристики — [на странице автопарка](/fleet/), тарифы и дополнительные услуги — [в таблице
    цен](/pricing/).


    ## Пять практических правил


    1. Не планируйте больше 300 км в день: в горах средняя скорость 45 км/ч, а не 90.

    2. Заправляйтесь на половине бака, а не на лампочке.

    3. Шины и диски страховкой CDW не покрываются — с ямами обращайтесь уважительно.

    4. Перед выездом проверяйте статус дороги и лавинную опасность, особенно в районе Гудаури.

    5. Планы меняются легко: позвоните нам [со страницы контактов](/contact/), и мы поменяем категорию,
    если вы решили добавить грунтовый участок.


    Больше о сезонных ограничениях и правилах на маршрутах — [на странице FAQ](/faq/).
fa:
  title: 7 مسیر برتر سفر جاده‌ای در گرجستان با خودرو
  desc: >-
    کازبگی، کاختی، باتومی، سوانتی، واردزیا، راچا و توشتی — مسافت، زمان رانندگی، دسته خودروی لازم برای
    هر مسیر، نوع جاده و بهترین فصل سفر.
  keywords: >-
    اجاره خودرو در گرجستان, سفر جاده‌ای گرجستان, تفلیس به کازبگی با ماشین, مسیر شراب کاختی, سوانتی با
    خودرو, توشتی 4x4, واردزیا, رانندگی در گرجستان
  lead: >-
    دیدنی‌های اصلی گرجستان 100 تا 500 کیلومتر از هم فاصله دارند و پیمودن‌شان با ون‌های خطی به‌جای چند
    ساعت، چند روز وقت می‌گیرد. در ادامه هفت مسیر با مسافت واقعی، زمان رانندگی صادقانه و دسته خودرویی که
    هر مسیر واقعاً می‌طلبد.
  body: >-
    ## چرا خودرو معادله را عوض می‌کند


    گرجستان کشوری فشرده است: از تفلیس می‌توان در یک روز به هر منطقه مهمی رسید. دشواری هیچ‌گاه بزرگراه
    نیست — 5 تا 20 کیلومتر آخر است، جایی که صومعه، قلعه یا سرداب شراب قرار دارد و هیچ وسیله عمومی به آنجا
    نمی‌رود. خودرو دقیقاً همین انحراف از مسیر را برایتان می‌خرد و برای همین است که یک هفته یکسان، دو تا
    سه برابر توقف بیشتر به دست می‌دهد.


    کیلومتر در داخل گرجستان در تمام تعرفه‌های ما نامحدود است، بنابراین یک روز 400 کیلومتری بیش از یک روز
    40 کیلومتری هزینه ندارد. سوخت با قاعده «پر تحویل، پر تحویل» بر عهده مستأجر است.


    ## هفت مسیر در یک نگاه


    | مسیر | مسافت (یک‌طرفه) | زمان رانندگی | دسته | نوع جاده | بهترین فصل |

    |---|---|---|---|---|---|

    | تفلیس – کازبگی | 155 کیلومتر | 3 ساعت | کراس‌اوور، 130 ₾ | آسفالت | مه–اکتبر |

    | حلقه شراب کاختی | 250 کیلومتر (حلقه) | 5–6 ساعت | اقتصادی، 75 ₾ | آسفالت | سپتامبر–اکتبر |

    | تفلیس – باتومی | 370 کیلومتر | 5 ساعت | بیزنس، 210 ₾ | بزرگراه | تمام سال |

    | تفلیس – مستیا | 470 کیلومتر | 8–9 ساعت | کراس‌اوور / 4x4 | آسفالت (تا اوشگولی خاکی) | ژوئن–سپتامبر
    |

    | بورجومی – باکوریانی – واردزیا | 290 کیلومتر (حلقه) | 6 ساعت | کراس‌اوور، 130 ₾ | آسفالت، انتهای
    ناهموار | تمام سال |

    | تفلیس – آمبرولائوری (راچا) | 330 کیلومتر | 6 ساعت | کراس‌اوور، 130 ₾ | آسفالت باریک | ژوئن–اکتبر
    |

    | پشاولی – اومالو (توشتی) | 70 کیلومتر | 4–5 ساعت | آفرود 4x4، 240 ₾ | خاکی | ژوئن–اکتبر |


    ### 1. تفلیس – کازبگی (استپان‌تسمیندا)


    جاده نظامی گرجستان از کنار آنانوری، دریاچه سد ژینوالی و گودائوری می‌گذرد. 155 کیلومتر و سه ساعت بدون
    توقف — که با توقف‌ها واقع‌بینانه یک روز کامل می‌شود. آسفالت تا آخر خوب است، اما پیچ‌های بالای گودائوری
    راننده باتجربه می‌طلبد. **نکته:** آخرین پمپ بنزین قابل اتکا در پاساناوری است؛ پس از گودائوری گزینه‌ها
    به‌سرعت کم می‌شوند. 6 کیلومتر آخر تا کلیسای تثلیث گرگتی خاکی و پرشیب است — در هوای خشک یک کراس‌اوور
    از پس آن برمی‌آید، اما پس از باران فقط کار 4x4 است.


    ### 2. حلقه شراب کاختی


    تفلیس – سیغناغی – تسنوری – تلاوی – گردنه گومبوری – تفلیس. حدود 250 کیلومتر و پنج تا شش ساعت پشت فرمان،
    که بهتر است در دو روز پخش شود. تمام مسیر آسفالت است و کلاس اقتصادی کاملاً کافی است. **نکته:** در برداشت
    سپتامبر هر سرداب به همه سرنشینان خودرو مزه‌گیری تعارف می‌کند. پیش از رسیدن تصمیم بگیرید چه کسی رانندگی
    می‌کند — گرجستان حد الکل خون بسیار پایینی را اجرا می‌کند و در آن فصل کنترل‌ها در کاختی زیاد است. افزودن
    راننده دوم روزی 20 لاری هزینه دارد.


    ### 3. تفلیس – باتومی در امتداد دریای سیاه


    370 کیلومتر روی E60 از گوری، خاشوری، بزرگراه جدید ریکوتی، کوتایسی، سامتردیا و کوبولتی. پنج ساعت. این
    بهترین جاده کشور است و همان جایی است که کلاس بیزنس نرخش را توجیه می‌کند: عایق صدا و کروز کنترل تطبیقی
    در این مسافت واقعاً خستگی را کم می‌کنند. **نکته:** پیش از ساعت 07:00 از تفلیس بیرون بزنید — یک ساعت
    دیرتر تنها برای رسیدن به خاشوری حدود 40 دقیقه اضافه می‌کند. لازم هم نیست با خودرو برگردید؛ اجاره یک‌طرفه
    از 100 لاری شروع می‌شود.


    ### 4. سوانتی و مستیا


    470 کیلومتر از تفلیس تا مستیا از راه زوگدیدی، هشت تا نُه ساعت. می‌توان یک‌نفس رفت، اما توقف شبانه
    در کوتایسی یا زوگدیدی بسیار منطقی‌تر است. جاده مستیا آسفالت است و هر دسته‌ای از پس آن برمی‌آید. **45
    کیلومتر ادامه مسیر تا اوشگولی خاکی است و تنها در دسته آفرود 4x4 مجاز است** — خسارت واردشده در آنجا
    با هر خودروی دیگری تحت پوشش بیمه نیست. **نکته:** مستیا تا اوشگولی هر طرف دو ساعت وقت می‌برد، پس اگر
    می‌خواهید پیش از تاریکی برگردید، حرکت ساعت 09:00 اختیاری نیست.


    ### 5. بورجومی – باکوریانی – واردزیا


    تفلیس تا بورجومی 160 کیلومتر است (2.5 ساعت)، بورجومی تا باکوریانی 30 کیلومتر سربالایی پرپیچ (45 دقیقه)،
    و بورجومی تا واردزیا 100 کیلومتر از راه آخالتسیخه و آسپیندزا (2 ساعت). این تنها مسیری است که در زمستان
    هم به همان خوبی کار می‌کند، چون باکوریانی پیست اسکی است. **نکته:** مجموعه غارهای واردزیا ساعت 17:00
    بسته می‌شود، پس آخالتسیخه را در راه رفت فقط برای سوخت‌گیری در نظر بگیرید و قلعه راباتی را برای بازگشت
    نگه دارید.


    ### 6. راچا و آمبرولائوری


    تفلیس – خاشوری – زستافونی – آمبرولائوری، تقریباً 330 کیلومتر و شش ساعت. 60 کیلومتر آخر آسفالت باریکی
    است که در دل صخره بریده شده و گذشتن از کنار خودروی روبه‌رو دقت واقعی می‌خواهد — به همین دلیل اینجا
    کراس‌اوور از سدان بهتر است. **نکته:** پس از آمبرولائوری، در مسیر شووی و غبی، پمپ بنزین عملاً ناپدید
    می‌شود. در آمبرولائوری باک را پر کنید. سردابه‌های خوانچکارا انتظار دارند از پیش هماهنگ کنید.


    ### 7. توشتی و گردنه آبانو


    از پشاولی تا اومالو تنها 70 کیلومتر است و چهار تا پنج ساعت طول می‌کشد: خاکی، به عرض یک خودرو، از گردنه‌ای
    در ارتفاع 2,850 متر. **گردنه آبانو تقریباً از ژوئن تا اکتبر باز است، خودروی آفرود 4x4، توافق کتبی
    پیشین با ما و فرانشیز اضافی 500 لاری می‌خواهد.** **نکته:** در توشتی پمپ بنزین وجود ندارد، پس با باک
    پر بالا بروید و پیش از ظهر راه بیفتید تا سرازیری در تاریکی گیرتان نیندازد.


    ## تطبیق دسته خودرو با مسیر


    - **کلاس اقتصادی (75 ₾)** — کاختی، بورجومی، کومو کارتلی و هر آسفالت بین‌شهری.

    - **کراس‌اوور / شاسی‌بلند (130 ₾)** — کازبگی، راچا، سوانتی تا مستیا، سفر خانوادگی با بار.

    - **آفرود 4x4 (240 ₾)** — اوشگولی، توشتی، شاتیلی و هر جاده بی‌آسفالت.

    - **ون (200 ₾)** — گروهی شش تا هشت‌نفره که یک مسیر را با هم می‌روند.


    مشخصات کامل در [صفحه ناوگان](/fleet/) و نرخ‌ها همراه با خدمات جانبی در [فهرست قیمت](/pricing/) آمده
    است.


    ## پنج قاعده عملی


    1. بیش از 300 کیلومتر در روز برنامه‌ریزی نکنید. در جاده کوهستانی میانگین شما 45 کیلومتر بر ساعت است،
    نه 90.

    2. در نیمه باک سوخت بگیرید، نه با روشن شدن چراغ هشدار.

    3. لاستیک و رینگ زیر پوشش CDW نیستند — با چاله‌ها با احتیاط رفتار کنید.

    4. پیش از حرکت وضعیت جاده و هشدار بهمن را بررسی کنید، به‌ویژه در محدوده گودائوری.

    5. تغییر برنامه آسان است: از [صفحه تماس](/contact/) با ما تماس بگیرید و اگر تصمیم گرفتید بخشی خاکی
    اضافه کنید، دسته خودرو را عوض می‌کنیم.


    درباره محدودیت‌های فصلی و قواعد مسیرها در [صفحه پرسش‌های متداول](/faq/) بیشتر بخوانید.
he:
  title: 7 מסלולי הטיול הטובים ביותר בגאורגיה ברכב
  desc: >-
    קזבגי, קחתי, בטומי, סוואנטי, ורדזיה, ראצ'ה ותושתי — מרחק, זמן נהיגה, קטגוריית הרכב הנדרשת לכל מסלול,
    סוג הדרך והעונה הטובה ביותר.
  keywords: >-
    טיול רכב בגאורגיה, השכרת רכב בגאורגיה, טביליסי קזבגי ברכב, מסלול היין בקחתי, סוואנטי ברכב, תושתי 4x4,
    ורדזיה, נהיגה בגאורגיה
  lead: >-
    האתרים המרכזיים של גאורגיה מרוחקים זה מזה 100 עד 500 ק"מ, ולכסות אותם במרשרוטקות לוקח ימים ולא שעות.
    לפניכם שבעה מסלולים עם מרחקים אמיתיים, זמני נהיגה כנים וקטגוריית הרכב שכל אחד מהם באמת דורש.
  body: >-
    ## למה מכונית משנה את החשבון


    גאורגיה היא מדינה קומפקטית: מטביליסי אפשר להגיע לכל אזור מרכזי בתוך יום. הקושי אף פעם אינו הכביש הראשי
    — הוא 5 עד 20 הקילומטרים האחרונים, שם נמצאים המנזר, המבצר או מרתף היין, ולשם לא מגיעה תחבורה ציבורית.
    בדיוק את הסטייה הזאת המכונית קונה לכם, ולכן אותו שבוע עצמו מניב פי שניים או שלושה עצירות.


    הקילומטראז' בתוך גאורגיה אינו מוגבל באף אחד מהתעריפים שלנו, כך שיום של 400 ק"מ אינו עולה יותר מיום
    של 40 ק"מ. הדלק על חשבון השוכר לפי מדיניות מלא–מלא.


    ## כל שבעת המסלולים במבט אחד


    | מסלול | מרחק (כיוון אחד) | זמן נהיגה | קטגוריה | סוג הדרך | העונה הטובה |

    |---|---|---|---|---|---|

    | טביליסי – קזבגי | 155 ק"מ | 3 שעות | קרוסאובר, 130 ₾ | אספלט | מאי–אוקטובר |

    | טבעת היין של קחתי | 250 ק"מ (טבעת) | 5–6 שעות | אקונומי, 75 ₾ | אספלט | ספטמבר–אוקטובר |

    | טביליסי – בטומי | 370 ק"מ | 5 שעות | עסקים, 210 ₾ | כביש מהיר | כל השנה |

    | טביליסי – מסטיה | 470 ק"מ | 8–9 שעות | קרוסאובר / 4x4 | אספלט (חצץ עד אושגולי) | יוני–ספטמבר |

    | בורג'ומי – בקוריאני – ורדזיה | 290 ק"מ (טבעת) | 6 שעות | קרוסאובר, 130 ₾ | אספלט, מחוספס בסוף |
    כל השנה |

    | טביליסי – אמברולאורי (ראצ'ה) | 330 ק"מ | 6 שעות | קרוסאובר, 130 ₾ | אספלט צר | יוני–אוקטובר |

    | פשאבלי – אומאלו (תושתי) | 70 ק"מ | 4–5 שעות | רכב שטח 4x4, 240 ₾ | חצץ | יוני–אוקטובר |


    ### 1. טביליסי – קזבגי (סטפנצמינדה)


    כביש הצבא הגאורגי חולף על פני אנאנורי, מאגר ז'ינוואלי וגודאורי. 155 ק"מ ושלוש שעות ללא עצירות — ועם
    עצירות זהו יום שלם. האספלט טוב לכל האורך, אך הסרפנטינות מעל גודאורי מתגמלות נהג מנוסה. **טיפ:** תחנת
    הדלק האמינה האחרונה היא בפסנאורי; אחרי גודאורי האפשרויות מידלדלות במהירות. ששת הקילומטרים האחרונים
    אל כנסיית השילוש בגרגטי הם דרך עפר תלולה — קרוסאובר מתמודד איתה כשהיא יבשה, אבל אחרי גשם זו עבודה
    ל-4x4 בלבד.


    ### 2. טבעת היין של קחתי


    טביליסי – סיגנאגי – צנורי – תלאבי – מעבר גומבורי – טביליסי. כ-250 ק"מ וחמש עד שש שעות נהיגה, ועדיף
    לפרוס אותן על יומיים. הדרך אספלט לכל אורכה ומחלקת אקונומי מספיקה לחלוטין. **טיפ:** בבציר של ספטמבר
    כל מרתף מציע טעימה לכל מי שיושב במכונית. החליטו מי נוהג עוד לפני שאתם מגיעים — גאורגיה אוכפת סף אלכוהול
    נמוך מאוד בדם, והביקורות בקחתי תכופות בעונה הזאת. נהג נוסף רשום עולה 20 לארי ליום.


    ### 3. טביליסי – בטומי לאורך הים השחור


    370 ק"מ בכביש E60 דרך גורי, חשורי, הכביש המהיר החדש של ריקוטי, קוטאיסי, סמטרედיה וקובולטי. חמש שעות.
    זהו הכביש הטוב במדינה, וכאן מחלקת העסקים מצדיקה את מחירה: בידוד אקוסטי ובקרת שיוט אדפטיבית באמת מפחיתים
    עייפות במרחק כזה. **טיפ:** צאו מטביליסי לפני 07:00 — שעה מאוחר יותר מוסיפה כ-40 דקות רק כדי להגיע
    לחשורי. גם לא חייבים לנהוג חזרה; השכרה בכיוון אחד מתחילה ב-100 לארי.


    ### 4. סוואנטי ומסטיה


    470 ק"מ מטביליסי למסטיה דרך זוגדידי, שמונה עד תשע שעות. אפשר לעשות זאת ברצף אחד, אבל לינה בקוטאיסי
    או בזוגדידי הגיונית הרבה יותר. הכביש למסטיה סלול וכל קטגוריה תתאים. **קטע 45 הק"מ שממשיך לאושגולי
    הוא חצץ ומותר רק בקטגוריית השטח 4x4** — נזק שנגרם שם בכל רכב אחר אינו מכוסה בביטוח. **טיפ:** ממסטיה
    לאושגולי לוקח שעתיים לכל כיוון, ולכן יציאה ב-09:00 אינה בגדר המלצה אם אתם רוצים לחזור לפני רדת החשכה.


    ### 5. בורג'ומי – בקוריאני – ורדזיה


    מטביליסי לבורג'ומי 160 ק"מ (2.5 שעות), מבורג'ומי לבקוריאני טיפוס של 30 ק"מ בסרפנטינות (45 דקות), ומבורג'ומי
    לורדזיה 100 ק"מ דרך אחלציחה ואספינדזה (2 שעות). זהו המסלול היחיד שעובד באותה מידה גם בחורף, משום שבקוריאני
    היא אתר סקי. **טיפ:** מתחם המערות של ורדזיה נסגר ב-17:00, אז התייחסו לאחלציחה כאל עצירת דלק בדרך החוצה
    ושמרו את מבצר רבאטי לדרך חזרה.


    ### 6. ראצ'ה ואמברולאורי


    טביליסי – חשורי – זסטפוני – אמברולאורי, כ-330 ק"מ ושש שעות. 60 הק"מ האחרונים הם אספלט צר חצוב בסלע,
    שבו חצייה מול רכב ממול דורשת תשומת לב אמיתית — ולכן קרוסאובר עדיף כאן על סדאן. **טיפ:** אחרי אמברולאורי,
    בכיוון שובי וגבי, תחנות הדלק נעלמות למעשה. מלאו דלק באמברולאורי. מרתפי חוונצ'קרה מצפים שתזמינו מראש.


    ### 7. תושתי ומעבר אבאנו


    מפשאבלי לאומאלו יש 70 ק"מ בלבד, והם לוקחים ארבע עד חמש שעות: חצץ ברוחב מכונית אחת, מעל מעבר בגובה
    2,850 מ'. **מעבר אבאנו פתוח בערך מיוני עד אוקטובר, מחייב רכב שטח 4x4, הסכמה בכתב מראש מולנו ונושא
    השתתפות עצמית נוספת של 500 לארי.** **טיפ:** בתושתי אין תחנת דלק, לכן עלו עם מיכל מלא, וצאו לדרך לפני
    הצהריים כדי שהירידה לא תתפוס אתכם בחשכה.


    ## התאמת הקטגוריה למסלול


    - **מחלקת אקונומי (75 ₾)** — קחתי, בורג'ומי, קוומו קרתלי וכל אספלט בין-עירוני.

    - **קרוסאובר / רכב פנאי (130 ₾)** — קזבגי, ראצ'ה, סוואנטי עד מסטיה, טיולי משפחה עם מטען.

    - **רכב שטח 4x4 (240 ₾)** — אושגולי, תושתי, שאטילי וכל דרך לא סלולה.

    - **מיניוואן (200 ₾)** — קבוצה של שישה עד שמונה שנוסעת יחד במסלול אחד.


    המפרטים המלאים מופיעים בעמוד [צי הרכב](/fleet/), והתעריפים על כל התוספות בעמוד [מחירים](/pricing/).


    ## חמישה כללים מעשיים


    1. אל תתכננו יותר מ-300 ק"מ ליום. בדרכי הרים הממוצע שלכם הוא 45 קמ"ש, לא 90.

    2. תדלקו בחצי מיכל, לא כשנורית האזהרה נדלקת.

    3. צמיגים וחישוקים אינם מכוסים ב-CDW — התייחסו לבורות בכביש בכבוד.

    4. בדקו את מצב הדרכים ואזהרות מפולות לפני היציאה, במיוחד באזור גודאורי.

    5. לשנות תוכנית זה קל: התקשרו אלינו דרך [עמוד יצירת הקשר](/contact/) ונחליף את הקטגוריה אם החלטתם
    להוסיף קטע חצץ.


    עוד על הגבלות עונתיות וכללי מסלולים בעמוד [שאלות נפוצות](/faq/).
ar:
  title: أفضل 7 مسارات لرحلة برية في جورجيا بالسيارة
  desc: >-
    كازبيغي وكاخيتي وباتومي وسفانيتي وفاردزيا وراتشا وتوشيتي — المسافة وزمن القيادة وفئة السيارة اللازمة
    لكل مسار ونوع الطريق وأفضل موسم.
  keywords: >-
    رحلة برية في جورجيا, تأجير سيارات في جورجيا, من تبليسي إلى كازبيغي بالسيارة, طريق النبيذ في كاخيتي,
    سفانيتي بالسيارة, توشيتي 4x4, فاردزيا, القيادة في جورجيا
  lead: >-
    تفصل بين أبرز معالم جورجيا مسافات تتراوح بين 100 و500 كم، وقطعها بالحافلات الصغيرة يستغرق أياماً لا
    ساعات. إليك سبعة مسارات بمسافات حقيقية وأزمنة قيادة صادقة وفئة السيارة التي يتطلبها كل مسار فعلاً.
  body: >-
    ## لماذا تغيّر السيارة الحسبة


    جورجيا بلد مضغوط: من تبليسي يمكنك بلوغ أي إقليم رئيسي خلال يوم واحد. والصعوبة ليست في الطريق السريع
    أبداً — بل في آخر 5 إلى 20 كم، حيث يقع الدير أو القلعة أو قبو النبيذ، ولا تصل إليها أي وسيلة نقل عام.
    هذا الانعطاف تحديداً هو ما تشتريه لك السيارة، ولهذا يمنحك الأسبوع نفسه ضعفي أو ثلاثة أضعاف عدد المحطات.


    المسافة المقطوعة داخل جورجيا غير محدودة في جميع تعرفاتنا، فيوم من 400 كم لا يكلف أكثر من يوم من 40
    كم. أما الوقود فعلى المستأجر وفق سياسة «ممتلئ إلى ممتلئ».


    ## المسارات السبعة في لمحة


    | المسار | المسافة (اتجاه واحد) | زمن القيادة | الفئة | نوع الطريق | أفضل موسم |

    |---|---|---|---|---|---|

    | تبليسي – كازبيغي | 155 كم | 3 ساعات | كروس أوفر، 130 ₾ | أسفلت | مايو–أكتوبر |

    | حلقة النبيذ في كاخيتي | 250 كم (حلقة) | 5–6 ساعات | اقتصادية، 75 ₾ | أسفلت | سبتمبر–أكتوبر |

    | تبليسي – باتومي | 370 كم | 5 ساعات | رجال أعمال، 210 ₾ | طريق سريع | طوال العام |

    | تبليسي – ميستيا | 470 كم | 8–9 ساعات | كروس أوفر / 4x4 | أسفلت (ترابي حتى أوشغولي) | يونيو–سبتمبر
    |

    | بورجومي – باكورياني – فاردزيا | 290 كم (حلقة) | 6 ساعات | كروس أوفر، 130 ₾ | أسفلت، وعر في نهايته
    | طوال العام |

    | تبليسي – أمبرولاوري (راتشا) | 330 كم | 6 ساعات | كروس أوفر، 130 ₾ | أسفلت ضيق | يونيو–أكتوبر |

    | بشافيلي – أومالو (توشيتي) | 70 كم | 4–5 ساعات | طرق وعرة 4x4، 240 ₾ | ترابي | يونيو–أكتوبر |


    ### 1. تبليسي – كازبيغي (ستيبانتسميندا)


    الطريق العسكري الجورجي مروراً بأنانوري وبحيرة سد جينفالي وغودواري. 155 كم وثلاث ساعات دون توقف — ومع
    التوقفات يصبح يوماً كاملاً واقعياً. الأسفلت جيد طوال الطريق، لكن المنعطفات فوق غودواري تكافئ السائق
    المتمرس. **نصيحة:** آخر محطة وقود يعوَّل عليها في باساناوري؛ وبعد غودواري تتقلص الخيارات بسرعة. أما
    آخر 6 كم صعوداً إلى كنيسة الثالوث في غيرغيتي فدرب ترابي شديد الانحدار — تتدبره سيارة كروس أوفر وهو
    جاف، لكنه بعد المطر مهمة لسيارات 4x4 وحدها.


    ### 2. حلقة النبيذ في كاخيتي


    تبليسي – سيغناغي – تسنوري – تيلافي – ممر غومبوري – تبليسي. نحو 250 كم وخمس إلى ست ساعات خلف المقود،
    والأفضل توزيعها على يومين. الطريق معبد بالكامل والفئة الاقتصادية كافية تماماً. **نصيحة:** في موسم
    القطاف في سبتمبر يقدّم كل قبو تذوقاً لكل من في السيارة. احسم مَن سيقود قبل الوصول — فجورجيا تطبّق
    حداً منخفضاً جداً للكحول في الدم، وتكثر نقاط التفتيش في كاخيتي في هذا الوقت من السنة. وإضافة سائق
    ثانٍ مسجّل تكلف 20 لاري في اليوم.


    ### 3. تبليسي – باتومي على ساحل البحر الأسود


    370 كم على الطريق E60 عبر غوري وخاشوري وطريق ريكوتي السريع الجديد وكوتايسي وسامتريديا وكوبوليتي. خمس
    ساعات. هذا أفضل طريق في البلاد، وهنا تستحق فئة رجال الأعمال سعرها: العزل الصوتي ومثبّت السرعة التكيّفي
    يقللان الإرهاق فعلاً على مسافة كهذه. **نصيحة:** غادر تبليسي قبل الساعة 07:00 — فساعة تأخير تضيف نحو
    40 دقيقة لمجرد بلوغ خاشوري. ولست مضطراً للعودة بالقيادة أيضاً؛ فالاستئجار باتجاه واحد يبدأ من 100
    لاري.


    ### 4. سفانيتي وميستيا


    470 كم من تبليسي إلى ميستيا عبر زوغديدي، وثماني إلى تسع ساعات. يمكن قطعها دفعة واحدة، لكن المبيت في
    كوتايسي أو زوغديدي أكثر منطقية بكثير. الطريق إلى ميستيا معبد وأي فئة تفي بالغرض. **أما مقطع الـ 45
    كم المستمر إلى أوشغولي فترابي ولا يُسمح به إلا لفئة الطرق الوعرة 4x4** — والأضرار التي تقع هناك بأي
    سيارة أخرى لا يغطيها التأمين. **نصيحة:** تستغرق الرحلة من ميستيا إلى أوشغولي ساعتين في كل اتجاه، لذا
    فالانطلاق في الساعة 09:00 ليس خياراً إن أردت العودة قبل حلول الظلام.


    ### 5. بورجومي – باكورياني – فاردزيا


    من تبليسي إلى بورجومي 160 كم (2.5 ساعة)، ومن بورجومي إلى باكورياني صعود 30 كم من المنعطفات (45 دقيقة)،
    ومن بورجومي إلى فاردزيا 100 كم عبر أخالتسيخي وأسبيندزا (ساعتان). وهذا هو المسار الوحيد الذي ينجح في
    الشتاء بالقدر نفسه، لأن باكورياني منتجع تزلج. **نصيحة:** يغلق مجمع كهوف فاردزيا أبوابه عند 17:00،
    فاعتبر أخالتسيخي محطة وقود في طريق الذهاب واترك قلعة راباتي لرحلة العودة.


    ### 6. راتشا وأمبرولاوري


    تبليسي – خاشوري – زيستافوني – أمبرولاوري، نحو 330 كم وست ساعات. آخر 60 كم أسفلت ضيق محفور في الصخر،
    ويتطلب تجاوز سيارة قادمة انتباهاً حقيقياً — ولهذا تتفوق سيارة الكروس أوفر على السيدان هنا. **نصيحة:**
    بعد أمبرولاوري، في اتجاه شوفي وغيبي، تختفي محطات الوقود عملياً. املأ الخزان في أمبرولاوري. أما أقبية
    خفانتشكارا فتتوقع منك الحجز مسبقاً.


    ### 7. توشيتي وممر أبانو


    المسافة من بشافيلي إلى أومالو 70 كم فقط، وتستغرق أربع إلى خمس ساعات: طريق ترابي بعرض سيارة واحدة،
    فوق ممر على ارتفاع 2,850 م. **يُفتح ممر أبانو تقريباً من يونيو إلى أكتوبر، ويستلزم سيارة طرق وعرة
    4x4 وموافقة خطية مسبقة معنا، ويحمل تحمّلاً إضافياً قدره 500 لاري.** **نصيحة:** لا توجد محطة وقود في
    توشيتي، فاصعد بخزان ممتلئ، وانطلق قبل الظهر كي لا يفاجئك النزول في الظلام.


    ## مطابقة الفئة مع المسار


    - **الفئة الاقتصادية (75 ₾)** — كاخيتي، وبورجومي، وكفيمو كارتلي، وأي أسفلت بين المدن.

    - **كروس أوفر / دفع رباعي حضري (130 ₾)** — كازبيغي، وراتشا، وسفانيتي حتى ميستيا، والرحلات العائلية
    بالأمتعة.

    - **طرق وعرة 4x4 (240 ₾)** — أوشغولي، وتوشيتي، وشاتيلي، وكل ما هو غير معبّد.

    - **حافلة صغيرة (200 ₾)** — مجموعة من ستة إلى ثمانية يسافرون مساراً واحداً معاً.


    المواصفات الكاملة في [صفحة الأسطول](/fleet/)، والأسعار مع الإضافات في [قائمة الأسعار](/pricing/).


    ## خمس قواعد عملية


    1. لا تخطط لأكثر من 300 كم في اليوم. فعلى الطرق الجبلية يبلغ متوسطك 45 كم/س لا 90.

    2. عبّئ الوقود عند نصف الخزان، لا عند إضاءة لمبة التحذير.

    3. الإطارات والجنوط غير مشمولة بتأمين CDW — تعامل مع الحفر باحترام.

    4. تحقق من حالة الطرق وتحذيرات الانهيارات الثلجية قبل الانطلاق، وخصوصاً حول غودواري.

    5. تغيير الخطة سهل: اتصل بنا من [صفحة الاتصال](/contact/) وسنبدّل الفئة إن قررت إضافة مقطع ترابي.


    مزيد من التفاصيل عن القيود الموسمية وقواعد المسارات في [صفحة الأسئلة الشائعة](/faq/).
