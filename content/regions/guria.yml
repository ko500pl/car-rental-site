ka:
  name: გურია
  short: ჩაის პლანტაციები ზღვასა და მთას შორის — ურეკის მაგნიტური ქვიშა და ბახმაროს მაღალმთიანი კურორტი.
  body: >-
    გურია მცირე რეგიონია შავ ზღვასა და მესხეთის ქედს შორის და სწორედ ეს კონტრასტი განსაზღვრავს მას: სანაპიროდან
    ორ საათში ორი ათას მეტრზე ხვდები. კლიმატი სუბტროპიკულია, ჰაერი ნოტიო, ლანდშაფტი კი ჩაისა და თხილის
    პლანტაციებით, ბამბუკითა და ტყით არის დაფარული.


    სანაპიროზე ურეკია — შავი მაგნიტური ქვიშის პლაჟი, რომელიც საბჭოთა დროიდან სამკურნალო თვისებებით არის
    ცნობილი და დღემდე საოჯახო დასვენების ადგილად რჩება. ზაფხულში აქ ხალხმრავლობაა და წყალი ზუსტად ისეთივე
    თბილია, როგორც ქობულეთში. ცოტა ჩრდილოეთით შეკვეთილის კურორტია.


    შიგნით მხარე მშვიდდება და ტურისტული ნაკადი მკვეთრად თხელდება. ოზურგეთი ადმინისტრაციული ცენტრია, პატარა
    და უჩქარო; მის გვერდით შემოქმედის მონასტერი დგას — გურიის ერთ-ერთი მთავარი სასულიერო ძეგლი, რომელიც
    ოდესღაც ხატებისა და ჭედური ხელოვნების მდიდარი საცავი იყო. ნაბეღლავი მინერალური წყლის სოფელია მთისწინეთში.


    მთავარი მაღალმთიანი მიმართულება ბახმაროა: კურორტი დაახლოებით ორი ათას მეტრზე, ხის სახლებით და ცნობილი
    ცხენების დოღით აგვისტოში. ბახმარო მკაცრად სეზონურია — ივლისიდან სექტემბრამდე — და მისვლა მხოლოდ გრუნტოვანი
    გზით შეიძლება.


    გურია ისტორიულადაც საინტერესოა: აქ ჩაის კულტურა XIX საუკუნის ბოლოს დამკვიდრდა და პლანტაციების ნაწილი
    დღემდე მუშაობს, თხილი კი მხარის მთავარი საექსპორტო პროდუქტია. სოფლის სახლები ხისაა, აივნებით, და ბევრი
    მათგანი გზისპირზევე დგას.


    სეზონი მკაფიოა: სანაპიროზე ივნისიდან სექტემბრამდე, მთაში კი კიდევ უფრო ვიწრო ფანჯარაა — ივლისიდან
    სექტემბრამდე. ერთი-ორი დღე საკმარისია, თუ ბახმაროს არ გეგმავ; წინააღმდეგ შემთხვევაში მხოლოდ გზას სრული
    დღე დაუთმე.
  driving: >-
    სანაპირო მაგისტრალი ურეკისა და შეკვეთილის გავლით კარგი ასფალტია და ეკონომ კლასის მანქანა სავსებით
    საკმარისი. ზაფხულში, განსაკუთრებით შაბათ-კვირას, ეს გზა დატვირთულია და პლაჟებთან პარკირება რთულდება
    — დილით ადრე მისვლა ბევრს წყვეტს. ოზურგეთამდე და შემოქმედამდე გზა ასევე ასფალტიანია.


    ბახმარო სულ სხვა ამბავია. ჩოხატაურიდან ზემოთ დაახლოებით ორმოცდახუთი კილომეტრი გრუნტოვანი გზაა და სამ
    საათამდე მიდის: ხრეშოვანი საფარი, ღრმა ღარები, მდინარის კვეთა და ციცაბო აღმართები. აქ მხოლოდ 4x4 გამოდგება
    და წვიმის შემდეგ მდგომარეობა მკვეთრად უარესდება. ზამთარში გზა დაკეტილია.


    დასავლეთ საქართველოში წვიმა ხშირია და უეცარი — ხილვადობა სწრაფად ეცემა, ასფალტი მოცურავე ხდება. საწვავი
    ოზურგეთში, ლანჩხუთსა და ჩოხატაურშია, ბახმაროსკენ ასვლისას კი აღარაა.
  best_for:
  - პლაჟის დღეები ურეკის მაგნიტურ ქვიშაზე
  - გაჩერება ბათუმისკენ მიმავალ გზაზე
  - ჩაისა და თხილის პლანტაციები მთისწინეთში
  - ბახმარო ივლის-სექტემბერში, მხოლოდ ჯიპით
en:
  name: Guria
  short: >-
    Tea plantations between the sea and the mountains — the magnetic sand of Ureki and the high resort
    of Bakhmaro.
  body: >-
    Guria is a small region between the Black Sea and the Meskheti range, and that contrast defines it:
    two hours after leaving the beach you can be at two thousand metres. The climate is subtropical and
    humid, and the landscape is a mixture of tea and hazelnut plantations, bamboo and dense forest.


    On the coast lies Ureki, a beach of black magnetic sand which has been credited with therapeutic properties
    since Soviet times and remains a family holiday place. In summer it is busy, and the water is exactly
    as warm as at Kobuleti further south. Shekvetili, with its park and concert arena, sits a little to
    the north.


    Inland the region quietens down. Ozurgeti is the administrative centre, and beside it stands Shemokmedi
    Monastery, one of the principal religious sites of Guria and once a rich repository of icons and metalwork.
    Nabeghlavi, in the foothills, is the village behind the mineral water of the same name.


    The main mountain destination is Bakhmaro, a resort of timber houses at around two thousand metres,
    known for its horse races in August. Bakhmaro is strictly seasonal, roughly July to September, and
    can only be reached on an unpaved road.


    The season is clear-cut: June to September on the coast, and an even narrower window in the mountains.
    One or two days is enough unless Bakhmaro is on the plan, in which case add a full day for the drive
    alone.
  driving: >-
    The coastal highway through Ureki and Shekvetili is good asphalt and an economy car is entirely adequate.
    In summer, especially at weekends, this road is busy and parking near the beaches becomes difficult
    — arriving early solves most of it. The roads to Ozurgeti and Shemokmedi are also surfaced and easy.


    Bakhmaro is another matter. From Chokhatauri it is about forty-five kilometres of unpaved road, and
    it takes up to three hours: loose gravel, deep ruts, a river crossing and steep climbs. Only a 4x4
    belongs here, and conditions worsen sharply after rain. In winter the road is closed altogether.


    Rain in western Georgia is frequent and sudden. Visibility drops quickly and the asphalt becomes slippery
    under the first shower after a dry spell, so leave more space than usual. Fuel is available in Ozurgeti,
    Lanchkhuti and Chokhatauri, but there is nothing on the climb to Bakhmaro.
  best_for:
  - Beach days on the magnetic sand of Ureki
  - A stop on the drive down to Batumi
  - Tea and hazelnut country in the foothills
  - Bakhmaro between July and September, 4x4 only
ru:
  name: Гурия
  short: Чайные плантации между морем и горами — магнитный песок Уреки и высокогорный курорт Бахмаро.
  body: >-
    Гурия — небольшой регион между Чёрным морем и Месхетским хребтом, и этот контраст определяет всё:
    через два часа после пляжа можно оказаться на двух тысячах метров. Климат субтропический и влажный,
    ландшафт — смесь чайных и ореховых плантаций, бамбука и густого леса.


    На побережье лежит Уреки, пляж из чёрного магнитного песка, которому ещё с советских времён приписывают
    лечебные свойства; это по-прежнему место семейного отдыха. Летом здесь людно, а вода такая же тёплая,
    как в Кобулети южнее. Чуть севернее находится Шекветили с парком и концертной ареной.


    Вглубь региона становится тише. Озургети — административный центр, рядом стоит монастырь Шемокмеди,
    один из главных духовных памятников Гурии и когда-то богатое хранилище икон и чеканки. Набеглави в
    предгорьях — село, давшее имя известной минеральной воде.


    Главное горное направление — Бахмаро: курорт из деревянных домов примерно на двух тысячах метров,
    известный конными скачками в августе. Бахмаро строго сезонный, ориентировочно с июля по сентябрь,
    и добраться туда можно только по грунтовой дороге.


    Гурия интересна и исторически: чайная культура закрепилась здесь в конце XIX века, часть плантаций
    работает до сих пор, а фундук стал главным экспортным продуктом края. Сельские дома деревянные, с
    балконами, и многие из них стоят прямо вдоль дороги.


    Сезон очерчен чётко: на побережье с июня по сентябрь, в горах окно ещё уже — с июля по сентябрь. Одного-двух
    дней достаточно, если Бахмаро не в планах; иначе добавьте целый день только на дорогу.
  driving: >-
    Прибрежная трасса через Уреки и Шекветили — хороший асфальт, машины эконом-класса вполне хватает.
    Летом, особенно по выходным, поток плотный, а парковка у пляжей превращается в проблему: ранний приезд
    решает большую её часть. Дороги на Озургети и к Шемокмеди тоже асфальтированные и простые.


    Бахмаро — совсем другая история. От Чохатаури наверх около сорока пяти километров грунта, и на них
    уходит до трёх часов: сыпучий гравий, глубокая колея, брод и крутые подъёмы. Здесь уместен только
    внедорожник, а после дождя обстановка резко ухудшается. Зимой дорога закрыта полностью.


    Дожди в Западной Грузии частые и внезапные. Видимость падает быстро, а первый ливень после сухих дней
    делает асфальт скользким, так что дистанцию держите с запасом. Заправки есть в Озургети, Ланчхути
    и Чохатаури, на подъёме к Бахмаро их нет.
  best_for:
  - Пляжные дни на магнитном песке Уреки
  - Остановка по дороге в Батуми
  - Чайные и ореховые предгорья
  - Бахмаро с июля по сентябрь, только на внедорожнике
fa:
  name: گوریا
  short: مزارع چای میان دریا و کوه — شن مغناطیسی اورکی و ییلاق بلند باخمارو.
  body: >-
    گوریا منطقهٔ کوچکی میان دریای سیاه و رشته‌کوه مسختی است و همین تضاد آن را تعریف می‌کند: دو ساعت پس
    از ترک ساحل می‌توانید در ارتفاع دو هزار متر باشید. اقلیم نیمه‌گرمسیری و مرطوب است و چشم‌انداز آمیزه‌ای
    است از مزارع چای و فندق، بامبو و جنگل انبوه.

    در ساحل، اورکی قرار دارد؛ ساحلی از شن سیاه مغناطیسی که از دوران شوروی خواص درمانی به آن نسبت داده‌اند
    و هنوز مقصد تعطیلات خانوادگی است. در تابستان شلوغ است و آب دقیقاً به همان گرمی کوبولتی در جنوب است.
    شکوتیلی، با پارک و آمفی‌تئاتر کنسرت خود، کمی شمال‌تر نشسته است.

    در داخل خشکی، منطقه آرام می‌شود. اوزورگتی مرکز اداری است و در کنار آن صومعهٔ شموکمدی ایستاده است،
    یکی از مهم‌ترین مکان‌های مذهبی گوریا که زمانی گنجینهٔ پرباری از شمایل و فلزکاری داشت. نابغلاوی، در
    دامنه‌ها، روستایی است که آب معدنی هم‌نام از آن می‌آید.

    مقصد اصلی کوهستانی باخمارو است؛ ییلاقی از خانه‌های چوبی در حدود دو هزار متر که به مسابقات اسب‌دوانی
    ماه اوت شهرت دارد. باخمارو کاملاً فصلی است، تقریباً از ژوئیه تا سپتامبر، و تنها از راهی خاکی به آن
    می‌رسند.

    فصل روشن است: ژوئن تا سپتامبر در ساحل و پنجره‌ای حتی باریک‌تر در کوهستان. یکی دو روز کافی است، مگر
    آنکه باخمارو در برنامه باشد که در آن صورت باید یک روز کامل فقط برای رانندگی کنار بگذارید.
  driving: >-
    بزرگراه ساحلی از اورکی و شکوتیلی آسفالت خوبی دارد و خودروی اقتصادی کاملاً کافی است. در تابستان، به‌ویژه
    آخر هفته‌ها، این جاده شلوغ است و پارک نزدیک ساحل‌ها دشوار می‌شود — رسیدن زودهنگام بیشتر مشکل را حل
    می‌کند. جاده‌های اوزورگتی و شموکمدی هم آسفالت و آسان‌اند.

    باخمارو داستان دیگری است. از چوخاتاوری حدود چهل‌وپنج کیلومتر جادهٔ خاکی است و تا سه ساعت وقت می‌گیرد:
    شن سست، شیارهای عمیق، یک گذر از رودخانه و سربالایی‌های تند. فقط 4x4 به اینجا تعلق دارد و پس از باران
    شرایط به‌شدت بدتر می‌شود. در زمستان جاده کاملاً بسته است.

    باران در غرب گرجستان مکرر و ناگهانی است. دید به‌سرعت افت می‌کند و آسفالت زیر نخستین رگبار پس از دوره‌ای
    خشک لغزنده می‌شود، پس فاصله را بیش از معمول نگه دارید. سوخت در اوزورگتی، لانچخوتی و چوخاتاوری هست،
    اما در مسیر صعود به باخمارو هیچ چیز نیست.
  best_for:
  - روزهای ساحلی روی شن مغناطیسی اورکی
  - توقفی در راه رفتن به باتومی
  - سرزمین چای و فندق در دامنه‌ها
  - باخمارو میان ژوئیه و سپتامبر، فقط با 4x4
he:
  name: גוריה
  short: מטעי תה בין הים להרים — החול המגנטי של אורקי ואתר הנופש הגבוה בחמארו.
  body: >-
    גוריה היא אזור קטן בין הים השחור לרכס מסחתי, והניגוד הזה מגדיר אותה: שעתיים אחרי שעזבתם את החוף אתם
    יכולים להיות בגובה אלפיים מטר. האקלים סובטרופי ולח, והנוף הוא תערובת של מטעי תה ואגוזי לוז, חורשות
    במבוק ויער עבות.

    על החוף שוכנת אורקי, חוף של חול שחור מגנטי שמיוחסות לו סגולות מרפא עוד מהתקופה הסובייטית, והוא נשאר
    מקום נופש משפחתי. בקיץ הוא הומה אדם, והמים חמים בדיוק כמו בקובולטי שמדרום. החוף רחב, השקיעה נשקפת
    ישר מן המים, ומשפחות רבות חוזרות לכאן שנה אחר שנה. שקווטילי, עם הפארק וזירת המופעים שלה, יושבת מעט
    צפונה משם.

    בפנים הארץ האזור נרגע. אוזורגטי היא המרכז המנהלי, ולצידה עומד מנזר שמוקמדי, אחד האתרים הדתיים המרכזיים
    של גוריה, שהיה בעבר אוצר עשיר של איקונות ומלאכת מתכת. נבגלאווי, במורדות ההרים, הוא הכפר שמאחורי המים
    המינרליים הנושאים את אותו שם. לאנצחוטי וצ'וחטאורי הן שתי העיירות הנוספות באזור, ודרך צ'וחטאורי עוברת
    הדרך אל ההרים.

    יעד ההרים המרכזי הוא בחמארו, אתר נופש של בתי עץ בגובה כאלפיים מטר, המוכר במרוצי הסוסים שלו באוגוסט.
    בחמארו עונתי לחלוטין, בערך מיולי עד ספטמבר, ואפשר להגיע אליו רק בדרך לא סלולה.

    העונה חדה וברורה: יוני עד ספטמבר על החוף, וחלון צר עוד יותר בהרים. יום או יומיים מספיקים, אלא אם בחמארו
    נמצא בתוכנית — ואז צריך להוסיף יום שלם רק לנסיעה עצמה. מי שמגיע רק בשביל הים יכול לשלב את גוריה בדרך
    דרומה לבטומי.
  driving: >-
    כביש החוף דרך אורקי ושקווטילי הוא אספלט טוב ורכב חסכוני מספיק בהחלט. בקיץ, ובעיקר בסופי שבוע, הכביש
    עמוס והחניה ליד החופים נעשית קשה — הגעה מוקדמת פותרת את רוב הבעיה. גם הדרכים לאוזורגטי ולשמוקמדי סלולות
    ונוחות.

    בחמארו הוא סיפור אחר. מצ'וחטאורי מדובר בכארבעים וחמישה קילומטרים של דרך לא סלולה, והנסיעה אורכת עד
    שלוש שעות: חצץ מתפורר, תלמים עמוקים, חציית נחל ועליות תלולות. רק רכב 4x4 שייך לכאן, והתנאים מחמירים
    מאוד אחרי גשם. בחורף הדרך סגורה לחלוטין.

    הגשם במערב גאורגיה תכוף ופתאומי. הראות יורדת במהירות והאספלט נעשה חלקלק במטר הראשון אחרי תקופה יבשה,
    לכן השאירו מרווח גדול מהרגיל. דלק יש באוזורגטי, בלאנצחוטי ובצ'וחטאורי, אבל בכל העלייה לבחמארו אין
    כלום.
  best_for:
  - ימי חוף על החול המגנטי של אורקי
  - עצירה בדרך דרומה לבטומי
  - ארץ התה ואגוזי הלוז במורדות
  - בחמארו בין יולי לספטמבר, ברכב 4x4 בלבד
ar:
  name: غوريا
  short: مزارع الشاي بين البحر والجبال — رمال أوريكي المغناطيسية ومصيف باخمارو المرتفع.
  body: >-
    غوريا إقليم صغير بين البحر الأسود وسلسلة ميسخيتي، وهذا التباين هو ما يحدد ملامحه: بعد ساعتين من مغادرة
    الشاطئ يمكن أن تكون على ارتفاع ألفي متر. المناخ شبه مداري ورطب، والمشهد خليط من مزارع الشاي والبندق
    وأشجار الخيزران والغابات الكثيفة.

    على الساحل تقع أوريكي، شاطئ من الرمال السوداء المغناطيسية التي نُسبت إليها خصائص علاجية منذ العهد
    السوفييتي، وما زالت مقصداً للعطلات العائلية. تزدحم في الصيف، ومياهها دافئة تماماً كمياه كوبوليتي إلى
    الجنوب. الشاطئ عريض، وتغرب الشمس فيه في الماء مباشرة، وتعود إليه عائلات كثيرة عاماً بعد عام. أما شيكفيتيلي،
    بحديقتها وساحة حفلاتها، فتقع إلى الشمال قليلاً.

    وفي الداخل يهدأ الإقليم. أوزورغيتي هي المركز الإداري، وإلى جانبها يقوم دير شيموكميدي، أحد أهم المواقع
    الدينية في غوريا، وكان في ما مضى خزانة غنية بالأيقونات والمشغولات المعدنية. ونابيغلافي، في السفوح،
    هي القرية التي يأتي منها الماء المعدني الذي يحمل اسمها. ولانتشخوتي وتشوخاتاوري هما البلدتان الأخريان
    في الإقليم، ومن تشوخاتاوري يبدأ الطريق إلى الجبال.

    أما وجهة الجبال الرئيسية فهي باخمارو، مصيف من البيوت الخشبية على ارتفاع ألفي متر تقريباً، اشتهر بسباقات
    الخيل في أغسطس. وباخمارو موسمي تماماً، من يوليو إلى سبتمبر تقريباً، ولا يُوصل إليه إلا عبر طريق غير
    معبّد.

    الموسم واضح الحدود: من يونيو إلى سبتمبر على الساحل، ونافذة أضيق من ذلك في الجبال. يوم أو يومان يكفيان،
    إلا إذا كان باخمارو في الخطة، فعندئذ أضف يوماً كاملاً للقيادة وحدها. ومن يأتي من أجل البحر فقط يمكنه
    إدراج غوريا في الطريق جنوباً إلى باتومي.
  driving: >-
    الطريق الساحلي عبر أوريكي وشيكفيتيلي إسفلت جيد، وسيارة اقتصادية تكفي تماماً. في الصيف، وخاصة في عطلات
    نهاية الأسبوع، يزدحم هذا الطريق ويصعب الوقوف قرب الشواطئ — والوصول مبكراً يحل معظم المشكلة. وطريقا
    أوزورغيتي وشيموكميدي معبّدان وسهلان أيضاً.

    باخمارو شأن آخر. من تشوخاتاوري هناك نحو خمسة وأربعين كيلومتراً من الطريق غير المعبّد، وتستغرق حتى
    ثلاث ساعات: حصى سائبة وأخاديد عميقة ومخاضة نهر ومنحدرات حادة. لا تصلح هنا إلا سيارة دفع رباعي، والظروف
    تسوء بشدة بعد المطر. وفي الشتاء يُغلق الطريق تماماً.

    المطر في غرب جورجيا متكرر ومفاجئ. تنخفض الرؤية سريعاً ويصبح الإسفلت زلقاً مع أول زخة بعد فترة جفاف،
    فاترك مسافة أكبر من المعتاد. الوقود متوفر في أوزورغيتي ولانتشخوتي وتشوخاتاوري، لكن لا شيء على الإطلاق
    في طريق الصعود إلى باخمارو.
  best_for:
  - أيام شاطئية على رمال أوريكي المغناطيسية
  - محطة على الطريق نزولاً إلى باتومي
  - بلاد الشاي والبندق في السفوح
  - باخمارو بين يوليو وسبتمبر، بالدفع الرباعي فقط
