ka:
  name: რაჭა-ლეჩხუმი
  short: საქართველოს ყველაზე მშვიდი მთიანი კუთხე — ხვანჭკარის ვენახები, ნიკორწმინდა და ონის ზემოთ მაღალი
    ხეობები.
  body: >-
    რაჭა-ლეჩხუმი საქართველოს ყველაზე მცირედ დასახლებული და, სავარაუდოდ, ყველაზე მშვიდი მხარეა. აქ დიდი
    ტურისტული ნაკადი არასდროს ყოფილა და სწორედ ეს არის მისი ღირებულება: ტყიანი ხეობები, ქვის სოფლები,
    ცარიელი გზები და კავკასიონის ქედი ჩრდილოეთით.


    ცენტრი ამბროლაურია, ხვანჭკარის ღვინის ზონის გულში — ალექსანდროულის ვენახები სწორედ ამ ფერდობებზეა
    და ღვინის რაოდენობა მცირეა, რაც მას სხვა რეგიონებისგან განასხვავებს. ქალაქთან ახლოს ნიკორწმინდის ტაძარია,
    XI საუკუნის ნაგებობა, რომლის ფასადის ქვის კვეთა და შიდა მოხატულობა ქართული ხუროთმოძღვრების ერთ-ერთ
    მწვერვალადაა მიჩნეული.


    გარშემო წყალი და მთაა. შაორისა და ლაჯანურის წყალსაცავები ნაძვნარებში დევს; ცაგერი ლეჩხუმის ცენტრია,
    უფრო დაბალი და ნოტიო; ონის ზემოთ კი ჭანჭახის ხეობა შოვისკენ მიდის, სადაც 2023 წლის ღვარცოფის შემდეგ
    ინფრასტრუქტურის ნაწილი აღდგენის პროცესშია — ვიზიტამდე მდგომარეობის დაზუსტება აუცილებელია. კიდევ უფრო
    შორს, ღების მიმართულებით, უძირო ტბა და ბუბის მყინვარია, უკვე ჯიპისა და ლაშქრობის ტერიტორია.


    რაჭაში ტურისტული ინფრასტრუქტურა მოკრძალებულია: სასტუმროები ძირითადად ამბროლაურსა და ონშია, კაფეები
    ადრე იკეტება, ბანკომატი ყველა სოფელში არაა. ეს არ არის ნაკლი — უბრალოდ წინასწარ უნდა იცოდე და ნაღდი
    ფული და საკვების მარაგი თან გქონდეს.


    სეზონი მოკლეა: მაისიდან ოქტომბრამდე, ხოლო მაღალი ხეობებისთვის — ივნისიდან სექტემბრამდე. ზამთარში უღელტეხილები
    თოვლით იკეტება და სოფლების ნაწილი კვირეობით მოწყვეტილია. ორი დღე გულწრფელი მინიმუმია, სამი უფრო რეალური
    — ჩქარა ამ რეგიონის ნახვა უბრალოდ არ გამოდის.
  driving: >-
    რაჭა შორია — თბილისიდან ამბროლაურამდე ხუთი საათი, შოვამდე დაახლოებით შვიდი. ეს არ არის ერთდღიანი გასვლა
    და ასე დაგეგმვა ყველაზე გავრცელებული შეცდომაა. ორი მისადგომია: ქუთაისიდან ტყიბულზე და ნაკერალას უღელტეხილზე,
    ან ზესტაფონიდან საჩხერეზე. ტყიბულის მიმართულება უფრო მოკლეა, სამაგიეროდ სერპანტინიანი და ზამთარში
    მოყინული.


    გზის ხარისხი არათანაბარია: ამბროლაურამდე და ონამდე ძირითადად ასფალტია, თუმცა ვიწრო და მოსახვევებით
    სავსე, ხოლო ზემოთ მონაკვეთები ხრეშოვანია. ღების, უძირო ტბისა და მაღალი ხეობების მიმართულებით მხოლოდ
    4x4 გამოდგება. მაღალი კლირენსი მთელ რეგიონში საგრძნობლად ამარტივებს ცხოვრებას.


    საწვავი ამბროლაურსა და ონშია — ონის ზემოთ გასამართი პრაქტიკულად აღარაა, ამიტომ ბაკი წინასწარ აავსე.
    მობილური კავშირი ხეობებში წყდება, ღამის მართვა კი აქ არ ღირს: გზაზე საქონელი დგას და მოაჯირები ხშირად
    არ არის.
  best_for:
  - ორ-სამდღიანი მშვიდი მარშრუტი ხალხმრავლობის გარეშე
  - ხვანჭკარის ღვინის ზონა და ნიკორწმინდა
  - ტბები და ტყეები ზაფხულში
  - ჯიპ-მარშრუტები ღებისა და მყინვარების მიმართულებით
en:
  name: Racha-Lechkhumi
  short: Georgia's quietest mountain corner — Khvanchkara vineyards, Nikortsminda and the high valleys
    above Oni.
  body: >-
    Racha-Lechkhumi is the least populated and probably the quietest region in Georgia. Mass tourism has
    never arrived here, and that is exactly the point: wooded valleys, stone villages, empty roads and
    the Caucasus ridge closing the view to the north.


    The centre is Ambrolauri, in the middle of the Khvanchkara wine zone. The Aleksandrouli vines grow
    on these slopes, and production is small enough that the wine behaves quite differently from Kakheti's.
    Just outside town stands Nikortsminda Cathedral, an eleventh-century building whose carved facade
    and interior painting are counted among the peaks of Georgian architecture.


    Around it there is water and mountain. The Shaori and Lajanuri reservoirs lie among spruce forest;
    Tsageri is the lower, damper centre of Lechkhumi; and above Oni the Chanchakhi valley climbs towards
    Shovi, where part of the infrastructure is still being rebuilt after the debris flow of 2023 — check
    the current situation before going. Further on towards Ghebi lie Udziro Lake and the Buba Glacier,
    which are jeep and hiking country rather than sightseeing.


    The season is short: roughly May to October, and for the high valleys June to September. In winter
    snow closes the passes and some villages are cut off for weeks. Two days is the minimum that makes
    sense, three is more realistic, and there is no way to see this region properly in a hurry.
  driving: >-
    Racha is far. Ambrolauri is about five hours from Tbilisi and Shovi closer to seven, so treating it
    as a day trip is the standard mistake. There are two approaches: from Kutaisi through Tkibuli and
    over the Nakerala Pass, or from Zestaponi through Sachkhere. The Tkibuli line is shorter but is a
    serpentine and ices up in winter.


    Road quality is uneven. As far as Ambrolauri and Oni it is mostly asphalt, though narrow and full
    of bends, and above that gravel sections begin. Towards Ghebi, Udziro Lake and the upper valleys only
    a 4x4 will do. Ground clearance makes life easier everywhere in the region.


    Fuel exists in Ambrolauri and Oni; above Oni there is effectively none, so fill the tank in advance.
    Mobile coverage drops out in the gorges. Do not drive here after dark: cattle stand on the road, edges
    are unlit and crash barriers are frequently missing.
  best_for:
  - Two or three quiet days away from the crowds
  - The Khvanchkara wine zone and Nikortsminda
  - Forests and reservoirs in summer
  - 4x4 routes towards Ghebi and the glaciers
ru:
  name: Рача-Лечхуми
  short: Самый тихий горный угол Грузии — виноградники Хванчкары, Никорцминда и высокие ущелья выше Они.
  body: >-
    Рача-Лечхуми — наименее населённый и, пожалуй, самый спокойный регион Грузии. Массовый туризм сюда
    так и не пришёл, и в этом его ценность: лесистые ущелья, каменные сёла, пустые дороги и Кавказский
    хребет, замыкающий вид с севера.


    Центр — Амбролаури, в самом сердце винной зоны Хванчкара. Виноград александроули растёт именно на
    этих склонах, а объёмы настолько малы, что вино здесь ведёт себя иначе, чем кахетинское. У города
    стоит собор Никорцминда XI века, чья резьба по фасаду и внутренние росписи считаются одной из вершин
    грузинской архитектуры.


    Вокруг — вода и горы. Шаорское и Ладжанурское водохранилища лежат среди хвойного леса; Цагери — более
    низкий и влажный центр Лечхуми; выше Они ущелье Чанчахи поднимается к Шови, где часть инфраструктуры
    до сих пор восстанавливается после схода селя 2023 года, и обстановку нужно уточнять перед поездкой.
    Ещё дальше, в сторону Геби, лежат озеро Удзиро и ледник Буба — это уже территория джипов и треккинга.


    Туристическая инфраструктура в Раче скромная: гостиницы в основном в Амбролаури и Они, кафе закрываются
    рано, банкомат есть далеко не в каждом селе. Это не недостаток, просто знать об этом стоит заранее
    и держать при себе наличные и запас еды.


    Сезон короткий: примерно с мая по октябрь, а для верхних ущелий с июня по сентябрь. Зимой перевалы
    закрывает снег, часть сёл отрезана неделями. Два дня — разумный минимум, три реалистичнее: наспех
    этот регион не смотрят.
  driving: >-
    Рача далеко. До Амбролаури от Тбилиси около пяти часов, до Шови почти семь, поэтому планировать её
    как однодневный выезд — типичная ошибка. Подъездов два: из Кутаиси через Ткибули и перевал Накерала
    либо из Зестафони через Сачхере. Ткибульский вариант короче, но это серпантин, зимой обледеневающий.


    Качество дороги неровное. До Амбролаури и Они в основном асфальт, хотя узкий и извилистый, выше начинаются
    гравийные участки. В сторону Геби, озера Удзиро и верхних ущелий проедет только внедорожник. Клиренс
    облегчает жизнь по всему региону.


    Заправки есть в Амбролаури и Они, выше Они их практически нет — бак заполняйте заранее. Мобильная
    связь в ущельях пропадает. Ездить в темноте здесь не стоит: на дороге стоит скот, обочины не освещены,
    отбойников часто нет.
  best_for:
  - Два-три спокойных дня вдали от толп
  - Винная зона Хванчкары и Никорцминда
  - Леса и водохранилища летом
  - Джип-маршруты к Геби и ледникам
fa:
  name: راچا-لچخومی
  short: آرام‌ترین گوشهٔ کوهستانی گرجستان — تاکستان‌های خوانچکارا، نیکورتسمیندا و دره‌های بلند بالای اونی.
  body: >-
    راچا-لچخومی کم‌جمعیت‌ترین و احتمالاً آرام‌ترین منطقهٔ گرجستان است. گردشگری انبوه هرگز به اینجا نرسیده
    و نکته دقیقاً همین است: دره‌های جنگلی، روستاهای سنگی، جاده‌های خالی و ستیغ قفقاز که چشم‌انداز شمال
    را می‌بندد.

    مرکز آن آمبرولاوری است، در میانهٔ منطقهٔ شراب خوانچکارا. انگور الکساندراولی روی همین دامنه‌ها می‌روید
    و تولید آن‌قدر کم است که شراب رفتاری کاملاً متفاوت از شراب کاختی دارد. درست بیرون شهر کلیسای جامع
    نیکورتسمیندا ایستاده است، بنایی از سدهٔ یازدهم که نمای کنده‌کاری‌شده و نقاشی درونی‌اش را در شمار قله‌های
    معماری گرجی می‌شمارند.

    گرد آن آب و کوه است. آبگیرهای شااوری و لاجانوری میان جنگل صنوبر آرمیده‌اند؛ تساگری مرکز پایین‌تر و
    مرطوب‌تر لچخومی است؛ و بالای اونی درهٔ چانچاخی به سوی شووی بالا می‌رود، جایی که بخشی از زیرساخت هنوز
    پس از جریان گل‌ولای و آوار سال 2023 در حال بازسازی است — پیش از رفتن وضعیت روز را بررسی کنید. دورتر
    به سوی غبی، دریاچهٔ اودزیرو و یخچال بوبا قرار دارند که بیشتر قلمرو جیپ و پیاده‌روی‌اند تا بازدید ساده.

    فصل کوتاه است: تقریباً ماه مه تا اکتبر، و برای دره‌های بلند ژوئن تا سپتامبر. در زمستان برف گردنه‌ها
    را می‌بندد و برخی روستاها هفته‌ها قطع می‌مانند. دو روز حداقلی است که معنا دارد، سه روز واقع‌بینانه‌تر
    است، و این منطقه را با عجله نمی‌شود دید.
  driving: >-
    راچا دور است. آمبرولاوری حدود پنج ساعت با تفلیس فاصله دارد و شووی نزدیک هفت ساعت، پس در نظر گرفتن
    آن به عنوان سفر یک‌روزه اشتباه رایج است. دو راه دسترسی هست: از کوتایسی از میان تکیبولی و گردنهٔ ناکرالا،
    یا از زستافونی از راه ساچخره. خط تکیبولی کوتاه‌تر است اما سرپیچ است و در زمستان یخ می‌بندد.

    کیفیت جاده یکدست نیست. تا آمبرولاوری و اونی بیشتر آسفالت است، هرچند باریک و پرپیچ، و بالاتر از آن
    مقاطع شنی شروع می‌شود. به سوی غبی، دریاچهٔ اودزیرو و دره‌های بالایی فقط 4x4 جواب می‌دهد. ارتفاع کف
    در تمام منطقه کار را آسان‌تر می‌کند.

    سوخت در آمبرولاوری و اونی هست؛ بالاتر از اونی عملاً هیچ، پس باک را از پیش پر کنید. پوشش تلفن همراه
    در دره‌ها قطع می‌شود. پس از تاریکی اینجا رانندگی نکنید: گاوها روی جاده می‌ایستند، لبه‌ها بی‌نورند
    و حفاظ کنار جاده اغلب وجود ندارد.
  best_for:
  - دو یا سه روز آرام دور از شلوغی
  - منطقهٔ شراب خوانچکارا و نیکورتسمیندا
  - جنگل‌ها و آبگیرها در تابستان
  - مسیرهای 4x4 به سوی غبی و یخچال‌ها
he:
  name: רצ'ה-לצ'חומי
  short: הפינה ההררית השקטה בגאורגיה — כרמי חוונצ'קרה, ניקורצמינדה והעמקים הגבוהים מעל אוני.
  body: >-
    רצ'ה-לצ'חומי היא האזור הדליל ביותר באוכלוסייה וכנראה גם השקט ביותר בגאורגיה. תיירות ההמונים מעולם
    לא הגיעה לכאן, וזו בדיוק הנקודה: עמקים מיוערים, כפרי אבן, כבישים ריקים ורכס הקווקז שסוגר את המבט צפונה.

    המרכז הוא אמברולאורי, בלב אזור היין חוונצ'קרה. גפני האלכסנדראולי גדלות במדרונות האלה, והייצור קטן
    דיו כדי שהיין יתנהג אחרת לגמרי מיינות קחתי. ממש בפאתי העיר עומדת קתדרלת ניקורצמינדה, מבנה מן המאה
    ה-11 שחזיתו המגולפת והציור הפנימי שלו נחשבים לפסגות האדריכלות הגאורגית. באמברולאורי עצמה יש בית יין
    קטן שבו אפשר לטעום את היינות המקומיים.

    סביבה יש מים והרים. מאגרי שאורי ולאג'אנורי שוכנים בין יערות אשוח; צאגרי היא המרכז הנמוך והלח יותר
    של לצ'חומי; בדרך מאמברולאורי לאוני, על גדת הריוני, עומדת כנסיית בראקוני; ומעל אוני מטפס עמק צ'אנצ'אחי
    לעבר שובי, עמק אלפיני עם מעיינות מינרליים, שבו חלק מהתשתית עדיין משוקם אחרי זרימת הבוץ והסחף של 2023
    — בדקו את המצב העדכני לפני שיוצאים. הלאה לכיוון גבי נמצאים אגם אודזירו וקרחון בובה, שהם עולם של ג'יפים
    והליכה ולא של סיור נוח.

    העונה קצרה: בערך ממאי עד אוקטובר, ולעמקים הגבוהים מיוני עד ספטמבר. בחורף השלג סוגר את המעברים וכפרים
    אחדים מנותקים לשבועות. מי שמתכוון להגיע עד גבי צריך להקדיש לכך יום שלם בפני עצמו. יומיים הם המינימום
    ההגיוני, שלושה מציאותיים יותר, ואין שום דרך לראות את האזור הזה כמו שצריך בחיפזון.
  driving: >-
    רצ'ה רחוקה. אמברולאורי נמצאת כחמש שעות מטביליסי ושובי קרוב לשבע, ולכן ההתייחסות אליה כאל טיול יום
    היא הטעות הסטנדרטית. יש שתי גישות: מקוטאיסי דרך טקיבולי ומעבר נאקרלה, או מזסטפוני דרך סצ'חרה. הקו
    של טקיבולי קצר יותר אבל הוא סרפנטינה ומקרח בחורף.

    איכות הדרך אינה אחידה. עד אמברולאורי ואוני מדובר בעיקר באספלט, אם כי צר ומלא פניות, ומעליהם מתחילים
    קטעי חצץ. לכיוון גבי, אגם אודזירו והעמקים העליונים רק רכב 4x4 יעשה את העבודה. גובה גחון מקל על החיים
    בכל מקום באזור.

    דלק יש באמברולאורי ובאוני; מעל אוני אין למעשה כלום, לכן מלאו את המכל מראש. הקליטה הסלולרית נעלמת בערוצים.
    אל תיסעו כאן אחרי רדת החשכה: פרות עומדות על הכביש, השוליים אינם מוארים ומעקות בטיחות חסרים לעיתים
    קרובות.
  best_for:
  - יומיים או שלושה שקטים הרחק מהקהל
  - אזור היין חוונצ'קרה וניקורצמינדה
  - יערות ומאגרי מים בקיץ
  - מסלולי 4x4 לכיוון גבי והקרחונים
ar:
  name: راتشا-ليتشخومي
  short: أهدأ ركن جبلي في جورجيا — كروم خفانتشكارا ونيكورتسميندا والأودية المرتفعة فوق أوني.
  body: >-
    راتشا-ليتشخومي أقل مناطق جورجيا سكاناً وربما أهدؤها على الإطلاق. لم تصل إليها السياحة الجماهيرية قط،
    وهذا بالضبط جوهر جاذبيتها: أودية مشجرة وقرى حجرية وطرق خالية وسلسلة القوقاز التي تسد الأفق شمالاً.

    مركزها أمبرولاوري، في قلب منطقة نبيذ خفانتشكارا. تنمو كروم أليكساندراولي على هذه المنحدرات، والإنتاج
    صغير إلى حد يجعل النبيذ يتصرف على نحو مختلف تماماً عن نبيذ كاخيتي. وخارج البلدة مباشرة تقوم كاتدرائية
    نيكورتسميندا، وهي بناء من القرن الحادي عشر تُعد واجهته المنقوشة ورسومه الداخلية من قمم العمارة الجورجية.
    وفي أمبرولاوري نفسها بيت نبيذ صغير يمكن التذوق فيه.

    وحولها ماء وجبل. يرقد خزانا شاوري ولاجانوري بين غابات التنوب؛ وتساغيري هي المركز الأدنى والأكثر رطوبة
    في ليتشخومي؛ وعلى ضفة ريوني في الطريق من أمبرولاوري إلى أوني تقف كنيسة باراكوني؛ وفوق أوني يصعد وادي
    تشانتشاخي نحو شوفي، وهو واد جبلي بينابيع معدنية، حيث ما زال جزء من البنية التحتية قيد إعادة البناء
    بعد الانهيار الطيني عام 2023 — تحقق من الوضع الراهن قبل الذهاب. وأبعد نحو غيبي تقع بحيرة أودزيرو ونهر
    بوبا الجليدي، وهما مجال سيارات الجيب والمشي لا مجال الزيارات السهلة.

    الموسم قصير: من مايو إلى أكتوبر تقريباً، ومن يونيو إلى سبتمبر للأودية المرتفعة. وفي الشتاء يغلق الثلج
    الممرات وتنقطع بعض القرى أسابيع. يومان هما الحد الأدنى المعقول، وثلاثة أقرب إلى الواقع، ولا سبيل لرؤية
    هذا الإقليم كما ينبغي على عجل.
  driving: >-
    راتشا بعيدة. أمبرولاوري على بعد نحو خمس ساعات من تبليسي، وشوفي قرابة سبع، ولذلك فاعتبارها رحلة يوم
    واحد هو الخطأ المعتاد. وهناك مدخلان: من كوتايسي عبر تكيبولي وممر ناكيرالا، أو من زيستافوني عبر ساتشخيري.
    خط تكيبولي أقصر لكنه طريق ملتوٍ ويتجمد في الشتاء.

    جودة الطريق متفاوتة. حتى أمبرولاوري وأوني هو إسفلت في معظمه، وإن كان ضيقاً وكثير المنعطفات، وفوق ذلك
    تبدأ المقاطع الحصوية. أما نحو غيبي وبحيرة أودزيرو والأودية العليا فلا تنفع إلا سيارة دفع رباعي. والخلوص
    الأرضي يسهّل الأمور في كل أنحاء الإقليم.

    الوقود متوفر في أمبرولاوري وأوني؛ وفوق أوني لا يوجد شيء عملياً، فاملأ الخزان مسبقاً. وتنقطع تغطية
    الهاتف المحمول داخل المضايق. ولا تقد هنا بعد حلول الظلام: الأبقار تقف على الطريق، والحواف غير مضاءة،
    وحواجز الحماية مفقودة في مواضع كثيرة.
  best_for:
  - يومان أو ثلاثة هادئة بعيداً عن الزحام
  - منطقة نبيذ خفانتشكارا ونيكورتسميندا
  - الغابات والخزانات في الصيف
  - مسارات الدفع الرباعي نحو غيبي والأنهار الجليدية
