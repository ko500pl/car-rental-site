ar:
  name: سامتسخي-جافاخيتي
  short: غابات بورجومي ومدينة فاردزيا الصخرية وهضبة جافاخيتي المرتفعة ببحيراتها — مناخان في إقليم واحد.
  body: >-
    ينقسم إقليم سامتسخي-جافاخيتي إلى نصفين مختلفين تماماً. سامتسخي هي وادي متكفاري من بورجومي مروراً بأخالتسيخي
    وصولاً إلى فاردزيا: غابات صنوبر ومياه معدنية وحصون. أما جافاخيتي فهي ما يعلوها، هضبة بركانية على نحو
    2,000 متر فيها بحيرات ورياح وأفق يكاد يخلو من الأشجار.

    بورجومي بلدة استشفاء من القرن التاسع عشر، ويصعد تلفريك من حديقتها إلى الحافة التي تعلوها. وتشتهر أساساً
    بحديقتها المركزية وبالنبع الذي يُشرب منه الماء المعدني الفاتر مباشرة. وفوق البلدة يمتد منتزه بورجومي-خاراغاولي
    الوطني، أحد أكبر المحميات في البلاد، بمسارات معلَّمة تطول لعدة أيام سيراً. وفي أخالتسيخي، قلعة راباتي
    مجمع أُعيد بناؤه بالكامل يقف داخل سور واحد فيه مسجد وكنيسة وكنيس، ويتشبث دير سابارا بمنحدر حاد غير
    بعيد فوقها.

    والموقع الأبرز هو فاردزيا: مدينة كهوف من القرن الثاني عشر نُحتت في الجرف في عهد الملكة تامار، بأنفاق
    ومئات الحجرات المرصوفة على ثلاث عشرة طبقة، وفي قلبها كنيسة رقاد العذراء التي حفظت صورة لتامار رُسمت
    في حياتها. ويحرس حصن خيرتفيسي في الطريق إليها ملتقى نهرين، وهو محطة قصيرة طبيعية قبل فاردزيا.

    وفي جانب جافاخيتي تقع بحيرة بارافاني وبحيرة تاباتسكوري ومرصد أباستوماني، وشتاء قاسٍ فعلاً. وتنقسم
    المواسم تبعاً لذلك: سامتسخي تعمل طوال العام، والهضبة عملياً من يونيو إلى سبتمبر. ومن يتجه جنوباً يستطيع
    ضم النصفين في مسار واحد. يومان هما الحد الأدنى الطبيعي، مع مبيت في بورجومي أو أخالتسيخي.
  driving: >-
    المسار الرئيسي سهل: طريق سريع حتى غوري، ثم عبر خاشوري إلى بورجومي فأخالتسيخي. الإسفلت جيد وسيارة اقتصادية
    تكفي. ومن أخالتسيخي عبر أسبيندزا إلى فاردزيا يضيق الطريق لكنه يبقى معبّداً.

    أما التفرعات فشأن آخر. الكيلومترات الأخيرة إلى سابارا حادة وضيقة، والصعود إلى أباستوماني طريق ملتوٍ،
    والمسلك نحو بحيرة تاباتسكوري غير معبّد؛ ويُنصح في الثلاثة بخلوص أرضي جيد. وعلى هضبة جافاخيتي يكون
    الطقس هو العامل الحاسم. تهبط حرارة الشتاء نحو عشرين تحت الصفر، وتنسف الرياح الثلج على الطريق، والجليد
    الليلي أمر معتاد. وحتى في الصيف تكون الليالي هناك باردة وينزل الضباب سريعاً.

    الوقود متوفر في بورجومي وأخالتسيخي وأسبيندزا؛ أما نحو فاردزيا وفوق الهضبة فالمحطات متباعدة، فاملأ
    الخزان مسبقاً ولا تعتمد على القرية التالية.
  best_for:
  - 'حلقة يومين: بورجومي وأخالتسيخي وفاردزيا'
  - المشي في منتزه بورجومي-خاراغاولي الوطني
  - الينابيع المعدنية وهواء الغابة في بورجومي
  - بحيرات جافاخيتي وسماء الليل المظلمة صيفاً
