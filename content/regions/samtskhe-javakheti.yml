ka:
  name: სამცხე-ჯავახეთი
  short: ბორჯომის ტყეები, ვარძიის კლდის ქალაქი და ჯავახეთის მაღალმთიანი პლატო ტბებით — ერთ რეგიონში ორი
    კლიმატი.
  body: >-
    სამცხე-ჯავახეთი ორ სრულიად განსხვავებულ ნაწილად იყოფა. სამცხე — ეს არის მტკვრის ხეობა ბორჯომიდან ახალციხემდე
    და შემდეგ ვარძიამდე: წიწვოვანი ტყე, მინერალური წყალი და ციხეები. ჯავახეთი კი ზემოთ, ორი ათას მეტრზე
    გაშლილი ვულკანური პლატოა ტბებით, ქარით და ხის გარეშე დარჩენილი ჰორიზონტით.


    ბორჯომი ცენტრალური პარკითა და წყაროთია ცნობილი, საიდანაც ცხელი მინერალური წყალი პირდაპირ ისმევა; ზემოთ
    ბორჯომ-ხარაგაულის ეროვნული პარკია, ქვეყნის ერთ-ერთი უდიდესი დაცული ტერიტორია მრავალდღიანი ბილიკებით.
    ახალციხეში რაბათის ციხეა — სრულად აღდგენილი კომპლექსი, სადაც მეჩეთი, ეკლესია და სინაგოგა ერთ გალავანშია.
    ზემოთ, ციცაბო ფერდობზე, საფარის მონასტერი დგას.


    მთავარი ძეგლი ვარძიაა: XII საუკუნის კლდის ქალაქი, თამარ მეფის დროს გამოკვეთილი, ათეულობით სართულად
    ჩამწკრივებული გვირაბებით, სენაკებითა და ღვთისმშობლის მიძინების ეკლესიით, სადაც თამარის თანადროული
    პორტრეტია შემორჩენილი. 1283 წლის მიწისძვრამ კლდის ნაწილი ჩამოშალა და ქალაქი გარედან გამოაჩინა — სწორედ
    ამიტომ ჩანს დღეს სენაკები ჭრილში. გზაზე, ორი მდინარის შესართავთან, ხერთვისის ციხე დგას, რომელიც ხეობის
    შესასვლელს საუკუნეების განმავლობაში აკონტროლებდა.


    ჯავახეთის მხარეს სხვა რიტმია. ფარავნისა და ტაბაწყურის ტბები ღია, უხეო ლანდშაფტში დევს, სოფლები ქვისაა
    და ძირითადად სომხურენოვანი, ზამთარი კი ქვეყანაში ერთ-ერთი ყველაზე მკაცრი. აბასთუმანში, ტყის ზემოთ,
    საბჭოთა პერიოდის ასტროფიზიკური ობსერვატორია დგას, რომელიც სუფთა ცის გამო აირჩიეს.


    სეზონი მკვეთრად იყოფა: სამცხე მთელი წელი მუშაობს — ბორჯომი ზამთარშიც სასიამოვნოა — ხოლო ჯავახეთის
    პლატო რეალურად ივნისიდან სექტემბრამდეა კომფორტული. ორი დღე ბუნებრივი მინიმუმია, ღამის გათევით ბორჯომში
    ან ახალციხეში; სამი დღე კი პლატოსაც მოიცავს.
  driving: >-
    ძირითადი მარშრუტი მარტივია: ავტობანი გორამდე, შემდეგ ხაშურზე ბორჯომში და ახალციხემდე — ასფალტი კარგია
    და ეკონომ კლასის მანქანა საკმარისი. ახალციხიდან ასპინძაზე ვარძიამდე გზა ვიწროვდება, მაგრამ ასფალტიანი
    რჩება.


    განშტოებები სხვა ისტორიაა. საფარამდე ბოლო რამდენიმე კილომეტრი ციცაბო და ვიწროა, აბასთუმანში ასვლა
    სერპანტინია, ტაბაწყურისკენ კი გრუნტოვანი გზაა — ამ სამივესთვის მაღალი კლირენსი სასურველია. ჯავახეთის
    პლატოზე ამინდი მთავარი ფაქტორია: აქ ზამთარში ტემპერატურა მინუს ოც გრადუსამდე ეცემა, ქარი თოვლს გზაზე
    აგროვებს და ღამით მოყინვა ჩვეულებრივია. ზაფხულშიც კი პლატოზე ღამე ცივია.


    საწვავი ბორჯომში, ახალციხესა და ასპინძაშია; ვარძიის მიმართულებით და პლატოზე გასამართი მწირია — ბაკი
    წინასწარ აავსე. თუ მთის მონაკვეთებს გეგმავ, [ავტოპარკში](/fleet/) SUV უფრო გონივრული არჩევანია.
  best_for:
  - ორდღიანი მარშრუტი ბორჯომი-ახალციხე-ვარძია
  - ლაშქრობა ბორჯომ-ხარაგაულის პარკში
  - მინერალური წყლები და ტყის ჰაერი ბორჯომში
  - ჯავახეთის ტბები და ვარსკვლავიანი ცა ზაფხულში
en:
  name: Samtskhe-Javakheti
  short: >-
    Borjomi forests, the rock city of Vardzia and the high Javakheti plateau with its lakes — two climates
    in one region.
  body: >-
    Samtskhe-Javakheti falls into two quite different halves. Samtskhe is the Mtkvari valley from Borjomi
    through Akhaltsikhe and on to Vardzia: pine forest, mineral water and fortresses. Javakheti is what
    lies above it, a volcanic plateau around 2,000 metres with lakes, wind and a horizon with almost no
    trees on it.


    Borjomi is known for its central park and the spring where the warm mineral water is drunk straight
    from the source. Above the town spreads Borjomi-Kharagauli National Park, one of the largest protected
    areas in the country, with marked routes long enough to take several days. In Akhaltsikhe, Rabati
    Castle is a fully rebuilt complex where a mosque, a church and a synagogue stand inside one set of
    walls, and Sapara Monastery clings to a steep slope not far above.


    The headline site is Vardzia: a twelfth-century cave city cut into the cliff under Queen Tamar, tunnels
    and cells stacked over many levels, with the church of the Dormition preserving a portrait of Tamar
    painted in her lifetime. Khertvisi Fortress guards the confluence of two rivers on the way there.


    On the Javakheti side are Lake Paravani and Lake Tabatskuri, the Abastumani observatory, and a genuinely
    severe winter. The seasons split accordingly: Samtskhe works all year, the plateau realistically from
    June to September. Two days is the natural minimum, with a night in Borjomi or Akhaltsikhe.
  driving: >-
    The main route is easy: motorway to Gori, then through Khashuri to Borjomi and on to Akhaltsikhe.
    The asphalt is good and an economy car is enough. From Akhaltsikhe through Aspindza to Vardzia the
    road narrows but stays surfaced.


    The branches are a different story. The last few kilometres up to Sapara are steep and narrow, the
    climb to Abastumani is a serpentine, and the track towards Lake Tabatskuri is unpaved; for all three,
    ground clearance is advisable. On the Javakheti plateau the weather is the main factor. Winter temperatures
    fall towards minus twenty, wind drifts snow across the road, and overnight ice is normal. Even in
    summer the nights up there are cold and fog can settle quickly.


    Fuel is available in Borjomi, Akhaltsikhe and Aspindza; towards Vardzia and out on the plateau stations
    are sparse, so fill the tank in advance rather than counting on the next village.
  best_for:
  - 'A two-day loop: Borjomi, Akhaltsikhe and Vardzia'
  - Hiking in Borjomi-Kharagauli National Park
  - Mineral springs and forest air at Borjomi
  - The Javakheti lakes and dark skies in summer
ru:
  name: Самцхе-Джавахети
  short: >-
    Боржомские леса, пещерный город Вардзиа и высокогорное Джавахетское плато с озёрами — два климата
    в одном регионе.
  body: >-
    Самцхе-Джавахети делится на две очень разные половины. Самцхе — это долина Куры от Боржоми через Ахалцихе
    до Вардзиа: хвойный лес, минеральная вода и крепости. Джавахети лежит выше: вулканическое плато примерно
    на двух тысячах метров с озёрами, ветром и почти безлесным горизонтом.


    Боржоми известен центральным парком и источником, где тёплую минеральную воду пьют прямо на месте.
    Выше раскинулся Боржоми-Харагаульский национальный парк, одна из крупнейших охраняемых территорий
    страны, с маршрутами на несколько дней. В Ахалцихе стоит полностью восстановленная крепость Рабат,
    где в одних стенах соседствуют мечеть, церковь и синагога, а неподалёку на крутом склоне — монастырь
    Сапара.


    Главный памятник — Вардзиа: пещерный город XII века, вырубленный в скале при царице Тамар, с туннелями
    и кельями в несколько ярусов и церковью Успения, где сохранился прижизненный портрет царицы. По дороге
    туда над слиянием двух рек возвышается крепость Хертвиси.


    На джавахетской стороне ритм другой. Озёра Паравани и Табацкури лежат в открытом безлесном ландшафте,
    сёла каменные и преимущественно армяноязычные, а зима здесь одна из самых суровых в стране. Над лесом
    стоит Абастуманская астрофизическая обсерватория, построенная в советское время именно ради чистого
    неба.


    Сезоны делятся соответственно: Самцхе работает круглый год, и Боржоми хорош даже зимой, а плато комфортно
    реально с июня по сентябрь. Два дня — естественный минимум, с ночёвкой в Боржоми или Ахалцихе; три
    дня позволяют добавить и озёра.
  driving: >-
    Основной маршрут прост: магистраль до Гори, затем через Хашури в Боржоми и далее в Ахалцихе. Асфальт
    приличный, машины эконом-класса достаточно. От Ахалцихе через Аспиндзу к Вардзиа дорога сужается,
    но покрытие сохраняется.


    Ответвления сложнее. Последние километры к Сапаре крутые и узкие, подъём в Абастумани — серпантин,
    дорога к Табацкури грунтовая; на всех трёх клиренс желателен. На Джавахетском плато погода решает
    всё: зимой температура падает до минус двадцати, ветер наметает снег на дорогу, ночная гололедица
    обычна. Даже летом ночи наверху холодные, а туман приходит быстро.


    Заправки есть в Боржоми, Ахалцихе и Аспиндзе; в сторону Вардзиа и на плато их мало, поэтому бак заполняйте
    заранее, а не в расчёте на следующее село.
  best_for:
  - Двухдневное кольцо Боржоми - Ахалцихе - Вардзиа
  - Треккинг в Боржоми-Харагаульском парке
  - Минеральные источники и лесной воздух Боржоми
  - Озёра Джавахети и звёздное небо летом
fa:
  name: سامتسخه-جاواختی
  short: جنگل‌های بورجومی، شهر صخره‌ای واردزیا و فلات بلند جاواختی با دریاچه‌هایش — دو اقلیم در یک منطقه.
  body: >-
    سامتسخه-جاواختی به دو نیمهٔ کاملاً متفاوت تقسیم می‌شود. سامتسخه درهٔ متکواری است از بورجومی تا آخالتسیخه
    و از آنجا تا واردزیا: جنگل کاج، آب معدنی و دژها. جاواختی آن چیزی است که بالای آن قرار دارد؛ فلاتی
    آتشفشانی در حدود 2,000 متر با دریاچه‌ها، باد و افقی که تقریباً هیچ درختی روی آن نیست.

    بورجومی شهر آب‌درمانی سدهٔ نوزدهم است و به پارک مرکزی و چشمه‌اش شهرت دارد، جایی که آب معدنی گرم را
    مستقیم از سرچشمه می‌نوشند. بالای شهر پارک ملی بورجومی-خاراگاولی گسترده است، یکی از بزرگ‌ترین مناطق
    حفاظت‌شدهٔ کشور، با مسیرهای علامت‌گذاری‌شده‌ای که چند روز طول می‌کشند. در آخالتسیخه، قلعهٔ راباتی
    مجموعه‌ای کاملاً بازسازی‌شده است که در آن یک مسجد، یک کلیسا و یک کنیسه درون یک حصار ایستاده‌اند، و
    صومعهٔ ساپارا کمی بالاتر به دامنه‌ای تند چسبیده است.

    جاذبهٔ اصلی واردزیا است: شهری غاری از سدهٔ دوازدهم که در زمان ملکه تامار در صخره کنده شد، با تونل‌ها
    و صدها حجره روی هم در سیزده طبقه، و کلیسای خوابیدگی مریم که پرترهٔ تامار را از زمان حیات او نگه داشته
    است. دژ خرتویسی در راه، محل تلاقی دو رود را پاس می‌دارد.

    در سمت جاواختی دریاچهٔ پاراوانی و دریاچهٔ تاباتسکوری، رصدخانهٔ آباستومانی و زمستانی به‌راستی سخت قرار
    دارد. فصل‌ها هم به همین ترتیب جدا می‌شوند: سامتسخه تمام سال کار می‌کند و فلات عملاً از ژوئن تا سپتامبر.
    دو روز حداقل طبیعی است، با یک شب در بورجومی یا آخالتسیخه.
  driving: >-
    مسیر اصلی آسان است: بزرگراه تا گوری، سپس از خاشوری به بورجومی و از آنجا به آخالتسیخه. آسفالت خوب است
    و خودروی اقتصادی کافی. از آخالتسیخه از راه اسپیندزا تا واردزیا جاده باریک‌تر می‌شود اما آسفالت باقی
    می‌ماند.

    انشعاب‌ها داستان دیگری‌اند. چند کیلومتر آخر تا ساپارا تند و باریک است، صعود به آباستومانی سرپیچ است
    و راه دریاچهٔ تاباتسکوری خاکی؛ برای هر سه ارتفاع کف توصیه می‌شود. روی فلات جاواختی عامل اصلی آب‌وهواست.
    دمای زمستان به منهای بیست نزدیک می‌شود، باد برف را روی جاده می‌نشاند و یخ‌زدگی شبانه عادی است. حتی
    در تابستان شب‌های آن بالا سرد است و مه به‌سرعت می‌نشیند.

    سوخت در بورجومی، آخالتسیخه و اسپیندزا هست؛ به سوی واردزیا و روی فلات پمپ‌بنزین‌ها پراکنده‌اند، پس
    باک را از پیش پر کنید و به روستای بعدی امید نبندید.
  best_for:
  - 'حلقهٔ دو روزه: بورجومی، آخالتسیخه و واردزیا'
  - پیاده‌روی در پارک ملی بورجومی-خاراگاولی
  - چشمه‌های معدنی و هوای جنگلی بورجومی
  - دریاچه‌های جاواختی و آسمان تاریک در تابستان
he:
  name: סמצחה-ג'אוואחתי
  short: יערות בורג'ומי, עיר הסלע ורדזיה ורמת ג'אוואחתי הגבוהה עם אגמיה — שני אקלימים באזור אחד.
  body: >-
    סמצחה-ג'אוואחתי מתחלקת לשני חצאים שונים מאוד זה מזה. סמצחה היא עמק המטקווארי מבורג'ומי דרך אחאלציחה
    והלאה עד ורדזיה: יער אורנים, מים מינרליים ומבצרים. ג'אוואחתי היא מה שנמצא מעליה, רמה וולקנית בגובה
    של כ-2,000 מטר עם אגמים, רוח ואופק שאין עליו כמעט עצים.

    בורג'ומי היא עיירת מרפא מן המאה ה-19, ורכבל מוביל מן הפארק אל הרכס שמעליה. היא מוכרת בעיקר בזכות הפארק
    המרכזי שלה והמעיין שבו שותים את המים המינרליים החמימים היישר מהמקור. מעל העיר משתרע הפארק הלאומי בורג'ומי-חראגאולי,
    אחת השמורות הגדולות במדינה, עם מסלולים מסומנים ארוכים דיים לכמה ימי הליכה. באחאלציחה, מבצר רבאטי הוא
    מתחם משוחזר לגמרי שבתוך חומה אחת עומדים בו מסגד, כנסייה ובית כנסת, ומנזר סאפארה נאחז במדרון תלול לא
    הרחק מעליו.

    האתר המרכזי הוא ורדזיה: עיר מערות מן המאה ה-12 שנחצבה בצוק בימי המלכה תמר, מנהרות ומאות תאים הערוכים
    בשלוש עשרה קומות, ובליבה כנסיית ההירדמות ששימרה דיוקן של תמר שצויר עוד בחייה. מבצר חרתוויסי שומר בדרך
    לשם על מפגש שני נהרות, והוא עצירה קצרה וטבעית לפני ורדזיה.

    בצד של ג'אוואחתי נמצאים אגם פאראווני ואגם טבצקורי, מצפה הכוכבים של אבסתומני וחורף קשה באמת. העונות
    נחלקות בהתאם: סמצחה עובדת כל השנה, והרמה מעשית מיוני עד ספטמבר. מי שנוסע דרומה יכול לחבר את שני החצאים
    למסלול אחד. יומיים הם המינימום הטבעי, עם לינה בבורג'ומי או באחאלציחה.
  driving: >-
    המסלול הראשי קל: כביש מהיר עד גורי, משם דרך חשורי לבורג'ומי והלאה לאחאלציחה. האספלט טוב ורכב חסכוני
    מספיק. מאחאלציחה דרך אספינדזה לוורדזיה הכביש מצטמצם אך נשאר סלול.

    ההסתעפויות הן סיפור אחר. הקילומטרים האחרונים אל סאפארה תלולים וצרים, העלייה לאבסתומני היא סרפנטינה,
    והדרך לאגם טבצקורי אינה סלולה; בשלושתם מומלץ גובה גחון. על רמת ג'אוואחתי מזג האוויר הוא הגורם המרכזי.
    טמפרטורות החורף יורדות לכיוון מינוס עשרים, הרוח מעיפה שלג על הכביש וקרח לילי הוא דבר רגיל. גם בקיץ
    הלילות שם למעלה קרים והערפל יורד במהירות.

    דלק יש בבורג'ומי, באחאלציחה ובאספינדזה; לכיוון ורדזיה ועל הרמה התחנות דלילות, לכן מלאו את המכל מראש
    ואל תסמכו על הכפר הבא.
  best_for:
