ka:
  name: აჭარა
  short: ბათუმი, შავი ზღვის სანაპირო და ზემო აჭარის მთები — საქართველოს ყველაზე წვიმიანი და ყველაზე მწვანე
    კუთხე.
  body: >-
    აჭარა საქართველოს სამხრეთ-დასავლეთ კუთხეა: ვიწრო სანაპირო ზოლი და მის უკან სწრაფად ამაღლებული მთები.
    ეს ქვეყნის ყველაზე ნოტიო რეგიონია და მისი მწვანე სიხშირეც სწორედ აქედან მოდის.


    ბათუმი სანაპიროს ცენტრია — თანამედროვე მაღლივი შენობები ძველი ევროპული ყაიდის კვარტლების გვერდით,
    ექვსკილომეტრიანი ბულვარი ზღვის პირას და ბოტანიკური ბაღი ქალაქის ჩრდილოეთით, სადაც სუბტროპიკული კოლექცია
    პირდაპირ ზღვის თავზე, ტერასებადაა გაშლილი. ქალაქი მთელი წელი ცოცხალია და ზამთარშიც არ იცლება, თუმცა
    ზღვა მხოლოდ ზაფხულში ვარგა. სამხრეთით, თურქეთის საზღვართან ახლოს, გონიო-აფსაროსის რომაული ციხეა; ჩრდილოეთით
    — ქობულეთის პლაჟი და პეტრას ციხე ციხისძირში.


    სანაპიროდან შიგნით შესვლა სულ სხვა აჭარაა. მახუნცეთის ჩანჩქერი და გვერდით მდგარი შუა საუკუნეების თაღოვანი
    ხიდი ბათუმიდან ერთ საათშია. მთირალას ეროვნული პარკი — სახელი „მტირალას" ნიშნავს — ევროპის ერთ-ერთი
    ყველაზე წვიმიანი ადგილია და წელიწადში ოთხი ათას მილიმეტრამდე ნალექი მოდის. კიდევ უფრო ზემოთ, აჭარისწყლის
    ხეობაში, ხულოა საბაგიროთი, ქვის სოფლებითა და გოდერძის უღელტეხილისკენ მიმავალი გზით.


    აჭარას საკუთარი კულინარიული სახეც აქვს: აჭარული ხაჭაპური, ბორანო და რძის კერძები აქ ყოველდღიური საკვებია
    და არა ტურისტული ატრაქციონი. ბათუმი ამავე დროს დიდი საპორტო ქალაქია, ამიტომ სეზონზე ხალხმრავლობა და
    ფასების ზრდა ბუნებრივია.


    სეზონი ორად იყოფა: ზღვა ივნისიდან სექტემბრამდე მუშაობს, ქალაქი და მთა კი გაზაფხულსა და შემოდგომაზეც
    სასიამოვნოა, როცა სანაპირო ბევრად მშვიდია. ორი-სამი დღე კარგი მინიმუმია ბათუმში ბაზით, მეტი — თუ ხეობაში
    ასვლას გეგმავ.
  driving: >-
    მთავარი, რაც აჭარაზე უნდა იცოდე: ეს საქართველოს ყველაზე წვიმიანი კუთხეა. წვიმა ნებისმიერ სეზონში მოდის,
    ხშირად უეცრად და ძალიან ინტენსიურად; ხილვადობა წუთებში ეცემა, გზაზე წყალი გუბდება და მთის მონაკვეთებზე
    ქვები და ტოტები ცვივა. აქ ყოველთვის მეტი დისტანცია და ნაკლები სიჩქარე გჭირდება, ვიდრე აღმოსავლეთ საქართველოში.


    სანაპირო მაგისტრალი ბათუმიდან ქობულეთისა და გონიოს მიმართულებით კარგია. პრობლემა ბათუმის შიგნითაა:
    ზაფხულში ცენტრში პარკირება რთულია, ბულვარის მიდამოებში ადგილი პრაქტიკულად არაა, ხოლო ცალმხრივი ქუჩების
    ქსელი დამაბნეველია — ჯობს ფასიან სადგომზე დატოვება და ფეხით სიარული.


    ზემო აჭარისკენ გზა ხულომდე ასფალტიანია, თუმცა ვიწრო და მოსახვევებიანი. მის ზემოთ, გოდერძის უღელტეხილისკენ,
    მონაკვეთები კვლავ დაუფარავია და მაღალ კლირენსს მოითხოვს; ზამთარში უღელტეხილი თოვლის გამო ხშირად გაუვალია.
    საწვავი ბათუმში, ქობულეთსა და ქედაშია — ხულოს ზემოთ იშვიათია.
  best_for:
  - სამი დღე ბათუმში ზღვასთან ერთად
  - ერთდღიანი გასვლა მახუნცეთსა და მთირალაში
  - გონიო-აფსაროსი და პეტრა ისტორიის მოყვარულთათვის
  - ზემო აჭარა და ხულოს საბაგირო ზაფხულში
en:
  name: Adjara
  short: Batumi, the Black Sea coast and the mountains of Upper Adjara — Georgia's wettest and greenest
    corner.
  body: >-
    Adjara is the south-western corner of Georgia: a narrow coastal strip with mountains rising steeply
    behind it. It is the wettest region in the country, and its dense green is a direct result of that.


    Batumi is the centre of the coast, a mixture of modern towers and older European-styled quarters,
    with a boulevard running some six kilometres along the shore. North of the city the Botanical Garden
    spreads its subtropical collection over terraces directly above the sea. To the south, close to the
    Turkish border, stands the Roman fortress of Gonio-Apsaros; to the north lie the long beach at Kobuleti
    and the ruins of Petra at Tsikhisdziri.


    Turning inland gives a completely different Adjara. Makhuntseti Waterfall, with a medieval arched
    bridge beside it, is an hour from Batumi. Mtirala National Park — the name means "the crying one"
    — is one of the rainiest places in Europe, receiving up to four thousand millimetres a year. Higher
    again, in the Adjaristsqali valley, Khulo has a cable car, stone villages and the road towards the
    Goderdzi Pass.


    The season splits in two. The sea works from June to September, while the city and the mountains are
    pleasant in spring and autumn as well, when the coast is far quieter. Two or three days is a good
    minimum with a base in Batumi, more if you intend to go up the valley.
  driving: >-
    The main thing to know about Adjara is that it is the wettest region in Georgia. Rain arrives in any
    season, often suddenly and very hard. Visibility drops within minutes, water pools across the carriageway,
    and on mountain sections stones and branches come down onto the road. You need more following distance
    and less speed here than anywhere in the east of the country.


    The coastal highway towards Kobuleti and Gonio is good. The difficulty is inside Batumi: in summer
    central parking is scarce, there is effectively none near the boulevard, and the one-way system is
    confusing. Leave the car in a paid lot and walk.


    Towards Upper Adjara the road is surfaced as far as Khulo, though narrow and full of bends. Above
    that, on the way to the Goderdzi Pass, unsurfaced sections remain and ground clearance is needed;
    in winter the pass is frequently impassable with snow. Fuel is easy in Batumi, Kobuleti and Keda,
    and rare above Khulo — see [pricing](/pricing/) if you are weighing a larger car for this leg.
  best_for:
  - Three days in Batumi with the sea
  - A day trip to Makhuntseti and Mtirala
  - Gonio-Apsaros and Petra for history
  - Upper Adjara and the Khulo cable car in summer
ru:
  name: Аджария
  short: Батуми, черноморское побережье и горы Верхней Аджарии — самый дождливый и самый зелёный угол
    Грузии.
  body: >-
    Аджария — юго-западный угол Грузии: узкая полоса побережья и круто поднимающиеся за ней горы. Это
    самый влажный регион страны, и густая зелень здесь — прямое следствие обилия дождей.


    Центр побережья — Батуми, смесь современных башен и старых кварталов в европейском духе, с бульваром
    длиной около шести километров вдоль моря. Севернее города Ботанический сад разворачивает субтропическую
    коллекцию на террасах прямо над водой. К югу, у самой турецкой границы, стоит римская крепость Гонио-Апсарос;
    к северу — длинный пляж Кобулети и руины Петры в Цихисдзири.


    Поворот вглубь открывает совсем другую Аджарию. Водопад Махунцети с соседним средневековым арочным
    мостом лежит в часе от Батуми. Национальный парк Мтирала, чьё название переводится как «плачущий»,
    — одно из самых дождливых мест Европы, до четырёх тысяч миллиметров осадков в год. Ещё выше, в ущелье
    Аджарисцкали, находится Хуло с канатной дорогой, каменными сёлами и дорогой к перевалу Годердзи.


    У Аджарии есть и собственное кулинарное лицо: аджарский хачапури, борано и молочные блюда здесь повседневная
    еда, а не аттракцион для гостей. Батуми при этом крупный портовый город, поэтому в сезон многолюдно,
    а цены заметно выше.


    Сезон делится надвое. Море работает с июня по сентябрь, а город и горы приятны также весной и осенью,
    когда побережье заметно спокойнее. Два-три дня — хороший минимум с базой в Батуми, больше — если планируется
    подъём в ущелье.
  driving: >-
    Главное про Аджарию: это самый дождливый регион Грузии. Дождь идёт в любой сезон, часто внезапно и
    очень сильно. Видимость падает за считанные минуты, вода стоит на проезжей части, а на горных участках
    на дорогу выносит камни и ветки. Дистанцию здесь нужно держать больше, а скорость ниже, чем на востоке
    страны.


    Прибрежная трасса в сторону Кобулети и Гонио хорошая. Сложности начинаются в самом Батуми: летом в
    центре мало парковочных мест, у бульвара их фактически нет, а система односторонних улиц сбивает с
    толку. Разумнее оставить машину на платной стоянке и идти пешком.


    В сторону Верхней Аджарии асфальт держится до Хуло, хотя дорога узкая и извилистая. Выше, к перевалу
    Годердзи, сохраняются участки без покрытия, и клиренс необходим; зимой перевал часто непроходим из-за
    снега. Заправки есть в Батуми, Кобулети и Кеде, выше Хуло они редки.
  best_for:
  - Три дня в Батуми с морем
  - Однодневный выезд к Махунцети и в Мтирала
  - Гонио-Апсарос и Петра для любителей истории
  - Верхняя Аджария и канатная дорога Хуло летом
fa:
  name: آجارا
  short: باتومی، ساحل دریای سیاه و کوه‌های آجارای علیا — مرطوب‌ترین و سرسبزترین گوشهٔ گرجستان.
  body: >-
    آجارا گوشهٔ جنوب‌غربی گرجستان است: نواری باریک از ساحل با کوه‌هایی که بلافاصله پشت آن تند بالا می‌روند.
    مرطوب‌ترین منطقهٔ کشور است و سبزی انبوهش نتیجهٔ مستقیم همین بارندگی است.

    باتومی مرکز ساحل است؛ آمیزه‌ای از برج‌های مدرن و محله‌های قدیمی‌تر به سبک اروپایی، با گردشگاهی که
    نزدیک شش کیلومتر در امتداد دریا کشیده شده است. شمال شهر، باغ گیاه‌شناسی مجموعهٔ نیمه‌گرمسیری خود را
    روی مصطبه‌هایی درست بالای دریا پهن کرده است. در قلب شهر، میدان پیاتزا، برج الفبا و تله‌کابینی که تا
    بالای تپه می‌رود بیشترین بازدیدکننده را دارند. در جنوب، نزدیک مرز ترکیه، دژ رومی گونیو-آپساروس ایستاده
    است؛ در شمال، ساحل بلند کوبولتی و ویرانه‌های پترا در تسیخیسدزیری قرار دارد.

    رو به داخل که بپیچید، آجارای کاملاً دیگری می‌بینید. آبشار ماخونتستی، با پلی طاق‌دار از سده‌های میانه
    در کنارش، یک ساعت با باتومی فاصله دارد. پارک ملی متیرالا — نامش یعنی «گریان» — یکی از پربارش‌ترین
    جاهای اروپاست و تا چهار هزار میلی‌متر باران در سال دریافت می‌کند؛ در آن مسیری کوتاه و یک پل معلق بر
    فراز رودخانه هست. بالاتر، در درهٔ آجاریس‌تسکالی، خولو تله‌کابین، روستاهای سنگی و جاده‌ای به سوی گردنهٔ
    گودردزی دارد.

    فصل به دو نیم تقسیم می‌شود. دریا از ژوئن تا سپتامبر کار می‌کند، در حالی که شهر و کوهستان در بهار و
    پاییز هم دلپذیرند، وقتی ساحل بسیار آرام‌تر است. در ژوئیه و اوت ساحل شلوغ و گران است؛ ماه مه، ژوئن
    و سپتامبر آرام‌تر و ارزان‌ترند. دو یا سه روز با پایگاه باتومی حداقل خوبی است، و بیشتر اگر قصد بالا
    رفتن از دره را دارید.
  driving: >-
    مهم‌ترین نکته دربارهٔ آجارا این است که مرطوب‌ترین منطقهٔ گرجستان است. باران در هر فصلی می‌آید، اغلب
    ناگهانی و بسیار شدید. دید در چند دقیقه افت می‌کند، آب روی جاده جمع می‌شود و در مقاطع کوهستانی سنگ
    و شاخه فرو می‌ریزد. اینجا بیش از هر جای شرق کشور به فاصلهٔ ایمنی بیشتر و سرعت کمتر نیاز دارید.

    بزرگراه ساحلی به سوی کوبولتی و گونیو خوب است. دشواری داخل باتومی است: در تابستان پارکینگ مرکزی کمیاب
    است، نزدیک گردشگاه عملاً وجود ندارد و مسیرهای یک‌طرفه گیج‌کننده‌اند. خودرو را در پارکینگ پولی بگذارید
    و پیاده بروید.

    به سوی آجارای علیا جاده تا خولو آسفالت است، هرچند باریک و پرپیچ. بالاتر از آن، در راه گردنهٔ گودردزی،
    مقاطع خاکی باقی مانده و ارتفاع کف لازم است؛ زمستان‌ها گردنه بارها به‌خاطر برف غیرقابل عبور می‌شود.
    سوخت در باتومی، کوبولتی و کدا آسان است و بالاتر از خولو نادر — [قیمت‌ها](/pricing/) را ببینید.
  best_for:
  - سه روز در باتومی همراه با دریا
  - سفر یک‌روزه به ماخونتستی و متیرالا
  - گونیو-آپساروس و پترا برای تاریخ
  - آجارای علیا و تله‌کابین خولو در تابستان
he:
  name: אג'ריה
  short: בטומי, חוף הים השחור והרי אג'ריה העילית — הפינה הלחה והירוקה ביותר בגאורגיה.
  body: >-
    אג'ריה היא הפינה הדרום-מערבית של גאורגיה: רצועת חוף צרה שמאחוריה מתרוממים הרים בתלילות. זהו האזור
    הגשום ביותר במדינה, והירוק הסמיך שלו הוא תוצאה ישירה של כך: יער עבות, מטעי הדרים ומטעי תה על המדרונות.

    בטומי היא מרכז החוף, תערובת של מגדלים מודרניים ורבעים ישנים בסגנון אירופי, עם טיילת שנמתחת כשישה קילומטרים
    לאורך הים ומוארת בערב. מצפון לעיר פורש הגן הבוטני את אוסף הצמחייה הסובטרופית שלו על מדרגות ממש מעל
    המים. בלב העיר נמצאים כיכר הפיאצה, מגדל האלפבית והרכבל שעולה אל הרכס שמעל. בדרום, סמוך לגבול הטורקי,
    ניצב המבצר הרומי גוניו-אפסארוס; ובצפון נמצאים החוף הארוך של קובולטי וחורבות פטרה בציחיסדזירי.

    פנייה פנימה אל ההרים חושפת אג'ריה אחרת לגמרי. מפל מאחונצטי, ולצידו גשר אבן מקומר מימי הביניים, נמצא
    שעה נסיעה מבטומי. הפארק הלאומי מטירלה — שמו פירושו "הבוכה" — הוא מהמקומות הגשומים באירופה ומקבל עד
    ארבעת אלפים מילימטר בשנה, ויש בו מסלול הליכה קצר וגשר תלוי מעל הנחל. גבוה יותר, בעמק אג'ריסצקאלי,
    יש בחולו רכבל, כפרי אבן והדרך לעבר מעבר גודרדזי.

    העונה מתפצלת לשתיים. הים עובד מיוני עד ספטמבר, ואילו העיר וההרים נעימים גם באביב ובסתיו, כשהחוף שקט
    הרבה יותר. ביולי ובאוגוסט החוף עמוס והמחירים גבוהים, ואילו מאי, יוני וספטמבר רגועים וזולים יותר. יומיים
    או שלושה הם מינימום סביר עם בסיס בבטומי, ויותר מכך אם בכוונתכם לעלות אל תוך העמק.
  driving: >-
    הדבר החשוב ביותר לדעת על אג'ריה הוא שזהו האזור הגשום ביותר בגאורגיה. הגשם מגיע בכל עונה, לעיתים קרובות
    בפתאומיות ובעוצמה רבה. הראות יורדת תוך דקות, מים נאספים על הכביש, ובקטעי ההרים נופלים אבנים וענפים
    על הדרך. כאן דרוש מרחק גדול יותר מהרכב שלפניכם ומהירות נמוכה יותר מכל מקום במזרח המדינה.

    כביש החוף לכיוון קובולטי וגוניו טוב. הקושי הוא בתוך בטומי: בקיץ החניה במרכז מועטה, ליד הטיילת אין
    כמעט חניה כלל, ומערך החד-סטריים מבלבל. השאירו את הרכב בחניון בתשלום ולכו ברגל.

    לעבר אג'ריה העילית הכביש סלול עד חולו, אם כי צר ומלא פניות. מעליה, בדרך למעבר גודרדזי, נותרו קטעים
    לא סלולים ונדרש גובה גחון; בחורף המעבר חסום פעמים רבות בשלג. דלק זמין בבטומי, בקובולטי ובקדה ונדיר
    מעל חולו — עיינו ב[מחירים](/pricing/) אם אתם שוקלים רכב גדול יותר לקטע הזה.
  best_for:
  - שלושה ימים בבטומי עם הים
  - טיול יום למאחונצטי ולמטירלה
  - גוניו-אפסארוס ופטרה לחובבי היסטוריה
  - אג'ריה העילית והרכבל של חולו בקיץ
ar:
  name: أدجارا
  short: باتومي وساحل البحر الأسود وجبال أدجارا العليا — أكثر أركان جورجيا مطراً وأشدها اخضراراً.
  body: >-
    أدجارا هي الركن الجنوبي الغربي من جورجيا: شريط ساحلي ضيق ترتفع خلفه الجبال بحدة. وهي أكثر مناطق البلاد
    مطراً، واخضرارها الكثيف نتيجة مباشرة لذلك.

    باتومي مركز الساحل، مزيج من الأبراج الحديثة والأحياء القديمة ذات الطراز الأوروبي، مع كورنيش يمتد نحو
    ستة كيلومترات على البحر. وشمال المدينة تنشر الحديقة النباتية مجموعتها شبه المدارية على مصاطب فوق الماء
    مباشرة. وفي قلب المدينة تقع ساحة بياتزا وبرج الأبجدية والتلفريك الصاعد إلى الحافة المطلة. وإلى الجنوب،
    قرب الحدود التركية، يقوم حصن غونيو-أبساروس الروماني؛ وإلى الشمال يمتد شاطئ كوبوليتي الطويل وأطلال
    بيترا في تسيخيسدزيري.

    والاتجاه نحو الداخل يكشف أدجارا مختلفة تماماً. شلال ماخونتسيتي، وإلى جانبه جسر حجري مقوّس من العصور
    الوسطى، على بعد ساعة من باتومي. ومنتزه متيرالا الوطني — واسمه يعني «الباكي» — من أكثر البقاع مطراً
    في أوروبا، إذ يتلقى حتى أربعة آلاف مليمتر سنوياً، وفيه مسار قصير للمشي وجسر معلق فوق المجرى. وأعلى
    من ذلك، في وادي أدجاريستسكالي، تضم خولو تلفريكاً وقرى حجرية والطريق نحو ممر غوديردزي.

    ينقسم الموسم إلى نصفين. البحر يعمل من يونيو إلى سبتمبر، بينما تبقى المدينة والجبال لطيفة في الربيع
    والخريف أيضاً، حين يكون الساحل أهدأ بكثير. في يوليو وأغسطس يزدحم الساحل وترتفع الأسعار، بينما تكون
    أشهر مايو ويونيو وسبتمبر أهدأ وأرخص. يومان أو ثلاثة حد أدنى معقول مع الإقامة في باتومي، وأكثر إن كنت
    تنوي الصعود إلى الوادي.
  driving: >-
    أهم ما ينبغي معرفته عن أدجارا أنها أكثر مناطق جورجيا مطراً. المطر يأتي في أي فصل، وغالباً فجأة وبغزارة
    شديدة. تنخفض الرؤية خلال دقائق، ويتجمع الماء على سطح الطريق، وفي المقاطع الجبلية تتساقط الحجارة والأغصان
    على المسار. تحتاج هنا إلى مسافة أمان أكبر وسرعة أقل من أي مكان في شرق البلاد.

    الطريق الساحلي نحو كوبوليتي وغونيو جيد. الصعوبة داخل باتومي: مواقف السيارات في المركز شحيحة صيفاً،
    ولا تكاد توجد قرب الكورنيش، ونظام الاتجاه الواحد محيّر. اترك السيارة في موقف مدفوع وامشِ.

    نحو أدجارا العليا يبقى الطريق معبّداً حتى خولو، وإن كان ضيقاً وكثير المنعطفات. وفوقها، في الطريق إلى
    ممر غوديردزي، ما زالت هناك مقاطع غير معبّدة ويلزم خلوص أرضي؛ وفي الشتاء يتعذر عبور الممر مراراً بسبب
    الثلج. الوقود متوفر في باتومي وكوبوليتي وكيدا، ونادر فوق خولو — راجع [الأسعار](/pricing/) إن كنت تفكر
    في سيارة أكبر لهذا المقطع.
  best_for:
  - ثلاثة أيام في باتومي مع البحر
  - رحلة يوم إلى ماخونتسيتي ومتيرالا
  - غونيو-أبساروس وبيترا لعشاق التاريخ
  - أدجارا العليا وتلفريك خولو في الصيف
