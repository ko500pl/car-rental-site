ka:
  name: იმერეთი
  short: ქუთაისი, გელათი და კარსტული სამყარო — მღვიმეები, კანიონები და ჩანჩქერები ერთ საათში ერთმანეთისგან.
  body: >-
    იმერეთი დასავლეთ საქართველოს გულია და ის რეგიონია, სადაც კლიმატი შესამჩნევად იცვლება: ჰაერი ნოტიოა,
    მცენარეულობა უფრო ხშირი, ზამთარი კი ბევრად რბილი, ვიდრე აღმოსავლეთში. ცენტრი ქუთაისია — საქართველოს
    ერთ-ერთი უძველესი ქალაქი, კოლხეთის სამეფოს მემკვიდრე, დღეს კი ხმაურიანი ბაზრით, მდინარე რიონითა და
    ბაგრატის ტაძრით ბორცვზე.


    ქალაქის გარეთ, ათიოდე კილომეტრში, გელათის მონასტერია — დავით აღმაშენებლის მიერ 1106 წელს დაარსებული
    სამონასტრო და სააკადემიო კომპლექსი, იუნესკოს სიაში, ქართული მოზაიკისა და ფრესკის მთავარი საგანძური.
    გვერდით, ხეობის თავზე, პატარა მოწამეთა დგას.


    მეორე ფენა კარსტულია. პრომეთეს მღვიმე გრძელი, განათებული დარბაზებით და მიწისქვეშა მდინარით; სათაფლიის
    ნაკრძალი, სადაც დინოზავრის ნაფეხურები და მღვიმეა ერთად; ოკაცეს კანიონი ხეობის თავზე გამავალი ლითონის
    ბილიკით; კინჩხის ჩანჩქერი, რომელიც ორასამდე მეტრზე ეშვება. ჩრდილო-აღმოსავლეთით, ჭიათურასთან, ქაცხის
    სვეტი დგას — ორმოცმეტრიანი კირქვის ბოძი პატარა ეკლესიით თავზე. სამხრეთით საირმის კურორტი მინერალურ
    წყლებს სთავაზობს.


    ქუთაისი ბაზად კარგად მუშაობს: ყველა ჩამოთვლილი ობიექტი ქალაქიდან ერთი საათის რადიუსშია, სასტუმროები
    ბევრია და საღამოს ქალაქში დაბრუნება ყოველთვის ხერხდება. აქვეა საერთაშორისო აეროპორტი, ამიტომ ბევრი
    მოგზაურობა სწორედ იმერეთიდან იწყება.


    სეზონი გრძელია: მღვიმეები და ტაძრები მთელი წელი მუშაობს, კანიონები და ჩანჩქერები კი მაისიდან ოქტომბრამდე
    ჯობს, რადგან ზამთარში ლითონის ბილიკები სრიალდება და წყალი მღვრიეა. ორი დღე კომფორტული მინიმუმია, ღამის
    გათევით ქუთაისში; სამი დღე კი საშუალებას გაძლევს, ჩრდილოეთით ქაცხის სვეტამდეც ახვიდე და საირმეშიც
    შეიარო.
  driving: >-
    იმერეთში მისვლა ლიხის ქედის გადალახვას ნიშნავს. მთავარი მაგისტრალი E60 რიკოთის უღელტეხილზე გადის და
    ბოლო წლებში ეტაპობრივად გადაკეთდა ახალი გვირაბებითა და ხიდებით; ნაწილი უკვე მუშაობს, ნაწილზე კი სამშენებლო
    შემოვლები და შეფერხებებია — გასვლამდე დროის მარაგი გაითვალისწინე. თავად ქუთაისამდე და ქალაქის შიგნით
    ასფალტი კარგია და ეკონომ კლასის მანქანა საკმარისი.


    ღირსშესანიშნაობებამდე მისასვლელი გზები არათანაბარია. გელათამდე და პრომეთემდე ასფალტია; ოკაცემდე ბოლო
    მონაკვეთი უფრო უხეშია, კინჩხის ჩანჩქერამდე კი გრუნტოვანი გზაა, რომელიც წვიმის შემდეგ საგრძნობლად უარესდება
    — აქ მაღალი კლირენსია საჭირო. ნისლი დილით ხშირია და დასავლეთ საქართველოში წვიმა უეცრად იწყება; საბურავებზე
    ნაკლები დამოკიდებულება და ნელი სვლა უფრო გამოსადეგია, ვიდრე დროის მოგება. საწვავი ქუთაისში, ზესტაფონსა
    და ხონშია.
  best_for:
  - ორდღიანი ბაზა ქუთაისში
  - გელათი და ბაგრატი ერთ დილაში
  - მღვიმეები და კანიონები ბავშვებთან ერთად
  - გაჩერება ბათუმისკენ ან სვანეთისკენ გზაზე
en:
  name: Imereti
  short: Kutaisi, Gelati and a karst landscape — caves, canyons and waterfalls within an hour of each
    other.
  body: >-
    Imereti is the heart of western Georgia and the region where the climate visibly changes: the air
    is humid, the vegetation thicker and the winter much milder than in the east. Its centre is Kutaisi,
    one of the oldest cities in the country and heir to the kingdom of Colchis, today a busy place of
    markets, the Rioni river and Bagrati Cathedral on its hill.


    Ten kilometres out of town stands Gelati Monastery, founded by King David the Builder in 1106 as both
    a monastery and an academy, UNESCO-listed and the single most important store of Georgian mosaic and
    fresco painting. Small Motsameta sits nearby on a bend above the gorge, on a rock spur with a drop
    on three sides.


    The second layer here is karst. Prometheus Cave offers long lit galleries and an underground river;
    Sataplia Nature Reserve combines dinosaur footprints with a cave and a glass viewing platform; Okatse
    Canyon is crossed by a metal walkway suspended above the gorge; Kinchkha Waterfall drops in stages
    down a limestone wall. North-east, near Chiatura, the Katskhi Pillar rises some forty metres with
    a small church on top. To the south, Sairme is a mineral water resort in the forest.


    The season is long. Caves and churches work all year, while canyons and waterfalls are best from May
    to October, since the walkways get slippery in winter. Two days is a comfortable minimum with a night
    in Kutaisi, and the region fits neatly into any longer route west.
  driving: >-
    Getting into Imereti means crossing the Likhi range. The main E60 runs over the Rikoti Pass and has
    been rebuilt in stages with new tunnels and bridges; parts are open, and on other parts you can still
    meet construction detours and delays, so allow slack in the schedule rather than a precise arrival
    time. As far as Kutaisi and inside the city the asphalt is good and an economy car is enough.


    Access roads to the sites are uneven. Gelati and Prometheus are reached on asphalt; the last stretch
    to Okatse is rougher; and the road to Kinchkha Waterfall is gravel that deteriorates markedly after
    rain, which is where ground clearance stops being optional. Morning fog is common and western Georgian
    rain arrives without much warning, so plan on driving slowly rather than making up time. Fuel is easy
    in Kutaisi, Zestaponi and Khoni, less so in the villages beyond them.
  best_for:
  - A two-day base in Kutaisi
  - Gelati and Bagrati in a single morning
  - Caves and canyons with children
  - A stop on the way to Batumi or Svaneti
ru:
  name: Имеретия
  short: Кутаиси, Гелати и карстовый мир — пещеры, каньоны и водопады в часе езды друг от друга.
  body: >-
    Имеретия — сердце Западной Грузии и регион, где климат заметно меняется: воздух влажный, растительность
    гуще, зима куда мягче, чем на востоке. Центр — Кутаиси, один из древнейших городов страны, наследник
    Колхидского царства, сегодня шумный, с большим рынком, рекой Риони и собором Баграти на холме.


    В десяти километрах от города стоит монастырь Гелати, основанный Давидом Строителем в 1106 году одновременно
    как обитель и академия. Он внесён в список ЮНЕСКО и хранит важнейшее собрание грузинской мозаики и
    фресковой живописи. Рядом на скальном отроге над ущельем приютился маленький Моцамета.


    Второй слой региона — карстовый. Пещера Прометея с длинными освещёнными галереями и подземной рекой;
    заповедник Сатаплиа, где соседствуют следы динозавров, пещера и стеклянная смотровая площадка; каньон
    Окаце с металлической тропой, подвешенной над ущельем; водопад Кинчха, падающий уступами по известняковой
    стене. Северо-восточнее, у Чиатуры, поднимается сорокаметровый столп Кацхи с маленькой церковью наверху.
    Южнее в лесу лежит бальнеологический курорт Саирме.


    Кутаиси удобен как база: всё перечисленное лежит в пределах часа езды, гостиниц много, вернуться в
    город к вечеру получается почти всегда. Здесь же международный аэропорт, поэтому многие поездки по
    Грузии начинаются именно с Имеретии.


    Сезон длинный. Пещеры и храмы работают круглый год, а каньоны и водопады лучше смотреть с мая по октябрь:
    зимой металлические настилы скользкие, а вода мутная. Два дня — комфортный минимум с ночёвкой в Кутаиси,
    и регион легко встраивается в любой более длинный западный маршрут.
  driving: >-
    Въезд в Имеретию означает переход через Лихский хребет. Главная трасса E60 идёт через Рикотский перевал
    и в последние годы поэтапно перестраивалась: появились новые тоннели и мосты, часть участков уже открыта,
    на других всё ещё встречаются строительные объезды и задержки. Закладывайте запас времени, а не точное
    время прибытия. До Кутаиси и в самом городе асфальт хороший, машины эконом-класса достаточно.


    Подъезды к объектам разного качества. К Гелати и Прометею ведёт асфальт, последний отрезок к Окаце
    грубее, а дорога к водопаду Кинчха грунтовая и после дождя заметно портится — вот здесь клиренс перестаёт
    быть роскошью. Утренние туманы обычны, западногрузинский дождь начинается внезапно, поэтому лучше
    ехать медленно, чем выигрывать минуты. Заправки есть в Кутаиси, Зестафони и Хони, дальше в сёлах реже.
  best_for:
  - Двухдневная база в Кутаиси
  - Гелати и Баграти за одно утро
  - Пещеры и каньоны с детьми
  - Остановка по пути в Батуми или Сванетию
fa:
  name: ایمرتی
  short: کوتایسی، گلاتی و چشم‌اندازی کارستی — غارها، دره‌ها و آبشارها در فاصلهٔ یک ساعت از یکدیگر.
  body: >-
    ایمرتی قلب غرب گرجستان است و منطقه‌ای که تغییر اقلیم را می‌توان در آن دید: هوا مرطوب است، پوشش گیاهی
    انبوه‌تر و زمستان بسیار ملایم‌تر از شرق کشور. مرکز آن کوتایسی است، یکی از کهن‌ترین شهرهای کشور و وارث
    پادشاهی کلخیس، امروز جایی پرجنب‌وجوش با بازارها، رود ریونی و کلیسای جامع باگراتی بر تپه‌اش.

    ده کیلومتر بیرون شهر صومعهٔ گلاتی ایستاده است که داوود سازنده در 1106 هم به عنوان صومعه و هم به عنوان
    آکادمی بنیاد نهاد؛ در فهرست یونسکو ثبت شده و مهم‌ترین گنجینهٔ موزاییک و نقاشی دیواری گرجی است. موتسامتای
    کوچک در نزدیکی، روی زبانه‌ای صخره‌ای بالای پیچ دره نشسته که از سه سو پرتگاه دارد.

    لایهٔ دوم اینجا کارست است. غار پرومتئوس دالان‌های بلند نورپردازی‌شده و رودخانه‌ای زیرزمینی دارد؛ ذخیرهٔ
    طبیعی ساتاپلیا رد پای دایناسور را با یک غار و سکوی دید شیشه‌ای ترکیب می‌کند؛ درهٔ اوکاتسه با گذرگاهی
    فلزی معلق بر فراز شکاف پیموده می‌شود؛ آبشار کینچخا پله‌پله از دیواره‌ای آهکی فرو می‌ریزد. در شمال‌شرق،
    نزدیک چیاتورا، ستون کاتسخی حدود چهل متر بالا می‌آید و کلیسایی کوچک بر قلهٔ آن است. در جنوب، سایرمه
    ییلاق آب معدنی در دل جنگل است.

    فصل طولانی است. غارها و کلیساها تمام سال کار می‌کنند، در حالی که دره‌ها و آبشارها از ماه مه تا اکتبر
    بهترین‌اند، چون گذرگاه‌ها در زمستان لغزنده می‌شوند. دو روز با یک شب در کوتایسی حداقلی راحت است، و
    منطقه در هر مسیر طولانی‌تر به سمت غرب به‌خوبی جا می‌گیرد.
  driving: >-
    ورود به ایمرتی یعنی عبور از رشته‌کوه لیخی. بزرگراه اصلی E60 از گردنهٔ ریکوتی می‌گذرد و مرحله‌به‌مرحله
    با تونل‌ها و پل‌های تازه بازسازی شده است؛ بخش‌هایی باز است و در بخش‌های دیگر هنوز ممکن است با انحراف
    مسیر و تأخیر ساخت‌وساز روبه‌رو شوید، پس در برنامه به‌جای ساعت دقیق ورود، حاشیهٔ زمانی بگذارید. تا
    کوتایسی و داخل شهر آسفالت خوب است و خودروی اقتصادی کافی است.

    جاده‌های دسترسی به جاذبه‌ها یکدست نیستند. به گلاتی و پرومتئوس با آسفالت می‌رسید؛ آخرین بخش تا اوکاتسه
    ناهموارتر است؛ و راه آبشار کینچخا شنی است که پس از باران به‌طور محسوسی بدتر می‌شود و اینجا دیگر ارتفاع
    کف اختیاری نیست. مه صبحگاهی معمول است و باران غرب گرجستان بی‌هشدار می‌آید، پس روی رانندگی آرام حساب
    کنید نه جبران وقت. سوخت در کوتایسی، زستافونی و خونی آسان است و در روستاهای دورتر کمتر.
  best_for:
  - دو روز اقامت پایه در کوتایسی
  - گلاتی و باگراتی در یک صبح
  - غارها و دره‌ها همراه با کودکان
  - توقفی در راه باتومی یا سوانتی
he:
  name: אימרתי
  short: קוטאיסי, גלאטי ונוף קרסטי — מערות, קניונים ומפלים במרחק שעה זה מזה.
  body: >-
    אימרתי היא ליבה של מערב גאורגיה והאזור שבו שינוי האקלים נראה לעין: האוויר לח, הצמחייה סמיכה יותר והחורף
    מתון בהרבה מאשר במזרח. מרכזה הוא קוטאיסי, אחת הערים העתיקות במדינה ויורשת ממלכת קולכיס, וכיום מקום
    שוקק עם שווקים, נהר הריוני וקתדרלת בגראטי על הגבעה. העיר קטנה מספיק כדי להסתובב בה ברגל וזולה בהרבה
    מטביליסי.

    עשרה קילומטרים מחוץ לעיר עומד מנזר גלאטי, שנוסד בידי המלך דוד הבנאי ב-1106 גם כמנזר וגם כאקדמיה, רשום
    ברשימת אונסקו והוא האוצר החשוב ביותר של פסיפס וציורי קיר גאורגיים; דוד הבנאי עצמו קבור בשער הדרומי
    של המתחם. מוצמטה הקטן שוכן בקרבת מקום על צוק מעל פיתול הנהר, עם תהום משלושה עברים.

    השכבה השנייה כאן היא הקרסט. מערת פרומתאוס מציעה אולמות מוארים ארוכים ונהר תת-קרקעי; שמורת סאטאפליה
    משלבת עקבות דינוזאורים עם מערה ומרפסת תצפית מזכוכית; קניון אוקאצה נחצה בשביל מתכת התלוי מעל הערוץ;
    ומפל קינצחה יורד בשלבים במורד קיר גיר. בצפון-מזרח, ליד צ'יאתורה, מתנשא עמוד קצחי לגובה של כארבעים
    מטר ובראשו כנסייה קטנה. בדרום, סאירמה היא אתר מים מינרליים בתוך היער.

    העונה ארוכה. המערות והכנסיות פועלות כל השנה, ואילו הקניונים והמפלים מיטביים ממאי עד אוקטובר, מפני
    שהשבילים נעשים חלקלקים בחורף. יומיים הם מינימום נוח עם לינה בקוטאיסי, והאזור משתלב היטב בכל מסלול
    ארוך יותר מערבה, גם למי שנוחת ישירות בקוטאיסי.
  driving: >-
    הכניסה לאימרתי מחייבת חציית רכס ליחי. הכביש הראשי E60 עובר במעבר ריקוטי ונבנה מחדש בשלבים עם מנהרות
    וגשרים חדשים; חלקים כבר פתוחים, ובחלקים אחרים עדיין אפשר להיתקל בעקיפות עבודות ובעיכובים, לכן תכננו
    מרווח זמן ולא שעת הגעה מדויקת. עד קוטאיסי ובתוך העיר האספלט טוב ורכב חסכוני מספיק.

    דרכי הגישה לאתרים אינן אחידות. אל גלאטי ואל פרומתאוס מגיעים על אספלט; הקטע האחרון לאוקאצה מחוספס יותר;
    והדרך למפל קינצחה היא חצץ שמידרדר מאוד אחרי גשם, וכאן גובה הגחון מפסיק להיות עניין של נוחות. ערפל
    בוקר שכיח וגשם מערב גאורגיה מגיע כמעט בלי התראה, לכן תכננו נסיעה איטית במקום להשלים פערי זמן. דלק
    זמין בקוטאיסי, בזסטפוני ובחוני, ופחות מכך בכפרים שמעבר להם.
  best_for:
  - בסיס של יומיים בקוטאיסי
  - גלאטי ובגראטי בבוקר אחד
  - מערות וקניונים עם ילדים
  - עצירה בדרך לבטומי או לסוואנטי
ar:
  name: إيميريتي
  short: كوتايسي وغيلاتي ومشهد كارستي — كهوف وأودية وشلالات لا تفصل بينها أكثر من ساعة.
  body: >-
    إيميريتي قلب غرب جورجيا، والإقليم الذي يتبدل فيه المناخ أمام عينيك: الهواء رطب، والغطاء النباتي أكثف،
    والشتاء أكثر اعتدالاً بكثير منه في الشرق. مركزها كوتايسي، إحدى أقدم مدن البلاد ووريثة مملكة كولخيس،
    وهي اليوم مدينة نابضة بأسواقها ونهر ريوني وكاتدرائية باغراتي على تلها.

    وعلى بعد عشرة كيلومترات خارج المدينة يقوم دير غيلاتي، الذي أسسه الملك داود الباني عام 1106 ديراً وأكاديمية
    في آن واحد، وهو مدرج على قائمة اليونسكو ويمثل أهم خزانة للفسيفساء والرسوم الجدارية الجورجية؛ وفي بوابته
    الجنوبية يرقد داود الباني نفسه. وإلى جواره يجلس دير موتساميتا الصغير على نتوء صخري فوق منعطف النهر،
    تحيط به الهاوية من ثلاث جهات.

    الطبقة الثانية هنا هي الكارست. يقدم كهف بروميثيوس ممرات مضاءة طويلة ونهراً جوفياً؛ وتجمع محمية ساتابليا
    بين آثار أقدام الديناصورات وكهف ومنصة زجاجية للإطلالة؛ ويُعبر وادي أوكاتسي على ممشى معدني معلق فوق
    الشق الصخري؛ وينزل شلال كينتشخا على مراحل من جدار كلسي. وإلى الشمال الشرقي، قرب تشياتورا، يرتفع عمود
    كاتسخي نحو أربعين متراً وفوقه كنيسة صغيرة. وفي الجنوب، سايرمي منتجع مياه معدنية داخل الغابة.

    الموسم طويل. الكهوف والكنائس تعمل طوال العام، أما الأودية والشلالات فأفضلها من مايو إلى أكتوبر، لأن
    الممشات تصبح زلقة في الشتاء. يومان حد أدنى مريح مع مبيت في كوتايسي، والإقليم يندرج بسلاسة في أي مسار
    أطول نحو الغرب.
  driving: >-
    الدخول إلى إيميريتي يعني عبور سلسلة ليخي. يمر الطريق الرئيسي E60 عبر ممر ريكوتي، وقد أُعيد بناؤه على
    مراحل بأنفاق وجسور جديدة؛ بعض المقاطع مفتوح، وفي مقاطع أخرى قد تصادف تحويلات أعمال وتأخيرات، لذا اترك
    هامشاً زمنياً في برنامجك بدل تحديد ساعة وصول دقيقة. وحتى كوتايسي وداخل المدينة الإسفلت جيد وسيارة
    اقتصادية تكفي.

    طرق الوصول إلى المواقع متفاوتة. يُوصل إلى غيلاتي وبروميثيوس على الإسفلت؛ والمقطع الأخير نحو أوكاتسي
    أوعر؛ أما طريق شلال كينتشخا فحصوي ويسوء بوضوح بعد المطر، وهنا يتوقف الخلوص الأرضي عن كونه خياراً كمالياً.
    ضباب الصباح شائع، ومطر غرب جورجيا يهطل من دون إنذار يُذكر، فخطط للقيادة ببطء بدل محاولة تعويض الوقت.
    الوقود متوفر بسهولة في كوتايسي وزيستافوني وخوني، وأقل من ذلك في القرى الأبعد.
  best_for:
  - إقامة يومين في كوتايسي كقاعدة
  - غيلاتي وباغراتي في صباح واحد
  - الكهوف والأودية مع الأطفال
  - محطة في الطريق إلى باتومي أو سفانيتي
