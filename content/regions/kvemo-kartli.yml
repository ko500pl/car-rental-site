ka:
  name: ქვემო ქართლი
  short: თბილისის სამხრეთით — უძველესი ტაძრები, დმანისის არქეოლოგია და დაშბაშის კანიონი ერთდღიან რადიუსში.
  body: >-
    ქვემო ქართლი თბილისის სამხრეთით იწყება და ის რეგიონია, რომელსაც სტუმრების უმეტესობა გაუჩერებლად გადის.
    ერთი დღე კი ნამდვილად ღირს. პეიზაჟი სწრაფად იცვლება: რუსთავის ინდუსტრიული ველი და მარნეულის ბოსტნები
    თანდათან წალკის პლატოში გადადის, დაახლოებით ათას ხუთას მეტრზე, სადაც ჰაერი გრილია და სოფლები ქვისაა.


    მთავარი ორი ძეგლი უფრო არქეოლოგიური და ისტორიულია, ვიდრე სანახაობრივი. დმანისი, ორი მდინარის თავზე
    მდებარე კონცხზე, ცნობილია დაახლოებით 1.8 მილიონი წლის ჰომინიდების ნეშტებით — უძველესი მსგავსი აღმოჩენა
    აფრიკის გარეთ — და გვერდით შუა საუკუნეების ნაქალაქარიც დგას. ბოლნისის სიონი, V საუკუნის ბოლოს ნაკურთხი,
    ქვეყნის უძველესი შემორჩენილი ტაძრებია და ქართული ანბანის ერთ-ერთ უადრეს წარწერებს ატარებს.


    ბუნებისთვის ორი კარგი ვარიანტია. ბირთვისი კირქვის კოშკებისა და ხეობების ლაბირინთია, რომლის სიღრმეშიც
    ციხის ნაშთი იმალება; სიარული აქ ნამდვილად რთულია და გიდთან ერთად სჯობს. დაშბაშის კანიონი, წალკის ზემოთ,
    უფრო მოწყობილია — შუშის ხიდი ხეობის თავზე და ბილიკი ჩანჩქერებამდე — და ბავშვებთან ერთად უფრო მარტივია.
    ალგეთის ეროვნული პარკი, თბილისთან ახლოს, მშვიდი ნაძვნარია მოკლე გასეირნებისთვის.


    ეს საქართველოს ყველაზე მრავალეთნიკური კუთხეცაა: აზერბაიჯანული და სომხური სოფლები ქართულის გვერდითაა,
    ბაზრები ხმაურიანია და პურიც და სამზარეულოც შესაბამისად იცვლება. სეზონი გრძელია — ტაძრები მთელი წელი
    მისაწვდომია, კანიონი და ბირთვისი კი მაისიდან ოქტომბრამდე ჯობს. აქ არაფერი მოითხოვს ერთ დღეზე მეტს:
    ყველაფერი დედაქალაქიდან საათნახევრის რადიუსშია და საღამოსვე ბრუნდები თბილისში.
  driving: >-
    მთავარი გზები რუსთავის, მარნეულისა და ბოლნისის მიმართულებით კარგი ასფალტია და თბილისიდან სწრაფად მიდის.
    სირთულეები მეორეხარისხოვან გზებზე იწყება: ბირთვისისკენ ბოლო კილომეტრები გრუნტოვანია და შემდეგ ისედაც
    ფეხით უნდა იარო, ხოლო წალკის პლატოზე ასვლა ღია და ქარიანია — ზამთარში აქ თოვლი და მოყინვაა, ზაფხულში
    კი ხშირი ნისლი. მაღალი კლირენსი გამოგადგება, თუ ბირთვისი ან სოფლის გზები გაქვს გეგმაში; დანარჩენისთვის
    ეკონომ კლასი საკმარისია.


    საწვავი მარნეულში, ბოლნისსა და წალკაშია; სოფლებში ხშირად არა. საქონელი გზაზე ჩვეულებრივი მოვლენაა,
    განსაკუთრებით საღამოს. და კიდევ ერთი: სომხეთისა და აზერბაიჯანის საზღვრებთან დარჩი მონიშნულ გზებზე
    — ზოგი ბილიკი პირდაპირ სასაზღვრო ზონაში შედის, სადაც შესვლა აკრძალულია.
  best_for:
  - ერთდღიანი გასვლა თბილისიდან
  - ადრექრისტიანული ხუროთმოძღვრება — ბოლნისის სიონი
  - დაშბაშის კანიონი ოჯახთან ერთად
  - ბირთვისის ლაბირინთი გამოცდილი მოსიარულეებისთვის
en:
  name: Kvemo Kartli
  short: >-
    South of Tbilisi — very early churches, the Dmanisi excavations and Dashbashi Canyon, all within day-trip
    range.
  body: >-
    Kvemo Kartli begins immediately south of Tbilisi and is the region most visitors drive straight through.
    It repays a day. The landscape shifts quickly, from the industrial plain around Rustavi and the market
    gardens of Marneuli up onto the Tsalka plateau at around 1,500 metres, where the air is cooler and
    the villages are built of stone.


    Its two headline sites are archaeological rather than scenic. Dmanisi, on a promontory above the meeting
    of two rivers, produced hominin remains dated to roughly 1.8 million years — the oldest such finds
    outside Africa — and the ruins of a medieval town stand on the same spur. Bolnisi Sioni, consecrated
    at the end of the fifth century, is among the oldest surviving churches in the country and carries
    some of the earliest known inscriptions in the Georgian alphabet.


    For a day outdoors there are two good options. Birtvisi is a maze of limestone towers and ravines
    with a ruined fortress hidden inside it; the walking is genuinely rough and much better with a guide.
    Dashbashi Canyon above Tsalka is the developed alternative, with a glass viewing bridge over the gorge
    and a path down towards the waterfalls, and it is the easier choice with children. Algeti National
    Park, closer to the capital, is quiet spruce forest suited to a short walk rather than a whole day.


    This is also the most mixed corner of Georgia: Azerbaijani and Armenian villages sit alongside Georgian
    ones, and the bread and the cooking change accordingly. Nothing here needs more than a day trip, since
    everything falls within ninety minutes of Tbilisi.
  driving: >-
    The main roads towards Rustavi, Marneuli and Bolnisi are good asphalt and move quickly out of Tbilisi.
    The difficulty starts on the secondary network. The last few kilometres towards Birtvisi are gravel,
    and you walk in from there anyway; the climb onto the Tsalka plateau is open and exposed, with snow
    and ice in winter and frequent low cloud in summer. Ground clearance helps if Birtvisi or village
    roads are on the plan, while an economy car covers everything else.


    Fuel is available in Marneuli, Bolnisi and Tsalka but rarely in the villages between them. Livestock
    on the road is routine, especially in the evening. One further point: near the Armenian and Azerbaijani
    frontiers, stay on marked roads — some tracks run straight into the border zone, where driving is
    not permitted.
  best_for:
  - An easy day trip out of Tbilisi
  - Early Christian architecture at Bolnisi Sioni
  - Dashbashi Canyon with children
  - The Birtvisi labyrinth for confident walkers
ru:
  name: Квемо-Картли
  short: К югу от Тбилиси — древнейшие храмы, раскопки Дманиси и каньон Дашбаши в пределах однодневной
    поездки.
  body: >-
    Квемо-Картли начинается сразу к югу от Тбилиси, и большинство гостей проезжает регион не останавливаясь.
    Между тем один день он точно окупает. Пейзаж меняется быстро: промышленная равнина у Рустави и огороды
    Марнеули переходят в Цалкское плато на высоте около 1500 метров, где воздух прохладнее, а сёла сложены
    из камня.


    Два главных памятника здесь скорее археологические, чем видовые. Дманиси на мысу над слиянием двух
    рек дал остатки гоминид возрастом около 1,8 миллиона лет — древнейшие подобные находки за пределами
    Африки, — а рядом на том же мысу лежат руины средневекового города. Болнисский Сиони, освящённый в
    конце V века, входит в число древнейших сохранившихся храмов страны и несёт одни из самых ранних известных
    надписей грузинским алфавитом.


    Для дня на природе есть два варианта. Биртвиси — лабиринт известняковых башен и ущелий, в глубине
    которого спрятаны остатки крепости; ходьба тут действительно тяжёлая, и лучше идти с проводником.
    Каньон Дашбаши над Цалкой обустроен: стеклянный мост над ущельем и тропа вниз к водопадам, с детьми
    это проще. Национальный парк Алгети ближе к столице — тихий еловый лес для короткой прогулки.


    Это и самый пёстрый угол Грузии: азербайджанские и армянские сёла соседствуют с грузинскими, и кухня
    меняется соответственно. Больше одного дня здесь не нужно — всё в пределах полутора часов от Тбилиси.
  driving: >-
    Основные дороги на Рустави, Марнеули и Болниси — приличный асфальт, из Тбилиси по ним выезжаешь быстро.
    Сложности начинаются на второстепенной сети. Последние километры к Биртвиси грунтовые, да и дальше
    всё равно идти пешком; подъём на Цалкское плато открытый и продуваемый, зимой со снегом и гололёдом,
    летом с частой низкой облачностью. Клиренс пригодится, если в планах Биртвиси или сельские дороги,
    для остального достаточно эконом-класса.


    Заправки есть в Марнеули, Болниси и Цалке, но в сёлах между ними их обычно нет. Скот на проезжей части
    — обычное дело, особенно под вечер. И ещё: у границ с Арменией и Азербайджаном держитесь обозначенных
    дорог — часть просёлков уходит прямо в пограничную зону, куда въезд запрещён.
  best_for:
  - Однодневный выезд из Тбилиси
  - 'Раннехристианская архитектура: Болнисский Сиони'
  - Каньон Дашбаши с детьми
  - Лабиринт Биртвиси для подготовленных ходоков
fa:
  name: کومو کارتلی
  short: جنوب تفلیس — کلیساهای بسیار کهن، کاوش‌های دمانیسی و درهٔ داشباشی، همه در دسترس یک سفر یک‌روزه.
  body: >-
    کومو کارتلی بلافاصله جنوب تفلیس آغاز می‌شود و منطقه‌ای است که بیشتر بازدیدکنندگان مستقیم از آن رد
    می‌شوند. یک روز وقت گذاشتن ارزشش را دارد. چشم‌انداز به‌سرعت عوض می‌شود، از دشت صنعتی پیرامون روستاوی
    و باغ‌های سبزی‌کاری مارنئولی تا فلات تسالکا در حدود 1,500 متر، جایی که هوا خنک‌تر است و روستاها از
    سنگ ساخته شده‌اند.

    دو جاذبهٔ اصلی آن باستان‌شناختی‌اند نه منظره‌ای. دمانیسی، بر زبانه‌ای بالای محل تلاقی دو رود، بقایای
    انسان‌تباران با قدمت حدود 1.8 میلیون سال را به دست داده است — کهن‌ترین یافته‌های این‌چنینی بیرون از
    آفریقا — و ویرانه‌های شهری از سده‌های میانه روی همان زبانه ایستاده است. بولنیسی سیونی، که در پایان
    سدهٔ پنجم تقدیس شد، از کهن‌ترین کلیساهای برجای‌ماندهٔ کشور است و برخی از قدیمی‌ترین کتیبه‌های شناخته‌شده
    به الفبای گرجی را دارد.

    برای یک روز در طبیعت دو گزینهٔ خوب هست. بیرتویسی هزارتویی از برج‌ها و دره‌های آهکی است با دژی ویران
    در دل آن؛ پیاده‌روی در آن واقعاً سخت است و با راهنما بسیار بهتر. درهٔ داشباشی بالای تسالکا گزینهٔ
    توسعه‌یافته است، با پل دید شیشه‌ای بر فراز شکاف و مسیری به سوی آبشارها، و همراه کودکان انتخاب آسان‌تری
    است. پارک ملی آلگتی، نزدیک‌تر به پایتخت، جنگل آرام صنوبر است و بیشتر برای پیاده‌روی کوتاه مناسب است
    تا یک روز کامل.

    این پرتنوع‌ترین گوشهٔ گرجستان هم هست: روستاهای آذربایجانی و ارمنی کنار روستاهای گرجی نشسته‌اند و نان
    و آشپزی هم به همان نسبت تغییر می‌کند. هیچ چیز اینجا بیش از یک سفر یک‌روزه نمی‌خواهد، چون همه چیز در
    فاصلهٔ نود دقیقه از تفلیس است.
  driving: >-
    جاده‌های اصلی به سوی روستاوی، مارنئولی و بولنیسی آسفالت خوبی دارند و به‌سرعت از تفلیس دور می‌شوند.
    دشواری از شبکهٔ فرعی شروع می‌شود. چند کیلومتر آخر به سوی بیرتویسی شنی است و از آنجا به هر حال پیاده
    می‌روید؛ صعود به فلات تسالکا باز و بی‌پناه است، با برف و یخ در زمستان و ابر پایین مکرر در تابستان.
    اگر بیرتویسی یا جاده‌های روستایی در برنامه است ارتفاع کف کمک می‌کند، وگرنه خودروی اقتصادی همه چیز
    را پوشش می‌دهد.

    سوخت در مارنئولی، بولنیسی و تسالکا هست اما به‌ندرت در روستاهای میان آن‌ها. دام روی جاده امری عادی
    است، به‌ویژه عصرها. یک نکتهٔ دیگر: نزدیک مرزهای ارمنستان و آذربایجان روی جاده‌های علامت‌گذاری‌شده
    بمانید — برخی مسیرهای فرعی مستقیم به نوار مرزی می‌روند، جایی که رانندگی مجاز نیست.
  best_for:
  - سفر یک‌روزهٔ آسان از تفلیس
  - معماری مسیحی آغازین در بولنیسی سیونی
  - درهٔ داشباشی همراه با کودکان
  - هزارتوی بیرتویسی برای پیاده‌روهای باتجربه
he:
  name: קוומו קרתלי
  short: מדרום לטביליסי — כנסיות קדומות מאוד, חפירות דמניסי וקניון דשבאשי, הכול בטווח טיול יום.
  body: >-
    קוומו קרתלי מתחילה מיד מדרום לטביליסי, וזהו האזור שרוב המבקרים פשוט חולפים דרכו בדרך לאנשהו אחר. הוא
    שווה יום שלם. הנוף מתחלף במהירות, מהמישור התעשייתי סביב רוסתאווי וגני הירק של מרנאולי אל רמת צלקה
    בגובה של כ-1,500 מטר, שם האוויר קריר יותר והכפרים בנויים אבן.

    שני האתרים המרכזיים שלה ארכיאולוגיים ולא נופיים. בדמניסי, על לשון קרקע מעל מפגש שני נהרות, נמצאו שרידי
    הומינינים המתוארכים לכ-1.8 מיליון שנה — הממצאים העתיקים ביותר מסוגם מחוץ לאפריקה — ועל אותה לשון עצמה
    עומדות חורבות עיר מימי הביניים. בולניסי סיוני, שהוקדשה בסוף המאה החמישית, היא מהכנסיות העתיקות ביותר
    ששרדו במדינה ונושאת כמה מהכתובות הידועות הקדומות ביותר באלפבית הגאורגי.

    ליום בטבע יש שתי אפשרויות טובות. בירתוויסי הוא מבוך של מגדלי גיר וערוצים ובתוכו מבצר הרוס; ההליכה
    שם קשה באמת ועדיפה בהרבה עם מדריך. קניון דשבאשי מעל צלקה הוא החלופה המפותחת, עם גשר תצפית מזכוכית
    מעל הערוץ ושביל היורד אל המפלים, והוא הבחירה הקלה יותר עם ילדים. הפארק הלאומי אלגטי, קרוב יותר לבירה,
    הוא יער אשוחים שקט המתאים להליכה קצרה ולא ליום שלם.

    זו גם הפינה המעורבת ביותר בגאורגיה: כפרים אזרבייג'נים וארמנים לצד כפרים גאורגיים, והלחם והמטבח משתנים
    בהתאם. שום דבר כאן אינו דורש יותר מטיול יום אחד, מפני שכל היעדים נמצאים בטווח תשעים דקות נסיעה מטביליסי.
  driving: >-
    הכבישים הראשיים לרוסתאווי, למרנאולי ולבולניסי הם אספלט טוב ומוציאים אתכם מטביליסי במהירות. הקושי מתחיל
    ברשת המשנית. הקילומטרים האחרונים לכיוון בירתוויסי הם חצץ, ומשם ממילא ממשיכים ברגל; העלייה אל רמת צלקה
    חשופה, עם שלג וקרח בחורף וענני נמוך תכופים בקיץ. גובה גחון עוזר אם בירתוויסי או דרכי כפר נמצאות בתוכנית,
    ורכב חסכוני מכסה את כל השאר.

    דלק זמין במרנאולי, בבולניסי ובצלקה, אך רק לעיתים רחוקות בכפרים שביניהם. בעלי חיים על הכביש הם עניין
    שבשגרה, במיוחד לקראת ערב. נקודה נוספת: בקרבת הגבולות עם ארמניה ואזרבייג'ן הישארו על דרכים מסומנות
    — חלק מהשבילים נכנסים היישר לאזור הגבול, שבו הנסיעה אסורה.
  best_for:
  - טיול יום קל מחוץ לטביליסי
  - אדריכלות נוצרית קדומה בבולניסי סיוני
  - קניון דשבאשי עם ילדים
  - מבוך בירתוויסי להולכי רגל מנוסים
ar:
  name: كفيمو كارتلي
  short: جنوب تبليسي — كنائس بالغة القدم وحفريات دمانيسي ووادي داشباشي، كلها في متناول رحلة يوم واحد.
  body: >-
    يبدأ إقليم كفيمو كارتلي جنوب تبليسي مباشرة، وهو الإقليم الذي يمر به معظم الزوار من دون توقف. لكنه
    يستحق يوماً كاملاً. يتبدل المشهد سريعاً، من السهل الصناعي حول روستافي وبساتين الخضر في مارنيولي صعوداً
    إلى هضبة تسالكا على نحو 1,500 متر، حيث الهواء أبرد والقرى مبنية بالحجر.

    وموقعاه الأبرز أثريان لا مشهديان. أنتجت دمانيسي، على نتوء يعلو ملتقى نهرين، بقايا بشرانية يعود تاريخها
    إلى نحو 1.8 مليون سنة — أقدم ما عُثر عليه من هذا النوع خارج أفريقيا — وعلى النتوء نفسه تقوم أطلال
    مدينة من العصور الوسطى. أما بولنيسي سيوني، التي كُرّست في أواخر القرن الخامس، فمن أقدم الكنائس الباقية
    في البلاد، وتحمل بعض أقدم النقوش المعروفة بالأبجدية الجورجية.

    ولقضاء يوم في الطبيعة هناك خياران جيدان. بيرتفيسي متاهة من الأبراج الكلسية والأخاديد يختبئ داخلها
    حصن مهدم؛ والمشي فيها شاق فعلاً وأفضل بكثير برفقة مرشد. ووادي داشباشي فوق تسالكا هو البديل المجهّز،
    بجسر زجاجي للإطلالة فوق الوادي ودرب ينزل نحو الشلالات، وهو الخيار الأسهل مع الأطفال. أما منتزه ألغيتي
    الوطني، الأقرب إلى العاصمة، فغابة تنوب هادئة تصلح لنزهة قصيرة لا ليوم كامل.

    وهذا أيضاً أكثر أركان جورجيا تنوعاً: قرى أذربيجانية وأرمنية إلى جانب القرى الجورجية، ويتغير الخبز
    والمطبخ تبعاً لذلك. لا شيء هنا يحتاج إلى أكثر من رحلة يوم، لأن كل شيء يقع ضمن تسعين دقيقة من تبليسي.
  driving: >-
    الطرق الرئيسية نحو روستافي ومارنيولي وبولنيسي إسفلت جيد وتخرجك من تبليسي بسرعة. الصعوبة تبدأ على الشبكة
    الفرعية. الكيلومترات الأخيرة نحو بيرتفيسي حصوية، ومنها تكمل سيراً على الأقدام على أي حال؛ والصعود
    إلى هضبة تسالكا مكشوف تماماً، مع ثلج وجليد في الشتاء وسحب منخفضة متكررة في الصيف. الخلوص الأرضي يفيد
    إن كانت بيرتفيسي أو طرق القرى في البرنامج، أما ما عدا ذلك فسيارة اقتصادية تكفيه.

    الوقود متوفر في مارنيولي وبولنيسي وتسالكا، لكنه نادر في القرى الواقعة بينها. ووجود المواشي على الطريق
    أمر معتاد، خاصة في المساء. ونقطة أخيرة: قرب الحدود مع أرمينيا وأذربيجان التزم بالطرق المعلَّمة — فبعض
    المسالك تدخل مباشرة إلى الشريط الحدودي، حيث القيادة ممنوعة.
  best_for:
  - رحلة يوم سهلة خارج تبليسي
  - عمارة مسيحية مبكرة في بولنيسي سيوني
  - وادي داشباشي مع الأطفال
  - متاهة بيرتفيسي لمن يجيدون المشي الوعر
