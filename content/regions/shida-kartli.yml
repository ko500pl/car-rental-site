ka:
  name: შიდა ქართლი
  short: უფლისციხე, გორი და ვაშლის ბაღები მტკვრის ველზე — ყველაზე მარტივი ერთდღიანი მარშრუტი დასავლეთისკენ.
  body: >-
    შიდა ქართლი მტკვრის შუა წელის ფართო ველია, თბილისსა და ლიხის ქედს შორის. ეს საქართველოს ერთ-ერთი ყველაზე
    ნაყოფიერი კუთხეა — ვაშლისა და ატმის ბაღები კილომეტრობით გრძელდება — და ამავე დროს ყველაზე მარტივად
    მისადგომი: ავტობანი გორამდე ქვეყნის საუკეთესო გზაა და ერთ საათსა და ათ წუთს ითხოვს.


    მთავარი ძეგლი უფლისციხეა, კლდეში ნაკვეთი ქალაქი მტკვრის მარცხენა ნაპირზე. მისი ისტორია ჩვენს წელთაღრიცხვამდე
    პირველ ათასწლეულში იწყება; დღეს დარბაზები, ღვინის საწნახლები, ქუჩები და IX-X საუკუნეების აგურის ბაზილიკა
    ერთმანეთზეა დაწყობილი. გორი, ცხრა კილომეტრში, ბორცვზე შემდგარი ციხითა და სტალინის მუზეუმით ცნობილია
    — მუზეუმი დღემდე დიდწილად საბჭოთა ლოგიკით არის აწყობილი და სწორედ ეს ხდის მას საინტერესოდ.


    გვერდით ორი ნაკლებად ცნობილი ტაძარია, რომლებიც ხელოვნების ისტორიისთვის უფრო მნიშვნელოვანია, ვიდრე
    ტურისტული სიებისთვის. ატენის სიონი, თბილისის ჯვრის მიხედვით აგებული, ვიწრო ხეობაში დგას და XI საუკუნის
    ფრესკებს ინახავს. ყინცვისში წმინდა ნიკოლოზის ეკლესიის მოხატულობა — მათ შორის ცნობილი „ყინცვისის ანგელოზი"
    — ქართული მხატვრობის მწვერვალად ითვლება. სამთავისი, გზისპირზე, XI საუკუნის ფასადის ორნამენტით გამოირჩევა.


    სეზონი მთელი წელია: ველზე თოვლი დიდხანს არ ჩერდება და ზამთარშიც სავსებით მისაწვდომია ყველა ობიექტი.
    ზაფხულში ველი ცხელია და უფლისციხეზე ჩრდილი პრაქტიკულად არ არის — დილის საათები ჯობს. ერთი დღე სამივე
    მთავარ ობიექტს ეყოფა, თუ ადრე გახვალ, ხოლო თუ დასავლეთისკენ მიდიხარ, შიდა ქართლი ბუნებრივი გაჩერებაა
    ქუთაისის გზაზე. შემოდგომით გზისპირას ვაშლითა და თაფლით სავსე დახლებია — ეს ტიპური ქართული სამგზავრო
    შესვენებაა.
  driving: >-
    თბილისი-გორის მონაკვეთი ქვეყნის საუკეთესო ავტომაგისტრალია — ორზოლიანი, განათებული, სწრაფი; ზღვარი
    110 კმ/სთ-ია და კამერები ხშირია. გორამდე მისვლა ერთი საათია, უფლისციხემდე კიდევ თხუთმეტი წუთი კარგი
    ასფალტით. ეკონომ კლასის მანქანა სავსებით საკმარისია.


    განშტოებები უფრო რთულია. ატენის ხეობის გზა ვიწროა, ერთი მანქანის სიგანისა ზოგან, და ხიდებზე დათმობა
    გიწევს. ყინცვისამდე ბოლო კილომეტრები აუსფალტოა და წვიმის შემდეგ თიხიანი — მაღალი კლირენსი მართლაც
    გამოგადგება. მაგისტრალზე ტიპური შეცდომაა მარჯვენა ზოლში მოულოდნელად გაჩერებული სატვირთოები და საპირისპირო
    მიმართულებით მოძრავი ტრაქტორები სოფლის გასასვლელებთან.


    და ერთი მნიშვნელოვანი რამ: რეგიონის ჩრდილოეთით გადის საოკუპაციო ხაზი ცხინვალის რეგიონთან. ის ყოველთვის
    მკაფიოდ არ არის მონიშნული, ამიტომ ჩრდილოეთის სოფლის გზებზე ნავიგატორს ბრმად ნუ მიენდობი და მონიშნულ
    მარშრუტს დარჩი.
  best_for:
  - ერთდღიანი გასვლა თბილისიდან
  - უფლისციხე და გორი ერთ მოგზაურობაში
  - შუა საუკუნეების ფრესკები ატენსა და ყინცვისში
  - გაჩერება დასავლეთისკენ მიმავალ გზაზე
en:
  name: Shida Kartli
  short: Uplistsikhe, Gori and orchards on the Mtkvari plain — the simplest day trip west of Tbilisi.
  body: >-
    Shida Kartli is the broad middle valley of the Mtkvari, between Tbilisi and the Likhi range. It is
    one of the most fertile corners of Georgia, with apple and peach orchards running for kilometres,
    and also the most easily reached: the motorway to Gori is the best road in the country and takes a
    little over an hour.


    The main site is Uplistsikhe, a town carved into soft rock above the left bank of the river. Its history
    reaches back into the first millennium BC, and what survives today is a stack of halls, wine presses,
    streets and stairways with a brick basilica of the ninth or tenth century on top. Gori, nine kilometres
    away, is known for the fortress on its central hill and for the Stalin Museum, which is still arranged
    largely according to Soviet logic — which is precisely what makes it worth an hour.


    Nearby stand two less-visited churches that matter more to art history than to tourist lists. Ateni
    Sioni, built on the model of Jvari, sits in a narrow vine-growing valley and keeps eleventh-century
    wall paintings. At Kintsvisi, the frescoes of St Nicholas church — including the celebrated blue angel
    — count among the peaks of Georgian medieval painting. Samtavisi, right by the highway, is admired
    for the carved ornament of its eleventh-century facade.


    The season is the whole year, since snow does not lie long on the plain. One day covers the three
    main sites if you leave early, and the region also works as a stop on the way west to Imereti.
  driving: >-
    The Tbilisi-Gori section is the best motorway in Georgia: dual carriageway, lit, fast, with a 110
    km/h limit and frequent speed cameras. Gori is an hour away, Uplistsikhe another fifteen minutes on
    good asphalt. An economy car is entirely sufficient for the main circuit.


    The branches are harder. The road up the Ateni valley is narrow, in places barely wide enough for
    one car, and you will be giving way on the bridges. The last kilometres to Kintsvisi are unsurfaced
    and turn to clay after rain, so ground clearance genuinely helps. On the motorway itself, watch for
    lorries stopped in the right-hand lane and for tractors joining from village turnings.


    One thing matters more than any of that. The administrative boundary line with the occupied Tskhinvali
    region runs along the north of this region and is not always obviously marked. Do not follow a navigation
    app blindly on northern village roads; stay on signposted routes.
  best_for:
  - A straightforward day trip from Tbilisi
  - Uplistsikhe and Gori in one outing
  - Medieval frescoes at Ateni and Kintsvisi
  - A useful stop on the drive west to Kutaisi
ru:
  name: Шида-Картли
  short: Уплисцихе, Гори и сады на Куринской равнине — самая простая однодневная поездка к западу от Тбилиси.
  body: >-
    Шида-Картли — широкая средняя долина Куры между Тбилиси и Лихским хребтом. Это один из самых плодородных
    углов Грузии: яблоневые и персиковые сады тянутся километрами. И одновременно самый доступный: автомагистраль
    до Гори — лучшая дорога страны, чуть больше часа пути.


    Главный памятник — Уплисцихе, город, вырубленный в мягкой скале над левым берегом реки. Его история
    уходит в первое тысячелетие до нашей эры, а сегодня это наслоение залов, давилен для вина, улиц и
    лестниц, увенчанное кирпичной базиликой IX-X веков. Гори в девяти километрах известен крепостью на
    центральном холме и музеем Сталина, который до сих пор выстроен во многом по советской логике — именно
    поэтому час там провести любопытно.


    Рядом стоят два менее посещаемых храма, важных скорее для истории искусства, чем для туристических
    списков. Атени Сиони, построенный по образцу Джвари, стоит в узком виноградном ущелье и хранит росписи
    XI века. В Кинцвиси фрески церкви святого Николая, включая знаменитого синего ангела, считаются вершиной
    грузинской средневековой живописи. Самтависи у самой трассы славится резьбой фасада XI века.


    Сезон здесь круглогодичный: на равнине снег долго не лежит. Одного дня хватает на три главных объекта,
    если выехать пораньше, а регион удобно вписывается и в дорогу на запад, в Имеретию.
  driving: >-
    Участок Тбилиси-Гори — лучшая магистраль в Грузии: разделённые направления, освещение, ограничение
    110 км/ч и частые камеры. До Гори час, до Уплисцихе ещё пятнадцать минут по хорошему асфальту. Для
    основного круга достаточно машины эконом-класса.


    Ответвления сложнее. Дорога в Атенское ущелье узкая, местами шириной в одну машину, на мостах приходится
    уступать. Последние километры к Кинцвиси без покрытия и после дождя превращаются в глину — клиренс
    действительно помогает. На самой магистрали следите за фурами, стоящими в правой полосе, и за тракторами,
    выезжающими с сельских съездов.


    И самое важное. По северу региона проходит линия оккупации с Цхинвальским регионом, и обозначена она
    не всегда очевидно. Не доверяйте навигатору вслепую на северных сельских дорогах и держитесь маршрутов
    с указателями.
  best_for:
  - Простая однодневная поездка из Тбилиси
  - Уплисцихе и Гори за один выезд
  - Средневековые фрески Атени и Кинцвиси
  - Удобная остановка по дороге на запад
fa:
  name: شیدا کارتلی
  short: اوپلیستسیخه، گوری و باغ‌های میوه در دشت متکواری — ساده‌ترین سفر یک‌روزه به غرب تفلیس.
  body: >-
    شیدا کارتلی درهٔ میانی و پهن متکواری است، میان تفلیس و رشته‌کوه لیخی. یکی از حاصلخیزترین گوشه‌های
    گرجستان است، با باغ‌های سیب و هلو که کیلومترها ادامه دارند، و در عین حال دسترس‌پذیرترین: بزرگراه گوری
    بهترین جادهٔ کشور است و کمی بیش از یک ساعت طول می‌کشد.

    جاذبهٔ اصلی اوپلیستسیخه است، شهری کنده‌شده در سنگ نرم بالای کرانهٔ چپ رودخانه. تاریخ آن به هزارهٔ
    نخست پیش از میلاد می‌رسد و آنچه امروز مانده مجموعه‌ای است از تالارها، شراب‌فشارها، خیابان‌ها و پلکان‌ها
    با یک باسیلیکای آجری از سدهٔ نهم یا دهم بر بالای آن. گوری، نه کیلومتر دورتر، به دژ روی تپهٔ مرکزی‌اش
    و به موزهٔ استالین شهرت دارد که هنوز عمدتاً بر پایهٔ منطق شوروی چیده شده است — و دقیقاً همین آن را
    ارزش یک ساعت می‌کند.

    در همان حوالی دو کلیسای کم‌بازدید ایستاده‌اند که برای تاریخ هنر مهم‌ترند تا برای فهرست گردشگران. آتنی
    سیونی، ساخته‌شده بر الگوی جواری، در دره‌ای باریک و تاک‌خیز نشسته و نقاشی‌های دیواری سدهٔ یازدهم را
    نگه داشته است. در کینتسویسی، نقاشی‌های کلیسای سنت نیکولاس — از جمله فرشتهٔ آبی مشهور — در شمار قله‌های
    نقاشی گرجی سده‌های میانه‌اند. سامتاویسی، درست کنار بزرگراه، به‌خاطر تزیین کنده‌کاری‌شدهٔ نمای سدهٔ
    یازدهمش ستوده می‌شود.

    فصل تمام سال است، چون برف روی دشت دوام نمی‌آورد. یک روز سه جاذبهٔ اصلی را پوشش می‌دهد اگر زود راه
    بیفتید، و منطقه به‌عنوان توقفی در راه غرب به ایمرتی هم کار می‌کند.
  driving: >-
    مقطع تفلیس-گوری بهترین بزرگراه گرجستان است: دوبانده و جداشده، روشن، سریع، با محدودیت 110 کیلومتر بر
    ساعت و دوربین‌های سرعت مکرر. گوری یک ساعت فاصله دارد و اوپلیستسیخه پانزده دقیقهٔ دیگر روی آسفالت خوب.
    خودروی اقتصادی برای مدار اصلی کاملاً کافی است.

    انشعاب‌ها سخت‌ترند. جادهٔ درهٔ آتنی باریک است، جاهایی به‌زحمت به عرض یک خودرو، و روی پل‌ها باید راه
    بدهید. کیلومترهای آخر تا کینتسویسی آسفالت ندارد و پس از باران به گِل تبدیل می‌شود، پس ارتفاع کف واقعاً
    کمک می‌کند. روی خود بزرگراه مراقب کامیون‌های متوقف در لاین راست و تراکتورهایی باشید که از فرعی‌های
    روستایی وارد می‌شوند.

    یک نکته از همهٔ این‌ها مهم‌تر است. خط مرزی اداری با منطقهٔ اشغالی تسخینوالی در شمال این استان می‌گذرد
    و همیشه به‌روشنی علامت‌گذاری نشده است. در جاده‌های روستایی شمالی کورکورانه دنبال اپلیکیشن مسیریابی
    نروید؛ روی مسیرهای تابلودار بمانید.
  best_for:
  - سفر یک‌روزهٔ ساده از تفلیس
  - اوپلیستسیخه و گوری در یک گشت
  - نقاشی‌های دیواری سده‌های میانه در آتنی و کینتسویسی
  - توقفی مفید در راه غرب به کوتایسی
he:
  name: שידה קרתלי
  short: אופליסציחה, גורי ומטעים במישור המטקווארי — טיול היום הפשוט ביותר ממערב לטביליסי.
  body: >-
    שידה קרתלי היא עמק הביניים הרחב של המטקווארי, בין טביליסי לרכס ליחי. זו אחת הפינות הפוריות בגאורגיה,
    עם מטעי תפוחים ואפרסקים הנמשכים קילומטרים, וגם הנגישה מכולן: הכביש המהיר לגורי הוא הטוב במדינה והנסיעה
    אורכת קצת יותר משעה.

    האתר המרכזי הוא אופליסציחה, עיר חצובה בסלע רך מעל הגדה השמאלית של הנהר. ההיסטוריה שלה מגיעה אל האלף
    הראשון לפני הספירה, ומה ששרד היום הוא מקבץ של אולמות, גתות יין, רחובות ומדרגות ומעליהם בזיליקת לבנים
    מן המאה התשיעית או העשירית. גורי, תשעה קילומטרים משם, מוכרת בזכות המבצר על הגבעה המרכזית ובזכות מוזיאון
    סטלין, שעדיין מסודר ברובו לפי היגיון סובייטי — וזה בדיוק מה שהופך אותו לשווה שעה.

    בסביבה עומדות שתי כנסיות פחות מבוקרות שחשובות יותר לתולדות האמנות מאשר לרשימות התיירים. אתני סיוני,
    שנבנתה על פי הדגם של ג'וארי, יושבת בעמק צר של כרמים ושומרת ציורי קיר מן המאה ה-11. בקינצוויסי, ציורי
    כנסיית ניקולאס הקדוש — ובהם המלאך הכחול המפורסם — נמנים עם פסגות הציור הגאורגי של ימי הביניים. סמתאוויסי,
    ממש ליד הכביש הראשי, נערצת בזכות עיטורי החזית המגולפים שלה מן המאה ה-11.

    העונה כאן היא כל השנה, כי השלג אינו מחזיק זמן רב במישור. יום אחד מכסה את שלושת האתרים המרכזיים אם
    יוצאים מוקדם בבוקר, והאזור מתפקד היטב גם כעצירה קצרה בדרך מערבה לאימרתי.
  driving: >-
    הקטע טביליסי-גורי הוא הכביש המהיר הטוב ביותר בגאורגיה: דו-מסלולי, מואר, מהיר, עם מגבלה של 110 קמ״ש
    ומצלמות מהירות תכופות. גורי במרחק שעה, אופליסציחה עוד רבע שעה על אספלט טוב. רכב חסכוני מספיק לחלוטין
    למעגל הראשי.

    ההסתעפויות קשות יותר. הדרך במעלה עמק אתני צרה, במקומות בקושי ברוחב מכונית אחת, ותצטרכו לפנות דרך על
    הגשרים. הקילומטרים האחרונים לקינצוויסי אינם סלולים והופכים לחימר אחרי גשם, ולכן גובה גחון באמת עוזר.
    על הכביש המהיר עצמו היזהרו ממשאיות עוצרות בנתיב הימני ומטרקטורים הנכנסים מפניות הכפרים.

    דבר אחד חשוב מכל אלה. קו הגבול המנהלי עם אזור צחינוואלי הכבוש עובר בצפון האזור הזה ואינו תמיד מסומן
    בבירור. אל תלכו בעיוורון אחרי אפליקציית ניווט בדרכי הכפרים הצפוניות; הישארו על מסלולים מסומנים בשילוט.
  best_for:
  - טיול יום פשוט מטביליסי
  - אופליסציחה וגורי ביציאה אחת
  - ציורי קיר מימי הביניים באתני ובקינצוויסי
  - עצירה מועילה בדרך מערבה לקוטאיסי
ar:
  name: شيدا كارتلي
  short: أوبليستسيخي وغوري وبساتين الفاكهة في سهل متكفاري — أبسط رحلة يوم غرب تبليسي.
  body: >-
    شيدا كارتلي هي الوادي الأوسط العريض لنهر متكفاري، بين تبليسي وسلسلة ليخي. وهي من أخصب أركان جورجيا،
    ببساتين التفاح والخوخ الممتدة كيلومترات، وهي أيضاً الأسهل وصولاً: فالطريق السريع إلى غوري هو الأفضل
    في البلاد ولا يستغرق أكثر من ساعة بقليل.

    الموقع الرئيسي هو أوبليستسيخي، مدينة منحوتة في صخر لين فوق الضفة اليسرى للنهر. يعود تاريخها إلى الألف
    الأول قبل الميلاد، وما بقي منها اليوم طبقات من القاعات ومعاصر النبيذ والشوارع والأدراج، وفوقها بازيليكا
    من الآجر تعود إلى القرن التاسع أو العاشر. أما غوري، على بعد تسعة كيلومترات، فتُعرف بالقلعة القائمة
    على تلها المركزي وبمتحف ستالين، الذي ما زال منظماً في معظمه وفق منطق سوفييتي — وهذا بالضبط ما يجعله
    جديراً بساعة من وقتك.

    وفي الجوار تقف كنيستان أقل زيارة، لكنهما أهم لتاريخ الفن منهما لقوائم السياح. أتيني سيوني، المبنية
    على نموذج جفاري، تجلس في واد ضيق مزروع بالكروم وتحتفظ برسوم جدارية من القرن الحادي عشر. وفي كينتسفيسي
    تُعد رسوم كنيسة القديس نيقولا — ومنها الملاك الأزرق الشهير — من قمم التصوير الجورجي في العصور الوسطى.
    وسامتافيسي، الملاصقة للطريق السريع، تُقدَّر لزخارف واجهتها المنقوشة من القرن الحادي عشر.

    الموسم هنا هو العام كله، لأن الثلج لا يدوم طويلاً على السهل. يوم واحد يغطي المواقع الثلاثة الرئيسية
    إن انطلقت مبكراً، والإقليم يصلح أيضاً محطة في الطريق غرباً إلى إيميريتي.
  driving: >-
    مقطع تبليسي-غوري هو أفضل طريق سريع في جورجيا: مزدوج ومضاء وسريع، بحد أقصى 110 كم/س وكاميرات سرعة متكررة.
    غوري على بعد ساعة، وأوبليستسيخي على بعد ربع ساعة أخرى على إسفلت جيد. وسيارة اقتصادية تكفي تماماً للدارة
    الرئيسية.

    أما التفرعات فأصعب. الطريق صعوداً في وادي أتيني ضيق، وفي مواضع لا يتسع إلا لسيارة واحدة، وسيتعين عليك
    إفساح الطريق عند الجسور. والكيلومترات الأخيرة إلى كينتسفيسي غير معبّدة وتتحول إلى طين بعد المطر، ولذلك
    يفيد الخلوص الأرضي فعلاً. وعلى الطريق السريع نفسه انتبه للشاحنات المتوقفة في المسرب الأيمن وللجرارات
    الخارجة من مداخل القرى.

    وأمر واحد أهم من ذلك كله. يمر خط الحدود الإداري مع إقليم تسخينفالي المحتل في شمال هذا الإقليم، وهو
    ليس دائماً واضح العلامات. لا تتبع تطبيق الملاحة بلا تفكير على طرق القرى الشمالية؛ التزم بالمسارات
    الموضّحة باللافتات.
  best_for:
  - رحلة يوم مباشرة من تبليسي
  - أوبليستسيخي وغوري في جولة واحدة
  - الرسوم الجدارية في أتيني وكينتسفيسي
  - محطة مفيدة في الطريق غرباً إلى كوتايسي
