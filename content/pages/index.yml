  - type: h2
    text: چه کسانی در گرجستان خودرو اجاره می‌کنند
  - type: ul
    items:
    - >-
      **گردشگران** — رسیدن به مسیرهای اصلی گرجستان (کازبگی، سوانتی، کاختی، واردزیا) با حمل‌ونقل عمومی
      دشوار است؛ خودرو زمان سفر را دو تا سه برابر کوتاه می‌کند.
    - '**مسافران کاری** — در سفرهای کوتاه، خودروی کلاس بیزنس از روز سوم به بعد ارزان‌تر از تاکسی تمام
      می‌شود.'
    - >-
      **شرکت‌ها** — اجاره بلندمدت سازمانی جایگزین خرید ناوگان است: بدون قفل‌شدن سرمایه و بدون دردسر مدیریت
      تعمیر و نگهداری.
    - '**ساکنان محلی** — وقتی خودروی خودشان در تعمیرگاه است، برای نیازهای فصلی یا برای سفر خانوادگی.'
  - type: h2
    text: چه چیزی ما را متمایز می‌کند
  - type: cards
    items:
    - title: قیمت‌گذاری شفاف
      text: نرخی که در سایت می‌بینید نهایی است. بدون کارمزد پنهان، بدون «هزینه خدمات» و بدون بیمه اضافی
        اجباری.
    - title: میانگین عمر ناوگان — 4 سال
      text: هر خودرو هر 8,000 کیلومتر سرویس می‌شود و تاریخچه کامل آن به‌صورت دیجیتال ثبت می‌گردد.
    - title: ودیعه بلوکه می‌شود، نه برداشت
      text: مبلغ روی کارت شما بلوکه می‌شود و ظرف 3 روز کاری پس از بازگرداندن خودرو آزاد می‌گردد.
    - title: امداد جاده‌ای در سراسر کشور
      text: خط تماس 24/7؛ در صورت خرابی، خودروی جایگزین ظرف 6 ساعت به شما می‌رسد.
    - title: نرم‌افزار اختصاصی خودمان
      text: >-
        ناوگان را با سامانه خودمان، Drive On Manager، مدیریت می‌کنیم — به همین دلیل دقیقاً می‌دانیم هر خودرو
        چه زمانی آزاد می‌شود و رزرو تکراری غیرممکن است.
    - title: خدمات به سه زبان
      text: گرجی، انگلیسی و روسی — از جمله متن قرارداد اجاره.
  - type: h2
    text: پرسش‌های پرتکرار
  - type: faq
    items:
    - q: اجاره روزانه خودرو در گرجستان چقدر هزینه دارد؟
      a: >-
        خودروی کلاس اقتصادی از 75 لاری (حدود 28 دلار) در روز، کراس‌اوور از 130 لاری و آفرود 4x4 از 240
        لاری شروع می‌شود. برای اجاره بیش از 7 روز قیمت 10% و از 30 روز 25% کاهش می‌یابد.
    - q: برای اجاره خودرو چه مدارکی لازم است؟
      a: >-
        کارت شناسایی یا گذرنامه، گواهینامه رانندگی با حداقل 2 سال سابقه، و کارت اعتباری یا بانکی برای
        ودیعه. اتباع خارجی تنها در صورتی به گواهینامه بین‌المللی نیاز دارند که گواهینامه ملی‌شان با الفبای
        لاتین صادر نشده باشد.
    - q: آیا می‌توانم با خودروی اجاره‌ای از مرز خارج شوم؟
      a: >-
        سفر به ارمنستان با مجوزی که از پیش گرفته می‌شود مجاز است — 150 لاری به‌علاوه بیمه بین‌المللی.
        سفر به ترکیه برای برخی کلاس‌ها امکان‌پذیر است. سفر به آذربایجان و روسیه ممنوع است.
    - q: آیا کیلومتر محدودیت دارد؟
      a: >-
        خیر. کیلومتر در داخل گرجستان در همه نرخ‌ها نامحدود است. برای سفرهای برون‌مرزی سقف روزانه 300 کیلومتر
        اعمال می‌شود.
    - q: در صورت تصادف چه اتفاقی می‌افتد؟
      a: >-
        بیمه CDW که در قیمت گنجانده شده، خسارت بالاتر از فرانشیز (300–1,200 لاری بسته به کلاس) را پوشش
        می‌دهد. با پرداخت 25–45 لاری اضافه در روز می‌توان فرانشیز را به‌طور کامل حذف کرد.
    - q: آیا می‌توانم خودرو را در شهر دیگری تحویل دهم؟
      a: بله. اجاره یک‌طرفه در مسیرهای تفلیس↔کوتایسی↔باتومی از 100 لاری شروع می‌شود؛ سایر شهرها با هماهنگی.
  - type: p
    text: پرسش‌ها و پاسخ‌های بیشتر در [صفحه پرسش‌های متداول](/faq/) آمده است.
  - type: h2
    text: Drive On Manager — سامانه مدیریت ناوگان ما
  - type: p
    text: >-
      ناوگان Drive On را با اپلیکیشن خودمان، Drive On Manager، اداره می‌کنیم. همین سامانه در اختیار سایر شرکت‌های
      اجاره خودرو هم قرار می‌گیرد: رزروها، تشخیص تداخل، سود و زیان روزانه، نرخ بازگشت سرمایه و دوره بازگشت
      هر خودرو، هزینه‌ها، وام‌ها و بیمه — همه در یک جا. جزئیات در [صفحه Drive On Manager](/fleet-management-software/).
  - type: cta
    title: رزرو و مشاوره
    text: >-
      درخواست رزرو را مستقیماً از سایت ارسال کنید. پس از بررسی موجود بودن خودرو، دستورالعمل پرداخت را
      دریافت می‌کنید؛ رزرو پس از پرداخت الزامی تأیید می‌شود.
    actions:
    - label: تماس با ما
      href: /contact/
    - label: لیست قیمت
      href: /pricing/
    - label: شرایط اجاره
      href: /terms/
