    - tag: فرودگاه
      title: فرودگاه بین‌المللی تفلیس (TBS)
      text: استقبال در سالن ورودی، 24 ساعت شبانه‌روز. از 3 روز اجاره به بالا تحویل رایگان است.
      list:
      - تحویل 0 ₾ (3+ روز) / 40 ₾ (1–2 روز)
      - امکان تحویل و بازگرداندن در ساعات شب
    - tag: فرودگاه
      title: فرودگاه کوتایسی (KUT)
      text: مرکز اصلی پروازهای ارزان‌قیمت — بر اساس ساعت پرواز شما به استقبالتان می‌آییم.
      list:
      - تحویل 0 ₾ (5+ روز) / 60 ₾
      - امکان بازگرداندن خودرو در باتومی یا تفلیس
