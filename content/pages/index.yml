ka:
  title: დაგეგმე და გააზიარე მოგზაურობა საქართველოში | Drive On
  desc: >-
    დაგეგმე მოგზაურობა საქართველოში, მოარგე მარშრუტი, შეინახე და გაუზიარე მეგობრებსა თუ თანამგზავრებს.
    აღმოაჩინე ადგილები, საჯარო ტურები და საჭიროების შემთხვევაში შესაბამისი ავტომობილი.
  keywords: >-
    ავტომობილების გაქირავება, მანქანის ქირაობა თბილისი, rent a car georgia, ავტო რენტი, მანქანის გაქირავება
    ბათუმი, ქუთაისის აეროპორტი მანქანა
  h1: ავტომობილების გაქირავება საქართველოში
  hero:
    kicker: თბილისი · ქუთაისი · ბათუმი · მთელი საქართველო
    lead: >-
      Drive On აქირავებს ავტომობილებს დღიური, კვირეული და თვიური ვადით. ფასი მოიცავს სრულ სადაზღვევო
      დაფარვას, შეუზღუდავ გარბენს საქართველოს ტერიტორიაზე და 24/7 ტექნიკურ მხარდაჭერას. ეს გვერდი ინფორმაციულია
      — ჯავშნისთვის დაგვირეკეთ ან მოგვწერეთ.
    facts:
    - k: ავტომობილი პარკში
      v: '17'
    - k: ფასი დღეში
      v: 75 ₾-დან
    - k: მინიმალური ვადა
      v: 1 დღე
    - k: მიწოდების წერტილი
      v: '6'
  blocks:
  - type: h2
    text: მოკლედ — რას გთავაზობთ
  - type: p
    text: >-
      Drive On არის ავტომობილების გაქირავების კომპანია, რომელიც 2019 წლიდან მუშაობს საქართველოში. ავტოპარკში
      17 ავტომობილია: ეკონომ კლასიდან მაღალი გამავლობის 4x4-ებამდე და 8-ადგილიან მინივენებამდე.
      ავტომობილს ვაქირავებთ როგორც ტურისტებზე, ისე ადგილობრივ კომპანიებზე გრძელვადიანი კორპორატიული ხელშეკრულებით.
  - type: facts
    items:
    - k: მინიმალური ასაკი
      v: 21 წელი
    - k: მართვის სტაჟი
      v: 2+ წელი
    - k: დეპოზიტი
      v: 300–1500 ₾
    - k: გარბენი
      v: შეუზღუდავი
    - k: საწვავის პოლიტიკა
      v: სავსე → სავსე
    - k: დაზღვევა
      v: CDW ფასში შედის
  - type: h2
    text: ავტომობილების კატეგორიები და ფასები
  - type: p
    text: >-
      ქვემოთ მოცემულია საბაზისო დღიური ტარიფები 1–6 დღიანი გაქირავებისთვის. 7 დღიდან მოქმედებს 10%, 30
      დღიდან — 25% ფასდაკლება. სრული ცხრილი და დამატებითი სერვისების ღირებულება — [ფასების გვერდზე](/pricing/).
  - type: table
    rowhead: true
    caption: დღიური ტარიფი, ლარი (დღგ-ს ჩათვლით) — 2026 წლის მდგომარეობით
    head:
    - კატეგორია
    - მაგალითი
    - 1–6 დღე
    - 7–29 დღე
    - 30+ დღე
    - დეპოზიტი
    rows:
    - cells:
      - ეკონომ კლასი
      - Toyota Prius, Hyundai Elantra
      - 75 ₾
      - 68 ₾
      - 56 ₾
      - 300 ₾
    - cells:
      - კროსოვერი / SUV
      - Toyota RAV4, Hyundai Tucson
      - 130 ₾
      - 117 ₾
      - 98 ₾
      - 600 ₾
    - cells:
      - ბიზნეს კლასი
      - Toyota Camry, Mercedes E-Class
      - 210 ₾
      - 189 ₾
      - 158 ₾
      - 1000 ₾
    - cells:
      - მაღალი გამავლობის 4x4
      - Land Cruiser Prado, Delica
      - 240 ₾
      - 216 ₾
      - 180 ₾
      - 1200 ₾
    - cells:
      - მინივენი 7–8 ადგილი
      - Toyota Alphard, Hyundai Staria
      - 200 ₾
      - 180 ₾
      - 150 ₾
      - 1000 ₾
    - cells:
      - კომერციული ფურგონი
      - Ford Transit, Mercedes Sprinter
      - 185 ₾
      - 167 ₾
      - 139 ₾
      - 800 ₾
  - type: note
    text: >-
      **ფასში შედის:** CDW სადაზღვევო დაფარვა, შეუზღუდავი გარბენი საქართველოში, ტექმომსახურება, საგზაო
      დახმარება 24/7, ზამთრის საბურავები სეზონზე და დღგ. **ფასში არ შედის:** საწვავი, ჯარიმები, დამატებითი
      მძღოლი და საზღვრის კვეთის ნებართვა.
  - type: h2
    text: სად შეგიძლიათ მიიღოთ ავტომობილი
  - type: cards
    items:
    - tag: აეროპორტი
      title: თბილისის საერთაშორისო აეროპორტი (TBS)
      text: შეხვედრა ჩამოსვლის დარბაზში, 24 საათი. მიწოდება უფასოა 3 დღიდან.
      list:
      - მიწოდება 0 ₾ (3+ დღე) / 40 ₾ (1–2 დღე)
      - ღამის მიღება-ჩაბარება ხელმისაწვდომია
    - tag: აეროპორტი
      title: ქუთაისის აეროპორტი (KUT)
      text: დაბალბიუჯეტიანი რეისების ძირითადი წერტილი — შეხვედრა რეისის მიხედვით.
      list:
      - მიწოდება 0 ₾ (5+ დღე) / 60 ₾
      - დაბრუნება ბათუმში ან თბილისში შესაძლებელია
    - tag: აეროპორტი
      title: ბათუმის აეროპორტი (BUS)
      text: საზაფხულო სეზონზე გაზრდილი ავტოპარკი შავი ზღვის სანაპიროზე.
      list:
      - მიწოდება 0 ₾ (5+ დღე) / 50 ₾
      - ერთმხრივი გაქირავება — 100 ₾-დან
    - tag: ოფისი
      title: თბილისი, ვაჟა-ფშაველას გამზირი
      text: მთავარი ოფისი და სერვის-ცენტრი. ავტომობილის დათვალიერება ადგილზე.
      list:
      - ორშ.–კვ. 09:00–21:00
      - მიწოდება ქალაქში უფასოა
    - tag: რეგიონი
      title: ბათუმი, ქუთაისი, თელავი — ქალაქის ცენტრი
      text: მისამართზე მიწოდება წინასწარი შეთანხმებით.
      list:
      - მიწოდება 30–80 ₾ ქალაქის მიხედვით
    - tag: სასაზღვრო
      title: სასაზღვრო პუნქტები (სარფი, ყაზბეგი)
      text: ინდივიდუალური შეთანხმებით, სულ მცირე 5 დღიანი გაქირავებისას.
      list:
      - მიწოდება 120 ₾-დან
  - type: h2
    text: ვის სჭირდება ავტომობილის გაქირავება საქართველოში
  - type: ul
    items:
    - >-
      **ტურისტებს** — საქართველოს მთავარი მარშრუტები (ყაზბეგი, სვანეთი, კახეთი, ვარძია) საზოგადოებრივი
      ტრანსპორტით რთულად მისაწვდომია; ავტომობილი დროს 2–3-ჯერ ზოგავს.
    - '**ბიზნეს მოგზაურებს** — მოკლევადიანი ვიზიტისას ბიზნეს კლასის ავტომობილი ტაქსზე იაფი გამოდის 3 დღიდან.'
    - >-
      **კომპანიებს** — კორპორატიული გრძელვადიანი გაქირავება ავტოპარკის ყიდვის ალტერნატივაა: არ ჩერდება
      კაპიტალი, არ საჭიროებს ტექმომსახურების ადმინისტრირებას.
    - '**ადგილობრივ მოსახლეობას** — საკუთარი ავტომობილის რემონტის, სეზონური საჭიროების ან საოჯახო მოგზაურობის
      დროს.'
  - type: h2
    text: რით განვსხვავდებით
  - type: cards
    items:
    - title: გამჭვირვალე ფასი
      text: >-
        საიტზე მითითებული ტარიფი საბოლოოა. დამალული საკომისიო, „სერვისის საფასური“ ან სავალდებულო დამატებითი
        დაზღვევა არ გვაქვს.
    - title: ავტოპარკის საშუალო ასაკი — 4 წელი
      text: ყველა ავტომობილს ტექმომსახურება უტარდება ყოველ 8 000 კმ-ზე, ისტორია ციფრულად აღირიცხება.
    - title: დეპოზიტი ბლოკირებით, არა ჩამოჭრით
      text: ბარათზე თანხა იბლოკება და თავისუფლდება ავტომობილის ჩაბარებიდან 3 სამუშაო დღეში.
    - title: საგზაო დახმარება მთელ ქვეყანაში
      text: 24/7 ცხელი ხაზი; გაუმართაობის შემთხვევაში სანაცვლო ავტომობილი 6 საათში.
    - title: საკუთარი პროგრამული უზრუნველყოფა
      text: >-
        ავტოპარკს ვმართავთ საკუთარი სისტემით Drive On Manager — ამიტომ ვიცით ზუსტად რომელი მანქანა როდის თავისუფლდება
        და ორმაგი ჯავშანი გამორიცხულია.
    - title: სამენოვანი მომსახურება
      text: ქართული, ინგლისური და რუსული — ხელშეკრულების ჩათვლით.
  - type: h2
    text: ხშირად დასმული კითხვები
  - type: faq
    items:
    - q: რამდენი ღირს მანქანის ქირაობა საქართველოში დღეში?
      a: >-
        ეკონომ კლასის ავტომობილი ჯდება 75 ლარიდან (დაახლოებით 28 აშშ დოლარი) დღეში, კროსოვერი — 130 ლარიდან,
        მაღალი გამავლობის 4x4 — 240 ლარიდან. 7 დღეზე მეტი ვადით ფასი 10%-ით, 30 დღიდან — 25%-ით მცირდება.
    - q: რა საბუთებია საჭირო ავტომობილის დასაქირავებლად?
      a: >-
        პირადობის მოწმობა ან პასპორტი, მართვის მოწმობა მინიმუმ 2 წლიანი სტაჟით და საკრედიტო ან სადებეტო
        ბარათი დეპოზიტისთვის. უცხოელი მოქალაქისთვის საერთაშორისო მართვის მოწმობა საჭიროა მხოლოდ იმ შემთხვევაში,
        თუ ეროვნული მოწმობა არ არის ლათინური ანბანით.
    - q: შემიძლია თუ არა დაქირავებული ავტომობილით საზღვრის კვეთა?
      a: >-
        სომხეთში გასვლა ნებადართულია წინასწარი ნებართვით — 150 ლარი, დამატებით საერთაშორისო დაზღვევა.
        თურქეთში გასვლა შესაძლებელია ცალკეული კატეგორიებისთვის. აზერბაიჯანსა და რუსეთში გასვლა აკრძალულია.
    - q: არის თუ არა გარბენი შეზღუდული?
      a: >-
        არა. საქართველოს ტერიტორიაზე გარბენი შეუზღუდავია ყველა ტარიფზე. საზღვრის კვეთისას მოქმედებს დღიური
        ლიმიტი 300 კმ.
    - q: რა ხდება ავარიის შემთხვევაში?
      a: >-
        ფასში შემავალი CDW დაზღვევა ფარავს ზიანს ფრანშიზის ფარგლებში (300–1200 ლარი კატეგორიის მიხედვით).
        ფრანშიზის სრულად გაუქმება შესაძლებელია დამატებით 25–45 ლარად დღეში.
    - q: შეიძლება თუ არა ავტომობილის დაბრუნება სხვა ქალაქში?
      a: დიახ. ერთმხრივი გაქირავება თბილისი↔ქუთაისი↔ბათუმი მიმართულებით ჯდება 100 ლარიდან, სხვა ქალაქები
        — შეთანხმებით.
  - type: p
    text: დანარჩენი კითხვები და პასუხები — [FAQ გვერდზე](/faq/).
  - type: h2
    text: Drive On Manager — ჩვენი ავტოპარკის მართვის სისტემა
  - type: p
    text: >-
      Drive On-ის ავტოპარკს ვმართავთ საკუთარი აპლიკაციით Drive On Manager. იგივე სისტემა ხელმისაწვდომია სხვა
      გაქირავების კომპანიებისთვისაც: ჯავშნები, კონფლიქტების დეტექცია, დღიური P&L, თითო ავტომობილის ROI
      და უკუგების ვადა, ხარჯები, სესხები და დაზღვევა ერთ ადგილას. დეტალები — [Drive On Manager-ის გვერდზე](/fleet-management-software/).
  - type: cta
    title: ჯავშნა და კონსულტაცია
    text: >-
