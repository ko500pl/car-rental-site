    text: Чем мы отличаемся
  - type: cards
    items:
    - title: Прозрачная цена
      text: >-
        Указанный на сайте тариф окончательный. Скрытых комиссий, «сервисных сборов» или обязательной
        доплаты за страховку у нас нет.
    - title: Средний возраст парка — 4 года
      text: Каждая машина проходит техобслуживание каждые 8 000 км, история фиксируется в цифровом виде.
    - title: Депозит блокируется, а не списывается
      text: Сумма блокируется на карте и разблокируется в течение 3 рабочих дней после возврата автомобиля.
    - title: Помощь на дороге по всей стране
      text: Горячая линия 24/7; при поломке подменный автомобиль в течение 6 часов.
    - title: Собственное программное обеспечение
      text: >-
        Парком мы управляем через собственную систему Drive On Manager — поэтому точно знаем, какая машина и
        когда освобождается, и двойная бронь исключена.
    - title: Обслуживание на трёх языках
      text: Грузинский, английский и русский — включая договор.
  - type: h2
    text: Часто задаваемые вопросы
  - type: faq
    items:
    - q: Сколько стоит аренда машины в Грузии в сутки?
      a: >-
        Автомобиль эконом-класса — от 75 лари (примерно 28 долларов США) в сутки, кроссовер — от 130 лари,
        внедорожник 4x4 — от 240 лари. При аренде дольше 7 дней цена снижается на 10%, от 30 дней — на
        25%.
    - q: Какие документы нужны для аренды автомобиля?
      a: >-
        Удостоверение личности или паспорт, водительские права со стажем не менее 2 лет и кредитная или
        дебетовая карта для депозита. Иностранным гражданам международные права нужны только в том случае,
        если национальное удостоверение оформлено не латиницей.
    - q: Можно ли выезжать на арендованной машине за границу?
      a: >-
        Выезд в Армению разрешён по предварительному разрешению — 150 лари плюс международная страховка.
        Выезд в Турцию возможен для отдельных категорий. Выезд в Азербайджан и Россию запрещён.
    - q: Ограничен ли пробег?
      a: >-
        Нет. По территории Грузии пробег не ограничен на всех тарифах. При выезде за границу действует
        суточный лимит 300 км.
    - q: Что делать при ДТП?
      a: >-
        Включённая в цену страховка CDW покрывает ущерб в пределах франшизы (300–1200 лари в зависимости
        от категории). Франшизу можно обнулить полностью за доплату 25–45 лари в сутки.
    - q: Можно ли вернуть автомобиль в другом городе?
      a: >-
        Да. Аренда в одну сторону по маршрутам Тбилиси↔Кутаиси↔Батуми стоит от 100 лари, другие города
        — по договорённости.
  - type: p
    text: Остальные вопросы и ответы — [на странице FAQ](/faq/).
  - type: h2
    text: Drive On Manager — наша система управления автопарком
  - type: p
    text: >-
      Автопарком Drive On мы управляем через собственное приложение Drive On Manager. Эта же система доступна
      другим прокатным компаниям: бронирования, выявление конфликтов, ежедневный P&L, ROI и срок окупаемости
      по каждой машине, расходы, кредиты и страховки в одном месте. Подробности — [на странице Drive On Manager](/fleet-management-software/).
  - type: cta
    title: Бронирование и консультация
    text: >-
      Отправьте заявку на бронирование прямо с сайта. После проверки доступности вы получите инструкции
      по оплате; бронь подтверждается после обязательной оплаты.
    actions:
    - label: Контакты
      href: /contact/
    - label: Таблица цен
      href: /pricing/
    - label: Условия аренды
      href: /terms/
