en:
  title: Plan and Share a Trip in Georgia | Drive On
  desc: >-
    Plan a trip across Georgia, shape the route, save it, and share it with friends or fellow travellers.
    Discover places, public trips, and a suitable vehicle when the route calls for one.
  keywords: >-
    car rental Georgia, rent a car Tbilisi, rent a car georgia, car hire Georgia, car hire Batumi, Kutaisi
    airport car rental
  h1: Car Rental in Georgia
  hero:
    kicker: Tbilisi · Kutaisi · Batumi · all of Georgia
    lead: >-
      Drive On rents out cars by the day, the week and the month. The rate includes full insurance coverage,
      unlimited mileage within Georgia and 24/7 technical support. This page is informational — call or
      email us to book.
    facts:
    - k: Vehicles in the fleet
      v: '17'
    - k: Price per day
      v: from 75 ₾
    - k: Minimum rental period
      v: 1 day
    - k: Pickup points
      v: '6'
  blocks:
  - type: h2
    text: In short — what we offer
  - type: p
    text: >-
      Drive On is a car rental company that has been operating in Georgia since 2019. The fleet holds
      17 vehicles, from economy class through off-road 4x4s to eight-seat minivans. We rent
      to tourists as well as to local companies on long-term corporate contracts.
  - type: facts
    items:
    - k: Minimum age
      v: 21 years
    - k: Driving experience
      v: 2+ years
    - k: Deposit
      v: 300–1500 ₾
    - k: Mileage
      v: Unlimited
    - k: Fuel policy
      v: Full → full
    - k: Insurance
      v: CDW included
  - type: h2
    text: Vehicle categories and prices
  - type: p
    text: >-
      Below are the base daily rates for rentals of 1–6 days. From 7 days a 10% discount applies, from
      30 days — 25%. The full table and the cost of extras are on the [pricing page](/pricing/).
  - type: table
    rowhead: true
    caption: Daily rate in GEL (VAT included) — valid as of 2026
    head:
    - Category
    - Example
    - 1–6 days
    - 7–29 days
    - 30+ days
    - Deposit
    rows:
    - cells:
      - Economy class
      - Toyota Prius, Hyundai Elantra
      - 75 ₾
      - 68 ₾
      - 56 ₾
      - 300 ₾
    - cells:
      - Crossover / SUV
      - Toyota RAV4, Hyundai Tucson
      - 130 ₾
      - 117 ₾
      - 98 ₾
      - 600 ₾
    - cells:
      - Business class
      - Toyota Camry, Mercedes E-Class
      - 210 ₾
      - 189 ₾
      - 158 ₾
      - 1000 ₾
    - cells:
      - Off-road 4x4
      - Land Cruiser Prado, Delica
      - 240 ₾
      - 216 ₾
      - 180 ₾
      - 1200 ₾
    - cells:
      - Minivan, 7–8 seats
      - Toyota Alphard, Hyundai Staria
      - 200 ₾
      - 180 ₾
      - 150 ₾
      - 1000 ₾
    - cells:
      - Commercial van
      - Ford Transit, Mercedes Sprinter
      - 185 ₾
      - 167 ₾
      - 139 ₾
      - 800 ₾
  - type: note
    text: >-
      **Included in the price:** CDW insurance coverage, unlimited mileage within Georgia, servicing,
      24/7 roadside assistance, winter tyres in season and VAT. **Not included:** fuel, traffic fines,
      additional drivers and cross-border permits.
  - type: h2
    text: Where you can pick up your car
  - type: cards
    items:
    - tag: Airport
      title: Tbilisi International Airport (TBS)
      text: Meet and greet in the arrivals hall, 24 hours a day. Delivery is free from 3 days.
      list:
      - Delivery 0 ₾ (3+ days) / 40 ₾ (1–2 days)
      - Night handover and return available
    - tag: Airport
      title: Kutaisi Airport (KUT)
      text: The main hub for low-cost flights — we meet you according to your flight time.
      list:
      - Delivery 0 ₾ (5+ days) / 60 ₾
      - Return in Batumi or Tbilisi possible
    - tag: Airport
      title: Batumi Airport (BUS)
      text: An expanded summer-season fleet right on the Black Sea coast.
      list:
      - Delivery 0 ₾ (5+ days) / 50 ₾
      - One-way rental — from 100 ₾
    - tag: Office
      title: Tbilisi, Vazha-Pshavela Avenue
      text: Head office and service centre. Inspect the car on site.
      list:
      - Mon–Sun 09:00–21:00
      - Delivery within the city is free
    - tag: Regions
      title: Batumi, Kutaisi, Telavi — city centre
      text: Delivery to your address by prior arrangement.
      list:
      - Delivery 30–80 ₾ depending on the city
    - tag: Border
      title: Border crossings (Sarpi, Kazbegi)
      text: By individual arrangement, for rentals of at least 5 days.
      list:
      - Delivery from 120 ₾
  - type: h2
    text: Who rents a car in Georgia
  - type: ul
    items:
    - >-
      **Tourists** — Georgia's main routes (Kazbegi, Svaneti, Kakheti, Vardzia) are hard to reach by public
      transport; a car cuts travel time by two to three times.
    - >-
      **Business travellers** — on a short visit a business-class car works out cheaper than taxis from
      day three onwards.
    - >-
      **Companies** — long-term corporate rental is an alternative to buying a fleet: no capital tied
      up, no maintenance administration to run.
    - '**Local residents** — while their own car is in the workshop, for seasonal needs or for a family
      trip.'
  - type: h2
    text: What sets us apart
  - type: cards
    items:
    - title: Transparent pricing
      text: >-
        The rate shown on the website is final. No hidden commissions, no "service fees" and no compulsory
        extra insurance.
    - title: Average fleet age — 4 years
      text: Every vehicle is serviced every 8,000 km, and the full history is logged digitally.
    - title: Deposit blocked, not charged
      text: The amount is blocked on your card and released within 3 business days of returning the car.
    - title: Roadside assistance nationwide
      text: A 24/7 hotline; in the event of a breakdown a replacement car reaches you within 6 hours.
    - title: Our own software
      text: >-
        We run the fleet on our own system, Drive On Manager — which is why we know exactly which car frees
        up when, and double bookings are impossible.
    - title: Service in three languages
      text: Georgian, English and Russian — including the rental agreement.
  - type: h2
    text: Frequently asked questions
  - type: faq
    items:
    - q: How much does it cost to rent a car in Georgia per day?
      a: >-
        An economy-class car starts at 75 GEL (roughly 28 USD) per day, a crossover at 130 GEL and an
        off-road 4x4 at 240 GEL. For rentals over 7 days the price drops by 10%, and from 30 days by 25%.
    - q: What documents do I need to rent a car?
      a: >-
        An ID card or passport, a driving licence held for at least 2 years, and a credit or debit card
        for the deposit. Foreign nationals need an international driving permit only if their national
        licence is not issued in the Latin alphabet.
    - q: Can I cross the border in a rental car?
      a: >-
        Travel to Armenia is allowed with a permit arranged in advance — 150 GEL, plus international insurance.
        Travel to Turkey is possible for selected categories. Travel to Azerbaijan and Russia is prohibited.
    - q: Is the mileage limited?
      a: No. Mileage within Georgia is unlimited on every rate. For cross-border trips a daily limit of
        300 km applies.
    - q: What happens in the event of an accident?
      a: >-
        The CDW insurance included in the price covers damage above the excess (300–1,200 GEL depending
        on category). The excess can be waived entirely for an extra 25–45 GEL per day.
    - q: Can I return the car in a different city?
      a: Yes. One-way rentals on the Tbilisi↔Kutaisi↔Batumi routes start at 100 GEL; other cities by arrangement.
  - type: p
    text: More questions and answers are on the [FAQ page](/faq/).
  - type: h2
    text: Drive On Manager — our fleet management system
  - type: p
    text: >-
      We run the Drive On fleet on our own app, Drive On Manager. The same system is available to other rental
      companies: bookings, conflict detection, daily P&L, per-vehicle ROI and payback period, expenses,
      loans and insurance all in one place. Details are on the [Drive On Manager page](/fleet-management-software/).
  - type: cta
    title: Booking and consultation
    text: >-
      Submit a booking request directly from the website. After availability is checked, you will receive
      payment instructions; the booking is confirmed after the required payment.
    actions:
    - label: Contact
      href: /contact/
    - label: Price list
      href: /pricing/
    - label: Rental terms
      href: /terms/
