    items:
    - title: תמחור שקוף
      text: המחיר שמופיע באתר הוא המחיר הסופי. בלי עמלות נסתרות, בלי "דמי שירות" ובלי ביטוח נוסף בכפייה.
    - title: גיל ממוצע של הצי — 4 שנים
      text: כל רכב עובר טיפול כל 8,000 ק"מ, וההיסטוריה המלאה נרשמת דיגיטלית.
    - title: הפיקדון נחסם, לא נגבה
      text: הסכום נחסם בכרטיס שלכם ומשוחרר תוך 3 ימי עסקים מהחזרת הרכב.
    - title: סיוע בדרכים בכל הארץ
      text: קו חם 24/7; במקרה של תקלה רכב חלופי מגיע אליכם תוך 6 שעות.
    - title: תוכנה מבית היוצר שלנו
      text: >-
        אנחנו מנהלים את הצי במערכת שפיתחנו, Drive On Manager — ולכן אנחנו יודעים בדיוק איזה רכב מתפנה ומתי,
        וכפל הזמנות פשוט לא ייתכן.
    - title: שירות בשלוש שפות
      text: גאורגית, אנגלית ורוסית — כולל חוזה ההשכרה.
  - type: h2
    text: שאלות נפוצות
  - type: faq
    items:
    - q: כמה עולה השכרת רכב בגאורגיה ליום?
      a: >-
        רכב ממחלקת אקונומי מתחיל ב-75 לארי (כ-28 דולר) ליום, קרוסאובר ב-130 לארי ורכב שטח 4x4 ב-240 לארי.
        בהשכרה של יותר מ-7 ימים המחיר יורד ב-10%, ומ-30 ימים ב-25%.
    - q: אילו מסמכים נדרשים להשכרת רכב?
      a: >-
        תעודת זהות או דרכון, רישיון נהיגה בוותק של 2 שנים לפחות, וכרטיס אשראי או דביט לפיקדון. אזרחים
        זרים זקוקים לרישיון נהיגה בינלאומי רק אם הרישיון הלאומי שלהם אינו מונפק באותיות לטיניות.
    - q: אפשר לחצות את הגבול ברכב שכור?
      a: >-
        נסיעה לארמניה מותרת עם אישור שמסודר מראש — 150 לארי בתוספת ביטוח בינלאומי. נסיעה לטורקיה אפשרית
        בקטגוריות מסוימות. נסיעה לאזרבייג'ן ולרוסיה אסורה.
    - q: האם הקילומטראז' מוגבל?
      a: לא. בתוך גאורגיה הקילומטראז' בלתי מוגבל בכל התעריפים. בנסיעות מעבר לגבול חלה מגבלה של 300 ק"מ
        ליום.
    - q: מה קורה במקרה של תאונה?
      a: >-
        ביטוח ה-CDW הכלול במחיר מכסה נזק מעל ההשתתפות העצמית (300–1,200 לארי, בהתאם לקטגוריה). אפשר לבטל
        את ההשתתפות העצמית לחלוטין בתוספת 25–45 לארי ליום.
    - q: אפשר להחזיר את הרכב בעיר אחרת?
      a: כן. השכרה בכיוון אחד במסלולים טביליסי↔קוטאיסי↔בטומי מתחילה ב-100 לארי; ערים אחרות בתיאום.
  - type: p
    text: שאלות ותשובות נוספות נמצאות ב[עמוד השאלות הנפוצות](/faq/).
  - type: h2
    text: Drive On Manager — מערכת ניהול הצי שלנו
  - type: p
    text: >-
      את הצי של Drive On אנחנו מנהלים באפליקציה שפיתחנו, Drive On Manager. אותה מערכת זמינה גם לחברות השכרה
      אחרות: הזמנות, זיהוי התנגשויות, רווח והפסד יומי, ROI ותקופת החזר לכל רכב, הוצאות, הלוואות וביטוחים
      — הכול במקום אחד. פרטים ב[עמוד Drive On Manager](/fleet-management-software/).
  - type: cta
    title: הזמנה וייעוץ
    text: >-
      שלחו בקשת הזמנה ישירות מהאתר. לאחר בדיקת הזמינות יישלחו הוראות תשלום; ההזמנה מאושרת לאחר התשלום
      הנדרש.
    actions:
    - label: צור קשר
      href: /contact/
    - label: מחירון
      href: /pricing/
    - label: תנאי השכרה
      href: /terms/
ar:
  title: خطط وشارك رحلتك في جورجيا | Drive On
  desc: >-
    خطط رحلتك في جورجيا وعدّل المسار واحفظه وشاركه مع الأصدقاء أو رفقاء السفر.
    اكتشف الأماكن والرحلات العامة والسيارة المناسبة عندما يحتاج إليها المسار.
  keywords: >-
    تأجير سيارات في جورجيا, ايجار سيارات تبليسي, استئجار سيارة في جورجيا, تأجير سيارات باتومي, تأجير سيارات
    مطار كوتايسي
  h1: تأجير السيارات في جورجيا
  hero:
    kicker: تبليسي · كوتايسي · باتومي · جميع أنحاء جورجيا
    lead: >-
      تؤجّر Drive On السيارات باليوم والأسبوع والشهر. ويشمل السعر تغطية تأمينية كاملة وكيلومترات غير
      محدودة داخل جورجيا ودعماً فنياً 24/7. هذه الصفحة للاطلاع فقط — للحجز اتصل بنا أو أرسل بريداً إلكترونياً.
    facts:
    - k: سيارة في الأسطول
      v: '17'
    - k: السعر لليوم
      v: من 75 ₾
    - k: أقل مدة إيجار
      v: 1 يوم
    - k: نقاط الاستلام
      v: '6'
  blocks:
  - type: h2
    text: باختصار — ما الذي نقدمه
  - type: p
    text: >-
      Drive On شركة لتأجير السيارات تعمل في جورجيا منذ عام 2019. ويضم أسطولنا 17 سيارة، من
      الفئة الاقتصادية إلى سيارات الدفع الرباعي 4x4 وصولاً إلى الميني فان بثمانية مقاعد. نؤجّر للسياح
      وللشركات المحلية بعقود مؤسسية طويلة الأجل.
  - type: facts
    items:
    - k: الحد الأدنى للسن
      v: 21 عاماً
    - k: خبرة القيادة
      v: 2+ سنة
    - k: الوديعة
      v: 300–1500 ₾
    - k: الكيلومترات
      v: غير محدودة
    - k: سياسة الوقود
      v: ممتلئ → ممتلئ
    - k: التأمين
      v: يشمل CDW
  - type: h2
    text: فئات السيارات والأسعار
  - type: p
    text: >-
      في ما يلي الأسعار اليومية الأساسية للإيجار من 1 إلى 6 أيام. ومن 7 أيام يُطبَّق خصم 10%، ومن 30 يوماً
      — 25%. الجدول الكامل وتكلفة الخدمات الإضافية على [صفحة الأسعار](/pricing/).
  - type: table
    rowhead: true
    caption: السعر اليومي باللاري (شامل ضريبة القيمة المضافة) — سارٍ لعام 2026
    head:
    - الفئة
    - مثال
    - 1–6 أيام
    - 7–29 يوماً
    - 30+ يوماً
    - الوديعة
    rows:
    - cells:
      - الفئة الاقتصادية
      - Toyota Prius, Hyundai Elantra
      - 75 ₾
      - 68 ₾
      - 56 ₾
      - 300 ₾
    - cells:
      - كروس أوفر / SUV
      - Toyota RAV4, Hyundai Tucson
      - 130 ₾
      - 117 ₾
      - 98 ₾
      - 600 ₾
    - cells:
      - فئة رجال الأعمال
      - Toyota Camry, Mercedes E-Class
      - 210 ₾
      - 189 ₾
      - 158 ₾
      - 1000 ₾
    - cells:
      - دفع رباعي 4x4
      - Land Cruiser Prado, Delica
      - 240 ₾
      - 216 ₾
      - 180 ₾
      - 1200 ₾
    - cells:
      - ميني فان، 7–8 مقاعد
      - Toyota Alphard, Hyundai Staria
      - 200 ₾
      - 180 ₾
      - 150 ₾
      - 1000 ₾
    - cells:
      - فان تجاري
      - Ford Transit, Mercedes Sprinter
      - 185 ₾
      - 167 ₾
      - 139 ₾
      - 800 ₾
  - type: note
    text: >-
      **يشمل السعر:** تغطية تأمين CDW، وكيلومترات غير محدودة داخل جورجيا، والصيانة، والمساعدة على الطريق
      24/7، وإطارات شتوية في موسمها، وضريبة القيمة المضافة. **لا يشمل:** الوقود، ومخالفات المرور، والسائقين
      الإضافيين، وتصاريح عبور الحدود.
  - type: h2
    text: أين يمكنك استلام السيارة
  - type: cards
    items:
    - tag: مطار
      title: مطار تبليسي الدولي (TBS)
      text: استقبال في صالة الوصول على مدار 24 ساعة. والتسليم مجاني اعتباراً من 3 أيام.
      list:
      - التسليم 0 ₾ (3+ أيام) / 40 ₾ (1–2 يوم)
      - إمكانية التسليم والإرجاع ليلاً
    - tag: مطار
      title: مطار كوتايسي (KUT)
      text: المركز الرئيسي لرحلات الطيران الاقتصادي — نستقبلك وفق موعد رحلتك.
      list:
      - التسليم 0 ₾ (5+ أيام) / 60 ₾
      - إمكانية إعادة السيارة في باتومي أو تبليسي
    - tag: مطار
      title: مطار باتومي (BUS)
      text: أسطول موسّع في موسم الصيف على ساحل البحر الأسود مباشرة.
      list:
      - التسليم 0 ₾ (5+ أيام) / 50 ₾
      - إيجار باتجاه واحد — من 100 ₾
    - tag: مكتب
      title: تبليسي، جادة فاجا-بشافيلا
      text: المكتب الرئيسي ومركز الخدمة. يمكنك معاينة السيارة في المكان.
      list:
      - كل أيام الأسبوع 09:00–21:00
      - التسليم داخل المدينة مجاني
    - tag: المناطق
      title: باتومي، كوتايسي، تيلافي — وسط المدينة
      text: التسليم إلى عنوانك بترتيب مسبق.
      list:
      - التسليم 30–80 ₾ حسب المدينة
    - tag: الحدود
      title: المعابر الحدودية (ساربي، كازبيغي)
      text: بترتيب خاص، وللإيجار لمدة 5 أيام على الأقل.
      list:
      - التسليم من 120 ₾
  - type: h2
    text: من يستأجر سيارة في جورجيا
  - type: ul
    items:
    - >-
      **السياح** — يصعب الوصول إلى أبرز مسارات جورجيا (كازبيغي، سفانيتي، كاخيتي، فاردزيا) بوسائل النقل
      العام؛ والسيارة تختصر زمن الرحلة مرتين إلى ثلاث مرات.
    - >-
      **مسافرو الأعمال** — في الزيارات القصيرة تصبح سيارة فئة رجال الأعمال أرخص من سيارات الأجرة اعتباراً
      من اليوم الثالث.
    - '**الشركات** — الإيجار المؤسسي طويل الأجل بديل عن شراء أسطول: دون تجميد رأس المال ودون إدارة أعمال
      الصيانة.'
    - '**السكان المحليون** — أثناء وجود سيارتهم في الورشة، أو لاحتياجات موسمية، أو لرحلة عائلية.'
  - type: h2
    text: ما الذي يميّزنا
  - type: cards
    items:
    - title: تسعير شفاف
      text: السعر المعروض على الموقع نهائي. بلا عمولات خفية، وبلا «رسوم خدمة»، وبلا تأمين إضافي إلزامي.
    - title: متوسط عمر الأسطول — 4 سنوات
      text: تخضع كل سيارة للصيانة كل 8,000 كم، ويُسجَّل تاريخها الكامل رقمياً.
    - title: الوديعة تُحجز ولا تُخصم
      text: يُحجز المبلغ على بطاقتك ويُفرج عنه خلال 3 أيام عمل من إعادة السيارة.
    - title: مساعدة على الطريق في كل أنحاء البلاد
      text: خط ساخن 24/7؛ وعند حدوث عطل تصلك سيارة بديلة خلال 6 ساعات.
    - title: برنامجنا الخاص
      text: ندير الأسطول عبر نظامنا الخاص Drive On Manager — لذلك نعرف بدقة أي سيارة تصبح متاحة ومتى، ويستحيل
        حدوث حجز مزدوج.
    - title: خدمة بثلاث لغات
      text: الجورجية والإنجليزية والروسية — بما في ذلك عقد الإيجار.
  - type: h2
    text: الأسئلة الشائعة
  - type: faq
    items:
    - q: كم تبلغ تكلفة استئجار سيارة في جورجيا يومياً؟
      a: >-
        تبدأ سيارة الفئة الاقتصادية من 75 لاري (نحو 28 دولاراً) في اليوم، والكروس أوفر من 130 لاري، وسيارة
        الدفع الرباعي 4x4 من 240 لاري. وفي الإيجار لأكثر من 7 أيام ينخفض السعر بنسبة 10%، ومن 30 يوماً
        بنسبة 25%.
    - q: ما المستندات المطلوبة لاستئجار سيارة؟
      a: >-
        بطاقة هوية أو جواز سفر، ورخصة قيادة مضى على إصدارها 2 سنة على الأقل، وبطاقة ائتمان أو خصم للوديعة.
        ولا يحتاج الأجانب إلى رخصة قيادة دولية إلا إذا كانت رخصتهم الوطنية غير صادرة بالحروف اللاتينية.
    - q: هل يمكنني عبور الحدود بسيارة مستأجرة؟
      a: >-
        السفر إلى أرمينيا مسموح بتصريح يُرتَّب مسبقاً — 150 لاري إضافة إلى تأمين دولي. والسفر إلى تركيا
        ممكن لفئات محددة. أما السفر إلى أذربيجان وروسيا فممنوع.
    - q: هل هناك حد للكيلومترات؟
      a: >-
        لا. الكيلومترات داخل جورجيا غير محدودة في جميع الأسعار. أما في الرحلات عبر الحدود فيُطبَّق حد
        يومي قدره 300 كم.
    - q: ماذا يحدث في حالة وقوع حادث؟
      a: >-
        يغطي تأمين CDW المشمول في السعر الأضرار التي تتجاوز مبلغ التحمّل (300–1,200 لاري حسب الفئة). ويمكن
        إلغاء مبلغ التحمّل بالكامل مقابل 25–45 لاري إضافية في اليوم.
    - q: هل يمكنني إعادة السيارة في مدينة أخرى؟
      a: نعم. يبدأ الإيجار باتجاه واحد على مسارات تبليسي↔كوتايسي↔باتومي من 100 لاري؛ والمدن الأخرى بالاتفاق.
  - type: p
    text: مزيد من الأسئلة والأجوبة على [صفحة الأسئلة الشائعة](/faq/).
  - type: h2
    text: Drive On Manager — نظام إدارة الأسطول لدينا
  - type: p
    text: >-
      ندير أسطول Drive On عبر تطبيقنا الخاص Drive On Manager. والنظام نفسه متاح لشركات التأجير الأخرى: الحجوزات،
      وكشف التعارضات، والأرباح والخسائر اليومية، والعائد على الاستثمار ومدة الاسترداد لكل سيارة، والمصروفات
      والقروض والتأمين — كل ذلك في مكان واحد. التفاصيل على [صفحة Drive On Manager](/fleet-management-software/).
  - type: cta
    title: الحجز والاستشارة
    text: >-
      هذا الموقع للاطلاع فقط — لا نوفّر نظام دفع إلكتروني. لحجز سيارة اتصل بنا أو أرسل بريداً إلكترونياً؛
      وخلال ساعات العمل سيصلك ردّ في غضون 15 دقيقة.
    actions:
    - label: اتصل بنا
      href: /contact/
    - label: قائمة الأسعار
      href: /pricing/
    - label: شروط الإيجار
      href: /terms/
