ka:
  title: ავტოპარკი — რომელი მანქანები გვაქვს | Fleet House
  desc: >-
    120+ ავტომობილი 6 კატეგორიაში: ეკონომ კლასი, კროსოვერი, ბიზნეს კლასი, 4x4, მინივენი და ფურგონი. თითოეულის
    ტექნიკური მახასიათებლები, ადგილების რაოდენობა და დღიური ტარიფი.
  keywords: >-
    ავტოპარკი, გასაქირავებელი მანქანები, Toyota Prius ქირაობა, Land Cruiser Prado გაქირავება, მინივენის
    გაქირავება თბილისი
  h1: ავტოპარკი
  lead: >-
    ავტოპარკში 120-ზე მეტი ავტომობილია ექვს კატეგორიაში. საშუალო ასაკი — 4 წელი. ქვემოთ თითოეული კატეგორიის
    ტიპური მოდელები, მახასიათებლები და დღიური ტარიფი.
  blocks:
  - type: h2
    text: კატეგორიების შედარება
  - type: table
    rowhead: true
    caption: ავტოპარკის კატეგორიები — ძირითადი მახასიათებლები
    head:
    - კატეგორია
    - ადგილი
    - ჩემოდანი
    - ტრანსმისია
    - საწვავი / 100 კმ
    - ტარიფი
    rows:
    - cells:
      - ეკონომ კლასი
      - '5'
      - '2'
      - ავტომატი
      - 4.5–6.5 ლ
      - 75 ₾
    - cells:
      - კროსოვერი / SUV
      - '5'
      - 3–4
      - ავტომატი
      - 7.5–9.5 ლ
      - 130 ₾
    - cells:
      - ბიზნეს კლასი
      - '5'
      - '3'
      - ავტომატი
      - 7.0–9.0 ლ
      - 210 ₾
    - cells:
      - მაღალი გამავლობის 4x4
      - 5–7
      - '4'
      - ავტომატი / მექანიკა
      - 10–13 ლ
      - 240 ₾
    - cells:
      - მინივენი
      - 7–8
      - 4–6
      - ავტომატი
      - 8.5–11 ლ
      - 200 ₾
    - cells:
      - კომერციული ფურგონი
      - '3'
      - 9–12 მ³
      - მექანიკა
      - 9–12 ლ
      - 185 ₾
  - type: h2
    text: ეკონომ კლასი — 75 ₾-დან დღეში
  - type: p
    text: >-
      ყველაზე მოთხოვნადი კატეგორია. შესაფერისია ქალაქში გადაადგილებისთვის და ასფალტიან გზებზე მოგზაურობისთვის:
      თბილისი–კახეთი, თბილისი–ბათუმი, თბილისი–ბორჯომი. ჰიბრიდული მოდელები საწვავს მნიშვნელოვნად ზოგავს
      — თბილისი–ბათუმის მარშრუტი (370 კმ) დაახლოებით 55 ლარის საწვავად ჯდება.
  - type: cars
    category: economy
  - type: h2
    text: კროსოვერი და SUV — 130 ₾-დან დღეში
  - type: p
    text: >-
      ოპტიმალური არჩევანი საქართველოს რეგიონებში მოგზაურობისთვის. მაღალი კლირენსი საშუალებას იძლევა უსაფრთხოდ
      იაროთ ყაზბეგის, რაჭისა და კახეთის მთიან გზებზე. სვანეთისა და თუშეთისთვის გირჩევთ მაღალი გამავლობის
      4x4 კატეგორიას.
  - type: cars
    category: suv
  - type: h2
    text: ბიზნეს კლასი — 210 ₾-დან დღეში
  - type: p
    text: >-
      წარმომადგენლობითი ავტომობილები ბიზნეს ვიზიტებისთვის, კონფერენციებისა და ტრანსფერებისთვის. საჭიროების
      შემთხვევაში ხელმისაწვდომია მძღოლთან ერთად — დამატებით 120 ლარი დღეში (8 საათი).
  - type: cars
    category: business
  - type: h2
    text: მაღალი გამავლობის 4x4 — 240 ₾-დან დღეში
  - type: p
    text: >-
      ერთადერთი კატეგორია, რომლითაც ნებადართულია მოძრაობა სვანეთის (უშგული), თუშეთის (აბანო-ს უღელტეხილი),
      ხევსურეთისა და ტბეთის გრუნტოვან გზებზე. ავტომობილები აღჭურვილია ბლოკირებადი დიფერენციალით ან დაბალი
      გადაცემით.
  - type: cars
    category: offroad
  - type: h2
    text: მინივენი და მიკროავტობუსი — 200 ₾-დან დღეში
  - type: p
    text: >-
      ოჯახური მოგზაურობისა და მცირე ჯგუფებისთვის. 7–8 ადგილი, დიდი საბარგული, საბავშვო სავარძლების დაყენების
      შესაძლებლობა 3 ცალამდე.
  - type: cars
    category: minivan
  - type: h2
    text: კომერციული ფურგონი — 185 ₾-დან დღეში
  - type: p
    text: >-
      სამშენებლო, სავაჭრო და ლოგისტიკური კომპანიებისთვის. ხელმისაწვდომია თვიური და წლიური კორპორატიული
      ხელშეკრულებით, ბრენდირების უფლებით.
  - type: cars
    category: van
  - type: h2
    text: ავტოპარკის მომსახურება
  - type: ul
    items:
    - ტექმომსახურება ყოველ **8 000 კმ**-ზე ან 6 თვეში, რომელიც უფრო ადრე დადგება.
    - ზამთრის საბურავები **1 დეკემბრიდან 1 აპრილამდე** ყველა ავტომობილზე უფასოდ.
    - ყოველი გაქირავების წინ — სრული ვიზუალური შემოწმება და ფოტოფიქსაცია.
    - სალონის სველი წმენდა ყოველი კლიენტის შემდეგ.
    - საშუალო ასაკი პარკში — **4 წელი**; 8 წელზე ძველი ავტომობილი პარკიდან გადის.
  - type: note
    text: >-
      კონკრეტული მოდელის ხელმისაწვდომობა თარიღის მიხედვით იცვლება. ჯავშნისას ვადასტურებთ კატეგორიას; კონკრეტული
      მოდელი გარანტირებულია მხოლოდ წინასწარი შეთანხმებით.
  - type: cta
    title: გჭირდებათ კონკრეტული მოდელი?
    text: დაგვირეკეთ და შევამოწმებთ ხელმისაწვდომობას თქვენს თარიღებზე.
    actions:
    - label: კონტაქტი
      href: /contact/
    - label: ფასები
      href: /pricing/
en:
  title: Fleet — the cars we rent out | Fleet House
  desc: >-
    120+ vehicles in 6 categories: economy class, crossover, business class, 4x4, minivan and van. Technical
    specifications, seat count and daily rate for each.
  keywords: >-
    rental fleet Georgia, cars for rent Tbilisi, rent Toyota Prius, Land Cruiser Prado hire, minivan rental
    Tbilisi
  h1: Our fleet
  lead: >-
    The fleet holds more than 120 vehicles across six categories, with an average age of 4 years. Below
    are the typical models, specifications and daily rates for each category.
  blocks:
  - type: h2
    text: Category comparison
  - type: table
    rowhead: true
    caption: Fleet categories — key specifications
    head:
    - Category
    - Seats
    - Luggage
    - Transmission
    - Fuel / 100 km
    - Rate
    rows:
    - cells:
      - Economy class
      - '5'
      - '2'
      - Automatic
      - 4.5–6.5 l
      - 75 ₾
    - cells:
      - Crossover / SUV
      - '5'
      - 3–4
      - Automatic
      - 7.5–9.5 l
      - 130 ₾
    - cells:
      - Business class
      - '5'
      - '3'
      - Automatic
      - 7.0–9.0 l
      - 210 ₾
    - cells:
      - Off-road 4x4
      - 5–7
      - '4'
      - Automatic / manual
      - 10–13 l
      - 240 ₾
    - cells:
      - Minivan
      - 7–8
      - 4–6
      - Automatic
      - 8.5–11 l
      - 200 ₾
    - cells:
      - Commercial van
      - '3'
      - 9–12 m³
      - Manual
      - 9–12 l
      - 185 ₾
  - type: h2
    text: Economy class — from 75 ₾ per day
  - type: p
    text: >-
      Our most popular category. Ideal for getting around the city and for trips on paved roads: Tbilisi–Kakheti,
      Tbilisi–Batumi, Tbilisi–Borjomi. The hybrid models save a great deal of fuel — the Tbilisi–Batumi
      run (370 km) costs roughly 55 GEL in fuel.
  - type: cars
    category: economy
  - type: h2
    text: Crossovers and SUVs — from 130 ₾ per day
  - type: p
    text: >-
      The best choice for travelling through Georgia's regions. The higher ground clearance lets you take
      the mountain roads of Kazbegi, Racha and Kakheti safely. For Svaneti and Tusheti we recommend the
      off-road 4x4 category.
  - type: cars
    category: suv
  - type: h2
    text: Business class — from 210 ₾ per day
  - type: p
    text: >-
      Executive cars for business visits, conferences and transfers. Available with a driver if required
      — an extra 120 GEL per day (8 hours).
  - type: cars
    category: business
  - type: h2
    text: Off-road 4x4 — from 240 ₾ per day
  - type: p
    text: >-
      The only category cleared for the gravel roads of Svaneti (Ushguli), Tusheti (the Abano Pass), Khevsureti
      and Tbeti. These vehicles come with a locking differential or low-range gearing.
  - type: cars
    category: offroad
  - type: h2
    text: Minivans and minibuses — from 200 ₾ per day
  - type: p
    text: For family trips and small groups. Seven to eight seats, a large boot and room for up to three
      child seats.
  - type: cars
    category: minivan
  - type: h2
    text: Commercial vans — from 185 ₾ per day
  - type: p
    text: >-
      For construction, retail and logistics companies. Available on monthly and annual corporate contracts,
      with branding permitted.
  - type: cars
    category: van
  - type: h2
    text: How we maintain the fleet
  - type: ul
    items:
    - Servicing every **8,000 km** or every 6 months, whichever comes first.
    - Winter tyres from **1 December to 1 April** on every vehicle, at no charge.
    - A full visual inspection and photo record before every rental.
    - Wet cleaning of the interior after every customer.
    - Average fleet age — **4 years**; vehicles older than 8 years leave the fleet.
  - type: note
    text: >-
      Availability of a specific model varies by date. At the time of booking we confirm the category;
      a specific model is guaranteed only by prior arrangement.
  - type: cta
    title: Looking for a specific model?
    text: Call us and we will check availability for your dates.
    actions:
    - label: Contact
      href: /contact/
    - label: Prices
      href: /pricing/
ru:
