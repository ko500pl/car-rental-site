      - '5'
      - '2'
      - автомат
      - 4.5–6.5 л
      - 75 ₾
    - cells:
      - Кроссовер / SUV
      - '5'
      - 3–4
      - автомат
      - 7.5–9.5 л
      - 130 ₾
    - cells:
      - Бизнес-класс
      - '5'
      - '3'
      - автомат
      - 7.0–9.0 л
      - 210 ₾
    - cells:
      - Внедорожник 4x4
      - 5–7
      - '4'
      - автомат / механика
      - 10–13 л
      - 240 ₾
    - cells:
      - Минивэн
      - 7–8
      - 4–6
      - автомат
      - 8.5–11 л
      - 200 ₾
    - cells:
      - Коммерческий фургон
      - '3'
      - 9–12 м³
      - механика
      - 9–12 л
      - 185 ₾
  - type: h2
    text: Эконом-класс — от 75 ₾ в сутки
  - type: p
    text: >-
      Самая востребованная категория. Подходит для передвижения по городу и поездок по асфальтированным
      дорогам: Тбилиси–Кахетия, Тбилиси–Батуми, Тбилиси–Боржоми. Гибридные модели заметно экономят топливо
      — маршрут Тбилиси–Батуми (370 км) обходится примерно в 55 лари на бензин.
  - type: cars
    category: economy
  - type: h2
    text: Кроссоверы и SUV — от 130 ₾ в сутки
  - type: p
    text: >-
      Оптимальный выбор для поездок по регионам Грузии. Высокий клиренс позволяет безопасно ездить по
      горным дорогам Казбеги, Рачи и Кахетии. Для Сванетии и Тушетии рекомендуем категорию внедорожников
      4x4.
  - type: cars
    category: suv
  - type: h2
    text: Бизнес-класс — от 210 ₾ в сутки
  - type: p
    text: >-
      Представительские автомобили для деловых визитов, конференций и трансферов. При необходимости доступны
      с водителем — за доплату 120 лари в сутки (8 часов).
  - type: cars
    category: business
  - type: h2
    text: Внедорожники 4x4 — от 240 ₾ в сутки
  - type: p
    text: >-
      Единственная категория, на которой разрешено ездить по грунтовым дорогам Сванетии (Ушгули), Тушетии
      (перевал Абано), Хевсуретии и Тбети. Автомобили оснащены блокировкой дифференциала или пониженной
      передачей.
  - type: cars
    category: offroad
  - type: h2
    text: Минивэны и микроавтобусы — от 200 ₾ в сутки
  - type: p
    text: >-
      Для семейных поездок и небольших групп. 7–8 мест, вместительный багажник, возможность установить
      до 3 детских кресел.
  - type: cars
    category: minivan
  - type: h2
    text: Коммерческие фургоны — от 185 ₾ в сутки
  - type: p
    text: >-
      Для строительных, торговых и логистических компаний. Доступны по помесячному и годовому корпоративному
      договору, с правом брендирования.
  - type: cars
    category: van
  - type: h2
    text: Обслуживание автопарка
  - type: ul
    items:
    - Техобслуживание каждые **8 000 км** или раз в 6 месяцев — что наступит раньше.
    - Зимняя резина **с 1 декабря по 1 апреля** на всех автомобилях бесплатно.
    - Перед каждой арендой — полный визуальный осмотр и фотофиксация.
    - Влажная уборка салона после каждого клиента.
    - Средний возраст парка — **4 года**; машины старше 8 лет выводятся из парка.
  - type: note
    text: >-
      Доступность конкретной модели зависит от дат. При бронировании мы подтверждаем категорию; конкретная
      модель гарантируется только по предварительной договорённости.
  - type: cta
    title: Нужна конкретная модель?
    text: Позвоните нам, и мы проверим её доступность на ваши даты.
    actions:
    - label: Контакты
      href: /contact/
    - label: Цены
      href: /pricing/
