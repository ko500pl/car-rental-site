  - type: p
    text: >-
      داده‌ها روی خود دستگاه ذخیره می‌شوند — هیچ چیز به‌صورت خودکار به سروری بیرونی فرستاده نمی‌شود. نسخهٔ
      پشتیبان به شکل یک فایل JSON نوشته می‌شود و در صورت تمایل شما، به‌صورت خودکار روزانه، هفتگی یا ماهانه
