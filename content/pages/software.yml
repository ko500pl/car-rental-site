    - q: آیا شما به داده‌های من دسترسی پیدا می‌کنید؟
      a: >-
        خیر. پایگاه داده روی دستگاه شماست و نسخه‌های پشتیبان تنها به نشانی ایمیلی فرستاده می‌شود که خودتان
