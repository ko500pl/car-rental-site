    - شرکت‌های لیزینگ و اجارهٔ عملیاتی
  - type: h2
    text: پرسش‌های متداول دربارهٔ نرم‌افزار
  - type: faq
    items:
    - q: Fleet House Manager چقدر هزینه دارد؟
      a: >-
        نسخهٔ پایه رایگان است. قابلیت‌های پیشرفته (حالت چندکاربره، همگام‌سازی متمرکز، یکپارچه‌سازی‌ها)
        بر پایهٔ اندازهٔ ناوگان شما جداگانه قیمت‌گذاری می‌شود.
    - q: آیا بدون اتصال به اینترنت کار می‌کند؟
      a: >-
        بله. پایگاه داده محلی است، بنابراین اپلیکیشن به‌طور کامل آفلاین کار می‌کند. اینترنت تنها برای
        ایمیل کردن نسخهٔ پشتیبان لازم است.
    - q: آیا می‌توانم داده‌هایم را از Excel منتقل کنم؟
      a: >-
        بله. خودروها، مشتریان و سوابق اجارهٔ گذشته را می‌توان از یک فایل ساختاریافته وارد کرد. ما در این
        انتقال کمک می‌کنیم.
    - q: از چند کاربر پشتیبانی می‌کند؟
