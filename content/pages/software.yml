ka:
  title: Fleet House Manager — ავტოპარკის მართვის პროგრამა გაქირავების ბიზნესისთვის
  desc: >-
    Fleet House Manager — ავტოგაქირავების ბიზნესის მართვის აპლიკაცია: ჯავშნები, კონფლიქტების დეტექცია, დღიური P&L,
    ROI და უკუგების ვადა თითო ავტომობილზე. Android და iOS.
  keywords: >-
    ავტოპარკის მართვის პროგრამა, car rental software, fleet management georgia, გაქირავების აღრიცხვის
    სისტემა, rent a car crm
  h1: Fleet House Manager — ავტოპარკის მართვის სისტემა
  lead: >-
    Fleet House Manager არის აპლიკაცია, რომლითაც ჩვენ თვითონ ვმართავთ 17-ავტომობილიან პარკს. იგივე სისტემა ხელმისაწვდომია
    სხვა გაქირავების კომპანიებისთვის — მცირე, 5-მანქანიანი ბიზნესიდან რამდენიმე ასეულამდე.
  blocks:
  - type: h2
    text: რა პრობლემას წყვეტს
  - type: p
    text: >-
      გაქირავების მცირე და საშუალო ბიზნესი, როგორც წესი, Excel-ით და ტელეფონის ჩანაწერებით მუშაობს. შედეგად
      ჩნდება სამი ტიპური პრობლემა: ორმაგი ჯავშანი, დაუფიქსირებელი ხარჯი და უცოდინრობა იმისა, თუ რომელი
      ავტომობილი იხდის თავს და რომელი — არა. Fleet House Manager სამივეს ერთ ბაზაში კეტავს.
  - type: cards
    items:
    - tag: პრობლემა 1
      title: ორმაგი ჯავშანი
      text: >-
        სისტემა ავტომატურად ამოწმებს კონფლიქტს ჯავშნებს, აქტიურ გაქირავებებსა და ტექმომსახურების ფანჯრებს
        შორის — ჯავშნის შენახვამდე.
    - tag: პრობლემა 2
      title: დაკარგული ხარჯი
      text: >-
        ხარჯები კატეგორიებად აღირიცხება და ავტომობილს მიება. სესხი და სადაზღვევო პრემია პროგნოზირდება
        მომავალ დღეებზე ავტომატურად.
    - tag: პრობლემა 3
      title: უცნობი მომგებიანობა
      text: >-
        თითოეულ ავტომობილზე ცალკე ითვლება ROI, ROA, უკუგების ვადა და დატვირთვის კოეფიციენტი — ჩანს, რომელი
        მანქანა უნდა გაიყიდოს.
  - type: h2
    text: ძირითადი ფუნქციები
  - type: table
    rowhead: true
    head:
    - სფერო
    - რას აკეთებს
    rows:
    - cells:
      - ავტოპარკი
      - ავტომობილების ბაზა, ტექმომსახურების ფანჯრები, ფოტოები, დოკუმენტები
    - cells:
      - ჯავშნები
      - დაჯავშნა, გაუქმება, ჯავშნის გადაქცევა გაქირავებად, კონფლიქტების დეტექცია
    - cells:
      - გაქირავება
      - დაწყება, გაგრძელება, ვადამდე შეწყვეტა, რეაქტივაცია, ისტორიული ჩანაწერები
    - cells:
      - ფინანსები
      - დღიური P&L, შემოსავალი და ხარჯი პერიოდზე, წმინდა მოგება
    - cells:
      - ინვესტიცია
      - ROI, ROA, უკუგების ვადა, დატვირთვა თითო ავტომობილზე და პარკზე
    - cells:
      - კლიენტები
      - ბაზა, რეიტინგი, გაქირავებების ისტორია, სტატისტიკა
    - cells:
      - ხარჯები
      - კატეგორიები, სესხები, სადაზღვევო პოლისები, პროგნოზირება
    - cells:
      - ფოტოფიქსაცია
      - ავტომობილის, გაქირავებისა და ჯავშნის ფოტოები ერთ ბაზაში
    - cells:
      - ექსპორტი
      - Excel-ში გატანა, JSON სარეზერვო ასლი, ავტომატური ბექაფი ელფოსტაზე
  - type: h2
    text: როგორ ითვლება მომგებიანობა
  - type: p
    text: >-
      შემოსავალი აღიარდება გაქირავების პერიოდზე განაწილებით, არა გადახდის დღეს — ეს იძლევა რეალურ დღიურ
      P&L-ს. ჯარიმები შემოსავალში არ ითვლება. სესხისა და დაზღვევის ხარჯი პროგნოზირდება მხოლოდ მომავალ
      დღეებზე, რათა წარსული პერიოდის ფაქტობრივი ციფრები არ დამახინჯდეს.
  - type: ul
    items:
    - '**ROI** = (გაქირავების წმინდა შემოსავალი − ხარჯები) ÷ ავტომობილის შესყიდვის ღირებულება'
    - '**ROA** = ავტომობილის წმინდა შედეგი ÷ ავტომობილის მიმდინარე საბალანსო ღირებულება'
    - '**უკუგების ვადა** = შესყიდვის ღირებულება ÷ საშუალო თვიური წმინდა შედეგი'
    - '**დატვირთვა** = გაქირავებაში გატარებული დღეები ÷ კალენდარული დღეები პერიოდში'
  - type: h2
    text: ტექნიკური მონაცემები
  - type: facts
    items:
    - k: პლატფორმა
      v: Android 7.0+ / iOS 13+
    - k: ტექნოლოგია
      v: Flutter
    - k: მონაცემთა ბაზა
      v: SQLite (ლოკალური)
    - k: ინტერნეტი
      v: არ არის სავალდებულო
    - k: ინტერფეისის ენა
      v: ქართული, ინგლისური
    - k: მიმდინარე ვერსია
      v: '2.16'
  - type: p
    text: >-
      მონაცემები ინახება მოწყობილობაზე — გარე სერვერზე ავტომატურად არაფერი იგზავნება. სარეზერვო ასლი იქმნება
      JSON ფაილად და, სურვილისამებრ, ავტომატურად იგზავნება თქვენს ელფოსტაზე დღიური, კვირეული ან თვიური
      პერიოდულობით.
  - type: h2
    text: ვისთვის არის
  - type: ul
    items:
    - გაქირავების კომპანიები **5–300 ავტომობილით**
    - ავტოპარკის მფლობელები, რომლებიც ავტომობილებს პარტნიორ კომპანიებზე გასცემენ
    - ტურისტული ოპერატორები, რომლებსაც საკუთარი ტრანსპორტი აქვთ
    - ლიზინგისა და ოპერაციული გაქირავების კომპანიები
  - type: h2
    text: ხშირად დასმული კითხვები პროგრამაზე
  - type: faq
    items:
    - q: რა ღირს Fleet House Manager?
      a: >-
        საბაზისო ვერსია უფასოა. გაფართოებული ფუნქციები (მრავალმომხმარებლიანი რეჟიმი, ცენტრალიზებული სინქრონიზაცია,
        ინტეგრაციები) ინდივიდუალური შეთანხმებით ფასდება ავტოპარკის ზომის მიხედვით.
    - q: მუშაობს თუ არა ინტერნეტის გარეშე?
      a: >-
        დიახ. მონაცემთა ბაზა ლოკალურია, ამიტომ აპლიკაცია სრულად მუშაობს ოფლაინ რეჟიმში. ინტერნეტი საჭიროა
        მხოლოდ ელფოსტაზე სარეზერვო ასლის გასაგზავნად.
    - q: შესაძლებელია თუ არა მონაცემების გადმოტანა Excel-იდან?
      a: >-
        დიახ. ავტომობილების, კლიენტებისა და ისტორიული გაქირავებების იმპორტი შესაძლებელია სტრუქტურირებული
        ფაილიდან. მიგრაციაში ვეხმარებით.
    - q: რამდენ მომხმარებელს უჭერს მხარს?
      a: საბაზისო ვერსია ერთ მოწყობილობაზეა გათვლილი. მრავალმომხმარებლიანი რეჟიმი გაფართოებული ვერსიის
        ნაწილია.
    - q: ჩემი მონაცემები თქვენთან ხვდება?
      a: არა. ბაზა მოწყობილობაზეა და სარეზერვო ასლი მიდის მხოლოდ იმ ელფოსტაზე, რომელსაც თქვენ მიუთითებთ.
  - type: cta
    title: Fleet House Manager-ის დემონსტრაცია
    text: მოგვწერეთ ავტოპარკის ზომა და გამოგიგზავნით დემო ვერსიას და დანერგვის გეგმას.
    actions:
    - label: კონტაქტი
      href: /contact/
    - label: ჩვენ შესახებ
      href: /about/
en:
  title: Fleet House Manager — fleet management software for car rental businesses
  desc: >-
    Fleet House Manager is a car rental management app: bookings, conflict detection, daily P&L, per-vehicle ROI
    and payback period. Android and iOS, works offline.
  keywords: >-
    fleet management software, car rental software, fleet management georgia, rental accounting system,
    rent a car crm
  h1: Fleet House Manager — fleet management system
  lead: >-
    Fleet House Manager is the app we use ourselves to run a 17-vehicle fleet. The same system is available to
    other rental companies — from a small five-car operation up to a few hundred vehicles.
  blocks:
  - type: h2
    text: The problem it solves
  - type: p
    text: >-
      Small and mid-sized rental businesses usually run on Excel and notes on a phone. That produces three
      familiar problems: double bookings, unrecorded expenses, and no idea which vehicle is paying for
      itself and which is not. Fleet House Manager closes all three in a single database.
  - type: cards
    items:
    - tag: Problem 1
      title: Double bookings
      text: >-
        The system automatically checks for conflicts between bookings, active rentals and maintenance
        windows — before the booking is even saved.
    - tag: Problem 2
      title: Lost expenses
      text: >-
        Expenses are recorded by category and attached to a vehicle. Loan repayments and insurance premiums
        are projected forward automatically.
    - tag: Problem 3
      title: Unknown profitability
      text: >-
        ROI, ROA, payback period and utilisation rate are calculated separately for every vehicle — so
        you can see which car should be sold.
  - type: h2
    text: Core features
  - type: table
    rowhead: true
    head:
    - Area
    - What it does
    rows:
    - cells:
      - Fleet
      - Vehicle database, maintenance windows, photos, documents
    - cells:
      - Bookings
      - Booking, cancellation, converting a booking into a rental, conflict detection
    - cells:
      - Rentals
      - Start, extension, early termination, reactivation, historical records
    - cells:
      - Finance
      - Daily P&L, revenue and costs across the period, net profit
    - cells:
      - Investment
      - ROI, ROA, payback period and utilisation per vehicle and per fleet
    - cells:
      - Customers
      - Database, ratings, rental history, statistics
    - cells:
      - Expenses
      - Categories, loans, insurance policies, forecasting
    - cells:
      - Photo records
      - Vehicle, rental and booking photos in one database
    - cells:
      - Export
      - Excel export, JSON backup, automatic backup by email
  - type: h2
    text: How profitability is calculated
  - type: p
    text: >-
      Revenue is recognised across the rental period rather than on the day of payment — which gives you
      a realistic daily P&L. Fines are not counted as revenue. Loan and insurance costs are projected
      only into future days, so that actual figures for past periods are never distorted.
  - type: ul
    items:
    - '**ROI** = (net rental revenue − costs) ÷ vehicle purchase price'
    - '**ROA** = net result for the vehicle ÷ current book value of the vehicle'
    - '**Payback period** = purchase price ÷ average monthly net result'
    - '**Utilisation** = days spent on rent ÷ calendar days in the period'
  - type: h2
    text: Technical details
  - type: facts
    items:
    - k: Platform
      v: Android 7.0+ / iOS 13+
    - k: Technology
      v: Flutter
    - k: Database
      v: SQLite (local)
    - k: Internet
      v: Not required
    - k: Interface languages
      v: Georgian, English
    - k: Current version
      v: '2.16'
  - type: p
    text: >-
      Data is stored on the device — nothing is sent to an external server automatically. Backups are
      written as a JSON file and, if you wish, emailed to you automatically on a daily, weekly or monthly
      schedule.
  - type: h2
    text: Who it is for
  - type: ul
    items:
    - Rental companies with **5 to 300 vehicles**
    - Fleet owners who place their vehicles with partner companies
    - Tour operators running their own vehicles
    - Leasing and operating-rental companies
  - type: h2
    text: Frequently asked questions about the software
  - type: faq
    items:
    - q: How much does Fleet House Manager cost?
      a: >-
        The basic version is free. Advanced features (multi-user mode, centralised synchronisation, integrations)
        are priced individually according to the size of your fleet.
    - q: Does it work without an internet connection?
      a: >-
        Yes. The database is local, so the app works fully offline. An internet connection is needed only
        to email a backup.
    - q: Can I migrate my data from Excel?
      a: >-
        Yes. Vehicles, customers and historical rentals can be imported from a structured file. We help
        with the migration.
    - q: How many users does it support?
      a: The basic version is designed for a single device. Multi-user mode is part of the advanced version.
    - q: Do you get access to my data?
      a: No. The database sits on your device and backups go only to the email address you specify yourself.
  - type: cta
    title: See Fleet House Manager in action
    text: Tell us the size of your fleet and we will send you a demo version and a rollout plan.
    actions:
    - label: Contact
      href: /contact/
    - label: About us
      href: /about/
ru:
  title: Fleet House Manager — программа управления автопарком для прокатного бизнеса
  desc: >-
    Fleet House Manager — приложение для управления прокатом авто: бронирования, выявление конфликтов, ежедневный
    P&L, ROI и срок окупаемости по каждой машине.
  keywords: >-
    программа управления автопарком, car rental software, fleet management georgia, система учёта проката,
    rent a car crm
  h1: Fleet House Manager — система управления автопарком
  lead: >-
    Fleet House Manager — приложение, с помощью которого мы сами управляем парком из 17 автомобилей. Эта же система
    доступна другим прокатным компаниям — от маленького бизнеса на 5 машин до парков в несколько сотен.
  blocks:
  - type: h2
    text: Какую проблему решает
  - type: p
    text: >-
      Малый и средний прокатный бизнес, как правило, работает в Excel и в заметках на телефоне. В результате
      возникают три типовые проблемы: двойная бронь, незафиксированные расходы и непонимание того, какая
      машина себя окупает, а какая — нет. Fleet House Manager закрывает все три в одной базе.
  - type: cards
    items:
    - tag: Проблема 1
      title: Двойная бронь
      text: >-
        Система автоматически проверяет конфликты между бронями, активными арендами и окнами техобслуживания
        — ещё до сохранения брони.
    - tag: Проблема 2
      title: Потерянные расходы
      text: >-
        Расходы учитываются по категориям и привязываются к машине. Кредиты и страховые премии прогнозируются
        на будущие дни автоматически.
    - tag: Проблема 3
      title: Неизвестная доходность
      text: >-
        По каждой машине отдельно считаются ROI, ROA, срок окупаемости и коэффициент загрузки — видно,
        какой автомобиль пора продать.
  - type: h2
    text: Основные функции
  - type: table
    rowhead: true
    head:
    - Область
    - Что делает
    rows:
    - cells:
      - Автопарк
      - База автомобилей, окна техобслуживания, фотографии, документы
    - cells:
      - Бронирования
      - Бронь, отмена, превращение брони в аренду, выявление конфликтов
    - cells:
      - Аренда
      - Старт, продление, досрочное завершение, реактивация, исторические записи
    - cells:
      - Финансы
      - Ежедневный P&L, доходы и расходы по периоду, чистая прибыль
    - cells:
      - Инвестиции
      - ROI, ROA, срок окупаемости, загрузка по машине и по парку
    - cells:
      - Клиенты
      - База, рейтинг, история аренд, статистика
    - cells:
      - Расходы
      - Категории, кредиты, страховые полисы, прогнозирование
    - cells:
      - Фотофиксация
      - Фотографии автомобиля, аренды и брони в одной базе
    - cells:
      - Экспорт
      - Выгрузка в Excel, резервная копия JSON, автоматический бэкап на почту
  - type: h2
    text: Как считается доходность
  - type: p
    text: >-
      Выручка признаётся с распределением по периоду аренды, а не в день оплаты — это даёт реальный ежедневный
      P&L. Штрафы в выручку не включаются. Расходы по кредитам и страховкам прогнозируются только на будущие
      дни, чтобы не искажать фактические цифры прошлых периодов.
  - type: ul
    items:
    - '**ROI** = (чистый доход от аренды − расходы) ÷ стоимость покупки автомобиля'
    - '**ROA** = чистый результат по автомобилю ÷ текущая балансовая стоимость автомобиля'
    - '**Срок окупаемости** = стоимость покупки ÷ средний месячный чистый результат'
    - '**Загрузка** = дни в аренде ÷ календарные дни периода'
  - type: h2
    text: Технические данные
  - type: facts
    items:
    - k: Платформа
      v: Android 7.0+ / iOS 13+
    - k: Технология
      v: Flutter
    - k: База данных
      v: SQLite (локальная)
    - k: Интернет
      v: не обязателен
    - k: Язык интерфейса
      v: грузинский, английский
    - k: Текущая версия
      v: '2.16'
  - type: p
    text: >-
      Данные хранятся на устройстве — автоматически ничего не отправляется на внешний сервер. Резервная
      копия создаётся в виде JSON-файла и, по желанию, автоматически отправляется на вашу электронную
      почту с ежедневной, еженедельной или ежемесячной периодичностью.
  - type: h2
    text: Для кого
  - type: ul
    items:
    - Прокатные компании с **5–300 автомобилями**
    - Владельцы автопарков, передающие машины партнёрским компаниям
    - Туроператоры с собственным транспортом
    - Лизинговые компании и компании операционной аренды
  - type: h2
    text: Частые вопросы о программе
  - type: faq
    items:
    - q: Сколько стоит Fleet House Manager?
      a: >-
        Базовая версия бесплатна. Расширенные функции (многопользовательский режим, централизованная синхронизация,
        интеграции) оцениваются индивидуально в зависимости от размера автопарка.
    - q: Работает ли программа без интернета?
      a: >-
        Да. База данных локальная, поэтому приложение полностью работает в офлайн-режиме. Интернет нужен
        только для отправки резервной копии на электронную почту.
    - q: Можно ли перенести данные из Excel?
      a: >-
        Да. Импорт автомобилей, клиентов и исторических аренд возможен из структурированного файла. С
        миграцией мы помогаем.
    - q: Сколько пользователей поддерживается?
      a: Базовая версия рассчитана на одно устройство. Многопользовательский режим входит в расширенную
        версию.
    - q: Попадают ли мои данные к вам?
      a: Нет. База находится на устройстве, а резервная копия уходит только на ту почту, которую укажете
        вы.
  - type: cta
    title: Демонстрация Fleet House Manager
    text: Напишите нам размер автопарка, и мы пришлём демоверсию и план внедрения.
    actions:
    - label: Контакты
      href: /contact/
    - label: О нас
      href: /about/
fa:
  title: Fleet House Manager — نرم‌افزار مدیریت ناوگان برای شرکت‌های اجارهٔ خودرو
  desc: >-
    Fleet House Manager اپلیکیشن مدیریت اجارهٔ خودرو است: رزرو، تشخیص تداخل، P&L روزانه، ROI و دورهٔ بازگشت سرمایه
    برای هر خودرو. اندروید و iOS، بدون نیاز به اینترنت.
  keywords: >-
    نرم‌افزار مدیریت ناوگان, نرم‌افزار اجاره خودرو, مدیریت ناوگان در گرجستان, سامانه حسابداری اجاره خودرو,
    CRM اجاره خودرو
  h1: Fleet House Manager — سامانهٔ مدیریت ناوگان
  lead: >-
    Fleet House Manager همان اپلیکیشنی است که خودمان برای ادارهٔ ناوگانی 17 خودرویی به کار می‌بریم. همین سامانه
    در اختیار دیگر شرکت‌های اجاره نیز هست — از یک کسب‌وکار کوچک پنج‌خودرویی تا چند صد خودرو.
  blocks:
  - type: h2
    text: مسئله‌ای که حل می‌کند
  - type: p
    text: >-
      کسب‌وکارهای کوچک و متوسط اجارهٔ خودرو معمولاً با Excel و یادداشت روی گوشی کار می‌کنند. همین سه مشکل
      آشنا را می‌سازد: رزروهای دوگانه، هزینه‌های ثبت‌نشده، و بی‌خبری از اینکه کدام خودرو خرج خود را درمی‌آورد
      و کدام نه. Fleet House Manager هر سه را در یک پایگاه دادهٔ واحد می‌بندد.
  - type: cards
    items:
    - tag: مسئلهٔ 1
      title: رزروهای دوگانه
      text: >-
        سامانه به‌صورت خودکار تداخل میان رزروها، اجاره‌های فعال و بازه‌های تعمیر و نگهداری را بررسی می‌کند
        — پیش از آنکه رزرو اصلاً ذخیره شود.
    - tag: مسئلهٔ 2
      title: هزینه‌های گم‌شده
      text: >-
        هزینه‌ها بر پایهٔ دسته ثبت و به یک خودرو پیوست می‌شوند. اقساط وام و حق بیمه به‌صورت خودکار برای
        آینده پیش‌بینی می‌شوند.
    - tag: مسئلهٔ 3
      title: سودآوری نامعلوم
      text: >-
        ROI، ROA، دورهٔ بازگشت سرمایه و ضریب بهره‌برداری برای هر خودرو جداگانه محاسبه می‌شود — تا ببینید
        کدام خودرو را باید فروخت.
  - type: h2
    text: قابلیت‌های اصلی
  - type: table
    rowhead: true
    head:
    - حوزه
    - کارکرد
    rows:
    - cells:
      - ناوگان
