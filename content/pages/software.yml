    - cells:
      - مشتریان
      - پایگاه داده، امتیازدهی، تاریخچهٔ اجاره، آمار
    - cells:
      - هزینه‌ها
      - دسته‌بندی‌ها، وام‌ها، بیمه‌نامه‌ها، پیش‌بینی
    - cells:
      - مستندات عکسی
      - عکس‌های خودرو، اجاره و رزرو در یک پایگاه داده
    - cells:
      - خروجی
      - خروجی Excel، پشتیبان JSON، پشتیبان‌گیری خودکار از راه ایمیل
  - type: h2
    text: سودآوری چگونه محاسبه می‌شود
  - type: p
    text: >-
      درآمد در سراسر دورهٔ اجاره شناسایی می‌شود، نه در روز پرداخت — و همین یک P&L روزانهٔ واقع‌بینانه
      به شما می‌دهد. جریمه‌ها درآمد به شمار نمی‌روند. هزینه‌های وام و بیمه تنها به روزهای آینده تسری می‌یابند،
