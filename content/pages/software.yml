    text: למי היא מיועדת
  - type: ul
    items:
    - חברות השכרה עם **5 עד 300 רכבים**
    - בעלי רכבים שמפקידים את רכביהם אצל חברות שותפות
    - מפעילי תיירות המפעילים רכבים משלהם
    - חברות ליסינג והשכרה תפעולית
  - type: h2
    text: שאלות נפוצות על התוכנה
  - type: faq
    items:
    - q: כמה עולה Fleet House Manager?
      a: הגרסה הבסיסית חינם. יכולות מתקדמות (מצב רב-משתמשים, סנכרון מרכזי, אינטגרציות) מתומחרות בנפרד
        לפי גודל הצי.
    - q: האם היא עובדת בלי חיבור לאינטרנט?
      a: כן. מסד הנתונים מקומי, ולכן האפליקציה עובדת במלואה גם ללא חיבור. אינטרנט נדרש רק לשליחת גיבוי
        בדוא"ל.
    - q: אפשר להעביר נתונים מ-Excel?
      a: כן. רכבים, לקוחות והשכרות היסטוריות ניתנים לייבוא מקובץ מובנה. אנחנו מסייעים בהעברה.
    - q: בכמה משתמשים היא תומכת?
      a: הגרסה הבסיסית מיועדת למכשיר יחיד. מצב רב-משתמשים כלול בגרסה המתקדמת.
    - q: האם אתם מקבלים גישה לנתונים שלי?
      a: לא. מסד הנתונים יושב במכשיר שלכם, והגיבויים נשלחים רק לכתובת הדוא"ל שאתם מגדירים בעצמכם.
  - type: cta
    title: לראות את Fleet House Manager בפעולה
    text: ספרו לנו על גודל הצי שלכם ונשלח לכם גרסת דמו ותוכנית הטמעה.
    actions:
    - label: צור קשר
      href: /contact/
    - label: עלינו
      href: /about/
ar:
  title: Fleet House Manager — برنامج إدارة الأساطيل لشركات تأجير السيارات
  desc: >-
    Fleet House Manager تطبيق لإدارة تأجير السيارات: الحجوزات، كشف التعارضات، P&L اليومي، وROI ومدة الاسترداد لكل
    سيارة. يعمل على أندرويد وiOS ومن دون إنترنت.
  keywords: >-
    برنامج إدارة الأساطيل, برنامج تأجير السيارات, إدارة الأساطيل في جورجيا, نظام محاسبة تأجير السيارات,
    CRM تأجير السيارات
  h1: Fleet House Manager — نظام إدارة الأسطول
  lead: >-
    Fleet House Manager هو التطبيق الذي نستخدمه بأنفسنا لإدارة أسطول من 17 سيارة. والنظام نفسه متاح لشركات التأجير
    الأخرى — من نشاط صغير بخمس سيارات وحتى بضع مئات من السيارات.
  blocks:
  - type: h2
    text: المشكلة التي يحلّها
  - type: p
    text: >-
      تعتمد شركات التأجير الصغيرة والمتوسطة عادةً على Excel وعلى ملاحظات في الهاتف. وينتج عن ذلك ثلاث
      مشكلات مألوفة: الحجوزات المزدوجة، والمصاريف غير المسجَّلة، وعدم معرفة أي سيارة تغطّي تكلفتها وأيها
      لا. ويعالج Fleet House Manager هذه المشكلات الثلاث في قاعدة بيانات واحدة.
  - type: cards
    items:
    - tag: المشكلة 1
      title: الحجوزات المزدوجة
      text: يفحص النظام تلقائياً التعارضات بين الحجوزات وعقود الإيجار السارية وفترات الصيانة — قبل حفظ
        الحجز أصلاً.
    - tag: المشكلة 2
      title: المصاريف الضائعة
      text: >-
        تُسجَّل المصاريف بحسب الفئة وتُربط بسيارة بعينها. وتُحتسب أقساط القروض وأقساط التأمين للفترات
        المقبلة تلقائياً.
    - tag: المشكلة 3
      title: ربحية مجهولة
      text: تُحتسب ROI وROA ومدة الاسترداد ومعدّل الاستخدام لكل سيارة على حدة — لتعرف أي سيارة ينبغي بيعها.
  - type: h2
    text: الوظائف الأساسية
  - type: table
    rowhead: true
    head:
    - المجال
    - الوظيفة
    rows:
    - cells:
      - الأسطول
      - قاعدة بيانات السيارات، فترات الصيانة، الصور، المستندات
    - cells:
      - الحجوزات
      - الحجز، الإلغاء، تحويل الحجز إلى عقد إيجار، كشف التعارضات
    - cells:
      - عقود الإيجار
      - البدء، التمديد، الإنهاء المبكر، إعادة التفعيل، السجلات السابقة
    - cells:
      - المالية
      - P&L يومي، الإيرادات والتكاليف خلال الفترة، صافي الربح
    - cells:
      - الاستثمار
      - ROI وROA ومدة الاسترداد ومعدّل الاستخدام لكل سيارة وللأسطول كاملاً
    - cells:
      - العملاء
      - قاعدة البيانات، التقييمات، سجل الإيجارات، الإحصاءات
    - cells:
      - المصاريف
      - الفئات، القروض، وثائق التأمين، التوقّعات
    - cells:
      - التوثيق بالصور
      - صور السيارات وعقود الإيجار والحجوزات في قاعدة بيانات واحدة
    - cells:
      - التصدير
      - التصدير إلى Excel، نسخة احتياطية بصيغة JSON، نسخ احتياطي تلقائي عبر البريد الإلكتروني
  - type: h2
    text: كيف تُحتسب الربحية
  - type: p
    text: >-
      يُعترف بالإيراد على امتداد مدة الإيجار لا في يوم الدفع — وهو ما يمنحك P&L يومياً واقعياً. ولا تُحتسب
      الغرامات ضمن الإيرادات. أما تكاليف القروض والتأمين فتُوزَّع على الأيام المقبلة فقط، حتى لا تتشوّه
      الأرقام الفعلية للفترات السابقة.
  - type: ul
    items:
    - '**ROI** = (صافي إيراد الإيجار − التكاليف) ÷ سعر شراء السيارة'
    - '**ROA** = صافي نتيجة السيارة ÷ القيمة الدفترية الحالية للسيارة'
    - '**مدة الاسترداد** = سعر الشراء ÷ متوسط صافي النتيجة الشهرية'
    - '**معدّل الاستخدام** = أيام التأجير ÷ الأيام التقويمية في الفترة'
  - type: h2
    text: التفاصيل التقنية
  - type: facts
    items:
    - k: المنصة
      v: Android 7.0+ / iOS 13+
    - k: التقنية
      v: Flutter
    - k: قاعدة البيانات
      v: SQLite (محلية)
    - k: الإنترنت
      v: غير مطلوب
    - k: لغات الواجهة
      v: الجورجية، الإنجليزية
    - k: الإصدار الحالي
      v: '2.16'
  - type: p
    text: >-
      تُخزَّن البيانات على الجهاز — ولا يُرسَل أي شيء تلقائياً إلى خادم خارجي. وتُكتب النسخ الاحتياطية
      في ملف JSON، وتُرسَل إليك بالبريد الإلكتروني تلقائياً — إن رغبت — يومياً أو أسبوعياً أو شهرياً.
  - type: h2
    text: لمن هذا النظام
  - type: ul
    items:
    - شركات التأجير التي تملك **من 5 إلى 300 سيارة**
    - مالكو السيارات الذين يضعون سياراتهم لدى شركات شريكة
    - منظّمو الرحلات السياحية الذين يشغّلون سياراتهم الخاصة
    - شركات التأجير التمويلي والتأجير التشغيلي
  - type: h2
    text: أسئلة شائعة عن البرنامج
  - type: faq
    items:
    - q: كم يكلّف Fleet House Manager؟
      a: >-
        الإصدار الأساسي مجاني. أما الميزات المتقدّمة (وضع تعدّد المستخدمين، المزامنة المركزية، عمليات
        الربط) فتُسعَّر بشكل فردي بحسب حجم أسطولك.
    - q: هل يعمل من دون اتصال بالإنترنت؟
      a: >-
        نعم. قاعدة البيانات محلية، لذا يعمل التطبيق بكامل وظائفه دون اتصال. ولا يلزم الإنترنت إلا لإرسال
        نسخة احتياطية بالبريد الإلكتروني.
    - q: هل يمكنني نقل بياناتي من Excel؟
      a: نعم. يمكن استيراد السيارات والعملاء وعقود الإيجار السابقة من ملف منظَّم. ونحن نساعدك في عملية
        النقل.
    - q: كم عدد المستخدمين الذي يدعمه؟
      a: الإصدار الأساسي مصمَّم لجهاز واحد. أما وضع تعدّد المستخدمين فهو جزء من الإصدار المتقدّم.
    - q: هل تطّلعون على بياناتي؟
      a: >-
        لا. قاعدة البيانات موجودة على جهازك، والنسخ الاحتياطية تُرسَل فقط إلى عنوان البريد الإلكتروني
        الذي تحدّده بنفسك.
  - type: cta
    title: شاهد Fleet House Manager أثناء العمل
    text: أخبرنا بحجم أسطولك وسنرسل إليك نسخة تجريبية وخطة تطبيق.
    actions:
    - label: اتصل بنا
      href: /contact/
    - label: من نحن
      href: /about/

