en:
  title: Rental terms — documents, age, deposit | Fleet House
  desc: >-
    The full car rental terms: required documents, minimum age, driving experience, deposit, fuel policy,
    insurance, cross-border travel and cancellation rules.
  keywords: car rental terms Georgia, documents needed to rent a car, minimum age rent a car, rental deposit
  h1: Rental terms
  lead: >-
    Below are the full terms, which form an integral part of the rental agreement. The agreement is drawn
    up in Georgian, English or Russian.
  blocks:
  - type: h2
    text: Required documents
  - type: table
    rowhead: true
    caption: Requirements by nationality
    head:
    - Category
    - Identity
    - Driving licence
    - Additional
    rows:
    - cells:
      - Georgian citizen
      - ID card
      - National, held 2+ years
      - Card for the deposit
    - cells:
      - Foreign national (Latin alphabet)
      - Passport
      - National licence
      - Card for the deposit
    - cells:
      - Foreign national (non-Latin)
      - Passport
      - National + IDP
      - Card for the deposit
    - cells:
      - Company
      - Extract from the register
      - Driver's licence
      - Power of attorney, company stamp
  - type: note
    text: >-
      An **IDP** (International Driving Permit) is required if your national licence is not issued in
      the Latin alphabet — for example an Arabic, Chinese, Japanese or Georgian licence used abroad. Licences
      from the EU, the USA, the United Kingdom and CIS countries are valid in Georgia as they are.
  - type: h2
    text: Age and driving experience
  - type: table
    rowhead: true
    head:
    - Category
    - Minimum age
    - Minimum experience
    - Young driver surcharge
    rows:
    - cells:
      - Economy class
      - 21 years
      - 2 years
      - —
    - cells:
      - Crossover / SUV
      - 23 years
      - 3 years
      - 15 ₾ / day (ages 23–25)
    - cells:
      - Business class
      - 25 years
      - 5 years
      - 25 ₾ / day (ages 25–27)
    - cells:
      - Off-road 4x4
      - 25 years
      - 4 years
      - 25 ₾ / day (ages 25–27)
    - cells:
      - Minivan
      - 23 years
      - 3 years
      - 15 ₾ / day (ages 23–25)
    - cells:
      - Commercial van
      - 25 years
      - 3 years
      - —
  - type: p
    text: There is no upper age limit.
  - type: h2
    text: Fuel policy
  - type: ul
    items:
    - >-
      We apply the **"full to full"** principle: the car is handed over with a full tank and must be returned
      with a full tank.
    - If the tank is not full, we charge the cost of the fuel plus a **20 ₾ service fee**.
    - >-
      Misfuelling (diesel in a petrol car or vice versa) is **not covered** by the insurance — the renter
      bears the cost.
    - Hybrid vehicles run on petrol alone; they do not need to be plugged in.
  - type: h2
    text: Insurance and liability
  - type: p
    text: >-
      The price includes **CDW** (Collision Damage Waiver) and **TPL** (third-party liability). CDW caps
      the renter's liability at the excess amount — see the [pricing page](/pricing/). Adding **SCDW**
      reduces the excess to zero.
  - type: h3
    text: The insurance does not cover
  - type: ul
    items:
    - Driving under the influence of alcohol, narcotics or psychotropic substances
    - Driving by a person not named as a driver in the rental agreement
    - Damage sustained on gravel or unpaved roads unless the vehicle is in the 4x4 category
    - Damage to tyres, wheels, the underbody and the interior
    - Loss of the keys (400–1,200 ₾ depending on the model)
    - Use of the vehicle as a taxi, for haulage or for any other commercial purpose without prior written
      consent
  - type: h2
    text: Cross-border travel
  - type: table
    rowhead: true
    head:
    - Country
    - Status
    - Cost
    - Daily limit
    rows:
    - cells:
      - Armenia
      - Permitted
      - 150 ₾
      - 300 km
    - cells:
      - Turkey
      - Permitted (selected categories)
      - 250 ₾
      - 300 km
    - cells:
      - Azerbaijan
      - Prohibited
      - —
      - —
    - cells:
      - Russia
      - Prohibited
      - —
      - —
  - type: p
    text: >-
      Cross-border permission must be arranged **at least 48 hours in advance** — an international insurance
      policy and a power of attorney have to be prepared. Crossing the border without permission is a
      breach of the agreement and results in forfeiture of the entire deposit.
  - type: h2
    text: Booking, cancellation and changes
  - type: ul
    items:
    - Booking requests are confirmed after availability is checked and the required payment is completed.
    - '**Cancellation more than 48 hours ahead** — free of charge.'
    - '**Cancellation 24–48 hours ahead** — one day''s rate is charged.'
    - '**Cancellation less than 24 hours ahead, or a no-show** — two days'' rate is charged.'
    - Changing the dates is free if the car is available on the new dates.
