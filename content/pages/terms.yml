    - ავტომობილის გამოყენება მხოლოდ ხელშეკრულებით განსაზღვრული მიზნით.
    - საგზაო მოძრაობის წესების დაცვა; ყველა ჯარიმა მოქირავნის ხარჯია.
    - ავარიის შემთხვევაში დაუყოვნებლივ 112-ზე და ჩვენს ცხელ ხაზზე დარეკვა; ადგილიდან გაუსვლელობა ოქმის
      შედგენამდე.
    - ავტომობილის დატოვება ჩაკეტილ მდგომარეობაში; დოკუმენტების სალონში დატოვების აკრძალვა.
    - ტექნიკური ხარვეზის აღმოჩენისას მოძრაობის შეწყვეტა და ჩვენთან დაკავშირება.
    - ავტომობილის ჩაბარება იმავე მდგომარეობაში, ბუნებრივი ცვეთის გათვალისწინებით.
  - type: h2
    text: ჯარიმები და დამატებითი გადასახდელები
  - type: table
    rowhead: true
    head:
    - დარღვევა
    - საფასური
    rows:
    - cells:
      - სალონში მოწევა
      - 150 ₾
    - cells:
      - ცხოველის გადაყვანა სპეციალური ბოქსის გარეშე
