ka:
  title: გაქირავების პირობები — საბუთები, ასაკი, დეპოზიტი | Fleet House
  desc: >-
    ავტომობილის გაქირავების სრული პირობები: საჭირო საბუთები, მინიმალური ასაკი, მართვის სტაჟი, დეპოზიტი,
    საწვავის პოლიტიკა, დაზღვევა, საზღვრის კვეთა და გაუქმების წესები.
  keywords: გაქირავების პირობები, საჭირო საბუთები მანქანის ქირაობისთვის, მინიმალური ასაკი rent a car,
    დეპოზიტი
  h1: გაქირავების პირობები
  lead: >-
    ქვემოთ მოცემულია სრული პირობები, რომლებიც ხელშეკრულების განუყოფელი ნაწილია. ხელშეკრულება ფორმდება
    ქართულ, ინგლისურ ან რუსულ ენაზე.
  blocks:
  - type: h2
    text: საჭირო საბუთები
  - type: table
    rowhead: true
    caption: მოთხოვნები მოქალაქეობის მიხედვით
    head:
    - კატეგორია
    - პირადობა
    - მართვის მოწმობა
    - დამატებით
    rows:
    - cells:
      - საქართველოს მოქალაქე
      - ID ბარათი
      - ეროვნული, 2+ წლის სტაჟით
      - ბარათი დეპოზიტისთვის
    - cells:
      - უცხოელი (ლათინური ანბანი)
      - პასპორტი
      - ეროვნული მოწმობა
      - ბარათი დეპოზიტისთვის
    - cells:
      - უცხოელი (არალათინური)
      - პასპორტი
      - ეროვნული + IDP
      - ბარათი დეპოზიტისთვის
    - cells:
      - იურიდიული პირი
      - ამონაწერი რეესტრიდან
      - მძღოლის მოწმობა
      - მინდობილობა, ბეჭედი
  - type: note
    text: >-
      **IDP** (International Driving Permit) საჭიროა, თუ ეროვნული მართვის მოწმობა არ არის შედგენილი ლათინური
      ანბანით — მაგალითად, არაბული, ჩინური, იაპონური ან ქართული მოწმობა უცხოეთში. საქართველოში ევროკავშირის,
      აშშ-ის, დიდი ბრიტანეთისა და დსთ-ს ქვეყნების მოწმობები პირდაპირ მოქმედებს.
  - type: h2
    text: ასაკი და მართვის სტაჟი
  - type: table
    rowhead: true
    head:
    - კატეგორია
