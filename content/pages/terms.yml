  - type: ul
    items:
    - 'نطبّق مبدأ **«ممتلئ إلى ممتلئ»**: تُسلَّم السيارة بخزان ممتلئ ويجب إعادتها بخزان ممتلئ.'
    - إذا لم يكن الخزان ممتلئاً، نحتسب تكلفة الوقود إضافةً إلى **رسم خدمة قدره 20 ₾**.
    - التزوّد بالوقود الخاطئ (ديزل في سيارة بنزين أو العكس) **غير مشمول** بالتأمين — ويتحمّل المستأجر
      التكلفة.
    - تعمل السيارات الهجينة بالبنزين وحده، ولا تحتاج إلى توصيلها بالشحن.
  - type: h2
    text: التأمين والمسؤولية
  - type: p
    text: >-
      يشمل السعر **CDW** (الإعفاء من أضرار الاصطدام) و**TPL** (المسؤولية تجاه الغير). ويحدّ تأمين CDW
      من مسؤولية المستأجر عند مبلغ التحمّل — راجع [صفحة الأسعار](/pricing/). وإضافة **SCDW** تخفّض مبلغ
      التحمّل إلى الصفر.
