      - 200 ₾
  - type: note
    text: >-
      ეს გვერდი ინფორმაციული ხასიათისაა და არ წარმოადგენს საჯარო ოფერტს. იურიდიული ძალა აქვს მხოლოდ ხელმოწერილ
      ხელშეკრულებას. პირობები შეიძლება შეიცვალოს — ბოლო რედაქცია მითითებულია გვერდის ბოლოს.
