      - 25 წელი
      - 3 წელი
      - —
  - type: p
    text: მაქსიმალური ასაკი შეზღუდული არ არის.
  - type: h2
    text: საწვავის პოლიტიკა
  - type: ul
    items:
    - >-
      მოქმედებს პრინციპი **„სავსე → სავსე“**: ავტომობილი გადმოგეცემათ სავსე ავზით და ჩაბარებისას ავზი
      სავსე უნდა იყოს.
    - თუ ავზი არასრულია, ერიცხება საწვავის ღირებულება + **20 ₾ მომსახურების საფასური**.
    - >-
      არასწორი საწვავის ჩასხმა (დიზელი ბენზინის ავტომობილში ან პირიქით) დაზღვევით **არ იფარება** — ხარჯს
      ანაზღაურებს მოქირავნე.
    - ჰიბრიდულ ავტომობილებს სჭირდება მხოლოდ ბენზინი; დამატებითი დატენვა საჭირო არ არის.
  - type: h2
    text: დაზღვევა და პასუხისმგებლობა
  - type: p
    text: >-
      ფასში შედის **CDW** (Collision Damage Waiver) და **TPL** (მესამე პირის წინაშე პასუხისმგებლობა).
      CDW ზღუდავს მოქირავნის პასუხისმგებლობას ფრანშიზის ოდენობით — იხილეთ [ფასების გვერდი](/pricing/).
      დამატებითი **SCDW**-ით ფრანშიზა ნულდება.
  - type: h3
    text: დაზღვევა არ ფარავს
  - type: ul
    items:
    - ალკოჰოლის, ნარკოტიკული ან ფსიქოტროპული ნივთიერების ზემოქმედების ქვეშ მართვას
    - მართვას პირის მიერ, რომელიც ხელშეკრულებაში მძღოლად არ არის მითითებული
    - დაზიანებას გრუნტოვან ან უასფალტო გზაზე, თუ ავტომობილი 4x4 კატეგორიის არ არის
    - საბურავების, დისკების, ქვედა ნაწილისა და სალონის დაზიანებას
    - გასაღების დაკარგვას (ღირებულება 400–1200 ₾ მოდელის მიხედვით)
    - ავტომობილის გამოყენებას ტაქსად, გადაზიდვისთვის ან სხვა კომერციული მიზნით წინასწარი წერილობითი თანხმობის
      გარეშე
