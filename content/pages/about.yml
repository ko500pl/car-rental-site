ka:
  title: ჩვენ შესახებ — Drive On, ავტოგაქირავება საქართველოში 2019 წლიდან
  desc: >-
    კომპანიის ისტორია, ავტოპარკის სტრუქტურა, სამუშაო პრინციპები და საკუთარი ავტოპარკის მართვის სისტემა.
    17 ავტომობილი, 6 ლოკაცია.
  keywords: ავტოგაქირავების კომპანია საქართველოში, rent a car company georgia
  h1: ჩვენ შესახებ
  lead: >-
    Drive On ავტომობილებს 2019 წლიდან აქირავებს. დავიწყეთ 8 მანქანით თბილისში — დღეს ავტოპარკში 17
    ავტომობილია და ვმუშაობთ ექვს ლოკაციაზე.
  blocks:
  - type: h2
    text: რიცხვები
  - type: facts
    items:
    - k: დაარსების წელი
      v: '2019'
    - k: ავტომობილი პარკში
      v: '17'
    - k: ლოკაცია
      v: '6'
    - k: გაქირავება წელიწადში
      v: 4 800+
    - k: საშუალო ავტოპარკის ასაკი
      v: 4 წელი
    - k: თანამშრომელი
      v: '34'
  - type: h2
    text: როგორ ვმუშაობთ
  - type: p
    text: >-
      ჩვენი მოდელი მარტივია: ავტოპარკი ჩვენს საკუთრებაშია, ტექმომსახურებას ვახორციელებთ საკუთარ სერვის-ცენტრში
      და ავტომობილს პარკიდან ვხსნით, სანამ ის სარემონტო ხარჯების მიხედვით წამგებიანი გახდება. ეს გვაძლევს
      ორ უპირატესობას: პროგნოზირებად ფასს კლიენტისთვის და პროგნოზირებად მარჟას ჩვენთვის.
  - type: ul
    items:
    - '**ავტოპარკის განახლება** — ავტომობილი პარკიდან გადის 8 წელს ან 200 000 კმ-ს მიღწევისას.'
    - '**ტექმომსახურება** — საკუთარი სერვის-ცენტრი თბილისში, ყოველ 8 000 კმ-ზე.'
    - '**ფასწარმოქმნა** — ერთი გამჭვირვალე ტარიფი; დამატებითი სერვისები არჩევითია.'
    - '**აღრიცხვა** — ყოველი ავტომობილის შემოსავალი, ხარჯი და უკუგება ცალკე ითვლება.'
  - type: h2
    text: ავტოპარკის ეკონომიკა
  - type: p
    text: >-
      გაქირავების ბიზნესში მთავარი მაჩვენებელი ავტომობილის დატვირთვაა — რამდენ პროცენტს ატარებს იგი გაქირავებაში.
      ჩვენი მიზნობრივი დონე წლიურად 65%-ია; საზაფხულო სეზონზე მაჩვენებელი 85%-ს აღწევს, ზამთარში 45%-მდე
      ეცემა. თითოეული ავტომობილის ROI, ROA და უკუგების ვადა ავტომატურად ითვლება ჩვენს სისტემაში [Drive On Manager](/fleet-management-software/).
  - type: table
    rowhead: true
    caption: ტიპური ავტომობილის ეკონომიკა (საორიენტაციო მოდელი)
    head:
    - მაჩვენებელი
    - ეკონომ კლასი
    - კროსოვერი
    - 4x4
    rows:
    - cells:
      - შესყიდვის ღირებულება
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - საშუალო დატვირთვა
      - 70%
      - 65%
      - 55%
    - cells:
      - წლიური შემოსავალი
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - წლიური ხარჯი (სერვისი, დაზღვევა)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - უკუგების ვადა
      - ~33 თვე
      - ~43 თვე
      - ~45 თვე
  - type: note
    text: >-
      ცხრილი საორიენტაციოა და ასახავს მოდელს, არა ფაქტობრივ ფინანსურ ანგარიშგებას. მიზანია აჩვენოს, როგორ
      ითვლება გაქირავების ბიზნესის ერთეულის ეკონომიკა.
  - type: h2
    text: ჩვენი პრინციპები
  - type: cards
    items:
    - title: ფასი, რომელიც არ იცვლება ადგილზე
      text: რასაც საიტზე ხედავთ, იმას იხდით. „სავალდებულო დამატებით დაზღვევას“ ჩაბარებისას არ შემოგთავაზებთ.
    - title: ფოტოფიქსაცია ორივე მხრიდან
      text: >-
        მიღება-ჩაბარებისას ვიღებთ ავტომობილს ოთხივე მხრიდან. დავა დაზიანებაზე გამორიცხულია, რადგან მტკიცებულება
        ორივე მხარეს აქვს.
    - title: სანაცვლო ავტომობილი 6 საათში
      text: თუ ავტომობილი ჩვენი ბრალით გაფუჭდა, სანაცვლოს უფასოდ მოგაწვდით ქვეყნის ნებისმიერ წერტილში.
    - title: სამენოვანი დოკუმენტაცია
      text: ხელშეკრულება ქართულ, ინგლისურ და რუსულ ენაზე — ხელს აწერთ იმას, რასაც კითხულობთ.
  - type: h2
    text: კორპორატიული კლიენტები
  - type: p
    text: >-
      ვმუშაობთ სამშენებლო, ლოგისტიკურ და საკონსულტაციო კომპანიებთან. კორპორატიული ხელშეკრულება მოიცავს
      ფიქსირებულ თვიურ ტარიფს, სანაცვლო ავტომობილს, ტექმომსახურებას და ერთიან ინვოისს. ეს კომპანიისთვის
      საკუთარი ავტოპარკის ალტერნატივაა კაპიტალის გაყინვის გარეშე.
  - type: cta
    title: გინდათ თანამშრომლობა?
    text: კორპორატიული შეთავაზებისთვის მოგვწერეთ — მოგამზადებთ კალკულაციას თქვენი მოცულობის მიხედვით.
    actions:
    - label: კონტაქტი
      href: /contact/
    - label: ავტოპარკი
      href: /fleet/
en:
  title: About us — Drive On, car rental in Georgia since 2019
  desc: >-
    The company's history, the structure of our fleet, how we work and our in-house fleet management system.
    17 vehicles, 6 locations.
  keywords: car rental company Georgia, rent a car company georgia
  h1: About us
  lead: >-
    Drive On has been renting out cars since 2019. We started with 8 cars in Tbilisi — today the fleet
    holds 17 vehicles and we operate from six locations.
  blocks:
  - type: h2
    text: By the numbers
  - type: facts
    items:
    - k: Founded
      v: '2019'
    - k: Vehicles in the fleet
      v: '17'
    - k: Locations
      v: '6'
    - k: Rentals per year
      v: 4,800+
    - k: Average fleet age
      v: 4 years
    - k: Employees
      v: '34'
  - type: h2
    text: How we work
  - type: p
    text: >-
      Our model is simple: we own the fleet outright, we service it in our own workshop, and we retire
      a car from the fleet before repair costs turn it into a loss-maker. That gives us two advantages:
      predictable prices for the customer and a predictable margin for us.
  - type: ul
    items:
    - '**Fleet renewal** — a car leaves the fleet at 8 years or 200,000 km, whichever comes first.'
    - '**Servicing** — our own service centre in Tbilisi, every 8,000 km.'
    - '**Pricing** — one transparent rate; all extras are optional.'
    - '**Accounting** — revenue, costs and returns are tracked separately for every vehicle.'
  - type: h2
    text: Fleet economics
  - type: p
    text: >-
      The decisive metric in the rental business is utilisation — the share of the year a vehicle actually
      spends on rent. Our target is 65% annually; in the summer season it reaches 85% and in winter it
      falls to around 45%. ROI, ROA and payback period are calculated automatically for every vehicle
      in our own system, [Drive On Manager](/fleet-management-software/).
  - type: table
    rowhead: true
    caption: Economics of a typical vehicle (indicative model)
    head:
    - Metric
    - Economy class
    - Crossover
    - 4x4
    rows:
    - cells:
      - Purchase price
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - Average utilisation
      - 70%
      - 65%
      - 55%
    - cells:
      - Annual revenue
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - Annual costs (servicing, insurance)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - Payback period
      - ~33 months
      - ~43 months
      - ~45 months
  - type: note
    text: >-
      The table is indicative and illustrates a model rather than actual financial statements. Its purpose
      is to show how unit economics are calculated in the rental business.
  - type: h2
    text: Our principles
  - type: cards
    items:
    - title: A price that doesn't change at the counter
      text: What you see on the site is what you pay. We will not offer you "compulsory extra insurance"
        at handover.
    - title: Photo records from both sides
      text: >-
        At handover and return we photograph the car from all four sides. Disputes over damage are impossible,
        because both parties hold the evidence.
    - title: A replacement car within 6 hours
      text: If the car fails through our fault, we will deliver a replacement free of charge anywhere
        in the country.
    - title: Documentation in three languages
      text: The rental agreement is available in Georgian, English and Russian — you sign what you can
        actually read.
  - type: h2
    text: Corporate clients
  - type: p
    text: >-
      We work with construction, logistics and consulting companies. A corporate contract covers a fixed
      monthly rate, a replacement vehicle, servicing and a single invoice. For a company this is an alternative
      to running its own fleet without tying up capital.
  - type: cta
    title: Interested in working together?
    text: Email us for a corporate offer — we will prepare a quote based on your volume.
    actions:
    - label: Contact
      href: /contact/
    - label: Fleet
      href: /fleet/
ru:
  title: О нас — Drive On, аренда авто в Грузии с 2019 года
  desc: >-
    История компании, структура автопарка, принципы работы и собственная система управления автопарком.
    17 автомобилей, 6 локаций.
  keywords: компания по аренде авто в Грузии, rent a car company georgia
  h1: О нас
  lead: >-
    Drive On сдаёт автомобили в аренду с 2019 года. Мы начинали с 8 машин в Тбилиси — сегодня в автопарке
    17 автомобилей, и мы работаем в шести локациях.
  blocks:
  - type: h2
    text: Цифры
  - type: facts
    items:
    - k: Год основания
      v: '2019'
    - k: Машин в парке
      v: '17'
    - k: Локаций
      v: '6'
    - k: Аренд в год
      v: 4 800+
    - k: Средний возраст парка
      v: 4 года
    - k: Сотрудников
      v: '34'
  - type: h2
    text: Как мы работаем
  - type: p
    text: >-
      Наша модель проста: автопарк находится в нашей собственности, техобслуживание мы проводим в собственном
      сервисном центре, а машину выводим из парка до того, как она станет убыточной по расходам на ремонт.
      Это даёт два преимущества: предсказуемую цену для клиента и предсказуемую маржу для нас.
  - type: ul
    items:
    - '**Обновление парка** — автомобиль выводится из парка при достижении 8 лет или 200 000 км.'
    - '**Техобслуживание** — собственный сервисный центр в Тбилиси, каждые 8 000 км.'
    - '**Ценообразование** — один прозрачный тариф; дополнительные услуги опциональны.'
    - '**Учёт** — доход, расход и отдача считаются отдельно по каждому автомобилю.'
  - type: h2
    text: Экономика автопарка
  - type: p
    text: >-
      В прокатном бизнесе главный показатель — загрузка автомобиля, то есть какой процент времени он проводит
      в аренде. Наш целевой уровень — 65% в год; летом показатель достигает 85%, зимой опускается до 45%.
      ROI, ROA и срок окупаемости каждой машины считаются автоматически в нашей системе [Drive On Manager](/fleet-management-software/).
  - type: table
    rowhead: true
    caption: Экономика типового автомобиля (ориентировочная модель)
    head:
    - Показатель
    - Эконом-класс
    - Кроссовер
    - 4x4
    rows:
    - cells:
      - Стоимость покупки
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - Средняя загрузка
      - 70%
      - 65%
      - 55%
    - cells:
      - Годовая выручка
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - Годовые расходы (сервис, страховка)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - Срок окупаемости
      - ~33 месяца
      - ~43 месяца
      - ~45 месяцев
  - type: note
    text: >-
      Таблица ориентировочная и отражает модель, а не фактическую финансовую отчётность. Её цель — показать,
      как считается юнит-экономика прокатного бизнеса.
  - type: h2
    text: Наши принципы
  - type: cards
    items:
    - title: Цена, которая не меняется на месте
      text: >-
        Вы платите ровно то, что видите на сайте. «Обязательную дополнительную страховку» при выдаче мы
        вам не предложим.
    - title: Фотофиксация с обеих сторон
      text: >-
        При выдаче и возврате мы снимаем автомобиль со всех четырёх сторон. Спор о повреждениях исключён,
        потому что доказательства есть у обеих сторон.
    - title: Подменный автомобиль за 6 часов
      text: Если машина вышла из строя по нашей вине, подменную предоставим бесплатно в любой точке страны.
    - title: Документация на трёх языках
      text: Договор на грузинском, английском и русском — вы подписываете то, что читаете.
  - type: h2
    text: Корпоративные клиенты
  - type: p
    text: >-
      Мы работаем со строительными, логистическими и консалтинговыми компаниями. Корпоративный договор
      включает фиксированный месячный тариф, подменный автомобиль, техобслуживание и единый счёт. Для
      компании это альтернатива собственному автопарку без заморозки капитала.
  - type: cta
    title: Хотите сотрудничать?
    text: Для корпоративного предложения напишите нам — подготовим расчёт под ваш объём.
    actions:
    - label: Контакты
      href: /contact/
    - label: Автопарк
      href: /fleet/
fa:
  title: دربارهٔ ما — Drive On، اجارهٔ خودرو در گرجستان از 2019
  desc: >-
    تاریخچهٔ شرکت، ساختار ناوگان، شیوهٔ کار ما و سامانهٔ داخلی مدیریت ناوگان. 17 خودرو و 6 نمایندگی
    در سراسر گرجستان.
  keywords: شرکت اجاره خودرو در گرجستان, شرکت کرایه ماشین در گرجستان
  h1: دربارهٔ ما
  lead: >-
    Drive On از سال 2019 خودرو اجاره می‌دهد. کار را با 8 خودرو در تفلیس آغاز کردیم — امروز ناوگان ما
    17 خودرو دارد و از شش نمایندگی فعالیت می‌کنیم.
  blocks:
  - type: h2
    text: به زبان اعداد
  - type: facts
    items:
    - k: سال تأسیس
      v: '2019'
    - k: خودرو در ناوگان
      v: '17'
    - k: نمایندگی‌ها
      v: '6'
    - k: اجاره در سال
      v: 4,800+
    - k: میانگین عمر ناوگان
      v: 4 سال
    - k: کارکنان
      v: '34'
  - type: h2
    text: شیوهٔ کار ما
  - type: p
    text: >-
      مدل ما ساده است: ناوگان به‌طور کامل در مالکیت خودمان است، در تعمیرگاه خودمان سرویس می‌شود، و پیش
      از آنکه هزینهٔ تعمیر یک خودرو آن را زیان‌ده کند، آن را از ناوگان کنار می‌گذاریم. این کار دو مزیت
      به ما می‌دهد: قیمت‌های پیش‌بینی‌پذیر برای مشتری و حاشیهٔ سود پیش‌بینی‌پذیر برای ما.
  - type: ul
    items:
    - '**نوسازی ناوگان** — خودرو در 8 سالگی یا در 200,000 کیلومتر، هرکدام زودتر فرا برسد، از ناوگان خارج
      می‌شود.'
    - '**سرویس** — مرکز خدمات خودمان در تفلیس، هر 8,000 کیلومتر.'
    - '**قیمت‌گذاری** — یک نرخ شفاف؛ همهٔ خدمات جانبی اختیاری است.'
    - '**حسابداری** — درآمد، هزینه و بازده برای هر خودرو جداگانه پیگیری می‌شود.'
  - type: h2
    text: اقتصاد ناوگان
  - type: p
    text: >-
      شاخص تعیین‌کننده در کسب‌وکار اجاره، ضریب بهره‌برداری است — یعنی سهمی از سال که خودرو واقعاً در اجاره
      است. هدف سالانهٔ ما 65% است؛ در فصل تابستان به 85% می‌رسد و در زمستان تا حدود 45% پایین می‌آید.
      ROI، ROA و دورهٔ بازگشت سرمایه برای هر خودرو به‌صورت خودکار در سامانهٔ خودمان، [Drive On Manager](/fleet-management-software/)،
      محاسبه می‌شود.
  - type: table
    rowhead: true
    caption: اقتصاد یک خودروی معمول (مدل نمونه)
    head:
    - شاخص
    - کلاس اکونومی
    - کراس‌اوور
    - 4x4
    rows:
    - cells:
      - قیمت خرید
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - میانگین بهره‌برداری
      - 70%
      - 65%
      - 55%
    - cells:
      - درآمد سالانه
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - هزینه‌های سالانه (سرویس، بیمه)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - دورهٔ بازگشت سرمایه
      - ~33 ماه
      - ~43 ماه
      - ~45 ماه
  - type: note
    text: >-
      این جدول جنبهٔ نمونه دارد و یک مدل را نشان می‌دهد، نه صورت‌های مالی واقعی. هدف آن نشان دادن شیوهٔ
      محاسبهٔ اقتصاد واحد در کسب‌وکار اجاره است.
  - type: h2
    text: اصول ما
  - type: cards
    items:
    - title: قیمتی که پای پیشخوان تغییر نمی‌کند
      text: همان چیزی را می‌پردازید که در سایت می‌بینید. هنگام تحویل خودرو «بیمهٔ اضافی اجباری» به شما
        پیشنهاد نمی‌کنیم.
    - title: مستندات عکسی برای هر دو طرف
      text: >-
        هنگام تحویل و بازگرداندن، خودرو را از هر چهار طرف عکس می‌گیریم. اختلاف بر سر خسارت ناممکن است،
        چون مدرک در دست هر دو طرف است.
    - title: خودروی جایگزین ظرف 6 ساعت
      text: اگر خودرو به تقصیر ما از کار بیفتد، خودروی جایگزین را رایگان به هر نقطه‌ای از کشور می‌رسانیم.
    - title: مدارک به سه زبان
      text: قرارداد اجاره به گرجی، انگلیسی و روسی در دسترس است — چیزی را امضا می‌کنید که واقعاً می‌توانید
        بخوانید.
  - type: h2
    text: مشتریان شرکتی
  - type: p
    text: >-
      با شرکت‌های ساختمانی، لجستیکی و مشاوره‌ای کار می‌کنیم. قرارداد شرکتی شامل نرخ ماهانهٔ ثابت، خودروی
      جایگزین، سرویس و یک صورت‌حساب واحد است. برای یک شرکت، این جایگزینی است برای در اختیار داشتن ناوگان
      خودی، بدون آنکه سرمایه قفل شود.
  - type: cta
    title: به همکاری علاقه‌مندید؟
    text: برای دریافت پیشنهاد شرکتی ایمیل بزنید — بر پایهٔ حجم کار شما قیمت‌گذاری می‌کنیم.
    actions:
    - label: تماس
      href: /contact/
    - label: ناوگان
      href: /fleet/
he:
  title: עלינו — Drive On, השכרת רכב בגאורגיה מאז 2019
  desc: >-
    ההיסטוריה של החברה, מבנה הצי, איך אנחנו עובדים ומערכת ניהול הצי שפיתחנו בעצמנו. 17 רכבים ו-6
    נקודות שירות.
  keywords: חברת השכרת רכב בגאורגיה, השכרת רכב בגאורגיה חברה
  h1: עלינו
  lead: >-
    Drive On משכירה רכבים מאז 2019. התחלנו עם 8 מכוניות בטביליסי — כיום הצי מונה 17 רכבים ואנחנו
    פועלים משש נקודות שירות.
  blocks:
  - type: h2
    text: במספרים
  - type: facts
    items:
    - k: שנת הקמה
      v: '2019'
    - k: רכבים בצי
      v: '17'
    - k: נקודות שירות
      v: '6'
    - k: השכרות בשנה
      v: 4,800+
    - k: גיל ממוצע של הצי
      v: 4 שנים
    - k: עובדים
      v: '34'
  - type: h2
    text: איך אנחנו עובדים
  - type: p
    text: >-
      המודל שלנו פשוט: הצי נמצא בבעלותנו המלאה, אנחנו מטפלים בו במוסך שלנו, ומוציאים רכב מהצי לפני שעלויות
      התיקון הופכות אותו למפסיד. זה מקנה לנו שני יתרונות: מחירים צפויים ללקוח ורווחיות צפויה לנו.
  - type: ul
    items:
    - '**חידוש הצי** — רכב יוצא מהצי בגיל 8 שנים או ב-200,000 ק"מ, לפי המוקדם מביניהם.'
    - '**טיפולים** — מרכז שירות משלנו בטביליסי, כל 8,000 ק"מ.'
    - '**תמחור** — תעריף אחד שקוף; כל התוספות הן לבחירתכם.'
    - '**הנהלת חשבונות** — הכנסות, עלויות ותשואה נמדדות בנפרד לכל רכב.'
  - type: h2
    text: כלכלת הצי
  - type: p
    text: >-
      המדד המכריע בענף ההשכרה הוא שיעור הניצולת — חלקה של השנה שבו הרכב אכן מושכר. היעד השנתי שלנו הוא
      65%; בעונת הקיץ הוא מגיע ל-85% ובחורף יורד לכ-45%. ROI, ROA ותקופת ההחזר מחושבים אוטומטית לכל רכב
      במערכת שפיתחנו, [Drive On Manager](/fleet-management-software/).
  - type: table
    rowhead: true
    caption: כלכלה של רכב טיפוסי (מודל להמחשה)
    head:
    - מדד
    - מחלקת אקונומי
    - קרוסאובר
    - 4x4
    rows:
    - cells:
      - מחיר רכישה
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - ניצולת ממוצעת
      - 70%
      - 65%
      - 55%
    - cells:
      - הכנסה שנתית
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - עלויות שנתיות (טיפולים, ביטוח)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - תקופת החזר
      - ~33 חודשים
      - ~43 חודשים
      - ~45 חודשים
  - type: note
    text: הטבלה להמחשה בלבד ומציגה מודל ולא דוחות כספיים בפועל. מטרתה להראות כיצד מחושבת כלכלת היחידה
      בענף ההשכרה.
  - type: h2
    text: העקרונות שלנו
  - type: cards
    items:
    - title: מחיר שלא משתנה בדלפק
      text: מה שאתם רואים באתר הוא מה שאתם משלמים. לא נציע לכם "ביטוח נוסף חובה" במעמד מסירת הרכב.
    - title: תיעוד בתמונות לשני הצדדים
      text: >-
        במסירה ובהחזרה אנחנו מצלמים את הרכב מארבעת צדדיו. מחלוקות על נזקים אינן אפשריות, כי הראיות מצויות
        בידי שני הצדדים.
    - title: רכב חלופי בתוך 6 שעות
      text: אם הרכב מתקלקל באשמתנו, נספק רכב חלופי ללא תשלום בכל מקום בארץ.
    - title: מסמכים בשלוש שפות
      text: הסכם השכירות זמין בגאורגית, באנגלית וברוסית — אתם חותמים על מה שאתם באמת יכולים לקרוא.
  - type: h2
    text: לקוחות עסקיים
  - type: p
    text: >-
      אנחנו עובדים עם חברות בנייה, לוגיסטיקה וייעוץ. חוזה עסקי כולל תעריף חודשי קבוע, רכב חלופי, טיפולים
      וחשבונית אחת. עבור חברה זו חלופה להחזקת צי משלה, בלי לקשור הון.
  - type: cta
    title: מעוניינים בשיתוף פעולה?
    text: שלחו לנו דוא"ל לקבלת הצעה עסקית — נכין הצעת מחיר לפי היקף הפעילות שלכם.
    actions:
    - label: צור קשר
      href: /contact/
    - label: הצי
      href: /fleet/
ar:
  title: من نحن — Drive On، تأجير السيارات في جورجيا منذ 2019
  desc: >-
    تاريخ الشركة وبنية أسطولنا وطريقة عملنا ونظام إدارة الأسطول الذي طوّرناه بأنفسنا. 17 سيارة
    و6 مواقع في جورجيا.
  keywords: شركة تأجير سيارات في جورجيا, شركة استئجار سيارات في جورجيا
  h1: من نحن
  lead: >-
    تعمل Drive On في تأجير السيارات منذ عام 2019. بدأنا بـ 8 سيارات في تبليسي — واليوم يضم الأسطول أكثر
    17 سيارة ونعمل من ستة مواقع.
  blocks:
  - type: h2
    text: بالأرقام
  - type: facts
    items:
    - k: سنة التأسيس
      v: '2019'
    - k: السيارات في الأسطول
      v: '17'
    - k: المواقع
      v: '6'
    - k: عمليات التأجير سنوياً
      v: 4,800+
    - k: متوسط عمر الأسطول
      v: 4 سنوات
    - k: الموظفون
      v: '34'
  - type: h2
    text: كيف نعمل
  - type: p
    text: >-
      نموذجنا بسيط: نملك الأسطول بالكامل، ونصونه في ورشتنا الخاصة، ونُخرج السيارة من الأسطول قبل أن تحوّلها
      تكاليف الإصلاح إلى خاسرة. وهذا يمنحنا ميزتين: أسعاراً يمكن التنبؤ بها للعميل وهامش ربح يمكن التنبؤ
      به لنا.
  - type: ul
    items:
    - '**تجديد الأسطول** — تخرج السيارة من الأسطول عند بلوغها 8 سنوات أو 200,000 كم، أيهما أسبق.'
    - '**الصيانة** — مركز خدمة خاص بنا في تبليسي، كل 8,000 كم.'
    - '**التسعير** — تعرفة واحدة شفافة؛ وجميع الخدمات الإضافية اختيارية.'
    - '**المحاسبة** — تُتابَع الإيرادات والتكاليف والعوائد لكل سيارة على حدة.'
  - type: h2
    text: اقتصاديات الأسطول
  - type: p
    text: >-
      المؤشر الحاسم في قطاع التأجير هو معدّل الاستخدام — أي نسبة أيام السنة التي تكون فيها السيارة مؤجَّرة
      فعلاً. وهدفنا السنوي 65%؛ ويبلغ 85% في موسم الصيف وينخفض شتاءً إلى نحو 45%. وتُحتسب ROI وROA ومدة
      الاسترداد تلقائياً لكل سيارة في نظامنا الخاص [Drive On Manager](/fleet-management-software/).
  - type: table
    rowhead: true
    caption: اقتصاديات سيارة نموذجية (نموذج استرشادي)
    head:
    - المؤشر
    - الفئة الاقتصادية
    - كروس أوفر
    - 4x4
    rows:
    - cells:
      - سعر الشراء
      - 38 000 ₾
      - 78 000 ₾
      - 125 000 ₾
    - cells:
      - متوسط الاستخدام
      - 70%
      - 65%
      - 55%
    - cells:
      - الإيراد السنوي
      - 19 200 ₾
      - 30 800 ₾
      - 48 200 ₾
    - cells:
      - التكاليف السنوية (الصيانة، التأمين)
      - 5 400 ₾
      - 8 900 ₾
      - 14 600 ₾
    - cells:
      - مدة الاسترداد
      - ~33 شهراً
      - ~43 شهراً
      - ~45 شهراً
  - type: note
    text: >-
      الجدول استرشادي ويوضّح نموذجاً حسابياً لا بيانات مالية فعلية. والغرض منه بيان كيفية احتساب اقتصاديات
      الوحدة في قطاع التأجير.
  - type: h2
    text: مبادئنا
  - type: cards
    items:
    - title: سعر لا يتغيّر عند مكتب الاستلام
      text: ما تراه على الموقع هو ما تدفعه. ولن نعرض عليك «تأميناً إضافياً إلزامياً» لحظة تسليم السيارة.
    - title: توثيق بالصور لكلا الطرفين
      text: >-
        عند التسليم والإعادة نصوّر السيارة من جوانبها الأربعة. ولا مجال للخلاف حول الأضرار، لأن الدليل
        بحوزة الطرفين معاً.
    - title: سيارة بديلة خلال 6 ساعات
      text: إذا تعطّلت السيارة بسبب خطأ منّا، نوصل سيارة بديلة مجاناً إلى أي مكان في البلاد.
    - title: مستندات بثلاث لغات
      text: عقد الإيجار متاح بالجورجية والإنجليزية والروسية — فتوقّع على نص تستطيع قراءته فعلاً.
  - type: h2
    text: العملاء من الشركات
  - type: p
    text: >-
      نتعامل مع شركات المقاولات والخدمات اللوجستية والاستشارات. ويشمل العقد المؤسسي تعرفة شهرية ثابتة
      وسيارة بديلة والصيانة وفاتورة واحدة. وهو بالنسبة إلى الشركة بديل عن إدارة أسطول خاص بها دون تجميد
      رأس المال.
  - type: cta
    title: هل تودّ التعاون معنا؟
    text: راسلنا للحصول على عرض مؤسسي — وسنُعدّ لك تسعيرة بحسب حجم احتياجك.
    actions:
    - label: اتصل بنا
      href: /contact/
    - label: الأسطول
      href: /fleet/
