ka:
  title: ხშირად დასმული კითხვები ავტომობილის გაქირავებაზე | Fleet House
  desc: >-
    30+ პასუხი ავტომობილის გაქირავებაზე საქართველოში: ფასი, საბუთები, დაზღვევა, საზღვრის კვეთა, ზამთრის
    მოგზაურობა, სვანეთი და თუშეთი, ჯარიმები და დეპოზიტის დაბრუნება.
  keywords: rent a car georgia faq, მანქანის ქირაობა კითხვები, როგორ ვიქირავო მანქანა საქართველოში
  h1: ხშირად დასმული კითხვები
  lead: >-
    პასუხები კითხვებზე, რომლებსაც კლიენტები ყველაზე ხშირად გვისვამენ. თუ თქვენი კითხვა ჩამონათვალში არ
    არის — დაგვირეკეთ.
  blocks:
  - type: h2
    text: ფასი და გადახდა
  - type: faq
    items:
    - q: რამდენი ღირს მანქანის დაქირავება საქართველოში ერთი დღით?
      a: >-
        ეკონომ კლასის ავტომობილი — 75 ლარიდან (≈28 USD), კროსოვერი — 130 ლარიდან (≈48 USD), მაღალი გამავლობის
        4x4 — 240 ლარიდან (≈89 USD). 1–2 დღიან გაქირავებაზე ტარიფი ოდნავ მაღალია.
    - q: არის თუ არა ფასდაკლება გრძელვადიან გაქირავებაზე?
      a: >-
        დიახ. 7 დღიდან ფასი 10%-ით მცირდება, 30 დღიდან — 25%-ით. 3 თვეზე გრძელი კორპორატიული ხელშეკრულებით
        ფასდაკლება 40%-ს აღწევს.
    - q: შემიძლია ონლაინ გადავიხადო საიტიდან?
      a: >-
        ჯავშნის მოთხოვნა საიტიდან იგზავნება. ხელმისაწვდომობის შემოწმების შემდეგ ადმინისტრატორი გამოგიგზავნით
        უსაფრთხო გადახდის ინსტრუქციას; ჯავშანი სავალდებულო გადახდის შემდეგ დასტურდება.
    - q: რა ვალუტით ხდება ანგარიშსწორება?
      a: ძირითადი ვალუტა ლარია. ნაღდი ანგარიშსწორებით მიიღება აშშ დოლარი და ევრო გადახდის დღის ეროვნული
        ბანკის კურსით.
    - q: არის თუ არა დამალული გადასახადები?
      a: >-
        არა. საიტზე მითითებული ტარიფი მოიცავს დღგ-ს, CDW დაზღვევას, ტექმომსახურებას და შეუზღუდავ გარბენს.
        დამატებით ერიცხება მხოლოდ ის სერვისები, რომლებსაც თავად აირჩევთ.
    - q: იზრდება თუ არა ფასი სეზონზე?
      a: დიახ, ივლის–აგვისტოში მოქმედებს სეზონური კოეფიციენტი +15%. სააღდგომო და საახალწლო კვირეებში —
        +10%.
  - type: h2
    text: საბუთები და მოთხოვნები
  - type: faq
    items:
    - q: რა საბუთებია საჭირო?
      a: >-
        პასპორტი ან პირადობის მოწმობა, მართვის მოწმობა მინიმუმ 2 წლიანი სტაჟით და ბარათი დეპოზიტისთვის.
        იურიდიულ პირს დამატებით სჭირდება ამონაწერი რეესტრიდან და მინდობილობა.
    - q: საჭიროა თუ არა საერთაშორისო მართვის მოწმობა (IDP)?
      a: >-
        მხოლოდ იმ შემთხვევაში, თუ თქვენი ეროვნული მოწმობა ლათინური ანბანით არ არის შედგენილი. ევროკავშირის,
        აშშ-ის, დიდი ბრიტანეთის, ისრაელისა და დსთ-ს ქვეყნების მოწმობები საქართველოში პირდაპირ მოქმედებს.
    - q: რა ასაკიდან შემიძლია ავტომობილის დაქირავება?
      a: >-
        ეკონომ კლასი — 21 წლიდან 2 წლიანი სტაჟით. კროსოვერი და მინივენი — 23 წლიდან. ბიზნეს კლასი და 4x4
        — 25 წლიდან. 27 წლამდე მძღოლს ერიცხება ახალგაზრდა მძღოლის დანამატი 15–25 ლარი დღეში.
    - q: შეიძლება თუ არა მეორე მძღოლის დამატება?
      a: >-
        დიახ, 20 ლარად დღეში, მაქსიმუმ ორი დამატებითი მძღოლი. თითოეულმა უნდა დააკმაყოფილოს იგივე ასაკისა
        და სტაჟის მოთხოვნები და ხელი მოაწეროს ხელშეკრულებას.
  - type: h2
    text: დეპოზიტი და დაზღვევა
  - type: faq
    items:
    - q: რამდენია დეპოზიტი და როდის ბრუნდება?
      a: >-
        300 ლარიდან (ეკონომ კლასი) 1 200 ლარამდე (4x4). ბარათზე თანხა იბლოკება, არ ჩამოიჭრება, და თავისუფლდება
        ავტომობილის ჩაბარებიდან 3 სამუშაო დღეში.
    - q: რა ხდება, თუ ავტომობილი დავაზიანე?
      a: >-
        CDW დაზღვევა ფარავს ზიანს ფრანშიზის ზემოთ. ფრანშიზა ეკონომ კლასზე 300 ლარია, 4x4-ზე — 1 200 ლარი.
        SCDW-ის დამატებით (25–45 ლარი დღეში) ფრანშიზა ნულდება.
    - q: საბურავი ან დისკი დაზღვევით იფარება?
      a: >-
        არა. საბურავები, დისკები, ქვედა ნაწილი, სარკეები და სალონი სტანდარტული CDW-ით არ იფარება. საბურავის
        შეცვლა ჯდება 120–400 ლარი.
    - q: ვინ იხდის საგზაო ჯარიმას?
      a: >-
        მოქირავნე. ჯარიმა შეიძლება მოვიდეს გაქირავებიდან 30 დღის განმავლობაში; ამ შემთხვევაში ერიცხება
        ჯარიმის თანხა და 20 ლარი ადმინისტრირებისთვის.
  - type: h2
    text: მოძრაობა და მარშრუტები
  - type: faq
    items:
    - q: შემიძლია სვანეთში (მესტია, უშგული) წასვლა?
      a: >-
        მესტიამდე გზა ასფალტირებულია და ნებისმიერი კატეგორიით შეგიძლიათ. უშგულის მონაკვეთი გრუნტოვანია
        — ნებადართულია მხოლოდ მაღალი გამავლობის 4x4 კატეგორიით. სხვა კატეგორიით მიღებული დაზიანება დაზღვევით
        არ იფარება.
    - q: თუშეთში (ომალო) წასვლა შესაძლებელია?
      a: >-
        აბანოს უღელტეხილი ღიაა დაახლოებით ივნისიდან ოქტომბრამდე და მოითხოვს მაღალი გამავლობის 4x4-ს. საჭიროა
        წინასწარი წერილობითი შეთანხმება; ამ მარშრუტზე მოქმედებს დამატებითი ფრანშიზა 500 ლარი.
    - q: როგორია გზები ზამთარში?
      a: >-
        ცენტრალური მაგისტრალები (თბილისი–ბათუმი, თბილისი–ყაზბეგი) წლის განმავლობაში ღიაა, თუმცა გუდაურის
        მონაკვეთი ზვავის საფრთხის გამო პერიოდულად იკეტება. 1 დეკემბრიდან 1 აპრილამდე ყველა ავტომობილს
        ზამთრის საბურავი აქვს.
    - q: არის თუ არა გარბენი შეზღუდული?
      a: >-
        საქართველოს ტერიტორიაზე — არა, გარბენი შეუზღუდავია. საზღვრის კვეთისას მოქმედებს დღიური ლიმიტი
        300 კმ, ზედმეტი კილომეტრი — 0.5 ლარი.
    - q: სად ვიპოვო დამტენი ელექტრომობილისთვის?
      a: >-
        ავტოპარკში ელექტრომობილი ამჟამად არ გვაქვს — მხოლოდ ჰიბრიდები, რომლებიც დატენვას არ საჭიროებს.
        ჰიბრიდი მუშაობს ჩვეულებრივ ბენზინზე.
  - type: h2
    text: მიღება-ჩაბარება
  - type: faq
    items:
    - q: შემიძლია ავტომობილის აეროპორტში მიღება?
      a: >-
        დიახ, თბილისის, ქუთაისისა და ბათუმის აეროპორტებში. თბილისში მიწოდება უფასოა 3 დღიდან, ქუთაისსა
        და ბათუმში — 5 დღიდან. მოკლე ვადაზე საფასური 40–60 ლარია.
    - q: შესაძლებელია თუ არა ღამით მიღება?
      a: დიახ, 24 საათი. 22:00–07:00 ინტერვალში ერიცხება დამატებით 40 ლარი.
    - q: შემიძლია სხვა ქალაქში დაბრუნება?
      a: დიახ. თბილისი↔ქუთაისი↔ბათუმი მიმართულებით ერთმხრივი გაქირავება 100 ლარიდან ჯდება. სხვა ქალაქები
        — შეთანხმებით.
    - q: რა ხდება, თუ დავაგვიანებ დაბრუნებას?
      a: >-
        2 საათამდე დაგვიანება უფასოა. შემდეგ ერიცხება დღიური ტარიფის ერთი მესამედი ყოველ დაწყებულ 3 საათზე;
        8 საათზე მეტი დაგვიანება ითვლება სრულ დამატებით დღედ.
    - q: როგორ ხდება ავტომობილის მიღება-ჩაბარება?
      a: >-
        ვადგენთ მიღება-ჩაბარების აქტს ფოტოფიქსაციით: ვიღებთ ავტომობილის ოთხივე მხარეს, სალონს, გარბენს
        და საწვავის დონეს. იგივე პროცედურა მეორდება ჩაბარებისას — ასე გამორიცხულია დავა დაზიანებაზე.
  - type: h2
    text: სხვა
  - type: faq
    items:
    - q: შემიძლია ავტომობილის გამოყენება ტაქსად ან Bolt-ში?
      a: >-
        არა. კომერციული გამოყენება (ტაქსი, კურიერი, გადაზიდვა) აკრძალულია წინასწარი წერილობითი თანხმობის
        გარეშე და აუქმებს სადაზღვევო დაფარვას.
    - q: ცხოველის გადაყვანა შეიძლება?
      a: >-
        დიახ, სპეციალურ ბოქსში ან სავარძლის დამცავით. ბოქსის გარეშე გადაყვანა იწვევს 100 ლარიან საფასურს
        დამატებითი წმენდისთვის.
    - q: შესაძლებელია მძღოლთან ერთად დაქირავება?
      a: >-
        დიახ. მძღოლის სერვისი ჯდება 120 ლარი დღეში (8 საათი), ზეგანაკვეთი — 20 ლარი საათში. ხელმისაწვდომია
        ბიზნეს კლასზე, მინივენზე და 4x4-ზე.
    - q: გაქვთ საბავშვო სავარძლები?
      a: >-
        დიახ, სამი ასაკობრივი ჯგუფი (0–3, 3–7, 7–12 წელი), 10 ლარი დღეში. საქართველოს კანონმდებლობით 12
        წლამდე ბავშვი უნდა იმგზავროს სპეციალურ სავარძელში.
    - q: რა ვქნა, თუ ავტომობილი გზაში გაფუჭდა?
      a: >-
        დაგვირეკეთ ცხელ ხაზზე — საგზაო დახმარება 24/7 მუშაობს. თუ გაუმართაობა ტექნიკურია და არა მოქირავნის
        ბრალით გამოწვეული, სანაცვლო ავტომობილს 6 საათში მოგაწვდით უფასოდ.
    - q: აქირავებთ თუ არა ავტომობილს ლიზინგით ან განვადებით?
      a: >-
        გრძელვადიანი ოპერაციული გაქირავება (12–36 თვე) ხელმისაწვდომია იურიდიული პირებისთვის. ეს არ არის
        ლიზინგი — ავტომობილი ჩვენს ბალანსზე რჩება და ტექმომსახურება ჩვენი ხარჯია.
  - type: cta
    title: თქვენი კითხვა არ იპოვეთ?
    text: დაგვირეკეთ ან მოგვწერეთ — პასუხს სამუშაო საათებში 15 წუთში იღებთ.
    actions:
    - label: კონტაქტი
      href: /contact/
    - label: პირობები
      href: /terms/
en:
  title: Frequently asked questions about car rental | Fleet House
  desc: >-
    30+ answers about renting a car in Georgia: prices, documents, insurance, cross-border travel, winter
    driving, Svaneti and Tusheti, penalties and deposit refunds.
  keywords: rent a car georgia faq, car rental questions Georgia, how to rent a car in Georgia
  h1: Frequently asked questions
  lead: Answers to the questions our customers ask most often. If yours is not on the list, just give
    us a call.
  blocks:
  - type: h2
    text: Prices and payment
  - type: faq
    items:
    - q: How much does it cost to rent a car in Georgia for one day?
      a: >-
        An economy-class car starts at 75 GEL (≈28 USD), a crossover at 130 GEL (≈48 USD) and an off-road
        4x4 at 240 GEL (≈89 USD). For rentals of 1–2 days the rate is slightly higher.
    - q: Is there a discount for long-term rentals?
      a: >-
        Yes. From 7 days the price falls by 10%, and from 30 days by 25%. On corporate contracts longer
        than 3 months the discount reaches 40%.
    - q: Can I pay online through the website?
      a: >-
        Submit the booking request on the website. After availability is checked, the administrator sends
        secure payment instructions; the booking is confirmed after the required payment.
    - q: Which currency do you settle in?
      a: >-
        The main currency is the lari. In cash we also accept US dollars and euros at the National Bank
        rate on the day of payment.
    - q: Are there any hidden charges?
      a: >-
        No. The rate shown on the site includes VAT, CDW insurance, servicing and unlimited mileage. The
        only additional charges are for the extras you choose yourself.
    - q: Do prices go up in high season?
      a: >-
        Yes, a seasonal coefficient of +15% applies in July and August. During the Easter and New Year
        weeks it is +10%.
  - type: h2
    text: Documents and requirements
  - type: faq
    items:
    - q: What documents do I need?
      a: >-
        A passport or ID card, a driving licence held for at least 2 years, and a card for the deposit.
        Companies additionally need an extract from the register and a power of attorney.
    - q: Do I need an International Driving Permit (IDP)?
      a: >-
        Only if your national licence is not issued in the Latin alphabet. Licences from the EU, the USA,
        the United Kingdom, Israel and the CIS countries are valid in Georgia as they are.
    - q: What is the minimum age to rent a car?
      a: >-
        Economy class from 21 with 2 years' experience. Crossovers and minivans from 23. Business class
        and 4x4 from 25. Drivers under 27 pay a young driver surcharge of 15–25 GEL per day.
    - q: Can I add a second driver?
      a: >-
        Yes, for 20 GEL per day, up to two additional drivers. Each must meet the same age and experience
        requirements and sign the rental agreement.
  - type: h2
    text: Deposit and insurance
  - type: faq
    items:
    - q: How large is the deposit and when is it returned?
      a: >-
        From 300 GEL (economy class) up to 1,200 GEL (4x4). The amount is blocked on the card rather than
        charged, and is released within 3 business days of the car being returned.
    - q: What happens if I damage the car?
      a: >-
        CDW insurance covers damage above the excess. The excess is 300 GEL on economy class and 1,200
        GEL on a 4x4. Adding SCDW (25–45 GEL per day) reduces the excess to zero.
    - q: Are tyres and wheels covered by the insurance?
      a: >-
        No. Tyres, wheels, the underbody, the mirrors and the interior are not covered by standard CDW.
        Replacing a tyre costs 120–400 GEL.
    - q: Who pays traffic fines?
      a: >-
        The renter. A fine can arrive up to 30 days after the rental; in that case we charge the amount
        of the fine plus 20 GEL for processing.
  - type: h2
    text: Driving and routes
  - type: faq
    items:
    - q: Can I drive to Svaneti (Mestia, Ushguli)?
      a: >-
        The road as far as Mestia is paved and any category will do. The stretch to Ushguli is gravel
        — only the off-road 4x4 category is permitted there. Damage sustained in any other category is
        not covered by insurance.
    - q: Is it possible to drive to Tusheti (Omalo)?
      a: >-
        The Abano Pass is open roughly from June to October and requires an off-road 4x4. Prior written
        agreement is needed, and an additional excess of 500 GEL applies on this route.
    - q: What are the roads like in winter?
      a: >-
        The main highways (Tbilisi–Batumi, Tbilisi–Kazbegi) stay open all year, although the Gudauri section
        closes from time to time because of avalanche risk. From 1 December to 1 April every vehicle is
        fitted with winter tyres.
    - q: Is the mileage limited?
      a: >-
        Within Georgia, no — mileage is unlimited. For cross-border trips a daily limit of 300 km applies,
        with each extra kilometre charged at 0.5 GEL.
    - q: Where can I find a charger for an electric car?
      a: >-
        We currently have no electric cars in the fleet — only hybrids, which never need charging. A hybrid
        runs on ordinary petrol.
  - type: h2
    text: Pickup and return
  - type: faq
    items:
    - q: Can I pick the car up at the airport?
      a: >-
        Yes, at Tbilisi, Kutaisi and Batumi airports. In Tbilisi delivery is free from 3 days, and in
        Kutaisi and Batumi from 5 days. For shorter rentals the charge is 40–60 GEL.
    - q: Is night-time pickup possible?
      a: Yes, 24 hours a day. Between 22:00 and 07:00 an extra 40 GEL is charged.
    - q: Can I return the car in another city?
      a: Yes. One-way rentals on the Tbilisi↔Kutaisi↔Batumi routes start at 100 GEL. Other cities by arrangement.
    - q: What happens if I return the car late?
      a: >-
        Up to 2 hours late is free. After that we charge one third of the daily rate for every 3 hours
        started; a delay of more than 8 hours counts as a full extra day.
    - q: How does the handover and return work?
      a: >-
        We complete a handover report with photo documentation: we photograph all four sides of the car,
        the interior, the odometer and the fuel level. The same procedure is repeated on return — which
        rules out any dispute over damage.
  - type: h2
    text: Other questions
  - type: faq
    items:
    - q: Can I use the car as a taxi or on Bolt?
      a: >-
        No. Commercial use (taxi, courier work, haulage) is prohibited without prior written consent and
        voids the insurance coverage.
    - q: Can I travel with a pet?
      a: >-
        Yes, in a proper carrier or with a seat protector. Carrying an animal without a carrier incurs
        a 100 GEL charge for the extra cleaning.
    - q: Can I rent a car with a driver?
      a: >-
        Yes. The chauffeur service costs 120 GEL per day (8 hours), with overtime at 20 GEL per hour.
        It is available for business class, minivans and 4x4s.
    - q: Do you provide child seats?
      a: >-
        Yes, in three age groups (0–3, 3–7 and 7–12 years) at 10 GEL per day. Georgian law requires children
        under 12 to travel in a proper child seat.
    - q: What should I do if the car breaks down on the road?
      a: >-
        Call our hotline — roadside assistance operates 24/7. If the fault is technical and not caused
        by the renter, we will deliver a replacement car within 6 hours at no charge.
    - q: Do you offer leasing or instalment plans?
      a: >-
        Long-term operating rental (12–36 months) is available to companies. It is not leasing — the vehicle
        stays on our balance sheet and servicing is at our expense.
  - type: cta
    title: Didn't find your question?
    text: Call or email us — during business hours you will hear back within 15 minutes.
    actions:
    - label: Contact
      href: /contact/
    - label: Terms
      href: /terms/
ru:
  title: Часто задаваемые вопросы об аренде автомобиля | Fleet House
  desc: >-
    30+ ответов об аренде авто в Грузии: цены, документы, страховка, выезд за границу, зимние поездки,
    Сванетия и Тушетия, штрафы и возврат депозита.
  keywords: rent a car georgia faq, вопросы про прокат машин, как арендовать машину в Грузии
  h1: Часто задаваемые вопросы
  lead: Ответы на вопросы, которые клиенты задают нам чаще всего. Если вашего вопроса в списке нет — позвоните
    нам.
  blocks:
  - type: h2
    text: Цены и оплата
  - type: faq
    items:
    - q: Сколько стоит аренда машины в Грузии на один день?
      a: >-
        Автомобиль эконом-класса — от 75 лари (≈28 USD), кроссовер — от 130 лари (≈48 USD), внедорожник
        4x4 — от 240 лари (≈89 USD). При аренде на 1–2 дня тариф немного выше.
    - q: Есть ли скидки на долгосрочную аренду?
      a: >-
        Да. От 7 дней цена снижается на 10%, от 30 дней — на 25%. По корпоративному договору дольше 3
        месяцев скидка достигает 40%.
    - q: Могу ли я оплатить онлайн на сайте?
      a: >-
        Отправьте заявку на сайте. После проверки доступности администратор пришлёт безопасные инструкции
        по оплате; бронь подтверждается после обязательной оплаты.
    - q: В какой валюте производится расчёт?
      a: Основная валюта — лари. Наличными принимаются доллары США и евро по курсу Национального банка
        на день оплаты.
    - q: Есть ли скрытые платежи?
      a: >-
        Нет. Указанный на сайте тариф включает НДС, страховку CDW, техобслуживание и неограниченный пробег.
        Дополнительно начисляются только те услуги, которые вы выберете сами.
    - q: Растёт ли цена в сезон?
      a: Да, в июле–августе действует сезонный коэффициент +15%. На пасхальной и новогодней неделе — +10%.
  - type: h2
    text: Документы и требования
  - type: faq
    items:
    - q: Какие документы нужны?
      a: >-
        Паспорт или удостоверение личности, водительские права со стажем не менее 2 лет и карта для депозита.
        Юридическому лицу дополнительно нужны выписка из реестра и доверенность.
    - q: Нужны ли международные водительские права (IDP)?
      a: >-
        Только в том случае, если ваши национальные права оформлены не латиницей. Права стран ЕС, США,
        Великобритании, Израиля и СНГ действуют в Грузии напрямую.
    - q: С какого возраста можно арендовать автомобиль?
      a: >-
        Эконом-класс — с 21 года при стаже 2 года. Кроссоверы и минивэны — с 23 лет. Бизнес-класс и 4x4
        — с 25 лет. Водителям младше 27 лет начисляется надбавка молодого водителя 15–25 лари в сутки.
    - q: Можно ли добавить второго водителя?
      a: >-
        Да, за 20 лари в сутки, максимум два дополнительных водителя. Каждый должен соответствовать тем
        же требованиям по возрасту и стажу и подписать договор.
  - type: h2
    text: Депозит и страхование
  - type: faq
    items:
    - q: Каков размер депозита и когда он возвращается?
      a: >-
        От 300 лари (эконом-класс) до 1 200 лари (4x4). Сумма блокируется на карте, не списывается и разблокируется
        в течение 3 рабочих дней после возврата автомобиля.
    - q: Что будет, если я повредил автомобиль?
      a: >-
        Страховка CDW покрывает ущерб сверх франшизы. Франшиза в эконом-классе составляет 300 лари, на
        4x4 — 1 200 лари. С доплатой за SCDW (25–45 лари в сутки) франшиза обнуляется.
    - q: Покрываются ли страховкой шины и диски?
      a: >-
        Нет. Шины, диски, днище, зеркала и салон стандартной страховкой CDW не покрываются. Замена шины
        обходится в 120–400 лари.
    - q: Кто оплачивает дорожные штрафы?
      a: >-
        Арендатор. Штраф может прийти в течение 30 дней после аренды; в этом случае начисляются сумма
        штрафа и 20 лари за администрирование.
  - type: h2
    text: Поездки и маршруты
  - type: faq
    items:
    - q: Можно ли поехать в Сванетию (Местиа, Ушгули)?
      a: >-
        До Местиа дорога асфальтированная, доехать можно на любой категории. Участок до Ушгули грунтовый
        — разрешён только на внедорожниках категории 4x4. Повреждения, полученные на другой категории,
        страховкой не покрываются.
    - q: Можно ли доехать до Тушетии (Омало)?
      a: >-
        Перевал Абано открыт примерно с июня по октябрь и требует внедорожника 4x4. Нужно предварительное
        письменное согласование; на этом маршруте действует дополнительная франшиза 500 лари.
    - q: Какие дороги зимой?
      a: >-
        Центральные магистрали (Тбилиси–Батуми, Тбилиси–Казбеги) открыты круглый год, однако участок у
        Гудаури периодически закрывают из-за лавинной опасности. С 1 декабря по 1 апреля все автомобили
        укомплектованы зимней резиной.
    - q: Ограничен ли пробег?
      a: >-
        По территории Грузии — нет, пробег не ограничен. При выезде за границу действует суточный лимит
        300 км, каждый лишний километр — 0.5 лари.
    - q: Где найти зарядку для электромобиля?
      a: >-
        Электромобилей в автопарке сейчас нет — только гибриды, которые не нуждаются в зарядке. Гибрид
        работает на обычном бензине.
  - type: h2
    text: Выдача и возврат
  - type: faq
    items:
    - q: Можно ли получить автомобиль в аэропорту?
      a: >-
        Да, в аэропортах Тбилиси, Кутаиси и Батуми. В Тбилиси подача бесплатна от 3 дней, в Кутаиси и
        Батуми — от 5 дней. При более коротком сроке сбор составляет 40–60 лари.
    - q: Возможна ли выдача ночью?
      a: Да, круглосуточно. В интервале 22:00–07:00 начисляется доплата 40 лари.
    - q: Можно ли вернуть машину в другом городе?
      a: >-
        Да. Аренда в одну сторону по направлениям Тбилиси↔Кутаиси↔Батуми стоит от 100 лари. Другие города
        — по договорённости.
    - q: Что будет, если я опоздаю с возвратом?
      a: >-
        Опоздание до 2 часов бесплатно. Далее начисляется одна треть суточного тарифа за каждые начатые
        3 часа; опоздание более 8 часов считается полными дополнительными сутками.
    - q: Как происходит выдача и возврат автомобиля?
      a: >-
        Мы составляем акт приёма-передачи с фотофиксацией: снимаем автомобиль со всех четырёх сторон,
        салон, пробег и уровень топлива. Та же процедура повторяется при возврате — так исключаются споры
        о повреждениях.
  - type: h2
    text: Прочее
  - type: faq
    items:
    - q: Можно ли использовать автомобиль как такси или в Bolt?
      a: >-
        Нет. Коммерческое использование (такси, курьерская доставка, перевозки) запрещено без предварительного
        письменного согласия и аннулирует страховое покрытие.
    - q: Можно ли перевозить животных?
      a: >-
        Да, в специальном боксе или с защитным чехлом на сиденье. Перевозка без бокса влечёт сбор 100
        лари за дополнительную уборку.
    - q: Можно ли арендовать автомобиль с водителем?
      a: >-
        Да. Услуга водителя стоит 120 лари в сутки (8 часов), сверхурочные — 20 лари в час. Доступна для
        бизнес-класса, минивэнов и 4x4.
    - q: Есть ли у вас детские кресла?
      a: >-
        Да, три возрастные группы (0–3, 3–7, 7–12 лет), 10 лари в сутки. По законодательству Грузии дети
        до 12 лет должны перевозиться в специальном кресле.
    - q: Что делать, если автомобиль сломался в дороге?
      a: >-
        Позвоните на горячую линию — помощь на дороге работает 24/7. Если неисправность техническая и
        возникла не по вине арендатора, подменный автомобиль мы предоставим бесплатно в течение 6 часов.
    - q: Сдаёте ли вы автомобили в лизинг или в рассрочку?
      a: >-
        Долгосрочная операционная аренда (12–36 месяцев) доступна юридическим лицам. Это не лизинг — автомобиль
        остаётся на нашем балансе, и техобслуживание за наш счёт.
  - type: cta
    title: Не нашли свой вопрос?
    text: Позвоните или напишите — в рабочее время отвечаем в течение 15 минут.
    actions:
    - label: Контакты
      href: /contact/
    - label: Условия
      href: /terms/
fa:
  title: پرسش‌های متداول دربارهٔ اجارهٔ خودرو | Fleet House
  desc: >-
    30+ پاسخ دربارهٔ اجارهٔ خودرو در گرجستان: قیمت‌ها، مدارک، بیمه، سفر برون‌مرزی، رانندگی زمستانی، سوانتی
    و توشتی، جریمه‌ها و بازگشت ودیعه.
  keywords: پرسش‌های متداول اجاره خودرو در گرجستان, سوالات اجاره ماشین در گرجستان, چگونه در گرجستان خودرو
    اجاره کنیم
  h1: پرسش‌های متداول
  lead: پاسخ پرسش‌هایی که مشتریان ما بیش از همه می‌پرسند. اگر پرسش شما در این فهرست نیست، کافی است تماس
    بگیرید.
  blocks:
  - type: h2
    text: قیمت‌ها و پرداخت
  - type: faq
    items:
    - q: اجارهٔ خودرو در گرجستان برای یک روز چقدر هزینه دارد؟
      a: >-
        خودروی کلاس اکونومی از 75 لاری (≈28 USD)، کراس‌اوور از 130 لاری (≈48 USD) و آفرود 4x4 از 240 لاری
        (≈89 USD) آغاز می‌شود. برای اجارهٔ 1–2 روزه نرخ اندکی بالاتر است.
    - q: آیا برای اجارهٔ بلندمدت تخفیف دارید؟
      a: >-
        بله. از 7 روز به بالا قیمت 10% کاهش می‌یابد و از 30 روز به بالا 25%. در قراردادهای شرکتی بیش از
        3 ماه، تخفیف به 40% می‌رسد.
    - q: آیا می‌توانم پرداخت را به‌صورت آنلاین از راه سایت انجام دهم؟
      a: >-
        درخواست رزرو را در سایت ارسال کنید. پس از بررسی موجود بودن خودرو، مدیر دستورالعمل امن پرداخت را
        می‌فرستد؛ رزرو پس از پرداخت الزامی تأیید می‌شود.
    - q: تسویه با چه ارزی انجام می‌شود؟
      a: ارز اصلی لاری است. در پرداخت نقدی، دلار آمریکا و یورو را نیز با نرخ بانک ملی گرجستان در روز پرداخت
        می‌پذیریم.
    - q: آیا هزینهٔ پنهانی وجود دارد؟
      a: >-
        خیر. نرخ درج‌شده در سایت شامل مالیات بر ارزش افزوده، بیمهٔ CDW، سرویس دوره‌ای و کیلومتر نامحدود
        است. تنها هزینه‌های اضافی مربوط به خدمات جانبی است که خودتان انتخاب می‌کنید.
    - q: آیا قیمت‌ها در فصل پرمسافر بالا می‌رود؟
      a: >-
        بله، در ماه‌های ژوئیه و اوت ضریب فصلی اعمال می‌شود که قیمت را 15% افزایش می‌دهد. در هفتهٔ عید
        پاک و هفتهٔ سال نو این افزایش 10% است.
  - type: h2
    text: مدارک و شرایط
  - type: faq
    items:
    - q: برای اجارهٔ خودرو چه مدارکی لازم است؟
      a: >-
        گذرنامه یا کارت شناسایی، گواهی‌نامهٔ رانندگی با دست‌کم 2 سال سابقه، و یک کارت بانکی برای ودیعه.
        شرکت‌ها افزون بر این به رونوشت ثبت شرکت و وکالت‌نامه نیاز دارند.
    - q: آیا به گواهی‌نامهٔ رانندگی بین‌المللی (IDP) نیاز دارم؟
      a: >-
        تنها در صورتی که گواهی‌نامهٔ ملی شما به الفبای لاتین صادر نشده باشد. گواهی‌نامه‌های اتحادیهٔ اروپا،
        ایالات متحده، بریتانیا، اسرائیل و کشورهای مشترک‌المنافع در گرجستان به همان صورت معتبرند.
    - q: حداقل سن برای اجارهٔ خودرو چقدر است؟
      a: >-
        کلاس اکونومی از 21 سال با 2 سال سابقه. کراس‌اوور و مینی‌ون از 23 سال. کلاس بیزنس و 4x4 از 25 سال.
        رانندگان زیر 27 سال روزانه 15 تا 25 لاری هزینهٔ رانندهٔ جوان می‌پردازند.
    - q: آیا می‌توانم رانندهٔ دوم اضافه کنم؟
      a: >-
        بله، روزانه 20 لاری، تا سقف دو رانندهٔ اضافی. هر یک باید همان شرایط سن و سابقه را داشته باشد و
        قرارداد اجاره را امضا کند.
  - type: h2
    text: ودیعه و بیمه
  - type: faq
    items:
    - q: مبلغ ودیعه چقدر است و چه زمانی بازگردانده می‌شود؟
      a: >-
        از 300 لاری (کلاس اکونومی) تا 1,200 لاری (4x4). این مبلغ روی کارت بلوکه می‌شود و برداشت نمی‌گردد،
        و ظرف 3 روز کاری پس از بازگرداندن خودرو آزاد می‌شود.
    - q: اگر به خودرو خسارت بزنم چه می‌شود؟
      a: >-
        بیمهٔ CDW خسارت بالاتر از مبلغ فرانشیز را پوشش می‌دهد. فرانشیز در کلاس اکونومی 300 لاری و در 4x4
        برابر 1,200 لاری است. افزودن SCDW (روزانه 25 تا 45 لاری) فرانشیز را به صفر می‌رساند.
    - q: آیا لاستیک‌ها و رینگ‌ها زیر پوشش بیمه هستند؟
      a: >-
        خیر. لاستیک‌ها، رینگ‌ها، کف زیرین خودرو، آینه‌ها و فضای داخلی کابین زیر پوشش CDW استاندارد نیستند.
        تعویض یک لاستیک 120 تا 400 لاری هزینه دارد.
    - q: جریمه‌های رانندگی را چه کسی می‌پردازد؟
      a: >-
        اجاره‌کننده. جریمه ممکن است تا 30 روز پس از پایان اجاره برسد؛ در این صورت مبلغ جریمه به‌علاوهٔ
        20 لاری هزینهٔ رسیدگی دریافت می‌شود.
  - type: h2
    text: رانندگی و مسیرها
  - type: faq
    items:
    - q: آیا می‌توانم با خودرو به سوانتی (مستیا، اوشگولی) بروم؟
      a: >-
        جاده تا مستیا آسفالت است و هر دسته‌ای برای آن مناسب است. مسیر تا اوشگولی شنی است — تنها دستهٔ
        آفرود 4x4 اجازهٔ رفتن به آنجا را دارد. خسارت واردشده با هر دستهٔ دیگر تحت پوشش بیمه نیست.
    - q: آیا رفتن به توشتی (اومالو) ممکن است؟
      a: >-
        گردنهٔ آبانو تقریباً از ژوئن تا اکتبر باز است و به خودروی آفرود 4x4 نیاز دارد. توافق کتبی پیشین
        لازم است و در این مسیر فرانشیز اضافی 500 لاری اعمال می‌شود.
    - q: وضعیت جاده‌ها در زمستان چگونه است؟
      a: >-
        بزرگراه‌های اصلی (تفلیس–باتومی، تفلیس–کازبگی) در تمام سال باز هستند، هرچند بخش گودائوری هرازگاهی
        به دلیل خطر بهمن بسته می‌شود. از 1 دسامبر تا 1 آوریل همهٔ خودروها به لاستیک زمستانی مجهز می‌شوند.
    - q: آیا کیلومتر محدود است؟
      a: >-
        درون گرجستان خیر — کیلومتر نامحدود است. برای سفرهای برون‌مرزی سقف روزانهٔ 300 کیلومتر اعمال می‌شود
        و هر کیلومتر اضافی 0.5 لاری هزینه دارد.
    - q: کجا می‌توانم شارژر خودروی برقی پیدا کنم؟
      a: >-
        در حال حاضر خودروی برقی در ناوگان ما نیست — تنها خودروهای هیبریدی که هرگز به شارژ نیاز ندارند.
        خودروی هیبریدی با بنزین معمولی کار می‌کند.
  - type: h2
    text: تحویل گرفتن و بازگرداندن
  - type: faq
    items:
    - q: آیا می‌توانم خودرو را در فرودگاه تحویل بگیرم؟
      a: >-
        بله، در فرودگاه‌های تفلیس، کوتایسی و باتومی. در تفلیس تحویل از 3 روز به بالا رایگان است و در کوتایسی
        و باتومی از 5 روز به بالا. برای اجاره‌های کوتاه‌تر 40 تا 60 لاری دریافت می‌شود.
    - q: آیا تحویل خودرو در شب امکان‌پذیر است؟
      a: بله، شبانه‌روزی. میان ساعت 22:00 تا 07:00 مبلغ اضافی 40 لاری دریافت می‌شود.
    - q: آیا می‌توانم خودرو را در شهر دیگری تحویل بدهم؟
      a: بله. اجارهٔ یک‌طرفه در مسیرهای تفلیس↔کوتایسی↔باتومی از 100 لاری آغاز می‌شود. شهرهای دیگر با هماهنگی.
    - q: اگر خودرو را با تأخیر بازگردانم چه می‌شود؟
      a: >-
        تا 2 ساعت تأخیر رایگان است. پس از آن برای هر 3 ساعت آغازشده یک‌سوم نرخ روزانه دریافت می‌شود؛ تأخیر
        بیش از 8 ساعت یک روز کامل اضافی به شمار می‌رود.
    - q: روند تحویل و بازگرداندن خودرو چگونه است؟
      a: >-
        صورت‌جلسهٔ تحویل با مستندات عکسی تنظیم می‌کنیم: از هر چهار طرف خودرو، فضای داخلی، کیلومترشمار
        و سطح سوخت عکس می‌گیریم. همین روند هنگام بازگرداندن تکرار می‌شود — که هرگونه اختلاف بر سر خسارت
        را ناممکن می‌کند.
  - type: h2
    text: پرسش‌های دیگر
  - type: faq
    items:
    - q: آیا می‌توانم از خودرو به‌عنوان تاکسی یا در Bolt استفاده کنم؟
      a: خیر. استفادهٔ تجاری (تاکسی، پیک، حمل بار) بدون رضایت کتبی پیشین ممنوع است و پوشش بیمه را باطل
        می‌کند.
    - q: آیا می‌توانم با حیوان خانگی سفر کنم؟
      a: بله، در باکس مخصوص یا با روکش محافظ صندلی. حمل حیوان بدون باکس 100 لاری هزینهٔ نظافت اضافی دارد.
    - q: آیا می‌توانم خودرو را همراه با راننده اجاره کنم؟
      a: >-
        بله. خدمات راننده روزانه 120 لاری (8 ساعت) هزینه دارد و هر ساعت اضافه 20 لاری. این خدمات برای
        کلاس بیزنس، مینی‌ون و 4x4 در دسترس است.
    - q: آیا صندلی کودک ارائه می‌دهید؟
      a: >-
        بله، در سه گروه سنی (0–3، 3–7 و 7–12 سال) روزانه 10 لاری. قانون گرجستان کودکان زیر 12 سال را ملزم
        می‌کند در صندلی کودک مناسب سفر کنند.
    - q: اگر خودرو در جاده خراب شود چه کار کنم؟
      a: >-
        با خط پشتیبانی ما تماس بگیرید — امداد جاده‌ای 24/7 فعال است. اگر ایراد فنی باشد و اجاره‌کننده
        مقصر نباشد، ظرف 6 ساعت خودروی جایگزین را رایگان تحویل می‌دهیم.
    - q: آیا لیزینگ یا اجارهٔ اقساطی ارائه می‌دهید؟
      a: >-
        اجارهٔ عملیاتی بلندمدت (12 تا 36 ماه) برای شرکت‌ها در دسترس است. این لیزینگ نیست — خودرو در ترازنامهٔ
        ما می‌ماند و سرویس آن بر عهدهٔ ماست.
  - type: cta
    title: پرسش خود را نیافتید؟
    text: تماس بگیرید یا ایمیل بزنید — در ساعات کاری ظرف 15 دقیقه پاسخ می‌گیرید.
    actions:
    - label: تماس
      href: /contact/
    - label: شرایط
      href: /terms/
he:
  title: שאלות נפוצות על השכרת רכב | Fleet House
  desc: >-
    30+ תשובות על השכרת רכב בגאורגיה: מחירים, מסמכים, ביטוח, נסיעה מעבר לגבול, נהיגה בחורף, סוואנטי וטושתי,
    קנסות והחזר הפיקדון.
  keywords: שאלות נפוצות על השכרת רכב בגאורגיה, שאלות על השכרת רכב בגאורגיה, איך שוכרים רכב בגאורגיה
  h1: שאלות נפוצות
  lead: תשובות לשאלות שהלקוחות שלנו שואלים הכי הרבה. אם השאלה שלכם אינה ברשימה, פשוט התקשרו אלינו.
  blocks:
  - type: h2
    text: מחירים ותשלום
  - type: faq
    items:
    - q: כמה עולה להשכיר רכב בגאורגיה ליום אחד?
      a: >-
        רכב במחלקת אקונומי מתחיל ב-75 לארי (≈28 USD), קרוסאובר ב-130 לארי (≈48 USD) ורכב שטח 4x4 ב-240
        לארי (≈89 USD). בהשכרה ל-1–2 ימים התעריף מעט גבוה יותר.
    - q: יש הנחה להשכרה ארוכת טווח?
      a: כן. מ-7 ימים המחיר יורד ב-10%, ומ-30 ימים ב-25%. בחוזים עסקיים ארוכים מ-3 חודשים ההנחה מגיעה
        ל-40%.
    - q: אפשר לשלם אונליין דרך האתר?
      a: >-
        שלחו בקשת הזמנה באתר. לאחר בדיקת הזמינות המנהל שולח הוראות תשלום מאובטחות; ההזמנה מאושרת לאחר
        התשלום הנדרש.
    - q: באיזה מטבע מתבצע התשלום?
      a: המטבע העיקרי הוא הלארי. במזומן אנו מקבלים גם דולר אמריקאי ואירו לפי שער הבנק הלאומי ביום התשלום.
    - q: יש עלויות נסתרות?
      a: >-
        לא. התעריף המופיע באתר כולל מע"מ, ביטוח CDW, טיפולים וקילומטראז' ללא הגבלה. התוספות היחידות הן
        שירותים שאתם בוחרים בעצמכם.
    - q: המחירים עולים בעונת השיא?
      a: כן, ביולי ובאוגוסט חל מקדם עונתי שמעלה את המחיר ב-15%. בשבועות הפסחא והשנה החדשה העלייה היא 10%.
  - type: h2
    text: מסמכים ודרישות
  - type: faq
    items:
    - q: אילו מסמכים דרושים להשכרת רכב?
      a: >-
        דרכון או תעודת זהות, רישיון נהיגה בוותק של 2 שנים לפחות, וכרטיס אשראי לפיקדון. חברות נדרשות בנוסף
        לנסח מרשם החברות ולייפוי כוח.
    - q: האם צריך רישיון נהיגה בינלאומי (IDP)?
      a: >-
        רק אם הרישיון הלאומי שלכם אינו מונפק באלפבית הלטיני. רישיונות מהאיחוד האירופי, מארצות הברית, מבריטניה,
        מישראל וממדינות חבר העמים תקפים בגאורגיה כמות שהם.
    - q: מה גיל המינימום להשכרת רכב?
      a: >-
        מחלקת אקונומי מגיל 21 עם ותק של 2 שנים. קרוסאוברים ומיניוואנים מגיל 23. מחלקת עסקים ורכבי 4x4
        מגיל 25. נהגים מתחת לגיל 27 משלמים תוספת נהג צעיר של 15–25 לארי ליום.
    - q: אפשר להוסיף נהג שני?
      a: כן, ב-20 לארי ליום, עד שני נהגים נוספים. כל אחד מהם חייב לעמוד באותן דרישות גיל וותק ולחתום על
        הסכם השכירות.
  - type: h2
    text: פיקדון וביטוח
  - type: faq
    items:
    - q: מה גובה הפיקדון ומתי הוא מוחזר?
      a: >-
        מ-300 לארי (מחלקת אקונומי) ועד 1,200 לארי (4x4). הסכום נחסם בכרטיס ואינו נגבה בפועל, והוא משוחרר
        בתוך 3 ימי עסקים ממועד החזרת הרכב.
    - q: מה קורה אם אגרום נזק לרכב?
      a: >-
        ביטוח CDW מכסה נזק מעל להשתתפות העצמית. ההשתתפות העצמית היא 300 לארי במחלקת אקונומי ו-1,200 לארי
        ברכב 4x4. הוספת SCDW (25–45 לארי ליום) מאפסת את ההשתתפות העצמית.
    - q: האם צמיגים וחישוקים מכוסים בביטוח?
      a: >-
        לא. צמיגים, חישוקים, תחתית הרכב, המראות ותא הנוסעים אינם מכוסים בביטוח CDW הרגיל. החלפת צמיג עולה
        120–400 לארי.
    - q: מי משלם קנסות תנועה?
      a: השוכר. קנס עשוי להגיע עד 30 יום לאחר תום ההשכרה; במקרה כזה נחייב את סכום הקנס בתוספת 20 לארי
        דמי טיפול.
  - type: h2
    text: נהיגה ומסלולים
  - type: faq
    items:
    - q: אפשר לנסוע לסוואנטי (מסטיה, אושגולי)?
      a: >-
        הכביש עד מסטיה סלול וכל קטגוריה מתאימה לו. הקטע עד אושגולי הוא דרך חצץ — רק קטגוריית רכב השטח
        4x4 מורשית שם. נזק שנגרם בכל קטגוריה אחרת אינו מכוסה בביטוח.
    - q: אפשר להגיע לטושתי (אומאלו)?
      a: >-
        מעבר אבאנו פתוח בערך מיוני עד אוקטובר ומחייב רכב שטח 4x4. נדרש סיכום מראש ובכתב, ובמסלול הזה חלה
        השתתפות עצמית נוספת של 500 לארי.
    - q: איך נראים הכבישים בחורף?
      a: >-
        הכבישים הראשיים (טביליסי–בטומי, טביליסי–קזבגי) פתוחים כל השנה, אם כי קטע גודאורי נסגר מדי פעם
        בשל סכנת מפולות שלגים. מ-1 בדצמבר עד 1 באפריל כל הרכבים מצוידים בצמיגי חורף.
    - q: האם הקילומטראז' מוגבל?
      a: >-
        בתוך גאורגיה לא — הקילומטראז' ללא הגבלה. בנסיעות מעבר לגבול חלה מגבלה יומית של 300 ק"מ, וכל קילומטר
        נוסף עולה 0.5 לארי.
    - q: איפה אפשר למצוא עמדת טעינה לרכב חשמלי?
      a: כרגע אין לנו רכבים חשמליים בצי — רק היברידיים, שאינם זקוקים לטעינה כלל. רכב היברידי נוסע על בנזין
        רגיל.
  - type: h2
    text: קבלת הרכב והחזרתו
  - type: faq
    items:
    - q: אפשר לקבל את הרכב בשדה התעופה?
      a: >-
        כן, בשדות התעופה של טביליסי, קוטאיסי ובטומי. בטביליסי המסירה חינם מ-3 ימים, ובקוטאיסי ובבטומי
        מ-5 ימים. בהשכרות קצרות יותר החיוב הוא 40–60 לארי.
    - q: אפשר לקבל את הרכב בשעות הלילה?
      a: כן, 24 שעות ביממה. בין 22:00 ל-07:00 נגבית תוספת של 40 לארי.
    - q: אפשר להחזיר את הרכב בעיר אחרת?
      a: כן. השכרה בכיוון אחד במסלולים טביליסי↔קוטאיסי↔בטומי מתחילה ב-100 לארי. ערים אחרות בתיאום מראש.
    - q: מה קורה אם אחזיר את הרכב באיחור?
      a: >-
        איחור של עד 2 שעות אינו כרוך בתשלום. לאחר מכן נגבה שליש מהתעריף היומי על כל 3 שעות שהתחילו; איחור
        של יותר מ-8 שעות נחשב ליום נוסף מלא.
    - q: איך מתבצעים מסירת הרכב והחזרתו?
      a: >-
        אנו עורכים דוח מסירה עם תיעוד בתמונות: מצלמים את הרכב מארבעת צדדיו, את תא הנוסעים, את מד הקילומטראז'
        ואת מפלס הדלק. אותו נוהל חוזר בהחזרה — מה שמונע כל מחלוקת בנוגע לנזקים.
  - type: h2
    text: שאלות נוספות
  - type: faq
    items:
    - q: אפשר להשתמש ברכב כמונית או ב-Bolt?
      a: לא. שימוש מסחרי (מונית, שליחויות, הובלות) אסור ללא הסכמה מוקדמת בכתב ומבטל את כיסוי הביטוח.
    - q: אפשר לנסוע עם חיית מחמד?
      a: כן, בכלוב מתאים או עם מגן מושב. הסעת בעל חיים ללא כלוב כרוכה בחיוב של 100 לארי עבור ניקיון נוסף.
    - q: אפשר לשכור רכב עם נהג?
      a: >-
        כן. שירות הנהג עולה 120 לארי ליום (8 שעות), ושעות נוספות ב-20 לארי לשעה. השירות זמין למחלקת עסקים,
        למיניוואנים ולרכבי 4x4.
    - q: האם יש כיסאות בטיחות לילדים?
      a: >-
        כן, בשלוש קבוצות גיל (0–3, 3–7 ו-7–12 שנים) ב-10 לארי ליום. החוק הגאורגי מחייב ילדים מתחת לגיל
        12 לנסוע בכיסא בטיחות מתאים.
    - q: מה עושים אם הרכב מתקלקל בדרך?
      a: >-
        התקשרו למוקד שלנו — שירות הדרך פועל 24/7. אם התקלה טכנית ואינה באשמת השוכר, נספק רכב חלופי בתוך
        6 שעות ללא תשלום.
    - q: האם אתם מציעים ליסינג או תשלומים?
      a: >-
        השכרה תפעולית ארוכת טווח (12–36 חודשים) זמינה לחברות. זה אינו ליסינג — הרכב נשאר במאזן שלנו והטיפולים
        על חשבוננו.
  - type: cta
    title: לא מצאתם את השאלה שלכם?
    text: התקשרו או שלחו לנו דוא"ל — בשעות הפעילות תקבלו מענה בתוך 15 דקות.
    actions:
    - label: צור קשר
      href: /contact/
    - label: תנאים
      href: /terms/
ar:
  title: الأسئلة الشائعة حول استئجار السيارات | Fleet House
  desc: >-
    30+ إجابة عن استئجار سيارة في جورجيا: الأسعار، المستندات، التأمين، السفر عبر الحدود، القيادة في الشتاء،
    سفانيتي وتوشيتي، الغرامات واسترداد الوديعة.
  keywords: أسئلة شائعة عن استئجار سيارة في جورجيا, استفسارات تأجير السيارات في جورجيا, كيف أستأجر سيارة
    في جورجيا
  h1: الأسئلة الشائعة
  lead: إجابات عن الأسئلة التي يطرحها عملاؤنا أكثر من غيرها. وإن لم تجد سؤالك في القائمة، فاتصل بنا مباشرة.
  blocks:
  - type: h2
    text: الأسعار والدفع
  - type: faq
    items:
    - q: كم تكلفة استئجار سيارة في جورجيا ليوم واحد؟
      a: >-
        تبدأ سيارة الفئة الاقتصادية من 75 لاري (≈28 USD)، والكروس أوفر من 130 لاري (≈48 USD)، وسيارة الطرق
        الوعرة 4x4 من 240 لاري (≈89 USD). وفي الإيجار لمدة 1–2 يوم تكون التعرفة أعلى قليلاً.
    - q: هل هناك خصم على الإيجار طويل الأمد؟
      a: >-
        نعم. اعتباراً من 7 أيام ينخفض السعر بنسبة 10%، ومن 30 يوماً بنسبة 25%. وفي العقود المؤسسية التي
        تتجاوز 3 أشهر يصل الخصم إلى 40%.
    - q: هل يمكنني الدفع إلكترونياً عبر الموقع؟
      a: >-
        أرسل طلب الحجز عبر الموقع. بعد التحقق من التوفر يرسل المسؤول تعليمات دفع آمنة؛ ويُؤكد الحجز بعد
        إتمام الدفع المطلوب.
    - q: بأي عملة تتم التسوية؟
      a: >-
        العملة الأساسية هي اللاري. وفي الدفع النقدي نقبل أيضاً الدولار الأمريكي واليورو وفق سعر البنك
        الوطني في يوم الدفع.
    - q: هل توجد رسوم خفية؟
      a: >-
        لا. التعرفة المعروضة على الموقع تشمل ضريبة القيمة المضافة وتأمين CDW والصيانة والمسافة غير المحدودة.
        والرسوم الإضافية الوحيدة هي الخدمات الاختيارية التي تختارها بنفسك.
    - q: هل ترتفع الأسعار في موسم الذروة؟
      a: >-
        نعم، يُطبَّق في يوليو وأغسطس معامل موسمي يرفع السعر بنسبة 15%. وفي أسبوعَي عيد الفصح ورأس السنة
        تبلغ الزيادة 10%.
  - type: h2
    text: المستندات والمتطلبات
  - type: faq
    items:
    - q: ما المستندات المطلوبة لاستئجار سيارة؟
      a: >-
        جواز سفر أو بطاقة هوية، ورخصة قيادة بخبرة 2 سنة على الأقل، وبطاقة مصرفية للوديعة. أما الشركات
        فتحتاج إضافةً إلى مستخرج من السجل التجاري وتوكيل رسمي.
    - q: هل أحتاج إلى رخصة قيادة دولية (IDP)؟
      a: >-
        فقط إذا لم تكن رخصتك الوطنية صادرة بالأبجدية اللاتينية. أما رخص الاتحاد الأوروبي والولايات المتحدة
        والمملكة المتحدة وإسرائيل ودول رابطة الدول المستقلة فهي سارية في جورجيا كما هي.
    - q: ما الحد الأدنى للعمر لاستئجار سيارة؟
      a: >-
        الفئة الاقتصادية من 21 سنة بخبرة 2 سنة. الكروس أوفر والميني فان من 23 سنة. فئة رجال الأعمال وسيارات
        4x4 من 25 سنة. ويدفع السائقون دون 27 سنة رسوم سائق شاب تتراوح بين 15 و25 لاري يومياً.
    - q: هل يمكنني إضافة سائق ثانٍ؟
      a: >-
        نعم، مقابل 20 لاري يومياً، وحتى سائقَين إضافيَّين. وعلى كل منهما استيفاء الشروط نفسها من حيث العمر
        والخبرة وتوقيع عقد الإيجار.
  - type: h2
    text: الوديعة والتأمين
  - type: faq
    items:
    - q: كم قيمة الوديعة ومتى تُعاد؟
      a: >-
        من 300 لاري (الفئة الاقتصادية) حتى 1,200 لاري (4x4). ويُحجَز المبلغ على البطاقة دون خصمه، ويُفرَج
        عنه خلال 3 أيام عمل من إعادة السيارة.
    - q: ماذا يحدث إذا تسبّبت بضرر للسيارة؟
      a: >-
        يغطّي تأمين CDW الأضرار التي تتجاوز مبلغ التحمّل. ويبلغ مبلغ التحمّل 300 لاري في الفئة الاقتصادية
        و1,200 لاري في سيارة 4x4. وإضافة SCDW (من 25 إلى 45 لاري يومياً) تخفّضه إلى الصفر.
    - q: هل يشمل التأمين الإطارات والجنوط؟
      a: >-
        لا. الإطارات والجنوط وأسفل الهيكل والمرايا والمقصورة الداخلية غير مشمولة بتأمين CDW القياسي. ويكلّف
        استبدال الإطار من 120 إلى 400 لاري.
    - q: من يدفع المخالفات المرورية؟
      a: >-
        المستأجر. وقد تصل المخالفة بعد انتهاء الإيجار بمدة تصل إلى 30 يوماً؛ وفي هذه الحالة نحتسب قيمة
        المخالفة إضافةً إلى 20 لاري رسوم معالجة.
  - type: h2
    text: القيادة والمسارات
  - type: faq
    items:
    - q: هل يمكنني القيادة إلى سفانيتي (ميستيا، أوشغولي)؟
      a: >-
        الطريق حتى ميستيا معبَّد وتصلح له جميع الفئات. أما المقطع المؤدي إلى أوشغولي فهو طريق حصوي — ولا
        يُسمح بسلوكه إلا لفئة الطرق الوعرة 4x4. والأضرار التي تقع بأي فئة أخرى غير مشمولة بالتأمين.
    - q: هل يمكن الوصول إلى توشيتي (أومالو)؟
      a: >-
        ممر أبانو مفتوح تقريباً من يونيو إلى أكتوبر ويتطلّب سيارة طرق وعرة 4x4. ويلزم اتفاق خطي مسبق،
        كما يُطبَّق على هذا المسار مبلغ تحمّل إضافي قدره 500 لاري.
    - q: كيف تكون الطرق في الشتاء؟
      a: >-
        تبقى الطرق السريعة الرئيسية (تبليسي–باتومي، تبليسي–كازبيغي) مفتوحة طوال العام، وإن كان مقطع غوداوري
        يُغلق أحياناً بسبب خطر الانهيارات الثلجية. ومن 1 ديسمبر إلى 1 أبريل تُزوَّد جميع السيارات بإطارات
        شتوية.
    - q: هل المسافة المقطوعة محدودة؟
      a: >-
        داخل جورجيا لا — المسافة غير محدودة. أما في الرحلات عبر الحدود فيُطبَّق حد يومي قدره 300 كم، ويُحتسب
        كل كيلومتر إضافي بـ 0.5 لاري.
    - q: أين أجد شاحن سيارة كهربائية؟
      a: >-
        لا توجد لدينا حالياً سيارات كهربائية في الأسطول — بل سيارات هجينة فقط لا تحتاج إلى الشحن إطلاقاً.
        فالسيارة الهجينة تعمل بالبنزين العادي.
  - type: h2
    text: الاستلام والإعادة
  - type: faq
    items:
    - q: هل يمكنني استلام السيارة من المطار؟
      a: >-
        نعم، في مطارات تبليسي وكوتايسي وباتومي. والتوصيل في تبليسي مجاني اعتباراً من 3 أيام، وفي كوتايسي
        وباتومي اعتباراً من 5 أيام. أما في الإيجارات الأقصر فالرسوم من 40 إلى 60 لاري.
    - q: هل الاستلام الليلي ممكن؟
      a: نعم، على مدار 24 ساعة. وبين الساعة 22:00 و07:00 تُضاف رسوم قدرها 40 لاري.
    - q: هل يمكنني إعادة السيارة في مدينة أخرى؟
      a: >-
        نعم. تبدأ رحلات الاتجاه الواحد على مسارات تبليسي↔كوتايسي↔باتومي من 100 لاري. أما المدن الأخرى
        فبالاتفاق المسبق.
    - q: ماذا يحدث إذا أعدت السيارة متأخراً؟
      a: >-
        التأخير حتى 2 ساعة مجاني. وبعد ذلك نحتسب ثلث التعرفة اليومية عن كل 3 ساعات بدأت؛ والتأخير الذي
        يتجاوز 8 ساعات يُحتسب يوماً إضافياً كاملاً.
    - q: كيف تتم عملية التسليم والإعادة؟
      a: >-
        نحرّر محضر تسليم موثّقاً بالصور: نصوّر جوانب السيارة الأربعة والمقصورة الداخلية وعدّاد المسافة
        ومستوى الوقود. ويُكرَّر الإجراء نفسه عند الإعادة — ما يمنع أي خلاف حول الأضرار.
  - type: h2
    text: أسئلة أخرى
  - type: faq
    items:
    - q: هل يمكنني استخدام السيارة كسيارة أجرة أو على تطبيق Bolt؟
      a: >-
        لا. الاستخدام التجاري (سيارة أجرة، توصيل طلبات، نقل بضائع) ممنوع دون موافقة خطية مسبقة، وهو يُبطِل
        تغطية التأمين.
    - q: هل يمكنني السفر مع حيوان أليف؟
      a: نعم، داخل قفص مخصّص أو مع واقٍ للمقعد. ونقل الحيوان دون قفص يستوجب رسماً قدره 100 لاري مقابل
        التنظيف الإضافي.
    - q: هل يمكنني استئجار سيارة مع سائق؟
      a: >-
        نعم. تبلغ تكلفة خدمة السائق 120 لاري في اليوم (8 ساعات)، والساعة الإضافية بـ 20 لاري. والخدمة
        متاحة لفئة رجال الأعمال والميني فان وسيارات 4x4.
    - q: هل توفّرون مقاعد أطفال؟
      a: >-
        نعم، في ثلاث فئات عمرية (0–3 و3–7 و7–12 سنة) بسعر 10 لاري يومياً. ويلزم القانون الجورجي أن يجلس
        الأطفال دون 12 سنة في مقعد أطفال مناسب.
    - q: ماذا أفعل إذا تعطّلت السيارة على الطريق؟
      a: >-
        اتصل بخطنا الساخن — فخدمة المساعدة على الطريق تعمل 24/7. وإذا كان العطل فنياً ولم يتسبّب به المستأجر،
        نوصل سيارة بديلة خلال 6 ساعات دون أي رسوم.
    - q: هل تقدّمون التأجير التمويلي أو التقسيط؟
      a: >-
        الإيجار التشغيلي طويل الأمد (من 12 إلى 36 شهراً) متاح للشركات. وهو ليس تأجيراً تمويلياً — إذ تبقى
        السيارة ضمن أصولنا وتكون الصيانة على نفقتنا.
  - type: cta
    title: لم تجد سؤالك؟
    text: اتصل بنا أو راسلنا عبر البريد الإلكتروني — وخلال ساعات العمل ستتلقّى الرد في غضون 15 دقيقة.
    actions:
    - label: اتصل بنا
      href: /contact/
    - label: الشروط
      href: /terms/
