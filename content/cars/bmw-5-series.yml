ka:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 ბენზინი · ავტომატი
  features:
  - 5 ადგილი, 3 ჩემოდანი
  - მძღოლის სერვისი ხელმისაწვდომია
  price_label: 310 ₾ / დღე
  body: >-
    კლიენტები, რომლებსაც „მეხუთე სერია" სურთ, ჩვეულებრივ სახელით ითხოვენ. ბიზნეს კატეგორიაში ეს მძღოლის
    ავტომობილია: კონკურენტებზე მკვეთრი საჭე, უკანა წამყვანი და შასი, რომელიც გუდაურსა და ყაზბეგს შორის
    მოსახვევებს სიამოვნებად აქცევს და არა გამოცდად.


    2.0 ბენზინის ძრავა დაახლოებით **7.5 ლ / 100 კმ**-ს ხარჯავს — დიზელის ალტერნატივებზე ოდნავ მეტს, და
    ეს იმ ხასიათის ფასია. ხუთი ადგილი და სამი ჩემოდანი ოჯახისთვისაც საკმარისია, თუმცა ჯავშნების უმეტესობა
    კორპორატიულია: კონფერენციები, ინვესტორების ვიზიტები, ქორწილები. საჭიროების შემთხვევაში მძღოლის სერვისიც
    ხელმისაწვდომია. დეკემბრიდან აპრილამდე ავტომობილს ზამთრის საბურავები უდგას, რაც უკანა წამყვანზე მთის
    მიმართულებით განსაკუთრებით მნიშვნელოვანია.


    ორი პრაქტიკული შენიშვნა: კლირენსი 135 მმ-ია, ამიტომ ვაკის ხელოვნურ ბარიერებსა და ეზოს შესასვლელებს
    სიფრთხილე სჭირდება, გრუნტი კი გამორიცხულია — უშგულისა და ომალოს გზები მხოლოდ მაღალი გამავლობის 4x4-ისთვისაა
    დათმობილი. ტარიფი 310 ₾ დღეში, დეპოზიტი 1 000 ₾, მძღოლი 25 წლიდან. კვირეული და თვიური ფასები — [ფასები](/pricing/).
en:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 petrol · automatic
  features:
  - 5 seats, 3 suitcases
  - Chauffeur service available
  price_label: 310 ₾ / day
  body: >-
    Clients who want the 5 Series usually ask for it by name. In our business category it is the driver's
    car: sharper steering than its rivals, rear-wheel drive, and a chassis that makes the curves between
    Gudauri and Kazbegi genuinely enjoyable rather than merely survivable.


    The 2.0 petrol engine returns roughly **7.5 l/100 km** — a little thirstier than the diesel alternatives,
    which is the price of the way it drives. Five seats and three suitcases make it practical enough for
    a family, though most bookings are corporate: conferences, investor visits, weddings. Chauffeur service
    is available if you would rather work from the back seat.


    Two practical notes. Clearance is 135 mm, so speed bumps in Vake and courtyard entrances need care,
    and gravel is out of the question — the unpaved roads to Ushguli and Omalo are reserved for the off-road
    4x4 category. The rate is 310 ₾ a day with a 1,000 ₾ deposit, and drivers must be 25 or older. Weekly
    and monthly rates are listed on [Prices](/pricing/).
ru:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 бензин · автомат
  features:
  - 5 мест, 3 чемодана
  - Доступна услуга водителя
  price_label: 310 ₾ / сутки
  body: >-
    Клиенты, которым нужна «пятёрка», обычно просят её по имени. В бизнес-категории это машина для того,
    кто любит рулить: реакции острее, чем у конкурентов, задний привод и шасси, благодаря которому повороты
    между Гудаури и Казбеги превращаются в удовольствие, а не в испытание.


    Бензиновый 2.0 расходует примерно **7.5 л / 100 км** — чуть больше дизельных альтернатив, и это плата
    за характер. Пять мест и три чемодана вполне годятся для семьи, хотя основная часть броней корпоративная:
    конференции, визиты инвесторов, свадьбы. При желании — с нашим водителем, чтобы работать на заднем
    сиденье.


    Два практических момента. Клиренс 135 мм: «лежачие полицейские» в Ваке и въезды во дворы требуют аккуратности,
    а грунт исключён совсем — дороги к Ушгули и Омало отданы только категории 4x4. Тариф 310 ₾ в сутки,
    депозит 1 000 ₾, водитель от 25 лет. Недельные и месячные цены — на [Цены](/pricing/).
fa:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 بنزینی · اتوماتیک
  features:
  - 5 صندلی، 3 چمدان
  - امکان اجاره با راننده
  price_label: 310 ₾ / روز
  body: >-
    مشتریانی که سری 5 می‌خواهند معمولاً آن را با نام صدا می‌زنند. در دسته بیزنس ما این خودروی راننده است:
    فرمانی دقیق‌تر از رقبا، دیفرانسیل عقب و شاسی‌ای که پیچ‌های میان گودائوری و کازبگی را به‌جای تحمل کردن،
    لذت‌بخش می‌کند.


    موتور 2.0 بنزینی حدود **7.5 لیتر در 100 کیلومتر** مصرف می‌کند — کمی پرمصرف‌تر از گزینه‌های دیزلی،
    که بهای همین شیوه رانندگی است. پنج صندلی و سه چمدان برای یک خانواده هم به اندازه کافی کاربردی است،
    هرچند بیشتر رزروها شرکتی‌اند: کنفرانس، بازدید سرمایه‌گذاران، عروسی. اگر ترجیح می‌دهید از صندلی عقب
    کار کنید، خودرو با راننده هم در دسترس است.


    دو نکته عملی. ارتفاع از زمین 135 میلی‌متر است، پس سرعت‌گیرهای واکه و ورودی حیاط‌ها دقت می‌خواهند و
    جاده خاکی اصلاً مطرح نیست — مسیرهای بی‌آسفالت اوشگولی و اومالو مخصوص دسته آفرود 4x4 است. نرخ روزی
    310 ₾ با ودیعه 1,000 ₾ است و سن راننده باید 25 سال یا بیشتر باشد. نرخ‌های هفتگی و ماهانه در صفحه [قیمت‌ها](/pricing/)
    فهرست شده است.
he:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 בנזין · אוטומט
  features:
  - 5 מקומות, 3 מזוודות
  - שירות נהג זמין
  price_label: 310 ₾ / יום
  body: >-
    לקוחות שרוצים את סדרה 5 בדרך כלל מבקשים אותה בשמה. בקטגוריית העסקים שלנו זו מכונית הנהג: הגה חד יותר
    מהמתחרות, הנעה אחורית ומרכב שהופך את הפיתולים בין גודאורי לקזבגי למהנים באמת ולא רק לנסבלים.


    מנוע 2.0 בנזין צורך כ-**7.5 ליטר ל-100 ק"מ** — מעט יותר מחלופות הדיזל, וזה המחיר של אופי הנהיגה. חמישה
    מקומות ושלוש מזוודות מספיקים גם למשפחה, אף שרוב ההזמנות הן עסקיות: כנסים, ביקורי משקיעים, חתונות.
    אם אתם מעדיפים לעבוד מהמושב האחורי, אפשר להזמין גם נהג.


    שתי הערות מעשיות. מרווח הגחון הוא 135 מ"מ, ולכן פסי האטה בוואקה וכניסות לחצרות דורשים זהירות, וחצץ
    אינו בא בחשבון כלל — הדרכים הלא סלולות לאושגולי ולאומאלו שמורות לקטגוריית השטח 4x4. התעריף 310 ₾ ליום
    עם פיקדון של 1,000 ₾, וגיל הנהגים 25 ומעלה. תעריפים שבועיים וחודשיים מופיעים בעמוד [מחירים](/pricing/).
ar:
  name: BMW 5 Series
  summary: 2019–2022 · 2.0 بنزين · أوتوماتيك
  features:
  - 5 مقاعد، 3 حقائب
  - خدمة سائق متاحة
  price_label: 310 ₾ / يوم
  body: >-
    العملاء الذين يريدون الفئة الخامسة يطلبونها عادةً بالاسم. ففي فئتنا لرجال الأعمال هي سيارة السائق:
    توجيه أدق من منافساتها، ودفع خلفي، وهيكل يجعل المنعطفات بين غودواري وكازبيغي ممتعة فعلاً لا محتملة
    فحسب.


    يستهلك محرك 2.0 بنزين نحو **7.5 لتر لكل 100 كم** — أكثر قليلاً من بدائل الديزل، وهذا ثمن أسلوب قيادتها.
    وخمسة مقاعد وثلاث حقائب تكفي عملياً لعائلة، وإن كان معظم الحجوزات من الشركات: مؤتمرات، وزيارات مستثمرين،
    وأعراس. وإن كنت تفضّل العمل من المقعد الخلفي، فخدمة السائق متاحة.


    ملاحظتان عمليتان. الارتفاع عن الأرض 135 مم، لذا تتطلب مطبّات فاكي ومداخل الأفنية بعض الحذر، والطرق
    الترابية خارج الحساب تماماً — فالدروب غير المعبدة إلى أوشغولي وأومالو محجوزة لفئة الطرق الوعرة 4x4.
    السعر 310 ₾ يومياً مع تأمين 1,000 ₾، وعلى السائقين أن يكونوا في سن 25 عاماً أو أكثر. أما التعرفتان
    الأسبوعية والشهرية فمذكورتان في صفحة [الأسعار](/pricing/).
