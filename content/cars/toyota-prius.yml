ka:
  name: Toyota Prius (ჰიბრიდი)
  summary: 2018–2022 · 1.8 ჰიბრიდი · ავტომატი
  features:
  - 5 ადგილი, 2 ჩემოდანი
  - საწვავი ~4.5 ლ / 100 კმ
  - კონდიციონერი, კამერა
  price_label: 75 ₾ / დღე
  body: >-
    პრიუსი ის ავტომობილია, რომელსაც კლიენტების უმეტესობა საქართველოში პირველი მოგზაურობისთვის ირჩევს —
    მიზეზი კი მარტივია: საწვავი. შერეულ რეჟიმში ხარჯი **4.5 ლ / 100 კმ**-ის ფარგლებშია, ამიტომ თბილისი–ბათუმის
    მარშრუტი (370 კმ) დაახლოებით 55 ლარის ბენზინად ჯდება, ხოლო ქალაქის საცობებში ჰიბრიდი თითქმის უხარჯოდ
    მოძრაობს — დაბალ სიჩქარეზე ელექტროძრავა მუშაობს.


    ხუთადგილიან სალონში ორი დიდი ჩემოდანი თავისუფლად ეტევა: წყვილი ან სამსულიანი ოჯახი კომფორტულად მგზავრობს,
    ოთხი ზრდასრული ბარგით უკვე შევიწროვდება. კლირენსი 145 მმ-ია — სავსებით საკმარისი ასფალტიანი მიმართულებებისთვის:
    კახეთი, ბორჯომი, ქუთაისი, ყაზბეგის მაგისტრალი. გრუნტოვანი გზები კი გამორიცხულია: უშგულისა და ომალოს
    მონაკვეთებზე მოძრაობა მხოლოდ მაღალი გამავლობის 4x4 კატეგორიითაა ნებადართული, წინაწამყვანი ავტომობილით
    მიღებული დაზიანება დაზღვევით არ იფარება.


    ჰიბრიდს დატენვა არ სჭირდება — ის ჩვეულებრივ ბენზინზე მუშაობს, ამიტომ რეგიონებში დამტენის ძებნა არ
    მოგიწევთ. დეპოზიტი 300 ₾-ია, მძღოლი 21 წლიდან, გარბენი კი საქართველოს ტერიტორიაზე შეუზღუდავია. დღეში
    75 ₾ ჩვენს პარკში ყველაზე იაფი ვარიანტია მთელი კვირით ავტომობილის შესანარჩუნებლად; კვირეული ტარიფი
    [ფასები](/pricing/) გვერდზეა.
en:
  name: Toyota Prius (hybrid)
  summary: 2018–2022 · 1.8 hybrid · automatic
  features:
  - 5 seats, 2 suitcases
  - Fuel ~4.5 l / 100 km
  - Air conditioning, rear camera
  price_label: 75 ₾ / day
  body: >-
    The Prius is the car most of our customers end up choosing for a first trip around Georgia, and the
    reason is simple: fuel. In mixed driving the hybrid drivetrain sits at around **4.5 l/100 km**, which
    turns the Tbilisi–Batumi run (370 km) into roughly 55 ₾ of petrol, and city traffic costs almost nothing
    because the electric motor does most of the work at low speed.


    It is a five-seat hatchback with room for two large suitcases, so a couple or a family of three travels
    comfortably; four adults with luggage will feel tight. Ground clearance is 145 mm — fine for asphalt
    routes such as Kakheti, Borjomi, Kutaisi and the highway towards Kazbegi, but not for gravel. The
    unpaved sections to Ushguli in Svaneti and Omalo in Tusheti are open only to the off-road 4x4 category,
    and damage taken there in a front-wheel-drive car is not covered by insurance.


    At 75 ₾ a day this is also the cheapest way to keep a car for a whole week — the weekly rate is on
    [Prices](/pricing/).
ru:
  name: Toyota Prius (гибрид)
  summary: 2018–2022 · 1.8 гибрид · автомат
  features:
  - 5 мест, 2 чемодана
  - Расход ~4.5 л / 100 км
  - Кондиционер, камера
  price_label: 75 ₾ / сутки
  body: >-
    Prius — самый частый выбор тех, кто впервые едет по Грузии на арендованной машине, и причина одна:
    расход. В смешанном режиме гибрид укладывается в **4.5 л / 100 км**, поэтому маршрут Тбилиси–Батуми
    (370 км) обходится примерно в 55 лари бензина, а в тбилисских пробках машина почти не ест — на малой
    скорости работает электромотор.


    Салон рассчитан на пятерых, в багажник входят два больших чемодана: паре или семье из трёх человек
    комфортно, четверым взрослым с вещами уже тесно. Клиренс 145 мм — этого достаточно для асфальта: Кахетия,
    Боржоми, Кутаиси, трасса на Казбеги. А вот грунт исключён: участки до Ушгули в Сванетии и до Омало
    в Тушетии открыты только для категории внедорожников 4x4, и повреждения переднеприводной машины на
    грунтовке страховка не покрывает.


    При тарифе 75 ₾ в сутки это самый бюджетный способ держать машину целую неделю — недельная цена указана
    на [Цены](/pricing/).
fa:
  name: Toyota Prius (هیبریدی)
  summary: 2018–2022 · 1.8 هیبریدی · اتوماتیک
  features:
  - 5 صندلی، 2 چمدان
  - مصرف سوخت ~4.5 لیتر / 100 کیلومتر
  - کولر، دوربین دنده عقب
  price_label: 75 ₾ / روز
  body: >-
    پریوس همان خودرویی است که بیشتر مشتریان ما برای نخستین سفرشان به گرجستان انتخاب می‌کنند و دلیلش ساده
    است: سوخت. در رانندگی ترکیبی، سیستم هیبریدی حدود **4.5 لیتر در 100 کیلومتر** مصرف می‌کند؛ یعنی مسیر
    تفلیس–باتومی (370 کیلومتر) تقریباً 55 ₾ بنزین می‌خواهد و ترافیک شهری تقریباً هزینه‌ای ندارد، چون در
    سرعت‌های پایین موتور برقی بیشتر کار را انجام می‌دهد.


    این هاچ‌بک پنج‌سرنشین جای دو چمدان بزرگ دارد، پس یک زوج یا خانواده سه‌نفره راحت سفر می‌کند؛ چهار بزرگسال
    با بار احساس تنگی خواهند کرد. ارتفاع از زمین 145 میلی‌متر است — مناسب مسیرهای آسفالت مانند کاختی،
    بورجومی، کوتایسی و بزرگراه کازبگی، اما نه جاده خاکی. مسیرهای خاکی اوشگولی در سوانتی و اومالو در توشتی
    تنها به روی دسته آفرود 4x4 باز است و خسارت خودروی دیفرانسیل‌جلو در آن مسیرها بیمه نمی‌شود.


    با روزی 75 ₾، این ارزان‌ترین راه برای در اختیار داشتن خودرو در تمام یک هفته هم هست — نرخ هفتگی در
    صفحه [قیمت‌ها](/pricing/) آمده است.
he:
  name: Toyota Prius (היברידי)
  summary: 2018–2022 · 1.8 היברידי · אוטומט
  features:
  - 5 מקומות, 2 מזוודות
  - צריכת דלק ~4.5 ליטר / 100 ק"מ
  - מיזוג אוויר, מצלמת רוורס
  price_label: 75 ₾ / יום
  body: >-
    הפריוס הוא הרכב שרוב הלקוחות שלנו בוחרים לטיול הראשון בגאורגיה, והסיבה פשוטה: דלק. בנסיעה משולבת המערכת
    ההיברידית עומדת על כ-**4.5 ליטר ל-100 ק"מ**, כך שהמסלול טביליסי–בטומי (370 ק"מ) עולה בערך 55 ₾ בנזין,
    והפקקים בעיר כמעט אינם עולים דבר, משום שבמהירות נמוכה המנוע החשמלי עושה את רוב העבודה.


    זו מכונית האצ'בק בת חמישה מקומות עם מקום לשתי מזוודות גדולות, ולכן זוג או משפחה של שלושה נוסעים בנוחות,
    בעוד ארבעה מבוגרים עם מטען כבר יחושו צפופים. מרווח הגחון הוא 145 מ"מ — מצוין לכבישי אספלט כמו קחתי,
    בורג'ומי, קוטאיסי והכביש לכיוון קזבגי, אך לא לחצץ. הקטעים הלא סלולים לאושגולי שבסוואנטי ולאומאלו שבתושתי
    פתוחים רק לקטגוריית השטח 4x4, ונזק שנגרם שם ברכב עם הנעה קדמית אינו מכוסה בביטוח.


    ב-75 ₾ ליום זו גם הדרך הזולה ביותר להחזיק רכב שבוע שלם — התעריף השבועי מופיע בעמוד [מחירים](/pricing/).
ar:
  name: Toyota Prius (هجين)
  summary: 2018–2022 · 1.8 هجين · أوتوماتيك
  features:
  - 5 مقاعد، 2 حقيبة
  - استهلاك الوقود ~4.5 لتر / 100 كم
  - مكيّف هواء، كاميرا خلفية
  price_label: 75 ₾ / يوم
  body: >-
    سيارة Prius هي ما ينتهي معظم عملائنا إلى اختياره لأول جولة في جورجيا، والسبب بسيط: الوقود. ففي القيادة
    المختلطة يستقر النظام الهجين عند نحو **4.5 لتر لكل 100 كم**، ما يجعل طريق تبليسي–باتومي (370 كم) يكلف
    نحو 55 ₾ من البنزين، أما زحام المدينة فلا يكاد يكلف شيئاً لأن المحرك الكهربائي يتولى معظم العمل عند
    السرعات المنخفضة.


    إنها سيارة هاتشباك بخمسة مقاعد تتسع لحقيبتين كبيرتين، فيسافر زوجان أو أسرة من ثلاثة أفراد بارتياح،
    بينما يشعر أربعة بالغين مع أمتعتهم بالضيق. ارتفاعها عن الأرض 145 مم — مناسب للطرق المعبدة مثل كاخيتي
    وبورجومي وكوتايسي والطريق السريع نحو كازبيغي، لكنه لا يصلح للدروب الترابية. فالمقاطع غير المعبدة إلى
    أوشغولي في سفانيتي وأومالو في توشيتي مفتوحة لفئة الطرق الوعرة 4x4 وحدها، والأضرار التي تقع هناك لسيارة
    بدفع أمامي لا يغطيها التأمين.


    وبسعر 75 ₾ يومياً، هذه أيضاً أرخص وسيلة للاحتفاظ بسيارة أسبوعاً كاملاً — والتعرفة الأسبوعية مذكورة
    في صفحة [الأسعار](/pricing/).
