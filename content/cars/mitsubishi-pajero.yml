ka:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 ბენზინი · 4WD
  features:
  - 5–7 ადგილი
  - კლირენსი 235 მმ
  - სუპერ-სელექტ 4WD
  price_label: 240 ₾ / დღე
  body: >-
    პარკში ყველაზე მაღალი კლირენსი პაჯეროს აქვს — 235 მმ, ხოლო Super Select 4WD სისტემა გაჩერების გარეშე
    გაძლევთ საშუალებას გადახვიდეთ უკანა წამყვანიდან მუდმივ სრულ წამყვანზე და ცენტრალური დიფერენციალის
    ბლოკირებაზე. აბანოს უღელტეხილის ღარტაფებიან მონაკვეთზე ან შატილისკენ ასვლისას სწორედ ეს მოქნილობა
    განასხვავებს მართვას ცოცვისგან.


    საწვავზე რეალისტური იყავით: 3.0 ბენზინი დაახლოებით **12.5 ლ / 100 კმ**-ს ხარჯავს, მთაში კი მეტს —
    ეს გრძელი მარშრუტის დაგეგმვამდე გასათვალისწინებელია. სამაგიეროდ პაჯერო მაღალი გამავლობის კატეგორიაში
    ყველაზე იაფი შესვლაა, დღეში 240 ₾, რაც ხუთსულიანი ჯგუფისთვის კარგი გარიგებაა.


    შვიდი ადგილი ხელმისაწვდომია, ოთხი ჩემოდანი ბოლო რიგის დაკეცვით ეტევა, დეპოზიტი 1 200 ₾-ია, მძღოლი
    — 25 წლიდან. პაჯეროს ხშირად ლაშქრობისა და თევზაობის ჯგუფები იღებენ: აღჭურვილობისთვის ადგილი ბევრია,
    გარბენი კი ქვეყნის შიგნით შეუზღუდავია. როგორც ამ კატეგორიის ყველა ავტომობილზე, თუშეთი წინასწარ წერილობით
    შეთანხმებას და დამატებით ფრანშიზას საჭიროებს; პირობები [კითხვები](/faq/) გვერდზეა.
en:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 petrol · 4WD
  features:
  - 5–7 seats
  - Ground clearance 235 mm
  - Super Select 4WD
  price_label: 240 ₾ / day
  body: >-
    The highest ground clearance in our fleet belongs to the Pajero — 235 mm — and its Super Select 4WD
    system lets you move between rear drive, full-time four-wheel drive and a locked centre differential
    without stopping. On the washboard sections of the Abano Pass or the climb towards Shatili, that flexibility
    is the difference between driving and crawling.


    Be realistic about fuel. The 3.0 petrol engine uses around **12.5 l/100 km**, and more in the mountains;
    budget for it before you commit to a long itinerary. Against that, the Pajero is the cheapest entry
    into the off-road 4x4 category at 240 ₾ a day, which makes it good value for a group of five sharing
    the cost.


    Seven seats are available, four suitcases fit with the rear row down, the deposit is 1,200 ₾ and the
    minimum driver age is 25. As with every vehicle in this category, Tusheti requires prior written agreement
    and an additional excess — the conditions are set out on [FAQ](/faq/).
ru:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 бензин · 4WD
  features:
  - 5–7 мест
  - Клиренс 235 мм
  - Super Select 4WD
  price_label: 240 ₾ / сутки
  body: >-
    Самый высокий клиренс в парке — у Pajero, 235 мм, а система Super Select 4WD позволяет на ходу переключаться
    между задним приводом, постоянным полным и заблокированным центральным дифференциалом. На гребёнке
    перевала Абано или на подъёме к Шатили именно эта гибкость отличает нормальную езду от ползания.


    К расходу отнеситесь трезво: бензиновый 3.0 тратит около **12.5 л / 100 км**, в горах больше — заложите
    это в бюджет до того, как согласуете длинный маршрут. Зато Pajero — самый дешёвый вход во внедорожную
    категорию, 240 ₾ в сутки, и для компании из пяти человек это выгодно.


    Доступны семь мест, четыре чемодана помещаются со сложенным задним рядом, депозит 1 200 ₾, водитель
    от 25 лет. Как и для любой машины этой категории, Тушетия требует предварительного письменного согласования
    и дополнительной франшизы — условия описаны на [Вопросы](/faq/).
fa:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 بنزینی · 4WD
  features:
  - 5–7 صندلی
  - ارتفاع از زمین 235 میلی‌متر
  - سیستم Super Select 4WD
  price_label: 240 ₾ / روز
  body: >-
    بالاترین ارتفاع از زمین در ناوگان ما به پاجرو تعلق دارد — 235 میلی‌متر — و سیستم Super Select 4WD
    آن اجازه می‌دهد بدون توقف میان دیفرانسیل عقب، چهار چرخ محرک دائم و دیفرانسیل مرکزی قفل‌شده جابه‌جا
    شوید. در بخش‌های موج‌دار گردنه آبانو یا در سربالایی شاتیلی، همین انعطاف فرق میان رانندگی و خزیدن است.


    درباره سوخت واقع‌بین باشید. موتور 3.0 بنزینی حدود **12.5 لیتر در 100 کیلومتر** مصرف می‌کند و در کوهستان
    بیشتر؛ پیش از تعهد به یک برنامه طولانی آن را در بودجه بیاورید. در مقابل، پاجرو با روزی 240 ₾ ارزان‌ترین
    ورودی به دسته آفرود 4x4 است و همین آن را برای گروهی پنج‌نفره که هزینه را تقسیم می‌کنند بسیار به‌صرفه
    می‌کند.


    هفت صندلی در دسترس است، با خواباندن ردیف عقب چهار چمدان جا می‌شود، ودیعه 1,200 ₾ و حداقل سن راننده
    25 سال است. مانند هر خودروی این دسته، توشتی به توافق کتبی پیشین و فرانشیز اضافی نیاز دارد — شرایط
    در صفحه [پرسش‌های متداول](/faq/) آمده است.
he:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 בנזין · 4WD
  features:
  - 5–7 מקומות
  - מרווח גחון 235 מ"מ
  - מערכת Super Select 4WD
  price_label: 240 ₾ / יום
  body: >-
    מרווח הגחון הגבוה ביותר בצי שלנו שייך לפאג'רו — 235 מ"מ — ומערכת Super Select 4WD מאפשרת לעבור בין
    הנעה אחורית, הנעה כפולה קבועה ודיפרנציאל מרכזי נעול בלי לעצור. בקטעים המשוננים של מעבר אבאנו או בעלייה
    לשאטילי, הגמישות הזאת היא ההבדל בין נהיגה לזחילה.


    לגבי דלק כדאי להיות מציאותיים. מנוע 3.0 בנזין צורך כ-**12.5 ליטר ל-100 ק"מ**, ויותר בהרים; תקצבו זאת
    לפני שאתם מתחייבים למסלול ארוך. מנגד, הפאג'רו הוא הכניסה הזולה ביותר לקטגוריית השטח 4x4 ב-240 ₾ ליום,
    מה שהופך אותו למשתלם במיוחד לחמישה שמתחלקים בעלות.


    יש בו שבעה מקומות, ארבע מזוודות נכנסות כששורת המושבים האחורית מקופלת, הפיקדון 1,200 ₾ וגיל הנהג המינימלי
    25. כמו בכל רכב בקטגוריה הזאת, תושתי מחייבת הסכמה בכתב מראש והשתתפות עצמית נוספת — התנאים מפורטים
    בעמוד [שאלות נפוצות](/faq/).
ar:
  name: Mitsubishi Pajero
  summary: 2015–2020 · 3.0 بنزين · 4WD
  features:
  - 5–7 مقاعد
  - ارتفاع عن الأرض 235 مم
  - نظام Super Select 4WD
  price_label: 240 ₾ / يوم
  body: >-
    أعلى ارتفاع عن الأرض في أسطولنا من نصيب باجيرو — 235 مم — ويتيح لك نظام Super Select 4WD التنقل بين
    الدفع الخلفي والدفع الرباعي الدائم وقفل الترس التفاضلي الأوسط دون التوقف. وعلى المقاطع المموّجة من
    ممر أبانو أو في الصعود نحو شاتيلي، تصنع هذه المرونة الفارق بين القيادة والزحف.


    كن واقعياً بشأن الوقود. فمحرك 3.0 بنزين يستهلك نحو **12.5 لتر لكل 100 كم**، وأكثر في الجبال؛ ضع ذلك
    في ميزانيتك قبل أن تلتزم ببرنامج طويل. في المقابل، باجيرو هي أرخص مدخل إلى فئة الطرق الوعرة 4x4 بسعر
    240 ₾ يومياً، ما يجعلها خياراً مجزياً لمجموعة من خمسة يتقاسمون التكلفة.


    سبعة مقاعد متاحة، وأربع حقائب تتسع عند طي الصف الخلفي، والتأمين 1,200 ₾، والحد الأدنى لسن السائق 25
    عاماً. وكما هي الحال مع كل مركبة في هذه الفئة، تتطلب توشيتي موافقة خطية مسبقة وتحمّلاً إضافياً — والشروط
    موضحة في صفحة [الأسئلة الشائعة](/faq/).
