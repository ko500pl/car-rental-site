ka:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 დიზელი · მექანიკა
  features:
  - 3 ადგილი, 14 მ³
  - ტვირთამწეობა 1500 კგ
  price_label: 215 ₾ / დღე
  body: >-
    როცა თერთმეტი კუბი აღარ გყოფნით, შემდეგი საფეხური სპრინტერია: **14 მ³** სატვირთო მოცულობა და 1 500
    კგ ტვირთამწეობა — ეს ერთ რეისში სრული ბინის გადატანას ან საწყობის შევსებას ჰყოფნის. უკანა წამყვანი
    სწორედ დატვირთული ფურგონის ლოგიკაა: რაც მეტი წონაა, მით უკეთესია ჩაჭიდება და არა პირიქით.


    ხარჯი დატვირთვის მიხედვით დაახლოებით **10.5 ლ / 100 კმ**-ია, მექანიკური კოლოფი კი სწორედ იმ გრძელი
    მაგისტრალური რეისებისთვისაა მოსახერხებელი, რისთვისაც სპრინტერს ჩვეულებრივ იღებენ: მიწოდება ბათუმში,
    ფოთის პორტი, საგამოფენო ტვირთი. კაბინაში სამი ადგილია, ანუ ბრიგადა და ტვირთი ერთ რეისში ეტევა.


    დაჯავშნამდე ორი პრაქტიკული დეტალი. ავტომობილი მაღალია — მიწისქვეშა პარკინგები და ეზოს ზოგიერთი თაღი
    მისთვის დახურულია, ამიტომ ცენტრში დატვირთვისას მარშრუტი წინასწარ შეამოწმეთ. ტვირთი უნდა დაამაგროთ:
    სატვირთო განყოფილების დაზიანება სტანდარტული დაფარვით მოქირავნის პასუხისმგებლობაა. ერთი თვიდან კორპორატიული
    ხელშეკრულება ბრენდირების უფლებით დღიურ 215 ₾-ს მკვეთრად ამცირებს — ცხრილი [ფასები](/pricing/) გვერდზეა.
en:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 diesel · manual
  features:
  - 3 seats, 14 m³
  - Payload 1,500 kg
  price_label: 215 ₾ / day
  body: >-
    When eleven cubic metres runs out, the Sprinter is the next step up: **14 m³** of load volume and
    a payload of 1,500 kg, enough for a full apartment move or a pallet and a half of stock in a single
    run. Rear-wheel drive is the right layout for a van that spends its life loaded — traction improves
    as the weight goes on, rather than the opposite.


    Fuel comes in at around **10.5 l/100 km** depending on the load, and the manual gearbox suits the
    long motorway hauls this van is usually booked for: deliveries to Batumi, runs to the port at Poti,
    exhibition freight.


    Two practical points before you book. It is tall, so underground car parks and some courtyard arches
    are closed to it — check the route if you are loading in central Tbilisi. Cargo must be strapped down,
    because damage to the load compartment stays with the renter under the standard cover. A corporate
    contract from one month, with branding permitted, brings the 215 ₾ daily rate down considerably —
    the schedule is on [Prices](/pricing/).
ru:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 дизель · механика
  features:
  - 3 места, 14 м³
  - Грузоподъёмность 1500 кг
  price_label: 215 ₾ / сутки
  body: >-
    Когда одиннадцати кубов уже мало, следующая ступень — Sprinter: **14 м³** грузового объёма и 1 500
    кг грузоподъёмности, чего хватает на полный переезд квартиры или на пополнение склада за один рейс.
    Задний привод здесь логичен: у гружёного фургона сцепление улучшается по мере роста массы, а не наоборот.


    Расход в зависимости от загрузки около **10.5 л / 100 км**, а механическая коробка удобна как раз
    для тех дальних магистральных рейсов, ради которых Sprinter обычно и берут: доставка в Батуми, порт
    Поти, выставочные грузы.


    Два практических момента перед бронированием. Машина высокая — подземные паркинги и часть дворовых
    арок для неё закрыты, поэтому маршрут погрузки в центре Тбилиси проверьте заранее. Груз обязательно
    крепите: повреждения грузового отсека по стандартному покрытию остаются на арендаторе. Корпоративный
    договор от одного месяца с правом брендирования заметно снижает суточные 215 ₾ — тарифная сетка на
    [Цены](/pricing/).
fa:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 دیزلی · دنده‌ای
  features:
  - 3 صندلی، 14 متر مکعب
  - ظرفیت بار 1,500 کیلوگرم
  price_label: 215 ₾ / روز
  body: >-
    وقتی یازده متر مکعب کم می‌آورد، اسپرینتر پله بعدی است: **14 متر مکعب** فضای بار و ظرفیت 1,500 کیلوگرم،
    کافی برای اسباب‌کشی یک آپارتمان کامل یا یک‌ونیم پالت کالا در یک نوبت. دیفرانسیل عقب چیدمان درستی برای
    ونی است که عمرش را با بار می‌گذراند — با افزوده شدن وزن، چسبندگی بهتر می‌شود، نه برعکس.


    مصرف سوخت بسته به بار حدود **10.5 لیتر در 100 کیلومتر** است و گیربکس دستی دقیقاً با همان مسیرهای طولانی
    بزرگراهی جور درمی‌آید که این ون معمولاً برایشان رزرو می‌شود: تحویل بار به باتومی، سفر به بندر پوتی،
    حمل تجهیزات نمایشگاهی.


    پیش از رزرو دو نکته عملی. این خودرو بلند است، پس پارکینگ‌های زیرزمینی و برخی طاق‌های ورودی حیاط به
    رویش بسته‌اند — اگر در مرکز تفلیس بار می‌زنید مسیر را بررسی کنید. بار باید مهار شود، چون در پوشش استاندارد
    خسارت محفظه بار بر عهده مستأجر می‌ماند. قرارداد شرکتی از یک ماه به بالا، با اجازه برندینگ، نرخ روزانه
    215 ₾ را به‌طور محسوس پایین می‌آورد — جدول در صفحه [قیمت‌ها](/pricing/) است.
he:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 דיזל · ידני
  features:
  - 3 מקומות, 14 מ"ק
  - כושר העמסה 1,500 ק"ג
  price_label: 215 ₾ / יום
  body: >-
    כשאחד-עשר מטרים מעוקבים נגמרים, הספרינטר הוא הצעד הבא: **14 מ"ק** נפח העמסה וכושר נשיאה של 1,500 ק"ג
    — מספיק להעברת דירה שלמה או למשלוח של פלטה וחצי בנסיעה אחת. הנעה אחורית היא הפריסה הנכונה לוואן שמבלה
    את חייו עמוס: האחיזה משתפרת ככל שהמשקל עולה, ולא להפך.


    צריכת הדלק עומדת על כ-**10.5 ליטר ל-100 ק"מ** תלוי במטען, ותיבת ההילוכים הידנית מתאימה בדיוק לנסיעות
    הבין-עירוניות הארוכות שלשמן מזמינים אותו: משלוחים לבטומי, נסיעות לנמל פוטי, הובלת תערוכות.


    שתי נקודות מעשיות לפני ההזמנה. הוא גבוה, ולכן חניונים תת-קרקעיים וחלק מקשתות הכניסה לחצרות סגורים
    בפניו — בדקו את המסלול אם אתם מעמיסים במרכז טביליסי. את המטען חובה לקשור, משום שנזק לתא המטען נשאר
    באחריות השוכר בכיסוי הסטנדרטי. חוזה עסקי מחודש ומעלה, עם היתר למיתוג על המרכב, מוריד את התעריף היומי
    של 215 ₾ במידה ניכרת — הטבלה בעמוד [מחירים](/pricing/).
ar:
  name: Mercedes-Benz Sprinter
  summary: 2018–2022 · 2.1 ديزل · يدوي
  features:
  - 3 مقاعد، 14 م³
  - حمولة 1,500 كغ
  price_label: 215 ₾ / يوم
  body: >-
    حين تنفد أحد عشر متراً مكعباً، يأتي سبرنتر خطوةً تالية: **14 م³** من حجم التحميل وحمولة 1,500 كغ،
    تكفي لنقل شقة كاملة أو منصة ونصف من البضاعة في رحلة واحدة. والدفع الخلفي هو التصميم الصحيح لمركبة
    تقضي حياتها محمّلة — إذ يتحسن التماسك كلما زاد الوزن، لا العكس.


    يبلغ استهلاك الوقود نحو **10.5 لتر لكل 100 كم** بحسب الحمولة، ويناسب ناقل الحركة اليدوي رحلات الطرق
    السريعة الطويلة التي تُحجز هذه المركبة لها عادة: التوصيل إلى باتومي، والرحلات إلى ميناء بوتي، ونقل
    معدات المعارض.


    نقطتان عمليتان قبل الحجز. إنها مرتفعة، لذا تُغلق أمامها مواقف السيارات تحت الأرض وبعض أقواس مداخل
    الأفنية — تحقق من المسار إن كنت تحمّل في وسط تبليسي. ويجب تثبيت الحمولة بالأحزمة، لأن الضرر الذي يلحق
    بحيز الشحن يبقى على عاتق المستأجر في التغطية القياسية. وعقد الشركات ابتداءً من شهر واحد، مع السماح
    بوضع علامتك التجارية، يخفض سعر 215 ₾ اليومي بقدر كبير — والجدول في صفحة [الأسعار](/pricing/).
