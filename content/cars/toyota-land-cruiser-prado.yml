ka:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 დიზელი · 4WD
  features:
  - 5–7 ადგილი
  - კლირენსი 220 მმ
  - დაბალი გადაცემა, დიფ. ბლოკირება
  price_label: 330 ₾ / დღე
  body: >-
    თუ მარშრუტში უშგული ან ომალოა, პრადოს პირველ რიგში გირჩევთ. 220 მმ კლირენსი, დაბალი გადაცემა და დიფერენციალის
    ბლოკირება მას სრულად რთავს ნებას ენგურის ხეობის ხრეშიან გზაზე და თუშეთისკენ აბანოს უღელტეხილზე — ეს
    მარშრუტი დაახლოებით ივნისიდან ოქტომბრამდეა ღია, წინასწარ წერილობით შეთანხმებას მოითხოვს და დამატებითი
    ფრანშიზა ახლავს.


    2.8 დიზელი ის მიზეზია, რის გამოც ორკვირიან მოგზაურობებზე სწორედ პრადოს იღებენ: ამ ზომის ავტომობილისთვის
    დაახლოებით **9.5 ლ / 100 კმ** და ისეთი მარაგი, რომ სოფლის დახურულ გასამართ სადგურზე ნერვიულობა აღარ
    გიწევთ. შვიდი ადგილი, როცა საჭიროა; ოთხი ჩემოდანი, როცა ბოლო რიგს დაკეცავთ.


    - მუდმივი 4WD, დაბალი გადაცემა, ბლოკირება

    - დეპოზიტი 1 200 ₾, მძღოლი 25 წლიდან

    - ზამთრის საბურავები დეკემბრიდან აპრილამდე


    დღეში 330 ₾ ჩვენს პარკში ყველაზე მაღალი ტარიფია, მაგრამ მაღალმთისთვის ეს ის ავტომობილია, რომელზეც
    დაზღვევა რეალურად მოქმედებს. მარშრუტის პირობები — [პირობები](/terms/).
en:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 diesel · 4WD
  features:
  - 5–7 seats
  - Ground clearance 220 mm
  - Low range, diff lock
  price_label: 330 ₾ / day
  body: >-
    If your route includes Ushguli or Omalo, the Prado is the car we recommend first. With 220 mm of clearance,
    low-range gearing and a locking differential it is fully cleared for the gravel road up the Enguri
    valley and for the Abano Pass into Tusheti — a route that opens roughly from June to October, needs
    written agreement in advance and carries an additional excess.


    The 2.8 diesel is why people take it for two-week trips: about **9.5 l/100 km** for a body this size,
    and enough range to remove the worry of a village filling station being closed. Seven seats when you
    need them, four suitcases once the rear row is folded.


    - Full-time 4WD, low range, differential lock

    - Deposit 1,200 ₾, minimum driver age 25

    - Winter tyres fitted from December to April


    At 330 ₾ a day it carries the highest rate in the fleet, but for the high mountains it is the vehicle
    on which the insurance actually applies. Route conditions are on [Terms](/terms/).
ru:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 дизель · 4WD
  features:
  - 5–7 мест
  - Клиренс 220 мм
  - Пониженная передача, блокировка диф.
  price_label: 330 ₾ / сутки
  body: >-
    Если в маршруте есть Ушгули или Омало, Prado мы советуем в первую очередь. Клиренс 220 мм, пониженная
    передача и блокировка дифференциала полностью допускают его на гравийную дорогу вдоль Ингури и на
    перевал Абано в Тушетию — этот маршрут открыт примерно с июня по октябрь, требует предварительного
    письменного согласования и дополнительной франшизы.


    Дизель 2.8 — причина, по которой Prado берут на двухнедельные поездки: около **9.5 л / 100 км** для
    машины таких габаритов и запас хода, снимающий тревогу за закрытую заправку в горном селе. Семь мест,
    когда они нужны; четыре чемодана, когда задний ряд сложен.


    - Постоянный полный привод, пониженная, блокировка

    - Депозит 1 200 ₾, водитель от 25 лет

    - Зимняя резина с декабря по апрель


    330 ₾ в сутки — самый высокий тариф в парке, но для высокогорья это единственная машина, на которой
    страховка действительно работает. Условия по маршрутам — на [Условия](/terms/).
fa:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 دیزلی · 4WD
  features:
  - 5–7 صندلی
  - ارتفاع از زمین 220 میلی‌متر
  - دنده کمکی و قفل دیفرانسیل
  price_label: 330 ₾ / روز
  body: >-
    اگر مسیرتان اوشگولی یا اومالو را در بر می‌گیرد، پرادو نخستین خودرویی است که پیشنهاد می‌کنیم. با 220
    میلی‌متر فاصله از زمین، دنده کمکی و قفل دیفرانسیل، این خودرو کاملاً مجاز به تردد در جاده خاکی دره
    انگوری و در گردنه آبانو به سوی توشتی است — مسیری که تقریباً از ژوئن تا اکتبر باز می‌شود، توافق کتبی
    پیشین می‌خواهد و فرانشیز اضافی دارد.


    موتور 2.8 دیزلی همان دلیلی است که مردم پرادو را برای سفرهای دوهفته‌ای می‌گیرند: حدود **9.5 لیتر در
    100 کیلومتر** برای بدنه‌ای در این ابعاد، و برد کافی تا نگرانی بسته بودن پمپ بنزین یک روستا از میان
    برود. هفت صندلی هر وقت لازم شد، و چهار چمدان پس از خواباندن ردیف عقب.


    - چهار چرخ محرک دائم، دنده کمکی و قفل دیفرانسیل

    - ودیعه 1,200 ₾، حداقل سن راننده 25 سال

    - لاستیک زمستانی از دسامبر تا آوریل


    با روزی 330 ₾ گران‌ترین نرخ ناوگان را دارد، اما برای کوهستان بلند تنها خودرویی است که بیمه در آن واقعاً
    اعتبار پیدا می‌کند. شرایط مسیرها در صفحه [شرایط](/terms/) آمده است.
he:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 דיזל · 4WD
  features:
  - 5–7 מקומות
  - מרווח גחון 220 מ"מ
  - העברה נמוכה ונעילת דיפרנציאל
  price_label: 330 ₾ / יום
  body: >-
    אם המסלול שלכם כולל את אושגולי או אומאלו, הפראדו הוא הרכב שנמליץ עליו ראשון. עם מרווח גחון של 220
    מ"מ, העברה נמוכה ונעילת דיפרנציאל הוא מאושר במלואו לדרך החצץ בעמק האנגורי ולמעבר אבאנו אל תושתי —
    מסלול שנפתח בערך מיוני עד אוקטובר, מחייב הסכמה בכתב מראש ונושא השתתפות עצמית נוספת.


    מנוע הדיזל 2.8 הוא הסיבה שלוקחים אותו לטיולים של שבועיים: כ-**9.5 ליטר ל-100 ק"מ** למרכב בגודל כזה,
    וטווח נסיעה שמסיר את הדאגה מתחנת דלק כפרית סגורה. שבעה מקומות כשצריך, וארבע מזוודות ברגע שהשורה האחורית
    מקופלת.


    - הנעה כפולה קבועה, העברה נמוכה ונעילת דיפרנציאל

    - פיקדון 1,200 ₾, גיל נהג מינימלי 25

    - צמיגי חורף מותקנים מדצמבר עד אפריל


    ב-330 ₾ ליום זהו התעריף הגבוה ביותר בצי, אך להרים הגבוהים זהו הרכב שבו הביטוח באמת חל. תנאי המסלולים
    מופיעים בעמוד [תנאים](/terms/).
ar:
  name: Toyota Land Cruiser Prado
  summary: 2017–2022 · 2.8 ديزل · 4WD
  features:
  - 5–7 مقاعد
  - ارتفاع عن الأرض 220 مم
  - تخفيض للتروس وقفل تفاضلي
  price_label: 330 ₾ / يوم
  body: >-
    إذا كان مسارك يشمل أوشغولي أو أومالو، فبرادو هي السيارة التي نوصي بها أولاً. فبارتفاع 220 مم عن الأرض،
    وتخفيض للتروس، وقفل تفاضلي، هي مصرّح لها بالكامل بالطريق الترابي الصاعد في وادي إنغوري وبممر أبانو
    إلى توشيتي — وهو مسار يُفتح تقريباً من يونيو إلى أكتوبر، ويحتاج موافقة خطية مسبقة، ويحمل تحمّلاً إضافياً.


    محرك الديزل 2.8 هو سبب اختيار الناس لها في رحلات الأسبوعين: نحو **9.5 لتر لكل 100 كم** لهيكل بهذا
    الحجم، ومدى يكفي لإزالة القلق من محطة وقود قروية مغلقة. سبعة مقاعد حين تحتاج إليها، وأربع حقائب بعد
    طي الصف الخلفي.


    - دفع رباعي دائم، وتخفيض للتروس، وقفل تفاضلي

    - تأمين 1,200 ₾، والحد الأدنى لسن السائق 25 عاماً

    - إطارات شتوية مركّبة من ديسمبر إلى أبريل


    وبسعر 330 ₾ يومياً تحمل أعلى تعرفة في الأسطول، لكنها للجبال العالية المركبة الوحيدة التي يسري عليها
    التأمين فعلاً. شروط المسارات مذكورة في صفحة [الشروط](/terms/).
