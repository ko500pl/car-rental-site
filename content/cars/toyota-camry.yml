ka:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 ჰიბრიდი · ავტომატი
  features:
  - 5 ადგილი, 3 ჩემოდანი
  - ტყავის სალონი
  - საწვავი ~5.5 ლ
  price_label: 210 ₾ / დღე
  body: >-
    საქართველოში კამრი სოლიდურ ავტომობილად აღიქმება — მას სამინისტროები, ბანკები და კომპანიების ხელმძღვანელები
    დადიან — და ეს აღქმაც იმ პაკეტის ნაწილია, რასაც ქირაობთ. ტყავის სალონი და წყნარი შიდა სივრცე დანარჩენს
    აკეთებს.


    რაც კლიენტებს ყველაზე მეტად აოცებთ, ექსპლუატაციის ხარჯია. 2.5 ჰიბრიდი საშუალოდ **5.5 ლ / 100 კმ**-ს
    მოიხმარს — ეს ბევრ ეკონომ კლასის ჰეჩბეკზე ნაკლებია: აეროპორტის ტრანსფერების, თბილისში შეხვედრებისა
    და ქუთაისში ერთი გასვლის კვირა იშვიათად თუ გადააჭარბებს 120 ლარის საწვავს. ბიზნეს კლასის ავტომობილისთვის
    დღეში 210 ₾-ად ეს არითმეტიკას მთლიანად ცვლის.


    ხუთი ადგილი, სამი ჩემოდანი, კლირენსი 145 მმ. ეს ასფალტის მანქანაა — ბათუმისა და ქუთაისის მაგისტრალები,
    კახეთის მიმართულება; მთის გრუნტი კი მისთვის არ არის, უშგული და ომალო მხოლოდ 4x4 კატეგორიისთვისაა დათმობილი.
    კონფერენციებსა და დელეგაციებზე მძღოლის სერვისიც ხელმისაწვდომია. მინიმალური ასაკი 25 წელი, დეპოზიტი
    1 000 ₾ — დაგვიკავშირდით [კონტაქტი](/contact/).
en:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 hybrid · automatic
  features:
  - 5 seats, 3 suitcases
  - Leather interior
  - Fuel ~5.5 l
  price_label: 210 ₾ / day
  body: >-
    In Georgia the Camry reads as a serious car — it is what ministries, banks and company directors drive
    — and that perception is part of what you are renting. The leather interior and the quiet cabin do
    the rest.


    What surprises people is the running cost. The 2.5 hybrid averages around **5.5 l/100 km**, which
    is less than many economy hatchbacks: a week of airport transfers, meetings across Tbilisi and one
    trip to Kutaisi rarely exceeds 120 ₾ of fuel. For a business-class car at 210 ₾ a day, that changes
    the arithmetic on a two-week visit.


    Five seats, three suitcases, 145 mm of ground clearance. It is built for asphalt — the highways to
    Batumi and Kutaisi, the Kakheti direction — and not for mountain gravel, where Ushguli and Omalo stay
    reserved for the 4x4 category. A chauffeur can be arranged for conferences and delegations. The minimum
    driver age here is 25 and the deposit is 1,000 ₾; ask us anything through [Contact](/contact/).
ru:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 гибрид · автомат
  features:
  - 5 мест, 3 чемодана
  - Кожаный салон
  - Расход ~5.5 л
  price_label: 210 ₾ / сутки
  body: >-
    В Грузии Camry читается как солидная машина — на ней ездят министерства, банки и руководители компаний,
    — и это восприятие тоже часть того, что вы арендуете. Кожаный салон и тишина в движении довершают
    картину.


    Больше всего клиентов удивляет стоимость эксплуатации. Гибрид 2.5 расходует в среднем **5.5 л / 100
    км** — меньше, чем многие хэтчбеки эконом-класса: неделя трансферов из аэропорта, встреч по Тбилиси
    и одна поездка в Кутаиси редко выходит дороже 120 лари на бензин. Для бизнес-класса за 210 ₾ в сутки
    это полностью меняет арифметику.


    Пять мест, три чемодана, клиренс 145 мм. Машина для асфальта: трассы на Батуми и Кутаиси, кахетинское
    направление. Горный грунт — не её история, Ушгули и Омало остаются за категорией 4x4. На конференции
    и приёмы делегаций можем предоставить с водителем. Возраст водителя — от 25 лет, депозит 1 000 ₾;
    вопросы — через [Контакты](/contact/).
fa:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 هیبریدی · اتوماتیک
  features:
  - 5 صندلی، 3 چمدان
  - داخل چرمی
  - مصرف سوخت ~5.5 لیتر
  price_label: 210 ₾ / روز
  body: >-
    در گرجستان کمری خودرویی جدی به شمار می‌آید — وزارتخانه‌ها، بانک‌ها و مدیران شرکت‌ها با همین ماشین
    رفت‌وآمد می‌کنند — و بخشی از آنچه اجاره می‌کنید همین برداشت است. داخل چرمی و کابین ساکت باقی کار را
    انجام می‌دهند.


    آنچه مشتریان را شگفت‌زده می‌کند هزینه نگهداری است. نسخه 2.5 هیبریدی به‌طور میانگین حدود **5.5 لیتر
    در 100 کیلومتر** مصرف می‌کند، یعنی کمتر از بسیاری از هاچ‌بک‌های اقتصادی: یک هفته ترانسفر فرودگاه،
    جلسه‌های پراکنده در تفلیس و یک سفر به کوتایسی به‌ندرت بیش از 120 ₾ بنزین می‌برد. برای خودرویی در کلاس
    بیزنس با نرخ روزی 210 ₾، این عدد کل محاسبه یک سفر دوهفته‌ای را عوض می‌کند.


    پنج صندلی، سه چمدان و 145 میلی‌متر فاصله از زمین. کمری برای آسفالت ساخته شده — بزرگراه‌های باتومی
    و کوتایسی و مسیر کاختی — نه برای جاده خاکی کوهستان، جایی که اوشگولی و اومالو مخصوص دسته 4x4 باقی می‌مانند.
    برای همایش‌ها و هیئت‌ها راننده هم فراهم می‌کنیم. حداقل سن راننده اینجا 25 سال و ودیعه 1,000 ₾ است؛
    هر پرسشی داشتید از راه [تماس](/contact/) بپرسید.
he:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 היברידי · אוטומט
  features:
  - 5 מקומות, 3 מזוודות
  - ריפודי עור
  - צריכת דלק ~5.5 ליטר
  price_label: 210 ₾ / יום
  body: >-
    בגאורגיה הקאמרי נתפסת כמכונית רצינית — זה הרכב של משרדי ממשלה, בנקים ומנהלי חברות — והתפיסה הזאת היא
    חלק ממה שאתם שוכרים. ריפודי העור והשקט בתא הנוסעים עושים את השאר.


    מה שמפתיע אנשים הוא דווקא עלות התפעול. הדגם ההיברידי 2.5 צורך בממוצע כ-**5.5 ליטר ל-100 ק"מ**, פחות
    מהאצ'בקים חסכוניים רבים: שבוע של הסעות לשדה התעופה, פגישות ברחבי טביליסי ונסיעה אחת לקוטאיסי כמעט
    אף פעם אינם עוברים 120 ₾ דלק. עבור רכב מחלקת עסקים ב-210 ₾ ליום, זה משנה את החשבון של ביקור בן שבועיים.


    חמישה מקומות, שלוש מזוודות ומרווח גחון של 145 מ"מ. היא בנויה לאספלט — הכבישים לבטומי ולקוטאיסי וכיוון
    קחתי — ולא לחצץ ההררי, שם אושגולי ואומאלו שמורות לקטגוריית 4x4. לכנסים ולמשלחות אפשר להזמין גם נהג.
    גיל הנהג המינימלי כאן 25 והפיקדון 1,000 ₾; כל שאלה — דרך [צור קשר](/contact/).
ar:
  name: Toyota Camry
  summary: 2020–2023 · 2.5 هجين · أوتوماتيك
  features:
  - 5 مقاعد، 3 حقائب
  - مقصورة جلدية
  - استهلاك الوقود ~5.5 لتر
  price_label: 210 ₾ / يوم
  body: >-
    في جورجيا تُقرأ كامري بوصفها سيارة جادة — فهي ما تقوده الوزارات والمصارف ومديرو الشركات — وهذا الانطباع
    جزء مما تستأجره فعلاً. أما المقصورة الجلدية وهدوء الداخل فيتكفلان بالباقي.


    وما يفاجئ الناس حقاً هو كلفة التشغيل. فالنسخة الهجينة 2.5 تستهلك في المتوسط نحو **5.5 لتر لكل 100
    كم**، أي أقل من كثير من السيارات الاقتصادية: أسبوع من التنقلات إلى المطار واجتماعات في أنحاء تبليسي
    ورحلة واحدة إلى كوتايسي نادراً ما يتجاوز 120 ₾ من الوقود. ولسيارة من درجة رجال الأعمال بسعر 210 ₾
    يومياً، يغيّر ذلك حسابات زيارة تمتد أسبوعين.


    خمسة مقاعد، وثلاث حقائب، وارتفاع عن الأرض 145 مم. إنها مصممة للأسفلت — طرق باتومي وكوتايسي واتجاه
    كاخيتي — لا للدروب الجبلية الترابية، حيث تبقى أوشغولي وأومالو حكراً على فئة 4x4. ويمكن ترتيب سائق
    للمؤتمرات والوفود. الحد الأدنى لسن السائق هنا 25 عاماً ومبلغ التأمين 1,000 ₾؛ اسألنا عن أي شيء عبر
    [اتصل بنا](/contact/).
