ka:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 ბენზინი · 4WD
  features:
  - 5–7 ადგილი
  - კლირენსი 190 მმ
  - მესამე რიგი (მოთხოვნით)
  price_label: 138 ₾ / დღე
  body: >-
    შვიდი ადგილი კროსოვერის ფასად — აუტლენდერის მთავარი არგუმენტი ეს არის. მესამე რიგი მოთხოვნით ეწყობა
    და საჭიროების გარეშე იატაკში იკეცება: აწეული — შვიდი ღვედი, დაკეცილი — საბარგული სამი ჩემოდნისა და
    დეზერტირების ბაზრიდან კვირის სურსათისთვის.


    კლირენსი 190 მმ-ია, ბრუნვა ოთხივე თვალზე გადადის, ამიტომ მთის ასფალტი და სასტუმრო სახლებთან მისასვლელი
    მოკლე ხრეშიანი შესახვევები პრობლემა არ არის. 2.4 ბენზინი საშუალოდ **8.8 ლ / 100 კმ**-ს ხარჯავს; თბილისი–მესტიის
    მარშრუტზე სავსე ბაკი და ერთი დამატებითი ჩასხმა დაგჭირდებათ.


    ძირითადად ორი ტიპის კლიენტი ქირაობს: ხუთ-ექვსსულიანი ოჯახები, რომლებსაც ორ მანქანად გაყოფა არ სურთ,
    და მეგობრების მცირე ჯგუფები, რომლებიც დღიურ 138 ₾-ს ხუთად ინაწილებენ. გახსოვდეთ, რომ ეს მაინც კროსოვერია
    — უშგულის გრუნტსა და აბანოს უღელტეხილზე მხოლოდ 4x4 კატეგორიაა ნებადართული და დაზღვევაც მხოლოდ იქ მოქმედებს.
    მინიმალური ასაკი 23 წელი; დეტალები — [კითხვები](/faq/).
en:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 petrol · 4WD
  features:
  - 5–7 seats
  - Ground clearance 190 mm
  - Third row (on request)
  price_label: 138 ₾ / day
  body: >-
    Seven seats for the price of a crossover is the Outlander's whole argument. The third row comes on
    request and folds flat into the floor when you do not need it: raised, you have seven belts; folded,
    a boot that takes three suitcases and a week's shopping from the Dezerter Bazaar.


    Ground clearance is 190 mm and drive goes to all four wheels, so mountain asphalt and the short gravel
    driveways leading to guesthouses are no trouble. The 2.4 petrol engine averages about **8.8 l/100
    km**; on the Tbilisi–Mestia run plan for a full tank and one top-up.


    We rent it mainly to two groups: families of five or six who refuse to split into two cars, and small
    groups of friends dividing the 138 ₾ daily rate five ways. Keep in mind that it is still a crossover
    — the unpaved stretch to Ushguli and the Abano Pass to Omalo are open only to the off-road 4x4 category,
    which is also the only place the cover applies. Minimum age 23; details on [FAQ](/faq/).
ru:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 бензин · 4WD
  features:
  - 5–7 мест
  - Клиренс 190 мм
  - Третий ряд (по запросу)
  price_label: 138 ₾ / сутки
  body: >-
    Семь мест по цене кроссовера — вот и весь аргумент Outlander. Третий ряд ставится по запросу и складывается
    в пол, когда не нужен: поднят — семь ремней, сложен — багажник на три чемодана и недельную закупку
    с Дезертирского базара.


    Клиренс 190 мм, привод на все колёса, поэтому горный асфальт и короткие гравийные съезды к гостевым
    домам проблемой не будут. Мотор 2.4 расходует около **8.8 л / 100 км**; на маршрут Тбилиси–Местиа
    рассчитывайте полный бак плюс одну дозаправку.


    Берут его в основном две категории клиентов: семьи из пяти-шести человек, которые не хотят делиться
    на две машины, и компании друзей, делящие 138 ₾ в сутки на пятерых. При этом помните: это всё-таки
    кроссовер. Для грунтовки до Ушгули и перевала Абано нужен автомобиль категории 4x4 — только там страховое
    покрытие действительно работает. Минимальный возраст водителя — 23 года, подробности на [Вопросы](/faq/).
fa:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 بنزینی · 4WD
  features:
  - 5–7 صندلی
  - ارتفاع از زمین 190 میلی‌متر
  - ردیف سوم (به درخواست)
  price_label: 138 ₾ / روز
  body: >-
    هفت صندلی به قیمت یک کراس‌اوور — تمام استدلال اوتلندر همین است. ردیف سوم به درخواست شما اضافه می‌شود
    و وقتی لازم نباشد کاملاً در کف خودرو تا می‌شود: باز، هفت کمربند دارید؛ خوابیده، صندوقی که سه چمدان
    و خرید یک هفته از بازار دزرتیر را جا می‌دهد.


    ارتفاع از زمین 190 میلی‌متر است و نیرو به هر چهار چرخ می‌رسد، بنابراین آسفالت کوهستانی و مسیرهای کوتاه
    خاکی منتهی به مهمان‌خانه‌ها هیچ دردسری ندارند. موتور 2.4 بنزینی به‌طور میانگین حدود **8.8 لیتر در
    100 کیلومتر** مصرف می‌کند؛ برای مسیر تفلیس–مستیا یک باک پر و یک بار سوخت‌گیری میانه را در نظر بگیرید.


    این خودرو را بیشتر به دو گروه اجاره می‌دهیم: خانواده‌های پنج و شش‌نفره‌ای که حاضر نیستند به دو ماشین
    تقسیم شوند، و گروه‌های کوچک دوستان که نرخ روزانه 138 ₾ را پنج قسمت می‌کنند. به یاد داشته باشید که
    این همچنان یک کراس‌اوور است — مسیر خاکی اوشگولی و گردنه آبانو به اومالو تنها به روی دسته آفرود 4x4
    باز است و بیمه هم فقط همان‌جا اعتبار دارد. حداقل سن 23 سال؛ جزئیات در [پرسش‌های متداول](/faq/).
he:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 בנזין · 4WD
  features:
  - 5–7 מקומות
  - מרווח גחון 190 מ"מ
  - שורה שלישית (לפי בקשה)
  price_label: 138 ₾ / יום
  body: >-
    שבעה מקומות במחיר של קרוסאובר — זו כל הטענה של האאוטלנדר. השורה השלישית מגיעה לפי בקשה ומתקפלת אל
    תוך הרצפה כשאינה נחוצה: פרושה, יש לכם שבע חגורות; מקופלת, תא מטען שבולע שלוש מזוודות וקניות של שבוע
    משוק דזרטיר.


    מרווח הגחון הוא 190 מ"מ וההנעה מגיעה לכל ארבעת הגלגלים, ולכן אספלט הררי ושבילי חצץ קצרים המובילים
    לבתי הארחה אינם בעיה. מנוע 2.4 בנזין צורך בממוצע כ-**8.8 ליטר ל-100 ק"מ**; לנסיעה טביליסי–מסטיה תכננו
    מיכל מלא ותדלוק אחד בדרך.


    אנחנו משכירים אותו בעיקר לשתי קבוצות: משפחות של חמישה או שישה שמסרבות להתפצל לשני רכבים, וחבורות קטנות
    של חברים שמחלקות את 138 ₾ ליום בחמישה. זכרו שזה עדיין קרוסאובר — הקטע הלא סלול לאושגולי ומעבר אבאנו
    לאומאלו פתוחים רק לקטגוריית השטח 4x4, וזה גם המקום היחיד שבו הכיסוי הביטוחי תקף. גיל מינימלי 23; פרטים
    בעמוד [שאלות נפוצות](/faq/).
ar:
  name: Mitsubishi Outlander
  summary: 2018–2022 · 2.4 بنزين · 4WD
  features:
  - 5–7 مقاعد
  - ارتفاع عن الأرض 190 مم
  - صف ثالث (عند الطلب)
  price_label: 138 ₾ / يوم
  body: >-
    سبعة مقاعد بسعر كروس أوفر — هذه هي حجة أوتلاندر كلها. يأتي الصف الثالث عند الطلب ويُطوى تماماً داخل
    الأرضية حين لا تحتاج إليه: مرفوعاً تحصل على سبعة أحزمة، ومطوياً تحصل على صندوق يتسع لثلاث حقائب ومشتريات
    أسبوع من سوق ديزيرتير.


    الارتفاع عن الأرض 190 مم والدفع يصل إلى العجلات الأربع، لذا لا يمثل الأسفلت الجبلي ولا الممرات الترابية
    القصيرة المؤدية إلى بيوت الضيافة أي مشكلة. ويستهلك محرك 2.4 بنزين نحو **8.8 لتر لكل 100 كم** في المتوسط؛
    ولرحلة تبليسي–ميستيا احسب خزاناً ممتلئاً وتعبئة واحدة في الطريق.


    نؤجرها أساساً لفئتين: أسر من خمسة أو ستة أفراد ترفض الانقسام إلى سيارتين، ومجموعات صغيرة من الأصدقاء
    تقتسم سعر 138 ₾ اليومي على خمسة. وتذكّر أنها تبقى سيارة كروس أوفر — فالمقطع الترابي إلى أوشغولي وممر
    أبانو إلى أومالو مفتوحان لفئة الطرق الوعرة 4x4 وحدها، وهي أيضاً المكان الوحيد الذي يسري فيه التأمين.
    الحد الأدنى للسن 23 عاماً؛ التفاصيل في [الأسئلة الشائعة](/faq/).
