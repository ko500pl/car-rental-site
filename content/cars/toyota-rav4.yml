ka:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 ჰიბრიდი / 2.0 ბენზინი · AWD
  features:
  - 5 ადგილი, 3–4 ჩემოდანი
  - კლირენსი 195 მმ
  - საწვავი ~6.5–8.5 ლ
  price_label: 145 ₾ / დღე
  body: >-
    RAV4 არის ის კომპრომისი, რომელსაც მოგზაურების უმეტესობა სინამდვილეში ეძებს: კროსოვერის კლირენსი ჰიბრიდის
    ხარჯთან ერთად. 195 მმ საკმარისია დაზიანებული ასფალტისა და წყალამრიდი ბეტონის ზოლებისთვის, რომლებსაც
    ყაზბეგის, რაჭისა და კახეთის მთის სოფლებში შეხვდებით; 2.5 ჰიბრიდი კი საშუალოდ **6.5–8.5 ლ / 100 კმ**-ში
    ეტევა — დაახლოებით ორჯერ ნაკლები, ვიდრე იმავე ზომის ბენზინის ჯიპი.


    სრული წამყვანი ეხმარება სველ სერპანტინებზე და ზამთარში გუდაურისა თუ ბაკურიანის თოვლიან მონაკვეთებზე;
    დეკემბრიდან აპრილამდე ყველა ავტომობილს ზამთრის საბურავი უდგას. საბარგულში 3–4 ჩემოდანი თავსდება, ანუ
    ოთხი ზრდასრული ორ კვირას ბარგის კალთაში დაწყობის გარეშე მგზავრობს.


    ერთი შეზღუდვა გასათვალისწინებელია: ეს კროსოვერია და არა მაღალი გამავლობის ჯიპი. უშგულისა და ომალოს
    გრუნტოვანი გზები მხოლოდ 4x4 კატეგორიისთვისაა ღია და იქ მიღებული ზიანი არ იფარება. დანარჩენი საქართველო
    კი დღეში 145 ₾-ად თქვენია — კატეგორიები [ავტოპარკი](/fleet/) გვერდზე შეადარეთ.
en:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 hybrid / 2.0 petrol · AWD
  features:
  - 5 seats, 3–4 suitcases
  - Ground clearance 195 mm
  - Fuel ~6.5–8.5 l
  price_label: 145 ₾ / day
  body: >-
    The RAV4 is the compromise most travellers are actually looking for: crossover clearance with hybrid
    running costs. At 195 mm it clears the broken asphalt and the concrete water bars you meet on the
    way up to Kazbegi, Racha or the mountain villages of Kakheti, yet the 2.5 hybrid still averages **6.5–8.5
    l/100 km** depending on how much climbing you do — roughly half what a petrol SUV of the same size
    drinks.


    All-wheel drive helps on wet switchbacks and on snow around Gudauri and Bakuriani in winter, when
    every car in the fleet runs winter tyres from December to April. The boot takes three to four suitcases,
    so four adults can travel for a fortnight without stacking bags on their laps.


    One limit is worth knowing: this is a crossover, not an off-road vehicle. The gravel roads to Ushguli
    in Svaneti and Omalo in Tusheti are open only to the 4x4 category, and damage there is not covered.
    The rest of the country is fair game at 145 ₾ a day — compare the categories on [Fleet](/fleet/).
ru:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 гибрид / 2.0 бензин · AWD
  features:
  - 5 мест, 3–4 чемодана
  - Клиренс 195 мм
  - Расход ~6.5–8.5 л
  price_label: 145 ₾ / сутки
  body: >-
    RAV4 — тот компромисс, который на самом деле ищет большинство путешественников: клиренс кроссовера
    при расходе гибрида. 195 мм хватает для разбитого асфальта и бетонных водоотводов, которые встречаются
    на подъёмах в Казбеги, Рачу и горные сёла Кахетии, а гибрид 2.5 укладывается в **6.5–8.5 л / 100 км**
    — примерно вдвое меньше, чем бензиновый внедорожник тех же габаритов.


    Полный привод выручает на мокрых серпантинах и зимой на снегу у Гудаури и Бакуриани; с декабря по
    апрель все машины на зимней резине. В багажник входят три-четыре чемодана, так что четверо взрослых
    спокойно едут на две недели, не раскладывая сумки по коленям.


    Одно ограничение стоит помнить: это кроссовер, а не внедорожник. Грунтовые дороги к Ушгули в Сванетии
    и к Омало в Тушетии открыты только для категории 4x4, и повреждения там не покрываются. Вся остальная
    Грузия доступна за 145 ₾ в сутки — категории удобно сравнить на [Автопарк](/fleet/).
fa:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 هیبریدی / 2.0 بنزینی · AWD
  features:
  - 5 صندلی، 3–4 چمدان
  - ارتفاع از زمین 195 میلی‌متر
  - مصرف سوخت ~6.5–8.5 لیتر
  price_label: 145 ₾ / روز
  body: >-
    RAV4 همان توازنی است که بیشتر مسافران در عمل دنبال آن هستند: ارتفاع یک کراس‌اوور همراه با هزینه‌های
    یک هیبرید. 195 میلی‌متر فاصله از زمین برای آسفالت شکسته و آبروهای بتنی مسیر بالا رفتن به کازبگی، راچا
    و روستاهای کوهستانی کاختی کافی است، و با این حال موتور 2.5 هیبریدی بسته به مقدار سربالایی به‌طور میانگین
    **6.5–8.5 لیتر در 100 کیلومتر** مصرف می‌کند — تقریباً نصف یک شاسی‌بلند بنزینی هم‌اندازه.


    سیستم چهار چرخ محرک در پیچ‌های خیس و روی برف اطراف گودائوری و باکوریانی به داد شما می‌رسد؛ از دسامبر
    تا آوریل همه خودروهای ناوگان لاستیک زمستانی دارند. صندوق عقب سه تا چهار چمدان را جا می‌دهد، یعنی چهار
    بزرگسال می‌توانند دو هفته سفر کنند بدون آنکه ساک‌ها را روی زانو نگه دارند.


    یک محدودیت را بدانید: این خودرو کراس‌اوور است، نه آفرود. جاده‌های خاکی اوشگولی در سوانتی و اومالو
    در توشتی تنها به روی دسته 4x4 باز است و خسارت در آن مسیرها پوشش داده نمی‌شود. باقی کشور روزی 145 ₾
    در اختیار شماست — دسته‌ها را در صفحه [ناوگان](/fleet/) مقایسه کنید.
he:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 היברידי / 2.0 בנזין · AWD
  features:
  - 5 מקומות, 3–4 מזוודות
  - מרווח גחון 195 מ"מ
  - צריכת דלק ~6.5–8.5 ליטר
  price_label: 145 ₾ / יום
  body: >-
    ה-RAV4 הוא הפשרה שרוב הנוסעים באמת מחפשים: מרווח גחון של קרוסאובר לצד עלויות תפעול של רכב היברידי.
    195 מ"מ מספיקים לאספלט המתפורר ולסוללות הבטון שבדרך העולה לקזבגי, לראצ'ה ולכפרי ההרים של קחתי, ובכל
    זאת המנוע ההיברידי 2.5 מסתפק בממוצע ב-**6.5–8.5 ליטר ל-100 ק"מ**, תלוי בכמות הטיפוס — בערך מחצית ממה
    ששותה רכב שטח בנזיני באותו גודל.


    ההנעה הכפולה עוזרת בסרפנטינות רטובות ובשלג סביב גודאורי ובקוריאני בחורף, ומדצמבר עד אפריל כל הרכבים
    בצי מצוידים בצמיגי חורף. תא המטען בולע שלוש עד ארבע מזוודות, כך שארבעה מבוגרים נוסעים לשבועיים בלי
    לערום תיקים על הברכיים.


    מגבלה אחת כדאי להכיר: זה קרוסאובר, לא רכב שטח. דרכי החצץ לאושגולי שבסוואנטי ולאומאלו שבתושתי פתוחות
    רק לקטגוריית 4x4, ונזק שנגרם שם אינו מכוסה. כל שאר גאורגיה פתוחה בפניכם ב-145 ₾ ליום — השוו בין הקטגוריות
    בעמוד [צי הרכב](/fleet/).
ar:
  name: Toyota RAV4
  summary: 2019–2023 · 2.5 هجين / 2.0 بنزين · AWD
  features:
  - 5 مقاعد، 3–4 حقائب
  - ارتفاع عن الأرض 195 مم
  - استهلاك الوقود ~6.5–8.5 لتر
  price_label: 145 ₾ / يوم
  body: >-
    سيارة RAV4 هي الحل الوسط الذي يبحث عنه معظم المسافرين فعلياً: ارتفاع كروس أوفر عن الأرض مع تكاليف
    تشغيل سيارة هجينة. فارتفاع 195 مم يكفي للأسفلت المتهالك ولحواجز تصريف المياه الخرسانية التي تقابلك
    في الطريق الصاعد إلى كازبيغي وراتشا وقرى كاخيتي الجبلية، ومع ذلك يبقى المحرك الهجين 2.5 عند معدل **6.5–8.5
    لتر لكل 100 كم** بحسب مقدار الصعود — أي نحو نصف ما تستهلكه سيارة دفع رباعي بنزينية بالحجم نفسه.


    يساعدك الدفع الرباعي على المنعطفات المبللة وعلى الثلج حول غودواري وباكورياني شتاءً، وجميع سيارات الأسطول
    مزودة بإطارات شتوية من ديسمبر إلى أبريل. ويتسع صندوق الأمتعة لثلاث أو أربع حقائب، فيسافر أربعة بالغين
    أسبوعين كاملين دون وضع الحقائب على أرجلهم.


    يبقى حدّ واحد يستحق الانتباه: هذه سيارة كروس أوفر لا سيارة طرق وعرة. فالطرق الترابية إلى أوشغولي في
    سفانيتي وأومالو في توشيتي مفتوحة لفئة 4x4 وحدها، والأضرار هناك غير مشمولة. أما بقية جورجيا فهي لك
    مقابل 145 ₾ يومياً — قارن الفئات على صفحة [الأسطول](/fleet/).
