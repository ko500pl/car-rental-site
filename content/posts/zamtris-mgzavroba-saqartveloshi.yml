ka:
  title: ზამთარში მანქანით მგზავრობა საქართველოში
  desc: >-
    ზამთრის საბურავები 1 დეკემბრიდან 1 აპრილამდე, გუდაურისა და ჯვრის უღელტეხილის დახურვები, ჯაჭვები, საწვავი,
    სინათლის საათები და 112 — სრული ზამთრის ინსტრუქცია.
  keywords: >-
    ზამთარი საქართველოში მანქანით, ზამთრის საბურავები, გუდაური ზვავი, ჯვრის უღელტეხილი, winter driving
    georgia, თოვლის ჯაჭვები
  lead: >-
    საქართველოს მთავარი მაგისტრალები ზამთარშიც ღიაა, მაგრამ მთის მონაკვეთები დღეში რამდენჯერმე იცვლის
    სახეს. ქვემოთ ის მინიმუმია, რაც დეკემბრიდან აპრილამდე მძღოლმა უნდა იცოდეს.
  body: >
    ## ზამთრის საბურავები — წესი და ვადები


    **1 დეკემბრიდან 1 აპრილამდე Drive On-ის ავტოპარკის ყველა ავტომობილი ზამთრის საბურავებზეა და ეს ფასში
    შედის** — დამატებით არაფრის შეკვეთა და გადახდა არ გჭირდებათ. საქართველოს მოქმედი წესები ცივ სეზონზე
    მთის მარშრუტებზე შესაბამის ზამთრის აღჭურვილობას ითხოვს, ამიტომ ეს ჩვენი მხრიდან ავტომატურად სრულდება.


    პრაქტიკული დეტალი, რომელსაც ხშირად კარგავენ მხედველობიდან: ზამთრის საბურავი ყინულზე სასწაულს არ ახდენს.
    ის ამცირებს დამუხრუჭების მანძილს, მაგრამ 60 კმ/სთ-ზე მოყინულ სერპანტინზე მაინც ვერაფერს გიშველით.
    მთაში დისტანცია ორმაგად აიღეთ.


    ## თოვლის ჯაჭვები


    ჯაჭვები ცალკე აღჭურვილობაა და გუდაურის ან ბაკურიანის მიმართულებით ნამდვილად გამოგადგებათ.


    | აღჭურვილობა | ღირებულება | შენიშვნა |

    |---|---|---|

    | ზამთრის საბურავები | 0 ₾ | 1 დეკემბერი – 1 აპრილი, ფასში შედის |

    | თოვლის ჯაჭვები | 20 ₾ გაქირავებაზე | 4x4 კატეგორიაზე უფასოა |

    | სახურავის სისტემა (თხილამურებისთვის) | 25 ₾ დღეში | მხოლოდ SUV და 4x4 |

    | საბურავის შეცვლა დაზიანებისას | 120–400 ₾ | დაზღვევით არ იფარება |


    ჯაჭვების დაყენება ისწავლეთ **გამგზავრებამდე**, მშრალ ეზოში, და არა -8°C-ზე უღელტეხილის შუაგულში. ჩვენს
    ოფისში ვაჟა-ფშაველას გამზირზე ამას ორ წუთში გაჩვენებთ.


    ## რომელი გზა მუშაობს ზამთარში


    | მიმართულება | ზამთრის სტატუსი | კატეგორია |

    |---|---|---|

    | თბილისი – ბათუმი (E60) | ღიაა მთელი წელი | ეკონომი და ზემოთ |

    | თბილისი – ყაზბეგი | ღიაა, გუდაურის მონაკვეთი პერიოდულად იკეტება | კროსოვერი |

    | ბორჯომი – ბაკურიანი | ღიაა, აქტიური სეზონი | კროსოვერი + ჯაჭვები |

    | ზუგდიდი – მესტია | ჩვეულებრივ ღიაა, თოვლის შემდეგ დროებით იკეტება | 4x4 |

    | მესტია – უშგული | პრაქტიკულად გაუვალია | არ ვაქირავებთ ამ მარშრუტზე |

    | აბანოს უღელტეხილი (თუშეთი) | დახურულია ნოემბრიდან მაისამდე | — |

    | გოდერძის უღელტეხილი | ხშირად იკეტება ქარბუქის დროს | 4x4 |


    **გუდაური და ჯვრის უღელტეხილი** ზამთრის მთავარი რისკია. საქართველოს სამხედრო გზა ზვავსაშიშ ზონაში
    გადის და გზის დეპარტამენტი მას პრევენციულად კეტავს — ხანდახან რამდენიმე საათით, ხანდახან მთელი დღით,
    ორივე მიმართულებით. ეს არ არის ავარია და არც ჩვენი გაუმართაობაა: უბრალოდ ვერ გაივლით და ლოდინი მოგიწევთ.


    რას ნიშნავს ეს დაგეგმვისთვის: **ყაზბეგში ერთდღიანი გასვლა ზამთარში ცუდი იდეაა.** თუ სტეფანწმინდაში
    ღამეს ათევთ და გზა დაიხურა, თბილისში მეორე დღეს ჩამოხვალთ. თუ იმავე დღეს ფრენა გაქვთ — რისკი მაღალია.
    დაბრუნება ერთი დღით ადრე დაგეგმეთ.


    ## საწვავი და სინათლის საათები


    დეკემბერში თბილისში მზე 17:20-ზე ჩადის, მთაში კი ხეობა კიდევ უფრო ადრე ბნელდება. ეს ნიშნავს, რომ **სასარგებლო
    სამგზავრო ფანჯარა 08:30-დან 16:30-მდეა** — რვა საათი, არა თორმეტი. მთის სერპანტინი სიბნელეში მოყინულ
    ასფალტთან ერთად ის კომბინაციაა, რომელსაც უცხოელი მძღოლისთვის არასოდეს ვურჩევთ.


    - ბაკი აავსეთ ნახევრამდე ჩამოსვლისას, არა ლამპოჩკაზე. მთაში საცობში დგომა საწვავს ჭამს.

    - ბენზინგასამართები ყაზბეგში, ომალოში, უშგულში და შოვში ან არაა, ან არასტაბილურად მუშაობს.

    - თბილისში ბოლო გამართვის წერტილები ჟინვალისა და პასანაურის შემდეგ იშვიათდება.

    - ტელეფონის დამტენი და საბანი მანქანაში დაიდეთ. თუ გზა დაიხურა, ორ საათს მოგიწევთ ლოდინი გამორთული
    ძრავით.


    ## ავარიული ნომრები


    - **112** — საქართველოს ერთიანი გადაუდებელი ნომერი: პოლიცია, სასწრაფო, სახანძრო, სამაშველო. მუშაობს
    ინგლისურად.

    - **Drive On-ის ცხელი ხაზი** — 24/7. ტექნიკური გაუმართაობის შემთხვევაში, თუ ის მოქირავნის ბრალით
    არ არის გამოწვეული, სანაცვლო ავტომობილს 6 საათში უფასოდ მოგაწვდით.


    ავარიისას თანმიმდევრობა ასეთია: 1) გამოიძახეთ 112; 2) დაგვირეკეთ ჩვენ; 3) **ადგილიდან არ წახვიდეთ,
    სანამ ოქმი არ შედგება.** ოქმის გარეშე დატოვებული ადგილი დაზღვევის დაკარგვას ნიშნავს.


    ## რას ფარავს და რას არ ფარავს დაზღვევა ზამთარში


    ფასში შემავალი CDW ავტომობილის დაზიანებას ფარავს ფრანშიზის ზემოთ (300 ₾ ეკონომზე, 1 200 ₾ 4x4-ზე).
    მაგრამ ზამთარში ყველაზე ხშირი ზიანი სწორედ იმ ნაწილზე მოდის, რომელიც **არ იფარება**:


    - საბურავები და დისკები;

    - ავტომობილის ქვედა ნაწილი;

    - სარკეები და სალონი;

    - გრუნტოვან გზაზე მიღებული დაზიანება, თუ ავტომობილი 4x4 კატეგორიის არაა.


    ბორდიურზე გასრიალება მოყინულ ქუჩაზე კლასიკური ზამთრის ეპიზოდია და ის მთლიანად მოქირავნის ხარჯია. ამიტომ
    ზამთარში SCDW-ის დამატება (25–45 ₾ დღეში) უფრო ხშირად თავს იმართლებს, ვიდრე ზაფხულში — [ფასების გვერდზე](/pricing/)
    ნახავთ კატეგორიების მიხედვით.


    ## რას მოიცავს ჩვენი ზამთრის პოლიტიკა


    1. ზამთრის საბურავები ყველა ავტომობილზე 1 დეკემბრიდან 1 აპრილამდე — ფასში.

    2. ჯაჭვები 20 ლარად გაქირავებაზე, 4x4-ზე უფასოდ.

    3. საგზაო დახმარება 24/7 მთელ ქვეყანაში.

    4. სანაცვლო ავტომობილი 6 საათში ტექნიკური გაუმართაობისას.

    5. თარიღების უფასო შეცვლა, თუ ავტომობილი ახალ თარიღებზე თავისუფალია — ეს პირდაპირ ეხება გუდაურის დახურვებს.

    6. ავტოპარკის საშუალო ასაკი 4 წელი და ტექმომსახურება ყოველ 8 000 კმ-ზე: ზამთარში ეს აკუმულატორისა
    და მუხრუჭების საკითხია, არა კომფორტის.


    ## მოკლედ


    ზამთარში საქართველოში მართვა სრულიად ნორმალურია, თუ სამ წესს იცავთ: **მთაში დღის სინათლეზე იმოძრავეთ,
    ბაკი ნახევარზე ზემოთ გქონდეთ და ერთდღიან მთის მარშრუტს სარეზერვო დღე დაუტოვეთ.** დანარჩენს ჩვენ ვაგვარებთ.


    კატეგორიები და ტექნიკური მახასიათებლები — [ავტოპარკის გვერდზე](/fleet/), სრული პირობები — [პირობების
    გვერდზე](/terms/), დარჩენილი კითხვები — [FAQ-ში](/faq/) ან პირდაპირ [კონტაქტში](/contact/).
en:
  title: 'Driving in Georgia in winter: what you need to know'
  desc: >-
    Winter tyres from 1 December to 1 April, Gudauri and Jvari Pass closures, snow chains, fuel and daylight
    planning, emergency number 112 and what our winter policy covers.
  keywords: >-
    winter driving Georgia, winter tyres Georgia, Gudauri avalanche, Jvari Pass closed, snow chains Georgia,
    car rental Georgia winter, Kazbegi in winter
  lead: >-
    Georgia's main highways stay open all winter, but the mountain sections can change character several
    times in a single day. Here is the minimum a driver should know between December and April.
  body: >
    ## Winter tyres — the rule and the dates


    **From 1 December to 1 April every car in the Drive On fleet runs on winter tyres, and that is included
    in the rate** — there is nothing to order and nothing extra to pay. Georgian rules require appropriate
    winter equipment on mountain routes during the cold season, so we simply meet that requirement by
    default across the fleet.


    One practical point people forget: winter tyres are not magic on ice. They shorten your braking distance,
    but at 60 km/h on a frozen hairpin nothing will save you. In the mountains, double the following distance
    you would normally keep.


    ## Snow chains


    Chains are separate equipment, and on the Gudauri or Bakuriani runs you will genuinely be glad to
    have them.


    | Equipment | Cost | Notes |

    |---|---|---|

    | Winter tyres | 0 ₾ | 1 December – 1 April, included in the rate |

    | Snow chains | 20 ₾ per rental | Free on the 4x4 category |

    | Roof rack (for skis) | 25 ₾ per day | SUV and 4x4 only |

    | Tyre replacement after damage | 120–400 ₾ | Not covered by insurance |


    Learn to fit the chains **before you leave**, in a dry car park, rather than at -8°C halfway up a
    pass. We will walk you through it in two minutes at our office on Vazha-Pshavela Avenue.


    ## Which roads actually work in winter


    | Route | Winter status | Category |

    |---|---|---|

    | Tbilisi – Batumi (E60) | Open all year | Economy and up |

    | Tbilisi – Kazbegi | Open, Gudauri section closes periodically | Crossover |

    | Borjomi – Bakuriani | Open, peak season | Crossover plus chains |

    | Zugdidi – Mestia | Usually open, closes briefly after heavy snow | 4x4 |

    | Mestia – Ushguli | Effectively impassable | Not rented for this route |

    | Abano Pass (Tusheti) | Closed from November to May | — |

    | Goderdzi Pass | Frequently closed during blizzards | 4x4 |


    **Gudauri and the Jvari Pass** are the main winter variable. The Georgian Military Road runs through
    avalanche terrain, and the roads department closes it pre-emptively — sometimes for a few hours, sometimes
    for a whole day, in both directions. This is not a breakdown and not something we can override: you
    simply wait.


    What that means for planning: **a same-day return trip to Kazbegi in winter is a bad idea.** If you
    stay overnight in Stepantsminda and the road shuts, you come back to Tbilisi a day later. If you have
    a flight that evening, the risk is real. Build the drive so that you return one day before you fly.


    ## Fuel and daylight


    In December the sun sets in Tbilisi around 17:20, and in a mountain valley it goes dark noticeably
    earlier. That gives you a **useful driving window of roughly 08:30 to 16:30** — eight hours, not twelve.
    Mountain switchbacks, darkness and black ice together are a combination we never recommend to a visiting
    driver.


    - Refuel at half a tank rather than at the warning light. Sitting in a queue behind a closure burns
    fuel.

    - Petrol stations in Kazbegi, Omalo, Ushguli and Shovi are either absent or unreliable.

    - Beyond Zhinvali and Pasanauri the stations thin out quickly.

    - Keep a phone charger and a blanket in the car. If the road closes, you may be waiting two hours
    with the engine off.


    ## Emergency numbers


    - **112** — Georgia's single emergency number: police, ambulance, fire and rescue. Operators speak
    English.

    - **The Drive On hotline** — 24/7. If the fault is technical and not caused by the renter, a replacement
    car reaches you within 6 hours at no charge.


    After an accident the order is: 1) call 112; 2) call us; 3) **do not leave the scene until the report
    has been drawn up.** Leaving without a police report means losing the insurance cover.


    ## What the insurance does and does not cover in winter


    The CDW included in the price covers damage to the vehicle above the excess (300 ₾ on economy, 1,200
    ₾ on a 4x4). But the damage that actually happens in winter tends to land on exactly the parts that
    are **not** covered:


    - tyres and wheels;

    - the underbody;

    - mirrors and the interior;

    - any damage taken on an unpaved road unless the car is in the 4x4 category.


    Sliding a wheel into a kerb on an icy street is the classic winter incident, and it is entirely at
    the renter's expense. That is why adding SCDW at 25–45 GEL per day pays off more often in winter than
    in summer — the rates by category are on the [pricing page](/pricing/).


    ## What our winter policy covers


    1. Winter tyres on every car from 1 December to 1 April, included in the rate.

    2. Chains at 20 GEL per rental, free on 4x4s.

    3. 24/7 roadside assistance nationwide.

    4. A replacement car within 6 hours for a technical fault.

    5. Free date changes when the car is available on the new dates — which matters directly when Gudauri
    closes.

    6. An average fleet age of 4 years with servicing every 8,000 km. In winter that is a battery and
    brakes question, not a comfort question.


    ## In short


    Winter driving in Georgia is entirely normal if you keep three rules: **move through the mountains
    in daylight, stay above half a tank, and give any mountain day trip a spare day behind it.** We handle
    the rest.


    Categories and specifications are on the [fleet page](/fleet/), the full conditions on the [terms
    page](/terms/), and anything left over in the [FAQ](/faq/) or straight through [contact](/contact/).
ru:
  title: 'Зимой за рулём в Грузии: что нужно знать'
  desc: >-
    Зимняя резина с 1 декабря по 1 апреля, закрытия Гудаури и Крестового перевала, цепи, запас топлива,
    световой день и номер 112 — полная зимняя инструкция водителю.
  keywords: >-
    зима в Грузии на машине, зимняя резина Грузия, Гудаури лавина, Крестовый перевал закрыт, цепи противоскольжения,
    аренда авто Грузия зимой, Казбеги зимой
  lead: >-
    Главные магистрали Грузии открыты и зимой, но горные участки способны поменять характер несколько
    раз за день. Ниже минимум, который водителю стоит знать с декабря по апрель.
  body: >
    ## Зимняя резина: правило и сроки


    **С 1 декабря по 1 апреля все автомобили автопарка Drive On стоят на зимней резине, и это входит
    в стоимость** — заказывать и доплачивать ничего не нужно. Действующие в Грузии правила требуют соответствующего
    зимнего оснащения на горных маршрутах в холодный сезон, и мы закрываем это требование по всему парку
    автоматически.


    Важная деталь, о которой забывают: зимняя резина не творит чудес на льду. Она сокращает тормозной
    путь, но на обледеневшем серпантине при 60 км/ч не спасёт ничто. В горах держите двойную дистанцию.


    ## Цепи противоскольжения


    Цепи — отдельное оснащение, и на направлениях Гудаури или Бакуриани вы им действительно обрадуетесь.


    | Оснащение | Стоимость | Примечание |

    |---|---|---|

    | Зимняя резина | 0 ₾ | 1 декабря – 1 апреля, входит в тариф |

    | Цепи противоскольжения | 20 ₾ за аренду | На категории 4x4 бесплатно |

    | Багажник на крышу (для лыж) | 25 ₾ в сутки | Только SUV и 4x4 |

    | Замена повреждённой шины | 120–400 ₾ | Страховкой не покрывается |


    Научитесь надевать цепи **до выезда**, на сухой площадке, а не при -8°C посреди перевала. В офисе
    на проспекте Важа-Пшавела мы показываем это за две минуты.


    ## Какие дороги работают зимой


    | Направление | Зимний статус | Категория |

    |---|---|---|

    | Тбилиси – Батуми (E60) | Открыто круглый год | Эконом и выше |

    | Тбилиси – Казбеги | Открыто, участок Гудаури периодически закрывают | Кроссовер |

    | Боржоми – Бакуриани | Открыто, активный сезон | Кроссовер плюс цепи |

    | Зугдиди – Местиа | Обычно открыто, после снегопада закрывают ненадолго | 4x4 |

    | Местиа – Ушгули | Практически непроходимо | На этот маршрут не сдаём |

    | Перевал Абано (Тушетия) | Закрыт с ноября по май | — |

    | Перевал Годердзи | Часто закрывают в метель | 4x4 |


    **Гудаури и Крестовый перевал** — главная зимняя переменная. Военно-Грузинская дорога проходит по
    лавиноопасной зоне, и дорожный департамент закрывает её превентивно: иногда на несколько часов, иногда
    на весь день, в обе стороны. Это не поломка и не наш недосмотр — просто придётся ждать.


    Что это значит для планирования: **однодневная поездка в Казбеги зимой — плохая идея.** Если вы ночуете
    в Степанцминде и дорогу закрыли, в Тбилиси вы вернётесь на сутки позже. А если вечером у вас рейс,
    риск вполне реальный. Планируйте возвращение за день до вылета.


    ## Топливо и световой день


    В декабре солнце в Тбилиси садится около 17:20, а в горном ущелье темнеет заметно раньше. Полезное
    окно для движения — примерно **с 08:30 до 16:30**, то есть восемь часов, а не двенадцать. Серпантин,
    темнота и гололёд — сочетание, которое приезжему водителю мы не рекомендуем никогда.


    - Заправляйтесь на половине бака, а не на лампочке: стоянка в очереди перед закрытым участком расходует
    топливо.

    - Заправок в Казбеги, Омало, Ушгули и Шови либо нет, либо они работают нестабильно.

    - После Жинвали и Пасанаури колонки быстро редеют.

    - Держите в машине зарядку для телефона и плед: при закрытии дороги ждать можно и два часа с заглушенным
    двигателем.


    ## Экстренные номера


    - **112** — единый номер экстренных служб Грузии: полиция, скорая, пожарные, спасатели. Операторы
    говорят по-английски.

    - **Горячая линия Drive On** — круглосуточно. При технической неисправности не по вине арендатора
    подменный автомобиль приезжает в течение 6 часов бесплатно.


    Порядок действий при ДТП: 1) звоните 112; 2) звоните нам; 3) **не покидайте место до составления протокола.**
    Уехать без протокола означает потерять страховое покрытие.


    ## Что страховка зимой покрывает, а что нет


    Включённая в цену CDW покрывает ущерб автомобилю сверх франшизы (300 ₾ на эконом-классе, 1 200 ₾ на
    4x4). Но зимние повреждения приходятся как раз на то, что **не покрывается**:


    - шины и диски;

    - днище;

    - зеркала и салон;

    - любые повреждения на грунтовой дороге, если автомобиль не категории 4x4.


    Удар колесом о бордюр на обледеневшей улице — классический зимний эпизод, и оплачивает его полностью
    арендатор. Поэтому зимой доплата за SCDW (25–45 лари в сутки) оправдывает себя чаще, чем летом; тарифы
    по категориям — [на странице цен](/pricing/).


    ## Что входит в нашу зимнюю политику


    1. Зимняя резина на всех автомобилях с 1 декабря по 1 апреля — в стоимости.

    2. Цепи за 20 лари на аренду, на 4x4 — бесплатно.

    3. Помощь на дороге 24/7 по всей стране.

    4. Подменный автомобиль в течение 6 часов при технической неисправности.

    5. Бесплатный перенос дат, если машина свободна на новые даты — это прямо касается закрытий Гудаури.

    6. Средний возраст парка 4 года и обслуживание каждые 8 000 км: зимой это вопрос аккумулятора и тормозов,
    а не комфорта.


    ## Коротко


    Зимнее вождение в Грузии — совершенно нормальная история, если соблюдать три правила: **горы проезжать
    засветло, держать бак выше половины и оставлять запасной день под любой горный маршрут.** Остальное
    берём на себя мы.


    Категории и характеристики — [на странице автопарка](/fleet/), полные условия — [на странице условий](/terms/),
    оставшиеся вопросы — [в FAQ](/faq/) или напрямую [через контакты](/contact/).
fa:
  title: 'رانندگی زمستانی در گرجستان: آنچه باید بدانید'
  desc: >-
    لاستیک زمستانی از 1 دسامبر تا 1 آوریل، بسته شدن گودائوری و گردنه جواری، زنجیر چرخ، برنامه‌ریزی سوخت
    و روشنایی روز، شماره اضطراری 112 و آنچه سیاست زمستانی ما پوشش می‌دهد.
  keywords: >-
    رانندگی زمستانی در گرجستان, لاستیک زمستانی گرجستان, بهمن گودائوری, بسته شدن گردنه جواری, زنجیر چرخ
    گرجستان, اجاره خودرو زمستان گرجستان, کازبگی در زمستان
  lead: >-
    بزرگراه‌های اصلی گرجستان تمام زمستان باز می‌مانند، اما بخش‌های کوهستانی می‌توانند در یک روز چند بار
    تغییر چهره بدهند. این حداقلی است که یک راننده باید میان دسامبر تا آوریل بداند.
  body: >-
    ## لاستیک زمستانی — قاعده و تاریخ‌ها


    **از 1 دسامبر تا 1 آوریل همه خودروهای ناوگان Drive On با لاستیک زمستانی کار می‌کنند و این در نرخ
    گنجانده شده است** — چیزی برای سفارش دادن و چیزی برای پرداخت اضافی وجود ندارد. قوانین گرجستان در فصل
    سرد تجهیزات زمستانی مناسب را در مسیرهای کوهستانی الزامی می‌کند، و ما این الزام را به‌صورت پیش‌فرض
    در سراسر ناوگان رعایت می‌کنیم.


    یک نکته عملی که فراموش می‌شود: لاستیک زمستانی روی یخ معجزه نمی‌کند. فاصله ترمز را کوتاه می‌کند، اما
    با سرعت 60 کیلومتر بر ساعت در یک پیچ تند یخ‌زده هیچ چیز نجات‌تان نمی‌دهد. در کوهستان فاصله‌ای را که
    معمولاً از خودروی جلو نگه می‌دارید دو برابر کنید.


    ## زنجیر چرخ


    زنجیر تجهیزات جداگانه‌ای است و در مسیر گودائوری یا باکوریانی واقعاً از داشتنش خوشحال خواهید شد.


    | تجهیزات | هزینه | توضیح |

    |---|---|---|

    | لاستیک زمستانی | 0 ₾ | 1 دسامبر – 1 آوریل، در نرخ گنجانده شده |

    | زنجیر چرخ | 20 ₾ برای هر اجاره | در دسته 4x4 رایگان |

    | باربند سقفی (برای اسکی) | 25 ₾ در روز | فقط شاسی‌بلند و 4x4 |

    | تعویض لاستیک پس از آسیب | 120–400 ₾ | تحت پوشش بیمه نیست |


    بستن زنجیر را **پیش از حرکت** یاد بگیرید، در پارکینگی خشک، نه در دمای منفی 8 درجه در نیمه یک گردنه.
    در دفتر ما در خیابان واژا-پشاولا در دو دقیقه آن را نشانتان می‌دهیم.


    ## کدام جاده‌ها در زمستان واقعاً کار می‌کنند


    | مسیر | وضعیت زمستانی | دسته |

    |---|---|---|

    | تفلیس – باتومی (E60) | تمام سال باز | اقتصادی و بالاتر |

    | تفلیس – کازبگی | باز، بخش گودائوری گاه بسته می‌شود | کراس‌اوور |

    | بورجومی – باکوریانی | باز، اوج فصل | کراس‌اوور به‌همراه زنجیر |

    | زوگدیدی – مستیا | معمولاً باز، پس از برف سنگین کوتاه‌مدت بسته | 4x4 |

    | مستیا – اوشگولی | عملاً غیرقابل عبور | برای این مسیر اجاره داده نمی‌شود |

    | گردنه آبانو (توشتی) | از نوامبر تا مه بسته | — |

    | گردنه گودردزی | در کولاک اغلب بسته | 4x4 |


    **گودائوری و گردنه جواری** متغیر اصلی زمستان‌اند. جاده نظامی گرجستان از منطقه بهمن‌خیز می‌گذرد و اداره
    راه آن را پیشگیرانه می‌بندد — گاهی چند ساعت، گاهی یک روز کامل، در هر دو جهت. این نه خرابی است و نه
    چیزی که ما بتوانیم دور بزنیم: فقط باید صبر کنید.


    معنای این برای برنامه‌ریزی: **سفر رفت و برگشت یک‌روزه به کازبگی در زمستان فکر خوبی نیست.** اگر شب
    را در کازبگی بمانید و جاده بسته شود، یک روز دیرتر به تفلیس برمی‌گردید. اگر همان شب پرواز دارید، این
    خطر واقعی است. سفر را طوری بچینید که یک روز پیش از پرواز برگردید.


    ## سوخت و روشنایی روز


    در دسامبر خورشید در تفلیس حدود 17:20 غروب می‌کند و در یک دره کوهستانی هوا محسوس زودتر تاریک می‌شود.
    یعنی **پنجره رانندگی مفید شما تقریباً از 08:30 تا 16:30** است — هشت ساعت، نه دوازده. پیچ‌های کوهستانی،
    تاریکی و یخ نامرئی با هم ترکیبی است که هرگز به راننده مهمان توصیه نمی‌کنیم.


    - در نیمه باک سوخت بگیرید، نه با روشن شدن چراغ هشدار. ماندن در صف پشت یک راه‌بندان سوخت می‌سوزاند.

    - پمپ بنزین در کازبگی، اومالو، اوشگولی و شووی یا وجود ندارد یا قابل اتکا نیست.

    - پس از ژینوالی و پاساناوری، پمپ بنزین‌ها به‌سرعت کمیاب می‌شوند.

    - شارژر گوشی و یک پتو در خودرو نگه دارید. اگر جاده بسته شود، ممکن است دو ساعت با موتور خاموش منتظر
    بمانید.


    ## شماره‌های اضطراری


    - **112** — شماره واحد اضطراری گرجستان: پلیس، آمبولانس، آتش‌نشانی و نجات. اپراتورها انگلیسی صحبت می‌کنند.

    - **خط ویژه Drive On** — شبانه‌روزی. اگر ایراد فنی باشد و مقصر مستأجر نباشد، خودروی جایگزین ظرف
    6 ساعت و بدون هزینه به شما می‌رسد.


    پس از تصادف ترتیب کار این است: 1) با 112 تماس بگیرید؛ 2) با ما تماس بگیرید؛ 3) **تا تنظیم نشدن گزارش،
    محل را ترک نکنید.** رفتن بدون گزارش پلیس یعنی از دست دادن پوشش بیمه.


    ## بیمه در زمستان چه چیزی را پوشش می‌دهد و چه چیزی را نه


    CDW که در قیمت گنجانده شده، خسارت خودرو را بالاتر از فرانشیز پوشش می‌دهد (300 ₾ در کلاس اقتصادی، 1,200
    ₾ در 4x4). اما خسارتی که در زمستان واقعاً پیش می‌آید، معمولاً دقیقاً به همان قطعاتی می‌خورد که پوشش
    **ندارند**:


    - لاستیک و رینگ؛

    - کف خودرو؛

    - آینه‌ها و فضای داخلی؛

    - هر خسارتی که در جاده خاکی وارد شود، مگر آنکه خودرو در دسته 4x4 باشد.


    سُر خوردن چرخ به جدول خیابانی یخ‌زده حادثه کلاسیک زمستان است و تمام آن بر عهده مستأجر می‌ماند. به
    همین دلیل افزودن SCDW با روزی 25–45 لاری در زمستان بیش از تابستان به‌صرفه است — نرخ‌ها به تفکیک دسته
    در [صفحه قیمت‌ها](/pricing/) آمده است.


    ## سیاست زمستانی ما چه چیزی را شامل می‌شود


    1. لاستیک زمستانی روی همه خودروها از 1 دسامبر تا 1 آوریل، گنجانده در نرخ.

    2. زنجیر با 20 لاری برای هر اجاره، در 4x4 رایگان.

    3. امدادرسانی شبانه‌روزی در سراسر کشور.

    4. خودروی جایگزین ظرف 6 ساعت در صورت ایراد فنی.

    5. تغییر رایگان تاریخ‌ها در صورت موجود بودن خودرو در تاریخ جدید — که وقتی گودائوری بسته می‌شود مستقیماً
    به کار می‌آید.

    6. میانگین عمر ناوگان 4 سال با سرویس هر 8,000 کیلومتر. در زمستان این مسئله باتری و ترمز است، نه مسئله
    راحتی.


    ## خلاصه


    رانندگی زمستانی در گرجستان کاملاً عادی است اگر سه قاعده را رعایت کنید: **در روشنایی روز از کوهستان
    بگذرید، باک را بالای نیمه نگه دارید، و برای هر سفر یک‌روزه کوهستانی یک روز ذخیره کنار بگذارید.** بقیه‌اش
    با ما.


    دسته‌ها و مشخصات در [صفحه ناوگان](/fleet/)، شرایط کامل در [صفحه شرایط](/terms/) و هر پرسش باقی‌مانده
    در [پرسش‌های متداول](/faq/) یا مستقیم از راه [تماس](/contact/).
he:
  title: 'נהיגה בגאורגיה בחורף: מה שצריך לדעת'
  desc: >-
    צמיגי חורף מ-1 בדצמבר עד 1 באפריל, סגירות גודאורי ומעבר ג'ווארי, שרשראות שלג, תכנון דלק ואור יום,
    מספר החירום 112 ומה מכסה מדיניות החורף שלנו.
  keywords: >-
    נהיגה בחורף בגאורגיה, צמיגי חורף בגאורגיה, מפולות בגודאורי, מעבר ג'ווארי סגור, שרשראות שלג בגאורגיה,
    השכרת רכב בגאורגיה בחורף, קזבגי בחורף
  lead: >-
    הכבישים הראשיים של גאורגיה נשארים פתוחים כל החורף, אבל הקטעים ההרריים עשויים לשנות אופי כמה פעמים
    ביום אחד. לפניכם המינימום שנהג צריך לדעת בין דצמבר לאפריל.
  body: >-
    ## צמיגי חורף — הכלל והתאריכים


    **מ-1 בדצמבר עד 1 באפריל כל רכב בצי של Drive On נוסע על צמיגי חורף, וזה כלול בתעריף** — אין מה להזמין
    ואין תוספת תשלום. התקנות בגאורגיה מחייבות ציוד חורף מתאים בדרכי ההרים בעונה הקרה, ואנחנו פשוט עומדים
    בדרישה כברירת מחדל בכל הצי.


    נקודה מעשית שנוטים לשכוח: צמיגי חורף אינם קסם על קרח. הם מקצרים את מרחק הבלימה, אבל ב-60 קמ"ש בסיבוב
    פרסה קפוא שום דבר לא יציל אתכם. בהרים, הכפילו את מרחק העצירה שאתם שומרים בדרך כלל.


    ## שרשראות שלג


    השרשראות הן ציוד נפרד, ובנסיעות לגודאורי או לבקוריאני תשמחו באמת שהן איתכם.


    | ציוד | עלות | הערות |

    |---|---|---|

    | צמיגי חורף | 0 ₾ | 1 בדצמבר – 1 באפריל, כלול בתעריף |

    | שרשראות שלג | 20 ₾ להשכרה | ללא תשלום בקטגוריית 4x4 |

    | גגון (למגלשי סקי) | 25 ₾ ליום | רק ברכבי שטח וב-4x4 |

    | החלפת צמיג לאחר נזק | 120–400 ₾ | אינה מכוסה בביטוח |


    למדו להרכיב את השרשראות **לפני היציאה**, בחניון יבש, ולא במינוס 8 מעלות באמצע מעבר הרים. נעביר לכם
    את זה בשתי דקות במשרד שלנו בשדרות ואז'ה-פשאוולה.


    ## אילו דרכים באמת עובדות בחורף


    | מסלול | מצב בחורף | קטגוריה |

    |---|---|---|

    | טביליסי – בטומי (E60) | פתוח כל השנה | אקונומי ומעלה |

    | טביליסי – קזבגי | פתוח, קטע גודאורי נסגר לסירוגין | קרוסאובר |

    | בורג'ומי – בקוריאני | פתוח, שיא העונה | קרוסאובר בתוספת שרשראות |

    | זוגדידי – מסטיה | פתוח בדרך כלל, נסגר לזמן קצר אחרי שלג כבד | 4x4 |

    | מסטיה – אושגולי | למעשה בלתי עביר | לא מושכר למסלול הזה |

    | מעבר אבאנו (תושתי) | סגור מנובמבר עד מאי | — |

    | מעבר גודרדזי | נסגר לעיתים קרובות בסופות שלגים | 4x4 |


    **גודאורי ומעבר ג'ווארי** הם המשתנה החורפי המרכזי. כביש הצבא הגאורגי עובר בשטח מפולות, ורשות הדרכים
    סוגרת אותו מראש — לפעמים לכמה שעות, לפעמים ליום שלם, בשני הכיוונים. זו אינה תקלה ואין לנו דרך לעקוף
    אותה: פשוט מחכים.


    מה זה אומר לתכנון: **נסיעה הלוך ושוב לקזבגי באותו יום בחורף היא רעיון גרוע.** אם אתם לנים בקזבגי והדרך
    נסגרת, אתם חוזרים לטביליסי יום מאוחר יותר. אם יש לכם טיסה באותו ערב, הסיכון ממשי. תכננו את הנסיעה
    כך שתחזרו יום לפני הטיסה.


    ## דלק ואור יום


    בדצמבר השמש שוקעת בטביליסי סביב 17:20, ובעמק הררי מחשיך מוקדם בהרבה. כלומר **חלון הנהיגה השימושי שלכם
    הוא בערך מ-08:30 עד 16:30** — שמונה שעות, לא שתים עשרה. סרפנטינות הרים, חושך וקרח שקוף יחד הם צירוף
    שלעולם איננו ממליצים עליו לנהג אורח.


    - תדלקו בחצי מיכל ולא כשנורית האזהרה נדלקת. המתנה בתור מאחורי חסימה שורפת דלק.

    - תחנות דלק בקזבגי, באומאלו, באושגולי ובשובי או שאינן קיימות או שאינן אמינות.

    - אחרי ז'ינוואלי ופסנאורי התחנות מידלדלות במהירות.

    - החזיקו במכונית מטען לטלפון ושמיכה. אם הדרך נסגרת, ייתכן שתמתינו שעתיים עם מנוע כבוי.


    ## מספרי חירום


    - **112** — מספר החירום האחיד של גאורגיה: משטרה, אמבולנס, כיבוי אש וחילוץ. המוקדנים דוברים אנגלית.

    - **הקו החם של Drive On** — 24/7. אם התקלה טכנית ואינה באשמת השוכר, רכב חלופי מגיע אליכם בתוך 6
    שעות ללא תשלום.


    אחרי תאונה הסדר הוא: 1) התקשרו ל-112; 2) התקשרו אלינו; 3) **אל תעזבו את המקום עד שנערך הדוח.** עזיבה
    בלי דוח משטרה משמעה אובדן הכיסוי הביטוחי.


    ## מה הביטוח מכסה ומה אינו מכסה בחורף


    ה-CDW הכלול במחיר מכסה נזק לרכב מעל להשתתפות העצמית (300 ₾ באקונומי, 1,200 ₾ ברכב 4x4). אלא שהנזק
    שבאמת קורה בחורף נוטה לפגוע בדיוק בחלקים ש**אינם** מכוסים:


    - צמיגים וחישוקים;

    - תחתית הרכב;

    - מראות ותא הנוסעים;

    - כל נזק שנגרם בדרך לא סלולה, אלא אם הרכב שייך לקטגוריית 4x4.


    החלקה של גלגל אל תוך אבן שפה ברחוב מכוסה קרח היא תקרית החורף הקלאסית, והיא כולה על חשבון השוכר. לכן
    הוספת SCDW ב-25–45 לארי ליום משתלמת בחורף לעיתים קרובות יותר מאשר בקיץ — התעריפים לפי קטגוריה מופיעים
    בעמוד [מחירים](/pricing/).


    ## מה כוללת מדיניות החורף שלנו


    1. צמיגי חורף בכל רכב מ-1 בדצמבר עד 1 באפריל, כלול בתעריף.

    2. שרשראות ב-20 לארי להשכרה, ללא תשלום ברכבי 4x4.

    3. סיוע בדרכים 24/7 בכל הארץ.

    4. רכב חלופי בתוך 6 שעות במקרה של תקלה טכנית.

    5. שינוי תאריכים ללא תשלום כשהרכב פנוי בתאריכים החדשים — מה שרלוונטי ישירות כשגודאורי נסגרת.

    6. גיל ממוצע של 4 שנים לצי ותחזוקה כל 8,000 ק"מ. בחורף זו שאלה של מצבר ובלמים, לא של נוחות.


    ## בקצרה


    נהיגה בחורף בגאורגיה היא עניין רגיל לחלוטין אם שומרים על שלושה כללים: **חוצים את ההרים באור יום, נשארים
    מעל חצי מיכל, ומשאירים יום רזרבה אחרי כל טיול הררי.** את השאר אנחנו מסדרים.


    הקטגוריות והמפרטים בעמוד [צי הרכב](/fleet/), התנאים המלאים בעמוד [תנאים](/terms/), וכל השאר בעמוד
    [שאלות נפוצות](/faq/) או ישירות דרך [יצירת קשר](/contact/).
ar:
  title: 'القيادة في جورجيا شتاءً: ما يجب أن تعرفه'
  desc: >-
    إطارات شتوية من 1 ديسمبر إلى 1 أبريل، وإغلاقات غودواري وممر جفاري، وسلاسل الثلج، وتخطيط الوقود وساعات
    النهار، ورقم الطوارئ 112، وما تغطيه سياستنا الشتوية.
  keywords: >-
    القيادة الشتوية في جورجيا, إطارات شتوية في جورجيا, انهيارات غودواري الثلجية, إغلاق ممر جفاري, سلاسل
    الثلج في جورجيا, تأجير سيارات في جورجيا شتاءً, كازبيغي في الشتاء
  lead: >-
    تبقى الطرق السريعة الرئيسية في جورجيا مفتوحة طوال الشتاء، لكن المقاطع الجبلية قد تتبدّل عدة مرات في
    اليوم الواحد. إليك الحد الأدنى الذي ينبغي لأي سائق معرفته بين ديسمبر وأبريل.
  body: >-
    ## الإطارات الشتوية — القاعدة والتواريخ


    **من 1 ديسمبر إلى 1 أبريل تسير كل سيارة في أسطول Drive On على إطارات شتوية، وهذا مشمول في السعر**
    — فلا شيء تطلبه ولا شيء تدفعه إضافياً. تشترط الأنظمة الجورجية تجهيزات شتوية مناسبة على الطرق الجبلية
    في الموسم البارد، ونحن نلبي هذا الشرط تلقائياً في الأسطول كله.


    ونقطة عملية ينساها الناس: الإطارات الشتوية ليست سحراً على الجليد. إنها تقصّر مسافة الفرملة، لكن عند
    60 كم/س في منعطف حاد متجمد لن ينقذك شيء. في الجبال، ضاعف مسافة الأمان التي تتركها عادة.


    ## سلاسل الثلج


    السلاسل تجهيز منفصل، وفي طريق غودواري أو باكورياني ستسعد فعلاً بوجودها معك.


    | التجهيز | التكلفة | ملاحظات |

    |---|---|---|

    | إطارات شتوية | 0 ₾ | من 1 ديسمبر إلى 1 أبريل، مشمولة في السعر |

    | سلاسل ثلج | 20 ₾ لكل عقد استئجار | مجانية في فئة 4x4 |

    | حمّالة سقف (للتزلج) | 25 ₾ في اليوم | لسيارات الدفع الرباعي و4x4 فقط |

    | استبدال إطار بعد التلف | 120–400 ₾ | غير مشمول بالتأمين |


    تعلّم تركيب السلاسل **قبل الانطلاق**، في موقف جاف، لا عند 8 درجات تحت الصفر في منتصف ممر جبلي. سنشرح
    لك ذلك في دقيقتين في مكتبنا في جادة فاجا-بشافيلا.


    ## أي الطرق تعمل فعلاً في الشتاء


    | المسار | الوضع الشتوي | الفئة |

    |---|---|---|

    | تبليسي – باتومي (E60) | مفتوح طوال العام | اقتصادية فأعلى |

    | تبليسي – كازبيغي | مفتوح، ومقطع غودواري يُغلق دورياً | كروس أوفر |

    | بورجومي – باكورياني | مفتوح، ذروة الموسم | كروس أوفر مع سلاسل |

    | زوغديدي – ميستيا | مفتوح عادة، ويُغلق فترة قصيرة بعد تساقط كثيف | 4x4 |

    | ميستيا – أوشغولي | غير سالك عملياً | لا نؤجر لهذا المسار |

    | ممر أبانو (توشيتي) | مغلق من نوفمبر إلى مايو | — |

    | ممر غوديردزي | يُغلق كثيراً أثناء العواصف الثلجية | 4x4 |


    **غودواري وممر جفاري** هما المتغير الشتوي الأهم. فالطريق العسكري الجورجي يمر بمنطقة انهيارات ثلجية،
    وتغلقه إدارة الطرق وقائياً — أحياناً لبضع ساعات وأحياناً ليوم كامل، وفي الاتجاهين معاً. وهذا ليس عطلاً
    ولا شيئاً نستطيع تجاوزه: عليك أن تنتظر فحسب.


    وما يعنيه ذلك للتخطيط: **رحلة ذهاب وعودة إلى كازبيغي في اليوم نفسه شتاءً فكرة سيئة.** فإن بتّ في كازبيغي
    وأُغلق الطريق، عدت إلى تبليسي بعد يوم. وإن كانت لديك رحلة طيران في المساء نفسه فالمخاطرة حقيقية. رتّب
    القيادة بحيث تعود قبل موعد طيرانك بيوم.


    ## الوقود وساعات النهار


    في ديسمبر تغرب الشمس في تبليسي نحو الساعة 17:20، وفي واد جبلي يحل الظلام أبكر بوضوح. وهذا يمنحك **نافذة
    قيادة مفيدة من نحو 08:30 حتى 16:30** — ثماني ساعات لا اثنتي عشرة. أما المنعطفات الجبلية والظلام والجليد
    الشفاف مجتمعة فتركيبة لا ننصح بها سائقاً زائراً أبداً.


    - عبّئ الوقود عند نصف الخزان لا عند إضاءة لمبة التحذير. فالوقوف في طابور خلف إغلاق يستهلك وقوداً.

    - محطات الوقود في كازبيغي وأومالو وأوشغولي وشوفي إما معدومة وإما غير موثوقة.

    - وبعد جينفالي وباساناوري تتناقص المحطات بسرعة.

    - احتفظ بشاحن هاتف وبطانية في السيارة. فإن أُغلق الطريق فقد تنتظر ساعتين والمحرك مطفأ.


    ## أرقام الطوارئ


    - **112** — رقم الطوارئ الموحّد في جورجيا: الشرطة والإسعاف والإطفاء والإنقاذ. والعاملون عليه يتحدثون
    الإنجليزية.

    - **الخط الساخن لدى Drive On** — على مدار الساعة. وإذا كان العطل فنياً ولا يعود إلى المستأجر، تصلك
    سيارة بديلة خلال 6 ساعات دون رسوم.


    وبعد الحادث يكون الترتيب: 1) اتصل بـ 112؛ 2) اتصل بنا؛ 3) **لا تغادر الموقع قبل تحرير المحضر.** فالمغادرة
    دون محضر شرطة تعني فقدان غطاء التأمين.


    ## ماذا يغطي التأمين وماذا لا يغطي في الشتاء


    يغطي تأمين CDW المشمول في السعر الأضرار اللاحقة بالمركبة فوق مبلغ التحمّل (300 ₾ في الفئة الاقتصادية،
    و1,200 ₾ في سيارة 4x4). غير أن الأضرار التي تقع فعلاً في الشتاء تصيب عادةً الأجزاء التي **لا** يشملها
    التأمين بالذات:


    - الإطارات والجنوط؛

    - أسفل الهيكل؛

    - المرايا والمقصورة؛

    - أي ضرر يقع على طريق غير معبّد ما لم تكن السيارة من فئة 4x4.


    انزلاق عجلة نحو الرصيف في شارع مكسو بالجليد هو حادث الشتاء الكلاسيكي، وهو بالكامل على حساب المستأجر.
    ولهذا فإن إضافة SCDW بسعر 25–45 لاري يومياً تؤتي ثمارها في الشتاء أكثر منها في الصيف — والأسعار حسب
    الفئة في [صفحة الأسعار](/pricing/).


    ## ماذا تشمل سياستنا الشتوية


    1. إطارات شتوية في كل سيارة من 1 ديسمبر إلى 1 أبريل، مشمولة في السعر.

    2. سلاسل بـ 20 لاري لكل عقد استئجار، ومجانية في سيارات 4x4.

    3. مساعدة على الطريق على مدار الساعة في جميع أنحاء البلاد.

    4. سيارة بديلة خلال 6 ساعات عند وقوع عطل فني.

    5. تغيير مجاني للتواريخ متى توفرت السيارة في المواعيد الجديدة — وهو ما يهم مباشرة حين يُغلق غودواري.

    6. متوسط عمر الأسطول 4 سنوات مع صيانة كل 8,000 كم. وفي الشتاء هذه مسألة بطارية وفرامل لا مسألة راحة.


    ## باختصار


    القيادة الشتوية في جورجيا أمر طبيعي تماماً إن التزمت بثلاث قواعد: **اعبر الجبال في ضوء النهار، وابقَ
    فوق نصف الخزان، واترك يوماً احتياطياً بعد أي رحلة جبلية.** والباقي علينا.


    الفئات والمواصفات في [صفحة الأسطول](/fleet/)، والشروط كاملة في [صفحة الشروط](/terms/)، وما تبقى في
    [الأسئلة الشائعة](/faq/) أو مباشرة عبر [الاتصال](/contact/).
