ka:
  title: როგორ ვიქირაოთ მანქანა საქართველოში — ინსტრუქცია
  desc: >-
    საბუთები, საერთაშორისო მართვის მოწმობა, ასაკობრივი ზღვარი, დეპოზიტის ბლოკირება, ფრანშიზა, ფოტოფიქსაცია
    და საზღვრის კვეთა — ნაბიჯ-ნაბიჯ უცხოელისთვის.
  keywords: >-
    როგორ ვიქირაო მანქანა საქართველოში, საბუთები მანქანის ქირაობაზე, საერთაშორისო მართვის მოწმობა, დეპოზიტი,
    how to rent a car in georgia, IDP georgia
  lead: >-
    საქართველოში ავტომობილის დაქირავება ევროპულთან შედარებით მარტივია, მაგრამ სამი დეტალი — მართვის მოწმობის
    ანბანი, დეპოზიტის ბლოკირება და ფრანშიზა — სტაბილურად იწვევს გაუგებრობას. ეს ინსტრუქცია ჯავშნიდან ჩაბარებამდე
    მიდის.
  body: >
    ## ნაბიჯი 1. კატეგორიისა და ვადის შერჩევა


    ჯერ მარშრუტი განსაზღვრეთ, მერე მანქანა. ასფალტზე — ეკონომ კლასი 75 ლარიდან, მთის მარშრუტებზე — კროსოვერი
    130 ლარიდან, გრუნტზე (უშგული, თუშეთი) — მხოლოდ მაღალი გამავლობის 4x4 240 ლარიდან. მინივენი 200 ლარიდან
    7–8 კაცისთვის, კომერციული ფურგონი — 185 ლარიდან.


    ვადა ფასზე პირდაპირ აისახება: **7 დღიდან −10%, 30 დღიდან −25%.** ივლის-აგვისტოში მოქმედებს სეზონური
    კოეფიციენტი +15%, სააღდგომო და საახალწლო კვირაზე +10%. სრული ცხრილი — [ფასების გვერდზე](/pricing/).


    ## ნაბიჯი 2. ჯავშანი


    საიტს ონლაინ გადახდის მოდული არ აქვს — ჯავშანი ტელეფონით ან ელფოსტით ხდება და **წინასწარი გადახდა
    არ საჭიროებს.** გვჭირდება: თარიღები, კატეგორია, მიღების ადგილი და თქვენი ასაკი (ეს ტარიფზე მოქმედებს).


    გაუქმების პირობები: 48 საათზე ადრე — უფასოდ; 24–48 საათით ადრე — ერთი დღის ტარიფი; 24 საათზე ნაკლები
    ან გამოუცხადებლობა — ორი დღის ტარიფი. თარიღების შეცვლა უფასოა, თუ ავტომობილი თავისუფალია.


    ## ნაბიჯი 3. საბუთები


    | ვინ ხართ | პირადობა | მართვის მოწმობა | დამატებით |

    |---|---|---|---|

    | საქართველოს მოქალაქე | პირადობის მოწმობა | ეროვნული, 2+ წლის სტაჟით | ბარათი დეპოზიტისთვის |

    | უცხოელი, ლათინური ანბანი | პასპორტი | ეროვნული მოწმობა | ბარათი დეპოზიტისთვის |

    | უცხოელი, არალათინური ანბანი | პასპორტი | ეროვნული + IDP | ბარათი დეპოზიტისთვის |

    | იურიდიული პირი | ამონაწერი რეესტრიდან | მძღოლის მოწმობა | მინდობილობა, ბეჭედი |


    **საერთაშორისო მართვის მოწმობა (IDP) საჭიროა მხოლოდ მაშინ, თუ თქვენი ეროვნული მოწმობა ლათინური ანბანით
    არ არის შედგენილი** — მაგალითად არაბული, ჩინური ან იაპონური. ევროკავშირის, აშშ-ის, დიდი ბრიტანეთის,
    ისრაელისა და დსთ-ს ქვეყნების მოწმობები საქართველოში პირდაპირ მოქმედებს და IDP-ს არ საჭიროებს. IDP
    დამოუკიდებელი დოკუმენტი არაა: ის მხოლოდ ეროვნულ მოწმობასთან ერთად მოქმედებს.


    ## ნაბიჯი 4. ასაკი და სტაჟი


    | კატეგორია | მინიმალური ასაკი | სტაჟი | ახალგაზრდა მძღოლის დანამატი |

    |---|---|---|---|

    | ეკონომ კლასი | 21 | 2 წელი | — |

    | კროსოვერი / SUV | 23 | 3 წელი | 15 ₾ (23–25 წელი) |

    | მინივენი | 23 | 3 წელი | 15 ₾ (23–25 წელი) |

    | ბიზნეს კლასი | 25 | 5 წელი | 25 ₾ (25–27 წელი) |

    | მაღალი გამავლობის 4x4 | 25 | 4 წელი | 25 ₾ (25–27 წელი) |

    | კომერციული ფურგონი | 25 | 3 წელი | — |


    ზედა ასაკობრივი ზღვარი არ არსებობს. მეორე მძღოლი — 20 ლარი დღეში, მაქსიმუმ ორი; თითოეულს იგივე მოთხოვნები
    აქვს და ხელშეკრულებას აწერს ხელს.


    ## ნაბიჯი 5. დეპოზიტი — როგორ მუშაობს ბლოკირება


    ეს ის პუნქტია, სადაც ყველაზე ხშირი გაუგებრობაა. **თანხა ბარათზე იბლოკება, არ ჩამოიჭრება.** ბანკი ავტორიზაციას
    ადგენს: თანხა ხელმისაწვდომ ლიმიტში აღარ ჩანს, მაგრამ ანგარიშიდან არ გადის.


    - ეკონომ კლასი — 300 ₾, კროსოვერი — 600 ₾, ბიზნესი და მინივენი — 1 000 ₾, ფურგონი — 800 ₾, 4x4 — 1
    200 ₾.

    - გათავისუფლება ხდება ავტომობილის ჩაბარებიდან **3 სამუშაო დღეში**, თუ დაზიანება და ჯარიმა არ არის.

    - საკრედიტო ბარათზე ბლოკირება ლიმიტს ეხება; სადებეტოზე — რეალურ ფულს. მოგზაურობის ბიუჯეტს ეს გაითვალისწინეთ.

    - ნაღდით გადახდისას დეპოზიტიც ნაღდით მიიღება და ადგილზე ბრუნდება.


    ## ნაბიჯი 6. დაზღვევა და ფრანშიზა


    ფასში შედის **CDW** (ავტომობილის დაზიანება) და **TPL** (მესამე პირის წინაშე პასუხისმგებლობა). CDW
    თქვენს პასუხისმგებლობას ფრანშიზის ოდენობით ზღუდავს: 300 ლარი ეკონომზე, 1 200 ლარი 4x4-ზე. ანუ სერიოზული
    დაზიანებისასაც კი ხარჯი ფრანშიზაზე მეტი არ იქნება.


    **SCDW** (25–45 ₾ დღეში) ფრანშიზას ნულამდე აყვანს — 4x4-ზე 300 ლარამდე.


    დაზღვევა **არ ფარავს**: ალკოჰოლის ან ნარკოტიკის ზემოქმედების ქვეშ მართვას; ხელშეკრულებაში ჩაუწერელი
    პირის მიერ მართვას; გრუნტოვან გზაზე მიღებულ ზიანს, თუ ავტომობილი 4x4 არ არის; საბურავებს, დისკებს,
    ქვედა ნაწილს და სალონს; გასაღების დაკარგვას (400–1 200 ₾); კომერციულ გამოყენებას.


    ## ნაბიჯი 7. მიღება-ჩაბარება და ფოტოფიქსაცია


    მიღებისას ვადგენთ აქტს ფოტოებით: **ოთხივე მხარე, სალონი, გარბენი და საწვავის დონე.** იგივე პროცედურა
    მეორდება ჩაბარებისას — სწორედ ეს ხსნის დავას დაზიანებაზე.


    დათვალიერებისას თავად შეამოწმეთ:


    1. ყველა ნაკაწრი აქტში აისახა თუ არა — ეჭვის შემთხვევაში მოითხოვეთ დამატებითი ფოტო;

    2. ლობინის მინა ბზარებზე;

    3. საბურავების მდგომარეობა და სათადარიგო ბორბალი, ჯეკი, ბალონის გასაღები;

    4. საწვავის ტიპი — ბენზინი თუ დიზელი; **არასწორი საწვავი დაზღვევით არ იფარება**;

    5. ხელთათმანების ყუთში სატრანსპორტო საშუალების მოწმობა და დაზღვევის პოლისი;

    6. ზამთარში — ჯაჭვები (20 ₾ გაქირავებაზე, 4x4-ზე უფასოდ).


    ## ნაბიჯი 8. საზღვრის კვეთა


    | ქვეყანა | სტატუსი | ღირებულება | დღიური ლიმიტი |

    |---|---|---|---|

    | სომხეთი | ნებადართული | 150 ₾ | 300 კმ |

    | თურქეთი | ნებადართული (ცალკეული კატეგორიები) | 250 ₾ | 300 კმ |

    | აზერბაიჯანი | აკრძალული | — | — |

    | რუსეთი | აკრძალული | — | — |


    ნებართვა **მინიმუმ 48 საათით ადრე** უნდა მოვამზადოთ: საჭიროა საერთაშორისო სადაზღვევო პოლისი და მინდობილობა.
    ნებართვის გარეშე საზღვრის კვეთა ხელშეკრულების დარღვევაა და მთელი დეპოზიტის დაკარგვას იწვევს.


    ## ნაბიჯი 9. დაბრუნება


    საწვავის პრინციპი **„სავსე → სავსე“**: ბაკს სავსე იღებთ და სავსე აბარებთ. არასრული ბაკი — საწვავის
    ღირებულება პლუს 20 ლარი მომსახურებისთვის. 2 საათამდე დაგვიანება უფასოა, შემდეგ დღიური ტარიფის ერთი
    მესამედი ყოველ დაწყებულ 3 საათზე. სხვა ქალაქში დაბრუნება შესაძლებელია: თბილისი↔ქუთაისი↔ბათუმი 100
    ლარიდან.


    ## რვა ყველაზე ხშირი შეცდომა


    1. **IDP-ს გარეშე ჩამოსვლა, როცა ის საჭიროა.** არალათინური მოწმობა IDP-ს გარეშე გაქირავების უარყოფის
    საფუძველია.

    2. **ბარათის ლიმიტის უგულებელყოფა.** 1 200 ლარიანი ბლოკი 4x4-ზე მოგზაურობის ბიუჯეტს ამცირებს.

    3. **ეკონომ კლასით გრუნტზე გასვლა.** უშგულამდე ან ომალომდე მიღებული დაზიანება არ იფარება — ეს ხელშეკრულების
    პირდაპირი პუნქტია.

    4. **ჩქარი დათვალიერება.** ხუთი წუთი ფოტოებზე ორასჯერ იაფია, ვიდრე დავა ჩაბარებისას.

    5. **ჯარიმის დავიწყება.** ჯარიმა 30 დღის განმავლობაში მოდის; ერიცხება თანხა პლუს 20 ლარი.

    6. **დღეში 500 კმ-ის დაგეგმვა.** მთაში საშუალო სიჩქარე 45 კმ/სთ-ია.

    7. **ჩაბარებამდე ბაკის შეუვსებლობა.** აეროპორტთან ბოლო გასამართი წერტილი ყოველთვის ღია არ არის.

    8. **საზღვრის კვეთის გვიან შეთანხმება.** 48 საათი ტექნიკური მინიმუმია, არა ფორმალობა.


    სრული პირობები — [პირობების გვერდზე](/terms/), დანარჩენი კითხვები — [FAQ-ში](/faq/), კომპანიაზე —
    [ჩვენ შესახებ](/about/). ჯავშნისთვის დაგვირეკეთ [კონტაქტის გვერდიდან](/contact/).
en:
  title: 'How to rent a car in Georgia: a step-by-step guide'
  desc: >-
    Documents, IDP rules, age limits, how the deposit block works, insurance and excess explained, the
    handover photo protocol and cross-border rules for foreign drivers.
  keywords: >-
    how to rent a car in Georgia, documents to rent a car Georgia, IDP Georgia, international driving
    permit, car rental deposit Georgia, car hire Tbilisi guide
  lead: >-
    Renting a car in Georgia is simpler than in most of Europe, but three details reliably cause confusion
    for visitors: which alphabet your licence is printed in, how the deposit block works, and what the
    excess actually means. This guide runs from booking to return.
  body: >
    ## Step 1. Choose the category and the length


    Pick the route first and the car second. For asphalt, economy class from 75 GEL a day is plenty; for
    mountain routes a crossover from 130 GEL; for gravel — Ushguli, Tusheti — only the off-road 4x4 from
    240 GEL is permitted. A minivan for seven or eight starts at 200 GEL, a commercial van at 185 GEL.


    Length moves the price directly: **from 7 days −10%, from 30 days −25%.** A seasonal coefficient of
    +15% applies in July and August, and +10% over the Easter and New Year weeks. The complete table is
    on the [pricing page](/pricing/).


    ## Step 2. Book


    Submit a booking request on the car page. The booking is confirmed only after availability is checked and the required payment is completed.
    We need your dates, the category, the pickup point and your age, since age affects the rate.


    Cancellation terms: more than 48 hours ahead is free; 24 to 48 hours ahead costs one day's rate; less
    than 24 hours or a no-show costs two days' rate. Changing the dates is free if the car is available.


    ## Step 3. Documents


    | Who you are | Identity | Driving licence | Additional |

    |---|---|---|---|

    | Georgian citizen | ID card | National, held 2+ years | Card for the deposit |

    | Foreign national, Latin alphabet | Passport | National licence | Card for the deposit |

    | Foreign national, non-Latin alphabet | Passport | National plus IDP | Card for the deposit |

    | Company | Extract from the register | Driver's licence | Power of attorney, stamp |


    **An International Driving Permit is needed only if your national licence is not issued in the Latin
    alphabet** — an Arabic, Chinese or Japanese licence, for instance. Licences from the EU, the USA,
    the United Kingdom, Israel and the CIS countries are valid in Georgia as they are. Note too that an
    IDP is never a standalone document: it is only valid alongside the national licence it translates.


    ## Step 4. Age and experience


    | Category | Minimum age | Experience | Young driver surcharge |

    |---|---|---|---|

    | Economy class | 21 | 2 years | — |

    | Crossover / SUV | 23 | 3 years | 15 ₾ (ages 23–25) |

    | Minivan | 23 | 3 years | 15 ₾ (ages 23–25) |

    | Business class | 25 | 5 years | 25 ₾ (ages 25–27) |

    | Off-road 4x4 | 25 | 4 years | 25 ₾ (ages 25–27) |

    | Commercial van | 25 | 3 years | — |


    There is no upper age limit. A second driver costs 20 GEL per day, up to two in total; each must meet
    the same requirements and sign the agreement.


    ## Step 5. The deposit — how the card block works


    This is where most misunderstandings happen. **The money is blocked on your card, not charged to it.**
    The bank places an authorisation hold: the amount disappears from your available limit but never leaves
    your account.


    - Economy 300 ₾, crossover 600 ₾, business class and minivan 1,000 ₾, commercial van 800 ₾, off-road
    4x4 1,200 ₾.

    - The hold is released within **3 business days** of the car being returned, provided there is no
    damage and no fine.

    - On a credit card the block eats into your limit; on a debit card it freezes real money. Budget for
    that on a longer trip.

    - If you pay in cash, the deposit is taken in cash and handed back on the spot.


    ## Step 6. Insurance and the excess


    The rate includes **CDW** (damage to the vehicle) and **TPL** (third-party liability). CDW caps your
    liability at the excess: 300 GEL on economy class, up to 1,200 GEL on a 4x4. Even in a serious incident
    your exposure does not exceed that figure. **SCDW** at 25–45 GEL per day takes the excess to zero
    — on a 4x4 down to 300 GEL.


    The insurance does **not** cover: driving under the influence of alcohol or drugs; driving by anyone
    not named in the agreement; damage taken on unpaved roads unless the car is a 4x4; tyres, wheels,
    the underbody and the interior; lost keys (400–1,200 GEL); and any commercial use.


    ## Step 7. Handover and the photo protocol


    At handover we complete a report with photographs: **all four sides, the interior, the odometer and
    the fuel level.** The identical procedure runs on return, and it is what removes any argument about
    damage.


    While you inspect the car, check for yourself:


    1. that every existing scratch is recorded — ask for an extra photo if you are unsure;

    2. the windscreen for chips and cracks;

    3. tyre condition, plus the spare wheel, jack and wheel brace;

    4. the fuel type, petrol or diesel — **misfuelling is not covered by the insurance**;

    5. the vehicle registration document and insurance policy in the glovebox;

    6. in winter, the snow chains (20 ₾ per rental, free on a 4x4).


    ## Step 8. Cross-border travel


    | Country | Status | Cost | Daily limit |

    |---|---|---|---|

    | Armenia | Permitted | 150 ₾ | 300 km |

    | Turkey | Permitted (selected categories) | 250 ₾ | 300 km |

    | Azerbaijan | Prohibited | — | — |

    | Russia | Prohibited | — | — |


    Permission has to be arranged **at least 48 hours in advance**, because an international insurance
    policy and a power of attorney must be prepared. Crossing without permission breaches the agreement
    and forfeits the entire deposit.


    ## Step 9. Returning the car


    Fuel runs **full to full**: you receive a full tank and return a full tank. A short tank costs the
    price of the fuel plus a 20 GEL service fee. Late return is free for up to 2 hours, then one third
    of the daily rate for every 3 hours started. Returning in another city is possible: Tbilisi↔Kutaisi↔Batumi
    from 100 GEL.


    ## Eight mistakes visitors make


    1. **Arriving without an IDP when one is required.** A non-Latin licence with no IDP is grounds for
    refusing the rental.

    2. **Ignoring the card limit.** A 1,200 GEL hold on a 4x4 takes a real bite out of a travel budget.

    3. **Taking an economy car onto gravel.** Damage on the way to Ushguli or Omalo is not covered — that
    is an explicit clause, not a technicality.

    4. **Rushing the inspection.** Five minutes of photographs is two hundred times cheaper than a dispute
    at the return.

    5. **Forgetting about fines.** They can arrive up to 30 days later and are charged with a 20 GEL processing
    fee.

    6. **Planning 500 km in a day.** Your mountain average is 45 km/h, not 90.

    7. **Not refuelling before the return.** The last station before the airport is not always open.

    8. **Arranging a border crossing too late.** The 48 hours is a technical minimum, not a formality.


    The full conditions are on the [terms page](/terms/), remaining questions in the [FAQ](/faq/), and
    background on the company in [about us](/about/). To book, call or write from the [contact page](/contact/).
ru:
  title: 'Как арендовать машину в Грузии: инструкция'
  desc: >-
    Документы, международные права, возрастные ограничения, блокировка депозита, франшиза, фотофиксация
    при выдаче и правила выезда за границу — пошагово для иностранцев.
  keywords: >-
    как арендовать машину в Грузии, документы для аренды авто, международные права IDP, депозит при аренде
    авто, прокат авто Тбилиси инструкция
  lead: >-
    Арендовать автомобиль в Грузии проще, чем в большинстве стран Европы, но три детали стабильно вызывают
    вопросы: алфавит ваших прав, механика блокировки депозита и смысл франшизы. Эта инструкция ведёт от
    брони до возврата.
  body: >
    ## Шаг 1. Выбрать категорию и срок


    Сначала маршрут, потом машина. Для асфальта достаточно эконом-класса от 75 лари в сутки. Для горных
    направлений — кроссовер от 130 лари. Для грунта (Ушгули, Тушетия) разрешён только внедорожник 4x4
    от 240 лари. Минивэн на 7–8 человек — от 200 лари, коммерческий фургон — от 185.


    Срок напрямую влияет на цену: **от 7 дней −10%, от 30 дней −25%.** В июле и августе действует сезонный
    коэффициент +15%, на пасхальной и новогодней неделе +10%. Полная таблица — [на странице цен](/pricing/).


    ## Шаг 2. Забронировать


    Отправьте запрос со страницы автомобиля. Бронь подтверждается после проверки доступности и обязательной оплаты.
    От вас нужны даты, категория, точка подачи и возраст — он влияет на тариф.


    Условия отмены: более чем за 48 часов — бесплатно; за 24–48 часов — тариф одних суток; менее чем за
    24 часа или неявка — тариф двух суток. Перенос дат бесплатный, если машина свободна.


    ## Шаг 3. Документы


    | Кто вы | Личность | Водительские права | Дополнительно |

    |---|---|---|---|

    | Гражданин Грузии | Удостоверение личности | Национальные, стаж 2+ года | Карта для депозита |

    | Иностранец, латиница | Паспорт | Национальные права | Карта для депозита |

    | Иностранец, не латиница | Паспорт | Национальные + IDP | Карта для депозита |

    | Юридическое лицо | Выписка из реестра | Права водителя | Доверенность, печать |


    **Международные права (IDP) нужны только в том случае, если ваше национальное удостоверение оформлено
    не латиницей** — например арабской, китайской или японской графикой. Права стран ЕС, США, Великобритании,
    Израиля и СНГ действуют в Грузии напрямую, IDP не требуется. И ещё: IDP не самостоятельный документ,
    он действителен только вместе с национальными правами.


    ## Шаг 4. Возраст и стаж


    | Категория | Минимальный возраст | Стаж | Надбавка молодого водителя |

    |---|---|---|---|

    | Эконом-класс | 21 | 2 года | — |

    | Кроссовер / SUV | 23 | 3 года | 15 ₾ (23–25 лет) |

    | Минивэн | 23 | 3 года | 15 ₾ (23–25 лет) |

    | Бизнес-класс | 25 | 5 лет | 25 ₾ (25–27 лет) |

    | Внедорожник 4x4 | 25 | 4 года | 25 ₾ (25–27 лет) |

    | Коммерческий фургон | 25 | 3 года | — |


    Верхней возрастной границы нет. Второй водитель — 20 лари в сутки, максимум двое; каждый должен соответствовать
    тем же требованиям и подписать договор.


    ## Шаг 5. Депозит: как работает блокировка


    Здесь возникает больше всего недоразумений. **Сумма блокируется на карте, а не списывается.** Банк
    ставит авторизационный холд: деньги исчезают из доступного лимита, но со счёта не уходят.


    - Эконом 300 ₾, кроссовер 600 ₾, бизнес-класс и минивэн 1 000 ₾, фургон 800 ₾, внедорожник 4x4 1 200
    ₾.

    - Холд снимается в течение **3 рабочих дней** после возврата автомобиля, если нет повреждений и штрафов.

    - На кредитной карте блокируется лимит, на дебетовой — реальные деньги. В длинной поездке это стоит
    заложить в бюджет.

    - При оплате наличными депозит принимается наличными и возвращается на месте.


    ## Шаг 6. Страховка и франшиза


    В тариф входят **CDW** (повреждение автомобиля) и **TPL** (ответственность перед третьими лицами).
    CDW ограничивает вашу ответственность размером франшизы: 300 лари на эконом-классе и до 1 200 лари
    на 4x4. Даже при серьёзном повреждении расход не превысит эту сумму.


    **SCDW** за 25–45 лари в сутки обнуляет франшизу; на 4x4 она снижается до 300 лари.


    Страховка **не покрывает**: управление в состоянии алкогольного или наркотического опьянения; управление
    лицом, не вписанным в договор; повреждения на грунтовых дорогах, если автомобиль не категории 4x4;
    шины, диски, днище и салон; утерю ключей (400–1 200 лари); коммерческое использование.


    ## Шаг 7. Выдача и фотофиксация


    При выдаче составляется акт с фотографиями: **все четыре стороны, салон, пробег и уровень топлива.**
    Та же процедура повторяется при возврате — именно она снимает споры о повреждениях.


    Пока осматриваете машину, проверьте сами:


    1. занесена ли в акт каждая царапина — при сомнении просите дополнительное фото;

    2. лобовое стекло на сколы и трещины;

    3. состояние шин, а также запаску, домкрат и баллонный ключ;

    4. тип топлива, бензин или дизель — **заправка не тем топливом страховкой не покрывается**;

    5. свидетельство о регистрации и страховой полис в бардачке;

    6. зимой — цепи противоскольжения (20 ₾ за аренду, на 4x4 бесплатно).


    ## Шаг 8. Выезд за границу


    | Страна | Статус | Стоимость | Суточный лимит |

    |---|---|---|---|

    | Армения | Разрешён | 150 ₾ | 300 км |

    | Турция | Разрешён (отдельные категории) | 250 ₾ | 300 км |

    | Азербайджан | Запрещён | — | — |

    | Россия | Запрещён | — | — |


    Разрешение готовится **минимум за 48 часов**: нужны международный страховой полис и доверенность.
    Пересечение границы без разрешения — нарушение договора и потеря всего депозита.


    ## Шаг 9. Возврат


    Топливная политика — **«полный → полный»**: получаете полный бак и возвращаете полный. Неполный бак
    обойдётся в стоимость топлива плюс 20 лари за услугу. Опоздание до 2 часов бесплатно, далее треть
    суточного тарифа за каждые начатые 3 часа. Вернуть машину в другом городе можно: Тбилиси↔Кутаиси↔Батуми
    от 100 лари.


    ## Восемь типичных ошибок


    1. **Приехать без IDP, когда он нужен.** Права не латиницей без IDP — основание для отказа в аренде.

    2. **Не учесть лимит карты.** Холд в 1 200 лари на 4x4 заметно урезает бюджет поездки.

    3. **Выехать на грунт на эконом-классе.** Повреждения по дороге в Ушгули или Омало не покрываются
    — это прямой пункт договора, а не формальность.

    4. **Осмотреть машину наспех.** Пять минут на фотографии в двести раз дешевле спора при возврате.

    5. **Забыть про штрафы.** Приходят в течение 30 дней и начисляются вместе с 20 лари за администрирование.

    6. **Запланировать 500 км за день.** В горах средняя скорость 45 км/ч, а не 90.

    7. **Не заправиться перед возвратом.** Последняя заправка перед аэропортом работает не всегда.

    8. **Поздно согласовать выезд за границу.** 48 часов — технический минимум, а не формальность.


    Полные условия — [на странице условий](/terms/), остальные вопросы — [в FAQ](/faq/), о компании —
    [в разделе о нас](/about/). Для брони позвоните или напишите [со страницы контактов](/contact/).
fa:
  title: 'چگونه در گرجستان خودرو اجاره کنیم: راهنمای گام‌به‌گام'
  desc: >-
    مدارک لازم، قواعد گواهینامه بین‌المللی، محدودیت سن، نحوه بلوکه شدن ودیعه، توضیح بیمه و فرانشیز، پروتکل
    عکس هنگام تحویل و قواعد عبور از مرز برای رانندگان خارجی.
  keywords: >-
    چگونه در گرجستان ماشین اجاره کنیم, مدارک اجاره خودرو در گرجستان, گواهینامه بین‌المللی رانندگی گرجستان,
    ودیعه اجاره خودرو گرجستان, راهنمای کرایه ماشین تفلیس
  lead: >-
    اجاره خودرو در گرجستان از بیشتر کشورهای اروپایی ساده‌تر است، اما سه نکته همیشه بازدیدکنندگان را دچار
    سردرگمی می‌کند: گواهینامه‌تان به کدام الفبا چاپ شده، بلوکه شدن ودیعه چگونه کار می‌کند، و فرانشیز در
    عمل یعنی چه. این راهنما از رزرو تا بازگرداندن خودرو را پوشش می‌دهد.
  body: >-
    ## گام 1. انتخاب دسته و مدت


    اول مسیر را انتخاب کنید، بعد خودرو را. برای آسفالت، کلاس اقتصادی از روزی 75 لاری کاملاً کافی است؛
    برای مسیرهای کوهستانی یک کراس‌اوور از 130 لاری؛ برای جاده خاکی — اوشگولی، توشتی — تنها آفرود 4x4 از
    240 لاری مجاز است. ون هفت یا هشت‌نفره از 200 لاری و ون باری از 185 لاری شروع می‌شود.


    مدت اجاره مستقیم روی قیمت اثر می‌گذارد: **از 7 روز −10٪، از 30 روز −25٪.** ضریب فصلی +15٪ در ژوئیه
    و اوت و +10٪ در هفته‌های عید پاک و سال نو اعمال می‌شود. جدول کامل در [صفحه قیمت‌ها](/pricing/) آمده
    است.


    ## گام 2. رزرو


    درخواست را در صفحه خودرو ارسال کنید. رزرو پس از بررسی موجودی و پرداخت الزامی تأیید می‌شود.
    به تاریخ‌ها، دسته خودرو، محل تحویل و سن شما نیاز داریم، چون سن روی نرخ اثر می‌گذارد.


    شرایط لغو: بیش از 48 ساعت پیش از موعد رایگان است؛ 24 تا 48 ساعت پیش از موعد معادل نرخ یک روز؛ کمتر
    از 24 ساعت یا عدم حضور معادل نرخ دو روز. تغییر تاریخ در صورت موجود بودن خودرو رایگان است.


    ## گام 3. مدارک


    | شما چه کسی هستید | هویت | گواهینامه رانندگی | مدارک تکمیلی |

    |---|---|---|---|

    | شهروند گرجستان | کارت شناسایی | گواهینامه ملی، حداقل 2 سال سابقه | کارت بانکی برای ودیعه |

    | تبعه خارجی، الفبای لاتین | گذرنامه | گواهینامه ملی | کارت بانکی برای ودیعه |

    | تبعه خارجی، الفبای غیرلاتین | گذرنامه | گواهینامه ملی به‌همراه IDP | کارت بانکی برای ودیعه |

    | شرکت | رونوشت ثبت شرکت | گواهینامه راننده | وکالت‌نامه و مهر |


    **گواهینامه بین‌المللی رانندگی تنها زمانی لازم است که گواهینامه ملی شما به الفبای لاتین صادر نشده
    باشد** — مثلاً گواهینامه عربی، چینی یا ژاپنی. گواهینامه‌های اتحادیه اروپا، ایالات متحده، بریتانیا،
    اسرائیل و کشورهای مستقل مشترک‌المنافع در گرجستان همان‌گونه که هستند معتبرند. این را هم بدانید که IDP
    هرگز سندی مستقل نیست: تنها در کنار همان گواهینامه ملی که ترجمه‌اش می‌کند اعتبار دارد.


    ## گام 4. سن و سابقه


    | دسته | حداقل سن | سابقه | هزینه اضافی راننده جوان |

    |---|---|---|---|

    | کلاس اقتصادی | 21 | 2 سال | — |

    | کراس‌اوور / شاسی‌بلند | 23 | 3 سال | 15 ₾ (23–25 سال) |

    | ون | 23 | 3 سال | 15 ₾ (23–25 سال) |

    | کلاس بیزنس | 25 | 5 سال | 25 ₾ (25–27 سال) |

    | آفرود 4x4 | 25 | 4 سال | 25 ₾ (25–27 سال) |

    | ون باری | 25 | 3 سال | — |


    سقف سنی وجود ندارد. راننده دوم روزی 20 لاری هزینه دارد و در مجموع تا دو نفر پذیرفته می‌شود؛ هر کدام
    باید همان شرایط را داشته باشند و قرارداد را امضا کنند.


    ## گام 5. ودیعه — بلوکه شدن روی کارت چگونه کار می‌کند


    بیشتر سوءتفاهم‌ها همین‌جا رخ می‌دهد. **پول روی کارت شما بلوکه می‌شود، نه برداشت.** بانک یک مجوز نگهداری
    ثبت می‌کند: مبلغ از سقف قابل استفاده شما کم می‌شود اما هرگز از حسابتان خارج نمی‌شود.


    - اقتصادی 300 ₾، کراس‌اوور 600 ₾، کلاس بیزنس و ون 1,000 ₾، ون باری 800 ₾، آفرود 4x4 1,200 ₾.

    - بلوکه ظرف **3 روز کاری** پس از بازگرداندن خودرو آزاد می‌شود، به شرط نبودن خسارت و جریمه.

    - روی کارت اعتباری، بلوکه از سقف اعتبار شما می‌کاهد؛ روی کارت نقدی، پول واقعی را منجمد می‌کند. در
    سفرهای طولانی این را در بودجه ببینید.

    - اگر نقدی پرداخت کنید، ودیعه نقدی گرفته و همان‌جا بازگردانده می‌شود.


    ## گام 6. بیمه و فرانشیز


    نرخ شامل **CDW** (خسارت خودرو) و **TPL** (مسئولیت در برابر شخص ثالث) است. CDW مسئولیت شما را تا سقف
    فرانشیز محدود می‌کند: 300 لاری در کلاس اقتصادی و تا 1,200 لاری در 4x4. حتی در حادثه‌ای جدی، بار شما
    از این عدد بالاتر نمی‌رود. **SCDW** با روزی 25–45 لاری فرانشیز را صفر می‌کند — و در 4x4 به 300 لاری
    می‌رساند.


    بیمه این موارد را پوشش **نمی‌دهد**: رانندگی تحت تأثیر الکل یا مواد مخدر؛ رانندگی هر کسی که نامش در
    قرارداد نیامده؛ خسارت واردشده در جاده‌های خاکی مگر آنکه خودرو 4x4 باشد؛ لاستیک، رینگ، کف خودرو و فضای
    داخلی؛ گم شدن کلید (400–1,200 لاری)؛ و هرگونه استفاده تجاری.


    ## گام 7. تحویل و پروتکل عکس


    هنگام تحویل، صورت‌جلسه‌ای همراه با عکس تنظیم می‌کنیم: **هر چهار طرف خودرو، فضای داخلی، کیلومترشمار
    و سطح سوخت.** همین روند هنگام بازگرداندن هم اجرا می‌شود و همین است که جای بحث درباره خسارت را از میان
    برمی‌دارد.


    هنگام بازدید خودرو، خودتان این‌ها را بررسی کنید:


    1. اینکه هر خط و خش موجود ثبت شده باشد — اگر مطمئن نیستید عکس اضافه بخواهید؛

    2. شیشه جلو از نظر ترک و سنگ‌خوردگی؛

    3. وضعیت لاستیک‌ها، به‌همراه زاپاس، جک و آچار چرخ؛

    4. نوع سوخت، بنزین یا دیزل — **سوخت‌گیری اشتباه تحت پوشش بیمه نیست**؛

    5. سند خودرو و بیمه‌نامه در داشبورد؛

    6. در زمستان، زنجیر چرخ (20 ₾ برای هر اجاره، در 4x4 رایگان).


    ## گام 8. سفر برون‌مرزی


    | کشور | وضعیت | هزینه | سقف روزانه |

    |---|---|---|---|

    | ارمنستان | مجاز | 150 ₾ | 300 کیلومتر |

    | ترکیه | مجاز (دسته‌های منتخب) | 250 ₾ | 300 کیلومتر |

    | آذربایجان | ممنوع | — | — |

    | روسیه | ممنوع | — | — |


    اجازه باید **دست‌کم 48 ساعت پیش‌تر** گرفته شود، چون بیمه‌نامه بین‌المللی و وکالت‌نامه باید آماده شود.
    عبور بدون اجازه نقض قرارداد است و تمام ودیعه را از بین می‌برد.


    ## گام 9. بازگرداندن خودرو


    سوخت با قاعده **پر تحویل، پر تحویل** حساب می‌شود: باک پر تحویل می‌گیرید و باک پر برمی‌گردانید. باک
    کم، بهای سوخت به‌علاوه 20 لاری هزینه خدمات دارد. تأخیر در بازگرداندن تا 2 ساعت رایگان است، پس از آن
    به ازای هر 3 ساعت شروع‌شده یک‌سوم نرخ روزانه. بازگرداندن در شهری دیگر ممکن است: تفلیس↔کوتایسی↔باتومی
    از 100 لاری.


    ## هشت اشتباه رایج بازدیدکنندگان


    1. **آمدن بدون IDP وقتی لازم است.** گواهینامه غیرلاتین بدون IDP دلیل کافی برای رد اجاره است.

    2. **نادیده گرفتن سقف کارت.** بلوکه 1,200 لاری روی یک 4x4 برش واقعی از بودجه سفر می‌گیرد.

    3. **بردن خودروی اقتصادی روی جاده خاکی.** خسارت در راه اوشگولی یا اومالو پوشش ندارد — این یک بند صریح
    است، نه ریزه‌کاری حقوقی.

    4. **عجله در بازدید خودرو.** پنج دقیقه عکس گرفتن دویست برابر ارزان‌تر از یک اختلاف هنگام تحویل است.

    5. **فراموش کردن جریمه‌ها.** ممکن است تا 30 روز بعد برسند و با 20 لاری هزینه رسیدگی محاسبه شوند.

    6. **برنامه‌ریزی 500 کیلومتر در یک روز.** میانگین شما در کوهستان 45 کیلومتر بر ساعت است، نه 90.

    7. **سوخت نگرفتن پیش از تحویل.** آخرین پمپ بنزین پیش از فرودگاه همیشه باز نیست.

    8. **دیر اقدام کردن برای عبور از مرز.** آن 48 ساعت یک حداقل فنی است، نه تشریفات.


    شرایط کامل در [صفحه شرایط](/terms/)، پرسش‌های باقی‌مانده در [پرسش‌های متداول](/faq/) و معرفی شرکت
    در [درباره ما](/about/) آمده است. برای رزرو، از [صفحه تماس](/contact/) زنگ بزنید یا برای ما بنویسید.
he:
  title: 'איך לשכור רכב בגאורגיה: מדריך שלב אחר שלב'
  desc: >-
    מסמכים, כללי רישיון נהיגה בינלאומי, מגבלות גיל, איך עובדת חסימת הפיקדון, ביטוח והשתתפות עצמית, פרוטוקול
    הצילום במסירה וכללי מעבר גבול לנהגים זרים.
  keywords: >-
    איך לשכור רכב בגאורגיה, מסמכים להשכרת רכב בגאורגיה, רישיון נהיגה בינלאומי לגאורגיה, פיקדון השכרת רכב
    בגאורגיה, מדריך השכרת רכב בטביליסי
  lead: >-
    שכירת רכב בגאורגיה פשוטה יותר מברוב אירופה, אבל שלושה פרטים מבלבלים מבקרים כמעט תמיד: באיזה אלפבית
    מודפס הרישיון שלכם, איך עובדת חסימת הפיקדון, ומה בעצם אומרת ההשתתפות העצמית. המדריך הזה מוביל מההזמנה
    ועד ההחזרה.
  body: >-
    ## שלב 1. בחירת הקטגוריה ומשך ההשכרה


    בחרו קודם את המסלול ורק אחר כך את הרכב. לאספלט מחלקת אקונומי מ-75 לארי ליום מספיקה בהחלט; למסלולי
    הרים קרוסאובר מ-130 לארי; לחצץ — אושגולי, תושתי — מותר רק רכב שטח 4x4 מ-240 לארי. מיניוואן לשבעה או
    שמונה מתחיל ב-200 לארי, ורכב מסחרי ב-185 לארי.


    משך ההשכרה משפיע ישירות על המחיר: **מ-7 ימים −10%, מ-30 ימים −25%.** מקדם עונתי של +15% חל ביולי ובאוגוסט,
    ו-+10% בשבועות הפסחא והשנה החדשה. הטבלה המלאה נמצאת בעמוד [מחירים](/pricing/).


    ## שלב 2. הזמנה


    שלחו בקשה מדף הרכב. ההזמנה מאושרת לאחר בדיקת זמינות והשלמת התשלום הנדרש. אנחנו צריכים
    את התאריכים, את הקטגוריה, את נקודת האיסוף ואת גילכם, מפני שהגיל משפיע על התעריף.


    תנאי ביטול: יותר מ-48 שעות מראש — ללא חיוב; 24 עד 48 שעות מראש — תעריף יום אחד; פחות מ-24 שעות או
    אי-הגעה — תעריף יומיים. שינוי תאריכים ללא חיוב אם הרכב פנוי.


    ## שלב 3. מסמכים


    | מי אתם | זהות | רישיון נהיגה | נוסף |

    |---|---|---|---|

    | אזרח גאורגי | תעודת זהות | רישיון לאומי, ותק שנתיים ומעלה | כרטיס לפיקדון |

    | אזרח זר, אלפבית לטיני | דרכון | רישיון לאומי | כרטיס לפיקדון |

    | אזרח זר, אלפבית לא לטיני | דרכון | רישיון לאומי בתוספת IDP | כרטיס לפיקדון |

    | חברה | נסח מרשם החברות | רישיון הנהג | ייפוי כוח וחותמת |


    **רישיון נהיגה בינלאומי נדרש רק אם הרישיון הלאומי שלכם אינו מונפק באלפבית הלטיני** — רישיון בערבית,
    בסינית או ביפנית, למשל. רישיונות מהאיחוד האירופי, מארצות הברית, מבריטניה, מישראל וממדינות חבר העמים
    תקפים בגאורגיה כמות שהם. שימו לב גם שה-IDP לעולם אינו מסמך עצמאי: הוא תקף רק לצד הרישיון הלאומי שאותו
    הוא מתרגם.


    ## שלב 4. גיל וותק


    | קטגוריה | גיל מינימלי | ותק | תוספת נהג צעיר |

    |---|---|---|---|

    | מחלקת אקונומי | 21 | שנתיים | — |

    | קרוסאובר / רכב פנאי | 23 | 3 שנים | 15 ₾ (גילאי 23–25) |

    | מיניוואן | 23 | 3 שנים | 15 ₾ (גילאי 23–25) |

    | מחלקת עסקים | 25 | 5 שנים | 25 ₾ (גילאי 25–27) |

    | רכב שטח 4x4 | 25 | 4 שנים | 25 ₾ (גילאי 25–27) |

    | רכב מסחרי | 25 | 3 שנים | — |


    אין גיל מרבי. נהג נוסף עולה 20 לארי ליום, עד שניים בסך הכול; כל אחד מהם חייב לעמוד באותן דרישות ולחתום
    על ההסכם.


    ## שלב 5. הפיקדון — איך עובדת חסימת הכרטיס


    כאן קורות רוב אי-ההבנות. **הכסף נחסם בכרטיס שלכם ואינו נגבה ממנו.** הבנק מציב הרשאת חיוב: הסכום נעלם
    מהמסגרת הפנויה שלכם אך אינו יוצא מהחשבון.


    - אקונומי 300 ₾, קרוסאובר 600 ₾, מחלקת עסקים ומיניוואן 1,000 ₾, רכב מסחרי 800 ₾, רכב שטח 4x4 1,200
    ₾.

    - החסימה משוחררת בתוך **3 ימי עסקים** מהחזרת הרכב, בתנאי שאין נזק ואין דוח.

    - בכרטיס אשראי החסימה אוכלת מהמסגרת; בכרטיס דביט היא מקפיאה כסף אמיתי. תקצבו זאת בטיול ארוך.

    - אם אתם משלמים במזומן, הפיקדון נלקח במזומן ומוחזר במקום.


    ## שלב 6. ביטוח והשתתפות עצמית


    התעריף כולל **CDW** (נזק לרכב) ו-**TPL** (חבות כלפי צד שלישי). ה-CDW מגביל את חבותכם לגובה ההשתתפות
    העצמית: 300 לארי במחלקת אקונומי, ועד 1,200 לארי ברכב 4x4. גם בתאונה חמורה החשיפה שלכם אינה עולה על
    הסכום הזה. **SCDW** ב-25–45 לארי ליום מאפס את ההשתתפות העצמית — וברכב 4x4 מוריד אותה ל-300 לארי.


    הביטוח **אינו** מכסה: נהיגה תחת השפעת אלכוהול או סמים; נהיגה של מי שאינו רשום בהסכם; נזק שנגרם בדרכים
    לא סלולות אלא אם הרכב הוא 4x4; צמיגים, חישוקים, תחתית הרכב ותא הנוסעים; אובדן מפתחות (400–1,200 לארי);
    וכל שימוש מסחרי.


    ## שלב 7. המסירה ופרוטוקול הצילום


    במסירה אנחנו ממלאים דוח מלווה בתצלומים: **כל ארבע הדפנות, תא הנוסעים, מד הקילומטרים ומפלס הדלק.**
    אותו נוהל בדיוק מתבצע בהחזרה, וזה מה שמסלק כל ויכוח על נזק.


    בזמן שאתם בודקים את הרכב, בדקו בעצמכם:


    1. שכל שריטה קיימת תועדה — בקשו תצלום נוסף אם אינכם בטוחים;

    2. את השמשה הקדמית לאיתור מכות אבן וסדקים;

    3. את מצב הצמיגים, וגם את הגלגל הרזרבי, המגבה ומפתח הגלגלים;

    4. את סוג הדלק, בנזין או דיזל — **תדלוק שגוי אינו מכוסה בביטוח**;

    5. את רישיון הרכב ופוליסת הביטוח בתא הכפפות;

    6. בחורף, את שרשראות השלג (20 ₾ להשכרה, ללא תשלום ברכב 4x4).


    ## שלב 8. נסיעה מעבר לגבול


    | מדינה | מעמד | עלות | מגבלה יומית |

    |---|---|---|---|

    | ארמניה | מותר | 150 ₾ | 300 ק"מ |

    | טורקיה | מותר (בקטגוריות נבחרות) | 250 ₾ | 300 ק"מ |

    | אזרבייג'ן | אסור | — | — |

    | רוסיה | אסור | — | — |


    את האישור יש להסדיר **לפחות 48 שעות מראש**, משום שצריך להכין פוליסת ביטוח בינלאומית וייפוי כוח. חצייה
    ללא אישור מהווה הפרה של ההסכם ומחלטת את מלוא הפיקדון.


    ## שלב 9. החזרת הרכב


    הדלק פועל לפי **מלא–מלא**: אתם מקבלים מיכל מלא ומחזירים מיכל מלא. מיכל חסר עולה את מחיר הדלק בתוספת
    דמי טיפול של 20 לארי. איחור בהחזרה ללא חיוב עד שעתיים, ולאחר מכן שליש מהתעריף היומי על כל 3 שעות שהתחילו.
    אפשר להחזיר בעיר אחרת: טביליסי↔קוטאיסי↔בטומי מ-100 לארי.


    ## שמונה טעויות של מבקרים


    1. **להגיע בלי IDP כשהוא נדרש.** רישיון לא לטיני ללא IDP הוא עילה לסירוב להשכיר.

    2. **להתעלם ממסגרת הכרטיס.** חסימה של 1,200 לארי על רכב 4x4 נוגסת נגיסה אמיתית בתקציב הטיול.

    3. **להוציא רכב אקונומי לחצץ.** נזק בדרך לאושגולי או לאומאלו אינו מכוסה — זה סעיף מפורש, לא דקדוק
    משפטי.

    4. **למהר בבדיקת הרכב.** חמש דקות של צילומים זולות פי מאתיים ממחלוקת בהחזרה.

    5. **לשכוח מדוחות תנועה.** הם עשויים להגיע עד 30 יום לאחר מכן ומחויבים בתוספת דמי טיפול של 20 לארי.

    6. **לתכנן 500 ק"מ ביום.** הממוצע שלכם בהרים הוא 45 קמ"ש, לא 90.

    7. **לא לתדלק לפני ההחזרה.** התחנה האחרונה לפני שדה התעופה אינה תמיד פתוחה.

    8. **להסדיר מעבר גבול מאוחר מדי.** 48 השעות הן מינימום טכני, לא פורמליות.


    התנאים המלאים נמצאים בעמוד [תנאים](/terms/), שאלות שנותרו בעמוד [שאלות נפוצות](/faq/), ורקע על החברה
    בעמוד [אודות](/about/). להזמנה, התקשרו או כתבו דרך [עמוד יצירת הקשר](/contact/).
ar:
  title: 'كيف تستأجر سيارة في جورجيا: دليل خطوة بخطوة'
  desc: >-
    المستندات المطلوبة، وقواعد رخصة القيادة الدولية، وحدود العمر، وكيفية حجز مبلغ التأمين، وشرح التأمين
    والتحمّل، وبروتوكول صور التسليم، وقواعد عبور الحدود.
  keywords: >-
    كيف تستأجر سيارة في جورجيا, مستندات تأجير السيارات في جورجيا, رخصة القيادة الدولية في جورجيا, مبلغ
    التأمين لتأجير السيارات, دليل تأجير السيارات في تبليسي
  lead: >-
    استئجار سيارة في جورجيا أبسط منه في معظم أوروبا، لكن ثلاثة تفاصيل تربك الزوار دائماً: بأي أبجدية طُبعت
    رخصتك، وكيف يعمل حجز مبلغ التأمين، وماذا يعني التحمّل عملياً. يمتد هذا الدليل من الحجز حتى إعادة السيارة.
  body: >-
    ## الخطوة 1. اختيار الفئة والمدة


    اختر المسار أولاً والسيارة ثانياً. فللطرق المعبدة تكفي الفئة الاقتصادية ابتداءً من 75 لاري يومياً؛
    وللمسارات الجبلية سيارة كروس أوفر ابتداءً من 130 لاري؛ أما الطرق الترابية — أوشغولي وتوشيتي — فلا
    يُسمح فيها إلا بسيارة الطرق الوعرة 4x4 ابتداءً من 240 لاري. وتبدأ الحافلة الصغيرة لسبعة أو ثمانية
    ركاب من 200 لاري، والمركبة التجارية من 185 لاري.


    وتؤثر المدة في السعر مباشرة: **من 7 أيام −10٪، ومن 30 يوماً −25٪.** ويُطبَّق معامل موسمي +15٪ في يوليو
    وأغسطس، و+10٪ في أسبوعي عيد الفصح ورأس السنة. الجدول الكامل في [صفحة الأسعار](/pricing/).


    ## الخطوة 2. الحجز


    لا يتضمن الموقع وحدة دفع إلكتروني — فالحجز يتم بالهاتف أو بالبريد الإلكتروني و**لا يتطلب أي دفعة مقدمة**.
    نحتاج منك التواريخ والفئة ونقطة الاستلام وعمرك، لأن العمر يؤثر في السعر.


    شروط الإلغاء: قبل أكثر من 48 ساعة مجاناً؛ وقبل 24 إلى 48 ساعة بتكلفة سعر يوم واحد؛ وقبل أقل من 24
    ساعة أو عدم الحضور بتكلفة سعر يومين. أما تغيير التواريخ فمجاني ما دامت السيارة متاحة.


    ## الخطوة 3. المستندات


    | من أنت | إثبات الهوية | رخصة القيادة | مستندات إضافية |

    |---|---|---|---|

    | مواطن جورجي | بطاقة الهوية | رخصة وطنية بخبرة سنتين فأكثر | بطاقة لمبلغ التأمين |

    | مقيم أجنبي، أبجدية لاتينية | جواز السفر | رخصة وطنية | بطاقة لمبلغ التأمين |

    | مقيم أجنبي، أبجدية غير لاتينية | جواز السفر | رخصة وطنية مع IDP | بطاقة لمبلغ التأمين |

    | شركة | مستخرج من السجل التجاري | رخصة السائق | توكيل وختم |


    **لا تحتاج إلى رخصة قيادة دولية إلا إذا كانت رخصتك الوطنية غير صادرة بالأبجدية اللاتينية** — كالرخصة
    العربية أو الصينية أو اليابانية مثلاً. أما رخص الاتحاد الأوروبي والولايات المتحدة والمملكة المتحدة
    وإسرائيل ودول رابطة الدول المستقلة فسارية في جورجيا كما هي. ولاحظ كذلك أن IDP ليست وثيقة مستقلة أبداً:
    فهي لا تصلح إلا مرافقةً للرخصة الوطنية التي تترجمها.


    ## الخطوة 4. العمر والخبرة


    | الفئة | الحد الأدنى للسن | الخبرة | رسوم السائق الشاب |

    |---|---|---|---|

    | الفئة الاقتصادية | 21 | سنتان | — |

    | كروس أوفر / دفع رباعي حضري | 23 | 3 سنوات | 15 ₾ (من 23 إلى 25) |

    | حافلة صغيرة | 23 | 3 سنوات | 15 ₾ (من 23 إلى 25) |

    | فئة رجال الأعمال | 25 | 5 سنوات | 25 ₾ (من 25 إلى 27) |

    | طرق وعرة 4x4 | 25 | 4 سنوات | 25 ₾ (من 25 إلى 27) |

    | مركبة تجارية | 25 | 3 سنوات | — |


    لا يوجد حد أقصى للسن. ويكلف السائق الثاني 20 لاري يومياً بحد أقصى سائقَين اثنين؛ وعلى كل منهما استيفاء
    الشروط نفسها وتوقيع العقد.


    ## الخطوة 5. مبلغ التأمين — كيف يعمل الحجز على البطاقة


    هنا يقع معظم سوء الفهم. **المبلغ يُحجز على بطاقتك ولا يُخصم منها.** فالبنك يضع تفويضاً بالحجز: يختفي
    المبلغ من حدك المتاح لكنه لا يغادر حسابك أبداً.


    - الاقتصادية 300 ₾، الكروس أوفر 600 ₾، فئة رجال الأعمال والحافلة الصغيرة 1,000 ₾، المركبة التجارية
    800 ₾، الطرق الوعرة 4x4 1,200 ₾.

    - يُرفع الحجز خلال **3 أيام عمل** من إعادة السيارة، شريطة ألا يكون هناك ضرر أو مخالفة.

    - على بطاقة الائتمان يقتطع الحجز من حدك الائتماني؛ وعلى بطاقة الخصم يجمّد مالاً حقيقياً. ضع ذلك في
    حسابك في رحلة طويلة.

    - وإذا دفعت نقداً، يُؤخذ مبلغ التأمين نقداً ويُعاد إليك في المكان نفسه.


    ## الخطوة 6. التأمين والتحمّل


    يشمل السعر **CDW** (الضرر اللاحق بالمركبة) و**TPL** (المسؤولية تجاه الغير). ويحدّ CDW مسؤوليتك عند
    سقف التحمّل: 300 لاري في الفئة الاقتصادية، وحتى 1,200 لاري في سيارة 4x4. وحتى في حادث خطير لا يتجاوز
    تعرّضك هذا الرقم. أما **SCDW** بسعر 25–45 لاري يومياً فيصفّر مبلغ التحمّل — وفي سيارات 4x4 يخفضه إلى
    300 لاري.


    التأمين **لا** يغطي ما يلي: القيادة تحت تأثير الكحول أو المخدرات؛ وقيادة أي شخص غير مذكور في العقد؛
    والأضرار الواقعة على الطرق غير المعبدة ما لم تكن السيارة 4x4؛ والإطارات والجنوط وأسفل الهيكل والمقصورة؛
    وفقدان المفاتيح (400–1,200 لاري)؛ وأي استخدام تجاري.


    ## الخطوة 7. التسليم وبروتوكول الصور


    عند التسليم نُعدّ محضراً مرفقاً بالصور: **الجهات الأربع كلها، والمقصورة، وعداد المسافة، ومستوى الوقود.**
    ويجري الإجراء نفسه تماماً عند الإعادة، وهو ما يزيل أي جدال حول الأضرار.


    وبينما تعاين السيارة، تحقق بنفسك مما يلي:


    1. أن كل خدش قائم قد سُجّل — واطلب صورة إضافية إن لم تكن متأكداً؛

    2. الزجاج الأمامي بحثاً عن شظايا وشقوق؛

    3. حالة الإطارات، مع الإطار الاحتياطي والرافعة ومفتاح العجلات؛

    4. نوع الوقود، بنزين أم ديزل — **فالتعبئة الخاطئة غير مشمولة بالتأمين**؛

    5. وجود رخصة تسجيل المركبة ووثيقة التأمين في صندوق القفازات؛

    6. في الشتاء، سلاسل الثلج (20 ₾ لكل عقد استئجار، ومجانية في سيارات 4x4).


    ## الخطوة 8. السفر عبر الحدود


    | الدولة | الوضع | التكلفة | الحد اليومي |

    |---|---|---|---|

    | أرمينيا | مسموح | 150 ₾ | 300 كم |

    | تركيا | مسموح (لفئات مختارة) | 250 ₾ | 300 كم |

    | أذربيجان | ممنوع | — | — |

    | روسيا | ممنوع | — | — |


    يجب ترتيب الإذن **قبل 48 ساعة على الأقل**، لأنه يلزم إعداد وثيقة تأمين دولية وتوكيل. والعبور دون إذن
    يخالف العقد ويؤدي إلى مصادرة مبلغ التأمين كاملاً.


    ## الخطوة 9. إعادة السيارة


    يجري احتساب الوقود وفق قاعدة **ممتلئ إلى ممتلئ**: تستلم خزاناً ممتلئاً وتعيده ممتلئاً. والخزان الناقص
    يكلفك ثمن الوقود إضافة إلى 20 لاري رسوم خدمة. والتأخر في الإعادة مجاني حتى ساعتين، ثم ثلث السعر اليومي
    عن كل 3 ساعات مبتدأة. ويمكن الإعادة في مدينة أخرى: تبليسي↔كوتايسي↔باتومي ابتداءً من 100 لاري.


    ## ثمانية أخطاء يقع فيها الزوار


    1. **الوصول دون IDP حين تكون مطلوبة.** فالرخصة غير اللاتينية بلا IDP سبب كافٍ لرفض التأجير.

    2. **تجاهل حد البطاقة.** حجز 1,200 لاري على سيارة 4x4 يقتطع جزءاً حقيقياً من ميزانية الرحلة.

    3. **أخذ سيارة اقتصادية إلى الطرق الترابية.** فالضرر في الطريق إلى أوشغولي أو أومالو غير مغطى — وهذا
    بند صريح لا تفصيل شكلي.

    4. **الاستعجال في المعاينة.** خمس دقائق من التصوير أرخص مئتي مرة من نزاع عند الإعادة.

    5. **نسيان المخالفات.** فقد تصل بعد 30 يوماً وتُحتسب مع 20 لاري رسوم معالجة.

    6. **التخطيط لقطع 500 كم في يوم واحد.** فمتوسطك في الجبال 45 كم/س لا 90.

    7. **عدم التزود بالوقود قبل الإعادة.** فآخر محطة قبل المطار ليست مفتوحة دائماً.

    8. **ترتيب عبور الحدود متأخراً.** فالـ 48 ساعة حد أدنى تقني لا إجراء شكلي.


