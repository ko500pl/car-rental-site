    a: "نه. آسفالت تا مستیا و بخش اول جادّهٔ اوشگولی می‌رسد؛ بقیه gravel با چند گذر از رودخانه و ردهٔ آفرود است، 45-47 کیلومتر و حدود دو ساعت از مستیا. پس از باران به‌شدت خراب می‌شود."
  - q: "با خودروی معمولی می‌توان به مستیا رفت؟"
