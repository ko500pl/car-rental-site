  - q: "جادّهٔ اوشگولی کی باز است؟"
    a: "اوشگولی بهترین فصل ژوئن تا سپتامبر دارد و «نه در تمام سال» علامت خورده است. مسیر اکتشافی یادآوری می‌کند که در مه و اکتبر برف می‌تواند بی‌خبر جادّه را ببندد."
  - q: "شاسی‌بلند برای سوانتی کافی است؟"
    a: "برای مستیا، چالاادی، هاتسوالی و بچو بله. اوشگولی، کورولدی، آدیشی و یخچال شخارا ردهٔ آفرود دارند و داده‌ها می‌گویند خودروی کوتاه در قطعهٔ اوشگولی نه امن است و نه تحت پوشش."

he:
  name: "הדרך לסוואנטי: זוגדידי, מסטיה ואושגולי קטע אחר קטע"
  short: "470 ק\"מ אספלט עד מסטיה, ואז 45 ק\"מ של חצץ ומעברי נהר עד אושגולי. פני הדרך, גובה, עונה וקטגוריית הרכב שכל חצי של העמק דורש, מנתוני הדרכים שלנו."
  meta_title: "הדרך לסוואנטי: מסטיה ואושגולי קטע אחר קטע | RentUp"
  meta_description: "האם הדרך לאושגולי סלולה? הדרך לסוואנטי קטע אחר קטע: 470 ק\"מ אספלט עד מסטיה, ואז חצץ ומעברי נהר עד אושגולי. קטגוריית הרכב והעונה מהנתונים שלנו."
  body: |
    ## עמק אחד, שתי דרכים שונות לגמרי

    שאלת סוואנטי היא בעצם שתי שאלות. הדרך אל [מסטיה](/attractions/mestia/) מסווגת `paved` לכל
    470 הק"מ ו-8:30 מטביליסי. הדרך הלאה אל [אושגולי](/attractions/ushguli/) מסווגת `gravel`,
    בקטגוריית שטח, ומוסיפה 45 ק"מ ושעתיים. הנתונים שלנו רואים בהן שתי הזמנות שונות, וכך גם אתם.

    בגלל הפיצול הזה [משלחת סוואנטי](/routes/svaneti-expedition/) שלנו מסווגת שטח: חמישה ימים,
    1,050 ק"מ, 21 שעות נהיגה, דרגת קושי קשה, בעונה יוני עד ספטמבר. את הסיווג הזה מרוויח קטע אחד
    של 45 ק"מ.

    ## קטע אחר קטע

    ### טביליסי לקוטאיסי ולזוגדידי (0-320 ק"מ)

    זהו כביש E60 מערבה: גורי, חשורי, מנהרות ריקוטי, קוטאיסי, סמטרדיה וזוגדידי.
    [קתדרלת בגראטי](/attractions/bagrati-cathedral/) בקוטאיסי היא 230 ק"מ ו-3:20 מטביליסי;
    [ארמון דדיאני בזוגדידי](/attractions/dadiani-palace-zugdidi/) הוא 320 ק"מ ו-4:40 ב-100 מ'.
    כל המרחק סלול ומסווג אקונומי. תדלקו בקוטאיסי, בסמטרדיה או בזוגדידי, שהנתונים מכנים המקום
    האחרון עם מבחר אמיתי של תחנות לפני ההרים.

    ### זוגדידי לסכר אנגורי (320-350 ק"מ)

    מזוגדידי 30 ק"מ וכארבעים דקות צפון-מזרחה אל [סכר אנגורי](/attractions/enguri-dam/) בג'וארי:
    350 ק"מ ו-5:10 מטביליסי ב-300 מ', סלול, אקונומי, פתוח כל השנה. הסכר יושב ממש על הדרך למסטיה,
    כך שאין צורך בעיקוף; שעה מספיקה. עצירה על גב הסכר היא חניה במקום צר על כביש מעבר עמוס
    במשאיות, אז רדו לגמרי מהנתיב. מים ושירותים בג'וארי, לא בסכר.

    ### ערוץ אנגורי עד מסטיה (350-470 ק"מ)

    מעל הסכר מתחיל הערוץ ומטפס עד הסוף. 130 הק"מ מזוגדידי למסטיה סלולים לגמרי אבל צרים ומתפתלים
    בלי סוף; הנתונים אומרים להקצות שלוש שעות לקטע הזה בלבד. מסטיה היא 470 ק"מ ו-8:30 מטביליסי
    ב-1,500 מ', כלומר הערוץ מרים אתכם 1,200 מ' מהסכר. הדלק האמין האחרון בזוגדידי ובג'וארי.

    מסטיה מסווגת רכב שטח עירוני על אספלט, אחד מארבעה מקומות סלולים בלבד במאגר עם הסיווג הזה.
    הסיבה איננה פני הדרך אלא הגובה והחורף: הדרך נסגרת לפעמים אחרי מפולות שלגים, ורכב שטח עירוני
    פשוט נוח יותר בפיתולים הארוכים, אף שהנתונים אומרים שסדאן יסתדר. עונה מיטבית מאי-אוקטובר, פתוח
    כל השנה, ארבע שעות במקום. הנתונים ממליצים על שני לילות לפחות.

    ### מסטיה לאושגולי (470-515 ק"מ)

    אושגולי היא 515 ק"מ ו-10:30 מטביליסי ב-2,100 מ'. ממסטיה 45-47 ק"מ וכשעתיים: אספלט בהתחלה, ואז
    דרך חצץ ואבן שחוצה את הנהר כמה פעמים ומתדרדרת בחדות אחרי גשם. הנתונים מפורשים: כאן נדרש רכב
    עם גחון גבוה, ורכב נמוך בקטע הזה איננו בטוח ואיננו מכוסה. עונה מיטבית יוני-ספטמבר, לא פתוח כל
    השנה, ארבע שעות בכפרים. הדלק האחרון במסטיה.

    ## הדרכים היוצאות ממסטיה

    | מקום | דרך | רכב | גובה | ממסטיה | עונה |
    |---|---|---|---|---|---|
    | [קרחון צ'לאדי](/attractions/chalaadi-glacier/) | mostly_paved | רכב שטח עירוני | 1,900 מ' | 7-9 ק"מ | יוני-ספטמבר |
    | [הצוואלי וטטנולדי](/attractions/hatsvali-tetnuldi/) | mostly_paved | רכב שטח עירוני | 1,870 מ' | 8 / 15-16 ק"מ | דצמבר-מרץ |
    | [בצ'ו ומזרי](/attractions/becho-mazeri/) | gravel | רכב שטח עירוני | 1,600 מ' | פנייה 25 ק"מ לפני מסטיה | מאי-אוקטובר |
    | [אגמי קורולדי](/attractions/koruldi-lakes/) | 4x4_only | 4x4 שטח | 2,740 מ' | 10-12 ק"מ | יוני-ספטמבר |
    | [אדישי](/attractions/adishi/) | 4x4_only | 4x4 שטח | 2,040 מ' | פנייה 15 ק"מ לפני אושגולי | יוני-ספטמבר |
    | [קרחון שחארה](/attractions/shkhara-glacier/) | 4x4_only | 4x4 שטח | 2,350 מ' | מעבר לאושגולי | יוני-ספטמבר |

    צ'לאדי הוא אספלט ואז כמה ק"מ של חצץ עם בורות; ביובש רכב שטח עירוני עובר בקלות. קורולדי הוא
    דרך עפר תלולה של תשעים דקות לכל כיוון, והנתונים אומרים שלרכב שטח עירוני רגיל אין מה לחפש שם.
    אדישי הוא שבעה ק"מ של חצץ בעלייה, הנעה כפולה בלבד.

    ## איזו קטגוריה דורשים הנתונים

    - **טביליסי עד סכר אנגורי** - אקונומי לכל האורך.
    - **מסטיה, צ'לאדי, הצוואלי, בצ'ו** - רכב שטח עירוני. אם הטיול נגמר במסטיה,
      [רכב שטח עירוני](/car-rental/suv/) הוא ההזמנה הכנה.
    - **אושגולי, קורולדי, אדישי, שחארה** - שטח. הזמינו [4x4 שטח](/car-rental/4x4/).

    40 המ"מ שבין רכב שטח עירוני לרכב שטח הם כל הוויכוח במעברי הנהר של אושגולי; המספרים
    ב[האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).

    ## העונה הטובה, מהנתונים

    מסטיה נושאת מאי-אוקטובר ופתוחה כל השנה. אושגולי, צ'לאדי, קורולדי ואדישי נושאים יוני-ספטמבר
    ומסומנים כלא פתוחים כל השנה. הצוואלי וטטנולדי הפוכים, דצמבר-מרץ. מסלול המשלחת אומר שבמאי
    ובאוקטובר שלג עלול לסגור את דרך אושגולי בלי אזהרה.

    ## חמישה ימים בסוואנטי

    מתוך [תוכנית המשלחת](/routes/svaneti-expedition/).

    **יום 1 - טביליסי לקוטאיסי ולזוגדידי, 320 ק"מ, 4:50.** יציאה ב-08:00; ב-11:30 בגראטי וצהריים
    בקוטאיסי (שעתיים); ב-15:30 זוגדידי וארמון דדיאני (1:30). לינה בזוגדידי.

    **יום 2 - זוגדידי למסטיה, 150 ק"מ, 3:20.** ב-09:45 סכר אנגורי (שעה); צהריים בחאישי; ב-15:00
    מסטיה, מגדלים ומוזיאון (שעתיים).

    **יום 3 - מסטיה וצ'לאדי, 30 ק"מ, שעה.** ב-09:00 גשר צ'לאדי ו-1:30 ברגל לקרחון; ב-15:00 רכבל
    הצוואלי (2:30).

    **יום 4 - מסטיה לאושגולי וחזרה, 90 ק"מ, 4 שעות.** יציאה ב-08:30 לחצץ ולמעברים; ב-10:30
    אושגולי, מגדלי צ'ז'אשי וכנסיית למריה (שעתיים); צהריים מול שחארה; חזרה מ-16:00.

    **יום 5 - מסטיה לטביליסי, 470 ק"מ, 8:30.** יציאה ב-07:30; ב-11:00 קפה ודלק בזוגדידי; צהריים
    בקוטאיסי; ב-20:30 טביליסי.

    [המסלול האלפיני של סוואנטי](/routes/svaneti-alpine-circuit/) בן שישה ימים מוסיף את מזרי,
    קורולדי, אדישי ושחארה - שטח, בעונה יולי עד ספטמבר.

    ## אזהרות כנות

    - זהו סיווג של פני דרך ועונה אופייניים, לא דיווח חי.
    - דף אושגולי שלנו אומר לצאת ממסטיה לפני 09:00: שעתיים לכל כיוון.
    - הקליטה נעלמת בערוץ; הורידו מפות לא מקוונות מראש.
    - תדלקו בזוגדידי ובמסטיה - ביניהן כמעט אין כלום.
    - לפני שמעלים רכב על דרך אושגולי, קראו את [תנאי ההשכרה](/terms/).
  faq:
  - q: "הדרך לאושגולי סלולה?"
    a: "לא. האספלט מגיע עד מסטיה ולחלק הראשון של דרך אושגולי; השאר מסווג gravel עם כמה חציות נהר, בקטגוריית שטח, 45-47 ק\"מ וכשעתיים ממסטיה. אחרי גשם הדרך מתדרדרת בחדות."
  - q: "אפשר להגיע למסטיה ברכב רגיל?"
    a: "הדרך מסווגת paved לכל 470 הק\"מ והנתונים אומרים שסדאן יסתדר, אף שמסטיה עצמה מסווגת רכב שטח עירוני בגלל הגובה וסגירות חורף אחרי מפולות שלגים. מזוגדידי למסטיה 130 ק\"מ וכשלוש שעות."
  - q: "כמה זמן נוסעים מטביליסי למסטיה?"
    a: "470 ק\"מ ו-8:30 בנתונים שלנו. המסלול מחלק זאת לשני ימים עם לילה בזוגדידי: 320 ק\"מ ו-4:50 ביום הראשון, 150 ק\"מ ו-3:20 בשני."
  - q: "מתי דרך אושגולי פתוחה?"
    a: "אושגולי נושאת עונה מיטבית יוני עד ספטמבר ומסומנת כלא פתוחה כל השנה. מסלול המשלחת מציין שבמאי ובאוקטובר שלג עלול לסגור את הדרך בלי אזהרה."
  - q: "רכב שטח עירוני מספיק לסוואנטי?"
    a: "למסטיה, צ'לאדי, הצוואלי ובצ'ו כן. אושגולי, קורולדי, אדישי וקרחון שחארה מסווגים שטח, והנתונים אומרים שרכב נמוך בקטע אושגולי איננו בטוח ואיננו מכוסה."

ar:
  name: "الطريق إلى سفانيتي: زوغديدي وميستيا وأوشغولي مقطعاً مقطعاً"
  short: "470 كم إسفلت حتى ميستيا، ثم 45 كم من الحصى والمخاضات حتى أوشغولي. السطح والارتفاع والموسم وفئة السيارة التي يفرضها كل نصف من الوادي، من بيانات طرقنا."
  meta_title: "الطريق إلى سفانيتي: ميستيا وأوشغولي مقطعاً مقطعاً | RentUp"
  meta_description: "هل طريق أوشغولي معبّد؟ طريق سفانيتي مقطعاً مقطعاً: 470 كم إسفلت حتى ميستيا، ثم حصى ومخاضات نهرية حتى أوشغولي. فئة السيارة والموسم من بياناتنا."
  body: |
    ## وادٍ واحد وطريقان مختلفان تماماً

    سؤال سفانيتي هو في الحقيقة سؤالان. الطريق إلى [ميستيا](/attractions/mestia/) مصنّف `paved` على
    امتداد 470 كم و8:30 من تبليسي. والطريق بعدها إلى [أوشغولي](/attractions/ushguli/) مصنّف
    `gravel` بفئة offroad ويضيف 45 كم وساعتين. بياناتنا تعاملهما حجزين مختلفين، وكذلك ينبغي لك.

    بسبب هذا الانقسام صُنّفت [بعثة سفانيتي](/routes/svaneti-expedition/) عندنا offroad: خمسة أيام،
    1,050 كم، 21 ساعة قيادة، صعوبة عالية، موسم من يونيو إلى سبتمبر. مقطع واحد طوله 45 كم يستحق
    هذا التصنيف كله.

    ## مقطعاً مقطعاً

    ### من تبليسي إلى كوتايسي وزوغديدي (0-320 كم)

    هذا طريق E60 غرباً: غوري وخاشوري وأنفاق ريكوتي وكوتايسي وسامتريديا وزوغديدي.
    [كاتدرائية باغراتي](/attractions/bagrati-cathedral/) في كوتايسي على بعد 230 كم و3:20 من تبليسي؛
    و[قصر دادياني في زوغديدي](/attractions/dadiani-palace-zugdidi/) 320 كم و4:40 على 100 متر. المسافة
    كلها معبّدة وفئتها اقتصادية. تزوّد بالوقود في كوتايسي أو سامتريديا أو زوغديدي، التي تسميها
    البيانات آخر مكان فيه خيار حقيقي من المحطات قبل الجبال.

    ### من زوغديدي إلى سد إنغوري (320-350 كم)

    من زوغديدي 30 كم ونحو أربعين دقيقة شمالاً شرقاً حتى [سد إنغوري](/attractions/enguri-dam/) عند
    جفاري: 350 كم و5:10 من تبليسي على 300 متر، معبّد، اقتصادي، مفتوح طوال السنة. السد على طريق
    ميستيا مباشرة فلا حاجة إلى التفاف؛ ساعة تكفي. التوقف على قمة السد يعني ركناً في مكان ضيق على
    طريق عبور مزدحم بالشاحنات، فانزل عن المسار كلياً. الماء ودورات المياه في جفاري لا عند السد.

    ### مضيق إنغوري حتى ميستيا (350-470 كم)

    فوق السد يبدأ المضيق ويصعد حتى النهاية. الـ130 كم من زوغديدي إلى ميستيا معبّدة بالكامل لكنها
    ضيقة ومتعرّجة بلا نهاية؛ تقول البيانات احسب ثلاث ساعات لهذا المقطع وحده. ميستيا على بعد 470 كم
    و8:30 من تبليسي على 1,500 متر، أي أن المضيق يرفعك 1,200 متر من السد. آخر وقود موثوق في
    زوغديدي وجفاري.

    ميستيا مصنّفة دفعاً رباعياً خفيفاً على الإسفلت، وهي واحدة من أربعة أماكن معبّدة فقط في قاعدة
    بياناتنا بهذا التصنيف. السبب ليس السطح بل الارتفاع والشتاء: الطريق يُغلق أحياناً بعد الانهيارات
    الثلجية، والدفع الرباعي الخفيف أريح على المنعطفات الطويلة، وإن كانت البيانات تقول إن السيدان
    يتدبّر أمره. أفضل موسم مايو-أكتوبر، مفتوح طوال السنة، أربع ساعات في الموقع. توصي البيانات
    بليلتين على الأقل.

    ### من ميستيا إلى أوشغولي (470-515 كم)

    أوشغولي على بعد 515 كم و10:30 من تبليسي على 2,100 متر. من ميستيا 45-47 كم ونحو ساعتين: إسفلت
    أولاً، ثم طريق حصى وحجارة يعبر النهر عدة مرات ويتدهور بحدة بعد المطر. البيانات صريحة: المطلوب
    هنا سيارة عالية الخلوص، والسيارة المنخفضة في هذا المقطع ليست آمنة ولا مغطاة. أفضل موسم
    يونيو-سبتمبر، غير مفتوح طوال السنة، أربع ساعات في القرى. آخر وقود في ميستيا.

    ## الطرق الخارجة من ميستيا

    | المكان | الطريق | السيارة | الارتفاع | من ميستيا | الموسم |
    |---|---|---|---|---|---|
    | [نهر تشالادي الجليدي](/attractions/chalaadi-glacier/) | mostly_paved | دفع رباعي خفيف | 1,900 م | 7-9 كم | يونيو-سبتمبر |
    | [هاتسفالي وتيتنولدي](/attractions/hatsvali-tetnuldi/) | mostly_paved | دفع رباعي خفيف | 1,870 م | 8 / 15-16 كم | ديسمبر-مارس |
    | [بيتشو ومازيري](/attractions/becho-mazeri/) | gravel | دفع رباعي خفيف | 1,600 م | منعطف قبل ميستيا بـ25 كم | مايو-أكتوبر |
    | [بحيرات كورولدي](/attractions/koruldi-lakes/) | 4x4_only | دفع رباعي 4x4 | 2,740 م | 10-12 كم | يونيو-سبتمبر |
    | [أديشي](/attractions/adishi/) | 4x4_only | دفع رباعي 4x4 | 2,040 م | منعطف قبل أوشغولي بـ15 كم | يونيو-سبتمبر |
    | [نهر شخارا الجليدي](/attractions/shkhara-glacier/) | 4x4_only | دفع رباعي 4x4 | 2,350 م | بعد أوشغولي | يونيو-سبتمبر |

    تشالادي إسفلت ثم بضعة كيلومترات من الحصى المليء بالحفر؛ في الجفاف يجتازه الدفع الرباعي الخفيف
    بسهولة. كورولدي درب ترابي حاد يستغرق تسعين دقيقة في كل اتجاه، وتقول البيانات إن الكروس أوفر
    العادي لا شأن له به. أديشي سبعة كيلومترات من الحصى صعوداً، دفع رباعي فقط.

    ## أي فئة تفرضها البيانات

    - **من تبليسي إلى سد إنغوري** - اقتصادية على الطريق كله.
    - **ميستيا وتشالادي وهاتسفالي وبيتشو** - دفع رباعي خفيف. إن انتهت الرحلة في ميستيا فـ
      [الدفع الرباعي الخفيف](/car-rental/suv/) هو الحجز الأمين.
    - **أوشغولي وكورولدي وأديشي وشخارا** - offroad. احجز [الدفع الرباعي 4x4](/car-rental/4x4/).

    الأربعون مليمتراً بين الدفع الرباعي الخفيف وسيارة الطرق الوعرة هي الجدل كله على مخاضات
    أوشغولي؛ الأرقام في [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).

    ## أفضل موسم من البيانات

    ميستيا تحمل مايو-أكتوبر ومفتوحة طوال السنة. أوشغولي وتشالادي وكورولدي وأديشي تحمل
    يونيو-سبتمبر ومُعلّمة بأنها غير متاحة طوال السنة. هاتسفالي وتيتنولدي على العكس، ديسمبر-مارس.
    يقول مسار البعثة إن الثلج في مايو وأكتوبر قد يغلق طريق أوشغولي بلا إنذار.

    ## خمسة أيام في سفانيتي

    من [خطة البعثة](/routes/svaneti-expedition/).

    **اليوم 1 - من تبليسي إلى كوتايسي وزوغديدي، 320 كم، 4:50.** الانطلاق 08:00؛ 11:30 باغراتي
    والغداء في كوتايسي (ساعتان)؛ 15:30 زوغديدي وقصر دادياني (1:30). المبيت في زوغديدي.

    **اليوم 2 - من زوغديدي إلى ميستيا، 150 كم، 3:20.** 09:45 سد إنغوري (ساعة)؛ الغداء في خايشي؛
    15:00 ميستيا، الأبراج والمتحف (ساعتان).

    **اليوم 3 - ميستيا وتشالادي، 30 كم، ساعة.** 09:00 جسر تشالادي ثم 1:30 مشياً إلى الجليد؛ 15:00
    تلفريك هاتسفالي (2:30).

    **اليوم 4 - من ميستيا إلى أوشغولي وعودة، 90 كم، 4 ساعات.** الانطلاق 08:30 إلى الحصى
    والمخاضات؛ 10:30 أوشغولي، أبراج تشاجاشي وكنيسة لاماريا (ساعتان)؛ الغداء بإطلالة شخارا؛ العودة
    من 16:00.

    **اليوم 5 - من ميستيا إلى تبليسي، 470 كم، 8:30.** الانطلاق 07:30؛ 11:00 قهوة ووقود في
    زوغديدي؛ الغداء في كوتايسي؛ 20:30 تبليسي.

    [دائرة سفانيتي الألبية](/routes/svaneti-alpine-circuit/) ذات الأيام الستة تضيف مازيري وكورولدي
    وأديشي وشخارا - offroad وموسمها يوليو-سبتمبر.

    ## تحذيرات أمينة

    - هذا تصنيف للسطح والموسم المعتادين لا تقرير حيّ.
    - صفحة أوشغولي عندنا تقول غادر ميستيا قبل 09:00: ساعتان في كل اتجاه.
    - التغطية تنقطع في المضيق؛ حمّل خرائط بلا إنترنت مسبقاً.
    - تزوّد بالوقود في زوغديدي وميستيا - بينهما لا شيء تقريباً.
    - قبل إخراج أي سيارة إلى طريق أوشغولي اقرأ [شروط الإيجار](/terms/).
  faq:
  - q: "هل الطريق إلى أوشغولي معبّد؟"
    a: "لا. الإسفلت يصل حتى ميستيا وإلى الجزء الأول من طريق أوشغولي؛ الباقي مصنّف gravel مع عدة عبورات للنهر، بفئة offroad، 45-47 كم ونحو ساعتين من ميستيا. يتدهور بحدة بعد المطر."
  - q: "هل أصل إلى ميستيا بسيارة عادية؟"
    a: "الطريق مصنّف paved على امتداد 470 كم وتقول البيانات إن السيدان يتدبّر أمره، وإن كانت ميستيا نفسها مصنّفة دفعاً رباعياً خفيفاً بسبب الارتفاع والإغلاقات الشتوية بعد الانهيارات الثلجية. من زوغديدي إلى ميستيا 130 كم ونحو ثلاث ساعات."
  - q: "كم تستغرق القيادة من تبليسي إلى ميستيا؟"
    a: "470 كم و8:30 في بياناتنا. يقسمها المسار على يومين مع مبيت في زوغديدي: 320 كم و4:50 في اليوم الأول، و150 كم و3:20 في الثاني."
  - q: "متى يكون طريق أوشغولي مفتوحاً؟"
    a: "أوشغولي موسمها الأفضل من يونيو إلى سبتمبر ومُعلّمة بأنها غير متاحة طوال السنة. ويشير مسار البعثة إلى أن الثلج في مايو وأكتوبر قد يغلق الطريق بلا إنذار."
  - q: "هل يكفي الدفع الرباعي الخفيف لسفانيتي؟"
    a: "لميستيا وتشالادي وهاتسفالي وبيتشو نعم. أما أوشغولي وكورولدي وأديشي ونهر شخارا الجليدي فمصنّفة offroad، وتقول البيانات إن السيارة المنخفضة في مقطع أوشغولي ليست آمنة ولا مغطاة."
