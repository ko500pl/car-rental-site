  body: |
    ## ერთი ხეობა, ორი სრულიად სხვადასხვა გზა

    სვანეთის კითხვა სინამდვილეში ორი კითხვაა. გზა [მესტიამდე](/attractions/mestia/) მთელ 470 კმ-ზე
    `paved`-ადაა კლასიფიცირებული და თბილისიდან 8:30-ს ითხოვს. გზა [უშგულამდე](/attractions/ushguli/)
    `gravel`-ია, offroad-ად შეფასებული, და კიდევ 45 კმ-სა და ორ საათს ამატებს. ჩვენი მონაცემები ამ
    ორს სხვადასხვა ჯავშნად განიხილავს — თქვენც ასე უნდა მოიქცეთ.

    სწორედ ამ გაყოფის გამოა ჩვენი [სვანეთის ექსპედიცია](/routes/svaneti-expedition/) offroad-ად
    შეფასებული: ხუთი დღე, 1050 კმ, 21 საათი გზაში, სირთულე — რთული, სეზონი ივნისი-სექტემბერი. ამ
    შეფასებას ერთი 45-კილომეტრიანი მონაკვეთი იმსახურებს.

    ## მონაკვეთების მიხედვით

    ### თბილისიდან ქუთაისსა და ზუგდიდამდე (0-320 კმ)

    ეს E60-ია დასავლეთით: გორი, ხაშური, რიკოთის გვირაბები, ქუთაისი, სამტრედია და ზუგდიდი.
    [ბაგრატის ტაძარი](/attractions/bagrati-cathedral/) ქუთაისში თბილისიდან 230 კმ და 3:20-ია;
    [დადიანების სასახლე ზუგდიდში](/attractions/dadiani-palace-zugdidi/) — 320 კმ და 4:40, 100 მეტრზე.
    მთელი მანძილი ასფალტია და ეკონომითაა შეფასებული. საწვავი ჩაასხით ქუთაისში, სამტრედიაში ან
    ზუგდიდში — მონაცემების მიხედვით ეს უკანასკნელი ადგილია, სადაც მთებამდე სადგურების ნამდვილი
    არჩევანია.

    ### ზუგდიდიდან ენგურის კაშხლამდე (320-350 კმ)

    ზუგდიდიდან ჩრდილო-აღმოსავლეთით 30 კმ და დაახლოებით ორმოცი წუთია
    [ენგურის კაშხლამდე](/attractions/enguri-dam/) ჯვართან: თბილისიდან 350 კმ და 5:10, 300 მეტრზე,
    ასფალტი, ეკონომი, მთელი წელი ღიაა. კაშხალი პირდაპირ მესტიის გზაზეა, ამიტომ შემოვლა არ სჭირდება;
    ერთი საათი საკმარისია. კაშხლის თხემზე გაჩერება ვიწრო ადგილას პარკირებას ნიშნავს, ეს კი
    სატვირთოებით დატვირთული სატრანზიტო გზაა — სავალი ნაწილიდან მთლიანად ჩამოდექით. წყალი და
    საპირფარეშო ჯვარშია და არა კაშხალთან.

    ### ენგურის ხეობით მესტიამდე (350-470 კმ)

    კაშხლის ზემოთ ხეობა იწყება და ბოლომდე ადის. ზუგდიდიდან მესტიამდე 130 კმ მთლიანად ასფალტია, მაგრამ
    ვიწრო და გაუთავებლად მიხვეულ-მოხვეული; მონაცემები მარტო ამ მონაკვეთისთვის სამ საათს ითვლის.
    მესტია თბილისიდან 470 კმ და 8:30-ია, 1500 მეტრზე — ანუ ხეობა კაშხლიდან 1200 მეტრით გწევთ ზემოთ.
    ბოლო საიმედო საწვავი ზუგდიდსა და ჯვარშია.

    მესტია ასფალტზე კროსოვერითაა შეფასებული — ჩვენს ბაზაში ასეთი მოასფალტებული ადგილი მხოლოდ ოთხია.
    მიზეზი საფარი კი არა, სიმაღლე და ზამთარია: გზა ზოგჯერ ზვავის შემდეგ იკეტება, გრძელ სერპანტინზე
    კი კროსოვერი უბრალოდ უფრო კომფორტულია, თუმცა მონაცემები ამბობს, რომ სედანიც გაუძლებს. საუკეთესო
    სეზონი მაისი-ოქტომბერი, მთელი წელი ღიაა, ადგილზე ოთხი საათი. მონაცემები სულ მცირე ორ ღამეს
    გირჩევთ, რადგან ერთი დღე ძირითადად გზაში გადის.

    ### მესტიიდან უშგულამდე (470-515 კმ)

    უშგული თბილისიდან 515 კმ და 10:30-ია, 2100 მეტრზე. მესტიიდან 45-47 კმ და დაახლოებით ორი საათია:
    ჯერ ასფალტი, შემდეგ გრუნტისა და ქვის გზა, რომელიც მდინარეს რამდენჯერმე კვეთს და წვიმის შემდეგ
    მკვეთრად უარესდება. მონაცემები ცალსახად ამბობს, რომ აქ მაღალი კლირენსის მანქანაა საჭირო და
    დაბალი მანქანა ამ მონაკვეთზე არც უსაფრთხოა და არც დაფარული. საუკეთესო სეზონი ივნისი-სექტემბერი,
    მთელი წელი არ არის ღია, სოფლებში ოთხი საათი. ბოლო საწვავი მესტიაშია.

    ## გზები მესტიიდან

    | ადგილი | გზა | კატეგორია | სიმაღლე | მესტიიდან | სეზონი |
    |---|---|---|---|---|---|
    | [ჭალაადის მყინვარი](/attractions/chalaadi-glacier/) | mostly_paved | კროსოვერი | 1900 მ | 7-9 კმ | ივნისი-სექტემბერი |
    | [ჰაწვალი და თეთნულდი](/attractions/hatsvali-tetnuldi/) | mostly_paved | კროსოვერი | 1870 მ | 8 კმ / 15-16 კმ | დეკემბერი-მარტი |
    | [ბეჩო და მაზერი](/attractions/becho-mazeri/) | gravel | კროსოვერი | 1600 მ | მოსახვევი მესტიამდე 25 კმ-ით ადრე | მაისი-ოქტომბერი |
    | [კორულდის ტბები](/attractions/koruldi-lakes/) | 4x4_only | ჯიპი 4x4 | 2740 მ | 10-12 კმ | ივნისი-სექტემბერი |
    | [ადიში](/attractions/adishi/) | 4x4_only | ჯიპი 4x4 | 2040 მ | მოსახვევი უშგულამდე 15 კმ-ით ადრე | ივნისი-სექტემბერი |
    | [შხარას მყინვარი](/attractions/shkhara-glacier/) | 4x4_only | ჯიპი 4x4 | 2350 მ | უშგულის იქით | ივნისი-სექტემბერი |

    ჭალაადამდე ჯერ ასფალტია, შემდეგ რამდენიმე კილომეტრი ორმოებიანი გრუნტი; მშრალ ამინდში კროსოვერი
    ადვილად გადის, სედანით კი მონაცემები ერთი კილომეტრით ადრე გაჩერებასა და ფეხით წასვლას გირჩევთ.
    ჰაწვალი რვა კილომეტრი მოასფალტებული სერპანტინია; თეთნულდი ნაწილობრივ ასფალტი, ნაწილობრივ გრუნტი,
    რომელიც ზამთარში ითელება. ბეჩოდან მაზერამდე ათი კილომეტრი ორმოებიანი გრუნტია ორიოდე ღელის
    გადაკვეთით. კორულდი ციცაბო მიწის გზაა, თითო მიმართულებით ოთხმოცდაათი წუთი, და მონაცემები ამბობს,
    რომ ჩვეულებრივ კროსოვერს იქ საქმე არ აქვს. ადიშამდე შვიდი კილომეტრი აღმართიანი გრუნტია, მხოლოდ
    სრული წამყვანით.

    ## რომელ კატეგორიას ითხოვს მონაცემები

    - **თბილისიდან ენგურის კაშხლამდე** — მთელ გზაზე ეკონომი.
    - **მესტია, ჭალაადი, ჰაწვალი, ბეჩო** — კროსოვერი. თუ მოგზაურობა მესტიაში მთავრდება,
      [კროსოვერი](/car-rental/suv/) პატიოსანი ჯავშანია.
    - **უშგული, კორულდი, ადიში, შხარა** — offroad. აიღეთ [ჯიპი 4x4](/car-rental/4x4/). მონაცემები
      კორულდისთვის მესტიიდან ადგილობრივ ჯიპებსაც ახსენებს, თუ თქვენი კატეგორია ამ საფარს არ ფარავს.

    კროსოვერსა და ჯიპს შორის 40 მილიმეტრი უშგულის ფონებზე მთელი არგუმენტია; ციფრები აქაა:
    [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/)

    ## საუკეთესო სეზონი მონაცემებით

    მესტიას მაისი-ოქტომბერი უწერია და მთელი წელი ღიაა. უშგულს, ჭალაადს, კორულდსა და ადიშს —
    ივნისი-სექტემბერი და მონიშნულია როგორც არა მთელი წლის განმავლობაში ხელმისაწვდომი. ჰაწვალი და
    თეთნულდი პირიქითაა — დეკემბერი-მარტი. ექსპედიციის მარშრუტი ამბობს, რომ მაისსა და ოქტომბერში თოვლმა
    უშგულის გზა გაფრთხილების გარეშე შეიძლება დაკეტოს, ოქტომბრიდან კი უღელტეხილები თოვლს იჭერს.

    ## ხუთი დღე სვანეთში

    [სვანეთის ექსპედიციის გეგმიდან](/routes/svaneti-expedition/).

    **დღე 1 — თბილისიდან ქუთაისსა და ზუგდიდამდე, 320 კმ, 4:50.** 08:00-ზე გასვლა E60-ით; 11:30-ზე
    ბაგრატი და სადილი ქუთაისში (2 სთ); 15:30-ზე ზუგდიდი და დადიანების სასახლე (1:30). ღამე ზუგდიდში.

    **დღე 2 — ზუგდიდიდან მესტიამდე, 150 კმ, 3:20.** 09:00-ზე გასვლა; 09:45-ზე ენგურის კაშხალი
    (1 სთ); ხეობით ზემოთ, სადილი ხაიშში; 15:00-ზე მესტია, კოშკები და მუზეუმი (2 სთ).

    **დღე 3 — მესტია და ჭალაადი, 30 კმ, 1 სთ.** 09:00-ზე ჭალაადის ხიდამდე, შემდეგ 1:30 ფეხით
    მყინვარამდე; სადილი მესტიაში; 15:00-ზე ჰაწვალის საბაგირო (2:30).

    **დღე 4 — მესტიიდან უშგულამდე და უკან, 90 კმ, 4 სთ.** 08:30-ზე გასვლა გრუნტსა და ფონებზე;
    10:30-ზე უშგული, ჩაჟაშის კოშკები და ლამარია (2 სთ); სადილი შხარას ხედით; 16:00-დან უკან იფარისა
    და კალას გავლით.

    **დღე 5 — მესტიიდან თბილისამდე, 470 კმ, 8:30.** 07:30-დან ხეობით ქვემოთ; 11:00-ზე ყავა და საწვავი
    ზუგდიდში; სადილი ქუთაისში ან სამტრედიაში; შესვენება რიკოთზე; 20:30-ზე თბილისში.

    ექვსდღიანი [სვანეთის ალპური წრე](/routes/svaneti-alpine-circuit/) მაზერს, კორულდს, ადიშსა და
    შხარას ამატებს — offroad და სეზონი ივლისი-სექტემბერი.

    ## პატიოსანი გაფრთხილებები

    - ეს ტიპური საფარისა და სეზონის კლასიფიკაციაა და არა გზის მიმდინარე ანგარიში.
    - ჩვენი უშგულის გვერდი მესტიიდან 09:00-მდე გასვლას გირჩევთ: თითო მიმართულებით ორი საათია და
      გრუნტზე სიბნელეში დაბრუნება არ გინდათ.
    - ხეობაში მობილური კავშირი ქრება; ოფლაინ რუკები წასვლამდე ჩამოტვირთეთ.
    - საწვავი ზუგდიდსა და მესტიაში — მონაცემების მიხედვით შუაში თითქმის არაფერია.
    - მთის ამინდი სწრაფად იცვლება; საწვიმარი და თბილი ფენა ზაფხულის შუაგულშიც გჭირდებათ.
    - სანამ მანქანას უშგულის გზაზე გაიყვანთ, წაიკითხეთ [გაქირავების პირობები](/terms/).
  faq:
  - q: "უშგულის გზა ასფალტიანია?"
    a: "არა. ასფალტი მესტიამდე და უშგულის გზის პირველ ნაწილზეა; დანარჩენი gravel-ადაა კლასიფიცირებული მდინარის რამდენიმე გადაკვეთით, offroad-ად შეფასებული, მესტიიდან 45-47 კმ და დაახლოებით ორი საათი. წვიმის შემდეგ მკვეთრად უარესდება."
  - q: "მესტიაში ჩვეულებრივი მანქანით შემიძლია?"
    a: "გზა მთელ 470 კმ-ზე paved-ია და მონაცემები ამბობს, რომ სედანი გაუძლებს, თუმცა თავად მესტია კროსოვერითაა შეფასებული სიმაღლის, ზვავის შემდეგ ზამთრის დაკეტვებისა და გრძელი სერპანტინის გამო. ზუგდიდიდან მესტიამდე 130 კმ და დაახლოებით სამი საათია."
  - q: "რამდენ ხანს მივდივართ თბილისიდან მესტიამდე?"
    a: "ჩვენს მონაცემებში 470 კმ და 8:30. მარშრუტი ამას ორ დღეზე ანაწილებს ზუგდიდში ღამისთევით: პირველ დღეს 320 კმ და 4:50, მეორეს — 150 კმ და 3:20."
  - q: "როდის არის უშგულის გზა ღია?"
    a: "უშგულს საუკეთესო სეზონად ივნისი-სექტემბერი უწერია და მონიშნულია როგორც არა მთელი წლის განმავლობაში ხელმისაწვდომი. ექსპედიციის მარშრუტი აღნიშნავს, რომ მაისსა და ოქტომბერში თოვლმა გზა გაფრთხილების გარეშე შეიძლება დაკეტოს."
  - q: "სვანეთისთვის კროსოვერი საკმარისია?"
    a: "მესტიის, ჭალაადის, ჰაწვალისა და ბეჩოსთვის — დიახ, ყველა კროსოვერითაა შეფასებული. უშგული, კორულდი, ადიში და შხარას მყინვარი offroad-ია, და მონაცემები ამბობს, რომ დაბალი მანქანა უშგულის მონაკვეთზე არც უსაფრთხოა და არც დაფარული."
  - q: "სად არის ბოლო ბენზინგასამართი მესტიისა და უშგულის წინ?"
    a: "ხეობამდე ზუგდიდი და ჯვარი, შემდეგ მესტია. მესტიის ზემოთ საწვავი არ არის — უშგულის, კორულდისა და ადიშის წინ ავზი აავსეთ."

ru:
  name: "Дорога в Сванетию: Зугдиди, Местиа и Ушгули по участкам"
  short: "470 км асфальта до Местиа, затем 45 км гравия и бродов до Ушгули. Покрытие, высота, сезон и категория машины для каждой половины ущелья - из наших дорожных данных."
  meta_title: "Дорога в Сванетию: Местиа и Ушгули по участкам | RentUp"
  meta_description: "Дорога Местиа - Ушгули асфальтированная? Сванетия по участкам: 470 км асфальта до Местиа, затем гравий и броды до Ушгули. Категория машины и сезон из данных."
  body: |
    ## Одно ущелье, две совершенно разные дороги

    Вопрос о Сванетии - на самом деле два вопроса. Дорога до [Местиа](/attractions/mestia/)
    классифицирована как `paved` на всех 470 км и 8:30 от Тбилиси. Дорога дальше, до
    [Ушгули](/attractions/ushguli/), - это `gravel` с категорией offroad, ещё 45 км и два часа.
    Наши данные считают их разными бронями, и вам стоит делать так же.

    Именно из-за этого раздела наша [экспедиция в Сванетию](/routes/svaneti-expedition/) отмечена
    как offroad: пять дней, 1050 км, 21 час за рулём, сложность «трудно», сезон июнь-сентябрь. Всю
    эту оценку заслужил один отрезок в 45 км.

    ## По участкам

    ### Тбилиси - Кутаиси - Зугдиди (0-320 км)

    Это E60 на запад: Гори, Хашури, Рикотские тоннели, Кутаиси, Самтредиа и Зугдиди.
    [Храм Баграти](/attractions/bagrati-cathedral/) в Кутаиси - 230 км и 3:20 от Тбилиси;
    [дворец Дадиани в Зугдиди](/attractions/dadiani-palace-zugdidi/) - 320 км и 4:40, 100 м. Вся
    дистанция - асфальт и эконом-класс. Заправляйтесь в Кутаиси, Самтредиа или Зугдиди: данные
    называют его последним местом с нормальным выбором станций перед горами.

    ### Зугдиди - Ингурская ГЭС (320-350 км)

    От Зугдиди 30 км и около сорока минут на северо-восток до
    [Ингурской ГЭС](/attractions/enguri-dam/) у Джвари: 350 км и 5:10 от Тбилиси, 300 м, асфальт,
    эконом, открыто круглый год. Плотина стоит прямо на дороге в Местиа, объезд не нужен; часа
    достаточно. Остановка на гребне - это парковка в тесном месте на загруженной транзитной дороге
    с грузовиками, поэтому съезжайте с проезжей части полностью. Вода и туалеты - в Джвари, а не у
    плотины.

    ### Ингурское ущелье - Местиа (350-470 км)

    Выше плотины начинается ущелье и поднимается до самого конца. 130 км от Зугдиди до Местиа
    полностью асфальтированы, но узкие и бесконечно извилистые; данные советуют закладывать три часа
    только на этот отрезок. Местиа - 470 км и 8:30 от Тбилиси, 1500 м, то есть ущелье поднимает вас
    на 1200 м от плотины. Последнее надёжное топливо - в Зугдиди и Джвари.

    Местиа отмечена кроссовером на асфальте - одно из всего четырёх асфальтовых мест в базе с такой
    оценкой. Причина не в покрытии, а в высоте и зиме: дорога иногда закрывается после лавин, а
    кроссовер просто удобнее на длинных серпантинах, хотя данные говорят, что седан справится.
    Лучший сезон - май-октябрь, открыто круглый год, на месте четыре часа. Данные советуют минимум
    две ночи, потому что один день - это в основном дорога.

    ### Местиа - Ушгули (470-515 км)

    Ушгули - 515 км и 10:30 от Тбилиси, 2100 м. От Местиа 45-47 км и около двух часов: сначала
    асфальт, затем гравийно-каменная дорога, которая несколько раз пересекает реку и резко портится
    после дождя. Данные однозначны: здесь нужна машина с высоким клиренсом, а низкая машина на этом
    участке ни безопасна, ни застрахована. Лучший сезон - июнь-сентябрь, круглогодичного доступа
    нет, в сёлах четыре часа. Последнее топливо - в Местиа.

    ## Дороги из Местиа

    | Место | Дорога | Категория | Высота | От Местиа | Сезон |
    |---|---|---|---|---|---|
    | [Ледник Чалаади](/attractions/chalaadi-glacier/) | mostly_paved | кроссовер | 1900 м | 7-9 км | июнь-сентябрь |
    | [Хацвали и Тетнулди](/attractions/hatsvali-tetnuldi/) | mostly_paved | кроссовер | 1870 м | 8 км / 15-16 км | декабрь-март |
    | [Бечо и Мазери](/attractions/becho-mazeri/) | gravel | кроссовер | 1600 м | поворот за 25 км до Местиа | май-октябрь |
    | [Озёра Корульди](/attractions/koruldi-lakes/) | 4x4_only | внедорожник 4x4 | 2740 м | 10-12 км | июнь-сентябрь |
    | [Адиши](/attractions/adishi/) | 4x4_only | внедорожник 4x4 | 2040 м | поворот за 15 км до Ушгули | июнь-сентябрь |
    | [Ледник Шхара](/attractions/shkhara-glacier/) | 4x4_only | внедорожник 4x4 | 2350 м | за Ушгули | июнь-сентябрь |

    До Чалаади сначала асфальт, потом несколько километров гравия с ямами; в сухую погоду кроссовер
    проходит легко, а с седаном данные советуют остановиться на километр раньше и пройти пешком.
    Хацвали - восемь километров асфальтового серпантина; Тетнулди - частично асфальт, частично
    гравий, который зимой разбивают. От Бечо до Мазери - десять километров гравия с ямами и парой
    ручьёв. Корульди - крутая грунтовка на полтора часа в каждую сторону, и данные говорят, что
    обычному кроссоверу там делать нечего. Адиши - семь километров гравия в гору, только полный
    привод.

    ## Какую категорию требуют данные

    - **Тбилиси - Ингурская ГЭС** - эконом-класс на всём пути.
    - **Местиа, Чалаади, Хацвали, Бечо** - кроссовер. Если поездка заканчивается в Местиа,
      [кроссовер](/car-rental/suv/) - честная бронь.
    - **Ушгули, Корульди, Адиши, Шхара** - offroad. Берите [внедорожник 4x4](/car-rental/4x4/).
      Для Корульди данные упоминают и местные джипы из Местиа, если ваша категория не покрывает
      такое покрытие.

    Сорок миллиметров между кроссовером и внедорожником на бродах Ушгули - это весь спор; цифры в
    статье [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).

    ## Лучший сезон по данным

    У Местиа указан май-октябрь, открыто круглый год. У Ушгули, Чалаади, Корульди и Адиши -
    июнь-сентябрь, все отмечены как недоступные круглый год. Хацвали и Тетнулди - наоборот,
    декабрь-март. Маршрут экспедиции предупреждает, что в мае и октябре снег может закрыть дорогу
    в Ушгули без предупреждения, а с октября перевалы начинают ловить снег.

    ## Пять дней в Сванетии

    Из [плана экспедиции](/routes/svaneti-expedition/).

    **День 1 - Тбилиси - Кутаиси - Зугдиди, 320 км, 4:50.** Выезд в 08:00 по E60; в 11:30 Баграти
    и обед в Кутаиси (2 ч); в 15:30 Зугдиди и дворец Дадиани (1:30). Ночь в Зугдиди.

    **День 2 - Зугдиди - Местиа, 150 км, 3:20.** Выезд в 09:00; в 09:45 Ингурская ГЭС (1 ч); вверх
    по ущелью с обедом в Хаиши; в 15:00 Местиа, башни и музей (2 ч).

    **День 3 - Местиа и Чалаади, 30 км, 1 ч.** В 09:00 к мосту Чалаади, затем 1:30 пешком до
    ледника; обед в Местиа; в 15:00 канатная дорога Хацвали (2:30).

    **День 4 - Местиа - Ушгули - Местиа, 90 км, 4 ч.** Выезд в 08:30 на гравий и броды; в 10:30
    Ушгули, башни Чажаши и церковь Ламария (2 ч); обед с видом на Шхару; с 16:00 обратно через Ипари
    и Кала.

    **День 5 - Местиа - Тбилиси, 470 км, 8:30.** С 07:30 вниз по ущелью; в 11:00 кофе и топливо в
    Зугдиди; обед в Кутаиси или Самтредиа; остановка на Рикоти; в 20:30 Тбилиси.

    Шестидневный [альпийский круг Сванети](/routes/svaneti-alpine-circuit/) добавляет Мазери,
    Корульди, Адиши и Шхару - категория offroad, сезон июль-сентябрь.

    ## Честные предупреждения

    - Это классификация типичного покрытия и сезона, а не сводка о состоянии дороги.
    - Наша страница Ушгули советует выезжать из Местиа до 09:00: два часа в каждую сторону, и
      возвращаться по гравию в темноте не стоит.
    - В ущелье пропадает мобильная связь; скачайте офлайн-карты заранее.
    - Заправляйтесь в Зугдиди и Местиа - по данным, между ними почти ничего нет.
    - Погода в горах меняется быстро; дождевик и тёплый слой нужны даже в разгар лета.
    - Прежде чем выезжать на дорогу в Ушгули, прочитайте [условия аренды](/terms/).
  faq:
  - q: "Дорога в Ушгули асфальтированная?"
    a: "Нет. Асфальт доходит до Местиа и на первую часть дороги в Ушгули; остальное классифицировано как gravel с несколькими пересечениями реки, категория offroad, 45-47 км и около двух часов от Местиа. После дождя дорога резко портится."
  - q: "Можно ли доехать до Местиа на обычной машине?"
    a: "Дорога классифицирована как paved на всех 470 км, и данные говорят, что седан справится, хотя сама Местиа отмечена кроссовером из-за высоты, зимних закрытий после лавин и длинных серпантинов. От Зугдиди до Местиа - 130 км и около трёх часов."
  - q: "Сколько ехать от Тбилиси до Местиа?"
    a: "470 км и 8:30 по нашим данным. Маршрут делит это на два дня с ночёвкой в Зугдиди: 320 км и 4:50 в первый день, 150 км и 3:20 во второй."
  - q: "Когда открыта дорога в Ушгули?"
    a: "У Ушгули указан лучший сезон июнь-сентябрь, и место отмечено как недоступное круглый год. Маршрут экспедиции отмечает, что в мае и октябре снег может закрыть дорогу без предупреждения."
  - q: "Кроссовера хватит для Сванетии?"
    a: "Для Местиа, Чалаади, Хацвали и Бечо - да, все отмечены кроссовером. Ушгули, Корульди, Адиши и ледник Шхара отмечены offroad, и данные говорят, что низкая машина на участке до Ушгули ни безопасна, ни застрахована."
  - q: "Где последняя заправка перед Местиа и Ушгули?"
    a: "Зугдиди и Джвари перед ущельем, затем Местиа. Выше Местиа топлива нет, поэтому перед Ушгули, Корульди или Адиши заправьте полный бак."

fa:
  name: "جادّهٔ سوانتی: زوگدیدی، مستیا و اوشگولی قطعه به قطعه"
  short: "470 کیلومتر آسفالت تا مستیا، سپس 45 کیلومتر خاکی و گذر از رودخانه تا اوشگولی. سطح، ارتفاع، فصل و ردهٔ خودرویی که هر نیمهٔ درّه می‌خواهد، از داده‌های جادّهٔ ما."
  meta_title: "جادّهٔ سوانتی: مستیا و اوشگولی قطعه به قطعه | RentUp"
  meta_description: "آیا جادّهٔ اوشگولی آسفالت است؟ جادّهٔ سوانتی قطعه به قطعه: 470 کیلومتر آسفالت تا مستیا، سپس خاکی و گذر از رودخانه تا اوشگولی. ردهٔ خودرو و فصل از داده‌ها."
  body: |
    ## یک درّه، دو جادّهٔ کاملاً متفاوت

    پرسش سوانتی در واقع دو پرسش است. جادّه تا [مستیا](/attractions/mestia/) در تمام 470 کیلومتر و
    8:30 از تفلیس `paved` ثبت شده است. جادّهٔ بعدی تا [اوشگولی](/attractions/ushguli/) `gravel`، ردهٔ
    آفرود، و 45 کیلومتر و دو ساعت دیگر است. داده‌های ما این دو را دو رزرو جداگانه می‌دانند.

    به همین دلیل [سفر اکتشافی سوانتی](/routes/svaneti-expedition/) ما آفرود ثبت شده است: پنج روز،
    1,050 کیلومتر، 21 ساعت رانندگی، دشواری «سخت»، فصل ژوئن تا سپتامبر. این رده را یک قطعهٔ 45
    کیلومتری به دست آورده است.

    ## قطعه به قطعه

    ### تفلیس تا کوتائیسی و زوگدیدی (0-320 کیلومتر)

    این جادّهٔ E60 به سمت غرب است. [کلیسای باگراتی](/attractions/bagrati-cathedral/) در کوتائیسی
    230 کیلومتر و 3:20 از تفلیس است؛ [کاخ دادیانی در زوگدیدی](/attractions/dadiani-palace-zugdidi/)
    320 کیلومتر و 4:40 در 100 متر. تمام مسیر آسفالت و ردهٔ اقتصادی است. داده‌ها زوگدیدی را آخرین جای
    با انتخاب واقعی پمپ پیش از کوهستان می‌دانند.

    ### زوگدیدی تا سد انگوری (320-350 کیلومتر)

    از زوگدیدی 30 کیلومتر و حدود چهل دقیقه تا [سد انگوری](/attractions/enguri-dam/) در جواری: 350
    کیلومتر و 5:10 از تفلیس در 300 متر، آسفالت، اقتصادی، تمام سال باز. سد درست روی جادّهٔ مستیا است؛
    یک ساعت کافی است. توقف روی تاج سد یعنی پارک در جای تنگ روی جادّه‌ای پرکامیون.

    ### تنگهٔ انگوری تا مستیا (350-470 کیلومتر)

    بالای سد تنگه آغاز می‌شود و تا انتها بالا می‌رود. 130 کیلومتر از زوگدیدی تا مستیا تماماً آسفالت
    اما باریک و بی‌پایان پیچ‌درپیچ است؛ داده‌ها فقط برای این قطعه سه ساعت حساب می‌کنند. مستیا 470
    کیلومتر و 8:30 از تفلیس در 1,500 متر است، یعنی تنگه شما را 1,200 متر از سد بالا می‌برد. آخرین سوخت
    مطمئن در زوگدیدی و جواری.

    مستیا روی آسفالت شاسی‌بلند ثبت شده است. دلیل سطح نیست، ارتفاع و زمستان است: جادّه گاهی پس از
    بهمن بسته می‌شود، هرچند داده‌ها می‌گویند سدان هم از پس آن برمی‌آید. بهترین فصل مه تا اکتبر، تمام
    سال باز، چهار ساعت در محل. داده‌ها دست‌کم دو شب توصیه می‌کنند.

    ### مستیا تا اوشگولی (470-515 کیلومتر)

    اوشگولی 515 کیلومتر و 10:30 از تفلیس در 2,100 متر است. از مستیا 45-47 کیلومتر و حدود دو ساعت:
    ابتدا آسفالت، سپس جادّهٔ خاکی و سنگی که چند بار از رودخانه می‌گذرد و پس از باران به‌شدت خراب
    می‌شود. داده‌ها صریح‌اند: اینجا خودروی با کلیرنس بالا لازم است و خودروی کوتاه در این قطعه نه امن
    است و نه تحت پوشش. بهترین فصل ژوئن تا سپتامبر، نه در تمام سال، چهار ساعت در روستاها. آخرین سوخت
    در مستیا.

    ## جاده‌های بیرون از مستیا

    | مکان | جادّه | خودرو | ارتفاع | از مستیا | فصل |
    |---|---|---|---|---|---|
    | [یخچال چالاادی](/attractions/chalaadi-glacier/) | mostly_paved | شاسی‌بلند | 1,900 متر | 7-9 کیلومتر | ژوئن-سپتامبر |
    | [هاتسوالی و تتنولدی](/attractions/hatsvali-tetnuldi/) | mostly_paved | شاسی‌بلند | 1,870 متر | 8 / 15-16 کیلومتر | دسامبر-مارس |
    | [بچو و مازری](/attractions/becho-mazeri/) | gravel | شاسی‌بلند | 1,600 متر | انشعاب 25 کیلومتر پیش از مستیا | مه-اکتبر |
    | [دریاچه‌های کورولدی](/attractions/koruldi-lakes/) | 4x4_only | آفرود 4x4 | 2,740 متر | 10-12 کیلومتر | ژوئن-سپتامبر |
    | [آدیشی](/attractions/adishi/) | 4x4_only | آفرود 4x4 | 2,040 متر | انشعاب 15 کیلومتر پیش از اوشگولی | ژوئن-سپتامبر |
    | [یخچال شخارا](/attractions/shkhara-glacier/) | 4x4_only | آفرود 4x4 | 2,350 متر | پس از اوشگولی | ژوئن-سپتامبر |

    چالاادی ابتدا آسفالت و سپس چند کیلومتر خاکی چاله‌دار است؛ در هوای خشک شاسی‌بلند به‌راحتی می‌رود.
    کورولدی مسیر خاکی تندی است، نود دقیقه هر طرف، و داده‌ها می‌گویند شاسی‌بلند معمولی جایی در آن
    ندارد. آدیشی هفت کیلومتر خاکی سربالایی است، فقط با چهار چرخ محرک.

    ## داده‌ها چه رده‌ای می‌خواهند

    - **تفلیس تا سد انگوری** - در تمام مسیر اقتصادی.
    - **مستیا، چالاادی، هاتسوالی، بچو** - شاسی‌بلند. اگر سفر در مستیا تمام می‌شود،
      [شاسی‌بلند](/car-rental/suv/) رزرو درست است.
    - **اوشگولی، کورولدی، آدیشی، شخارا** - آفرود. [آفرود 4x4](/car-rental/4x4/) بگیرید.

    اعداد کلیرنس در [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/) آمده است.

    ## بهترین فصل از داده‌ها

    مستیا مه تا اکتبر دارد و تمام سال باز است. اوشگولی، چالاادی، کورولدی و آدیشی ژوئن تا سپتامبر
    دارند و «نه در تمام سال» علامت خورده‌اند. هاتسوالی و تتنولدی برعکس، دسامبر تا مارس. مسیر اکتشافی
    می‌گوید در مه و اکتبر برف می‌تواند بی‌خبر جادّهٔ اوشگولی را ببندد.

    ## پنج روز در سوانتی

    از [برنامهٔ سفر اکتشافی](/routes/svaneti-expedition/).

    **روز 1 - تفلیس تا کوتائیسی و زوگدیدی، 320 کیلومتر، 4:50.** حرکت 08:00؛ 11:30 باگراتی و ناهار
    در کوتائیسی (2 ساعت)؛ 15:30 زوگدیدی و کاخ دادیانی (1:30). شب در زوگدیدی.

    **روز 2 - زوگدیدی تا مستیا، 150 کیلومتر، 3:20.** 09:45 سد انگوری (1 ساعت)؛ ناهار در خایشی؛ 15:00
    مستیا، برج‌ها و موزه (2 ساعت).

    **روز 3 - مستیا و چالاادی، 30 کیلومتر، 1 ساعت.** 09:00 پل چالاادی و 1:30 پیاده تا یخچال؛ 15:00
    تله‌کابین هاتسوالی (2:30).

    **روز 4 - مستیا تا اوشگولی و بازگشت، 90 کیلومتر، 4 ساعت.** حرکت 08:30 روی خاکی و گذرها؛ 10:30
    اوشگولی، برج‌های چاژاشی و کلیسای لاماریا (2 ساعت)؛ ناهار با منظرهٔ شخارا؛ بازگشت از 16:00.

    **روز 5 - مستیا تا تفلیس، 470 کیلومتر، 8:30.** حرکت 07:30؛ 11:00 قهوه و سوخت در زوگدیدی؛ ناهار
    در کوتائیسی؛ 20:30 تفلیس.

    [مدار آلپی سوانتی](/routes/svaneti-alpine-circuit/) شش‌روزه مازری، کورولدی، آدیشی و شخارا را
    می‌افزاید - آفرود، فصل ژوئیه تا سپتامبر.

    ## هشدارهای صادقانه

    - این رده‌بندی سطح و فصل معمول است، نه گزارش زندهٔ جادّه.
    - پیش از 09:00 از مستیا بیرون بزنید: دو ساعت هر طرف است.
    - در زوگدیدی و مستیا سوخت بزنید - بین این دو تقریباً چیزی نیست.
    - پیش از بردن خودرو به جادّهٔ اوشگولی [شرایط اجاره](/terms/) را بخوانید.
  faq:
