  name: "გზა სვანეთისკენ: ზუგდიდი, მესტია და უშგული მონაკვეთების მიხედვით"
  short: "470 კმ ასფალტი მესტიამდე, შემდეგ 45 კმ გრუნტი და ფონები უშგულამდე. საფარი, სიმაღლე, სეზონი და კატეგორია, რომელსაც ხეობის თითოეული ნახევარი ითხოვს — ჩვენი გზის მონაცემებიდან."
