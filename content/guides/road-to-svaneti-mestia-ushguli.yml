en:
  name: "The Road to Svaneti: Zugdidi, Mestia and Ushguli, Segment by Segment"
  short: "470 km of asphalt to Mestia, then 45 km of gravel and river fords to Ushguli. Surface, altitude, season and the car class each half of the valley requires, from our road data."
  meta_title: "Road to Svaneti: Mestia and Ushguli Road Guide | RentUp"
  meta_description: "Is the road to Ushguli paved? The Svaneti road segment by segment: 470 km of asphalt to Mestia, then gravel and fords to Ushguli. Car class and season."
  body: |
    ## One valley, two completely different roads

    The Svaneti question is really two questions. The road to
    [Mestia](/attractions/mestia/) is classed `paved` for the full 470 km and 8h30 from Tbilisi.
    The road on to [Ushguli](/attractions/ushguli/) is classed `gravel`, rated off-road, and adds
    45 km and two hours. Our data treats them as different bookings, and so should you.

    That split is why our [Svaneti expedition](/routes/svaneti-expedition/) is rated off-road:
    five days, 1,050 km, 21 hours of driving, difficulty hard, in season June to September. The
    hard rating is earned by one 45 km stretch.

    ## Segment by segment

    ### Tbilisi to Kutaisi and Zugdidi (0-320 km)

    This is the E60 west: Gori, Khashuri, the Rikoti tunnels, Kutaisi, Samtredia and Zugdidi.
    [Bagrati Cathedral](/attractions/bagrati-cathedral/) in Kutaisi is 230 km and 3h20 from Tbilisi;
    the [Dadiani Palace in Zugdidi](/attractions/dadiani-palace-zugdidi/) is 320 km and 4h40 at
    100 m. The whole distance is paved and rated economy. Fill up in Kutaisi, Samtredia or Zugdidi,
    which our data calls the last place with a proper choice of stations before the mountains.

    ### Zugdidi to the Enguri Dam (320-350 km)

    From Zugdidi it is 30 km and about forty minutes north-east to
    [the Enguri Dam](/attractions/enguri-dam/) at Jvari: 350 km and 5h10 from Tbilisi at 300 m,
    paved, rated economy, open all year. The dam sits directly on the Mestia road, so no detour is
    needed; an hour is enough. Parking on the crest is tight and this is a busy transit road with
    trucks, so pull fully off the carriageway. Water and toilets are in Jvari, not at the dam.

    ### The Enguri gorge to Mestia (350-470 km)

    Above the dam the gorge begins and climbs for the rest of the way. The 130 km from Zugdidi to
    Mestia is fully paved but narrow and endlessly winding; our data says to count on three hours
    for that stretch alone. Mestia is 470 km and 8h30 from Tbilisi at 1,500 m, so the gorge lifts
    you 1,200 m from the dam. The last dependable fuel is in Zugdidi and Jvari.

    Mestia is rated SUV on asphalt, one of only four paved places in our database with that
    rating. The reason is not the surface but the altitude and the winter: the road occasionally
    closes after avalanches, and an SUV is simply more comfortable on the long switchbacks, though
    the data says a sedan will manage. Best season May to October, open all year, four hours on
    site. Our data recommends at least two nights, because a single day is mostly driving.

    ### Mestia to Ushguli (470-515 km)

    Ushguli is 515 km and 10h30 from Tbilisi at 2,100 m. From Mestia it is 45-47 km and about two
    hours: asphalt at first, then a gravel and stone road that crosses the river several times and
    deteriorates sharply after rain. The data is explicit that a high-clearance vehicle is required
    and that a low car is neither safe nor covered on this section. Best season June to September,
    not open year-round, four hours in the villages. The last fuel is in Mestia.

    ## The roads out of Mestia

    | Place | Road | Car | Altitude | From Mestia | Season |
    |---|---|---|---|---|---|
    | [Chalaadi Glacier](/attractions/chalaadi-glacier/) | mostly_paved | SUV | 1,900 m | 7-9 km | June to September |
    | [Hatsvali and Tetnuldi](/attractions/hatsvali-tetnuldi/) | mostly_paved | SUV | 1,870 m | 8 km / 15-16 km | December to March |
    | [Becho and Mazeri](/attractions/becho-mazeri/) | gravel | SUV | 1,600 m | turning 25 km before Mestia | May to October |
    | [Koruldi Lakes](/attractions/koruldi-lakes/) | 4x4_only | off-road 4x4 | 2,740 m | 10-12 km | June to September |
    | [Adishi](/attractions/adishi/) | 4x4_only | off-road 4x4 | 2,040 m | turning 15 km before Ushguli | June to September |
    | [Shkhara Glacier](/attractions/shkhara-glacier/) | 4x4_only | off-road 4x4 | 2,350 m | beyond Ushguli | June to September |

    Chalaadi is asphalt then a few kilometres of potholed gravel; an SUV handles it in dry weather,
    and with a sedan the data suggests stopping a kilometre early and walking. Hatsvali is eight
    kilometres of paved switchbacks; Tetnuldi is part asphalt, part gravel that gets churned up in
    winter. Becho to Mazeri is ten kilometres of potholed gravel with a couple of stream crossings.
    Koruldi is a steep dirt track for ninety minutes each way, and the data says an ordinary crossover
    has no business on it. Adishi is seven kilometres of gravel track uphill, four-wheel drive only.

    ## Which car class the data requires

    - **Tbilisi to the Enguri Dam** - rated economy the whole way.
    - **Mestia, Chalaadi, Hatsvali, Becho** - rated SUV. If the trip ends at Mestia, the
      [SUV](/car-rental/suv/) is the honest booking.
    - **Ushguli, Koruldi, Adishi, Shkhara** - rated off-road. Book the
      [off-road 4x4](/car-rental/4x4/). The data also mentions local jeeps from Mestia for Koruldi
      if your category does not cover the surface.

    The 40 mm between an SUV and an off-road car is the whole argument on the Ushguli fords; the
    numbers are in [Do you need a 4x4 in Georgia?](/guides/do-i-need-a-4x4-in-georgia/).

    ## Best season, from the data

    Mestia carries May to October and is open all year. Ushguli, Chalaadi, Koruldi and Adishi carry
    June to September and are flagged as not open year-round. Hatsvali and Tetnuldi are the reverse,
    December to March. The expedition route says that in May and October snow can close the Ushguli
    road without warning, and that from October the passes start catching snow.

    ## Five days in Svaneti

    Drawn from the [Svaneti expedition plan](/routes/svaneti-expedition/).

    **Day 1 - Tbilisi to Kutaisi and Zugdidi, 320 km, 4h50.** Leave at 08:00 on the E60; Bagrati
    and lunch in Kutaisi at 11:30 (2 h); Zugdidi and the Dadiani Palace at 15:30 (1h30). Overnight
    in Zugdidi.

    **Day 2 - Zugdidi to Mestia, 150 km, 3h20.** Set off at 09:00; the Enguri Dam at 09:45 (1 h);
    up the gorge with lunch at Khaishi; Mestia at 15:00, towers and museum (2 h).

    **Day 3 - Mestia and Chalaadi, 30 km, 1 h.** Drive to the Chalaadi bridge at 09:00, then a
    1h30 walk to the glacier; lunch in Mestia; Hatsvali cable car at 15:00 (2h30).

    **Day 4 - Mestia to Ushguli and back, 90 km, 4 h.** Leave at 08:30 for the gravel and fords;
    Ushguli at 10:30, Chazhashi towers and Lamaria church (2 h); lunch with the Shkhara view; back
    through Ipari and Kala from 16:00.

    **Day 5 - Mestia to Tbilisi, 470 km, 8h30.** Down the gorge from 07:30; coffee and fuel in
    Zugdidi at 11:00; lunch in Kutaisi or Samtredia; a break at Rikoti; Tbilisi at 20:30.

    The six-day [Svaneti alpine circuit](/routes/svaneti-alpine-circuit/) adds Mazeri, Koruldi,
    Adishi and Shkhara, rated off-road and in season July to September.

    ## Honest warnings

    - This is a classification of typical surface and season, not a live road report.
    - Our Ushguli page says to leave Mestia before 09:00: two hours each way, and you do not want
      the gravel in the dark.
    - Mobile coverage drops out in the gorge; download offline maps before you leave.
    - Refuel in Zugdidi and Mestia - the data says there is almost nothing in between.
    - Mountain weather turns fast; a rain shell and warm layers are needed even in midsummer.
    - Read the [rental terms](/terms/) before taking any car onto the Ushguli road.
  faq:
  - q: "Is the road to Ushguli paved?"
    a: "No. Asphalt runs to Mestia and for the first part of the Ushguli road; the rest is classed gravel with several river crossings, rated off-road, 45-47 km and about two hours from Mestia. It deteriorates sharply after rain."
  - q: "Can I drive to Mestia in a normal car?"
    a: "The road is classed paved for all 470 km and our data says a sedan will manage, though Mestia itself is rated SUV because of altitude, winter closures after avalanches and the long switchbacks. Zugdidi to Mestia is 130 km and about three hours."
  - q: "How long is the drive from Tbilisi to Mestia?"
    a: "470 km and 8h30 in our data. The route splits it over two days with a night in Zugdidi: 320 km and 4h50 on day one, 150 km and 3h20 on day two."
  - q: "When is the Ushguli road open?"
    a: "Ushguli carries a best season of June to September and is flagged as not open year-round. The expedition route notes that in May and October snow can close the road without warning."
  - q: "Is an SUV enough for Svaneti?"
    a: "For Mestia, Chalaadi, Hatsvali and Becho, yes - all are rated SUV. Ushguli, Koruldi, Adishi and the Shkhara glacier are rated off-road, and the data says a low car is neither safe nor covered on the Ushguli section."
  - q: "Where is the last fuel before Mestia and Ushguli?"
    a: "Zugdidi and Jvari before the gorge, then Mestia. There is no fuel above Mestia, so fill the tank before Ushguli, Koruldi or Adishi."

