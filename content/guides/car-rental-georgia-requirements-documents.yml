  body: |
    ## ჩამონათვალი

    ეს წამოიღეთ გადაბარებაზე და სხვა არაფრის მოგვარება არ დაგჭირდებათ:

    - **პასპორტი** უცხოელისთვის, ID ბარათი — საქართველოს მოქალაქისთვის.
    - **ეროვნული მართვის მოწმობა მინიმუმ 2 წლის სტაჟით** — მაღალ კატეგორიებზე მეტი, იხილეთ ცხრილი.
    - **საერთაშორისო მართვის მოწმობა (IDP) მხოლოდ მაშინ, თუ თქვენი მოწმობა ლათინური ანბანით არ
      არის შედგენილი.**
    - **ბარათი ან ნაღდი ფული დეპოზიტისთვის.** დეპოზიტი იბლოკება და არა ჩამოიჭრება.
    - **იურიდიული პირისთვის**: ამონაწერი რეესტრიდან, მინდობილობა და ბეჭედი.

    წინასწარ არაფერი იხდება. ჯავშანი ტელეფონით ან ელფოსტით დასტურდება, ანგარიშსწორება ავტომობილის
    მიღებისას ხდება, ხელშეკრულება კი ქართულ, ინგლისურ ან რუსულ ენაზე ფორმდება. ქართულ სამძებრო
    ველში ამას ხშირად „manqanis qiraoba"-დაც წერენ — პასუხი იგივეა.

    ## მართვის მოწმობა და IDP

    ევროკავშირის, აშშ-ის, დიდი ბრიტანეთის, ისრაელისა და დსთ-ს ქვეყნების მოწმობები საქართველოში
    პირდაპირ მოქმედებს. თუ თქვენი ეროვნული მოწმობა სხვა ანბანითაა — არაბული, სპარსული, ებრაული,
    ჩინური, იაპონური, ან ქართული მოწმობა უცხოეთში — IDP მასთან ერთად წამოიღეთ. IDP თარგმანია და
    არა შემცვლელი, ამიტომ ეროვნული მოწმობაც თან უნდა გქონდეთ.

    ## ასაკი და მართვის სტაჟი კატეგორიების მიხედვით

    | კატეგორია | მინიმალური ასაკი | სტაჟი | ახალგაზრდა მძღოლის დანამატი |
    |---|---|---|---|
    | [ეკონომი](/car-rental/economy/) | 21 | 2 წელი | არ არის |
    | [კროსოვერი / SUV](/car-rental/suv/) | 23 | 3 წელი | 15 ₾/დღე, 23–25 წელი |
    | [ბიზნეს კლასი](/car-rental/business/) | 25 | 5 წელი | 25 ₾/დღე, 25–27 წელი |
    | [ჯიპი 4x4](/car-rental/4x4/) | 25 | 4 წელი | 25 ₾/დღე, 25–27 წელი |
    | [მინივენი](/car-rental/minivan/) | 23 | 3 წელი | 15 ₾/დღე, 23–25 წელი |
    | [კომერციული ფურგონი](/car-rental/van/) | 25 | 3 წელი | არ არის |

    მაქსიმალური ასაკი შეზღუდული არ არის. **დამატებითი მძღოლი 20 ₾ დღეში ჯდება, მაქსიმუმ ორი.**
    თითოეულმა იგივე ასაკისა და სტაჟის მოთხოვნები უნდა დააკმაყოფილოს და ხელშეკრულებას ხელი
    მოაწეროს, რადგან ხელშეკრულებაში მიუთითებელი მძღოლის მიერ მიყენებული ზიანი არ იფარება.

    ## დეპოზიტი და მისი დაბრუნება

    | კატეგორია | დეპოზიტი | CDW ფრანშიზა |
    |---|---|---|
    | ეკონომი | 300 ₾ | 300 ₾ |
    | კროსოვერი / SUV | 600 ₾ | 600 ₾ |
    | კომერციული ფურგონი | 800 ₾ | 800 ₾ |
    | ბიზნეს კლასი | 1000 ₾ | 1000 ₾ |
    | მინივენი | 1000 ₾ | 1000 ₾ |
    | ჯიპი 4x4 | 1200 ₾ | 1200 ₾ |

    ბარათზე დეპოზიტი **იბლოკება და არა ჩამოიჭრება** და ავტომობილის ჩაბარებიდან **3 სამუშაო დღეში**
    თავისუფლდება, თუ არც დაზიანებაა და არც ჯარიმა. ნაღდი ანგარიშსწორებისას დეპოზიტი ნაღდად აიღება
    და ადგილზევე ბრუნდება. უდეპოზიტო ვარიანტი არცერთ კატეგორიაზე არ არსებობს — ამას პირდაპირ
    ვწერთ, რადგან „მანქანის ქირაობა დეპოზიტის გარეშე" ხშირი კითხვაა და პატიოსანი პასუხი ერთია.

    ## რას ფარავს დაზღვევა და რამდენია ფრანშიზა

    ტარიფში შედის **CDW** (ავტომობილის დაზიანება ფრანშიზის ზემოთ) და **TPL** (მესამე პირის წინაშე
    პასუხისმგებლობა). ფრანშიზა ზემოთ ცხრილში მოცემული თანხაა და ავტომობილის ნებისმიერი დაზიანებისას
    მოქმედებს. **SCDW** — 25–45 ₾ დღეში კატეგორიის მიხედვით — ფრანშიზას ამცირებს; ჯიპ 4x4-ზე
    SCDW-ითაც 300 ₾ ფრანშიზა რჩება.

    არ იფარება, რაც არ უნდა დაამატოთ: ალკოჰოლის ან ნარკოტიკის ზემოქმედების ქვეშ მართვა;
    ხელშეკრულებაში მიუთითებელი მძღოლი; გრუნტიან ან უასფალტო გზაზე დაზიანება, თუ ავტომობილი 4x4
    კატეგორიის არ არის; საბურავები, დისკები, ქვედა ნაწილი, სარკეები და სალონი (საბურავის შეცვლა
    120–400 ₾); გასაღების დაკარგვა (400–1200 ₾ მოდელის მიხედვით); არასწორი საწვავი; და ნებისმიერი
    კომერციული გამოყენება — ტაქსი, კურიერი, გადაზიდვა — წინასწარი წერილობითი თანხმობის გარეშე.
    თუშეთის გზა [აბანოს უღელტეხილზე](/attractions/abano-pass/) წინასწარ წერილობით შეთანხმებას ითხოვს
    და მასზე დამატებითი ფრანშიზა 500 ₾ მოქმედებს; [უშგულის](/attractions/ushguli/) გრუნტიანი
    მონაკვეთი მხოლოდ 4x4 კატეგორიითაა ნებადართული.

    ## საწვავი, გარბენი და ჯარიმები

    - **სავსედან სავსემდე.** თუ ავზი არასრული დაბრუნდა, იხდით საწვავს და 20 ₾ მომსახურების
      საფასურს. ჰიბრიდები მხოლოდ ბენზინზე დადიან და დატენვას არ საჭიროებენ.
    - **გარბენი საქართველოს ტერიტორიაზე შეუზღუდავია.** საზღვრის კვეთისას მოქმედებს 300 კმ დღიური
      ლიმიტი, ზედმეტი კილომეტრი — 0.5 ₾.
    - **საგზაო ჯარიმა თქვენია** და გაქირავებიდან 30 დღის განმავლობაში შეიძლება მოვიდეს: ჯარიმის
      თანხა და 20 ₾ ადმინისტრირებისთვის.
    - **გადაბარებისას ვიღებთ ოთხივე მხარეს, სალონს, გარბენსა და საწვავის დონეს** და იგივეს
      ჩაბარებისას ვიმეორებთ. თქვენი ასლებიც შეინახეთ.

    ## საზღვრის კვეთა, როგორც პირობებშია

    | ქვეყანა | სტატუსი | საფასური | დღიური ლიმიტი |
    |---|---|---|---|
    | სომხეთი | ნებადართული | 150 ₾ | 300 კმ |
    | თურქეთი | ნებადართული, შერჩეული კატეგორიები | 250 ₾ | 300 კმ |
    | აზერბაიჯანი | აკრძალული | — | — |
    | რუსეთი | აკრძალული | — | — |

    შეგვატყობინეთ **მინიმუმ 48 საათით ადრე**, რადგან საერთაშორისო სადაზღვევო პოლისი და მინდობილობა
    უნდა მომზადდეს. ნებართვის გარეშე საზღვრის კვეთა ხელშეკრულების დარღვევაა და დეპოზიტის სრულ
    დაკავებას იწვევს.

    ## ჯავშანი, გაუქმება, გაგრძელება და დახმარება გზაზე

    - **წინასწარი გადახდა არ არის.** დადასტურება ტელეფონით ან ელფოსტით; ანგარიშსწორება მიღებისას
      ლარში, ან ნაღდად აშშ დოლარსა და ევროში ეროვნული ბანკის კურსით. მიიღება Visa, Mastercard და
      American Express.
    - **გაუქმება**: 48 საათზე მეტით ადრე — უფასოა; 24–48 საათით ადრე — 1 დღის ტარიფი; 24 საათზე
      ნაკლებ დროში ან გამოუცხადებლობა — 2 დღის ტარიფი. თარიღის ცვლილება უფასოა, თუ ავტომობილი
      თავისუფალია. ვადამდე დაბრუნებისას გამოუყენებელი დღეები ფაქტობრივი ვადის ტარიფით ბრუნდება.
    - **გაგრძელება**: პირობებში ცალკე გაგრძელების ტარიფი არ არის, ამიტომ დაბრუნების დრომდე დაგვირეკეთ
      და დამატებითი დღეები ქირაობის დღეებად შეთანხმდება. შეუთანხმებელი დაგვიანება 2 საათამდე უფასოა,
      შემდეგ — დღიური ტარიფის მესამედი ყოველ 3 საათზე, 8 საათზე მეტი კი სრულ დღედ ითვლება.
    - **საგზაო დახმარება 24/7.** ავარიის შემთხვევაში დარეკეთ 112-ზე, შემდეგ ჩვენს ცხელ ხაზზე და
      ოქმის შედგენამდე ადგილიდან არ წახვიდეთ. თუ მანქანა თქვენი ბრალის გარეშე ტექნიკურად გაჩერდა,
      სანაცვლო 6 საათში უფასოდ მოგივათ.
    - **საბავშვო სავარძელი** 10 ₾ დღეშია და 12 წლამდე ბავშვისთვის კანონით სავალდებულოა.

    ყველაფერი ზემოთ [გაქირავების პირობებიდან](/terms/) და [კითხვა-პასუხიდანაა](/faq/) აღებული —
    სწორედ ეს გვერდები იცვლება, როცა პოლიტიკა იცვლება. თუ ეს სახელმძღვანელო და ის გვერდები ოდესმე
    ერთმანეთს არ დაემთხვა, პირობების გვერდი გადაწონის, ხელმოწერილი ხელშეკრულება კი — ორივეს.
    კატეგორია [ავტომობილის გაქირავების](/car-rental/) გვერდზე აირჩიეთ; თუ ერთი თვით ან მეტით
    რჩებით, [თვიური გაქირავების](/car-rental/monthly/) გვერდი აჩვენებს, როგორ მცირდება ტარიფი
    ვადასთან ერთად, ხოლო თუ გეგმაში მთის გზებია, არჩევანამდე წაიკითხეთ
    [გჭირდებათ თუ არა ჯიპი](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "რა საბუთები სჭირდება უცხოელს საქართველოში მანქანის დასაქირავებლად?"
    a: "პასპორტი, ეროვნული მართვის მოწმობა მინიმუმ 2 წლის სტაჟით და ბარათი ან ნაღდი ფული დეპოზიტისთვის. საერთაშორისო მოწმობა (IDP) მხოლოდ მაშინ, თუ მოწმობა ლათინური ანბანით არ არის. წინასწარ არაფერი იხდება."
  - q: "საჭიროა თუ არა საერთაშორისო მართვის მოწმობა საქართველოში?"
    a: "მხოლოდ იმ შემთხვევაში, თუ ეროვნული მოწმობა ლათინური ანბანით არ არის. ევროკავშირის, აშშ-ის, დიდი ბრიტანეთის, ისრაელისა და დსთ-ს მოწმობები პირდაპირ მოქმედებს; არაბულ, სპარსულ, ებრაულ, ჩინურ ან იაპონურ მოწმობას IDP სჭირდება თან."
  - q: "რა ასაკიდან შეიძლება მანქანის დაქირავება?"
    a: "ეკონომი — 21 წლიდან 2 წლის სტაჟით; კროსოვერი და მინივენი — 23 წლიდან 3 წლის სტაჟით; ბიზნეს კლასი (5 წელი), ჯიპი 4x4 (4 წელი) და კომერციული ფურგონი (3 წელი) — 25 წლიდან. 23–25 წლის მძღოლი კროსოვერსა და მინივენზე 15 ₾ დღეში იხდის დამატებით, 25–27 წლის — ბიზნეს კლასსა და 4x4-ზე 25 ₾. მაქსიმალური ასაკი შეზღუდული არ არის."
  - q: "რამდენია დეპოზიტი და როდის ბრუნდება?"
    a: "300 ₾ ეკონომი, 600 ₾ კროსოვერი, 800 ₾ კომერციული ფურგონი, 1000 ₾ ბიზნეს კლასი და მინივენი, 1200 ₾ ჯიპი 4x4. ბარათზე იბლოკება და არა ჩამოიჭრება და ჩაბარებიდან 3 სამუშაო დღეში თავისუფლდება; ნაღდად ადგილზევე ბრუნდება."
  - q: "რას ფარავს CDW და TPL და რამდენია ფრანშიზა?"
    a: "TPL მესამე პირის წინაშე პასუხისმგებლობას ფარავს, CDW — ავტომობილის დაზიანებას ფრანშიზის ზემოთ, ფრანშიზა კი თქვენი კატეგორიის დეპოზიტის ტოლია: 300 ₾ ეკონომიდან 1200 ₾ ჯიპამდე. საბურავები, დისკები, ქვედა ნაწილი და სალონი არასოდეს იფარება. SCDW 25–45 ₾ დღეში ფრანშიზას ამცირებს; ჯიპზე 300 ₾ რჩება."
  - q: "შემიძლია მეორე მძღოლის დამატება?"
    a: "დიახ, 20 ₾ დღეში, მაქსიმუმ ორი დამატებითი მძღოლი. თითოეულმა იგივე ასაკისა და სტაჟის მოთხოვნები უნდა დააკმაყოფილოს და ხელშეკრულებას ხელი მოაწეროს; მიუთითებელი მძღოლი დაზღვევით არ იფარება."
  - q: "შემიძლია მანქანით სომხეთში ან თურქეთში გასვლა?"
    a: "სომხეთი ნებადართულია 150 ₾-ად, თურქეთი — 250 ₾-ად შერჩეულ კატეგორიებზე, ორივე 300 კმ დღიური ლიმიტით და მინიმუმ 48 საათით ადრე შეთანხმებით. აზერბაიჯანი და რუსეთი აკრძალულია, ნებართვის გარეშე კვეთა კი მთელ დეპოზიტს გაკარგვინებთ."
  - q: "ჯავშნისთვის წინასწარ უნდა გადავიხადო?"
    a: "არა. ჯავშანი ტელეფონით ან ელფოსტით დასტურდება და ანგარიშსწორება მიღებისას ხდება. გაუქმება 48 საათზე მეტით ადრე უფასოა, 24–48 საათით ადრე — 1 დღის ტარიფი, 24 საათზე ნაკლებ დროში ან გამოუცხადებლობისას — 2 დღის."

ru:
  name: "Аренда авто в Грузии: требования и документы для иностранцев"
  answer: >-
    Чтобы взять машину в Грузии у RentUp, нужны паспорт, водительское удостоверение со стажем не
    менее 2 лет и карта или наличные для депозита. Международное водительское удостоверение
    требуется только если права не на латинице; права ЕС, США, Великобритании, Израиля и стран СНГ
    принимаются как есть. Минимальный возраст: 21 год для эконом-класса, 23 — для кроссоверов и
    минивэнов, 25 — для бизнес-класса и 4x4. Депозит от 300 ₾ (эконом) до 1200 ₾ (4x4) блокируется,
    а не списывается, и возвращается в течение 3 рабочих дней. Предоплаты нет.
  short: "Что нужно, чтобы взять машину и ездить здесь: возраст и стаж по категориям, правила IDP, депозит и его возврат, что покрывают CDW и TPL и какова франшиза, дополнительные водители, выезд за границу - прямо из условий аренды."
  meta_title: "Аренда авто в Грузии: требования и документы | RentUp"
  meta_description: "Возраст и стаж по категориям, правила IDP, паспорт, депозит и его возврат, CDW и TPL с франшизой, второй водитель и выезд за границу - из условий RentUp."
  body: |
    ## Чек-лист

    Возьмите это на выдачу, и больше ничего оформлять не придётся:

    - **Паспорт** для иностранца или ID-карта для гражданина Грузии.
    - **Национальные водительские права со стажем не менее 2 лет** - для старших категорий больше,
      см. таблицу ниже.
    - **Международные права (IDP) только если ваши права оформлены не латиницей.**
    - **Карта или наличные для депозита.** Депозит блокируется, а не списывается.
    - **Юридическому лицу**: выписка из реестра, доверенность и печать.

    Заранее ничего не платится. Бронь подтверждается по телефону или электронной почте, расчёт
    производится при получении автомобиля, а договор оформляется на грузинском, английском или
    русском языке.

    ## Права и IDP

    Права стран ЕС, США, Великобритании, Израиля и СНГ действуют в Грузии напрямую - в том числе
    российские права, без международных. Если ваши национальные права оформлены другим письмом -
    арабским, персидским, ивритом, китайским, японским или это грузинские права за рубежом, -
    возьмите IDP вместе с ними. IDP - это перевод, а не замена, поэтому национальные права тоже
    нужны.

    ## Возраст и стаж по категориям

    | Категория | Минимальный возраст | Стаж | Надбавка молодого водителя |
    |---|---|---|---|
    | [Эконом](/car-rental/economy/) | 21 | 2 года | нет |
    | [Кроссовер / SUV](/car-rental/suv/) | 23 | 3 года | 15 ₾/сутки, 23-25 лет |
    | [Бизнес-класс](/car-rental/business/) | 25 | 5 лет | 25 ₾/сутки, 25-27 лет |
    | [Внедорожник 4x4](/car-rental/4x4/) | 25 | 4 года | 25 ₾/сутки, 25-27 лет |
    | [Минивэн](/car-rental/minivan/) | 23 | 3 года | 15 ₾/сутки, 23-25 лет |
    | [Коммерческий фургон](/car-rental/van/) | 25 | 3 года | нет |

    Максимальный возраст не ограничен. **Дополнительный водитель - 20 ₾ в сутки, максимум два.**
    Каждый должен соответствовать тем же требованиям по возрасту и стажу и подписать договор:
    ущерб, причинённый водителем, не указанным в договоре, не покрывается.

    ## Депозит и его возврат

    | Категория | Депозит | Франшиза CDW |
    |---|---|---|
    | Эконом | 300 ₾ | 300 ₾ |
    | Кроссовер / SUV | 600 ₾ | 600 ₾ |
    | Коммерческий фургон | 800 ₾ | 800 ₾ |
    | Бизнес-класс | 1000 ₾ | 1000 ₾ |
    | Минивэн | 1000 ₾ | 1000 ₾ |
    | Внедорожник 4x4 | 1200 ₾ | 1200 ₾ |

    На карте депозит **блокируется, а не списывается** и разблокируется в течение **3 рабочих
    дней** после возврата, если нет повреждений и штрафов. При оплате наличными депозит берётся
    наличными и возвращается на месте. Варианта без залога нет ни в одной категории - и мы пишем
    это прямо, потому что запрос «аренда авто без залога» встречается часто.

    ## Что покрывает страховка и какова франшиза

    В тариф входят **CDW** (повреждение автомобиля сверх франшизы) и **TPL** (ответственность
    перед третьими лицами). Франшиза - это сумма из таблицы выше, и она действует при любом
    повреждении автомобиля. **SCDW** за 25-45 ₾ в сутки в зависимости от категории снижает
    франшизу; на внедорожнике 4x4 даже с SCDW остаётся франшиза 300 ₾.

    Не покрывается, что бы вы ни добавили: управление в состоянии опьянения; водитель, не указанный
    в договоре; повреждения на грунтовой или неасфальтированной дороге, если машина не из категории
    4x4; шины, диски, днище, зеркала и салон (замена шины 120-400 ₾); утеря ключей (400-1200 ₾ по
    модели); неправильное топливо; любое коммерческое использование - такси, курьерская доставка,
    перевозки - без предварительного письменного согласия. Дорога в Тушетию через
    [перевал Абано](/attractions/abano-pass/) требует письменного согласования, и на ней действует
    дополнительная франшиза 500 ₾; грунтовый участок до [Ушгули](/attractions/ushguli/) разрешён
    только в категории 4x4.

    ## Топливо, пробег и штрафы

    - **Полный - полный.** Если бак вернулся неполным, вы платите топливо плюс сервисный сбор 20 ₾.
      Гибриды ездят только на бензине и не заряжаются.
    - **Пробег по Грузии не ограничен.** При выезде за границу действует лимит 300 км в сутки,
      каждый лишний километр - 0.5 ₾.
    - **Дорожные штрафы - ваши**, и прийти они могут в течение 30 дней после аренды: сумма штрафа
      плюс 20 ₾ за администрирование.
    - **При выдаче мы фотографируем все четыре стороны, салон, пробег и уровень топлива** и
      повторяем это при возврате. Сохраните и свои снимки.

    ## Выезд за границу, как написано в условиях

    | Страна | Статус | Стоимость | Суточный лимит |
    |---|---|---|---|
    | Армения | разрешён | 150 ₾ | 300 км |
    | Турция | разрешён, отдельные категории | 250 ₾ | 300 км |
    | Азербайджан | запрещён | - | - |
    | Россия | запрещён | - | - |

    Предупредите **минимум за 48 часов**: нужно подготовить международный страховой полис и
    доверенность. Пересечение границы без разрешения - нарушение договора и полное удержание
    депозита.

    ## Бронь, отмена, продление и помощь на дороге

    - **Без предоплаты.** Подтверждение по телефону или почте; оплата при получении в лари или
      наличными в долларах и евро по курсу Национального банка. Принимаются Visa, Mastercard и
      American Express.
    - **Отмена**: более чем за 48 часов - бесплатно; за 24-48 часов - тариф за 1 день; менее чем
      за 24 часа или неявка - тариф за 2 дня. Изменение дат бесплатно, если машина свободна. При
      досрочном возврате неиспользованные дни возвращаются по тарифу фактического срока.
    - **Продление**: отдельного тарифа на продление в условиях нет, поэтому позвоните до времени
      возврата, и дополнительные дни согласуются как дни аренды. Несогласованное опоздание до
      2 часов бесплатно, далее - треть суточного тарифа за каждые 3 часа, а более 8 часов считается
      полными сутками.
    - **Помощь на дороге 24/7.** После ДТП позвоните в 112, затем на нашу горячую линию и не
      покидайте место до составления протокола. Если машину остановила техническая неисправность не
      по вашей вине, подменный автомобиль приедет в течение 6 часов бесплатно.
    - **Детское кресло** - 10 ₾ в сутки; по закону оно обязательно для детей до 12 лет.

    Всё выше взято со [страницы условий](/terms/) и из [вопросов и ответов](/faq/) - именно эти
    страницы меняются вместе с политикой. Если этот гид и те страницы когда-нибудь разойдутся,
    прав будет раздел условий, а подписанный договор - важнее обоих. Категорию выбирайте на
    странице [аренды автомобиля](/car-rental/); если остаётесь на месяц и дольше, страница
    [аренды на месяц](/car-rental/monthly/) показывает, как тариф снижается со сроком, а если в
    плане горные дороги, перед выбором прочитайте
    [нужен ли внедорожник](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "Какие документы нужны иностранцу для аренды авто в Грузии?"
    a: "Паспорт, национальные права со стажем не менее 2 лет и карта или наличные для депозита. Международные права - только если права оформлены не латиницей. Заранее ничего не платится."
  - q: "Нужны ли международные права в Грузии?"
    a: "Только если национальные права оформлены не латиницей. Права ЕС, США, Великобритании, Израиля и СНГ, включая российские, действуют напрямую; к арабским, персидским, ивритским, китайским или японским правам нужен IDP."
  - q: "С какого возраста можно арендовать машину?"
    a: "Эконом - с 21 года при стаже 2 года; кроссоверы и минивэны - с 23 лет при стаже 3 года; бизнес-класс (стаж 5 лет), внедорожник 4x4 (4 года) и коммерческий фургон (3 года) - с 25 лет. Водители 23-25 лет доплачивают 15 ₾ в сутки на кроссоверах и минивэнах, 25-27 лет - 25 ₾ на бизнес-классе и 4x4. Максимальный возраст не ограничен."
  - q: "Каков размер депозита и когда его вернут?"
    a: "300 ₾ эконом, 600 ₾ кроссовер, 800 ₾ коммерческий фургон, 1000 ₾ бизнес-класс и минивэн, 1200 ₾ внедорожник 4x4. На карте сумма блокируется, а не списывается, и разблокируется в течение 3 рабочих дней после возврата; наличными возвращается на месте."
  - q: "Что покрывают CDW и TPL и какова франшиза?"
    a: "TPL - ответственность перед третьими лицами; CDW - повреждение автомобиля сверх франшизы, которая равна депозиту вашей категории: от 300 ₾ на эконом до 1200 ₾ на внедорожнике 4x4. Шины, диски, днище и салон не покрываются никогда. SCDW за 25-45 ₾ в сутки снижает франшизу; на 4x4 остаётся 300 ₾."
  - q: "Можно ли добавить второго водителя?"
    a: "Да, за 20 ₾ в сутки, максимум два дополнительных водителя. Каждый должен соответствовать тем же требованиям по возрасту и стажу и подписать договор; водитель, не указанный в нём, страховкой не покрывается."
  - q: "Можно ли выехать на машине в Армению или Турцию?"
    a: "Армения разрешена за 150 ₾, Турция - за 250 ₾ для отдельных категорий, обе с лимитом 300 км в сутки и согласованием минимум за 48 часов. Азербайджан и Россия запрещены, а пересечение границы без разрешения лишает всего депозита."
  - q: "Нужно ли платить заранее, чтобы забронировать?"
    a: "Нет. Бронь подтверждается по телефону или почте, платите при получении. Отмена более чем за 48 часов бесплатна, за 24-48 часов - тариф за 1 день, менее чем за 24 часа или при неявке - за 2 дня."

fa:
  name: "اجارهٔ خودرو در گرجستان: شرایط و مدارک برای اتباع خارجی"
  answer: >-
    برای اجارهٔ خودرو در گرجستان از RentUp به گذرنامه، گواهی‌نامه‌ای با دست‌کم 2 سال سابقه و کارت یا
    پول نقد برای ودیعه نیاز دارید. گواهی‌نامهٔ بین‌المللی فقط زمانی لازم است که گواهی‌نامه به خط
    لاتین نباشد؛ گواهی‌نامه‌های اتحادیهٔ اروپا، آمریکا، بریتانیا، اسرائیل و کشورهای مستقل
    مشترک‌المنافع همان‌طور که هست پذیرفته می‌شود. حداقل سن: 21 سال برای اقتصادی، 23 برای شاسی‌بلند و
    مینی‌ون، 25 برای بیزنس و 4x4. ودیعه، از 300 ₾ (اقتصادی) تا 1,200 ₾ (4x4)، مسدود می‌شود نه
