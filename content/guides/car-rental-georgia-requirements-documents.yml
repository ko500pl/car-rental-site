  short: "آنچه برای اجاره و رانندگی در اینجا لازم است - سن و سابقه بر پایهٔ رده، قوانین گواهی‌نامهٔ بین‌المللی، ودیعه و آزادسازی آن، پوشش CDW و TPL و فرانشیز، رانندهٔ اضافی، سفر برون‌مرزی - مستقیم از شرایط اجارهٔ ما."
  meta_title: "شرایط و مدارک اجارهٔ خودرو در گرجستان | RentUp"
  meta_description: "سن و سابقه بر پایهٔ رده، قوانین گواهی‌نامهٔ بین‌المللی، گذرنامه، ودیعه و آزادسازی آن، پوشش CDW/TPL و فرانشیز، رانندهٔ اضافی و سفر برون‌مرزی - از شرایط RentUp."
  body: |
    ## فهرست بازبینی

    این‌ها را هنگام تحویل بیاورید و چیز دیگری لازم نیست:

    - **گذرنامه** برای اتباع خارجی، یا کارت شناسایی برای شهروندان گرجستان.
    - **گواهی‌نامهٔ ملی با دست‌کم 2 سال سابقه** - برای رده‌های بالاتر بیشتر، جدول زیر را ببینید.
    - **گواهی‌نامهٔ بین‌المللی (IDP) فقط اگر گواهی‌نامهٔ شما به الفبای لاتین نیست** - شامل
      گواهی‌نامهٔ فارسی. IDP ترجمه است نه جایگزین؛ گواهی‌نامهٔ ملی هم همراه باشد.
    - **کارت بانکی یا پول نقد برای ودیعه.** ودیعه بلوکه می‌شود، نه برداشت.
    - **شرکت‌ها**: رونوشت ثبت، وکالت‌نامه و مهر شرکت.

    پیش‌پرداختی در کار نیست. رزرو با تلفن یا ایمیل تأیید می‌شود، پرداخت هنگام تحویل است و قرارداد به
    گرجی، انگلیسی یا روسی تنظیم می‌شود. گواهی‌نامه‌های اتحادیهٔ اروپا، آمریکا، بریتانیا، اسرائیل و
    کشورهای مشترک‌المنافع به همان صورت معتبرند.

    ## سن و سابقه بر پایهٔ رده

    | رده | حداقل سن | سابقهٔ گواهی‌نامه | هزینهٔ رانندهٔ جوان |
    |---|---|---|---|
    | [اکونومی](/car-rental/economy/) | 21 | 2 سال | ندارد |
    | [کراس‌اوور / شاسی‌بلند](/car-rental/suv/) | 23 | 3 سال | 15 ₾ در روز، 23 تا 25 سال |
    | [کلاس بیزنس](/car-rental/business/) | 25 | 5 سال | 25 ₾ در روز، 25 تا 27 سال |
    | [آفرود 4x4](/car-rental/4x4/) | 25 | 4 سال | 25 ₾ در روز، 25 تا 27 سال |
    | [مینی‌ون](/car-rental/minivan/) | 23 | 3 سال | 15 ₾ در روز، 23 تا 25 سال |
    | [ون باری](/car-rental/van/) | 25 | 3 سال | ندارد |

    حداکثر سن ندارد. **رانندهٔ اضافی 20 ₾ در روز، تا دو نفر.** هر یک باید همان شرایط سن و سابقه را
    داشته باشد و قرارداد را امضا کند، چون خسارت رانندهٔ ثبت‌نشده در قرارداد پوشش ندارد.

    ## ودیعه و آزادسازی آن

    | رده | ودیعه | فرانشیز CDW |
    |---|---|---|
    | اکونومی | 300 ₾ | 300 ₾ |
    | کراس‌اوور / شاسی‌بلند | 600 ₾ | 600 ₾ |
    | ون باری | 800 ₾ | 800 ₾ |
    | کلاس بیزنس | 1,000 ₾ | 1,000 ₾ |
    | مینی‌ون | 1,000 ₾ | 1,000 ₾ |
    | آفرود 4x4 | 1,200 ₾ | 1,200 ₾ |

    روی کارت، ودیعه **بلوکه می‌شود نه برداشت** و ظرف **3 روز کاری** پس از بازگرداندن آزاد می‌شود،
    به شرط نبود خسارت یا جریمه. در پرداخت نقدی، ودیعه نقد گرفته و همان‌جا پس داده می‌شود. گزینهٔ
    بدون ودیعه در هیچ رده‌ای وجود ندارد.

    ## بیمه چه چیزی را پوشش می‌دهد و فرانشیز چقدر است

    نرخ شامل **CDW** (خسارت خودرو بالاتر از فرانشیز) و **TPL** (مسئولیت شخص ثالث) است. فرانشیز
    همان رقم جدول بالاست و در هر خسارتی اعمال می‌شود. **SCDW** با 25 تا 45 ₾ در روز فرانشیز را کم
    می‌کند؛ روی آفرود 4x4 حتی با SCDW فرانشیز 300 ₾ می‌ماند.

    پوشش ندارد، هر چه هم اضافه کنید: رانندگی زیر تأثیر الکل یا مواد؛ رانندهٔ ثبت‌نشده؛ خسارت در
    جادهٔ شنی یا خاکی مگر خودرو از ردهٔ 4x4 باشد؛ لاستیک، رینگ، کف خودرو، آینه و کابین (تعویض لاستیک
    120 تا 400 ₾)؛ گم شدن سوئیچ (400 تا 1,200 ₾)؛ سوخت اشتباه؛ و هر استفادهٔ تجاری بدون رضایت کتبی.
    جادهٔ توشتی از [گردنهٔ آبانو](/attractions/abano-pass/) توافق کتبی پیشین و فرانشیز اضافی 500 ₾
    دارد؛ مسیر شنی [اوشگولی](/attractions/ushguli/) فقط با ردهٔ 4x4 مجاز است.

    ## سوخت، کیلومتر و جریمه

    - **پر تحویل، پر بازگشت.** باک کم: بهای سوخت به‌علاوهٔ 20 ₾ هزینهٔ خدمات.
    - **کیلومتر درون گرجستان نامحدود است.** سفر برون‌مرزی سقف روزانهٔ 300 کیلومتر دارد و هر کیلومتر
      اضافی 0.5 ₾.
    - **جریمه‌ها بر عهدهٔ شماست**، تا 30 روز پس از اجاره: مبلغ جریمه به‌علاوهٔ 20 ₾.
    - **هنگام تحویل از چهار طرف خودرو، کابین، کیلومترشمار و سطح سوخت عکس می‌گیریم.**

    ## سفر برون‌مرزی، همان‌گونه که در شرایط آمده

    | کشور | وضعیت | هزینه | سقف روزانه |
    |---|---|---|---|
    | ارمنستان | مجاز | 150 ₾ | 300 کیلومتر |
    | ترکیه | مجاز، رده‌های منتخب | 250 ₾ | 300 کیلومتر |
    | آذربایجان | ممنوع | - | - |
    | روسیه | ممنوع | - | - |

    **دست‌کم 48 ساعت پیش‌تر** اطلاع دهید تا بیمه‌نامهٔ بین‌المللی و وکالت‌نامه آماده شود. عبور بدون
    مجوز نقض قرارداد است و کل ودیعه ضبط می‌شود.

    ## رزرو، لغو، تمدید و امداد جاده‌ای

    - **بدون پیش‌پرداخت.** تأیید با تلفن یا ایمیل؛ پرداخت هنگام تحویل به لاری، یا نقد به دلار و یورو با
      نرخ بانک ملی. Visa، Mastercard و American Express پذیرفته می‌شوند.
    - **لغو**: بیش از 48 ساعت پیش‌تر رایگان؛ 24 تا 48 ساعت پیش‌تر بهای یک روز؛ کمتر از 24 ساعت یا
      عدم حضور بهای دو روز. تغییر تاریخ رایگان است اگر خودرو در دسترس باشد.
    - **تمدید**: شرایط تعرفهٔ جداگانه‌ای برای تمدید ندارد، پس پیش از زمان بازگشت تماس بگیرید تا روزهای
      اضافی به‌عنوان اجاره توافق شود. تأخیر توافق‌نشده تا 2 ساعت رایگان است، سپس یک‌سوم نرخ روزانه
      برای هر 3 ساعت، و بیش از 8 ساعت یک روز کامل.
    - **امداد جاده‌ای 24/7.** پس از تصادف با 112 و سپس با خط پشتیبانی ما تماس بگیرید و تا تنظیم
      گزارش محل را ترک نکنید. در نقص فنی بدون تقصیر شما، خودروی جایگزین ظرف 6 ساعت رایگان می‌رسد.

    همهٔ این‌ها از [شرایط اجاره](/terms/) و [پرسش و پاسخ](/faq/) گرفته شده است؛ اگر روزی این راهنما با
    آن صفحه‌ها اختلاف داشت، صفحهٔ شرایط برنده است و قرارداد امضاشده بر هر دو مقدم. رده را در
    [اجارهٔ خودرو](/car-rental/) انتخاب کنید؛ برای اقامت یک ماه و بیشتر صفحهٔ
    [اجارهٔ ماهانه](/car-rental/monthly/) را ببینید و اگر جادهٔ کوهستانی در برنامه است،
    [آیا به 4x4 نیاز دارید](/guides/do-i-need-a-4x4-in-georgia/) را بخوانید.
  faq:
  - q: "برای اجارهٔ خودرو در گرجستان به‌عنوان تبعهٔ خارجی چه مدارکی لازم است؟"
    a: "گذرنامه، گواهی‌نامهٔ ملی با دست‌کم 2 سال سابقه، و کارت یا پول نقد برای ودیعه. گواهی‌نامهٔ بین‌المللی فقط اگر گواهی‌نامه به الفبای لاتین نباشد. پیش‌پرداختی در کار نیست."
  - q: "آیا با گواهی‌نامهٔ ایرانی به IDP نیاز دارم؟"
    a: "بله. گواهی‌نامهٔ فارسی به الفبای لاتین نیست، پس گواهی‌نامهٔ بین‌المللی را همراه گواهی‌نامهٔ ملی بیاورید؛ IDP جایگزین گواهی‌نامهٔ ملی نیست."
  - q: "حداقل سن اجارهٔ خودرو چقدر است؟"
    a: "اکونومی 21 سال با 2 سال سابقه؛ کراس‌اوور و مینی‌ون 23 سال با 3 سال سابقه؛ کلاس بیزنس (5 سال)، آفرود 4x4 (4 سال) و ون باری (3 سال) از 25 سال. رانندگان 23 تا 25 سال روی کراس‌اوور و مینی‌ون 15 ₾ در روز و 25 تا 27 سال روی بیزنس و 4x4 25 ₾ در روز بیشتر می‌پردازند. حداکثر سن ندارد."
  - q: "ودیعه چقدر است و کی پس داده می‌شود؟"
    a: "300 ₾ اکونومی، 600 ₾ کراس‌اوور، 800 ₾ ون باری، 1,000 ₾ بیزنس و مینی‌ون، 1,200 ₾ آفرود 4x4. روی کارت بلوکه می‌شود نه برداشت و ظرف 3 روز کاری پس از بازگشت آزاد می‌شود؛ نقد همان‌جا پس داده می‌شود."
  - q: "CDW و TPL چه چیزی را پوشش می‌دهند و فرانشیز چقدر است؟"
    a: "TPL مسئولیت شخص ثالث و CDW خسارت خودرو بالاتر از فرانشیز را پوشش می‌دهد؛ فرانشیز برابر ودیعهٔ ردهٔ شماست، از 300 ₾ اکونومی تا 1,200 ₾ آفرود 4x4. لاستیک، رینگ، کف خودرو و کابین هرگز پوشش ندارند. SCDW با 25 تا 45 ₾ در روز فرانشیز را کم می‌کند؛ روی 4x4 فرانشیز 300 ₾ می‌ماند."
  - q: "آیا می‌توانم رانندهٔ دوم اضافه کنم؟"
    a: "بله، 20 ₾ در روز، تا دو رانندهٔ اضافی. هر یک باید همان شرایط سن و سابقه را داشته باشد و قرارداد را امضا کند؛ رانندهٔ ثبت‌نشده پوشش ندارد."
  - q: "آیا می‌توانم با خودرو به ارمنستان یا ترکیه بروم؟"
    a: "ارمنستان با 150 ₾ و ترکیه با 250 ₾ برای رده‌های منتخب مجاز است، هر دو با سقف روزانهٔ 300 کیلومتر و هماهنگی دست‌کم 48 ساعت پیش‌تر. آذربایجان و روسیه ممنوع‌اند و عبور بدون مجوز کل ودیعه را ضبط می‌کند."

he:
  name: "השכרת רכב בגאורגיה: דרישות ומסמכים לזרים"
  answer: >-
    כדי לשכור רכב בגאורגיה מ-RentUp צריך דרכון, רישיון נהיגה בוותק של 2 שנים לפחות, וכרטיס או מזומן
    לפיקדון. רישיון נהיגה בינלאומי נדרש רק אם הרישיון אינו באותיות לטיניות; רישיונות מהאיחוד
    האירופי, ארה"ב, בריטניה, ישראל ומדינות חבר העמים מתקבלים כמות שהם. גיל מינימום: 21 לאקונומי, 23
    לרכבי שטח עירוניים ומיניוואנים, 25 למחלקת עסקים ול-4x4. הפיקדון, 300 ₾ (אקונומי) עד 1,200 ₾
    (4x4), נחסם ולא נגבה, ומשוחרר בתוך 3 ימי עסקים. אין תשלום מראש.
  short: "מה צריך כדי לשכור ולנהוג כאן - גיל וותק לפי קטגוריה, כללי רישיון בינלאומי, פיקדון ושחרורו, מה מכסים CDW ו-TPL וגובה ההשתתפות העצמית, נהג נוסף, חציית גבול - ישירות מתנאי ההשכרה שלנו."
  meta_title: "השכרת רכב בגאורגיה: דרישות ומסמכים | RentUp"
  meta_description: "גיל וותק נהיגה לפי קטגוריית רכב, כללי רישיון בינלאומי, דרכון, פיקדון ושחרורו, כיסוי CDW/TPL וההשתתפות העצמית, נהג נוסף וחציית גבול - מתנאי ההשכרה של RentUp."
  body: |
    ## רשימת הבדיקה

    הביאו את אלה למסירה, ואין מה להסדיר מעבר לכך:

    - **דרכון** לאזרח זר, או תעודת זהות לאזרח גאורגי.
    - **רישיון נהיגה לאומי בוותק של 2 שנים לפחות** - יותר בקטגוריות גבוהות, ראו טבלה.
    - **רישיון נהיגה בינלאומי (IDP) רק אם הרישיון שלכם אינו באותיות לטיניות.** רישיון ישראלי תקף
      בגאורגיה כמות שהוא, בלי IDP.
    - **כרטיס אשראי או מזומן לפיקדון.** הפיקדון נחסם ואינו נגבה.
    - **חברות**: נסח מרשם החברות, ייפוי כוח וחותמת.

    לא משלמים דבר מראש. ההזמנה מאושרת בטלפון או בדוא"ל, התשלום מתבצע בקבלת הרכב, וההסכם נערך
    בגאורגית, באנגלית או ברוסית. רישיונות מהאיחוד האירופי, מארצות הברית, מבריטניה, מישראל וממדינות
    חבר העמים תקפים כמות שהם; רישיון בכתב ערבי, פרסי, סיני או יפני צריך IDP לצידו.

    ## גיל וותק נהיגה לפי קטגוריה

    | קטגוריה | גיל מינימלי | ותק רישיון | תוספת נהג צעיר |
    |---|---|---|---|
    | [אקונומי](/car-rental/economy/) | 21 | 2 שנים | אין |
    | [קרוסאובר / רכב שטח עירוני](/car-rental/suv/) | 23 | 3 שנים | 15 ₾ ליום, גילאי 23 עד 25 |
    | [מחלקת עסקים](/car-rental/business/) | 25 | 5 שנים | 25 ₾ ליום, גילאי 25 עד 27 |
    | [רכב שטח 4x4](/car-rental/4x4/) | 25 | 4 שנים | 25 ₾ ליום, גילאי 25 עד 27 |
    | [מיניוואן](/car-rental/minivan/) | 23 | 3 שנים | 15 ₾ ליום, גילאי 23 עד 25 |
    | [ואן מסחרי](/car-rental/van/) | 25 | 3 שנים | אין |

    אין גיל מרבי. **נהג נוסף עולה 20 ₾ ליום, עד שניים.** כל אחד חייב לעמוד באותן דרישות גיל וותק
    ולחתום על ההסכם, כי נזק שגרם נהג שאינו רשום בהסכם אינו מכוסה.

    ## הפיקדון ושחרורו

    | קטגוריה | פיקדון | השתתפות עצמית CDW |
    |---|---|---|
    | אקונומי | 300 ₾ | 300 ₾ |
    | קרוסאובר / רכב שטח עירוני | 600 ₾ | 600 ₾ |
    | ואן מסחרי | 800 ₾ | 800 ₾ |
    | מחלקת עסקים | 1,000 ₾ | 1,000 ₾ |
    | מיניוואן | 1,000 ₾ | 1,000 ₾ |
    | רכב שטח 4x4 | 1,200 ₾ | 1,200 ₾ |

    בכרטיס הפיקדון **נחסם ואינו נגבה**, ומשוחרר בתוך **3 ימי עסקים** מההחזרה, בתנאי שאין נזק או
    קנס. בתשלום במזומן הפיקדון נלקח במזומן ומוחזר במקום. אין אפשרות ללא פיקדון באף קטגוריה.

    ## מה הביטוח מכסה, ומה ההשתתפות העצמית

    התעריף כולל **CDW** (נזק לרכב מעל ההשתתפות העצמית) ו-**TPL** (אחריות כלפי צד שלישי). ההשתתפות
    העצמית היא הסכום בטבלה למעלה, והיא חלה בכל נזק לרכב. **SCDW** ב-25 עד 45 ₾ ליום לפי קטגוריה
    מקטין אותה; ברכב שטח 4x4 נשארת השתתפות עצמית של 300 ₾ גם עם SCDW.

    לא מכוסה, יהיה מה שתוסיפו: נהיגה תחת השפעה; נהג שאינו רשום בהסכם; נזק בדרכי חצץ או בדרכים לא
    סלולות אלא אם הרכב בקטגוריית 4x4; צמיגים, חישוקים, תחתית, מראות ותא הנוסעים (החלפת צמיג 120 עד
    400 ₾); אובדן מפתחות (400 עד 1,200 ₾); תדלוק שגוי; וכל שימוש מסחרי ללא הסכמה בכתב. דרך טושתי
    דרך [מעבר אבאנו](/attractions/abano-pass/) דורשת סיכום מראש בכתב ונושאת השתתפות עצמית נוספת
    של 500 ₾; קטע החצץ ל[אושגולי](/attractions/ushguli/) מותר בקטגוריית 4x4 בלבד.

    ## דלק, קילומטראז' וקנסות

    - **מלא למלא.** מיכל שחוזר חסר - עלות הדלק ועוד 20 ₾ דמי טיפול.
    - **הקילומטראז' בתוך גאורגיה ללא הגבלה.** בחציית גבול חלה מגבלה של 300 ק"מ ליום, 0.5 ₾ לכל
      ק"מ נוסף.
    - **קנסות תנועה על חשבונכם**, ועשויים להגיע עד 30 יום אחרי ההשכרה: סכום הקנס ועוד 20 ₾.
    - **במסירה אנו מצלמים את ארבעת הצדדים, תא הנוסעים, מד המרחק ומפלס הדלק**, וחוזרים על כך
      בהחזרה.

    ## חציית גבול, כפי שכתוב בתנאים

    | מדינה | מעמד | עלות | מגבלה יומית |
    |---|---|---|---|
    | ארמניה | מותר | 150 ₾ | 300 ק"מ |
    | טורקיה | מותר, קטגוריות נבחרות | 250 ₾ | 300 ק"מ |
    | אזרביג'ן | אסור | - | - |
    | רוסיה | אסור | - | - |

    הודיעו **לפחות 48 שעות מראש**, כי יש להכין פוליסת ביטוח בינלאומית וייפוי כוח. חצייה ללא אישור
    היא הפרה של ההסכם וחילוט מלוא הפיקדון.

    ## הזמנה, ביטול, הארכה ועזרה בדרך

    - **בלי תשלום מראש.** אישור בטלפון או בדוא"ל; תשלום בקבלה בלארי, או במזומן בדולרים ובאירו לפי
      שער הבנק הלאומי. מתקבלים Visa, Mastercard ו-American Express.
    - **ביטול**: יותר מ-48 שעות מראש - חינם; 24 עד 48 שעות - תעריף של יום; פחות מ-24 שעות או
      אי-הופעה - תעריף של יומיים. שינוי תאריכים חינם אם הרכב פנוי.
    - **הארכה**: בתנאים אין תעריף הארכה נפרד, לכן התקשרו לפני שעת ההחזרה והימים הנוספים יסוכמו
      כימי השכרה. איחור לא מתואם חינם עד שעתיים, אחר כך שליש מהתעריף היומי לכל 3 שעות, ומעל 8
      שעות נחשב ליום מלא.
    - **שירות דרך 24/7.** אחרי תאונה התקשרו ל-112, אחר כך למוקד שלנו, והישארו במקום עד עריכת
      הדוח. אם תקלה טכנית שאינה באשמתכם עוצרת את הרכב, רכב חלופי מגיע בתוך 6 שעות ללא תשלום.
    - **כיסא ילדים** 10 ₾ ליום, וחובה לילדים מתחת לגיל 12.

    כל האמור לקוח מ[תנאי ההשכרה](/terms/) ומ[השאלות והתשובות](/faq/); אם המדריך והעמודים האלה
    יסתרו זה את זה, עמוד התנאים גובר, וההסכם החתום גובר על שניהם. בחרו קטגוריה ב[השכרת רכב](/car-rental/);
    לשהייה של חודש ומעלה ראו את עמוד [ההשכרה החודשית](/car-rental/monthly/), ואם בתוכנית דרכי הרים,
    קראו [האם צריך 4x4](/guides/do-i-need-a-4x4-in-georgia/) לפני הבחירה.
  faq:
  - q: "אילו מסמכים צריך זר כדי לשכור רכב בגאורגיה?"
    a: "דרכון, רישיון נהיגה לאומי בוותק של 2 שנים לפחות, וכרטיס או מזומן לפיקדון. רישיון בינלאומי רק אם הרישיון אינו באותיות לטיניות. לא משלמים דבר מראש."
  - q: "האם רישיון נהיגה ישראלי תקף בגאורגיה?"
    a: "כן, כמות שהוא, בלי רישיון בינלאומי - לפי תנאי ההשכרה רישיונות מישראל, מהאיחוד האירופי, מארצות הברית, מבריטניה וממדינות חבר העמים תקפים ישירות."
  - q: "מה גיל המינימום להשכרת רכב?"
    a: "אקונומי מגיל 21 עם ותק 2 שנים; קרוסאובר ומיניוואן מגיל 23 עם ותק 3 שנים; מחלקת עסקים (5 שנים), רכב שטח 4x4 (4 שנים) וואן מסחרי (3 שנים) מגיל 25. נהגים בגילאי 23 עד 25 משלמים 15 ₾ ליום נוספים בקרוסאובר ובמיניוואן, ובגילאי 25 עד 27 - 25 ₾ במחלקת עסקים וב-4x4. אין גיל מרבי."
  - q: "מה גובה הפיקדון ומתי הוא מוחזר?"
    a: "300 ₾ אקונומי, 600 ₾ קרוסאובר, 800 ₾ ואן מסחרי, 1,000 ₾ מחלקת עסקים ומיניוואן, 1,200 ₾ רכב שטח 4x4. בכרטיס הוא נחסם ואינו נגבה, ומשוחרר בתוך 3 ימי עסקים מההחזרה; במזומן הוא מוחזר במקום."
  - q: "מה מכסים CDW ו-TPL, ומה ההשתתפות העצמית?"
    a: "TPL מכסה אחריות כלפי צד שלישי; CDW מכסה נזק לרכב מעל ההשתתפות העצמית, השווה לפיקדון של הקטגוריה שלכם, מ-300 ₾ באקונומי עד 1,200 ₾ ברכב שטח 4x4. צמיגים, חישוקים, תחתית ותא הנוסעים לעולם אינם מכוסים. SCDW ב-25 עד 45 ₾ ליום מקטין את ההשתתפות העצמית; ב-4x4 נשארים 300 ₾."
  - q: "אפשר להוסיף נהג שני?"
    a: "כן, ב-20 ₾ ליום, עד שני נהגים נוספים. כל אחד חייב לעמוד באותן דרישות גיל וותק ולחתום על ההסכם; נהג שאינו רשום בו אינו מכוסה."
  - q: "אפשר לקחת את הרכב לארמניה או לטורקיה?"
    a: "ארמניה מותרת ב-150 ₾ וטורקיה ב-250 ₾ בקטגוריות נבחרות, שתיהן עם מגבלה של 300 ק\"מ ליום ובתיאום לפחות 48 שעות מראש. אזרביג'ן ורוסיה אסורות, וחצייה ללא אישור מחלטת את מלוא הפיקדון."

ar:
  name: "استئجار سيارة في جورجيا: الشروط والمستندات للأجانب"
  answer: >-
    لاستئجار سيارة في جورجيا من RentUp تحتاج إلى جواز سفر، ورخصة قيادة مضى عليها 2 سنة على الأقل،
    وبطاقة أو نقد للوديعة. رخصة القيادة الدولية مطلوبة فقط إذا لم تكن الرخصة بالحروف اللاتينية؛ رخص
    الاتحاد الأوروبي والولايات المتحدة وبريطانيا وإسرائيل ودول رابطة الدول المستقلة تُقبل كما هي.
    الحد الأدنى للعمر: 21 للفئة الاقتصادية، و23 للكروس أوفر والميني فان، و25 لفئة رجال الأعمال
    والدفع الرباعي 4x4. الوديعة، من 300 ₾ (اقتصادية) إلى 1,200 ₾ (4x4)، تُحجز ولا تُخصم، وتُحرَّر
    خلال 3 أيام عمل. لا دفع مسبق.
  short: "ما تحتاجه لتستأجر وتقود هنا - العمر والخبرة بحسب الفئة، وقواعد الرخصة الدولية، والوديعة وتحريرها، وما يغطيه CDW وTPL ومبلغ التحمّل، والسائق الإضافي، وعبور الحدود - مباشرة من شروط الإيجار عندنا."
  meta_title: "شروط ومستندات استئجار سيارة في جورجيا | RentUp"
  meta_description: "العمر وخبرة القيادة بحسب الفئة، وقواعد الرخصة الدولية، وجواز السفر، والوديعة وتحريرها، وتغطية CDW/TPL والتحمّل، والسائق الإضافي وعبور الحدود - من شروط RentUp."
  body: |
    ## القائمة

    أحضر هذه عند التسليم ولا شيء آخر يلزم ترتيبه:

    - **جواز السفر** للأجنبي، أو بطاقة الهوية للمواطن الجورجي.
    - **رخصة قيادة وطنية بخبرة سنتين على الأقل** - وأكثر للفئات الأعلى، انظر الجدول.
    - **رخصة قيادة دولية (IDP) فقط إذا لم تكن رخصتك بالأبجدية اللاتينية** - وهذا يشمل الرخصة
      العربية. الرخصة الدولية ترجمة لا بديل؛ فالرخصة الوطنية تُحضَر معها.
    - **بطاقة مصرفية أو نقد للوديعة.** الوديعة تُحجز ولا تُخصم.
    - **الشركات**: مستخرج من السجل، وتوكيل رسمي، وختم الشركة.

    لا يُدفع شيء مقدَّماً. يُؤكَّد الحجز بالهاتف أو البريد الإلكتروني، ويُدفع عند الاستلام، ويُحرَّر
    العقد بالجورجية أو الإنجليزية أو الروسية. ورخص الاتحاد الأوروبي والولايات المتحدة والمملكة
    المتحدة وإسرائيل ودول رابطة الدول المستقلة سارية كما هي.

    ## العمر وخبرة القيادة بحسب الفئة

    | الفئة | الحد الأدنى للعمر | خبرة الرخصة | رسم السائق الشاب |
    |---|---|---|---|
    | [اقتصادية](/car-rental/economy/) | 21 | سنتان | لا يوجد |
    | [كروس أوفر / دفع رباعي](/car-rental/suv/) | 23 | 3 سنوات | 15 ₾ يومياً، من 23 إلى 25 سنة |
    | [فئة رجال الأعمال](/car-rental/business/) | 25 | 5 سنوات | 25 ₾ يومياً، من 25 إلى 27 سنة |
    | [وعرة 4x4](/car-rental/4x4/) | 25 | 4 سنوات | 25 ₾ يومياً، من 25 إلى 27 سنة |
    | [ميني فان](/car-rental/minivan/) | 23 | 3 سنوات | 15 ₾ يومياً، من 23 إلى 25 سنة |
    | [فان تجاري](/car-rental/van/) | 25 | 3 سنوات | لا يوجد |

    لا حد أقصى للعمر. **السائق الإضافي 20 ₾ يومياً، بحد أقصى اثنين.** على كل منهما استيفاء شروط
    العمر والخبرة نفسها وتوقيع العقد، لأن الضرر الذي يسببه سائق غير مُدرَج في العقد غير مشمول.

    ## الوديعة وتحريرها

    | الفئة | الوديعة | تحمّل CDW |
    |---|---|---|
    | اقتصادية | 300 ₾ | 300 ₾ |
    | كروس أوفر / دفع رباعي | 600 ₾ | 600 ₾ |
    | فان تجاري | 800 ₾ | 800 ₾ |
    | فئة رجال الأعمال | 1,000 ₾ | 1,000 ₾ |
    | ميني فان | 1,000 ₾ | 1,000 ₾ |
    | وعرة 4x4 | 1,200 ₾ | 1,200 ₾ |

    على البطاقة **تُحجز الوديعة ولا تُخصم**، وتُحرَّر خلال **3 أيام عمل** من الإعادة، بشرط عدم وجود
    ضرر أو مخالفة. وعند الدفع نقداً تُؤخذ الوديعة نقداً وتُردّ في المكان. ولا يوجد خيار بلا وديعة
    في أي فئة.

    ## ما يغطيه التأمين، ومبلغ التحمّل

    تشمل التعرفة **CDW** (أضرار السيارة فوق مبلغ التحمّل) و**TPL** (المسؤولية تجاه الغير). مبلغ
    التحمّل هو الرقم في الجدول أعلاه، ويُطبَّق عند أي ضرر يلحق بالسيارة. و**SCDW** بسعر 25 إلى
    45 ₾ يومياً بحسب الفئة يخفّض التحمّل؛ وفي السيارة الوعرة 4x4 يبقى تحمّل 300 ₾ حتى مع SCDW.

    غير مشمول مهما أضفت: القيادة تحت تأثير الكحول أو المخدرات؛ سائق غير مُدرَج في العقد؛ الأضرار
    على الطرق الحصوية أو غير المعبّدة ما لم تكن السيارة من فئة 4x4؛ الإطارات والجنوط وأسفل الهيكل
    والمرايا والمقصورة (استبدال الإطار 120 إلى 400 ₾)؛ فقدان المفاتيح (400 إلى 1,200 ₾)؛ الوقود
    الخاطئ؛ وأي استخدام تجاري دون موافقة خطية. وطريق توشيتي عبر [ممر أبانو](/attractions/abano-pass/)
    يحتاج موافقة خطية مسبقة ويحمل تحمّلاً إضافياً قدره 500 ₾؛ والمقطع الحصوي إلى
    [أوشغولي](/attractions/ushguli/) مسموح في فئة 4x4 وحدها.

    ## الوقود والمسافة والمخالفات

    - **ممتلئ إلى ممتلئ.** إذا عاد الخزان ناقصاً تدفع الوقود ورسم خدمة 20 ₾.
    - **المسافة داخل جورجيا غير محدودة.** ولعبور الحدود حد يومي 300 كم، و0.5 ₾ لكل كيلومتر إضافي.
    - **المخالفات المرورية عليك**، وقد تصل خلال 30 يوماً بعد الإيجار: قيمة المخالفة و20 ₾.
    - **عند التسليم نصوّر الجهات الأربع والمقصورة والعداد ومستوى الوقود**، ونكرر ذلك عند الإعادة.

    ## عبور الحدود كما تكتبه الشروط

    | الدولة | الحالة | الرسم | الحد اليومي |
    |---|---|---|---|
    | أرمينيا | مسموح | 150 ₾ | 300 كم |
    | تركيا | مسموح، فئات محدّدة | 250 ₾ | 300 كم |
    | أذربيجان | ممنوع | - | - |
    | روسيا | ممنوع | - | - |

    أبلغنا **قبل 48 ساعة على الأقل**، لأن وثيقة تأمين دولية وتوكيلاً رسمياً يجب إعدادهما. والعبور
    دون إذن إخلال بالعقد ومصادرة للوديعة كاملة.

    ## الحجز والإلغاء والتمديد والمساعدة على الطريق

    - **بلا دفع مقدَّم.** التأكيد بالهاتف أو البريد؛ والدفع عند الاستلام باللاري، أو نقداً بالدولار
      واليورو بسعر البنك الوطني. وتُقبل Visa وMastercard وAmerican Express.
    - **الإلغاء**: قبل أكثر من 48 ساعة مجاني؛ قبل 24 إلى 48 ساعة أجرة يوم؛ قبل أقل من 24 ساعة أو
      عدم الحضور أجرة يومين. وتغيير التواريخ مجاني إذا كانت السيارة متاحة.
    - **التمديد**: لا تنشر الشروط تعرفة تمديد منفصلة، فاتصل بنا قبل موعد الإعادة لتُتفق الأيام
      الإضافية كأيام إيجار. والتأخر غير المتفق عليه مجاني حتى ساعتين، ثم ثلث التعرفة اليومية عن كل
      3 ساعات، وما زاد على 8 ساعات يُحسب يوماً كاملاً.
    - **مساعدة على الطريق 24/7.** بعد الحادث اتصل بـ112 ثم بخطنا الساخن، وابقَ في المكان حتى تحرير
      المحضر. وإن أوقف السيارةَ عطلٌ فني ليس من فعلك، تصل سيارة بديلة خلال 6 ساعات دون رسوم.
    - **مقعد الطفل** 10 ₾ يومياً، وإلزامي لمن هم دون 12 سنة.

    كل ما سبق مأخوذ من [شروط الإيجار](/terms/) و[الأسئلة الشائعة](/faq/)؛ فإن اختلف هذا الدليل يوماً
    مع تلك الصفحات فصفحة الشروط هي الغالبة، والعقد الموقَّع يغلب الاثنين. اختر الفئة في
    [تأجير السيارات](/car-rental/)؛ ولإقامة شهر فأكثر راجع صفحة [الإيجار الشهري](/car-rental/monthly/)،
    وإن كانت الطرق الجبلية في خطتك فاقرأ [هل تحتاج إلى دفع رباعي](/guides/do-i-need-a-4x4-in-georgia/)
    قبل الاختيار.
  faq:
  - q: "ما المستندات التي يحتاجها الأجنبي لاستئجار سيارة في جورجيا؟"
    a: "جواز السفر، ورخصة قيادة وطنية بخبرة سنتين على الأقل، وبطاقة أو نقد للوديعة. والرخصة الدولية فقط إذا لم تكن الرخصة بالأبجدية اللاتينية. ولا يُدفع شيء مقدَّماً."
  - q: "هل أحتاج رخصة دولية مع رخصتي العربية؟"
    a: "نعم. الرخصة العربية ليست بالأبجدية اللاتينية، فأحضر الرخصة الدولية مع الرخصة الوطنية؛ الرخصة الدولية لا تحل محل الوطنية."
  - q: "ما الحد الأدنى لعمر استئجار سيارة؟"
    a: "الاقتصادية من 21 سنة بخبرة سنتين؛ الكروس أوفر والميني فان من 23 سنة بخبرة 3 سنوات؛ فئة رجال الأعمال (5 سنوات) والوعرة 4x4 (4 سنوات) والفان التجاري (3 سنوات) من 25 سنة. ويدفع السائقون من 23 إلى 25 سنة 15 ₾ يومياً إضافية على الكروس أوفر والميني فان، ومن 25 إلى 27 سنة 25 ₾ على فئة رجال الأعمال و4x4. ولا حد أقصى للعمر."
  - q: "كم الوديعة ومتى تُردّ؟"
    a: "300 ₾ اقتصادية، 600 ₾ كروس أوفر، 800 ₾ فان تجاري، 1,000 ₾ رجال أعمال وميني فان، 1,200 ₾ وعرة 4x4. على البطاقة تُحجز ولا تُخصم وتُحرَّر خلال 3 أيام عمل من الإعادة؛ ونقداً تُردّ في المكان."
  - q: "ما الذي يغطيه CDW وTPL، وما مبلغ التحمّل؟"
    a: "TPL يغطي المسؤولية تجاه الغير؛ وCDW يغطي أضرار السيارة فوق التحمّل، الذي يساوي وديعة فئتك، من 300 ₾ للاقتصادية إلى 1,200 ₾ للوعرة 4x4. والإطارات والجنوط وأسفل الهيكل والمقصورة غير مشمولة أبداً. وSCDW بسعر 25 إلى 45 ₾ يومياً يخفّض التحمّل؛ وفي 4x4 يبقى 300 ₾."
  - q: "هل يمكنني إضافة سائق ثانٍ؟"
    a: "نعم، بـ20 ₾ يومياً، بحد أقصى سائقين إضافيين. على كل منهما استيفاء شروط العمر والخبرة نفسها وتوقيع العقد؛ والسائق غير المُدرَج فيه غير مشمول."
  - q: "هل يمكنني أخذ السيارة إلى أرمينيا أو تركيا؟"
    a: "أرمينيا مسموحة بـ150 ₾ وتركيا بـ250 ₾ لفئات محدّدة، وكلتاهما بحد يومي 300 كم وبترتيب قبل 48 ساعة على الأقل. وأذربيجان وروسيا ممنوعتان، والعبور دون إذن يصادر الوديعة كاملة."
