en:
  name: "Car Rental in Georgia: Requirements and Documents for Foreigners"
  answer: >-
    To rent a car in Georgia from RentUp you need a passport, a driving licence held at least 2
    years, and a card or cash for the deposit. An International Driving Permit is needed only if the
    licence is not in the Latin alphabet; EU, US, UK, Israeli and CIS licences are accepted as they
    are. Minimum age: 21 economy, 23 SUVs and minivans, 25 business and 4x4. The deposit, 300 ₾
    (economy) to 1,200 ₾ (4x4), is blocked not charged and released within 3 business days. Nothing
    is prepaid.
  short: "What you need to rent and drive here - age and licence by category, IDP rules, the deposit and its release, what CDW and TPL cover and the excess, extra drivers, cross-border - taken straight from our rental terms."
  meta_title: "Car Rental Requirements in Georgia: Documents | RentUp"
  meta_description: "Age and licence years by car category, IDP rules, passport, deposit and release, CDW/TPL cover and the excess, extra drivers, cross-border: from RentUp terms."
  body: |
    ## The checklist

    Bring these to the handover and there is nothing else to arrange:

    - **Passport** for foreign nationals, or an ID card for Georgian citizens.
    - **A national driving licence held for at least 2 years** - longer for higher categories, see the
      table below.
    - **An International Driving Permit only if your licence is not printed in the Latin alphabet.**
    - **A card, or cash, for the deposit.** The deposit is blocked, not charged.
    - **Companies**: an extract from the register, a power of attorney and the company stamp.

    Nothing is paid in advance. A booking is confirmed by phone or email, payment is made at pickup,
    and the rental agreement is drawn up in Georgian, English or Russian.

    ## Licence and IDP

    Licences from the EU, the USA, the United Kingdom, Israel and the CIS countries are valid in
    Georgia as they are. If your national licence is in another script - Arabic, Persian, Hebrew,
    Chinese, Japanese, or a Georgian licence used abroad - bring an IDP alongside it. The IDP is a
    translation, not a substitute, so the national licence still comes too.

    ## Age and driving experience by category

    | Category | Minimum age | Licence held | Young-driver surcharge |
    |---|---|---|---|
    | [Economy](/car-rental/economy/) | 21 | 2 years | none |
    | [Crossover / SUV](/car-rental/suv/) | 23 | 3 years | 15 ₾/day, ages 23-25 |
    | [Business class](/car-rental/business/) | 25 | 5 years | 25 ₾/day, ages 25-27 |
    | [Off-road 4x4](/car-rental/4x4/) | 25 | 4 years | 25 ₾/day, ages 25-27 |
    | [Minivan](/car-rental/minivan/) | 23 | 3 years | 15 ₾/day, ages 23-25 |
    | [Commercial van](/car-rental/van/) | 25 | 3 years | none |

    There is no upper age limit. **Additional drivers cost 20 ₾ per day, up to two.** Each must meet
    the same age and experience requirements and sign the agreement, because damage caused by a
    driver who is not named in the agreement is not covered.

    ## Deposit and its release

    | Category | Deposit | CDW excess |
    |---|---|---|
    | Economy | 300 ₾ | 300 ₾ |
    | Crossover / SUV | 600 ₾ | 600 ₾ |
    | Commercial van | 800 ₾ | 800 ₾ |
    | Business class | 1,000 ₾ | 1,000 ₾ |
    | Minivan | 1,000 ₾ | 1,000 ₾ |
    | Off-road 4x4 | 1,200 ₾ | 1,200 ₾ |

    On a card the deposit is **blocked, not charged**, and released within **3 business days** of
    the return, provided there is no damage or fine. Paying in cash, the deposit is taken in cash
    and returned on the spot. There is no deposit-free option on any category.

    ## What the insurance covers, and the excess

    The rate includes **CDW** (damage to the car above the excess) and **TPL** (third-party
    liability). The excess is the figure in the table above, and it applies whenever the car is
    damaged. **SCDW**, at 25-45 ₾ per day depending on category, lowers the excess; on the off-road
    4x4 an excess of 300 ₾ remains even with SCDW.

    Not covered, whatever you add: driving under the influence of alcohol or drugs; a driver not
    named in the agreement; damage on gravel or unpaved roads unless the car is in the 4x4 category;
    tyres, wheels, the underbody, mirrors and the interior (a replacement tyre is 120-400 ₾); lost
    keys (400-1,200 ₾ by model); misfuelling; and any commercial use - taxi, courier, haulage -
    without prior written consent. The Tusheti road over the
    [Abano Pass](/attractions/abano-pass/) needs prior written agreement and carries an additional
    excess of 500 ₾; the gravel stretch to [Ushguli](/attractions/ushguli/) is permitted in the 4x4
    category alone.

    ## Fuel, mileage and fines

    - **Full to full.** If the tank comes back short you pay the fuel plus a 20 ₾ service fee.
      Hybrids run on petrol alone and are never plugged in.
    - **Mileage is unlimited inside Georgia.** Cross-border trips carry a 300 km/day limit at 0.5 ₾
      per extra kilometre.
    - **Traffic fines are yours** and can arrive up to 30 days after the rental: the fine plus 20 ₾
      processing.
    - **At handover we photograph all four sides, the interior, the odometer and the fuel level**,
      and repeat it on return. Keep your own copies.

    ## Cross-border, as the terms write it

    | Country | Status | Fee | Daily limit |
    |---|---|---|---|
    | Armenia | Permitted | 150 ₾ | 300 km |
    | Turkey | Permitted, selected categories | 250 ₾ | 300 km |
    | Azerbaijan | Prohibited | - | - |
    | Russia | Prohibited | - | - |

    Ask **at least 48 hours ahead**, because an international insurance policy and a power of
    attorney have to be prepared. Crossing without permission is a breach of the agreement and
    forfeits the entire deposit.

    ## Booking, cancellation, extension, help on the road

    - **No prepayment.** Confirmation by phone or email; pay at pickup in lari, or in cash in US
      dollars or euros at the National Bank rate. Visa, Mastercard and American Express are
      accepted.
    - **Cancellation**: free more than 48 hours ahead; one day's rate at 24-48 hours; two days'
      rate under 24 hours or for a no-show. Changing the dates is free if the car is available.
      An early return refunds the unused days at the rate for the actual length.
    - **Extension**: the terms publish no separate extension tariff, so phone us before the return
      time and the extra days are agreed as rental days. An unagreed late return is free up to
      2 hours, then one third of the daily rate for every 3 hours, and over 8 hours counts as a
      full day.
    - **24/7 roadside assistance.** After an accident call 112, then our hotline, and stay at the
      scene until the report is drawn up. If a technical fault not caused by you stops the car, a
      replacement arrives within 6 hours at no charge.
    - **Child seats** are 10 ₾ per day, and Georgian law requires one for children under 12.

    Everything above is taken from [the rental terms](/terms/) and the [FAQ](/faq/), which are the
    pages that change when the policy does. If this guide and those pages ever disagree, the terms
    page wins, and the signed agreement wins over both. Choose the category at
    [car rental](/car-rental/); if you are staying a month or longer, the
    [monthly rental](/car-rental/monthly/) page shows how the rate falls with length, and if your
    plan includes mountain roads, read [do I need a 4x4](/guides/do-i-need-a-4x4-in-georgia/)
    before you pick.
  faq:
  - q: "What documents do I need to rent a car in Georgia as a foreigner?"
    a: "A passport, a national driving licence held for at least 2 years, and a card or cash for the deposit. Add an International Driving Permit only if the licence is not printed in the Latin alphabet. Nothing is paid in advance."
  - q: "Do I need an International Driving Permit in Georgia?"
    a: "Only if your national licence is not in the Latin alphabet. Licences from the EU, the USA, the United Kingdom, Israel and the CIS countries are valid as they are; an Arabic, Persian, Hebrew, Chinese or Japanese licence needs an IDP alongside it."
  - q: "What is the minimum age to rent a car?"
    a: "21 with 2 years' licence for economy; 23 with 3 years for crossovers and minivans; 25 for business class (5 years), off-road 4x4 (4 years) and commercial vans (3 years). Drivers aged 23-25 pay 15 ₾ per day extra on crossovers and minivans, and 25-27 pay 25 ₾ per day on business class and 4x4. There is no upper age limit."
  - q: "How much is the deposit and when do I get it back?"
    a: "300 ₾ economy, 600 ₾ crossover, 800 ₾ commercial van, 1,000 ₾ business class and minivan, 1,200 ₾ off-road 4x4. On a card it is blocked rather than charged and released within 3 business days of the return; in cash it is returned on the spot."
  - q: "What do CDW and TPL cover, and what is the excess?"
    a: "TPL covers third-party liability; CDW covers damage to the car above the excess, which equals the deposit for your category, from 300 ₾ economy to 1,200 ₾ off-road 4x4. Tyres, wheels, the underbody and the interior are never covered. SCDW at 25-45 ₾ per day lowers the excess; on the 4x4 a 300 ₾ excess remains."
  - q: "Can I add a second driver?"
    a: "Yes, for 20 ₾ per day, up to two additional drivers. Each must meet the same age and experience requirements and sign the agreement; a driver who is not named in it is not covered."
  - q: "Can I take the car to Armenia or Turkey?"
    a: "Armenia is permitted for 150 ₾ and Turkey for 250 ₾ on selected categories, both with a 300 km daily limit and arranged at least 48 hours ahead. Azerbaijan and Russia are prohibited, and crossing without permission forfeits the whole deposit."
  - q: "Do I have to pay in advance to book?"
    a: "No. A booking is confirmed by phone or email and you pay at pickup. Cancellation is free more than 48 hours ahead, one day's rate at 24-48 hours, and two days' rate under 24 hours or for a no-show."

