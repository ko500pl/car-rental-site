  short: "რა გჭირდებათ აქ მანქანის დასაქირავებლად და სამართავად — ასაკი და სტაჟი კატეგორიების მიხედვით, IDP-ის წესები, დეპოზიტი და მისი დაბრუნება, რას ფარავს CDW და TPL და რამდენია ფრანშიზა, დამატებითი მძღოლი, საზღვრის კვეთა — პირდაპირ გაქირავების პირობებიდან."
  meta_title: "მანქანის ქირაობის მოთხოვნები და საბუთები | RentUp"
