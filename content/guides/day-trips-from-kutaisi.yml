    | [קניון אוקאצה](/attractions/okatse-canyon/) | 0:30 | 3 שע' | סלול ברובו | אקונומי | מאי עד אוקטובר |
    | [קניון מרטווילי](/attractions/martvili-canyon/) | 0:32 | 2 שע' | סלול | אקונומי | כל השנה |
    | [מפל קינצחה](/attractions/kinchkha-waterfall/) | 0:35 | 2 שע' | עפר | רכב שטח עירוני | מאי עד אוקטובר |
    | [גוש חוואמלי](/attractions/mount-khvamli/) | 0:37 | 3 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [עמוד קצחי](/attractions/katskhi-pillar/) | 0:52 | 1 שע' | סלול | אקונומי | כל השנה |
    | [נוקאלקווי](/attractions/nokalakevi/) | 0:52 | 2 שע' | סלול | אקונומי | כל השנה |
    | [קתדרלת ניקורצמינדה](/attractions/nikortsminda-cathedral/) | 1:01 | 1 שע' | סלול | אקונומי | כל השנה |
    | [הרכבלים של צ'יאטורה](/attractions/chiatura-cable-cars/) | 1:04 | 3 שע' | סלול | אקונומי | כל השנה |
    | [מאגר שאורי](/attractions/shaori-reservoir/) | 1:16 | 3 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
