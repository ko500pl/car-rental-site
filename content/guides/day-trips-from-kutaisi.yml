  name: "טיולי יום מקוטאיסי ברכב: 127 מקומות בטווח שלוש שעות"
  short: "את זמן הנסיעה מקוטאיסי ל-263 המקומות שמחוץ לעיר אנחנו מעריכים לפי מהירות הדרך הנמדדת של כל מקום. 64 בטווח של כ-1:30, 127 בטווח 3:00, ו-92 מתוך ה-127 צריכים רק רכב אקונומי."
  meta_title: "טיולי יום מקוטאיסי ברכב: 127 מקומות | RentUp"
  meta_description: "64 מקומות בטווח של כ-1:30 מקוטאיסי, 127 בטווח 3:00, 171 בטווח 5:00. זמן נסיעה מוערך לפי מהירות הדרך הנמדדת של כל מקום, סוג הדרך, שעות במקום והרכב הנדרש."
  body: |
    ## עד כמה רחוק מגיע יום אחד מקוטאיסי

    קוטאיסי היא המרכז הגאוגרפי של כל מה שממערב לרכס ליחי, והמספרים מראים זאת. ב-1 בספטמבר 2026
    מיינו את כל 267 המקומות במאגר לפי זמן נסיעה מוערך מהעיר. ארבעה נמצאים בקוטאיסי עצמה, ונשארים
    **263 מקומות מחוץ לעיר**.

    | זמן לכיוון אחד (הערכה) | מקומות | אקונומי | רכב שטח עירוני | 4x4 שטח | סלול או סלול ברובו |
    |---|---|---|---|---|---|
    | עד כ-1:30 | 64 | 49 | 15 | 0 | 60 מתוך 64 |
    | 1:30 עד 3:00 | 63 | 43 | 15 | 5 | 55 מתוך 63 |
    | 3:00 עד 5:00 | 44 | 16 | 20 | 8 | 32 מתוך 44 |
    | **בטווח 3:00** | **127** | **92** | **30** | **5** | **115 מתוך 127** |
    | בטווח 5:00 | 171 | 108 | 50 | 13 | 147 מתוך 171 |

    **127 מקומות בטווח שלוש שעות, 92 מהם מסווגים ל[רכב אקונומי](/car-rental/economy/).** זה יותר
    ממה שטביליסי מציעה באותו רדיוס, והתמהיל שונה: בטווח 1:30 מקוטאיסי יש 15 מנזרים, 9 מוזיאונים,
    8 עיירות, 6 מבצרים, 4 עיירות מרפא, 3 מערות, 3 קניונים ו-3 מפלים. מתוך 64, 57 פתוחים כל השנה.

    **איך נבנים הזמנים - קראו קודם.** הרשומות שלנו נושאות מרחק וזמן נמדדים מטביליסי בלבד. לכל מקום
    אנחנו מחלקים את השניים: מרחק הדרך חלקי המרחק בקו אוויר אומר כמה הדרך אליו מתפתלת, ומרחק הדרך
    חלקי הזמן אומר איזו מהירות ממוצעת הדרך מאפשרת. את שני המספרים אנחנו מחילים על הקו הישר
    מקוטאיסי. זו הערכה ממהירות הדרך הנמדדת של כל מקום, **לא ניווט**. במקום שרכס מפריד בין קוטאיסי
    למקום, הדרך האמיתית עוקפת אותו וההערכה קצרה מדי - את שורות סמצחה למטה (בורג'ומי, רבאטי) קראו
    כאופטימיות. ל[טביליסי](/guides/day-trips-from-tbilisi/) אנחנו משתמשים בשדות הנמדדים המדויקים.

