    ## რგოლი ოც წუთში

    ჩვენს ბაზაში არცერთ სხვა ქალაქს ამდენი შეფასებული ადგილი ასე ახლოს არ აქვს.
    [მოწამეთა](/attractions/motsameta-monastery/) შეფასებით 0:04-ია, [გელათი](/attractions/gelati-monastery/)
    — UNESCO-ს ძეგლი, უფასო, რეიტინგი 5.0 — 0:07, და [სათაფლია](/attractions/sataplia-nature-reserve/)
    დინოზავრების ნაკვალევით იგივე. [გეგუთის სასახლე](/attractions/geguti-palace/) 0:09-ია, კურორტი
    [წყალტუბო](/attractions/tskaltubo-spa-town/) — 0:11, [ცუცხვათისა](/attractions/tsutskhvati-caves/)
    და [ნავენახევის](/attractions/navenakhevi-cave/) მღვიმეები — 0:14, [პრომეთეს მღვიმე](/attractions/prometheus-cave/)
    — 0:17, [აჯამეთის ნაკრძალი](/attractions/ajameti-managed-reserve/) — 0:19. ყველაფერი ეკონომია,
    ცუცხვათის გარდა — ის ძირითადად მოასფალტებულია, კროსოვერით შეფასებული და მაისიდან ოქტომბრამდე
    ადგილია. [ქუთაისის მონასტრებისა და მღვიმეების დღე](/routes/kutaisi-monasteries-caves-day/) 85 კმ-ია,
    ეკონომი.

    ## კანიონები და ჩანჩქერები, 30-დან 50 წუთამდე

    1:30-ის ფარგლებში სამი კანიონი და სამი ჩანჩქერია. [ოკაცე](/attractions/okatse-canyon/) 0:30-ზე და
    [მარტვილი](/attractions/martvili-canyon/) 0:32-ზე ცნობილი წყვილია და ორივე ეკონომია. შემდეგ სამზე
    კატეგორია იცვლება: [კინჩხის ჩანჩქერი](/attractions/kinchkha-waterfall/) 0:35-ზე,
    [ონიორეს ჩანჩქერი](/attractions/oniore-waterfall/) 0:45-ზე და [ბალდის კანიონი](/attractions/balda-canyon/)
    0:46-ზე სამივე გრუნტია, კროსოვერით შეფასებული, მაისიდან ოქტომბრამდე და არა მთელი წელი ღია.
    [მარტვილისა და ნოქალაქევის დღე](/routes/martvili-nokalakevi-day/) 165 კმ-ია და ეკონომი; სამდღიანი
    [იმერეთის მღვიმეები და კანიონები](/routes/imereti-caves-canyons/) კროსოვერითაა შეფასებული, რადგან
    გრუნტიანებსაც მოიცავს.

    ## რაჭა: ერთი საათი ზემოთ

    [რაჭა-ლეჩხუმი](/regions/racha-lechkhumi/) ის მხარეა, სადაც თბილისიდან სტუმარი იშვიათად აღწევს,
    ქუთაისიდან კი სადილამდე მიდიხართ. [ხვამლის მასივი](/attractions/mount-khvamli/) 0:37-ია
    (კროსოვერი), [ნიკორწმინდის ტაძარი](/attractions/nikortsminda-cathedral/) — 1:01 ასფალტზე,
    [ცაგერი](/attractions/tsageri/) — 1:04 (კროსოვერი), [მურის ციხე](/attractions/muri-fortress/) — 1:06,
    [შაორის წყალსაცავი](/attractions/shaori-reservoir/) — 1:16 (კროსოვერი, რეიტინგი 5.0),
    [ხვანჭკარის ზონა](/attractions/khvanchkara-wine-zone/) — 1:18, [ამბროლაური](/attractions/ambrolauri/)
    — 1:31 და [ბარაკონი](/attractions/barakoni-church/) — 1:43. რაჭის მაღალი ნაწილი — [შოვი](/attractions/shovi-resort/)
    4:25, [უძიროს ტბა](/attractions/udziro-lake-buba-glacier/) 4:55 — ერთდღიანი აღარ არის და მხოლოდ
    ივნისიდან სექტემბრამდეა. [რაჭის საოჯახო უიკენდი](/routes/racha-family-weekend/) ორი დღეა, კროსოვერი.

    ## სამეგრელო და სანაპირო

    დასავლეთით შეფასებები ზღვამდე ორ საათს არ სცილდება. [ნოქალაქევი](/attractions/nokalakevi/) 0:52-ია,
    [სალხინოს რეზიდენცია](/attractions/salkhino-palace/) — 0:50, [დადიანების სასახლე ზუგდიდში](/attractions/dadiani-palace-zugdidi/)
    — 1:19, [კოლხეთის ეროვნული პარკი](/attractions/kolkheti-national-park/) — UNESCO-ს ძეგლი, რეიტინგი 5.0
    — 1:35, [ენგურის კაშხალი](/attractions/enguri-dam/) — 1:34 და [ანაკლია](/attractions/anaklia/) — 1:50.
    გურიის პლაჟები უფრო ახლოსაა, ვიდრე ბევრს ჰგონია: [გრიგოლეთი](/attractions/grigoleti/) 1:26,
    [ურეკი](/attractions/ureki/) 1:31, [შეკვეთილი](/attractions/shekvetili-dendrological-park/) 1:32. ამ
    აბზაცში ყველა ადგილი ასფალტი და ეკონომია; პლაჟები ივნისიდან სექტემბრამდეა.
    [გურიის სანაპიროს დღე](/routes/guria-coast-day/) 135 კმ-ია, ეკონომი.

    ## გურიის მთები: სადაც ჯიპის შეფასებები იწყება

    სამ საათში მოქცეული 127 ადგილიდან ხუთი ჯიპითაა შეფასებული და მათგან ორი აქაა.
    [ბახმარო](/attractions/bakhmaro/) 1950 მეტრზე შეფასებით 1:46-ია — გრუნტი, ჯიპი, ივნისიდან
    სექტემბრამდე, რეიტინგი 5.0. [გომისმთა](/attractions/gomismta/) 2100 მეტრზე 1:44-ია, გრუნტი,
    კროსოვერი. სამ საათში დანარჩენი სამი ჯიპის ადგილია [ტობავარჩხილის ტბები](/attractions/tobavarchkhili-lakes/)
    1:50, [გოდერძის უღელტეხილი](/attractions/goderdzi-pass/) 2:25 და [ბეშუმი](/attractions/beshumi/) 2:26.
    [გურიის მთისა და კურორტის უიკენდი](/routes/guria-mountain-spa-weekend/) ერთადერთი მარშრუტია, რომელსაც
    დასავლეთ საქართველოში ჯიპით ვაფასებთ.

    ## აღმოსავლეთით და სამხრეთით: ოპტიმისტური სტრიქონები

    [უბისა](/attractions/ubisa-monastery/) 0:51, [ქაცხის სვეტი](/attractions/katskhi-pillar/) 0:52,
    [საირმე](/attractions/sairme-resort/) 0:56 და [ჭიათურა](/attractions/chiatura-cable-cars/) 1:04
    მაგისტრალზე ან მის გვერდითაა და შეფასება სამართლიანი ორიენტირია. [ბორჯომი](/attractions/borjomi-central-park/)
    1:26-ზე, [რაბათის ციხე](/attractions/rabati-castle/) 1:35-ზე და [ბაკურიანი](/attractions/bakuriani/)
    2:20-ზე ის სტრიქონებია, რომელიც ზემოთ მოცემული დათქმით უნდა წაიკითხოთ: იმერეთსა და
    [სამცხე-ჯავახეთს](/regions/samtskhe-javakheti/) შორის ქედია და გზა ხაზზე გრძელია.
    [გორი](/attractions/gori-fortress-stalin-museum/) 2:07-ზე და [უფლისციხე](/attractions/uplistsikhe/)
    3:07-ზე ისევ მაგისტრალზეა.

    ## სვანეთი და სამიდან ხუთ საათამდე ზოლი

    44 ადგილი 3:00-სა და 5:00-ს შორისაა და ეს ერთადერთი ზოლია, სადაც ეკონომი უმცირესობაშია: 16
    ეკონომი, 20 კროსოვერი, 8 ჯიპი. [მესტია](/attractions/mestia/) 3:14-ია მოასფალტებულ გზაზე,
    კროსოვერით შეფასებული; [ჰაწვალი](/attractions/hatsvali-tetnuldi/) — 3:15 (დეკემბერი-მარტი);
    [ჭალაადის მყინვარი](/attractions/chalaadi-glacier/) — 3:39; [კორულდის ტბები](/attractions/koruldi-lakes/)
    — 3:44, მხოლოდ 4x4; [უშგული](/attractions/ushguli/) — 4:01, გრუნტი, ჯიპი. 44-დან ცამეტი ივნისიდან
    სექტემბრამდე ადგილია. [სვანეთის ექსპედიცია](/routes/svaneti-expedition/) ქუთაისიდან დაიწყეთ და არა
    ერთ დღეში ჩატევა სცადოთ.

    ## რომელი კატეგორია და საიდან დაიწყოთ

    - **სამ საათში მოქცეული 127 ადგილიდან 92** ეკონომია. [ეკონომ-კლასის მანქანა ქუთაისში](/car-rental/kutaisi/)
      გელათს, პრომეთეს, ოკაცეს, მარტვილს, რაჭის ტაძრებსა და მთელ სანაპიროს ფარავს.
    - **30-ს [კროსოვერი](/car-rental/suv/) სჭირდება**: მათ შორის კინჩხა, ონიორე, ბალდა, ხვამლი, შაორი,
      ცაგერი, გომისმთა და მესტია.
    - **5-ს [ჯიპი 4x4](/car-rental/4x4/) სჭირდება**: ბახმარო, ტობავარჩხილი, გოდერძი, ბეშუმი და მწვანე ტბა.

    127-დან 107 მთელი წელი ღიაა; 78-ს ყველა სეზონის შეფასება აქვს, 34 მაისიდან ოქტომბრამდეა და 14 —
    ივნისიდან სექტემბრამდე. [ერთდღიანი მოგზაურობის დამგეგმავი](/day-trip/) იმავე შეფასებას ნებისმიერი
    საწყისი წერტილიდან პირდაპირ ითვლის; კატეგორიის კითხვას კი პასუხობს
    [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/) ავტომობილის გაქირავება
    ქუთაისში სწორედ ამ 127 ადგილიდან იწყება.
  faq:
  - q: "ქუთაისიდან ეს დროები გაზომილია თუ შეფასებული?"
    a: "შეფასებული. ჩვენს ჩანაწერებში გაზომილი მანძილი და დრო მხოლოდ თბილისიდანაა. თითოეული ადგილისთვის ამ გაზომვებიდან გამოგვყავს, რამდენად კლაკნილია მისი გზა და რა საშუალო სიჩქარეს უშვებს, და ორივეს ქუთაისიდან სწორ ხაზზე ვიყენებთ. ეს ნავიგატორის მარშრუტი არ არის, და სადაც ქუთაისსა და ადგილს შორის ქედია, შეფასება ნაკლულია."
  - q: "რომელია ქუთაისთან ყველაზე ახლო UNESCO-ს ძეგლი?"
    a: "გელათის მონასტერი — ქალაქიდან შეფასებით 0:07, მოასფალტებული გზით, შესვლა უფასო, ჩვენს ბაზაში რეიტინგი 5.0. კოლხეთის ეროვნული პარკი, დასავლეთის მეორე UNESCO-ს ძეგლი, დაახლოებით 1:35-ია."
  - q: "ოკაცესა და მარტვილის კანიონები ერთ დღეში შემიძლია ქუთაისიდან?"
    a: "ოკაცე ქუთაისიდან შეფასებით 0:30-ია, მარტვილი — 0:32, ორივე ეკონომითაა შეფასებული, ადგილზე შესაბამისად სამი და ორი საათი. ოკაცე მაისიდან ოქტომბრამდე ადგილია; მარტვილი მთელი წელი ღიაა."
  - q: "ქუთაისიდან რომელ ერთდღიან მარშრუტებს სჭირდება კროსოვერი ან ჯიპი?"
    a: "სამ საათში 30 ადგილი კროსოვერითაა შეფასებული — მათ შორის კინჩხა, ონიორე, ბალდა, ხვამლი, შაორი, ცაგერი, გომისმთა და მესტია — და ხუთი ჯიპით: ბახმარო, ტობავარჩხილი, გოდერძი, ბეშუმი და მწვანე ტბა. დანარჩენი 92 ეკონომია."
  - q: "მესტია ქუთაისიდან ერთდღიანი მარშრუტია?"
    a: "ჩვენი შეფასება 3:14-ია ერთი მიმართულებით მოასფალტებულ გზაზე, კროსოვერით შეფასებული, სეზონი მაისიდან ოქტომბრამდე — უშგული კი შეფასებით კიდევ 4:01. სვანეთი ქუთაისიდან ღამისთევით დაგეგმეთ და არა ერთ დღეში."
  - q: "რამდენად ახლოსაა შავი ზღვა ქუთაისთან?"
    a: "გრიგოლეთი შეფასებით 1:26-ია, ურეკი — 1:31, ფოთი — 1:32 და კოლხეთის ეროვნული პარკი — 1:35. ოთხივე ასფალტი და ეკონომია; პლაჟებს ივნისიდან სექტემბრამდე სეზონი უწერია."

ru:
  name: "Куда поехать из Кутаиси на один день: 127 мест в пределах трёх часов"
  short: "Время в пути от Кутаиси до всех 263 мест за пределами города мы оцениваем по измеренной скорости дороги каждого места. 64 из них ближе примерно 1:30, 127 - ближе 3:00, и 92 из этих 127 требуют только машину эконом-класса."
  meta_title: "Куда поехать из Кутаиси на один день: 127 мест | RentUp"
  meta_description: "64 места в пределах примерно 1:30 от Кутаиси, 127 в пределах 3:00, 171 в пределах 5:00. Время оценено по измеренной скорости дороги каждого места; категория."
  body: |
    ## Как далеко уезжаешь за день из Кутаиси

    Кутаиси - географический центр всего, что западнее Лихского хребта, и цифры это подтверждают.
    1 сентября 2026 года мы отсортировали все 267 мест нашей базы по оценочному времени в пути от
    города. Четыре находятся в самом Кутаиси, значит остаётся **263 места за пределами города**.

    | В одну сторону (оценка) | Мест | Эконом | Кроссовер | Внедорожник 4x4 | Асфальт или почти асфальт |
    |---|---|---|---|---|---|
    | до примерно 1:30 | 64 | 49 | 15 | 0 | 60 из 64 |
    | от 1:30 до 3:00 | 63 | 43 | 15 | 5 | 55 из 63 |
    | от 3:00 до 5:00 | 44 | 16 | 20 | 8 | 32 из 44 |
    | **в пределах 3:00** | **127** | **92** | **30** | **5** | **115 из 127** |
    | в пределах 5:00 | 171 | 108 | 50 | 13 | 147 из 171 |

    **127 мест в пределах трёх часов, 92 из них отмечены для [машины эконом-класса](/car-rental/economy/).**
    Это больше, чем у Тбилиси в том же радиусе, и состав другой: в пределах 1:30 от Кутаиси 15
    монастырей, 9 музеев, 8 городов, 6 крепостей, 4 курорта, 3 пещеры, 3 каньона и 3 водопада.
    Из 64 мест 57 открыты круглый год, у 45 указан всесезонный доступ.

    **Как получены эти цифры - прочитайте сначала это.** В наших записях измеренные расстояние и
    время есть только от Тбилиси. Для каждого места мы делим одно на другое: дорожное расстояние к
    расстоянию по прямой показывает, насколько петляет дорога к этому месту, а дорожное расстояние
    ко времени - какую среднюю скорость эта дорога допускает. Затем те же два числа применяем к
    прямой от Кутаиси. Это оценка по измеренной скорости дороги каждого места, **а не маршрут из
    навигатора**: она знает, как ведёт себя последний участок до места, но не знает, по какой трассе
    вы поедете. Там, где между Кутаиси и местом лежит хребет, реальная дорога обходит его, и оценка
    занижена: строки по Самцхе ниже (Боржоми, Рабат) читайте как оптимистичные. Для
    [Тбилиси](/guides/day-trips-from-tbilisi/) мы используем точные измеренные поля.

    ## Двадцать поездок из Кутаиси на день

    Отобраны из 127 по рейтингу и разнообразию. Часы на месте - из записи.

    | Место | В пути (оценка) | На месте | Дорога | Машина | Сезон |
    |---|---|---|---|---|---|
    | [Монастырь Моцамета](/attractions/motsameta-monastery/) | 0:04 | 1 ч | в основном асфальт | эконом | круглый год |
    | [Монастырь Гелати](/attractions/gelati-monastery/) | 0:07 | 2 ч | асфальт | эконом | круглый год |
    | [Заповедник Сатаплиа](/attractions/sataplia-nature-reserve/) | 0:07 | 2 ч | асфальт | эконом | круглый год |
    | [Цхалтубо](/attractions/tskaltubo-spa-town/) | 0:11 | 3 ч | асфальт | эконом | круглый год |
    | [Пещера Прометея](/attractions/prometheus-cave/) | 0:17 | 2 ч | асфальт | эконом | круглый год |
    | [Каньон Окаце](/attractions/okatse-canyon/) | 0:30 | 3 ч | в основном асфальт | эконом | май–октябрь |
    | [Мартвильский каньон](/attractions/martvili-canyon/) | 0:32 | 2 ч | асфальт | эконом | круглый год |
    | [Водопад Кинчха](/attractions/kinchkha-waterfall/) | 0:35 | 2 ч | грунт | кроссовер | май–октябрь |
    | [Массив Хвамли](/attractions/mount-khvamli/) | 0:37 | 3 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Столп Кацхи](/attractions/katskhi-pillar/) | 0:52 | 1 ч | асфальт | эконом | круглый год |
    | [Нокалакеви](/attractions/nokalakevi/) | 0:52 | 2 ч | асфальт | эконом | круглый год |
    | [Собор Никорцминда](/attractions/nikortsminda-cathedral/) | 1:01 | 1 ч | асфальт | эконом | круглый год |
    | [Канатные дороги Чиатуры](/attractions/chiatura-cable-cars/) | 1:04 | 3 ч | асфальт | эконом | круглый год |
    | [Шаорское водохранилище](/attractions/shaori-reservoir/) | 1:16 | 3 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Винная зона Хванчкары](/attractions/khvanchkara-wine-zone/) | 1:18 | 3 ч | асфальт | эконом | май–октябрь |
    | [Уреки](/attractions/ureki/) | 1:31 | 4 ч | асфальт | эконом | июнь–сентябрь |
    | [Колхетский национальный парк](/attractions/kolkheti-national-park/) | 1:35 | 3 ч | асфальт | эконом | круглый год |
    | [Бахмаро](/attractions/bakhmaro/) | 1:46 | 6 ч | грунт | внедорожник 4x4 | июнь–сентябрь |
    | [Местиа](/attractions/mestia/) | 3:14 | 4 ч | асфальт | кроссовер | май–октябрь |
    | [Ушгули](/attractions/ushguli/) | 4:01 | 4 ч | грунт | внедорожник 4x4 | июнь–сентябрь |

    ## Кольцо в двадцати минутах

    Ни у одного другого города в нашей базе нет столько описанных мест так близко.
    [Моцамета](/attractions/motsameta-monastery/) - оценочно 0:04, [Гелати](/attractions/gelati-monastery/)
    - объект ЮНЕСКО, бесплатный вход, рейтинг 5.0 - 0:07, и [Сатаплиа](/attractions/sataplia-nature-reserve/)
    со следами динозавров столько же. [Дворец Гегути](/attractions/geguti-palace/) - 0:09, курорт
    [Цхалтубо](/attractions/tskaltubo-spa-town/) - 0:11, пещеры [Цуцхвати](/attractions/tsutskhvati-caves/)
    и [Навенахеви](/attractions/navenakhevi-cave/) - 0:14, [пещера Прометея](/attractions/prometheus-cave/)
    - 0:17, [заповедник Аджамети](/attractions/ajameti-managed-reserve/) - 0:19. Всё это эконом,
    кроме Цуцхвати: там в основном асфальт, категория кроссовер и сезон с мая по октябрь.
    [День монастырей и пещер Кутаиси](/routes/kutaisi-monasteries-caves-day/) - 85 км, эконом.

    ## Каньоны и водопады, от 30 до 50 минут

    В пределах 1:30 - три каньона и три водопада. [Окаце](/attractions/okatse-canyon/) в 0:30 и
    [Мартвили](/attractions/martvili-canyon/) в 0:32 - знаменитая пара, оба эконом. Следующие три -
    там, где меняется категория: [водопад Кинчха](/attractions/kinchkha-waterfall/) в 0:35,
    [водопад Ониоре](/attractions/oniore-waterfall/) в 0:45 и [каньон Балда](/attractions/balda-canyon/)
    в 0:46 - все на грунте, категория кроссовер, с мая по октябрь и не круглый год.
    [День в Мартвили и Нокалакеви](/routes/martvili-nokalakevi-day/) - 165 км, эконом; трёхдневный
    [маршрут по пещерам и каньонам Имеретии](/routes/imereti-caves-canyons/) отмечен кроссовером,
    потому что включает грунтовые.

    ## Рача: час вверх по дороге

    [Рача-Лечхуми](/regions/racha-lechkhumi/) - регион, до которого гости Тбилиси редко добираются,
    а гости Кутаиси успевают до обеда. [Массив Хвамли](/attractions/mount-khvamli/) - 0:37
    (кроссовер), [собор Никорцминда](/attractions/nikortsminda-cathedral/) - 1:01 по асфальту,
    [Цагери](/attractions/tsageri/) - 1:04 (кроссовер), [крепость Мури](/attractions/muri-fortress/) -
    1:06, [Шаорское водохранилище](/attractions/shaori-reservoir/) - 1:16 (кроссовер, рейтинг 5.0),
    [зона Хванчкары](/attractions/khvanchkara-wine-zone/) - 1:18, [Амбролаури](/attractions/ambrolauri/)
    - 1:31, [Бараконе](/attractions/barakoni-church/) - 1:43. Верхняя Рача - [Шови](/attractions/shovi-resort/)
    4:25, [озеро Удзиро](/attractions/udziro-lake-buba-glacier/) 4:55 - это уже не день, и только с
    июня по сентябрь. [Семейные выходные в Раче](/routes/racha-family-weekend/) - два дня, кроссовер.

    ## Самегрело и побережье

    На запад оценки не выходят за два часа до самого моря. [Нокалакеви](/attractions/nokalakevi/) -
    0:52, [резиденция в Салхино](/attractions/salkhino-palace/) - 0:50, [дворец Дадиани в Зугдиди](/attractions/dadiani-palace-zugdidi/)
    - 1:19, [Колхетский национальный парк](/attractions/kolkheti-national-park/) - объект ЮНЕСКО,
    рейтинг 5.0 - 1:35, [Ингурская ГЭС](/attractions/enguri-dam/) - 1:34, [Анаклия](/attractions/anaklia/)
    - 1:50. Пляжи Гурии ближе, чем принято думать: [Григолети](/attractions/grigoleti/) 1:26,
    [Уреки](/attractions/ureki/) 1:31, [Шекветили](/attractions/shekvetili-dendrological-park/) 1:32.
    Каждое место в этом абзаце - асфальт и эконом; пляжи - с июня по сентябрь.
    [День на побережье Гурии](/routes/guria-coast-day/) - 135 км, эконом.

    ## Горы Гурии: где начинаются внедорожные категории

    Из 127 мест в пределах трёх часов пять отмечены как внедорожные, и два из них здесь.
    [Бахмаро](/attractions/bakhmaro/) на 1950 м - оценочно 1:46: грунт, внедорожник, с июня по
    сентябрь, рейтинг 5.0. [Гомисмта](/attractions/gomismta/) на 2100 м - 1:44, грунт, кроссовер.
    Остальные три внедорожных места в пределах трёх часов - [озёра Тобаварчхили](/attractions/tobavarchkhili-lakes/)
    1:50, [перевал Годердзи](/attractions/goderdzi-pass/) 2:25 и [Бешуми](/attractions/beshumi/) 2:26.
    [Горно-курортные выходные в Гурии](/routes/guria-mountain-spa-weekend/) - единственный маршрут,
    который мы отмечаем внедорожником в Западной Грузии.

    ## На восток и юг: оптимистичные строки

    [Убиси](/attractions/ubisa-monastery/) 0:51, [столп Кацхи](/attractions/katskhi-pillar/) 0:52,
    [Саирме](/attractions/sairme-resort/) 0:56 и [Чиатура](/attractions/chiatura-cable-cars/) 1:04
    стоят на трассе или рядом, и оценка - честный ориентир. [Боржоми](/attractions/borjomi-central-park/)
    в 1:26, [крепость Рабат](/attractions/rabati-castle/) в 1:35 и [Бакуриани](/attractions/bakuriani/)
    в 2:20 - строки, которые надо читать с оговоркой выше: между Имеретией и
    [Самцхе-Джавахети](/regions/samtskhe-javakheti/) лежит хребет, и дорога длиннее прямой.
    [Гори](/attractions/gori-fortress-stalin-museum/) в 2:07 и [Уплисцихе](/attractions/uplistsikhe/)
    в 3:07 снова на трассе.

    ## Сванетия и полоса от трёх до пяти часов

    44 места лежат между 3:00 и 5:00, и это единственная полоса, где эконом в меньшинстве: 16
    эконом, 20 кроссовер, 8 внедорожник. [Местиа](/attractions/mestia/) - 3:14 по асфальту, категория
    кроссовер; [Хацвали](/attractions/hatsvali-tetnuldi/) - 3:15 (с декабря по март);
    [ледник Чалаади](/attractions/chalaadi-glacier/) - 3:39; [озёра Корульди](/attractions/koruldi-lakes/)
    - 3:44, только 4x4; [Ушгули](/attractions/ushguli/) - 4:01, грунт, внедорожник. Тринадцать из 44
    - места с июня по сентябрь. Начинайте [Сванетскую экспедицию](/routes/svaneti-expedition/) из
    Кутаиси, а не пытайтесь уложить её в день.

    ## Какую машину брать и с чего начать

    - **92 из 127 мест в пределах трёх часов** - эконом. [Машина эконом-класса в Кутаиси](/car-rental/kutaisi/)
      закрывает Гелати, Прометея, Окаце, Мартвили, соборы Рачи и всё побережье.
    - **30 требуют [кроссовер](/car-rental/suv/)**: среди них Кинчха, Ониоре, Балда, Хвамли, Шаори,
      Цагери, Гомисмта и Местиа.
    - **5 требуют [внедорожник 4x4](/car-rental/4x4/)**: Бахмаро, Тобаварчхили, Годердзи, Бешуми и
      Зелёное озеро.

    107 из 127 открыты круглый год; у 78 всесезонный доступ, 34 - с мая по октябрь, 14 - с июня по
    сентябрь. [Планировщик поездки на день](/day-trip/) считает ту же оценку для любой точки старта;
    на вопрос о категории отвечает страница
    [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "Это время от Кутаиси измерено или оценено?"
    a: "Оценено. В наших записях измеренные расстояние и время есть только от Тбилиси. Для каждого места из этих измерений мы выводим, насколько петляет его дорога и какую среднюю скорость она допускает, и применяем оба числа к прямой от Кутаиси. Это не маршрут навигатора, и там, где между Кутаиси и местом лежит хребет, оценка занижена."
  - q: "Какой объект ЮНЕСКО ближе всего к Кутаиси?"
    a: "Монастырь Гелати - оценочно 0:07 от города по асфальту, вход бесплатный, рейтинг 5.0 в нашей базе. Колхетский национальный парк, второй объект ЮНЕСКО на западе, - примерно 1:35."
  - q: "Можно ли за день из Кутаиси увидеть каньоны Окаце и Мартвили?"
    a: "Окаце - оценочно 0:30 от Кутаиси, Мартвили - 0:32, оба категории эконом, на месте три и два часа соответственно. Окаце - место с мая по октябрь; Мартвили открыт круглый год."
  - q: "Какие поездки из Кутаиси требуют кроссовера или внедорожника?"
    a: "В пределах трёх часов 30 мест отмечены кроссовером - среди них Кинчха, Ониоре, Балда, Хвамли, Шаори, Цагери, Гомисмта и Местиа - и пять внедорожником: Бахмаро, Тобаварчхили, Годердзи, Бешуми и Зелёное озеро. Остальные 92 - эконом."
  - q: "Местиа - это однодневная поездка из Кутаиси?"
    a: "Наша оценка - 3:14 в одну сторону по асфальту, категория кроссовер, сезон с мая по октябрь, а до Ушгули ещё оценочно 4:01. Планируйте Сванетию из Кутаиси с ночёвкой, а не за день."
  - q: "Насколько близко к Кутаиси Чёрное море?"
    a: "Григолети - оценочно 1:26, Уреки - 1:31, Поти - 1:32, Колхетский национальный парк - 1:35. Все четыре - асфальт и эконом; у пляжей сезон с июня по сентябрь."

