    ## حلقهٔ بیست‌دقیقه‌ای

    [موتسامتا](/attractions/motsameta-monastery/) در تخمین 0:04 است، [گلاتی](/attractions/gelati-monastery/)،
    اثر یونسکو، رایگان و با امتیاز 5.0، در 0:07، و [ساتاپلیا](/attractions/sataplia-nature-reserve/) با
    ردپای دایناسورها همان‌قدر. [تسکالتوبو](/attractions/tskaltubo-spa-town/) 0:11، غارهای [تسوتسخواتی](/attractions/tsutskhvati-caves/) و [ناوناخوی](/attractions/navenakhevi-cave/)
    0:14، [غار پرومتئوس](/attractions/prometheus-cave/) 0:17. همه اقتصادی است جز تسوتسخواتی که
    ردهٔ شاسی‌بلند و فصل مه تا اکتبر دارد. [روز صومعه‌ها و غارهای کوتایسی](/routes/kutaisi-monasteries-caves-day/)
    85 کیلومتر و اقتصادی است.

    ## کانیون‌ها و آبشارها، 30 تا 50 دقیقه

    [اوکاتسه](/attractions/okatse-canyon/) در 0:30 و [مارتویلی](/attractions/martvili-canyon/) در 0:32
    زوج مشهورند و هر دو اقتصادی. سه مورد بعدی جایی است که رده عوض می‌شود:
    [آبشار کینچخا](/attractions/kinchkha-waterfall/) در 0:35، [آبشار اونیوره](/attractions/oniore-waterfall/)
    در 0:45 و [درهٔ بالدا](/attractions/balda-canyon/) در 0:46 همه خاکی، ردهٔ شاسی‌بلند و مه تا
    اکتبرند. [روز مارتویلی و نوکالاکوی](/routes/martvili-nokalakevi-day/) 165 کیلومتر و اقتصادی است.

    ## راچا: یک ساعت بالاتر

    [راچا-لچخومی](/regions/racha-lechkhumi/) منطقه‌ای است که از تفلیس کمتر کسی به آن می‌رسد و از
    کوتایسی پیش از ناهار می‌رسید. [تودهٔ خواملی](/attractions/mount-khvamli/) 0:37 (شاسی‌بلند)،
    [نیکورتسمیندا](/attractions/nikortsminda-cathedral/) 1:01 روی آسفالت، [تساگری](/attractions/tsageri/)
    1:04 (شاسی‌بلند)، [آبگیر شااوری](/attractions/shaori-reservoir/) 1:16 (شاسی‌بلند، امتیاز 5.0)،
    [منطقهٔ خوانچکارا](/attractions/khvanchkara-wine-zone/) 1:18 و [آمبرولائوری](/attractions/ambrolauri/)
    1:31. [آخر هفتهٔ خانوادگی راچا](/routes/racha-family-weekend/) دو روزه و شاسی‌بلند است.

    ## سامگرلو و ساحل

    به سمت غرب تخمین‌ها تا خود دریا زیر دو ساعت می‌ماند. [نوکالاکوی](/attractions/nokalakevi/) 0:52،
    [کاخ دادیانی در زوگدیدی](/attractions/dadiani-palace-zugdidi/) 1:19، [پارک ملی کولخِتی](/attractions/kolkheti-national-park/)،
    اثر یونسکو با امتیاز 5.0، 1:35، [آناکلیا](/attractions/anaklia/) 1:50. [اورکی](/attractions/ureki/) 1:31. همهٔ این‌ها آسفالت و اقتصادی‌اند؛ سواحل ژوئن تا سپتامبر. [روز ساحل گوریا](/routes/guria-coast-day/)
    135 کیلومتر و اقتصادی است.

    ## کوه‌های گوریا: جایی که ردهٔ آفرود آغاز می‌شود

    از 127 مکان زیر سه ساعت پنج مورد آفرود است و دو مورد اینجاست. [باخمارو](/attractions/bakhmaro/) در
    1,950 متر با تخمین 1:46: خاکی، آفرود، ژوئن تا سپتامبر، امتیاز 5.0. [گومیسمتا](/attractions/gomismta/)
    در 2,100 متر 1:44، خاکی، شاسی‌بلند.

    ## سوانتی و نوار سه تا پنج ساعت

    44 مکان بین 3:00 و 5:00 است و این تنها نواری است که اقتصادی در اقلیت است: 16 اقتصادی، 20
    شاسی‌بلند، 8 آفرود. [مستیا](/attractions/mestia/) 3:14 روی آسفالت با ردهٔ شاسی‌بلند؛
    [دریاچه‌های کورولدی](/attractions/koruldi-lakes/) 3:44، فقط 4x4؛ [اوشگولی](/attractions/ushguli/) 4:01، خاکی، آفرود. [سفر اکتشافی سوانتی](/routes/svaneti-expedition/)
    را از کوتایسی آغاز کنید، نه در یک روز.

    ## کدام خودرو

    - **92 مورد از 127 مکان زیر سه ساعت** اقتصادی است: [خودروی اقتصادی در کوتایسی](/car-rental/kutaisi/) کافی است.
    - **30 مورد [شاسی‌بلند](/car-rental/suv/) می‌خواهد**: کینچخا، اونیوره، بالدا، خواملی، شااوری، تساگری، گومیسمتا و مستیا.
    - **5 مورد [آفرود 4x4](/car-rental/4x4/) می‌خواهد**: باخمارو، توباوارچخیلی، گودردزی، بشومی و دریاچهٔ سبز.

    از این 127 مکان 107 مورد در تمام سال باز است. [یابندهٔ سفر یک‌روزه](/day-trip/) همین تخمین را
    برای هر نقطهٔ شروع زنده حساب می‌کند؛ پرسش ردهٔ خودرو را
    [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/) پاسخ می‌دهد.
  faq:
  - q: "این زمان‌ها از کوتایسی اندازه‌گیری‌شده‌اند یا تخمینی؟"
    a: "تخمینی. رکوردهای ما فقط فاصله و زمان اندازه‌گیری‌شده از تفلیس را دارند. برای هر مکان از همان اندازه‌گیری‌ها پیچ‌وخم جاده و سرعت متوسط آن را می‌گیریم و روی خط مستقیم از کوتایسی به کار می‌بریم. مسیریابی نیست و هرجا رشته‌کوهی میان کوتایسی و مکان باشد، تخمین کم می‌آید."
  - q: "نزدیک‌ترین اثر یونسکو به کوتایسی کدام است؟"
    a: "صومعهٔ گلاتی، با تخمین 0:07 از شهر روی جادّهٔ آسفالت، رایگان و با امتیاز 5.0 در داده‌های ما. پارک ملی کولخِتی، اثر یونسکوی دیگر در غرب، حدود 1:35 است."
  - q: "می‌توان اوکاتسه و مارتویلی را در یک روز از کوتایسی دید؟"
    a: "اوکاتسه با تخمین 0:30 و مارتویلی 0:32 از کوتایسی است، هر دو اقتصادی، به ترتیب سه و دو ساعت در محل. اوکاتسه مه تا اکتبر است؛ مارتویلی تمام سال باز است."
  - q: "کدام سفرها از کوتایسی شاسی‌بلند یا 4x4 می‌خواهند؟"
    a: "در سه ساعت، 30 مکان شاسی‌بلند است، از جمله کینچخا، اونیوره، بالدا، خواملی، شااوری، تساگری، گومیسمتا و مستیا، و پنج مکان آفرود: باخمارو، توباوارچخیلی، گودردزی، بشومی و دریاچهٔ سبز. 92 مورد دیگر اقتصادی است."
  - q: "آیا مستیا سفر یک‌روزه از کوتایسی است؟"
    a: "تخمین ما 3:14 یک‌طرفه روی آسفالت است، ردهٔ شاسی‌بلند، فصل مه تا اکتبر، و اوشگولی با تخمین 4:01. سوانتی را از کوتایسی با اقامت شبانه برنامه‌ریزی کنید، نه در یک روز."

