  short: "زمان رانندگی از کوتایسی تا 263 مکان بیرون از شهر را از سرعت اندازه‌گیری‌شدهٔ جادّهٔ هر مکان تخمین می‌زنیم. 64 مکان در حدود 1:30، 127 مکان در 3:00، و 92 مورد از این 127 فقط خودروی اقتصادی می‌خواهند."
  meta_title: "سفر یک‌روزه از کوتایسی با خودرو: 127 مکان | RentUp"
  meta_description: "64 مکان در حدود 1:30 از کوتایسی، 127 مکان در 3:00 و 171 مکان در 5:00. زمان رانندگی از سرعت اندازه‌گیری‌شدهٔ جادّهٔ هر مکان تخمین زده شده، با ردهٔ خودرو."
  body: |
    ## یک روز از کوتایسی تا کجا می‌رسد

    کوتایسی مرکز جغرافیایی همهٔ آن چیزی است که غرب رشته‌کوه لیخی قرار دارد، و ارقام همین را نشان
    می‌دهند. در 1 سپتامبر 2026 هر 267 مکان پایگاه داده را بر اساس زمان تخمینی رانندگی از شهر مرتب
    کردیم. چهار مورد داخل خود کوتایسی است، پس **263 مکان بیرون از شهر** می‌ماند.

    | زمان یک‌طرفه (تخمینی) | مکان | اقتصادی | شاسی‌بلند | آفرود 4x4 | آسفالت یا تقریباً آسفالت |
    |---|---|---|---|---|---|
    | تا حدود 1:30 | 64 | 49 | 15 | 0 | 60 از 64 |
    | 1:30 تا 3:00 | 63 | 43 | 15 | 5 | 55 از 63 |
    | 3:00 تا 5:00 | 44 | 16 | 20 | 8 | 32 از 44 |
    | **در 3:00** | **127** | **92** | **30** | **5** | **115 از 127** |
    | در 5:00 | 171 | 108 | 50 | 13 | 147 از 171 |

    **127 مکان در سه ساعت، که 92 مورد از آن‌ها برای [خودروی اقتصادی](/car-rental/economy/) ثبت شده
    است.** در 1:30 از کوتایسی 15 صومعه، 9 موزه، 8 شهر، 6 دژ، 3 غار، 3 کانیون و 3 آبشار هست. از 64 مورد، 57 مورد در تمام سال باز است.

    **این زمان‌ها چگونه ساخته می‌شوند؛ اول این را بخوانید.** رکوردهای ما فقط فاصله و زمان
    اندازه‌گیری‌شده از تفلیس را دارند. برای هر مکان این دو را تقسیم می‌کنیم: فاصلهٔ جاده‌ای بر
    فاصلهٔ مستقیم می‌گوید جادّهٔ آن مکان چقدر پیچ‌درپیچ است، و فاصلهٔ جاده‌ای بر زمان می‌گوید آن
    جاده چه سرعت متوسطی را اجازه می‌دهد. سپس همین دو عدد را روی خط مستقیم از کوتایسی به کار
    می‌بریم. این تخمینی است از سرعت اندازه‌گیری‌شدهٔ جادّهٔ خود هر مکان، **نه مسیریابی**. هرجا
    رشته‌کوهی میان کوتایسی و مکان باشد، جادّهٔ واقعی آن را دور می‌زند و تخمین کم می‌آید؛ ردیف‌های
    سامتسخه در پایین (بورجومی، راباتی) را خوش‌بینانه بخوانید. برای [تفلیس](/guides/day-trips-from-tbilisi/)
    از فیلدهای دقیق اندازه‌گیری‌شده استفاده می‌کنیم.

    ## بیست سفر یک‌روزه از کوتایسی

