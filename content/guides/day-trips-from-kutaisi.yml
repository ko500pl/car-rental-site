    ## الحلقة ضمن عشرين دقيقة

    لا مدينة أخرى في قاعدة بياناتنا لديها هذا العدد من الأماكن المصنّفة بهذا القرب.
    [موتساميتا](/attractions/motsameta-monastery/) تقديرها 0:04، و[غيلاتي](/attractions/gelati-monastery/)،
    موقع يونسكو مجاني بتقييم 5.0، 0:07، و[ساتابليا](/attractions/sataplia-nature-reserve/) بآثار أقدام
    الديناصورات مثلها. [قصر غيغوتي](/attractions/geguti-palace/) 0:09، و[تسخالتوبو](/attractions/tskaltubo-spa-town/)
    0:11، وكهفا [تسوتسخفاتي](/attractions/tsutskhvati-caves/) و[نافيناخيفي](/attractions/navenakhevi-cave/)
    0:14، و[كهف بروميثيوس](/attractions/prometheus-cave/) 0:17. كلها اقتصادية إلا تسوتسخفاتي، المصنّف
    دفعاً رباعياً خفيفاً بموسم مايو إلى أكتوبر. [يوم أديرة كوتايسي وكهوفها](/routes/kutaisi-monasteries-caves-day/)
    85 كم بفئة اقتصادية.

    ## أودية وشلالات، من 30 إلى 50 دقيقة

    [أوكاتسي](/attractions/okatse-canyon/) على 0:30 و[مارتفيلي](/attractions/martvili-canyon/) على 0:32
    هما الثنائي الشهير وكلاهما اقتصادي. الثلاثة التالية هي حيث تتغير الفئة: [شلال كينتشخا](/attractions/kinchkha-waterfall/)
    على 0:35، و[شلال أونيوري](/attractions/oniore-waterfall/) على 0:45، و[وادي بالدا](/attractions/balda-canyon/)
    على 0:46، كلها ترابية بدفع رباعي خفيف وموسمها مايو إلى أكتوبر. [يوم مارتفيلي ونوكالاكيفي](/routes/martvili-nokalakevi-day/)
    165 كم بفئة اقتصادية.

    ## راتشا: ساعة صعوداً على الطريق

    [راتشا-ليتشخومي](/regions/racha-lechkhumi/) منطقة نادراً ما يبلغها زوار تبليسي ويبلغها زوار
    كوتايسي قبل الغداء. [كتلة خفاملي](/attractions/mount-khvamli/) 0:37 (دفع رباعي خفيف)،
    و[نيكورتسميندا](/attractions/nikortsminda-cathedral/) 1:01 على الإسفلت، و[تساغيري](/attractions/tsageri/)
    1:04 (دفع رباعي خفيف)، و[خزان شاوري](/attractions/shaori-reservoir/) 1:16 (دفع رباعي خفيف، تقييم 5.0)،
    و[منطقة خفانتشكارا](/attractions/khvanchkara-wine-zone/) 1:18، و[أمبرولاوري](/attractions/ambrolauri/) 1:31.
    أعالي راتشا، [شوفي](/attractions/shovi-resort/) 4:25، ليست رحلة يوم، ومن يونيو إلى سبتمبر فقط.
    [عطلة راتشا العائلية](/routes/racha-family-weekend/) يومان بدفع رباعي خفيف.

    ## ساميغريلو والساحل

    غرباً تبقى التقديرات دون الساعتين حتى البحر. [نوكالاكيفي](/attractions/nokalakevi/) 0:52،
    و[قصر دادياني في زوغديدي](/attractions/dadiani-palace-zugdidi/) 1:19، و[حديقة كولخيتي الوطنية](/attractions/kolkheti-national-park/)،
    موقع يونسكو بتقييم 5.0، 1:35، و[سد إنغوري](/attractions/enguri-dam/) 1:34، و[أناكليا](/attractions/anaklia/) 1:50.
    شواطئ غوريا أقرب مما يظن معظم الناس: [غريغوليتي](/attractions/grigoleti/) 1:26، و[أوريكي](/attractions/ureki/)
    1:31، و[شيكفيتيلي](/attractions/shekvetili-dendrological-park/) 1:32. كلها معبّدة واقتصادية؛
    والشواطئ من يونيو إلى سبتمبر. [يوم ساحل غوريا](/routes/guria-coast-day/) 135 كم بفئة اقتصادية.

    ## جبال غوريا: حيث تبدأ تصنيفات الدفع الرباعي

    من الأماكن الـ127 ضمن ثلاث ساعات، خمسة مصنّفة للدفع الرباعي واثنان منها هنا. [باخمارو](/attractions/bakhmaro/)
    على 1,950 متراً تقديرها 1:46: ترابي، دفع رباعي، يونيو إلى سبتمبر، تقييم 5.0. [غوميسمتا](/attractions/gomismta/)
    على 2,100 متر 1:44، ترابي، دفع رباعي خفيف. والثلاثة الأخرى [بحيرات توبافارتشخيلي](/attractions/tobavarchkhili-lakes/)
    1:50 و[ممر غودردزي](/attractions/goderdzi-pass/) 2:25 و[بيشومي](/attractions/beshumi/) 2:26.

    ## سفانيتي ونطاق الثلاث إلى الخمس ساعات

    44 مكاناً بين 3:00 و5:00، وهو النطاق الوحيد الذي تكون فيه الاقتصادية أقلية: 16 اقتصادية و20
    دفعاً رباعياً خفيفاً و8 دفعاً رباعياً. [ميستيا](/attractions/mestia/) 3:14 على الإسفلت بدفع رباعي خفيف؛
    و[نهر تشالادي الجليدي](/attractions/chalaadi-glacier/) 3:39؛ و[بحيرات كورولدي](/attractions/koruldi-lakes/)
    3:44 بصنف 4x4 فقط؛ و[أوشغولي](/attractions/ushguli/) 4:01 ترابية بدفع رباعي. ابدأ
    [بعثة سفانيتي](/routes/svaneti-expedition/) من كوتايسي، لا في يوم واحد.

    ## أي سيارة

    - **92 من الأماكن الـ127 ضمن ثلاث ساعات** اقتصادية: [سيارة اقتصادية في كوتايسي](/car-rental/kutaisi/) تكفي.
    - **30 تحتاج [دفعاً رباعياً خفيفاً](/car-rental/suv/)**: كينتشخا وأونيوري وبالدا وخفاملي وشاوري وتساغيري وغوميسمتا وميستيا.
    - **5 تحتاج [دفعاً رباعياً 4x4](/car-rental/4x4/)**: باخمارو وتوبافارتشخيلي وغودردزي وبيشومي والبحيرة الخضراء.

    107 من الـ127 مفتوحة طوال السنة. [أداة رحلات اليوم الواحد](/day-trip/) تحسب التقدير نفسه مباشرة
    من أي نقطة انطلاق؛ وسؤال الفئة يجيب عنه [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "هل أزمنة القيادة من كوتايسي مقاسة أم مقدّرة؟"
    a: "مقدّرة. سجلاتنا تحمل مسافة وزمناً مقاسين من تبليسي فقط. لكل مكان نستخرج من تلك القياسات كم يتعرّج طريقه وأي سرعة متوسطة يسمح بها، ونطبّق الاثنين على الخط المستقيم من كوتايسي. ليس هذا مسار ملاحة، وحيث تفصل سلسلة جبلية بين كوتايسي والمكان يقصر التقدير."
  - q: "ما أقرب موقع يونسكو إلى كوتايسي؟"
    a: "دير غيلاتي، بتقدير 0:07 من المدينة على طريق معبّد، دخوله مجاني وتقييمه 5.0 في بياناتنا. وحديقة كولخيتي الوطنية، موقع يونسكو الآخر في الغرب، على نحو 1:35."
  - q: "هل يمكن زيارة واديي أوكاتسي ومارتفيلي في يوم واحد من كوتايسي؟"
    a: "أوكاتسي بتقدير 0:30 ومارتفيلي 0:32 من كوتايسي، كلاهما اقتصادي، بثلاث ساعات وساعتين في الموقع على الترتيب. أوكاتسي مكان مايو إلى أكتوبر؛ ومارتفيلي مفتوح طوال السنة."
  - q: "أي رحلات من كوتايسي تحتاج دفعاً رباعياً خفيفاً أو 4x4؟"
    a: "ضمن ثلاث ساعات، 30 مكاناً مصنّف للدفع الرباعي الخفيف، منها كينتشخا وأونيوري وبالدا وخفاملي وشاوري وتساغيري وغوميسمتا وميستيا، وخمسة للدفع الرباعي: باخمارو وتوبافارتشخيلي وغودردزي وبيشومي والبحيرة الخضراء. والـ92 الباقية اقتصادية."
  - q: "هل ميستيا رحلة يوم واحد من كوتايسي؟"
    a: "تقديرنا 3:14 في اتجاه واحد على الإسفلت، بفئة دفع رباعي خفيف، وموسم مايو إلى أكتوبر، وأوشغولي بتقدير 4:01. خطّط لسفانيتي من كوتايسي مع مبيت، لا في يوم."
