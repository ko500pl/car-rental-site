    | [בחמארו](/attractions/bakhmaro/) | 1:46 | 6 שע' | עפר | 4x4 שטח | יוני עד ספטמבר |
    | [מסטיה](/attractions/mestia/) | 3:14 | 4 שע' | סלול | רכב שטח עירוני | מאי עד אוקטובר |
    | [אושגולי](/attractions/ushguli/) | 4:01 | 4 שע' | עפר | 4x4 שטח | יוני עד ספטמבר |

    ## הטבעת שבטווח עשרים דקות

    לאף עיר אחרת במאגר אין כל כך הרבה מקומות מדורגים כל כך קרוב. [מוצמטה](/attractions/motsameta-monastery/)
    היא הערכה של 0:04, [גלאטי](/attractions/gelati-monastery/) - אתר אונסק"ו, חינם, דירוג 5.0 - 0:07,
    ו[סאטאפליה](/attractions/sataplia-nature-reserve/) עם עקבות הדינוזאורים אותו דבר.
    [ארמון גגוטי](/attractions/geguti-palace/) 0:09, [צחלטובו](/attractions/tskaltubo-spa-town/) 0:11,
    מערות [צוצחוואטי](/attractions/tsutskhvati-caves/) ו[נאוונאחווי](/attractions/navenakhevi-cave/) 0:14,
    [מערת פרומתאוס](/attractions/prometheus-cave/) 0:17. הכול אקונומי חוץ מצוצחוואטי, שמסווגת רכב
    שטח עירוני ועונתה מאי עד אוקטובר. [יום המנזרים והמערות של קוטאיסי](/routes/kutaisi-monasteries-caves-day/)
    הוא 85 ק"מ, אקונומי.

    ## קניונים ומפלים, 30 עד 50 דקות

    [אוקאצה](/attractions/okatse-canyon/) ב-0:30 ו[מרטווילי](/attractions/martvili-canyon/) ב-0:32 הם
    הזוג המפורסם ושניהם אקונומי. שלושת הבאים הם המקום שבו הקטגוריה משתנה: [מפל קינצחה](/attractions/kinchkha-waterfall/)
    ב-0:35, [מפל אוניורה](/attractions/oniore-waterfall/) ב-0:45 ו[קניון בלדה](/attractions/balda-canyon/)
    ב-0:46 - כולם עפר, רכב שטח עירוני, מאי עד אוקטובר. [יום מרטווילי ונוקאלקווי](/routes/martvili-nokalakevi-day/)
    הוא 165 ק"מ, אקונומי.

    ## ראצ'ה: שעה במעלה הדרך

    [ראצ'ה-לצ'חומי](/regions/racha-lechkhumi/) הוא האזור שמבקרי טביליסי כמעט לא מגיעים אליו ומבקרי
    קוטאיסי מגיעים לפני הצהריים. [גוש חוואמלי](/attractions/mount-khvamli/) 0:37 (רכב שטח עירוני),
    [ניקורצמינדה](/attractions/nikortsminda-cathedral/) 1:01 על אספלט, [צאגרי](/attractions/tsageri/) 1:04
    (רכב שטח עירוני), [מאגר שאורי](/attractions/shaori-reservoir/) 1:16 (רכב שטח עירוני, דירוג 5.0),
    [אזור חוונצ'קארה](/attractions/khvanchkara-wine-zone/) 1:18 ו[אמברולאורי](/attractions/ambrolauri/) 1:31.
    ראצ'ה הגבוהה - [שובי](/attractions/shovi-resort/) 4:25 - כבר איננה טיול יום, ורק מיוני עד ספטמבר.
    [סוף השבוע המשפחתי בראצ'ה](/routes/racha-family-weekend/) הוא יומיים, רכב שטח עירוני.

    ## סמגרלו והחוף

    מערבה ההערכות נשארות מתחת לשעתיים עד הים. [נוקאלקווי](/attractions/nokalakevi/) 0:52,
    [ארמון דדיאני בזוגדידי](/attractions/dadiani-palace-zugdidi/) 1:19, [הפארק הלאומי קולחתי](/attractions/kolkheti-national-park/)
    - אתר אונסק"ו, דירוג 5.0 - 1:35, [סכר אנגורי](/attractions/enguri-dam/) 1:34 ו[אנאקליה](/attractions/anaklia/) 1:50.
    חופי גוריה קרובים יותר ממה שרוב האנשים חושבים: [גריגולטי](/attractions/grigoleti/) 1:26,
    [אורקי](/attractions/ureki/) 1:31, [שקווטילי](/attractions/shekvetili-dendrological-park/) 1:32. כולם
    סלולים ואקונומי; החופים יוני עד ספטמבר. [יום חוף גוריה](/routes/guria-coast-day/) הוא 135 ק"מ, אקונומי.

    ## הרי גוריה: היכן שמתחילים סיווגי השטח

    מתוך 127 המקומות בטווח שלוש שעות, חמישה מסווגים שטח ושניים מהם כאן. [בחמארו](/attractions/bakhmaro/)
    ב-1,950 מ' היא הערכה של 1:46: עפר, שטח, יוני עד ספטמבר, דירוג 5.0. [גומיסמטה](/attractions/gomismta/)
    ב-2,100 מ' היא 1:44, עפר, רכב שטח עירוני. שלושת מקומות השטח האחרים הם [אגמי טובאוורצ׳חילי](/attractions/tobavarchkhili-lakes/)
    1:50, [מעבר גודרדזי](/attractions/goderdzi-pass/) 2:25 ו[בשומי](/attractions/beshumi/) 2:26.

    ## סוואנטי ורצועת שלוש עד חמש שעות

    44 מקומות יושבים בין 3:00 ל-5:00, וזו הרצועה היחידה שבה אקונומי במיעוט: 16 אקונומי, 20 רכב שטח
    עירוני, 8 שטח. [מסטיה](/attractions/mestia/) 3:14 על אספלט, רכב שטח עירוני; [קרחון צ'לאדי](/attractions/chalaadi-glacier/)
    3:39; [אגמי קורולדי](/attractions/koruldi-lakes/) 3:44, 4x4 בלבד; [אושגולי](/attractions/ushguli/) 4:01, עפר,
    שטח. התחילו את [משלחת סוואנטי](/routes/svaneti-expedition/) מקוטאיסי, לא ביום אחד.

    ## איזה רכב

    - **92 מתוך 127 המקומות בטווח שלוש שעות** הם אקונומי: [רכב אקונומי בקוטאיסי](/car-rental/kutaisi/) מספיק.
    - **30 דורשים [רכב שטח עירוני](/car-rental/suv/)**: קינצחה, אוניורה, בלדה, חוואמלי, שאורי, צאגרי, גומיסמטה ומסטיה.
    - **5 דורשים [4x4 שטח](/car-rental/4x4/)**: בחמארו, טובאוורצ׳חילי, גודרדזי, בשומי והאגם הירוק.

    107 מתוך 127 פתוחים כל השנה. [מאתר טיולי היום](/day-trip/) מחשב את אותה הערכה חי מכל נקודת
    התחלה; לשאלת הקטגוריה עונה [האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "האם זמני הנסיעה מקוטאיסי נמדדו או הוערכו?"
    a: "הוערכו. הרשומות שלנו מחזיקות מרחק וזמן נמדדים מטביליסי בלבד. לכל מקום אנחנו גוזרים מהמדידות האלה כמה הדרך אליו מתפתלת ואיזו מהירות ממוצעת היא מאפשרת, ומחילים את שניהם על הקו הישר מקוטאיסי. זה לא ניווט, ובמקום שרכס מפריד בין קוטאיסי למקום ההערכה קצרה מדי."
  - q: "מהו אתר אונסק\"ו הקרוב ביותר לקוטאיסי?"
    a: "מנזר גלאטי, הערכה של 0:07 מהעיר על דרך סלולה, כניסה חינם ודירוג 5.0 בנתונים שלנו. הפארק הלאומי קולחתי, אתר אונסק\"ו השני במערב, הוא בערך 1:35."
  - q: "אפשר לראות את קניוני אוקאצה ומרטווילי ביום אחד מקוטאיסי?"
    a: "אוקאצה הוא הערכה של 0:30 ומרטווילי 0:32 מקוטאיסי, שניהם אקונומי, עם שלוש ושתי שעות במקום בהתאמה. אוקאצה הוא מקום של מאי עד אוקטובר; מרטווילי פתוח כל השנה."
  - q: "אילו טיולים מקוטאיסי דורשים רכב שטח עירוני או 4x4?"
    a: "בטווח שלוש שעות 30 מקומות מסווגים רכב שטח עירוני - ביניהם קינצחה, אוניורה, בלדה, חוואמלי, שאורי, צאגרי, גומיסמטה ומסטיה - וחמישה מסווגים שטח: בחמארו, טובאוורצ׳חילי, גודרדזי, בשומי והאגם הירוק. 92 האחרים אקונומי."
  - q: "האם מסטיה היא טיול יום מקוטאיסי?"
    a: "ההערכה שלנו היא 3:14 לכיוון אחד על אספלט, רכב שטח עירוני, בעונה מאי עד אוקטובר, ואושגולי היא הערכה של 4:01. תכננו את סוואנטי מקוטאיסי עם לינה, לא כיום אחד."

ar:
  name: "رحلات يوم واحد من كوتايسي بالسيارة: 127 مكاناً في ثلاث ساعات"
  short: "نقدّر زمن القيادة من كوتايسي إلى الأماكن الـ263 خارج المدينة من سرعة الطريق المقاسة لكل مكان. 64 منها في نحو 1:30، و127 في 3:00، و92 من هذه الـ127 لا تحتاج إلا سيارة اقتصادية."
  meta_title: "رحلات يوم واحد من كوتايسي بالسيارة: 127 مكاناً | RentUp"
  meta_description: "64 مكاناً في نحو 1:30 من كوتايسي، و127 في 3:00، و171 في 5:00. زمن القيادة مقدّر من سرعة الطريق المقاسة لكل مكان؛ مع سطح الطريق وفئة السيارة."
  body: |
    ## إلى أي مدى يصل يوم واحد من كوتايسي

    كوتايسي هي المركز الجغرافي لكل ما يقع غرب سلسلة ليخي، والأرقام تثبت ذلك. في 1 سبتمبر 2026
    رتّبنا الأماكن الـ267 في قاعدة بياناتنا بحسب زمن القيادة المقدّر من المدينة. أربعة منها في
    كوتايسي نفسها، فيبقى **263 مكاناً خارج المدينة**.

    | الزمن في اتجاه واحد (تقدير) | الأماكن | اقتصادية | دفع رباعي خفيف | دفع رباعي 4x4 | معبّد أو شبه معبّد |
    |---|---|---|---|---|---|
    | حتى نحو 1:30 | 64 | 49 | 15 | 0 | 60 من 64 |
    | من 1:30 إلى 3:00 | 63 | 43 | 15 | 5 | 55 من 63 |
    | من 3:00 إلى 5:00 | 44 | 16 | 20 | 8 | 32 من 44 |
    | **ضمن 3:00** | **127** | **92** | **30** | **5** | **115 من 127** |
    | ضمن 5:00 | 171 | 108 | 50 | 13 | 147 من 171 |

    **127 مكاناً ضمن ثلاث ساعات، 92 منها مصنّفة لـ[سيارة اقتصادية](/car-rental/economy/).** هذا أكثر
    مما تقدّمه تبليسي في نصف القطر نفسه، والتركيبة مختلفة: ضمن 1:30 من كوتايسي هناك 15 ديراً و9
    متاحف و8 بلدات و6 قلاع و4 منتجعات و3 كهوف و3 أودية و3 شلالات. من الـ64، 57 مفتوحة طوال السنة.

    **كيف تُحسب هذه الأزمنة؛ اقرأ هذا أولاً.** سجلاتنا تحمل مسافة وزمناً مقاسين من تبليسي فقط. لكل
    مكان نقسم الاثنين: مسافة الطريق على المسافة المستقيمة تقول كم يتعرّج طريق ذلك المكان، ومسافة
    الطريق على الزمن تقول أي سرعة متوسطة يسمح بها ذلك الطريق. ثم نطبّق الرقمين على الخط المستقيم
    من كوتايسي. هذا تقدير من سرعة الطريق المقاسة لكل مكان، **لا مسار ملاحة**. وحيث تفصل سلسلة
    جبلية بين كوتايسي والمكان، يلتف الطريق الحقيقي حولها ويقصر التقدير؛ فاقرأ صفوف سامتسخي أدناه
    (بورجومي، راباتي) بوصفها متفائلة. أما [تبليسي](/guides/day-trips-from-tbilisi/) فنستخدم لها الحقول
    المقاسة الدقيقة.

    ## عشرون رحلة يوم واحد من كوتايسي

