    ## الساحل: خمسة شواطئ ضمن ساعة

    باتومي الوحيدة بين المدن الثلاث التي يكون فيها «الشاطئ» فئة من رحلات اليوم الواحد.
    [كفارياتي](/attractions/kvariati/) تقديرها 0:17 جنوباً، و[سارپي](/attractions/sarpi-beach/) 0:21 عند
    الحدود. شمالاً [كوبوليتي](/attractions/kobuleti/) 0:28، و[أوريكي](/attractions/ureki/) بتقييم 5.0 على
    0:44، و[غريغوليتي](/attractions/grigoleti/) 0:48، وبينها شريط شيكفيتيلي: [حديقة الأشجار](/attractions/shekvetili-dendrological-park/)
    0:45 و[ساحة البحر الأسود](/attractions/shekvetili-black-sea-arena/) 0:43. كلها معبّدة واقتصادية؛
    ولكل شاطئ في القائمة موسم يونيو إلى سبتمبر. [يوم ساحل باتومي العائلي](/routes/batumi-coast-family-day/)
    55 كم بفئة اقتصادية.

    ## القلاع والحديقة، دون عشرين دقيقة

    [الحديقة النباتية](/attractions/batumi-botanical-garden/) على 0:10 و[غونيو-أبساروس](/attractions/gonio-fortress/)
    على 0:13 هما أول توقفين بديهيين: معبّد، اقتصادية، طوال السنة، ثلاث ساعات وساعتان في الموقع.
    [حصن بيترا](/attractions/petra-fortress/) على 0:20 هو الثالث الأهدأ. في [أدجارا](/regions/adjara/)
    كلها 5 أماكن فقط على طريق ترابي أو 4x4 فقط.

    ## أربعة منتزهات ومحميات

    هنا تبدأ تصنيفات الدفع الرباعي الخفيف، وتبدأ قريباً. [منتزه ماتشاخيلا](/attractions/machakhela-national-park/)
    0:22 و[متيرالا](/attractions/mtirala-national-park/) 0:24، كلاهما معبّد في معظمه، وكلاهما دفع رباعي
    خفيف، وكلاهما مايو إلى أكتوبر بأربع ساعات في الموقع. [كينتريشي](/attractions/kintrishi-protected-areas/)
    على 0:46 ترابية. [حديقة كولخيتي الوطنية](/attractions/kolkheti-national-park/) على 0:58 هي الاستثناء:
    موقع يونسكو، معبّد، اقتصادية، طوال السنة، تقييم 5.0.

    ## أدجارا العليا: الطريق الذي يصعد

    [شلال ماخونتسيتي](/attractions/makhuntseti-waterfall/) 0:34 و[أقبية كيدا](/attractions/keda-wine-cellars/) 0:39 معبّدة واقتصادية. [كاتدرائية سخالتا](/attractions/skhalta-monastery/)
    1:47 و[تلفريك خولو](/attractions/khulo-cable-car-upper-adjara/) 1:57 معبّدان في معظمهما بدفع رباعي
    خفيف. ثم الممر: [قلعة خيخاني](/attractions/khikhani-fortress/) 2:03 من صنف 4x4 فقط، و[بيشومي](/attractions/beshumi/)
    2:17 و[ممر غودردزي](/attractions/goderdzi-pass/) 2:22 ترابيان للدفع الرباعي، و[البحيرة الخضراء](/attractions/green-lake-goderdzi/)
    2:29 من صنف 4x4 فقط؛ وأربعتها من يونيو إلى سبتمبر. مسار [نبيذ أدجارا العليا وقراها](/routes/upper-adjara-wine-and-villages/)
    أربعة أيام بدفع رباعي خفيف.

    ## غوريا: ساعة شمالاً، وجبالها

    [غوريا](/regions/guria/) تملأ نطاق 0:50 إلى 1:30. [أوزورغيتي](/attractions/ozurgeti/) 0:54، و[متحف نودار دومبادزه](/attractions/nodar-dumbadze-house-museum/)
    بتقييم 4.7 على 1:16، كلها اقتصادية. أما الجبال فسيارة أخرى: [غوميسمتا](/attractions/gomismta/) 1:14 ترابية بدفع رباعي
    خفيف، و[باخمارو](/attractions/bakhmaro/) 1:56 ترابية للدفع الرباعي، وكلتاهما من يونيو إلى سبتمبر.
    [يوم ساحل غوريا](/routes/guria-coast-day/) اقتصادي.

    ## ساعتان: ساميغريلو وإيميريتي

    [قصر دادياني](/attractions/dadiani-palace-zugdidi/) 1:46 في ساميغريلو؛ ثم [تسخالتوبو](/attractions/tskaltubo-spa-town/) 2:00
    و[كهف بروميثيوس](/attractions/prometheus-cave/) 2:09 و[وادي أوكاتسي](/attractions/okatse-canyon/) 2:13
    و[غيلاتي](/attractions/gelati-monastery/) 2:16 و[وادي مارتفيلي](/attractions/martvili-canyon/) 2:44. كلها
    اقتصادية، مثل 39 من الأماكن الـ56 في هذا النطاق. والباقي في [دليل كوتايسي](/guides/day-trips-from-kutaisi/) عندنا.

    ## أي سيارة

    - **65 من الأماكن الـ89 ضمن ثلاث ساعات** اقتصادية: [سيارة اقتصادية في باتومي](/car-rental/batumi/) تكفي.
    - **19 تحتاج [دفعاً رباعياً خفيفاً](/car-rental/suv/)**: متيرالا وماتشاخيلا وكينتريشي وسخالتا وخولو وغوميسمتا.
    - **5 تحتاج [دفعاً رباعياً 4x4](/car-rental/4x4/)**: باخمارو وخيخاني وبيشومي وغودردزي والبحيرة الخضراء؛ كلها من يونيو إلى سبتمبر.

    75 من الـ89 مفتوحة طوال السنة. [أداة رحلات اليوم الواحد](/day-trip/) تحسب التقدير نفسه مباشرة
    من أي نقطة انطلاق؛ وسؤال الفئة يجيب عنه [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "هل أزمنة القيادة من باتومي مقاسة أم مقدّرة؟"
    a: "مقدّرة. سجلاتنا تحمل مسافة وزمناً مقاسين من تبليسي فقط. لكل مكان نستخرج من تلك القياسات كم يتعرّج طريقه وأي سرعة متوسطة يسمح بها، ونطبّق الاثنين على الخط المستقيم من باتومي. ليس هذا مسار ملاحة، وحيث تقع سلسلة أدجارا بين باتومي والمكان يقصر التقدير."
  - q: "أي الشواطئ رحلة يوم واحد من باتومي؟"
    a: "كفارياتي بتقدير 0:17، وسارپي 0:21، وكوبوليتي 0:28، وأوريكي 0:44، وغريغوليتي 0:48. الخمسة كلها معبّدة واقتصادية، وموسمها كلها في بياناتنا يونيو إلى سبتمبر."
  - q: "هل أحتاج دفعاً رباعياً خفيفاً إلى متيرالا أو ماتشاخيلا؟"
    a: "المنتزهان الوطنيان مصنّفان في بياناتنا للدفع الرباعي الخفيف: طرق معبّدة في معظمها، مايو إلى أكتوبر، أربع ساعات في الموقع، بتقدير 0:24 و0:22 من باتومي. كينتريشي على 0:46 ترابية ودفع رباعي خفيف أيضاً. حديقة كولخيتي الوطنية على 0:58 معبّدة واقتصادية."
  - q: "أي رحلات من باتومي تحتاج 4x4؟"
    a: "خمسة أماكن ضمن ثلاث ساعات مصنّفة للدفع الرباعي: باخمارو وقلعة خيخاني وبيشومي وممر غودردزي والبحيرة الخضراء. خمستها أماكن يونيو إلى سبتمبر في الداخل المرتفع لأدجارا وغوريا."
  - q: "هل كوتايسي رحلة يوم واحد من باتومي؟"
    a: "مجموعة كوتايسي بتقدير 2:00 إلى 2:16 في اتجاه واحد: تسخالتوبو 2:00، كهف بروميثيوس 2:09، أوكاتسي 2:13، غيلاتي 2:16. كلها معبّدة واقتصادية. يوم طويل؛ ودليل كوتايسي عندنا مكتوب لمن يبقى."
