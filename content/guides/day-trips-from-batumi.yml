    ## სანაპირო: ხუთი პლაჟი ერთ საათში

    ბათუმი სამი ქალაქიდან ერთადერთია, სადაც „პლაჟი" ერთდღიანი მოგზაურობის კატეგორიაა.
    [კვარიათი](/attractions/kvariati/) სამხრეთით შეფასებით 0:17-ია, [სარფი](/attractions/sarpi-beach/)
    საზღვართან — 0:21. ჩრდილოეთით [ქობულეთი](/attractions/kobuleti/) 0:28-ია, [ურეკი](/attractions/ureki/)
    — რეიტინგი 5.0 — 0:44, [გრიგოლეთი](/attractions/grigoleti/) 0:48, მათ შორის კი შეკვეთილის ზოლია:
    [დენდროლოგიური პარკი](/attractions/shekvetili-dendrological-park/) 0:45, [ციცინათელა](/attractions/tsitsinatela-amusement-park/)
    და [შავი ზღვის არენა](/attractions/shekvetili-black-sea-arena/) 0:43. ყველაფერი ასფალტი და ეკონომია;
    სიის ყველა პლაჟს ივნისიდან სექტემბრამდე სეზონი უწერია. [ბათუმის სანაპიროს საოჯახო დღე](/routes/batumi-coast-family-day/)
    55 კმ-ია, ეკონომი, და ორ მსუბუქ დღედაა დაწერილი.

    ## ციხეები და ბაღი, ოც წუთამდე

    [ბოტანიკური ბაღი](/attractions/batumi-botanical-garden/) 0:10-ზე და [გონიო-აფსაროსი](/attractions/gonio-fortress/)
    0:13-ზე ორი აშკარა პირველი გაჩერებაა — ასფალტი, ეკონომი, მთელი წელი ღია, ადგილზე სამი და ორი საათი.
    [პეტრას ციხე](/attractions/petra-fortress/) 0:20-ზე ქობულეთის გზაზე უფრო წყნარი მესამეა. მთლიანად
    [აჭარაში](/regions/adjara/) 24 ადგილია აღწერილი და მხოლოდ 5 გრუნტზე ან 4x4-ის გზაზეა — ხუთივე მაღალ
    შიდა ნაწილში.

    ## ოთხი ეროვნული პარკი და ნაკრძალი

    სწორედ აქ იწყება კროსოვერის შეფასებები და იწყება ახლოს. [მაჭახლის ეროვნული პარკი](/attractions/machakhela-national-park/)
    0:22-ია და [მთირალა](/attractions/mtirala-national-park/) — 0:24, ორივე ძირითადად ასფალტი, ორივე
    კროსოვერით შეფასებული, ორივე მაისიდან ოქტომბრამდე, ადგილზე ოთხი საათი. [ქინტრიში](/attractions/kintrishi-protected-areas/)
    0:46-ზე გრუნტია და არა მთელი წელი ღია. [კოლხეთის ეროვნული პარკი](/attractions/kolkheti-national-park/)
    0:58-ზე გამონაკლისია — UNESCO-ს ძეგლი, ასფალტი, ეკონომი, მთელი წელი, რეიტინგი 5.0 — და
    [ფოთი](/attractions/poti/) 0:59-ზე ერთი წუთით შორსაა. 1:30-ის ფარგლებში 7 კროსოვერის შეფასებიდან სამი ეს
    პარკებია; დანარჩენი [ასკანა](/attractions/askana-fortress/) 1:04, [თელეფისი](/attractions/telefisi-fortress/)
    1:09, [ზანდო](/attractions/zando-st-george-monastery/) 1:14 და [გომისმთა](/attractions/gomismta/) 1:14.

    ## ზემო აჭარა: გზა, რომელიც ადის

    აჭარისწყლის ხეობა ერთი გზაა და შეფასებები მის გასწვრივ იზრდება. [მახუნცეთის ჩანჩქერი](/attractions/makhuntseti-waterfall/)
    0:34, [ქედის მარნები](/attractions/keda-wine-cellars/) 0:39 და [დანდალოს ხიდი](/attractions/dandalo-arched-bridge/)
    0:42 ასფალტი და ეკონომია. [სხალთის ტაძარი](/attractions/skhalta-monastery/) 1:47 და
    [ხულოს საბაგირო](/attractions/khulo-cable-car-upper-adjara/) 1:57 ძირითადად ასფალტი და კროსოვერია.
    შემდეგ უღელტეხილი: [ხიხანის ციხე](/attractions/khikhani-fortress/) 2:03 მხოლოდ 4x4-ისაა,
    [ბეშუმი](/attractions/beshumi/) 2:17 და [გოდერძის უღელტეხილი](/attractions/goderdzi-pass/) 2:22 გრუნტი
    და ჯიპია, [მწვანე ტბა](/attractions/green-lake-goderdzi/) 2:29 მხოლოდ 4x4 — ოთხივე ივნისიდან
    სექტემბრამდე. [ზემო აჭარის ღვინისა და სოფლების](/routes/upper-adjara-wine-and-villages/) მარშრუტი
    ოთხი დღეა და კროსოვერით შეფასებული; 4x4-ის ადგილებამდე არ მიდის.

    ## გურია: ერთი საათი ჩრდილოეთით და მისი მთები

    [გურია](/regions/guria/) 0:50-დან 1:30-მდე ზოლს ავსებს. [ოზურგეთი](/attractions/ozurgeti/) 0:54-ია,
    [ჯუმათის](/attractions/jumati-monastery/), [ლიხაურისა](/attractions/likhauri-church/) და
    [შემოქმედის](/attractions/shemokmedi-monastery/) ეკლესიები 0:54-დან 0:58-მდე, [შუხუთი](/attractions/shukhuti-lelo-burti/)
    0:57, [ნოდარ დუმბაძის მუზეუმი](/attractions/nodar-dumbadze-house-museum/) — რეიტინგი 4.7 — 1:16,
    [სამება-ჯიხეთის მონასტერი](/attractions/sameba-jikheti-monastery/) 1:19 და [ჩოხატაური](/attractions/chokhatauri/)
    1:22, ყველა ეკონომი. მთები სხვა მანქანაა: [გომისმთა](/attractions/gomismta/) 1:14 გრუნტი და
    კროსოვერია, [ბახმარო](/attractions/bakhmaro/) 1:56 — გრუნტი და ჯიპი, ორივე ივნისიდან სექტემბრამდე.
    [გურიის სანაპიროს დღე](/routes/guria-coast-day/) ეკონომია; [გურიის მთისა და კურორტის უიკენდი](/routes/guria-mountain-spa-weekend/)
    ბახმაროს გამო ჯიპითაა შეფასებული.

    ## ორი საათი: სამეგრელო და იმერეთი

    1:30-დან 3:00-მდე ზოლში ბათუმი დასავლეთის კლასიკურ ღირსშესანიშნაობებს აღწევს. [ანაკლია](/attractions/anaklia/)
    1:37, [დადიანების სასახლე](/attractions/dadiani-palace-zugdidi/) 1:46 და [ნოქალაქევი](/attractions/nokalakevi/)
    1:47 სამეგრელოში; შემდეგ [წყალტუბო](/attractions/tskaltubo-spa-town/) 2:00, [ბაგრატი](/attractions/bagrati-cathedral/)
    2:01, [პრომეთეს მღვიმე](/attractions/prometheus-cave/) 2:09, [ოკაცეს კანიონი](/attractions/okatse-canyon/)
    2:13, [გელათი](/attractions/gelati-monastery/) 2:16 და [მარტვილის კანიონი](/attractions/martvili-canyon/)
    2:44. ყველა ეკონომია და ამ ზოლის 56 ადგილიდან 39-ც. [ქუთაისის მონასტრებისა და მღვიმეების დღე](/routes/kutaisi-monasteries-caves-day/)
    იმერეთის ჯგუფს ფარავს, როცა უკვე იქ ხართ; დანარჩენს — ჩვენი [ქუთაისის გზამკვლევი](/guides/day-trips-from-kutaisi/).

    ## სამიდან ხუთ საათამდე: ერთდღიანი აღარ არის

    37 ადგილი 3:00-სა და 5:00-ს შორისაა, მათგან 23 ეკონომი. [ქაცხის სვეტი](/attractions/katskhi-pillar/)
    3:03, [გორი](/attractions/gori-fortress-stalin-museum/) 3:39, [ნიკორწმინდა](/attractions/nikortsminda-cathedral/)
    4:25 და [ვარძია](/attractions/vardzia/) 4:32 ყველა ასფალტზეა, მაგრამ თითოეული ერთი გაჩერებისთვის ექვს
    საათზე მეტი მართვაა. ხუთდღიანი [აჭარისა და გურიის მწვანე გზა](/routes/adjara-guria-green-road/) ამ
    ზოლამდე ბათუმიდან მისვლის პატიოსანი გზაა.

    ## რომელი კატეგორია და საიდან დაიწყოთ

    - **სამ საათში მოქცეული 89 ადგილიდან 65** ეკონომია. [ეკონომ-კლასის მანქანა ბათუმში](/car-rental/batumi/)
      ყველა პლაჟს, გონიოს, ბოტანიკურ ბაღს, მახუნცეთს, ქედას, გურიის დაბლობსა და ქუთაისს ფარავს.
    - **19-ს [კროსოვერი](/car-rental/suv/) სჭირდება**: მთირალა, მაჭახელა, ქინტრიში, სხალთა, ხულო და
      გომისმთა — ის, რაც მნიშვნელოვანია.
    - **5-ს [ჯიპი 4x4](/car-rental/4x4/) სჭირდება**: ბახმარო, ხიხანი, ბეშუმი, გოდერძი და მწვანე ტბა —
      ყველა ივნისიდან სექტემბრამდე.

    89-დან 75 მთელი წელი ღიაა; 58-ს ყველა სეზონის შეფასება აქვს, 17 მაისიდან ოქტომბრამდეა და 14 —
    ივნისიდან სექტემბრამდე. [ერთდღიანი მოგზაურობის დამგეგმავი](/day-trip/) იმავე შეფასებას ნებისმიერი
    საწყისი წერტილიდან პირდაპირ ითვლის; კატეგორიის კითხვას პასუხობს
    [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/) ავტომობილის გაქირავება
    ბათუმში სწორედ ამ 89 ადგილიდან იწყება.
  faq:
  - q: "ბათუმიდან ეს დროები გაზომილია თუ შეფასებული?"
    a: "შეფასებული. ჩვენს ჩანაწერებში გაზომილი მანძილი და დრო მხოლოდ თბილისიდანაა. თითოეული ადგილისთვის ამ გაზომვებიდან გამოგვყავს, რამდენად კლაკნილია მისი გზა და რა საშუალო სიჩქარეს უშვებს, და ორივეს ბათუმიდან სწორ ხაზზე ვიყენებთ. ეს ნავიგატორის მარშრუტი არ არის, და სადაც ბათუმსა და ადგილს შორის აჭარის ქედია, შეფასება ნაკლულია."
  - q: "რომელი პლაჟებია ბათუმიდან ერთდღიანი მარშრუტი?"
    a: "კვარიათი შეფასებით 0:17-ია, სარფი — 0:21, ქობულეთი — 0:28, ურეკი — 0:44 და გრიგოლეთი — 0:48. ხუთივე ასფალტი და ეკონომია და ხუთივეს ჩვენს ბაზაში ივნისიდან სექტემბრამდე სეზონი უწერია."
  - q: "მთირალასა და მაჭახელასთვის კროსოვერი მჭირდება?"
    a: "ორივე ეროვნული პარკი ჩვენს ბაზაში კროსოვერითაა შეფასებული: ძირითადად მოასფალტებული გზა, მაისიდან ოქტომბრამდე, ადგილზე ოთხი საათი, ბათუმიდან შეფასებით 0:24 და 0:22. ქინტრიში 0:46-ზე გრუნტია და ასევე კროსოვერი. კოლხეთის ეროვნული პარკი 0:58-ზე ასფალტი და ეკონომია."
  - q: "ბათუმიდან რომელ ერთდღიან მარშრუტებს სჭირდება ჯიპი?"
    a: "სამ საათში ხუთი ადგილია ჯიპით შეფასებული: ბახმარო, ხიხანის ციხე, ბეშუმი, გოდერძის უღელტეხილი და მწვანე ტბა. ხუთივე ივნისიდან სექტემბრამდე ადგილია აჭარისა და გურიის მაღალ შიდა ნაწილში."
  - q: "ქუთაისი ბათუმიდან ერთდღიანი მარშრუტია?"
    a: "ქუთაისის ჯგუფი ერთი მიმართულებით შეფასებით 2:00-დან 2:16-მდეა: წყალტუბო 2:00, ბაგრატი 2:01, პრომეთეს მღვიმე 2:09, ოკაცე 2:13, გელათი 2:16. ყველა ასფალტი და ეკონომი. გრძელი დღეა; ჩვენი ქუთაისის გზამკვლევი მათთვისაა, ვინც რჩება."
  - q: "რამდენად შორსაა ვარძია ბათუმიდან?"
    a: "ჩვენი შეფასება ერთი მიმართულებით 4:32-ია მოასფალტებულ გზაზე, ეკონომი — სწორი ხაზი კი აჭარის ქედს კვეთს, ანუ გზა შეფასებაზე გრძელია. ღამისთევით დაგეგმეთ და არა ერთ დღეში."

ru:
  name: "Куда поехать из Батуми на один день: 89 мест в пределах трёх часов"
  answer: >-
    Из Батуми 89 из 261 места, которые RentUp наносит на карту за пределами города, лежат примерно в
    трёх часах езды в одну сторону, 65 из них рассчитаны на машину эконом-класса; 33 — примерно в
    пределах 1:30, 126 — в пределах 5:00. Ближе всего пляжи: Квариати — 0:17, Сарпи — 0:21, Кобулети
    — 0:28, Уреки — 0:44. Национальные парки Мтирала и Мачахела (0:24 и 0:22) — категория кроссовер.
    Пяти местам в пределах трёх часов нужен внедорожник 4x4: Бахмаро, Хихани, Бешуми, перевал
    Годердзи и Зелёное озеро. Время — оценка по измеренной скорости дороги к каждому месту, а не
    проложенный маршрут.
  short: "Время в пути от Батуми до всех 261 места за пределами города мы оцениваем по измеренной скорости дороги каждого места. 33 из них ближе примерно 1:30, 89 - ближе 3:00, и 65 из этих 89 требуют только машину эконом-класса."
  meta_title: "Куда поехать из Батуми на один день: 89 мест | RentUp"
  meta_description: "33 места в пределах примерно 1:30 от Батуми, 89 в пределах 3:00, 126 в пределах 5:00. Время оценено по измеренной скорости дороги каждого места; категория."
  body: |
    ## Как далеко уезжаешь за день из Батуми

    Батуми стоит в углу: на западе море, на юге турецкая граница в 0:21, за спиной - горы Аджарии.
    1 сентября 2026 года мы отсортировали все 267 мест нашей базы по оценочному времени в пути от
    города. Шесть находятся в самом Батуми, значит остаётся **261 место за пределами города**.

    | В одну сторону (оценка) | Мест | Эконом | Кроссовер | Внедорожник 4x4 | Асфальт или почти асфальт |
    |---|---|---|---|---|---|
    | до примерно 1:30 | 33 | 26 | 7 | 0 | 31 из 33 |
    | от 1:30 до 3:00 | 56 | 39 | 12 | 5 | 47 из 56 |
    | от 3:00 до 5:00 | 37 | 23 | 13 | 1 | 34 из 37 |
    | **в пределах 3:00** | **89** | **65** | **19** | **5** | **78 из 89** |
    | в пределах 5:00 | 126 | 88 | 32 | 6 | 112 из 126 |

    **89 мест в пределах трёх часов, 65 из них отмечены для [машины эконом-класса](/car-rental/economy/).**
    Кольцо в 1:30 меньше, чем у Тбилиси и Кутаиси, - 33 места против 42 и 64, - но только в нём
    есть пляжи: 5 из 33, плюс 6 заповедников и парков, 6 монастырей, 4 крепости и 7 городов. Из 33
    мест 29 открыты круглый год; 8 - места с июня по сентябрь, то есть пляжный сезон, 4 - с мая по
    октябрь.

    **Как получены эти цифры - прочитайте сначала это.** В наших записях измеренные расстояние и
    время есть только от Тбилиси. Для каждого места мы делим одно на другое: дорожное расстояние к
    расстоянию по прямой показывает, насколько петляет дорога к этому месту, а дорожное расстояние
    ко времени - какую среднюю скорость эта дорога допускает. Те же два числа применяем к прямой от
    Батуми. Это оценка по измеренной скорости дороги каждого места, **а не маршрут из навигатора**.
    Там, где между Батуми и местом лежит Аджарский хребет, реальная дорога идёт через перевал
    Годердзи, и оценка занижена: [Зарзму](/attractions/zarzma-monastery/) 1:48,
    [Абастумани](/attractions/abastumani-observatory/) 2:16 и [Рабат](/attractions/rabati-castle/)
    2:25 читайте как оптимистичные строки. Для [Тбилиси](/guides/day-trips-from-tbilisi/) мы
    используем точные поля.

    ## Двадцать поездок из Батуми на день

    Отобраны из 89 по рейтингу и разнообразию. Часы на месте - из записи.

    | Место | В пути (оценка) | На месте | Дорога | Машина | Сезон |
    |---|---|---|---|---|---|
    | [Батумский ботанический сад](/attractions/batumi-botanical-garden/) | 0:10 | 3 ч | асфальт | эконом | круглый год |
    | [Крепость Гонио-Апсарос](/attractions/gonio-fortress/) | 0:13 | 2 ч | асфальт | эконом | круглый год |
    | [Квариати](/attractions/kvariati/) | 0:17 | 4 ч | асфальт | эконом | июнь–сентябрь |
    | [Крепость Петра](/attractions/petra-fortress/) | 0:20 | 1 ч | асфальт | эконом | круглый год |
    | [Национальный парк Мачахела](/attractions/machakhela-national-park/) | 0:22 | 4 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Национальный парк Мтирала](/attractions/mtirala-national-park/) | 0:24 | 4 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Кобулети](/attractions/kobuleti/) | 0:28 | 4 ч | асфальт | эконом | июнь–сентябрь |
    | [Водопад Махунцети](/attractions/makhuntseti-waterfall/) | 0:34 | 2 ч | асфальт | эконом | круглый год |
    | [Винные погреба Кеды](/attractions/keda-wine-cellars/) | 0:39 | 3 ч | асфальт | эконом | круглый год |
    | [Уреки](/attractions/ureki/) | 0:44 | 4 ч | асфальт | эконом | июнь–сентябрь |
    | [Заповедник Кинтриши](/attractions/kintrishi-protected-areas/) | 0:46 | 4 ч | грунт | кроссовер | май–октябрь |
    | [Колхетский национальный парк](/attractions/kolkheti-national-park/) | 0:58 | 3 ч | асфальт | эконом | круглый год |
    | [Гомисмта](/attractions/gomismta/) | 1:14 | 4 ч | грунт | кроссовер | июнь–сентябрь |
    | [Дом-музей Нодара Думбадзе](/attractions/nodar-dumbadze-house-museum/) | 1:16 | 1 ч | асфальт | эконом | круглый год |
    | [Бахмаро](/attractions/bakhmaro/) | 1:56 | 6 ч | грунт | внедорожник 4x4 | июнь–сентябрь |
    | [Канатная дорога Хуло и Верхняя Аджария](/attractions/khulo-cable-car-upper-adjara/) | 1:57 | 3 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Пещера Прометея](/attractions/prometheus-cave/) | 2:09 | 2 ч | асфальт | эконом | круглый год |
    | [Монастырь Гелати](/attractions/gelati-monastery/) | 2:16 | 2 ч | асфальт | эконом | круглый год |
    | [Перевал Годердзи](/attractions/goderdzi-pass/) | 2:22 | 3 ч | грунт | внедорожник 4x4 | июнь–сентябрь |
    | [Вардзиа](/attractions/vardzia/) | 4:32 | 3 ч | асфальт | эконом | круглый год |

    ## Побережье: пять пляжей в пределах часа

    Батуми - единственный из трёх городов, где «пляж» - это категория однодневной поездки.
    [Квариати](/attractions/kvariati/) - оценочно 0:17 к югу, [Сарпи](/attractions/sarpi-beach/) -
    0:21 у границы. К северу [Кобулети](/attractions/kobuleti/) - 0:28, [Уреки](/attractions/ureki/)
    - рейтинг 5.0 - 0:44, [Григолети](/attractions/grigoleti/) - 0:48, а между ними полоса
    Шекветили: [дендрологический парк](/attractions/shekvetili-dendrological-park/) 0:45,
    [Цицинатела](/attractions/tsitsinatela-amusement-park/) и [Black Sea Arena](/attractions/shekvetili-black-sea-arena/)
    0:43. Всё это асфальт и эконом; у каждого пляжа в списке сезон с июня по сентябрь.
    [Семейный день на побережье Батуми](/routes/batumi-coast-family-day/) - 55 км, эконом, расписан
    на два лёгких дня.

    ## Крепости и сад, меньше двадцати минут

    [Ботанический сад](/attractions/batumi-botanical-garden/) в 0:10 и [Гонио-Апсарос](/attractions/gonio-fortress/)
    в 0:13 - две очевидные первые остановки: асфальт, эконом, круглый год, три и два часа на месте.
    [Крепость Петра](/attractions/petra-fortress/) в 0:20 на кобулетской дороге - более тихая третья.
    Во всей [Аджарии](/regions/adjara/) описано 24 места, и лишь 5 стоят на грунте или дороге только
    для 4x4 - все пять в высокогорной глубинке.

    ## Четыре национальных парка и заповедника

    Здесь начинаются категории «кроссовер», и начинаются близко. [Национальный парк Мачахела](/attractions/machakhela-national-park/)
    - 0:22, [Мтирала](/attractions/mtirala-national-park/) - 0:24, оба в основном асфальт, оба
    кроссовер, оба с мая по октябрь и по четыре часа на месте. [Кинтриши](/attractions/kintrishi-protected-areas/)
    в 0:46 - грунт и не круглый год. [Колхетский национальный парк](/attractions/kolkheti-national-park/)
    в 0:58 - исключение: объект ЮНЕСКО, асфальт, эконом, круглый год, рейтинг 5.0, а
    [Поти](/attractions/poti/) в 0:59 - на минуту дальше. Из 7 категорий «кроссовер» в пределах 1:30 три -
    эти парки; остальные - [Аскана](/attractions/askana-fortress/) 1:04, [Телефиси](/attractions/telefisi-fortress/)
    1:09, [Зандо](/attractions/zando-st-george-monastery/) 1:14 и [Гомисмта](/attractions/gomismta/) 1:14.

    ## Верхняя Аджария: дорога, которая поднимается

    Долина Аджарисцкали - одна дорога, и оценки растут вдоль неё. [Водопад Махунцети](/attractions/makhuntseti-waterfall/)
    0:34, [погреба Кеды](/attractions/keda-wine-cellars/) 0:39 и [мост Дандало](/attractions/dandalo-arched-bridge/)
    0:42 - асфальт и эконом. [Храм Схалта](/attractions/skhalta-monastery/) 1:47 и [канатная дорога Хуло](/attractions/khulo-cable-car-upper-adjara/)
    1:57 - в основном асфальт и кроссовер. Дальше перевал: [крепость Хихани](/attractions/khikhani-fortress/)
    2:03 - только 4x4, [Бешуми](/attractions/beshumi/) 2:17 и [перевал Годердзи](/attractions/goderdzi-pass/)
    2:22 - грунт и внедорожник, [Зелёное озеро](/attractions/green-lake-goderdzi/) 2:29 - только 4x4;
    все четыре с июня по сентябрь. Маршрут [«Вино и сёла Верхней Аджарии»](/routes/upper-adjara-wine-and-villages/)
    - четыре дня, кроссовер; до мест для 4x4 он не доходит.

    ## Гурия: час на север, и её горы

    [Гурия](/regions/guria/) заполняет полосу от 0:50 до 1:30. [Озургети](/attractions/ozurgeti/) - 0:54,
    церкви [Джумати](/attractions/jumati-monastery/), [Лихаури](/attractions/likhauri-church/) и
    [Шемокмеди](/attractions/shemokmedi-monastery/) - от 0:54 до 0:58, [Шухути](/attractions/shukhuti-lelo-burti/)
    - 0:57, [музей Нодара Думбадзе](/attractions/nodar-dumbadze-house-museum/) - рейтинг 4.7 - 1:16,
    [монастырь Самеба-Джихети](/attractions/sameba-jikheti-monastery/) - 1:19, [Чохатаури](/attractions/chokhatauri/)
    - 1:22, всё эконом. Горы - другая машина: [Гомисмта](/attractions/gomismta/) 1:14 - грунт и
    кроссовер, [Бахмаро](/attractions/bakhmaro/) 1:56 - грунт и внедорожник, оба с июня по сентябрь.
    [День на побережье Гурии](/routes/guria-coast-day/) - эконом; [горно-курортные выходные в Гурии](/routes/guria-mountain-spa-weekend/)
    отмечены внедорожником из-за Бахмаро.

    ## Два часа: Самегрело и Имеретия

    Полоса от 1:30 до 3:00 - там, где Батуми дотягивается до классики запада. [Анаклия](/attractions/anaklia/)
    1:37, [дворец Дадиани](/attractions/dadiani-palace-zugdidi/) 1:46 и [Нокалакеви](/attractions/nokalakevi/)
    1:47 в Самегрело; затем [Цхалтубо](/attractions/tskaltubo-spa-town/) 2:00, [Баграти](/attractions/bagrati-cathedral/)
    2:01, [пещера Прометея](/attractions/prometheus-cave/) 2:09, [каньон Окаце](/attractions/okatse-canyon/)
    2:13, [Гелати](/attractions/gelati-monastery/) 2:16 и [Мартвильский каньон](/attractions/martvili-canyon/)
    2:44. Всё эконом, как и 39 из 56 мест этой полосы. [День монастырей и пещер Кутаиси](/routes/kutaisi-monasteries-caves-day/)
    закрывает имеретинский кластер, когда вы уже там; остальное - в нашем
    [путеводителе по Кутаиси](/guides/day-trips-from-kutaisi/).

    ## От трёх до пяти часов: это не день

    37 мест лежат между 3:00 и 5:00, 23 из них эконом. [Столп Кацхи](/attractions/katskhi-pillar/)
    3:03, [Гори](/attractions/gori-fortress-stalin-museum/) 3:39, [Никорцминда](/attractions/nikortsminda-cathedral/)
    4:25 и [Вардзиа](/attractions/vardzia/) 4:32 - всё асфальт, но каждое - больше шести часов за
    рулём ради одной остановки. Пятидневная [«Зелёная дорога Аджарии и Гурии»](/routes/adjara-guria-green-road/)
    - честный способ добраться до этой полосы из Батуми.

    ## Какую машину брать и с чего начать

    - **65 из 89 мест в пределах трёх часов** - эконом. [Машина эконом-класса в Батуми](/car-rental/batumi/)
      закрывает все пляжи, Гонио, ботанический сад, Махунцети, Кеду, низины Гурии и Кутаиси.
    - **19 требуют [кроссовер](/car-rental/suv/)**: Мтирала, Мачахела, Кинтриши, Схалта, Хуло и
      Гомисмта - те, что имеют значение.
    - **5 требуют [внедорожник 4x4](/car-rental/4x4/)**: Бахмаро, Хихани, Бешуми, Годердзи и Зелёное
      озеро - все с июня по сентябрь.

    75 из 89 открыты круглый год; у 58 всесезонный доступ, 17 - с мая по октябрь, 14 - с июня по
    сентябрь. [Планировщик поездки на день](/day-trip/) считает ту же оценку для любой точки старта;
    на вопрос о категории отвечает страница
    [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "Это время от Батуми измерено или оценено?"
    a: "Оценено. В наших записях измеренные расстояние и время есть только от Тбилиси. Для каждого места из этих измерений мы выводим, насколько петляет его дорога и какую среднюю скорость она допускает, и применяем оба числа к прямой от Батуми. Это не маршрут навигатора, и там, где между Батуми и местом лежит Аджарский хребет, оценка занижена."
  - q: "Какие пляжи - однодневная поездка из Батуми?"
    a: "Квариати - оценочно 0:17, Сарпи - 0:21, Кобулети - 0:28, Уреки - 0:44, Григолети - 0:48. Все пять - асфальт и эконом, и у всех пяти в нашей базе сезон с июня по сентябрь."
  - q: "Нужен ли кроссовер для Мтиралы и Мачахелы?"
    a: "Оба национальных парка отмечены в нашей базе кроссовером: в основном асфальт, с мая по октябрь, четыре часа на месте, оценочно 0:24 и 0:22 от Батуми. Кинтриши в 0:46 - грунт и тоже кроссовер. Колхетский национальный парк в 0:58 - асфальт и эконом."
  - q: "Какие поездки из Батуми требуют внедорожника?"
    a: "Пять мест в пределах трёх часов отмечены как внедорожные: Бахмаро, крепость Хихани, Бешуми, перевал Годердзи и Зелёное озеро. Все пять - места с июня по сентябрь в высокогорной глубинке Аджарии и Гурии."
  - q: "Кутаиси - это однодневная поездка из Батуми?"
    a: "Кутаисский кластер - оценочно от 2:00 до 2:16 в одну сторону: Цхалтубо 2:00, Баграти 2:01, пещера Прометея 2:09, Окаце 2:13, Гелати 2:16. Всё асфальт и эконом. Это долгий день; наш путеводитель по Кутаиси написан для тех, кто остаётся."
  - q: "Как далеко от Батуми Вардзиа?"
    a: "Наша оценка - 4:32 в одну сторону по асфальту, эконом, но прямая пересекает Аджарский хребет, так что дорога длиннее оценки. Планируйте с ночёвкой, а не за день."

fa:
  name: "سفر یک‌روزه از باتومی با خودرو: 89 مکان در سه ساعت"
  answer: >-
    از باتومی، 89 مکان از 261 مکانی که RentUp بیرون شهر ثبت کرده در حدود سه ساعت رانندگی یک‌طرفه
    قرار دارند، 65 مورد از آن‌ها برای خودروی اقتصادی رتبه‌بندی شده؛ 33 مورد در حدود 1:30 و 126 مورد
    در 5:00. ساحل‌ها نزدیک‌ترین‌اند: کواریاتی 0:17، سارپی 0:21، کوبولتی 0:28، اورکی 0:44. پارک‌های
    ملی متیرالا و ماچاخلا (0:24 و 0:22) ردهٔ شاسی‌بلند دارند. پنج مکان در سه ساعت آفرود 4x4
    می‌خواهند: باخمارو، خیخانی، بشومی، گردنهٔ گودردزی و دریاچهٔ سبز. زمان‌ها تخمینی از سرعت
    اندازه‌گیری‌شدهٔ جادّهٔ هر مکان‌اند، نه مسیریابی.
  short: "زمان رانندگی از باتومی تا 261 مکان بیرون از شهر را از سرعت اندازه‌گیری‌شدهٔ جادّهٔ هر مکان تخمین می‌زنیم. 33 مکان در حدود 1:30، 89 مکان در 3:00، و 65 مورد از این 89 فقط خودروی اقتصادی می‌خواهند."
  meta_title: "سفر یک‌روزه از باتومی با خودرو: 89 مکان | RentUp"
  meta_description: "33 مکان در حدود 1:30 از باتومی، 89 مکان در 3:00 و 126 مکان در 5:00. زمان رانندگی از سرعت اندازه‌گیری‌شدهٔ جادّهٔ هر مکان تخمین زده شده، با ردهٔ خودرو."
  body: |
    ## یک روز از باتومی تا کجا می‌رسد

    باتومی در یک گوشه نشسته است: دریا در غرب، مرز ترکیه در 0:21 به جنوب، و کوه‌های آجارا پشت سر.
    در 1 سپتامبر 2026 هر 267 مکان پایگاه داده را بر اساس زمان تخمینی رانندگی از شهر مرتب کردیم. شش
    مورد داخل خود باتومی است، پس **261 مکان بیرون از شهر** می‌ماند.

    | زمان یک‌طرفه (تخمینی) | مکان | اقتصادی | شاسی‌بلند | آفرود 4x4 | آسفالت یا تقریباً آسفالت |
    |---|---|---|---|---|---|
    | تا حدود 1:30 | 33 | 26 | 7 | 0 | 31 از 33 |
    | 1:30 تا 3:00 | 56 | 39 | 12 | 5 | 47 از 56 |
    | 3:00 تا 5:00 | 37 | 23 | 13 | 1 | 34 از 37 |
    | **در 3:00** | **89** | **65** | **19** | **5** | **78 از 89** |
    | در 5:00 | 126 | 88 | 32 | 6 | 112 از 126 |

    **89 مکان در سه ساعت، که 65 مورد از آن‌ها برای [خودروی اقتصادی](/car-rental/economy/) ثبت شده
    است.** حلقهٔ 1:30 تنها حلقه‌ای است که در آن ساحل هست: 5 مورد از 33، به‌علاوهٔ 6 پارک، 6 صومعه و 4 دژ.
    از 33 مورد، 29 مورد در تمام سال باز است.

    **این زمان‌ها چگونه ساخته می‌شوند؛ اول این را بخوانید.** رکوردهای ما فقط فاصله و زمان
    اندازه‌گیری‌شده از تفلیس را دارند. برای هر مکان این دو را تقسیم می‌کنیم: فاصلهٔ جاده‌ای بر
    فاصلهٔ مستقیم می‌گوید جادّهٔ آن مکان چقدر پیچ‌درپیچ است، و فاصلهٔ جاده‌ای بر زمان می‌گوید آن
    جاده چه سرعت متوسطی را اجازه می‌دهد. همین دو عدد را روی خط مستقیم از باتومی به کار می‌بریم.
    این تخمینی است از سرعت اندازه‌گیری‌شدهٔ جادّهٔ خود هر مکان، **نه مسیریابی**. هرجا رشته‌کوه
    آجارا میان باتومی و مکان باشد، جادّهٔ واقعی از گردنهٔ گودردزی می‌گذرد و تخمین کم می‌آید؛
    [زارزما](/attractions/zarzma-monastery/) 1:48، [آباستومانی](/attractions/abastumani-observatory/) 2:16
    و [راباتی](/attractions/rabati-castle/) 2:25 را ردیف‌های خوش‌بینانه بدانید. برای
    [تفلیس](/guides/day-trips-from-tbilisi/) از فیلدهای دقیق استفاده می‌کنیم.

    ## بیست سفر یک‌روزه از باتومی

    | مکان | رانندگی (تخمینی) | در محل | جاده | خودرو | فصل |
    |---|---|---|---|---|---|
    | [باغ گیاه‌شناسی باتومی](/attractions/batumi-botanical-garden/) | 0:10 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [دژ گونیو-آپساروس](/attractions/gonio-fortress/) | 0:13 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [کواریاتی](/attractions/kvariati/) | 0:17 | 4 ساعت | آسفالت | اقتصادی | ژوئن تا سپتامبر |
    | [دژ پترا](/attractions/petra-fortress/) | 0:20 | 1 ساعت | آسفالت | اقتصادی | تمام سال |
    | [پارک ملی ماچاخلا](/attractions/machakhela-national-park/) | 0:22 | 4 ساعت | عمدتاً آسفالت | شاسی‌بلند | مه تا اکتبر |
    | [پارک ملی متیرالا](/attractions/mtirala-national-park/) | 0:24 | 4 ساعت | عمدتاً آسفالت | شاسی‌بلند | مه تا اکتبر |
    | [کوبولتی](/attractions/kobuleti/) | 0:28 | 4 ساعت | آسفالت | اقتصادی | ژوئن تا سپتامبر |
    | [آبشار ماخونتستی](/attractions/makhuntseti-waterfall/) | 0:34 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [سردابه‌های شراب کدا](/attractions/keda-wine-cellars/) | 0:39 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [اورکی](/attractions/ureki/) | 0:44 | 4 ساعت | آسفالت | اقتصادی | ژوئن تا سپتامبر |
    | [مناطق حفاظت‌شدهٔ کینتریشی](/attractions/kintrishi-protected-areas/) | 0:46 | 4 ساعت | خاکی | شاسی‌بلند | مه تا اکتبر |
    | [پارک ملی کولخِتی](/attractions/kolkheti-national-park/) | 0:58 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [گومیسمتا](/attractions/gomismta/) | 1:14 | 4 ساعت | خاکی | شاسی‌بلند | ژوئن تا سپتامبر |
    | [خانه‌موزهٔ نودار دومبادزه](/attractions/nodar-dumbadze-house-museum/) | 1:16 | 1 ساعت | آسفالت | اقتصادی | تمام سال |
    | [باخمارو](/attractions/bakhmaro/) | 1:56 | 6 ساعت | خاکی | آفرود 4x4 | ژوئن تا سپتامبر |
    | [تله‌کابین خولو و آجارای علیا](/attractions/khulo-cable-car-upper-adjara/) | 1:57 | 3 ساعت | عمدتاً آسفالت | شاسی‌بلند | مه تا اکتبر |
    | [غار پرومتئوس](/attractions/prometheus-cave/) | 2:09 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [صومعهٔ گلاتی](/attractions/gelati-monastery/) | 2:16 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [گردنهٔ گودردزی](/attractions/goderdzi-pass/) | 2:22 | 3 ساعت | خاکی | آفرود 4x4 | ژوئن تا سپتامبر |
    | [واردزیا](/attractions/vardzia/) | 4:32 | 3 ساعت | آسفالت | اقتصادی | تمام سال |

    ## ساحل: پنج ساحل در یک ساعت

    [کواریاتی](/attractions/kvariati/)
    با تخمین 0:17 در جنوب، [سارپی](/attractions/sarpi-beach/) 0:21 در مرز. در شمال [کوبولتی](/attractions/kobuleti/)
    0:28 و [اورکی](/attractions/ureki/) با امتیاز 5.0 در 0:44. همه آسفالت و اقتصادی؛ هر ساحل این
    فهرست فصل ژوئن تا سپتامبر دارد. [روز خانوادگی ساحل باتومی](/routes/batumi-coast-family-day/)
    55 کیلومتر و اقتصادی است.

    ## دژها و باغ، زیر بیست دقیقه

    [باغ گیاه‌شناسی](/attractions/batumi-botanical-garden/) در 0:10 و [گونیو-آپساروس](/attractions/gonio-fortress/)
    در 0:13 دو توقف اول بدیهی‌اند: آسفالت، اقتصادی، تمام سال، سه و دو ساعت در محل. [دژ پترا](/attractions/petra-fortress/)
    در 0:20 سومیِ آرام‌تر است. در کل [آجارا](/regions/adjara/) تنها 5 مکان روی جادّهٔ خاکی یا فقط 4x4 است.

    ## چهار پارک ملی و ذخیره‌گاه

    اینجاست که ردهٔ شاسی‌بلند آغاز می‌شود و نزدیک آغاز می‌شود. [پارک ملی ماچاخلا](/attractions/machakhela-national-park/)
    0:22 و [متیرالا](/attractions/mtirala-national-park/) 0:24، هر دو عمدتاً آسفالت، هر دو شاسی‌بلند،
    هر دو مه تا اکتبر با چهار ساعت در محل. [پارک ملی کولخِتی](/attractions/kolkheti-national-park/) در 0:58 استثناست: اثر یونسکو،
    آسفالت، اقتصادی، تمام سال، امتیاز 5.0.

    ## آجارای علیا: جاده‌ای که بالا می‌رود

    [آبشار ماخونتستی](/attractions/makhuntseti-waterfall/) 0:34، [سردابه‌های کدا](/attractions/keda-wine-cellars/)
    0:39 آسفالت و اقتصادی‌اند. [کلیسای سخالتا](/attractions/skhalta-monastery/)
    1:47 و [تله‌کابین خولو](/attractions/khulo-cable-car-upper-adjara/) 1:57 عمدتاً آسفالت و شاسی‌بلند.
    سپس گردنه: [قلعهٔ خیخانی](/attractions/khikhani-fortress/) 2:03 فقط 4x4، [بشومی](/attractions/beshumi/)
    2:17 و [گردنهٔ گودردزی](/attractions/goderdzi-pass/) 2:22 خاکی و آفرود، [دریاچهٔ سبز](/attractions/green-lake-goderdzi/)
    2:29 فقط 4x4؛ هر چهار ژوئن تا سپتامبر.

    ## گوریا: یک ساعت به شمال، و کوه‌هایش

    [گوریا](/regions/guria/) نوار 0:50 تا 1:30 را پر می‌کند. [اوزورگتی](/attractions/ozurgeti/) 0:54،
    [خانه‌موزهٔ نودار دومبادزه](/attractions/nodar-dumbadze-house-museum/) با امتیاز 4.7 در 1:16، همه اقتصادی. کوه‌ها خودروی دیگری می‌خواهند: [گومیسمتا](/attractions/gomismta/) 1:14 خاکی و
    شاسی‌بلند، [باخمارو](/attractions/bakhmaro/) 1:56 خاکی و آفرود، هر دو ژوئن تا سپتامبر.
    [روز ساحل گوریا](/routes/guria-coast-day/) اقتصادی است.

    ## سه تا پنج ساعت: سفر یک‌روزه نیست

    خوشهٔ کوتایسی ([غار پرومتئوس](/attractions/prometheus-cave/) 2:09، [گلاتی](/attractions/gelati-monastery/) 2:16) در [راهنمای کوتایسی](/guides/day-trips-from-kutaisi/) ماست. 37 مکان بین 3:00 و 5:00 است، 23 مورد اقتصادی. [گوری](/attractions/gori-fortress-stalin-museum/) 3:39
    و [واردزیا](/attractions/vardzia/) 4:32 آسفالت‌اند، اما هر یک بیش از شش ساعت رانندگی برای یک توقف
    است. [جادّهٔ سبز آجارا و گوریا](/routes/adjara-guria-green-road/) پنج‌روزه راه صادقانهٔ رسیدن به این نوار است.

    ## کدام خودرو

    - **65 مورد از 89 مکان زیر سه ساعت** اقتصادی است: [خودروی اقتصادی در باتومی](/car-rental/batumi/) کافی است.
    - **19 مورد [شاسی‌بلند](/car-rental/suv/) می‌خواهد**: متیرالا، ماچاخلا، کینتریشی، سخالتا، خولو و گومیسمتا.
    - **5 مورد [آفرود 4x4](/car-rental/4x4/) می‌خواهد**: باخمارو، خیخانی، بشومی، گودردزی و دریاچهٔ سبز؛ همه ژوئن تا سپتامبر.

    از این 89 مکان 75 مورد در تمام سال باز است. [یابندهٔ سفر یک‌روزه](/day-trip/) همین تخمین را برای
    هر نقطهٔ شروع زنده حساب می‌کند؛ پرسش ردهٔ خودرو را
    [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/) پاسخ می‌دهد.
  faq:
  - q: "این زمان‌ها از باتومی اندازه‌گیری‌شده‌اند یا تخمینی؟"
    a: "تخمینی. رکوردهای ما فقط فاصله و زمان اندازه‌گیری‌شده از تفلیس را دارند. برای هر مکان از همان اندازه‌گیری‌ها پیچ‌وخم جاده و سرعت متوسط آن را می‌گیریم و روی خط مستقیم از باتومی به کار می‌بریم. مسیریابی نیست و هرجا رشته‌کوه آجارا میان باتومی و مکان باشد، تخمین کم می‌آید."
  - q: "کدام سواحل سفر یک‌روزه از باتومی‌اند؟"
    a: "کواریاتی با تخمین 0:17، سارپی 0:21، کوبولتی 0:28، اورکی 0:44 و گریگولتی 0:48. هر پنج آسفالت و اقتصادی‌اند و هر پنج در داده‌های ما فصل ژوئن تا سپتامبر دارند."
  - q: "برای متیرالا یا ماچاخلا شاسی‌بلند لازم است؟"
    a: "هر دو پارک ملی در داده‌های ما ردهٔ شاسی‌بلند دارند: عمدتاً آسفالت، مه تا اکتبر، چهار ساعت در محل، با تخمین 0:24 و 0:22 از باتومی. کینتریشی در 0:46 خاکی و باز هم شاسی‌بلند است. پارک ملی کولخِتی در 0:58 آسفالت و اقتصادی است."
  - q: "کدام سفرها از باتومی 4x4 می‌خواهند؟"
    a: "پنج مکان زیر سه ساعت آفرود است: باخمارو، قلعهٔ خیخانی، بشومی، گردنهٔ گودردزی و دریاچهٔ سبز. هر پنج مکان ژوئن تا سپتامبر در بخش مرتفع داخلی آجارا و گوریاست."
  - q: "آیا کوتایسی سفر یک‌روزه از باتومی است؟"
    a: "خوشهٔ کوتایسی با تخمین 2:00 تا 2:16 یک‌طرفه است: تسکالتوبو 2:00، غار پرومتئوس 2:09، اوکاتسه 2:13، گلاتی 2:16. همه آسفالت و اقتصادی. روز بلندی است؛ راهنمای کوتایسی ما برای کسانی است که می‌مانند."

he:
  name: "טיולי יום מבטומי ברכב: 89 מקומות בטווח שלוש שעות"
  answer: >-
    מבטומי, 89 מתוך 261 המקומות ש-RentUp ממפה מחוץ לעיר נמצאים בטווח של כשלוש שעות נסיעה לכיוון אחד,
    65 מהם מדורגים לרכב אקונומי; 33 בטווח של כ-1:30 ו-126 בטווח 5:00. החופים הם הקרובים ביותר:
    קווריאתי 0:17, סארפי 0:21, קובולטי 0:28, אורקי 0:44. הפארקים הלאומיים מטירלה ומאצ׳אחלה (0:24
    ו-0:22) מדורגים לרכב שטח עירוני. חמישה מקומות בטווח שלוש שעות דורשים רכב שטח 4x4: בחמארו,
    חיחאני, בשומי, מעבר גודרדזי והאגם הירוק. הזמנים הם הערכות ממהירות הדרך המדודה של כל מקום, לא
    ניווט.
  short: "את זמן הנסיעה מבטומי ל-261 המקומות שמחוץ לעיר אנחנו מעריכים לפי מהירות הדרך הנמדדת של כל מקום. 33 בטווח של כ-1:30, 89 בטווח 3:00, ו-65 מתוך ה-89 צריכים רק רכב אקונומי."
  meta_title: "טיולי יום מבטומי ברכב: 89 מקומות | RentUp"
  meta_description: "33 מקומות בטווח של כ-1:30 מבטומי, 89 בטווח 3:00, 126 בטווח 5:00. זמן נסיעה מוערך לפי מהירות הדרך הנמדדת של כל מקום, עם סוג הדרך והרכב שכל מקום דורש."
  body: |
    ## עד כמה רחוק מגיע יום אחד מבטומי

    בטומי יושבת בפינה: ים ממערב, גבול טורקיה 0:21 דרומה, והרי אג'ריה מאחור. ב-1 בספטמבר 2026
    מיינו את כל 267 המקומות במאגר לפי זמן נסיעה מוערך מהעיר. שישה נמצאים בבטומי עצמה, ונשארים
    **261 מקומות מחוץ לעיר**.

    | זמן לכיוון אחד (הערכה) | מקומות | אקונומי | רכב שטח עירוני | 4x4 שטח | סלול או סלול ברובו |
    |---|---|---|---|---|---|
    | עד כ-1:30 | 33 | 26 | 7 | 0 | 31 מתוך 33 |
    | 1:30 עד 3:00 | 56 | 39 | 12 | 5 | 47 מתוך 56 |
    | 3:00 עד 5:00 | 37 | 23 | 13 | 1 | 34 מתוך 37 |
    | **בטווח 3:00** | **89** | **65** | **19** | **5** | **78 מתוך 89** |
    | בטווח 5:00 | 126 | 88 | 32 | 6 | 112 מתוך 126 |

    **89 מקומות בטווח שלוש שעות, 65 מהם מסווגים ל[רכב אקונומי](/car-rental/economy/).** טבעת
    ה-1:30 היא היחידה שיש בה חופים: 5 מתוך 33, ועוד 6 פארקים ושמורות, 6 מנזרים ו-4 מבצרים. מתוך 33,
    29 פתוחים כל השנה.

    **איך נבנים הזמנים - קראו קודם.** הרשומות שלנו נושאות מרחק וזמן נמדדים מטביליסי בלבד. לכל מקום
    אנחנו מחלקים את השניים: מרחק הדרך חלקי המרחק בקו אוויר אומר כמה הדרך אליו מתפתלת, ומרחק הדרך
    חלקי הזמן אומר איזו מהירות ממוצעת הדרך מאפשרת. את שני המספרים אנחנו מחילים על הקו הישר
    מבטומי. זו הערכה ממהירות הדרך הנמדדת של כל מקום, **לא ניווט**. במקום שרכס אג'ריה מפריד בין
    בטומי למקום, הדרך האמיתית עוברת במעבר גודרדזי וההערכה קצרה מדי - את [זרזמה](/attractions/zarzma-monastery/)
    1:48, [אבסתומני](/attractions/abastumani-observatory/) 2:16 ו[רבאטי](/attractions/rabati-castle/) 2:25
    קראו כשורות אופטימיות. ל[טביליסי](/guides/day-trips-from-tbilisi/) אנחנו משתמשים בשדות המדויקים.

    ## עשרים טיולי יום מבטומי

    | מקום | נסיעה (הערכה) | במקום | דרך | רכב | עונה |
    |---|---|---|---|---|---|
    | [הגן הבוטני של בטומי](/attractions/batumi-botanical-garden/) | 0:10 | 3 שע' | סלול | אקונומי | כל השנה |
    | [מבצר גוניו-אפסארוס](/attractions/gonio-fortress/) | 0:13 | 2 שע' | סלול | אקונומי | כל השנה |
    | [קווריאתי](/attractions/kvariati/) | 0:17 | 4 שע' | סלול | אקונומי | יוני עד ספטמבר |
    | [מבצר פטרה](/attractions/petra-fortress/) | 0:20 | 1 שע' | סלול | אקונומי | כל השנה |
    | [הפארק הלאומי מאצ׳אחלה](/attractions/machakhela-national-park/) | 0:22 | 4 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [הפארק הלאומי מטירלה](/attractions/mtirala-national-park/) | 0:24 | 4 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [קובולטי](/attractions/kobuleti/) | 0:28 | 4 שע' | סלול | אקונומי | יוני עד ספטמבר |
    | [מפל מאחונצטי](/attractions/makhuntseti-waterfall/) | 0:34 | 2 שע' | סלול | אקונומי | כל השנה |
    | [מרתפי היין של קדה](/attractions/keda-wine-cellars/) | 0:39 | 3 שע' | סלול | אקונומי | כל השנה |
    | [אורקי](/attractions/ureki/) | 0:44 | 4 שע' | סלול | אקונומי | יוני עד ספטמבר |
    | [שמורות קינטרישי](/attractions/kintrishi-protected-areas/) | 0:46 | 4 שע' | עפר | רכב שטח עירוני | מאי עד אוקטובר |
    | [הפארק הלאומי קולחתי](/attractions/kolkheti-national-park/) | 0:58 | 3 שע' | סלול | אקונומי | כל השנה |
    | [גומיסמטה](/attractions/gomismta/) | 1:14 | 4 שע' | עפר | רכב שטח עירוני | יוני עד ספטמבר |
    | [בית-מוזיאון נודר דומבדזה](/attractions/nodar-dumbadze-house-museum/) | 1:16 | 1 שע' | סלול | אקונומי | כל השנה |
    | [בחמארו](/attractions/bakhmaro/) | 1:56 | 6 שע' | עפר | 4x4 שטח | יוני עד ספטמבר |
    | [הרכבל של חולו ואג'ריה העילית](/attractions/khulo-cable-car-upper-adjara/) | 1:57 | 3 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [מערת פרומתאוס](/attractions/prometheus-cave/) | 2:09 | 2 שע' | סלול | אקונומי | כל השנה |
    | [מנזר גלאטי](/attractions/gelati-monastery/) | 2:16 | 2 שע' | סלול | אקונומי | כל השנה |
    | [מעבר גודרדזי](/attractions/goderdzi-pass/) | 2:22 | 3 שע' | עפר | 4x4 שטח | יוני עד ספטמבר |
    | [ורדזיה](/attractions/vardzia/) | 4:32 | 3 שע' | סלול | אקונומי | כל השנה |

    ## החוף: חמישה חופים בטווח שעה

    בטומי היא היחידה משלוש הערים שבה "חוף" הוא קטגוריה של טיול יום. [קווריאתי](/attractions/kvariati/)
    היא הערכה של 0:17 דרומה, [סארפי](/attractions/sarpi-beach/) 0:21 בגבול. צפונה, [קובולטי](/attractions/kobuleti/)
    0:28, [אורקי](/attractions/ureki/) - דירוג 5.0 - 0:44, [גריגולטי](/attractions/grigoleti/) 0:48, וביניהם
    רצועת שקווטילי: [הפארק הדנדרולוגי](/attractions/shekvetili-dendrological-park/) 0:45 ו[ארנת הים השחור](/attractions/shekvetili-black-sea-arena/)
    0:43. הכול סלול ואקונומי; לכל חוף ברשימה עונה של יוני עד ספטמבר. [יום החוף המשפחתי של בטומי](/routes/batumi-coast-family-day/)
    הוא 55 ק"מ, אקונומי.

    ## מבצרים והגן, מתחת לעשרים דקות

    [הגן הבוטני](/attractions/batumi-botanical-garden/) ב-0:10 ו[גוניו-אפסארוס](/attractions/gonio-fortress/)
    ב-0:13 הם שתי העצירות הראשונות המובנות מאליהן: סלול, אקונומי, כל השנה, שלוש ושתי שעות במקום.
    [מבצר פטרה](/attractions/petra-fortress/) ב-0:20 הוא השלישי השקט יותר. ב[אג'ריה](/regions/adjara/)
    כולה רק 5 מקומות על עפר או דרך 4x4 בלבד.

    ## ארבעה פארקים לאומיים ושמורות

    כאן מתחילים סיווגי רכב השטח העירוני, והם מתחילים קרוב. [הפארק הלאומי מאצ׳אחלה](/attractions/machakhela-national-park/)
    0:22 ו[מטירלה](/attractions/mtirala-national-park/) 0:24, שניהם סלולים ברובם, שניהם רכב שטח עירוני,
    שניהם מאי עד אוקטובר עם ארבע שעות במקום. [קינטרישי](/attractions/kintrishi-protected-areas/) ב-0:46
    היא עפר. [הפארק הלאומי קולחתי](/attractions/kolkheti-national-park/) ב-0:58 הוא היוצא מן הכלל: אתר
    אונסק"ו, סלול, אקונומי, כל השנה, דירוג 5.0.

    ## אג'ריה העילית: הדרך שמטפסת

    [מפל מאחונצטי](/attractions/makhuntseti-waterfall/) 0:34, [מרתפי קדה](/attractions/keda-wine-cellars/) 0:39 סלולים ואקונומי. [קתדרלת סחאלטה](/attractions/skhalta-monastery/)
    1:47 ו[הרכבל של חולו](/attractions/khulo-cable-car-upper-adjara/) 1:57 סלולים ברובם ורכב שטח עירוני.
    ואז המעבר: [מבצר חיחאני](/attractions/khikhani-fortress/) 2:03 הוא 4x4 בלבד, [בשומי](/attractions/beshumi/)
    2:17 ו[מעבר גודרדזי](/attractions/goderdzi-pass/) 2:22 עפר ושטח, [האגם הירוק](/attractions/green-lake-goderdzi/)
    2:29 4x4 בלבד - כל הארבעה יוני עד ספטמבר. מסלול [היין והכפרים של אג'ריה העילית](/routes/upper-adjara-wine-and-villages/)
    הוא ארבעה ימים, רכב שטח עירוני.

    ## גוריה: שעה צפונה, וההרים שלה

    [גוריה](/regions/guria/) ממלאת את הרצועה 0:50 עד 1:30. [אוזורגטי](/attractions/ozurgeti/) 0:54,
    [בית-מוזיאון נודר דומבדזה](/attractions/nodar-dumbadze-house-museum/) - דירוג 4.7 - 1:16, כולם אקונומי. ההרים הם רכב אחר: [גומיסמטה](/attractions/gomismta/) 1:14 עפר ורכב שטח עירוני,
    [בחמארו](/attractions/bakhmaro/) 1:56 עפר ושטח, שניהם יוני עד ספטמבר. [יום חוף גוריה](/routes/guria-coast-day/)
    הוא אקונומי.

    ## שעתיים: סמגרלו ואימרתי

    [ארמון דדיאני](/attractions/dadiani-palace-zugdidi/) 1:46 בסמגרלו; ואז [צחלטובו](/attractions/tskaltubo-spa-town/) 2:00,
    [מערת פרומתאוס](/attractions/prometheus-cave/) 2:09, [קניון אוקאצה](/attractions/okatse-canyon/) 2:13,
    [גלאטי](/attractions/gelati-monastery/) 2:16 ו[קניון מרטווילי](/attractions/martvili-canyon/) 2:44. הכול
    אקונומי, כמו 39 מתוך 56 המקומות ברצועה הזאת. השאר ב[מדריך קוטאיסי](/guides/day-trips-from-kutaisi/) שלנו.

    ## שלוש עד חמש שעות: לא טיול יום

    37 מקומות יושבים בין 3:00 ל-5:00, 23 מהם אקונומי. [גורי](/attractions/gori-fortress-stalin-museum/) 3:39
    ו[ורדזיה](/attractions/vardzia/) 4:32 סלולים, אבל כל אחד הוא יותר משש שעות נהיגה בשביל עצירה אחת.
    [הדרך הירוקה של אג'ריה וגוריה](/routes/adjara-guria-green-road/) בת חמשת הימים היא הדרך הכנה להגיע לרצועה הזאת.

    ## איזה רכב

    - **65 מתוך 89 המקומות בטווח שלוש שעות** הם אקונומי: [רכב אקונומי בבטומי](/car-rental/batumi/) מספיק.
    - **19 דורשים [רכב שטח עירוני](/car-rental/suv/)**: מטירלה, מאצ׳אחלה, קינטרישי, סחאלטה, חולו וגומיסמטה.
    - **5 דורשים [4x4 שטח](/car-rental/4x4/)**: בחמארו, חיחאני, בשומי, גודרדזי והאגם הירוק - כולם יוני עד ספטמבר.

    75 מתוך 89 פתוחים כל השנה. [מאתר טיולי היום](/day-trip/) מחשב את אותה הערכה חי מכל נקודת
    התחלה; לשאלת הקטגוריה עונה [האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "האם זמני הנסיעה מבטומי נמדדו או הוערכו?"
    a: "הוערכו. הרשומות שלנו מחזיקות מרחק וזמן נמדדים מטביליסי בלבד. לכל מקום אנחנו גוזרים מהמדידות האלה כמה הדרך אליו מתפתלת ואיזו מהירות ממוצעת היא מאפשרת, ומחילים את שניהם על הקו הישר מבטומי. זה לא ניווט, ובמקום שרכס אג'ריה מפריד בין בטומי למקום ההערכה קצרה מדי."
  - q: "אילו חופים הם טיול יום מבטומי?"
    a: "קווריאתי היא הערכה של 0:17, סארפי 0:21, קובולטי 0:28, אורקי 0:44 וגריגולטי 0:48. כל החמישה סלולים ואקונומי, ולכל החמישה עונה של יוני עד ספטמבר בנתונים שלנו."
  - q: "צריך רכב שטח עירוני למטירלה או למאצ׳אחלה?"
    a: "שני הפארקים הלאומיים מסווגים רכב שטח עירוני בנתונים שלנו: דרכים סלולות ברובן, מאי עד אוקטובר, ארבע שעות במקום, הערכה של 0:24 ו-0:22 מבטומי. קינטרישי ב-0:46 היא עפר וגם רכב שטח עירוני. הפארק הלאומי קולחתי ב-0:58 סלול ואקונומי."
  - q: "אילו טיולים מבטומי דורשים 4x4?"
    a: "חמישה מקומות בטווח שלוש שעות מסווגים שטח: בחמארו, מבצר חיחאני, בשומי, מעבר גודרדזי והאגם הירוק. כל החמישה הם מקומות של יוני עד ספטמבר בפנים הגבוה של אג'ריה וגוריה."
  - q: "האם קוטאיסי היא טיול יום מבטומי?"
    a: "אשכול קוטאיסי הוא הערכה של 2:00 עד 2:16 לכיוון אחד: צחלטובו 2:00, מערת פרומתאוס 2:09, אוקאצה 2:13, גלאטי 2:16. הכול סלול ואקונומי. זה יום ארוך; מדריך קוטאיסי שלנו נכתב למי שנשאר."

ar:
  name: "رحلات يوم واحد من باتومي بالسيارة: 89 مكاناً في ثلاث ساعات"
  answer: >-
    من باتومي، 89 من الأماكن الـ261 التي ترسمها RentUp خارج المدينة تقع ضمن نحو ثلاث ساعات قيادة
    باتجاه واحد، 65 منها مصنّفة لسيارة اقتصادية؛ 33 ضمن نحو 1:30 و126 ضمن 5:00. الشواطئ هي الأقرب:
    كفارياتي 0:17، وسربي 0:21، وكوبوليتي 0:28، وأوريكي 0:44. منتزها متيرالا وماتشاخيلا الوطنيان
    (0:24 و0:22) مصنّفان لدفع رباعي خفيف. خمسة أماكن ضمن ثلاث ساعات تحتاج إلى دفع رباعي وعر 4x4:
    باخمارو وخيخاني وبيشومي وممر غودردزي والبحيرة الخضراء. الأزمنة تقديرات من سرعة الطريق المقيسة
    لكل مكان، لا اتجاهات مرسومة.
  short: "نقدّر زمن القيادة من باتومي إلى الأماكن الـ261 خارج المدينة من سرعة الطريق المقاسة لكل مكان. 33 منها في نحو 1:30، و89 في 3:00، و65 من هذه الـ89 لا تحتاج إلا سيارة اقتصادية."
  meta_title: "رحلات يوم واحد من باتومي بالسيارة: 89 مكاناً | RentUp"
  meta_description: "33 مكاناً في نحو 1:30 من باتومي، و89 في 3:00، و126 في 5:00. زمن القيادة مقدّر من سرعة الطريق المقاسة لكل مكان، مع سطح الطريق وفئة السيارة اللازمة."
  body: |
    ## إلى أي مدى يصل يوم واحد من باتومي

    باتومي تجلس في زاوية: البحر غرباً، والحدود التركية على 0:21 جنوباً، وجبال أدجارا خلفها. في 1
    سبتمبر 2026 رتّبنا الأماكن الـ267 في قاعدة بياناتنا بحسب زمن القيادة المقدّر من المدينة. ستة
    منها في باتومي نفسها، فيبقى **261 مكاناً خارج المدينة**.

    | الزمن في اتجاه واحد (تقدير) | الأماكن | اقتصادية | دفع رباعي خفيف | دفع رباعي 4x4 | معبّد أو شبه معبّد |
    |---|---|---|---|---|---|
    | حتى نحو 1:30 | 33 | 26 | 7 | 0 | 31 من 33 |
    | من 1:30 إلى 3:00 | 56 | 39 | 12 | 5 | 47 من 56 |
    | من 3:00 إلى 5:00 | 37 | 23 | 13 | 1 | 34 من 37 |
    | **ضمن 3:00** | **89** | **65** | **19** | **5** | **78 من 89** |
    | ضمن 5:00 | 126 | 88 | 32 | 6 | 112 من 126 |

    **89 مكاناً ضمن ثلاث ساعات، 65 منها مصنّفة لـ[سيارة اقتصادية](/car-rental/economy/).** حلقة
    الـ1:30 أصغر من حلقتي تبليسي وكوتايسي، 33 مكاناً مقابل 42 و64، لكنها الوحيدة التي فيها شواطئ:
    5 من 33، إضافة إلى 6 محميات ومنتزهات و6 أديرة و4 قلاع و7 بلدات. من الـ33، 29 مفتوحة طوال
    السنة؛ و8 أماكن موسمها يونيو إلى سبتمبر، أي موسم الشاطئ.

    **كيف تُحسب هذه الأزمنة؛ اقرأ هذا أولاً.** سجلاتنا تحمل مسافة وزمناً مقاسين من تبليسي فقط. لكل
    مكان نقسم الاثنين: مسافة الطريق على المسافة المستقيمة تقول كم يتعرّج طريق ذلك المكان، ومسافة
    الطريق على الزمن تقول أي سرعة متوسطة يسمح بها. ثم نطبّق الرقمين على الخط المستقيم من باتومي.
    هذا تقدير من سرعة الطريق المقاسة لكل مكان، **لا مسار ملاحة**. وحيث تقع سلسلة أدجارا بين
    باتومي والمكان، يمر الطريق الحقيقي عبر ممر غودردزي ويقصر التقدير؛ فاقرأ [زارزما](/attractions/zarzma-monastery/)
    1:48 و[أباستوماني](/attractions/abastumani-observatory/) 2:16 و[راباتي](/attractions/rabati-castle/) 2:25
    بوصفها صفوفاً متفائلة. أما [تبليسي](/guides/day-trips-from-tbilisi/) فنستخدم لها الحقول الدقيقة.

