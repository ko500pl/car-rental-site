  short: "لجورجيا موسمان لا موسم واحد: بلد بنسبة 60 بالمئة من نوفمبر إلى أبريل، وبلد بنسبة 99 بالمئة من يونيو إلى سبتمبر."
  meta_title: "أفضل وقت لزيارة جورجيا، شهراً بشهر | RentUp"
  meta_description: "أحصينا كم من 267 مكاناً و49 مساراً يكون فعلاً في موسمه كل شهر. يونيو إلى سبتمبر يفتح 99 بالمئة والشتاء يترك 60. خطّط على هذا المنحنى لا على الحدس."
  body: |
    ## الجواب في جملة

    لكل مكان في قاعدة بياناتنا نافذة موسم، ولكل مسار كذلك. وإذا أحصيناها شهراً بشهر تكف جورجيا عن
    كونها وجهة واحدة بموسم واحد، وتبدو بلدين مختلفين يتقاسمان خريطة واحدة.

    **من يونيو إلى سبتمبر يكون 265 مكاناً من 267 في موسمه، و48 أو 49 مساراً من 49 مفتوحاً. ومن
    نوفمبر إلى أبريل ينزل الرقم إلى نحو 160 مكاناً و14 إلى 25 مساراً.** ويقف مايو وأكتوبر في
    المنتصف عند 229 مكاناً، وهو الموسم الذي يفضّله الزوار المتمرسون بهدوء.

    ## المنحنى شهراً بشهر

    | الشهر | أماكن في الموسم (من 267) | النسبة | مسارات في الموسم (من 49) |
    |---|---|---|---|
    | يناير | 161 | 60% | 14 |
    | فبراير | 161 | 60% | 14 |
    | مارس | 161 | 60% | 16 |
    | أبريل | 160 | 60% | 25 |
    | مايو | 229 | 86% | 43 |
    | يونيو | 265 | 99% | 48 |
    | يوليو | 265 | 99% | 49 |
    | أغسطس | 265 | 99% | 49 |
    | سبتمبر | 265 | 99% | 49 |
    | أكتوبر | 229 | 86% | 43 |
    | نوفمبر | 159 | 60% | 16 |
    | ديسمبر | 161 | 60% | 14 |

    والمكانان الغائبان عن ذروة الصيف ليسا سهواً: [غودااوري](/attractions/gudauri/) و[منطقتا التزلج
    هاتسفالي وتيتنولدي](/attractions/hatsvali-tetnuldi/) هما السجلان الوحيدان اللذان موسمهما
    الشتاء. ونوفمبر أنحف شهور السنة عند 159 مكاناً: نافذة الخريف أُغلقت وموسم التزلج لم يبدأ بعد.

    ## المسألة ارتفاع لا تقويم

    | الارتفاع | الأماكن | في الموسم طوال السنة | ملاحظة |
    |---|---|---|---|
    | دون 500 متر | 108 | 86 (80%) | تبليسي وكاخيتي والساحل ومعظم الأديرة |
    | 500-999 متراً | 85 | 56 (66%) | السفوح وأرض النبيذ وإيميريتي |
    | 1,000-1,499 متراً | 31 | 14 (45%) | مداخل الجبال |
    | 1,500-1,999 متراً | 23 | 2 (9%) | القرى والممرات الألبية |
    | فوق 2,000 متر | 20 | 1 (5%) | 15 منها من يونيو إلى سبتمبر فقط |

    دون 500 متر يستحق أربعة من كل خمسة أماكن الرحلة في أي شهر. وفوق 2,000 متر يستحقها مكان واحد
    بالضبط. فإن كان مسارك منخفضاً فالتقويم لا يعني كثيراً؛ وإن كان مرتفعاً فالتقويم هو المسار نفسه.

    ## موسماً بموسم

    **من يونيو إلى سبتمبر.** تُفتح طرق `4x4_only` السبع عشرة كلها، والبحيرات الألبية،
    و[أوشغولي](/attractions/ushguli/)، و[ممر أبانو](/attractions/abano-pass/)، وساحل البحر الأسود
    بطوله. و36 مكاناً يحمل هذه النافذة بالذات، خمسة عشر منها فوق 2,000 متر. وفي هذه المدة وحدها
    يصير [مسار سفانيتي الاستكشافي](/routes/svaneti-expedition/) معقولاً أصلاً.

    **مايو وأكتوبر.** 229 مكاناً و43 مساراً في الموسم، أي كل شيء عدا أعلى الممرات. وفي وصف
    [مسار نبيذ كاخيتي](/routes/kakheti-wine-loop/) عندنا أن قطاف العنب يمتد من أواخر سبتمبر طوال
    أكتوبر: أفضل وقت لزيارة الأقبية، والوقت الذي تمتلئ فيه بيوت الضيافة أولاً.

    **من نوفمبر إلى أبريل.** 159 مكاناً في موسمه كل شهر من شهور السنة، وليست فضلات:
    [سيغناغي](/attractions/sighnaghi/)، و[أوبليستسيخه](/attractions/uplistsikhe/)،
    و[بورجومي](/attractions/borjomi-central-park/)، و26 مكاناً من 28 نوثّقها داخل تبليسي نفسها.
    فرحلة الشتاء إلى جورجيا ليست تنازلاً بل رحلة أخرى: أخفض وأهدأ.

    ## أي سيارة لأي موسم

    - **يونيو إلى سبتمبر في المنخفضات** - [السيارة الاقتصادية](/car-rental/economy/) تغطي 181
      مكاناً من 267.
    - **يونيو إلى سبتمبر في المرتفعات** - [الدفع الرباعي الخفيف](/car-rental/suv/) لقرى الجبال،
      و[الدفع الرباعي 4x4](/car-rental/4x4/) لأوشغولي وتوشيتي وممر أبانو. واقرأ قبل القرار
      [هل تحتاج إلى دفع رباعي](/guides/do-i-need-a-4x4-in-georgia/).
    - **مايو وأكتوبر** - الموسم الطبيعي للدفع الرباعي الخفيف، لأن الأماكن التي فُتحت للتو هي نفسها
      صاحبة أوعر المداخل.
    - **من نوفمبر إلى أبريل** - بلد منخفض وإسفلت وإطارات شتوية على الأسطول كله من 1 ديسمبر إلى
      1 أبريل. وما يتغير خلف المقود مشروح في [دليل القيادة](/guides/driving-in-georgia/).

    ## ما لا تدّعيه هذه الصفحة

    نافذة الموسم توصية منا، لا تاريخ افتتاح رسمياً ولا حالة لحظية. وبمعزل عن ذلك، 52 مكاناً من 267
    مُعلّم بأنه غير متاح طوال السنة، وقد يفتح ممر عالٍ متأخراً أسابيع أو يغلق مبكراً. فالجدول نمط،
    أما الطريق الجبلي بعينه فتحقق منه محلياً في أسبوع سفرك.

    وحين يتحدد الشهر تتبعه السيارة: [تأجير السيارات](/car-rental/).
  faq:
  - q: "ما أفضل شهر لزيارة جورجيا؟"
    a: "سبتمبر. فالمسارات الـ49 كلها و265 مكاناً من 267 في موسمها، والممرات العالية ما تزال مفتوحة، وقطاف العنب في كاخيتي يمتد من أواخر سبتمبر إلى أكتوبر."
  - q: "هل تستحق جورجيا الزيارة شتاءً؟"
    a: "نعم إن بقيت في المنخفضات. 159 مكاناً في موسمه كل شهر من السنة، منها 26 مكاناً من 28 داخل تبليسي وأقبية كاخيتي وأوبليستسيخه وبورجومي. وما تخسره هو المرتفعات: فوق 2,000 متر مكان واحد من عشرين متاح طوال السنة."
  - q: "متى تُفتح طرق الجبال؟"
    a: "بياناتنا تحمل نوافذ معتادة لا تواريخ افتتاح. و36 مكاناً، منها كل الطرق إلى أوشغولي وتوشيتي والبحيرات الألبية، موسمه من يونيو إلى سبتمبر، خمسة عشر منها فوق 2,000 متر."
  - q: "هل مايو مبكر أكثر من اللازم؟"
    a: "مايو يفتح 229 مكاناً من 267 و43 مساراً من 49، أي 86 بالمئة من البلاد. ولا يبقى مغلقاً إلا الطابق الأعلى. ولكل ما هو دون 1,500 متر تقريباً، مايو ممتاز وأهدأ كثيراً من يوليو."
  - q: "أين يمكن التزلج وأي سيارة أحتاج؟"
    a: "غودااوري على 2,200 متر وهاتسفالي وتيتنولدي على 1,870 متراً هما السجلان الوحيدان بموسم من ديسمبر إلى مارس. والطريق إليهما معبّد أو شبه معبّد، ومع ذلك كلاهما مصنّف بفئة الدفع الرباعي الخفيف، لأن الارتفاع والطقس هما ما يفرض ذلك لا السطح."
