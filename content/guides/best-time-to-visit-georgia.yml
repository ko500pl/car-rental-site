en:
  name: "The Best Time to Visit Georgia, Counted Month by Month"
  short: "Georgia does not have one season. It has two countries: a 60% country from November to April and a 99% country from June to September."
  meta_title: "Best Time to Visit Georgia: Month by Month | RentUp"
  meta_description: "We count how many of 267 places and 49 routes are actually in season each month. June to September opens 99%; winter leaves you 60%. Plan around the curve."
  body: |
    ## The one-sentence answer

    Every place in our database carries a `best_season` window, and every route carries one too. Count
    them month by month and Georgia stops looking like one destination with one season and starts
    looking like two different countries sharing a map.

    **From June to September, 265 of our 267 places are in season and 48 or 49 of our 49 routes are
    open. From November to April, that falls to about 160 places and 14 to 25 routes.** May and
    October sit in between at 229 places - and that is the shoulder most experienced visitors
    quietly prefer.

    ## The curve, month by month

    | Month | Places in season (of 267) | Share | Routes in season (of 49) |
    |---|---|---|---|
    | January | 161 | 60% | 14 |
    | February | 161 | 60% | 14 |
    | March | 161 | 60% | 16 |
    | April | 160 | 60% | 25 |
    | May | 229 | 86% | 43 |
    | June | 265 | 99% | 48 |
    | July | 265 | 99% | 49 |
    | August | 265 | 99% | 49 |
    | September | 265 | 99% | 49 |
    | October | 229 | 86% | 43 |
    | November | 159 | 60% | 16 |
    | December | 161 | 60% | 14 |

    Two details in that table are worth pausing on. The two places missing from the June-to-September
    peak are not oversights: [Gudauri](/attractions/gudauri/) and the
    [Hatsvali and Tetnuldi ski areas](/attractions/hatsvali-tetnuldi/) are the only two entries in the
    whole database whose best season is winter. And November is the single thinnest month of the year
    at 159 places, because it has lost the autumn window without yet gaining the ski season.

    ## It is altitude, not the calendar

    The seasonal split is almost entirely a function of height. Sorted by elevation, the pattern is
    unambiguous:

    | Elevation | Places | In season all year | Comment |
    |---|---|---|---|
    | Below 500 m | 108 | 86 (80%) | Tbilisi, Kakheti, the coast, most monasteries |
    | 500-999 m | 85 | 56 (66%) | Foothills, wine country, Imereti |
    | 1,000-1,499 m | 31 | 14 (45%) | Mountain approaches |
    | 1,500-1,999 m | 23 | 2 (9%) | Alpine villages and passes |
    | Above 2,000 m | 20 | 1 (5%) | 15 of the 20 are June-to-September only |

    Below 500 metres, four places in five are worth driving to in any month. Above 2,000 metres,
    exactly one is. If your itinerary is low, the calendar barely matters; if it is high, the calendar
    is the itinerary.

    ## Season by season

    **June to September - everything is open.** All 17 of our `4x4_only` roads, all the alpine
    lakes, [Ushguli](/attractions/ushguli/), the [Abano Pass](/attractions/abano-pass/) and the whole
    Black Sea coast. 36 places carry a June-to-September window specifically, and 15 of those sit
    above 2,000 m. This is the only period in which the [Svaneti expedition](/routes/svaneti-expedition/)
    and the Tusheti roads make sense at all.

    **May and October - the shoulder, and quietly the best value.** 229 places and 43 routes are in
    season: everything except the highest passes. 69 places carry a May-to-October window, which is
    the second-largest group in the dataset. October also carries the
    [Kakheti wine loop](/routes/kakheti-wine-loop/)'s own note that the rtveli harvest runs from late
    September through October - the best time for cellars, and the time the guesthouses fill first.

    **November to April - the 60% country.** 159 places are in season in every single month of the
    year, and they are not the leftovers: [Sighnaghi](/attractions/sighnaghi/),
    [Uplistsikhe](/attractions/uplistsikhe/), [Borjomi](/attractions/borjomi-central-park/),
    Mtskheta's cathedrals, the Kakheti cellars and 26 of the 28 places we map inside Tbilisi. A winter
    trip to Georgia is not a compromise; it is a different, lower, quieter trip.

    **December to March - the two winter places.** [Gudauri](/attractions/gudauri/) at 2,200 m and
    [Hatsvali and Tetnuldi](/attractions/hatsvali-tetnuldi/) at 1,870 m are the only entries whose
    season is explicitly winter. Both are reached on paved or mostly paved roads, and both are rated
    SUV - not because of the surface, but because of the altitude and the weather.
    [Bakuriani](/attractions/bakuriani/), interestingly, is rated in season all year.

    ## Which region rewards which month

    | Region | In season all year | May-October | June-September |
    |---|---|---|---|
    | Tbilisi | 26 of 28 | 2 | 0 |
    | Imereti | 23 of 31 | 8 | 0 |
    | Kakheti | 24 of 33 | 5 | 4 |
    | Shida Kartli | 13 of 19 | 5 | 1 |
    | Samtskhe-Javakheti | 13 of 22 | 8 | 1 |
    | Samegrelo-Zemo Svaneti | 14 of 26 | 4 | 7 |
    | Adjara | 12 of 24 | 5 | 7 |
    | Guria | 10 of 19 | 3 | 6 |
    | Kvemo Kartli | 10 of 20 | 10 | 0 |
    | Mtskheta-Mtianeti | 9 of 25 | 9 | 6 |
    | Racha-Lechkhumi | 5 of 20 | 10 | 4 |

    Racha-Lechkhumi is the most seasonal region on the map: only a quarter of its places are
    year-round, and half of them are May to October. Kvemo Kartli is the surprise - half its places
    are May-to-October despite being low, because so many of them are gravel-access fortresses and
    canyons.

    ## Which car for which season

    - **June to September, staying low.** The whole country is open and most of it is paved: an
      [economy car](/car-rental/economy/) covers 181 of the 267 places.
    - **June to September, going high.** Alpine roads open in this window and close outside it - an
      [SUV](/car-rental/suv/) for mountain villages, an [off-road 4x4](/car-rental/4x4/) for Ushguli,
      Tusheti and the Abano Pass. See [do you need a 4x4](/guides/do-i-need-a-4x4-in-georgia/) before
      you decide.
    - **May and October.** The shoulder is the SUV's natural season: 229 places open, and the ones
      that just opened or are about to close are exactly the ones with the roughest approaches.
    - **November to April.** Low country, paved roads, winter tyres fitted on the whole fleet from
      1 December to 1 April. Our [driving in Georgia guide](/guides/driving-in-georgia/) covers what
      actually changes behind the wheel.

    ## What this page does not claim

    `best_season` is our recommendation for when a place is worth the drive - it is not a
    government opening date and not a live status. Separately, 52 of the 267 places are flagged as
    not accessible all year, and a high pass can open late or close early by weeks in any given
    season. Treat the table above as the pattern, and confirm the specific mountain road locally in
    the week you travel.

    When you know your month, the vehicle decision follows from it: start at
    [car rental in Georgia](/car-rental/).
  faq:
  - q: "What is the single best month to visit Georgia?"
    a: "September. All 49 of our routes and 265 of 267 places are in season, the high passes are still open, and the rtveli grape harvest in Kakheti runs from late September into October. June to August match it for access but not for the harvest."
  - q: "Is Georgia worth visiting in winter?"
    a: "Yes, if you go low. 159 places are in season every month of the year, including 26 of the 28 we map inside Tbilisi, the Kakheti cellars, Uplistsikhe and Borjomi. What you lose is the high country: above 2,000 m only one place in twenty is year-round."
  - q: "When do the mountain roads open?"
    a: "Our data carries typical windows, not opening dates. 36 places, including every road to Ushguli, Tusheti and the alpine lakes, carry a best season of June to September, and 15 of those sit above 2,000 m. Confirm the specific pass locally in the week you travel."
  - q: "Is May a good month, or too early?"
    a: "May opens 229 of 267 places and 43 of 49 routes - 86% of the country. What is still shut is the highest tier: the June-to-September group of 36 places. For everything below about 1,500 m, May is excellent and much quieter than July."
  - q: "When is the Black Sea coast worth driving to?"
    a: "The coastal entries - Kobuleti, Ureki, Anaklia, Kvariati, Sarpi and the Guria beaches - carry a June-to-September season, even though every one of them is on a paved road all year. The road is not the constraint; the water is."
  - q: "Where can I actually ski, and what car do I need?"
    a: "Gudauri at 2,200 m and the Hatsvali and Tetnuldi areas at 1,870 m are the only two entries with a December-to-March season. Both are on paved or mostly paved roads but are rated SUV, because altitude and weather rather than surface set the requirement."

ka:
  name: "როდის ჯობია საქართველოში ჩამოსვლა — თვე თვეზე დათვლილი"
  short: "საქართველოს ერთი სეზონი არ აქვს. მას ორი ქვეყანა აქვს: 60-პროცენტიანი ნოემბრიდან აპრილამდე და 99-პროცენტიანი ივნისიდან სექტემბრამდე."
  meta_title: "როდის ჯობია ჩამოსვლა საქართველოში | RentUp"
  meta_description: "ვთვლით, თვეში რამდენი ღირსშესანიშნაობა და მარშრუტია სეზონზე. ივნისი-სექტემბერი — 99%, ზამთარი — 60%. დაგეგმეთ ამ მრუდის მიხედვით და არა შეგრძნებით."
  body: |
    ## პასუხი ერთი წინადადებით

    ჩვენს ბაზაში თითოეულ ადგილს აქვს სეზონის ველი და იგივე ველი აქვს თითოეულ მარშრუტსაც. თუ თვე-თვე
    დავთვლით, საქართველო წყვეტს ერთსეზონიან მიმართულებად გამოჩენას და ორ სხვადასხვა ქვეყნად იშლება,
    რომლებიც ერთ რუკას იზიარებენ.

    **ივნისიდან სექტემბრამდე 267 ადგილიდან 265 სეზონზეა და 49 მარშრუტიდან 48 ან 49 — ღიაა.
    ნოემბრიდან აპრილამდე ეს რიცხვი დაახლოებით 160 ადგილამდე და 14-25 მარშრუტამდე ეცემა.** მაისი და
    ოქტომბერი შუაშია, 229 ადგილით — და სწორედ ეს გარდამავალი პერიოდია, რომელსაც გამოცდილი მოგზაურები
    ჩუმად ამჯობინებენ.

    ## მრუდი, თვე თვეზე

    | თვე | სეზონზე მყოფი ადგილი (267-დან) | წილი | სეზონზე მყოფი მარშრუტი (49-დან) |
    |---|---|---|---|
    | იანვარი | 161 | 60% | 14 |
    | თებერვალი | 161 | 60% | 14 |
    | მარტი | 161 | 60% | 16 |
    | აპრილი | 160 | 60% | 25 |
    | მაისი | 229 | 86% | 43 |
    | ივნისი | 265 | 99% | 48 |
    | ივლისი | 265 | 99% | 49 |
    | აგვისტო | 265 | 99% | 49 |
    | სექტემბერი | 265 | 99% | 49 |
    | ოქტომბერი | 229 | 86% | 43 |
    | ნოემბერი | 159 | 60% | 16 |
    | დეკემბერი | 161 | 60% | 14 |

    ცხრილში ორი დეტალი იმსახურებს შეჩერებას. ის ორი ადგილი, რომელიც ივნისი-სექტემბრის პიკში არ ხვდება,
    შეცდომა არ არის: [გუდაური](/attractions/gudauri/) და
    [ჰაწვალი და თეთნულდი](/attractions/hatsvali-tetnuldi/) მთელ ბაზაში ერთადერთი ჩანაწერებია, რომელთა
    სეზონიც ზამთარია. ნოემბერი კი წლის ყველაზე გამოფიტული თვეა, 159 ადგილით: შემოდგომის ფანჯარა უკვე
    დაკეტილია, სათხილამურო სეზონი კი ჯერ არ დაწყებულა.

    ## საქმე სიმაღლეშია და არა კალენდარში

    სეზონური გაყოფა თითქმის მთლიანად სიმაღლის ფუნქციაა. სიმაღლის მიხედვით დალაგებული სურათი ცალსახაა:

    | სიმაღლე | ადგილი | მთელი წელი სეზონზე | კომენტარი |
    |---|---|---|---|
    | 500 მ-ზე დაბლა | 108 | 86 (80%) | თბილისი, კახეთი, ზღვისპირეთი, მონასტრების უმეტესობა |
    | 500-999 მ | 85 | 56 (66%) | მთისწინეთი, ღვინის მხარე, იმერეთი |
    | 1000-1499 მ | 31 | 14 (45%) | მთისკენ მისასვლელები |
    | 1500-1999 მ | 23 | 2 (9%) | ალპური სოფლები და უღელტეხილები |
    | 2000 მ-ზე მაღლა | 20 | 1 (5%) | ოციდან 15 მხოლოდ ივნისი-სექტემბერია |

    500 მეტრს ქვემოთ ხუთი ადგილიდან ოთხამდე ნებისმიერ თვეში ღირს. 2000 მეტრს ზემოთ — ზუსტად ერთი.
    თუ მარშრუტი დაბალია, კალენდარს თითქმის არ აქვს მნიშვნელობა; თუ მაღალია, კალენდარი თავად არის
    მარშრუტი.

    ## სეზონი სეზონზე

    **ივნისი-სექტემბერი — ყველაფერი ღიაა.** ჩვენი 17 `4x4_only` გზა, ალპური ტბები,
    [უშგული](/attractions/ushguli/), [აბანოს უღელტეხილი](/attractions/abano-pass/) და მთელი შავი
    ზღვის სანაპირო. 36 ადგილს სწორედ ივნისი-სექტემბრის ფანჯარა უწერია და მათგან 15 — 2000 მეტრზე
    მაღლა. მხოლოდ ამ პერიოდში აქვს აზრი [სვანეთის ექსპედიციასა](/routes/svaneti-expedition/) და
    თუშეთის გზებს.

    საინტერესოა, თუ როგორ იშლება ეს 36 ადგილი გზის საფარის მიხედვით: 15 არის `4x4_only`, 8 —
    გრუნტიანი, 5 — თითქმის მოასფალტებული და 8 — სრულიად მოასფალტებული. ბოლო რვა შავი ზღვის სანაპიროა
    — ანაკლია, ურეკი, ქობულეთი, კვარიათი, სარფი და გურიის პლაჟები. მათთან გზა მთელი წელი ასფალტია;
    სეზონს გზა კი არა, წყლის ტემპერატურა განსაზღვრავს. ეს კარგი შეხსენებაა, რომ სეზონურობა ყოველთვის
    გზის მდგომარეობას არ ნიშნავს.

    **მაისი და ოქტომბერი — გარდამავალი და ჩუმად საუკეთესო.** სეზონზეა 229 ადგილი და 43 მარშრუტი,
    ანუ ყველაფერი გარდა უმაღლესი უღელტეხილებისა. 69 ადგილს მაისი-ოქტომბრის ფანჯარა უწერია — ბაზაში
    სიდიდით მეორე ჯგუფი. ოქტომბერს თავისი დამატებითი არგუმენტიც აქვს:
    [კახეთის ღვინის რგოლის](/routes/kakheti-wine-loop/) აღწერაში პირდაპირ წერია, რომ რთველი
    სექტემბრის ბოლოდან ოქტომბრის ბოლომდე გრძელდება — მარნებისთვის საუკეთესო დრო და ის დრო, როცა
    სასტუმროები პირველად ივსება.

    **ნოემბერი-აპრილი — სამოცპროცენტიანი ქვეყანა.** 159 ადგილი წლის ყოველ თვეშია სეზონზე და ეს
    ნარჩენები არ არის: [სიღნაღი](/attractions/sighnaghi/), [უფლისციხე](/attractions/uplistsikhe/),
    [ბორჯომი](/attractions/borjomi-central-park/), მცხეთის ტაძრები, კახეთის მარნები და თბილისში
    აღწერილი 28 ადგილიდან 26. ზამთრის მოგზაურობა კომპრომისი კი არა, უბრალოდ სხვა — უფრო დაბალი და
    უფრო წყნარი მოგზაურობაა.

    **დეკემბერი-მარტი — ორი ზამთრის ადგილი.** [გუდაური](/attractions/gudauri/) 2200 მეტრზე და
    [ჰაწვალი-თეთნულდი](/attractions/hatsvali-tetnuldi/) 1870-ზე ერთადერთი ჩანაწერებია ზამთრის
    სეზონით. ორივესთან გზა ასფალტია ან თითქმის ასფალტი, ორივე კი კროსოვერითაა შეფასებული — არა
    საფარის, არამედ სიმაღლისა და ამინდის გამო. [ბაკურიანს](/attractions/bakuriani/) კი, საინტერესოდ,
    მთელი წლის სეზონი უწერია.

    ## რომელი რეგიონი რომელ თვეს იხდის

    | რეგიონი | მთელი წელი | მაისი-ოქტომბერი | ივნისი-სექტემბერი |
    |---|---|---|---|
    | თბილისი | 28-დან 26 | 2 | 0 |
    | იმერეთი | 31-დან 23 | 8 | 0 |
    | კახეთი | 33-დან 24 | 5 | 4 |
    | შიდა ქართლი | 19-დან 13 | 5 | 1 |
    | სამცხე-ჯავახეთი | 22-დან 13 | 8 | 1 |
    | სამეგრელო-ზემო სვანეთი | 26-დან 14 | 4 | 7 |
    | აჭარა | 24-დან 12 | 5 | 7 |
    | გურია | 19-დან 10 | 3 | 6 |
    | ქვემო ქართლი | 20-დან 10 | 10 | 0 |
    | მცხეთა-მთიანეთი | 25-დან 9 | 9 | 6 |
    | რაჭა-ლეჩხუმი | 20-დან 5 | 10 | 4 |

    რაჭა-ლეჩხუმი რუკაზე ყველაზე სეზონური რეგიონია: ადგილების მხოლოდ მეოთხედია მთელი წლის და ნახევარი
    — მაისი-ოქტომბრის. ქვემო ქართლი კი მოულოდნელია: დაბალი რეგიონია, მაგრამ ადგილების ნახევარი მაისი-
    ოქტომბრისაა, რადგან ბევრი ციხე და კანიონი გრუნტიანი გზითაა მისადგომი.

    ## რომელი მანქანა რომელ სეზონზე

    - **ივნისი-სექტემბერი, დაბლა.** მთელი ქვეყანა ღიაა და უმეტესობა ასფალტზეა:
      [ეკონომი](/car-rental/economy/) 267-დან 181 ადგილს ფარავს.
    - **ივნისი-სექტემბერი, მაღლა.** ალპური გზები სწორედ ამ ფანჯარაში იხსნება:
      [კროსოვერი](/car-rental/suv/) მთის სოფლებისთვის, [ჯიპი 4x4](/car-rental/4x4/) უშგულის,
      თუშეთისა და აბანოს უღელტეხილისთვის. სანამ გადაწყვეტთ, ნახეთ
      [გჭირდებათ თუ არა ჯიპი](/guides/do-i-need-a-4x4-in-georgia/).
    - **მაისი და ოქტომბერი.** გარდამავალი სეზონი კროსოვერის ბუნებრივი დროა: 229 ღია ადგილიდან
      სწორედ ის, რაც ახლა გაიხსნა ან იკეტება, ყველაზე უხეში მისადგომებით გამოირჩევა.
    - **ნოემბერი-აპრილი.** დაბალი ქვეყანა, ასფალტი და ზამთრის საბურავები მთელ ავტოპარკზე
      1 დეკემბრიდან 1 აპრილამდე. რა იცვლება საჭესთან, ეს
      [მართვის სახელმძღვანელოშია](/guides/driving-in-georgia/) აღწერილი.

    ## რას არ ამტკიცებს ეს გვერდი

    სეზონის ველი ჩვენი რეკომენდაციაა და არა ოფიციალური გახსნის თარიღი ან მიმდინარე სტატუსი. ცალკე,
    267 ადგილიდან 52 მონიშნულია როგორც არა მთელი წლის განმავლობაში ხელმისაწვდომი, მაღალი უღელტეხილი
    კი ნებისმიერ სეზონზე შეიძლება კვირებით დაგვიანდეს ან ადრე დაიკეტოს. ცხრილი ტენდენციაა —
    კონკრეტული მთის გზა კი გამგზავრების კვირას ადგილზე გადაამოწმეთ.

    როცა თვე გადაწყვეტილია, ავტომობილიც აქედან გამომდინარეობს:
    [ავტომობილის დაქირავება](/car-rental/).
  faq:
  - q: "რომელი თვე ჯობია საქართველოში?"
    a: "სექტემბერი. ჩვენი 49-ვე მარშრუტი და 267-დან 265 ადგილი სეზონზეა, მაღალი უღელტეხილები ჯერ ღიაა, კახეთში კი რთველი სექტემბრის ბოლოდან ოქტომბერში გადადის. ივნისი-აგვისტო ხელმისაწვდომობით უტოლდება, რთველით — არა."
  - q: "ღირს თუ არა ზამთარში ჩამოსვლა?"
    a: "დიახ, თუ დაბლა რჩებით. 159 ადგილი წლის ყოველ თვეშია სეზონზე, მათ შორის თბილისში აღწერილი 28-დან 26, კახეთის მარნები, უფლისციხე და ბორჯომი. კარგავთ მაღალმთიანეთს: 2000 მეტრს ზემოთ ოციდან მხოლოდ ერთი ადგილია მთელი წლის."
  - q: "როდის იხსნება მთის გზები?"
    a: "ჩვენს მონაცემებში ტიპური ფანჯრებია და არა გახსნის თარიღები. 36 ადგილს ივნისი-სექტემბრის სეზონი უწერია, მათ შორის უშგულის, თუშეთისა და ალპური ტბების ყველა გზას, და მათგან 15 — 2000 მეტრზე მაღლა. კონკრეტული უღელტეხილი ადგილზე გადაამოწმეთ."
  - q: "მაისი კარგი თვეა თუ ნაადრევი?"
    a: "მაისში 267-დან 229 ადგილი და 49-დან 43 მარშრუტი იხსნება, ანუ ქვეყნის 86%. დახურული რჩება მხოლოდ უმაღლესი საფეხური — ივნისი-სექტემბრის 36 ადგილი. დაახლოებით 1500 მეტრს ქვემოთ მაისი შესანიშნავია და ივლისზე გაცილებით წყნარი."
  - q: "როდის ღირს ზღვისპირეთში ჩასვლა?"
    a: "სანაპირო ჩანაწერებს — ქობულეთი, ურეკი, ანაკლია, კვარიათი, სარფი და გურიის პლაჟები — ივნისი-სექტემბრის სეზონი უწერია, თუმცა ყველა მათგანთან გზა მთელი წელი ასფალტია. შემზღუდველი გზა კი არა, წყალია."
  - q: "სად შემიძლია თხილამურები და რა მანქანა მჭირდება?"
    a: "გუდაური 2200 მეტრზე და ჰაწვალი-თეთნულდი 1870-ზე ერთადერთი ჩანაწერებია დეკემბერი-მარტის სეზონით. ორივესთან გზა ასფალტი ან თითქმის ასფალტია, მაგრამ ორივე კროსოვერითაა შეფასებული: მოთხოვნას საფარი კი არა, სიმაღლე და ამინდი განსაზღვრავს."

ru:
  name: "Когда лучше ехать в Грузию: подсчёт по месяцам"
  short: "У Грузии не один сезон, а две страны на одной карте: 60% с ноября по апрель и 99% с июня по сентябрь."
  meta_title: "Когда лучше ехать в Грузию: по месяцам | RentUp"
  meta_description: "Считаем, сколько из 267 мест и 49 маршрутов реально в сезоне каждый месяц. Июнь-сентябрь открывает 99%, зима оставляет 60%. Планируйте по этой кривой."
  body: |
    ## Ответ одной фразой

    У каждого места в нашей базе есть окно сезона, и у каждого маршрута тоже. Если посчитать их по
    месяцам, Грузия перестаёт выглядеть как одно направление с одним сезоном и превращается в две
    разные страны, делящие одну карту.

    **С июня по сентябрь в сезоне 265 из 267 мест и 48-49 из 49 маршрутов. С ноября по апрель
    остаётся около 160 мест и от 14 до 25 маршрутов.** Май и октябрь стоят посередине с 229
    местами - и именно это межсезонье опытные путешественники тихо предпочитают.

    ## Кривая по месяцам

    | Месяц | Мест в сезоне (из 267) | Доля | Маршрутов в сезоне (из 49) |
    |---|---|---|---|
    | Январь | 161 | 60% | 14 |
    | Февраль | 161 | 60% | 14 |
    | Март | 161 | 60% | 16 |
    | Апрель | 160 | 60% | 25 |
    | Май | 229 | 86% | 43 |
    | Июнь | 265 | 99% | 48 |
    | Июль | 265 | 99% | 49 |
    | Август | 265 | 99% | 49 |
    | Сентябрь | 265 | 99% | 49 |
    | Октябрь | 229 | 86% | 43 |
    | Ноябрь | 159 | 60% | 16 |
    | Декабрь | 161 | 60% | 14 |

    В этой таблице стоит остановиться на двух деталях. Два места, выпадающие из летнего пика, - не
    ошибка: [Гудаури](/attractions/gudauri/) и
    [зоны Хацвали и Тетнулди](/attractions/hatsvali-tetnuldi/) - единственные во всей базе, чей сезон
    зимний. А ноябрь - самый бедный месяц года со 159 местами: осеннее окно уже закрылось, а лыжный
    сезон ещё не начался.

    ## Дело в высоте, а не в календаре

    Сезонное деление почти целиком определяется высотой. Отсортированная по высоте картина
    однозначна:

    | Высота | Мест | В сезоне круглый год | Комментарий |
    |---|---|---|---|
    | Ниже 500 м | 108 | 86 (80%) | Тбилиси, Кахетия, побережье, большинство монастырей |
    | 500-999 м | 85 | 56 (66%) | Предгорья, винный край, Имеретия |
    | 1000-1499 м | 31 | 14 (45%) | Подходы к горам |
    | 1500-1999 м | 23 | 2 (9%) | Альпийские сёла и перевалы |
    | Выше 2000 м | 20 | 1 (5%) | 15 из 20 - только июнь-сентябрь |

    Ниже 500 метров четыре места из пяти стоят поездки в любой месяц. Выше 2000 метров - ровно одно.
    Если маршрут низкий, календарь почти не важен; если высокий, календарь и есть маршрут.

    ## По сезонам

    **Июнь-сентябрь - открыто всё.** Все 17 дорог класса `4x4_only`, альпийские озёра,
    [Ушгули](/attractions/ushguli/), [перевал Абано](/attractions/abano-pass/) и всё
    черноморское побережье. Ровно 36 мест несут окно с июня по сентябрь, и 15 из них лежат выше
    2000 м. Только в этот период вообще имеют смысл
    [сванетская экспедиция](/routes/svaneti-expedition/) и дороги Тушети.

    **Май и октябрь - межсезонье и тихо лучшее соотношение.** В сезоне 229 мест и 43 маршрута, то
    есть всё, кроме самых высоких перевалов. 69 мест несут окно с мая по октябрь - вторая по
    величине группа в базе. У октября есть и собственный аргумент: в описании
    [кахетинского винного круга](/routes/kakheti-wine-loop/) прямо сказано, что ртвели идёт с конца
    сентября весь октябрь - лучшее время для марани и время, когда гостевые дома заполняются первыми.

    **Ноябрь-апрель - страна на 60%.** 159 мест в сезоне каждый месяц года, и это не остатки:
    [Сигнахи](/attractions/sighnaghi/), [Уплисцихе](/attractions/uplistsikhe/),
    [Боржоми](/attractions/borjomi-central-park/), соборы Мцхеты, кахетинские марани и 26 из 28
    описанных мест в самом Тбилиси. Зимняя поездка в Грузию - не компромисс, а просто другая:
    ниже и тише.

    **Декабрь-март - два зимних места.** [Гудаури](/attractions/gudauri/) на 2200 м и
    [Хацвали с Тетнулди](/attractions/hatsvali-tetnuldi/) на 1870 м - единственные записи с зимним
    сезоном. К обоим ведёт асфальт или почти асфальт, и обе отмечены кроссовером - из-за высоты и
    погоды, а не покрытия. [Бакуриани](/attractions/bakuriani/), что любопытно, отмечен как сезонный
    круглый год.

    ## Какой регион окупает какой месяц

    | Регион | Круглый год | Май-октябрь | Июнь-сентябрь |
    |---|---|---|---|
    | Тбилиси | 26 из 28 | 2 | 0 |
    | Имеретия | 23 из 31 | 8 | 0 |
    | Кахетия | 24 из 33 | 5 | 4 |
    | Шида Картли | 13 из 19 | 5 | 1 |
    | Самцхе-Джавахети | 13 из 22 | 8 | 1 |
    | Самегрело-Земо Сванетия | 14 из 26 | 4 | 7 |
    | Аджария | 12 из 24 | 5 | 7 |
    | Гурия | 10 из 19 | 3 | 6 |
    | Квемо Картли | 10 из 20 | 10 | 0 |
    | Мцхета-Мтианети | 9 из 25 | 9 | 6 |
    | Рача-Лечхуми | 5 из 20 | 10 | 4 |

    Рача-Лечхуми - самый сезонный регион на карте: круглый год доступна лишь четверть мест, а
    половина - с мая по октябрь. Квемо Картли удивляет: регион низкий, но половина его мест
    майско-октябрьские, потому что многие крепости и каньоны там доступны по грунту.

    ## Какая машина в какой сезон

    - **Июнь-сентябрь, внизу.** Страна открыта целиком, и почти всё - асфальт:
      [эконом](/car-rental/economy/) закрывает 181 место из 267.
    - **Июнь-сентябрь, наверху.** Альпийские дороги открываются именно в это окно:
      [кроссовер](/car-rental/suv/) для горных сёл, [внедорожник 4x4](/car-rental/4x4/) для Ушгули,
      Тушети и перевала Абано. Перед решением прочитайте
      [нужен ли внедорожник](/guides/do-i-need-a-4x4-in-georgia/).
    - **Май и октябрь.** Межсезонье - естественное время кроссовера: из 229 открытых мест именно
      те, что только открылись или вот-вот закроются, имеют самые тяжёлые подъезды.
    - **Ноябрь-апрель.** Низкая страна, асфальт и зимняя резина на всём парке с 1 декабря по
      1 апреля. Что меняется за рулём, разобрано в
      [гиде по вождению](/guides/driving-in-georgia/).

    ## Чего эта страница не утверждает

    Поле сезона - наша рекомендация, а не официальная дата открытия и не текущий статус. Отдельно:
    52 места из 267 отмечены как недоступные круглый год, а высокий перевал в любой год может
    открыться на недели позже или закрыться раньше. Таблица выше - закономерность; конкретную
    горную дорогу проверяйте на месте на неделе выезда.

    Когда месяц выбран, машина следует из него: [аренда автомобиля](/car-rental/).
  faq:
  - q: "Какой месяц лучший для поездки в Грузию?"
    a: "Сентябрь. В сезоне все 49 маршрутов и 265 мест из 267, высокие перевалы ещё открыты, а ртвели в Кахетии идёт с конца сентября в октябрь. Июнь-август сравнимы по доступности, но не по сбору винограда."
  - q: "Стоит ли ехать в Грузию зимой?"
    a: "Да, если держаться низко. 159 мест в сезоне каждый месяц года, включая 26 из 28 описанных в Тбилиси, кахетинские марани, Уплисцихе и Боржоми. Теряете вы высокогорье: выше 2000 м круглогодично доступно одно место из двадцати."
  - q: "Когда открываются горные дороги?"
    a: "В наших данных типичные окна, а не даты открытия. 36 мест, включая все дороги к Ушгули, Тушети и альпийским озёрам, несут сезон с июня по сентябрь, и 15 из них выше 2000 м. Конкретный перевал уточняйте на месте."
  - q: "Май - хороший месяц или ещё рано?"
    a: "Май открывает 229 мест из 267 и 43 маршрута из 49, то есть 86% страны. Закрытым остаётся только верхний ярус - группа из 36 июньско-сентябрьских мест. Для всего, что ниже примерно 1500 м, май отличен и заметно тише июля."
  - q: "Когда есть смысл ехать на побережье?"
    a: "У прибрежных записей - Кобулети, Уреки, Анаклия, Квариати, Сарпи и пляжи Гурии - сезон с июня по сентябрь, хотя ко всем ведёт асфальт круглый год. Ограничение не дорога, а вода."
  - q: "Где кататься на лыжах и какая нужна машина?"
    a: "Гудаури на 2200 м и зоны Хацвали и Тетнулди на 1870 м - единственные записи с сезоном с декабря по март. К обеим ведёт асфальт или почти асфальт, но обе отмечены кроссовером: требование задают высота и погода, а не покрытие."

fa:
  name: "بهترین زمان سفر به گرجستان، ماه به ماه"
  short: "گرجستان یک فصل ندارد؛ دو کشور روی یک نقشه است: 60 درصد از نوامبر تا آوریل و 99 درصد از ژوئن تا سپتامبر."
  meta_title: "بهترین زمان سفر به گرجستان، ماه به ماه | RentUp"
  meta_description: "می‌شماریم که هر ماه چند مورد از 267 مکان و 49 مسیر واقعاً در فصل‌اند. ژوئن تا سپتامبر 99 درصد باز است و زمستان 60 درصد. بر پایهٔ همین منحنی برنامه بریزید."
  body: |
    ## پاسخ در یک جمله

    هر مکان در پایگاه دادهٔ ما یک بازهٔ فصلی دارد و هر مسیر هم همین‌طور. اگر ماه به ماه بشماریم،
    گرجستان دیگر یک مقصد با یک فصل نیست؛ دو کشور متفاوت است که یک نقشه را با هم قسمت می‌کنند.

    **از ژوئن تا سپتامبر، 265 مکان از 267 مکان در فصل‌اند و 48 یا 49 مسیر از 49 مسیر باز است. از
    نوامبر تا آوریل این رقم به حدود 160 مکان و 14 تا 25 مسیر می‌رسد.** ماه‌های مه و اکتبر در میانه
    می‌ایستند، با 229 مکان.

    ## منحنی، ماه به ماه

    | ماه | مکان در فصل (از 267) | سهم | مسیر در فصل (از 49) |
    |---|---|---|---|
    | ژانویه | 161 | 60% | 14 |
    | فوریه | 161 | 60% | 14 |
    | مارس | 161 | 60% | 16 |
    | آوریل | 160 | 60% | 25 |
    | مه | 229 | 86% | 43 |
    | ژوئن | 265 | 99% | 48 |
    | ژوئیه | 265 | 99% | 49 |
    | اوت | 265 | 99% | 49 |
    | سپتامبر | 265 | 99% | 49 |
    | اکتبر | 229 | 86% | 43 |
    | نوامبر | 159 | 60% | 16 |
    | دسامبر | 161 | 60% | 14 |

    دو مکانی که از اوج تابستان جا می‌مانند اشتباه ثبت نیستند: [گودااوری](/attractions/gudauri/) و
    [پیست‌های هاتسوالی و تتنولدی](/attractions/hatsvali-tetnuldi/) تنها رکوردهایی هستند که فصلشان
    زمستان است. و نوامبر کم‌رمق‌ترین ماه سال است، چون پنجرهٔ پاییز بسته شده و فصل اسکی هنوز نیامده.

    ## مسئله ارتفاع است، نه تقویم

    | ارتفاع | مکان | تمام سال در فصل | توضیح |
    |---|---|---|---|
    | زیر 500 متر | 108 | 86 (80%) | تفلیس، کاختی، ساحل، بیشتر صومعه‌ها |
    | 500-999 متر | 85 | 56 (66%) | دامنه‌ها، سرزمین شراب، ایمرتی |
    | 1,000-1,499 متر | 31 | 14 (45%) | مسیرهای ورودی کوهستان |
    | 1,500-1,999 متر | 23 | 2 (9%) | روستاها و گردنه‌های آلپی |
    | بالای 2,000 متر | 20 | 1 (5%) | 15 مورد فقط ژوئن تا سپتامبر |

    زیر 500 متر، چهار مکان از هر پنج مکان در هر ماهی ارزش رفتن دارد. بالای 2,000 متر، دقیقاً یک
    مورد. اگر برنامهٔ شما پایین است تقویم اهمیت چندانی ندارد؛ اگر بالاست، تقویم خودِ برنامه است.

    ## فصل به فصل

    **ژوئن تا سپتامبر.** هر 17 جادّهٔ `4x4_only`، دریاچه‌های آلپی، [اوشگولی](/attractions/ushguli/)،
    [گردنهٔ آبانو](/attractions/abano-pass/) و تمام ساحل دریای سیاه باز است. 36 مکان دقیقاً همین
    بازه را دارند و 15 مورد از آن‌ها بالای 2,000 متر است. تنها در این بازه
    [سفر اکتشافی سوانتی](/routes/svaneti-expedition/) معنا پیدا می‌کند.

    **مه و اکتبر.** 229 مکان و 43 مسیر در فصل‌اند، یعنی همه‌چیز جز بلندترین گردنه‌ها. در توضیح
    [حلقهٔ شراب کاختی](/routes/kakheti-wine-loop/) آمده است که برداشت انگور از اواخر سپتامبر تا
    پایان اکتبر ادامه دارد: بهترین زمان برای بازدید از سردابه‌ها و همان زمانی که اقامتگاه‌ها زودتر
    پر می‌شوند.

    **نوامبر تا آوریل.** 159 مکان در همهٔ ماه‌های سال در فصل‌اند و این‌ها ته‌مانده نیستند:
    [سیغناغی](/attractions/sighnaghi/)، [اوپلیستسیخه](/attractions/uplistsikhe/)،
    [بورجومی](/attractions/borjomi-central-park/) و 26 مکان از 28 مکانی که در خود تفلیس ثبت
    کرده‌ایم. سفر زمستانی به گرجستان یک مصالحه نیست؛ سفری دیگر است، پایین‌تر و آرام‌تر.

    ## کدام خودرو در کدام فصل

    - **ژوئن تا سپتامبر در ارتفاع پایین** - [خودروی اقتصادی](/car-rental/economy/) 181 مکان از 267
      را پوشش می‌دهد.
    - **ژوئن تا سپتامبر در ارتفاع بالا** - [شاسی‌بلند](/car-rental/suv/) برای روستاهای کوهستانی و
      [آفرود 4x4](/car-rental/4x4/) برای اوشگولی، توشتی و گردنهٔ آبانو. پیش از تصمیم
      [آیا به 4x4 نیاز دارید](/guides/do-i-need-a-4x4-in-georgia/) را بخوانید.
    - **مه و اکتبر** - فصل طبیعی شاسی‌بلند، چون همان جاهایی که تازه باز شده‌اند دشوارترین مسیر
      ورودی را دارند.
    - **نوامبر تا آوریل** - کشور پایین، جادّهٔ آسفالت و لاستیک زمستانی روی کل ناوگان از 1 دسامبر تا
      1 آوریل. جزئیات پشت فرمان در [راهنمای رانندگی](/guides/driving-in-georgia/) آمده است.

    ## آنچه این صفحه ادعا نمی‌کند

    بازهٔ فصلی توصیهٔ ماست، نه تاریخ رسمی بازگشایی و نه وضعیت لحظه‌ای. جدا از آن، 52 مکان از 267
    مورد به‌عنوان «نه در تمام سال» علامت خورده‌اند و یک گردنهٔ بلند می‌تواند هفته‌ها دیرتر باز یا
    زودتر بسته شود. جدول بالا الگوست؛ جادّهٔ کوهستانی مشخص را در هفتهٔ سفر محلی بررسی کنید.

    وقتی ماه سفر روشن شد، انتخاب خودرو از آن بیرون می‌آید: [اجارهٔ خودرو](/car-rental/).
  faq:
  - q: "بهترین ماه برای سفر به گرجستان کدام است؟"
    a: "سپتامبر. هر 49 مسیر و 265 مکان از 267 مکان در فصل‌اند، گردنه‌های بلند هنوز بازند و برداشت انگور کاختی از اواخر سپتامبر تا اکتبر ادامه دارد."
  - q: "سفر زمستانی به گرجستان ارزش دارد؟"
    a: "بله، اگر پایین بمانید. 159 مکان در همهٔ ماه‌های سال در فصل‌اند، از جمله 26 مکان از 28 مکان تفلیس. آنچه از دست می‌دهید ارتفاعات است: بالای 2,000 متر تنها یک مکان از بیست مورد تمام‌سال است."
  - q: "جاده‌های کوهستانی کی باز می‌شوند؟"
    a: "داده‌های ما بازه‌های معمول را نشان می‌دهد نه تاریخ بازگشایی. 36 مکان، از جمله همهٔ راه‌های اوشگولی و توشتی، بازهٔ ژوئن تا سپتامبر دارند و 15 مورد از آن‌ها بالای 2,000 متر است."
  - q: "ماه مه زود است؟"
    a: "مه 229 مکان از 267 و 43 مسیر از 49 را باز می‌کند، یعنی 86 درصد کشور. تنها طبقهٔ بالایی بسته می‌ماند. برای هر چیزی زیر حدود 1,500 متر، مه عالی و بسیار آرام‌تر از ژوئیه است."
  - q: "کجا می‌توان اسکی کرد؟"
    a: "گودااوری در 2,200 متر و هاتسوالی و تتنولدی در 1,870 متر تنها رکوردهای با فصل دسامبر تا مارس هستند. راه هر دو آسفالت یا تقریباً آسفالت است، اما هر دو در ردهٔ شاسی‌بلند ثبت شده‌اند."

he:
  name: "מתי הכי כדאי לבקר בגאורגיה, חודש בחודשו"
  short: "לגאורגיה אין עונה אחת אלא שתי מדינות על מפה אחת: 60% מנובמבר עד אפריל, ו-99% מיוני עד ספטמבר."
  meta_title: "מתי כדאי לבקר בגאורגיה: חודש בחודשו | RentUp"
  meta_description: "ספרנו כמה מתוך 267 מקומות ו-49 מסלולים באמת בעונה בכל חודש. יוני עד ספטמבר פותח 99%, החורף משאיר 60%. תכננו את החודש לפי העקומה ולא לפי תחושה."
  body: |
    ## התשובה במשפט אחד

    לכל מקום במאגר שלנו יש חלון עונה, וגם לכל מסלול. כשסופרים אותם חודש בחודשו, גאורגיה מפסיקה
    להיראות כיעד אחד עם עונה אחת ומתחילה להיראות כשתי מדינות שונות שחולקות מפה.

    **מיוני עד ספטמבר 265 מתוך 267 המקומות בעונה, ו-48 או 49 מתוך 49 המסלולים פתוחים. מנובמבר עד
    אפריל זה יורד לכ-160 מקומות ול-14 עד 25 מסלולים.** מאי ואוקטובר עומדים באמצע עם 229 מקומות,
    וזו העונה שמבקרים מנוסים מעדיפים בשקט.

    ## העקומה, חודש בחודשו

    | חודש | מקומות בעונה (מתוך 267) | חלק | מסלולים בעונה (מתוך 49) |
    |---|---|---|---|
    | ינואר | 161 | 60% | 14 |
    | פברואר | 161 | 60% | 14 |
    | מרץ | 161 | 60% | 16 |
    | אפריל | 160 | 60% | 25 |
    | מאי | 229 | 86% | 43 |
    | יוני | 265 | 99% | 48 |
    | יולי | 265 | 99% | 49 |
    | אוגוסט | 265 | 99% | 49 |
    | ספטמבר | 265 | 99% | 49 |
    | אוקטובר | 229 | 86% | 43 |
    | נובמבר | 159 | 60% | 16 |
    | דצמבר | 161 | 60% | 14 |

    שני המקומות החסרים בשיא הקיץ אינם טעות: [גודאורי](/attractions/gudauri/) ו[אתרי הסקי חצוואלי
    וטטנולדי](/attractions/hatsvali-tetnuldi/) הם הרשומות היחידות במאגר שעונתן היא החורף. נובמבר
    הוא החודש הדליל בשנה, 159 מקומות: חלון הסתיו כבר נסגר ועונת הסקי עוד לא נפתחה.

    ## זה הגובה, לא לוח השנה

    | גובה | מקומות | בעונה כל השנה | הערה |
    |---|---|---|---|
    | מתחת ל-500 מ' | 108 | 86 (80%) | טביליסי, קחתי, החוף, רוב המנזרים |
    | 500-999 מ' | 85 | 56 (66%) | מורדות, ארץ היין, אימרתי |
    | 1,000-1,499 מ' | 31 | 14 (45%) | דרכי הגישה להרים |
    | 1,500-1,999 מ' | 23 | 2 (9%) | כפרים ומעברים אלפיניים |
    | מעל 2,000 מ' | 20 | 1 (5%) | 15 מהם רק מיוני עד ספטמבר |

    מתחת ל-500 מטר, ארבעה מכל חמישה מקומות שווים נסיעה בכל חודש. מעל 2,000 מטר, בדיוק אחד. אם
    המסלול שלכם נמוך, לוח השנה כמעט לא משנה; אם הוא גבוה, לוח השנה הוא המסלול.

    ## עונה אחר עונה

    **יוני עד ספטמבר.** כל 17 דרכי ה-`4x4_only`, האגמים האלפיניים,
    [אושגולי](/attractions/ushguli/), [מעבר אבאנו](/attractions/abano-pass/) וכל חוף הים השחור
    פתוחים. 36 מקומות נושאים בדיוק את החלון הזה, ו-15 מהם מעל 2,000 מ'. רק בתקופה הזאת
    [מסע סוואנטי](/routes/svaneti-expedition/) הגיוני בכלל.

    **מאי ואוקטובר.** 229 מקומות ו-43 מסלולים בעונה, כלומר הכול חוץ מהמעברים הגבוהים ביותר. בתיאור
    [מסלול היין בקחתי](/routes/kakheti-wine-loop/) כתוב שבציר הרטוולי נמשך מסוף ספטמבר לאורך
    אוקטובר: הזמן הטוב ביותר ליקבים, וגם הזמן שבו בתי ההארחה מתמלאים ראשונים.

    **נובמבר עד אפריל.** 159 מקומות בעונה בכל חודש בשנה, ואלה אינם שאריות:
    [סיגנאגי](/attractions/sighnaghi/), [אופליסציחה](/attractions/uplistsikhe/),
    [בורג'ומי](/attractions/borjomi-central-park/), קתדרלות מצחתה ו-26 מתוך 28 המקומות שאנחנו
    ממפים בטביליסי עצמה. טיול חורף בגאורגיה איננו פשרה אלא טיול אחר: נמוך יותר ושקט יותר.

    ## איזה רכב לאיזו עונה

    - **יוני עד ספטמבר, נמוך** - [רכב אקונומי](/car-rental/economy/) מכסה 181 מקומות מתוך 267.
    - **יוני עד ספטמבר, גבוה** - [רכב שטח עירוני](/car-rental/suv/) לכפרי ההרים ו[4x4
      שטח](/car-rental/4x4/) לאושגולי, לטושתי ולמעבר אבאנו. לפני שמחליטים קראו
      [האם צריך 4x4](/guides/do-i-need-a-4x4-in-georgia/).
    - **מאי ואוקטובר** - העונה הטבעית של רכב השטח העירוני, כי המקומות שרק נפתחו הם בדיוק אלה עם
      דרכי הגישה הקשות.
    - **נובמבר עד אפריל** - ארץ נמוכה, אספלט וצמיגי חורף על כל הצי מ-1 בדצמבר עד 1 באפריל. מה
      שמשתנה מאחורי ההגה מפורט ב[מדריך הנהיגה](/guides/driving-in-georgia/).

    ## מה הדף הזה איננו טוען

    חלון העונה הוא ההמלצה שלנו, לא תאריך פתיחה רשמי ולא סטטוס עדכני. בנפרד, 52 מקומות מתוך 267
    מסומנים כלא נגישים כל השנה, ומעבר גבוה עשוי להיפתח באיחור של שבועות או להיסגר מוקדם. הטבלה היא
    התבנית; את הדרך ההררית המסוימת בדקו מקומית בשבוע הנסיעה.

    כשהחודש ברור, בחירת הרכב נגזרת ממנו: [השכרת רכב](/car-rental/).
  faq:
  - q: "מה החודש הטוב ביותר לבקר בגאורגיה?"
    a: "ספטמבר. כל 49 המסלולים ו-265 מתוך 267 המקומות בעונה, המעברים הגבוהים עדיין פתוחים, ובציר הרטוולי בקחתי נמשך מסוף ספטמבר לתוך אוקטובר."
  - q: "שווה לבקר בגאורגיה בחורף?"
    a: "כן, אם נשארים נמוך. 159 מקומות בעונה בכל חודש בשנה, ובהם 26 מתוך 28 המקומות בטביליסי, יקבי קחתי, אופליסציחה ובורג'ומי. מה שמפסידים הוא ההר הגבוה: מעל 2,000 מ' רק מקום אחד מעשרים פתוח כל השנה."
  - q: "מתי נפתחות דרכי ההרים?"
    a: "בנתונים שלנו יש חלונות אופייניים ולא תאריכי פתיחה. 36 מקומות, ובהם כל הדרכים לאושגולי ולטושתי, נושאים עונה של יוני עד ספטמבר, ו-15 מהם מעל 2,000 מ'."
  - q: "מאי מוקדם מדי?"
    a: "מאי פותח 229 מקומות מתוך 267 ו-43 מסלולים מתוך 49, כלומר 86% מהמדינה. סגורה נשארת רק הקומה העליונה. לכל מה שמתחת לכ-1,500 מ' מאי מצוין ושקט הרבה יותר מיולי."
  - q: "איפה אפשר לגלוש?"
    a: "גודאורי ב-2,200 מ' וחצוואלי וטטנולדי ב-1,870 מ' הן הרשומות היחידות עם עונה של דצמבר עד מרץ. אל שתיהן מגיעים באספלט או כמעט אספלט, ובכל זאת שתיהן מסווגות רכב שטח עירוני."

ar:
