  body: |
    ## ერთადერთი გზა, სადაც პასუხი „დიახ"-ია

    ჩვენს ბაზაში ყველა სხვა მთის გზას სადღაც ასფალტიანი კომპრომისი აქვს. თუშეთს — არა.
    [აბანოს უღელტეხილი](/attractions/abano-pass/) მხოლოდ 4x4-ისთვისაა კლასიფიცირებული, ჯიპის კატეგორიით
    შეფასებული, 2850 მეტრზე მთელ ბაზაში ყველაზე მაღალი წერტილია, სეზონი ივნისი-სექტემბერი, მონიშნულია
    როგორც არა მთელი წლის განმავლობაში ღია, და ეს ერთადერთი გზაა
    [ომალოსა და თუშეთისკენ](/attractions/omalo-tusheti/). ომალოს, [დართლოსა](/attractions/dartlo/) და
    [შენაქოსა და დიკლოს](/attractions/shenako-diklo/) სამივე ეს ნიშანი ერთნაირად უწერია.

    სწორედ ამიტომაა ჩვენი [თუშეთის მაღალმთიანი მარშრუტი](/routes/tusheti-highland-hike/) ჯიპის კატეგორიით
    შეფასებული: ხუთი დღე, 430 კმ, 13:30 გზაში, სირთულე — რთული. მარშრუტის აღწერა მას მხოლოდ
    ზაფხულის, მაღალი რისკის მარშრუტად ახასიათებს, რომელსაც ძლიერი ჯიპი და გამოცდილი ადგილობრივი
    მძღოლი სჭირდება.

    ეს გვერდი განზრახ არაფერს ამატებს იმას, რაც ბაზაშია. ყველა მანძილი თბილისიდანაა, ყველა სიმაღლე,
    საფარი და სეზონი კი ზუსტად ის ველებია, რომლებიც აბანოს, ომალოს, დართლოსა და შენაქოს ჩანაწერებს
    უწერია. სადაც მონაცემები დუმს — მაგალითად, ფშაველის სიმაღლეზე ან დღევანდელ ამინდზე — ჩვენც ვდუმვართ.
    თუშეთის გზაზე დაუზუსტებელი „დაახლოებით" უფრო ძვირი ჯდება, ვიდრე ნებისმიერ სხვა გზაზე საქართველოში,
    ამიტომ ქვემოთ მხოლოდ ისაა, რისი დათვლაც შეგვიძლია.

    ## მონაკვეთების მიხედვით

    ### თბილისიდან გომბორის უღელტეხილსა და თელავამდე (0-95 კმ)

    თბილისიდან ვაზიანისკენ გადით და სართიჭალის გავლით ძველ კახეთის გზას მიჰყევით; აღმართი უჯარმის
    შემდეგ იწყება. [გომბორის უღელტეხილი](/attractions/gombori-pass/) 62 კმ და 1:20-ია, 1620 მეტრზე,
    კარგი ასფალტით, თუმცა ბოლო ოცი კილომეტრი უწყვეტი მოსახვევებია. თავად უღელტეხილზე საწვავი არ არის —
    ჩაასხით სართიჭალაში ან საგარეჯოში. [თელავი](/attractions/telavi-batonis-tsikhe/) 95 კმ და 1:45-ია,
    755 მეტრზე. მთელი მონაკვეთი ასფალტია და ეკონომითაა შეფასებული; მონაცემები აღნიშნავს, რომ
    უღელტეხილი ზამთარში დიდი თოვლის შემდეგ მოკლე ხნით შეიძლება დაიკეტოს.

    ### თელავიდან ახმეტასა და ფშაველამდე (95-150 კმ)

    თელავიდან გზა ჩრდილო-დასავლეთით ახმეტის გავლით ფშაველისკენ მიდის, ისევ ასფალტით: თბილისიდან სულ
    დაახლოებით 150 კმ და 2:30. ამ მონაკვეთზეა [ალავერდის ტაძარი](/attractions/alaverdi-cathedral/) —
    თბილისიდან 110 კმ და 2:05, 470 მეტრზე, სწორ, კარგად მოასფალტებულ გზაზე. ერთი საათი საკმარისია და
    ეს მარშრუტის პირველი დღის პირველი გაჩერებაა.

    აქ წყდება საწვავის საკითხი. მონაცემები ბოლო სადგურებად თელავს, ახმეტასა და ფშაველს ასახელებს,
    ამბობს, რომ იქიდან ომალომდე არცერთია, და ამატებს, რომ ომალოშიც კი მარაგი გარანტირებული არ არის.
    გრუნტი სავსე ავზით დაიწყეთ.

    ### ფშაველიდან აბანოს უღელტეხილამდე (150-180 კმ)

    გრუნტი ფშაველიდან იწყება: დაახლოებით 30 კმ აღმართი უღელტეხილამდე, სამი საათი. უღელტეხილი
    თბილისიდან 180 კმ და ხუთი საათია, 2850 მეტრზე. თელავიდან (755 მ) ეს დაახლოებით 2100 მეტრი
    სიმაღლის მომატებაა, უმეტესად სწორედ ამ 30 კილომეტრში. გზა ერთზოლიანია გამშვები ადგილებით და
    შეთანხმებით უპირატესობა დაღმართზე მომავალ მანქანას აქვს. ზემოთ ერთი საათი საკმარისია; მონაცემები
    აფრთხილებს, რომ ცივი ქარი და ძლიერი მზე ერთად მკაცრია.

    ### აბანოს უღელტეხილიდან ომალომდე (180-220 კმ)

    გრუნტი უღელტეხილზე გადადის და ომალომდე ჩადის: ფშაველიდან სულ სამოცდაათი კილომეტრი, რაც
    მონაცემების მიხედვით რეალურად ოთხ საათს ან მეტს ითხოვს. ომალო თბილისიდან 220 კმ და დაახლოებით
    6:30-ია გაჩერებების გარეშე, 1880 მეტრზე. წვიმის შემდეგ საფარი მკვეთრად უარესდება და მეწყერი
    ხშირია. ადგილზე რვა საათს გვთავაზობს მონაცემები, ომალოს გვერდი კი ამბობს, რომ ერთდღიან
    გასვლას აზრი არ აქვს: სულ მცირე ორი ღამე დაგეგმეთ.

    ### ომალოდან დართლოში, შენაქოსა და დიკლოში (220-235 კმ)

    ომალოდან კიდევ 15 კმ-ია ხეობის გასწვრივ დართლომდე, დაახლოებით ერთი საათი, გზაზე მდინარის
    ფონებით: თბილისიდან 228 კმ და დაახლოებით შვიდი საათი, 1980 მეტრზე. ომალოდან აღმოსავლეთით
    შენაქომდე 12 კმ მიწის გზაა, დაახლოებით ორმოცი წუთი, და კიდევ ნახევარი საათი დიკლომდე: 235 კმ და
    7:30, 2100 მეტრზე. შენაქოს გვერდი ომალოდან გზას ვიწროდ, ადგილ-ადგილ ღიად და ჯიპის საჭიროებით
    აღწერს. დიკლო სასაზღვრო ზონაა — პასპორტი ან პირადობა თან იქონიეთ.

    ## რას ამბობს მონაცემები მანქანაზე

    | ადგილი | გზა | კატეგორია | სიმაღლე | თბილისიდან | სეზონი |
    |---|---|---|---|---|---|
    | [აბანოს უღელტეხილი](/attractions/abano-pass/) | მხოლოდ 4x4 | ჯიპი 4x4 | 2850 მ | 180 კმ, 5:00 | ივნისი-სექტემბერი |
    | [ომალო](/attractions/omalo-tusheti/) | მხოლოდ 4x4 | ჯიპი 4x4 | 1880 მ | 220 კმ, 6:30 | ივნისი-სექტემბერი |
    | [დართლო](/attractions/dartlo/) | მხოლოდ 4x4 | ჯიპი 4x4 | 1980 მ | 228 კმ, 7:00 | ივნისი-სექტემბერი |
    | [შენაქო და დიკლო](/attractions/shenako-diklo/) | მხოლოდ 4x4 | ჯიპი 4x4 | 2100 მ | 235 კმ, 7:30 | ივნისი-სექტემბერი |

    ოთხი ადგილი, ოთხი ერთნაირი სტრიქონი. თუშეთში არც კროსოვერით შეფასებული ადგილია და არც
    მოასფალტებული. ომალოს გვერდი ნამდვილ მაღალი კლირენსის ჯიპსა და ღია გრუნტზე თავდაჯერებულ მძღოლს
    ითხოვს. აიღეთ [ჯიპი 4x4](/car-rental/4x4/); [კროსოვერის](/car-rental/suv/) კატეგორია ფშაველთან
    ჩერდება. კლირენსის ციფრები აქაა: [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/)

    თუ უღელტეხილის გავლა თავად არ გინდათ, აბანოს გვერდი აღნიშნავს, რომ ფშაველიდან და ალვანიდან
    ომალომდე ყოველდღე საერთო ჯიპები დადის.

    ## საუკეთესო სეზონი მონაცემებით

    თუშეთის ყველა ადგილს ივნისი-სექტემბერი უწერია და მონიშნულია როგორც არა მთელი წლის განმავლობაში
    ღია; აბანოს გვერდი უბრალოდ ამბობს — მთელი ზამთარი დაკეტილია. დართლოს, შენაქოსა და დიკლოს
    სასტუმრო სახლები მონაცემებში ივნისიდან სექტემბრამდე მუშაობს. ამ თვეების მიღმა ამ გვერდს
    შემოსათავაზებელი არაფერი აქვს.

    ## ხუთი დღე თუშეთში

    [თუშეთის მაღალმთიანი მარშრუტიდან](/routes/tusheti-highland-hike/), რომელიც დღის გეგმას
    განზრახ მოკლედ ინახავს.

    - **დღე 1** — ალავერდის ტაძარი, შემდეგ აბანოს უღელტეხილით ომალომდე.
    - **დღე 2** — ომალო.
    - **დღე 3** — დართლო, 15 კმ და ერთი საათი ხეობის გასწვრივ ფონებით.
    - **დღე 4** — შენაქო და დიკლო, 12 კმ აღმოსავლეთით და კიდევ ნახევარი საათი.
    - **დღე 5** — უკან უღელტეხილზე.

    მარშრუტის საკუთარი რჩევა ორსტრიქონიანია: გამოცდილი ადგილობრივი მძღოლი აუცილებელია და ერთი
    სათადარიგო დღე ამინდისთვის დაიტოვეთ. თუ თუშეთს ქვემოთ ღვინის მხარეს უერთებთ,
    [კახეთის ღვინის რგოლი](/routes/kakheti-wine-loop/) 420 კმ-ია, ეკონომი და მთელი წლის სეზონით —
    ამ გზის ზუსტი საპირისპირო.

    ## პატიოსანი გაფრთხილებები

    - ეს ტიპური საფარისა და სეზონის კლასიფიკაციაა და არა გზის მიმდინარე ანგარიში. აქ არაფერი ამბობს,
      რომ უღელტეხილი დღეს ღიაა — ეს ადგილზე, გასვლის წინ უნდა გადაამოწმოთ.
    - ომალოს გვერდი ცალკე აღნიშნავს: ეს ჩვეულებრივი გასეირნება არ არის. ღია გრუნტზე თავდაჯერებული
      მძღოლი გჭირდებათ და მარშრუტიც ამას ორჯერ იმეორებს.
    - აბანოსა და ომალოს გვერდები ორივე ამბობს: გადაამოწმეთ, ფარავს თუ არა თქვენი ხელშეკრულება თუშეთის
      გზას, რადგან ბევრი კომპანია მას პირდაპირ გამორიცხავს. სანამ გადაწყვეტთ, წაიკითხეთ
      [გაქირავების პირობები](/terms/) და [კითხვა-პასუხი](/faq/).
    - სამაშველო სამსახურთან დაკავშირება მხოლოდ რამდენიმე წერტილიდანაა შესაძლებელი, სადაც კავშირია.
    - დართლოში ბანკომატი არ არის და მაღაზია ფაქტობრივად არც; ნაღდი ფული, საკვები, თბილი ტანსაცმელი და
      საკუთარი წამლები თან იქონიეთ. უახლოესი საავადმყოფო საათების მანძილზეა.
    - დართლოში ღამით ივლისშიც 5-8 გრადუსია.
    - მდინარეები დილით გადაკვეთეთ.
  faq:
  - q: "თუშეთისთვის ჯიპი მჭირდება?"
    a: "დიახ, დათქმის გარეშე. აბანოს უღელტეხილი, ომალო, დართლო და შენაქო-დიკლო ჩვენს მონაცემებში ყველა მხოლოდ 4x4-ისთვისაა და ჯიპის კატეგორიით შეფასებული. თუშეთში არც კროსოვერით შეფასებული და არც მოასფალტებული ადგილია; ასფალტი ფშაველთან მთავრდება."
  - q: "როდის არის აბანოს უღელტეხილი ღია?"
    a: "ჩვენი მონაცემები თუშეთის ყველა ადგილს სეზონად ივნისი-სექტემბერს უწერს და ყველა მონიშნულია როგორც არა მთელი წლის განმავლობაში ხელმისაწვდომი. აბანოს გვერდი ამბობს — მთელი ზამთარი დაკეტილია. ჩვენ ტიპურ სეზონს ვაქვეყნებთ და არა დღევანდელ მდგომარეობას."
  - q: "რამდენ ხანს მივდივართ თბილისიდან ომალომდე?"
    a: "220 კმ და დაახლოებით 6:30 გაჩერებების გარეშე: დაახლოებით 150 კმ და 2:30 ასფალტი ფშაველამდე, შემდეგ 70 კმ გრუნტი უღელტეხილზე, რაც რეალურად ოთხ საათს ან მეტს ითხოვს."
  - q: "რა სიმაღლეზეა აბანოს უღელტეხილი?"
    a: "2850 მეტრი — მთელ ჩვენს ბაზაში ყველაზე მაღალი წერტილი. თელავიდან (755 მ) ეს დაახლოებით 2100 მეტრი აღმართია, უმეტესად ფშაველის ზემოთ 30 კმ გრუნტში."
  - q: "თუშეთში კროსოვერით შემიძლია?"
    a: "არა. ფშაველის იქით ყველა ადგილი ჯიპის კატეგორიითაა შეფასებული და ომალოს გვერდი ნამდვილ მაღალი კლირენსის ჯიპს ითხოვს. თუ უღელტეხილის გავლა თავად არ გინდათ, ფშაველიდან და ალვანიდან ომალომდე ყოველდღე საერთო ჯიპები დადის."
  - q: "სად არის ბოლო ბენზინგასამართი თუშეთამდე?"
    a: "ჩვენს მონაცემებში — თელავი, ახმეტა და ფშაველი. ფშაველსა და ომალოს შორის საწვავი არ არის, ომალოშიც კი მარაგი გარანტირებული არ არის. გრუნტი სავსე ავზით დაიწყეთ."

ru:
  name: "Дорога в Тушети: перевал Абано по участкам"
  answer: >-
    Тушетия — единственная дорога в Грузии, где внедорожник 4x4 не обсуждается: перевал Абано
    классифицирован как «только 4x4», на 2850 м это самая высокая точка дорожной базы RentUp, сезон
    с июня по сентябрь, зимой закрыт. Асфальт заканчивается в Пшавели, примерно 150 км и 2:30 от
    Тбилиси; 70 км однополосного грунта через перевал до Омало (220 км, 6:30, 1880 м) реально
    занимают четыре часа и больше. Дартло, Шенако и Дикло отмечены так же. Последняя заправка —
    Телави, Ахмета и Пшавели.
  short: "Асфальт до Пшавели, затем 70 км однополосного гравия через перевал Абано на 2850 м до Омало. Класс только 4x4, сезон июнь-сентябрь. Ровно то, что говорят наши дорожные данные."
  meta_title: "Дорога в Тушети: перевал Абано по участкам | RentUp"
  meta_description: "Дорога в Тушети по участкам: асфальт до Пшавели, 70 км гравия через перевал Абано на 2850 м, класс только 4x4 и сезон июнь-сентябрь. Омало, Дартло, Дикло."
  body: |
    ## Единственная дорога, где ответ «да»

    У любой другой горной дороги в нашей базе где-то есть асфальтовый компромисс. У Тушети его нет.
    [Перевал Абано](/attractions/abano-pass/) классифицирован как «только 4x4», отмечен категорией «внедорожник», на
    2850 м это высшая точка всей базы, сезон июнь-сентябрь, помечен как недоступный круглый год, и это
    единственный путь в [Омало и Тушети](/attractions/omalo-tusheti/). Омало,
    [Дартло](/attractions/dartlo/) и [Шенако и Дикло](/attractions/shenako-diklo/) несут те же три
    отметки.

    Поэтому наш [высокогорный маршрут по Тушети](/routes/tusheti-highland-hike/) отмечен как внедорожник:
    пять дней, 430 км, 13:30 за рулём, сложность «трудно». В описании маршрута он назван летним
    маршрутом высокого риска, требующим способного внедорожника и опытного местного водителя.

    ## По участкам

    ### Тбилиси - Гомборский перевал - Телави (0-95 км)

    Выезжайте из Тбилиси в сторону Вазиани и следуйте по старой Кахетинской дороге через
    Сартичала; подъём начинается за Уджармой. [Гомборский перевал](/attractions/gombori-pass/) -
    62 км и 1:20, 1620 м, хороший асфальт, хотя последние двадцать километров - сплошные повороты.
    На самом перевале топлива нет; заправьтесь в Сартичала или Сагареджо.
    [Телави](/attractions/telavi-batonis-tsikhe/) - 95 км и 1:45, 755 м. Весь участок асфальт и
    эконом-класс; данные отмечают, что перевал может ненадолго закрываться после сильного зимнего
    снегопада.

    ### Телави - Ахмета - Пшавели (95-150 км)

    От Телави дорога идёт на северо-запад через Ахмету к Пшавели, по-прежнему асфальт: всего около
    150 км и 2:30 от Тбилиси. На этом отрезке стоит [собор Алаверди](/attractions/alaverdi-cathedral/) -
    110 км и 2:05 от Тбилиси, 470 м, ровный ухоженный асфальт. Часа достаточно, и это первая
    остановка первого дня маршрута.

    Здесь решается вопрос с топливом. Данные называют последними станциями Телави, Ахмету и Пшавели,
    говорят, что между ними и Омало заправок нет, и добавляют, что даже в Омало запас не
    гарантирован. Начинайте гравий с полным баком.

    ### Пшавели - перевал Абано (150-180 км)

    Гравий начинается в Пшавели: около 30 км подъёма до перевала, три часа. Перевал - 180 км и пять
    часов от Тбилиси, 2850 м. От Телави на 755 м это примерно 2100 м набора высоты, большая часть -
    в этих 30 км. Дорога однополосная с карманами для разъезда, и по обычаю приоритет у машины,
    идущей вниз. Часа наверху достаточно; данные предупреждают, что холодный ветер и сильное солнце
    вместе изматывают.

    ### Перевал Абано - Омало (180-220 км)

    Гравий продолжается через перевал и вниз до Омало: всего семьдесят километров от Пшавели, на
    которые, по данным, реально уходит четыре часа и больше. Омало - 220 км и около 6:30 от Тбилиси
    без остановок, 1880 м. После дождя покрытие резко портится, оползни обычны. На месте данные
    предлагают восемь часов, а страница Омало говорит, что однодневная поездка бессмысленна:
    планируйте минимум две ночи.

    ### Омало - Дартло, Шенако и Дикло (220-235 км)

    От Омало ещё 15 км по ущелью до Дартло, примерно час, с бродами по пути: 228 км и около семи
    часов от Тбилиси, 1980 м. К востоку от Омало - 12 км грунтовки до Шенако, около сорока минут, и
    ещё полчаса до Дикло: 235 км и 7:30, 2100 м. Страница Шенако описывает дорогу из Омало как узкую,
    местами открытую и требующую внедорожника. Дикло - пограничная зона; возьмите паспорт или ID.

    ## Что данные говорят о машине

    | Место | Дорога | Категория | Высота | От Тбилиси | Сезон |
    |---|---|---|---|---|---|
    | [Перевал Абано](/attractions/abano-pass/) | только 4x4 | внедорожник 4x4 | 2850 м | 180 км, 5:00 | июнь-сентябрь |
    | [Омало](/attractions/omalo-tusheti/) | только 4x4 | внедорожник 4x4 | 1880 м | 220 км, 6:30 | июнь-сентябрь |
    | [Дартло](/attractions/dartlo/) | только 4x4 | внедорожник 4x4 | 1980 м | 228 км, 7:00 | июнь-сентябрь |
    | [Шенако и Дикло](/attractions/shenako-diklo/) | только 4x4 | внедорожник 4x4 | 2100 м | 235 км, 7:30 | июнь-сентябрь |

    Четыре места, четыре одинаковые строки. В Тушети нет ни одного места с категорией кроссовер и ни
    одного асфальтового. Страница Омало просит настоящий внедорожник с высоким клиренсом и водителя,
    уверенно чувствующего себя на открытом гравии. Берите [внедорожник 4x4](/car-rental/4x4/);
    категория [кроссовер](/car-rental/suv/) заканчивается в Пшавели. Цифры клиренса - в статье
    [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).

    Если вести через перевал самому не хочется, страница Абано отмечает, что из Пшавели и Алвани в
    Омало ежедневно ходят общие джипы.

    ## Лучший сезон по данным

    У каждого места в Тушети указан июнь-сентябрь, и все отмечены как недоступные круглый год;
    страница Абано просто говорит: закрыт всю зиму. Гостевые дома в Дартло, Шенако и Дикло работают
    в данных с июня по сентябрь. Вне этих месяцев этой странице нечего вам предложить.

    ## Пять дней в Тушети

    Из [высокогорного маршрута по Тушети](/routes/tusheti-highland-hike/), который намеренно
    держит план дня коротким.

    - **День 1** - собор Алаверди, затем через перевал Абано в Омало.
    - **День 2** - Омало.
    - **День 3** - Дартло, 15 км и час по ущелью с бродами.
    - **День 4** - Шенако и Дикло, 12 км на восток плюс полчаса дальше.
    - **День 5** - возвращение через перевал.

    Собственные советы маршрута умещаются в две строки: опытный местный водитель обязателен, и
    держите один запасной день на погоду. Если вы соединяете Тушети с винным краем внизу,
    [кахетинский винный круг](/routes/kakheti-wine-loop/) - это 420 км, эконом и сезон круглый год -
    полная противоположность этой дороге.

    ## Честные предупреждения

    - Это классификация типичного покрытия и сезона, а не сводка о состоянии дороги. Ничто здесь не
      говорит, что перевал открыт сегодня.
    - И страница Абано, и страница Омало советуют проверить, покрывает ли ваш договор дорогу в
      Тушети, потому что многие компании исключают её напрямую. Прочитайте
      [условия аренды](/terms/) и [вопросы и ответы](/faq/), прежде чем решаться.
    - Спасательные службы доступны только из нескольких точек, где есть связь.
    - В Дартло нет банкомата и фактически нет магазина; возьмите наличные, еду, тёплую одежду и свои
      лекарства. Ближайшая больница - в часах пути.
    - Ночью в Дартло даже в июле 5-8°C.
    - Реки переходите утром.
  faq:
  - q: "Нужен ли внедорожник для Тушети?"
    a: "Да, без оговорок. Перевал Абано, Омало, Дартло и Шенако-Дикло в наших данных классифицированы как только 4x4 и отмечены как внедорожник. В Тушети нет ни одного места с категорией кроссовер и ни одного асфальтового; асфальт заканчивается в Пшавели."
  - q: "Когда открыт перевал Абано?"
    a: "Наши данные указывают сезон июнь-сентябрь для каждого места в Тушети и отмечают все как недоступные круглый год. Страница Абано говорит: закрыт всю зиму. Мы публикуем типичный сезон, а не сегодняшний статус."
  - q: "Сколько ехать от Тбилиси до Омало?"
    a: "220 км и около 6:30 без остановок: примерно 150 км и 2:30 асфальта до Пшавели, затем 70 км гравия через перевал, на которые реально уходит четыре часа и больше."
  - q: "Какая высота у перевала Абано?"
    a: "2850 м, высшая точка всей нашей базы. От Телави на 755 м это около 2100 м подъёма, большая часть - в 30 км гравия выше Пшавели."
  - q: "Можно ли в Тушети на кроссовере?"
    a: "Нет. Каждое место за Пшавели отмечено как внедорожник, а страница Омало просит настоящий внедорожник с высоким клиренсом. Если не хотите вести через перевал сами, из Пшавели и Алвани в Омало ежедневно ходят общие джипы."
  - q: "Где последняя заправка перед Тушети?"
    a: "Телави, Ахмета и Пшавели по нашим данным. Между Пшавели и Омало топлива нет, и даже в Омало запас не гарантирован. Начинайте гравий с полным баком."

fa:
  name: "جادّهٔ توشتی: گردنهٔ آبانو قطعه به قطعه"
  answer: >-
    توشتی تنها جادّهٔ گرجستان است که در آن آفرود 4x4 اختیاری نیست: گردنهٔ آبانو از ردهٔ فقط-4x4 است،
    در 2,850 متر بلندترین نقطهٔ پایگاه دادهٔ جاده‌ای RentUp، با فصل ژوئن تا سپتامبر و بسته در تمام
    زمستان. آسفالت در پشاولی تمام می‌شود، حدود 150 کیلومتر و 2:30 از تفلیس؛ 70 کیلومتر جادّهٔ خاکی
    یک‌بانده از روی گردنه تا اومالو (220 کیلومتر، 6:30، 1,880 متر) در عمل چهار ساعت یا بیشتر می‌برد.
    دارتلو، شناکو و دیکلو همین رده را دارند. آخرین سوخت در تلاوی، آخمتا و پشاولی است.
  short: "آسفالت تا پشاولی، سپس 70 کیلومتر خاکی یک‌بانده از گردنهٔ آبانو در 2,850 متر تا اومالو. ردهٔ فقط 4x4، فصل ژوئن تا سپتامبر. آنچه داده‌های جادّهٔ ما می‌گوید، نه بیشتر."
  meta_title: "جادّهٔ توشتی: گردنهٔ آبانو قطعه به قطعه | RentUp"
  meta_description: "جادّهٔ توشتی قطعه به قطعه: آسفالت تا پشاولی، 70 کیلومتر خاکی از گردنهٔ آبانو در 2,850 متر، ردهٔ فقط 4x4 و فصل ژوئن تا سپتامبر. اومالو، دارتلو و دیکلو."
  body: |
    ## تنها جادّه‌ای که پاسخش «بله» است

    هر جادّهٔ کوهستانی دیگر در پایگاه دادهٔ ما جایی یک سازش آسفالتی دارد. توشتی ندارد.
    [گردنهٔ آبانو](/attractions/abano-pass/) از ردهٔ فقط-4x4 و آفرود است، در 2,850 متر بلندترین نقطهٔ
    کل داده‌های ماست، فصلش ژوئن تا سپتامبر است، «نه در تمام سال» علامت خورده و تنها راه رسیدن به
    [اومالو و توشتی](/attractions/omalo-tusheti/) است. اومالو، [دارتلو](/attractions/dartlo/) و
    [شناکو و دیکلو](/attractions/shenako-diklo/) هر سه همین نشانه‌ها را دارند.

    به همین دلیل [مسیر ارتفاعات توشتی](/routes/tusheti-highland-hike/) ما آفرود ثبت شده است: پنج روز،
    430 کیلومتر، 13:30 رانندگی، دشواری «سخت». توضیح مسیر آن را مسیری فقط تابستانی و پرخطر می‌خواند
    که 4x4 توانمند و رانندهٔ محلی باتجربه می‌خواهد.

    ## قطعه به قطعه

    ### تفلیس تا گردنهٔ گومبوری و تلاوی (0-95 کیلومتر)

    [گردنهٔ گومبوری](/attractions/gombori-pass/) 62 کیلومتر و 1:20 در 1,620 متر است، با آسفالت خوب،
    هرچند بیست کیلومتر آخر پیچ پیوسته است. روی خود گردنه سوخت نیست.
    [تلاوی](/attractions/telavi-batonis-tsikhe/) 95 کیلومتر و 1:45 در 755 متر است. کل این قطعه
    آسفالت و ردهٔ اقتصادی است.

    ### تلاوی تا آخمتا و پشاولی (95-150 کیلومتر)

    از تلاوی جادّه به شمال غرب از آخمتا به سوی پشاولی می‌رود، هنوز آسفالت: در مجموع حدود 150 کیلومتر
    و 2:30 از تفلیس. [کلیسای آلاوردی](/attractions/alaverdi-cathedral/) در همین قطعه است، 110 کیلومتر
    و 2:05 از تفلیس در 470 متر، روی آسفالت هموار. یک ساعت کافی است و این نخستین توقف روز اول مسیر
    است.

    اینجا تصمیم سوخت گرفته می‌شود. داده‌ها تلاوی، آخمتا و پشاولی را آخرین پمپ‌ها می‌نامند، می‌گویند
    بین آنجا و اومالو هیچ پمپی نیست، و می‌افزایند حتی در اومالو هم تأمین تضمین‌شده نیست. خاکی را
    با باک پر شروع کنید.

    ### پشاولی تا گردنهٔ آبانو (150-180 کیلومتر)

    خاکی از پشاولی آغاز می‌شود: حدود 30 کیلومتر سربالایی تا گردنه، سه ساعت. گردنه 180 کیلومتر و پنج
    ساعت از تفلیس در 2,850 متر است. از تلاوی در 755 متر یعنی حدود 2,100 متر صعود، بیشترش در همین 30
    کیلومتر. مسیر یک‌بانده با جای عبور است و طبق عرف، خودرویی که سرازیر می‌آید حق تقدم دارد. یک
    ساعت در بالا کافی است؛ داده‌ها هشدار می‌دهند باد سرد و آفتاب تند با هم طاقت‌فرساست.

    ### گردنهٔ آبانو تا اومالو (180-220 کیلومتر)

    خاکی از گردنه می‌گذرد و تا اومالو پایین می‌رود: در مجموع هفتاد کیلومتر از پشاولی که به گفتهٔ
    داده‌ها واقعاً چهار ساعت یا بیشتر می‌گیرد. اومالو 220 کیلومتر و حدود 6:30 از تفلیس بدون توقف، در
    1,880 متر است. پس از باران سطح به‌شدت خراب می‌شود و رانش زمین رایج است. صفحهٔ اومالو می‌گوید سفر
    یک‌روزه معنایی ندارد: دست‌کم دو شب برنامه بریزید.

    ### اومالو تا دارتلو، شناکو و دیکلو (220-235 کیلومتر)

    از اومالو 15 کیلومتر دیگر در امتداد تنگه تا دارتلو، حدود یک ساعت، با گذر از رودخانه: 228 کیلومتر
    و حدود هفت ساعت از تفلیس در 1,980 متر. در شرق اومالو 12 کیلومتر مسیر خاکی تا شناکو، حدود چهل
    دقیقه، و نیم ساعت دیگر تا دیکلو: 235 کیلومتر و 7:30 در 2,100 متر. صفحهٔ شناکو جادّه از اومالو را
    باریک، در جاهایی بی‌حفاظ و نیازمند 4x4 توصیف می‌کند. دیکلو منطقهٔ مرزی است؛ مدرک همراه داشته
    باشید.

    ## داده‌ها دربارهٔ خودرو چه می‌گویند

    | مکان | جادّه | خودرو | ارتفاع | از تفلیس | فصل |
    |---|---|---|---|---|---|
    | [گردنهٔ آبانو](/attractions/abano-pass/) | فقط 4x4 | آفرود 4x4 | 2,850 متر | 180 کیلومتر، 5:00 | ژوئن-سپتامبر |
    | [اومالو](/attractions/omalo-tusheti/) | فقط 4x4 | آفرود 4x4 | 1,880 متر | 220 کیلومتر، 6:30 | ژوئن-سپتامبر |
    | [دارتلو](/attractions/dartlo/) | فقط 4x4 | آفرود 4x4 | 1,980 متر | 228 کیلومتر، 7:00 | ژوئن-سپتامبر |
    | [شناکو و دیکلو](/attractions/shenako-diklo/) | فقط 4x4 | آفرود 4x4 | 2,100 متر | 235 کیلومتر، 7:30 | ژوئن-سپتامبر |

    چهار مکان، چهار ردیف یکسان. در توشتی نه مکانی با ردهٔ شاسی‌بلند هست و نه مکانی آسفالتی. صفحهٔ
    اومالو یک 4x4 واقعی با کلیرنس بالا و راننده‌ای راحت روی خاکی بی‌حفاظ می‌خواهد.
    [آفرود 4x4](/car-rental/4x4/) بگیرید؛ ردهٔ [شاسی‌بلند](/car-rental/suv/) در پشاولی متوقف می‌شود.
    اعداد کلیرنس در [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/) آمده است.

    اگر نمی‌خواهید خودتان گردنه را برانید، صفحهٔ آبانو می‌گوید جیپ‌های اشتراکی هر روز از پشاولی و
    آلوانی به اومالو می‌روند.

    ## بهترین فصل از داده‌ها

    هر مکان توشتی ژوئن تا سپتامبر دارد و «نه در تمام سال» علامت خورده است؛ صفحهٔ آبانو ساده می‌گوید:
    تمام زمستان بسته. مهمان‌خانه‌های دارتلو، شناکو و دیکلو در داده‌ها از ژوئن تا سپتامبر کار می‌کنند.
    بیرون از این ماه‌ها این صفحه چیزی برای شما ندارد.

    ## پنج روز در توشتی

    از [مسیر ارتفاعات توشتی](/routes/tusheti-highland-hike/).

    - **روز 1** - کلیسای آلاوردی، سپس از گردنهٔ آبانو تا اومالو.
    - **روز 2** - اومالو.
    - **روز 3** - دارتلو، 15 کیلومتر و یک ساعت در امتداد تنگه با گذر از رودخانه.
    - **روز 4** - شناکو و دیکلو، 12 کیلومتر به شرق و نیم ساعت دیگر.
    - **روز 5** - بازگشت از گردنه.

    توصیهٔ خود مسیر دو خط است: رانندهٔ محلی باتجربه ضروری است و یک روز ذخیره برای هوا نگه دارید.
    [حلقهٔ شراب کاختی](/routes/kakheti-wine-loop/) در پایین، 420 کیلومتر، اقتصادی و تمام سال، درست عکس
    این جادّه است.

    ## هشدارهای صادقانه

    - این رده‌بندی سطح و فصل معمول است، نه گزارش زندهٔ جادّه.
    - صفحه‌های آبانو و اومالو هر دو می‌گویند بررسی کنید قرارداد اجارهٔ شما جادّهٔ توشتی را می‌پوشاند یا
      نه، چون بسیاری از شرکت‌ها آن را صراحتاً مستثنا می‌کنند. [شرایط اجاره](/terms/) و
      [پرسش و پاسخ](/faq/) را بخوانید.
    - خدمات امداد فقط از چند نقطهٔ دارای آنتن در دسترس است.
    - در دارتلو خودپرداز و عملاً فروشگاهی نیست؛ پول نقد، غذا و داروی خودتان را بیاورید.
    - شب‌های دارتلو حتی در ژوئیه 5-8 درجه است.
  faq:
  - q: "برای توشتی به 4x4 نیاز دارم؟"
    a: "بله، بی‌قید و شرط. گردنهٔ آبانو، اومالو، دارتلو و شناکو-دیکلو در داده‌های ما همه فقط 4x4 و ردهٔ آفرود هستند. در توشتی هیچ مکان شاسی‌بلند یا آسفالتی نیست؛ آسفالت در پشاولی تمام می‌شود."
  - q: "گردنهٔ آبانو کی باز است؟"
    a: "داده‌های ما برای هر مکان توشتی فصل ژوئن تا سپتامبر می‌دهند و همه «نه در تمام سال» علامت خورده‌اند. صفحهٔ آبانو می‌گوید تمام زمستان بسته است. ما فصل معمول را منتشر می‌کنیم، نه وضعیت امروز را."
  - q: "رانندگی از تفلیس تا اومالو چقدر طول می‌کشد؟"
    a: "220 کیلومتر و حدود 6:30 بدون توقف: حدود 150 کیلومتر و 2:30 آسفالت تا پشاولی، سپس 70 کیلومتر خاکی از گردنه که واقعاً چهار ساعت یا بیشتر می‌گیرد."
  - q: "گردنهٔ آبانو چقدر ارتفاع دارد؟"
    a: "2,850 متر، بلندترین نقطهٔ کل داده‌های ما. از تلاوی در 755 متر حدود 2,100 متر صعود است، بیشترش در 30 کیلومتر خاکی بالای پشاولی."
  - q: "با شاسی‌بلند می‌توان به توشتی رفت؟"
    a: "نه. هر مکان پس از پشاولی ردهٔ آفرود دارد و صفحهٔ اومالو 4x4 واقعی با کلیرنس بالا می‌خواهد. اگر نمی‌خواهید خودتان برانید، جیپ‌های اشتراکی هر روز از پشاولی و آلوانی به اومالو می‌روند."

he:
  name: "הדרך לטושתי: מעבר אבאנו קטע אחר קטע"
  answer: >-
    טושתי היא הדרך היחידה בגאורגיה שבה רכב שטח 4x4 אינו בגדר בחירה: מעבר אבאנו מסווג 4x4 בלבד,
    ב-2,850 מ' הוא הנקודה הגבוהה ביותר במאגר הדרכים של RentUp, בעונה מיוני עד ספטמבר וסגור כל החורף.
    האספלט נגמר בפשאבלי, כ-150 ק"מ ו-2:30 מטביליסי; 70 הק"מ של דרך עפר חד-נתיבית מעל המעבר עד אומאלו
    (220 ק"מ, 6:30, 1,880 מ') לוקחים בפועל ארבע שעות ויותר. דארטלו, שנאקו ודיקלו מדורגים כך גם. הדלק
    האחרון בטלאווי, אחמטה ופשאבלי.
  short: "אספלט עד פשאוולי, ואז 70 ק\"מ של חצץ חד-נתיבי דרך מעבר אבאנו ב-2,850 מ' עד אומאלו. מסווג 4x4 בלבד, בעונה יוני עד ספטמבר. מה שנתוני הדרכים שלנו אומרים, לא יותר."
  meta_title: "הדרך לטושתי: מעבר אבאנו קטע אחר קטע | RentUp"
  meta_description: "הדרך לטושתי קטע אחר קטע: אספלט עד פשאוולי, 70 ק\"מ חצץ דרך מעבר אבאנו ב-2,850 מ', מסווג 4x4 בלבד ובעונה יוני עד ספטמבר. אומאלו, דארטלו ודיקלו."
  body: |
    ## הדרך היחידה שבה התשובה היא כן

    לכל דרך הרים אחרת במאגר שלנו יש איפשהו פשרה סלולה. לטושתי אין.
    [מעבר אבאנו](/attractions/abano-pass/) מסווג 4x4 בלבד, בקטגוריית שטח, ב-2,850 מ' הוא הנקודה
    הגבוהה ביותר בכל המאגר, בעונה יוני עד ספטמבר, מסומן כלא פתוח כל השנה, והוא הדרך היחידה אל
    [אומאלו וטושתי](/attractions/omalo-tusheti/). אומאלו, [דארטלו](/attractions/dartlo/)
    ו[שנאקו ודיקלו](/attractions/shenako-diklo/) נושאים את אותם שלושה סימונים.

    לכן [מסלול ההרים בטושתי](/routes/tusheti-highland-hike/) שלנו מסווג שטח: חמישה ימים, 430 ק"מ,
    13:30 נהיגה, דרגת קושי קשה. תיאור המסלול קורא לו מסלול קיצי בלבד ובסיכון גבוה, הדורש 4x4
    מסוגל ונהג מקומי מנוסה.

    ## קטע אחר קטע

    ### טביליסי למעבר גומבורי ולטלאבי (0-95 ק"מ)

    צאו מטביליסי לכיוון ואזיאני ועקבו אחרי דרך קחתי הישנה דרך סרטיצ'אלה; העלייה מתחילה אחרי
    אוג'רמה. [מעבר גומבורי](/attractions/gombori-pass/) הוא 62 ק"מ ו-1:20 ב-1,620 מ', אספלט במצב
    טוב, אף שעשרים הק"מ האחרונים הם פיתולים רצופים. על המעבר עצמו אין דלק; תדלקו בסרטיצ'אלה או
    בסגרג'ו. [טלאבי](/attractions/telavi-batonis-tsikhe/) היא 95 ק"מ ו-1:45 ב-755 מ'. כל הקטע סלול
    ומסווג אקונומי.

    ### טלאבי לאחמטה ולפשאוולי (95-150 ק"מ)

    מטלאבי הדרך פונה צפון-מערבה דרך אחמטה לעבר פשאוולי, עדיין אספלט: בסך הכול כ-150 ק"מ ו-2:30
    מטביליסי. [קתדרלת אלוורדי](/attractions/alaverdi-cathedral/) יושבת בקטע הזה, 110 ק"מ ו-2:05
    מטביליסי ב-470 מ', על אספלט שטוח ומטופח. שעה מספיקה, וזו התחנה הראשונה ביום הראשון של
    המסלול.

    כאן מתקבלת החלטת הדלק. הנתונים מכנים את טלאבי, אחמטה ופשאוולי התחנות האחרונות, אומרים שאין
    תחנה בינן לבין אומאלו, ומוסיפים שגם באומאלו האספקה איננה מובטחת. התחילו את החצץ עם מכל מלא.

    ### פשאוולי למעבר אבאנו (150-180 ק"מ)

    החצץ מתחיל בפשאוולי: כ-30 ק"מ של טיפוס עד המעבר, שלוש שעות. המעבר הוא 180 ק"מ וחמש שעות
    מטביליסי ב-2,850 מ'. מטלאבי ב-755 מ' אלה כ-2,100 מ' של עלייה, רובם ב-30 הק"מ האלה. הדרך
    חד-נתיבית עם מפרצי חלוף, ולפי הנוהג הזכות קדימה היא של הרכב היורד. שעה למעלה מספיקה; הנתונים
    מזהירים שרוח קרה ושמש חזקה יחד מתישות.

    ### מעבר אבאנו לאומאלו (180-220 ק"מ)

    החצץ נמשך דרך המעבר ויורד לאומאלו: שבעים ק"מ בסך הכול מפשאוולי, שלפי הנתונים לוקחים בפועל ארבע
    שעות ויותר. אומאלו היא 220 ק"מ וכ-6:30 מטביליסי בלי עצירות, ב-1,880 מ'. אחרי גשם פני הדרך
    מתדרדרים בחדות ומפולות שכיחות. דף אומאלו אומר שטיול יום איננו הגיוני: תכננו שני לילות לפחות.

    ### אומאלו לדארטלו, שנאקו ודיקלו (220-235 ק"מ)

    מאומאלו עוד 15 ק"מ לאורך הערוץ עד דארטלו, כשעה, עם מעברי נהר בדרך: 228 ק"מ וכשבע שעות
    מטביליסי ב-1,980 מ'. ממזרח לאומאלו 12 ק"מ של דרך עפר עד שנאקו, כארבעים דקות, ועוד חצי שעה
    לדיקלו: 235 ק"מ ו-7:30 ב-2,100 מ'. דף שנאקו מתאר את הדרך מאומאלו כצרה, חשופה במקומות ודורשת
    4x4. דיקלו היא אזור גבול; קחו דרכון או תעודת זהות.

    ## מה הנתונים אומרים על הרכב

    | מקום | דרך | רכב | גובה | מטביליסי | עונה |
    |---|---|---|---|---|---|
    | [מעבר אבאנו](/attractions/abano-pass/) | 4x4 בלבד | 4x4 שטח | 2,850 מ' | 180 ק"מ, 5:00 | יוני-ספטמבר |
    | [אומאלו](/attractions/omalo-tusheti/) | 4x4 בלבד | 4x4 שטח | 1,880 מ' | 220 ק"מ, 6:30 | יוני-ספטמבר |
    | [דארטלו](/attractions/dartlo/) | 4x4 בלבד | 4x4 שטח | 1,980 מ' | 228 ק"מ, 7:00 | יוני-ספטמבר |
    | [שנאקו ודיקלו](/attractions/shenako-diklo/) | 4x4 בלבד | 4x4 שטח | 2,100 מ' | 235 ק"מ, 7:30 | יוני-ספטמבר |

    ארבעה מקומות, ארבע שורות זהות. בטושתי אין מקום המסווג רכב שטח עירוני ואין מקום סלול. דף אומאלו
    מבקש 4x4 אמיתי עם גחון גבוה ונהג שמרגיש בנוח על חצץ חשוף. הזמינו [4x4 שטח](/car-rental/4x4/);
    קטגוריית [רכב השטח העירוני](/car-rental/suv/) נעצרת בפשאוולי. מספרי הגחון נמצאים
    ב[האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).

    אם אינכם רוצים לנהוג במעבר בעצמכם, דף אבאנו מציין שג'יפים משותפים יוצאים מדי יום לאומאלו
    מפשאוולי ומאלוואני.

    ## העונה הטובה, מהנתונים

    כל מקום בטושתי נושא יוני עד ספטמבר ומסומן כלא פתוח כל השנה; דף אבאנו פשוט אומר: סגור כל
    החורף. בתי ההארחה בדארטלו, שנאקו ודיקלו פועלים בנתונים מיוני עד ספטמבר. מחוץ לחודשים האלה לדף
    הזה אין מה להציע לכם.

    ## חמישה ימים בטושתי

    מתוך [מסלול ההרים בטושתי](/routes/tusheti-highland-hike/).

    - **יום 1** - קתדרלת אלוורדי, ואז מעבר אבאנו עד אומאלו.
    - **יום 2** - אומאלו.
    - **יום 3** - דארטלו, 15 ק"מ ושעה לאורך הערוץ עם מעברי נהר.
    - **יום 4** - שנאקו ודיקלו, 12 ק"מ מזרחה ועוד חצי שעה.
    - **יום 5** - חזרה דרך המעבר.

    העצות של המסלול עצמו הן שתי שורות: נהג מקומי מנוסה הכרחי, ושמרו יום רזרבה אחד למזג האוויר. אם
    אתם מצרפים את טושתי לארץ היין שמתחתיה, [מסלול היין בקחתי](/routes/kakheti-wine-loop/) הוא
    420 ק"מ, אקונומי ובעונה כל השנה - ההפך הגמור מהדרך הזאת.

    ## אזהרות כנות

    - זהו סיווג של פני דרך ועונה אופייניים, לא דיווח חי. שום דבר כאן לא אומר שהמעבר פתוח היום.
    - גם דף אבאנו וגם דף אומאלו אומרים לבדוק אם הסכם ההשכרה מכסה את דרך טושתי, כי חברות רבות
      מחריגות אותה במפורש. קראו את [תנאי ההשכרה](/terms/) ואת [השאלות והתשובות](/faq/).
    - שירותי חילוץ נגישים רק מכמה נקודות עם קליטה.
    - בדארטלו אין כספומט ולמעשה אין חנות; הביאו מזומן, אוכל, שכבות חמות ותרופות משלכם.
    - הלילות בדארטלו יורדים ל-5-8 מעלות גם ביולי.
  faq:
  - q: "צריך 4x4 לטושתי?"
    a: "כן, בלי סייג. מעבר אבאנו, אומאלו, דארטלו ושנאקו-דיקלו מסווגים כולם 4x4 בלבד ובקטגוריית שטח בנתונים שלנו. אין בטושתי מקום סלול או מקום המסווג רכב שטח עירוני; האספלט נגמר בפשאוולי."
  - q: "מתי מעבר אבאנו פתוח?"
    a: "הנתונים שלנו נותנים יוני עד ספטמבר לכל מקום בטושתי ומסמנים את כולם כלא פתוחים כל השנה. דף אבאנו אומר: סגור כל החורף. אנחנו מפרסמים את העונה האופיינית, לא את המצב היום."
  - q: "כמה זמן נוסעים מטביליסי לאומאלו?"
    a: "220 ק\"מ וכ-6:30 בלי עצירות: כ-150 ק\"מ ו-2:30 של אספלט עד פשאוולי, ואז 70 ק\"מ של חצץ דרך המעבר שלוקחים בפועל ארבע שעות ויותר."
  - q: "מה גובה מעבר אבאנו?"
    a: "2,850 מ', הנקודה הגבוהה ביותר בכל המאגר שלנו. מטלאבי ב-755 מ' אלה כ-2,100 מ' טיפוס, רובם ב-30 הק\"מ של חצץ מעל פשאוולי."
  - q: "אפשר לעשות את טושתי ברכב שטח עירוני?"
    a: "לא. כל מקום מעבר לפשאוולי מסווג שטח, ודף אומאלו מבקש 4x4 אמיתי עם גחון גבוה. אם אינכם רוצים לנהוג במעבר, ג'יפים משותפים יוצאים מדי יום לאומאלו מפשאוולי ומאלוואני."

ar:
  name: "الطريق إلى توشيتي: ممر أبانو مقطعاً مقطعاً"
  answer: >-
    توشيتي هي الطريق الوحيدة في جورجيا التي لا يكون فيها الدفع الرباعي الوعر 4x4 اختيارياً: ممر
    أبانو مصنّف 4x4 فقط، وهو على 2,850 متراً أعلى نقطة في قاعدة بيانات الطرق لدى RentUp، موسمه من
    يونيو إلى سبتمبر ومغلق طوال الشتاء. ينتهي الإسفلت عند بشافيلي، نحو 150 كم و2:30 من تبليسي؛ أما
    الـ70 كم من الطريق الترابي ذي المسرب الواحد فوق الممر إلى أومالو (220 كم، 6:30، 1,880 متراً)
    فتستغرق فعلياً أربع ساعات أو أكثر. دارتلو وشيناكو وديكلو تحمل التصنيف نفسه. آخر وقود في تيلافي
    وأخميتا وبشافيلي.
  short: "إسفلت حتى بشافيلي، ثم 70 كم من الحصى أحادي المسار فوق ممر أبانو على 2,850 متراً حتى أومالو. مصنّف 4x4 فقط، موسمه من يونيو إلى سبتمبر. ما تقوله بيانات طرقنا، لا أكثر."
  meta_title: "الطريق إلى توشيتي: ممر أبانو مقطعاً مقطعاً | RentUp"
  meta_description: "طريق توشيتي مقطعاً مقطعاً: إسفلت حتى بشافيلي، 70 كم من الحصى فوق ممر أبانو على 2,850 متراً، مصنّف 4x4 فقط وموسمه يونيو-سبتمبر. أومالو ودارتلو وديكلو."
  body: |
    ## الطريق الوحيد الذي جوابه نعم

    لكل طريق جبلي آخر في قاعدة بياناتنا حلّ وسط معبّد في مكان ما. توشيتي لا.
    [ممر أبانو](/attractions/abano-pass/) مصنّف 4x4 فقط بفئة دفع رباعي وعر، وهو على 2,850 متراً أعلى نقطة
    في قاعدة بياناتنا كلها، موسمه من يونيو إلى سبتمبر، مُعلّم بأنه غير مفتوح طوال السنة، وهو الطريق
    الوحيد إلى [أومالو وتوشيتي](/attractions/omalo-tusheti/). أومالو و[دارتلو](/attractions/dartlo/)
    و[شيناكو وديكلو](/attractions/shenako-diklo/) تحمل كلها العلامات الثلاث نفسها.

    لهذا صُنّف [مسار مرتفعات توشيتي](/routes/tusheti-highland-hike/) عندنا دفع رباعي وعر: خمسة أيام،
    430 كم، 13:30 قيادة، صعوبة عالية. ويصفه شرح المسار بأنه مسار صيفي فقط عالي الخطورة يتطلب سيارة
    4x4 قادرة وسائقاً محلياً خبيراً.

    ## مقطعاً مقطعاً

    ### من تبليسي إلى ممر غومبوري وتيلافي (0-95 كم)

    اخرج من تبليسي نحو فازياني واتبع طريق كاخيتي القديم عبر سارتيتشالا؛ الصعود يبدأ بعد أوجارما.
    [ممر غومبوري](/attractions/gombori-pass/) على بعد 62 كم و1:20 على 1,620 متراً، إسفلت جيد، وإن كانت
    الكيلومترات العشرون الأخيرة منعطفات متواصلة. لا وقود على الممر نفسه؛ املأ الخزان في سارتيتشالا أو
    ساغاريجو. [تيلافي](/attractions/telavi-batonis-tsikhe/) على بعد 95 كم و1:45 على 755 متراً. المقطع
    كله معبّد وفئته اقتصادية.

    ### من تيلافي إلى أخميتا وبشافيلي (95-150 كم)

    من تيلافي يتجه الطريق شمالاً غرباً عبر أخميتا نحو بشافيلي، وما زال إسفلتاً: نحو 150 كم و2:30 من
    تبليسي إجمالاً. [كاتدرائية ألافيردي](/attractions/alaverdi-cathedral/) على هذا المقطع، 110 كم
    و2:05 من تبليسي على 470 متراً، على إسفلت مستوٍ جيد. ساعة تكفي، وهي أول محطة في اليوم الأول من
    المسار.

    هنا يُحسم قرار الوقود. تسمّي البيانات تيلافي وأخميتا وبشافيلي آخر المحطات، وتقول إنه لا محطة
    بينها وبين أومالو، وتضيف أن الإمداد حتى في أومالو غير مضمون. ابدأ الحصى بخزان ممتلئ.

    ### من بشافيلي إلى ممر أبانو (150-180 كم)

    يبدأ الحصى عند بشافيلي: نحو 30 كم من الصعود حتى الممر في ثلاث ساعات. الممر على بعد 180 كم وخمس
    ساعات من تبليسي على 2,850 متراً. من تيلافي على 755 متراً هذا نحو 2,100 متر من الصعود، معظمه في
    هذه الكيلومترات الثلاثين. الدرب أحادي المسار بأماكن للتخطي، وبحسب العرف الأولوية للسيارة النازلة.
    ساعة في الأعلى تكفي؛ تحذّر البيانات من أن الريح الباردة والشمس القوية معاً قاسيتان.

    ### من ممر أبانو إلى أومالو (180-220 كم)

    يستمر الحصى فوق الممر ونزولاً إلى أومالو: سبعون كيلومتراً من بشافيلي إجمالاً، تقول البيانات إنها
    تستغرق واقعياً أربع ساعات أو أكثر. أومالو على بعد 220 كم ونحو 6:30 من تبليسي بلا توقف، على
    1,880 متراً. بعد المطر يتدهور السطح بحدة والانهيارات الأرضية شائعة. تقول صفحة أومالو إن رحلة
    اليوم الواحد بلا معنى: خطط لليلتين على الأقل.

    ### من أومالو إلى دارتلو وشيناكو وديكلو (220-235 كم)

    من أومالو 15 كم أخرى بمحاذاة المضيق إلى دارتلو، نحو ساعة، مع مخاضات نهرية في الطريق: 228 كم ونحو
    سبع ساعات من تبليسي على 1,980 متراً. وشرق أومالو 12 كم من الدرب الترابي إلى شيناكو، نحو أربعين
    دقيقة، ونصف ساعة أخرى إلى ديكلو: 235 كم و7:30 على 2,100 متر. تصف صفحة شيناكو الطريق من أومالو
    بأنه ضيق ومكشوف في مواضع ويحتاج 4x4. ديكلو منطقة حدودية؛ احمل جواز السفر أو الهوية.

    ## ما تقوله البيانات عن السيارة

    | المكان | الطريق | السيارة | الارتفاع | من تبليسي | الموسم |
    |---|---|---|---|---|---|
    | [ممر أبانو](/attractions/abano-pass/) | 4x4 فقط | دفع رباعي 4x4 | 2,850 م | 180 كم، 5:00 | يونيو-سبتمبر |
    | [أومالو](/attractions/omalo-tusheti/) | 4x4 فقط | دفع رباعي 4x4 | 1,880 م | 220 كم، 6:30 | يونيو-سبتمبر |
    | [دارتلو](/attractions/dartlo/) | 4x4 فقط | دفع رباعي 4x4 | 1,980 م | 228 كم، 7:00 | يونيو-سبتمبر |
    | [شيناكو وديكلو](/attractions/shenako-diklo/) | 4x4 فقط | دفع رباعي 4x4 | 2,100 م | 235 كم، 7:30 | يونيو-سبتمبر |

    أربعة أماكن وأربعة صفوف متطابقة. لا مكان في توشيتي مصنّف دفعاً رباعياً خفيفاً ولا مكان معبّد.
    تطلب صفحة أومالو سيارة 4x4 حقيقية عالية الخلوص وسائقاً مرتاحاً على الحصى المكشوف. احجز
    [الدفع الرباعي 4x4](/car-rental/4x4/)؛ فئة [الدفع الرباعي الخفيف](/car-rental/suv/) تتوقف عند
    بشافيلي. أرقام الخلوص في [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).

    وإن كنت لا تريد قيادة الممر بنفسك، تذكر صفحة أبانو أن جيبات مشتركة تنطلق يومياً إلى أومالو من
    بشافيلي وألفاني.

    ## أفضل موسم من البيانات

    كل مكان في توشيتي يحمل يونيو-سبتمبر ومُعلّم بأنه غير مفتوح طوال السنة؛ وصفحة أبانو تقول ببساطة:
    مغلق طوال الشتاء. بيوت الضيافة في دارتلو وشيناكو وديكلو تعمل في البيانات من يونيو إلى سبتمبر.
    خارج هذه الأشهر ليس لدى هذه الصفحة ما تقدّمه لك.

    ## خمسة أيام في توشيتي

    من [مسار مرتفعات توشيتي](/routes/tusheti-highland-hike/).

    - **اليوم 1** - كاتدرائية ألافيردي، ثم ممر أبانو حتى أومالو.
    - **اليوم 2** - أومالو.
    - **اليوم 3** - دارتلو، 15 كم وساعة بمحاذاة المضيق مع مخاضات.
    - **اليوم 4** - شيناكو وديكلو، 12 كم شرقاً ونصف ساعة أخرى.
    - **اليوم 5** - العودة عبر الممر.

    نصائح المسار نفسه سطران: السائق المحلي الخبير ضروري، واحتفظ بيوم احتياطي للطقس. وإن كنت تقرن
    توشيتي بأرض النبيذ تحتها، فـ[مسار نبيذ كاخيتي](/routes/kakheti-wine-loop/) 420 كم، اقتصادي وفي
    الموسم طوال السنة - نقيض هذا الطريق تماماً.

    ## تحذيرات أمينة

    - هذا تصنيف للسطح والموسم المعتادين لا تقرير حيّ. لا شيء هنا يقول إن الممر مفتوح اليوم.
    - تقول صفحتا أبانو وأومالو تحقق مما إذا كان عقد الإيجار يغطي طريق توشيتي، لأن شركات كثيرة تستثنيه
      صراحة. اقرأ [شروط الإيجار](/terms/) و[الأسئلة الشائعة](/faq/).
    - خدمات الإنقاذ لا تُبلَغ إلا من نقاط قليلة فيها تغطية.
    - لا صرّاف آلي في دارتلو ولا متجر فعلياً؛ أحضر النقد والطعام والطبقات الدافئة وأدويتك.
    - ليالي دارتلو تهبط إلى 5-8 درجات حتى في يوليو.
  faq:
  - q: "هل أحتاج دفعاً رباعياً إلى توشيتي؟"
    a: "نعم بلا تحفّظ. ممر أبانو وأومالو ودارتلو وشيناكو-ديكلو كلها مصنّفة 4x4 فقط بفئة دفع رباعي وعر في بياناتنا. لا مكان في توشيتي معبّد أو مصنّف دفعاً رباعياً خفيفاً؛ الإسفلت ينتهي عند بشافيلي."
  - q: "متى يُفتح ممر أبانو؟"
    a: "تعطي بياناتنا موسم يونيو-سبتمبر لكل مكان في توشيتي وتعلّمها كلها بأنها غير متاحة طوال السنة. وتقول صفحة أبانو: مغلق طوال الشتاء. نحن ننشر الموسم المعتاد لا حالة اليوم."
  - q: "كم تستغرق القيادة من تبليسي إلى أومالو؟"
    a: "220 كم ونحو 6:30 بلا توقف: نحو 150 كم و2:30 إسفلت حتى بشافيلي، ثم 70 كم حصى فوق الممر تستغرق واقعياً أربع ساعات أو أكثر."
  - q: "ما ارتفاع ممر أبانو؟"
    a: "2,850 متراً، أعلى نقطة في قاعدة بياناتنا كلها. من تيلافي على 755 متراً هذا نحو 2,100 متر صعود، معظمه في الكيلومترات الثلاثين من الحصى فوق بشافيلي."
  - q: "هل أستطيع توشيتي بدفع رباعي خفيف؟"
    a: "لا. كل مكان بعد بشافيلي مصنّف دفع رباعي وعر، وصفحة أومالو تطلب 4x4 حقيقية عالية الخلوص. وإن لم ترد قيادة الممر، تنطلق جيبات مشتركة يومياً إلى أومالو من بشافيلي وألفاني."
