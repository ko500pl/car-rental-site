  short: "ასფალტი ფშაველამდე, შემდეგ 70 კმ ერთზოლიანი გრუნტი აბანოს უღელტეხილზე 2850 მეტრზე ომალომდე. მხოლოდ 4x4, სეზონი ივნისი-სექტემბერი. რასაც ჩვენი გზის მონაცემები ამბობს — არც მეტი."
