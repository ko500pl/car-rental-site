en:
  name: "The Road to Tusheti: the Abano Pass, Segment by Segment"
  answer: >-
    Tusheti is the one road in Georgia where an off-road 4x4 is not optional: the Abano Pass is
    classed 4x4-only, at 2,850 m the highest point in RentUp's road database, in season June to
    September and closed all winter. The asphalt ends at Pshaveli, about 150 km and 2h30 from
    Tbilisi; the 70 km of single-lane gravel over the pass to Omalo (220 km, 6h30, 1,880 m)
    realistically take four hours or more. Dartlo, Shenako and Diklo carry the same rating. The last
    fuel is in Telavi, Akhmeta and Pshaveli.
  short: "Asphalt to Pshaveli, then 70 km of single-lane gravel over the Abano Pass at 2,850 m to Omalo. Classed 4x4-only, in season June to September. What our road data says, no more."
  meta_title: "Road to Tusheti: Abano Pass Road Guide | RentUp"
  meta_description: "The Tusheti road segment by segment: asphalt to Pshaveli, then 70 km of gravel over the Abano Pass at 2,850 m, classed 4x4-only and June to September only."
  body: |
    ## The one road where the answer is yes

    Every other mountain road in our database has a paved compromise somewhere. Tusheti does not.
    The [Abano Pass](/attractions/abano-pass/) is classed 4x4-only, rated off-road, at 2,850 m the
    highest point in our whole dataset, in season June to September, flagged as not open all year,
    and it is the only way in to [Omalo and Tusheti](/attractions/omalo-tusheti/). Omalo,
    [Dartlo](/attractions/dartlo/) and [Shenako and Diklo](/attractions/shenako-diklo/) all carry
    the same three flags.

    That is why our [Tusheti highland route](/routes/tusheti-highland-hike/) is rated off-road,
    five days, 430 km, 13h30 of driving, difficulty hard. The route notes describe it as a
    summer-only, high-risk route requiring a capable 4x4 and an experienced local driver.

    ## Segment by segment

    ### Tbilisi to the Gombori Pass and Telavi (0-95 km)

    Leave Tbilisi towards Vaziani and follow the old Kakheti road through Sartichala; the climb
    begins beyond Ujarma. The [Gombori Pass](/attractions/gombori-pass/) is 62 km and 1h20 out at
    1,620 m, asphalt in good condition, though the last twenty kilometres are continuous bends.
    There is no fuel on the pass itself; fill up in Sartichala or Sagarejo.
    [Telavi](/attractions/telavi-batonis-tsikhe/) is 95 km and 1h45 at 755 m. The whole section is
    paved and rated economy, and the data notes the pass can close briefly after heavy winter snow.

    ### Telavi to Akhmeta and Pshaveli (95-150 km)

    From Telavi the road runs north-west through Akhmeta towards Pshaveli, still asphalt: about
    150 km and 2h30 from Tbilisi in total. [Alaverdi Cathedral](/attractions/alaverdi-cathedral/)
    sits on this stretch, 110 km and 2h05 from Tbilisi at 470 m on flat, well-surfaced asphalt.
    An hour is enough, and it is the first stop on the route's day one.

    This is where the fuel decision is made. Our data names Telavi, Akhmeta and Pshaveli as the
    last stations, says there is none between there and Omalo, and adds that even in Omalo supply
    is not guaranteed. Start the gravel with a full tank.

    ### Pshaveli to the Abano Pass (150-180 km)

    The gravel begins at Pshaveli: about 30 km of climbing to the pass, taking three hours. The
    pass is 180 km and five hours from Tbilisi at 2,850 m. From Telavi at 755 m that is roughly
    2,100 m of altitude gain, most of it in these 30 km. The track is single-lane with passing
    places, and by convention the vehicle coming downhill has priority. An hour at the top is
    enough; the data warns that cold wind and strong sun together are punishing.

    ### The Abano Pass to Omalo (180-220 km)

    The gravel continues over the pass and down to Omalo: seventy kilometres from Pshaveli in total,
    which the data says realistically takes four hours or more. Omalo is 220 km and about 6h30 from
    Tbilisi without stops, at 1,880 m. After rain the surface deteriorates sharply and landslides are
    common. Eight hours on site is the data's suggestion, and the Omalo page says a day trip makes
    no sense: plan at least two nights.

    ### Omalo to Dartlo, Shenako and Diklo (220-235 km)

    From Omalo it is a further 15 km along the gorge to Dartlo, roughly an hour, with river fords on
    the way: 228 km and about seven hours from Tbilisi at 1,980 m. East of Omalo it is 12 km of
    dirt track to Shenako, about forty minutes, and another half hour to Diklo: 235 km and 7h30 at
    2,100 m. The Shenako page describes the road from Omalo as narrow, exposed in places and needing
    a 4x4. Diklo is a border zone; carry a passport or ID.

    ## What the data says about the car

    | Place | Road | Car | Altitude | From Tbilisi | Season |
    |---|---|---|---|---|---|
    | [Abano Pass](/attractions/abano-pass/) | 4x4-only | off-road 4x4 | 2,850 m | 180 km, 5h00 | June to September |
    | [Omalo](/attractions/omalo-tusheti/) | 4x4-only | off-road 4x4 | 1,880 m | 220 km, 6h30 | June to September |
    | [Dartlo](/attractions/dartlo/) | 4x4-only | off-road 4x4 | 1,980 m | 228 km, 7h00 | June to September |
    | [Shenako and Diklo](/attractions/shenako-diklo/) | 4x4-only | off-road 4x4 | 2,100 m | 235 km, 7h30 | June to September |

    Four places, four identical rows. There is no SUV-rated place in Tusheti and no paved one. The
    Omalo page asks for a genuine high-clearance 4x4 and a driver comfortable with exposed gravel.
    Book the [off-road 4x4](/car-rental/4x4/); the [SUV](/car-rental/suv/) category stops at
    Pshaveli. The clearance numbers behind that are in
    [Do you need a 4x4 in Georgia?](/guides/do-i-need-a-4x4-in-georgia/).

    If you would rather not drive the pass, the Abano page notes that shared jeeps run daily to
    Omalo from Pshaveli and Alvani.

    ## Best season, from the data

    Every Tusheti place carries June to September and is flagged as not open all year; the Abano
    page simply says closed all winter. Guesthouses in Dartlo, Shenako and Diklo operate June to
    September in the data. Outside those months this page has nothing to offer you.

    ## Five days in Tusheti

    Drawn from the [Tusheti highland route](/routes/tusheti-highland-hike/), which keeps the day
    plan deliberately sparse.

    - **Day 1** - Alaverdi Cathedral, then the Abano Pass to Omalo.
    - **Day 2** - Omalo.
    - **Day 3** - Dartlo, 15 km and an hour along the gorge with fords.
    - **Day 4** - Shenako and Diklo, 12 km east plus half an hour on.
    - **Day 5** - return over the pass.

    The route's own tips are two lines long: an experienced local driver is essential, and keep one
    weather-buffer day. If you are pairing Tusheti with the wine country below it, the
    [Kakheti wine loop](/routes/kakheti-wine-loop/) is 420 km, rated economy and in season all year -
    the exact opposite of this road.

    ## Honest warnings

    - This is a classification of typical surface and season, not a live road report. Nothing here
      says the pass is open today.
    - Both the Abano and Omalo pages say to check whether your rental agreement covers the Tusheti
      road, because many companies exclude it outright. Read the [rental terms](/terms/) and the
      [FAQ](/faq/) before you commit.
    - Rescue services can only be reached from a few points with signal.
    - There is no ATM and effectively no shop in Dartlo; bring cash, food, warm layers and your own
      medication. The nearest hospital is hours away.
    - Nights drop to 5-8°C in Dartlo even in July.
    - Cross rivers in the morning; the data repeats this for Adishi-style tracks and for Dartlo.
  faq:
  - q: "Do I need a 4x4 for Tusheti?"
    a: "Yes, without qualification. The Abano Pass, Omalo, Dartlo and Shenako-Diklo are all classed 4x4-only and rated off-road in our data. There is no SUV-rated or paved place in Tusheti; the asphalt ends at Pshaveli."
  - q: "When is the Abano Pass open?"
    a: "Our data gives June to September as the season for every Tusheti place and flags all of them as not open year-round. The Abano page says closed all winter. We publish the typical season, not today's status."
  - q: "How long does the drive from Tbilisi to Omalo take?"
    a: "220 km and about 6h30 without stops: roughly 150 km and 2h30 of asphalt to Pshaveli, then 70 km of gravel over the pass that realistically takes four hours or more."
  - q: "How high is the Abano Pass?"
    a: "2,850 m, the highest point in our whole dataset. From Telavi at 755 m that is about 2,100 m of climbing, most of it in the 30 km of gravel above Pshaveli."
  - q: "Can I do Tusheti in a crossover?"
    a: "No. Every place beyond Pshaveli is rated off-road, and the Omalo page asks for a genuine high-clearance 4x4. If you do not want to drive the pass, shared jeeps run daily to Omalo from Pshaveli and Alvani."
  - q: "Where is the last fuel before Tusheti?"
    a: "Telavi, Akhmeta and Pshaveli in our data. There is no fuel between Pshaveli and Omalo, and even in Omalo supply is not guaranteed. Start the gravel with a full tank."

