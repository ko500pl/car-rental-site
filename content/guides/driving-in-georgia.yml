  short: "საქართველო პატარა ქვეყანაა, გზები კი ნელი. 267 გაზომილი მარშრუტი თბილისიდან გვიჩვენებს, რამდენად გრძელია რეალურად თქვენი დღე."
  meta_title: "მართვა საქართველოში: მანძილები და დრო | RentUp"
  meta_description: "არა ბლოგი, არამედ ოპერატორის ციფრები: მედიანური სიჩქარე საფარის მიხედვით, 267 გაზომილი მარშრუტი თბილისიდან და დღის რეალურად დაგეგმვის მარტივი წესი."
  body: |
    ## ქვეყანა პატარაა, გზები კი — ნელი

    თბილისიდან ბათუმამდე 370 კილომეტრია. ევროპის უმეტეს ნაწილში ეს სამნახევარი საათია. აქ — 5 საათი
    და 30 წუთი, და ეს პესიმიზმი არ არის: ზუსტად ეს დროა გამოქვეყნებული
    [ბათუმის ბულვარის](/attractions/batumi-boulevard-old-town/) გვერდზე.

    თბილისიდან მანძილი და გზაში გასატარებელი დრო შევსებული გვაქვს 267 ჩანაწერიდან 267-ზე, ხარვეზების
    გარეშე. თუ ერთს მეორეზე გავყოფთ იმ 229 ადგილისთვის, რომელიც დედაქალაქიდან 40 კილომეტრზე შორსაა,
    მივიღებთ რიცხვს, რომელზეც ღირს დაგეგმვა: **გზის მედიანური სიჩქარე საქართველოში 61 კმ/სთ-ია.**
    არა 90. არა სიჩქარის ლიმიტი. სამოცდაერთი.

    ## სიჩქარე საფარის მიხედვით, გაზომილი

    | გზის კლასი | გაზომილი ადგილი | მედიანური სიჩქარე | რა გაფერხებთ |
    |---|---|---|---|
    | ასფალტი | 120 | 66 კმ/სთ | სოფლები, ტრაქტორები, ერთზოლიანი გასწრება |
    | უმეტესად ასფალტი | 69 | 60 კმ/სთ | დაზიანებული ბოლო მონაკვეთი ან მთის ასასვლელი |
    | გრუნტი | 23 | 49 კმ/სთ | გრუნტი, ღელეები, ჩარეცხვები |
    | მხოლოდ 4x4 | 17 | 42 კმ/სთ | ნამდვილი მთის გზა |

    ქვეყნის საუკეთესო ასფალტზეც კი კარიდან კარამდე საშუალო 66 კმ/სთ გამოგდით. ასფალტსა და 4x4-ის
    გზას შორის სხვაობა მცირე ჯარიმა არ არის — ეს დაგეგმილი დღის 36%-ის ჩამოჭრაა.

    ## ერთი და იგივე 100 კილომეტრი არასოდეს არის ერთი და იგივე საათი

    | მიმართულება | მანძილი თბილისიდან | გზაში | გამომდინარე სიჩქარე |
    |---|---|---|---|
    | [უფლისციხე](/attractions/uplistsikhe/) | 100 კმ | 1:25 | 71 კმ/სთ |
    | [სიღნაღი](/attractions/sighnaghi/) | 110 კმ | 1:50 | 60 კმ/სთ |
    | [ანანურის ციხე](/attractions/ananuri-fortress/) | 70 კმ | 1:20 | 53 კმ/სთ |
    | [გერგეტის სამება](/attractions/gergeti-trinity-church/) | 160 კმ | 3:10 | 51 კმ/სთ |
    | [ბათუმი](/attractions/batumi-boulevard-old-town/) | 370 კმ | 5:30 | 67 კმ/სთ |
    | [მესტია](/attractions/mestia/) | 470 კმ | 8:30 | 55 კმ/სთ |

    ანანურამდე სულ 70 კილომეტრია და მაინც საათსა და ოც წუთს ითხოვს, რადგან სამხედრო გზა თითქმის
    მაშინვე იწყებს აღმართს. უფლისციხე უფრო შორსაა და უფრო სწრაფად მიდიხართ, რადგან ის ავტობანის
    გვერდითაა. **მანძილი აქ თითქმის არაფერს განსაზღვრავს; საფარი და რელიეფი — თითქმის ყველაფერს.**

    ## დაგეგმვის წესი, რომელიც რეალობას უძლებს

    დღის კილომეტრაჟი გაყავით 60-ზე და არა 90-ზე. მერე დაუმატეთ გაჩერებები. ჩვენი მრავალდღიანი გეგმები
    ზუსტად ასეა აწყობილი და არითმეტიკა თავად შეგიძლიათ გადაამოწმოთ:

    | გეგმა | სულ მანძილი | სულ გზაში | გამომდინარე საშუალო |
    |---|---|---|---|
    | [3 დღე](/itineraries/georgia-3-days/) | 420 კმ | 8:00 | 53 კმ/სთ |
    | [7 დღე](/itineraries/georgia-7-days/) | 1020 კმ | 18:30 | 55 კმ/სთ |
    | [10 დღე](/itineraries/georgia-10-days/) | 1450 კმ | 27:00 | 54 კმ/სთ |
    | [14 დღე](/itineraries/georgia-14-days/) | 2040 კმ | 39:30 | 52 კმ/სთ |

    ოთხივე გეგმა დამოუკიდებლადაა აწყობილი და ოთხივე 52-დან 55 კმ/სთ-მდე დიაპაზონში ჯდება, როცა
    რეალურ გაჩერებებს გაითვალისწინებთ. თუ ვინმეს გეგმა ამაზე მეტს გვთავაზობს, ის რუკას უყურებდა და
    არა გზას.

    იგივე ჩანს მარშრუტების ბაზაშიც. საიტზე 49 აღწერილი მარშრუტია, ჯამში თითქმის 19 700 კილომეტრი.
    სირთულის მიხედვით ისინი ასე ნაწილდება: 21 მარშრუტი მარტივია, 23 — საშუალო და მხოლოდ 5 — რთული.
    კატეგორიით: 21 ეკონომია, 23 კროსოვერი და 5 ჯიპი. ანუ ქართული მოგზაურობის უმეტესობა არც ტექნიკურად
    რთულია და არც სპეციალურ ავტომობილს ითხოვს — უბრალოდ დროს ითხოვს, და მეტს, ვიდრე რუკა გპირდებათ.

    ## სად მთავრდება ასფალტი

    267 ადგილიდან 154 ასფალტითაა პარკინგამდე, კიდევ 73 — ასფალტით, უხეში ან ციცაბო ბოლო მონაკვეთით.
    რჩება 40 ადგილი, ანუ 15%, გრუნტსა და ნამდვილ მთის გზებზე. თუ ამ ორმოცში არცერთი არაა თქვენს
    სიაში, საფარი დღეს ვერასოდეს გაგიფუჭებთ და მთელ მარშრუტს [ეკონომ-კლასი](/car-rental/economy/)
    ფარავს. თუ რომელიმე მაინც დგას, ჯავშნამდე წაიკითხეთ
    [გჭირდებათ თუ არა ჯიპი](/guides/do-i-need-a-4x4-in-georgia/) — არჩეული კატეგორია იმასაც
    განსაზღვრავს, რას ფარავს ხელშეკრულება.

    ## მთა, დახრილობა და დღის სინათლე

    საქართველოში სირთულე ვერტიკალურია და არა ჰორიზონტალური. ჩვენს ბაზაში ოცი ადგილი 2000 მეტრზე
    მაღლა დგას, უმაღლესი კი — აბანოს უღელტეხილი, 2850 მეტრი. ასეთ გზებზე:

    - დაღმართზე დაბალი გადაცემით ჩადით და არა მუხრუჭებით. გრძელი დაღმართი მუხრუჭს ახურებს, გასაჩერებელი
      ადგილი კი ცოტაა.
    - ბრმა სერპანტინზე საქონელს ელოდეთ. ძროხა, ღორი და ცხვარი პრაქტიკაში აბსოლუტური უპირატესობით
      სარგებლობს.
    - ორზოლიან მთის გზაზე გასწრება ის ადგილია, სადაც სტუმრებს ყველაზე ხშირად მოსდით უბედურება. ამ
      ქვეყანაში არცერთი მარშრუტი არ ფუჭდება დაკარგული ხუთი წუთის გამო.
    - დაგეგმეთ ისე, რომ ბინდამდე მიხვიდეთ. განათების გარეშე გზა, უნიშნო კიდეები და პირუტყვი ცუდად
      ერწყმის ერთმანეთს.

    ჩვენი [სამხედრო გზის მარშრუტი](/routes/military-highway-kazbegi/) სწორედ ამიტომაა კროსოვერით და
    საშუალო სირთულით შეფასებული, თუმცა თავად ასფალტი კარგია.

    ## ზამთარი

    ჩვენი ავტოპარკის ყველა ავტომობილი 1 დეკემბრიდან 1 აპრილამდე ზამთრის საბურავებზეა. ეს აღჭურვილობაა
    და არა გამოსავალი — ზამთრის საბურავი სამუხრუჭე მანძილს ამოკლებს, ყინულს კი არ აუქმებს. 267
    ადგილიდან 52 მონიშნულია როგორც არა მთელი წლის განმავლობაში ხელმისაწვდომი და პირველად სწორედ მაღალი
    უღელტეხილები იკეტება. სეზონური დეტალები ცალკე გვაქვს აღწერილი
    [ზამთრის მოგზაურობის სტატიაში](/blog/zamtris-mgzavroba-saqartveloshi/), ხოლო
    [როდის ჯობია ჩამოსვლა](/guides/best-time-to-visit-georgia/) გვიჩვენებს, თვე-თვე როგორ იხსნება და
    იკეტება რუკა.

    ## საწვავი, მარაგი და თავად ავტომობილი

    ჩვენი დამგეგმავი საწვავს 8.5 ლ/100 კმ-ზე ითვლის — ეს შერეული რეჟიმის რეალური მაჩვენებელია
    საშუალო კლასის მანქანისთვის ქართულ გზებზე და არა საბროშურო ციფრი. ორი პრაქტიკული დასკვნა:

    - **მთაში ბაკი ნახევრიდან შეავსეთ და არა ნათურის ანთების შემდეგ.** 1500 მეტრს ზემოთ გასამართი
      სადგურები მკვეთრად მცირდება.
    - **400-კილომეტრიანი დღე სრული დღეა.** 55 კმ/სთ-ზე ეს შვიდ საათზე მეტია საჭესთან, ერთი
      გაჩერების გარეშეც.

    ჩვენს ავტოპარკში ჩვიდმეტი მოდელიდან თხუთმეტი ავტომატურია — მხოლოდ ორი დიდი მიკროავტობუსია
    მექანიკური. მთის გზაზე ეს იმაზე მეტს ნიშნავს, ვიდრე ჩვეულებრივ ჰგონიათ: სერპანტინზე ორივე ხელი
    საჭეზე გჭირდებათ და გადაცემის კოლოფზე ფიქრი ზედმეტია.

    ## დოკუმენტები, ჯარიმები და ხელშეკრულება

    დოკუმენტები, მინიმალური ასაკი, დაზღვევა, დეპოზიტი და ჯარიმების საკითხი კომერციული პირობებია და
    იცვლება. აქ მათ არ ვიმეორებთ, რადგან მოძველებული ციფრი უარესია, ვიდრე ციფრის არარსებობა:
    წაიკითხეთ [პირობების გვერდზე](/terms/) და [კითხვა-პასუხში](/faq/), დანარჩენი კი ხელმოწერამდე
    გვკითხეთ.

    ## სანამ დაიძვრებით

    - გადაამოწმეთ თითოეული ადგილის გზის კლასი და სეზონი — ისინი
      [ღირსშესანიშნაობის გვერდზეა](/attractions/ushguli/).
    - დღის კილომეტრაჟი გაყავით 60-ზე და დაუმატეთ გაჩერებები.
    - გადაბარებისას გადაუღეთ მანქანას ოთხივე მხრიდან და დააფიქსირეთ საწვავი და გარბენი.
    - კატეგორია აირჩიეთ მარშრუტის ყველაზე რთული და არა ყველაზე მარტივი გზის მიხედვით:
      [ეკონომი](/car-rental/economy/), [კროსოვერი](/car-rental/suv/) ან
      [ჯიპი 4x4](/car-rental/4x4/).

    დაგეგმვა აქ იწყება: [ავტომობილის დაქირავება](/car-rental/).
  faq:
  - q: "რეალურად რამდენი დრო სჭირდება თბილისიდან ბათუმამდე?"
    a: "ბათუმისთვის ჩვენ 370 კმ-სა და 5:30-ს ვაქვეყნებთ, ანუ 67 კმ/სთ-ს. ესეც ქვეყნის ერთ-ერთ საუკეთესო გზაზე. ვინც ოთხ საათს გპირდებათ, რუკას უყურებს და არა გზას."
  - q: "უსაფრთხოა თუ არა მართვა საქართველოში სტუმრისთვის?"
    a: "სირთულე მთის გზებია და არა ტრაფიკის სიხშირე. საქონელი ბრმა მოსახვევში, გრძელი ციცაბო დაღმართები და ორზოლიან გზაზე გასწრება — ეს სამი ქმნის პრობლემების უმეტესობას. თუ ლიმიტის ნაცვლად 61 კმ/სთ-ის მედიანაზე იმგზავრებთ, რისკის დიდი ნაწილი ქრება."
  - q: "რა საშუალო სიჩქარეზე დავგეგმო?"
    a: "საათში სამოცი კილომეტრი, გაჩერებებამდე. თბილისიდან 229 გაზომილ მარშრუტზე მედიანური სიჩქარე 61 კმ/სთ-ია, ჩვენი სამ-, შვიდ-, ათ- და თოთხმეტდღიანი გეგმები კი გაჩერებების ჩათვლით 52-55 კმ/სთ-ში ჯდება."
  - q: "ცუდია თუ არა ქართული გზები?"
    a: "ძირითადად არა. 267 ადგილიდან 154-მდე ასფალტია პარკინგამდე და კიდევ 73-მდე — ასფალტი უხეში ბოლო მონაკვეთით. მხოლოდ 40 დგას გრუნტსა და მთის გზებზე და ჩვენ ყველა მათგანს ვასახელებთ."
  - q: "ზამთრის საბურავები მჭირდება?"
    a: "ჩვენი ავტომობილები 1 დეკემბრიდან 1 აპრილამდე ზამთრის საბურავებზეა, ანუ თქვენ არაფრის მოგვარება არ გიწევთ. ჯაჭვები და მთის პირობები ცალკე სტატიაშია აღწერილი."
  - q: "ავტომატიკა ხელმისაწვდომია?"
    a: "ჩვიდმეტი მოდელიდან თხუთმეტი ავტომატურია, მექანიკა მხოლოდ ორ დიდ მიკროავტობუსზეა. მთის გზაზე ავტომატით მართლაც უფრო მარტივია, თუმცა დაღმართზე მაინც დაბალი გადაცემით ჩადით."

ru:
  name: "Вождение в Грузии: чего на самом деле стоят расстояния"
  answer: >-
    Дороги в Грузии медленные: медианная скорость по 267 измеренным поездкам из Тбилиси — 61 км/ч:
    66 км/ч на асфальте, 60 — на в основном асфальтовых дорогах, 49 — на грунте и 42 — на дорогах
    только для 4x4. Тбилиси — Батуми — это 370 км и 5:30; Местиа — 470 км и 8:30; церковь Гергети —
    160 км и 3:10. Делите дневные километры на 60 и прибавляйте остановки. К 227 из 267 мест ведёт
    асфальт или в основном асфальт; к 40 — грунт или бездорожье. RentUp ставит зимние шины с 1
    декабря по 1 апреля.
  short: "Грузия — маленькая страна с медленными дорогами. 267 измеренных маршрутов из Тбилиси показывают, сколько на самом деле займёт ваш день."
  meta_title: "Вождение в Грузии: расстояния и время | RentUp"
  meta_description: "Не блог, а цифры оператора: средняя скорость по типу покрытия, 267 измеренных маршрутов из Тбилиси и правило, по которому день реально складывается."
  body: |
    ## Страна маленькая. Дороги - нет.

    От Тбилиси до Батуми 370 км. В большей части Европы это три с половиной часа. Здесь - 5 часов
    30 минут, и это не пессимизм: именно такое время мы публикуем на странице
    [Батумского бульвара](/attractions/batumi-boulevard-old-town/).

    Расстояние и время в пути от Тбилиси заполнены у нас для 267 записей из 267, без пропусков. Если
    разделить одно на другое по тем 229 местам, что лежат дальше 40 км от столицы, получится число,
    вокруг которого стоит планировать: **медианная скорость по дорогам Грузии - 61 км/ч.** Не 90.
    Не разрешённый предел. Шестьдесят один.

    ## Скорость по типу покрытия, измеренная

    | Класс дороги | Мест измерено | Медианная скорость | Что вас тормозит |
    |---|---|---|---|
    | асфальт | 120 | 66 км/ч | Сёла, трактора, обгон по встречной |
    | в основном асфальт | 69 | 60 км/ч | Разбитый финальный участок или горный подъём |
    | грунт | 23 | 49 км/ч | Грунт, броды, размывы |
    | только 4x4 | 17 | 42 км/ч | Настоящая горная дорога |

    Даже на лучшем асфальте страны от двери до двери выходит 66 км/ч. Разница между асфальтом и
    внедорожной дорогой - не мелкий штраф, а минус 36% ко всему, что вы запланировали.

    ## Одни и те же 100 км - никогда не один и тот же час

    | Направление | Расстояние от Тбилиси | В пути | Расчётная скорость |
    |---|---|---|---|
    | [Уплисцихе](/attractions/uplistsikhe/) | 100 км | 1:25 | 71 км/ч |
    | [Сигнахи](/attractions/sighnaghi/) | 110 км | 1:50 | 60 км/ч |
    | [Крепость Ананури](/attractions/ananuri-fortress/) | 70 км | 1:20 | 53 км/ч |
    | [Церковь Гергети](/attractions/gergeti-trinity-church/) | 160 км | 3:10 | 51 км/ч |
    | [Батуми](/attractions/batumi-boulevard-old-town/) | 370 км | 5:30 | 67 км/ч |
    | [Местиа](/attractions/mestia/) | 470 км | 8:30 | 55 км/ч |

    До Ананури всего 70 км, а ехать час двадцать, потому что Военно-Грузинская дорога начинает
    подниматься почти сразу. Уплисцихе дальше и быстрее, потому что стоит у автомагистрали.
    **Расстояние здесь не предсказывает почти ничего; покрытие и рельеф - почти всё.**

    ## Правило планирования, которое выдерживает встречу с реальностью

    Разделите дневной километраж на 60, а не на 90. Потом прибавьте остановки. Наши многодневные
    планы построены именно так, и арифметику можно проверить:

    | План | Всего километров | Всего в пути | Расчётная средняя |
    |---|---|---|---|
    | [3 дня](/itineraries/georgia-3-days/) | 420 км | 8:00 | 53 км/ч |
    | [7 дней](/itineraries/georgia-7-days/) | 1020 км | 18:30 | 55 км/ч |
    | [10 дней](/itineraries/georgia-10-days/) | 1450 км | 27:00 | 54 км/ч |
    | [14 дней](/itineraries/georgia-14-days/) | 2040 км | 39:30 | 52 км/ч |

    Четыре независимых плана, и все четыре укладываются в 52-55 км/ч с учётом остановок. Если
    предложенный вам график обещает больше, его писали, глядя на карту, а не на дорогу.

    ## Где кончается асфальт

    Из 267 мест 154 заасфальтированы до самой парковки, ещё 73 - асфальт с разбитым или крутым
    финальным отрезком. Остаются 40 мест, то есть 15%, на грунте и внедорожных дорогах. Если ни
    одного из этих сорока в вашем списке нет, покрытие никогда не испортит вам день, и весь маршрут
    закрывает [эконом-класс](/car-rental/economy/). Если есть - прочитайте перед бронированием
    [нужен ли внедорожник в Грузии](/guides/do-i-need-a-4x4-in-georgia/): выбранная категория
    определяет и то, что покрывает договор.

    ## Горы, уклон и световой день

    Сложность в Грузии вертикальная, а не горизонтальная. Двадцать наших мест лежат выше 2000 м, а
    высшая точка, перевал Абано, - на 2850 м. На таких дорогах:

    - Спускайтесь на пониженной передаче, а не на тормозах. Длинный спуск перегревает тормоза, а
      остановиться и остыть почти негде.
    - Ждите скот на слепых поворотах. Коровы, свиньи и овцы на практике пользуются абсолютным
      приоритетом.
    - Обгон на двухполосной горной дороге - место, где чаще всего случаются неприятности у гостей.
      Ни один маршрут в этой стране не рушится из-за потерянных пяти минут.
    - Планируйте приезд до сумерек. Неосвещённая дорога, необозначенные обочины и животные - плохое
      сочетание.

    Наш [маршрут по Военно-Грузинской дороге](/routes/military-highway-kazbegi/) именно поэтому
    отмечен кроссовером и средней сложностью, хотя сам асфальт там хороший.

    ## Зима

    Все машины нашего парка с 1 декабря по 1 апреля стоят на зимней резине. Это оснащение, а не
    решение: зимняя резина сокращает тормозной путь, но не отменяет лёд. Из 267 мест 52 отмечены как
    недоступные круглый год, и первыми закрываются высокие перевалы. Сезонные подробности мы разобрали
    отдельно в [материале о зимних поездках](/blog/zamtris-mgzavroba-saqartveloshi/), а гид
    [когда лучше ехать](/guides/best-time-to-visit-georgia/) показывает, как карта открывается и
    закрывается помесячно.

    ## Топливо, запас хода и сама машина

    Наш планировщик считает топливо по 8,5 л/100 км - это реалистичная цифра смешанного цикла для
    среднего автомобиля на грузинских дорогах, а не рекламная. Два практических следствия:

    - **В горах заправляйтесь с половины бака, а не по лампочке.** Выше 1500 м заправки резко
      редеют.
    - **День на 400 км - это полный день.** При 55 км/ч это больше семи часов за рулём ещё до
      единственной остановки.

    Пятнадцать из семнадцати наших моделей - автоматы; механика только на двух больших фургонах. На
    горной дороге это значит больше, чем принято думать.

    ## Документы, штрафы и договор

    Документы, минимальный возраст, страховка, депозит и порядок со штрафами - коммерческие условия,
    и они меняются. Мы их здесь не пересказываем, потому что устаревшая цифра хуже её отсутствия:
    читайте [страницу условий](/terms/) и [вопросы и ответы](/faq/), а остальное спрашивайте до
    подписания.

    ## Перед выездом

    - Проверьте класс дороги и сезон для каждого пункта списка - они есть на
      [странице каждой достопримечательности](/attractions/ushguli/).
    - Разделите дневной километраж на 60 и прибавьте остановки.
    - При выдаче сфотографируйте машину со всех четырёх сторон и зафиксируйте топливо и пробег.
    - Выбирайте категорию по самой сложной дороге маршрута, а не по самой лёгкой:
      [эконом](/car-rental/economy/), [кроссовер](/car-rental/suv/) или
      [внедорожник 4x4](/car-rental/4x4/).

    Планирование начинается здесь: [аренда автомобиля](/car-rental/).
  faq:
  - q: "Сколько на самом деле ехать из Тбилиси в Батуми?"
    a: "Для Батуми мы публикуем 370 км и 5:30, то есть 67 км/ч. И это по одной из лучших дорог страны. Кто обещает четыре часа, смотрит на карту, а не на дорогу."
  - q: "Безопасно ли ездить в Грузии туристу?"
    a: "Сложность здесь в горных дорогах, а не в плотности потока. Скот на слепых поворотах, длинные крутые спуски и обгон на двухполосной дороге дают большую часть происшествий у гостей. Если ехать на медианные 61 км/ч, а не на разрешённый предел, риск в основном исчезает."
  - q: "На какую среднюю скорость планировать?"
    a: "Шестьдесят километров в час до остановок. По 229 измеренным маршрутам из Тбилиси медиана - 61 км/ч, а наши трёх-, семи-, десяти- и четырнадцатидневные планы с остановками укладываются в 52-55 км/ч."
  - q: "Плохие ли в Грузии дороги?"
    a: "В основном нет. Из 267 мест 154 заасфальтированы до парковки и ещё 73 - асфальт с разбитым финальным участком. Только 40 стоят на грунте и внедорожных дорогах, и мы называем каждое."
  - q: "Нужна ли зимняя резина?"
    a: "Наши машины с 1 декабря по 1 апреля на зимней резине, вам ничего организовывать не нужно. Цепи и горные условия разобраны в отдельном материале о зимних поездках."
  - q: "Есть ли автомат?"
    a: "Пятнадцать из семнадцати моделей - автоматы, механика только на двух больших фургонах. В горах с автоматом действительно легче, но спускаться всё равно нужно на пониженной передаче."

fa:
  name: "رانندگی در گرجستان: فاصله‌ها واقعاً چقدر وقت می‌برند"
  answer: >-
    جاده‌های گرجستان کندند: میانهٔ سرعت در 267 مسیر اندازه‌گیری‌شده از تفلیس 61 کیلومتر بر ساعت است
    - 66 روی آسفالت، 60 روی جادّهٔ عمدتاً آسفالت، 49 روی خاکی و 42 روی مسیرهای فقط-4x4. تفلیس تا
    باتومی 370 کیلومتر و 5:30 است؛ مستیا 470 کیلومتر و 8:30؛ کلیسای تثلیث گرگتی 160 کیلومتر و 3:10.
    کیلومترهای روز را بر 60 تقسیم کنید و توقف‌ها را اضافه کنید. 227 مکان از 267 مکان آسفالت یا
    عمدتاً آسفالت است؛ 40 مکان خاکی یا آفرود. RentUp از 1 دسامبر تا 1 آوریل لاستیک زمستانی می‌بندد.
  short: "گرجستان کشوری کوچک با جاده‌های کند است. 267 مسیر اندازه‌گیری‌شده از تفلیس نشان می‌دهد روز شما واقعاً چقدر طول می‌کشد."
  meta_title: "رانندگی در گرجستان: فاصله و زمان | RentUp"
  meta_description: "نه یک وبلاگ سفر، بلکه اعداد یک شرکت اجاره: سرعت میانه بر پایهٔ نوع جاده، 267 زمان سفر اندازه‌گیری‌شده از تفلیس و قاعده‌ای برای برنامه‌ریزی روز."
  body: |
    ## کشور کوچک است؛ جاده‌ها کند

    از تفلیس تا باتومی 370 کیلومتر است. در بیشتر اروپا این یعنی سه ساعت و نیم. اینجا یعنی 5 ساعت و
    30 دقیقه، و این بدبینی نیست: همان زمانی است که در صفحهٔ
    [گردشگاه باتومی](/attractions/batumi-boulevard-old-town/) منتشر کرده‌ایم.

    برای هر 267 رکورد پایگاه دادهٔ ما فاصله و زمان سفر از تفلیس ثبت شده است، بدون هیچ خلأیی. اگر
    این دو را برای آن 229 مکانی که بیش از 40 کیلومتر دورترند بر هم تقسیم کنیم، عددی به دست می‌آید
    که باید بر پایهٔ آن برنامه ریخت: **سرعت میانهٔ جاده‌ای در گرجستان 61 کیلومتر بر ساعت است.** نه
    90، نه سقف مجاز.

    ## سرعت بر پایهٔ نوع سطح جادّه

    | ردهٔ جادّه | مکان اندازه‌گیری‌شده | سرعت میانه | چه چیزی کندتان می‌کند |
    |---|---|---|---|
    | آسفالت | 120 | 66 کیلومتر بر ساعت | روستاها، تراکتور، سبقت در جادّهٔ دوطرفه |
    | عمدتاً آسفالت | 69 | 60 کیلومتر بر ساعت | بخش پایانی خراب یا شیب کوهستانی |
    | خاکی | 23 | 49 کیلومتر بر ساعت | خاکی، گدار، شست‌وشوی جاده |
    | فقط 4x4 | 17 | 42 کیلومتر بر ساعت | جادّهٔ کوهستانی واقعی |

    حتی روی بهترین آسفالت کشور، میانگین در به در 66 کیلومتر بر ساعت است.

    ## صد کیلومتر همیشه یک ساعت نیست

    | مقصد | فاصله از تفلیس | زمان | سرعت متناظر |
    |---|---|---|---|
    | [اوپلیستسیخه](/attractions/uplistsikhe/) | 100 کیلومتر | 1:25 | 71 |
    | [سیغناغی](/attractions/sighnaghi/) | 110 کیلومتر | 1:50 | 60 |
    | [قلعهٔ آنانوری](/attractions/ananuri-fortress/) | 70 کیلومتر | 1:20 | 53 |
    | [کلیسای گرگتی](/attractions/gergeti-trinity-church/) | 160 کیلومتر | 3:10 | 51 |
    | [مستیا](/attractions/mestia/) | 470 کیلومتر | 8:30 | 55 |

    آنانوری تنها 70 کیلومتر دور است و باز یک ساعت و بیست دقیقه می‌برد، چون جادّهٔ نظامی گرجستان
    تقریباً بی‌درنگ شروع به بالا رفتن می‌کند. **فاصله اینجا چیز زیادی را پیش‌بینی نمی‌کند؛ نوع
    جادّه و ناهمواری تقریباً همه‌چیز را.**

    ## قاعدهٔ برنامه‌ریزی

    کیلومتر روزانه را بر 60 تقسیم کنید، نه بر 90، و بعد توقف‌ها را بیفزایید. برنامه‌های چندروزهٔ خود
    ما دقیقاً همین‌گونه ساخته شده‌اند: [3 روزه](/itineraries/georgia-3-days/) 420 کیلومتر در 8:00،
    [7 روزه](/itineraries/georgia-7-days/) 1020 کیلومتر در 18:30 و
    [10 روزه](/itineraries/georgia-10-days/) 1450 کیلومتر در 27:00 - هر سه میان 53 و 55 کیلومتر بر
    ساعت.

    ## جایی که آسفالت تمام می‌شود

    از 267 مکان، 154 مورد تا خود پارکینگ آسفالت دارند و 73 مورد دیگر آسفالت با بخش پایانی ناهموارند.
    40 مکان یعنی 15 درصد روی جادّهٔ خاکی یا آفرود می‌مانند. اگر هیچ‌کدام در فهرست شما نیست،
    [خودروی اقتصادی](/car-rental/economy/) تمام سفر را پوشش می‌دهد؛ اگر هست، پیش از رزرو
    [آیا به 4x4 نیاز دارید](/guides/do-i-need-a-4x4-in-georgia/) را بخوانید.

    ## کوه، شیب و روشنایی روز

    دشواری در گرجستان عمودی است نه افقی. بیست مکان بالای 2,000 متر قرار دارند و بلندترین نقطه،
    گردنهٔ آبانو، در 2,850 متر است. در چنین جاده‌هایی با دندهٔ سنگین پایین بیایید نه با ترمز؛ منتظر
    دام در پیچ‌های کور باشید؛ از سبقت در جادّهٔ دوطرفهٔ کوهستانی بپرهیزید؛ و پیش از تاریکی برسید.
    [مسیر جادّهٔ نظامی گرجستان](/routes/military-highway-kazbegi/) ما دقیقاً به همین دلیل در ردهٔ
    شاسی‌بلند و با دشواری متوسط ثبت شده است.

    ## زمستان و سوخت

    همهٔ خودروهای ما از 1 دسامبر تا 1 آوریل لاستیک زمستانی دارند. این تجهیزات است، نه راه‌حل. از
    267 مکان، 52 مورد به‌عنوان «نه در تمام سال» علامت خورده‌اند و نخست گردنه‌های بلند بسته می‌شوند؛
    [راهنمای بهترین زمان سفر](/guides/best-time-to-visit-georgia/) ماه به ماه این را نشان می‌دهد.
    برنامه‌ریز ما سوخت را با 8.5 لیتر در 100 کیلومتر حساب می‌کند: در کوهستان از نیمهٔ باک سوخت
    بگیرید، نه با روشن شدن چراغ.

    ## مدارک، جریمه و قرارداد

    مدارک، حداقل سن، بیمه، ودیعه و ترتیب جریمه‌ها شرایط تجاری‌اند و تغییر می‌کنند. آن‌ها را اینجا
    تکرار نمی‌کنیم؛ در [صفحهٔ شرایط](/terms/) و [پرسش و پاسخ](/faq/) بخوانید. برنامه‌ریزی از اینجا
    آغاز می‌شود: [اجارهٔ خودرو](/car-rental/).
  faq:
  - q: "واقعاً از تفلیس تا باتومی چقدر راه است؟"
    a: "ما 370 کیلومتر و 5:30 منتشر می‌کنیم، یعنی 67 کیلومتر بر ساعت، آن هم روی یکی از بهترین جاده‌های کشور. هر کس چهار ساعت وعده می‌دهد به نقشه نگاه می‌کند نه به جاده."
  - q: "رانندگی در گرجستان برای مسافر امن است؟"
    a: "دشواری در جاده‌های کوهستانی است نه در حجم ترافیک. دام در پیچ کور، سرازیری‌های بلند و سبقت در جادّهٔ دوطرفه بیشترین مشکل را می‌سازند. اگر با میانهٔ 61 کیلومتر بر ساعت برانید، بخش بزرگی از خطر از میان می‌رود."
  - q: "بر چه سرعت میانگینی برنامه بریزم؟"
    a: "شصت کیلومتر بر ساعت، پیش از توقف‌ها. در 229 مسیر اندازه‌گیری‌شده از تفلیس، میانه 61 کیلومتر بر ساعت است و برنامه‌های چندروزهٔ ما با احتساب توقف بین 52 و 55 می‌افتند."
  - q: "جاده‌های گرجستان بد هستند؟"
    a: "بیشترشان نه. از 267 مکان، 154 مورد تا پارکینگ آسفالت دارند و 73 مورد دیگر آسفالت با بخش پایانی ناهموار. تنها 40 مکان روی خاکی یا آفرود است."
  - q: "لاستیک زمستانی لازم است؟"
    a: "خودروهای ما از 1 دسامبر تا 1 آوریل لاستیک زمستانی دارند، پس کاری برای شما نمی‌ماند. زنجیر چرخ و شرایط کوهستان جداگانه توضیح داده شده است."

he:
  name: "נהיגה בגאורגיה: כמה באמת עולים לכם המרחקים"
  answer: >-
    הכבישים בגאורגיה איטיים: המהירות החציונית ב-267 נסיעות מדודות מטביליסי היא 61 קמ"ש - 66 קמ"ש על
    אספלט, 60 על אספלט ברובו, 49 על דרך עפר ו-42 על מסלולי 4x4 בלבד. מטביליסי לבטומי 370 ק"מ ו-5:30;
    מסטיה 470 ק"מ ו-8:30; כנסיית גרגטי 160 ק"מ ו-3:10. חלקו את הקילומטרים של היום ב-60, ואז הוסיפו
    עצירות. 227 מתוך 267 המקומות סלולים או סלולים ברובם; 40 הם דרך עפר או שטח. RentUp מרכיבה צמיגי
    חורף מ-1 בדצמבר עד 1 באפריל.
  short: "גאורגיה קטנה, אבל הכבישים שלה איטיים. 267 נסיעות מדודות מטביליסי מראות כמה זמן היום שלכם באמת ייקח."
  meta_title: "נהיגה בגאורגיה: מרחקים וזמני נסיעה | RentUp"
  meta_description: "לא בלוג טיולים אלא המספרים של חברת ההשכרה: מהירות חציונית לפי סוג דרך, 267 זמני נסיעה מדודים מטביליסי, וכלל תכנון פשוט ליום נהיגה שבאמת מסתדר."
  body: |
    ## המדינה קטנה. הכבישים לא מהירים.

    מטביליסי לבטומי 370 ק"מ. ברוב אירופה זו נסיעה של שלוש שעות וחצי. כאן זה 5:30, וזה לא פסימיות:
    זהו זמן הנסיעה שאנחנו מפרסמים בעמוד של
    [טיילת בטומי](/attractions/batumi-boulevard-old-town/).

    לכל אחת מ-267 הרשומות במאגר יש מרחק וזמן נסיעה מטביליסי, בלי חורים. חלוקה של האחד בשני, על פני
    229 המקומות שנמצאים במרחק של יותר מ-40 ק"מ, נותנת מספר שכדאי לתכנן לפיו: **המהירות החציונית
    בכבישי גאורגיה היא 61 קמ"ש.** לא 90. לא המהירות המותרת.

    ## מהירות לפי סוג פני הדרך

    | סיווג הדרך | מקומות שנמדדו | מהירות חציונית | מה מאט אתכם |
    |---|---|---|---|
    | אספלט | 120 | 66 קמ"ש | כפרים, טרקטורים, עקיפה בנתיב נגדי |
    | אספלט ברובו | 69 | 60 קמ"ש | קטע סיום מחוספס או עלייה הררית |
    | דרך עפר | 23 | 49 קמ"ש | דרך עפר, חציות נחל, סחף |
    | 4x4 בלבד | 17 | 42 קמ"ש | דרך הרים אמיתית |

    גם על האספלט הטוב במדינה הממוצע מדלת לדלת הוא 66 קמ"ש.

    ## אותם 100 ק"מ אף פעם אינם אותה שעה

    | יעד | מרחק מטביליסי | זמן | מהירות נגזרת |
    |---|---|---|---|
    | [אופליסציחה](/attractions/uplistsikhe/) | 100 ק"מ | 1:25 | 71 |
    | [סיגנאגי](/attractions/sighnaghi/) | 110 ק"מ | 1:50 | 60 |
    | [מצודת אנאנורי](/attractions/ananuri-fortress/) | 70 ק"מ | 1:20 | 53 |
    | [כנסיית גרגטי](/attractions/gergeti-trinity-church/) | 160 ק"מ | 3:10 | 51 |
    | [מסטיה](/attractions/mestia/) | 470 ק"מ | 8:30 | 55 |

    אנאנורי רחוקה 70 ק"מ בלבד ובכל זאת לוקחת שעה ועשרים, מפני שדרך הצבא הגאורגית מתחילה לטפס כמעט
    מיד. **המרחק כאן כמעט לא מנבא דבר; סוג הדרך והטופוגרפיה מנבאים כמעט הכול.**

    ## כלל תכנון שעומד במבחן

    חלקו את הקילומטרים של היום ב-60, לא ב-90, ואז הוסיפו עצירות. התוכניות הרב-יומיות שלנו בנויות
    בדיוק כך: [3 ימים](/itineraries/georgia-3-days/) הם 420 ק"מ ב-8:00,
    [7 ימים](/itineraries/georgia-7-days/) הם 1,020 ק"מ ב-18:30 ו[10 ימים](/itineraries/georgia-10-days/)
    הם 1,450 ק"מ ב-27:00 - כולן נופלות בין 53 ל-55 קמ"ש.

    אותה תמונה עולה גם ממאגר המסלולים. באתר 49 מסלולים מתועדים, כמעט 19,700 ק"מ יחד. לפי דרגת קושי
    21 מהם קלים, 23 בינוניים ורק 5 קשים; לפי קטגוריית רכב 21 אקונומי, 23 רכב שטח עירוני ו-5 שטח.
    כלומר רוב הנסיעה בגאורגיה איננה טכנית ואיננה דורשת רכב מיוחד. היא דורשת זמן, ויותר ממה שהמפה
    מבטיחה לכם.

    ## היכן נגמר האספלט

    מתוך 267 המקומות, 154 סלולים עד החניון ועוד 73 סלולים עם קטע סיום מחוספס. נותרים 40 מקומות,
    15%, על דרכי עפר ושטח. אם אף אחד מהם אינו ברשימה שלכם,
    [רכב אקונומי](/car-rental/economy/) מכסה את כל הטיול; אם כן, קראו לפני ההזמנה את
    [האם צריך 4x4 בגאורגיה](/guides/do-i-need-a-4x4-in-georgia/).

    ## הרים, שיפוע ואור יום

    הקושי בגאורגיה אנכי ולא אופקי. עשרים מהמקומות שלנו נמצאים מעל 2,000 מ', והגבוה בהם, מעבר אבאנו,
    ב-2,850 מ'. בדרכים כאלה: רדו בהילוך נמוך ולא על הבלמים; צפו לבקר בסיבובים עיוורים; הימנעו
    מעקיפות בדרך הרים דו-נתיבית; והגיעו לפני רדת החשכה.
    [מסלול דרך הצבא הגאורגית](/routes/military-highway-kazbegi/) שלנו מסווג רכב שטח עירוני ודרגת
    קושי בינונית בדיוק בגלל זה, אף שהאספלט עצמו טוב.

    ## חורף ודלק

    כל רכבי הצי שלנו מצוידים בצמיגי חורף מ-1 בדצמבר עד 1 באפריל. זה ציוד, לא פתרון. מתוך 267
    המקומות, 52 מסומנים כלא נגישים כל השנה, והמעברים הגבוהים נסגרים ראשונים; המדריך
    [מתי הכי כדאי לבקר](/guides/best-time-to-visit-georgia/) מראה זאת חודש בחודשו. מתכנן הטיולים
    שלנו מחשב דלק לפי 8.5 ליטר ל-100 ק"מ: בהרים תדלקו מחצי מיכל, לא מנורית האזהרה. ועוד פרט מעשי:
    חמישה-עשר מתוך שבעה-עשר הדגמים שלנו אוטומטיים, ורק שני המסחריים הגדולים ידניים. בדרך הרים זה
    משנה יותר מכפי שנדמה, כי בסיבוב תלול אתם רוצים את שתי הידיים על ההגה. ויום של 400 ק"מ הוא יום
    מלא: ב-55 קמ"ש מדובר בלמעלה משבע שעות מאחורי ההגה עוד לפני העצירה הראשונה.

    ## מסמכים, קנסות והחוזה

    מסמכים, גיל מינימלי, ביטוח, פיקדון והטיפול בקנסות הם תנאים מסחריים והם משתנים. איננו חוזרים
    עליהם כאן; קראו אותם ב[עמוד התנאים](/terms/) וב[שאלות ותשובות](/faq/). התכנון מתחיל כאן:
    [השכרת רכב](/car-rental/).
  faq:
  - q: "כמה זמן באמת נוסעים מטביליסי לבטומי?"
    a: "אנחנו מפרסמים 370 ק\"מ ו-5:30, כלומר 67 קמ\"ש, וזה על אחד הכבישים הטובים במדינה. מי שמבטיח ארבע שעות מסתכל על מפה ולא על דרך."
  - q: "בטוח לנהוג בגאורגיה כתייר?"
    a: "הקושי הוא דרכי ההרים ולא צפיפות התנועה. בקר בסיבובים עיוורים, ירידות תלולות ארוכות ועקיפות בדרך דו-נתיבית גורמים לרוב התקריות. נהיגה לפי החציון של 61 קמ\"ש מעלימה את רוב הסיכון."
  - q: "לפי איזו מהירות ממוצעת לתכנן?"
    a: "שישים קמ\"ש לפני עצירות. על פני 229 נסיעות מדודות מטביליסי החציון הוא 61 קמ\"ש, והתוכניות שלנו נופלות בין 52 ל-55 כשמוסיפים עצירות."
  - q: "הכבישים בגאורגיה גרועים?"
    a: "ברובם לא. מתוך 267 מקומות 154 סלולים עד החניון ועוד 73 סלולים עם קטע סיום מחוספס. רק 40 יושבים על דרכי עפר ושטח."
  - q: "צריך צמיגי חורף?"
    a: "הרכבים שלנו מצוידים בצמיגי חורף מ-1 בדצמבר עד 1 באפריל, כך שאין מה לארגן. שרשראות ותנאי הרים מוסברים בנפרד."

ar:
  name: "القيادة في جورجيا: كم تكلّفك المسافات فعلاً"
  answer: >-
    طرق جورجيا بطيئة: وسيط السرعة عبر 267 رحلة مقيسة من تبليسي هو 61 كم/س - 66 كم/س على الإسفلت، و60
    على الطرق المعبّدة في معظمها، و49 على الترابي، و42 على مسارات 4x4 فقط. من تبليسي إلى باتومي 370
    كم و5:30؛ ميستيا 470 كم و8:30؛ كنيسة غيرغيتي 160 كم و3:10. اقسم كيلومترات اليوم على 60 ثم أضف
    التوقفات. 227 من الأماكن الـ267 معبّدة أو معبّدة في معظمها؛ و40 ترابية أو وعرة. تركّب RentUp
    إطارات الشتاء من 1 ديسمبر إلى 1 أبريل.
  short: "جورجيا بلد صغير وطرقه بطيئة. 267 رحلة مقيسة من تبليسي تُظهر كم يستغرق يومك في الواقع."
  meta_title: "القيادة في جورجيا: المسافات والأزمنة | RentUp"
  meta_description: "ليست مدونة سفر بل أرقام شركة تأجير: السرعة الوسيطة حسب نوع الطريق، و267 زمن قيادة مقيساً من تبليسي، وقاعدة عملية لتخطيط يوم قيادة يمشي فعلاً."
  body: |
    ## البلد صغير، لكن طرقه ليست سريعة

    من تبليسي إلى باتومي 370 كم. في معظم أوروبا هذه ثلاث ساعات ونصف. هنا هي 5:30، وليس هذا تشاؤماً:
    هو الزمن نفسه الذي ننشره على صفحة
    [كورنيش باتومي](/attractions/batumi-boulevard-old-town/).

    لكل سجل من سجلاتنا الـ267 مسافة وزمن قيادة من تبليسي، بلا ثغرات. وبقسمة أحدهما على الآخر عبر
    الأماكن الـ229 التي تبعد أكثر من 40 كم، يظهر رقم يستحق أن تُبنى عليه الخطة: **السرعة الوسيطة
    على طرق جورجيا 61 كم/س.** لا 90، ولا الحد المسموح.

    ## السرعة بحسب نوع السطح

    | صنف الطريق | أماكن مقيسة | السرعة الوسيطة | ما الذي يبطئك |
    |---|---|---|---|
    | إسفلت | 120 | 66 كم/س | قرى وجرارات وتجاوز على مسربين |
    | إسفلت في معظمه | 69 | 60 كم/س | مقطع أخير وعر أو صعود جبلي |
    | ترابي | 23 | 49 كم/س | تراب ومخاضات وانجرافات |
    | 4x4 فقط | 17 | 42 كم/س | طريق جبلي حقيقي |

    حتى على أفضل إسفلت في البلاد، المعدل من الباب إلى الباب 66 كم/س.

    ## المئة كيلومتر ليست ساعة واحدة أبداً

    | الوجهة | المسافة من تبليسي | الزمن | السرعة المستنتجة |
    |---|---|---|---|
    | [أوبليستسيخه](/attractions/uplistsikhe/) | 100 كم | 1:25 | 71 |
    | [سيغناغي](/attractions/sighnaghi/) | 110 كم | 1:50 | 60 |
    | [قلعة أنانوري](/attractions/ananuri-fortress/) | 70 كم | 1:20 | 53 |
    | [كنيسة غرغيتي](/attractions/gergeti-trinity-church/) | 160 كم | 3:10 | 51 |
    | [ميستيا](/attractions/mestia/) | 470 كم | 8:30 | 55 |

    أنانوري لا تبعد سوى 70 كم ومع ذلك تستغرق ساعة وعشرين دقيقة، لأن الطريق العسكري الجورجي يبدأ
    الصعود فوراً تقريباً. **المسافة هنا لا تتنبأ بشيء يُذكر؛ أما صنف الطريق والتضاريس فيتنبآن بكل
    شيء تقريباً.**

    ## قاعدة تخطيط تصمد أمام الواقع

    اقسم كيلومترات اليوم على 60 لا على 90، ثم أضف التوقفات. خططنا متعددة الأيام مبنية هكذا تماماً:
    [3 أيام](/itineraries/georgia-3-days/) 420 كم في 8:00، و[7 أيام](/itineraries/georgia-7-days/)
    1020 كم في 18:30، و[10 أيام](/itineraries/georgia-10-days/) 1450 كم في 27:00 - وكلها بين 53
    و55 كم/س.

    والصورة نفسها تظهر في قاعدة المسارات. على الموقع 49 مساراً موثقاً، مجموعها نحو 19,700 كم. وبحسب
    الصعوبة: 21 مساراً سهلاً و23 متوسطاً وخمسة صعبة فقط؛ وبحسب فئة السيارة: 21 اقتصادياً و23 دفعاً
    رباعياً خفيفاً وخمسة وعرة. أي أن معظم القيادة في جورجيا ليست تقنية ولا تحتاج سيارة خاصة، لكنها
    تحتاج وقتاً أكثر مما تعدك به الخريطة.

    ## أين ينتهي الإسفلت

    من الأماكن الـ267، 154 مكاناً معبّد حتى الموقف نفسه، و73 آخر معبّد مع مقطع أخير وعر. يبقى 40
    مكاناً، أي 15 بالمئة، على طرق ترابية ووعرة. فإن لم يكن أي منها في قائمتك فإن
    [السيارة الاقتصادية](/car-rental/economy/) تغطي الرحلة كلها؛ وإن كان، فاقرأ قبل الحجز
    [هل تحتاج إلى دفع رباعي](/guides/do-i-need-a-4x4-in-georgia/).

    ## الجبل والانحدار وضوء النهار

    الصعوبة في جورجيا رأسية لا أفقية. عشرون من أماكننا فوق 2,000 متر، وأعلاها ممر أبانو عند 2,850
    متراً. على مثل هذه الطرق: انزل بغيار منخفض لا على المكابح؛ توقّع الماشية في المنعطفات العمياء؛
    تجنّب التجاوز على طريق جبلي بمسربين؛ واحرص أن تصل قبل الغسق. ولهذا بالذات صُنّف
    [مسار الطريق العسكري الجورجي](/routes/military-highway-kazbegi/) عندنا بفئة الدفع الرباعي
    الخفيف وبصعوبة متوسطة، رغم أن الإسفلت نفسه جيد.

    ## الشتاء والوقود

    كل سيارات أسطولنا على إطارات شتوية من 1 ديسمبر إلى 1 أبريل. هذه معدات لا حل. ومن 267 مكاناً
    هناك 52 مُعلّماً بأنه غير متاح طوال السنة، والممرات العالية أول ما يُغلق؛ ودليل
    [أفضل وقت للزيارة](/guides/best-time-to-visit-georgia/) يعرض ذلك شهراً بشهر. ومخطِّط الرحلات
    عندنا يحسب الوقود على 8.5 لتر لكل 100 كم: في الجبال تزوّد بالوقود من نصف الخزان لا عند إضاءة
    اللمبة. وخمس عشرة سيارة من أصل سبع عشرة في أسطولنا أوتوماتيكية، والمركبتان الكبيرتان فقط بناقل
    يدوي، وهذا على الطريق الجبلي أهم مما يُظن.

    ## الأوراق والمخالفات والعقد

    الأوراق والحد الأدنى للسن والتأمين والتأمين النقدي وطريقة التعامل مع المخالفات كلها شروط تجارية
    تتغيّر. لا نكررها هنا؛ اقرأها في [صفحة الشروط](/terms/) و[الأسئلة الشائعة](/faq/). والتخطيط
    يبدأ من هنا: [تأجير السيارات](/car-rental/).
  faq:
  - q: "كم تستغرق القيادة فعلاً من تبليسي إلى باتومي؟"
    a: "ننشر 370 كم و5:30، أي 67 كم/س، وذلك على واحد من أفضل طرق البلاد. ومن يعدك بأربع ساعات إنما ينظر إلى خريطة لا إلى طريق."
  - q: "هل القيادة في جورجيا آمنة للزائر؟"
    a: "الصعوبة في طرق الجبال لا في كثافة السير. الماشية في المنعطفات العمياء والنزولات الطويلة والتجاوز على مسربين تسبب معظم الحوادث. القيادة على وسيط 61 كم/س بدل الحد المسموح تُذهب معظم الخطر."
  - q: "على أي سرعة متوسطة أخطط؟"
    a: "ستون كيلومتراً في الساعة قبل التوقفات. عبر 229 رحلة مقيسة من تبليسي الوسيط 61 كم/س، وخططنا متعددة الأيام تقع بين 53 و55 مع احتساب التوقفات."
  - q: "هل الطرق الجورجية سيئة؟"
    a: "في معظمها لا. من 267 مكاناً هناك 154 معبّداً حتى الموقف و73 معبّداً مع مقطع أخير وعر. و40 مكاناً فقط على طرق ترابية أو وعرة."
  - q: "هل أحتاج إطارات شتوية؟"
    a: "سياراتنا على إطارات شتوية من 1 ديسمبر إلى 1 أبريل، فلا شيء عليك ترتيبه. أما السلاسل وظروف الجبل فمشروحة على حدة."
