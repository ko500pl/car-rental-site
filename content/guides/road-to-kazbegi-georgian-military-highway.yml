  short: "ასფალტი თბილისიდან ჯვრის უღელტეხილამდე 2380 მეტრზე, ციცაბო ბეტონის ასასვლელი გერგეტამდე და ორი გვერდითი ხეობა, სადაც ჯიპი ხდება საჭირო. ყველა ციფრი ჩვენი გზის მონაცემებიდან."
  meta_title: "გზა ყაზბეგში: სამხედრო გზა მონაკვეთებად | RentUp"
  meta_description: "სამხედრო გზა მონაკვეთების მიხედვით: საფარი, სიმაღლე, ჯვრის უღელტეხილი 2380 მეტრზე, ასასვლელი გერგეტამდე და რომელი კატეგორია სჭირდება თითოეულ გაჩერებას."
  body: |
    ## რა გზაა ეს

    საქართველოს სამხედრო გზა (E117) თბილისიდან ჩრდილოეთით მიდის არაგვის გასწვრივ, ჯვრის უღელტეხილზე
    გადადის და თერგის ხეობით სტეფანწმინდაში ჩადის. ჩვენს ბაზაში ეს ქვეყნის ყველაზე „წესიერი" მთის გზაა:
    **მთავარ სავალ ნაწილზე ყველა გაჩერება ასფალტიანადაა კლასიფიცირებული** —
    [ჟინვალიდან](/attractions/zhinvali-reservoir/) 810 მეტრზე
    [ჯვრის უღელტეხილამდე](/attractions/jvari-pass-friendship-monument/) 2380 მეტრზე. თითოეული ეს
    გაჩერება მთელი წლის განმავლობაში ღიად არის მონიშნული.

    შეფასებას ორი რამ სწევს ზემოთ. [გუდაური](/attractions/gudauri/) 2200 მეტრზეა და ასფალტზეც კი
    კროსოვერითაა შეფასებული სიმაღლისა და ზამთრის გამო, ხოლო ბოლო 6 კმ
    [გერგეტის სამებამდე](/attractions/gergeti-trinity-church/) უმეტესად ასფალტიანია და კროსოვერს ითხოვს.
    ნამდვილი ჯიპი მხოლოდ ორ გვერდით ხეობაში — თრუსოსა და ჯუთაში — ხდება აუცილებელი. სწორედ ამიტომაა
    ჩვენი [სამხედრო გზის მარშრუტი](/routes/military-highway-kazbegi/) კროსოვერით შეფასებული: 340 კმ,
    6:40 გზაში და სეზონი მთელი წელი.

    ქვემოთ ყველა მანძილი თბილისიდანაა, ყველა სიმაღლე, საფარი და სეზონი კი პირდაპირ იმ ჩანაწერებიდანაა
    აღებული, რომლებიც თითოეულ ღირსშესანიშნაობას ჩვენს ბაზაში აქვს. არაფერია დამატებული მეხსიერებიდან
    და არაფერია დამრგვალებული ისე, რომ გზა უფრო ადვილად გამოჩენილიყო, ვიდრე მონაცემები ამბობს.

    ## მონაკვეთების მიხედვით

    ### თბილისიდან ჟინვალსა და ანანურამდე (0-70 კმ)

    პირველი საათი ჩვეულებრივი ასფალტია მცხეთისა და ნატახტარის გავლით. ჟინვალის კაშხლის შემდეგ —
    თბილისიდან 65 კმ და 1:15 — გზა წყალსაცავის ნაპირს მიჰყვება და ვიწროვდება: კლდეშია ჩაჭრილი, ბრმა
    მოსახვევებით, ამიტომ სატვირთოებს ფრთხილად უნდა გაუსწროთ. მონაცემების მიხედვით საწვავი ნატახტარში
    უნდა ჩაასხათ, რადგან ზემოთ სადგურები იშვიათდება. [ანანურის ციხე](/attractions/ananuri-fortress/)
    კიდევ 5 კმ-ით შორსაა — ქალაქიდან 70 კმ და 1:20, 830 მეტრზე, პირდაპირ გზის პირას, დიდი
    ავტოსადგომით. ორივე გაჩერება ეკონომითაა შეფასებული და მთელი წელი ღიაა; თითოეულს საათი დაუთმეთ.

    ### ანანურიდან ფასანაურსა და გუდაურამდე (70-120 კმ)

    ანანურის შემდეგ არაგვის ხეობა ვიწროვდება და გზაც ვიწრო რჩება. ფასანაურის ზემოთ ხასიათი იცვლება:
    გრძელი სერპანტინი, რომელსაც მძიმე სატვირთოებს უზიარებთ. გუდაური თბილისიდან 120 კმ და 2:10-ია,
    2200 მეტრზე. ასფალტი წესრიგშია, მაგრამ სწორედ ეს მონაკვეთია მონაცემებში ზამთარში ზვავსაშიშად
    მონიშნული — პერიოდულად იკეტება, ცივ სეზონზე ზამთრის საბურავები სავალდებულოა და ჯაჭვების ტარება
    ღირს. გუდაური სწორედ ამიტომაა კროსოვერით შეფასებული, საუკეთესო სეზონი კი დეკემბერი-მარტია.
    საწვავი ფასანაურსა და გუდაურის ცენტრშია.

    ### გუდაურიდან ჯვრის უღელტეხილსა და ყობამდე (120-125 კმ)

    მლეთა-გუდაურის მონაკვეთი უწყვეტი აღმართია სატვირთოებით და გასწრების ადგილის გარეშე, თავად
    უღელტეხილი კი თბილისიდან 125 კმ და 2:20-ია, 2380 მეტრზე. ანანურიდან (830 მ) ეს 55 კილომეტრში
    დაახლოებით 1550 მეტრი აღმართია. საფარი ასფალტია, შეფასება — ეკონომი, მთელი წელი ღიაა, იმ
    შენიშვნით, რომ ზამთარში ზამთრის საბურავები, საბარგულში ჯაჭვები და უკან დაბრუნების მზაობა
    გჭირდებათ. მეგობრობის მონუმენტთან ერთი საათი დაუთმეთ. ყობისკენ დაშვებაზე მინერალურ ტრავერტინებს
    ჩაუვლით.

    ### ყობიდან სტეფანწმინდასა და გერგეტამდე (160 კმ-მდე)

    სტეფანწმინდა თბილისიდან 155 კმ და დაახლოებით სამი საათია. გერგეტის სამება — 160 კმ და 3:10,
    2170 მეტრზე. სოფლიდან ბოლო 6 კმ ციცაბო, ვიწრო ბეტონის გზაა: მონაცემების მიხედვით სედანი მშრალ
    ამინდში ტექნიკურად გაივლის, მაგრამ შემხვედრი მანქანის ასაცილებლად ორი ბორბალი გრუნტზე უნდა
    ჩამოიყვანოთ, ამიტომ სინამდვილეში კროსოვერი გჭირდებათ, ზამთარში კი ჯაჭვები და სრული წამყვანი
    აუცილებელია. საუკეთესო სეზონი მაისი-ოქტომბერი, მთელი წელი ღიაა, ადგილზე სამი საათი. საწვავი —
    ფასანაურში ან სტეფანწმინდაში.

    ### სტეფანწმინდის იქით: დარიალის ხეობა

    [დარიალის ხეობა და გველეთის ჩანჩქერები](/attractions/dariali-gorge-gveleti-waterfalls/)
    თბილისიდან 170 კმ და 3:25-ია, 1550 მეტრზე, უმეტესად ასფალტიანი და კროსოვერით შეფასებული. მთავარი გზა
    ასფალტია, საფარზე ჩამოცვენილი ქვები კი აქ ჩვეულებრივი ამბავია; გველეთის ბილიკამდე ბოლო ორიოდე
    კილომეტრი გრუნტია. ეს სასაზღვრო ზონაა — საბუთი თან იქონიეთ და თავად გამშვებ პუნქტამდე არ ასვლათ:
    ნაქირავები მანქანით საქართველოს დატოვება არ არის ნებადართული. ორი საათი საკმარისია.

    ## გვერდითი ხეობები: სად იწყება ჯიპი

    | ადგილი | გზა | კატეგორია | სიმაღლე | თბილისიდან | სეზონი |
    |---|---|---|---|---|---|
    | [თრუსოს ხეობა](/attractions/truso-valley/) | გრუნტი | ჯიპი 4x4 | 2100 მ | 145 კმ, 3:00 | ივნისი-სექტემბერი |
    | [სნოს ხეობა](/attractions/sno-valley/) | ასფალტი | ეკონომი | 1650 მ | 152 კმ, 3:00 | მაისი-ოქტომბერი |
    | [ჯუთა და ჭაუხი](/attractions/juta-chaukhi/) | მხოლოდ 4x4 | ჯიპი 4x4 | 2150 მ | 165 კმ, 3:45 | ივნისი-სექტემბერი |

    თრუსოსკენ ყობიდან უხვევთ: თხუთმეტი კილომეტრი ქვიანი, დაღარული გრუნტი რამდენიმე ფონით, ძლიერი
    წვიმის შემდეგ კი ფონები ადიდდება და გზა შეიძლება საერთოდ გაუვალი გახდეს. შესასვლელთან სასაზღვრო
    პოლიციის პოსტია. ჯუთასკენ აჩხოტიდან უხვევთ, სტეფანწმინდამდე ცოტათი ადრე: სოფელ სნომდე 5 კმ ასფალტია,
    შემდეგ 8 კმ უხეში, ქვიანი და ციცაბო გზაა ღელეების გადაკვეთით. ორივე მონიშნულია როგორც არა მთელი
    წლის განმავლობაში ხელმისაწვდომი და სეზონის მიღმა თოვლი ხურავს. ორივეს ექვსი საათი უნდა.

    ## რომელ კატეგორიას ითხოვს მონაცემები

    - **მთავარი გზა ჯვრის უღელტეხილამდე** — ყველა გაჩერება ეკონომითაა შეფასებული.
    - **გუდაური, გერგეტი, დარიალი** — კროსოვერი: სიმაღლე, ზამთარი, ბეტონის აღმართი და გრუნტიანი
      ბოლო. თუ სიაში გერგეტია, აიღეთ [კროსოვერი](/car-rental/suv/).
    - **თრუსო და ჯუთა** — ჯიპის კატეგორია. აიღეთ [ჯიპი 4x4](/car-rental/4x4/), ან მანქანა სნოში დატოვეთ და
      სტეფანწმინდიდან ადგილობრივი ჯიპით ადით, როგორც ჩვენი ჯუთას გვერდი გირჩევთ.

    სრული მსჯელობა აქაა: [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/)

    ## საუკეთესო სეზონი მონაცემებით

    თავად მარშრუტი მთელი წელი სეზონშია. გერგეტსა და დარიალს მაისი-ოქტომბერი უწერია, ჟინვალსაც ასევე,
    გუდაურს — დეკემბერი-მარტი, თრუსოსა და ჯუთას — ივნისი-სექტემბერი. ზამთარში, მონაცემების მიხედვით,
    უღელტეხილი თოვლის შემდეგ საათობით ან დღეობით შეიძლება დაიკეტოს, გერგეტის გზა კი ჯაჭვებისა და
    სრული წამყვანის საქმეა.

    ## ორი დღე სამხედრო გზაზე

    [მარშრუტის გეგმიდან](/routes/military-highway-kazbegi/).

    **დღე 1 — თბილისიდან სტეფანწმინდამდე, 170 კმ, 3:30 გზაში.** 09:00-ზე გასვლა; 25 კმ-ის შემდეგ
    მცხეთა და ჯვრის მონასტერი (1 სთ); 11:00-ზე ჟინვალის ხედი (30 წთ); 11:45-ზე ანანური (1:15); სადილი
    ფასანაურში ან კვეშეთში; 15:30-ზე გუდაური და მეგობრობის მონუმენტი (1 სთ), აქვე საწვავი; 18:00-ზე
    სტეფანწმინდაში ჩასვლა.

    **დღე 2 — სტეფანწმინდიდან თბილისამდე, 170 კმ, 3:10 გზაში.** 08:30-ზე გერგეტი — 6 კმ ციცაბო გზა
    ან 1,5 საათი ფეხით (2 სთ); 11:00-ზე დარიალის ხეობა და გველეთი (1:30); სადილი სტეფანწმინდაში;
    14:30-ზე უკან უღელტეხილზე ყობის ტრავერტინებთან გაჩერებით; ბოლო შესვენება ანანურთან ან ჟინვალთან;
    19:00-ზე თბილისში.

    თუ თრუსო და ჯუთაც გინდათ, ოთხდღიანი [ყაზბეგის ჰაიქინგის ბაზა](/routes/kazbegi-hiking-base/)
    თითოეულს ცალკე დღეს უთმობს.

    ## პატიოსანი გაფრთხილებები

    - ეს ტიპური საფარისა და სეზონის კლასიფიკაციაა და არა გზის მიმდინარე ანგარიში. მონაცემები არ
      ამბობს, ღიაა თუ არა უღელტეხილი დღეს.
    - მთაში თბილისზე 15-20 გრადუსით ცივა; ქურთუკი ივლისშიც გჭირდებათ.
    - ყაზბეგი 10:00-ის შემდეგ ხშირად ღრუბელშია; მონაცემები წვერის დასანახად 07:00-10:00-ს გირჩევთ.
    - თრუსო და დარიალი სასაზღვრო ზონაა — პასპორტი ან პირადობა თან იქონიეთ.
    - სანამ მანქანას ასფალტს ჩამოაცილებთ, წაიკითხეთ [გაქირავების პირობები](/terms/).
  faq:
  - q: "თბილისიდან ყაზბეგამდე გზა ასფალტიანია?"
    a: "დიახ. მთავარ გზაზე ყველა გაჩერება ჩვენს მონაცემებში ასფალტიანადაა კლასიფიცირებული — ჟინვალიდან ჯვრის უღელტეხილამდე 2380 მეტრზე. გამონაკლისი გერგეტის სამებაა, უმეტესად ასფალტიანი, რადგან სტეფანწმინდიდან ბოლო 6 კმ ციცაბო, ვიწრო ბეტონის აღმართია."
  - q: "ყაზბეგისთვის ჯიპი მჭირდება?"
    a: "სტეფანწმინდისა და გერგეტისთვის — არა: ორივე კროსოვერითაა შეფასებული, თბილისიდან 160 კმ და 3:10. ჯიპის შეფასება მხოლოდ გვერდით ხეობებში ჩნდება — თრუსო (გრუნტი) და ჯუთა (მხოლოდ 4x4), ორივე ივნისიდან სექტემბრამდე."
  - q: "რა სიმაღლეზეა ჯვრის უღელტეხილი და ზამთარში ღიაა?"
    a: "2380 მეტრი, და ჩვენს მონაცემებში მთელი წელი ღიად არის მონიშნული. იგივე მონაცემები ამბობს, რომ დიდი თოვლის შემდეგ უღელტეხილი საათობით ან დღეობით შეიძლება დაიკეტოს, ცივ სეზონზე ზამთრის საბურავები სავალდებულოა, მლეთა-გუდაურის აღმართი კი ზვავსაშიშია."
  - q: "რამდენ ხანს მივდივართ ყაზბეგში?"
    a: "სტეფანწმინდა 155 კმ და დაახლოებით სამი საათია; გერგეტი — 160 კმ და 3:10. ორდღიანი მარშრუტი სულ 340 კმ და 6:40 გზაშია ჟინვალის, ანანურის, გუდაურის, გერგეტისა და დარიალის გაჩერებებით."
  - q: "სად არის ბოლო ბენზინგასამართი სამხედრო გზაზე?"
    a: "მონაცემები ასახელებს ნატახტარს, ჟინვალს, ფასანაურს, გუდაურსა და სტეფანწმინდას. თრუსოსა და ჯუთას ხეობებში საწვავი არ არის — ჩაასხით, სანამ გადაუხვევთ."
  - q: "ჯუთაში ჩვეულებრივი მანქანით ავალ?"
    a: "არა. ასფალტი 5 კმ-ის შემდეგ სოფელ სნოსთან მთავრდება; ჯუთამდე ბოლო 8 კმ მხოლოდ 4x4-ისთვისაა და ჯიპის კატეგორიით შეფასებული. ალტერნატივა, რომელსაც მონაცემები გთავაზობთ, ასეთია: მანქანა სნოში დატოვეთ და სტეფანწმინდიდან ადგილობრივი ჯიპით ადით."

ru:
  name: "Дорога в Казбеги: Военно-Грузинская дорога по участкам"
  answer: >-
    Военно-Грузинская дорога от Тбилиси до Степанцминды (Казбеги) заасфальтирована на всём
    протяжении: Ананури на 70-м км, Гудаури на 120-м (2200 м), Крестовый перевал на 125-м (2380 м) и
    Степанцминда на 155-м км, около трёх часов. Для основной дороги достаточно машины эконом-класса;
    последние 6 км бетонного подъёма к церкви Гергети (2170 м) рассчитаны на кроссовер. Только
    боковые ущелья — Трусо (грунт) и Джута (только 4x4) — требуют внедорожника 4x4, с июня по
    сентябрь. RentUp ставит зимние шины с 1 декабря по 1 апреля; участок у Гудаури зимой
    периодически закрывается.
  short: "Асфальт от Тбилиси до Крестового перевала на 2380 м, крутой бетонный подъём к Гергети и два боковых ущелья, где начинается внедорожник. Каждая цифра из наших дорожных данных."
  meta_title: "Дорога в Казбеги: Военно-Грузинская дорога | RentUp"
  meta_description: "Военно-Грузинская дорога по участкам: покрытие, высота, Крестовый перевал на 2380 м, подъём к Гергети и какая категория машины нужна на каждой остановке."
  body: |
    ## Что это за дорога

    Военно-Грузинская дорога (E117) идёт из Тбилиси на север вдоль Арагви, через Крестовый перевал и
    вниз по долине Терека до Степанцминды. В нашей базе это самая «воспитанная» горная дорога страны:
    **каждая остановка на основной трассе классифицирована как асфальт** - от
    [Жинвали](/attractions/zhinvali-reservoir/) на 810 м до
    [Крестового перевала](/attractions/jvari-pass-friendship-monument/) на 2380 м. Каждая из этих
    остановок отмечена как открытая круглый год.

    Оценку поднимают две вещи. [Гудаури](/attractions/gudauri/) стоит на 2200 м и даже на асфальте
    отмечен кроссовером из-за высоты и зимы, а последние 6 км до
    [церкви Гергети](/attractions/gergeti-trinity-church/) - это в основном асфальт с категорией
    кроссовер. Настоящий внедорожник нужен только в двух боковых ущельях - Трусо и Джута. Именно
    поэтому наш [маршрут по Военно-Грузинской дороге](/routes/military-highway-kazbegi/) отмечен
    кроссовером: 340 км, 6:40 за рулём, сезон круглый год.

    ## По участкам

    ### Тбилиси - Жинвали - Ананури (0-70 км)

    Первый час - обычный асфальт через Мцхету и Натахтари. После Жинвальской плотины, 65 км и 1:15 от
    Тбилиси, дорога идёт вдоль берега и сужается: она вырублена в скале, со слепыми поворотами, так
    что грузовики обгоняют осторожно. Данные советуют заправиться в Натахтари - выше станций всё
    меньше. [Крепость Ананури](/attractions/ananuri-fortress/) ещё через 5 км: 70 км и 1:20 от
    города, 830 м, прямо у дороги с большой парковкой. Обе остановки - эконом-класс и круглый год;
    на каждую закладывайте час.

    ### Ананури - Пасанаури - Гудаури (70-120 км)

    За Ананури Арагвское ущелье сжимается, дорога остаётся узкой. Выше Пасанаури характер меняется:
    длинный подъём серпантином, который вы делите с тяжёлыми фурами. Гудаури - 120 км и 2:10 от
    Тбилиси, 2200 м. Асфальт в порядке, но именно этот участок в данных отмечен как лавиноопасный
    зимой: периодически закрывается, зимние шины в холодный сезон обязательны, цепи стоит возить с
    собой. Гудаури именно поэтому отмечен кроссовером, а его лучший сезон - декабрь-март. Топливо -
    в Пасанаури и в центре Гудаури.

    ### Гудаури - Крестовый перевал - Коби (120-125 км)

    Участок Млета-Гудаури - непрерывный подъём с фурами и без места для обгона, а сам перевал -
    125 км и 2:20 от Тбилиси, 2380 м. От Ананури на 830 м это примерно 1550 м набора на 55 км.
    Покрытие - асфальт, категория - эконом, открыт круглый год, с оговоркой: зимой нужны зимние
    шины, цепи в багажнике и готовность повернуть назад. На монумент Дружбы - час. На спуске к Коби
    дорога проходит мимо минеральных травертинов.

    ### Коби - Степанцминда - Гергети (до 160 км)

    Степанцминда - 155 км и около трёх часов от Тбилиси. Церковь Гергети - 160 км и 3:10, 2170 м.
    Последние 6 км от посёлка - крутая узкая бетонная дорога: по данным, седан технически пройдёт её
    в сухую погоду, но чтобы разъехаться со встречной машиной, два колеса приходится ставить на
    грунт, поэтому на деле нужен кроссовер, а зимой цепи и полный привод обязательны. Лучший сезон -
    май-октябрь, открыто круглый год, на месте три часа. Заправка - в Пасанаури или Степанцминде.

    ### За Степанцминдой: Дарьяльское ущелье

    [Дарьяльское ущелье и водопады Гвелети](/attractions/dariali-gorge-gveleti-waterfalls/) -
    170 км и 3:25 от Тбилиси, 1550 м, в основном асфальт и категория кроссовер. Основная дорога -
    асфальт, но камни от осыпей на покрытии здесь обычное дело; последняя пара километров до тропы
    на Гвелети - гравий. Это пограничная зона: возьмите документы и не доезжайте до самого перехода -
    выезд на арендованной машине из Грузии не разрешён. Двух часов достаточно.

    ## Боковые ущелья: где начинается внедорожник

    | Место | Дорога | Категория | Высота | От Тбилиси | Сезон |
    |---|---|---|---|---|---|
    | [Трусо](/attractions/truso-valley/) | грунт | внедорожник 4x4 | 2100 м | 145 км, 3:00 | июнь-сентябрь |
    | [Ущелье Сно](/attractions/sno-valley/) | асфальт | эконом | 1650 м | 152 км, 3:00 | май-октябрь |
    | [Джута и Чаухи](/attractions/juta-chaukhi/) | только 4x4 | внедорожник 4x4 | 2150 м | 165 км, 3:45 | июнь-сентябрь |

    В Трусо сворачивают у Коби: пятнадцать километров каменистого разбитого грунта с несколькими
    бродами, а после сильного дождя броды поднимаются и дорога может стать непроходимой вовсе. На
    входе - пост пограничной полиции. На Джуту сворачивают у Ачхоти, чуть не доезжая Степанцминды:
    5 км асфальта до села Сно, затем 8 км грубой каменистой крутой дороги с пересечением ручьёв. Оба
    места отмечены как недоступные круглый год, вне сезона их закрывает снег. На каждое - шесть часов.

    ## Какую категорию требуют данные

    - **Основная дорога до Крестового перевала** - каждая остановка отмечена эконом-классом.
    - **Гудаури, Гергети, Дарьял** - кроссовер: высота, зима, бетонный подъём и гравийный финиш.
      Если в списке Гергети, берите [кроссовер](/car-rental/suv/).
    - **Трусо и Джута** - внедорожник. Берите [внедорожник 4x4](/car-rental/4x4/) или оставьте машину
      в Сно и поднимитесь на местном джипе из Степанцминды, как советует наша страница Джуты.

    Общая логика - в статье [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).

    ## Лучший сезон по данным

    Сам маршрут в сезоне круглый год. У Гергети и Дарьяла указан май-октябрь, у Жинвали то же, у
    Гудаури - декабрь-март, у Трусо и Джуты - июнь-сентябрь. Зимой, по данным, перевал может
    закрываться на часы или дни после снегопада, а дорога к Гергети - это цепи и полный привод.

    ## Два дня на дороге

    Из [плана маршрута](/routes/military-highway-kazbegi/).

    **День 1 - Тбилиси - Степанцминда, 170 км, 3:30 за рулём.** Выезд в 09:00; через 25 км Мцхета и
    монастырь Джвари (1 ч); в 11:00 смотровая Жинвали (30 мин); в 11:45 Ананури (1:15); обед в
    Пасанаури или Квешети; в 15:30 Гудаури и монумент Дружбы (1 ч), здесь же заправка; в 18:00
    Степанцминда.

    **День 2 - Степанцминда - Тбилиси, 170 км, 3:10 за рулём.** В 08:30 Гергети - 6 км крутой дороги
    или 1,5 часа пешком (2 ч); в 11:00 Дарьяльское ущелье и Гвелети (1:30); обед в Степанцминде;
    в 14:30 обратно через перевал с остановкой у травертинов Коби; последняя остановка в Ананури или
    Жинвали; в 19:00 Тбилиси.

    Если нужны ещё Трусо и Джута, четырёхдневная [хайкинг-база в Казбеги](/routes/kazbegi-hiking-base/)
    отводит каждому по дню.

    ## Честные предупреждения

    - Это классификация типичного покрытия и сезона, а не сводка о состоянии дороги. Данные не
      говорят, открыт ли перевал сегодня.
    - В горах на 15-20°C холоднее, чем в Тбилиси; куртка нужна даже в июле.
    - Казбек после 10:00 обычно в облаках; данные советуют 07:00-10:00 для чистой вершины.
    - Трусо и Дарьял - пограничные зоны; возьмите паспорт или ID.
    - Прежде чем съезжать с асфальта, прочитайте [условия аренды](/terms/).
  faq:
  - q: "Дорога из Тбилиси в Казбеги асфальтированная?"
    a: "Да. Каждая остановка на основной дороге в наших данных классифицирована как асфальт - от Жинвали до Крестового перевала на 2380 м. Исключение - церковь Гергети, в основном асфальт: последние 6 км от Степанцминды - крутой узкий бетонный подъём."
  - q: "Нужен ли внедорожник для Казбеги?"
    a: "Для Степанцминды и Гергети - нет: обе точки отмечены кроссовером, 160 км и 3:10 от Тбилиси. Категория внедорожник появляется только в боковых ущельях - Трусо (грунт) и Джута (только 4x4), оба с июня по сентябрь."
  - q: "Какая высота у Крестового перевала и открыт ли он зимой?"
    a: "2380 м, в наших данных он отмечен открытым круглый год. Те же данные говорят, что после сильного снегопада перевал закрывается на часы или дни, зимние шины в холодный сезон обязательны, а подъём Млета-Гудаури лавиноопасен."
  - q: "Сколько ехать до Казбеги?"
    a: "Степанцминда - 155 км и около трёх часов; Гергети - 160 км и 3:10. Двухдневный маршрут - 340 км и 6:40 за рулём с остановками в Жинвали, Ананури, Гудаури, Гергети и Дарьяле."
  - q: "Где последняя заправка на Военно-Грузинской дороге?"
    a: "Данные называют Натахтари, Жинвали, Пасанаури, Гудаури и Степанцминду. В ущельях Трусо и Джута топлива нет - заправляйтесь до поворота."
  - q: "Можно ли доехать до Джуты на обычной машине?"
    a: "Нет. Асфальт заканчивается у села Сно через 5 км; последние 8 км до Джуты классифицированы как только 4x4 и отмечены как внедорожник. Альтернатива из данных - оставить машину в Сно и взять местный джип из Степанцминды."

fa:
  name: "جادّهٔ کازبگی: بزرگراه نظامی گرجستان قطعه به قطعه"
