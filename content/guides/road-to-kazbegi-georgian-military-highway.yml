  meta_title: "جادّهٔ کازبگی: بزرگراه نظامی گرجستان | RentUp"
  meta_description: "بزرگراه نظامی گرجستان قطعه به قطعه: سطح جادّه، ارتفاع، گردنهٔ جواری در 2,380 متر، سربالایی گرگتی و اینکه هر توقف در راه چه ردهٔ خودرویی می‌خواهد."
  body: |
    ## این جادّه چیست

    بزرگراه نظامی گرجستان (E117) از تفلیس به سمت شمال در امتداد رود آراگوی می‌رود، از گردنهٔ جواری
    می‌گذرد و از درّهٔ ترگی به استپانتسمیندا می‌رسد. در پایگاه دادهٔ ما این رام‌ترین جادّهٔ کوهستانی
    کشور است: **هر توقف روی مسیر اصلی آسفالت ثبت شده است** - از
    [ژینوالی](/attractions/zhinvali-reservoir/) در 810 متر تا
    [گردنهٔ جواری](/attractions/jvari-pass-friendship-monument/) در 2,380 متر، و همهٔ این توقف‌ها
    تمام سال باز علامت خورده‌اند.

    دو چیز رده را بالا می‌برد. [گودائوری](/attractions/gudauri/) در 2,200 متر به دلیل ارتفاع و زمستان
    حتی روی آسفالت شاسی‌بلند ثبت شده، و 6 کیلومتر آخر تا
    [کلیسای گرگتی](/attractions/gergeti-trinity-church/) از ردهٔ عمدتاً آسفالت با شاسی‌بلند است.
    نیاز واقعی به آفرود تنها در تروسو و جوتا پیدا می‌شود. به همین دلیل
    [مسیر بزرگراه نظامی](/routes/military-highway-kazbegi/) ما شاسی‌بلند است: 340 کیلومتر، 6:40
    رانندگی و فصل تمام سال.

    ## قطعه به قطعه

    ### تفلیس تا ژینوالی و آنانوری (0-70 کیلومتر)

    پس از سد ژینوالی، 65 کیلومتر و 1:15 از تفلیس، جادّه در امتداد ساحل باریک می‌شود: در دل صخره
    بریده شده و پیچ‌های کور دارد. داده‌ها می‌گویند در ناتاختاری سوخت بزنید، چون بالاتر پمپ‌ها کم
    می‌شوند. [قلعهٔ آنانوری](/attractions/ananuri-fortress/) 5 کیلومتر جلوتر است، 70 کیلومتر و 1:20
    از شهر در 830 متر، کنار جادّه با پارکینگ بزرگ. هر دو توقف اقتصادی و تمام سال باز؛ یک ساعت هرکدام.

    ### آنانوری تا پاسانائوری و گودائوری (70-120 کیلومتر)

    بالاتر از پاسانائوری سربالایی طولانی و پرپیچی آغاز می‌شود که با کامیون‌های سنگین مشترک است.
    گودائوری 120 کیلومتر و 2:10 از تفلیس در 2,200 متر است. آسفالت خوب است، اما همین قطعه در داده‌ها
    در زمستان بهمن‌خیز علامت خورده: گاه‌به‌گاه بسته می‌شود و لاستیک زمستانی در فصل سرد اجباری است.
    به همین دلیل گودائوری شاسی‌بلند ثبت شده و بهترین فصلش دسامبر تا مارس است. سوخت در پاسانائوری و
    مرکز گودائوری.

    ### گودائوری تا گردنهٔ جواری و کوبی (120-125 کیلومتر)

    قطعهٔ ملتا-گودائوری سربالایی پیوسته با کامیون و بدون جای سبقت است، و خود گردنه 125 کیلومتر و
    2:20 از تفلیس در 2,380 متر. از آنانوری در 830 متر یعنی حدود 1,550 متر صعود در 55 کیلومتر. سطح
    آسفالت و ردهٔ اقتصادی، تمام سال باز، اما در زمستان لاستیک زمستانی و زنجیر لازم است. برای بنای
    دوستی یک ساعت.

    ### کوبی تا استپانتسمیندا و گرگتی (تا 160 کیلومتر)

    استپانتسمیندا 155 کیلومتر و حدود سه ساعت از تفلیس است. کلیسای گرگتی 160 کیلومتر و 3:10 در
    2,170 متر. 6 کیلومتر آخر از روستا جادّهٔ بتنی تند و باریکی است: داده‌ها می‌گویند سدان در هوای خشک
    از نظر فنی رد می‌شود، اما برای عبور از خودروی روبه‌رو باید دو چرخ را روی خاک بگذارید، پس در عمل
    شاسی‌بلند لازم است و در زمستان زنجیر و چهار چرخ محرک ضروری. بهترین فصل مه تا اکتبر، تمام سال باز،
    سه ساعت در محل. سوخت در پاسانائوری یا استپانتسمیندا.

    ### پس از استپانتسمیندا: تنگهٔ داریالی

    [تنگهٔ داریالی و آبشارهای گولتی](/attractions/dariali-gorge-gveleti-waterfalls/) 170 کیلومتر و
    3:25 از تفلیس در 1,550 متر، عمدتاً آسفالت و شاسی‌بلند. جادّهٔ اصلی آسفالت است اما سنگ‌ریزش روی
    سطح عادی است؛ یکی-دو کیلومتر آخر خاکی است. منطقهٔ مرزی است و تا خود گذرگاه نروید - خروج خودروی
    اجاره‌ای از گرجستان مجاز نیست. دو ساعت کافی است.

    ## درّه‌های فرعی: آفرود از کجا شروع می‌شود

    | مکان | جادّه | خودرو | ارتفاع | از تفلیس | فصل |
    |---|---|---|---|---|---|
    | [درّهٔ تروسو](/attractions/truso-valley/) | خاکی | آفرود 4x4 | 2,100 متر | 145 کیلومتر، 3:00 | ژوئن-سپتامبر |
    | [درّهٔ سنو](/attractions/sno-valley/) | آسفالت | اقتصادی | 1,650 متر | 152 کیلومتر، 3:00 | مه-اکتبر |
    | [جوتا و چاوخی](/attractions/juta-chaukhi/) | فقط 4x4 | آفرود 4x4 | 2,150 متر | 165 کیلومتر، 3:45 | ژوئن-سپتامبر |

    تروسو از کوبی جدا می‌شود: پانزده کیلومتر خاکی سنگلاخ با چند گذر از رودخانه، و پس از باران شدید
    مسیر ممکن است به‌کلی ناگذر شود. جوتا از آچخوتی جدا می‌شود: 5 کیلومتر آسفالت تا روستای سنو، سپس
    8 کیلومتر ناهموار، سنگی و تند با گذر از جوی‌ها. هر دو «نه در تمام سال» علامت خورده‌اند و بیرون از
    فصل برف آن‌ها را می‌بندد. برای هرکدام شش ساعت.

    ## داده‌ها چه رده‌ای می‌خواهند

    - **جادّهٔ اصلی تا گردنهٔ جواری** - هر توقف اقتصادی ثبت شده است.
    - **گودائوری، گرگتی، داریالی** - شاسی‌بلند: ارتفاع، زمستان، سربالایی بتنی و پایان خاکی. اگر
      گرگتی در فهرست است، [شاسی‌بلند](/car-rental/suv/) بگیرید.
    - **تروسو و جوتا** - آفرود. [آفرود 4x4](/car-rental/4x4/) بگیرید، یا خودرو را در سنو بگذارید.

    منطق کامل: [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/)

    ## بهترین فصل از داده‌ها

    خود مسیر تمام سال در فصل است. گرگتی و داریالی مه تا اکتبر دارند، گودائوری دسامبر تا مارس، تروسو
    و جوتا ژوئن تا سپتامبر. در زمستان به گفتهٔ داده‌ها گردنه پس از برف ساعت‌ها یا روزها بسته می‌شود.

    ## دو روز روی بزرگراه

    از [برنامهٔ مسیر](/routes/military-highway-kazbegi/).

    **روز 1 - تفلیس تا استپانتسمیندا، 170 کیلومتر، 3:30 رانندگی.** حرکت 09:00؛ متسختا و صومعهٔ
    جواری (1 ساعت)؛ 11:00 ژینوالی (30 دقیقه)؛ 11:45 آنانوری (1:15)؛ ناهار در پاسانائوری؛ 15:30
    گودائوری و سوخت‌گیری (1 ساعت)؛ 18:00 استپانتسمیندا.

    **روز 2 - استپانتسمیندا تا تفلیس، 170 کیلومتر، 3:10 رانندگی.** 08:30 گرگتی (2 ساعت)؛ 11:00
    داریالی و گولتی (1:30)؛ ناهار؛ 14:30 بازگشت از گردنه با توقف در کوبی؛ 19:00 تفلیس.

    برای تروسو و جوتا، [پایگاه پیاده‌روی کازبگی](/routes/kazbegi-hiking-base/) چهارروزه به هرکدام
    یک روز می‌دهد.

    ## هشدارهای صادقانه

    - این رده‌بندی سطح و فصل معمول است، نه گزارش زندهٔ جادّه.
    - در کوهستان 15-20 درجه سردتر از تفلیس است؛ حتی در ژوئیه کاپشن لازم است.
    - تروسو و داریالی منطقهٔ مرزی‌اند؛ مدرک شناسایی همراه داشته باشید.
    - پیش از خروج از آسفالت [شرایط اجاره](/terms/) را بخوانید.
  faq:
  - q: "جادّهٔ تفلیس تا کازبگی آسفالت است؟"
    a: "بله. هر توقف روی جادّهٔ اصلی در داده‌های ما آسفالت است، از ژینوالی تا گردنهٔ جواری در 2,380 متر. استثنا کلیسای گرگتی با عمدتاً آسفالت است، چون 6 کیلومتر آخر از استپانتسمیندا سربالایی بتنی تند و باریک است."
  - q: "برای کازبگی به 4x4 نیاز دارم؟"
    a: "برای استپانتسمیندا و گرگتی نه: هر دو شاسی‌بلند ثبت شده‌اند، 160 کیلومتر و 3:10 از تفلیس. ردهٔ آفرود فقط در درّه‌های فرعی ظاهر می‌شود: تروسو (خاکی) و جوتا (فقط 4x4)، هر دو ژوئن تا سپتامبر."
  - q: "گردنهٔ جواری چقدر ارتفاع دارد و در زمستان باز است؟"
    a: "2,380 متر و در داده‌های ما تمام سال باز علامت خورده است. همان داده‌ها می‌گویند پس از برف سنگین گردنه ساعت‌ها یا روزها بسته می‌شود، لاستیک زمستانی اجباری است و سربالایی ملتا-گودائوری بهمن‌خیز است."
  - q: "رانندگی تا کازبگی چقدر طول می‌کشد؟"
    a: "استپانتسمیندا 155 کیلومتر و حدود سه ساعت؛ گرگتی 160 کیلومتر و 3:10. مسیر دوروزه در مجموع 340 کیلومتر و 6:40 رانندگی است با توقف در ژینوالی، آنانوری، گودائوری، گرگتی و داریالی."
  - q: "با خودروی معمولی می‌توان به جوتا رفت؟"
    a: "نه. آسفالت پس از 5 کیلومتر در روستای سنو تمام می‌شود؛ 8 کیلومتر آخر تا جوتا فقط 4x4 و ردهٔ آفرود است. جایگزین در داده‌ها: خودرو را در سنو بگذارید و با جیپ محلی از استپانتسمیندا بروید."

he:
  name: "הדרך לקזבגי: כביש הצבא הגאורגי קטע אחר קטע"
  answer: >-
    כביש הצבא הגאורגי מטביליסי לסטפנצמינדה (קזבגי) סלול לכל אורכו: אנאנורי בק"מ 70, גודאורי בק"מ 120
    (2,200 מ'), מעבר ג'ווארי בק"מ 125 (2,380 מ') וסטפנצמינדה בק"מ 155, כשלוש שעות. לכביש הראשי מספיק
    רכב אקונומי; 6 הק"מ האחרונים של עליית הבטון לכנסיית גרגטי (2,170 מ') מדורגים לרכב שטח עירוני. רק
    העמקים הצדדיים, טרוסו (דרך עפר) וג'וטה (4x4 בלבד), דורשים רכב שטח 4x4, מיוני עד ספטמבר. RentUp
    מרכיבה צמיגי חורף מ-1 בדצמבר עד 1 באפריל; גודאורי נסגר מעת לעת בחורף.
  short: "אספלט מטביליסי עד מעבר ג'ווארי ב-2,380 מ', עלייה תלולה בבטון לגרגטי, ושני עמקים צדדיים שבהם מתחיל הצורך ב-4x4. כל מספר מנתוני הדרכים שלנו."
  meta_title: "הדרך לקזבגי: כביש הצבא הגאורגי | RentUp"
  meta_description: "כביש הצבא הגאורגי קטע אחר קטע: פני הדרך, הגובה, מעבר ג'ווארי ב-2,380 מ', העלייה התלולה לגרגטי ואיזו קטגוריית רכב דורשת כל תחנה בדרך אל קזבגי."
  body: |
    ## מהי הדרך הזאת

    כביש הצבא הגאורגי (E117) יוצא מטביליסי צפונה לאורך נהר ארגווי, חוצה את מעבר ג'ווארי ויורד בעמק
    טרגי לסטפנצמינדה. במאגר שלנו זו דרך ההרים המנומסת ביותר במדינה: **כל תחנה על הכביש הראשי
    מסווגת אספלט** - מ[ז'ינוואלי](/attractions/zhinvali-reservoir/) ב-810 מ' ועד
    [מעבר ג'ווארי](/attractions/jvari-pass-friendship-monument/) ב-2,380 מ', וכל התחנות האלה
    מסומנות כפתוחות כל השנה.

    שני דברים מעלים את הסיווג. [גודאורי](/attractions/gudauri/) יושבת ב-2,200 מ' ומסווגת רכב שטח
    עירוני גם על אספלט, בגלל הגובה והחורף, ו-6 הק"מ האחרונים אל
    [כנסיית גרגטי](/attractions/gergeti-trinity-church/) הם אספלט ברובו בסיווג רכב שטח עירוני.
    צורך אמיתי ב-4x4 מופיע רק בשני העמקים הצדדיים, טרוסו וג'וטה. לכן
    [מסלול כביש הצבא](/routes/military-highway-kazbegi/) שלנו מסווג רכב שטח עירוני: 340 ק"מ,
    6:40 נהיגה, ובעונה כל השנה.

    ## קטע אחר קטע

    ### טביליסי לז'ינוואלי ואנאנורי (0-70 ק"מ)

    השעה הראשונה היא אספלט רגיל דרך מצחתה ונטאחטרי. אחרי סכר ז'ינוואלי, 65 ק"מ ו-1:15 מטביליסי,
    הדרך נצמדת לחוף ומצטמצמת: היא חצובה בסלע, עם פניות עיוורות, ולכן עוקפים משאיות בזהירות.
    הנתונים אומרים לתדלק בנטאחטרי, כי למעלה התחנות מתמעטות.
    [מבצר אנאנורי](/attractions/ananuri-fortress/) נמצא 5 ק"מ הלאה, 70 ק"מ ו-1:20 מהעיר ב-830 מ',
    ממש ליד הכביש עם חניון גדול. שתי התחנות מסווגות אקונומי ופתוחות כל השנה; שעה לכל אחת.

    ### אנאנורי לפסנאורי וגודאורי (70-120 ק"מ)

    מעל פסנאורי האופי משתנה: עלייה ארוכה בפיתולים, משותפת למשאיות כבדות. גודאורי היא 120 ק"מ
    ו-2:10 מטביליסי, ב-2,200 מ'. האספלט תקין, אבל זה הקטע שהנתונים מסמנים כמועד למפולות שלגים
    בחורף: נסגר מדי פעם, צמיגי חורף חובה בעונה הקרה, וכדאי לשאת שרשראות. לכן גודאורי מסווגת רכב
    שטח עירוני, והעונה הטובה שלה היא דצמבר-מרץ. דלק בפסנאורי ובמרכז גודאורי.

    ### גודאורי למעבר ג'ווארי ולקובי (120-125 ק"מ)

    קטע מלטה-גודאורי הוא עלייה רצופה עם משאיות ובלי מקום לעקיפה, והמעבר עצמו הוא 125 ק"מ ו-2:20
    מטביליסי, ב-2,380 מ'. מאנאנורי ב-830 מ' אלה כ-1,550 מ' טיפוס ב-55 ק"מ. פני הדרך אספלט, הסיווג
    אקונומי, פתוח כל השנה, עם ההערה שבחורף צריך צמיגי חורף, שרשראות בתא המטען ונכונות להסתובב
    חזרה. שעה לאנדרטת הידידות. בירידה לכובי עוברים ליד הטרוורטינים המינרליים.

    ### קובי לסטפנצמינדה ולגרגטי (עד 160 ק"מ)

    סטפנצמינדה היא 155 ק"מ וכשלוש שעות מטביליסי. כנסיית גרגטי היא 160 ק"מ ו-3:10, ב-2,170 מ'.
    6 הק"מ האחרונים מהכפר הם דרך בטון תלולה וצרה: הנתונים אומרים שסדאן יעבור אותה טכנית ביובש,
    אבל כדי לחלוף על פני רכב ממול צריך להוריד שני גלגלים לעפר, ולכן בפועל רוצים רכב שטח עירוני,
    ובחורף שרשראות והנעה כפולה הן הכרח. עונה מיטבית מאי-אוקטובר, פתוח כל השנה, שלוש שעות במקום.
    דלק בפסנאורי או בסטפנצמינדה.

    ### מעבר לסטפנצמינדה: ערוץ דריאלי

    [ערוץ דריאלי ומפלי גוולטי](/attractions/dariali-gorge-gveleti-waterfalls/) הם 170 ק"מ ו-3:25
    מטביליסי, ב-1,550 מ', אספלט ברובו ורכב שטח עירוני. הכביש הראשי אספלט, אבל אבנים ממפולות על
    פני הדרך הן שגרה כאן; הקילומטרים האחרונים אל תחילת השביל לגוולטי הם חצץ. זהו אזור גבול: קחו
    תעודה ואל תנהגו עד המעבר עצמו - הוצאת רכב שכור מגאורגיה אינה מותרת. שעתיים מספיקות.

    ## העמקים הצדדיים: איפה מתחיל ה-4x4

    | מקום | דרך | רכב | גובה | מטביליסי | עונה |
    |---|---|---|---|---|---|
    | [עמק טרוסו](/attractions/truso-valley/) | דרך עפר | 4x4 שטח | 2,100 מ' | 145 ק"מ, 3:00 | יוני-ספטמבר |
    | [עמק סנו](/attractions/sno-valley/) | אספלט | אקונומי | 1,650 מ' | 152 ק"מ, 3:00 | מאי-אוקטובר |
    | [ג'וטה וצ'אוחי](/attractions/juta-chaukhi/) | 4x4 בלבד | 4x4 שטח | 2,150 מ' | 165 ק"מ, 3:45 | יוני-ספטמבר |

    לטרוסו פונים בקובי: חמישה-עשר ק"מ של חצץ אבני ומחורץ עם כמה מעברי נהר, ואחרי גשם כבד המעברים
    עולים והדרך עלולה להיות בלתי עבירה לגמרי. בכניסה יש עמדת משטרת גבול. לג'וטה פונים באצ'חוטי,
    רגע לפני סטפנצמינדה: 5 ק"מ אספלט עד הכפר סנו, ואז 8 ק"מ גסים, אבניים ותלולים עם חציית נחלים.
    שתיהן מסומנות כלא נגישות כל השנה, ומחוץ לעונה השלג סוגר אותן. שש שעות לכל אחת.

    ## איזו קטגוריה דורשים הנתונים

    - **הכביש הראשי עד מעבר ג'ווארי** - כל תחנה מסווגת אקונומי.
    - **גודאורי, גרגטי, דריאלי** - רכב שטח עירוני: גובה, חורף, עלייה בבטון וסיום בחצץ. אם גרגטי
      ברשימה, הזמינו [רכב שטח עירוני](/car-rental/suv/).
    - **טרוסו וג'וטה** - שטח. הזמינו [4x4 שטח](/car-rental/4x4/), או השאירו את הרכב בסנו ועלו
      בג'יפ מקומי מסטפנצמינדה.

    ההיגיון המלא נמצא ב[האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).

    ## העונה הטובה, מהנתונים

    המסלול עצמו בעונה כל השנה. גרגטי ודריאלי נושאים מאי-אוקטובר, ז'ינוואלי גם, גודאורי דצמבר-מרץ,
    טרוסו וג'וטה יוני-ספטמבר. בחורף, לפי הנתונים, המעבר עלול להיסגר לשעות או לימים אחרי שלג, ודרך
    גרגטי היא עניין של שרשראות והנעה כפולה.

    ## יומיים על הכביש

    מתוך [תוכנית המסלול](/routes/military-highway-kazbegi/).

    **יום 1 - טביליסי לסטפנצמינדה, 170 ק"מ, 3:30 נהיגה.** יציאה ב-09:00; אחרי 25 ק"מ מצחתה ומנזר
    ג'ווארי (שעה); ב-11:00 תצפית ז'ינוואלי (30 דק'); ב-11:45 אנאנורי (1:15); צהריים בפסנאורי או
    קוושטי; ב-15:30 גודאורי ואנדרטת הידידות (שעה), תדלוק כאן; ב-18:00 סטפנצמינדה.

    **יום 2 - סטפנצמינדה לטביליסי, 170 ק"מ, 3:10 נהיגה.** ב-08:30 גרגטי, 6 ק"מ דרך תלולה או 1.5
    שעות ברגל (שעתיים); ב-11:00 ערוץ דריאלי וגוולטי (1:30); צהריים בסטפנצמינדה; ב-14:30 חזרה
    דרך המעבר עם עצירה בטרוורטינים של קובי; הפסקה אחרונה באנאנורי או בז'ינוואלי; ב-19:00 טביליסי.

    למי שרוצה גם את טרוסו וג'וטה, [בסיס טיולי קזבגי](/routes/kazbegi-hiking-base/) בן ארבעה ימים
    מקדיש יום לכל אחד.

    ## אזהרות כנות

    - זהו סיווג של פני דרך ועונה אופייניים, לא דיווח חי. הנתונים לא אומרים אם המעבר פתוח היום.
    - בהרים קר ב-15-20 מעלות מטביליסי; מעיל נחוץ גם ביולי.
    - קזבק אחרי 10:00 בדרך כלל בענן; הנתונים מציעים 07:00-10:00 לפסגה נקייה.
    - טרוסו ודריאלי הם אזורי גבול; קחו דרכון או תעודת זהות.
    - לפני שיורדים מהאספלט, קראו את [תנאי ההשכרה](/terms/).
  faq:
  - q: "הדרך מטביליסי לקזבגי סלולה?"
    a: "כן. כל תחנה על הכביש הראשי מסווגת אספלט בנתונים שלנו, מז'ינוואלי עד מעבר ג'ווארי ב-2,380 מ'. היוצא מן הכלל הוא כנסיית גרגטי, אספלט ברובו, כי 6 הק\"מ האחרונים מסטפנצמינדה הם עלייה תלולה וצרה בבטון."
  - q: "צריך 4x4 לקזבגי?"
    a: "לא לסטפנצמינדה ולגרגטי: שתיהן מסווגות רכב שטח עירוני, 160 ק\"מ ו-3:10 מטביליסי. סיווג השטח מופיע רק בעמקים הצדדיים, טרוסו (דרך עפר) וג'וטה (4x4 בלבד), שניהם יוני עד ספטמבר."
  - q: "מה גובה מעבר ג'ווארי והאם הוא פתוח בחורף?"
    a: "2,380 מ', ובנתונים שלנו הוא מסומן פתוח כל השנה. אותם נתונים אומרים שאחרי שלג כבד המעבר נסגר לשעות או לימים, צמיגי חורף חובה בעונה הקרה, והעלייה מלטה-גודאורי מועדת למפולות שלגים."
  - q: "כמה זמן נוסעים לקזבגי?"
    a: "סטפנצמינדה היא 155 ק\"מ וכשלוש שעות; גרגטי 160 ק\"מ ו-3:10. המסלול הדו-יומי מסתכם ב-340 ק\"מ ו-6:40 נהיגה עם עצירות בז'ינוואלי, אנאנורי, גודאורי, גרגטי ודריאלי."
  - q: "אפשר להגיע לג'וטה ברכב רגיל?"
    a: "לא. האספלט נגמר בכפר סנו אחרי 5 ק\"מ; 8 הק\"מ האחרונים לג'וטה מסווגים 4x4 בלבד ובקטגוריית שטח. החלופה בנתונים: להשאיר את הרכב בסנו ולקחת ג'יפ מקומי מסטפנצמינדה."

ar:
  name: "الطريق إلى كازبيغي: الطريق العسكري الجورجي مقطعاً مقطعاً"
  answer: >-
    الطريق العسكري الجورجي من تبليسي إلى ستيبانتسميندا (كازبيغي) معبّد على طوله: أنانوري عند
    الكيلومتر 70، وغوداوري عند الكيلومتر 120 (2,200 متر)، وممر جواري عند الكيلومتر 125 (2,380
    متراً)، وستيبانتسميندا عند الكيلومتر 155، في نحو ثلاث ساعات. السيارة الاقتصادية تكفي للطريق
    الرئيسي؛ أما آخر 6 كم من الصعود الخرساني إلى كنيسة غيرغيتي (2,170 متراً) فمصنّفة لدفع رباعي
    خفيف. الواديان الجانبيان فقط، تروسو (ترابي) وجوتا (4x4 فقط)، يحتاجان إلى دفع رباعي وعر، من يونيو
    إلى سبتمبر. تركّب RentUp إطارات الشتاء من 1 ديسمبر إلى 1 أبريل؛ وغوداوري يُغلق دورياً في الشتاء.
  short: "إسفلت من تبليسي حتى ممر جواري على 2,380 متراً، وصعود خرساني حاد إلى غيرغيتي، وواديان جانبيان يبدأ فيهما شرط الدفع الرباعي. كل رقم من بيانات طرقنا."
  meta_title: "الطريق إلى كازبيغي: الطريق العسكري الجورجي | RentUp"
  meta_description: "الطريق العسكري الجورجي مقطعاً مقطعاً: سطح الطريق، الارتفاع، ممر جواري على 2,380 متراً، الصعود إلى غيرغيتي، وأي فئة سيارة تحتاجها كل محطة في الطريق."
  body: |
    ## ما هذا الطريق

    يمتد الطريق العسكري الجورجي (E117) من تبليسي شمالاً بمحاذاة نهر أراغفي، فوق ممر جواري ثم نزولاً
    في وادي تيرغي إلى ستيبانتسميندا. وهو في قاعدة بياناتنا أهدأ طريق جبلي في البلاد: **كل محطة على
    الطريق الرئيسي مصنّفة إسفلت** - من [جينفالي](/attractions/zhinvali-reservoir/) على 810 أمتار
    حتى [ممر جواري](/attractions/jvari-pass-friendship-monument/) على 2,380 متراً، وكل هذه المحطات
    مُعلّمة مفتوحة طوال السنة.

    أمران يرفعان التصنيف. [غوداوري](/attractions/gudauri/) على 2,200 متر مصنّفة دفعاً رباعياً خفيفاً
    حتى على الإسفلت بسبب الارتفاع والشتاء، والكيلومترات الست الأخيرة إلى
    [كنيسة غيرغيتي](/attractions/gergeti-trinity-church/) من صنف إسفلت في معظمه بفئة دفع رباعي خفيف.
    أما الحاجة الحقيقية إلى 4x4 فلا تظهر إلا في الواديين الجانبيين تروسو وجوتا. لهذا
    [مسار الطريق العسكري](/routes/military-highway-kazbegi/) عندنا مصنّف دفعاً رباعياً خفيفاً:
    340 كم، و6:40 قيادة، وموسمه طوال السنة.

    ## مقطعاً مقطعاً

    ### من تبليسي إلى جينفالي وأنانوري (0-70 كم)

    الساعة الأولى إسفلت عادي عبر متسخيتا وناتاختاري. بعد سد جينفالي، 65 كم و1:15 من تبليسي، يلازم
    الطريق الضفة ويضيق: محفور في الصخر بمنعطفات عمياء، فتجاوز الشاحنات بحذر. تقول البيانات املأ
    الخزان في ناتاختاري لأن المحطات تقل في الأعلى. [قلعة أنانوري](/attractions/ananuri-fortress/)
    بعد 5 كم أخرى، 70 كم و1:20 من المدينة على 830 متراً، على جانب الطريق مباشرة مع موقف كبير.
    المحطتان اقتصاديتان ومفتوحتان طوال السنة؛ ساعة لكل منهما.

    ### من أنانوري إلى باسانوري وغوداوري (70-120 كم)

    فوق باسانوري يتغيّر الطابع: صعود طويل متعرّج تتقاسمه مع شاحنات ثقيلة. غوداوري على بعد 120 كم
    و2:10 من تبليسي على 2,200 متر. الإسفلت سليم، لكن هذا المقطع بالذات مُعلّم في البيانات معرّضاً
    للانهيارات الثلجية شتاءً: يُغلق دورياً، والإطارات الشتوية إلزامية في الموسم البارد، وحمل السلاسل
    يستحق. لذلك صُنّفت غوداوري دفعاً رباعياً خفيفاً، وأفضل موسمها ديسمبر-مارس. الوقود في باسانوري
    ووسط غوداوري.

    ### من غوداوري إلى ممر جواري وكوبي (120-125 كم)

    مقطع مليتا-غوداوري صعود متواصل مع الشاحنات بلا مجال للتجاوز، والممر نفسه على بعد 125 كم و2:20
    من تبليسي على 2,380 متراً. من أنانوري على 830 متراً هذا نحو 1,550 متر صعود في 55 كم. السطح إسفلت
    والفئة اقتصادية، مفتوح طوال السنة، مع ملاحظة أن الشتاء يحتاج إطارات شتوية وسلاسل في الصندوق
    واستعداداً للعودة أدراجك. ساعة عند نصب الصداقة. في النزول نحو كوبي تمر بالترافرتين المعدني.

    ### من كوبي إلى ستيبانتسميندا وغيرغيتي (حتى 160 كم)

    ستيبانتسميندا على بعد 155 كم ونحو ثلاث ساعات من تبليسي. كنيسة غيرغيتي 160 كم و3:10 على
    2,170 متراً. الكيلومترات الست الأخيرة من القرية طريق خرساني حاد وضيق: تقول البيانات إن السيدان
    يجتازه نظرياً في الجفاف، لكن مرور سيارة مقابلة يعني وضع عجلتين على التراب، فما تريده فعلاً هو
    دفع رباعي خفيف، وفي الشتاء السلاسل والدفع الرباعي ضروريان. أفضل موسم مايو-أكتوبر، مفتوح طوال
    السنة، ثلاث ساعات في الموقع. الوقود في باسانوري أو ستيبانتسميندا.

    ### بعد ستيبانتسميندا: مضيق داريالي

    [مضيق داريالي وشلالات غفيليتي](/attractions/dariali-gorge-gveleti-waterfalls/) على بعد 170 كم
    و3:25 من تبليسي على 1,550 متراً، إسفلت في معظمه بفئة دفع رباعي خفيف. الطريق الرئيسي إسفلت، لكن
    حطام الانهيارات الصخرية على السطح أمر معتاد هنا؛ وآخر كيلومترين إلى بداية درب غفيليتي حصى. هذه
    منطقة حدودية: احمل هويتك ولا تقُد حتى المعبر نفسه، فإخراج سيارة مستأجرة من جورجيا غير مسموح.
    ساعتان تكفيان.

    ## الوديان الجانبية: أين يبدأ الدفع الرباعي

    | المكان | الطريق | السيارة | الارتفاع | من تبليسي | الموسم |
    |---|---|---|---|---|---|
    | [وادي تروسو](/attractions/truso-valley/) | ترابي | دفع رباعي 4x4 | 2,100 م | 145 كم، 3:00 | يونيو-سبتمبر |
    | [وادي سنو](/attractions/sno-valley/) | إسفلت | اقتصادية | 1,650 م | 152 كم، 3:00 | مايو-أكتوبر |
    | [جوتا وتشاوخي](/attractions/juta-chaukhi/) | 4x4 فقط | دفع رباعي 4x4 | 2,150 م | 165 كم، 3:45 | يونيو-سبتمبر |

    تنعطف إلى تروسو عند كوبي: خمسة عشر كيلومتراً من الحصى الصخري المتشقق مع عدة مخاضات نهرية، وبعد
    المطر الغزير ترتفع المخاضات وقد يصبح الدرب غير سالك بالمرة. عند المدخل نقطة شرطة حدود. وإلى جوتا
    تنعطف عند أتشخوتي قبيل ستيبانتسميندا: 5 كم إسفلت حتى قرية سنو، ثم 8 كم وعرة صخرية حادة مع عبور
    جداول. كلاهما مُعلّم بأنه غير متاح طوال السنة ويغلقه الثلج خارج الموسم. ست ساعات لكل منهما.

    ## أي فئة تفرضها البيانات

    - **الطريق الرئيسي حتى ممر جواري** - كل محطة مصنّفة اقتصادية.
    - **غوداوري وغيرغيتي وداريالي** - دفع رباعي خفيف: ارتفاع وشتاء وصعود خرساني ونهاية حصوية. إن كانت
      غيرغيتي في قائمتك فاحجز [الدفع الرباعي الخفيف](/car-rental/suv/).
    - **تروسو وجوتا** - دفع رباعي وعر. احجز [الدفع الرباعي 4x4](/car-rental/4x4/)، أو اترك السيارة في
      سنو واصعد بجيب محلي من ستيبانتسميندا.

    المنطق الكامل في [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).

    ## أفضل موسم من البيانات

    المسار نفسه في الموسم طوال السنة. غيرغيتي وداريالي تحملان مايو-أكتوبر، وجينفالي كذلك، وغوداوري
    ديسمبر-مارس، وتروسو وجوتا يونيو-سبتمبر. في الشتاء، بحسب البيانات، قد يُغلق الممر ساعات أو أياماً
    بعد الثلج، وطريق غيرغيتي شأن السلاسل والدفع الرباعي.

    ## يومان على الطريق

    من [خطة المسار](/routes/military-highway-kazbegi/).

    **اليوم 1 - من تبليسي إلى ستيبانتسميندا، 170 كم، 3:30 قيادة.** الانطلاق 09:00؛ بعد 25 كم
    متسخيتا ودير جواري (ساعة)؛ 11:00 إطلالة جينفالي (30 دقيقة)؛ 11:45 أنانوري (1:15)؛ الغداء في
    باسانوري أو كفيشيتي؛ 15:30 غوداوري ونصب الصداقة (ساعة) والتزوّد بالوقود؛ 18:00 ستيبانتسميندا.

    **اليوم 2 - من ستيبانتسميندا إلى تبليسي، 170 كم، 3:10 قيادة.** 08:30 غيرغيتي، 6 كم درب حاد أو
    1.5 ساعة مشياً (ساعتان)؛ 11:00 مضيق داريالي وغفيليتي (1:30)؛ الغداء في ستيبانتسميندا؛ 14:30
    العودة عبر الممر مع توقف عند ترافرتين كوبي؛ استراحة أخيرة في أنانوري أو جينفالي؛ 19:00 تبليسي.

    ولمن يريد تروسو وجوتا أيضاً، [قاعدة المشي في كازبيغي](/routes/kazbegi-hiking-base/) ذات الأيام
    الأربعة تخصص يوماً لكل منهما.

    ## تحذيرات أمينة

    - هذا تصنيف للسطح والموسم المعتادين لا تقرير حيّ عن حال الطريق اليوم.
    - الجبال أبرد من تبليسي بـ15-20 درجة؛ السترة لازمة حتى في يوليو.
    - تروسو وداريالي منطقتان حدوديتان؛ احمل جواز السفر أو الهوية.
    - قبل مغادرة الإسفلت اقرأ [شروط الإيجار](/terms/).
  faq:
  - q: "هل الطريق من تبليسي إلى كازبيغي معبّد؟"
    a: "نعم. كل محطة على الطريق الرئيسي مصنّفة إسفلت في بياناتنا، من جينفالي حتى ممر جواري على 2,380 متراً. الاستثناء كنيسة غيرغيتي بتصنيف إسفلت في معظمه، لأن الكيلومترات الست الأخيرة من ستيبانتسميندا صعود خرساني حاد وضيق."
  - q: "هل أحتاج دفعاً رباعياً إلى كازبيغي؟"
    a: "ليس إلى ستيبانتسميندا وغيرغيتي: كلتاهما مصنّفة دفعاً رباعياً خفيفاً، 160 كم و3:10 من تبليسي. تصنيف دفع رباعي وعر لا يظهر إلا في الواديين الجانبيين تروسو (ترابي) وجوتا (4x4 فقط)، وكلاهما من يونيو إلى سبتمبر."
  - q: "ما ارتفاع ممر جواري وهل يُفتح شتاءً؟"
    a: "2,380 متراً، وهو في بياناتنا مُعلّم مفتوحاً طوال السنة. البيانات نفسها تقول إن الممر يُغلق ساعات أو أياماً بعد الثلج الكثيف، وإن الإطارات الشتوية إلزامية في الموسم البارد، وإن صعود مليتا-غوداوري معرّض للانهيارات الثلجية."
  - q: "كم تستغرق القيادة إلى كازبيغي؟"
    a: "ستيبانتسميندا 155 كم ونحو ثلاث ساعات؛ غيرغيتي 160 كم و3:10. المسار ذو اليومين مجموعه 340 كم و6:40 قيادة مع توقفات في جينفالي وأنانوري وغوداوري وغيرغيتي وداريالي."
  - q: "هل أصل إلى جوتا بسيارة عادية؟"
    a: "لا. ينتهي الإسفلت عند قرية سنو بعد 5 كم؛ والكيلومترات الثمانية الأخيرة إلى جوتا مصنّفة 4x4 فقط بفئة دفع رباعي وعر. البديل في البيانات: اترك السيارة في سنو وخذ جيباً محلياً من ستيبانتسميندا."
