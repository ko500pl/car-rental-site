    سربالایی بتنی تا کلیسای تثلیث گرگتی (2,170 متر) شاسی‌بلند می‌خواهد. فقط درّه‌های فرعی، تروسو
    (خاکی) و جوتا (فقط 4x4)، به آفرود 4x4 نیاز دارند، از ژوئن تا سپتامبر. RentUp از 1 دسامبر تا 1
