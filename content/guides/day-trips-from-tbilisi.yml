    ## მცხეთა: სამი UNESCO-ს ძეგლი ორმოც წუთში

    1:30-ის ფარგლებში მოქცეული 42 ადგილიდან თექვსმეტი მონასტერია და ყველაზე ახლო ჯგუფი ძველი
    დედაქალაქია. [სვეტიცხოველი](/attractions/svetitskhoveli-cathedral/) 25 კმ და 0:30-ია,
    [სამთავრო](/attractions/samtavro-monastery/) — 26 კმ და 0:35, [ჯვარი](/attractions/jvari-monastery/)
    — 27 კმ და 0:35. სამივე UNESCO-ს სიაშია, სამივე ასფალტზე, სამივე ეკონომი და უფასო. დაუმატეთ
    [შიომღვიმე](/attractions/shiomghvime-monastery/) 0:50-ზე, ძირითადად მოასფალტებული გზით, და
    [მცხეთა-მთიანეთიდან](/regions/mtskheta-mtianeti/) გაუსვლელად სრული დღე გაქვთ. ამ ჯგუფში ერთადერთი
    გამონაკლისი [ზედაზენია](/attractions/zedazeni-monastery/): გრუნტი, კროსოვერით შეფასებული, მაისიდან
    ოქტომბრამდე. ჩვენი [მცხეთის მემკვიდრეობის დღე](/routes/mtskheta-heritage-day/) 85 კმ-ია, ეკონომი.

    ## ქვემო ქართლი: ციხეები, კანიონი და გრუნტის გამონაკლისები

    ქალაქის სამხრეთ-დასავლეთით გზაში დრო მოკლე რჩება, გზები კი მრავალფეროვანი ხდება.
    [კოჯრის ციხე](/attractions/kojori-fortress/) 0:40-ია ასფალტზე. [დიდგორი](/attractions/didgori-battle-memorial/)
    1650 მეტრზე მოასფალტებულია, მაგრამ მაისიდან ოქტომბრამდე ადგილია. [ბირთვისი](/attractions/birtvisi-fortress/)
    ის კლდის ციხეა, რომელსაც ყველა იღებს — 55 კმ, 1:20, გრუნტი, კროსოვერი, ადგილზე ოთხი საათი.
    [ალგეთის ეროვნული პარკი](/attractions/algeti-national-park/) და [სამშვილდე](/attractions/samshvilde/)
    1:25-ზე — 1:30-ის ფარგლებში ხუთი კროსოვერის შეფასებიდან კიდევ ორი; დანარჩენი ზედაზენი და
    [გარდაბნის ნაკრძალია](/attractions/gardabani-managed-reserve/) 1:30-ზე. უფრო შორს
    [დმანისი](/attractions/dmanisi/) 1:50-ზე და [დაშბაშის კანიონი](/attractions/dashbashi-canyon/)
    1:50-ზე ორივე ეკონომია. [ქვემო ქართლის მონასტრების დღე](/routes/kvemo-kartli-monasteries-day/)
    სწორედ ბირთვისისა და ფიტარეთის გამოა კროსოვერით შეფასებული.

    ## დასავლეთით: გორი და უფლისციხე მაგისტრალზე

    დასავლეთის მაგისტრალი ამ გვერდზე ყველაზე მარტივი გზაა. [გორი](/attractions/gori-fortress-stalin-museum/)
    86 კმ და 1:10-ია; [უფლისციხე](/attractions/uplistsikhe/), კლდეში ნაკვეთი ქალაქი, 100 კმ და 1:25 —
    ორივე ასფალტი, ეკონომი, მთელი წელი ღია. [ატენის სიონი](/attractions/ateni-sioni-church/) 1:30-ზე და
    [ატენის ხეობის მარნები](/attractions/ateni-valley-wine-cellars/) 1:25-ზე იმავე გზის გვერდითაა.
    [გორისა და უფლისციხის დღე](/routes/gori-uplistsikhe-day/) ყველაფერს 205 კმ-ში ფარავს.

    ## კახეთი: ღვინის მხარე ორ საათში

    [კახეთი](/regions/kakheti/) ის ადგილია, სადაც 1:30-დან 3:00-მდე ზოლი თავის ფასს ამართლებს.
    [თელავი](/attractions/telavi-batonis-tsikhe/) 1:45-ია, [სიღნაღი](/attractions/sighnaghi/) — 1:50,
    [ბოდბე](/attractions/bodbe-monastery/) — 1:55, [წინანდალი](/attractions/tsinandali-estate/) — 1:55,
    [ალავერდი](/attractions/alaverdi-cathedral/) — 2:05, [ნაფარეული](/attractions/napareuli/) — 2:10,
    [გრემი](/attractions/gremi/) — 2:20, [ნეკრესი](/attractions/nekresi-monastery/) — 2:25,
    [ყვარელი](/attractions/kvareli-kindzmarauli/) — 2:30, [ხარებას გვირაბი](/attractions/khareba-wine-tunnel/)
    — 2:35 და [ლაგოდეხი](/attractions/lagodekhi-protected-areas/) — 2:40. ყველა მათგანი ასფალტზეა და
    ეკონომითაა შეფასებული. სამ საათში კახეთის ოთხი ადგილია კროსოვერით შეფასებული და მათგან
    [დავით გარეჯა](/attractions/david-gareja/) — 75 კმ და 1:50 ძირითადად მოასფალტებული გზით — ის
    ადგილია, რომელიც ყველას უნდა; დანარჩენი სამი [კვეტერა](/attractions/kvetera-fortress/),
    [ხორნაბუჯი](/attractions/khornabuji-fortress/) და [ბაწარის ნაკრძალია](/attractions/batsara-reserve/).
    [კახეთის ღვინის დღე](/routes/kakheti-wine-day/) 285 კმ-ია, ეკონომი, მთელი წელი.

    ## ჩრდილოეთით: სამხედრო გზა, ზოლიდან ზოლში

    ყაზბეგის გზა ნათლად აჩვენებს, როგორ მოძრაობს ერთად გზაში დრო და კატეგორია.
    [ჟინვალი](/attractions/zhinvali-reservoir/) 1:15 და [ანანური](/attractions/ananuri-fortress/) 1:20
    ასფალტი და ეკონომია. [გუდაური](/attractions/gudauri/) 2:10-ზე და 2200 მეტრზე მოასფალტებულია, მაგრამ
    კროსოვერით შეფასებული, სეზონი დეკემბერი-მარტი. [ჯვრის უღელტეხილი](/attractions/jvari-pass-friendship-monument/)
    2:20-ზე ისევ ეკონომია. შემდეგ გვერდითი ხეობები: [ხადა](/attractions/khada-valley/) 2:15 და
    [აბუდელაურის ტბები](/attractions/abudelauri-lakes/) 2:50 გრუნტი და კროსოვერია;
    [თრუსო](/attractions/truso-valley/) 3:00-ზე გრუნტი და ჯიპი; [გერგეტი](/attractions/gergeti-trinity-church/)
    3:10-ზე კროსოვერი; [ჯუთა](/attractions/juta-chaukhi/) 3:45-ზე მხოლოდ 4x4, ივნისიდან სექტემბრამდე.
    სწორედ ამიტომაა [ყაზბეგის მთის დღე](/routes/kazbegi-mountain-day/) ორ დღედ დაწერილი.

    ## სამიდან ხუთ საათამდე: შესაძლებელია, მაგრამ ერთდღიანი აღარ არის

    74 ადგილი ერთი მიმართულებით 3:00-სა და 5:00-ს შორისაა. [რაბათი](/attractions/rabati-castle/) 3:20,
    [გელათი](/attractions/gelati-monastery/) 3:30, [პრომეთეს მღვიმე](/attractions/prometheus-cave/) 3:45
    და [ვარძია](/attractions/vardzia/) 4:20 ყველა ასფალტი და ეკონომია — მაგრამ ეს ერთი გაჩერებისთვის
    ექვსნახევრიდან ცხრა საათამდე მანქანაშია. [ვაშლოვანი](/attractions/vashlovani-national-park/)
    4:30-ზე და [შატილი](/attractions/shatili/) 4:30-ზე მხოლოდ 4x4-ისაა. ეს ზოლი ღამისთევის დასაწყისად
    მიიღეთ: [სამხედრო გზის მარშრუტი](/routes/military-highway-kazbegi/) და
    [3-დღიანი გეგმა](/itineraries/georgia-3-days/) სწორედ ამაზეა აწყობილი.

    ## რომელი კატეგორია და საიდან დაიწყოთ

    - **სამ საათში მოქცეული 100 ადგილიდან 78** ეკონომითაა შეფასებული. აიღეთ
      [ეკონომ-კლასის მანქანა თბილისში](/car-rental/tbilisi/) და ღვინის მხარე, მცხეთა, გორი და ბორჯომი
      უკვე დაფარულია.
    - **20-ს [კროსოვერი](/car-rental/suv/) სჭირდება**: ბირთვისი, ალგეთი, სამშვილდე, ზედაზენი, დავით
      გარეჯა, გუდაური, ხადა, აბუდელაური და გერგეტი — ის, რაც ადამიანებს ნამდვილად უნდათ.
    - **2-ს [ჯიპი 4x4](/car-rental/4x4/) სჭირდება**: თრუსო და კლდეკარი. სამსაათიანი ზღვრის მიღმა მათ
      ჯუთა და შატილი ემატება.

    სეზონს აქ ნაკლები მნიშვნელობა აქვს, ვიდრე მთაში: ასიდან 67-ს ყველა სეზონის შეფასება აქვს, 28
    მაისიდან ოქტომბრამდეა, 4 — ივნისიდან სექტემბრამდე და ერთი — გუდაური — ზამთრის ადგილია. ასიდან 89
    მთელი წელი ღიაა. დღევანდელ პასუხს კითხვაზე „სად მივალ და დავბრუნდები" [ერთდღიანი მოგზაურობის
    დამგეგმავი](/day-trip/) იძლევა — იგივე მონაცემებს საათების, გზისა და მანქანის მიხედვით ფილტრავს;
    კატეგორიის უფრო ფართო კითხვაზე კი წაიკითხეთ [გჭირდებათ თუ არა ჯიპი საქართველოში?](/guides/do-i-need-a-4x4-in-georgia/)
    ავტომობილის გაქირავება თბილისში სწორედ ამ ასი ადგილიდან იწყება.
  faq:
  - q: "თბილისიდან რამდენი ერთდღიანი მარშრუტი შემიძლია ჩვეულებრივი მანქანით?"
    a: "თბილისიდან სამ საათში მოქცეული 100 ადგილიდან 78 ჩვენს ბაზაში ეკონომითაა შეფასებული და 100-დან 89 ასფალტზე ან თითქმის მოასფალტებულ გზაზეა. მცხეთა, გორი, უფლისციხე, სიღნაღი, თელავი, ბორჯომი და დაშბაშის კანიონი ყველა ეკონომის ადგილია."
  - q: "რომელია თბილისთან ყველაზე ახლო UNESCO-ს ძეგლი?"
    a: "სვეტიცხოვლის ტაძარი მცხეთაში — გზით 25 კმ და 0:30. სამთავრო (0:35) და ჯვარი (0:35) იმავე ქალაქის კიდევ ორი UNESCO-ს ძეგლია. სამივე ასფალტზეა, ეკონომი და შესვლა უფასოა."
  - q: "ყაზბეგი თბილისიდან ერთდღიანი მარშრუტია?"
    a: "გერგეტის სამება 160 კმ და 3:10-ია ერთი მიმართულებით, ძირითადად ასფალტი, კროსოვერით შეფასებული, სეზონი მაისიდან ოქტომბრამდე. ეს ერთი გაჩერებისთვის ექვს საათზე მეტი მართვაა — ამიტომაა ჩვენი ყაზბეგის მარშრუტი ორ დღედ დაწერილი."
  - q: "თბილისიდან რომელ ერთდღიან მარშრუტებს სჭირდება კროსოვერი ან ჯიპი?"
    a: "სამ საათში 20 ადგილი კროსოვერითაა შეფასებული — მათ შორის ბირთვისი, ალგეთი, დავით გარეჯა, გუდაური, ხადა და გერგეტი — და ორი ჯიპით: თრუსოს ხეობა და კლდეკარის ციხე. დანარჩენი ყველაფერი ეკონომია."
  - q: "რამდენად შორსაა კახეთი თბილისიდან?"
    a: "თელავი 95 კმ და 1:45-ია, სიღნაღი — 110 კმ და 1:50, წინანდალი — 100 კმ და 1:55, ყვარელი — 145 კმ და 2:30. ყველა ასფალტზეა, ეკონომითაა შეფასებული და მთელი წელი ღიაა."
  - q: "ეს დროები ნავიგატორის მარშრუტია?"
    a: "არა. ეს თითოეული ღირსშესანიშნაობის ჩანაწერში შენახული გაზომილი გზის მანძილი და დროა — იგივე რიცხვები, რაც ყველა ღირსშესანიშნაობის გვერდზე ჩანს. ერთი მიმართულებით, პარკინგამდე, და დღევანდელ საცობსა და გზის მდგომარეობას არ ასახავს."

ru:
  name: "Куда поехать из Тбилиси на один день: 100 мест в пределах трёх часов"
  answer: >-
    Из Тбилиси 100 из 239 мест, которые RentUp наносит на карту за пределами города, лежат в трёх
    часах езды в одну сторону, и 78 из них рассчитаны на машину эконом-класса; 42 — в пределах 1:30,
    174 — в пределах 5:00. Три объекта ЮНЕСКО в Мцхете — это 25-27 км и 0:30-0:35; Гори — 1:10,
    Уплисцихе — 1:25, Сигнахи — 1:50, Боржоми — 2:20, церковь Гергети — 3:10 (категория кроссовер).
    Только двум местам в пределах трёх часов — Трусо и Клдекари — нужен внедорожник 4x4. 89 из 100
    стоят на асфальте или в основном асфальте. Время измерено, а не оценено.
  short: "Мы измерили расстояние и время в пути от Тбилиси до всех 239 мест за пределами города. 42 из них ближе 1:30, 100 - ближе 3:00, и 78 из этой сотни не требуют ничего, кроме машины эконом-класса."
  meta_title: "Куда поехать из Тбилиси на один день: 100 мест | RentUp"
  meta_description: "42 места в пределах 1:30 от Тбилиси, 100 в пределах 3:00, 174 в пределах 5:00 - измерено, а не угадано. Время в пути, покрытие, часы на месте и категория."
  body: |
    ## Как далеко на самом деле уезжаешь за день из Тбилиси

    У каждой достопримечательности в нашей базе есть два поля, которые мы измеряем сами: расстояние
    по дороге от Тбилиси в километрах и время в пути в одну сторону. 1 сентября 2026 года мы
    пересчитали все 267 записей. 28 из них находятся внутри Тбилиси, значит остаётся **239 мест за
    пределами города**, которые можно отсортировать по времени в пути.

    | В одну сторону | Мест | Эконом | Кроссовер | Внедорожник 4x4 | Асфальт или почти асфальт |
    |---|---|---|---|---|---|
    | до 1:30 | 42 | 37 | 5 | 0 | 39 из 42 |
    | от 1:30 до 3:00 | 58 | 41 | 15 | 2 | 50 из 58 |
    | от 3:00 до 5:00 | 74 | 49 | 20 | 5 | 66 из 74 |
    | **в пределах 3:00** | **100** | **78** | **20** | **2** | **89 из 100** |
    | в пределах 5:00 | 174 | 127 | 40 | 7 | 155 из 174 |

    Прочитайте жирную строку дважды. **В трёх часах от Тбилиси лежит сотня мест, и 78 из них
    отмечены для обычной [машины эконом-класса](/car-rental/economy/).** Только два места из ста -
    ущелье Трусо и крепость Клдекари - требуют настоящего внедорожника. Всё, что ниже, - это та самая
    сотня, сгруппированная по направлениям и по тому, что это за места.

    Шестнадцать мест находятся в пределах часа, 63 - в пределах двух. Из всего, что ближе 1:30, 41
    место из 42 открыто круглый год, а у 31 из 42 указан всесезонный доступ; остальные 11 - места
    с мая по октябрь.

    **Замечание о цифрах.** Для Тбилиси это реальные, измеренные поля каждой записи - не построенный
    навигатором маршрут и не оценка. Те же цифры показаны на каждой странице достопримечательности.
    В путеводителях по [Кутаиси](/guides/day-trips-from-kutaisi/) и [Батуми](/guides/day-trips-from-batumi/)
    мы используем оценку, выведенную из этих измерений; здесь она не нужна. Время указано в одну
    сторону, до парковки. Однодневная поездка - это удвоенная цифра плюс часы на месте из таблицы.

    ## Двадцать поездок из Тбилиси на день, измеренных

    Отобраны из сотни по рейтингу и разнообразию. Расстояние - дорожное, из записи.

    | Место | В пути | Км | На месте | Дорога | Машина | Сезон |
    |---|---|---|---|---|---|---|
    | [Собор Светицховели](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | 2 ч | асфальт | эконом | круглый год |
    | [Монастырь Джвари](/attractions/jvari-monastery/) | 0:35 | 27 | 1 ч | асфальт | эконом | круглый год |
    | [Шато Мухрани](/attractions/chateau-mukhrani/) | 0:50 | 42 | 2 ч | асфальт | эконом | круглый год |
    | [Гори: крепость и музей Сталина](/attractions/gori-fortress-stalin-museum/) | 1:10 | 86 | 3 ч | асфальт | эконом | круглый год |
    | [Биртвиси](/attractions/birtvisi-fortress/) | 1:20 | 55 | 4 ч | грунт | кроссовер | май–октябрь |
    | [Национальный парк Алгети](/attractions/algeti-national-park/) | 1:20 | 60 | 4 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Мемориал Дидгорской битвы](/attractions/didgori-battle-memorial/) | 1:20 | 57 | 1 ч | асфальт | эконом | май–октябрь |
    | [Крепость Ананури](/attractions/ananuri-fortress/) | 1:20 | 70 | 1 ч | асфальт | эконом | круглый год |
    | [Уплисцихе](/attractions/uplistsikhe/) | 1:25 | 100 | 2 ч | асфальт | эконом | круглый год |
    | [Каньон Дашбаши](/attractions/dashbashi-canyon/) | 1:50 | 100 | 3 ч | асфальт | эконом | май–октябрь |
    | [Давид Гареджи](/attractions/david-gareja/) | 1:50 | 75 | 3 ч | в основном асфальт | кроссовер | круглый год |
    | [Сигнахи](/attractions/sighnaghi/) | 1:50 | 110 | 3 ч | асфальт | эконом | круглый год |
    | [Монастырь Бодбе](/attractions/bodbe-monastery/) | 1:55 | 112 | 2 ч | асфальт | эконом | круглый год |
    | [Гудаури](/attractions/gudauri/) | 2:10 | 120 | 6 ч | асфальт | кроссовер | декабрь–март |
    | [Центральный парк Боржоми](/attractions/borjomi-central-park/) | 2:20 | 160 | 3 ч | асфальт | эконом | круглый год |
    | [Кварели и зона Киндзмараули](/attractions/kvareli-kindzmarauli/) | 2:30 | 145 | 4 ч | асфальт | эконом | круглый год |
    | [Ущелье Трусо](/attractions/truso-valley/) | 3:00 | 145 | 6 ч | грунт | внедорожник 4x4 | июнь–сентябрь |
    | [Церковь Гергети](/attractions/gergeti-trinity-church/) | 3:10 | 160 | 3 ч | в основном асфальт | кроссовер | май–октябрь |
    | [Крепость Рабат](/attractions/rabati-castle/) | 3:20 | 205 | 2 ч | асфальт | эконом | круглый год |
    | [Вардзиа](/attractions/vardzia/) | 4:20 | 265 | 3 ч | асфальт | эконом | круглый год |

    ## Мцхета: три объекта ЮНЕСКО меньше чем за сорок минут

    Из 42 мест в пределах 1:30 шестнадцать - монастыри, и ближайший их кластер - древняя столица.
    [Светицховели](/attractions/svetitskhoveli-cathedral/) - это 25 км и 0:30,
    [Самтавро](/attractions/samtavro-monastery/) - 26 км и 0:35, [Джвари](/attractions/jvari-monastery/)
    - 27 км и 0:35. Все три в списке ЮНЕСКО, все на асфальте, все эконом, вход везде бесплатный.
    Добавьте [Шиомгвиме](/attractions/shiomghvime-monastery/) в 0:50 по в основном асфальтовой
    дороге - и у вас полный день, не выезжая из [Мцхета-Мтианети](/regions/mtskheta-mtianeti/).
    Единственное исключение в группе - [Зедазени](/attractions/zedazeni-monastery/): грунт, категория
    кроссовер, с мая по октябрь. Наш [день наследия Мцхеты](/routes/mtskheta-heritage-day/) - это
    85 км, категория эконом.

    ## Квемо Картли: крепости, каньон и исключения на грунте

    К юго-западу от города время в пути остаётся коротким, а дороги начинают различаться.
    [Коджорская крепость](/attractions/kojori-fortress/) - 0:40 по асфальту.
    [Дидгори](/attractions/didgori-battle-memorial/) на 1650 м - асфальт, но место с мая по октябрь.
    [Биртвиси](/attractions/birtvisi-fortress/) - та самая скальная крепость с фотографий: 55 км,
    1:20, грунт, кроссовер, четыре часа на месте. [Национальный парк Алгети](/attractions/algeti-national-park/)
    и [Самшвилде](/attractions/samshvilde/) в 1:25 - ещё две из пяти категорий «кроссовер» в пределах 1:30; остальные - Зедазени
    и [заповедник Гардабани](/attractions/gardabani-managed-reserve/) в 1:30.
    Дальше [Дманиси](/attractions/dmanisi/) в 1:50 и [каньон Дашбаши](/attractions/dashbashi-canyon/)
    в 1:50 - оба эконом. [День монастырей Квемо Картли](/routes/kvemo-kartli-monasteries-day/)
    отмечен кроссовером именно из-за Биртвиси и Питарети.

    ## На запад: Гори и Уплисцихе вдоль трассы

    Западная трасса - самая простая дорога на этой странице. [Гори](/attractions/gori-fortress-stalin-museum/)
    - 86 км и 1:10; [Уплисцихе](/attractions/uplistsikhe/), пещерный город, - 100 км и 1:25. Оба
    на асфальте, эконом, открыты круглый год. [Атени Сиони](/attractions/ateni-sioni-church/) в 1:30
    и [погреба Атенского ущелья](/attractions/ateni-valley-wine-cellars/) в 1:25 стоят прямо у той же
    дороги. [День в Гори и Уплисцихе](/routes/gori-uplistsikhe-day/) собирает всё это в 205 км.

    ## Кахетия: винный край в двух часах

    [Кахетия](/regions/kakheti/) - там, где полоса от 1:30 до 3:00 окупает себя.
    [Телави](/attractions/telavi-batonis-tsikhe/) - 1:45, [Сигнахи](/attractions/sighnaghi/) - 1:50,
    [Бодбе](/attractions/bodbe-monastery/) - 1:55, [Цинандали](/attractions/tsinandali-estate/) - 1:55,
    [Алаверди](/attractions/alaverdi-cathedral/) - 2:05, [Напареули](/attractions/napareuli/) - 2:10,
    [Греми](/attractions/gremi/) - 2:20, [Некреси](/attractions/nekresi-monastery/) - 2:25,
    [Кварели](/attractions/kvareli-kindzmarauli/) - 2:30, [тоннель Хареба](/attractions/khareba-wine-tunnel/)
    - 2:35, [Лагодехи](/attractions/lagodekhi-protected-areas/) - 2:40. Каждое из них - асфальт и
    эконом. Кроссовером в Кахетии в пределах трёх часов отмечены четыре места, и
    [Давид Гареджи](/attractions/david-gareja/), 75 км и 1:50 по в основном асфальтовой дороге, - то,
    куда хотят почти все; остальные три - [Кветера](/attractions/kvetera-fortress/),
    [Хорнабуджи](/attractions/khornabuji-fortress/) и [заповедник Бацара](/attractions/batsara-reserve/).
    [Винный день в Кахетии](/routes/kakheti-wine-day/) - 285 км, эконом, круглый год.

    ## На север: Военно-Грузинская дорога, полоса за полосой

    Дорога на Казбеги наглядно показывает, как время в пути и категория машины растут вместе.
    [Жинвали](/attractions/zhinvali-reservoir/) в 1:15 и [Ананури](/attractions/ananuri-fortress/)
    в 1:20 - асфальт и эконом. [Гудаури](/attractions/gudauri/) в 2:10 и на 2200 м - асфальт, но
    категория кроссовер, сезон с декабря по март. [Крестовый перевал](/attractions/jvari-pass-friendship-monument/)
    в 2:20 - снова эконом. Дальше боковые ущелья: [Хада](/attractions/khada-valley/) в 2:15 и
    [Абуделаурские озёра](/attractions/abudelauri-lakes/) в 2:50 - грунт и кроссовер;
    [Трусо](/attractions/truso-valley/) в 3:00 - грунт и внедорожник; [Гергети](/attractions/gergeti-trinity-church/)
    в 3:10 - кроссовер; [Джута](/attractions/juta-chaukhi/) в 3:45 - только 4x4, с июня по сентябрь.
    Именно поэтому [горный день в Казбеги](/routes/kazbegi-mountain-day/) расписан на два дня.

    ## От трёх до пяти часов: возможно, но это уже не день

    74 места находятся между 3:00 и 5:00 в одну сторону. [Рабат](/attractions/rabati-castle/) - 3:20,
    [Гелати](/attractions/gelati-monastery/) - 3:30, [пещера Прометея](/attractions/prometheus-cave/)
    - 3:45, [Вардзиа](/attractions/vardzia/) - 4:20: всё асфальт и эконом, но это от шести с половиной
    до девяти часов за рулём ради одной остановки. [Вашловани](/attractions/vashlovani-national-park/)
    в 4:30 и [Шатили](/attractions/shatili/) в 4:30 - только 4x4. Считайте эту полосу началом
    поездки с ночёвкой: [маршрут по Военно-Грузинской дороге](/routes/military-highway-kazbegi/) и
    [трёхдневный план](/itineraries/georgia-3-days/) построены вокруг неё.

    ## Какую машину брать и с чего начать

    - **78 из 100 мест в пределах трёх часов** отмечены эконом-классом. Возьмите
      [машину эконом-класса в Тбилиси](/car-rental/tbilisi/) - и винный край, Мцхета, Гори и Боржоми
      уже закрыты.
    - **20 требуют [кроссовер](/car-rental/suv/)**: Биртвиси, Алгети, Самшвилде, Зедазени, Давид
      Гареджи, Гудаури, Хада, Абуделаури и Гергети - те, куда люди на самом деле хотят.
    - **2 требуют [внедорожник 4x4](/car-rental/4x4/)**: Трусо и Клдекари. За трёхчасовой чертой к
      ним добавляются Джута и Шатили.

    Сезон здесь значит меньше, чем в горах: у 67 из ста всесезонный доступ, 28 - с мая по октябрь,
    4 - с июня по сентябрь, и одно место - Гудаури - зимнее. 89 из ста открыты круглый год.
    Ответ на сегодняшний вопрос «куда успею съездить и вернуться» даёт
    [планировщик поездки на день](/day-trip/) - он фильтрует те же данные по часам, дороге и машине;
    на более широкий вопрос о категории отвечает страница
    [Нужен ли внедорожник в Грузии?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "Сколько однодневных поездок из Тбилиси можно сделать на обычной машине?"
    a: "78 из 100 мест в пределах трёх часов от Тбилиси отмечены в нашей базе эконом-классом, а 89 из 100 стоят на асфальте или почти асфальте. Мцхета, Гори, Уплисцихе, Сигнахи, Телави, Боржоми и каньон Дашбаши - всё это места категории эконом."
  - q: "Какой объект ЮНЕСКО ближе всего к Тбилиси?"
    a: "Собор Светицховели в Мцхете: 25 км и 0:30 по дороге. Самтавро (0:35) и Джвари (0:35) - ещё два объекта ЮНЕСКО в том же городе. Все три на асфальте, эконом, вход бесплатный."
  - q: "Казбеги - это однодневная поездка из Тбилиси?"
    a: "Церковь Гергети - 160 км и 3:10 в одну сторону, в основном асфальт, категория кроссовер, сезон с мая по октябрь. Это больше шести часов за рулём ради одной остановки, поэтому наш маршрут в Казбеги расписан на два дня."
  - q: "Какие поездки из Тбилиси требуют кроссовера или внедорожника?"
    a: "В пределах трёх часов 20 мест отмечены кроссовером - среди них Биртвиси, Алгети, Давид Гареджи, Гудаури, Хада и Гергети - и два внедорожником: ущелье Трусо и крепость Клдекари. Всё остальное - эконом."
  - q: "Как далеко от Тбилиси винная Кахетия?"
    a: "Телави - 95 км и 1:45, Сигнахи - 110 км и 1:50, Цинандали - 100 км и 1:55, Кварели - 145 км и 2:30. Всё на асфальте, категория эконом, открыто круглый год."
  - q: "Это время из навигатора?"
    a: "Нет. Это измеренное дорожное расстояние и время в пути, сохранённые в записи каждой достопримечательности, - те же цифры, что показаны на её странице. Они указаны в одну сторону, до парковки, и не отражают сегодняшние пробки или состояние дороги."

fa:
  name: "سفر یک‌روزه از تفلیس با خودرو: 100 مکان در سه ساعت"
  answer: >-
    از تفلیس، 100 مکان از 239 مکانی که RentUp بیرون شهر ثبت کرده در سه ساعت رانندگی یک‌طرفه قرار
    دارند و 78 مورد از آن‌ها برای خودروی اقتصادی رتبه‌بندی شده‌اند؛ 42 مورد در 1:30 و 174 مورد در
    5:00. سه اثر یونسکوی متسختا 25-27 کیلومتر و 0:30-0:35 فاصله دارند؛ گوری 1:10، اوپلیستسیخه 1:25،
    سیغناغی 1:50، بورجومی 2:20 و کلیسای تثلیث گرگتی 3:10 (ردهٔ شاسی‌بلند). فقط دو مکان در سه ساعت،
    تروسو و کلدکاری، آفرود 4x4 می‌خواهند. 89 مورد از 100 روی جادّهٔ آسفالت یا عمدتاً آسفالت‌اند.
    زمان‌ها اندازه‌گیری‌شده‌اند، نه تخمینی.
  short: "برای هر 239 مکان بیرون از شهر، فاصله و زمان رانندگی از تفلیس را اندازه گرفته‌ایم. 42 مکان زیر 1:30 است، 100 مکان زیر 3:00، و 78 مورد از این صد به چیزی بیش از خودروی اقتصادی نیاز ندارند."
  meta_title: "سفر یک‌روزه از تفلیس با خودرو: 100 مکان | RentUp"
  meta_description: "42 مکان در 1:30 از تفلیس، 100 مکان در 3:00 و 174 مکان در 5:00؛ اندازه‌گیری‌شده، نه حدسی. زمان رانندگی، سطح جاده، ساعت‌های لازم در محل و ردهٔ خودروی هر مکان."
  body: |
    ## یک روز از تفلیس تا کجا می‌رسد

    هر مکان در پایگاه دادهٔ ما دو فیلد دارد که خودمان اندازه می‌گیریم: فاصلهٔ جاده‌ای از تفلیس به
    کیلومتر و زمان رانندگی یک‌طرفه. در 1 سپتامبر 2026 هر 267 رکورد را شمردیم. 28 مورد داخل خود تفلیس
    است، پس **239 مکان بیرون از شهر** می‌ماند که بر اساس زمان رسیدن مرتب کرده‌ایم.

    | زمان یک‌طرفه | مکان | اقتصادی | شاسی‌بلند | آفرود 4x4 | آسفالت یا تقریباً آسفالت |
    |---|---|---|---|---|---|
    | تا 1:30 | 42 | 37 | 5 | 0 | 39 از 42 |
    | 1:30 تا 3:00 | 58 | 41 | 15 | 2 | 50 از 58 |
    | 3:00 تا 5:00 | 74 | 49 | 20 | 5 | 66 از 74 |
    | **در 3:00** | **100** | **78** | **20** | **2** | **89 از 100** |
    | در 5:00 | 174 | 127 | 40 | 7 | 155 از 174 |

    **صد مکان در سه ساعتی تفلیس قرار دارد و 78 مورد از آن‌ها برای یک [خودروی اقتصادی](/car-rental/economy/)
    معمولی ثبت شده‌اند.** تنها دو مورد از این صد، یعنی درّهٔ تروسو و قلعهٔ کلدکاری، خودروی آفرود
    واقعی می‌خواهند. از همهٔ مکان‌های زیر 1:30، 41 مورد از 42 در تمام سال باز است.

    **دربارهٔ ارقام.** برای تفلیس این‌ها فیلدهای واقعی و اندازه‌گیری‌شدهٔ هر رکورد هستند، نه مسیریابی
    و نه تخمین؛ همان ارقامی که در صفحهٔ هر مکان دیده می‌شود. راهنمای [کوتایسی](/guides/day-trips-from-kutaisi/)
    و [باتومی](/guides/day-trips-from-batumi/) از تخمینی برگرفته از همین اندازه‌گیری‌ها استفاده
    می‌کنند. زمان یک‌طرفه و تا پارکینگ است؛ سفر یک‌روزه دو برابر آن به‌علاوهٔ ساعت‌های در محل است.

    ## بیست سفر یک‌روزه از تفلیس

    | مکان | رانندگی | کیلومتر | در محل | جاده | خودرو | فصل |
    |---|---|---|---|---|---|---|
    | [کلیسای جامع سوتیتسخوولی](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [صومعهٔ جواری](/attractions/jvari-monastery/) | 0:35 | 27 | 1 ساعت | آسفالت | اقتصادی | تمام سال |
    | [شاتو موخرانی](/attractions/chateau-mukhrani/) | 0:50 | 42 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [گوری: دژ و موزهٔ استالین](/attractions/gori-fortress-stalin-museum/) | 1:10 | 86 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [بیرتویسی](/attractions/birtvisi-fortress/) | 1:20 | 55 | 4 ساعت | خاکی | شاسی‌بلند | مه تا اکتبر |
    | [پارک ملی آلگتی](/attractions/algeti-national-park/) | 1:20 | 60 | 4 ساعت | عمدتاً آسفالت | شاسی‌بلند | مه تا اکتبر |
    | [یادبود نبرد دیدگوری](/attractions/didgori-battle-memorial/) | 1:20 | 57 | 1 ساعت | آسفالت | اقتصادی | مه تا اکتبر |
    | [قلعهٔ آنانوری](/attractions/ananuri-fortress/) | 1:20 | 70 | 1 ساعت | آسفالت | اقتصادی | تمام سال |
    | [اوپلیستسیخه](/attractions/uplistsikhe/) | 1:25 | 100 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [درهٔ داشباشی](/attractions/dashbashi-canyon/) | 1:50 | 100 | 3 ساعت | آسفالت | اقتصادی | مه تا اکتبر |
    | [داوید گارجا](/attractions/david-gareja/) | 1:50 | 75 | 3 ساعت | عمدتاً آسفالت | شاسی‌بلند | تمام سال |
    | [سیغناغی](/attractions/sighnaghi/) | 1:50 | 110 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [صومعهٔ بودبه](/attractions/bodbe-monastery/) | 1:55 | 112 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [گودائوری](/attractions/gudauri/) | 2:10 | 120 | 6 ساعت | آسفالت | شاسی‌بلند | دسامبر تا مارس |
    | [پارک مرکزی بورجومی](/attractions/borjomi-central-park/) | 2:20 | 160 | 3 ساعت | آسفالت | اقتصادی | تمام سال |
    | [کوارلی و منطقهٔ کیندزماراولی](/attractions/kvareli-kindzmarauli/) | 2:30 | 145 | 4 ساعت | آسفالت | اقتصادی | تمام سال |
    | [درهٔ تروسو](/attractions/truso-valley/) | 3:00 | 145 | 6 ساعت | خاکی | آفرود 4x4 | ژوئن تا سپتامبر |
    | [کلیسای تثلیث گرگتی](/attractions/gergeti-trinity-church/) | 3:10 | 160 | 3 ساعت | عمدتاً آسفالت | شاسی‌بلند | مه تا اکتبر |
    | [قلعهٔ راباتی](/attractions/rabati-castle/) | 3:20 | 205 | 2 ساعت | آسفالت | اقتصادی | تمام سال |
    | [واردزیا](/attractions/vardzia/) | 4:20 | 265 | 3 ساعت | آسفالت | اقتصادی | تمام سال |

    ## متسختا: سه اثر یونسکو در کمتر از چهل دقیقه

    از 42 مکان زیر 1:30، شانزده مورد صومعه است و نزدیک‌ترین خوشه پایتخت قدیم است.
    [سوتیتسخوولی](/attractions/svetitskhoveli-cathedral/) در 25 کیلومتر و 0:30،
    [سامتاورو](/attractions/samtavro-monastery/) در 26 کیلومتر و 0:35 و [جواری](/attractions/jvari-monastery/)
    در 27 کیلومتر و 0:35؛ هر سه در فهرست یونسکو، آسفالت، اقتصادی و رایگان. تنها استثنای این گروه
    [زدازنی](/attractions/zedazeni-monastery/) است: خاکی، ردهٔ شاسی‌بلند، مه تا اکتبر.
    [روز میراث متسختا](/routes/mtskheta-heritage-day/) ما 85 کیلومتر و ردهٔ اقتصادی است.

    ## کومو کارتلی: دژها، یک درّه و استثناهای خاکی

    [دژ کوجوری](/attractions/kojori-fortress/) در 0:40 روی آسفالت است. [بیرتویسی](/attractions/birtvisi-fortress/)
    همان دژ صخره‌ای عکس‌هاست: 55 کیلومتر، 1:20، خاکی، شاسی‌بلند، چهار ساعت در محل.
    [پارک ملی آلگتی](/attractions/algeti-national-park/) و [سامشویلده](/attractions/samshvilde/) در 1:25
    دو مورد دیگر از پنج ردهٔ شاسی‌بلند زیر 1:30 هستند؛ بقیه زدازنی و [ذخیره‌گاه گاردابانی](/attractions/gardabani-managed-reserve/) در 1:30 است. دورتر، [دمانیسی](/attractions/dmanisi/) در 1:50 و
    [درهٔ داشباشی](/attractions/dashbashi-canyon/) در 1:50 هر دو اقتصادی‌اند.

    ## غرب: گوری و اوپلیستسیخه در بزرگراه

    [گوری](/attractions/gori-fortress-stalin-museum/) 86 کیلومتر و 1:10 است؛ [اوپلیستسیخه](/attractions/uplistsikhe/) 100 کیلومتر و 1:25؛ هر دو آسفالت، اقتصادی و در تمام سال باز.
    [روز گوری و اوپلیستسیخه](/routes/gori-uplistsikhe-day/) هر دو را در 205 کیلومتر پوشش می‌دهد.

    ## کاختی: سرزمین شراب در دو ساعت

    [تلاوی](/attractions/telavi-batonis-tsikhe/) 1:45، [سیغناغی](/attractions/sighnaghi/) 1:50،
    [بودبه](/attractions/bodbe-monastery/) 1:55، [تسیناندالی](/attractions/tsinandali-estate/) 1:55،
    [کوارلی](/attractions/kvareli-kindzmarauli/) 2:30 و [لاگودخی](/attractions/lagodekhi-protected-areas/)
    2:40. همهٔ این‌ها آسفالت و اقتصادی‌اند. در [کاختی](/regions/kakheti/) چهار مکان زیر سه ساعت ردهٔ شاسی‌بلند
    دارد و [داوید گارجا](/attractions/david-gareja/)، 75 کیلومتر و 1:50، شناخته‌شده‌ترین آن‌هاست؛ سه مورد
    دیگر [کوترا](/attractions/kvetera-fortress/)، [خورنابوجی](/attractions/khornabuji-fortress/) و
    [ذخیره‌گاه باتسارا](/attractions/batsara-reserve/) است. [روز شراب کاختی](/routes/kakheti-wine-day/)
    285 کیلومتر و اقتصادی است.

    ## شمال: جادّهٔ نظامی گرجستان

    [آنانوری](/attractions/ananuri-fortress/) در 1:20 آسفالت و اقتصادی است. [گودائوری](/attractions/gudauri/)
    در 2:10 و 2,200 متر آسفالت است اما ردهٔ شاسی‌بلند دارد و فصلش دسامبر تا مارس است. سپس درّه‌های
    فرعی: [خادا](/attractions/khada-valley/) 2:15 و [دریاچه‌های آبودلائوری](/attractions/abudelauri-lakes/)
    2:50 خاکی و شاسی‌بلند؛ [تروسو](/attractions/truso-valley/) در 3:00 خاکی و آفرود؛
    [گرگتی](/attractions/gergeti-trinity-church/) در 3:10 شاسی‌بلند؛ [جوتا](/attractions/juta-chaukhi/)
    در 3:45 فقط 4x4. به همین دلیل [روز کوهستانی کازبگی](/routes/kazbegi-mountain-day/) دو روزه نوشته شده است.

    ## سه تا پنج ساعت: ممکن، اما سفر یک‌روزه نیست

    74 مکان بین 3:00 و 5:00 یک‌طرفه است. [راباتی](/attractions/rabati-castle/) 3:20، [گلاتی](/attractions/gelati-monastery/)
    3:30، [غار پرومتئوس](/attractions/prometheus-cave/) 3:45 و [واردزیا](/attractions/vardzia/) 4:20 همه
    آسفالت و اقتصادی‌اند، اما این یعنی شش و نیم تا نه ساعت در خودرو برای یک توقف. این نوار را
    آغاز یک سفر با اقامت شبانه بدانید؛ [مسیر جادّهٔ نظامی](/routes/military-highway-kazbegi/) برای همین ساخته شده است.

    ## کدام خودرو

    - **78 مورد از 100 مکان زیر سه ساعت** اقتصادی است: یک [خودروی اقتصادی در تفلیس](/car-rental/tbilisi/) کافی است.
    - **20 مورد [شاسی‌بلند](/car-rental/suv/) می‌خواهد**: بیرتویسی، آلگتی، داوید گارجا، گودائوری، خادا و گرگتی.
    - **2 مورد [آفرود 4x4](/car-rental/4x4/) می‌خواهد**: تروسو و کلدکاری.

    از این صد مکان 89 مورد در تمام سال باز است. [یابندهٔ سفر یک‌روزه](/day-trip/) همین داده‌ها را بر
    اساس ساعت، جاده و خودرو فیلتر می‌کند؛ برای پرسش گسترده‌تر ردهٔ خودرو،
    [آیا در گرجستان به 4x4 نیاز دارید؟](/guides/do-i-need-a-4x4-in-georgia/) را بخوانید.
  faq:
  - q: "چند سفر یک‌روزه از تفلیس با خودروی معمولی ممکن است؟"
    a: "78 مورد از 100 مکان زیر سه ساعت از تفلیس در داده‌های ما اقتصادی ثبت شده و 89 مورد از 100 روی جادّهٔ آسفالت یا تقریباً آسفالت است. متسختا، گوری، اوپلیستسیخه، سیغناغی، تلاوی و بورجومی همه اقتصادی‌اند."
  - q: "نزدیک‌ترین اثر یونسکو به تفلیس کدام است؟"
    a: "کلیسای جامع سوتیتسخوولی در متسختا، 25 کیلومتر و 0:30. سامتاورو (0:35) و جواری (0:35) دو اثر دیگر یونسکو در همان شهرند. هر سه آسفالت، اقتصادی و رایگان."
  - q: "آیا کازبگی سفر یک‌روزه از تفلیس است؟"
    a: "کلیسای گرگتی 160 کیلومتر و 3:10 یک‌طرفه است، عمدتاً آسفالت، ردهٔ شاسی‌بلند، فصل مه تا اکتبر. این یعنی بیش از شش ساعت رانندگی برای یک توقف؛ به همین دلیل مسیر کازبگی ما دو روزه است."
  - q: "کدام سفرها از تفلیس شاسی‌بلند یا 4x4 می‌خواهند؟"
    a: "در سه ساعت، 20 مکان شاسی‌بلند است، از جمله بیرتویسی، آلگتی، داوید گارجا، گودائوری، خادا و گرگتی، و دو مکان آفرود: درّهٔ تروسو و قلعهٔ کلدکاری. بقیه اقتصادی است."
  - q: "این زمان‌ها از مسیریاب است؟"
    a: "نه. این‌ها فاصلهٔ جاده‌ای و زمان رانندگی اندازه‌گیری‌شده در رکورد هر مکان است، همان ارقام صفحهٔ هر مکان. یک‌طرفه، تا پارکینگ، و ترافیک یا وضعیت امروز جاده را نشان نمی‌دهد."

he:
  name: "טיולי יום מטביליסי ברכב: 100 מקומות בטווח שלוש שעות"
  answer: >-
    מטביליסי, 100 מתוך 239 המקומות ש-RentUp ממפה מחוץ לעיר נמצאים בטווח שלוש שעות נסיעה לכיוון אחד,
    ו-78 מהם מדורגים לרכב אקונומי; 42 בטווח 1:30 ו-174 בטווח 5:00. שלושת אתרי אונסק"ו של מצחתה במרחק
    25-27 ק"מ ו-0:30-0:35; גורי 1:10, אופליסציחה 1:25, סיגנאגי 1:50, בורג'ומי 2:20 וכנסיית גרגטי
    3:10 (מדורגת לרכב שטח עירוני). רק שני מקומות בטווח שלוש שעות, טרוסו וקלדקארי, דורשים רכב שטח
    4x4. 89 מתוך ה-100 על דרכים סלולות או סלולות ברובן. הזמנים מדודים, לא מוערכים.
  short: "מדדנו את המרחק וזמן הנסיעה מטביליסי לכל 239 המקומות שמחוץ לעיר. 42 בטווח 1:30, 100 בטווח 3:00, ו-78 מתוך המאה לא צריכים יותר מרכב אקונומי."
  meta_title: "טיולי יום מטביליסי ברכב: 100 מקומות | RentUp"
  meta_description: "42 מקומות בטווח 1:30 מטביליסי, 100 בטווח 3:00, 174 בטווח 5:00 - נמדד, לא נוחש. זמן נסיעה, סוג הדרך, שעות במקום וקטגוריית הרכב שכל מקום דורש."
  body: |
    ## עד כמה רחוק מגיע יום אחד מטביליסי

    לכל אתר במאגר שלנו יש שני שדות שאנחנו מודדים בעצמנו: מרחק הדרך מטביליסי בקילומטרים וזמן הנסיעה
    לכיוון אחד. ב-1 בספטמבר 2026 ספרנו את כל 267 הרשומות. 28 מהן נמצאות בתוך טביליסי, ונשארים
    **239 מקומות מחוץ לעיר** שמיינו לפי זמן ההגעה.

    | זמן לכיוון אחד | מקומות | אקונומי | רכב שטח עירוני | 4x4 שטח | סלול או סלול ברובו |
    |---|---|---|---|---|---|
    | עד 1:30 | 42 | 37 | 5 | 0 | 39 מתוך 42 |
    | 1:30 עד 3:00 | 58 | 41 | 15 | 2 | 50 מתוך 58 |
    | 3:00 עד 5:00 | 74 | 49 | 20 | 5 | 66 מתוך 74 |
    | **בטווח 3:00** | **100** | **78** | **20** | **2** | **89 מתוך 100** |
    | בטווח 5:00 | 174 | 127 | 40 | 7 | 155 מתוך 174 |

    **מאה מקומות יושבים בטווח שלוש שעות מטביליסי, ו-78 מהם מסווגים ל[רכב אקונומי](/car-rental/economy/)
    רגיל.** רק שניים מתוך המאה - עמק טרוסו ומבצר קלדקארי - דורשים רכב שטח אמיתי. שישה-עשר מקומות
    בטווח שעה, 63 בטווח שעתיים. מכל מה שבטווח 1:30, 41 מתוך 42 פתוחים כל השנה.

    **הערה על המספרים.** לטביליסי אלה השדות האמיתיים והנמדדים שברשומה, לא ניווט ולא הערכה - אותם
    מספרים שמופיעים בכל דף אתר. המדריכים ל[קוטאיסי](/guides/day-trips-from-kutaisi/)
    ול[בטומי](/guides/day-trips-from-batumi/) משתמשים בהערכה שנגזרת מהמדידות האלה. הזמן הוא לכיוון
    אחד, עד החניון; טיול יום הוא פעמיים המספר הזה ועוד השעות במקום.

    ## עשרים טיולי יום מטביליסי

    | מקום | נסיעה | ק"מ | במקום | דרך | רכב | עונה |
    |---|---|---|---|---|---|---|
    | [קתדרלת סווטיצחוולי](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | 2 שע' | סלול | אקונומי | כל השנה |
    | [מנזר ג'וארי](/attractions/jvari-monastery/) | 0:35 | 27 | 1 שע' | סלול | אקונומי | כל השנה |
    | [שאטו מוחרני](/attractions/chateau-mukhrani/) | 0:50 | 42 | 2 שע' | סלול | אקונומי | כל השנה |
    | [גורי: המבצר ומוזיאון סטלין](/attractions/gori-fortress-stalin-museum/) | 1:10 | 86 | 3 שע' | סלול | אקונומי | כל השנה |
    | [בירתוויסי](/attractions/birtvisi-fortress/) | 1:20 | 55 | 4 שע' | עפר | רכב שטח עירוני | מאי עד אוקטובר |
    | [הפארק הלאומי אלגטי](/attractions/algeti-national-park/) | 1:20 | 60 | 4 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [אנדרטת קרב דידגורי](/attractions/didgori-battle-memorial/) | 1:20 | 57 | 1 שע' | סלול | אקונומי | מאי עד אוקטובר |
    | [מבצר אנאנורי](/attractions/ananuri-fortress/) | 1:20 | 70 | 1 שע' | סלול | אקונומי | כל השנה |
    | [אופליסציחה](/attractions/uplistsikhe/) | 1:25 | 100 | 2 שע' | סלול | אקונומי | כל השנה |
    | [קניון דשבאשי](/attractions/dashbashi-canyon/) | 1:50 | 100 | 3 שע' | סלול | אקונומי | מאי עד אוקטובר |
    | [דוד גארג'ה](/attractions/david-gareja/) | 1:50 | 75 | 3 שע' | סלול ברובו | רכב שטח עירוני | כל השנה |
    | [סיגנאגי](/attractions/sighnaghi/) | 1:50 | 110 | 3 שע' | סלול | אקונומי | כל השנה |
    | [מנזר בודבה](/attractions/bodbe-monastery/) | 1:55 | 112 | 2 שע' | סלול | אקונומי | כל השנה |
    | [גודאורי](/attractions/gudauri/) | 2:10 | 120 | 6 שע' | סלול | רכב שטח עירוני | דצמבר עד מרץ |
    | [הפארק המרכזי של בורג'ומי](/attractions/borjomi-central-park/) | 2:20 | 160 | 3 שע' | סלול | אקונומי | כל השנה |
    | [קווארלי ואזור קינדזמראולי](/attractions/kvareli-kindzmarauli/) | 2:30 | 145 | 4 שע' | סלול | אקונומי | כל השנה |
    | [עמק טרוסו](/attractions/truso-valley/) | 3:00 | 145 | 6 שע' | עפר | 4x4 שטח | יוני עד ספטמבר |
    | [כנסיית גרגטי](/attractions/gergeti-trinity-church/) | 3:10 | 160 | 3 שע' | סלול ברובו | רכב שטח עירוני | מאי עד אוקטובר |
    | [מבצר רבאטי](/attractions/rabati-castle/) | 3:20 | 205 | 2 שע' | סלול | אקונומי | כל השנה |
    | [ורדזיה](/attractions/vardzia/) | 4:20 | 265 | 3 שע' | סלול | אקונומי | כל השנה |

    ## מצחתה: שלושה אתרי אונסק"ו בפחות מארבעים דקות

    מתוך 42 המקומות בטווח 1:30, שישה-עשר הם מנזרים, והאשכול הקרוב ביותר הוא הבירה העתיקה.
    [סווטיצחוולי](/attractions/svetitskhoveli-cathedral/) במרחק 25 ק"מ ו-0:30,
    [סמטברו](/attractions/samtavro-monastery/) 26 ק"מ ו-0:35, [ג'וארי](/attractions/jvari-monastery/)
    27 ק"מ ו-0:35 - שלושתם ברשימת אונסק"ו, סלולים, אקונומי, בחינם. היוצא מן הכלל היחיד בקבוצה הוא
    [זדאזני](/attractions/zedazeni-monastery/): עפר, רכב שטח עירוני, מאי עד אוקטובר.
    [יום המורשת של מצחתה](/routes/mtskheta-heritage-day/) שלנו הוא 85 ק"מ, קטגוריית אקונומי.

    ## קוומו קרתלי: מבצרים, קניון ויוצאי הדופן על עפר

    [מבצר קוג'ורי](/attractions/kojori-fortress/) הוא 0:40 על אספלט. [בירתוויסי](/attractions/birtvisi-fortress/)
    הוא מבצר הסלע מהתמונות: 55 ק"מ, 1:20, עפר, רכב שטח עירוני, ארבע שעות במקום.
    [הפארק הלאומי אלגטי](/attractions/algeti-national-park/) ו[סמשווילדה](/attractions/samshvilde/) ב-1:25
    הם שניים נוספים מחמשת סיווגי רכב השטח העירוני בטווח 1:30; השאר הם זדאזני ו[שמורת גרדבאני](/attractions/gardabani-managed-reserve/) ב-1:30. רחוק יותר, [דמניסי](/attractions/dmanisi/) ב-1:50
    ו[קניון דשבאשי](/attractions/dashbashi-canyon/) ב-1:50 שניהם אקונומי.

    ## מערבה: גורי ואופליסציחה על הכביש הראשי

    [גורי](/attractions/gori-fortress-stalin-museum/) היא 86 ק"מ ו-1:10; [אופליסציחה](/attractions/uplistsikhe/),
    עיר המערות, 100 ק"מ ו-1:25 - שתיהן סלולות, אקונומי, פתוחות כל השנה.
    [יום גורי ואופליסציחה](/routes/gori-uplistsikhe-day/) מכסה את שתיהן ב-205 ק"מ.

    ## קחתי: ארץ היין בטווח שעתיים

    [טלאווי](/attractions/telavi-batonis-tsikhe/) 1:45, [סיגנאגי](/attractions/sighnaghi/) 1:50,
    [בודבה](/attractions/bodbe-monastery/) 1:55, [צינאנדלי](/attractions/tsinandali-estate/) 1:55,
    [אלאוורדי](/attractions/alaverdi-cathedral/) 2:05, [גרמי](/attractions/gremi/) 2:20,
    [קווארלי](/attractions/kvareli-kindzmarauli/) 2:30 ו[לגודחי](/attractions/lagodekhi-protected-areas/) 2:40.
    כולם סלולים ואקונומי. ב[קחתי](/regions/kakheti/) ארבעה מקומות בטווח שלוש שעות מסווגים רכב שטח
    עירוני, ו[דוד גארג'ה](/attractions/david-gareja/), 75 ק"מ ו-1:50, הוא המוכר שבהם; שלושת האחרים הם
    [קווטרה](/attractions/kvetera-fortress/), [חורנבוג'י](/attractions/khornabuji-fortress/)
    ו[שמורת בצארה](/attractions/batsara-reserve/). [יום היין בקחתי](/routes/kakheti-wine-day/)
    הוא 285 ק"מ, אקונומי.

    ## צפונה: הכביש הצבאי הגאורגי

    [אנאנורי](/attractions/ananuri-fortress/) ב-1:20 סלול ואקונומי. [גודאורי](/attractions/gudauri/) ב-2:10
    ו-2,200 מ' סלול אך מסווג רכב שטח עירוני, בעונה דצמבר עד מרץ. ואז העמקים הצדדיים:
    [חאדה](/attractions/khada-valley/) 2:15 ו[אגמי אבודלאורי](/attractions/abudelauri-lakes/) 2:50 עפר
    ורכב שטח עירוני; [טרוסו](/attractions/truso-valley/) ב-3:00 עפר ושטח; [גרגטי](/attractions/gergeti-trinity-church/)
    ב-3:10 רכב שטח עירוני; [ג'וטה](/attractions/juta-chaukhi/) ב-3:45 4x4 בלבד. בדיוק בגלל זה
    [יום ההרים בקזבגי](/routes/kazbegi-mountain-day/) כתוב כיומיים.

    ## שלוש עד חמש שעות: אפשרי, אבל לא טיול יום

    74 מקומות יושבים בין 3:00 ל-5:00 לכיוון אחד. [רבאטי](/attractions/rabati-castle/) 3:20,
    [גלאטי](/attractions/gelati-monastery/) 3:30, [מערת פרומתאוס](/attractions/prometheus-cave/) 3:45
    ו[ורדזיה](/attractions/vardzia/) 4:20 כולם סלולים ואקונומי - אבל זה שש וחצי עד תשע שעות
    ברכב בשביל עצירה אחת. התייחסו לרצועה הזאת כתחילת לינה: [מסלול הכביש הצבאי](/routes/military-highway-kazbegi/)
    בנוי סביבה.

    ## איזה רכב

    - **78 מתוך 100 המקומות בטווח שלוש שעות** הם אקונומי: [רכב אקונומי בטביליסי](/car-rental/tbilisi/) מספיק.
    - **20 דורשים [רכב שטח עירוני](/car-rental/suv/)**: בירתוויסי, אלגטי, דוד גארג'ה, גודאורי, חאדה וגרגטי.
    - **2 דורשים [4x4 שטח](/car-rental/4x4/)**: טרוסו וקלדקארי.

    89 מתוך המאה פתוחים כל השנה. [מאתר טיולי היום](/day-trip/) מסנן את אותם נתונים לפי שעות, דרך
    ורכב; לשאלה הרחבה יותר על הקטגוריה קראו [האם צריך 4x4 בגאורגיה?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "כמה טיולי יום מטביליסי אפשר לעשות ברכב רגיל?"
    a: "78 מתוך 100 המקומות בטווח שלוש שעות מטביליסי מסווגים אקונומי בנתונים שלנו, ו-89 מתוך 100 נמצאים על דרך סלולה או סלולה ברובה. מצחתה, גורי, אופליסציחה, סיגנאגי, טלאווי ובורג'ומי כולם מקומות אקונומי."
  - q: "מהו אתר אונסק\"ו הקרוב ביותר לטביליסי?"
    a: "קתדרלת סווטיצחוולי במצחתה, 25 ק\"מ ו-0:30 בדרך. סמטברו (0:35) וג'וארי (0:35) הם שני אתרי אונסק\"ו נוספים באותה עיר. שלושתם סלולים, אקונומי והכניסה חינם."
  - q: "האם קזבגי הוא טיול יום מטביליסי?"
    a: "כנסיית גרגטי היא 160 ק\"מ ו-3:10 לכיוון אחד, סלולה ברובה, מסווגת רכב שטח עירוני, בעונה מאי עד אוקטובר. אלה יותר משש שעות נהיגה בשביל עצירה אחת, ולכן מסלול קזבגי שלנו כתוב כיומיים."
  - q: "אילו טיולי יום מטביליסי דורשים רכב שטח עירוני או 4x4?"
    a: "בטווח שלוש שעות 20 מקומות מסווגים רכב שטח עירוני - ביניהם בירתוויסי, אלגטי, דוד גארג'ה, גודאורי, חאדה וגרגטי - ושניים מסווגים שטח: עמק טרוסו ומבצר קלדקארי. כל השאר אקונומי."
  - q: "האם זמני הנסיעה האלה הם ניווט?"
    a: "לא. אלה מרחק הדרך וזמן הנסיעה הנמדדים ששמורים ברשומת כל אתר - אותם מספרים שמופיעים בדף שלו. הם לכיוון אחד, עד החניון, ואינם משקפים פקקים או מצב דרכים של היום."

ar:
  name: "رحلات يوم واحد من تبليسي بالسيارة: 100 مكان في ثلاث ساعات"
  answer: >-
    من تبليسي، 100 من الأماكن الـ239 التي ترسمها RentUp خارج المدينة تقع ضمن ثلاث ساعات قيادة باتجاه
    واحد، و78 منها مصنّفة لسيارة اقتصادية؛ 42 ضمن 1:30 و174 ضمن 5:00. مواقع اليونسكو الثلاثة في
    متسخيتا على بعد 25-27 كم و0:30-0:35؛ غوري 1:10، وأوبليستسيخه 1:25، وسيغناغي 1:50، وبورجومي 2:20،
    وكنيسة غيرغيتي 3:10 (مصنّفة لدفع رباعي خفيف). مكانان فقط ضمن ثلاث ساعات، تروسو وكلدكاري، يحتاجان
    إلى دفع رباعي وعر 4x4. 89 من الـ100 على طرق معبّدة أو معبّدة في معظمها. الأزمنة مقيسة لا مقدّرة.
  short: "قسنا المسافة وزمن القيادة من تبليسي إلى الأماكن الـ239 كلها خارج المدينة. 42 منها في أقل من 1:30، و100 في أقل من 3:00، و78 من هذه المئة لا تحتاج أكثر من سيارة اقتصادية."
  meta_title: "رحلات يوم واحد من تبليسي بالسيارة: 100 مكان | RentUp"
  meta_description: "42 مكاناً في 1:30 من تبليسي، و100 في 3:00، و174 في 5:00؛ مقاسة لا مخمّنة. زمن القيادة وسطح الطريق والساعات اللازمة في الموقع وفئة السيارة لكل مكان."
  body: |
    ## إلى أي مدى يصل يوم واحد من تبليسي

    لكل معلم في قاعدة بياناتنا حقلان نقيسهما بأنفسنا: مسافة الطريق من تبليسي بالكيلومتر وزمن القيادة
    في اتجاه واحد. في 1 سبتمبر 2026 أحصينا السجلات الـ267 كلها. 28 منها داخل تبليسي نفسها، فيبقى
    **239 مكاناً خارج المدينة** رتّبناها بحسب زمن الوصول.

    | الزمن في اتجاه واحد | الأماكن | اقتصادية | دفع رباعي خفيف | دفع رباعي 4x4 | معبّد أو شبه معبّد |
    |---|---|---|---|---|---|
    | حتى 1:30 | 42 | 37 | 5 | 0 | 39 من 42 |
    | من 1:30 إلى 3:00 | 58 | 41 | 15 | 2 | 50 من 58 |
    | من 3:00 إلى 5:00 | 74 | 49 | 20 | 5 | 66 من 74 |
    | **ضمن 3:00** | **100** | **78** | **20** | **2** | **89 من 100** |
    | ضمن 5:00 | 174 | 127 | 40 | 7 | 155 من 174 |

    **مئة مكان تقع ضمن ثلاث ساعات من تبليسي، و78 منها مصنّفة لـ[سيارة اقتصادية](/car-rental/economy/)
    عادية.** مكانان فقط من المئة، وادي تروسو وقلعة كلدكاري، يتطلبان سيارة دفع رباعي حقيقية. ستة عشر
    مكاناً ضمن ساعة، و63 ضمن ساعتين. ومن كل ما هو أقرب من 1:30، 41 من 42 مفتوح طوال السنة.

    **ملاحظة عن الأرقام.** بالنسبة إلى تبليسي هذه حقول حقيقية مقاسة في كل سجل، لا مسار ملاحة ولا تقدير؛
    وهي الأرقام نفسها الظاهرة في صفحة كل معلم. أما دليلا [كوتايسي](/guides/day-trips-from-kutaisi/)
    و[باتومي](/guides/day-trips-from-batumi/) فيستخدمان تقديراً مشتقاً من هذه القياسات. الزمن في اتجاه
    واحد وحتى الموقف؛ ورحلة اليوم الواحد هي ضعف ذلك الرقم مضافاً إليه الساعات في الموقع.

    ## عشرون رحلة يوم واحد من تبليسي

    | المكان | القيادة | كم | في الموقع | الطريق | السيارة | الموسم |
    |---|---|---|---|---|---|---|
    | [كاتدرائية سفيتيتسخوفيلي](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | ساعتان | معبّد | اقتصادية | طوال السنة |
    | [دير جفاري](/attractions/jvari-monastery/) | 0:35 | 27 | ساعة | معبّد | اقتصادية | طوال السنة |
    | [شاتو موخراني](/attractions/chateau-mukhrani/) | 0:50 | 42 | ساعتان | معبّد | اقتصادية | طوال السنة |
