en:
  name: "Day Trips from Tbilisi by Car: 100 Places Within Three Hours"
  answer: >-
    From Tbilisi, 100 of the 239 places RentUp maps outside the city are within three hours' drive
    one-way, 78 of them rated for an economy car; 42 are within 1:30 and 174 within 5:00. Mtskheta's
    three UNESCO sites are 25-27 km and 0:30-0:35; Gori is 1:10, Uplistsikhe 1:25, Sighnaghi 1:50,
    Borjomi 2:20 and Gergeti Trinity Church 3:10 (rated SUV). Only two places inside three hours,
    Truso and Kldekari, need an off-road 4x4. 89 of the 100 are on paved or mostly paved roads.
    Times are measured, not estimated.
  short: "We measured the road distance and drive time from Tbilisi to all 239 places we map outside the city. 42 are within 1:30, 100 within 3:00, and 78 of those 100 need nothing more than an economy car."
  meta_title: "Day Trips from Tbilisi by Car: 100 Places Within 3 h | RentUp"
  meta_description: "42 places within 1:30 of Tbilisi, 100 within 3:00, 174 within 5:00 - measured, not guessed. Drive time, road surface, hours on site and the car each needs."
  body: |
    ## How far a day from Tbilisi actually goes

    Every place in our attractions database carries two fields we measure ourselves: the road
    distance from Tbilisi in kilometres and the drive time one-way. On 1 September 2026 we counted
    all 267 records. 28 of them are inside Tbilisi itself, which leaves **239 places outside the
    city** to sort by how long they take to reach.

    | One-way drive time | Places | Economy | SUV | Off-road 4x4 | Paved or mostly paved |
    |---|---|---|---|---|---|
    | up to 1:30 | 42 | 37 | 5 | 0 | 39 of 42 |
    | 1:30 to 3:00 | 58 | 41 | 15 | 2 | 50 of 58 |
    | 3:00 to 5:00 | 74 | 49 | 20 | 5 | 66 of 74 |
    | **within 3:00** | **100** | **78** | **20** | **2** | **89 of 100** |
    | within 5:00 | 174 | 127 | 40 | 7 | 155 of 174 |

    Read the bold row twice. **A hundred places sit within three hours of Tbilisi, and 78 of them
    are rated for an ordinary [economy car](/car-rental/economy/).** Only two of the hundred - the
    Truso valley and the Kldekari fortress - ask for a genuine off-road vehicle. The rest of this
    page is those hundred places, grouped by direction and by what they are.

    Sixteen places are within an hour, 63 within two. Of everything inside 1:30, 41 of 42 are open
    all year and 31 of 42 carry an all-season rating; the other 11 are May to October places.

    **A note on the numbers.** For Tbilisi these are the real, measured fields on each record, not
    routed directions and not estimates - the same figures that appear on every attraction page. Our
    [Kutaisi](/guides/day-trips-from-kutaisi/) and [Batumi](/guides/day-trips-from-batumi/) guides
    use an estimate derived from those measurements; this one does not need to. Drive time is
    one-way, to the car park. A day trip is that figure twice, plus the hours on site listed below.

    ## Twenty day trips from Tbilisi, measured

    Picked from the hundred by rating and variety. Distance is the road distance on the record.

    | Place | Drive | Km | On site | Road | Car | Season |
    |---|---|---|---|---|---|---|
    | [Svetitskhoveli Cathedral](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | 2 h | paved | economy | all year |
    | [Jvari Monastery](/attractions/jvari-monastery/) | 0:35 | 27 | 1 h | paved | economy | all year |
    | [Château Mukhrani](/attractions/chateau-mukhrani/) | 0:50 | 42 | 2 h | paved | economy | all year |
    | [Gori: fortress and Stalin Museum](/attractions/gori-fortress-stalin-museum/) | 1:10 | 86 | 3 h | paved | economy | all year |
    | [Birtvisi](/attractions/birtvisi-fortress/) | 1:20 | 55 | 4 h | gravel | SUV | May to Oct |
    | [Algeti National Park](/attractions/algeti-national-park/) | 1:20 | 60 | 4 h | mostly paved | SUV | May to Oct |
    | [Didgori Battle Memorial](/attractions/didgori-battle-memorial/) | 1:20 | 57 | 1 h | paved | economy | May to Oct |
    | [Ananuri Fortress](/attractions/ananuri-fortress/) | 1:20 | 70 | 1 h | paved | economy | all year |
    | [Uplistsikhe](/attractions/uplistsikhe/) | 1:25 | 100 | 2 h | paved | economy | all year |
    | [Dashbashi Canyon](/attractions/dashbashi-canyon/) | 1:50 | 100 | 3 h | paved | economy | May to Oct |
    | [David Gareja](/attractions/david-gareja/) | 1:50 | 75 | 3 h | mostly paved | SUV | all year |
    | [Sighnaghi](/attractions/sighnaghi/) | 1:50 | 110 | 3 h | paved | economy | all year |
    | [Bodbe Monastery](/attractions/bodbe-monastery/) | 1:55 | 112 | 2 h | paved | economy | all year |
    | [Gudauri](/attractions/gudauri/) | 2:10 | 120 | 6 h | paved | SUV | Dec to Mar |
    | [Borjomi Central Park](/attractions/borjomi-central-park/) | 2:20 | 160 | 3 h | paved | economy | all year |
    | [Kvareli and the Kindzmarauli zone](/attractions/kvareli-kindzmarauli/) | 2:30 | 145 | 4 h | paved | economy | all year |
    | [Truso Valley](/attractions/truso-valley/) | 3:00 | 145 | 6 h | gravel | off-road 4x4 | Jun to Sep |
    | [Gergeti Trinity Church](/attractions/gergeti-trinity-church/) | 3:10 | 160 | 3 h | mostly paved | SUV | May to Oct |
    | [Rabati Castle](/attractions/rabati-castle/) | 3:20 | 205 | 2 h | paved | economy | all year |
    | [Vardzia](/attractions/vardzia/) | 4:20 | 265 | 3 h | paved | economy | all year |

    ## Mtskheta: three UNESCO sites in under forty minutes

    Of the 42 places within 1:30, sixteen are monasteries, and the closest cluster is the old
    capital. [Svetitskhoveli](/attractions/svetitskhoveli-cathedral/) is 25 km and 0:30 away,
    [Samtavro](/attractions/samtavro-monastery/) 26 km and 0:35,
    [Jvari](/attractions/jvari-monastery/) 27 km and 0:35 - all three UNESCO-listed, all paved, all
    economy, all free. Add [Shio-Mgvime](/attractions/shiomghvime-monastery/) at 0:50 on a mostly
    paved road, and you have a full day without leaving [Mtskheta-Mtianeti](/regions/mtskheta-mtianeti/).
    The one exception in the group is [Zedazeni](/attractions/zedazeni-monastery/): gravel, rated SUV,
    May to October. Our [Mtskheta heritage day](/routes/mtskheta-heritage-day/) is 85 km, rated economy.

    ## Kvemo Kartli: fortresses, a canyon and the gravel exceptions

    South-west of the city the drive times stay short and the roads start to vary.
    [Kojori Fortress](/attractions/kojori-fortress/) is 0:40 on asphalt.
    [Didgori](/attractions/didgori-battle-memorial/) at 1,650 m is paved but a May to October place.
    [Birtvisi](/attractions/birtvisi-fortress/) is the rock fortress everyone photographs - 55 km,
    1:20, gravel, rated SUV, four hours on site. [Algeti National Park](/attractions/algeti-national-park/)
    and [Samshvilde](/attractions/samshvilde/) at 1:25 are two more of the five SUV ratings inside 1:30 - Zedazeni and the
    [Gardabani reserve](/attractions/gardabani-managed-reserve/) at 1:30 are the rest.
    Further out, [Dmanisi](/attractions/dmanisi/) at 1:50 and [Dashbashi Canyon](/attractions/dashbashi-canyon/)
    at 1:50 are both economy. The [Kvemo Kartli monasteries day](/routes/kvemo-kartli-monasteries-day/)
    is rated SUV precisely because of Birtvisi and Pitareti.

    ## West: Gori and Uplistsikhe on the highway

    The highway west is the easiest driving on this page. [Gori](/attractions/gori-fortress-stalin-museum/)
    is 86 km and 1:10; [Uplistsikhe](/attractions/uplistsikhe/), the cave town, 100 km and 1:25 -
    both paved, economy, open all year. [Ateni Sioni](/attractions/ateni-sioni-church/) at 1:30 and
    the [Ateni valley cellars](/attractions/ateni-valley-wine-cellars/) at 1:25 sit just off the same
    road. The [Gori and Uplistsikhe day](/routes/gori-uplistsikhe-day/) covers them in 205 km.

    ## Kakheti: wine country within two hours

    [Kakheti](/regions/kakheti/) is where the 1:30 to 3:00 band earns its keep.
    [Telavi](/attractions/telavi-batonis-tsikhe/) is 1:45, [Sighnaghi](/attractions/sighnaghi/) 1:50,
    [Bodbe](/attractions/bodbe-monastery/) 1:55, [Tsinandali](/attractions/tsinandali-estate/) 1:55,
    [Alaverdi](/attractions/alaverdi-cathedral/) 2:05, [Napareuli](/attractions/napareuli/) 2:10,
    [Gremi](/attractions/gremi/) 2:20, [Nekresi](/attractions/nekresi-monastery/) 2:25,
    [Kvareli](/attractions/kvareli-kindzmarauli/) 2:30, the [Khareba tunnel](/attractions/khareba-wine-tunnel/)
    2:35 and [Lagodekhi](/attractions/lagodekhi-protected-areas/) 2:40. Every one of those is paved
    and rated economy. Four Kakheti places inside three hours are rated SUV, and
    [David Gareja](/attractions/david-gareja/), 75 km and 1:50 on a mostly paved road, is the one
    most people want; [Kvetera](/attractions/kvetera-fortress/), [Khornabuji](/attractions/khornabuji-fortress/)
    and the [Batsara reserve](/attractions/batsara-reserve/) are the other three. The
    [Kakheti wine day](/routes/kakheti-wine-day/) is 285 km, rated economy, all year.

    ## North: the Military Highway, band by band

    The road to Kazbegi is a clean demonstration of how drive time and car category move together.
    [Zhinvali](/attractions/zhinvali-reservoir/) 1:15 and [Ananuri](/attractions/ananuri-fortress/)
    1:20 are paved and economy. [Gudauri](/attractions/gudauri/) at 2:10 and 2,200 m is paved but
    rated SUV, in season December to March. The [Jvari Pass](/attractions/jvari-pass-friendship-monument/)
    at 2:20 is economy again. Then the side valleys: [Khada](/attractions/khada-valley/) 2:15 and the
    [Abudelauri lakes](/attractions/abudelauri-lakes/) 2:50 are gravel and SUV;
    [Truso](/attractions/truso-valley/) at 3:00 is gravel and off-road; [Gergeti](/attractions/gergeti-trinity-church/)
    at 3:10 is SUV; [Juta](/attractions/juta-chaukhi/) at 3:45 is 4x4 only, June to September. The
    [Kazbegi mountain day](/routes/kazbegi-mountain-day/) is written as two days for exactly this reason.

    ## Three to five hours: possible, but not a day trip

    74 places sit between 3:00 and 5:00 one-way. [Rabati](/attractions/rabati-castle/) 3:20,
    [Gelati](/attractions/gelati-monastery/) 3:30, [Prometheus Cave](/attractions/prometheus-cave/)
    3:45 and [Vardzia](/attractions/vardzia/) 4:20 are all paved and economy - but that is between six
    and a half and nine hours in the car for a single stop. [Vashlovani](/attractions/vashlovani-national-park/)
    at 4:30 and [Shatili](/attractions/shatili/) at 4:30 are 4x4 only. Treat this band as the start
    of an overnight: the [Georgian Military Highway route](/routes/military-highway-kazbegi/) and the
    [3-day itinerary](/itineraries/georgia-3-days/) are built around it.

    ## Which car, and where to start

    - **78 of the 100 places within three hours** are rated economy. Book an
      [economy car in Tbilisi](/car-rental/tbilisi/) and the wine country, Mtskheta, Gori and Borjomi
      are all covered.
    - **20 need an [SUV](/car-rental/suv/)**: Birtvisi, Algeti, Samshvilde, Zedazeni, David Gareja,
      Gudauri, Khada, Abudelauri and Gergeti are the ones most people actually want.
    - **2 need an [off-road 4x4](/car-rental/4x4/)**: Truso and Kldekari. Juta and Shatili join them
      past the three-hour line.

    Seasons matter less here than in the mountains: 67 of the 100 carry an all-season rating, 28 are
    May to October, 4 are June to September and one - Gudauri - is a winter place. 89 of the 100 are
    open all year. For today's answer to "where can I get to and back", the
    [day-trip finder](/day-trip/) filters the same data by hours, road and car; for the wider question
    of category, read [Do you need a 4x4 in Georgia?](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "How many day trips from Tbilisi can I do in an ordinary car?"
    a: "78 of the 100 places within three hours of Tbilisi are rated economy in our data, and 89 of the 100 are on paved or mostly paved roads. Mtskheta, Gori, Uplistsikhe, Sighnaghi, Telavi, Borjomi and Dashbashi Canyon are all economy places."
  - q: "What is the closest UNESCO site to Tbilisi?"
    a: "Svetitskhoveli Cathedral in Mtskheta, 25 km and 0:30 by road. Samtavro (0:35) and Jvari (0:35) are the other two UNESCO-listed places in the same town. All three are paved, economy and free to enter."
  - q: "Is Kazbegi a day trip from Tbilisi?"
    a: "Gergeti Trinity Church is 160 km and 3:10 one-way, mostly paved, rated SUV, in season May to October. That is more than six hours of driving for a single stop, which is why our Kazbegi route is written as two days."
  - q: "Which day trips from Tbilisi need an SUV or a 4x4?"
    a: "Inside three hours, 20 places are rated SUV - among them Birtvisi, Algeti, David Gareja, Gudauri, Khada and Gergeti - and two are rated off-road: Truso valley and Kldekari fortress. Everything else is economy."
  - q: "How far is Kakheti wine country from Tbilisi?"
    a: "Telavi is 95 km and 1:45, Sighnaghi 110 km and 1:50, Tsinandali 100 km and 1:55, Kvareli 145 km and 2:30. All of them are paved, rated economy and open all year."
  - q: "Are these drive times routed directions?"
    a: "No. They are the measured road distance and drive time stored on each attraction record, the same figures shown on every attraction page. They are one-way, to the car park, and they do not reflect today's traffic or road status."

ka:
  name: "ერთდღიანი მოგზაურობა თბილისიდან მანქანით: 100 ადგილი სამ საათში"
  answer: >-
    თბილისიდან ქალაქგარეთ RentUp-ის რუკაზე 239 ადგილიდან 100 ერთი მიმართულებით სამ საათშია, მათგან
    78 ეკონომ კლასის მანქანითაა შეფასებული; 42 არის 1:30-ში, 174 — 5:00-ში. მცხეთის სამი იუნესკოს
    ძეგლი 25-27 კმ და 0:30-0:35-ია; გორი 1:10, უფლისციხე 1:25, სიღნაღი 1:50, ბორჯომი 2:20 და
    გერგეტის სამება 3:10 (კროსოვერით შეფასებული). სამ საათში მხოლოდ ორ ადგილს — თრუსოსა და კლდეკარს
    — სჭირდება მაღალი გამავლობის 4x4. 100-დან 89 ასფალტიან ან უმეტესად ასფალტიან გზაზეა. დრო
    გაზომილია და არა შეფასებული.
  short: "ქალაქგარეთ 239 ადგილიდან, რომელსაც ვაღწერთ, 42 თბილისიდან 1:30-შია, 100 — 3:00-ში, და ამ ასიდან 78-ს ეკონომ-კლასის მანქანის მეტი არაფერი სჭირდება."
  meta_title: "ერთდღიანი მოგზაურობა თბილისიდან: 100 ადგილი | RentUp"
  meta_description: "თბილისიდან 1:30-ში 42 ადგილია, 3:00-ში — 100, 5:00-ში — 174. გაზომილი და არა ნავარაუდევი: გზაში დრო, საფარი, ადგილზე საჭირო საათები და კატეგორია."
  body: |
    ## რამდენად შორს მიდის ერთი დღე თბილისიდან

    ჩვენს ბაზაში თითოეულ ღირსშესანიშნაობას აქვს ორი ველი, რომელსაც თავად ვზომავთ: გზის მანძილი
    თბილისიდან კილომეტრებში და გზაში გასატარებელი დრო ერთი მიმართულებით. 2026 წლის 1 სექტემბერს
    დავთვალეთ ყველა 267 ჩანაწერი. მათგან 28 თავად თბილისშია, ანუ რჩება **239 ადგილი ქალაქგარეთ**,
    რომელიც მისვლის დროის მიხედვით დავალაგეთ.

    | დრო ერთი მიმართულებით | ადგილი | ეკონომი | კროსოვერი | ჯიპი 4x4 | ასფალტი ან თითქმის ასფალტი |
    |---|---|---|---|---|---|
    | 1:30-მდე | 42 | 37 | 5 | 0 | 42-დან 39 |
    | 1:30-დან 3:00-მდე | 58 | 41 | 15 | 2 | 58-დან 50 |
    | 3:00-დან 5:00-მდე | 74 | 49 | 20 | 5 | 74-დან 66 |
    | **3:00-ის ფარგლებში** | **100** | **78** | **20** | **2** | **100-დან 89** |
    | 5:00-ის ფარგლებში | 174 | 127 | 40 | 7 | 174-დან 155 |

    მუქი სტრიქონი ორჯერ წაიკითხეთ. **თბილისიდან სამი საათის რადიუსში ასი ადგილია და მათგან 78
    ჩვეულებრივი [ეკონომ-კლასის მანქანისთვისაა](/car-rental/economy/) შეფასებული.** ასიდან მხოლოდ
    ორი — თრუსოს ხეობა და კლდეკარის ციხე — ითხოვს ნამდვილ ჯიპს. ამ გვერდის დანარჩენი ნაწილი სწორედ ეს
    ასი ადგილია, მიმართულებისა და ტიპის მიხედვით დაჯგუფებული.

    ერთ საათში თექვსმეტი ადგილია, ორში — 63. 1:30-ის ფარგლებში 42-დან 41 მთელი წლის განმავლობაში
    ღიაა და 31-ს ყველა სეზონის შეფასება აქვს; დანარჩენი 11 მაისიდან ოქტომბრამდე ადგილებია.

    **შენიშვნა ციფრებზე.** თბილისისთვის ეს რეალური, გაზომილი ველებია თითოეულ ჩანაწერზე და არა
    ნავიგატორის მარშრუტი ან შეფასება — იგივე რიცხვები, რაც ყველა ღირსშესანიშნაობის გვერდზე ჩანს.
    [ქუთაისისა](/guides/day-trips-from-kutaisi/) და [ბათუმის](/guides/day-trips-from-batumi/)
    გზამკვლევებში ამ გაზომვებიდან გამოყვანილ შეფასებას ვიყენებთ; აქ ეს საჭირო არ არის. დრო ერთი
    მიმართულებით, პარკინგამდეა. ერთდღიანი მოგზაურობა ამ რიცხვის ორმაგია, პლუს ადგილზე გასატარებელი
    საათები, რომელიც ქვემოთ წერია.

    ## ოცი ერთდღიანი მარშრუტი თბილისიდან, გაზომილი

    ასიდან შერჩეულია რეიტინგისა და მრავალფეროვნების მიხედვით. მანძილი ჩანაწერში ჩაწერილი გზის მანძილია.

    | ადგილი | გზაში | კმ | ადგილზე | გზა | კატეგორია | სეზონი |
    |---|---|---|---|---|---|---|
    | [სვეტიცხოვლის ტაძარი](/attractions/svetitskhoveli-cathedral/) | 0:30 | 25 | 2 სთ | ასფალტი | ეკონომი | მთელი წელი |
    | [ჯვრის მონასტერი](/attractions/jvari-monastery/) | 0:35 | 27 | 1 სთ | ასფალტი | ეკონომი | მთელი წელი |
