    | [ანანურის ციხე](/attractions/ananuri-fortress/) | 1:20 | 70 | 1 სთ | ასფალტი | ეკონომი | მთელი წელი |
    | [უფლისციხე](/attractions/uplistsikhe/) | 1:25 | 100 | 2 სთ | ასფალტი | ეკონომი | მთელი წელი |
