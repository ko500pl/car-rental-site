    ## متسخيتا: ثلاثة مواقع يونسكو في أقل من أربعين دقيقة

    من الأماكن الـ42 ضمن 1:30، ستة عشر ديراً، وأقرب مجموعة منها في العاصمة القديمة.
    [سفيتيتسخوفيلي](/attractions/svetitskhoveli-cathedral/) على بعد 25 كم و0:30،
    و[سامتافرو](/attractions/samtavro-monastery/) 26 كم و0:35، و[جفاري](/attractions/jvari-monastery/)
    27 كم و0:35؛ ثلاثتها في قائمة يونسكو، معبّدة، اقتصادية، ومجانية. الاستثناء الوحيد في المجموعة
    [زيدازيني](/attractions/zedazeni-monastery/): ترابي، دفع رباعي خفيف، مايو إلى أكتوبر.
    [يوم تراث متسخيتا](/routes/mtskheta-heritage-day/) عندنا 85 كم بفئة اقتصادية.

    ## كفيمو كارتلي: قلاع وواد واستثناءات ترابية

    [قلعة كوجوري](/attractions/kojori-fortress/) على 0:40 فوق الإسفلت. [بيرتفيسي](/attractions/birtvisi-fortress/)
    هي القلعة الصخرية التي في الصور: 55 كم، 1:20، ترابي، دفع رباعي خفيف، أربع ساعات في الموقع.
    [منتزه ألغيتي](/attractions/algeti-national-park/) و[سامشفيلده](/attractions/samshvilde/) على 1:25
    اثنان آخران من خمسة تصنيفات للدفع الرباعي الخفيف ضمن 1:30؛ والباقي زيدازيني و[محمية غاردباني](/attractions/gardabani-managed-reserve/) على 1:30. أبعد من ذلك، [دمانيسي](/attractions/dmanisi/)
    على 1:50 و[وادي داشباشي](/attractions/dashbashi-canyon/) على 1:50 كلاهما اقتصادي.

    ## غرباً: غوري وأوبليستسيخي على الطريق السريع

    [غوري](/attractions/gori-fortress-stalin-museum/) 86 كم و1:10؛ و[أوبليستسيخي](/attractions/uplistsikhe/)،
    مدينة الكهوف، 100 كم و1:25؛ كلتاهما معبّدة واقتصادية ومفتوحة طوال السنة.
    [يوم غوري وأوبليستسيخي](/routes/gori-uplistsikhe-day/) يغطيهما في 205 كم.

    ## كاخيتي: أرض النبيذ في ساعتين

    [تيلافي](/attractions/telavi-batonis-tsikhe/) 1:45، [سيغناغي](/attractions/sighnaghi/) 1:50،
    [بودبي](/attractions/bodbe-monastery/) 1:55، [تسيناندالي](/attractions/tsinandali-estate/) 1:55،
    [ألافيردي](/attractions/alaverdi-cathedral/) 2:05، [غريمي](/attractions/gremi/) 2:20،
    [كفاريلي](/attractions/kvareli-kindzmarauli/) 2:30 و[لاغوديخي](/attractions/lagodekhi-protected-areas/) 2:40.
    كلها معبّدة واقتصادية. في [كاخيتي](/regions/kakheti/) أربعة أماكن ضمن ثلاث ساعات مصنّفة للدفع
    الرباعي الخفيف، و[ديفيد غاريجا](/attractions/david-gareja/)، 75 كم و1:50، أشهرها؛ والثلاثة الأخرى
    [كفيتيرا](/attractions/kvetera-fortress/) و[خورنابوجي](/attractions/khornabuji-fortress/)
    و[محمية باتسارا](/attractions/batsara-reserve/). و[يوم نبيذ كاخيتي](/routes/kakheti-wine-day/)
    285 كم بفئة اقتصادية.

    ## شمالاً: الطريق العسكري الجورجي

    [أنانوري](/attractions/ananuri-fortress/) على 1:20 معبّد واقتصادي. [غوداوري](/attractions/gudauri/) على
    2:10 وارتفاع 2,200 متر معبّد لكنه مصنّف دفعاً رباعياً خفيفاً، وموسمه ديسمبر إلى مارس. ثم الأودية
    الجانبية: [خادا](/attractions/khada-valley/) 2:15 و[بحيرات أبوديلاوري](/attractions/abudelauri-lakes/) 2:50
    ترابية بدفع رباعي خفيف؛ [تروسو](/attractions/truso-valley/) على 3:00 ترابية للدفع الرباعي؛
    [غرغيتي](/attractions/gergeti-trinity-church/) على 3:10 دفع رباعي خفيف؛ [جوتا](/attractions/juta-chaukhi/)
    على 3:45 من صنف 4x4 فقط. لهذا كُتب [يوم كازبيغي الجبلي](/routes/kazbegi-mountain-day/) يومين.

    ## من ثلاث إلى خمس ساعات: ممكن، لكنه ليس رحلة يوم

    74 مكاناً بين 3:00 و5:00 في اتجاه واحد. [راباتي](/attractions/rabati-castle/) 3:20،
    [غيلاتي](/attractions/gelati-monastery/) 3:30، [كهف بروميثيوس](/attractions/prometheus-cave/) 3:45
    و[فاردزيا](/attractions/vardzia/) 4:20 كلها معبّدة واقتصادية، لكن هذا يعني من ست ساعات ونصف إلى
    تسع ساعات في السيارة من أجل توقف واحد. اعتبر هذا النطاق بداية مبيت؛
    [مسار الطريق العسكري](/routes/military-highway-kazbegi/) مبني حوله.

    ## أي سيارة

    - **78 من الأماكن المئة ضمن ثلاث ساعات** اقتصادية: [سيارة اقتصادية في تبليسي](/car-rental/tbilisi/) تكفي.
    - **20 تحتاج [دفعاً رباعياً خفيفاً](/car-rental/suv/)**: بيرتفيسي وألغيتي وديفيد غاريجا وغوداوري وخادا وغرغيتي.
    - **2 تحتاجان [دفعاً رباعياً 4x4](/car-rental/4x4/)**: تروسو وكلدكاري.

    89 من المئة مفتوحة طوال السنة. [أداة رحلات اليوم الواحد](/day-trip/) ترشّح البيانات نفسها بحسب
    الساعات والطريق والسيارة؛ وللسؤال الأوسع عن الفئة اقرأ
    [هل تحتاج دفعاً رباعياً في جورجيا؟](/guides/do-i-need-a-4x4-in-georgia/).
  faq:
  - q: "كم رحلة يوم واحد من تبليسي يمكن بسيارة عادية؟"
    a: "78 من الأماكن المئة ضمن ثلاث ساعات من تبليسي مصنّفة اقتصادية في بياناتنا، و89 من 100 على طريق معبّد أو شبه معبّد. متسخيتا وغوري وأوبليستسيخي وسيغناغي وتيلافي وبورجومي كلها أماكن اقتصادية."
  - q: "ما أقرب موقع يونسكو إلى تبليسي؟"
    a: "كاتدرائية سفيتيتسخوفيلي في متسخيتا، 25 كم و0:30 بالطريق. سامتافرو (0:35) وجفاري (0:35) موقعا يونسكو آخران في المدينة نفسها. ثلاثتها معبّدة واقتصادية والدخول مجاني."
  - q: "هل كازبيغي رحلة يوم واحد من تبليسي؟"
    a: "كنيسة غرغيتي على بعد 160 كم و3:10 في اتجاه واحد، معبّدة في معظمها، بفئة دفع رباعي خفيف، وموسمها مايو إلى أكتوبر. أي أكثر من ست ساعات من القيادة لتوقف واحد؛ لهذا كُتب مسار كازبيغي عندنا يومين."
  - q: "أي رحلات من تبليسي تحتاج دفعاً رباعياً خفيفاً أو 4x4؟"
    a: "ضمن ثلاث ساعات، 20 مكاناً مصنّف للدفع الرباعي الخفيف، منها بيرتفيسي وألغيتي وديفيد غاريجا وغوداوري وخادا وغرغيتي، ومكانان للدفع الرباعي: وادي تروسو وقلعة كلدكاري. والباقي اقتصادي."
  - q: "هل هذه الأزمنة من الملاحة؟"
    a: "لا. هي مسافة الطريق وزمن القيادة المقاسان المحفوظان في سجل كل معلم، الأرقام نفسها الظاهرة في صفحته. في اتجاه واحد وحتى الموقف، ولا تعكس ازدحام اليوم ولا حال الطريق."
