en:
  name: "Winter Driving in Georgia: What Closes, What Opens, Which Car"
  short: "Of the 267 places we map, 161 are in season in winter and 52 are flagged as not reachable year-round. The passes, the resorts, the car each one needs, and what the rental terms say about snow."
  meta_title: "Winter Driving in Georgia: Passes, Resorts, Cars | RentUp"
  meta_description: "Which Georgian passes close in winter, which ski resorts stay open, the car class each needs, and what our terms say about winter tyres from 1 Dec to 1 Apr."
  body: |
    ## Winter, counted

    Every one of the 267 places in our database carries a `best_season` window, an
    `open_year_round` flag, an elevation and a minimum car category. Counting them for December to
    March gives a cleaner answer than any forum thread:

    - **161 places are in season in winter** - 159 with a year-round window and two whose season is
      *only* winter, [Gudauri](/attractions/gudauri/) and the
      [Hatsvali and Tetnuldi ski areas](/attractions/hatsvali-tetnuldi/).
    - **106 places carry a window that excludes winter** - 69 May-to-October, 36 June-to-September
      and one April-to-October.
    - **52 places are flagged as not accessible year-round**; 215 are.

    The 161 winter places are not the hard ones. 147 of them are rated for an
    [economy car](/car-rental/economy/) and 14 for a [crossover](/car-rental/suv/); 128 are paved to
    the car park and 32 mostly paved. Not one is on a `4x4_only` road. The 52 closed places are the
    opposite: 21 need an [off-road 4x4](/car-rental/4x4/), 26 a crossover, and 15 of the 17
    `4x4_only` roads in the country are among them. Sixteen of the 52 sit above 2,000 m.

    So the winter rule is simple: **the country you can drive in winter is the low country.** Of the
    20 places above 2,000 m, only two have a winter season.

    ## The passes

    | Pass | Elevation | Season in our data | Road | Minimum car |
    |---|---|---|---|---|
    | [Abano Pass](/attractions/abano-pass/) (Tusheti) | 2,850 m | June-September, closed in winter | `4x4_only` | Off-road 4x4 |
    | [Goderdzi Pass](/attractions/goderdzi-pass/) | 2,025 m | June-September, closed in winter | `gravel` | Off-road 4x4 |
    | [Jvari Pass](/attractions/jvari-pass-friendship-monument/) | 2,380 m | Year-round | `paved` | Economy |
    | [Gombori Pass](/attractions/gombori-pass/) | 1,620 m | Year-round | `paved` | Economy |
    | [Nakerala Pass](/attractions/nakerala-pass/) | 1,230 m | May-October, flagged open year-round | `paved` | Economy |

    Two of these need honesty rather than optimism. The Abano Pass is the only vehicle road into
    Tusheti; our FAQ puts it open roughly June to October, and it needs an off-road 4x4, prior
    written agreement, and carries an additional excess of 500 ₾. Goderdzi has a small ski resort
    near the summit, but the road over the pass closes from about November to May, our data marks it
    June to September, and we do not treat it as a winter driving destination. Jvari Pass is the one
    that stays open on paper and closes in practice: the Gudauri section of the Georgian Military
    Highway shuts periodically for avalanche risk, sometimes for hours, sometimes for a day, in both
    directions. The Tbilisi-Batumi and Tbilisi-Kazbegi highways themselves stay open all year.

    ## The winter destinations, and the car each one requires

    | Destination | Elevation | From Tbilisi | Road | Car category in our data |
    |---|---|---|---|---|
    | [Gudauri](/attractions/gudauri/) | 2,200 m | 120 km, 2:10 | `paved` | Crossover / SUV |
    | [Bakuriani](/attractions/bakuriani/) | 1,700 m | 185 km, 2:50 | `paved` | Crossover / SUV |
    | [Hatsvali and Tetnuldi](/attractions/hatsvali-tetnuldi/) | 1,870 m | 478 km, 8:50 | `mostly_paved` | Crossover / SUV |
    | [Mestia](/attractions/mestia/), the Svaneti base | 1,500 m | 470 km, 8:30 | `paved` | Crossover / SUV |

    Every winter resort in the database is rated crossover, not economy, and that is not a sales
    pitch: it is altitude, gradient and an unploughed final climb. Under
    [the rental terms](/terms/) the crossover category means a minimum age of 23 and a licence held
    for 3 years, with a young-driver surcharge of 15 ₾ per day between 23 and 25; the deposit and the
    CDW excess on this category are both 600 ₾.

    Two cautions from the same data. Hatsvali and Tetnuldi are the only winter-season entry also
    flagged as not year-round, because the season is short and the approach is partly rough. And
    [Ushguli](/attractions/ushguli/), two hours beyond Mestia in summer, is a June-to-September,
    gravel, off-road-only place that is often cut off for weeks in winter - the FAQ permits it in the
    4x4 category alone, and it should not be on a winter plan at all.

    ## What the rental terms say about winter

    - **Winter tyres are on every car from 1 December to 1 April**, included in the rate. That is
      equipment, not a solution: they shorten braking distances and do nothing about ice.
    - **Snow chains are 20 ₾ per rental** from December to March and free on the 4x4 category; a
      **roof rack is 25 ₾ per day**, SUV and 4x4 only.
    - **CDW and TPL are included, with an excess by category**: 300 ₾ economy, 600 ₾ crossover,
      800 ₾ commercial van, 1,000 ₾ business class and minivan, 1,200 ₾ off-road 4x4. SCDW at
      25-45 ₾ per day lowers the excess; on the off-road 4x4 an excess of 300 ₾ remains even with
      SCDW.
    - **Tyres, wheels, the underbody, mirrors and the interior are not covered** by CDW; replacing a
      tyre costs 120-400 ₾. Damage on gravel or unpaved roads is not covered unless the car is in
      the 4x4 category - and in winter an unploughed track counts.
    - **Roadside assistance runs 24/7.** If a technical fault that is not your doing stops the car,
      a replacement reaches you within 6 hours at no charge. The emergency number is 112.
    - **New Year week carries a +10% seasonal coefficient**, as does Easter week.

    ## Honest advice for a winter drive

    1. **Plan around eight hours of light, not twelve.** In December the sun sets in Tbilisi around
       17:20, and earlier in a valley. Mountain hairpins, darkness and black ice together are a
       combination we do not recommend to any visiting driver.
    2. **Do not pair a Kazbegi day-trip with an evening flight.** If the Gudauri section closes
       while you are north of it, you come back a day later. Build the mountain leg so you are home
       one day before you fly.
    3. **Descend in a low gear and double your following distance.** Winter tyres do not repeal
       physics.
    4. **Refuel at half a tank.** Stations thin out above 1,500 m, and a closure can mean two hours
       idling in a queue.
    5. **Learn to fit the chains in a dry car park**, not at -8 °C on the pass. We will show you at
       handover.
    6. **Choose the low routes.** Fourteen of our 49 routes carry a year-round season, among them
       the [Kakheti wine loop](/routes/kakheti-wine-loop/), the
       [western Georgia food road](/routes/western-georgia-food-road/), the
       [Borjomi spa day](/routes/borjomi-spa-day/) and the
       [Military Highway to Kazbegi](/routes/military-highway-kazbegi/), which is rated crossover
       and moderate for a reason.

    A season in Gudauri or Bakuriani is a long stay, and the rate falls with length: see the
    [monthly car rental](/car-rental/monthly/) page. For the month-by-month picture across the whole
    map, read [when to visit Georgia](/guides/best-time-to-visit-georgia/); for what the surface does
    to your day, [driving in Georgia](/guides/driving-in-georgia/). Then pick the category at
    [car rental](/car-rental/) and ask us anything the [FAQ](/faq/) leaves open.
  faq:
  - q: "Do I need winter tyres on a rental car in Georgia?"
    a: "You do not need to arrange them. Every car in our fleet runs on winter tyres from 1 December to 1 April, included in the rate. Snow chains are a separate extra at 20 ₾ per rental, free on the 4x4 category."
  - q: "Which car do I need for Gudauri or Bakuriani in winter?"
    a: "Our data rates both resorts crossover / SUV, not economy. That category needs a driver aged 23 with a licence held for 3 years; the deposit and the CDW excess are 600 ₾, and drivers aged 23-25 pay a 15 ₾ per day young-driver surcharge."
  - q: "Is the Georgian Military Highway open in winter?"
    a: "The Tbilisi-Kazbegi highway stays open all year, but the Gudauri section closes periodically for avalanche risk, sometimes for hours and sometimes for a day. Do not plan a same-day return to Tbilisi in winter if a flight depends on it."
  - q: "Can I drive to Tusheti or over the Goderdzi Pass in winter?"
    a: "No. The Abano Pass to Tusheti is a June-to-September road in our data and roughly June to October in the FAQ; Goderdzi closes from about November to May. Both are rated off-road 4x4 even in summer."
  - q: "Is damage in snow covered by the insurance?"
    a: "CDW is included and caps your liability at the excess: 300 ₾ economy, 600 ₾ crossover, 1,000 ₾ business and minivan, 800 ₾ van, 1,200 ₾ off-road 4x4. Tyres, wheels, the underbody and the interior are never covered, and damage on unpaved roads is not covered unless the car is a 4x4."
  - q: "How many places can I actually visit in winter?"
    a: "161 of the 267 places we map are in season from December to March, and 147 of them are rated for an economy car. The 52 places flagged as not accessible year-round are mostly the alpine ones: 16 are above 2,000 m and 15 are 4x4-only roads."

ka:
  name: "ზამთრის მართვა საქართველოში: რა იკეტება, რა იხსნება, რომელი მანქანა"
  short: "267 ადგილიდან 161 ზამთარშიც სეზონშია, 52 კი მთელი წლის განმავლობაში მიუწვდომლადაა მონიშნული. უღელტეხილები, კურორტები, თითოეულისთვის საჭირო კატეგორია და რას ამბობს გაქირავების პირობები თოვლზე."
  meta_title: "ზამთრის მართვა საქართველოში: გზები და მანქანა | RentUp"
  meta_description: "რომელი უღელტეხილი იკეტება ზამთარში, რომელი კურორტი მუშაობს, რომელი კატეგორია სჭირდება და რას ამბობს პირობები ზამთრის საბურავებზე 1 დეკემბრიდან 1 აპრილამდე."
  body: |
    ## ზამთარი, დათვლილი

    ჩვენს ბაზაში 267-ივე ადგილს აქვს `best_season` ფანჯარა, `open_year_round` ნიშანი, სიმაღლე და
    მინიმალური კატეგორია. თუ ამას დეკემბრიდან მარტამდე დავითვლით, ნებისმიერ ფორუმზე სუფთა პასუხს
    მივიღებთ:

    - **161 ადგილი ზამთარშიც სეზონშია** — 159 მთელი წლის ფანჯრით და ორი, რომლის სეზონი *მხოლოდ*
      ზამთარია: [გუდაური](/attractions/gudauri/) და
      [ჰაწვალი და თეთნულდი](/attractions/hatsvali-tetnuldi/).
    - **106 ადგილს ზამთრის გამომრიცხავი ფანჯარა აქვს** — 69 მაისიდან ოქტომბრამდე, 36 ივნისიდან
      სექტემბრამდე და ერთი აპრილიდან ოქტომბრამდე.
    - **52 ადგილი მონიშნულია როგორც არა მთელი წლის განმავლობაში მისაწვდომი**; 215 — მისაწვდომია.

    ეს 161 ზამთრის ადგილი რთული არ არის. მათგან 147 [ეკონომ-კლასითაა](/car-rental/economy/)
    შეფასებული და 14 — [კროსოვერით](/car-rental/suv/); 128 ასფალტითაა პარკინგამდე, 32 — თითქმის
    მთლიანად ასფალტით. არცერთი არ დგას `4x4_only` გზაზე. 52 დაკეტილი ადგილი კი პირიქითაა: 21-ს
    [ჯიპი 4x4](/car-rental/4x4/) სჭირდება, 26-ს — კროსოვერი, და ქვეყნის 17 `4x4_only` გზიდან 15 სწორედ
    მათ შორისაა. 52-დან თექვსმეტი 2000 მეტრს ზემოთ დგას.

    ანუ ზამთრის წესი მარტივია: **ის საქართველო, სადაც ზამთარში მანქანით მიხვალთ, დაბალი
    საქართველოა.** 2000 მეტრს ზემოთ მდებარე 20 ადგილიდან ზამთრის სეზონი მხოლოდ ორს აქვს.

    ## უღელტეხილები

    | უღელტეხილი | სიმაღლე | სეზონი ჩვენს ბაზაში | გზა | მინიმალური კატეგორია |
    |---|---|---|---|---|
    | [აბანოს უღელტეხილი](/attractions/abano-pass/) (თუშეთი) | 2850 მ | ივნისი–სექტემბერი, ზამთარში დაკეტილია | `4x4_only` | ჯიპი 4x4 |
    | [გოდერძის უღელტეხილი](/attractions/goderdzi-pass/) | 2025 მ | ივნისი–სექტემბერი, ზამთარში დაკეტილია | `gravel` | ჯიპი 4x4 |
    | [ჯვრის უღელტეხილი](/attractions/jvari-pass-friendship-monument/) | 2380 მ | მთელი წელი | `paved` | ეკონომი |
    | [გომბორის უღელტეხილი](/attractions/gombori-pass/) | 1620 მ | მთელი წელი | `paved` | ეკონომი |
    | [ნაქერალას უღელტეხილი](/attractions/nakerala-pass/) | 1230 მ | მაისი–ოქტომბერი, მთელი წლის ნიშნით | `paved` | ეკონომი |

    აქედან ორს ოპტიმიზმი კი არა, გულწრფელობა სჭირდება. აბანოს უღელტეხილი თუშეთში ერთადერთი
    საავტომობილო გზაა; ჩვენი კითხვა-პასუხის მიხედვით ის დაახლოებით ივნისიდან ოქტომბრამდეა ღია,
    ითხოვს ჯიპ 4x4-ს, წინასწარ წერილობით შეთანხმებას და მასზე დამატებითი ფრანშიზა 500 ₾ მოქმედებს.
    გოდერძის უღელტეხილთან პატარა სათხილამურო კურორტია, მაგრამ უღელტეხილის გზა დაახლოებით ნოემბრიდან
    მაისამდე იკეტება, ჩვენს ბაზაში ივნისიდან სექტემბრამდეა მონიშნული და ზამთრის სამგზავრო
    მიმართულებად არ მიგვაჩნია. ჯვრის უღელტეხილი კი ქაღალდზე ღიაა და პრაქტიკაში იკეტება: სამხედრო
    გზის გუდაურის მონაკვეთი ზვავის საფრთხის გამო პერიოდულად იკეტება — ხან საათებით, ხან მთელი
    დღით, ორივე მიმართულებით. თავად თბილისი–ბათუმისა და თბილისი–ყაზბეგის მაგისტრალები მთელი წელი
    ღიაა.

    ## ზამთრის მიმართულებები და მანქანა, რომელსაც თითოეული ითხოვს

    | მიმართულება | სიმაღლე | თბილისიდან | გზა | კატეგორია ჩვენს ბაზაში |
    |---|---|---|---|---|
    | [გუდაური](/attractions/gudauri/) | 2200 მ | 120 კმ, 2:10 | `paved` | კროსოვერი / SUV |
    | [ბაკურიანი](/attractions/bakuriani/) | 1700 მ | 185 კმ, 2:50 | `paved` | კროსოვერი / SUV |
    | [ჰაწვალი და თეთნულდი](/attractions/hatsvali-tetnuldi/) | 1870 მ | 478 კმ, 8:50 | `mostly_paved` | კროსოვერი / SUV |
    | [მესტია](/attractions/mestia/), სვანეთის ბაზა | 1500 მ | 470 კმ, 8:30 | `paved` | კროსოვერი / SUV |

    ბაზაში ყველა ზამთრის კურორტი კროსოვერითაა შეფასებული და არა ეკონომით, და ეს გაყიდვის ხრიკი არ
    არის: ეს სიმაღლე, დახრილობა და გაუწმენდავი ბოლო აღმართია. [გაქირავების პირობების](/terms/)
    მიხედვით კროსოვერის კატეგორია ნიშნავს მინიმუმ 23 წელს და 3 წლის სტაჟს, 23–25 წლის მძღოლისთვის კი
    ახალგაზრდა მძღოლის დანამატს — 15 ₾ დღეში; დეპოზიტიც და CDW ფრანშიზაც ამ კატეგორიაზე 600 ₾-ია.

    ორი გაფრთხილება იმავე მონაცემებიდან. ჰაწვალი და თეთნულდი ერთადერთი ზამთრის სეზონის ჩანაწერია,
    რომელიც ამავდროულად არა მთელი წლის ნიშნითაა — სეზონი მოკლეა და მისასვლელი ნაწილობრივ უხეში.
    [უშგული](/attractions/ushguli/) კი, ზაფხულში მესტიიდან ორი საათის სავალზე, ივნისი–სექტემბრის,
    გრუნტიანი, მხოლოდ ჯიპის ადგილია, რომელიც ზამთარში ხშირად კვირაობით მოწყვეტილია — კითხვა-პასუხი
    მას მხოლოდ 4x4 კატეგორიით უშვებს და ზამთრის გეგმაში საერთოდ არ უნდა იდგეს.

    ## რას ამბობს გაქირავების პირობები ზამთარზე

    - **ზამთრის საბურავები ყველა ავტომობილს აქვს 1 დეკემბრიდან 1 აპრილამდე** და ეს ტარიფშია
      ჩართული. ეს აღჭურვილობაა და არა გამოსავალი: საბურავი სამუხრუჭე მანძილს ამოკლებს, ყინულს კი
      არაფერს უშვება. მთაში დისტანცია იმაზე ორჯერ მეტი დაიჭირეთ, ვიდრე ჩვეულებრივ იჭერთ.
    - **თოვლის ჯაჭვები — 20 ₾ ერთ გაქირავებაზე** დეკემბრიდან მარტამდე, 4x4 კატეგორიაზე უფასოდ;
      **სახურავის საბარგული — 25 ₾ დღეში**, მხოლოდ SUV-სა და 4x4-ზე.
    - **CDW და TPL ფასშია, ფრანშიზა კატეგორიის მიხედვით**: 300 ₾ ეკონომი, 600 ₾ კროსოვერი, 800 ₾
      კომერციული ფურგონი, 1000 ₾ ბიზნეს კლასი და მინივენი, 1200 ₾ ჯიპი 4x4. SCDW 25–45 ₾ დღეში
      ფრანშიზას ამცირებს; ჯიპ 4x4-ზე SCDW-ითაც 300 ₾ ფრანშიზა რჩება.
    - **საბურავები, დისკები, ქვედა ნაწილი, სარკეები და სალონი CDW-ით არ იფარება**; საბურავის შეცვლა
      120–400 ₾ ჯდება. გრუნტიან ან უასფალტო გზაზე მიღებული დაზიანება არ იფარება, თუ ავტომობილი 4x4
      კატეგორიის არ არის — და ზამთარში გაუწმენდავი ბილიკიც ასეთად ითვლება.
    - **საგზაო დახმარება 24/7 მუშაობს.** თუ მანქანა თქვენი ბრალის გარეშე ტექნიკურად გაჩერდა,
      სანაცვლო ავტომობილი 6 საათში უფასოდ მოგივათ. საგანგებო ნომერია 112.
    - **საახალწლო კვირას +10% სეზონური კოეფიციენტი მოქმედებს**, სააღდგომოსაც.

    ## გულწრფელი რჩევა ზამთრის გზისთვის

    1. **დაგეგმეთ რვა საათი სინათლე და არა თორმეტი.** დეკემბერში თბილისში მზე დაახლოებით 17:20-ზე
       ჩადის, ხეობაში — უფრო ადრე. მთის სერპანტინი, სიბნელე და შავი ყინული ერთად ისეთი კომბინაციაა,
       რომელსაც სტუმარ მძღოლს არასოდეს ვურჩევთ.
    2. **ყაზბეგის ერთდღიანი მარშრუტი საღამოს ფრენას არ დაუკავშიროთ.** თუ გუდაურის მონაკვეთი
       დაიკეტა, სანამ მის ჩრდილოეთით ხართ, ერთი დღით გვიან დაბრუნდებით. მთის დღე ისე ააგეთ, რომ
       ფრენამდე ერთი დღით ადრე უკვე სახლში იყოთ.
    3. **დაღმართზე დაბალი გადაცემით ჩადით და დისტანცია გააორმაგეთ.** ზამთრის საბურავი ფიზიკას არ
       აუქმებს.
    4. **ავზი ნახევრიდან შეავსეთ.** 1500 მეტრს ზემოთ სადგურები მცირდება, ხოლო გზის დაკეტვა შეიძლება
       რიგში ორსაათიან ლოდინად იქცეს.
    5. **ჯაჭვის დაყენება მშრალ პარკინგზე ისწავლეთ** და არა უღელტეხილზე -8 °C-ზე. გადაბარებისას
       გაჩვენებთ.
    6. **დაბალი მარშრუტები აირჩიეთ.** ჩვენი 49 მარშრუტიდან თოთხმეტს მთელი წლის სეზონი აქვს, მათ
       შორის [კახეთის ღვინის წრეს](/routes/kakheti-wine-loop/),
       [დასავლეთ საქართველოს გემოების გზას](/routes/western-georgia-food-road/),
       [ბორჯომის სპა-დღეს](/routes/borjomi-spa-day/) და
       [სამხედრო გზას ყაზბეგისკენ](/routes/military-highway-kazbegi/), რომელიც კროსოვერითა და
       საშუალო სირთულით ტყუილად არ არის შეფასებული.

    ბოლო რჩევა: თითოეული ადგილის სეზონი და გზის კლასი მის საკუთარ გვერდზეა — ჯავშნამდე ორივე
    გადაამოწმეთ და კატეგორია მარშრუტის ყველაზე რთული და არა ყველაზე მარტივი გზის მიხედვით აირჩიეთ.

    სეზონი გუდაურში ან ბაკურიანში გრძელი ყოფნაა და ტარიფი ვადასთან ერთად მცირდება: იხილეთ
    [თვიური გაქირავების](/car-rental/monthly/) გვერდი. მთელი რუკის თვე-თვე სურათისთვის წაიკითხეთ
    [როდის ჯობია ჩამოსვლა](/guides/best-time-to-visit-georgia/), ხოლო იმისთვის, რას უშვება საფარი
    თქვენს დღეს — [მართვა საქართველოში](/guides/driving-in-georgia/). შემდეგ კატეგორია
    [ავტომობილის გაქირავების](/car-rental/) გვერდზე აირჩიეთ, დანარჩენი კი, რასაც
    [კითხვა-პასუხი](/faq/) ღიად ტოვებს, გვკითხეთ.
  faq:
  - q: "ზამთრის საბურავები მჭირდება ნაქირავებ მანქანაზე?"
    a: "თქვენ არაფრის მოგვარება არ გიწევთ. ჩვენი ავტოპარკის ყველა ავტომობილი 1 დეკემბრიდან 1 აპრილამდე ზამთრის საბურავებზეა და ეს ტარიფშია ჩართული. თოვლის ჯაჭვები ცალკე სერვისია — 20 ₾ ერთ გაქირავებაზე, 4x4 კატეგორიაზე უფასოდ."
  - q: "რომელი მანქანა მჭირდება ზამთარში გუდაურში ან ბაკურიანში?"
    a: "ჩვენი ბაზა ორივე კურორტს კროსოვერით / SUV-ით აფასებს და არა ეკონომით. ამ კატეგორიას 23 წლის მძღოლი და 3 წლის სტაჟი სჭირდება; დეპოზიტი და CDW ფრანშიზა 600 ₾-ია, 23–25 წლის მძღოლი კი ახალგაზრდა მძღოლის დანამატს იხდის — 15 ₾ დღეში."
  - q: "სამხედრო გზა ზამთარში ღიაა?"
    a: "თბილისი–ყაზბეგის მაგისტრალი მთელი წელი ღიაა, მაგრამ გუდაურის მონაკვეთი ზვავის საფრთხის გამო პერიოდულად იკეტება — ხან საათებით, ხან მთელი დღით. ზამთარში თბილისში იმავე დღეს დაბრუნებას ნუ დაგეგმავთ, თუ ფრენა ამაზეა დამოკიდებული."
  - q: "შემიძლია ზამთარში თუშეთში ან გოდერძის უღელტეხილზე წასვლა?"
    a: "არა. აბანოს უღელტეხილი თუშეთისკენ ჩვენს ბაზაში ივნისი–სექტემბრის გზაა, კითხვა-პასუხში — დაახლოებით ივნისიდან ოქტომბრამდე; გოდერძი დაახლოებით ნოემბრიდან მაისამდე იკეტება. ორივე ზაფხულშიც ჯიპ 4x4-ითაა შეფასებული."
  - q: "თოვლში მიღებული დაზიანება დაზღვევით იფარება?"
    a: "CDW ფასშია და პასუხისმგებლობას ფრანშიზით ზღუდავს: 300 ₾ ეკონომი, 600 ₾ კროსოვერი, 1000 ₾ ბიზნესი და მინივენი, 800 ₾ ფურგონი, 1200 ₾ ჯიპი 4x4. საბურავები, დისკები, ქვედა ნაწილი და სალონი არასოდეს იფარება, უასფალტო გზაზე დაზიანება კი — მხოლოდ 4x4-ზე."
  - q: "რეალურად რამდენი ადგილის ნახვა შემიძლია ზამთარში?"
    a: "267 ადგილიდან 161 დეკემბრიდან მარტამდე სეზონშია და მათგან 147 ეკონომ-კლასითაა შეფასებული. 52 ადგილი, რომელიც არა მთელი წლის ნიშნითაა, ძირითადად ალპურია: 16 — 2000 მეტრს ზემოთ, 15 კი მხოლოდ ჯიპის გზაზე."

ru:
  name: "Вождение в Грузии зимой: что закрывается, что открыто, какая машина"
  short: "Из 267 мест на нашей карте 161 в сезоне и зимой, а 52 отмечены как недоступные круглый год. Перевалы, курорты, нужная для каждого категория и то, что условия аренды говорят о снеге."
  meta_title: "Зимнее вождение в Грузии: перевалы и машины | RentUp"
  meta_description: "Какие перевалы Грузии закрыты зимой, какие курорты открыты, какая машина нужна каждому и что условия аренды говорят о зимней резине с 1 декабря по 1 апреля."
  body: |
    ## Зима в цифрах

    У каждого из 267 мест в нашей базе есть окно `best_season`, флаг `open_year_round`, высота и
    минимальная категория автомобиля. Если пересчитать их для декабря-марта, ответ получается чище,
    чем в любом форуме:

    - **161 место в сезоне зимой** - 159 с круглогодичным окном и два, чей сезон *только* зима:
      [Гудаури](/attractions/gudauri/) и
      [горнолыжные зоны Хацвали и Тетнулди](/attractions/hatsvali-tetnuldi/).
    - **У 106 мест окно исключает зиму** - 69 с мая по октябрь, 36 с июня по сентябрь и одно с
      апреля по октябрь.
    - **52 места отмечены как недоступные круглый год**; 215 - доступны.

    Эти 161 зимнее место - не сложные. 147 из них рассчитаны на [эконом-класс](/car-rental/economy/),
    14 - на [кроссовер](/car-rental/suv/); 128 заасфальтированы до парковки, 32 - почти полностью.
    Ни одно не стоит на дороге `4x4_only`. 52 закрытых места - противоположность: 21 требует
    [внедорожник 4x4](/car-rental/4x4/), 26 - кроссовер, и 15 из 17 дорог `4x4_only` в стране -
    среди них. Шестнадцать из 52 лежат выше 2000 м.

    Так что зимнее правило простое: **Грузия, по которой можно ездить зимой, - это нижняя Грузия.**
    Из 20 мест выше 2000 м зимний сезон есть только у двух.

    ## Перевалы

    | Перевал | Высота | Сезон в нашей базе | Дорога | Минимальная категория |
    |---|---|---|---|---|
    | [Перевал Абано](/attractions/abano-pass/) (Тушетия) | 2850 м | июнь-сентябрь, зимой закрыт | `4x4_only` | Внедорожник 4x4 |
    | [Перевал Годердзи](/attractions/goderdzi-pass/) | 2025 м | июнь-сентябрь, зимой закрыт | `gravel` | Внедорожник 4x4 |
    | [Крестовый перевал](/attractions/jvari-pass-friendship-monument/) | 2380 м | круглый год | `paved` | Эконом |
    | [Перевал Гомбори](/attractions/gombori-pass/) | 1620 м | круглый год | `paved` | Эконом |
    | [Перевал Накерала](/attractions/nakerala-pass/) | 1230 м | май-октябрь, с флагом «круглый год» | `paved` | Эконом |

    Двум из них нужна честность, а не оптимизм. Перевал Абано - единственная автомобильная дорога в
    Тушетию; по нашим вопросам и ответам он открыт примерно с июня по октябрь, требует внедорожника
    4x4 и предварительного письменного согласования, а на маршруте действует дополнительная
    франшиза 500 ₾. У Годердзи есть небольшой горнолыжный курорт у седловины, но дорога через
    перевал закрыта примерно с ноября по май, в базе он отмечен июнем-сентябрём, и зимним
    направлением для автомобиля мы его не считаем. Крестовый перевал - тот, что открыт на бумаге и
    закрывается на практике: участок Военно-Грузинской дороги у Гудаури периодически перекрывают
    из-за лавинной опасности, иногда на часы, иногда на день, в обе стороны. Сами магистрали
    Тбилиси-Батуми и Тбилиси-Казбеги открыты круглый год.

    ## Зимние направления и машина, которую требует каждое

    | Направление | Высота | От Тбилиси | Дорога | Категория в нашей базе |
    |---|---|---|---|---|
    | [Гудаури](/attractions/gudauri/) | 2200 м | 120 км, 2:10 | `paved` | Кроссовер / SUV |
    | [Бакуриани](/attractions/bakuriani/) | 1700 м | 185 км, 2:50 | `paved` | Кроссовер / SUV |
    | [Хацвали и Тетнулди](/attractions/hatsvali-tetnuldi/) | 1870 м | 478 км, 8:50 | `mostly_paved` | Кроссовер / SUV |
    | [Местиа](/attractions/mestia/), база Сванетии | 1500 м | 470 км, 8:30 | `paved` | Кроссовер / SUV |

    Каждый зимний курорт в базе рассчитан на кроссовер, а не на эконом, и это не приём продаж: это
    высота, уклон и нечищеный финальный подъём. По [условиям аренды](/terms/) категория кроссовера
    означает минимум 23 года и стаж 3 года, а для водителя 23-25 лет - надбавку молодого водителя
    15 ₾ в сутки; депозит и франшиза CDW в этой категории - по 600 ₾.

    Два предостережения из тех же данных. Хацвали и Тетнулди - единственная запись с зимним сезоном,
    которая одновременно отмечена как не круглогодичная: сезон короткий, а подъезд частично разбит.
    А [Ушгули](/attractions/ushguli/), летом в двух часах от Местиа, - место с сезоном
    июнь-сентябрь, грунтовкой и категорией «только внедорожник», которое зимой неделями бывает
    отрезано; вопросы и ответы допускают его только в категории 4x4, и в зимнем плане его быть не
    должно вовсе.

    ## Что условия аренды говорят о зиме

    - **Зимняя резина стоит на каждой машине с 1 декабря по 1 апреля** и включена в тариф. Это
      оснащение, а не решение: она сокращает тормозной путь и ничего не делает со льдом.
    - **Цепи противоскольжения - 20 ₾ за аренду** с декабря по март, на категории 4x4 бесплатно;
      **багажник на крышу - 25 ₾ в сутки**, только SUV и 4x4.
    - **CDW и TPL включены, франшиза - по категории**: 300 ₾ эконом, 600 ₾ кроссовер, 800 ₾
      коммерческий фургон, 1000 ₾ бизнес-класс и минивэн, 1200 ₾ внедорожник 4x4. SCDW за
      25-45 ₾ в сутки снижает франшизу; на внедорожнике 4x4 даже с SCDW остаётся франшиза 300 ₾.
    - **Шины, диски, днище, зеркала и салон CDW не покрывает**; замена шины стоит 120-400 ₾.
      Повреждения на грунтовой или неасфальтированной дороге не покрываются, если машина не из
      категории 4x4, - а зимой нечищеная колея тоже считается.
    - **Помощь на дороге работает 24/7.** Если машину остановила техническая неисправность не по
      вашей вине, подменный автомобиль приедет в течение 6 часов бесплатно. Номер экстренной службы -
      112.
    - **На новогодней неделе действует сезонный коэффициент +10%**, как и на пасхальной.

    ## Честные советы для зимней дороги

    1. **Планируйте восемь часов света, а не двенадцать.** В декабре солнце в Тбилиси садится около
       17:20, в ущелье - раньше. Горные серпантины, темнота и гололёд вместе - сочетание, которое мы
       не рекомендуем ни одному приезжему водителю.
    2. **Не соединяйте однодневную поездку в Казбеги с вечерним рейсом.** Если участок у Гудаури
       закроют, пока вы севернее, вернётесь на день позже. Стройте горный отрезок так, чтобы быть
       дома за день до вылета.
    3. **Спускайтесь на пониженной передаче и удвойте дистанцию.** Зимняя резина не отменяет
       физику.
    4. **Заправляйтесь с половины бака.** Выше 1500 м заправки редеют, а перекрытие дороги может
       обернуться двумя часами в очереди.
    5. **Научитесь надевать цепи на сухой парковке**, а не при -8 °C на перевале. Покажем при выдаче.
    6. **Выбирайте низкие маршруты.** Четырнадцать из наших 49 маршрутов имеют круглогодичный сезон,
       среди них [винное кольцо Кахетии](/routes/kakheti-wine-loop/),
       [гастрономическая дорога Западной Грузии](/routes/western-georgia-food-road/),
       [спа-день в Боржоми](/routes/borjomi-spa-day/) и
       [Военно-Грузинская дорога до Казбеги](/routes/military-highway-kazbegi/), которая не зря
       оценена кроссовером и средней сложностью.

    Сезон в Гудаури или Бакуриани - это долгое пребывание, а тариф со сроком снижается: см. страницу
    [аренды на месяц](/car-rental/monthly/). Картина всей карты по месяцам - в гиде
    [когда лучше ехать в Грузию](/guides/best-time-to-visit-georgia/); что покрытие делает с вашим
    днём - в гиде [вождение в Грузии](/guides/driving-in-georgia/). Затем выберите категорию на
    странице [аренды автомобиля](/car-rental/), а всё, что оставляют открытым
    [вопросы и ответы](/faq/), спросите у нас.
  faq:
  - q: "Нужна ли зимняя резина на арендованной машине в Грузии?"
    a: "Организовывать её не нужно. Каждая машина нашего парка с 1 декабря по 1 апреля стоит на зимней резине, и это включено в тариф. Цепи - отдельная услуга за 20 ₾ за аренду, на категории 4x4 бесплатно."
  - q: "Какая машина нужна зимой в Гудаури или Бакуриани?"
    a: "Наша база оценивает оба курорта кроссовером / SUV, а не эконом-классом. Для этой категории нужен водитель от 23 лет со стажем 3 года; депозит и франшиза CDW - 600 ₾, а водители 23-25 лет платят надбавку молодого водителя 15 ₾ в сутки."
  - q: "Открыта ли Военно-Грузинская дорога зимой?"
    a: "Магистраль Тбилиси-Казбеги открыта круглый год, но участок у Гудаури периодически перекрывают из-за лавинной опасности - иногда на часы, иногда на день. Зимой не планируйте возвращение в Тбилиси в тот же день, если от этого зависит рейс."
  - q: "Можно ли зимой доехать до Тушетии или через перевал Годердзи?"
    a: "Нет. Перевал Абано в Тушетию - дорога с сезоном июнь-сентябрь в нашей базе и примерно июнь-октябрь по вопросам и ответам; Годердзи закрыт примерно с ноября по май. Оба даже летом оценены внедорожником 4x4."
  - q: "Покрывает ли страховка повреждения в снегу?"
    a: "CDW включён и ограничивает ответственность франшизой: 300 ₾ эконом, 600 ₾ кроссовер, 1000 ₾ бизнес и минивэн, 800 ₾ фургон, 1200 ₾ внедорожник 4x4. Шины, диски, днище и салон не покрываются никогда, а повреждения на неасфальтированной дороге - только на 4x4."
  - q: "Сколько мест реально можно увидеть зимой?"
    a: "161 из 267 мест на нашей карте в сезоне с декабря по март, и 147 из них рассчитаны на эконом-класс. 52 места с флагом «недоступно круглый год» - в основном альпийские: 16 выше 2000 м, 15 - на дорогах только для внедорожников."

fa:
  name: "رانندگی زمستانی در گرجستان: چه بسته می‌شود، چه باز است، کدام خودرو"
  short: "از 267 مکان نقشهٔ ما، 161 مورد در زمستان هم در فصل‌اند و 52 مورد به‌عنوان «نه در تمام سال» علامت خورده‌اند. گردنه‌ها، پیست‌ها، ردهٔ خودروی هر یک و آنچه شرایط اجاره دربارهٔ برف می‌گوید."
  meta_title: "رانندگی زمستانی در گرجستان: گردنه‌ها و خودرو | RentUp"
  meta_description: "کدام گردنه‌های گرجستان زمستان بسته‌اند، کدام پیست‌ها بازند، هر یک چه خودرویی می‌خواهد و شرایط اجاره دربارهٔ لاستیک زمستانی از 1 دسامبر تا 1 آوریل چه می‌گوید."
  body: |
    ## زمستان، شمرده‌شده

    هر یک از 267 مکان پایگاه دادهٔ ما یک بازهٔ `best_season`، یک نشان `open_year_round`، ارتفاع و
    حداقل ردهٔ خودرو دارد. شمردن آن‌ها برای دسامبر تا مارس پاسخی روشن‌تر از هر انجمنی می‌دهد:

    - **161 مکان در زمستان در فصل‌اند** - 159 مورد با بازهٔ تمام‌سال و دو مورد که فصلشان *فقط*
      زمستان است: [گودائوری](/attractions/gudauri/) و
      [پیست‌های هاتسوالی و تتنولدی](/attractions/hatsvali-tetnuldi/).
    - **106 مکان بازه‌ای دارند که زمستان را کنار می‌گذارد** - 69 مورد مه تا اکتبر، 36 مورد ژوئن تا
      سپتامبر و یک مورد آوریل تا اکتبر.
    - **52 مکان به‌عنوان «نه در تمام سال» علامت خورده‌اند**؛ 215 مکان در دسترس‌اند.

    این 161 مکان زمستانی دشوار نیستند: 147 مورد برای [خودروی اقتصادی](/car-rental/economy/) و 14
    مورد برای [کراس‌اوور](/car-rental/suv/) رتبه‌بندی شده‌اند و هیچ‌کدام روی جادهٔ `4x4_only` نیست.
    52 مکان بسته برعکس‌اند: 21 مورد [آفرود 4x4](/car-rental/4x4/) می‌خواهند و 15 جاده از 17 جادهٔ
    `4x4_only` کشور میان آن‌هاست. **گرجستانی که در زمستان می‌توان در آن راند، گرجستان پست است:** از
    20 مکان بالای 2,000 متر، فقط دو مورد فصل زمستانی دارند.

    ## گردنه‌ها

    | گردنه | ارتفاع | فصل در دادهٔ ما | جاده | حداقل رده |
    |---|---|---|---|---|
    | [گردنهٔ آبانو](/attractions/abano-pass/) (توشتی) | 2,850 متر | ژوئن تا سپتامبر، زمستان بسته | `4x4_only` | آفرود 4x4 |
    | [گردنهٔ گودردزی](/attractions/goderdzi-pass/) | 2,025 متر | ژوئن تا سپتامبر، زمستان بسته | `gravel` | آفرود 4x4 |
    | [گردنهٔ جواری](/attractions/jvari-pass-friendship-monument/) | 2,380 متر | تمام سال | `paved` | اقتصادی |
    | [گردنهٔ گومبوری](/attractions/gombori-pass/) | 1,620 متر | تمام سال | `paved` | اقتصادی |

    گردنهٔ آبانو تنها جادهٔ خودرویی توشتی است؛ پرسش و پاسخ ما آن را تقریباً از ژوئن تا اکتبر باز
    می‌داند و به آفرود 4x4، توافق کتبی پیشین و فرانشیز اضافی 500 ₾ نیاز دارد. نزدیک گودردزی پیست
    کوچکی هست، اما جادهٔ گردنه تقریباً از نوامبر تا مه بسته است و ما آن را مقصد رانندگی زمستانی
    نمی‌دانیم. گردنهٔ جواری روی کاغذ باز است و در عمل بسته می‌شود: بخش گودائوری جادهٔ نظامی به دلیل
    خطر بهمن هرازگاهی، گاه چند ساعت و گاه یک روز، در هر دو جهت بسته می‌شود. خود بزرگراه‌های
    تفلیس-باتومی و تفلیس-کازبگی تمام سال بازند.

    ## مقصدهای زمستانی و خودرویی که هر یک می‌خواهد

    | مقصد | ارتفاع | از تفلیس | جاده | رده در دادهٔ ما |
    |---|---|---|---|---|
    | [گودائوری](/attractions/gudauri/) | 2,200 متر | 120 کیلومتر، 2:10 | `paved` | کراس‌اوور / شاسی‌بلند |
    | [باکوریانی](/attractions/bakuriani/) | 1,700 متر | 185 کیلومتر، 2:50 | `paved` | کراس‌اوور / شاسی‌بلند |
    | [هاتسوالی و تتنولدی](/attractions/hatsvali-tetnuldi/) | 1,870 متر | 478 کیلومتر، 8:50 | `mostly_paved` | کراس‌اوور / شاسی‌بلند |
    | [مستیا](/attractions/mestia/)، پایگاه سوانتی | 1,500 متر | 470 کیلومتر، 8:30 | `paved` | کراس‌اوور / شاسی‌بلند |

    همهٔ پیست‌های زمستانی در پایگاه داده کراس‌اوور رتبه گرفته‌اند نه اقتصادی، و این ترفند فروش
    نیست: ارتفاع، شیب و صعود پایانی برف‌روبی‌نشده است. طبق [شرایط اجاره](/terms/)، ردهٔ کراس‌اوور
    یعنی حداقل 23 سال سن و 3 سال سابقهٔ گواهی‌نامه، با هزینهٔ رانندهٔ جوان 15 ₾ در روز برای سن 23
    تا 25؛ ودیعه و فرانشیز CDW در این رده هر دو 600 ₾ است. [اوشگولی](/attractions/ushguli/)، دو ساعت
    پس از مستیا در تابستان، مکانی ژوئن تا سپتامبر، شنی و فقط آفرود است که در زمستان اغلب هفته‌ها
    قطع می‌شود و نباید در برنامهٔ زمستانی باشد.

    ## شرایط اجاره دربارهٔ زمستان چه می‌گوید

    - **لاستیک زمستانی از 1 دسامبر تا 1 آوریل روی همهٔ خودروهاست** و در نرخ گنجانده شده است. این
      تجهیزات است، نه راه‌حل: مسافت ترمز را کوتاه می‌کند و با یخ کاری ندارد.
    - **زنجیر چرخ 20 ₾ برای هر اجاره** از دسامبر تا مارس و در ردهٔ 4x4 رایگان؛ **باربند سقف 25 ₾
      در روز**، فقط شاسی‌بلند و 4x4.
    - **CDW و TPL شامل قیمت‌اند، با فرانشیز بر پایهٔ رده**: 300 ₾ اقتصادی، 600 ₾ کراس‌اوور، 800 ₾
      ون باری، 1,000 ₾ بیزنس و مینی‌ون، 1,200 ₾ آفرود 4x4. SCDW با 25 تا 45 ₾ در روز فرانشیز را
      کم می‌کند؛ روی آفرود 4x4 حتی با SCDW فرانشیز 300 ₾ می‌ماند.
    - **لاستیک، رینگ، کف خودرو، آینه و کابین زیر پوشش CDW نیستند**؛ تعویض لاستیک 120 تا 400 ₾.
      خسارت در جادهٔ شنی یا خاکی پوشش ندارد مگر خودرو از ردهٔ 4x4 باشد - و در زمستان مسیر
      برف‌روبی‌نشده هم همین حکم را دارد.
    - **امداد جاده‌ای 24/7 فعال است**؛ در نقص فنی بدون تقصیر شما، خودروی جایگزین ظرف 6 ساعت
      رایگان می‌رسد. شمارهٔ اضطراری 112 است. **هفتهٔ سال نو ضریب فصلی 10 درصد دارد.**

    ## توصیهٔ صادقانه برای رانندگی زمستانی

    1. **برای هشت ساعت روشنایی برنامه بریزید، نه دوازده.** در دسامبر خورشید در تفلیس حدود 17:20
       غروب می‌کند.
    2. **سفر یک‌روزهٔ کازبگی را با پرواز شبانه جفت نکنید.** اگر بخش گودائوری بسته شود، یک روز
       دیرتر برمی‌گردید.
    3. **با دندهٔ سنگین پایین بیایید و فاصله را دو برابر کنید.**
    4. **از نیمهٔ باک سوخت بگیرید.** بالای 1,500 متر پمپ‌ها کم می‌شوند.
    5. **بستن زنجیر را در پارکینگ خشک یاد بگیرید**، نه روی گردنه. هنگام تحویل نشانتان می‌دهیم.
    6. **مسیرهای پست را انتخاب کنید.** چهارده مسیر از 49 مسیر ما فصل تمام‌سال دارند، از جمله
       [حلقهٔ شراب کاختی](/routes/kakheti-wine-loop/)،
       [جادهٔ غذای غرب گرجستان](/routes/western-georgia-food-road/)،
       [روز اسپای بورجومی](/routes/borjomi-spa-day/) و
       [جادهٔ نظامی تا کازبگی](/routes/military-highway-kazbegi/).

    یک فصل در گودائوری یا باکوریانی اقامتی بلند است و نرخ با مدت پایین می‌آید: صفحهٔ
    [اجارهٔ ماهانه](/car-rental/monthly/) را ببینید. تصویر ماه به ماه کل نقشه در
    [بهترین زمان سفر](/guides/best-time-to-visit-georgia/) است. سپس رده را در
    [اجارهٔ خودرو](/car-rental/) انتخاب کنید و هر چه [پرسش و پاسخ](/faq/) باز می‌گذارد از ما
    بپرسید.
  faq:
  - q: "آیا برای خودروی اجاره‌ای در گرجستان لاستیک زمستانی لازم است؟"
    a: "لازم نیست خودتان تهیه کنید. همهٔ خودروهای ناوگان ما از 1 دسامبر تا 1 آوریل لاستیک زمستانی دارند و این در نرخ گنجانده شده است. زنجیر چرخ خدمتی جداگانه است: 20 ₾ برای هر اجاره، در ردهٔ 4x4 رایگان."
  - q: "برای گودائوری یا باکوریانی در زمستان چه خودرویی لازم است؟"
    a: "دادهٔ ما هر دو پیست را کراس‌اوور / شاسی‌بلند رتبه می‌دهد نه اقتصادی. این رده رانندهٔ 23 ساله با 3 سال سابقه می‌خواهد؛ ودیعه و فرانشیز CDW هر دو 600 ₾ است و رانندگان 23 تا 25 سال روزانه 15 ₾ هزینهٔ رانندهٔ جوان می‌پردازند."
  - q: "آیا جادهٔ نظامی گرجستان در زمستان باز است؟"
    a: "بزرگراه تفلیس-کازبگی تمام سال باز است، اما بخش گودائوری به دلیل خطر بهمن هرازگاهی بسته می‌شود، گاه چند ساعت و گاه یک روز. در زمستان اگر پروازی در میان است، بازگشت همان‌روز به تفلیس را برنامه‌ریزی نکنید."
  - q: "آیا در زمستان می‌توان به توشتی یا از گردنهٔ گودردزی رفت؟"
    a: "خیر. گردنهٔ آبانو به توشتی در دادهٔ ما جاده‌ای ژوئن تا سپتامبر است و در پرسش و پاسخ تقریباً ژوئن تا اکتبر؛ گودردزی تقریباً از نوامبر تا مه بسته است. هر دو حتی در تابستان آفرود 4x4 رتبه گرفته‌اند."
  - q: "آیا خسارت در برف زیر پوشش بیمه است؟"
    a: "CDW شامل قیمت است و مسئولیت شما را تا فرانشیز محدود می‌کند: 300 ₾ اقتصادی، 600 ₾ کراس‌اوور، 1,000 ₾ بیزنس و مینی‌ون، 800 ₾ ون، 1,200 ₾ آفرود 4x4. لاستیک، رینگ، کف خودرو و کابین هرگز پوشش ندارند و خسارت در جادهٔ خاکی فقط با 4x4 پوشش دارد."
  - q: "در زمستان واقعاً چند مکان را می‌توان دید؟"
    a: "161 مکان از 267 مکان نقشهٔ ما از دسامبر تا مارس در فصل‌اند و 147 مورد از آن‌ها برای خودروی اقتصادی رتبه گرفته‌اند. 52 مکان «نه در تمام سال» بیشتر کوهستانی‌اند: 16 مورد بالای 2,000 متر و 15 مورد روی جادهٔ فقط 4x4."

he:
  name: "נהיגה בחורף בגאורגיה: מה נסגר, מה פתוח, איזה רכב"
  short: "מתוך 267 המקומות במפה שלנו, 161 בעונה גם בחורף ו-52 מסומנים כלא נגישים כל השנה. המעברים, אתרי הסקי, הרכב שכל אחד דורש, ומה תנאי ההשכרה אומרים על שלג."
  meta_title: "נהיגה בחורף בגאורגיה: מעברים, אתרי סקי, רכב | RentUp"
  meta_description: "אילו מעברים בגאורגיה נסגרים בחורף, אילו אתרי סקי פתוחים, איזו קטגוריית רכב כל אחד דורש, ומה תנאי ההשכרה אומרים על צמיגי חורף מ-1 בדצמבר עד 1 באפריל."
  body: |
    ## חורף במספרים

    לכל אחד מ-267 המקומות במאגר שלנו יש חלון `best_season`, דגל `open_year_round`, גובה וקטגוריית
    רכב מינימלית. ספירה שלהם לדצמבר-מרץ נותנת תשובה נקייה יותר מכל פורום:

    - **161 מקומות בעונה בחורף** - 159 עם חלון של כל השנה ושניים שעונתם היא *רק* חורף:
      [גודאורי](/attractions/gudauri/) ו[אתרי הסקי הצוואלי וטטנולדי](/attractions/hatsvali-tetnuldi/).
    - **ל-106 מקומות חלון שמוציא את החורף** - 69 מאי-אוקטובר, 36 יוני-ספטמבר ואחד אפריל-אוקטובר.
    - **52 מקומות מסומנים כלא נגישים כל השנה**; 215 נגישים.

    161 מקומות החורף אינם הקשים. 147 מהם מדורגים ל[רכב אקונומי](/car-rental/economy/) ו-14
    ל[קרוסאובר](/car-rental/suv/); 128 סלולים עד החניון ו-32 סלולים ברובם. אף אחד אינו על דרך
    `4x4_only`. 52 המקומות הסגורים הם ההפך: 21 דורשים [רכב שטח 4x4](/car-rental/4x4/), 26 קרוסאובר,
    ו-15 מתוך 17 דרכי ה-`4x4_only` במדינה נמצאות ביניהם. שישה-עשר מתוך ה-52 נמצאים מעל 2,000 מ'.

    כלל החורף פשוט: **הגאורגיה שאפשר לנהוג בה בחורף היא הגאורגיה הנמוכה.** מתוך 20 המקומות מעל
    2,000 מ', רק לשניים יש עונת חורף.

    ## המעברים

    | מעבר | גובה | עונה במאגר שלנו | דרך | רכב מינימלי |
    |---|---|---|---|---|
    | [מעבר אבאנו](/attractions/abano-pass/) (טושתי) | 2,850 מ' | יוני-ספטמבר, סגור בחורף | `4x4_only` | רכב שטח 4x4 |
    | [מעבר גודרדזי](/attractions/goderdzi-pass/) | 2,025 מ' | יוני-ספטמבר, סגור בחורף | `gravel` | רכב שטח 4x4 |
    | [מעבר ג׳ווארי](/attractions/jvari-pass-friendship-monument/) | 2,380 מ' | כל השנה | `paved` | אקונומי |
    | [מעבר גומבורי](/attractions/gombori-pass/) | 1,620 מ' | כל השנה | `paved` | אקונומי |

    מעבר אבאנו הוא דרך הרכב היחידה לטושתי; לפי השאלות והתשובות שלנו הוא פתוח בערך מיוני עד
    אוקטובר, מחייב רכב שטח 4x4 וסיכום מראש בכתב, וחלה בו השתתפות עצמית נוספת של 500 ₾. ליד
    גודרדזי יש אתר סקי קטן, אבל הדרך על המעבר סגורה בערך מנובמבר עד מאי, ואיננו רואים בו יעד
    נהיגה חורפי. מעבר ג׳ווארי פתוח על הנייר ונסגר בפועל: קטע גודאורי של דרך הצבא הגאורגית נסגר
    מדי פעם בגלל סכנת מפולות שלגים, לפעמים לשעות ולפעמים ליום, בשני הכיוונים. הכבישים הראשיים
    טביליסי-בטומי וטביליסי-קזבגי עצמם פתוחים כל השנה.

    ## יעדי החורף והרכב שכל אחד דורש

    | יעד | גובה | מטביליסי | דרך | קטגוריה במאגר שלנו |
    |---|---|---|---|---|
    | [גודאורי](/attractions/gudauri/) | 2,200 מ' | 120 ק"מ, 2:10 | `paved` | קרוסאובר / רכב שטח עירוני |
    | [בקוריאני](/attractions/bakuriani/) | 1,700 מ' | 185 ק"מ, 2:50 | `paved` | קרוסאובר / רכב שטח עירוני |
    | [הצוואלי וטטנולדי](/attractions/hatsvali-tetnuldi/) | 1,870 מ' | 478 ק"מ, 8:50 | `mostly_paved` | קרוסאובר / רכב שטח עירוני |
    | [מסטיה](/attractions/mestia/), הבסיס של סוואנטי | 1,500 מ' | 470 ק"מ, 8:30 | `paved` | קרוסאובר / רכב שטח עירוני |

    כל אתר חורף במאגר מדורג קרוסאובר, לא אקונומי, וזה אינו טריק מכירה: זה גובה, שיפוע ועלייה
    אחרונה שלא פונתה משלג. לפי [תנאי ההשכרה](/terms/) קטגוריית הקרוסאובר פירושה גיל 23 לפחות
    ורישיון בוותק 3 שנים, עם תוספת נהג צעיר של 15 ₾ ליום בגילאי 23 עד 25; הפיקדון וההשתתפות
    העצמית ב-CDW בקטגוריה זו הם 600 ₾ כל אחד. [אושגולי](/attractions/ushguli/), שעתיים אחרי מסטיה
    בקיץ, הוא מקום של יוני-ספטמבר, דרך חצץ ורכב שטח בלבד, שבחורף מנותק לעיתים קרובות לשבועות - אין
    לו מקום בתוכנית חורפית.

    ## מה תנאי ההשכרה אומרים על חורף

    - **צמיגי חורף על כל רכב מ-1 בדצמבר עד 1 באפריל**, כלולים בתעריף. זה ציוד, לא פתרון: הם
      מקצרים מרחק בלימה ולא עושים דבר לקרח.
    - **שרשראות שלג - 20 ₾ להשכרה** מדצמבר עד מרץ, חינם בקטגוריית 4x4; **גגון - 25 ₾ ליום**,
      רכב שטח עירוני ו-4x4 בלבד.
    - **CDW ו-TPL כלולים, עם השתתפות עצמית לפי קטגוריה**: 300 ₾ אקונומי, 600 ₾ קרוסאובר, 800 ₾ ואן
      מסחרי, 1,000 ₾ מחלקת עסקים ומיניוואן, 1,200 ₾ רכב שטח 4x4. SCDW ב-25 עד 45 ₾ ליום מקטין את
      ההשתתפות העצמית; ברכב שטח 4x4 נשארת השתתפות עצמית של 300 ₾ גם עם SCDW.
    - **צמיגים, חישוקים, תחתית הרכב, מראות ותא הנוסעים אינם מכוסים** ב-CDW; החלפת צמיג עולה 120
      עד 400 ₾. נזק בדרכי חצץ או בדרכים לא סלולות אינו מכוסה אלא אם הרכב בקטגוריית 4x4 - ובחורף גם
      דרך שלא פונתה משלג נחשבת כזו.
    - **שירות דרך פועל 24/7.** אם תקלה טכנית שאינה באשמתכם עוצרת את הרכב, רכב חלופי מגיע בתוך 6
      שעות ללא תשלום. מספר החירום הוא 112.
    - **בשבוע השנה החדשה חל מקדם עונתי של 10%**, וכך גם בשבוע הפסחא.

    ## עצות כנות לנסיעה חורפית

    1. **תכננו לפי שמונה שעות אור, לא שתים-עשרה.** בדצמבר השמש שוקעת בטביליסי בסביבות 17:20, ובעמק
       מוקדם יותר.
    2. **אל תצמידו טיול יום לקזבגי לטיסת ערב.** אם קטע גודאורי נסגר כשאתם צפונית לו, תחזרו יום
       מאוחר יותר.
    3. **רדו בהילוך נמוך והכפילו את מרחק העקיבה.**
    4. **תדלקו מחצי מיכל.** מעל 1,500 מ' התחנות מתדלדלות.
    5. **למדו להרכיב שרשראות בחניון יבש**, לא במינוס 8 מעלות על המעבר. נראה לכם במסירה.
    6. **בחרו במסלולים הנמוכים.** לארבעה-עשר מתוך 49 המסלולים שלנו עונה של כל השנה, ביניהם
       [מעגל היין של קאחטי](/routes/kakheti-wine-loop/),
       [דרך האוכל של מערב גאורגיה](/routes/western-georgia-food-road/),
       [יום ספא בבורז׳ומי](/routes/borjomi-spa-day/) ו[דרך הצבא לקזבגי](/routes/military-highway-kazbegi/).

    עונה בגודאורי או בבקוריאני היא שהייה ארוכה, והתעריף יורד עם האורך: ראו את עמוד
    [ההשכרה החודשית](/car-rental/monthly/). התמונה החודשית של כל המפה נמצאת במדריך
    [מתי כדאי לבקר](/guides/best-time-to-visit-georgia/). אחר כך בחרו קטגוריה ב[השכרת רכב](/car-rental/),
    ושאלו אותנו כל מה ש[השאלות והתשובות](/faq/) משאירות פתוח.
  faq:
  - q: "צריך צמיגי חורף ברכב שכור בגאורגיה?"
    a: "אין צורך לארגן אותם. כל רכב בצי שלנו מצויד בצמיגי חורף מ-1 בדצמבר עד 1 באפריל, וזה כלול בתעריף. שרשראות שלג הן תוספת נפרדת ב-20 ₾ להשכרה, חינם בקטגוריית 4x4."
  - q: "איזה רכב צריך לגודאורי או לבקוריאני בחורף?"
    a: "המאגר שלנו מדרג את שני האתרים קרוסאובר / רכב שטח עירוני, לא אקונומי. הקטגוריה דורשת נהג בן 23 עם רישיון בוותק 3 שנים; הפיקדון וההשתתפות העצמית ב-CDW הם 600 ₾, ונהגים בגילאי 23 עד 25 משלמים תוספת נהג צעיר של 15 ₾ ליום."
  - q: "האם דרך הצבא הגאורגית פתוחה בחורף?"
    a: "הכביש טביליסי-קזבגי פתוח כל השנה, אבל קטע גודאורי נסגר מדי פעם בגלל סכנת מפולות שלגים, לפעמים לשעות ולפעמים ליום. בחורף אל תתכננו חזרה לטביליסי באותו יום אם טיסה תלויה בכך."
  - q: "אפשר לנסוע לטושתי או דרך מעבר גודרדזי בחורף?"
    a: "לא. מעבר אבאנו לטושתי הוא דרך של יוני-ספטמבר במאגר שלנו ובערך יוני-אוקטובר לפי השאלות והתשובות; גודרדזי סגור בערך מנובמבר עד מאי. שניהם מדורגים רכב שטח 4x4 גם בקיץ."
  - q: "האם נזק בשלג מכוסה בביטוח?"
    a: "CDW כלול ומגביל את אחריותכם להשתתפות העצמית: 300 ₾ אקונומי, 600 ₾ קרוסאובר, 1,000 ₾ עסקים ומיניוואן, 800 ₾ ואן, 1,200 ₾ רכב שטח 4x4. צמיגים, חישוקים, תחתית הרכב ותא הנוסעים לעולם אינם מכוסים, ונזק בדרך לא סלולה מכוסה רק ברכב 4x4."
  - q: "כמה מקומות אפשר באמת לבקר בחורף?"
    a: "161 מתוך 267 המקומות במפה שלנו בעונה מדצמבר עד מרץ, ו-147 מהם מדורגים לרכב אקונומי. 52 המקומות המסומנים כלא נגישים כל השנה הם בעיקר אלפיניים: 16 מעל 2,000 מ' ו-15 על דרכי 4x4 בלבד."

ar:
  name: "القيادة شتاءً في جورجيا: ما يُغلق، ما يفتح، وأي سيارة"
  short: "من 267 مكاناً على خريطتنا، 161 في موسمها شتاءً و52 مُعلّمة بأنها غير متاحة طوال السنة. الممرات والمنتجعات وفئة السيارة لكل منها، وما تقوله شروط الإيجار عن الثلج."
  meta_title: "القيادة شتاءً في جورجيا: الممرات والسيارات | RentUp"
  meta_description: "أي ممرات جورجيا تُغلق شتاءً، وأي منتجعات تزلج تبقى مفتوحة، وأي فئة سيارة يحتاجها كل منها، وما تقوله شروط الإيجار عن الإطارات الشتوية من 1 ديسمبر إلى 1 أبريل."
  body: |
    ## الشتاء بالأرقام

    لكل مكان من الأماكن الـ267 في قاعدة بياناتنا نافذة `best_season` وعلامة `open_year_round`
    وارتفاع وفئة سيارة دنيا. وعدّها لفترة ديسمبر-مارس يعطي جواباً أوضح من أي منتدى:

    - **161 مكاناً في موسمها شتاءً** - 159 بنافذة طوال السنة واثنان موسمهما الشتاء *فقط*:
      [غوداوري](/attractions/gudauri/) و[منطقتا التزلج هاتسفالي وتيتنولدي](/attractions/hatsvali-tetnuldi/).
    - **106 أماكن نافذتها تستثني الشتاء** - 69 من مايو إلى أكتوبر، و36 من يونيو إلى سبتمبر،
      وواحد من أبريل إلى أكتوبر.
    - **52 مكاناً مُعلّم بأنه غير متاح طوال السنة**؛ و215 متاحة.

    الأماكن الشتوية الـ161 ليست الصعبة: 147 منها مصنّفة لـ[سيارة اقتصادية](/car-rental/economy/)
    و14 لـ[كروس أوفر](/car-rental/suv/)؛ و128 معبّدة حتى الموقف و32 معبّدة في معظمها. ولا واحد
    منها على طريق `4x4_only`. أما الأماكن الـ52 المغلقة فعكس ذلك: 21 تحتاج
    [سيارة وعرة 4x4](/car-rental/4x4/)، و26 كروس أوفر، و15 من طرق `4x4_only` الـ17 في البلاد
    بينها. وستة عشر من الـ52 فوق 2,000 متر.

    فقاعدة الشتاء بسيطة: **جورجيا التي يمكن قيادتها شتاءً هي جورجيا المنخفضة.** من 20 مكاناً فوق
    2,000 متر، لاثنين فقط موسم شتوي.

    ## الممرات

    | الممر | الارتفاع | الموسم في بياناتنا | الطريق | الفئة الدنيا |
    |---|---|---|---|---|
    | [ممر أبانو](/attractions/abano-pass/) (توشيتي) | 2,850 م | يونيو-سبتمبر، مغلق شتاءً | `4x4_only` | وعرة 4x4 |
    | [ممر غودردزي](/attractions/goderdzi-pass/) | 2,025 م | يونيو-سبتمبر، مغلق شتاءً | `gravel` | وعرة 4x4 |
    | [ممر جواري](/attractions/jvari-pass-friendship-monument/) | 2,380 م | طوال السنة | `paved` | اقتصادية |
    | [ممر غومبوري](/attractions/gombori-pass/) | 1,620 م | طوال السنة | `paved` | اقتصادية |

    ممر أبانو هو طريق السيارات الوحيد إلى توشيتي؛ أسئلتنا الشائعة تعدّه مفتوحاً من يونيو إلى
    أكتوبر تقريباً، ويحتاج سيارة وعرة 4x4 وموافقة خطية مسبقة، ويطبَّق عليه تحمّل إضافي قدره
    500 ₾. قرب غودردزي منتجع تزلج صغير، لكن طريق الممر يُغلق من نوفمبر إلى مايو تقريباً، ولا نعدّه
    وجهة قيادة شتوية. أما ممر جواري فمفتوح على الورق ويُغلق عملياً: مقطع غوداوري من الطريق
    العسكري الجورجي يُغلق دورياً بسبب خطر الانهيارات الثلجية، لساعات أحياناً وليوم كامل أحياناً،
    في الاتجاهين. وطريقا تبليسي-باتومي وتبليسي-كازبيغي نفسهما مفتوحان طوال السنة.

    ## الوجهات الشتوية والسيارة التي تحتاجها كل منها

    | الوجهة | الارتفاع | من تبليسي | الطريق | الفئة في بياناتنا |
    |---|---|---|---|---|
    | [غوداوري](/attractions/gudauri/) | 2,200 م | 120 كم، 2:10 | `paved` | كروس أوفر / دفع رباعي |
    | [باكورياني](/attractions/bakuriani/) | 1,700 م | 185 كم، 2:50 | `paved` | كروس أوفر / دفع رباعي |
    | [هاتسفالي وتيتنولدي](/attractions/hatsvali-tetnuldi/) | 1,870 م | 478 كم، 8:50 | `mostly_paved` | كروس أوفر / دفع رباعي |
    | [ميستيا](/attractions/mestia/)، قاعدة سفانيتي | 1,500 م | 470 كم، 8:30 | `paved` | كروس أوفر / دفع رباعي |

    كل منتجع شتوي في القاعدة مصنّف كروس أوفر لا اقتصادية، وليس هذا أسلوب بيع: إنه الارتفاع
    والانحدار وصعود أخير لم يُجرف ثلجه. بحسب [شروط الإيجار](/terms/) تعني فئة الكروس أوفر حداً أدنى
    للعمر 23 سنة ورخصة بخبرة 3 سنوات، مع رسم سائق شاب 15 ₾ يومياً بين 23 و25 سنة؛ والوديعة ومبلغ
    تحمّل CDW في هذه الفئة 600 ₾ لكل منهما. و[أوشغولي](/attractions/ushguli/)، على بعد ساعتين من
    ميستيا صيفاً، مكان موسمه يونيو-سبتمبر بطريق حصوي للسيارات الوعرة فقط، وكثيراً ما ينقطع شتاءً
    لأسابيع - فلا مكان له في خطة شتوية.

    ## ما تقوله شروط الإيجار عن الشتاء

    - **الإطارات الشتوية على كل سيارة من 1 ديسمبر إلى 1 أبريل**، مشمولة في التعرفة. هذه معدات لا
      حل: تقصّر مسافة الكبح ولا تفعل شيئاً للجليد.
    - **سلاسل الثلج 20 ₾ لكل إيجار** من ديسمبر إلى مارس، ومجانية في فئة 4x4؛ **حامل السقف 25 ₾
      يومياً**، للدفع الرباعي و4x4 فقط.
    - **CDW وTPL مشمولان، مع تحمّل بحسب الفئة**: 300 ₾ اقتصادية، 600 ₾ كروس أوفر، 800 ₾ فان
      تجاري، 1,000 ₾ رجال أعمال وميني فان، 1,200 ₾ وعرة 4x4. وSCDW بسعر 25 إلى 45 ₾ يومياً يخفّض
      التحمّل؛ وفي السيارة الوعرة 4x4 يبقى تحمّل 300 ₾ حتى مع SCDW.
    - **الإطارات والجنوط وأسفل الهيكل والمرايا والمقصورة غير مشمولة** بـCDW؛ واستبدال الإطار
      يكلّف 120 إلى 400 ₾. والأضرار على الطرق الحصوية أو غير المعبّدة غير مشمولة ما لم تكن السيارة
      من فئة 4x4 - وفي الشتاء يُعدّ المسار غير المجروف كذلك.
    - **المساعدة على الطريق تعمل 24/7.** إذا أوقف السيارةَ عطلٌ فني ليس من فعلك، تصلك سيارة بديلة
      خلال 6 ساعات دون رسوم. ورقم الطوارئ 112.
    - **في أسبوع رأس السنة يُطبّق معامل موسمي 10%**، وكذلك في أسبوع عيد الفصح.

    ## نصيحة صادقة لقيادة شتوية

    1. **خطّط على ثماني ساعات من الضوء لا اثنتي عشرة.** في ديسمبر تغرب الشمس في تبليسي نحو
       17:20، وفي الوادي أبكر.
    2. **لا تقرن رحلة يوم إلى كازبيغي برحلة طيران مسائية.** إن أُغلق مقطع غوداوري وأنت شماله،
       تعود بعد يوم.
    3. **انزل بغيار منخفض وضاعف مسافة الأمان.**
    4. **تزوّد بالوقود من نصف الخزان.** فوق 1,500 متر تقلّ المحطات.
    5. **تعلّم تركيب السلاسل في موقف جاف**، لا عند 8 درجات تحت الصفر على الممر. نريك ذلك عند
       التسليم.
    6. **اختر المسارات المنخفضة.** أربعة عشر من مساراتنا الـ49 موسمها طوال السنة، منها
       [حلقة نبيذ كاخيتي](/routes/kakheti-wine-loop/)،
       و[طريق الطعام في غرب جورجيا](/routes/western-georgia-food-road/)،
       و[يوم السبا في بورجومي](/routes/borjomi-spa-day/)،
       و[الطريق العسكري إلى كازبيغي](/routes/military-highway-kazbegi/).

    موسم في غوداوري أو باكورياني إقامة طويلة، والتعرفة تنخفض مع المدة: راجع صفحة
    [الإيجار الشهري](/car-rental/monthly/). والصورة الشهرية للخريطة كلها في دليل
    [أفضل وقت للزيارة](/guides/best-time-to-visit-georgia/). ثم اختر الفئة في
    [تأجير السيارات](/car-rental/)، واسألنا عن كل ما تتركه [الأسئلة الشائعة](/faq/) مفتوحاً.
  faq:
  - q: "هل أحتاج إطارات شتوية على سيارة مستأجرة في جورجيا؟"
    a: "لا حاجة لترتيبها. كل سيارة في أسطولنا على إطارات شتوية من 1 ديسمبر إلى 1 أبريل، وهذا مشمول في التعرفة. أما سلاسل الثلج فإضافة منفصلة بـ20 ₾ لكل إيجار، مجانية في فئة 4x4."
  - q: "أي سيارة أحتاج لغوداوري أو باكورياني شتاءً؟"
    a: "بياناتنا تصنّف المنتجعين كروس أوفر / دفع رباعي لا اقتصادية. تحتاج هذه الفئة سائقاً عمره 23 سنة برخصة خبرتها 3 سنوات؛ والوديعة وتحمّل CDW 600 ₾، ويدفع السائقون بين 23 و25 سنة رسم سائق شاب 15 ₾ يومياً."
  - q: "هل الطريق العسكري الجورجي مفتوح شتاءً؟"
    a: "طريق تبليسي-كازبيغي مفتوح طوال السنة، لكن مقطع غوداوري يُغلق دورياً بسبب خطر الانهيارات الثلجية، لساعات أحياناً وليوم أحياناً. لا تخطط شتاءً لعودة في اليوم نفسه إلى تبليسي إن كانت رحلة طيران تعتمد عليها."
  - q: "هل يمكن الذهاب إلى توشيتي أو عبر ممر غودردزي شتاءً؟"
    a: "لا. ممر أبانو إلى توشيتي طريق موسمه يونيو-سبتمبر في بياناتنا ويونيو-أكتوبر تقريباً في الأسئلة الشائعة؛ وغودردزي مغلق من نوفمبر إلى مايو تقريباً. وكلاهما مصنّف وعرة 4x4 حتى صيفاً."
  - q: "هل الأضرار في الثلج مشمولة بالتأمين؟"
    a: "CDW مشمول ويحدّ مسؤوليتك عند التحمّل: 300 ₾ اقتصادية، 600 ₾ كروس أوفر، 1,000 ₾ رجال أعمال وميني فان، 800 ₾ فان، 1,200 ₾ وعرة 4x4. الإطارات والجنوط وأسفل الهيكل والمقصورة غير مشمولة أبداً، والأضرار على طريق غير معبّد لا تُغطّى إلا في سيارة 4x4."
  - q: "كم مكاناً يمكنني زيارته فعلاً شتاءً؟"
    a: "161 من 267 مكاناً على خريطتنا في موسمها من ديسمبر إلى مارس، و147 منها مصنّفة لسيارة اقتصادية. والأماكن الـ52 المُعلّمة بأنها غير متاحة طوال السنة جبلية في معظمها: 16 فوق 2,000 متر و15 على طرق 4x4 فقط."
