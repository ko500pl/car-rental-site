ka:
  name: 'საქართველო 10 დღეში: იმერეთის მღვიმეებიდან გურიის სანაპირომდე'
  short: ათი დღე ქუთაისის მღვიმეებიდან და კანიონებიდან სამეგრელოს ჭაობებში გავლით გურიის შავი ქვიშის სანაპირომდე.
  body: |-
    ეს ათდღიანი მარშრუტი აერთიანებს სამ მარშრუტს დასავლეთიდან აღმოსავლეთისკენ სანაპიროზე: იმერეთის მღვიმეები და კანიონები, შემდეგ სამეგრელოს მდინარეთა სამეფოები და ჭაობები, შემდეგ გურიის სანაპირო — სამი რეგიონი, დადასტურებული როგორც მეზობელი ღირსშესანიშნაობათა კოორდინატებით, თითოეული მთავრდება შემდეგის დაწყების ადგილიდან 40 კმ-ის ფარგლებში.

    1-3 დღეები იკვლევს იმერეთს ქუთაისის ბაზიდან: უფლისციხის კლდეში ნაკვეთი ქალაქი გზად, ბაგრატის ტაძარი ძველ ქალაქზე მაღლა, მოწამეთისა და გელათის მონასტრები, საათაფლიის დინოზავრის ნაკვალევი და მინის პლატფორმა, პრომეთეს მღვიმის მიწისქვეშა ნავით სეირნობა, და — მოხრეშილ გზაზე, მოგზაურობის ყველაზე უხეშ ზედაპირზე — ოქაცის კანიონის კლდის კიდით სიარული და ქინჩხის ჩანჩქერი.

    4-7 დღეები გადადის სამეგრელოში ზუგდიდის ბაზიდან: ნოკალაკევის გამაგრებული ნანგრევები და საიდუმლო გვირაბი, დადიანების ოჯახის საზაფხულო მამული სალხინოში, მარტვილის ფირუზისფერი ხეობა, დადიანების სასახლე თავად ზუგდიდში ნაპოლეონის ნიღაბით, და შემდეგ კოლხეთის ეროვნული პარკის სანაპირო ჭაობებამდე და ფოთის პორტამდე.

    8-10 დღეები სრულდება გურიის სანაპიროზე: ოზურგეთი და ნოდარ დუმბაძის სახლ-მუზეუმი, 1896 წელს დაარსებული სამების ჯიხეთის მონასტერი, მინერალური წყლის სოფელი ნაბეღლავი, შეკვეთილის გადმორგული საუკუნოვანი ხეები, და მაგნიტური შავი ქვიშის სანაპირო ურეკში.
  tips:
  - car_category მთელი მოგზაურობისთვის suv-ია — განპირობებული ქინჩხის ჩანჩქერისკენ მოხრეშილი მისასვლელი გზით მე-3 დღეს, ათი დღიდან ერთადერთი არა-ასფალტირებული მონაკვეთი.
  - 'სეზონურობა მაისი-ოქტომბერია: ყველაზე მკაცრ შეზღუდვას იძლევა იმერეთის ოქაცე/ქინჩხის დღე და გურიის სანაპირო დღეები, ორივე შეფასებული მაისი-ოქტომბრად და არა მთელი წლისთვის.'
  - 1 და 3 დღეები (245 კმ და 305 კმ) შეიცავს იმერეთის სავალის უმეტესობას — მე-2 დღე, გელათი/პრომეთე/საათაფლიის წრე, მსუბუქი 90 კმ-იანი დღეა ქუთაისის გარშემო.
  - 4 და 7 დღეები (თითოეული 160 კმ) სამეგრელოს ნაწილს აჩარჩოებს; 5-6 დღეები ზუგდიდის შიგნით მოკლეა (80 კმ) ადგილობრივი წრეები მარტვილამდე და დადიანების სასახლემდე.
  - ოცი განსხვავებული გაჩერება ათი დღის განმავლობაში ამ მარშრუტთაგან ყველაზე მეტია — დაგეგმეთ ის, როგორც სამი ცალკეული 3-4-დღიანი მონაკვეთი, ერთი უწყვეტი სავალის ნაცვლად.
en:
  name: 'Georgia in 10 Days: Imereti Caves to the Guria Coast'
  short: Ten days from Kutaisi's caves and canyons through the wetlands of Samegrelo to the black-sand beaches of the Guria coast.
  body: |-
    This ten-day itinerary chains three routes west to east along the coast: Imereti's caves and canyons, then Samegrelo's river kingdoms and wetlands, then Guria's coast — three regions confirmed adjacent by the attraction coordinates, each ending within 40 km of where the next begins.

    Days 1-3 explore Imereti from a Kutaisi base: Uplistsikhe's rock-cut city on the way in, Bagrati Cathedral over the old town, Motsameta and Gelati monasteries, Sataplia's dinosaur footprints and glass platform, Prometheus Cave's underground boat ride, and — on gravel road, the trip's roughest surface — Okatse Canyon's cliffside walkway and the Kinchkha waterfall.

    Days 4-7 move into Samegrelo from a Zugdidi base: Nokalakevi's fortified ruins and secret tunnel, the Dadiani family's Salkhino summer estate, the turquoise gorge of Martvili Canyon, the Dadiani Palace in Zugdidi itself with its Napoleon death mask, and on to Kolkheti National Park's coastal wetlands and the port of Poti.

    Days 8-10 finish on the Guria coast: Ozurgeti and the Nodar Dumbadze house museum, the 1896 Sameba Jikheti convent, the mineral-water village of Nabeghlavi, Shekvetili's transplanted century-old trees, and the black magnetic-sand beach at Ureki.
  tips:
  - car_category is suv for the whole trip — driven by the gravel access road to Kinchkha waterfall on day 3, the one non-paved leg of the ten days.
  - 'best_season is May-October: the tightest constraint comes from Imereti''s Okatse/Kinchkha day and the Guria beach days, both rated may-october rather than year-round.'
  - Days 1 and 3 (245 km and 305 km) carry most of Imereti's driving — day 2, the Gelati/Prometheus/Sataplia loop, is a light 90 km day around Kutaisi.
  - Days 4 and 7 (160 km each) bookend the Samegrelo section; days 5-6 inside Zugdidi are short (80 km) local loops to Martvili and the Dadiani Palace.
  - Twenty distinct stops across ten days is the most of any itinerary here — pace it as three separate 3-4 day legs rather than one continuous drive.
ru:
  name: 'Грузия за 10 дней: от пещер Имерети до побережья Гурии'
  short: Десять дней от пещер и каньонов Кутаиси через болота Самегрело до пляжей с чёрным песком на побережье Гурии.
  body: |-
    Этот десятидневный маршрут соединяет три маршрута с запада на восток вдоль побережья: пещеры и каньоны Имерети, затем речные царства и болота Самегрело, затем побережье Гурии — три региона, подтверждённо соседних по координатам достопримечательностей, каждый заканчивается не далее 40 км от начала следующего.

    Дни 1-3 исследуют Имерети из базы в Кутаиси: высеченный в скале город Уплисцихе по дороге, собор Баграта над старым городом, монастыри Моцамета и Гелати, следы динозавров и стеклянная платформа Сатаплиа, подземная лодочная прогулка в пещере Прометея и — по гравийной дороге, самому грубому покрытию в поездке — тропа над каньоном Окаце и водопад Кинчха.

    Дни 4-7 переходят в Самегрело из базы в Зугдиди: укреплённые руины Нокалакеви и секретный тоннель, летняя усадьба рода Дадиани в Салхино, бирюзовое ущелье Мартвильского каньона, дворец Дадиани в самом Зугдиди с посмертной маской Наполеона, а затем прибрежные болота Колхидского национального парка и порт Поти.

    Дни 8-10 завершаются на побережье Гурии: Озургети и дом-музей Нодара Думбадзе, монастырь Самеба Джихети 1896 года, село минеральной воды Набеглави, пересаженные вековые деревья Шекветили и пляж с чёрным магнитным песком в Уреки.
  tips:
  - car_category для всей поездки — suv, из-за гравийной дороги к водопаду Кинчха на 3-й день — единственного не асфальтированного участка за десять дней.
  - 'Сезонность — май-октябрь: самое жёсткое ограничение задают день Окаце/Кинчха в Имерети и пляжные дни Гурии, оба отмечены как май-октябрь, а не круглый год.'
  - На дни 1 и 3 (245 км и 305 км) приходится большая часть вождения по Имерети — день 2, петля Гелати/Прометей/Сатаплиа, лёгкий день на 90 км вокруг Кутаиси.
  - Дни 4 и 7 (по 160 км) обрамляют часть по Самегрело; дни 5-6 внутри Зугдиди короткие (80 км) местные петли к Мартвили и дворцу Дадиани.
  - Двадцать разных точек за десять дней — больше всего среди маршрутов здесь; планируйте это как три отдельных отрезка по 3-4 дня, а не один непрерывный переезд.
fa:
  name: 'گرجستان در ۱۰ روز: از غارهای ایمرتی تا ساحل گوریا'
  short: ده روز از غارها و دره‌های کوتایسی از میان تالاب‌های سامگرلو تا سواحل شنی سیاه گوریا.
  body: |-
    این مسیر ده‌روزه سه مسیر را از غرب به شرق در امتداد ساحل به هم متصل می‌کند: غارها و دره‌های ایمرتی، سپس پادشاهی‌های رودخانه‌ای و تالاب‌های سامگرلو، سپس ساحل گوریا — سه منطقه که با مختصات جاذبه‌ها همسایگی‌شان تأیید شده، هرکدام در فاصله کمتر از ۴۰ کیلومتری آغاز بعدی به پایان می‌رسد.

    روزهای ۱ تا ۳ ایمرتی را از پایگاه کوتایسی کاوش می‌کند: شهر کنده‌شده در صخره اوپلیستسیخه در مسیر، کلیسای جامع باگراتی بالای شهر قدیم، صومعه‌های موتسامتا و گلاتی، ردپای دایناسور و سکوی شیشه‌ای ساتاپلیا، قایق‌سواری زیرزمینی غار پرومته‌اووس، و — روی جاده شنی، ناهموارترین سطح سفر — پیاده‌روی کنار صخره دره اوکاتسه و آبشار کینچخا.

    روزهای ۴ تا ۷ به سامگرلو از پایگاه زوگدیدی می‌رود: ویرانه‌های مستحکم نوکالاکوی و تونل مخفی آن، ملک تابستانی خانواده دادیانی در سالخینو، دره فیروزه‌ای مارتویلی، کاخ دادیانی در خود زوگدیدی با نقاب مرگ ناپلئون، و سپس تالاب‌های ساحلی پارک ملی کولختی و بندر پوتی.

    روزهای ۸ تا ۱۰ در ساحل گوریا به پایان می‌رسد: اوزورگتی و موزه خانه نودار دومبادزه، صومعه سامبا جیختی که در سال ۱۸۹۶ تأسیس شد، روستای آب معدنی نابگلاوی، درختان صدساله منتقل‌شده شکوتیلی، و ساحل شنی سیاه مغناطیسی در اورکی.
  tips:
  - دسته خودرو برای کل سفر شاسی‌بلند (suv) است — به دلیل جاده شنی دسترسی به آبشار کینچخا در روز سوم، تنها بخش غیرآسفالته از ده روز.
  - 'فصل مناسب مه تا اکتبر است: سخت‌ترین محدودیت از روز اوکاتسه/کینچخا در ایمرتی و روزهای ساحلی گوریا می‌آید که هر دو مه-اکتبر رتبه‌بندی شده‌اند نه تمام سال.'
  - روزهای ۱ و ۳ (۲۴۵ و ۳۰۵ کیلومتر) بیشتر رانندگی ایمرتی را دربر دارند — روز ۲، حلقه گلاتی/پرومته‌اووس/ساتاپلیا، روزی سبک با ۹۰ کیلومتر در اطراف کوتایسی است.
  - روزهای ۴ و ۷ (هرکدام ۱۶۰ کیلومتر) بخش سامگرلو را احاطه می‌کنند؛ روزهای ۵ تا ۶ درون زوگدیدی حلقه‌های محلی کوتاهی (۸۰ کیلومتر) به مارتویلی و کاخ دادیانی هستند.
  - بیست توقف‌گاه متمایز در ده روز، بیشترین در میان مسیرهای اینجاست — آن را به‌عنوان سه بخش جداگانه ۳ تا ۴ روزه برنامه‌ریزی کنید، نه یک رانندگی پیوسته.
he:
  name: 'גאורגיה ב-10 ימים: ממערות אימרתי לחוף גוריה'
  short: עשרה ימים ממערות ומקניונים בכותאיסי דרך ביצות סמגרלו ועד לחופי החול השחור של גוריה.
  body: |-
    מסלול עשרת הימים הזה משרשר שלושה מסלולים ממערב למזרח לאורך החוף: המערות והקניונים של אימרתי, ואז ממלכות הנהר והביצות של סמגרלו, ואז חוף גוריה — שלושה אזורים שאושרו כשכנים לפי קואורדינטות האתרים, כל אחד מסתיים במרחק של פחות מ-40 ק"מ מתחילת הבא.

    ימים 1-3 חוקרים את אימרתי מבסיס בכותאיסי: העיר החצובה בסלע אופליסציחה בדרך, קתדרלת בגראטי מעל העיר העתיקה, מנזרי מוצמטה וגלאתי, עקבות הדינוזאורים והפלטפורמה הזכוכית בסטפליה, שיט הסירה התת-קרקעי במערת פרומתאוס, ו-על כביש חצץ, המשטח המחוספס ביותר בטיול-השביל על שפת קניון אוקאצה ומפל קינצ'חה.

    ימים 4-7 עוברים לסמגרלו מבסיס בזוגדידי: החורבות המבוצרות של נוקלקוי והמנהרה הסודית שלה, אחוזת הקיץ סלחינו של משפחת דדיאני, קניון מרטוילי הטורקיז, ארמון דדיאני בזוגדידי עצמה עם מסכת המוות של נפוליאון, ומשם לביצות החוף של פארק קולחתי הלאומי ולנמל פוטי.

    ימים 8-10 מסתיימים בחוף גוריה: אוזורגתי ובית-המוזיאון של נודר דומבדזה, מנזר סמבה ג'יחתי משנת 1896, כפר המים המינרליים נבגלאווי, העצים בני מאות השנים שהושתלו בשקוויטילי, וחוף החול השחור המגנטי באורקי.
  tips:
  - קטגוריית הרכב לכל הטיול היא SUV — עקב כביש החצץ המוביל למפל קינצ'חה ביום 3, המקטע הלא-סלול היחיד מבין עשרת הימים.
  - 'העונה המומלצת היא מאי-אוקטובר: המגבלה המחמירה ביותר מגיעה מיום אוקאצה/קינצ''חה באימרתי ומימי החוף בגוריה, שניהם מדורגים מאי-אוקטובר ולא כל השנה.'
  - ימים 1 ו-3 (245 ק"מ ו-305 ק"מ) כוללים את רוב הנהיגה באימרתי — יום 2, מעגל גלאתי/פרומתאוס/סטפליה, הוא יום קל של 90 ק"מ סביב כותאיסי.
  - ימים 4 ו-7 (160 ק"מ כל אחד) תוחמים את קטע סמגרלו; ימים 5-6 בתוך זוגדידי הם מעגלים מקומיים קצרים (80 ק"מ) אל מרטוילי וארמון דדיאני.
  - עשרים תחנות שונות לאורך עשרה ימים - הכי הרבה מבין המסלולים כאן - תכננו זאת כשלושה קטעים נפרדים בני 3-4 ימים ולא כנסיעה רציפה אחת.
ar:
  name: 'جورجيا في ١٠ أيام: من مغاور إيميريتي إلى ساحل غوريا'
  short: عشرة أيام من مغاور ووديان كوتايسي عبر أهوار ساميغريلو إلى شواطئ الرمال السوداء في غوريا.
  body: |-
    يربط هذا المسار العشري ثلاثة مسارات من الغرب إلى الشرق على طول الساحل: مغاور ووديان إيميريتي، ثم ممالك الأنهار وأهوار ساميغريلو، ثم ساحل غوريا — ثلاث مناطق مؤكد تجاورها بإحداثيات المعالم، تنتهي كل منها في نطاق ٤٠ كم من بداية التالية.

    تستكشف الأيام ١-٣ إيميريتي من قاعدة في كوتايسي: مدينة أوبليستسيخه المنحوتة في الصخر في الطريق، كاتدرائية باغراتي فوق البلدة القديمة، ديرا موتساميتا وغيلاتي، آثار أقدام الديناصورات والمنصة الزجاجية في ساتابليا، جولة القارب تحت الأرض في مغارة بروميثيوس، و- على طريق حصوي، أخشن سطح في الرحلة - ممر حافة وادي أوكاتسه وشلال كينتشخا.

    تنتقل الأيام ٤-٧ إلى ساميغريلو من قاعدة في زوغديدي: أطلال نوكالاكيفي المحصنة ونفقها السري، ضيعة سالخينو الصيفية لعائلة دادياني، وادي مارتفيلي الفيروزي، قصر دادياني في زوغديدي نفسها بقناع موت نابليون، ثم أهوار حديقة كولخيتي الوطنية الساحلية وميناء بوتي.

    تنتهي الأيام ٨-١٠ على ساحل غوريا: أوزورغتي ومتحف بيت نودار دومبادزه، دير سامبا جيخيتي المؤسس عام ١٨٩٦، قرية المياه المعدنية نابغلافي، أشجار شكفيتيلي المعمرة المنقولة، وشاطئ الرمال السوداء المغناطيسية في أوريكي.
  tips:
  - فئة السيارة لكامل الرحلة هي دفع رباعي (suv) — بسبب طريق الحصى المؤدي إلى شلال كينتشخا في اليوم الثالث، المقطع الوحيد غير المعبد من بين الأيام العشرة.
  - 'الموسم المناسب هو مايو-أكتوبر: يأتي القيد الأكثر صرامة من يوم أوكاتسه/كينتشخا في إيميريتي وأيام شاطئ غوريا، وكلاهما مصنف مايو-أكتوبر وليس طوال السنة.'
  - يحمل اليومان ١ و٣ (٢٤٥ و٣٠٥ كم) معظم قيادة إيميريتي — اليوم ٢، حلقة غيلاتي/بروميثيوس/ساتابليا، يوم خفيف بمسافة ٩٠ كم حول كوتايسي.
  - يؤطر اليومان ٤ و٧ (١٦٠ كم لكل منهما) قسم ساميغريلو؛ الأيام ٥-٦ داخل زوغديدي حلقات محلية قصيرة (٨٠ كم) إلى مارتفيلي وقصر دادياني.
  - عشرون محطة متمايزة عبر عشرة أيام — الأكثر بين مسارات هذا الموقع — خططوا لها كثلاثة أقسام منفصلة من ٣-٤ أيام بدلاً من قيادة متواصلة واحدة.
