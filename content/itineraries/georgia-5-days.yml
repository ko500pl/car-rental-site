ka:
  name: 'საქართველო 5 დღეში: რაჭის მაღალმთიანეთი'
  short: ხუთი დღე ზემო რაჭის მთებში — მთის წყალსაცავიდან შოვისა და გლოლას უკანასკნელ სოფლებამდე.
  body: |-
    ეს მარშრუტი მთლიანად ხუთივე დღეს ატარებს ერთ რეგიონში, რაჭა-ლეჩხუმში, და თანდათან მაღლდება: პირველი დღის წყალსაცავი და ტაძარი ძირითადად ასფალტირებულ გზაზეა, მაგრამ მე-4 დღის ბილიკი მხოლოდ 4x4-ისთვისაა შეფასებული, და მთელი მარშრუტი მხოლოდ ივნისიდან სექტემბრამდე მუშაობს.

    პირველი დღე ადის შაორის წყალსაცავამდე — ფიჭვნარით შემოსილი მთის ტბა დაახლოებით 1,130 მეტრზე — შემდეგ ნიკორწმინდის ტაძრამდე, მე-11 საუკუნის ეკლესია, ცნობილი ქვის ჩუქურთმითა და ფრესკებით.

    მეორე დღე გრძელდება ონამდე, ზემო რაჭის მთავარ ქალაქამდე რიონზე, 830 მეტრზე — ჯერ კიდევ ნახევრად აღდგენილი 1991 წლის მიწისძვრის შემდეგ — და შემდეგ შოვის კურორტამდე, მთის ბაზა ჭანჭახის ხეობაში.

    მესამე დღე დასვენებისა და აკლიმატიზაციის დღეა შოვში, სავალის გარეშე, სანამ მე-4 დღეს უძირო ტბასა და ბუბას მყინვართან ბილიკზე გახვალთ — რაჭის უკანასკნელ სოფელთან, საზაფხულოდ მხოლოდ 4x4-ით მისაღწევს.

    მეხუთე დღე მთავრდება გლოლაში, ზემო რაჭის უკანასკნელ დიდ სოფელში, სადაც გზა შოვისკენ და ღების მიმართულებით იყოფა.
  tips:
  - ამ მარშრუტისთვის car_category არის suv, მაგრამ მე-4 დღის მონაკვეთი უძირო ტბამდე offroad/მხოლოდ-4x4-ადაა შეფასებული — თუ თქვენს SUV-ს რეალური გამავლობა არ აქვს, მარტო ნუ სცდით.
  - სეზონურობა მხოლოდ ივნისი–სექტემბერია; უძირო/ბუბას ბილიკი მონაცემებში „მხოლოდ ზაფხულია" აღნიშნული, თავად შოვიც სეზონურია.
  - მე-3 დღე აკლიმატიზაციის დღედაა აგებული, სავალის გარეშე — გამოიყენეთ დასასვენებლად ყველაზე მაღალმთიან მონაკვეთამდე.
  - მონაცემების მიხედვით შოვი „ნაწილობრივ აღდგენილია 2023 წლის კატასტროფის შემდეგ" — ბაზად გამოყენებამდე შეამოწმეთ არსებული წვდომა.
  - ორივე ყველაზე გრძელი სავალი დღე (1 და 2) კვირის 13-საათიანი სავალი დროის დაახლოებით მესამედს შეადგენს თითოეული — მოგზაურობის მეორე ნახევარი უფრო მსუბუქია.
en:
  name: 'Georgia in 5 Days: Racha Highlands'
  short: Five days into Upper Racha's mountains, from a highland reservoir to the last-village trailheads of Shovi and Glola.
  body: |-
    This itinerary spends the whole five days inside one region, Racha-Lechkhumi, and climbs steadily: the reservoir and cathedral on day one are on mostly-paved road, but the trailhead on day four is rated 4x4-only, and the whole route only runs June to September.

    Day one drives up to Shaori Reservoir, a pine-fringed highland lake at about 1,130 metres, then to Nikortsminda Cathedral, an 11th-century church known for its stone carving and frescoes.

    Day two continues to Oni, Upper Racha's main town on the Rioni at 830 metres — still only half-rebuilt since the 1991 earthquake — and on to Shovi Resort, a high mountain base in the Chanchakhi valley.

    Day three is a rest and acclimatisation day at Shovi with no further driving, ahead of day four's push to the Udziro Lake and Buba Glacier trailhead, the last village in Racha and reachable only by 4x4 in summer.

    Day five finishes at Glola, Upper Racha's last large village, where the road splits toward Shovi and toward Ghebi.
  tips:
  - car_category for this itinerary is suv, but the day-4 leg to Udziro Lake is rated offroad/4x4-only — don't attempt it in a touring SUV that lacks real ground clearance.
  - 'best_season is June–September only: the Udziro/Buba trailhead is marked ''summer only'' in the source data, and Shovi itself is seasonal.'
  - Day 3 is built as an acclimatisation day with no driving — use it to rest before the highest-altitude leg.
  - Shovi is recorded as 'partly rebuilt after the 2023 disaster' — check current access before relying on it as a base.
  - The two longest driving days (1 and 2) each carry about a third of the trip's 13 hours of total driving — the back half is lighter.
ru:
  name: 'Грузия за 5 дней: высокогорье Рачи'
  short: Пять дней в горах Верхней Рачи — от горного водохранилища до последних сёл-трейлхедов Шови и Глола.
  body: |-
    Этот маршрут целиком проходит по одному региону, Рача-Лечхуми, и постепенно поднимается выше: водохранилище и собор первого дня — на в основном асфальтированной дороге, но участок к трейлхеду на 4-й день имеет категорию только для полного привода, а весь маршрут работает лишь с июня по сентябрь.

    Первый день — подъём к Шаорскому водохранилищу, горному озеру среди сосен на высоте около 1 130 метров, а затем к Никорцминдскому собору XI века, известному каменной резьбой и фресками.

    Второй день продолжается до Они, главного города Верхней Рачи на Риони на высоте 830 метров — до сих пор наполовину не восстановленного после землетрясения 1991 года — а затем до курорта Шови, горной базы в долине Чанчахи.

    Третий день — день отдыха и акклиматизации в Шови без дальнейшего вождения, перед броском четвёртого дня к трейлхеду озера Удзиро и ледника Буба, последнего села Рачи, куда летом можно добраться только на полном приводе.

    Пятый день завершается в Глола, последнем крупном селе Верхней Рачи, где дорога расходится в сторону Шови и в сторону Геби.
  tips:
  - car_category маршрута — suv, но участок 4-го дня к озеру Удзиро отмечен как offroad/только 4x4 — не пытайтесь проехать его на обычном SUV без реального клиренса.
  - Сезон — только июнь–сентябрь; трейлхед Удзиро/Буба в данных отмечен как «только лето», сам Шови также сезонный.
  - 3-й день специально сделан днём акклиматизации без вождения — используйте его для отдыха перед самым высокогорным участком.
  - По данным сайта, Шови «частично восстановлен после катастрофы 2023 года» — проверьте текущий доступ, прежде чем полагаться на него как на базу.
  - На два самых длинных дня вождения (1-й и 2-й) приходится примерно по трети из 13 часов общего времени поездки — вторая половина легче.
fa:
  name: 'گرجستان در ۵ روز: ارتفاعات راچا'
  short: پنج روز در کوهستان‌های راچای علیا، از یک دریاچه مرتفع تا آخرین روستاهای شوی و گلولا.
  body: |-
    این مسیر تمام پنج روز را در یک منطقه، راچا-لچخومی، سپری می‌کند و به‌تدریج ارتفاع می‌گیرد: دریاچه و کلیسای جامع روز اول روی جاده‌ای عمدتاً آسفالته‌اند، اما مسیر روز چهارم فقط برای ۴×۴ رتبه‌بندی شده و کل مسیر تنها از ژوئن تا سپتامبر فعال است.

    روز اول به سمت دریاچه شائوری بالا می‌رود، دریاچه‌ای مرتفع و کاج‌پوش در ارتفاع حدود ۱۱۳۰ متری، سپس به کلیسای جامع نیکورتسمینده، بنایی از سده یازدهم که به کنده‌کاری سنگی و نقاشی‌های دیواری‌اش شهرت دارد.

    روز دوم به سمت اونی ادامه می‌یابد، شهر اصلی راچای علیا در کنار رودخانه ریونی در ارتفاع ۸۳۰ متری — که هنوز نیمی از آن پس از زلزله سال ۱۹۹۱ بازسازی نشده — و سپس به استراحتگاه شوی، پایگاهی کوهستانی در دره چانچاخی.

    روز سوم روز استراحت و سازگاری با ارتفاع در شوی است، بدون رانندگی بیشتر، پیش از حرکت روز چهارم به سمت مسیر دریاچه اودزیرو و یخچال طبیعی بوبا، آخرین روستای راچا که در تابستان فقط با ۴×۴ قابل دسترسی است.

    روز پنجم در گلولا به پایان می‌رسد، آخرین روستای بزرگ راچای علیا، جایی که جاده به سمت شوی و به سمت گبی از هم جدا می‌شود.
  tips:
  - دسته خودروی این مسیر suv است، اما مسیر روز چهارم به دریاچه اودزیرو آفرود/فقط ۴×۴ رتبه‌بندی شده — بدون فاصله واقعی از زمین به‌تنهایی وارد آن نشوید.
  - فصل مناسب فقط ژوئن تا سپتامبر است؛ مسیر اودزیرو/بوبا در داده‌ها «فقط تابستان» ثبت شده و خود شوی نیز فصلی است.
  - روز سوم به‌عنوان روز سازگاری با ارتفاع بدون رانندگی طراحی شده — از آن برای استراحت پیش از مرتفع‌ترین بخش مسیر استفاده کنید.
  - طبق داده‌های سایت، شوی «پس از حادثه سال ۲۰۲۳ تا حدی بازسازی شده» — پیش از تکیه بر آن به‌عنوان پایگاه، دسترسی فعلی را بررسی کنید.
  - دو روز طولانی‌ترین رانندگی (اول و دوم) هرکدام تقریباً یک‌سوم از ۱۳ ساعت کل رانندگی سفر را در بر می‌گیرند — نیمه دوم سفر سبک‌تر است.
he:
  name: 'גאורגיה ב-5 ימים: רמות ראצ''ה'
  short: חמישה ימים בהרי ראצ'ה העילית, מאגם הררי ועד כפרי הקצה שובי וגלולה.
  body: |-
    מסלול זה נשאר כל חמשת הימים באזור אחד, ראצ'ה-לצ'חומי, ועולה בהדרגה: המאגר והקתדרלה ביום הראשון נמצאים על כביש סלול ברובו, אך המקטע ביום הרביעי מדורג כ'רק 4x4', והמסלול כולו פעיל רק מיוני עד ספטמבר.

    היום הראשון עולה למאגר שאורי, אגם הררי מוקף אורנים בגובה כ-1,130 מטרים, ולאחר מכן לקתדרלת ניקורצמינדה מהמאה ה-11, הידועה בפיסולי האבן ובציורי הקיר שלה.

    היום השני ממשיך לאוני, העיר הראשית של ראצ'ה העילית על נהר ריוני בגובה 830 מטרים — עדיין משוקמת רק בחלקה מאז רעידת האדמה של 1991 — ומשם לאתר הנופש שובי, בסיס הררי בעמק צ'נצ'חי.

    היום השלישי הוא יום מנוחה והתאקלמות בשובי ללא נסיעה נוספת, לפני הדחיפה ביום הרביעי אל שביל האגם אודזירו וקרחון בובה, הכפר האחרון בראצ'ה, שנגיש בקיץ רק ברכב 4x4.

    היום החמישי מסתיים בגלולה, הכפר הגדול האחרון בראצ'ה העילית, שם הדרך מתפצלת לכיוון שובי ולכיוון גבי.
  tips:
  - קטגוריית הרכב של המסלול היא suv, אך המקטע ביום הרביעי אל אגם אודזירו מדורג כשטח/רק 4x4 — אל תנסו אותו לבד ב-SUV ללא גובה רכב אמיתי.
  - העונה המומלצת היא יוני–ספטמבר בלבד; שביל אודזירו/בובה מוגדר בנתונים כ'קיץ בלבד', וגם שובי עצמה עונתית.
  - היום השלישי נבנה כיום התאקלמות ללא נהיגה — נצלו אותו למנוחה לפני המקטע הגבוה ביותר.
  - לפי נתוני האתר, שובי 'שוקמה חלקית לאחר האסון של 2023' — בדקו את הנגישות הנוכחית לפני שתסתמכו עליה כבסיס.
  - שני ימי הנהיגה הארוכים ביותר (1 ו-2) כוללים יחד כשני-שלישים מ-13 שעות הנהיגה הכוללות של הטיול — המחצית השנייה קלה יותר.
ar:
  name: 'جورجيا في ٥ أيام: مرتفعات راتشا'
  short: خمسة أيام في جبال راتشا العليا، من بحيرة جبلية إلى قريتي شوفي وغلولا الطرفيتين.
  body: |-
    يبقى هذا المسار طوال أيامه الخمسة داخل منطقة واحدة، راتشا-لتشخومي، ويرتفع تدريجياً: الخزان والكاتدرائية في اليوم الأول على طريق معبد غالباً، لكن مقطع اليوم الرابع مصنف كـ«دفع رباعي فقط»، والمسار بأكمله يعمل فقط من يونيو إلى سبتمبر.

    يصعد اليوم الأول إلى خزان شاووري، بحيرة جبلية محاطة بأشجار الصنوبر على ارتفاع نحو ١١٣٠ متراً، ثم إلى كاتدرائية نيكورتسميندا من القرن الحادي عشر، المعروفة بنقوشها الحجرية وجدارياتها.

    يستمر اليوم الثاني إلى أوني، المدينة الرئيسية لراتشا العليا على نهر ريوني عند ارتفاع ٨٣٠ متراً — لا تزال نصف معاد بنائها منذ زلزال ١٩٩١ — ثم إلى منتجع شوفي، قاعدة جبلية في وادي تشانتشاخي.

    اليوم الثالث يوم راحة وتأقلم في شوفي دون قيادة إضافية، تمهيداً لدفعة اليوم الرابع نحو مسار بحيرة أودزيرو ونهر أوبا الجليدي، آخر قرية في راتشا، ولا يمكن الوصول إليها صيفاً إلا بدفع رباعي.

    ينتهي اليوم الخامس في غلولا، آخر قرية كبيرة في راتشا العليا، حيث ينقسم الطريق نحو شوفي ونحو غيبي.
  tips:
  - فئة السيارة لهذا المسار هي دفع رباعي (suv)، لكن مقطع اليوم الرابع نحو بحيرة أودزيرو مصنف كطريق وعر/دفع رباعي فقط — لا تحاولوا سلوكه بمفردكم في سيارة دفع رباعي عادية بلا خلوص أرضي حقيقي.
  - الموسم المناسب هو يونيو–سبتمبر فقط؛ مسار أودزيرو/أوبا مسجل في البيانات كـ«صيفي فقط»، وشوفي نفسها موسمية.
  - اليوم الثالث مصمم كيوم تأقلم دون قيادة — استغلوه للراحة قبل أعلى مقطع في المسار.
  - بحسب بيانات الموقع، شوفي «أُعيد بناؤها جزئياً بعد كارثة ٢٠٢٣» — تحققوا من إمكانية الوصول الحالية قبل الاعتماد عليها كقاعدة.
  - يشكل يوما القيادة الأطول (الأول والثاني) معاً نحو ثلثي ساعات القيادة الإجمالية البالغة ١٣ ساعة للرحلة — النصف الثاني أخف.
