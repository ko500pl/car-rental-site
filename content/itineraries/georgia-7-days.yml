ka:
  name: 'საქართველო 7 დღეში: მემკვიდრეობის გზა მცხეთიდან ქუთაისამდე'
  short: კვირა საქართველოს ისტორიაში — მცხეთიდან ბორჯომი-ვარძიის სამხრეთის გავლით ქუთაისის მონასტრებამდე და მღვიმეებამდე, მთლიანად ასფალტირებულ გზებზე.
  body: |-
    ეს მარშრუტი აერთიანებს სამ მოკლე ეკონომ-კლასის მარშრუტს ერთმანეთის მიყოლებით — თბილისთან ახლოს არსებული უნესკოს ძეგლებიდან სამხრეთით, სამცხის საზღვრისკენ, შემდეგ დასავლეთით იმერეთისკენ — სამი მეზობელი რეგიონი, დადასტურებული ღირსშესანიშნაობათა კოორდინატებით, არცერთი რეგიონის გამოტოვების გარეშე.

    1-2 დღეები მოიცავს მცხეთასა და გორს: ჯვრის მონასტერი კლდეზე არაგვისა და მტკვრის შესართავთან, მე-11 საუკუნის სვეტიცხოვლის საკათედრო ტაძარი, სამთავროს სამეფო საფლავები, კლდეში ნაკვეთი ქალაქი უფლისციხე, გორის ციხე და სტალინის მუზეუმი, და ფრესკებით მდიდარი ათენის სიონის ეკლესია.

    3-4 დღეები მიემართება სამხრეთით, სამცხისკენ: ბორჯომის საკურორტო პარკი და რაბათის ციხე ახალციხეში, შემდეგ წრიული მარშრუტი ხერთვისის ციხემდე და ვარძიამდე — დედოფალ თამარის ეპოქის მე-12 საუკუნის კლდეში ნაკვეთი მონასტერი მტკვრის ხეობაში.

    5-7 დღეები სრულდება იმერეთში, ქუთაისის ირგვლივ: ბაგრატის ტაძარი ძველ ქალაქზე მაღლა, 1840 წლის ბოტანიკური ბაღი, საათაფლიის დინოზავრის ნაკვალევი და კარსტული მღვიმე, პრომეთეს მღვიმის მიწისქვეშა ნავით სეირნობა, საბჭოთა კურორტული ქალაქი წყალტუბო, და გელათის მონასტერი, დაარსებული დავით აღმაშენებლის მიერ.

    ამ მარშრუტის ყველა ღირსშესანიშნაობა ასფალტირებული ან ძირითადად ასფალტირებული გზისა და ეკონომ-კლასის მანქანისთვისაა შეფასებული — ეს ხუთი მარშრუტიდან მექანიკურად ყველაზე რბილია გრძელი მარშრუტების შორის.
  tips:
  - car_category ყველა შვიდი დღისთვის ეკონომ-კლასია — ეს ერთადერთი 7/10/14-დღიანი მარშრუტია აქ, რომელსაც SUV არასდროს სჭირდება.
  - სეზონურობა „ყველა" ყველა კომპონენტი მარშრუტისთვის, ასე რომ კომფორტულად მუშაობს მთის მარშრუტებისთვის საჭირო მაისი-ოქტომბრის ფარგლების გარეშეც.
  - მე-4 დღე, ახალციხე-ვარძიის წრე, ყველაზე გრძელი ცალკეული სავალი დღეა, დაახლოებით 5სთ 40წთ — დაგეგმეთ სადილი ვარძიაში ან ასპინძაში დაბრუნებამდე.
  - 18სთ 30წთ საერთო სავალი დრო უფრო მძიმეა 1-4 დღეებში (ისტორია და ციხე-სიმაგრეები) და უფრო მსუბუქი 5-7 დღეებში (ქუთაისი კომპაქტური ბაზაა ერთდღიანი მოგზაურობებისთვის).
  - ათენის სიონის გზა ძირითადად ასფალტირებულია, არა სრულად — ეს ერთადერთი არა-სრულად-ასფალტირებული შეფასებაა მთელი შვიდი დღის განმავლობაში.
en:
  name: 'Georgia in 7 Days: Heritage Road from Mtskheta to Kutaisi'
  short: A week tracing Georgia's history west from Mtskheta through the Borjomi-Vardzia south to Kutaisi's monasteries and caves, entirely on paved roads.
  body: |-
    This itinerary strings together three short economy-car routes end to end, moving from the UNESCO core near Tbilisi south to the Samtskhe borderlands and then west into Imereti — three adjacent regions, confirmed by the attraction coordinates, with no region skipped.

    Days 1-2 cover Mtskheta and Gori: Jvari Monastery on its cliff above the Aragvi-Mtkvari confluence, the 11th-century Svetitskhoveli Cathedral, Samtavro's royal graves, the rock-cut city of Uplistsikhe, Gori's fortress and Stalin museum, and the frescoed Ateni Sioni church.

    Days 3-4 head south to Samtskhe: Borjomi's spa park and Rabati Castle in Akhaltsikhe, then a loop to Khertvisi Fortress and Vardzia, Queen Tamar's 12th-century cave monastery cut into the Mtkvari gorge.

    Days 5-7 finish in Imereti around Kutaisi: Bagrati Cathedral over the old town, the 1840 botanical garden, Sataplia's dinosaur footprints and karst cave, Prometheus Cave's underground boat ride, the Soviet spa town of Tskaltubo, and Gelati Monastery, founded by David the Builder.

    Every attraction on this route is rated paved or mostly-paved and economy-car; mechanically, this is the gentlest of the longer itineraries here.
  tips:
  - car_category is economy for all seven days — the only 7/10/14-day itinerary here that never needs an SUV.
  - best_season is 'all' for every component route, so it runs comfortably outside the May-October window the mountain trips need.
  - Day 4, the Akhaltsikhe-Vardzia loop, is the longest single driving day at roughly 5h40 — plan lunch at Vardzia or Aspindza before the drive back.
  - The 18h30 of total driving is heavier on days 1-4 (history and fortress country) and lighter on days 5-7 (Kutaisi is a compact base for day trips).
  - Ateni Sioni's road is mostly-paved rather than fully paved — the only non-paved rating on the whole seven days.
ru:
  name: 'Грузия за 7 дней: дорога наследия от Мцхеты до Кутаиси'
  short: Неделя по истории Грузии — от Мцхеты через южный регион Боржоми-Вардзиа до монастырей и пещер Кутаиси, целиком по асфальтированным дорогам.
  body: |-
    Этот маршрут соединяет подряд три коротких маршрута для эконом-класса — от объектов ЮНЕСКО рядом с Тбилиси на юг, к границе Самцхе, а затем на запад, в Имерети — три соседних региона, что подтверждается координатами достопримечательностей, без пропуска регионов.

    Дни 1-2 охватывают Мцхету и Гори: монастырь Джвари на скале над слиянием Арагви и Куры, кафедральный собор Светицховели XI века, царские захоронения Самтавро, высеченный в скале город Уплисцихе, крепость и музей Сталина в Гори, а также церковь Атенис Сиони с богатыми фресками.

    Дни 3-4 направляются на юг, в Самцхе: курортный парк Боржоми и крепость Рабат в Ахалцихе, затем петля к крепости Хертвиси и Вардзиа — высеченному в скале монастырю XII века эпохи царицы Тамар в ущелье Куры.

    Дни 5-7 завершаются в Имерети, вокруг Кутаиси: собор Баграта над старым городом, ботанический сад 1840 года, следы динозавров и карстовая пещера Сатаплиа, подземная лодочная прогулка в пещере Прометея, советский курортный город Цхалтубо и монастырь Гелати, основанный Давидом Строителем.

    Все достопримечательности на этом маршруте отмечены как асфальтированные или в основном асфальтированные и подходят для машины эконом-класса — это механически самый щадящий из длинных маршрутов здесь.
  tips:
  - 'car_category для всех семи дней — эконом-класс: единственный маршрут длиной 7/10/14 дней здесь, который никогда не требует внедорожника.'
  - Сезонность «весь год» для всех трёх составляющих маршрутов, так что поездка комфортна и вне майско-октябрьского окна, нужного горным маршрутам.
  - 4-й день, петля Ахалцихе-Вардзиа, — самый длинный день вождения, около 5 ч 40 мин — запланируйте обед в Вардзиа или Аспиндзе перед обратной дорогой.
  - Из 18 ч 30 мин общего вождения больше приходится на дни 1-4 (история и крепости), меньше — на дни 5-7 (Кутаиси — компактная база для однодневных поездок).
  - Дорога к Атенис Сиони отмечена как в основном асфальтированная, а не полностью — это единственная не полностью асфальтированная точка за все семь дней.
fa:
  name: 'گرجستان در ۷ روز: جاده میراث از متسختا تا کوتایسی'
  short: یک هفته در تاریخ گرجستان — از متسختا از میان منطقه جنوبی برجومی-واردزیا تا صومعه‌ها و غارهای کوتایسی، تماماً روی جاده‌های آسفالته.
  body: |-
    این مسیر سه مسیر کوتاه اقتصادی را پشت سر هم به هم متصل می‌کند — از آثار یونسکو در نزدیکی تفلیس به سمت جنوب، تا مرز سامتسخه، سپس به سمت غرب به ایمرتی — سه منطقه همسایه که با مختصات جاذبه‌ها تأیید شده، بدون رد شدن از هیچ منطقه‌ای.

    روزهای ۱ تا ۲ متسختا و گوری را دربر می‌گیرد: صومعه جوری روی صخره‌ای بالای محل تلاقی رودخانه‌های آراگوی و متکواری، کلیسای جامع سوه‌تیتسخوولی از سده یازدهم، آرامگاه‌های سلطنتی سامتاوروی، شهر کنده‌شده در صخره اوپلیستسیخه، دژ گوری و موزه استالین، و کلیسای آتنی سیونی با نقاشی‌های دیواری غنی.

    روزهای ۳ تا ۴ به سمت جنوب، سامتسخه، می‌روند: پارک آبگرم برجومی و قلعه رباتی در آخالتسیخه، سپس حلقه‌ای تا دژ خرتویسی و واردزیا — صومعه‌ای غار-کنده از سده دوازدهم متعلق به دوران ملکه تامار در دره متکواری.

    روزهای ۵ تا ۷ در ایمرتی، پیرامون کوتایسی، به پایان می‌رسد: کلیسای جامع باگراتی بالای شهر قدیم، باغ گیاه‌شناسی سال ۱۸۴۰، ردپای دایناسور و غار کارستی ساتاپلیا، قایق‌سواری زیرزمینی غار پرومته‌اووس، شهر آبگرم دوران شوروی تسکالتوبو، و صومعه گلاتی که به دست داوید سازنده بنا شده است.

    همه جاذبه‌های این مسیر آسفالته یا عمدتاً آسفالته و برای خودروی اقتصادی رتبه‌بندی شده‌اند — این از نظر فنی ملایم‌ترین مسیر بلند در میان مسیرهای اینجاست.
  tips:
  - دسته خودرو برای هر هفت روز اقتصادی است — تنها مسیر ۷/۱۰/۱۴ روزه در اینجا که هرگز به شاسی‌بلند نیاز ندارد.
  - فصل مناسب برای هر سه مسیر تشکیل‌دهنده «تمام سال» است، بنابراین حتی خارج از بازه مه تا اکتبر مورد نیاز مسیرهای کوهستانی هم به‌راحتی قابل اجراست.
  - روز چهارم، حلقه آخالتسیخه-واردزیا، طولانی‌ترین روز رانندگی است، حدود ۵ ساعت و ۴۰ دقیقه — پیش از بازگشت، ناهار را در واردزیا یا آسپیندزا برنامه‌ریزی کنید.
  - از ۱۸ ساعت و ۳۰ دقیقه رانندگی کل، سهم بیشتر مربوط به روزهای ۱ تا ۴ (سرزمین تاریخ و دژها) و سهم کمتر مربوط به روزهای ۵ تا ۷ (کوتایسی پایگاهی فشرده برای گشت‌های روزانه است).
  - جاده آتنی سیونی عمدتاً آسفالته است نه کاملاً — تنها رتبه غیر-کاملاً-آسفالته در کل هفت روز.
he:
  name: 'גאורגיה ב-7 ימים: דרך המורשת ממצחתה לכותאיסי'
  short: שבוע בהיסטוריה של גאורגיה — ממצחתה דרך אזור הדרום בורג'ומי-וורדזיה ועד למנזרים ולמערות של כותאיסי, כולו על כבישים סלולים.
  body: |-
    מסלול זה משרשר שלושה מסלולים קצרים לרכב אקונומי זה אחר זה — מאתרי אונסק"ו ליד טביליסי דרומה, אל גבול סמצחה, ומשם מערבה אל אימרתי — שלושה אזורים שכנים, כפי שאושר לפי קואורדינטות האתרים, ללא דילוג על אזור.

    ימים 1-2 כוללים את מצחתה וגורי: מנזר ג'וורי על הצוק מעל מפגש נהרות אראגווי ומטקוורי, קתדרלת סווטיצחובלי מהמאה ה-11, קברי המלוכה בסמטברו, העיר החצובה בסלע אופליסציחה, מבצר גורי ומוזיאון סטלין, וכנסיית אתני סיוני עם ציורי הקיר העשירים שלה.

    ימים 3-4 פונים דרומה אל סמצחה: פארק הספא של בורג'ומי ומבצר רבאתי באחלציחה, ולאחר מכן מסלול מעגלי אל מבצר חרתוויסי ואל וורדזיה — מנזר החצוב בסלע מהמאה ה-12 מתקופת המלכה תמר בקניון מטקוורי.

    ימים 5-7 מסתיימים באימרתי, סביב כותאיסי: קתדרלת בגראטי מעל העיר העתיקה, הגן הבוטני משנת 1840, עקבות הדינוזאורים ומערת הקארסט בסטפליה, שיט הסירה התת-קרקעי במערת פרומתאוס, עיירת הספא הסובייטית צקלטובו, ומנזר גלאתי, שנוסד בידי דוד הבנאי.

    כל אתר במסלול זה מדורג כסלול או סלול ברובו ומתאים לרכב אקונומי — מבחינה מכנית זהו המסלול הקל ביותר מבין המסלולים הארוכים כאן.
  tips:
  - קטגוריית הרכב לכל שבעת הימים היא אקונומי — המסלול היחיד באורך 7/10/14 ימים כאן שלעולם לא דורש רכב שטח.
  - העונה המומלצת היא 'כל השנה' עבור כל שלושת המסלולים המרכיבים, כך שהוא פועל היטב גם מחוץ לחלון מאי-אוקטובר הנדרש למסלולי ההרים.
  - היום ה-4, מעגל אחלציחה-וורדזיה, הוא יום הנהיגה הארוך ביותר, כ-5 שעות ו-40 דקות — תכננו ארוחת צהריים בוורדזיה או באספינדזה לפני הנסיעה חזרה.
  - מתוך 18 שעות ו-30 דקות נהיגה כוללת, החלק הגדול יותר נופל בימים 1-4 (ארץ ההיסטוריה והמבצרים) והחלק הקל יותר בימים 5-7 (כותאיסי היא בסיס קומפקטי לטיולי יום).
  - הכביש לאתני סיוני מדורג כסלול ברובו ולא סלול לגמרי — הדירוג הלא-סלול-לגמרי היחיד לכל אורך שבעת הימים.
ar:
  name: 'جورجيا في ٧ أيام: طريق التراث من متسختا إلى كوتايسي'
  short: أسبوع في تاريخ جورجيا — من متسختا عبر منطقة الجنوب بورجومي-فاردزيا إلى أديرة ومغاور كوتايسي، بالكامل على طرق معبدة.
  body: |-
    يربط هذا المسار ثلاثة مسارات قصيرة للسيارات الاقتصادية واحداً تلو الآخر — من مواقع اليونسكو قرب تبليسي جنوباً نحو حدود ساتسخه، ثم غرباً نحو إيميريتي — ثلاث مناطق متجاورة، مؤكدة بإحداثيات المعالم، دون تخطي أي منطقة.

    يشمل اليومان ١-٢ متسختا وغوري: دير جفاري على منحدر فوق ملتقى نهري أراغفي ومتكفاري، كاتدرائية سفيتيتسخوفيلي من القرن الحادي عشر، مقابر سامتافرو الملكية، مدينة أوبليستسيخه المنحوتة في الصخر، قلعة غوري ومتحف ستالين، وكنيسة أتيني سيوني بجدارياتها الغنية.

    يتجه اليومان ٣-٤ جنوباً نحو ساتسخه: حديقة بورجومي العلاجية وقلعة رباتي في أخالتسيخه، ثم حلقة إلى قلعة خرتفيسي وفاردزيا — دير القرن الثاني عشر المنحوت في الصخر من عصر الملكة تمار في وادي متكفاري.

    تنتهي الأيام ٥-٧ في إيميريتي حول كوتايسي: كاتدرائية باغراتي فوق البلدة القديمة، الحديقة النباتية لعام ١٨٤٠، آثار أقدام الديناصورات ومغارة ساتابليا الكارستية، جولة القارب تحت الأرض في مغارة بروميثيوس، بلدة تسخالتوبو الاستشفائية السوفيتية، ودير غيلاتي الذي أسسه داود الباني.

    كل معلم في هذا المسار مصنف كمعبد أو معبد في الغالب ومناسب لسيارة اقتصادية — هذا من الناحية الميكانيكية ألطف مسار طويل هنا.
  tips:
  - فئة السيارة لكل الأيام السبعة اقتصادية — المسار الوحيد بطول ٧/١٠/١٤ يوماً هنا الذي لا يحتاج أبداً إلى دفع رباعي.
  - الموسم المناسب «طوال السنة» لجميع المسارات المكونة الثلاثة، لذا يعمل بارتياح حتى خارج نافذة مايو-أكتوبر التي تحتاجها رحلات الجبال.
  - اليوم الرابع، حلقة أخالتسيخه-فاردزيا، هو أطول يوم قيادة منفرد بنحو ٥ ساعات و٤٠ دقيقة — خططوا للغداء في فاردزيا أو أسبيندزا قبل العودة.
  - من أصل ١٨ ساعة و٣٠ دقيقة من القيادة الإجمالية، يقع الجزء الأكبر في الأيام ١-٤ (بلاد التاريخ والقلاع) والجزء الأخف في الأيام ٥-٧ (كوتايسي قاعدة مدمجة لرحلات نهارية).
  - طريق أتيني سيوني معبد في الغالب وليس بالكامل — التصنيف الوحيد غير المعبد بالكامل طوال الأيام السبعة.
