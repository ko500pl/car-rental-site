ka:
  name: 'საქართველო 14 დღეში: დიდი კლასიკური ტური და ზემო აჭარა'
  short: საქართველოს სრული თოთხმეტდღიანი გადაკვეთა — თბილისიდან ყაზბეგამდე, სამხრეთი, იმერეთი, სამეგრელო და სვანეთი ბათუმამდე — გაგრძელებული სანაპიროზე მდებარე ღვინის სოფლებსა და მთის ტბებამდე.
  body: |-
    ეს ამ ხუთეულში ყველაზე გრძელი მარშრუტია: ქვეყნის საკუთარი ათდღიანი დიდი ტური, პლუს კიდევ ოთხი დღე, რომელიც ბათუმიდან ზემო აჭარისკენ ადის — ერთადერთი გაგრძელება ამ კომპლექტში, რომელიც მარშრუტის საკუთარ საბოლოო წერტილს გასცდება, დადასტურებული როგორც მეზობელი (დაახლოებით 24 კმ) ბათუმის ძველი ქალაქისა და მახუნცეთის ჩანჩქერის კოორდინატებით.

    პირველი ათი დღე გადის ექვს რეგიონში თანმიმდევრობით: მცხეთის ჯვარი და სვეტიცხოველი, ანანურის ციხე და გერგეტის სამების ეკლესია ყაზბეგის ძირას ჩრდილოეთით, უფლისციხე და ბორჯომი, ვარძიის კლდის მონასტერი სამხრეთით, ქუთაისის ბაგრატის ტაძარი, მარტვილის კანიონი და დადიანების სასახლე დასავლეთით, მესტია და უშგული სვანეთის მაღალმთიანეთში, და ბოლოს ბათუმის სანაპირო.

    11-14 დღეები სანაპიროდან აჭარისწყლის ხეობისკენ მიდის: მახუნცეთის ჩანჩქერი და ქვის ხიდი, ჩხავერისა და წოლიკოურის მარნები კედის ირგვლივ, საბჭოთა პერიოდის საბაგირო და მე-13 საუკუნის სხალთის მონასტერი ხულოსთან, და — მხოლოდ 4x4-ითა და მოხრეშილ გზებზე, ზაფხულობით მისაწვდომ — მწვანე ტბა გოდერძის უღელტეხილთან და ბეშუმის მთის დასახლება 1,830 მეტრზე.

    თოთხმეტივე დღის განმავლობაში ეს მოგზაურობა ეხება გზების ყველა კატეგორიას მონაცემებში — ასფალტირებულს, ძირითადად ასფალტირებულს, ხრეშსა და მხოლოდ-4x4-ს — და ორივე ძირითად მანქანის კლასს; ეს არის მთელი საგზაო ქსელის შეჯამება, არა მხოლოდ ერთი კუთხე.
  tips:
  - car_category მთელი მოგზაურობისთვის suv-ია; ბოლო ორი დღე (მწვანე ტბა და ბეშუმი) ცალ-ცალკე offroad-ადაა შეფასებული, ასე რომ დამამთავრებელ მონაკვეთს რეალური გამავლობა სჭირდება, თუნდაც SUV-მა უმეტესობა დაფაროს.
  - სეზონურობა ორივე კომპონენტი მარშრუტისთვის მაისი-ოქტომბერია — ეს არსად არ არის ზამთრის მარშრუტი მისი 2,040 კმ-ის განმავლობაში.
  - მე-9 დღე (უშგული) ხრეშზეა, ხოლო 13-14 დღეები მხოლოდ-4x4/ხრეშზეა — მოგზაურობის სამი ყველაზე უხეში დღე თანაბრად არ არის განაწილებული, ასე რომ დაგეგმეთ მარაგი მათ ირგვლივ, ფიქსირებული დღიური ნორმის ნაცვლად.
  - 39სთ 30წთ სავალი 14 დღეზე საშუალოდ დღეში 3 საათზე ნაკლებია, მაგრამ მე-2 დღე (მცხეთიდან ყაზბეგამდე) ერთადერთი ყველაზე გრძელი მონაკვეთია — ადრე დაიწყეთ.
  - ბათუმი (მე-10 დღის ბოლოს) ბუნებრივი მარაგის შევსების წერტილია ზემო აჭარის მონაკვეთამდე — ეს არის ბოლო ქალაქი მარშრუტზე სრული სერვისებით მთის სოფლებამდე.
en:
  name: 'Georgia in 14 Days: the Grand Classic Plus Upper Adjara'
  short: The full fourteen-day crossing of Georgia -- Tbilisi to Kazbegi, the south, Imereti, Samegrelo and Svaneti to Batumi -- extended into the wine villages and alpine lakes above the coast.
  body: |-
    This is the longest itinerary here: the country's own ten-day grand tour, plus four more days climbing out of Batumi into Upper Adjara -- the only extension in this set that continues past a route's own endpoint, confirmed adjacent (about 24 km) by the coordinates of Batumi's old town and the Makhuntseti waterfall.

    The first ten days move through six regions in sequence: Mtskheta's Jvari and Svetitskhoveli, Ananuri fortress and Gergeti Trinity Church below Kazbek in the north, Uplistsikhe and Borjomi, Vardzia's cave monastery in the south, Kutaisi's Bagrati Cathedral, Martvili Canyon and the Dadiani Palace in the west, Mestia and Ushguli in Svaneti's high mountains, and finally Batumi's seafront.

    Days 11-14 leave the coast for the Adjaristsqali valley: Makhuntseti's waterfall and stone bridge, the Chkhaveri and Tsolikouri wine cellars around Keda, the Soviet-era cable car and 13th-century Skhalta Monastery near Khulo, and -- on 4x4-only and gravel roads reachable in summer alone -- Green Lake near Goderdzi Pass and the alpine settlement of Beshumi at 1,830 metres.

    Across all fourteen days this trip touches every road category in the data -- paved, mostly-paved, gravel and 4x4-only -- and both mainstream car classes; it is a summary of the whole road network, not just one corner of it.
  tips:
  - car_category is suv for the full trip; the last two days (Green Lake and Beshumi) are individually rated offroad, so the closing leg needs real ground clearance even if the SUV covers most of it.
  - best_season is May-October for both component routes -- this is not a winter itinerary anywhere along its 2,040 km.
  - Day 9 (Ushguli) is on gravel and days 13-14 are 4x4-only/gravel -- the three roughest days of the trip are not evenly spread, so budget slack around them rather than a fixed daily quota.
  - 39h30 of driving over 14 days averages under 3 hours a day, but day 2 (Mtskheta to Kazbegi) is the single longest leg -- start it early.
  - Batumi (end of day 10) is the natural resupply point before the Upper Adjara leg -- it's the last town on the route with full services before the mountain villages.
ru:
  name: 'Грузия за 14 дней: большой классический тур плюс Верхняя Аджария'
  short: Полное четырнадцатидневное пересечение Грузии — от Тбилиси до Казбеги, юга, Имерети, Самегрело и Сванети до Батуми — продлённое до винных деревень и горных озёр над побережьем.
  body: |-
    Это самый длинный маршрут здесь: собственный десятидневный большой тур страны плюс ещё четыре дня подъёма из Батуми в Верхнюю Аджарию — единственное в этом наборе продолжение за пределы конечной точки маршрута, подтверждённое как соседнее (около 24 км) по координатам старого города Батуми и водопада Махунцети.

    Первые десять дней проходят через шесть регионов подряд: Джвари и Светицховели в Мцхете, крепость Ананури и церковь Гергетис Самеба под Казбеком на севере, Уплисцихе и Боржоми, пещерный монастырь Вардзиа на юге, собор Баграта в Кутаиси, каньон Мартвили и дворец Дадиани на западе, Местиа и Ушгули в высокогорье Сванети, и, наконец, набережная Батуми.

    Дни 11-14 уходят от побережья в долину Аджарисцкали: водопад Махунцети и каменный мост, винные погреба Чхавери и Цоликаури вокруг Кеды, канатная дорога советской эпохи и монастырь Схалта XIII века у Хуло, и — по дорогам только для 4x4 и гравийным, доступным лишь летом — Зелёное озеро у перевала Годердзи и горное поселение Бешуми на высоте 1 830 метров.

    На протяжении всех четырнадцати дней эта поездка затрагивает все категории дорог из данных — асфальт, преимущественно асфальт, гравий и только-4x4 — и оба основных класса машин; это сводка всей дорожной сети, а не только одного её угла.
  tips:
  - car_category для всей поездки — suv; последние два дня (Зелёное озеро и Бешуми) по отдельности отмечены как offroad, так что завершающий отрезок требует реального клиренса, даже если SUV покрывает большую часть маршрута.
  - 'Сезонность — май-октябрь для обоих составляющих маршрутов: это не зимний маршрут ни на одном из 2 040 км.'
  - '9-й день (Ушгули) — по гравию, а 13-14-й дни — только-4x4/гравий: три самых сложных дня поездки распределены неравномерно, так что закладывайте запас времени вокруг них, а не фиксированную дневную норму.'
  - 39 ч 30 мин вождения за 14 дней в среднем составляют меньше 3 часов в день, но 2-й день (Мцхета-Казбеги) — самый длинный отдельный отрезок — выезжайте пораньше.
  - 'Батуми (конец 10-го дня) — естественная точка пополнения запасов перед участком Верхней Аджарии: последний город на маршруте с полным набором услуг перед горными сёлами.'
fa:
  name: 'گرجستان در ۱۴ روز: تور کلاسیک بزرگ به‌علاوه آجارای علیا'
  short: عبور کامل چهارده‌روزه از گرجستان — از تفلیس تا کازبگی، جنوب، ایمرتی، سامگرلو و سوانتی تا باتومی — با ادامه به روستاهای شراب و دریاچه‌های کوهستانی بالای ساحل.
  body: |-
    این طولانی‌ترین مسیر در این مجموعه است: تور بزرگ ده‌روزه خود کشور، به‌علاوه چهار روز دیگر که از باتومی به سمت آجارای علیا بالا می‌رود — تنها گسترشی در این مجموعه که از نقطه پایانی خود مسیر فراتر می‌رود، و همسایگی آن (حدود ۲۴ کیلومتر) با مختصات شهر قدیم باتومی و آبشار ماخونتستی تأیید شده است.

    ده روز نخست به‌ترتیب از شش منطقه عبور می‌کند: جوری و سوه‌تیتسخوولی در متسختا، دژ آنانوری و کلیسای تثلیث گرگتی زیر قله کازبک در شمال، اوپلیستسیخه و برجومی، صومعه غاری واردزیا در جنوب، کلیسای جامع باگراتی در کوتایسی، دره مارتویلی و کاخ دادیانی در غرب، مستیا و اوشگولی در ارتفاعات سوانتی، و در نهایت کرانه دریای باتومی.

    روزهای ۱۱ تا ۱۴ ساحل را ترک می‌کنند و به دره آجاریستسکالی می‌روند: آبشار ماخونتستی و پل سنگی آن، سردابه‌های شراب چخاوری و تسولیکائوری در اطراف کدا، تله‌کابین دوران شوروی و صومعه سخالتای سده سیزدهم نزدیک خولو، و — روی جاده‌هایی فقط برای ۴×۴ و شنی که تنها در تابستان قابل دسترسی‌اند — دریاچه سبز نزدیک گذرگاه گودرزی و روستای کوهستانی بشومی در ارتفاع ۱۸۳۰ متری.

    در طول تمام چهارده روز، این سفر به همه دسته‌های جاده‌ای موجود در داده‌ها دست می‌زند — آسفالته، عمدتاً آسفالته، شنی و فقط-۴×۴ — و هر دو دسته اصلی خودرو را نیز؛ این خلاصه‌ای از کل شبکه جاده‌ای است، نه فقط یک گوشه از آن.
  tips:
  - دسته خودرو برای کل سفر شاسی‌بلند (suv) است؛ دو روز پایانی (دریاچه سبز و بشومی) هرکدام جداگانه آفرود رتبه‌بندی شده‌اند، بنابراین بخش پایانی به فاصله واقعی از زمین نیاز دارد حتی اگر شاسی‌بلند بیشتر مسیر را پوشش دهد.
  - فصل مناسب برای هر دو مسیر تشکیل‌دهنده مه تا اکتبر است — این در هیچ‌جای ۲۰۴۰ کیلومتر خود مسیری زمستانی نیست.
  - روز نهم (اوشگولی) روی جاده شنی است و روزهای ۱۳-۱۴ فقط-۴×۴/شنی هستند — سه روز ناهموارترین سفر به‌طور یکنواخت پخش نشده‌اند، پس به‌جای سهمیه ثابت روزانه، انعطاف در اطراف آن‌ها در نظر بگیرید.
  - ۳۹ ساعت و ۳۰ دقیقه رانندگی در ۱۴ روز به‌طور میانگین کمتر از ۳ ساعت در روز است، اما روز دوم (متسختا تا کازبگی) طولانی‌ترین بخش منفرد است — زود حرکت کنید.
  - باتومی (پایان روز دهم) نقطه طبیعی تأمین مجدد پیش از بخش آجارای علیا است — آخرین شهر در مسیر با خدمات کامل پیش از روستاهای کوهستانی.
he:
  name: 'גאורגיה ב-14 יום: הטיול הקלאסי הגדול ועוד אג''ריה העילית'
  short: החצייה המלאה בת 14 הימים של גאורגיה — מטביליסי לקזבגי, הדרום, אימרתי, סמגרלו וסוואנתי עד בטומי — מוארכת אל כפרי היין ואגמי ההרים מעל החוף.
  body: |-
    זהו המסלול הארוך ביותר כאן: הטיול הגדול בן עשרת הימים של המדינה עצמה, בתוספת ארבעה ימים נוספים המטפסים מבטומי אל אג'ריה העילית — ההרחבה היחידה בסט הזה שממשיכה מעבר לנקודת הסיום של המסלול עצמו, שאושרה כשכנה (כ-24 ק"מ) לפי הקואורדינטות של העיר העתיקה של בטומי ומפל מחונצטי.

    עשרת הימים הראשונים עוברים בשישה אזורים ברצף: ג'וורי וסווטיצחובלי במצחתה, מבצר אננורי וכנסיית השילוש של גרגטי מתחת לקזבק בצפון, אופליסציחה ובורג'ומי, מנזר המערות וורדזיה בדרום, קתדרלת בגראטי בכותאיסי, קניון מרטוילי וארמון דדיאני במערב, מסטיה ואושגולי בהרי סוואנתי הגבוהים, ולבסוף טיילת בטומי.

    ימים 11-14 עוזבים את החוף לעמק אג'ריסצקלי: מפל מחונצטי וגשר האבן שלו, מרתפי היין צ'חוורי וצוליקאורי סביב קדה, הרכבל מהתקופה הסובייטית ומנזר סחלטה מהמאה ה-13 ליד חולו, ו — על כבישים המיועדים ל-4x4 בלבד ולחצץ, נגישים רק בקיץ — האגם הירוק ליד מעבר גודרדזי והיישוב ההררי בשומי בגובה 1,830 מטרים.

    לאורך כל ארבעה-עשר הימים הטיול הזה נוגע בכל קטגוריות הכביש שבנתונים — סלול, סלול ברובו, חצץ ורק-4x4 — ובשתי קטגוריות הרכב העיקריות; זהו סיכום של כל רשת הכבישים, לא רק פינה אחת שלה.
  tips:
  - קטגוריית הרכב לכל הטיול היא SUV; שני הימים האחרונים (האגם הירוק ובשומי) מדורגים בנפרד כשטח, כך שהמקטע הסופי דורש גובה רכב אמיתי גם אם ה-SUV מכסה את רוב הדרך.
  - העונה המומלצת היא מאי-אוקטובר עבור שני המסלולים המרכיבים — זהו לא מסלול חורפי באף אחד מ-2,040 הק"מ שלו.
  - יום 9 (אושגולי) על חצץ, וימים 13-14 הם רק-4x4/חצץ — שלושת הימים המחוספסים ביותר של הטיול אינם מפוזרים באופן שווה, אז תכננו גמישות סביבם ולא מכסה יומית קבועה.
  - 39 שעות ו-30 דקות נהיגה על פני 14 ימים הן בממוצע פחות מ-3 שעות ליום, אך יום 2 (ממצחתה לקזבגי) הוא המקטע הבודד הארוך ביותר — צאו מוקדם.
  - בטומי (סוף יום 10) היא נקודת החידוש הטבעית לפני מקטע אג'ריה העילית — העיר האחרונה במסלול עם שירותים מלאים לפני הכפרים ההרריים.
ar:
  name: 'جورجيا في ١٤ يوماً: الجولة الكلاسيكية الكبرى بالإضافة إلى أعالي أدجاريا'
  short: العبور الكامل لأربعة عشر يوماً عبر جورجيا — من تبليسي إلى كازبيغي والجنوب وإيميريتي وساميغريلو وسفانيتي إلى باتومي — ممتداً إلى قرى النبيذ والبحيرات الجبلية فوق الساحل.
  body: |-
    هذا هو أطول مسار هنا: الجولة الكبرى للبلاد نفسها المكونة من عشرة أيام، بالإضافة إلى أربعة أيام أخرى تصعد من باتومي إلى أعالي أدجاريا — الامتداد الوحيد في هذه المجموعة الذي يستمر بعد نقطة نهاية المسار نفسه، والمؤكد تجاوره (نحو ٢٤ كم) بإحداثيات البلدة القديمة في باتومي وشلال ماخونتستي.

    تمر الأيام العشرة الأولى بست مناطق بالتتابع: جفاري وسفيتيتسخوفيلي في متسختا، قلعة أنانوري وكنيسة تثليث غيرغيتي تحت قمة كازبك في الشمال، أوبليستسيخه وبورجومي، دير فاردزيا الكهفي في الجنوب، كاتدرائية باغراتي في كوتايسي، وادي مارتفيلي وقصر دادياني في الغرب، ميستيا وأوشغولي في مرتفعات سفانيتي، وأخيراً واجهة باتومي البحرية.

    تغادر الأيام ١١-١٤ الساحل نحو وادي أدجاريستسكالي: شلال ماخونتستي وجسره الحجري، أقبية نبيذ تشخافيري وتسوليكاوري حول كدا، التلفريك من الحقبة السوفيتية ودير سخالتا من القرن الثالث عشر قرب خولو، و — على طرق مخصصة للدفع الرباعي فقط وطرق حصوية لا يمكن الوصول إليها إلا صيفاً — البحيرة الخضراء قرب ممر غودردزي ومستوطنة بيشومي الجبلية على ارتفاع ١٨٣٠ متراً.

    على مدى الأيام الأربعة عشر جميعها، تلامس هذه الرحلة كل فئات الطرق في البيانات — معبدة، معبدة في الغالب، حصوية، ودفع رباعي فقط — وكلتا فئتي السيارات الرئيسيتين؛ إنها ملخص لشبكة الطرق بأكملها، لا زاوية واحدة منها فقط.
  tips:
  - فئة السيارة لكامل الرحلة هي دفع رباعي (suv)؛ اليومان الأخيران (البحيرة الخضراء وبيشومي) مصنفان كل على حدة كطريق وعر، لذا يحتاج المقطع الختامي إلى خلوص أرضي حقيقي حتى لو غطت السيارة معظم المسار.
  - الموسم المناسب هو مايو-أكتوبر لكلا المسارين المكونين — هذه ليست رحلة شتوية في أي جزء من مسافتها البالغة ٢٠٤٠ كم.
  - اليوم التاسع (أوشغولي) على طريق حصوي، والأيام ١٣-١٤ دفع رباعي فقط/حصوية — أصعب ثلاثة أيام في الرحلة غير موزعة بالتساوي، لذا خططوا لهامش مرونة حولها بدلاً من حصة يومية ثابتة.
  - ٣٩ ساعة و٣٠ دقيقة من القيادة على مدى ١٤ يوماً تعني أقل من ٣ ساعات يومياً في المتوسط، لكن اليوم الثاني (متسختا إلى كازبيغي) هو أطول مقطع منفرد — انطلقوا مبكراً.
  - باتومي (نهاية اليوم العاشر) هي نقطة التزود الطبيعية قبل مقطع أعالي أدجاريا — آخر بلدة على المسار بخدمات كاملة قبل القرى الجبلية.
