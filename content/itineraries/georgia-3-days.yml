ka:
  name: 'საქართველო 3 დღეში: კახეთის ღვინის მარშრუტი'
  short: სამდღიანი მარშრუტი თბილისიდან კახეთის ვენახებში, მონასტრებსა და ღვინის მარნებში — ყოველ საღამოს დაბრუნებით თბილისში.
  body: |-
    ეს მოკლე მარშრუტი მთლიანად ერთ რეგიონშია — თბილისის აღმოსავლეთით მდებარე კახეთში — რაც მას ხუთივე მარშრუტს შორის ყველაზე მარტივად სამართავს ხდის: მთელი გზა ასფალტირებულია და მარშრუტი „ყველა სეზონის" კატეგორიაშია, ანუ წლის ნებისმიერ თვეს გამოსადეგია.

    პირველი დღე გადის ალაზნის ველზე სიღნაღამდე — მე-18 საუკუნის გალავანშემოვლებული ქალაქი ბორცვზე, საიდანაც ველის საუკეთესო ხედი იშლება — შემდეგ ეშვება ბოდბის მონასტრამდე, სადაც წმინდა ნინოა დაკრძალული.

    მეორე დღეს მოკლე გადასვლაა თელავამდე, კახეთის რეგიონულ ცენტრამდე, იმავე ველზე ტერასაზე აშენებული, სადაც არის მეფე ერეკლე მეორის ბატონის ციხე და ცხრასაუკუნოვანი ჭადარი.

    მესამე დღე მარშრუტის ყველაზე გრძელი სავალი დღეა: წინანდლის მოწყობილი მამული და ისტორიული მარანი, ალავერდის საკათედრო ტაძარი — მე-11 საუკუნის ეკლესია, საუკუნეების განმავლობაში საქართველოს ყველაზე მაღალი ნაგებობა — და ყვარლის მარნების გვირაბები, სანამ თბილისში დაბრუნდებით.
  tips:
  - მარშრუტის ყველა გაჩერება ასფალტირებულ გზაზეა და ეკონომ კლასის მანქანისთვისაა შესაფერისი — 4x4 ან მაღალი გამავლობა არ სჭირდება.
  - სეზონურობა „ყველა" — ეს ერთ-ერთი იმ იშვიათი მარშრუტთაგანია, რომელიც ზამთარშიც კომფორტულად მუშაობს.
  - მე-3 დღე მარშრუტის სავალი დროის ნახევარზე მეტს შეიცავს (დაახლოებით 4სთ 15წთ მთლიანი 8 საათიდან) — ადრე დაიწყეთ, თუ სამივე გაჩერებაზე გინდათ დრო.
  - მარნები სიღნაღში, ბოდბესა და ყვარელში დამთვალიერებელს ისედაც იღებენ, მაგრამ სამკის სეზონზე (სექტემბერი–ოქტომბერი) დეგუსტაციის წინასწარ დაჯავშნა ღირს.
en:
  name: 'Georgia in 3 Days: Kakheti Wine Loop'
  short: A three-day loop from Tbilisi through Kakheti's vineyards, monasteries and wine cellars, with the drive finished by evening each day.
  body: |-
    This short itinerary stays inside a single wine region east of Tbilisi, Kakheti, making it the easiest of the five itineraries to drive: every road on the loop is paved, and the whole route sits in the "all-season" band, so it works in any month.

    Day one crosses the Alazani Valley to Sighnaghi, a walled 18th-century town on a ridge with the valley's best view, then descends to Bodbe Monastery, the burial place of St Nino, for the evening.

    Day two is a short hop north to Telavi, Kakheti's regional capital, built on a terrace above the same valley, home to King Erekle II's Batonis Tsikhe palace and a nine-century-old plane tree.

    Day three is the longest driving day of the trip: Tsinandali's landscaped estate and historic winery, Alaverdi Cathedral — an 11th-century church that was the tallest building in Georgia for centuries — and the tunnel cellars of Kvareli, before the drive back to Tbilisi.
  tips:
  - Every stop on this loop is on paved road and rated for an economy car — no 4x4 or high clearance needed.
  - 'best_season is ''all'': this is one of the few itineraries here that works comfortably in winter.'
  - Day 3 carries more than half the trip's driving (about 4h15 of the loop's 8h total) — start early if you want time at all three stops.
  - Cellars in Sighnaghi, Bodbe and Kvareli take walk-ins, but a harvest-season (September–October) tasting is worth booking ahead.
ru:
  name: 'Грузия за 3 дня: винная петля Кахетии'
  short: Трёхдневная петля из Тбилиси по виноградникам, монастырям и винным погребам Кахетии — с возвращением в Тбилиси к вечеру каждого дня.
  body: |-
    Этот короткий маршрут не выходит за пределы одного региона — Кахетии, к востоку от Тбилиси, — что делает его самым простым для вождения из пяти маршрутов: вся дорога заасфальтирована, а сезонность отмечена как «весь год».

    В первый день маршрут пересекает Алазанскую долину до Сигнахи — обнесённого стеной города XVIII века на гребне с лучшим видом на долину, — а затем спускается к монастырю Бодбе, месту погребения святой Нино.

    Второй день — короткий переезд в Телави, региональную столицу Кахетии, построенную на террасе над той же долиной, где стоит дворец Батонис Цихе царя Ираклия II и растёт девятивековая чинара.

    Третий день — самый длинный день вождения в поездке: усадьба Цинандали с парком и историческим винным заводом, Алавердский собор — храм XI века, веками остававшийся самым высоким зданием Грузии, — и винные тоннели Кварели перед возвращением в Тбилиси.
  tips:
  - Все точки маршрута на асфальтированных дорогах и подходят для машины эконом-класса — полный привод не нужен.
  - Сезонность «весь год» — один из немногих маршрутов, который спокойно работает и зимой.
  - На 3-й день приходится больше половины ходового времени поездки (около 4 ч 15 мин из 8 общих) — выезжайте пораньше, если хотите успеть на все три точки.
  - В погреба Сигнахи, Бодбе и Кварели пускают без записи, но дегустацию в сезон сбора урожая (сентябрь–октябрь) лучше забронировать заранее.
fa:
  name: 'گرجستان در ۳ روز: حلقه شراب کاختی'
  short: یک مسیر سه‌روزه از تفلیس در میان تاکستان‌ها، صومعه‌ها و سردابه‌های شراب کاختی، با بازگشت به تفلیس در پایان هر شب.
  body: |-
    این مسیر کوتاه تنها در یک منطقه باقی می‌ماند — کاختی، در شرق تفلیس — و همین امر آن را از میان پنج مسیر، ساده‌ترین برای رانندگی می‌سازد: تمام جاده آسفالته است و فصل مناسب آن «تمام سال» ثبت شده است.

    روز اول از دره آلازانی عبور می‌کند تا به سیقناقی می‌رسد، شهری قرن هجدهمی با دیوار دفاعی روی یک تپه با بهترین چشم‌انداز دره، سپس به صومعه بودبه، محل دفن سنت نینو، می‌رسد.

    روز دوم پرشی کوتاه به سمت تلاوی است، مرکز منطقه‌ای کاختی، ساخته‌شده روی مصطبه‌ای بالای همان دره، جایی که کاخ باتونیس تسیخه پادشاه اراکله دوم و درخت چنار نه‌قرنی قرار دارد.

    روز سوم طولانی‌ترین روز رانندگی سفر است: ملک منظم‌شده تسینانداله و شرابخانه تاریخی آن، کلیسای جامع آلاوردی — کلیسایی از سده یازدهم که قرن‌ها بلندترین ساختمان گرجستان بود — و تونل‌های سردابه شراب کوارلی، پیش از بازگشت به تفلیس.
  tips:
  - همه توقف‌گاه‌های این مسیر روی جاده آسفالته قرار دارند و برای خودروی اقتصادی مناسب‌اند — نیازی به ۴×۴ یا فاصله از زمین بالا نیست.
  - فصل مناسب «تمام سال» است — این یکی از معدود مسیرهایی است که در زمستان هم به‌راحتی قابل اجراست.
  - روز سوم بیش از نیمی از زمان رانندگی کل سفر را دربر دارد (حدود ۴ ساعت و ۱۵ دقیقه از مجموع ۸ ساعت) — اگر می‌خواهید به هر سه توقف‌گاه برسید، زود حرکت کنید.
  - سردابه‌های سیقناقی، بودبه و کوارلی بدون رزرو هم پذیرای بازدیدکننده‌اند، اما چشیدن شراب در فصل برداشت (سپتامبر تا اکتبر) بهتر است از پیش رزرو شود.
he:
  name: 'גאורגיה ב-3 ימים: מסלול היין של קאכתי'
  short: מסלול תלת-יומי מטביליסי דרך כרמי הענבים, המנזרים ומרתפי היין של קאכתי, עם חזרה לטביליסי בכל ערב.
  body: |-
    מסלול קצר זה נשאר כולו באזור אחד — קחתי, ממזרח לטביליסי — מה שהופך אותו לקל ביותר לנהיגה מבין חמשת המסלולים: כל הדרך סלולה, והעונה מוגדרת כ-'כל השנה'.

    היום הראשון חוצה את עמק אלזני עד סיגנאגי, עיר מוקפת חומה מהמאה ה-18 על רכס עם הנוף הטוב ביותר על העמק, ולאחר מכן יורד למנזר בודבה, מקום קבורתה של הקדושה נינו.

    היום השני הוא קפיצה קצרה צפונה לטלאווי, בירת המחוז של קאכתי, הבנויה על מדרגה מעל אותו העמק, ובה ארמון בטוניס ציכה של המלך אירקלה השני ועץ דולב בן תשע מאות שנה.

    היום השלישי הוא יום הנהיגה הארוך ביותר בטיול: אחוזת צינאנדלי המטופחת ומרתף היין ההיסטורי שלה, קתדרלת אלוורדי — כנסייה מהמאה ה-11 שהייתה הבניין הגבוה בגאורגיה משך מאות שנים — ומנהרות מרתפי היין של קוורלי, לפני הנסיעה חזרה לטביליסי.
  tips:
  - כל תחנה במסלול נמצאת על כביש סלול ומתאימה לרכב אקונומי — אין צורך ב-4x4 או בגובה מוגברת.
  - העונה המומלצת היא 'כל השנה' — זהו אחד המסלולים המעטים כאן שפועל היטב גם בחורף.
  - היום השלישי כולל יותר ממחצית זמן הנהיגה של הטיול (כ-4 שעות ו-15 דקות מתוך 8 שעות בסך הכול) — צאו מוקדם אם ברצונכם להספיק בשלוש התחנות.
  - המרתפים בסיגנאגי, בודבה וקוורלי מקבלים מבקרים ללא הזמנה, אך כדאי להזמין מראש טעימה בעונת הבציר (ספטמבר–אוקטובר).
ar:
  name: 'جورجيا في ٣ أيام: طريق كاخيتي للنبيذ'
  short: مسار من ثلاثة أيام من تبليسي عبر كروم العنب والأديرة وأقبية النبيذ في كاخيتي، مع العودة إلى تبليسي كل مساء.
  body: |-
    يبقى هذا المسار القصير بالكامل داخل منطقة واحدة — كاخيتي، شرق تبليسي — ما يجعله الأسهل قيادة من بين المسارات الخمسة: كل الطريق معبد، والموسم المناسب مسجل «طوال السنة».

    يعبر اليوم الأول وادي ألازاني وصولاً إلى سيغناغي، مدينة من القرن الثامن عشر ذات أسوار فوق تلة مطلة على أفضل مناظر الوادي، ثم ينزل إلى دير بودبي، مكان دفن القديسة نينو.

    اليوم الثاني قفزة قصيرة شمالاً إلى تيلافي، العاصمة الإقليمية لكاخيتي، المبنية على مصطبة فوق الوادي نفسه، حيث يقع قصر باتونيس تسيخه للملك إراكلي الثاني وشجرة الدلب التي يبلغ عمرها تسعة قرون.

    اليوم الثالث هو أطول يوم قيادة في الرحلة: ضيعة تسينانداليس المنسقة ومصنع النبيذ التاريخي فيها، كاتدرائية ألافردي — كنيسة من القرن الحادي عشر ظلت أطول مبنى في جورجيا لقرون — وأنفاق أقبية النبيذ في كفاريلي، قبل العودة إلى تبليسي.
  tips:
  - كل محطة على هذا المسار على طريق معبد ومناسبة لسيارة اقتصادية — لا حاجة لدفع رباعي أو ارتفاع أرضي كبير.
  - الموسم المناسب «طوال السنة» — هذا أحد المسارات القليلة هنا التي تعمل براحة في الشتاء أيضاً.
  - يحمل اليوم الثالث أكثر من نصف وقت القيادة في الرحلة (نحو ٤ ساعات و١٥ دقيقة من أصل ٨ ساعات) — انطلقوا مبكراً إذا أردتم وقتاً في المحطات الثلاث.
  - تستقبل أقبية سيغناغي وبودبي وكفاريلي الزوار دون حجز مسبق، لكن يستحق حجز التذوق في موسم القطاف (سبتمبر–أكتوبر) مسبقاً.
