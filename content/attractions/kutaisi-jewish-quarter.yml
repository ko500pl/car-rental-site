ka:
  name: ქუთაისის ებრაული უბანი
  short: სამი სინაგოგა ერთ ქუჩაზე — იმ თემის კვალი, რომელიც 1897 წელს ქუთაისის მოსახლეობის მეათედს შეადგენდა.
  body: >-
    **1897 წელს ქუთაისის ყოველი მეათე მცხოვრები ებრაელი იყო; მათ მიერ აგებული სალოცავები დღესაც დგას —
    სამი მათგანი ერთსა და იმავე ქუჩაზე.** რუსეთის იმპერიის იმ წლის აღწერით, ქალაქში 3 419 ებრაელი ცხოვრობდა,
    მოსახლეობის 10,5 პროცენტი. მათი ქუჩა ბორის გაპონოვის სახელს ატარებს და ძველ საფიჩხიაში, კოლხური შადრევნიდან
    ჩრდილო-აღმოსავლეთით ათიოდე წუთის სავალზეა.


    ყველაზე დიდი 1886 წლის დიდი სინაგოგაა, სიდიდით მეორე საქართველოში: ქვის ფასადი სამთაღიანი არკადით,
    მაღალი თაღოვანი სარკმლები, შიგნით კი კედლიდან ჭერამდე მოხატული დარბაზი. მისი ორი მცირე მეზობლის დათარიღება
    უფრო ძნელია: წყაროები უძველესს 1815 ან 1852 წლით ათარიღებენ, მეორეს — დაახლოებით 1863 ან 1912 წლით.
    მცირე სალოცავი თემის ცოცხალი გულია: აქ ივრითს ასწავლიან, წეს-ჩვეულებებს ასრულებენ და მაცას საკუთარ
    ღუმელებში აცხობენ.


    დიდი სინაგოგის კართან 2014 წელს აღმართული ძეგლი იმ კაცს ეძღვნება, ვის სახელსაც ქუჩა ატარებს. ბორის
    გაპონოვი 1934 წელს ყირიმში, ევპატორიაში დაიბადა და 1941 წელს, შვიდი წლისა, ევაკუაციით ქუთაისში ჩამოვიდა.
    ივრითი ბაბუამ, რაბინმა ასწავლა. გაზეთებში მუშაობდა, თხუთმეტი წელი ივრითის ფრაზეოლოგიურ ლექსიკონს ადგენდა,
    1960-იან წლებში კი რუსთაველის „ვეფხისტყაოსნის“ ივრითზე თარგმნას შეუდგა. თარგმანი 1969 წელს ისრაელში
    გამოიცა და მომდევნო წელს ჩერნიხოვსკის პრემია დაიმსახურა. 1971 წელს გაპონოვი ისრაელში გადასახლდა და
    ერთი წლის შემდეგ, ოცდათვრამეტი წლისა, რამათ-განში გარდაიცვალა.


    მეზობლების უმეტესობა მას გაჰყვა. 1970-იანი და 1990-იანი წლების დიდმა წასვლებმა უბანი ოჯახებისგან დაცალა,
    შენობები კი დარჩა. დღეს ეს ჩვეულებრივი ქუთაისური ქუჩაა — და მასზე რამდენიმე კარი, რომელიც ლოცვისთვის
    ჯერაც იღება.
  tip: >-
    ერთი საათი საკმარისია. ეს სალოცავებია და არა მუზეუმები: კარი ხშირად დაკეტილია და ჯობია ჭიშკართან თავაზიანად
    იკითხოთ. შიგნით მამაკაცები თავს იხურავენ, ყველას მოკრძალებული ჩაცმულობა მოეთხოვება; ფოტოს გადაღებამდე
    ნებართვა ითხოვეთ. პარასკევ საღამოს და შაბათს ნუ მიხვალთ — თემი შაბათს იცავს და სტუმრობა შეუფერებელია.
    საფიჩხიის ვიწრო ქუჩებში მანქანის დაყენება ძნელია, ამიტომ ცენტრში დატოვეთ და ფეხით გაიარეთ. მდინარესთან,
    ათ წუთში, მწვანე ბაზარია — ყველისთვის, ხილისა და ჩურჩხელისთვის.
  route: >-
    თბილისიდან E60 (S1) მაგისტრალით ქუთაისამდე — 231 კმ, ქალაქის საცობების ჩათვლით დაახლოებით სამი საათი
    და ოცი წუთი. ცენტრისკენ აიღეთ გეზი და მანქანა დავით აღმაშენებლის მოედნის, კოლხური შადრევნის მიდამოებში
    დააყენეთ; დღისით ქუჩის ადგილები სწრაფად ივსება. უბანი იქიდან ჩრდილო-აღმოსავლეთით ათიოდე წუთის სავალზეა,
    რიონის იმავე ნაპირზე — ხიდზე გადასვლა არ დაგჭირდება. საწვავი ზესტაფონში ან ქუთაისის შესასვლელთან ჩაასხით.
    ეკონომკლასის მანქანა სავსებით საკმარისია, უბანი კი ფეხით უნდა მოიაროთ.
en:
  name: Kutaisi Jewish Quarter
  short: Three synagogues on one Kutaisi street, left by a community that made up a tenth of the city
    in 1897.
  body: >-
    **In 1897 one Kutaisi resident in ten was Jewish, and the houses of prayer they built still stand,
    three of them on a single street.** The Russian imperial census of that year counted 3,419 Jews in
    the city, 10.5 per cent of its people. Their street is Boris Gaponov Street in old Sapichkhia, a ten-minute
    walk north-east of the Colchis Fountain.


    The largest building is the Great Synagogue of 1886, the second largest in Georgia: a stone facade
    with a triple arcade and tall arched windows, and a hall painted from wall to ceiling. Its two smaller
    neighbours are harder to date: sources give 1815 or 1852 for the oldest, around 1863 or 1912 for the
    other. The smaller house of prayer is the community’s working heart, where Hebrew is taught, rites
    are kept and matzah is baked in its own ovens.


    By the Great Synagogue’s door stands a memorial, raised in 2014, to the man the street is named after.
    Boris Gaponov was born in Yevpatoria, in Crimea, in 1934 and came to Kutaisi in 1941, a seven-year-old
    evacuee. His grandfather, a rabbi, taught him Hebrew. He worked for Kutaisi newspapers, spent fifteen
    years on a Hebrew phraseological dictionary, and in the 1960s set about putting Rustaveli’s *The Knight
    in the Panther’s Skin* into Hebrew. The translation appeared in Israel in 1969 and won the Tchernichovsky
    Prize the following year. Gaponov emigrated in 1971 and died in Ramat Gan a year later, aged thirty-eight.


    Most of his neighbours followed him. The great departures of the 1970s and the 1990s emptied the quarter
    of its families, though not of its buildings. What remains is an ordinary Kutaisi street, and on it
    a few doors that still open for prayer.
  tip: >-
    Allow an hour. These are houses of prayer, not museums: doors are often shut, and the best approach
    is to ask politely at the gate. Men cover their heads inside and everyone dresses modestly; ask before
    taking photographs. Avoid Friday evening and Saturday, when the community keeps the Sabbath and visitors
    are not appropriate. Parking in Sapichkhia’s narrow streets is awkward, so leave the car in the centre
    and walk. The Green Bazaar, ten minutes away by the river, is the place for cheese, fruit and churchkhela.
  route: >-
    Take the E60 (S1) west from Tbilisi to Kutaisi: 231 km, about three hours twenty including city traffic.
    Head for the centre and look for parking around the Colchis Fountain on David Aghmashenebeli Square;
    street spaces fill up during the day. The quarter is a ten-minute walk north-east, on the same bank
    of the Rioni, so there is no bridge to cross. Fuel in Zestaponi or on the approach to Kutaisi. An
    economy car is all you need, and the quarter itself is best seen on foot.
ru:
  name: Еврейский квартал Кутаиси
  short: >-
    Три синагоги на одной улице Кутаиси, оставленные общиной, составлявшей в 1897 году десятую часть городского
    населения.
  body: >-
    **В 1897 году каждый десятый житель Кутаиси был евреем, и молитвенные дома, которые эта община возвела,
    стоят до сих пор — три из них на одной улице.** Российская имперская перепись того года насчитала
    в городе 3419 евреев, 10,5 процента населения. Их улица — улица Бориса Гапонова в старой Сапичхии,
    в десяти минутах пешком к северо-востоку от фонтана «Колхида».


    Самое большое здание — Большая синагога 1886 года, вторая по величине в Грузии: каменный фасад с тройной
    аркадой и высокими арочными окнами, зал, расписанный от стены до потолка. Две её меньшие соседки датировать
    труднее: старшую источники относят к 1815 или 1852 году, другую — примерно к 1863-му или 1912-му.
    Малый молитвенный дом — живое сердце общины: здесь учат иврит, соблюдают обряды и в собственных печах
    выпекают мацу.


    У входа в Большую синагогу стоит памятник, установленный в 2014 году, человеку, чьё имя носит улица.
    Борис Гапонов родился в Евпатории, в Крыму, в 1934 году и в 1941-м, семилетним эвакуированным ребёнком,
    попал в Кутаиси. Его дед, раввин, обучил его ивриту. Он работал в кутаисских газетах, пятнадцать лет
    составлял фразеологический словарь иврита, а в 1960-е годы взялся переложить на иврит «Витязя в тигровой
    шкуре» Руставели. Перевод вышел в Израиле в 1969 году и через год получил премию Черниховского. Гапонов
    эмигрировал в 1971 году и год спустя умер в Рамат-Гане в возрасте тридцати восьми лет.


    Большинство его соседей последовали за ним. Большие волны отъезда 1970-х и 1990-х лишили квартал семей,
    но не зданий. Осталась обычная кутаисская улица, и на ней — несколько дверей, которые всё ещё открываются
    для молитвы.
  tip: >-
    Отведите час. Это молитвенные дома, а не музеи: двери часто закрыты, и лучше всего вежливо спросить
    у ворот. Мужчины покрывают голову внутри, все одеваются скромно; перед фотографированием спрашивайте
    разрешения. Избегайте пятничного вечера и субботы, когда община соблюдает шаббат и визиты неуместны.
    Парковка на узких улицах Сапичхии неудобна, так что оставьте машину в центре и идите пешком. Зелёный
    базар, в десяти минутах ходьбы, у реки, — место для сыра, фруктов и чурчхелы.
  route: >-
    Двигайтесь по трассе E60 (S1) на запад от Тбилиси до Кутаиси: 231 км, около трёх часов двадцати минут
    с учётом городского движения. Направляйтесь в центр и ищите парковку у фонтана «Колхида» на площади
    Давида Строителя; днём места на улицах быстро занимают. Квартал — десять минут пешком к северо-востоку,
    на том же берегу Риони, так что мост переходить не нужно. Заправляйтесь в Зестафони или на подъезде
    к Кутаиси. Хватит автомобиля эконом-класса, а сам квартал лучше смотреть пешком.
fa:
  name: محله یهودیان کوتایسی
  short: سه کنیسه در یک خیابان کوتایسی، بازمانده از جماعتی که در سال ۱۸۹۷ یک‌دهم جمعیت شهر را می‌ساخت.
  body: >-
    **در سال ۱۸۹۷ از هر ده تن ساکن کوتایسی، یکی یهودی بود، و خانه‌های عبادتی که این جماعت برافراشت هنوز
    پابرجایند، سه‌تا از آن‌ها در یک خیابان.** سرشماری امپراتوری روسیه در آن سال ۳۴۱۹ یهودی را در شهر شمرد،
    ۱۰٫۵ درصد از جمعیت آن. خیابانشان خیابان بوریس گاپونوف است در ساپیچخیای کهن، ده دقیقه پیاده در شمال‌شرق
    فوارهٔ کولخیس.


    بزرگ‌ترین بنا کنیسه بزرگ سال ۱۸۸۶ است، دومین کنیسه بزرگ گرجستان: نمایی سنگی با رواقی سه‌طاقه و پنجره‌های
    بلند طاق‌دار، و تالاری که از دیوار تا سقف نگارگری شده است. تاریخ‌گذاری دو همسایهٔ کوچک‌ترش دشوارتر
    است: منابع کهن‌ترین را از ۱۸۱۵ یا ۱۸۵۲ و دیگری را از حدود ۱۸۶۳ یا ۱۹۱۲ می‌دانند. خانه عبادت کوچک‌تر
    قلب تپندهٔ جماعت است، جایی که عبری آموزش داده می‌شود، آیین‌ها نگاه داشته می‌شود و ماتزا در تنورهای
    خودش پخته می‌شود.


    نزدیک در کنیسه بزرگ، یادبودی که در سال ۲۰۱۴ برافراشته شد به یاد کسی است که نام خیابان از او گرفته
    شده. بوریس گاپونوف در سال ۱۹۳۴ در یِوپاتوریا، در کریمه، زاده شد و در سال ۱۹۴۱، کودکی هفت‌ساله و آواره
    از جنگ، به کوتایسی رسید. پدربزرگش که خاخام بود، عبری را به او آموخت. او در روزنامه‌های کوتایسی کار
    کرد، پانزده سال بر واژه‌نامه اصطلاحات عبری کوشید، و در دهه ۱۹۶۰ به برگرداندن «پلنگینه‌پوش» اثر روستاولی
    به زبان عبری پرداخت. این ترجمه در سال ۱۹۶۹ در اسرائیل انتشار یافت و سال پس از آن جایزه چرنیخوفسکی
    را از آن خود کرد. گاپونوف در سال ۱۹۷۱ به اسرائیل مهاجرت کرد و سالی بعد در رامات‌گان، در سی‌وهشت‌سالگی،
    درگذشت.


    بیشتر همسایگانش راه او را دنبال کردند. کوچ‌های بزرگ دهه‌های ۱۹۷۰ و ۱۹۹۰ محله را از خانواده‌هایش خالی
    کرد، هرچند نه از بناهایش. آنچه ماند خیابانی معمولی از کوتایسی است، و بر آن چند در که هنوز به روی نماز
    باز می‌شوند.
  tip: >-
    یک ساعت زمان بگذارید. این‌ها خانه‌های عبادت‌اند، نه موزه: درها غالباً بسته‌اند، و بهترین راه آن است
    که مؤدبانه کنار دروازه بپرسید. مردان در داخل سر خود را می‌پوشانند و همه پوشش محتشمانه دارند؛ پیش از
    عکاسی اجازه بگیرید. از عصر جمعه و روز شنبه بپرهیزید، زمانی که جماعت شبات را نگاه می‌دارد و حضور بازدیدکنندگان
    مناسب نیست. پارک کردن در خیابان‌های تنگ ساپیچخیا دشوار است، پس خودرو را در مرکز شهر بگذارید و پیاده
    بروید. بازار سبز، ده دقیقه آن‌سوتر در کنار رودخانه، جای پنیر، میوه و چورچخلا است.
  route: >-
    از تفلیس بر جاده E60 (S1) به سوی غرب تا کوتایسی حرکت کنید: ۲۳۱ کیلومتر، حدود سه ساعت و بیست دقیقه
    با ترافیک شهری. به سوی مرکز شهر بروید و پارکینگی کنار فوارهٔ کولخیس در میدان داوید آغماشِنبلی بجویید؛
    جاهای پارک کنار خیابان در طول روز پر می‌شوند. محله ده دقیقه پیاده در شمال‌شرق است، بر همان کناره رود
    ریونی، پس نیازی به عبور از پل نیست. در زستافونی یا در راه ورود به کوتایسی سوخت‌گیری کنید. خودرویی
    اقتصادی کافی است، و خود محله را بهتر است پیاده دید.
he:
  name: הרובע היהודי בקוטאיסי
  short: שלושה בתי כנסת ברחוב אחד בקוטאיסי, שהותירה קהילה שהיוותה עשירית מתושבי העיר בשנת 1897.
  body: >-
    **בשנת 1897 היה אחד מכל עשרה תושבי קוטאיסי יהודי, ובתי התפילה שהקהילה הזו בנתה עדיין עומדים על תילם
    — שלושה מהם ברחוב אחד.** מפקד האוכלוסין הקיסרי הרוסי של אותה שנה מנה 3,419 יהודים בעיר, 10.5 אחוזים
    מתושביה. רחובם הוא רחוב בוריס גפונוב שבסאפיצחיה העתיקה, כעשר דקות הליכה צפונית-מזרחית ממזרקת קולכיס.


    הבניין הגדול ביותר הוא בית הכנסת הגדול משנת 1886, השני בגודלו בגאורגיה: חזית אבן עם אכסדרה בת שלוש
    קשתות וחלונות מקושתים גבוהים, ואולם מצויר מהקירות ועד התקרה. את שני שכניו הקטנים קשה יותר לתארך: המקורות
    מייחסים את הוותיק שבהם ל-1815 או ל-1852, ואת האחר לסביבות 1863 או ל-1912. בית התפילה הקטן יותר הוא
    הלב הפועם של הקהילה, שבו מלמדים עברית, שומרים על המנהגים ואופים מצות בתנוריו שלו.


    בפתח בית הכנסת הגדול עומדת אנדרטה, שהוקמה ב-2014, לזכר האיש שעל שמו נקרא הרחוב. בוריס גפונוב נולד
    ביבפטוריה שבחצי האי קרים ב-1934, והגיע לקוטאיסי ב-1941 כפליט מפונה בן שבע. סבו, שהיה רב, לימד אותו
    עברית. הוא עבד בעיתוני קוטאיסי, השקיע חמש עשרה שנה במילון ניבים עברי, ובשנות ה-60 החל להעביר לעברית
    את 'עוטה עור הנמר' של רוסתוולי. התרגום פורסם בישראל ב-1969, וזכה בפרס טשרניחובסקי בשנה שלאחר מכן.
    גפונוב עלה לישראל ב-1971 ונפטר ברמת גן שנה לאחר מכן, בגיל שלושים ושמונה.


    רוב שכניו הלכו בעקבותיו. גלי העלייה הגדולים של שנות ה-70 וה-90 רוקנו את הרובע ממשפחותיו, אך לא מבנייניו.
    מה שנותר הוא רחוב קוטאיסי רגיל, ובו כמה דלתות שעדיין נפתחות לתפילה.
  tip: >-
    הקדישו שעה. אלה בתי תפילה, לא מוזיאונים: הדלתות סגורות פעמים רבות, והדרך הטובה ביותר היא לשאול בעדינות
    בשער. גברים מכסים את ראשם בפנים, וכולם מתלבשים בצניעות; שאלו רשות לפני צילום. הימנעו מליל שישי ומיום
    שבת, כשהקהילה שומרת שבת וביקורים אינם הולמים. קשה למצוא חנייה ברחובות הצרים של סאפיצחיה, לכן השאירו
    את הרכב במרכז ולכו ברגל. השוק הירוק, כעשר דקות משם לצד הנהר, הוא המקום לגבינה, פירות וצ'ורצ'חלה.
  route: >-
    נסעו בכביש E60 (S1) מטביליסי מערבה עד קוטאיסי: 231 ק"מ, כשלוש שעות ועשרים דקות עם תנועת העיר. פנו
    למרכז וחפשו חנייה סביב מזרקת קולכיס בכיכר דוד הבנאי (אגמשנבלי); מקומות הרחוב מתמלאים במהלך היום. הרובע
    הוא כעשר דקות הליכה צפונית-מזרחית, על אותה גדה של הריוני, כך שאין צורך לחצות גשר. תדלקו בזסטפוני או
    בדרך לקוטאיסי. מספיק רכב אקונומי, ואת הרובע עצמו מוטב לראות ברגל.
ar:
  name: الحي اليهودي في كوتايسي
  short: ثلاث كُنُسٍ في شارع واحد بكوتايسي، خلّفتها جماعة كانت تمثّل عُشر سكان المدينة في عام 1897.
  body: >-
    **في عام 1897 كان واحد من كل عشرة من سكان كوتايسي يهوديًا، ولا تزال بيوت الصلاة التي بنتها تلك الجماعة
    قائمة، ثلاثة منها في شارع واحد.** أحصى تعداد الإمبراطورية الروسية في تلك السنة 3419 يهوديًا في المدينة،
    أي 10.5 بالمئة من سكانها. شارعهم هو شارع بوريس غابونوف في سابيتشخيا القديمة، على مسافة عشر دقائق مشيًا
    شمال شرق نافورة كولخيس.


    أكبر مبنى هو الكنيس الكبير الذي بُني عام 1886، ثاني أكبر كنيس في جورجيا: واجهة حجرية ذات رواق ثلاثي
    ونوافذ مقنطرة عالية، وقاعة مزدانة بالرسوم من الجدران حتى السقف. أمّا جاراه الأصغران فتأريخهما أصعب:
    تنسب المصادر أقدمهما إلى 1815 أو 1852، والآخر إلى نحو 1863 أو 1912. وبيت الصلاة الأصغر هو القلب النابض
    للجماعة، حيث تُعلَّم العبرية وتُحفظ الشعائر ويُخبز خبز الفطير (المصّة) في أفرانه الخاصة.


    وعند باب الكنيس الكبير يقف نصب تذكاري، أُقيم عام 2014، للرجل الذي سُمّي الشارع باسمه. وُلد بوريس غابونوف
    في يفباتوريا، في شبه جزيرة القرم، عام 1934، وجاء إلى كوتايسي عام 1941 طفلًا نازحًا في السابعة من عمره.
    علّمه جدّه، وكان حاخامًا، العبرية. عمل في صحف كوتايسي، وأنفق خمس عشرة سنة في إعداد قاموس تعبيرات عبري،
    وفي الستينيات شرع في ترجمة «الفارس في جلد النمر» لروستافيلي إلى العبرية. ظهرت الترجمة في إسرائيل عام
    1969، وفازت بجائزة تشرنيخوفسكي في العام التالي. هاجر غابونوف عام 1971 وتوفي في رامات غان بعد عام،
    عن عمر ناهز الثامنة والثلاثين.


    وسار معظم جيرانه على أثره. فقد أفرغت موجات الهجرة الكبرى في السبعينيات والتسعينيات الحيّ من أسره،
    دون أن تُفرغه من مبانيه. وما تبقّى هو شارع عادي من شوارع كوتايسي، وفيه أبواب قليلة لا تزال تُفتح للصلاة.
  tip: >-
    خصّص ساعة واحدة. هذه بيوت صلاة لا متاحف: الأبواب مغلقة في الغالب، وأفضل ما يمكن فعله هو السؤال بلطف
    عند البوابة. يغطّي الرجال رؤوسهم في الداخل، ويرتدي الجميع لباسًا محتشمًا؛ اطلب الإذن قبل التصوير.
    تجنّب مساء الجمعة ويوم السبت، حين تحفظ الجماعة السبت ولا يكون حضور الزوّار مناسبًا. تصعب مواقف السيارات
    في شوارع سابيتشخيا الضيّقة، فاترك السيارة في وسط المدينة وتابع سيرًا على الأقدام. السوق الأخضر، على
    بُعد عشر دقائق قرب النهر، هو المكان المناسب للجبن والفاكهة والتشورتشخيلا.
  route: >-
    اتبع الطريق E60 (S1) غربًا من تبليسي حتى كوتايسي: 231 كم، نحو ثلاث ساعات وعشرين دقيقة مع ازدحام المدينة.
    توجّه إلى وسط المدينة وابحث عن موقف قرب نافورة كولخيس في ساحة داود أغماشينبيلي؛ تمتلئ مواقف الشارع
    خلال النهار. الحي على مسافة عشر دقائق مشيًا شمال شرق، على الضفة نفسها من نهر ريوني، فلا حاجة لعبور
    جسر. تزوّد بالوقود في زيستافوني أو في الطريق إلى كوتايسي. تكفي سيارة اقتصادية، والحيّ نفسه يُرى أفضل
    ما يكون سيرًا على الأقدام.
