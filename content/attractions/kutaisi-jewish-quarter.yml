ka:
  name: ქუთაისის ებრაული უბანი
  short: ერთი ქუჩა საფიჩხიაში, სადაც სამი სინაგოგა დგას — 1815, 1863 და 1886 წლების.
  body: >-
    **ქუთაისში საქართველოს ერთ-ერთი უდიდესი ებრაული თემი ცხოვრობდა და მისი კვალი ერთ ქუჩაზეა კონცენტრირებული.**
    ბორის გაპონოვის ქუჩა რიონის მარჯვენა ნაპირზე, საფიჩხიის უბანშია; ას მეტრზე ნაკლებ მონაკვეთზე სამი
    სინაგოგა დგას.


    უძველესი, პატარა სინაგოგა 1815 წლისაა — მარტივი ქვის ნაგებობა, თითქმის საცხოვრებელი სახლივით. მეორე
    დაახლოებით 1863 წელს აშენდა. მთავარი, დიდი სინაგოგა 1886 წლისაა და რომანული სტილის მინაბაძით არის
    გადაწყვეტილი: მაღალი თაღოვანი ფანჯრები, ქვის ფასადი, შიგნით კი ხის გალერეა და მოხატული ჭერი. სწორედ
    ეს ნაგებობა მოქმედია დღემდე.


    ქუჩის სახელი ცალკე ისტორიაა. ბორის გაპონოვი ქუთაისელი ებრაელი იყო, რომელმაც რუსთაველის „ვეფხისტყაოსანი“
    ებრაულად თარგმნა — მარტო, ღამის ცვლებში, ადგილობრივი გაზეთის რედაქციაში მუშაობისას. მისი თარგმანი
    ისრაელში 1969 წელს გამოიცა; თავად 1971 წელს გაემგზავრა და მალევე გარდაიცვალა.


    თემი დღეს ძალიან პატარაა: უმეტესობა 1970-იან და 1990-იან წლებში ისრაელში წავიდა. სამაგიეროდ შენობები
    დგას, დიდი სინაგოგა კი კვირაში რამდენჯერმე იხსნება; მეკარე ჩვეულებრივ უშვებს შემსვლელს.


    ეს არ არის „ღირსშესანიშნაობა“ დიდი ექსპოზიციით. ეს ორმოცდაათწუთიანი გასეირნებაა ვიწრო ქუჩაში, სადაც
    ერთმანეთის გვერდით სამი საუკუნის თითქმის მიმდევრობითი შენობებია, და სადაც ქუთაისის ის ნაწილი ჩანს,
    რომელიც სახელმძღვანელოებში იშვიათად ხვდება.


    მოკლე ისტორიული ფონი საჭიროა. ებრაელები საქართველოში ორ ათასწლეულზე მეტია ცხოვრობენ, ქუთაისი კი დიდი
    ხნის განმავლობაში ქართველ ებრაელთა ცხოვრების ცენტრი იყო. XIX საუკუნის ბოლოს ამ უბანში რამდენიმე ათასი
    ადამიანი ცხოვრობდა, თავისი სკოლებით, საცხობებით და თემის დაწესებულებებით; ქუთაისელი ებრაელები ძირითადად
    ვაჭრობით და ხელოსნობით იყვნენ დაკავებულნი. XX საუკუნის ბოლოს ეს სამყარო თითქმის მთლიანად ისრაელში
    გადავიდა.
  tip: >-
    ერთი საათი საკმარისია. დიდი სინაგოგა ყოველთვის ღია არ არის — მეკარეს ეზოში მოძებნი; შესვლისას მამაკაცებს
    თავსაბურავი სჭირდებათ, კიპა კართან დევს. ფოტოს გადაღებამდე ჰკითხე. ქუჩა ვიწროა და ორმხრივია, პარკინგი
    რთულია — ჯობია ცენტრში დატოვო მანქანა და ხიდზე ფეხით გადმოხვიდე, ათი წუთია. კაფეები და ბაზარი ორ კვარტალშია.
    შაბათს თემი მსახურებაზეა და ტურისტული ვიზიტი მიზანშეწონილი არ არის.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე — 231 კმ, დაახლოებით სამი საათი და ოცი წუთი. ქალაქში თეთრ ხიდზე ან ჯაჭვის
    ხიდზე რიონის მარჯვენა ნაპირზე გადადი და საფიჩხიისკენ აიღე; გაპონოვის ქუჩა ბაზრიდან ორ კვარტალშია.
    ცენტრში ქუჩის უფასო პარკინგია, თუმცა დღისით სავსეა. საწვავი ზესტაფონსა და ქუთაისის შესასვლელში აიღე.
    ეკონომ-კლასის ავტომობილი საკმარისია; უბანი მთლიანად ფეხით სავალია.
en:
  name: Kutaisi Jewish Quarter
  short: One street in the Sapichkhia district holding three synagogues, built in 1815, around 1863 and
    1886.
  body: >-
    **Kutaisi had one of the largest Jewish communities in Georgia, and its traces are concentrated on
    a single street.** Boris Gaponov Street runs through the Sapichkhia district on the right bank of
    the Rioni, and within less than a hundred metres it holds three synagogues.


    The oldest, the Small Synagogue, dates from 1815 — plain stone, almost indistinguishable from a house.
    A second was built around 1863. The main one, the Great Synagogue of 1886, is handled in a Romanesque
    Revival manner: tall arched windows, a stone facade, and inside a wooden gallery under a painted ceiling.
    This is the building still in use.


    The street name is a story of its own. Boris Gaponov was a Kutaisi Jew who translated Rustaveli's
    *The Knight in the Panther's Skin* into Hebrew, working alone on night shifts at the local newspaper.
    The translation was published in Israel in 1969; he emigrated in 1971 and died soon after.


    The community today is very small — most families left for Israel in the 1970s and again in the 1990s.
    The buildings remain, and the Great Synagogue opens several times a week; the caretaker will normally
    let visitors in.


    This is not a sight with an exhibition and a ticket desk. It is a fifty-minute walk along a narrow
    street where three buildings from three different centuries stand almost in a row, and where you see
    a part of Kutaisi that rarely reaches the guidebooks.


    A short piece of background helps. Jews have lived in Georgia for more than two thousand years, and
    Kutaisi was for a long period the centre of Georgian Jewish life. By the end of the 19th century the
    quarter around this street held a few thousand people, with its own schools, bakeries and communal
    institutions, most of them trading or working in crafts. In the last decades of the 20th century that
    whole world moved, almost in its entirety, to Israel.
  tip: >-
    An hour covers it. The Great Synagogue is not always open — look for the caretaker in the yard. Men
    need a head covering to go inside; kippot are kept by the door. Ask before photographing. The street
    is narrow and two-way, and parking is awkward, so it is easier to leave the car in the centre and
    walk across the bridge, about ten minutes. Cafes and the market are two blocks away. On Saturdays
    the community is at prayer and a tourist visit is not appropriate.
  route: >-
    Take the E60 west from Tbilisi to Kutaisi — 231 km, about three hours twenty. In the city cross to
    the right bank of the Rioni by the White Bridge or the Chain Bridge and head into Sapichkhia; Gaponov
    Street is two blocks from the market. Street parking in the centre is free but full during the day.
    Fuel is available in Zestaponi and at the entrance to Kutaisi. An economy car is enough, and the quarter
    itself is walked end to end on foot.
ru:
  name: Еврейский квартал Кутаиси
  short: Одна улица в районе Сапичхия, где стоят три синагоги — 1815 года, около 1863-го и 1886-го.
  body: >-
    **В Кутаиси жила одна из крупнейших еврейских общин Грузии, и её следы собраны на одной улице.** Улица
    Бориса Гапонова проходит по правому берегу Риони в районе Сапичхия, и меньше чем на сотне метров здесь
    стоят три синагоги.


    Старейшая, Малая синагога, построена в 1815 году — простой камень, почти неотличимо от жилого дома.
    Вторую возвели около 1863-го. Главная, Большая синагога 1886 года, решена в романском духе: высокие
    арочные окна, каменный фасад, а внутри деревянная галерея под расписным потолком. Именно это здание
    действует до сих пор.


    Название улицы — отдельная история. Борис Гапонов был кутаисским евреем, который перевёл «Витязя в
    тигровой шкуре» Руставели на иврит, работая по ночам в местной газете. Перевод вышел в Израиле в 1969
    году; сам он уехал в 1971-м и вскоре умер.


    Община сегодня очень мала: большинство семей уехали в Израиль в 1970-е и снова в 1990-е. Здания остались,
    Большая синагога открывается несколько раз в неделю, и смотритель обычно пускает посетителей.


    Это не достопримечательность с экспозицией и кассой. Это пятидесятиминутная прогулка по узкой улице,
    где почти подряд стоят постройки трёх разных веков и где видна та часть Кутаиси, которая редко попадает
    в путеводители.


    Немного контекста здесь необходимо. Евреи живут в Грузии больше двух тысяч лет, и Кутаиси долгое время
    был центром грузинско-еврейской жизни. К концу XIX века в квартале вокруг этой улицы жило несколько
    тысяч человек — со своими школами, пекарнями и общинными учреждениями, занятые в основном торговлей
    и ремёслами. В последние десятилетия XX века весь этот мир почти целиком переселился в Израиль.
  tip: >-
    Часа хватает. Большая синагога открыта не всегда — ищите смотрителя во дворе. Мужчинам для входа нужен
    головной убор, кипы лежат у двери. Перед съёмкой спрашивайте. Улица узкая и двусторонняя, парковаться
    неудобно, так что проще оставить машину в центре и перейти мост пешком, минут десять. Кафе и рынок
    в двух кварталах. По субботам община молится, и туристический визит в это время неуместен.
  route: >-
    Из Тбилиси по E60 до Кутаиси — 231 км, около трёх часов двадцати минут. В городе переезжайте на правый
    берег Риони по Белому или Цепному мосту и направляйтесь в Сапичхию; улица Гапонова в двух кварталах
    от рынка. Парковка вдоль улиц в центре бесплатная, но днём занята. Заправки есть в Зестафони и на
    въезде в Кутаиси. Машины эконом-класса достаточно, а сам квартал проходится пешком из конца в конец.
fa:
  name: محلهٔ یهودیان کوتایسی
  short: یک خیابان در محلهٔ ساپیچخیا با سه کنیسه، ساخته‌شده در ۱۸۱۵، حدود ۱۸۶۳ و ۱۸۸۶.
  body: >-
    **کوتایسی یکی از بزرگ‌ترین جماعت‌های یهودی گرجستان را داشت و نشانه‌هایش در یک خیابان متمرکز است.**
    خیابان بوریس گاپونوف در محلهٔ ساپیچخیا و بر کرانهٔ راست ریونی کشیده شده، و در کمتر از صد متر سه کنیسه
    در آن ایستاده است.


    کهن‌ترین، کنیسهٔ کوچک، به ۱۸۱۵ بازمی‌گردد؛ سنگی ساده و تقریباً شبیه یک خانهٔ مسکونی. دومی حدود ۱۸۶۳
    ساخته شد. اصلی‌ترین، کنیسهٔ بزرگ سال ۱۸۸۶، به شیوهٔ احیای رومانسک پرداخته شده است: پنجره‌های قوسی
    بلند، نمای سنگی، و در درون بالکنی چوبی زیر سقفی نقاشی‌شده. همین بنا هنوز در استفاده است.


    نام خیابان خود داستانی است. بوریس گاپونوف یهودی اهل کوتایسی بود که منظومهٔ «پلنگینه‌پوش» روستاولی
    را به عبری برگرداند، تنها و در شیفت‌های شب روزنامهٔ محلی. ترجمه در ۱۹۶۹ در اسرائیل منتشر شد؛ او در
    ۱۹۷۱ مهاجرت کرد و اندکی بعد درگذشت.


    جماعت امروز بسیار کوچک است: بیشتر خانواده‌ها در دههٔ ۱۹۷۰ و بار دیگر در دههٔ ۱۹۹۰ به اسرائیل رفتند.
    ساختمان‌ها مانده‌اند و کنیسهٔ بزرگ چند بار در هفته باز می‌شود؛ سرایدار معمولاً بازدیدکننده را راه
    می‌دهد.


    اینجا دیدنی‌ای با نمایشگاه و باجهٔ بلیت نیست. پنجاه دقیقه قدم زدن در خیابانی باریک است که سه بنا از
    سه سدهٔ مختلف تقریباً پشت سر هم در آن ایستاده‌اند، و بخشی از کوتایسی را نشان می‌دهد که کمتر به راهنماها
    راه می‌یابد.


    کمی پیشینه لازم است. یهودیان بیش از دو هزار سال است در گرجستان زندگی می‌کنند و کوتایسی مدتی دراز مرکز
    زندگی یهودیان گرجی بود. تا پایان سدهٔ نوزدهم محلهٔ پیرامون این خیابان چند هزار نفر را در خود داشت،
    با مدرسه‌ها و نانوایی‌ها و نهادهای جماعتی خود، که بیشترشان به بازرگانی و پیشه‌وری مشغول بودند. در
    دهه‌های پایانی سدهٔ بیستم این جهان تقریباً یکسره به اسرائیل کوچید.
  tip: >-
    یک ساعت کافی است. کنیسهٔ بزرگ همیشه باز نیست؛ سرایدار را در حیاط بجویید. مردان برای ورود به پوشش سر
    نیاز دارند و کیپا کنار در گذاشته شده است. پیش از عکس گرفتن بپرسید. خیابان باریک و دوطرفه است و پارک
    کردن دشوار، پس آسان‌تر است خودرو را در مرکز بگذارید و پل را پیاده بگذرید، حدود ده دقیقه. کافه و بازار
    دو بلوک آن‌سوترند. شنبه‌ها جماعت در نماز است و بازدید گردشگری در آن روز مناسب نیست.
  route: >-
    از تفلیس با بزرگراه E60 تا کوتایسی — ۲۳۱ کیلومتر، حدود سه ساعت و بیست دقیقه. در شهر از پل سفید یا
    پل زنجیری به کرانهٔ راست ریونی بروید و به سوی ساپیچخیا برانید؛ خیابان گاپونوف دو بلوک با بازار فاصله
    دارد. پارک کنار خیابان در مرکز رایگان است اما در روز پر می‌شود. سوخت در زستافونی و ورودی کوتایسی هست.
    خودروی اقتصادی کافی است و خود محله را سر تا سر پیاده می‌روید.
he:
  name: הרובע היהודי של קוטאיסי
  short: רחוב אחד ברובע ספיצ'חיה ובו שלושה בתי כנסת, משנת 1815, מסביבות 1863 ומשנת 1886.
  body: >-
    **בקוטאיסי חיה אחת הקהילות היהודיות הגדולות בגאורגיה, ועקבותיה מרוכזים ברחוב אחד.** רחוב בוריס גפונוב
    עובר ברובע ספיצ'חיה שעל הגדה הימנית של הריוני, ובפחות ממאה מטר עומדים בו שלושה בתי כנסת.


    העתיק שבהם, בית הכנסת הקטן, הוא משנת 1815 — אבן פשוטה, כמעט בלתי מובחן מבית מגורים. השני נבנה בסביבות
    1863. המרכזי, בית הכנסת הגדול משנת 1886, עוצב בנוסח רומנסקי מחודש: חלונות קשתיים גבוהים, חזית אבן,
    ובפנים יציע עץ מתחת לתקרה מצוירת. זהו המבנה שעדיין פעיל.


    שם הרחוב הוא סיפור בפני עצמו. בוריס גפונוב היה יהודי מקוטאיסי שתרגם לעברית את "עוטה עור הנמר" לרוסתוולי,
    בעבודה לילית ובודדה במערכת העיתון המקומי. התרגום ראה אור בישראל ב-1969; הוא עלה ארצה ב-1971 ונפטר
    זמן קצר לאחר מכן.


    הקהילה היום קטנה מאוד: רוב המשפחות עלו לישראל בשנות השבעים ושוב בשנות התשעים. המבנים נותרו, ובית הכנסת
    הגדול נפתח כמה פעמים בשבוע; השמש בדרך כלל מכניס מבקרים.


    זה אינו אתר עם תצוגה וקופה. זו הליכה של חמישים דקות ברחוב צר שבו עומדים כמעט ברצף שלושה מבנים משלוש
    מאות שונות, ושבו נגלה חלק מקוטאיסי שכמעט אינו מגיע למדריכים.


    מעט רקע נחוץ כאן. יהודים חיים בגאורגיה יותר מאלפיים שנה, וקוטאיסי הייתה במשך תקופה ארוכה מרכז החיים
    היהודיים בגאורגיה. לקראת סוף המאה ה-19 חיו ברובע שסביב הרחוב הזה כמה אלפי אנשים, עם בתי ספר, מאפיות
    ומוסדות קהילה משלהם, ורובם עסקו במסחר ובמלאכה. בעשורים האחרונים של המאה ה-20 עבר העולם הזה כמעט כולו
    לישראל.
  tip: >-
    שעה מספיקה. בית הכנסת הגדול אינו פתוח תמיד — חפשו את השמש בחצר. גברים זקוקים לכיסוי ראש לכניסה, וכיפות
    מונחות ליד הדלת. שאלו לפני צילום. הרחוב צר ודו־סטרי והחניה מסובכת, לכן נוח יותר להשאיר את הרכב במרכז
    ולחצות את הגשר ברגל, כעשר דקות. בתי קפה והשוק שני בלוקים משם. בשבת הקהילה בתפילה וביקור תיירותי אינו
    מתאים.
  route: >-
    מטביליסי בכביש E60 מערבה עד קוטאיסי — 231 ק״מ, כשלוש שעות ועשרים דקות. בעיר חוצים לגדה הימנית של הריוני
    בגשר הלבן או בגשר השרשרת ופונים לספיצ'חיה; רחוב גפונוב שני בלוקים מן השוק. החניה ברחובות המרכז חינם
    אך תפוסה במשך היום. דלק יש בזסטפוני ובכניסה לקוטאיסי. רכב חסכוני מספיק, ואת הרובע עצמו עוברים ברגל
    מקצה לקצה.
ar:
  name: الحي اليهودي في كوتايسي
  short: شارع واحد في حي سابيتشخيا تقوم فيه ثلاثة معابد يهودية، بُنيت عام 1815 ونحو 1863 و1886.
  body: >-
    **كان في كوتايسي واحدة من أكبر الجاليات اليهودية في جورجيا، وآثارها متركزة في شارع واحد.** يمتد شارع
    بوريس غابونوف في حي سابيتشخيا على الضفة اليمنى لنهر ريوني، وفي أقل من مئة متر تقوم فيه ثلاثة معابد.


    أقدمها المعبد الصغير ويعود إلى 1815 — حجر بسيط لا يكاد يُميَّز عن بيت سكني. وبُني الثاني نحو 1863.
    أما الرئيسي، المعبد الكبير لعام 1886، فعُولج بأسلوب الإحياء الرومانسكي: نوافذ مقوسة عالية وواجهة حجرية،
    وفي الداخل شرفة خشبية تحت سقف مرسوم. وهذا هو المبنى الذي ما زال قيد الاستعمال.


    واسم الشارع حكاية قائمة بذاتها. كان بوريس غابونوف يهودياً من كوتايسي ترجم ملحمة روستافيلي «الفارس
    في جلد النمر» إلى العبرية، وحده وفي نوبات ليلية في الصحيفة المحلية. صدرت الترجمة في إسرائيل عام 1969؛
    وهاجر هو عام 1971 وتوفي بعد ذلك بقليل.


    الجالية اليوم صغيرة جداً: غادر معظم العائلات إلى إسرائيل في السبعينيات ثم في التسعينيات. بقيت المباني،
    ويفتح المعبد الكبير عدة مرات في الأسبوع، ويسمح الحارس عادةً للزائرين بالدخول.


    ليس هذا معلماً بمعرض وشباك تذاكر. إنه تجوال خمسين دقيقة في شارع ضيق تقف فيه ثلاثة مبانٍ من ثلاثة قرون
    مختلفة في صف واحد تقريباً، ويظهر منه جزء من كوتايسي نادراً ما يبلغ الأدلة السياحية.


    قليل من الخلفية ضروري هنا. عاش اليهود في جورجيا أكثر من ألفي عام، وكانت كوتايسي زمناً طويلاً مركز
    الحياة اليهودية الجورجية. وبنهاية القرن التاسع عشر ضم الحي المحيط بهذا الشارع بضعة آلاف من الناس،
    بمدارسهم ومخابزهم ومؤسساتهم الأهلية، وأكثرهم في التجارة والحرف. وفي العقود الأخيرة من القرن العشرين
    انتقل هذا العالم كله تقريباً إلى إسرائيل.
  tip: >-
    ساعة تكفي. المعبد الكبير ليس مفتوحاً دائماً، فابحث عن الحارس في الفناء. ويحتاج الرجال إلى غطاء رأس
    للدخول، والقلنسوات موضوعة عند الباب. اسأل قبل التصوير. الشارع ضيق وباتجاهين والوقوف فيه متعب، فالأسهل
    ترك السيارة في المركز وعبور الجسر سيراً، نحو عشر دقائق. المقاهي والسوق على بعد مربعين. وأيام السبت
    تكون الجالية في الصلاة ولا تناسب الزيارة السياحية.
  route: >-
    من تبليسي على الطريق E60 غرباً حتى كوتايسي — 231 كم، نحو ثلاث ساعات وعشرين دقيقة. في المدينة اعبر
    إلى الضفة اليمنى لنهر ريوني من الجسر الأبيض أو الجسر السلسلي واتجه إلى سابيتشخيا؛ شارع غابونوف على
    بعد مربعين من السوق. الوقوف في شوارع المركز مجاني لكنه ممتلئ نهاراً. الوقود متوفر في زستافوني وعند
    مدخل كوتايسي. وتكفي سيارة اقتصادية، والحي نفسه يُقطع سيراً من طرفه إلى طرفه.
