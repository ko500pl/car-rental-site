ka:
  name: გურიანთის მემორიალური მუზეუმი
  short: >-
    სოფლის მუზეუმი ოზურგეთთან: ნეოლითური კაჟი, ადრეშუასაუკუნეობრივი ვაშნარის ნაშთები და ქვის ვერძი — სოფელში,
    რომელმაც, შესაძლოა, გურიას სახელი დაარქვა.
  body: >-
    **თუ ისტორიკოსი ნიკოლოზ ბერძენიშვილი მართალი იყო, მთელმა გურიამ სახელი სწორედ ამ სოფლისგან მიიღო.**


    გურიანთა ოზურგეთიდან ხუთ კილომეტრში, ურეკის გზაზე, ბჟუჟისა და ნატანების შესართავთან ახლოს მდებარეობს.
    აქ ადამიანი ჯერ კიდევ ახალ ქვის ხანაში ცხოვრობდა: მდინარე სკურდუმის მარჯვენა ნაპირზე ნეოლითური ნამოსახლარია
    აღმოჩენილი. V–VIII საუკუნეებში სკურდუმისა და ნატანების შესართავთან ციხე-ქალაქი ვაშნარი იდგა, და ბერძენიშვილის
    აზრით, სწორედ ის იყო მაშინდელი გურიის ცენტრი. გვიან შუა საუკუნეებში ვაშნარი ნაკაშიძეთა სათავადოს ზამთრის
    რეზიდენცია გახდა.


    მემორიალური მუზეუმი 1983 წელს დაარსდა. დღეს ის ოზურგეთის ისტორიული მუზეუმის ფილიალია, დვაბზუს ეთნოგრაფიულ
    მუზეუმთან და ლიხაურის ექვთიმე თაყაიშვილის სახელობის არქეოლოგიურ მუზეუმთან ერთად. დარბაზები პატარაა,
    ამბავი კი — ადგილობრივი: 1963 წელს გურიანთა-ციხისფერდის უბანში, სკურდუმის ბორცვზე, გათხრებისას ნაპოვნი
    გვიანი ნეოლითის კაჟისა და რიყის ქვის იარაღები, ვაშნარის ციხე-ქალაქის მასალები, ციხისფერდში აღმოჩენილი
    ქვის ვერძის ქანდაკება, გურული სახლის სახით მოწყობილი დარბაზი და სოფლის ცხოვრების ამსახველი ფოტოები
    და ხელნაწერები.


    ნახევარი საათი დაუთმეთ და იგრძნობთ, რა ღრმად მიდის მიწა ჩვეულებრივი გურული სოფლის ქვეშ. 1949 წელს
    ვაშნარის ნანგრევებზე ჩაის ფაბრიკა ააშენეს. ძველი ქალაქიდან რაც დარჩა, აქ ინახება — კაჟში, ნატეხებსა
    და ერთ მომთმენ ქვის ვერძში.
  tip: >-
    ამ ფილიალის სამუშაო საათები ცალკე არსად ქვეყნდება. დედა-მუზეუმი ოზურგეთში ყოველდღე 10:00-დან 18:00-მდეა
    ღია და შესვლა უფასოა, მაგრამ ნუ ჩათვლით, რომ სოფლის ფილიალიც იმავე განრიგით მუშაობს: გამგზავრებამდე
    ოზურგეთის ისტორიულ მუზეუმში დარეკეთ. გადაღებამდე თანამშრომლებს ჰკითხეთ. სადილად ოზურგეთს დაუბრუნდით.
    გურიანთა ოზურგეთსა და ურეკის პლაჟს შორის, ერთსა და იმავე გზაზეა, ამიტომ ზღვისკენ მიმავალ დღეს იოლად
    ჩაერთვება. თუ წარსულმა გაგიტაცათ, დანარჩენი ორი ფილიალი, დვაბზუსა და ლიხაურში, სურათს შეავსებს.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის, ხაშურისა და ქუთაისის გავლით, სამტრედიამდე იარეთ, იქიდან
    კი S12-ით ლანჩხუთამდე. ლანჩხუთის გავლისთანავე S12-დან შ82-ზე გადაუხვიეთ და სამხრეთით, ოზურგეთისკენ,
    დაახლოებით 25 კილომეტრი იარეთ. ქალაქის განაპირას შ46-ზე — ოზურგეთი–ნატანები–ურეკის გზაზე — გადადით
    და დასავლეთით გურიანთამდე გაჰყევით; ოზურგეთიდან დაახლოებით 5 კილომეტრია. გზა ბოლომდე ასფალტია, ეკონომკლასის
    მანქანაც სავსებით საკმარისია. სულ დაახლოებით 314 კმ და 4 საათი და 40 წუთი. საწვავი სამტრედიაში, ლანჩხუთში
    ან ოზურგეთში ჩაასხით. ზღვიდან მომავალთათვის გურიანთა იმავე შ46-ზეა, ურეკიდან ხმელეთისკენ.
en:
  name: Gurianta Memorial Museum
  short: >-
    A small village museum near Ozurgeti: Neolithic flints, finds from early-medieval Vashnari and a stone
    ram, in the village that may have named Guria.
  body: >-
    **If the historian Niko Berdzenishvili was right, the whole province of Guria took its name from this
    village.**


    Gurianta lies five kilometres west of Ozurgeti on the road to Ureki, close to where the Bzhuzhi and
    Natanebi rivers meet. People lived here in the New Stone Age, and a Neolithic settlement has been
    found on the right bank of the Skurdumi. Between the fifth and eighth centuries the fortified town
    of Vashnari stood where the Skurdumi joins the Natanebi, and Berdzenishvili argued that it was then
    the centre of Guria. In the late Middle Ages Vashnari became the winter residence of the Nakashidze
    princes.


    The memorial museum was founded in 1983. Today it is a branch of the Ozurgeti History Museum, alongside
    the ethnographic museum in Dvabzu and the Ekvtime Takaishvili archaeological museum in Likhauri. The
    rooms are small and the story is local. There are late-Neolithic tools of flint and river stone, dug
    up in 1963 on a hill by the Skurdumi, and finds from Vashnari. There is a stone sculpture of a ram
    found in neighbouring Tsikhisperdi. One hall is arranged as a Gurian house, and the others hold photographs
    and manuscripts from village life.


    Give it half an hour and you will feel how deep the ground runs under an ordinary Gurian village.
    In 1949 a tea factory was built on the ruins of Vashnari. What remains of the older town is kept here,
    in flint, in fragments and in one patient stone ram.
  tip: >-
    This branch does not publish its own opening hours. The parent Ozurgeti History Museum is open daily
    from 10:00 to 18:00 with free entry, but don't assume the village branch keeps the same schedule,
    and phone the Ozurgeti museum before you drive out. Ask the staff before taking photographs. For food,
    head back to Ozurgeti. Gurianta sits on the road between Ozurgeti and the beach at Ureki, so it slips
    easily into a coast day. The other two branches, in Dvabzu and Likhauri, complete the set if the past
    has caught you.
  route: >-
    From Tbilisi take the E60/S1 west past Gori, Khashuri and Kutaisi to Samtredia, then the S12 to Lanchkhuti.
    Just past Lanchkhuti leave the S12 for the Sh82 and follow it south for about 25 km towards Ozurgeti.
    On the edge of town join the Sh46, the Ozurgeti–Natanebi–Ureki road, and follow it west to Gurianta,
    about 5 km from Ozurgeti. It is asphalt all the way, and an economy car is all you need. Allow about
    314 km and 4 hours 40 minutes. Refuel in Samtredia, Lanchkhuti or Ozurgeti. From the coast, Gurianta
    lies on the same Sh46, inland from Ureki.
ru:
  name: Мемориальный музей Гурианты
  short: >-
    Маленький сельский музей у Озургети: неолитические кремни, находки из раннесредневекового Вашнари
    и каменный баран — в селе, что, возможно, дало имя Гурии.
  body: >-
    **Если историк Нико Бердзенишвили был прав, то вся Гурия получила своё имя от этого села.**


    Гурианта лежит в пяти километрах к западу от Озургети, на дороге в Уреки, недалеко от слияния Бжужи
    и Натанеби. Люди жили здесь ещё в новом каменном веке: на правом берегу Скурдуми найдено неолитическое
    поселение. С V по VIII век там, где Скурдуми впадает в Натанеби, стоял укреплённый город Вашнари,
    и Бердзенишвили считал, что тогда он был центром Гурии. В позднее Средневековье Вашнари стал зимней
    резиденцией князей Накашидзе.


    Мемориальный музей основан в 1983 году. Сегодня это филиал Озургетского исторического музея — наряду
    с этнографическим музеем в Двабзу и археологическим музеем имени Эквтиме Такаишвили в Лихаури. Залы
    небольшие, и история в них местная. Здесь есть поздненеолитические орудия из кремня и речного камня,
    найденные в 1963 году на холме у Скурдуми, и находки из Вашнари. Есть каменная скульптура барана из
    соседнего Цихисперди. Один зал обставлен как гурийский дом, в остальных — фотографии и рукописи из
    сельской жизни.


    Проведите здесь полчаса — и почувствуете, как глубоко уходит земля под самым обычным гурийским селом.
    В 1949 году на руинах Вашнари построили чайную фабрику. То, что осталось от старого города, хранится
    здесь: в кремне, во фрагментах и в одном терпеливом каменном баране.
  tip: >-
    Собственного расписания этот филиал не публикует. Головной Озургетский исторический музей открыт ежедневно
    с 10:00 до 18:00, вход свободный, но не рассчитывайте, что сельский филиал работает так же: прежде
    чем ехать, позвоните в музей в Озургети. Перед тем как фотографировать, спросите разрешения у сотрудников.
    Поесть лучше вернуться в Озургети. Гурианта стоит на дороге между Озургети и пляжем Уреки, так что
    её легко вписать в день у моря. Два других филиала, в Двабзу и Лихаури, дополнят картину, если прошлое
    вас увлекло.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори, Хашури и Кутаиси до Самтредиа, затем по S12 до Ланчхути.
    Сразу за Ланчхути сверните с S12 на Sh82 и поезжайте по ней на юг к Озургети около 25 км. На окраине
    города выезжайте на Sh46 — дорогу Озургети — Натанеби — Уреки — и следуйте по ней на запад до Гурианты,
    примерно в 5 км от Озургети. Асфальт на всём пути, достаточно машины эконом-класса. Рассчитывайте
    примерно на 314 км и 4 часа 40 минут. Заправиться можно в Самтредиа, Ланчхути или Озургети. С побережья
    Гурианта — на той же Sh46, чуть вглубь суши от Уреки.
fa:
  name: موزهٔ یادمانی گوریانتا
  short: >-
    موزهٔ روستایی کوچکی نزدیک اوزورگتی: سنگ‌چخماق‌های نوسنگی، یافته‌هایی از واشناریِ آغاز سده‌های میانه
    و قوچی سنگی، در روستایی که شاید نامش را به گوریا داده است.
  body: >-
    **اگر حق با نیکو بردزنیشویلیِ تاریخ‌نگار بوده باشد، سراسر ایالت گوریا نامش را از همین روستا گرفته
    است.**


    گوریانتا پنج کیلومتر در غرب اوزورگتی، بر سر راه اورکی، نزدیک محل به‌هم‌پیوستن رودهای بژوژی و ناتانبی
    قرار دارد. انسان در عصر نوسنگی در اینجا می‌زیسته و سکونتگاهی نوسنگی بر کرانهٔ راست رود اسکوردومی یافته‌اند.
    از سدهٔ پنجم تا هشتم، شهر باروداری به نام واشناری در جایی برپا بود که اسکوردومی به ناتانبی می‌ریزد،
    و بردزنیشویلی بر این باور بود که این شهر در آن روزگار مرکز گوریا بوده است. در اواخر سده‌های میانه،
    واشناری اقامتگاه زمستانی شاهزادگان ناکاشیدزه شد.


    موزهٔ یادمانی در سال ۱۹۸۳ بنیاد نهاده شد. امروز شعبه‌ای از موزهٔ تاریخ اوزورگتی است، در کنار موزهٔ
    مردم‌نگاری دوابزو و موزهٔ باستان‌شناسی اکوتیمه تاکایشویلی در لیخائوری. تالارها کوچک‌اند و داستان،
    داستانی محلی است. ابزارهایی از اواخر عصر نوسنگی، از سنگ چخماق و سنگ رودخانه، اینجاست که در سال ۱۹۶۳
    بر تپه‌ای کنار اسکوردومی از خاک بیرون آمدند، و نیز یافته‌هایی از واشناری. تندیس سنگیِ قوچی هم هست
    که در تسیخیسپردیِ همسایه پیدا شده. یکی از تالارها به شکل خانه‌ای گوریایی چیده شده و در دیگر تالارها
    عکس‌ها و دست‌نوشته‌هایی از زندگی روستا به نمایش درآمده است.


    نیم ساعت وقت بگذارید تا حس کنید زمین زیر یک روستای معمولی گوریایی تا چه ژرفایی می‌رود. در سال ۱۹۴۹
    کارخانهٔ چایی بر ویرانه‌های واشناری ساختند. آنچه از آن شهر کهن مانده، اینجا نگهداری می‌شود: در سنگ
    چخماق، در تکه‌پاره‌ها، و در قوچی سنگی و شکیبا.
  tip: >-
    این شعبه ساعت کاری خود را اعلام نمی‌کند. موزهٔ تاریخ اوزورگتی، موزهٔ اصلی، هر روز از ۱۰:۰۰ تا ۱۸:۰۰
    باز است و ورودش رایگان است، اما گمان نکنید شعبهٔ روستایی هم همان برنامه را دارد؛ پیش از راه افتادن
    به موزهٔ اوزورگتی زنگ بزنید. پیش از عکاسی از کارکنان اجازه بگیرید. برای غذا به اوزورگتی برگردید. گوریانتا
    سر راه اوزورگتی به ساحل اورکی است، پس به‌راحتی در یک روز کنار دریا جا می‌گیرد. اگر گذشته دلتان را
    برد، دو شعبهٔ دیگر در دوابزو و لیخائوری مجموعه را کامل می‌کنند.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب بروید و از کنار گوری، خاشوری و کوتایسی تا سامترِدیا پیش بروید،
    سپس با S12 تا لانچخوتی. کمی پس از لانچخوتی از S12 به Sh82 بپیچید و آن را حدود ۲۵ کیلومتر رو به جنوب
    به سوی اوزورگتی دنبال کنید. در حاشیهٔ شهر وارد Sh46، جادهٔ اوزورگتی–ناتانبی–اورکی، شوید و آن را رو
    به غرب تا گوریانتا، حدود ۵ کیلومتری اوزورگتی، دنبال کنید. تمام راه آسفالت است و خودروی اقتصادی کاملاً
    کافی است. حدود ۳۱۴ کیلومتر و ۴ ساعت و ۴۰ دقیقه در نظر بگیرید. در سامترِدیا، لانچخوتی یا اوزورگتی سوخت
    بزنید. اگر از ساحل می‌آیید، گوریانتا بر همین Sh46، در مسیر اورکی به سوی اوزورگتی، قرار دارد.
he:
  name: מוזיאון הזיכרון בגוריאנטה
  short: >-
    מוזיאון כפרי קטן ליד אוזורגטי: כלי צור מהתקופה הנאוליתית, ממצאים מוואשנארי של ימי הביניים המוקדמים
    ואיל מאבן – בכפר שאולי נתן את שמו לגוריה.
  body: >-
    **אם ההיסטוריון ניקו ברדזנישווילי צדק, חבל גוריה כולו קיבל את שמו מהכפר הזה.**


    גוריאנטה שוכנת חמישה קילומטרים מערבית לאוזורגטי, על הדרך לאורקי, סמוך למקום שבו נפגשים הנהרות בז'וז'י
    ונטנבי. בני אדם חיו כאן כבר בתקופת האבן החדשה, ועל הגדה הימנית של נהר סקורדומי נמצא יישוב נאוליתי.
    בין המאה החמישית למאה השמינית עמדה העיר המבוצרת ואשנארי במקום שבו הסקורדומי נשפך לנטנבי, וברדזנישווילי
    טען שבאותה תקופה היא הייתה מרכזה של גוריה. בשלהי ימי הביניים הפכה ואשנארי למעון החורף של נסיכי בית
    נקשידזה.


    מוזיאון הזיכרון נוסד ב-1983. כיום הוא שלוחה של המוזיאון ההיסטורי של אוזורגטי, לצד המוזיאון האתנוגרפי
    בדוואבזו והמוזיאון הארכאולוגי על שם אקוותימה טקאישווילי בליחאורי. החדרים קטנים והסיפור מקומי. יש כאן
    כלים מסוף התקופה הנאוליתית, עשויים צור ואבני נהר, שנחשפו ב-1963 על גבעה ליד הסקורדומי, וממצאים מוואשנארי.
    יש פסל אבן של איל שנמצא בציחיספרדי השכנה. אחד האולמות מסודר כבית גוריאני, ובאחרים מוצגים תצלומים וכתבי
    יד מחיי הכפר.


    הקדישו לו חצי שעה ותרגישו עד כמה עמוקה האדמה שמתחת לכפר גוריאני רגיל. ב-1949 נבנה מפעל תה על חורבות
    ואשנארי. מה שנותר מהעיר העתיקה שמור כאן: בצור, בשברים ובאיל אבן אחד וסבלני.
  tip: >-
    השלוחה הזאת אינה מפרסמת שעות פתיחה משלה. מוזיאון האם, המוזיאון ההיסטורי של אוזורגטי, פתוח מדי יום
    מ-10:00 עד 18:00 והכניסה אליו חופשית, אבל אל תניחו שהשלוחה הכפרית פועלת באותן שעות, והתקשרו למוזיאון
    באוזורגטי לפני שאתם יוצאים. שאלו את הצוות לפני שאתם מצלמים. לארוחה חזרו לאוזורגטי. גוריאנטה נמצאת
    על הדרך בין אוזורגטי לחוף אורקי, כך שקל לשלב אותה ביום של ים. שתי השלוחות האחרות, בדוואבזו ובליחאורי,
    ישלימו את התמונה אם העבר שבה אתכם.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני גורי, חשורי וקוטאיסי עד סמטרדיה, ואז בכביש S12 עד לנצ׳חותי.
    מיד אחרי לנצ׳חותי צאו מכביש S12 אל כביש Sh82 והמשיכו בו דרומה כ-25 ק״מ לכיוון אוזורגטי. בקצה העיר
    עלו על כביש Sh46, דרך אוזורגטי–נטנבי–אורקי, והמשיכו בו מערבה עד גוריאנטה, כ-5 ק״מ מאוזורגטי. הדרך
    סלולה לכל אורכה, ורכב אקונומי הוא כל מה שצריך. חשבו על כ-314 ק״מ ו-4 שעות ו-40 דקות. תדלקו בסמטרדיה,
    בלנצ׳חותי או באוזורגטי. מהחוף, גוריאנטה נמצאת על אותו כביש Sh46, בדרך מאורקי אל פנים הארץ.
ar:
  name: متحف غوريانتا التذكاري
  short: >-
    متحف قروي صغير قرب أوزورغيتي: أدوات صوّان من العصر الحجري الحديث، ولُقى من فاشناري في مطلع العصور
    الوسطى، وكبش من حجر، في قرية ربما أعطت اسمها لغوريا.
  body: >-
    **إن كان المؤرخ نيكو بيردزينيشفيلي محقاً، فإن إقليم غوريا كله أخذ اسمه من هذه القرية.**


    تقع غوريانتا على بُعد خمسة كيلومترات غرب أوزورغيتي على الطريق إلى أوريكي، قرب ملتقى نهري بجوجي وناتانيبي.
    سكن البشر هنا منذ العصر الحجري الحديث، وقد عُثر على مستوطنة من ذلك العصر على الضفة اليمنى لنهر سكوردومي.
    وبين القرنين الخامس والثامن قامت مدينة فاشناري المحصّنة حيث يصبّ سكوردومي في ناتانيبي، ورأى بيردزينيشفيلي
    أنها كانت آنذاك مركز غوريا. وفي أواخر العصور الوسطى صارت فاشناري المقرّ الشتوي لأمراء ناكاشيدزه.


    تأسس المتحف التذكاري عام 1983. وهو اليوم فرع من متحف أوزورغيتي التاريخي، إلى جانب المتحف الإثنوغرافي
    في دفابزو ومتحف إكفتيمه تاكايشفيلي الأثري في ليخاوري. القاعات صغيرة والحكاية محلية. هنا أدوات من أواخر
    العصر الحجري الحديث مصنوعة من الصوّان وحجارة النهر، استُخرجت عام 1963 من تلة قرب سكوردومي، ولُقى من
    فاشناري. وهناك تمثال حجري لكبش عُثر عليه في قرية تسيخيسبيردي المجاورة. وقد رُتّبت إحدى القاعات على
    هيئة بيت غوري، فيما تضم القاعات الأخرى صوراً ومخطوطات من حياة القرية.


    امنحه نصف ساعة، وستشعر بمدى عمق الأرض تحت قرية غورية عادية. في عام 1949 بُني مصنع للشاي فوق أطلال
    فاشناري. وما بقي من المدينة القديمة محفوظ هنا: في الصوّان، وفي الشظايا، وفي كبش حجري واحد صبور.
  tip: >-
    لا يعلن هذا الفرع مواعيد عمل خاصة به. أما المتحف الأم، متحف أوزورغيتي التاريخي، فيفتح يومياً من 10:00
    حتى 18:00 والدخول مجاني، لكن لا تفترض أن الفرع القروي يلتزم الجدول نفسه، واتصل بمتحف أوزورغيتي قبل
    أن تنطلق. استأذن الموظفين قبل التصوير. للطعام، عُد إلى أوزورغيتي. تقع غوريانتا على الطريق بين أوزورغيتي
    وشاطئ أوريكي، فيسهل إدراجها في يوم على الساحل. والفرعان الآخران، في دفابزو وليخاوري، يكملان الصورة
    إن استهواك الماضي.
  route: >-
    من تبليسي اسلك E60/S1 غرباً مروراً بغوري وخاشوري وكوتايسي حتى سامتريديا، ثم S12 حتى لانتشخوتي. وبُعيد
    لانتشخوتي اترك S12 إلى Sh82 واتبعه جنوباً نحو 25 كم باتجاه أوزورغيتي. عند طرف المدينة ادخل Sh46، طريق
    أوزورغيتي–ناتانيبي–أوريكي، واتبعه غرباً حتى غوريانتا، على بُعد نحو 5 كم من أوزورغيتي. الطريق معبّد
    بالكامل، وتكفي سيارة اقتصادية. احسب نحو 314 كم و4 ساعات و40 دقيقة. تزوّد بالوقود في سامتريديا أو لانتشخوتي
    أو أوزورغيتي. وإن جئت من الساحل، فغوريانتا على الطريق نفسه Sh46، إلى الداخل من أوريكي باتجاه أوزورغيتي.
