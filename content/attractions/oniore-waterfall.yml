ka:
  name: ონიორეს ჩანჩქერი
  short: >-
    კარსტული ჩანჩქერი მარტვილის ჩრდილო-აღმოსავლეთით, ტყით შემოსილ კირქვის ამფითეატრში ვარდება, ტობას პირველი
    მღვიმის მეზობლად.
  body: >-
    **ონიორე იმ ჩანჩქერებს შორისაა, რომლებზეც ბევრს არავინ წერს** — და სწორედ ეს არის მისი ღირსება. ის
    მარტვილის ჩრდილო-აღმოსავლეთით, ტობის მიდამოებში, ტყიან ხეობაშია და ოფიციალურად ბუნების ძეგლის სტატუსი
    ტობას პირველ მღვიმესთან ერთად აქვს.


    წყალი კირქვის კიდიდან ვარდება ხავსიან, ჩრდილიან ამფითეატრში. ქვედა აუზი პატარაა, კედლები კი ვერტიკალური
    და სველია; ჰაერში მუდმივი წვეთია და ზაფხულშიც კი გრილა. აქაური კირქვა ასხის მასივის ნაწილია, ხოლო
    თავად წყალი მიწისქვეშა სისტემიდან გამოდის.


    ეს კარსტული ჰიდროლოგიის კლასიკური მაგალითია და პრაქტიკული შედეგიც აქვს: დინება ძალიან ცვალებადია.
    გაზაფხულზე და ძლიერი წვიმის შემდეგ ჩანჩქერი მძლავრია და ხმაურიანი; აგვისტოს ბოლოსა და სექტემბერში
    ის შეიძლება თხელ ნაკადად გადაიქცეს. ვინც სექტემბერში ჩავა და გრიგალს ელოდება, იმედგაცრუებული დარჩება.


    ექვსასიოდე მეტრში მეორე ობიექტია — ტობას ჩანჩქერი და არსენ ოკროჯანაშვილის მღვიმე. ორივე ერთ გასეირნებაში
    თავსდება და, ფაქტობრივად, ერთ ვიზიტად ითვლება.


    ეს მიდამო საქართველოში ბუნების ძეგლების ყველაზე მჭიდრო გროვაა: ბალდის კანიონი, მოტენასა და ჯორცკუს
    მღვიმეები, აბაშის ჩანჩქერი, ოჩხომურის ჩანჩქერი — ყველა ნახევარი საათის რადიუსში.


    ზემოთ გაშლილი პლატო ფაქტობრივად ცხრილივითაა დახვრეტილი. სპელეოლოგებმა ასხის კირქვაში ათობით ღრმული
    აღწერეს, ხოლო მოტენასა და ჯორცკუს სისტემები წყალს სწორედ ისეთ ჩანჩქერებამდე მიიყვანს, როგორიც ონიორეა.
    ის, რასაც ხედავ, დიდი მიწისქვეშა სისტემის ხილული ბოლოა — დანარჩენს თითქმის არავინ ხედავს.


    მაისსა და ივნისში ტყე ხმაურიანია: ჩიტები, მდინარე და ხის კენწეროებში ქარი. ივლისის ბოლოდან ხმა კლებულობს
    და ჩრდილში კოღოები ჩნდებიან.


    ინფრასტრუქტურა თითქმის არ არსებობს. მისასვლელი ღორღიანი სატყეო გზაა, შემდეგ კი ოციოდე-ოცდაათწუთიანი
    ფეხით სვლა ტყეში, ფესვებზე და თიხაზე. ნიშნები მწირია და ზოგჯერ საერთოდ არ არის; ადგილობრივის კითხვა
    ან კარგი ოფლაინ რუკა აუცილებელია.


    სამაგიეროდ, აქ თითქმის არავინაა. მარტვილის კანიონში ზაფხულში რიგი დგას, ონიორეზე კი შეიძლება მთელი
    დღე მარტო იყო. ეს იმასაც ნიშნავს, რომ ყველაფერი შენს პასუხისმგებლობაზეა: მაშველი არ არის, ნიშანი არ
    არის და დაცემის შემთხვევაში დახმარება შორსაა.


    საუკეთესო დროა მაისი და ივნისი: წყალი უხვია, ტყე ჯერ კიდევ ღია მწვანეა და კოღო ჯერ არ არის. ორი საათი
    — მისვლა, ყურება და დაბრუნება — სავსებით საკმარისია.
  tip: >-
    ორი საათი კმარა, თუ ტობასაც ნახავ — სამი. ბილიკი ტყეშია, თიხიანი და წვიმის შემდეგ სრიალა; დახურული,
    კარგად შეჭიდებული ფეხსაცმელი აუცილებელია. ჩანჩქერთან ქვები მუდმივად სველია — ცურვა და კიდეზე ასვლა
    არ ღირს. კავშირგაბმულობა სუსტია, ამიტომ მარშრუტი წინასწარ ჩამოტვირთე. ტუალეტი, წყალი და კაფე არ არის;
    ყველაფერი მარტვილიდან წაიღე. ივნისიდან მწერების საწინააღმდეგო საშუალება აუცილებელია, რადგან ჩრდილიან
    ტყეში კოღო მთელი დღე დგას. ბავშვებთან ერთად სიარული შესაძლებელია, მაგრამ ბოლო ჩამოსასვლელი ციცაბოა
    და ხელის მოკიდება სჭირდება.
  route: >-
    თბილისიდან E60-ით სამტრედიისა და აბაშის გავლით მარტვილამდე, შემდეგ ჩრდილო-აღმოსავლეთით ინჩხურისა და
    ტობის მიმართულებით — სულ დაახლოებით 318 კმ და ხუთი საათი ათი წუთი. მარტვილამდე ასფალტია; შემდეგ ღორღიანი
    სატყეო გზა იწყება, ვიწრო და ღრმად დაღარული. მშრალ ამინდში შემაღლებული ავტომობილი გაივლის, დაბალი —
    არა; წვიმის შემდეგ მხოლოდ ოთხთვალა. მანქანა ბილიკის დასაწყისში დატოვე და დანარჩენი ფეხით გაიარე. საწვავი
    აბაშაში ან მარტვილში აიღე — შემდეგ სადგური აღარ არის.
en:
  name: Oniore Waterfall
  short: A karst waterfall north-east of Martvili, falling into a wooded limestone amphitheatre next to
    the Toba cave.
  body: >-
    **Oniore is one of those waterfalls nobody writes much about,** which is exactly its merit. It lies
    north-east of Martvili in the wooded country around Toba, and it holds natural monument status jointly
    with the Toba First Cave.


    The water drops over a limestone lip into a mossy, shaded amphitheatre. The plunge pool is small,
    the walls are vertical and permanently wet, and there is a constant drift of spray in the air that
    keeps the place cool even in high summer. The limestone belongs to the Askhi massif, and the water
    itself emerges from an underground system rather than from a surface catchment.


    That is textbook karst hydrology, and it has a practical consequence: the flow varies enormously.
    In spring and after heavy rain the fall is powerful and loud. By late August and September it can
    shrink to a thin ribbon. Anyone arriving in September expecting a torrent will be disappointed.


    Some six hundred metres away is a second site, the Toba waterfall and the Arsen Okrojanashvili cave.
    Both fit into a single walk and are effectively one visit.


    This corner holds the densest cluster of natural monuments in Georgia: Balda canyon, the Motena and
    Jortsku caves, the Abasha waterfall and the Ochkhomuri waterfall are all within half an hour.


    The plateau above is honeycombed. Speleologists have mapped dozens of cavities in the Askhi limestone,
    and systems such as Motena and Jortsku carry water that eventually reappears in falls like this one.
    What you see is the visible end of a much larger piece of plumbing, most of which nobody ever looks
    at.


    In May and June the forest is loud — birds, water and wind in the canopy. From late July the sound
    drops away and the shade fills with mosquitoes instead.


    Infrastructure barely exists. The approach is a gravel forest road, followed by twenty to thirty minutes
    on foot through woodland over roots and clay. Signage is sparse and sometimes absent, so ask locally
    or carry a good offline map.


    In exchange you get near-total solitude. Martvili canyon has a queue in summer; at Oniore you may
    spend the day alone.


    May and June are the best months: the water is generous, the leaves are still light green and the
    insects have not yet arrived. Two hours, allowing for the walk in, the looking and the walk out, is
    enough.
  tip: >-
    Two hours is enough, three if you also visit Toba. The path is woodland clay, slippery after rain,
    so closed shoes with real grip are essential. The rocks at the base are permanently wet: swimming
    and scrambling on the lip are both bad ideas. The phone signal is weak, so download the route before
    you set out. There is no toilet, no water and no café — bring everything from Martvili. From June
    onwards take insect repellent, as the shaded forest holds mosquitoes all day.
  route: >-
    From Tbilisi take the E60 through Samtredia and Abasha to Martvili, then head north-east towards Inchkhuri
    and Toba — about 318 km in all and five hours ten. Asphalt runs as far as Martvili; after that a gravel
    forest road begins, narrow and deeply rutted. In dry weather a raised car will manage and a low one
    will not; after rain it is four-wheel drive only. Leave the car where the footpath starts and walk
    from there. Refuel in Abasha or Martvili, as there is nothing beyond.
ru:
  name: Водопад Ониоре
  short: >-
    Карстовый водопад к северо-востоку от Мартвили, падающий в лесной известняковый амфитеатр рядом с
    пещерой Тоба.
  body: >-
    **Ониоре — из тех водопадов, о которых мало пишут,** и в этом его достоинство. Он лежит к северо-востоку
    от Мартвили, в лесистой местности вокруг Тобы, и имеет статус памятника природы совместно с Первой
    Тобской пещерой.


    Вода срывается с известнякового карниза в замшелый тенистый амфитеатр. Котёл невелик, стены отвесные
    и постоянно мокрые, в воздухе висит взвесь брызг, из-за которой здесь прохладно даже в разгар лета.
    Известняк принадлежит массиву Асхи, а сама вода выходит из подземной системы, а не собирается с поверхности.


    Это классическая карстовая гидрология, и у неё есть практическое следствие: расход воды меняется очень
    сильно. Весной и после ливней водопад мощный и шумный. К концу августа и в сентябре он может превратиться
    в тонкую ленту. Тот, кто приедет в сентябре за потоком, будет разочарован.


    Метрах в шестистах отсюда второй объект — водопад Тоба и пещера Арсена Окроджанашвили. Оба укладываются
    в одну прогулку и по сути считаются одним посещением.


    Этот угол — самое плотное скопление памятников природы в Грузии: каньон Балда, пещеры Мотена и Джорцку,
    водопад на Абаше и водопад Очхомури находятся в получасе.


    Плато наверху источено, как губка. Спелеологи описали в известняках Асхи десятки полостей, а системы
    вроде Мотены и Джорцку несут воду, которая в итоге выходит на поверхность именно такими водопадами.
    Вы видите видимый конец гораздо более крупной подземной сети, на которую почти никто не смотрит.


    В мае и июне лес шумит: птицы, вода, ветер в кронах. С конца июля звук стихает, а тень вместо этого
    наполняется комарами.


    Инфраструктуры почти нет. Подъезд — гравийная лесная дорога, дальше двадцать-тридцать минут пешком
    по лесу, по корням и глине. Указателей мало, а иногда нет вовсе, так что спрашивайте у местных или
    берите хорошую офлайн-карту.


    Взамен вы получаете почти полное одиночество. В Мартвильском каньоне летом очередь; на Ониоре можно
    провести день одному.


    Лучшие месяцы — май и июнь: воды много, листва ещё светлая, насекомых пока нет. Двух часов — дойти,
    посмотреть и вернуться — вполне хватает.
  tip: >-
    Двух часов достаточно, трёх — если добавить Тобу. Тропа глинистая, лесная, после дождя скользкая,
    поэтому нужна закрытая обувь с настоящим протектором. Камни у подножия всегда мокрые: и купаться,
    и лезть на кромку одинаково плохие идеи. Связь слабая, маршрут скачайте заранее. Ни туалета, ни воды,
    ни кафе тут нет — везите всё из Мартвили. С июня берите средство от насекомых: в тенистом лесу комары
    держатся весь день.
  route: >-
    Из Тбилиси по E60 через Самтредиа и Абашу до Мартвили, затем на северо-восток к Инчхури и Тобе — всего
    около 318 км и пять часов десять минут. До Мартвили асфальт; дальше начинается гравийная лесная дорога,
    узкая и с глубокой колеёй. В сухую погоду машина с клиренсом проходит, низкая — нет; после дождя только
    полный привод. Оставьте машину там, где начинается тропа, и дальше пешком. Заправляйтесь в Абаше или
    Мартвили: дальше ничего нет.
fa:
  name: آبشار اونیوره
  short: آبشاری کارستی در شمال شرقی مارتویلی که در آمفی‌تئاتری آهکی و جنگلی کنار غار توبا فرو می‌ریزد.
  body: >-
    **اونیوره از آن آبشارهایی است که کسی دربارهٔ آن زیاد نمی‌نویسد،** و همین امتیاز آن است. در شمال شرقی
    مارتویلی، در سرزمین جنگلی پیرامون توبا قرار دارد و همراه با غار نخست توبا اثر طبیعی ثبت شده است.


    آب از لبه‌ای آهکی در آمفی‌تئاتری خزه‌پوش و سایه‌دار فرو می‌افتد. حوضچهٔ زیرین کوچک است، دیواره‌ها
    عمودی و همیشه خیس، و در هوا غبار دائمی آب معلق است که جا را حتی در اوج تابستان خنک نگاه می‌دارد. سنگ
    آهک به تودهٔ آسخی تعلق دارد و خود آب از سامانه‌ای زیرزمینی بیرون می‌زند نه از حوضهٔ سطحی.


    این نمونهٔ کتابی آب‌شناسی کارستی است و پیامدی عملی دارد: دبی آب بسیار نوسان می‌کند. در بهار و پس از
    باران سنگین آبشار پرتوان و پرصداست. تا اواخر مرداد و شهریور ممکن است به نواری نازک بدل شود. هرکس در
    شهریور با انتظار سیلابی بیاید سرخورده می‌شود.


    حدود ششصد متر آن‌سوتر جای دومی هست: آبشار توبا و غار آرسن اوکروجاناشویلی. هر دو در یک پیاده‌روی جا
    می‌گیرند و عملاً یک دیدار شمرده می‌شوند.


    این گوشه متراکم‌ترین خوشهٔ آثار طبیعی گرجستان است: درهٔ بالدا، غارهای موتنا و جورتسکو، آبشار آباشا
    و آبشار اوچخوموری همه در نیم‌ساعتی‌اند.


    فلات بالای سر مانند کندو سوراخ‌سوراخ است. غارشناسان ده‌ها حفره را در آهک آسخی نقشه‌برداری کرده‌اند
    و سامانه‌هایی مانند موتنا و جورتسکو آبی را می‌برند که سرانجام در چنین آبشارهایی دوباره پیدا می‌شود.
    آنچه می‌بینید انتهای آشکار شبکه‌ای بسیار بزرگ‌تر است که کسی به بیشترش نگاه نمی‌کند.


    در اردیبهشت و خرداد جنگل پرصداست: پرنده و آب و باد در تاج درختان. از اواخر تیر صدا فرو می‌نشیند و
    سایه به جای آن پر از پشه می‌شود.


    زیرساخت تقریباً وجود ندارد. دسترسی از راه جنگلی شنی است و پس از آن بیست تا سی دقیقه پیاده‌روی در جنگل
    روی ریشه و خاک رس. تابلوها اندک و گاه اصلاً نیست، پس از اهالی بپرسید یا نقشهٔ آفلاین خوبی همراه داشته
    باشید.


    در عوض تنهایی تقریباً کامل نصیبتان می‌شود. درهٔ مارتویلی در تابستان صف دارد؛ در اونیوره ممکن است تمام
    روز تنها بمانید.


    اردیبهشت و خرداد بهترین ماه‌ها هستند: آب فراوان است، برگ‌ها هنوز سبز روشن‌اند و حشرات نیامده‌اند.
    دو ساعت برای رفتن و تماشا و بازگشت کافی است.
  tip: >-
    دو ساعت کافی است و سه ساعت اگر توبا را هم ببینید. مسیر خاک رس جنگلی است و پس از باران لغزنده، پس کفش
    بسته با آج واقعی ضروری است. سنگ‌های پای آبشار همیشه خیس‌اند: شنا کردن و بالا رفتن از لبه هر دو فکر
    بدی است. آنتن ضعیف است، پس مسیر را پیش از حرکت دانلود کنید. سرویس بهداشتی و آب و کافه نیست؛ همه چیز
    را از مارتویلی بیاورید. از خرداد به بعد مادهٔ ضد حشره بردارید، چون جنگل سایه‌دار تمام روز پشه دارد.
  route: >-
    از تفلیس با E60 از سامترِدیا و آباشا تا مارتویلی، سپس به شمال شرقی به سوی اینچخوری و توبا — رویهم
    حدود ۳۱۸ کیلومتر و پنج ساعت و ده دقیقه. تا مارتویلی آسفالت است؛ پس از آن راه جنگلی شنی آغاز می‌شود،
    باریک و با شیارهای عمیق. در هوای خشک خودروی مرتفع می‌گذرد و کم‌ارتفاع نه؛ پس از باران فقط چهارچرخ‌محرک.
    خودرو را در آغاز مسیر پیاده بگذارید. سوخت را در آباشا یا مارتویلی بگیرید، چون پس از آن چیزی نیست.
he:
  name: מפל אוניורה
  short: מפל קרסטי מצפון-מזרח למרטווילי, הנופל אל אמפיתיאטרון גיר מיוער לצד מערת טובה.
  body: >-
    **אוניורה הוא אחד מאותם מפלים שאיש אינו כותב עליהם הרבה,** וזו בדיוק מעלתו. הוא שוכן מצפון-מזרח למרטווילי,
    בארץ המיוערת שסביב טובה, ומעמדו כאתר טבע מוגן משותף לו ולמערת טובה הראשונה.


    המים נופלים מעל מדף גיר אל אמפיתיאטרון מוצל מכוסה טחב. בריכת הנפילה קטנה, הקירות אנכיים ורטובים תמיד,
    ובאוויר תלוי רסס קבוע השומר על קרירות גם בשיא הקיץ. הגיר שייך למסיב אסחי, והמים עצמם יוצאים ממערכת
    תת-קרקעית ולא מאגן ניקוז עילי.


    זו הידרולוגיה קרסטית מספר הלימוד, ויש לה השלכה מעשית: הספיקה משתנה מאוד. באביב ואחרי גשם כבד המפל
    עז ורועש. בסוף אוגוסט ובספטמבר הוא עלול להצטמצם לסרט דק. מי שיגיע בספטמבר ויצפה לזרם אדיר יתאכזב.


    כשש מאות מטרים משם נמצא אתר שני: מפל טובה ומערת ארסן אוקרוג׳נשווילי. שניהם נכנסים להליכה אחת ולמעשה
    נחשבים ביקור אחד.


    הפינה הזאת מחזיקה את ריכוז אתרי הטבע הצפוף ביותר בגאורגיה: קניון בלדה, מערות מוטנה וג׳ורצקו, מפל האבאשה
    ומפל אוצ׳חומורי — כולם במרחק חצי שעה.


    הרמה שמעל מחוררת כמו כוורת. חוקרי מערות מיפו עשרות חללים בגיר של אסחי, ומערכות כמו מוטנה וג׳ורצקו
    נושאות מים שבסופו של דבר מופיעים שוב במפלים כמו זה. מה שאתם רואים הוא הקצה הגלוי של מערכת צנרת גדולה
    בהרבה, שרובה אינו נראה לאיש.


    במאי וביוני היער רועש: ציפורים, מים ורוח בצמרות. מסוף יולי הצליל דועך, והצל מתמלא במקומו ביתושים.


    תשתית כמעט אינה קיימת. הגישה היא דרך יער מחוצצת, ואחריה עשרים עד שלושים דקות הליכה בין שורשים וחמרה.
    השילוט דל ולעיתים נעדר לגמרי, לכן שאלו מקומיים או קחו מפה לא מקוונת טובה.


    בתמורה תקבלו בדידות כמעט מוחלטת. בקניון מרטווילי יש תור בקיץ; באוניורה אפשר לבלות יום שלם לבד. פירוש
    הדבר גם שהאחריות כולה עליכם: אין מציל, אין שילוט, ואם מישהו נופל, העזרה רחוקה.


    מאי ויוני הם החודשים הטובים ביותר: המים נדיבים, העלווה עדיין ירוקה בהירה והחרקים טרם הגיעו. שעתיים
    — הליכה פנימה, התבוננות והליכה החוצה — מספיקות.
  tip: >-
    שעתיים מספיקות, שלוש אם תוסיפו את טובה. השביל הוא חמרה ביערנית, חלקלק אחרי גשם, לכן נעליים סגורות
    עם אחיזה אמיתית הן הכרח. הסלעים למרגלות המפל רטובים תמיד: שחייה וטיפוס על השפה הם רעיונות גרועים באותה
    מידה. הקליטה חלשה, אז הורידו את המסלול מראש. אין כאן שירותים, מים או בית קפה — הביאו הכול ממרטווילי.
    מיוני והלאה קחו דוחה חרקים, כי היער המוצל מחזיק יתושים כל היום.
  route: >-
    מטביליסי בכביש E60 דרך סמטרדיה ואבאשה עד מרטווילי, ומשם צפונה-מזרחה לכיוון אינצ׳חורי וטובה — כ-318
    ק״מ בסך הכול וחמש שעות ועשר. עד מרטווילי אספלט; אחר כך מתחילה דרך יער מחוצצת, צרה ובעלת תלמים עמוקים.
    במזג אוויר יבש רכב מוגבה יעבור, ונמוך לא; אחרי גשם רק הנעה כפולה. השאירו את הרכב במקום שבו מתחיל השביל
    והמשיכו ברגל. תדלקו באבאשה או במרטווילי, כי הלאה אין דבר.
ar:
  name: شلال أونيوري
  short: شلال كارستي شمال شرقي مارتفيلي يهوي في مدرج جيري مشجَّر إلى جوار كهف توبا.
  body: >-
    **أونيوري من الشلالات التي لا يكتب عنها أحد كثيراً،** وهذه بالضبط ميزته. يقع شمال شرقي مارتفيلي في
    الأرض المشجرة حول توبا، وله صفة النصب الطبيعي بالاشتراك مع كهف توبا الأول.


    يهوي الماء عن حافة جيرية في مدرج مظلل مكسو بالطحلب. حوض السقوط صغير، والجدران قائمة ورطبة على الدوام،
    وفي الهواء رذاذ دائم يبقي المكان بارداً حتى في ذروة الصيف. والحجر الجيري ينتمي إلى كتلة أسخي، والماء
    نفسه يخرج من شبكة جوفية لا من حوض سطحي.


    هذه هيدرولوجيا كارستية نموذجية، ولها أثر عملي: التصريف يتفاوت تفاوتاً كبيراً. في الربيع وبعد الأمطار
    الغزيرة يكون الشلال قوياً صاخباً. وفي أواخر آب وأيلول قد ينكمش إلى شريط رفيع. ومن يأتي في أيلول منتظراً
    سيلاً سيصاب بخيبة.


    وعلى نحو ستمئة متر موقع ثانٍ: شلال توبا وكهف أرسن أوكروجاناشفيلي. وكلاهما يدخل في نزهة واحدة ويُعدّان
    عملياً زيارة واحدة.


    تضم هذه الزاوية أكثف تجمع للنُصب الطبيعية في جورجيا: وادي بالدا، وكهفا موتينا ويورتسكو، وشلال أباشا،
    وشلال أوتشخوموري، وكلها على بعد نصف ساعة.


    والهضبة فوقه مثقوبة كخلية نحل. فقد رسم علماء الكهوف عشرات التجاويف في حجر أسخي الجيري، وتحمل شبكات
    مثل موتينا ويورتسكو مياهاً تعود فتظهر في شلالات كهذا. وما تراه هو الطرف المرئي من شبكة أكبر بكثير
    لا ينظر أحد إلى معظمها.


    في أيار وحزيران تصخب الغابة: طيور وماء وريح في القمم. ومن أواخر تموز يخفت الصوت ويمتلئ الظل بالبعوض
    بدلاً منه.


    والبنية التحتية تكاد تكون معدومة. الوصول عبر طريق حرجي حصوي، يليه عشرون إلى ثلاثون دقيقة سيراً في
    الغابة فوق الجذور والطين. واللافتات قليلة وأحياناً غائبة، فاسأل الأهالي أو احمل خريطة غير متصلة جيدة.


    وفي المقابل تنال عزلة تكاد تكون تامة. ففي وادي مارتفيلي طابور في الصيف؛ أما في أونيوري فقد تقضي اليوم
    كله وحدك.


    أيار وحزيران أفضل الشهور: الماء وفير، والأوراق ما زالت خضراء فاتحة، والحشرات لم تصل بعد. وساعتان للذهاب
    والنظر والعودة تكفيان.
  tip: >-
    ساعتان تكفيان، وثلاث إن أضفت توبا. الدرب طين حرجي زلق بعد المطر، فالحذاء المغلق ذو القبضة الحقيقية
    ضرورة. والصخور عند القاعدة مبللة دائماً: السباحة وتسلق الحافة فكرتان سيئتان بالقدر نفسه. التغطية ضعيفة،
    فحمّل المسار قبل الانطلاق. لا دورة مياه هنا ولا ماء ولا مقهى — احمل كل شيء من مارتفيلي. ومن حزيران
    فصاعداً خذ طارداً للحشرات، فالغابة المظللة تحفظ البعوض طوال النهار.
  route: >-
    من تبليسي على الطريق E60 عبر سامتريديا وأباشا حتى مارتفيلي، ثم شمالاً شرقاً نحو إنتشخوري وتوبا — نحو
    318 كم إجمالاً وخمس ساعات وعشر دقائق. الإسفلت يمتد حتى مارتفيلي؛ وبعده يبدأ طريق حرجي حصوي ضيق عميق
    الأخاديد. في الجو الجاف تجتازه سيارة مرتفعة ولا تجتازه المنخفضة؛ وبعد المطر لا يصلح إلا الدفع الرباعي.
    اترك السيارة حيث يبدأ الدرب وتابع سيراً. تزوّد بالوقود في أباشا أو مارتفيلي، فلا شيء بعدهما.
