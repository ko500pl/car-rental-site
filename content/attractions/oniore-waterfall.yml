ka:
  name: ონიორეს ჩანჩქერი
  short: >-
    67-მეტრიანი ჩანჩქერი, რომელსაც ტობის პირველი მღვიმის მიწისქვეშა მდინარე კვებავს, მარტვილის ზემოთ,
    კარსტულ ტყეში — იშვიათად ნანახი და ძნელად მისადგომი.
  body: >-
    **ონიორეზე მდინარე, რომელმაც მთელი გზა სიბნელეში გაიარა, მთიდან გამოდის და თითქმის მაშინვე კლდიდან
    ეშვება.**


    ჩანჩქერი მარტვილის მუნიციპალიტეტშია, სოფელ მეორე ბალდის ჩრდილო-აღმოსავლეთით დაახლოებით ხუთ კილომეტრზე,
    მდინარე ტობის აუზში, ასხის კირქვიანი მასივის სამხრეთ კიდეზე, ზღვის დონიდან დაახლოებით 680 მეტრზე.
    მისი წყალი მიწისქვეშა ნაკადია, რომელიც ტობის პირველი მღვიმიდან გამოდის და 67 მეტრის სიმაღლიდან ვარდება.
    ჩანჩქერი და მღვიმე ერთად არის ბუნების ძეგლად გამოცხადებული.


    მღვიმე სპელეოლოგების სამყაროა. აღწერილობის მიხედვით, შესასვლელიდან დაახლოებით 70 მეტრში, სადაც ჭერი
    30 მეტრზეა აზიდული, მიწისქვეშა ჩანჩქერი ხმაურობს, გვირაბის სიგანე კი 12–15 მეტრია. შემთხვევითი სტუმრისთვის
    იქ ადგილი არ არის.


    კარსტულ მდინარეს საკუთარი კალენდარი აქვს. გაზაფხულზე და კოკისპირული წვიმის შემდეგ ონიორე ძლიერი და
    ხმაურიანია, ზაფხულის ბოლოს კი შეიძლება ერთ წვრილ ნაკადად იქცეს. კლდის ძირას ჰაერი წყლის მტვრით არის
    სავსე, ქვები ხავსით შემოსილი და არასოდეს შრება, ივლისის შუადღესაც კი აქ გრილა.


    იმავე მდინარის აუზში მეორე სასწაულიცაა: ტობის ჩანჩქერი, 234-მეტრიანი კასკადი, რომელსაც 1300 მეტრი
    სიგრძის არსენ ოქროჯანაშვილის მღვიმიდან გამოსული წყალი ქმნის და რომლამდეც მონიშნული ბილიკი მიდის. ორივეს
    ცოტა თუ ნახულობს — და ეს მათი ხიბლის დიდი ნაწილია: აქ ტყეს უფრო ჩიტებს გაუყოფთ, ვიდრე ტურისტულ ჯგუფებს.


    რასაც ხედავთ, სიბნელეში გავლილი გრძელი გზის უკანასკნელი წამია.
  tip: >-
    მისვლა-მოსვლით ორი-სამი საათი გამოყავით. ბოლო მონაკვეთი ფეხით, ტყეში, თიხასა და ფესვებზე გადის და
    წვიმის შემდეგ სრიალებს — კარგად შეჭიდებული ფეხსაცმელი აუცილებელია, ტრეკინგის ჯოხებიც გამოგადგებათ.
    ნიშნები მწირია: ოფლაინ რუკა წინასწარ ჩამოტვირთეთ და გზა ბალდის სოფლებში იკითხეთ. ჩანჩქერის თავთან
    სველ ქვებზე ნუ ახვალთ, მღვიმეში კი სპელეოლოგის გარეშე ნუ შეხვალთ. ინფრასტრუქტურა არ არის — წყალი და
    საჭმელი მარტვილიდან წაიღეთ. ყველაზე უხვი წყალი მაისსა და ივნისშია; ივლისიდან კოღოს საწინააღმდეგო საშუალება
    დაგჭირდებათ.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით ქუთაისის მიდამოებამდე იარეთ, შემდეგ ხონისკენ გადაუხვიეთ, ბანძის
    გავლით მარტვილამდე მიდით, იქიდან კი ჩრდილოეთით, ბალდის სოფლების გავლით, მთისკენ: ბილიკის დასაწყისამდე
    სულ დაახლოებით 318 კმ და 5 საათი და 10 წუთი. მარტვილამდე ასფალტია; შემდეგ სოფლის გზა ვიწრო, დაღარულ
    სატყეო გზად გადადის, რომელზეც დაბალ მანქანას ნუ შეიყვანთ, წვიმის შემდეგ კი ოთხივე თვალზე წამყვანი
    (4×4) ავტომობილი დაგჭირდებათ — ამიტომაა რეკომენდებული SUV კლასი. მანქანა იქ დატოვეთ, სადაც გზა მთავრდება,
    და ფეხით გააგრძელეთ. საწვავი მარტვილში შეავსეთ — შემდეგ გასამართი აღარ არის.
en:
  name: Oniore Waterfall
  short: >-
    A 67-metre waterfall fed by the underground river of the Toba First Cave, in the karst forest above
    Martvili: seldom visited and hard to reach.
  body: >-
    **At Oniore a river that has run its whole course in darkness steps out of the mountain and, almost
    at once, off a cliff.**


    The waterfall lies in Martvili municipality, about five kilometres north-east of the village of Second
    Balda, in the basin of the Toba river on the southern edge of the Askhi limestone massif, some 680
    metres above sea level. Its water is an underground stream that emerges from the Toba First Cave and
    falls 67 metres. Waterfall and cave are protected together as a natural monument.


    The cave belongs to speleologists. According to the survey, an underground waterfall sounds about
    70 metres in from the entrance, beneath a ceiling 30 metres high, in a tunnel 12 to 15 metres wide.
    It is no place for a casual visitor.


    A karst river keeps its own calendar. In spring and after heavy rain Oniore is loud and heavy; by
    late summer it can thin to a single ribbon. At the foot of the cliff the air is full of spray, the
    stones are furred with moss and never dry, and even a July noon feels cool.


    The same river basin holds a second marvel: the Toba waterfall, a 234-metre cascade fed by water from
    the 1.3-kilometre Arsen Okrojanashvili Cave and reached by a marked trail. Few people see either,
    and that is much of their charm; you are more likely to share the forest with birds than with coach
    parties.


    What you are looking at is the last second of a long journey through the dark.
  tip: >-
    Allow two to three hours including the walk in and out. The final stretch is on foot through forest
    over clay and roots, slippery after rain, so boots with real grip are essential and trekking poles
    help. Signs are sparse: download an offline map and ask the way in the Balda villages before setting
    off. Keep off the wet rocks at the lip, and do not enter the cave without a speleologist. There are
    no facilities, so bring water and food from Martvili. May and June give the fullest flow; from July
    you will want insect repellent.
  route: >-
    From Tbilisi follow the E60/S1 west to the Kutaisi area, turn off towards Khoni and continue through
    Bandza to Martvili, then head north past the Balda villages into the hills: about 318 km and 5 h 10
    min to the start of the path. Asphalt runs to Martvili; beyond it, village roads give way to a narrow,
    rutted forest track that a low car should not attempt and that needs four-wheel drive after rain,
    hence the SUV category. Leave the car where the track ends and walk on. Fill up in Martvili, as there
    is no fuel beyond.
ru:
  name: Водопад Ониоре
  short: >-
    67-метровый водопад в карстовом лесу над Мартвили, который питает подземная река Первой Тобской пещеры:
    сюда редко доходят, и путь непрост.
  body: >-
    **В Ониоре река, прошедшая весь свой путь в темноте, выходит из горы — и почти сразу срывается с обрыва.**


    Водопад находится в Мартвильском муниципалитете, примерно в пяти километрах к северо-востоку от села
    Вторая Балда, в бассейне реки Тоба, на южном краю известнякового массива Асхи, на высоте около 680
    метров над уровнем моря. Его питает подземный поток: он выходит из Первой Тобской пещеры и падает
    с высоты 67 метров. Водопад и пещера охраняются вместе как памятник природы.


    Пещера — царство спелеологов. По данным обследования, примерно в 70 метрах от входа, под сводом высотой
    30 метров, в туннеле шириной от 12 до 15 метров, шумит подземный водопад. Случайному путнику там не
    место.


    У карстовой реки свой календарь. Весной и после сильных дождей Ониоре гремит и тяжелеет; к концу лета
    он может истончиться до одной-единственной ленты. У подножия скалы воздух полон водяной пыли, камни
    обросли мхом и никогда не просыхают, и даже в июльский полдень здесь прохладно.


    В том же речном бассейне прячется второе чудо — водопад Тоба, 234-метровый каскад, который питает
    вода из пещеры Арсена Окроджанашвили длиной 1,3 километра; к нему ведёт маркированная тропа. Мало
    кто видел хотя бы один из них, и в этом немалая доля их очарования: лес вы скорее разделите с птицами,
    чем с экскурсионными автобусами.


    Перед вами — последняя секунда долгого пути сквозь темноту.
  tip: >-
    Заложите два-три часа вместе с дорогой пешком туда и обратно. Последний участок идёт через лес по
    глине и корням, после дождя там скользко, поэтому нужны ботинки с настоящим протектором, пригодятся
    и треккинговые палки. Указателей почти нет: скачайте офлайн-карту и спросите дорогу в сёлах Балда,
    прежде чем выходить. Держитесь подальше от мокрых камней на кромке обрыва и не заходите в пещеру без
    спелеолога. Никакой инфраструктуры нет, так что воду и еду везите из Мартвили. Самый полноводный поток
    — в мае и июне; с июля понадобится средство от насекомых.
  route: >-
    Из Тбилиси двигайтесь по E60/S1 на запад до района Кутаиси, сверните на Хони и через Бандзу доезжайте
    до Мартвили, а оттуда держите на север, мимо сёл Балда, в холмы: около 318 км и 5 ч 10 мин до начала
    тропы. Асфальт доходит до Мартвили; дальше сельские дороги сменяются узкой разбитой лесной колеёй
    — на низкой машине туда лучше не соваться, а после дождя без полного привода не обойтись, отсюда и
    рекомендация взять внедорожник. Оставьте машину там, где кончается колея, и идите дальше пешком. Заправьтесь
    в Мартвили: дальше заправок нет.
fa:
  name: آبشار اونیوره
  short: >-
    آبشاری ۶۷ متری در جنگل کارستی بالای مارتویلی که رود زیرزمینی نخستین غار توبا سیرابش می‌کند؛ کم‌بازدید
    و دشوارگذر.
  body: >-
    **در اونیوره، رودی که همهٔ راهش را در تاریکی پیموده از دل کوه بیرون می‌آید و تقریباً بی‌درنگ از صخره
    فرو می‌افتد.**


    آبشار در شهرستان مارتویلی است، حدود پنج کیلومتری شمال‌شرقی روستای بالدای دوم، در حوضهٔ رود توبا و
    بر لبهٔ جنوبی تودهٔ آهکی آسخی، در ارتفاع حدود ۶۸۰ متری از سطح دریا. آبش جریانی زیرزمینی است که از
    نخستین غار توبا بیرون می‌زند و ۶۷ متر فرو می‌ریزد. آبشار و غار با هم به‌عنوان اثر طبیعی حفاظت می‌شوند.


    غار قلمرو غارشناسان است. بنابر گزارش پیمایش، حدود ۷۰ متر پس از دهانه، زیر سقفی به بلندی ۳۰ متر و در
    تونلی به پهنای ۱۲ تا ۱۵ متر، آبشاری زیرزمینی می‌خروشد. اینجا جای بازدیدکنندهٔ گذری نیست.


    رود کارستی تقویم خودش را دارد. در بهار و پس از باران‌های سنگین، اونیوره پرخروش و پرآب است؛ تا اواخر
    تابستان ممکن است به نواری باریک بدل شود. پای صخره هوا پر از غبار آب است، سنگ‌ها پوشیده از خزه‌اند
    و هرگز خشک نمی‌شوند، و حتی نیمروز ژوئیه هم اینجا خنک است.


    همین حوضه شگفتی دومی هم در خود دارد: آبشار توبا، آبشاری پلکانی به بلندی ۲۳۴ متر که آبش از غار ۱٫۳
    کیلومتری آرسن اوکروجاناشویلی می‌آید و کوره‌راهی نشانه‌گذاری‌شده به آن می‌رسد. کمتر کسی هیچ‌یک از این
    دو را دیده است و بخش بزرگی از جاذبه‌شان همین است؛ در این جنگل به احتمال زیاد همراهانتان پرندگان‌اند،
    نه اتوبوس‌های تور.


    آنچه پیش رو دارید واپسین ثانیهٔ سفری طولانی در تاریکی است.
  tip: >-
    با پیاده‌روی رفت و برگشت، دو تا سه ساعت وقت بگذارید. بخش پایانی را باید پیاده از میان جنگل و روی گل
    رس و ریشه‌ها رفت که پس از باران لغزنده است؛ پس کفش کوهی با کفی به‌راستی چسبنده ضروری است و باتوم کوهنوردی
    هم به کار می‌آید. تابلو کم است: پیش از راه افتادن نقشهٔ آفلاین بگیرید و در روستاهای بالدا راه را بپرسید.
    از سنگ‌های خیس لبهٔ آبشار دوری کنید و بی غارشناس وارد غار نشوید. هیچ امکاناتی نیست، پس آب و غذا را
    از مارتویلی بیاورید. مه و ژوئن پرآب‌ترین ماه‌هایند؛ از ژوئیه به دافع حشرات نیاز خواهید داشت.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سوی غرب تا حوالی کوتائیسی بروید، به سمت خونی بپیچید و از باندزا تا مارتویلی
    ادامه دهید، سپس رو به شمال، از کنار روستاهای بالدا، به دل تپه‌ها بروید: حدود ۳۱۸ کیلومتر و ۵ ساعت
    و ۱۰ دقیقه تا آغاز کوره‌راه. آسفالت تا مارتویلی می‌رسد؛ پس از آن جاده‌های روستایی جای خود را به راهی
    جنگلی، باریک و پر از شیار می‌دهند که خودروی کف‌کوتاه نباید واردش شود و پس از باران دیفرانسیل چهارچرخ
    می‌خواهد؛ از همین رو خودروی شاسی‌بلند توصیه می‌شود. خودرو را جایی که راه تمام می‌شود بگذارید و پیاده
    ادامه دهید. در مارتویلی باک را پر کنید، چون پس از آن پمپ‌بنزینی نیست.
he:
  name: מפל אוניורה
  short: >-
    מפל בגובה 67 מטרים שניזון מהנהר התת-קרקעי של מערת טובה הראשונה, ביער הקארסטי שמעל מרטווילי: מעטים
    מגיעים אליו, והדרך קשה.
  body: >-
    **באוניורה, נהר שעשה את כל דרכו בחשכה יוצא מתוך ההר – וכמעט מיד צונח מעל צוק.**


    המפל נמצא במוניציפליטת מרטווילי, כחמישה קילומטרים צפון-מזרחית לכפר בלדה השנייה, באגן הנהר טובה, בשוליו
    הדרומיים של מסיב הגיר אסחי, בגובה של כ-680 מטרים מעל פני הים. מימיו הם זרם תת-קרקעי שיוצא ממערת טובה
    הראשונה וצונח 67 מטרים. המפל והמערה מוגנים יחד כמונומנט טבע.


    המערה היא נחלתם של חוקרי מערות. לפי הסקר, כ-70 מטרים פנימה מהכניסה, מתחת לתקרה בגובה 30 מטרים ובמנהרה
    שרוחבה 12 עד 15 מטרים, רועם מפל תת-קרקעי. זה אינו מקום למבקר מזדמן.


    לנהר קארסטי יש לוח שנה משלו. באביב ואחרי גשמים עזים אוניורה רועם ושופע; לקראת סוף הקיץ הוא עלול להידלדל
    לסרט מים יחיד. למרגלות הצוק האוויר מלא רסס, האבנים מכוסות טחב ואינן מתייבשות לעולם, ואפילו בצהרי יולי
    קריר כאן.


    באותו אגן נהר מסתתר פלא נוסף: מפל טובה, מפל מדורג בגובה 234 מטרים שניזון ממי מערת ארסן אוקרוג'נאשווילי,
    שאורכה 1.3 קילומטרים; מגיעים אליו בשביל מסומן. מעטים ראו ולו אחד מהם, ובכך טמון חלק גדול מקסמם: סביר
    יותר שתחלקו את היער עם ציפורים מאשר עם אוטובוסים של קבוצות מאורגנות.


    מה שלפניכם הוא השנייה האחרונה של מסע ארוך בחשכה.
  tip: >-
    הקדישו שעתיים עד שלוש, כולל ההליכה הלוך ושוב. הקטע האחרון עובר ברגל דרך היער, על חימר ושורשים, והוא
    חלקלק אחרי גשם – לכן נעליים עם אחיזה אמיתית הן חובה, ומקלות הליכה יעזרו. השילוט דל: הורידו מפה לא
    מקוונת ושאלו על הדרך בכפרי בלדה לפני היציאה. התרחקו מהסלעים הרטובים בשפת המפל, ואל תיכנסו למערה בלי
    חוקר מערות. אין כאן שום מתקנים, אז הביאו מים ואוכל ממרטווילי. במאי וביוני הזרימה במיטבה; מיולי תזדקקו
    לתכשיר דוחה חרקים.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד אזור קוטאיסי, פנו לכיוון חוני והמשיכו דרך בנדזה עד מרטווילי, ומשם
    צפונה, על פני כפרי בלדה, אל הגבעות: כ-318 ק"מ ו-5 שעות ו-10 דקות עד תחילת השביל. האספלט מגיע עד מרטווילי;
    אחריה דרכי הכפר מתחלפות בדרך יער צרה ומשובשת, שאין לנסות לעבור בה ברכב נמוך, ואחרי גשם היא מחייבת
    הנעה כפולה – ומכאן ההמלצה על רכב שטח. השאירו את הרכב היכן שהדרך נגמרת והמשיכו ברגל. תדלקו במרטווילי,
    כי בהמשך אין תחנות דלק.
ar:
  name: شلال أونيوري
  short: >-
    شلال بارتفاع 67 مترًا يغذّيه النهر الجوفي لكهف توبا الأول، في الغابة الكارستية فوق مارتفيلي: قليل
    الزوار وصعب الوصول.
  body: >-
    **في أونيوري يخرج من الجبل نهرٌ قطع مجراه كله في الظلام، ثم لا يلبث أن يهوي عن جرف.**


    يقع الشلال في بلدية مارتفيلي، على بُعد نحو خمسة كيلومترات شمال شرق قرية بالدا الثانية، في حوض نهر
    توبا عند الحافة الجنوبية لكتلة أسخي الكلسية، على ارتفاع نحو 680 مترًا فوق سطح البحر. ماؤه جدول جوفي
    ينبثق من كهف توبا الأول ويهوي 67 مترًا. ويخضع الشلال والكهف معًا للحماية بوصفهما معلمًا طبيعيًا.


    الكهف من شأن علماء الكهوف. فبحسب المسح، يهدر شلال جوفي على بُعد نحو 70 مترًا من المدخل، تحت سقف يرتفع
    30 مترًا، في نفق يتراوح عرضه بين 12 و15 مترًا. ليس هذا مكانًا لزائر عابر.


    للنهر الكارستي تقويمه الخاص. في الربيع وبعد الأمطار الغزيرة يكون أونيوري صاخبًا غزيرًا، وبحلول أواخر
    الصيف قد يرقّ حتى يصير شريطًا واحدًا. عند أسفل الجرف يمتلئ الهواء بالرذاذ، والحجارة مكسوّة بالطحالب
    لا تجف أبدًا، وحتى في ظهيرة تموز/يوليو يبقى المكان هنا بارداً منعشاً.


    ويضمّ حوض النهر نفسه أعجوبة ثانية: شلال توبا، وهو شلال متدرّج ارتفاعه 234 مترًا تغذّيه مياه كهف أرسين
    أوكروجاناشفيلي البالغ طوله 1.3 كيلومتر، ويقود إليه درب مُعلَّم. قلّة من الناس رأت أيًّا منهما، وفي
    ذلك جانب كبير من سحرهما؛ فالأرجح أن تتقاسم الغابة مع الطيور لا مع حافلات الرحلات السياحية.


    ما تراه أمامك هو الثانية الأخيرة من رحلة طويلة عبر الظلام.
  tip: >-
    خصّص ساعتين إلى ثلاث بما في ذلك المشي ذهابًا وإيابًا. المرحلة الأخيرة سيرًا على الأقدام عبر الغابة
    فوق الطين والجذور، وهي زلقة بعد المطر، لذا لا غنى عن حذاء ذي نعل متماسك حقًا، وتفيد عصيّ المشي. اللافتات
    نادرة: نزّل خريطة تعمل دون اتصال واسأل عن الطريق في قرى بالدا قبل الانطلاق. ابتعد عن الصخور المبتلة
    عند حافة الشلال، ولا تدخل الكهف من دون مختص في الكهوف. لا توجد أي مرافق، فاحمل الماء والطعام من مارتفيلي.
    يبلغ التدفق أوجه في أيار/مايو وحزيران/يونيو، ومن تموز/يوليو ستحتاج إلى طارد للحشرات.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غربًا حتى منطقة كوتايسي، ثم انعطف نحو خوني وتابع عبر باندزا إلى مارتفيلي،
    ومنها اتجه شمالًا مرورًا بقرى بالدا نحو التلال: نحو 318 كم و5 ساعات و10 دقائق حتى بداية الممشى. يمتد
    الإسفلت حتى مارتفيلي، وبعدها تفسح الطرق القروية المجال لمسلك غابي ضيق كثير الأخاديد لا ينبغي لسيارة
    منخفضة أن تغامر به، ويحتاج بعد المطر إلى دفع رباعي، ولهذا يُنصح بسيارة رباعية الدفع مرتفعة. اترك السيارة
    حيث ينتهي المسلك وأكمل سيرًا. املأ الخزان في مارتفيلي، إذ لا وقود بعدها.
