ka:
  name: ლატალი და მაცხვარიშის ეკლესია
  short: სვანეთის ეკლესიებით ყველაზე მდიდარი თემი მესტიის დასავლეთით, სადაც 1140 წლის თევდორეს ფრესკები
    ინახება.
  body: >-
    **ლატალში იმაზე მეტი შუასაუკუნეების ეკლესიაა, ვიდრე სვანეთის ნებისმიერ სხვა თემში.** ეს არ არის ერთი
    ძეგლი, არამედ დაახლოებით ოცდაათი პატარა უბანი მესტიიდან თორმეტიოდე კილომეტრში დასავლეთით, იქ, სადაც
    მულხრა ენგურს უერთდება. ადგილობრივები ორმოცზე მეტ ეკლესიას ითვლიან.


    ყველა მათგანი პატარაა: ერთნავიანი დარბაზული ეკლესია, კამაროვანი გადახურვით, ქვის ფილების სახურავითა
    და ისეთი ვიწრო სარკმლებით, რომ შიგნით შუადღესაც ბინდია. სამაგიეროდ, კედლები მთლიანად მოხატულია.


    მთავარი მაცხვარიშის მაცხოვრის ეკლესიაა. მისი მხატვრობა 1140 წელს შეასრულა თევდორემ, რომელსაც წყაროები
    დემეტრე I-ის კარის მხატვარს უწოდებენ. აქ არის ერთი განსაკუთრებული სცენა — სვანი ფეოდალის საერო გამოსახულება,
    რომელიც შუასაუკუნეების ქართულ კედლის მხატვრობაში იშვიათობაა და მკვლევრებს დღემდე აინტერესებს.


    თევდორეს ხელი სვანეთის სხვა ეკლესიებშიც ჩანს: ნაკიფარის წმინდა გიორგი (1130) და იფრარის მთავარანგელოზები
    (1096). ეს ის იშვიათი შემთხვევაა, როცა ერთი შუასაუკუნეების ქართველი მხატვრის შემოქმედება რამდენიმე
    შენობაზე შეიძლება თვალის მიდევნება.


    ლატალის სხვა უბნებშიც — იენაშში, ლახუშდსა და სიდიანარში — ეკლესიებია XI-XII საუკუნეების მხატვრობით.
    ზოგი გაწმენდილია, ზოგი გამურული, ზოგიც ჩამონგრეული სახურავის ქვეშ.


    აქ მთავარი პრაქტიკული საკითხი გასაღებია. სალარო არ არსებობს, ბილეთი არ იყიდება; თითოეულ ეკლესიას კონკრეტული
    ოჯახი უვლის და კარს ის აღებს. ზოგი ეკლესია მხოლოდ წინასწარი შეთანხმებით იღება, ზოგი კი საერთოდ არა.
    შემოწირულობა მოსალოდნელია და ბუნებრივი.


    ამიტომ ლატალი მოთმინებას მოითხოვს. უბრალოდ მისვლა და შესვლა არ გამოვა. ყველაზე მარტივი გზა ისაა, რომ
    სასტუმროს მასპინძელმა ან გიდმა წინასწარ დარეკოს; მესტიაში ამის მოწყობა რთული არაა.


    ფოტოს გადაღება ცალკე თემაა: ბევრი ოჯახი საერთოდ არ იძლევა ნებართვას, ხოლო ანთებული შუქი ყველგან აკრძალულია.
    ეს არ არის თავაზიანობის საკითხი — ეს ფრესკის შენარჩუნებაა.


    ლატალის ეკლესიები იმითაც არის საინტერესო, რომ ისინი სამრევლო და არა სამონასტრო ნაგებობებია: თითოეული
    პატარა უბანი თავის ეკლესიას აშენებდა და თავადვე ინახავდა. ამან განაპირობა მათი რაოდენობაც და ის, რომ
    დღემდე ოჯახებს ეკუთვნის.


    გარშემო თივის მდელოებია, კოშკები და, ნათელ ამინდში, ჩრდილოეთით უშბის ორთავიანი მასივი. სწორედ ეს კომბინაცია
    — პატარა ბნელი ეკლესია და მის უკან ოთხი ათას მეტრზე მაღალი მთა — ხდის ლატალს დასამახსოვრებელს.


    ერთი საათი ერთ ეკლესიაზე; ნახევარი დღე, თუ სამი ან ოთხი გინდა.
  tip: >-
    ერთი საათი ერთი ეკლესიისთვის კმარა, ნახევარი დღე — რამდენიმესთვის. მთავარია გასაღები: მოაწყე წინასწარ
    მასპინძლის ან გიდის მეშვეობით, თორემ დაკეტილ კარს წააწყდები. შემოწირულობა თან იქონიე, წვრილი ფული.
    შიგნით ბნელია და ცივი, ზაფხულშიც — ქურთუკი გამოგადგება. ფანარი დაგეხმარება, ოღონდ ფრესკაზე პირდაპირ
    ნუ მიმართავ და ფლეშს ნურასოდეს გამოიყენებ. ჩაცმის წესები მოქმედებს. ტუალეტი და კაფე მხოლოდ სასტუმროებშია,
    ამიტომ წინასწარ გაითვალისწინე. ზამთარში მისვლა შესაძლებელია, მაგრამ შესახვევები მოყინულია და გასაღების
    პოვნაც უფრო ძნელია.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდისკენ და ჩრდილოეთით ენგურის ხეობის გზით — ლატალი მესტიამდე
    თორმეტიოდე კილომეტრით ადრეა, გზის მარცხნივ. სულ დაახლოებით 458 კმ და რვა საათი თხუთმეტი წუთი. მთავარი
    გზა ასფალტია, ვიწრო და სერპანტინიანი; ქვათაცვენა ხშირია. თავად უბნებამდე მოკლე ღორღიანი შესახვევებია,
    ციცაბო და წვიმის შემდეგ სრიალა — შემაღლებული ავტომობილი სჯობს. საწვავი ზუგდიდში აიღე — ხაიშის სადგური
    ყოველთვის არ მუშაობს. მანქანა უბნის შესასვლელთან დატოვე და ეზოებში ფეხით შედი; გზები ვიწროა და შემობრუნება
    ძნელია.
en:
  name: Latali and the Matskhvarishi Church
  short: The community with the most medieval churches in Svaneti, west of Mestia, holding Tevdore’s frescoes
    of 1140.
  body: >-
    **Latali holds more medieval churches than any other community in Svaneti.** It is not a single monument
    but a scatter of some thirty hamlets twelve kilometres west of Mestia, where the Mulkhra meets the
    Enguri. Local counts run past forty small churches.


    All of them are small: single-nave hall churches with a barrel vault, roofs of stone slabs, and windows
    so narrow that the interior is dim even at midday. The compensation is that the walls are painted
    from floor to vault.


    The one to see is the Church of the Saviour at Matskhvarishi. Its murals were painted in 1140 by Tevdore,
    described in the sources as court painter to King Demetrius I. Among them is an unusual secular scene
    showing a Svan lord, a rarity in medieval Georgian wall painting that scholars are still arguing about.


    Tevdore's hand appears elsewhere in Svaneti too, at St George in Nakipari (1130) and the Archangels
    at Iprari (1096). This is one of the rare cases where the work of a single medieval Georgian painter
    can be followed across several buildings.


    Other Latali hamlets — Ienashi, Lakhushdi, Sidianari — have churches with painting of the eleventh
    and twelfth centuries. Some have been cleaned, some are black with soot, and a few stand under failing
    roofs.


    The practical issue here is the key. There is no ticket office and no cash desk. Each church is looked
    after by a particular family, and they open the door. Some are opened only by arrangement and some
    not at all. A donation is expected and entirely reasonable.


    Latali therefore takes patience. Turning up and walking in does not work. The simplest approach is
    to have a guesthouse host or a guide telephone ahead, which is easy enough to arrange in Mestia.


    Photography is its own question. Many families refuse it outright, and flash is forbidden everywhere.
    This is not politeness; it is what keeps the pigment on the wall.


    Around the churches are hay meadows, towers and, on a clear day, the twin summits of Ushba to the
    north. That combination — a small dark church with a four-thousand-metre mountain behind it — is what
    makes Latali stay in the memory.


    An hour is enough for one church; half a day if you want three or four.
  tip: >-
    An hour covers one church, half a day covers several. The key is everything: arrange it in advance
    through a guesthouse or guide, or you will find locked doors. Carry small notes for the donation.
    It is dark and cold inside even in summer, so bring a jacket. A torch helps, but never point it straight
    at a fresco and never use flash. Dress rules apply. Toilets and cafés exist only at the guesthouses,
    so plan around that.
  route: >-
    From Tbilisi take the E60 to Senaki, continue to Zugdidi and head north up the Enguri valley; Latali
    lies about twelve kilometres before Mestia, on the left of the road. About 458 km in all, eight hours
    fifteen. The main road is asphalt, narrow and endlessly winding, with frequent rockfall. The hamlets
    themselves are reached by short gravel side turnings that are steep and slippery after rain, so a
    raised car is better. Refuel in Zugdidi; the station at Khaishi is not always working.
ru:
  name: Латали и церковь Мацхвариши
  short: Община с наибольшим числом средневековых церквей в Сванетии, к западу от Местии, с фресками Тевдоре
    1140 года.
  body: >-
    **В Латали больше средневековых церквей, чем в любой другой общине Сванетии.** Это не один памятник,
    а рассыпанные по склонам три десятка хуторов в двенадцати километрах западнее Местии, там, где Мулхра
    впадает в Ингури. Местные насчитывают больше сорока небольших храмов.


    Все они маленькие: однонефные зальные церкви со сводом, крыши из каменных плит, окна такие узкие,
    что внутри сумрачно даже в полдень. Зато стены расписаны от пола до свода.


    Смотреть надо церковь Спасителя в Мацхвариши. Её росписи выполнил в 1140 году Тевдоре, которого источники
    называют придворным живописцем царя Деметре I. Среди них есть необычная светская сцена со сванским
    феодалом — редкость для грузинской средневековой стенописи, о которой исследователи спорят до сих
    пор.


    Рука Тевдоре видна и в других местах Сванетии: в церкви святого Георгия в Накипари (1130) и в Архангельской
    церкви в Ипрари (1096). Это редкий случай, когда работу одного средневекового грузинского мастера
    можно проследить по нескольким зданиям.


    В других хуторах Латали — Иенаши, Лахушди, Сидианари — тоже есть церкви с росписью XI–XII веков. Часть
    расчищена, часть черна от копоти, а некоторые стоят под прохудившейся крышей.


    Практический вопрос здесь — ключ. Ни кассы, ни билетов не существует. За каждой церковью присматривает
    конкретная семья, и дверь открывает она. Некоторые храмы открывают только по договорённости, а некоторые
    не открывают вовсе. Пожертвование ожидается и вполне уместно.


    Поэтому Латали требует терпения. Просто приехать и войти не получится. Проще всего, если хозяин гостевого
    дома или гид позвонит заранее; в Местии это устраивается без труда.


    Съёмка — отдельная тема. Многие семьи отказывают наотрез, а вспышка запрещена везде. Это не вопрос
    вежливости: именно так пигмент остаётся на стене.


    Вокруг сенокосы, башни и, в ясный день, двуглавая Ушба на севере. Это сочетание — маленькая тёмная
    церковь и четырёхтысячник за ней — и делает Латали незабываемым.


    Часа хватит на одну церковь; полдня, если хочется три или четыре.
  tip: >-
    Часа достаточно на одну церковь, полдня — на несколько. Всё решает ключ: договаривайтесь заранее через
    гостевой дом или гида, иначе упрётесь в запертые двери. Возьмите мелкие купюры на пожертвование. Внутри
    темно и холодно даже летом, так что куртка пригодится. Фонарик помогает, но не светите прямо на фреску
    и никогда не пользуйтесь вспышкой. Действуют правила одежды. Туалеты и кафе есть только при гостевых
    домах.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше до Зугдиди и на север по ущелью Ингури; Латали лежит километрах
    в двенадцати не доезжая Местии, слева от дороги. Всего около 458 км и восемь часов пятнадцать минут.
    Основная дорога асфальтированная, узкая и бесконечно извилистая, камнепады не редкость. К самим хуторам
    ведут короткие гравийные съезды, крутые и скользкие после дождя, так что машина с клиренсом предпочтительнее.
    Заправляйтесь в Зугдиди: станция в Хаиши работает не всегда.
fa:
  name: لاتالی و کلیسای ماتسخواریشی
  short: پرکلیساترین اجتماع سده‌های میانه در سوانتی، غرب مستیا، با فرسک‌های تئودوره از سال ۱۱۴۰.
  body: >-
    **لاتالی بیش از هر اجتماع دیگری در سوانتی کلیسای سده‌های میانه دارد.** این یک بنای واحد نیست، بلکه
    حدود سی آبادی پراکنده در دوازده کیلومتری غرب مستیا است، آنجا که مولخرا به اینگوری می‌ریزد. اهالی بیش
    از چهل کلیسای کوچک می‌شمارند.


    همه کوچک‌اند: کلیساهای تک‌شبستانی با طاق گهواره‌ای، بام‌هایی از تختهٔ سنگ، و پنجره‌هایی چنان باریک
    که درون حتی در ظهر گرگ‌ومیش است. در عوض دیوارها از کف تا طاق نقاشی شده‌اند.


    آنکه باید دید کلیسای منجی در ماتسخواریشی است. نقاشی‌های آن را در ۱۱۴۰ تئودوره کشید، که منابع او را
    نقاش دربار دیمیتری یکم می‌خوانند. در میان آنها صحنه‌ای غیردینی و کم‌نظیر هست که اربابی سوانی را نشان
    می‌دهد؛ نمونه‌ای نادر در نقاشی دیواری گرجی سده‌های میانه که پژوهشگران هنوز دربارهٔ آن بحث می‌کنند.


    دست تئودوره در جاهای دیگر سوانتی هم دیده می‌شود: کلیسای گئورگی مقدس در ناکیپاری (۱۱۳۰) و کلیسای فرشتگان
    مقرب در ایپراری (۱۰۹۶). این از موارد نادری است که می‌توان کار یک نقاش گرجی سده‌های میانه را در چند
    بنا دنبال کرد.


    در آبادی‌های دیگر لاتالی — یناشی، لاخوشدی، سیدیاناری — نیز کلیساهایی با نقاشی سده‌های یازدهم و دوازدهم
    هست. برخی پاک‌سازی شده‌اند، برخی از دوده سیاه‌اند و چند تایی زیر بامی فرسوده ایستاده‌اند.


    مسئلهٔ عملی اینجا کلید است. نه گیشه‌ای هست و نه بلیتی. هر کلیسا را خانواده‌ای معین نگه می‌دارد و در
    را همان می‌گشاید. برخی تنها با هماهنگی قبلی باز می‌شوند و برخی اصلاً باز نمی‌شوند. کمک نقدی انتظار
    می‌رود و کاملاً به‌جاست.


    پس لاتالی حوصله می‌خواهد. سررسیدن و وارد شدن جواب نمی‌دهد. ساده‌ترین راه آن است که میزبان اقامتگاه
    یا راهنما پیشاپیش تلفن کند؛ ترتیب دادن این کار در مستیا آسان است.


    عکاسی موضوعی جداست. بسیاری از خانواده‌ها یکسره اجازه نمی‌دهند و فلاش همه‌جا ممنوع است. این مسئلهٔ
    ادب نیست؛ همین است که رنگ را روی دیوار نگه می‌دارد.


    پیرامون کلیساها چمنزارهای علوفه و برج‌هاست و در روز صاف قله‌های دوقلوی اوشبا در شمال. همین ترکیب —
    کلیسایی کوچک و تاریک با کوهی چهارهزارمتری در پس آن — لاتالی را ماندگار می‌کند.


    یک ساعت برای یک کلیسا کافی است و نیم روز اگر سه چهار تا بخواهید.
  tip: >-
    یک ساعت یک کلیسا را پوشش می‌دهد و نیم روز چند تا را. کلید همه چیز است: پیشاپیش از راه اقامتگاه یا
    راهنما هماهنگ کنید وگرنه به درهای بسته می‌خورید. پول خرد برای کمک همراه داشته باشید. داخل حتی در تابستان
    تاریک و سرد است، پس کاپشن بردارید. چراغ‌قوه کمک می‌کند، اما هرگز آن را مستقیم به فرسک نتابانید و از
    فلاش استفاده نکنید. قواعد پوشش برقرار است. سرویس بهداشتی و کافه تنها در اقامتگاه‌ها هست.
  route: >-
    از تفلیس با E60 تا سناکی، سپس تا زوگدیدی و به شمال در درهٔ اینگوری؛ لاتالی حدود دوازده کیلومتر پیش
    از مستیا، سمت چپ جاده است. رویهم حدود ۴۵۸ کیلومتر و هشت ساعت و پانزده دقیقه. جادهٔ اصلی آسفالت و باریک
    و بی‌پایان پرپیچ است و ریزش سنگ در آن معمول. خود آبادی‌ها با انشعاب‌های کوتاه شنی به دست می‌آیند که
    تند و پس از باران لغزنده‌اند، پس خودروی مرتفع بهتر است. سوخت را در زوگدیدی بگیرید؛ پمپ خایشی همیشه
    کار نمی‌کند.
he:
  name: לטלי וכנסיית מצחווארישי
  short: הקהילה שבה מספר הכנסיות מימי הביניים הגדול בסוונתי, ממערב למסטיה, ובה ציורי טוודורה משנת 1140.
  body: >-
    **בלטלי יש יותר כנסיות מימי הביניים מאשר בכל קהילה אחרת בסוונתי.** אין זה אתר יחיד אלא פזורה של כשלושים
    כפרונים שנים-עשר קילומטרים ממערב למסטיה, במקום שבו המולחרה נשפכת אל האינגורי. הספירות המקומיות מגיעות
    ליותר מארבעים כנסיות קטנות.


    כולן קטנות: כנסיות אולם חד-אולמיות עם קמרון חבית, גגות של לוחות אבן, וחלונות צרים כל כך שבפנים אפלולי
    גם בצהריים. הפיצוי הוא שהקירות מצוירים מן הרצפה ועד הקמרון.


    זו שכדאי לראות היא כנסיית המושיע במצחווארישי. את ציוריה צייר בשנת 1140 טוודורה, שהמקורות מתארים אותו
    כצייר החצר של המלך דמטרה הראשון. בין הציורים יש סצנה חילונית יוצאת דופן ובה אציל סוואני, נדירות בציור
    הקיר הגאורגי של ימי הביניים שהחוקרים עדיין מתווכחים עליה.


    ידו של טוודורה נראית גם במקומות אחרים בסוונתי: בכנסיית גאורגיוס הקדוש בנקיפארי (1130) ובכנסיית המלאכים
    באיפררי (1096). זה אחד המקרים הנדירים שבהם אפשר לעקוב אחר עבודתו של צייר גאורגי אחד מימי הביניים בכמה
    מבנים.


    גם בכפרוני לטלי האחרים — ינאשי, לחושדי, סידיאנרי — יש כנסיות עם ציור מן המאות האחת-עשרה והשתים-עשרה.
    חלקן נוקו, חלקן שחורות מפיח, ואחדות עומדות תחת גג מתפורר.


    הסוגיה המעשית כאן היא המפתח. אין קופה ואין כרטיסים. על כל כנסייה מופקדת משפחה מסוימת, והיא הפותחת
    את הדלת. אחדות נפתחות רק בתיאום מראש ואחדות אינן נפתחות כלל. תרומה מצופה והיא סבירה לגמרי.


    לכן לטלי דורשת סבלנות. להגיע ולהיכנס פשוט לא עובד. הדרך הפשוטה ביותר היא שבעל אכסניה או מדריך יטלפן
    מראש, וזה קל להסדרה במסטיה.


    הצילום הוא עניין בפני עצמו. משפחות רבות מסרבות לחלוטין, ומבזק אסור בכל מקום. אין זו נימוס בלבד; זה
    מה ששומר את הפיגמנט על הקיר.


    סביב הכנסיות משתרעים אחו חציר ומגדלים, וביום בהיר נראים פסגותיה הכפולות של אושבה בצפון. הצירוף הזה
    — כנסייה קטנה וחשוכה והר בן ארבעת אלפים מטרים מאחוריה — הוא שנחרת בזיכרון.


    שעה מספיקה לכנסייה אחת; חצי יום אם רוצים שלוש או ארבע.
  tip: >-
    שעה מכסה כנסייה אחת, חצי יום מכסה כמה. המפתח הוא הכול: תאמו מראש דרך אכסניה או מדריך, אחרת תיתקלו
    בדלתות נעולות. קחו שטרות קטנים לתרומה. בפנים חשוך וקר גם בקיץ, לכן הביאו מעיל. פנס עוזר, אך לעולם
    אל תכוונו אותו ישר אל ציור הקיר ואל תשתמשו במבזק. חלים כללי לבוש. שירותים ובתי קפה קיימים רק באכסניות,
    אז תכננו בהתאם. אפשר להגיע גם בחורף, אך דרכי הגישה מכוסות קרח ומציאת מחזיק המפתח קשה יותר.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי וצפונה במעלה עמק האינגורי; לטלי נמצאת כשנים-עשר קילומטרים
    לפני מסטיה, משמאל לכביש. כ-458 ק״מ בסך הכול, שמונה שעות וחמש-עשרה. הכביש הראשי סלול, צר ומתפתל בלי
    סוף, ומפולות אבנים שכיחות. אל הכפרונים עצמם מגיעים בפניות צדדיות קצרות ומחוצצות, תלולות וחלקלקות אחרי
    גשם, ולכן רכב מוגבה עדיף. תדלקו בזוגדידי; התחנה בחאישי אינה פועלת תמיד. השאירו את הרכב בכניסה לכפרון
    והמשיכו ברגל, כי הדרכים צרות וקשה מאוד להסתובב בהן.
ar:
  name: لاتالي وكنيسة ماتسخفاريشي
  short: أكثر مجتمعات سفانيتي كنائسَ وسيطة، غربي مستيا، وفيها رسوم تيفدوره من سنة 1140.
  body: >-
    **في لاتالي كنائس من العصور الوسطى أكثر مما في أي مجتمع آخر في سفانيتي.** وليست أثراً واحداً بل نحو
    ثلاثين قرية صغيرة متناثرة على بعد اثني عشر كيلومتراً غربي مستيا، حيث يصب المولخرا في إنغوري. ويعدّ
    الأهالي أكثر من أربعين كنيسة صغيرة.


    كلها صغيرة: كنائس صحن واحد بقبو نصف أسطواني، وسقوف من ألواح الحجر، ونوافذ ضيقة إلى حد أن الداخل معتم
    حتى في الظهيرة. والتعويض أن الجدران مصوَّرة من الأرض إلى القبو.


    وأولاها بالمشاهدة كنيسة المخلص في ماتسخفاريشي. رسم جدارياتها سنة 1140 تيفدوره، الذي تصفه المصادر بمصور
    بلاط الملك ديميتري الأول. وبينها مشهد دنيوي غير مألوف يظهر سيداً سفانياً، وهو ندرة في التصوير الجداري
    الجورجي الوسيط ما زال الباحثون يتجادلون فيها.


    وتظهر يد تيفدوره في مواضع أخرى من سفانيتي أيضاً: في كنيسة القديس جرجس بناكيباري (1130) وكنيسة رؤساء
    الملائكة بإبراري (1096). وهذه من الحالات النادرة التي يمكن فيها تتبع عمل مصور جورجي وسيط واحد عبر
    عدة مبانٍ.


    وفي قرى لاتالي الأخرى — ييناشي ولاخوشدي وسيدياناري — كنائس فيها تصوير من القرنين الحادي عشر والثاني
    عشر. بعضها نُظّف وبعضها أسود بالسناج، وقليل منها قائم تحت سقوف متداعية.


    والمسألة العملية هنا هي المفتاح. لا شباك تذاكر ولا بطاقات. تتولى كل كنيسةً أسرةٌ بعينها، وهي التي
    تفتح الباب. بعضها لا يُفتح إلا بموعد سابق وبعضها لا يُفتح أصلاً. والتبرع متوقع ومعقول تماماً.


    ولذلك تحتاج لاتالي إلى صبر. المجيء والدخول مباشرة لا ينفع. وأيسر السبل أن يتصل صاحب بيت الضيافة أو
    مرشد سلفاً، وترتيب ذلك سهل في مستيا.


    والتصوير مسألة قائمة بذاتها. كثير من الأسر ترفضه رفضاً تاماً، والفلاش ممنوع في كل مكان. وليست هذه
    مجاملة، بل هي ما يبقي الصباغ على الجدار.


    وحول الكنائس مروج حشيش وأبراج، وفي اليوم الصافي تظهر قمتا أوشبا التوأمان في الشمال. وهذا الاقتران
    — كنيسة صغيرة معتمة وخلفها جبل يتجاوز أربعة آلاف متر — هو ما يجعل لاتالي عالقة في الذاكرة.


    ساعة تكفي لكنيسة واحدة؛ ونصف يوم إن أردت ثلاثاً أو أربعاً.
  tip: >-
    ساعة تغطي كنيسة واحدة، ونصف يوم يغطي عدة كنائس. والمفتاح هو كل شيء: رتّبه مسبقاً عبر بيت ضيافة أو
    مرشد، وإلا وجدت أبواباً مغلقة. احمل أوراقاً نقدية صغيرة للتبرع. والداخل معتم بارد حتى في الصيف، فخذ
    سترة. المصباح اليدوي يساعد، لكن لا توجهه إلى الرسم مباشرة ولا تستخدم الفلاش. وقواعد اللباس مطبقة.
    ودورات المياه والمقاهي لا توجد إلا في بيوت الضيافة.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم إلى زوغديدي وشمالاً في وادي إنغوري؛ ولاتالي على نحو اثني عشر
    كيلومتراً قبل مستيا، على يسار الطريق. نحو 458 كم إجمالاً وثماني ساعات وخمس عشرة دقيقة. الطريق الرئيسي
    معبّد وضيق دائم الالتواء، وسقوط الصخور شائع فيه. أما القرى نفسها فيُوصل إليها بمنعطفات حصوية قصيرة
    شديدة الانحدار وزلقة بعد المطر، فالمركبة المرتفعة أفضل. تزوّد بالوقود في زوغديدي؛ فمحطة خايشي لا تعمل
    دائماً.
