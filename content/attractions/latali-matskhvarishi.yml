ka:
  name: ლატალი და მაცხვარიშის ეკლესია
  short: >-
    მაცხვარიშის მაცხოვრის ეკლესია ლატალის თემში: 1140 წელს მიქაელ მაღლაკელის მოხატული კედლები და დემეტრე
    I-ის გამეფების სცენა.
  body: >-
    **სოფლის ბეღლის ოდენა ქვის დარბაზში ქართველი მეფე 1140 წლიდან დღემდე გვირგვინს იღებს.**


    მაცხოვრის ეკლესია — სვანურად მაცხვარ, საიდანაც სოფელ მაცხვარიშს სახელი დაერქვა — ლატალის თემის დასავლეთ
    კიდეზე, ბორცვზე დგას, ზღვის დონიდან დაახლოებით 1360 მეტრზე, მესტიამდე სულ ცოტა ადრე. ეს სადა დარბაზული
    ეკლესიაა, კარგად გათლილი კირქვით ნაგები; შიგნით ოთხი პატარა სარკმელი ანათებს, სამხრეთით კი მოგვიანებით
    მიშენებული თაღედი ახლავს. წარწერა მოხატულობას დემეტრე I-ის მეფობის მეთხუთმეტე წლით, ანუ 1140 წლით,
    ათარიღებს და ოსტატსაც ასახელებს: „ხელითა მიქაელ მაღლაკელისათა“.


    თვალს შეგუების დრო მიეცით. საკურთხეველში ვედრებაა, მის ქვემოთ — მოციქულთა რიგი; კედლებზე საუფლო დღესასწაულები
    სამ იარუსად იშლება, ყველაზე ქვემოთ კი შარავანდედიანი მხედრები მიჰყვებიან ერთმანეთს — სვანური მხატვრობის
    საყვარელი ცხენოსანი წმინდანები. ჩრდილოეთ კედლის დასავლეთ თაღში ის სცენაა, რისთვისაც აქ ამოდიან: სამეფო
    სამოსით შემოსილ დემეტრეს ქრისტე აკურთხებს, მთავარანგელოზი გაბრიელი თავზე გვირგვინს ადგამს, ორი ადგილობრივი
    ერისთავი კი ხმალს არტყამს. ხელოვნებათმცოდნე ენტონი ისტმონდი ამ სცენაში სამეფო ხელისუფლების ზეიმს ხედავს,
    რომელშიც მთის დიდებულებსაც თავიანთი წილი ერგებათ.


    მაღლაკელის ხელწერაზე უფროსი ოსტატის, „მეფის მხატვრად“ წოდებული თევდორეს გავლენა ეტყობა. თევდორეს თარიღიანი
    მოხატულობები ზემო სვანეთის სხვა ეკლესიებშიც შემორჩა: იფრარში (1096), ლაგურკაში (1112) და ნაკიფარში
    (1130).


    შესვლამდე სამხრეთის კარს დააკვირდით: X–XI საუკუნეების ჩუქურთმიანი ხის კარია, რომელიც თანდართული წარწერის
    მიხედვით კვირიკე აგიდულიანს ეკუთვნის. 1910 წელს აქ მოსულმა ექვთიმე თაყაიშვილმა ამ პატარა შენობაში
    ბიზანტიური და ქართული საეკლესიო ნივთების მთელი საგანძური აღწერა. გვერდით XVII–XVIII საუკუნეების სამრეკლო
    დგას, მოწმენდილ დღეს კი აღმოსავლეთით, ცის კიდეზე, თეთნულდის თეთრი მწვერვალი მოჩანს.


    ოთახი პატარაა, მაგრამ მასში მთელი სამეფო ეტევა.
  tip: >-
    ერთი საათი სავსებით საკმარისია. ეკლესია ხშირად დაკეტილია: გასაღების პატრონი მაცხვარიშში იკითხეთ, ან
    მესტიის სასტუმროს მასპინძელს სთხოვეთ, წინასწარ დარეკოს. ბილეთი არ იყიდება — შემოწირულობა დატოვეთ.
    შიგნით ივლისშიც ბნელი და ცივია, ამიტომ თბილი სამოსი და პატარა ფანარი წაიღეთ, ოღონდ სინათლეს მხატვრობას
    პირდაპირ ნუ მიაპყრობთ და ფლეშს ნურასოდეს გამოიყენებთ; გადაღებამდე ნებართვა ითხოვეთ. ჩაცმის წესი მოქმედებს:
    დაფარული მხრები და მუხლები, ქალებს — თავსაფარი. ეკლესიასთან არც ტუალეტია, არც კაფე — უახლოესი მესტიაშია.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით, ქუთაისისა და სენაკის გავლით, ზუგდიდამდე იარეთ, იქიდან კი ჩრდილოეთით
    შ7-ზე გადადით, რომელიც ენგურის ხეობას ჯვრისა და ენგურის წყალსაცავის გავლით მესტიისკენ მიუყვება. მაცხვარიში
    ლატალის თემის დასავლეთ კიდეზეა, შ7-ის სიახლოვეს, მესტიამდე სულ ცოტა ადრე: სულ დაახლოებით 458 კმ და
    8 საათი და 15 წუთი. შ7 ასფალტიანია, მაგრამ ვიწრო და დაუსრულებლად კლაკნილი; წვიმის შემდეგ და გაზაფხულზე
    ქვათაცვენა ხშირია. ეკლესიამდე ამავალი ბოლო შესახვევი მოკლე, ციცაბო და ნაწილობრივ მოუასფალტებელია —
    სწორედ ამიტომ ჯობს მაღალი გამავლობის ავტომობილი. საწვავი ზუგდიდში შეავსეთ, ხეობა კი დღის სინათლეზე
    გაიარეთ.
en:
  name: Latali and the Matskhvarishi Church
  short: >-
    A hilltop church in Svaneti's Latali community, painted in 1140 by Mikael Maghlakeli, with a Georgian
    king's coronation on its wall.
  body: >-
    **In a stone hall no bigger than a village barn, a Georgian king has been receiving his crown since
    1140.**


    The Church of the Saviour, Matskhvar in Svan, the word that gave the village of Matskhvarishi its
    name, stands on a hilltop at the western end of the Latali community, about 1,360 metres up. It is
    a plain hall of well-dressed limestone, lit by four small windows, with a later arcade along its south
    side. An inscription dates the painting to the fifteenth year of Demetre I's reign, 1140, and names
    the hand: Mikael Maghlakeli.


    Give your eyes a minute. In the sanctuary Christ sits in the Deesis above a row of apostles; along
    the walls the great feasts unroll in three tiers, and along the bottom ride haloed horsemen, the mounted
    saints Svan painters loved. In the western arch of the north wall is the scene people climb up for:
    Demetre in royal robes, blessed by Christ, crowned by the archangel Gabriel, while two local eristavis
    gird him with a sword. The art historian Antony Eastmond reads it as a celebration of royal power
    that pointedly gives the mountain lords their share.


    Maghlakeli's style shows the influence of an older master, Tevdore, "the King's Painter", whose dated
    cycles survive elsewhere in Upper Svaneti: Iprari (1096), Lagurka (1112) and Nakipari (1130).


    Before you go in, look at the south door: carved wood of the tenth or eleventh century, signed in
    an inscription by Kvirike Agiduliani. When Ekvtime Takaishvili came here in 1910, he catalogued a
    treasury of Byzantine and Georgian church objects in this small building. The bell tower beside it
    dates from the seventeenth or eighteenth century, and on a clear day Tetnuldi stands white on the
    eastern skyline.


    It is a small room, and it holds a kingdom.
  tip: >-
    Allow an hour. The church is often locked: ask in Matskhvarishi for whoever keeps the key, or have
    your Mestia guesthouse phone ahead, and leave a donation, as there is no ticket. Inside it is dim
    and cold even in July, so bring a layer and a small torch, but never shine it straight at the paint
    and never use flash; ask before taking any photograph. Modest dress applies: covered shoulders and
    knees, a headscarf for women. There are no toilets or cafés at the church; the nearest are in Mestia.
  route: >-
    From Tbilisi follow the E60/S1 west past Kutaisi and Senaki to Zugdidi, then turn north onto the Sh7,
    which climbs the Enguri gorge past Jvari and the Enguri reservoir towards Mestia. Matskhvarishi lies
    at the western end of the Latali community, just off the Sh7 a short way before Mestia: about 458
    km and 8 h 15 min in all. The Sh7 is asphalt but narrow and endlessly winding, with rockfall after
    rain and in spring. The last lane up to the church is short, steep and partly unpaved, which is why
    an SUV is the sensible class here. Fill up in Zugdidi and drive the gorge in daylight.
ru:
  name: Латали и церковь Мацхвариши
  short: >-
    Церковь на холме в сванской общине Латали: в 1140 году её расписал Микаэл Маглакели, и на её стене
    грузинского царя венчают на царство.
  body: >-
    **В каменном зале размером с деревенский сарай грузинский царь принимает корону с 1140 года.**


    Церковь Спаса — по-свански Мацхвар, отсюда и название села Мацхвариши — стоит на вершине холма в западном
    конце общины Латали, на высоте около 1360 метров. Это простой зал из хорошо отёсанного известняка,
    освещённый четырьмя маленькими окнами, с позднейшей аркадой вдоль южной стены. Надпись датирует роспись
    пятнадцатым годом царствования Деметре I, то есть 1140-м, и называет мастера: Микаэл Маглакели.


    Дайте глазам минуту привыкнуть к полумраку. В алтаре Христос восседает в Деисусе над рядом апостолов;
    по стенам в три яруса разворачиваются сцены великих праздников, а внизу скачут конные святые в нимбах
    — их особенно любили сванские живописцы. В западной арке северной стены — та сцена, ради которой сюда
    и поднимаются: Деметре в царском облачении, Христос его благословляет, архангел Гавриил венчает короной,
    а двое местных эриставов опоясывают мечом. Историк искусства Энтони Истмонд видит в ней прославление
    царской власти, которая подчёркнуто отдаёт горным владетелям их долю.


    В манере Маглакели чувствуется влияние старшего мастера — Тевдоре, «царского живописца», чьи датированные
    циклы сохранились в других местах Верхней Сванетии: в Ипрари (1096), Лагурке (1112) и Накипари (1130).


    Прежде чем войти, взгляните на южную дверь: резное дерево X или XI века с надписью, называющей мастера,
    — Квирике Агидулиани. Когда в 1910 году сюда приехал Эквтиме Такаишвили, он описал в этом маленьком
    здании целую сокровищницу византийской и грузинской церковной утвари. Колокольня рядом относится к
    XVII или XVIII веку, а в ясный день на восточном горизонте белеет Тетнульди.


    Комната маленькая — а вмещает целое царство.
  tip: >-
    Отведите на визит час. Церковь часто заперта: спросите в Мацхвариши, у кого ключ, или попросите хозяев
    гостевого дома в Местиа позвонить заранее; билета нет, так что оставьте пожертвование. Внутри сумрачно
    и холодно даже в июле — возьмите тёплую кофту и небольшой фонарик, но никогда не направляйте луч прямо
    на роспись и не пользуйтесь вспышкой; прежде чем фотографировать, спросите разрешения. Одежда скромная:
    закрытые плечи и колени, женщинам — платок. У церкви нет ни туалетов, ни кафе; ближайшие — в Местиа.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Кутаиси и Сенаки до Зугдиди, затем на север по Sh7, которая поднимается
    по ущелью Ингури мимо Джвари и Ингурского водохранилища к Местиа. Мацхвариши лежит в западном конце
    общины Латали, чуть в стороне от Sh7, незадолго до Местиа: всего около 458 км и 8 ч 15 мин. Sh7 асфальтирована,
    но узкая и бесконечно петляет; после дождей и весной бывают камнепады. Последний проезд к церкви короткий,
    крутой и местами без асфальта — поэтому здесь разумен внедорожник. Заправьтесь в Зугдиди и проезжайте
    ущелье засветло.
fa:
  name: لاتالی و کلیسای متسخواریشی
  short: >-
    کلیسایی بر فراز تپه در بخش لاتالیِ سوانتی که میکائل مغلاکلی در ۱۱۴۰ نقاشی‌اش کرد و بر دیوارش تاج‌گذاری
    یک پادشاه گرجی نقش بسته است.
  body: >-
    **در تالاری سنگی که از انبار یک روستا بزرگ‌تر نیست، پادشاهی گرجی از سال ۱۱۴۰ تاج شاهی را دریافت می‌کند.**


    کلیسای منجی — به زبان سوانی «متسخوار»، واژه‌ای که نام روستای متسخواریشی از آن آمده — بر نوک تپه‌ای
    در انتهای غربی بخش لاتالی، در ارتفاع حدود ۱۳۶۰ متری ایستاده است. تالاری ساده از سنگ آهک خوش‌تراش است
    که چهار پنجرهٔ کوچک روشنش می‌کنند و در امتداد ضلع جنوبی‌اش رواقی طاق‌دار از دوره‌ای متأخرتر افزوده
    شده است. کتیبه‌ای تاریخ نقاشی‌ها را پانزدهمین سال سلطنت دمتره یکم، یعنی ۱۱۴۰، ثبت کرده و نام نقاش
    را می‌آورد: میکائل مغلاکلی.


    به چشمانتان یک دقیقه فرصت بدهید. در محراب، مسیح در صحنهٔ دئیسیس (شفاعت) بر فراز ردیفی از حواریون نشسته
    است؛ بر دیوارها جشن‌های بزرگ کلیسایی در سه ردیف گشوده می‌شوند و در پایین، سوارانِ هاله‌دار می‌تازند
    — قدیسان سواره‌ای که نقاشان سوانی دوستشان داشتند. در طاق غربی دیوار شمالی صحنه‌ای است که مردم برای
    دیدنش از تپه بالا می‌آیند: دمتره در جامهٔ شاهانه، مسیح تبرکش می‌کند، جبرئیلِ فرشتهٔ مقرب تاج بر سرش
    می‌نهد و دو اریستاوی (امیر محلی) شمشیر بر کمرش می‌بندند. آنتونی ایستموند، مورخ هنر، این صحنه را ستایش
    قدرت شاهانه‌ای می‌خواند که آگاهانه سهم امیران کوهستان را نیز به آنان می‌دهد.


    در سبک مغلاکلی تأثیر استادی کهن‌تر پیداست: تئودوره، «نقاش شاه»، که چرخه‌های تاریخ‌دار نقاشی‌اش در
    جاهای دیگر سوانتی علیا مانده است: ایپراری (۱۰۹۶)، لاگورکا (۱۱۱۲) و ناکیپاری (۱۱۳۰).


    پیش از ورود، به در جنوبی نگاه کنید: چوبی کنده‌کاری‌شده از سدهٔ دهم یا یازدهم که در کتیبه‌ای به نام
    کویریکه آگیدولیانی امضا شده است. اکوتیمه تاکایشویلی که در ۱۹۱۰ به اینجا آمد، در همین بنای کوچک گنجینه‌ای
    از اشیای کلیسایی بیزانسی و گرجی را فهرست کرد. برج ناقوسِ کنار آن از سدهٔ هفدهم یا هجدهم است و در روزهای
    صاف، تتنولدی سپیدپوش در افق شرقی قد می‌کشد.


    اتاقی کوچک است، و یک پادشاهی را در خود جا داده است.
  tip: >-
    یک ساعت وقت بگذارید. کلیسا اغلب قفل است: در متسخواریشی سراغ کسی را که کلید دارد بگیرید، یا از مهمان‌خانه‌تان
    در مستیا بخواهید پیش‌تر تماس بگیرد؛ بلیتی در کار نیست، پس اعانه‌ای بگذارید. درون کلیسا حتی در ژوئیه
    تاریک و سرد است؛ یک لباس گرم و چراغ‌قوهٔ کوچک همراه داشته باشید، اما هرگز نور را مستقیم روی نقاشی‌ها
    نیندازید و هرگز از فلاش استفاده نکنید؛ پیش از هر عکسی اجازه بگیرید. پوشش محجوب لازم است: شانه‌ها و
    زانوها پوشیده، و برای بانوان روسری. کنار کلیسا نه سرویس بهداشتی هست و نه کافه؛ نزدیک‌ترینشان در مستیاست.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب، از کنار کوتایسی و سناکی تا زوگدیدی بروید، سپس به شمال و جادهٔ
    Sh7 بپیچید که از درهٔ انگوری، از کنار جواری و مخزن سد انگوری، به سوی مستیا بالا می‌رود. متسخواریشی
    در انتهای غربی بخش لاتالی، اندکی بیرون از Sh7 و کمی پیش از مستیا قرار دارد: روی هم حدود ۴۵۸ کیلومتر
    و ۸ ساعت و ۱۵ دقیقه. Sh7 آسفالت است اما باریک و پرپیچ‌وخم، و پس از باران و در بهار ریزش سنگ دارد.
    راه پایانی تا کلیسا کوتاه، پرشیب و بخشی از آن خاکی است؛ برای همین یک خودروی شاسی‌بلند انتخاب معقول
    است. در زوگدیدی باک را پر کنید و دره را در روشنایی روز برانید.
he:
  name: לטאלי וכנסיית מצחווארישי
  short: כנסייה על ראש גבעה בקהילת לטאלי שבסוונטי, שצוירה ב-1140 בידי מיכאל מגלקלי, ועל קירה הכתרתו של
    מלך גאורגי.
  body: >-
    **באולם אבן שאינו גדול מאסם כפרי, מלך גאורגי מקבל את כתרו מאז 1140.**


    כנסיית המושיע — בסוואנית "מצחוואר", המילה שממנה נגזר שמו של הכפר מצחווארישי — עומדת על ראש גבעה בקצה
    המערבי של קהילת לטאלי, בגובה של כ-1,360 מטר. זהו אולם פשוט מאבן גיר מסותתת היטב, המואר בארבעה חלונות
    קטנים, ולאורך צדו הדרומי נוספה מאוחר יותר שורת קשתות. כתובת מתארכת את הציורים לשנה החמש-עשרה למלכותו
    של דמטרה הראשון, 1140, ונוקבת בשם הצייר: מיכאל מגלקלי.


    תנו לעיניים דקה להסתגל. באפסיס יושב ישו בסצנת הדאיסיס (התחינה), מעל שורת שליחים; לאורך הקירות נפרשים
    החגים הגדולים של הכנסייה בשלושה נדבכים, ובחלק התחתון רוכבים פרשים עטורי הילות — הקדושים הרכובים שציירי
    סוונטי אהבו. בקשת המערבית של הקיר הצפוני נמצאת הסצנה שבשבילה מטפסים לכאן: דמטרה בגלימות מלכות, ישו
    מברך אותו, המלאך גבריאל מניח את הכתר על ראשו, ושני אריסטאווים מקומיים (שליטי מחוזות) חוגרים לו חרב.
    היסטוריון האמנות אנתוני איסטמונד קורא בה חגיגה של כוח המלוכה, שמקפידה להעניק גם לאדוני ההרים את חלקם.


    בסגנונו של מגלקלי ניכרת השפעתו של אמן קדום ממנו, טבדורה, "צייר המלך", שמחזורי הציורים המתוארכים שלו
    שרדו במקומות אחרים בסוונטי עילית: איפררי (1096), לגורקה (1112) ונקיפרי (1130).


    לפני שנכנסים, הביטו בדלת הדרומית: עץ מגולף מן המאה העשירית או האחת-עשרה, החתום בכתובת בשמו של קוויריקה
    אגידוליאני. כשאקוותימה תקאישווילי הגיע לכאן ב-1910, הוא קטלג במבנה הקטן הזה אוצר שלם של תשמישי קדושה
    ביזנטיים וגאורגיים. מגדל הפעמונים הסמוך הוא מן המאה ה-17 או ה-18, וביום בהיר מתנשא הטטנולדי הלבן באופק
    המזרחי.


    זה חדר קטן, והוא מכיל ממלכה שלמה.
  tip: >-
    הקדישו שעה. הכנסייה נעולה לעיתים קרובות: שאלו במצחווארישי מי מחזיק במפתח, או בקשו מבית ההארחה שלכם
    במסטיה להתקשר מראש; אין כרטיס כניסה, אז השאירו תרומה. בפנים חשוך וקר גם ביולי, לכן הביאו שכבת לבוש
    נוספת ופנס קטן — אבל לעולם אל תכוונו אותו ישירות אל הציורים, ולעולם אל תשתמשו בפלאש; לפני כל צילום
    בקשו רשות. נדרש לבוש צנוע: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש. ליד הכנסייה אין שירותים ואין בתי
    קפה; הקרובים ביותר נמצאים במסטיה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני קוטאיסי וסנאקי עד זוגדידי, ומשם פנו צפונה לכביש Sh7, המטפס
    בערוץ האנגורי על פני ג'ווארי ומאגר האנגורי לכיוון מסטיה. מצחווארישי שוכנת בקצה המערבי של קהילת לטאלי,
    מעט מחוץ ל-Sh7, קצת לפני מסטיה: בסך הכול כ-458 ק״מ ו-8 שעות ורבע. ה-Sh7 סלול אך צר ומתפתל בלי סוף,
    ואחרי גשמים ובאביב יש מפולות סלעים. הדרך האחרונה אל הכנסייה קצרה, תלולה ובחלקה לא סלולה, ולכן רכב
    שטח הוא הבחירה הנבונה כאן. תדלקו בזוגדידי ועברו את הערוץ באור יום.
ar:
  name: لاتالي وكنيسة ماتسخفاريشي
  short: >-
    كنيسة على قمة تلٍّ في بلدة لاتالي بسفانيتي، زيّنها ميكائيل مغلاكيلي بالرسوم عام 1140، وعلى جدارها
    مشهد تتويج ملك جورجي.
  body: >-
    **في قاعة حجرية لا تزيد حجمًا على حظيرة قروية، ما زال ملك جورجي يتلقّى تاجه منذ عام 1140.**


    تقوم كنيسة المخلّص — «ماتسخفار» بالسفانية، وهي الكلمة التي منحت قرية ماتسخفاريشي اسمها — على قمة تلٍّ
    في الطرف الغربي من بلدة لاتالي، على ارتفاع نحو 1360 مترًا. إنها قاعة بسيطة من حجر جيري مُتقن النحت،
    تضيئها أربع نوافذ صغيرة، ويمتد على جانبها الجنوبي رواق مقنطر أُضيف لاحقًا. ويؤرّخ نقشٌ الرسومَ بالسنة
    الخامسة عشرة من حكم ديميتريه الأول، أي 1140، ويسمّي اليد التي رسمتها: ميكائيل مغلاكيلي.


    امنح عينيك دقيقة لتعتادا العتمة. في الهيكل يجلس المسيح في مشهد الشفاعة (الديسيس) فوق صفٍّ من الرسل؛
    وعلى الجدران تتوالى مشاهد الأعياد الكبرى في ثلاثة صفوف، وفي الأسفل يمضي فرسان مكلَّلون بالهالات —
    القديسون الفرسان الذين أحبّهم رسّامو سفانيتي. وفي القوس الغربي من الجدار الشمالي يقع المشهد الذي يصعد
    الناس من أجله: ديميتريه في ثيابه الملكية، يباركه المسيح، ويضع رئيس الملائكة جبرائيل التاج على رأسه،
    بينما يقلّده إريستافيان محليان (حاكما إقليم) السيف. ويقرأ مؤرخ الفن أنتوني إيستموند المشهد احتفاءً
    بالسلطة الملكية يحرص عن قصد على أن يمنح أمراء الجبال نصيبهم.


    ويظهر في أسلوب مغلاكيلي أثر معلّم أقدم منه، هو تيفدوره «رسام الملك»، الذي بقيت دوراته التصويرية المؤرخة
    في مواضع أخرى من سفانيتي العليا: إيبراري (1096) ولاغوركا (1112) وناكيباري (1130).


    وقبل أن تدخل، تأمّل الباب الجنوبي: خشب منحوت من القرن العاشر أو الحادي عشر، يحمل نقشًا باسم صانعه
    كفيريكه أغيدولياني. وحين جاء إكفتيمه تاكايشفيلي إلى هنا عام 1910، دوّن في هذا المبنى الصغير كنزًا
    كاملًا من الأواني والتحف الكنسية البيزنطية والجورجية. أما برج الأجراس المجاور فيعود إلى القرن السابع
    عشر أو الثامن عشر، وفي يوم صافٍ ينتصب تيتنولدي أبيضَ في الأفق الشرقي.


    إنها غرفة صغيرة، لكنها تتسع لمملكة.
  tip: >-
    خصّص ساعة. الكنيسة مقفلة في أغلب الأحيان: اسأل في ماتسخفاريشي عمّن يحمل المفتاح، أو اطلب من دار الضيافة
    في ميستيا أن تتصل مسبقًا، واترك تبرعًا إذ لا توجد تذكرة. في الداخل عتمة وبرد حتى في يوليو، فاحمل طبقة
    ملابس إضافية ومصباحًا صغيرًا، لكن لا توجّه ضوءه مباشرة إلى الرسوم أبدًا ولا تستعمل الفلاش؛ واستأذن
    قبل أي تصوير. اللباس المحتشم مطلوب: تغطية الكتفين والركبتين، وغطاء رأس للنساء. لا دورات مياه ولا مقاهي
    عند الكنيسة؛ أقربها في ميستيا.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا مرورًا بكوتايسي وسيناكي حتى زوغديدي، ثم انعطف شمالًا إلى الطريق
    Sh7 الذي يصعد في وادي إنغوري مرورًا بجفاري وخزان إنغوري نحو ميستيا. تقع ماتسخفاريشي في الطرف الغربي
    من بلدة لاتالي، على مقربة من Sh7 قبل ميستيا بمسافة قصيرة: نحو 458 كم و8 ساعات و15 دقيقة إجمالًا. الطريق
    Sh7 معبّد لكنه ضيق ولا تنتهي منعطفاته، وتتساقط عليه الصخور بعد المطر وفي الربيع. أما الممر الأخير
    إلى الكنيسة فقصير وشديد الانحدار وغير معبّد في جزء منه، ولذلك فسيارة الدفع الرباعي هي الخيار المعقول
    هنا. املأ خزان الوقود في زوغديدي واقطع الوادي في ضوء النهار.
