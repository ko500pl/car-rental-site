ka:
  name: გარდაბნის აღკვეთილი
  short: >-
    მტკვრის ჭალის ტყე აზერბაიჯანის საზღვართან, საქართველოში შემორჩენილი უიშვიათესი ტუგაის ტიპის ტყე.
  body: >-
    **გარდაბნის აღკვეთილი ჩვეულებრივი ტურისტული ობიექტი არ არის და არც ცდილობს იყოს.** ეს დაახლოებით 3500
    ჰექტარი მტკვრის ჭალის ტყეა ქვეყნის სამხრეთ-აღმოსავლეთ კუთხეში, აზერბაიჯანის საზღვართან, 280 მეტრზე —
    საქართველოს ერთ-ერთი ყველაზე დაბალი და ცხელი წერტილი.


    ის, რასაც აქ იცავენ, ტუგაია: მდინარისპირა ტყე, რომელიც პერიოდულ დატბორვას ეგუება. ვერხვი, ტირიფი,
    მუხა და თელა ერთმანეთშია გადახლართული ლიანებით და მკვრივი ქვეტყით — ევროპულ ტყეზე მეტად სუბტროპიკულ
    ჯუნგლს ჰგავს. ასეთი ტყე ოდესღაც მთელ ქვემო მტკვარს ფარავდა; დღეს მისი ნაშთები მხოლოდ რამდენიმე
    ადგილას შემორჩა. ნაკრძალი 1957 წელს დაარსდა და მოგვიანებით აღკვეთილის სტატუსი მიიღო. ტუგაი
    წყალდიდობებზეა დამოკიდებული, ზემოთ აშენებულმა კაშხლებმა კი მტკვრის რეჟიმი ბევრად უფრო თანაბარი
    გახადა; შედეგად ტყე თხელდება და სწორედ ამიტომ არის ეს პატარა ტერიტორია იმაზე მნიშვნელოვანი, ვიდრე
    მისი ფართობი გვაფიქრებინებს.


    ფაუნა მთავარი მიზეზია მოსვლის: ტურა, გარეული ღორი, მაჩვი, ტყის კატა და ხშირი ფრინველი — ყანჩა,
    ვარხვი, ნაირი მტაცებელი. გაზაფხულის მიგრაცია განსაკუთრებით საინტერესოა. ეს ერნითოლოგებისა და მშვიდი
    ტყის მოყვარულთა ადგილია.


    სიმართლე ისაა, რომ ინფრასტრუქტურა თითქმის არ არსებობს: მონიშნული ბილიკები, ინფოცენტრი და საპირფარეშო
    არ არის, ხოლო შესასვლელი გზები სამეურნეო ბილიკებია. ზაფხულში აქ ძალიან ცხელა და კოღოა უამრავი.
    საუკეთესო დროა მარტიდან მაისამდე და სექტემბრიდან ნოემბრამდე.
  tip: >-
    სამი საათი გამოყავით. კოღოს საწინააღმდეგო საშუალება, გრძელი შარვალი და დახურული ფეხსაცმელი
    აუცილებელია — ტყე ნესტიანი და ხშირია. ბილიკები არ არის მონიშნული, GPS ან ადგილობრივი გამცილებელი
    დაგეხმარებათ. საზღვართან ხართ: პასპორტი თან იქონიეთ, სასაზღვრო პატრული ხანდახან ამოწმებს. წყალი და
    საკვები წამოიღეთ. ზაფხულში შუადღეს აქ სიარული აზრს კარგავს.
  route: >-
    თბილისიდან რუსთავის გზით სამხრეთ-აღმოსავლეთით გარდაბნამდე — დაახლოებით 45 კმ ასფალტით. გარდაბნიდან
    მტკვრის გასწვრივ სამხრეთით სამეურნეო გზები მიდის ჭალის ტყისკენ, კიდევ 15 კმ. სულ 60 კმ, დაახლოებით
    საათნახევარი. ბოლო მონაკვეთი ხრეშისა და მიწისაა, წვიმის შემდეგ ღრმად ლაფიანი — SUV აუცილებელია.
    საწვავი რუსთავსა და გარდაბანში აიღეთ. ტყეში მანქანით ღრმად შესვლა არ ღირს.
en:
  name: Gardabani Managed Reserve
  short: >-
    Floodplain forest on the Mtkvari near the Azerbaijani border, one of the last surviving tugai
    woodlands in Georgia.
  body: >-
    **Gardabani is not a conventional visitor site and does not try to be one.** It protects roughly
    3,500 hectares of Mtkvari floodplain forest in the far southeast of the country, close to the
    Azerbaijani border, at 280 metres — among the lowest and hottest ground in Georgia.


    What is protected here is tugai: riparian woodland adapted to periodic flooding. Poplar, willow, oak
    and elm grow tangled together with lianas and dense undergrowth, closer in feel to subtropical jungle
    than to European forest. This kind of woodland once lined the whole lower Mtkvari; today only
    fragments remain in a handful of places. The reserve was established in 1957 and later given managed
    reserve status. Tugai depends on flooding, and dams upstream have made the flow of the Mtkvari far
    more even than it once was; the woodland is thinning as a result, which is why this small area
    matters more than its size suggests.


    Wildlife is the reason to come: jackal, wild boar, badger, wildcat, and a heavy concentration of
    birds — herons, cormorants, and a good range of raptors. Spring migration is the most interesting
    period. This is a place for birdwatchers and for people who like quiet forest, not for casual
    sightseeing.


    The honest picture is that infrastructure barely exists. There are no waymarked trails, no visitor
    centre and no toilets, and the access routes are farm tracks. In summer it is very hot and mosquitoes
    are relentless. March to May and September to November are the sensible windows.
  tip: >-
    Allow three hours. Insect repellent, long trousers and closed shoes are essential — the forest is
    humid and thick. Paths are unmarked, so a GPS track or a local guide helps a great deal. You are
    close to the border: carry your passport, since border patrols check occasionally. Bring water and
    food. Walking here in the middle of a summer day is not worth attempting.
  route: >-
    Take the Rustavi road southeast from Tbilisi to Gardabani, about 45 km of asphalt. From Gardabani,
    farm tracks run south along the Mtkvari towards the floodplain forest, a further 15 km. Sixty
    kilometres in all, roughly an hour and a half. The final stretch is gravel and dirt and turns to deep
    mud after rain, so an SUV is necessary. Refuel in Rustavi or Gardabani. Driving deep into the forest
    is not advisable.
ru:
  name: Гардабанский заказник
  short: >-
    Пойменный лес на Мтквари у азербайджанской границы, один из последних сохранившихся тугайных лесов
    Грузии.
  body: >-
    **Гардабани — не обычный туристический объект и не притворяется им.** Заказник охраняет около 3500
    гектаров пойменного леса Мтквари на крайнем юго-востоке страны, у границы с Азербайджаном, на высоте
    280 метров — это одна из самых низких и жарких точек Грузии.


    Здесь охраняют тугай: прибрежный лес, приспособленный к периодическим разливам. Тополь, ива, дуб и
    вяз переплетены лианами и густым подлеском — по ощущению ближе к субтропическим джунглям, чем к
    европейскому лесу. Когда-то такой лес тянулся вдоль всей нижней Мтквари; сегодня его фрагменты
    остались лишь в нескольких местах. Заповедник учредили в 1957 году, позже он получил статус
    заказника. Тугай зависит от разливов, а плотины выше по течению сделали режим Мтквари куда более
    ровным, чем прежде; лес из-за этого редеет, и потому небольшая территория значит больше, чем можно
    подумать по её площади.


    Ради животных сюда и едут: шакал, кабан, барсук, лесной кот и высокая плотность птиц — цапли,
    бакланы, разнообразные хищники. Весенняя миграция интереснее всего. Это место для орнитологов и
    любителей тихого леса, а не для беглого осмотра.


    Честная картина: инфраструктуры практически нет. Маркированных троп, визит-центра и туалетов не
    существует, а подъезды — хозяйственные грунтовки. Летом здесь очень жарко, комары неумолимы. Разумные
    окна — март-май и сентябрь-ноябрь.
  tip: >-
    Заложите три часа. Репеллент, длинные брюки и закрытая обувь обязательны: лес влажный и густой. Тропы
    не размечены, поэтому GPS-трек или местный проводник сильно помогут. Вы рядом с границей: держите
    паспорт при себе, пограничный наряд иногда проверяет. Берите воду и еду. Ходить здесь в середине
    летнего дня не стоит.
  route: >-
    Из Тбилиси по рустависской дороге на юго-восток до Гардабани, около 45 км асфальта. От Гардабани
    вдоль Мтквари на юг идут хозяйственные грунтовки к пойменному лесу, ещё 15 км. Всего 60 км, примерно
    полтора часа. Последний участок гравийно-грунтовый и после дождя превращается в глубокую грязь, так
    что внедорожник необходим. Заправляйтесь в Рустави или Гардабани. Заезжать вглубь леса не стоит.
fa:
  name: منطقهٔ حفاظت‌شدهٔ گارداباني
  short: >-
    جنگل سیلابی کنارهٔ مْتکواری نزدیک مرز آذربایجان، از واپسین جنگل‌های توگای برجای‌مانده در گرجستان.
  body: >-
    **گارداباني مقصدی گردشگری به معنای متعارف نیست و ادعایش را هم ندارد.** این منطقه حدود ۳۵۰۰ هکتار جنگل
    سیلابی کنارهٔ مْتکواری را در دورترین جنوب‌شرق کشور، نزدیک مرز آذربایجان، در ارتفاع ۲۸۰ متری حفاظت
    می‌کند — از پست‌ترین و گرم‌ترین نقاط گرجستان.


    آنچه اینجا حفاظت می‌شود توگای است: جنگل کنار رودخانه که با سیلاب‌های دوره‌ای سازگار شده است. سپیدار،
    بید، بلوط و نارون درهم‌تنیده با پیچک‌ها و زیرپوششی انبوه رشد می‌کنند، و حس آن به جنگل انبوه
    نیمه‌گرمسیری نزدیک‌تر است تا به جنگل اروپایی. زمانی چنین جنگلی سراسر مْتکواری پایین را می‌پوشاند؛
    امروز تنها پاره‌هایی از آن در چند نقطه مانده است. این منطقه در ۱۹۵۷ بنیاد گرفت و بعدها وضعیت منطقهٔ
    مدیریت‌شده یافت. توگای به سیلاب وابسته است، و سدهای بالادست جریان مْتکواری را بسیار یکنواخت‌تر از
    گذشته کرده‌اند؛ در نتیجه جنگل رقیق می‌شود، و به همین سبب این پهنهٔ کوچک بیش از آنچه مساحتش می‌نماید
    اهمیت دارد.


    جانوران دلیل اصلی آمدن‌اند: شغال، گراز، گورکن، گربهٔ وحشی، و تراکم بالای پرندگان — حواصیل، باکلان، و
    گونه‌های خوبی از پرندگان شکاری. کوچ بهاره جالب‌ترین دوره است. اینجا جای پرنده‌نگرها و دوستداران جنگل
    ساکت است، نه بازدید سرپایی.


    تصویر صادقانه آن است که زیرساخت تقریباً وجود ندارد. مسیر علامت‌گذاری‌شده، مرکز بازدید و سرویس بهداشتی
    نیست، و راه‌های دسترسی کوره‌راه‌های کشاورزی‌اند. تابستان بسیار گرم است و پشه‌ها بی‌امان. بازه‌های
    منطقی اسفند تا اردیبهشت و شهریور تا آبان است.
  tip: >-
    سه ساعت در نظر بگیرید. دافع حشره، شلوار بلند و کفش بسته ضروری‌اند — جنگل مرطوب و انبوه است. مسیرها
    علامت ندارند، پس مسیر جی‌پی‌اس یا راهنمای محلی بسیار کمک می‌کند. به مرز نزدیک‌اید: گذرنامه همراه
    داشته باشید، چون گشت مرزی گاهی بررسی می‌کند. آب و خوراک ببرید. راه رفتن اینجا در میانهٔ روز تابستان
    ارزش تلاش ندارد.
  route: >-
    از تفلیس روی جادهٔ روستاوی به جنوب‌شرق تا گارداباني بروید، حدود ۴۵ کیلومتر آسفالت. از گارداباني
    کوره‌راه‌های کشاورزی در امتداد مْتکواری به جنوب و به سوی جنگل سیلابی می‌روند، ۱۵ کیلومتر دیگر. روی‌هم
    ۶۰ کیلومتر، حدود یک ساعت و نیم. بخش پایانی شن و خاک است و پس از باران به گِل عمیق بدل می‌شود، پس
    شاسی‌بلند لازم است. سوخت را در روستاوی یا گارداباني بگیرید. رفتن با خودرو به ژرفای جنگل توصیه
    نمی‌شود.
he:
  name: שמורת גארדבאני
  short: >-
    יער מישור הצפה על המטקווארי סמוך לגבול אזרבייג'ן, מן החורשים מסוג טוגאי האחרונים ששרדו בגאורגיה.
  body: >-
    **גארדבאני אינה אתר ביקור רגיל ואינה מנסה להיות כזה.** השמורה מגינה על כ-3,500 הקטרים של יער מישור
    ההצפה של המטקווארי בדרום-מזרח הרחוק של המדינה, סמוך לגבול אזרבייג'ן, בגובה 280 מטר — מן השטחים
    הנמוכים והחמים בגאורגיה.


    מה שנשמר כאן הוא טוגאי: חורש גדות שהסתגל להצפות תקופתיות. צפצפה, ערבה, אלון ובוקיצה גדלים סבוכים יחד
    עם מטפסים וסבך צפוף, בתחושה קרובה יותר לג'ונגל סובטרופי מאשר ליער אירופי. חורש כזה השתרע פעם לאורך כל
    המטקווארי התחתון; היום נותרו ממנו שברים במקומות בודדים. השמורה הוקמה ב-1957 וקיבלה מאוחר יותר מעמד של
    שמורה מנוהלת. הטוגאי תלוי בהצפות, וסכרים במעלה הזרם עשו את זרימת המטקווארי אחידה בהרבה מבעבר; היער
    מידלדל כתוצאה מכך, ולכן השטח הקטן הזה חשוב יותר מכפי שגודלו מרמז.


    בעלי החיים הם הסיבה לבוא: תן, חזיר בר, גירית, חתול בר, וריכוז גבוה של ציפורים — אנפות, קורמורנים
    ומגוון טוב של דורסים. נדידת האביב היא התקופה המעניינת ביותר. זהו מקום לצפרים ולאוהבי יער שקט, לא
    לסיור חטוף.


    התמונה הכנה היא שכמעט אין תשתית. אין שבילים מסומנים, אין מרכז מבקרים ואין שירותים, ודרכי הגישה הן
    דרכי עפר חקלאיות. בקיץ חם מאוד והיתושים בלתי נלאים. מרץ עד מאי וספטמבר עד נובמבר הם החלונות
    ההגיוניים.
  tip: >-
    הקצו שלוש שעות. דוחה חרקים, מכנסיים ארוכים ונעליים סגורות הכרחיים — היער לח וסבוך. השבילים אינם
    מסומנים, ולכן מסלול ניווט לוויני או מדריך מקומי עוזרים מאוד. אתם קרוב לגבול: שאו דרכון, שכן סיורי
    גבול בודקים מדי פעם. הביאו מים ואוכל. ללכת כאן באמצע יום קיץ אינו שווה את המאמץ.
  route: >-
    סעו מטביליסי דרום-מזרחה בכביש רוסתאווי עד גארדבאני, כ-45 ק״מ של אספלט. מגארדבאני יוצאות דרכי עפר
    חקלאיות דרומה לאורך המטקווארי אל יער מישור ההצפה, עוד 15 ק״מ. 60 ק״מ בסך הכול, כשעה וחצי. הקטע האחרון
    חצץ ועפר והופך לבוץ עמוק אחרי גשם, ולכן נדרש רכב שטח. תדלקו ברוסתאווי או בגארדבאני. אין להיכנס עמוק
    ליער ברכב.
ar:
  name: محمية غارداباني
  short: >-
    غابة سهل فيضي على نهر متكفاري قرب الحدود الأذربيجانية، من آخر غابات التوغاي الباقية في جورجيا.
  body: >-
    **غارداباني ليست موقعاً سياحياً بالمعنى المعتاد ولا تسعى إلى ذلك.** تحمي المحمية نحو 3500 هكتار من
    غابة السهل الفيضي لنهر متكفاري في أقصى جنوب شرق البلاد، قرب الحدود الأذربيجانية، على ارتفاع 280 متراً
    — وهي من أخفض أراضي جورجيا وأشدها حرارة.


    وما يُحمى هنا هو التوغاي: حرج ضفافي متكيف مع الفيضان الدوري. ينمو الحور والصفصاف والبلوط والدردار
    متشابكة مع نباتات متسلقة وأدغال كثيفة، والإحساس أقرب إلى غابة شبه استوائية منه إلى غابة أوروبية. وقد
    كان هذا النوع من الحرج يغطي مجرى متكفاري الأدنى كله؛ ولم يبقَ منه اليوم إلا شذرات في مواضع قليلة.
    أُنشئت المحمية عام 1957 ثم مُنحت لاحقاً صفة محمية مُدارة. والتوغاي يعتمد على الفيضان، وقد جعلت السدود
    في أعلى المجرى جريان متكفاري أكثر انتظاماً مما كان؛ ونتيجة لذلك يترقق الحرج، ولهذا تعني هذه المساحة
    الصغيرة أكثر مما يوحي حجمها.


    والحياة البرية هي سبب المجيء: ابن آوى، والخنزير البري، والغرير، والقط البري، وتركيز عالٍ من الطيور —
    البلشون، والغاق، ومجموعة جيدة من الجوارح. وهجرة الربيع أكثر الفترات إثارة. هذا مكان لمراقبي الطيور
    ولمحبي الغابة الهادئة، لا لجولة عابرة.


    والصورة الصادقة أن البنية التحتية تكاد تكون معدومة. لا مسارات معلّمة ولا مركز زوار ولا دورات مياه،
    وطرق الوصول دروب زراعية. والصيف شديد الحرارة والبعوض لا يرحم. وآذار إلى أيار وأيلول إلى تشرين الثاني
    هما النافذتان المعقولتان.
  tip: >-
    خصّص ثلاث ساعات. طارد الحشرات والبنطال الطويل والحذاء المغلق ضرورية — فالغابة رطبة كثيفة. والمسارات
    غير معلّمة، فمسار جي بي إس أو دليل محلي يساعد كثيراً. وأنت قريب من الحدود: احمل جواز سفرك، فدوريات
    الحدود تتحقق أحياناً. واحمل ماءً وطعاماً. والمشي هنا في منتصف نهار صيفي لا يستحق المحاولة.
  route: >-
    خذ طريق روستافي جنوب شرق من تبليسي إلى غارداباني، نحو 45 كم من الإسفلت. ومن غارداباني تمتد دروب
    زراعية جنوباً بمحاذاة متكفاري نحو غابة السهل الفيضي، مسافة 15 كم أخرى. ستون كيلومتراً إجمالاً، نحو
    ساعة ونصف. والمقطع الأخير حصى وتراب يتحول إلى وحل عميق بعد المطر، فالدفع الرباعي ضروري. تزوّد بالوقود
    في روستافي أو غارداباني. ولا يُنصح بالتوغل بالسيارة داخل الغابة.
