ka:
  name: გარდაბნის აღკვეთილი
  short: >-
    წყალდიდობით ნასაზრდოები ვერხვისა და ტირიფის ჯუნგლი მტკვრის პირას, აზერბაიჯანის საზღვართან: ფრინველის
    135 სახეობა, კეთილშობილი ირემი, არანაირი ინფრასტრუქტურა.
  body: >-
    **რუსთავის სამხრეთ-აღმოსავლეთით, სადაც მტკვარი ვაკეზე ნელდება და იშლება, დღემდე დგას ტყე, რომელიც
    მდინარემ საკუთარი წყალდიდობებით გაზარდა.**


    გარდაბნის აღკვეთილი 1996 წელს შეიქმნა და მტკვრის მარცხენა ნაპირზე, გარდაბნისა და მარნეულის მუნიციპალიტეტებში,
    აზერბაიჯანის საზღვართან ახლოს, ამ ჭალის ტყის 3484 ჰექტარს იცავს. ეკოლოგები მას ტუგაის უწოდებენ — მდინარისპირა
    ტყეს, რომელიც დატბორვით ცოცხლობს. ხვალო, ოფი, წნორი, ჭალის მუხა და თელა კუნელის, იალღუნისა და შინდანწლის
    ქვეტყეს ზემოდან დაჰყურებს, ყველაფერს კი კატაბარდა, ღვედკეცი და სვია ახვევია. შუა ზაფხულში ეს ადგილი
    ევროპულ ტყეს კი არა, ტროპიკების კიდეს უფრო მოგაგონებთ.


    მოსვლის მიზეზი ციფრებშია: ფრინველის 135 სახეობა, ძუძუმწოვრის 26, თევზის 21. „წითელ ნუსხაში“ შეტანილი
    კეთილშობილი ირემი აქ ჯერ კიდევ დადის ტევრში, გარეულ ღორსა და ტურასთან ერთად. ცაში თეთრკუდა ფსოვი და
    ბეგობი დაეძებეთ. აღკვეთილი რამსარის კონვენციის საერთაშორისო მნიშვნელობის ჭარბტენიან ტერიტორიათა სიაში
    შესატანად განიხილებოდა, თუმცა იქ ჯერ არ არის.


    ამ მდინარის პირას ადამიანი ძალიან დიდი ხანია ცხოვრობს. აღკვეთილის სიახლოვეს აღმოჩენილია ენეოლითისა
    და ადრეული ბრინჯაოს ხანის ნამოსახლარები, შუა ბრინჯაოს ხანის სამარხები, გვიანი ბრინჯაოსა და ადრეული
    რკინის ხანის ძეგლები; აღმოსავლეთით, ივრის უწყლო ზეგანზე, დავით გარეჯის სამონასტრო კომპლექსია.


    სანამ გზას დაადგებით, საკუთარ თავს სიმართლე უთხარით. აქ არ არის მონიშნული ბილიკები, ვიზიტორთა ცენტრი
    და საპირფარეშო; შესასვლელი გზები სამეურნეოა; ზაფხულში სიცხე და კოღო აუტანელია. გაზაფხულზე ან შემოდგომაზე
    ჩამოდით, ნელა იარეთ და ფრინველებს აცალეთ, თავად გამოჩნდნენ.
  tip: >-
    სამი საათი გამოყავით და ჩამოდით მარტიდან მაისამდე ან სექტემბრიდან ნოემბრამდე. ჩაიცვით გრძელი შარვალი,
    გრძელსახელოებიანი პერანგი და დახურული ფეხსაცმელი, წამოიღეთ კოღოს საწინააღმდეგო ძლიერი საშუალება —
    ტყე ნესტიანი და ხშირია. ბილიკები მონიშნული არ არის: სანამ კავშირი გაქვთ, ოფლაინ რუკა ან GPS-ტრეკი
    ჩამოტვირთეთ, ან ადგილობრივი გამცილებელი იშოვეთ. სასაზღვრო ზონაში ხართ — პასპორტი თან იქონიეთ, პატრული
    მართლაც ამოწმებს. წყალი და საკვები სრულად თან წამოიღეთ, შიგნით არაფერია. ბინოკლი აქ კამერაზე მეტს
    ნიშნავს. ფრინველებისთვის საუკეთესოა დილაადრიანი საათები, ივლისის შუადღეს კი აქ სიარული არ ღირს.
  route: >-
    თბილისიდან S4-ით სამხრეთ-აღმოსავლეთით რუსთავამდე იარეთ, შემდეგ Sh66-ით, რუსთავის გავლით, გარდაბნამდე
    — დაახლოებით 45 კილომეტრი ასფალტი, ორმოცდახუთი წუთი. გარდაბნიდან ჭალის ტყისკენ სამხრეთით მოუნიშნავი
    სამეურნეო გზები მიდის, კიდევ 15-ოდე კილომეტრი ნელი სვლით ხრეშსა და მიწაზე, რომელიც წვიმის შემდეგ ღრმა
    ტალახად იქცევა. სულ დაახლოებით 60 კილომეტრია, მაგრამ ორი საათი და ათი წუთი გამოყავით. აუცილებელია
    მაღალი კლირენსის ჯიპი. საწვავი რუსთავში ან გარდაბანში ჩაასხით. მანქანა ტყის პირას დატოვეთ: დაცულ ტერიტორიაზე
    ტყის სიღრმეში მანქანით შესვლა არც გონივრულია და არც მისასალმებელი.
en:
  name: Gardabani Managed Reserve
  short: >-
    Flood-fed poplar and willow jungle on the Mtkvari by the Azerbaijani border: 135 bird species, red
    deer and no infrastructure whatsoever.
  body: >-
    **South-east of Rustavi, where the Mtkvari slows and spreads across the lowland, a forest still stands
    that the river raised with its own floods.**


    The Gardabani Managed Reserve, created in 1996, protects 3,484 hectares of this floodplain woodland
    on the left bank of the Mtkvari, in Gardabani and Marneuli municipalities, close to the border with
    Azerbaijan. Ecologists call it tugai: riverside forest that lives by the flood. Grey and black poplar,
    white willow, long-stalked oak and elm tower over an undergrowth of hawthorn, tamarisk and cornel,
    and everything is laced with clematis, silk vine and wild hop. In high summer it feels less like a
    European wood than the edge of the tropics.


    The numbers are the reason to come: 135 species of bird, 26 of mammal, 21 of fish. Red deer, on Georgia's
    Red List, still move through the thickets alongside wild boar and jackal. Overhead, watch for white-tailed
    and eastern imperial eagles. The reserve has been considered for the Ramsar list of wetlands of international
    importance, though it is not on it yet.


    People have lived by this river for a very long time. Near the reserve archaeologists have found Eneolithic
    and Early Bronze Age settlements, Middle Bronze Age graves and Late Bronze to Early Iron Age sites;
    further east, on the waterless Iori plateau, lies the monastery complex of David Gareja.


    Be honest with yourself before setting out. There are no marked trails, no visitor centre and no toilets;
    the tracks in are farm roads; in summer the heat and the mosquitoes are ferocious. Come in spring
    or autumn, walk slowly, and let the birds come to you.
  tip: >-
    Give it three hours, and come between March and May or September and November. Wear long trousers,
    long sleeves and closed shoes, and bring strong insect repellent: the forest is humid and dense. Paths
    are unmarked, so download an offline map or GPS track while you still have signal, or arrange a local
    guide. This is a border zone: carry your passport, as patrols do check. Bring all your water and food;
    there is nothing inside. Binoculars matter more than a camera here. Early morning is best for birds,
    and a July midday is not worth attempting.
  route: >-
    Take the S4 south-east from Tbilisi to Rustavi, then the Sh66 through the city to Gardabani: about
    45 km of asphalt and three-quarters of an hour. From Gardabani unmarked farm tracks run south towards
    the floodplain forest for some 15 km more, slow going on gravel and dirt that turns to deep mud after
    rain. That makes about 60 km in all, but allow two hours and ten minutes. An SUV with real ground
    clearance is essential. Refuel in Rustavi or Gardabani. Leave the car at the forest edge: driving
    deep into a protected wood is neither wise nor welcome.
ru:
  name: Гардабанский заказник
  short: >-
    Пойменные джунгли из тополя и ивы на Мтквари у границы с Азербайджаном: 135 видов птиц, благородный
    олень и никакой инфраструктуры.
  body: >-
    **К юго-востоку от Рустави, там, где Мтквари замедляет ход и разливается по низине, до сих пор стоит
    лес, выращенный самой рекой — её разливами.**


    Гардабанский заказник, созданный в 1996 году, охраняет 3484 гектара этого пойменного леса на левом
    берегу Мтквари, в Гардабанском и Марнеульском муниципалитетах, у самой границы с Азербайджаном. Экологи
    называют его тугаем — прибрежным лесом, который живёт разливами. Тополь сереющий и чёрный, ива белая,
    дуб длинноножковый и вяз возвышаются над подлеском из боярышника, тамариска и кизила, и всё это оплетено
    ломоносом, обвойником и диким хмелем. В разгар лета здесь кажется, что попал не в европейский лес,
    а на окраину тропиков.


    Ради цифр сюда и стоит ехать: 135 видов птиц, 26 видов млекопитающих, 21 вид рыб. Благородный олень,
    занесённый в Красный список Грузии, по-прежнему бродит в зарослях рядом с кабаном и шакалом. В небе
    высматривайте орлана-белохвоста и могильника. Заказник рассматривали как кандидата в Рамсарский список
    водно-болотных угодий международного значения, но пока он в него не внесён.


    Люди живут у этой реки очень давно. Рядом с заказником археологи нашли поселения энеолита и ранней
    бронзы, погребения средней бронзы и памятники позднего бронзового и раннего железного века; дальше
    к востоку, на безводном плато Иори, лежит монастырский комплекс Давид-Гареджи.


    Прежде чем ехать, будьте честны с собой. Размеченных троп нет, визит-центра нет, туалетов нет; подъезды
    — полевые дороги; летом жара и комары свирепы. Приезжайте весной или осенью, ходите медленно и дайте
    птицам прийти к вам самим.
  tip: >-
    Отведите на заказник три часа и выбирайте время с марта по май или с сентября по ноябрь. Длинные брюки,
    длинные рукава, закрытая обувь и сильный репеллент обязательны: лес влажный и густой. Троп с разметкой
    нет, поэтому скачайте офлайн-карту или GPS-трек, пока есть связь, или договоритесь с местным проводником.
    Это пограничная зона: имейте при себе паспорт, патрули действительно проверяют. Воду и еду везите
    с собой — внутри нет ничего. Бинокль здесь важнее фотоаппарата. Для птиц лучше всего раннее утро,
    а июльский полдень не стоит и пробовать.
  route: >-
    Из Тбилиси по S4 на юго-восток до Рустави, затем по Sh66 через город до Гардабани: около 45 км асфальта
    и три четверти часа. От Гардабани полевые дороги без всяких указателей уходят на юг, к пойменному
    лесу, ещё километров на 15 — медленная езда по гравию и грунту, который после дождя превращается в
    глубокую грязь. Всего около 60 км, но закладывайте два часа десять минут. Нужен внедорожник с настоящим
    клиренсом. Заправляйтесь в Рустави или Гардабани. Машину оставьте на опушке: заезжать вглубь охраняемого
    леса и неразумно, и здесь не приветствуется.
fa:
  name: منطقهٔ حفاظت‌شدهٔ گاردابانی
  short: >-
    جنگلی انبوه از سپیدار و بید که سیلاب‌های متکواری آن را پرورده‌اند، کنار مرز آذربایجان: ۱۳۵ گونه پرنده،
    گوزن قرمز و هیچ امکاناتی.
  body: >-
    **در جنوب شرقی روستاوی، آنجا که متکواری آرام می‌گیرد و بر دشت پست پهن می‌شود، هنوز جنگلی برپاست که
    رود با سیلاب‌های خودش پرورده است.**


    منطقهٔ حفاظت‌شدهٔ گاردابانی که در سال ۱۹۹۶ پدید آمد، از ۳۴۸۴ هکتار از این جنگل سیلابی در کرانهٔ چپ
    متکواری، در شهرستان‌های گاردابانی و مارنئولی و نزدیک مرز آذربایجان، پاسداری می‌کند. بوم‌شناسان آن
    را توگای می‌نامند: جنگلی کناررودی که زندگی‌اش به سیلاب بسته است. سپیدار خاکستری و صنوبر سیاه، بید
    سفید، بلوط دم‌بلند و نارون بر فراز زیراشکوبی از زالزالک، گز و زغال‌اخته قد کشیده‌اند، و کلماتیس، پیچ
    ابریشمی (پریپلوکا) و رازک وحشی همه‌چیز را در هم تنیده‌اند. در چلهٔ تابستان، اینجا بیشتر به لبهٔ سرزمین‌های
    استوایی می‌ماند تا به جنگلی اروپایی.


    دلیل آمدن، همین شمارها است: ۱۳۵ گونه پرنده، ۲۶ گونه پستاندار و ۲۱ گونه ماهی. گوزن قرمز، که در فهرست
    سرخ گرجستان جای دارد، هنوز در میان بیشه‌ها کنار گراز و شغال رفت‌وآمد می‌کند. در آسمان چشم به راه عقاب
    دریایی دم‌سفید و عقاب شاهی باشید. این منطقه برای فهرست رامسر، فهرست تالاب‌های دارای اهمیت بین‌المللی،
    در نظر گرفته شده، اما هنوز در آن نیامده است.


    مردمان از روزگاری بسیار دور کنار این رود زیسته‌اند. در نزدیکی منطقه، باستان‌شناسان سکونتگاه‌هایی از
    دوران مس‌سنگی و آغاز عصر مفرغ، گورهایی از عصر مفرغ میانی و محوطه‌هایی از پایان عصر مفرغ و آغاز عصر
    آهن یافته‌اند؛ دورتر به سوی خاور، بر فلات بی‌آب یوری، مجموعهٔ صومعه‌های داوید گارجا جای دارد.


    پیش از راه افتادن با خودتان روراست باشید. نه مسیر نشانه‌گذاری‌شده‌ای هست، نه مرکز بازدیدکنندگان و
    نه سرویس بهداشتی؛ راه‌های رسیدن، جاده‌های کشاورزی‌اند؛ و در تابستان گرما و پشه‌ها بی‌امان‌اند. در
    بهار یا پاییز بیایید، آهسته گام بردارید و بگذارید پرندگان خودشان به سراغتان بیایند.
  tip: >-
    سه ساعت وقت بگذارید و میان مارس تا مه یا سپتامبر تا نوامبر بیایید. شلوار بلند، آستین بلند و کفش بسته
    بپوشید و دافع حشرهٔ قوی همراه بیاورید: جنگل مرطوب و انبوه است. مسیرها نشانه ندارند، پس تا آنتن دارید
    نقشهٔ آفلاین یا رد جی‌پی‌اس را دانلود کنید، یا با راهنمایی محلی هماهنگ کنید. اینجا منطقهٔ مرزی است:
    گذرنامه همراه داشته باشید، چون گشتی‌ها واقعاً بازرسی می‌کنند. همهٔ آب و خوراکتان را بیاورید؛ درون
    جنگل هیچ چیز نیست. دوربین دوچشمی اینجا از دوربین عکاسی مهم‌تر است. سپیده‌دم بهترین هنگام برای پرندگان
    است، و نیمروزی در ژوئیه ارزش امتحان کردن ندارد.
  route: >-
    از تفلیس با جادهٔ S4 رو به جنوب شرقی تا روستاوی بروید، سپس با Sh66 از میان شهر تا گاردابانی: حدود
    ۴۵ کیلومتر آسفالت و سه‌ربع ساعت. از گاردابانی راه‌های کشاورزیِ بی‌نشان حدود ۱۵ کیلومتر دیگر رو به
    جنوب، به سوی جنگل سیلابی، پیش می‌روند؛ رانندگی کُند روی شن و خاکی که پس از باران به گل‌ولای عمیق بدل
    می‌شود. روی‌هم حدود ۶۰ کیلومتر است، اما دو ساعت و ده دقیقه وقت بگذارید. خودروی شاسی‌بلند با فاصلهٔ
    واقعی از زمین ضروری است. در روستاوی یا گاردابانی سوخت بگیرید. خودرو را در لبهٔ جنگل بگذارید: راندن
    به دل جنگلی حفاظت‌شده نه خردمندانه است و نه پسندیده.
he:
  name: שמורת גרדבאני המנוהלת
  short: 'ג''ונגל של צפצפות וערבות שגדל מהצפות המטקוורי ליד גבול אזרבייג''ן: 135 מיני ציפורים, איילים
    אדומים ושום תשתית.'
  body: >-
    **מדרום-מזרח לרוסטאווי, במקום שבו המטקוורי מאט ומתפשט על פני השפלה, עדיין עומד יער שהנהר גידל בשיטפונותיו
    שלו.**


    שמורת גרדבאני המנוהלת, שהוכרזה ב-1996, מגינה על 3,484 הקטרים של יער הצפה זה על הגדה השמאלית של המטקוורי,
    בתחומי הרשויות גרדבאני ומרנאולי, סמוך לגבול אזרבייג'ן. האקולוגים קוראים לו טוגאי: יער גדות שחי מן
    השיטפון. צפצפה אפורה וצפצפה שחורה, ערבה לבנה, אלון ארוך-עוקץ ובוקיצה מתנשאים מעל תת-יער של עוזרר,
    אשל וקרנית, והכול משורג בזלזלת, בפריפלוקה ("גפן המשי") ובכשות בר. בלב הקיץ המקום מרגיש פחות כמו יער
    אירופי ויותר כמו שולי הטרופים.


    המספרים הם הסיבה לבוא: 135 מיני ציפורים, 26 מיני יונקים, 21 מיני דגים. האייל האדום, הרשום ברשימה האדומה
    של גאורגיה, עדיין נע בסבך לצד חזירי בר ותנים. למעלה, חפשו את העיטם הלבן-זנב ואת עיט השמש. השמורה נשקלה
    לצירוף לרשימת רמסר של אזורי ביצות בעלי חשיבות בינלאומית, אך עדיין אינה נכללת בה.


    בני אדם חיים לצד הנהר הזה זמן רב מאוד. סמוך לשמורה מצאו ארכאולוגים יישובים מן התקופה הכלקוליתית ומתקופת
    הברונזה הקדומה, קברים מתקופת הברונזה התיכונה ואתרים מסוף תקופת הברונזה וראשית תקופת הברזל; רחוק יותר
    מזרחה, על רמת יורי הצחיחה, שוכן מתחם המנזרים דוד גרג'ה.


    היו כנים עם עצמכם לפני שאתם יוצאים לדרך. אין שבילים מסומנים, אין מרכז מבקרים ואין שירותים; הדרכים
    פנימה הן דרכי עפר חקלאיות; ובקיץ החום והיתושים אכזריים. בואו באביב או בסתיו, לכו לאט, ותנו לציפורים
    לבוא אליכם.
  tip: >-
    הקדישו שלוש שעות, ובואו בין מרץ למאי או בין ספטמבר לנובמבר. לבשו מכנסיים ארוכים, שרוולים ארוכים ונעליים
    סגורות, והביאו דוחה יתושים חזק: היער לח וצפוף. השבילים אינם מסומנים, לכן הורידו מפה לא מקוונת או מסלול
    GPS כל עוד יש קליטה, או תאמו מדריך מקומי. זה אזור גבול: שאו איתכם דרכון, כי סיורים אכן בודקים. הביאו
    את כל המים והאוכל; בפנים אין דבר. כאן משקפת חשובה יותר ממצלמה. שעות הבוקר המוקדמות הן הטובות ביותר
    לציפורים, וצהרי יולי אינם שווים את הניסיון.
  route: >-
    סעו מטביליסי בכביש S4 דרום-מזרחה עד רוסטאווי, ומשם בכביש Sh66 דרך העיר עד גרדבאני: כ-45 ק״מ של אספלט
    ושלושה רבעי שעה. מגרדבאני יוצאות דרכים חקלאיות לא מסומנות דרומה, אל יער ההצפה, לאורך כ-15 ק״מ נוספים;
    נסיעה איטית על חצץ ועפר שהופכים לבוץ עמוק אחרי גשם. בסך הכול כ-60 ק״מ, אבל הקציבו שעתיים ועשר דקות.
    רכב שטח עם מרווח גחון אמיתי הכרחי. תדלקו ברוסטאווי או בגרדבאני. השאירו את הרכב בשולי היער: נסיעה לעומק
    יער מוגן אינה נבונה ואינה רצויה.
ar:
  name: محمية غارداباني المُدارة
  short: >-
    غابة كثيفة من الحور والصفصاف تغذّيها فيضانات نهر متكفاري قرب الحدود الأذربيجانية: 135 نوعاً من الطيور،
    وأيائل حمراء، ولا بنية تحتية على الإطلاق.
  body: >-
    **إلى الجنوب الشرقي من روستافي، حيث يُبطئ نهر متكفاري ويتّسع فوق السهل المنخفض، ما زالت تقوم غابة
    أنبتها النهر بفيضاناته.**


    تحمي محمية غارداباني المُدارة، التي أُنشئت عام 1996، مساحة 3484 هكتاراً من هذه الغابة الفيضية على
    الضفة اليسرى لنهر متكفاري، في بلديتي غارداباني ومارنيولي، على مقربة من الحدود مع أذربيجان. ويسمّيها
    علماء البيئة «التوغاي»: غابة نهرية تعيش على الفيضان. يعلو الحورُ الرمادي والحورُ الأسود والصفصافُ
    الأبيض والبلوطُ طويل السُّوَيقة والدردارُ فوق طبقة سفلى من الزعرور والأثل والقرانيا، وكل ذلك تشابكه
    نباتات الظيان والبريبلوكا («كرمة الحرير») وحشيشة الدينار البرية. وفي عزّ الصيف يبدو المكان أقرب إلى
    تخوم المناطق المدارية منه إلى غابة أوروبية.


    والأرقام هي سبب المجيء: 135 نوعاً من الطيور، و26 نوعاً من الثدييات، و21 نوعاً من الأسماك. وما زال
    الأيل الأحمر، المدرج في القائمة الحمراء الجورجية، يتنقّل بين الأدغال إلى جانب الخنزير البري وابن آوى.
    وفي السماء ترقّب عقاب البحر أبيض الذيل والعقاب الملكي الشرقي. وقد رُشّحت المحمية للإدراج في قائمة
    رامسار للأراضي الرطبة ذات الأهمية الدولية، لكنها لم تُدرج فيها بعد.


    عاش الناس على هذا النهر منذ زمن بعيد جداً. فقرب المحمية عثر علماء الآثار على مستوطنات من العصر النحاسي
    والعصر البرونزي المبكر، وقبور من العصر البرونزي الأوسط، ومواقع من أواخر العصر البرونزي ومطلع العصر
    الحديدي؛ وأبعد شرقاً، على هضبة إيوري القاحلة، يقع مجمّع أديرة دافيد غاريجا.


    كن صادقاً مع نفسك قبل الانطلاق. لا مسارات معلّمة، ولا مركز للزوار، ولا دورات مياه؛ والطرق المؤدية
    إليها دروب زراعية؛ وفي الصيف يشتدّ الحرّ ويستشرس البعوض. تعالَ في الربيع أو الخريف، وامشِ على مهل،
    ودَع الطيور تأتي إليك.
  tip: >-
    خصّص ثلاث ساعات، واختر ما بين مارس ومايو أو ما بين سبتمبر ونوفمبر. البس سروالاً طويلاً وأكماماً طويلة
    وحذاءً مغلقاً، واحمل طارداً قوياً للحشرات: فالغابة رطبة كثيفة. المسارات غير معلّمة، فحمّل خريطة تعمل
    دون اتصال أو مساراً بنظام GPS ما دامت الإشارة متاحة، أو اتفق مع دليل محلي. هذه منطقة حدودية: احمل
    جواز سفرك، فالدوريات تفتّش فعلاً. أحضر كل ما تحتاجه من ماء وطعام؛ فلا شيء في الداخل. المنظار هنا أهمّ
    من الكاميرا. الصباح الباكر أفضل الأوقات للطيور، أما ظهيرة يوليو فلا تستحق المحاولة.
  route: >-
    خذ الطريق S4 باتجاه الجنوب الشرقي من تبليسي إلى روستافي، ثم الطريق Sh66 عبر المدينة إلى غارداباني:
    نحو 45 كيلومتراً من الإسفلت وثلاثة أرباع الساعة. ومن غارداباني تتجه دروب زراعية غير معلّمة جنوباً
    نحو الغابة الفيضية نحو 15 كيلومتراً أخرى، والسير فيها بطيء على الحصى والتراب الذي يصير وحلاً عميقاً
    بعد المطر. فالمجموع نحو 60 كيلومتراً، لكن احسب ساعتين وعشر دقائق. سيارة رباعية الدفع ذات خلوص أرضي
    حقيقي أمر لا غنى عنه. تزوّد بالوقود في روستافي أو غارداباني. اترك السيارة عند حافة الغابة: فالتوغّل
    بالسيارة في غابة محمية ليس حكيماً ولا مرحّباً به.
