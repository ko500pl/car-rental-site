ka:
  name: ნიკო ფიროსმანის სახლ-მუზეუმი
  short: >-
    ფიროსმანის სახლი მშობლიურ მირზაანში, 1898 წელს აშენებული — დღეს მუზეუმი, სადაც მისი თოთხმეტი ნამუშევარი
    და პიკასოს პორტრეტის ლითოგრაფიაა.
  body: >-
    **ნიკო ფიროსმანს არც ოჯახი დარჩა, არც ქონება და არც საფლავის ქვა — სამაგიეროდ, მირზაანში, სოფელში,
    სადაც დაიბადა, სახლი დარჩა.**


    ფიროსმანაშვილი აქ 1862 წელს გლეხის ოჯახში დაიბადა. ადრე დაობლდა და უფროსმა დებმა, მარიამმა და ფეფემ,
    გაზარდეს. ხატვა არავისთან უსწავლია: თბილისში აბრებს ხატავდა, რკინიგზაზე მსახურობდა, რძის დუქანიც ჰქონდა
    ამხანაგთან ერთად, სამიკიტნოებისთვის კი შავ მუშამბაზე ხატავდა. 1898 წელს მშობლიურ სოფელში ეს სახლი
    ააშენა. 1918 წლის გაზაფხულზე თბილისში, პატარა სარდაფში, მარტოდმარტო გარდაიცვალა; მისი საფლავი დღემდე
    უცნობია.


    მუზეუმი 1960 წელს გაიხსნა და ცხრა ათასზე მეტ ექსპონატს ინახავს — მხატვრის პირად ნივთებსა და თოთხმეტ
    ორიგინალ ნამუშევარს. ფიროსმანთან შავი მუშამბა ხშირად შეუღებავი რჩება და თავად ხდება ღამე, ჩრდილი,
    სიცარიელე, რომლიდანაც სუფრაზე მსხდომი კაცები და მშვიდი, თითქმის ადამიანური მზერის ცხოველები გამოდიან.


    1910-იან წლებში ფიროსმანის ნახატები ავანგარდისტმა პოეტმა ილია ზდანევიჩმა, მხატვარ ძმასთან, კირილესთან
    ერთად, აღმოაჩინა და პაბლო პიკასოს აჩვენა. პიკასომ მისი პორტრეტი შექმნა — ამ პორტრეტის ლითოგრაფია დღეს
    აქვე, მირზაანში, ფიროსმანის ნამუშევრების გვერდით კიდია. 2018 წელს „ქართველი ქალი ლეჩაქით“ „სოთბისის“
    აუქციონზე 2,8 მილიონ დოლარად გაიყიდა; ეს ნახატი ოდესღაც სტეფან ცვაიგის სალცბურგის სახლში ეკიდა.


    გადმოცემა ამბობს, რომ ფიროსმანმა ყველაფერი გაყიდა, რათა ფრანგი მსახიობი ქალისთვის, მარგარიტასთვის,
    ქუჩა ყვავილებით მოეფინა — ამ ამბავს სიმღერა „მილიონი ალისფერი ვარდი“ უკავშირდება. ეს თბილისური ლეგენდაა
    და მისი გადამოწმება შეუძლებელია.


    ყოველ ოქტომბერს მირზაანი „ფიროსმანობას“ მართავს. ოთხასიოდე მცხოვრების სოფელი იმ მხატვარს ზეიმობს,
    რომლის ნახატები დღეს მილიონები ღირს — და ეს სწორედ ის მასშტაბია, რომელშიც ფიროსმანი ხატავდა: სოფელი,
    სუფრა, ხალხი.
  tip: >-
    შესასვლელი ბილეთის ფასი და სამუშაო საათები ინტერნეტში საიმედოდ არ ქვეყნდება — ამიტომ გზაში გასვლამდე
    სიღნაღის სასტუმროს ან მასპინძელს სთხოვეთ, წინასწარ დარეკონ. დათვალიერებას დაახლოებით ერთი საათი სჭირდება:
    სახლი და საგამოფენო დარბაზი. მანქანას სოფლის მთავარ ქუჩაზე დატოვებთ, მუზეუმამდე სწორი გზაა. სოფელში
    კვების არჩევანი მწირია, ამიტომ ისადილეთ სიღნაღში. ოქტომბერში, „ფიროსმანობის“ დღეებში, ხალხმრავლობას
    ელოდეთ. ხირსის მონასტერი სულ სამიოდე კილომეტრშია — ერთ მოგზაურობაში ორივე ეტევა.
  route: >-
    თბილისიდან მირზაანამდე დაახლოებით 115 კმ-ია — 1 სთ 55 წთ, მთელი გზა ასფალტზე. გადით კახეთის გზატკეცილზე
    (ს5), გაიარეთ საგარეჯო და ბადიაური, შემდეგ გადაუხვიეთ სიღნაღის გზაზე (შ40). სიღნაღში შესვლისას გზა
    მოკლე მოსახვევებით მიიკლაკნება, შემდეგ ბოდბის გვერდით ჩადიხართ დაბლობისკენ და მირზაანს მიადგებით.
    საწვავი სიღნაღში ჩაასხით — მის იქით ბენზინგასამართი ცოტაა. ეკონომ-კლასის მანქანა სავსებით საკმარისია:
    გზა მოასფალტებული და იოლია, რთული მონაკვეთი არ გხვდებათ.
en:
  name: Niko Pirosmani House Museum
  short: >-
    Pirosmani's 1898 village house, now a museum holding 14 of his paintings and a lithograph of Picasso's
    portrait of him.
  body: >-
    **Niko Pirosmani left behind no family, no fortune and no gravestone — but in Mirzaani, the village
    where he was born, he left a house.**


    Pirosmanashvili was born here in 1862 to peasant farmers, orphaned young and raised by his elder sisters,
    Mariam and Pepe. Nobody taught him to paint. In Tbilisi he painted shop signs, worked on the railway,
    co-ran a dairy shop and painted for tavern keepers on cheap black oilcloth. In 1898 he built this
    house back in his home village. He died in Tbilisi in the spring of 1918, alone in a small basement
    room; where he is buried, no one knows.


    The museum opened in 1960 and holds more than 9,000 exhibits, among them his personal belongings and
    14 original paintings. Look at how often Pirosmani leaves the black oilcloth bare, letting it serve
    as night, as shadow, as the dark from which his feasting men and his calm, almost human-eyed animals
    step forward.


    In the 1910s the avant-garde poet Ilia Zdanevich, with his painter brother Kirill, championed his
    work and showed it to Pablo Picasso, who went on to make a portrait of him; a lithograph of that portrait
    hangs here among Pirosmani's own paintings. In 2018 his "Georgian Woman Wearing Lechaki" sold at Sotheby's
    for $2.8 million — a canvas that had once hung in Stefan Zweig's house in Salzburg.


    Legend says he sold everything he owned to carpet a street with flowers for a French actress named
    Marguerite, a tale later tied to the song "A Million Scarlet Roses". It is a Tbilisi story, and an
    unprovable one.


    Each October Mirzaani holds Pirosmanoba, a festival for the painter. A village of some four hundred
    people celebrating a man whose canvases now sell for millions: exactly the scale he painted at — a
    village, a table, its people.
  tip: >-
    The ticket price and opening hours are not reliably published online, so ask your Sighnaghi guesthouse
    to ring ahead before you make the detour. Allow about an hour for the house and the exhibition hall.
    Park on the village's main street; the walk in is flat. Food options in Mirzaani are thin — eat in
    Sighnaghi before or after. Expect crowds during Pirosmanoba in October. Khirsa Monastery is only about
    3 km away, and the two fit comfortably into one outing.
  route: >-
    Mirzaani is about 115 km from Tbilisi — roughly 1 hour 55 minutes, asphalt all the way. Take the Kakheti
    Highway (S5) through Sagarejo and Badiauri, then turn off onto the Sighnaghi road (Sh40). The last
    climb into Sighnaghi is a set of tight switchbacks; beyond the town you drop past Bodbe towards the
    plain and on to Mirzaani. Fill up in Sighnaghi, as fuel stations thin out after it. An economy car
    is entirely adequate: the road is paved and easy, with no rough stretch at all.
ru:
  name: Дом-музей Нико Пиросмани
  short: >-
    Сельский дом Нико Пиросмани 1898 года, ныне музей: 14 его подлинных картин и литография портрета художника
    работы Пикассо.
  body: >-
    **Нико Пиросмани не оставил после себя ни семьи, ни состояния, ни надгробия — но в Мирзаани, селе,
    где он родился, он оставил дом.**


    Пиросманашвили родился здесь в 1862 году в крестьянской семье; рано осиротев, он вырос на руках старших
    сестёр, Мариам и Пепе. Живописи его никто не учил. В Тбилиси он писал вывески для лавок, служил на
    железной дороге, на паях держал молочную лавку и писал картины для духанщиков на дешёвой чёрной клеёнке.
    В 1898 году он выстроил этот дом в родном селе. Умер он в Тбилиси весной 1918 года, в одиночестве,
    в тесной подвальной каморке; где его похоронили, не знает никто.


    Музей открылся в 1960 году и хранит более 9000 экспонатов, среди них личные вещи художника и 14 его
    подлинных картин. Посмотрите, как часто Пиросмани оставляет чёрную клеёнку нетронутой, и она становится
    ночью, тенью, той темнотой, из которой выступают его пирующие мужчины и спокойные звери с почти человеческими
    глазами.


    В 1910-е годы поэт-футурист Илья Зданевич вместе с братом, художником Кириллом, взялся продвигать
    его работы и показал их Пабло Пикассо, а тот впоследствии создал портрет Пиросмани; литография этого
    портрета висит здесь среди его собственных картин. В 2018 году его «Грузинка в лечаки» ушла на аукционе
    «Сотбис» за 2,8 миллиона долларов — полотно, когда-то висевшее в зальцбургском доме Стефана Цвейга.


    Легенда гласит, что ради французской актрисы по имени Маргарита он продал всё, что имел, и устлал
    цветами целую улицу; позже эту историю связали с песней «Миллион алых роз». Это тбилисская легенда,
    и доказать её невозможно.


    Каждый октябрь Мирзаани празднует Пиросманобу — праздник в честь художника. Село примерно в четыреста
    жителей чествует человека, чьи холсты теперь продаются за миллионы: ровно тот масштаб, в котором он
    писал, — село, стол, его люди.
  tip: >-
    Цены на билеты и часы работы в интернете надёжно не публикуются, поэтому попросите хозяев вашего гостевого
    дома в Сигнахи позвонить заранее, прежде чем сворачивать сюда. На дом и выставочный зал отведите около
    часа. Машину оставьте на главной улице села — дальше ровная дорога пешком. С едой в Мирзаани негусто:
    пообедайте в Сигнахи до или после. Во время Пиросманобы в октябре здесь людно. Хирсский монастырь
    всего в 3 км, и оба места легко объединить в одну поездку.
  route: >-
    Мирзаани — примерно в 115 км от Тбилиси, около 1 часа 55 минут езды, асфальт на всём пути. Езжайте
    по Кахетинскому шоссе (S5) через Сагареджо и Бадиаури, затем сверните на дорогу на Сигнахи (Sh40).
    Последний подъём к Сигнахи — череда крутых серпантинов; за городом дорога спускается мимо Бодбе к
    равнине и дальше к Мирзаани. Заправьтесь в Сигнахи: дальше заправки встречаются всё реже. Автомобиля
    эконом-класса вполне достаточно: дорога асфальтированная и лёгкая, без единого плохого участка.
fa:
  name: خانه‌موزهٔ نیکو پیروسمانی
  short: >-
    خانهٔ روستایی نیکو پیروسمانی، ساختهٔ ۱۸۹۸، که امروز موزه‌ای است با ۱۴ نقاشی او و لیتوگرافی چهره‌ای
    که پیکاسو از او کشید.
  body: >-
    **نیکو پیروسمانی نه خانواده‌ای از خود به جا گذاشت، نه ثروتی و نه سنگ گوری؛ اما در میرزاانی، روستایی
    که در آن به دنیا آمد، خانه‌ای به یادگار گذاشت.**


    پیروسماناشویلی در سال ۱۸۶۲ در همین روستا در خانواده‌ای دهقان به دنیا آمد، در کودکی یتیم شد و خواهران
    بزرگ‌ترش، مریم و په‌په، بزرگش کردند. هیچ‌کس نقاشی به او نیاموخت. در تفلیس تابلوی مغازه‌ها را می‌کشید،
    در راه‌آهن کار کرد، با شریکی دکان لبنیاتی می‌گرداند و برای میخانه‌داران روی مشمع ارزان و سیاه نقاشی
    می‌کرد. در سال ۱۸۹۸ این خانه را در زادگاهش ساخت. بهار ۱۹۱۸ در تفلیس، تنها، در اتاقکی زیرزمینی درگذشت؛
    و هیچ‌کس نمی‌داند کجا به خاک سپرده شد.


    موزه در سال ۱۹۶۰ گشایش یافت و بیش از ۹٬۰۰۰ شیء در خود دارد، از جمله وسایل شخصی او و ۱۴ نقاشی اصلی‌اش.
    ببینید پیروسمانی چه بسیار مشمع سیاه را دست‌نخورده رها می‌کند تا شب باشد، سایه باشد، همان تاریکی‌ای
    که مردانِ بر سر سفره و جانورانِ آرامِ او با چشمانی کمابیش انسانی از دلش پیش می‌آیند.


    در دههٔ ۱۹۱۰، ایلیا زدانویچ، شاعر آوانگارد، همراه برادر نقاشش کیریل، به حمایت از آثار او برخاست و
    آن‌ها را به پابلو پیکاسو نشان داد؛ پیکاسو بعدها چهره‌ای از پیروسمانی ساخت، و لیتوگرافی آن چهره اینجا
    در میان نقاشی‌های خود او آویخته است. در سال ۲۰۱۸ تابلوی «زن گرجی با لچاکی» او در حراج ساتبیز به ۲٫۸
    میلیون دلار فروخته شد؛ بومی که روزگاری در خانهٔ استفان تسوایگ در سالزبورگ آویخته بود.


    افسانه می‌گوید او هرچه داشت فروخت تا خیابانی را برای بازیگری فرانسوی به نام مارگریت فرشی از گل کند؛
    داستانی که بعدها به ترانهٔ «یک میلیون گل سرخ» پیوند خورد. این قصه‌ای تفلیسی است و اثبات‌شدنی نیست.


    هر سال در ماه اکتبر، میرزاانی جشن پیروسمانوبا را به افتخار این نقاش برپا می‌کند. روستایی با حدود چهارصد
    نفر جمعیت، مردی را گرامی می‌دارد که بوم‌هایش امروز به میلیون‌ها فروخته می‌شود: درست در همان مقیاسی
    که او نقاشی می‌کرد؛ یک روستا، یک سفره، و مردمانش.
  tip: >-
    بهای بلیت و ساعت کار موزه به‌طور قابل‌اعتماد در اینترنت منتشر نمی‌شود؛ پس پیش از آنکه راهتان را کج
    کنید، از مهمان‌خانه‌تان در سیغناغی بخواهید تماس بگیرد و بپرسد. برای خانه و تالار نمایشگاه حدود یک
    ساعت وقت بگذارید. خودرو را در خیابان اصلی روستا پارک کنید؛ راه پیاده تا موزه هموار است. در میرزاانی
    جای چندانی برای غذا خوردن نیست؛ پیش یا پس از بازدید در سیغناغی غذا بخورید. در ماه اکتبر، هنگام جشن
    پیروسمانوبا، منتظر شلوغی باشید. صومعهٔ خیرسا تنها حدود ۳ کیلومتر دورتر است و هر دو به‌راحتی در یک
    گشت جا می‌گیرند.
  route: >-
    میرزاانی حدود ۱۱۵ کیلومتر با تفلیس فاصله دارد؛ نزدیک به ۱ ساعت و ۵۵ دقیقه، و سراسر راه آسفالت است.
    از بزرگراه کاختی (S5) از میان ساگارجو و بادیائوری بگذرید و سپس به جادهٔ سیغناغی (Sh40) بپیچید. سربالایی
    پایانی تا سیغناغی رشته‌ای از پیچ‌های تند و تنگ است؛ پس از شهر، از کنار بودبه به سوی دشت پایین می‌روید
    و به میرزاانی می‌رسید. در سیغناغی باک را پر کنید، چون پس از آن جایگاه سوخت کمیاب می‌شود. خودروی اقتصادی
    کاملاً کافی است: جاده آسفالت و آسان است و هیچ تکهٔ ناهمواری ندارد.
he:
  name: בית־מוזיאון ניקו פירוסמני
  short: ביתו הכפרי של ניקו פירוסמני מ-1898, כיום מוזיאון ובו 14 מציוריו וליתוגרפיה של הדיוקן שפיקאסו
    עשה לו.
  body: >-
    **ניקו פירוסמני לא הותיר אחריו משפחה, הון או מצבה – אבל במירזאני, הכפר שבו נולד, הוא הותיר בית.**


    פירוסמנשווילי נולד כאן ב-1862 למשפחת איכרים, התייתם בילדותו וגדל אצל אחיותיו הבוגרות, מרים ופפה. איש
    לא לימד אותו לצייר. בטביליסי צייר שלטים לחנויות, עבד ברכבת, ניהל בשותפות חנות למוצרי חלב וצייר לבעלי
    מסבאות על שעוונית שחורה וזולה. ב-1898 בנה את הבית הזה בכפר הולדתו. הוא מת בטביליסי באביב 1918, לבדו,
    בחדרון קטן במרתף; היכן נקבר – איש אינו יודע.


    המוזיאון נפתח ב-1960 ומחזיק יותר מ-9,000 פריטים, ובהם חפציו האישיים ו-14 ציורים מקוריים שלו. שימו
    לב כמה פעמים פירוסמני משאיר את השעוונית השחורה חשופה ומניח לה להיות לילה, צל, החשכה שממנה מגיחים הגברים
    המסובים לסעודה וחיותיו השלוות, שעיניהן כמעט אנושיות.


    בשנות ה-1910 נרתם המשורר האוונגרדי איליה זדנביץ', יחד עם אחיו הצייר קיריל, לקדם את עבודותיו והראה
    אותן לפבלו פיקאסו, שלימים עשה דיוקן של פירוסמני; ליתוגרפיה של הדיוקן הזה תלויה כאן בין ציוריו של פירוסמני
    עצמו. ב-2018 נמכר ציורו "אישה גאורגית עם לצ'אקי" בסותביס ב-2.8 מיליון דולר – בד שהיה תלוי פעם בביתו
    של סטפן צוויג בזלצבורג.


    האגדה מספרת שמכר כל מה שהיה לו כדי לרפד רחוב שלם בפרחים לכבוד שחקנית צרפתייה בשם מרגריט, סיפור שנקשר
    מאוחר יותר לשיר "מיליון ורדים אדומים". זה סיפור טביליסאי, ואין דרך להוכיח אותו.


    מדי אוקטובר מקיים מירזאני את פירוסמנובה, פסטיבל לכבוד הצייר. כפר של כארבע מאות תושבים חוגג אדם שבדיו
    נמכרים היום במיליונים: בדיוק בקנה המידה שבו צייר – כפר, שולחן, האנשים שלו.
  tip: >-
    מחיר הכניסה ושעות הפתיחה אינם מתפרסמים ברשת באופן אמין, לכן בקשו מבעלי בית ההארחה שלכם בסיגנאגי להתקשר
    מראש לפני שאתם יוצאים לסטייה הזו. הקצו כשעה לבית ולאולם התצוגה. חנו ברחוב הראשי של הכפר; ההליכה פנימה
    מישורית. אפשרויות האוכל במירזאני דלות – אכלו בסיגנאגי לפני הביקור או אחריו. בזמן פירוסמנובה באוקטובר
    צפו לעומס. מנזר חירסה נמצא כ-3 ק"מ בלבד מכאן, ושני המקומות משתלבים בנוחות בטיול אחד.
  route: >-
    מירזאני נמצא כ-115 ק"מ מטביליסי – כשעה ו-55 דקות נסיעה, כולה על אספלט. סעו בכביש קאחטי (S5) דרך סאגארג'ו
    ובאדיאורי, ואז פנו לכביש סיגנאגי (Sh40). הטיפוס האחרון אל סיגנאגי הוא שורה של סיבובי פרסה צפופים;
    אחרי העיר יורדים על פני בודבה אל המישור וממשיכים למירזאני. תדלקו בסיגנאגי, כי אחריה תחנות הדלק נעשות
    נדירות. רכב חסכוני מספיק בהחלט: הכביש סלול וקל, בלי שום קטע משובש.
ar:
  name: متحف بيت نيكو بيروسماني
  short: >-
    بيت نيكو بيروسماني الريفي الذي بناه عام 1898، وهو اليوم متحف يضم 14 من لوحاته وطبعة حجرية لبورتريه
    له من عمل بيكاسو.
  body: >-
    **لم يترك نيكو بيروسماني وراءه عائلة ولا ثروة ولا شاهد قبر، لكنه ترك بيتاً في ميرزاني، القرية التي
    وُلد فيها.**


    وُلد بيروسماناشفيلي هنا عام 1862 لأسرة من الفلاحين، وتيتّم صغيراً فربّته أختاه الكبريان مريم وبيبي.
    لم يعلّمه أحد الرسم. في تبليسي رسم لافتات المحال، وعمل في السكك الحديدية، وأدار مع شريك دكاناً لمنتجات
    الألبان، ورسم لأصحاب الحانات على مشمّع أسود رخيص. وفي عام 1898 بنى هذا البيت في قريته. تُوفي في تبليسي
    في ربيع 1918، وحيداً في غرفة صغيرة بقبو؛ وأين دُفن، لا يعرف أحد.


    افتُتح المتحف عام 1960، ويضم أكثر من 9,000 قطعة، منها متعلقاته الشخصية و14 لوحة أصلية من أعماله. تأمّل
    كم مرة يترك بيروسماني المشمّع الأسود عارياً، فيجعله ليلاً وظلاً، وتلك العتمة التي يتقدّم منها رجاله
    الملتفّون حول الموائد وحيواناته الهادئة ذات العيون الشبيهة بعيون البشر.


    في العقد الثاني من القرن العشرين تبنّى الشاعر الطليعي إيليا زدانيفيتش، ومعه أخوه الرسام كيريل، أعماله
    وعرضها على بابلو بيكاسو، الذي رسم له لاحقاً بورتريه؛ وتُعلَّق طبعة حجرية من هذا البورتريه هنا بين
    لوحات بيروسماني نفسه. وفي عام 2018 بيعت لوحته «امرأة جورجية ترتدي اللِّتشاكي» في دار سوذبيز بمبلغ
    2.8 مليون دولار، وهي لوحة كانت معلّقة يوماً في بيت ستيفان تسفايغ في سالزبورغ.


    وتقول الأسطورة إنه باع كل ما يملك ليفرش شارعاً بالزهور من أجل ممثلة فرنسية تُدعى مارغريت، وهي حكاية
    رُبطت لاحقاً بأغنية «مليون وردة حمراء». إنها حكاية من تبليسي، ولا سبيل إلى إثباتها.


    في كل أكتوبر تحتفل ميرزاني بمهرجان بيروسمانوبا تكريماً للرسام. قرية يسكنها نحو أربعمئة شخص تحتفي برجل
    تُباع لوحاته اليوم بالملايين: وهذا بالضبط هو المقياس الذي رسم به، قرية ومائدة وأهلها.
  tip: >-
    لا يُنشر سعر التذكرة ولا مواعيد الفتح على الإنترنت بصورة موثوقة، لذا اطلب من دار الضيافة التي تنزل
    فيها في سيغناغي أن تتصل قبل أن تعرّج على المكان. خصّص نحو ساعة للبيت وقاعة العرض. اركن السيارة في
    الشارع الرئيسي للقرية؛ والطريق مشياً إلى المتحف مستوٍ. خيارات الطعام في ميرزاني شحيحة، فتناول طعامك
    في سيغناغي قبل الزيارة أو بعدها. توقّع الزحام خلال مهرجان بيروسمانوبا في أكتوبر. ويقع دير خيرسا على
    بُعد نحو 3 كم فقط، فيسهل الجمع بين المكانين في جولة واحدة.
  route: >-
    تبعد ميرزاني نحو 115 كم عن تبليسي، أي قرابة ساعة و55 دقيقة، والطريق معبّد بالكامل. اسلك طريق كاخيتي
    السريع (S5) مروراً بساغاريجو وبادياوري، ثم انعطف إلى طريق سيغناغي (Sh40). الصعود الأخير إلى سيغناغي
    سلسلة من المنعطفات الحادة المتلاحقة؛ وبعد البلدة تنحدر مروراً ببودبي نحو السهل ثم إلى ميرزاني. املأ
    خزان الوقود في سيغناغي، فمحطات الوقود تقلّ بعدها. تكفي تماماً سيارة من الفئة الاقتصادية: الطريق معبّد
    وسهل، بلا أي مقطع وعر.
