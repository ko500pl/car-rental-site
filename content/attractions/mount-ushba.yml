ka:
  name: უშბა
  short: სვანეთის ორქიმიანი ხატი (4710 მ) — კავკასიის „მატერჰორნი“, რომლის დანახვაც ცალკე მოგზაურობად
    ღირს.
  body: >-
    **უშბა ის მთაა, რომელიც სვანეთში ყველგან თან დაგყვება** — ორქიმიანი, პირქუში სილუეტი, რომელსაც „კავკასიის
    მატერჰორნს“ ეძახიან. სამხრეთი მწვერვალი 4710 მეტრია, ჩრდილოეთი — 4690; სიმაღლით კავკასიონის ათეულშიც
    ვერ ხვდება, მაგრამ ხასიათით ყველა მეზობელს ჩრდილავს. ალპინისტებისთვის ეს რეგიონის ერთ-ერთი ურთულესი
    ასასვლელია: ჩრდილოეთ მწვერვალზე პირველად 1888 წელს ავიდნენ (ჯონ კოკინი და ულრიხ ალმერი), სამხრეთი
    კი მხოლოდ 1903 წელს დანებდა რიკმერსის ექსპედიციას.


    სვანური გადმოცემით, უშბა ნადირობის ქალღმერთის, დალის, სამყოფელია — და მთა ხასიათსაც შესაბამისს ამჟღავნებს:
    საკუთარ ამინდს „ხარშავს“ და ქიმებს ხშირად ღრუბლებში მალავს.


    სად დაინახავ საუკეთესოდ:


    - **მესტიის ჯვრის გადასახედი** — კლასიკური რაკურსი მთელ ხეობასთან ერთად

    - **ბეჩოს ხეობა (მაზერი)** — უშბა აქ პირდაპირ თავზე გადმოგყურებს

    - **ჰაწვალი და ზურულდი** — საბაგიროთი ასასვლელი პანორამა უშბასა და თეთნულდზე

    - **კორულდის ტბები** — ანარეკლით, ვინც ზემოთ ასვლას გადაწყვეტს


    საუკეთესო შანსი მოწმენდილი უშბისა დილის პირველი საათებია, სექტემბერ-ოქტომბერში კი ცა ყველაზე სტაბილურია.
    ზამთარში ჰაწვალის საბაგიროდან თოვლიან ორქიმიან სილუეტს მთხილამურეები უყურებენ.
  tip: >-
    უშბა ხშირად ღრუბლებშია — გეგმა ისე ააწყვე, რომ გადასახედებზე დილით ადრე მოხვდე და ერთი სათადარიგო
    დღე გქონდეს. ჯვრის გადასახედამდე მესტიიდან 4x4-ით ან ფეხით (3-4 საათი) ადიხარ. სექტემბერი ფოტოგრაფის
    თვეა: ჰაერი გამჭვირვალეა და პირველი თოვლი ქიმებს ახალივით ხატავს. ბინოკლი ან ტელეობიექტივი წამოიღე.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ ზუგდიდი–მესტიის გზით (S7) — მესტიამდე დაახლოებით 465 კმ და
    8:30, ასფალტი ბოლომდე. ბეჩოს ხეობის ან ჯვრის გადასახედის მისასვლელები გრუნტია, ამიტომ SUV ყველაზე
    პრაქტიკული არჩევანია; მხოლოდ მესტიასა და ჰაწვალის საბაგირომდე ეკონომ-კლასითაც მიხვალ. საწვავი ზუგდიდში
    ჩაასხი, მესტიაშიც არის გასამართი. ზამთარში ჯაჭვები ან ზამთრის საბურავები აუცილებელია.
en:
  name: Mount Ushba
  short: >-
    The double-horned icon of Svaneti (4,710 m) — the "Matterhorn of the Caucasus", worth a journey just
    to be seen.
  body: >-
    **Ushba is the mountain that follows you everywhere in Svaneti** — a grim, double-horned silhouette
    nicknamed the "Matterhorn of the Caucasus". The south summit reaches 4,710 m, the north 4,690; it
    does not even crack the range's top ten by height, yet it outstares every neighbour by sheer character.
    For climbers it remains one of the hardest ascents in the region: the north summit fell first in 1888
    (John Cockin and Ulrich Almer), the south only in 1903, to Rickmers' expedition.


    Svan tradition makes Ushba the home of Dali, the golden-haired goddess of the hunt — and the mountain
    behaves accordingly, brewing its own weather and hiding its horns in cloud for days.


    Where to see it best:


    - **The Mestia Cross viewpoint** — the classic angle, with the whole valley below

    - **The Becho valley (Mazeri)** — here Ushba hangs directly overhead

    - **Hatsvali and Zuruldi** — a cable-car panorama of Ushba and Tetnuldi

    - **Koruldi Lakes** — with reflections, for those who climb higher


    Your best odds of a clear Ushba are the first hours after dawn, and September–October brings the steadiest
    skies. In winter, skiers watch the snowbound double horn straight from the Hatsvali lifts.
  tip: >-
    Ushba spends much of its time in cloud — plan viewpoints for early morning and keep one spare day
    in reserve. The Cross viewpoint above Mestia is reached by 4x4 or on foot (3–4 hours up). September
    is the photographer's month: the air turns transparent and the first snow repaints the horns. Bring
    binoculars or a telephoto lens.
  route: >-
    From Tbilisi take the E60 to Samtredia, then the Zugdidi–Mestia road (S7) — about 465 km and 8:30
    to Mestia, asphalt the whole way. The approaches into the Becho valley or up to the Cross viewpoint
    are dirt tracks, so an SUV is the most practical choice; for Mestia itself and the Hatsvali cable
    car an economy car suffices. Refuel in Zugdidi; Mestia has stations too. In winter, winter tyres or
    chains are essential.
ru:
  name: Гора Ушба
  short: Двурогая икона Сванети (4710 м) — «Маттерхорн Кавказа», ради одного вида которого стоит ехать.
  body: >-
    **Ушба — гора, которая в Сванети следует за вами повсюду:** мрачный двурогий силуэт, прозванный «Маттерхорном
    Кавказа». Южная вершина достигает 4710 м, северная — 4690; по высоте она не входит даже в десятку
    хребта, но характером затмевает всех соседей. Для альпинистов это по-прежнему одно из сложнейших восхождений
    региона: северная вершина покорилась впервые в 1888 году (Джон Коккин и Ульрих Альмер), южная — лишь
    в 1903-м, экспедиции Рикмерса.


    Сванское предание делает Ушбу домом Дали, златовласой богини охоты, — и гора ведёт себя соответственно:
    варит собственную погоду и днями прячет рога в облаках.


    Откуда смотреть лучше всего:


    - **Смотровая у Креста над Местией** — классический ракурс со всей долиной внизу

    - **Долина Бечо (Мазери)** — здесь Ушба нависает прямо над головой

    - **Хацвали и Зурулди** — канатная дорога с панорамой Ушбы и Тетнулди

    - **Озёра Корулди** — с отражениями, для тех, кто поднимется выше


    Лучшие шансы застать Ушбу открытой — первые часы после рассвета, а самое устойчивое небо — в сентябре-октябре.
    Зимой лыжники разглядывают заснеженный двурогий силуэт прямо с подъёмников Хацвали.
  tip: >-
    Ушба большую часть времени в облаках — планируйте смотровые на раннее утро и держите день про запас.
    К смотровой у Креста над Местией добираются на внедорожнике или пешком (3–4 часа подъёма). Сентябрь
    — месяц фотографа: воздух прозрачен, а первый снег заново прорисовывает рога. Возьмите бинокль или
    телеобъектив.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем по дороге Зугдиди–Местиа (S7) — до Местии около 465 км и 8:30,
    асфальт на всём пути. Подъезды в долину Бечо и к смотровой у Креста — грунтовки, так что SUV — самый
    практичный выбор; до самой Местии и канатки Хацвали доедет и эконом-класс. Заправьтесь в Зугдиди;
    в Местии тоже есть АЗС. Зимой обязательны зимняя резина или цепи.
fa:
  name: کوه اوشبا
  short: نماد دوشاخ سوانتی (۴۷۱۰ متر) — «ماترهورن قفقاز» که دیدنش به‌تنهایی ارزش سفر دارد.
  body: >-
    **اوشبا کوهی است که در سوانتی همه‌جا دنبالتان می‌آید** — سیلوئتی عبوس و دوشاخ که «ماترهورن قفقاز»
    لقب گرفته است. قلهٔ جنوبی ۴۷۱۰ متر است و شمالی ۴۶۹۰؛ از نظر بلندی حتی در ده‌تای نخست رشته‌کوه هم نیست،
    اما با صِرف شخصیتش بر همهٔ همسایگان سایه می‌اندازد. برای کوهنوردان همچنان یکی از دشوارترین صعودهای
    منطقه است: قلهٔ شمالی نخستین بار در ۱۸۸۸ فتح شد (جان کاکین و اولریش آلمر) و جنوبی تنها در ۱۹۰۳، به
    دست هیئت ریکمرس.


    در باور سوان‌ها اوشبا خانهٔ دالی، الههٔ زرین‌موی شکار است — و کوه هم درخور همین رفتار می‌کند: آب‌وهوای
    خودش را «می‌پزد» و شاخ‌هایش را روزها در ابر پنهان می‌کند.


    از کجا بهتر دیده می‌شود:


    - **دیدگاه صلیب مستیا** — زاویهٔ کلاسیک، با تمام دره در پایین

    - **درهٔ بچو (مازری)** — اینجا اوشبا درست بالای سرتان آویخته است

    - **هاتسوالی و زورولدی** — پانورامای اوشبا و تتنولدی با تله‌کابین

    - **دریاچه‌های کورولدی** — با بازتاب قله، برای آنها که بالاتر می‌روند


    بهترین بخت برای اوشبای صاف، ساعات نخست بامداد است و پایدارترین آسمان در سپتامبر و اکتبر. در زمستان،
    اسکی‌بازان سیلوئت دوشاخ برف‌پوش را یکراست از بالابرهای هاتسوالی تماشا می‌کنند.
  tip: >-
    اوشبا بیشتر وقت‌ها در ابر است — دیدگاه‌ها را برای صبح زود برنامه‌ریزی کنید و یک روز ذخیره نگه دارید.
    به دیدگاه صلیبِ بالای مستیا با چهارچرخ‌محرک یا پیاده (۳ تا ۴ ساعت صعود) می‌رسند. سپتامبر ماه عکاسان
    است: هوا شفاف می‌شود و نخستین برف شاخ‌ها را از نو نقاشی می‌کند. دوربین دوچشمی یا لنز تله بیاورید.
  route: >-
    از تفلیس با E60 تا سامتردیا، سپس با جادهٔ زوگدیدی–مستیا (S7) — تا مستیا حدود ۴۶۵ کیلومتر و هشت ساعت
    و نیم، سراسر آسفالت. راه‌های ورود به درهٔ بچو یا بالارفتن تا دیدگاه صلیب خاکی‌اند، پس شاسی‌بلند عملی‌ترین
    انتخاب است؛ برای خود مستیا و تله‌کابین هاتسوالی خودروی اقتصادی هم بس است. در زوگدیدی بنزین بزنید؛
    مستیا هم جایگاه دارد. در زمستان لاستیک زمستانی یا زنجیر چرخ ضروری است.
he:
  name: הר אושבה
  short: הסמל הדו-קרני של סוונטי (4,710 מ') — "המטרהורן של הקווקז", שכדאי לנסוע רק כדי לראותו.
  body: >-
    **אושבה הוא ההר שעוקב אחריכם לכל מקום בסוונטי** — צללית קודרת ודו-קרנית שזכתה לכינוי "המטרהורן של
    הקווקז". הפסגה הדרומית מגיעה ל-4,710 מ', הצפונית ל-4,690; בגובהו הוא אפילו לא נכנס לעשירייה הראשונה
    של הרכס, אבל באופיו הוא מאפיל על כל שכניו. עבור מטפסים זו עדיין אחת העליות הקשות באזור: הפסגה הצפונית
    נכבשה לראשונה ב-1888 (ג'ון קוקין ואולריך אלמר), והדרומית רק ב-1903, בידי משלחתו של ריקמרס.


    המסורת הסוונית עושה את אושבה לביתה של דאלי, אלת הציד זהובת השיער — וההר מתנהג בהתאם: מבשל לעצמו מזג
    אוויר ומסתיר את קרניו בעננים ימים שלמים.


    מאיפה רואים אותו הכי טוב:


    - **תצפית הצלב מעל מסטיה** — הזווית הקלאסית, עם כל העמק מתחת

    - **עמק בצ'ו (מאזרי)** — כאן אושבה תלוי ממש מעל הראש

    - **האצוואלי וזורולדי** — פנורמת רכבל של אושבה וטטנולדי

    - **אגמי קורולדי** — עם השתקפויות, למי שמטפס גבוה יותר


    הסיכוי הטוב ביותר לאושבה חשוף הוא בשעות הראשונות אחרי הזריחה, והשמיים היציבים ביותר — בספטמבר-אוקטובר.
    בחורף הגולשים צופים בצללית הדו-קרנית המושלגת היישר ממעליות האצוואלי.
  tip: >-
    אושבה שרוי רוב הזמן בעננים — תכננו את התצפיות לבוקר מוקדם והשאירו יום רזרבי. אל תצפית הצלב מעל מסטיה
    מגיעים ב-4x4 או ברגל (3–4 שעות עלייה). ספטמבר הוא חודש הצלמים: האוויר נעשה שקוף והשלג הראשון מצייר
    את הקרניים מחדש. קחו משקפת או עדשת טלה.
  route: >-
    מטביליסי ב-E60 עד סמטרדיה, ואז בדרך זוגדידי–מסטיה (S7) — כ-465 ק"מ ו-8:30 שעות עד מסטיה, אספלט לכל
    האורך. דרכי הגישה לעמק בצ'ו או לתצפית הצלב הן דרכי עפר, ולכן רכב שטח קל הוא הבחירה המעשית ביותר; למסטיה
    עצמה ולרכבל האצוואלי מספיק גם רכב חסכוני. תדלקו בזוגדידי; גם במסטיה יש תחנות. בחורף חובה צמיגי חורף
    או שרשראות.
ar:
  name: جبل أوشبا
  short: أيقونة سفانيتي ذات القرنين (4710 أمتار) — «ماترهورن القوقاز» الذي تستحق رؤيته وحدها الرحلة.
  body: >-
    **أوشبا هو الجبل الذي يلاحقك في كل مكان من سفانيتي** — طيف عابس بقرنين اثنين لُقّب «ماترهورن القوقاز».
    تبلغ القمة الجنوبية 4710 أمتار والشمالية 4690؛ وهو لا يدخل حتى في العشرة الأوائل من السلسلة ارتفاعاً،
    لكنه يطغى على كل جيرانه بشخصيته وحدها. وما زال عند المتسلقين واحداً من أصعب صعود المنطقة: سقطت القمة
    الشمالية أولاً عام 1888 (جون كوكين وأولريش ألمر)، أما الجنوبية فلم تستسلم إلا عام 1903 لبعثة ريكمرس.


    تجعل التقاليد السفانية أوشبا مسكن دالي، إلهة الصيد ذهبية الشعر — والجبل يتصرف على هذا النحو تماماً:
    يطبخ طقسه الخاص ويخبئ قرنيه في الغيوم أياماً.


    من أين تراه في أبهى صوره:


    - **مطل الصليب فوق مستيا** — الزاوية الكلاسيكية والوادي كله تحتك

    - **وادي بيتشو (مازيري)** — هنا يتدلى أوشبا فوق رأسك مباشرة

    - **هاتسفالي وزورولدي** — بانوراما بالتلفريك لأوشبا وتتنولدي

    - **بحيرات كورولدي** — مع الانعكاسات، لمن يصعد أعلى


    أفضل فرصك بأوشبا صافياً هي الساعات الأولى بعد الفجر، وأثبت السماء في سبتمبر وأكتوبر. وفي الشتاء يرقب
    المتزلجون القرنين المكسوين بالثلج مباشرة من مصاعد هاتسفالي.
  tip: >-
    يقضي أوشبا معظم وقته في الغيوم — رتّب المطلات لساعات الصباح الأولى واحتفظ بيوم احتياطي. يُبلغ مطل
    الصليب فوق مستيا بسيارة دفع رباعي أو سيراً (3–4 ساعات صعوداً). سبتمبر شهر المصورين: يصفو الهواء ويعيد
    الثلج الأول رسم القرنين. أحضر منظاراً أو عدسة مقربة.
  route: >-
    من تبليسي عبر E60 حتى سامتريديا، ثم بطريق زوغديدي–مستيا (S7) — نحو 465 كم و8 ساعات ونصف حتى مستيا،
    أسفلت على الطريق كله. أما مداخل وادي بيتشو أو الصعود إلى مطل الصليب فطرق ترابية، لذا فسيارة الدفع
    الرباعي الخيار الأكثر عملية؛ ولمستيا نفسها وتلفريك هاتسفالي تكفي سيارة اقتصادية. تزوّد بالوقود في
    زوغديدي؛ وفي مستيا محطات أيضاً. وفي الشتاء لا غنى عن إطارات شتوية أو سلاسل.
