ka:
  name: უშბა
  short: >-
    სვანეთის თავზე აღმართული ორთავიანი, 4710-მეტრიანი მწვერვალი, „კავკასიის მატერჰორნი“; გადმოცემით, ნადირობის
    ქალღმერთის, დალის სამყოფელი.
  body: >-
    **უშბას ყველაზე მაღალი ყოფნა არ სჭირდება: ორი გრანიტის რქა, 4710 და 4690 მეტრი, და სახელი, რომელსაც
    მასზე მაღალი ვერც ერთი მეზობელი ვერ შეედრება.**


    კავკასიონის ათ უმაღლეს მწვერვალში უშბა არ შედის, მაგრამ მთამსვლელთა დიდი ნაწილი მას ქედის ყველაზე
    ძნელ ასასვლელად მიიჩნევს, ბევრი მოგზაური კი — ყველაზე ლამაზ მწვერვალად; აქედან მოდის მეტსახელიც, „კავკასიის
    მატერჰორნი“. მთა მესტიიდან 10-იოდე კილომეტრზე, ჩრდილო-დასავლეთით აღმართულა, რუსეთის საზღვარი მის ჩრდილოეთით
    გადის. აგებულია პალეოზოური გრანიტებითა და კრისტალური ფიქლებით, ფერდობებზე კი უშბისა და გულის მყინვარები
    ეშვება.


    სვანებს მისი ხასიათისთვის თავისი ახსნა ჰქონდათ: გადმოცემით, უშბა ნადირობის ოქროსთმიანი ქალღმერთის,
    დალის სამყოფელია. მთა დღესაც ჭირვეულად იქცევა — ამინდს თავად ქმნის და ორივე წვერს დღეობით მალავს ღრუბელში.


    მასზე ასვლის ისტორია მოთმინების ისტორიაა. 1868 წელს დაგლას ფრეშფილდის ინგლისელმა ჯგუფმა სცადა და უკან
    დაიხია. 1888 წელს ჯონ კოკინმა და ულრიხ ალმერმა მეოთხე ცდაზე, გულის მყინვარის გავლით, ჩრდილოეთ მწვერვალს
    მიაღწიეს. სამხრეთი 1903 წლამდე უძლებდა, სანამ ვილი რიკმერ რიკმერსის გერმანულ-შვეიცარიულ-ავსტრიულმა
    ექსპედიციამ არ დაიპყრო. 1934 წელს მწვერვალზე პირველი ქართული ჯგუფი ავიდა და ალექსანდრა ჯაფარიძე უშბაზე
    ასული პირველი ქალი გახდა. სამი წლის შემდეგ სვანმა მთამსვლელებმა — გაბრიელ, ბექნუ და ბესარიონ ხერგიანებმა,
    ჭიჭიკო ჩართოლანმა და მაქსიმე გვარლიანმა — სამხრეთ უშბაზე პირველად ურთულესი სამხრეთი კედლით ავიდნენ.


    ამ ყველაფრის შესაგრძნობად თოკი არ გჭირდებათ. მესტიის ჯვრიდან, ბეჩოს ხეობის მაზერიდან, ჰაწვალისა და
    ზურულდის ქედიდან თუ კორულდის ტბების სარკიდან ორთავიანი უშბა თვალს მაინც მოგტაცებთ. განთიადისას კი,
    როცა პირველი სხივი მხოლოდ მის წვერებს ეხება, მთელი ხეობა ჯერ ისევ ჩრდილშია.
  tip: >-
    უშბა დიდ დროს ღრუბელში ატარებს, ამიტომ გადასახედზე დილით ადრე იყავით და მესტიაში ერთი სათადარიგო დღე
    დაიტოვეთ. ბინოკლი ან ტელეობიექტივი რქების ყინულს კარგად გამოაჩენს. თავად მწვერვალი მხოლოდ გამოცდილი
    ალპინისტებისთვისაა: საქართველოს მხრიდან სამხრეთ წვერზე მიმავალი მარშრუტები უმაღლესი სირთულისაა, ჩრდილოეთის
    სტანდარტული გზა კი რუსეთის მხრიდან ადის და ფაქტობრივად საზღვრის გადაკვეთას ნიშნავს. ჰაწვალის საბაგირო
    მესტიიდან ზამთარშიც მუშაობს და თოვლიანი უშბა პირდაპირ ფერდობიდან ჩანს. მესტიის ჯვრის გადასახედამდე
    ფეხით 3–4 საათი სჭირდება, ან ოთხწამყვანიანი მანქანით ახვალთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, იქიდან ისევ ს1-ით, სენაკის გავლით, ზუგდიდამდე,
    შემდეგ კი ენგურის ხეობის გზით, ჯვრისა და ხაიშის გავლით, მესტიამდე ადით: დაახლოებით 465 კილომეტრი და
    რვა საათი და ოცდაათი წუთი. ასფალტი ბოლომდეა, მაგრამ ზუგდიდის შემდეგ გზა მთისაა, კლაკნილი, წვიმის შემდეგ
    კი ქვაცვენაც ხდება. მესტიისა და ჰაწვალის საბაგიროსთვის ეკონომ-კლასიც კმარა, ჯვრის გადასახედისა და
    მაზერის იქითა გზები კი გრუნტისაა — ამიტომ მაღალი გამავლობის მანქანა (ჯიპი) ჯობია. საწვავი ზუგდიდში
    და მესტიაში ჩაასხით. ზამთარში ზამთრის საბურავები ან ჯაჭვები აუცილებელია.
en:
  name: Mount Ushba
  short: >-
    The twin-summited, 4,710 m 'Matterhorn of the Caucasus' above Svaneti, home, the Svans said, of Dali,
    goddess of the hunt.
  body: >-
    **Ushba does not need to be the highest: two granite horns, 4,710 and 4,690 metres, and a reputation
    no taller neighbour can match.**


    It is not among the ten highest summits of the Caucasus, yet many climbers call it the hardest in
    the range and many travellers the most beautiful, hence its nickname, the "Matterhorn of the Caucasus".
    The mountain stands about 10 km north-west of Mestia, with the Russian border just to its north. It
    is built of Palaeozoic granite and crystalline schist, and the Ushba and Guli glaciers pour down its
    flanks.


    The Svans had their own explanation for its moods: Ushba, tradition says, was the home of Dali, the
    golden-haired goddess of the hunt. The mountain still behaves like a temperamental host, brewing its
    own weather and hiding both horns in cloud for days on end.


    Its climbing history is a lesson in patience. Douglas Freshfield's English party tried in 1868 and
    turned back. In 1888 John Garforth Cockin and Ulrich Almer, on the fourth attempt, reached the north
    summit by the Guli glacier. The south summit held out until 1903, when a German-Swiss-Austrian expedition
    led by Willi Rickmer Rickmers took it. In 1934 the first Georgian team reached the top, and Aleksandra
    Japaridze became the first woman to stand on Ushba. Three years later Svan climbers, Gabriel, Beknu
    and Besarion Khergiani with Chichiko Chartolani and Maksime Gvarliani, forced the fearsome south face.


    You need no rope to feel any of this. From the Mestia Cross, from Mazeri in the Becho valley, from
    the Hatsvali and Zuruldi ridge or in the mirror of the Koruldi lakes, the double horn keeps catching
    your eye. At dawn the first light touches only its two summits, while the whole valley below is still
    in shadow.
  tip: >-
    Ushba spends much of its life in cloud, so be at your viewpoint early and keep a spare day in Mestia.
    Binoculars or a long lens bring out the ice on the horns. The summit itself is for experienced alpinists
    only: the Georgian routes to the south peak are graded ED, and the standard route to the north peak
    climbs from the Russian side, which technically means crossing the border. The Hatsvali cable car
    runs from Mestia in winter too, with a snow-covered Ushba straight from the piste. The Mestia Cross
    viewpoint takes 3–4 hours on foot, or go by 4x4.
  route: >-
    From Tbilisi take the S1 (E60) west to Samtredia, continue on the S1 through Senaki to Zugdidi, then
    climb the Enguri gorge road through Jvari and Khaishi to Mestia: about 465 km, so allow eight and
    a half hours. It is asphalt all the way, but beyond Zugdidi this is a winding mountain road with rockfall
    after rain. For Mestia and the Hatsvali cable car an economy car will do; the tracks to the Cross
    viewpoint and beyond Mazeri are dirt, which is why an SUV is the better choice. Fuel in Zugdidi and
    Mestia. In winter fit winter tyres or carry chains.
ru:
  name: Гора Ушба
  short: >-
    Двуглавая Ушба (4710 м), «Маттерхорн Кавказа» над Сванетией; по сванскому поверью, здесь жила Дали,
    богиня охоты.
  body: >-
    **Ушбе незачем быть самой высокой: два гранитных рога, 4710 и 4690 метров, и слава, с которой не сравниться
    ни одному более высокому соседу.**


    Она не входит даже в десятку высочайших вершин Кавказа, и всё же многие альпинисты считают её самой
    трудной в хребте, а многие путешественники — самой красивой; отсюда и прозвище «Маттерхорн Кавказа».
    Гора стоит примерно в 10 км к северо-западу от Местиа, сразу к северу от неё проходит граница с Россией.
    Сложена она палеозойскими гранитами и кристаллическими сланцами, а по склонам стекают ледники Ушба
    и Гули.


    У сванов было своё объяснение её нраву: по преданию, на Ушбе жила Дали, золотоволосая богиня охоты.
    Гора и сейчас ведёт себя как капризная хозяйка: сама варит себе погоду и порой целыми днями прячет
    оба рога в облаках.


    История её восхождений — урок терпения. Английская группа Дугласа Фрешфилда попыталась подняться в
    1868 году и отступила. В 1888 году Джон Гарфорт Кокин и Ульрих Альмер с четвёртой попытки вышли на
    северную вершину по леднику Гули. Южная держалась до 1903 года, когда её взяла германо-швейцарско-австрийская
    экспедиция Вилли Рикмера Рикмерса. В 1934 году на вершину впервые поднялась грузинская команда, а
    Александра Джапаридзе стала первой женщиной, ступившей на Ушбу. Три года спустя сванские альпинисты
    — Габриэл, Бекну и Бесарион Хергиани вместе с Чичико Чартолани и Максиме Гварлиани — прошли грозную
    южную стену.


    Чтобы всё это почувствовать, верёвка не нужна. С Местийского креста, из Мазери в долине Бечо, с гребня
    Хацвали и Зурулди или в зеркале Корульдских озёр двойной рог всё время притягивает взгляд. На рассвете
    первый свет касается только двух её вершин, а вся долина внизу ещё лежит в тени.
  tip: >-
    Ушба бо́льшую часть времени проводит в облаках, поэтому приходите на смотровую точку рано и оставьте
    в запасе лишний день в Местиа. Бинокль или длиннофокусный объектив покажут лёд на рогах. Сама вершина
    — только для опытных альпинистов: грузинские маршруты на южную вершину имеют категорию ED, а стандартный
    путь на северную поднимается с российской стороны, то есть формально требует пересечь границу. Канатная
    дорога Хацвали работает из Местиа и зимой, и заснеженная Ушба видна прямо со склона. До смотровой
    площадки у Местийского креста — 3–4 часа пешком или поездка на полноприводной машине.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) до Самтредиа, дальше по S1 через Сенаки до Зугдиди, а затем
    поднимайтесь по дороге через ущелье Ингури, через Джвари и Хаиши, до Местиа: около 465 км, так что
    закладывайте восемь с половиной часов. Асфальт на всём пути, но за Зугдиди это извилистая горная дорога,
    на которую после дождей сходят камнепады. Для Местиа и канатной дороги Хацвали хватит машины эконом-класса;
    дороги к Местийскому кресту и за Мазери грунтовые, поэтому лучше выбрать внедорожник. Заправка — в
    Зугдиди и Местиа. Зимой ставьте зимнюю резину или возите цепи.
fa:
  name: کوه اوشبا
  short: اوشبای دوقله با ۴٬۷۱۰ متر، «ماترهورن قفقاز» بر فراز سوانتی؛ به باور سوان‌ها خانهٔ دالی، ایزدبانوی
    شکار.
  body: >-
    **اوشبا نیازی ندارد بلندترین باشد: دو شاخ گرانیتی، ۴٬۷۱۰ و ۴٬۶۹۰ متر، و آوازه‌ای که هیچ همسایهٔ بلندتری
    به پایش نمی‌رسد.**


    این کوه حتی در میان ده قلهٔ بلند قفقاز هم نیست، با این همه بسیاری از کوهنوردان آن را دشوارترین قلهٔ
    این رشته‌کوه می‌دانند و بسیاری از مسافران زیباترینش؛ لقب «ماترهورن قفقاز» از همین جاست. اوشبا حدود
    ۱۰ کیلومتری شمال غربی مستیا ایستاده و مرز روسیه درست در شمال آن است. پیکرش از گرانیت و شیست بلورین
    دوران پالئوزوئیک ساخته شده و یخچال‌های اوشبا و گولی از دامنه‌هایش سرازیرند.


    سوان‌ها برای حال‌وهوای متغیرش توضیح خود را داشتند: به روایت سنت، اوشبا خانهٔ دالی، ایزدبانوی زرین‌موی
    شکار، بود. کوه هنوز همچون میزبانی دمدمی‌مزاج رفتار می‌کند؛ هوای خودش را می‌سازد و گاه روزها هر دو
    شاخ را در ابر پنهان می‌کند.


    تاریخ صعود به اوشبا درسی در شکیبایی است. گروه انگلیسی داگلاس فرشفیلد در ۱۸۶۸ بخت خود را آزمود و بازگشت.
    در ۱۸۸۸ جان گارفورث کاکین و اولریش آلمر در چهارمین تلاش از راه یخچال گولی به قلهٔ شمالی رسیدند. قلهٔ
    جنوبی تا ۱۹۰۳ تاب آورد، تا آنکه گروهی آلمانی، سوئیسی و اتریشی به سرپرستی ویلی ریکمر ریکمرز آن را فتح
    کرد. در ۱۹۳۴ نخستین گروه گرجی به قله رسید و الکساندرا جاپاریدزه نخستین زنی شد که بر اوشبا ایستاد.
    سه سال بعد کوهنوردان سوان، گابریل، بکنو و بساریون خرگیانی همراه با چیچیکو چارتولانی و ماکسیمه گوارلیانی،
    دیوارهٔ هولناک جنوبی را گشودند.


    برای حس کردن این همه به طناب نیازی نیست. از صلیب مستیا، از مازری در درهٔ بچو، از ستیغ هاتسوالی و زورولدی
    یا در آینهٔ دریاچه‌های کورولدی، شاخ دوگانه مدام نگاه را به سوی خود می‌کشد. سپیده‌دم نخستین پرتو نور
    تنها دو قلهٔ آن را لمس می‌کند، در حالی که همهٔ درهٔ زیرین هنوز در سایه است.
  tip: >-
    اوشبا بیشتر عمرش را در ابر می‌گذراند، پس زود به نقطهٔ تماشا بروید و یک روز اضافه در مستیا کنار بگذارید.
    دوربین دوچشمی یا لنز بلند یخ روی شاخ‌ها را آشکار می‌کند. خود قله تنها برای کوهنوردان باتجربه است:
    مسیرهای گرجی به قلهٔ جنوبی درجهٔ ED دارند و مسیر معمول قلهٔ شمالی از سوی روسیه بالا می‌رود، یعنی از
    نظر فنی عبور از مرز را می‌طلبد. تله‌کابین هاتسوالی در زمستان هم از مستیا کار می‌کند و اوشبای برف‌پوش
    را درست از روی پیست می‌بینید. تا منظرگاه صلیب مستیا سه تا چهار ساعت پیاده‌روی است، یا با خودروی چهارچرخ‌محرک
    بروید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا سامتردیا بگیرید، روی S1 از سناکی تا زوگدیدی ادامه دهید
    و سپس جادهٔ تنگهٔ انگوری را از جواری و خایشی تا مستیا بالا بروید: حدود ۴۶۵ کیلومتر، پس هشت ساعت و
    نیم در نظر بگیرید. همهٔ راه آسفالت است، اما پس از زوگدیدی جاده‌ای کوهستانی و پرپیچ‌وخم است که پس از
    باران ریزش سنگ دارد. برای مستیا و تله‌کابین هاتسوالی خودروی اقتصادی بس است؛ راه‌های منظرگاه صلیب و
    فراتر از مازری خاکی‌اند، از این رو شاسی‌بلند انتخاب بهتری است. سوخت در زوگدیدی و مستیا. در زمستان
    لاستیک زمستانی بگذارید یا زنجیر همراه داشته باشید.
he:
  name: הר אושבה
  short: האושבה כפול הפסגות, 4,710 מ׳, "המטרהורן של הקווקז" שמעל סוונטי – ולפי אמונת הסוונים משכנה של
    דאלי, אלת הציד.
  body: >-
    **האושבה אינו צריך להיות הגבוה ביותר: שתי קרני גרניט, 4,710 ו-4,690 מטרים, ומוניטין שאף שכן גבוה ממנו
    אינו מתקרב אליו.**


    הוא אינו נמנה אפילו עם עשר הפסגות הגבוהות בקווקז, ובכל זאת מטפסים רבים רואים בו את הקשה ביותר ברכס,
    ומטיילים רבים – את היפה ביותר; מכאן כינויו, "המטרהורן של הקווקז". ההר ניצב כ-10 ק״מ מצפון-מערב למסטיה,
    וגבול רוסיה עובר ממש מצפון לו. הוא בנוי מגרניט ומשיסט גבישי מן הפלאוזואיקון, ובמורדותיו זורמים קרחוני
    אושבה וגולי.


    לסוונים היה הסבר משלהם למצבי רוחו: לפי המסורת, האושבה היה משכנה של דאלי, אלת הציד זהובת השיער. ההר
    מתנהג עד היום כמו מארח הפכפך: מבשל לעצמו את מזג האוויר ומסתיר את שתי קרניו בעננים ימים שלמים.


    תולדות הטיפוס עליו הן שיעור בסבלנות. משלחתו האנגלית של דאגלס פרשפילד ניסתה ב-1868 ונסוגה. ב-1888 הגיעו
    ג׳ון גרפורת׳ קוקין ואולריך אלמר, בניסיון הרביעי, אל הפסגה הצפונית דרך קרחון גולי. הפסגה הדרומית עמדה
    בפני המטפסים עד 1903, אז כבשה אותה משלחת גרמנית-שווייצרית-אוסטרית בראשות וילי ריקמר ריקמרס. ב-1934
    הגיע לפסגה הצוות הגאורגי הראשון, ואלכסנדרה ג׳פרידזה הייתה לאישה הראשונה שעמדה על האושבה. שלוש שנים
    אחר כך פרצו מטפסים סוונים – גבריאל, בקנו ובסריון חרגיאני, יחד עם צ׳יצ׳יקו צ׳רטולני ומקסימה גוורליאני
    – נתיב בקיר הדרומי המאיים.


    לא צריך חבל כדי להרגיש את כל זה. מן הצלב של מסטיה, ממזרי שבעמק בצ׳ו, מרכס חאצוואלי וזורולדי או בראי
    אגמי קורולדי, הקרן הכפולה מושכת את העין שוב ושוב. עם שחר האור הראשון נוגע רק בשתי פסגותיו, בעוד העמק
    כולו שלמטה עדיין שרוי בצל.
  tip: >-
    האושבה מבלה את רוב ימיו בעננים, לכן הגיעו מוקדם לנקודת התצפית ושמרו יום רזרבי במסטיה. משקפת או עדשה
    ארוכה יבליטו את הקרח שעל הקרניים. הפסגה עצמה מיועדת למטפסים מנוסים בלבד: המסלולים הגאורגיים אל הפסגה
    הדרומית מדורגים ED, והמסלול הרגיל אל הפסגה הצפונית עולה מן הצד הרוסי, כלומר מבחינה טכנית כרוך בחציית
    הגבול. הרכבל של חאצוואלי פועל ממסטיה גם בחורף, וממדרון הסקי רואים ישר את האושבה המושלג. אל תצפית הצלב
    של מסטיה הולכים שלוש-ארבע שעות ברגל, או עולים ברכב שטח.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד סמטרדיה, המשיכו ב-S1 דרך סנאקי עד זוגדידי, ומשם טפסו בכביש ערוץ
    האינגורי דרך ג׳ווארי וחאישי עד מסטיה: כ-465 ק״מ, ולכן הקצו שמונה וחצי שעות. הדרך כולה סלולה, אבל אחרי
    זוגדידי זהו כביש הררי מפותל, ואחרי גשם נופלים עליו סלעים. למסטיה ולרכבל חאצוואלי מספיק רכב חסכוני;
    הדרכים אל תצפית הצלב ומעבר למזרי הן דרכי עפר, ולכן רכב פנאי-שטח הוא הבחירה הטובה יותר. תדלוק בזוגדידי
    ובמסטיה. בחורף התקינו צמיגי חורף או הצטיידו בשרשראות.
ar:
  name: جبل أوشبا
  short: أوشبا ذو القمتين (4710 م)، «ماترهورن القوقاز» فوق سفانيتي، وموطن دالي إلهة الصيد كما اعتقد السفانيون.
  body: >-
    **لا حاجة بأوشبا إلى أن يكون الأعلى: قرنان من الغرانيت، 4710 و4690 متراً، وصيت لا يدانيه جار أعلى
    منه.**


    ليس الجبل حتى بين أعلى عشر قمم في القوقاز، ومع ذلك يعدّه كثير من المتسلّقين أصعبها في السلسلة، ويعدّه
    كثير من المسافرين أجملها؛ ومن هنا لقبه «ماترهورن القوقاز». يقع على بعد نحو 10 كم شمال غربي ميستيا،
    وتمرّ الحدود الروسية إلى الشمال منه مباشرة. يتكوّن من الغرانيت والشِّست البلوري العائدين إلى حقب الحياة
    القديمة (الباليوزوي)، وتنساب على سفوحه جليديتا أوشبا وغولي.


    كان للسفانيين تفسيرهم الخاص لتقلّب مزاجه: فبحسب التقاليد كان أوشبا موطن دالي، إلهة الصيد ذات الشعر
    الذهبي. وما زال الجبل يتصرّف كمضيف متقلّب الأهواء، يصنع طقسه بنفسه ويخفي قرنيه في الغيوم أياماً متتالية.


    وتاريخ تسلّقه درس في الصبر. حاولت البعثة الإنجليزية بقيادة دوغلاس فريشفيلد عام 1868 ثم تراجعت. وفي
    1888 بلغ جون غارفورث كوكين وأولريش ألمر القمة الشمالية في محاولتهما الرابعة عبر جليدية غولي. أما القمة
    الجنوبية فصمدت حتى 1903، حين بلغتها بعثة ألمانية سويسرية نمساوية بقيادة فيلي ريكمر ريكمرز. وفي 1934
    وصل أول فريق جورجي إلى القمة، وصارت ألكسندرا جاباريدزه أول امرأة تقف على أوشبا. وبعد ثلاث سنوات شقّ
    متسلّقون سفانيون، هم غابرييل وبيكنو وبيساريون خيرغياني ومعهم تشيتشيكو تشارتولاني وماكسيمه غفارلياني،
    طريقهم في الجدار الجنوبي المهيب.


    لا تحتاج إلى حبل لتشعر بهذا كله. فمن صليب ميستيا، ومن مازيري في وادي بيتشو، ومن سلسلة هاتسفالي وزورولدي،
    أو على مرآة بحيرات كورولدي، يظلّ القرنان يشدّان بصرك. وعند الفجر يلامس أول الضوء قمّتيه وحدهما، فيما
    يبقى الوادي كله في الأسفل غارقاً في الظل.
  tip: >-
    يقضي أوشبا معظم وقته في الغيوم، فكن عند نقطة المشاهدة باكراً واحتفظ بيوم احتياطي في ميستيا. يُظهر
    المنظار أو العدسة الطويلة الجليد على القرنين. أما القمة نفسها فللمتسلّقين المتمرّسين وحدهم: فالمسارات
    الجورجية إلى القمة الجنوبية مصنّفة ED، والمسار المعتاد إلى القمة الشمالية يصعد من الجانب الروسي، أي
    أنه يقتضي تقنياً عبور الحدود. يعمل تلفريك هاتسفالي من ميستيا في الشتاء أيضاً، فترى أوشبا المكسوّ بالثلج
    من المنحدر مباشرة. تبلغ نقطة مشاهدة صليب ميستيا سيراً في 3–4 ساعات، أو بسيارة دفع رباعي.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي، ثم اصعد طريق
    مضيق إنغوري مروراً بجفاري وخايشي حتى ميستيا: نحو 465 كم، فاحسب ثماني ساعات ونصفاً. الطريق معبّد بالكامل،
    لكنه بعد زوغديدي جبلي كثير المنعطفات، وتتساقط عليه الصخور بعد المطر. تكفي سيارة اقتصادية للوصول إلى
    ميستيا وتلفريك هاتسفالي؛ أما الدروب إلى نقطة مشاهدة الصليب وما بعد مازيري فترابية، ولذلك تكون السيارة
    الرياضية متعددة الاستخدامات الخيار الأفضل. الوقود في زوغديدي وميستيا. في الشتاء ركّب إطارات شتوية
    أو احمل سلاسل.
