ka:
  name: ანაკლიის ციხე-სიმაგრე
  short: >-
    ოთხკოშკიანი ციხე ენგურის შესართავთან — ბრინჯაოს ხანის ნასახლარზე აღმართული ოსმალური ფორპოსტი — ოკუპაციის
    ხაზი დღესაც ახლოს გადის.
  body: >-
    **იქ, სადაც ენგური შავ ზღვას ერთვის, ნაპირის ამ პატარა მონაკვეთს ბრინჯაოს ხანის კოლხებიც ახსოვს, ოსმალო
    მონათვაჭრეებიც, იმერელი მეომრებიც და — სულ ახლახან, 2007 წლამდე — რუსი სამშვიდობოებიც.**


    ანაკლიის უძველესი დასახლება შუა ბრინჯაოს ხანისაა და კოლხური კულტურის ტიპურ სახეს ატარებს. მას კლასიკური
    ხანის კოლხეთის ჰერაკლეასთან აიგივებენ, XVII საუკუნის ევროპელი მოგზაურები, არქანჯელო ლამბერტი და ჟან
    შარდენი, კი ანარგიად მოიხსენიებენ. პირველი სიმაგრე აქ ხის მორებით ნაგები ზღუდე ყოფილა.


    1723 წელს ანაკლია ოსმალეთმა დაიპყრო და საზღვაო ფორპოსტად და მონებით ვაჭრობის ადგილად აქცია. ადგილობრივი
    წყაროს თანახმად, 1730 წელს ქართველებმა ოსმალთა ხელში მყოფი ციხე გადაწვეს, ოსმალებმა კი ხელახლა ააშენეს
    — ჰოფადან ჩამოტანილი ქვითა და დანგრეული რუხის ციხის მასალით. 1770 წელს, როცა ოსმალეთი რუსეთს ებრძოდა,
    იმერეთის სამეფომ ანაკლია დაიბრუნა; XIX საუკუნის შუა წლებში აქ პატარა, მაგრამ მტკიცედ გამაგრებული ნავსადგური
    იდგა საბაჟოთი. ზოგი წყარო ციხეს XVII საუკუნით ათარიღებს, თუმცა რასაც დღეს ხედავთ, უპირატესად ოსმალური
    ხანის, 1730 წლის შემდეგ აღდგენილი ნაგებობაა.


    ქართული საბჭოთა ენციკლოპედიის თანახმად, ციხის მშენებელს ნიმუშად, როგორც ჩანს, იმავე პერიოდის ქართლ-კახური
    ციხეები აუღია: ოთხკუთხა გეგმა, თითო კოშკი ყოველ კუთხეში, თუმცა ჩრდილო-დასავლეთის კოშკი მდინარეს წაულეკავს.
    კედელი ორიარუსიანია — ქვედა იარუსი ყრუა, ზედაში სათოფურებია დატანებული. სამხრეთ-დასავლეთ კოშკის გარე
    კედელში ზარბაზნის ამბრაზურები შემორჩა — სწორედ ისინი მოძებნეთ.


    2006 წელს საქართველოს თავდაცვის სამინისტრომ ციხეში განლაგებულ რუს სამშვიდობოებს ნაგებობის დაზიანება
    დასდო ბრალად; რუსული საგუშაგო 2007 წლის ივლისში გაიყვანეს. ოკუპირებული აფხაზეთის გამყოფი ხაზი დღესაც
    ახლოს გადის, და ძველი კითხვა — ვის უჭირავს ენგურის შესართავი — აქ ჯერაც არ მოხსნილა.
  tip: >-
    ციხე ღია ცის ქვეშაა, შესვლა უფასოა, განსაზღვრული საათები არ აქვს; ნახევარი საათი სავსებით საკმარისია.
    კედლებზე ნუ აცოცდებით. ანაკლია ოკუპირებული აფხაზეთის ადმინისტრაციულ გამყოფ ხაზთან ახლოსაა: განმუხურის
    იქით, ხაზის მიმართულებით ნუ იხეტიალებთ, დრონს ნუ აფრენთ და პოლიციის მითითებებს დაემორჩილეთ. ციხე ზღვაზე
    ბანაობასა და სანაპიროზე სეირნობას შეუთავსეთ — ანაკლიას განმუხურთან 552-მეტრიანი ხიდი აკავშირებს. საუკეთესო
    სინათლე დილით და მზის ჩასვლისასაა; ზაფხულის შუადღით ქვა ცხელდება, ზამთარში კი კურორტი თითქმის ცარიელია.
  route: >-
    თბილისიდან ციხემდე დაახლოებით 328 კილომეტრი და ხუთი საათია. ს1 (E60) მაგისტრალით დასავლეთით, ქუთაისის,
    სამტრედიისა და სენაკის გავლით, ზუგდიდამდე იარეთ; იქ შ8-ზე გადაუხვიეთ ზღვისკენ — ბოლო ოცდახუთიოდე კილომეტრი
    სამეგრელოს ვაკეზე, სოფლებსა და მინდვრებს შორის გადის. ციხე კურორტის ტერიტორიაზეა, ენგურთან ახლოს;
    მანქანა სანაპიროს ახლოს დატოვეთ და ფეხით მიდით. მთელი გზა ასფალტია, ეკონომ-კლასის მანქანა საკმარისია;
    საწვავი ზუგდიდში ჩაასხით.
en:
  name: Anaklia Fortress
  short: >-
    A four-towered fort where the Enguri meets the Black Sea — an Ottoman outpost on Bronze Age ground,
    with the occupation line still close by.
  body: >-
    **Where the Enguri meets the Black Sea, this small stretch of shore has known Bronze Age Colchians,
    Ottoman slave traders, Imeretian soldiers and — until as recently as 2007 — Russian peacekeepers.**


    Anaklia's earliest settlement dates to the middle Bronze Age and is typical of Colchian culture. It
    is identified with Classical Heraclea of Colchis, and the 17th-century European travellers Arcangelo
    Lamberti and Jean Chardin knew it as Anarghia. The first defence here was reportedly a rampart of
    timber logs.


    In 1723 the Ottomans took Anaklia and made it a maritime outpost and a slave market. According to
    a local source, in 1730 Georgians burned the Ottoman-held fort; the Ottomans rebuilt it with stone
    shipped from Hopa and material taken from the ruined Rukhi fortress. In 1770, with the Ottomans at
    war with Russia, the Kingdom of Imereti won Anaklia back, and by the 1850s it was a small but strongly
    fortified port with its own customs house. Some sources call the fortress 17th-century; what stands
    today is best read as the Ottoman-era fort rebuilt after 1730.


    According to the Georgian Soviet Encyclopedia, its builder seems to have taken the east Georgian castles
    of the period as his model: a square plan with a tower at each corner, though the north-western tower
    has since been washed away by the river. The wall has two tiers — the lower blind, the upper pierced
    for small-arms fire — and cannon ports survive in the outer wall of the south-west tower. Look for
    them.


    In 2006 Georgia's Ministry of Defence accused the Russian peacekeepers based in the fortress of damaging
    it; their post was withdrawn in July 2007. The boundary line with occupied Abkhazia still runs close
    by, and the old question of who holds the mouth of the Enguri has not quite gone away.
  tip: >-
    The fortress is open-air, free and has no set hours; half an hour is plenty. Do not climb on the walls.
    Anaklia is close to the administrative boundary line with occupied Abkhazia: do not wander beyond
    Ganmukhuri towards it, do not fly drones, and follow any police instructions. Pair the visit with
    a swim and a walk along the shore — a 552-metre bridge links Anaklia with Ganmukhuri. The best light
    is early morning and sunset; at summer midday the stone bakes, and in winter the resort is almost
    empty.
  route: >-
    The fortress is about 328 km and five hours from Tbilisi. Take the S1 (E60) west past Kutaisi, Samtredia
    and Senaki to Zugdidi, then turn onto the Sh8 for the coast — the last 25 km or so run across the
    flat Samegrelo plain between villages and fields. The fortress stands within the resort, near the
    Enguri; leave the car near the beachfront and walk. Asphalt throughout, so an economy car is fine;
    fill up in Zugdidi.
ru:
  name: Крепость Анаклия
  short: >-
    Четырёхбашенный форт там, где Ингури впадает в Чёрное море: османский форпост на земле бронзового
    века, а линия оккупации до сих пор совсем рядом.
  body: >-
    **Там, где Ингури впадает в Чёрное море, этот клочок берега повидал колхов бронзового века, османских
    работорговцев, имеретинских солдат и — ещё в 2007 году — российских миротворцев.**


    Древнейшее поселение Анаклии относится к среднему бронзовому веку и типично для колхской культуры.
    Его отождествляют с античной Гераклеей Колхидской, а европейские путешественники XVII века Арканджело
    Ламберти и Жан Шарден знали это место как Анаргию. Первым укреплением здесь, по имеющимся сведениям,
    был вал из брёвен.


    В 1723 году Анаклию взяли османы и превратили её в морской форпост и невольничий рынок. По данным
    одного местного источника, в 1730 году грузины сожгли занятую османами крепость; османы отстроили
    её из камня, привезённого морем из Хопы, и материала разрушенной крепости Рухи. В 1770 году, когда
    Османская империя воевала с Россией, Имеретинское царство вернуло Анаклию, а к 1850-м годам это был
    небольшой, но хорошо укреплённый порт со своей таможней. Некоторые источники называют крепость постройкой
    XVII века; то, что стоит сегодня, вернее считать османским фортом, отстроенным после 1730 года.


    Согласно Грузинской советской энциклопедии, строитель, по-видимому, взял за образец восточногрузинские
    замки той эпохи: квадратный план с башней на каждом углу, хотя северо-западную башню с тех пор смыла
    река. Стена двухъярусная — нижний ярус глухой, верхний прорезан бойницами для ружейного огня, — а
    во внешней стене юго-западной башни сохранились пушечные амбразуры. Поищите их.


    В 2006 году Министерство обороны Грузии обвинило российских миротворцев, стоявших в крепости, в её
    повреждении; их пост вывели в июле 2007 года. Линия разграничения с оккупированной Абхазией по-прежнему
    проходит рядом, и старый вопрос о том, кто владеет устьем Ингури, так до конца и не закрыт.
  tip: >-
    Крепость под открытым небом, вход свободный, установленных часов нет; получаса хватит с лихвой. Не
    забирайтесь на стены. Анаклия находится рядом с административной разделительной линией с оккупированной
    Абхазией: не уходите за Ганмухури в её сторону, не запускайте дроны и выполняйте указания полиции.
    Совместите визит с купанием и прогулкой вдоль берега — Анаклию с Ганмухури связывает мост длиной 552
    метра. Лучший свет — ранним утром и на закате; летним полднем камень раскаляется, а зимой курорт почти
    пуст.
  route: >-
    До крепости от Тбилиси около 328 км и 5 часов пути. Поезжайте по S1 (E60) на запад мимо Кутаиси, Самтредиа
    и Сенаки до Зугдиди, затем сверните на Sh8 к побережью — последние 25 км или около того идут по плоской
    Самегрельской равнине между сёлами и полями. Крепость стоит в черте курорта, у Ингури; оставьте машину
    у набережной и пройдитесь пешком. Асфальт на всём пути, так что подойдёт машина эконом-класса; заправьтесь
    в Зугдиди.
fa:
  name: دژ آناکلیا
  short: >-
    دژی چهاربرجه در جایی که انگوری به دریای سیاه می‌ریزد — پاسگاهی عثمانی بر خاکی از عصر مفرغ، و خط اشغال
    هنوز در همان نزدیکی.
  body: >-
    **آنجا که انگوری به دریای سیاه می‌پیوندد، این تکهٔ کوچک ساحل کلخیان عصر مفرغ، برده‌فروشان عثمانی،
    سربازان ایمرتی و — تا همین سال ۲۰۰۷ — نیروهای حافظ صلح روسیه را به خود دیده است.**


    کهن‌ترین سکونتگاه آناکلیا به عصر مفرغ میانه بازمی‌گردد و نمونه‌ای از فرهنگ کلخیسی است. آن را با هراکلیای
    کلخیسِ دوران کلاسیک یکی می‌دانند، و جهانگردان اروپایی سدهٔ هفدهم، آرکانجلو لامبرتی و ژان شاردن، آن
    را با نام آنارگیا می‌شناختند. گفته می‌شود نخستین استحکامات اینجا بارویی از کنده‌های چوبی بوده است.


    در ۱۷۲۳ عثمانی‌ها آناکلیا را گرفتند و آن را به پاسگاه دریایی و بازار برده بدل کردند. به گفتهٔ یک منبع
    محلی، در ۱۷۳۰ گرجی‌ها دژ در دست عثمانی را به آتش کشیدند؛ عثمانی‌ها آن را با سنگی که از هوپا با کشتی
    آورده بودند و مصالحی از دژ ویران روخی از نو ساختند. در ۱۷۷۰، هنگامی که عثمانی با روسیه در جنگ بود،
    پادشاهی ایمرتی آناکلیا را پس گرفت، و تا دههٔ ۱۸۵۰ اینجا بندری کوچک اما سخت استوار با گمرکخانهٔ خود
    بود. برخی منابع دژ را از سدهٔ هفدهم می‌دانند؛ آنچه امروز برپاست را بهتر است دژ دوران عثمانی بدانیم
    که پس از ۱۷۳۰ بازسازی شد.


    به گفتهٔ دانشنامهٔ شوروی گرجستان، سازندهٔ دژ ظاهراً قلعه‌های شرق گرجستانِ همان روزگار را الگو گرفته
    است: نقشه‌ای چهارگوش با برجی در هر گوشه، هرچند برج شمال غربی را رود با خود برده است. دیوار دو طبقه
    دارد — طبقهٔ پایین بی‌روزن و طبقهٔ بالا با مزغل‌هایی برای شلیک با جنگ‌افزارهای سبک — و در دیوار بیرونی
    برج جنوب غربی، روزنه‌های توپ هنوز بر جای مانده‌اند. آن‌ها را پیدا کنید.


    در ۲۰۰۶ وزارت دفاع گرجستان نیروهای حافظ صلح روسیه را که در دژ مستقر بودند به آسیب زدن به آن متهم کرد؛
    پاسگاهشان در ژوئیهٔ ۲۰۰۷ برچیده شد. خط جداسازی با آبخازیای اشغالی هنوز از همین نزدیکی می‌گذرد، و این
    پرسش کهنه که دهانهٔ انگوری در دست کیست، هنوز یکسره کنار نرفته است.
  tip: >-
    دژ روباز و رایگان است و ساعت کار مشخصی ندارد؛ نیم ساعت کاملاً بس است. از دیوارها بالا نروید. آناکلیا
    نزدیک خط اداری جداسازی با آبخازیای اشغالی است: از گانموخوری به آن سو نروید، پهپاد پرواز ندهید و از
    هر دستور پلیس پیروی کنید. بازدید را با شنا و قدم زدن در کنارهٔ دریا همراه کنید — پلی به طول ۵۵۲ متر
    آناکلیا را به گانموخوری پیوند می‌دهد. بهترین نور صبح زود و هنگام غروب است؛ در نیمروز تابستان سنگ داغ
    می‌شود و در زمستان استراحتگاه تقریباً خالی است.
  route: >-
    دژ حدود ۳۲۸ کیلومتر و ۵ ساعت از تفلیس فاصله دارد. از S1 (E60) رو به غرب، از کنار کوتائیسی، سامتردیا
    و سناکی تا زوگدیدی بروید، سپس به Sh8 به سوی ساحل بپیچید — حدود ۲۵ کیلومتر پایانی از میان دشت هموار
    سامگرلو، میان روستاها و کشتزارها می‌گذرد. دژ درون محدودهٔ استراحتگاه و نزدیک انگوری است؛ خودرو را
    نزدیک ساحل بگذارید و پیاده بروید. سراسر راه آسفالت است، پس خودروی کلاس اقتصادی کافی است؛ در زوگدیدی
    باک را پر کنید.
he:
  name: מבצר אנאקליה
  short: >-
    מבצר בעל ארבעה מגדלים במקום שבו האנגורי נשפך לים השחור — מוצב עות'מאני על קרקע מתקופת הברונזה, וקו
    הכיבוש עדיין קרוב.
  body: >-
    **במקום שבו האנגורי פוגש את הים השחור, רצועת החוף הקטנה הזאת ראתה קולכים מתקופת הברונזה, סוחרי עבדים
    עות'מאנים, חיילים אימרתיים, ועד 2007 ממש — כוחות שמירת שלום רוסיים.**


    היישוב הקדום ביותר באנאקליה מתוארך לתקופת הברונזה התיכונה ואופייני לתרבות הקולכית. מזהים אותו עם הרקלאה
    של קולכיס מן העת הקלאסית, והנוסעים האירופים בני המאה ה-17 ארקנג'לו למברטי וז'אן שרדן הכירו אותו בשם
    אנארגיה. הביצור הראשון כאן היה, לפי הדיווחים, סוללה של בולי עץ.


    ב-1723 כבשו העות'מאנים את אנאקליה והפכו אותה למוצב ימי ולשוק עבדים. לפי מקור מקומי, ב-1730 שרפו הגאורגים
    את המבצר שהחזיקו העות'מאנים; העות'מאנים בנו אותו מחדש באבן שהובאה בספינות מהופה ובחומרים שנלקחו ממבצר
    רוחי ההרוס. ב-1770, כשהעות'מאנים היו במלחמה עם רוסיה, השיבה ממלכת אימרתי את אנאקליה לידיה, ועד שנות
    ה-50 של המאה ה-19 הייתה זו עיר נמל קטנה אך מבוצרת היטב, עם בית מכס משלה. יש מקורות המתארכים את המבצר
    למאה ה-17; את מה שעומד כאן היום נכון יותר לראות כמבצר מהתקופה העות'מאנית שנבנה מחדש אחרי 1730.


    לפי האנציקלופדיה הסובייטית הגאורגית, בונה המבצר נטל ככל הנראה כדגם את טירות מזרח גאורגיה בנות התקופה:
    תוכנית מרובעת ובכל פינה מגדל, אף שהמגדל הצפון-מערבי נסחף מאז בידי הנהר. לחומה שני מפלסים — התחתון
    אטום, והעליון מנוקב בחרכי ירי לנשק קל — ובקיר החיצוני של המגדל הדרום-מערבי שרדו פתחי תותחים. חפשו
    אותם.


    ב-2006 האשים משרד ההגנה של גאורגיה את כוחות שמירת השלום הרוסיים שהוצבו במבצר בגרימת נזק לו; המוצב
    שלהם פונה ביולי 2007. קו ההפרדה עם אבחזיה הכבושה עדיין עובר בסמוך, והשאלה הישנה מי מחזיק בשפך האנגורי
    עדיין לא נעלמה לגמרי.
  tip: >-
    המבצר נמצא באוויר הפתוח, הכניסה חופשית ואין לו שעות קבועות; חצי שעה מספיקה בהחלט. אל תטפסו על החומות.
    אנאקליה קרובה לקו ההפרדה המנהלי עם אבחזיה הכבושה: אל תתרחקו מעבר לגנמוחורי לכיוונו, אל תטיסו רחפנים,
    ומלאו כל הוראה של המשטרה. שלבו את הביקור ברחצה ובהליכה לאורך החוף — גשר באורך 552 מטר מחבר את אנאקליה
    עם גנמוחורי. האור הטוב ביותר הוא מוקדם בבוקר ובשקיעה; בצהרי הקיץ האבן לוהטת, ובחורף אתר הנופש כמעט
    ריק.
  route: >-
    המבצר נמצא כ-328 ק״מ וכחמש שעות מטביליסי. סעו בכביש S1 (E60) מערבה, על פני קוטאיסי, סמטרדיה וסנאקי,
    עד זוגדידי, ואז פנו לכביש Sh8 לכיוון החוף — כ-25 הקילומטרים האחרונים עוברים במישור סמגרלו השטוח, בין
    כפרים ושדות. המבצר עומד בתחום אתר הנופש, סמוך לאנגורי; השאירו את הרכב ליד טיילת החוף והמשיכו ברגל.
    אספלט לכל אורך הדרך, כך שרכב מקטגוריית אקונומי יספיק; תדלקו בזוגדידי.
ar:
  name: قلعة أناكليا
  short: >-
    حصن بأربعة أبراج حيث يلتقي إنغوري بالبحر الأسود — موقع عثماني متقدم على أرض من العصر البرونزي، وخط
    الاحتلال ما زال قريباً.
  body: >-
    **حيث يلتقي نهر إنغوري بالبحر الأسود، عرف هذا الشريط الصغير من الشاطئ كولخيين من العصر البرونزي، وتجار
    رقيق عثمانيين، وجنوداً إيميريتيين، و— حتى عام 2007 القريب — قوات حفظ سلام روسية.**


    يعود أقدم استيطان في أناكليا إلى العصر البرونزي الأوسط، وهو نموذجي للثقافة الكولخية. ويُطابَق بينه
    وبين هرقلية كولخيس الكلاسيكية، وعرفه الرحالة الأوروبيان في القرن السابع عشر أركانجيلو لامبرتي وجان
    شاردان باسم أنارغيا. وتفيد الروايات بأن أول تحصين هنا كان متراساً من جذوع الخشب.


    في عام 1723 استولى العثمانيون على أناكليا وجعلوها موقعاً بحرياً متقدماً وسوقاً للرقيق. وبحسب مصدر
    محلي، أحرق الجورجيون الحصن الذي كان في يد العثمانيين عام 1730؛ فأعاد العثمانيون بناءه بحجارة نُقلت
    بحراً من هوبا وبمواد أُخذت من قلعة روخي المتهدمة. وفي عام 1770، بينما كان العثمانيون في حرب مع روسيا،
    استعادت مملكة إيميريتي أناكليا، وبحلول خمسينيات القرن التاسع عشر كانت ميناءً صغيراً لكنه شديد التحصين
    له دار جمارك خاصة به. تنسب بعض المصادر القلعة إلى القرن السابع عشر؛ لكن الأصوب أن يُقرأ القائم اليوم
    على أنه الحصن العثماني الذي أُعيد بناؤه بعد 1730.


    وبحسب الموسوعة السوفييتية الجورجية، يبدو أن بانيها اتخذ قلاع شرق جورجيا في تلك الحقبة نموذجاً: مخطط
    مربع وبرج في كل زاوية، وإن كان النهر قد جرف البرج الشمالي الغربي منذ ذلك الحين. وللجدار طبقتان — السفلى
    مصمتة، والعليا مثقوبة بمزاغل لنيران الأسلحة الخفيفة — وما زالت فتحات المدافع باقية في الجدار الخارجي
    للبرج الجنوبي الغربي. ابحث عنها.


    في عام 2006 اتهمت وزارة الدفاع الجورجية قوات حفظ السلام الروسية المتمركزة في القلعة بإلحاق الضرر بها؛
    وسُحب مركزها في يوليو 2007. وما زال خط التماس مع أبخازيا المحتلة يمر قريباً، والسؤال القديم عمّن يمسك
    بمصب إنغوري لم يُطوَ تماماً.
  tip: >-
    القلعة مكشوفة ومجانية وبلا مواعيد محددة؛ ونصف ساعة تكفي تماماً. لا تتسلق الجدران. تقع أناكليا قرب
    خط الفصل الإداري مع أبخازيا المحتلة: لا تتجول أبعد من غانموخوري باتجاهه، ولا تُطلق طائرات مسيّرة،
    والتزم بأي تعليمات من الشرطة. اجمع الزيارة مع السباحة والتمشي على الشاطئ — إذ يربط جسر طوله 552 متراً
    أناكليا بغانموخوري. أجمل الضوء في الصباح الباكر وعند الغروب؛ أما في ظهيرة الصيف فيتّقد الحجر، وفي
    الشتاء يكاد المنتجع يخلو.
  route: >-
    تبعد القلعة عن تبليسي نحو 328 كم ونحو 5 ساعات. اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي وسامترديا
    وسيناكي حتى زوغديدي، ثم انعطف إلى الطريق Sh8 نحو الساحل — وتمتد الكيلومترات الـ25 الأخيرة تقريباً
    عبر سهل سامغريلو المنبسط بين القرى والحقول. تقع القلعة داخل المنتجع قرب نهر إنغوري؛ اترك السيارة قرب
    الواجهة البحرية وامشِ. الطريق إسفلتي بالكامل، فتكفي سيارة من الفئة الاقتصادية؛ واملأ الخزان في زوغديدي.
