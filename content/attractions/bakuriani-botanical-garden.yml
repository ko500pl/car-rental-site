ka:
  name: ბაკურიანის ალპური ბოტანიკური ბაღი
  short: 1910 წელს დაარსებული მაღალმთიანი ბოტანიკური ბაღი ბაკურიანის კიდეზე, კავკასიის ალპური ფლორის კოლექციით.
  body: >-
    **ეს საქართველოს ყველაზე მაღლა მდებარე ბოტანიკური ბაღია** — დაახლოებით 1700 მეტრზე, ბაკურიანის ჩრდილო-დასავლეთ
    კიდეზე, ფიჭვნარსა და სათიბებს შორის. ის 1910 წელს დაარსდა თბილისის ბოტანიკური ბაღის მაღალმთიან განყოფილებად
    და დღემდე საკვლევი დაწესებულებაა: მისი ამოცანა ჯერ კიდევ საუკუნის წინ ალპური და სუბალპური მცენარეების
    შესწავლა და აკლიმატიზაცია იყო.


    ტერიტორია დაახლოებით ჩვიდმეტ ჰექტარს იკავებს და რამდენიმე ნაწილად იყოფა: კავკასიის ალპური მდელოს მცენარეების
    საჩვენებელი ნაკვეთები, კლდოვანი ბაღი, წიწვოვანთა არბორეტუმი ჩრდილოეთ ამერიკიდან და აღმოსავლეთ აზიიდან
    შემოტანილი სახეობებით, როდოდენდრონები და საცდელი ბაღები. ბაღის შუაგულში პატარა ხის შენობებია, სადაც
    ჯერ კიდევ საბჭოთა პერიოდის სამეცნიერო ინვენტარი ინახება.


    ყველაზე დამაჯერებლად წიწვოვანთა არბორეტუმი გამოიყურება. საუკუნის წინ ცდისთვის დარგული ხეები დღეს იმდენად
    მაღალია, რომ ბილიკებს ჩრდილავს, და მათ შორის სიარული ერთადერთი რამაა, რაც აქ გააზრებულ ხეივანს ჰგავს.
    ალპური ნაკვეთები კი პირიქით: ისინი მხოლოდ რამდენიმე კვირა ყვავის, დანარჩენ ზაფხულს კი ჩვეულებრივ მდელოდ
    იკითხება, თუ ეტიკეტებს არ დააკვირდი.


    საუკეთესო დროა ივნისის ბოლო და ივლისი, როცა ალპური ნაკვეთები ერთდროულად ყვავის; აგვისტოში უფრო მშრალია,
    სექტემბერში კი წიწვოვნების და არყის ფოთლების ფერი მუშაობს. ზამთარში ბაღი თოვლის ქვეშაა და დახურულია.


    გულწრფელად უნდა ითქვას, რაც არ არის: ეს არ არის მოვლილი საქალაქო პარკი. ბილიკები ხშირად უბრალოდ ბალახში
    გატკეპნილი კვალია, ეტიკეტები ნაწილობრივ დაკარგულია და ზოგიერთი ნაკვეთი მიტოვებულად გამოიყურება. ვინც
    ლანდშაფტურ დიზაინს ეძებს, იმედგაცრუებული დარჩება. ვისაც მცენარეები აინტერესებს, ან უბრალოდ ერთი მშვიდი
    საათი უნდა ბაკურიანის ხმაურიანი მთავარი ქუჩის შემდეგ, სწორ ადგილას მოვა — აქ ჩვეულებრივ თითქმის არავინაა
    და ტყის სუნი და ფუტკრების ხმა ერთადერთი ფონია.
  tip: >-
    ერთი საათი და ნახევარი სავსებით საკმარისია. ბაღი ბაკურიანის ცენტრიდან ფეხითაც მისაღწევია, დაახლოებით
    ოცი წუთის სავალზე. ბილიკები მიწისაა და წვიმის შემდეგ ლაფიანი — სპორტული ფეხსაცმელი ურჩევნია სანდლებს.
    წყალი და საჭმელი ადგილზე არ იყიდება, თან წაიღე. ტუალეტი მარტივია და ყოველთვის ღია არაა. მაისის დასაწყისში
    ზოგჯერ თოვლის ლაქები ჯერ კიდევ დევს ჩრდილოეთ ფერდობებზე. მზისგან თავშესაფარი ცოტაა, ქუდი გამოგადგება.
  route: >-
    ბაკურიანამდე თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომზე გავლით სერპანტინით — 185 კმ. ბაღი დასახლების
    ჩრდილო-დასავლეთ კიდეზეა, ცაღვერისა და წიხისჯვრის მიმართულებით მიმავალი გზიდან, დაახლოებით ორი კილომეტრი
    ცენტრიდან. სულ 187 კმ და თითქმის სამი საათი. ასფალტი ბოლომდე გრძელდება, ბოლო მონაკვეთი ვიწროა, მაგრამ
    გამავალი. მანქანა შესასვლელთან, გზისპირას რჩება. საწვავი ბორჯომში აიღე. ეკონომ-კლასის ავტომობილი სეზონზე
    სავსებით საკმარისია.
en:
  name: Bakuriani Alpine Botanical Garden
  short: >-
    A high-mountain botanical garden founded in 1910 on the edge of Bakuriani, holding a collection of
    Caucasian alpine flora.
  body: >-
    **This is the highest botanical garden in Georgia,** at around 1,700 metres on the north-western edge
    of Bakuriani, between pine forest and hay meadows. It was founded in 1910 as the high-mountain department
    of the Tbilisi Botanical Garden and it is still a working research station: its purpose a century
    ago was the study and acclimatisation of alpine and subalpine plants, and that has not changed.


    The grounds cover roughly seventeen hectares, divided into several parts: demonstration beds of Caucasian
    alpine meadow species, a rock garden, an arboretum of conifers introduced from North America and East
    Asia, rhododendron plantings and experimental plots. In the middle stand small wooden buildings that
    still hold Soviet-era scientific equipment.


    The conifer arboretum is the part that has aged best. Trees planted a century ago as experiments now
    stand tall enough to shade the paths, and walking between them is the nearest thing here to a designed
    avenue. The alpine beds work the other way round: they peak for a few weeks and for the rest of the
    summer read as ordinary meadow unless you stop and check the labels.


    Late June and July are the best weeks, when the alpine beds flower more or less at once. August is
    drier and quieter; by September the colour comes from the conifers and the birches instead. In winter
    the garden lies under snow and is closed.


    It is worth being clear about what this is not. It is not a manicured municipal park. Many paths are
    simply tracks worn through grass, a good share of the labels have gone missing, and some plots look
    frankly abandoned. Anyone hoping for landscape design will be disappointed. Anyone who is interested
    in plants, or who simply wants a quiet hour after the noise of Bakuriani's main street, has come to
    the right place: there is usually almost nobody here, and the smell of resin and the sound of bees
    are the only background.
  tip: >-
    An hour and a half covers it comfortably. You can walk up from the centre of Bakuriani in about twenty
    minutes rather than driving. The paths are earth and turn muddy after rain, so trainers beat sandals.
    Nothing is sold on site, so bring water and something to eat. The toilet is basic and not always open.
    In early May patches of snow can still be lying on the north-facing slopes. There is little shade
    on the open beds, so a hat helps.
  route: >-
    Drive to Bakuriani from Tbilisi on the E60 to Khashuri, then south through Borjomi and up the switchbacks,
    185 km in all. The garden sits on the north-western edge of the village, off the road that continues
    towards Tsagveri and Tsikhisjvari, about two kilometres from the centre. The total is 187 km and close
    to three hours. Asphalt runs all the way; the last stretch is narrow but passable. Cars are left on
    the verge by the entrance. Refuel in Borjomi. An economy car is entirely sufficient in season.
ru:
  name: Бакурианский альпийский ботанический сад
  short: >-
    Высокогорный ботанический сад, основанный в 1910 году на краю Бакуриани, с коллекцией альпийской флоры
    Кавказа.
  body: >-
    **Это самый высокогорный ботанический сад Грузии** — около 1700 метров, на северо-западной окраине
    Бакуриани, между сосновым лесом и сенокосами. Он был основан в 1910 году как высокогорное отделение
    Тбилисского ботанического сада и до сих пор остаётся научной станцией: сто лет назад его задачей были
    изучение и акклиматизация альпийских и субальпийских растений, и с тех пор это не изменилось.


    Территория занимает примерно семнадцать гектаров и делится на несколько частей: демонстрационные делянки
    альпийского разнотравья Кавказа, каменистый сад, арборетум хвойных, привезённых из Северной Америки
    и Восточной Азии, посадки рододендронов и опытные участки. В середине стоят небольшие деревянные корпуса,
    где до сих пор хранится научное оборудование советского времени.


    Убедительнее всего выглядит арборетум хвойных. Деревья, посаженные сто лет назад ради опыта, сегодня
    достаточно высоки, чтобы затенять дорожки, и прогулка между ними — единственное, что здесь напоминает
    продуманную аллею. Альпийские делянки устроены наоборот: они цветут несколько недель, а остальное
    лето читаются как обычный луг, если не остановиться и не прочитать таблички.


    Лучшее время — конец июня и июль, когда альпийские делянки зацветают почти одновременно. Август суше
    и тише, а в сентябре цвет дают уже хвойные и берёзы. Зимой сад лежит под снегом и закрыт.


    Стоит честно сказать, чем это место не является. Это не ухоженный городской парк. Многие дорожки —
    просто тропы, вытоптанные в траве, изрядная часть табличек утрачена, а некоторые делянки выглядят
    откровенно заброшенными. Тот, кто ждёт ландшафтного дизайна, будет разочарован. А тому, кто интересуется
    растениями или просто хочет тихий час после шума главной улицы Бакуриани, здесь хорошо: обычно вокруг
    почти никого, и единственный фон — запах смолы и гудение пчёл.
  tip: >-
    Полутора часов вполне достаточно. От центра Бакуриани сюда можно дойти пешком примерно за двадцать
    минут, машина не обязательна. Дорожки земляные и после дождя раскисают, так что кроссовки удобнее
    сандалий. На месте ничего не продают — берите воду и еду с собой. Туалет простой и открыт не всегда.
    В начале мая на северных склонах ещё лежат пятна снега. Тени на открытых делянках мало, пригодится
    головной убор.
  route: >-
    До Бакуриани из Тбилиси по трассе E60 до Хашури, затем через Боржоми и вверх по серпантину, всего
    185 км. Сад находится на северо-западной окраине посёлка, у дороги, которая идёт дальше на Цагвери
    и Цихисджвари, примерно в двух километрах от центра. Итого 187 км и почти три часа. Асфальт до самого
    конца, последний участок узкий, но проезжий. Машину оставляют на обочине у входа. Заправиться лучше
    в Боржоми. В сезон достаточно машины эконом-класса.
fa:
  name: باغ گیاه‌شناسی آلپی باکوریانی
  short: باغ گیاه‌شناسی کوهستانی که در سال ۱۹۱۰ در حاشیهٔ باکوریانی بنیاد شد و مجموعه‌ای از گیاهان آلپی
    قفقاز دارد.
  body: >-
    **این بلندترین باغ گیاه‌شناسی گرجستان است،** در حدود ۱۷۰۰ متری و در لبهٔ شمال‌غربی باکوریانی، میان
    جنگل کاج و علفزارهای درو. در سال ۱۹۱۰ به‌عنوان بخش کوهستانی باغ گیاه‌شناسی تفلیس بنیاد نهاده شد و
    هنوز ایستگاهی پژوهشی است: هدفش یک قرن پیش مطالعه و سازگارسازی گیاهان آلپی و نیمه‌آلپی بود و همان مانده
    است.


    محوطه نزدیک هفده هکتار است و به چند بخش تقسیم می‌شود: کرت‌های نمایشی گیاهان چمنزار آلپی قفقاز، باغ
    سنگی، مجموعه‌ای از سوزنی‌برگان آورده از آمریکای شمالی و آسیای شرقی، کاشت رودودندرون و کرت‌های آزمایشی.
    در میانهٔ باغ ساختمان‌های چوبی کوچکی ایستاده‌اند که هنوز ابزار علمی دورهٔ شوروی را در خود دارند.


    قانع‌کننده‌ترین بخش، مجموعهٔ سوزنی‌برگان است. درختانی که یک قرن پیش برای آزمایش کاشته شدند اکنون آن‌قدر
    بلندند که بر مسیرها سایه بیندازند، و قدم زدن میان آنها تنها چیزی است که اینجا به خیابانی طراحی‌شده
    می‌ماند. کرت‌های آلپی برعکس‌اند: چند هفته اوج می‌گیرند و بقیهٔ تابستان مانند علفزاری معمولی خوانده
    می‌شوند، مگر بایستید و برچسب‌ها را بخوانید.


    بهترین هفته‌ها اواخر ژوئن و ژوئیه است، وقتی کرت‌های آلپی کمابیش هم‌زمان گل می‌دهند. اوت خشک‌تر و خلوت‌تر
    است و در سپتامبر رنگ از سوزنی‌برگان و توس‌ها می‌آید. زمستان باغ زیر برف است و بسته می‌ماند.


    خوب است روشن بگوییم اینجا چه نیست. پارک شهریِ آراسته نیست. بسیاری از مسیرها فقط رد پا در علف‌اند،
    بخش خوبی از برچسب‌ها گم شده و برخی کرت‌ها آشکارا رهاشده به نظر می‌رسند. هر کس دنبال طراحی منظر باشد
    ناامید می‌شود. اما کسی که به گیاهان علاقه دارد، یا فقط یک ساعت آرام پس از هیاهوی خیابان اصلی باکوریانی
    می‌خواهد، جای درستی آمده است: معمولاً تقریباً هیچ‌کس اینجا نیست و تنها پس‌زمینه بوی صمغ و صدای زنبورهاست.
  tip: >-
    یک ساعت و نیم به‌راحتی کافی است. می‌توانید از مرکز باکوریانی حدود بیست دقیقه پیاده بالا بیایید و اصلاً
    رانندگی نکنید. مسیرها خاکی‌اند و پس از باران گِلی می‌شوند، پس کفش ورزشی بهتر از صندل است. در محوطه
    چیزی فروخته نمی‌شود؛ آب و خوراکی همراه ببرید. سرویس بهداشتی ساده است و همیشه باز نیست. اوایل ماه مه
    هنوز لکه‌های برف روی دامنه‌های شمالی می‌ماند. سایه در کرت‌های باز کم است و کلاه به کار می‌آید.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری و سپس از راه بورجومی و پیچ‌های کوهستانی تا باکوریانی، در مجموع ۱۸۵
    کیلومتر. باغ در لبهٔ شمال‌غربی آبادی است، کنار جاده‌ای که به سوی تساگوری و تسیخیسجواری ادامه می‌یابد،
    حدود دو کیلومتر از مرکز. جمعاً ۱۸۷ کیلومتر و نزدیک سه ساعت. آسفالت تا انتها ادامه دارد و بخش پایانی
    باریک اما قابل عبور است. خودرو کنار جاده نزدیک ورودی می‌ماند. سوخت را در بورجومی بگیرید. خودروی اقتصادی
    در فصل کافی است.
he:
  name: הגן הבוטני האלפיני בבקוריאני
  short: גן בוטני הררי שנוסד ב-1910 בשולי בקוריאני, ובו אוסף של צמחיית ההרים הגבוהים של הקווקז.
  body: >-
    **זהו הגן הבוטני הגבוה ביותר בגאורגיה,** בגובה של כ-1,700 מטר בקצה הצפון-מערבי של בקוריאני, בין יער
    אורנים לשדות מספוא. הוא נוסד ב-1910 כמחלקת ההרים הגבוהים של הגן הבוטני של טביליסי, ועד היום הוא תחנת
    מחקר פעילה: ייעודו לפני מאה שנה היה חקר צמחים אלפיניים ותת-אלפיניים והתאקלמותם, וזה לא השתנה.


    השטח משתרע על כשבעה עשר הקטרים ומחולק לכמה חלקים: ערוגות הדגמה של צמחי אחו אלפיני קווקזיים, גן סלעים,
    ארבורטום של מחטניים שהובאו מצפון אמריקה וממזרח אסיה, מטעי רודודנדרון וחלקות ניסוי. במרכז עומדים מבני
    עץ קטנים שבהם עדיין שמור ציוד מדעי מן התקופה הסובייטית.


    החלק שהזדקן בצורה המשכנעת ביותר הוא ארבורטום המחטניים. עצים שניטעו לפני מאה שנה כניסוי גבוהים היום
    דיים כדי להצל על השבילים, וההליכה ביניהם היא הדבר הקרוב ביותר כאן לשדרה מתוכננת. ערוגות ההרים פועלות
    הפוך: הן בשיאן כמה שבועות בלבד, ובשאר הקיץ הן נקראות כאחו רגיל אלא אם עוצרים וקוראים את השלטים.


    סוף יוני ויולי הם השבועות הטובים ביותר, כשערוגות ההרים פורחות פחות או יותר בבת אחת. אוגוסט יבש ושקט
    יותר, ובספטמבר הצבע מגיע כבר מן המחטניים ומעצי הליבנה. בחורף הגן שוכב תחת שלג וסגור.


    כדאי לומר בבירור מה המקום הזה איננו. הוא איננו פארק עירוני מטופח. שבילים רבים הם פשוט עקבות שנשחקו
    בעשב, חלק ניכר מן השלטים אבד, וכמה חלקות נראות נטושות ממש. מי שמצפה לעיצוב נוף יתאכזב. אבל מי שמתעניין
    בצמחים, או פשוט רוצה שעה שקטה אחרי הרעש של הרחוב הראשי בבקוריאני, הגיע למקום הנכון: בדרך כלל אין כאן
    כמעט איש, וריח השרף וזמזום הדבורים הם הרקע היחיד.
  tip: >-
    שעה וחצי מספיקה בנוחות. אפשר לעלות ברגל ממרכז בקוריאני בכעשרים דקות במקום לנסוע. השבילים עפריים ונעשים
    בוציים אחרי גשם, ולכן נעלי ספורט עדיפות על סנדלים. באתר לא נמכר דבר, אז הביאו מים ומשהו לאכול. השירותים
    בסיסיים ולא תמיד פתוחים. בתחילת מאי עדיין נותרים כתמי שלג במדרונות הפונים צפונה. בערוגות הפתוחות כמעט
    אין צל, וכובע עוזר.
  route: >-
    סעו לבקוריאני מטביליסי בכביש E60 עד חשורי, ומשם דרומה דרך בורג'ומי ובסרפנטינות במעלה ההר, 185 ק״מ
    בסך הכול. הגן נמצא בקצה הצפון-מערבי של הכפר, בצד הדרך הממשיכה לעבר צגברי וציחיסג'ורי, כשני קילומטרים
    מן המרכז. בסך הכול 187 ק״מ וקרוב לשלוש שעות. הכביש סלול עד הסוף, והקטע האחרון צר אך עביר. את הרכב
    משאירים בשולי הדרך ליד הכניסה. תדלקו בבורג'ומי. בעונה רכב חסכוני מספיק לחלוטין.
ar:
  name: حديقة باكورياني النباتية الجبلية
  short: حديقة نباتية جبلية أُسست عام 1910 على أطراف باكورياني، وتضم مجموعة من نباتات مروج القوقاز العليا.
  body: >-
    **هذه أعلى حديقة نباتية في جورجيا،** على نحو 1700 متر عند الطرف الشمالي الغربي لباكورياني، بين غابة
    الصنوبر ومروج الحشيش. أُسست عام 1910 قسماً جبلياً تابعاً لحديقة تبليسي النباتية، وما زالت حتى اليوم
    محطة بحث عاملة: كان هدفها قبل قرن دراسة نباتات المرتفعات وأقلمتها، ولم يتغير ذلك.


    تمتد الأرض على نحو سبعة عشر هكتاراً وتنقسم إلى أقسام عدة: أحواض عرض لنباتات مروج القوقاز العليا، وحديقة
    صخرية، ومجموعة من الصنوبريات المجلوبة من أمريكا الشمالية وشرق آسيا، ومزروعات الرودودندرون، وقطع تجريبية.
    وفي الوسط مبانٍ خشبية صغيرة ما زالت تحفظ أجهزة علمية من العهد السوفييتي.


    أكثر أقسام الحديقة إقناعاً هو مجموعة الصنوبريات. فالأشجار التي غُرست قبل قرن على سبيل التجربة صارت
    اليوم من العلو بحيث تظلل الممرات، والمشي بينها أقرب ما هنا إلى جادة مصممة. أما أحواض المرتفعات فعلى
    العكس: تبلغ ذروتها أسابيع قليلة، وتُقرأ بقية الصيف كمرج عادي ما لم تقف وتقرأ اللافتات.


    أفضل الأسابيع أواخر يونيو ويوليو، حين تزهر أحواض المرتفعات كلها تقريباً في وقت واحد. وأغسطس أكثر جفافاً
    وهدوءاً، وفي سبتمبر يأتي اللون من الصنوبريات وأشجار البتولا. أما في الشتاء فالحديقة تحت الثلج ومغلقة.


    ويجدر أن نقول بوضوح ما ليست عليه هذه الحديقة. إنها ليست متنزهاً بلدياً مشذباً. كثير من الممرات مجرد
    آثار أقدام في العشب، وضاع قسم غير قليل من اللافتات، وبعض القطع تبدو مهجورة فعلاً. ومن يتوقع تصميماً
    للمناظر سيخيب ظنه. أما من يهتم بالنبات، أو يريد ساعة هادئة بعد ضجيج الشارع الرئيسي في باكورياني، فقد
    جاء إلى المكان الصحيح: لا أحد هنا غالباً، ورائحة الصمغ وطنين النحل هما الخلفية الوحيدة.
  tip: >-
    ساعة ونصف تكفي براحة. ويمكن الصعود سيراً من وسط باكورياني في نحو عشرين دقيقة بدلاً من القيادة. الممرات
    ترابية وتصير موحلة بعد المطر، فالحذاء الرياضي أفضل من الصندل. ولا يُباع شيء في الموقع، فاحمل الماء
    وشيئاً للأكل. دورة المياه بسيطة وليست مفتوحة دائماً. وفي أوائل مايو تبقى بقع ثلج على المنحدرات الشمالية.
    والظل قليل فوق الأحواض المكشوفة، والقبعة تفيد.
  route: >-
    اقصد باكورياني من تبليسي على الطريق E60 حتى خاشوري، ثم جنوباً عبر بورجومي وصعوداً في المنعطفات، 185
    كم إجمالاً. تقع الحديقة على الطرف الشمالي الغربي للقرية، قرب الطريق المتجه إلى تساغفيري وتسيخيسجفاري،
    على نحو كيلومترين من المركز. المجموع 187 كم ونحو ثلاث ساعات. الإسفلت مستمر حتى النهاية والمقطع الأخير
    ضيق لكنه سالك. وتُترك السيارات على كتف الطريق عند المدخل. تزوّد بالوقود في بورجومي. وسيارة اقتصادية
    تكفي تماماً في الموسم.
