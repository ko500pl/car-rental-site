ka:
  name: ბაკურიანის ალპური ბოტანიკური ბაღი
  short: >-
    ჩვიდმეტი ჰექტარი 1700 მეტრზე, ბაკურიანის კიდეზე, სადაც მეცნიერები 1910 წლიდან კავკასიის მაღალმთის
    მცენარეებს აშინაურებენ.
  body: >-
    **ბაკურიანში ყველა სათხილამურო ფერდობებს შესცქერის, ამ ბაღში კი თვალი ძირს უნდა დახაროთ, ყვავილებზე,
    რომლებიც ფეხსაცმლის ყელს ძლივს სწვდება.** ბაკურიანის ბოტანიკური ბაღი კურორტის დასავლეთ კიდეზე, ზღვის
    დონიდან დაახლოებით 1700 მეტრზე მდებარეობს. იგი 1910 წელს კოხტაგორის დასავლეთ კალთაზე ბოტანიკოსების,
    ა. როლოვისა და ა. ფომინის, ინიციატივით დაარსდა, 1934 წელს საქართველოს ბოტანიკის ინსტიტუტს გადაეცა,
    1937 წელს კი ახლანდელ ადგილზე გაშენდა. დღეს ეს ილიას სახელმწიფო უნივერსიტეტის ბოტანიკის ინსტიტუტის
    მაღალმთის ბაღია (იმავე უნივერსიტეტისა, რომელსაც აბასთუმნის ობსერვატორია ეკუთვნის) და ისევ საცდელ ბაზად
    რჩება და არა პარკად.


    მისი მიზანი არასდროს შეცვლილა: კავკასიის მაღალმთის მცენარეების ამ ფერდობზე ჩამოტანა, იმის გარკვევა,
    რომელი მოიკიდებს ფეხს, და მათი ცხოვრების შესწავლა. ალპური კოლექცია კავკასიის სხვადასხვა კუთხიდან ჩამოტანილ
    1200-მდე სახეობას აერთიანებს დაახლოებით ჰექტარნახევარზე, მათ შორის აღმოსავლურ ყაყაჩოსა და პონტოურ
    ნაღველას. კიდევ 300-მდე სახეობა ალთაიდან, შორეული აღმოსავლეთიდან და კარპატებიდან არის შემოტანილი.


    უფრო გრძელ ამბავს ხეები ჰყვებიან. კავკასიის 75 ადგილობრივი სახეობის — მათ შორის კავკასიური სოჭის,
    მაღალმთის ნეკერჩხლისა და დეკის — გვერდით 66 უცხო სტუმარი დგას: დუგლასის ცრუცუგა, ენგელმანისა და მჩხვლეტავი
    ნაძვი, ციმბირული ლარიქსი, მანჯურიული კაკალი, ამურის ხავერდის ხე. ცდისთვის დარგული ხეები დღეს ჩრდილიან
    ხეივნებად ქცეულა და თბილ ნაშუადღევს იქაურობას ფისის სუნი ასდის. 1939 წელს მეცნიერებმა აქ ყინვაგამძლე
    მოცხარი, ხურტკმელი და მიჩურინის ვაშლი დარგეს, რათა გაეგოთ, რა მოვა იქ, სადაც თოვლი თვეობით დევს.


    ივნისის ბოლოს ან ივლისში ჩამოდით, როცა ალპური ნაკვეთები თითქმის ერთდროულად ყვავის. ზოგი ბილიკი ბალახში
    გავლებულ კვალს ძლივს სცდება, ეტიკეტების ნაწილიც დაკარგულია. სიპრიალეს აქ ვერ ნახავთ, სამაგიეროდ მშვიდ
    საათს მიიღებთ და ას წელზე მეტი ხნის ექსპერიმენტს, რომელიც ჯერაც გრძელდება.
  tip: >-
    საათნახევარი სავსებით საკმარისია. ბაღი თბილ სეზონზე, დაახლოებით მაისიდან ოქტომბრამდე, ღიაა, დანარჩენ
    დროს თოვლის ქვეშაა; შესასვლელთან, როგორც წესი, მცირე საფასურს იღებენ. ბილიკები მიწისაა და წვიმის შემდეგ
    ტალახდება, ამიტომ სანდლებს სპორტული ფეხსაცმელი ამჯობინეთ. შიგნით არაფერი იყიდება: წყალი თან იქონიეთ,
    საჭმელად კი დაბაში დაბრუნდით. ნაკვეთები მზეზეა, ქუდი გამოგადგება. მაისის დასაწყისში ჩრდილიან კუთხეებში
    თოვლი ჯერაც დევს. უყურეთ, გადაიღეთ, მაგრამ ნუ მოწყვეტთ: ბევრი მცენარე ამ ფერდობზე ერთადერთი ეგზემპლარია.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კილომეტრია, იქიდან S8-ით სამხრეთისკენ
    კიდევ 30 კილომეტრი ბორჯომამდე. ბორჯომის ცენტრში Sh20-ზე გადაუხვიეთ, რომელიც ცაგვერის გავლით 30 კილომეტრს
    მიიკლაკნება ბაკურიანამდე: სულ 187 კმ და სამ საათზე ცოტა ნაკლები. ბაღი კურორტის დასავლეთ კიდეზეა, ცენტრიდან
    კილომეტრზე ნაკლებ მანძილზე, ამიტომ მანქანის დაბაში დატოვება და თხუთმეტწუთიანი გასეირნებაც შეიძლება.
    გზა ბოლომდე ასფალტია; ბორჯომის ზემოთ სერპანტინი ვიწროა, ამიტომ ნუ იჩქარებთ. მანქანა ჭიშკართან, გზისპირას
    დააყენეთ. საწვავი ხაშურში ან ბორჯომში ჩაასხით. სეზონზე ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Bakuriani Alpine Botanical Garden
  short: >-
    Seventeen hectares at 1,700 metres on the edge of Bakuriani, where scientists have been coaxing plants
    of the high Caucasus into bloom since 1910.
  body: >-
    **In Bakuriani most people look up at the ski runs; in this garden the point is to look down, at flowers
    barely taller than your boot.** The garden lies at about 1,700 metres on the western edge of the resort.
    It was founded in 1910 on the western slope of Mount Kokhta at the initiative of the botanists A.
    Rolov and A. Fomin, passed to the Georgian Institute of Botany in 1934 and was laid out on its present
    ground in 1937. Today it is the high-mountain garden of the Institute of Botany at Ilia State University,
    the same university that runs the Abastumani observatory, and it is still an experimental station
    rather than a park.


    Its task has never changed: bring the plants of the high Caucasus down to this slope, see which of
    them settle, and learn how they live. The alpine collection gathers some 1,200 species from across
    the Caucasus on about a hectare and a half, oriental poppies and Pontic gentians among them, and around
    300 more have come from the Altai, the Russian Far East and the Carpathians.


    The trees tell the longer story. Beside 75 native species, Caucasian fir, high-mountain maple and
    rhododendron among them, stand 66 foreign guests: Douglas fir, Engelmann and blue spruce, Siberian
    larch, Manchurian walnut, the Amur cork tree. Planted as experiments, they now shade walks that smell
    of resin on warm afternoons. In 1939 the scientists added frost-hardy currants, gooseberries and Michurin
    apples, to learn what might crop in a place where snow lies for months.


    Come at the end of June or in July, when the alpine beds flower almost all at once. Some paths are
    little more than tracks through the grass, and labels have gone missing. What you get instead of polish
    is a quiet hour, and a century-old experiment still running.
  tip: >-
    An hour and a half is plenty. The garden opens in the warm season, roughly May to October, and lies
    under snow the rest of the year; a small fee is usually charged at the gate. The paths are earth and
    turn to mud after rain, so wear trainers rather than sandals. Nothing is sold inside, so bring water
    and eat in the village. The beds are open to the sun: a hat helps. In early May snow can still linger
    in shaded corners. Look, photograph, but do not pick: many of these plants are the only specimens
    on the slope.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south for 30 km to Borjomi.
    In the centre of Borjomi turn onto the Sh20, which climbs another 30 km through Tsagveri to Bakuriani:
    187 km and a little under 3 hours in all. The garden sits on the western edge of the resort, less
    than a kilometre from the centre; you can also walk it from the village in a quarter of an hour. It
    is asphalt all the way, though the bends above Borjomi are tight, so take them slowly. Park on the
    verge by the gate. Refuel in Khashuri or Borjomi. An economy car is fine in the season.
ru:
  name: Бакурианский альпийский ботанический сад
  short: >-
    Семнадцать гектаров на высоте 1700 метров на краю Бакуриани, где с 1910 года учёные уговаривают растения
    высокогорного Кавказа зацвести.
  body: >-
    **В Бакуриани все смотрят вверх, на горнолыжные склоны; в этом саду смотреть нужно вниз — на цветы
    чуть выше ботинка.** Сад лежит на высоте около 1700 метров на западной окраине курорта. Его основали
    в 1910 году на западном склоне горы Кохта по инициативе ботаников А. Ролова и А. Фомина; в 1934 году
    он перешёл к Грузинскому институту ботаники, а в 1937-м был разбит на нынешнем месте. Сегодня это
    высокогорный сад Института ботаники Государственного университета Ильи — того самого, которому принадлежит
    Абастуманская обсерватория, — и он по-прежнему остаётся опытной станцией, а не парком.


    Задача сада не менялась с самого начала: спустить растения высокогорного Кавказа на этот склон, посмотреть,
    какие из них приживутся, и понять, как они живут. Альпийская коллекция собрала на полутора гектарах
    около 1200 видов со всего Кавказа, среди них восточный мак и понтийская горечавка; ещё около 300 привезены
    с Алтая, Дальнего Востока и Карпат.


    Более долгую историю рассказывают деревья. Рядом с 75 местными видами — среди них пихта кавказская,
    клён высокогорный и рододендрон — растут 66 иноземных гостей: лжетсуга Мензиса, ель Энгельмана и голубая
    ель, лиственница сибирская, орех маньчжурский, амурский бархат. Посаженные как эксперимент, сегодня
    они затеняют аллеи, которые в тёплые дни пахнут смолой. В 1939 году учёные добавили морозостойкие
    смородину, крыжовник и мичуринские яблони, чтобы узнать, что способно плодоносить там, где снег лежит
    месяцами.


    Приезжайте в конце июня или в июле, когда альпийские куртины зацветают почти разом. Некоторые дорожки
    — едва заметные тропки в траве, а таблички кое-где пропали. Вместо лоска вы получите тихий час и вековой
    эксперимент, который всё ещё продолжается.
  tip: >-
    Полутора часов вполне достаточно. Сад работает в тёплый сезон, примерно с мая по октябрь, а остальное
    время года лежит под снегом; у входа обычно берут небольшую плату. Дорожки грунтовые и после дождя
    раскисают, так что надевайте кроссовки, а не сандалии. Внутри ничего не продают: возьмите воду, а
    поесть можно в посёлке. Куртины открыты солнцу — пригодится шляпа. В начале мая в тенистых углах ещё
    может лежать снег. Смотрите, фотографируйте, но не рвите: многие из этих растений — единственные экземпляры
    на склоне.
  route: >-
    Из Тбилиси — на запад по E60/S1 до Хашури, около 130 км, затем по S8 на юг 30 км до Боржоми. В центре
    Боржоми сворачивайте на Sh20, которая поднимается ещё на 30 км через Цагвери к Бакуриани: всего 187
    км и чуть меньше 3 часов. Сад находится на западной окраине курорта, меньше чем в километре от центра;
    из посёлка до него можно дойти пешком за четверть часа. Асфальт на всём пути, но серпантин выше Боржоми
    крутой, так что не спешите на поворотах. Машину оставьте на обочине у ворот. Заправляйтесь в Хашури
    или Боржоми. В сезон вполне хватит машины эконом-класса.
fa:
  name: باغ گیاه‌شناسی آلپی باکوریانی
  short: >-
    هفده هکتار در ارتفاع ۱,۷۰۰ متری، در حاشیهٔ باکوریانی، جایی که دانشمندان از ۱۹۱۰ گیاهان قفقاز مرتفع
    را با حوصله به گل دادن وامی‌دارند.
  body: >-
    **در باکوریانی بیشتر مردم به بالا، به پیست‌های اسکی، نگاه می‌کنند؛ در این باغ باید به پایین نگاه کرد،
    به گل‌هایی که قدشان به زحمت از پوتینتان بلندتر است.** باغ در ارتفاع حدود ۱,۷۰۰ متری، در لبهٔ غربی
    این تفرجگاه قرار دارد. در ۱۹۱۰ بر دامنهٔ غربی کوه کوختا و به ابتکار دو گیاه‌شناس، آ. رولوف و آ. فومین،
    بنیاد نهاده شد؛ در ۱۹۳۴ به مؤسسهٔ گیاه‌شناسی گرجستان سپرده شد و در ۱۹۳۷ در جای کنونی‌اش طراحی و احداث
    شد. امروز باغ کوهستانیِ مؤسسهٔ گیاه‌شناسی دانشگاه دولتی ایلیاست، همان دانشگاهی که رصدخانهٔ آباستومانی
    را اداره می‌کند، و هنوز ایستگاهی آزمایشی است، نه پارک.


    مأموریتش هرگز تغییر نکرده است: گیاهان قفقاز مرتفع را به این دامنه بیاورد، ببیند کدام‌یک جا می‌افتند
    و بفهمد چگونه زندگی می‌کنند. مجموعهٔ آلپی حدود ۱,۲۰۰ گونه از سراسر قفقاز را در حدود یک هکتار و نیم
    گرد آورده است، از جمله خشخاش شرقی و جنتیانای پونتی، و حدود ۳۰۰ گونهٔ دیگر از آلتای، خاور دور روسیه
    و کارپات آمده‌اند.


    داستانِ بلندتر را درختان روایت می‌کنند. در کنار ۷۵ گونهٔ بومی، از جمله نراد قفقازی، افرای کوهستانی
    و رودودندرون، ۶۶ مهمان خارجی ایستاده‌اند: نراد داگلاس، نوئل انگلمان و نوئل آبی، لاریکس سیبری، گردوی
    منچوری، درخت چوب‌پنبهٔ آمور. این درختان به‌عنوان آزمایش کاشته شدند و اکنون بر گذرگاه‌هایی سایه می‌اندازند
    که در بعدازظهرهای گرم بوی صمغ می‌دهند. در ۱۹۳۹ دانشمندان انگور فرنگی و انگور فرنگی خاردارِ مقاوم به
    سرما و سیب‌های میچورینی را افزودند تا بدانند در جایی که برف ماه‌ها می‌ماند، چه چیزی می‌تواند بار دهد.


    اواخر ژوئن یا در ژوئیه بیایید، وقتی کرت‌های آلپی تقریباً همه با هم گل می‌دهند. برخی مسیرها چیزی جز
    رد باریکی در میان علف نیستند و برخی برچسب‌ها گم شده‌اند. آنچه به جای آراستگی به دست می‌آورید، ساعتی
    آرام است و آزمایشی صدساله که هنوز ادامه دارد.
  tip: >-
    یک ساعت و نیم کاملاً بس است. باغ در فصل گرم، تقریباً از مه تا اکتبر، باز است و باقی سال زیر برف می‌ماند؛
    معمولاً دمِ در ورودیه‌ای اندک می‌گیرند. مسیرها خاکی‌اند و پس از باران گل‌آلود می‌شوند؛ پس کفش ورزشی
    بپوشید، نه صندل. درون باغ چیزی فروخته نمی‌شود؛ آب همراه بیاورید و در روستا غذا بخورید. کرت‌ها زیر
    آفتاب‌اند و کلاه به کار می‌آید. اوایل مه ممکن است هنوز در گوشه‌های سایه‌گیر برف مانده باشد. نگاه کنید،
    عکس بگیرید، اما گل نچینید: بسیاری از این گیاهان تنها نمونه‌های خود بر این دامنه‌اند.
  route: >-
    از تفلیس از مسیر E60/S1 به سوی غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس از S8 رو به جنوب ۳۰ کیلومتر
    تا بورجومی برانید. در مرکز بورجومی به جادهٔ Sh20 بپیچید که ۳۰ کیلومتر دیگر از راه تساگوِری تا باکوریانی
    بالا می‌رود: روی‌هم ۱۸۷ کیلومتر و کمی کمتر از ۳ ساعت. باغ در لبهٔ غربی تفرجگاه است، کمتر از یک کیلومتر
    از مرکز؛ از روستا پیاده هم یک ربع ساعت راه است. تمام مسیر آسفالت است، اما پیچ‌های بالای بورجومی تندند؛
    آهسته برانید. کنار جاده، نزدیک در ورودی پارک کنید. در خاشوری یا بورجومی سوخت بگیرید. در فصل بازدید
    خودروی اکونومی کافی است.
he:
  name: הגן הבוטני האלפיני בבקוריאני
  short: שבעה-עשר הקטרים בגובה 1,700 מטר בשולי בקוריאני, שבהם מאז 1910 משדלים מדענים את צמחי הקווקז הגבוה
    לפרוח.
  body: >-
    **בבקוריאני רוב האנשים מביטים למעלה, אל מדרונות הסקי; בגן הזה העיקר הוא להביט למטה, אל פרחים שבקושי
    מתנשאים מעל הנעל.** הגן שוכן בגובה של כ-1,700 מטר בשוליים המערביים של אתר הנופש. הוא נוסד ב-1910 על
    המדרון המערבי של הר קוחטה ביוזמת הבוטנאים א. רולוב וא. פומין, עבר ב-1934 למכון הגאורגי לבוטניקה, וב-1937
    ניטע על שטחו הנוכחי. היום זהו הגן ההררי של המכון לבוטניקה באוניברסיטת איליה הממלכתית — אותה אוניברסיטה
    שמפעילה את מצפה הכוכבים באבסטומאני — והוא עדיין תחנת ניסוי ולא פארק.


    משימתו מעולם לא השתנתה: להביא אל המדרון הזה את צמחי הקווקז הגבוה, לראות אילו מהם נקלטים וללמוד כיצד
    הם חיים. האוסף האלפיני מרכז כ-1,200 מינים מכל רחבי הקווקז על שטח של כהקטר וחצי, ובהם פרג מזרחי וגנטיאנה
    פונטית, ועוד כ-300 מינים הגיעו מהרי אלטאי, מן המזרח הרחוק הרוסי ומהרי הקרפטים.


    את הסיפור הארוך יותר מספרים העצים. לצד 75 מינים מקומיים, ובהם אשוח קווקזי, אדר ההרים הגבוהים ורודודנדרון,
    עומדים 66 אורחים מארצות רחוקות: אשוח דאגלס, אשוחית אנגלמן ואשוחית כחולה, ארזית סיבירית, אגוז מנצ'ורי
    ועץ השעם האמורי. הם ניטעו כניסוי, והיום הם מצלים על שבילים שבימים חמים ריחם ריח שרף. ב-1939 הוסיפו
    המדענים דומדמניות, חזרזרים (גוזברי) ותפוחי מיצ'ורין עמידים לכפור, כדי ללמוד מה יכול להניב פרי במקום
    שבו השלג נשאר חודשים.


    בואו בסוף יוני או ביולי, כשהערוגות האלפיניות פורחות כמעט בבת אחת. חלק מן השבילים אינם יותר מעקבות
    בעשב, וחלק מן השלטים אבדו. במקום ליטוש מקבלים שעה שקטה וניסוי בן מאה שנה שעדיין נמשך.
  tip: >-
    שעה וחצי מספיקה בהחלט. הגן פתוח בעונה החמה, בערך ממאי עד אוקטובר, ובשאר השנה הוא מכוסה שלג; בשער גובים
    בדרך כלל דמי כניסה סמליים. השבילים עפר והופכים לבוץ אחרי גשם, אז נעלו נעלי ספורט ולא סנדלים. בתוך
    הגן לא מוכרים דבר, לכן הביאו מים ואכלו בכפר. הערוגות חשופות לשמש, וכובע יועיל. בתחילת מאי עוד עשוי
    להישאר שלג בפינות המוצלות. הביטו, צלמו, אבל אל תקטפו: רבים מן הצמחים האלה הם הפרטים היחידים ממינם
    על המדרון.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק״מ, ואחר כך דרומה בכביש S8 עוד 30 ק״מ עד בורג'ומי.
    במרכז בורג'ומי פנו לכביש Sh20, שמטפס עוד 30 ק״מ דרך צגוורי אל בקוריאני: בסך הכול 187 ק״מ וקצת פחות
    מ-3 שעות. הגן נמצא בשוליים המערביים של אתר הנופש, פחות מקילומטר מן המרכז; מן הכפר אפשר גם ללכת אליו
    ברגל ברבע שעה. הדרך סלולה לכל אורכה, אבל העיקולים מעל בורג'ומי חדים, אז קחו אותם לאט. חנו בשולי הדרך
    ליד השער. תדלקו בחשורי או בבורג'ומי. בעונה רכב חסכוני מספיק לגמרי.
ar:
  name: حديقة باكورياني النباتية الألبية
  short: >-
    سبعة عشر هكتاراً على ارتفاع 1,700 متر عند طرف باكورياني، حيث يستدرج العلماء منذ 1910 نباتات القوقاز
    العالي إلى الإزهار.
  body: >-
    **في باكورياني يرفع معظم الناس أبصارهم إلى منحدرات التزلج؛ أما في هذه الحديقة فالمقصود أن تنظر إلى
    الأسفل، إلى أزهار لا تكاد تعلو حذاءك.** تقع الحديقة على ارتفاع نحو 1,700 متر عند الطرف الغربي للمنتجع.
    أُسست عام 1910 على السفح الغربي لجبل كوختا بمبادرة من عالمَي النبات أ. رولوف وأ. فومين، وانتقلت عام
    1934 إلى معهد النبات الجورجي، ثم خُططت على أرضها الحالية عام 1937. وهي اليوم الحديقة الجبلية لمعهد
    النبات في جامعة إيليا الحكومية، الجامعة نفسها التي تدير مرصد أباستوماني، وما زالت محطة تجارب لا متنزهاً.


    لم تتغير مهمتها قط: أن تُنزل نباتات القوقاز العالي إلى هذا السفح، وترى أيها يستقر، وتتعلم كيف تعيش.
    تضم المجموعة الألبية نحو 1,200 نوع من أرجاء القوقاز على قرابة هكتار ونصف، منها الخشخاش الشرقي والجنطيانا
    البنطية، ونحو 300 نوع آخر جاءت من ألتاي والشرق الأقصى الروسي وجبال الكاربات.


    أما الحكاية الأطول فترويها الأشجار. إلى جانب 75 نوعاً محلياً، منها الشوح القوقازي والقيقب الجبلي العالي
    والرودودندرون، يقف 66 ضيفاً أجنبياً: شوح دوغلاس، وتنوب إنغلمان والتنوب الأزرق، والأرزية السيبيرية،
    والجوز المنشوري، وشجرة الفلين الآمورية. زُرعت تجربةً، وهي اليوم تظلّل ممرات تفوح منها رائحة الراتنج
    في الأصائل الدافئة. وفي عام 1939 أضاف العلماء أنواعاً مقاومة للصقيع من الكشمش وعنب الثعلب وتفاح ميتشورين،
    ليعرفوا ما الذي يمكن أن يثمر في مكان يبقى فيه الثلج شهوراً.


    تعالَ في أواخر يونيو أو في يوليو، حين تزهر الأحواض الألبية دفعة واحدة تقريباً. بعض الممرات ليست أكثر
    من آثار أقدام في العشب، وبعض اللافتات ضاعت. لكنك تنال بدل البريق ساعة هادئة، وتجربة عمرها قرن ما زالت
    مستمرة.
  tip: >-
    ساعة ونصف تكفي تماماً. تفتح الحديقة في الموسم الدافئ، من مايو إلى أكتوبر تقريباً، وتغطيها الثلوج بقية
    العام؛ وعادةً تُدفع رسوم زهيدة عند البوابة. الممرات ترابية وتتحول إلى وحل بعد المطر، فالبس حذاءً رياضياً
    لا صندلاً. لا يُباع شيء في الداخل، فاحمل الماء وتناول طعامك في البلدة. الأحواض مكشوفة للشمس، والقبعة
    مفيدة. في أوائل مايو قد يبقى الثلج في الزوايا الظليلة. انظر وصوّر، لكن لا تقطف: فكثير من هذه النباتات
    هي العيّنات الوحيدة على السفح.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، نحو 130 كم، ثم الطريق S8 جنوباً 30 كم حتى بورجومي.
    في وسط بورجومي انعطف إلى الطريق Sh20 الذي يصعد 30 كم أخرى عبر تساغفيري إلى باكورياني: 187 كم إجمالاً
    وأقل بقليل من 3 ساعات. تقع الحديقة عند الطرف الغربي للمنتجع، على أقل من كيلومتر من المركز، ويمكنك
    بلوغها سيراً من البلدة في ربع ساعة. الطريق معبّد كله، لكن المنعطفات فوق بورجومي حادة، فخذها ببطء.
    أوقف السيارة على جانب الطريق قرب البوابة. تزوّد بالوقود في خاشوري أو بورجومي. تكفي سيارة اقتصادية
    في الموسم.
