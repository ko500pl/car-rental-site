ka:
  name: თბილისის ოპერისა და ბალეტის თეატრი
  short: >-
    ზაქარია ფალიაშვილის სახელობის ოპერა რუსთაველის გამზირზე: ფსევდომავრიტანული ფასადი, ევროპული დარბაზი,
    175 სეზონი და საქართველოს სახელმწიფო ბალეტი.
  body: >-
    **ტფილისის ოპერის პირველი ჭაღი, 1 218 კილოგრამიანი, მარსელიდან თორმეტი ყუთით ჩამოვიდა, ბოლო სამასი
    კილომეტრი კი კამეჩებმა გამოათრიეს.** ეს 1851 წელი იყო. თეატრი, რომელსაც ის ანათებდა, კავკასიის მეფისნაცვლის,
    მიხეილ ვორონცოვის ინიციატივით აშენდა; პროექტს იტალიელი ჯოვანი სკუდიერი ხელმძღვანელობდა, პირველ დირექტორად
    კი მწერალი ვლადიმერ სოლოგუბი დაინიშნა. თეატრი გართობაზე მეტს ემსახურებოდა: 1832 წლის ჩაშლილი შეთქმულების
    შემდეგ ვორონცოვს ქართველი თავადაზნაურობა პარტერში ერჩივნა, ვიდრე შეთქმულებში.


    1851 წლის 12 აპრილს გახსნა ნიღბების ბალით აღინიშნა — სცენა ჯერ დასრულებული არ იყო. იმავე შემოდგომაზე
    რუსეთის იმპერიაში საგასტროლოდ მყოფი იტალიური საოპერო დასი საქართველოს სამხედრო გზით ჩამოვიდა და პირველი
    სეზონი დონიცეტის „ლუჩია დი ლამერმურით“ გახსნა. წარმოდგენის შემდეგ მასპინძლებმა მომღერლები მტკვრის
    მარცხენა ნაპირზე წაიყვანეს და ნავებზე მთელი ღამე ქეიფობდნენ.


    1874 წლის 11 ოქტომბერს, „ნორმის“ დაწყებამდე, ხანძარმა ყველაფერი შთანთქა — შენობა, მუსიკალური ბიბლიოთეკა,
    კოსტიუმები. ახალი თეატრი ვიქტორ შრეტერის პროექტით მხოლოდ 1896 წელს გაიხსნა და რუსთაველის გამზირს ყველაზე
    ეგზოტიკური ფასადი აჩუქა: აღმოსავლური, ფსევდომავრიტანული მორთულობა გარეთ, ტიპური ევროპული ოპერის დარბაზი
    — შიგნით. 1937 წლიდან თეატრი ზაქარია ფალიაშვილის სახელს ატარებს. კომპოზიტორი აქვე, თეატრის ბაღში განისვენებს,
    თავისი მეგობრის, „ქართველ ბულბულად“ წოდებული მომღერლის, ვანო სარაჯიშვილის გვერდით.


    ექვსწლიანი რესტავრაცია 2016 წლის იანვარში დასრულდა. აქ ცეკვავს საქართველოს სახელმწიფო ბალეტი ნინო
    ანანიაშვილის ხელმძღვანელობით — ვახტანგ ჭაბუკიანის „ლაურენსიიდან“ ბალანჩინამდე, — თეატრი კი 2026 წელს
    თავის 175-ე სეზონს ითვლის. ერთხელ მაინც ზედა იარუსზე დაჯექით: იქიდან კარგად ჩანს, როგორ ჩაატიეს ევროპული
    ოპერის თეატრი აღმოსავლურ სიზმარში.
  tip: >-
    ბილეთები opera.ge-სა და tkt.ge-ზე იყიდება; სახელმწიფო ბალეტის საღამოები ყველაზე სწრაფად იწურება, ამიტომ
    ერთი კვირით ან მეტით ადრე დაჯავშნეთ. აფიშა წინასწარ გადაამოწმეთ, სანამ მოგზაურობას მასზე ააწყობთ.
    დაწყებამდე 20–30 წუთით ადრე მიდით, რომ პალტო გარდერობში ჩააბაროთ და ფოიეები დაათვალიეროთ; დაგვიანებულები
    ანტრაქტს ელოდებიან. ჩაცმულობა — მოწესრიგებული, არა აუცილებლად საზეიმო, თუმცა თბილისელებს ოპერაში გამოწყობილებს
    სიარული უყვართ. წარმოდგენის დროს ტელეფონი გამორთეთ და ჩანთაში შეინახეთ.
  route: >-
    ოპერა რუსთაველის გამზირზეა, თავისუფლების მოედნიდან დაახლოებით 1 კილომეტრში. მანქანით ხუთი წუთის გზაა,
    პარკირებას კი უფრო მეტი დრო სჭირდება: გამზირზე გაჩერება არ შეიძლება, ამიტომ ფასიანი მუნიციპალური ადგილები
    უკანა ქუჩებში მოძებნეთ ან მანქანა სასტუმროსთან დატოვეთ. რუსთაველისა და თავისუფლების მოედნის მეტროსადგურებიდან
    ათიოდე წუთის სავალია. ფარდის დაშვების შემდეგ ტაქსი გამზირზე სწრაფად იშოვება. ცენტრის ამ ქუჩებისთვის
    ეკონომკლასის პატარა მანქანა ერთადერთი გონივრული არჩევანია.
en:
  name: Tbilisi Opera and Ballet Theatre
  short: >-
    The Paliashvili opera house on Rustaveli Avenue: a neo-Moorish façade, a European hall, 175 seasons
    and the State Ballet of Georgia.
  body: >-
    **The first chandelier of the Tiflis opera, all 1,218 kilograms of it, sailed from Marseille in twelve
    boxes and was hauled the last 300 kilometres by buffalo.** That was 1851. The house it lit was built
    on the initiative of the Viceroy of the Caucasus, Count Mikhail Vorontsov, overseen by the Italian
    architect Giovanni Scudieri and first run by the writer Vladimir Sollogub. It was meant to do more
    than entertain: after a failed noble conspiracy in 1832, Vorontsov wanted the Georgian aristocracy
    in the stalls, not in the plots.


    The grand opening on 12 April 1851 had to be a masked ball, because the stage was not finished. That
    autumn an Italian opera troupe touring the Russian Empire came down the Georgian Military Road and
    opened the first season with Donizetti's Lucia di Lammermoor; afterwards their hosts took them to
    the left bank of the Kura for a feast on boats that lasted all night.


    On 11 October 1874, before a performance of Norma, fire took everything — the building, the music
    library, the costumes. Viktor Schröter's new theatre did not open until 1896, and it gave Rustaveli
    Avenue its most exotic façade: neo-Moorish ornament outside, a classic European opera house within.
    Since 1937 it has carried the name of the composer Zakaria Paliashvili, who lies in the theatre garden
    beside his friend Vano Sarajishvili, the singer they called the Georgian nightingale.


    A six-year restoration ended in January 2016. The State Ballet of Georgia, led by Nina Ananiashvili,
    dances here — from Vakhtang Chabukiani's Laurencia to Balanchine — and 2026 brings the theatre's 175th
    season. Sit in the upper tiers once, just to see how a European opera house was fitted inside an Oriental
    dream.
  tip: >-
    Tickets are sold on opera.ge and tkt.ge; State Ballet nights sell fastest, so book a week or more
    ahead, and check the programme before planning a trip around it. Arrive 20–30 minutes early to leave
    your coat and look round the foyers; latecomers wait for the interval. Dress is smart rather than
    formal — though Tbilisi does like to dress up for the opera. During the performance, switch your phone
    off and keep it in your bag.
  route: >-
    The opera house is on Rustaveli Avenue, about 1 km from Freedom Square. The drive takes five minutes;
    parking takes longer. There is no stopping on the avenue itself, so look for paid municipal bays in
    the side streets or leave the car at your hotel. Rustaveli and Freedom Square metro stations are each
    about ten minutes' walk away. When the curtain falls, taxis are easy to find along the avenue. In
    these central streets a small economy car is the only sensible choice.
ru:
  name: Тбилисский театр оперы и балета
  short: >-
    Оперный театр имени Палиашвили на проспекте Руставели: неомавританский фасад, европейский зал, 175
    сезонов и Государственный балет Грузии.
  body: >-
    **Первая люстра тифлисской оперы — все её 1218 килограммов — приплыла из Марселя в двенадцати ящиках,
    а последние 300 километров её тащили буйволы.** Шёл 1851 год. Театр, который она осветила, построили
    по инициативе наместника Кавказа графа Михаила Воронцова под надзором итальянского архитектора Джованни
    Скудиери, а первым его руководителем стал писатель Владимир Соллогуб. Театр должен был не только развлекать:
    после неудавшегося дворянского заговора 1832 года Воронцов хотел видеть грузинскую аристократию в
    партере, а не в заговорах.


    Торжественное открытие 12 апреля 1851 года пришлось устроить как бал-маскарад: сцена ещё не была готова.
    Осенью того же года итальянская оперная труппа, гастролировавшая по Российской империи, спустилась
    по Военно-Грузинской дороге и открыла первый сезон «Лючией ди Ламмермур» Доницетти; после спектакля
    хозяева увезли гостей на левый берег Куры, на пир на лодках, продлившийся всю ночь.


    11 октября 1874 года, перед представлением «Нормы», огонь забрал всё — здание, нотную библиотеку,
    костюмы. Новый театр Виктора Шрётера открылся лишь в 1896 году и подарил проспекту Руставели самый
    экзотический фасад: снаружи неомавританский орнамент, внутри — классический европейский оперный зал.
    С 1937 года театр носит имя композитора Захария Палиашвили, который похоронен в театральном саду рядом
    со своим другом Вано Сараджишвили — певцом, которого называли грузинским соловьём.


    Шестилетняя реставрация завершилась в январе 2016 года. Здесь танцует Государственный балет Грузии
    под руководством Нины Ананиашвили — от «Лауренсии» Вахтанга Чабукиани до Баланчина, — а в 2026 году
    у театра начинается 175-й сезон. Хотя бы раз сядьте на верхний ярус — просто чтобы увидеть, как европейский
    оперный театр вписали в восточную грёзу.
  tip: >-
    Билеты продаются на opera.ge и tkt.ge; вечера Государственного балета раскупают быстрее всего, так
    что бронируйте за неделю или раньше и сверьтесь с афишей, прежде чем строить под спектакль поездку.
    Приходите за 20–30 минут до начала, чтобы сдать пальто и осмотреть фойе; опоздавших пускают только
    в антракте. Одеваются скорее нарядно, чем строго официально, — впрочем, в оперу Тбилиси любит принарядиться.
    Во время спектакля выключите телефон и уберите его в сумку.
  route: >-
    Оперный театр стоит на проспекте Руставели, примерно в 1 км от площади Свободы. Ехать пять минут,
    искать парковку — дольше. Остановка на самом проспекте запрещена, так что ищите платные муниципальные
    места в боковых улицах или оставьте машину у отеля. Станции метро «Руставели» и «Площадь Свободы»
    — каждая примерно в десяти минутах ходьбы. Когда опустится занавес, такси легко поймать прямо на проспекте.
    На этих центральных улицах разумный выбор только один — маленькая машина эконом-класса.
fa:
  name: تئاتر اپرا و باله تفلیس
  short: 'اپرای پالیاشویلی در خیابان روستاولی: نمایی نئوموری، تالاری اروپایی، ۱۷۵ فصل و باله دولتی گرجستان.'
  body: >-
    **نخستین چلچراغ اپرای تفلیس، با همهٔ ۱۲۱۸ کیلوگرم وزنش، در دوازده صندوق از مارسی با کشتی آمد و ۳۰۰
    کیلومتر پایانی را گاومیش‌ها کشیدند.** سال ۱۸۵۱ بود. تماشاخانه‌ای که این چلچراغ روشنش کرد به ابتکار
    نایب‌السلطنهٔ قفقاز، کنت میخائیل ورونتسوف، ساخته شد؛ معمار ایتالیایی جووانی اسکودیری بر ساختش نظارت
    داشت و نخستین مدیرش ولادیمیر سولوگوب نویسنده بود. قرار نبود فقط سرگرم کند: پس از توطئهٔ ناکام اشراف
    در ۱۸۳۲، ورونتسوف می‌خواست سر اشراف گرجی به تماشاخانه گرم باشد، نه به توطئه.


    گشایش رسمی در ۱۲ آوریل ۱۸۵۱ ناچار به شکل بالماسکه برگزار شد، چون صحنه هنوز آماده نبود. پاییز همان
    سال گروهی اپرایی از ایتالیا که در امپراتوری روسیه تور اجرا داشت، از جادهٔ نظامی گرجستان پایین آمد
    و نخستین فصل را با «لوچیا دی لامرمور» اثر دونیزتی گشود؛ سپس میزبانان آنان را به کرانهٔ چپ رود کورا
    بردند، به ضیافتی بر قایق‌ها که تا صبح ادامه یافت.


    در ۱۱ اکتبر ۱۸۷۴، پیش از اجرای «نورما»، آتش همه‌چیز را برد: ساختمان، کتابخانهٔ موسیقی، لباس‌ها. تماشاخانهٔ
    تازهٔ ویکتور شروتر تا ۱۸۹۶ گشوده نشد و به خیابان روستاولی غریب‌ترین نمای آن را بخشید: بیرون، تزیینات
    نئوموری؛ درون، تالار اپرای کلاسیک اروپایی. از ۱۹۳۷ نام آهنگساز زاکاریا پالیاشویلی را بر خود دارد که
    در باغ تئاتر، کنار دوستش وانو ساراجیشویلی، خواننده‌ای که «بلبل گرجستان» می‌خواندندش، آرمیده است.


    مرمتی شش‌ساله در ژانویهٔ ۲۰۱۶ به پایان رسید. باله دولتی گرجستان به رهبری نینا آنانیاشویلی این‌جا می‌رقصد،
    از «لائورنسیا»ی واختانگ چابوکیانی تا آثار بالانشین، و سال ۲۰۲۶ صد و هفتاد و پنجمین فصل تئاتر است.
    یک بار هم که شده در طبقه‌های بالایی بنشینید، فقط برای آنکه ببینید چگونه اپرایی اروپایی را درون رؤیایی
    شرقی جا داده‌اند.
  tip: >-
    بلیت‌ها در opera.ge و tkt.ge فروخته می‌شوند؛ شب‌های باله دولتی زودتر از همه تمام می‌شوند، پس یک هفته
    یا بیشتر پیش‌تر رزرو کنید و پیش از آنکه سفری را بر پایهٔ اجرایی برنامه‌ریزی کنید، برنامهٔ تئاتر را
    ببینید. ۲۰ تا ۳۰ دقیقه زودتر برسید تا پالتویتان را بسپارید و سرسراها را تماشا کنید؛ دیرآمدگان تا آنتراکت
    پشت در می‌مانند. پوشش آراسته کافی است و رسمی بودن لازم نیست، هرچند مردم تفلیس دوست دارند برای اپرا
    به خود برسند. هنگام اجرا تلفن را خاموش کنید و در کیف بگذارید.
  route: >-
    اپرا در خیابان روستاولی، حدود ۱ کیلومتر از میدان آزادی است. رانندگی پنج دقیقه طول می‌کشد؛ پیدا کردن
    جای پارک بیشتر. در خود خیابان توقف ممنوع است، پس در خیابان‌های فرعی دنبال جای پارک پولی شهرداری بگردید
    یا خودرو را در هتل بگذارید. ایستگاه‌های متروی «روستاولی» و «میدان آزادی» هر کدام حدود ده دقیقه پیاده
    فاصله دارند. وقتی پرده فرو می‌افتد، در طول خیابان به‌آسانی تاکسی پیدا می‌شود. در این خیابان‌های مرکزی
    تنها انتخاب معقول خودروی کوچک اقتصادی است.
he:
  name: בית האופרה והבלט של טביליסי
  short: 'בית האופרה על שם פליאשווילי בשדרת רוסתוולי: חזית נאו-מורית, אולם אירופי, 175 עונות והבלט הממלכתי
    של גאורגיה.'
  body: >-
    **הנברשת הראשונה של האופרה של טיפליס, על כל 1,218 הקילוגרמים שלה, הפליגה ממרסיי בשתים-עשרה תיבות,
    ואת 300 הקילומטרים האחרונים גררו אותה תאואים.** זה היה ב-1851. הבית שהאירה נבנה ביוזמת המשנה למלך
    בקווקז, הרוזן מיכאיל וורונצוב, בפיקוחו של האדריכל האיטלקי ג'ובאני סקודיירי, ומנהלו הראשון היה הסופר
    ולדימיר סולוגוב. הוא נועד ליותר מבידור: אחרי קשר אצילים כושל ב-1832 רצה וורונצוב שהאצולה הגאורגית
    תשב באולם, ולא תרקום קשרים.


    הפתיחה החגיגית ב-12 באפריל 1851 נאלצה להיות נשף מסכות, כי הבמה עוד לא הושלמה. באותו סתיו ירדה בדרך
    הצבאית הגאורגית להקת אופרה איטלקית שסיירה ברחבי האימפריה הרוסית, ופתחה את העונה הראשונה ב"לוצ'יה די
    למרמור" של דוניצטי; אחר כך לקחו אותם מארחיהם לגדה השמאלית של נהר קורה, למשתה על סירות שנמשך כל הלילה.


    ב-11 באוקטובר 1874, לפני הצגה של "נורמה", האש לקחה הכול — את הבניין, את ספריית התווים, את התלבושות.
    התיאטרון החדש של ויקטור שרטר נפתח רק ב-1896, והעניק לשדרת רוסתוולי את החזית האקזוטית ביותר שלה: עיטור
    נאו-מורי מבחוץ, בית אופרה אירופי קלאסי מבפנים. מאז 1937 הוא נושא את שמו של המלחין זכריה פליאשווילי,
    הקבור בגן התיאטרון לצד ידידו ואנו סרג'ישווילי, הזמר שכינו אותו "הזמיר הגאורגי".


    שיפוץ שנמשך שש שנים הסתיים בינואר 2016. הבלט הממלכתי של גאורגיה, בהנהלת נינה אנניאשווילי, רוקד כאן
    — מ"לאורנסיה" של וכטנג צ'בוקיאני ועד בלנשין — ובשנת 2026 מציין התיאטרון את עונתו ה-175. שבו פעם אחת
    ביציעים העליונים, רק כדי לראות איך בית אופרה אירופי שובץ בתוך חלום מזרחי.
  tip: >-
    כרטיסים נמכרים באתרים opera.ge ו-tkt.ge; ערבי הבלט הממלכתי נחטפים ראשונים, אז הזמינו שבוע מראש או
    יותר, ובדקו את התוכנייה לפני שאתם בונים טיול סביב הופעה. הגיעו 20–30 דקות מוקדם כדי להפקיד את המעיל
    ולהסתובב במבואות; המאחרים ממתינים להפסקה. הלבוש מוקפד ואלגנטי, לא בהכרח רשמי — אם כי בטביליסי אוהבים
    להתגנדר לאופרה. במהלך ההופעה כבו את הטלפון ושמרו אותו בתיק.
  route: >-
    בית האופרה נמצא בשדרת רוסתוולי, כ-1 ק״מ מכיכר החירות. הנסיעה אורכת חמש דקות; מציאת חניה — יותר. בשדרה
    עצמה אסור לעצור, אז חפשו מקומות חניה עירוניים בתשלום ברחובות הצדדיים או השאירו את הרכב במלון. תחנות
    המטרו רוסתוולי וכיכר החירות נמצאות כל אחת כעשר דקות הליכה משם. כשהמסך יורד, קל למצוא מוניות לאורך
    השדרה. ברחובות המרכזיים האלה הבחירה ההגיונית היחידה היא רכב חסכוני קטן.
ar:
  name: مسرح تبليسي للأوبرا والباليه
  short: >-
    دار أوبرا بالياشفيلي في جادة روستافيلي: واجهة بالطراز الموري الجديد، وقاعة أوروبية، و175 موسماً، وفرقة
    الباليه الحكومية الجورجية.
  body: >-
    **الثريا الأولى لأوبرا تفليس، بوزنها البالغ 1218 كيلوغراماً، أبحرت من مرسيليا في اثني عشر صندوقاً،
    ثم جرّتها الجواميس في آخر 300 كيلومتر.** كان ذلك عام 1851. أما الدار التي أضاءتها فقد شُيّدت بمبادرة
    من نائب الملك في القوقاز، الكونت ميخائيل فورونتسوف، وبإشراف المعماري الإيطالي جيوفاني سكوديري، وتولّى
    إدارتها أولاً الكاتب فلاديمير سولوغوب. ولم يكن الغرض منها الترفيه وحده: فبعد مؤامرة فاشلة دبّرها النبلاء
    عام 1832، أراد فورونتسوف أن يرى الأرستقراطية الجورجية في مقاعد الصالة لا في حبك المؤامرات.


    واضطُرّ المنظمون إلى جعل الافتتاح الكبير في 12 أبريل 1851 حفلةً تنكرية، لأن خشبة المسرح لم تكن قد
    اكتملت. وفي خريف ذلك العام نزلت فرقة أوبرا إيطالية كانت تجول في الإمبراطورية الروسية عبر الطريق العسكري
    الجورجي، وافتتحت الموسم الأول بأوبرا «لوتشيا دي لاميرمور» لدونيزيتي؛ ثم أخذها مضيفوها إلى الضفة اليسرى
    لنهر كورا لوليمة على القوارب امتدت طوال الليل.


    وفي 11 أكتوبر 1874، قبيل عرض «نورما»، أتت النار على كل شيء: المبنى، ومكتبة المدوّنات الموسيقية، والأزياء.
    ولم يُفتتح مسرح فيكتور شروتر الجديد إلا عام 1896، فمنح جادة روستافيلي أغرب واجهاتها: زخارف بالطراز
    الموري الجديد في الخارج، ودار أوبرا أوروبية كلاسيكية في الداخل. ومنذ عام 1937 يحمل المسرح اسم المؤلف
    الموسيقي زكريا بالياشفيلي، المدفون في حديقته إلى جوار صديقه فانو ساراجيشفيلي، المغني الذي لقّبوه بالعندليب
    الجورجي.


    وانتهى ترميم دام ست سنوات في يناير 2016. هنا ترقص فرقة الباليه الحكومية الجورجية بقيادة نينا أنانياشفيلي،
    من «لاورنسيا» لفاختانغ تشابوكياني إلى أعمال بالانشين، ويحلّ في عام 2026 الموسم الخامس والسبعون بعد
    المئة للمسرح. اجلس ولو مرة واحدة في الطبقات العليا، لا لشيء إلا لترى كيف أُدخلت دار أوبرا أوروبية
    في قلب حلم شرقي.
  tip: >-
    تُباع التذاكر على opera.ge وtkt.ge، وأمسيات الباليه الحكومي تنفد أسرع من غيرها، فاحجز قبل أسبوع أو
    أكثر، وراجع البرنامج قبل أن تبني رحلة حول عرض بعينه. احضر قبل البدء بـ20–30 دقيقة لتسلّم معطفك وتتجوّل
    في الردهات، فالمتأخرون ينتظرون حتى الاستراحة. اللباس أنيق لا رسمي بالضرورة، وإن كانت تبليسي تحب التأنق
    للأوبرا. وأثناء العرض أطفئ هاتفك واتركه في حقيبتك.
  route: >-
    تقع دار الأوبرا في جادة روستافيلي، على بعد نحو 1 كم من ميدان الحرية. تستغرق القيادة خمس دقائق، أما
    إيجاد موقف فيستغرق أكثر. لا يُسمح بالتوقف في الجادة نفسها، فابحث عن مواقف بلدية مدفوعة في الشوارع
    الجانبية أو اترك السيارة عند فندقك. وتبعد محطتا المترو «روستافيلي» و«ميدان الحرية» نحو عشر دقائق سيراً
    لكل منهما. وعندما يُسدل الستار يسهل العثور على سيارات الأجرة على امتداد الجادة. وفي هذه الشوارع المركزية
    لا خيار معقولاً سوى سيارة اقتصادية صغيرة.
