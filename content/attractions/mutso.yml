ka:
  name: მუცო
  short: >-
    შუა საუკუნეების ციხე-სოფელი მშრალად ნაწყობი ფიქლისგან არდოტის ხეობის თავზე, შატილიდან 11 კმ-ში — ნანგრევებიდან
    აღმდგარი და „ევროპა ნოსტრას“ პრემიის ლაურეატი.
  body: >-
    **მუცო თავის კლდეზე კი არ დგას — თითქოს კლდიდან ამოზრდილა: ნაცრისფერი ფიქლის სახლები სამ ტერასაზე,
    იმავე ქვით ნაგები, რომლისგანაც თავად კლდეა, და დუღაბის გარეშე დაწყობილი.**


    ციხე-სოფელი პირიქითა ხევსურეთში, არდოტის ხეობის თავზე, ზღვის დონიდან დაახლოებით 1880 მეტრზე დგას,
    შატილიდან 11-იოდე კილომეტრში. „ევროპა ნოსტრას“ ცნობით, აქ სულ ცოტა X საუკუნიდან ცხოვრობდნენ; მუცო
    ჩრდილოეთის სადარაჯო იყო და საქართველოში შემომავალ გზებს აკონტროლებდა. ეთნოგრაფმა გ. დემიდოვმა 1931
    წელს სამ საფორტიფიკაციო ჯგუფს აღწერა — თითოეულს თავისი კოშკითა და თავისი საგვარეულო ხატით, რომლებიც
    დაიაურებს, ჩოლოყაშვილებსა და თორღვას უკავშირდებოდა. სახლები ორ-ოთხსართულიანია და ერთმანეთს ვიწრო გასასვლელებითა
    და ქვის კიბეებით უკავშირდება; ზედა ტერასაზე, ერთგვარ აკროპოლისზე, მთავარი სალოცავი, ეკლესია და კოშკებია.
    ფერდის ძირში აკლდამები დგას — მიწისზედა ქვის სამარხები, სადაც მიცვალებულებს იატაკზე და ქვის სკამებზე
    ასვენებდნენ.


    XX საუკუნის დასაწყისისთვის ზედა სოფელი თითქმის დაცარიელებული იყო; 1928 წელს მწერალმა ვლადიმირ გურკო-კრიაჟინმა
    მას „მკვდარი ქალაქი“ უწოდა. 2014 წელს კულტურული მემკვიდრეობის დაცვის ეროვნულმა სააგენტომ მისი გადარჩენა
    დაიწყო. ფიქლის მშრალი წყობა თითქმის დავიწყებული იყო, ამიტომ ადგილობრივ მუშებს ეს ხელობა მეზობელი მხარის
    ქისტმა ოსტატებმა შეასწავლეს; ქვა მთაზე საბაგირო სისტემით ამოჰქონდათ, ელექტროენერგიისთვის კი მდინარეზე
    პატარა ჰესი ააგეს. 2019 წელს სამუშაოებმა ევროკავშირის კულტურული მემკვიდრეობის პრემია „ევროპა ნოსტრა“
    მიიღო, შემდეგ კი საზოგადოების რჩეულის ჯილდოც.


    გადმოცემით, მუცო თორღვამ ააშენა, ქვა კი ანატორიდან აქამდე ხელიდან ხელში, ცოცხალი ჯაჭვით ამოჰქონდათ.


    ზედა ტერასაზე რომ დადგებით, ჩანაფიქრი ცხადი ხდება: კლდე, კედელი და სახლი აქ ერთმანეთისგან არასოდეს
    უნდა გარჩეულიყო.
  tip: >-
    ადგილზე ორი-სამი საათი გაითვალისწინეთ. ქვის კიბეები ციცაბოა და ადგილ-ადგილ ღია, ამიტომ მყარძირიანი
    ფეხსაცმელი ჩაიცვით, და თუ სიმაღლის გეშინიათ, ზედა ტერასაზე ნუ ახვალთ. მუცოში წყალი, საჭმელი და ტუალეტი
    არ არის; ღამე შატილში ან ხეობის ზემოთ, არდოტში გაათიეთ. სალოცავები ხევსურებისთვის დღესაც წმინდაა:
    შესაწირს ხელს ნუ ახლებთ, სალოცავის ზღუდეში ნუ შეხვალთ და გაითვალისწინეთ, რომ მთის წესით ქალები მათ
    არ უახლოვდებიან. პასპორტი თან იქონიეთ — სასაზღვრო ზონაა. საუკეთესო დრო მაისის ბოლოდან ოქტომბრის შუა
    რიცხვებამდეა, თუმცა ნამდვილ კალენდარს გზაზე მდებარე უღელტეხილი აწესებს.
  route: >-
    შატილის გზას გაჰყევით: საქართველოს სამხედრო გზით (ს3/E117) ჟინვალამდე, შემდეგ შ26-ით არაგვის ხეობაში
    ბარისახომდე, სადაც ასფალტი მთავრდება, მერე ხრეშით დათვისჯვრის უღელტეხილზე (დაახლოებით 2680 მ) და ქვევით
    შატილამდე — თბილისიდან 153 კმ. შატილიდან კიდევ დაახლოებით 11 კმ ვიწრო გრუნტის გზაა: არღუნის დინებას
    ანატორის აკლდამებამდე მიჰყვებით, მერე არდოტის ხეობას სოფლის ძირში მდებარე სადგომამდე აუყვებით — თბილისიდან
    სულ დაახლოებით 165 კმ და სულ ცოტა ხუთი საათი. მინიმუმი ნამდვილი, მაღალი კლირენსის 4x4-ია. საწვავი
    ჟინვალში ჩაასხით; ბარისახო ბოლო შანსია. უღელტეხილზე თოვლი ჩვეულებრივ ოქტომბრიდან გაზაფხულის ბოლომდე
    დევს.
en:
  name: Mutso
  short: >-
    A medieval fortress-village of dry-laid schist on a crag above the Ardoti valley, 11 km beyond Shatili
    — saved from ruin and honoured by Europa Nostra.
  body: >-
    **Mutso does not so much stand on its crag as grow out of it: grey schist houses on three terraces,
    built of the same stone as the rock and laid without mortar.**


    The fortress-village stands about 1,880 metres above sea level, over the Ardoti valley in Pirikita
    Khevsureti, some 11 km beyond Shatili. Europa Nostra dates settlement here to at least the 10th century;
    Mutso was an outpost on the northern approaches, watching the roads into Georgia. In a 1931 account
    the ethnographer G. V. Demidov described three groups of fortifications, each gathered round its own
    tower and its own clan shrine, linked to the Daiauri, the Cholokashvili and Torghva. The houses rise
    two to four storeys, joined by narrow passages and stone stairs; the upper terrace, a small acropolis,
    holds the main shrine, a church and towers. At the foot of the slope stand akldamas — above-ground
    stone vaults where the dead were laid on the floor and on stone benches.


    By the early 20th century the upper village was almost empty; in 1928 the writer Vladimir Gurko-Kryazhin
    called it a "dead city". In 2014 the National Agency for Cultural Heritage Preservation began a rescue.
    Dry schist masonry had nearly died out, so Kist craftsmen from a neighbouring region taught local
    workers the technique; a cable system hauled stone up the mountain, and a small hydro plant on the
    river supplied power. In 2019 the work won a European Heritage Award / Europa Nostra Award, then the
    Public Choice Award.


    Tradition says Torghva built Mutso, and that the stones were passed hand to hand, in a human chain,
    all the way from Anatori.


    Stand on the upper terrace and the idea behind the place becomes plain: rock, wall and house were
    never meant to be told apart.
  tip: >-
    Allow two to three hours on site. The stone stairs are steep and exposed in places, so wear boots
    with a good grip, and skip the upper terrace if heights trouble you. There is no water, food or toilet
    at Mutso; sleep in Shatili or at Ardoti, further up the valley. The shrines are still sacred to the
    Khevsurs: don't touch offerings or step inside shrine enclosures, and note that by highland custom
    women keep their distance from them. Carry your passport — this is a border zone. The best months
    are late May to mid-October, but the pass on the way in sets the real calendar.
  route: >-
    Follow the Shatili route: the Georgian Military Highway (S3/E117) to Zhinvali, the Sh26 up the Aragvi
    valley to Barisakho, where the asphalt ends, then gravel over the Datvisjvari Pass (about 2,680 m)
    and down to Shatili, 153 km from Tbilisi. From Shatili continue about 11 km on a narrow unpaved track
    down the Argun past the Anatori crypts and up the Ardoti valley to the parking area below the village
    — around 165 km and at least five hours from Tbilisi. A proper high-clearance 4x4 is the minimum.
    Fill up in Zhinvali; Barisakho is the last chance. The pass is normally snowbound from October to
    late spring.
ru:
  name: Муцо
  short: >-
    Средневековое село-крепость из сланца сухой кладки на утёсе над долиной Ардоти, в 11 км за Шатили:
    спасено от разрушения и отмечено премией «Европа Ностра».
  body: >-
    **Муцо не столько стоит на своём утёсе, сколько вырастает из него: серые сланцевые дома на трёх террасах,
    сложенные из того же камня, что и скала, и без раствора.**


    Село-крепость стоит на высоте около 1880 метров над уровнем моря, над долиной Ардоти в Пирикитской
    Хевсуретии, примерно в 11 км за Шатили. По данным организации «Европа Ностра», люди жили здесь по
    меньшей мере с X века; Муцо был форпостом на северных подступах и стерёг дороги в Грузию. В описании
    1931 года этнограф Г. В. Демидов выделил три группы укреплений, каждая из которых собрана вокруг своей
    башни и своего родового святилища и связана с Дайаури, Чолокашвили и Торгвой. Дома поднимаются на
    два–четыре этажа и соединены узкими проходами и каменными лестницами; на верхней террасе, маленьком
    акрополе, стоят главное святилище, церковь и башни. У подножия склона — аклдамы: наземные каменные
    склепы, где умерших укладывали на пол и на каменные скамьи.


    К началу XX века верхнее село почти опустело; в 1928 году писатель Владимир Гурко-Кряжин назвал его
    «мёртвым городом». В 2014 году Национальное агентство по охране культурного наследия начало спасательные
    работы. Сухая сланцевая кладка как ремесло почти исчезла, поэтому кистинские мастера из соседнего
    края обучили этой технике местных рабочих; камень поднимали в гору канатной системой, а электричество
    давала маленькая ГЭС на реке. В 2019 году работа получила Премию Европейского союза в области культурного
    наследия «Европа Ностра», а затем и приз зрительских симпатий.


    Предание гласит, что Муцо построил Торгва и что камни передавали из рук в руки, живой цепью, от самого
    Анатори.


    Встаньте на верхней террасе — и замысел этого места станет ясен: скалу, стену и дом никто и не собирался
    отличать друг от друга.
  tip: >-
    Отведите на осмотр два–три часа. Каменные лестницы крутые и местами открытые, так что надевайте ботинки
    с хорошим сцеплением, а если боитесь высоты, пропустите верхнюю террасу. В Муцо нет ни воды, ни еды,
    ни туалета; ночуйте в Шатили или в Ардоти, выше по долине. Святилища по-прежнему священны для хевсуров:
    не трогайте подношения и не заходите в ограды святилищ, а также учтите, что по горскому обычаю женщины
    держатся от них на расстоянии. Возьмите паспорт — это пограничная зона. Лучшие месяцы — с конца мая
    до середины октября, но настоящий календарь диктует перевал по дороге сюда.
  route: >-
    Следуйте маршрутом на Шатили: Военно-Грузинская дорога (S3/E117) до Жинвали, Sh26 вверх по долине
    Арагви до Барисахо, где кончается асфальт, затем гравий через перевал Датвисджвари (около 2680 м)
    и спуск к Шатили, в 153 км от Тбилиси. От Шатили продолжайте ещё около 11 км по узкой грунтовке вниз
    по Аргуну мимо склепов Анатори и вверх по долине Ардоти до стоянки под селом — всего около 165 км
    и не меньше пяти часов от Тбилиси. Настоящий внедорожник 4x4 с высоким клиренсом — это минимум. Заправьтесь
    в Жинвали; Барисахо — последний шанс. Перевал обычно засыпан снегом с октября до конца весны.
fa:
  name: موتسو
  short: >-
    دژ-روستایی از سده‌های میانه، از شیست خشکه‌چین بر صخره‌ای بالای درهٔ آردوتی، ۱۱ کیلومتر آن سوی شاتیلی؛
    نجات‌یافته از ویرانی و برندهٔ جایزهٔ اروپا نوسترا.
  body: >-
    **موتسو نه چندان بر صخره‌اش ایستاده که از دل آن روییده است: خانه‌های خاکستری از سنگ شیست بر سه تراس،
    ساخته از همان سنگِ صخره و بی‌ملات چیده شده.**


    این دژ-روستا در ارتفاع حدود ۱۸۸۰ متری از سطح دریا، بر فراز درهٔ آردوتی در پیریکیتا خوسورتی ایستاده
    است، حدود ۱۱ کیلومتر آن سوی شاتیلی. اروپا نوسترا قدمت سکونت در اینجا را دست‌کم به سدهٔ دهم می‌رساند؛
    موتسو پاسگاهی بر راه‌های شمالی بود و گذرگاه‌های ورود به گرجستان را می‌پایید. در گزارشی از سال ۱۹۳۱،
    قوم‌نگار گ. و. دمیدوف از سه مجموعه استحکامات سخن گفت که هر یک گرد برج خود و زیارتگاه طایفه‌ای خود
    فراهم آمده بود و به دایائوری، چولوکاشویلی و تورغوا پیوند داشت. خانه‌ها دو تا چهار طبقه بالا می‌روند
    و با گذرگاه‌های باریک و پلکان‌های سنگی به هم راه دارند؛ تراس بالایی، آکروپولی کوچک، زیارتگاه اصلی،
    یک کلیسا و برج‌ها را در خود دارد. در پای شیب «آکلداما»ها ایستاده‌اند: دخمه‌های سنگی روی زمین که مردگان
    را در آن‌ها بر کف و بر سکوهای سنگی می‌نهادند.


    تا آغاز سدهٔ بیستم، روستای بالایی تقریباً خالی شده بود؛ در ۱۹۲۸ نویسنده ولادیمیر گورکو-کریاژین آن
    را «شهری مرده» خواند. در ۲۰۱۴ آژانس ملی حفاظت از میراث فرهنگی کار نجات آن را آغاز کرد. سنگ‌چینی خشکه
    با شیست تقریباً از یاد رفته بود، از این رو استادکاران کیست از منطقه‌ای همسایه این فن را به کارگران
    محلی آموختند؛ یک سامانهٔ کابلی سنگ‌ها را از کوه بالا می‌کشید و نیروگاه آبی کوچکی بر رودخانه برق را
    تأمین می‌کرد. در ۲۰۱۹ این کار جایزهٔ میراث اروپا / جایزهٔ اروپا نوسترا و سپس جایزهٔ انتخاب مردمی را
    از آن خود کرد.


    سنت می‌گوید تورغوا موتسو را ساخت و سنگ‌ها دست به دست، در زنجیره‌ای انسانی، از آناتوری تا اینجا رسانده
    شدند.


    بر تراس بالایی بایستید تا اندیشهٔ نهفته در این مکان آشکار شود: صخره، دیوار و خانه هرگز قرار نبود از
    هم بازشناخته شوند.
  tip: >-
    دو تا سه ساعت برای دیدن محل در نظر بگیرید. پلکان‌های سنگی پرشیب‌اند و جاهایی بی‌حفاظ، پس کفش کوهی
    با چسبندگی خوب بپوشید و اگر از ارتفاع می‌ترسید، از تراس بالایی چشم بپوشید. در موتسو آب، غذا یا سرویس
    بهداشتی نیست؛ شب را در شاتیلی یا در آردوتی، بالاتر در همین دره، بمانید. زیارتگاه‌ها هنوز برای خوسورها
    مقدس‌اند: به نذورات دست نزنید و به درون محوطهٔ زیارتگاه‌ها پا نگذارید، و بدانید که بنا بر رسم کوهستان،
    زنان از آن‌ها فاصله می‌گیرند. گذرنامه همراه داشته باشید؛ اینجا منطقهٔ مرزی است. بهترین ماه‌ها از اواخر
    مه تا نیمهٔ اکتبر است، اما تقویم واقعی را گردنهٔ سر راه تعیین می‌کند.
  route: >-
    مسیر شاتیلی را دنبال کنید: جادهٔ نظامی گرجستان (S3/E117) تا ژینوالی، Sh26 در درهٔ آراگوی تا باریساخو،
    جایی که آسفالت تمام می‌شود، سپس جادهٔ شنی از گردنهٔ داتویسجواری (حدود ۲۶۸۰ متر) و سرازیری تا شاتیلی،
    ۱۵۳ کیلومتر از تفلیس. از شاتیلی حدود ۱۱ کیلومتر دیگر روی راهی خاکی و باریک ادامه دهید: در امتداد رود
    آرگون رو به پایین، از کنار دخمه‌های آناتوری، و سپس رو به بالا در درهٔ آردوتی تا پارکینگ زیر روستا؛
    روی هم حدود ۱۶۵ کیلومتر و دست‌کم پنج ساعت از تفلیس. خودروی چهارچرخ‌محرک واقعی با فاصلهٔ زیاد از زمین
    حداقلِ لازم است. در ژینوالی باک را پر کنید؛ باریساخو آخرین فرصت است. گردنه معمولاً از اکتبر تا اواخر
    بهار زیر برف است.
he:
  name: מוצו
  short: >-
    כפר מבצר מימי הביניים, בנוי משיסט בבנייה יבשה על צוק מעל עמק ארדוטי, 11 ק"מ מעבר לשאטילי – ניצל מהרס
    וזכה בפרס אירופה נוסטרה.
  body: >-
    **מוצו אינו רק עומד על הצוק שלו – הוא צומח מתוכו: בתי שיסט אפורים על שלוש טרסות, בנויים מאותה אבן
    שממנה עשוי הסלע ונבנו בלי טיט.**


    כפר המבצר ניצב בגובה של כ־1,880 מטרים מעל פני הים, מעל עמק ארדוטי בפיריקיטה חבסורתי, כ־11 ק"מ מעבר
    לשאטילי. אירופה נוסטרה מתארכת את היישוב כאן לפחות למאה ה־10; מוצו היה מוצב קדמי בגישות הצפוניות, ששמר
    על הדרכים אל גאורגיה. בתיאור משנת 1931 הבחין האתנוגרף ג. ו. דמידוב בשלוש קבוצות של ביצורים, שכל אחת
    מהן מקובצת סביב מגדל משלה ומקדש חמולה משלה, והן קשורות לבני דאיאורי, לבני צ'ולוקשווילי ולטורגווה.
    הבתים מתנשאים לגובה של שתיים עד ארבע קומות ומחוברים במעברים צרים ובמדרגות אבן; בטרסה העליונה, אקרופוליס
    קטן, עומדים המקדש הראשי, כנסייה ומגדלים. למרגלות המדרון ניצבות אקלדמות – מבני קבורה מאבן מעל פני הקרקע,
    שבהם הונחו המתים על הרצפה ועל ספסלי אבן.


    עד תחילת המאה ה־20 הכפר העליון התרוקן כמעט לגמרי; ב־1928 כינה אותו הסופר ולדימיר גורקו־קריאז'ין "עיר
    מתה". ב־2014 פתחה הסוכנות הלאומית לשימור המורשת התרבותית במבצע הצלה. מלאכת הבנייה היבשה בשיסט כמעט
    נשכחה, ולכן בעלי מלאכה קיסטים מאזור שכן לימדו את הפועלים המקומיים את הטכניקה; מערכת כבלים העלתה את
    האבנים במעלה ההר, ותחנת כוח הידרואלקטרית קטנה על הנהר סיפקה חשמל. ב־2019 זכתה העבודה בפרס המורשת האירופי
    / פרס אירופה נוסטרה, ואחר כך גם בפרס בחירת הקהל.


    המסורת מספרת שטורגווה בנה את מוצו, ושהאבנים הועברו מיד ליד, בשרשרת אנושית, כל הדרך מאנאטורי.


    עמדו על הטרסה העליונה והרעיון שמאחורי המקום יתבהר: הסלע, החומה והבית מעולם לא נועדו להיות נבדלים זה
    מזה.
  tip: >-
    הקדישו שעתיים עד שלוש לאתר. מדרגות האבן תלולות ובמקומות חשופות, אז נעלו נעליים עם אחיזה טובה, ואם
    גבהים מלחיצים אתכם – ותרו על הטרסה העליונה. במוצו אין מים, אוכל או שירותים; לינו בשאטילי או בארדוטי,
    במעלה העמק. המקדשים עדיין קדושים לחבסורים: אל תיגעו במנחות ואל תיכנסו לתחומי המקדשים, ושימו לב שלפי
    מנהג ההרים נשים שומרות מהם מרחק. קחו דרכון – זהו אזור גבול. החודשים הטובים ביותר הם סוף מאי עד אמצע
    אוקטובר, אבל את הלוח האמיתי קובע המעבר שבדרך.
  route: >-
    סעו במסלול לשאטילי: הכביש הצבאי הגאורגי (S3/E117) עד ז'ינוואלי, כביש Sh26 במעלה עמק האראגווי עד בריסאחו,
    שם נגמר האספלט, ואז חצץ מעל מעבר דטוויסג'ווארי (כ־2,680 מ') ומטה עד שאטילי, 153 ק"מ מטביליסי. משאטילי
    המשיכו עוד כ־11 ק"מ בדרך עפר צרה במורד נהר הארגון, על פני קברי אנאטורי, ובמעלה עמק ארדוטי עד החניון
    שמתחת לכפר – בסך הכול כ־165 ק"מ ולפחות חמש שעות מטביליסי. רכב 4x4 אמיתי וגבוה הוא המינימום. תדלקו
    בז'ינוואלי; בריסאחו היא ההזדמנות האחרונה. המעבר בדרך כלל חסום בשלג מאוקטובר ועד סוף האביב.
ar:
  name: موتسو
  short: >-
    قرية حصينة من العصور الوسطى من الشيست المرصوف بلا ملاط فوق وادي أردوتي، على بعد 11 كم وراء شاتيلي؛
    أُنقذت من الخراب ونالت جائزة أوروبا نوسترا.
  body: >-
    **لا تقف موتسو على جرفها بقدر ما تنبت منه: بيوت رمادية من الشيست على ثلاث مصاطب، مبنية من حجر الصخرة
    نفسه ومرصوفة بلا ملاط.**


    تقوم القرية الحصينة على ارتفاع نحو 1880 متراً فوق سطح البحر، مشرفةً على وادي أردوتي في خيفسوريتي بيريكيتا،
    على بعد نحو 11 كم بعد شاتيلي. تُرجع «أوروبا نوسترا» الاستيطان هنا إلى القرن العاشر على الأقل؛ وكانت
    موتسو موقعاً متقدماً على المداخل الشمالية يرقب الطرق المؤدية إلى جورجيا. وفي وصف يعود إلى عام 1931
    ميّز عالم الإثنوغرافيا غ. ف. ديميدوف ثلاث مجموعات من التحصينات، تلتف كل منها حول برجها ومزار عشيرتها،
    وترتبط بآل دايياوري وآل تشولوكاشفيلي وبتورغفا. ترتفع البيوت من طابقين إلى أربعة، وتصل بينها ممرات
    ضيقة وأدراج حجرية؛ أما المصطبة العليا، وهي أكروبوليس صغير، فتضم المزار الرئيسي وكنيسة وأبراجاً. وعند
    سفح المنحدر تقوم «الأكلدامات»، وهي أقبية حجرية فوق الأرض كان الموتى يُمدَّدون فيها على الأرضية وعلى
    مصاطب حجرية.


    بحلول مطلع القرن العشرين كانت القرية العليا شبه خالية؛ وفي عام 1928 وصفها الكاتب فلاديمير غوركو-كريازين
    بأنها «مدينة ميتة». وفي عام 2014 بدأت الوكالة الوطنية لحماية التراث الثقافي عملية إنقاذ. كانت حرفة
    البناء الجاف بالشيست قد كادت تندثر، فعلّم حرفيون من الكيست، قدموا من منطقة مجاورة، العمالَ المحليين
    هذه التقنية؛ ورفع نظام من الكابلات الحجارةَ إلى أعلى الجبل، وزوّدت محطة كهرومائية صغيرة على النهر
    الموقع بالكهرباء. وفي عام 2019 نال العمل جائزة التراث الأوروبي / جائزة أوروبا نوسترا، ثم جائزة اختيار
    الجمهور.


    يقول التقليد إن تورغفا بنى موتسو، وإن الحجارة نُقلت من يد إلى يد، في سلسلة بشرية، من أناتوري حتى هنا.


    قفوا على المصطبة العليا تتضح لكم الفكرة الكامنة وراء المكان: لم يُرَد قط للصخرة والجدار والبيت أن
    يُميَّز بعضها من بعض.
  tip: >-
    خصّصوا ساعتين إلى ثلاث ساعات للموقع. الأدراج الحجرية شديدة الانحدار ومكشوفة في بعض المواضع، فارتدوا
    أحذية جيدة التماسك، وتجاوزوا المصطبة العليا إن كانت المرتفعات تزعجكم. لا ماء ولا طعام ولا دورة مياه
    في موتسو؛ بيتوا في شاتيلي أو في أردوتي، أعلى الوادي. ما زالت المزارات مقدسة عند الخيفسوريين: لا تلمسوا
    القرابين ولا تدخلوا أسوار المزارات، واعلموا أن النساء، بحسب عادات أهل الجبال، يبقين على مسافة منها.
    احملوا جوازات سفركم، فهذه منطقة حدودية. أفضل الأشهر من أواخر مايو إلى منتصف أكتوبر، لكن الممر الذي
    تعبرونه في الطريق هو الذي يحدد التقويم الحقيقي.
  route: >-
    اتبعوا طريق شاتيلي: الطريق العسكري الجورجي (S3/E117) إلى جينفالي، ثم الطريق Sh26 صعوداً في وادي أراغفي
    حتى باريساخو، حيث ينتهي الإسفلت، ثم طريق حصوي عبر ممر داتفيسجفاري (نحو 2680 م) نزولاً إلى شاتيلي،
    على بعد 153 كم من تبليسي. ومن شاتيلي تابعوا نحو 11 كم أخرى على مسلك ضيق غير معبّد نزولاً مع نهر أرغون
    مروراً بمدافن أناتوري، ثم صعوداً في وادي أردوتي حتى الموقف أسفل القرية: نحو 165 كم وخمس ساعات على
    الأقل من تبليسي. سيارة دفع رباعي حقيقية مرتفعة عن الأرض هي الحد الأدنى. املؤوا الخزان في جينفالي؛
    فباريساخو هي الفرصة الأخيرة. عادةً ما يغطي الثلج الممر من أكتوبر حتى أواخر الربيع.
