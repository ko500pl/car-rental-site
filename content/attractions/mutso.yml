ka:
  name: მუცო
  short: მიტოვებული ხევსურული ციხე-სოფელი კლდოვან კონცხზე, შატილიდან ცამეტი კილომეტრით აღმოსავლეთით.
  body: >-
    **მუცო მიტოვებული ციხე-სოფელია, კლდოვან კონცხზე დაწყობილი ანდაქის ხეობის თავზე, შატილიდან ცამეტი კილომეტრით
    შორს და ბევრად უფრო ძნელად მისადგომი.** ოცდაათამდე ქვის სახლი კონცხზე ოთხ იარუსად ადის, მათ ზემოთ
    ოთხი საბრძოლო კოშკია, და მთელი ეს რამ დასახლებად კი არა, ერთ ნაგებობად იკითხება.


    სოფელი XIX საუკუნეში დაცარიელდა. 1960-იანი წლებისთვის ის ჩამონგრეული ნანგრევი იყო ისეთ ფერდობზე, სადაც
    ასვლას არ ურჩევდნენ. 2014-2019 წლებში კონსერვაციის პროექტმა კოშკები გაამაგრა, კიბე-ბილიკები აღადგინა
    და კედლები დაასტაბილურა ისე, რომ არ გაალამაზა; სამუშაომ 2019 წელს ევროპული მემკვიდრეობის ჯილდო მიიღო
    და თავისთავად ღირს შემჩნევა, რადგან უჩვეულოდ თავშეკავებულია.


    რას ხედავ, თანმიმდევრობით, ასვლისას:


    - სამარხი აკლდამები კონცხის ძირში, დაბალი ქვის უჯრედები, სადაც მიცვალებულებს ხის თაროებზე აწვენდნენ


    - ქვედა სახლების ნანგრევები, მუხლის სიმაღლის კარები, დიდი ხნის წინ გამქრალი იატაკები


    - ოთხი კოშკი, კვადრატული და დაზიანებული; ზედა მთელ ხეობას აკონტროლებს


    - ბილიკთან ახლოს ნაწყობი ქვის სალოცავი — ხევსურული ხატი, დღემდე მოქმედი, რომელსაც ქალები ტრადიციულად
    არ უახლოვდებიან


    ქვემოთ და ხეობის ზემოთ არდოტია, კიდევ ერთი მიტოვებული სოფელი, შატილიდან მომავალ გზაზე კი ანატორის
    აკლდამებს ჩაუვლი, სადაც შავი ჭირით დაავადებულები მისაკვდავად მიდიოდნენ და სადაც ღიობებში დღემდე ჩანს
    ძვლები. ხევსურეთი ამას სტუმრებისთვის არ არბილებს.


    პარკინგიდან ასვლა აღდგენილ ქვის ბილიკზე ოც-ოცდაათ წუთს იღებს, ადგილ-ადგილ ციცაბოა და ღიაა, ყველაზე
    ცუდ მონაკვეთზე ჯაჭვის სახელურია.
  tip: >-
    პარკინგიდან ორნახევარი საათი, მეტი — თუ არდოტამდე გაივლი. კარგი ჩექმა აუცილებელია და ბილიკი მათთვის
    არაა, ვისაც სიმაღლე აწუხებს. წყალი, ტუალეტი, ჩრდილი და მაღაზია არ არის. პატივი ეცი ძეგლის ძირში მდგარ
    სალოცავს: ხელი არ ახლო, შესაწირავი არ გადაიღო და გაითვალისწინე, რომ ადგილობრივი წესით ქალები მას არ
    უახლოვდებიან. რეალურად მუცოს შატილში ღამის გათევასთან ერთად ნახულობენ — თბილისიდან ერთ დღეში მისვლა-წამოსვლა
    ნიშნავს რვა-ათ საათს საჭესთან ძალიან ცუდ გზაზე.
  route: >-
    თბილისიდან სამხედრო გზით ჟინვალამდე მიდიხარ, შემდეგ ხევსურეთის გზით აღმოსავლეთით ფშავის არაგვის აყოლებით
    ბარისახოზე, დათვისჯვრის უღელტეხილზე 2676 მეტრზე და არღუნის ხეობით შატილამდე — დაახლოებით 155 კმ. მუცო
    კიდევ 13 კმ-ითაა აღმოსავლეთით, ანდაქის ხეობაში: სულ 168 კმ და სულ მცირე ხუთი საათი. ასფალტი მხოლოდ
    პირველ მონაკვეთზეა; ბარისახოს შემდეგ გზა ხრეშია, ვიწრო, გრძელი უფსკრულების პირას მოაჯირის გარეშე,
    უღელტეხილზე კი ოქტომბრიდან მაისის ბოლომდე თოვლი დევს და გზა ოფიციალურად დაკეტილია. მაღალკლირენსიანი
    ჯიპი არჩევანი კი არა, პირობაა. ბოლო საწვავი ჟინვალშია.
en:
  name: Mutso
  short: An abandoned Khevsur fortress village stacked on a rock spur, thirteen kilometres east of Shatili.
  body: >-
    **Mutso is a ruined fortress village stacked on a rock spur above the Andaki gorge, thirteen kilometres
    beyond Shatili and much harder to reach.** Around thirty stone houses climb the spur in four tiers,
    with four defensive towers above them, and the whole thing reads as a single structure rather than
    a settlement.


    It was abandoned in the 19th century. By the 1960s it was a collapsing ruin on a slope that visitors
    were told not to climb. Between 2014 and 2019 a conservation project stabilised the towers, rebuilt
    the stair paths and consolidated the walls without prettifying them; the work received a European
    heritage award in 2019 and is worth noticing in its own right, because it is unusually restrained.


    What you see, in order, walking up:


    - the burial crypts at the foot of the spur, low stone cells where the dead were laid on wooden shelves


    - the ruined lower houses, doorways at knee height, floors long gone


    - the four towers, square and battered, the topmost commanding the whole gorge


    - a shrine of piled stone near the path, a Khevsur khati still in use, which women traditionally do
    not approach


    Further up the valley lies Ardoti, another abandoned village, and on the way in from Shatili you pass
    the Anatori crypts, where plague victims went to die and where bones are still visible through the
    openings. Khevsureti softens none of this for visitors.


    The climb from the parking area is twenty to thirty minutes on a rebuilt stone path, steep and exposed
    in places, with a chain handline on the worst section. Once you are among the houses the scale becomes
    clear: rooms two metres square, walls a metre thick, and windows aimed at the path rather than at
    the view.
  tip: >-
    Two and a half hours from the car park, more if you walk on towards Ardoti. Good boots are essential,
    and the path is not for anyone unhappy with exposure. There is no water, no toilet, no shade and no
    shop. Respect the shrine at the foot of the site: do not touch it, do not photograph the offerings,
    and note that local custom keeps women away from it. Realistically Mutso is done as part of an overnight
    stay in Shatili — driving in and out from Tbilisi in one day means eight to ten hours at the wheel
    on very bad road.
  route: >-
    From Tbilisi take the Military Highway north to Zhinvali, then the Khevsureti road east up the Pshavis
    Aragvi through Barisakho, over the Datvisjvari Pass at 2,676 metres and down the Arghuni to Shatili
    — about 155 km. Mutso is a further 13 km east up the Andaki valley: 168 km and at least five hours
    in total. Only the first section is asphalt; beyond Barisakho the road is gravel, narrow and unfenced
    above long drops, and the pass holds snow from October to late May, when the road is officially closed.
    A high-clearance 4x4 is not optional. The last fuel is at Zhinvali.
ru:
  name: Муцо
  short: Заброшенное хевсурское село-крепость на скальном отроге, в тринадцати километрах восточнее Шатили.
  body: >-
    **Муцо — заброшенное село-крепость, сложенное на скальном отроге над ущельем Андаки, в тринадцати
    километрах за Шатили и куда труднее достижимое.** Около тридцати каменных домов поднимаются по отрогу
    четырьмя ярусами, над ними стоят четыре боевые башни, и всё вместе читается как одно сооружение, а
    не как поселение.


    Село опустело в XIX веке. К 1960-м это была осыпающаяся руина на склоне, куда приезжим не советовали
    лезть. В 2014-2019 годах проект консервации укрепил башни, восстановил лестничные тропы и стабилизировал
    стены, не приукрашивая их; работа получила европейскую награду в области наследия в 2019 году и заслуживает
    внимания сама по себе, потому что выполнена необычно сдержанно.


    Что вы видите, поднимаясь, по порядку:


    - погребальные склепы у подножия отрога, низкие каменные камеры, где умерших клали на деревянные полки


    - развалины нижних домов, дверные проёмы по колено, перекрытий давно нет


    - четыре башни, квадратные и побитые; верхняя контролирует всё ущелье


    - святилище из сложенных камней у тропы — хевсурский хати, действующий до сих пор, к которому по обычаю
    не подходят женщины


    Выше по долине лежит Ардоти, ещё одно покинутое село, а по дороге от Шатили вы проезжаете склепы Анатори,
    куда уходили умирать заболевшие чумой и где в проёмах до сих пор видны кости. Хевсурети ничего из
    этого для приезжих не смягчает.


    Подъём от стоянки занимает двадцать-тридцать минут по восстановленной каменной тропе, местами крутой
    и открытой, с цепью-перилами на худшем участке.
  tip: >-
    Два с половиной часа от парковки, больше — если пройти дальше к Ардоти. Хорошие ботинки обязательны,
    и тропа не для тех, кому неуютно на высоте. Ни воды, ни туалета, ни тени, ни магазина. Отнеситесь
    с уважением к святилищу у подножия: не трогайте его, не фотографируйте приношения и учтите, что по
    местному обычаю женщины к нему не подходят. Реально Муцо смотрят, ночуя в Шатили: съездить из Тбилиси
    и обратно за день — это восемь-десять часов за рулём по очень плохой дороге.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге до Жинвали, затем по хевсурской дороге на восток вверх по Пшавской
    Арагви через Барисахо, через перевал Датвисджвари на 2676 метрах и вниз по Аргуни до Шатили — около
    155 км. Муцо ещё в 13 км восточнее, вверх по ущелью Андаки: всего 168 км и не менее пяти часов. Асфальт
    только на первом отрезке; за Барисахо дорога гравийная, узкая, без ограждений над длинными обрывами,
    а на перевале снег лежит с октября до конца мая, когда дорога официально закрыта. Внедорожник с большим
    клиренсом здесь не вариант, а условие. Последняя заправка — в Жинвали.
fa:
  name: موتسو
  short: روستا-دژ متروک خوسور بر زبانه‌ای صخره‌ای، سیزده کیلومتر شرق شاتیلی.
  body: >-
    **موتسو روستایی دژمانند و ویران است که بر زبانه‌ای صخره‌ای بالای درهٔ آنداکی چیده شده، سیزده کیلومتر
    آن‌سوی شاتیلی و بسیار دشوارتر برای رسیدن.** نزدیک سی خانهٔ سنگی در چهار طبقه بر زبانه بالا می‌روند
    و بالای آنها چهار برج دفاعی ایستاده است، و همهٔ این مجموعه بیش از آنکه آبادی به نظر برسد، یک بنای
    واحد خوانده می‌شود.


    روستا در سدهٔ نوزدهم متروک شد. تا دههٔ 1960 ویرانه‌ای در حال فرو ریختن بود بر دامنه‌ای که به بازدیدکنندگان
    می‌گفتند از آن بالا نروند. میان 2014 و 2019 پروژه‌ای برای حفاظت برج‌ها را استوار کرد، پلکان-راه‌ها
    را بازساخت و دیوارها را تثبیت کرد بی‌آنکه آنها را بیاراید؛ این کار در 2019 جایزهٔ میراث اروپایی گرفت
    و خودش دیدنی است، چون به‌طرزی غیرمعمول خویشتن‌دار است.


    آنچه به‌ترتیب هنگام بالا رفتن می‌بینید:


    - سردابه‌های گور در پای زبانه، اتاقک‌های سنگی کوتاه که مردگان را در آنها بر تخته‌های چوبی می‌خواباندند


    - ویرانهٔ خانه‌های پایینی، با درگاه‌هایی تا بلندای زانو و کف‌هایی که دیرگاهی است نمانده


    - چهار برج، چهارگوش و فرسوده، که بالاترین‌شان بر تمام دره مسلط است


    - زیارتگاهی از سنگ چیده‌شده نزدیک راه، یک خاتیِ خوسور که هنوز در کار است و زنان به رسم کهن به آن نزدیک
    نمی‌شوند


    بالاتر در دره آردوتی است، روستایی متروک دیگر، و در راه ورود از شاتیلی از کنار سردابه‌های آناتوری می‌گذرید،
    جایی که بیماران طاعون برای مردن می‌رفتند و هنوز از میان روزنه‌ها استخوان دیده می‌شود. خوسورتی هیچ‌یک
    از اینها را برای مهمانان نرم نمی‌کند.


    بالا رفتن از پارکینگ بیست تا سی دقیقه روی راه‌پله‌ای سنگی و بازسازی‌شده است، جاهایی تند و بی‌پناه،
    با زنجیری دستگیر در بدترین بخش.
  tip: >-
    دو ساعت و نیم از پارکینگ، و بیشتر اگر تا آردوتی پیش بروید. پوتین خوب ضروری است و مسیر برای کسی که
    از بلندی ناراحت می‌شود مناسب نیست. نه آبی هست، نه سرویس بهداشتی، نه سایه‌ای و نه مغازه‌ای. به زیارتگاه
    پای محوطه احترام بگذارید: به آن دست نزنید، از نذورات عکس نگیرید و بدانید که به رسم محلی زنان به آن
    نزدیک نمی‌شوند. واقع‌بینانه آن است که موتسو را در دل یک شب اقامت در شاتیلی ببینید؛ رفت و برگشت یک‌روزه
    از تفلیس یعنی هشت تا ده ساعت پشت فرمان روی جاده‌ای بسیار بد.
  route: >-
    از تفلیس با بزرگراه نظامی تا ژینوالی بروید، سپس با جادهٔ خوسورتی به شرق و بالا در امتداد آراگوی پشاوی
    از باریساخو، از گردنهٔ داتویسجواری در 2676 متر و پایین در درهٔ آرغونی تا شاتیلی — حدود 155 کیلومتر.
    موتسو 13 کیلومتر دیگر به شرق و بالای درهٔ آنداکی است: رویهم 168 کیلومتر و دست‌کم پنج ساعت. تنها بخش
    نخست آسفالت است؛ پس از باریساخو جاده شنی و باریک است و بالای پرتگاه‌های بلند بدون حفاظ، و بر گردنه
    از مهر تا اواخر اردیبهشت برف می‌ماند و جاده رسماً بسته است. خودروی چهارچرخ‌محرک با خلوص بالا انتخاب
    نیست، شرط است. آخرین سوخت در ژینوالی است.
he:
  name: מוצו
  short: כפר מבצר חווסורי נטוש הערוך על שלוחת סלע, שלושה עשר קילומטרים ממזרח לשאתילי.
  body: >-
    **מוצו הוא כפר מבצר חרב הערוך על שלוחת סלע מעל ערוץ אנדאקי, שלושה עשר קילומטרים מעבר לשאתילי וקשה
    בהרבה להגעה.** כשלושים בתי אבן מטפסים על השלוחה בארבע קומות, ומעליהם ארבעה מגדלי מגן, והכול נקרא כמבנה
    אחד ולא כיישוב.


    הכפר ננטש במאה ה-19. עד שנות השישים הוא היה חורבה מתמוטטת על מדרון שאמרו למבקרים לא לטפס בו. בין 2014
    ל-2019 ייצב פרויקט שימור את המגדלים, בנה מחדש את שבילי המדרגות וחיזק את הקירות בלי לייפות אותם; העבודה
    זכתה בפרס מורשת אירופי ב-2019 והיא ראויה לתשומת לב בפני עצמה, משום שהיא מאופקת באופן חריג.


    מה שרואים, לפי הסדר, בעלייה:


    - כוכי הקבורה למרגלות השלוחה, תאי אבן נמוכים שבהם הונחו המתים על מדפי עץ


    - חורבות הבתים התחתונים, פתחי כניסה בגובה הברך ורצפות שאינן עוד


    - ארבעת המגדלים, מרובעים וחבוטים, והעליון שולט על כל הערוץ


    - מקדש של אבנים ערומות ליד השביל, חאטי חווסורי שעדיין בשימוש, ונשים אינן ניגשות אליו לפי המנהג


    במעלה העמק שוכן ארדוטי, כפר נטוש נוסף, ובדרך פנימה משאתילי חולפים על פני כוכי אנאטורי, שאליהם הלכו
    חולי הדבר למות ושבהם עדיין נראות עצמות דרך הפתחים. חווסורתי אינה מרככת דבר מזה למבקרים.


    הטיפוס ממגרש החניה נמשך עשרים עד שלושים דקות בשביל אבן משוקם, תלול וחשוף במקומות, ובקטע הגרוע ביותר
    מתוחה שרשרת אחיזה.
  tip: >-
    שעתיים וחצי מן החניון, ויותר אם תמשיכו לכיוון ארדוטי. נעליים טובות הן חובה, והשביל אינו למי שחש רע
    בחשיפה. אין מים, אין שירותים, אין צל ואין חנות. כבדו את המקדש למרגלות האתר: אל תיגעו בו, אל תצלמו
    את המנחות, וזכרו שהמנהג המקומי מרחיק ממנו נשים. ריאלית מוצו נעשה כחלק מלינה בשאתילי — נסיעה הלוך ושוב
    מטביליסי ביום אחד פירושה שמונה עד עשר שעות בהגה על דרך גרועה מאוד.
  route: >-
    מטביליסי בכביש הצבא צפונה עד ז׳ינוואלי, ומשם בדרך חווסורתי מזרחה במעלה הפשאווי אראגווי דרך באריסאחו,
    מעל מעבר דאטוויסג׳ווארי בגובה 2,676 מטר ובמורד הארגוני עד שאתילי — כ-155 ק״מ. מוצו נמצא עוד 13 ק״מ
    מזרחה במעלה עמק אנדאקי: 168 ק״מ ולפחות חמש שעות בסך הכול. רק הקטע הראשון סלול; מעבר לבאריסאחו הדרך
    חצץ, צרה ובלי מעקה מעל תהומות ארוכות, ובמעבר נשאר שלג מאוקטובר עד סוף מאי, כשהדרך סגורה רשמית. רכב
    שטח עם מרווח גחון גבוה אינו אופציה אלא תנאי. תחנת הדלק האחרונה בז׳ינוואלי.
ar:
  name: موتسو
  short: قرية-حصن خيفسورية مهجورة مرصوصة على نتوء صخري، على بعد ثلاثة عشر كيلومتراً شرقي شاتيلي.
  body: >-
    **موتسو قرية-حصن خربة مرصوصة على نتوء صخري فوق وادي أنداكي، على بعد ثلاثة عشر كيلومتراً وراء شاتيلي
    وأصعب منها وصولاً بكثير.** يصعد نحو ثلاثين بيتاً حجرياً على النتوء في أربع طبقات، وفوقها أربعة أبراج
    دفاعية، ويُقرأ المجمع كله بناءً واحداً لا مستوطنة.


    هُجرت القرية في القرن التاسع عشر. وبحلول الستينيات صارت خراباً متداعياً على منحدر يُنصح الزوار بألا
    يتسلقوه. وبين 2014 و2019 ثبّت مشروع للحفاظ الأبراج، وأعاد بناء الدروب والدرجات، ورصّ الجدران دون تجميلها؛
    ونال العمل جائزة أوروبية للتراث عام 2019، وهو جدير بالانتباه بذاته لأنه مقتصد على نحو غير معتاد.


    ما تراه، بالترتيب، وأنت تصعد:


    - سراديب الدفن عند سفح النتوء، حجرات حجرية منخفضة كان الموتى يوضعون فيها على رفوف خشبية


    - أطلال البيوت السفلى، بمداخل في ارتفاع الركبة وأرضيات زالت منذ زمن


    - الأبراج الأربعة، مربعة ومنهكة، وأعلاها يشرف على الوادي كله


    - مزار من حجارة مرصوصة قرب الدرب، وهو خاتي خيفسوري ما زال في الاستعمال، ولا تقربه النساء وفق العرف


    وأعلى الوادي تقع أردوتي، قرية مهجورة أخرى، وفي الطريق الداخل من شاتيلي تمر بسراديب أناتوري، حيث كان
    مصابو الطاعون يذهبون ليموتوا وحيث ما تزال العظام تُرى من الفتحات. وخيفسوريتي لا تلطف شيئاً من ذلك
    للزوار.


    الصعود من ساحة الوقوف عشرون إلى ثلاثون دقيقة على درب حجري أعيد بناؤه، شديد الانحدار ومكشوف في مواضع،
    وفي أسوأ مقطع سلسلة تُمسك باليد.
  tip: >-
    ساعتان ونصف من موقف السيارات، وأكثر إن تابعت نحو أردوتي. الحذاء الجبلي الجيد ضروري، والدرب لا يناسب
    من ينزعج من الارتفاعات المكشوفة. لا ماء ولا دورة مياه ولا ظل ولا متجر. واحترم المزار عند سفح الموقع:
    لا تلمسه، ولا تصور النذور، واعلم أن العرف المحلي يبعد النساء عنه. وواقعياً تُزار موتسو ضمن مبيت في
    شاتيلي؛ فالذهاب والعودة من تبليسي في يوم واحد يعني ثماني إلى عشر ساعات خلف المقود على طريق سيئ جداً.
  route: >-
    من تبليسي على الطريق العسكري شمالاً حتى جينفالي، ثم على طريق خيفسوريتي شرقاً صعوداً مع أراغفي بشافي
    عبر باريساخو، وفوق ممر داتفيسجفاري عند 2676 متراً، ثم نزولاً مع أرغوني إلى شاتيلي — نحو 155 كم. وموتسو
    على بعد 13 كم أخرى شرقاً صعوداً في وادي أنداكي: أي 168 كم وخمس ساعات على الأقل إجمالاً. المقطع الأول
    وحده معبّد؛ وبعد باريساخو يصير الطريق حصوياً ضيقاً بلا حواجز فوق هبوط طويل، ويحتفظ الممر بالثلج من
    تشرين الأول إلى أواخر أيار حين يكون الطريق مغلقاً رسمياً. وسيارة دفع رباعي بخلوص عالٍ ليست خياراً
    بل شرطاً. آخر وقود في جينفالي.
