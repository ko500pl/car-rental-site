ka:
  name: უწერის მინერალური წყლები
  short: >-
    საკურორტო სოფელი რიონის ორივე ნაპირზე, ონიდან 10 კილომეტრში, სადაც ნაძვნარში მილებიდან უფასოდ მოედინება
    რკინის გემოიანი ბუნებრივი მჟავე წყალი.
  body: >-
    **უწერის წყალი მიწიდან უკვე აშუშხებული ამოდის, საუკუნის წინ კი ფრანგებთან საექსპორტო გარიგება ერთმა
    პირობამ ჩაშალა: სოფელს ის კვლავ უფასოდ უნდა დაელია.**


    სოფელი რიონის ორივე ნაპირზე, ონიდან დაახლოებით 10 კილომეტრში, ზღვის დონიდან 1 050 მეტრზე, ნაძვის,
    სოჭისა და წიფლის ტყეებში მდებარეობს. აქაური წყაროები ნახშირმჟავა, ჰიდროკარბონატული და რკინის შემცველია:
    წყალი ცივი ამოდის, ენას უკბენს და ლითონის მსუბუქ გემოს ტოვებს. ქართული სამედიცინო ლიტერატურა მას ღვიძლის,
    კუჭ-ნაწლავისა და საშარდე სისტემის დაავადებებისას ურჩევს. საკურორტო სეზონი მაისიდან ოქტომბრამდე გრძელდება;
    იანვრის საშუალო ტემპერატურა −5 °C-ია, აგვისტოსი — 17 °C.


    XVIII საუკუნეში ვახუშტი ბაგრატიონი აღწერდა რიონის ჩრდილოეთით მდგარ დიდ ეკლესიას, სიონს, რომლის კამარაში
    თამარ მეფისად მიჩნეული თმის ნაწნავი ეკიდა, და მიწის ნაკვეთს, რომლის სუნზეც ზედ გადამფრენი ფრინველები
    ძირს ცვიოდნენ. დღეს ეს ნახშირორჟანგის აღწერას მოგაგონებთ — სწორედ იმ გაზისა, რომელიც წყალს აშუშხებს.
    სიონის ნანგრევები დღესაც დგას, ახლოს კი გრანიტით ნაგები მცირე წმინდა გიორგის ეკლესია და ციხის ნაშთებია.
    1687 წელს უწერა რაჭაში ლაშქრობისას იმერეთის მეფე ალექსანდრე IV-მ გადაწვა.


    აქ გვერითის წყაროს ამბავს ყვებიან. ის XIX საუკუნის მიწურულს ძმები გამყრელიძეების მამულში აღმოაჩინეს,
    მას შემდეგ, რაც მისმა წყალმა ერთ-ერთი ძმა კუჭის მწვავე ტკივილისგან განკურნა. 1913–1914 წლებში ფრანგულმა
    კომერციულმა საზოგადოებამ წყლის ევროპაში გასატანად 45-წლიანი იჯარა შესთავაზა. ძმები დათანხმდნენ ერთი
    პირობით: ადგილობრივები წყლით კვლავ უფასოდ ისარგებლებდნენ. ფრანგებმა უარი თქვეს და გარიგება ჩაიშალა.


    1903–1904 წლების ფოტოს წარწერაში უწერა უკვე ოსეთის სამხედრო გზის კურორტადაა მოხსენიებული. წყაროები
    მას შემდეგ არ გაჩერებულა. ბოთლი თან იქონიეთ.
  tip: >-
    ერთი-ორი საათი სავსებით საკმარისია. საკუთარი ბოთლები ან ბიდონი თან წაიღეთ: წყალი უფასოა, ტარის ყიდვის
    იმედი კი ნუ გექნებათ. ძლიერ მინერალიზებული წყალი უფრო წამალია, ვიდრე გამაგრილებელი სასმელი — ერთი-ორი
    ჭიქა სიამოვნებაა, ლიტრობით დალევა კი არა, და თუ რაიმე დაავადება გაქვთ, ექიმს ჰკითხეთ. წყაროებთან მისასვლელი
    ბილიკები წვიმის შემდეგ ტალახდება. მომსახურება მინიმალურია, ბანკომატი არ არის, ამიტომ ნაღდი ფული და
    კვება ონში მოიმარაგეთ. ზამთარში თოვლს გზის რამდენიმე დღით ჩაკეტვა შეუძლია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით, შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით, შ17-ით ნაქერალას უღელტეხილი
    გადაიარეთ ამბროლაურამდე, შემდეგ კი შ16-ით რიონს ონამდე აჰყევით (დაახლოებით 295 კმ). უწერა იმავე შ16-ზე,
    კიდევ 11 კილომეტრშია: სულ დაახლოებით 305 კმ, გაუჩერებლად ხუთი საათი და მეოთხედი. გზა ახლანდელი რუკებით
    ასფალტიანია, მაგრამ ვიწრო, წვიმის შემდეგ კი სავალ ნაწილზე ქვა ყრია. გირჩევთ მაღალი გამავლობის მანქანას
    (ჯიპს) — არა ასფალტის, არამედ ჩამოცვენილი ქვის, ჩარეცხილი გვერდულებისა და ადრეული თუ გვიანი თოვლის
    გამო. ავზი ამბროლაურში შეავსეთ.
en:
  name: Utsera Mineral Springs
  short: >-
    A spa village on both banks of the Rioni, 10 km above Oni, where sparkling, iron-tinged water runs
    free from pipes among the firs.
  body: >-
    **Utsera's water comes out of the ground already fizzing, and a century ago a French export deal foundered
    on one condition: that the village should go on drinking it free.**


    The village sits on both banks of the Rioni about 10 km above Oni, at roughly 1,050 metres, among
    spruce, fir and beech. Its springs are carbonated, bicarbonate and iron-bearing; the water comes up
    cold, bites the tongue and leaves a faint taste of metal. Georgian medical references recommend it
    for complaints of the liver, stomach and urinary tract. The resort season runs from May to October;
    January averages −5 °C, August 17 °C.


    In the 18th century Vakhushti Bagrationi described a great church, Sioni, on the north side of the
    river, with a braid of hair said to be Queen Tamar's hanging in its vault, and a patch of ground whose
    smell made birds flying over it drop from the sky. Today that reads like a description of the carbon
    dioxide that also puts the fizz in the water. The ruins of Sioni survive, with a small granite church
    of St George and the remains of a fortress nearby. In 1687 King Alexander IV of Imereti burned Utsera
    on a campaign in Racha.


    The story told here concerns the Gveriti spring, found at the end of the 19th century on the land
    of the Gamkrelidze brothers after its water cured one of them of stomach pains. In 1913–1914 a French
    company offered a 45-year lease to bottle it for Europe. The brothers agreed, on condition that local
    people could keep drinking it free. The French refused, and the deal collapsed.


    A photograph from 1903–1904 already calls Utsera a resort on the Ossetian Military Road. The springs
    have not stopped since. Bring a bottle.
  tip: >-
    An hour or two is plenty. Bring your own bottles or a canister, because the water is free but containers
    are not reliably on sale. Strongly mineralised water is closer to medicine than refreshment: a glass
    or two is a pleasure, litres a day are not, so check with a doctor if you have a condition. Paths
    to the outlets turn muddy after rain. Services are minimal, with no ATM, so draw cash and plan meals
    in Oni. In winter snow can close the road for days.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km, turn north between Zestaponi and Kutaisi on
    the Sh19 through Terjola to Tkibuli, cross the Nakerala pass on the Sh17 to Ambrolauri, then follow
    the Sh16 up the Rioni to Oni (about 295 km). Utsera is 11 km further on the same Sh16, about 305 km
    in all and roughly five and a quarter hours without stops. The road is asphalt on current maps but
    narrow, with stones on it after rain. We recommend an SUV, not for the asphalt but for fallen rock,
    washed-out verges and early or late snow. Fill up in Ambrolauri.
ru:
  name: Минеральные источники Уцеры
  short: >-
    Курортное село на обоих берегах Риони, в 10 км выше Они: среди пихт из труб свободно бежит шипучая
    вода с привкусом железа.
  body: >-
    **Вода в Уцере выходит из земли уже шипучей, и сто лет назад из-за неё сорвалась сделка с французами:
    всё упёрлось в одно условие — село должно и дальше пить её бесплатно.**


    Село стоит на обоих берегах Риони, примерно в 10 км выше Они, на высоте около 1050 метров, среди елей,
    пихт и буков. Источники здесь углекислые, гидрокарбонатные, железистые: вода поднимается холодной,
    щиплет язык и оставляет лёгкий металлический привкус. Грузинские медицинские справочники рекомендуют
    её при болезнях печени, желудка и мочевыводящих путей. Курортный сезон длится с мая по октябрь; средняя
    температура января −5 °C, августа — 17 °C.


    В XVIII веке Вахушти Багратиони описал на северном берегу реки большую церковь Сиони, под сводом которой
    висела коса, по преданию принадлежавшая царице Тамар, и клочок земли, от запаха которого пролетавшие
    над ним птицы падали наземь. Сегодня это читается как описание углекислого газа — того самого, от
    которого пузырится и вода. Руины Сиони сохранились, рядом стоят маленькая гранитная церковь Святого
    Георгия и остатки крепости. В 1687 году имеретинский царь Александр IV сжёг Уцеру во время похода
    в Рачу.


    Здесь рассказывают историю источника Гверити. Его нашли в конце XIX века на земле братьев Гамкрелидзе,
    после того как его вода избавила одного из них от болей в желудке. В 1913–1914 годах французская компания
    предложила взять источник в аренду на 45 лет, чтобы разливать воду в бутылки для Европы. Братья согласились
    — при условии, что местные жители по-прежнему смогут пить её бесплатно. Французы отказались, и сделка
    расстроилась.


    Уже на фотографии 1903–1904 годов Уцера подписана как курорт на Военно-Осетинской дороге. С тех пор
    источники не умолкали ни разу. Захватите бутылку.
  tip: >-
    Часа-двух вполне достаточно. Везите свои бутылки или канистру: вода бесплатна, а вот тару здесь купить
    удаётся не всегда. Сильно минерализованная вода ближе к лекарству, чем к освежающему напитку: стакан-другой
    — удовольствие, литры каждый день — нет, так что при хронических болезнях посоветуйтесь с врачом.
    После дождя тропинки к источникам раскисают. Инфраструктура минимальна, банкомата нет: снимите наличные
    и спланируйте обед в Они. Зимой снег может перекрыть дорогу на несколько дней.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север на Sh19
    и через Терджолу доезжайте до Ткибули, затем по Sh17 через перевал Накерала — в Амбролаури, а оттуда
    по Sh16 вверх по Риони до Они (около 295 км). Уцера — ещё в 11 км по той же Sh16: всего около 305
    км, примерно пять с четвертью часов без остановок. По нынешним картам дорога асфальтирована, но узкая,
    а после дождя на ней лежат камни. Мы рекомендуем внедорожник — не из-за асфальта, а из-за камнепадов,
    размытых обочин и раннего или позднего снега. Заправьтесь в Амбролаури.
fa:
  name: چشمه‌های معدنی اوتسرا
  short: >-
    روستایی درمانی بر دو کرانهٔ ریونی، ۱۰ کیلومتر بالاتر از اونی، که آبِ گازدار و آهن‌دار در آن از لوله‌ها
    میان درختان نراد، رایگان روان است.
  body: >-
    **آبِ اوتسرا گازدار از دل زمین بیرون می‌آید، و یک قرن پیش قرارداد صادراتش با یک شرکت فرانسوی بر سر
    یک شرط به هم خورد: اینکه مردم روستا همچنان رایگان از آن بنوشند.**


    روستا بر هر دو کرانهٔ ریونی، حدود ۱۰ کیلومتر بالاتر از اونی و در ارتفاع تقریبی ۱,۰۵۰ متر، میان درختان
    نوئل، نراد و راش گسترده است. چشمه‌هایش گازدار (کربنیک)، بی‌کربناته و آهن‌دارند؛ آب سرد بیرون می‌آید،
    زبان را می‌گزد و طعم فلزیِ ملایمی به جا می‌گذارد. منابع پزشکی گرجی آن را برای ناراحتی‌های کبد، معده
    و مجاری ادراری توصیه می‌کنند. فصل استراحتگاه از مه تا اکتبر است؛ میانگین دمای ژانویه منفی ۵ و اوت
    ۱۷ درجهٔ سانتی‌گراد است.


    در سدهٔ هجدهم، واخوشتی باگراتیونی از کلیسای بزرگی به نام سیونی در کرانهٔ شمالی رود نوشت که در طاقش
    گیسوی بافته‌ای آویخته بود و می‌گفتند از آنِ ملکه تامار است، و نیز از تکه‌زمینی که بویش پرندگانِ در
    حال گذر را از آسمان بر زمین می‌انداخت. امروز این وصف به توصیف دی‌اکسید کربن می‌ماند، همان گازی که
    به آب هم حباب می‌بخشد. ویرانه‌های سیونی برجاست و در نزدیکی‌اش کلیسای کوچکِ گرانیتیِ گئورگی قدیس و
    بقایای یک دژ دیده می‌شود. در سال ۱۶۸۷ الکساندر چهارم، شاه ایمرتی، در لشکرکشی به راچا اوتسرا را به
    آتش کشید.


    روایتی که اینجا نقل می‌کنند به چشمهٔ گوِریتی مربوط است که در اواخر سدهٔ نوزدهم در زمین برادران گامکرلیدزه
    پیدا شد، پس از آنکه آبش یکی از آنان را از معده‌درد رهانید. در سال‌های ۱۹۱۳ تا ۱۹۱۴ یک شرکت فرانسوی
    پیشنهاد اجارهٔ ۴۵ ساله داد تا آب را برای اروپا بطری کند. برادران پذیرفتند، به شرط آنکه مردم محل بتوانند
    همچنان رایگان از آن بنوشند. فرانسوی‌ها نپذیرفتند و معامله سر نگرفت.


    عکسی از سال‌های ۱۹۰۳ تا ۱۹۰۴ اوتسرا را همان زمان «استراحتگاهی بر جادهٔ نظامی اوستی» می‌نامد. چشمه‌ها
    از آن روز تا کنون از جوشش نایستاده‌اند. یک بطری همراه بیاورید.
  tip: >-
    یکی دو ساعت کافی است. بطری یا گالن خودتان را بیاورید، چون آب رایگان است اما ظرف همیشه برای فروش پیدا
    نمی‌شود. آبِ پرمادهٔ معدنی بیشتر دارو است تا نوشیدنی خنک: یکی دو لیوان لذت است، روزی چند لیتر نه؛
    اگر بیماری خاصی دارید با پزشک مشورت کنید. راه‌های رسیدن به چشمه‌ها پس از باران گِلی می‌شود. امکانات
    بسیار اندک است و خودپرداز ندارد، پس پول نقد را در اونی بگیرید و وعده‌های غذا را همان‌جا برنامه‌ریزی
    کنید. در زمستان برف ممکن است جاده را چند روز ببندد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سوی غرب بروید، میان زستافونی و کوتائیسی به شمال بپیچید
    و از Sh19 و از میان ترجولا تا تکیبولی برانید، سپس با Sh17 از گردنهٔ ناکرالا بگذرید تا آمبرولائوری،
    و از آنجا Sh16 را در امتداد ریونی بالا تا اونی بروید (حدود ۲۹۵ کیلومتر). اوتسرا ۱۱ کیلومتر جلوتر بر
    همان Sh16 است؛ روی‌هم حدود ۳۰۵ کیلومتر و نزدیک به پنج ساعت و ربع بی‌توقف. بنابر نقشه‌های کنونی جاده
    آسفالت است، اما باریک، و پس از باران سنگ رویش می‌ریزد. خودروی شاسی‌بلند را توصیه می‌کنیم، نه به‌خاطر
    آسفالت، بلکه به‌خاطر ریزش سنگ، شانه‌های شسته‌شدهٔ جاده و برف زودرس یا دیرپا. در آمبرولائوری سوخت بزنید.
he:
  name: מעיינות המינרלים של אוצרה
  short: >-
    כפר מרפא משני עברי הריוני, 10 ק"מ במעלה הנהר מאוני, שבו מים תוססים בטעם ברזל זורמים מצינורות בין עצי
    האשוח – ובחינם.
  body: >-
    **המים של אוצרה יוצאים מן האדמה כבר תוססים, ולפני מאה שנה עסקת ייצוא עם חברה צרפתית קרסה בגלל תנאי
    אחד: שהכפר ימשיך לשתות אותם בחינם.**


    הכפר שוכן משני עברי הריוני, כ-10 ק"מ במעלה הנהר מאוני, בגובה של כ-1,050 מטר, בין אשוחיות, אשוחים ואשורים.
    המעיינות כאן פחמתיים (מוגזים באופן טבעי), ביקרבונטיים ועשירים בברזל: המים עולים קרים, עוקצים את הלשון
    ומשאירים טעם קלוש של מתכת. ספרות רפואית גאורגית ממליצה עליהם לבעיות בכבד, בקיבה ובדרכי השתן. עונת
    הנופש נמשכת ממאי עד אוקטובר; הטמפרטורה הממוצעת בינואר היא מינוס 5 מעלות, ובאוגוסט 17 מעלות.


    במאה ה-18 תיאר וחושטי בגרטיוני כנסייה גדולה בשם סיוני על הגדה הצפונית של הנהר, שבקמרונה הייתה תלויה
    צמה שלפי המסורת הייתה של המלכה תמר, וגם חלקת אדמה שריחה הפיל ארצה ציפורים שעפו מעליה. היום זה נקרא
    כמו תיאור של פחמן דו-חמצני – אותו גז שמעניק גם למים את התסיסה. חורבות סיוני שרדו, ולידן כנסייה קטנה
    מגרניט על שם גאורגיוס הקדוש ושרידי מבצר. ב-1687 שרף מלך אימרתי, אלכסנדר הרביעי, את אוצרה במהלך מסע
    מלחמה בראצ'ה.


    הסיפור שמספרים כאן נוגע למעיין גווריטי, שהתגלה בסוף המאה ה-19 על אדמת האחים גמקרלידזה, אחרי שמימיו
    ריפאו את אחד מהם מכאבי קיבה. ב-1913–1914 הציעה חברה צרפתית לחכור אותו ל-45 שנה ולבקבק את מימיו לאירופה.
    האחים הסכימו, בתנאי שבני המקום יוכלו להמשיך לשתות מהם בחינם. הצרפתים סירבו, והעסקה נפלה.


    כבר תצלום משנים 1903–1904 מכנה את אוצרה "אתר נופש על הדרך הצבאית האוסטית". מאז לא פסקו המעיינות לזרום.
    הביאו בקבוק.
  tip: >-
    שעה או שעתיים מספיקות בהחלט. הביאו בקבוקים או ג'ריקן משלכם: המים בחינם, אבל לא תמיד אפשר לקנות כאן
    כלים למילוי. מים עתירי מינרלים קרובים יותר לתרופה מאשר למשקה מרענן: כוס או שתיים הן תענוג, ליטרים
    ביום – לא; אם יש לכם בעיה רפואית, התייעצו עם רופא. השבילים אל נקודות המים הופכים בוציים אחרי גשם.
    השירותים כאן מינימליים ואין כספומט, לכן משכו מזומנים ותכננו את הארוחות באוני. בחורף שלג עלול לחסום
    את הכביש לכמה ימים.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) כ-190 ק"מ, פנו צפונה בין זסטפוני לקוטאיסי לכביש Sh19 דרך טרג'ולה עד
    טקיבולי, חצו את מעבר נקרלה בכביש Sh17 עד אמברולאורי, ומשם עלו בכביש Sh16 לאורך הריוני עד אוני (כ-295
    ק"מ). אוצרה נמצאת 11 ק"מ הלאה באותו Sh16 – כ-305 ק"מ בסך הכול, כחמש שעות ורבע בלי עצירות. לפי המפות
    העדכניות הכביש סלול, אבל צר, ואחרי גשם מתפזרות עליו אבנים. אנו ממליצים על רכב שטח – לא בגלל האספלט,
    אלא בגלל סלעים נופלים, שוליים סחופים ושלג מוקדם או מאוחר. תדלקו באמברולאורי.
ar:
  name: ينابيع أوتسيرا المعدنية
  short: >-
    قرية استشفائية على ضفتي ريوني، على بعد 10 كم أعلى النهر من أوني، يجري فيها ماء فوّار بطعم الحديد من
    الأنابيب بين أشجار الشوح، ومجاناً.
  body: >-
    **يخرج ماء أوتسيرا من باطن الأرض فوّاراً من تلقاء نفسه، وقبل قرن انهارت صفقة لتصديره مع شركة فرنسية
    بسبب شرط واحد: أن يبقى أهل القرية يشربونه مجاناً.**


    تقع القرية على ضفتي ريوني، على بعد نحو 10 كم أعلى النهر من أوني، على ارتفاع 1050 متراً تقريباً، بين
    أشجار التنّوب والشوح والزان. ينابيعها غازية بيكربوناتية حديدية: يصعد الماء بارداً، يلسع اللسان ويترك
    طعماً معدنياً خفيفاً. وتوصي به المراجع الطبية الجورجية لعلل الكبد والمعدة والمسالك البولية. يمتد موسم
    الاستجمام من مايو إلى أكتوبر؛ ومتوسط الحرارة في يناير 5 درجات تحت الصفر، وفي أغسطس 17 درجة مئوية.


    في القرن الثامن عشر وصف فاخوشتي باغراتيوني كنيسة كبيرة تُدعى سيوني على الضفة الشمالية للنهر، تتدلّى
    في قبوها ضفيرة شعر يُقال إنها للملكة تامار، وبقعةً من الأرض كانت رائحتها تُسقط الطيور المحلّقة فوقها
    من السماء. واليوم يبدو ذلك وصفاً لثاني أكسيد الكربون، الغاز نفسه الذي يمنح الماء فورانه. ولا تزال
    أطلال سيوني قائمة، وبقربها كنيسة صغيرة من الغرانيت على اسم القديس جاورجيوس وبقايا حصن. وفي عام 1687
    أحرق ملك إيميريتي ألكسندر الرابع أوتسيرا خلال حملة على راتشا.


    أما الحكاية التي تُروى هنا فتخصّ نبع غفيريتي، الذي اكتُشف في أواخر القرن التاسع عشر في أرض الإخوة
    غامكريليدزه بعدما شفى ماؤه أحدهم من آلام في المعدة. وفي عامي 1913–1914 عرضت شركة فرنسية استئجاره 45
    عاماً لتعبئة مائه في قوارير لأوروبا. وافق الإخوة بشرط أن يظل أهل المكان يشربون منه مجاناً. رفض الفرنسيون،
    فانهارت الصفقة.


    وفي صورة فوتوغرافية من عامي 1903–1904 توصف أوتسيرا بالفعل بأنها «منتجع على الطريق العسكري الأوسيتي».
    ومنذ ذلك الحين لم تكفّ الينابيع عن الجريان. أحضر معك قارورة.
  tip: >-
    تكفي ساعة أو ساعتان. أحضر قواريرك أو جالوناً، فالماء مجاني لكن الأوعية لا تُباع هنا دائماً. والماء
    الغني بالمعادن أقرب إلى الدواء منه إلى المشروب المنعش: كوب أو كوبان متعة، أما اللترات كل يوم فلا؛
    لذا استشر طبيبك إن كانت لديك حالة صحية. تصبح الممرات إلى مخارج الماء موحلة بعد المطر. الخدمات شحيحة
    ولا يوجد صراف آلي، فاسحب نقوداً وخطّط لوجباتك في أوني. وفي الشتاء قد يغلق الثلج الطريق أياماً.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى Sh19 عبر
    ترجولا حتى تكيبولي، واعبر ممر ناكيرالا على Sh17 إلى أمبرولاوري، ثم اصعد على Sh16 مع مجرى ريوني حتى
    أوني (نحو 295 كم). تقع أوتسيرا بعد 11 كم أخرى على الطريق نفسه Sh16، أي نحو 305 كم إجمالاً، وقرابة
    خمس ساعات وربع دون توقف. الطريق مُعبَّد وفق الخرائط الحالية، لكنه ضيق، وتتناثر عليه الحجارة بعد المطر.
    نوصي بسيارة دفع رباعي مرتفعة، لا بسبب الإسفلت، بل بسبب الصخور المتساقطة والحواف التي جرفتها المياه
    والثلوج المبكرة أو المتأخرة. تزوّد بالوقود في أمبرولاوري.
