ka:
  name: უწერის მინერალური წყლები
  short: სოფელი და მინერალური წყლების კურორტი რიონის ხეობაში ონსა და შოვს შორის, ათას მეტრზე მაღლა.
  body: >-
    **უწერა რაჭის ის ადგილია, სადაც წყალი ბუშტუკებით გამოდის მიწიდან და უფასოა.** სოფელი რიონის მარცხენა
    ნაპირზე, ონიდან თხუთმეტიოდე კილომეტრში, დაახლოებით ათას ოცდაათ მეტრზე დგას, ონსა და შოვს შორის მიმავალ
    გზაზე.


    ადგილობრივი წყალი ბუნებრივად ნახშირმჟავიანია, ჰიდროკარბონატულ-ნატრიუმის ტიპისა, და მას საბჭოთა პერიოდიდან
    საჭმლის მომნელებელი სისტემის სამკურნალოდ იყენებდნენ. სოფელში რამდენიმე გამოსავალია — მილები და მარტივი
    კაპტაჟები, საიდანაც წყალი უწყვეტად მოედინება. გემო მარილიანია და ოდნავ ლითონისებრი; ცივია და ისეთი
    გაზიანი, რომ ბოთლი პირველ წუთებში ქაფდება. ხალხი აქ ბიდონებით ჩერდება და მანქანის საბარგულს ავსებს.


    კურორტად უწერა 1930-იან წლებში ჩამოყალიბდა. სანატორიუმის ნაწილი დღემდე მუშაობს, ნაწილი კი მიტოვებულია
    — რაჭაში ეს ჩვეულებრივი სურათია. ირგვლივ წიწვოვანი და შერეული ტყეა, ჰაერი გრილი და მშრალი, ხოლო ხეობა
    აქ საკმაოდ ვიწროა: ჩრდილოეთით რაჭის ქედის ფერდობები მაღლდება.


    სოფელი პატარაა და სერვისები მინიმალური: ორიოდე გესტჰაუსი, პატარა მაღაზია, ზაფხულში სეზონური ჯიხურები.
    კაფე პრაქტიკულად არ არის, ბანკომატიც არა.


    უწერა ცალკე მიზნად არ ღირს, მაგრამ შოვისკენ ან ღებისკენ მიმავალ გზაზე ეს ლოგიკური და სასიამოვნო გაჩერებაა
    — ნახევარი საათი წყაროსთან, ტყეში სეირნობა და შემდეგ ხეობით ზემოთ.


    უწერა ამ ხეობაში ერთადერთი არ არის: მინერალური წყლის გამოსავლები რიონის ზემო წელზე ჯაჭვად მიჰყვება
    ერთმანეთს — შოვს საკუთარი წყარო აქვს, სორსაც. ეს რაჭის ღრმა რღვევის კვალია, საიდანაც ნახშირორჟანგი
    მიწისქვეშა წყალში ადის და ზედაპირზე უკვე გაზიან წყალს გამოიტანს. სოფლის ქვემოთ, მდინარესთან, ძველი
    ჩამოსხმის საამქროს კვალიცაა შემორჩენილი. სანატორიუმის ტერიტორიაზე ფიჭვნარშია რამდენიმე ბილიკი, სადაც
    ნახევარი საათი კარგად გადის, ხოლო ჩრდილოეთით შოდა-კედელას ქედის კონტური ჩანს.
  tip: >-
    ერთი-ორი საათი სავსებით საკმარისია. ბოთლი ან ბიდონი თან წაიღე — წყალი უფასოა, მაგრამ ტარა ადგილზე
    არ იყიდება. გაითვალისწინე: მაღალმინერალიზებული ნახშირმჟავიანი წყალი დიდი რაოდენობით ყველას არ ერგება.
    წყაროსთან მისასვლელი ბილიკები არაასფალტირებულია და წვიმის შემდეგ ლაფიანი. ტუალეტი მხოლოდ სანატორიუმის
    ტერიტორიაზეა. კვება წინასწარ იფიქრე — ონის შემდეგ სასადილო აღარაა. ნოემბრიდან აპრილამდე გზა შეიძლება
    დაიხუროს.
  route: >-
    ონიდან აღმოსავლეთით რიონის ხეობით შოვის მიმართულებით — თხუთმეტიოდე კილომეტრი, ოციოდე წუთი. თბილისიდან
    სულ 370 კმ ქუთაისის, ნაქერალას, ამბროლაურისა და ონის გავლით, დაახლოებით ექვსნახევარი საათი. ასფალტი
    ონის შემდეგ ფრაგმენტულია — ხან კარგი, ხან სრულიად გატეხილი, ორმოებით და ჩამონაშალი ქვით. კროსოვერი
    ან SUV კომფორტს მკვეთრად ზრდის. საწვავი ბოლოჯერ ამბროლაურში აიღე. ზამთარში ამ მონაკვეთს თოვლი ხურავს.
en:
  name: Utsera Mineral Springs
  short: A village and small mineral-water spa in the Rioni valley between Oni and Shovi, just above 1,000
    metres.
  body: >-
    **Utsera is the place in Racha where the water comes fizzing out of the ground, and it is free.**
    The village sits on the left bank of the Rioni about fifteen kilometres above Oni, at roughly 1,030
    metres, on the road towards Shovi.


    The water here is naturally carbonated, of the sodium-bicarbonate type, and has been used since the
    Soviet period for digestive complaints. Several outlets exist in the village — pipes and simple catchments
    from which water runs continuously. The taste is salty and faintly metallic; it comes out cold and
    so heavily gassed that a bottle foams for the first minute. People pull up here with plastic canisters
    and fill the boot of the car.


    Utsera was formalised as a resort in the 1930s. Part of the sanatorium still functions and part stands
    abandoned, which is an ordinary sight in Racha. Around it is mixed conifer and broadleaf forest, the
    air cool and dry, and the valley noticeably tighter here, with the slopes of the Racha range rising
    to the north.


    The village is small and the services minimal: two or three guesthouses, a small shop, a few seasonal
    stalls in summer. There is effectively no cafe, and no ATM.


    Utsera is not worth a journey in itself, but on the way up to Shovi or Ghebi it is a logical and pleasant
    stop — half an hour at the spring, a walk under the pines, then on up the valley.


    Utsera is not the only spring in this valley. Carbonated outlets follow one another in a chain along
    the upper Rioni — Shovi has its own, so does Sori. They mark the line of the deep Racha fault, where
    carbon dioxide rises into the groundwater and reaches the surface already gassed. Below the village,
    by the river, traces of the old bottling works survive. Within the sanatorium grounds a few paths
    run through the pines and make a good half hour, and to the north the outline of the Shoda-Kedela
    ridge shows above the trees.
  tip: >-
    An hour or two is ample. Bring a bottle or canister: the water is free, but containers are not sold
    on site. Be aware that heavily mineralised carbonated water in quantity does not suit everyone. The
    paths down to the outlets are unsurfaced and muddy after rain. Toilets exist only within the sanatorium
    grounds. Plan food in advance — there is no proper eating place beyond Oni. Between November and April
    the road may be closed entirely.
  route: >-
    From Oni head east up the Rioni valley towards Shovi — about fifteen kilometres, twenty minutes. From
    Tbilisi the total is 370 km via Kutaisi, the Nakerala pass, Ambrolauri and Oni, roughly six and a
    half hours. Beyond Oni the asphalt is intermittent: good in stretches, completely broken in others,
    with potholes and fallen stone. A crossover or SUV makes a substantial difference to comfort. Take
    fuel for the last time at Ambrolauri. In winter snow closes this section.
ru:
  name: Минеральные источники Уцеры
  short: Село и небольшой курорт минеральных вод в долине Риони между Они и Шови, чуть выше тысячи метров.
  body: >-
    **Уцера — то место в Раче, где вода с шипением выходит из земли и при этом бесплатна.** Село стоит
    на левом берегу Риони примерно в пятнадцати километрах выше Они, на высоте около 1030 метров, на дороге
    в сторону Шови.


    Вода здесь естественно углекислая, гидрокарбонатно-натриевого типа, и с советских времён применялась
    при болезнях пищеварения. В селе несколько выходов — трубы и простые каптажи, из которых вода течёт
    непрерывно. Вкус солоноватый, с лёгким металлическим оттенком; она выходит холодной и настолько газированной,
    что бутылка первую минуту пенится. Люди подъезжают сюда с канистрами и набивают ими багажник.


    Курортом Уцера стала в 1930-е годы. Часть санатория работает до сих пор, часть заброшена — в Раче
    это обычная картина. Вокруг смешанный хвойно-лиственный лес, воздух прохладный и сухой, а ущелье здесь
    заметно сужается: с севера поднимаются склоны Рачинского хребта.


    Село маленькое, услуг минимум: два-три гостевых дома, магазинчик, летом несколько сезонных лотков.
    Кафе, по сути, нет, банкомата тоже.


    Ради самой Уцеры ехать не стоит, но по пути в Шови или Геби это логичная и приятная остановка: полчаса
    у источника, прогулка под соснами и дальше вверх по ущелью.


    Уцера не единственный источник в этой долине. Углекислые выходы тянутся цепочкой вдоль верхнего Риони
    — свой есть у Шови, свой у Сори. Они отмечают линию глубинного Рачинского разлома, по которому углекислый
    газ поднимается в подземные воды и выходит на поверхность уже насыщенным. Ниже села, у реки, сохранились
    следы старого разливочного цеха. На территории санатория есть несколько троп в сосняке, на полчаса
    неспешной прогулки, а к северу над деревьями проступает контур хребта Шода-Кедела.
  tip: >-
    Часа-двух вполне достаточно. Возьмите бутылку или канистру: вода бесплатная, но тары на месте не продают.
    Учтите, что сильноминерализованная углекислая вода в больших количествах подходит не всем. Тропинки
    к выходам без покрытия и после дождя разбиты. Туалеты есть только на территории санатория. Еду продумайте
    заранее — после Они нормально поесть негде. С ноября по апрель дорогу может закрыть совсем.
  route: >-
    Из Они на восток вверх по долине Риони в сторону Шови — около пятнадцати километров, двадцать минут.
    От Тбилиси всего 370 км через Кутаиси, перевал Накерала, Амбролаури и Они, примерно шесть с половиной
    часов. После Они асфальт идёт кусками: где-то хороший, где-то разбит полностью, с ямами и осыпавшимся
    камнем. Кроссовер или внедорожник заметно добавляют комфорта. Последний раз заправляйтесь в Амбролаури.
    Зимой этот участок закрывает снег.
fa:
  name: چشمه‌های معدنی اوتسرا
  short: روستا و آبگرم کوچک آب معدنی در درّهٔ ریونی میان اونی و شووی، اندکی بالاتر از هزار متر.
  body: >-
    **اوتسرا همان جای راچاست که آب با جوشش از زمین بیرون می‌زند و رایگان است.** روستا بر کرانهٔ چپ ریونی،
    حدود پانزده کیلومتر بالاتر از اونی و در ارتفاع تقریبی ۱۰۳۰ متری، بر جادهٔ شووی نشسته است.


    آب اینجا به‌طور طبیعی گازدار و از نوع بی‌کربنات سدیم است و از دورهٔ شوروی برای ناراحتی‌های گوارشی
    به کار می‌رفته. چند خروجی در روستا هست: لوله‌ها و آبگیرهای ساده که آب پیوسته از آنها می‌ریزد. مزه‌اش
    شور و اندکی فلزی است؛ سرد بیرون می‌آید و چنان پرگاز است که بطری در دقیقهٔ نخست کف می‌کند. مردم با
    گالن اینجا نگه می‌دارند و صندوق عقب را پر می‌کنند.


    اوتسرا در دههٔ ۱۹۳۰ رسماً آبگرم شد. بخشی از آسایشگاه هنوز کار می‌کند و بخشی رها شده است، منظره‌ای
    که در راچا عادی است. پیرامونش جنگل آمیخته‌ای از سوزنی‌برگ و پهن‌برگ است، هوا خنک و خشک، و درّه اینجا
    محسوس‌تر تنگ می‌شود؛ در شمال دامنه‌های رشته‌کوه راچا بالا می‌روند.


    روستا کوچک است و خدمات در کمترین حد: دو سه خانهٔ مهمان، یک مغازهٔ کوچک و چند دکهٔ فصلی در تابستان.
    کافه عملاً نیست و خودپرداز هم نه.


    اوتسرا به‌تنهایی ارزش سفر ندارد، اما در راه شووی یا غبی توقفی منطقی و دلپذیر است: نیم ساعت کنار چشمه،
    قدمی زیر کاج‌ها و سپس بالا رفتن در درّه.


    اوتسرا تنها چشمهٔ این درّه نیست. خروجی‌های گازدار در امتداد ریونی بالا زنجیروار پشت سر هم می‌آیند؛
    شووی چشمهٔ خود را دارد و سوری هم. اینها خط گسل ژرف راچا را نشان می‌دهند، جایی که دی‌اکسید کربن به
    آب زیرزمینی بالا می‌آید و آب از همان آغاز گازدار به سطح می‌رسد. پایین روستا، کنار رود، نشانه‌های کارگاه
    قدیمی بطری‌پرکنی مانده است. در محوطهٔ آسایشگاه چند مسیر میان کاج‌ها هست که نیم ساعتی خوب پر می‌کند،
    و در شمال خط رشتهٔ شودا-کدلا بالای درختان پیداست.
  tip: >-
    یک تا دو ساعت کاملاً بس است. بطری یا گالن همراه ببرید: آب رایگان است اما ظرف در محل فروخته نمی‌شود.
    توجه کنید که آب گازدار پرمعدن به مقدار زیاد برای همه مناسب نیست. راه‌های منتهی به خروجی‌ها بی‌آسفالت
    و پس از باران گِلی است. سرویس بهداشتی تنها در محوطهٔ آسایشگاه هست. برای غذا از پیش فکر کنید؛ پس از
    اونی جای غذاخوری درستی نیست. از آبان تا فروردین ممکن است جاده کاملاً بسته باشد.
  route: >-
    از اونی به سمت شرق در درّهٔ ریونی به سوی شووی — حدود پانزده کیلومتر، بیست دقیقه. از تفلیس در مجموع
    ۳۷۰ کیلومتر از راه کوتائیسی، گردنهٔ ناکرالا، آمبرولائوری و اونی، تقریباً شش ساعت و نیم. پس از اونی
    آسفالت بریده‌بریده است: جاهایی خوب و جاهایی کاملاً ویران، با چاله و سنگ‌های ریخته. خودروی کراس‌اور
    یا شاسی‌بلند تفاوت زیادی در راحتی ایجاد می‌کند. آخرین سوخت‌گیری را در آمبرولائوری انجام دهید. در زمستان
    برف این بخش را می‌بندد.
he:
  name: מעיינות המינרלים של אוצרה
  short: כפר ומרפא קטן של מי מינרלים בעמק הריוני בין אוני לשובי, מעט מעל אלף מטר.
  body: >-
    **אוצרה היא המקום בראצ'ה שבו המים יוצאים מן האדמה בתסיסה, וללא תשלום.** הכפר יושב על הגדה השמאלית
    של הריוני, כחמישה עשר קילומטרים מעל אוני, בגובה כ-1,030 מטר, על הדרך לשובי.


    המים כאן מוגזים באופן טבעי, מסוג נתרן-ביקרבונט, ומאז התקופה הסובייטית שימשו לטיפול בהפרעות עיכול.
    בכפר כמה מוצאים — צינורות ומתקני איסוף פשוטים שמהם המים זורמים ברציפות. הטעם מלוח ומעט מתכתי; הם יוצאים
    קרים ומוגזים כל כך שהבקבוק מקציף בדקה הראשונה. אנשים עוצרים כאן עם מיכלים וממלאים את תא המטען.


    אוצרה הוכרזה כמרפא בשנות השלושים. חלק מבית ההבראה עדיין פועל וחלק ננטש, מראה שגרתי בראצ'ה. סביבה יער
    מעורב של מחטניים ורחבי עלים, האוויר קריר ויבש, והעמק צר כאן במידה ניכרת, כשמדרונות רכס ראצ'ה מיתמרים
    מצפון.


    הכפר קטן והשירותים מזעריים: שניים-שלושה בתי הארחה, חנות קטנה וכמה דוכנים עונתיים בקיץ. בית קפה כמעט
    אין, וכספומט אין כלל.


    אוצרה אינה מצדיקה נסיעה בפני עצמה, אבל בדרך לשובי או לגבי היא עצירה הגיונית ונעימה: חצי שעה ליד המעיין,
    הליכה תחת האורנים, והמשך במעלה העמק.


    אוצרה אינה המעיין היחיד בעמק הזה. מוצאים מוגזים נמשכים בשרשרת לאורך הריוני העליון — לשובי יש משלה,
    וגם לסורי. הם מסמנים את קו השבר העמוק של ראצ'ה, שבו עולה פחמן דו-חמצני אל מי התהום והמים מגיעים אל
    פני השטח כשהם מוגזים כבר. מתחת לכפר, ליד הנהר, שרדו שרידי בית המילוי הישן. בשטח בית ההבראה עוברים
    כמה שבילים בין האורנים וממלאים חצי שעה טובה, ומצפון מבצבץ מעל העצים קו רכס שודה-קדלה.
  tip: >-
    שעה עד שעתיים די והותר. הביאו בקבוק או מיכל: המים חינם, אך כלים אינם נמכרים במקום. שימו לב שמים מוגזים
    עתירי מינרלים בכמות אינם מתאימים לכולם. השבילים היורדים אל המוצאים אינם סלולים ובוציים אחרי גשם. שירותים
    יש רק בשטח בית ההבראה. תכננו אוכל מראש — מעבר לאוני אין מקום אכילה של ממש. בין נובמבר לאפריל הכביש
    עלול להיסגר לגמרי.
  route: >-
    מאוני מזרחה במעלה עמק הריוני לכיוון שובי — כחמישה עשר קילומטרים, עשרים דקות. מטביליסי הסך הכול 370
    ק״מ דרך קותאיסי, מעבר נקראלה, אמברולאורי ואוני, כשש שעות וחצי. מעבר לאוני האספלט מקוטע: במקומות טוב,
    במקומות מרוסק לגמרי, עם בורות ואבנים שנשרו. רכב פנאי או ג'יפ משפרים את הנוחות במידה רבה. תדלקו בפעם
    האחרונה באמברולאורי. בחורף השלג סוגר את הקטע הזה.
ar:
  name: ينابيع أوتسيرا المعدنية
  short: قرية ومنتجع صغير للمياه المعدنية في وادي ريوني بين أوني وشوفي، فوق الألف متر بقليل.
  body: >-
    **أوتسيرا هي موضع راتشا الذي يخرج فيه الماء فوّاراً من الأرض، وبلا مقابل.** تجلس القرية على الضفة
    اليسرى لريوني، على نحو خمسة عشر كيلومتراً فوق أوني، عند ارتفاع 1030 متراً تقريباً، على الطريق نحو
    شوفي.


    الماء هنا غازي بطبيعته، من نوع بيكربونات الصوديوم، واستُخدم منذ الحقبة السوفييتية لعلل الهضم. وفي
    القرية عدة مخارج: أنابيب ومآخذ بسيطة يجري منها الماء بلا انقطاع. الطعم مالح وفيه أثر معدني خفيف؛ يخرج
    بارداً ومشبعاً بالغاز حتى إن القارورة ترغي في الدقيقة الأولى. يقف الناس هنا بأوعية بلاستيكية ويملؤون
    صندوق السيارة.


    صارت أوتسيرا منتجعاً رسمياً في ثلاثينيات القرن الماضي. ولا يزال جزء من المصحّة عاملاً وجزء مهجوراً،
    وهو مشهد مألوف في راتشا. وحولها غابة مختلطة من الصنوبريات وعريضات الأوراق، والهواء بارد جاف، والوادي
    هنا أضيق بوضوح، إذ ترتفع من الشمال منحدرات سلسلة راتشا.


    القرية صغيرة والخدمات في أدنى حد: بيتا ضيافة أو ثلاثة، ودكان صغير، وبضعة أكشاك موسمية في الصيف. ولا
    يكاد يوجد مقهى، ولا صراف آلي البتة.


    لا تستحق أوتسيرا رحلة لذاتها، لكنها في الطريق إلى شوفي أو غيبي محطة منطقية ولطيفة: نصف ساعة عند النبع،
    ومشي تحت الصنوبر، ثم متابعة الصعود في الوادي.


    ليست أوتسيرا النبع الوحيد في هذا الوادي. فالمخارج الغازية تتوالى سلسلةً على امتداد ريوني الأعلى؛ لشوفي
    نبعها، ولسوري كذلك. وهي تعلّم خط صدع راتشا العميق، حيث يصعد ثاني أكسيد الكربون إلى المياه الجوفية
    فتبلغ السطح وهي مشبعة بالغاز أصلاً. وأسفل القرية، عند النهر، بقيت آثار معمل التعبئة القديم. وداخل
    حرم المصحّة دروب بين الصنوبر تملأ نصف ساعة طيبة، ويظهر شمالاً فوق الأشجار خط سلسلة شودا-كيديلا.
  tip: >-
    ساعة إلى ساعتين تكفيان تماماً. خذ قارورة أو وعاء: الماء مجاني لكن الأوعية لا تُباع في الموقع. وانتبه
    إلى أن الماء الغازي شديد التمعدن بكميات كبيرة لا يناسب الجميع. الدروب النازلة إلى المخارج غير معبّدة
    وموحلة بعد المطر. ودورات المياه لا توجد إلا داخل حرم المصحّة. دبّر أمر الطعام سلفاً، فلا مطعم حقيقياً
    بعد أوني. ومن تشرين الثاني إلى نيسان قد يُغلق الطريق كلياً.
  route: >-
    من أوني شرقاً صعوداً في وادي ريوني نحو شوفي — نحو خمسة عشر كيلومتراً، عشرون دقيقة. ومن تبليسي المجموع
    370 كم عبر كوتايسي وممر ناكيرالا وأمبرولاوري وأوني، أي نحو ست ساعات ونصف. وبعد أوني يصير الإسفلت متقطعاً:
    جيداً في مقاطع، ومحطماً تماماً في غيرها، بحفر وحجارة متساقطة. وسيارة عبور أو دفع رباعي تفرق كثيراً
    في الراحة. تزوّد بالوقود آخر مرة في أمبرولاوري. وفي الشتاء يغلق الثلج هذا المقطع.
