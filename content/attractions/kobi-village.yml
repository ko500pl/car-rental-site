ka:
  name: კობი
  short: >-
    თითქმის დაცლილი მთის სოფელი სამხედრო გზაზე, ჯვრის უღელტეხილის ქვემოთ: აქედან იწყება თრუსოს ხეობა და
    გუდაურისკენ მიმავალი გონდოლა.
  body: >-
    **ბოლო აღწერისას კობში სამი მცხოვრები დაითვალეს, წერილობითი ისტორია კი თითქმის შვიდ საუკუნეს ითვლის
    — აქ საქართველოს სამხედრო გზა ჯვრის უღელტეხილიდან თერგის ხეობაში ეშვება.**


    სოფელი კობის ზეგანზე, თერგის მარჯვენა ნაპირზე, ზღვის დონიდან 1970 მეტრზე დგას, სტეფანწმინდიდან 20
    კილომეტრში. ქართული წყაროები მას ისტორიული ხევის სამი ხეობის — თერგის, თრუსოსა და სნოს — შემაერთებელ
    კვანძად მოიხსენიებენ; მთიულეთიდან ხევში გადასასვლელი უმოკლესი გზაც აქ გადიოდა. პირველად XIV საუკუნის
    შუა წლებში, „ძეგლი ერისთავთაში“ გვხვდება: ქსნის ერისთავი გირშელი მნის ციხის აღების შემდეგ სწორედ კობში
    გამაგრდა მოხევეებთან საბრძოლველად.


    საუკუნეების განმავლობაში ამ გზაჯვარედინს მეფეები და არაგვის ერისთავები ეცილებოდნენ ერთმანეთს. აქ იკრიბებოდნენ
    მთიელთა წარმომადგენლები და აქვე აბარებდნენ მეფეებს მძევლებს. 1769 წლის ივნისში, კობთან, თერგის პირას,
    ადოს მინდორზე ერეკლე II და რუსი გენერალი გრაფი ტოტლებენი მოსალაპარაკებლად შეხვდნენ ერთმანეთს. XIX
    საუკუნეში აქ საფოსტო სადგური იდგა, სადაც მგზავრები ცხენებს იცვლიდნენ. კობში უძველესი დროიდან ქართველები
    სახლობდნენ, XVIII საუკუნიდან კი ოსებიც დასახლდნენ; აქ დაიბადა ოსური ენის ცნობილი მკვლევარი ვასო აბაევი
    (1900–2001).


    ეს სამი მცხოვრები 2014 წლის აღწერამ დაითვალა. 2018 წლიდან კობს გუდაურის სათხილამურო ზონასთან სამსექციანი
    გონდოლა აკავშირებს, დაახლოებით შვიდი კილომეტრის სიგრძისა. აქვე იწყება თრუსოს ხეობაში შემავალი გზაც.


    მგზავრების უმეტესობისთვის კობი მხოლოდ სახელია საგზაო ნიშანზე გუდაურსა და ყაზბეგს შორის. ძრავი ჩააქრეთ
    — და ნიშანი ისევ გზაჯვარედინად იქცევა.
  tip: >-
    შესვლა უფასოა, მაგრამ სოფელში თითქმის არაფერია: საწვავი, ბანკომატი და კაფეები გუდაურშია. ზამთარში
    ჯვრის უღელტეხილი ზვავსაშიშია და პერიოდულად იკეტება — გამგზავრებამდე გზის მდგომარეობა გადაამოწმეთ;
    ზამთრის საბურავები სავალდებულოა, ჯაჭვები კი თან იქონიეთ. გონდოლის სამუშაო განრიგი სეზონზეა დამოკიდებული:
    გუდაურის საბაგიროები ზამთარში ჩვეულებრივ 10:00-დან 16:00-მდე მუშაობს, მაგრამ კობის ხაზზე დაგეგმვამდე
    მისი მუშაობა დაადასტურეთ. თრუსოში თუ მიდიხართ, პასპორტი თან იქონიეთ — ეს სასაზღვრო ზონაა. საშუალო
    წლიური ტემპერატურა აქ დაახლოებით 3 გრადუსია, ამიტომ თბილი ტანსაცმელი ზაფხულშიც გამოგადგებათ.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზას (E117, ს3) მიჰყვებით მცხეთის, ჟინვალის, ანანურის, ფასანაურისა
    და გუდაურის გავლით, შემდეგ ჯვრის უღელტეხილს (2379 მ) გადადიხართ და კობში ეშვებით — სულ 137 კმ და დაახლოებით
    ორნახევარი საათი. გზა მთლიანად ასფალტიანია, მაგრამ ფასანაურის ზემოთ გრძელი სერპანტინი იწყება, რომელზეც
    მძიმე სატვირთოებიც მოძრაობს. ზამთარში უღელტეხილი ზვავსაშიშია და დროებით იკეტება. ზაფხულში ჩვეულებრივი
    მანქანაც გაივლის, ზამთარში კი ზამთრის საბურავებიანი SUV გაცილებით საიმედოა, ვიდრე დაბალი სედანი. საწვავი
    ფასანაურში ან, უკიდურეს შემთხვევაში, გუდაურში ჩაასხით — გუდაურიდან კობამდე დაახლოებით თხუთმეტი კილომეტრია.
    თრუსოს ხეობისკენ ხრეშიანი გზა კობში უხვევს.
en:
  name: Kobi
  short: >-
    A near-empty highland village on the Georgian Military Road below the Jvari Pass, where the Truso
    valley opens and a gondola climbs to Gudauri.
  body: >-
    **Kobi counted three residents at the last census, yet it has nearly seven centuries of written history
    — it is where the Georgian Military Road drops off the Jvari Pass into the valley of the Tergi.**


    The village stands on the Kobi plateau, on the right bank of the Tergi, at 1,970 metres and 20 km
    from Stepantsminda. Georgian sources describe it as the knot tying together three valleys of historic
    Khevi — the Tergi, Truso and Sno — and the shortest way from Mtiuleti into Khevi ran through it. It
    first appears in the mid-14th century in the chronicle known as the Monument of the Eristavis: Girshel,
    eristavi of Ksani, took the fortress of Mna and then dug in at Kobi to fight the Mokhevians.


    For centuries kings and the eristavis of Aragvi disputed this crossroads. Highland envoys gathered
    here, and hostages were handed over to the kings. In June 1769, on Ado’s meadow by the Tergi near
    Kobi, King Erekle II met the Russian general Count Totleben to negotiate. Through the 19th century
    a post station stood here, where travellers changed horses. Georgians had lived in Kobi since antiquity;
    Ossetian families settled in the 18th century, and the linguist Vaso Abaev (1900–2001), the great
    scholar of the Ossetian language, was born here.


    Those three residents were counted in 2014. Since 2018 a three-section gondola, about seven kilometres
    long, has linked Kobi with the Gudauri ski area, and the road into the Truso valley begins here too.


    For most drivers Kobi is only a name on a sign between Gudauri and Kazbegi. Switch off the engine,
    and the sign becomes a crossroads again.
  tip: >-
    There is no fee, but there is almost nothing in the village: fuel, cash machines and cafés are in
    Gudauri. In winter the Jvari Pass is avalanche-prone and closes from time to time, so check the road
    status before setting out; winter tyres are mandatory and chains worth carrying. Gondola hours depend
    on the season — Gudauri’s lifts usually run 10:00–16:00 in winter — so confirm the Kobi line is operating
    before you plan around it. Heading into Truso? Carry your passport: it is a border zone. The mean
    annual temperature here is about 3°C, so pack a warm layer even in summer.
  route: >-
    From Tbilisi follow the Georgian Military Highway (E117, S3) through Mtskheta, Zhinvali, Ananuri,
    Pasanauri and Gudauri, then cross the Jvari Pass (2,379 m) and descend to Kobi — 137 km and about
    two and a half hours. The road is asphalt all the way, but above Pasanauri it becomes a long series
    of switchbacks shared with heavy lorries, and in winter the pass is avalanche-prone and closes temporarily.
    In summer an ordinary car manages; in winter an SUV on winter tyres copes far better than a low saloon.
    Fill up in Pasanauri, or at the latest in Gudauri, about fifteen kilometres before Kobi. The gravel
    road into the Truso valley turns off at Kobi.
ru:
  name: Коби
  short: >-
    Почти опустевшее высокогорное село на Военно-Грузинской дороге под Крестовым перевалом: здесь начинается
    долина Трусо, а гондола поднимается к Гудаури.
  body: >-
    **Последняя перепись насчитала в Коби трёх жителей, а его письменная история насчитывает почти семь
    веков: здесь Военно-Грузинская дорога спускается с Крестового перевала в долину Терека.**


    Село стоит на Кобийском плато, на правом берегу Терека, на высоте 1970 метров, в 20 км от Степанцминды.
    Грузинские источники описывают его как узел, связывающий три долины исторической Хеви — Терека, Трусо
    и Сно, — и именно через него шёл кратчайший путь из Мтиулети в Хеви. Впервые Коби упоминается в середине
    XIV века в хронике, известной как «Памятник эриставам»: Гиршел, эристав Ксани, взял крепость Мна,
    а затем закрепился в Коби, чтобы воевать с мохевцами.


    Веками за этот перекрёсток спорили цари и арагвские эриставы. Здесь собирались посланцы горцев, здесь
    же царям передавали заложников. В июне 1769 года на лугу Адо у Терека близ Коби царь Ираклий II встретился
    для переговоров с русским генералом графом Тотлебеном. В XIX веке здесь стояла почтовая станция, где
    путники меняли лошадей. Грузины жили в Коби с древности; в XVIII веке здесь поселились осетинские
    семьи, и здесь же родился лингвист Васо Абаев (1900–2001), крупнейший исследователь осетинского языка.


    Этих трёх жителей перепись учла в 2014 году. С 2018 года трёхсекционная гондола длиной около семи
    километров связывает Коби с горнолыжным курортом Гудаури; отсюда же начинается дорога в долину Трусо.


    Для большинства водителей Коби — лишь название на указателе между Гудаури и Казбеги. Заглушите мотор,
    и указатель снова станет перекрёстком.
  tip: >-
    Платить ни за что не нужно, но в селе почти ничего нет: топливо, банкоматы и кафе — в Гудаури. Зимой
    Крестовый перевал лавиноопасен и время от времени закрывается, поэтому перед выездом проверьте состояние
    дороги; зимняя резина обязательна, а цепи стоит возить с собой. Часы работы гондолы зависят от сезона
    — подъёмники Гудаури зимой обычно работают с 10:00 до 16:00, — так что убедитесь, что линия на Коби
    работает, прежде чем строить на неё планы. Едете в Трусо? Возьмите паспорт: это пограничная зона.
    Среднегодовая температура здесь около 3 °C, так что тёплая кофта пригодится и летом.
  route: >-
    Из Тбилиси следуйте по Военно-Грузинской дороге (E117, S3) через Мцхету, Жинвали, Ананури, Пасанаури
    и Гудаури, затем преодолейте Крестовый перевал (2379 м) и спуститесь в Коби — 137 км и около двух
    с половиной часов. Асфальт на всём пути, но выше Пасанаури начинается длинная череда серпантинов,
    по которым идут и тяжёлые фуры, а зимой перевал лавиноопасен и временно закрывается. Летом проедет
    и обычная легковая машина, а зимой внедорожник на зимней резине справляется куда лучше низкого седана.
    Заправьтесь в Пасанаури или, самое позднее, в Гудаури — примерно в пятнадцати километрах до Коби.
    Гравийная дорога в долину Трусо отходит в Коби.
fa:
  name: کوبی
  short: >-
    روستایی کوهستانیِ تقریباً خالی بر جادهٔ نظامی گرجستان، پای گردنهٔ جواری؛ جایی که درهٔ تروسو گشوده
    می‌شود و تله‌کابین به گوداوری بالا می‌رود.
  body: >-
    **آخرین سرشماری در کوبی تنها سه ساکن شمرد، اما تاریخ مکتوبش به نزدیک هفت سده می‌رسد — این‌جا همان
    جایی است که جادهٔ نظامی گرجستان از گردنهٔ جواری به درهٔ ترگی سرازیر می‌شود.**


    روستا بر فلات کوبی، در کرانهٔ راست رود ترگی (ترک)، در ارتفاع ۱۹۷۰ متری و ۲۰ کیلومتری استپانتسمیندا
    قرار دارد. منابع گرجی آن را گرهی می‌دانند که سه درهٔ خِوی تاریخی — ترگی، تروسو و سنو — را به هم می‌بندد،
    و کوتاه‌ترین راه از متیولتی به خِوی از همین‌جا می‌گذشت. نخستین بار در میانهٔ سدهٔ چهاردهم، در وقایع‌نامه‌ای
    به نام «یادمان اریستاوها»، از آن یاد می‌شود: گیرشل، اریستاو (فرمانروای) کسانی، قلعهٔ منا را گرفت و
    سپس در کوبی سنگر گرفت تا با موخِویان (مردم خِوی) بجنگد.


    سده‌ها شاهان و اریستاوهای آراگوی بر سر این چهارراه با هم کشمکش داشتند. نمایندگان کوه‌نشینان این‌جا
    گرد می‌آمدند و گروگان‌ها را همین‌جا به شاهان می‌سپردند. در ژوئن ۱۷۶۹، در چمنزار آدو کنار ترگی، نزدیک
    کوبی، شاه ارکله دوم با ژنرال روس، کنت توتلبن، برای مذاکره دیدار کرد. در سراسر سدهٔ نوزدهم این‌جا چاپارخانه‌ای
    بود که مسافران در آن اسب عوض می‌کردند. گرجی‌ها از روزگار باستان در کوبی می‌زیستند؛ خانواده‌های آسی
    در سدهٔ هجدهم در آن ساکن شدند، و واسو آبایف (۱۹۰۰–۲۰۰۱)، زبان‌شناس و پژوهشگر برجستهٔ زبان آسی، در
    همین‌جا به دنیا آمد.


    آن سه ساکن در سرشماری ۲۰۱۴ شمرده شدند. از سال ۲۰۱۸ تله‌کابینی سه‌بخشی به طول حدود هفت کیلومتر کوبی
    را به پیست اسکی گوداوری وصل می‌کند، و جادهٔ درهٔ تروسو هم از همین‌جا آغاز می‌شود.


    برای بیشتر رانندگان، کوبی فقط نامی است بر تابلویی میان گوداوری و کازبگی. موتور را خاموش کنید تا آن
    تابلو دوباره چهارراه شود.
  tip: >-
    بلیت و ورودیه‌ای در کار نیست، اما در روستا تقریباً هیچ چیز هم نیست: سوخت، خودپرداز و کافه در گوداوری‌اند.
    در زمستان گردنهٔ جواری خطر بهمن دارد و گاه‌به‌گاه بسته می‌شود؛ پس پیش از حرکت وضعیت جاده را بررسی
    کنید. لاستیک زمستانی الزامی است و بهتر است زنجیر چرخ هم همراه داشته باشید. ساعت کار تله‌کابین به فصل
    بستگی دارد — تله‌سیژهای گوداوری در زمستان معمولاً از ۱۰:۰۰ تا ۱۶:۰۰ کار می‌کنند — پس پیش از برنامه‌ریزی
    مطمئن شوید خط کوبی فعال است. به تروسو می‌روید؟ گذرنامه همراه داشته باشید: منطقهٔ مرزی است. میانگین
    دمای سالانه این‌جا حدود ۳ درجهٔ سانتی‌گراد است؛ پس حتی در تابستان یک لایه لباس گرم بردارید.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (E117، S3) را از راه متسختا، ژینوالی، آنانوری، پاسانائوری و گوداوری دنبال
    کنید، سپس از گردنهٔ جواری (۲۳۷۹ متر) بگذرید و به کوبی سرازیر شوید — ۱۳۷ کیلومتر و حدود دو ساعت و نیم.
    تمام راه آسفالت است، اما بالاتر از پاسانائوری رشته‌ای طولانی از پیچ‌های تند آغاز می‌شود که کامیون‌های
    سنگین هم از آن می‌گذرند، و در زمستان گردنه خطر بهمن دارد و موقتاً بسته می‌شود. در تابستان خودروی سواری
    معمولی هم از پس راه برمی‌آید، اما در زمستان یک شاسی‌بلند با لاستیک زمستانی بسیار بهتر از سدانی کوتاه
    است. در پاسانائوری، یا دست‌کم در گوداوری که حدود پانزده کیلومتر پیش از کوبی است، باک را پر کنید. جادهٔ
    شنی درهٔ تروسو در کوبی جدا می‌شود.
he:
  name: קובי
  short: 'כפר הררי כמעט ריק על הדרך הצבאית הגאורגית, למרגלות מעבר ג''ווארי: כאן נפתח עמק טרוסו, ורכבל
    מטפס לגודאורי.'
  body: >-
    **במפקד האחרון נמנו בקובי שלושה תושבים, ולהיסטוריה הכתובה של המקום כמעט שבע מאות שנה — כאן יורדת הדרך
    הצבאית הגאורגית ממעבר ג'ווארי אל עמק הטרגי.**


    הכפר שוכן ברמת קובי, על הגדה הימנית של הטרגי (טרק), בגובה 1,970 מטר ו-20 ק״מ מסטפנצמינדה. מקורות גאורגיים
    מתארים אותו כקשר שמחבר שלושה עמקים של חבי ההיסטורית — הטרגי, הטרוסו והסנו — ודרכו עברה הדרך הקצרה
    ביותר ממטיולטי אל חבי. הוא מוזכר לראשונה באמצע המאה ה-14 בכרוניקה המכונה "מצבת האריסטאווים": גירשל,
    האריסטאווי (השליט) של קסאני, כבש את מבצר מנה ואחר כך התבצר בקובי כדי להילחם באנשי חבי.


    במשך מאות שנים נאבקו על צומת הדרכים הזה המלכים והאריסטאווים של ארגווי. כאן התכנסו שליחי בני ההרים,
    וכאן נמסרו בני ערובה לידי המלכים. ביוני 1769, באחו של אדו לצד הטרגי, סמוך לקובי, נפגש המלך ארקלה השני
    עם הגנרל הרוסי הרוזן טוטלבן למשא ומתן. לאורך המאה ה-19 עמדה כאן תחנת דואר שבה החליפו הנוסעים סוסים.
    גאורגים חיו בקובי מימי קדם; משפחות אוסטיות התיישבו בו במאה ה-18, וכאן נולד הבלשן ואסו אבאייב (1900–2001),
    גדול חוקרי השפה האוסטית.


    שלושת התושבים האלה נמנו במפקד של 2014. מאז 2018 מחבר רכבל בן שלושה מקטעים, באורך של כשבעה קילומטרים,
    את קובי עם אתר הסקי גודאורי, ומכאן מתחילה גם הדרך אל עמק טרוסו.


    לרוב הנהגים קובי אינו אלא שם על שלט בין גודאורי לקזבגי. כבו את המנוע, והשלט יחזור להיות צומת דרכים.
  tip: >-
    אין דמי כניסה, אבל גם כמעט אין כלום בכפר: דלק, כספומטים ובתי קפה יש בגודאורי. בחורף מעבר ג'ווארי חשוף
    למפולות שלגים ונסגר מדי פעם, לכן בדקו את מצב הדרך לפני היציאה; צמיגי חורף הם חובה, וכדאי להחזיק גם
    שרשראות. שעות הרכבל תלויות בעונה — הרכבלים של גודאורי פועלים בחורף בדרך כלל בין 10:00 ל-16:00 — לכן
    ודאו שקו קובי פועל לפני שאתם מתכננים סביבו. בדרך לטרוסו? קחו דרכון: זהו אזור גבול. הטמפרטורה השנתית
    הממוצעת כאן היא כ-3°C, אז ארזו בגד חם גם בקיץ.
  route: >-
    מטביליסי סעו בדרך הצבאית הגאורגית (E117, S3) דרך מצחתה, ז'ינוואלי, אנאנורי, פסנאורי וגודאורי, ואז
    חצו את מעבר ג'ווארי (2,379 מ') ורדו לקובי — 137 ק״מ וכשעתיים וחצי. הכביש סלול כולו, אבל מעל פסנאורי
    מתחיל רצף ארוך של סרפנטינות שחולקות את הדרך עם משאיות כבדות, ובחורף המעבר חשוף למפולות שלגים ונסגר
    זמנית. בקיץ גם רכב פרטי רגיל יעבור, אבל בחורף רכב שטח עם צמיגי חורף מתמודד הרבה יותר טוב ממכונית סדאן
    נמוכה. תדלקו בפסנאורי, או לכל המאוחר בגודאורי, כחמישה-עשר קילומטרים לפני קובי. דרך החצץ לעמק טרוסו
    מתפצלת בקובי.
ar:
  name: كوبي
  short: قرية جبلية شبه خالية على الطريق العسكري الجورجي أسفل ممر جفاري، حيث ينفتح وادي تروسو ويصعد تلفريك
    نحو غوداوري.
  body: >-
    **أحصى آخر تعداد في كوبي ثلاثة سكان فقط، لكن تاريخها المكتوب يمتد قرابة سبعة قرون؛ فهنا ينحدر الطريق
    العسكري الجورجي من ممر جفاري إلى وادي تيرغي.**


    تقع القرية على هضبة كوبي، على الضفة اليمنى لنهر تيرغي (تيريك)، على ارتفاع 1970 مترًا، وعلى بعد 20
    كم من ستيبانتسميندا. وتصفها المصادر الجورجية بأنها العقدة التي تربط ثلاثة أودية من إقليم خيفي التاريخي
    — تيرغي وتروسو وسنو — وكان أقصر طريق من متيوليتي إلى خيفي يمرّ بها. ويرد أول ذكر لها في منتصف القرن
    الرابع عشر في الحولية المعروفة باسم «نُصُب الإريستافيين»: إذ استولى غيرشيل، إريستافي (حاكم) كساني،
    على قلعة منا ثم تحصّن في كوبي لقتال الموخيفيين (أهل خيفي).


    وعلى مدى قرون تنازع الملوك وإريستافيّو أراغفي على هذا المفترق. هنا كان يجتمع مبعوثو أهل الجبال، وهنا
    كان الرهائن يُسلَّمون إلى الملوك. وفي يونيو 1769، في مرج آدو على ضفة تيرغي قرب كوبي، التقى الملك إريكلي
    الثاني الجنرالَ الروسي الكونت توتليبن للتفاوض. وطوال القرن التاسع عشر قامت هنا محطة بريد يبدّل فيها
    المسافرون خيولهم. سكن الجورجيون كوبي منذ القدم، واستقرت فيها أسر أوسيتية في القرن الثامن عشر، وفيها
    وُلد اللغوي فاسو أباييف (1900–2001)، كبير علماء اللغة الأوسيتية.


    وقد أُحصي هؤلاء السكان الثلاثة عام 2014. ومنذ 2018 يربط تلفريك من ثلاثة أقسام، طوله نحو سبعة كيلومترات،
    كوبي بمنطقة التزلج في غوداوري، ومن هنا أيضًا يبدأ الطريق إلى وادي تروسو.


    ليست كوبي عند معظم السائقين سوى اسم على لافتة بين غوداوري وكازبيغي. أطفئ المحرك، فتعود اللافتة مفترقَ
    طرق من جديد.
  tip: >-
    لا رسوم هنا، لكن لا يكاد يوجد شيء في القرية أيضًا: الوقود وأجهزة الصرف الآلي والمقاهي في غوداوري.
    في الشتاء يتعرض ممر جفاري للانهيارات الثلجية ويُغلق من حين لآخر، فتحقّق من حالة الطريق قبل الانطلاق؛
    الإطارات الشتوية إلزامية، ومن الحكمة حمل السلاسل. تختلف مواعيد التلفريك باختلاف الموسم — إذ تعمل مصاعد
    غوداوري شتاءً عادةً من 10:00 إلى 16:00 — فتأكّد من تشغيل خط كوبي قبل أن تبني خطتك عليه. متجه إلى تروسو؟
    احمل جواز سفرك، فهي منطقة حدودية. يبلغ متوسط الحرارة السنوي هنا نحو 3 درجات مئوية، فاحمل ثيابًا دافئة
    حتى في الصيف.
  route: >-
    من تبليسي اتبع الطريق العسكري الجورجي (E117، S3) عبر متسخيتا وجينفالي وأنانوري وباساناوري وغوداوري،
    ثم اعبر ممر جفاري (2379 م) وانحدر إلى كوبي — 137 كم ونحو ساعتين ونصف. الطريق معبّد كله، لكن فوق باساناوري
    تبدأ سلسلة طويلة من المنعطفات المتعرجة تشاركك فيها الشاحنات الثقيلة، وفي الشتاء يتعرض الممر للانهيارات
    الثلجية ويُغلق مؤقتًا. في الصيف تكفي سيارة عادية، أما في الشتاء فسيارة الدفع الرباعي بإطارات شتوية
    أقدر بكثير من سيدان منخفضة. املأ الخزان في باساناوري، أو في غوداوري على أبعد تقدير، على بعد نحو خمسة
    عشر كيلومترًا قبل كوبي. ويتفرّع الطريق الحصوي إلى وادي تروسو عند كوبي.
