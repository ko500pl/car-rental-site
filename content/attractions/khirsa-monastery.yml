ka:
  name: ხირსის მონასტერი
  short: >-
    ქვიშაქვისა და აგურის გუმბათოვანი ტაძარი თიბაანთან, სადაც 886 წლის წარწერიანი ქვა გუმბათქვეშა თაღში
    თავდაყირაა ჩაშენებული.
  body: >-
    **ხირსაში უძველესი თარიღი თავდაყირა დგას: ქვა, რომელზეც 886 წელია ამოკვეთილი, გუმბათქვეშა თაღში ამობრუნებული
    ჩაუშენებიათ.** მასზე ერისთავის სახელიც ეწერა, მაგრამ დრომ წაშალა.


    შუა საუკუნეების ქართული გადმოცემა, XIII საუკუნის სასულიერო პირის არსენ ბულმაისიმისძის საგალობლებში
    შემონახული, მონასტრის დაარსებას სტეფანეს მიაწერს — ცამეტ ასურელ მამათაგან ერთ-ერთს, რომელთა ღვაწლით
    VI საუკუნეში აღმოსავლეთ საქართველოში ბერმონაზვნობა გავრცელდა. ითვლება, რომ სტეფანე ხირსელი აქვე განისვენებს,
    საკურთხევლის ჩრდილოეთით მიშენებულ სამლოცველოში. ტაძარი კი წმინდა პირველმოწამე სტეფანეს სახელობისაა.


    შენობა საუკუნეთა ფენებისგან შედგება. VI საუკუნის ბაზილიკა X საუკუნეში გუმბათოვან ტაძრად აქციეს, XI
    და XVI საუკუნეებში კვლავ გადააკეთეს, 1822 წელს კი საფუძვლიანად შეაკეთეს. რიყის ქვისა და ქვიშაქვის
    კედლები 41 მეტრზეა გაჭიმული, მათ თავზე კი გუმბათის მაღალი აგურის ყელი ამოდის — თორმეტი სარკმლითა და
    კონუსური გადახურვით. შიგნით ოთხი სვეტი მზერას ნალისებრი აფსიდისკენ მიუძღვის.


    ფასადები თითქმის შიშველია, ამიტომ სამხრეთ სარკმელთან შეჩერება ღირს. მის გარშემო სამი ჯვარია ამოკვეთილი:
    ზედა ჯვრის ასომთავრულ წარწერაში კახთა მეფე გაგიკი (1039–1058) იხსენიება, მეორე ჯვარზე კი — მეფე ლევანი,
    რომელსაც XVI საუკუნეში მონასტრის მაღალ გალავანს მიაწერენ. დასავლეთ კარის თავზე 1822 წლის წარწერაა:
    არქიმანდრიტმა ნიკიფორემ იგი იმპერატორ ალექსანდრე I-ისა და მისი ჯარის მოსახსენიებლად ჩასვა — ქართლ-კახეთის
    სამეფოს გაუქმებიდან სულ ორი ათეული წლის შემდეგ.


    ტაძარს სამი მცირე სამლოცველო ეკვრის. გალავნის შიგნით სამსართულიანი სამრეკლო და ბერების სახლი დგას.
    საბჭოთა ათწლეულების შემდეგ, 1990-იან წლებში, მონასტერი ეკლესიას დაუბრუნდა და კვლავ განახლდა.


    კედლები ნელა წაიკითხეთ: ერისთავი, რომლის სახელიც ქვამ ვეღარ შემოინახა, მეფის ჯვარი, იმპერატორის მოხსენიება
    — ათასწლეულის ხელმოწერები ქვაზე. მათ ყველას ქვეშ კი VI საუკუნის ბერი განისვენებს.
  tip: >-
    ერთი საათი საკმარისია. ხირსა მოქმედი მამათა მონასტერია: მხრები და მუხლები დაფარული უნდა იყოს, ქალებს
    თავსაფარი დასჭირდებათ. შესვლა უფასოა. ტაძარში შესვლამდე სამხრეთ ფასადთან შეჩერდით და სარკმლის გარშემო
    სამი ჯვარი მოძებნეთ; შიგნით გუმბათქვეშა თაღებს ახედეთ — ერთ-ერთში 886 წლის წარწერიანი ქვა თავდაყირაა
    ჩასმული. ღვთისმსახურება და ბერების რიტმი აქ პირველია: ხმადაბლა ილაპარაკეთ და ტაძარში გადაღებამდე ნებართვა
    ითხოვეთ. კაფე ახლოს არ არის — საჭმელი და ტუალეტი სიღნაღშია, ოციოდე წუთის სავალზე. ბოდბის მონასტერი
    იმავე გზაზეა და ერთ ნახევარდღეში ორივე მოესწრება.
  route: >-
    თბილისიდან აღმოსავლეთით ს5 კახეთის გზატკეცილს დაადექით და საგარეჯოს გავლით იარეთ — გზა სწრაფი და კარგად
    მოასფალტებულია. დაახლოებით 90 კილომეტრის შემდეგ შ40-ზე სიღნაღისკენ გადაუხვიეთ. ქალაქში ამოდით, ბოდბის
    მონასტერს ჩაუარეთ და ვიწრო სოფლის გზით თიბაანისკენ დაეშვით; მონასტერი სოფლის თავზე, ხირსის ნაკადულთან
    დგას. სულ დაახლოებით 119 კმ და ორი საათი და ათი წუთი. ბოდბის ქვემოთ გზა ვიწროა და ადგილ-ადგილ დაზიანებული,
    მაგრამ ეკონომ-კლასის მანქანა აუჩქარებლად გაივლის. საწვავი ს5-ზე შეავსეთ — იქ ბენზინგასამართი სადგურები
    მრავლადაა.
en:
  name: Khirsa Monastery
  short: >-
    A domed church of sandstone and brick at Tibaani, where a stone dated 886 sits upside down in an arch
    beneath the dome.
  body: >-
    **The oldest date at Khirsa stands on its head: a stone carved with the year 886 was reused, upside
    down, in an arch beneath the dome.** It also named a local duke, an eristavi, but time has worn his
    name away.


    Medieval tradition, sung in hymns by the 13th-century cleric Arsen Bulmaisimisdze, credits the founding
    to Stephen, one of the Thirteen Assyrian Fathers who spread monasticism across eastern Georgia in
    the 6th century. He is believed to lie here, in a chapel north of the sanctuary; the church itself
    is dedicated to St Stephen the Protomartyr.


    The building is a palimpsest. A 6th-century basilica became a domed church in the 10th century, was
    reworked in the 11th and 16th, and heavily repaired in 1822. Walls of river cobbles and sandstone
    run for 41 metres; above them rises a tall brick drum with twelve windows under a conical roof. Inside,
    four columns lead the eye to a horseshoe-shaped apse.


    The façades are almost bare, so the south window repays a pause. Three crosses are carved around it:
    an asomtavruli inscription on the upper one names King Gagik of Kakheti (1039–1058), and another honours
    King Leon, credited with the monastery's tall defensive wall in the 16th century. Over the west door,
    an inscription placed in 1822 by the archimandrite Nikepore commemorates Tsar Alexander I and his
    army, barely two decades after Russia abolished the kingdom of Kartli-Kakheti.


    Three small chapels cling to the church, and a three-storey bell tower stands inside the wall. After
    the Soviet decades, Khirsa returned to the Church and was renovated in the 1990s.


    Read the walls slowly: a duke whose name has gone, a king's cross, a tsar's salute. A thousand years
    of signatures in stone, and beneath them all, a sixth-century monk at rest.
  tip: >-
    An hour is enough. Khirsa is a working men's monastery: cover shoulders and knees, and women should
    bring a headscarf. Entry is free. Before going in, stand at the south façade and find the three crosses
    around the window; inside, look up at the arches under the dome for the upturned stone dated 886.
    Services and the monks' routine come first, so keep voices low and ask before taking photos inside.
    There is no café nearby; Sighnaghi, about twenty minutes away, has food and toilets. Bodbe Monastery
    is on the same road, and the two fit easily into half a day.
  route: >-
    Leave Tbilisi eastwards on the S5 Kakheti highway past Sagarejo: fast, well-surfaced asphalt. After
    roughly 90 km turn onto the Sh40 for Sighnaghi, climb into the town, continue past Bodbe Monastery,
    then drop down the narrow country road to Tibaani. The monastery stands above the village on the Khirsa
    stream. Total about 119 km, around 2 hours 10 minutes. Below Bodbe the road is narrow and patched
    in places, but an economy car manages it at an unhurried pace. Fill up along the S5, where filling
    stations are plentiful.
ru:
  name: Хирсский монастырь
  short: >-
    Купольная церковь из песчаника и кирпича в Тибаани, где камень с датой 886 вделан вверх ногами в арку
    под куполом.
  body: >-
    **Самая старая дата в Хирсе стоит на голове: камень с высеченной датой 886 был использован повторно,
    вверх ногами, в арке под куполом.** На нём же было имя местного князя, эристави, но время стёрло его.


    Средневековое предание, воспетое в гимнах клириком XIII века Арсеном Булмаисимисдзе, приписывает основание
    Стефану, одному из Тринадцати ассирийских отцов, распространивших монашество по всей восточной Грузии
    в VI веке. Считается, что он покоится здесь, в приделе к северу от алтаря; сама церковь посвящена
    святому первомученику Стефану.


    Здание — палимпсест. Базилика VI века стала купольной церковью в X веке, была переделана в XI и XVI
    веках и капитально отремонтирована в 1822 году. Стены из речного булыжника и песчаника тянутся на
    41 метр; над ними поднимается высокий кирпичный барабан с двенадцатью окнами под конической крышей.
    Внутри четыре столба ведут взгляд к подковообразной апсиде.


    Фасады почти лишены убранства, поэтому южное окно стоит того, чтобы задержаться. Вокруг него вырезаны
    три креста: асомтаврульная надпись на верхнем называет кахетинского царя Гагика (1039–1058), а на
    другом упомянут царь Леон, которому приписывают возведение высокой защитной стены монастыря в XVI
    веке. Над западной дверью надпись, помещённая в 1822 году архимандритом Никифором, чтит императора
    Александра I и его войско — спустя едва два десятилетия после того, как Россия упразднила Картли-Кахетинское
    царство.


    К церкви примыкают три маленькие часовни, а внутри стены стоит трёхэтажная колокольня. После советских
    десятилетий Хирса вернулась к Церкви и была отремонтирована в 1990-х.


    Читайте стены неспешно: князь, чьё имя ушло, царский крест, почесть императору. Тысяча лет подписей
    на камне, а под ними всеми — покоящийся монах VI века.
  tip: >-
    Часа достаточно. Хирса — действующий мужской монастырь: закройте плечи и колени, женщинам стоит взять
    платок. Вход бесплатный. Прежде чем войти, встаньте у южного фасада и найдите три креста вокруг окна;
    внутри поднимите взгляд на арки под куполом, чтобы увидеть перевёрнутый камень с датой 886. Службы
    и распорядок монахов важнее всего, так что говорите тише и спрашивайте разрешения перед фотографированием
    внутри. Кафе рядом нет; в Сигнахи, минутах в двадцати отсюда, есть еда и туалеты. Бодбийский монастырь
    на той же дороге, и оба легко укладываются в полдня.
  route: >-
    Выезжайте из Тбилиси на восток по кахетинской трассе S5 через Сагареджо: быстрый, качественный асфальт.
    Примерно через 90 км сверните на Sh40 в сторону Сигнахи, поднимитесь в город, проезжайте мимо Бодбийского
    монастыря, затем спуститесь по узкой сельской дороге к Тибаани. Монастырь стоит над селом, у ручья
    Хирса. Всего около 119 км, около 2 часов 10 минут. Ниже Бодбе дорога узкая и местами в заплатках,
    но машина эконом-класса проходит её без спешки. Заправляйтесь по трассе S5, где заправок много.
fa:
  name: صومعهٔ خیرسا
  short: >-
    کلیسایی گنبددار از سنگ ماسه‌ای و آجر در تیبائانی، جایی که سنگی با تاریخ ۸۸۶ سرنگون در طاقی زیر گنبد
    جای گرفته است.
  body: >-
    **کهن‌ترین تاریخ در خیرسا واژگون ایستاده است: سنگی که سال ۸۸۶ بر آن کنده‌کاری شده، وارونه، دوباره
    در طاقی زیر گنبد به کار رفته است.** بر آن نام یک فرمانروای محلی، یک اریستاو، نیز نوشته شده بود، اما
    زمان نامش را زدوده است.


    روایت سده‌های میانه، که در سرودهای آرسن بولمایسیمیدزه، روحانی سدهٔ سیزدهم، خوانده شده، بنیادگذاری
    را به استفان نسبت می‌دهد، یکی از سیزده پدر آشوری که در سدهٔ ششم رهبانیت را در سراسر گرجستان شرقی گستراندند.
    باور بر این است که او در نمازخانه‌ای در شمال محراب آرام گرفته است؛ خودِ کلیسا به نام استفانِ نخستین
    شهید نام‌گذاری شده.


    بنا چون کهن‌نوشته‌ای است که چندبار بازنویسی شده. بازیلیکایی از سدهٔ ششم در سدهٔ دهم به کلیسایی گنبددار
    بدل شد، در سده‌های یازدهم و شانزدهم بازکاری شد، و در سال ۱۸۲۲ به‌شدت تعمیر شد. دیوارهایی از قلوه‌سنگ
    رودخانه‌ای و سنگ ماسه‌ای به طول ۴۱ متر کشیده شده‌اند؛ بر فراز آن‌ها گریوِ بلندِ آجری با دوازده پنجره
    زیر سقفی مخروطی برمی‌خیزد. درون، چهار ستون نگاه را به آپسیدی نعل‌اسبی می‌کشانند.


    نماها تقریباً بی‌آرایه‌اند، پس پنجرهٔ جنوبی سزاوار درنگ است. سه صلیب گرداگرد آن کنده‌کاری شده: کتیبه‌ای
    به خط آسومتاورولی بر صلیب بالایی نام پادشاه کاختی، گاگیک (۱۰۳۹-۱۰۵۸)، را می‌آورد، و دیگری پادشاه لئون
    را می‌ستاید که ساخت باروی بلند و دفاعی صومعه در سدهٔ شانزدهم به او نسبت داده می‌شود. بالای در غربی،
    کتیبه‌ای که در سال ۱۸۲۲ به دست آرشیمندریت نیکه‌پوره نهاده شد، تزار الکساندر یکم و سپاهش را یادبود
    می‌کند — تنها دو دهه پس از آن‌که روسیه پادشاهی کارتلی-کاختی را برانداخت.


    سه نمازخانهٔ کوچک به کلیسا چسبیده‌اند، و برجی ناقوسی سه‌طبقه درون باروست. پس از دهه‌های شوروی، خیرسا
    به کلیسا بازگشت و در دههٔ ۱۹۹۰ بازسازی شد.


    دیوارها را آهسته بخوانید: فرمانروایی که نامش رفته، صلیب پادشاهی، درودِ تزاری. هزار سال امضا بر سنگ،
    و زیر همهٔ آن‌ها، راهبی از سدهٔ ششم در آرامش.
  tip: >-
    یک ساعت کافی است. خیرسا صومعه‌ای فعال و مردانه است: شانه‌ها و زانوها را بپوشانید، و زنان بهتر است
    روسری بیاورند. ورود رایگان است. پیش از رفتن به درون، در نمای جنوبی بایستید و سه صلیب گرداگرد پنجره
    را بیابید؛ درون، به طاق‌های زیر گنبد نگاه کنید تا سنگ وارونهٔ سال ۸۸۶ را ببینید. مراسم و روزمرگی راهبان
    مقدم است، پس آرام سخن بگویید و پیش از عکس‌گرفتن درون اجازه بخواهید. کافه‌ای در نزدیکی نیست؛ سیقناقی،
    حدود بیست دقیقه دورتر، غذا و سرویس بهداشتی دارد. صومعهٔ بودبه بر همان راه است، و این دو به‌آسانی در
    نیم‌روز جای می‌گیرند.
  route: >-
    از تفلیس به سوی شرق، بر بزرگراه کاختی S5 از ساگارجو بگذرید: آسفالتی سریع و خوب. پس از حدود ۹۰ کیلومتر
    به Sh40 به سوی سیقناقی بپیچید، به شهر بالا بروید، از صومعهٔ بودبه بگذرید، سپس از راه روستایی باریکی
    به تیبائانی پایین بروید. صومعه بر فراز روستا، کنار نهرِ خیرسا، ایستاده است. مسافت کل حدود ۱۱۹ کیلومتر،
    حدود ۲ ساعت و ۱۰ دقیقه. زیر بودبه راه باریک و جای‌جای وصله‌دار است، اما خودرویی اقتصادی با آرامش از
    آن می‌گذرد. سوخت‌گیری در طول S5، جایی که پمپ‌بنزین‌ها فراوانند.
he:
  name: מנזר חירסה
  short: כנסיית כיפה מאבן חול ולבנים בטיבאני, שבה אבן מתוארכת ל-886 יושבת הפוכה בקשת מתחת לכיפה.
  body: >-
    **התאריך העתיק ביותר בחירסה עומד על ראשו: אבן שחרוט בה התאריך 886 שימשה מחדש, הפוכה, בקשת מתחת לכיפה.**
    עליה נקוב גם שם דוכס מקומי, אריסטאבי, אך הזמן שחק את שמו.


    מסורת ימי הביניים, המושרת בהמנונים בידי איש הכמורה מהמאה ה-13 ארסן בולמאיסימידזה, מייחסת את ייסוד
    המנזר לסטפן, אחד משלושה-עשר האבות האשוריים שהפיצו נזירות ברחבי מזרח גאורגיה במאה ה-6. מאמינים שהוא
    שוכב כאן, בקפלה שמצפון לאזור המזבח; הכנסייה עצמה מוקדשת לסטפנוס הקדוש, המרטיר הראשון.


    הבניין הוא פלימפססט. בזיליקה מהמאה ה-6 הפכה לכנסיית כיפה במאה ה-10, שופצה במאות ה-11 וה-16, ותוקנה
    בהיקף גדול ב-1822. קירות מצרור נחל ואבן חול נמשכים ל-41 מטרים; מעליהם מתרומם תוף לבנים גבוה עם שנים-עשר
    חלונות מתחת לגג חרוטי. בפנים, ארבעה עמודים מובילים את המבט לאפסיס בצורת פרסה.


    החזיתות עירומות כמעט, כך שהחלון הדרומי מצדיק עצירה. שלושה צלבים חרוטים מסביבו: כתובת אסומטברולי על
    העליון נוקבת בשם המלך גגיק מקאחתי (1039–1058), ואחרת מכבדת את המלך לאון, שלזכותו נזקפת חומת ההגנה
    הגבוהה של המנזר במאה ה-16. מעל הדלת המערבית, כתובת שהניח ב-1822 הארכימנדריט ניקפורה מנציחה את הצאר
    אלכסנדר הראשון וצבאו — רק כשני עשורים אחרי שרוסיה ביטלה את ממלכת קרטלי-קאחתי.


    שלוש קפלות קטנות דבוקות לכנסייה, ומגדל פעמונים תלת-קומתי עומד בתוך החומה. אחרי העשורים הסובייטיים,
    חירסה חזרה לכנסייה ושוחזרה בשנות ה-90.


    קראו את הקירות לאיטכם: דוכס ששמו נעלם, צלב של מלך, הצדעה של צאר. אלף שנות חתימות באבן, ומתחת לכולן,
    נזיר מהמאה ה-6 בשלווה.
  tip: >-
    שעה מספיקה. חירסה היא מנזר גברים פעיל: כסו כתפיים וברכיים, ונשים צריכות כיסוי ראש. הכניסה חינם. לפני
    הכניסה, עמדו בחזית הדרומית ומצאו את שלושת הצלבים סביב החלון; בפנים, הביטו למעלה לקשתות מתחת לכיפה
    כדי לראות את האבן ההפוכה מ-886. תפילות ושגרת הנזירים קודמות לכול, אז דברו בשקט ובקשו רשות לפני צילום
    בפנים. אין בית קפה בקרבת מקום; סיגנאגי, כעשרים דקות משם, מציעה אוכל ושירותים. מנזר בודבה נמצא באותה
    הדרך, ושניהם משתלבים בקלות בחצי יום.
  route: >-
    צאו מטביליסי מזרחה בכביש קאחתי S5 דרך סאגארג'ו: אספלט מהיר ואיכותי. לאחר כ-90 ק"מ פנו לדרך Sh40 לסיגנאגי,
    עלו לעיר, המשיכו על פני מנזר בודבה, ואז רדו בדרך כפרית צרה לטיבאני. המנזר עומד מעל הכפר, על נחל חירסה.
    בסך הכול כ-119 ק"מ, כשעתיים ו-10 דקות. מתחת לבודבה הדרך צרה ומתוקנת במקומות, אך רכב אקונומי מתמודד
    עמה בקצב נינוח. תדלקו לאורך S5, שם תחנות דלק רבות.
ar:
  name: دير خيرسا
  short: كنيسة ذات قبة من الحجر الرملي والآجر في تيباني، حيث يستقر حجر مؤرخ بعام 886 رأسًا على عقب في
    عقد تحت القبة.
  body: >-
    **أقدم تاريخ في خيرسا يقف على رأسه: حجر محفور عليه سنة 886 أُعيد استخدامه، معكوسًا، في عقد تحت القبة.**
    كان الحجر يحمل أيضًا اسم حاكم محلي، إريستافي، لكن الزمن محا اسمه.


    التراث القروسطي، المرتَّل في تراتيل رجل الدين من القرن الثالث عشر أرسن بولمايسيميدزه، ينسب التأسيس
    إلى إسطفانوس، أحد الآباء الآشوريين الثلاثة عشر الذين نشروا الرهبنة في شرق جورجيا في القرن السادس.
    ويُعتقد أنه يرقد هنا، في مصلى شمال الحرم؛ والكنيسة نفسها مكرسة للقديس إسطفانوس أول الشهداء.


    المبنى طبقات من إعادة الكتابة. تحولت بازيليكا من القرن السادس إلى كنيسة ذات قبة في القرن العاشر، وأُعيد
    العمل فيها في القرنين الحادي عشر والسادس عشر، وأُصلحت بشكل واسع عام 1822. تمتد الجدران من الحصى النهري
    والحجر الرملي 41 مترًا؛ وفوقها ترتفع رقبة آجرية عالية بها اثنتا عشرة نافذة تحت سقف مخروطي. في الداخل،
    تقود أربعة أعمدة النظر إلى حنية على شكل حدوة الحصان.


    الواجهات عارية تقريبًا، فتستحق النافذة الجنوبية وقفة. حُفرت حولها ثلاثة صلبان: نقش بخط أسومتاورولي
    على الصليب العلوي يذكر اسم الملك غاغيك ملك كاختي (1039–1058)، وآخر يكرّم الملك ليون، الذي يُنسب إليه
    بناء السور الدفاعي العالي للدير في القرن السادس عشر. وفوق الباب الغربي، نقش وضعه الأرشمندريت نيكيفوروس
    عام 1822 يخلّد القيصر ألكسندر الأول وجيشه — بعد عقدين بالكاد من إلغاء روسيا لمملكة كارتلي-كاختي.


    ثلاثة مصليات صغيرة تلتصق بالكنيسة، وبرج جرس من ثلاثة طوابق يقف داخل السور. بعد العقود السوفيتية، عادت
    خيرسا إلى الكنيسة وجُددت في التسعينيات.


    اقرأ الجدران بتمهل: حاكم ضاع اسمه، صليب ملك، تحية قيصر. ألف عام من التوقيعات على الحجر، وتحتها جميعًا،
    راهب من القرن السادس في سكون.
  tip: >-
    ساعة واحدة تكفي. خيرسا دير رجالي عامر: غطِّ الكتفين والركبتين، وعلى النساء إحضار غطاء رأس. الدخول
    مجاني. قبل الدخول، قف عند الواجهة الجنوبية وابحث عن الصلبان الثلاثة حول النافذة؛ في الداخل، انظر إلى
    الأعلى نحو العقود تحت القبة لترى الحجر المعكوس المؤرخ بعام 886. القداس وروتين الرهبان لهما الأولوية،
    فاخفض صوتك واطلب الإذن قبل التصوير في الداخل. لا يوجد مقهى قريب؛ سيغناغي، على بعد نحو عشرين دقيقة،
    فيها طعام ومراحيض. يقع دير بودبه على الطريق نفسه، ويمكن الجمع بينهما بسهولة في نصف يوم.
  route: >-
    اخرج من تبليسي شرقًا على طريق كاختي السريع S5 متجاوزًا ساغاريجو: إسفلت سريع وجيد. بعد نحو 90 كم انحرف
    إلى الطريق Sh40 نحو سيغناغي، اصعد إلى البلدة، تجاوز دير بودبه، ثم انحدر على طريق ريفي ضيق إلى تيباني.
    يقف الدير فوق القرية، على جدول خيرسا. المسافة الإجمالية نحو 119 كم، حوالي ساعتين و10 دقائق. تحت بودبه
    الطريق ضيق ومرقّع في أماكن، لكن سيارة اقتصادية تجتازه على مهل. تزود بالوقود على طول S5، حيث محطات
    الوقود كثيرة.
