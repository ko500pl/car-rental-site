ka:
  name: ხირსის მონასტერი
  short: >-
    ასურელ მამათა ერთ-ერთი დაარსებული სავანე სოფელ თიბაანთან, გალავნით შემოზღუდული და ალაზნის ვაკეზე გადმოსახედი.
  body: >-
    **ხირსა იმ ცამეტი სავანიდან ერთ-ერთია, რომლებმაც VI საუკუნეში საქართველოში ბერმონაზვნობა დაამკვიდრეს.** მისი დამაარსებელი სტეფანე ხირსელია, ასურელ მამათა ჯგუფის წევრი, რომელიც ანტიოქიიდან მოვიდა და აქ, ალაზნის ვაკის სამხრეთ კიდეზე დამკვიდრდა. მისი საფლავი დღემდე საკურთხევლის ქვეშაა.


    დღევანდელი ეკლესია ძირითადად XVI-XVII საუკუნეების ნაშენია, VI საუკუნის საძირკველზე. ეს სამნავიანი ბაზილიკაა, გარედან სადა და მკაცრი, თითქმის უსამკაულო; მთელი ეფექტი პროპორციასა და ქვის ფაქტურაზეა აგებული. შიგნით სივრცე ვიწრო და მაღალია, სვეტები მძიმე, სინათლე კი მხოლოდ რამდენიმე სარკმლიდან შემოდის.


    მონასტერი მაღალი გალავნითაა შემოზღუდული, კუთხეებში კოშკებით — ეს არ არის დეკორაცია. თიბაანი ლეკიანობის ხაზზე იყო და სავანე არაერთხელ დაარბიეს; ბერები კოშკებში იმალებოდნენ.


    ხირსა საუკუნეების განმავლობაში საეპისკოპოსო კათედრა იყო; ხირსელი ეპისკოპოსები კახეთის საეკლესიო იერარქიაში მაღლა იდგნენ. საბჭოთა პერიოდში სავანე დაიხურა, 1990-იან წლებში კი კვლავ გაიხსნა და დღეს მოქმედი მამათა მონასტერია, კარგად აღდგენილი ეზოთი, ვენახითა და ბაღით.


    გალავნის ჩრდილოეთი კუთხიდან ალაზნის ვაკე იშლება და ღრუბლიან დღეს კავკასიონის ქედიც ჩანს. სიღნაღიდან აქამდე ოცი წუთია და ტურისტი თითქმის არ ჩანს.
  tip: >-
    ერთი საათი საკმარისია. მოქმედი მამათა მონასტერია: ქალებს გრძელი კაბა და თავსაფარი სჭირდებათ, მამაკაცებს გრძელი შარვალი; შორტში არ შეგიშვებენ. კართან ხანდახან გადასაფარებლებია. ფოტოს გადაღება ეზოში ჩვეულებრივ შეიძლება, ეკლესიაში — არა. ტუალეტი გალავნის გარეთაა, კაფე არ არის; უახლოესი წნორსა და სიღნაღშია. ბერები სტუმარს ალაპარაკებას არ სთხოვენ — სიჩუმე აქ ნორმაა.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით ბადიაურისა და ბაკურციხის გავლით წნორისკენ — 110 კმ კარგი ასფალტი. წნორის შემდეგ სამხრეთ-აღმოსავლეთით მოუხვიე დედოფლისწყაროს გზაზე და თიბაანთან მიჰყევი მონასტრის მიმანიშნებელს; ბოლო სამი კილომეტრი ვიწრო, ნაწილობრივ დაზიანებული სასოფლო ასფალტია. სულ 122 კმ, დაახლოებით ორი საათი და ათი წუთი. საწვავი წნორში. ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Khirsa Monastery
  short: >-
    One of the monasteries founded by the Assyrian Fathers, walled and towered, above the plain near the village of Tibaani.
  body: >-
    **Khirsa is one of the thirteen foundations that established monastic life in Georgia in the 6th century.** Its founder was Stephen of Khirsa, a member of the group known as the Assyrian Fathers who came from the Antioch region and settled here at the southern edge of the Alazani plain. His grave lies under the altar, and the monastery still keeps his feast.


    The present church is largely a 16th and 17th-century rebuilding on 6th-century foundations. It is a three-nave basilica, plain and severe outside, with almost no carved ornament; the whole effect rests on proportion and on the texture of the stone. Inside, the space is narrow and tall, the piers heavy, and light comes from only a few small windows — which is why services here are lit mostly by candles even at midday.


    The monastery sits inside a high enclosure wall with corner towers, and these are not decorative. Tibaani lay on the line of the Dagestani raids that plagued Kakheti for two centuries, and the community was attacked repeatedly; the monks sheltered in the towers.


    Khirsa was a bishop's seat for centuries, and its bishops ranked high in the Kakhetian church. The Soviet period closed it; it reopened in the 1990s and is a working male monastery today, with a well-restored courtyard, a vineyard and a productive garden.


    From the north corner of the wall the Alazani plain opens out, and on a clear day the Caucasus ridge closes the horizon. Sighnaghi is twenty minutes away, but almost nobody comes over.


    The thirteen Assyrian Fathers are a hinge in Georgian church history. They arrived in the 540s and 550s, dispersed across the country and founded the monasteries that turned a recently converted kingdom into a monastic one. Khirsa, Alaverdi and Nekresi all belong to that same movement, and all three can be seen in a single day.
  tip: >-
    An hour is enough. This is a working male monastery: women need a long skirt and a headscarf, men long trousers, and shorts will not get you through the gate. Wraps are sometimes available at the entrance. Photography in the courtyard is normally fine, inside the church it is not. There are toilets outside the wall but no cafe; the nearest are in Tsnori and Sighnaghi. The monks do not expect conversation, and quiet is the standing rule of the place.
  route: >-
    Take the Kakheti highway from Tbilisi through Badiauri and Bakurtsikhe towards Tsnori — 110 km of good asphalt. Beyond Tsnori turn south-east on the Dedoplistskaro road and follow the monastery sign at Tibaani; the last three kilometres are narrow village asphalt, broken in places. Total 122 km, about two hours and ten minutes. Fuel is available in Tsnori. An economy car is sufficient, and Khirsa fits naturally into a day that also takes in Bodbe and Sighnaghi.
ru:
  name: Монастырь Хирса
  short: >-
    Одна из обителей, основанных ассирийскими отцами, за высокой оградой с башнями, над равниной у села Тибаани.
  body: >-
    **Хирса — одна из тринадцати обителей, с которых в VI веке началась монашеская жизнь в Грузии.** Её основатель, Стефан Хирсский, принадлежал к группе ассирийских отцов, пришедших из окрестностей Антиохии, и осел здесь, у южного края Алазанской долины. Его могила находится под алтарём, и день его памяти монастырь отмечает до сих пор.


    Нынешний храм — в основном перестройка XVI-XVII веков на фундаментах VI столетия. Это трёхнефная базилика, снаружи простая и суровая, почти без резного декора; весь эффект держится на пропорциях и на фактуре камня. Внутри пространство узкое и высокое, столбы тяжёлые, свет идёт лишь из нескольких небольших окон — поэтому службы здесь и в полдень освещаются в основном свечами.


    Монастырь стоит внутри высокой ограды с угловыми башнями, и башни эти не декоративные. Тибаани лежал на пути дагестанских набегов, два столетия терзавших Кахетию, и обитель разоряли не раз; монахи укрывались в башнях.


    Хирса веками была епископской кафедрой, и её епископы занимали высокое положение в кахетинской церкви. В советское время монастырь закрыли; в 1990-х он открылся вновь и сегодня действует как мужской, с ухоженным двором, виноградником и плодовым садом.


    С северного угла ограды открывается Алазанская долина, а в ясный день горизонт замыкает хребет Кавказа. До Сигнахи двадцать минут, но сюда почти никто не сворачивает.
  tip: >-
    Часа достаточно. Это действующий мужской монастырь: женщинам нужны длинная юбка и платок, мужчинам длинные брюки, в шортах через ворота не пройти. Накидки у входа бывают. Съёмка во дворе обычно допустима, внутри храма нет. Туалет есть за оградой, кафе нет; ближайшие в Цнори и Сигнахи. Монахи не ждут разговоров, тишина здесь — общее правило.
  route: >-
    Из Тбилиси по кахетинской трассе через Бадиаури и Бакурцихе в сторону Цнори — 110 км хорошего асфальта. За Цнори поверните на юго-восток по дороге на Дедоплисцкаро и у Тибаани следуйте указателю на монастырь; последние три километра — узкий сельский асфальт, местами разбитый. Всего 122 км, около двух часов десяти минут. Заправка в Цнори. Машины эконом-класса достаточно, а Хирса естественно вписывается в день, включающий Бодбе и Сигнахи.
fa:
  name: صومعهٔ خیرسا
  short: >-
    یکی از صومعه‌های بنیادگذاردهٔ پدران آشوری، با دیوار و برج، مشرف بر دشت نزدیک روستای تیبانی.
  body: >-
    **خیرسا یکی از سیزده بنیادی است که در سدهٔ ششم زندگی رهبانی را در گرجستان پایه گذاشتند.** بنیان‌گذارش استفانوس خیرسایی بود، از گروهی که به پدران آشوری شهرت دارند و از ناحیهٔ انطاکیه آمدند و او همین‌جا در لبهٔ جنوبی دشت آلازانی ماندگار شد. گورش زیر محراب است و صومعه هنوز روز یادبودش را نگه می‌دارد.


    کلیسای کنونی عمدتاً بازسازی سده‌های شانزدهم و هفدهم بر پی‌های سدهٔ ششم است. بازیلیکایی سه‌شبستانی است، از بیرون ساده و سخت‌گیر و تقریباً بی‌هیچ کنده‌کاری؛ تمام اثرش بر تناسب و بافت سنگ استوار است. درون، فضا باریک و بلند است، جرزها سنگین‌اند و نور تنها از چند پنجرهٔ کوچک می‌آید — و به همین سبب مراسم اینجا حتی در نیمروز بیشتر با شمع روشن می‌شود.


    صومعه درون دیواری بلند با برج‌های گوشه قرار دارد و این برج‌ها تزیینی نیستند. تیبانی بر مسیر شبیخون‌های داغستانی بود که دو سده کاختی را می‌آزرد، و این جماعت بارها مورد حمله قرار گرفت؛ راهبان در برج‌ها پناه می‌گرفتند.


    خیرسا قرن‌ها کرسی اسقفی بود و اسقفانش در کلیسای کاختی جایگاه بلندی داشتند. دورهٔ شوروی آن را بست؛ در دههٔ 1990 دوباره گشوده شد و امروز صومعه‌ای فعال برای مردان است، با حیاطی خوب مرمت‌شده، تاکستان و باغی پربار.


    از گوشهٔ شمالی دیوار، دشت آلازانی گشوده می‌شود و در روز صاف ستیغ قفقاز افق را می‌بندد. سیغناغی بیست دقیقه دورتر است، اما تقریباً کسی به اینجا نمی‌آید.
  tip: >-
    یک ساعت کافی است. اینجا صومعهٔ فعال مردان است: زنان به دامن بلند و روسری نیاز دارند و مردان به شلوار بلند، و با شلوارک از دروازه نمی‌گذرید. گاه پوشش‌هایی کنار ورودی هست. عکاسی در حیاط معمولاً اشکالی ندارد، درون کلیسا نه. سرویس بهداشتی بیرون دیوار هست و کافه نه؛ نزدیک‌ترین‌ها در تسنوری و سیغناغی است. راهبان انتظار گفت‌وگو ندارند و سکوت قاعدهٔ همیشگی این مکان است.
  route: >-
    از تفلیس بزرگراه کاختی را از بادیااوری و باکورتسیخه به سوی تسنوری بگیرید؛ 110 کیلومتر آسفالت خوب. پس از تسنوری به جنوب شرق و به جادهٔ ددوپلیس‌تسقارو بپیچید و کنار تیبانی تابلوی صومعه را دنبال کنید؛ سه کیلومتر آخر آسفالت باریک روستایی و جاهایی شکسته است. جمعاً 122 کیلومتر و حدود دو ساعت و ده دقیقه. سوخت در تسنوری هست. خودروی اقتصادی کافی است و خیرسا به‌طور طبیعی در روزی می‌گنجد که بودبه و سیغناغی را هم در بر می‌گیرد.
he:
  name: מנזר חירסה
  short: >-
    אחד המנזרים שייסדו האבות האשורים, מוקף חומה ומגדלים, מעל המישור ליד הכפר טיבאני.
  body: >-
    **חירסה הוא אחד משלושה עשר המוסדות שהחלו את חיי הנזירות בגאורגיה במאה השישית.** מייסדו היה סטפנוס מחירסה, מן הקבוצה הידועה כאבות האשורים, שבאה מאזור אנטיוכיה, והוא התיישב כאן בשולי מישור האלאזני מדרום. קברו נמצא מתחת למזבח, והמנזר עדיין מציין את יום זכרו.


    הכנסייה הנוכחית היא ברובה בנייה מחדש מן המאות ה-16 וה-17 על יסודות מן המאה השישית. זו בזיליקה בת שלושה אולמות, פשוטה וחמורה מבחוץ וכמעט ללא גילוף; כל האפקט נשען על פרופורציה ועל מרקם האבן. בפנים החלל צר וגבוה, העמודים כבדים, והאור מגיע רק מכמה חלונות קטנים — ולכן התפילות כאן מוארות בעיקר בנרות גם באמצע היום.


    המנזר יושב בתוך חומת היקף גבוהה עם מגדלי פינה, ואלה אינם קישוט. טיבאני שכן על קו הפשיטות הדאגסטניות שהציקו לקחתי במשך מאתיים שנה, והקהילה הותקפה שוב ושוב; הנזירים הסתתרו במגדלים.


    חירסה הייתה מושב בישוף במשך מאות שנים, ולבישופיה היה מעמד גבוה בכנסיית קחתי. התקופה הסובייטית סגרה אותו; בשנות התשעים נפתח מחדש והוא כיום מנזר גברים פעיל, עם חצר משוחזרת היטב, כרם וגן פורה.


    מפינת החומה הצפונית נפתח מישור האלאזני, וביום צלול רכס הקווקז סוגר את האופק. סיגנאגי במרחק עשרים דקות, אך כמעט איש אינו סוטה לכאן.
  tip: >-
    שעה מספיקה. זהו מנזר גברים פעיל: נשים זקוקות לחצאית ארוכה ולמטפחת, גברים למכנסיים ארוכים, ובמכנסיים קצרים לא תעברו את השער. לעתים יש כיסויים בכניסה. צילום בחצר בדרך כלל מותר, בתוך הכנסייה לא. יש שירותים מחוץ לחומה ואין בית קפה; הקרובים ביותר בצנורי ובסיגנאגי. הנזירים אינם מצפים לשיחה, והשקט הוא כלל קבוע במקום.
  route: >-
    סעו מטביליסי בכביש קחתי דרך באדיאורי ובקורצחה לכיוון צנורי — 110 ק״מ אספלט טוב. אחרי צנורי פנו דרומה-מזרחה בכביש דדופליסצקארו ועקבו אחר השילוט למנזר ליד טיבאני; שלושת הקילומטרים האחרונים הם אספלט כפרי צר ושבור במקומות. בסך הכול 122 ק״מ, כשעתיים ועשר דקות. דלק יש בצנורי. רכב חסכוני מספיק, וחירסה משתלב באופן טבעי ביום שכולל גם את בודבה ואת סיגנאגי.
ar:
  name: دير خيرسا
  short: >-
    أحد الأديرة التي أسسها الآباء الآشوريون، محاط بسور وأبراج، فوق السهل قرب قرية تيباني.
  body: >-
    **خيرسا واحد من ثلاثة عشر تأسيساً أرست حياة الرهبنة في جورجيا في القرن السادس.** ومؤسسه إسطفانوس الخيرسي، من الجماعة المعروفة بالآباء الآشوريين الذين قدموا من نواحي أنطاكية، واستقر هنا عند الطرف الجنوبي لسهل ألازاني. وقبره تحت المذبح، وما زال الدير يحيي عيده.


    والكنيسة الحالية في معظمها إعادة بناء من القرنين السادس عشر والسابع عشر على أساسات من القرن السادس. وهي بازيليكا بثلاثة صحون، بسيطة صارمة من الخارج وبلا زخرف منقوش تقريباً؛ وأثرها كله قائم على النسب وعلى ملمس الحجر. وفي الداخل الفراغ ضيق مرتفع، والدعامات ثقيلة، والضوء لا يأتي إلا من نوافذ صغيرة قليلة، ولذلك تُضاء الصلوات هنا بالشموع حتى في منتصف النهار.


    ويقوم الدير داخل سور مرتفع بأبراج ركنية، وهذه الأبراج ليست زينة. فقد كانت تيباني على خط الغارات الداغستانية التي أرهقت كاخيتي قرنين، وتعرضت الجماعة للهجوم مراراً؛ وكان الرهبان يحتمون بالأبراج.


    وكانت خيرسا كرسياً أسقفياً قروناً، وكان لأساقفتها مكانة عالية في كنيسة كاخيتي. أغلقها العهد السوفييتي؛ ثم فُتحت من جديد في التسعينيات وهي اليوم دير رجال عامل، بفناء مرمم جيداً وكرم وبستان منتج.


    ومن الركن الشمالي للسور ينفتح سهل ألازاني، وفي يوم صافٍ يغلق حيد القوقاز الأفق. وسيغناغي على بعد عشرين دقيقة، ومع ذلك لا يكاد أحد ينعطف إلى هنا.
  tip: >-
    ساعة تكفي. هذا دير رجال عامل: تحتاج النساء تنورة طويلة وغطاء رأس، والرجال سروالاً طويلاً، ولن تعبر البوابة بسروال قصير. وقد تجد أغطية عند المدخل. والتصوير في الفناء مقبول عادة، أما داخل الكنيسة فلا. وتوجد دورات مياه خارج السور ولا مقهى؛ أقربها في تسنوري وسيغناغي. والرهبان لا ينتظرون حديثاً، والصمت هنا قاعدة قائمة.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر باديااوري وباكورتسيخه نحو تسنوري، 110 كم من الإسفلت الجيد. وبعد تسنوري انعطف جنوباً شرقاً على طريق ددوبليستسقارو واتبع لافتة الدير عند تيباني؛ آخر ثلاثة كيلومترات إسفلت قروي ضيق مكسور في مواضع. المجموع 122 كم ونحو ساعتين وعشر دقائق. والوقود في تسنوري. سيارة اقتصادية تكفي، وتنسجم خيرسا طبيعياً مع يوم يشمل بودبه وسيغناغي أيضاً.
