ka:
  name: მენაბდის მარანი
  short: 'ოჯახური მარანი ძველ გურულ ოდაში, შემოქმედში: ჩხავერი და საკმიელა, სუფრა ბაღში და წაბლის წვნიანი.'
  body: >-
    **ჩხავერი არ ჩქარობს — და არც მენაბდეების ბაღში ჩქარობს ვინმე.**


    მენაბდის მარანი ოჯახური სასტუმრო სახლი და მარანია სოფელ შემოქმედში, ოზურგეთის აღმოსავლეთით, მოკლე
    გზაზე, შემოქმედის მონასტრის — გურიელ მთავართა სამარხის — მახლობლად. სახლი ტრადიციული გურული ოდაა,
    გარშემო კი სამი ჰექტარი მიწა და ბიომეურნეობაა.


    მარანში ორი ადგილობრივი ჯიშის, ჩხავერისა და საკმიელას, ღვინოს აყენებენ და ყიდიან. ჩხავერი გურიის ყველაზე
    ცნობილი ჯიშია და ჩვეულებრივ მსუბუქ, ცოცხალ წითელ ღვინოს იძლევა, ზაფხულის კენკრისა და ძლივს შესამჩნევი
    სანელებლის ნოტებით. ამ ნოტიო ჰავაში გურულები ვაზს ტრადიციულად მაღალ სარებზე ზრდიან — ამ წესს ოლიხნარი
    ჰქვია, — რომ მტევანი ნესტიან მიწას მოაშორონ. ერთი მოგზაური მწერალი აღიარებს, რომ პირველ ყლუპზე ჩხავერი
    არ მოეწონა და ჭიქა-ჭიქა შეიყვარა: ღვინოს ჰაერი სჭირდება და ბოთლის ბოლოსკენ იხსნება.


    სამზარეულოში გურულ კერძებს ამზადებენ, რომლებსაც სხვაგან იშვიათად შეხვდებით, მათ შორის წაბლის წვნიანს.
    გზად შემოვლილ სტუმრებსაც შეუძლიათ ბაღში ღვინო დალიონ და ისადილონ ან ივახშმონ, ღამისთევით ჩამოსულებს
    კი ოჯახი ღვინის დაყენებისა და კულინარიის გაკვეთილებს სთავაზობს.


    მონასტერთან ერთად მოინახულეთ: დილით — ქვა და ლოცვა, ნაშუადღევს — ჩხავერი.
  tip: >-
    გზად შემოვლილ სტუმრებს ღვინითა და სადილით ბაღში სიამოვნებით უმასპინძლდებიან, მაგრამ ერთი-ორი დღით
    ადრე დარეკეთ: ეს ოჯახური სახლია, ოფიციალური ტურებისა და გამოქვეყნებული ფასების გარეშე, ამიტომ ფასიც
    ზარის დროს იკითხეთ. სამზარეულო დაახლოებით საღამოს რვა საათამდე მუშაობს. საქართველოში მძღოლისთვის ალკოჰოლის
    დასაშვები ზღვარი მკაცრია — დეგუსტაცია მგზავრს მიანდეთ ან სასტუმროს ოთახში დარჩით. მარანი თავის ღვინოს
    ყიდის, ასე რომ ბოთლი თან წაიღეთ. შემოქმედის მონასტერში ქალებს თავსაბურავი და ქვედაბოლო დასჭირდებათ.
  route: >-
    შემოქმედამდე თბილისიდან 301 კილომეტრია, დაახლოებით 4 საათი და 25 წუთი, მთელ გზაზე ასფალტით. E60-ით
    (ს1) დასავლეთისკენ იარეთ — ხაშურის, რიკოთის მონაკვეთისა და ზესტაფონის გავლით, ქუთაისის გვერდის ავლით
    სამტრედიამდე; იქიდან ს12-ით ლანჩხუთისკენ, შემდეგ ადგილობრივი გზებით და შ2-ით ოზურგეთამდე. ქალაქი გაიარეთ
    და ბახმაროსა და გომისმთისკენ მიმავალ გზას აღმოსავლეთისკენ გაუყევით; შემოქმედი დაახლოებით ხუთ კილომეტრშია.
    სოფლის ქუჩები ვიწროა — ნელა იარეთ. საწვავი ოზურგეთში ჩაასხით. ეკონომ კლასის მანქანა სავსებით საკმარისია.
en:
  name: Menabde Winery (Menabde's Marani)
  short: >-
    A family cellar in an old Gurian oda house at Shemokmedi: Chkhaveri and Sakmiela wines, a table in
    the garden and chestnut soup.
  body: >-
    **Chkhaveri is a wine that will not be hurried, and nobody hurries in the Menabdes' garden either.**


    Menabde's Marani is a family guesthouse and wine cellar in the village of Shemokmedi, a short drive
    east of Ozurgeti and close to Shemokmedi Monastery, burial place of the Gurieli princes. The house
    is a traditional Gurian oda; around it lie three hectares of land with an organic farm.


    The cellar makes and sells wine from two local grapes, Chkhaveri and Sakmiela. Chkhaveri is Guria's
    best-known variety, usually a light, fresh red with notes of summer berries and a faint spice. In
    this humid climate Gurian growers traditionally train their vines high on tall props — a method called
    olikhnari — to lift the fruit off the damp ground. One travel writer admits she disliked Chkhaveri
    at first sip and came round to it glass by glass: it needs air, and it opens as the bottle empties.


    The kitchen cooks Gurian dishes seldom found elsewhere, chestnut soup among them. Walk-in visitors
    can sit in the garden over wine and lunch or dinner, and staying guests may join the family for a
    winemaking or cooking class.


    Pair it with the monastery: stone and prayer in the morning, Chkhaveri in the afternoon.
  tip: >-
    Walk-ins are welcome for wine and a meal in the garden, but ring a day or two ahead: this is a family
    house with no formal tours and no published prices, so ask about costs when you call. The kitchen
    closes around 8 pm. Georgia's drink-driving limit is strict — let a passenger do the tasting, or take
    one of the guesthouse rooms. The cellar sells what it makes, so leave with a bottle. At Shemokmedi
    Monastery nearby, women will need a headscarf and a skirt.
  route: >-
    Shemokmedi is 301 km from Tbilisi, about 4 hours 25 minutes, on asphalt all the way. Take the E60
    (S1) west past Khashuri, through the Rikoti section and past Zestaponi and Kutaisi to Samtredia, then
    the S12 towards Lanchkhuti and local roads onto the Sh2 into Ozurgeti. Cross the town and head east
    on the road towards Bakhmaro and Gomismta; Shemokmedi is about 5 km on. The village lanes are narrow,
    so take them slowly. Fill up in Ozurgeti. An economy car is all you need.
ru:
  name: Марани Менабде (семейная винодельня)
  short: >-
    Семейный погреб в старом гурийском доме-оде в Шемокмеди: вина из Чхавери и Сакмиелы, стол в саду и
    каштановый суп.
  body: >-
    **Чхавери — вино, которое не терпит спешки, и в саду у Менабде тоже никто не торопится.**


    Марани Менабде — семейный гостевой дом и винный погреб в селе Шемокмеди, совсем недалеко к востоку
    от Озургети, рядом с Шемокмедским монастырём, усыпальницей князей Гуриели. Дом — традиционная гурийская
    ода; вокруг — три гектара земли с органической фермой.


    Погреб делает и продаёт вино из двух местных сортов — Чхавери и Сакмиелы. Чхавери — самый известный
    сорт Гурии; обычно из него получается лёгкое, свежее красное вино с нотами летних ягод и едва уловимой
    пряностью. Во влажном здешнем климате гурийцы издавна поднимают лозу высоко на опоры — этот способ
    называется олихнари, — чтобы гроздья не лежали на сырой земле. Одна писательница-путешественница признаётся,
    что с первого глотка Чхавери ей не понравилось, а полюбила она его бокал за бокалом: вину нужен воздух,
    и раскрывается оно к концу бутылки.


    На кухне готовят гурийские блюда, которые редко встретишь где-то ещё, — среди них каштановый суп.
    Заехавшие без брони гости могут посидеть в саду за вином, обедом или ужином, а те, кто остаётся на
    ночь, — присоединиться к семье на уроке виноделия или кулинарии.


    Совместите визит с монастырём: утром — камень и молитва, после полудня — Чхавери.
  tip: >-
    Гостей без предварительной записи здесь принимают — выпить вина и поесть в саду, — но позвоните за
    день-два: это семейный дом без формальных экскурсий и опубликованных цен, так что о стоимости спросите
    по телефону. Кухня закрывается около 20:00. Нормы алкоголя для водителей в Грузии строгие — пусть
    дегустирует пассажир, или снимите одну из комнат гостевого дома. Погреб продаёт то, что делает сам,
    так что уезжайте с бутылкой. В соседнем Шемокмедском монастыре женщинам понадобятся платок и юбка.
  route: >-
    Шемокмеди в 301 км от Тбилиси, около 4 часов 25 минут, всю дорогу по асфальту. Езжайте по E60 (S1)
    на запад мимо Хашури, через участок Рикоти, мимо Зестафони и Кутаиси до Самтредиа, затем по S12 в
    сторону Ланчхути и местными дорогами выезжайте на Sh2 до Озургети. Пересеките город и держите на восток
    по дороге на Бахмаро и Гомисмту; Шемокмеди примерно в 5 км. Сельские улочки узкие — проезжайте их
    не спеша. Заправьтесь в Озургети. Машины эконом-класса вполне достаточно.
fa:
  name: شراب‌سازی منابده (مارانیِ منابده)
  short: >-
    سرداب شراب خانوادگی در خانه‌ای قدیمی به سبک «اودا»ی گوریایی در شموکمدی: شراب‌های چخاوری و ساکمیلا،
    میزی در باغ و سوپ شاه‌بلوط.
  body: >-
    **چخاوری شرابی است که شتاب را برنمی‌تابد — و در باغ خانوادهٔ منابده هم کسی شتاب ندارد.**


    مارانیِ منابده مهمان‌خانه و سرداب شرابی خانوادگی در روستای شموکمدی است، با فاصلهٔ کوتاهی در شرق اوزورگتی
    و نزدیک صومعهٔ شموکمدی، آرامگاه شاهزادگان گوریلی. خانه یک «اودا»ی سنتی گوریایی است و پیرامونش سه هکتار
    زمین با مزرعه‌ای ارگانیک قرار دارد.


    این سرداب از دو انگور بومی، چخاوری و ساکمیلا، شراب می‌سازد و می‌فروشد. چخاوری شناخته‌شده‌ترین انگور
    گوریاست و معمولاً شرابی قرمز، سبک و باطراوت با رایحهٔ توت‌های تابستانی و ته‌مایه‌ای محو از ادویه به
    دست می‌دهد. در این اقلیم مرطوب، باغداران گوریایی از دیرباز تاک را بر داربست‌های بلند بالا می‌برند
    — روشی که «اولیخناری» نام دارد — تا خوشه‌ها از خاک نمناک دور بمانند. نویسندهٔ سفرنامه‌ای اعتراف می‌کند
    که با نخستین جرعه از چخاوری خوشش نیامد و جام به جام به آن دل بست: این شراب به هوا نیاز دارد و هرچه
    بطری خالی‌تر شود، بیشتر باز می‌شود.


    آشپزخانه غذاهای گوریایی‌ای می‌پزد که کمتر جای دیگری پیدا می‌شوند، از جمله سوپ شاه‌بلوط. رهگذرانی که
    بی‌خبر سر می‌زنند می‌توانند در باغ بنشینند و کنار شراب ناهار یا شام بخورند، و مهمانانی که شب را می‌مانند
    می‌توانند در کلاس شراب‌سازی یا آشپزی به خانواده بپیوندند.


    این‌جا را با صومعه همراه کنید: صبح، سنگ و نیایش؛ بعدازظهر، چخاوری.
  tip: >-
    مهمانانِ بی‌نوبت برای شراب و غذا در باغ پذیرفته می‌شوند، اما یکی دو روز زودتر تماس بگیرید: این‌جا
    خانه‌ای خانوادگی است، بی‌تور رسمی و بی‌نرخ‌نامهٔ منتشرشده؛ پس هنگام تماس دربارهٔ هزینه‌ها بپرسید.
    آشپزخانه حدود ساعت ۸ شب بسته می‌شود. حد مجاز الکل برای رانندگان در گرجستان سخت‌گیرانه است — چشیدن
    را به یکی از مسافران بسپارید یا یکی از اتاق‌های مهمان‌خانه را اجاره کنید. سرداب همان چیزی را که می‌سازد
    می‌فروشد؛ پس با یک بطری برگردید. در صومعهٔ شموکمدیِ نزدیک، زنان به روسری و دامن نیاز خواهند داشت.
  route: >-
    شموکمدی ۳۰۱ کیلومتر با تفلیس فاصله دارد، حدود ۴ ساعت و ۲۵ دقیقه، و تمام راه آسفالت است. از جادهٔ E60
    (S1) به سمت غرب بروید، از کنار خاشوری، از گذرگاه ریکوتی و از کنار زستافونی و کوتائیسی بگذرید تا به
    سامتردیا برسید؛ سپس از S12 به‌سوی لانچخوتی و از راه‌های محلی وارد Sh2 شوید تا اوزورگتی. از شهر عبور
    کنید و از جاده‌ای که به باخمارو و گومیسمتا می‌رود به سمت شرق بروید؛ شموکمدی حدود ۵ کیلومتر جلوتر است.
    کوچه‌های روستا باریک‌اند، پس آهسته برانید. در اوزورگتی باک را پر کنید. یک خودروی سواری معمولی کاملاً
    کافی است.
he:
  name: יקב מנבדה (המרני של משפחת מנבדה)
  short: 'מרתף יין משפחתי בבית "אודה" גורי ישן בשמוקמדי: יינות צ''חאוורי וסקמיאלה, שולחן בגן ומרק ערמונים.'
  body: >-
    **צ'חאוורי הוא יין שאין לזרז אותו, וגם בגן של משפחת מנבדה איש אינו ממהר.**


    המרני של מנבדה הוא בית הארחה ומרתף יין משפחתי בכפר שמוקמדי, נסיעה קצרה מזרחה מאוזורגטי, סמוך למנזר
    שמוקמדי, מקום קבורתם של נסיכי גוריאלי. הבית הוא "אודה" גורי מסורתי, וסביבו שלושה הקטרים של אדמה ובהם
    משק אורגני.


    המרתף מייצר ומוכר יין משני זנים מקומיים, צ'חאוורי וסקמיאלה. צ'חאוורי הוא הזן המוכר ביותר של גוריה,
    ובדרך כלל הוא נותן יין אדום קליל ורענן, עם ניחוחות של פירות יער קיציים ונגיעה קלושה של תבלין. באקלים
    הלח הזה נוהגים מגדלי הגפנים בגוריה מאז ומעולם להדלות את הגפנים גבוה על סמוכות ארוכות — שיטה שנקראת
    אוליחנרי — כדי להרחיק את האשכולות מהאדמה הלחה. כותבת מסעות אחת מודה שבלגימה הראשונה לא אהבה את הצ'חאוורי,
    ורק כוס אחר כוס התאהבה בו: הוא זקוק לאוויר, ונפתח ככל שהבקבוק מתרוקן.


    המטבח מבשל מאכלים גוריים שנדיר למצוא במקומות אחרים, ובהם מרק ערמונים. מבקרים שמגיעים בלי הזמנה יכולים
    לשבת בגן עם יין וארוחת צהריים או ערב, ואורחים שלנים במקום יכולים להצטרף למשפחה לסדנת ייצור יין או
    בישול.


    שלבו את הביקור עם המנזר: בבוקר — אבן ותפילה, אחר הצהריים — צ'חאוורי.
  tip: >-
    מבקרים ללא הזמנה מתקבלים בברכה ליין ולארוחה בגן, אבל כדאי להתקשר יום-יומיים מראש: זה בית משפחתי בלי
    סיורים מאורגנים ובלי מחירון מפורסם, אז שאלו על המחירים כשאתם מתקשרים. המטבח נסגר בסביבות 20:00. מגבלת
    האלכוהול לנהגים בגאורגיה מחמירה — השאירו את הטעימות לאחד הנוסעים, או הזמינו אחד מחדרי בית ההארחה.
    המרתף מוכר את מה שהוא מייצר, אז אל תצאו בלי בקבוק. במנזר שמוקמדי הסמוך נשים יזדקקו לכיסוי ראש ולחצאית.
  route: >-
    שמוקמדי נמצא 301 ק״מ מטביליסי, כ-4 שעות ו-25 דקות נסיעה, כולה על אספלט. סעו מערבה בכביש E60 (S1) על
    פני חאשורי, דרך מקטע ריקוטי ועל פני זסטפוני וקוטאיסי עד סמטרדיה, ומשם בכביש S12 לכיוון לנצ'חוטי ובדרכים
    מקומיות אל כביש Sh2 ועד אוזורגטי. חצו את העיר והמשיכו מזרחה בכביש המוביל לבחמארו ולגומיסמטה; שמוקמדי
    נמצא כ-5 ק״מ הלאה. סמטאות הכפר צרות, אז סעו בהן לאט. תדלקו באוזורגטי. רכב פרטי רגיל הוא כל מה שצריך.
ar:
  name: قبو منابدي للنبيذ (ماراني منابدي)
  short: >-
    قبو نبيذ عائلي في بيت «أودا» غوري قديم في شيموكميدي: نبيذ تشخافيري وساكمييلا، ومائدة في الحديقة، وحساء
    الكستناء.
  body: >-
    **التشخافيري نبيذ لا يُستعجَل، ولا أحد يستعجل في حديقة آل منابدي أيضًا.**


    ماراني منابدي بيت ضيافة وقبو نبيذ عائلي في قرية شيموكميدي، على مسافة قصيرة بالسيارة شرق أوزورغيتي،
    قرب دير شيموكميدي، مدفن أمراء آل غورييلي. البيت «أودا» غوري تقليدي، تحيط به ثلاثة هكتارات من الأرض
    فيها مزرعة عضوية.


    يصنع القبو ويبيع نبيذًا من صنفين محليين من العنب، تشخافيري وساكمييلا. والتشخافيري أشهر أصناف غوريا،
    ويعطي عادةً نبيذًا أحمر خفيفًا منعشًا بنفحات من توت الصيف ولمسة خافتة من التوابل. وفي هذا المناخ الرطب
    اعتاد مزارعو غوريا أن يرفعوا الكروم عاليًا على دعائم طويلة — وهي طريقة تُسمّى «أوليخناري» — لإبعاد
    العناقيد عن الأرض الندية. وتعترف إحدى كاتبات الرحلات بأن التشخافيري لم يرُقها من الرشفة الأولى، ثم
    أحبّته كأسًا بعد كأس: فهو يحتاج إلى الهواء، ويتفتّح كلما اقتربت القارورة من نهايتها.


    يطهو المطبخ أطباقًا غورية قلّما تجدها في مكان آخر، منها حساء الكستناء. ويمكن للزوار العابرين الجلوس
    في الحديقة مع النبيذ وتناول الغداء أو العشاء، أما النزلاء المقيمون فبوسعهم الانضمام إلى العائلة في
    درس لصناعة النبيذ أو للطهي.


    اجمع بينه وبين الدير: في الصباح حجر وصلاة، وبعد الظهر تشخافيري.
  tip: >-
    يُرحَّب بالزوار دون حجز لتناول النبيذ ووجبة في الحديقة، لكن اتصل قبل يوم أو يومين: فهذا بيت عائلي
    بلا جولات رسمية ولا أسعار معلنة، فاسأل عن التكاليف حين تتصل. يُغلق المطبخ نحو الثامنة مساءً. حدّ الكحول
    المسموح للسائقين في جورجيا صارم، فدع التذوّق لأحد الركاب، أو احجز إحدى غرف بيت الضيافة. يبيع القبو
    ما يصنعه، فلا تغادر بلا قارورة. وفي دير شيموكميدي القريب ستحتاج النساء إلى غطاء للرأس وتنورة.
  route: >-
    تبعد شيموكميدي 301 كم عن تبليسي، أي نحو 4 ساعات و25 دقيقة، والطريق معبّد بالأسفلت كله. اسلك الطريق
    E60 (S1) غربًا مرورًا بخاشوري، وعبر مقطع ريكوتي، ثم بزيستافوني وكوتايسي حتى سامتريديا، ومنها الطريق
    S12 باتجاه لانتشخوتي، ثم طرقًا محلية إلى الطريق Sh2 حتى أوزورغيتي. اعبر المدينة واتجه شرقًا على الطريق
    المؤدي إلى باخمارو وغوميسمتا؛ تقع شيموكميدي على بعد نحو 5 كم. أزقّة القرية ضيقة، فقُد فيها على مهل.
    املأ خزان الوقود في أوزورغيتي. سيارة عادية هي كل ما تحتاجه.
