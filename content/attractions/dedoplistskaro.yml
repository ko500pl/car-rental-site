ka:
  name: დედოფლისწყარო
  short: კახეთის კიდურა ქალაქი შირაქის ველზე — ვაშლოვანის კარიბჭე, სტეპის პეიზაჟები და მშვიდი ღვინის მხარე.
  body: >-
    **დედოფლისწყარო საქართველოს ყველაზე „ველური დასავლეთია“** — პატარა ქალაქი შირაქის ველის კიდეზე, 800
    მეტრზე, სადაც კახეთის ვენახები სტეპად და უდაბნოსებურ ხრამებად გადადის. სახელი „დედოფლის წყაროს“ ნიშნავს
    და გადმოცემით თამარ მეფეს უკავშირდება.


    დასახლება დავით აღმაშენებლის დროინდელ სამხედრო პუნქტად იშვა, 1803 წელს რუსებმა აქ ციხესიმაგრე ააგეს,
    1869 წელს კი ძმებმა სიმენსებმა მახლობლად ნავთობგადამამუშავებელი ქარხანა გახსნეს — ერთ-ერთი პირველი
    მსოფლიოში. საბჭოთა „წითელწყარო“ 1991 წელს ისევ დედოფლისწყაროდ იქცა; დღეს აქ 5 500-მდე ადამიანი ცხოვრობს.


    ტურისტისთვის ქალაქი უპირველესად საწყისი წერტილია:


    - **ვაშლოვანის დაცული ტერიტორიების ვიზიტორთა ცენტრი** — აქ იღებ საშვს და გეგმავ მარშრუტს

    - **ხორნაბუჯის ციხე** და **არწივის ხეობა** — ნახევარ საათში

    - **შირაქის ველი** — ხორბლის უკიდეგანო ზღვა, გაზაფხულზე ყაყაჩოებით


    ადგილობრივი მარნები ღვინოსაც აყენებენ, ბაზრობა კი ნამდვილი პროვინციული კახეთია — ტურისტების გარეშე.
  tip: >-
    ვაშლოვანში წასვლას თუ აპირებ, ჯერ ვიზიტორთა ცენტრში შედი (ბარათაშვილის ქუჩა) — რეგისტრაცია სავალდებულოა,
    პასპორტი თან იქონიე. ცენტრი ორშაბათის გარდა ყოველდღე მუშაობს, სასურველია დილით მიხვიდე. ქალაქში რამდენიმე
    საოჯახო სასტუმრო და მარტივი სასადილოა; ბანკომატი და აფთიაქი ცენტრშია. ზაფხულში სტეპზე სიცხე 35°C-ს
    სცდება — წყალი და ქუდი აუცილებელია, გაზაფხული და შემოდგომა კი იდეალურია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (S5) წამოდი საგარეჯოს გავლით ბაკურციხემდე, იქიდან წნორისკენ და შემდეგ
    სამხრეთით დედოფლისწყარომდე — სულ დაახლოებით 130 კმ, ორ საათზე ცოტა მეტი. გზა ბოლომდე ასფალტიანია და
    მშვიდი. საწვავი ბოლოს წნორში აიღე — უფრო შორს, ვაშლოვანის მიმართულებით, გასამართი აღარ არის. ქალაქამდე
    ეკონომ-კლასის ავტომობილი საკმარისია; ვაშლოვანის სიღრმეში კი მხოლოდ მაღალი კლირენსით ან ჯიპით ჩახვალ.
en:
  name: Dedoplistskaro
  short: >-
    Kakheti's frontier town on the Shiraki plain — the gateway to Vashlovani, steppe landscapes and a
    quiet wine country.
  body: >-
    **Dedoplistskaro is Georgia's own Wild West** — a small town perched at 800 m on the edge of the Shiraki
    plain, where Kakheti's vineyards give way to steppe and desert-like badlands. The name means "Queen's
    Spring" and tradition ties it to Queen Tamar.


    The settlement began as a military post under King David the Builder, the Russians built a fort here
    in 1803 and called it Tsarskie Kolodtsy, and in 1869 the Siemens brothers opened an oil refinery nearby
    — one of the earliest anywhere. The Soviet-era "Tsiteltskaro" got its old name back in 1991; today
    around 5,500 people live here.


    For travellers the town is above all a launching pad:


    - **The Vashlovani Protected Areas visitor centre** — where you register and plan your route

    - **Khornabuji fortress** and the **Eagle Gorge** — each half an hour away

    - **The Shiraki plain** — an endless sea of wheat, streaked with poppies in spring


    Local cellars make honest country wine, and the market is provincial Kakheti at its most genuine —
    no tourists in sight.
  tip: >-
    If Vashlovani is the goal, call at the visitor centre first (Baratashvili Street) — registration is
    mandatory and you need your passport. It works daily except Monday; come in the morning. The town
    has a few family guesthouses and simple canteens; ATM and pharmacy are in the centre. Summer heat
    on the steppe tops 35°C, so carry water and a hat — spring and autumn are the ideal seasons.
  route: >-
    From Tbilisi take the Kakheti highway (S5) through Sagarejo to Bakurtsikhe, turn towards Tsnori and
    then south to Dedoplistskaro — about 130 km, a little over two hours. The road is asphalt the whole
    way and quiet. Take on fuel in Tsnori — beyond the town, towards Vashlovani, there are no stations.
    An economy car is fine as far as the town itself; the deep tracks of Vashlovani need high clearance
    or a proper 4x4.
ru:
  name: Дедоплисцкаро
  short: Пограничный городок Кахетии на Ширакской равнине — ворота Вашловани, степные пейзажи и тихий
    винный край.
  body: >-
    **Дедоплисцкаро — грузинский Дикий Запад:** маленький город на высоте 800 м на краю Ширакской равнины,
    где кахетинские виноградники сменяются степью и пустынными оврагами. Название означает "Царицын родник"
    и по преданию связано с царицей Тамарой.


    Поселение возникло как военный пост при Давиде Строителе, в 1803 году русские построили здесь укрепление
    Царские Колодцы, а в 1869-м братья Сименс открыли неподалёку нефтеперегонный завод — один из первых
    в мире. Советское "Цителцкаро" вернуло историческое имя в 1991 году; сегодня здесь живёт около 5 500
    человек.


    Для путешественника город — прежде всего стартовая точка:


    - **Визит-центр охраняемых территорий Вашловани** — здесь регистрируются и планируют маршрут

    - **Крепость Хорнабуджи** и **Орлиное ущелье** — до каждого полчаса

    - **Ширакская равнина** — бескрайнее море пшеницы, весной с маками


    Местные марани делают честное деревенское вино, а рынок — самая настоящая провинциальная Кахетия,
    без единого туриста.
  tip: >-
    Если цель — Вашловани, сначала зайдите в визит-центр (улица Бараташвили): регистрация обязательна,
    нужен паспорт. Работает ежедневно, кроме понедельника; лучше приходить утром. В городе несколько семейных
    гостевых домов и простые столовые; банкомат и аптека в центре. Летом жара в степи выше 35°C — вода
    и головной убор обязательны, а весна и осень идеальны.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) через Сагареджо до Бакурцихе, затем поворот на Цнори и на юг
    до Дедоплисцкаро — около 130 км, чуть больше двух часов. Дорога асфальтированная и спокойная на всём
    протяжении. Заправьтесь напоследок в Цнори — дальше, в сторону Вашловани, заправок нет. До самого
    города достаточно машины эконом-класса; вглубь Вашловани проедет только высокий клиренс или настоящий
    внедорожник.
fa:
  name: ددوپلیس‌تسکارو
  short: شهر مرزی کاختی بر دشت شیراکی — دروازهٔ واشلووانی، مناظر استپی و سرزمین آرام شراب.
  body: >-
    **ددوپلیس‌تسکارو غرب وحشی گرجستان است** — شهری کوچک در ارتفاع 800 متری بر لبهٔ دشت شیراکی، جایی که
    تاکستان‌های کاختی به استپ و درّه‌ماهورهای بیابانی می‌رسند. نام شهر «چشمهٔ ملکه» معنا می‌دهد و روایت‌ها
    آن را به ملکه تامار پیوند می‌زنند.


    این آبادی در روزگار داوید سازنده پاسگاهی نظامی بود؛ روس‌ها در 1803 اینجا دژی ساختند و «تسارسکیه کولودتسی»
    نامیدند، و در 1869 برادران زیمنس در نزدیکی آن پالایشگاه نفتی گشودند — از نخستین‌ها در جهان. نام شوروی
    «تسیتل‌تسکارو» در 1991 دوباره به نام تاریخی برگشت؛ امروز حدود 5500 نفر اینجا زندگی می‌کنند.


    برای مسافر، شهر پیش از هر چیز نقطهٔ آغاز است:


    - **مرکز بازدیدکنندگان مناطق حفاظت‌شدهٔ واشلووانی** — محل ثبت‌نام و برنامه‌ریزی مسیر

    - **قلعهٔ خورنابوجی** و **درهٔ عقاب** — هر یک نیم ساعت فاصله

    - **دشت شیراکی** — دریای بی‌پایان گندم، بهارها با شقایق‌ها


    سرداب‌های محلی شراب روستایی سالمی می‌سازند و بازارچه، کاختیِ شهرستانیِ ناب است — بی‌هیچ توریستی.
  tip: >-
    اگر مقصد واشلووانی است، اول به مرکز بازدیدکنندگان بروید (خیابان باراتاشویلی): ثبت‌نام اجباری است و
    گذرنامه لازم دارید. مرکز جز دوشنبه هر روز باز است؛ صبح بروید. در شهر چند مهمان‌خانهٔ خانوادگی و غذاخوری
    ساده هست؛ عابربانک و داروخانه در مرکز شهرند. تابستان گرمای استپ از 35 درجه می‌گذرد — آب و کلاه ضروری
    است؛ بهار و پاییز ایده‌آل‌اند.
  route: >-
    از تفلیس با بزرگراه کاختی (S5) از ساگارجو تا باکورتسیخه بروید، سپس به سمت تسنوری بپیچید و رو به جنوب
    تا ددوپلیس‌تسکارو — در مجموع حدود 130 کیلومتر، کمی بیش از دو ساعت. جاده سراسر آسفالت و خلوت است. آخرین
    سوخت‌گیری در تسنوری — جلوتر، به سوی واشلووانی، پمپ بنزینی نیست. تا خود شهر خودروی اقتصادی کافی است؛
    اما به عمق واشلووانی فقط با خودروی شاسی‌بلند یا آفرود می‌رسید.
he:
  name: דדופליסצקארו
  short: עיירת הסְפָר של קחתי במישור שיראקי — השער לוושלובאני, נופי ערבה וארץ יין שקטה.
  body: >-
    **דדופליסצקארו היא המערב הפרוע של גאורגיה** — עיירה קטנה בגובה 800 מ' על קצה מישור שיראקי, שם כרמי
    קחתי מפנים את מקומם לערבה ולתלוליות צחיחות. פירוש השם "מעיין המלכה", והמסורת קושרת אותו למלכה תמר.


    היישוב נולד כמוצב צבאי בימי דוד הבונה; הרוסים בנו כאן מבצר ב-1803 וקראו לו צארסקיה קולודצי, וב-1869
    פתחו האחים סימנס בקרבת מקום בית זיקוק לנפט — מהראשונים בעולם. השם הסובייטי "ציטלצקארו" הוחלף בחזרה
    לשם ההיסטורי ב-1991; כיום חיים כאן כ-5,500 תושבים.


    למטייל, העיירה היא קודם כול נקודת זינוק:


    - **מרכז המבקרים של שמורות וושלובאני** — כאן נרשמים ומתכננים את המסלול

    - **מבצר חורנבוג'י** ו**ערוץ הנשרים** — חצי שעה לכל אחד

    - **מישור שיראקי** — ים אינסופי של חיטה, באביב זרוע פרגים


    המרתפים המקומיים עושים יין כפרי הגון, והשוק הוא קחתי הפרובינציאלית האמיתית — בלי תיירים.
  tip: >-
    אם היעד הוא וושלובאני, סורו קודם למרכז המבקרים (רחוב ברטשווילי): הרישום חובה ונדרש דרכון. המרכז פועל
    כל יום מלבד שני; עדיף בבוקר. בעיירה כמה בתי הארחה משפחתיים ומזנונים פשוטים; כספומט ובית מרקחת במרכז.
    בקיץ החום בערבה עולה על 35 מעלות — מים וכובע חובה; האביב והסתיו אידיאליים.
  route: >-
    מטביליסי סעו בכביש קחתי (S5) דרך סגרג'ו עד בקורציחה, פנו לכיוון צנורי ומשם דרומה לדדופליסצקארו — כ-130
    ק״מ, קצת יותר משעתיים. הכביש סלול ושקט לכל אורכו. תדלקו לאחרונה בצנורי — הלאה, לכיוון וושלובאני, אין
    תחנות. עד העיירה עצמה מספיק רכב חסכוני; אל עומק וושלובאני ייכנס רק רכב גבוה או שטח אמיתי.
ar:
  name: ديدوبليستسكارو
  short: بلدة كاخيتي الحدودية على سهل شيراكي — بوابة فاشلوفاني ومناظر السهوب وبلاد نبيذ هادئة.
  body: >-
    **ديدوبليستسكارو هي الغرب المتوحش الجورجي** — بلدة صغيرة على ارتفاع 800 متر عند طرف سهل شيراكي، حيث
    تُفسح كروم كاخيتي المجال للسهوب والوهاد الشبيهة بالصحراء. الاسم يعني «نبع الملكة» وتربطه الروايات
    بالملكة تامار.


    نشأت المستوطنة موقعاً عسكرياً في عهد الملك داود الباني، وبنى الروس هنا حصناً عام 1803 وسمّوه «تسارسكيه
    كولودتسي»، وفي 1869 افتتح الأخوان سيمنس قربها معملاً لتكرير النفط — من أوائل المعامل في العالم. واستعادت
    «تسيتلتسكارو» السوفيتية اسمها التاريخي عام 1991؛ ويسكنها اليوم نحو 5500 نسمة.


    للمسافر، البلدة قبل كل شيء نقطة انطلاق:


    - **مركز زوار محميات فاشلوفاني** — هنا تسجّل وتخطط مسارك

    - **قلعة خورنابوجي** و**وادي النسور** — نصف ساعة إلى كل منهما

    - **سهل شيراكي** — بحر قمح لا ينتهي، تخترقه شقائق النعمان ربيعاً


    وتصنع الأقبية المحلية نبيذاً ريفياً صادقاً، أما السوق فهو كاخيتي الريفية على حقيقتها — بلا سياح.
  tip: >-
    إن كانت وجهتك فاشلوفاني فابدأ بمركز الزوار (شارع باراتاشفيلي): التسجيل إلزامي وجواز السفر مطلوب. يعمل
    المركز يومياً عدا الاثنين؛ والأفضل الحضور صباحاً. في البلدة بيوت ضيافة عائلية ومطاعم بسيطة؛ والصراف
    الآلي والصيدلية في الوسط. حرّ الصيف في السهوب يتجاوز 35 درجة — الماء والقبعة ضروريان، والربيع والخريف
    مثاليان.
  route: >-
    من تبليسي خذ طريق كاخيتي السريع (S5) عبر ساغاريجو حتى باكورتسيخه، ثم انعطف نحو تسنوري وجنوباً إلى
    ديدوبليستسكارو — نحو 130 كم في ما يزيد قليلاً على ساعتين. الطريق معبّد وهادئ على امتداده. تزود بالوقود
    أخيراً في تسنوري — فما بعدها باتجاه فاشلوفاني لا محطات. حتى البلدة تكفي سيارة اقتصادية؛ أما أعماق
    فاشلوفاني فلا تبلغها إلا سيارة مرتفعة القاعدة أو دفع رباعي حقيقي.
