ka:
  name: დედოფლისწყარო
  short: >-
    შირაქის ველის კიდურა ქალაქი: დავით აღმაშენებლის სამხედრო პუნქტი, რუსული ციხე, სიმენსების ნავთობი და
    ვაშლოვანის კარიბჭე.
  body: >-
    **დედოფლისწყარო სამეფო ფორპოსტიც ყოფილა, რუსული ციხეც, სიმენსების ნავთობის საწარმოც და საბჭოთა „წითელწყაროც“
    — და დღემდე ბოლო ქალაქია სტეპის წინ.**


    ქალაქი საქართველოს უკიდურეს სამხრეთ-აღმოსავლეთში, შირაქის ველზე, ზღვის დონიდან დაახლოებით 800 მეტრზე
    დგას — იქ, სადაც კახეთის ვენახებს ხორბლის ყანები და ბალახიანი სტეპი ცვლის, სამხრეთით კი, აზერბაიჯანის
    საზღვრისკენ, ვაშლოვანის გამოფიტული ხრამები იწყება. სახელი დედოფლის წყაროს ნიშნავს: გადმოცემით, თამარ
    მეფემ აქ წყაროდან თიხის მილებით წყალი გამოიყვანა.


    ადამიანი ამ მიწაზე ადრეული ბრინჯაოს ხანიდან ცხოვრობს — ირგვლივ მტკვარ-არაქსის კულტურის არაერთი ნამოსახლარია.
    ახლოს ხორნაბუჯის ციხის ნანგრევებია, რომელსაც ტრადიცია V საუკუნეში ვახტანგ გორგასალს მიაწერს; თავად
    დასახლება მატიანეებში პირველად დავით აღმაშენებლის სამხედრო პუნქტად იხსენიება. 1803 წელს რუსებმა აქ
    ციხე ააგეს და ადგილს „ცარსკიე კოლოდცი“ — „მეფის ჭები“ — უწოდეს; 1804 წელს, სპარსეთთან ომისას, ის რუსული
    ჯარის საყრდენი იყო. 1858 წელს აქ ალექსანდრე დიუმამ გაიარა და თავის ჩანაწერებში ხორნაბუჯი და ქალაქის
    სამხრეთით აღმართული ილიას მთა მოიხსენია. 1869 წელს ძმებმა, კარლ-ჰაინრიხ და ვერნერ ფონ სიმენსებმა,
    მახლობლად ნავთობგადამამუშავებელი ქარხანა ააშენეს — კავკასიის ადრეული სამრეწველო წამოწყება, რომელმაც
    1870-იანი წლების შუამდე იმუშავა.


    1921 წლის 18 თებერვალს ქართველი ჯარისკაცები აქ საათობით ებრძოდნენ შემოჭრილ წითელ არმიას; ამ ბრძოლაში
    საბჭოთა მეთაური პიოტრ კურიშკო დაიღუპა. საბჭოთა ხელისუფლებამ ქალაქს „წითელწყარო“ დაარქვა და 1963 წელს
    ქალაქის სტატუსი მიანიჭა; ისტორიული სახელი 1991 წელს დაბრუნდა. დღეს აქ 5 772 ადამიანი ცხოვრობს.


    მოგზაურისთვის დედოფლისწყარო უპირველესად კარიბჭეა: აქ, ვიზიტორთა ცენტრში, ვაშლოვანის დაცულ ტერიტორიებზე
    რეგისტრირდებით, აქედან მიდიხართ ხორნაბუჯსა და არწივის ხეობისკენ. მაგრამ ქალაქს ერთი საღამოც აჩუქეთ:
    როცა ქარი ჩადგება და სტეპი ოქროსფრად აელვარდება, მიხვდებით, რატომ დაარქვა გადმოცემამ ამ ადგილს დედოფლის
    სახელი.
  tip: >-
    თუ ვაშლოვანისკენ მიდიხართ, ჯერ ქალაქის ვიზიტორთა ცენტრში შეიარეთ: რეგისტრაცია სავალდებულოა და პასპორტი
    დაგჭირდებათ — სჯობს დილით, სამუშაო საათებში მიხვიდეთ. ქალაქში რამდენიმე საოჯახო სასტუმრო და უბრალო
    სასადილოა, ბანკომატი და აფთიაქი ცენტრშია. ზაფხულში სტეპზე სიცხე 35°C-ს სცდება, ჩრდილი კი თითქმის არსად
    არის — წყალი და ქუდი აუცილებელია. საუკეთესო დრო გაზაფხული და შემოდგომაა, როცა ველი მწვანე ან ოქროსფერია
    და ჰაერი — გამჭვირვალე. ხორნაბუჯზე ასასვლელად მოხერხებული ფეხსაცმელი ჩაიცვით.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) საგარეჯოს გავლით ბაკურციხემდე, იქიდან წნორისკენ, შემდეგ კი სამხრეთით,
    მითითებული გზით დედოფლისწყარომდე — სულ დაახლოებით 130 კმ და ორი საათი და თხუთმეტი წუთი. გზა ბოლომდე
    ასფალტიანი და წყნარია, ეკონომ-კლასის მანქანა ქალაქამდე სავსებით საკმარისია. ავზი წნორში ან თავად დედოფლისწყაროში
    შეავსეთ: ქალაქის იქით, ვაშლოვანის მიმართულებით, ბენზინგასამართი სადგური აღარ არის. თავად ვაშლოვანის
    ღრმა გრუნტის გზებისთვის კი მაღალი კლირენსის ჯიპი ან ნამდვილი 4×4 დაგჭირდებათ.
en:
  name: Dedoplistskaro
  short: >-
    The frontier town of the Shiraki plain: David the Builder's outpost, a Russian fort, a Siemens oil
    venture and the gateway to Vashlovani.
  body: >-
    **Dedoplistskaro has been a royal outpost, a Russian fort, a Siemens oil venture and a Soviet "Red
    Spring", and it is still the last town before the steppe.**


    It stands at about 800 metres on the Shiraki plain in Georgia's far south-east, where Kakheti's vineyards
    give way to wheat fields and grassland, and where, farther south towards the Azerbaijani border, the
    eroded badlands of Vashlovani begin. The name means "Queen's Spring": tradition says Queen Tamar had
    clay pipes laid to bring water down from the spring.


    People have lived around here since the Early Bronze Age, and Kura-Araxes settlements dot the surroundings.
    Nearby are the ruins of Khornabuji fortress, which tradition credits to Vakhtang Gorgasali in the
    5th century, while the town itself first appears in the chronicles as a military post of King David
    the Builder. In 1803 the Russians built a fort here and named it Tsarskie Kolodtsy, "the Tsar's Wells",
    and in 1804 it served as a base in the war against Persia. Alexandre Dumas passed through in 1858
    and noted Khornabuji and Mount Elias to the south. In 1869 the brothers Carl Heinrich and Werner von
    Siemens built an oil refinery nearby, an early industrial venture in the Caucasus that ran until the
    mid-1870s.


    On 18 February 1921 Georgian troops fought the invading Red Army here for hours, and the Soviet commander
    Pyotr Kuryshko was killed. The Soviets renamed the place Tsiteltskaro, "Red Spring", and made it a
    town in 1963; the old name returned in 1991. Today 5,772 people live here.


    For travellers the town is first a gateway. You register for the Vashlovani Protected Areas at its
    visitor centre and head out to Khornabuji and the Eagle Gorge. But give the town an evening: when
    the wind drops and the steppe turns gold, it is easy to see why tradition gave this place a queen's
    name.
  tip: >-
    If Vashlovani is your goal, call at the visitor centre in town first. Registration is mandatory and
    you will need your passport, so go in the morning during office hours. The town has a few family guesthouses
    and simple canteens, with an ATM and a pharmacy in the centre. In summer the steppe tops 35°C and
    there is almost no shade, so carry water and a hat. Spring and autumn are the best seasons, when the
    plain is green or gold and the air is clear. Wear decent shoes for the climb to Khornabuji.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) through Sagarejo to Bakurtsikhe, turn towards Tsnori and
    then head south on the signed road to Dedoplistskaro. It is about 130 km and two hours fifteen minutes.
    The road is asphalt and quiet all the way, so an economy car is fine as far as the town. Fill up in
    Tsnori or in Dedoplistskaro itself: beyond the town, towards Vashlovani, there are no fuel stations.
    The deep dirt tracks of Vashlovani itself need a high-clearance SUV or a proper 4x4.
ru:
  name: Дедоплисцкаро
  short: >-
    Приграничный город Ширакской степи: форпост Давида Строителя, русская крепость, нефтяное дело Сименсов
    и ворота в Вашловани.
  body: >-
    **Дедоплисцкаро успел побывать царским форпостом, русской крепостью, нефтяным промыслом Сименсов и
    советским «Цители-Цкаро» — и до сих пор остаётся последним городом перед степью.**


    Он стоит на высоте около 800 метров на Ширакской равнине, на крайнем юго-востоке Грузии, там, где
    кахетинские виноградники сменяются пшеничными полями и травяными степями, а южнее, у самой азербайджанской
    границы, начинаются размытые дождями бедленды Вашловани. Название означает «Царицын родник»: по преданию,
    царица Тамар велела провести глиняные трубы, чтобы вода из источника пришла в город.


    Люди живут в этих местах с раннего бронзового века, и вокруг разбросаны поселения куро-араксской культуры.
    Рядом лежат руины крепости Хорнабуджи, которую предание связывает с Вахтангом Горгасали и V веком,
    тогда как сам город впервые упомянут в летописях как военный пост царя Давида Строителя. В 1803 году
    русские построили здесь крепость и назвали её Царские Колодцы, а в 1804 году она служила базой в войне
    с Персией. В 1858 году здесь проезжал Александр Дюма и отметил Хорнабуджи и гору Ильи на юге. В 1869
    году братья Карл Генрих и Вернер фон Сименс построили неподалёку нефтеперегонный завод — одно из ранних
    промышленных предприятий Кавказа, работавшее до середины 1870-х годов.


    18 февраля 1921 года грузинские войска несколько часов сражались здесь с наступающей Красной Армией,
    и советский командир Пётр Курышко был убит. Советская власть переименовала город в Цители-Цкаро, «Красный
    родник», и в 1963 году присвоила ему статус города; в 1991 году вернулось старое название. Сегодня
    здесь живут 5772 человека.


    Для путешественника город прежде всего — ворота. Здесь, в визит-центре, регистрируются перед поездкой
    в Вашловани, отсюда отправляются к Хорнабуджи и в Орлиное ущелье. Но стоит задержаться здесь и на
    вечер: когда ветер стихает и степь становится золотой, легко понять, почему предание дало этому месту
    имя царицы.
  tip: >-
    Если ваша цель — Вашловани, сначала заедьте в визит-центр в городе. Регистрация обязательна, нужен
    паспорт, поэтому приезжайте утром в рабочие часы. В городе есть несколько семейных гостевых домов
    и простых столовых, в центре — банкомат и аптека. Летом степь прогревается выше 35°C, а тени почти
    нет, так что берите воду и шляпу. Лучшие сезоны — весна и осень, когда равнина зелена или золотиста
    и воздух чист. Для подъёма к Хорнабуджи нужна крепкая обувь.
  route: >-
    Из Тбилиси по Кахетинскому шоссе (S5) через Сагареджо до Бакурцихе, затем поверните на Цнори и далее
    на юг по указателям на Дедоплисцкаро. Это около 130 км и два часа пятнадцать минут. Дорога асфальтированная
    и спокойная на всём протяжении, так что до города хватит обычной легковой машины. Заправьтесь в Цнори
    или в самом Дедоплисцкаро: дальше, в сторону Вашловани, заправок нет. По самим грунтовым дорогам Вашловани
    нужен внедорожник с высоким клиренсом или настоящий 4×4.
fa:
  name: دِدوپلیستسکارو
  short: 'شهر مرزی دشت شیراکی: پایگاه داوید سازنده، دژی روسی، پروژهٔ نفتی زیمنس و دروازهٔ واشلووانی.'
  body: >-
    **دِدوپلیستسکارو زمانی پایگاه شاهی، دژ روسی، طرح نفتی زیمنس و «چشمهٔ سرخ» شوروی بوده است، و هنوز هم
    آخرین شهر پیش از استپ به‌شمار می‌آید.**


    این شهر در ارتفاع حدود ۸۰۰ متری بر دشت شیراکی، در دورافتاده‌ترین گوشهٔ جنوب‌شرقی گرجستان قرار دارد؛
    جایی که تاکستان‌های کاختی جای خود را به کشتزارهای گندم و علفزار می‌دهند و در جنوب، نزدیک مرز آذربایجان،
    هزاردره‌های فرسایشیِ واشلووانی آغاز می‌شود. نام این شهر به معنای «چشمهٔ ملکه» است: به‌روایتی، ملکه
    تامار فرمان داد لوله‌های گلی نصب کنند تا آب چشمه به پایین بیاید.


    مردم از عصر مفرغ آغازین در این منطقه زندگی کرده‌اند و سکونتگاه‌های فرهنگ کورا-آراکس در اطراف آن پراکنده‌اند.
    در نزدیکی، ویرانه‌های دژ خورنابوجی قرار دارد که روایت‌ها آن را به واختانگ گورگاسالی در سدهٔ پنجم نسبت
    می‌دهند، حال آنکه خود شهر نخستین‌بار در تواریخ به‌عنوان پایگاه نظامی شاه داوید سازنده ذکر شده است.
    در سال ۱۸۰۳ روس‌ها دژی در اینجا ساختند و آن را «چاه‌های تزار» نامیدند، و در سال ۱۸۰۴ این دژ پایگاهی
    در جنگ با ایران بود. الکساندر دوما در سال ۱۸۵۸ از اینجا گذشت و خورنابوجی و کوه الیاس در جنوب را ثبت
    کرد. در سال ۱۸۶۹ برادران کارل هاینریش و ورنر فون زیمنس پالایشگاه نفتی‌ای در نزدیکی بنا کردند؛ یکی
    از طرح‌های صنعتیِ اولیه در قفقاز که تا میانهٔ دههٔ ۱۸۷۰ فعال بود.


    در ۱۸ فوریهٔ ۱۹۲۱ نیروهای گرجی ساعت‌ها با ارتش سرخ مهاجم در اینجا جنگیدند، و فرمانده شوروی، پیوتر
    کوریشکو، در همان‌جا کشته شد. شوروی این محل را به «تسیتلتسکارو»، یعنی «چشمهٔ سرخ»، تغییر نام داد و
    در سال ۱۹۶۳ آن را به شهر ارتقا داد؛ نام کهن در سال ۱۹۹۱ بازگشت. امروز ۵٬۷۷۲ نفر در اینجا زندگی می‌کنند.


    برای گردشگر، این شهر پیش از هر چیز دروازه‌ای است. در مرکز بازدیدکنندگان آن برای منطقهٔ حفاظت‌شدهٔ
    واشلووانی ثبت‌نام می‌کنید و به سوی خورنابوجی و درهٔ عقاب می‌روید. اما یک شامگاه هم به این شهر بدهید:
    وقتی باد می‌آرامد و استپ رنگ طلایی می‌گیرد، به‌روشنی درک می‌کنید چرا روایت این مکان را به نام ملکه‌ای
    خواند.
  tip: >-
    اگر هدف شما واشلووانی است، نخست به مرکز بازدیدکنندگان شهر سر بزنید. ثبت‌نام الزامی است و به گذرنامه
    نیاز دارید، پس صبح در ساعات کاری بروید. شهر چند مهمان‌خانهٔ خانوادگی و رستوران‌های ساده دارد، و در
    مرکز آن دستگاه خودپرداز و داروخانه هست. در تابستان گرمای استپ از ۳۵ درجهٔ سلسیوس فراتر می‌رود و تقریباً
    سایه‌ای نیست، پس آب و کلاه همراه داشته باشید. بهار و پاییز بهترین فصل‌اند، زمانی که دشت سبز یا طلایی
    است و هوا صاف. برای صعود به خورنابوجی کفش مناسب بپوشید.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را از ساگارجو تا باکورتسیخه بروید، سپس به سمت تسنوری بپیچید و از آنجا
    بر جادهٔ علامت‌گذاری‌شده به‌سوی جنوب و دِدوپلیستسکارو ادامه دهید. مسافت نزدیک به ۱۳۰ کیلومتر و زمان
    آن دو ساعت و پانزده دقیقه است. جاده تا شهر آسفالته و آرام است، پس خودرویی معمولی کافی است. در تسنوری
    یا خود دِدوپلیستسکارو باک را پر کنید: پس از شهر، به‌سوی واشلووانی، پمپ بنزینی نیست. برای خودِ مسیرهای
    خاکی واشلووانی، شاسی‌بلند یا یک خودروی چهارچرخ‌محرک واقعی لازم است.
he:
  name: דדופליסצקרו
  short: 'עיירת הגבול של מישור שיראקי: מוצב של דוד הבונה, מבצר רוסי, מיזם נפט של סימנס, והשער לוושלובני.'
  body: >-
    **דדופליסצקרו הייתה מוצב מלכותי, מבצר רוסי, מיזם נפט של סימנס ו"מעיין אדום" סובייטי, והיא עדיין העיירה
    האחרונה לפני הערבה.**


    היא שוכנת בגובה של כ-800 מטר על מישור שיראקי, בקצה הדרום-מזרחי הרחוק של גאורגיה, במקום שבו כרמי קאחתי
    מתחלפים בשדות חיטה ובערבה, ומעבר לזה, דרומה, לקראת הגבול עם אזרבייג'ן, מתחילים שטחי הבדלנדס השחוקים
    של ושלובני. שם המקום פירושו "מעיין המלכה": המסורת מספרת שהמלכה תמר הורתה להניח צינורות חרס כדי להוביל
    את מי המעיין אל העיירה.


    אנשים חיים בסביבה הזאת מאז תקופת הברונזה הקדומה, ויישובים של תרבות קורה-אראקס פזורים בה. בקרבת מקום
    נמצאות חורבות מצודת חורנבוג'י, שהמסורת מייחסת לוואחטנג גורגסאלי במאה החמישית, בעוד שהעיירה עצמה מוזכרת
    לראשונה בכרוניקות כמוצב צבאי של המלך דוד הבונה. בשנת 1803 בנו הרוסים כאן מצודה וקראו לה "בארות הצאר",
    ובשנת 1804 היא שימשה בסיס במלחמה בפרס. אלכסנדר דיומא עבר במקום ב-1858 וציין את חורנבוג'י ואת הר אליהו
    שבדרום. בשנת 1869 בנו האחים קרל היינריך וורנר פון סימנס בית זיקוק נפט בקרבת מקום — מיזם תעשייתי מוקדם
    בקווקז, שפעל עד אמצע שנות ה-1870.


    ב-18 בפברואר 1921 נלחמו כוחות גאורגיים במשך שעות בצבא האדום הפולש, ומפקד הכוחות הסובייטיים, פיוטר
    קורישקו, נהרג במקום. השלטון הסובייטי שינה את שם העיירה לציטלצקרו, "מעיין אדום", והעניק לה מעמד עיר
    ב-1963; השם הישן חזר ב-1991. כיום חיים בה 5,772 תושבים.


    למטייל, העיירה היא בראש ובראשונה שער כניסה. במרכז המבקרים שבה נרשמים לביקור בשמורות ושלובני, ומשם
    ממשיכים לחורנבוג'י ולנקיק הנשרים. אבל שווה להישאר גם לערב: כשהרוח שוככת והערבה מוארת בזהב, קל להבין
    מדוע נתנה המסורת למקום הזה שם של מלכה.
  tip: >-
    אם ושלובני היא מטרתכם, פנו קודם למרכז המבקרים בעיירה. ההרשמה חובה ותצטרכו דרכון, כך שכדאי להגיע בבוקר
    בשעות הפעילות. בעיירה יש כמה בתי הארחה משפחתיים ומזנונים פשוטים, ובמרכז יש כספומט ובית מרקחת. בקיץ
    הערבה מתחממת ליותר מ-35 מעלות וכמעט אין צל, כך שיש להביא מים וכובע. האביב והסתיו הם העונות הטובות
    ביותר, כשהמישור ירוק או זהוב והאוויר צלול. לעלייה לחורנבוג'י כדאי נעליים מתאימות.
  route: >-
    מטביליסי סעו בכביש קאחתי (S5) דרך סגארג'ו עד בקורציחה, פנו לכיוון צנורי והמשיכו דרומה בדרך המסומנת
    לדדופליסצקרו. המרחק כ-130 ק"מ, כשעתיים ורבע נסיעה. הכביש סלול ושקט לכל אורכו, כך שרכב רגיל מתאים עד
    לעיירה. תדלקו בצנורי או בדדופליסצקרו עצמה: מעבר לעיירה, בכיוון ושלובני, אין תחנות דלק. עבור מסלולי
    העפר של ושלובני עצמה דרוש רכב שטח גבוה או רכב 4×4 של ממש.
ar:
  name: ديدوبليستسكارو
  short: 'بلدة حدودية في سهل شيراكي: موقع عسكري لداود الباني، وحصن روسي، ومشروع نفطي لعائلة سيمنس، وبوابة
    إلى فاشلوفاني.'
  body: >-
    **كانت ديدوبليستسكارو موقعًا ملكيًا، وحصنًا روسيًا، ومشروعًا نفطيًا لعائلة سيمنس، و"نبع أحمر" سوفيتيًا،
    وما تزال إلى اليوم آخر بلدة قبل السهب.**


    تقع البلدة على ارتفاع نحو 800 متر في سهل شيراكي، في أقصى جنوب شرق جورجيا، حيث تتراجع كروم كاختي لتحل
    محلها حقول القمح والمراعي، وحيث تبدأ جنوبًا، قرب الحدود الأذربيجانية، أراضٍ وعرة متآكلة تابعة لفاشلوفاني.
    واسم البلدة يعني "نبع الملكة": تقول الروايات إن الملكة تامار أمرت بمد أنابيب من الفخار لجلب الماء
    من النبع.


    يعيش البشر في هذه الأنحاء منذ العصر البرونزي المبكر، وتنتشر حولها مستوطنات حضارة كورا-أراكس. وتقع
    بالقرب منها أنقاض قلعة خورنابوجي، التي تنسبها الروايات إلى واختانغ غورغاسالي في القرن الخامس، في حين
    يظهر اسم البلدة نفسها لأول مرة في السجلات التاريخية كموقع عسكري للملك داود الباني. وفي عام 1803 بنى
    الروس هنا حصنًا وسمّوه "آبار القيصر"، وفي عام 1804 استُخدم قاعدةً في الحرب مع بلاد فارس. وفي عام 1858
    مرّ بها ألكسندر دوما، فذكر خورنابوجي وجبل إلياس جنوبًا. وفي عام 1869 شيّد الأخوان كارل هاينريش وفرنر
    فون سيمنس معملًا لتقطير النفط بالقرب منها، وكان من المشاريع الصناعية المبكرة في القوقاز، واستمر عمله
    حتى منتصف السبعينيات من القرن التاسع عشر.


    وفي 18 فبراير 1921 قاتلت القوات الجورجية هنا ساعاتٍ عديدة ضد الجيش الأحمر الغازي، وقُتل القائد السوفيتي
    بيوتر كوريشكو في المكان نفسه. وأعادت السلطات السوفيتية تسمية البلدة "تسيتلتسكارو"، أي "النبع الأحمر"،
    ومنحتها صفة مدينة عام 1963؛ وعاد الاسم القديم عام 1991. ويعيش فيها اليوم 5,772 نسمة.


    وللمسافر، تبقى البلدة أولًا بوابة عبور: في مركز الزوار هنا يسجّل المرء نفسه قبل التوجه إلى محميات
    فاشلوفاني، ومنها إلى خورنابوجي ووادي النسور. لكن تستحق البلدة مساءً كاملًا أيضًا: فحين تهدأ الريح
    ويصطبغ السهب بالذهب، يسهل أن يفهم المرء لماذا أعطت الروايات هذا المكان اسم ملكة.
  tip: >-
    إذا كانت فاشلوفاني وجهتك، فتوقف أولًا عند مركز الزوار في البلدة. التسجيل إلزامي وتحتاج جواز سفرك،
    فاذهب في الصباح خلال ساعات العمل. تضم البلدة بضعة بيوت ضيافة عائلية ومطاعم بسيطة، وفي وسطها صرّاف
    آلي وصيدلية. في الصيف تتجاوز حرارة السهب 35 درجة ولا يكاد يوجد ظل، فاحمل ماءً وقبعة. الربيع والخريف
    أفضل الفصول، حين يكتسي السهل خضرةً أو ذهبًا ويصفو الهواء. ارتدِ حذاءً مناسبًا للصعود إلى خورنابوجي.
  route: >-
    من تبليسي، سِر على طريق كاختي السريع (S5) عبر ساغاريجو حتى باكورتسيخه، ثم انحرف نحو تسنوري وتابع جنوبًا
    على الطريق المُشار إليه نحو ديدوبليستسكارو. تبلغ المسافة نحو 130 كم في زهاء ساعتين وربع. الطريق معبّد
    وهادئ بأكمله حتى البلدة، فتكفي سيارة اقتصادية للوصول إليها. عبّئ الوقود في تسنوري أو في ديدوبليستسكارو
    نفسها: فبعد البلدة، نحو فاشلوفاني، لا توجد محطات وقود. وأما مسارات فاشلوفاني الترابية نفسها فتحتاج
    سيارة دفع رباعي حقيقية بارتفاع أرضي عالٍ.
