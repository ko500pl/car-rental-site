ka:
  name: ზედაზნის მონასტერი
  short: VI საუკუნის მონასტერი ტყიან ქედზე მცხეთის ზემოთ, საიდანაც მტკვრისა და არაგვის ხეობები ერთად ჩანს.
  body: >-
    **ზედაზენი VI საუკუნის მონასტერია ტყიან ქედზე და ასვლა ნაწილობრივ ხედის, ნაწილობრივ სიჩუმის გამო ღირს.**
    ეკლესიის წინა ტერასიდან ქვემოთ მტკვრისა და არაგვის ხეობები იშლება, დასავლეთით მცხეთა ღია ლაქად ჩანს,
    დილის ნათელ ამინდში კი ჩრდილოეთის ჰორიზონტზე კავკასიონის თოვლის ხაზი დგას.


    სახელი ზადენს უკავშირდება — წარმართულ ღვთაებას, რომლის კერპიც, გადმოცემით, ქრისტიანობამდე ამ ბორცვზე
    იდგა. დაახლოებით 545 წელს იოანე, ცამეტი ასურელი მამის წინამძღვარი, სწორედ ამ ადგილას დასახლდა; არჩევანი
    შემთხვევითი არ იყო. მას შემდეგ ადგილს ზედაზენი, ანუ „ზადენს ზემოთ", ჰქვია. იოანეს მოწაფეები ქართლსა
    და კახეთში გაიფანტნენ და დააარსეს ის მონასტრები, რომლებიც დღემდე განსაზღვრავენ ამ მხარეს — შიომღვიმე
    და ალავერდი მათ შორისაა.


    მთავარი ტაძარი VIII საუკუნის სამნავიანი ბაზილიკაა, აშენებული იოანეს საფლავზე, რომელიც აღმოსავლეთ ბოლოს,
    იატაკის ქვეშაა. ის სიმკაცრემდე მარტივია: უთლელი ქვა, პატარა სარკმლები, თითქმის უკვეთავი კედლები. ირგვლივ
    დგას:


    - გალავნისა და კუთხის კოშკის ნაშთები ღია ფერდობის მხრიდან


    - ორსართულიანი სამრეკლო და ბერების დანგრეული სენაკები


    - ეკლესიის ქვემოთ არსებული წყარო, რომელსაც იოანეს უკავშირებენ და დღემდე იყენებენ მლოცველები


    მონასტერი ხანგრძლივად იყო მიტოვებული და რამდენჯერმე აღადგინეს; ბერები 1990-იან წლებში დაბრუნდნენ,
    ამიტომ ტერიტორიის ნაწილი დახურულია. ასასვლელი გზის ტყე წიფლისა და რცხილისაა და ოქტომბერში, როცა მთელი
    ქედი სპილენძისფერი ხდება, ცალკე გაჩერებადაც ღირს.
  tip: >-
    ადგილზე საათნახევარი სავსებით საკმარისია, მაგრამ გზას დამატებითი დრო დაუთმე — ბოლო ხუთი კილომეტრი
    ნელია. მხრები და მუხლები დაფარული უნდა იყოს; შემოსახვევები და თავსაფრები კარიბჭესთანაა. მაღაზია, კაფე
    და საიმედო ტუალეტი არ არის, ამიტომ წყალი თან წაიღე. ტერასას მოაჯირი არ აქვს და სიმაღლე რეალურია —
    ბავშვები ახლოს იყოლიე. მაისში მონასტრის დღესასწაულზე ხალხი ბევრია და ვიწრო გზა მანქანებით იკეტება;
    სხვა დღეს შეიძლება მარტო აღმოჩნდე. ნისლმა ხედი მთლიანად შეიძლება დახუროს — დილით წადი.
  route: >-
    თბილისიდან ჩრდილოეთით სამხედრო გზით ან E60-ით გახვალ და მცხეთამდე აღმოსავლეთით, საგურამოსკენ გაუხვევ,
    შემდეგ კი ზედაზნის მიმანიშნებლებს გაჰყვები — დაახლოებით 40 კმ, ასვლის ჩათვლით ერთი საათი. ხეობის გზა
    ასფალტია; ბოლო ხუთი კილომეტრი ძველი ბეტონისა და ხრეშის ციცაბო ნაზავია, მჭიდრო სერპანტინებით და ბარიერების
    გარეშე. მშრალ ამინდში მოთმინებით ჩვეულებრივი მანქანაც ადის, მაგრამ გონივრული არჩევანი ჯიპია, წვიმის
    ან თოვლის შემდეგ კი — ერთადერთი. დააპარკინგე ზემოთ, გალავანთან. ბოლო საწვავი მცხეთაში ან საგურამოშია.
en:
  name: Zedazeni Monastery
  short: >-
    A 6th-century monastery on a wooded ridge above Mtskheta, with the Mtkvari and Aragvi valleys spread
    out below.
  body: >-
    **Zedazeni is a 6th-century monastery on a wooded ridge, and the climb is worth making partly for
    the view and partly for the silence.** From the terrace in front of the church the Mtkvari and Aragvi
    valleys open below, Mtskheta is a pale smudge to the west, and on a clear morning the snow line of
    the Greater Caucasus stands along the northern horizon.


    The name comes from Zaden, a pagan deity whose idol is said to have stood on this hill before Christianity.
    Around 545 John, leader of the Thirteen Assyrian Fathers, settled on exactly that spot — the choice
    was not accidental — and the place has been called Zedazeni, "above Zaden", ever since. John's disciples
    scattered across Kartli and Kakheti and founded the monasteries that still define this part of Georgia,
    Shio-Mgvime and Alaverdi among them.


    The main church is an 8th-century three-nave basilica raised over John's grave, which lies under the
    floor at the east end. It is plain to the point of severity: undressed stone, small windows, almost
    no carving. Around it stand:


    - the remains of a curtain wall and a corner tower on the exposed side


    - a two-storey bell tower and the ruined cells of the monks


    - a spring below the church, associated with John and still used by pilgrims


    The monastery was abandoned for long stretches and rebuilt several times; monks returned in the 1990s,
    so parts of the enclosure are now closed to visitors. The forest on the way up is beech and hornbeam
    and deserves a stop of its own in October, when the whole ridge turns copper. Bring binoculars: on
    a clear day the view north picks out the Gudauri slopes and, beyond them, the snow of the main range,
    while the Aragvi threads silver through the haze below.
  tip: >-
    Ninety minutes on site is ample, but allow extra for the drive — the last five kilometres are slow.
    Shoulders and knees covered; wraps and scarves are kept at the gate. There is no shop, no café and
    no reliable toilet, so bring water. The terrace has no railing and the drop is real, so keep children
    close. On the monastery's feast day in May the narrow road fills with parked cars; on almost any other
    day you may have the place to yourself. Mist can close the view completely, which is a good argument
    for going in the morning.
  route: >-
    Leave Tbilisi northwards on the Military Highway or the E60 and turn east towards Saguramo before
    Mtskheta, then follow the signs up to Zedazeni — about 40 km, an hour including the climb. The valley
    road is asphalt; the final five kilometres are a steep, broken mix of old concrete and gravel with
    tight hairpins and no barriers. A normal car gets up in dry weather if you are patient, but an SUV
    is the sensible choice and after rain or snow it is the only one. Park at the top by the wall. The
    last fuel is in Mtskheta or Saguramo.
ru:
  name: Монастырь Зедазени
  short: Монастырь VI века на лесистом хребте над Мцхетой, откуда разом видны долины Куры и Арагви.
  body: >-
    **Зедазени — монастырь VI века на лесистом хребте, и подниматься сюда стоит отчасти ради вида, отчасти
    ради тишины.** С террасы перед храмом внизу открываются долины Куры и Арагви, на западе бледным пятном
    лежит Мцхета, а ясным утром по северному горизонту встаёт снеговая линия Большого Кавказа.


    Название идёт от Задена — языческого божества, идол которого, по преданию, стоял на этом холме до
    христианства. Около 545 года Иоанн, предводитель Тринадцати ассирийских отцов, поселился именно здесь;
    выбор был не случайным. С тех пор место и зовётся Зедазени, «над Заденом». Ученики Иоанна разошлись
    по Картли и Кахети и основали монастыри, которые до сих пор определяют облик этих краёв, — среди них
    Шиомгвиме и Алаверди.


    Главный храм — трёхнефная базилика VIII века, поставленная над могилой Иоанна, которая находится под
    полом у восточной стены. Он прост до суровости: необработанный камень, маленькие окна, почти никакой
    резьбы. Вокруг стоят:


    - остатки крепостной стены и угловой башни с открытой стороны


    - двухъярусная колокольня и разрушенные монашеские кельи


    - родник ниже храма, связанный с именем Иоанна и до сих пор используемый паломниками


    Монастырь надолго пустел и не раз восстанавливался; монахи вернулись в 1990-х, поэтому часть ограды
    теперь закрыта для посетителей. Лес по дороге наверх — буковый и грабовый, и в октябре, когда весь
    хребет становится медным, он заслуживает отдельной остановки.
  tip: >-
    Полутора часов на месте более чем достаточно, но заложите время на дорогу: последние пять километров
    медленные. Плечи и колени должны быть закрыты, накидки и косынки лежат у ворот. Ни магазина, ни кафе,
    ни надёжного туалета здесь нет — берите воду. У террасы нет перил, а обрыв настоящий, так что детей
    держите рядом. В майский престольный праздник узкую дорогу забивают машины; в любой другой день вы
    вполне можете оказаться одни. Туман способен закрыть вид целиком — это довод в пользу утреннего визита.
  route: >-
    Из Тбилиси на север по Военно-Грузинской дороге или по E60, не доезжая Мцхеты свернуть на восток к
    Сагурамо, затем по указателям вверх на Зедазени — около 40 км, час с подъёмом. Долинная дорога асфальтовая;
    последние пять километров — крутая смесь старого бетона и гравия с тесными серпантинами и без отбойников.
    В сухую погоду обычная машина поднимается, если не спешить, но разумный выбор — внедорожник, а после
    дождя или снега он единственный. Парковка наверху, у ограды. Последняя заправка — в Мцхете или Сагурамо.
fa:
  name: صومعهٔ زدازنی
  short: صومعه‌ای از سدهٔ ششم بر یالی جنگلی بالای متسختا، که دره‌های مت‌کواری و آراگوی از آن یکجا دیده
    می‌شود.
  body: >-
    **زدازنی صومعه‌ای از سدهٔ ششم بر یالی جنگلی است و بالا رفتن تا آن، هم به خاطر چشم‌انداز می‌ارزد و
    هم به خاطر سکوت.** از مصطبهٔ پیش روی کلیسا، دره‌های مت‌کواری و آراگوی در پایین گسترده می‌شود، متسختا
    لکه‌ای روشن در غرب است و در صبح صاف، خط برف قفقاز بزرگ بر افق شمالی می‌ایستد.


    نام از زادن گرفته شده، خدایی بت‌پرست که می‌گویند بت او پیش از مسیحیت بر همین تپه بوده است. حدود سال
    545 یوهانِس، سرکردهٔ سیزده پدر آسوری، درست بر همان نقطه ساکن شد؛ انتخابی که تصادفی نبود. از آن پس
    این جا را زدازنی، یعنی «بالای زادن»، خوانده‌اند. شاگردان او در کارتلی و کاختی پراکنده شدند و صومعه‌هایی
    بنیاد نهادند که هنوز چهرهٔ این نواحی را می‌سازند، از جمله شیومغویمه و آلاوردی.


    کلیسای اصلی بازیلیکایی سه‌شبستانی از سدهٔ هشتم است که بر گور یوهانس ساخته شده؛ گور زیر کف و در انتهای
    شرقی است. بنا تا مرز خشونت ساده است: سنگ نتراشیده، پنجره‌های کوچک و تقریباً بی هیچ کنده‌کاری. پیرامون
    آن این‌ها ایستاده‌اند:


    - بازمانده‌های دیوار حصار و برجی گوشه‌ای در سمت بی‌پناه


    - برج ناقوس دوطبقه و حجره‌های ویران راهبان


    - چشمه‌ای پایین‌تر از کلیسا که آن را به یوهانس نسبت می‌دهند و زائران هنوز از آن برمی‌دارند


    صومعه دوره‌های درازی متروک ماند و چند بار بازسازی شد؛ راهبان در دههٔ 1990 بازگشتند و اکنون بخشی از
    محوطه بر بازدیدکنندگان بسته است. جنگل مسیر بالا از راش و ممرز است و در مهر و آبان، وقتی همهٔ یال مسی
    می‌شود، خودش ارزش یک توقف را دارد.
  tip: >-
    یک ساعت و نیم در محوطه بیش از کفایت است، اما برای راه وقت بیشتری بگذارید؛ پنج کیلومتر پایانی کند است.
    شانه و زانو باید پوشیده باشد و شال و روسری کنار دروازه نگهداری می‌شود. نه مغازه‌ای هست، نه کافه‌ای
    و نه سرویس بهداشتی قابل اتکایی، پس آب همراه ببرید. مصطبه نرده ندارد و پرتگاه واقعی است، پس کودکان
    را نزدیک نگه دارید. در جشن صومعه در اردیبهشت جادهٔ باریک از خودروهای پارک‌شده پر می‌شود؛ در هر روز
    دیگری ممکن است تنها باشید. مه می‌تواند چشم‌انداز را یکسره ببندد و همین دلیل خوبی است برای رفتن در
    صبح.
  route: >-
    از تفلیس به شمال روی بزرگراه نظامی یا E60 بروید و پیش از متسختا به سمت شرق به سوی ساگورامو بپیچید،
    سپس تابلوهای زدازنی را تا بالا دنبال کنید — حدود 40 کیلومتر و یک ساعت با احتساب صعود. جادهٔ دره آسفالت
    است؛ پنج کیلومتر پایانی آمیزه‌ای تند از بتن کهنه و شن است با پیچ‌های بستهٔ سربالایی و بدون حفاظ. در
    هوای خشک خودروی معمولی هم با صبوری بالا می‌رود، اما انتخاب عاقلانه خودروی شاسی‌بلند است و پس از باران
    یا برف تنها گزینه. بالا و کنار دیوار پارک کنید. آخرین پمپ بنزین در متسختا یا ساگوراموست.
he:
  name: מנזר זדאזני
  short: מנזר מן המאה השישית על רכס מיוער מעל מצחתה, שממנו נגלים יחד עמקי המטקוורי והאראגווי.
  body: >-
    **זדאזני הוא מנזר מן המאה השישית על רכס מיוער, וכדאי לטפס אליו בין השאר בזכות הנוף ובין השאר בזכות
    השקט.** מן המרפסת שלפני הכנסייה נפרשים למטה עמקי המטקוורי והאראגווי, מצחתה היא כתם בהיר במערב, ובבוקר
    צלול ניצב קו השלג של הקווקז הגדול לאורך האופק הצפוני.


    השם בא מזאדן, אל אלילי שלפי המסורת עמד פסלו על הגבעה הזאת לפני הנצרות. בסביבות שנת 545 התיישב יוחנן,
    ראש שלושה עשר האבות האשורים, בדיוק על אותה נקודה, והבחירה לא הייתה מקרית. מאז נקרא המקום זדאזני, כלומר
    «מעל זאדן». תלמידיו התפזרו בקרתלי ובקאחתי והקימו את המנזרים שעדיין מעצבים את האזור, ובהם שיאומגוימה
    ואלאוורדי.


    הכנסייה הראשית היא בזיליקה תלת-אולמית מן המאה השמינית שהוקמה מעל קברו של יוחנן, המצוי מתחת לרצפה בקצה
    המזרחי. היא פשוטה עד כדי חומרה: אבן לא מסותתת, חלונות קטנים וכמעט בלי גילוף. סביבה עומדים:


    - שרידי חומת מגן ומגדל פינתי בצד החשוף


    - מגדל פעמונים בן שתי קומות ותאי נזירים הרוסים


    - מעיין מתחת לכנסייה, המיוחס ליוחנן ומשמש עולי רגל עד היום


    המנזר ננטש לתקופות ארוכות ונבנה מחדש כמה פעמים; הנזירים חזרו בשנות התשעים, ולכן חלק מן המתחם סגור
    כיום למבקרים. היער בדרך למעלה הוא יער אשור וגרביל, ובאוקטובר, כשכל הרכס נצבע בנחושת, הוא ראוי לעצירה
    בפני עצמה.
  tip: >-
    שעה וחצי באתר די והותר, אך הוסיפו זמן לנסיעה: חמשת הקילומטרים האחרונים איטיים. כתפיים וברכיים מכוסות,
    וכיסויים ומטפחות מונחים בשער. אין חנות, אין בית קפה ואין שירותים אמינים, אז קחו מים. למרפסת אין מעקה
    והתהום אמיתית, לכן החזיקו ילדים קרוב. בחג המנזר במאי מתמלאת הדרך הצרה במכוניות חונות; בכל יום אחר
    ייתכן שתהיו שם לבדכם. ערפל עשוי לסגור את הנוף כליל, וזו סיבה טובה להגיע בבוקר.
  route: >-
    צאו מטביליסי צפונה בכביש הצבא או ב-E60 ופנו מזרחה לכיוון סאגוראמו לפני מצחתה, ואז עלו לפי השילוט לזדאזני
    — כ-40 ק״מ, שעה כולל הטיפוס. דרך העמק סלולה; חמשת הקילומטרים האחרונים הם תערובת תלולה ושבורה של בטון
    ישן וחצץ, עם סיבובי פרסה צרים ובלי מעקות. במזג אוויר יבש גם רכב רגיל עולה אם נוסעים בסבלנות, אבל רכב
    שטח הוא הבחירה ההגיונית, ואחרי גשם או שלג הוא היחיד. חונים למעלה ליד החומה. תחנת הדלק האחרונה היא
    במצחתה או בסאגוראמו.
ar:
  name: دير زيدازيني
  short: دير من القرن السادس على سلسلة مشجرة فوق متسخيتا، يُرى منه وادي متكفاري وأراغفي معاً.
  body: >-
    **زيدازيني دير من القرن السادس على سلسلة مشجرة، والصعود إليه يستحق العناء لأجل المنظر من جهة ولأجل
    الصمت من جهة أخرى.** من المصطبة أمام الكنيسة ينفتح في الأسفل واديا متكفاري وأراغفي، وتبدو متسخيتا
    بقعة فاتحة إلى الغرب، وفي صباح صافٍ يقف خط الثلج في القوقاز الكبير على الأفق الشمالي.


    الاسم مأخوذ من زادن، وهو معبود وثني يُقال إن صنمه كان قائماً على هذه التلة قبل المسيحية. ونحو عام
    545 استقر يوانه، كبير الآباء الآشوريين الثلاثة عشر، في الموضع نفسه؛ ولم يكن الاختيار عارضاً. ومنذ
    ذلك الحين سُمي المكان زيدازيني، أي «فوق زادن». وقد تفرق تلاميذه في كارتلي وكاخيتي وأسسوا الأديرة التي
    ما تزال تحدد ملامح هذه النواحي، ومنها شيومغفيمي وألافيردي.


    الكنيسة الرئيسية بازيليكا بثلاثة أروقة من القرن الثامن، أقيمت فوق قبر يوانه القائم تحت الأرضية في
    الطرف الشرقي. وهي بسيطة إلى حد الشدة: حجر غير منحوت، ونوافذ صغيرة، ولا زخرفة تُذكر. ويقوم حولها:


    - بقايا سور دفاعي وبرج ركني في الجهة المكشوفة


    - برج أجراس من طابقين وقلالي رهبان مهدمة


    - نبع أسفل الكنيسة يُنسب إلى يوانه وما زال الحجاج يأخذون منه


    هُجر الدير فترات طويلة وأعيد بناؤه مرات؛ وعاد الرهبان في تسعينيات القرن الماضي، فصار جزء من الحرم
    مغلقاً أمام الزوار. وغابة الطريق الصاعد من الزان والغرب، وتستحق في تشرين الأول وقفة خاصة حين تصير
    السلسلة كلها نحاسية اللون.
  tip: >-
    ساعة ونصف في الموقع أكثر من كافية، لكن احسب وقتاً إضافياً للطريق؛ فالكيلومترات الخمسة الأخيرة بطيئة.
    تُغطى الأكتاف والركب، والأغطية وأغطية الرأس عند البوابة. لا متجر ولا مقهى ولا دورة مياه يُعتمد عليها،
    فاحمل ماءً. المصطبة بلا درابزين والهبوط حقيقي، فأبقِ الأطفال قريبين. وفي عيد الدير في أيار تمتلئ الطريق
    الضيقة بالسيارات المركونة؛ وفي أي يوم آخر قد تكون وحدك. وقد يحجب الضباب المنظر كله، وهذه حجة كافية
    للمجيء صباحاً.
  route: >-
    اخرج من تبليسي شمالاً على الطريق العسكري أو على E60، وقبل متسخيتا انعطف شرقاً نحو ساغورامو ثم اتبع
    اللافتات صعوداً إلى زيدازيني — نحو 40 كم وساعة مع الصعود. طريق الوادي معبّد؛ أما الكيلومترات الخمسة
    الأخيرة فخليط شديد الانحدار من خرسانة قديمة وحصى، بمنعطفات ضيقة وبلا حواجز. في الجو الجاف تصعد سيارة
    عادية إن تحليت بالصبر، لكن الخيار المعقول سيارة دفع رباعي، وبعد المطر أو الثلج هي الخيار الوحيد. أوقف
    السيارة في الأعلى قرب السور. آخر محطة وقود في متسخيتا أو ساغورامو.
