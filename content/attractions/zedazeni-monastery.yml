ka:
  name: ზედაზნის მონასტერი
  short: >-
    საგურამოს ტყიან ქედზე, მცხეთის თავზე — მთა, სადაც ასურელ მამათა წინამძღვარი იოანე წარმართული კერპის
    ნაალაგევზე დამკვიდრდა.
  body: >-
    **გადმოცემით, საგურამოს ქედის ამ მწვერვალზე წარმართული ღვთაების, ზადენის კერპი იდგა; VI საუკუნეში
    აქ სირიიდან მოსული ბერი ამოვიდა, კერპის ნაშთთან დაემკვიდრა და მას შემდეგ თავად ატარებს მთის სახელს.**


    ეს ბერი იოანე ზედაზნელი იყო, ცამეტ ასურელ მამათა წინამძღვარი. მცხეთაში VI საუკუნის შუა ხანებში მოვიდა
    და ქვემოთ მდებარე სამეფო ქალაქს ეს უკაცრიელი სიმაღლე ამჯობინა. აქედან გაგზავნა მოწაფეები ქართლსა და
    კახეთში — შიო მცხეთის დასავლეთით, თავის მღვიმეში წავიდა, — თავად კი ორ თანამოღვაწესთან ერთად დარჩა.
    ტაძარი არ აუშენებია: მხოლოდ მღვიმე-სამლოცველო და რამდენიმე სენაკი მოაწყო. ქართული ტრადიციით 573 წელს
    გარდაიცვალა და საგანგებოდ მისთვის აგებულ მცირე ეკლესიაში დაკრძალეს.


    ის ეკლესია დღეს უფრო დიდი ტაძრის შიგნითაა. VIII საუკუნის ბოლოს კათოლიკოსმა კლემენტოსმა იოანე ნათლისმცემლის
    სამნავიანი ბაზილიკა ააგო და VI-VII საუკუნეთა მიჯნის ძველი დარბაზული ეკლესია მის ჩრდილოეთ ნავში მოაქცია.
    იქ, ოთხი საფეხურით ამაღლებულ ადგილას, იოანეს ქვის კუბო დგას, რომლის მესამედი საკურთხეველშია შეჭრილი.
    კედლები რიყის ქვით, ნატეხი ქვითა და აგურით არის ნაგები, ფასადებს მხოლოდ მარტივი ჯვარი ამკობს; სამხრეთის
    კარიბჭეზე XVIII საუკუნის აგურის რვაწახნაგა სამრეკლო დგას, ოთხივე მხრიდან თაღებით გახსნილი.


    მწვერვალი ციხეც იყო. 1101 წელს დავით აღმაშენებელმა ზედაზენი კახთა მეფეს წაართვა, აქ შეფარებული კახელთა
    და თურქ-სელჩუკთა ლაშქარი გაანადგურა და ციხე თავის თანამებრძოლს, ნიანია ბაკურიანს უბოძა. სამონასტრო
    ცხოვრება 1705 წელს და კვლავ 1915-1922 წლებში შეწყდა; რესტავრატორები აქ 1938 და 1970-1971 წლებში მუშაობდნენ.


    მთის კიდიდან მცხეთა შორს, ქვემოთ, მდინარეთა შესაყარზე მოჩანს — იმდენად პატარა, რომ აწეული ხელის მტევანი
    დაფარავს. იქნებ სწორედ ამ მანძილს ეძებდა იოანე.
  tip: >-
    მწვერვალზე საათნახევარი გამოყავით, ნელი ბოლო აღმართისთვის კი დამატებითი დრო. მხრები და მუხლები დაფარული
    უნდა გქონდეთ, ქალებმა თავსაფარი წამოიღონ. კაფე, მაღაზია და საიმედო ტუალეტი არ არის — წყალი და საგზალი
    თან იქონიეთ. მწვერვალის კიდე ადგილ-ადგილ შემოუღობავია, ამიტომ ბავშვებს თვალი ადევნეთ. ქედზე შეიძლება
    ღრუბელი დაწვეს და ხედი მთლიანად შთანთქას: ამინდის პროგნოზი წინასწარ ნახეთ და დილით წადით. ოქტომბერში
    ამავალი გზის ტყე სპილენძისფრად და ოქროსფრად იფერება — ცალკე გაჩერებადაც ღირს.
  route: >-
    თბილისიდან ჩრდილო-დასავლეთით S1 (E60) ავტომაგისტრალით გადით, მცხეთის გასასვლელს გასცდით და წიწამურთან
    გადაუხვიეთ, სადაც საგურამოსკენ შ149 გზა იყოფა. მას და ზედაზნის მიმანიშნებლებს გაჰყევით; ბოლო 4-5 კმ
    ქედზე მჭიდრო სერპანტინებით ადის — ციცაბოდ, ძველი ბეტონისა და ხრეშის ნაზავზე, ბარიერების გარეშე. თბილისის
    ცენტრიდან დაახლოებით 36 კმ და ერთი საათია. მშრალ ამინდში ფრთხილი მძღოლი ჩვეულებრივი მანქანითაც ამოვა,
    მაგრამ გონივრული არჩევანი ჯიპია, წვიმის ან თოვლის შემდეგ კი — ერთადერთი. მანქანა მონასტრის გალავანთან
    დატოვეთ. ავზი ავტომაგისტრალიდან გადასვლამდე შეავსეთ.
en:
  name: Zedazeni Monastery
  short: >-
    On the forested Saguramo ridge above Mtskheta, the hill where John, leader of the Thirteen Assyrian
    Fathers, settled on the site of a pagan idol.
  body: >-
    **Tradition says an idol of the pagan god Zaden once stood on this summit of the Saguramo ridge; in
    the 6th century a monk from Syria climbed up, settled beside its ruin, and he has borne the hill's
    name ever since.**


    The monk was John — John of Zedazeni — leader of the Thirteen Assyrian Fathers. He came to Mtskheta
    in the mid-6th century and chose this empty height over the royal town below. From here he sent his
    disciples across Kartli and Kakheti — Shio went to his cave west of Mtskheta — and stayed behind with
    two companions. He built no church, only a cave chapel and a few cells, and when he died, in 573 by
    Georgian tradition, he was buried in a small chapel raised for him.


    That chapel now lies inside a larger church. At the end of the 8th century Catholicos Clement built
    a three-aisled basilica of St John the Baptist and folded the old hall church, of around 600, into
    its north aisle. There, up four steps, stands John's stone sarcophagus, a third of it pushed into
    the sanctuary. The walls are river cobbles, rubble and brick, the facades bare but for a simple carved
    cross; over the south porch rises an 18th-century octagonal brick belfry, open on four arches.


    The summit was a stronghold too. In 1101 David the Builder took Zedazeni from the King of Kakheti,
    destroying the Kakhetian and Seljuk troops sheltering in it, and gave it to his comrade-in-arms Niania
    Bakuriani. Monastic life lapsed in 1705 and again in 1915–22; restorers came in 1938 and again in
    1970–71.


    From the edge of the hill, Mtskheta lies far below at the meeting of its rivers, small enough to hide
    behind a raised hand — perhaps exactly the distance John had in mind.
  tip: >-
    Allow an hour and a half at the top, plus time for the slow final climb. Cover shoulders and knees;
    women should bring a headscarf. There is no café or shop and no reliable toilet, so bring water and
    a snack. The edge of the summit is unfenced in places — keep children close. Cloud can settle on the
    ridge and swallow the view entirely, so check the forecast and aim for the morning. In October the
    forest on the approach turns copper and gold and deserves a stop of its own.
  route: >-
    Take the S1 motorway (E60) north-west from Tbilisi, past the Mtskheta exit, and leave it at Tsitsamuri,
    where the Sh149 branches off towards Saguramo. Follow it and the signs for Zedazeni; the last 4–5
    km climb the ridge in tight hairpins on a steep, broken mix of old concrete and gravel with no barriers.
    That is about 36 km and an hour from central Tbilisi. In dry weather a careful driver in an ordinary
    car will get up, but an SUV is the sensible choice, and after rain or snow the only one. Park by the
    monastery wall. Fill the tank before you leave the motorway.
ru:
  name: Монастырь Зедазени
  short: >-
    Вершина лесистого Сагурамского хребта над Мцхетой, где Иоанн, глава Тринадцати ассирийских отцов,
    поселился на месте языческого идола.
  body: >-
    **Предание гласит, что когда-то на этой вершине Сагурамского хребта стоял идол языческого бога Задени;
    в VI веке сюда поднялся монах из Сирии, поселился у его развалин — и с тех пор носит имя этой горы.**


    Монахом был Иоанн — Иоанн Зедазнели, глава Тринадцати ассирийских отцов. Он пришёл в Мцхету в середине
    VI века и предпочёл царскому городу внизу эту пустынную высоту. Отсюда он рассылал учеников по Картли
    и Кахетии — Шио ушёл в свою пещеру к западу от Мцхеты, — а сам остался здесь с двумя сподвижниками.
    Церкви он не строил, лишь пещерную часовню и несколько келий, а когда умер — по грузинской традиции,
    в 573 году, — его похоронили в небольшой часовне, возведённой для него.


    Теперь эта часовня заключена в большей церкви. В конце VIII века католикос Климент построил трёхнефную
    базилику Иоанна Крестителя и включил в её северный неф старую зальную церковь около 600 года. Там,
    на четыре ступени выше, стоит каменный саркофаг Иоанна, на треть задвинутый в алтарь. Стены сложены
    из речного булыжника, бута и кирпича, фасады голы, если не считать простого резного креста; над южным
    притвором поднимается восьмигранная кирпичная звонница XVIII века, открытая четырьмя арками.


    Вершина служила и крепостью. В 1101 году Давид Строитель отнял Зедазени у кахетинского царя, уничтожив
    укрывавшиеся здесь кахетинские и сельджукские войска, и отдал её своему соратнику Ниании Бакуриани.
    Монашеская жизнь прерывалась в 1705 году и снова в 1915–22 годах; реставраторы приходили в 1938-м
    и ещё раз в 1970–71 годах.


    С края холма видна Мцхета — далеко внизу, у слияния своих рек, такая маленькая, что её можно заслонить
    поднятой ладонью. Возможно, именно такого расстояния и искал Иоанн.
  tip: >-
    Отведите на вершине полтора часа, плюс время на медленный последний подъём. Плечи и колени должны
    быть закрыты; женщинам стоит взять платок. Нет ни кафе, ни магазина, ни надёжного туалета, так что
    возьмите воду и перекус. Край вершины местами не огорожен — держите детей рядом. На хребет может лечь
    облако и целиком проглотить вид, поэтому проверьте прогноз и старайтесь приехать утром. В октябре
    лес на подъезде становится медно-золотым и заслуживает отдельной остановки.
  route: >-
    Выезжайте из Тбилиси на северо-запад по автомагистрали S1 (E60), минуйте съезд на Мцхету и сверните
    у Цицамури, где от трассы отходит дорога Sh149 на Сагурамо. Следуйте по ней и по указателям на Зедазени;
    последние 4–5 км забираются на хребет крутыми серпантинами по разбитой смеси старого бетона и гравия,
    без ограждений. Всего около 36 км и час от центра Тбилиси. В сухую погоду аккуратный водитель поднимется
    и на обычной машине, но разумный выбор — внедорожник, а после дождя или снега — единственный. Паркуйтесь
    у монастырской стены. Заправьтесь до того, как съедете с магистрали.
fa:
  name: دیر زدازنی
  short: بر یال جنگلی ساگورامو بالای متسختا، تپه‌ای که یوحنا، سرکردهٔ سیزده پدر آشوری، بر جای بتی کهن
    در آن مأوا گزید.
  body: >-
    **روایت است که روزگاری بت زادن، خدای بت‌پرستان، بر این قلهٔ رشته‌کوه ساگورامو ایستاده بود؛ در سدهٔ
    ششم راهبی از سوریه به اینجا بالا آمد، کنار ویرانهٔ آن ماندگار شد و از آن پس نام این تپه را بر خود
    دارد.**


    آن راهب یوحنا بود — یوحنای زدازنی — سرکردهٔ سیزده پدر آشوری. او در میانهٔ سدهٔ ششم به متسختا آمد و
    این بلندی خالی را بر شهر شاهی پایین‌دست برگزید. از اینجا شاگردانش را به سراسر کارتلی و کاختی فرستاد
    — شیو به غار خود در غرب متسختا رفت — و خود با دو یار همین‌جا ماند. کلیسایی نساخت، تنها نمازخانه‌ای
    در غار و چند حجره؛ و چون درگذشت، بنا بر سنت گرجی در ۵۷۳، در نمازخانهٔ کوچکی که برایش برپا کردند به
    خاک سپرده شد.


    آن نمازخانه اکنون درون کلیسایی بزرگ‌تر جای گرفته است. در پایان سدهٔ هشتم، جاثلیق کلمنت بازیلیکایی
    سه‌ناوی به نام یحیای تعمیددهنده ساخت و کلیسای تالاری کهنِ حدود سال ۶۰۰ را در ناو شمالی آن جای داد.
    آنجا، چهار پله بالاتر، تابوت سنگی یوحنا قرار دارد که یک‌سومش در محراب فرو رفته است. دیوارها از قلوه‌سنگ
    رودخانه، لاشه‌سنگ و آجر است و نماها برهنه‌اند جز صلیبی ساده و کنده‌کاری‌شده؛ بر فراز ایوان جنوبی،
    ناقوس‌خانه‌ای آجری و هشت‌ضلعی از سدهٔ هجدهم برخاسته که با چهار طاق به بیرون گشوده است.


    این قله دژ هم بود. در ۱۱۰۱ داوید سازنده زدازنی را از شاه کاختی گرفت، سپاهیان کاختی و سلجوقی را که
    در آن پناه گرفته بودند نابود کرد و آن را به هم‌رزمش نیانیا باکوریانی سپرد. زندگی رهبانی در ۱۷۰۵ و
    بار دیگر در ۱۹۱۵–۲۲ متوقف شد؛ مرمت‌گران در ۱۹۳۸ و دوباره در ۱۹۷۰–۷۱ به اینجا آمدند.


    از لبهٔ تپه، متسختا در دوردستِ پایین، در محل به‌هم‌پیوستن رودهایش پیداست، چنان کوچک که پشت دستی بالاگرفته
    پنهان می‌شود — شاید درست همان فاصله‌ای که یوحنا در سر داشت.
  tip: >-
    در بالا یک ساعت و نیم وقت بگذارید، به‌علاوهٔ زمانِ صعود آهستهٔ پایانی. شانه‌ها و زانوها را بپوشانید؛
    زنان روسری همراه بیاورند. نه کافه‌ای هست، نه مغازه‌ای، نه سرویس بهداشتی قابل‌اعتمادی؛ پس آب و خوراکی
    سبک بیاورید. لبهٔ قله در جاهایی نرده ندارد — کودکان را نزدیک خود نگه دارید. ابر ممکن است روی یال بنشیند
    و منظره را یکسره ببلعد، پس پیش‌بینی هوا را ببینید و صبح بیایید. در ماه اکتبر، جنگلِ سر راه مسی و طلایی
    می‌شود و خودش توقفی جداگانه می‌طلبد.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی شمال‌غرب بگیرید، از خروجی متسختا بگذرید و در تسیتسامووری از آن
    خارج شوید، جایی که جادهٔ Sh149 به سوی ساگورامو جدا می‌شود. آن را و تابلوهای زدازنی را دنبال کنید؛
    ۴ تا ۵ کیلومتر پایانی با پیچ‌های تند و تنگ از یال بالا می‌رود، روی آمیزه‌ای شیب‌دار و شکسته از بتن
    کهنه و شن، بی‌هیچ گاردریلی. از مرکز تفلیس حدود ۳۶ کیلومتر و یک ساعت راه است. در هوای خشک رانندهٔ محتاط
    با خودرویی معمولی هم به بالا می‌رسد، اما شاسی‌بلند انتخاب عاقلانه است و پس از باران یا برف تنها انتخاب.
    کنار دیوار دیر پارک کنید. پیش از خروج از بزرگراه باک را پر کنید.
he:
  name: מנזר זדאזני
  short: >-
    על רכס סגוראמו המיוער מעל מצחתה — הגבעה שבה התיישב יוחנן, מנהיג שלושה-עשר האבות האשורים, במקום שבו
    עמד פסל של אליל.
  body: >-
    **המסורת מספרת שפעם עמד על פסגה זו של רכס סגוראמו פסל של האל האלילי זאדן; במאה ה-6 טיפס לכאן נזיר
    מסוריה, התיישב ליד חורבותיו, ומאז הוא נושא את שמה של הגבעה.**


    הנזיר היה יוחנן — יוחנן מזדאזני — מנהיגם של שלושה-עשר האבות האשורים. הוא הגיע למצחתה באמצע המאה ה-6
    והעדיף את הגובה השומם הזה על פני עיר המלוכה שלמטה. מכאן שלח את תלמידיו לרחבי קרתלי וקאחטי — שיו הלך
    אל המערה שלו ממערב למצחתה — ונשאר כאן עם שני חברים. הוא לא בנה כנסייה, רק קפלה במערה וכמה תאי נזירים;
    וכשמת, ב-573 לפי המסורת הגאורגית, נקבר בקפלה קטנה שהוקמה עבורו.


    הקפלה ההיא שוכנת כיום בתוך כנסייה גדולה יותר. בסוף המאה ה-8 בנה הקתוליקוס קלמנט בזיליקה תלת-ספינתית
    על שם יוחנן המטביל, ושילב בספינה הצפונית שלה את כנסיית האולם הישנה מסביבות שנת 600. שם, ארבע מדרגות
    למעלה, עומד סרקופג האבן של יוחנן, ששליש ממנו דחוק אל תוך אזור המזבח. הקירות בנויים מאבני נחל, מאבני
    גוויל ומלבנים; החזיתות חשופות מלבד צלב מגולף פשוט, ומעל המבואה הדרומית מתנשא מגדל פעמונים מתומן מלבנים
    מן המאה ה-18, הפתוח בארבע קשתות.


    הפסגה שימשה גם מבצר. ב-1101 נטל דוד הבונה את זדאזני ממלך קאחטי, השמיד את הכוחות הקאחטיים והסלג'וקיים
    שמצאו בה מחסה, ונתן אותה לרעו לנשק ניאניה בקוריאני. חיי הנזירות פסקו ב-1705 ושוב ב-1915–22; משחזרים
    הגיעו ב-1938 ושוב ב-1970–71.


    משפת הגבעה נראית מצחתה הרחק למטה, במפגש נהרותיה, קטנה כל כך שיד מורמת מסתירה אותה — אולי בדיוק המרחק
    שיוחנן ביקש.
  tip: >-
    הקדישו שעה וחצי למעלה, ועוד זמן לטיפוס האחרון והאיטי. כסו כתפיים וברכיים; נשים יביאו כיסוי ראש. אין
    בית קפה, אין חנות ואין שירותים שאפשר לסמוך עליהם, אז הביאו מים וחטיף. שפת הפסגה אינה מגודרת בחלקה
    — השגיחו על ילדים מקרוב. ענן עלול לשקוע על הרכס ולבלוע את הנוף כליל, לכן בדקו את התחזית וכוונו לשעות
    הבוקר. באוקטובר היער שבדרך מתלבש נחושת וזהב, ושווה עצירה משלו.
  route: >-
    צאו מטביליסי צפון-מערבה בכביש המהיר S1 (E60), עברו על פני מחלף מצחתה, ורדו ממנו בציצאמורי, שם מתפצל
    כביש Sh149 לכיוון סגוראמו. המשיכו בו ואחרי השלטים לזדאזני; 4–5 הק"מ האחרונים מטפסים על הרכס בעיקולי
    סרפנטינה חדים, על תערובת תלולה ושבורה של בטון ישן וחצץ, בלי מעקות בטיחות. בסך הכול כ-36 ק"מ ושעה נסיעה
    ממרכז טביליסי. במזג אוויר יבש נהג זהיר יעלה גם ברכב רגיל, אבל רכב שטח הוא הבחירה הנבונה, ואחרי גשם
    או שלג — היחידה. חנו ליד חומת המנזר. מלאו את המכל לפני שאתם יורדים מהכביש המהיר.
ar:
  name: دير زيدازيني
  short: >-
    على سلسلة ساغورامو الحرجية فوق متسخيتا، التلّ الذي استقر فيه يوحنا، زعيم الآباء الآشوريين الثلاثة
    عشر، في موضع صنم وثني.
  body: >-
    **يروي التقليد أن صنماً للإله الوثني زادن قام يوماً على هذه القمة من سلسلة ساغورامو؛ وفي القرن السادس
    صعد إليها راهب من سوريا، وأقام بجوار أطلاله، وما زال يحمل اسم التلّ منذ ذلك الحين.**


    كان الراهب يوحنا، يوحنا الزيدازيني، زعيم الآباء الآشوريين الثلاثة عشر. قدم إلى متسخيتا في منتصف القرن
    السادس، وآثر هذه الذروة الخالية على المدينة الملكية في الأسفل. ومن هنا بعث تلاميذه في أرجاء كارتلي
    وكاخيتي، فمضى شيو إلى كهفه غرب متسخيتا، وبقي هو هنا مع رفيقين. لم يبنِ كنيسة، بل مصلّى في كهف وبضع
    قلايات؛ ولما مات، عام 573 بحسب التقليد الجورجي، دُفن في كنيسة صغيرة شُيّدت له.


    وتقع تلك الكنيسة الصغيرة اليوم داخل كنيسة أكبر. ففي أواخر القرن الثامن بنى الكاثوليكوس كليمنت بازيليكا
    ثلاثية الأجنحة على اسم يوحنا المعمدان، وضمّ إلى جناحها الشمالي كنيسة القاعة القديمة التي تعود إلى
    نحو عام 600. وهناك، على ارتفاع أربع درجات، يقوم تابوت يوحنا الحجري، وقد دُفع ثلثه داخل الهيكل. الجدران
    من حصى النهر والدبش والآجر، والواجهات عارية إلا من صليب منحوت بسيط؛ وفوق الرواق الجنوبي يرتفع برج
    أجراس مثمّن من الآجر يعود إلى القرن الثامن عشر، مفتوح على أربعة أقواس.


    وكانت القمة حصناً أيضاً. ففي عام 1101 انتزع داود البنّاء زيدازيني من ملك كاخيتي، وأباد القوات الكاخيتية
    والسلجوقية المتحصنة فيها، ثم منحها لرفيق سلاحه نيانيا باكورياني. انقطعت الحياة الرهبانية عام 1705،
    ثم مرة أخرى في 1915–22؛ وجاء المرمّمون عام 1938 ثم في 1970–71.


    ومن حافة التل تبدو متسخيتا بعيدة في الأسفل عند ملتقى نهريها، صغيرةً إلى حدّ أن تحجبها يدٌ مرفوعة،
    ولعلّ هذه بالضبط هي المسافة التي أرادها يوحنا.
  tip: >-
    خصّص ساعة ونصفاً في الأعلى، إضافة إلى وقت الصعود الأخير البطيء. غطِّ كتفيك وركبتيك، وعلى النساء إحضار
    غطاء للرأس. لا مقهى ولا متجر ولا دورات مياه يُعتمد عليها، فاحمل ماءً ووجبة خفيفة. حافة القمة بلا سياج
    في بعض المواضع، فأبقِ الأطفال قريبين منك. قد يستقر السحاب على السلسلة ويبتلع المنظر كله، فتحقق من
    النشرة الجوية واحرص على المجيء صباحاً. وفي أكتوبر تكتسي الغابة على الطريق بلون النحاس والذهب، وتستحق
    وقفة خاصة بها.
  route: >-
    اسلك الطريق السريع S1 (E60) باتجاه الشمال الغربي من تبليسي، متجاوزاً مخرج متسخيتا، واخرج منه عند تسيتسامووري
    حيث يتفرع الطريق Sh149 نحو ساغورامو. اتبعه واتبع اللافتات إلى زيدازيني؛ آخر 4–5 كم تتسلق السلسلة في
    منعطفات حادة متلاحقة، على خليط شديد الانحدار ومتكسّر من الخرسانة القديمة والحصى، من دون حواجز. المسافة
    نحو 36 كم وساعة من وسط تبليسي. في الطقس الجاف يصل السائق الحذر بسيارة عادية، لكن سيارة الدفع الرباعي
    هي الخيار الحكيم، وبعد المطر أو الثلج هي الخيار الوحيد. اركن بجوار سور الدير. املأ الخزان قبل أن تغادر
    الطريق السريع.
