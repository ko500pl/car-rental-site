ka:
  name: ლიკანის სასახლე (რომანოვების საზაფხულო რეზიდენცია)
  short: >-
    რომანოვების აგურის საზაფხულო სასახლე მტკვრის ნაპირზე, ბორჯომთან, რომელსაც 1898 წლიდან, როგორც ამბობენ,
    რუსეთის იმპერიის პირველი ჰიდროსადგური ანათებდა.
  body: >-
    **1898 წელს ლიკანში ელექტროსადგური ერთადერთი მიზნით, ერთი სახლის გასანათებლად, ააგეს და ის რუსეთის
    იმპერიის პირველ ჰიდროელექტროსადგურად არის ცნობილი.** ეს სახლი დიდი მთავრის, ნიკოლოზ მიხეილის ძე რომანოვის,
    საზაფხულო რეზიდენციაა, 1892–1895 წლებში აგებული მტკვრის ნაპირზე, ბორჯომის დასავლეთ კიდეზე. პროექტი
    პეტერბურგელ ხუროთმოძღვარს, ლეონ ბენუას, ეკუთვნის, მშენებლობას კი ადგილზე თბილისელი არქიტექტორი ლ.
    ბილფელდი ხელმძღვანელობდა.


    ეს უფრო დიდი, გონივრულად მოწყობილი ვილაა, ვიდრე სასახლე: დაახლოებით 690 კვადრატული მეტრი, საგანგებოდ
    მოწყობილ ტერასაზე. გეგმა ასიმეტრიულია და ორი ფასადი ერთნაირად არ არის მორთული: წითელ აგურს კრემისფერი
    სარტყლები სერავს, თაღები მრგვალია, ზემოთ ოთხკუთხა ბელვედერის კოშკი აღმართულა, წინ კი ღია ფერის ნახევარწრიული
    პორტიკი. სასახლის ირგვლივ დიდმა მთავარმა ვრცელი პარკი ორანჟერეით გააშენა. რომანოვების დრო სერგეი პროკუდინ-გორსკის
    ადრეულ ფერად ფოტოებში შემორჩა, თავდაპირველი ავეჯის ნაწილი კი დღეს თბილისში, სიმონ ჯანაშიას მუზეუმშია.


    საბჭოთა ხელისუფლების დამყარების შემდეგ სახლი სახელმწიფოს გადაეცა და კომუნისტური ლიდერების, მათ შორის
    სტალინის, დასასვენებელ ადგილად იქცა. დღეს ეს საქართველოს პრეზიდენტის საზაფხულო რეზიდენციაა, 2016 წლიდან
    კი მუზეუმიც. მუზეუმის თანამშრომლების თქმით, კოლექციაში ინახება ნაპოლეონის მიერ რომანოვებისთვის ნაჩუქარი
    მაგიდა, ირანის შაჰის საჩუქარი სავარძელი, პეტრე პირველის ხელით კაკლის ხისგან გამოთლილი მაგიდა და ოჯახის
    ბილიარდის მაგიდა.


    ლიკანი, ოდესღაც ცალკე სოფელი, დღეს ბორჯომის ნაწილია, ახლოს კი ბორჯომ-ხარაგაულის ეროვნული პარკის ბილიკები
    იწყება. მდინარის გასწვრივ საღამოს გაისეირნეთ, როცა მტკვარს ნისლი აძვრება და ზოლიანი აგური პარკის მაღალ
    წიწვოვნებს შორის მოწითალოდ ღვივის.
  tip: >-
    ლიკანს ერთი საათი დაუთმეთ და არა მთელი დღე. ეს ერთდროულად მუზეუმიცაა და მოქმედი საპრეზიდენტო რეზიდენციაც,
    ამიტომ ვიზიტები ექსკურსიების სახით იმართება, რომელთა განრიგი სეზონისა და ოფიციალური კალენდრის მიხედვით
    იცვლება, სახელმწიფო საჭიროებისას კი ჭიშკარი შეიძლება დაიკეტოს. წასვლამდე ბორჯომის ტურისტულ-საინფორმაციო
    ცენტრში გადაამოწმეთ. ტერიტორია დაცულია: სად შეიძლება გადაღება, ამას თანამშრომლები გეტყვიან. კაფეები
    და ტუალეტი ბორჯომის ცენტრშია. ქალაქიდან ფეხით მისვლაც სასიამოვნოა: დაახლოებით 45 წუთი, სწორ გზაზე,
    მტკვრის გასწვრივ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია, იქიდან S8-ით
    სამხრეთისკენ უხვევთ და მტკვარს ბორჯომამდე მიჰყვებით, სულ დაახლოებით 160 კილომეტრი. ქალაქში S8-ს ახალციხის
    მიმართულებით მიჰყევით; დაახლოებით სამ კილომეტრში ლიკანია, სასახლე კი მდინარის ნაპირზე, საკარიბჭე შენობის
    მიღმა დგას. სულ 164 კმ და დაახლოებით 2 საათი და 25 წუთი. გზა ბოლომდე ასფალტია; დეკემბრიდან მარტამდე
    ზამთრის საბურავები აუცილებელია, ხეობაში ყინული და ნისლი იცის. მანქანა ჭიშკართან ახლოს, გზისპირას დააყენეთ.
    საწვავი ხაშურში ან ბორჯომში ჩაასხით. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში საკმარისია.
en:
  name: Likani Palace (the Romanov summer residence)
  short: >-
    The Romanovs' red-brick summer palace on the Mtkvari just outside Borjomi, lit in 1898 by what is
    called the first hydroelectric plant in the Russian Empire.
  body: >-
    **In 1898 a power station was built at Likani for a single purpose, to light one house, and it is
    remembered as the first hydroelectric plant in the Russian Empire.** The house was this one: the summer
    residence of Grand Duke Nicholas Mikhailovich Romanov, built between 1892 and 1895 on the bank of
    the Mtkvari at the western edge of Borjomi. The design came from Leon Benois, one of the leading architects
    of St Petersburg; the work on site was led by the Tbilisi architect L. Bilfeld.


    It is less a palace than a large, well-planned villa, some 690 square metres, set on a terrace built
    for it. The plan is asymmetrical and no two façades are dressed alike: red brick banded with cream,
    round arches, a square belvedere tower and a pale semicircular portico. Around it the grand duke laid
    out a broad park with an orangery. The Romanov years survive in the early colour photographs of Sergei
    Prokudin-Gorsky, and part of the original furniture is now in the Simon Janashia Museum in Tbilisi.


    After Soviet rule arrived, the house passed to the state and became a retreat for Communist leaders,
    Stalin among them. Today it is the summer residence of the President of Georgia, and since 2016 it
    has also been a museum. The collection, as its keepers tell it, includes a table presented to the
    Romanovs by Napoleon, an armchair from the Shah of Iran, a walnut table made by Peter the Great with
    his own hands, and the family's billiard table.


    Likani, once a separate village, is now part of Borjomi, and the trails of Borjomi-Kharagauli National
    Park begin close by. Walk out along the river in the early evening, when the mist lifts off the Mtkvari
    and the striped brick glows through the tall conifers of the park.
  tip: >-
    Treat Likani as an hour, not a day. It is both a museum and a working presidential residence, so visits
    run as guided tours whose schedule shifts with the season and the official calendar, and the gates
    can close for state use. Check with the tourist information centre in Borjomi before you go. The grounds
    are guarded: follow the staff's lead on where photography is allowed. Cafés and toilets are in central
    Borjomi. The walk out from town is level and pleasant, about 45 minutes along the Mtkvari.
  route: >-
    From Tbilisi take the E60/S1 west past Gori to Khashuri, about 130 km, then turn south onto the S8
    and follow the Mtkvari to Borjomi, about 160 km in all. Stay on the S8 through town towards Akhaltsikhe;
    after about three kilometres you reach Likani, and the palace stands on the river bank behind its
    gatehouse. The total is 164 km and roughly 2 hours 25 minutes. It is asphalt all the way; from December
    to March fit winter tyres, as the gorge holds ice and fog. Park on the verge near the gate. Refuel
    in Khashuri or Borjomi. An economy car is enough all year.
ru:
  name: Ликанский дворец (летняя резиденция Романовых)
  short: >-
    Краснокирпичный летний дворец Романовых на Мтквари у самого Боржоми, освещённый в 1898 году, как считается,
    первой ГЭС Российской империи.
  body: >-
    **В 1898 году в Ликани построили электростанцию с единственной целью — осветить один дом, и её помнят
    как первую гидроэлектростанцию Российской империи.** Домом этим была летняя резиденция великого князя
    Николая Михайловича Романова, построенная в 1892–1895 годах на берегу Мтквари, на западной окраине
    Боржоми. Автором проекта был Леонтий Бенуа, один из ведущих архитекторов Петербурга; работами на месте
    руководил тбилисский архитектор Л. Бильфельд.


    Это не столько дворец, сколько большая, продуманная вилла площадью около 690 квадратных метров на
    специально устроенной для неё террасе. План асимметричен, и ни один фасад не похож на другой: красный
    кирпич с кремовыми поясами, полуциркульные арки, квадратная башня-бельведер и светлый полукруглый
    портик. Вокруг дома великий князь разбил просторный парк с оранжереей. Романовские годы сохранились
    на ранних цветных фотографиях Сергея Прокудина-Горского, а часть подлинной мебели находится сейчас
    в Музее Симона Джанашиа в Тбилиси.


    С приходом советской власти дом перешёл государству и стал местом отдыха коммунистических руководителей,
    в том числе Сталина. Сегодня это летняя резиденция президента Грузии, а с 2016 года ещё и музей. В
    коллекции, как рассказывают её хранители, есть стол, подаренный Романовым Наполеоном, кресло от шаха
    Ирана, ореховый стол, который Пётр Великий сделал собственными руками, и семейный бильярдный стол.


    Ликани, когда-то отдельное село, теперь входит в Боржоми, а тропы Боржоми-Харагаульского национального
    парка начинаются совсем рядом. Выйдите к реке ранним вечером, когда над Мтквари поднимается туман,
    а полосатый кирпич светится сквозь высокие хвойные деревья парка.
  tip: >-
    Отведите на Ликани час, а не день. Это одновременно музей и действующая президентская резиденция,
    поэтому попасть внутрь можно только с экскурсией, расписание которой меняется в зависимости от сезона
    и официального календаря, а ворота могут закрыть для государственных нужд. Прежде чем ехать, уточните
    в туристическом информационном центре Боржоми. Территория охраняется: где можно снимать, подскажут
    сотрудники. Кафе и туалеты — в центре Боржоми. Пешая прогулка из города ровная и приятная, около 45
    минут вдоль Мтквари.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори до Хашури — около 130 км, затем на юг по S8 вдоль Мтквари
    до Боржоми, всего около 160 км. Не сходя с S8, проезжайте через город в сторону Ахалцихе; примерно
    через три километра начинается Ликани, и дворец стоит на берегу реки за своей сторожкой. Итого 164
    км и примерно 2 часа 25 минут. Асфальт на всём пути; с декабря по март ставьте зимнюю резину — в ущелье
    держатся гололёд и туман. Парковка на обочине у ворот. Заправляйтесь в Хашури или Боржоми. Машины
    эконом-класса хватит круглый год.
fa:
  name: کاخ لیکانی (اقامتگاه تابستانی رومانوف‌ها)
  short: >-
    کاخ تابستانی رومانوف‌ها از آجر سرخ، کنار مِتکواری و درست بیرون از بورجومی، که در ۱۸۹۸ با آنچه نخستین
    نیروگاه آبی امپراتوری روسیه خوانده می‌شود روشن شد.
  body: >-
    **در سال ۱۸۹۸ در لیکانی نیروگاهی ساختند تنها برای یک هدف، روشن کردن یک خانه، و آن را نخستین نیروگاه
    برق‌آبی امپراتوری روسیه به یاد می‌آورند.** آن خانه همین است: اقامتگاه تابستانی دوک بزرگ نیکلای میخائیلوویچ
    رومانوف، که میان سال‌های ۱۸۹۲ و ۱۸۹۵ بر کرانهٔ مِتکواری در لبهٔ غربی بورجومی ساخته شد. طرح از لئون
    بنوا بود، یکی از معماران برجستهٔ سن‌پترزبورگ، و کار ساخت در محل را معمار تفلیسی، ل. بیلفلد، هدایت
    می‌کرد.


    این بنا بیش از آنکه کاخ باشد، ویلایی بزرگ و سنجیده است، حدود ۶۹۰ متر مربع، بر سکویی که برایش ساخته‌اند.
    نقشه‌اش نامتقارن است و هیچ دو نمایی یکسان آراسته نشده‌اند: آجر سرخ با نوارهای کرم‌رنگ، طاق‌های نیم‌دایره،
    برج دیدبانی (بلودر) چهارگوش و ایوانی نیم‌دایره و روشن‌رنگ. دوک بزرگ گرداگرد آن باغی پهناور با گلخانه‌ای
    پدید آورد. سال‌های رومانوف‌ها در عکس‌های رنگی اولیهٔ سرگئی پروکودین-گورسکی زنده مانده‌اند، و بخشی
    از مبلمان اصلی اکنون در موزهٔ سیمون جاناشیا در تفلیس است.


    با آمدن حکومت شوروی، خانه به دولت رسید و به استراحتگاه رهبران کمونیست، از جمله استالین، بدل شد. امروز
    اقامتگاه تابستانی رئیس‌جمهور گرجستان است و از ۲۰۱۶ موزه نیز هست. به روایت نگاهبانانش، مجموعه میزی
    را دربر دارد که ناپلئون به رومانوف‌ها هدیه داده بود، صندلی راحتی‌ای از شاه ایران، میزی از چوب گردو
    که پتر کبیر به دست خود ساخته بود، و میز بیلیارد خانواده.


    لیکانی، که روزگاری روستایی جداگانه بود، اکنون بخشی از بورجومی است، و مسیرهای پیاده‌روی پارک ملی بورجومی-خاراگائولی
    از همین نزدیکی آغاز می‌شوند. سرِ شب در امتداد رود قدم بزنید، هنگامی که مه از روی مِتکواری برمی‌خیزد
    و آجرهای راه‌راه از لابه‌لای سوزنی‌برگان بلند باغ می‌درخشند.
  tip: >-
    لیکانی را یک ساعت حساب کنید، نه یک روز. این مکان هم موزه است و هم اقامتگاه فعال ریاست‌جمهوری، پس بازدیدها
    به صورت تورهای راهنمادار برگزار می‌شوند که برنامه‌شان با فصل و تقویم رسمی تغییر می‌کند، و ممکن است
    دروازه‌ها برای کاربرد دولتی بسته شوند. پیش از رفتن با مرکز اطلاعات گردشگری بورجومی هماهنگ کنید. محوطه
    نگهبانی می‌شود: در اینکه کجا عکاسی مجاز است، از کارکنان پیروی کنید. کافه‌ها و سرویس‌های بهداشتی در
    مرکز بورجومی‌اند. پیاده‌روی از شهر هموار و دلپذیر است، حدود ۴۵ دقیقه در کنار مِتکواری.
  route: >-
    از تفلیس بزرگراه E60/S1 را به سمت غرب بگیرید و از گوری بگذرید تا خاشوری، حدود ۱۳۰ کیلومتر؛ سپس به
    جنوب، به S8، بپیچید و در امتداد مِتکواری تا بورجومی بروید، روی‌هم حدود ۱۶۰ کیلومتر. در S8 بمانید و
    از میان شهر به سوی آخالتسیخه بروید؛ پس از حدود سه کیلومتر به لیکانی می‌رسید، و کاخ بر کرانهٔ رود،
    پشت نگهبانی‌اش، ایستاده است. مجموع راه ۱۶۴ کیلومتر و حدود ۲ ساعت و ۲۵ دقیقه است. تمام مسیر آسفالت
    است؛ از دسامبر تا مارس لاستیک زمستانی ببندید، چون در دره یخ‌بندان و مه رایج است. کنار جاده نزدیک دروازه
    پارک کنید. در خاشوری یا بورجومی سوخت بگیرید. خودروی اقتصادی در تمام سال کافی است.
he:
  name: ארמון ליקאני (מעון הקיץ של בית רומנוב)
  short: >-
    ארמון הקיץ של בית רומנוב, מלבנים אדומות על המטקוורי ממש מחוץ לבורג'ומי, שהואר ב-1898 במה שנחשב לתחנת
    הכוח ההידרואלקטרית הראשונה באימפריה הרוסית.
  body: >-
    **ב-1898 נבנתה בליקאני תחנת כוח למטרה אחת בלבד, להאיר בית אחד, והיא נזכרת כתחנת הכוח ההידרואלקטרית
    הראשונה באימפריה הרוסית.** ואותו בית הוא זה: מעון הקיץ של הדוכס הגדול ניקולאי מיכאילוביץ' רומנוב,
    שנבנה בין 1892 ל-1895 על גדת המטקוורי, בקצה המערבי של בורג'ומי. את התכנון עשה לאון בנואה, מבכירי האדריכלים
    של סנקט פטרבורג; את העבודה באתר הוביל האדריכל הטביליסאי ל. בילפלד.


    זהו פחות ארמון ויותר וילה גדולה ומתוכננת היטב, כ-690 מטרים רבועים, הניצבת על טרסה שנבנתה במיוחד בשבילה.
    התוכנית אסימטרית, ואין שתי חזיתות שעוטרו באותו אופן: לבנים אדומות עם פסים בצבע שמנת, קשתות עגולות,
    מגדל תצפית (בלוודר) רבוע ואכסדרה חצי-עגולה בהירה. סביב הבית נטע הדוכס הגדול פארק רחב ובו חממה. שנות
    בית רומנוב השתמרו בתצלומי הצבע המוקדמים של סרגיי פרוקודין-גורסקי, וחלק מן הריהוט המקורי נמצא כיום
    במוזיאון סימון ג'נשיה בטביליסי.


    עם בוא השלטון הסובייטי עבר הבית לידי המדינה והפך למקום נופש למנהיגים קומוניסטים, ובהם סטלין. היום
    הוא מעון הקיץ של נשיא גאורגיה, ומאז 2016 הוא גם מוזיאון. האוסף, כפי שמספרים שומריו, כולל שולחן שנפוליאון
    העניק לבית רומנוב, כורסה שהגיעה מן השאה של איראן, שולחן מעץ אגוז שפטר הגדול בנה במו ידיו, ואת שולחן
    הביליארד של המשפחה.


    ליקאני, שהייתה פעם כפר נפרד, היא היום חלק מבורג'ומי, ושבילי הפארק הלאומי בורג'ומי-חראגאולי מתחילים
    בסמוך. צאו לטייל לאורך הנהר בשעות הערב המוקדמות, כשהערפל עולה מעל המטקוורי והלבנים המפוספסות זוהרות
    מבעד לעצי המחט הגבוהים של הפארק.
  tip: >-
    הקדישו לליקאני שעה, לא יום. זהו גם מוזיאון וגם מעון נשיאותי פעיל, ולכן הביקורים מתקיימים בסיורים מודרכים
    שלוח הזמנים שלהם משתנה לפי העונה ולפי לוח האירועים הרשמי, והשערים עשויים להיסגר לשימוש ממלכתי. בררו
    במרכז המידע לתיירים בבורג'ומי לפני שאתם יוצאים. השטח מאובטח: הישמעו להנחיות הצוות לגבי המקומות שבהם
    מותר לצלם. בתי קפה ושירותים יש במרכז בורג'ומי. ההליכה מן העיר מישורית ונעימה, כ-45 דקות לאורך המטקוורי.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, עברו את גורי והמשיכו עד חשורי, כ-130 ק"מ; שם פנו דרומה לכביש S8 ועקבו
    אחר המטקוורי עד בורג'ומי, כ-160 ק"מ בסך הכול. הישארו על S8 דרך העיר בכיוון אחלציחה; אחרי כשלושה קילומטרים
    תגיעו לליקאני, והארמון עומד על גדת הנהר מאחורי בית השער שלו. בסך הכול 164 ק"מ וכשעתיים ו-25 דקות.
    כל הדרך סלולה; מדצמבר עד מרץ הרכיבו צמיגי חורף, כי בערוץ שוררים לעיתים קרח וערפל. חנו בשוליים ליד
    השער. תדלקו בחשורי או בבורג'ומי. רכב אקונומי מספיק כל השנה.
ar:
  name: قصر ليكاني (المقرّ الصيفي لآل رومانوف)
  short: >-
    القصر الصيفي لآل رومانوف من الآجر الأحمر على نهر متكفاري عند أطراف بورجومي، أُضيء عام 1898 بما يُعدّ
    أول محطة كهرومائية في الإمبراطورية الروسية.
  body: >-
    **في عام 1898 بُنيت في ليكاني محطة كهرباء لغرض واحد، هو إنارة بيت واحد، ويذكرها التاريخ بوصفها أول
    محطة كهرومائية في الإمبراطورية الروسية.** وكان البيت هو هذا: المقرّ الصيفي للدوق الأكبر نيكولاي ميخائيلوفيتش
    رومانوف، الذي شُيّد بين عامي 1892 و1895 على ضفة نهر متكفاري عند الطرف الغربي لبورجومي. وضع التصميم
    ليون بينوا، أحد كبار معماريي سانت بطرسبورغ، وقاد العمل في الموقع المعماري التبليسي ل. بيلفيلد.


    هو أقرب إلى فيلا كبيرة محكمة التخطيط منه إلى قصر، تبلغ مساحتها نحو 690 متراً مربعاً، وتقوم على مصطبة
    أُنشئت من أجلها. المخطط غير متناظر، ولا تتشابه واجهتان في زخرفتهما: آجر أحمر تتخلله أحزمة بلون القشدة،
    وأقواس نصف دائرية، وبرج مربع للإطلالة (بلفيدير)، ورواق أعمدة نصف دائري فاتح اللون. وحول البيت أنشأ
    الدوق الأكبر حديقة واسعة فيها دفيئة للنباتات. وقد حفظت صورُ سيرغي بروكودين-غورسكي الفوتوغرافية الملوّنة
    المبكرة سنواتِ آل رومانوف، ويوجد جزء من الأثاث الأصلي اليوم في متحف سيمون جاناشيا في تبليسي.


    بعد قيام الحكم السوفييتي انتقل البيت إلى الدولة وصار مصيفاً للقادة الشيوعيين، ومنهم ستالين. واليوم
    هو المقرّ الصيفي لرئيس جورجيا، ومنذ عام 2016 صار متحفاً أيضاً. وتضم المجموعة، بحسب ما يرويه القائمون
    عليها، طاولة أهداها نابليون إلى آل رومانوف، وكرسياً وثيراً من شاه إيران، وطاولة من خشب الجوز صنعها
    بطرس الأكبر بيديه، وطاولة البلياردو الخاصة بالعائلة.


    كانت ليكاني يوماً قرية مستقلة، وهي اليوم جزء من بورجومي، وتبدأ دروب منتزه بورجومي-خاراغاولي الوطني
    على مقربة منها. تمشّوا على ضفة النهر في أول المساء، حين يرتفع الضباب عن متكفاري ويتوهّج الآجر المخطّط
    عبر الصنوبريات الشاهقة في الحديقة.
  tip: >-
    اعتبروا ليكاني زيارة ساعة لا يوم. فالمكان متحف ومقرّ رئاسي عامل في آن، ولذلك تجري الزيارات في جولات
    مصحوبة بمرشد يتغير جدولها بحسب الموسم والرزنامة الرسمية، وقد تُغلق البوابات لأغراض رسمية. استفسروا
    في مركز المعلومات السياحية في بورجومي قبل الذهاب. الموقع محروس: اتبعوا إرشادات العاملين في ما يخص
    أماكن التصوير المسموح بها. المقاهي ودورات المياه في وسط بورجومي. المشي من المدينة مستوٍ وممتع، نحو
    45 دقيقة على طول متكفاري.
  route: >-
    من تبليسي خذوا الطريق E60/S1 غرباً متجاوزين غوري حتى خاشوري، نحو 130 كم، ثم انعطفوا جنوباً إلى الطريق
    S8 واتبعوا نهر متكفاري حتى بورجومي، نحو 160 كم إجمالاً. ابقوا على S8 عبر المدينة باتجاه أخالتسيخه؛
    وبعد نحو ثلاثة كيلومترات تصلون إلى ليكاني، حيث يقف القصر على ضفة النهر خلف مبنى الحراسة عند مدخله.
    المجموع 164 كم ونحو ساعتين و25 دقيقة. الطريق معبّد كله؛ ومن ديسمبر إلى مارس ركّبوا إطارات شتوية، فالجليد
    والضباب شائعان في الوادي. اركنوا على جانب الطريق قرب البوابة. تزوّدوا بالوقود في خاشوري أو بورجومي.
    تكفي سيارة اقتصادية طوال العام.
