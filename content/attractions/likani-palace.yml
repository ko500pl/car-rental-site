ka:
  name: ლიკანის სასახლე (რომანოვების საზაფხულო რეზიდენცია)
  short: ბორჯომთან, მტკვრის ნაპირზე აშენებული რომანოვების სასახლე, დღეს პრეზიდენტის სახელმწიფო რეზიდენცია.
  body: >-
    **ლიკანი ის მიზეზია, რის გამოც ბორჯომი კურორტად იქცა.** სასახლე 1892-1895 წლებში აშენდა დიდი მთავრის
    ნიკოლოზ მიხეილის ძე რომანოვისთვის, არქიტექტორ ლეონ ბილფელდის პროექტით, ბორჯომის ხეობის სიღრმეში, მტკვრის
    მარცხენა ნაპირზე.


    შენობა ეკლექტიკურია და საქართველოში ნაკლებად ჩვეულია: ცხენისნალისებრი თაღები, ორნამენტული სარტყლები
    და მავრიტანულ-სპარსული მოტივები ევროპულ გეგმას ერწყმის, ინტერიერში კი მოზაიკური იატაკები და მოჩუქურთმებული
    ხის სამუშაოა. მამულს საკუთარი მცირე ჰიდროელექტროსადგური ჰქონდა — 1890-იანი წლების კავკასიისთვის ეს
    იშვიათობა იყო.


    პარკი სახლთან ერთად გაშენდა და 1890-იან წლებში დარგული ეგზოტიკური წიწვოვნები დღეს ხეობის ფსკერზე ყველაზე
    მაღალი ხეებია — ისინი ღობის მიღმაც ჩანს, მაშინაც, როცა ჭიშკარი დაკეტილია. საბჭოთა ათწლეულებში მამულის
    ნაწილი სანატორიუმად გამოიყენებოდა და სწორედ ამიტომაა მისასვლელი გზა სრულიად სხვადასხვა დანიშნულების
    შენობებით შემოსაზღვრული.


    1921 წლის შემდეგ სასახლე საბჭოთა სახელმწიფო აგარაკად იქცა და სტალინი აქ არაერთხელ ისვენებდა; დღეს
    ის საქართველოს პრეზიდენტის რეზიდენციაა. სწორედ აქ არის მთავარი გასაფრთხილებელი: ეს მოქმედი სახელმწიფო
    ობიექტია და არა მუზეუმი. ზოგჯერ ეწყობა ორგანიზებული ექსკურსიები, ზოგჯერ კი ჭიშკარი კვირაობით დაკეტილია
    — განსაკუთრებით მაშინ, როცა რეზიდენცია ოფიციალურად გამოიყენება. შესვლაზე ვერავინ მოგცემს გარანტიას.


    მაშინაც კი, თუ შიგნით ვერ მოხვდი, ლიკანი მოკლე გაჩერების ღირსია. გზა ბორჯომიდან სასახლემდე ხეობის
    ფსკერზე მიდის, ორივე მხარეს ციცაბო ტყიანი ფერდობებია, გზისპირას კი XIX საუკუნის ბოლოს აშენებული ხის
    აივნებიანი აგარაკები და საბჭოური სანატორიუმების კორპუსები დგას — თითქმის უწყვეტი არქიტექტურული ქრონოლოგია
    ას ორმოც წელზე. აქვეა ბორჯომ-ხარაგაულის ეროვნული პარკის ლიკანის შესასვლელი, საიდანაც ბილიკები იწყება.
  tip: >-
    ეს ერთსაათიანი, არა ნახევარდღიანი გაჩერებაა. შესვლის შესაძლებლობა წინასწარ ბორჯომის ტურისტულ-საინფორმაციო
    ცენტრში იკითხე — მდგომარეობა სეზონისა და ოფიციალური განრიგის მიხედვით იცვლება. ტერიტორიაზე დაცვაა
    და ღობის მიღმა ფოტოს გადაღება ყოველთვის არ იშვება. მანქანა გზისპირას ტოვებ. კაფე და ტუალეტი უახლოესია
    ბორჯომის ცენტრში, სამი კილომეტრში. ბორჯომიდან ლიკანამდე ფეხითაც მისვლა შეიძლება — ორმოცდახუთი წუთის
    მშვიდი სავალია მდინარის გასწვრივ.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ სამხრეთით ბორჯომამდე — 160 კმ. ბორჯომში ახალციხის მიმართულებას
    აჰყევი და სამ კილომეტრში ლიკანის დასახლებაა; სასახლე მარცხნივ, მტკვრის ნაპირზეა, კარიბჭესთან. სულ
    164 კმ და დაახლოებით ორი საათი და ოცდახუთი წუთი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, ვიწრო
    მხოლოდ ხეობის ბოლო მონაკვეთშია. საწვავი ბორჯომში აიღე. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში
    საკმარისია.
en:
  name: Likani Palace (the Romanov summer residence)
  short: The Romanov palace on the bank of the Mtkvari near Borjomi, today a state residence of the president.
  body: >-
    **Likani is the reason Borjomi became a resort at all.** The palace was built between 1892 and 1895
    for Grand Duke Nikolai Mikhailovich Romanov, to a design by the architect Leon Bilfeld, deep in the
    Borjomi gorge on the left bank of the Mtkvari.


    The building is eclectic in a way that is rare in Georgia: horseshoe arches, ornamental banding and
    Moorish and Persian motifs grafted onto a European plan, with mosaic floors and carved woodwork inside.
    The estate had its own small hydroelectric plant, which in the Caucasus of the 1890s was close to
    unheard of.


    The park was laid out at the same time as the house, and the exotic conifers planted in the 1890s
    are now the tallest trees on the valley floor; they show over the wall even when the gate is closed.
    Part of the estate served as a sanatorium through the Soviet decades, which is why the approach road
    is lined with buildings of entirely different intentions.


    After 1921 the palace became a Soviet state dacha and Stalin stayed here repeatedly; today it is a
    residence of the President of Georgia. That is where the warning belongs: this is a working government
    property, not a museum. Organised tours are sometimes arranged and sometimes not, and the gates can
    stay shut for weeks, particularly when the residence is in official use. Nobody can guarantee you
    will get inside.


    Even if you do not, Likani is worth a short stop. The road from Borjomi runs along the floor of the
    gorge with steep forested slopes on both sides, and it is lined with wooden balconied villas of the
    1890s and with the concrete blocks of Soviet sanatoria — very nearly an unbroken architectural chronology
    of a hundred and forty years. The Likani gate of Borjomi-Kharagauli National Park is here too, and
    the trails start from it.
  tip: >-
    Treat this as an hour, not half a day. Ask about access at the tourist information centre in Borjomi
    before driving out, since the situation shifts with the season and the official calendar. The grounds
    are guarded and photography over the fence is not always welcomed. Cars are left on the verge. The
    nearest cafes and toilets are in the centre of Borjomi, three kilometres back. You can also walk from
    Borjomi: it is a level forty-five minutes along the river.
  route: >-
    From Tbilisi take the E60 to Khashuri and then head south to Borjomi, about 160 km. In Borjomi follow
    signs for Akhaltsikhe and after three kilometres you reach Likani; the palace is on the left, on the
    river bank, behind its gatehouse. The total is 164 km and roughly two hours twenty-five. The road
    is asphalt throughout and in good condition, narrowing only in the last part of the gorge. Refuel
    in Borjomi. An economy car is sufficient all year.
ru:
  name: Дворец в Ликани (летняя резиденция Романовых)
  short: Дворец Романовых на берегу Куры под Боржоми, сегодня — государственная резиденция президента.
  body: >-
    **Именно из-за Ликани Боржоми вообще стал курортом.** Дворец построили в 1892-1895 годах для великого
    князя Николая Михайловича Романова по проекту архитектора Леона Бильфельда, в глубине Боржомского
    ущелья, на левом берегу Куры.


    Здание эклектично так, как в Грузии встречается редко: подковообразные арки, орнаментальные пояса,
    мавританские и персидские мотивы, наложенные на европейский план, а внутри мозаичные полы и резное
    дерево. У имения была собственная небольшая гидроэлектростанция — для Кавказа 1890-х годов вещь почти
    неслыханная.


    Парк разбивали одновременно с домом, и экзотические хвойные, посаженные в 1890-х, сегодня самые высокие
    деревья на дне ущелья: их видно поверх ограды, даже когда ворота закрыты. Часть имения в советские
    десятилетия работала санаторием, и потому подъездная дорога застроена зданиями совершенно разных намерений.


    После 1921 года дворец стал советской государственной дачей, и Сталин отдыхал здесь неоднократно;
    сегодня это резиденция президента Грузии. Отсюда и предупреждение: перед вами действующий государственный
    объект, а не музей. Организованные экскурсии то бывают, то нет, а ворота могут стоять закрытыми неделями,
    особенно когда резиденция используется официально. Гарантировать проход внутрь никто не может.


    Но даже если внутрь не попасть, короткая остановка в Ликани оправдана. Дорога от Боржоми идёт по дну
    ущелья, по обе стороны крутые лесистые склоны, а вдоль неё стоят деревянные дачи с балконами 1890-х
    годов и бетонные корпуса советских санаториев — почти непрерывная архитектурная хроника ста сорока
    лет. Здесь же находится ликанский вход в Боржоми-Харагаульский национальный парк, от которого начинаются
    тропы.
  tip: >-
    Считайте это остановкой на час, а не на полдня. О возможности посещения спросите заранее в туристическом
    информационном центре Боржоми: ситуация меняется в зависимости от сезона и официального графика. Территория
    охраняется, съёмка через ограду приветствуется не всегда. Машину оставляют на обочине. Ближайшие кафе
    и туалеты — в центре Боржоми, в трёх километрах. Из Боржоми сюда можно и дойти: сорок пять минут ровной
    дороги вдоль реки.
  route: >-
    Из Тбилиси по E60 до Хашури, затем на юг до Боржоми, около 160 км. В Боржоми держитесь указателей
    на Ахалцихе, и через три километра будет Ликани; дворец слева, на берегу реки, за воротами с караульным
    домом. Всего 164 км и примерно два часа двадцать пять минут. Дорога асфальтированная и в хорошем состоянии,
    сужается только в последней части ущелья. Заправляйтесь в Боржоми. Машины эконом-класса достаточно
    круглый год.
fa:
  name: کاخ لیکانی (اقامتگاه تابستانی رومانوف‌ها)
  short: کاخ رومانوف‌ها بر کرانهٔ رود مِتکواری نزدیک بورجومی، که امروز اقامتگاه دولتی رئیس‌جمهور است.
  body: >-
    **لیکانی همان دلیلی است که بورجومی اصلاً به تفرجگاه بدل شد.** این کاخ میان سال‌های ۱۸۹۲ تا ۱۸۹۵ برای
    دوک بزرگ نیکلای میخایلوویچ رومانوف و به طرح معمار لئون بیلفلد ساخته شد، در ژرفای درهٔ بورجومی و بر
    کرانهٔ چپ مِتکواری.


    ساختمان به شیوه‌ای التقاطی است که در گرجستان کم دیده می‌شود: طاق‌های نعل‌اسبی، نوارهای تزیینی و نقش‌مایه‌های
    مغربی و ایرانی که بر طرحی اروپایی نشسته‌اند، و در داخل کف‌های موزاییک و چوب‌کاری کنده. این ملک نیروگاه
    برق‌آبی کوچک خود را داشت که در قفقاز دههٔ ۱۸۹۰ تقریباً بی‌سابقه بود.


    پارک هم‌زمان با خانه طراحی شد و سوزنی‌برگان غیربومی که در دههٔ ۱۸۹۰ کاشته شدند امروز بلندترین درختان
    کف دره‌اند؛ حتی وقتی دروازه بسته است از فراز دیوار پیدایند. بخشی از ملک در دهه‌های شوروی آسایشگاه
    بود، و از همین رو جادهٔ ورودی از بناهایی با نیت‌های کاملاً متفاوت صف بسته است.


    پس از ۱۹۲۱ کاخ به ویلای دولتی شوروی بدل شد و استالین بارها در آن اقامت کرد؛ امروز اقامتگاه رئیس‌جمهور
    گرجستان است. و هشدار همین‌جاست: این ملکی دولتی و در حال استفاده است، نه موزه. گاه بازدید سازمان‌یافته
    برگزار می‌شود و گاه نه، و دروازه‌ها ممکن است هفته‌ها بسته بماند، به‌ویژه وقتی اقامتگاه کاربرد رسمی
    دارد. هیچ‌کس ورود شما را تضمین نمی‌کند.


    اما حتی اگر داخل نروید، توقفی کوتاه در لیکانی می‌ارزد. جاده از بورجومی در کف دره پیش می‌رود، دو سویش
    دامنه‌های جنگلی تند است، و در کنارش ویلاهای چوبی ایوان‌دار دههٔ ۱۸۹۰ و بلوک‌های بتنی آسایشگاه‌های
    شوروی صف کشیده‌اند: گاه‌شماری معماری تقریباً پیوسته‌ای از صد و چهل سال. دروازهٔ لیکانی پارک ملی بورجومی-خاراگاولی
    هم اینجاست و مسیرهای پیاده‌روی از آن آغاز می‌شود.
  tip: >-
    این را توقفی یک‌ساعته بدانید، نه نیم‌روزه. پیش از حرکت دربارهٔ امکان بازدید از مرکز اطلاعات گردشگری
    بورجومی بپرسید، چون وضعیت با فصل و برنامهٔ رسمی تغییر می‌کند. محوطه نگهبانی دارد و عکاسی از پشت نرده
    همیشه خوشایند نیست. خودرو کنار جاده می‌ماند. نزدیک‌ترین کافه و سرویس بهداشتی در مرکز بورجومی و سه
    کیلومتر عقب‌تر است. از بورجومی پیاده هم می‌توان آمد: چهل‌وپنج دقیقهٔ هموار در کنار رود.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری و سپس جنوب به سوی بورجومی، حدود ۱۶۰ کیلومتر. در بورجومی تابلوهای
    آخالتسیخه را دنبال کنید و پس از سه کیلومتر به لیکانی می‌رسید؛ کاخ سمت چپ و بر کرانهٔ رود، پشت نگهبانی
    است. مجموع ۱۶۴ کیلومتر و حدود دو ساعت و بیست‌وپنج دقیقه. جاده تا انتها آسفالت و در وضعیت خوب است و
    تنها در بخش پایانی دره باریک می‌شود. سوخت را در بورجومی بگیرید. خودروی اقتصادی در تمام سال کافی است.
he:
  name: ארמון ליקאני (משכן הקיץ של בית רומנוב)
  short: ארמון בית רומנוב על גדת נהר המטקוורי ליד בורג'ומי, וכיום משכן ממלכתי של נשיא גאורגיה.
  body: >-
    **ליקאני היא הסיבה שבורג'ומי הפכה בכלל לעיר מרפא.** הארמון נבנה בין 1892 ל-1895 עבור הדוכס הגדול ניקולאי
    מיכאילוביץ' רומנוב, לפי תכנון האדריכל לאון בילפלד, בעומק ערוץ בורג'ומי על הגדה השמאלית של המטקוורי.


    הבניין אקלקטי באופן שנדיר לראות בגאורגיה: קשתות פרסה, רצועות עיטור ומוטיבים מורים ופרסיים שהורכבו
    על תוכנית אירופית, ובפנים רצפות פסיפס ועבודות עץ מגולפות. לאחוזה הייתה תחנת כוח הידרואלקטרית קטנה
    משלה, דבר כמעט בלתי נשמע בקווקז של שנות התשעים למאה ה-19.


    הפארק תוכנן במקביל לבית, והמחטניים האקזוטיים שניטעו בשנות התשעים של המאה ה-19 הם כיום העצים הגבוהים
    ביותר בקרקעית העמק; הם נראים מעל החומה גם כששער סגור. חלק מן האחוזה שימש בית הבראה בעשורים הסובייטיים,
    ולכן דרך הגישה מלווה במבנים בעלי כוונות שונות לחלוטין.


    אחרי 1921 הפך הארמון לדאצ'ה ממלכתית סובייטית וסטלין שהה בו פעמים רבות; כיום הוא משכן נשיא גאורגיה.
    וכאן מקום האזהרה: זהו נכס ממשלתי פעיל ולא מוזיאון. סיורים מאורגנים מתקיימים לפעמים ולפעמים לא, והשערים
    עשויים להישאר סגורים שבועות, בייחוד כשהמשכן נמצא בשימוש רשמי. איש אינו יכול להבטיח שתיכנסו.


    גם אם לא תיכנסו, עצירה קצרה בליקאני משתלמת. הדרך מבורג'ומי עוברת בקרקעית הערוץ, ומשני צדדיה מדרונות
    יער תלולים, ולאורכה עומדות וילות עץ עם מרפסות משנות התשעים למאה ה-19 לצד גושי הבטון של בתי ההבראה
    הסובייטיים: כרונולוגיה אדריכלית כמעט רציפה של מאה וארבעים שנה. כאן גם שער ליקאני של הפארק הלאומי בורג'ומי-חרגאולי,
    ומשם יוצאים המסלולים.
  tip: >-
    התייחסו לזה כאל שעה ולא כאל חצי יום. בררו על אפשרות הכניסה במרכז המידע לתייר בבורג'ומי לפני שאתם נוסעים,
    שכן המצב משתנה לפי העונה ולפי לוח הזמנים הרשמי. השטח מאובטח וצילום מעבר לגדר אינו תמיד רצוי. את הרכב
    משאירים בשוליים. בתי הקפה והשירותים הקרובים ביותר נמצאים במרכז בורג'ומי, שלושה קילומטרים אחורה. אפשר
    גם ללכת ברגל מבורג'ומי: ארבעים וחמש דקות מישוריות לאורך הנהר.
  route: >-
    מטביליסי בכביש E60 עד חשורי ומשם דרומה לבורג'ומי, כ-160 ק״מ. בבורג'ומי לכו לפי השילוט לאחלציחה, ואחרי
    שלושה קילומטרים מגיעים לליקאני; הארמון משמאל, על גדת הנהר, מאחורי בית השומר. בסך הכול 164 ק״מ וכשעתיים
    ועשרים וחמש דקות. הכביש סלול לכל אורכו ובמצב טוב, ומצטמצם רק בחלק האחרון של הערוץ. תדלקו בבורג'ומי.
    רכב חסכוני מספיק בכל ימות השנה.
ar:
  name: قصر ليكاني (مصيف آل رومانوف)
  short: قصر آل رومانوف على ضفة نهر متكفاري قرب بورجومي، وهو اليوم مقر رئاسي للدولة.
  body: >-
    **ليكاني هي السبب في أن تصير بورجومي مصيفاً أصلاً.** بُني القصر بين عامي 1892 و1895 للدوق الأكبر نيكولاي
    ميخايلوفيتش رومانوف بتصميم المعماري ليون بيلفيلد، في عمق وادي بورجومي على الضفة اليسرى لنهر متكفاري.


    والمبنى انتقائي على نحو نادر في جورجيا: عقود حدوة الفرس، وأشرطة زخرفية، وعناصر مغربية وفارسية رُكِّبت
    على مخطط أوروبي، وفي الداخل أرضيات فسيفساء وأخشاب محفورة. وكان للضيعة محطة كهرومائية صغيرة خاصة بها،
    وهو أمر يكاد يكون غير مسموع في قوقاز تسعينيات القرن التاسع عشر.


    خُططت الحديقة مع البيت نفسه، والصنوبريات الغريبة التي غُرست في تسعينيات القرن التاسع عشر هي اليوم
    أعلى أشجار قاع الوادي؛ تُرى من فوق السور حتى والبوابة مغلقة. وقد استُخدم جزء من الضيعة مصحة طوال العقود
    السوفييتية، ولهذا تصطف على طريق الوصول مبانٍ ذات مقاصد مختلفة تماماً.


    وبعد عام 1921 صار القصر داشا حكومية سوفييتية أقام فيها ستالين مراراً؛ وهو اليوم مقر لرئيس جورجيا.
    وهنا موضع التنبيه: هذا ملك حكومي عامل وليس متحفاً. فالجولات المنظمة تُرتب أحياناً ولا تُرتب أحياناً،
    وقد تبقى البوابات مغلقة أسابيع، خصوصاً حين يكون المقر في استعمال رسمي. ولا يستطيع أحد أن يضمن لك الدخول.


    وحتى إن لم تدخل، تستحق ليكاني وقفة قصيرة. تمضي الطريق من بورجومي في قاع الوادي بين منحدرات حرجية شديدة
    على الجانبين، وتصطف عليها فيلات خشبية بشرفات من تسعينيات القرن التاسع عشر إلى جانب كتل خرسانية لمصحات
    سوفييتية: تسلسل معماري شبه متصل لمئة وأربعين سنة. وهنا أيضاً بوابة ليكاني لمنتزه بورجومي-خاراغاولي
    الوطني، ومنها تبدأ المسارات.
  tip: >-
    اعتبرها ساعة لا نصف يوم. اسأل عن إمكان الزيارة في مركز المعلومات السياحية ببورجومي قبل الانطلاق، فالوضع
    يتبدل بحسب الموسم والجدول الرسمي. الموقع محروس، والتصوير من وراء السياج ليس مرحباً به دائماً. وتُترك
    السيارة على كتف الطريق. وأقرب المقاهي ودورات المياه في وسط بورجومي على بعد ثلاثة كيلومترات. ويمكن
    المجيء سيراً من بورجومي: خمس وأربعون دقيقة مستوية بمحاذاة النهر.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري ثم جنوباً إلى بورجومي، نحو 160 كم. وفي بورجومي اتبع لافتات أخالتسيخه،
    وبعد ثلاثة كيلومترات تبلغ ليكاني؛ والقصر على اليسار عند ضفة النهر خلف بيت الحراسة. المجموع 164 كم
    ونحو ساعتين وخمس وعشرين دقيقة. الطريق معبّد على امتداده وبحالة جيدة، ولا يضيق إلا في الجزء الأخير
    من الوادي. تزوّد بالوقود في بورجومي. وسيارة اقتصادية تكفي طوال العام.
