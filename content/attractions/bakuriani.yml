ka:
  name: ბაკურიანი
  short: >-
    საქართველოს უძველესი ზამთრის კურორტი, 1700 მეტრზე, ნაძვნარით შემოსილ ვულკანურ ქვაბულში: ზამთარში რბილი
    ტრასები, ზაფხულში გრილი ჰაერი.
  body: >-
    **1930-იან წლებში საბჭოთა პრესამ ბაკურიანს „საბჭოთა დავოსი“ უწოდა — დიდი სახელი ნაძვნარში მიმოფანტული
    ხის სახლების სოფლისთვის. მას შემდეგ ოთხმოცდაათი წელი გავიდა და ბაკურიანი ამ სახელს ნელ-ნელა ეწევა.**


    კურორტი თრიალეთის ქედის ჩრდილოეთ კალთაზე, ზღვის დონიდან 1700 მეტრზე, ბორჯომიდან 30 კილომეტრში მდებარეობს
    — ქვაბულის ფსკერზე, რომელიც მეზობელი ვულკან მუხერის ლავამ აგო. 1902 წელს აქამდე ვიწროლიანდაგიანი „კუკუშკა“
    ამოვიდა, 1910 წელს კი კოხტის ფერდზე მაღალმთის ბოტანიკური ბაღი დაარსდა. პირველი სათხილამურო ბაზა 1932
    წელს გაიხსნა, 1935 წლის 6 იანვარს — სამთო-სათხილამურო სკოლა, 1954 წელს კი აქ საბჭოთა კავშირში პირველი
    საბუქსირო გზა ამოქმედდა.


    დღეს სათხილამურო ზონა ორად იყოფა. დიდველზე, სადაც ხელოვნური გათოვლიანება მუშაობს, ყველაზე მაღალი საბაგირო,
    არსებული მონაცემებით, 2702 მეტრამდე ადის; კოხტის, იგივე კოხტა-მიტარბის, უმაღლესი სათხილამურო წერტილი
    კი 2269 მეტრია. ტრასები უმეტესად ფართო და შემწყნარებელია, ტყე ქარს აკავებს და ნაცრისფერ დღესაც სრიალი
    სასიამოვნოა. 2023 წელს ბაკურიანმა ფრისტაილისა და სნოუბორდის მსოფლიო ჩემპიონატს უმასპინძლა.


    ბაკურიანს მსოფლიოს მეხსიერებაში უფრო მძიმე ადგილიც აქვს. 1970 წელს ალეკო ქუმარიტაშვილმა აქ პირველი,
    ჯერ კიდევ პრიმიტიული სანის ტრასა ააგო, მისი შვილიშვილი ნოდარი კი ამ დაბაში გაიზარდა. 2010 წლის 12
    თებერვალს, ვანკუვერის ოლიმპიადის გახსნის დღეს, ნოდარი უისლერში, სავარჯიშო დაშვებისას დაიღუპა. ქუჩას,
    სადაც ის ცხოვრობდა, დღეს მისი სახელი ჰქვია.


    იანვრის საშუალო ტემპერატურა აქ −7,3 °C-ია, აგვისტოსი — 15 °C. როცა ბარი სიცხისგან იხუთება, სწორედ
    ეს მეორე ციფრი ავსებს დაბას ისევე, როგორც ზამთარში — თოვლი.
  tip: >-
    საახალწლოდ და თებერვლის შაბათ-კვირებისთვის სასტუმრო რამდენიმე კვირით ადრე დაჯავშნეთ — დაბა ბოლომდე
    ივსება. სეზონის დასაწყისსა და ბოლოს დიდველი, ხელოვნური თოვლის წყალობით, უფრო საიმედოა. აღჭურვილობის
    გასაქირავებლები დიდველისა და კოხტის ქვედა სადგურებთანაა, საჭმელი კი მთავარ ქუჩაზე — ხინკალი, მწვადი,
    რამდენიმე საცხობი. ამ სიმაღლეზე მზე ღრუბელშიც წვავს: სათვალე და მზის კრემი აუცილებელია. ნოემბერი და
    აპრილის მეორე ნახევარი ყველაზე უსახური დროა — თოვლი აღარაა, ბალახი ჯერ არაა, სამშენებლო მოედნები კი
    ყველგანაა. ზაფხულში სოფლის დასავლეთ კიდეზე მდებარე ალპურ ბოტანიკურ ბაღამდე გაისეირნეთ; თუ „კუკუშკა“
    ისევ დადის (მიმოსვლა 2022 წელს შეჩერდა), ბორჯომამდე მატარებლით ჩადით. ზაფხულის საღამოებზე ქურთუკი
    დაგჭირდებათ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კილომეტრია, შემდეგ S8-ით სამხრეთისკენ
    30 კილომეტრი ბორჯომამდე. ბორჯომის ცენტრიდან Sh20 კიდევ 30 კილომეტრს ადის წაღვერის გავლით ბაკურიანამდე
    — სულ 185 კილომეტრი, დაახლოებით 2 საათი და 50 წუთი. გზა ბოლომდე ასფალტიანია და ზამთარშიც იწმინდება,
    მაგრამ ბორჯომს ზემოთ სერპანტინი ღამით იყინება, ამიტომ დეკემბრიდან მარტამდე ზამთრის საბურავები აუცილებელია,
    ჯაჭვიც არ გაწყენთ. საწვავი ხაშურში ან ბორჯომში ჩაასხით. ეკონომკლასის მანქანა საკმარისია; ოთხივე თვლით
    წამყვანი მანქანა მხოლოდ ახალნათოვ დღეს მოგცემთ მეტ სიმშვიდეს.
en:
  name: Bakuriani
  short: >-
    Georgia's oldest winter resort, 1,700 metres up in a spruce-dark volcanic basin above Borjomi: gentle
    pistes in winter, cool air all summer.
  body: >-
    **Soviet newspapers of the 1930s called Bakuriani "the Soviet Davos", a grand title for a village
    of timber houses in a spruce forest, and one it has spent ninety years growing into.**


    The resort lies at 1,700 metres on the northern slope of the Trialeti range, 30 km above Borjomi,
    on the floor of a basin built by lava from the nearby Mukhera volcano. The narrow-gauge Kukushka reached
    it in 1902, and in 1910 an alpine botanical garden was founded on the slope of Kokhta. The first ski
    base opened in 1932; on 6 January 1935 a mountain-ski school followed, and in 1954 the first ski tow
    in the Soviet Union was built here.


    Today the skiing is split between two areas. Didveli, equipped with snowmaking, has a top lift given
    as 2,702 metres; Kokhta, or Kokhta-Mitarbi, reaches 2,269 metres. The runs are mostly wide and forgiving,
    shelter from the trees makes a grey day bearable, and in 2023 the village hosted the FIS Freestyle
    Ski and Snowboard World Championships.


    Bakuriani also has a sadder claim on the world's memory. Aleko Kumaritashvili built a primitive luge
    run here in 1970, and his grandson Nodar grew up in the village. On 12 February 2010, the opening
    day of the Vancouver Olympics, Nodar was killed in a training run at Whistler. The street he lived
    on now carries his name.


    In January the average temperature is −7.3 °C; in August it is 15 °C. When the lowlands swelter, that
    second figure is what fills the village as surely as the snow does.
  tip: >-
    For New Year and February weekends, book weeks ahead: the village fills completely. Didveli's snowmaking
    makes it the safer bet early and late in the season. Hire shops cluster at the Didveli and Kokhta
    base stations, and the food is on the main street: khinkali, grills, a couple of bakeries. At this
    altitude the sun burns through cloud, so bring goggles and sun cream. November and the second half
    of April are the bleak weeks, with no snow, no grass and plenty of building sites. In summer, walk
    to the alpine botanical garden on the western edge of the village; if the Kukushka narrow-gauge train
    is running again (service was suspended in 2022), ride it down to Borjomi. Summer evenings are cold
    enough for a jacket.
  route: >-
    Take the E60/S1 west from Tbilisi to Khashuri, about 130 km, then the S8 south for 30 km to Borjomi.
    From the centre of Borjomi the Sh20 climbs another 30 km through Tsagveri to Bakuriani: 185 km in
    all, roughly 2 hours 50 minutes. It is asphalt throughout and is ploughed in winter, but the switchbacks
    above Borjomi glaze over after dark, so from December to March winter tyres are essential and chains
    are worth carrying. Fill up in Khashuri or Borjomi. An economy car is fine; four-wheel drive only
    adds comfort after a fresh snowfall.
ru:
  name: Бакуриани
  short: >-
    Старейший зимний курорт Грузии на высоте 1700 метров, в тёмной от елей вулканической котловине над
    Боржоми: пологие трассы зимой и прохладный воздух всё лето.
  body: >-
    **Советские газеты 1930-х называли Бакуриани «советским Давосом» — громкий титул для деревни из деревянных
    домов в еловом лесу, и дорастать до него посёлку пришлось девяносто лет.**


    Курорт лежит на высоте 1700 метров на северном склоне Триалетского хребта, в 30 км над Боржоми, на
    дне котловины, сложенной лавой соседнего вулкана Мухера. Узкоколейная «Кукушка» дошла сюда в 1902
    году, а в 1910 году на склоне Кохты основали альпийский ботанический сад. Первая лыжная база открылась
    в 1932 году; 6 января 1935 года за ней последовала горнолыжная школа, а в 1954-м здесь построили первый
    в Советском Союзе буксировочный горнолыжный подъёмник.


    Сегодня катание поделено между двумя зонами. У Дидвели, оборудованной системой искусственного оснежения,
    верхняя точка подъёмников указывается на отметке 2702 метра; Кохта, или Кохта-Митарби, поднимается
    до 2269 метров. Трассы в основном широкие и прощают ошибки, лес укрывает от ветра, так что и в пасмурный
    день кататься вполне сносно, а в 2023 году посёлок принимал чемпионат мира FIS по фристайлу и сноуборду.


    Есть у Бакуриани и более печальное место в памяти мира. В 1970 году Алеко Кумариташвили построил здесь
    примитивную санную трассу, а в посёлке вырос его внук Нодар. 12 февраля 2010 года, в день открытия
    Олимпиады в Ванкувере, Нодар погиб на тренировочном заезде в Уистлере. Улица, на которой он жил, теперь
    носит его имя.


    Средняя температура января — −7,3 °C, августа — 15 °C. Когда внизу, в долинах, изнывают от жары, именно
    вторая цифра заполняет посёлок людьми не хуже, чем снег.
  tip: >-
    На Новый год и февральские выходные бронируйте за несколько недель: посёлок заполняется до отказа.
    Благодаря искусственному оснежению Дидвели надёжнее в начале и в конце сезона. Прокаты сосредоточены
    у нижних станций Дидвели и Кохты, а еда — на главной улице: хинкали, шашлычные, пара пекарен. На такой
    высоте солнце жжёт и сквозь облака, так что берите маску и солнцезащитный крем. Ноябрь и вторая половина
    апреля — унылые недели: ни снега, ни травы, зато полно строек. Летом дойдите пешком до альпийского
    ботанического сада на западной окраине посёлка; если «Кукушка» снова ходит (движение приостановили
    в 2022 году), спуститесь на ней в Боржоми. Летними вечерами без куртки холодно.
  route: >-
    Из Тбилиси по E60/S1 на запад до Хашури — около 130 км, затем 30 км на юг по S8 до Боржоми. От центра
    Боржоми дорога Sh20 поднимается ещё на 30 км через Цагвери к Бакуриани: всего 185 км, примерно 2 часа
    50 минут. Асфальт на всём протяжении, зимой дорогу чистят, но серпантин над Боржоми после наступления
    темноты покрывается льдом, поэтому с декабря по март зимняя резина обязательна, а цепи стоит возить
    с собой. Заправьтесь в Хашури или Боржоми. Машины эконом-класса достаточно; полный привод лишь добавит
    комфорта после свежего снегопада.
fa:
  name: باکوریانی
  short: >-
    کهن‌ترین تفرجگاه زمستانی گرجستان در ۱۷۰۰ متری، در حوضه‌ای آتشفشانی میان جنگل نوئل، بالای بورجومی:
    پیست‌های ملایم در زمستان، هوای خنک در تابستان.
  body: >-
    **روزنامه‌های شوروی در دههٔ ۱۹۳۰ باکوریانی را «داووس شوروی» می‌نامیدند؛ لقبی پرطمطراق برای دهکده‌ای
    از خانه‌های چوبی در جنگل نوئل، که نود سال طول کشید تا قامتش به اندازهٔ آن برسد.**


    این تفرجگاه در ارتفاع ۱۷۰۰ متری، بر دامنهٔ شمالی رشته‌کوه تریالتی و ۳۰ کیلومتر بالاتر از بورجومی،
    در کف حوضه‌ای جای گرفته که گدازه‌های آتشفشان همسایه‌اش، موخرا، آن را ساخته‌اند. قطار باریک‌راه «کوکوشکا»
    در ۱۹۰۲ به اینجا رسید و در ۱۹۱۰ باغ گیاه‌شناسی آلپی بر دامنهٔ کوختا بنیاد نهاده شد. نخستین پایگاه
    اسکی در ۱۹۳۲ گشایش یافت؛ در ۶ ژانویهٔ ۱۹۳۵ مدرسهٔ اسکی کوهستان از پی آن آمد، و در ۱۹۵۴ نخستین تله‌اسکی
    اتحاد جماهیر شوروی در همین‌جا ساخته شد.


    امروز اسکی میان دو منطقه تقسیم شده است. در دیدولی، که به برف‌ساز مجهز است، بالاترین ایستگاه تله‌ها
    ۲۷۰۲ متر ذکر شده است؛ کوختا، یا کوختا-میتاربی، تا ۲۲۶۹ متر بالا می‌رود. پیست‌ها بیشتر پهن و بخشنده‌اند،
    پناه درختان روزهای ابری را هم تحمل‌پذیر می‌کند، و در ۲۰۲۳ این دهکده میزبان مسابقات قهرمانی جهان اسکی
    آزاد و اسنوبورد فدراسیون بین‌المللی اسکی بود.


    باکوریانی جای غم‌انگیزتری هم در حافظهٔ جهان دارد. الکو کوماریتاشویلی در ۱۹۷۰ پیستی ابتدایی برای سورتمهٔ
    لوژ در اینجا ساخت، و نوه‌اش نودار در همین دهکده بزرگ شد. در ۱۲ فوریهٔ ۲۰۱۰، روز افتتاح المپیک ونکوور،
    نودار در یک دور تمرینی در ویسلر جان باخت. خیابانی که در آن زندگی می‌کرد اکنون نام او را بر خود دارد.


    میانگین دمای ژانویه ۷٫۳ درجهٔ سانتی‌گراد زیر صفر است و میانگین اوت ۱۵ درجه. وقتی دشت‌ها زیر گرما نفس‌نفس
    می‌زنند، همین عدد دوم است که دهکده را از مسافر پر می‌کند، همان‌گونه که برف در زمستان.
  tip: >-
    برای تعطیلات سال نو و آخر هفته‌های فوریه چند هفته زودتر رزرو کنید: دهکده کاملاً پر می‌شود. برف‌سازِ
    دیدولی آن را در آغاز و پایان فصل گزینهٔ مطمئن‌تری می‌کند. مغازه‌های کرایهٔ تجهیزات کنار ایستگاه‌های
    پایینی دیدولی و کوختا جمع‌اند و غذا در خیابان اصلی است: خینکالی، کباب‌پزی‌ها و چند نانوایی. در این
    ارتفاع آفتاب از پشت ابر هم می‌سوزاند، پس عینک اسکی و کرم ضدآفتاب بیاورید. نوامبر و نیمهٔ دوم آوریل
    هفته‌های دلگیرند: نه برف هست، نه سبزه، و همه‌جا کارگاه ساختمانی است. در تابستان تا باغ گیاه‌شناسی
    آلپی در لبهٔ غربی دهکده پیاده بروید؛ و اگر قطار باریک‌راه «کوکوشکا» دوباره راه افتاده باشد (حرکتش
    در ۲۰۲۲ متوقف شد)، با آن تا بورجومی پایین بروید. شب‌های تابستان آن‌قدر سرد است که کاپشن لازم شود.
  route: >-
    از تفلیس با E60/S1 به سمت غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس ۳۰ کیلومتر با S8 به جنوب تا بورجومی.
    از مرکز بورجومی جادهٔ Sh20 باز هم ۳۰ کیلومتر از راه تساگوری تا باکوریانی بالا می‌رود: روی هم ۱۸۵ کیلومتر
    و حدود ۲ ساعت و ۵۰ دقیقه. سراسر مسیر آسفالت است و در زمستان برف‌روبی می‌شود، اما پیچ‌های تند بالای
    بورجومی پس از تاریکی یخ می‌بندند؛ پس از دسامبر تا مارس لاستیک زمستانی ضروری است و همراه داشتن زنجیر
    چرخ می‌ارزد. در خاشوری یا بورجومی باک را پر کنید. خودروی اقتصادی کافی است؛ خودروی چهارچرخ‌محرک فقط
    پس از بارش برف تازه راحتی بیشتری می‌آورد.
he:
  name: בקוריאני
  short: >-
    אתר החורף הוותיק ביותר בגאורגיה, בגובה 1,700 מטר, באגן געשי שהאשוחיות מאפילות עליו מעל בורג'ומי: מדרונות
    נוחים בחורף, אוויר צונן כל הקיץ.
  body: >-
    **עיתונים סובייטיים של שנות ה-30 כינו את בקוריאני "הדאבוס הסובייטי" – תואר מפואר לכפר של בתי עץ ביער
    אשוחיות, ותשעים שנה נדרשו לו כדי לגדול לתוך התואר הזה.**


    אתר הנופש שוכן בגובה 1,700 מטר, על המדרון הצפוני של רכס טריאלטי, 30 ק"מ מעל בורג'ומי, בקרקעית אגן
    שנוצר מן הלבה של הר הגעש הסמוך מוחרה. רכבת המסילה הצרה "קוקושקה" הגיעה לכאן ב-1902, וב-1910 נוסד על
    מדרון הר קוחטה גן בוטני אלפיני. בסיס הסקי הראשון נפתח ב-1932; ב-6 בינואר 1935 נפתח אחריו בית ספר לסקי
    הרים, וב-1954 נבנתה כאן מעלית הגרירה לסקי הראשונה בברית המועצות.


    כיום הסקי מתחלק בין שני אזורים. בדידוולי, המצויד במערכת לייצור שלג מלאכותי, המעלית העליונה מגיעה,
    לפי הנתונים, לגובה 2,702 מטר; קוחטה, או קוחטה-מיטרבי, מגיעה ל-2,269 מטר. רוב המסלולים רחבים וסלחניים,
    העצים מספקים מחסה שהופך גם יום אפור לנסבל, וב-2023 אירח הכפר את אליפות העולם של הפדרציה הבין-לאומית
    לסקי בסקי חופשי ובסנובורד.


    לבקוריאני יש גם מקום עצוב יותר בזיכרון העולמי. ב-1970 בנה כאן אלקו קומריטשווילי מסלול לוז' פרימיטיבי,
    ונכדו נודר גדל בכפר. ב-12 בפברואר 2010, יום הפתיחה של אולימפיאדת ונקובר, נהרג נודר במקצה אימון בוויסלר.
    הרחוב שבו גר נושא היום את שמו.


    בינואר הטמפרטורה הממוצעת היא מינוס 7.3 מעלות צלזיוס; באוגוסט – 15 מעלות. כשהעמקים שלמטה לוהטים מחום,
    המספר השני הוא שממלא את הכפר באנשים, ממש כפי שהשלג ממלא אותו בחורף.
  tip: >-
    לסילבסטר ולסופי השבוע של פברואר הזמינו שבועות מראש: הכפר מתמלא עד אפס מקום. ייצור השלג בדידוולי הופך
    אותו להימור הבטוח יותר בתחילת העונה ובסופה. חנויות ההשכרה מרוכזות ליד תחנות הבסיס של דידוולי וקוחטה,
    והאוכל נמצא ברחוב הראשי: חינקלי, מסעדות גריל וכמה מאפיות. בגובה הזה השמש שורפת גם מבעד לעננים, אז
    הביאו משקפי סקי וקרם הגנה. נובמבר והמחצית השנייה של אפריל הם השבועות העגומים: אין שלג, אין דשא, ויש
    הרבה אתרי בנייה. בקיץ לכו ברגל אל הגן הבוטני האלפיני בשוליים המערביים של הכפר; ואם רכבת המסילה הצרה
    "קוקושקה" חזרה לפעול (התנועה בה הופסקה ב-2022), רדו בה לבורג'ומי. בערבי הקיץ קר מספיק כדי ללבוש מעיל.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק"מ, ואז 30 ק"מ דרומה בכביש S8 עד בורג'ומי. ממרכז
    בורג'ומי מטפס כביש Sh20 עוד 30 ק"מ דרך צגוורי אל בקוריאני: 185 ק"מ בסך הכול, כ-2 שעות ו-50 דקות. הכביש
    סלול לכל אורכו ומפונה משלג בחורף, אבל הסרפנטינות שמעל בורג'ומי מתכסות קרח אחרי רדת החשכה, ולכן מדצמבר
    עד מרץ צמיגי חורף הם חובה, וכדאי לקחת גם שרשראות. תדלקו בחשורי או בבורג'ומי. רכב חסכוני מספיק; הנעה
    כפולה רק מוסיפה נוחות אחרי שלג טרי.
ar:
  name: باكورياني
  short: >-
    أقدم منتجع شتوي في جورجيا، على ارتفاع 1700 متر في حوض بركاني تُعتمه غابات التنّوب فوق بورجومي: منحدرات
    هيّنة في الشتاء، وهواء منعش طوال الصيف.
  body: >-
    **وصفت الصحف السوفيتية في ثلاثينيات القرن العشرين باكورياني بأنها «دافوس السوفيت»، وهو لقب فخم لقرية
    من البيوت الخشبية في غابة من التنّوب، أمضت تسعين عامًا وهي تكبر لتليق به.**


    يقع المنتجع على ارتفاع 1700 متر على المنحدر الشمالي لسلسلة جبال تريالتي، على بعد 30 كم فوق بورجومي،
    في قاع حوض شكّلته حمم بركان موخيرا المجاور. وصل إليه قطار «كوكوشكا» ذو السكة الضيقة عام 1902، وفي
    عام 1910 أُسّست حديقة نباتية ألبية على منحدر كوختا. افتُتحت أول قاعدة للتزلج عام 1932، وفي 6 يناير
    1935 تبعتها مدرسة للتزلج الجبلي، وفي 1954 بُني هنا أول مصعد جرّ للتزلج في الاتحاد السوفيتي.


    اليوم ينقسم التزلج بين منطقتين. في ديدفيلي، المجهّزة بنظام لصنع الثلج، يُذكر أن أعلى مصعد يبلغ 2702
    متر؛ أما كوختا، أو كوختا-ميتاربي، فتصل إلى 2269 مترًا. المسارات في معظمها عريضة ومتسامحة مع الأخطاء،
    والأشجار توفّر ملاذًا يجعل اليوم الرمادي محتملًا، وفي 2023 استضافت القرية بطولة العالم للتزلج الحر
    والتزلج على الألواح التابعة للاتحاد الدولي للتزلج.


    ولباكورياني أيضًا مكان أكثر حزنًا في ذاكرة العالم. ففي عام 1970 أنشأ أليكو كوماريتاشفيلي هنا مسارًا
    بدائيًا لزلاجات اللوج، ونشأ حفيده نودار في القرية. وفي 12 فبراير 2010، يوم افتتاح أولمبياد فانكوفر،
    لقي نودار حتفه في جولة تدريبية في ويسلر. والشارع الذي عاش فيه يحمل اليوم اسمه.


    متوسط الحرارة في يناير 7.3 درجات مئوية تحت الصفر، وفي أغسطس 15 درجة. وحين تلهث السهول تحت الحرّ، يكون
    هذا الرقم الثاني هو ما يملأ القرية بالزوار، تمامًا كما يملؤها الثلج شتاءً.
  tip: >-
    في رأس السنة وعطلات نهاية الأسبوع في فبراير احجزوا قبل أسابيع: فالقرية تمتلئ عن آخرها. يجعل صنعُ الثلج
    في ديدفيلي منها الخيار الأضمن في بداية الموسم ونهايته. تتجمّع محلات تأجير المعدات عند محطتي القاعدة
    في ديدفيلي وكوختا، أما الطعام ففي الشارع الرئيسي: خينكالي، ومطاعم مشاوٍ، وبضعة مخابز. على هذا الارتفاع
    تحرق الشمس حتى من خلال الغيوم، فاحملوا نظارات التزلج وواقي الشمس. نوفمبر والنصف الثاني من أبريل هي
    الأسابيع الكئيبة: لا ثلج ولا عشب، وورش بناء في كل مكان. وفي الصيف امشوا إلى الحديقة النباتية الألبية
    عند الطرف الغربي للقرية؛ وإن عاد قطار «كوكوشكا» ذو السكة الضيقة إلى العمل (توقفت رحلاته عام 2022)،
    فانزلوا به إلى بورجومي. أمسيات الصيف باردة بما يكفي لارتداء سترة.
  route: >-
    من تبليسي خذوا الطريق E60/S1 غربًا حتى خاشوري، نحو 130 كم، ثم الطريق S8 جنوبًا 30 كم حتى بورجومي.
    ومن وسط بورجومي يصعد الطريق Sh20 مسافة 30 كم أخرى عبر تساغفيري إلى باكورياني: 185 كم في المجمل، ونحو
    ساعتين و50 دقيقة. الطريق معبّد على طوله وتُزال عنه الثلوج شتاءً، لكن المنعطفات المتعرّجة فوق بورجومي
    تتجمّد بعد حلول الظلام، لذا فالإطارات الشتوية ضرورية من ديسمبر إلى مارس، ويُستحسن حمل السلاسل. تزوّدوا
    بالوقود في خاشوري أو بورجومي. السيارة الاقتصادية كافية؛ والدفع الرباعي لا يضيف سوى الراحة بعد تساقط
    ثلج جديد.
