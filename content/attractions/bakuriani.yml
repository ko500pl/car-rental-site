ka:
  name: ბაკურიანი
  short: >-
    ტრიალეთის ქედის ჩრდილო კალთაზე, 1700 მეტრზე გაშენებული სათხილამურო კურორტი ფიჭვნარში, ბორჯომის ზემოთ.
  body: >-
    **ბაკურიანი ვულკანურ ზეგანზე, 1700 მეტრის სიმაღლეზე დგას** — ტრიალეთის ქედის ჩრდილო კალთაზე, სქელ ფიჭვნარში. ადგილი XIX საუკუნის ბოლოს გახდა ცნობილი, როცა ბორჯომში რომანოვები ისვენებდნენ და მათი გარემოცვა ზაფხულს აქ, გრილ ტყეში ატარებდა. საბჭოთა პერიოდში ბაკურიანი ქვეყნის მთავარ სათხილამურო ბაზად და ნაკრები გუნდის საწვრთნელ ცენტრად იქცა, 2023 წელს კი აქ ფრისტაილისა და სნოუბორდის მსოფლიო ჩემპიონატი ჩატარდა.


    კურორტი ერთი მთა კი არა, რამდენიმე ცალკეული ზონაა:


    - **დიდველი** — მთავარი ზონა გონდოლითა და საბაგიროებით, ზედა წერტილი დაახლოებით 2250 მეტრზე, ყველაზე გრძელი დაშვებებით

    - **კოხტა-მიტარბი** — 2155 მეტრი, უფრო ციცაბო და ღია ფერდობებით, სადაც ქარი უფრო გრძნობადია

    - **ტატრა და 25 თეთრი** — სასწავლო ფერდობები პირდაპირ დასახლებაში, ბავშვებისა და დამწყებთათვის


    სეზონი, როგორც წესი, დეკემბრის ბოლოდან აპრილის დასაწყისამდე გრძელდება. ბაკურიანი გუდაურზე დაბალია, ამიტომ თოვლი აქ უფრო ნოტიოა და მარტის ბოლოს ქვედა ტრასები ხშირად ლბება; სამაგიეროდ ტყე ქარისგან იცავს და ცუდ ამინდში აქ სრიალი უფრო კომფორტულია. ტრასები ძირითადად რბილი და ფართოა — ეს საოჯახო კურორტია, ფრირაიდის მოყვარულები გუდაურს ირჩევენ.


    ზაფხულში ბაკურიანი სულ სხვა ადგილია: 1700 მეტრზე ჰაერი გრილია მაშინაც, როცა ქვემოთ ორმოცი გრადუსია, და საქართველოს დაბლობიდან აქ სწორედ სიგრილისთვის ადიან. ცხენით სეირნობა, კვადროციკლები, ვიწროლიანდაგიანი „კუკუშკა“, ალპური ბოტანიკური ბაღი და ტაბაწყურის ტბისკენ სამანქანო გასვლა — ზაფხულის სტანდარტული ნაკრებია.


    გულწრფელად: ნოემბერი და აპრილის მეორე ნახევარი აქ ყველაზე უსახური დროა — თოვლი აღარაა, ბალახი ჯერ არაა, სამშენებლო მოედნები კი ყველგანაა. დასახლება ბოლო თხუთმეტ წელიწადში ორჯერ გაიზარდა და ძველი ხის აგარაკები ახალ სასტუმროებს შორის იკარგება.
  tip: >-
    ზამთარში სასტუმრო წინასწარ დაჯავშნე — საახალწლო კვირა და თებერვლის შაბათ-კვირა თითქმის სრულად იყიდება. აღჭურვილობის ქირაობა ადგილზეა, დიდველისა და კოხტას ქვედა სადგურებთან. 1700 მეტრზე მზე ძლიერია: სათვალე და კრემი აუცილებელია მაშინაც, როცა ღრუბლიანია. საჭმელი მთავარ ქუჩაზეა — ხინკლისა და მწვადის სახლები, რამდენიმე საცხობი. ტუალეტები საბაგიროების სადგურებშია. ზაფხულში დღის ტემპერატურა 20-22 გრადუსია, საღამოს კი თბილი ტანსაცმელი დაგჭირდება.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კმ, შემდეგ სამხრეთით ბორჯომის გზაზე გადახვევა და ბორჯომის გავლით 30 კმ სერპანტინი ბაკურიანამდე. სულ 185 კმ, დაახლოებით სამ საათამდე. გზა ბოლომდე ასფალტია, ზამთარშიც იწმინდება, მაგრამ სერპანტინი ხშირად მოყინულია — ზამთრის საბურავები სავალდებულოა, ჯაჭვი კი მაინც გამოგადგება. საწვავი ხაშურსა და ბორჯომში აიღე, ბაკურიანში სადგურები ნაკლებია. ზაფხულში ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Bakuriani
  short: >-
    A ski resort at 1,700 metres in pine forest on the northern slope of the Trialeti range, above Borjomi.
  body: >-
    **Bakuriani sits at 1,700 metres on a volcanic plateau,** on the northern flank of the Trialeti range and buried in thick pine forest. It became known in the late 19th century, when the Romanovs summered at Borjomi and their circle came up here for the cool air. Under the Soviet Union it turned into the country's main ski base and the training ground for the national team; in 2023 it hosted the FIS Freestyle Ski and Snowboard World Championships.


    The resort is not one mountain but several separate areas:


    - **Didveli** — the main sector, with a gondola and chairlifts, topping out at roughly 2,250 metres and holding the longest descents

    - **Kokhta-Mitarbi** — 2,155 metres, steeper and more open, where the wind is noticeably stronger

    - **Tatra and 25 Tetri** — nursery slopes inside the village itself, for children and first-timers


    The season normally runs from late December to early April. Bakuriani is lower than Gudauri, so the snow is wetter and the bottom runs often soften by late March; in exchange, the forest shelters the pistes and skiing here in bad weather is far more pleasant. The runs are mostly wide and gentle. This is a family resort, and skiers who want off-piste terrain go to Gudauri instead.


    In summer Bakuriani is a different place altogether. At 1,700 metres the air stays cool when the lowlands are at forty degrees, and Georgians come up precisely for that. Horse riding, quad bikes, the narrow-gauge Kukushka train, the alpine botanical garden and a rough drive out to Lake Tabatskuri make up the standard summer repertoire.


    To be honest about it: November and the second half of April are the bleakest weeks here — the snow has gone, the grass has not arrived, and building sites are everywhere. The village has roughly doubled in the last fifteen years, and the old wooden dachas are steadily disappearing between new hotels.
  tip: >-
    Book accommodation well ahead in winter; New Year week and February weekends sell out almost completely. Equipment hire is easy to find at the Didveli and Kokhta base stations. At 1,700 metres the sun is strong, so goggles and sunscreen matter even under cloud. Food is concentrated on the main street — khinkali and grill houses, a couple of bakeries. Toilets are at the lift stations. Summer days sit around 20-22C, but evenings are cold enough for a jacket.
  route: >-
    Take the E60 west from Tbilisi to Khashuri, about 130 km, then turn south on the Borjomi road and continue through Borjomi and up 30 km of switchbacks to Bakuriani. The total is 185 km and close to three hours. The road is asphalt the whole way and is cleared in winter, but the switchbacks ice over; winter tyres are required in practice and chains are worth carrying. Fill up in Khashuri or Borjomi, as stations are scarce higher up. In summer an economy car is entirely sufficient.
ru:
  name: Бакуриани
  short: >-
    Горнолыжный курорт на высоте 1700 метров в сосновом лесу на северном склоне Триалетского хребта, выше Боржоми.
  body: >-
    **Бакуриани лежит на вулканическом плато на высоте 1700 метров,** на северном склоне Триалетского хребта, в густом сосновом лесу. Известность пришла в конце XIX века, когда Романовы отдыхали в Боржоми, а их окружение поднималось сюда ради прохладного воздуха. В советское время посёлок стал главной горнолыжной базой страны и тренировочным центром сборной; в 2023 году здесь прошёл чемпионат мира по фристайлу и сноуборду.


    Курорт — это не одна гора, а несколько отдельных зон:


    - **Дидвели** — основной сектор с гондолой и креселками, верхняя точка около 2250 метров, самые длинные спуски

    - **Кохта-Митарби** — 2155 метров, круче и более открыто, ветер здесь чувствуется заметно сильнее

    - **Татра и 25 Тетри** — учебные склоны прямо в посёлке, для детей и начинающих


    Сезон обычно держится с конца декабря до начала апреля. Бакуриани ниже Гудаури, поэтому снег здесь более влажный и нижние трассы к концу марта часто раскисают; зато лес прикрывает склоны от ветра, и кататься в непогоду тут гораздо приятнее. Трассы в основном широкие и пологие: это семейный курорт, а любители фрирайда выбирают Гудаури.


    Летом Бакуриани превращается в совсем другое место. На 1700 метрах воздух остаётся прохладным, когда внизу сорок градусов, и грузины поднимаются сюда именно за этим. Прогулки верхом, квадроциклы, узкоколейная «кукушка», альпийский ботанический сад и тряская вылазка к озеру Табацкури — стандартный летний набор.


    Если честно: ноябрь и вторая половина апреля — самое унылое время здесь. Снега уже нет, травы ещё нет, а стройки повсюду. Посёлок за пятнадцать лет вырос примерно вдвое, и старые деревянные дачи постепенно тонут между новыми отелями.
  tip: >-
    Зимой бронируйте жильё заранее: новогодняя неделя и февральские выходные раскупаются почти полностью. Прокат снаряжения работает у нижних станций Дидвели и Кохты. На 1700 метрах солнце сильное, так что маска и крем нужны даже в облачную погоду. Еда сосредоточена на главной улице — хинкальные, шашлычные, пара пекарен. Туалеты есть на станциях подъёмников. Летом днём около 20-22 градусов, но вечером понадобится тёплая куртка.
  route: >-
    Из Тбилиси по трассе E60 на запад до Хашури, около 130 км, затем поворот на юг, на дорогу к Боржоми, и дальше через Боржоми 30 км серпантина до Бакуриани. Всего 185 км, почти три часа. Асфальт на всём протяжении, зимой дорогу чистят, но серпантин обледеневает: зимняя резина обязательна, цепи стоит возить с собой. Заправляйтесь в Хашури или Боржоми, выше заправок мало. Летом машины эконом-класса вполне достаточно.
fa:
  name: باکوریانی
  short: >-
    پیست اسکی در ارتفاع ۱۷۰۰ متری میان جنگل کاج، بر دامنهٔ شمالی رشته‌کوه تریالتی و بالای بورجومی.
  body: >-
    **باکوریانی بر فلاتی آتشفشانی در ارتفاع ۱۷۰۰ متری نشسته است،** بر دامنهٔ شمالی رشته‌کوه تریالتی و در دل جنگل انبوه کاج. شهرت آن به اواخر سدهٔ نوزدهم بازمی‌گردد، وقتی رومانوف‌ها تابستان را در بورجومی می‌گذراندند و نزدیکانشان برای هوای خنک به اینجا بالا می‌آمدند. در دورهٔ شوروی این آبادی به مرکز اصلی اسکی کشور و اردوگاه تمرینی تیم ملی بدل شد و در سال ۲۰۲۳ میزبان مسابقات جهانی فری‌استایل و اسنوبورد بود.


    این پیست یک کوه نیست، چند منطقهٔ جداگانه است:


    - **دیدولی** — بخش اصلی با تله‌کابین و تله‌سیژ، بلندترین نقطه حدود ۲۲۵۰ متر و بلندترین مسیرهای فرود

    - **کوختا-میتاربی** — ۲۱۵۵ متر، تندتر و بازتر، جایی که باد به‌روشنی شدیدتر است

    - **تاترا و ۲۵ تتری** — شیب‌های آموزشی درست در داخل آبادی، برای کودکان و تازه‌کاران


    فصل معمولاً از اواخر دسامبر تا اوایل آوریل ادامه دارد. باکوریانی از گودائوری پایین‌تر است، پس برف مرطوب‌تر است و مسیرهای پایینی اواخر مارس اغلب نرم می‌شوند؛ در عوض جنگل پناه می‌دهد و اسکی در هوای بد اینجا بسیار دلپذیرتر است. مسیرها عمدتاً پهن و ملایم‌اند: این پیستی خانوادگی است و کسانی که دنبال اسکی خارج از پیست‌اند به گودائوری می‌روند.


    در تابستان باکوریانی جای دیگری است. در ۱۷۰۰ متری هوا خنک می‌ماند در حالی که دشت‌ها چهل درجه‌اند، و گرجی‌ها دقیقاً برای همین بالا می‌آیند. اسب‌سواری، موتور چهارچرخ، قطار خط‌باریک کوکوشکا، باغ گیاه‌شناسی آلپی و سفری ناهموار تا دریاچهٔ تاباتسکوری برنامهٔ متعارف تابستان است.


    و صادقانه: نوامبر و نیمهٔ دوم آوریل دلگیرترین هفته‌های اینجاست؛ برف رفته، سبزه هنوز نیامده و کارگاه ساختمانی همه‌جا هست. آبادی در پانزده سال گذشته تقریباً دو برابر شده و ویلاهای چوبی قدیمی میان هتل‌های تازه گم می‌شوند.
  tip: >-
    در زمستان اقامتگاه را از پیش رزرو کنید؛ هفتهٔ سال نو و آخر هفته‌های فوریه تقریباً کامل پر می‌شود. کرایهٔ تجهیزات کنار ایستگاه‌های پایین دیدولی و کوختا در دسترس است. در ۱۷۰۰ متری آفتاب تند است، پس عینک و کرم ضدآفتاب حتی زیر ابر لازم است. غذا در خیابان اصلی متمرکز شده: خینکالی‌فروشی، کبابی و چند نانوایی. سرویس بهداشتی در ایستگاه‌های تله‌سیژ هست. روزهای تابستان حدود ۲۰ تا ۲۲ درجه است اما شب‌ها کاپشن می‌خواهد.
  route: >-
    از تفلیس بزرگراه E60 را به غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس به جنوب و جادهٔ بورجومی بپیچید و از بورجومی ۳۰ کیلومتر پیچ‌وخم کوهستانی را تا باکوریانی بالا بروید. مجموع ۱۸۵ کیلومتر و نزدیک سه ساعت. جاده تا انتها آسفالت است و زمستان برف‌روبی می‌شود، اما پیچ‌ها یخ می‌بندند: لاستیک زمستانی عملاً الزامی است و زنجیر چرخ ارزش همراه بردن دارد. سوخت را در خاشوری یا بورجومی بگیرید. در تابستان خودروی اقتصادی کاملاً کافی است.
he:
  name: בקוריאני
  short: >-
    אתר סקי בגובה 1,700 מטר ביער אורנים, במדרון הצפוני של רכס טריאלטי, מעל בורג'ומי.
  body: >-
    **בקוריאני יושבת על רמה געשית בגובה 1,700 מטר,** במדרון הצפוני של רכס טריאלטי ובתוך יער אורנים סבוך. שמה יצא בסוף המאה ה-19, כשבני רומנוב נפשו בבורג'ומי ומקורביהם עלו לכאן בשביל האוויר הקריר. בתקופה הסובייטית הפכה לבסיס הסקי המרכזי של המדינה ולמחנה האימונים של הנבחרת, וב-2023 אירחה את אליפות העולם בפריסטייל ובסנובורד.


    האתר אינו הר אחד אלא כמה מתחמים נפרדים:


    - **דידוולי** — המתחם המרכזי, עם רכבל גונדולה ורכבלי כיסא, נקודה עליונה בגובה 2,250 מטר בקירוב והמסלולים הארוכים ביותר

    - **קוחטה-מיטרבי** — 2,155 מטר, תלול ופתוח יותר, והרוח מורגשת בו הרבה יותר

    - **טטרה ו-25 טטרי** — מדרונות לימוד בתוך הכפר עצמו, לילדים ולמתחילים


    העונה נמשכת בדרך כלל מסוף דצמבר עד תחילת אפריל. בקוריאני נמוכה מגודאורי, ולכן השלג לח יותר והמסלולים התחתונים נמסים לא פעם בסוף מרץ; בתמורה היער מגן מן הרוח, והגלישה כאן במזג אוויר גרוע נעימה בהרבה. המסלולים רחבים ומתונים ברובם: זהו אתר משפחתי, ומי שמחפש גלישה מחוץ למסלול נוסע לגודאורי.


    בקיץ זהו מקום אחר לגמרי. בגובה 1,700 מטר האוויר נשאר קריר גם כשבשפלה ארבעים מעלות, והגאורגים עולים לכאן בדיוק בשביל זה. רכיבה על סוסים, טרקטורונים, רכבת המסילה הצרה קוקושקה, הגן הבוטני האלפיני ונסיעה מחוספסת אל אגם טבצקורי הם התוכנית הקיצית הרגילה.


    ובכנות: נובמבר והמחצית השנייה של אפריל הם השבועות העגומים כאן. השלג נעלם, הדשא עוד לא הגיע, ואתרי בנייה בכל פינה. הכפר הכפיל את עצמו בערך בחמש עשרה השנים האחרונות, ובתי העץ הישנים נבלעים בין מלונות חדשים.
  tip: >-
    בחורף הזמינו לינה מראש; שבוע השנה החדשה וסופי השבוע של פברואר נמכרים כמעט לגמרי. השכרת ציוד זמינה בתחנות התחתונות של דידוולי וקוחטה. בגובה 1,700 מטר השמש חזקה, ולכן משקפי מגן וקרם הגנה נחוצים גם בעננות. האוכל מרוכז ברחוב הראשי — מסעדות חינקלי ומנגל וכמה מאפיות. שירותים יש בתחנות הרכבלים. בקיץ הטמפרטורה ביום סביב 20-22 מעלות, אך בערב תזדקקו למעיל.
  route: >-
    צאו מטביליסי מערבה בכביש E60 עד חשורי, כ-130 ק״מ, ואז פנו דרומה לדרך בורג'ומי והמשיכו דרך בורג'ומי ו-30 ק״מ של סרפנטינות עד בקוריאני. בסך הכול 185 ק״מ, קרוב לשלוש שעות. הכביש סלול לכל אורכו ומפונה משלג בחורף, אך הסרפנטינות מתכסות קרח: צמיגי חורף הכרחיים למעשה, ושרשראות שוות סחיבה. תדלקו בחשורי או בבורג'ומי, למעלה יש מעט תחנות. בקיץ רכב חסכוני מספיק לחלוטין.
ar:
  name: باكورياني
  short: >-
    منتجع تزلج على ارتفاع 1700 متر بين غابات الصنوبر، على السفح الشمالي لسلسلة تريالتي فوق بورجومي.
  body: >-
    **تقوم باكورياني على هضبة بركانية عند ارتفاع 1700 متر،** على السفح الشمالي لسلسلة تريالتي وفي قلب غابة صنوبر كثيفة. ذاع اسمها في أواخر القرن التاسع عشر حين كان آل رومانوف يصطافون في بورجومي وكان حاشيتهم يصعدون إلى هنا طلباً للهواء البارد. وفي العهد السوفييتي صارت قاعدة التزلج الرئيسية في البلاد ومعسكر تدريب المنتخب، واستضافت عام 2023 بطولة العالم للتزلج الحر والتزلج على اللوح.


    والمنتجع ليس جبلاً واحداً بل عدة مناطق منفصلة:


    - **ديدفيلي** — القطاع الرئيسي، بتلفريك مغلق ومصاعد كرسية، وأعلى نقطة نحو 2250 متراً، وفيه أطول المنحدرات

    - **كوختا-ميتاربي** — 2155 متراً، أشد انحداراً وأكثر انكشافاً، والريح فيه أقوى بوضوح

    - **تاترا و25 تتري** — منحدرات تعليمية داخل القرية نفسها، للأطفال والمبتدئين


    يمتد الموسم عادة من أواخر ديسمبر إلى أوائل أبريل. وباكورياني أخفض من غودااوري، فالثلج فيها أكثر رطوبة والمسارات السفلى كثيراً ما تلين في أواخر مارس؛ في المقابل تحمي الغابة المنحدرات من الريح، والتزلج هنا في الطقس السيئ أكثر راحة بكثير. المسارات في معظمها عريضة وهادئة الميل: هذا منتجع عائلي، ومن يريد التزلج خارج المسارات يقصد غودااوري.


    وفي الصيف تصير باكورياني مكاناً آخر تماماً. على ارتفاع 1700 متر يبقى الهواء بارداً بينما تبلغ السهول أربعين درجة، والجورجيون يصعدون لهذا السبب بالذات. ركوب الخيل، والدراجات الرباعية، وقطار كوكوشكا ضيق السكة، والحديقة النباتية الجبلية، ورحلة وعرة إلى بحيرة تاباتسكوري: هذا هو البرنامج الصيفي المعتاد.


    وبصراحة: نوفمبر والنصف الثاني من أبريل أكثر الأسابيع كآبة هنا؛ الثلج انصرف والعشب لم يأتِ بعد وورش البناء في كل مكان. تضاعفت القرية تقريباً خلال خمسة عشر عاماً، والفيلات الخشبية القديمة تختفي بين الفنادق الجديدة.
  tip: >-
    احجز الإقامة مبكراً في الشتاء؛ فأسبوع رأس السنة وعطلات فبراير تُباع بالكامل تقريباً. تأجير المعدات متاح عند المحطتين السفليتين لديدفيلي وكوختا. على ارتفاع 1700 متر تكون الشمس قوية، فالنظارة والواقي الشمسي ضروريان حتى تحت الغيوم. الطعام متركز في الشارع الرئيسي: مطاعم خينكالي ومشاوٍ ومخبزان. دورات المياه عند محطات المصاعد. حرارة النهار صيفاً نحو 20-22 درجة، لكن المساء يحتاج معطفاً.
  route: >-
    اتجه غرباً من تبليسي على الطريق E60 إلى خاشوري، نحو 130 كم، ثم انعطف جنوباً إلى طريق بورجومي وواصل عبر بورجومي ثلاثين كيلومتراً من المنعطفات الجبلية حتى باكورياني. المجموع 185 كم ونحو ثلاث ساعات. الطريق معبّد على امتداده ويُكسح من الثلج شتاءً، لكن المنعطفات تتجمد: إطارات الشتاء ضرورية عملياً والسلاسل تستحق الحمل. تزوّد بالوقود في خاشوري أو بورجومي فالمحطات قليلة في الأعلى. وفي الصيف تكفي سيارة اقتصادية تماماً.
