ka:
  name: გერგეტის სამების ეკლესია
  short: XIV საუკუნის ეკლესია 2170 მეტრზე, ყაზბეგის მყინვარის ფონზე — საქართველოს ყველაზე ცნობადი ხედი.
  body: >-
    **გერგეტის სამება ის კადრია, რომლითაც საქართველო მსოფლიოში ცნობილია.** ეკლესია სტეფანწმინდის ზემოთ,
    ცალკე მდგარ მწვერვალზე დგას 2170 მეტრზე, უკან კი 5054-მეტრიანი მყინვარწვერი აღიმართება. როცა ღრუბლები
    იშლება და მყინვარი ჩნდება, ხედი ნამდვილად ისეთია, როგორიც ფოტოებზეა.


    ეკლესია XIV საუკუნეშია აშენებული და მას სამრეკლოც ახლავს — ორივე მთის ქვისგან, ყოველგვარი დეკორის
    გარეშე. მისი ადგილმდებარეობა შემთხვევითი არ არის: საფრთხის დროს მცხეთიდან და თბილისიდან სიწმინდეებს
    სწორედ აქ მალავდნენ, რადგან მთაზე ასვლა შემტევისთვის პრაქტიკულად შეუძლებელი იყო.


    გერგეტი ორი გზით მიიღწევა:


    - **ფეხით** სტეფანწმინდიდან, გერგეტის სოფელზე გავლით — 1.5–2 საათი აღმართში, დაახლოებით 500 მეტრი
    სიმაღლის სხვაობით

    - **მანქანით** ბეტონის ვიწრო გზით, რომელიც ბოლო წლებში მოაწესრიგეს — ციცაბო, ერთზოლიანი, ბევრი მკვეთრი
    მოსახვევით


    ეკლესიის უკან ბილიკები აგრძელებს გერგეტის მყინვარისკენ და საბერტყე ხეობისკენ — ეს უკვე სრულფასოვანი
    მთის ლაშქრობებია, ცალკე დღეს და ნორმალურ ფეხსაცმელს მოითხოვს. ტაძარი მოქმედია, აქ ბერები ცხოვრობენ
    და მსახურება რეგულარულად მიმდინარეობს, ამიტომ ეს მხოლოდ სახედავი წერტილი არ არის.


    თავად სტეფანწმინდა ცალკე ღირს ერთი საათი: მთის მუზეუმი, ბაზრობა, თერგის ხიდები და ხედი მთაზე ქალაქის
    ცენტრიდანაც. ზაფხულში აქ ევროპელი და ისრაელი მოგზაურების ნაკადია, ზამთარში კი დაბა თითქმის ცარიელია
    — და მაშინ, სუფთა ცივ ჰაერში, მყინვარწვერი ყველაზე ხშირად ჩანს ღრუბლების გარეშე.
  tip: >-
    მყინვარწვერი ხშირად ღრუბელშია — ყველაზე დიდი შანსი დილის 7–10 საათია, შემდეგ ღრუბლიანობა იზრდება.
    ჩაცმის კოდი მოქმედებს: თავსაფარი და გრძელი კალთა ქალებს, გრძელი შარვალი მამაკაცებს; ნიფხავები კართან
    დევს. ზემოთ ქარი მუდმივია და ტემპერატურა სტეფანწმინდაზე 5–7 გრადუსით დაბალი — ქურთუკი აუცილებელია
    ივლისშიც. ტუალეტი მინიმალურია, კაფე არ არის; წყალი და საჭმელი ქვემოთ იყიდე. ბანკომატი სტეფანწმინდის
    ცენტრშია.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით ჩრდილოეთისკენ: ჟინვალი, ანანური, ფასანაური, გუდაური, ჯვრის უღელტეხილი
    (2379 მ), შემდეგ დაღმართი კობისკენ და სტეფანწმინდამდე — 155 კმ, სამი საათი. სტეფანწმინდიდან ეკლესიამდე
    კიდევ 6 კმ ციცაბო, ვიწრო ბეტონის გზაა; ის ფორმალურად გავლადია სედანითაც, მაგრამ რეალურად მაღალი კლირენსის
    კროსოვერი ან ჯიპი გჭირდება — შეხვედრისას გვერდზე გადგომა უწევს მიწაზე. ზამთარში აქ 4x4 და ჯაჭვები
    სავალდებულოა. საწვავი აიღე პასანაურში ან სტეფანწმინდაში.
en:
  name: Gergeti Trinity Church
  short: A 14th-century church at 2,170 m with Mount Kazbek behind it — the single most recognisable view
    in Georgia.
  body: >-
    **Gergeti Trinity is the image Georgia is known by.** The church stands on an isolated summit above
    Stepantsminda at 2,170 metres, with the 5,054-metre cone of Mount Kazbek rising behind it. When the
    cloud clears and the glacier appears, the view really does look the way it does in photographs, which
    is not always true of famous places.


    The church was built in the 14th century and has a separate bell tower, both in undecorated mountain
    stone. Its position was strategic rather than scenic: in times of invasion, relics from Mtskheta and
    Tbilisi were carried up here, because an attacking force could not realistically reach the summit.


    There are two ways up:


    - **On foot** from Stepantsminda through Gergeti village — one and a half to two hours of steady climbing,
    roughly 500 metres of ascent

    - **By car** on the narrow concrete road, resurfaced in recent years — steep, effectively single lane,
    with tight hairpins and few passing places


    Behind the church, trails continue towards the Gergeti glacier and the Sabertse ridge. Those are full
    mountain hikes and need a separate day, plus proper footwear. The church is active, monks live here,
    and services are held regularly, so it is not simply a viewpoint.
  tip: >-
    Kazbek is often hidden in cloud; your best chance is between seven and ten in the morning, after which
    cloud usually builds. Dress rules apply — headscarf and long skirt for women, long trousers for men,
    with wraps by the door. The wind at the top is constant and the temperature is five to seven degrees
    lower than in the village, so a jacket is necessary even in July. Facilities are minimal and there
    is no café, so buy water and food below. The nearest ATM is in central Stepantsminda.
  route: >-
    Head north from Tbilisi on the Georgian Military Highway through Zhinvali, Ananuri, Pasanauri and
    Gudauri, over the Jvari Pass at 2,379 metres, then down through Kobi to Stepantsminda — 155 km and
    about three hours. From the village it is a further 6 km up a steep, narrow concrete road. A sedan
    can technically manage it in dry conditions, but a crossover or 4x4 is what you actually want, since
    passing an oncoming car means putting two wheels on dirt. In winter chains and four-wheel drive are
    essential. Fuel in Pasanauri or Stepantsminda.
ru:
  name: Церковь Святой Троицы в Гергети
  short: Храм XIV века на высоте 2170 м на фоне Казбека — самый узнаваемый вид Грузии.
  body: >-
    **Гергетская Троица — тот самый образ, по которому узнают Грузию.** Церковь стоит на отдельной вершине
    над Степанцминдой на высоте 2170 метров, а за ней поднимается пятитысячник Казбек (5054 м). Когда
    облака расходятся и ледник открывается, вид действительно выглядит так, как на фотографиях, — что
    случается с известными местами не всегда.


    Храм построен в XIV веке, рядом стоит отдельная колокольня; обе постройки сложены из горного камня
    без всякого декора. Место выбрано не ради вида, а ради безопасности: во время нашествий сюда поднимали
    святыни из Мцхеты и Тбилиси, потому что взять вершину штурмом было практически невозможно.


    Наверх ведут два пути:


    - **Пешком** из Степанцминды через село Гергети — полтора-два часа ровного подъёма, около 500 метров
    набора высоты

    - **На машине** по узкой бетонной дороге, обновлённой в последние годы, — круто, фактически одна полоса,
    серпантин с редкими карманами для разъезда


    За церковью тропы уходят к Гергетскому леднику и хребту Саберце. Это уже полноценные горные маршруты,
    на них нужен отдельный день и нормальная обувь. Храм действующий, здесь живут монахи и регулярно идут
    службы.
  tip: >-
    Казбек часто закрыт облаками; лучший шанс — с семи до десяти утра, дальше облачность обычно нарастает.
    Правила одежды соблюдают: платок и длинная юбка женщинам, длинные брюки мужчинам, накидки лежат у
    входа. Наверху постоянный ветер, температура на пять-семь градусов ниже, чем в посёлке, куртка нужна
    даже в июле. Инфраструктуры почти нет, кафе тоже, воду и еду покупайте внизу. Ближайший банкомат —
    в центре Степанцминды.
  route: >-
    Из Тбилиси на север по Военно-Грузинской дороге через Жинвали, Ананури, Пасанаури и Гудаури, далее
    Крестовый перевал (2379 м) и спуск через Коби в Степанцминду — 155 км, около трёх часов. От посёлка
    ещё 6 км вверх по крутой узкой бетонке. Седан в сухую погоду формально проедет, но реально нужен кроссовер
    или внедорожник: при встречном разъезде приходится съезжать колёсами на грунт. Зимой обязательны полный
    привод и цепи. Заправляйтесь в Пасанаури или Степанцминде.
fa:
  name: کلیسای تثلیث گرگتی
  short: کلیسایی از سدهٔ چهاردهم در ارتفاع 2,170 متر با کوه کازبک در پس‌زمینه — شناخته‌شده‌ترین منظرهٔ
    گرجستان.
  body: >-
    **تثلیث گرگتی همان تصویری است که گرجستان با آن شناخته می‌شود.** کلیسا روی قله‌ای منفرد بالای کازبگی
    در ارتفاع 2,170 متر ایستاده و مخروط 5,054 متری کوه کازبک پشت آن سر برمی‌آورد. وقتی ابر کنار می‌رود
    و یخچال پیدا می‌شود، منظره واقعاً همان‌طور است که در عکس‌ها می‌بینید، و این دربارهٔ جاهای مشهور همیشه
    صادق نیست.


    کلیسا در سدهٔ چهاردهم ساخته شد و برج ناقوس جداگانه‌ای دارد، هر دو از سنگ کوهی بی‌تزیین. جای آن راهبردی
    بود نه منظره‌ای: در روزگار هجوم، اشیای مقدس را از متسختا و تفلیس به همین بالا می‌آوردند، چون نیروی
    مهاجم عملاً نمی‌توانست به قله برسد. دو راه برای بالا رفتن هست: پیاده از کازبگی و از میان روستای گرگتی،
    یک ساعت و نیم تا دو ساعت بالا رفتن یکنواخت با حدود 500 متر اختلاف ارتفاع؛ یا با خودرو روی جادهٔ بتنی
    باریکی که در سال‌های اخیر روکش تازه گرفته — تند، عملاً یک‌خطه، با پیچ‌های تنگ و جاهای اندک برای تلاقی.


    پشت کلیسا کوره‌راه‌ها به سوی یخچال گرگتی و ستیغ سابرتسه ادامه می‌یابند. آن‌ها پیاده‌روی کوهستانی تمام‌عیارند
    و یک روز جداگانه و کفش مناسب می‌خواهند. کلیسا فعال است، راهبان اینجا زندگی می‌کنند و مراسم به‌طور
    منظم برگزار می‌شود، پس این فقط یک نقطهٔ دید نیست.
  tip: >-
    کازبک اغلب در ابر پنهان است؛ بهترین شانس شما بین ساعت هفت تا ده صبح است، چون بعد از آن معمولاً ابر
    جمع می‌شود. قواعد پوشش برقرار است — روسری و دامن بلند برای زنان، شلوار بلند برای مردان، با پوشش‌هایی
    کنار در. باد در بالا همیشگی است و دما پنج تا هفت درجه پایین‌تر از روستاست، پس ژاکت حتی در ژوئیه لازم
    است. امکانات حداقلی است و کافه‌ای وجود ندارد، پس آب و خوراک را پایین بخرید. نزدیک‌ترین خودپرداز در
    مرکز کازبگی است.
  route: >-
    از تفلیس به سمت شمال با بزرگراه نظامی گرجستان از ژینوالی، آنانوری، پاساناوری و گودائوری بروید، از
    گردنهٔ جواری در 2,379 متر بگذرید و بعد از راه کوبی به کازبگی پایین بیایید — 155 کیلومتر و حدود سه
    ساعت. از روستا 6 کیلومتر دیگر روی جادهٔ بتنی تند و باریک بالا می‌روید. سواری در هوای خشک از پس آن
    برمی‌آید، اما چیزی که واقعاً می‌خواهید کراس‌اوور یا 4x4 است، چون رد شدن از کنار خودروی روبه‌رو یعنی
    دو چرخ روی خاک. در زمستان زنجیر و چهارچرخ‌محرک ضروری است. سوخت در پاساناوری یا کازبگی.
he:
  name: כנסיית השילוש בגרגטי
  short: כנסייה מן המאה ה-14 בגובה 2,170 מטר והר קזבק מאחוריה — הנוף המזוהה ביותר בגאורגיה.
  body: >-
    **השילוש בגרגטי הוא התמונה שגאורגיה מוכרת בזכותה.** הכנסייה עומדת על פסגה מבודדת מעל קזבגי בגובה 2,170
    מטר, ומאחוריה מתנשא חרוט הר קזבק בגובה 5,054 מטר. כשהעננים מתפזרים והקרחון מתגלה, הנוף באמת נראה כמו
    בתצלומים, וזה לא תמיד המצב במקומות מפורסמים.


    הכנסייה נבנתה במאה ה-14 ויש לה מגדל פעמונים נפרד, שניהם מאבן הרים ללא עיטור. מיקומה היה אסטרטגי ולא
    נופי: בעתות פלישה העלו לכאן חפצי קודש ממצחתה ומטביליסי, מפני שכוח תוקף לא באמת יכול היה להגיע אל הפסגה.
    יש שתי דרכים לעלות: ברגל מקזבגי דרך הכפר גרגטי — שעה וחצי עד שעתיים של טיפוס אחיד, כ-500 מטרים של
    עלייה; או ברכב על כביש הבטון הצר, שרוצף מחדש בשנים האחרונות — תלול, למעשה חד-נתיבי, עם סרפנטינות חדות
    ומעט מקומות לחציית רכבים.


    מאחורי הכנסייה ממשיכים שבילים לכיוון קרחון גרגטי ורכס סאברצה. אלה מסלולי הרים מלאים והם דורשים יום
    נפרד ונעליים מתאימות. הכנסייה פעילה, נזירים חיים כאן ותפילות נערכות בקביעות, ולכן זו אינה סתם נקודת
    תצפית.
  tip: >-
    קזבק מוסתר לעיתים קרובות בעננים; הסיכוי הטוב ביותר שלכם הוא בין שבע לעשר בבוקר, ואחרי כן העננות בדרך
    כלל מתגברת. יש כללי לבוש — מטפחת ראש וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים, עם כיסויים ליד הדלת.
    הרוח למעלה נושבת ללא הרף והטמפרטורה נמוכה בחמש עד שבע מעלות מזו שבכפר, ולכן מעיל הכרחי גם ביולי. המתקנים
    מינימליים ואין בית קפה, אז קנו מים ואוכל למטה. הכספומט הקרוב ביותר נמצא במרכז קזבגי.
  route: >-
    צאו מטביליסי צפונה בכביש הצבא הגאורגי דרך ז'ינוואלי, אנאנורי, פסאנאורי וגודאורי, מעל מעבר ג'וארי בגובה
    2,379 מטר, ואז במורד דרך קובי אל קזבגי — 155 ק״מ וכשלוש שעות. מהכפר יש עוד 6 ק״מ במעלה כביש בטון תלול
    וצר. רכב נמוך יכול טכנית להתמודד בתנאים יבשים, אבל מה שאתם באמת רוצים הוא קרוסאובר או 4x4, כי חציית
    רכב ממול פירושה שני גלגלים על עפר. בחורף שרשראות והנעה כפולה הן הכרח. תדלוק בפסאנאורי או בקזבגי.
ar:
  name: كنيسة الثالوث في غيرغيتي
  short: كنيسة من القرن الرابع عشر على ارتفاع 2,170 متراً وخلفها جبل كازبك — أشهر منظر في جورجيا على الإطلاق.
  body: >-
    **ثالوث غيرغيتي هو الصورة التي تُعرف بها جورجيا.** تقف الكنيسة على قمة منعزلة فوق كازبيغي على ارتفاع
    2,170 متراً، وخلفها يرتفع مخروط جبل كازبك البالغ 5,054 متراً. وحين تنقشع الغيوم ويظهر النهر الجليدي
    يبدو المنظر فعلاً كما يبدو في الصور، وهذا ليس دائماً حال الأماكن الشهيرة.


    بُنيت الكنيسة في القرن الرابع عشر ولها برج أجراس منفصل، وكلاهما من حجر جبلي بلا زخرفة. وكان موقعها
    استراتيجياً لا مشهدياً: ففي أزمنة الغزو كانت الذخائر تُحمل إلى هنا من متسخيتا وتبليسي، لأن قوة مهاجمة
    لم تكن تستطيع فعلاً بلوغ القمة. وللصعود طريقان: سيراً من كازبيغي عبر قرية غيرغيتي — ساعة ونصف إلى
    ساعتين من التسلق المتصل بفارق ارتفاع نحو 500 متر؛ أو بالسيارة على الطريق الخرساني الضيق الذي أُعيد
    رصفه في السنوات الأخيرة — حاد، وبمسرب واحد عملياً، بمنعطفات ضيقة ومواضع قليلة للتلاقي.


    وخلف الكنيسة تمضي دروب نحو نهر غيرغيتي الجليدي وسلسلة سابيرتسه. وهذه مسيرات جبلية كاملة تحتاج يوماً
    مستقلاً وحذاءً مناسباً. والكنيسة عاملة، يسكنها رهبان وتقام فيها الصلوات بانتظام، فهي ليست مجرد مطل.
  tip: >-
    كثيراً ما يختفي كازبك في الغيوم؛ وأفضل فرصك بين السابعة والعاشرة صباحاً، وبعدها يتكاثف الغيم عادة.
    وهناك قواعد للباس — غطاء رأس وتنورة طويلة للنساء، وبنطال طويل للرجال، مع أغطية عند الباب. والريح في
    الأعلى لا تهدأ والحرارة أدنى بخمس إلى سبع درجات منها في القرية، فالسترة ضرورية حتى في يوليو. والخدمات
    في حدها الأدنى ولا مقهى، فاشترِ الماء والطعام في الأسفل. وأقرب صراف آلي في وسط كازبيغي.
  route: >-
    اتجه شمالاً من تبليسي على الطريق العسكري الجورجي عبر جينفالي وأنانوري وباسانوري وغوداوري، وفوق ممر
    جفاري على ارتفاع 2,379 متراً، ثم نزولاً عبر كوبي إلى كازبيغي — 155 كم ونحو ثلاث ساعات. ومن القرية
    تصعد 6 كم أخرى على طريق خرساني حاد وضيق. وسيارة منخفضة تستطيع تقنياً اجتيازه في الجو الجاف، لكن ما
    تريده فعلاً كروس أوفر أو دفع رباعي، لأن تجاوز سيارة قادمة يعني وضع عجلتين على التراب. وفي الشتاء السلاسل
    والدفع الرباعي ضروريان. والوقود في باسانوري أو كازبيغي.
