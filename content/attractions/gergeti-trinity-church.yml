ka:
  name: გერგეტის სამების ეკლესია
  short: >-
    XIV საუკუნის ტაძარი მწვანე ბორცვზე, 2170 მეტრზე, და მის უკან მყინვარწვერი — ხევის მთავარი სალოცავი,
    სადაც ოდესღაც წმინდა ნინოს ჯვარს მალავდნენ.
  body: >-
    **გერგეტის სამება ის სურათია, რომლითაც საქართველო მსოფლიოს ესალმება: მუქი ქვის ტაძარი მარტოდმარტო
    დგას მწვანე ბორცვზე, 2170 მეტრზე, ზურგს უკან კი, თუ ღრუბელი ნებას დართავს, მყინვარწვერის 5054-მეტრიანი
    თეთრი გუმბათი აღმართულა.**


    ტაძარი XIV საუკუნის 30-იან წლებში, კარგად გათლილი ანდეზიტის კვადრებით აუგიათ; სამრეკლო კი იმავე საუკუნის
    მეორე ნახევარში აუშენებიათ. 1392 წლის სითარხნის გუჯარი მონასტერს უკვე იხსენიებს, ბაგრატ V-მ კი მისი
    მოვლა-პატრონობა გერგეტელებს დააკისრა, რომლებიც მას შემდეგ „საყდრისშვილებად“ ითვლებოდნენ. ვახუშტი ბატონიშვილის
    ცნობით, მტრის შემოსევისას აქ მცხეთის საკათალიკოსოს განძსა და წმინდა ნინოს ჯვარს ხიზნავდნენ; ჯვარი
    დღეს თბილისის სიონშია დაბრძანებული.


    კარგად დააკვირდით: ჩუქურთმა კარ-სარკმლებს შემოუყვება — როზეტები, ჯვრები, ასტრაგალის წნული; გუმბათის
    ყელს ათი სარკმელი ჭრის, სამრეკლოს დასავლეთ პირზე კი ვიღაც უცნობის ფიგურაა გამოკვეთილი. რუსეთის იმპერიის
    დროს ინტერიერი ზეთის საღებავით შეღებეს, 2006 წელს კი კანკელის ნალესობის ქვეშ XVI საუკუნის მხატვრობა
    გამოჩნდა: ღვთისმშობელი, მაცხოვარი, იოანე ნათლისმცემელი და წმინდა ნინო. სამხრეთის კედელს პატარა საბჭეო
    ეკვრის — აქ, ქვის გრძელ სკამებზე, ხევის უხუცესები სხდებოდნენ, სამართალს აჩენდნენ და თემის დროშაზე,
    ორყუშზე, ერთგულების ფიცს დებდნენ.


    სამებას ამინდის ორი ხატიც ჰქონდა. როცა ავდარი არ წყდებოდა, გერგეტელებს სადარო ხატი გამოჰქონდათ; გვალვაში
    კი საავდროს გაიტანდნენ და წყაროს წყალში ბანდნენ.


    16 ივლისს, გერგეტობას, სიონიდან ღვთისმშობლის ხატის მობრძანებას იხსენებენ და დღე საგალობლებით სრულდება.
    სხვა დღეებში კი, დილის შვიდ საათზე, პირველ მიკროავტობუსებამდე, ბორცვი ისევ ქარს, სამრეკლოსა და მთას
    ეკუთვნის — ისევე, როგორც თითქმის შვიდი საუკუნის წინ.
  tip: >-
    მყინვარწვერი ხშირად ღრუბელშია; ყველაზე დიდი შანსი დილით, დაახლოებით ათ საათამდეა, შემდეგ ღრუბელი ჩვეულებრივ
    იკრიბება. ტაძარი მოქმედია: ქალებს თავსაფარი და გრძელი ქვედატანი სჭირდებათ, მამაკაცებს — გრძელი შარვალი;
    მოსასხამებს კართან გაძლევენ. ზემოთ მუდმივად უბერავს და სტეფანწმინდაზე შესამჩნევად ცივა, ამიტომ ქურთუკი
    ივლისშიც წაიღეთ. წყალი და საჭმელი დაბაში იყიდეთ, ბანკომატიც სტეფანწმინდის ცენტრშია. გერგეტობაზე, 16
    ივლისს, ხალხმრავლობა იცის. ზამთარში ტაძრამდე გზა მაგისტრალზე ადრე იყინება.
  route: >-
    თბილისიდან სამხედრო გზას (ს3/E117) გაუყევით ჟინვალის, ანანურის, ფასანაურისა და გუდაურის გავლით, გადაიარეთ
    ჯვრის უღელტეხილი (2379 მ) და კობის გავლით სტეფანწმინდამდე დაეშვით — დაახლოებით 157 კილომეტრი. დაბიდან
    გერგეტის გავლით ტაძრამდე კიდევ 6 კილომეტრი ციცაბო, ვიწრო ბეტონის გზაა, სულ 163 კილომეტრი და დაახლოებით
    სამი საათი და ოცდახუთი წუთი. გზა ფაქტობრივად ერთზოლიანია, მკვეთრი მოსახვევებით: სედანი მშრალ ამინდში
    ავა, მაგრამ შემხვედრის გასატარებლად ბორბლები გვერდზე, მიწაზე უნდა ჩაიყვანოთ, ამიტომ კროსოვერი ან ჯიპი
    ჯობია. ზამთარში ჯაჭვები და 4x4 აუცილებელია. ფეხით დაბიდან საათ-საათნახევარში ახვალთ. საწვავი ფასანაურსა
    და სტეფანწმინდაშია.
en:
  name: Gergeti Trinity Church
  short: >-
    A 14th-century church alone on a green crest at 2,170 m under Mount Kazbek: the chief shrine of Khevi,
    once the hiding place of St Nino's Cross.
  body: >-
    **Gergeti Trinity is the picture Georgia sends out into the world: a dark stone church alone on a
    green crest at 2,170 metres and, when the cloud allows, the white cone of Kazbek, 5,054 metres, rising
    behind it.**


    The church was built in the 1330s from squared blocks of andesite, the belfry later in the same century.
    A charter of 1392 already names the monastery, and King Bagrat V made the villagers of Gergeti its
    keepers, known ever after as the church's children. Prince Vakhushti recorded that when enemies came,
    the treasures of the Mtskheta patriarchate and the Cross of St Nino were hidden here; the cross now
    rests in Sioni Cathedral in Tbilisi.


    Look closely. Carving gathers round the doors and windows: rosettes, crosses, a beaded astragal. Ten
    windows pierce the drum, and on the belfry's west face stands a carved figure nobody has identified.
    Imperial Russian painters covered the interior in oil paint, but in 2006 plaster by the altar screen
    gave up 16th-century images of the Virgin, Christ, John the Baptist and St Nino. Against the south
    wall sits a small council house where the elders of Khevi sat on long stone benches, judged disputes
    and swore loyalty on the community banner.


    The church also kept two icons for the weather. When storms would not stop, the villagers carried
    out the fair-weather icon; in drought they brought out the rain icon and dipped it in spring water.


    On 16 July, Gergetoba, the arrival of the icon of the Mother of God from Sioni is remembered with
    hymns. On other mornings, at seven, before the first minibuses, the crest belongs to the wind, the
    bell tower and the mountain, as it has for nearly seven hundred years.
  tip: >-
    Kazbek is often hidden in cloud; your best chance is early morning, before about ten, when cloud usually
    starts to build. This is a working church: women need a headscarf and a long skirt, men long trousers,
    and wraps are lent at the door. The wind at the top is constant and it is noticeably colder than in
    Stepantsminda, so bring a jacket even in July. Buy water and food in town, where the ATMs are too.
    Gergetoba on 16 July draws crowds. In winter the church road ices up before the highway does.
  route: >-
    From Tbilisi follow the Georgian Military Highway (S3/E117) through Zhinvali, Ananuri, Pasanauri and
    Gudauri, over the Jvari Pass (2,379 m) and down through Kobi to Stepantsminda, about 157 km. From
    town a steep, narrow concrete road climbs 6 km through Gergeti to the church: 163 km and about 3 hours
    25 minutes in all. It is effectively single-lane with tight hairpins; a saloon can manage it in the
    dry, but passing means putting two wheels on the verge, so a crossover or 4x4 is better, and chains
    and four-wheel drive are essential in winter. On foot from town it is an hour to an hour and a half.
    Fuel at Pasanauri or Stepantsminda.
ru:
  name: Церковь Святой Троицы в Гергети
  short: >-
    Храм XIV века стоит в одиночестве на зелёном гребне на высоте 2170 м под Казбеком: главная святыня
    Хеви, где когда-то прятали крест святой Нино.
  body: >-
    **Гергетская Троица — та самая картинка, которой Грузия представляет себя миру: одинокая тёмная каменная
    церковь на зелёном гребне на высоте 2170 метров, а за ней, если позволят облака, поднимается белый
    конус Казбека — 5054 метра.**


    Церковь сложили в 1330-х годах из тёсаных андезитовых блоков, колокольню — позже, в том же столетии.
    Грамота 1392 года уже упоминает монастырь, а царь Баграт V поручил заботу о нём жителям Гергети, которых
    с тех пор так и звали — «дети храма». Царевич Вахушти записал, что при набегах врагов сюда уносили
    сокровища Мцхетской патриархии и крест святой Нино; сегодня крест хранится в тбилисском соборе Сиони.


    Присмотритесь. Резьба собирается вокруг дверей и окон: розетки, кресты, бусинный астрагал. Барабан
    прорезают десять окон, а на западной грани колокольни высечена фигура, которую так никто и не опознал.
    В имперские времена русские живописцы покрыли стены изнутри масляной краской, но в 2006 году из-под
    штукатурки у алтарной преграды проступили росписи XVI века: Богоматерь, Христос, Иоанн Креститель
    и святая Нино. К южной стене прилепился маленький дом совета: здесь на длинных каменных скамьях сидели
    старейшины Хеви, разбирали тяжбы и клялись в верности на общинном знамени.


    Хранила церковь и две «погодные» иконы. Когда ненастье не унималось, жители выносили икону ясной погоды;
    в засуху выносили икону дождя и окунали её в родниковую воду.


    16 июля, в Гергетобу, песнопениями вспоминают, как из Сиони принесли икону Богоматери. А в другие
    дни в семь утра, до первых маршруток, гребень принадлежит ветру, колокольне и горе — как почти семьсот
    лет назад.
  tip: >-
    Казбек часто прячется в облаках; лучший шанс — ранним утром, примерно до десяти, когда облачность
    обычно только начинает собираться. Храм действующий: женщинам нужны платок и длинная юбка, мужчинам
    — длинные брюки, накидки выдают у входа. Наверху не стихает ветер и заметно холоднее, чем в Степанцминде,
    так что куртка пригодится даже в июле. Воду и еду покупайте в посёлке — там же и банкоматы. На Гергетобу,
    16 июля, собирается много народу. Зимой дорога к храму обледеневает раньше, чем трасса.
  route: >-
    Из Тбилиси — по Военно-Грузинской дороге (S3/E117) через Жинвали, Ананури, Пасанаури и Гудаури, через
    Крестовый перевал (2379 м) и вниз через Коби до Степанцминды, около 157 км. Из посёлка крутая узкая
    бетонка поднимается 6 км через село Гергети к церкви: всего 163 км и около 3 часов 25 минут. По сути
    это одна полоса с тесными серпантинами; седан в сухую погоду справится, но при разъезде придётся съезжать
    двумя колёсами на обочину, поэтому лучше кроссовер или внедорожник, а зимой полный привод и цепи обязательны.
    Пешком из посёлка — от часа до полутора. Заправка — в Пасанаури или Степанцминде.
fa:
  name: کلیسای تثلیث گرگتی
  short: >-
    کلیسایی از سدهٔ چهاردهم، تنها بر ستیغی سبز در ارتفاع ۲,۱۷۰ متر زیر کوه کازبک: مهم‌ترین زیارتگاه خه‌وی
    و روزگاری نهانگاه صلیب قدیسه نینو.
  body: >-
    **تثلیث گرگتی همان تصویری است که گرجستان به جهان می‌فرستد: کلیسایی از سنگ تیره، تنها بر ستیغی سبز
    در ارتفاع ۲,۱۷۰ متر، و پشت سرش، هرگاه ابر رخصت دهد، مخروط سپید کازبک با ۵,۰۵۴ متر بلندی.**


    کلیسا در دههٔ ۱۳۳۰ از قطعه‌سنگ‌های چهارگوش و تراشیدهٔ آندزیت ساخته شد و برج ناقوس کمی بعد، در همان
    سده. در منشوری از سال ۱۳۹۲ نام صومعه آمده است، و شاه باگرات پنجم نگهداری آن را به روستاییان گرگتی
    سپرد؛ از آن پس آنان را «فرزندان کلیسا» خواندند. شاهزاده واخوشتی نوشته است که هنگام هجوم دشمن، گنجینه‌های
    پاتریارک‌نشین متسختا و صلیب قدیسه نینو را اینجا پنهان می‌کردند؛ این صلیب امروز در کلیسای جامع سیونی
    در تفلیس نگهداری می‌شود.


    از نزدیک نگاه کنید. کنده‌کاری‌ها گرداگرد درها و پنجره‌ها جمع شده‌اند: گل‌نقش‌ها، صلیب‌ها و نواری از
    نقش مهره‌ها. ده پنجره گردن گنبد را شکافته‌اند و بر نمای غربی برج ناقوس پیکره‌ای کنده شده که هنوز کسی
    نتوانسته بگوید کیست. نقاشان روسیهٔ تزاری درون کلیسا را با رنگ روغن پوشاندند، اما در سال ۲۰۰۶ از زیر
    گچِ کنار دیوارهٔ محراب نقش‌هایی از سدهٔ شانزدهم بیرون آمد: مریم عذرا، مسیح، یحیای تعمیددهنده و قدیسه
    نینو. به دیوار جنوبی خانهٔ کوچکی برای شورا چسبیده است؛ ریش‌سفیدان خه‌وی اینجا بر نیمکت‌های بلند سنگی
    می‌نشستند، میان مردم داوری می‌کردند و بر پرچم جماعت سوگند وفاداری می‌خوردند.


    کلیسا دو شمایل هم برای آب‌وهوا نگه می‌داشت. وقتی توفان بند نمی‌آمد، روستاییان شمایل هوای صاف را بیرون
    می‌آوردند؛ و در خشکسالی شمایل باران را بیرون می‌آوردند و در آب چشمه فرو می‌بردند.


    در ۱۶ ژوئیه، روز گرگتوبا، رسیدن شمایل مادر خدا از سیونی را با سرودهای کلیسایی یاد می‌کنند. در صبح‌های
    دیگر، ساعت هفت، پیش از نخستین مینی‌بوس‌ها، ستیغ از آنِ باد و برج ناقوس و کوه است، همان‌گونه که نزدیک
    به هفتصد سال بوده است.
  tip: >-
    کازبک اغلب در ابر پنهان است؛ بهترین بخت شما صبح زود است، پیش از حدود ساعت ده، که معمولاً ابرها از
    آن به بعد انبوه می‌شوند. این کلیسا فعال است: زنان روسری و دامن بلند لازم دارند و مردان شلوار بلند،
    و دم در پوشش امانت می‌دهند. باد در بالا یکسره می‌وزد و هوا به‌وضوح سردتر از استپانتسمینداست، پس حتی
    در ژوئیه کاپشن بیاورید. آب و خوراک را در شهر بخرید؛ خودپردازها هم همان‌جا هستند. گرگتوبا در ۱۶ ژوئیه
    جمعیت زیادی را می‌کشاند. در زمستان جادهٔ کلیسا زودتر از بزرگراه یخ می‌بندد.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (S3/E117) را از ژینوالی، آنانوری، پاساناوری و گودائوری دنبال کنید، از
    گردنهٔ جواری (۲,۳۷۹ متر) بگذرید و از راه کوبی به استپانتسمیندا پایین بیایید؛ حدود ۱۵۷ کیلومتر. از
    شهر، جاده‌ای بتنی، تند و باریک ۶ کیلومتر از میان روستای گرگتی تا کلیسا بالا می‌رود: روی‌هم ۱۶۳ کیلومتر
    و حدود ۳ ساعت و ۲۵ دقیقه. جاده عملاً یک‌خطه است با پیچ‌های تنگ؛ سواری در هوای خشک از پسش برمی‌آید،
    اما برای رد شدن از کنار خودروی روبه‌رو باید دو چرخ را روی شانهٔ جاده ببرید، پس کراس‌اوور یا 4x4 بهتر
    است، و در زمستان زنجیر چرخ و چهارچرخ‌محرک ضروری است. پیاده از شهر یک تا یک‌ونیم ساعت راه است. سوخت
    در پاساناوری یا استپانتسمیندا.
he:
  name: כנסיית השילוש הקדוש בגרגטי
  short: >-
    כנסייה מן המאה ה-14 הניצבת לבדה על רכס ירוק בגובה 2,170 מטר, למרגלות הר קזבק: המקדש החשוב ביותר של
    חבי, ופעם מקום המסתור של צלב נינו הקדושה.
  body: >-
    **השילוש בגרגטי הוא התמונה שגאורגיה שולחת אל העולם: כנסיית אבן כהה, לבדה על רכס ירוק בגובה 2,170 מטר,
    ומאחוריה, כשהעננים מרשים, מתנשא החרוט הלבן של הר קזבק, 5,054 מטר.**


    הכנסייה נבנתה בשנות ה-30 של המאה ה-14 מגושי אנדזיט מרובעים ומסותתים, ומגדל הפעמונים נוסף מאוחר יותר
    באותה מאה. המנזר מוזכר כבר בתעודה משנת 1392, והמלך בגרט החמישי הפקיד את השמירה עליו בידי תושבי גרגטי,
    שמאז נקראו "ילדי הכנסייה". הנסיך ואחושטי תיעד שבעת פלישות אויב הוסתרו כאן אוצרות הפטריארכיה של מצחתה
    וצלב נינו הקדושה; כיום הצלב שמור בקתדרלת סיוני בטביליסי.


    הביטו מקרוב. הגילופים מתרכזים סביב הדלתות והחלונות: רוזטות, צלבים ופס חרוזים מגולף. עשרה חלונות פעורים
    בתוף הכיפה, ועל חזיתו המערבית של מגדל הפעמונים ניצבת דמות מגולפת שאיש לא הצליח לזהות. ציירים בתקופת
    האימפריה הרוסית כיסו את פנים הכנסייה בצבע שמן, אבל ב-2006 נחשפו מתחת לטיח שליד מחיצת המזבח ציורי קיר
    מן המאה ה-16: מרים הבתולה, ישו, יוחנן המטביל ונינו הקדושה. אל הקיר הדרומי צמוד בית מועצה קטן; כאן
    ישבו זקני חבי על ספסלי אבן ארוכים, הכריעו בסכסוכים ונשבעו אמונים על דגל הקהילה.


    בכנסייה נשמרו גם שתי איקונות של מזג אוויר. כשהסערות לא פסקו, הוציאו אנשי הכפר את איקונת מזג האוויר
    הבהיר; בבצורת הוציאו את איקונת הגשם וטבלו אותה במי מעיין.


    ב-16 ביולי, בחג גרגטובה, מציינים במזמורים את הבאתה של איקונת אם האלוהים מסיוני. בבקרים אחרים, בשבע,
    לפני המיניבוסים הראשונים, הרכס שייך לרוח, למגדל הפעמונים ולהר, כפי שהיה כבר כמעט שבע מאות שנה.
  tip: >-
    קזבק מסתתר לעתים קרובות בעננים; הסיכוי הטוב ביותר הוא מוקדם בבוקר, לפני עשר בערך, שאז העננים מתחילים
    בדרך כלל להצטבר. זו כנסייה פעילה: נשים צריכות כיסוי ראש וחצאית ארוכה, גברים מכנסיים ארוכים, ובכניסה
    משאילים בדים לכיסוי. הרוח למעלה נושבת בלי הפסקה וקר שם הרבה יותר מאשר בסטפנצמינדה, אז הביאו מעיל גם
    ביולי. קנו מים ואוכל בעיירה, שם נמצאים גם הכספומטים. חג גרגטובה ב-16 ביולי מושך המונים. בחורף הדרך
    לכנסייה מתכסה קרח עוד לפני הכביש הראשי.
  route: >-
    מטביליסי סעו בכביש הצבאי הגאורגי (S3/E117) דרך ז'ינוואלי, אנאנורי, פסנאורי וגודאורי, מעל מעבר ג'וארי
    (2,379 מטר) ובמורד דרך קובי אל סטפנצמינדה, כ-157 ק"מ. מהעיירה מטפס כביש בטון תלול וצר 6 ק"מ דרך הכפר
    גרגטי אל הכנסייה: בסך הכול 163 ק"מ וכ-3 שעות ו-25 דקות. זה למעשה נתיב יחיד עם סיבובי פרסה הדוקים;
    רכב סדאן יעבור במזג אוויר יבש, אבל כדי לחלוף על פני רכב ממול צריך לעלות בשני גלגלים על השוליים, ולכן
    עדיף קרוסאובר או 4x4, ובחורף שרשראות והנעה כפולה הן חובה. ברגל מהעיירה זה שעה עד שעה וחצי. דלק בפסנאורי
    או בסטפנצמינדה.
ar:
  name: كنيسة الثالوث المقدس في غيرغيتي
  short: >-
    كنيسة من القرن الرابع عشر تقف وحيدة على ذروة خضراء على ارتفاع 2,170 متراً تحت جبل كازبك: أجلّ مزارات
    خيفي، وكانت يوماً مخبأ صليب القديسة نينو.
  body: >-
    **ثالوث غيرغيتي هو الصورة التي تبعث بها جورجيا إلى العالم: كنيسة من حجر داكن تقف وحيدة على ذروة خضراء
    على ارتفاع 2,170 متراً، ومن خلفها، حين يأذن الغيم، يرتفع مخروط كازبك الأبيض بعلوّ 5,054 متراً.**


    بُنيت الكنيسة في ثلاثينيات القرن الرابع عشر من كتل مربعة منحوتة من الأنديزيت، وأُضيف برج الأجراس لاحقاً
    في القرن نفسه. ويرد ذكر الدير في وثيقة تعود إلى عام 1392، وقد عهد الملك باغرات الخامس برعايته إلى
    أهل غيرغيتي، فعُرفوا منذ ذلك الحين بـ«أبناء الكنيسة». ودوّن الأمير فاخوشتي أن كنوز بطريركية متسخيتا
    وصليب القديسة نينو كانت تُخبّأ هنا كلما أقبل الأعداء؛ ويستقر الصليب اليوم في كاتدرائية سيوني في تبليسي.


    تأمّل عن قرب. تتجمّع النقوش حول الأبواب والنوافذ: وريدات وصلبان وشريط من الخرز المنحوت. عشر نوافذ
    تخترق رقبة القبة، وعلى الوجه الغربي لبرج الأجراس هيئة منحوتة لم يتعرّف أحد على صاحبها. وقد غطّى رسامون
    في عهد الإمبراطورية الروسية جدران الداخل بطلاء زيتي، لكن في عام 2006 تكشّفت تحت الجص قرب حاجز الهيكل
    رسوم من القرن السادس عشر: العذراء والمسيح ويوحنا المعمدان والقديسة نينو. وإلى الجدار الجنوبي يلتصق
    بيت صغير للمجلس، كان شيوخ خيفي يجلسون فيه على مقاعد حجرية طويلة، يفصلون في النزاعات ويُقسمون يمين
    الولاء على راية الجماعة.


    وكانت الكنيسة تحفظ أيضاً أيقونتين للطقس. فإذا لم تهدأ العواصف أخرج القرويون أيقونة الصحو، وفي الجفاف
    كانوا يُخرجون أيقونة المطر ويغمسونها في ماء النبع.


    وفي 16 يوليو، يوم غيرغيتوبا، تُستعاد بالتراتيل ذكرى وصول أيقونة والدة الإله من سيوني. أما في الصباحات
    الأخرى، عند السابعة، قبل أولى الحافلات الصغيرة، فالذروة ملك للريح وبرج الأجراس والجبل، كما كانت منذ
    ما يقارب سبعمئة عام.
  tip: >-
    كثيراً ما يختبئ كازبك في الغيم؛ وأفضل فرصة لرؤيته في الصباح الباكر، قبل العاشرة تقريباً، إذ يبدأ الغيم
    عادة بالتراكم بعدها. هذه كنيسة تُقام فيها الصلوات: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال
    إلى بنطال طويل، وتُعار الأغطية عند الباب. الريح في الأعلى لا تهدأ، والجو أبرد بوضوح منه في ستيبانتسميندا،
    فاحمل سترة حتى في يوليو. اشترِ الماء والطعام من البلدة، ففيها أيضاً أجهزة الصراف الآلي. يجتذب عيد
    غيرغيتوبا في 16 يوليو حشوداً كبيرة. وفي الشتاء يتجمّد طريق الكنيسة قبل الطريق الرئيسي.
  route: >-
    من تبليسي اتبع الطريق العسكري الجورجي (S3/E117) عبر جينفالي وأنانوري وباسانوري وغوداوري، ثم فوق ممر
    جفاري (2,379 متراً) ونزولاً عبر كوبي إلى ستيبانتسميندا، نحو 157 كم. ومن البلدة يصعد طريق خرساني شديد
    الانحدار وضيق مسافة 6 كم عبر قرية غيرغيتي إلى الكنيسة: 163 كم وقرابة 3 ساعات و25 دقيقة في المجمل.
    هو في الواقع مسرب واحد بمنعطفات حادة؛ تجتازه سيارة السيدان في الطقس الجاف، لكن تجاوز سيارة قادمة يعني
    إنزال عجلتين على حافة الطريق، لذا فالكروس أوفر أو سيارة الدفع الرباعي أفضل، أما في الشتاء فلا غنى
    عن السلاسل والدفع الرباعي. سيراً على الأقدام من البلدة تستغرق الرحلة ساعة إلى ساعة ونصف. الوقود في
    باسانوري أو ستيبانتسميندا.
