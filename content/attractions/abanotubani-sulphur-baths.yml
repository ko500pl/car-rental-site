ka:
  name: აბანოთუბანი და გოგირდის აბანოები
  short: >-
    ნარიყალას ძირას აგურის გუმბათები გოგირდით სუნთქავენ: თბილი წყალი, რომელმაც ქალაქს სახელი დაარქვა,
    დღესაც საათობრივად ავსებს ქვის აუზებს.
  body: >-
    **თბილისს სახელი ამ თბილმა წყალმა დაარქვა, რომელიც დღესაც აგურის გუმბათების ქვეშ ამოდის.** ქალაქის
    დაარსების ამბავი გადმოცემაა და ასეც უნდა მოვყვეთ: V საუკუნეში ვახტანგ გორგასლის შევარდენმა ხოხობი
    დაიჭირა, ფრინველი ცხელ წყაროში ჩავარდა და მოიხარშა, მეფემ კი ბრძანა, ტყე გაეკაფათ და აქ ქალაქი გაეშენებინათ.
    მატიანე ნაკლებად რომანტიკულ ნაწილს მის ძეს, დაჩის, მიაწერს: დედაქალაქი მცხეთიდან თბილისში სწორედ მან
    გადმოიტანა.


    წყალი აქ მეფეებზე ადრეც დუღდა. არქეოლოგებმა ამ უბანში I–II საუკუნეების აბანოები აღმოაჩინეს — მოზაიკით
    მოპირკეთებული აუზებითა და თიხის მილების მთელი ქსელით. X საუკუნის არაბი გეოგრაფი იბნ ჰაუკალი წერდა,
    რომ ქალაქში ტიბერიადის მსგავსი აბანოებია, „რომელთა წყალიც უცეცხლოდ დუღს“. XIII საუკუნეში თბილისში
    65 აბანო ითვლებოდა.


    ქუჩიდან თითქმის არაფერი ჩანს. აბანოები მიწაშია ჩაშვებული და ზედაპირზე მხოლოდ დაბალი აგურის გუმბათების
    მინდორი მოჩანს; სარკმლებიდან მოხარშული კვერცხის მძიმე სუნი ამოდის, რომელსაც ათიოდე წუთში ეჩვევით.
    გრიშაშვილის ქუჩის თავში ბრინჯაოს შევარდენი თავის ნანადირევ ხოხობზე ზის, შესახვევის ბოლოს კი ჭრელი
    აბანოს ლურჯი, სპარსული ყაიდის ფასადი ანათებს. გუმბათებს მიღმა ლეღვთახევი იწყება — ხევი, რომელსაც სახელი
    ლეღვის ხეების სიმრავლემ დაარქვა. ოდესღაც მის გოგირდიან ნაკადში მეტყავეები ტყავს ამუშავებდნენ, დღეს
    კი კლდეებს შორის ჩანჩქერი ჩამოდის.


    აბანოში მხოლოდ დასაბანად არასოდეს დადიოდნენ. მთელი დღით მოდიოდნენ, ჭამდნენ, მღეროდნენ, გადმოცემით
    კი სადედამთილოები აქ საპატარძლოს სილამაზეს სინჯავდნენ.


    დღეს ცალკე ნომერს საათობრივად ქირაობთ: ქვის აუზი ცხელი მინერალური წყლით, შხაპი, სკამი. ერთხელ მაინც
    მიენდეთ მეკისეს და მის ხეშეშა ქისას — გამოხვალთ მოხარშული კიბოსავით ვარდისფერი და იმაზე მსუბუქი, ვიდრე
    შეხვედით.
  tip: >-
    პარასკევიდან კვირამდე, საღამოს, ნომერი წინასწარ დაჯავშნეთ; სამუშაო დღეების დილა მშვიდია. ფასი ნომერზე
    და საათზეა და არა ერთ ადამიანზე — აბანოსა და ოთახის ზომის მიხედვით დაახლოებით 50–150 ლარი. იკითხეთ,
    რა შედის ფასში: პირსახოცი, ჩუსტები და მეკისის მომსახურება ხშირად ცალკე ფასდება. მძიმე სადილის შემდეგ
    პირდაპირ ნუ მიხვალთ; წყალში ერთბაშად 15–20 წუთზე მეტხანს ნუ დარჩებით, შუალედებში შეისვენეთ, მთელი
    სეანსი კი დაახლოებით ერთ საათს არ უნდა აღემატებოდეს — ცხელი წყალი წნევაზე მოქმედებს, და თუ ამ მხრივ
    პრობლემა გაქვთ, წინასწარ გაითვალისწინეთ. ცალკე ნომერში საბანაო კოსტიუმი აუცილებელი არ არის. გამოსვლის
    შემდეგ, საჭესთან დაჯდომამდე, ჩაი დალიეთ და ცოტა დაისვენეთ. ბანკომატები და კაფეები გორგასლის მოედანზეა.
  route: >-
    აბანოთუბანი თავისუფლების მოედნიდან 2 კილომეტრზე ნაკლებითაა დაშორებული — ქალაქის საცობებში მანქანით
    10–15 წუთი, მარჯვენა სანაპიროთი ან მარცხენა ნაპირიდან მეტეხის ხიდის გავლით. გზა ადვილია, ბოლო რამდენიმე
    ასეული მეტრი — არა: გუმბათების ირგვლივ შესახვევები ვიწრო და ცალმხრივია, აბანოს კართან გასაჩერებელი
    ადგილი კი არ არის. მანქანა დატოვეთ გორგასლის მოედნის ფასიან სადგომზე — ყველაზე ახლოს, მაგრამ ყველაზე
    პატარაა, — ან რიყის პარკის სადგომზე და მეტეხის ხიდით ფეხით გადმოდით, დაახლოებით ათ წუთში. გზა ბოლომდე
    ასფალტია: ეკონომკლასის მანქანა იდეალურია, და რაც უფრო პატარაა, მით უფრო ადვილად გააჩერებთ.
en:
  name: Abanotubani and the Sulphur Baths
  short: >-
    Brick domes breathing sulphur at the foot of Narikala: the warm springs that gave Tbilisi its name,
    still filling private stone pools by the hour.
  body: >-
    **Tbilisi takes its name from the warm water that still rises beneath these brick domes.** *Tbili*
    means warm, and the founding story is best told as the legend it is: in the fifth century King Vakhtang
    Gorgasali's falcon brought down a pheasant, the bird tumbled into a hot spring and was boiled, and
    the king ordered the forest cleared for a city. History gives the prosaic part to his son Dachi, who
    moved the capital here from Mtskheta.


    The water was here long before the kings. Archaeologists have found bathhouses of the first and second
    centuries AD in this quarter, with mosaic pools and a web of clay pipes. In the tenth century the
    Arab geographer Ibn Hawqal wrote that the town had baths like those of Tiberias, "whose water boils
    without fire". By the thirteenth century Tbilisi counted sixty-five of them.


    From the street you see almost nothing. The bathhouses are sunk into the ground, leaving only a field
    of low brick cupolas whose vents breathe the smell of boiled eggs into the air; after ten minutes
    you stop noticing. A bronze falcon sits on its pheasant at the head of Grishashvili Street, and the
    blue-tiled, Persian-style façade of Chreli Abano glows at the end of the lane. Behind the domes opens
    Leghvtakhevi, the "fig-tree gorge", where tanners once cured hides in the sulphur stream and a waterfall
    now drops between the cliffs.


    People never came only to wash. Families spent whole days here, eating and singing, and tradition
    says future mothers-in-law came to judge a bride's looks.


    Today you hire a private room by the hour: a stone pool of hot mineral water, a shower, a bench. Surrender
    once to the *mekise* and his rough mitt. You leave pink as a boiled crayfish and lighter than you
    came in.
  tip: >-
    Book ahead for Friday to Sunday evenings; weekday mornings are quiet. You pay per room per hour, not
    per person — roughly 50–150 lari depending on the bathhouse and the size of the room — so ask what
    is included: towels, slippers and the *mekise* scrub are often extra. Don't come straight from a heavy
    lunch, and soak in spells of 15–20 minutes with breaks, keeping the whole session to about an hour;
    long spells in hot water are hard on blood pressure, so check first if yours is a concern. Swimwear
    is optional in a private room. Afterwards sit over tea before driving anywhere. Cash machines and
    cafés are on Gorgasali Square.
  route: >-
    Abanotubani is under 2 km from Freedom Square — ten to fifteen minutes in city traffic, down to the
    right-bank embankment or across Metekhi bridge from the left bank. The drive is easy; the last few
    hundred metres are not. The lanes around the domes are narrow and one-way, and there is nowhere to
    stop at a bathhouse door. Use the paid lot on Gorgasali Square, the closest but also the smallest,
    or the car park at Rike Park and walk across Metekhi bridge in about ten minutes. Asphalt all the
    way: an economy car is ideal, and the smaller it is, the easier you will park.
ru:
  name: Абанотубани и серные бани
  short: >-
    Кирпичные купола у подножия Нарикалы дышат серой: тёплые источники, давшие Тбилиси имя, до сих пор
    наполняют каменные бассейны — почасово.
  body: >-
    **Тбилиси назван в честь тёплой воды, которая и сегодня поднимается из-под этих кирпичных куполов.**
    *Тбили* по-грузински значит «тёплый», а историю основания лучше рассказывать как то, чем она и является,
    — как легенду: в V веке сокол царя Вахтанга Горгасали сбил фазана, птица упала в горячий источник
    и сварилась, и царь велел вырубить лес и заложить город. Прозаическую часть история оставляет его
    сыну Дачи, который перенёс сюда столицу из Мцхеты.


    Вода была здесь задолго до царей. В этом квартале археологи нашли бани I–II веков н. э. с мозаичными
    бассейнами и сетью глиняных труб. В X веке арабский географ Ибн Хаукаль писал, что в городе есть бани,
    подобные баням Тивериады, «вода которых кипит без огня». К XIII веку их в Тбилиси насчитывалось шестьдесят
    пять.


    С улицы почти ничего не видно. Бани утоплены в землю, и над ними остаётся лишь поле низких кирпичных
    куполов, из отдушин которых тянет запахом варёных яиц; минут через десять вы перестаёте его замечать.
    В начале улицы Гришашвили бронзовый сокол сидит на своём фазане, а в конце переулка светится голубой
    изразцовый фасад Чрели-абано в персидском духе. За куполами открывается Легвтахеви, «ущелье смоковниц»:
    когда-то кожевники выделывали здесь шкуры в серном ручье, а теперь между скал падает водопад.


    Сюда никогда не ходили только затем, чтобы помыться. Семьи проводили в банях целые дни, ели и пели,
    а будущие свекрови, по преданию, приходили оценить, хороша ли невеста.


    Сегодня вы снимаете отдельный номер на час: каменный бассейн с горячей минеральной водой, душ, скамья.
    Хотя бы раз отдайтесь в руки *мекисе* с его жёсткой рукавицей. Выйдете розовым, как варёный рак, и
    легче, чем пришли.
  tip: >-
    Вечера с пятницы по воскресенье бронируйте заранее; по утрам в будни здесь тихо. Платят за номер в
    час, а не с человека — примерно 50–150 лари в зависимости от бани и размера номера, — поэтому уточните,
    что входит в цену: полотенца, тапочки и пилинг у *мекисе* часто оплачиваются отдельно. Не приходите
    сразу после сытного обеда; лежите в воде по 15–20 минут с перерывами, а весь сеанс ограничьте примерно
    часом: долгое пребывание в горячей воде тяжело для давления, так что, если оно вас беспокоит, выясните
    заранее, можно ли вам. В отдельном номере купальник необязателен. После бани посидите за чаем, прежде
    чем куда-либо ехать. Банкоматы и кафе — на площади Горгасали.
  route: >-
    Абанотубани менее чем в 2 км от площади Свободы — десять-пятнадцать минут на машине с учётом городских
    пробок: вниз, к набережной правого берега, или через Метехский мост с левого берега. Доехать легко,
    трудны последние несколько сотен метров. Переулки вокруг куполов узкие, с односторонним движением,
    и остановиться у дверей бани негде. Оставьте машину на платной стоянке на площади Горгасали — ближайшей,
    но и самой маленькой, — или на парковке у парка Рике и пройдите через Метехский мост пешком, это минут
    десять. Всюду асфальт: автомобиль эконом-класса идеален, и чем он меньше, тем проще припарковаться.
fa:
  name: آبانوتوبانی و حمام‌های گوگردی
  short: >-
    گنبدهای آجری‌ای که در دامنهٔ ناریقلعه بوی گوگرد می‌دمند: چشمه‌های گرمی که نام تفلیس از آن‌هاست و هنوز
    حوض‌های سنگی اتاق‌های خصوصی را ساعتی پر می‌کنند.
  body: >-
    **تفلیس نامش را از آب گرمی گرفته است که هنوز از زیر همین گنبدهای آجری بالا می‌آید.** *تبیلی* در گرجی
    یعنی «گرم»، و داستان بنیاد شهر را بهتر است همان‌طور که هست، یعنی چون افسانه، روایت کرد: در سدهٔ پنجم،
    شاهینِ شاه واختانگ گورگاسالی قرقاولی را زد، پرنده در چشمه‌ای داغ افتاد و پخته شد، و شاه فرمان داد
    جنگل را ببُرند و شهری بسازند. تاریخ بخش بی‌شاعرانهٔ ماجرا را به پسرش داچی می‌سپارد که پایتخت را از
    متسختا به اینجا آورد.


    آب خیلی پیش از شاهان اینجا بود. باستان‌شناسان در همین محله گرمابه‌هایی از سده‌های یکم و دوم میلادی
    یافته‌اند، با حوض‌های موزاییکی و شبکه‌ای از لوله‌های سفالی. در سدهٔ دهم، ابن حوقل، جغرافی‌دان عرب،
    نوشت که این شهر گرمابه‌هایی دارد همچون گرمابه‌های طبریه، «که آبشان بی‌آتش می‌جوشد». تا سدهٔ سیزدهم
    شمار آن‌ها در تفلیس به شصت‌وپنج رسیده بود.


    از خیابان تقریباً چیزی پیدا نیست. گرمابه‌ها در دل زمین فرو رفته‌اند و تنها دشتی از گنبدهای کوتاه آجری
    بر جا مانده که از روزنه‌هایشان بوی تخم‌مرغ آب‌پز در هوا می‌پیچد؛ پس از ده دقیقه دیگر متوجهش نمی‌شوید.
    سر خیابان گریشاشویلی، شاهینی مفرغی بر قرقاولش نشسته است و در انتهای کوچه، نمای کاشی آبیِ چرلی آبانو
    به سبک ایرانی می‌درخشد. پشت گنبدها لغوتاخوی گشوده می‌شود، «درهٔ درختان انجیر»، جایی که روزگاری دباغان
    پوست‌ها را در جوی گوگردی دباغی می‌کردند و اکنون آبشاری میان صخره‌ها فرو می‌ریزد.


    مردم هرگز فقط برای شست‌وشو به اینجا نمی‌آمدند. خانواده‌ها روزهای کامل را این‌جا می‌گذراندند، می‌خوردند
    و آواز می‌خواندند، و به روایت سنت، مادرشوهرهای آینده می‌آمدند تا زیبایی عروس را بسنجند.


    امروز اتاقی خصوصی را ساعتی اجاره می‌کنید: حوضی سنگی پر از آب معدنی داغ، یک دوش، یک نیمکت. دست‌کم یک
    بار خود را به دست *مکیسه* و کیسهٔ زبرش بسپارید. گلگون مثل خرچنگ آب‌پز و سبک‌تر از لحظهٔ ورود بیرون
    می‌آیید.
  tip: >-
    برای عصرهای جمعه تا یکشنبه از پیش رزرو کنید؛ صبح‌های روزهای کاری آرام است. هزینه برای هر اتاق و هر
    ساعت حساب می‌شود، نه برای هر نفر — بسته به گرمابه و اندازهٔ اتاق حدود ۵۰ تا ۱۵۰ لاری — پس بپرسید چه
    چیزهایی در قیمت هست: حوله، دمپایی و کیسه‌کشیِ *مکیسه* اغلب جداگانه حساب می‌شوند. درست پس از ناهاری
    سنگین نیایید و هر بار ۱۵ تا ۲۰ دقیقه در آب بمانید و میانش استراحت کنید، و کل نشست را به حدود یک ساعت
    محدود کنید؛ ماندن طولانی در آب داغ برای فشار خون سنگین است، پس اگر فشار خونتان جای نگرانی دارد، پیش‌تر
    از آن مطمئن شوید. در اتاق خصوصی پوشیدن مایو اختیاری است. پس از حمام، پیش از آنکه به جایی برانید، با
    فنجانی چای کمی بنشینید. خودپرداز و کافه در میدان گورگاسالی هست.
  route: >-
    آبانوتوبانی کمتر از ۲ کیلومتر با میدان آزادی فاصله دارد — در ترافیک شهری ده تا پانزده دقیقه با خودرو،
    از سرازیری به‌سوی خیابان ساحلی کرانهٔ راست یا از کرانهٔ چپ از روی پل متخی. رسیدن تا اینجا آسان است؛
    چند صد متر آخر نه. کوچه‌های اطراف گنبدها باریک و یک‌طرفه‌اند و جلوی در هیچ گرمابه‌ای جای توقف نیست.
    از پارکینگ پولی میدان گورگاسالی استفاده کنید که نزدیک‌ترین و البته کوچک‌ترین است، یا از پارکینگ پارک
    ریکه، و از روی پل متخی در حدود ده دقیقه پیاده بیایید. سراسر راه آسفالت است: خودروی اقتصادی ایده‌آل
    است، و هرچه کوچک‌تر باشد، پارک کردنش آسان‌تر.
he:
  name: אבאנוטובני ומרחצאות הגופרית
  short: >-
    כיפות לבנים שנושמות גופרית למרגלות נאריקלה: המעיינות החמים שנתנו לטביליסי את שמה ממלאים עד היום בריכות
    אבן בחדרים פרטיים, לפי שעה.
  body: >-
    **טביליסי קרויה על שם המים החמים שעדיין עולים מתחת לכיפות הלבנים האלה.** *טבילי* פירושו בגאורגית "חם",
    ואת סיפור הייסוד מוטב לספר כפי שהוא – כאגדה: במאה החמישית הפיל הבז של המלך וחטנג גורגסלי פסיון, העוף
    נפל לתוך מעיין חם והתבשל בו, והמלך ציווה לכרות את היער ולהקים עיר. את החלק היבש של הסיפור ההיסטוריה
    מייחסת לבנו דאצ'י, שהעביר לכאן את הבירה ממצחתה.


    המים היו כאן הרבה לפני המלכים. ברובע הזה חשפו ארכאולוגים בתי מרחץ מהמאות הראשונה והשנייה לספירה, עם
    בריכות פסיפס ורשת של צינורות חרס. במאה העשירית כתב הגאוגרף הערבי אבן חוקל שבעיר יש מרחצאות כמו אלה
    של טבריה, "שמימיהם רותחים בלי אש". עד המאה השלוש-עשרה מנתה טביליסי שישים וחמישה מהם.


    מהרחוב כמעט לא רואים דבר. בתי המרחץ שקועים באדמה, ומעליהם נותר רק שדה של כיפות לבנים נמוכות שפתחי
    האוורור שלהן נושפים לאוויר ריח של ביצים קשות; אחרי עשר דקות מפסיקים לשים לב אליו. בראש רחוב גרישאשווילי
    יושב בז מברונזה על הפסיון שלו, ובקצה הסמטה זוהרת חזית האריחים הכחולים של צ'רלי אבאנו, בסגנון פרסי.
    מאחורי הכיפות נפתח לגוותחבי, "ערוץ עצי התאנה", שבו עיבדו פעם בורסקאים עורות בנחל הגופרית, וכיום נופל
    בו מפל בין הצוקים.


    לכאן אף פעם לא באו רק כדי להתרחץ. משפחות בילו כאן ימים שלמים, אכלו ושרו, ולפי המסורת באו חמיות לעתיד
    לבחון את מראה הכלה.


    היום שוכרים חדר פרטי לפי שעה: בריכת אבן של מים מינרליים חמים, מקלחת, ספסל. לפחות פעם אחת הפקידו את
    עצמכם בידי ה*מקיסה* וכפפת השפשוף המחוספסת שלו. תצאו ורודים כמו סרטן מבושל, וקלים יותר משנכנסתם.
  tip: >-
    הזמינו מראש לערבים שבין שישי לראשון; בבקרים של ימי חול שקט. משלמים לפי חדר לשעה, לא לפי אדם – בערך
    50–150 לארי, תלוי בבית המרחץ ובגודל החדר – ולכן שאלו מה כלול: מגבות, נעלי בית והשפשוף אצל ה*מקיסה*
    כרוכים לעיתים קרובות בתוספת תשלום. אל תבואו ישר אחרי ארוחת צהריים כבדה, טבלו במים בפרקים של 15–20
    דקות עם הפסקות, והגבילו את כל הביקור לכשעה; שהייה ממושכת במים חמים מכבידה על לחץ הדם, כך שאם יש לכם
    בעיה כזו, בררו מראש. בחדר פרטי בגד ים אינו חובה. אחרי הרחצה שבו לכוס תה לפני שאתם נוהגים לאנשהו. כספומטים
    ובתי קפה יש בכיכר גורגסלי.
  route: >-
    אבאנוטובני נמצא פחות מ-2 ק"מ מכיכר החירות – עשר עד חמש-עשרה דקות נסיעה בתנועה העירונית, בירידה אל
    הכביש שלאורך הנהר בגדה הימנית או דרך גשר מטחי מהגדה השמאלית. הנסיעה עצמה קלה; מאות המטרים האחרונים
    – לא. הסמטאות סביב הכיפות צרות וחד-סטריות, ואין מקום לעצור ליד הדלת של אף בית מרחץ. השתמשו בחניון
    בתשלום בכיכר גורגסלי, הקרוב ביותר אבל גם הקטן ביותר, או בחניון של פארק ריקה, ומשם חצו ברגל את גשר
    מטחי, כעשר דקות הליכה. אספלט לאורך כל הדרך: רכב מקטגוריית אקונומי הוא אידיאלי, וככל שהוא קטן יותר,
    קל יותר למצוא לו חניה.
ar:
  name: أبانوتوباني وحمامات الكبريت
  short: >-
    قباب آجرية تتنفس الكبريت عند سفح ناريكالا: الينابيع الدافئة التي منحت تبليسي اسمها ما زالت تملأ أحواضاً
    حجرية في غرف خاصة تُستأجر بالساعة.
  body: >-
    **تستمد تبليسي اسمها من الماء الدافئ الذي ما زال ينبع من تحت هذه القباب الآجرية.** فكلمة *تبيلي* تعني
    بالجورجية «دافئ»، وخير ما تُروى به حكاية التأسيس أن تُروى على حقيقتها، أي أسطورةً: في القرن الخامس
    أسقط صقرُ الملك فاختانغ غورغاسالي طائرَ تدرّج، فهوى الطائر في نبع حار وسُلق فيه، فأمر الملك بقطع الغابة
    وإقامة مدينة. أما الجزء النثري من القصة فينسبه التاريخ إلى ابنه داتشي، الذي نقل العاصمة إلى هنا من
    متسخيتا.


    كان الماء هنا قبل الملوك بزمن طويل. فقد عثر علماء الآثار في هذا الحي على حمامات من القرنين الأول والثاني
    للميلاد، بأحواض من الفسيفساء وشبكة من الأنابيب الفخارية. وفي القرن العاشر كتب الجغرافي العربي ابن
    حوقل أن في المدينة حمامات كحمامات طبرية «يغلي ماؤها بلا نار». وبحلول القرن الثالث عشر كانت تبليسي
    تعدّ منها خمسة وستين حماماً.


    من الشارع لا يكاد يُرى شيء. فالحمامات غائرة في الأرض، ولا يبقى فوقها سوى حقل من القباب الآجرية المنخفضة
    تنفث فتحاتها في الهواء رائحة البيض المسلوق؛ وبعد عشر دقائق تكفّ عن الانتباه إليها. عند رأس شارع غريشاشفيلي
    يجثم صقر برونزي على طريدته من طيور التدرّج، وفي آخر الزقاق تتوهج واجهة «تشريلي أبانو» المكسوة بالقيشاني
    الأزرق على الطراز الفارسي. وخلف القباب ينفتح ليغفتاخيفي، «وادي أشجار التين»، حيث كان الدبّاغون يعالجون
    الجلود في جدول الكبريت، وحيث ينحدر اليوم شلال بين الجروف.


    لم يأتِ الناس إلى هنا للاغتسال فحسب. كانت العائلات تقضي فيها أياماً كاملة، تأكل وتغني، ويُروى أن الحموات
    المرتقبات كنّ يأتين ليتفحّصن جمال العروس.


    اليوم تستأجر غرفة خاصة بالساعة: حوض حجري من الماء المعدني الساخن، ودُشّ، ومقعد. استسلم ولو مرة واحدة
    ليدَي *المكيسي* وقفازه الخشن. ستخرج متورّداً كجراد نهر مسلوق، وأخفّ مما دخلت.
  tip: >-
    احجز مسبقاً لأمسيات الجمعة حتى الأحد؛ أما صباحات أيام العمل فهادئة. تدفع عن الغرفة بالساعة لا عن الشخص
    — نحو 50–150 لاري بحسب الحمام وحجم الغرفة — فاسأل عمّا يشمله السعر: المناشف والشباشب والتكييس على
    يد *المكيسي* كثيراً ما تُحسب على حدة. لا تأتِ مباشرة بعد غداء دسم، وابقَ في الماء فترات من 15 إلى
    20 دقيقة تتخللها استراحات، ولا تتجاوز بالجلسة كلها ساعة تقريباً؛ فالمكوث الطويل في الماء الساخن يرهق
    ضغط الدم، فإن كان ضغطك مصدر قلق فتحقّق من الأمر أولاً. ملابس السباحة اختيارية في الغرفة الخاصة. وبعد
    الحمام اجلس إلى كوب شاي قبل أن تقود إلى أي مكان. أجهزة الصراف الآلي والمقاهي في ساحة غورغاسالي.
  route: >-
    تبعد أبانوتوباني أقل من 2 كم عن ساحة الحرية — عشر إلى خمس عشرة دقيقة بالسيارة في زحمة المدينة، نزولاً
    إلى كورنيش الضفة اليمنى أو عبر جسر ميتيخي من الضفة اليسرى. القيادة إليها سهلة؛ أما المئات الأخيرة
    من الأمتار فلا. الأزقة حول القباب ضيقة وباتجاه واحد، ولا مكان للتوقف عند باب أي حمام. استخدم الموقف
    المدفوع في ساحة غورغاسالي، وهو الأقرب لكنه الأصغر أيضاً، أو موقف حديقة ريكي، ثم اعبر جسر ميتيخي سيراً
    في نحو عشر دقائق. الطريق مُعبّد على طوله: السيارة الاقتصادية مثالية، وكلما صغرت سهل ركنها.
