ka:
  name: აბანოთუბანი და გოგირდის აბანოები
  short: თბილისის დაბადების ადგილი — აგურის გუმბათებიანი გოგირდის აბანოები ძველი ქალაქის გულში.
  body: >-
    **თბილისს სახელი სწორედ აქედან აქვს** — „თბილი" წყლიდან, რომელიც აბანოთუბანში დღემდე მიწიდან 38–42
    გრადუსზე ამოდის. ლეგენდის მიხედვით, ვახტანგ გორგასალმა ნადირობისას აღმოაჩინა ცხელი წყარო და ქალაქის
    დაარსება სწორედ აქ გადაწყვიტა. ისტორიულად ეს კვარტალი ყოველთვის იყო თბილისის სოციალური ცენტრი: აქ
    ბანაობდნენ, საქმეს აწესრიგებდნენ, ქორწინებას თანხმდებოდნენ.


    აბანოები მიწაშია ჩაფლული — ზემოდან მხოლოდ დაბალი აგურის გუმბათები და საკვამურები ჩანს, რაც კვარტალს
    უცნაურ, თითქმის აღმოსავლურ სილუეტს აძლევს. თითოეულ შენობას თავისი ხასიათი აქვს:


    - **ორბელიანის (ჭრელი) აბანო** — ლურჯი მოზაიკური ფასადით, კვარტალის ყველაზე ცნობადი შენობა

    - **სულფურის და ბოჭორმის აბანოები** — უფრო მარტივი, ადგილობრივებით სავსე, გაცილებით იაფი

    - **ლეღვთახევის კანიონი** — ვიწრო ხეობა ჩანჩქერით, აბანოებიდან ხუთი წუთის სავალზე

    - **ჯუმა მეჩეთი და სომხური ტაძარი** — ერთ კვარტალში, თბილისური სიჭრელის ნიმუში


    პროცედურა მარტივია: ქირაობ ცალკე ნომერს საათობრივად (არა ბილეთს ერთ ადამიანზე), შიგნით არის ცხელი
    აუზი, სველი ოთახი და დასასვენებელი კუთხე. მეკისე — ტრადიციული მასაჟი ხეშეშა ხელთათმანით — ცალკე ჯდება
    და ნამდვილად ღირს ერთხელ გამოცდა.
  tip: >-
    ნომერი წინასწარ დაჯავშნე, განსაკუთრებით პარასკევ-კვირას საღამოს — უზმოდ არ წახვიდე, მაგრამ მძიმე სადილის
    შემდეგაც არ ღირს. პირსახოცი და ჩუსტები ჩვეულებრივ ადგილზე გაქირავებადია, საცურაო კოსტიუმი პირად ნომერში
    სავალდებულო არ არის. ორმოცდაათი წუთი სავსებით საკმარისია; მეტი ხნის ჯდომა გოგირდის ორთქლში წნევაზე
    მოქმედებს. გამოსვლის შემდეგ დაგეგმე ნელი საათი — მართვის სურვილი მაშინვე არ დაგრჩება. ბანკომატი და
    კაფეები გორგასლის მოედანზეა.
  route: >-
    აბანოთუბანი ძველი თბილისის ქვედა ნაწილშია, გორგასლის მოედნის უკან. მეტეხის ხიდიდან ან ბარათაშვილის
    აღმართიდან ორივე მიმართულებით ნიშნებია. ქუჩები ვიწროა და ერთმიმართულებიანი — ნავიგატორს მიჰყევი და
    არ ეცადო ბოლომდე მიდგომას აბანოს კართან. საუკეთესო ვარიანტია ფასიანი პარკინგი გორგასლის მოედანზე ან
    რიყის პარკის მიწისქვეშა სადგომი, საიდანაც ხიდის გავლით ხუთი წუთია ფეხით. გზა ასფალტია, ნებისმიერი
    კლასის მანქანა გამოდგება; საღამოს ადგილის პოვნა უფრო რთულია, ვიდრე თავად მისვლა.
en:
  name: Abanotubani and the Sulphur Baths
  short: The birthplace of Tbilisi — brick-domed sulphur bathhouses in the heart of the Old Town.
  body: >-
    **Tbilisi is named after this water.** *Tbili* means warm, and the springs of Abanotubani still surface
    at 38–42°C. Legend has it that King Vakhtang Gorgasali found the hot springs while hunting and decided
    to move his capital here. Historically the quarter was the city's social engine: people bathed, argued
    business and arranged marriages in the same steamy rooms.


    The bathhouses are sunk into the ground, so from street level you only see low brick domes and chimneys
    — an oddly oriental skyline in the middle of a European-looking city. Each building has its own character:


    - **Orbeliani (Chreli) Baths**, with a blue-tiled Persian facade, the most photographed building in
    the quarter

    - **Sulphur and Bochorma baths**, plainer, cheaper and full of locals rather than tour groups

    - **Leghvtakhevi canyon**, a narrow gorge with a waterfall five minutes' walk from the domes

    - **The Juma Mosque and the Armenian cathedral**, one block apart — Tbilisi's mixed inheritance in
    miniature


    The procedure is simple: you rent a private room by the hour rather than buying a per-person ticket.
    Inside there is a hot pool, a wet room and a place to cool down. A *mekise* scrub with a rough mitt
    costs extra and is worth trying once, if only to understand what locals mean by it.
  tip: >-
    Book a room ahead, especially Friday to Sunday evening. Do not go on a completely empty stomach, but
    do not go straight after a heavy meal either. Towels and slippers are usually rented on site, and
    swimwear is optional in a private room. Forty to fifty minutes is plenty — longer in sulphur steam
    affects blood pressure. Plan a slow hour afterwards, because you will not feel like driving immediately.
    ATMs and cafés are on Gorgasali Square.
  route: >-
    Abanotubani sits in the lower Old Town, just behind Gorgasali Square, signposted from both the Metekhi
    bridge and the Baratashvili ramp. The lanes are narrow and one-way, so follow the navigation and do
    not try to drive up to the bathhouse door. The realistic choices are the paid lot on Gorgasali Square
    or the underground car park at Rike Park, five minutes away across the bridge. Everything is asphalt
    and any car category works. Finding a space in the evening is harder than getting here in the first
    place.
ru:
  name: Абанотубани и серные бани
  short: Место, где родился Тбилиси, — кирпичные купола серных бань в сердце Старого города.
  body: >-
    **Тбилиси назван в честь этой воды.** «Тбили» значит тёплый, и источники Абанотубани по-прежнему выходят
    на поверхность при 38–42 °C. По легенде царь Вахтанг Горгасали наткнулся на горячий ключ во время
    охоты и решил перенести сюда столицу. Исторически квартал был социальным центром города: здесь мылись,
    решали дела и договаривались о свадьбах.


    Бани утоплены в землю, поэтому с улицы видны только низкие кирпичные купола и трубы — неожиданно восточный
    силуэт посреди вполне европейского города. У каждого здания свой характер:


    - **Орбелиановская (Пёстрая) баня** с синим изразцовым фасадом — самое фотографируемое здание квартала

    - **Серная и Бочормская бани** — проще, дешевле и полны местных, а не туристических групп

    - **Каньон Легвтахеви** — узкое ущелье с водопадом в пяти минутах от куполов

    - **Мечеть Джума и армянский собор** в одном квартале — тбилисская пестрота в миниатюре


    Схема простая: вы снимаете отдельный номер на час, а не покупаете билет на человека. Внутри горячий
    бассейн, влажная комната и уголок, где можно остыть. Растирание у *мекисе* жёсткой рукавицей оплачивается
    отдельно и стоит попробовать хотя бы раз.
  tip: >-
    Номер бронируйте заранее, особенно с пятницы по воскресенье вечером. Не идите совсем натощак, но и
    сразу после плотного обеда тоже не стоит. Полотенца и тапочки обычно берут на месте, купальник в отдельном
    номере не обязателен. Сорока-пятидесяти минут достаточно: дольше сидеть в серном пару тяжело для давления.
    После бани заложите неспешный час — садиться за руль сразу не захочется. Банкоматы и кафе — на площади
    Горгасали.
  route: >-
    Абанотубани находится в нижней части Старого города, сразу за площадью Горгасали, указатели есть и
    с Метехского моста, и со спуска Бараташвили. Улицы узкие и односторонние, поэтому следуйте навигатору
    и не пытайтесь подъехать к самым дверям бани. Реальные варианты — платная стоянка на площади Горгасали
    или подземный паркинг у парка Рике, откуда пять минут пешком через мост. Асфальт везде, подойдёт машина
    любого класса. Найти место вечером сложнее, чем добраться сюда.
fa:
  name: آبانوتوبانی و حمام‌های گوگردی
  short: زادگاه تفلیس — گرمابه‌های گوگردی با گنبدهای آجری در قلب شهر قدیم.
  body: >-
    **نام تفلیس از همین آب گرفته شده است.** «تبیلی» یعنی گرم، و چشمه‌های آبانوتوبانی هنوز با دمای 38–42°C
    به سطح می‌رسند. روایت مشهور می‌گوید شاه واختانگ گورگاسالی هنگام شکار به این چشمه‌های گرم برخورد و
    تصمیم گرفت پایتخت خود را به اینجا بیاورد. این محله در طول تاریخ موتور اجتماعی شهر بود: مردم در همان
    اتاق‌های پربخار شست‌وشو می‌کردند، بر سر معامله چانه می‌زدند و ازدواج‌ها را سامان می‌دادند.


    گرمابه‌ها در دل زمین فرو رفته‌اند، بنابراین از سطح خیابان فقط گنبدهای آجری کوتاه و دودکش‌ها دیده می‌شود
    — خط آسمانی به‌طرزی غریب شرقی در میانهٔ شهری با ظاهر اروپایی. هر بنا شخصیت خود را دارد:


    - **حمام اوربلیانی (چرلی)** با نمای کاشی آبی به سبک ایرانی، پرعکس‌ترین ساختمان محله

    - **حمام‌های گوگردی و بوچورما**، ساده‌تر، ارزان‌تر و پر از اهالی محل به‌جای گروه‌های تور

    - **درهٔ لغوتاخوی**، تنگه‌ای باریک با آبشاری در پنج دقیقه پیادهٔ گنبدها

    - **مسجد جمعه و کلیسای جامع ارمنی**، یک بلوک آن‌سوتر — میراث درهم‌آمیختهٔ تفلیس در مقیاسی کوچک


    روال کار ساده است: به‌جای بلیت نفری، اتاقی خصوصی را ساعتی اجاره می‌کنید. داخل آن یک حوض داغ، یک فضای
    شست‌وشو و جایی برای خنک شدن هست. کیسه‌کشی با دستکش زبر («مکیسه») هزینهٔ جداگانه دارد و دست‌کم یک بار
    ارزش امتحان دارد، اگر فقط برای این باشد که بفهمید اهالی از آن چه می‌گویند.
  tip: >-
    اتاق را از پیش رزرو کنید، به‌ویژه عصرهای جمعه تا یکشنبه. با معدهٔ کاملاً خالی نروید، اما بلافاصله
    پس از غذای سنگین هم نروید. حوله و دمپایی معمولاً در محل کرایه می‌شود و در اتاق خصوصی لباس شنا اختیاری
    است. چهل تا پنجاه دقیقه کافی است — ماندن طولانی‌تر در بخار گوگرد بر فشار خون اثر می‌گذارد. پس از آن
    یک ساعت بی‌عجله در نظر بگیرید، چون بلافاصله حال رانندگی نخواهید داشت. خودپرداز و کافه در میدان گورگاسالی
    هست.
  route: >-
    آبانوتوبانی در بخش پایینی شهر قدیم و درست پشت میدان گورگاسالی قرار دارد و از پل متخی و سربالایی باراتاشویلی
    تابلو خورده است. کوچه‌ها باریک و یک‌طرفه‌اند، پس مسیریاب را دنبال کنید و نکوشید تا در گرمابه رانندگی
    کنید. گزینه‌های واقع‌بینانه پارکینگ پولی میدان گورگاسالی است یا پارکینگ زیرزمینی پارک ریکه، پنج دقیقه
    آن‌سوی پل. همه‌جا آسفالت است و هر ردهٔ خودرویی کار می‌کند. پیدا کردن جای پارک در عصر از رسیدن به اینجا
    دشوارتر است.
he:
  name: אבאנוטובני ומרחצאות הגופרית
  short: מקום הולדתה של טביליסי — בתי מרחץ גופרית עם כיפות לבנים בלב העיר העתיקה.
  body: >-
    **טביליסי נקראת על שם המים האלה.** "טבילי" פירושו חם, והמעיינות של אבאנוטובני עולים עד היום בטמפרטורה
    של 38–42°C. האגדה מספרת שהמלך ואחטנג גורגסלי גילה את המעיינות החמים בזמן ציד והחליט להעביר לכאן את
    בירתו. מבחינה היסטורית היה הרובע המנוע החברתי של העיר: אנשים התרחצו, ניהלו משא ומתן עסקי וסידרו שידוכים
    באותם חדרים מהבילים עצמם.


    בתי המרחץ שקועים באדמה, ולכן מגובה הרחוב רואים רק כיפות לבנים נמוכות וארובות — קו רקיע מזרחי באופן
    מפתיע בלב עיר שנראית אירופית. לכל מבנה אופי משלו:


    - **מרחצאות אורבליאני (צ'רלי)**, עם חזית פרסית מצופה אריחים כחולים, המבנה המצולם ביותר ברובע

    - **מרחצאות הגופרית ובוצ'ורמה**, פשוטים וזולים יותר ומלאים במקומיים ולא בקבוצות תיירים

    - **ערוץ לגוותאחווי**, קניון צר עם מפל במרחק חמש דקות הליכה מן הכיפות

    - **מסגד ג'ומעה והקתדרלה הארמנית**, במרחק רחוב זה מזה — המורשת המעורבת של טביליסי בזעיר אנפין


    הנוהל פשוט: שוכרים חדר פרטי לפי שעה במקום לקנות כרטיס לאדם. בפנים יש בריכה חמה, חדר רחצה ופינה להתקררות.
    קרצוף "מקיסה" בכפפה מחוספסת עולה בנפרד ושווה ניסיון אחד, ולו רק כדי להבין למה המקומיים מתכוונים.
  tip: >-
    הזמינו חדר מראש, במיוחד בערבי שישי עד ראשון. אל תגיעו בבטן ריקה לגמרי, אבל גם לא מיד אחרי ארוחה כבדה.
    מגבות וכפכפים נשכרים בדרך כלל במקום, ובחדר פרטי בגד ים אינו חובה. ארבעים עד חמישים דקות הן די והותר
    — שהייה ארוכה יותר באדי גופרית משפיעה על לחץ הדם. תכננו שעה נינוחה אחר כך, כי לא יתחשק לכם לנהוג מיד.
    כספומטים ובתי קפה נמצאים בכיכר גורגסלי.
  route: >-
    אבאנוטובני שוכן בעיר העתיקה התחתונה, ממש מאחורי כיכר גורגסלי, ומתומרר משני הכיוונים — מגשר מטחי ומעליית
    ברטשווילי. הסמטאות צרות וחד-סטריות, לכן עקבו אחרי הניווט ואל תנסו להגיע ברכב עד דלת המרחץ. האפשרויות
    המעשיות הן החניון בתשלום בכיכר גורגסלי או החניון התת-קרקעי בפארק ריקה, חמש דקות משם מעבר לגשר. הכול
    אספלט וכל קטגוריית רכב מתאימה. למצוא מקום בערב קשה יותר מלהגיע לכאן מלכתחילה.
ar:
  name: أبانوتوباني وحمامات الكبريت
  short: مهد تبليسي — حمامات كبريتية بقباب من الآجر في قلب المدينة القديمة.
  body: >-
    **اسم تبليسي مأخوذ من هذا الماء.** فكلمة «تبيلي» تعني الدافئ، وما زالت ينابيع أبانوتوباني تخرج بحرارة
    38–42°C. تقول الرواية إن الملك فاختانغ غورغاسالي عثر على الينابيع الحارة أثناء الصيد فقرر نقل عاصمته
    إلى هنا. وكان هذا الحي تاريخياً المحرك الاجتماعي للمدينة: فيه كان الناس يستحمون ويتفاوضون على تجارتهم
    ويرتبون الزيجات في الغرف المشبعة بالبخار نفسها.


    الحمامات غائرة في الأرض، فلا يُرى من مستوى الشارع سوى قباب آجرية منخفضة ومداخن — أفق شرقي على نحو
    غريب في وسط مدينة أوروبية المظهر. ولكل بناء طابعه:


    - **حمام أوربلياني (تشريلي)**، بواجهته الفارسية المكسوة بالقيشاني الأزرق، وهو أكثر مباني الحي تصويراً

    - **حمامات الكبريت وبوتشورما**، أبسط وأرخص ويرتادها الأهالي أكثر من مجموعات السياح

    - **وادي ليغفتاخيفي**، أخدود ضيق فيه شلال على بعد خمس دقائق سيراً من القباب

    - **مسجد جمعة والكاتدرائية الأرمنية**، يفصل بينهما شارع واحد — إرث تبليسي المختلط في صورة مصغرة


    الإجراء بسيط: تستأجر غرفة خاصة بالساعة بدل شراء تذكرة للفرد. وفي الداخل حوض ساخن وغرفة للاغتسال وموضع
    للتبريد. أما التكييس بقفاز خشن («مكيسي») فيُحسب على حدة، ويستحق التجربة مرة على الأقل، ولو لتفهم ما
    يقصده الأهالي به.
  tip: >-
    احجز الغرفة مسبقاً، خاصة في أمسيات الجمعة إلى الأحد. لا تذهب على معدة فارغة تماماً، ولا بعد وجبة دسمة
    مباشرة. المناشف والنعال تُستأجر عادة في المكان، ولباس السباحة اختياري في الغرفة الخاصة. أربعون إلى
    خمسون دقيقة تكفي تماماً — والبقاء أطول في بخار الكبريت يؤثر في ضغط الدم. خصص ساعة هادئة بعد ذلك، فلن
    ترغب في القيادة فوراً. أجهزة الصراف والمقاهي في ساحة غورغاسالي.
  route: >-
    يقع أبانوتوباني في الجزء المنخفض من المدينة القديمة، خلف ساحة غورغاسالي مباشرة، وعليه لافتات من جسر
    ميتيخي ومن منحدر باراتاشفيلي. الأزقة ضيقة وباتجاه واحد، فاتبع الملاحة ولا تحاول القيادة حتى باب الحمام.
    والخياران الواقعيان هما الموقف المدفوع في ساحة غورغاسالي أو الموقف تحت الأرض في حديقة ريكي، على بعد
    خمس دقائق عبر الجسر. الطريق كله معبّد وأي فئة سيارة تفي بالغرض. والعثور على مكان في المساء أصعب من
    الوصول إلى هنا أصلاً.
