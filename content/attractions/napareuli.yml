ka:
  name: ნაფარეული
  short: >-
    ალაზნის მარცხენა ნაპირზე მდებარე სოფელი, საიდანაც სახელწოდების ღვინო მოდის და სადაც ქვევრს ჯერ კიდევ
    ხელით აკეთებენ.
  body: >-
    **ნაფარეული იმ იშვიათ სოფელთაგანია, სადაც ღვინის დამზადების მთელი ჯაჭვი ერთ ადგილას ჩანს** — ვაზიდან
    ქვევრამდე და ქვევრიდან ჭიქამდე. ის თელავიდან ჩრდილოეთით ოციოდე კილომეტრში, ალაზნის მარცხენა ნაპირზეა,
    კავკასიონის კალთის ძირში.


    სოფლის სახელი ღვინის დასახელებაშიც შევიდა: „ნაფარეული" კონტროლირებადი ადგილწარმოშობის ორ ღვინოს აღნიშნავს
    — მშრალ წითელს საფერავისგან და მშრალ თეთრს რქაწითელისგან. ნიადაგი აქ ხრეშიანი და კარგად დრენირებულია,
    ჰაერი კი მთიდან ჩამომავალი და გრილი; სწორედ ეს განსხვავებაა, რაც ნაფარეულის ღვინოს ვაკის ღვინოებისგან
    განასხვავებს.


    ვიზიტორისთვის მთავარი ორი რამაა:


    - **ქვევრის მუზეუმი** — მიწაში ჩადგმული ქვევრების ჭრილები, ხელსაწყოები და ახსნა, თუ როგორ იძერწება,
    იწვება და ცვილით ილესება თიხის ჭურჭელი, რომელშიც ღვინო ექვსი ათასი წელია მწიფდება


    - **მოქმედი მარნები** — სადაც დაგემოვნება ხდება იქვე, დახურული ქვევრების გვერდით, და არა დარბაზში


    ქვევრში ღვინის დაყენების ქართული მეთოდი 2013 წელს იუნესკოს არამატერიალური კულტურული მემკვიდრეობის
    სიაში შევიდა. ნაფარეულში ეს არ არის მუზეუმის ექსპონატი — მიწაში ჩამარხული ქვევრები ბევრ კერძო ეზოშიც
    დგას და ოქტომბერში მთელი სოფელი რთველზეა.


    სექტემბრის ბოლოს და ოქტომბერში აქ ჩამოსვლა სხვა გამოცდილებაა: ტრაქტორები ყურძნით, გახსნილი ჭიშკრები,
    ჰაერში ფერმენტაციის სუნი.
  tip: >-
    ორი საათი ერთი მარნისა და მუზეუმისთვის საკმარისია. დაგემოვნება უმეტეს ადგილას წინასწარ ჯავშანს მოითხოვს,
    განსაკუთრებით რთველის სეზონზე — უბრალოდ მისვლა ხშირად არ გამოდის. მძღოლი წინასწარ განსაზღვრე; კახური
    სტუმართმოყვარეობა უარს ძნელად იღებს. ქვევრის ღვინო უფრო მკვახე და ტანინიანია, ვიდრე ევროპული თეთრი
    — ეს ხარვეზი არ არის, ასეთია სტილი. ტუალეტი მარნებშია, კაფე თელავსა და ყვარელში.
  route: >-
    თბილისიდან ორი გზაა: გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ ჩრდილოეთით ალაზნის გასწვრივ კიდევ
    20 კმ; ან ბარით გურჯაანის გავლით, რაც ოციოდე კილომეტრით გრძელია. სულ 115 კმ, დაახლოებით ორი საათი
    და ათი წუთი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. საწვავი თელავში აიღე. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია მთელი წლის განმავლობაში.
en:
  name: Napareuli
  short: >-
    A village on the left bank of the Alazani that gave its name to an appellation and where qvevri are
    still made by hand.
  body: >-
    **Napareuli is one of the few villages where the whole chain of Georgian winemaking is visible in
    one place** — vine to qvevri, qvevri to glass. It lies about twenty kilometres north of Telavi on
    the left bank of the Alazani, right under the Caucasus foothills.


    The village name became an appellation. Napareuli denotes two controlled-origin wines: a dry red from
    Saperavi and a dry white from Rkatsiteli. The soils here are gravelly and free-draining, and cold
    air slides down off the mountains at night; that combination is what separates Napareuli fruit from
    the softer wines grown out on the plain.


    Two things draw visitors:


    - The **qvevri museum**, where cutaway sections show buried jars in place, alongside the tools and
    an explanation of how the clay vessels are coiled, fired and lined with beeswax — the same technology
    that has held wine here for six thousand years


    - **Working cellars**, where tastings happen beside sealed qvevri in the ground rather than in a reception
    hall


    The Georgian qvevri method was inscribed on the UNESCO list of intangible cultural heritage in 2013.
    In Napareuli this is not a museum exhibit: buried qvevri sit in ordinary private courtyards, and in
    October the whole village is at the harvest.


    Late September and October are a different visit altogether. Tractors come down the lanes loaded with
    grapes, gates stand open, and the smell of fermentation is in the air from one end of the village
    to the other. It is also the hardest time to get anyone's attention, because everyone is working.


    The vineyards themselves reward a slow look. Rows here tend to run down towards the river rather than
    along the contour, and the older blocks are planted at wide spacing, a legacy of ploughing with oxen
    rather than tractors.
  tip: >-
    Two hours covers one cellar and the museum. Most places want a booking, especially during harvest,
    and simply turning up often does not work. Decide who is driving before you arrive; Kakhetian hospitality
    does not take refusal easily and pours are generous. Qvevri whites are tannic and amber rather than
    crisp and pale — that is the style, not a fault, so taste them on their own terms. Toilets are at
    the cellars; cafes are in Telavi and Kvareli.
  route: >-
    There are two routes from Tbilisi: over the Gombori Pass to Telavi (95 km) and then twenty kilometres
    north along the Alazani, or the longer plain road through Gurjaani, which adds about twenty kilometres.
    Total 115 km, roughly two hours ten. The road is asphalt throughout and in good condition, narrowing
    to a village lane at the end. Fuel is available in Telavi. An economy car is entirely sufficient all
    year round.
ru:
  name: Напареули
  short: Село на левом берегу Алазани, давшее имя апелласьону, где квеври до сих пор лепят вручную.
  body: >-
    **Напареули — одно из немногих сёл, где вся цепочка грузинского виноделия видна в одном месте:** от
    лозы к квеври и от квеври к бокалу. Оно лежит километрах в двадцати севернее Телави, на левом берегу
    Алазани, прямо под предгорьями Кавказа.


    Название села стало названием апелласьона. Напареули обозначает два вина контролируемого происхождения:
    сухое красное из саперави и сухое белое из ркацители. Почвы здесь галечные и хорошо дренированные,
    а ночью с гор сходит холодный воздух; именно это сочетание отличает напареульский виноград от более
    мягких вин равнины.


    Приезжают сюда ради двух вещей:


    - **Музей квеври**, где разрезы показывают закопанные сосуды на месте, вместе с инструментами и объяснением,
    как глиняный кувшин лепят жгутами, обжигают и покрывают изнутри воском — той же технологией, что держит
    здешнее вино шесть тысяч лет


    - **Действующие марани**, где дегустация идёт рядом с запечатанными квеври в земле, а не в приёмном
    зале


    Грузинский метод квеври внесён в список нематериального наследия ЮНЕСКО в 2013 году. В Напареули это
    не музейный экспонат: закопанные квеври стоят в обычных частных дворах, а в октябре на сборе урожая
    всё село.


    Конец сентября и октябрь — совсем другая поездка. По улицам идут тракторы с виноградом, ворота открыты,
    запах брожения стоит от края до края села. Это же и самое трудное время, чтобы добиться чьего-то внимания:
    работают все.
  tip: >-
    Двух часов хватает на один марани и музей. Почти везде просят бронировать заранее, особенно в сезон
    урожая, и приехать наудачу часто не выходит. Решите, кто за рулём, ещё до приезда: кахетинское гостеприимство
    плохо принимает отказ, а наливают щедро. Белое из квеври — танинное и янтарное, а не свежее и бледное;
    это стиль, а не изъян. Туалеты есть при марани, кафе — в Телави и Кварели.
  route: >-
    Из Тбилиси два пути: через Гомборский перевал до Телави (95 км) и дальше двадцать километров на север
    вдоль Алазани, либо равнинной дорогой через Гурджаани, что длиннее километров на двадцать. Всего 115
    км, примерно два часа десять минут. Асфальт на всём протяжении и в хорошем состоянии, в конце переходит
    в сельскую улицу. Заправка есть в Телави. Машины эконом-класса вполне достаточно круглый год.
fa:
  name: ناپارئولی
  short: روستایی بر کرانهٔ چپ آلازانی که نامش بر یک منطقهٔ شراب نشسته و هنوز در آن کوره‌های شراب را با
    دست می‌سازند.
  body: >-
    **ناپارئولی از معدود روستاهایی است که تمام زنجیرهٔ شراب‌سازی گرجی را در یک جا می‌توان دید:** از تاک
    تا کوره و از کوره تا جام. حدود بیست کیلومتری شمال تلاوی بر کرانهٔ چپ رود آلازانی و درست زیر دامنه‌های
    قفقاز قرار دارد.


    نام روستا به نام یک منطقهٔ شراب بدل شد. ناپارئولی نشانگر دو شراب با مبدأ کنترل‌شده است: قرمز خشک از
    انگور ساپراوی و سفید خشک از رکاتسیتلی. خاک اینجا سنگ‌ریزه‌ای و زهکش‌دار است و شب‌ها هوای سرد از کوه
    پایین می‌آید؛ همین ترکیب است که میوهٔ ناپارئولی را از شراب‌های نرم‌تر دشت جدا می‌کند.


    دو چیز بازدیدکننده را به اینجا می‌کشاند:


    - **موزهٔ کوره**، که در آن برش‌های نمایشی کوزه‌های خاک‌شده را در جای خود نشان می‌دهد، همراه با ابزارها
    و شرح اینکه چگونه ظرف گلی را فتیله‌فتیله می‌سازند، می‌پزند و درونش را با موم می‌اندایند؛ همان فناوری
    که شش هزار سال است شراب اینجا را نگه داشته


    - **مارانی‌های فعال**، که در آنها نوشیدن آزمایشی کنار کوزه‌های مهروموم‌شدهٔ زیر خاک انجام می‌شود نه
    در تالار پذیرایی


    روش گرجی کوره در 2013 در فهرست میراث ناملموس یونسکو ثبت شد. در ناپارئولی این یک شیء موزه‌ای نیست:
    کوزه‌های خاک‌شده در حیاط‌های خصوصی معمولی هستند و در مهرماه تمام روستا سرِ برداشت است.


    اواخر شهریور و مهر تجربه‌ای یکسره متفاوت است. تراکتورها پر از انگور در کوچه‌ها می‌آیند، دروازه‌ها
    باز است و بوی تخمیر از این سر روستا تا آن سر پیچیده. همین‌ها سخت‌ترین زمان برای جلب توجه کسی هم هست،
    چون همه در کارند.
  tip: >-
    دو ساعت برای یک مارانی و موزه کافی است. بیشتر جاها رزرو قبلی می‌خواهند، به‌ویژه در فصل برداشت، و سرزده
    رفتن اغلب جواب نمی‌دهد. پیش از رسیدن تکلیف راننده را روشن کنید؛ مهمان‌نوازی کاختی «نه» را به‌سختی
    می‌پذیرد و پیمانه‌ها سخاوتمندانه است. سفید کوره‌ای تلخ‌مزه و کهربایی است نه شفاف و سبک؛ این سبک است
    نه عیب. سرویس بهداشتی در مارانی‌هاست و کافه در تلاوی و کوارلی.
  route: >-
    از تفلیس دو راه هست: از گردنهٔ گومبوری تا تلاوی (95 کیلومتر) و سپس بیست کیلومتر شمال در کنار آلازانی،
    یا راه دشت از گورجانی که حدود بیست کیلومتر بلندتر است. جمعاً 115 کیلومتر و نزدیک دو ساعت و ده دقیقه.
    جاده تا انتها آسفالت و در وضعیت خوبی است و در پایان به کوچهٔ روستایی می‌رسد. سوخت در تلاوی هست. خودروی
    اقتصادی در تمام سال کاملاً کافی است.
he:
  name: נפאראולי
  short: כפר על הגדה השמאלית של האלאזני שנתן שמו לאזור יין, ובו עדיין מייצרים קווברי בעבודת יד.
  body: >-
    **נפאראולי הוא אחד הכפרים הבודדים שבהם כל שרשרת ייצור היין הגאורגי נראית במקום אחד:** מגפן לקווברי
    ומקווברי לכוס. הוא שוכן כעשרים קילומטרים מצפון לטלאווי, על הגדה השמאלית של האלאזני, ממש למרגלות הקווקז.


    שם הכפר הפך לשם אזור יין. נפאראולי מציין שני יינות מקור מבוקר: אדום יבש מזן ספראווי ולבן יבש מרקאציטלי.
    הקרקע כאן חצצית ומנקזת היטב, ובלילה אוויר קר יורד מן ההרים; הצירוף הזה הוא שמבדיל את ענבי נפאראולי
    מן היינות הרכים יותר של המישור.


    שני דברים מושכים לכאן מבקרים:


    - **מוזיאון הקווברי**, שבו חתכים מציגים את הכדים הטמונים במקומם, לצד הכלים והסבר כיצד מגלגלים את כלי
    החרס, שורפים אותו ומצפים את פנימו בשעווה — אותה טכנולוגיה שמחזיקה כאן יין שישת אלפים שנה


    - **מרתפים פעילים**, שבהם הטעימה נערכת ליד קווברי אטומים באדמה ולא באולם קבלה


    שיטת הקווברי הגאורגית נרשמה ב-2013 ברשימת המורשת הבלתי מוחשית של אונסק"ו. בנפאראולי זו אינה תצוגה
    מוזיאלית: קווברי טמונים עומדים בחצרות פרטיות רגילות, ובאוקטובר כל הכפר בבציר.


    סוף ספטמבר ואוקטובר הם ביקור אחר לגמרי. טרקטורים עמוסי ענבים יורדים בסמטאות, שערים פתוחים, וריח התסיסה
    עומד מקצה הכפר ועד קצהו. זהו גם הזמן הקשה ביותר לקבל תשומת לב, כי כולם עובדים.
  tip: >-
    שעתיים מכסות מרתף אחד ואת המוזיאון. רוב המקומות מבקשים הזמנה מראש, במיוחד בעונת הבציר, והגעה ספונטנית
    לרוב אינה עובדת. החליטו מי נוהג עוד לפני שאתם מגיעים; האירוח הקחתי מתקשה לקבל סירוב והמזיגות נדיבות.
    הלבן מקווברי טאנימי וענברי ולא רענן ובהיר — זה הסגנון ולא פגם. שירותים יש במרתפים, בתי קפה בטלאווי
    ובקוורלי.
  route: >-
    מטביליסי יש שתי דרכים: מעל מעבר גומבורי לטלאווי (95 ק״מ) ואז עשרים קילומטרים צפונה לאורך האלאזני,
    או דרך המישור דרך גורג'אני שארוכה בכעשרים קילומטרים. בסך הכול 115 ק״מ, כשעתיים ועשר דקות. הכביש סלול
    לכל אורכו ובמצב טוב, ובסופו הופך לרחוב כפרי. דלק יש בטלאווי. רכב חסכוני מספיק לחלוטין בכל ימות השנה.
ar:
  name: نابارِئولي
  short: قرية على الضفة اليسرى لألازاني أعطت اسمها لتسمية خمر، وما زالت تُصنع فيها القلال باليد.
  body: >-
    **نابارِئولي من القرى القليلة التي تُرى فيها سلسلة صناعة الخمر الجورجية كاملة في مكان واحد:** من الكرمة
    إلى القُلّة ومن القُلّة إلى الكأس. تقع على نحو عشرين كيلومتراً شمال تيلافي على الضفة اليسرى لنهر ألازاني،
    تحت سفوح القوقاز مباشرة.


    وصار اسم القرية اسم تسمية. فنابارِئولي تدل على خمرين محددي المنشأ: أحمر جاف من عنب سابيرافي وأبيض
    جاف من رقاتسيتيلي. والتربة هنا حصوية جيدة الصرف، وينحدر هواء بارد من الجبال ليلاً؛ وهذا المزيج هو
    ما يفصل ثمر نابارِئولي عن خمور السهل الألين.


    ويجذب الزوار أمران:


    - **متحف القُلّة**، حيث تُظهر مقاطع مكشوفة الجرار المدفونة في مواضعها، إلى جانب الأدوات وشرح لكيفية
    تشكيل الإناء الطيني بالفتائل وشيّه وطلاء داخله بشمع النحل — وهي التقنية نفسها التي حفظت الخمر هنا
    ستة آلاف سنة


    - **موارٍ عاملة**، يجري فيها التذوق إلى جوار قلال مختومة في الأرض لا في قاعة استقبال


    وقد أُدرجت طريقة القُلّة الجورجية على قائمة التراث غير المادي لليونسكو عام 2013. وفي نابارِئولي ليست
    هذه معروضاً متحفياً: فالقلال المدفونة قائمة في أفنية خاصة عادية، وفي تشرين الأول تكون القرية كلها
    في الحصاد.


    وأواخر أيلول وتشرين الأول زيارة مختلفة تماماً. تنزل الجرارات في الأزقة محملة بالعنب، وتُفتح البوابات،
    وتفوح رائحة التخمر من طرف القرية إلى طرفها. وهو أيضاً أصعب وقت لنيل انتباه أحد، لأن الجميع منشغل بالعمل.
  tip: >-
    ساعتان تكفيان لماراني واحد وللمتحف. ومعظم الأماكن تطلب حجزاً مسبقاً، خصوصاً في موسم الحصاد، والحضور
    دون موعد لا ينجح غالباً. وحدد من سيقود قبل الوصول؛ فالضيافة الكاخيتية لا تقبل الاعتذار بسهولة والكميات
    سخية. والأبيض المخمّر في القلال تانيني كهرمانيّ لا منعش شاحب، وهذا أسلوب لا عيب. ودورات المياه في
    الموارٍ، والمقاهي في تيلافي وكفارلي.
  route: >-
    من تبليسي طريقان: عبر ممر غومبوري إلى تيلافي (95 كم) ثم عشرون كيلومتراً شمالاً بمحاذاة ألازاني، أو
    طريق السهل عبر غورجاني وهو أطول بنحو عشرين كيلومتراً. المجموع 115 كم ونحو ساعتين وعشر دقائق. الطريق
    معبّد على امتداده وبحالة جيدة، وينتهي إلى شارع قروي. والوقود متوفر في تيلافي. وسيارة اقتصادية تكفي
    تماماً طوال السنة.
