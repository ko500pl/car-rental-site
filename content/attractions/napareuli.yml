ka:
  name: ნაფარეული
  short: >-
    ღვინის სოფელი ლოპოტის ნაპირზე, კავკასიონის ძირას: საკუთარი ადგილწარმოშობის ღვინო, XVIII საუკუნის ციხე-გალავანი
    და 1883 წლის ღვინის ქარხნის ხსოვნა.
  body: >-
    **სოფლის სახელს ღვინოზე ადრე ცხვარი ახსოვს: „ნაფარეული“ ფარის ნადგომს ნიშნავს — ადგილს, სადაც ოდესღაც
    ცხვრის ფარა იდგა.**


    ეს სახელი პატიოსნად აქვს დამსახურებული. სოფელი ალაზნის ვაკეზე, მდინარე ლოპოტის მარცხენა ნაპირზე, თელავიდან
    ოციოდე კილომეტრში დგას. სოფელს ძველი ჭიაურის გზა კვეთდა, რომელიც შილდისა და ყვარლის გავლით დაღესტნის
    მთებისკენ ადიოდა: ამ გზით მიერეკებოდნენ ფარებს თუშები, კახელები და პანკისელები, და შუა საუკუნეებში
    ნაფარეულის მნიშვნელობასაც სწორედ ეს მოძრაობა ზრდიდა.


    ღვინო მოგვიანებით მოვიდა. XVIII საუკუნის 80-იან წლებში ერეკლე II-მ სოფელი გარსევან ჭავჭავაძეს უბოძა,
    XIX საუკუნის 20-იან წლებში კი მისმა მემკვიდრემ, ალექსანდრემ, მილიონი მანეთის სესხი აიღო და აქ ვენახები
    და ხეხილის ბაღები გააშენა. 1883 წელს ღვინის ქარხანა დაარსდა, რომელიც XX საუკუნეშიც განაგრძობდა მუშაობას.
    დღეს „ნაფარეული“ ადგილწარმოშობის დაცული დასახელებაა — მშრალი ღვინოები საფერავისა და რქაწითელისგან
    — და სოფლის ქუჩებს საოჯახო მარნები და ღვინის სახლები მიუყვება; ერთ-ერთს, „ტვინს ოლდ სელარს“, შორიდანვე
    იცნობთ უზარმაზარი მოხატული ქვევრით. სოფლის კარიერის მარმარილომ კი ლენინგრადისა და ვარშავის მეტრომდეც
    მიაღწია.


    ქვა უფრო მკაცრ ამბავს ჰყვება. XVIII საუკუნეში, ლეკიანობის გამუდმებული თავდასხმების ჟამს, აქ ციხე-გალავანი
    აიგო: გეგმით თითქმის კვადრატული, დაახლოებით ერთი ჰექტრის ფართობისა; ორიარუსიანი კედლის ქვედა იარუსი
    ყრუა, ზედაზე სათოფურებია, კუთხის კოშკებში კი მხოლოდ ეზოდან შედიოდნენ. 1812 წლის ზაფხულში, რუსეთის
    წინააღმდეგ კახეთის აჯანყებისას, ციხის მიდამოებში აჯანყებულებმა მეფის ჯარი დაამარცხეს. XIX საუკუნემ,
    რომელსაც ციხე აღარ სჭირდებოდა, ის ქვის კარიერად აქცია.


    სექტემბრის ბოლოს ან ოქტომბერში ჩამოდით, როცა რთველია და ეზოებში დაწურული ყურძნის სუნი დგას. ჩამონგრეულ
    გალავანთან ნაფარეულის ჭიქით დადექით — და სოფლის სამივე ცხოვრება, ფარა, ციხე და ვენახი, ერთ მზერაში
    ჩაეტევა.
  tip: >-
    ნაფარეული სოფელია და არა ბილეთიანი ძეგლი: აქ კარს ღვინის სახლები გიღებთ. უმეტესობა დაგემოვნებასა და
    სადილს წინასწარი ჯავშნით იღებს, რთველის დროს კი წინა დღით დარეკვა ცარიელ მისვლას აგარიდებთ. ვინ დაჯდება
    საჭესთან, პირველ ჭიქამდე გადაწყვიტეთ — კახური ჭიქა ხელგაშლილია. ქვევრის ქარვისფერი ღვინო განზრახ მკვრივი
    და ტანინიანია; ქვევრში ღვინის დაყენების ქართული მეთოდი 2013 წლიდან იუნესკოს არამატერიალური მემკვიდრეობის
    სიაშია. ლოპოტის ტბა სულ ორიოდე კილომეტრშია, ნეკრესის მონასტერი კი იმავე გზაზე, სამხრეთ-აღმოსავლეთით
    ოციოდე კილომეტრში. საწვავი და ბანკომატები თელავშია.
  route: >-
    ორი კარგი გზაა. მოკლე გომბორის უღელტეხილზე გადადის: თბილისიდან ს5-ით გამოდით, ვაზიანთან შ38-ზე გადაუხვიეთ
    და ქედის გადაღმა თელავში ჩადით (დაახლოებით 90 კმ). თელავიდან შ70-ით შაქრიანის მიმართულებით ალაზანი
    გადაკვეთეთ, შემდეგ ჩრდილოეთით შ43-ზე აუხვიეთ — ნაფარეული თელავიდან ოციოდე კილომეტრშია. სულ დაახლოებით
    115 კმ, ორი საათი და ათი წუთი, მთლიანად ასფალტი. ზამთარში თოვლმა შეიძლება უღელტეხილზე მოძრაობა შეანელოს
    ან შეაჩეროს — მაშინ ს5-ით, გურჯაანის გავლით იარეთ: გზა უფრო გრძელია, მაგრამ მთას გვერდს უვლის. ეკონომკლასის
    მანქანა მთელი წელი საკმარისია; საწვავი თელავში ჩაასხით.
en:
  name: Napareuli
  short: >-
    A wine village on the Lopota under the Caucasus, with its own appellation, an 18th-century fortified
    enclosure and a winery founded in 1883.
  body: >-
    **Napareuli remembers sheep before wine: the name means, roughly, the place where a flock once stood.**


    It earned the name honestly. The village lies on the Alazani plain, on the left bank of the Lopota,
    about twenty kilometres north of Telavi, and the old Chiauri road ran straight through it, climbing
    via Shilda and Kvareli into the mountains towards Dagestan. Tush, Kakhetian and Pankisi shepherds
    drove their flocks along it, and in the Middle Ages that traffic made Napareuli matter.


    Wine came later. In the 1780s Erekle II granted the village to Garsevan Chavchavadze; in the 1820s
    his heir Alexander borrowed a million roubles to plant vineyards and orchards here. A winery opened
    in 1883 and was still working in the 20th century. Today Napareuli is a protected appellation for
    dry wines from Saperavi and Rkatsiteli, and family wine houses line the lanes; one, Twins Old Cellar,
    announces itself with a giant painted qvevri. The village quarry, meanwhile, sent its marble as far
    as the Leningrad and Warsaw metros.


    Older stone tells a harder story. In the 18th century, as Dagestani raids grew relentless, a fortified
    enclosure went up here: almost square, about a hectare, its lower tier blind, its upper tier pierced
    with musket loopholes, its corner towers entered only from the yard. In summer 1812, during the Kakhetian
    uprising against Russian rule, rebels defeated the tsar's troops near these walls. The 19th century,
    having no further use for a fortress, quarried it for stone.


    Come in late September or October, when the harvest is on and the courtyards smell of crushed grapes.
    Stand by the broken wall with a glass of Napareuli, and all three of the village's lives, flock, fortress
    and vineyard, fit into a single view.
  tip: >-
    Napareuli is a village, not a ticketed sight: the wine houses are your way in. Most take bookings
    for tastings and meals, and at harvest time a call the day before saves a wasted trip. Decide who
    is driving before the first glass; Kakhetian pours are generous. Amber qvevri wines are grippy and
    tannic by design, and the qvevri method has been on UNESCO's intangible heritage list since 2013.
    Lopota Lake is about two kilometres away, and Nekresi Monastery some twenty kilometres south-east
    along the same road. Fuel and cash machines are in Telavi.
  route: >-
    There are two good ways. The shorter crosses the Gombori Pass: leave Tbilisi on the S5, turn onto
    the Sh38 near Vaziani and climb over the ridge down to Telavi (about 90 km). From Telavi take the
    Sh70 across the Alazani towards Shakriani, then turn north onto the Sh43; Napareuli is about twenty
    kilometres from Telavi. Total around 115 km, 2 hours 10 minutes, paved throughout. Winter snow can
    slow or stop traffic on the pass; then take the S5 via Gurjaani, longer but clear of the mountain.
    An economy car is fine all year; fill up in Telavi.
ru:
  name: Напареули
  short: >-
    Винное село на Лопоте под Кавказом, с собственным наименованием места происхождения, крепостной оградой
    XVIII века и винзаводом, основанным в 1883 году.
  body: >-
    **Напареули помнит овец раньше вина: название означает, приблизительно, «место, где стояла отара».**


    Имя оно заслужило честно. Село лежит на Алазанской равнине, на левом берегу Лопоты, примерно в двадцати
    километрах к северу от Телави, и старая Чиаурская дорога проходила прямо через него, поднимаясь через
    Шилду и Кварели в горы, в сторону Дагестана. Тушинские, кахетинские и панкисские пастухи гнали по
    ней свои отары, и в средние века это движение сделало Напареули значимым.


    Вино пришло позже. В 1780-х годах Ираклий II пожаловал село Гарсевану Чавчавадзе; в 1820-х его наследник
    Александр взял в долг миллион рублей, чтобы разбить здесь виноградники и сады. Винзавод открылся в
    1883 году и работал ещё в XX веке. Сегодня Напареули — защищённое наименование места происхождения
    для сухих вин из саперави и ркацители, а по улочкам тянутся семейные винодельческие дома; один из
    них, «Твинс Олд Селлар», заявляет о себе огромным расписным квеври. Сельская каменоломня, между тем,
    отправляла свой мрамор аж в метро Ленинграда и Варшавы.


    Камень постарше рассказывает историю суровее. В XVIII веке, когда дагестанские набеги стали беспрестанными,
    здесь возвели крепостную ограду: почти квадратную, около гектара, с глухим нижним ярусом, верхним
    — пробитым мушкетными бойницами, и угловыми башнями, в которые входили только со двора. Летом 1812
    года, во время Кахетинского восстания против русской власти, повстанцы разбили царские войска у этих
    стен. XIX век, не найдя крепости дальнейшего применения, разобрал её на камень.


    Приезжайте в конце сентября или в октябре, когда идёт сбор урожая и дворы пахнут давленым виноградом.
    Встаньте у разрушенной стены с бокалом напареули — и все три жизни села, отара, крепость и виноградник,
    уместятся в одном взгляде.
  tip: >-
    Напареули — село, а не музей с билетами: открыть его вам помогут винные дома. Большинство принимает
    заказы на дегустации и обеды, а в сезон урожая звонок накануне избавит от напрасной поездки. Решите,
    кто за рулём, до первого бокала; кахетинские порции щедры. Янтарные вина из квеври терпки и танинны
    — так и задумано, а грузинский способ виноделия в квеври с 2013 года входит в список нематериального
    наследия ЮНЕСКО. Озеро Лопота — примерно в двух километрах, а монастырь Некреси — около двадцати километров
    к юго-востоку по той же дороге. Заправка и банкоматы — в Телави.
  route: >-
    Есть два хороших пути. Короче тот, что через Гомборский перевал: выезжайте из Тбилиси по S5, сверните
    на Sh38 у Вазиани, переваливайте через хребет и спускайтесь в Телави (около 90 км). Из Телави по Sh70
    пересеките Алазани в сторону Шакриани, затем поверните на север по Sh43; Напареули — около двадцати
    километров от Телави. Всего около 115 км, 2 часа 10 минут, всё по асфальту. Зимний снег может замедлить
    или остановить движение на перевале; тогда поезжайте по S5 через Гурджаани, это длиннее, зато в обход
    гор. Машина эконом-класса подходит весь год; заправляйтесь в Телави.
fa:
  name: ناپارئولی
  short: >-
    روستایی شراب‌خیز بر رود لوپوتا زیر قفقاز، با نام خاستگاه ویژه‌ی خود، بارویی مستحکم از سده‌ی هجدهم
    و کارخانه‌ی شرابی که در سال ۱۸۸۳ بنیاد نهاده شد.
  body: >-
    **ناپارئولی گوسفند را پیش از شراب به یاد می‌آورد: نامش تقریباً به معنای جایی است که گله‌ای در آن ایستاده
    بود.**


    این نام را به‌حق به دست آورده است. روستا بر دشت آلازانی، بر کناره‌ی چپ لوپوتا، حدود بیست کیلومتر شمال
    تلاوی، جای گرفته، و راه کهن چیائوری درست از میان آن می‌گذشت و از راه شیلدا و کوارلی به کوه‌ها، به
    سوی داغستان، بالا می‌رفت. چوپانان توش، کاختی و پانکیسی گله‌های خود را از این راه می‌راندند، و در سده‌های
    میانه این آمدوشد به ناپارئولی اهمیت بخشید.


    شراب دیرتر آمد. در دهه‌ی ۱۷۸۰، ارکله دوم روستا را به گارسِوان چاوچاوادزه بخشید؛ در دهه‌ی ۱۸۲۰ وارثش،
    الکساندر، یک میلیون روبل وام گرفت تا در این‌جا تاکستان و باغ بکارد. کارخانه‌ی شرابی در سال ۱۸۸۳ گشوده
    شد و هنوز در سده‌ی بیستم کار می‌کرد. امروز ناپارئولی نامِ خاستگاهِ حفاظت‌شده‌ای برای شراب‌های خشک
    از انگورهای ساپراوی و رکاتسیتلی است، و شراب‌سازی‌های خانوادگی در کوچه‌ها ردیف شده‌اند؛ یکی از آن‌ها،
    توینز اولد سِلار، با یک کوِوری غول‌آسای نقاشی‌شده از دور خودنمایی می‌کند. معدن سنگ روستا نیز، در همین
    حال، مرمر خود را تا مترو لنینگراد و ورشو فرستاده بود.


    سنگ کهن‌تر، داستانی سخت‌تر می‌گوید. در سده‌ی هجدهم، چون یورش‌های داغستانی بی‌امان شد، باروی مستحکمی
    این‌جا برپا شد: تقریباً چهارگوش، حدود یک هکتار، با ردیف پایینی بی‌روزنه، ردیف بالایی سوراخ‌شده با
    روزنه‌های تفنگ، و برج‌های گوشه که تنها از حیاط به آن‌ها راه بود. در تابستان ۱۸۱۲، در خلال شورش کاختی
    بر ضد فرمانروایی روسیه، شورشیان سپاه تزار را نزدیک همین دیوارها شکست دادند. سده‌ی نوزدهم که دیگر نیازی
    به دژ نداشت، آن را به معدن سنگ بدل کرد.


    در پایان سپتامبر یا در اکتبر بیایید، هنگامی که برداشت انگور در جریان است و حیاط‌ها بوی انگور له‌شده
    می‌دهند. کنار دیوار شکسته با جامی از ناپارئولی بایستید، و هر سه زندگی روستا - گله، دژ و تاکستان -
    در یک چشم‌انداز واحد جای می‌گیرند.
  tip: >-
    ناپارئولی روستایی است، نه دیدنی‌ای با بلیت: خانه‌های شراب‌سازی راه ورود شما به آن‌اند. بیشترشان برای
    چشیدن شراب و غذا رزرو می‌پذیرند، و در زمان برداشت، یک تماس تلفنی از روز قبل شما را از سفری بیهوده
    بازمی‌دارد. پیش از جام نخست تعیین کنید چه کسی رانندگی می‌کند؛ پیمانه‌های کاختی سخاوتمندانه‌اند. شراب‌های
    کهربایی کوِوری از قصد گس و تانن‌دارند، و روش کوِوری از سال ۲۰۱۳ در فهرست میراث ناملموس یونسکو جای
    دارد. دریاچه‌ی لوپوتا حدود دو کیلومتر دورتر است، و صومعه‌ی نکرسی حدود بیست کیلومتر جنوب‌شرق در همان
    راه. سوخت‌گیری و دستگاه خودپرداز در تلاوی.
  route: >-
    دو راه خوب وجود دارد. کوتاه‌ترش از گذرگاه گومبوری می‌گذرد: از تفلیس با S5 حرکت کنید، نزدیک وازیانی
    به Sh38 بپیچید و از تیغه بگذرید تا به تلاوی برسید (حدود ۹۰ کیلومتر). از تلاوی، Sh70 را از روی آلازانی
    به سوی شاکریانی بگیرید، سپس به شمال و به Sh43 بپیچید؛ ناپارئولی حدود بیست کیلومتر از تلاوی فاصله دارد.
    مسافت کل حدود ۱۱۵ کیلومتر، ۲ ساعت و ۱۰ دقیقه، سراسر آسفالت. برف زمستانی می‌تواند رفت‌وآمد در گذرگاه
    را کُند یا متوقف کند؛ در آن هنگام از راه S5 و گورجانی بروید، طولانی‌تر، اما بی‌آنکه از کوه بگذرد.
    خودرویی اقتصادی در تمام سال کافی است؛ در تلاوی سوخت‌گیری کنید.
he:
  name: נאפאראולי
  short: כפר יין על נהר הלופוטה מתחת לקווקז, עם אזור גידול משלו, מתחם מבוצר מהמאה ה-18 ובית יין שנוסד
    ב-1883.
  body: >-
    **נאפאראולי זוכר כבשים לפני יין: השם פירושו, בקירוב, המקום שבו עמד פעם עדר.**


    ואת שמו הוא קיבל ביושר. הכפר שוכן על מישור האלאזני, על הגדה השמאלית של הלופוטה, כעשרים קילומטרים מצפון
    לטלאווי, והדרך הישנה לצ'יאורי עברה דרכו ומשם טיפסה דרך שילדה וקוואראלי אל ההרים בכיוון דאגסטן. רועים
    מטושתי, מקאחתי ומעמק פנקיסי הובילו בה את עדריהם, ובימי הביניים תעבורה זו הפכה את נאפאראולי לחשוב.


    היין הגיע בהמשך. בשנות ה-1780 העניק אירקלה השני את הכפר לגרסבן צ'בצ'בדזה; בשנות ה-1820 לווה היורש
    אלכסנדר מיליון רובל כדי לשתול כאן כרמים ומטעים. בית יין נפתח ב-1883 ופעל עדיין במאה ה-20. כיום נאפאראולי
    הוא כינוי מקור מוגן ליינות יבשים מסאפראווי ורקציטלי, ובתי יין משפחתיים פזורים לאורך סמטאותיו; אחד,
    "טווינס אולד סלר", מכריז על עצמו בקוורי מצוירת עצומה. מחצבת הכפר, בינתיים, שלחה את השיש שלה עד לרכבות
    התחתיות של לנינגרד ושל ורשה.


    האבן העתיקה יותר מספרת סיפור קשה יותר. במאה ה-18, כשפשיטות דאגסטניות הפכו חסרות הפוגה, הוקם כאן מתחם
    מבוצר: כמעט מרובע, בשטח של כהקטר (כעשרה דונם), קומתו התחתונה אטומה, העליונה מנוקבת בחרכי ירי, ומגדלי
    הפינה נגישים רק מהחצר. בקיץ 1812, במהלך המרד הקאחתי בשלטון הרוסי, המורדים הביסו את חיילי הצאר לצד
    חומות אלה. המאה ה-19, שלא מצאה עוד שימוש למצודה, הפכה אותה למחצבת אבן.


    בואו בסוף ספטמבר או באוקטובר, כשהבציר בעיצומו והחצרות מריחות ענבים מעוכים. עמדו לצד החומה השבורה עם
    כוס נאפאראולי, ושלושת חייו של הכפר - העדר, המצודה והכרם - יתלכדו לתמונה אחת.
  tip: >-
    נאפאראולי הוא כפר, לא אתר עם כרטיסים: בתי היין הם דרך הכניסה שלכם. רובם מקבלים הזמנות לטעימות ולארוחות,
    ובעונת הבציר שיחת טלפון יום קודם תחסוך לכם נסיעה לשווא. הכריעו מי נוהג לפני הכוס הראשונה; המזיגות
    הקאחתיות נדיבות. יינות הקוורי הענבריים עפיצים וטאניניים במכוון, ושיטת הקוורי ברשימת המורשת הבלתי-מוחשית
    של אונסק״ו מ-2013. אגם לופוטה כשני קילומטרים משם, ומנזר נקרסי כעשרים קילומטרים דרום-מזרחה באותה דרך.
    תדלוק וכספומטים בטלאווי.
  route: >-
    יש שתי דרכים טובות. הקצרה עוברת במעבר גומבורי: צאו מטביליסי ב-S5, פנו ל-Sh38 סמוך לוואזיאני חצו את
    הרכס ורדו לטלאווי (כ-90 ק"מ). מטלאווי סעו ב-Sh70, חצו את האלאזני לכיוון שקריאני, ואז פנו צפונה ב-Sh43;
    נאפאראולי כעשרים קילומטרים מטלאווי. בסך הכול כ-115 ק"מ, שעתיים ו-10 דקות, כולו אספלט. שלג חורפי יכול
    להאט או לעצור תנועה במעבר; אז סעו ב-S5 דרך גורג'אני, ארוך יותר אך עוקף את ההרים. רכב אקונומי מתאים
    כל השנה; תדלקו בטלאווי.
ar:
  name: نابارئولي
  short: >-
    قرية نبيذ على نهر لوبوتا تحت القوقاز، لها منطقة إنتاجها الخاصة، وسور محصّن من القرن الثامن عشر، ومصنع
    نبيذ تأسس عام 1883.
  body: >-
    **تتذكر نابارئولي الأغنام قبل النبيذ: يعني اسمها تقريبًا المكان الذي وقف فيه قطيع يومًا.**


    وقد استحقت اسمها بجدارة. تقع القرية على سهل ألازاني، على الضفة اليسرى لنهر لوبوتا، على نحو عشرين كيلومترًا
    شمال تيلافي، وكان طريق تشياوري القديم يمر مباشرة عبرها، صاعدًا عبر شيلدا وكفاريلي إلى الجبال نحو داغستان.
    كان رعاة من توشيتي وكاخيتي وبانكيسي يقودون قطعانهم عليه، وفي القرون الوسطى جعلت هذه الحركة نابارئولي
    مهمة.


    جاء النبيذ لاحقًا. في ثمانينيات القرن الثامن عشر منح إريكله الثاني القرية لغارسيفان تشافتشافادزه؛
    وفي عشرينيات القرن التاسع عشر استدان وريثه ألكسندر مليون روبل ليزرع هنا كرومًا وبساتين. افتُتح مصنع
    نبيذ عام 1883 وظل يعمل في القرن العشرين. اليوم نابارئولي تسمية منشأ محمية للنبيذ الجاف من عنبي سابيرافي
    وركاتسيتيلي، وتصطف بيوت النبيذ العائلية في الأزقة؛ أحدها، «توينز أولد سيلار»، يعلن عن نفسه بجرة كفيفري
    ضخمة مطلية. أما محجر القرية، فقد أرسل مرمره حتى إلى مترو لينينغراد ووارسو.


    يروي الحجر الأقدم قصة أقسى. في القرن الثامن عشر، حين أصبحت غارات داغستان بلا هوادة، أُقيم هنا سور
    محصّن: شبه مربع، مساحته نحو هكتار، طابقه السفلي أصمّ بلا فتحات، وطابقه العلوي مثقوب بفتحات للبنادق،
    وأبراجه الزاوية لا يُدخل إليها إلا من الساحة. في صيف 1812، خلال انتفاضة كاخيتي ضد الحكم الروسي، هزم
    الثوار قوات القيصر قرب هذه الأسوار. ولمّا لم يجد القرن التاسع عشر للقلعة نفعًا، حوّلها إلى مقلع للحجارة.


    تعالوا في أواخر سبتمبر أو في أكتوبر، حين يكون قطاف العنب جاريًا وتعبق الساحات برائحة العنب المهروس.
    قفوا عند السور المتهدم وكأس من نابارئولي في أيديكم، وستجتمع حيوات القرية الثلاث - القطيع والقلعة والكرم
    - في مشهد واحد.
  tip: >-
    نابارئولي قرية، لا معلم يحتاج تذكرة: بيوت النبيذ هي طريقكم إليها. تقبل معظمها الحجوزات للتذوق والوجبات،
    وفي موسم القطاف تُجنّبكم مكالمةٌ قبل يوم رحلةً ضائعة. حدّدوا من سيقود قبل الكأس الأولى؛ ففي كاخيتي
    تُملأ الكؤوس بسخاء. نبيذ الكفيفري الكهرماني قابض وغني بالتانين عن قصد، وطريقة الكفيفري على قائمة اليونسكو
    للتراث غير المادي منذ 2013. تقع بحيرة لوبوتا على نحو كيلومترين، ويقع دير نيكريسي على نحو عشرين كيلومترًا
    جنوب شرق على الطريق نفسه. الوقود والصرافات الآلية في تيلافي.
  route: >-
    هناك طريقان جيدان. الأقصر يعبر ممر غومبوري: اخرجوا من تبليسي على S5، وانحرفوا إلى Sh38 قرب فازياني،
    واعبروا السلسلة ثم انزلوا إلى تيلافي (نحو 90 كم). من تيلافي خذوا Sh70 عبر ألازاني نحو شاكرياني، ثم
    انحرفوا شمالًا على Sh43؛ تقع نابارئولي على نحو عشرين كيلومترًا من تيلافي. المسافة الإجمالية نحو 115
    كم، ساعتان و10 دقائق، كلها إسفلت. قد يبطئ الثلج الشتوي الحركة على الممر أو يوقفها؛ فاسلكوا حينها S5
    عبر غورجاني، وهو أطول لكنه يتجنب الجبل. تكفي سيارة اقتصادية طوال السنة؛ تزوّدوا بالوقود في تيلافي.
