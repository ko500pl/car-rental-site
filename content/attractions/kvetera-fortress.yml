ka:
  name: კვეტერის ციხე და ეკლესია
  short: >-
    X საუკუნის პატარა, ლაჟვარდოვანი კრამიტით გადახურული ეკლესია ტყიანი ციხე-ქალაქის გალავანში, ახმეტა–თიანეთის
    გზაზე: ციხე, რომელიც მეფემაც ვერ აიღო.
  body: >-
    **მემატიანე მოგვითხრობს, რომ ბაგრატ IV-მ „წარიხუნა ყოველნი ციხენი ჰერეთისა და კახეთისანი, თვინიერ
    კუეტარისა და ნახჭევანისა“ — ეს კუეტარი კვეტერაა.**


    ციხე-ქალაქი მდინარე ილტოს მარჯვენა ნაპირზე, ტყით დაფარულ ციცაბო სიმაღლეზე დგას, ახმეტა–თიანეთის გზაზე,
    ახმეტიდან თორმეტ კილომეტრში. ვახუშტი ბატონიშვილის აზრით, ქალაქი აქ ჯერ კიდევ VIII საუკუნეში უნდა ყოფილიყო;
    წერილობით წყაროებში კი კვეტერა კვირიკე III-ის (1010–1037) დროიდან ჩნდება, როცა ის იმ შვიდ საერისთავოთაგან
    ერთ-ერთის ცენტრი იყო, რომლებადაც მეფემ კახეთ-ჰერეთი დაჰყო. XIII საუკუნიდან საქალაქო ცხოვრების კვალი
    ქრება, ქალაქს კი ტყე იბრუნებს.


    რიყისა და ნატეხი ქვის გალავანი ქედს დღესაც დაახლოებით 300 მეტრზე მიუყვება, მრგვალი და ოთხკუთხა კოშკებით.
    შიდა ციხე ქვედაზე 35 მეტრით მაღლა დგას; მის ჩრდილო-აღმოსავლეთ კუთხეს შვიდმეტრიანი დიამეტრისა და თექვსმეტ
    მეტრზე მაღალი მრგვალი კოშკი იცავს. შიგნით X–XI საუკუნეების სასახლის, წყალსაცავისა და ადრეული დარბაზული
    ეკლესიის ნაშთებია — ეს უკანასკნელი თავად გალავანზე ძველია.


    მთავარი მაინც გუმბათოვანი ეკლესიაა — X საუკუნის ტეტრაკონქი, სულ ათიოდე მეტრის სიგრძე-სიგანისა, რომლის
    ოთხი აფსიდა გუმბათქვეშა კვადრატს ეხვევა. შიგნითაც და გარეთაც ის კარგად გათლილი შირიმის ფილებითაა მოპირკეთებული,
    სწორ ჰორიზონტალურ რიგებად. გუმბათის ყელს თორმეტი დეკორატიული თაღი შემოუყვება, ექვსი სარკმელი კი გუმბათქვეშ
    სინათლეს უშვებს. ლაჟვარდისფრად მოჭიქული კრამიტი 1968–1970 წლების რესტავრაციისაა, თუმცა 1968 წლის გათხრებისას
    ამავე გორაზე, თიხის ჭურჭელთან, მინის სამაჯურებსა და სპილენძის მონეტებთან ერთად, მოჭიქული კრამიტიც
    აღმოაჩინეს.


    2007 წლიდან კვეტერა იუნესკოს მსოფლიო მემკვიდრეობის საცდელ სიაშია. ჩვეულებრივ დღეს აქ მხოლოდ ტყის შრიალი
    ისმის. ეს ის ციხეა, რომელიც მეფემ ვერ აიღო; უხმაუროდ მან ის ქალაქიც გადააცხოვრა, რომლის დასაცავადაც
    ააგეს.
  tip: >-
    ერთი საათი მაინც დაუთმეთ: ეკლესიას რამდენიმე წუთი ყოფნის, გალავანსა და კოშკებს — გაცილებით მეტი. შესვლა
    უფასოა; ბილეთის სალარო, კაფე და ტუალეტი არ არის, ამიტომ წყალი და საჭმელი ახმეტიდან ან თიანეთიდან წამოიღეთ.
    გალავნის შიგნით ფერდობი ციცაბოა, ბალახით დაფარული და ჩამონგრეული ქვით მოფენილი: ჩაიცვით მყარი ფეხსაცმელი
    და გრძელი შარვალი, ბავშვები კი კედლებისა და კოშკების კიდეებს მოაშორეთ. თუ ეკლესია ღიაა, ისე ჩაიცვით,
    როგორც ნებისმიერ ქართულ ტაძარში. დილით მოდით, როცა მზე ეკლესიის აღმოსავლეთ ფასადს ანათებს და შირიმი
    ყველაზე თბილ ფერს იღებს.
  route: >-
    აქ ორი გზა მოდის. უფრო მოკლე თბილისიდან ჩრდილოეთით, ს3-ით ჟინვალამდე მიდის, შემდეგ შ27-ით აღმოსავლეთით
    თიანეთამდე, იქიდან კი შ43-ით, ტყე-ტყე, ახმეტის მიმართულებით: დაახლოებით 99 კილომეტრი და ორნახევარი
    საათი. მეორე გომბორის უღელტეხილზე (შ38) გადადის, შ42-ით დასავლეთით ახმეტამდე მიდის და შემდეგ შ43-ით,
    თიანეთისკენ, 12 კილომეტრს ადის: დაახლოებით 125 კილომეტრი და სამ საათამდე — ბუნებრივი არჩევანია, თუ
    ალავერდს ან პანკისსაც სტუმრობთ. ორივე შემთხვევაში მთავარი გზიდან გორისკენ დაახლოებით კილომეტრიანი
    გრუნტის შესახვევი ადის; მისი მდგომარეობა ცვალებადია, ამიტომ ჯობია მაღალი გამავლობის ავტომობილი იქირაოთ,
    ძლიერი წვიმის შემდეგ კი მანქანა ქვემოთ დატოვოთ და ფეხით ახვიდეთ. ზამთარში თიანეთის გზის მდგომარეობა
    წინასწარ გაარკვიეთ. საწვავი თიანეთსა და ახმეტაშია.
en:
  name: Kvetera Fortress and Church
  short: >-
    A small 10th-century church roofed in azure tile, inside the forest citadel on the Akhmeta–Tianeti
    road that a king once failed to take.
  body: >-
    **In the 1040s King Bagrat IV took every fortress in Kakheti and Hereti, the chronicle says, except
    two, and one of them was Kvetera.**


    The fortified town stands on a steep, wooded height above the right bank of the Ilto, twelve kilometres
    up the road from Akhmeta to Tianeti. Prince Vakhushti believed a town existed here by the 8th century;
    written sources name Kvetera from the reign of Kvirike III (1010–1037), when it was the seat of one
    of the seven duchies into which he divided Kakheti and Hereti. After the 13th century town life fades
    from the record, and the forest moves in.


    Walls of river cobble and broken stone still run some 300 metres along the ridge, with round and square
    towers. The citadel sits 35 metres above the lower town, its north-eastern corner held by a round
    tower seven metres across and over sixteen metres high. Inside lie the remains of a 10th–11th-century
    palace, a cistern and an early hall church older than the walls themselves.


    Then the reason you came: a 10th-century domed church about ten metres across, a tetraconch whose
    four apses turn around a single square beneath the dome. It is faced inside and out with finely dressed
    blocks of shirimi, the soft calcareous stone of eastern Georgia, laid in level courses. Twelve blind
    arches ring the drum, and six windows light the dome. The azure glazed tiles on the roof come from
    the restoration of 1968–70, yet glazed tile was also among the finds when archaeologists dug the hill
    in 1968, alongside pottery, glass bracelets and copper coins.


    Since 2007 Kvetera has been on UNESCO's tentative list. On most days you will hear only the forest.
    This is the fortress a king could not take; quietly, it has outlived the town it was built to guard.
  tip: >-
    Allow an hour or more: the church takes minutes, the walls and towers much longer. Entry is free,
    and there is no ticket office, café or toilet, so bring water and food from Akhmeta or Tianeti. Inside
    the walls the ground is steep, overgrown and strewn with fallen masonry; wear proper shoes and long
    trousers, and keep children well back from the tops of walls and towers. If the church is open, dress
    as you would for any Georgian church. Come in the morning, when the sun is on the east face of the
    church and the stone looks its warmest.
  route: >-
    Two approaches. The shorter takes the S3 north to Zhinvali, the Sh27 east to Tianeti, then the Sh43
    south-east through the forest towards Akhmeta: about 99 km, two and a half hours. The other crosses
    the Gombori Pass (Sh38), follows the Sh42 west to Akhmeta and climbs 12 km up the Sh43 towards Tianeti:
    about 125 km, nearly three hours, and the natural choice if you are also seeing Alaverdi or Pankisi.
    Either way, a side track of about a kilometre climbs from the road to the hill. Its surface varies,
    so rent an SUV, and after heavy rain park and walk. In winter, check the Tianeti road first. Fuel
    is in Tianeti and Akhmeta.
ru:
  name: Крепость и церковь Кветера
  short: >-
    Небольшая церковь X века с крышей из лазурной черепицы внутри лесной цитадели на дороге Ахмета–Тианети,
    которую царь однажды не смог взять.
  body: >-
    **В 1040-х годах царь Баграт IV, как сообщает летопись, взял все крепости Кахетии и Эрети, кроме двух,
    и одной из них была Кветера.**


    Крепостной город стоит на крутой лесистой высоте над правым берегом Илто, в двенадцати километрах
    вверх по дороге от Ахметы до Тианети. Царевич Вахушти Багратиони полагал, что поселение существовало
    здесь уже в VIII веке; письменные источники называют Кветеру со времён правления Квирике III (1010–1037),
    когда она была резиденцией одного из семи эриставств, на которые он разделил Кахетию и Эрети. После
    XIII века городская жизнь исчезает из летописей, и город поглощает лес.


    Стены из речной гальки и бутового камня до сих пор тянутся около 300 метров по гребню, с круглыми
    и квадратными башнями. Цитадель стоит на 35 метров выше нижнего города, её северо-восточный угол замыкает
    круглая башня диаметром семь метров и высотой более шестнадцати. Внутри — остатки дворца X–XI веков,
    цистерна и ранний зальный храм, старше самих стен.


    А затем — то, ради чего вы приехали: купольная церковь X века около десяти метров в поперечнике, тетраконх,
    чьи четыре апсиды сгруппированы вокруг подкупольного квадрата. Она облицована внутри и снаружи тщательно
    отёсанными блоками ширими, мягкого известкового камня восточной Грузии, уложенными ровными рядами.
    Двенадцать глухих арок опоясывают барабан, а шесть окон освещают купол. Лазурная глазурованная черепица
    на крыше появилась при реставрации 1968–1970 годов, однако глазурованная черепица также была среди
    находок археологов, копавших холм в 1968 году, вместе с керамикой, стеклянными браслетами и медными
    монетами.


    С 2007 года Кветера входит в предварительный список ЮНЕСКО. Чаще всего вы услышите только лес: крепость,
    которую царь не смог взять, тихо пережила и город, который она охраняла.
  tip: >-
    Отведите час или больше: на церковь уйдут минуты, стены и башни — гораздо дольше. Вход бесплатный,
    билетной кассы, кафе и туалета нет, так что запаситесь водой и едой в Ахмете или Тианети. Внутри стен
    склон крутой, заросший и заваленный обломками кладки; наденьте подходящую обувь и длинные брюки и
    держите детей далеко от краёв стен и башен. Если церковь открыта, одевайтесь так, как принято в любой
    грузинской церкви. Приезжайте утром, когда солнце освещает восточный фасад церкви и камень выглядит
    теплее всего.
  route: >-
    Сюда ведут две дороги. Короткая идёт по S3 на север до Жинвали, затем по Sh27 на восток до Тианети,
    затем по Sh43 на юго-восток через лес в сторону Ахметы: около 99 км, два с половиной часа. Другая
    пересекает Гомборский перевал (Sh38), идёт по Sh42 на запад до Ахметы и поднимается на 12 км по Sh43
    в сторону Тианети: около 125 км, почти три часа, и это естественный выбор, если в ваших планах также
    Алаверди или Панкиси. В обоих случаях боковая дорога протяжённостью около километра поднимается от
    шоссе на холм. Её состояние непредсказуемо, так что арендуйте внедорожник, а после сильного дождя
    оставьте машину внизу и поднимайтесь пешком. Зимой сначала проверьте дорогу на Тианети. Заправка —
    в Тианети и Ахмете.
fa:
  name: دژ و کلیسای کوِتِرا
  short: >-
    کلیسایی کوچک از سده‌ی دهم با بامی از کاشیِ لاجوردی، درونِ ارگِ جنگلیِ راهِ آخمِتا-تیانتی، که پادشاهی
    زمانی نتوانست آن را بگیرد.
  body: >-
    **در دهه‌ی ۱۰۴۰، به‌گفته‌ی وقایع‌نگار، پادشاه باگرات چهارم همه‌ی دژهای کاختی و هِرِتی را گرفت، جز
    دو، و یکی از آن دو کوِتِرا بود.**


    شهرِ استحکام‌یافته بر بلندایی تند و جنگلی، بالای کناره‌ی راستِ رودِ ایلتو، بر راهِ آخمِتا به تیانتی
    و دوازده کیلومتر بالاتر از آخمِتا، برپاست. شاهزاده واخوشتی بر این باور بود که در سده‌ی هشتم شهری این‌جا
    وجود داشته است؛ منابعِ نوشتاری کوِتِرا را از دورانِ کویریکه سوم (۱۰۱۰–۱۰۳۷) نام می‌برند، هنگامی که
    مقرِ یکی از هفت اِریستاوی‌نشین (ایالت) بود که او کاختی و هِرِتی را به آن‌ها بخش کرد. پس از سده‌ی سیزدهم،
    نشانِ زندگیِ شهری از اسناد محو می‌شود و جنگل جای آن را می‌گیرد.


    دیوارهایی از سنگ‌ریزه‌ی رودخانه و سنگ شکسته هنوز حدود ۳۰۰ متر بر تیغه کشیده شده‌اند، با برج‌های گرد
    و چهارگوش. ارگ ۳۵ متر بالاترِ شهرِ زیرین نشسته، و گوشه‌ی شمال‌خاوریِ آن را برجی گرد به قطرِ هفت متر
    و بلندای بیش از شانزده متر نگه می‌دارد. درونش بازمانده‌های کاخی از سده‌های دهم و یازدهم، آب‌انباری،
    و کلیسایی تالاری (تک‌ناوی) کهن‌تر از خودِ دیوارها برجاست.


    و اکنون، دلیلِ آمدنتان: کلیسای گنبددارِ سده‌ی دهم، به قطرِ حدود ده متر، چهارمحرابی (تتراکونخ) که چهار
    آپسش گردِ مربعِ زیرِ گنبد جای گرفته‌اند. درون و برونش با بلوک‌های ظریف‌تراشیده‌ی شیریمی، سنگ آهکیِ
    نرمِ خاورِ گرجستان، در ردیف‌های همتراز روکش شده. دوازده طاق‌نمای کور گردِ گریوِ (ساقه‌ی) گنبد را فراگرفته‌اند،
    و شش پنجره گنبد را روشن می‌کنند. کاشی‌های لاجوردی بر بام از بازسازیِ ۱۹۶۸–۷۰ می‌آید، با این‌همه، کاشیِ
    لعابی نیز میان یافته‌های باستان‌شناسانی بود که در سال ۱۹۶۸ تپه را کاویدند، در کنارِ سفال، دستبندهای
    شیشه‌ای و سکه‌های مسی.


    از سال ۲۰۰۷ کوِتِرا در فهرستِ موقتِ یونسکو جای دارد. در بیشترِ روزها تنها صدای جنگل را می‌شنوید: این
    همان دژی است که پادشاهی نتوانست بگیرد؛ و آرام‌آرام از شهری که برای پاسداری‌اش ساخته شد، بیشتر زیسته
    است.
  tip: >-
    یک ساعت یا بیشتر بگذارید: کلیسا چند دقیقه می‌گیرد، دیوارها و برج‌ها بسیار بیشتر. ورود رایگان است،
    و باجه‌ی بلیت، کافه و سرویس بهداشتی نیست، پس آب و خوراک از آخمِتا یا تیانتی بیاورید. درونِ دیوارها
    زمین تند، پوشیده از علف هرز و پر از سنگ‌های فروریخته است؛ کفشی مناسب و شلوارِ بلند بپوشید و کودکان
    را از لبه‌ی دیوارها و برج‌ها دور نگه دارید. اگر کلیسا باز است، همان‌گونه بپوشید که برای هر کلیسای
    گرجی. صبح بیایید، وقتی خورشید بر نمای خاوریِ کلیسا می‌تابد و سنگ گرم‌ترین رنگش را دارد.
  route: >-
    دو راه به این‌جا می‌رسد. راهِ کوتاه‌تر از S3 به شمال تا ژینوالی، سپس Sh27 به خاور تا تیانتی، سپس Sh43
    به جنوب‌خاور از میان جنگل به‌سوی آخمِتا می‌رود: حدود ۹۹ کیلومتر، دو ساعت و نیم. دیگری از گذرگاه گومبوری
    (Sh38) می‌گذرد، Sh42 را به باختر تا آخمِتا دنبال می‌کند و ۱۲ کیلومتر بر Sh43 به‌سوی تیانتی بالا می‌رود:
    حدود ۱۲۵ کیلومتر، نزدیک به سه ساعت، و گزینه‌ی طبیعی است اگر آلاوردی یا پانکیسی را نیز می‌بینید. در
    هر دو حال، راهی فرعی به درازای حدود یک کیلومتر از جاده به تپه بالا می‌رود. رویه‌ی آن یکسان نیست، پس
    خودرویی شاسی‌بلند کرایه کنید، و پس از بارانِ سنگین خودرو را پایین بگذارید و پیاده بالا بروید. زمستان،
    پیش از هر چیز راهِ تیانتی را بررسی کنید. سوخت در تیانتی و آخمِتا است.
he:
  name: מצודת וכנסיית קווטרה
  short: כנסייה קטנה מהמאה העשירית מקורה ברעפי לזורד, בתוך מצודת יער בדרך אחמטה-טיאנטי, שמלך פעם לא הצליח
    לכבוש.
  body: >-
    **בשנות ה-1040 כבש המלך בגרט הרביעי, כך מספרת הכרוניקה, כל מצודה בקאחתי ובהרטי, חוץ משתיים, ואחת מהן
    הייתה קווטרה.**


    העיר המבוצרת עומדת על גובה תלול ומיוער מעל הגדה הימנית של האילטו, שנים-עשר קילומטרים במעלה הדרך מאחמטה
    לטיאנטי. הנסיך ואחושטי האמין שקיים כאן יישוב כבר במאה השמינית; מקורות כתובים מזכירים את קווטרה מתקופת
    שלטונו של קווירקה השלישי (1010–1037), כשהייתה מקום מושבה של אחת משבע הדוכסויות שאליהן חילק את קאחתי
    והרטי. אחרי המאה ה-13 חיי העיר נמוגים מהתיעוד, והיער משתלט על המקום.


    חומות מחלוקי נחל ואבן שבורה עדיין נמשכות כ-300 מטרים על הרכס, עם מגדלים עגולים ומרובעים. המצודה יושבת
    35 מטרים מעל העיר התחתית, ובפינתה הצפון-מזרחית ניצב מגדל עגול בקוטר שבעה מטרים ובגובה של יותר משישה-עשר
    מטרים. בפנים שרידי ארמון מהמאות ה-10-11, מיכל מים וכנסיית אולם קדומה, עתיקה מהחומות עצמן.


    ואז, הסיבה שבגללה הגעתם: כנסייה כיפתית מהמאה העשירית בקוטר של כעשרה מטרים, טטרקונך שארבע האפסידות
    שלו ערוכות סביב ריבוע אחד שמתחת לכיפה. היא מצופה בפנים ובחוץ בבלוקים מהוקצעים להפליא של שירימי, האבן
    הגירית הרכה של מזרח גאורגיה, מונחים בשורות ישרות. שתים-עשרה קשתות עיוורות מקיפות את התוף, ושישה חלונות
    מאירים את הכיפה. הרעפים המזוגגים בצבע לזורד על הגג הם משיקום 1968-70, ואולם רעפים מזוגגים היו גם בין
    הממצאים שגילו הארכיאולוגים בעת חפירת הגבעה ב-1968, לצד קרמיקה, צמידי זכוכית ומטבעות נחושת.


    מאז 2007 קווטרה נמצאת ברשימה המקדימה של אונסק"ו. ברוב הימים תשמעו רק את היער: המצודה שמלך לא הצליח
    לכבוש, ובשקט האריכה ימים יותר מהעיר שעליה נבנתה לשמור.
  tip: >-
    הקצו שעה או יותר: לכנסייה עצמה יספיקו דקות ספורות, החומות והמגדלים הרבה יותר. הכניסה חופשית, ואין
    קופת כרטיסים, בית קפה או שירותים, אז הביאו מים ומזון מאחמטה או מטיאנטי. בתוך החומות הקרקע תלולה, מכוסה
    בעשבייה וזרועה שברי בנייה; נעלו נעליים מתאימות ולבשו מכנסיים ארוכים, והרחיקו את הילדים מקצוות החומות
    והמגדלים. אם הכנסייה פתוחה, התלבשו כמו בכל כנסייה גאורגית. הגיעו בבוקר, כשהשמש על החזית המזרחית של
    הכנסייה והאבן במיטב גווניה החמימים.
  route: >-
    שתי דרכי גישה. הקצרה יותר עוברת ב-S3 צפונה לג'ינוואלי, אחר כך ב-Sh27 מזרחה לטיאנטי, ואז ב-Sh43 דרום-מזרחה
    בין העצים לכיוון אחמטה: כ-99 ק"מ, שעתיים וחצי. האחרת חוצה את מעבר גומבורי (Sh38), ממשיכה ב-Sh42 מערבה
    לאחמטה ועולה 12 ק"מ על Sh43 לכיוון טיאנטי: כ-125 ק"מ, כשלוש שעות, והבחירה הטבעית אם אתם מתכננים לבקר
    גם באלוורדי או בפנקיסי. בכל מקרה, דרך עפר צדדית באורך כקילומטר עולה מהכביש לגבעה. מצבה משתנה, אז השכירו
    רכב שטח, ואחרי גשם כבד חנו למטה והמשיכו ברגל. בחורף בדקו קודם את דרך טיאנטי. דלק נמצא בטיאנטי ובאחמטה.
ar:
  name: قلعة وكنيسة كفيترا
  short: >-
    كنيسة صغيرة من القرن العاشر مسقوفة بقرميد لازوردي، داخل قلعة الغابة على طريق أخميتا-تيانيتي، فشل ملك
    يومًا في الاستيلاء عليها.
  body: >-
    **في أربعينيات القرن الحادي عشر استولى الملك باغرات الرابع، بحسب الحوليات، على كل قلعة في كاختي وهيريتي
    إلا اثنتين، وكانت كفيترا واحدة منهما.**


    تقوم المدينة المحصّنة على مرتفع حرجي شديد الانحدار فوق الضفة اليمنى لنهر إيلتو، على بعد اثني عشر كيلومترًا
    من أخميتا على الطريق الصاعد إلى تيانيتي. اعتقد الأمير فاخوشتي أن بلدة كانت قائمة هنا منذ القرن الثامن؛
    وتذكر المصادر المكتوبة كفيترا منذ عهد كفيريكه الثالث (1010–1037)، حين كانت مقرًا لواحدة من سبع إمارات
    (إريستافيات) قسّم إليها كاختي وهيريتي. وبعد القرن الثالث عشر، تغيب الحياة المدينية عن السجل، وتتقدّم
    الغابة.


    لا تزال أسوار من حصى النهر والحجر المكسّر تمتد نحو 300 متر على امتداد الحافة، بأبراج مستديرة ومربعة.
    تقع القلعة على ارتفاع 35 مترًا فوق المدينة السفلى، ويشغل زاويتها الشمالية الشرقية برجٌ مستدير قطره
    سبعة أمتار وارتفاعه أكثر من ستة عشر مترًا. في الداخل بقايا قصر من القرنين العاشر والحادي عشر، وصهريج،
    وكنيسة قاعة مبكرة أقدم من الأسوار نفسها.


    ثم يأتي سبب زيارتك: كنيسة مقببة من القرن العاشر يبلغ قطرها نحو عشرة أمتار، وهي رباعية الحنايا تنتظم
    حناياها الأربع حول المربع الواقع تحت القبة. وهي مكسوّة من الداخل والخارج بكتل مصقولة بدقة من حجر الشيريمي،
    الحجر الكلسي اللين لشرق جورجيا، مصفوفة في مداميك مستوية. تحيط بالطبلة اثنتا عشرة قنطرة عمياء، وتنير
    القبة ست نوافذ. القرميد المزجّج اللازوردي على السقف يعود إلى ترميم 1968–1970، إلا أن القرميد المزجّج
    كان أيضًا من بين المكتشفات حين حفر علماء الآثار التلة عام 1968، إلى جانب الفخار والأساور الزجاجية
    والقطع النقدية النحاسية.


    منذ عام 2007 وكفيترا على القائمة المؤقتة لليونسكو. في أغلب الأيام لن تسمع إلا صوت الغابة: القلعة التي
    عجز ملك عن أخذها، وقد عاشت بهدوء أطول من المدينة التي كانت تحرسها.
  tip: >-
    خصّص ساعة أو أكثر: الكنيسة تستغرق دقائق، أما الأسوار والأبراج فوقتًا أطول بكثير. الدخول مجاني، ولا
    يوجد شباك تذاكر أو مقهى أو دورات مياه، فاحمل الماء والطعام من أخميتا أو تيانيتي. داخل الأسوار الأرض
    منحدرة ومغطاة بالنباتات ومليئة بحجارة متساقطة؛ ارتدِ حذاءً مناسبًا وسروالًا طويلًا، وأبقِ الأطفال
    بعيدًا عن حواف الأسوار والأبراج. إذا كانت الكنيسة مفتوحة، فارتدِ ما ترتديه في أي كنيسة جورجية. تعال
    في الصباح، حين تكون الشمس على الواجهة الشرقية للكنيسة ويبدو الحجر في أدفأ ألوانه.
  route: >-
    يؤدي إلى هنا طريقان. الأقصر يسلك S3 شمالًا إلى جينفالي، ثم Sh27 شرقًا إلى تيانيتي، ثم Sh43 جنوب شرقًا
    عبر الغابة نحو أخميتا: نحو 99 كم، ساعتان ونصف. والآخر يعبر ممر غومبوري (Sh38)، يتبع Sh42 غربًا إلى
    أخميتا ويصعد 12 كم على Sh43 نحو تيانيتي: نحو 125 كم، قرابة ثلاث ساعات، وهو الخيار الطبيعي إن كنت ستزور
    أيضًا ألافردي أو بانكيسي. في الحالتين، يصعد مسار جانبي طوله نحو كيلومتر من الطريق إلى التلة. سطحه
    متفاوت، فاستأجر سيارة دفع رباعي، وبعد مطر غزير اترك السيارة في الأسفل واصعد سيرًا. في الشتاء، تحقق
    أولًا من طريق تيانيتي. الوقود في تيانيتي وأخميتا.
