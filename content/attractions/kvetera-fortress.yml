ka:
  name: ქვეთერას ციხე და ეკლესია
  short: ტყიან გორაზე მდგარი ციხე-ქალაქის ნაშთი ახმეტასთან, ცისფერკრამიტიანი პატარა X საუკუნის ეკლესიით.
  body: >-
    **ქვეთერა უჩვეულო შეხამებაა: მიტოვებული ციხე-ქალაქი და პაწაწინა, თითქმის სრულყოფილი ეკლესია.** ის
    ახმეტიდან რამდენიმე კილომეტრში, ტყით დაფარულ ცალკე გორაზეა, ივრის ზემო წელისკენ მიმავალი გზიდან მოშორებით.


    შუა საუკუნეებში აქ კახეთის ერისთავების ერთ-ერთი ცენტრი იყო. მატიანეები ქვეთერას VIII-X საუკუნეებში
    ქალაქად იხსენიებენ; შემდეგ ის დაცარიელდა და ტყემ დაფარა. დღეს გორის თხემზე გალავნის ნაშთები, კოშკების
    საძირკვლები და ცისტერნები ჩანს — ბალახსა და მუხის ძირებში ჩამარხული.


    მთავარი კი პატარა ეკლესიაა. X საუკუნის ეს ტეტრაკონქი შიგნიდან სულ ხუთი-ექვსი მეტრის დიამეტრისაა —
    ერთ ოჯახზე გათვლილი სივრცე, სამეფო კარის სამლოცველო. მისი პროპორციები იმდენად ზუსტია, რომ ფოტოზე ზომას
    ვერ განსაზღვრავ; ადგილზე მისვლისას ის მოულოდნელად პატარაა.


    გუმბათი ცისფერ-მომწვანო მოჭიქული კრამიტითაა დახურული. ეს გვიანდელი აღდგენაა, არა ორიგინალი, და ზოგს
    ხელოვნურად ეჩვენება; მაგრამ მწვანე ტყეში ეს ლურჯი კონუსი შორიდანვე იკვეთება და სწორედ ის გახდა ქვეთერას
    სავიზიტო ბარათი.


    შიგნით თითქმის არაფერია — შიშველი ქვა, ერთი ხატი, სანთლის სადგამი. მოსვლა სწორედ არქიტექტურის გამო
    ღირს: ეს ქართული გუმბათოვანი ეკლესიის მინიატურული, ზუსტი ვარიანტია, უფრო ადვილად წასაკითხი, ვიდრე
    დიდი ტაძრები.
  tip: >-
    ერთი საათი ეკლესიისა და გალავნის ნაშთებისთვის საკმარისია. ბოლო კილომეტრი ციცაბო, ხრეშიანი გზაა და
    წვიმის შემდეგ ჩვეულებრივი მანქანა შეიძლება ვერ აიდეს — ჯობია მაღალი კლირენსი ან ბოლო მონაკვეთის ფეხით
    გავლა (ოციოდე წუთი). ეკლესია ჩვეულებრივ ღიაა, ბილეთი არ არის. ჩაცმის წესები მოქმედებს. ტუალეტი და
    მაღაზია ახმეტაშია. ტყეში ზაფხულში ტკიპებია, გრძელი შარვალი გამოგადგება.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ დასავლეთით ალაზნის გასწვრივ ახმეტისკენ.
    ახმეტამდე ცოტა ადრე სამხრეთით მოუხვიე ქვეთერას მიმანიშნებელზე; ბოლო ორი კილომეტრი გორაზე ადის და ხრეშია.
    სულ 120 კმ, დაახლოებით ორი საათი და ოცი წუთი. საწვავი თელავსა და ახმეტაში. მშრალ ამინდში ჩვეულებრივი
    მანქანაც ავა, სველში კი SUV ჯობია.
en:
  name: Kvetera Fortress and Church
  short: >-
    The remains of a fortified town on a wooded hill near Akhmeta, with a tiny 10th-century church under
    a blue tiled roof.
  body: >-
    **Kvetera is an odd pairing: an abandoned fortified town and a miniature, almost perfect church.**
    It stands a few kilometres from Akhmeta on a free-standing wooded hill, off the road that runs up
    towards the Pankisi valley.


    In the early medieval period this was one of the seats of the dukes of Kakheti. Chronicles refer to
    Kvetera as a town between the 8th and 10th centuries; afterwards it emptied and the forest took it
    back. Along the crest you can still trace the line of the curtain wall, the footings of towers and
    cut cisterns, all half-buried in grass and oak roots.


    The reason to come, though, is the church. This 10th-century tetraconch measures only about five or
    six metres across inside — a chapel for a ruling family rather than a congregation. Its proportions
    are so exact that photographs give no sense of scale; arriving in person, most people are surprised
    by how small it is.


    The dome is covered in blue-green glazed tiles. That is a later restoration rather than the original
    finish, and purists find it artificial, but the blue cone visible through green forest has become
    the image by which Kvetera is known.


    Inside there is almost nothing: bare stone, one icon, a candle stand. The visit is about architecture.
    This is the Georgian domed church reduced to its essentials and executed without a single wasted line,
    and it is far easier to read here than in the large cathedrals down in the valley. Half an hour on
    this hill teaches more than a guidebook chapter.


    The hill is easy to underestimate from the road below. Kvetera's defensive value lay in watching the
    whole approach to the upper Alazani, and once you are standing on the crest the reason the dukes chose
    this particular knoll becomes obvious within a minute.
  tip: >-
    An hour covers the church and the wall remains. The last kilometre is a steep gravel track that an
    ordinary car may not manage after rain — either bring clearance or park lower and walk the final stretch,
    which takes about twenty minutes. The church is usually open and there is no ticket. Dress rules apply.
    Toilets and shops are in Akhmeta. Ticks are present in the forest in summer, so long trousers are
    worth wearing on the walk up.
  route: >-
    From Tbilisi drive over the Gombori Pass to Telavi (95 km), then west along the Alazani towards Akhmeta.
    Shortly before the town turn south at the sign for Kvetera; the last two kilometres climb the hill
    on gravel. Total 120 km, about two hours twenty. Fuel is available in Telavi and Akhmeta. In dry weather
    an ordinary car will get up; after rain an SUV is the sensible choice, and in winter the track can
    hold ice into the afternoon.
ru:
  name: Крепость и церковь Кветера
  short: Остатки укреплённого города на лесистом холме близ Ахметы с крошечной церковью X века под синей
    черепицей.
  body: >-
    **Кветера — необычная пара: заброшенный укреплённый город и миниатюрная, почти безупречная церковь.**
    Она стоит в нескольких километрах от Ахметы, на отдельном лесистом холме, в стороне от дороги, уходящей
    к Панкисской долине.


    В раннем Средневековье здесь была одна из резиденций кахетинских эриставов. Хроники называют Кветеру
    городом в VIII-X веках; затем она обезлюдела, и лес взял своё. По гребню до сих пор читаются линия
    стены, основания башен и вырубленные цистерны — всё наполовину скрыто травой и корнями дубов.


    Но ехать сюда стоит ради церкви. Этот тетраконх X века имеет внутри всего пять-шесть метров в поперечнике:
    часовня для правящей семьи, а не для прихода. Пропорции настолько точны, что по фотографии масштаб
    не считывается; на месте почти все удивляются, насколько она мала.


    Купол покрыт сине-зелёной глазурованной черепицей. Это позднее восстановление, а не первоначальное
    покрытие, и знатокам оно кажется искусственным; но синий конус, просвечивающий сквозь зелёный лес,
    и стал тем образом, по которому Кветеру узнают.


    Внутри почти ничего: голый камень, одна икона, подсвечник. Поездка — про архитектуру. Это грузинский
    купольный храм, сведённый к сути и выполненный без единой лишней линии, и здесь он читается куда легче,
    чем в больших соборах внизу.
  tip: >-
    Часа хватает на церковь и остатки стен. Последний километр — крутая гравийная дорога, после дождя
    обычная машина может не подняться; берите клиренс или оставляйте автомобиль ниже и идите пешком, это
    минут двадцать. Церковь обычно открыта, билета нет. Действуют правила одежды. Туалет и магазины —
    в Ахмете. Летом в лесу есть клещи, длинные брюки на подъём не помешают.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави (95 км), затем на запад вдоль Алазани в сторону Ахметы.
    Незадолго до города поверните на юг по указателю на Кветеру; последние два километра поднимаются по
    гравию. Всего 120 км, около двух часов двадцати минут. Заправки есть в Телави и Ахмете. В сухую погоду
    проедет обычная машина, после дождя разумнее внедорожник, а зимой на этом подъёме до полудня держится
    лёд.
fa:
  name: قلعه و کلیسای کوِترا
  short: بازمانده‌های شهری مستحکم بر تپه‌ای جنگلی نزدیک آخمتا، با کلیسایی کوچک از سدهٔ دهم زیر سفال آبی.
  body: >-
    **کوِترا جفت غریبی است: شهری مستحکم و متروک و کلیسایی خُرد و نزدیک به کامل.** چند کیلومتری آخمتا بر
    تپه‌ای جنگلی و مستقل ایستاده، دور از جاده‌ای که به سوی درّهٔ پانکیسی می‌رود.


    در سده‌های میانهٔ نخستین اینجا یکی از مقرهای دوک‌های کاختی بود. تواریخ کوِترا را میان سده‌های هشتم
    و دهم شهر خوانده‌اند؛ سپس خالی شد و جنگل آن را پس گرفت. هنوز می‌توان روی ستیغ خط دیوار حصار، پی برج‌ها
    و آب‌انبارهای کنده‌شده را دنبال کرد، همه نیمه‌مدفون در علف و ریشهٔ بلوط.


    اما دلیل آمدن، کلیساست. این بنای چهارلختی سدهٔ دهم از درون تنها پنج یا شش متر پهنا دارد؛ نمازخانه‌ای
    برای خاندانی حاکم نه برای جماعتی. تناسباتش چنان دقیق است که عکس هیچ حسی از اندازه نمی‌دهد؛ بیشتر کسانی
    که از نزدیک می‌بینند از کوچکی‌اش شگفت‌زده می‌شوند.


    گنبد با سفال لعابی آبی-سبز پوشیده شده است. این مرمتی متأخر است نه پوشش اصلی، و سخت‌گیران آن را ساختگی
    می‌دانند؛ اما همان مخروط آبی که از میان جنگل سبز پیداست تصویری شده که کوِترا را با آن می‌شناسند.


    درون کلیسا تقریباً چیزی نیست: سنگ برهنه، یک شمایل، یک شمعدان. این سفر دربارهٔ معماری است. اینجا کلیسای
    گنبددار گرجی به عناصر اصلی‌اش فروکاسته شده و بی‌یک خط زائد اجرا شده است، و خواندنش از کلیساهای بزرگ
    پایین درّه بسیار آسان‌تر است.
  tip: >-
    یک ساعت برای کلیسا و بازمانده‌های دیوار کافی است. یک کیلومتر پایانی راهی شنی و تند است که پس از باران
    ممکن است خودروی معمولی از پس آن برنیاید؛ یا خودرویی با ارتفاع مناسب بیاورید یا پایین‌تر پارک کنید
    و بقیه را پیاده بروید، حدود بیست دقیقه. کلیسا معمولاً باز است و بلیتی نیست. قواعد پوشش برقرار است.
    سرویس بهداشتی و مغازه در آخمتاست. تابستان در جنگل کنه هست، پس شلوار بلند برای بالا رفتن به کار می‌آید.
  route: >-
    از تفلیس از گردنهٔ گومبوری تا تلاوی (95 کیلومتر) برانید و سپس به غرب و در کنار آلازانی به سوی آخمتا.
    کمی پیش از شهر، کنار تابلوی کوِترا به جنوب بپیچید؛ دو کیلومتر آخر روی شن از تپه بالا می‌رود. جمعاً
    120 کیلومتر و حدود دو ساعت و بیست دقیقه. سوخت در تلاوی و آخمتا هست. در هوای خشک خودروی معمولی بالا
    می‌رود، پس از باران شاسی‌بلند منطقی‌تر است، و در زمستان یخ تا بعدازظهر روی مسیر می‌ماند.
he:
  name: מבצר וכנסיית קווטרה
  short: שרידי עיר מבוצרת על גבעה מיוערת ליד אחמטה, ובה כנסייה זעירה מן המאה העשירית תחת גג רעפים כחול.
  body: >-
    **קווטרה היא צמד מוזר: עיר מבוצרת נטושה וכנסייה זעירה וכמעט מושלמת.** היא עומדת כמה קילומטרים מאחמטה
    על גבעה מיוערת עצמאית, בצד הדרך העולה לעבר עמק פנקיסי.


    בימי הביניים המוקדמים היה כאן אחד ממושבי הדוכסים של קחתי. הכרוניקות מכנות את קווטרה עיר בין המאה השמינית
    לעשירית; אחר כך התרוקנה והיער כיסה אותה. לאורך הרכס עוד אפשר להתחקות אחר קו החומה, יסודות מגדלים ובורות
    חצובים, כולם קבורים למחצה בעשב ובשורשי אלון.


    אבל הסיבה להגיע היא הכנסייה. מבנה ארבע-הקונכיות הזה מן המאה העשירית מודד בפנים חמישה או שישה מטרים
    בלבד — קפלה למשפחה שלטת ולא לקהילה. הפרופורציות מדויקות עד כדי כך שתצלום אינו מוסר שום תחושת קנה מידה;
    מי שמגיע בפועל מופתע לרוב מכמה שהיא קטנה.


    הכיפה מכוסה ברעפים מזוגגים בכחול-ירוק. זהו שחזור מאוחר ולא הגימור המקורי, ומקפידים רואים בו מלאכותיות;
    אך החרוט הכחול המבצבץ מתוך היער הירוק הפך לתמונה שבה מזהים את קווטרה.


    בפנים אין כמעט דבר: אבן חשופה, איקונה אחת, מעמד נרות. הביקור עוסק באדריכלות. זו הכנסייה המקומרת הגאורגית
    מצומצמת ליסודותיה ומבוצעת בלי קו מיותר אחד, וקל לקרוא אותה כאן הרבה יותר מאשר בקתדרלות הגדולות שבעמק.
  tip: >-
    שעה מכסה את הכנסייה ואת שרידי החומה. הקילומטר האחרון הוא דרך חצץ תלולה שרכב רגיל עלול שלא לעלות בה
    אחרי גשם; הביאו מרווח גחון או החנו למטה ולכו את הקטע האחרון ברגל, כעשרים דקות. הכנסייה פתוחה בדרך
    כלל ואין כרטיס. חלים כללי לבוש. שירותים וחנויות באחמטה. בקיץ יש קרציות ביער, אז כדאי מכנסיים ארוכים
    בעלייה.
  route: >-
    מטביליסי סעו מעל מעבר גומבורי לטלאווי (95 ק״מ), ואז מערבה לאורך האלאזני לכיוון אחמטה. מעט לפני העיירה
    פנו דרומה בשילוט לקווטרה; שני הקילומטרים האחרונים מטפסים בגבעה על חצץ. בסך הכול 120 ק״מ, כשעתיים ועשרים.
    דלק יש בטלאווי ובאחמטה. במזג אוויר יבש רכב רגיל יעלה; אחרי גשם רכב שטח הוא הבחירה הנכונה, ובחורף הדרך
    אוחזת קרח עד אחר הצהריים.
ar:
  name: قلعة كفيتيرا وكنيستها
  short: بقايا مدينة محصنة على تل مشجّر قرب أخميتا، وفيها كنيسة صغيرة من القرن العاشر تحت قرميد أزرق.
  body: >-
    **كفيتيرا اقتران غريب: مدينة محصنة مهجورة وكنيسة مصغّرة تكاد تكون كاملة.** تقوم على بعد كيلومترات
    من أخميتا على تل مشجّر قائم بذاته، بعيداً عن الطريق الصاعد نحو وادي بانكيسي.


    في العصور الوسطى المبكرة كانت هنا إحدى مقار دوقات كاخيتي. وتذكر الحوليات كفيتيرا مدينةً بين القرنين
    الثامن والعاشر؛ ثم خلت وعادت الغابة إليها. وعلى امتداد القمة ما زال يمكن تتبّع خط السور وأساسات الأبراج
    والصهاريج المنحوتة، وكلها نصف مدفونة في العشب وجذور البلوط.


    لكن سبب المجيء هو الكنيسة. فهذا البناء الرباعي الحنايا من القرن العاشر لا يتجاوز عرضه الداخلي خمسة
    أو ستة أمتار: مصلّى لأسرة حاكمة لا لجماعة. ونسبه من الدقة بحيث لا تنقل الصور أي إحساس بالمقياس؛ ومن
    يصل بنفسه يفاجأ غالباً بصغرها.


    والقبة مغطاة بقرميد مزجّج أزرق مخضرّ. وهذا ترميم متأخر لا الكسوة الأصلية، ويراه المتشددون مصطنعاً؛
    غير أن المخروط الأزرق الظاهر من بين الغابة الخضراء صار الصورة التي تُعرف بها كفيتيرا.


    وفي الداخل لا شيء يُذكر: حجر عارٍ وأيقونة واحدة وحامل شموع. الزيارة عن العمارة. هذه هي الكنيسة الجورجية
    المقبّبة مردودة إلى أصولها ومنفذة بلا خط زائد واحد، وقراءتها هنا أسهل بكثير منها في الكاتدرائيات الكبرى
    أسفل الوادي.
  tip: >-
    ساعة تغطي الكنيسة وبقايا السور. والكيلومتر الأخير مسلك حصوي حاد قد لا تصعده سيارة عادية بعد المطر؛
    فإما أن تأتي بارتفاع مناسب أو تركن في الأسفل وتمشي المقطع الأخير في نحو عشرين دقيقة. الكنيسة مفتوحة
    عادة ولا تذكرة. وتُطبق قواعد اللباس. ودورات المياه والمتاجر في أخميتا. وفي الصيف يوجد القُراد في الغابة،
    فالسروال الطويل مفيد في الصعود.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي (95 كم) ثم غرباً بمحاذاة ألازاني نحو أخميتا. وقبيل البلدة انعطف
    جنوباً عند لافتة كفيتيرا؛ آخر كيلومترين يصعدان التل على الحصى. المجموع 120 كم ونحو ساعتين وعشرين دقيقة.
    والوقود متوفر في تيلافي وأخميتا. في الجو الجاف تصعد السيارة العادية؛ وبعد المطر تكون سيارة الدفع الرباعي
    الخيار الحكيم، وفي الشتاء يبقى الجليد على المسلك حتى بعد الظهر.
