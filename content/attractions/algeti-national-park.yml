ka:
  name: ალგეთის ეროვნული პარკი
  short: ნაძვნარ-სოჭნარი ტყე თბილისიდან საათში — მშვიდი ბილიკები, სუფთა ჰაერი და თითქმის უტურისტო შაბათ-კვირა.
  body: >-
    ალგეთის ეროვნული პარკი თრიალეთის ქედის აღმოსავლეთ ფერდობზე, მანგლისის მიდამოებშია და თბილისიდან ყველაზე
    ახლოს მდებარე სერიოზული ტყის მასივია. პარკის ღირებულება ბოტანიკურია: აქ აღმოსავლური ნაძვი და კავკასიური
    სოჭი თავიანთი გავრცელების ყველაზე აღმოსავლეთ საზღვარს აღწევს — მათ დასავლეთით, კოლხეთის ტენიან ტყეებში,
    ეს სახეობები ჩვეულებრივია, აქ კი უკვე იშვიათია და სწორედ ამიტომ დაცული.


    პარკის ფართობი დაახლოებით ექვსი ათასი ჰექტარია, სიმაღლე კი ათასიდან ორ ათას მეტრამდე იცვლება. მოწყობილია
    რამდენიმე მონიშნული ბილიკი: მოკლე, საათნახევრიანი მარშრუტი ვიზიტორთა ცენტრიდან და გრძელი, ექვსიდან
    რვა კილომეტრამდე წრიული ბილიკები, რომლებიც ქედის თხემზე გადის და ხედს ალგეთის ხეობაზე ხსნის. ტერიტორიაზეა
    საპიკნიკე ადგილები, მაგიდები და კარვის დასადგამი მოედნები.


    ალგეთი ის ადგილია, სადაც შაბათ-კვირასაც კი იშვიათად შეხვდებით ხალხს — ტურისტული ნაკადი აქ პრაქტიკულად
    არ არის და თბილისელებიც უფრო ხშირად კოჯორსა და მანგლისში ჩერდებიან. ცხოველთაგან გვხვდება შველი, გარეული
    ღორი, მელა და დათვი, თუმცა უკანასკნელს იშვიათად თუ დაინახავთ. საუკეთესო დროა გაზაფხულის ბოლო და შემოდგომა.
    ვიზიტორთა ცენტრი და ბილიკების ქსელი ბოლო წლებში მოწესრიგდა, თუმცა პარკი კვლავ მარტივ და დაუტვირთავ
    ვარიანტად რჩება იმისთვის, ვისაც თბილისიდან ნახევარი დღით ტყეში გასვლა უნდა და გრძელი მგზავრობა არ
    სურს.
  tip: >-
    შესვლა უფასოა, მაგრამ ვიზიტორთა ცენტრში შეიარაღეთ რუკით და გადაამოწმეთ ბილიკების მდგომარეობა — მონიშვნა
    ადგილ-ადგილ დაზიანებულია. ერთდღიან სეირნობას ოთხი საათი ეყოფა. თან იქონიეთ წყალი და საკვები: პარკში
    კაფე არ არის, უახლოესი მაღაზია მანგლისშია. ტყეში ტკიპებია, ამიტომ დახურული ჩაცმა და შემდეგ თავის დათვალიერება
    გონივრულია. კარვის დადგმა მხოლოდ მონიშნულ ადგილებშია ნებადართული.
  route: >-
    თბილისიდან გადით კოჯრის გზით და შემდეგ მანგლისის მიმართულებით, სულ დაახლოებით 60 კმ და საათი და ოცი
    წუთი. კოჯრიდან მანგლისამდე ასფალტი კარგია, თუმცა ვიწრო და კლაკნილი; პარკის ვიზიტორთა ცენტრამდე ბოლო
    რამდენიმე კილომეტრი კი გრუნტია და წვიმის შემდეგ ლაფიანდება. ამიტომ მაღალი კლირენსის კროსოვერი უფრო
    სასურველია, ვიდრე დაბალი ეკონომ კლასის მანქანა. საწვავი და მაღაზია კოჯორსა და მანგლისშია — შემდეგ
    არაფერია.
en:
  name: Algeti National Park
  short: >-
    Spruce and fir forest an hour from Tbilisi — quiet marked trails, clean air and almost no visitors
    even at weekends.
  body: >-
    Algeti National Park sits on the eastern slope of the Trialeti range near Manglisi and is the closest
    substantial forest massif to Tbilisi. Its value is primarily botanical: **Oriental spruce** and **Caucasian
    fir** reach the eastern limit of their range here. Further west, in the humid forests of Colchis,
    both species are ordinary; at Algeti they are already rare, which is precisely why the area was protected
    in the first place.


    The park covers roughly six thousand hectares and spans altitudes from about a thousand to two thousand
    metres. Several marked trails have been laid out: a short ninety-minute loop from the visitor centre,
    and longer circuits of six to eight kilometres that climb to the ridge and open views down the Algeti
    valley. There are picnic areas with tables and designated tent pitches for anyone wanting to stay
    overnight.


    Algeti is the kind of place where you can walk for hours at a weekend and meet almost nobody — organised
    tourism barely touches it, and Tbilisi day-trippers tend to stop at Kojori or Manglisi instead. Roe
    deer, wild boar and fox are present, and bears live here too, though sightings are rare. Late spring
    and autumn are the best seasons, with the forest at its most colourful.
  tip: >-
    Entry is free, but call at the visitor centre for a map and current trail conditions, since waymarking
    is damaged in places. Four hours is enough for a good day walk. Bring water and food — there is no
    café in the park and the nearest shop is in Manglisi. Ticks are present in the forest, so wear covered
    clothing and check yourself afterwards. Camping is permitted only at the designated pitches.
  route: >-
    Leave Tbilisi on the Kojori road and continue towards Manglisi — about 60 km and an hour and twenty.
    From Kojori to Manglisi the asphalt is good but narrow and winding, with a fair amount of climbing.
    The last few kilometres to the park visitor centre are gravel and turn muddy after rain, so a crossover
    with decent ground clearance is preferable to a low economy car. Fuel and shops are available in Kojori
    and Manglisi, and nothing beyond them.
ru:
  name: Национальный парк Алгети
  short: >-
    Еловый и пихтовый лес в часе от Тбилиси: тихие размеченные тропы, чистый воздух и почти полное отсутствие
    туристов.
  body: >-
    Национальный парк Алгети расположен на восточном склоне Триалетского хребта близ Манглиси и представляет
    собой ближайший к Тбилиси крупный лесной массив. Его ценность прежде всего ботаническая: **восточная
    ель** и **кавказская пихта** достигают здесь восточной границы своего распространения. Западнее, во
    влажных колхидских лесах, оба вида обычны, а в Алгети уже редки — именно поэтому территорию и взяли
    под охрану.


    Площадь парка около шести тысяч гектаров, высоты меняются примерно от тысячи до двух тысяч метров.
    Проложено несколько размеченных троп: короткая полуторачасовая петля от визит-центра и длинные кольцевые
    маршруты на шесть-восемь километров, которые выводят на гребень и открывают вид на долину Алгети.
    Есть площадки для пикника со столами и обозначенные места под палатки.


    Алгети — то место, где даже в выходной можно ходить часами и почти никого не встретить: организованный
    туризм сюда практически не доходит, а тбилисцы чаще останавливаются в Кожори или Манглиси. Из животных
    водятся косуля, кабан и лиса, живут здесь и медведи, но увидеть их удаётся редко. Лучшее время — конец
    весны и осень, когда лес наиболее выразителен.
  tip: >-
    Вход бесплатный, но зайдите в визит-центр за картой и уточните состояние троп: разметка местами повреждена.
    Четырёх часов достаточно для полноценной прогулки. Берите воду и еду — кафе в парке нет, ближайший
    магазин в Манглиси. В лесу водятся клещи, поэтому закрытая одежда и осмотр после прогулки разумны.
    Ставить палатки можно только на обозначенных площадках.
  route: >-
    Из Тбилиси выезжайте по дороге на Кожори и далее в сторону Манглиси — около 60 км и час двадцать.
    От Кожори до Манглиси асфальт хороший, но дорога узкая, извилистая и с заметным набором высоты. Последние
    несколько километров до визит-центра парка — грунт, который после дождя раскисает, поэтому кроссовер
    с нормальным клиренсом предпочтительнее низкой машины эконом-класса. Топливо и магазины есть в Кожори
    и Манглиси, дальше ничего нет.
fa:
  name: پارک ملی آلگتی
  short: >-
    جنگل صنوبر و نراد در یک ساعتی تفلیس — مسیرهای علامت‌گذاری‌شدهٔ آرام، هوای پاک و تقریباً بی‌بازدیدکننده
    حتی در آخر هفته.
  body: >-
    پارک ملی آلگتی روی دامنهٔ شرقی رشته‌کوه تریالتی نزدیک مانگلیسی قرار دارد و نزدیک‌ترین تودهٔ جنگلی
    بزرگ به تفلیس است. ارزش آن پیش از هر چیز گیاه‌شناختی است: **صنوبر شرقی** و **نراد قفقازی** اینجا به
    حد شرقی گسترهٔ خود می‌رسند. غرب‌تر، در جنگل‌های مرطوب کلخیس، هر دو گونه عادی‌اند؛ در آلگتی همین حالا
    کمیاب‌اند و دقیقاً به همین دلیل این منطقه از ابتدا حفاظت شد.


    پارک حدود شش هزار هکتار را می‌پوشاند و ارتفاعی از حدود هزار تا دو هزار متر دارد. چند مسیر علامت‌گذاری‌شده
    کشیده شده است: یک حلقهٔ کوتاه نودوقیقه‌ای از مرکز بازدیدکنندگان و مدارهای بلندتر شش تا هشت کیلومتری
    که تا ستیغ بالا می‌روند و منظرهٔ درهٔ آلگتی را باز می‌کنند. محوطه‌های پیک‌نیک با میز و جایگاه‌های
    مشخص چادر برای کسانی که می‌خواهند شب بمانند وجود دارد.


    آلگتی از آن جاهاست که می‌توانید آخر هفته ساعت‌ها راه بروید و تقریباً به کسی برنخورید — گردشگری سازمان‌یافته
    به‌سختی به آن رسیده و یک‌روزه‌های تفلیس معمولاً در کوجوری یا مانگلیسی می‌مانند. شوکا، گراز و روباه
    اینجا هستند و خرس هم زندگی می‌کند، هرچند دیده شدنش نادر است. اواخر بهار و پاییز بهترین فصل‌اند، وقتی
    جنگل پررنگ‌ترین حالت خود را دارد.
  tip: >-
    ورود رایگان است، اما در مرکز بازدیدکنندگان توقف کنید تا نقشه و وضعیت روز مسیرها را بگیرید، چون علامت‌گذاری
    جاهایی آسیب دیده است. چهار ساعت برای یک پیاده‌روی خوب روزانه کافی است. آب و خوراک همراه ببرید — در
    پارک کافه نیست و نزدیک‌ترین مغازه در مانگلیسی است. کنه در جنگل هست، پس لباس پوشیده بپوشید و بعد خودتان
    را وارسی کنید. چادر زدن فقط در جایگاه‌های مشخص‌شده مجاز است.
  route: >-
    از تفلیس جادهٔ کوجوری را بگیرید و به سوی مانگلیسی ادامه دهید — حدود 60 کیلومتر و یک ساعت و بیست دقیقه.
    از کوجوری تا مانگلیسی آسفالت خوب اما باریک و پرپیچ است و شیب زیادی دارد. چند کیلومتر آخر تا مرکز بازدیدکنندگان
    پارک شنی است و پس از باران گِلی می‌شود، پس کراس‌اوور با ارتفاع کف مناسب بر خودروی اقتصادی کم‌ارتفاع
    ترجیح دارد. سوخت و مغازه در کوجوری و مانگلیسی هست و پس از آن‌ها هیچ.
he:
  name: הפארק הלאומי אלגטי
  short: יער אשוחיות ואשוחים במרחק שעה מטביליסי — שבילים מסומנים ושקטים, אוויר נקי וכמעט בלי מבקרים גם
    בסופי שבוע.
  body: >-
    הפארק הלאומי אלגטי שוכן על המדרון המזרחי של רכס טריאלטי ליד מנגליסי, והוא גוש היער המשמעותי הקרוב
    ביותר לטביליסי. ערכו בראש ובראשונה בוטני: **האשוחית המזרחית** ו**האשוח הקווקזי** מגיעים כאן אל הגבול
    המזרחי של תפוצתם. מערבה יותר, ביערות הלחים של קולכיס, שני המינים רגילים לגמרי; באלגטי הם כבר נדירים,
    וזו בדיוק הסיבה שהאזור הוכרז מלכתחילה כשמורה.


    הפארק משתרע על כששת אלפים הקטרים ונע בין גבהים של אלף עד אלפיים מטר. הותוו בו כמה שבילים מסומנים:
    לולאה קצרה של תשעים דקות ממרכז המבקרים, ומעגלים ארוכים יותר של שישה עד שמונה קילומטרים המטפסים אל
    הרכס ונפתחים אל עמק אלגטי. יש שטחי פיקניק עם שולחנות ומקומות מוגדרים לאוהלים למי שרוצה ללון.


    אלגטי הוא מקום שאפשר לצעוד בו שעות בסוף שבוע ולא לפגוש כמעט אף אחד — התיירות המאורגנת כמעט אינה נוגעת
    בו, ומטיילי היום מטביליסי נוטים לעצור בקוג'ורי או במנגליסי במקום. איילים, חזירי בר ושועלים מצויים
    כאן, וגם דובים חיים באזור אף שמפגש איתם נדיר. סוף האביב והסתיו הן העונות הטובות ביותר, כשהיער צבעוני
    במיוחד.
  tip: >-
    הכניסה חינם, אבל סורו למרכז המבקרים לקבלת מפה ומצב השבילים העדכני, שכן הסימון פגום במקומות. ארבע שעות
    מספיקות להליכה יומית טובה. קחו מים ואוכל — אין בית קפה בפארק והחנות הקרובה ביותר נמצאת במנגליסי. יש
    קרציות ביער, לכן לבשו בגדים סגורים ובדקו את עצמכם אחר כך. הקמפינג מותר רק במקומות המסומנים.
  route: >-
    צאו מטביליסי בכביש קוג'ורי והמשיכו לכיוון מנגליסי — כ-60 ק״מ ושעה ועשרים. מקוג'ורי למנגליסי האספלט
    טוב אך צר ומתפתל, עם לא מעט טיפוס. הקילומטרים האחרונים אל מרכז המבקרים של הפארק הם חצץ ונעשים בוציים
    אחרי גשם, ולכן קרוסאובר עם גובה גחון סביר עדיף על רכב חסכוני נמוך. דלק וחנויות יש בקוג'ורי ובמנגליסי,
    ומעבר להם אין כלום.
ar:
  name: منتزه ألغيتي الوطني
  short: غابة شوح وتنوب على بعد ساعة من تبليسي — مسارات معلَّمة هادئة وهواء نقي وزوار شبه معدومين حتى
    في عطلات الأسبوع.
  body: >-
    يقع منتزه ألغيتي الوطني على المنحدر الشرقي لسلسلة ترياليتي قرب مانغليسي، وهو أقرب كتلة غابية كبيرة
    إلى تبليسي. وقيمته نباتية في المقام الأول: فـ**الشوح الشرقي** و**التنوب القوقازي** يبلغان هنا الحد
    الشرقي لانتشارهما. وإلى الغرب، في غابات كولخيس الرطبة، يكون النوعان عاديين تماماً؛ أما في ألغيتي فهما
    نادران بالفعل، وهذا بالضبط سبب حماية المنطقة أصلاً.


    يغطي المنتزه نحو ستة آلاف هكتار ويمتد بين ارتفاعي ألف وألفي متر تقريباً. وقد رُسمت فيه عدة مسارات
    معلَّمة: حلقة قصيرة مدتها تسعون دقيقة تبدأ من مركز الزوار، ودارات أطول من ستة إلى ثمانية كيلومترات
    تصعد إلى الحافة وتفتح إطلالات على وادي ألغيتي. وهناك أماكن للنزهات بطاولات ومواضع مخصصة للخيام لمن
    يرغب في المبيت.


    وألغيتي من الأماكن التي يمكنك المشي فيها ساعات في عطلة نهاية الأسبوع من دون أن تلقى أحداً تقريباً
    — فالسياحة المنظمة لا تكاد تصله، ومن يخرج من تبليسي ليوم واحد يتوقف عادة في كوجوري أو مانغليسي. وتوجد
    هنا أيائل وخنازير برية وثعالب، وتعيش الدببة أيضاً وإن كانت مشاهدتها نادرة. وأواخر الربيع والخريف أفضل
    المواسم، حين تكون الغابة في أزهى ألوانها.
  tip: >-
    الدخول مجاني، لكن مرّ بمركز الزوار للحصول على خريطة وعلى حالة المسارات الراهنة، فالعلامات متضررة في
    مواضع. أربع ساعات تكفي لنزهة يوم جيدة. احمل ماءً وطعاماً — فلا مقهى في المنتزه وأقرب متجر في مانغليسي.
    والقراد موجود في الغابة، فالبس ثياباً ساترة وافحص نفسك بعد الخروج. والتخييم مسموح في المواضع المخصصة
    فقط.
  route: >-
    اخرج من تبليسي على طريق كوجوري وتابع نحو مانغليسي — نحو 60 كم وساعة وعشرين دقيقة. ومن كوجوري إلى مانغليسي
    الإسفلت جيد لكنه ضيق وكثير المنعطفات مع صعود ملموس. أما الكيلومترات الأخيرة إلى مركز زوار المنتزه
    فحصوية وتتحول إلى طين بعد المطر، لذا تُفضَّل سيارة كروس أوفر بخلوص أرضي معقول على سيارة اقتصادية منخفضة.
    الوقود والمتاجر متوفرة في كوجوري ومانغليسي، ولا شيء بعدهما.
