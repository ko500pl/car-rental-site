ka:
  name: ალგეთის ეროვნული პარკი
  short: >-
    საქართველოს ყველაზე აღმოსავლური ნაძვნარ-სოჭნარი მანგლისის თავზე, 1965 წლიდან დაცული: გრილი ტყე, ხუთი
    ბილიკი და თითქმის არავინ.
  body: >-
    **ალგეთი იმ ზღვრის წყალობით არსებობს, რომელიც თვალით არ ჩანს: სწორედ აქ მთავრდება დასავლეთ საქართველოს
    მუქი ნაძვნარ-სოჭნარი.**


    პარკი ალგეთის ზემო წელს, თრიალეთის ქედის აღმოსავლეთ ნაწილის სამხრეთ ფერდობებს მოიცავს — 6800 ჰექტარზე
    მეტს, ზღვის დონიდან დაახლოებით 1100-დან 1950 მეტრამდე; უმაღლესი წერტილი, კლდეკარი, 2000 მეტრს აღწევს.
    აღმოსავლური ნაძვი და კავკასიური სოჭი, ნოტიო დასავლეთში ჩვეულებრივი ხეები, აქ თავიანთი ბუნებრივი არეალის
    აღმოსავლეთ კიდეს აღწევს. სწორედ მათ დასაცავად გამოაცხადა საბჭოთა ხელისუფლებამ ხეობა 1965 წელს სახელმწიფო
    ნაკრძალად, 2007 წელს კი ალგეთმა ეროვნული პარკის სტატუსი მიიღო.


    ტყე ნაბიჯ-ნაბიჯ იცვლება: ნაძვნარს წიფლნარი ენაცვლება — ის აქ ყველაზე დიდ ფართობს იკავებს, — შემდეგ
    მუხნარი, ფიჭვნარი და რცხილნარი. აქ მცენარის 1600-ზე მეტი სახეობაა აღრიცხული. შველი ამ ტყეების მუდმივი
    ბინადარია; აქვე ცხოვრობენ მურა დათვი, მგელი და გარეული ღორი, იშვიათად ფოცხვერიც, მაღლა კი კავკასიური
    როჭო გვხვდება. ხუთი მონიშნული ბილიკი მარტივიდან საშუალო სირთულისაა; ყველაზე გრძელი ორდღიანი მარშრუტია
    სამეფო ქედზე, გზად ტურისტული ქოხით. ჰავა ნოტიო და გრილია, შუა ზაფხულშიც კი.


    კლდეკარი „კლდის კარს“ ნიშნავს. IX საუკუნეში მის კლდეზე ბაღვაშთა ერისთავებმა ციხე ააგეს, XI საუკუნეში
    კი მათი შთამომავალი ლიპარიტ IV ისე გაძლიერდა, რომ საკუთარი მეფე დაამარცხა და მცირეწლოვანი გიორგი II
    რუისში მეფედ აკურთხებინა. როცა მოქიშპე დიდებულებმა ლიპარიტი ბოლოს შეიპყრეს, კლდეკარის აღება სამეფო
    ლაშქარმაც ვერ შეძლო: ციხე მხოლოდ მაშინ დანებდა, როცა მეფემ ლიპარიტისა და მისი ძის სიცოცხლე შეჰპირდა.
    ძლევამოსილმა ერისთავმა დღეები ბერად დაასრულა.


    ადრე მოდით, როცა ნისლი ჯერ კიდევ სოჭების კენწეროებშია გაბმული, და თბილისი, ორ საათზე ნაკლები სავალით
    დაშორებული, სხვა ქვეყანად მოგეჩვენებათ.
  tip: >-
    დაიწყეთ მანგლისის ვიზიტორთა ცენტრიდან: იქ რუკასაც მოგცემენ და ბილიკების მდგომარეობასაც გაგაცნობენ,
    ეზოში კი თოკების პარკია, რომელიც ბავშვებს ძალიან უყვართ. ბილიკებზე სიარული უფასოა; თუ ორდღიან მარშრუტს
    გეგმავთ სამეფო ქედზე, ქოხის შესახებ იქვე იკითხეთ. კარგი ერთდღიანი ლაშქრობისთვის ოთხი საათი საკმარისია.
    ივლისშიც თბილი ტანსაცმელი, წყალი და საკვები წაიღეთ — პარკის შიგნით საყიდელი არაფერია. მაღალ ბალახში
    ტკიპები ბინადრობს: გრძელი შარვალი ჩაიცვით და ბოლოს საკუთარი თავი შეამოწმეთ. საკვები კარგად შეფუთული
    იქონიეთ — დათვი იშვიათად ჩანს, მაგრამ აქ ცხოვრობს.
  route: >-
    თბილისიდან წყნეთისა და კოჯრის გავლით შ36-ზე, თბილისი–მანგლისის გზაზე ახვალთ. კოჯრის შემდეგ გზა ვიწროვდება,
    იკლაკნება და ადგილ-ადგილ ციცაბოა, თუმცა მანგლისამდე სულ ასფალტია. ქალაქის იქით შ31-ით დასავლეთით დაახლოებით
    ცხრა კილომეტრი იარეთ, მერე კი ხრეშიან სატყეო გზაზე გადაუხვიეთ, რომელიც ბოლო ექვსიოდე კილომეტრს პარკის
    შიგნით, ბილიკების დასაწყისამდე გადის და წვიმის შემდეგ ლაფიანდება. სულ დაახლოებით 74 კმ-ია, საათი და
    ოცდათხუთმეტი წუთი. ბოლო მონაკვეთისთვის მაღალი კლირენსის კროსოვერი ან ჯიპი აიღეთ. ავზი თბილისში შეავსეთ;
    მანგლისში მაღაზიებია, მის იქით კი — აღარაფერი.
en:
  name: Algeti National Park
  short: >-
    Georgia's easternmost spruce and fir, protected since 1965 on the Trialeti slopes above Manglisi:
    cool forest, five trails and very few people.
  body: >-
    **Algeti exists because of a line you cannot see: this is where the dark spruce and fir forests of
    western Georgia finally run out.**


    The park covers more than 6,800 hectares of the upper Algeti valley, on the southern slopes of the
    eastern Trialeti range, from about 1,100 to 1,950 metres; its highest point, Kldekari, reaches 2,000.
    Oriental spruce and Nordmann fir, everyday trees in the wet west, stop at the eastern edge of their
    natural range here, and in 1965 the Soviet state made the valley a reserve to protect them. It became
    a national park in 2007.


    Walk in and the forest changes around you. Spruce gives way to beech, which covers the most ground,
    then to oak, pine and hornbeam. More than 1,600 plant species have been recorded. Roe deer live here
    year-round; so do brown bear, wolf and wild boar, with the occasional lynx, and the Caucasian black
    grouse on the high ground. Five marked trails run from easy to moderate; the longest is a two-day
    crossing of Samepo Kedi, the Royal Ridge, with a tourist cottage on the way. The climate is humid
    and cool, even in high summer.


    Kldekari means "rock gate". In the 9th century the Baghvashi dukes built a fortress on its crag, and
    in the 11th their descendant Liparit IV grew strong enough to defeat his own king and have the boy
    George II crowned at Ruisi. When rival nobles finally seized Liparit, even the royal army could not
    take Kldekari; the garrison surrendered only when the king promised to spare Liparit and his son.
    The great duke ended as a monk.


    Come early, while mist still hangs in the fir tops, and Tbilisi, less than two hours away, will feel
    like another country.
  tip: >-
    Start at the visitor centre in Manglisi for maps and the latest trail conditions; its courtyard has
    a rope park that children love. Walking the trails costs nothing; if you plan the two-day Royal Ridge
    route, ask there about the cottage. Four hours makes a good day walk. Bring a warm layer even in July,
    plus water and food, because there is nothing to buy inside the park. Ticks live in the long grass,
    so wear long trousers and check yourself afterwards. Keep food packed away: bears are seldom seen,
    but they are here.
  route: >-
    Climb out of Tbilisi through Tskneti and Kojori onto the Sh36 Tbilisi–Manglisi road. After Kojori
    it turns narrow, winding and steep in places, but it is asphalt all the way to Manglisi. Beyond the
    town follow the Sh31 west for about nine kilometres, then leave it for the gravel forest track that
    covers the last six kilometres or so to the trailheads inside the park and turns to mud after rain.
    That makes about 74 km and an hour and thirty-five minutes in all. Take a crossover or SUV with decent
    ground clearance for the final stretch. Fill the tank in Tbilisi; Manglisi has shops, and beyond it
    there is nothing.
ru:
  name: Алгетский национальный парк
  short: >-
    Самые восточные в Грузии ельники и пихтачи, под охраной с 1965 года, на триалетских склонах над Манглиси:
    прохладный лес, пять троп и очень мало людей.
  body: >-
    **Алгети существует из-за линии, которую нельзя увидеть: именно здесь наконец заканчиваются тёмные
    еловые и пихтовые леса Западной Грузии.**


    Парк занимает больше 6800 гектаров в верховьях долины Алгети, на южных склонах восточной части Триалетского
    хребта, примерно от 1100 до 1950 метров; высшая точка, Клдекари, достигает 2000. Восточная ель и пихта
    Нордмана, обычные деревья влажного запада, здесь доходят до восточной границы своего естественного
    ареала, и в 1965 году советское государство объявило долину заповедником, чтобы их сберечь. Национальным
    парком она стала в 2007-м.


    Углубитесь в парк — и лес вокруг начнёт меняться. Ель уступает буку, который занимает больше всего
    площади, затем дубу, сосне и грабу. Здесь отмечено более 1600 видов растений. Круглый год живут косули;
    живут и бурый медведь, волк, кабан, изредка встречается рысь, а в высокогорье — кавказский тетерев.
    Пять размеченных троп — от лёгких до средних; самая длинная — двухдневный переход по Самепо-Кеди,
    Царскому хребту, с туристическим домиком на пути. Климат влажный и прохладный даже в разгар лета.


    Клдекари значит «скальные ворота». В IX веке эриставы Багваши построили на его утёсе крепость, а в
    XI веке их потомок Липарит IV стал так силён, что разбил собственного царя и короновал в Руиси мальчика
    Георгия II. Когда соперники-вельможи наконец схватили Липарита, даже царское войско не смогло взять
    Клдекари: гарнизон сдался, лишь когда царь пообещал пощадить Липарита и его сына. Великий эристав
    окончил дни монахом.


    Приезжайте рано, пока в верхушках пихт ещё висит туман, — и Тбилиси, до которого меньше двух часов,
    покажется другой страной.
  tip: >-
    Начните с визит-центра в Манглиси: там карты и свежие сведения о состоянии троп, а во дворе верёвочный
    парк, который обожают дети. Ходить по тропам можно бесплатно; если задумали двухдневный маршрут по
    Царскому хребту, спросите там о домике. Четыре часа — хорошая однодневная прогулка. Даже в июле возьмите
    тёплую одежду, а также воду и еду: внутри парка купить нечего. В высокой траве водятся клещи, так
    что надевайте длинные брюки и потом осмотрите себя. Еду держите упакованной: медведей видят редко,
    но они здесь есть.
  route: >-
    Поднимитесь из Тбилиси через Цхнети и Коджори на дорогу Sh36 Тбилиси — Манглиси. После Коджори она
    становится узкой, извилистой, местами крутой, но асфальт идёт до самого Манглиси. За городом езжайте
    по Sh31 на запад около девяти километров, затем сверните на гравийную лесную дорогу: последние шесть
    с небольшим километров она ведёт к началу троп внутри парка, а после дождя превращается в грязь. Всего
    около 74 км и час тридцать пять минут. Для последнего отрезка возьмите кроссовер или внедорожник с
    приличным клиренсом. Заправьтесь в Тбилиси; в Манглиси есть магазины, а дальше — ничего.
fa:
  name: پارک ملی آلگتی
  short: >-
    شرقی‌ترین جنگل‌های پیسه‌آ و نراد گرجستان، حفاظت‌شده از ۱۹۶۵ بر دامنه‌های تریالتی بالای مانگلیسی: جنگلی
    خنک، پنج مسیر و آدم‌هایی انگشت‌شمار.
  body: >-
    **آلگتی به خاطر خطی وجود دارد که نمی‌توان دیدش: این‌جا جایی است که جنگل‌های تیرهٔ پیسه‌آ و نراد غرب
    گرجستان سرانجام به پایان می‌رسند.**


    پارک بیش از ۶٬۸۰۰ هکتار از بخش بالایی درهٔ آلگتی را، بر دامنه‌های جنوبی رشته‌کوه تریالتیِ شرقی، از
    حدود ۱٬۱۰۰ تا ۱٬۹۵۰ متر، در بر می‌گیرد؛ بلندترین نقطه‌اش، کلدکاری، به ۲٬۰۰۰ متر می‌رسد. پیسه‌آی شرقی
    (نوئل شرقی) و نراد نوردمان، درختانی عادی در غرب مرطوب، این‌جا به مرز شرقی پراکنش طبیعی خود می‌رسند،
    و در ۱۹۶۵ دولت شوروی دره را برای حفاظت از آن‌ها ذخیره‌گاه اعلام کرد. در ۲۰۰۷ پارک ملی شد.


    هرچه پیش‌تر بروید، جنگل پیرامونتان دگرگون می‌شود. پیسه‌آ جای خود را به راش می‌دهد که بیشترین پهنه
    را پوشانده، سپس به بلوط، کاج و ممرز. بیش از ۱٬۶۰۰ گونهٔ گیاهی در این‌جا ثبت شده است. شوکاها سراسر
    سال این‌جا زندگی می‌کنند؛ خرس قهوه‌ای، گرگ و گراز نیز، و گاه‌به‌گاه سیاه‌گوش اوراسیایی، و در ارتفاعات
    سیاه‌خروس قفقازی. پنج مسیر نشانه‌گذاری‌شده از آسان تا متوسط هست؛ طولانی‌ترینشان پیمایشی دوروزه بر
    سامِپو کِدی، «یال شاهی»، است، با کلبه‌ای گردشگری در میانهٔ راه. هوا حتی در اوج تابستان مرطوب و خنک
    است.


    کلدکاری یعنی «دروازهٔ صخره». در سدهٔ نهم اریستاوهای (دوک‌های) خاندان باغواشی بر صخرهٔ آن دژی ساختند،
    و در سدهٔ یازدهم نوادهٔ آنان، لیپاریت چهارم، چنان نیرومند شد که شاه خود را شکست داد و در رویسی بر
    سرِ گیورگی دومِ خردسال تاج نهاد. وقتی سرانجام نجیب‌زادگان رقیب لیپاریت را به چنگ آوردند، حتی سپاه
    شاهی نتوانست کلدکاری را بگیرد؛ پادگان تنها زمانی تسلیم شد که شاه قول داد لیپاریت و پسرش را زنده نگه
    دارد. دوک بزرگ عمر را در جامهٔ راهبی به پایان برد.


    زود بیایید، وقتی مه هنوز بر نوک نرادها آویخته است، تا تفلیس، که کمتر از دو ساعت راه است، سرزمینی دیگر
    به نظر آید.
  tip: >-
    از مرکز بازدیدکنندگان در مانگلیسی آغاز کنید تا نقشه و تازه‌ترین وضعیت مسیرها را بگیرید؛ حیاطش پارک
    طناب دارد که بچه‌ها عاشقش‌اند. پیمودن مسیرها هزینه‌ای ندارد؛ اگر پیمایش دوروزهٔ یال شاهی را در نظر
    دارید، همان‌جا دربارهٔ کلبه بپرسید. چهار ساعت برای یک پیاده‌روی یک‌روزهٔ خوب بس است. حتی در ژوئیه
    یک لایه لباس گرم، و آب و غذا، بردارید، چون درون پارک چیزی برای خرید نیست. در علف‌های بلند کنه هست،
    پس شلوار بلند بپوشید و پس از آن خود را وارسی کنید. خوراکی‌ها را بسته‌بندی‌شده نگه دارید: خرس‌ها کمتر
    دیده می‌شوند، اما این‌جا هستند.
  route: >-
    از تفلیس از راه تسخنتی و کوجوری بالا بروید و به جادهٔ Sh36 تفلیس–مانگلیسی برسید. پس از کوجوری جاده
    باریک، پرپیچ‌وخم و در جاهایی پرشیب می‌شود، اما تا مانگلیسی سراسر آسفالت است. پس از شهر حدود نه کیلومتر
    Sh31 را به سوی غرب دنبال کنید و سپس به راه جنگلی شنی بپیچید که شش کیلومتر و اندی پایانی را تا آغاز
    مسیرهای پیاده‌روی درون پارک می‌پیماید و پس از باران گِل‌آلود می‌شود. روی هم حدود ۷۴ کیلومتر و یک ساعت
    و سی‌وپنج دقیقه. برای تکهٔ پایانی کراس‌اوور یا شاسی‌بلندی با فاصلهٔ مناسب از زمین بردارید. در تفلیس
    باک را پر کنید؛ مانگلیسی فروشگاه دارد و پس از آن هیچ.
he:
  name: הפארק הלאומי אלגטי
  short: >-
    יערות האשוחית והאשוח המזרחיים ביותר בגאורגיה, מוגנים מאז 1965 במורדות טריאלטי מעל מנגליסי: יער קריר,
    חמישה שבילים ומעט מאוד אנשים.
  body: >-
    **אלגטי קיים בגלל קו שאי אפשר לראות: כאן נגמרים סוף-סוף יערות האשוחית והאשוח הכהים של מערב גאורגיה.**


    הפארק משתרע על יותר מ-6,800 הקטאר בחלקו העליון של עמק אלגטי, במדרונות הדרומיים של רכס טריאלטי המזרחי,
    מגובה של כ-1,100 עד 1,950 מטרים; הנקודה הגבוהה ביותר שלו, קלדקרי, מגיעה ל-2,000. האשוחית המזרחית ואשוח
    נורדמן, עצים שגרתיים במערב הלח, מגיעים כאן לקצה המזרחי של תפוצתם הטבעית, וב-1965 הכריזה המדינה הסובייטית
    על העמק כשמורה כדי להגן עליהם. ב-2007 הוא הפך לפארק לאומי.


    ככל שנכנסים, היער משתנה סביבכם. האשוחית מפנה את מקומה לאשור, שמכסה את השטח הגדול ביותר, ואחריו לאלון,
    לאורן ולקרפינוס. נרשמו כאן יותר מ-1,600 מיני צמחים. איילי כרמל חיים כאן כל השנה; וכך גם דוב חום, זאב
    וחזיר בר, מדי פעם שונר, ובגבהים — תרנגול-הבר השחור הקווקזי. חמישה שבילים מסומנים נעים בין קל לבינוני;
    הארוך שבהם הוא חצייה בת יומיים של סמפו קדי, "הרכס המלכותי", עם בקתת מטיילים בדרך. האקלים לח וקריר
    גם בלב הקיץ.


    "קלדקרי" פירושו "שער הסלע". במאה התשיעית בנו הדוכסים לבית בגוואשי מבצר על צוקו, ובמאה ה-11 צאצאם ליפריט
    הרביעי התחזק עד כדי כך שהביס את מלכו שלו והכתיר ברואיסי את הילד גיאורגי השני. כשאצילים יריבים תפסו
    לבסוף את ליפריט, אפילו הצבא המלכותי לא הצליח לכבוש את קלדקרי; חיל המצב נכנע רק כשהמלך הבטיח לחוס על
    ליפריט ועל בנו. הדוכס הגדול סיים את ימיו כנזיר.


    בואו מוקדם, כשהערפל עוד תלוי בצמרות האשוחים, וטביליסי, במרחק של פחות משעתיים, תיראה כמו ארץ אחרת.
  tip: >-
    התחילו במרכז המבקרים במנגליסי, לקבלת מפות ומידע עדכני על מצב השבילים; בחצר שלו יש פארק חבלים שילדים
    אוהבים. ההליכה בשבילים אינה עולה כסף; אם אתם מתכננים את מסלול הרכס המלכותי בן היומיים, שאלו שם על
    הבקתה. ארבע שעות מספיקות לטיול יום טוב. הביאו שכבה חמה גם ביולי, וגם מים ואוכל, כי בתוך הפארק אין
    מה לקנות. בעשב הגבוה יש קרציות, אז לבשו מכנסיים ארוכים ובדקו את עצמכם אחר כך. שמרו את האוכל ארוז:
    דובים נראים לעתים רחוקות, אבל הם כאן.
  route: >-
    טפסו מטביליסי דרך צחנטי וקוג'ורי אל כביש Sh36 טביליסי–מנגליסי. אחרי קוג'ורי הוא נעשה צר, מפותל ובמקומות
    תלול, אבל סלול כל הדרך עד מנגליסי. אחרי העיירה סעו מערבה על Sh31 כתשעה קילומטרים, ואז פנו ממנו לדרך
    יער מכוסה חצץ, שמובילה לאורך כשישה הקילומטרים האחרונים אל תחילת השבילים בתוך הפארק והופכת לבוץ אחרי
    גשם. בסך הכול כ-74 ק"מ ושעה ושלושים וחמש דקות. לקטע האחרון קחו קרוסאובר או רכב שטח עם מרווח גחון סביר.
    תדלקו בטביליסי; במנגליסי יש חנויות, ואחריה — כלום.
ar:
  name: حديقة ألغيتي الوطنية
  short: >-
    أقصى غابات التنوب والشوح شرقاً في جورجيا، محمية منذ 1965 على سفوح تريالتي فوق مانغليسي: غابة باردة
    وخمسة دروب وقلة قليلة من الناس.
  body: >-
    **وُجدت ألغيتي بسبب خط لا يُرى: هنا بالذات تنتهي أخيراً غابات التنوب والشوح الداكنة في غرب جورجيا.**


    تغطي الحديقة أكثر من 6800 هكتار من أعالي وادي ألغيتي، على السفوح الجنوبية لسلسلة تريالتي الشرقية،
    من نحو 1100 إلى 1950 متراً؛ وتبلغ أعلى نقطة فيها، كلديكاري، 2000 متر. التنوب الشرقي وشوح نوردمان،
    وهما شجرتان مألوفتان في الغرب الرطب، يبلغان هنا الحد الشرقي لانتشارهما الطبيعي، وفي عام 1965 أعلنت
    الدولة السوفيتية الوادي محميةً لحمايتهما. وصار حديقة وطنية عام 2007.


    كلما توغّلت تغيّرت الغابة من حولك. يفسح التنوب المكان للزان، الذي يغطي أوسع مساحة، ثم للبلوط والصنوبر
    والشَّرد. وقد سُجّل هنا أكثر من 1600 نوع من النباتات. يعيش اليحمور هنا طوال السنة، وكذلك الدب البني
    والذئب والخنزير البري، ويظهر الوشق أحياناً، وفي المرتفعات الطيهوج القوقازي. خمسة دروب معلَّمة تتراوح
    بين السهل والمتوسط؛ أطولها عبور ليومين لساميبو كيدي، «السلسلة الملكية»، مع كوخ للسياح في الطريق. والمناخ
    رطب بارد حتى في عزّ الصيف.


    «كلديكاري» تعني «بوابة الصخر». في القرن التاسع بنى الإريستافيون (الدوقات) من آل باغفاشي قلعة على صخرتها،
    وفي القرن الحادي عشر بلغ سليلهم ليباريت الرابع من القوة حداً هزم معه ملكه نفسه وتوّج الصبي جورجي الثاني
    في رويسي. وحين قبض النبلاء المنافسون على ليباريت أخيراً، عجز حتى الجيش الملكي عن أخذ كلديكاري؛ ولم
    تستسلم الحامية إلا حين وعد الملك بالإبقاء على حياة ليباريت وابنه. وانتهى الدوق العظيم راهباً.


    تعالَ باكراً، والضباب ما زال عالقاً في رؤوس أشجار الشوح، فتبدو تبليسي، على بعد أقل من ساعتين، بلداً
    آخر.
  tip: >-
    ابدأ من مركز الزوار في مانغليسي للحصول على الخرائط وآخر أحوال الدروب؛ وفي فنائه حديقة حبال يعشقها
    الأطفال. المشي في الدروب مجاني؛ وإن كنت تنوي مسار السلسلة الملكية ذا اليومين فاسأل هناك عن الكوخ.
    وتكفي أربع ساعات لنزهة يوم جيدة. احمل طبقة دافئة حتى في يوليو، ومعها الماء والطعام، فلا شيء يُشترى
    داخل الحديقة. يعيش القراد في العشب الطويل، فارتدِ سروالاً طويلاً وافحص نفسك بعدها. أبقِ الطعام مغلّفاً:
    الدببة نادراً ما تُرى، لكنها هنا.
  route: >-
    اصعد من تبليسي عبر تسخنيتي وكوجوري إلى الطريق Sh36 تبليسي–مانغليسي. بعد كوجوري يصير ضيقاً متعرجاً
    وشديد الانحدار في مواضع، لكنه معبّد حتى مانغليسي. بعد البلدة اتبع الطريق Sh31 غرباً نحو تسعة كيلومترات،
    ثم انعطف منه إلى درب الغابة الحصوي الذي يقطع نحو ستة كيلومترات أخيرة حتى بدايات الدروب داخل الحديقة،
    ويتحوّل إلى وحل بعد المطر. المجموع نحو 74 كم وساعة وخمس وثلاثون دقيقة. خذ للمقطع الأخير سيارة كروس
    أوفر أو دفع رباعي بخلوص أرضي لائق. املأ الخزان في تبليسي؛ ففي مانغليسي متاجر، وبعدها لا شيء.
