ka:
  name: მთაწმინდის პანთეონი
  short: >-
    მამადავითის ეკლესიის გარშემო გაშენებული სასაფლაო, სადაც საქართველოს მწერლები და საზოგადო მოღვაწეები
    განისვენებენ.
  body: >-
    **პანთეონი მთაწმინდის კალთაზე, ქალაქზე ორასი მეტრით მაღლა, ვიწრო ტერასებზეა გაშენებული.** მისი ცენტრი
    მამადავითის ეკლესიაა — ადგილი, რომელიც VI საუკუნის ასურელ მამას, დავით გარეჯელს უკავშირდება; გადმოცემით,
    სწორედ აქ იყო მისი გამოქვაბული და წყარო, რომელსაც უშვილო ქალები დღემდე მიმართავენ.


    სასაფლაო ოფიციალურად 1929 წელს დაარსდა, ალექსანდრე გრიბოედოვის გარდაცვალებიდან ასი წლის აღსანიშნავად.
    გრიბოედოვი — რუსი დრამატურგი და დიპლომატი, რომელიც 1829 წელს თეირანში დაიღუპა — აქ თავის ცოლთან, ნინო
    ჭავჭავაძესთან ერთად განისვენებს. ნინო თექვსმეტი წლის იყო, როცა ქვრივი დარჩა; მისი წარწერა საფლავზე
    („შენი გონება და საქმენი უკვდავია, მაგრამ რად გადამრჩა შენ სიყვარული ჩემი?") თბილისში ალბათ ყველაზე
    ხშირად ციტირებული ეპიტაფიაა.


    აქ დაკრძალულნი არიან:


    - ილია ჭავჭავაძე, მწერალი და საზოგადო მოღვაწე, 1907 წელს მოკლული და მოგვიანებით წმინდანად შერაცხული


    - აკაკი წერეთელი, ვაჟა-ფშაველა, ნიკოლოზ ბარათაშვილი, გალაკტიონ ტაბიძე


    - სერგეი ფარაჯანოვი, კინორეჟისორი


    - ზვიად გამსახურდია, პირველი პრეზიდენტი, აქ 2007 წელს გადმოასვენეს


    - ეკატერინე გელაძე, სტალინის დედა


    ეს ტურისტული ობიექტი არ არის და არც ცდილობს იყოს: ბილიკები ვიწროა, ქვის ჯვრები ხავსით არის დაფარული,
    ხმაური მხოლოდ ფოთლებიდან და ქვემოთ დარჩენილი ქალაქიდან მოდის. ზაფხულში აქ გრილა, შემოდგომაზე კი —
    ქალაქის ერთ-ერთი ყველაზე ლამაზი ადგილი.


    პანთეონამდე ასასვლელი ფუნიკულიორი თავისთავად ისტორიული ნაგებობაა: ის 1905 წელს გაიხსნა და მას შემდეგ
    რამდენჯერმე გაჩერდა და აღდგა. შუალედური სადგური სწორედ სასაფლაოსთანაა, რაც იმას ნიშნავს, რომ ბევრი
    მგზავრი აქ ჩამოდის, ხოლო ზემოთ, გასართობ პარკში, სულ სხვა განწყობა ხვდება. ეს კონტრასტი — მოხუცი ქალები
    საფლავებთან და ატრაქციონების ხმა ორასი მეტრით ზემოთ — თბილისზე ბევრს ამბობს.
  tip: >-
    ერთი საათი საკმარისია. პანთეონი ციცაბო ტერასებზეა და ბილიკები ვიწრო, არათანაბარი ქვაფენილით — ეტლისთვის
    შეუძლებელია, კომფორტული ფეხსაცმელი აუცილებელია. ეს მოქმედი ეკლესია და სასაფლაოა: ხმამაღალი საუბარი
    და პიკნიკი შეუფერებელია, ჩაცმის წესები ეკლესიაში მოქმედებს. ტუალეტი ეკლესიის ეზოში მოიძებნება, კაფე
    კი მხოლოდ ზემოთ, პარკში. ფუნიკულიორს შუალედური სადგური აქვს სწორედ პანთეონთან — ეს ყველაზე მარტივი
    გზაა.
  route: >-
    მანქანით მისვლა შესაძლებელია, მაგრამ არასასიამოვნო: მთაწმინდის ვიწრო, ციცაბო და მოსახვევებიანი ქუჩით
    ადიხარ, სადაც ორი მანქანა ძლივს ცილდება და ზამთარში ყინულია. თავად პანთეონთან სამი-ოთხი ადგილია და
    ის ჩვეულებრივ დაკავებულია. ბევრად ჯობია მანქანა ქვემოთ, ჩონქაძის ან ბესიკის ქუჩაზე დატოვო და ფუნიკულიორით
    ერთი გაჩერება ახვიდე, ან ზემოთ, მთაწმინდის პარკის დიდ პარკინგში დააყენო და ფეხით ჩამოხვიდე 15 წუთში.
    ეკონომკლასის მანქანა საკმარისია, მაგრამ სველ ამინდში ფრთხილად.
en:
  name: Mtatsminda Pantheon
  short: The terraced cemetery around the church of St David, where Georgia's writers and public figures
    are buried.
  body: >-
    **The Pantheon sits on the slope of Mtatsminda, two hundred metres above the city, on a series of
    narrow terraces.** Its centre is the church of Mamadaviti, a site connected with the sixth-century
    Assyrian father David of Gareja; by tradition his cave and spring were here, and childless women still
    come to the spring.


    The cemetery was formally founded in 1929, to mark a century since the death of Alexander Griboedov.
    Griboedov, the Russian playwright and diplomat killed in Tehran in 1829, lies here with his Georgian
    wife Nino Chavchavadze. She was sixteen when she was widowed, and the epitaph she had cut — "Your
    mind and deeds are immortal in Russian memory, but why did my love outlive you?" — is the most quoted
    inscription in Tbilisi.


    Also buried here:


    - Ilia Chavchavadze, writer and reformer, murdered in 1907 and later canonised


    - Akaki Tsereteli, Vazha-Pshavela, Nikoloz Baratashvili and Galaktion Tabidze


    - Sergei Parajanov, the film director


    - Zviad Gamsakhurdia, the first president, reburied here in 2007


    - Ekaterine Geladze, Stalin's mother


    This is not a tourist site and does not try to be one. The paths are narrow, the stone crosses are
    furred with moss, and the only noise is leaves and the city left somewhere below. It is cool in summer,
    and in late autumn, when the maples turn, it is one of the most beautiful places in Tbilisi.


    The funicular that brings most people up is itself a piece of history: it opened in 1905 and has closed
    and reopened several times since. Its intermediate station is at the Pantheon, so a good number of
    passengers step off here while the rest carry on to the amusement park at the top. That contrast —
    elderly women tending graves, and the noise of fairground rides two hundred metres higher up the same
    hill — says a fair amount about how Tbilisi uses its mountain.
  tip: >-
    An hour is enough. The pantheon is built on steep terraces with narrow, uneven stone paths: impossible
    with a wheelchair, and proper shoes matter. This is a working church and an active cemetery, so loud
    conversation and picnics are out of place, and dress rules apply inside the church. There is a toilet
    in the church yard; the nearest cafe is up in the park. The funicular has an intermediate station
    right at the Pantheon, which is by far the easiest way to arrive.
  route: >-
    You can drive, but it is not pleasant: the approach is the narrow, steep, hairpinned Mtatsminda Street,
    where two cars barely pass and ice forms in winter. There are three or four spaces at the Pantheon
    itself and they are usually taken. It is far better to leave the car below, on Chonkadze or Besiki
    Street, and ride one stop up on the funicular, or to park in the large car park at Mtatsminda Park
    at the top and walk down for fifteen minutes. An economy car is sufficient, but take care in wet weather.
ru:
  name: Пантеон на Мтацминде
  short: Террасное кладбище вокруг церкви святого Давида, где похоронены грузинские писатели и общественные
    деятели.
  body: >-
    **Пантеон расположен на склоне Мтацминды, на двести метров выше города, на череде узких террас.**
    Его центр — церковь Мамадавити, связанная с ассирийским отцом VI века Давидом Гареджийским; по преданию,
    здесь были его пещера и источник, к которому бездетные женщины приходят до сих пор.


    Кладбище официально основано в 1929 году, к столетию гибели Александра Грибоедова. Русский драматург
    и дипломат, убитый в Тегеране в 1829-м, покоится здесь вместе с женой Нино Чавчавадзе. Она овдовела
    в шестнадцать лет, и высеченная по её воле эпитафия — «Ум и дела твои бессмертны в памяти русской,
    но для чего пережила тебя любовь моя?» — самая цитируемая надпись в Тбилиси.


    Здесь также похоронены:


    - Илья Чавчавадзе, писатель и реформатор, убитый в 1907 году и позже причисленный к лику святых


    - Акакий Церетели, Важа-Пшавела, Николоз Бараташвили, Галактион Табидзе


    - кинорежиссёр Сергей Параджанов


    - Звиад Гамсахурдия, первый президент, перезахороненный здесь в 2007 году


    - Екатерина Геладзе, мать Сталина


    Это не туристический объект и не пытается им быть. Дорожки узкие, каменные кресты обросли мхом, слышны
    только листва и оставшийся где-то внизу город. Летом здесь прохладно, а поздней осенью, когда желтеют
    клёны, это одно из самых красивых мест Тбилиси.


    Фуникулёр, которым сюда поднимается большинство, сам по себе памятник: он открылся в 1905 году и с
    тех пор несколько раз закрывался и возобновлял работу. Промежуточная станция как раз у Пантеона, так
    что часть пассажиров выходит здесь, а остальные едут дальше, в парк аттракционов наверху. Этот контраст
    — пожилые женщины у могил и шум каруселей двумястами метрами выше по той же горе — многое говорит
    о том, как Тбилиси пользуется своей горой.
  tip: >-
    Часа достаточно. Пантеон устроен на крутых террасах с узкими неровными каменными дорожками: в кресле-коляске
    невозможно, нормальная обувь обязательна. Это действующая церковь и действующее кладбище — громкие
    разговоры и пикники неуместны, в храме действуют правила одежды. Туалет есть во дворе церкви, ближайшее
    кафе — наверху, в парке. У фуникулёра есть промежуточная станция прямо у Пантеона: это самый простой
    способ добраться.
  route: >-
    Доехать можно, но приятного мало: подъём идёт по узкой крутой улице Мтацминда с петлями, где две машины
    едва расходятся, а зимой держится лёд. У самого Пантеона три-четыре места, и они обычно заняты. Гораздо
    лучше оставить машину внизу, на улицах Чонкадзе или Бесики, и подняться на одну остановку фуникулёром
    либо припарковаться наверху, на большой стоянке парка Мтацминда, и спуститься пешком за пятнадцать
    минут. Машины эконом-класса достаточно, но в дождь ведите осторожно.
fa:
  name: آرامگاه بزرگان متاتسمیندا
  short: گورستانی پلکانی گرد کلیسای داوود مقدس، جایی که نویسندگان و چهره‌های عمومی گرجستان به خاک سپرده
    شده‌اند.
  body: >-
    **این آرامگاه بر شیب متاتسمیندا و دویست متر بالاتر از شهر، روی چند مهتابی باریک ساخته شده است.** مرکزش
    کلیسای مامداویتی است؛ جایی پیوسته با داوود گارجی، از پدران آشوری سدهٔ ششم. بنا بر روایت غار و چشمهٔ
    او همین‌جا بوده و زنان بی‌فرزند هنوز به آن چشمه می‌آیند.


    گورستان رسماً در ۱۹۲۹ و به مناسبت صدمین سال مرگ الکساندر گریبایدوف بنیاد شد. گریبایدوف، نمایشنامه‌نویس
    و دیپلمات روس که در ۱۸۲۹ در تهران کشته شد، اینجا در کنار همسر گرجی‌اش نینو چاوچاوادزه آرمیده است.
    نینو در شانزده‌سالگی بیوه شد، و سنگ‌نوشته‌ای که سفارش داد — «اندیشه و کارهای تو جاودان است، پس چرا
    عشق من از تو بیشتر زیست؟» — پرنقل‌ترین کتیبهٔ تفلیس است.


    همچنین اینجا به خاک سپرده شده‌اند:


    - ایلیا چاوچاوادزه، نویسنده و اصلاحگر، که در ۱۹۰۷ کشته و بعدها قدیس شمرده شد


    - آکاکی تسرتلی، واژا پشاولا، نیکولوز باراتاشویلی و گالاکتیون تابیدزه


    - سرگئی پاراجانوف، کارگردان سینما


    - زویاد گامساخوردیا، نخستین رئیس‌جمهور، که در ۲۰۰۷ به اینجا منتقل شد


    - اکاترینه گلادزه، مادر استالین


    اینجا مقصد گردشگری نیست و نمی‌کوشد باشد. راه‌ها باریک‌اند، صلیب‌های سنگی خزه بسته‌اند و تنها صدا از
    برگ‌ها و شهری می‌آید که پایین جا مانده است. تابستان خنک است و در اواخر پاییز، وقتی افراها زرد می‌شوند،
    از زیباترین جاهای تفلیس است.


    قطار مایلی که بیشتر مردم را بالا می‌آورد خود تکه‌ای از تاریخ است: در ۱۹۰۵ گشوده شد و از آن پس چند
    بار بسته و دوباره باز شده است. ایستگاه میانی‌اش درست کنار آرامگاه است، پس شماری از مسافران همین‌جا
    پیاده می‌شوند و بقیه تا شهربازی بالای کوه می‌روند. همین تضاد — زنان سالخورده کنار گورها و صدای وسایل
    بازی دویست متر بالاتر بر همان دامنه — دربارهٔ نسبت تفلیس با کوهش بسیار می‌گوید.
  tip: >-
    یک ساعت کافی است. آرامگاه بر مهتابی‌های تند با راه‌های سنگی باریک و ناهموار ساخته شده: با ویلچر ناممکن
    است و کفش مناسب اهمیت دارد. اینجا کلیسایی فعال و گورستانی زنده است، پس گفت‌وگوی بلند و بساط خوراک
    بی‌جاست و در کلیسا قواعد پوشش برقرار است. سرویس بهداشتی در حیاط کلیسا هست و نزدیک‌ترین کافه بالا در
    پارک است. تله‌کابین ریلی ایستگاهی میانی درست کنار آرامگاه دارد و این ساده‌ترین راه رسیدن است.
  route: >-
    رانندگی ممکن است اما خوشایند نیست: مسیر از خیابان باریک و تند و پرپیچ متاتسمیندا بالا می‌رود، جایی
    که دو خودرو به‌زحمت از هم می‌گذرند و زمستان یخ می‌بندد. کنار خود آرامگاه سه چهار جای پارک هست که معمولاً
    پر است. بسیار بهتر است خودرو را پایین در خیابان چونکادزه یا بسیکی بگذارید و یک ایستگاه با تله‌کابین
    ریلی بالا بروید، یا در پارکینگ بزرگ پارک متاتسمیندا در بالا پارک کنید و پانزده دقیقه پیاده پایین بیایید.
    خودروی اقتصادی کافی است، اما در هوای بارانی محتاط باشید.
he:
  name: הפנתיאון במטאצמינדה
  short: בית קברות מדורג סביב כנסיית דוד הקדוש, שבו קבורים סופרי גאורגיה ואישי ציבור שלה.
  body: >-
    **הפנתיאון שוכן במדרון מטאצמינדה, מאתיים מטר מעל העיר, על שורת מדרגות טבע צרות.** מרכזו הוא כנסיית
    מאמאדוויטי, אתר הקשור באב האשורי מן המאה השישית דוד מגרג'ה; לפי המסורת היו כאן מערתו ומעיינו, ונשים
    חשוכות ילדים עדיין באות אל המעיין.


    בית הקברות נוסד רשמית ב-1929, במלאת מאה שנה למותו של אלכסנדר גריבויידוב. המחזאי והדיפלומט הרוסי, שנהרג
    בטהראן ב-1829, קבור כאן עם אשתו הגאורגית נינו צ'אווצ'אוודזה. היא התאלמנה בגיל שש-עשרה, והכתובת שהזמינה
    — "שכלך ומעשיך בני אלמוות, אך מדוע שרדה אותך אהבתי?" — היא הכתובת המצוטטת ביותר בטביליסי.


    כאן קבורים גם:


    - איליה צ'אווצ'אוודזה, סופר ומתקן, שנרצח ב-1907 ולימים הוכרז קדוש


    - אקאקי צרטלי, ואז'ה-פשאוולה, ניקולוז בראטאשווילי וגלקטיון טאבידזה


    - סרגיי פרג'אנוב, במאי הקולנוע


    - זוויאד גמסחורדיה, הנשיא הראשון, שהובא לקבורה כאן מחדש ב-2007


    - אקטרינה גלאדזה, אמו של סטלין


    זהו אינו אתר תיירות ואינו מנסה להיות כזה. השבילים צרים, צלבי האבן מכוסים טחב, והרעש היחיד הוא עלים
    והעיר שנשארה למטה. בקיץ קריר כאן, ובשלהי הסתיו, כשהאדרים מצהיבים, זהו אחד המקומות היפים בטביליסי.


    הרכבל המדרוני שמעלה את רוב המבקרים הוא עצמו פרק היסטורי: הוא נפתח ב-1905 ומאז נסגר ונפתח כמה פעמים.
    תחנת הביניים שלו נמצאת בפנתיאון, ולכן חלק לא מבוטל מן הנוסעים יורדים כאן והשאר ממשיכים לפארק השעשועים
    שבפסגה. הניגוד הזה — נשים מבוגרות מטפחות קברים, ורעש מתקני השעשועים מאתיים מטר מעליהן באותו הר — מספר
    לא מעט על היחס של טביליסי אל ההר שלה.
  tip: >-
    שעה מספיקה. הפנתיאון בנוי על מדרגות תלולות עם שבילי אבן צרים ולא אחידים: בלתי אפשרי בכיסא גלגלים,
    ונעליים טובות חשובות. זו כנסייה פעילה ובית קברות פעיל, ולכן שיחה רמה ופיקניק אינם במקומם, ובכנסייה
    חלים כללי לבוש. יש שירותים בחצר הכנסייה, ובית הקפה הקרוב ביותר למעלה בפארק. לרכבל המדרוני יש תחנת
    ביניים ממש בפנתיאון, וזו הדרך הקלה ביותר להגיע.
  route: >-
    אפשר להגיע ברכב, אך זה לא נעים: העלייה היא ברחוב מטאצמינדה הצר, התלול והמפותל, שבו שני רכבים בקושי
    חולפים זה על פני זה ובחורף נוצר קרח. ליד הפנתיאון עצמו יש שלושה-ארבעה מקומות והם תפוסים בדרך כלל.
    עדיף בהרבה להשאיר את הרכב למטה, ברחובות צ'ונקאדזה או בסיקי, ולעלות תחנה אחת ברכבל, או לחנות למעלה
    בחניון הגדול של פארק מטאצמינדה ולרדת ברגל חמש-עשרה דקות. רכב חסכוני מספיק, אך בגשם יש לנהוג בזהירות.
ar:
  name: مقبرة العظماء في متاتسميندا
  short: مقبرة مدرّجة حول كنيسة القديس داود، يرقد فيها كتّاب جورجيا وشخصياتها العامة.
  body: >-
    **تقع المقبرة على منحدر متاتسميندا، على ارتفاع مئتي متر فوق المدينة، على مصاطب ضيقة متتابعة.** ومركزها
    كنيسة ماماداڤيتي، وهو موضع يرتبط بالأب الآشوري داود الغارجي من القرن السادس؛ وبحسب التقليد كان كهفه
    ونبعه هنا، وما زالت النساء اللواتي لم يُرزقن أطفالاً يقصدن النبع.


    وأُسست المقبرة رسمياً عام 1929 بمناسبة مرور قرن على مقتل ألكسندر غريبايدوف. ويرقد هذا الكاتب المسرحي
    والدبلوماسي الروسي، الذي قُتل في طهران عام 1829، إلى جانب زوجته الجورجية نينو تشافتشافادزه. وقد ترمّلت
    في السادسة عشرة، والكتابة التي أمرت بنقشها — «عقلك وأعمالك خالدة، فلماذا بقي حبي بعدك؟» — أكثر نقش
    يُستشهد به في تبليسي.


    ويُدفن هنا أيضاً:


    - إيليا تشافتشافادزه، الكاتب والمصلح، الذي اغتيل عام 1907 وأُعلن قديساً لاحقاً


    - أكاكي تسيريتيلي وفاجا بشافيلا ونيكولوز باراتاشفيلي وغالاكتيون تابيدزه


    - سيرغي باراجانوف، المخرج السينمائي


    - زفياد غامساخورديا، أول رئيس، ونُقل رفاته إلى هنا عام 2007


    - إيكاترينه غيلادزه، والدة ستالين


    هذا ليس موقعاً سياحياً ولا يسعى إلى ذلك. الممرات ضيقة، والصلبان الحجرية كساها الطحلب، والضجيج الوحيد
    من الأوراق ومن المدينة التي بقيت في الأسفل. وهي باردة في الصيف، وفي أواخر الخريف حين يصفرّ القيقب
    تصير من أجمل أماكن تبليسي.


    والقطار المائل الذي يصعد به معظم الزوار هو نفسه قطعة من التاريخ: افتُتح عام 1905 وأُغلق وأُعيد فتحه
    مرات منذ ذلك الحين. ومحطته الوسطى عند المقبرة تماماً، فينزل عدد من الركاب هنا ويتابع الباقون إلى مدينة
    الملاهي في القمة. وهذا التناقض — نساء مسنّات يعتنين بالقبور، وضجيج ألعاب الملاهي على بعد مئتي متر
    أعلى الجبل نفسه — يقول الكثير عن علاقة تبليسي بجبلها.
  tip: >-
    ساعة تكفي. المقبرة مبنية على مصاطب حادة بممرات حجرية ضيقة غير مستوية: يستحيل اجتيازها بكرسي متحرك،
    والحذاء المناسب مهم. وهذه كنيسة عاملة ومقبرة قائمة، فالحديث المرتفع والطعام في الهواء الطلق غير لائقين،
    وتُطبّق قواعد اللباس داخل الكنيسة. وهناك دورة مياه في فناء الكنيسة، وأقرب مقهى في الأعلى داخل المتنزه.
    وللقطار المائل محطة وسيطة عند المقبرة تماماً، وهي أسهل طرق الوصول.
  route: >-
    يمكن القدوم بالسيارة لكنه غير مريح: فالصعود عبر شارع متاتسميندا الضيق الحاد كثير المنعطفات، حيث تتجاوز
    سيارتان بعضهما بصعوبة ويتكوّن الجليد شتاءً. وعند المقبرة نفسها ثلاثة أو أربعة أماكن مشغولة عادة. والأفضل
    بكثير ترك السيارة في الأسفل في شارع تشونكادزه أو بيسيكي والصعود محطة واحدة بالقطار المائل، أو الوقوف
    في الأعلى في الموقف الكبير لمتنزه متاتسميندا والنزول سيراً في خمس عشرة دقيقة. وسيارة اقتصادية تكفي،
    لكن تمهّل في الطقس الممطر.
