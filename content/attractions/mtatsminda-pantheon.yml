ka:
  name: მთაწმინდის პანთეონი
  short: >-
    ხავსმოდებული ტერასები მამადავითის ეკლესიის ირგვლივ: გრიბოედოვი და ნინო, ილია, ვაჟა, გალაკტიონი — და
    საქართველოს დაუსრულებელი დავა.
  body: >-
    **მთაწმინდის შუაწელზე, სადაც ფუნიკულიორის ორი ვაგონი ერთმანეთს გვერდს უვლის, საქართველო ყველაზე სადავო
    მისამართს ინახავს — იმ ადამიანთა საფლავებს, ვინც ერმა საკუთარად აღიარა.**


    ტერასები მამადავითის აგურის ეკლესიას შემოუყვება. ტაძარი 1859–1871 წლებში აიგო იმ ადგილას, სადაც, გადმოცემით,
    VI საუკუნეში დავით გარეჯელი კლდეში გამოკვეთილ სენაკში მოღვაწეობდა. თქმულების თანახმად, ქალაქის დატოვებამდე
    დავითმა ღმერთს შესთხოვა მთაზე ისეთი წყარო, რომლის დალევაც უშვილო ქალებს შვილს მიანიჭებდა. წყარო დღესაც
    ჩქეფს ეკლესიის მახლობლად, ახლა უკვე საკუთარი პატარა სამლოცველოს ქვეშ.


    პირველი სახელოვანი საფლავი უცხოელისაა. რუსი დრამატურგი და დიპლომატი ალექსანდრე გრიბოედოვი 1829 წლის
    30 იანვარს (11 თებერვალს) თეირანში მოკლეს. მისი ქართველი მეუღლე, ნინო ჭავჭავაძე, თექვსმეტი წლისა იყო.
    ქმრის ანდერძისამებრ, მან გრიბოედოვი ამ ფერდობზე დაასაფლავა და საფლავის ქვაზე ამოაკვეთინა: „შენი გონი
    და საქმენი უკვდავნი არიან რუსულ ხსოვნაში, მაგრამ რისთვის გადაგიცოცხლა ჩემმა სიყვარულმა?“ ნინო აღარ
    გათხოვილა; 1857 წლიდან ის ქმრის გვერდით განისვენებს, მტირალი ქალის ქანდაკების ქვეშ.


    თავად პანთეონი 1929 წელს, გრიბოედოვის სიკვდილის ასი წლისთავზე გამოცხადდა და სახელმწიფომ აქ იმ ადამიანების
    თავმოყრას მიჰყო ხელი, ვისაც პატივს მიაგებდა. დიდუბიდან გადმოასვენეს ნიკოლოზ ბარათაშვილი და ვაჟა-ფშაველა.
    აქ განისვენებენ 1907 წელს მოკლული და დღეს წმინდანად შერაცხული ილია ჭავჭავაძე, აკაკი წერეთელი, გალაკტიონ
    ტაბიძე, მხატვარი ლადო გუდიაშვილი; 2007 წელს გროზნოდან აქ გადმოასვენეს საქართველოს პირველი პრეზიდენტი
    ზვიად გამსახურდია. აქვეა სტალინის დედა, კეკე გელაძე, და ბოლშევიკი ფუნქციონერებიც. ამბობენ, რომ მწერალმა
    კონსტანტინე გამსახურდიამ, ზვიადის მამამ, უარი თქვა აქ დაკრძალვაზე: მისი სიტყვით, იუდა ქრისტეს გვერდით
    მხოლოდ მთაწმინდაზე დაკრძალეს.


    ზემოდან ატრაქციონების შორეული წივილი ისმის, ქვემოდან — ქალაქის გუგუნი. მათ შორის, ხავსმოდებულ ჯვრებში,
    თბილისი დღემდე ჩუმად დაობს იმაზე, ვინ ეკუთვნის ერს.
  tip: >-
    ერთი საათი საკმარისია, შესვლა უფასოა. ტერასები ციცაბოა, ბილიკები ვიწრო და უსწორმასწორო: ეტლით შეუძლებელია,
    წვიმის შემდეგ კი გლუვძირიან ფეხსაცმელში სახიფათოა. მამადავითი მოქმედი ეკლესიაა — ქალები შიგნით თავსაბურავითა
    და ქვედაბოლოთი შედიან, კაცები გრძელი შარვლით; ეზოში ხმადაბლა ილაპარაკეთ, პიკნიკი კი ზემოთ, პარკისთვის
    შემოინახეთ. პანთეონთან კაფე არ არის — უახლოესი ფუნიკულიორის სადგურებთანაა. მოდით დილით, როცა ფერდობი
    მშვიდია და შუქი ქვებს რბილად ეფინება, ან შემოდგომით, როცა ტერასების ირგვლივ ხეები ფერს იცვლის.
  route: >-
    მთაწმინდის ქუჩა ეკლესიამდე ციცაბო, მჭიდრო სერპანტინით ადის: თავისუფლების მოედნიდან სულ რაღაც 3 კილომეტრი
    და ათი წუთია, მაგრამ ორი მანქანა ძლივს ცილდება, ზამთარში გზა იყინება, ჭიშკართან კი სამი-ოთხი ადგილია,
    ისიც თითქმის ყოველთვის დაკავებული. უფრო იოლია, მანქანა ფუნიკულიორის ქვედა სადგურთან, ჭონქაძის ქუჩაზე
    დატოვოთ და ვაგონით ერთი გაჩერება ახვიდეთ: შუალედური სადგური პირდაპირ პანთეონში გაგიყვანთ. ან აიყვანეთ
    მანქანა მთაწმინდის პარკის დიდ ავტოსადგომამდე და დაახლოებით თხუთმეტ წუთში ფეხით ჩამოდით. ეკონომკლასის
    მანქანა გაართმევს თავს; წვიმაში მოსახვევებზე ნელა იარეთ.
en:
  name: Mtatsminda Pantheon
  short: >-
    Moss-grown terraces round St David's church, halfway up the holy mountain: Griboyedov and Nino, Ilia,
    Vazha, Galaktion and Georgia's quarrels.
  body: >-
    **Halfway up Mtatsminda, where the two funicular cars slip past each other, Georgia keeps its most
    argued-over address: the graves of those it calls its own.**


    The terraces climb around the brick church of Mamadaviti, built between 1859 and 1871 where, tradition
    says, the sixth-century monk David of Gareja lived in a cell cut into the rock. Before leaving the
    city, the legend goes, he asked God for a spring whose water would give children to childless women.
    The spring still runs beside the church, now beneath a small chapel.


    The first famous grave belongs to a foreigner. Alexander Griboyedov, the Russian playwright and envoy,
    was killed in Tehran on 30 January (11 February) 1829. His Georgian wife, Nino Chavchavadze, was sixteen.
    As his will asked, she brought him back to this slope and had the stone cut with the words: "Your
    mind and deeds are immortal in Russian memory, but why did my love outlive you?" She never remarried,
    and since 1857 she has lain beside him, beneath the figure of a weeping woman.


    The Pantheon was declared in 1929, on the centenary of his death, and the state began gathering here
    those it chose to honour. Nikoloz Baratashvili and Vazha-Pshavela were moved from Didube. Ilia Chavchavadze,
    murdered in 1907 and now a saint, lies here with Akaki Tsereteli, Galaktion Tabidze and the painter
    Lado Gudiashvili; Zviad Gamsakhurdia, the first president, was reburied from Grozny in 2007. Stalin's
    mother, Keke Geladze, is here too, and so are Bolshevik functionaries. The novelist Konstantine Gamsakhurdia,
    Zviad's father, is said to have refused a place here, writing that only on Mtatsminda had Judas been
    buried beside Christ.


    Above you the fairground shrieks faintly; below, the city hums. Between them, among mossy crosses,
    Tbilisi goes on quietly arguing about who belongs to the nation.
  tip: >-
    An hour is enough, and entry is free. The terraces are steep and the paths narrow and uneven: impossible
    with a wheelchair, treacherous in smooth soles after rain. Mamadaviti is a working church, so women
    cover their heads and wear skirts inside, men long trousers; outside, keep voices low and leave the
    picnic for the park above. There is no café at the Pantheon — the nearest are at the funicular stations.
    Come in the morning, when the slope is quiet and the light is soft on the stones, or in autumn, when
    the trees around the terraces turn.
  route: >-
    Mtatsminda Street climbs to the church in steep, tight hairpins: only about 3 km and ten minutes from
    Freedom Square, but barely wide enough for two cars, icy in winter, and with three or four spaces
    at the gate that are usually taken. The easier way is to park near the lower funicular station on
    Chonkadze Street and ride one stop: the intermediate station opens straight onto the Pantheon. Or
    drive up to the big car park at Mtatsminda Park and walk down for about fifteen minutes. An economy
    car copes; in rain, take the bends slowly.
ru:
  name: Пантеон на Мтацминде
  short: >-
    Замшелые террасы вокруг церкви Святого Давида на полпути к вершине святой горы: Грибоедов и Нино,
    Илья, Важа, Галактион — и грузинские споры.
  body: >-
    **На полпути к вершине Мтацминды, там, где разъезжаются два вагончика фуникулёра, Грузия хранит свой
    самый спорный адрес — могилы тех, кого она называет своими.**


    Террасы поднимаются вокруг кирпичной церкви Мамадавити, построенной в 1859–1871 годах там, где, по
    преданию, в VI веке жил в вырубленной в скале келье монах Давид Гареджийский. Легенда говорит, что
    перед уходом из города он вымолил у Бога источник, вода которого дарует детей бездетным женщинам.
    Родник и сейчас бьёт рядом с церковью — теперь под маленькой часовней.


    Первая знаменитая могила принадлежит иностранцу. Александр Грибоедов, русский драматург и посланник,
    был убит в Тегеране 30 января (11 февраля) 1829 года. Его грузинской жене, Нино Чавчавадзе, было шестнадцать.
    Исполняя его завещание, она привезла его на этот склон и велела высечь на камне: «Ум и дела твои бессмертны
    в памяти русской, но для чего пережила тебя любовь моя!» Замуж она больше не вышла и с 1857 года лежит
    рядом с ним, под фигурой плачущей женщины.


    Пантеон объявили в 1929 году, к столетию гибели Грибоедова, и государство начало собирать здесь тех,
    кого решило почтить. Николоза Бараташвили и Важа Пшавелу перенесли сюда с Дидубе. Здесь лежат Илья
    Чавчавадзе, убитый в 1907 году и ныне причисленный к лику святых, Акакий Церетели, Галактион Табидзе
    и художник Ладо Гудиашвили; первого президента, Звиада Гамсахурдию, перезахоронили здесь в 2007 году,
    перевезя из Грозного. Здесь же мать Сталина, Кеке Геладзе, и большевистские функционеры. Говорят,
    романист Константине Гамсахурдия, отец Звиада, отказался от места в пантеоне, написав, что только
    на Мтацминде Иуду похоронили рядом с Христом.


    Сверху едва слышно визжат аттракционы, снизу гудит город. А между ними, среди замшелых крестов, Тбилиси
    продолжает тихо спорить о том, кто принадлежит нации.
  tip: >-
    Часа хватит, вход бесплатный. Террасы крутые, дорожки узкие и неровные: на инвалидной коляске здесь
    не проехать, а после дождя в обуви с гладкой подошвой легко поскользнуться. Мамадавити — действующая
    церковь: женщины входят с покрытой головой и в юбке, мужчины — в длинных брюках; снаружи говорите
    негромко, а пикник оставьте для парка наверху. Кафе при пантеоне нет — ближайшие у станций фуникулёра.
    Приходите утром, когда на склоне тихо и свет мягко ложится на камни, или осенью, когда деревья вокруг
    террас меняют цвет.
  route: >-
    Улица Мтацминда взбирается к церкви крутыми тесными серпантинами: от площади Свободы всего около 3
    км и десять минут, но две машины на ней едва разъезжаются, зимой бывает гололёд, а три-четыре места
    у ворот обычно заняты. Проще оставить машину у нижней станции фуникулёра на улице Чонкадзе и проехать
    одну остановку: промежуточная станция выходит прямо к пантеону. Или поднимитесь на машине к большой
    парковке парка Мтацминда и спуститесь пешком минут за пятнадцать. Машина эконом-класса справится;
    в дождь проходите повороты медленно.
fa:
  name: پانتئون متاتسمیندا
  short: >-
    تراس‌های خزه‌پوش گرد کلیسای داوود مقدس در میانهٔ کوه مقدس: گریبایدوف و نینو، ایلیا، واژا، گالاکتیون
    — و جدل‌های گرجستان.
  body: >-
    **در میانهٔ راه متاتسمیندا، همان جا که دو واگن فونیکولار از کنار هم می‌گذرند، گرجستان بحث‌برانگیزترین
    نشانی خود را نگه می‌دارد: گور کسانی که آن‌ها را از خود می‌داند.**


    تراس‌ها گرداگرد کلیسای آجری مامادویتی بالا می‌روند؛ کلیسایی که میان ۱۸۵۹ و ۱۸۷۱ در جایی ساخته شد که
    به روایت سنتی، داوود گارجی، راهب سدهٔ ششم، در حجره‌ای کنده در دل صخره می‌زیست. افسانه می‌گوید او پیش
    از ترک شهر از خدا چشمه‌ای خواست که آبش به زنان بی‌فرزند فرزند ببخشد. آن چشمه هنوز کنار کلیسا جاری
    است، اکنون زیر نمازخانه‌ای کوچک.


    نخستین گور نامدار از آنِ یک بیگانه است. الکساندر گریبایدوف، نمایشنامه‌نویس و فرستادهٔ روس، در ۳۰ ژانویه
    (۱۱ فوریه) ۱۸۲۹ در تهران کشته شد. همسر گرجی‌اش، نینو چاوچاوادزه، شانزده سال داشت. او به خواست وصیت‌نامهٔ
    شوهرش، پیکرش را به همین دامنه بازگرداند و بر سنگ گورش نقر کرد: «خرد و کارهای تو در یاد روسیان جاودانه
    است، اما عشق من چرا پس از تو زنده ماند؟» نینو دیگر هرگز ازدواج نکرد و از ۱۸۵۷ در کنار او، زیر پیکرهٔ
    زنی گریان، آرمیده است.


    پانتئون در ۱۹۲۹، در صدمین سالگرد مرگ گریبایدوف، اعلام شد و دولت گردآوردن کسانی را که برای بزرگداشت
    برمی‌گزید در این‌جا آغاز کرد. نیکولوز باراتاشویلی و واژا پشاولا را از دیدوبه به این‌جا آوردند. ایلیا
    چاوچاوادزه، که در ۱۹۰۷ به قتل رسید و امروز قدیس شمرده می‌شود، در کنار آکاکی تسرتلی، گالاکتیون تابیدزه
    و لادو گودیاشویلیِ نقاش در این‌جا آرمیده است؛ زویاد گامساخوردیا، نخستین رئیس‌جمهور، در ۲۰۰۷ از گروزنی
    به این‌جا منتقل و دوباره به خاک سپرده شد. مادر استالین، ککه گلادزه، هم این‌جاست و همچنین کارگزاران
    بلشویک. می‌گویند کنستانتینه گامساخوردیای رمان‌نویس، پدر زویاد، جایی در این‌جا را نپذیرفت و نوشت که
    تنها در متاتسمینداست که یهودا را کنار مسیح به خاک سپرده‌اند.


    بالای سرتان شهربازی آرام جیغ می‌کشد و پایین پایتان شهر همهمه دارد. در میان این دو، لابه‌لای صلیب‌های
    خزه‌گرفته، تفلیس همچنان آرام بر سر این جدل است که چه کسی به ملت تعلق دارد.
  tip: >-
    یک ساعت کافی است و ورود رایگان است. تراس‌ها شیب‌دارند و راه‌ها باریک و ناهموار: با ویلچر ناممکن، و
    پس از باران با کفش کف‌صاف لغزنده و خطرناک. مامادویتی کلیسایی فعال است؛ زنان درون آن سر را می‌پوشانند
    و دامن می‌پوشند، مردان شلوار بلند. بیرون هم آهسته سخن بگویید و پیک‌نیک را برای پارک بالای کوه بگذارید.
    پانتئون کافه ندارد — نزدیک‌ترین‌ها کنار ایستگاه‌های فونیکولار است. صبح بیایید، وقتی دامنه آرام است
    و نور بر سنگ‌ها نرم می‌تابد، یا در پاییز، وقتی درختان گرد تراس‌ها رنگ عوض می‌کنند.
  route: >-
    خیابان متاتسمیندا با پیچ‌های تند و تنگ تا کلیسا بالا می‌رود: از میدان آزادی تنها حدود ۳ کیلومتر و
    ده دقیقه راه است، اما پهنایش به‌زحمت برای دو خودرو بس است، در زمستان یخ می‌بندد و سه چهار جای پارک
    کنار دروازه معمولاً پر است. راه آسان‌تر این است که خودرو را نزدیک ایستگاه پایینی فونیکولار در خیابان
    چونکادزه پارک کنید و یک ایستگاه بالا بروید: ایستگاه میانی درست رو به پانتئون باز می‌شود. یا با خودرو
    تا پارکینگ بزرگ پارک متاتسمیندا بالا بروید و حدود پانزده دقیقه پیاده پایین بیایید. خودروی اقتصادی
    از پس راه برمی‌آید؛ در باران پیچ‌ها را آهسته برانید.
he:
  name: הפנתיאון במטאצמינדה
  short: >-
    טרסות מכוסות טחב סביב כנסיית דוד הקדוש, באמצע ההר הקדוש: גריבויידוב ונינו, איליה, ואז'ה, גלקטיון –
    והמחלוקות של גאורגיה.
  body: >-
    **באמצע הדרך במעלה מטאצמינדה, במקום שבו שני קרונות הפוניקולר חולפים זה על פני זה, שומרת גאורגיה על
    הכתובת השנויה ביותר במחלוקת שלה: קבריהם של אלה שהיא רואה בהם את שלה.**


    הטרסות מטפסות סביב כנסיית הלבנים של מאמדוויתי, שנבנתה בין 1859 ל־1871 במקום שבו, על פי המסורת, חי
    הנזיר דוד מגרג'ה בן המאה השישית בתא חצוב בסלע. האגדה מספרת שלפני שעזב את העיר ביקש מאלוהים מעיין שמימיו
    יעניקו ילדים לנשים עקרות. המעיין עדיין זורם לצד הכנסייה, היום תחת קפלה קטנה.


    הקבר המפורסם הראשון שייך לזר. אלכסנדר גריבויידוב, מחזאי ושליח רוסי, נרצח בטהרן ב־30 בינואר (11 בפברואר)
    1829. אשתו הגאורגית, נינו צ'בצ'בדזה, הייתה בת שש עשרה. כפי שביקש בצוואתו, היא החזירה אותו אל המדרון
    הזה וחרטה על המצבה: "שכלך ומעשיך אלמותיים בזיכרון הרוסי, אבל מדוע האריכה אהבתי ימים אחריך?" היא לא
    נישאה שוב, ומאז 1857 היא טמונה לצידו, תחת דמות של אישה בוכייה.


    הפנתיאון הוכרז ב־1929, במלאת מאה שנה למותו של גריבויידוב, והמדינה החלה לאסוף לכאן את מי שבחרה לכבד.
    ניקולוז ברטשווילי וואז'ה פשאוולה הועברו לכאן מדידובה. איליה צ'בצ'בדזה, שנרצח ב־1907 והוא היום קדוש,
    טמון כאן יחד עם אקאקי צרטלי, גלקטיון טבידזה והצייר לאדו גודיאשווילי; זביאד גמסחורדיה, הנשיא הראשון,
    הובא מגרוזני ונקבר כאן מחדש ב־2007. גם אמו של סטלין, יקטרינה גלדזה, קבורה כאן, וכך גם עסקנים בולשביקים.
    מספרים שהסופר קונסטנטינה גמסחורדיה, אביו של זביאד, סירב למקום כאן וכתב שרק במטאצמינדה נקבר יהודה לצד
    ישו.


    מעליכם צווחות חלושות עולות מפארק השעשועים; ומתחתיכם הומה העיר. וביניהם, בין צלבים מכוסי טחב, טביליסי
    ממשיכה להתווכח בשקט על השאלה מי שייך לאומה.
  tip: >-
    שעה מספיקה, והכניסה חינם. הטרסות תלולות והשבילים צרים ומשובשים: בלתי אפשריים בכיסא גלגלים, ומסוכנים
    בנעליים עם סוליה חלקה אחרי גשם. מאמדוויתי היא כנסייה פעילה, ולכן נשים מכסות את הראש ולובשות חצאית
    בפנים, וגברים מכנסיים ארוכים; בחוץ דברו בשקט, ואת הפיקניק השאירו לפארק שלמעלה. בפנתיאון אין בית קפה
    – הקרובים ביותר נמצאים בתחנות הפוניקולר. בואו בבוקר, כשהמדרון שקט והאור רך על האבנים, או בסתיו, כשהעצים
    סביב הטרסות מחליפים צבע.
  route: >-
    רחוב מטאצמינדה מטפס אל הכנסייה בסרפנטינות תלולות וצפופות: רק כ־3 ק"מ ועשר דקות מכיכר החירות, אבל הוא
    בקושי רחב מספיק לשתי מכוניות, קפוא בחורף, ושלושה־ארבעה מקומות החנייה ליד השער בדרך כלל תפוסים. הדרך
    הקלה יותר היא לחנות ליד התחנה התחתונה של הפוניקולר ברחוב צ'ונקדזה ולנסוע תחנה אחת: תחנת הביניים נפתחת
    היישר אל הפנתיאון. אפשר גם לנסוע עד החניון הגדול של פארק מטאצמינדה ולרדת ברגל כרבע שעה. רכב בקטגוריית
    אקונומי מסתדר; בגשם קחו את הסיבובים לאט.
ar:
  name: مقبرة العظماء في متاتسميندا
  short: >-
    مدرّجات يكسوها الطحلب حول كنيسة القديس داود في منتصف الجبل المقدس: غريبويدوف ونينو، وإيليا وفاجا وغالاكتيون،
    وخلافات جورجيا.
  body: >-
    **في منتصف الطريق إلى قمة متاتسميندا، حيث تتجاوز عربتا القطار الجبلي المائل (الفونيكولار) إحداهما
    الأخرى، تحتفظ جورجيا بأكثر عناوينها إثارةً للجدل: قبور من تعدّهم أبناءها.**


    تتصاعد المدرّجات حول كنيسة مامادافيتي المبنية بالآجرّ، التي شُيّدت بين 1859 و1871 في المكان الذي تقول
    الرواية المتوارثة إن الراهب داود الغاريجي عاش فيه في القرن السادس داخل صومعة منحوتة في الصخر. وتروي
    الأسطورة أنه قبل رحيله عن المدينة سأل الله نبعًا يهب ماؤه الأطفال للنساء العاقرات. وما زال النبع يجري
    بجوار الكنيسة، تحت مصلّى صغير اليوم.


    أول قبر شهير هنا لرجل أجنبي. فقد قُتل ألكسندر غريبويدوف، الكاتب المسرحي والمبعوث الروسي، في طهران
    يوم 30 يناير (11 فبراير) 1829. وكانت زوجته الجورجية نينو تشافتشافادزه في السادسة عشرة. وكما أوصى،
    أعادته إلى هذا المنحدر، ونقشت على شاهد قبره: «عقلك وأعمالك خالدة في الذاكرة الروسية، فلماذا بقي حبي
    حيًّا بعدك؟» ولم تتزوج بعده قط، وهي ترقد منذ 1857 إلى جانبه، تحت تمثال امرأة باكية.


    أُعلن المكان مقبرةً للعظماء عام 1929، في الذكرى المئوية لوفاة غريبويدوف، وبدأت الدولة تجمع فيه من
    اختارت تكريمهم. نُقل إليه نيكولوز باراتاشفيلي وفاجا بشافيلا من ديدوبي. ويرقد هنا إيليا تشافتشافادزه،
    الذي اغتيل عام 1907 وصار اليوم قديسًا، مع أكاكي تسيريتيلي وغالاكتيون تابيدزه والرسام لادو غودياشفيلي؛
    أما زفياد غامساخورديا، أول رئيس للبلاد، فقد أُعيد دفنه هنا عام 2007 بعد نقل رفاته من غروزني. وهنا
    أيضًا والدة ستالين، كيكي غيلادزه، وعدد من الموظفين البلاشفة. ويُروى أن الروائي كونستانتينه غامساخورديا،
    والد زفياد، رفض أن يُدفن هنا، وكتب أن متاتسميندا وحدها دُفن فيها يهوذا إلى جانب المسيح.


    فوقكم تتعالى صرخات مدينة الملاهي خافتة، وتحتكم تهمهم المدينة. وبينهما، بين الصلبان المكسوة بالطحلب،
    تواصل تبليسي جدالها الهادئ حول من ينتمي إلى الأمة.
  tip: >-
    تكفي ساعة، والدخول مجاني. المدرّجات شديدة الانحدار والممرات ضيقة وغير مستوية: مستحيلة على الكرسي المتحرك،
    وخطرة بالأحذية ذات النعال الملساء بعد المطر. مامادافيتي كنيسة تُقام فيها الصلوات، لذا تغطي النساء
    رؤوسهن ويرتدين تنانير في الداخل، ويرتدي الرجال سراويل طويلة؛ وفي الخارج اخفضوا أصواتكم واتركوا النزهة
    للحديقة في الأعلى. لا مقهى في المقبرة، وأقرب المقاهي عند محطات القطار الجبلي. تعالوا صباحًا، حين يهدأ
    المنحدر ويلين الضوء على الحجارة، أو في الخريف حين تتلوّن الأشجار حول المدرّجات.
  route: >-
    يصعد شارع متاتسميندا إلى الكنيسة في منعطفات حادة وضيقة: المسافة من ساحة الحرية نحو 3 كم وعشر دقائق
    فقط، لكن الشارع بالكاد يتسع لسيارتين، ويتجمد في الشتاء، والأماكن الثلاثة أو الأربعة عند البوابة مشغولة
    في العادة. الأسهل أن تركنوا قرب المحطة السفلى للقطار الجبلي في شارع تشونكادزه وتركبوا محطة واحدة:
    فالمحطة الوسطى تنفتح مباشرة على المقبرة. أو اصعدوا بالسيارة إلى الموقف الكبير في حديقة متاتسميندا
    وانزلوا مشيًا نحو ربع ساعة. تكفي سيارة من الفئة الاقتصادية؛ وفي المطر خذوا المنعطفات ببطء.
