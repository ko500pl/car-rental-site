ka:
  name: ორკარის კანიონი
  short: >-
    ნაკლებად ცნობილი კანიონი გურიაში, სოფელ მოედანთან, რომელიც ორ „კარად“ იყოფა: მარცხნივ — იოლი ბილიკი
    ჩანჩქერამდე, მარჯვნივ — ალპინისტების გზა.
  body: >-
    **სახელი ყველაფერს ამბობს: დაახლოებით 700 მეტრის შემდეგ კანიონი ორად იყოფა — ორი კარი იღება და ერთ-ერთი
    უნდა აირჩიოთ.**


    კანიონი ლანჩხუთის მუნიციპალიტეტში, სოფელ მოედანთან, შიდა გურიის დაბალ, მწვანე გორებში მდებარეობს.
    მისი სიგრძე თითქმის ერთი კილომეტრია და დღემდე ბევრისთვის, თავად გურულების დიდი ნაწილისთვისაც კი, უცნობია.
    ზაფხულში, რაც უფრო ღრმად შედიხართ კლდეებს შორის, ჰაერი მით უფრო გრილდება.


    ორი კარი ორ სრულიად განსხვავებულ დღეს გპირდებათ. მარცხენა განშტოება ტექნიკურ უნარს არ მოითხოვს — მას
    ნებისმიერი ფეხმაგარი მოგზაური გაივლის — და ჩანჩქერთან მთავრდება, რომელსაც რთული ნახაზის კიბე ახლავს.
    მარჯვენა განშტოება ალპინისტებს ეკუთვნის: აქ სპეციალური აღჭურვილობაა საჭირო, ზოგან კი გზის გაგრძელება
    მხოლოდ წყალში გავლით შეიძლება.


    ორკარს არც მატიანე ახსენებს და არც მასზე დაწერილი თქმულება შემორჩენილა. კანიონი წყალს დარჩა — და ამიტომაცაა,
    რომ მასში შესვლა დღესაც აღმოჩენას ჰგავს და არა ტურისტულ ვიზიტს.
  tip: >-
    შესვლა უფასოა; აქ არც დარაჯია, არც ინფრასტრუქტურა — არც ავტოსადგომი, არც საპირფარეშო, არც სასმელი
    წყალი, ამიტომ ყველაფერი თან იქონიეთ. რუკაზე მონიშნული წერტილი მოედნის ცენტრია და არა ბილიკის დასაწყისი,
    ამიტომ კანიონისკენ მიმავალი გზა სოფელში იკითხეთ. მხოლოდ მარცხენა განშტოებაა ჩვეულებრივი მოგზაურისთვის;
    მარჯვენაში მხოლოდ სამთო აღჭურვილობით და გზის მცოდნე ადამიანთან ერთად შედით. ჩაიცვით მოუცურებელი ფეხსაცმელი,
    რომლის დასველებაც არ გენანებათ, და ძლიერი წვიმის შემდეგ ნუ წახვალთ — ვიწრო ხეობაში წყალი სწრაფად იმატებს.
    საუკეთესო სეზონი ზაფხულია; საათნახევარი გამოყავით. შემდეგ ურეკის პლაჟებზე იოლად ჩახვალთ.
  route: >-
    თბილისიდან დაახლოებით 302 კილომეტრია, ოთხი საათი და ოცდახუთი წუთი. ს1-ით (E60) დასავლეთით, ქუთაისის
    გვერდით სამტრედიამდე იარეთ, შემდეგ ს12-ით ლანჩხუთის გავლით ზღვისკენ. ლანჩხუთის შემდეგ სამხრეთით, შ82-ზე
    გადაუხვიეთ ნინოშვილის მიმართულებით და სოფლის გზებით მოედნამდე მიდით. გზა თანდათან ვიწროვდება და უარესდება,
    ბოლოს კი გრუნტის ბილიკად იქცევა; მანქანა იქ დატოვეთ, სადაც წინსვლას აზრი აღარ აქვს, და ფეხით განაგრძეთ.
    მშრალ ამინდში ეკონომკლასის მანქანა გაუძლებს, წვიმის შემდეგ კი ბოლო მონაკვეთი ტალახად იქცევა. საწვავი
    სამტრედიაში ან ლანჩხუთში ჩაასხით — სოფელში ბენზინგასამართი არ არის.
en:
  name: Orkari Canyon
  short: >-
    A little-known canyon near Moedani in Guria that splits into two “doors”: an easy walk to a waterfall
    on the left, a climbers' route on the right.
  body: >-
    **Orkari means “two doors”, and about 700 metres in, the canyon shows you why: the rock divides, and
    you have to choose.**


    The canyon lies near the village of Moedani in Lanchkhuti municipality, in the low green hills of
    inland Guria. It runs for almost a kilometre and is still little known, even to many people who live
    in Guria. In summer the air cools as you walk in towards the rock.


    The two doors lead to very different days. The left branch is non-technical, a walk anyone steady
    on their feet can manage, and it ends at a waterfall with an intricate stairway. The right branch
    belongs to climbers: it needs proper equipment, and in places the only way on is through the water.


    No chronicle mentions Orkari, and no legend about it has been written down. The canyon has been left
    to the water, which is why walking into it still feels like a discovery rather than a visit.
  tip: >-
    Free, unstaffed and without facilities: no car park, toilets or drinking water, so bring what you
    need. The map pin marks the centre of Moedani, not the trailhead, so ask in the village for the path
    into the canyon. Only the left branch is for casual walkers; attempt the right one only with climbing
    gear and someone who knows the route. Wear shoes that grip and can get wet, and stay out after heavy
    rain, when water rises fast in any narrow gorge. Summer is the season; allow an hour and a half. Afterwards,
    the beaches at Ureki are a short drive away.
  route: >-
    From Tbilisi it is about 302 km, roughly four hours twenty-five minutes. Take the S1 (E60) west past
    Kutaisi to Samtredia, then the S12 through Lanchkhuti towards the coast. Beyond Lanchkhuti turn south
    onto the Sh82 towards Ninoshvili and follow village roads to Moedani. The road narrows and roughens
    as it goes and finally gives out on a dirt track; park where it stops being sensible and walk on.
    In dry weather an economy car copes; after rain the last stretch turns to mud. Fuel up in Samtredia
    or Lanchkhuti, as there is nothing in the village.
ru:
  name: Каньон Оркари
  short: >-
    Малоизвестный каньон у села Моедани в Гурии, который расходится на две «двери»: слева — лёгкая прогулка
    к водопаду, справа — маршрут для скалолазов.
  body: >-
    **«Оркари» значит «две двери», и примерно через 700 метров каньон объясняет почему: скала раздваивается,
    и приходится выбирать.**


    Каньон лежит у села Моедани в Ланчхутском муниципалитете, среди невысоких зелёных холмов внутренней
    Гурии. Он тянется почти на километр и до сих пор малоизвестен — даже многим жителям самой Гурии. Летом,
    пока идёшь вглубь, к скалам, воздух заметно свежеет.


    Две двери ведут в совершенно разные дни. Левая ветка не требует никакой техники: пройти её сможет
    любой, кто уверенно держится на ногах, и заканчивается она у водопада с причудливой лестницей. Правая
    принадлежит скалолазам: здесь нужно настоящее снаряжение, а местами дальше можно пробраться только
    по воде.


    Ни одна летопись не упоминает Оркари, и ни одна легенда о нём не записана. Каньон оставлен воде —
    поэтому, входя в него, и сейчас чувствуешь, что совершаешь открытие, а не посещение.
  tip: >-
    Бесплатно, без смотрителей и без инфраструктуры: ни парковки, ни туалетов, ни питьевой воды — берите
    с собой всё необходимое. Точка на карте отмечает центр Моедани, а не начало тропы, так что спросите
    в селе, как пройти к каньону. Для обычных пеших прогулок годится только левая ветка; на правую идите
    лишь со скалолазным снаряжением и с тем, кто знает маршрут. Нужна обувь, которая не скользит по камню
    и которую не жалко намочить; после сильного дождя не заходите — в любом узком ущелье вода поднимается
    быстро. Сезон — лето; закладывайте полтора часа. После каньона до пляжей Уреки совсем недалеко.
  route: >-
    От Тбилиси около 302 км, примерно четыре часа двадцать пять минут. Езжайте по S1 (E60) на запад мимо
    Кутаиси до Самтредиа, затем по S12 через Ланчхути в сторону моря. За Ланчхути сверните на юг, на Sh82
    в направлении Ниношвили, и сельскими дорогами доберитесь до Моедани. Дорога постепенно сужается и
    портится, а в конце переходит в грунтовку; оставьте машину там, где ехать дальше уже неразумно, и
    идите пешком. В сухую погоду машина эконом-класса справится; после дождя последний участок превращается
    в грязь. Заправьтесь в Самтредиа или Ланчхути — в селе заправки нет.
fa:
  name: کانیون اورکاری
  short: >-
    کانیونی کم‌شناخته نزدیک روستای موئدانی در گوریا که به دو «در» تقسیم می‌شود: سمت چپ پیاده‌رویی آسان
    تا یک آبشار، سمت راست مسیری برای صخره‌نوردان.
  body: >-
    **«اورکاری» یعنی «دو در»، و حدود ۷۰۰ متر که جلو بروید، کانیون خودش دلیلش را نشان می‌دهد: صخره دو شاخه
    می‌شود و باید یکی را برگزینید.**


    این کانیون نزدیک روستای موئدانی در شهرستان لانچخوتی، میان تپه‌های کم‌ارتفاع و سبز گوریای درونی، قرار
    دارد. نزدیک به یک کیلومتر طول دارد و هنوز کم‌تر شناخته شده است، حتی برای بسیاری از مردم خود گوریا.
    تابستان، هرچه به سوی صخره‌ها پیش‌تر بروید، هوا خنک‌تر می‌شود.


    این دو در به دو روز کاملاً متفاوت باز می‌شوند. شاخهٔ چپ به هیچ مهارت فنی نیاز ندارد؛ هر کس که پاهایش
    استوار باشد از پسش برمی‌آید، و به آبشاری با پلکانی درهم‌تنیده می‌رسد. شاخهٔ راست از آنِ صخره‌نوردان
    است: تجهیزات درست و حسابی می‌خواهد و در بخش‌هایی تنها راه پیش رفتن، گذشتن از میان آب است.


    هیچ وقایع‌نامه‌ای از اورکاری نام نبرده و هیچ افسانه‌ای دربارهٔ آن نوشته نشده است. کانیون را به آب
    سپرده‌اند، و برای همین است که قدم گذاشتن در آن هنوز بیشتر به کشف می‌ماند تا بازدید.
  tip: >-
    رایگان، بی‌نگهبان و بی‌امکانات است: نه پارکینگ دارد، نه سرویس بهداشتی، نه آب آشامیدنی؛ هرچه لازم دارید
    با خود ببرید. نشانگر روی نقشه مرکز روستای موئدانی را نشان می‌دهد، نه ابتدای مسیر را؛ پس در روستا راه
    ورود به کانیون را بپرسید. فقط شاخهٔ چپ برای پیاده‌روهای معمولی مناسب است؛ شاخهٔ راست را تنها با تجهیزات
    صخره‌نوردی و همراه کسی که مسیر را می‌شناسد امتحان کنید. کفشی بپوشید که روی سنگ نلغزد و خیس شدنش مهم
    نباشد، و پس از باران شدید وارد نشوید؛ در هر درهٔ تنگی آب به‌سرعت بالا می‌آید. فصل مناسب تابستان است؛
    یک ساعت و نیم وقت بگذارید. پس از آن، ساحل‌های اورکی با رانندگی کوتاهی در دسترس‌اند.
  route: >-
    از تفلیس حدود ۳۰۲ کیلومتر راه است، نزدیک به چهار ساعت و بیست‌وپنج دقیقه. از جادهٔ S1 (E60) رو به غرب،
    از کنار کوتایسی تا سامتردیا بروید، سپس از S12 از میان لانچخوتی به سوی ساحل برانید. پس از لانچخوتی
    به جنوب بپیچید و وارد Sh82 به سمت نینوشویلی شوید و از جاده‌های روستایی خود را به موئدانی برسانید.
    جاده رفته‌رفته باریک‌تر و ناهموارتر می‌شود و سرانجام به راهی خاکی می‌رسد؛ جایی که ادامه دادن دیگر
    عاقلانه نیست پارک کنید و پیاده ادامه دهید. در هوای خشک یک خودروی اقتصادی از پس راه برمی‌آید؛ پس از
    باران، تکهٔ آخر گل‌آلود می‌شود. در سامتردیا یا لانچخوتی سوخت‌گیری کنید؛ در روستا هیچ پمپ بنزینی نیست.
he:
  name: קניון אורקרי
  short: 'קניון שמעטים מכירים ליד הכפר מואדני שבגוריה, המתפצל לשתי "דלתות": משמאל הליכה קלה אל מפל, מימין
    מסלול למטפסים.'
  body: >-
    **אורקרי פירושו "שתי דלתות", ואחרי כ־700 מטרים הקניון מראה לכם למה: הסלע מתפצל, ועליכם לבחור.**


    הקניון שוכן ליד הכפר מואדני שבמוניציפליטת לנצ׳חותי, בין הגבעות הירוקות והנמוכות של פנים גוריה. אורכו
    כמעט קילומטר, והוא עדיין כמעט אינו מוכר — אפילו לרבים מתושבי גוריה עצמה. בקיץ האוויר מתקרר ככל שנכנסים
    פנימה, אל הסלע.


    שתי הדלתות מובילות לשני ימים שונים לגמרי. הענף השמאלי אינו טכני — הליכה שכל מי שיציב על רגליו יכול
    לעמוד בה — והוא מסתיים במפל ולצידו גרם מדרגות סבוך. הענף הימני שייך למטפסים: הוא דורש ציוד של ממש,
    ובמקומות מסוימים הדרך היחידה להתקדם עוברת בתוך המים.


    שום כרוניקה אינה מזכירה את אורקרי, ושום אגדה עליו לא נכתבה. הקניון נותר בידי המים, ולכן הכניסה אליו
    עדיין מרגישה כמו תגלית ולא כמו ביקור.
  tip: >-
    חינם, ללא צוות וללא מתקנים: אין חניון, אין שירותים ואין מי שתייה — הביאו איתכם את כל מה שצריך. הסיכה
    במפה מסמנת את מרכז הכפר מואדני ולא את תחילת השביל, אז שאלו בכפר איך נכנסים לקניון. רק הענף השמאלי
    מתאים למטיילים מן השורה; לימני צאו רק עם ציוד טיפוס ועם מי שמכיר את המסלול. נעלו נעליים עם אחיזה טובה,
    שלא אכפת לכם שיירטבו, ואל תיכנסו אחרי גשם כבד — בכל ערוץ צר המים עולים מהר. העונה היא הקיץ; הקדישו
    שעה וחצי. אחר כך, חופי אורקי במרחק נסיעה קצרה.
  route: >-
    מטביליסי כ־302 ק"מ, בערך ארבע שעות ועשרים וחמש דקות. סעו בכביש S1 (E60) מערבה, על פני קוטאיסי עד סמטרדיה,
    ומשם בכביש S12 דרך לנצ׳חותי לכיוון החוף. אחרי לנצ׳חותי פנו דרומה לכביש Sh82 לכיוון נינושווילי, והמשיכו
    בדרכים כפריות עד מואדני. הדרך הולכת ונעשית צרה ומשובשת יותר, ולבסוף הופכת לדרך עפר; חנו במקום שבו
    כבר אין טעם להמשיך, והמשיכו ברגל. במזג אוויר יבש רכב חסכוני יסתדר; אחרי גשם הקטע האחרון הופך לבוץ.
    תדלקו בסמטרדיה או בלנצ׳חותי — בכפר אין תחנת דלק.
ar:
  name: أخدود أوركاري
  short: >-
    وادٍ ضيق قليل الشهرة قرب قرية مويداني في غوريا، ينقسم إلى «بابين»: إلى اليسار نزهة سهلة حتى شلال،
    وإلى اليمين مسار لمتسلقي الصخور.
  body: >-
    **اسم «أوركاري» يعني «بابَين»، وبعد نحو 700 متر يُريك الوادي السبب: تنشقّ الصخرة إلى شعبتين، وعليك
    أن تختار.**


    يقع الوادي قرب قرية مويداني في بلدية لانتشخوتي، بين تلال غوريا الداخلية الخضراء المنخفضة. يمتد قرابة
    كيلومتر، ولا يزال قليل الشهرة، حتى لدى كثيرين من أهل غوريا أنفسهم. وفي الصيف يبرد الهواء كلما توغّلت
    نحو الصخر.


    يقود البابان إلى يومين مختلفين تمامًا. الشعبة اليسرى لا تتطلب أي مهارة تقنية، ويقدر على اجتيازها كل
    من يثبت على قدميه، وتنتهي عند شلال بجانبه درج متشابك. أما الشعبة اليمنى فهي للمتسلقين: تحتاج إلى معدات
    حقيقية، وفي بعض المواضع لا سبيل إلى التقدم إلا عبر الماء.


    لم تذكر أوركاري أيُّ حوليّة، ولم تُدوَّن عنها أي أسطورة. لقد تُرك الوادي للماء، ولهذا ما زال دخوله
    يشبه الاكتشاف أكثر مما يشبه الزيارة.
  tip: >-
    الدخول مجاني، ولا موظفين ولا مرافق: لا موقف سيارات ولا دورات مياه ولا ماء للشرب، فاحمل معك كل ما تحتاجه.
    تشير العلامة على الخريطة إلى وسط قرية مويداني لا إلى بداية المسار، فاسأل في القرية عن الطريق إلى الوادي.
    الشعبة اليسرى وحدها تصلح للمتنزهين العاديين؛ أما اليمنى فلا تقصدها إلا بمعدات تسلق ومع من يعرف المسار.
    انتعل حذاءً ثابت القبضة لا يضيره البلل، وتجنّب الدخول بعد الأمطار الغزيرة، فالماء يرتفع سريعًا في
    أي وادٍ ضيق. الموسم هو الصيف؛ خصّص ساعة ونصف الساعة. وبعدها، شواطئ أوريكي على مسافة قصيرة بالسيارة.
  route: >-
    تبعد عن تبليسي نحو 302 كم، أي قرابة أربع ساعات وخمس وعشرين دقيقة. اسلك الطريق S1 (E60) غربًا متجاوزًا
    كوتايسي حتى سامتريديا، ثم الطريق S12 عبر لانتشخوتي باتجاه الساحل. بعد لانتشخوتي انعطف جنوبًا إلى الطريق
    Sh82 باتجاه نينوشفيلي، ثم تابع الطرق القروية حتى مويداني. يضيق الطريق ويزداد وعورة شيئًا فشيئًا، حتى
    ينتهي بمسار ترابي؛ اركن سيارتك حيث يصبح المضي بها غير معقول، وأكمل سيرًا. في الطقس الجاف تكفي سيارة
    اقتصادية؛ أما بعد المطر فيتحول المقطع الأخير إلى وحل. تزوّد بالوقود في سامتريديا أو لانتشخوتي، إذ
    لا محطة وقود في القرية.
