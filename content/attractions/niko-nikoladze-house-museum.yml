ka:
  name: ნიკო ნიკოლაძის სახლ-მუზეუმი
  short: >-
    კრემისფერი ვილა იმერეთის დაბლობზე, სადაც ციურიხში განსწავლულმა რეფორმატორმა საქართველოს ერთადერთი
    ქარის ძრავა ააგო და მზის საათი პარიზში შეუკვეთა.
  body: >-
    **ნიკო ნიკოლაძემ ერთხელ კარლ მარქსის შეთავაზებაზე უარი თქვა; 1910 წელს კი დიდ ჯიხაიშში, საკუთარ ეზოში,
    ჭიდან წყლის ამოსატუმბად ქარის ძრავა ააგო — პირველი და ერთადერთი საქართველოში.**


    1843 წელს ქუთაისში დაბადებული ნიკოლაძე 1861 წელს სტუდენტურ გამოსვლებში მონაწილეობისთვის პეტერბურგის
    უნივერსიტეტიდან გარიცხეს. 1868 წელს კი მან ციურიხში სამართლის დოქტორის ხარისხი მოიპოვა — პირველმა
    ქართველმა ევროპულ უნივერსიტეტში. იქ შეხვდა მარქსს, რომელმაც ამიერკავკასიაში ინტერნაციონალის წარმომადგენლობა
    შესთავაზა; ნიკომ უარი უთხრა. გაზეთებს თბილისსა და პარიზში აარსებდა, რკინიგზისა და გროზნო–ფოთის ნავთობსადენისთვის
    იბრძოდა, 1894–1912 წლებში კი, როგორც ფოთის ქალაქის თავი, პატარა ნავსადგური სავაჭრო ქალაქად აქცია.


    ოჯახი აქ 1886 წელს დასახლდა — სწორედ მაშინ აშენდა სახლი. სამჯერ გადაკეთდა და საბოლოო სახე 1910-იან
    წლებში შვედი არქიტექტორის, ფრიდის, პროექტით მიიღო: კრემისფერი ვილა მაღალ სარდაფზე, შემინული აივნებით
    და შუაში კოშკით, რომელიც თაღოვან ლოჯად იხსნება. სახურავის კრამიტი მარსელიდანაა ჩამოტანილი და ზოგან
    სარკმლის მოვალეობასაც ასრულებს. მუზეუმის ცნობით, აივნებისა და სარდაფებისთვის ევროპიდან ჩამოტანილი
    ბეტონი რუსეთის იმპერიაში საცხოვრებელი სახლის მშენებლობაში პირველად სწორედ აქ გამოიყენეს.


    შიგნით 1340-ზე მეტი ძირითადი ექსპონატია: ბიბლიოთეკა, ოჯახის ნივთები, კოდაკის ადრეული ფოტოაპარატი,
    ბერლინიდან, დრეზდენიდან, ლონდონიდან, კოპენჰაგენიდან, ცინცინატიდან და პარიზიდან ჩამოტანილი საოჯახო
    და სამეურნეო იარაღი. ეზოში ნიკოს დარგული სექვოია, კორპის მუხები, ჰიმალაის კედარი და ფრანგული ვაზის
    ჯიშები ხარობს. 1923 წელს მან კარ-მიდამო სოფელს გადასცა; მუზეუმი 1947 წელს დაარსდა და 1951 წელს გაიხსნა.


    პარიზში შეკვეთილ მზის საათზე ჯიხაიშის მერიდიანებია აღნიშნული — ამ სოფლის საკუთარი შუადღე.
  tip: >-
    ერთი საათი გამოყავით, ბაღში გასასეირნებლად კი — მეტი. იკითხეთ, ხომ არ არის თავისუფალი გიდი: ნივთების
    ამბები ბევრად მეტს ყვება, ვიდრე წარწერები. სამუშაო საათები მოკლეა და ინტერნეტში საიმედოდ არ ქვეყნდება,
    ამიტომ ეცადეთ, შუადღემდე მიხვიდეთ, ბილეთის ფასი კი ადგილზე დააზუსტეთ. სახლი ნიკოლაძის ქუჩის 109 ნომერშია.
    ის ბუნებრივად ეწყობა ქუთაისსა და ვანში გატარებულ დღეს, ან თბილისიდან ზღვისკენ გრძელ გზაზე შესვენებად;
    სოფელში საყიდელი ბევრი არაფერია, ამიტომ წყალი თან წაიღეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ იარეთ — გორის, ხაშურისა და ზესტაფონის გავლით, ქუთაისის
    მოსახვევებს გასცდით და სამტრედიისკენ განაგრძეთ. ქუთაისსა და სამტრედიას შორის, ახალსოფელთან, ჩრდილოეთით
    შ103-ზე გადაუხვიეთ და დაახლოებით ექვსი კილომეტრი იარეთ დიდ ჯიხაიშამდე — სულ 246–250 კმ და სამი საათი
    და ნახევარი. სოფელი დაბლობზეა, ზღვის დონიდან ორმოციოდე მეტრზე, ქუთაისიდან 20 და სამტრედიიდან 12 კილომეტრზე.
    გზა ბოლომდე ასფალტიანია, ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავს ს1-ზე ადვილად იპოვით.
en:
  name: Niko Nikoladze House Museum
  short: >-
    A cream villa in the Imeretian lowland where a Zurich-trained reformer built Georgia's only wind engine
    and ordered a sundial from Paris.
  body: >-
    **Niko Nikoladze once turned down an offer from Karl Marx; in 1910 he built a wind engine in his own
    garden in Didi Jikhaishi to pump water from the well — the first and only one in Georgia.**


    Born in Kutaisi in 1843, Nikoladze was thrown out of St Petersburg University in 1861 for joining
    student protests, and in 1868 became the first Georgian to take a doctorate at a European university,
    in law at Zurich. There he met Marx, who asked him to represent the International in Transcaucasia;
    he declined. He founded newspapers in Tbilisi and Paris, pushed for railways and the Grozny–Poti pipeline,
    and as mayor of Poti from 1894 to 1912 turned a small harbour town into a trading port.


    The family settled here in 1886, the year the house was built. It was remodelled three times and reached
    its final form in the 1910s to a design by a Swedish architect named Frid: a cream villa raised on
    a basement, with glazed verandas and a central tower opening into an arched loggia. The roof tiles
    came from Marseille, and in places they double as skylights. The museum says the concrete of the balconies
    and cellars, imported from Europe, was the first used for a house anywhere in the Russian Empire.


    Inside are more than 1,340 principal exhibits: the library, family belongings, an early Kodak camera,
    and household and farm objects brought from Berlin, Dresden, London, Copenhagen, Cincinnati and Paris.
    In the garden grow a sequoia, cork oaks, a Himalayan cedar and French vines, all planted by Nikoladze.
    In 1923 he gave the estate to the village; the museum was decreed in 1947 and opened in 1951.


    The sundial he had made in Paris is marked with the meridians of Jikhaishi — this village's own noon.
  tip: >-
    Allow an hour, and more if you want to walk the garden. Ask whether a guide is free: the stories behind
    the objects say far more than the labels. Opening hours are short and not reliably published online,
    so aim to arrive by late morning, and treat the ticket price as something to check locally. The house
    is at 109 Nikoladze Street. It sits naturally in a day with Kutaisi or Vani, or as a break on the
    long drive between Tbilisi and the coast; there is little to buy in the village itself, so bring water.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori, Khashuri and Zestaponi, keeping on the main road past
    the Kutaisi turn-offs towards Samtredia. Between Kutaisi and Samtredia, near Akhalsopeli, turn north
    onto the Sh103 and follow it about six kilometres into Didi Jikhaishi — about 246–250 km and three
    and a half hours in all. The village lies on the lowland at around 40 metres, 20 km from Kutaisi and
    12 km from Samtredia. Asphalt the whole way; an economy car is fine. Fuel is easy along the S1.
ru:
  name: Дом-музей Нико Николадзе
  short: >-
    Кремовая вилла в Имерети, где учившийся в Цюрихе реформатор построил единственный в Грузии ветродвигатель
    и заказал в Париже солнечные часы.
  body: >-
    **Нико Николадзе однажды отказал самому Карлу Марксу; в 1910 году он построил в собственном саду в
    Диди-Джихаиши ветряной двигатель для откачки воды из колодца — первый и единственный такой в Грузии.**


    Родившийся в Кутаиси в 1843 году, Николадзе был отчислен из Петербургского университета в 1861-м за
    участие в студенческих протестах, а в 1868-м стал первым грузином, получившим докторскую степень в
    европейском университете, — доктором права в Цюрихе. Там он познакомился с Марксом, который предложил
    ему представлять Интернационал в Закавказье; Николадзе отказался. Он основывал газеты в Тбилиси и
    Париже, добивался строительства железных дорог и нефтепровода Грозный–Поти, а на посту городского
    головы Поти с 1894 по 1912 год превратил небольшой портовый городок в торговую гавань.


    Семья поселилась здесь в 1886 году — тогда же был построен дом. Его перестраивали трижды, и окончательный
    облик он получил в 1910-х годах по проекту шведского архитектора по имени Фрид: кремовая вилла на
    цоколе, со стеклянными верандами и центральной башней, открывающейся в аркадную лоджию. Черепицу привезли
    из Марселя, и местами она служит и световыми окнами. По словам музея, бетон балконов и подвалов, привезённый
    из Европы, был первым, использованным для строительства жилого дома во всей Российской империи.


    Внутри — более 1340 основных экспонатов: библиотека, вещи семьи, ранний фотоаппарат «Кодак», домашние
    и хозяйственные предметы, привезённые из Берлина, Дрездена, Лондона, Копенгагена, Цинциннати и Парижа.
    В саду растут секвойя, пробковые дубы, гималайский кедр и французские сорта винограда — всё посажено
    самим Николадзе. В 1923 году он передал имение селу; музей учредили в 1947-м, открыли в 1951-м.


    Солнечные часы, которые он заказал в Париже, отмечены меридианами Джихаиши — собственным полднем этого
    села.
  tip: >-
    Хватит часа, а если хотите пройтись по саду — больше. Спросите, свободен ли экскурсовод: истории о
    вещах говорят куда больше, чем подписи. Часы работы короткие и не всегда надёжно указаны в интернете,
    так что старайтесь приехать к позднему утру, а цену билета уточняйте на месте. Дом стоит на улице
    Николадзе, 109. Его удобно совместить с поездкой в Кутаиси или Вани или сделать остановкой на долгом
    пути от Тбилиси к морю; в самом селе почти нечего купить, так что возьмите воду.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Гори, Хашури и Зестафони, минуя повороты на Кутаиси,
    в сторону Самтредиа. Между Кутаиси и Самтредиа, у Ахалсопели, поверните на север на Sh103 и проедьте
    около шести километров до Диди-Джихаиши — всего около 246–250 км и три с половиной часа. Село лежит
    на низменности, на высоте около 40 метров, в 20 км от Кутаиси и 12 км от Самтредиа. Всё асфальтировано;
    машины эконом-класса достаточно. Заправиться легко на трассе S1.
fa:
  name: خانه-موزه نیکو نیکولادزه
  short: >-
    ویلایی کرم‌رنگ در دشت ایمرتی، جایی که یک اصلاح‌گر تحصیل‌کرده در زوریخ تنها موتور بادی گرجستان را ساخت
    و ساعت آفتابی‌ای از پاریس سفارش داد.
  body: >-
    **نیکو نیکولادزه زمانی پیشنهاد کارل مارکس را رد کرد؛ در سال ۱۹۱۰ در باغ خود در دیدی جیخائیشی موتوری
    بادی برای کشیدن آب از چاه ساخت — نخستین و تنها موتور از این نوع در گرجستان.**


    نیکولادزه که در سال ۱۸۴۳ در کوتائیسی زاده شد، در سال ۱۸۶۱ به‌دلیل شرکت در اعتراض‌های دانشجویی از دانشگاه
    سن‌پترزبورگ اخراج شد، و در سال ۱۸۶۸ نخستین گرجی شد که در دانشگاهی اروپایی، در رشته‌ی حقوق در زوریخ،
    درجه‌ی دکترا گرفت. در آن‌جا با مارکس آشنا شد، که از او خواست نمایندگی انترناسیونال را در قفقاز جنوبی
    برعهده گیرد؛ نیکولادزه نپذیرفت. او روزنامه‌هایی در تفلیس و پاریس بنیاد نهاد، برای خط‌آهن و خط لوله‌ی
    نفت گروزنی-پوتی کوشید، و به‌عنوان شهردار پوتی از ۱۸۹۴ تا ۱۹۱۲، شهرکِ بندریِ کوچکی را به بندری بازرگانی
    بدل کرد.


    خانواده در سال ۱۸۸۶ در اینجا ساکن شدند — همان سالی که این خانه بنا شد. سه بار بازسازی شد و شکل نهایی
    خود را در دهه‌ی ۱۹۱۰ به طرح معماری سوئدی به نام فرید یافت: ویلایی کرم‌رنگ بر زیرزمینی بلند، با ایوان‌های
    شیشه‌ای و برجی مرکزی که به ایوانچه‌ای طاق‌دار می‌گشاید. سفال‌های بام از مارسی آورده شده و در جاهایی
    هم‌زمان نورگیر بام‌اند. به گفته‌ی موزه، بتنِ بالکن‌ها و زیرزمین‌ها، که از اروپا وارد شد، نخستین بتن
    به‌کاررفته در ساخت خانه‌ای مسکونی در سراسر امپراتوری روسیه بود.


    در درون بیش از ۱۳۴۰ شیء اصلیِ موزه هست: کتابخانه، اشیای خانوادگی، دوربینی کداک از سال‌های آغازین،
    و ابزار خانگی و کشاورزی که از برلین، درسدن، لندن، کپنهاگ، سینسیناتی و پاریس آورده شده. در باغ، سکویا،
    بلوط‌های چوب‌پنبه، سدر هیمالیایی و انواع تاک فرانسوی می‌روید — همه به‌دست نیکولادزه کاشته شده. در
    سال ۱۹۲۳ او ملک را به روستا بخشید؛ فرمان تأسیس موزه در سال ۱۹۴۷ صادر شد و در ۱۹۵۱ گشوده شد.


    ساعت آفتابی‌ای که او در پاریس سفارش داد، با نصف‌النهارهای جیخائیشی نشانه‌گذاری شده — ظهرِ خاصِ همین
    روستا.
  tip: >-
    یک ساعت کافی است، و اگر می‌خواهید در باغ گردش کنید، بیشتر. بپرسید آیا راهنمایی در دسترس است: داستان‌های
    پشتِ اشیا بسیار بیش از برچسب‌ها می‌گویند. ساعات بازدید کوتاه است و به‌طور معتبر در اینترنت منتشر نمی‌شود،
    پس بکوشید تا اواخر صبح برسید، و قیمت بلیت را در محل بررسی کنید. خانه در خیابان نیکولادزه، پلاک ۱۰۹
    است. به‌خوبی در برنامه‌ی یک روز در کوتائیسی یا وانی می‌گنجد، یا می‌تواند توقفی در راه طولانی تفلیس
    تا ساحل باشد؛ در خود روستا چیز زیادی برای خرید نیست، پس آب همراه ببرید.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از گوری، خاشوری و زستافونی، از تقاطع‌های کوتائیسی بگذرید و به‌سوی
    سامتردیا برانید. میان کوتائیسی و سامتردیا، نزدیک آخالسوپلی، به سوی شمال به Sh103 بپیوندید و نزدیک
    به شش کیلومتر تا دیدی جیخائیشی برانید — در مجموع نزدیک به ۲۴۶ تا ۲۵۰ کیلومتر و سه‌ونیم ساعت. روستا
    بر دشتی در ارتفاع حدود ۴۰ متری قرار دارد، ۲۰ کیلومتر از کوتائیسی و ۱۲ کیلومتر از سامتردیا. تمام مسیر
    آسفالته است؛ خودرویی معمولی کافی است. در طول S1 به‌آسانی می‌توان سوخت‌گیری کرد.
he:
  name: בית-מוזיאון ניקו ניקולדזה
  short: וילה בצבע שמנת במישור אימרתי, שם בנה רפורמטור שלמד בציריך את מנוע הרוח היחיד בגאורגיה והזמין
    שעון שמש מפריז.
  body: >-
    **ניקו ניקולדזה דחה בשעתו הצעה מקרל מרקס; ב-1910 בנה בגן ביתו בדידי ג'יחאישי מנוע רוח לשאיבת מים מהבאר
    — הראשון והיחיד מסוגו בגאורגיה.**


    ניקולדזה, שנולד בקוטאיסי ב-1843, גורש מאוניברסיטת סנט פטרסבורג ב-1861 בשל השתתפות במחאות סטודנטים,
    וב-1868 היה הגאורגי הראשון שקיבל תואר דוקטור באוניברסיטה אירופית — במשפטים, בציריך. שם פגש את מרקס,
    שהציע לו לייצג את האינטרנציונל בטרנסקווקזיה; הוא סירב. הוא ייסד עיתונים בטביליסי ובפריז, קידם מסילות
    רכבת ואת צינור הנפט גרוזני-פוטי, וכראש עיריית פוטי בין 1894 ל-1912 הפך עיירת נמל קטנה לנמל מסחר.


    המשפחה השתקעה כאן ב-1886, השנה שבה נבנה הבית. הוא עוצב מחדש שלוש פעמים והגיע לצורתו הסופית בשנות ה-1910
    לפי תכנון של אדריכל שוודי בשם פריד: וילה בצבע שמנת מוגבהת על מרתף, עם מרפסות מזוגגות ומגדל מרכזי הנפתח
    ללוגיה מקומרת. אריחי הגג הובאו ממרסיי, ובמקומות מסוימים חלקם משמשים גם כצוהרים. לפי המוזיאון, הבטון
    של המרפסות והמרתפים, שיובא מאירופה, היה הראשון ששימש לבניית בית מגורים בכל האימפריה הרוסית.


    בפנים יותר מ-1,340 מוצגים מרכזיים: הספרייה, חפצי המשפחה, מצלמת קודאק מוקדמת, וחפצי בית וחווה שהובאו
    מברלין, דרזדן, לונדון, קופנהגן, סינסינטי ופריז. בגן צומחים סקוויה, אלוני שעם, ארז ההימלאיה וגפנים
    צרפתיות — כולם נשתלו בידי ניקולדזה. ב-1923 הוא העביר את הנחלה לכפר; המוזיאון הוכרז ב-1947 ונפתח ב-1951.


    שעון השמש שהזמין בפריז מסומן במרידיאנים של ג'יחאישי — הצהריים של הכפר הזה עצמו.
  tip: >-
    הקציבו שעה, ויותר אם תרצו לטייל בגן. שאלו אם יש מדריך פנוי: הסיפורים שמאחורי החפצים אומרים הרבה יותר
    מהתוויות. שעות הפתיחה קצרות ולא מתפרסמות באופן אמין באינטרנט, אז כוונו להגיע עד סוף הבוקר, ובדקו את
    מחיר הכרטיס במקום. הבית נמצא ברחוב ניקולדזה 109. הוא משתלב בטבעיות עם יום בקוטאיסי או בוואני, או כהפסקה
    בנסיעה הארוכה מטביליסי לחוף; בכפר עצמו אין הרבה מה לקנות, אז הביאו מים.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי, חשורי וזסטפוני, המשיכו מעבר לפניות לקוטאיסי לכיוון סמטרדיה.
    בין קוטאיסי לסמטרדיה, סמוך לאחלסופלי, פנו צפונה ל-Sh103 והמשיכו כשישה קילומטרים לדידי ג'יחאישי — כ-246
    עד 250 ק"מ ושלוש שעות וחצי בסך הכול. הכפר שוכן במישור בגובה של כ-40 מטרים, 20 ק"מ מקוטאיסי ו-12 ק"מ
    מסמטרדיה. אספלט כל הדרך; רכב אקונומי מספיק. תדלוק קל לאורך ה-S1.
ar:
  name: متحف بيت نيكو نيكولادزه
  short: >-
    فيلا كريمية اللون في سهل إيميريتي المنخفض، حيث بنى مُصلحٌ تعلّم في زيوريخ محرّك الرياح الوحيد في جورجيا
    وطلب ساعة شمسية من باريس.
  body: >-
    **رفض نيكو نيكولادزه ذات مرة عرضًا من كارل ماركس؛ وفي عام 1910 بنى في حديقة منزله في ديدي جيخايشي
    محرّك رياح لضخ الماء من البئر — الأول والوحيد من نوعه في جورجيا.**


    وُلد نيكولادزه في كوتايسي عام 1843، وطُرد من جامعة سانت بطرسبرغ عام 1861 لاشتراكه في احتجاجات طلابية،
    وفي عام 1868 أصبح أول جورجي يحصل على درجة الدكتوراه من جامعة أوروبية، في القانون، بزيوريخ. وهناك قابل
    ماركس، الذي طلب منه أن يمثّل الأممية في القوقاز الجنوبي؛ فرفض. أسّس صحفًا في تبليسي وباريس، ودافع
    عن السكك الحديدية وخط أنابيب غروزني-بوتي، وبصفته عمدة بوتي من 1894 إلى 1912 حوّل بلدة ميناء صغيرة
    إلى ميناء تجاري.


    استقرت العائلة هنا عام 1886، وهو العام الذي بُني فيه المنزل. أُعيد تصميمه ثلاث مرات وبلغ شكله النهائي
    في العقد الثاني من القرن العشرين على تصميم مهندس سويدي يدعى فريد: فيلا كريمية اللون مرفوعة على قاعدة،
    بشرفات زجاجية وبرج مركزي ينفتح على لوجيا مقنطرة. جُلب قرميد السقف من مرسيليا، وهو في بعض المواضع يعمل
    أيضًا كمناور. وتقول إدارة المتحف إن خرسانة الشرفات والأقبية، المستوردة من أوروبا، كانت أول خرسانة
    استُخدمت في بناء منزل في كل الإمبراطورية الروسية.


    في الداخل أكثر من 1340 قطعة معروضة أساسية: المكتبة، ومقتنيات العائلة، وكاميرا كوداك مبكرة، وأدوات
    منزلية وزراعية أُحضرت من برلين ودريسدن ولندن وكوبنهاغن وسينسيناتي وباريس. وفي الحديقة تنمو سيكويا،
    وبلوط الفلين، وأرز الهيمالايا، وأصناف من الكرمة الفرنسية، كلها غرسها نيكولادزه بنفسه. وفي عام 1923
    وهب الضيعة للقرية؛ صدر مرسوم المتحف عام 1947 وافتُتح عام 1951.


    الساعة الشمسية التي طلبها من باريس موسومة بخطوط طول جيخايشي — ظهيرة هذه القرية الخاصة بها.
  tip: >-
    خصّصوا ساعة، وأكثر إن رغبتم في التمشي في الحديقة. اسألوا إن كان هناك مرشد متاح: قصص القطع تقول أكثر
    بكثير من اللوحات التعريفية. ساعات الفتح قصيرة ولا تُنشر بشكل موثوق على الإنترنت، فحاولوا الوصول قبل
    نهاية الصباح، وتحقّقوا من سعر التذكرة محليًا. يقع المنزل في شارع نيكولادزه رقم 109. ويسهل ضمّه إلى
    يوم في كوتايسي أو فاني، أو جعله محطة استراحة في الطريق الطويل من تبليسي إلى الساحل؛ لا يكاد يوجد ما
    يُشترى في القرية نفسها، فاحملوا الماء.
  route: >-
    من تبليسي خذوا S1 (E60) غربًا عبر غوري وخاشوري وزيستافوني، متجاوزين مخارج كوتايسي نحو سمتريديا. بين
    كوتايسي وسمتريديا، قرب أخالسوبيلي، اتجهوا شمالًا على Sh103 واتبعوه نحو ستة كيلومترات إلى ديدي جيخايشي
    — نحو 246–250 كم وثلاث ساعات ونصف إجمالًا. تقع القرية في السهل على ارتفاع نحو 40 مترًا، على 20 كم
    من كوتايسي و12 كم من سمتريديا. الطريق مُعبّد بالكامل؛ سيارة اقتصادية كافية. الوقود متوفر بسهولة على
    طول S1.
