ka:
  name: ნიკო ნიკოლაძის სახლ-მუზეუმი
  short: დიდი პუბლიცისტისა და რეფორმატორის ხის ვილა დიდ ჯიხაიშში — 1900 წლის ევროპული ყოფის უნიკალური
    სურათი 1400-ზე მეტი ექსპონატით და იმერული ხის ხუროთმოძღვრების ნიმუში.
  body: >-
    **ნიკო ნიკოლაძის სახლ-მუზეუმი ევროპისკენ მიმავალი საქართველოს პორტრეტია ერთ ოჯახში.** ნიკო ნიკოლაძე
    (1843–1928) — დიდი პუბლიცისტი, ევროპაში განსწავლული რეფორმატორი და ფოთის მრავალწლიანი მშენებელი-მერი
    — საკუთარ მშობლიურ დიდ ჯიხაიშში (სამტრედიის მუნიციპალიტეტი, ქუთაისიდან 20 კმ დასავლეთით) ელეგანტურ
    ხის ვილას აშენებდა. მუზეუმი აქ 1951 წელს დაარსდა.


    1400-ზე მეტი ექსპონატი 1900 წლის მიჯნის ევროპეიზებული ქართული ოჯახის ყოფას უცვლელად ინახავს: გერმანული,
    ბრიტანული, ავსტრიული, ამერიკული და რუსული მოწყობილობები — 1910 წლის ქარის მანქანა, ბერლინური სარეცხი
    მანქანა, ადრეული Kodak-ის ფოტოაპარატი, მზის საათი — და ამას ემატება ნიკოლაძის ბიბლიოთეკა და ავეჯი.
    ეს ის იშვიათი მუზეუმია, სადაც ეპოქა არა ვიტრინებში, არამედ ცოცხალ სახლშია დარჩენილი.


    თავად სახლი — თეთრი მოჩუქურთმებული აივნებითა და გამორჩეული კოშკით — იმერული ხის ხუროთმოძღვრების ღირსშესანიშნაობაა
    და პალმებიან ბაღში დგას. ვიზიტი კარგად ეწყობა ქუთაისის ღირსშესანიშნაობებს ან ზღვისკენ მიმავალ გზაზე
    გაჩერებას. მუზეუმი ყოველდღე 10:00–16:00 საათებში მუშაობს, შესვლა ფასიანია.
  tip: >-
    დაუთმე ერთი საათი და გიდის თხრობა ითხოვე — ექსპონატების ისტორიები (რომელი გემით ჩამოვიდა სარეცხი
    მანქანა ბერლინიდან, რას იღებდა Kodak-ით ოჯახი) ბევრად მეტს ამბობს, ვიდრე წარწერები. სამუშაო საათები
    შემოკლებულია — 10:00–16:00 — ამიტომ ვიზიტი შუადღემდე დაგეგმე. ბაღი ფოტოებისთვის საუკეთესო გვიან ნაშუადღევსაა,
    როცა თეთრი აივნები მზითაა განათებული.
  route: >-
    თბილისიდან დასავლეთისკენ ავტომაგისტრალით ქუთაისის შემოვლით სამტრედიის მიმართულებით; დიდი ჯიხაიში
    ქუთაისიდან 20 კმ-ში დასავლეთით, მთავარი გზიდან მოკლე შესახვევით. სულ დაახლოებით 250 კმ და 3:30 საათი,
    გზა ბოლომდე ასფალტიანია — ნებისმიერი ეკონომ-კლასის მანქანა იკმარებს. იდეალური გაჩერებაა თბილისი–ბათუმის
    გზაზე ან ქუთაისიდან ნახევარდღიანი გასვლა ვანთან ერთად.
en:
  name: Niko Nikoladze House Museum
  short: The wooden villa of the great publicist and reformer in Didi Jikhaishi — a snapshot of a westernizing
    Georgian household circa 1900, with over 1,400 exhibits.
  body: >-
    **The Nikoladze house museum is a portrait of Georgia turning towards Europe, told through one family.**
    Niko Nikoladze (1843–1928) — the great publicist, European-educated reformer and long-time mayor-builder
    of Poti — built this elegant wooden villa in his native Didi Jikhaishi, in Samtredia Municipality
    20 km west of Kutaisi. The estate was established as a museum in 1951.


    Over 1,400 items preserve, almost untouched, the life of a westernizing Georgian household circa 1900:
    German, British, Austrian, American and Russian appliances — a 1910 wind machine, a washing machine
    from Berlin, an early Kodak camera, a sundial — alongside Nikoladze's library and furnishings. It
    is that rare museum where the era survives not behind glass but in a living house.


    The house itself, with white carved verandas and a distinctive tower, is a landmark of Imeretian wooden
    architecture, set in a garden of palms. A visit pairs naturally with the Kutaisi sights or makes an
    easy stop en route to the coast. The museum is open daily from 10:00 to 16:00; entry is paid.
  tip: >-
    Give it a full hour and ask for a guided tour — the stories behind the objects (which ship brought
    the washing machine from Berlin, what the family photographed with the Kodak) say far more than the
    labels. Opening hours are short — 10:00 to 16:00 — so plan the visit for before mid-afternoon. The
    garden photographs best in late afternoon light, when the white verandas catch the sun.
  route: >-
    Head west from Tbilisi on the highway past Kutaisi towards Samtredia; Didi Jikhaishi lies 20 km west
    of Kutaisi, a short turn off the main road. In total about 250 km and 3 hours 30 minutes, paved the
    entire way — any economy-class car is fine. It makes an ideal stop on the Tbilisi–Batumi run, or a
    half-day outing from Kutaisi combined with Vani.
ru:
  name: Дом-музей Нико Николадзе
  short: Деревянная вилла великого публициста и реформатора в Диди-Джихаиши — снимок европеизирующегося
    грузинского дома рубежа 1900 года, более 1400 экспонатов.
  body: >-
    **Дом-музей Николадзе — портрет Грузии, поворачивающейся к Европе, рассказанный через одну семью.**
    Нико Николадзе (1843–1928) — великий публицист, получивший европейское образование реформатор и многолетний
    мэр-строитель Поти — построил эту элегантную деревянную виллу в родном Диди-Джихаиши, в Самтредском
    муниципалитете, в 20 км к западу от Кутаиси. Музей в усадьбе открыт в 1951 году.


    Более 1400 предметов почти нетронутыми сохраняют быт европеизирующегося грузинского дома рубежа 1900
    года: немецкая, британская, австрийская, американская и русская техника — ветряная машина 1910 года,
    стиральная машина из Берлина, ранняя фотокамера Kodak, солнечные часы — а также библиотека и обстановка
    Николадзе. Это тот редкий музей, где эпоха живёт не за стеклом, а в живом доме.


    Сам дом — с белыми резными верандами и характерной башней — памятник имеретинской деревянной архитектуры,
    стоящий в саду среди пальм. Визит естественно сочетается с достопримечательностями Кутаиси или становится
    удобной остановкой по пути к морю. Музей открыт ежедневно с 10:00 до 16:00, вход платный.
  tip: >-
    Отведите на визит целый час и попросите экскурсию — истории предметов (каким пароходом привезли стиральную
    машину из Берлина, что семья снимала на Kodak) говорят куда больше табличек. Часы работы короткие
    — с 10:00 до 16:00, поэтому планируйте визит до середины дня. Сад лучше всего фотографировать ближе
    к вечеру, когда солнце освещает белые веранды.
  route: >-
    Из Тбилиси на запад по автомагистрали мимо Кутаиси в сторону Самтредиа; Диди-Джихаиши находится в
    20 км к западу от Кутаиси, короткий съезд с главной дороги. Всего около 250 км и 3 часа 30 минут,
    асфальт на всём пути — подойдёт любая машина эконом-класса. Идеальная остановка на трассе Тбилиси–Батуми
    или полудневная вылазка из Кутаиси в сочетании с Вани.
fa:
  name: خانه‌موزهٔ نیکو نیکولادزه
  short: ویلای چوبی روزنامه‌نگار و اصلاح‌گر بزرگ در دیدی جیخائیشی — تصویری از خانوادهٔ گرجیِ رو به غرب
    در حدود سال 1900، با بیش از 1,400 شیء.
  body: >-
    **خانه‌موزهٔ نیکولادزه پرترهٔ گرجستانِ رو به اروپاست که با یک خانواده روایت می‌شود.** نیکو نیکولادزه
    (1843–1928) — روزنامه‌نگار بزرگ، اصلاح‌گر تحصیل‌کردهٔ اروپا و شهردارِ سازندهٔ چندین‌سالهٔ پوتی — این
    ویلای چوبی برازنده را در زادگاهش دیدی جیخائیشی، در شهرستان سامتردیا و 20 کیلومتری غرب کوتائیسی ساخت.
    این ملک در سال 1951 موزه شد.


    بیش از 1,400 شیء زندگی خانواده‌ای گرجی و رو به غرب را در حدود سال 1900 تقریباً دست‌نخورده نگه داشته‌اند:
    دستگاه‌های آلمانی، بریتانیایی، اتریشی، آمریکایی و روسی — ماشین بادی سال 1910، ماشین لباس‌شویی برلینی،
    دوربین کداک قدیمی، ساعت آفتابی — در کنار کتابخانه و اثاث نیکولادزه. این همان موزهٔ نادری است که در
    آن دوران نه پشت شیشه بلکه در خانه‌ای زنده باقی مانده است.


    خود خانه، با ایوان‌های سفید کنده‌کاری‌شده و برجی چشمگیر، از نشانه‌های معماری چوبی ایمرتی است و در
    باغی از نخل‌ها ایستاده است. بازدید به‌طور طبیعی با دیدنی‌های کوتائیسی جفت می‌شود یا توقفی آسان در
    راه ساحل است. موزه هر روز از 10:00 تا 16:00 باز است؛ ورود پولی است.
  tip: >-
    یک ساعت کامل وقت بگذارید و تور با راهنما بخواهید — داستان اشیا (لباس‌شویی با کدام کشتی از برلین آمد،
    خانواده با کداک از چه عکس می‌گرفت) بسیار بیش از برچسب‌ها می‌گوید. ساعت کار کوتاه است — 10:00 تا 16:00
    — پس بازدید را برای پیش از میانهٔ بعدازظهر برنامه‌ریزی کنید. باغ در نور اواخر بعدازظهر، وقتی آفتاب
    روی ایوان‌های سفید می‌افتد، بهترین عکس را می‌دهد.
  route: >-
    از تفلیس به سمت غرب با بزرگراه از کنار کوتائیسی به سوی سامتردیا بروید؛ دیدی جیخائیشی 20 کیلومتری غرب
    کوتائیسی است، با انشعابی کوتاه از جادهٔ اصلی. روی هم حدود 250 کیلومتر و 3 ساعت و 30 دقیقه، سراسر آسفالت
    — هر خودروی اکونومی کافی است. توقفی ایدئال در مسیر تفلیس–باتومی است، یا گشتی نیم‌روزه از کوتائیسی
    همراه با وانی.
he:
  name: בית-מוזיאון ניקו ניקולדזה
  short: וילת העץ של הפובליציסט והרפורמטור הגדול בדידי ג'יחאישי — תמונת מצב של בית גאורגי מתמערב סביב
    שנת 1900, עם יותר מ-1,400 מוצגים.
  body: >-
    **בית-המוזיאון של ניקולדזה הוא דיוקן של גאורגיה הפונה לאירופה, מסופר דרך משפחה אחת.** ניקו ניקולדזה
    (1843–1928) — הפובליציסט הגדול, רפורמטור חניך אירופה וראש העיר-הבנאי רב-השנים של פוטי — בנה את וילת
    העץ האלגנטית הזאת בכפר הולדתו דידי ג'יחאישי, בנפת סמטרדיה, 20 ק״מ מערבית לכותאיסי. האחוזה הפכה למוזיאון
    בשנת 1951.


    יותר מ-1,400 פריטים משמרים כמעט ללא שינוי את חיי הבית הגאורגי המתמערב של סביבות 1900: מכשירים גרמניים,
    בריטיים, אוסטריים, אמריקאיים ורוסיים — מכונת רוח מ-1910, מכונת כביסה מברלין, מצלמת קודאק מוקדמת, שעון
    שמש — לצד ספרייתו וריהוטו של ניקולדזה. זהו מוזיאון נדיר שבו התקופה שורדת לא מאחורי זכוכית אלא בבית
    חי.


    הבית עצמו, עם מרפסות עץ לבנות מגולפות ומגדל ייחודי, הוא ציון דרך של אדריכלות העץ האימרתית, נטוע בגן
    דקלים. הביקור משתלב באופן טבעי עם אתרי כותאיסי או מהווה עצירה נוחה בדרך לחוף. המוזיאון פתוח מדי יום
    בין 10:00 ל-16:00; הכניסה בתשלום.
  tip: >-
    הקדישו שעה שלמה ובקשו סיור מודרך — הסיפורים שמאחורי החפצים (באיזו אונייה הגיעה מכונת הכביסה מברלין,
    מה צילמה המשפחה בקודאק) אומרים הרבה יותר מהשלטים. שעות הפתיחה קצרות — 10:00 עד 16:00 — אז תכננו את
    הביקור לפני אמצע אחר הצהריים. הגן מצטלם הכי יפה באור של סוף אחר הצהריים, כשהשמש מאירה את המרפסות הלבנות.
  route: >-
    סעו מערבה מטביליסי בכביש המהיר, חלפו על פני כותאיסי לכיוון סמטרדיה; דידי ג'יחאישי שוכן 20 ק״מ מערבית
    לכותאיסי, בפנייה קצרה מהדרך הראשית. בסך הכול כ-250 ק״מ ו-3:30 שעות, אספלט לכל האורך — כל רכב אקונומי
    יתאים. עצירה אידיאלית בנתיב טביליסי–באטומי, או טיול חצי יום מכותאיסי בשילוב עם ואני.
ar:
  name: منزل-متحف نيكو نيكولادزه
  short: الفيلا الخشبية للكاتب الصحفي والمصلح الكبير في ديدي جيخايشي — لقطة لبيت جورجي متجه نحو الغرب
    حوالي عام 1900، بأكثر من 1,400 قطعة.
  body: >-
    **منزل-متحف نيكولادزه صورة لجورجيا وهي تتجه نحو أوروبا، تُروى عبر عائلة واحدة.** بنى نيكو نيكولادزه
    (1843–1928) — الكاتب الصحفي الكبير والمصلح المتعلم في أوروبا وعمدة بوتي البنّاء لسنوات طويلة — هذه
    الفيلا الخشبية الأنيقة في مسقط رأسه ديدي جيخايشي، في بلدية سامتريديا على بعد 20 كم غرب كوتايسي. وتحولت
    الضيعة إلى متحف عام 1951.


    تحفظ أكثر من 1,400 قطعة، شبه سليمة، حياة بيت جورجي متجه نحو الغرب حوالي عام 1900: أجهزة ألمانية وبريطانية
    ونمساوية وأمريكية وروسية — آلة رياح من عام 1910، وغسالة من برلين، وكاميرا كوداك مبكرة، وساعة شمسية
    — إلى جانب مكتبة نيكولادزه وأثاثه. إنه ذلك المتحف النادر الذي تبقى فيه الحقبة لا خلف الزجاج بل في
    بيت حي.


    والبيت نفسه، بشرفاته البيضاء المنحوتة وبرجه المميز، معلم من معالم العمارة الخشبية الإيميريتية، قائم
    في حديقة من النخيل. تنسجم الزيارة طبيعياً مع معالم كوتايسي أو تكون محطة سهلة في الطريق إلى الساحل.
    المتحف مفتوح يومياً من 10:00 إلى 16:00؛ والدخول مدفوع.
  tip: >-
    خصص ساعة كاملة واطلب جولة مع مرشد — فقصص القطع (بأي سفينة وصلت الغسالة من برلين، وماذا كانت العائلة
    تصور بالكوداك) تقول أكثر بكثير من اللوحات التعريفية. ساعات العمل قصيرة — من 10:00 إلى 16:00 — فخطط
    للزيارة قبل منتصف العصر. والحديقة أجمل ما تُصوَّر في ضوء آخر العصر حين تضيء الشمس الشرفات البيضاء.
  route: >-
    اتجه غرباً من تبليسي على الطريق السريع متجاوزاً كوتايسي نحو سامتريديا؛ تقع ديدي جيخايشي على بعد 20
    كم غرب كوتايسي بانعطافة قصيرة عن الطريق الرئيسي. الإجمالي نحو 250 كم و3 ساعات و30 دقيقة، والطريق معبّد
    بكامله — أي سيارة اقتصادية تكفي. وهي محطة مثالية على خط تبليسي–باتومي، أو جولة نصف يوم من كوتايسي
    مع فاني.
