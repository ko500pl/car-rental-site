ka:
  name: აბანოს უღელტეხილი
  short: >-
    2826 მეტრზე გამავალი ერთადერთი გზა თუშეთისკენ: ფშაველიდან ომალომდე დაახლოებით 70 კილომეტრი ვიწრო ხრეში,
    ღია ივნისიდან ოქტომბრის შუა რიცხვებამდე, მხოლოდ ჯიპით.
  body: >-
    **აბანოს უღელტეხილი თუშეთის კარია და წლის უმეტეს ნაწილში დაკეტილია: თოვლი მას დაახლოებით ოქტომბრის
    შუა რიცხვებიდან ივნისამდე ხურავს, და როცა კარი იკეტება, თუშეთი საკუთარი თავის ამარა რჩება.**


    უღელტეხილი კავკასიონის მთავარ წყალგამყოფ ქედს 2826 მეტრზე, ბულანჩოსწვერსა და დიდგვერდს შორის კვეთს
    და კავკასიის ერთ-ერთი უმაღლესი საავტომობილო გადასასვლელია. შ44 ფშაველიდან მდინარე სტორის ხეობას მიუყვება
    — დაახლოებით 41 კილომეტრი ხრეშიანი აღმართი, — შემდეგ კი დაახლოებით 27 კილომეტრით თუშეთის ალაზნის ხეობაში
    ეშვება და ომალომდე მიდის. თხემის გადალახვისას ალაზნის ველი ზურგს უკან რჩება და ქედის ჩრდილოეთ მხარეს
    აღმოჩნდებით.


    გზა ვიწროა, ხშირად ერთი მანქანის სიგანისა, ფერდობში გამოჭრილი, მოაჯირის გარეშე, ასეულმეტრიანი ფრიალოების
    თავზე. მსოფლიოს ყველაზე საშიში გზების სიებში იგი მუდმივად ხვდება და ამ ადგილს იმსახურებს: წვიმის შემდეგ
    მეწყერი ჩამოდის, ავარიები კი იშვიათი არ არის. და მაინც, ეს დიდებული გზაა. აღმართი ტყეში იწყება; მერე
    ხეები თავდება, სერპანტინის მარყუჟები ერთმანეთზე ლაგდება, თხემთან კი თოვლის ლაქები ზაფხულის სიღრმემდე
    ძლებს.


    თავზე პატარა ეკლესია დგას, სეზონზე კი ჯიხურიც, სადაც ჩაის ყიდიან — იმ მძღოლებს, ვინც ის ნამდვილად
    დაიმსახურა. ქარი თითქმის არ წყდება და ზაფხულშიც სუსხიანია. ჩრდილოეთით თუშეთის ქედები ჩეჩნეთისა და
    დაღესტნისკენ იკეცება; სამხრეთით, მოწმენდილ დღეს, მთელ გავლილ გზას გადახედავთ.


    მოგზაურთა უმეტესობას უღელტეხილი გამოცდად ამახსოვრდება. ნელა იარეთ, ხშირად გაჩერდით — და ის მგზავრობის
    საფასური კი არა, მისი საუკეთესო ნაწილი გახდება.
  tip: >-
    იარეთ მხოლოდ ნამდვილი, მაღალი გამავლობის ჯიპით და მხოლოდ მაშინ, თუ ღია ხრეშიან ფერდზე თავს თავისუფლად
    გრძნობთ; სხვა შემთხვევაში სეზონზე ადგილობრივი მძღოლები ჯიპით ომალომდე აგიყვანენ. წინასწარ შეამოწმეთ
    გაქირავების ხელშეკრულება — ბევრი ამ გზას პირდაპირ გამორიცხავს (იხილეთ [ჩვენი გაქირავების პირობები](/terms/)).
    ავზი ახმეტაში შეავსეთ, ეს ბოლო საიმედო ბენზინგასამართია. ადრე გადით: ღრუბელი თხემს ნებისმიერ დროს
    შეიძლება ჩამოაწვეს. ბრმა მოსახვევში საყვირი მიეცით; შემხვედრ მანქანასთან უკან ის იხევს, ვინც გზის
    გასაცდენ გაფართოებასთან უფრო ახლოსაა — შეთანხმდით ხელის დაქნევით და არა სიჯიუტით. მობილური კავშირი
    წყვეტილია, ამიტომ ვინმეს თქვენი გეგმა აცნობეთ. ქარგაუმტარი ქურთუკი და ქუდი აუცილებელია.
  route: >-
    თბილისიდან გომბორის უღელტეხილით (შ38) თელავამდე იარეთ, შემდეგ ახმეტის გავლით ალაზანს ჩრდილოეთით აუყევით
    ფშაველამდე: დაახლოებით 140 კილომეტრი ასფალტი, ორნახევარი საათი. ფშაველში შ44 ხრეშიანი ხდება და აღმართს
    იწყებს: თხემამდე დაახლოებით 41 კილომეტრი და ორნახევარი-სამი საათი. სულ თბილისიდან დაახლოებით 180 კილომეტრი
    და ხუთი საათი, გაჩერებებით — მეტი. ომალომდე ჩრდილოეთ ფერდზე კიდევ დაახლოებით 27 კილომეტრი და საათნახევარი
    ან მეტია. გზა ჩვეულებრივ ივნისში იხსნება და ოქტომბრის შუა რიცხვებისთვის იკეტება; ძლიერი წვიმის შემდეგ
    გასვლამდე ადგილობრივებს ჰკითხეთ. მხოლოდ ოფროუდ კლასის მანქანით.
en:
  name: Abano Pass
  short: >-
    At 2,826 m, the only road into Tusheti: some 70 km of narrow gravel from Pshaveli to Omalo, open roughly
    June to mid-October, 4x4 only.
  body: >-
    **The Abano Pass is the door to Tusheti, and for most of the year it is shut: snow closes it from
    about mid-October until June, and when it does, Tusheti is on its own.**


    The pass crosses the main watershed of the Caucasus at 2,826 m, between the peaks of Bulanchostsveri
    and Didgverdi, and is one of the highest drivable passes in the Caucasus. The Sh44 climbs to it from
    Pshaveli up the valley of the Stori, about 41 km of gravel, then drops some 27 km into the valley
    of the Tusheti Alazani and on to Omalo. Crossing the crest, you leave the Alazani plain behind and
    come out on the northern side of the range.


    The road is narrow, often one vehicle wide, cut into the slope without barriers above drops of hundreds
    of metres. It turns up on every list of the world's most dangerous roads, and it earns its place:
    landslides come down after rain, and accidents are not rare. It is also magnificent. The climb begins
    in forest; then the trees give out, the hairpins stack one above another, and near the top patches
    of snow survive deep into summer.


    At the summit stands a small church, and in season a kiosk sells tea to drivers who have truly earned
    it. The wind rarely stops, and even in summer the air bites. To the north the ridges of Tusheti fold
    away towards Chechnya and Dagestan; to the south, on a clear day, you look back over everything you
    have climbed.


    Most travellers remember the pass as an ordeal. Drive it slowly, stop often, and it becomes not the
    price of the journey but the best part of it.
  tip: >-
    Drive it only in a genuine high-clearance 4x4, and only if you are at ease on exposed gravel; otherwise,
    local drivers run jeeps up to Omalo in season. Check your rental agreement first, as many exclude
    this road outright (see [our rental terms](/terms/)). Fill up in Akhmeta, the last reliable fuel.
    Start early; cloud can wrap the crest at any hour. Sound your horn on blind bends, and when you meet
    another vehicle, whoever is nearer a passing place gives way: settle it with a wave, not with pride.
    Mobile signal comes and goes, so tell someone your plans. A windproof jacket and a hat are essential.
  route: >-
    From Tbilisi cross the Gombori Pass (Sh38) to Telavi, continue through Akhmeta and follow the Alazani
    north to Pshaveli: about 140 km of asphalt, some two and a half hours. At Pshaveli the Sh44 turns
    to gravel and starts to climb: roughly 41 km and two and a half to three hours to the top. That makes
    about 180 km and five hours from Tbilisi, more with stops. Omalo lies another 27 km or so down the
    northern side, an hour and a half or more. The road usually opens in June and closes by mid-October;
    after heavy rain, ask locally before setting off. Offroad class only.
ru:
  name: Перевал Абано
  short: >-
    На высоте 2826 м — единственная дорога в Тушети: около 70 км узкого гравия от Пшавели до Омало, открыта
    примерно с июня до середины октября, только 4x4.
  body: >-
    **Перевал Абано — дверь в Тушети, и большую часть года она закрыта: снег закрывает его примерно с
    середины октября до июня, и тогда Тушети остаётся предоставленной самой себе.**


    Перевал пересекает главный водораздел Кавказа на высоте 2826 м, между пиками Буланчосцвери и Дидгверди,
    и это один из самых высоких проезжих перевалов Кавказа. Sh44 поднимается к нему из Пшавели вдоль долины
    Стори, около 41 км гравия, затем спускается около 27 км в долину Тушетской Алазани и далее в Омало.
    Перевалив через гребень, вы оставляете позади Алазанскую равнину и оказываетесь на северном склоне
    хребта.


    Дорога узкая, часто в одну машину; она врезана в склон и идёт без ограждений над обрывами в сотни
    метров. Она попадает во все списки самых опасных дорог мира — и по праву: после дождя сходят оползни,
    а аварии не редкость. Но она и величественна. Подъём начинается в лесу; затем деревья кончаются, серпантины
    громоздятся один над другим, а у самой вершины пятна снега держатся до середины лета.


    На вершине стоит небольшая церковь, а в сезон работает киоск, где водителям, действительно заслужившим
    это, продают чай. Ветер здесь почти не стихает, и даже летом пробирает холодом. К северу хребты Тушети
    складка за складкой уходят к Чечне и Дагестану; к югу, в ясный день, вы видите позади себя всё, что
    успели преодолеть.


    Большинство путешественников запоминают перевал как испытание. Проезжайте его медленно, часто останавливайтесь
    — и он станет не ценой пути, а лучшей его частью.
  tip: >-
    Проезжайте только на настоящем внедорожнике с высоким клиренсом, и только если чувствуете себя уверенно
    на открытом гравии; в противном случае в сезон местные водители довезут вас на джипе до Омало. Сначала
    проверьте условия прокатного договора — многие прямо исключают эту дорогу (см. [наши условия аренды](/terms/)).
    Заправьтесь в Ахмете — это последняя надёжная заправка. Выезжайте рано: облака могут окутать гребень
    в любой час. Сигнальте на слепых поворотах, а при встрече с другой машиной уступает тот, кто ближе
    к карману для разъезда — решайте это взмахом руки, а не упрямством. Мобильная связь то есть, то нет,
    так что сообщите кому-то свои планы. Ветрозащитная куртка и шапка необходимы.
  route: >-
    Из Тбилиси через Гомборский перевал (Sh38) до Телави, далее через Ахмету и вдоль Алазани на север
    до Пшавели: около 140 км асфальта, около двух с половиной часов. В Пшавели Sh44 переходит в гравий
    и начинает подъём: примерно 41 км и два с половиной — три часа до вершины. Итого около 180 км и пять
    часов от Тбилиси, с остановками — больше. Омало лежит ещё примерно 27 км ниже по северному склону,
    полтора часа и более. Дорога обычно открывается в июне и закрывается к середине октября; после сильных
    дождей уточняйте обстановку на месте. Только внедорожный класс.
fa:
  name: گذرگاه آبانو
  short: >-
    در ارتفاع ۲٬۸۲۶ متری، تنها راه ورود به توشتی: نزدیک به ۷۰ کیلومتر شنی و باریک از پشاولی تا اومالو،
    باز تقریباً از ژوئن تا میانه‌ی اکتبر، تنها ۴×۴.
  body: >-
    **گذرگاه آبانو دروازه‌ی توشتی است، و بیشتر سال بسته می‌ماند: برف آن را از میانه‌ی اکتبر تقریباً تا
    ژوئن می‌بندد، و در آن زمان، توشتی به حال خود رها می‌شود.**


    این گذرگاه از خط‌الرأس اصلی قفقاز در ارتفاع ۲٬۸۲۶ متری می‌گذرد، میان قله‌های بولانچوستسوری و دیدگوردی،
    و یکی از بلندترین گذرگاه‌های قابل‌عبور با خودرو در قفقاز است. جاده‌ی Sh44 از پشاولی، در دره‌ی استوری،
    به‌سوی آن بالا می‌رود، حدود ۴۱ کیلومتر شنی، و سپس نزدیک به ۲۷ کیلومتر به دره‌ی آلازانی توشتی و از
    آن به اومالو سرازیر می‌شود. با گذر از تیغه، دشت آلازانی را پشت سر می‌گذارید و به دامنه‌ی شمالی رشته‌کوه
    می‌رسید.


    جاده باریک است، غالباً به‌عرض یک خودرو، و بر دامنه بدون نرده کنده شده، بالای پرتگاه‌هایی به بلندی
    صدها متر. این جاده در هر فهرست خطرناک‌ترین راه‌های جهان جایی دارد، و به‌حق سزاوار این جایگاه است:
    بعد از باران رانش زمین رخ می‌دهد، و تصادف نیز کم نیست. اما شگرف هم هست. صعود در جنگل آغاز می‌شود؛
    سپس درختان ناپدید می‌شوند، پیچ‌های تیز یکی بر دیگری انباشته می‌شوند، و نزدیک قله لکه‌های برف تا دل
    تابستان زنده می‌مانند.


    بر فراز گذرگاه کلیسایی کوچک ایستاده است، و در فصل خود، کیوسکی به رانندگانی که به‌راستی سزاوارش شده‌اند
    چای می‌فروشد. باد اینجا کمتر می‌آرامد، و حتی در تابستان هوا گزنده است. به شمال، رشته‌های توشتی به‌سوی
    چچن و داغستان درهم می‌پیچند؛ به جنوب، در روزی صاف، بر همه‌ی راهی که بالا آمده‌اید نگاهی به پشت سر
    می‌اندازید.


    بیشتر مسافران این گذرگاه را چون آزمونی به‌یاد می‌آورند. آن را آرام برانید، بارها بایستید، و آنگاه
    نه بهای سفر، که بهترین بخش آن خواهد شد.
  tip: >-
    تنها با خودرویی ۴×۴ واقعی و شاسی‌بلند برانید، و تنها اگر در جاده‌ی شنیِ لبِ پرتگاه آسوده‌اید؛ در غیر
    این‌صورت، رانندگان محلی در فصل با جیپ مسافر را تا اومالو می‌برند. نخست قرارداد کرایه‌ی خود را بررسی
    کنید، چون بسیاری این راه را کاملاً کنار می‌گذارند (به [شرایط اجاره‌ی ما](/terms/) نگاه کنید). در آخمِتا،
    آخرین پمپ‌بنزین مطمئن، باک را پر کنید. زود حرکت کنید؛ ابر می‌تواند در هر ساعتی تیغه را در بر بگیرد.
    در پیچ‌های کور بوق بزنید، و هنگام روبروشدن با خودرویی دیگر، هرکدام که به جای پهن‌تری از جاده نزدیک‌تر
    است، عقب می‌رود و راه می‌دهد: آن را با تکان دادن دست حل کنید، نه با غرور. آنتن موبایل می‌آید و می‌رود،
    پس نقشه‌ی خود را به کسی بگویید. کاپشن بادگیر و کلاه ضروری‌اند.
  route: >-
    از تفلیس با گذر از گردنه‌ی گومبوری (Sh38) به تلاوی بروید، سپس از میان آخمِتا بگذرید و در پی آلازانی
    به‌سوی شمال تا پشاولی ادامه دهید: نزدیک به ۱۴۰ کیلومتر آسفالت، حدود دو ساعت‌ونیم. در پشاولی، Sh44
    به شن بدل می‌شود و صعود می‌کند: نزدیک به ۴۱ کیلومتر و دو ساعت‌ونیم تا سه ساعت تا قله. این جمعاً حدود
    ۱۸۰ کیلومتر و پنج ساعت از تفلیس است، با توقف‌ها بیشتر. اومالو حدود ۲۷ کیلومتر دیگر پایین‌تر در سوی
    شمالی قرار دارد، یک ساعت‌ونیم یا بیشتر. این راه معمولاً در ژوئن باز و تا میانه‌ی اکتبر بسته می‌شود؛
    پس از باران شدید، پیش از حرکت از محلی‌ها بپرسید. تنها کلاس آفرود.
he:
  name: מעבר אבאנו
  short: >-
    בגובה 2,826 מטר, הדרך היחידה לתושתי: כ-70 ק"מ של חצץ צר מפשאוולי לאומאלו, פתוחה בערך מיוני עד אמצע
    אוקטובר, רק 4x4.
  body: >-
    **מעבר אבאנו הוא הדלת לתושתי, ובמשך רוב השנה היא נעולה: שלג סוגר אותו מאמצע אוקטובר בערך עד יוני,
    ואז תושתי נשארת לגמרי לבדה.**


    המעבר חוצה את קו פרשת המים המרכזי של הקווקז בגובה 2,826 מטר, בין הפסגות בולנצ'וסצברי ודידגוורדי, והוא
    אחד המעברים הגבוהים ביותר בקווקז שאפשר לעבור ברכב. כביש Sh44 מטפס אליו מפשאוולי במעלה עמק סטורי, כ-41
    ק"מ חצץ, ואז יורד כ-27 ק"מ לעמק אלזני של תושתי ומשם לאומאלו. בחציית הרכס משאירים מאחור את מישור אלזני
    ומגיעים לצד הצפוני של הרכס.


    הכביש צר, פעמים רבות ברוחב רכב אחד, חצוב במדרון בלי מעקות מעל תהומות של מאות מטרים. הוא מופיע בכל
    רשימה של הכבישים המסוכנים ביותר בעולם, ובצדק: אחרי גשם יורדות מפולות, ותאונות אינן נדירות. אבל הוא
    גם מרהיב. הטיפוס מתחיל ביער; לאחר מכן העצים נגמרים, הסיבובים החדים נערמים אחד על השני, וקרוב לפסגה
    כתמי שלג שורדים עד לב הקיץ.


    בפסגה עומדת כנסייה קטנה, ובעונה קיוסק מוכר תה לנהגים שבאמת הרוויחו אותו. הרוח כמעט אינה שוככת, ואפילו
    בקיץ האוויר נושך. צפונה נמתחים רכסי תושתי, קפל אחר קפל, לעבר צ'צ'ניה ודגסטן; דרומה, ביום צלול, אתם
    מביטים אחורה על כל הדרך שטיפסתם.


    רוב הנוסעים זוכרים את המעבר כמבחן קשה. סעו בו לאט, עצרו לעתים קרובות, והוא יהפוך לא למחיר המסע אלא
    לחלקו הטוב ביותר.
  tip: >-
    סעו בו רק ברכב 4x4 אמיתי בעל גחון גבוה, ורק אם אתם בטוחים בעצמכם על חצץ חשוף; אחרת, נהגים מקומיים
    מסיעים בג'יפים לאומאלו בעונה. בדקו קודם את חוזה ההשכרה, כי חוזים רבים מחריגים כביש זה במפורש (ראו
    [תנאי ההשכרה שלנו](/terms/)). תדלקו באחמטה, תחנת הדלק האחרונה שאפשר לסמוך עליה. צאו מוקדם; עננים יכולים
    לעטוף את הרכס בכל שעה. צפרו בעיקולים עיוורים, וכשפוגשים רכב אחר, מי שקרוב יותר למפרץ בצד הדרך נסוג
    אליו: יש לפתור זאת בנפנוף, לא בגאווה. הקליטה הסלולרית לסירוגין, ולכן כדאי לספר למישהו את התוכניות
    שלכם. מעיל עמיד לרוח וכובע חיוניים.
  route: >-
    מטביליסי חצו את מעבר גומבורי (Sh38) לטלאווי, המשיכו דרך אחמטה ועקבו אחר אלזני צפונה לפשאוולי: כ-140
    ק"מ של כביש סלול, כשעתיים וחצי. בפשאוולי כביש Sh44 עובר לחצץ ומתחיל לטפס: כ-41 ק"מ ושעתיים וחצי עד
    שלוש שעות לפסגה. בסך הכול כ-180 ק"מ וחמש שעות מטביליסי, יותר עם עצירות. אומאלו שוכן עוד כ-27 ק"מ במורד
    הצד הצפוני, שעה וחצי או יותר. הכביש נפתח בדרך כלל ביוני ונסגר לקראת אמצע אוקטובר; אחרי גשם כבד יש
    לשאול במקום לפני היציאה. רק רכב שטח.
ar:
  name: ممر أبانو
  short: >-
    عند ارتفاع 2,826 مترًا، الطريق الوحيد إلى توشيتي: نحو 70 كم من الحصى الضيق من بشافيلي إلى أومالو،
    مفتوح تقريبًا من يونيو إلى منتصف أكتوبر، دفع رباعي فقط.
  body: >-
    **ممر أبانو هو الباب إلى توشيتي، وهو مغلق معظم أيام السنة: يُقفله الثلج من منتصف أكتوبر تقريبًا حتى
    يونيو، وحينها تبقى توشيتي وحدها تمامًا.**


    يعبر الممر خط تقسيم المياه الرئيسي للقوقاز عند ارتفاع 2,826 مترًا، بين قمتي بولانتشوستسفيري وديدغفيردي،
    وهو من أعلى الممرات القابلة للعبور بالسيارة في القوقاز. ويصعد طريق Sh44 إليه من بشافيلي عبر وادي ستوري،
    نحو 41 كم من الحصى، ثم ينحدر نحو 27 كم إلى وادي ألازاني التوشيتي وصولًا إلى أومالو. وبعبور القمة،
    تترك سهل ألازاني خلفك وتخرج إلى الجانب الشمالي من السلسلة.


    الطريق ضيق، غالبًا بعرض سيارة واحدة، محفور في المنحدر بلا حواجز فوق هاوية بعمق مئات الأمتار. ويرِد
    اسمه في كل قائمة لأخطر طرق العالم، وهو يستحق مكانه: تقع الانهيارات الأرضية بعد المطر، والحوادث ليست
    نادرة. لكنه أيضًا طريق مهيب. يبدأ الصعود في الغابة؛ ثم تنتهي الأشجار، وتتراكم المنعطفات الحادة بعضها
    فوق بعض، وقرب القمة تبقى بقع الثلج حتى قلب الصيف.


    وعلى القمة تقف كنيسة صغيرة، وفي الموسم يقدّم كشك صغير الشاي للسائقين الذين استحقوه حقًا. والريح هنا
    لا تكاد تهدأ، وحتى في الصيف يلسع الهواء. وشمالًا تتلاشى سلاسل توشيتي نحو الشيشان وداغستان؛ وجنوبًا،
    في يوم صافٍ، تلتفت فترى كل ما صعدته.


    يتذكر معظم المسافرين الممر بوصفه محنة. اقطعه ببطء، وتوقف كثيرًا، فلا يعود ثمن الرحلة بل أجمل ما فيها.
  tip: >-
    لا تقطعه إلا بسيارة دفع رباعي حقيقية بارتفاع أرضي عالٍ، وفقط إن كنت واثقًا على الحصى المكشوف؛ وإلا
    ففي الموسم ينقل السائقون المحليون الركاب بسيارات الجيب إلى أومالو. تحقق أولًا من عقد التأجير، فكثير
    من العقود تستثني هذا الطريق صراحة (انظر [شروط التأجير لدينا](/terms/)). عبّئ الوقود في أخميتا، آخر
    محطة موثوقة. انطلق باكرًا؛ فالسحاب قد يلفّ القمة في أي ساعة. أطلق بوق السيارة عند المنعطفات العمياء،
    وعند مقابلة سيارة أخرى، يتراجع مَن هو أقرب إلى موضع توسعة للتجاوز: احسمها بإشارة يد، لا بالكبرياء.
    تغطية الهاتف متقطعة، فأخبر أحدًا بخطتك. سترة صادّة للريح وقبعة ضروريتان.
  route: >-
    من تبليسي، اعبر ممر غومبوري (Sh38) إلى تيلافي، وتابع عبر أخميتا واتبع نهر ألازاني شمالًا إلى بشافيلي:
    نحو 140 كم من الإسفلت، نحو ساعتين ونصف. وفي بشافيلي يتحول طريق Sh44 إلى حصى ويبدأ الصعود: نحو 41 كم
    وساعتين ونصف إلى ثلاث ساعات حتى القمة. وهذا يجعل المسافة نحو 180 كم وخمس ساعات من تبليسي، أكثر مع
    التوقفات. وتقع أومالو على مسافة 27 كم أخرى تقريبًا نزولًا على الجانب الشمالي، ساعة ونصف أو أكثر. يُفتح
    الطريق عادة في يونيو ويُغلق بحلول منتصف أكتوبر؛ وبعد أمطار غزيرة، استفسر محليًا قبل الانطلاق. مسار
    مخصص للدفع الرباعي فقط.
