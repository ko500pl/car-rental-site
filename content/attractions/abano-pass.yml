ka:
  name: აბანოს უღელტეხილი
  short: 2850 მეტრზე გამავალი ერთადერთი გზა თუშეთისკენ, ივნისიდან ოქტომბრამდე ღია და მხოლოდ ჯიპისთვის.
  body: >-
    **აბანოს უღელტეხილი თუშეთის ერთადერთი საავტომობილო კარიბჭეა** — 2850 მეტრზე გამავალი გრუნტის გზა,
    რომელიც ფშაველიდან ომალომდე ავიდა და ჩამოდის. სხვა გზა არ არსებობს: თუ უღელტეხილი დაკეტილია, თუშეთი
    მოწყვეტილია.


    გზა 1970-იან წლებში გაიჭრა კლდის ფერდობში. ის ვიწროა — ადგილ-ადგილ ერთი ავტომობილის სიგანე — მოაჯირების
    გარეშე, სერპანტინებით და მკვეთრი, დაუფარავი ჩამონაშალებით. საერთაშორისო სიაში „ყველაზე საშიშ გზებში"
    ის რეგულარულად ხვდება და ეს არ არის მარკეტინგი: ყოველწლიურად ხდება ავარიები.


    სეზონი მოკლეა. თოვლი ჩვეულებრივ მაისის ბოლოს ან ივნისის დასაწყისში იწმინდება და გზა ოქტომბრის დასაწყისამდე
    მუშაობს. სექტემბრის ბოლოს ერთმა ღამის ყინვამ შეიძლება ყველაფერი შეცვალოს.


    თავად უღელტეხილზე ხედი ფართოა: სამხრეთით ალაზნის ვაკე და გომბორის ქედი, ჩრდილოეთით კი კავკასიონის
    მთავარი ქედი — ბოჭორნა, დიკლოსმთა, თებულოსმთა. თხემზე ჯვარი და მემორიალური დაფებია. აქ თითქმის ყოველთვის
    ქარია და ზაფხულშიც შეიძლება 5 გრადუსი იყოს.


    ასვლა ფშაველიდან სამ საათს იღებს დაახლოებით ოცდაათი კილომეტრისთვის. ეს არ არის „მოკლე გადასვლა" —
    ეს დღის ნახევარია, ერთი მიმართულებით.
  tip: >-
    მხოლოდ ჯიპით და გამოცდილი მძღოლით. ქირავნობისას დარწმუნდი, რომ დაზღვევა თუშეთის გზას ფარავს — ბევრი
    კომპანია გამორიცხავს. სამარშრუტო ჯიპები ომალოში ყოველდღიურად დადიან, თუ თავად მართვა არ გინდა. ავარიულ
    სამსახურს კავშირი მხოლოდ ცალკეულ წერტილებში აქვს. საწვავი ბოლოს თელავსა და ფშაველშია. მთაში ავადმყოფობა
    იშვიათია, მაგრამ ცივი ქარი და მზე ერთად მოქმედებს: ქუდი და ქურთუკი აუცილებელია. ზამთარში გზა დაკეტილია.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ ჩრდილო-დასავლეთით ახმეტისა და ფშაველისკენ
    — აქამდე ასფალტია. ფშაველიდან იწყება გრუნტი: დაახლოებით 30 კმ ასვლა უღელტეხილამდე, სამი საათი. სულ
    180 კმ, დაახლოებით ხუთი საათი. გზა ერთლიანდაგიანია, გასაჩერებელი ჯიბეებით; ჩამომავალს უპირატესობა
    აქვს. საწვავი ფშაველში ბოლოა — ომალომდე გასამართი აღარ იქნება.
en:
  name: Abano Pass
  short: The only road into Tusheti, crossing at 2,850 m, open roughly June to October and passable only
    by 4x4.
  body: >-
    **Abano Pass is the single vehicle gateway to Tusheti** — a dirt road that climbs from Pshaveli to
    2,850 m and drops down to Omalo on the far side. There is no alternative. When the pass is shut, Tusheti
    is cut off, and that has shaped everything about how the region lives.


    The road was cut into the mountainside in the 1970s. It is narrow, in places the width of one vehicle,
    without barriers, and it is exposed for long stretches above drops of several hundred metres. Landslides
    come down every summer and are cleared when someone gets round to it. The road appears regularly on
    lists of the world's most dangerous, and that is not marketing — there are fatal accidents most years.


    The season is short. Snow normally clears in late May or early June and the road works until the first
    week of October. One cold night at the end of September can end it early.


    From the top the view is very wide. South lies the Alazani plain with the Gombori range beyond it;
    north stands the main Caucasus chain — Diklosmta, Tebulosmta and the ridges of the Dagestan border.
    There is a cross at the summit and a set of memorial plaques. Wind blows almost constantly and the
    temperature can sit at 5°C in July.


    The climb from Pshaveli takes about three hours for roughly thirty kilometres. This is not a quick
    hop over a col; it is half a day in one direction, and it should be planned as such.


    Traffic is thin but not absent: shared jeeps, supply lorries and shepherds' pickups all use the road,
    and meeting one on a blind bend means somebody has to reverse. The northern descent towards Omalo
    is gentler than the climb but longer, and the last hour is usually driven in shadow, which makes the
    drops look worse than they are.
  tip: >-
    Go by proper 4x4 with an experienced driver. If you are renting, check that the insurance covers the
    Tusheti road — many companies exclude it outright. Shared jeeps run daily to Omalo from Pshaveli and
    Alvani if you would rather not drive. Rescue services can only be reached from a few points with signal.
    The last fuel is in Telavi and Pshaveli. Altitude sickness is unlikely, but cold wind and strong sun
    together are punishing, so a hat and a windproof jacket matter. Closed all winter.
  route: >-
    From Tbilisi cross the Gombori Pass to Telavi (95 km), then head north-west through Akhmeta towards
    Pshaveli; that section is asphalt. The gravel begins at Pshaveli: about 30 km of climbing to the pass,
    taking three hours. Total 180 km and roughly five hours. The track is single-lane with passing places,
    and by convention the vehicle coming downhill has priority. Fill the tank in Pshaveli — there is no
    fuel again until Omalo, and even there supply is not guaranteed.
ru:
  name: Перевал Абано
  short: >-
    Единственная дорога в Тушети через 2850 метров, открытая примерно с июня по октябрь и проходимая только
    на внедорожнике.
  body: >-
    **Перевал Абано — единственные автомобильные ворота в Тушети:** грунтовая дорога, поднимающаяся от
    Пшавели на 2850 метров и спускающаяся к Омало с другой стороны. Альтернативы нет. Когда перевал закрыт,
    Тушети отрезано, и это определяет весь уклад жизни региона.


    Дорогу врезали в склон в 1970-х. Она узкая, местами шириной в один автомобиль, без отбойников, и на
    длинных участках идёт открыто над обрывами в несколько сотен метров. Оползни сходят каждое лето и
    разбираются, когда до них дойдут руки. Дорога регулярно попадает в списки самых опасных в мире, и
    это не реклама: смертельные аварии случаются почти каждый год.


    Сезон короткий. Снег обычно сходит в конце мая или начале июня, дорога работает до первой недели октября.
    Одна холодная ночь в конце сентября может закрыть её раньше срока.


    Сверху вид очень широкий. К югу Алазанская долина и за ней Гомборский хребет; к северу главная цепь
    Кавказа — Диклосмта, Тебулосмта и гребни на границе с Дагестаном. На седловине стоят крест и мемориальные
    таблички. Ветер дует почти постоянно, а температура в июле может держаться на пяти градусах.


    Подъём от Пшавели занимает около трёх часов на примерно тридцать километров. Это не короткий переезд
    через седловину, а полдня в одну сторону, и планировать его нужно именно так.
  tip: >-
    Только на настоящем внедорожнике и с опытным водителем. При аренде проверьте, покрывает ли страховка
    тушетскую дорогу: многие компании прямо её исключают. Если ехать самому не хочется, от Пшавели и Алвани
    ежедневно ходят маршрутные джипы в Омало. Спасательную службу можно вызвать лишь из нескольких точек
    со связью. Последние заправки — в Телави и Пшавели. Горная болезнь маловероятна, но холодный ветер
    вместе с сильным солнцем изматывает: шапка и ветрозащитная куртка обязательны. Зимой дорога закрыта.
  route: >-
    Из Тбилиси через Гомборский перевал в Телави (95 км), затем на северо-запад через Ахмету к Пшавели;
    этот участок асфальтовый. Грунт начинается в Пшавели: около 30 км подъёма до перевала, три часа. Всего
    180 км и примерно пять часов. Дорога однополосная, с карманами для разъезда; по местному правилу приоритет
    у того, кто спускается. Заправляйтесь в Пшавели — до Омало топлива больше не будет, да и там его наличие
    не гарантировано.
fa:
  name: گردنهٔ آبانو
  short: تنها راه ورود به توشتی از ارتفاع 2850 متر، باز از خرداد تا مهر و تنها با خودروی چهارچرخ‌محرک.
  body: >-
    **گردنهٔ آبانو تنها دروازهٔ خودرویی توشتی است:** راهی خاکی که از پشاولی تا 2850 متر بالا می‌رود و
    آن سوی گردنه به اومالو سرازیر می‌شود. راه دیگری وجود ندارد. وقتی گردنه بسته است توشتی از جهان بریده
    می‌شود، و همین همه چیز را در شیوهٔ زندگی این منطقه شکل داده است.


    جاده در دههٔ 1970 در دل دامنه بریده شد. باریک است، جاهایی به پهنای یک خودرو، بی‌حفاظ، و در بخش‌های
    طولانی بر فراز پرتگاه‌هایی چند صد متری بی‌پناه می‌ماند. رانش زمین هر تابستان رخ می‌دهد و هرگاه فرصتی
    شد پاک می‌شود. این راه مرتب در فهرست خطرناک‌ترین جاده‌های جهان می‌آید و این تبلیغات نیست: تصادف مرگبار
    تقریباً هر سال پیش می‌آید.


    فصل کوتاه است. برف معمولاً اواخر اردیبهشت یا اوایل خرداد پاک می‌شود و راه تا هفتهٔ نخست مهر کار می‌کند.
    یک شب سرد در پایان شهریور می‌تواند زودتر آن را ببندد.


    از بالای گردنه دید بسیار گسترده است. در جنوب دشت آلازانی و پشت آن رشتهٔ گومبوری؛ در شمال زنجیرهٔ اصلی
    قفقاز — دیکلوسمتا، تبولوسمتا و یال‌های مرز داغستان. بر ستیغ صلیبی هست و چند لوح یادبود. باد تقریباً
    همیشه می‌وزد و دما در تیرماه می‌تواند پنج درجه بماند.


    صعود از پشاولی برای حدود سی کیلومتر نزدیک سه ساعت طول می‌کشد. این گذر کوتاه از یک گردنه نیست؛ نیم
    روز است در یک جهت، و باید همان‌گونه برنامه‌ریزی شود.
  tip: >-
    فقط با خودروی چهارچرخ‌محرک واقعی و رانندهٔ باتجربه. اگر خودرو اجاره می‌کنید، بررسی کنید بیمه جادهٔ
    توشتی را پوشش می‌دهد؛ بسیاری از شرکت‌ها آن را صریحاً مستثنا می‌کنند. اگر نمی‌خواهید خودتان برانید،
    جیپ‌های اشتراکی هر روز از پشاولی و آلوانی به اومالو می‌روند. تماس با امداد فقط از چند نقطهٔ دارای
    آنتن ممکن است. آخرین سوخت در تلاوی و پشاولی است. بیماری ارتفاع بعید است، اما باد سرد و آفتاب تند با
    هم فرساینده‌اند: کلاه و کاپشن بادگیر ضروری است. زمستان بسته است.
  route: >-
    از تفلیس از گردنهٔ گومبوری به تلاوی (95 کیلومتر) بروید، سپس به شمال غرب از آخمتا به سوی پشاولی؛ این
    بخش آسفالت است. راه خاکی از پشاولی آغاز می‌شود: حدود 30 کیلومتر صعود تا گردنه در سه ساعت. جمعاً 180
    کیلومتر و نزدیک پنج ساعت. مسیر یک‌بانده است با جیب‌هایی برای گذشتن، و بنا به عرف حق تقدم با خودرویی
    است که پایین می‌آید. باک را در پشاولی پر کنید؛ تا اومالو سوختی نیست و آنجا هم موجود بودنش تضمینی ندارد.
he:
  name: מעבר אבאנו
  short: הדרך היחידה לטושתי, בגובה 2,850 מ', פתוחה בערך מיוני עד אוקטובר ועבירה רק ברכב שטח.
  body: >-
    **מעבר אבאנו הוא שער הרכב היחיד לטושתי** — דרך עפר שמטפסת מפשאוולי אל 2,850 מ' ויורדת לאומאלו בעבר
    השני. אין חלופה. כשהמעבר סגור, טושתי מנותקת, וזה עיצב כל היבט באורח החיים שם.


    הדרך נחצבה במדרון בשנות השבעים. היא צרה, במקומות ברוחב רכב אחד, בלי מעקות, ולאורך קטעים ארוכים היא
    חשופה מעל תהומות של מאות מטרים. מפולות יורדות בכל קיץ ומפונות כשמישהו מגיע לזה. הדרך מופיעה בקביעות
    ברשימות המסוכנות בעולם, וזה לא שיווק: תאונות קטלניות מתרחשות כמעט מדי שנה.


    העונה קצרה. השלג נמס בדרך כלל בסוף מאי או בתחילת יוני, והדרך פועלת עד השבוע הראשון של אוקטובר. לילה
    קר אחד בסוף ספטמבר יכול לסיים אותה מוקדם.


    מלמעלה הנוף רחב מאוד. בדרום מישור האלאזני ומאחוריו רכס גומבורי; בצפון שרשרת הקווקז הראשית — דיקלוסמטה,
    טבולוסמטה ורכסי הגבול עם דאגסטן. בפסגה ניצבים צלב וכמה לוחות זיכרון. הרוח נושבת כמעט תמיד, והטמפרטורה
    ביולי יכולה לעמוד על חמש מעלות.


    העלייה מפשאוולי אורכת כשלוש שעות לכשלושים קילומטרים. זו אינה קפיצה קצרה מעל אוכף; זה חצי יום לכיוון
    אחד, וכך צריך לתכנן אותה.
  tip: >-
    רק ברכב שטח אמיתי ועם נהג מנוסה. אם אתם שוכרים, ודאו שהביטוח מכסה את דרך טושתי — חברות רבות מחריגות
    אותה במפורש. אם אינכם רוצים לנהוג, ג'יפים משותפים יוצאים מדי יום מפשאוולי ומאלוואני לאומאלו. אפשר
    לקרוא לחילוץ רק מכמה נקודות שיש בהן קליטה. הדלק האחרון בטלאווי ובפשאוולי. מחלת גבהים אינה סבירה, אך
    רוח קרה ושמש חזקה יחד מתישות: כובע ומעיל רוח חיוניים. בחורף הדרך סגורה.
  route: >-
    מטביליסי חצו את מעבר גומבורי לטלאווי (95 ק״מ), ואז צפונה-מערבה דרך אחמטה לכיוון פשאוולי; הקטע הזה
    סלול. דרך העפר מתחילה בפשאוולי: כ-30 ק״מ של טיפוס אל המעבר, שלוש שעות. בסך הכול 180 ק״מ וכחמש שעות.
    הדרך חד-נתיבית עם מפרצי עקיפה, ולפי הנוהג הזכות היא לרכב היורד. מלאו דלק בפשאוולי — עד אומאלו לא יהיה
    עוד, וגם שם האספקה אינה מובטחת.
ar:
  name: ممر أبانو
  short: الطريق الوحيد إلى توشيتي عند 2850 م، مفتوح من حزيران إلى تشرين الأول تقريباً ولا يُعبر إلا بدفع
    رباعي.
  body: >-
    **ممر أبانو هو البوابة الوحيدة للسيارات إلى توشيتي:** طريق ترابي يصعد من بشاولي إلى 2850 م ثم ينحدر
    إلى أومالو في الجانب الآخر. ولا بديل عنه. وحين يُغلق الممر تنقطع توشيتي، وهذا ما شكّل كل شيء في طريقة
    عيش المنطقة.


    شُق الطريق في سفح الجبل في السبعينيات. وهو ضيق، بعرض مركبة واحدة في مواضع، بلا حواجز، ومكشوف على امتداد
    مقاطع طويلة فوق هاوية بمئات الأمتار. وتنزل الانهيارات كل صيف وتُزال حين يتيسر ذلك. ويرد الطريق باستمرار
    في قوائم أخطر طرق العالم، وليس هذا تسويقاً: فالحوادث المميتة تقع في معظم السنوات.


    والموسم قصير. يزول الثلج عادة في أواخر أيار أو أوائل حزيران ويعمل الطريق حتى الأسبوع الأول من تشرين
    الأول. وليلة باردة واحدة في آخر أيلول قد تنهيه مبكراً.


    ومن القمة يتسع المشهد كثيراً. في الجنوب سهل ألازاني ووراءه سلسلة غومبوري؛ وفي الشمال السلسلة الرئيسية
    للقوقاز: ديكلوسمتا وتيبولوسمتا وحيود الحدود مع داغستان. وعلى الذروة صليب وألواح تذكارية. والريح تهب
    في معظم الوقت، وقد تظل الحرارة عند خمس درجات في تموز.


    ويستغرق الصعود من بشاولي نحو ثلاث ساعات لثلاثين كيلومتراً تقريباً. وليس هذا عبوراً سريعاً فوق فجّ؛
    إنه نصف يوم في اتجاه واحد، وينبغي التخطيط له على هذا الأساس.
  tip: >-
    لا تسلكه إلا بسيارة دفع رباعي حقيقية وسائق متمرس. وإن كنت مستأجراً فتحقق أن التأمين يشمل طريق توشيتي،
    فكثير من الشركات تستثنيه صراحة. وإن لم ترغب في القيادة فسيارات الجيب المشتركة تسير يومياً من بشاولي
    وألفاني إلى أومالو. ولا يمكن طلب الإنقاذ إلا من نقاط قليلة فيها تغطية. وآخر وقود في تيلافي وبشاولي.
    ومرض المرتفعات مستبعد، لكن الريح الباردة مع الشمس القوية مرهقة معاً: القبعة والسترة الواقية من الريح
    ضرورتان. والطريق مغلق طوال الشتاء.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي (95 كم)، ثم شمالاً غرباً عبر أخميتا نحو بشاولي؛ وهذا المقطع
    معبّد. ويبدأ التراب عند بشاولي: نحو 30 كم من الصعود إلى الممر في ثلاث ساعات. المجموع 180 كم ونحو خمس
    ساعات. والمسلك بحارة واحدة مع جيوب للتلاقي، والعُرف أن الأولوية للنازل. املأ الخزان في بشاولي، فلا
    وقود بعده حتى أومالو، وحتى هناك لا يُضمن توفره.
