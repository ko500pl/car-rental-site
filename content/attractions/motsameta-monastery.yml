ka:
  name: მოწამეთას მონასტერი
  short: წითელი წყლის ხეობაზე დაკიდებული პატარა მონასტერი ორი წამებული მთავრის ნაწილებით.
  body: >
    მოწამეთა ქუთაისიდან ექვს კილომეტრში, მდინარე წყალწითელას ხეობის თავზე, ვიწრო კლდოვან კონცხზე დგას.
    მასშტაბით ის გელათს ვერ შეედრება, სამაგიეროდ მდებარეობით ბევრად უფრო ეფექტურია: ეზოს კიდიდან ხეობა
    თითქმის ვერტიკალურად ეშვება ქვემოთ.


    სახელი „მოწამეთა“ წამებულებს ნიშნავს. VIII საუკუნეში არაბთა შემოსევის დროს აქ აწამეს ძმები დავითი
    და კონსტანტინე მხეიძეები, რომლებმაც რწმენაზე უარი არ თქვეს. გადმოცემით, მათი ცხედრები მდინარეში ჩააგდეს
    და წყალი სისხლისგან გაწითლდა — აქედან მოდის მდინარის სახელი წყალწითელა.


    დღეს **ძმების ნაწილები ტაძარში, ხის კიდობანშია დაბრძანებული**. აქ ძველი ტრადიციაა: მლოცველები კიდობნის
    ქვეშ სამჯერ გაივლიან და სურვილს იტყვიან. ეს რიტუალი დღემდე ცოცხალია და ვიზიტორთა უმეტესობა სწორედ
    ამისთვის ჩერდება.


    ვიზიტი ხანმოკლეა — ორმოციოდე წუთი. ტაძარი მცირეა, ეზო კი პატარა, თუმცა ხედი და სიჩუმე მას გელათის
    შემდეგ ბუნებრივ გაგრძელებად აქცევს. ორივე ერთსა და იმავე გზაზეა და ერთი გასვლით მოხვდები.


    ხეობის თავზე მდებარეობის გამო მოწამეთა ფოტოგრაფებისთვის ერთ-ერთი საუკეთესო წერტილია რაიონში: შემოდგომაზე
    ტყე წითლდება და მონასტერი ფაქტობრივად ხეობის თავზე ჰგავს დაკიდებულს. მოპირდაპირე ფერდობზე ბილიკია,
    საიდანაც კომპლექსი მთლიანად ჩანს — ორმოცდაათი მეტრის სავალია პარკინგიდან.


    ვიზიტს ხშირად გელათთან ერთად აწყობენ და ეს ლოგიკურია: ორი მონასტერი ერთმანეთისგან სულ სამიოდე კილომეტრშია,
    თუმცა სრულიად განსხვავებული განწყობისაა — გელათი დიდი და საზეიმოა, მოწამეთა კი პატარა, ინტიმური და
    ხეობაზე გადმოკიდებული.
  tip: >
    მოქმედი მონასტერია: ქალებს თავსაფარი და გრძელი კაბა, მამაკაცებს გრძელი შარვალი სჭირდებათ; კარიბჭესთან
    გადასაფარებლები დევს. ეზოს კიდე დაუცველია და ხეობა ციცაბოა — ბავშვს თვალი ადევნე. მოდი გელათის შემდეგ,
    დღის მეორე ნახევარში, როცა ავტობუსები უკვე წასულია. მანქანა ბოლო მოხვევამდე პატარა მოედანზე ტოვებ.
    ტუალეტი მარტივია, კაფე და ბანკომატი — ქუთაისში. ეზო ძალიან პატარაა და ავტობუსის ჩამოსვლისას სივიწროვე
    იგრძნობა — ათი წუთი დაელოდე და დაცარიელდება.
  route: >
    თბილისიდან E60-ით ქუთაისამდე — ორას ოცდაათი კილომეტრი, სამი საათი ოცი წუთი. ქუთაისიდან გელათის იმავე
    გზით მიდიხარ და ხუთიოდე კილომეტრში მარჯვნივ, მოწამეთაზე უხვევ. ბოლო ორი კილომეტრი ვიწრო, ციცაბო და
    მოხვევებიანი ასფალტია — ორი მანქანა ძლივს ცილდება და ავტობუსები აქ პრობლემას ქმნიან. ეკონომ კლასი
    გაივლის, თუმცა წვიმაში ფრთხილად. საწვავი და ბანკომატები ქუთაისში აავსე, გზაზე აღარაფერია. მოწამეთისა
    და გელათის ერთად მოვლა ორ საათს იკავებს, ამიტომ ქუთაისში დაბრუნება სადილზე მშვიდად მოასწრებ.
en:
  name: Motsameta Monastery
  short: A small monastery on a cliff above the Tskaltsitela gorge, holding the relics of two martyred
    dukes.
  body: >-
    Motsameta stands six kilometres from Kutaisi on a narrow rock spur above the gorge of the Tskaltsitela
    river. In scale it cannot compete with Gelati, but its setting is far more dramatic: from the edge
    of the courtyard the gorge drops away almost vertically.


    The name means the martyrs. During the Arab invasions of the 8th century the brothers David and Constantine
    Mkheidze were tortured to death here for refusing to renounce their faith. Tradition says their bodies
    were thrown into the river and the water ran red, which is where the river's name — Tskaltsitela,
    red water — is said to come from.


    Today **the brothers' relics rest in a wooden casket inside the church**. An old custom survives here:
    pilgrims pass under the casket three times and make a wish. The ritual is still very much alive, and
    it is what most visitors stop for.


    The visit is short, around forty minutes. The church is small and the courtyard modest, but the view
    and the quiet make it a natural continuation after Gelati. Both sit on the same road out of Kutaisi,
    so one outing covers them.
  tip: >-
    This is a working monastery: women need a headscarf and long skirt, men long trousers, and wraps are
    usually available at the gate. The courtyard edge is unfenced above a steep gorge, so keep children
    close. Come after Gelati, in the second half of the day, once the coaches have moved on. Park at the
    small area before the final bend. Toilets are basic; the nearest cafe and ATM are back in Kutaisi.
  route: >-
    Take the E60 from Tbilisi to Kutaisi — 230 km and about three hours twenty. From the city follow the
    same road as for Gelati, then after roughly five kilometres turn right for Motsameta. The final two
    kilometres are narrow, steep and winding asphalt where two cars barely pass and coaches cause real
    congestion. An economy car manages it, but take care in the wet. Fill up and draw cash in Kutaisi,
    as there is nothing along the way.
ru:
  name: Монастырь Моцамета
  short: Небольшой монастырь на скале над ущельем Цхалцителы с мощами двух князей-мучеников.
  body: >
    Моцамета стоит в шести километрах от Кутаиси, на узком скальном выступе над ущельем реки Цхалцитела.
    По масштабу он не сравнится с Гелати, зато расположен куда эффектнее: от края двора ущелье уходит
    вниз почти отвесно.


    Название означает «мученики». Во время арабских нашествий в VIII веке здесь были замучены братья Давид
    и Константин Мхеидзе, отказавшиеся отречься от веры. По преданию, их тела сбросили в реку, и вода
    окрасилась кровью — отсюда, как считается, и название реки Цхалцитела, «красная вода».


    Сегодня **мощи братьев покоятся в деревянном ковчеге внутри храма**. Здесь сохранился старый обычай:
    паломники трижды проходят под ковчегом и загадывают желание. Ритуал вполне живой, и большинство посетителей
    останавливается именно ради него.


    Визит короткий, около сорока минут. Храм небольшой, двор скромный, но вид и тишина делают его естественным
    продолжением поездки в Гелати. Оба монастыря стоят на одной дороге из Кутаиси, так что одной вылазки
    достаточно.


    Благодаря положению над ущельем Моцамета — одна из лучших фотографических точек в округе: осенью лес
    краснеет, и монастырь кажется буквально подвешенным над обрывом. На противоположном склоне есть тропа,
    откуда комплекс виден целиком, и до неё от парковки всего полсотни метров.
  tip: >-
    Монастырь действующий: женщинам нужен платок и длинная юбка, мужчинам — длинные брюки, накидки обычно
    лежат у ворот. Край двора не огорожен, а ущелье крутое, поэтому детей держите рядом. Приезжайте после
    Гелати, во второй половине дня, когда автобусы уже уехали. Машину оставляйте на небольшой площадке
    перед последним поворотом. Туалет простой, ближайшее кафе и банкомат — в Кутаиси.
  route: >-
    Из Тбилиси по E60 до Кутаиси — 230 км и около трёх часов двадцати минут. Из города двигайтесь по той
    же дороге, что и к Гелати, а примерно через пять километров поверните направо, на Моцамету. Последние
    два километра — узкий крутой асфальт с поворотами, где две машины расходятся с трудом, а автобусы
    создают заторы. Машина эконом-класса пройдёт, но в дождь нужна осторожность. Заправляйтесь и снимайте
    наличные в Кутаиси: по дороге ничего нет.
fa:
  name: صومعهٔ موتسامتا
  short: صومعه‌ای کوچک بر صخره‌ای بالای تنگهٔ تسکالتسیتلا، نگهدار یادگارهای دو دوکِ شهیدشده.
  body: >-
    موتسامتا در شش کیلومتری کوتایسی، روی زبانهٔ باریکی از صخره بالای تنگهٔ رود تسکالتسیتلا ایستاده است.
    در مقیاس نمی‌تواند با گلاتی رقابت کند، اما موقعیتش به‌مراتب نمایشی‌تر است: از لبهٔ حیاط، تنگه تقریباً
    عمودی فرو می‌افتد.


    نام آن یعنی شهیدان. در جریان هجوم‌های عرب در سدهٔ هشتم، دو برادر، داوید و کنستانتین مخئیدزه، به‌سبب
    نپذیرفتن ترک ایمانشان در همین‌جا زیر شکنجه کشته شدند. سنت می‌گوید پیکرهایشان را به رودخانه انداختند
    و آب سرخ شد؛ و گفته می‌شود نام رود — تسکالتسیتلا، یعنی آب سرخ — از همین‌جا آمده است.


    امروز **یادگارهای دو برادر در تابوتی چوبی درون کلیسا آرام گرفته‌اند**. آدابی کهن اینجا زنده مانده
    است: زائران سه بار از زیر تابوت می‌گذرند و آرزو می‌کنند. این آیین همچنان کاملاً جاری است و بیشتر بازدیدکنندگان
    برای همین توقف می‌کنند. بازدید کوتاه است، حدود چهل دقیقه. کلیسا کوچک و حیاط ساده است، اما منظره و
    سکوت، آن را به ادامه‌ای طبیعی پس از گلاتی بدل می‌کند. هر دو روی یک جادهٔ خروجی از کوتایسی‌اند، پس
    یک بیرون‌رفت هر دو را پوشش می‌دهد.
  tip: >-
    این صومعه‌ای فعال است: زنان به روسری و دامن بلند نیاز دارند و مردان به شلوار بلند؛ معمولاً کنار دروازه
    پوشش در دسترس است. لبهٔ حیاط بالای تنگه‌ای تند نرده ندارد، پس بچه‌ها را نزدیک خود نگه دارید. پس از
    گلاتی و در نیمهٔ دوم روز بیایید، وقتی اتوبوس‌ها رفته‌اند. در محوطهٔ کوچک پیش از پیچ آخر پارک کنید.
    سرویس بهداشتی ابتدایی است؛ نزدیک‌ترین کافه و خودپرداز در کوتایسی است.
  route: >-
    از تفلیس با E60 تا کوتایسی بروید — 230 کیلومتر و حدود سه ساعت و بیست دقیقه. از شهر همان جادهٔ گلاتی
    را دنبال کنید و پس از تقریباً پنج کیلومتر به راست به سوی موتسامتا بپیچید. دو کیلومتر پایانی آسفالتی
    باریک، تند و پرپیچ است که دو خودرو به‌زحمت از کنار هم رد می‌شوند و اتوبوس‌ها گره واقعی ایجاد می‌کنند.
    خودروی اقتصادی از پس آن برمی‌آید، اما در هوای مرطوب مراقب باشید. در کوتایسی باک را پر کنید و پول نقد
    بگیرید، چون در راه هیچ چیز نیست.
he:
  name: מנזר מוצמטה
  short: מנזר קטן על צוק מעל ערוץ צקאלציטלה, ובו שרידיהם של שני דוכסים שהוצאו להורג.
  body: >-
    מוצמטה עומד שישה קילומטרים מקוטאיסי, על צוק סלע צר מעל ערוץ נהר צקאלציטלה. בגודלו אין הוא יכול להתחרות
    בגלאטי הסמוך, אבל המיקום שלו דרמטי בהרבה: מקצה החצר הערוץ צונח כמעט אנכית מטה, והיער מכסה את המדרונות
    משלושה עברים.


    השם פירושו הקדושים המעונים. במהלך הפלישות הערביות של המאה השמינית עונו כאן למוות האחים דוד וקונסטנטין
    מחאידזה, משום שסירבו להמיר את אמונתם. המסורת מספרת שגופותיהם הושלכו לנהר והמים האדימו, ומכאן, כך אומרים,
    בא שמו של הנהר — צקאלציטלה, כלומר מים אדומים. הכנסייה שעומדת היום על המקום נבנתה מאוחר יותר, אך המסורת
    עצמה נשמרה ברציפות.


    כיום **שרידי האחים מונחים בארון עץ בתוך הכנסייה**. מנהג עתיק שרד כאן: עולי הרגל עוברים שלוש פעמים
    מתחת לארון ומביעים משאלה. הטקס הזה חי מאוד גם היום, והוא מה שרוב המבקרים עוצרים בשבילו. הביקור קצר,
    כארבעים דקות. הכנסייה קטנה והחצר צנועה, אבל הנוף והשקט הופכים את המקום להמשך טבעי אחרי גלאטי. שני
    האתרים יושבים על אותו כביש היוצא מקוטאיסי, כך שיציאה אחת מכסה את שניהם בנוחות.
  tip: >-
    זהו מנזר פעיל: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים, ובדרך כלל יש כיסויים בשער.
    קצה החצר אינו מגודר מעל ערוץ תלול, לכן החזיקו ילדים קרוב. בואו אחרי גלאטי, במחצית השנייה של היום,
    אחרי שהאוטובוסים כבר עזבו. החנו במגרש הקטן שלפני הפנייה האחרונה. השירותים בסיסיים; בית הקפה והכספומט
    הקרובים ביותר נמצאים בחזרה בקוטאיסי.
  route: >-
    סעו מטביליסי בכביש E60 עד קוטאיסי — 230 ק"מ וכשלוש שעות עשרים. מהעיר המשיכו באותו כביש שמוביל לגלאטי,
    ואחרי כחמישה קילומטרים פנו ימינה למוצמטה. שני הקילומטרים האחרונים הם אספלט צר, תלול ומתפתל שבו שתי
    מכוניות בקושי חולפות זו על פני זו, ואוטובוסים יוצרים פקק של ממש. רכב חסכוני מסתדר בקטע הזה, אך יש
    להיזהר כשהכביש רטוב. תדלקו והוציאו מזומן בקוטאיסי, מפני שבדרך עצמה אין שום דבר.
ar:
  name: دير موتساميتا
  short: دير صغير على جرف فوق وادي تسكالتسيتيلا، يحتفظ برفات دوقين استُشهدا.
  body: >-
    يقوم دير موتساميتا على بعد ستة كيلومترات من كوتايسي، على نتوء صخري ضيق يعلو وادي نهر تسكالتسيتيلا.
    وهو لا ينافس غيلاتي القريب في الحجم، لكن موقعه أشد إثارة بكثير: فمن حافة الفناء ينحدر الوادي عمودياً
    تقريباً، وتغطي الغابة المنحدرات من ثلاث جهات.


    يعني الاسم الشهيدين. ففي أثناء الغزوات العربية في القرن الثامن عُذّب هنا حتى الموت الأخوان داود وقسطنطين
    مخيدزي لرفضهما التخلي عن إيمانهما. وتقول الرواية إن جثمانيهما أُلقيا في النهر فاحمرّ الماء، ومن هنا
    — كما يُقال — جاء اسم النهر: تسكالتسيتيلا، أي الماء الأحمر. أما الكنيسة القائمة اليوم فبُنيت في عهد
    لاحق، غير أن التقليد نفسه بقي متصلاً.


    واليوم **يرقد رفات الأخوين في تابوت خشبي داخل الكنيسة**. وقد بقيت هنا عادة قديمة: يمر الحجاج ثلاث
    مرات من تحت التابوت ويتمنون أمنية. ولا يزال هذا الطقس حياً تماماً، وهو ما يتوقف من أجله معظم الزوار.
    الزيارة قصيرة، نحو أربعين دقيقة. الكنيسة صغيرة والفناء متواضع، لكن الإطلالة والسكون يجعلان منه امتداداً
    طبيعياً بعد غيلاتي. ويقع الموقعان على الطريق نفسه الخارج من كوتايسي، فتغطيهما جولة واحدة.
  tip: >-
    هذا دير عامل: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال إلى بنطال طويل، وتتوفر الأغطية عادة
    عند البوابة. وحافة الفناء بلا سياج فوق وادٍ شديد الانحدار، فأبقِ الأطفال قريبين منك. تعال بعد غيلاتي،
    في النصف الثاني من اليوم، بعد أن تكون الحافلات قد غادرت. اركن في الساحة الصغيرة قبل المنعطف الأخير.
    دورات المياه بدائية؛ وأقرب مقهى وصراف آلي في كوتايسي.
  route: >-
    اسلك الطريق E60 من تبليسي إلى كوتايسي — 230 كم ونحو ثلاث ساعات وعشرين دقيقة. ومن المدينة اتبع الطريق
    نفسه المؤدي إلى غيلاتي، ثم بعد خمسة كيلومترات تقريباً انعطف يميناً نحو موتساميتا. والكيلومتران الأخيران
    إسفلت ضيق شديد الانحدار وكثير المنعطفات، تكاد سيارتان لا تتجاوزان فيه، وتسبب الحافلات ازدحاماً حقيقياً.
    وسيارة اقتصادية تتدبر الأمر، لكن انتبه عندما يكون الطريق مبللاً. املأ الخزان واسحب نقداً في كوتايسي،
    فلا شيء على طول الطريق.
