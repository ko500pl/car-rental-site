ka:
  name: მოწამეთას მონასტერი
  short: >-
    მონასტერი წყალწითელას ხეობის მოსახვევში, კლდოვან კონცხზე, სადაც მლოცველები VIII საუკუნის ორი მოწამის
    ლუსკუმის ქვეშ გაძვრებიან.
  body: >-
    **მოწამეთას ქვემოთ მდინარეს წყალწითელა ჰქვია და მონასტერი სწორედ ამ სახელის ასახსნელად დგას.** 735–737
    წლებში მურვან ყრუს არაბთა ლაშქარი დასავლეთ საქართველოს მოედო. არგვეთის მთავრები, ძმები დავითი და კონსტანტინე
    მხეიძეები, ტყვედ ჩავარდნენ; სიცოცხლეს რწმენის უარყოფის ფასად სთავაზობდნენ. ძმებმა უარი თქვეს და ისინი
    წამებით მოკლეს. გადმოცემით, მათი ცხედრები მდინარეში გადააგდეს და წყალი სისხლისგან აწითლდა — აქედან
    მოდის სახელი წყალწითელა. სხვა თქმულებით, ძმების ნეშტი ხეობიდან ლომებმა ამოიტანეს.


    ძმები ამ კონცხზე, შემოსეულთა მიერ დანგრეული ეკლესიის კრიპტაში დაკრძალეს, მოგვიანებით კი მეფე ბაგრატმა
    მათ საფლავზე მონასტერი ააგო — უმეტესი ვერსიით ბაგრატ IV-მ, ზოგის აზრით ბაგრატ V-მ. რასაც დღეს ხედავთ,
    მეტწილად XIX საუკუნისაა: ეკლესია 1844–1845 წლებში გააფართოვეს, 1860-იან წლებში გუმბათი დაადგეს და
    1863 წელს აკურთხეს; მშენებლობას ოსტატები ბერეკაშვილები — ლევანი, მოსე და ფილიპე — უძღვებოდნენ და ფასადები
    შუა საუკუნეების ორნამენტით შეამკეს. საკურთხეველი, უჩვეულოდ, ჩრდილოეთისკენაა მიმართული.


    შიგნით, აღმოსავლეთ კედელთან, ხუთი საფეხურით შემაღლებულ ადგილზე წმინდანების ლუსკუმა დგას, მის წინ კი
    1840-იან წლებში გამოთლილი ორი ხის ძუ ლომი წევს. ლუსკუმის ქვეშ დაბალი გასასვლელია და მლოცველები მოხრილნი
    გაძვრებიან — ჩვეულებით სამჯერ, ჩაფიქრებული სურვილით. წმინდა ნაწილებსაც თავისი გზა აქვს გავლილი: 1923
    წელს ისინი ქუთაისის მუზეუმში გადაიტანეს და შინ მხოლოდ მიტროპოლიტ გაბრიელის (ჩაჩანიძე) ძალისხმევით
    დაბრუნდა; ახლანდელი ლუსკუმა 1954 წელს გაკეთდა.


    XIX საუკუნის რუსი მოგზაური მურავიოვი წერდა, რომ ბერული განმარტოებისთვის უკეთესი ადგილის შერჩევა შეუძლებელია.
    გელათი, ბორცვის მიღმა, მეფეებისა და სწავლულებისთვის აშენდა. მოწამეთა ორი დაღუპული ძმისთვის აშენდა
    — და დღემდე დარაჯობს წითელ წყალს.
  tip: >-
    მოქმედი მონასტერია: ქალები თავსაბურავითა და ქვედაბოლოთი შედიან (გადასაფარებლები, ჩვეულებრივ, კარიბჭესთან
    აწყვია), მამაკაცები — გრძელი შარვლით; მხრები ყველას დაფარული უნდა ჰქონდეს. შიგნით ფოტოს გადაღებამდე
    ნებართვა ითხოვეთ. ეკლესიის გვერდით კლდე ციცაბოა — ბავშვებს ხელი არ გაუშვათ. ტურისტული ჯგუფები ხშირად
    გელათიდან აქეთ მოდიან, ამიტომ დილით ადრე ან დღის ბოლოს მოდით; თუ პატარა ეზო გადაჭედილია, ათიოდე წუთის
    მოთმინება, როგორც წესი, საკმარისია. ტუალეტი მარტივია, კაფე და ბანკომატი — ქუთაისში. ყოველწლიური დღესასწაული,
    მოწამეთობა, მონასტერს მლოცველებით ავსებს — დასამახსოვრებელია, მაგრამ არა მშვიდი.
  route: >-
    თბილისიდან E60-ით (ს1) ქუთაისამდე. კოლხური შადრევნიდან ქალაქის ცენტრი ჩრდილო-აღმოსავლეთით, გელათის
    ქუჩით დატოვეთ — ის ტყიბულისკენ მიმავალ შ17-ში გადადის. შადრევნიდან დაახლოებით 4,5 კილომეტრში მარჯვნივ,
    შ74-ზე — მოწამეთას გზაზე — გადაუხვიეთ: გზა კილომეტრნახევარს მიიკლაკნება პატარა ავტოსადგომამდე, კარიბჭის
    კოშკამდე ბოლო მონაკვეთი კი ფეხით გაივლება. თბილისიდან სულ დაახლოებით 235 კმ, სამი საათი და ოცდახუთი
    წუთი. გზა ვიწრო და მოსახვევებიანია, პირისპირ ავტობუსებიც მოდიან — ნელა იარეთ, განსაკუთრებით წვიმაში.
    ეკონომ-კლასის მანქანა საკმარისია. საწვავი და ნაღდი ფული ქუთაისში აიღეთ.
en:
  name: Motsameta Monastery
  short: >-
    A cliff-top monastery in a bend of the Tskaltsitela gorge, where pilgrims stoop beneath the relics
    of two 8th-century martyrs.
  body: >-
    **The river below Motsameta is called Red Water, and the monastery exists to explain why.** In 735–737
    an Arab army under Marwan, remembered in Georgia as Murvan the Deaf, swept through the west of the
    country. Two brothers of the ruling house of Argveti, David and Constantine Mkheidze, were taken prisoner
    and offered their lives in exchange for their faith. They refused and were tortured to death. Tradition
    says their bodies were thrown into the river and the water ran red, hence Tskaltsitela. Another story
    has lions carrying the brothers’ remains up out of the gorge.


    They were buried in the crypt of a church the invaders had wrecked on this promontory, and later a
    king named Bagrat raised a monastery over their grave: Bagrat IV in most accounts, though some argue
    for Bagrat V. Much of what you see is 19th-century work. The church was enlarged in 1844–45, crowned
    with a dome in the 1860s and consecrated in 1863, and its builders, the brothers Levan, Moses and
    Philip Berekashvili, dressed it in medieval ornament. Unusually, its altar faces north.


    Inside, the saints’ reliquary stands against the east wall on a dais five steps high, and two wooden
    lionesses, carved in the 1840s, lie before it. Beneath it runs a low passage, and pilgrims stoop through
    it, by custom three times, with a wish. The relics have travelled too. In 1923 they were taken to
    the museum in Kutaisi, and they came home only through the efforts of Metropolitan Gabriel Chachanidze;
    the present reliquary dates from 1954.


    A 19th-century Russian traveller, Muravyov, wrote that no better place could be chosen for monastic
    solitude. Gelati, over the hill, was built for kings and scholars. Motsameta was built for two dead
    brothers, and it still keeps watch over the red water.
  tip: >-
    This is a working monastery: women cover their hair and wear a skirt (wraps are usually available
    at the gate), men wear long trousers, and shoulders stay covered. Ask before photographing inside.
    The cliff beside the church is sheer, so keep hold of children. Tour groups often come on from Gelati,
    so arrive early or late in the day; if the small courtyard is crowded, ten minutes’ patience usually
    empties it. Toilets are basic; cafés and ATMs are in Kutaisi. The annual feast of Motsametoba fills
    the place with pilgrims, which is memorable, but not quiet.
  route: >-
    Take the E60 (S1) west from Tbilisi to Kutaisi. From the Colchis Fountain leave the centre north-east
    along Gelati Street, which becomes the Sh17 towards Tkibuli. About 4.5 km from the fountain turn right
    onto the Sh74, the Motsameta road, which winds for a kilometre and a half to a small parking area;
    the last stretch to the gate tower is on foot. About 235 km from Tbilisi, three hours twenty-five.
    The lane is narrow and twisting, with coaches coming the other way, so take it slowly, especially
    in the rain. An economy car is fine. Get fuel and cash in Kutaisi.
ru:
  name: Монастырь Моцамета
  short: Монастырь на скале в изгибе ущелья Цкалцителы, где паломники склоняются под мощами двух мучеников
    VIII века.
  body: >-
    **Река под Моцаметой называется Красной Водой, и монастырь существует, чтобы объяснить почему.** В
    735–737 годах арабское войско под командованием Мурвана, известного в Грузии как Мурван Глухой, прошло
    через запад страны огнём и мечом. Двух братьев из правящего дома Аргвети, Давида и Константина Мхеидзе,
    взяли в плен и предложили жизнь в обмен на отречение от веры. Они отказались и были замучены до смерти.
    Предание говорит, что их тела бросили в реку, и вода стала красной — отсюда название Цкалцитела. По
    другому преданию, останки братьев вынесли из ущелья львы.


    Их похоронили в крипте церкви, разрушенной завоевателями на этом мысу, а позже некий царь по имени
    Баграт возвёл над их могилой монастырь: по большинству источников это Баграт IV, хотя некоторые называют
    Баграта V. Многое из того, что вы видите сегодня, — работа XIX века. Церковь расширили в 1844–1845
    годах, увенчали куполом в 1860-е и освятили в 1863-м, а её строители, братья Леван, Мосе и Филипп
    Берекашвили, украсили её средневековым орнаментом. Необычно, что алтарь здесь обращён на север.


    Внутри реликварий святых стоит у восточной стены на возвышении из пяти ступеней, а перед ним лежат
    две деревянные львицы, вырезанные в 1840-е годы. Под ним устроен низкий лаз, и паломники, согнувшись,
    проходят через него — по обычаю трижды, загадав желание. Мощи тоже путешествовали. В 1923 году их
    перевезли в музей Кутаиси, и вернулись они на родину лишь благодаря усилиям митрополита Гавриила Чачанидзе;
    нынешний реликварий датируется 1954 годом.


    Русский путешественник XIX века Муравьёв писал, что нельзя было выбрать лучшего места для монашеского
    уединения. Гелати, за холмом, строили для царей и учёных. Моцамета была построена для двух погибших
    братьев, и она до сих пор бережёт красную воду.
  tip: >-
    Это действующий монастырь: женщины покрывают волосы и надевают юбку (у ворот обычно можно взять накидку),
    мужчины носят длинные брюки, плечи должны быть закрыты. Спрашивайте разрешения перед съёмкой внутри.
    Скала рядом с церковью обрывистая, так что держите детей за руку. Туристические группы часто приезжают
    сюда после Гелати, поэтому лучше приезжать рано утром или в конце дня; если маленький двор переполнен,
    десять минут терпения обычно решают дело. Туалеты простые; кафе и банкоматы — в Кутаиси. Ежегодный
    праздник Моцаметоба заполняет это место паломниками — незабываемо, но не тихо.
  route: >-
    Двигайтесь по трассе E60 (S1) на запад от Тбилиси до Кутаиси. От фонтана «Колхида» выезжайте из центра
    на северо-восток по улице Гелати, которая переходит в дорогу Ш17 к Ткибули. Примерно через 4,5 км
    от фонтана поверните направо на дорогу Ш74 к Моцамете: она полтора километра вьётся до небольшой стоянки,
    а последний участок до надвратной башни — пешком. Всего около 235 км от Тбилиси, три часа двадцать
    пять минут. Дорога узкая и извилистая, встречные автобусы попадаются часто, так что двигайтесь медленно,
    особенно в дождь. Подойдёт автомобиль эконом-класса. Заправляйтесь и снимайте наличные в Кутаиси.
fa:
  name: صومعه موتسامتا
  short: صومعه‌ای بر صخره در پیچ دره تسکالتسیتلا، جایی که زائران زیر بقایای دو شهید سده هشتم خم می‌شوند.
  body: >-
    **رودخانه زیر موتسامتا آب سرخ نام دارد، و صومعه برای توضیح این نام برپاست.** در سال‌های ۷۳۵ تا ۷۳۷،
    سپاهی عرب به فرماندهی مروان، که در گرجستان به «مروان کر» شناخته می‌شود، غرب کشور را درنوردید. دو برادر
    از خاندان حاکم آرگوتی، داوید و کنستانتین مخئیدزه، به بند افتادند و به آن‌ها پیشنهاد شد که در ازای
    دست کشیدن از ایمانشان زنده بمانند. آن‌ها نپذیرفتند و تا مرگ شکنجه شدند. روایت می‌گوید پیکرهایشان را
    به رودخانه افکندند و آب سرخ شد؛ نام تسکالتسیتلا از همین‌جاست. روایتی دیگر می‌گوید شیرانی بقایای دو
    برادر را از دره بالا آوردند.


    آن‌ها را در سردابه کلیسایی که مهاجمان بر همین دماغه ویران کرده بودند به خاک سپردند، و بعدها شاهی به
    نام باگرات بر مزارشان صومعه‌ای برافراشت: به روایت بیشتر منابع باگرات چهارم، هرچند برخی باگرات پنجم
    را می‌گویند. بیشتر آنچه امروز می‌بینید کار سده نوزدهم است. کلیسا در سال‌های ۱۸۴۴ تا ۱۸۴۵ گسترش یافت،
    در دهه ۱۸۶۰ گنبدی بر آن نشست و در سال ۱۸۶۳ تقدیس شد، و سازندگانش، برادران لوان، موسه و فیلیپه برکاشویلی،
    آن را به آرایه‌های سده‌های میانه آراستند. به‌طرزی نامتعارف، مذبح آن رو به شمال دارد.


    درون، صندوقچه مقدسان کنار دیوار شرقی، بر سکویی به بلندی پنج پله، ایستاده است، و دو شیر ماده چوبی،
    کنده‌کاری‌شده در دهه ۱۸۴۰، پیش‌رویش خفته‌اند. زیر آن گذرگاهی کم‌ارتفاع هست، و زائران، بنا به رسم،
    سه بار خم‌شده و با آرزویی از آن می‌گذرند. بقایا نیز سفر کرده‌اند. در سال ۱۹۲۳ آن‌ها را به موزه کوتایسی
    بردند، و تنها به کوشش متروپولیت گابریل چاچانیدزه بازگشتند؛ صندوقچه کنونی به سال ۱۹۵۴ بازمی‌گردد.


    سیاح روسی سده نوزدهم، موراویوف، نوشت که برای گوشه‌گیری رهبانی جایی بهتر از این نمی‌شد یافت. گلاتی،
    آن سوی تپه، برای شاهان و دانشوران ساخته شد. موتسامتا برای دو برادر جان‌باخته ساخته شد، و هنوز بر آب
    سرخ دیده‌بانی می‌کند.
  tip: >-
    این صومعه‌ای فعال است: زنان مو می‌پوشانند و دامن می‌پوشند (روسری و شنل معمولاً کنار دروازه در دسترس
    است)، مردان شلوار بلند می‌پوشند، و شانه‌ها همیشه پوشیده می‌مانند. پیش از عکاسی درون، اجازه بگیرید.
    صخره کنار کلیسا عمودی و پرشیب است، پس دست کودکان را بگیرید. گروه‌های تور اغلب از گلاتی به این‌جا می‌آیند،
    پس صبح زود یا اواخر روز بیایید؛ اگر حیاط کوچک پرجمعیت بود، ده دقیقه صبر معمولاً کافی است. سرویس‌های
    بهداشتی ساده‌اند؛ کافه و دستگاه خودپرداز در کوتایسی است. جشن سالانه موتسامتوبا این‌جا را از زائران
    پر می‌کند، تجربه‌ای به‌یادماندنی، اما نه آرام.
  route: >-
    از تفلیس بر جاده E60 (S1) به سوی غرب تا کوتایسی حرکت کنید. از فوارهٔ کولخیس، از مرکز شهر به سوی شمال‌شرقی
    بر خیابان گلاتی بروید، که به جاده Sh17 به سوی تکیبولی بدل می‌شود. حدود ۴٫۵ کیلومتر پس از فواره، به
    راست به جاده Sh74، راه موتسامتا، بپیچید؛ این جاده یک‌ونیم کیلومتر پیچ‌وتاب می‌خورد تا به پارکینگی
    کوچک برسد، و بخش پایانی تا برج دروازه پیاده پیموده می‌شود. حدود ۲۳۵ کیلومتر از تفلیس، سه ساعت و بیست‌وپنج
    دقیقه. این جاده باریک و پرپیچ است، با اتوبوس‌هایی که از سوی مقابل می‌آیند، پس آهسته برانید، به‌ویژه
    در باران. خودرویی اقتصادی کافی است. سوخت و پول نقد را در کوتایسی تهیه کنید.
he:
  name: מנזר מוצאמטה
  short: מנזר על צוק בעיקול גיא צקלציטלה, שבו מתכופפים עולי רגל מתחת לשרידי שני קדושים מהמאה ה-8.
  body: >-
    **הנהר מתחת למוצאמטה נקרא 'המים האדומים', והמנזר קיים כדי להסביר מדוע.** בשנים 735–737 חצה צבא ערבי
    בפיקודו של מרואן, הזכור בגאורגיה כ'מורוואן החרש', את מערב המדינה. שני אחים מבית השלטון של ארגוטי,
    דוד וקונסטנטין מחיאידזה, נלכדו והוצע להם להישאר בחיים בתמורה לוויתור על אמונתם. הם סירבו ועברו עינויים
    עד מוות. המסורת מספרת שגופותיהם הוטלו לנהר, והמים האדימו — משם השם צקלציטלה. סיפור אחר מספר ששרידי
    שני האחים הועלו מהגיא בידי אריות.


    הם נקברו בכריפטה של כנסייה שהפולשים החריבו על שלוחת הסלע הזו, ומאוחר יותר הקים מלך בשם בגראט מנזר
    על קברם: בגראט הרביעי, ברוב הגרסאות, אף שחלקן טוענות לבגראט החמישי. רוב מה שנראה כיום הוא עבודה מהמאה
    ה-19. הכנסייה הורחבה ב-1844–1845, הוכתרה בכיפה בשנות ה-60 של המאה ה-19 והוקדשה ב-1863, ובוניה — האחים
    לוואן, מוסה ופיליפה ברקשווילי — עיטרו אותה בקישוט ימי-ביניימי. באופן חריג, המזבח שלה פונה צפונה.


    בפנים, צמודה לקיר המזרחי, עומדת תיבת השרידים של הקדושים על במה בת חמש מדרגות, ולפניה שוכבות שתי לביאות
    עץ, מגולפות בשנות ה-1840. מתחתיה עובר מעבר נמוך, ועולי הרגל מתכופפים ועוברים בו, לפי המנהג שלוש פעמים,
    עם משאלה. גם השרידים נדדו. ב-1923 הועברו למוזיאון בקוטאיסי, וחזרו לביתם רק בזכות מאמציו של המטרופוליט
    גבריאל צ'צ'אנידזה; התיבה הנוכחית היא מ-1954.


    נוסע רוסי מהמאה ה-19, מוראביוב, כתב שלא ניתן לבחור מקום טוב יותר להתבודדות מנזרית. גלאתי, מעבר לגבעה,
    נבנה למען מלכים וחכמים. מוצאמטה נבנה למען שני אחים מתים, ועדיין שומר על המים האדומים.
  tip: >-
    זהו מנזר פעיל: נשים מכסות את השיער ולובשות חצאית (בגדי כיסוי זמינים בדרך כלל בשער), גברים לובשים מכנסיים
    ארוכים, והכתפיים נשארות מכוסות. בקשו רשות לפני צילום בפנים. הצוק שלצד הכנסייה תלול, אז החזיקו את הילדים
    ביד. קבוצות תיירים מגיעות לרוב מגלאתי, אז בואו מוקדם או בשעות מאוחרות ביום; אם החצר הקטנה עמוסה, בדרך
    כלל עשר דקות סבלנות פותרות זאת. השירותים בסיסיים; בתי הקפה והכספומטים נמצאים בקוטאיסי. חג מוצאמטובה
    השנתי ממלא את המקום בעולי רגל — חוויה בלתי נשכחת, אך לא שקטה.
  route: >-
    נסעו בכביש E60 (S1) מטביליסי מערבה עד קוטאיסי. ממזרקת קולכיס צאו מהמרכז צפון-מזרחה ברחוב גלאתי, שהופך
    לכביש Sh17 לעבר טקיבולי. כ-4.5 ק"מ מהמזרקה פנו ימינה לכביש Sh74, כביש מוצאמטה, המתפתל קילומטר וחצי
    עד חניון קטן; הקטע האחרון עד מגדל השער נעשה ברגל. כ-235 ק"מ מטביליסי, שלוש שעות ו-25 דקות. הדרך צרה
    ומתפתלת, עם אוטובוסים מהכיוון הנגדי, אז נהגו לאט, בפרט בגשם. רכב אקונומי מתאים. תדלקו ומשכו מזומן
    בקוטאיסי.
ar:
  name: دير موتسامتا
  short: دير على حافة صخرية عند انعطافة وادي تسكالتسيتيلا، حيث ينحني الحجّاج تحت رفات شهيدين من القرن
    الثامن.
  body: >-
    **يُدعى النهر تحت موتسامتا «الماء الأحمر»، وقد وُجد الدير ليشرح السبب.** بين عامي 735 و737 عبر جيش
    عربي بقيادة مروان، الذي يُعرف في جورجيا بـ«مروان الأصمّ»، غرب البلاد. وقُبض على شقيقين من البيت الحاكم
    في أرغوتي، داويد وقسطنطين مخيدزه، وعُرضت عليهما الحياة مقابل التخلي عن إيمانهما. فرفضا وعُذّبا حتى
    الموت. ويقول التراث إن جثتيهما قُذفتا في النهر فاحمرّ ماؤه، ومن هنا جاء اسم تسكالتسيتيلا. وتروي حكاية
    أخرى أن أسودًا حملت رفات الشقيقين خارج الوادي.


    ودُفنا في سرداب كنيسة كان الغزاة قد خرّبوها على هذا الرأس البارز، وأقام لاحقًا ملك يُدعى باغرات ديرًا
    على قبرهما: باغرات الرابع في أغلب الروايات، مع أن بعضها يرجّح باغرات الخامس. ومعظم ما تراه اليوم من
    عمل القرن التاسع عشر. فقد وُسّعت الكنيسة بين 1844 و1845، وتوّجت بقبة في الستينيات من ذلك القرن وكُرِّست
    عام 1863، وكسا بنّاؤوها، الإخوة ليفان وموسيه وفيليبه بيريكاشفيلي، جدرانها بزخارف من العصور الوسطى.
    وعلى نحو غير مألوف، يتّجه مذبحها شمالًا.


    في الداخل يقف صندوق ذخائر القديسين إلى الجدار الشرقي على منصّة ترتفع بخمس درجات، وترقد أمامه لبؤتان
    من الخشب نُحتتا في الأربعينيات من القرن التاسع عشر. ويمرّ تحته ممرّ منخفض، ينحني الحجّاج للعبور منه،
    بحسب العادة ثلاث مرات، حاملين أمنية. وقد سافرت الذخائر أيضًا. في عام 1923 نُقلت إلى متحف كوتايسي،
    ولم تعد إلى وطنها إلا بمساعي المطران غابرييل تشاتشانيدزه؛ ويعود صندوق الذخائر الحالي إلى عام 1954.


    كتب الرحّالة الروسي مورافيوف في القرن التاسع عشر أنه لا يمكن اختيار مكان أفضل من هذا للعزلة الرهبانية.
    أما غيلاتي، خلف التلّ، فقد بُني للملوك والعلماء. بينما بُني موتسامتا لأجل شقيقين قتيلين، وهو لا يزال
    يرقب الماء الأحمر.
  tip: >-
    هذا دير عامر بالرهبان: تغطّي النساء شعرهنّ ويرتدين تنورة (تتوفر أغطية عادةً عند البوابة)، ويرتدي الرجال
    بنطالًا طويلًا، وتبقى الأكتاف مغطّاة. اطلب الإذن قبل التصوير في الداخل. الصخرة إلى جانب الكنيسة شديدة
    الانحدار، فأمسك بيد الأطفال. تأتي مجموعات الجولات غالبًا من غيلاتي، فاحرص على الوصول باكرًا أو في
    وقت متأخر من اليوم؛ وإذا كانت الساحة الصغيرة مزدحمة، فعادةً ما تكفي عشر دقائق من الصبر لتخلو. المرافق
    الصحية بسيطة؛ توجد المقاهي وأجهزة الصرف الآلي في كوتايسي. يملأ عيد موتسامتوبا السنوي المكان بالحجّاج،
    وهو مشهد لا يُنسى، لكنه ليس هادئًا.
  route: >-
    اتبع الطريق E60 (S1) غربًا من تبليسي حتى كوتايسي. من نافورة كولخيس، اترك وسط المدينة متجهًا شمال شرق
    على شارع غيلاتي، الذي يتحوّل إلى طريق Sh17 نحو تكيبولي. وعلى مسافة نحو 4.5 كم من النافورة، انحرف يمينًا
    إلى طريق Sh74، طريق موتسامتا، الذي يتعرّج كيلومترًا ونصفًا حتى موقف صغير للسيارات؛ ويُقطع الجزء الأخير
    حتى برج البوابة سيرًا على الأقدام. نحو 235 كم من تبليسي، أي ثلاث ساعات و25 دقيقة. الطريق ضيّق ومتعرّج،
    وتأتي عليه حافلات من الجهة المقابلة، فسِر ببطء، خصوصًا في المطر. تكفي سيارة اقتصادية. تزوّد بالوقود
    والنقد في كوتايسي.
