ka:
  name: ვანის არქეოლოგიური მუზეუმი
  short: კოლხური ქალაქის ნაშთები ბორცვზე და მუზეუმი, სადაც ძვ. წ. IV–I საუკუნეების ოქრო ინახება.
  body: >-
    **ვანი ის ადგილია, სადაც კოლხეთი ლეგენდიდან არქეოლოგიად იქცევა.** ბორცვი ქალაქ ვანის თავზე ას წელზე
    მეტია ითხრება და დღეს ის ერთდროულად სამუზეუმო ნაკრძალიცაა და გათხრების მოქმედი უბანიც.


    დასახლება ძვ. წ. VIII საუკუნეში დაიწყო და ოთხი ეტაპი გაიარა: ჯერ ხის სახლების პატარა სოფელი, შემდეგ
    ძვ. წ. VI–IV საუკუნეებში მდიდარი საელიტო ცენტრი, მერე ახალი არქიტექტურით გარდაქმნილი ქალაქი და ბოლოს,
    ძვ. წ. III–I საუკუნეებში, გამაგრებული ქალაქ-სამლოცველო კედლებით, კოშკებით და საკურთხევლებით. ძვ. წ.
    I საუკუნის შუა ხანებში ის აიღეს და დაწვეს — მკვლევრები პომპეუსს, ფარნაკე II-სა და მითრიდატე პერგამონელს
    შორის ვარაუდობენ.


    სისტემატური გათხრები 1966 წელს ოთარ ლორთქიფანიძემ დაიწყო, 2002 წლის შემდეგ კი დარეჯან კაჭარავა განაგრძო.
    ნაპოვნია:


    - ადგილობრივი ოქრომჭედლობა — დიადემები, საყურეები, საკიდები წვრილმარცვლოვანი ტექნიკით


    - ბერძნული იმპორტული კერამიკა და ტერაკოტა


    - ბრინჯაოს ქანდაკებების ფრაგმენტები, მათ შორის ტორსები


    - ძვ. წ. IV საუკუნის ბეჭედი ბერძნული სახელით


    ეს კომბინაცია — ადგილობრივი ოსტატობა და ბერძნული საქონელი ერთ სამარხში — ვანს კოლხეთისა და ხმელთაშუაზღვის
    ურთიერთობის მთავარ წყაროდ აქცევს.


    მუზეუმის შენობა ბორცვის ძირშია, ნაქალაქარი კი ზემოთ, ტერასებზე: კედლის მონაკვეთები, კარიბჭე, საკურთხევლის
    საძირკვლები. ორივე ერთად ორ საათს მოითხოვს. გაითვალისწინე, რომ ვანის საუკეთესო ნივთების ნაწილი თბილისში,
    ეროვნულ მუზეუმშია.


    ოქროს საწმისის კითხვა აქ ყოველთვის ჩნდება. ვანი არ არის აია — მითის ის ქალაქი, სადაც აიეტი მეფობდა
    — და არც ერთი არქეოლოგი ამას არ ამტკიცებს. სამაგიეროდ, ამ სამარხებში ნაპოვნი ოქრო ზუსტად იმ სახის
    სიმდიდრეს აჩვენებს, რომელმაც კოლხური ოქროს შესახებ ბერძნული ისტორიები წარმოშვა. ტერასებზე სიარული
    ამ აზრით ბევრად საინტერესოა, ვიდრე ლიტერატურული საწმისის ძებნა.
  tip: >-
    ორი საათი: ერთი მუზეუმში, ერთი ბორცვზე. ნაქალაქარამდე ასასვლელი ბილიკი ციცაბოა და საფეხურებიანი, ეტლისთვის
    გამოუსადეგარი; ზემოთ ჩრდილი თითქმის არ არის. ზაფხულში დილით ან საღამოს ადი. წვიმის შემდეგ თიხა სრიალა
    ხდება. ეტიკეტები ქართულ და ინგლისურ ენებზეა, გიდი კი წინასწარი შეთანხმებით ჰყავთ. კაფე და ტუალეტი
    მუზეუმშია, მაღაზიები — ქალაქის ცენტრში, ხუთ წუთში.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ ზესტაფონსა და ქუთაისზე გავლით, შემდეგ სამტრედიის მიმართულებით და სამხრეთით,
    ვანისკენ — სულ დაახლოებით 255 კმ და სამი საათი და ორმოცდახუთი წუთი. მთელი მარშრუტი ასფალტიანია და
    კარგ მდგომარეობაშია; ბოლო ოცი კილომეტრი ვიწრო რეგიონული გზაა სოფლებში, სადაც პირუტყვი ხშირად გამოდის.
    საწვავი ზესტაფონსა და ქუთაისში აიღე. მუზეუმის წინ უფასო პარკინგია. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Vani Archaeological Museum
  short: The remains of a Colchian city on a hill, and a museum holding gold made between the 4th and
    1st centuries BC.
  body: >-
    **Vani is where Colchis stops being a legend and becomes archaeology.** The hill above the small town
    of Vani has been dug for over a century, and the site today is both a museum-reserve and a working
    excavation.


    Settlement began in the 8th century BC and passed through four phases: first a small village of log
    houses; then, from the 6th to the 4th century BC, a wealthy elite centre; then a rebuilt town in new
    architectural forms; and finally, between roughly 250 and 47 BC, a fortified city-sanctuary with walls,
    towers and altars. In the middle of the 1st century BC it was stormed and burned. Scholars argue between
    Pompey, Pharnaces II and Mithridates of Pergamon.


    Systematic excavation began in 1966 under Otar Lordkipanidze and continued after 2002 under Darejan
    Kacharava. Among the finds:


    - local goldwork — diadems, temple pendants and necklaces in fine granulation


    - imported Greek pottery and terracotta figurines


    - fragments of bronze statuary, including torsos


    - a 4th-century BC signet ring cut with a Greek name


    It is that combination — local craftsmanship and Greek goods in the same grave — that makes Vani the
    main source for how Colchis dealt with the Mediterranean world.


    The museum building stands at the foot of the hill; the ancient town is above it on terraces, with
    stretches of wall, a gateway and altar foundations. Together they need about two hours. Note that
    some of the best Vani material is in the National Museum in Tbilisi rather than here.


    The question of the Golden Fleece comes up here constantly. Vani is not Aia, the city of Aeetes in
    the myth, and no archaeologist claims that it is. What the gold from these graves does show is exactly
    the kind of wealth that produced the Greek stories about Colchian gold in the first place. Walking
    the terraces with that in mind is considerably more rewarding than looking for a literal fleece.
  tip: >-
    Two hours: one in the museum, one on the hill. The path up to the site is steep with steps and is
    not wheelchair accessible; there is very little shade at the top. In summer go early or late in the
    day. After rain the clay turns slippery. Labels are in Georgian and English, and a guide can be arranged
    in advance. There is a cafe and toilets at the museum, and shops in the town centre five minutes away.
  route: >-
    Take the E60 west from Tbilisi past Zestaponi and Kutaisi, then follow signs towards Samtredia and
    turn south for Vani — about 255 km in all, three hours forty-five. The whole route is asphalt and
    in good condition; the last twenty kilometres are a narrow regional road through villages where livestock
    often wanders onto the carriageway. Refuel in Zestaponi or Kutaisi. There is free parking in front
    of the museum. An economy car is sufficient.
ru:
  name: Ванский археологический музей
  short: Остатки колхидского города на холме и музей, где хранится золото IV–I веков до н. э.
  body: >-
    **Вани — место, где Колхида перестаёт быть легендой и становится археологией.** Холм над городком
    Вани копают больше века, и сегодня это одновременно музей-заповедник и действующие раскопки.


    Поселение возникло в VIII веке до н. э. и прошло четыре фазы: сначала небольшая деревня с бревенчатыми
    домами; затем, с VI по IV век до н. э., богатый элитный центр; потом перестроенный город с новыми
    архитектурными формами; и наконец, примерно с 250 по 47 год до н. э., укреплённый город-святилище
    со стенами, башнями и алтарями. В середине I века до н. э. его взяли и сожгли. Учёные спорят между
    Помпеем, Фарнаком II и Митридатом Пергамским.


    Систематические раскопки начал в 1966 году Отар Лордкипанидзе, после 2002 года их продолжила Дареджан
    Качарава. Среди находок:


    - местное золото — диадемы, височные подвески, ожерелья тончайшей зерни


    - привозная греческая керамика и терракотовые статуэтки


    - фрагменты бронзовой скульптуры, в том числе торсы


    - перстень-печатка IV века до н. э. с греческим именем


    Именно это сочетание — местное мастерство и греческие вещи в одном погребении — делает Вани главным
    источником сведений о том, как Колхида общалась со средиземноморским миром.


    Здание музея стоит у подножия холма, древний город — выше, на террасах: участки стен, ворота, основания
    алтарей. Вместе они требуют около двух часов. Учтите, что часть лучших ванских вещей находится в Национальном
    музее в Тбилиси, а не здесь.


    Вопрос о золотом руне всплывает здесь постоянно. Вани — не Айя, город Ээта из мифа, и ни один археолог
    этого не утверждает. Зато золото из здешних погребений показывает именно тот тип богатства, который
    и породил греческие рассказы о колхидском золоте. Ходить по террасам с этой мыслью гораздо интереснее,
    чем искать руно буквально.
  tip: >-
    Два часа: час в музее, час на холме. Тропа наверх крутая, со ступенями, для коляски непроходима; тени
    наверху почти нет. Летом поднимайтесь рано утром или под вечер. После дождя глина скользит. Этикетки
    на грузинском и английском, гида можно заказать заранее. Кафе и туалет есть при музее, магазины —
    в центре городка, в пяти минутах.
  route: >-
    Из Тбилиси по E60 на запад мимо Зестафони и Кутаиси, затем по указателям на Самтредиа и поворот на
    юг к Вани — всего около 255 км, три часа сорок пять минут. Вся дорога асфальтированная и в хорошем
    состоянии; последние двадцать километров — узкая региональная трасса через сёла, где на проезжую часть
    нередко выходит скот. Заправляйтесь в Зестафони или Кутаиси. Перед музеем бесплатная парковка. Машины
    эконом-класса достаточно.
fa:
  name: موزهٔ باستان‌شناسی وانی
  short: بازمانده‌های شهری کلخی بر یک تپه، و موزه‌ای که زرِ سده‌های چهارم تا یکم پیش از میلاد را نگه می‌دارد.
  body: >-
    **وانی جایی است که کلخیس از افسانه بودن دست می‌کشد و باستان‌شناسی می‌شود.** تپهٔ بالای شهرک وانی بیش
    از یک سده کاوش شده و امروز هم‌زمان قرقگاه‌موزه است و کارگاه کاوش فعال.


    سکونت در سدهٔ هشتم پیش از میلاد آغاز شد و چهار مرحله را از سر گذراند: نخست دهکده‌ای کوچک با خانه‌های
    چوبی؛ سپس از سدهٔ ششم تا چهارم پیش از میلاد مرکزی ثروتمند برای نخبگان؛ آنگاه شهری بازساخته با صورت‌های
    تازهٔ معماری؛ و سرانجام میان حدود ۲۵۰ تا ۴۷ پیش از میلاد، شهر‑زیارتگاهی مستحکم با دیوار و برج و محراب.
    در میانهٔ سدهٔ یکم پیش از میلاد گرفته و سوزانده شد؛ پژوهشگران میان پومپیوس، فارناکس دوم و میتریداتِ
    پرگاموم اختلاف دارند.


    کاوش منظم در ۱۹۶۶ به سرپرستی اوتار لوردکیپانیدزه آغاز شد و پس از ۲۰۰۲ دارِژان کاچاراوا آن را ادامه
    داد. از یافته‌ها:


    - زرگری بومی؛ تاج‌ها، آویزهای شقیقه و گردنبندهایی با دانه‌کاری ظریف


    - سفال وارداتی یونانی و پیکرک‌های سفالین


    - پاره‌های تندیس‌های مفرغی، از جمله تنه‌ها


    - انگشتری مهر از سدهٔ چهارم پیش از میلاد با نامی یونانی


    همین ترکیب — هنر بومی و کالای یونانی در یک گور — وانی را به مهم‌ترین منبع شناخت مناسبات کلخیس با جهان
    مدیترانه بدل می‌کند.


    ساختمان موزه پای تپه است و شهر باستانی بالای آن روی تراس‌ها: بخش‌هایی از دیوار، یک دروازه و پی محراب‌ها.
    این دو با هم حدود دو ساعت می‌خواهند. توجه کنید که بخشی از بهترین یافته‌های وانی در موزهٔ ملی تفلیس
    است نه اینجا.


    پرسش پشم زرین اینجا مدام پیش می‌آید. وانی آیا نیست، یعنی شهر آیتس در اسطوره، و هیچ باستان‌شناسی چنین
    ادعایی ندارد. اما زرِ برآمده از این گورها دقیقاً همان گونه ثروتی را نشان می‌دهد که در وهلهٔ نخست داستان‌های
    یونانی دربارهٔ زر کلخی را پدید آورد. قدم زدن روی تراس‌ها با این فکر بسیار پرثمرتر از جست‌وجوی پشمی
    واقعی است.
  tip: >-
    دو ساعت: یکی در موزه و یکی روی تپه. مسیر بالا تند و پله‌دار است و برای ویلچر مناسب نیست؛ بالا سایه
    بسیار کم است. تابستان اول صبح یا آخر روز بروید. پس از باران خاک رس لغزنده می‌شود. برچسب‌ها گرجی و
    انگلیسی‌اند و راهنما را می‌توان از پیش هماهنگ کرد. کافه و سرویس بهداشتی در موزه هست و مغازه‌ها در
    مرکز شهرک، پنج دقیقه آن‌سوتر.
  route: >-
    از تفلیس بزرگراه E60 را به غرب بگیرید و از زستافونی و کوتایسی بگذرید، سپس تابلوهای سامتردیا را دنبال
    کنید و به جنوب و به سوی وانی بپیچید — روی‌هم حدود ۲۵۵ کیلومتر و سه ساعت و چهل‌وپنج دقیقه. کل مسیر
    آسفالت و در وضع خوبی است؛ بیست کیلومتر آخر جاده‌ای منطقه‌ای و باریک از میان روستاهاست که دام‌ها اغلب
    به سواره‌رو می‌آیند. سوخت را در زستافونی یا کوتایسی بگیرید. جلوی موزه پارکینگ رایگان هست. خودروی اقتصادی
    کافی است.
he:
  name: המוזיאון הארכיאולוגי של ואני
  short: שרידי עיר קולכית על גבעה, ומוזיאון שבו זהב מן המאות ה-4 עד ה-1 לפני הספירה.
  body: >-
    **בוואני קולכיס חדלה להיות אגדה והופכת לארכיאולוגיה.** הגבעה מעל העיירה ואני נחפרת יותר ממאה שנה,
    והאתר היום הוא גם שמורת מוזיאון וגם חפירה פעילה.


    היישוב החל במאה ה-8 לפני הספירה ועבר ארבעה שלבים: תחילה כפר קטן של בתי בולי עץ; אחר כך, מן המאה ה-6
    עד ה-4 לפני הספירה, מרכז עשיר של שכבה שלטת; אחר כך עיר בנויה מחדש בצורות אדריכליות חדשות; ולבסוף,
    בין 250 ל-47 לפני הספירה בערך, עיר־מקדש מבוצרת בעלת חומות, מגדלים ומזבחות. באמצע המאה ה-1 לפני הספירה
    נכבשה ונשרפה, והחוקרים חלוקים בין פומפיוס, פרנקס השני ומיתרידטס מפרגמון.


    החפירה השיטתית החלה ב-1966 בהנהגת אוטר לורדקיפנידזה ונמשכה אחרי 2002 בידי דארז'ן קצ'ראווה. בין הממצאים:


    - מלאכת זהב מקומית — נזרים, תליוני רקה ומחרוזות בגרעון עדין


    - כלי חרס יווניים מיובאים ופסלוני טרקוטה


    - שברי פסלי ברונזה, ובהם גופים


    - טבעת חותם מן המאה ה-4 לפני הספירה החרותה בשם יווני


    דווקא הצירוף הזה — אומנות מקומית וסחורה יוונית באותו קבר — הופך את ואני למקור המרכזי להבנת יחסיה של
    קולכיס עם עולם הים התיכון.


    בניין המוזיאון עומד למרגלות הגבעה, והעיר העתיקה מעליו על טרסות: קטעי חומה, שער ויסודות מזבחות. יחד
    הם דורשים כשעתיים. שימו לב שחלק מן הממצאים הטובים ביותר מוואני נמצא במוזיאון הלאומי בטביליסי ולא כאן.


    שאלת גיזת הזהב עולה כאן ללא הרף. ואני אינה איאה, עירו של אייטס במיתוס, ואף ארכיאולוג אינו טוען זאת.
    מה שהזהב מן הקברים האלה כן מראה הוא בדיוק סוג העושר שהוליד מלכתחילה את הסיפורים היווניים על זהב קולכיס.
    ההליכה על הטרסות מתוך המחשבה הזאת מתגמלת הרבה יותר מחיפוש אחר גיזה ממשית.
  tip: >-
    שעתיים: אחת במוזיאון ואחת על הגבעה. השביל למעלה תלול ומדורג ואינו נגיש לכיסא גלגלים; למעלה כמעט אין
    צל. בקיץ עלו מוקדם או לקראת ערב. אחרי גשם החרסית מחליקה. השילוט בגאורגית ובאנגלית, ואפשר לתאם מדריך
    מראש. במוזיאון יש בית קפה ושירותים, וחנויות במרכז העיירה חמש דקות משם.
  route: >-
    מטביליסי בכביש E60 מערבה, ליד זסטפוני וקוטאיסי, ואז לפי השילוט לסמטרדיה ופנייה דרומה לוואני — כ-255
    ק״מ בסך הכול, שלוש שעות וארבעים וחמש דקות. כל המסלול סלול ובמצב טוב; עשרים הקילומטרים האחרונים הם
    כביש אזורי צר דרך כפרים, ובקר יוצא לא פעם אל הכביש. תדלקו בזסטפוני או בקוטאיסי. לפני המוזיאון יש חניה
    חינם. רכב חסכוני מספיק.
ar:
  name: متحف واني الأثري
  short: بقايا مدينة كولخية على تل، ومتحف يحفظ ذهباً صيغ بين القرنين الرابع والأول قبل الميلاد.
  body: >-
    **في واني تكف كولخيس عن كونها أسطورة وتصير علم آثار.** يُحفر التل المطل على بلدة واني منذ أكثر من
    قرن، والموقع اليوم محمية متحفية وورشة تنقيب عاملة في آن.


    بدأ الاستيطان في القرن الثامن قبل الميلاد ومرّ بأربع مراحل: قرية صغيرة من بيوت الجذوع أولاً؛ ثم مركز
    ثري للنخبة بين القرنين السادس والرابع قبل الميلاد؛ ثم مدينة أُعيد بناؤها بأشكال معمارية جديدة؛ وأخيراً،
    بين نحو 250 و47 قبل الميلاد، مدينة‑حرم محصّنة بأسوار وأبراج ومذابح. وفي منتصف القرن الأول قبل الميلاد
    اقتُحمت وأُحرقت، ويختلف الباحثون بين بومبيوس وفرناكيس الثاني وميثريداتس البرغامي.


    بدأ التنقيب المنهجي عام 1966 بإشراف أوتار لوردكيبانيدزه، واستمر بعد 2002 بإشراف داريجان كاتشارافا.
    ومن المكتشفات:


    - صياغة ذهبية محلية: أكاليل وحليّ صدغية وقلائد بتحبيب دقيق


    - فخار يوناني مستورد وتماثيل صغيرة من الطين المشوي


    - شذرات من تماثيل برونزية، منها أجذاع


    - خاتم ختم من القرن الرابع قبل الميلاد محفور باسم يوناني


    وهذا المزيج تحديداً — حرفة محلية وبضاعة يونانية في القبر نفسه — هو ما يجعل واني المصدر الأول لفهم
    علاقة كولخيس بعالم المتوسط.


    يقوم مبنى المتحف عند سفح التل، والمدينة القديمة فوقه على مصاطب: مقاطع من السور وبوابة وأسس مذابح.
    ويحتاجان معاً نحو ساعتين. وانتبه إلى أن بعض أجود مواد واني موجود في المتحف الوطني بتبليسي لا هنا.


    يتكرر سؤال الجزة الذهبية هنا دائماً. واني ليست آيا، مدينة أيتيس في الأسطورة، ولا يزعم أي أثري ذلك.
    لكن الذهب الخارج من هذه القبور يُظهر بالضبط نوع الثراء الذي أنتج أصلاً الحكايات اليونانية عن ذهب كولخيس.
    والتجول على المصاطب بهذه الفكرة أجدى بكثير من البحث عن جزة بالمعنى الحرفي.
  tip: >-
    ساعتان: واحدة في المتحف وأخرى على التل. الدرب صاعد وشديد الانحدار وفيه درجات ولا يصلح لكرسي متحرك،
    والظل في الأعلى شحيح جداً. في الصيف اصعد باكراً أو قرب المساء. وبعد المطر يصير الطين زلقاً. البطاقات
    بالجورجية والإنجليزية، ويمكن ترتيب مرشد مسبقاً. في المتحف مقهى ودورات مياه، والمتاجر في وسط البلدة
    على بعد خمس دقائق.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً مروراً بزستافوني وكوتايسي، ثم اتبع لافتات سامتريديا وانعطف جنوباً
    إلى واني — نحو 255 كم إجمالاً وثلاث ساعات وخمس وأربعين دقيقة. الطريق كله معبّد وبحالة جيدة؛ والعشرون
    كيلومتراً الأخيرة طريق إقليمي ضيق يمر بقرى كثيراً ما تخرج فيها المواشي إلى الطريق. تزوّد بالوقود في
    زستافوني أو كوتايسي. وأمام المتحف موقف مجاني. وتكفي سيارة اقتصادية.
