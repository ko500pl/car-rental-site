ka:
  name: ვანის არქეოლოგიური მუზეუმი
  short: >-
    ძვ. წ. I საუკუნეში გადამწვარი კოლხური ქალაქ-სამლოცველო: გალავანი და საკურთხევლები ბორცვზე, ქვემოთ
    კი მუზეუმი ოქროთი, ბერძნული ჭურჭლითა და ბრინჯაოთი.
  body: >-
    **არავინ იცის, რას უწოდებდნენ ამ ბორცვის მცხოვრებნი თავიანთ ქალაქს — ეს ზემოთ ასვლისას კარგად უნდა
    გახსოვდეთ.**


    ნაქალაქარი ახვლედიანების გორაზეა, თანამედროვე ვანის დასავლეთ განაპირას: ტერასებად დაყოფილ ბორცვს ორი
    მხრიდან ღრმა ხევები იცავს, ქვემოთ კი კოლხეთის დაბლობი იშლება. აქ ძვ. წ. VIII საუკუნიდან ცხოვრობდნენ.
    დაახლოებით ძვ. წ. 600–350 წლებში ვანი მდიდარი ადგილობრივი დიდგვაროვნების ცენტრი იყო: მათ ოქროს დიადემებთან,
    სასაფეთქლეებთან და უწვრილესი ნაკეთობის ყელსაბამებთან ერთად კრძალავდნენ, გვერდით კი ქიოსური, ლესბოსური
    და ატიკური მოხატული ჭურჭელი ედოთ. ძვ. წ. IV საუკუნის საბეჭდავ ბეჭედზე ბერძნული ასოებით სახელი დედატოსი
    იკითხება — სავარაუდოდ, ადგილობრივი მმართველისა.


    დაახლოებით ძვ. წ. 250 წლიდან ბორცვი, ოთარ ლორთქიფანიძის აზრით — რომელიც 1966 წლიდან 2002 წლამდე, სიცოცხლის
    ბოლომდე, აქ გათხრებს ხელმძღვანელობდა, — გალავნიან ქალაქ-სამლოცველოდ იქცა: კოშკებით, მძლავრად გამაგრებული
    კარიბჭით, ტაძრებით, თორმეტსაფეხურიანი საკურთხევლითა და ბრინჯაოს ქანდაკებების ჩამოსასხმელი სახელოსნოთი.
    ძვ. წ. I საუკუნის შუა ხანებში კი ქალაქი დაიწვა. ეჭვმიტანილები პომპეუსი, ფარნაკე II და მითრიდატე პერგამონელი
    არიან; ლორთქიფანიძემ ნგრევის ორი ფენა გამოყო, ერთმანეთისგან რამდენიმე წლით დაშორებული.


    სახელის საკითხი ღიად რჩება. ზოგი მკვლევარი აქ პლინიუს უფროსის მიერ მოხსენიებულ სურიუმს ხედავს — ვანში
    ნაპოვნ ბრინჯაოს წარწერაზე „სურის“ იკითხება; სხვები, მათ შორის ლორთქიფანიძე, სტრაბონის აღწერილ ლევკოთეას
    ტაძარს.


    ნაპოვნი საუნჯე — ოქრო, ჭაბუკის ბრინჯაოს ტორსი, ლომისთავიანი წყალსადინრები — ორ ადგილას ინახება: ბორცვის
    ძირას, ლორთქიფანიძის სახელობის ვანის არქეოლოგიურ მუზეუმში, და თბილისში, საქართველოს ეროვნულ მუზეუმში.
    ვანი ოქროს საწმისის აია არ არის და ამას არც ერთი არქეოლოგი არ ამტკიცებს. მაგრამ დამწვარ საძირკვლებს
    შორის დადექით, ის ოქრო გაიხსენეთ და მიხვდებით, საიდან გაუჩნდათ ბერძნებს ეს ამბავი.
  tip: >-
    ორი საათი გამოყავით: ერთი მუზეუმისთვის, ერთი ბორცვისთვის. ნაქალაქარამდე ასასვლელი ბილიკი ციცაბო და
    საფეხურებიანია, ეტლისთვის გამოუსადეგარი, ზემოთ კი ჩრდილი თითქმის არ არის, ამიტომ ზაფხულში დილით ადრე
    ან საღამოს ადით. წვიმის შემდეგ თიხა სრიალა ხდება. ეტიკეტები ქართულად და ინგლისურადაა, გიდის აყვანა
    წინასწარ შეიძლება. ბილეთი დაახლოებით 7 ლარი ღირს. ტუალეტი მუზეუმშია, საჭმელად კი ქალაქის ცენტრში,
    რამდენიმე წუთის სავალზე ჩადით. ჯერ მუზეუმი ნახეთ, მერე — ბორცვი, და არა პირიქით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის უღელტეხილისა და ზესტაფონის გავლით. ქუთაისამდე
    ცოტა ადრე სამხრეთით, ბაღდათის მიმართულებით გადაუხვიეთ, ვარციხის გავლით შ13-ზე გადით, რომელიც დასავლეთით,
    ვანისკენ მიდის. სულ დაახლოებით 255 კმ-ია და სამი საათი და ორმოცდახუთი წუთი, მთლიანად ასფალტზე; ბოლო
    ოცი კილომეტრი ვიწრო სოფლის გზებია, სადაც ძროხები ხშირად გამოდიან სავალ ნაწილზე. საწვავი ზესტაფონში
    ან ქუთაისში ჩაასხით. მუზეუმის წინ უფასო პარკინგია, ნაქალაქარამდე კი იქიდან ფეხით ადიხართ. ეკონომ კლასის
    მანქანა საკმარისია.
en:
  name: Vani Archaeological Museum
  short: >-
    A Colchian city-sanctuary burned in the 1st century BC: hilltop walls and altars above a museum of
    gold diadems, Greek pottery and bronze.
  body: >-
    **Nobody knows what the people of this hill called their city, and that is worth remembering as you
    climb it.**


    The ruins crown Akhvlediani Gora, a terraced hill on the western edge of modern Vani, guarded on two
    sides by deep ravines and looking out over the plain of Colchis. People lived here from the 8th century
    BC. Between about 600 and 350 BC it was the seat of a wealthy local elite, buried with gold diadems,
    temple pendants and necklaces of extraordinary fineness, and with painted pottery from Chios, Lesbos
    and Athens beside them. A 4th-century BC signet ring spells out, in Greek letters, the name Dedatos,
    probably a local ruler.


    From about 250 BC the hill became what Otar Lordkipanidze, who led the excavations from 1966 until
    his death in 2002, read as a walled city-sanctuary, with towers, a heavily defended gate, temples,
    a twelve-stepped altar and a workshop for casting bronze statues. Then, in the middle of the 1st century
    BC, it burned. Pompey, Pharnaces II and Mithridates of Pergamon are all suspects; Lordkipanidze identified
    two destruction layers a few years apart.


    The name remains open. Some scholars see here the Surium of Pliny the Elder, and a bronze inscription
    from the site reads 'Souris'; others, Lordkipanidze among them, place here the temple of Leucothea
    described by Strabo.


    The finds, from the gold to a bronze torso of a youth and lion-head waterspouts, are divided between
    the museum at the foot of the hill, which bears Lordkipanidze's name, and the National Museum in Tbilisi.
    Vani is not Aia of the Golden Fleece, and no archaeologist claims it is. Stand among the burnt foundations
    with that gold in mind, though, and you understand where the Greeks found the story.
  tip: >-
    Give it two hours, one in the museum and one on the hill. The path up to the ruins is steep and stepped,
    unsuited to wheelchairs, and there is almost no shade at the top, so in summer climb early or late.
    After rain the clay turns slick. Labels are in Georgian and English, and a guide can be arranged in
    advance. Tickets are around 7 lari. Toilets are at the museum; for food, head to the town centre a
    few minutes away. See the museum first and the hill second, not the other way round.
  route: >-
    From Tbilisi take the S1 (E60) west over the Rikoti Pass and past Zestaponi. Shortly before Kutaisi
    turn south towards Baghdati, cut across via Vartsikhe and join the Sh13, which runs west into Vani.
    In all it is about 255 km and three hours forty-five, paved throughout; the last twenty kilometres
    are narrow roads through villages where cows often wander onto the tarmac. Refuel in Zestaponi or
    Kutaisi. There is free parking in front of the museum, and the ruins are a climb on foot from there.
    An economy car is enough.
ru:
  name: Ванский археологический музей
  short: >-
    Колхидский город-святилище, сожжённый в I веке до н. э.: стены и алтари на вершине холма, а под ним
    — музей золотых диадем, греческой керамики и бронзы.
  body: >-
    **Никто не знает, как жители этого холма называли свой город, и об этом стоит помнить, пока вы поднимаетесь
    по нему.**


    Руины венчают Ахвледиани-Гору, террасированный холм на западной окраине современного Вани, защищённый
    с двух сторон глубокими оврагами и глядящий на равнину Колхиды. Люди жили здесь с VIII века до н.
    э. Примерно между 600 и 350 годами до н. э. здесь жила богатая местная знать — её хоронили с золотыми
    диадемами, височными подвесками и ожерельями исключительно тонкой работы, а рядом укладывали расписную
    керамику с Хиоса, Лесбоса и из Афин. Перстень-печатка IV века до н. э. называет греческими буквами
    имя Дедатос — вероятно, местного правителя.


    Примерно с 250 года до н. э. холм, по мнению Отара Лордкипанидзе, руководившего раскопками с 1966
    года до своей смерти в 2002-м, стал обнесённым стенами городом-святилищем: с башнями, мощно укреплёнными
    воротами, храмами, двенадцатиступенчатым алтарём и мастерской для литья бронзовых статуй. А в середине
    I века до н. э. город сгорел. Среди подозреваемых — Помпей, Фарнак II и Митридат Пергамский; Лордкипанидзе
    выделил два слоя разрушения, разделённых несколькими годами.


    Вопрос имени остаётся открытым. Одни учёные видят здесь Сурий, упомянутый Плинием Старшим, — на найденной
    бронзовой надписи читается «Сурис»; другие, включая Лордкипанидзе, помещают здесь храм Левкотеи, описанный
    Страбоном.


    Находки — от золота до бронзового торса юноши и водостоков в виде львиных голов — разделены между
    музеем у подножия холма, носящим имя Лордкипанидзе, и Национальным музеем в Тбилиси. Вани — не Эя
    из мифа о золотом руне, и ни один археолог этого не утверждает. Но встаньте среди обгоревших фундаментов,
    вспомнив это золото, и вы поймёте, откуда греки взяли эту историю.
  tip: >-
    Отведите два часа: один — на музей, один — на холм. Тропа к руинам крутая и со ступенями, для инвалидных
    колясок не подходит, а наверху почти нет тени, так что летом поднимайтесь рано утром или к вечеру.
    После дождя глина становится скользкой. Подписи на грузинском и английском, гида можно заказать заранее.
    Билет стоит около 7 лари. Туалет в музее, поесть — в центре города, в нескольких минутах ходьбы. Сначала
    музей, потом холм — не наоборот.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Рикотский перевал и Зестафони. Немного не доезжая Кутаиси
    поверните на юг в сторону Багдади, проезжайте через Варцихе и выйдите на трассу Ш13, которая идёт
    на запад в Вани. Всего около 255 км и три часа сорок пять минут, всё асфальтировано; последние двадцать
    километров — узкие сельские дороги, где на асфальт часто выходят коровы. Заправляйтесь в Зестафони
    или Кутаиси. Перед музеем бесплатная парковка, а к руинам оттуда поднимаются пешком. Машины эконом-класса
    достаточно.
fa:
  name: موزهٔ باستان‌شناسی وانی
  short: >-
    شهر-پرستشگاهی کولخیدی که در سدهٔ یکم پیش از میلاد سوخت: دیوارها و قربانگاه‌هایی بر فراز تپه، و در
    زیر آن، موزه‌ای از تاج‌های زرین، سفال یونانی و برنز.
  body: >-
    **هیچ‌کس نمی‌داند مردمان این تپه شهر خود را چه می‌نامیدند، و همین را باید در ذهن داشت وقتی از آن بالا
    می‌روید.**


    ویرانه‌ها بر ستیغ تپهٔ آخولدیانی نشسته‌اند، تپه‌ای پلکانی در حاشیهٔ غربی وانی امروزی که از دو سو دره‌های
    ژرف آن را نگه می‌دارد و به دشت کلخیس چشم دوخته است. مردم از سدهٔ هشتم پیش از میلاد در این‌جا می‌زیستند.
    میان سال‌های ۶۰۰ تا ۳۵۰ پیش از میلاد، این‌جا جایگاه اشرافی محلی و ثروتمند بود؛ کسانی که با تاج‌های
    زرین، آویزهای شقیقه و گردن‌بندهایی به ظرافتی بی‌مانند به خاک سپرده می‌شدند، و در کنارشان سفال‌های
    نگارین از خیوس، لسبوس و آتن نهاده می‌شد. حلقه‌ای مهرداری از سدهٔ چهارم پیش از میلاد، به خط یونانی
    نام «دداتوس» را بر خود دارد، احتمالاً نام فرمانروایی محلی.


    از حدود سال ۲۵۰ پیش از میلاد، به تعبیر اوتار لوردکیپانیدزه، که از سال ۱۹۶۶ تا زمان مرگش در ۲۰۰۲ کاوش‌ها
    را سرپرستی می‌کرد، این تپه به شهر-پرستشگاهی دیوارکشیده بدل شد: با برج‌ها، دروازه‌ای بسیار مستحکم،
    پرستشگاه‌ها، قربانگاهی دوازده‌پله‌ای، و کارگاهی برای ریخته‌گری پیکره‌های برنزی. سپس، در میانهٔ سدهٔ
    یکم پیش از میلاد، شهر در آتش سوخت. پومپیوس، فارناکس دوم و میتریدات پرگامی همه در فهرست مشکوکان‌اند؛
    لوردکیپانیدزه دو لایهٔ ویرانی را، با چند سال فاصله از هم، شناسایی کرد.


    نام این شهر همچنان ناشناخته می‌ماند. برخی پژوهشگران در این‌جا «سوریوم» را می‌بینند، شهری که پلینیوس
    بزرگ از آن یاد کرده است - بر کتیبه‌ای برنزی یافته‌شده در محل، واژهٔ «سوریس» خوانده می‌شود؛ دیگران،
    از جمله لوردکیپانیدزه، معبد لئوکوتئا را که استرابون توصیف کرده، در همین‌جا می‌جویند.


    یافته‌ها - از زر گرفته تا تندیس نیم‌تنِ برنزیِ جوانی و ناودان‌هایی به شکل سر شیر - میان دو جا تقسیم
    شده‌اند: موزهٔ دامنهٔ تپه که نام لوردکیپانیدزه را بر خود دارد، و موزهٔ ملی در تفلیس. وانی همان آیای
    افسانهٔ پشم زرین نیست، و هیچ باستان‌شناسی چنین ادعایی ندارد. اما در میان این پایه‌های سوخته بایستید،
    آن زر را به یاد آورید، و خواهید فهمید یونانیان این داستان را از کجا گرفته‌اند.
  tip: >-
    دو ساعت در نظر بگیرید: یکی برای موزه، یکی برای تپه. مسیر صعود به ویرانه‌ها پرشیب و پلکانی است و برای
    ویلچر مناسب نیست، و در بالا تقریباً هیچ سایه‌ای نیست، پس در تابستان صبح زود یا نزدیک غروب بالا بروید.
    پس از باران، خاک رس لیز می‌شود. برچسب‌ها به گرجی و انگلیسی است، و می‌توان از پیش راهنما رزرو کرد.
    بلیت حدود ۷ لاری است. سرویس بهداشتی در موزه است؛ برای غذا، به مرکز شهر بروید که چند دقیقه فاصله دارد.
    اول موزه را ببینید و بعد تپه را، نه برعکس.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب، از گذرگاه ریکوتی و از کنار زستافونی بگذرید. کمی پیش از کوتایسی
    به سوی جنوب، به سمت باغداتی بپیچید، از وارتسیخه بگذرید و به راه Sh13 برسید که به سوی غرب، به وانی
    می‌رود. در کل نزدیک به ۲۵۵ کیلومتر و سه ساعت و چهل‌وپنج دقیقه راه است، سراسر آسفالت؛ بیست کیلومتر
    آخر راه‌های روستایی باریکی است و گاوها اغلب به میان جاده می‌آیند. در زستافونی یا کوتایسی سوخت‌گیری
    کنید. جلوی موزه پارکینگ رایگان است، و از آن‌جا تا ویرانه‌ها پیاده به بالا می‌روید. یک خودروی اقتصادی
    کافی است.
he:
  name: מוזיאון וני לארכיאולוגיה
  short: >-
    עיר-מקדש קולכית שנשרפה במאה הראשונה לפני הספירה: חומות ומזבחות על ראש הגבעה, ולמרגלותיה מוזיאון של
    כתרי זהב, קרמיקה יוונית וברונזה.
  body: >-
    **איש לא יודע איך קראו יושבי הגבעה הזאת לעיר שלהם, וטוב לזכור זאת בזמן העלייה אליה.**


    החורבות מכתרות את גבעת אחוולדיאני-גורה, גבעה מדורגת בקצה המערבי של וני המודרנית, מוגנת משני צדדים
    בערוצים עמוקים ומשקיפה על מישור קולכיס. אנשים חיו כאן מהמאה השמינית לפני הספירה. בין השנים 600 ל-350
    לפני הספירה לערך היה זה מקום מושבה של אצולה מקומית עשירה, שנקברה עם כתרי זהב, תליוני רקה וענקים בעבודת
    דיוק יוצאת דופן, ולידם כלי חרס צבועים מכיוס, לסבוס ואתונה. חותם-טבעת מהמאה הרביעית לפני הספירה נושא
    באותיות יווניות את השם דדאטוס, כנראה שליט מקומי.


    מסביבות שנת 250 לפני הספירה הפכה הגבעה – לפי פרשנותו של אוטר לורדקיפנידזה, שניהל את החפירות מ-1966
    עד מותו ב-2002 – לעיר-מקדש מוקפת חומה, עם מגדלים, שער מבוצר היטב, מקדשים, מזבח בעל שתים-עשרה מדרגות
    ובית-מלאכה ליציקת פסלי ברונזה. ואז, באמצע המאה הראשונה לפני הספירה, נשרפה העיר. פומפיוס, פרנקס השני
    ומיתרידטס מפרגמון - כולם חשודים; לורדקיפנידזה זיהה שתי שכבות הרס במרחק של כמה שנים זו מזו.


    שאלת השם נותרת פתוחה. חלק מהחוקרים מזהים כאן את סוריום שהזכיר פליניוס הזקן - כתובת ברונזה שנמצאה באתר
    נושאת את המילה "סוריס"; אחרים, ובהם לורדקיפנידזה, מציבים כאן את מקדש לאוקותיאה שתיאר סטראבון.


    הממצאים - מהזהב ועד פלג-גוף עליון מברונזה של נער וצינורות מים בצורת ראש אריה - מתחלקים בין המוזיאון
    למרגלות הגבעה, הנושא את שם לורדקיפנידזה, לבין המוזיאון הלאומי בטביליסי. וני אינה איה של אגדת גיזת
    הזהב, ואף ארכיאולוג לא טוען כך. אך עמדו בין היסודות השרופים עם הזהב הזה בראש, ותבינו מאין קיבלו היוונים
    את הסיפור.
  tip: >-
    הקדישו שעתיים: שעה למוזיאון, שעה לגבעה. השביל אל החורבות תלול ומדורג, לא מתאים לכיסאות גלגלים, ולמעלה
    כמעט אין צל, כך שבקיץ כדאי לעלות מוקדם בבוקר או לפנות ערב. אחרי גשם החרסית הופכת חלקלקה. השילוט בגאורגית
    ובאנגלית, ואפשר להזמין מדריך מראש. הכרטיס עולה כ-7 לארי. השירותים במוזיאון, ולאוכל פנו למרכז העיר
    במרחק דקות. קודם המוזיאון ואחר כך הגבעה, לא להפך.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, דרך מעבר ריקותי ודרך זסטפוני. קצת לפני קוטאיסי פנו דרומה לכיוון
    בגדאטי, עברו דרך וארציחה והתחברו לדרך Sh13, הפונה מערבה לוני. בסך הכול כ-255 ק"מ ושלוש שעות וארבעים
    וחמש דקות, כולו כביש סלול; עשרים הקילומטרים האחרונים הם דרכי כפר צרות שבהן פרות משוטטות לרוב על הכביש.
    תדלקו בזסטפוני או בקוטאיסי. לפני המוזיאון יש חניה חינם, ואל החורבות הולכים משם ברגל בעלייה. רכב חסכוני
    מספיק.
ar:
  name: متحف فاني للآثار
  short: >-
    مدينة-معبد كولخيدية أُحرقت في القرن الأول قبل الميلاد: أسوار ومذابح على قمة التلة، وتحتها متحف من
    التيجان الذهبية والفخار اليوناني والبرونز.
  body: >-
    **لا يعرف أحد كيف كان أهل هذه التلة يسمّون مدينتهم، وهذا ما يستحق أن يُتذكَّر أثناء صعودها.**


    تتوّج الأنقاض تلة أخفلدياني-غورا، تلة مدرّجة على الحافة الغربية لبلدة فاني الحديثة، تحميها من جانبين
    واديان عميقان وتنظر إلى سهل كولخيس. عاش الناس هنا منذ القرن الثامن قبل الميلاد. وبين نحو عامي 600
    و350 قبل الميلاد، كانت مقرّاً لنخبة محلية ثرية، دُفن أهلها بتيجان ذهبية وحُليّ صدغية وعقود بدقة صنع
    نادرة، وبجانبهم فخار مرسوم من خيوس وليسبوس وأثينا. خاتم ختم من القرن الرابع قبل الميلاد يحمل بحروف
    يونانية اسم "ديداتوس"، وهو على الأرجح حاكم محلي.


    ومنذ نحو 250 قبل الميلاد صارت التلة، بحسب تفسير أوتار لوردكيبانيدزه الذي قاد الحفريات من 1966 حتى
    وفاته عام 2002، مدينة-معبد مسوّرة، فيها أبراج وبوابة محصّنة بقوة ومعابد ومذبح ذو اثنتي عشرة درجة وورشة
    لصبّ التماثيل البرونزية. ثم في وسط القرن الأول قبل الميلاد احترقت المدينة. من المشتبه بهم بومبيوس
    وفارناكيس الثاني وميثريدات البرغامي؛ وقد ميّز لوردكيبانيدزه طبقتين من الدمار تفصل بينهما سنوات قليلة.


    وتبقى مسألة الاسم مفتوحة. يرى بعض العلماء هنا مدينة "سوريوم" التي ذكرها بليني الأكبر، إذ يُقرأ على
    نقش برونزي من الموقع اسم "سوريس"؛ ويضع آخرون، ومنهم لوردكيبانيدزه نفسه، هنا معبد ليوكوثيا الذي وصفه
    سترابون.


    تتوزّع القطع المكتشفة - من الذهب إلى جذع تمثال برونزي لفتى ومزاريب بشكل رأس أسد - بين المتحف عند سفح
    التلة، الحامل اسم لوردكيبانيدزه، والمتحف الوطني في تبليسي. فاني ليست "آيا" أرض الجزّة الذهبية، ولا
    يزعم أي آثاري ذلك. لكن قف بين الأساسات المحروقة وذلك الذهب في ذهنك، وستفهم من أين استمدّ اليونانيون
    هذه القصة.
  tip: >-
    خصص ساعتين: ساعة للمتحف وساعة للتلة. المسار الصاعد إلى الأنقاض شديد الانحدار ومُدرَّج، لا يصلح للكراسي
    المتحركة، ولا يوجد ظل تقريباً في القمة، فاصعد في الصباح الباكر أو قرب المساء في الصيف. يصبح الطين
    زلقاً بعد المطر. اللوحات باللغتين الجورجية والإنجليزية، ويمكن حجز مرشد مسبقاً. سعر التذكرة نحو 7 لاري.
    المراحيض في المتحف، وللطعام توجّه إلى وسط البلدة على بعد دقائق. زر المتحف أولاً ثم التلة، لا العكس.
  route: >-
    من تبليسي خذ الطريق السريع S1 (E60) غرباً، عبر ممر ريكوتي وعبر زستافوني. قبل كوتايسي بقليل، انحرف
    جنوباً نحو باغداتي، ومرّ عبر فارتسيخه للوصول إلى طريق Sh13 المتجه غرباً إلى فاني. الإجمالي نحو 255
    كم وثلاث ساعات وخمس وأربعون دقيقة، معبّد بالكامل؛ آخر عشرين كيلومتراً طرق قروية ضيقة تخرج فيها الأبقار
    كثيراً إلى الإسفلت. عبّئ الوقود في زستافوني أو كوتايسي. أمام المتحف موقف سيارات مجاني، ومن هناك تصعد
    إلى الأنقاض سيراً. سيارة اقتصادية تكفي.
