ka:
  name: არმაზციხე-ბაგინეთი
  short: >-
    წარმართული ქართლის ციხე-ქალაქი მტკვრის მარჯვენა ნაპირზე, მცხეთის პირისპირ: სასახლის საძირკვლები, ანტიკური
    აბანო და თითქმის არავინ.
  body: >-
    **მცხეთაში ჯერ ტაძარი არ იდგა, როცა ქართლის მეფეები მდინარის გაღმა, მთის თავზე ისხდნენ და თავიანთ
    ციხეს ღმერთის სახელი დაარქვეს.**


    არმაზციხე მტკვრის მარჯვენა ნაპირზე, ბაგინეთის მთაზე დგას, იქ, სადაც მტკვარს არაგვი ერთვის; გაღმა სვეტიცხოვლის
    გუმბათის ყელი მოჩანს, უფრო მაღლა კი — ჯვრის მონასტრის ქედი. ქართული მატიანეები ციხის დაარსებას ფარნავაზ
    I-ს მიაწერენ (ძვ. წ. III საუკუნე), სახელი კი არმაზს, წარმართული ქართლის უზენაეს ღვთაებას, უკავშირდება.
    ბერძენი და რომაელი ავტორები მას ჰარმოზიკედ იცნობდნენ.


    რომი აქ ორჯერ მოვიდა. ძვ. წ. 65 წელს ციხე პომპეუსის ლაშქარმა აიღო — მტკვარზე გადებულ დანგრეულ ხიდს
    დღესაც „პომპეუსის ხიდს“ ეძახიან. 1867 წელს ნაპოვნი სტელის ცნობით კი ახ. წ. 75 წელს იმპერატორმა ვესპასიანემ
    ქალაქი მეფე მითრიდატე I-ისთვის გაამაგრა. აქაურ პიტიახშებს, მეფის მოადგილეებს, ახლომახლო არმაზისხევში
    კრძალავდნენ; მათი სამარხებიდან ამოღებულ გემებზე ორი მათგანია, ასპარუხი და ზევახი, გამოსახული — საქართველოში
    შექმნილი ერთ-ერთი უძველესი პორტრეტები. იმავე სამაროვანმა 1940 წლის 25 ნოემბერს არმაზის ბილინგვაც გაგვიმხილა
    — ახალგაზრდად გარდაცვლილი დიდგვაროვანი ქალის, სერაფიტას, ბერძნულ-არამეული ეპიტაფია.


    სისტემური გათხრები მხოლოდ 1943 წელს დაიწყო ანდრია აფაქიძის ხელმძღვანელობით და 1985 წელს განახლდა.
    გამოვლენილის უმეტესობა მუხლამდე თუ აღწევს:


    - თლილი ქვის საძირკვლები, რომლებსაც ოდესღაც ალიზის კედლები ეყრდნობოდა, და ექვსსვეტიანი დარბაზის ფუძე

    - აბანო, ღია და დახურული წყალსადენები

    - სამეფო აკლდამისა და პატარა მავზოლეუმის ნაშთები


    736 წელს არაბმა სარდალმა მარვან იბნ მუჰამადმა, ქართულ მატიანეებში მურვან ყრუდ ცნობილმა, ქალაქი მიწასთან
    გაასწორა და იგი აღარასოდეს აღდგა. ოქრო და გემები მუზეუმებში წავიდა; მთაზე დარჩა დედაქალაქის გეგმა
    და ნათელი ხედი იმ ქალაქზე, რომელმაც მისი ადგილი დაიკავა.
  tip: >-
    ერთი საათი საკმარისია, თუ ნანგრევები განსაკუთრებით არ გიყვართ. ეს ღია ცის ქვეშ არსებული არქეოლოგიური
    ძეგლია, დიდი მცხეთის მუზეუმ-ნაკრძალის ნაწილი; ჩრდილი თითქმის არ არის, არც წყალი, კაფე ან ტუალეტი —
    ზაფხულში წყალი და ქუდი წაიღეთ, საჭმელად კი მცხეთაში ჩადით. თხრილებს შორის ბილიკები მიწისაა და წვიმის
    შემდეგ სრიალებს; კედლების თავზე ნუ გაივლით. წარწერები ცოტაა, ამიტომ ისტორია წინასწარ წაიკითხეთ, ვიზიტს
    კი თბილისის ეროვნული მუზეუმიც დაუწყვილეთ, სადაც აქ ნაპოვნი განძის დიდი ნაწილი ინახება. სვეტიცხოვლის
    ხედისთვის საუკეთესოა გვიანი ნაშუადღევის შუქი.
  route: >-
    თბილისიდან ჩრდილო-დასავლეთით S1 (E60) ავტომაგისტრალით წადით და დაახლოებით 19 კმ-ში მცხეთის გასასვლელზე
    გადაუხვიეთ. მტკვრის მარჯვენა ნაპირზე უკვე ხართ: ძველ გზას ქალაქის ხიდისკენ გაჰყევით და დაახლოებით
    2 კმ-ში, მდინარის გადაკვეთამდე, მკვეთრად მარცხნივ, ბაგინეთის მთაზე ამავალ ვიწრო გზაზე შეუხვიეთ. ბოლო
    700 მეტრი ვიწრო და ადგილ-ადგილ დაკემსილია, ნანგრევების ქვემოთ კი უსწორმასწორო მოედნით მთავრდება, რომელიც
    ზამთარში ტალახდება. სულ დაახლოებით 22 კმ და 35 წუთია. მშრალ ამინდში ეკონომ-კლასის მანქანაც ადვილად
    ამოვა; გზის ბოლოს გააჩერეთ და ხუთი წუთი ფეხით აუყევით. საწვავი S1-ზე ჩაასხით.
en:
  name: Armaztsikhe-Bagineti
  short: >-
    The hilltop citadel of pagan Iberia, facing Mtskheta across the Mtkvari: palace footings, a Roman-age
    bath house and, most days, nobody else.
  body: >-
    **Long before Mtskheta had a cathedral, the kings of Kartli ruled from the hill across the river —
    and named their citadel after a god.**


    Armaztsikhe, "the fortress of Armazi", crowns Mount Bagineti on the right bank of the Mtkvari, at
    its meeting with the Aragvi; across the water rise the drum of Svetitskhoveli and, higher, the ridge
    of Jvari. The medieval chronicles credit its founding to King Pharnavaz I in the 3rd century BC and
    name it after Armazi, chief deity of the pagan Iberians. Greek and Roman writers knew it as Harmozica.


    Rome came twice. Pompey's army took the fortress in 65 BC, and a ruined crossing over the Mtkvari
    is still called Pompey's Bridge. In AD 75, a stele found in 1867 records, Emperor Vespasian fortified
    the city for King Mithridates I. The viceroys who governed here, the pitiakhshes, were buried in the
    nearby ravine of Armaziskhevi; engraved gems from their graves show two of them, Asparukh and Zevakh,
    in some of the earliest portraits made in Georgia. The same cemetery yielded the Armazi bilingual,
    found on 25 November 1940: a Greek and Aramaic epitaph for Serapita, a noblewoman who died young.


    Systematic digging began only in 1943, under Andria Apakidze, and resumed in 1985. Most of what it
    exposed stands at knee height:


    - stone footings that once carried walls of mud brick, and the base of a six-columned hall

    - a bath house and open and covered water channels

    - the remains of a royal tomb and a small mausoleum


    In 736 the Arab commander Marwan ibn Muhammad razed the city, and it never rose again. Its gold and
    gems went to museums; what stays on the hill is the plan of a capital, and a clear view of the town
    that replaced it.
  tip: >-
    An hour is enough unless ruins are your passion. This is an open-air archaeological site, part of
    the Greater Mtskheta museum-reserve, with almost no shade and no water, café or toilet, so bring a
    bottle and a hat in summer and eat in Mtskheta. The paths between the trenches are bare earth and
    slippery after rain; do not walk along the wall tops. Signage is thin, so read up before you come,
    and pair the visit with the National Museum in Tbilisi, which holds much of the treasure found here.
    Late-afternoon light is kindest to the view across to Svetitskhoveli.
  route: >-
    Take the S1 motorway (E60) north-west out of Tbilisi and leave it at the Mtskheta exit, about 19 km
    out. You are already on the right bank of the Mtkvari: follow the old road towards the town bridge
    and, roughly 2 km on and before you cross the river, turn sharp left onto the lane that climbs Bagineti
    hill. Its last 700 metres are narrow and patched, ending at a rough turning area below the ruins that
    holds mud in winter. That is about 22 km and 35 minutes in all. An economy car copes in dry weather;
    park at the end and walk up for five minutes. Fuel up on the S1.
ru:
  name: Армазцихе-Багинети
  short: >-
    Цитадель языческой Иберии на холме напротив Мцхеты, за Мтквари: фундаменты дворца, баня римской эпохи
    и чаще всего — ни души вокруг.
  body: >-
    **Задолго до того, как в Мцхете появился собор, цари Картли правили с холма на другом берегу реки
    — и назвали свою цитадель именем бога.**


    Армазцихе, «крепость Армази», венчает гору Багинети на правом берегу Мтквари, у её слияния с Арагви;
    за водой встают барабан Светицховели и, выше, гребень Джвари. Средневековые летописи приписывают основание
    крепости царю Фарнавазу I в III веке до н. э. и связывают её имя с Армази, верховным божеством иберов-язычников.
    Греческие и римские авторы знали её как Гармозику.


    Рим приходил сюда дважды. Войско Помпея взяло крепость в 65 году до н. э., и развалины переправы через
    Мтквари до сих пор зовут Помпеевым мостом. В 75 году н. э., как гласит стела, найденная в 1867 году,
    император Веспасиан укрепил город для царя Митридата I. Наместников, правивших здесь, — питиахшей
    — хоронили в соседнем ущелье Армазисхеви; резные геммы из их гробниц донесли облик двоих из них, Аспаруха
    и Зеваха, — это одни из самых ранних портретов, созданных в Грузии. Тот же некрополь подарил Армазскую
    билингву, найденную 25 ноября 1940 года: греко-арамейскую эпитафию Серафите, знатной женщине, умершей
    молодой.


    Систематические раскопки начались лишь в 1943 году под руководством Андриа Апакидзе и возобновились
    в 1985-м. Почти всё, что они открыли, поднимается над землёй не выше колена:


    - каменные цоколи, на которых когда-то стояли стены из сырцового кирпича, и основание шестиколонного
    зала

    - баня, открытые и крытые водоводы

    - остатки царской гробницы и небольшой мавзолей


    В 736 году арабский полководец Марван ибн Мухаммад сровнял город с землёй, и больше он так и не возродился.
    Его золото и геммы ушли в музеи; на холме остался план столицы — и ясный вид на город, пришедший ей
    на смену.
  tip: >-
    Часа хватит, если руины не ваша страсть. Это археологический памятник под открытым небом, часть музея-заповедника
    «Большая Мцхета»: тени почти нет, воды, кафе и туалета нет вовсе, так что летом берите бутылку воды
    и шляпу, а обедать поезжайте в Мцхету. Тропинки между раскопами — голая земля, после дождя скользкая;
    по гребням стен не ходите. Табличек мало, поэтому почитайте о месте заранее и дополните поездку Национальным
    музеем в Тбилиси, где хранится большая часть найденных здесь сокровищ. Вид на Светицховели на том
    берегу лучше всего в мягком предвечернем свете.
  route: >-
    Выезжайте из Тбилиси на северо-запад по автомагистрали S1 (E60) и сверните на съезде к Мцхете, примерно
    через 19 км. Вы уже на правом берегу Мтквари: держитесь старой дороги к городскому мосту и примерно
    через 2 км, ещё не переезжая реку, круто поверните налево на узкую дорогу, взбирающуюся на холм Багинети.
    Последние 700 метров — узкие, в заплатах, и упираются в неровную площадку для разворота под руинами,
    где зимой стоит грязь. Всего около 22 км и 35 минут. В сухую погоду справится машина эконом-класса;
    оставьте её в конце дороги и поднимитесь пешком — минут пять. Заправьтесь на S1.
fa:
  name: آرمازتسیخه-باگینتی
  short: >-
    ارگ ایبریای بت‌پرست بر تپه‌ای روبه‌روی متسختا، آن سوی متکواری: پی‌های کاخ، گرمابه‌ای از روزگار رومیان
    و، بیشتر روزها، هیچ‌کس جز شما.
  body: >-
    **مدت‌ها پیش از آنکه متسختا کلیسای جامعی داشته باشد، شاهان کارتلی از تپهٔ آن سوی رود فرمان می‌راندند
    — و ارگ خود را به نام یک خدا خواندند.**


    آرمازتسیخه، یعنی «دژ آرمازی»، بر ستیغ کوه باگینتی نشسته است، بر کرانهٔ راست رود متکواری (کورا) و درست
    جایی که آراگوی به آن می‌پیوندد؛ آن سوی آب، گریو گنبد سوتیتسخولی و بالاتر از آن، یال جواری سر برمی‌آورند.
    وقایع‌نامه‌های سده‌های میانه بنیاد آن را به شاه فرناواز یکم در سدهٔ سوم پیش از میلاد نسبت می‌دهند
    و نامش را از آرمازی، خدای بزرگ ایبری‌های بت‌پرست، می‌دانند. نویسندگان یونانی و رومی آن را هارموزیکا
    می‌شناختند.


    روم دو بار به اینجا آمد. سپاه پومپه در سال ۶۵ پیش از میلاد دژ را گرفت و ویرانهٔ گذرگاهی بر متکواری
    هنوز «پل پومپه» خوانده می‌شود. در سال ۷۵ میلادی، به گواهی سنگ‌نبشته‌ای که در ۱۸۶۷ پیدا شد، امپراتور
    وسپاسیان شهر را برای شاه میتریدات یکم استوار کرد. نایب‌السلطنه‌هایی که اینجا فرمان می‌راندند، یعنی
    پیتیاخش‌ها، در درهٔ نزدیکِ آرمازیسخوی به خاک سپرده شدند؛ نگین‌های کنده‌کاری‌شدهٔ گورهایشان چهرهٔ دو
    تن از آنان، آسپاروخ و زواخ، را نگه داشته‌اند که از نخستین چهره‌نگاری‌های ساخته‌شده در گرجستان است.
    همان گورستان «دوزبانهٔ آرمازی» را نیز به دست داد که در ۲۵ نوامبر ۱۹۴۰ یافته شد: گورنوشته‌ای به یونانی
    و آرامی برای سراپیتا، بانوی نجیب‌زاده‌ای که جوان درگذشت.


    کاوش منظم تنها در ۱۹۴۳ به سرپرستی آندریا آپاکیدزه آغاز شد و در ۱۹۸۵ از سر گرفته شد. بیشتر آنچه از
    خاک بیرون آمد، بلندتر از زانو نیست:


    - پی‌های سنگی که روزگاری دیوارهای خشت خام را بر دوش داشتند، و پایهٔ تالاری شش‌ستونی

    - گرمابه، و آبراهه‌های روباز و سرپوشیده

    - بقایای آرامگاهی شاهی و مقبره‌ای کوچک


    در سال ۷۳۶ سردار عرب، مروان بن محمد، شهر را با خاک یکسان کرد و شهر دیگر هرگز سر برنیاورد. زر و نگین‌هایش
    به موزه‌ها رفت؛ آنچه بر تپه مانده، نقشهٔ یک پایتخت است و چشم‌اندازی روشن به شهری که جایش را گرفت.
  tip: >-
    یک ساعت بس است، مگر آنکه دلباختهٔ ویرانه‌ها باشید. اینجا محوطه‌ای باستان‌شناختی در فضای باز و بخشی
    از مجموعهٔ موزه‌ای-حفاظتی «متسختای بزرگ» است، تقریباً بی‌سایه و بی‌آب، بدون کافه و سرویس بهداشتی؛
    پس در تابستان بطری آب و کلاه بیاورید و ناهار را در متسختا بخورید. راه‌های میان گمانه‌ها خاک برهنه
    است و پس از باران لغزنده؛ روی تاج دیوارها راه نروید. تابلوهای راهنما اندک‌اند، پس پیش از آمدن درباره‌اش
    بخوانید و دیدار را با موزهٔ ملی تفلیس همراه کنید که بخش بزرگی از گنجینه‌های یافته‌شده در اینجا را
    نگه می‌دارد. نور اواخر بعدازظهر با منظرهٔ سوتیتسخولی در آن سوی رود از همه مهربان‌تر است.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی شمال‌غرب بگیرید و در خروجی متسختا، حدود ۱۹ کیلومتر دورتر، از آن
    بیرون بروید. اکنون بر کرانهٔ راست متکواری هستید: جادهٔ قدیم را به سوی پل شهر دنبال کنید و تقریباً
    ۲ کیلومتر جلوتر، پیش از گذشتن از رود، تند به چپ بپیچید، به راه باریکی که از تپهٔ باگینتی بالا می‌رود.
    ۷۰۰ متر پایانی آن باریک و وصله‌پینه است و به فضای دوربرگردان ناهمواری زیر ویرانه‌ها می‌رسد که زمستان‌ها
    گِل می‌گیرد. روی‌هم حدود ۲۲ کیلومتر و ۳۵ دقیقه راه است. خودروی اقتصادی در هوای خشک از پسش برمی‌آید؛
    در انتهای راه پارک کنید و پنج دقیقه پیاده بالا بروید. باک را کنار S1 پر کنید.
he:
  name: ארמאזציחה-בגינטי
  short: >-
    מצודת איבריה האלילית על גבעה מול מצחתה, מעבר לנהר המטקוורי: יסודות ארמון, בית מרחץ מימי רומא, וברוב
    הימים — אף אחד מלבדכם.
  body: >-
    **הרבה לפני שקמה במצחתה קתדרלה, מלכי קרתלי משלו מן הגבעה שמעבר לנהר — וקראו למצודתם על שם אל.**


    ארמאזציחה, "מבצר ארמאזי", מכתירה את הר בגינטי שעל הגדה הימנית של המטקוורי, במקום שבו האראגווי נשפך
    אליו; מעבר למים מתנשאים תוף הכיפה של סבטיצחובלי, וגבוה יותר רכס ג'ווארי. הכרוניקות מימי הביניים מייחסות
    את ייסודה למלך פרנוואז הראשון במאה ה-3 לפנה"ס, ואומרות שנקראה על שם ארמאזי, האל הראשי של האיברים עובדי
    האלילים. סופרים יוונים ורומאים הכירו אותה בשם הרמוזיקה.


    רומא הגיעה לכאן פעמיים. צבאו של פומפיוס כבש את המבצר ב-65 לפנה"ס, ושרידי מעבר הרוס על המטקוורי נקראים
    עד היום "גשר פומפיוס". ב-75 לספירה, כך מתעדת מצבת אבן שנמצאה ב-1867, ביצר הקיסר אספסיאנוס את העיר
    למען המלך מיתרידטס הראשון. המושלים ששלטו כאן מטעם המלך, הפיטיאחשים, נקברו בערוץ הסמוך ארמאזיסחבי;
    אבני חן חרוטות מקבריהם מציגות שניים מהם, אספרוח וזוואח, באחדים מן הדיוקנאות הקדומים ביותר שנוצרו בגאורגיה.
    מאותו בית קברות הגיעה גם הכתובת הדו-לשונית מארמאזי, שנמצאה ב-25 בנובמבר 1940: כתובת קבר ביוונית ובארמית
    לסרפיטה, אישה בת אצולה שמתה צעירה.


    החפירות השיטתיות החלו רק ב-1943, בהנהגת אנדריה אפקידזה, וחודשו ב-1985. רוב מה שנחשף בהן אינו מתנשא
    מעל גובה הברך:


    - יסודות אבן שנשאו פעם קירות של לבני בוץ, ובסיס של אולם בן שישה עמודים

    - בית מרחץ, ותעלות מים פתוחות ומקורות

    - שרידי קבר מלכותי ומאוזוליאום קטן


    ב-736 החריב המצביא הערבי מרואן אבן מוחמד את העיר עד היסוד, והיא לא קמה עוד. הזהב ואבני החן שלה עברו
    למוזיאונים; מה שנשאר על הגבעה הוא תוכניתה של בירה, ומבט צלול אל העיר שבאה במקומה.
  tip: >-
    שעה מספיקה, אלא אם חורבות הן התשוקה שלכם. זהו אתר ארכאולוגי פתוח, חלק ממוזיאון-השמורה "מצחתה רבתי",
    כמעט בלי צל, בלי מים, בלי בית קפה ובלי שירותים — לכן בקיץ הביאו בקבוק מים וכובע, ואכלו במצחתה. השבילים
    בין בורות החפירה הם עפר חשוף שנעשה חלקלק אחרי גשם; אל תלכו על ראשי החומות. השילוט דל, אז קראו על המקום
    לפני שתגיעו, ושלבו את הביקור עם המוזיאון הלאומי בטביליסי, שבו שמורים רוב האוצרות שנמצאו כאן. אור אחר
    הצהריים המאוחרים מחמיא במיוחד לנוף אל סבטיצחובלי שבגדה ממול.
  route: >-
    צאו מטביליסי צפון-מערבה בכביש המהיר S1 (E60) וירדו ממנו במחלף מצחתה, כ-19 ק"מ מהעיר. אתם כבר על הגדה
    הימנית של המטקוורי: המשיכו בכביש הישן לכיוון הגשר של העיירה, וכ-2 ק"מ הלאה, לפני שאתם חוצים את הנהר,
    פנו בחדות שמאלה אל הדרך הצרה שמטפסת על גבעת בגינטי. 700 המטרים האחרונים צרים ומטולאים, ומסתיימים ברחבת
    סיבוב משובשת מתחת לחורבות, שבחורף עומד בה בוץ. בסך הכול כ-22 ק"מ ו-35 דקות נסיעה. רכב מקטגוריית אקונומי
    יסתדר במזג אוויר יבש; חנו בקצה הדרך ועלו ברגל חמש דקות. תדלקו על ה-S1.
ar:
  name: أرمازتسيخه-باغينيتي
  short: >-
    قلعة إيبيريا الوثنية على تلٍّ يواجه متسخيتا عبر نهر متكفاري: أساسات قصر، وحمّام من العصر الروماني،
    ولا أحد سواك في معظم الأيام.
  body: >-
    **قبل أن تعرف متسخيتا كاتدرائيتها بزمن طويل، حكم ملوك كارتلي من التلّ القائم على الضفة الأخرى من النهر،
    وسمّوا قلعتهم باسم إله.**


    تتوّج أرمازتسيخه، أي «قلعة أرمازي»، جبلَ باغينيتي على الضفة اليمنى لنهر متكفاري (الكُرّ)، عند ملتقاه
    بنهر أراغفي؛ وعلى الجانب الآخر من الماء ترتفع رقبة قبة سفيتيتسخوفيلي، ثم أعلى منها سلسلة جفاري. تنسب
    الحوليات الوسيطة تأسيسها إلى الملك فارناواز الأول في القرن الثالث قبل الميلاد، وتقول إنها سُمّيت باسم
    أرمازي، كبير آلهة الإيبيريين الوثنيين. وعرفها الكتّاب الإغريق والرومان باسم هارموزيكا.


    جاءت روما إلى هنا مرتين. استولى جيش بومبي على القلعة عام 65 قبل الميلاد، وما زالت بقايا معبرٍ مهدّم
    على نهر متكفاري تُدعى «جسر بومبي». وفي عام 75 للميلاد، كما تسجّل شاهدةٌ حجرية عُثر عليها عام 1867،
    حصّن الإمبراطور فسبازيان المدينة للملك ميثريداتس الأول. أما نوّاب الملك الذين حكموا هنا، البيتياخشات،
    فقد دُفنوا في وادي أرمازيسخيفي القريب؛ وتُظهر فصوصٌ محفورة من قبورهم اثنين منهم، أسباروخ وزيفاخ، في
    صورٍ تُعدّ من أقدم ما صُنع من صور شخصية في جورجيا. ومن المقبرة نفسها خرج نقش أرمازي الثنائي اللغة،
    الذي اكتُشف في 25 نوفمبر 1940: شاهد قبر باليونانية والآرامية لسيرابيتا، سيدة نبيلة ماتت شابة.


    لم تبدأ الحفريات المنهجية إلا عام 1943 بإشراف أندريا أباكيدزه، ثم استؤنفت عام 1985. ومعظم ما كشفته
    لا يعلو عن مستوى الركبة:


    - أساسات حجرية كانت تحمل يوماً جدراناً من الطوب اللبن، وقاعدة قاعة ذات ستة أعمدة

    - حمّام، وقنوات مياه مكشوفة ومسقوفة

    - بقايا مدفن ملكي وضريح صغير


    وفي عام 736 دمّر القائد العربي مروان بن محمد المدينة تدميراً، فلم تقم لها قائمة بعد ذلك. ذهب ذهبها
    وفصوصها إلى المتاحف؛ وما يبقى على التل هو مخطط عاصمة، وإطلالة صافية على المدينة التي حلّت محلّها.
  tip: >-
    تكفي ساعة ما لم تكن الأطلال شغفك. هذا موقع أثري مكشوف، وهو جزء من المحمية المتحفية «متسخيتا الكبرى»،
    يكاد يخلو من الظل، ولا ماء فيه ولا مقهى ولا دورات مياه؛ فاحمل في الصيف قارورة ماء وقبعة، وتناول طعامك
    في متسخيتا. الممرات بين خنادق التنقيب تراب عارٍ يصير زلقاً بعد المطر، ولا تمشِ على قمم الجدران. اللوحات
    الإرشادية شحيحة، فاقرأ عن المكان قبل مجيئك، واجمع الزيارة مع المتحف الوطني في تبليسي الذي يحفظ معظم
    الكنوز المكتشفة هنا. وضوء آخر العصر هو ألطف ما يكون على المشهد المطلّ على سفيتيتسخوفيلي في الضفة المقابلة.
  route: >-
    اسلك الطريق السريع S1 (E60) باتجاه الشمال الغربي من تبليسي، واخرج منه عند مخرج متسخيتا بعد نحو 19
    كم. أنت الآن على الضفة اليمنى لنهر متكفاري: تابع الطريق القديم باتجاه جسر البلدة، وبعد نحو 2 كم، وقبل
    أن تعبر النهر، انعطف يساراً انعطافة حادة إلى الدرب الضيق الذي يصعد تل باغينيتي. آخر 700 متر منه ضيقة
    ومرقّعة، وتنتهي بساحة استدارة وعرة أسفل الأطلال تتجمع فيها الأوحال شتاءً. المجموع نحو 22 كم و35 دقيقة.
    تكفي سيارة اقتصادية في الطقس الجاف؛ اركنها في نهاية الطريق واصعد سيراً خمس دقائق. املأ خزان الوقود
    على طريق S1.
