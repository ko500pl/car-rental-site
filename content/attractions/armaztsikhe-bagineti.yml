ka:
  name: არმაზციხე-ბაგინეთი
  short: ქართლის ანტიკური დედაქალაქის გათხრილი აკროპოლისი მტკვრისა და არაგვის შესართავის თავზე, ტერასაზე.
  body: >-
    **სანამ მცხეთა ქრისტიანული ქალაქი გახდებოდა, ის წარმართული იყო — არმაზციხე კი მისი ციხე-სიმაგრე.**
    ნანგრევები მტკვრის მარჯვენა ნაპირზე, ტერასაზე დგას, ზუსტად არაგვის შესართავის მოპირდაპირედ, თავზე
    კი, ჰორიზონტზე, ჯვრის მონასტერი ჩანს. აქ თითქმის არავინ ადის — ეს ერთდროულად ხიბლიცაა და პრობლემაც:
    არც წასაკითხი აბრებია, არც სალარო და არც ჩრდილი.


    ქალაქს სახელი არმაზმა, ქრისტიანობამდელი ქართლის მთავარმა კერპმა, მისცა; ის იბერიის მეფეთა რეზიდენცია
    იყო დაახლოებით ძვ. წ. III საუკუნიდან. მას სტრაბონი და მოგვიანებით რომაელი ავტორები იცნობდნენ. ძვ.
    წ. 65 წელს ხეობაში პომპეუსის ლაშქარი ამოვიდა; ქალაქი აღდგა, ახ. წ. I-III საუკუნეებში რომაული გავლენის
    ქვეშ აყვავდა და საბოლოოდ 730-იან წლებში არაბმა სარდალმა მურვან ყრუმ დაანგრია.


    სისტემატური გათხრები 1937 წელს, ანდრია აფაქიძის ხელმძღვანელობით დაიწყო და ათწლეულები გაგრძელდა. დღეს,
    ძირითადად მუხლის სიმაღლეზე, შემდეგს ნახავ:


    - ექვსსვეტიანი სამიღებო დარბაზის საძირკველი, სვეტების ქვის ბაზისები კვლავ ერთ ხაზზეა


    - რომაული ტიპის აბანო, იატაკქვეშა გათბობის აგურის სვეტები ადგილზეა


    - მარანი, იატაკში ჩადგმული ქვევრების ყელებით


    - დიდი თლილი ქვით ნაგები გალავნის მონაკვეთები და საფეხურებიანი წყალსაცავი


    გვერდით, არმაზისხევის ხრამში, არქეოლოგებმა პიტიახშების — მეფეთა მოადგილეების — სამარხები აღმოაჩინეს.
    იქიდან ამოღებული რომაული ვერცხლი, გემები და ოქრო ეროვნული მუზეუმის საუკეთესო ექსპონატებშია, ხოლო ცნობილი
    არმაზის ბილინგვა, ბერძნულად და ადგილობრივი არამეული დამწერლობით შესრულებული, იმავე გათხრებზე, 1940
    წელს გამოჩნდა. აქ ამ ყველაფრიდან არაფერია. მოდი ადგილისა და ქალაქის გეგმისთვის, არა ნივთებისთვის.
  tip: >-
    ერთი საათი გამოყავი, მეტიც თუ ნანგრევების კითხვა გიყვარს. ეს ღია ტერიტორიაა — არც კარიბჭეა, არც დაცვა,
    არც წყალი და არც ტუალეტი; ბოთლი წყალი და ქუდი თან წაიღე, ივლისში ტერასა იწვება. ჩაიცვი კარგმოჭიდებიანი
    ფეხსაცმელი: თხრილებს შორის ბილიკები მიწისაა და წვიმის შემდეგ სრიალებს, ზოგი კედლის თავიც არამდგრადია.
    ძეგლის გეგმა ტელეფონში წინასწარ ჩამოტვირთე, სანამ კავშირი გაქვს. ბევრად აზრიანია ეს ადგილი თბილისის
    ეროვნულ მუზეუმთან ერთად ნახო, სადაც აქ ნაპოვნი ნივთები დევს.
  route: >-
    თბილისიდან E60-ით ჩრდილოეთით წახვალ და მცხეთასთან გადახვალ მტკვრის მარჯვენა ნაპირზე, არმაზის სოფლისკენ
    მიმავალ პატარა გზაზე — სულ დაახლოებით 30 კმ და 45 წუთი. ბოლო კილომეტრი ვიწრო, ჩანაკერებიანი გზაა და
    ტერასის ქვემოთ უსწორმასწორო შემობრუნების მოედანზე მთავრდება; ზამთარში აქ ტალახია. მშრალ ამინდში ეკონომ-კლასის
    მანქანა უპრობლემოდ ადის. დააპარკინგე გზის ბოლოს და ხუთი წუთი ფეხით აუყევი. ბოლო მონაკვეთზე არც საწვავია
    და არც მაღაზია — ჩაასხი მცხეთაში ან თბილისში.
en:
  name: Armaztsikhe-Bagineti
  short: >-
    The excavated acropolis of Iberia's ancient capital, on a terrace above the meeting of the Mtkvari
    and the Aragvi.
  body: >-
    **Before Mtskheta was a Christian city it was a pagan one, and Armaztsikhe was its citadel.** The
    ruins lie on a terrace on the right bank of the Mtkvari, directly opposite the mouth of the Aragvi,
    with Jvari monastery on the skyline above. Almost nobody comes, which is both the charm of the place
    and its problem: no signs worth reading, no ticket office, no shade.


    The city took its name from Armazi, the chief idol of pre-Christian Kartli, and was the seat of the
    kings of Iberia from roughly the 3rd century BC. Strabo and later Roman writers knew of it. Pompey's
    army came up the valley in 65 BC; the city was rebuilt, flourished under Roman influence in the 1st
    to 3rd centuries AD, and was finally wrecked by the Arab commander Marwan ibn Muhammad in the 730s.


    Systematic excavation began in 1937 under Andria Apakidze and continued for decades. What you can
    walk over today, most of it at knee height:


    - the foundations of a six-columned audience hall, the stone bases still in line


    - a Roman-style bath house with the brick pillars of its underfloor heating intact


    - a wine cellar with the mouths of buried qvevri set into the floor


    - stretches of city wall in large dressed blocks, and a stepped water cistern


    In the side ravine of Armaziskhevi, a short distance away, archaeologists found the graves of the
    pitiakhshi, the viceroys who governed on behalf of the kings. The Roman silver, engraved gems and
    gold taken from them are among the finest objects in the National Museum in Tbilisi, and the famous
    bilingual Armazi stele, inscribed in Greek and in the local Aramaic script, came out of the same dig
    in 1940. None of that is here. Come for the site and the plan of the city, not for objects.
  tip: >-
    Allow an hour, longer if you enjoy reading ruins. The site is open ground: no gate, no guard, no water
    and no toilet, so bring a bottle and a hat — the terrace bakes in July. Wear shoes with grip; the
    paths between the trenches are bare earth and turn slippery after rain, and the tops of some walls
    are unstable. Load the site plan onto your phone while you still have signal. Seeing this together
    with the National Museum in Tbilisi, where the finds actually are, makes far more sense than seeing
    it alone.
  route: >-
    From Tbilisi take the E60 north and leave the highway at Mtskheta, cross to the right bank of the
    Mtkvari and follow the small road towards Armazi village — about 30 km and 45 minutes in all. The
    last kilometre is a narrow, patched lane ending in a rough turning area below the terrace, which holds
    mud in winter. In dry weather an economy car manages without trouble. Park at the end of the lane
    and walk up for about five minutes. There is no fuel or shop on the final stretch, so fill up in Mtskheta
    or Tbilisi.
ru:
  name: Армазцихе-Багинети
  short: Раскопанный акрополь древней столицы Иберии на террасе над слиянием Куры и Арагви.
  body: >-
    **Пока Мцхета не стала христианским городом, она была языческим, и Армазцихе служил его цитаделью.**
    Руины лежат на террасе правого берега Куры, прямо напротив устья Арагви, а на гребне над ними виден
    монастырь Джвари. Сюда почти никто не поднимается — в этом и обаяние места, и его беда: ни внятных
    табличек, ни кассы, ни тени.


    Город назван по имени Армази, главного идола дохристианской Картли, и примерно с III века до н. э.
    служил резиденцией царей Иберии. О нём знали Страбон и позднейшие римские авторы. В 65 году до н.
    э. по ущелью поднялось войско Помпея; город отстроили заново, в I-III веках н. э. он расцвёл под римским
    влиянием, а окончательно его разрушил арабский полководец Мерван ибн Мухаммад в 730-х годах.


    Систематические раскопки начались в 1937 году под руководством Андрии Апакидзе и продолжались десятилетиями.
    Сегодня по большей части на уровне колена видно следующее:


    - фундамент шестиколонного приёмного зала, каменные базы колонн по-прежнему стоят в линию


    - баня римского типа с уцелевшими кирпичными столбиками подпольного отопления


    - марани с горлышками вкопанных в пол квеври


    - участки крепостной стены из крупных тёсаных блоков и ступенчатый водосборник


    Рядом, в овраге Армазисхеви, археологи нашли погребения питиахшей — наместников, правивших от имени
    царей. Римское серебро, резные геммы и золото оттуда — среди лучших вещей Национального музея в Тбилиси,
    а знаменитая армазская билингва, надпись по-гречески и местным арамейским письмом, вышла из тех же
    раскопок в 1940 году. Здесь из этого нет ничего. Сюда едут ради места и плана города, а не ради предметов.
  tip: >-
    Часа достаточно, больше — если любите разбирать руины. Территория открытая: ни ворот, ни охраны, ни
    воды, ни туалета, так что берите бутылку и головной убор — в июле терраса раскаляется. Нужна обувь
    с хорошим протектором: тропинки между раскопами земляные и скользят после дождя, а верх некоторых
    стен непрочен. План памятника лучше загрузить в телефон, пока есть связь. Осматривать это место разумнее
    вместе с Национальным музеем в Тбилиси, где и хранятся здешние находки.
  route: >-
    Из Тбилиси по трассе E60 на север, у Мцхеты перейти на правый берег Куры и свернуть на маленькую дорогу
    к селу Армази — всего около 30 км и 45 минут. Последний километр — узкий латаный проезд, заканчивающийся
    неровной площадкой под террасой; зимой здесь стоит грязь. В сухую погоду проезжает и машина эконом-класса.
    Оставьте её в конце дороги и поднимитесь пешком минут за пять. На последнем участке нет ни заправок,
    ни магазинов — заправляйтесь в Мцхете или Тбилиси.
fa:
  name: آرمازتسیخه-باگینتی
  short: کهن‌دژ کاوش‌شدهٔ پایتخت باستانی ایبری، بر مصطبه‌ای بالای محل پیوستن آراگوی به مت‌کواری.
  body: >-
    **پیش از آنکه متسختا شهری مسیحی شود، شهری بت‌پرست بود و آرمازتسیخه دژ آن به شمار می‌رفت.** ویرانه‌ها
    بر مصطبه‌ای در کرانهٔ راست مت‌کواری و درست روبه‌روی دهانهٔ آراگوی قرار دارد و بر خط آسمان بالای آن
    صومعهٔ جواری دیده می‌شود. تقریباً کسی به اینجا نمی‌آید؛ همین هم جذابیت جاست و هم مشکل آن: نه تابلوی
    درخور خواندنی هست، نه باجهٔ بلیت و نه سایه.


    نام شهر از آرمازی گرفته شده، بت بزرگ کارتلی پیش از مسیحیت، و از حدود سدهٔ سوم پیش از میلاد مقر شاهان
    ایبری بود. استرابون و نویسندگان رومی متأخرتر از آن خبر داشتند. در 65 پیش از میلاد سپاه پومپیوس از
    این دره بالا آمد؛ شهر بازساخته شد، در سده‌های یکم تا سوم میلادی زیر نفوذ روم رونق گرفت و سرانجام در
    دههٔ 730 به دست مروان بن محمد، سردار عرب، ویران شد.


    کاوش منظم در 1937 به سرپرستی آندریا آپاکیدزه آغاز شد و دهه‌ها ادامه یافت. آنچه امروز می‌توان میان
    آن قدم زد، بیشترش تا بلندای زانو:


    - پی تالار بار با شش ستون، که پایه‌های سنگی ستون‌ها هنوز در یک خط ایستاده‌اند


    - گرمابه‌ای به شیوهٔ رومی، با ستون‌های آجری گرمایش زیر کف که سالم مانده‌اند


    - سردابی برای شراب، با دهانهٔ خم‌های گلی کارگذاشته در کف


    - بخش‌هایی از دیوار شهر از سنگ‌های بزرگ تراشیده، و آب‌انباری پلکانی


    در درهٔ کناری آرمازیسخوی، اندکی آن‌سوتر، باستان‌شناسان گورهای پیتیاخش‌ها را یافتند، یعنی نایبانی که
    از سوی شاهان فرمان می‌راندند. نقره و نگین‌های کنده‌کاری‌شده و زر رومی برآمده از آن گورها از بهترین
    اشیای موزهٔ ملی تفلیس است، و سنگ‌نوشتهٔ دوزبانهٔ آرمازی، به یونانی و به خط آرامی محلی، در 1940 از
    همان کاوش بیرون آمد. هیچ‌یک از اینها اینجا نیست. برای خود محوطه و نقشهٔ شهر بیایید، نه برای اشیا.
  tip: >-
    یک ساعت وقت بگذارید و بیشتر اگر خواندن ویرانه‌ها را دوست دارید. محوطه باز است: نه دروازه‌ای هست، نه
    نگهبانی، نه آبی و نه سرویس بهداشتی؛ پس بطری آب و کلاه همراه ببرید، چون مصطبه در تابستان داغ می‌شود.
    کفش با کف چنگ‌زن بپوشید؛ باریکه‌راه‌های میان گودال‌ها خاکی است و پس از باران لیز می‌شود و سر برخی
    دیوارها سست است. نقشهٔ محوطه را تا وقتی آنتن دارید روی گوشی بیاورید. دیدن اینجا در کنار موزهٔ ملی
    تفلیس، که یافته‌ها آنجاست، بسیار معنادارتر از دیدن تنهای آن است.
  route: >-
    از تفلیس به شمال روی E60 بروید و نزدیک متسختا از بزرگراه خارج شوید، به کرانهٔ راست مت‌کواری بگذرید
    و جادهٔ کوچک به سوی روستای آرمازی را دنبال کنید — رویهم حدود 30 کیلومتر و 45 دقیقه. کیلومتر آخر کوچه‌ای
    باریک و وصله‌خورده است که به میدانچه‌ای ناهموار زیر مصطبه ختم می‌شود و در زمستان گِل در آن می‌ماند.
    در هوای خشک خودروی اقتصادی از پس آن برمی‌آید. ماشین را همان‌جا بگذارید و پنج دقیقه پیاده بالا بروید.
    در این بخش پایانی نه پمپ بنزین هست و نه مغازه، پس در متسختا یا تفلیس سوخت بگیرید.
he:
  name: ארמאזציחה-באגינטי
  short: האקרופוליס החפור של בירת איבריה העתיקה, על מדרגת קרקע מעל מפגש המטקוורי והאראגווי.
  body: >-
    **לפני שמצחתה הייתה עיר נוצרית היא הייתה עיר אלילית, וארמאזציחה שימשה מצודתה.** החורבות שוכנות על
    מדרגת קרקע בגדה הימנית של המטקוורי, ממש מול שפך האראגווי, וכשמעליהן בקו הרקיע מנזר ג׳ווארי. כמעט איש
    אינו מגיע לכאן, וזה גם הקסם וגם הבעיה: אין שילוט ראוי לקריאה, אין קופה ואין צל.


    שם העיר בא מארמאזי, האליל הראשי של קרתלי הקדם-נוצרית, והיא שימשה מושב מלכי איבריה מן המאה השלישית
    לפני הספירה בערך. סטראבון וסופרים רומיים מאוחרים ידעו עליה. בשנת 65 לפני הספירה עלה בעמק צבאו של פומפיוס;
    העיר נבנתה מחדש, פרחה תחת השפעה רומית במאות הראשונה עד השלישית לספירה, ולבסוף נהרסה בידי המצביא הערבי
    מרואן בן מוחמד בשנות ה-730.


    חפירות שיטתיות החלו ב-1937 בהנהלת אנדריה אפאקידזה ונמשכו עשרות שנים. מה שאפשר לעבור בין שרידיו היום,
    רובו בגובה הברך:


    - יסודות אולם קבלה בעל שישה עמודים, ובסיסי האבן שלהם עדיין עומדים בשורה


    - בית מרחץ בסגנון רומי ובו עמודי הלבנים של החימום התת-רצפתי שלמים


    - מרתף יין ובו פיות כדי החרס הקבורים ברצפה


    - קטעי חומת עיר מאבני גזית גדולות ובור מים מדורג


    בערוץ הצדדי ארמאזיסחווי, מרחק קצר משם, מצאו הארכיאולוגים את קברי הפיטיאחשים, המשנים ששלטו בשם המלכים.
    הכסף הרומי, אבני החן המפותחות והזהב שנמצאו בהם הם מן החפצים המשובחים במוזיאון הלאומי בטביליסי, ומצבת
    ארמאזי הדו-לשונית המפורסמת, ביוונית ובכתב הארמי המקומי, יצאה מאותה חפירה ב-1940. דבר מכל זה אינו נמצא
    כאן. בואו בשביל האתר ותוכנית העיר, לא בשביל החפצים.
  tip: >-
    שעה מספיקה, ויותר אם אתם אוהבים לפענח חורבות. השטח פתוח: אין שער, אין שומר, אין מים ואין שירותים,
    לכן קחו בקבוק וכובע — המדרגה נצלית ביולי. נעלו נעליים עם אחיזה טובה; השבילים בין החפירות עשויים עפר
    ומחליקים אחרי גשם, וראש חלק מהקירות אינו יציב. הורידו את תוכנית האתר לטלפון כל עוד יש קליטה. הגיוני
    הרבה יותר לשלב את הביקור עם המוזיאון הלאומי בטביליסי, שם נמצאים הממצאים עצמם.
  route: >-
    מטביליסי צפונה בכביש E60, ליד מצחתה יורדים מן הכביש המהיר, עוברים לגדה הימנית של המטקוורי ופונים לדרך
    הקטנה לכפר ארמאזי — בסך הכול כ-30 ק״מ וכ-45 דקות. הקילומטר האחרון הוא נתיב צר ומטולא המסתיים במגרש
    עפר לא ישר מתחת למדרגה, ובחורף נעשה שם בוץ. במזג אוויר יבש גם רכב חסכוני עובר. החנו בסוף הדרך ועלו
    ברגל כחמש דקות. בקטע האחרון אין תחנות דלק ואין חנויות, אז תדלקו במצחתה או בטביליסי.
ar:
  name: أرمازتسيخي-باغينيتي
  short: أكروبوليس عاصمة إيبيريا القديمة المكشوف بالحفائر، على مصطبة تعلو ملتقى نهري متكفاري وأراغفي.
  body: >-
    **قبل أن تصير متسخيتا مدينة مسيحية كانت مدينة وثنية، وكانت أرمازتسيخي قلعتها.** تقع الأطلال على مصطبة
    في الضفة اليمنى لنهر متكفاري، تجاه مصب أراغفي تماماً، ويعلوها في الأفق دير جواري. لا يكاد أحد يصعد
    إلى هنا، وفي ذلك جاذبية المكان ومشكلته معاً: لا لوحات تستحق القراءة، ولا شباك تذاكر، ولا ظل.


    أخذت المدينة اسمها من أرمازي، كبير أصنام كارتلي قبل المسيحية، وكانت مقراً لملوك إيبيريا منذ القرن
    الثالث قبل الميلاد تقريباً. عرفها سترابون ومن جاء بعده من كتّاب الرومان. وفي عام 65 قبل الميلاد صعد
    جيش بومبيوس في الوادي؛ ثم أعيد بناء المدينة وازدهرت تحت النفوذ الروماني بين القرنين الأول والثالث
    الميلاديين، إلى أن دمرها القائد العربي مروان بن محمد في ثلاثينيات القرن الثامن.


    بدأ التنقيب المنهجي عام 1937 بإشراف أندريا أباكيدزه واستمر عقوداً. وما يمكن أن تمشي بين أطلاله اليوم،
    وأكثره في ارتفاع الركبة:


    - أساسات قاعة استقبال بستة أعمدة، ما تزال قواعدها الحجرية في صف واحد


    - حمام على الطراز الروماني بقيت أعمدته الآجرية الخاصة بالتدفئة تحت الأرض سليمة


    - قبو خمر تظهر في أرضه أفواه جرار الكفيفري المدفونة


    - أجزاء من سور المدينة بكتل حجرية كبيرة منحوتة، وصهريج ماء مدرّج


    وفي وادي أرمازيسخيفي الجانبي، على مسافة قصيرة، عثر الأثريون على قبور البيتياخشيين، أي النواب الذين
    حكموا باسم الملوك. والفضة الرومانية والأحجار المنقوشة والذهب المستخرج منها من أجود مقتنيات المتحف
    الوطني في تبليسي، كما خرجت من الحفائر نفسها عام 1940 لوحة أرمازي الشهيرة ثنائية اللغة، باليونانية
    وبالخط الآرامي المحلي. لا شيء من ذلك هنا. تعال من أجل الموقع وتخطيط المدينة، لا من أجل القطع.
  tip: >-
    ساعة تكفي، وأكثر إن كنت تحب قراءة الأطلال. الموقع أرض مفتوحة: لا بوابة ولا حارس ولا ماء ولا دورة مياه،
    فاحمل قارورة وقبعة، فالمصطبة تلتهب في تموز. والبس حذاءً جيد القبضة؛ فالممرات بين الحفر ترابية وتصير
    زلقة بعد المطر، وأعالي بعض الجدران غير ثابتة. حمّل مخطط الموقع على هاتفك ما دامت التغطية متاحة. وزيارة
    المكان مع المتحف الوطني في تبليسي، حيث المكتشفات فعلاً، أجدى بكثير من زيارته وحده.
  route: >-
    من تبليسي شمالاً على الطريق E60، وعند متسخيتا اترك الطريق السريع واعبر إلى الضفة اليمنى لنهر متكفاري
    ثم اتبع الطريق الصغير نحو قرية أرمازي — نحو 30 كم و45 دقيقة إجمالاً. الكيلومتر الأخير ممر ضيق مرقّع
    ينتهي بساحة ترابية غير مستوية أسفل المصطبة، وفي الشتاء يتجمع فيها الطين. وفي الجو الجاف تمر سيارة
    اقتصادية دون عناء. اترك السيارة في نهاية الممر واصعد خمس دقائق سيراً. لا وقود ولا متاجر في هذا القسم
    الأخير، فتزود في متسخيتا أو تبليسي.
