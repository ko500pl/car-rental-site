ka:
  name: ანბანის კოშკი და სასწაულების პარკი
  short: 130-მეტრიანი ორმაგი სპირალი ქართული ანბანის ასოებით და ბათუმის საუკეთესო ქანდაკება მის ძირში.
  body: >-
    **ანბანის კოშკი ბათუმის ყველაზე პირდაპირი არქიტექტურაა.** ორი ფოლადის ღერო 130 მეტრზე ორმაგ სპირალად
    ადის, მათზე კი ალუმინის ქართული ანბანის ოცდაცამეტი ასოა ჩამაგრებული — ძირიდან ზემოთ, სფერომდე. კოშკი
    2012 წელს დასრულდა, იმ სამშენებლო ტალღის ნაწილად, რომელმაც ქალაქს სილუეტი ერთ ათწლეულში შეუცვალა.

    ჩანაფიქრი — დნმ-ის სპირალი, რომელიც ანბანს გენეტიკურ კოდად ატარებს — ტექსტში მძიმედ ჟღერს, ცოცხლად
    კი უკეთესად გამოიყურება. საღამოს დაბალი მზე ასოებს იჭერს და მთელი ღერო სპილენძისფერი ხდება; ღამით
    კოშკი განათებულია და ასოები კილომეტრიდან იკითხება.

    კოშკი სასწაულების პარკში დგას, ახალი ბულვარის ჩრდილოეთ ბოლოში, და სწორედ პარკია აქ მოსვლის მიზეზი,
    და არა მარტო კოშკი:

    - **ალი და ნინო** — თამარ კვესიტაძის რვამეტრიანი მოძრავი ქანდაკება: ორი ფიგურა ათიოდე წუთში ერთმანეთს
    უახლოვდება, ერწყმის და გაივლის ერთმანეთში; სანაპიროს საუკეთესო ნამუშევარი

    - **ჭაჭის კოშკი** — 2012 წლის 25-მეტრიანი საათის კოშკი შადრევნებით, რომლებსაც ჭაჭა უნდა ედინათ; არ
    დინდებიან

    - **ბათუმის შუქურა** — თუჯის, 1863 წლიდან მუშა, სანაპიროს უძველესი ნაგებობა

    - მიმოხილვის ბორბალი და პორტის ტალღმტეხი, სადაც საღამოს მეთევზეები დგანან

    კოშკის სახედავ სართულსა და რესტორნის სფეროზე წვდომა წლების განმავლობაში ხან იხსნებოდა, ხან იხურებოდა
    — ამიტომ ასვლა გეგმა კი არა, ბონუსი იყოს. მთავარი ხედი მაინც ძირიდანაა: ერთ მხარეს ზღვა, მეორეზე აჭარის
    ქედები ქალაქის უკან, შუაში კი ბათუმის უცნაური, დაუმთავრებელი კოლაჟი კოშკებისა.
  tip: >-
    ნახევარი საათიდან საათამდე საკმარისია. ალი და ნინოს სრული ციკლი დაახლოებით ათი წუთია — მოიცადე, თორემ
    უბრალოდ ორ ფიგურას ნახავ. საუკეთესო დროა მზის ჩასვლამდე ერთი საათით ადრე. პარკი უფასოა და ღიაა მუდამ,
    სკამები და ტუალეტი აქვეა. შუადღისას ჩრდილი თითქმის არ არის და ქარი ზღვიდან ძლიერია. მანქანა ბულვარის
    პარალელურ ქუჩებზე დააყენე; კაფეები ბულვარზეა.
  route: >-
    თბილისიდან E60-ით გორზე, ხაშურზე, ზესტაფონსა და ქუთაისზე გავლით სამტრედიამდე, შემდეგ სამხრეთით ზღვის
    გზით ლანჩხუთისა და ქობულეთის გავლით — 370 კმ, დაახლოებით ხუთი საათი ნახევარი. გზა ბოლომდე ასფალტია
    და უმეტესად ორზოლიანი; ქობულეთის შემდეგ ზაფხულში საცობია. საწვავი ხაშურში, ქუთაისსა და ოზურგეთში აიღე.
    ბათუმში პარკინგი ფასიანია ცენტრში; ნავსადგურის მხარეს ადგილის პოვნა უფრო ადვილია. ეკონომ-კლასი სავსებით
    საკმარისია.
en:
  name: Alphabetic Tower and Miracle Park
  short: A 130-metre double helix carrying the Georgian alphabet, with Batumi's best sculpture standing
    at its foot.
  body: >-
    **The Alphabetic Tower is Batumi's most literal piece of architecture.** Two steel strands rise 130
    metres in a double helix, and the thirty-three letters of the Georgian alphabet are fixed to them
    in aluminium, spiralling from the base up to the sphere at the top. It was finished in 2012, part
    of the building surge that gave the city a skyline in a single decade.

    The idea — a DNA helix carrying the alphabet as genetic code — sounds heavy-handed written down and
    works better in the eye. In late afternoon the low sun catches the letters and the whole shaft turns
    copper; at night the tower is lit and the letters read clearly from a kilometre away.

    The tower stands in Miracle Park at the northern end of the New Boulevard, and the park, rather than
    the tower alone, is the reason to walk out here:

    - **Ali and Nino**, Tamara Kvesitadze's eight-metre moving sculpture of two figures who drift together,
    merge and pass through each other over about ten minutes — the best thing on this stretch of coast

    - The **Chacha Tower**, a 25-metre clock tower of 2012 built with fountains that were meant to run
    grape spirit; they do not

    - **Batumi lighthouse**, cast iron, working since 1863 and the oldest structure on the whole seafront

    - The Ferris wheel and the port breakwater, where anglers line up at dusk

    Access to the observation level and the restaurant sphere has opened and closed repeatedly over the
    years, so treat the climb as a bonus rather than a plan. The view from the ground is the point anyway:
    sea on one side, the Adjaran ridges standing behind the city on the other, and Batumi's odd, half-finished
    collage of towers in between.
  tip: >-
    Thirty to sixty minutes is enough. Ali and Nino run a full cycle in roughly ten minutes, so wait it
    out or you will only see two static figures. The hour before sunset is the best light. The park is
    free and never closes, with benches and public toilets on site. At midday there is almost no shade
    and the sea wind is strong. Park on the streets behind the boulevard; cafes are back on the promenade.
  route: >-
    From Tbilisi take the E60 west through Gori, Khashuri, Zestaponi and Kutaisi to Samtredia, then turn
    south on the coast road through Lanchkhuti and Kobuleti — 370 km, about five and a half hours. The
    road is asphalt throughout and mostly two lanes; expect slow traffic through Kobuleti in summer. Refuel
    at Khashuri, Kutaisi or Ozurgeti. Central Batumi parking is paid, but spaces are easier to find near
    the port end. An economy car is entirely sufficient.
ru:
  name: Башня алфавита и Парк чудес
  short: Двойная спираль высотой 130 метров с буквами грузинского алфавита и лучшая скульптура Батуми
    у её подножия.
  body: >-
    **Башня алфавита — самая буквальная архитектура Батуми.** Две стальные нити поднимаются на 130 метров
    двойной спиралью, а на них закреплены алюминиевые тридцать три буквы грузинского алфавита, идущие
    от основания до шара наверху. Башню закончили в 2012 году — она часть строительной волны, изменившей
    силуэт города за одно десятилетие.

    Замысел — спираль ДНК, несущая алфавит как генетический код, — на бумаге звучит тяжеловесно, а вживую
    смотрится лучше. Под вечер низкое солнце ловит буквы, и весь ствол становится медным; ночью башня
    подсвечена, и буквы читаются за километр.

    Башня стоит в Парке чудес, в северном конце Нового бульвара, и сюда стоит идти ради парка, а не только
    ради башни:

    - **Али и Нино** — восьмиметровая движущаяся скульптура Тамары Квеситадзе: две фигуры за десять минут
    сходятся, сливаются и проходят друг сквозь друга; лучшее, что есть на этом отрезке берега

    - **Башня чачи** — 25-метровая часовая башня 2012 года с фонтанами, из которых должна была течь чача;
    не течёт

    - **Батумский маяк** — чугунный, работает с 1863 года, старейшее сооружение всей набережной

    - Колесо обозрения и портовый мол, где к вечеру выстраиваются рыбаки

    Доступ на смотровой уровень и в ресторанную сферу за годы то открывали, то закрывали, так что подъём
    считайте бонусом, а не планом. Главный вид всё равно снизу: с одной стороны море, с другой — аджарские
    хребты за городом, а между ними странный, недоделанный коллаж батумских башен.
  tip: >-
    Получаса-часа достаточно. Полный цикл «Али и Нино» — около десяти минут, так что дождитесь, иначе
    увидите просто две неподвижные фигуры. Лучший свет — за час до заката. Парк бесплатный и открыт всегда,
    есть скамейки и туалет. В полдень тени почти нет, а морской ветер сильный. Машину ставьте на улицах
    за бульваром; кафе — обратно на набережной.
  route: >-
    Из Тбилиси по E60 на запад через Гори, Хашури, Зестафони и Кутаиси до Самтредиа, затем на юг по приморской
    дороге через Ланчхути и Кобулети — 370 км, около пяти с половиной часов. Дорога асфальтированная,
    в основном двухполосная; летом в Кобулети бывают пробки. Заправиться удобно в Хашури, Кутаиси или
    Озургети. В центре Батуми парковка платная, места легче найти ближе к порту. Машины эконом-класса
    вполне достаточно.
fa:
  name: برج الفبا و پارک معجزه
  short: مارپیچی دوگانه به بلندی ۱۳۰ متر با حروف الفبای گرجی، و بهترین مجسمهٔ باتومی در پای آن.
  body: >-
    **برج الفبا صریح‌ترین معماری باتومی است.** دو رشتهٔ فولادی به شکل مارپیچ دوگانه تا ۱۳۰ متر بالا می‌روند
    و سی‌وسه حرف الفبای گرجی از جنس آلومینیوم روی آن‌ها نشسته‌اند و از پایین تا کرهٔ بالای برج می‌پیچند.
    ساخت آن در ۲۰۱۲ پایان یافت، بخشی از موج ساختمانی که خط آسمان شهر را در یک دهه ساخت.

    ایده — مارپیچ دی‌ان‌ای که الفبا را همچون رمز ژنتیکی حمل می‌کند — روی کاغذ سنگین به نظر می‌رسد و در
    عمل بهتر جواب می‌دهد. عصرها آفتاب کم‌ارتفاع روی حروف می‌افتد و کل ستون مسی می‌شود؛ شب‌ها برج نورپردازی
    شده و حروف از یک کیلومتری خوانده می‌شوند.

    برج در پارک معجزه، در انتهای شمالی بلوار جدید، ایستاده است و دلیل آمدن به اینجا خود پارک است، نه تنها
    برج:

    - **علی و نینو**، مجسمهٔ متحرک هشت‌متری تامارا کوسیتادزه: دو پیکر در حدود ده دقیقه به هم نزدیک می‌شوند،
    یکی می‌شوند و از میان یکدیگر می‌گذرند؛ بهترین اثر این نوار ساحلی

    - **برج چاچا**، برج ساعت ۲۵ متری ساخت ۲۰۱۲ با فواره‌هایی که قرار بود عرق انگور جاری کنند؛ نمی‌کنند

    - **فانوس دریایی باتومی**، از چدن، از ۱۸۶۳ در کار، کهن‌ترین سازهٔ کل ساحل

    - چرخ‌وفلک و موج‌شکن بندر که غروب‌ها ماهیگیران کنارش صف می‌کشند

    دسترسی به طبقهٔ دیدبانی و کرهٔ رستوران در این سال‌ها بارها باز و بسته شده، پس بالا رفتن را امتیازی
    اضافه بدانید نه برنامه. منظرهٔ اصلی از پایین است: یک سو دریا، سوی دیگر رشته‌کوه‌های آجارا پشت شهر،
    و در میانه کلاژ عجیب و نیمه‌تمام برج‌های باتومی.
  tip: >-
    نیم تا یک ساعت کافی است. چرخهٔ کامل علی و نینو حدود ده دقیقه است، پس صبر کنید وگرنه فقط دو پیکر بی‌حرکت
    می‌بینید. بهترین نور یک ساعت پیش از غروب است. پارک رایگان است و همیشه باز، با نیمکت و سرویس بهداشتی.
    ظهرها تقریباً سایه‌ای نیست و باد دریا تند است. خودرو را در خیابان‌های پشت بلوار بگذارید؛ کافه‌ها روی
    خود بلوار هستند.
  route: >-
    از تفلیس با بزرگراه E60 به غرب، از گوری، خاشوری، زستافونی و کوتایسی تا سامترِدیا، سپس به جنوب در جادهٔ
    ساحلی از لانچخوتی و کوبولتی — ۳۷۰ کیلومتر، حدود پنج ساعت و نیم. جاده سرتاسر آسفالت و بیشتر دوبانده
    است؛ تابستان‌ها در کوبولتی ترافیک سنگین می‌شود. سوخت‌گیری در خاشوری، کوتایسی یا اوزورگتی. پارکینگ
    مرکز باتومی پولی است و نزدیک بندر جای خالی راحت‌تر پیدا می‌شود. خودروی اقتصادی کاملاً کافی است.
he:
  name: מגדל האלפבית ופארק הנסים
  short: סליל כפול בגובה 130 מטר הנושא את אותיות האלפבית הגאורגי, ולרגליו הפסל הטוב ביותר בבאטומי.
  body: >-
    **מגדל האלפבית הוא האדריכלות המילולית ביותר בבאטומי.** שני גדילי פלדה עולים 130 מטר בסליל כפול, ועליהם
    מקובעות שלושים ושלוש אותיות האלפבית הגאורגי מאלומיניום, מתפתלות מן הבסיס עד הכדור שבראש. הבנייה הסתיימה
    ב-2012, כחלק מגל הבנייה שיצר לעיר קו רקיע בתוך עשור אחד.

    הרעיון — סליל דנ״א הנושא את האלפבית כקוד גנטי — נשמע כבד כשכותבים אותו, ועובד טוב יותר לעין. אחר הצהריים
    השמש הנמוכה תופסת את האותיות והעמוד כולו הופך נחושתי; בלילה המגדל מואר והאותיות נקראות ממרחק קילומטר.

    המגדל עומד בפארק הנסים בקצה הצפוני של השדרה החדשה, והפארק — ולא המגדל לבדו — הוא הסיבה להגיע לכאן:

    - **עלי ונינו**, פסל נע בגובה שמונה מטרים של תמרה קווסיטאדזה: שתי דמויות מתקרבות, מתמזגות וחולפות
    זו דרך זו בכעשר דקות; הדבר הטוב ביותר לאורך קו החוף הזה

    - **מגדל הצ׳אצ׳ה**, מגדל שעון בן 25 מטר משנת 2012 עם מזרקות שהיו אמורות להזרים יין שרוף מענבים; הן
    אינן פועלות

    - **מגדלור באטומי**, יצוק ברזל, פועל מאז 1863 והמבנה העתיק ביותר בכל הטיילת

    - גלגל ענק ושובר הגלים של הנמל, שבו נעמדים דייגים עם רדת הערב

    הגישה לקומת התצפית ולכדור המסעדה נפתחה ונסגרה שוב ושוב לאורך השנים, ולכן כדאי להתייחס לעלייה כבונוס
    ולא כתוכנית. הנוף העיקרי ממילא מלמטה: מצד אחד הים, מן הצד השני רכסי אג׳ריה מאחורי העיר, וביניהם קולאז׳
    המגדלים המוזר והבלתי גמור של באטומי.
  tip: >-
    חצי שעה עד שעה מספיקות. מחזור שלם של עלי ונינו אורך כעשר דקות, אז המתינו, אחרת תראו רק שתי דמויות
    קפואות. האור הטוב ביותר הוא בשעה שלפני השקיעה. הפארק חינם ופתוח תמיד, יש ספסלים ושירותים. בצהריים
    כמעט אין צל ורוח הים חזקה. החנו ברחובות שמאחורי השדרה; בתי הקפה נמצאים על הטיילת עצמה.
  route: >-
    מטביליסי מערבה בכביש E60 דרך גורי, חשורי, זסטאפוני וקוטאיסי עד סמטרדיה, ומשם דרומה בכביש החוף דרך
    לנצ׳חותי וקובולטי — 370 ק״מ, כחמש שעות וחצי. הכביש סלול לכל אורכו וברובו דו-נתיבי; בקיץ הפקקים בקובולטי
    איטיים. תדלוק בחשורי, בקוטאיסי או באוזורגטי. החניה במרכז באטומי בתשלום, וקל יותר למצוא מקום בצד הנמל.
    רכב חסכוני מספיק לחלוטין.
ar:
  name: برج الأبجدية وحديقة المعجزة
  short: حلزون مزدوج بارتفاع 130 متراً يحمل حروف الأبجدية الجورجية، وعند قدمه أجمل منحوتة في باتومي.
  body: >-
    **برج الأبجدية هو أكثر عمارة باتومي مباشرةً.** خيطان من الفولاذ يرتفعان 130 متراً في حلزون مزدوج،
    وعليهما ثبتت حروف الأبجدية الجورجية الثلاثة والثلاثون من الألمنيوم، تلتف من القاعدة حتى الكرة في الأعلى.
    اكتمل البرج عام 2012 ضمن موجة البناء التي منحت المدينة أفقها في عقد واحد.

    الفكرة — حلزون الحمض النووي يحمل الأبجدية بوصفها شفرة وراثية — تبدو ثقيلة على الورق وأفضل بكثير للعين.
    في العصر تلتقط الشمس المنخفضة الحروف فيتحول العمود كله إلى لون النحاس؛ وفي الليل يُضاء البرج وتُقرأ
    الحروف من مسافة كيلومتر.

    يقوم البرج في حديقة المعجزة عند الطرف الشمالي من الشارع البحري الجديد، والحديقة نفسها، لا البرج وحده،
    هي سبب المجيء إلى هنا:

    - **علي ونينو**، منحوتة متحركة بارتفاع ثمانية أمتار لتامارا كفيسيتادزه: شخصان يقتربان ويندمجان ثم
    يعبر كل منهما في الآخر خلال نحو عشر دقائق؛ أفضل ما على هذا الشريط الساحلي

    - **برج التشاتشا**، برج ساعة بارتفاع 25 متراً من عام 2012 بنوافير كان يُفترض أن تسيل عرق العنب؛ وهي
    لا تفعل

    - **منارة باتومي**، من الحديد الزهر، تعمل منذ 1863 وهي أقدم منشأة على الواجهة البحرية كلها

    - عجلة الملاهي وحاجز أمواج الميناء حيث يصطف الصيادون عند الغروب

    أما الصعود إلى طابق المشاهدة وكرة المطعم فقد فُتح وأُغلق مراراً عبر السنوات، فاعتبره مكسباً إضافياً
    لا خطة. المنظر الأساسي من الأسفل على أي حال: البحر من جهة، وسلاسل أجاريا خلف المدينة من الجهة الأخرى،
    وبينهما كولاج أبراج باتومي الغريب غير المكتمل.
  tip: >-
    نصف ساعة إلى ساعة تكفي. دورة علي ونينو الكاملة نحو عشر دقائق، فانتظرها وإلا رأيت تمثالين ساكنين فقط.
    أفضل ضوء في الساعة السابقة للغروب. الحديقة مجانية ومفتوحة دائماً، وفيها مقاعد ودورات مياه. عند الظهيرة
    لا ظل تقريباً وريح البحر قوية. أوقف السيارة في الشوارع خلف الشارع البحري؛ المقاهي على الواجهة نفسها.
  route: >-
    من تبليسي غرباً على الطريق E60 عبر غوري وخاشوري وزستافوني وكوتايسي حتى سامتريديا، ثم جنوباً على طريق
    الساحل عبر لانتشخوتي وكوبوليتي — 370 كم، نحو خمس ساعات ونصف. الطريق معبّد بالكامل وثنائي المسار في
    معظمه؛ وفي الصيف تبطئ الحركة داخل كوبوليتي. التزود بالوقود في خاشوري أو كوتايسي أو أوزورغيتي. الوقوف
    في وسط باتومي مدفوع، والأماكن أسهل قرب الميناء. وسيارة اقتصادية تكفي تماماً.
