ka:
  name: ანბანის კოშკი და სასწაულების პარკი
  short: >-
    130-მეტრიანი ორმაგი სპირალი, რომელსაც ქართული ანბანის 33 მანათობელი ასო მიუყვება, ძირში კი საღამოს
    შვიდზე „ალი და ნინო“ ცოცხლდება.
  body: >-
    **ოცდაცამეტი ასო, თითო ოთხი მეტრისა, ბათუმის ნავსადგურის თავზე 130-მეტრიან ორმაგ სპირალს მიუყვება
    — ქართული ანბანი, ჩაწერილი ისე, როგორც გენეტიკური კოდი.**


    კოშკი ესპანური კომპანია „სი-ემ-დი ინხენიეროსის“ ინჟინრებმა, ალბერტო დომინგო კაბომ და კარლოს ლასარომ,
    დააპროექტეს (დომინგო კაბოს ეკუთვნის ახალი ბულვარის პროექტიც) და 2010 წლის ოქტომბრიდან 2011 წლის დეკემბრამდე
    აშენდა. კარკასი ფოლადის მილებისაა, ორი სპირალური ზოლი — ალუმინის ცხაურა ფურცლისა, რომელიც სიარულისას
    ხან მკვრივდება, ხან თითქოს ქრება. მხედრული ასოებიც ალუმინისაა, შიგ ჩამონტაჟებული შუქდიოდებით, ამიტომ
    ღამით სანაპიროს შორეული წერტილებიდანაც იკითხება.


    მწვერვალის მინის სფერო კოშკის მთავარ საჩუქრად იყო ჩაფიქრებული: ორმოც ბორბალზე მბრუნავი რესტორანი,
    რომელიც სრულ წრეს ზუსტად ერთ საათში ასრულებს, სადამკვირვებლო მოედანი და ორმოცდაათტონიანი ქანქარა-ჩამხშობი,
    რომლის რხევაც ძლიერ ქარში თვალით ჩანს. სინამდვილე უფრო მძიმე აღმოჩნდა: 2014 წლისთვის ლიფტი გაფუჭებული
    იყო და იატაკზე მკვდარი ჩიტები ეყარა; 2015 წელს მერიამ კოშკი ესპანურ კომპანიას ოცი წლით მიაქირავა,
    2017 წლისთვის კი რესტორანი ისევ მუშაობდა. ზემოთ ასვლა ბონუსად ჩათვალეთ და არა გეგმად.


    აქ მოსვლის უფრო ძლიერი მიზეზი გარშემო გაშლილი სასწაულების პარკია. საღამოს შვიდ საათზე თამარ კვესიტაძის
    „ალი და ნინო“ ამოძრავდება: ფოლადის ფიგურები ნელა უახლოვდებიან ერთმანეთს, ერთმანეთში გადიან და ისევ
    შორდებიან. თავად მოქანდაკის თქმით, ნამუშევრის მთავარი სათქმელი ისაა, რომ „ერთად ყოფნა მხოლოდ ცოტა
    ხნით არის შესაძლებელი“. იქვე დგას 1882 წლის შუქურა (ამ კონცხზე შუქი 1863 წლიდან ანთია), ეშმაკის ბორბალი,
    რომელსაც მოქანდაკე თავისი ნამუშევრის უხერხულ მეზობლად მიიჩნევს, და 2012 წლის 25-მეტრიანი „ჭაჭის კოშკი“
    — მისი შადრევნებიდან დაპირებული ჭაჭა ბათუმში დიდი ხანია ხუმრობად იქცა.


    დარჩით, სანამ ასოები აინთება: ეს ანბანი ღამით უკეთ იკითხება.
  tip: >-
    საკმარისია ორმოცდახუთი წუთიდან საათამდე. „ალი და ნინო“ მხოლოდ საღამოს შვიდიდან მოძრაობს და ციკლი დაახლოებით
    ათ წუთს გრძელდება — დღისით ორ უძრავ ფიგურას ნახავთ, ამიტომ მოდით 15-20 წუთით ადრე, სანამ ზაფხულის
    ბრბო პარკს და მიმდებარე ფასიან ავტოსადგომებს აავსებს. პარკი ღიაა და უფასო, მზის ჩასვლამდე ერთი საათი
    კი ფოტოსთვის საუკეთესო დროა. შუადღით ჩრდილი თითქმის არ არის და ზღვიდან ძლიერი ქარი უბერავს. სფეროში
    ასვლის საათები და ფასი ხშირად იცვლება — იკითხეთ კოშკის ძირში. კაფეები ბულვარის გაყოლებაზეა.
  route: >-
    თბილისიდან 370 კილომეტრი და დაახლოებით ხუთნახევარი საათია. E60-ით გორის, ხაშურის, ქუთაისისა და სამტრედიის
    გავლით მიდიხართ, შემდეგ S12-ით ლანჩხუთის გავლით ზღვაზე გადიხართ და სანაპიროს გაყოლებით, ქობულეთის
    გავლით, ბათუმში შედიხართ. გზა ბოლომდე ასფალტია; ზაფხულში ქობულეთთან საცობს მოელოდეთ. საწვავი ხაშურში
    ან ქუთაისში ჩაასხით. სასწაულების პარკი ბულვარის ჩრდილოეთ ბოლოშია, ნავსადგურთან; პარკინგი ცენტრში ფასიანია,
    ადგილს კი უფრო ადვილად ბულვარის უკანა ქუჩებში იპოვით. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Alphabetic Tower and Miracle Park
  short: >-
    A 130-metre double helix carrying the 33 glowing letters of the Georgian alphabet, with Ali and Nino
    coming to life at its foot at 7 pm.
  body: >-
    **Thirty-three letters, each four metres tall, climb a 130-metre double helix above Batumi harbour:
    the Georgian alphabet written as if it were genetic code.**


    The tower was engineered by Alberto Domingo Cabo and Carlos Lázaro of the Spanish firm CMD Ingenieros
    (Domingo Cabo also designed the New Boulevard) and went up between October 2010 and December 2011.
    The frame is steel tube; the two spiral bands are expanded aluminium mesh that thickens and thins
    as you walk past. The Mkhedruli letters are aluminium too, with LEDs built in, so after dark they
    read clearly from far along the shore.


    The glass sphere at the top was meant to be the prize: a restaurant floor turning on forty wheels
    once an hour, an observation deck, and a fifty-tonne pendulum damper you can watch swing in a strong
    wind. Reality was harder. By 2014 the lift had broken and dead birds lay on the floors; in 2015 the
    city leased the tower to a Spanish company for twenty years, and by 2017 the restaurant was serving
    again. Treat the ride up as a bonus, not the plan.


    Miracle Park around it is the stronger reason to come. At 7 pm Tamar Kvesitadze's Ali and Nino begin
    to move: two steel figures drift together, pass through each other and part. The sculptor's own reading
    is that "being together is possible for only a little time". Beside them stand the 1882 lighthouse
    (a light has burned on this point since 1863), the Ferris wheel she considers an awkward neighbour,
    and the 25-metre Chacha Tower of 2012, whose promised fountains of grape spirit have become a local
    joke.


    Stay until the letters light up. This alphabet is best read at night.
  tip: >-
    Forty-five minutes to an hour is enough. Ali and Nino move only from 7 pm, in cycles of about ten
    minutes; in daylight you will see two static figures, so arrive 15–20 minutes early, before summer
    crowds fill the park and the nearby paid car parks. The park is open and free, and the hour before
    sunset gives the best light. At midday there is almost no shade and the sea wind is strong. Hours
    and prices for the sphere change often, so ask at the base. Cafés line the boulevard.
  route: >-
    From Tbilisi it is 370 km, about five and a half hours. Take the E60 west through Gori, Khashuri,
    Kutaisi and Samtredia, then the S12 through Lanchkhuti to the coast and south through Kobuleti into
    Batumi. It is asphalt all the way; expect summer queues around Kobuleti. Refuel at Khashuri or Kutaisi.
    Miracle Park is at the northern end of the boulevard beside the port. Central parking is paid, and
    spaces are easier to find in the streets behind the boulevard. An economy car is entirely sufficient.
ru:
  name: Башня алфавита и Парк чудес
  short: >-
    130-метровая двойная спираль с тридцатью тремя светящимися буквами грузинского алфавита — у её подножия
    в семь вечера оживают «Али и Нино».
  body: >-
    **Тридцать три буквы, каждая высотой четыре метра, поднимаются по 130-метровой двойной спирали над
    батумской гаванью — грузинский алфавит, записанный, будто генетический код.**


    Башню спроектировали инженеры испанской компании «Си-Эм-Ди Инхеньерос», Альберто Доминго Кабо и Карлос
    Ласаро (тому же Доминго Кабо принадлежит и проект Нового бульвара), а строили её с октября 2010 по
    декабрь 2011 года. Каркас стальной, трубчатый; две спиральные полосы сделаны из просечно-вытяжного
    алюминиевого листа, который на ходу то сгущается, то почти исчезает. Буквы мхедрули тоже алюминиевые,
    со встроенной светодиодной подсветкой, поэтому ночью их читают даже с дальних точек побережья.


    Стеклянная сфера на вершине задумывалась главным подарком башни: вращающийся на сорока колёсах ресторан,
    делающий полный оборот ровно за час, смотровая площадка и пятидесятитонный маятниковый гаситель колебаний,
    чьё раскачивание в сильный ветер видно невооружённым глазом. Реальность оказалась суровее: к 2014
    году лифт сломался, а на полу лежали мёртвые птицы; в 2015 году мэрия сдала башню испанской компании
    в аренду на двадцать лет, и к 2017 году ресторан снова работал. Подъём наверх воспринимайте как бонус,
    а не как план.


    Более веская причина приехать сюда — раскинувшийся вокруг Парк чудес. В семь вечера оживают «Али и
    Нино» Тамары Квеситадзе: стальные фигуры медленно движутся друг к другу, проходят одна через другую
    и снова расходятся. По словам самой Квеситадзе, смысл работы в том, что «быть вместе можно только
    недолго». Рядом стоят маяк 1882 года (огонь на этом мысу горит с 1863-го), колесо обозрения, которое
    скульптор считает неудачным соседством для своей работы, и 25-метровая «Башня чачи» 2012 года — обещанные
    фонтаны виноградного спирта из неё давно стали батумской шуткой.


    Останьтесь, пока не загорятся буквы: этот алфавит лучше читается ночью.
  tip: >-
    Хватит от сорока пяти минут до часа. «Али и Нино» движутся только с семи вечера, циклами примерно
    по десять минут; днём вы увидите лишь две неподвижные фигуры, так что приходите на 15–20 минут раньше,
    пока летняя толпа не заполнила парк и платные стоянки вокруг него. Парк открыт и бесплатен, а час
    перед закатом — лучшее время для фото. В полдень тени почти нет, а с моря дует сильный ветер. Часы
    работы и цена подъёма на сферу часто меняются — уточняйте у подножия башни. Кафе — вдоль бульвара.
  route: >-
    От Тбилиси 370 км, около пяти с половиной часов. Двигайтесь на запад по E60 через Гори, Хашури, Кутаиси
    и Самтредиа, затем по S12 через Ланчхути к побережью и на юг через Кобулети в Батуми. Дорога заасфальтирована
    целиком; летом у Кобулети ожидайте пробки. Заправляйтесь в Хашури или Кутаиси. Парк чудес — в северной
    части бульвара, у порта; парковка в центре платная, свободные места легче найти на улицах за бульваром.
    Машины экономкласса вполне достаточно.
fa:
  name: برج الفبا و پارک معجزات
  short: >-
    مارپیچ دوگانه‌ای به بلندی ۱۳۰ متر که ۳۳ حرف درخشان الفبای گرجی را بر خود دارد و در پای آن، ساعت هفت
    شب، «علی و نینو» به حرکت درمی‌آیند.
  body: >-
    **سی‌وسه حرف، هر یک به بلندی چهار متر، از مارپیچی دوگانه به بلندی ۱۳۰ متر بالای بندر باتومی بالا می‌روند:
    الفبای گرجی، نوشته‌شده گویی رمزِ ژنتیک باشد.**


    این برج را آلبرتو دومینگو کابو و کارلوس لازارو از شرکت اسپانیایی «سی‌ام‌دی اینخنیروس» طراحی کردند
    (همان دومینگو کابو که طراح بلوار جدید نیز هست) و ساخت آن از اکتبر ۲۰۱۰ تا دسامبر ۲۰۱۱ به طول کشید.
    اسکلت برج از لوله‌های فولادی است؛ دو نوار مارپیچ آن از توری آلومینیومی کشیده‌شده ساخته شده که هنگام
    عبور از کنارش، گاه متراکم می‌شود و گاه تقریباً ناپدید می‌گردد. حروف خطِ مخِدرولی نیز از آلومینیوم‌اند
    و از درون با ال‌ای‌دی روشن می‌شوند، به‌طوری که شب‌ها از نقاط دوردستِ ساحل نیز خوانا هستند.


    کرهٔ شیشه‌ای بر فراز برج قرار بود جایزهٔ اصلی آن باشد: رستورانی که کف آن روی چهل چرخ می‌چرخد و هر
    ساعت یک دور کامل می‌زند، سکوی دیدبانی، و میراگرِ آونگیِ پنجاه‌تنی که نوسانش را در باد شدید می‌توان
    دید. اما واقعیت سخت‌تر از این بود. تا سال ۲۰۱۴ آسانسور از کار افتاده بود و پرندگان مرده روی زمین ریخته
    بودند؛ در سال ۲۰۱۵ شهرداری برج را برای بیست سال به شرکتی اسپانیایی اجاره داد، و تا سال ۲۰۱۷ رستوران
    دوباره کار می‌کرد. صعود به بالا را پاداشی جانبی بدانید، نه هدف اصلی سفر.


    دلیل قوی‌تر برای آمدن به این‌جا، پارک معجزاتِ اطراف برج است. ساعت هفت شب، «علی و نینو»ی تامار کوِسیتادزه
    به حرکت درمی‌آیند: دو پیکرهٔ فولادی به‌آرامی به هم نزدیک می‌شوند، از میان هم می‌گذرند و باز از هم
    دور می‌شوند. به گفتهٔ خود پیکره‌ساز، پیام اصلی اثر این است که «با هم بودن تنها برای مدتی کوتاه ممکن
    است». در کنارشان فانوس دریایی سال ۱۸۸۲ ایستاده (نوری در این نقطه از ۱۸۶۳ روشن است)، چرخ‌وفلکی که مجسمه‌ساز
    آن را همسایهٔ ناخوشایند اثرش می‌داند، و «برج چاچا»ی ۲۵ متری ساخت ۲۰۱۲، که وعدهٔ فوران چاچا از فواره‌هایش
    مدت‌هاست به شوخی محلی بدل شده است.


    بمانید تا حروف روشن شوند: این الفبا را بهتر است شب بخوانید.
  tip: >-
    چهل‌وپنج دقیقه تا یک ساعت کافی است. «علی و نینو» تنها از ساعت هفت شب حرکت می‌کنند، در چرخه‌هایی نزدیک
    به ده دقیقه؛ در روز فقط دو پیکرهٔ بی‌حرکت خواهید دید، پس ۱۵ تا ۲۰ دقیقه زودتر بیایید، پیش از آن‌که
    ازدحام تابستانی پارک و پارکینگ‌های پولیِ اطراف را پر کند. ورود به پارک آزاد و رایگان است، و ساعت پیش
    از غروب بهترین نور را برای عکس دارد. در نیمروز تقریباً هیچ سایه‌ای نیست و باد دریا شدید می‌وزد. ساعت‌ها
    و قیمت صعود به کره اغلب تغییر می‌کند، پس در پای برج بپرسید. کافه‌ها در طول بلوار قرار دارند.
  route: >-
    از تفلیس ۳۷۰ کیلومتر است، حدود پنج ساعت و نیم. از E60 به‌سوی غرب، از گوری، خاشوری، کوتایسی و سامترِدیا
    بگذرید، سپس از S12 از میان لانچخوتی به ساحل برسید و آن‌گاه به‌سوی جنوب، از میان کوبولتی، به باتومی
    وارد شوید. جاده تا انتها آسفالته است؛ در تابستان نزدیک کوبولتی منتظر ترافیک سنگین باشید. در خاشوری
    یا کوتایسی سوخت‌گیری کنید. پارک معجزات در انتهای شمالی بلوار، کنار بندر است؛ پارکینگ مرکز شهر پولی
    است و یافتن جا در خیابان‌های پشت بلوار آسان‌تر است. خودروی اقتصادی کاملاً کافی است.
he:
  name: מגדל האלף-בית ופארק הנפלאות
  short: >-
    ספירלה כפולה בגובה 130 מטרים הנושאת את 33 האותיות הזוהרות של האלף-בית הגאורגי, ולמרגלותיה מתעוררים
    "עלי וננו" בשעה 19:00.
  body: >-
    **שלושים ושלוש אותיות, כל אחת בגובה ארבעה מטרים, מטפסות על ספירלה כפולה בגובה 130 מטר מעל נמל בטומי:
    האלף-בית הגאורגי, כתוב כאילו היה קוד גנטי.**


    את המגדל תכננו המהנדסים אלברטו דומינגו קאבו וקרלוס לסארו מהחברה הספרדית סי-אם-די אינחנייריוס (אותו
    דומינגו קאבו שתכנן גם את הטיילת החדשה), ובנייתו נמשכה מאוקטובר 2010 עד דצמבר 2011. השלד עשוי צינורות
    פלדה; שתי הרצועות הספירליות עשויות רשת אלומיניום מתוחה, שמתעבה ומתדקקת בעת שחולפים על פניה. גם אותיות
    המחדרולי עשויות אלומיניום, עם תאורת לד מובנית, כך שבחשכה הן קריאות היטב ממקומות רחוקים על החוף.


    כדור הזכוכית בפסגה נועד להיות הפרס הגדול: מסעדה מסתובבת על ארבעים גלגלים, המשלימה סיבוב מלא בשעה בדיוק,
    מרפסת תצפית, ומשכך תנודות מטוטלתי במשקל חמישים טונות שאפשר לראות אותו מתנדנד ברוח חזקה. המציאות הייתה
    קשה יותר: עד 2014 כבר התקלקלה המעלית, ועל הרצפות היו מוטלות ציפורים מתות; ב-2015 העירייה השכירה את
    המגדל לחברה ספרדית לעשרים שנה, ועד 2017 המסעדה חזרה לעבוד. התייחסו לעלייה לצמרת כבונוס, לא כתכנית.


    הסיבה החזקה יותר לבוא לכאן היא פארק הנפלאות שמסביב. בשעה 19:00 מתעוררים "עלי וננו" של תמר קווסיטדזה:
    שתי דמויות פלדה נעות לאיטן זו לעבר זו, חולפות זו בזו ונפרדות מחדש. לדברי האמנית עצמה, המסר של היצירה
    הוא ש"להיות יחד אפשר רק לזמן קצר". בסמוך עומדים המגדלור מ-1882 (אור בוער בנקודה זו מאז 1863), גלגל
    ענק שהאמנית רואה בו שכן מביך ליצירתה, ו"מגדל הצ'אצ'ה" הגבוה 25 מטר מ-2012, שמזרקות הצ'אצ'ה שהובטחו
    ממנו הפכו מזמן לבדיחה מקומית.


    הישארו עד שהאותיות יידלקו: את האלף-בית הזה קוראים טוב יותר בלילה.
  tip: >-
    ארבעים וחמש דקות עד שעה מספיקות. "עלי וננו" נעים רק משעה 19:00, במחזורים של כעשר דקות; ביום תראו רק
    שתי דמויות דוממות, אז הגיעו 15–20 דקות מוקדם יותר, לפני שהקהל הקיצי ממלא את הפארק ואת החניונים בתשלום
    שסביבו. הפארק פתוח וללא תשלום, והשעה שלפני השקיעה נותנת את האור הטוב ביותר לצילום. בצהריים אין כמעט
    צל והרוח מהים חזקה. שעות הפעילות והמחיר לעלייה לכדור משתנים לעיתים קרובות, כדאי לבדוק בבסיס המגדל.
    בתי קפה נמצאים לאורך הטיילת.
  route: >-
    מטביליסי המרחק הוא 370 ק"מ, כחמש שעות וחצי. סעו מערבה בכביש E60 דרך גורי, חשורי, קוטאיסי וסמטרדיה,
    ואז ב-S12 דרך לנצ'חוטי לחוף ומשם דרומה דרך קובולטי לבטומי. הכביש סלול לכל אורכו; בקיץ צפו לעומס תנועה
    סביב קובולטי. תדלקו בחשורי או בקוטאיסי. פארק הנפלאות נמצא בקצה הצפוני של הטיילת, לצד הנמל; החנייה
    במרכז בתשלום, וקל יותר למצוא מקום ברחובות שמאחורי הטיילת. רכב אקונומי מספיק בהחלט.
ar:
  name: برج الأبجدية وحديقة المعجزات
  short: >-
    حلزون مزدوج ارتفاعه 130 مترًا يحمل 33 حرفًا متوهجًا من الأبجدية الجورجية، وعند قاعدته ينبض تمثالا
    "علي ونينو" بالحياة عند السابعة مساءً.
  body: >-
    **ثلاثة وثلاثون حرفًا، ارتفاع كل منها أربعة أمتار، تتسلّق حلزونًا مزدوجًا بارتفاع 130 مترًا فوق ميناء
    باتومي: الأبجدية الجورجية مكتوبة كما لو كانت شفرة جينية.**


    صمّم البرج المهندسان ألبرتو دومينغو كابو وكارلوس لاسارو من شركة "سي إم دي إنخينييروس" الإسبانية (ودومينغو
    كابو نفسه هو من صمم البولفار الجديد)، وأُنشئ بين أكتوبر 2010 وديسمبر 2011. الهيكل من أنابيب فولاذية؛
    والشريطان الحلزونيان مصنوعان من شبك ألومنيوم موسّع يتكاثف ويترقّق كلما مررت بجانبه. حروف الخط المخِدرولي
    مصنوعة من الألومنيوم أيضًا، ومزوّدة بإضاءة ليد داخلية، فتُقرأ بوضوح ليلًا من نقاط بعيدة على الساحل.


    كانت الكرة الزجاجية في القمة الجائزة الكبرى المقصودة: مطعم دوّار على أربعين عجلة يكمل دورة كاملة كل
    ساعة، ومنصة مراقبة، ومخمِّد اهتزازات بندولي كتلته خمسون طنًا يمكن رؤية تمايله في الريح القوية. لكن
    الواقع كان أصعب: بحلول عام 2014 تعطّل المصعد وتناثرت طيور نافقة على الأرض؛ وفي عام 2015 أجّرت البلدية
    البرج لشركة إسبانية لعشرين عامًا، وبحلول 2017 عاد المطعم إلى العمل. اعتبر الصعود إلى القمة مكسبًا
    إضافيًا لا خطة أساسية.


    السبب الأقوى للقدوم إلى هنا هو حديقة المعجزات المحيطة بالبرج. في السابعة مساءً يبدأ تمثالا "علي ونينو"
    لتمار كفيسيتادزه بالحركة: شخصيتان فولاذيتان تقترب كل منهما من الأخرى ببطء، تعبر كل منهما الأخرى ثم
    تفترقان. وبحسب النحّاتة نفسها، فإن رسالة العمل هي أن "البقاء معًا ممكن لوقت قصير فقط". وإلى جانبهما
    تقف المنارة المبنية عام 1882 (وهناك نور يُضيء هذه النقطة منذ عام 1863)، ودولاب الهواء الذي تراه النحّاتة
    جارًا محرجًا لعملها، و"برج التشاتشا" الذي يبلغ ارتفاعه 25 مترًا وبُني عام 2012، والذي أصبحت نوافير
    التشاتشا الموعودة منه نكتة محلية منذ زمن طويل.


    انتظر حتى تضيء الحروف: هذه الأبجدية تُقرأ أفضل ما تُقرأ ليلًا.
  tip: >-
    تكفي من خمس وأربعين دقيقة إلى ساعة. لا يتحرّك "علي ونينو" إلا من السابعة مساءً، في دورات مدتها نحو
    عشر دقائق؛ نهارًا سترى شخصيتين ثابتتين فقط، فتعالَ قبل الموعد بـ15 إلى 20 دقيقة، قبل أن تمتلئ الحديقة
    والمواقف المدفوعة القريبة بالحشد الصيفي. الدخول إلى الحديقة حر ومجاني، والساعة التي تسبق الغروب تمنح
    أفضل ضوء للتصوير. عند الظهيرة لا يوجد ظلّ يُذكر وتهبّ ريح البحر بقوة. تتغير مواعيد وأسعار الصعود إلى
    الكرة كثيرًا، فاسأل عند قاعدة البرج. المقاهي تمتد على طول الكورنيش.
  route: >-
    تبعد باتومي عن تبليسي 370 كم، أي نحو خمس ساعات ونصف. اتجه غربًا على الطريق E60 عبر غوري وخاشوري وكوتايسي
    وسامتريديا، ثم على الطريق S12 عبر لانتشخوتي إلى الساحل ثم جنوبًا عبر كوبوليتي إلى باتومي. الطريق مُعبّد
    بالكامل؛ توقّع ازدحامًا صيفيًا قرب كوبوليتي. تزوّد بالوقود في خاشوري أو كوتايسي. تقع حديقة المعجزات
    في الطرف الشمالي من الكورنيش، بجانب الميناء؛ المواقف في وسط المدينة مدفوعة، ويسهل إيجاد مكان في الشوارع
    الخلفية للكورنيش. تكفي سيارة اقتصادية تمامًا.
