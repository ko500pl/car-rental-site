ka:
  name: პანკისის ხეობა
  short: ალაზნის ზემო წელის ხეობა ახმეტის ჩრდილოეთით, სადაც ჩეჩნურენოვანი ქისტები ორ საუკუნეზე მეტია ცხოვრობენ.
  body: >-
    **პანკისი კახეთის ის კუთხეა, სადაც სხვა ენა ისმის და სხვა სამზარეულოა.** ხეობა ახმეტიდან ჩრდილოეთით
    იწყება და ალაზნის ზემო წელს მიჰყვება დაახლოებით ოცდაათი კილომეტრით; მთავარი სოფლებია დუისი, ჯოყოლო,
    ომალო, ბირკიანი და წინუბანი.


    აქ ქისტები ცხოვრობენ — ჩეჩნურენოვანი მოსახლეობა, რომელიც XIX საუკუნის 30-70-იან წლებში ჩრდილოეთ კავკასიიდან
    გადმოსახლდა და აქ დამკვიდრდა. მათი ენა ჩეჩნურის დიალექტია, რელიგია — ისლამი, ხოლო ყოფაში ორივე მხარის
    კვალია: ქართული ტოპონიმები, ჩეჩნური გვარები, კახური ვენახის ნაცვლად სიმინდი და საქონელი.


    2000-იან წლებში ხეობას ცუდი რეპუტაცია ჰქონდა — უკანონობა, შემდეგ კი მედიის ყურადღება რადიკალიზაციის
    თემაზე. დღეს პანკისი მშვიდი და უსაფრთხოა და ადგილობრივები საოჯახო ტურიზმზე მუშაობენ. სტუმარს პატივს
    სცემენ, თუმცა უცხოელი ჯერ კიდევ იშვიათია და ყურადღებას იქცევს.


    რისთვისაც აქ მოდიან:


    - **სუფიური ზიქრი** — დუისში ქალები ასრულებენ რიტუალურ წრიულ ლოცვას სიმღერითა და მოძრაობით; ეს კავკასიაში
    იშვიათად შემორჩენილი პრაქტიკაა


    - **საოჯახო სასტუმროები და ქისტური სამზარეულო** — ხინკალი ხორცით, კეთილი მასპინძლობა, უალკოჰოლო სუფრა


    - **ცხენით და ფეხით მარშრუტები** მთისკენ, ბაწარისა და თუშეთის საზღვრებისკენ


    ეს არ არის ღირსშესანიშნაობა ჩვეული გაგებით. აქ სანახავად კონკრეტული ძეგლი არ არის — არის ხეობა, სოფლები
    და ადამიანები, რომლებიც სხვაგვარად ცხოვრობენ, ვიდრე ქვემოთ, ვენახებში.
  tip: >-
    ღამისთევა საოჯახო სასტუმროში სჯობს ერთდღიან ვიზიტს: ერთ დღეში მხოლოდ გზას ნახავ. ალკოჰოლი მუსლიმური
    სოფლებია — ღვინო თან არ წაიღო და საჯაროდ არ დალიო. მეჩეთში ან ზიქრზე შესვლა მხოლოდ ნებართვით და მოკრძალებული
    ჩაცმულობით. ფოტოს გადაღებამდე იკითხე, განსაკუთრებით ქალების. მთის მარშრუტებზე ადგილობრივი გამცილებელი
    აუცილებელია. საზღვრის ზონასთან პირადობის მოწმობა თან იქონიე.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ დასავლეთით ახმეტამდე (კიდევ 25 კმ). ახმეტიდან
    ჩრდილოეთით დუისამდე დაახლოებით 12 კმ, გზა ასფალტია და ბოლო კილომეტრებში ვიწროვდება. სულ 132 კმ, დაახლოებით
    ორი საათი და ოცდაათი წუთი. ხეობის სიღრმეში, ბირკიანის ზემოთ, ასფალტი მთავრდება. საწვავი ახმეტაში აიღე.
    ეკონომ-კლასის მანქანა სოფლებამდე საკმარისია.
en:
  name: Pankisi Gorge
  short: The upper Alazani valley north of Akhmeta, home to the Chechen-speaking Kists for nearly two
    centuries.
  body: >-
    **Pankisi is the corner of Kakheti where a different language is spoken and a different table is laid.**
    The gorge begins north of Akhmeta and follows the upper Alazani for about thirty kilometres; the main
    villages are Duisi, Jokolo, Omalo, Birkiani and Tsinubani.


    Its people are the Kists, a Chechen-speaking community who crossed the mountains from the north Caucasus
    between the 1830s and the 1870s and settled here. Their language is a dialect of Chechen, their religion
    is Islam, and daily life carries traces of both sides of the range: Georgian place names, Chechen
    surnames, maize and cattle instead of the vineyards of the plain below.


    In the 2000s the gorge had a bad reputation — lawlessness first, then years of press attention over
    radicalisation. Today Pankisi is calm and safe, and local families have built a small tourism economy
    of their own. Visitors are treated well, though foreigners are still uncommon enough to be noticed.


    What people come for:


    - The **Sufi zikr**, a circular sung and moving prayer performed in Duisi by women, one of the very
    few places in the Caucasus where the practice survives in this form


    - **Family guesthouses and Kist cooking**, generous, meat-heavy and alcohol-free


    - **Horse and walking routes** up into the mountains towards Batsara and the Tusheti border ridges


    This is not a sight in the ordinary sense. There is no single monument to photograph. There is a valley,
    a set of villages, and people who live differently from the wine country twenty minutes down the road
    — and the interest lies entirely in that.


    One practical note on names. The village of Omalo in Pankisi is not the Omalo in Tusheti, and confusing
    the two has sent more than one traveller to the wrong side of a 2,850 m pass.
  tip: >-
    Staying overnight in a guesthouse is far better than a day trip; in one day you mostly see the road.
    These are Muslim villages, so do not bring wine or drink in public. Entering a mosque or attending
    a zikr requires permission and modest dress, shoulders and knees covered. Ask before photographing
    anyone, particularly women. For mountain routes a local guide is not optional. Carry ID, since the
    upper valley is close to the border zone.
  route: >-
    From Tbilisi drive over the Gombori Pass to Telavi (95 km), then west to Akhmeta, another 25 km. From
    Akhmeta head north about 12 km to Duisi on asphalt that narrows in the final kilometres. Total 132
    km, about two hours thirty. Beyond Birkiani, deeper into the gorge, the asphalt ends and a rough track
    continues. Fuel up in Akhmeta. An economy car is sufficient as far as the villages themselves.
ru:
  name: Панкисское ущелье
  short: Долина верхней Алазани севернее Ахметы, где почти два столетия живут чеченоязычные кисты.
  body: >-
    **Панкиси — тот угол Кахетии, где звучит другой язык и накрывают другой стол.** Ущелье начинается
    севернее Ахметы и тянется вдоль верхней Алазани примерно на тридцать километров; главные сёла — Дуиси,
    Джоколо, Омало, Биркиани и Цинубани.


    Живут здесь кисты, чеченоязычная община, перешедшая горы с Северного Кавказа между 1830-ми и 1870-ми
    годами и осевшая в долине. Их язык — диалект чеченского, религия — ислам, а быт хранит следы обеих
    сторон хребта: грузинские топонимы, чеченские фамилии, кукуруза и скот вместо виноградников равнины
    внизу.


    В 2000-х у ущелья была дурная слава: сначала безвластие, потом годы газетного внимания к теме радикализации.
    Сегодня Панкиси спокойно и безопасно, а местные семьи выстроили собственную небольшую экономику гостеприимства.
    К гостям относятся хорошо, хотя иностранец здесь всё ещё редкость и его замечают.


    Ради чего сюда едут:


    - **Суфийский зикр** — круговая молитва с пением и движением, которую в Дуиси совершают женщины; на
    Кавказе эта практика в таком виде сохранилась в считаных местах


    - **Семейные гостевые дома и кистинская кухня** — щедрая, мясная и безалкогольная


    - **Конные и пешие маршруты** в горы, к Бацаре и к хребтам на границе Тушети


    Это не достопримечательность в обычном смысле. Здесь нет одного памятника, ради которого едут. Есть
    долина, несколько сёл и люди, живущие иначе, чем винный край в двадцати минутах отсюда, — весь интерес
    именно в этом.
  tip: >-
    Ночёвка в гостевом доме даёт куда больше, чем однодневная поездка: за день вы увидите в основном дорогу.
    Сёла мусульманские — вино с собой не везите и на людях не пейте. Вход в мечеть и присутствие на зикре
    только с разрешения и в скромной одежде, с закрытыми плечами и коленями. Спрашивайте, прежде чем фотографировать
    людей, особенно женщин. Для горных маршрутов местный проводник обязателен. Держите при себе документ:
    верховье близко к пограничной зоне.
  route: >-
    Из Тбилиси через Гомборский перевал в Телави (95 км), затем на запад до Ахметы, ещё 25 км. От Ахметы
    на север около 12 км до Дуиси по асфальту, который в последних километрах сужается. Всего 132 км,
    порядка двух часов тридцати минут. Выше Биркиани, глубже в ущелье, асфальт заканчивается и идёт грунтовка.
    Заправляйтесь в Ахмете. До самих сёл машины эконом-класса достаточно.
fa:
  name: درّهٔ پانکیسی
  short: درّهٔ بالادست آلازانی در شمال آخمتا، خانهٔ کیست‌های چچنی‌زبان از نزدیک دو سده پیش.
  body: >-
    **پانکیسی آن گوشهٔ کاختی است که در آن زبانی دیگر شنیده می‌شود و سفره‌ای دیگر گسترده.** درّه از شمال
    آخمتا آغاز می‌شود و حدود سی کیلومتر در امتداد بالادست آلازانی پیش می‌رود؛ روستاهای اصلی دویسی، جوکولو،
    اومالو، بیرکیانی و تسینوبانی هستند.


    ساکنانش کیست‌ها هستند، جماعتی چچنی‌زبان که میان دههٔ 1830 و 1870 از قفقاز شمالی از کوه گذشتند و اینجا
    ماندگار شدند. زبانشان گویشی از چچنی است، دینشان اسلام، و زندگی روزمره‌شان نشان هر دو سوی رشته‌کوه
    را دارد: نام‌های گرجی مکان‌ها، نام‌های خانوادگی چچنی، ذرت و دام به‌جای تاکستان‌های دشت پایین.


    در دههٔ 2000 درّه بدنام بود؛ نخست بی‌قانونی و سپس سال‌ها توجه رسانه‌ها به موضوع افراط‌گرایی. امروز
    پانکیسی آرام و امن است و خانواده‌های محلی اقتصاد کوچکی از میهمان‌داری ساخته‌اند. با مهمان خوب رفتار
    می‌شود، هرچند خارجی هنوز آن‌قدر کمیاب است که به چشم بیاید.


    آنچه مردم برایش می‌آیند:


    - **ذکر صوفیانه**، دعایی حلقه‌وار با آواز و حرکت که در دویسی زنان آن را اجرا می‌کنند؛ از معدود جاهای
    قفقاز که این آیین به این شکل مانده است


    - **مهمان‌خانه‌های خانوادگی و آشپزی کیستی**، سخاوتمند، پرگوشت و بی‌الکل


    - **مسیرهای اسب‌سواری و پیاده‌روی** به سوی کوه‌ها، باتسارا و یال‌های مرزی توشتی


    این دیدنی به معنای معمول نیست. یادمان واحدی برای عکس گرفتن وجود ندارد. یک درّه هست، چند روستا و مردمانی
    که جور دیگری زندگی می‌کنند، متفاوت با سرزمین شراب که بیست دقیقه پایین‌تر است، و همهٔ جذابیت در همین
    است.
  tip: >-
    ماندن یک شب در مهمان‌خانه بسیار بهتر از سفر یک‌روزه است؛ در یک روز بیشتر جاده را می‌بینید. اینها روستاهای
    مسلمان‌اند، پس شراب همراه نبرید و در ملأ ننوشید. ورود به مسجد یا حضور در ذکر مجوز و پوشش محجوب می‌خواهد،
    با شانه و زانوی پوشیده. پیش از عکس گرفتن از کسی بپرسید، به‌ویژه از زنان. برای مسیرهای کوهستانی راهنمای
    محلی اختیاری نیست. کارت شناسایی همراه داشته باشید، چون بالادست درّه به منطقهٔ مرزی نزدیک است.
  route: >-
    از تفلیس از گردنهٔ گومبوری تا تلاوی (95 کیلومتر) برانید، سپس به غرب تا آخمتا، 25 کیلومتر دیگر. از
    آخمتا حدود 12 کیلومتر به شمال تا دویسی، روی آسفالتی که در کیلومترهای پایانی باریک می‌شود. جمعاً 132
    کیلومتر و حدود دو ساعت و سی دقیقه. بالاتر از بیرکیانی و در عمق درّه، آسفالت تمام می‌شود و راهی خاکی
    ادامه می‌یابد. باک را در آخمتا پر کنید. خودروی اقتصادی تا خود روستاها کافی است.
he:
  name: ערוץ פנקיסי
  short: עמק האלאזני העליון מצפון לאחמטה, ביתם של הקיסטים דוברי הצ'צ'נית כמעט מאתיים שנה.
  body: >-
    **פנקיסי היא הפינה של קחתי שבה מדברים שפה אחרת ועורכים שולחן אחר.** הערוץ מתחיל מצפון לאחמטה ונמשך
    לאורך האלאזני העליון כשלושים קילומטרים; הכפרים המרכזיים הם דואיסי, ג'וקולו, אומאלו, בירקיאני וצינובאני.


    תושביו הם הקיסטים, קהילה דוברת צ'צ'נית שחצתה את ההרים מצפון הקווקז בין שנות השלושים לשנות השבעים של
    המאה ה-19 והתיישבה כאן. שפתם ניב של צ'צ'נית, דתם אסלאם, וחיי היומיום נושאים סימנים משני עברי הרכס:
    שמות מקומות גאורגיים, שמות משפחה צ'צ'ניים, תירס ובקר במקום הכרמים של המישור למטה.


    בשנות האלפיים היה לערוץ שם רע: תחילה היעדר שלטון, אחר כך שנים של תשומת לב עיתונאית לנושא הרדיקליזציה.
    היום פנקיסי שקט ובטוח, ומשפחות מקומיות בנו כלכלת אירוח קטנה משלהן. אל האורחים מתייחסים יפה, אם כי
    זר עדיין נדיר דיו כדי שישימו לב אליו.


    בשביל מה באים לכאן:


    - **הזִכְּר הסופי**, תפילה מעגלית בשירה ובתנועה שנשים מבצעות בדואיסי, אחד המקומות הבודדים בקווקז שבהם
    המנהג שרד בצורה הזו


    - **בתי הארחה משפחתיים ובישול קיסטי**, נדיב, עתיר בשר ונטול אלכוהול


    - **מסלולי רכיבה והליכה** אל ההרים לכיוון בצארה ורכסי הגבול של טושתי


    זהו אינו אתר במובן הרגיל. אין כאן מונומנט אחד שמצלמים. יש עמק, כמה כפרים ואנשים שחיים אחרת מארץ היין
    שעשרים דקות משם, וכל העניין נמצא בדיוק בזה.
  tip: >-
    לינה בבית הארחה עדיפה בהרבה על טיול יום; ביום אחד רואים בעיקר את הכביש. אלה כפרים מוסלמיים, לכן אל
    תביאו יין ואל תשתו בפרהסיה. כניסה למסגד או נוכחות בזִכְּר מחייבות רשות ולבוש צנוע, כתפיים וברכיים
    מכוסות. שאלו לפני שאתם מצלמים מישהו, ובמיוחד נשים. למסלולי ההרים מדריך מקומי אינו בגדר בחירה. שאו
    תעודה מזהה, שכן מעלה העמק סמוך לאזור הגבול.
  route: >-
    מטביליסי סעו מעל מעבר גומבורי לטלאווי (95 ק״מ), ואז מערבה לאחמטה, עוד 25 ק״מ. מאחמטה צפונה כ-12 ק״מ
    עד דואיסי בכביש סלול שמצטמצם בקילומטרים האחרונים. בסך הכול 132 ק״מ, כשעתיים ושלושים. מעל בירקיאני,
    עמוק יותר בערוץ, האספלט נגמר ודרך עפר ממשיכה. תדלקו באחמטה. רכב חסכוני מספיק עד הכפרים עצמם.
ar:
  name: وادي بانكيسي
  short: وادي ألازاني الأعلى شمال أخميتا، موطن الكيست الناطقين بالشيشانية منذ قرابة قرنين.
  body: >-
    **بانكيسي هو ركن كاخيتي الذي تُسمع فيه لغة أخرى وتُمدّ فيه مائدة أخرى.** يبدأ الوادي شمال أخميتا ويتبع
    أعالي ألازاني نحو ثلاثين كيلومتراً؛ وقراه الرئيسية دويسي وجوكولو وأومالو وبيركياني وتسينوباني.


    وأهله هم الكيست، جماعة ناطقة بالشيشانية عبرت الجبال من شمال القوقاز بين ثلاثينيات وسبعينيات القرن
    التاسع عشر واستقرت هنا. لغتهم لهجة من الشيشانية، ودينهم الإسلام، وحياتهم اليومية تحمل أثر جانبي السلسلة
    معاً: أسماء أماكن جورجية وألقاب شيشانية، وذرة وماشية بدل كروم السهل في الأسفل.


    وفي العقد الأول من هذا القرن ساءت سمعة الوادي؛ فوضى أولاً، ثم سنوات من اهتمام الصحافة بموضوع التطرف.
    أما اليوم فبانكيسي هادئ وآمن، وقد بنت الأسر المحلية اقتصاد ضيافة صغيراً خاصاً بها. ويُعامل الزائر
    معاملة حسنة، وإن كان الأجنبي ما زال نادراً بما يلفت النظر.


    وما يأتي الناس من أجله:


    - **الذكر الصوفي**، صلاة دائرية بالإنشاد والحركة تؤديها النساء في دويسي، وهو من المواضع القليلة جداً
    في القوقاز التي بقي فيها هذا التقليد بهذه الصورة


    - **بيوت الضيافة العائلية والمطبخ الكيستي**، كريم وغني باللحم وخالٍ من الكحول


    - **مسارات الخيل والمشي** صعوداً نحو الجبال باتجاه باتسارا وحيود الحدود مع توشيتي


    وليس هذا معلماً بالمعنى المعتاد. فلا أثر واحد يُصوَّر. هناك وادٍ وقرى وناس يعيشون على نحو مختلف عن
    بلاد الخمر التي تبعد عشرين دقيقة، والفائدة كلها في ذلك بالضبط.
  tip: >-
    المبيت في بيت ضيافة أفضل بكثير من زيارة يوم واحد؛ ففي يوم واحد سترى الطريق أساساً. وهذه قرى مسلمة،
    فلا تحمل خمراً ولا تشرب علناً. ودخول المسجد أو حضور الذكر يتطلب إذناً ولباساً محتشماً يستر الكتفين
    والركبتين. واسأل قبل تصوير أي شخص، وخاصة النساء. ولمسارات الجبل، المرشد المحلي ليس خياراً. واحمل بطاقة
    هوية، فأعالي الوادي قريبة من المنطقة الحدودية.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي (95 كم)، ثم غرباً إلى أخميتا، 25 كم أخرى. ومن أخميتا شمالاً
    نحو 12 كم إلى دويسي على إسفلت يضيق في كيلومتراته الأخيرة. المجموع 132 كم ونحو ساعتين ونصف. وفوق بيركياني،
    في عمق الوادي، ينتهي الإسفلت ويتابع مسلك ترابي. زوّد الوقود في أخميتا. وسيارة اقتصادية تكفي حتى القرى
    نفسها.
