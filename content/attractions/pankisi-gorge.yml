ka:
  name: პანკისის ხეობა
  short: >-
    ალაზნის ზემო წელი ახმეტის ჩრდილოეთით, სადაც ჩეჩნურენოვანი ქისტები თითქმის ორი საუკუნეა ცხოვრობენ:
    მეჩეთები, ტყიანი ფერდობები და ღია კარი.
  body: >-
    **ახმეტის ვენახებიდან ნახევარ საათში, ჩრდილოეთით, აგურის მინარეთიდან აზანი ისმის: ეს პანკისია, ქისტების
    ხეობა.**


    ხეობა ალაზნის ზემო დინებას დაახლოებით 34 კილომეტრზე მიუყვება — ბორბალოს მთიდან ალაზნის ვაკემდე. მისი
    მთავარი სოფლები — დუისი, ჯოყოლო, ომალო, ბირკიანი — ქისტებისაა: საქართველოს ჩეჩნებისა, რომლებიც ლაპარაკობენ
    როგორც ქართულად, ისე ჩეჩნური ენის ქისტურ დიალექტზე. მათი წინაპრები XIX საუკუნეში მთების იქიდან გადმოვიდნენ,
    უმეტესად 1830-იანიდან 1870-იან წლებამდე. გადმოცემით, დუისს სახელი პირველი მოსახლის, დუის, სახელიდან
    დაერქვა, რომელიც აქ დაახლოებით 1826 წელს დასახლდა; ჩეჩნურად სოფელს დღემდე დუი-იურტი ჰქვია. ჯოყოლო
    1835 წელს მაისტიდან გადმოსულმა 54-მა ოჯახმა დააარსა.


    ქისტი ეთნოგრაფი მათე ალბუთაშვილი სახელ „პანკისს“ „პანტას“ — გარეულ კავკასიურ მსხალს — უკავშირებდა;
    ფერდობებს დღესაც ფართოფოთლოვანი ტყე ფარავს. ქისტების უმრავლესობა სუნიტი მუსლიმია, რომელთა რწმენაშიც
    ძველი მთური წესები ცოცხლობს; ბირკიანში კი ქრისტიანები ჭარბობენ და ალავერდობაზე დღესაც დადიან. პანკისელი
    ქალები სუფიურ ზიქრს — წრიულ, სიმღერით აღსრულებულ ლოცვას — ინახავენ.


    ახლო წარსულს აქ არავინ მალავს. 2000–2002 წლებში ხეობაში ჩეჩენი მეთაურის, რუსლან გელაევის, შეიარაღებული
    რაზმი იდგა, მოგვიანებით კი აქ გაზრდილი თარხან ბათირაშვილი „ისლამური სახელმწიფოს“ ერთ-ერთ სარდლად იქცა
    და 2016 წელს ერაყში მოკლეს. ეს ჩრდილი ხეობას წლების განმავლობაში სდევდა; დღეს პანკისი მშვიდია და საოჯახო
    სასტუმროებით, ცხენებითა და სახლის სამზარეულოთი ცხოვრობს.


    დუისში ნახეთ ძველი აგურის მეჩეთი — XX საუკუნის მიჯნაზე აგებული, საბჭოთა ხელისუფლების მიერ დახურული
    და 1960 წელს ხელახლა გახსნილი. ახლომახლო, სოფელ მატანში, დაიბადა ანტისაბჭოთა პარტიზანული მოძრაობის
    მეთაური ქაქუცა ჩოლოყაშვილი.


    პანკისში მოსანიშნი ერთი ძეგლი არ არის. აქ ის გელით, რასაც ფოტოზე ვერ დაიჭერთ: სუფრა, ენა და მასპინძელი,
    რომელიც კიდევ ერთი ღამით დარჩენას გთხოვთ.
  tip: >-
    ღამე საოჯახო სასტუმროში გაათიეთ: ერთდღიან ვიზიტზე მხოლოდ გზას ნახავთ, ხეობის არსი კი საღამოს სუფრასთან
    იხსნება. ეს მუსლიმური სოფლებია — საჯაროდ ალკოჰოლს ნუ დალევთ, ჩაიცვით თავშეკავებულად (მხრები და მუხლები
    დაფარული) და მეჩეთში შესვლამდე ნებართვა ითხოვეთ. ადამიანების, განსაკუთრებით ქალების, გადაღებამდე ყოველთვის
    იკითხეთ. მთაში ფეხით ან ცხენით წასასვლელად ადგილობრივი გამყოლი მასპინძლების მეშვეობით აიყვანეთ. სახელებსაც
    მიაქციეთ ყურადღება: აქაური ომალო თუშეთის ომალო არ არის — ის 2826-მეტრიანი აბანოს უღელტეხილის იქითაა.
  route: >-
    თბილისიდან გომბორის უღელტეხილით (შ38) თელავამდე იარეთ, შემდეგ დასავლეთით, ახმეტამდე, სადაც ავზი შეავსეთ.
    ახმეტიდან გზა ალაზანს ჩრდილოეთით მიუყვება და დაახლოებით 17 კილომეტრში დუისამდე მიდის; ასფალტი ხეობის
    შევიწროებასთან ერთად ვიწროვდება. სულ დაახლოებით 130 კილომეტრი და ორნახევარი საათი. ბირკიანის იქით,
    ხეობის სიღრმეში, ასფალტი მთავრდება და უსწორმასწორო გრუნტი იწყება. სოფლებისთვის ეკონომ კლასი სავსებით
    საკმარისია; უფრო გამძლე მანქანა მხოლოდ მაშინ დაგჭირდებათ, თუ ხეობის ზემოთ აპირებთ ასვლას.
en:
  name: Pankisi Gorge
  short: >-
    The upper Alazani valley north of Akhmeta, home for nearly two centuries to the Chechen-speaking Kists:
    brick mosques, wooded slopes, open doors.
  body: >-
    **Half an hour north of Akhmeta's vineyards, the call to prayer drifts from a brick minaret: this
    is Pankisi, the valley of the Kists.**


    The gorge follows the upper Alazani for about 34 km, from Mount Borbalo to the Alazani plain. Its
    main villages, Duisi, Jokolo, Omalo and Birkiani, belong to the Kists, the Chechens of Georgia, bilingual
    in Georgian and their Kist dialect of Chechen. They crossed the mountains in the 19th century, mostly
    between the 1830s and the 1870s. Tradition says Duisi takes its name from its first settler, Dui,
    who arrived around 1826; in Chechen it is still Dui-Yurt. Jokolo was founded in 1835 by 54 families
    from Maista.


    The Kist ethnographer Mate Albutashvili traced the name Pankisi to panta, the wild Caucasian pear,
    and broadleaf forest still cloaks the slopes. Most Kists are Sunni Muslims whose faith keeps older
    highland customs; Birkiani has a Christian majority whose people still go to the Alaverdoba festival.
    The women of Pankisi keep alive a Sufi zikr, a circling, chanted prayer.


    Nobody here hides the recent past. From 2000 to 2002 the Chechen commander Ruslan Gelayev kept an
    armed force here, and later Tarkhan Batirashvili, who grew up in the valley, rose to command in the
    Islamic State before he was killed in Iraq in 2016. The shadow lingered for years; today the valley
    is quiet and lives on family guesthouses, horses and home cooking.


    In Duisi, look for the old brick mosque, built at the turn of the 20th century, closed under Soviet
    rule and reopened in 1960. The anti-Soviet guerrilla leader Kakutsa Cholokashvili was born nearby,
    in Matani.


    Pankisi has no single monument to tick off. What it offers is harder to photograph: a table, a language,
    and hosts who will ask you to stay another night.
  tip: >-
    Stay the night in a family guesthouse: a day trip shows you mostly the road, and the valley reveals
    itself at the evening table. These are Muslim villages, so do not drink alcohol in public, dress modestly
    (shoulders and knees covered) and ask before entering a mosque. Always ask before photographing people,
    especially women. For walks or rides up into the mountains, hire a local guide through your hosts.
    And mind the names: this Omalo is not the Omalo of Tusheti, which lies on the far side of the 2,826
    m Abano Pass.
  route: >-
    From Tbilisi cross the Gombori Pass (Sh38) to Telavi, then head west to Akhmeta and fill the tank
    there. From Akhmeta a road runs north up the Alazani for about 17 km to Duisi, on asphalt that narrows
    as the valley closes in. That makes some 130 km and about two and a half hours. Beyond Birkiani, deeper
    in the gorge, the asphalt ends and a rough track takes over. An economy car is perfectly adequate
    for the villages; you need something tougher only if you mean to push on up the valley.
ru:
  name: Панкисское ущелье
  short: >-
    Верхняя долина Алазани севернее Ахметы, почти два века служащая домом чеченоязычным кистинцам: кирпичные
    мечети, лесистые склоны, открытые двери.
  body: >-
    **В получасе езды к северу от ахметских виноградников доносится азан с кирпичного минарета: это Панкиси,
    долина кистинцев.**


    Ущелье тянется вдоль верхней Алазани около 34 км, от горы Борбало до Алазанской равнины. Его главные
    сёла — Дуиси, Джоколо, Омало и Биркиани — принадлежат кистинцам, грузинским чеченцам, говорящим и
    по-грузински, и на кистинском диалекте чеченского. Они перешли через горы в XIX веке, в основном между
    1830-ми и 1870-ми годами. Предание говорит, что Дуиси получило имя от своего первого поселенца, Дуи,
    пришедшего около 1826 года; по-чеченски село до сих пор Дуи-Юрт. Джоколо основали в 1835 году 54 семьи
    из Майсты.


    Кистинский этнограф Мате Албуташвили выводил название Панкиси от «панта» — дикой кавказской груши,
    и широколиственный лес до сих пор покрывает склоны. Большинство кистинцев — мусульмане-сунниты, чья
    вера сохраняет более древние горные обычаи; в Биркиани большинство — христиане, и они по-прежнему
    ходят на праздник Алавердоба. Женщины Панкиси хранят суфийский зикр — молитву-распев, которую совершают,
    двигаясь по кругу.


    Здесь никто не скрывает недавнее прошлое. С 2000 по 2002 год чеченский командир Руслан Гелаев держал
    здесь вооружённый отряд, а позже Тархан Батирашвили, выросший в этой долине, стал одним из командиров
    «Исламского государства» и был убит в Ираке в 2016 году. Эта тень лежала на ущелье годами; сегодня
    долина спокойна и живёт семейными гостевыми домами, лошадьми и домашней кухней.


    В Дуиси стоит найти старую кирпичную мечеть, построенную на рубеже XX века, закрытую при советской
    власти и вновь открытую в 1960 году. Неподалёку, в Матани, родился лидер антисоветского партизанского
    движения Какуца Чолокашвили.


    У Панкиси нет одного памятника для галочки. То, что оно предлагает, труднее сфотографировать: застолье,
    язык и хозяева, которые попросят вас остаться ещё на ночь.
  tip: >-
    Останьтесь на ночь в семейном гостевом доме: однодневная поездка показывает в основном дорогу, а долина
    раскрывается за вечерним столом. Это мусульманские сёла, поэтому не пейте алкоголь на публике, одевайтесь
    скромно (плечи и колени закрыты) и спрашивайте разрешения перед входом в мечеть. Всегда спрашивайте
    разрешения перед тем, как фотографировать людей, особенно женщин. Для прогулок или поездок верхом
    в горы найдите местного гида через хозяев. И не путайте названия: здешнее Омало — не тушетское Омало,
    которое лежит по другую сторону перевала Абано (2826 м).
  route: >-
    Из Тбилиси через Гомборский перевал (Ш38) до Телави, затем на запад до Ахметы, где заправьтесь. От
    Ахметы дорога ведёт на север вдоль Алазани около 17 км до Дуиси, по асфальту, который сужается по
    мере того, как долина смыкается. Всего около 130 км, примерно два с половиной часа. За Биркиани, глубже
    в ущелье, асфальт кончается, и начинается разбитая грунтовка. Обычной легковой машины вполне достаточно
    для сёл; более крепкая нужна, только если вы собираетесь ехать дальше вглубь долины.
fa:
  name: دره‌ی پانکیسی
  short: >-
    دره‌ی بالادست آلازانی در شمال آخمِتا، نزدیک به دو سده خانه‌ی کیست‌های چچنی‌زبان: مسجدهای آجری، دامنه‌های
    جنگلی، درهای گشوده.
  body: >-
    **نیم‌ساعت شمال تاکستان‌های آخمِتا، اذان از مناره‌ای آجری برمی‌خیزد: این پانکیسی است، دره‌ی کیست‌ها.**


    این دره در امتداد بخش بالایی رود آلازانی، به درازای حدود ۳۴ کیلومتر، از کوه بوربالو تا دشت آلازانی
    کشیده شده است. روستاهای اصلی آن، دویسی، جوکولو، اومالو و بیرکیانی، به کیست‌ها تعلق دارند، چچن‌های
    گرجستان، که هم به گرجی سخن می‌گویند و هم به گویش کیستیِ زبان چچنی. آنها در سده‌ی نوزدهم، بیشتر میان
    دهه‌های ۱۸۳۰ و ۱۸۷۰، از کوه‌ها گذشتند. روایت می‌گوید دویسی نام خود را از نخستین ساکنش، دویی، گرفته
    که حدود سال ۱۸۲۶ به آنجا رسید؛ به چچنی هنوز دویی-یورت خوانده می‌شود. جوکولو را در سال ۱۸۳۵ پنجاه‌وچهار
    خانواده از مایستا بنیاد نهادند.


    قوم‌نگار کیست، ماته آلبوتاشویلی، نام پانکیسی را از «پانتا»، گلابی وحشی قفقاز، ریشه‌یابی کرد، و جنگل
    پهن‌برگ هنوز دامنه‌ها را می‌پوشاند. بیشتر کیست‌ها مسلمانان سنی‌اند که ایمانشان آداب کهن‌تر کوهستانی
    را زنده نگه می‌دارد؛ در بیرکیانی اکثریتی مسیحی زندگی می‌کنند که هنوز به جشن آلاوردوبا می‌روند. زنان
    پانکیسی ذکر صوفیانه‌ای را، نیایشی آوازین که در حلقه‌ای چرخان به جا آورده می‌شود، زنده نگه داشته‌اند.


    هیچ‌کس در اینجا گذشته‌ی نزدیک را پنهان نمی‌کند. از سال ۲۰۰۰ تا ۲۰۰۲ فرمانده چچنی، روسلان گلایف، نیرویی
    مسلح در اینجا داشت، و بعدها ترخان باتیراشویلی، که در همین دره بزرگ شد، به یکی از فرماندهان داعش بدل
    شد، پیش از آنکه در سال ۲۰۱۶ در عراق کشته شود. سایه‌ی آن سال‌ها تا مدت‌ها بر دره ماند؛ امروز دره آرام
    است و از مهمان‌خانه‌های خانوادگی، اسب‌ها و آشپزی خانگی می‌گذراند.


    در دویسی، سراغ مسجد آجری کهن را بگیرید، که در آغاز سده‌ی بیستم ساخته شد، در دوران شوروی بسته شد و
    در سال ۱۹۶۰ دوباره گشوده شد. رهبر چریکی ضدشوروی، کاکوتسا چولوکاشویلی، نزدیک همان‌جا، در ماتانی، زاده
    شد.


    پانکیسی یادمان واحدی برای دیدن ندارد. آنچه ارائه می‌دهد سخت‌تر به عکس درمی‌آید: سفره‌ای، زبانی، و
    میزبانانی که از شما می‌خواهند شبی دیگر بمانید.
  tip: >-
    شب را در مهمان‌خانه‌ای خانوادگی بمانید: سفر یک‌روزه بیشتر جاده را نشان می‌دهد، و دره خود را بر سفره‌ی
    شامگاهی می‌گشاید. اینها روستاهایی مسلمان‌اند، پس در جمع مشروب نخورید، لباس پوشیده بپوشید (شانه و زانو
    پوشیده) و پیش از ورود به مسجد اجازه بگیرید. همیشه پیش از عکس‌گرفتن از افراد، به‌ویژه زنان، اجازه بخواهید.
    برای پیاده‌روی یا اسب‌سواری به سوی کوه‌ها، از میزبانان خود راهنمای محلی بخواهید. و به نام‌ها دقت کنید:
    این اومالو همان اومالوی توشتی نیست، که آن‌سوی گذرگاه آبانو (۲٬۸۲۶ متر) قرار دارد.
  route: >-
    از تفلیس از گذرگاه گومبوری (Sh38) به تلاوی بروید، سپس به سوی غرب تا آخمِتا، و باک را همان‌جا پر کنید.
    از آخمِتا جاده‌ای به سوی شمال، در طول آلازانی، حدود ۱۷ کیلومتر تا دویسی می‌رود، بر آسفالتی که هرچه
    دره تنگ‌تر می‌شود، باریک‌تر می‌گردد. در مجموع نزدیک به ۱۳۰ کیلومتر و حدود دو ساعت و نیم راه است. پس
    از بیرکیانی، عمیق‌تر در دره، آسفالت به پایان می‌رسد و راهی خاکی و ناهموار جای آن را می‌گیرد. خودرویی
    معمولی برای روستاها کاملاً کافی است؛ تنها اگر بخواهید عمیق‌تر در دره پیش بروید، به خودرویی مقاوم‌تر
    نیاز دارید.
he:
  name: גיא פנקיסי
  short: >-
    עמק האלאזני העילי מצפון לאחמטה, בית כמעט מאתיים שנה לקיסטים דוברי הצ'צ'נית: מסגדי לבנים, מדרונות מיוערים,
    דלתות פתוחות.
  body: >-
    **חצי שעה מצפון לכרמי אחמטה, קריאת התפילה נסחפת ממינרט לבנים: זהו פנקיסי, עמק הקיסטים.**


    הגיא מלווה את האלאזני העילי לאורך כ-34 ק"מ, מהר בורבלו עד למישור האלאזני. כפריו הראשיים, דואיסי, ג'וקולו,
    אומאלו וברקיאני, שייכים לקיסטים, הצ'צ'נים של גאורגיה, הדוברים גאורגית וגם את הניב הקיסטי של הצ'צ'נית.
    הם חצו את ההרים במאה ה-19, בעיקר בין שנות ה-1830 לשנות ה-1870. המסורת מספרת שדואיסי קיבל את שמו ממתיישבו
    הראשון, דוי, שהגיע בסביבות 1826; בצ'צ'נית הוא עדיין דוי-יורט. ג'וקולו נוסד ב-1835 בידי 54 משפחות ממייסטה.


    האתנוגרף הקיסטי מטה אלבוטשווילי ייחס את השם פנקיסי ל"פנטה", האגס הקווקזי הבר, ויער עלים רחבים עדיין
    מכסה את המדרונות. רוב הקיסטים הם מוסלמים סונים, שאמונתם משמרת מנהגים הרריים עתיקים יותר; בברקיאני
    יש רוב נוצרי שאנשיו עדיין הולכים לחג אלוורדובה. נשות פנקיסי שומרות על טקס הזיכר הסופי, תפילה מושרת
    הנעשית בתנועה במעגל.


    אף אחד כאן לא מסתיר את העבר הקרוב. בין 2000 ל-2002 החזיק כאן המפקד הצ'צ'ני רוסלן גלייב כוח חמוש, ומאוחר
    יותר טרחאן בטירשווילי, שגדל בעמק, הגיע לדרגת מפקד בדאעש לפני שנהרג בעיראק ב-2016. הצל הזה ריחף מעל
    העמק שנים; כיום העמק שקט וחי מבתי הארחה משפחתיים, סוסים ובישול בית.


    בדואיסי, חפשו את המסגד הישן מלבנים, שנבנה בתחילת המאה ה-20, נסגר בתקופה הסובייטית ונפתח מחדש ב-1960.
    מנהיג הגרילה האנטי-סובייטית קאקוצה צ'ולוקשווילי נולד לא רחוק משם, במטני.


    לפנקיסי אין אתר אחד שאפשר לסמן ברשימה. מה שהוא מציע קשה יותר לצילום: שולחן, שפה, ומארחים שיבקשו מכם
    להישאר עוד לילה.
  tip: >-
    לינו בבית הארחה משפחתי: טיול יום מראה בעיקר את הדרך, והעמק נפתח בפניכם ליד שולחן הערב. אלה כפרים מוסלמיים,
    כך שאין לשתות אלכוהול בפומבי, יש להתלבש בצניעות (כתפיים וברכיים מכוסות) ולשאול רשות לפני כניסה למסגד.
    יש לשאול תמיד רשות לפני צילום אנשים, ובייחוד נשים. לטיולים או רכיבה להרים, שכרו מדריך מקומי דרך המארחים
    שלכם. ושימו לב לשמות: האומאלו הזה אינו האומאלו של תושטי, שנמצא בצדו האחר של מעבר אבאנו (2,826 מטרים).
  route: >-
    מטביליסי חצו את מעבר גומבורי (Sh38) לטלאווי, ואז פנו מערבה לאחמטה ותדלקו שם. מאחמטה דרך מובילה צפונה
    לאורך האלאזני כ-17 ק"מ לדואיסי, על כביש אספלט שהולך וצר ככל שהעמק נסגר. בסך הכול כ-130 ק"מ וכשעתיים
    וחצי. מעבר לברקיאני, עמוק יותר בגיא, האספלט מסתיים ודרך עפר משובשת תופסת את מקומו. רכב רגיל מספיק
    בהחלט לכפרים; רק אם בכוונתכם להמשיך עמוק יותר בעמק תזדקקו לרכב חזק יותר.
ar:
  name: وادي بانكيسي
  short: >-
    وادي ألازاني الأعلى شمال أخميتا، موطن الكيست الناطقين بالشيشانية منذ نحو قرنين: مساجد من الطوب، منحدرات
    مشجّرة، أبواب مفتوحة.
  body: >-
    **على بعد نصف ساعة شمال كروم أخميتا، ينساب صوت الأذان من منارة من الطوب: هذا بانكيسي، وادي الكيست.**


    يمتد الوادي على طول أعالي نهر ألازاني نحو 34 كم، من جبل بوربالو إلى سهل ألازاني. وتنتمي قراه الرئيسية،
    دويسي وجوكولو وأومالو وبيركياني، إلى الكيست، شيشان جورجيا، الذين يتكلمون الجورجية ولهجتهم الكيستية
    من الشيشانية معًا. عبروا الجبال في القرن التاسع عشر، وكان معظم ذلك بين ثلاثينيات القرن التاسع عشر
    وسبعينياته. وتقول الرواية إن دويسي أخذت اسمها من أول من استقر فيها، دوي، الذي وصل نحو عام 1826؛ ولا
    تزال تُعرف بالشيشانية بدوي-يورت. وأسّس جوكولو عام 1835 أربع وخمسون عائلة من مايستا.


    وقد أرجع الإثنوغرافي الكيستي ماتِه ألبوتاشفيلي اسم بانكيسي إلى "بانتا"، الكمّثرى القوقازية البرية،
    وما تزال غابة عريضة الأوراق تكسو المنحدرات. ومعظم الكيست مسلمون سنّة يحفظ إيمانهم عادات جبلية أقدم؛
    وفي بيركياني أغلبية مسيحية لا يزال أهلها يحضرون عيد ألافردوبا. وتحافظ نساء بانكيسي على ذِكرٍ صوفي
    حيّ: صلاةٍ مرتَّلة تُؤدّى في حلقة دائرية.


    لا أحد هنا يُخفي الماضي القريب. فمن عام 2000 إلى 2002 رابطت هنا قوة مسلحة للقائد الشيشاني روسلان غيلاييف،
    ثم ارتقى طرخان باتيراشفيلي، الذي نشأ في الوادي، إلى مرتبة قائد في تنظيم "الدولة الإسلامية" قبل أن
    يُقتل في العراق عام 2016. وظل ذلك الظل مخيّمًا على الوادي سنوات؛ أما اليوم فالوادي هادئ ويعيش على
    بيوت الضيافة العائلية والخيول والطبخ المنزلي.


    وفي دويسي، ابحث عن المسجد القديم من الطوب، الذي بُني في مطلع القرن العشرين، وأُغلق في العهد السوفيتي،
    وأُعيد افتتاحه عام 1960. وقد وُلد قائد حرب العصابات المعادية للسوفييت، كاكوتسا تشولوكاشفيلي، قريبًا
    من هناك، في ماتاني.


    ولا يملك بانكيسي معلمًا واحدًا يُشطَب من قائمة الزيارة. فما يقدّمه أصعب أن يُصوَّر: مائدة، ولغة، ومضيّفون
    سيطلبون منك المكوث ليلة أخرى.
  tip: >-
    اقضِ الليلة في بيت ضيافة عائلي: فالرحلة النهارية تُظهر الطريق أساسًا، والوادي يكشف عن نفسه على مائدة
    المساء. هذه قرى مسلمة، فلا تشرب الكحول علنًا، وارتدِ لباسًا محتشمًا (الأكتاف والركب مغطاة)، واستأذن
    قبل دخول أي مسجد. واستأذن دائمًا قبل تصوير الناس، خصوصًا النساء. وللمشي أو ركوب الخيل صعودًا إلى الجبال،
    استأجر مرشدًا محليًا عبر مضيّفيك. وانتبه للأسماء: أومالو هذه ليست أومالو توشيتي، التي تقع على الجانب
    الآخر من ممر أبانو (2,826 مترًا).
  route: >-
    من تبليسي، اعبر ممر غومبوري (Sh38) إلى تيلافي، ثم توجه غربًا إلى أخميتا وعبّئ الوقود هناك. ومن أخميتا
    يمتد طريق شمالًا بمحاذاة ألازاني نحو 17 كم إلى دويسي، على إسفلت يضيق كلما ضاق الوادي. فتبلغ المسافة
    الإجمالية نحو 130 كم، أي ساعتين ونصفًا تقريبًا. وبعد بيركياني، أعمق في الوادي، ينتهي الإسفلت ويحل
    محله درب ترابي وعر. تكفي سيارة اقتصادية تمامًا للقرى؛ ولا تحتاج سيارة أقوى إلا إذا نويت التوغل أعمق
    في الوادي.
