ka:
  name: მანავის ციხე
  short: კახეთის მეფეთა ნანგრევი ციხე ივრის პლატოს თავზე, სოფელ მანავის ზემოთ, ვენახებით გარშემორტყმული.
  body: >-
    **მანავის ციხე ის ადგილია, სადაც კახეთის ისტორია ვენახებს ხვდება.** ის სოფელ მანავის ზემოთ, ცალკე
    მდგარ გორაზეა; ასვლას ოციოდე წუთი სჭირდება და ზემოდან ივრის პლატო შორ მანძილზე იშლება.


    ციხე ადრეც არსებობდა, მაგრამ დღევანდელი კედლები ძირითადად XVII-XVIII საუკუნეებისაა. ეს კახეთის მეფეთა
    ერთ-ერთი რეზიდენცია და თავშესაფარი იყო — იმ პერიოდში, როცა ბარის ქალაქები სპარსული ლაშქრობებისა და
    ლეკიანობის გამო აღარ იყო უსაფრთხო. ერეკლე II-ის დროსაც აქტიური იყო; XIX საუკუნისთვის დაცლილი და ნანგრევი.


    დღეს დგას:


    - **გარე კედლის დიდი ნაწილი** მრგვალი და ოთხკუთხა კოშკებით


    - **ცისტერნები** — წყლის შესანახი აუზები, ალყისთვის აუცილებელი


    - **პატარა ეკლესიის ნაშთი** ეზოს შუაგულში


    ეს არ არის აღდგენილი, დალაგებული ძეგლი. ბალახი მუხლამდეა, ქვები დაცემულია, ნიშნები თითქმის არ არის.
    სწორედ ეს არის მისი ღირსება: აქ ჩვეულებრივ არავინაა და ციხე ისეთია, როგორიც მიატოვეს.


    სოფელი მანავი თავისთავად ცნობილია ღვინით — „მანავის მწვანე" ერთ-ერთი კარგი ქართული თეთრი ჯიშია და
    მის სახელს სწორედ აქედან იღებს. ბევრ ეზოში მარანია და ზოგი მასპინძელი სიამოვნებით გაჩვენებთ ქვევრებს,
    თუ იკითხავთ.
  tip: >-
    ერთი საათი ასვლა-ჩამოსვლისთვის და ეზოსთვის საკმარისია. ბილიკი მიწისაა და წვიმის შემდეგ სრიალებს; მაისიდან
    ოქტომბრამდე ბალახი მაღალია, ამიტომ გრძელი შარვალი და დახურული ფეხსაცმელი ეცვი — გველიც გვხვდება. ჩრდილი
    მხოლოდ კედლების ძირშია. შესვლა უფასოა, ჯიხურები, ტუალეტი და მაღაზია არ არის; უახლოესი სოფელშია. ღვინის
    დაგემოვნებას თუ გეგმავ, მძღოლი წინასწარ შეათანხმე.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით საგარეჯოსკენ, შემდეგ ბადიაურთან ჩრდილო-აღმოსავლეთით მოუხვიე მანავის
    მიმართულებით. სულ 70 კმ, დაახლოებით საათი და ოცდახუთი წუთი. მთავარი გზა კარგი ასფალტია; ბოლო ათი კილომეტრი
    ვიწრო, ადგილ-ადგილ დაზიანებული სასოფლო გზაა, მაგრამ ჩვეულებრივი მანქანა უპრობლემოდ გაივლის. ციხის
    ძირში მოასფალტებული მოედანი არ არის — გააჩერე სოფლის ბოლოს და ფეხით აუყევი. საწვავი საგარეჯოში.
en:
  name: Manavi Fortress
  short: >-
    The ruined stronghold of the Kakhetian kings above Manavi village, looking out over the Iori plateau
    and its vineyards.
  body: >-
    **Manavi is where Kakhetian history meets Kakhetian wine.** The fortress sits on a free-standing hill
    above the village of the same name; the walk up takes about twenty minutes and from the top the Iori
    plateau runs out flat and pale for a very long way.


    A fort existed here earlier, but the walls you see are largely 17th and 18th century. This was one
    of the residences and refuges of the kings of Kakheti during the long period when the towns of the
    plain were not safe — Persian campaigns from the south, Dagestani raiding parties from the north.
    It was still in use in the reign of Erekle II and stood abandoned and ruined by the middle of the
    19th century.


    What remains:


    - A **substantial run of the outer wall** with both round and square towers


    - **Cisterns** cut for water storage, without which no siege could be sat out


    - The **footprint of a small church** in the middle of the enclosure


    This is not a tidied, reconstructed monument. Grass grows knee-high, fallen stone lies where it fell,
    and there is almost no signage. That is precisely the appeal: you will usually have it entirely to
    yourself, and it looks much as it did when the last garrison left.


    The village below has its own claim to fame. Manavis Mtsvane, one of the better Georgian white grapes,
    takes its name from here, and many courtyards still have a working marani with buried qvevri. Ask
    politely and you may well be shown one.


    The position explains itself once you are up there. Movement on the Iori plateau is visible long before
    it arrives, the Gombori ridge closes the northern side, and there is no higher ground within bowshot
    — a good place to fall back to and a poor one to besiege.
  tip: >-
    An hour covers the climb and the enclosure. The path is bare earth and slippery after rain; from May
    to October the grass is high, so long trousers and closed shoes are sensible — snakes are present.
    Shade exists only at the foot of the walls. Entry is free, and there are no kiosks, toilets or shops
    on the hill; the nearest are in the village. If you plan to taste wine in Manavi, sort out a driver
    first, because portions here are not small.
  route: >-
    Take the Kakheti highway from Tbilisi towards Sagarejo, then turn north-east near Badiauri towards
    Manavi. It is 70 km in total, about an hour and twenty-five minutes. The main road is good asphalt;
    the final ten kilometres are a narrow village road, patched and broken in places, but an ordinary
    car handles it without trouble. There is no formal car park at the foot of the hill, so leave the
    car at the top end of the village and walk. Fuel is available in Sagarejo.
ru:
  name: Крепость Манави
  short: Разрушенная твердыня кахетинских царей над селом Манави, с видом на Иорское плато и его виноградники.
  body: >-
    **Манави — место, где кахетинская история встречается с кахетинским вином.** Крепость стоит на отдельно
    поднимающемся холме над одноимённым селом; подъём занимает около двадцати минут, а сверху Иорское
    плато уходит ровным и выцветшим на десятки километров.


    Укрепление существовало здесь и раньше, но видимые стены в основном XVII-XVIII веков. Это была одна
    из резиденций и убежищ кахетинских царей в долгую пору, когда города равнины перестали быть безопасными:
    персидские походы с юга, дагестанские набеги с севера. Крепость оставалась в деле при Ираклии II и
    к середине XIX века стояла заброшенной.


    Сохранилось следующее:


    - **Значительный участок внешней стены** с круглыми и квадратными башнями


    - **Цистерны**, вырубленные для запаса воды, без которых осаду не пересидеть


    - **Контур небольшой церкви** в середине двора


    Это не приведённый в порядок, отреставрированный памятник. Трава по колено, упавший камень лежит там,
    где упал, указателей почти нет. В этом и притягательность: обычно здесь никого, и крепость выглядит
    примерно так, как её оставил последний гарнизон.


    У села внизу своя известность. Манавис мцване, один из лучших грузинских белых сортов, назван именно
    отсюда, и во многих дворах до сих пор есть действующий марани с закопанными квеври. Спросите вежливо
    — скорее всего, вам его покажут.
  tip: >-
    Часа хватает на подъём и осмотр двора. Тропа земляная и после дождя скользкая; с мая по октябрь трава
    высокая, так что длинные брюки и закрытая обувь разумны — змеи здесь водятся. Тень есть только у подножия
    стен. Вход свободный, киосков, туалетов и магазинов на холме нет, ближайшие в селе. Если планируете
    дегустацию в Манави, заранее договоритесь о водителе: наливают тут не по-музейному.
  route: >-
    Из Тбилиси по кахетинской трассе в сторону Сагареджо, затем у Бадиаури поворот на северо-восток к
    Манави. Всего 70 км, примерно час двадцать пять. Основная дорога — хороший асфальт; последние десять
    километров узкая сельская дорога, местами разбитая, но обычная машина проходит её без проблем. Оборудованной
    парковки у подножия нет, оставьте автомобиль в верхней части села и поднимайтесь пешком. Заправка
    — в Сагареджо.
fa:
  name: قلعهٔ مانافی
  short: دژ ویران پادشاهان کاختی بالای روستای مانافی، مشرف بر فلات ایوری و تاکستان‌هایش.
  body: >-
    **مانافی جایی است که تاریخ کاختی به شراب کاختی می‌رسد.** قلعه بر تپه‌ای مستقل بالای روستایی به همین
    نام نشسته است؛ بالا رفتن حدود بیست دقیقه طول می‌کشد و از فراز آن فلات ایوری صاف و کم‌رنگ تا دوردست
    کشیده می‌شود.


    پیش‌تر هم اینجا استحکاماتی بود، اما دیوارهایی که می‌بینید عمدتاً از سده‌های هفدهم و هجدهم‌اند. این
    یکی از اقامتگاه‌ها و پناهگاه‌های پادشاهان کاختی بود در دورانی دراز که شهرهای دشت دیگر امن نبودند:
    لشکرکشی از جنوب و شبیخون داغستانی از شمال. قلعه در روزگار ایرکله دوم هنوز به کار می‌آمد و تا میانهٔ
    سدهٔ نوزدهم متروک و ویران شد.


    آنچه مانده است:


    - **بخش بزرگی از دیوار بیرونی** با برج‌های گرد و چهارگوش


    - **آب‌انبارها** که برای ذخیرهٔ آب کنده شده‌اند و بی آنها محاصره تاب‌آوردنی نبود


    - **پی یک کلیسای کوچک** در میانهٔ محوطه


    اینجا یادمانی مرتب‌شده و بازسازی‌شده نیست. علف تا زانو می‌رسد، سنگ فروریخته همان‌جا که افتاده مانده
    و تابلویی تقریباً وجود ندارد. جذابیت کار در همین است: معمولاً تمام محوطه در اختیار شماست و قلعه کمابیش
    همان‌گونه است که آخرین پادگان رهایش کرد.


    روستای پایین شهرتی از آنِ خود دارد. «مسوانهٔ مانافی»، از بهترین انگورهای سفید گرجی، نامش را از همین‌جا
    گرفته و در بسیاری از حیاط‌ها هنوز مارانی فعال با کوره‌های خاک‌شده هست. مؤدبانه بپرسید، به احتمال زیاد
    نشانتان می‌دهند.
  tip: >-
    یک ساعت برای صعود و گشتن محوطه کافی است. مسیر خاکی است و پس از باران لغزنده؛ از اردیبهشت تا مهر علف
    بلند است، پس شلوار بلند و کفش بسته عاقلانه است، چون مار هم هست. سایه تنها پای دیوارهاست. ورود رایگان
    است و روی تپه نه دکه‌ای هست نه سرویس بهداشتی و نه مغازه؛ نزدیک‌ترین‌ها در روستاست. اگر قصد نوشیدن
    شراب در مانافی دارید، از پیش راننده‌ای هماهنگ کنید.
  route: >-
    از تفلیس بزرگراه کاختی را به سوی ساگارجو بگیرید و نزدیک بادیااوری به شمال شرق و به سمت مانافی بپیچید.
    جمعاً 70 کیلومتر و حدود یک ساعت و بیست و پنج دقیقه. جادهٔ اصلی آسفالت خوبی دارد؛ ده کیلومتر پایانی
    راهی باریک روستایی است، جاهایی وصله‌دار و شکسته، اما خودروی معمولی بی‌دردسر از آن می‌گذرد. پای تپه
    پارکینگ رسمی نیست، پس خودرو را در انتهای بالای روستا بگذارید و پیاده بروید. سوخت در ساگارجو هست.
he:
  name: מבצר מנאווי
  short: מעוז חרב של מלכי קחתי מעל הכפר מנאווי, המשקיף על רמת היורי וכרמיה.
  body: >-
    **מנאווי הוא המקום שבו ההיסטוריה של קחתי פוגשת את יין קחתי.** המבצר יושב על גבעה עצמאית מעל הכפר בעל
    אותו שם; העלייה אורכת כעשרים דקות, ומלמעלה רמת היורי נמשכת שטוחה וחיוורת עד למרחק רב.


    מבצר עמד כאן גם קודם, אך החומות הנראות היום הן ברובן מן המאות ה-17 וה-18. זה היה אחד ממשכניהם ומקומות
    המקלט של מלכי קחתי בתקופה הארוכה שבה ערי המישור חדלו להיות בטוחות: מסעות פרסיים מדרום, פשיטות דאגסטניות
    מצפון. המבצר עוד שימש בימי ארקלה השני, ועד אמצע המאה ה-19 עמד נטוש והרוס.


    מה שנותר:


    - **קטע נרחב של החומה החיצונית** ובו מגדלים עגולים ומרובעים


    - **בורות מים** שנחצבו לאגירה, ובלעדיהם אין לשבת במצור


    - **מתאר של כנסייה קטנה** במרכז המתחם


    זהו לא מונומנט מסודר ומשוחזר. העשב מגיע לברך, אבן שנפלה מונחת במקום שבו נפלה, ואין כמעט שילוט. וזה
    בדיוק הקסם: בדרך כלל המקום כולו שלכם, והוא נראה בערך כפי שהשאיר אותו חיל המצב האחרון.


    לכפר שלמטה יש תהילה משלו. מנאוויס מצוואנה, מזני הענבים הלבנים הטובים בגאורגיה, נקרא על שם המקום הזה,
    ובחצרות רבות עדיין פועל מרני עם קווברי טמונים באדמה. שאלו בנימוס וסביר שיראו לכם אחד.
  tip: >-
    שעה מכסה את העלייה ואת המתחם. השביל אדמה וחלקלק אחרי גשם; ממאי עד אוקטובר העשב גבוה, ולכן מכנסיים
    ארוכים ונעליים סגורות הם רעיון טוב, ויש כאן גם נחשים. צל יש רק למרגלות החומות. הכניסה חינם, ואין על
    הגבעה דוכנים, שירותים או חנויות; הקרובים ביותר בכפר. אם אתם מתכננים לטעום יין במנאווי, סדרו נהג מראש.
  route: >-
    סעו מטביליסי בכביש קחתי לכיוון סגרג'ו, ואז פנו צפונה-מזרחה ליד באדיאורי אל מנאווי. בסך הכול 70 ק״מ,
    כשעה ועשרים וחמש דקות. הכביש הראשי אספלט טוב; עשרת הקילומטרים האחרונים הם דרך כפרית צרה, מטולאת ושבורה
    במקומות, אך רכב רגיל עובר אותה בלי בעיה. אין חניון מסודר למרגלות הגבעה, אז השאירו את הרכב בקצה העליון
    של הכפר והמשיכו ברגל. דלק יש בסגרג'ו.
ar:
  name: قلعة مانافي
  short: حصن مهدّم لملوك كاخيتي فوق قرية مانافي، يطل على هضبة إيوري وكرومها.
  body: >-
    **مانافي هي المكان الذي يلتقي فيه تاريخ كاخيتي بخمرها.** تقوم القلعة على تل قائم بذاته فوق القرية
    التي تحمل الاسم نفسه؛ ويستغرق الصعود نحو عشرين دقيقة، ومن الأعلى تمتد هضبة إيوري مستوية شاحبة إلى
    مدى بعيد.


    كان هنا حصن قبل ذلك، لكن الأسوار التي تراها ترجع في معظمها إلى القرنين السابع عشر والثامن عشر. كانت
    هذه إحدى مقار ملوك كاخيتي وملاجئهم في الحقبة الطويلة التي لم تعد فيها مدن السهل آمنة: حملات من الجنوب
    وغارات داغستانية من الشمال. وظلت مستعملة في عهد إيريكلي الثاني، وبحلول منتصف القرن التاسع عشر كانت
    مهجورة خرِبة.


    وما بقي منها:


    - **مقطع واسع من السور الخارجي** بأبراج مدورة وأخرى مربعة


    - **صهاريج** حُفرت لتخزين الماء، ولولاها ما أمكن احتمال حصار


    - **أثر كنيسة صغيرة** في وسط الساحة


    وليست هذه أثراً مرتباً مُرمّماً. العشب يبلغ الركبة، والحجر الساقط باقٍ حيث سقط، ولا تكاد توجد لافتات.
    وهذا بالضبط ما يجذب: ستجد المكان لك وحدك في الغالب، ويبدو تقريباً كما تركته آخر حامية.


    وللقرية في الأسفل شهرتها. فعنب مانافيس متسفانه، من أجود العنب الأبيض الجورجي، مسمّى نسبة إلى هذا المكان،
    وما زال في كثير من الأفنية ماراني عامل بقلال مدفونة. اسأل بلطف، ومن المرجح أن يُريك أحدهم واحدة.
  tip: >-
    ساعة تغطي الصعود والساحة. الدرب ترابي وزلق بعد المطر؛ ومن أيار إلى تشرين الأول يرتفع العشب، فالسروال
    الطويل والحذاء المغلق تصرف حكيم، إذ توجد أفاعٍ. ولا ظل إلا عند سفح الأسوار. الدخول مجاني، ولا أكشاك
    ولا دورات مياه ولا متاجر على التل؛ أقربها في القرية. وإن نويت تذوق الخمر في مانافي فدبّر سائقاً مسبقاً.
  route: >-
    اسلك من تبليسي طريق كاخيتي نحو ساغاريجو، ثم انعطف شمالاً شرقاً قرب باديااوري باتجاه مانافي. المجموع
    70 كم ونحو ساعة وخمس وعشرين دقيقة. الطريق الرئيسي إسفلت جيد؛ أما العشرة كيلومترات الأخيرة فطريق قروي
    ضيق مرقّع ومكسور في مواضع، لكن السيارة العادية تجتازه دون عناء. ولا موقف رسمي عند سفح التل، فاترك
    السيارة في أعلى القرية وتابع سيراً. والوقود في ساغاريجو.
rating: 3.5
