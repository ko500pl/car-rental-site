ka:
  name: მანავის ციხე
  short: >-
    კახთა მეფეების ნანგრევი სიმაგრე ღვინით განთქმული სოფელ მანავის თავზე, მთის წვერზე — ციტადელში სამი
    პატარა ეკლესიით, სადაც ერთ დროს მეფე იჯდა.
  body: >-
    **როცა ვახუშტი ბატონიშვილმა XVIII საუკუნეში მანავი აღწერა, აქ „ძველადი ციხე და აწ შემუსვრილი“ დახვდა
    — არადა, სულ რამდენიმე ათეული წლით ადრე აქ მეფე ცხოვრობდა.**


    ციხე სოფელ მანავის თავზე, წამოწეული მთის ყველაზე მაღალ წვერზე დგას, გარე კახეთში. მშენებლებს მარჯვე
    ადგილი შეურჩევიათ: ხეობა აქ შედარებით გაშლილია, ირგვლივ მაღალი მთები აკრავს, დასავლეთიდან კი ციხეს
    თავად ფერდობი იცავდა. ძველი წყობა დაახლოებით ათასი წლისაა, რასაც დღეს ხედავთ, მისი დიდი ნაწილი კი
    XVI–XVIII საუკუნეების გადაკეთებას ეკუთვნის.


    ვახუშტის ცნობით, კახეთის მეფე დავით II-მ (1703–1722) თავისი რეზიდენცია სწორედ აქ გადმოიტანა და ძველი
    ციხის ნანგრევები გამოიყენა. გვიანდელი ხელი გეგმაშიც ჩანს: მთავარი შესასვლელი ქვედა ციხის ჩრდილოეთ
    კედლის შუაში, კოშკის ქვეშ მოწყობილ კამაროვან გასასვლელზე გადიოდა — ქართულ ციხეებში ასეთ გადაწყვეტას
    XVII საუკუნემდე არ ვხვდებით.


    რას მიაქციოთ ყურადღება:


    - მთის წვერზე მდგარ ციტადელს და მის აღმოსავლეთით მიდგმულ ქვედა ციხეს, რომელიც ციტადელს თითქმის ორჯერ
    აღემატება

    - ციტადელის შუაგულში ჯგუფად მდგარ სამ პატარა ეკლესიას; მათგან ყველაზე ძველი, ჩრდილოეთით მდგარი, კარგად
    გათლილი შირიმითაა მოპირკეთებული

    - დასავლეთ გალავანთან მდგარ კოშკოვან სახლს, რვა მეტრზე მაღალს, მესამე სართულზე ერთადერთი სათვალთვალო
    ხვრელით

    - ჩრდილოეთ გალავანთან, დანგრეული სამსართულიანი სახლის ქვეშ ჩადგმულ პატარა კამაროვან წყალსაცავს


    მთის წვერზე წყალსადენი ვერ ამოვიდოდა: ყოველი წვეთი ან ზემოთ ამოჰქონდათ, ან წვიმისგან აგროვებდნენ.
    ასე ჩანს, რამდენად სერიოზულად ეკიდებოდნენ მეფეები სიტყვას „თავშესაფარი“.


    ქვემოთ, სოფელმა თავისი სახელი ერთ-ერთ ყველაზე ცნობილ ქართულ თეთრ ღვინოს — „მანავის მწვანეს“ — უწილადა.
    ჯერ ციხეზე ადით, მერე ღვინოზე ჩამოდით — სწორედ ამ თანმიმდევრობით და საჭესთან სხვა ვინმე დასვით.
  tip: >-
    ასვლა-ჩამოსვლასა და ნანგრევების დათვალიერებას ერთი საათი ყოფნის. გორაზე ბილეთი, ჯიხური და ტუალეტი
    არ არის, ამიტომ წყალი თან იქონიეთ, დანარჩენი კი სოფელში მოაგვარეთ. გალავნის შიგნით მიწა უსწორმასწოროა,
    ზაფხულობით ბალახით დაფარული და ჩამოცვენილი ქვით მოფენილი: ჩაიცვით დახურული ფეხსაცმელი და გრძელი შარვალი,
    მაღალ ბალახში კი ფრთხილად იარეთ. ჩრდილი მხოლოდ კედლების ძირშია. აქ არაფერია შემოღობილი ან მონიშნული,
    ამიტომ ბავშვები კედლების თხემს მოაშორეთ. თუ შემდეგ მანავში ღვინის დაგემოვნებას აპირებთ, ვინ დაჯდება
    საჭესთან, პირველ ჭიქამდე გადაწყვიტეთ.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) აღმოსავლეთით წადით და საგარეჯოს მოსახვევს გასცდით. დაახლოებით
    12 კილომეტრის შემდეგ მანავში შეუხვიეთ. სოფლის ზედა ბოლოდან ვიწრო გზა, ნაწილობრივ ასფალტიანი, ნაწილობრივ
    გრუნტის, ჩრდილო-დასავლეთით ადის პატარა სადგომამდე, რომელიც კედლებს რამდენიმე ასეული მეტრით ქვემოთაა;
    დანარჩენი ფეხით გაიარეთ. სულ 63 კილომეტრი, დაახლოებით საათი და ხუთი წუთი. გზატკეცილი სწრაფია, სოფლის
    გზა — ნელი, მაგრამ მშრალ ამინდში ეკონომ-კლასის მანქანაც გაივლის. ძლიერი წვიმის შემდეგ მანქანა სოფელში
    დატოვეთ და ფეხით ადით. საწვავი საგარეჯოშია. ნინოწმინდის ტაძარი აქედან ოციოდე წუთით უკანაა, თბილისის
    მიმართულებით.
en:
  name: Manavi Fortress
  short: >-
    A ruined royal stronghold on the summit above the wine village of Manavi, with three small churches
    inside a citadel where a Kakhetian king kept court.
  body: >-
    **When Prince Vakhushti described Manavi in the eighteenth century, he found "an old fortress, now
    shattered", yet within living memory a king had held court there.**


    The fortress crowns the highest point of a spur above the village of Manavi, in Outer Kakheti. Its
    builders chose well: the valley opens out here, high ground closes around it, and on the west the
    slope itself was the best defence. The oldest masonry is roughly a thousand years old; much of what
    you see belongs to rebuilding between the 16th and 18th centuries.


    Vakhushti also records that King David II of Kakheti (1703–1722) moved his residence here, reusing
    the older ruins. The later work shows in the plan. The main gate, in the middle of the north wall
    of the lower fortress, ran through a vaulted passage beneath a tower, a solution Georgian castle builders
    did not use before the 17th century.


    What to look for:


    - the citadel on the summit, with the lower fortress, almost twice its size, attached to its east
    side

    - three small churches grouped in the middle of the citadel; the northern one, the oldest, is faced
    with neatly dressed shirimi stone

    - a tower-house on the west wall, still more than eight metres high, with a single spy-hole in its
    third storey

    - a small vaulted cistern beneath a ruined three-storey house on the north wall


    No aqueduct could reach this summit, so every drop was carried up or caught from the rain, which tells
    you how seriously the kings took the word "refuge".


    Below, the village gives its name to Manavis Mtsvane, one of Georgia's best-known white wines. Climb
    for the ruin, come down for the wine, in that order, and with someone else at the wheel.
  tip: >-
    An hour covers the climb and the ruins. There is no ticket, kiosk or toilet on the hill, so bring
    water and use the village for everything else. Inside the walls the ground is rough, overgrown in
    summer and strewn with fallen stone: wear closed shoes and long trousers, and watch your step in the
    long grass. The only shade is at the foot of the walls. Nothing here is fenced or signposted, so keep
    children away from the wall tops. If you plan to taste wine in Manavi afterwards, settle who is driving
    before the first glass.
  route: >-
    Take the S5 Kakheti highway east from Tbilisi, past the Sagarejo turn-off. About 12 km further on,
    turn off into Manavi. From the upper end of the village a narrow lane, part asphalt and part unsurfaced,
    climbs north-west to a small parking area a few hundred metres below the walls; walk the rest. The
    total is 63 km, about 1 hour 5 minutes. The highway is fast; the lane is slow but manageable in an
    economy car when dry. After heavy rain, leave the car in the village and walk up. Fuel is in Sagarejo.
    Ninotsminda Cathedral is twenty minutes back towards Tbilisi.
ru:
  name: Манавская крепость
  short: >-
    Разрушенная царская твердыня на вершине над винным селом Манави, с тремя маленькими церквями внутри
    цитадели, где некогда держал двор кахетинский царь.
  body: >-
    **Когда царевич Вахушти описывал Манави в XVIII веке, он нашёл здесь «старую крепость, ныне разрушенную»,
    хотя на памяти живущих в ней ещё держал двор царь.**


    Крепость венчает высшую точку отрога над селом Манави, во Внешней Кахетии. Её строители выбрали место
    разумно: здесь долина расступается, а высоты замыкают её кольцом, и на западе сам склон служил лучшей
    защитой. Древнейшая кладка — примерно тысячелетней давности; большая часть того, что видно сегодня,
    относится к перестройкам XVI–XVIII веков.


    Вахушти также сообщает, что кахетинский царь Давид II (1703–1722) перенёс сюда свою резиденцию, использовав
    старые развалины. Позднейшая работа видна в самом плане. Главные ворота, в середине северной стены
    нижней крепости, вели через сводчатый проход под башней — решение, которого грузинские зодчие до XVII
    века не применяли.


    На что обратить внимание:


    - цитадель на вершине, к восточной стороне которой примыкает нижняя крепость, почти вдвое больше по
    площади

    - три маленькие церкви, сгруппированные в середине цитадели; северная, самая старая, облицована аккуратно
    отёсанным камнем — ширими

    - дом-башня на западной стене, до сих пор больше восьми метров высотой, с единственной смотровой бойницей
    на третьем этаже

    - небольшая сводчатая цистерна под руинами трёхэтажного дома на северной стене


    Ни один водопровод не мог достичь этой вершины, так что каждую каплю воды поднимали наверх на себе
    или собирали с дождя — это говорит о том, насколько всерьёз цари относились к слову «убежище».


    Внизу село дало имя одному из самых известных белых вин Грузии — Манавис Мцване. Поднимайтесь ради
    развалин, спускайтесь ради вина, именно в этом порядке, и лучше пусть за руль сядет кто-то другой.
  tip: >-
    Подъём и осмотр развалин займут час. На холме нет ни кассы, ни киоска, ни туалета, так что возьмите
    воду, а всё остальное найдёте в селе. Внутри стен земля неровная, летом заросшая и усыпанная упавшими
    камнями: наденьте закрытую обувь и длинные брюки, будьте осторожны в высокой траве. Тень есть только
    у подножия стен. Здесь ничто не огорожено и не помечено указателями, так что не отпускайте детей к
    краю стен. Если планируете дегустацию вина в Манави после прогулки, решите, кто за рулём, до первого
    бокала.
  route: >-
    Езжайте по кахетинской трассе S5 на восток от Тбилиси, минуя поворот на Сагареджо. Ещё примерно через
    12 км сверните в Манави. От верхнего конца села узкая дорога, частично асфальтированная, частично
    без покрытия, поднимается на северо-запад к небольшой парковке в нескольких сотнях метров ниже стен;
    дальше — пешком. Всего 63 км, около 1 часа 5 минут. Трасса быстрая; дорога наверх медленная, но в
    сухую погоду проходима и для машины эконом-класса. После сильного дождя оставьте машину в селе и поднимайтесь
    пешком. Заправка — в Сагареджо. Собор Ниноцминда — в двадцати минутах в сторону Тбилиси.
fa:
  name: قلعه‌ی ماناوی
  short: دژ سلطنتی ویران بر فراز روستای شراب‌خیز ماناوی، با سه کلیسای کوچک درون دژی که پادشاهی کاختی در
    آن دربار داشت.
  body: >-
    **هنگامی که شاهزاده واخوشتی در سده‌ی هجدهم ماناوی را توصیف کرد، «قلعه‌ای کهن، اکنون فروریخته» یافت،
    هرچند در خاطره‌ی زندگان هنوز پادشاهی در آن دربار داشت.**


    قلعه بر بلندترین نقطه‌ی تیغه‌ای بالای روستای ماناوی، در کاختیِ بیرونی، نشسته است. سازندگانش نیک انتخاب
    کردند: دره در این‌جا گشوده می‌شود، بلندی‌ها آن را در بر می‌گیرند، و در سوی غرب، خودِ شیب بهترین سپر
    بود. کهن‌ترین سنگ‌کاری نزدیک به هزار سال قدمت دارد؛ بیشتر آنچه امروز دیده می‌شود به بازسازی‌های سده‌های
    شانزدهم تا هجدهم برمی‌گردد.


    واخوشتی همچنین می‌نویسد که پادشاه داوید دوم کاختی (۱۷۰۳-۱۷۲۲) اقامتگاه خود را بدین‌جا آورد و از خرابه‌های
    کهن دوباره استفاده کرد. کار متأخرتر در نقشه‌ی بنا آشکار است. دروازه‌ی اصلی، در میانه‌ی دیوار شمالی
    دژ زیرین، از راهرویی طاق‌دار زیر یک برج می‌گذشت، راه‌حلی که معماران قلعه‌ساز گرجی پیش از سده‌ی هفدهم
    به کار نمی‌بردند.


    آنچه باید دید:


    - دژ بر فراز قله، که دژ زیرین، تقریباً دو برابر بزرگ‌تر، به سوی شرق آن پیوسته است

    - سه کلیسای کوچک که در میانه‌ی دژ گرد هم آمده‌اند؛ کلیسای شمالی، کهن‌ترین آن‌ها، با سنگ شیریمیِ به‌دقت
    تراش‌خورده روکش شده است

    - خانه‌برجی بر دیوار غربی، که هنوز بیش از هشت متر بلندی دارد، با یک روزنه‌ی دیدبانی در طبقه‌ی سوم
    آن

    - آب‌انباری کوچک و طاق‌دار زیر خرابه‌ی خانه‌ای سه‌طبقه بر دیوار شمالی


    هیچ آبراهی به این قله نمی‌رسید، پس هر قطره آب یا به دست حمل می‌شد یا از باران گرفته می‌شد، و این نشان
    می‌دهد پادشاهان واژه‌ی «پناهگاه» را چه‌قدر جدی می‌گرفتند.


    در پایین، روستا نام خود را به ماناویس متسوانه داده است، یکی از شناخته‌شده‌ترین شراب‌های سفید گرجستان.
    برای دیدن خرابه بالا بروید، برای نوشیدن شراب پایین بیایید، به همین ترتیب، و بهتر است کسی دیگر رانندگی
    کند.
  tip: >-
    یک ساعت برای بالا رفتن و دیدن خرابه‌ها کافی است. روی تپه هیچ بلیت، غرفه یا سرویس بهداشتی نیست، پس
    آب همراه داشته باشید و برای باقی نیازها به روستا بروید. درون دیوارها زمین ناهموار است، در تابستان
    پر از گیاهان هرز و سنگ‌های افتاده: کفشی بسته و شلواری بلند بپوشید و در علف بلند مراقب قدم‌هایتان باشید.
    تنها سایه در پای دیوارها یافت می‌شود. هیچ‌جا محصور یا علامت‌گذاری‌شده نیست، پس کودکان را از بالای
    دیوارها دور نگه دارید. اگر پس از آن قصد چشیدن شراب در ماناوی دارید، پیش از نوشیدن جامِ نخست تعیین
    کنید که چه کسی رانندگی می‌کند.
  route: >-
    بزرگراه کاختی، مسیر S5، را از تفلیس به سوی شرق بگیرید، از تقاطع ساگارجو بگذرید. حدود ۱۲ کیلومتر دورتر،
    به سوی ماناوی بپیچید. از انتهای بالایی روستا، جاده‌ای باریک، بخشی آسفالت و بخشی بدون آسفالت، به سوی
    شمال غرب تا پارکینگ کوچکی چند صد متر پایین‌تر از دیوارها بالا می‌رود؛ بقیه راه را پیاده بروید. مسافت
    کل ۶۳ کیلومتر است، حدود ۱ ساعت و ۵ دقیقه. بزرگراه سریع است؛ جاده‌ی فرعی کند اما در روزهای خشک با خودرویی
    اقتصادی قابل عبور است. پس از باران شدید، خودرو را در روستا بگذارید و پیاده بالا بروید. سوخت‌گیری در
    ساگارجو. کلیسای جامع نینوتسمیندا بیست دقیقه در راه بازگشت به تفلیس قرار دارد.
he:
  name: מצודת מנאווי
  short: מצודה מלכותית חרבה על פסגה מעל כפר היין מנאווי, עם שלוש כנסיות קטנות בתוך מצודה שבה קיים מלך
    קאחתי חצר משלו.
  body: >-
    **כשהנסיך ואחושטי תיאר את מנאווי במאה ה-18, הוא מצא “מצודה עתיקה, חרבה כעת”, אף שעשורים ספורים קודם
    לכן עוד קיים בה מלך את חצרו.**


    המצודה ניצבת על הנקודה הגבוהה ביותר של רכס מעל כפר מנאווי, בקאחתי החיצונית. בוניה בחרו נכון: העמק
    נפתח כאן, וגבהים סוגרים עליו, ובמערב המדרון עצמו היה ההגנה הטובה ביותר. הבנייה העתיקה ביותר בת כאלף
    שנה בקירוב; רוב מה שנראה כיום שייך לשיפוצים בין המאות ה-16 ל-18.


    ואחושטי מספר גם שהמלך דוד השני מקאחתי (1703–1722) העביר את מקום מושבו לכאן, בשימוש חוזר בהריסות הישנות.
    העבודה המאוחרת יותר ניכרת בתכנית. השער הראשי, במרכז החומה הצפונית של המצודה התחתית, עבר במעבר מקומר
    מתחת למגדל, פתרון שבנאי המצודות הגאורגיים לא נהגו להשתמש בו לפני המאה ה-17.


    מה לחפש:


    - המצודה על הפסגה, עם המצודה התחתית, כפולה בקירוב בגודלה, המחוברת לצדה המזרחי

    - שלוש כנסיות קטנות המקובצות במרכז המצודה; הצפונית, העתיקה ביותר, מצופה באבן שירימי מסותתת בקפידה

    - מגדל-בית על החומה המערבית, עדיין למעלה משמונה מטרים גובה, עם חריץ תצפית יחיד בקומתו השלישית

    - בור מים קטן ומקומר מתחת לבית הרוס תלת-קומתי על החומה הצפונית


    אף אמת מים לא יכלה להגיע לפסגה זו, כך שכל טיפה נישאה למעלה או נאספה מהגשם, וזה מלמד עד כמה ברצינות
    לקחו המלכים את המילה “מקלט”.


    למרגלות ההר, הכפר נותן את שמו למנאוויס מצוואנה, אחד היינות הלבנים המפורסמים ביותר של גאורגיה. עלו
    למען ההריסות, רדו למען היין, בסדר הזה, ותנו למישהו אחר לשבת מאחורי ההגה.
  tip: >-
    שעה מספיקה לעלייה ולהריסות. אין כרטיס, קיוסק או שירותים על הגבעה, אז הביאו מים ולכל השאר פנו לכפר.
    בתוך החומות הקרקע משובשת, מכוסה עשבייה בקיץ וזרועה באבנים שנפלו: נעלו נעליים סגורות ולבשו מכנסיים
    ארוכים, והיזהרו בעשב הגבוה. הצל היחיד הוא למרגלות החומות. שום דבר כאן אינו מגודר או מסומן בשלטים,
    אז הרחיקו ילדים מקצוות החומה. אם אתם מתכננים טעימת יין במנאווי אחר כך, החליטו מי נוהג לפני הכוס הראשונה.
  route: >-
    סעו בכביש קאחתי S5 מזרחה מטביליסי, מעבר לפניית סאגארג'ו. כעבור כ-12 ק"מ נוספים פנו למנאווי. מהקצה
    העליון של הכפר דרך צרה, חלקה אספלט וחלקו לא סלול, עולה צפון-מערבה לחניון קטן כמה מאות מטרים מתחת לחומות;
    המשיכו את היתר ברגל. בסך הכול 63 ק"מ, כשעה ו-5 דקות. הכביש הראשי מהיר; הדרך הצרה איטית אך אפשרית ברכב
    אקונומי כשהיא יבשה. לאחר גשם כבד, השאירו את הרכב בכפר ועלו ברגל. תדלוק בסאגארג'ו. קתדרלת נינוצמינדה
    נמצאת עשרים דקות בדרך חזרה לטביליסי.
ar:
  name: قلعة مانافي
  short: >-
    معقل ملكي متهدم على قمة تلة فوق قرية مانافي المشهورة بالنبيذ، وفيه ثلاث كنائس صغيرة داخل قلعة كان
    ملك كاخيتي يقيم فيها بلاطه.
  body: >-
    **عندما وصف الأمير فاخوشتي مانافي في القرن الثامن عشر، وجد «قلعة قديمة، متهدمة الآن»، مع أن ملكًا
    أقام فيها بلاطه قبل ذلك بعقود قليلة فقط.**


    تقوم القلعة على أعلى نقطة في نتوء صخري فوق قرية مانافي، في كاخيتي الخارجية. اختار بناتها الموقع بحكمة:
    الوادي ينفتح هنا، والمرتفعات تحيط به، وفي الغرب كان المنحدر نفسه أفضل دفاع. أقدم البناء الحجري يعود
    إلى ما يقارب ألف عام؛ ومعظم ما يُرى اليوم يخص إعادة البناء بين القرنين السادس عشر والثامن عشر.


    يذكر فاخوشتي أيضًا أن الملك داود الثاني ملك كاخيتي (1703–1722) نقل مقر إقامته إلى هنا، مستخدمًا الخرائب
    القديمة من جديد. يظهر العمل اللاحق في التصميم. البوابة الرئيسية، في وسط السور الشمالي للقلعة السفلى،
    كانت تمر عبر ممر مقنطر تحت برج، وهو حلّ لم يستخدمه بناؤو القلاع الجورجيون قبل القرن السابع عشر.


    ما يستحق النظر إليه:


    - القلعة العليا على القمة، وترتبط بجانبها الشرقي القلعة السفلى، الأكبر منها بمرتين تقريبًا

    - ثلاث كنائس صغيرة متجمعة في وسط القلعة العليا؛ الشمالية، وهي الأقدم، مكسوّة بحجر الشيريمي المنحوت
    بدقة

    - برج سكني على السور الغربي، لا يزال ارتفاعه يزيد على ثمانية أمتار، وفيه فتحة مراقبة واحدة في طابقه
    الثالث

    - خزان مياه صغير مقنطر تحت بيت متهدم من ثلاثة طوابق على السور الشمالي


    لم تكن أي قناة مائية تصل إلى هذه القمة، فكانت كل قطرة تُحمل صعودًا أو تُجمع من المطر، وهذا يكشف مدى
    الجدية التي أخذ بها الملوك كلمة «ملجأ».


    في الأسفل، تُعطي القرية اسمها لنبيذ مانافيس متسفانه، أحد أشهر أنواع النبيذ الأبيض في جورجيا. اصعد
    من أجل الأطلال، وانزل من أجل النبيذ، بهذا الترتيب، وليقُد شخص آخر السيارة.
  tip: >-
    ساعة واحدة تكفي للتسلق ومشاهدة الخرائب. لا يوجد شباك تذاكر أو كشك أو دورات مياه على التلة، فاحمل الماء
    ولكل ما عدا ذلك توجّه إلى القرية. داخل الأسوار الأرض وعرة، مغطاة بالأعشاب في الصيف ومليئة بالحجارة
    المتساقطة: ارتدِ حذاءً مغلقًا وبنطالًا طويلًا، وانتبه لخطواتك في العشب الطويل. الظل الوحيد عند سفح
    الأسوار. لا شيء هنا مسوّر أو عليه لوحات، فأبعد الأطفال عن حواف الأسوار. إذا كنت تنوي تذوق النبيذ في
    مانافي بعد ذلك، حدّد من سيقود قبل الكأس الأولى.
  route: >-
    خذ طريق كاخيتي السريع S5 شرقًا من تبليسي، متجاوزًا مفرق ساغاريجو. بعد حوالي 12 كم أخرى، انحرف نحو
    مانافي. من الطرف العلوي للقرية، يصعد طريق ضيق، جزء منه مسفلت وجزء غير مسفلت، شمال غربًا إلى موقف صغير
    على بعد بضع مئات من الأمتار أسفل الأسوار؛ اقطع بقية المسافة سيرًا. المسافة الإجمالية 63 كم، حوالي
    ساعة و5 دقائق. القيادة على الطريق السريع سريعة؛ والطريق الفرعي بطيء لكنه مقبول بسيارة اقتصادية في
    الطقس الجاف. بعد المطر الغزير، اترك السيارة في القرية واصعد سيرًا. التزود بالوقود في ساغاريجو. تقع
    كاتدرائية نينوتسميندا على بعد عشرين دقيقة في طريق العودة إلى تبليسي.
