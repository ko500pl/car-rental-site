ka:
  name: ბაზალეთის ტბა
  short: >-
    პატარა, თბილწყლიანი ტბა დუშეთის სამხრეთით: თქმულებით, ფსკერზე ოქროს აკვანი ასვენია, 1883 წელს კი ილია
    ჭავჭავაძემ ლექსად აქცია.
  body: >-
    **ამბობენ, ამ პატარა, მომწვანო-მურა ტბის ფსკერზე ოქროს აკვანი ასვენია და შიგ ყრმას სძინავს.**


    ბაზალეთის ტბა დუშეთიდან ხუთიოდე კილომეტრზე, სამხრეთით, დაბალ ზეგანზე წევს, ზღვის დონიდან 878 მეტრზე.
    სარკე სულ 1,2 კვადრატული კილომეტრია და მასში არც ერთი მდინარე არ ჩაედინება — ტბას წვიმა, თოვლის ნადნობი
    და წყაროები ავსებს. ქართული საცნობარო წყაროები მას არაღრმა ტბად აღწერენ: ივლისში წყალი 25 გრადუსამდე
    თბება, იანვარ-თებერვალში კი ყინულით იფარება. სამხრეთ და დასავლეთ ნაპირებს ლელქაში შემორტყმია, მეთევზეები
    კი მთელ შუადღეს კობრსა და წვერას უცდიან.


    ამ ნაპირებს კოღოზე უარესიც უნახავს. 1626 წლის შემოდგომაზე აქ ერთმანეთს შეებნენ მეფე თეიმურაზ I-ის
    ლაშქარი და ურჩი დიდებულის, გიორგი სააკაძის რაზმები. სააკაძის მხარე გატყდა, მისი თანამებრძოლი დავით
    გოგრიშვილი ბრძოლის ველზე დაეცა, თავად სააკაძე კი ოსმალეთს გადაიხვეწა და საქართველო მეტად აღარ უნახავს.
    ოდესღაც ტბის გარშემო შუა საუკუნეების აყვავებული ქალაქიც იდგა.


    აკვანი ხალხური თქმულებისაა; ზოგი ისიც დასძენს, რომ თავად ტბა ყრმის დედის ცრემლისგან დადგა. 1883 წლის
    14 ივლისს ილია ჭავჭავაძემ ამ გადმოცემას ლექსში „ბაზალეთის ტბა“ სამუდამო სახე მისცა: წყლის ქვეშ მარადმწვანე
    წალკოტი ჰყვავის, აკვანს სირინოზები ევლებიან, იგი თამარ დედოფალს ჩაუდგამს, ერს კი ცრემლით ტბა „კარვად
    ზედ გადუხურავს“. ყრმის სახელს პოეტი არ ამბობს — „ვისიც არ ითქმის სახელი“ — და რუსეთის იმპერიის ქვეშ
    მცხოვრებ ქართველ მკითხველს ახსნა არც სჭირდებოდა.


    ადგილობრივები უფრო მიწიერ ამბავსაც ჰყვებიან: ტბაში დამხრჩვალი ხარი თურმე მეზობელი სოფლის ჭაში უპოვიათ
    — აი, საბუთი, რომ წყალი მიწისქვეშ მიედინებაო.


    დღეს აღმოსავლეთ ნაპირზე სასტუმრო-კომპლექსი, კაფეები და პატარა პლაჟია, ზაფხულის შაბათ-კვირას ხმაურიანი;
    მოპირდაპირე ნაპირი ლელიანსა და საძოვრებს შერჩა. ივლისის წყნარ საღამოს რამდენიმე მკლავს გაუსვამთ და
    თვალი თავისით გაგექცევათ ფსკერისკენ.
  tip: >-
    ბანაობასა და სადილს ორი საათი ეყოფა. მაშველი აქ არ მორიგეობს; ფსკერი ნელა ეშვება, მაგრამ ადგილ-ადგილ
    რბილი და წყალმცენარეებით დაფარულია, გვიანი გაზაფხულიდან კი შებინდებისას კოღო ამოდის. საპირფარეშო და
    გამოსაცვლელი კაბინები კაფეებს ეკუთვნის — ერთი ყავა შესასვლელი ბილეთია. ივლის-აგვისტოს შაბათ-კვირას
    პატარა პლაჟი შუადღისთვის ივსება; სამუშაო დღის დილით გაცილებით წყნარა. იანვარ-თებერვალში ტბა გაყინულია:
    სასეირნოდ კარგია, მაგრამ ნაპირზე თითქმის ყველაფერი დაკეტილია, ყინულზე გასვლა კი არ ღირს.
  route: >-
    თბილისიდან ს1-ით მცხეთისკენ გადით, მერე საქართველოს სამხედრო გზაზე (ს3/E117) ჩრდილოეთით აუხვიეთ და
    ნატახტარს გასცდით. გზაჯვარედინიდან დაახლოებით 16 კილომეტრში, დუშეთამდე, მარცხნივ, დუშეთის გზაზე (შ65)
    გადაუხვიეთ და ტბის მანიშნებლებს მიჰყევით. თბილისის ცენტრიდან დაახლოებით 51 კმ და ერთი საათია, მთელ
    გზაზე ასფალტი, ბოლო კილომეტრები — უფრო ვიწრო და ადგილ-ადგილ დაკერებული. ეკონომ-კლასის მანქანა წლის
    ნებისმიერ დროს გამოდგება; ზამთრის დილით გვერდით გზაზე ყინულს გაუფრთხილდით. აღმოსავლეთ ნაპირზე მანქანის
    დაყენება უფასოა, მოუწყობელ მოედანზე. საწვავი ნატახტარში ან დუშეთში ჩაასხით — ზაფხულის გარდა ტბასთან
    თითქმის არაფერი მუშაობს.
en:
  name: Bazaleti Lake
  short: >-
    A small, warm lake south of Dusheti, where folklore keeps a golden cradle on the bottom and Ilia Chavchavadze
    set it to verse in 1883.
  body: >-
    **Somewhere beneath this small green-brown lake, the story goes, a golden cradle rests on the bed,
    and a child sleeps in it.**


    Bazaleti lies at 878 metres on a low plateau five kilometres south of Dusheti: 1.2 square kilometres
    of water that no river feeds. Georgian sources call it shallow: it warms to around 25°C in July and
    freezes over in January and February. Reeds crowd the southern and western shores, and anglers sit
    out the afternoons waiting for carp and barbel.


    These banks have known worse than mosquitoes. In autumn 1626 King Teimuraz I's army met the rebel
    noble Giorgi Saakadze here. Saakadze's line broke, his comrade Davit Gogrishvili fell, and Saakadze
    himself fled to the Ottoman Empire, never to see Georgia again. A flourishing medieval town once stood
    on these shores.


    The cradle belongs to folklore; some say the lake itself is the tears of the child's mother. On 14
    July 1883 Ilia Chavchavadze gave the legend its lasting shape in the poem "Lake Bazaleti": beneath
    the water an evergreen garden blooms, sirens circle the cradle, Queen Tamar is said to have set it
    there, and the nation's tears spread the lake over it like a tent. Chavchavadze leaves the child unnamed,
    one "whose name may not be spoken", and no Georgian reader under Russian rule needed it spelled out.


    Locals tell an earthier tale too: a bull that drowned in the lake was later found in a well in a neighbouring
    village, proof, they insist, that the water slips away underground.


    Today the eastern shore has a resort, cafés and a small beach; the far side keeps its reeds and pasture.
    Swim a few strokes out on a still July evening and you will catch yourself looking down.
  tip: >-
    Two hours covers a swim and lunch. There are no lifeguards; the bottom shelves gently but is soft
    and weedy in places, and from late spring mosquitoes rise at dusk. Toilets and changing cabins belong
    to the cafés, so a coffee is your entry ticket. On July and August weekends the little beach is full
    by noon; a weekday morning is far calmer. In January and February the lake is frozen: a fine place
    for a walk, but almost everything on the shore is shut, and the ice is not for walking on.
  route: >-
    Leave Tbilisi on the S1 towards Mtskheta, then turn north onto the Georgian Military Highway (S3/E117)
    and carry on past Natakhtari. About 16 km beyond the junction, short of Dusheti, turn left onto the
    Dusheti road (Sh65) and follow the signs to the lake. It is roughly 51 km and an hour from central
    Tbilisi, asphalt all the way, the last few kilometres narrower and patched. An economy car is fine
    year round; on winter mornings watch for ice on the side road. Parking on the eastern shore is free
    and informal. Fill up in Natakhtari or Dusheti, because outside summer almost nothing at the lake
    is open.
ru:
  name: Озеро Базалети
  short: >-
    Небольшое тёплое озеро к югу от Душети: фольклор хранит на его дне золотую колыбель, а Илья Чавчавадзе
    в 1883 году переложил легенду в стихи.
  body: >-
    **Где-то под этим небольшим зеленовато-бурым озером, говорит предание, на дне стоит золотая колыбель,
    и в ней спит дитя.**


    Базалети лежит на высоте 878 метров, на невысоком плато в пяти километрах к югу от Душети: 1,2 квадратного
    километра воды, которую не питает ни одна река. Грузинские источники называют его мелководным: в июле
    оно прогревается примерно до 25°C, а в январе и феврале замерзает. Южный и западный берега затянуты
    тростником, и рыбаки просиживают здесь послеполуденные часы в ожидании карпа и усача.


    Эти берега знавали беды похуже комаров. Осенью 1626 года войско царя Теймураза I сошлось здесь с мятежным
    вельможей Георгием Саакадзе. Ряды Саакадзе дрогнули, его соратник Давид Гогришвили пал, а сам Саакадзе
    бежал в Османскую империю и больше никогда не увидел Грузии. Когда-то на этих берегах стоял процветающий
    средневековый город.


    Колыбель — достояние фольклора; иные говорят, что само озеро — слёзы матери этого ребёнка. 14 июля
    1883 года Илья Чавчавадзе придал легенде ту форму, в которой она живёт до сих пор, — в стихотворении
    «Базалетское озеро»: под водой цветёт вечнозелёный сад, вокруг колыбели кружат сирены, поставила её
    туда, как говорят, царица Тамар, а слёзы народа раскинули над ней озеро, словно шатёр. Чавчавадзе
    оставляет дитя безымянным — тем, «чьё имя нельзя произносить», и ни одному грузинскому читателю под
    властью России не нужно было ничего объяснять.


    Местные рассказывают и более приземлённую историю: бык, утонувший в озере, потом нашёлся в колодце
    соседнего села — вот, уверяют они, доказательство, что вода уходит под землю.


    Сегодня на восточном берегу — курорт, кафе и небольшой пляж; дальний берег остаётся во власти тростника
    и пастбищ. Отплывите на несколько гребков тихим июльским вечером — и поймаете себя на том, что смотрите
    вниз.
  tip: >-
    Двух часов хватит, чтобы искупаться и пообедать. Спасателей нет; дно понижается плавно, но местами
    оно мягкое и заросшее водорослями, а с конца весны в сумерках поднимаются комары. Туалеты и кабинки
    для переодевания принадлежат кафе, так что чашка кофе — ваш входной билет. В июльские и августовские
    выходные маленький пляж заполняется к полудню; утром в будний день гораздо спокойнее. В январе и феврале
    озеро замерзает: для прогулки место прекрасное, но почти всё на берегу закрыто, а по льду ходить нельзя.
  route: >-
    Выезжайте из Тбилиси по S1 в сторону Мцхеты, затем поверните на север, на Военно-Грузинскую дорогу
    (S3/E117), и поезжайте мимо Натахтари. Примерно через 16 км после развязки, не доезжая Душети, поверните
    налево на дорогу к Душети (Sh65) и следуйте указателям к озеру. От центра Тбилиси около 51 км и час
    пути, асфальт на всём протяжении, последние несколько километров — уже и в заплатах. Машина экономкласса
    подойдёт круглый год; зимними утрами на боковой дороге остерегайтесь гололёда. Парковка на восточном
    берегу бесплатная и стихийная. Заправьтесь в Натахтари или Душети: вне летнего сезона у озера почти
    ничего не работает.
fa:
  name: دریاچهٔ بازالتی
  short: >-
    دریاچه‌ای کوچک و گرم در جنوب دوشتی که افسانه‌های عامیانه گهواره‌ای زرین در بسترش نهاده‌اند و ایلیا
    چاوچاوادزه در ۱۸۸۳ آن را به شعر درآورد.
  body: >-
    **می‌گویند جایی زیر این دریاچهٔ کوچکِ سبزِ مایل به قهوه‌ای، گهواره‌ای زرین بر بستر آرمیده و کودکی
    در آن خفته است.**


    بازالتی در ارتفاع ۸۷۸ متری، بر فلاتی کم‌ارتفاع در پنج کیلومتری جنوب دوشتی، گسترده است: ۱٫۲ کیلومتر
    مربع آب که هیچ رودی آن را سیراب نمی‌کند. منابع گرجی آن را کم‌ژرفا می‌خوانند: در ژوئیه تا حدود ۲۵ درجهٔ
    سانتی‌گراد گرم می‌شود و در ژانویه و فوریه یخ می‌بندد. نیزارها کرانه‌های جنوبی و غربی را پوشانده‌اند
    و ماهیگیران بعدازظهرها را به انتظار کپور و سس‌ماهی سر می‌کنند.


    این کرانه‌ها بلایی بدتر از پشه هم به خود دیده‌اند. در پاییز ۱۶۲۶ سپاه شاه تیموراز یکم در اینجا با
    نجیب‌زادهٔ شورشی، گیورگی سااکادزه، روبه‌رو شد. صف سااکادزه درهم شکست، هم‌رزمش داویت گوگریشویلی کشته
    شد، و خود سااکادزه به امپراتوری عثمانی گریخت و دیگر هرگز گرجستان را ندید. روزگاری شهری آباد از سده‌های
    میانه بر این کرانه‌ها برپا بود.


    گهواره از آنِ افسانه‌های عامیانه است؛ برخی می‌گویند خود دریاچه اشک‌های مادر آن کودک است. در ۱۴ ژوئیهٔ
    ۱۸۸۳، ایلیا چاوچاوادزه در شعر «دریاچهٔ بازالتی» به این افسانه شکلی ماندگار بخشید: زیر آب باغی همیشه‌سبز
    شکوفه می‌دهد، پریان دریایی گرد گهواره می‌چرخند، گفته می‌شود ملکه تامار آن را آنجا نهاده، و اشک‌های
    ملت دریاچه را چون خیمه‌ای بر فرازش گسترده است. چاوچاوادزه کودک را بی‌نام می‌گذارد، کسی «که نامش را
    نباید بر زبان آورد»، و هیچ خوانندهٔ گرجی زیر سلطهٔ روسیه نیازی نداشت که آشکارتر برایش گفته شود.


    مردم محل داستانی زمینی‌تر هم دارند: گاو نری که در دریاچه غرق شد، بعدها در چاهی در روستای همسایه پیدا
    شد؛ و این، به اصرار آنان، گواه آن است که آب از زیر زمین راهی به بیرون دارد.


    امروز کرانهٔ شرقی تفرجگاه، کافه‌ها و ساحلی کوچک دارد؛ سوی دیگر همچنان نیزار و چراگاه است. در غروبی
    آرام در ژوئیه چند متری شنا کنید و از ساحل دور شوید؛ ناگهان می‌بینید که به پایین نگاه می‌کنید.
  tip: >-
    دو ساعت برای شنا و ناهار کافی است. نجات‌غریق نیست؛ کف دریاچه آرام‌آرام گود می‌شود اما در جاهایی نرم
    و پر از علف آبی است، و از اواخر بهار هنگام غروب پشه‌ها برمی‌خیزند. سرویس بهداشتی و اتاقک‌های تعویض
    لباس از آنِ کافه‌هاست، پس یک فنجان قهوه بلیت ورود شماست. آخر هفته‌های ژوئیه و اوت، ساحل کوچک تا ظهر
    پر می‌شود؛ صبحِ یک روز کاری بسیار آرام‌تر است. در ژانویه و فوریه دریاچه یخ‌زده است: جای خوبی برای
    قدم زدن، اما تقریباً همه چیز در کرانه بسته است و روی یخ نباید راه رفت.
  route: >-
    از تفلیس جادهٔ S1 را به سوی متسختا بگیرید، سپس به شمال، به جادهٔ نظامی گرجستان (S3/E117) بپیچید و
    از کنار ناتاختاری بگذرید. حدود ۱۶ کیلومتر پس از تقاطع، پیش از رسیدن به دوشتی، به چپ و به جادهٔ دوشتی
    (Sh65) بپیچید و تابلوهای دریاچه را دنبال کنید. از مرکز تفلیس حدود ۵۱ کیلومتر و یک ساعت راه است، سراسر
    آسفالت، و چند کیلومتر پایانی باریک‌تر و وصله‌پینه. خودروی اقتصادی در تمام سال مناسب است؛ صبح‌های زمستان
    مراقب یخ‌زدگی جادهٔ فرعی باشید. پارکینگ در کرانهٔ شرقی رایگان و غیررسمی است. در ناتاختاری یا دوشتی
    باک را پر کنید، چون بیرون از تابستان تقریباً هیچ چیز در کنار دریاچه باز نیست.
he:
  name: אגם בזלטי
  short: אגם קטן וחמים מדרום לדושתי, שבקרקעיתו מסתיר הפולקלור עריסת זהב, ואיליה צ'בצ'בדזה הפך את האגדה
    לשיר ב-1883.
  body: >-
    **אי-שם מתחת לאגם הקטן הזה, הירוק-חום, כך מספרים, מונחת על הקרקעית עריסת זהב, ובתוכה ישן ילד.**


    בזלטי שוכן בגובה 878 מטרים, על רמה נמוכה חמישה קילומטרים דרומית לדושתי: 1.2 קמ"ר של מים שאף נהר אינו
    מזין. מקורות גאורגיים מתארים אותו כרדוד: ביולי הוא מתחמם לכ-25°C, ובינואר ובפברואר הוא קופא. סבך קנים
    מכסה את החופים הדרומי והמערבי, ודייגים יושבים שם שעות אחר הצהריים ומחכים לקרפיונים ולברבוסים.


    החופים האלה ידעו צרות גדולות יותר מיתושים. בסתיו 1626 התייצב כאן צבאו של המלך טיימוראז הראשון מול
    האציל המורד גיורגי סאאקדזה. שורותיו של סאאקדזה נשברו, רעו לנשק דוויט גוגרישווילי נפל, וסאאקדזה עצמו
    נמלט לאימפריה העות'מאנית ולא ראה עוד את גאורגיה לעולם. פעם עמדה על גדות אלה עיר משגשגת מימי הביניים.


    העריסה שייכת לפולקלור; יש האומרים שהאגם עצמו הוא דמעות אמו של הילד. ב-14 ביולי 1883 נתן איליה צ'בצ'בדזה
    לאגדה את הצורה שבה היא חיה עד היום בשיר "אגם בזלטי": מתחת למים פורח גן ירוק-עד, בנות ים חגות סביב
    העריסה, ומסופר שהמלכה תמר היא שהניחה אותה שם, ודמעות האומה פרשו מעליה את האגם כמו אוהל. צ'בצ'בדזה
    משאיר את הילד בלי שם — מי "ששמו אסור להיאמר" — ואף קורא גאורגי תחת שלטון רוסיה לא נזקק לפירוש.


    המקומיים מספרים גם סיפור ארצי יותר: שור שטבע באגם נמצא אחר כך בבאר בכפר סמוך — הוכחה, כך הם מתעקשים,
    שהמים חומקים מתחת לאדמה.


    כיום יש בחוף המזרחי אתר נופש, בתי קפה וחוף רחצה קטן; הגדה הרחוקה נשארה לקנים ולמרעה. שחו כמה משיכות
    הרחק מהחוף בערב יולי שקט, ותתפסו את עצמכם מביטים למטה.
  tip: >-
    שעתיים מספיקות לשחייה ולארוחת צהריים. אין מצילים; הקרקעית משתפלת בהדרגה, אבל במקומות מסוימים היא רכה
    ומכוסה צמחייה, ומסוף האביב עולים יתושים עם רדת החשכה. השירותים ותאי ההחלפה שייכים לבתי הקפה, כך שקפה
    אחד הוא כרטיס הכניסה שלכם. בסופי שבוע של יולי ואוגוסט החוף הקטן מתמלא עד הצהריים; בוקר של יום חול
    שקט הרבה יותר. בינואר ובפברואר האגם קפוא: מקום נהדר לטיול רגלי, אבל כמעט הכול על החוף סגור, ועל הקרח
    אסור ללכת.
  route: >-
    צאו מטביליסי ב-S1 לכיוון מצחתה, ואז פנו צפונה אל כביש הצבא הגאורגי (S3/E117) והמשיכו על פני נטאחטארי.
    כ-16 ק"מ אחרי הצומת, לפני דושתי, פנו שמאלה אל כביש דושתי (Sh65) ועקבו אחר השלטים לאגם. כ-51 ק"מ ושעה
    נסיעה ממרכז טביליסי, כביש סלול לכל אורכו, והקילומטרים האחרונים צרים ומטולאים יותר. רכב חסכוני מתאים
    כל השנה; בבקרי חורף היזהרו מקרח על הכביש הצדדי. החניה בחוף המזרחי חינם ולא מוסדרת. תדלקו בנטאחטארי
    או בדושתי, כי מחוץ לקיץ כמעט שום דבר ליד האגם אינו פתוח.
ar:
  name: بحيرة بازاليتي
  short: >-
    بحيرة صغيرة دافئة جنوب دوشيتي، تحفظ الحكايات الشعبية في قاعها مهداً ذهبياً، ونظمها إيليا تشافتشافادزه
    شعراً عام 1883.
  body: >-
    **في مكانٍ ما تحت هذه البحيرة الصغيرة ذات اللون الأخضر المائل إلى البني، كما تقول الحكاية، يستقر مهدٌ
    ذهبي على القاع، وفيه طفل نائم.**


    تقع بازاليتي على ارتفاع 878 متراً، فوق هضبة منخفضة على بعد خمسة كيلومترات جنوب دوشيتي: 1.2 كيلومتر
    مربع من الماء لا يغذّيه أي نهر. وتصفها المصادر الجورجية بأنها ضحلة: تدفأ مياهها إلى نحو 25 درجة مئوية
    في يوليو، وتتجمّد في يناير وفبراير. يتكاثف القصب على شاطئيها الجنوبي والغربي، ويقضي الصيادون ساعات
    العصر في انتظار الكارب والبربيس.


    عرفت هذه الضفاف ما هو أسوأ من البعوض. ففي خريف 1626 التقى جيش الملك تيموراز الأول هنا بالنبيل المتمرّد
    غيورغي ساآكادزه. انكسر صفّ ساآكادزه، وسقط رفيقه في السلاح دافيت غوغريشفيلي، وفرّ ساآكادزه نفسه إلى
    الدولة العثمانية ولم يرَ جورجيا بعدها أبداً. وقد قامت على هذه الضفاف ذات يوم مدينة مزدهرة من العصور
    الوسطى.


    المهد من نسج الحكايات الشعبية؛ ويقول بعضهم إن البحيرة نفسها دموع أمّ ذلك الطفل. وفي 14 يوليو 1883
    منح إيليا تشافتشافادزه الأسطورة صورتها الباقية في قصيدة «بحيرة بازاليتي»: تحت الماء تزهر حديقة دائمة
    الخضرة، وتحوم حوريات البحر حول المهد، ويُقال إن الملكة تامار هي من وضعته هناك، ودموع الأمة بسطت البحيرة
    فوقه كالخيمة. ويترك تشافتشافادزه الطفل بلا اسم، «من لا يجوز أن يُنطق اسمه»، ولم يكن أي قارئ جورجي
    تحت الحكم الروسي بحاجة إلى من يوضّح له المقصود.


    ويروي أهل المكان حكاية أقرب إلى الأرض: ثورٌ غرق في البحيرة عُثر عليه لاحقاً في بئر بقرية مجاورة، وهذا
    في رأيهم دليل قاطع على أن الماء يتسرّب تحت الأرض.


    اليوم على الضفة الشرقية منتجع ومقاهٍ وشاطئ صغير، فيما تحتفظ الضفة البعيدة بقصبها ومراعيها. اسبح بضع
    ضربات مبتعداً عن الشاطئ في مساء هادئ من يوليو، وستجد نفسك تنظر إلى الأسفل.
  tip: >-
    تكفي ساعتان للسباحة والغداء. لا يوجد منقذون؛ ينحدر القاع بلطف، لكنه رخو وكثيف الأعشاب في بعض المواضع،
    ومن أواخر الربيع ينتشر البعوض عند الغسق. دورات المياه وحجرات تبديل الملابس تابعة للمقاهي، فكوب القهوة
    هو تذكرة دخولك. في عطلات نهاية الأسبوع في يوليو وأغسطس يمتلئ الشاطئ الصغير قبل الظهر؛ أما صباح يوم
    عمل فأهدأ بكثير. في يناير وفبراير تكون البحيرة متجمّدة: مكان جميل للتنزّه، لكن كل شيء تقريباً على
    الضفة مغلق، والجليد ليس للمشي عليه.
  route: >-
    اخرج من تبليسي على الطريق S1 باتجاه متسخيتا، ثم انعطف شمالاً إلى الطريق العسكري الجورجي (S3/E117)
    وتابع متجاوزاً ناتاختاري. بعد نحو 16 كم من التقاطع، وقبل الوصول إلى دوشيتي، انعطف يساراً إلى طريق
    دوشيتي (Sh65) واتبع اللافتات إلى البحيرة. المسافة نحو 51 كم وساعة من وسط تبليسي، والطريق معبّد بالكامل،
    والكيلومترات الأخيرة أضيق ومرقّعة. تناسب السيارة الاقتصادية طوال العام، وفي صباحات الشتاء احذر الجليد
    على الطريق الفرعي. الوقوف على الضفة الشرقية مجاني وغير منظّم. املأ الخزان في ناتاختاري أو دوشيتي،
    لأن كل شيء تقريباً عند البحيرة يكون مغلقاً خارج الصيف.
