ka:
  name: ბაზალეთის ტბა
  short: პატარა ტბა დუშეთის მახლობლად, რომელიც ილიას პოემამ ქართული მეხსიერების ერთ-ერთ ყველაზე ცნობილ
    სახელად აქცია.
  body: >-
    **ბაზალეთი პატარა ტბაა, რომელსაც ქართულ მეხსიერებაში მისი ზომისთვის შეუფერებლად დიდი ადგილი უჭირავს.**
    ეს დაახლოებით კილომეტრის სიგანის, არაღრმა ოვალური წყალია, 880 მეტრზე, დაბალი ტყიანი გორაკებით შემოსაზღვრული,
    მცხეთიდან ორმოცი წუთის სავალზე და სამხედრო გზიდან რამდენიმე კილომეტრში. ფიზიკურად ის არაფრით გამორჩეულია.
    კულტურულად ქვეყნის ერთ-ერთი ყველაზე ცნობილი სახელია, და მიზეზი პოემაა.


    1883 წელს ილია ჭავჭავაძემ გამოაქვეყნა „ბაზალეთის ტბა", რომელიც ადგილობრივ თქმულებაზეა აგებული: ფსკერზე
    ოქროს აკვანი დევს სამეფო ჩვილით, რომელიც იმ დღეს ელოდება, როცა საქართველო კვლავ მთელი გახდება. ილია
    რუსეთის მმართველობის ქვეშ წერდა და ყველა ქართველ მკითხველს ესმოდა, რას ნიშნავდა აკვანი. ლექსს დღემდე
    ასწავლიან სკოლაში — ამიტომაც იცნობს ტბის სახელს ის, ვისაც ის არასოდეს უნახავს.


    ტბას მდინარე კი არა, წყაროები და ნალექი კვებავს, რაც უჩვეულოა, და დონე თითქმის არ იცვლება. წყალი არაღრმაა
    — ყველაზე ღრმა ადგილას შვიდი მეტრის ოდენა — ამიტომ სწრაფად თბება და ივლისში მართლაც სასიამოვნოა საბანაოდ,
    გაცილებით მეტად, ვიდრე ჟინვალის ცივი წყალსაცავი. აქ კობრსა და სხვა თევზს იჭერენ, ძირითადად ადგილობრივები,
    გრძელი ანკესებით.


    ნაპირი ორგვარია. აღმოსავლეთ მხარეს სასტუმროების, კაფეებისა და პატარა პლაჟის ზოლია კატამარანებით —
    ზაფხულის შაბათ-კვირას ხმაურიანი, ზამთარში დაკეტილი. დასავლეთი და სამხრეთი ნაპირები წყნარია: ლელიანი,
    საძოვრები და გორაკებში გამავალი ბილიკები. ტბის შემოვლას უსწორმასწორო ადგილებზე დაახლოებით საათნახევარი
    სჭირდება.


    სეზონის გარეთ აქ პირქუშია: ნაცრისფერი წყალი, დაკეტილი დარაბები, ტალახი. ივნისიდან სექტემბრამდე კი
    კარგი ადგილია ჩრდილოეთისკენ მიმავალი გზის გასაწყვეტად — იბანავებ, კალმახს შეჭამ და ორ საათში ისევ
    მაგისტრალზე ხარ.
  tip: >-
    ორი საათი ბანაობასა და სადილს ჰყოფნის. მაშველი არავინაა; ფსკერი თანდათან ეშვება, მაგრამ ადგილ-ადგილ
    რბილი და წყალმცენარეებიანია, კოღოები კი მაისიდან საღამოობით ჩნდება. ტუალეტები და გამოსაცვლელები კონკრეტულ
    კაფეებს ეკუთვნის — რაღაცის შეკვეთა მათი გამოყენების ფასია. ივლისსა და აგვისტოში შაბათ-კვირა დატვირთულია
    და პატარა პლაჟი შუადღისთვის ივსება. ზამთარში ნაპირზე თითქმის ყველაფერი დაკეტილია და ტბა კიდეებზე ხშირად
    იყინება — სასეირნოდ სასიამოვნო, სხვა არაფრისთვის გამოსადეგი.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) ჩრდილოეთით მიდიხარ, მცხეთისა და ნატახტარის გავლით; დუშეთამდე
    ცოტა ადრე ნიშანდებული გვერდითი გზა ტბისკენ უხვევს. სულ დაახლოებით 58 კმ და საათი და ათი წუთი, ბოლომდე
    ასფალტი, უკანასკნელი კილომეტრები უფრო ვიწრო და ჩანაკერებიანი. ეკონომ-კლასის მანქანა მთელი წელი საკმარისია.
    აღმოსავლეთ ნაპირზე პარკინგი უფასოა და არაორგანიზებული. საწვავი და მაღაზია ნატახტარში ან დუშეთში აჯობებს
    — ზაფხულის გარეთ ტბასთან თითქმის არაფერი მუშაობს.
en:
  name: Bazaleti Lake
  short: >-
    A small lake near Dusheti that a single poem by Ilia Chavchavadze turned into one of the best-known
    names in Georgia.
  body: >-
    **Bazaleti is a small lake with an outsized place in Georgian memory.** It is a shallow oval of water
    about a kilometre across, ringed by low wooded hills at 880 metres, forty minutes north of Mtskheta
    and a few kilometres off the Military Highway. Physically it is unremarkable. Culturally it is one
    of the best-known names in the country, and the reason is a poem.


    In 1883 Ilia Chavchavadze published "The Lake of Bazaleti", built on a local legend: at the bottom
    lies a golden cradle holding a royal infant, waiting for the day Georgia becomes whole again. Chavchavadze
    was writing under Russian rule, and every Georgian reader understood what the cradle stood for. The
    poem is still taught in schools, which is why people who have never seen the lake know its name.


    The water is fed by springs and rainfall rather than by any river, which is unusual, and the level
    barely shifts through the year. It is shallow, around seven metres at the deepest, so it warms quickly
    and by July it is genuinely comfortable to swim in — far more so than the cold reservoir at Zhinvali
    down the road. Carp and other fish are taken here, mostly by locals with long rods.


    The shore is a mixed picture. The eastern side has a strip of hotels, cafés and a small beach with
    pedalos, busy at summer weekends and shuttered in winter. The western and southern shores are quiet:
    reeds, pasture and paths through the hills. Walking right round the lake takes about ninety minutes
    on rough ground.


    Out of season the place is bleak — grey water, closed shutters, mud. Between June and September it
    is a good way to break the drive north: a swim, a plate of trout, and back on the highway within two
    hours.
  tip: >-
    Two hours is enough for a swim and lunch. There are no lifeguards; the bottom shelves gently but is
    soft and weedy in places, and mosquitoes come out at dusk from May onwards. Toilets and changing rooms
    belong to individual cafés, so ordering something is the price of using them. July and August weekends
    are busy and the small beach fills by midday. In winter nearly everything on the shore is closed and
    the lake often freezes at the edges — pleasant for a walk, useless for anything else.
  route: >-
    Take the Georgian Military Highway (E117) north from Tbilisi past Mtskheta and Natakhtari; a signed
    side road turns off towards the lake shortly before Dusheti. It is about 58 km and an hour and ten
    minutes, asphalt all the way, with the last few kilometres narrower and patched. An economy car is
    fine year round. Parking on the eastern shore is free and informal. Take fuel and supplies at Natakhtari
    or in Dusheti, because outside the summer months almost nothing at the lake is open.
ru:
  name: Озеро Базалети
  short: >-
    Небольшое озеро близ Душети, которое одно стихотворение Ильи Чавчавадзе сделало одним из самых известных
    имён Грузии.
  body: >-
    **Базалети — маленькое озеро, занимающее в грузинской памяти место, несоразмерное его размеру.** Это
    мелкий овал воды около километра в поперечнике на высоте 880 метров, окружённый невысокими лесистыми
    холмами, в сорока минутах к северу от Мцхеты и в нескольких километрах от Военно-Грузинской дороги.
    Физически оно ничем не выделяется. Культурно — одно из самых известных названий в стране, и причина
    тому поэма.


    В 1883 году Илья Чавчавадзе напечатал «Базалетское озеро», построенное на местном предании: на дне
    лежит золотая колыбель с царским младенцем, который ждёт дня, когда Грузия снова станет целой. Чавчавадзе
    писал под русским правлением, и каждый грузинский читатель понимал, что означает колыбель. Стихотворение
    до сих пор проходят в школе — поэтому имя озера знают и те, кто его никогда не видел.


    Питают озеро родники и осадки, а не река, что необычно, и уровень почти не меняется в течение года.
    Оно мелкое, метров семь в самом глубоком месте, поэтому быстро прогревается, и к июлю купаться в нём
    по-настоящему приятно — куда приятнее, чем в холодном Жинвальском водохранилище неподалёку. Здесь
    ловят карпа и другую рыбу, в основном местные с длинными удочками.


    Берег двойственный. С восточной стороны полоса гостиниц, кафе и маленький пляж с катамаранами: летом
    по выходным шумно, зимой всё закрыто. Западный и южный берега тихие — камыш, пастбища и тропы по холмам.
    Обойти озеро кругом по неровной земле занимает около полутора часов.


    Вне сезона тут уныло: серая вода, закрытые ставни, грязь. С июня по сентябрь это удачный способ разбить
    дорогу на север — искупаться, съесть форель и через два часа снова быть на трассе.
  tip: >-
    Двух часов хватает на купание и обед. Спасателей нет; дно понижается плавно, но местами мягкое и заросшее,
    а комары с мая появляются в сумерках. Туалеты и раздевалки принадлежат конкретным кафе, так что заказ
    — плата за пользование. В июльские и августовские выходные людно, маленький пляж заполняется к полудню.
    Зимой на берегу закрыто почти всё, а озеро нередко подмерзает у кромки: гулять приятно, для остального
    бесполезно.
  route: >-
    По Военно-Грузинской дороге (E117) на север от Тбилиси мимо Мцхеты и Натахтари; незадолго до Душети
    от трассы отходит обозначенный съезд к озеру. Всего около 58 км и час десять, асфальт на всём пути,
    последние километры уже и латаные. Машины эконом-класса достаточно круглый год. Парковка на восточном
    берегу бесплатная и стихийная. Заправляться и закупаться лучше в Натахтари или Душети: вне летних
    месяцев у озера почти ничего не работает.
fa:
  name: دریاچهٔ بازالتی
  short: دریاچه‌ای کوچک نزدیک دوشتی که یک شعر ایلیا چاوچاوادزه آن را به یکی از نام‌های شناخته‌شدهٔ گرجستان
    بدل کرد.
  body: >-
    **بازالتی دریاچه‌ای کوچک است که در حافظهٔ گرجی جایی بس بزرگ‌تر از اندازهٔ خود دارد.** بیضی‌ای کم‌عمق
    از آب به پهنای حدود یک کیلومتر در ارتفاع 880 متر، گرداگردش تپه‌های جنگلی کوتاه، چهل دقیقه شمال متسختا
    و چند کیلومتر دورتر از بزرگراه نظامی. از نظر طبیعی چیز ویژه‌ای نیست. از نظر فرهنگی یکی از مشهورترین
    نام‌های کشور است، و دلیلش یک شعر است.


    در 1883 ایلیا چاوچاوادزه شعر «دریاچهٔ بازالتی» را منتشر کرد که بر افسانه‌ای بومی بنا شده بود: در ته
    دریاچه گهواره‌ای زرین با کودکی شاهزاده خفته است و روزی را انتظار می‌کشد که گرجستان دوباره یکپارچه
    شود. چاوچاوادزه زیر فرمانروایی روسیه می‌نوشت و هر خوانندهٔ گرجی می‌دانست گهواره نشانهٔ چیست. این شعر
    هنوز در مدرسه‌ها تدریس می‌شود و به همین سبب نام دریاچه را کسانی هم می‌دانند که هرگز آن را ندیده‌اند.


    آب دریاچه را چشمه و باران تغذیه می‌کند نه رودخانه، که غیرعادی است، و سطح آن در طول سال کمابیش ثابت
    می‌ماند. عمقش کم است، در ژرف‌ترین جا نزدیک هفت متر، پس زود گرم می‌شود و در تیر شنا در آن به‌راستی
    دلپذیر است، بسیار بیش از آبگیر سرد ژینوالی در همان نزدیکی. اینجا کپور و ماهی‌های دیگر می‌گیرند، بیشتر
    مردم محلی با چوب‌های بلند.


    کرانه دو چهره دارد. سمت شرقی نواری از هتل و کافه و ساحلی کوچک با قایق‌های پایی دارد که در آخر هفته‌های
    تابستان شلوغ است و در زمستان بسته. کرانه‌های غربی و جنوبی آرام‌اند: نیزار، چراگاه و باریکه‌راه‌هایی
    در تپه‌ها. دور زدن کامل دریاچه روی زمین ناهموار حدود یک ساعت و نیم می‌برد.


    بیرون از فصل، جا دلگیر است: آب خاکستری، کرکره‌های بسته و گِل. اما میان خرداد و شهریور راه خوبی است
    برای شکستن مسیر شمال: شنایی، بشقابی ماهی قزل‌آلا، و دو ساعت بعد دوباره روی بزرگراه.
  tip: >-
    دو ساعت برای شنا و ناهار کافی است. ناجی غریق نیست؛ کف دریاچه به‌آرامی شیب می‌گیرد اما جاهایی نرم و
    پوشیده از علف آبی است، و پشه‌ها از اردیبهشت به بعد هنگام غروب بیرون می‌آیند. سرویس بهداشتی و رختکن
    متعلق به کافه‌هاست، پس سفارش دادن بهای استفاده از آنهاست. آخر هفته‌های تیر و مرداد شلوغ است و ساحل
    کوچک تا ظهر پر می‌شود. در زمستان تقریباً همه چیز در کرانه بسته است و لبهٔ دریاچه اغلب یخ می‌زند؛ برای
    قدم زدن خوب است و برای هیچ کار دیگری.
  route: >-
    از تفلیس روی بزرگراه نظامی گرجستان (E117) به شمال و از کنار متسختا و ناتاختاری بروید؛ اندکی پیش از
    دوشتی جاده‌ای فرعی و تابلودار به سوی دریاچه جدا می‌شود. رویهم حدود 58 کیلومتر و یک ساعت و ده دقیقه،
    سراسر آسفالت، و چند کیلومتر پایانی باریک‌تر و وصله‌خورده. خودروی اقتصادی در تمام سال کافی است. پارک
    در کرانهٔ شرقی رایگان و بی‌نظم است. سوخت و آذوقه را در ناتاختاری یا دوشتی بگیرید، چون بیرون از ماه‌های
    تابستان کنار دریاچه تقریباً هیچ چیز باز نیست.
he:
  name: אגם בזאלטי
  short: אגם קטן ליד דושתי ששיר אחד של איליה צ׳אווצ׳אוואדזה הפך לאחד השמות המוכרים בגאורגיה.
  body: >-
    **בזאלטי הוא אגם קטן שתופס בזיכרון הגאורגי מקום גדול בהרבה מגודלו.** זהו סגלגל מים רדוד ברוחב כקילומטר
    בגובה 880 מטר, מוקף גבעות מיוערות נמוכות, ארבעים דקות צפונית למצחתה וכמה קילומטרים מכביש הצבא. פיזית
    אין בו דבר יוצא דופן. תרבותית זהו אחד השמות המוכרים במדינה, והסיבה היא שיר.


    ב-1883 פרסם איליה צ׳אווצ׳אוואדזה את «אגם בזאלטי», שנשען על אגדה מקומית: בקרקעיתו מונחת עריסת זהב ובה
    תינוק ממשפחת המלוכה, הממתין ליום שבו תשוב גאורגיה להיות שלמה. צ׳אווצ׳אוואדזה כתב תחת שלטון רוסי, וכל
    קורא גאורגי הבין למה מרמזת העריסה. השיר עדיין נלמד בבתי הספר, ולכן גם מי שמעולם לא ראה את האגם מכיר
    את שמו.


    את המים מזינים מעיינות וגשם ולא נהר, וזה חריג, והמפלס כמעט אינו משתנה במהלך השנה. האגם רדוד, כשבעה
    מטרים במקום העמוק ביותר, ולכן הוא מתחמם מהר, ועד יולי נעים בו באמת לשחות — הרבה יותר מן המאגר הקר
    בז׳ינוואלי הסמוך. דגי קרפיון ואחרים נדוגים כאן, בעיקר בידי מקומיים עם חכות ארוכות.


    החוף דו-פרצופי. בצד המזרחי רצועה של מלונות, בתי קפה וחוף קטן עם סירות דוושה, שוקק בסופי שבוע בקיץ
    וסגור בחורף. החופים המערבי והדרומי שקטים: קנים, מרעה ושבילים בין הגבעות. הקפה שלמה של האגם על קרקע
    לא סלולה אורכת כשעה וחצי.


    מחוץ לעונה המקום עגום: מים אפורים, תריסים סגורים ובוץ. בין יוני לספטמבר זו דרך טובה לשבור את הנסיעה
    צפונה — שחייה, מנת פורל, ותוך שעתיים שוב על הכביש המהיר.
  tip: >-
    שעתיים מספיקות לשחייה ולארוחה. אין מצילים; הקרקעית יורדת בהדרגה אך במקומות היא רכה ומכוסה צמחייה,
    ויתושים יוצאים עם דמדומים החל ממאי. השירותים וחדרי ההחלפה שייכים לבתי קפה מסוימים, כך שהזמנה היא המחיר
    לשימוש בהם. סופי שבוע ביולי ובאוגוסט עמוסים והחוף הקטן מתמלא עד הצהריים. בחורף כמעט הכול על החוף סגור
    והאגם קופא לעתים בשוליו — נעים לטיול רגלי וחסר תועלת לכל דבר אחר.
  route: >-
    סעו צפונה מטביליסי בכביש הצבא הגאורגי (E117) על פני מצחתה ונטאחטארי; מעט לפני דושתי מסתעפת דרך צדדית
    משולטת אל האגם. בסך הכול כ-58 ק״מ ושעה ועשר דקות, אספלט לכל האורך, והקילומטרים האחרונים צרים ומטולאים
    יותר. רכב חסכוני מספיק בכל ימות השנה. החניה בחוף המזרחי חינם ולא מסודרת. תדלקו וקנו אספקה בנטאחטארי
    או בדושתי, כי מחוץ לחודשי הקיץ כמעט דבר ליד האגם אינו פתוח.
ar:
  name: بحيرة بازاليتي
  short: بحيرة صغيرة قرب دوشيتي جعلتها قصيدة واحدة لإيليا تشافتشافادزه من أشهر الأسماء في جورجيا.
  body: >-
    **بازاليتي بحيرة صغيرة تحتل في الذاكرة الجورجية مكاناً أكبر بكثير من حجمها.** هي بيضاوي ضحل من الماء
    عرضه نحو كيلومتر على ارتفاع 880 متراً، تطوقه تلال حرجية منخفضة، على مسافة أربعين دقيقة شمالي متسخيتا
    وبضعة كيلومترات عن الطريق العسكري. طبيعياً لا شيء لافت فيها. أما ثقافياً فهي من أشهر الأسماء في البلاد،
    والسبب قصيدة.


    في عام 1883 نشر إيليا تشافتشافادزه قصيدة «بحيرة بازاليتي» مبنية على حكاية محلية: في القاع مهد من ذهب
    فيه طفل من بيت الملك ينتظر اليوم الذي تعود فيه جورجيا كاملة. كان تشافتشافادزه يكتب تحت الحكم الروسي،
    وكل قارئ جورجي فهم ما يرمز إليه المهد. وما تزال القصيدة تُدرَّس في المدارس، ولهذا يعرف اسم البحيرة
    من لم يرها قط.


    تتغذى البحيرة من ينابيع ومن المطر لا من نهر، وهذا غير مألوف، ومنسوبها لا يكاد يتغير على مدار السنة.
    وهي ضحلة، نحو سبعة أمتار في أعمق نقطة، فتسخن سريعاً، وفي تموز تصير السباحة فيها مريحة فعلاً، أكثر
    بكثير من خزان جينفالي البارد القريب. ويُصاد فيها الشبوط وغيره، وأكثر الصيادين من الأهالي بقصبات طويلة.


    أما الضفة فذات وجهين. الجانب الشرقي شريط من الفنادق والمقاهي وشاطئ صغير بقوارب الدواسة، يعج في عطل
    الصيف ويُغلق في الشتاء. والضفتان الغربية والجنوبية هادئتان: قصب ومراعٍ ودروب في التلال. والدوران حول
    البحيرة كاملة على أرض غير ممهدة يستغرق نحو ساعة ونصف.


    خارج الموسم يكون المكان كئيباً: ماء رمادي ومصاريع مغلقة وطين. أما بين حزيران وأيلول فهي وسيلة جيدة
    لقطع رحلة الشمال: سباحة، وطبق سمك، والعودة إلى الطريق السريع خلال ساعتين.
  tip: >-
    ساعتان تكفيان للسباحة والغداء. لا منقذين هنا؛ والقاع ينحدر تدريجياً لكنه لين وتكسوه الأعشاب في مواضع،
    والبعوض يخرج عند الغسق ابتداءً من أيار. دورات المياه وغرف التبديل تخص مقاهي بعينها، فالطلب منها ثمن
    استعمالها. عطل تموز وآب مزدحمة والشاطئ الصغير يمتلئ عند الظهر. وفي الشتاء يُغلق كل شيء تقريباً على
    الضفة وتتجمد أطراف البحيرة أحياناً؛ نزهة لطيفة سيراً، ولا فائدة منها لغير ذلك.
  route: >-
    من تبليسي شمالاً على الطريق العسكري الجورجي (E117) مروراً بمتسخيتا وناتاختاري؛ وقبيل دوشيتي يتفرع
    طريق جانبي عليه لافتة نحو البحيرة. نحو 58 كم وساعة وعشر دقائق إجمالاً، معبّد بالكامل، والكيلومترات
    الأخيرة أضيق ومرقّعة. وسيارة اقتصادية تكفي على مدار السنة. والوقوف على الضفة الشرقية مجاني وغير منظم.
    تزود بالوقود والمؤن في ناتاختاري أو دوشيتي، فخارج أشهر الصيف لا يكاد يفتح شيء عند البحيرة.
