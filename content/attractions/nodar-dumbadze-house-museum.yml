ka:
  name: ნოდარ დუმბაძის სახლ-მუზეუმი
  short: ქართველი მწერლის სახლ-მუზეუმი სოფელ ხიდისთავში, პირადი ნივთებითა და მისი ცხოვრების მასალებით.
  body: '**ნოდარ დუმბაძის სახლ-მუზეუმი** გურიაში, ჩოხატაურის მუნიციპალიტეტის სოფელ ხიდისთავში მდებარეობს. ექსპოზიცია მწერლის ცხოვრებას, ოჯახურ გარემოსა და შემოქმედებით გზას აცოცხლებს პირადი ნივთებით, ფოტოებითა და დოკუმენტებით.'
  tip: რეგიონული სახლ-მუზეუმების სამუშაო საათები შესაძლოა შეიცვალოს — გამგზავრებამდე გადაამოწმეთ გახსნის დრო ადგილობრივად.
  route: ჩოხატაურიდან ბახმაროს მიმართულების გზით სოფელ ხიდისთავამდე. მისასვლელი გზა ასფალტიანია და ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Nodar Dumbadze House Museum
  short: The Georgian writer's house museum in Khidistavi, displaying personal objects and biographical material.
  body: '**The Nodar Dumbadze House Museum** stands in Khidistavi village in Chokhatauri Municipality. Personal belongings, photographs and documents introduce the writer’s family life and literary career.'
  tip: Hours at small regional museums can change; confirm locally before making a special trip.
  route: From Chokhatauri follow the Bakhmaro road to Khidistavi. The access is paved and suitable for an economy car.
ru:
  name: Дом-музей Нодара Думбадзе
  short: Дом-музей грузинского писателя в селе Хидистави с личными вещами и архивными материалами.
  body: '**Дом-музей Нодара Думбадзе** знакомит с семейной жизнью и творчеством писателя через личные вещи, фотографии и документы.'
  tip: Перед отдельной поездкой уточните актуальные часы работы на месте.
  route: Из Чохатаури по дороге на Бахмаро до Хидистави; дорога асфальтирована.
