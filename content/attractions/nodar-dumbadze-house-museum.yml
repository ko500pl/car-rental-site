ka:
  name: ნოდარ დუმბაძის სახლ-მუზეუმი
  short: >-
    მემორიალური მუზეუმი გურიის სოფელ ზენობანში, სადაც 1937 წლის რეპრესიების შემდეგ უმშობლოდ დარჩენილი
    ნოდარ დუმბაძე ბებია-ბაბუამ გაზარდა.
  body: >-
    **1937 წელს საბჭოთა ხელისუფლებამ ნოდარ დუმბაძის მამა დახვრიტა, დედა კი გადაასახლა — და ბიჭი, რომელიც
    შემდეგ ერთ-ერთ ყველაზე საყვარელ ქართველ მწერლად იქცა, აქ, გურიის მთისწინა სოფელში, ბებიამ და ბაბუამ
    გაზარდეს.**


    დუმბაძე თბილისში დაიბადა, 1928 წლის 14 ივლისს. მამა, ვლადიმერ დუმბაძე, კომპარტიის რაიკომის პირველი
    მდივანი, რეპრესიებს ემსხვერპლა; დედა, ანა ბახტაძე, მხოლოდ 1946 წელს გაათავისუფლეს. რვა წლის ნოდარი
    დეიდებმა სოხუმში წაიყვანეს; სამი წლის შემდეგ, როცა ბიძებიც დააპატიმრეს და დახვრიტეს, ბიჭი ზენობანში,
    ბებია-ბაბუასთან გაგზავნეს. სოფლის სახელი „ზენა უბნიდან“ მომდინარეობს: ის სუფსისა და გუბაზეულის წყალგამყოფზე,
    ჩოხატაურის მუნიციპალიტეტის ხიდისთავის თემში მდებარეობს. 1945 წელს ნოდარმა მეზობელი ხიდისთავის სკოლა
    დაამთავრა და სასწავლებლად თბილისს დაუბრუნდა.


    შემდეგ წიგნები მოვიდა. სახელი მას რომანებმა „მე, ბებია, ილიკო და ილარიონი“ (1960) და „მე ვხედავ მზეს“
    (1962) მოუტანა; პირველი თენგიზ აბულაძემ გადაიღო, მეორე — ლანა ღოღობერიძემ, 1975 წელს კი მწერალს რუსთაველის
    პრემია მიენიჭა. მკითხველს დიდი ხანია შეუმჩნევია: თითქმის ყველა მის რომანში მთავარი გმირის დედას ანიკო
    ჰქვია — ანას, წართმეული დედის სახელით, დუმბაძის იუმორი კი მის გმირებს მწუხარების გადატანაში ეხმარება.


    მუზეუმი ის სახლი არ არის, სადაც მწერალი ცხოვრობდა. იგი ბებია-ბაბუის სახლის პირდაპირ დგას, იმ ადგილას,
    რომელიც დუმბაძეს ყველაზე მეტად უყვარდა და სადაც საკუთარი სახლის აშენებას აპირებდა. შიგნით ფიჭვის ფიცრით
    მოპირკეთებული დარბაზია — ორფერდა ჭერით, ფოტოებით დაფარული კედლებითა და აგურის ბუხრით; მწერლის ცხოვრება
    აქ დოკუმენტებითა და სახეებით იკითხება.


    დუმბაძე თბილისში გარდაიცვალა, 1984 წლის 14 სექტემბერს, და მთაწმინდის პანთეონში განისვენებს. მისი ბავშვობა
    კი აქ დარჩა — სოფლის ფერდობებზე, სადაც დღეს ასიოდე ადამიანი ცხოვრობს.
  tip: >-
    ერთი საათი საკმარისია. ოუფენსტრიტმეპის მონაცემებით, მუზეუმი ოთხშაბათიდან კვირის ჩათვლით, 10:00–13:00
    და 14:00–18:00 საათებში მუშაობს, ორშაბათს და სამშაბათს დაკეტილია; სოფლის მუზეუმების განრიგი ხშირად
    იცვლება, ამიტომ სპეციალურ მოგზაურობამდე ჩოხატაურში გადაამოწმეთ, საფასური კი ადგილზე დააზუსტეთ. წასვლამდე
    რომანის „მე, ბებია, ილიკო და ილარიონი“ რამდენიმე გვერდი წაიკითხეთ — და კედლებზე გაკრული ფოტოები ალაპარაკდება.
    კაფე არ არის: ისადილეთ ჩოხატაურში. ასკანის ციხე სოფლის გზით დაახლოებით თორმეტი კილომეტრითაა მოშორებული,
    ოციოდე წუთის სავალზე — ორივეს ნახევარ დღეში მოასწრებთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ იარეთ ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთისკენ
    დაახლოებით შვიდი კილომეტრი გაიარეთ და შ2 გზაზე გადადით, რომელიც საჯავახოს გავლით ჩოხატაურამდე მიდის.
    დაბიდან ბახმაროს გზას (შ81) გაუყევით გუბაზეულის ხეობაში; ექვსიოდე კილომეტრის შემდეგ, ხიდისთავში, მარცხნივ
    სოფლის გზაზე გადაუხვიეთ და კიდევ ერთი კილომეტრი აუყევით ზენობნამდე — სულ დაახლოებით 285 კმ, ოთხი საათი
    და თხუთმეტი წუთი. გზა ბოლომდე ასფალტიანია; სოფლის შესახვევი ვიწრო და ციცაბოა, თუმცა მშრალ ამინდში
    პრობლემას არ ქმნის. საწვავი სამტრედიასა და ჩოხატაურშია. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Nodar Dumbadze House Museum
  short: >-
    A memorial museum in Zenobani, the Gurian hill village where Nodar Dumbadze grew up with his grandparents
    after the 1937 purges took his parents.
  body: >-
    **In 1937 the Soviet state shot Nodar Dumbadze's father and exiled his mother, and the boy who grew
    into one of Georgia's best-loved writers was raised here, in a Gurian hill village, by his grandparents.**


    Dumbadze was born in Tbilisi on 14 July 1928. His father, Vladimer, a district Communist Party secretary,
    died in the purges; his mother, Ana Bakhtadze, was not freed until 1946. At eight he was taken to
    aunts in Sukhumi; three years later, after his uncles too had been arrested and shot, he was sent
    to Zenobani. The name means "the upper quarter", and the village sits on the ridge between the Supsa
    and Gubazeuli rivers, in the Khidistavi community of Chokhatauri. In 1945 he finished school in neighbouring
    Khidistavi and went back to Tbilisi to study.


    Then came the books. "I, Grandmother, Iliko and Ilarion" (1960) and "I See the Sun" (1962) made his
    name; Tengiz Abuladze filmed the first, Lana Ghoghoberidze the second, and the Rustaveli Prize followed
    in 1975. Readers have long noticed that in almost every one of his novels the hero's mother is called
    Aniko, after Ana, the mother taken from him, and that his humour is how his characters survive grief.


    The museum is not the house he lived in. It stands opposite his grandparents' home, on the spot Dumbadze
    loved most and where he had hoped to build a house of his own. Inside, a pine-panelled hall with a
    gabled ceiling, walls of photographs and a brick fireplace tell the life in documents and faces.


    He died in Tbilisi on 14 September 1984 and lies in the Mtatsminda Pantheon. His childhood stayed
    here, on the slopes of a village that now counts barely a hundred people.
  tip: >-
    Allow an hour. OpenStreetMap lists the museum as open Wednesday to Sunday, 10:00–13:00 and 14:00–18:00,
    closed Monday and Tuesday; village museums keep flexible hours, so ask in Chokhatauri before making
    a special trip, and check the fee on the spot. Read a few pages of "I, Grandmother, Iliko and Ilarion"
    beforehand — his books exist in English — and the photographs on the walls start to speak. There is
    no café: eat in Chokhatauri. Askana Fortress is about twelve kilometres further on by village road,
    some twenty minutes — an easy pairing for a half-day.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, follow the S12 south for about seven
    kilometres, then turn onto the Sh2 through Sajavakho to Chokhatauri. In the town take the Sh81 Bakhmaro
    road up the Gubazeuli valley; in Khidistavi, after about six kilometres, turn left onto a village
    road and climb roughly a kilometre to Zenobani — about 285 km, some four hours fifteen. It is asphalt
    all the way; the village lane is narrow and steep but harmless in dry weather. Fuel in Samtredia and
    Chokhatauri. An economy car is fine.
ru:
  name: Дом-музей Нодара Думбадзе
  short: >-
    Мемориальный музей в Зенобани — предгорной гурийской деревне, где Нодар Думбадзе рос у деда и бабушки
    после того, как чистки 1937 года унесли его родителей.
  body: >-
    **В 1937 году советская власть расстреляла отца Нодара Думбадзе, а мать отправила в ссылку, и мальчика,
    которому суждено было стать одним из самых любимых писателей Грузии, здесь, в предгорной гурийской
    деревне, вырастили дед и бабушка.**


    Думбадзе родился в Тбилиси 14 июля 1928 года. Его отец, Владимер, секретарь райкома партии, погиб
    в годы репрессий; мать, Ана Бахтадзе, вышла на свободу лишь в 1946-м. В восемь лет мальчика отправили
    к тёткам в Сухуми; три года спустя, когда были арестованы и расстреляны и его дяди, его перевезли
    в Зенобани. Название означает «верхний квартал»; деревня стоит на гребне между реками Супса и Губазеули,
    в общине Хидистави Чохатаурского муниципалитета. В 1945 году он окончил школу в соседнем Хидистави
    и вернулся в Тбилиси, чтобы учиться дальше.


    Потом пришли книги. «Я, бабушка, Илико и Илларион» (1960) и «Я вижу солнце» (1962) сделали ему имя;
    первую экранизировал Тенгиз Абуладзе, вторую — Лана Гогоберидзе, а в 1975 году последовала премия
    Руставели. Читатели давно заметили, что почти в каждом его романе мать героя зовут Анико — в память
    об Ане, матери, которую у него отняли, — а юмор помогает его героям пережить горе.


    Музей — не тот дом, где он жил. Он стоит напротив дома его дедушки и бабушки, на месте, которое Думбадзе
    любил больше всего и где он мечтал построить собственный дом. Внутри — зал, обшитый сосновой доской,
    с двускатным потолком, стены в фотографиях и кирпичный камин: жизнь, рассказанная документами и лицами.


    Он умер в Тбилиси 14 сентября 1984 года и похоронен в Пантеоне Мтацминда. Его детство осталось здесь,
    на склонах деревни, где сегодня живёт едва ли сотня человек.
  tip: >-
    Отведите час. По данным OpenStreetMap, музей работает со среды по воскресенье, 10:00–13:00 и 14:00–18:00,
    понедельник и вторник — выходные; но у деревенских музеев расписание гибкое, так что уточните в Чохатаури,
    прежде чем ехать специально, а плату узнайте на месте. Прочитайте заранее несколько страниц «Я, бабушка,
    Илико и Илларион» — его книги выходили и на английском — и фотографии на стенах заговорят. Кафе здесь
    нет: поесть можно в Чохатаури. Крепость Аскана — ещё около двенадцати километров по сельской дороге,
    минут двадцать езды: удобная пара на полдня.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юг около семи
    километров, после сверните на Sh2 через Саджавахо до Чохатаури. В городе возьмите дорогу на Бахмаро
    Sh81 вверх по долине Губазеули; в Хидистави, примерно через шесть километров, поверните налево на
    деревенскую дорогу и поднимитесь около километра до Зенобани — около 285 км, примерно четыре часа
    пятнадцать минут. Дорога асфальтирована на всём протяжении; деревенский проезд узкий и крутой, но
    в сухую погоду трудностей не доставит. Заправиться можно в Самтредиа и Чохатаури. Обычной легковой
    машины хватит.
fa:
  name: موزهٔ خانهٔ نودار دومبادزه
  short: >-
    موزه‌ای یادبود در زنوبانی، روستای کوهپایه‌ای گوریا که نودار دومبادزه پس از آن‌که سرکوب ۱۹۳۷ والدینش
    را از او گرفت، نزد پدربزرگ و مادربزرگش در آن بزرگ شد.
  body: >-
    **در سال ۱۹۳۷ دولت شوروی پدر نودار دومبادزه را تیرباران کرد و مادرش را به تبعید فرستاد، و پسری که
    بعدها یکی از محبوب‌ترین نویسندگان گرجستان شد، همین‌جا، در این روستای کوهپایه‌ای گوریا، نزد پدربزرگ
    و مادربزرگش بزرگ شد.**


    دومبادزه در ۱۴ ژوئیهٔ ۱۹۲۸ در تفلیس به دنیا آمد. پدرش، ولادیمر، منشی حزب کمونیست ناحیه بود و در سال‌های
    پاکسازی جان باخت؛ مادرش، آنا باختادزه، تا سال ۱۹۴۶ آزاد نشد. در هشت‌سالگی او را نزد خاله‌هایش در سوخومی
    فرستادند؛ سه سال بعد، وقتی عموهایش نیز بازداشت و تیرباران شدند، او را به زنوبانی بردند. نام این روستا
    به معنای «محلهٔ بالا» است و روستا بر تیغه‌ای میان رودهای سوپسا و گوبازئولی، در دهستان خیدیستاوی از
    شهرستان چوخاتائوری قرار دارد. او در سال ۱۹۴۵ در خیدیستاوی همسایه دبیرستان را به پایان برد و برای تحصیل
    به تفلیس بازگشت.


    سپس کتاب‌ها از راه رسیدند. «من، مادربزرگ، ایلیکو و ایلاریون» (۱۹۶۰) و «خورشید را می‌بینم» (۱۹۶۲) نامش
    را بر سر زبان‌ها انداختند؛ تنگیز آبولادزه اولی و لانا قوقوبریدزه دومی را به فیلم برگرداندند، و جایزهٔ
    روستاولی در سال ۱۹۷۵ در پی آمد. خوانندگان دیرزمانی است دریافته‌اند که در تقریباً همهٔ رمان‌هایش مادرِ
    قهرمان داستان آنیکو نام دارد — به یاد آنا، مادری که از او گرفته شد — و طنز او همان چیزی است که شخصیت‌هایش
    با آن اندوه را از سر می‌گذرانند.


    این موزه همان خانه‌ای نیست که او در آن زندگی می‌کرد. روبه‌روی خانهٔ پدربزرگ و مادربزرگش قرار دارد،
    در همان جایی که دومبادزه بیش از هر جای دیگر دوست داشت و آرزو داشت روزی خانهٔ خودش را در آن بسازد.
    درون آن، تالاری با دیوارهای چوب کاج و سقفی شیبدار، دیوارهایی پوشیده از عکس و بخاری دیواریِ آجری، زندگی
    او را با سند و چهره روایت می‌کنند.


    او در ۱۴ سپتامبر ۱۹۸۴ در تفلیس درگذشت و در پانتئون متاتسمیندا به خاک سپرده شد. کودکی او همچنان همین‌جا
    ماند، بر دامنه‌های روستایی که امروز جمعیتش از صد نفر فراتر نمی‌رود.
  tip: >-
    یک ساعت زمان بگذارید. بر پایهٔ اوپن‌استریت‌مپ، موزه از چهارشنبه تا یکشنبه، از ۱۰ تا ۱۳ و از ۱۴ تا
    ۱۸، باز است و دوشنبه و سه‌شنبه تعطیل است؛ اما موزه‌های روستایی ساعت‌کاری نامنظمی دارند، پس پیش از
    سفر ویژه در چوخاتائوری پرس‌وجو کنید و هزینهٔ ورودی را همان‌جا بپرسید. پیش از رفتن چند صفحه از «من،
    مادربزرگ، ایلیکو و ایلاریون» را بخوانید — کتاب‌های او به انگلیسی هم ترجمه شده‌اند — تا عکس‌های روی
    دیوار به سخن درآیند. کافه‌ای در کار نیست: غذا را در چوخاتائوری بخورید. قلعهٔ آسکانا از راه روستایی
    حدود دوازده کیلومتر (نزدیک بیست دقیقه) دورتر است؛ می‌توان هر دو را در نیم‌روزی دید.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 حدود هفت
    کیلومتر به جنوب ادامه دهید، و بعد به Sh2 از میان ساجاواخو تا چوخاتائوری بپیچید. در شهر، جادهٔ باخمارو
    Sh81 را در دل درهٔ گوبازئولی در پیش بگیرید؛ در خیدیستاوی، پس از حدود شش کیلومتر، به سمت چپ به جادهٔ
    روستایی بپیچید و حدود یک کیلومتر بالا بروید تا به زنوبانی برسید — در حدود ۲۸۵ کیلومتر، نزدیک به چهار
    ساعت و پانزده دقیقه. تمام مسیر آسفالت است؛ کوچهٔ روستا تنگ و پرشیب اما در هوای خشک بی‌خطر است. سوخت‌گیری
    در سامتردیا و چوخاتائوری. یک خودروی معمولی کافی است.
he:
  name: בית-המוזיאון של נודאר דומבדזה
  short: >-
    מוזיאון הנצחה בזנובני, כפר הגבעות הגוריאני שבו גדל נודאר דומבדזה בבית סבו וסבתו, אחרי שטיהורי 1937
    לקחו ממנו את הוריו.
  body: >-
    **ב-1937 המדינה הסובייטית הוציאה להורג את אביו של נודאר דומבדזה והגלתה את אמו, והנער שעתיד היה לגדול
    לאחד הסופרים האהובים ביותר בגאורגיה התבגר כאן, בכפר גבעות בגוריה, בבית סבו וסבתו.**


    דומבדזה נולד בטביליסי ב-14 ביולי 1928. אביו, ולדימר, מזכיר מחוזי של המפלגה הקומוניסטית, נספה בטיהורים;
    אמו, אנה בחתדזה, שוחררה רק ב-1946. בגיל שמונה נשלח לדודותיו בסוחומי; שלוש שנים לאחר מכן, משנאסרו והוצאו
    להורג גם דודיו, נשלח לזנובני. שם הכפר פירושו "הרובע העליון", והוא שוכן על הרכס בין נהרות סופסה וגובזאולי,
    בקהילת חידיסטאווי שבמחוז צ'וחאטאורי. ב-1945 סיים את בית הספר בחידיסטאווי הסמוכה וחזר לטביליסי ללימודים.


    אחר כך הגיעו הספרים. "אני, סבתא, איליקו ואילריון" (1960) ו"אני רואה את השמש" (1962) הפכו את שמו לידוע;
    טנגיז אבולדזה עיבד את הראשון לקולנוע, לאנה גוגוברידזה את השני, ובשנת 1975 הגיע פרס רוסתאוולי. קוראים
    הבחינו זה מכבר שבכל אחד מרומניו כמעט נקראת אמו של הגיבור אניקו, על שם אנה, האם שנלקחה ממנו, ושההומור
    שלו הוא הדרך שבה גיבוריו שורדים את היגון.


    המוזיאון אינו הבית שבו התגורר. הוא עומד ממול בית סבו וסבתו, במקום שדומבדזה אהב מכול ושבו קיווה לבנות
    יום אחד בית משלו. בפנים, אולם מחופה עץ אורן עם תקרת גמלון, קירות מכוסי תצלומים ואח מלבנים מספרים את
    חייו במסמכים ובדיוקנאות.


    הוא נפטר בטביליסי ב-14 בספטמבר 1984 ונטמן בפנתאון מתאצמינדה. ילדותו נשארה כאן, על מדרונות כפר שמונה
    כיום כמעט לא יותר ממאה נפש.
  tip: >-
    הקדישו לכך שעה. לפי אופן סטריט מאפ המוזיאון פתוח בימי רביעי עד ראשון, 10:00–13:00 ו-14:00–18:00, וסגור
    בימי שני ושלישי; אבל מוזיאוני כפר נוהגים לפי שעות גמישות, אז שאלו בצ'וחאטאורי לפני שנוסעים במיוחד,
    ובררו את דמי הכניסה במקום. קראו מראש כמה עמודים מ"אני, סבתא, איליקו ואילריון" — ספריו יצאו גם באנגלית
    — והתצלומים על הקירות יתחילו לדבר. אין כאן בית קפה: אכלו בצ'וחאטאורי. מבצר אסקנה נמצא כשנים־עשר קילומטרים
    נוספים בדרך הכפרית, כעשרים דקות נסיעה — שילוב נוח לחצי יום.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, המשיכו ב-S12 דרומה כשבעה קילומטרים,
    ואז פנו ל-Sh2 שעובר בסאג'אווכו עד צ'וחאטאורי. בעיר עלו על כביש בכמארו Sh81 במעלה עמק גובזאולי; בחידיסטאווי,
    אחרי כשישה קילומטרים, פנו שמאלה לדרך כפרית ועלו כקילומטר אחד עד לזנובני — כ-285 ק"מ, בערך ארבע שעות
    ורבע. הכביש סלול לכל אורכו; הדרך הכפרית צרה ותלולה, אך בטוחה במזג אוויר יבש. תדלוק בסמטרדיה ובצ'וחאטאורי.
    רכב פשוט מספיק.
ar:
  name: متحف بيت نودار دومبادزه
  short: >-
    متحف تذكاري في زينوباني، قرية غوريا الواقعة على التلال، حيث نشأ نودار دومبادزه عند جدّيه بعد أن انتزعت
    تطهيرات 1937 والديه.
  body: >-
    **في عام 1937 أعدمت الدولة السوفيتية والد نودار دومبادزه ونفت والدته، وترعرع الصبي الذي سيصبح لاحقًا
    أحد أحبّ كتّاب جورجيا إلى القلوب هنا، في هذه القرية الغورية الواقعة على التلال، عند جدّيه.**


    وُلد دومبادزه في تبليسي في 14 يوليو 1928. قضى والده فلاديمير، سكرتير الحزب الشيوعي في المنطقة، في
    حملات التطهير؛ ولم يُطلق سراح والدته آنا باختادزه إلا في عام 1946. في الثامنة من عمره أُرسل إلى خالاته
    في سوخومي؛ وبعد ثلاث سنوات، حين اعتُقل أعمامه أيضًا وأُعدموا، نُقل إلى زينوباني. يعني اسم القرية «الحيّ
    الأعلى»، وتقع على التلّ الفاصل بين نهري سوبسا وغوبازئولي، في جماعة خيديستاوي التابعة لبلدية تشوخاتاوري.
    وفي عام 1945 أنهى دراسته المدرسية في خيديستاوي المجاورة وعاد إلى تبليسي للدراسة.


    ثم أتت الكتب. رواية «أنا، الجدة، إيليكو وإيلاريون» (1960) و«أرى الشمس» (1962) صنعتا اسمه؛ حوّل تنغيز
    أبولادزه الأولى إلى فيلم، ولانا غوغوبريدزه الثانية، وتلت ذلك جائزة رستافيلي في عام 1975. لاحظ القراء
    منذ زمن طويل أن اسم والدة البطل في كل رواياته تقريبًا هو أنيكو، تيمنًا بآنا، الأم التي انتُزعت منه،
    وأن فكاهته هي طريقة شخصياته في تجاوز الحزن.


    المتحف ليس البيت الذي عاش فيه. يقع مقابل بيت جدّيه، في الموضع الذي أحبّه دومبادزه أكثر من أي مكان
    آخر، والذي كان يأمل أن يبني فيه بيتًا خاصًا به. في الداخل، تروي قاعة مكسوّة بخشب الصنوبر بسقف مسنّم،
    وجدران مغطاة بالصور، وموقد من الطوب، حياته بالوثائق والوجوه.


    توفي في تبليسي في 14 سبتمبر 1984 ودُفن في بانتيون متاتسميندا. بقيت طفولته هنا، على سفوح قرية بالكاد
    يبلغ عدد سكانها اليوم مئة نسمة.
  tip: >-
    خصّص ساعة لهذه الزيارة. تشير خريطة أوبن ستريت ماب إلى أن المتحف يفتح من الأربعاء إلى الأحد، من 10:00
    إلى 13:00 ومن 14:00 إلى 18:00، ويُغلق يومي الاثنين والثلاثاء؛ لكن متاحف القرى تُبقي مواعيد مرنة، فاستفسر
    في تشوخاتاوري قبل أن تقصده خصيصًا، وتحقق من رسم الدخول في الموقع. اقرأ قبل الزيارة صفحات من «أنا،
    الجدة، إيليكو وإيلاريون» — تُرجمت كتبه إلى الإنجليزية أيضًا — فتبدأ الصور على الجدران بالكلام. لا
    مقهى هنا: تناول طعامك في تشوخاتاوري. تقع قلعة أسكانا على بُعد نحو اثني عشر كيلومترًا أخرى عبر الطريق
    الريفي (نحو عشرين دقيقة)، ويسهل الجمع بينهما في نصف يوم.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم تابع على S12 جنوبًا لنحو سبعة
    كيلومترات، ثم انعطف إلى Sh2 عبر ساجافاخو حتى تشوخاتاوري. في البلدة، اتبع طريق باخمارو Sh81 صعودًا
    في وادي غوبازئولي؛ في خيديستاوي، بعد نحو ستة كيلومترات، انعطف يسارًا إلى طريق ريفي واصعد نحو كيلومتر
    واحد حتى زينوباني — نحو 285 كم، أي حوالي أربع ساعات وربع. الطريق معبّد بالكامل؛ والممر الريفي ضيق
    وحاد الانحدار لكنه غير خطير في الطقس الجاف. التزود بالوقود في سامتريديا وتشوخاتاوري. سيارة اقتصادية
    عادية تكفي.
