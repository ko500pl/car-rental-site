ka:
  name: მრავალძალის წმინდა გიორგის ეკლესია
  short: >-
    XI საუკუნის ეკლესია რაჭის ქედზე, 1 840 მეტრზე: ქვაში ნაკვეთი მეომარი წმინდანები, ოსმალთა ლეგენდა და
    სულთნის მუზარადი, ოდესღაც აქ დაცული.
  body: >-
    **„მრავალძალი“ მრავალძლიერს ნიშნავს და, გადმოცემით, ეს სახელი ეკლესიას მტრის ლაშქარმა შეარქვა.**


    ლეგენდა, რომელიც გაზეთმა „ივერიამ“ 1894 წელს დაბეჭდა, ასე მოგვითხრობს: სოფლისკენ მომავალ ოსმალთა ჯარს
    უეცრად ბნელი და ნისლი ჩამოაწვა, ჯარისკაცები გზას ასცდნენ და ბრმად ცვიოდნენ ჭოლევის კლდიდან, რომელიც
    სოფელს სარტყელივით აკრავს. დანარჩენებმა უხილავ წმინდანს შეჰღაღადეს და აღთქმა დადეს, რომ სადამდეც მისი
    ზარის ხმა მიაღწევდა, იქ ჩიტსაც არ დააფრთხობდნენ. ნისლი გაიფანტა და თვალწინ ეკლესია გადაეშალათ. როცა
    კიდევ ერთი ნიშანი ითხოვეს, ეზოში უზარმაზარი ხარი და ძროხა შემოვიდა. ოსმალებმა ისინი დაკლეს, მარჯვენა
    რქები ვერცხლით შეაჭედვინეს და წმინდა გიორგის შესწირეს. ყანწები კი მართლაც არსებობდა: ვერცხლით შემკული
    წყვილი ყანწი 1920 წელს ექვთიმე თაყაიშვილმა აღწერა.


    თავად ეკლესია XI საუკუნისაა, სავარაუდოდ იმ წლებისა, როცა სრულიად საქართველოს მეფე ბაგრატ III-მ რაჭის
    საერისთავო დააარსა. არც ტაძრის ნადავლია გამოგონილი: ხვარაზმელი სულთნის, ჯალალ-ედ-დინის მუზარადი, რომელიც,
    ამირეჯიბთა სიგელის თანახმად, რუსუდან მეფის ლაშქარმა ბრძოლაში ხელთ იგდო და მრავალძალს შესწირა, და ოქროთი
    მოოჭვილი ხმალი, რომელიც, ვახუშტი ბაგრატიონის ცნობით, თავად შაჰ-აბას I-მა უძღვნა ტაძარს. 1934 წელს
    მძარცველებმა ეკლესიის ვერცხლეული გაიტანეს, მაგრამ მუზარადი, გაძარცვული ხმალი და ყანწები გადარჩა.


    დღევანდელი შენობა აღდგენილია. 1894 წელს მცირე დარბაზული ეკლესია გუმბათოვან ჯვრისებრ ტაძრად გააფართოვეს;
    1991 წლის 29 აპრილის მიწისძვრამ ის ჩამოაქცია, 2007–2009 წლებში კი ხელახლა ააშენეს. ღია ფერის თლილ
    ქვას კარგად დააკვირდით: აღმოსავლეთ ფასადზე წმინდა გიორგის ფეხქვეშ იმპერატორი დიოკლეტიანეა განრთხმული,
    მის გვერდით წმინდა თევდორე გველეშაპს განგმირავს, ორივეს ზემოთ კი ჯვარცმაა, სადაც ქრისტე უჩვეულოდ,
    შიშველია გამოსახული. ეს შუა საუკუნეების ეკლესიის რელიეფებია.


    2014 წლის აღწერით სოფელში შვიდი ადამიანი ცხოვრობდა. წმინდა გიორგის დღესაც უფრო მეტი სტუმარი ჰყავს,
    ვიდრე მეზობელი.
  tip: >-
    საათნახევარი დაუთმეთ, ფეხით სეირნობის მსურველებმა — მეტი. ეს მოქმედი ეკლესიაა: მხრები და მუხლები დაფარული
    უნდა იყოს, ქალებმა თავსაფარი იქონიონ. მსახურების გარეშე კარი შეიძლება დაკეტილი დაგხვდეთ, მაგრამ რელიეფები
    მთლიანად გარე კედლებზეა. მაღაზია, კაფე და ტუალეტი არ არის, ამიტომ წყალი და საგზალი თან წაიღეთ. ტურიზმის
    ადმინისტრაცია სოფლის მახლობლად, ტყიან მთებს შორის, გულის ფორმის სიყვარულის ტბასაც ასახელებს, ხიხათის
    მთიდან კი რაჭის ფართო პანორამა იშლება; ბილიკები ადგილობრივებს ჰკითხეთ. ზამთარში გზას თოვლი კეტავს,
    გაზაფხულსა და შემოდგომაზე კი ასვლამდე მდგომარეობა გადაამოწმეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით, შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით, იქიდან კი შ17-ით ნაქერალას
    უღელტეხილი გადაიარეთ ამბროლაურამდე (დაახლოებით 265 კმ). ამბროლაურიდან შ16-ით ონისკენ აღმოსავლეთით
    11 კილომეტრი იარეთ, სორთან მარჯვნივ, ადგილობრივ გზაზე გადაუხვიეთ და ბარის გავლით დაახლოებით 13 კილომეტრი
    აიარეთ სოფლამდე, 1 840 მეტრამდე. აღმართი ახლანდელი რუკებით ასფალტიანია, მაგრამ ციცაბო, ვიწრო და ქვათაცვენისთვის
    ღია. სულ დაახლოებით 290 კმ, ოთხნახევრიდან ხუთ საათამდე. აიღეთ მაღალი გამავლობის მანქანა (ჯიპი) — აღმართისა
    და, შუა ზაფხულის გარდა, თოვლის გამო. საწვავი ამბროლაურში ჩაასხით.
en:
  name: Mravaldzali St George Church
  short: >-
    An 11th-century church at 1,840 m on the Racha range, with carved warrior saints, an Ottoman legend
    and a sultan's helmet among its old treasures.
  body: >-
    **Mravaldzali means "the many-powered", and legend says the name was given to the church by an enemy
    army.**


    The tale was printed in the newspaper Iveria in 1894. An Ottoman force marching on the village was
    swallowed by sudden darkness and fog, and soldiers walked blind off the Cholevi cliff that rings the
    village. The rest prayed to the unseen saint, vowing not to startle so much as a bird within earshot
    of his bell; the fog lifted, and there stood the church. When they asked for one more sign, a giant
    bull and cow came into the churchyard. The soldiers slaughtered them, had the right horns mounted
    in silver and gave them to St George. The horns, at any rate, existed: Ekvtime Takaishvili recorded
    the silver-mounted pair in 1920.


    The church itself dates from the 11th century, probably from the years after King Bagrat III of Georgia
    created the duchy of Racha. Its trophies were no invention either: the helmet of the Khwarazmian sultan
    Jalal ad-Din, captured by Queen Rusudan's men and given to Mravaldzali, as an Amirejibi family charter
    records; and a gold-mounted sword which, according to Vakhushti Bagrationi, Shah Abbas I presented.
    Robbers stripped the silver in 1934, but the helmet, the despoiled sword and the horns survived.


    What stands now is a reconstruction. In 1894 the small hall church was enlarged into a larger cross-domed
    church; the earthquake of 29 April 1991 brought it down, and it was rebuilt in 2007–2009. Look closely
    at the pale ashlar. On the east façade St George stands over the prostrate emperor Diocletian and
    St Theodore spears a dragon, while above them Christ hangs on the cross, unusually shown naked: carvings
    from the medieval church.


    At the 2014 census the village had seven residents. The saint still has more visitors than neighbours.
  tip: >-
    Give it an hour and a half, more if you want to walk. This is a working church: cover shoulders and
    knees, and women should bring a headscarf. It may be locked outside services, but the reliefs are
    all on the outer walls. There is no shop, café or toilet, so bring water and food. The tourism board
    also points to a heart-shaped Lake of Love among the forests near the village and wide views over
    Racha from Mount Khikhati; ask locally for the paths. Snow shuts the road in winter, and in spring
    and autumn check it before driving up.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km, turn north between Zestaponi and Kutaisi on
    the Sh19 through Terjola to Tkibuli, and follow the Sh17 over the Nakerala pass to Ambrolauri (about
    265 km). Head east on the Sh16 towards Oni for 11 km; at Sori turn right onto the local road through
    Bari and climb about 13 km to the village at 1,840 m. The climb is asphalt on current maps but steep,
    narrow and exposed to falling stone. Total about 290 km, four and a half to five hours. Take an SUV
    for the gradient and for snow outside high summer. Fuel up in Ambrolauri.
ru:
  name: Церковь Святого Георгия в Мравалдзали
  short: >-
    Церковь XI века на высоте 1840 м на Рачинском хребте: резные святые-воины, османская легенда и шлем
    султана среди её старинных сокровищ.
  body: >-
    **Мравалдзали значит «многосильный», и, по легенде, это имя церкви дало вражеское войско.**


    Предание напечатала газета «Иверия» в 1894 году. Османский отряд, шедший на село, внезапно накрыли
    тьма и туман, и солдаты вслепую срывались со скалы Чолеви, что опоясывает село. Остальные взмолились
    невидимому святому, поклявшись не спугнуть даже птицы там, где слышен его колокол; туман рассеялся
    — и перед ними стояла церковь. Когда они попросили ещё одного знамения, в церковную ограду вошли огромные
    бык и корова. Солдаты закололи их, оковали правые рога серебром и принесли в дар святому Георгию.
    Рога, во всяком случае, существовали: Эквтиме Такаишвили описал окованную серебром пару в 1920 году.


    Сама церковь относится к XI веку, вероятно, к годам после того, как царь Грузии Баграт III учредил
    Рачинское эриставство. Не выдуманы и её трофеи: шлем хорезмийского султана Джелал ад-Дина, захваченный
    воинами царицы Русудан и пожалованный Мравалдзали, о чём говорит грамота рода Амирэджиби, и оправленный
    золотом меч, который, по словам Вахушти Багратиони, подарил шах Аббас I. В 1934 году грабители сорвали
    серебро, но шлем, ободранный меч и рога уцелели.


    То, что стоит здесь сейчас, — реконструкция. В 1894 году небольшую зальную церковь расширили до более
    крупного крестово-купольного храма; землетрясение 29 апреля 1991 года обрушило его, и в 2007–2009
    годах церковь отстроили заново. Присмотритесь к светлому тёсаному камню. На восточном фасаде святой
    Георгий стоит над поверженным императором Диоклетианом, святой Феодор пронзает копьём дракона, а над
    ними Христос висит на кресте — необычно, обнажённым: это рельефы средневековой церкви.


    По переписи 2014 года в селе жили семь человек. Посетителей у святого по-прежнему больше, чем соседей.
  tip: >-
    Отведите полтора часа, больше — если хотите погулять. Это действующая церковь: плечи и колени должны
    быть закрыты, женщинам стоит взять платок. Вне служб она может быть заперта, но все рельефы — на наружных
    стенах. Магазина, кафе и туалета нет, так что возьмите воду и еду. Туристическое ведомство также советует
    «Озеро любви» в форме сердца среди лесов у села и широкие виды на Рачу с горы Хихати; тропы спрашивайте
    у местных. Зимой дорогу закрывает снег, весной и осенью проверяйте её, прежде чем подниматься.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север на Sh19
    через Терджолу к Ткибули и по Sh17 через перевал Накерала доезжайте до Амбролаури (около 265 км).
    Дальше 11 км на восток по Sh16 в сторону Они; в Сори сверните направо на местную дорогу через Бари
    и поднимайтесь около 13 км до села на высоте 1840 м. По современным картам подъём асфальтирован, но
    он крутой, узкий и открыт камнепадам. Всего около 290 км, от четырёх с половиной до пяти часов. Возьмите
    кроссовер — ради уклона и ради снега вне разгара лета. Заправьтесь в Амбролаури.
fa:
  name: کلیسای گئورگی قدیس در مراوالدزالی
  short: >-
    کلیسایی از سدهٔ یازدهم در ارتفاع ۱۸۴۰ متری بر رشته‌کوه راچا، با قدیسان جنگاورِ کنده‌کاری‌شده، افسانه‌ای
    عثمانی و کلاهخودِ یک سلطان در میان گنجینه‌های کهنش.
  body: >-
    **مراوالدزالی یعنی «پرتوان»، و به روایت افسانه، این نام را سپاهی دشمن بر کلیسا نهاد.**


    این داستان در سال ۱۸۹۴ در روزنامهٔ «ایوریا» چاپ شد. سپاهی عثمانی که به سوی روستا پیش می‌رفت، ناگهان
    در تاریکی و مه فرو رفت و سربازان کورکورانه از صخرهٔ چولوی که گرداگرد روستا را گرفته، به پایین افتادند.
    بازماندگان به درگاه قدیس نادیده دعا کردند و سوگند خوردند که هر جا صدای ناقوسش شنیده شود، حتی پرنده‌ای
    را نرمانند؛ مه کنار رفت و کلیسا پیش رویشان ایستاده بود. وقتی نشانه‌ای دیگر خواستند، گاو نری و گاو
    ماده‌ای غول‌پیکر به حیاط کلیسا آمدند. سربازان آن‌ها را سر بریدند، شاخ‌های راستشان را با نقره آراستند
    و به گئورگی قدیس پیشکش کردند. دست‌کم آن شاخ‌ها واقعی بودند: اکوتیمه تاکائیشویلی در سال ۱۹۲۰ این جفت
    شاخِ نقره‌کوب را ثبت کرد.


    خود کلیسا از سدهٔ یازدهم است، احتمالاً از سال‌هایی پس از آنکه باگرات سوم، پادشاه گرجستان، دوک‌نشین
    راچا را پدید آورد. غنیمت‌هایش هم ساختگی نبودند: کلاهخود جلال‌الدین، سلطان خوارزمشاهی، که مردان ملکه
    روسودان به چنگ آوردند و به مراوالدزالی بخشیدند، چنان‌که در فرمانی از خاندان امیرجیبی آمده است؛ و شمشیری
    با زیور زرین که به گفتهٔ واخوشتی باگراتیونی، شاه عباس یکم آن را هدیه کرد. در سال ۱۹۳۴ دزدان نقره‌ها
    را کندند، اما کلاهخود، شمشیرِ غارت‌شده و شاخ‌ها بر جا ماندند.


    آنچه امروز برپاست بازسازی است. در سال ۱۸۹۴ کلیسای تالاریِ کوچک به کلیسایی بزرگ‌تر با نقشهٔ چلیپایی
    و گنبد گسترش یافت؛ زمین‌لرزهٔ ۲۹ آوریل ۱۹۹۱ آن را فرو ریخت و در سال‌های ۲۰۰۷ تا ۲۰۰۹ از نو ساخته شد.
    به سنگ‌های تراشیدهٔ روشن نزدیک‌تر نگاه کنید. بر نمای شرقی، گئورگی قدیس بالای دیوکلتیانِ امپراتور که
    بر زمین افتاده ایستاده است و تئودور قدیس اژدهایی را با نیزه می‌زند، و بر فراز آنان مسیح بر صلیب آویخته
    است، به شکلی غیرمعمول برهنه: این‌ها کنده‌کاری‌های کلیسای سده‌های میانه‌اند.


    در سرشماری ۲۰۱۴، روستا هفت ساکن داشت. قدیس هنوز بیش از همسایه، زائر دارد.
  tip: >-
    یک ساعت و نیم وقت بگذارید، و اگر می‌خواهید پیاده‌روی کنید بیشتر. این کلیسا دایر است: شانه‌ها و زانوها
    را بپوشانید و زنان روسری همراه داشته باشند. بیرون از زمان مراسم ممکن است بسته باشد، اما همهٔ نقش‌برجسته‌ها
    بر دیوارهای بیرونی‌اند. فروشگاه، کافه یا سرویس بهداشتی نیست، پس آب و خوراک همراه بیاورید. سازمان گردشگری
    از «دریاچهٔ عشق» قلبی‌شکل در میان جنگل‌های نزدیک روستا و چشم‌اندازهای گسترده بر راچا از کوه خیخاتی
    نیز یاد می‌کند؛ راه‌های پیاده را از اهالی بپرسید. در زمستان برف جاده را می‌بندد و در بهار و پاییز
    پیش از بالا رفتن وضعیتش را بررسی کنید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سمت غرب بروید، میان زستافونی و کوتائیسی به جادهٔ Sh19
    به سمت شمال بپیچید و از راه ترجولا به تکیبولی بروید، سپس با جادهٔ Sh17 از گردنهٔ ناکرالا تا آمبرولائوری
    برانید (حدود ۲۶۵ کیلومتر). از آنجا ۱۱ کیلومتر با جادهٔ Sh16 به سمت شرق و به سوی اونی بروید؛ در سوری
    به راست، به جادهٔ محلی از راه باری بپیچید و حدود ۱۳ کیلومتر تا روستا در ارتفاع ۱۸۴۰ متری بالا بروید.
    بر پایهٔ نقشه‌های کنونی این سربالایی آسفالت است، اما پرشیب، باریک و در معرض ریزش سنگ. کل مسیر حدود
    ۲۹۰ کیلومتر است، چهار و نیم تا پنج ساعت. برای شیب تند و برف بیرون از چلهٔ تابستان، خودروی شاسی‌بلند
    بردارید. در آمبرولائوری سوخت بگیرید.
he:
  name: כנסיית גאורגיוס הקדוש במרוואלדזאלי
  short: >-
    כנסייה מהמאה ה-11 בגובה 1,840 מטר על רכס ראצ'ה, ובה קדושים לוחמים מגולפים, אגדה עות'מאנית וקסדה של
    סולטן בין אוצרותיה העתיקים.
  body: >-
    **מרוואלדזאלי פירושו "רב-העוצמה", ולפי האגדה את השם הזה נתן לכנסייה צבא אויב.**


    הסיפור נדפס בעיתון "איבריה" ב-1894. כוח עות'מאני שצעד על הכפר נבלע לפתע בחושך ובערפל, וחיילים הלכו
    בעיוורון אל מעבר לשפת צוק צ'ולבי, המקיף את הכפר, ונפלו. השאר התפללו אל הקדוש שלא נראה ונדרו לא להבהיל
    אפילו ציפור בכל מקום שבו נשמע פעמונו; הערפל התפזר, והנה עמדה לפניהם הכנסייה. כשביקשו אות נוסף, נכנסו
    לחצר הכנסייה שור ופרה ענקיים. החיילים שחטו אותם, ציפו את הקרניים הימניות בכסף והקדישו אותן לגאורגיוס
    הקדוש. הקרניים, מכל מקום, היו קיימות: אקבטימה טקאישווילי תיעד את זוג הקרניים המצופות כסף ב-1920.


    הכנסייה עצמה מתוארכת למאה ה-11, כנראה לשנים שאחרי שבגרט השלישי, מלך גאורגיה, הקים את דוכסות ראצ'ה.
    גם השלל שלה לא היה בדוי: הקסדה של הסולטן החוארזמי ג'לאל א-דין, שנלקחה בידי אנשי המלכה רוסודן ונתרמה
    למרוואלדזאלי, כפי שמתועד בכתב זכויות של משפחת אמירג'יבי; וחרב משובצת זהב, שלפי וחושטי בגרטיוני העניק
    השאה עבאס הראשון. ב-1934 שדדו גנבים את הכסף, אבל הקסדה, החרב השדודה והקרניים שרדו.


    מה שעומד כאן היום הוא שחזור. ב-1894 הורחבה כנסיית האולם הקטנה לכנסייה גדולה יותר בתוכנית צלב עם כיפה;
    רעידת האדמה של 29 באפריל 1991 הפילה אותה, והיא נבנתה מחדש בשנים 2007–2009. הביטו היטב באבני הגזית
    הבהירות. בחזית המזרחית גאורגיוס הקדוש עומד מעל הקיסר דיוקלטיאנוס השרוע לרגליו, ותאודורוס הקדוש נועץ
    חנית בדרקון, ומעליהם ישו תלוי על הצלב — ובאופן חריג, עירום: אלה גילופים מן הכנסייה של ימי הביניים.


    במפקד 2014 חיו בכפר שבעה תושבים. לקדוש עדיין יש יותר מבקרים משכנים.
  tip: >-
    הקדישו שעה וחצי, ויותר אם תרצו ללכת ברגל. זו כנסייה פעילה: כסו כתפיים וברכיים, ונשים יביאו כיסוי ראש.
    מחוץ לשעות התפילה היא עשויה להיות נעולה, אבל כל התבליטים נמצאים על הקירות החיצוניים. אין חנות, בית
    קפה או שירותים, אז הביאו מים ואוכל. רשות התיירות מציינת גם את "אגם האהבה" בצורת לב בין היערות שליד
    הכפר ואת התצפיות הרחבות על ראצ'ה מהר חיחאטי; שאלו את המקומיים על השבילים. בחורף השלג סוגר את הכביש,
    ובאביב ובסתיו בדקו את מצבו לפני העלייה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 ‏(E60) כ-190 ק"מ, בין זסטאפוני לקוטאיסי פנו צפונה לכביש Sh19 דרך טרג'ולה
    עד טקיבולי, והמשיכו בכביש Sh17 מעל מעבר נקרלה עד אמברולאורי (כ-265 ק"מ). משם סעו 11 ק"מ מזרחה בכביש
    Sh16 לכיוון אוני; בסורי פנו ימינה לכביש המקומי דרך בארי וטפסו כ-13 ק"מ עד הכפר, בגובה 1,840 מטר. לפי
    המפות העדכניות העלייה סלולה, אבל היא תלולה, צרה וחשופה לנפילת אבנים. בסך הכול כ-290 ק"מ, ארבע וחצי
    עד חמש שעות. קחו רכב פנאי-שטח בגלל השיפוע, ובגלל השלג מחוץ לשיא הקיץ. תדלקו באמברולאורי.
ar:
  name: كنيسة القديس جاورجيوس في مرافالدزالي
  short: >-
    كنيسة من القرن الحادي عشر على ارتفاع 1840 م في سلسلة جبال راتشا، فيها قديسون محاربون منحوتون، وأسطورة
    عثمانية، وخوذة سلطان بين كنوزها القديمة.
  body: >-
    **معنى مرافالدزالي «كثير القوى»، وتقول الأسطورة إن جيشاً معادياً هو من أطلق هذا الاسم على الكنيسة.**


    نُشرت الحكاية في صحيفة «إيفيريا» عام 1894. فقد ابتلع ظلامٌ وضباب مفاجئان قوةً عثمانية كانت تزحف على
    القرية، فسار الجنود عمياناً حتى هووا من جرف تشوليفي الذي يطوّق القرية. وتضرّع الباقون إلى القديس الذي
    لا يرونه، ونذروا ألا يُفزعوا ولو طائراً حيثما يُسمع جرسه؛ فانقشع الضباب، وإذا بالكنيسة قائمة أمامهم.
    ولما طلبوا آية أخرى، دخل باحة الكنيسة ثور وبقرة عظيمان. فذبحهما الجنود، وكسوا قرنيهما الأيمنين بالفضة
    وقدّموهما للقديس جاورجيوس. أما القرنان فكانا حقيقيين على أي حال: فقد وثّق إكفتيمي تاكايشفيلي الزوج
    المكسوّ بالفضة عام 1920.


    تعود الكنيسة نفسها إلى القرن الحادي عشر، وعلى الأرجح إلى السنوات التي تلت إنشاء باغرات الثالث، ملك
    جورجيا، دوقية راتشا. ولم تكن غنائمها من نسج الخيال أيضاً: خوذة السلطان الخوارزمي جلال الدين، التي
    غنمها رجال الملكة روسودان وأُهديت إلى مرافالدزالي، كما تسجّل وثيقة لأسرة أميريجيبي؛ وسيف مطعّم بالذهب
    أهداه، بحسب فاخوشتي باغراتيوني، الشاه عباس الأول. وفي عام 1934 انتزع اللصوص الفضة، لكن الخوذة والسيف
    المسلوب والقرنين نجت.


    ما يقوم هنا اليوم إعادة بناء. ففي عام 1894 وُسّعت الكنيسة الصغيرة ذات القاعة الواحدة لتصبح كنيسة أكبر
    ذات مخطط صليبي وقبة؛ ثم أسقطها زلزال 29 أبريل 1991، وأُعيد بناؤها بين 2007 و2009. تأمّل الحجر المنحوت
    الفاتح عن قرب. فعلى الواجهة الشرقية يقف القديس جاورجيوس فوق الإمبراطور ديوقلطيانوس المطروح أرضاً،
    والقديس ثيودوروس يطعن تنيناً برمحه، وفوقهما المسيح معلّق على الصليب، عارياً على نحو غير مألوف: إنها
    منحوتات من كنيسة القرون الوسطى.


    في تعداد 2014 كان في القرية سبعة سكان. وما زال زوار القديس أكثر من جيرانه.
  tip: >-
    خصّص ساعة ونصفاً، وأكثر إن أردت المشي. هذه كنيسة تُقام فيها الصلوات: غطِّ الكتفين والركبتين، وعلى
    النساء إحضار غطاء للرأس. قد تكون مقفلة خارج أوقات الصلاة، لكن النقوش البارزة كلها على الجدران الخارجية.
    لا متجر ولا مقهى ولا دورة مياه، فأحضر الماء والطعام. وتشير هيئة السياحة أيضاً إلى «بحيرة الحب» التي
    على شكل قلب بين الغابات قرب القرية، وإلى المشاهد الواسعة على راتشا من جبل خيخاتي؛ اسأل الأهالي عن
    الدروب. يغلق الثلج الطريق في الشتاء، وفي الربيع والخريف تحقّق من حالته قبل الصعود.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى الطريق
    Sh19 عبر تيرجولا حتى تكيبولي، وتابع على الطريق Sh17 فوق ممر ناكيرالا حتى أمبرولاوري (نحو 265 كم).
    ومنها اتجه شرقاً على الطريق Sh16 نحو أوني مسافة 11 كم؛ وفي سوري انعطف يميناً إلى الطريق المحلي عبر
    باري واصعد نحو 13 كم حتى القرية على ارتفاع 1840 م. الصعود معبّد بحسب الخرائط الحالية، لكنه شديد الانحدار
    وضيق ومعرّض لتساقط الحجارة. المجموع نحو 290 كم، من أربع ساعات ونصف إلى خمس ساعات. خذ سيارة رياضية
    متعددة الاستخدامات مرتفعة بسبب الانحدار، وبسبب الثلج خارج ذروة الصيف. تزوّد بالوقود في أمبرولاوري.
