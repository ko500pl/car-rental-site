ka:
  name: ქაშვეთის წმინდა გიორგის ეკლესია
  short: რუსთაველის გამზირის თეთრი ეკლესია პარლამენტის პირდაპირ — სამთავისის ასლი ლადო გუდიაშვილის ფრესკებით.
  body: >-
    **ქაშვეთი რუსთაველის გამზირის შუაგულში დგას, პარლამენტის შენობის პირდაპირ** — თეთრი, ჩუქურთმებით შემკული
    ეკლესია, რომლის წინ დღეში ათასობით ადამიანი ჩაივლის და ცოტამ თუ იცის, რა ისტორია დგას მის სახელს უკან.


    ლეგენდის თანახმად, VI საუკუნეში დავით გარეჯელი ცილისწამებით დაადანაშაულეს — თბილისელმა ქალმა მას მიაწერა
    მუცლად ღებული ბავშვი. ბერმა თქვა, რომ ქალი ქვას შობდა — და ასეც მოხდა. აქედან მოდის სახელი „ქაშვეთი“
    („ქვა შვა“). ამ ადგილას ეკლესიები საუკუნეების განმავლობაში ენაცვლებოდა ერთმანეთს; დღევანდელი ტაძარი
    1904–1910 წლებში აშენდა არქიტექტორ ლეოპოლდ ბილფელდის პროექტით და XI საუკუნის სამთავისის ტაძრის მოტივებს
    იმეორებს.


    ღირსშესანიშნავია:


    - ფასადის ქვის ჩუქურთმა — სამთავისის სკოლის გაგრძელება XX საუკუნეში

    - საკურთხევლის ფრესკა, რომელიც ლადო გუდიაშვილმა 1947 წელს მოხატა — საბჭოთა ეპოქაში ეკლესიის მოხატვა
    მხატვარს ძვირად დაუჯდა

    - მშვიდი ეზო გამზირის ხმაურიდან ორ ნაბიჯში


    ეკლესია მოქმედია, წირვები რეგულარულად ტარდება. 9 აპრილის ბაღი და ეროვნული მუზეუმი გვერდითაა.
  tip: >-
    შესვლა უფასოა, ეკლესია დღისით ღიაა. ჩაცმის წესი მოქმედებს: ქალებისთვის თავსაფარი (შესასვლელთან დევს),
    მოკლე შორტები არავისთვის ვარგა. წირვის დროს (დილით და საღამოს) ტურისტული ტრიალი შეაჩერე და ჩუმად დადექი.
    ფოტოგრაფია შიგნით არ არის მიღებული. ათი-თხუთმეტი წუთი საკმარისია, მაგრამ გუდიაშვილის ფრესკას დრო დაუთმე.
  route: >-
    ეკლესია რუსთაველის გამზირზეა, თავისუფლების მოედნიდან ხუთი წუთის სავალზე — მანქანით აქ მისვლას აზრი
    თითქმის არ აქვს. რუსთაველზე გაჩერება პრაქტიკულად შეუძლებელია; დატოვე მანქანა თავისუფლების მოედნის
    მიმდებარე ფასიან პარკინგზე ან სასტუმროსთან და ფეხით იარე, ან მეტროთი ჩამოდი (სადგური „რუსთაველი“ ან
    „თავისუფლების მოედანი“, ორივედან 5–7 წუთია ფეხით). თუ მაინც მანქანით მოძრაობ, ეკონომ-კლასი საკმარისზე
    მეტია — ეს ქალაქის ცენტრია.
en:
  name: Kashveti Church of St George
  short: The white church facing Parliament on Rustaveli Avenue — a Samtavisi replica with Lado Gudiashvili's
    frescoes.
  body: >-
    **Kashveti stands in the middle of Rustaveli Avenue, directly opposite the Parliament building** —
    a white, lace-carved church that thousands pass daily, few knowing the story behind its name.


    Legend has it that in the 6th century the monk David of Gareja was slandered: a Tbilisi woman accused
    him of fathering her child. The monk declared she would give birth to a stone — and so she did. Hence
    "Kashveti", from the Georgian kva (stone) and shva (gave birth). Churches have replaced one another
    on this spot for centuries; the present building went up in 1904–1910 to a design by architect Leopold
    Bilfeldt, closely modelled on the 11th-century Samtavisi Cathedral.


    Worth your attention:


    - The stone carving of the facade — the Samtavisi school carried into the 20th century

    - The altar fresco painted by Lado Gudiashvili in 1947 — decorating a church cost the artist dearly
    in Soviet times

    - A quiet courtyard two steps from the avenue's noise


    The church is active, with regular services. The 9 April Park and the National Museum are next door,
    so it slots naturally into any Rustaveli walk.
  tip: >-
    Entry is free and the church is open through the day. A dress code applies: headscarves for women
    (kept by the entrance), no short shorts for anyone. During services (morning and evening) stop the
    sightseeing shuffle and stand quietly. Photography inside is frowned upon. Ten or fifteen minutes
    is enough, but give the Gudiashvili fresco its due.
  route: >-
    The church sits on Rustaveli Avenue, five minutes' walk from Freedom Square — driving here is almost
    pointless. Stopping on Rustaveli is practically impossible; leave the car at a paid lot around Freedom
    Square or at your hotel and walk, or take the metro (Rustaveli or Liberty Square stations, 5–7 minutes
    on foot from either). If you do drive, an economy car is more than enough — this is the city centre,
    all asphalt.
ru:
  name: Церковь Кашвети
  short: Белая церковь напротив парламента на проспекте Руставели — реплика Самтависи с фресками Ладо
    Гудиашвили.
  body: >-
    **Кашвети стоит в самом сердце проспекта Руставели, прямо напротив здания парламента** — белая, покрытая
    каменной резьбой церковь, мимо которой ежедневно проходят тысячи людей, и мало кто знает историю её
    имени.


    По легенде, в VI веке монаха Давида Гареджийского оклеветали: тбилисская женщина обвинила его в отцовстве.
    Монах предрёк, что она родит камень — так и случилось. Отсюда «Кашвети»: от грузинских ква (камень)
    и шва (родила). Церкви сменяли друг друга на этом месте веками; нынешнее здание построено в 1904–1910
    годах по проекту архитектора Леопольда Бильфельдта и близко повторяет собор Самтависи XI века.


    Стоит внимания:


    - Каменная резьба фасада — школа Самтависи, перенесённая в XX век

    - Алтарная фреска, написанная Ладо Гудиашвили в 1947 году: роспись церкви дорого обошлась художнику
    в советское время

    - Тихий двор в двух шагах от шума проспекта


    Церковь действующая, службы идут регулярно. Рядом парк 9 Апреля и Национальный музей — Кашвети естественно
    встраивается в любую прогулку по Руставели.
  tip: >-
    Вход бесплатный, церковь открыта в течение дня. Действует дресс-код: платки для женщин (лежат у входа),
    короткие шорты не подойдут никому. Во время служб (утром и вечером) остановите туристическую суету
    и постойте тихо. Фотографировать внутри не принято. Десяти-пятнадцати минут достаточно, но фреске
    Гудиашвили уделите время.
  route: >-
    Церковь стоит на проспекте Руставели, в пяти минутах ходьбы от площади Свободы — ехать сюда на машине
    почти бессмысленно. Остановиться на Руставели практически невозможно; оставьте автомобиль на платной
    парковке у площади Свободы или у отеля и идите пешком, либо приезжайте на метро (станции «Руставели»
    или «Площадь Свободы», от обеих 5–7 минут). Если всё же за рулём — эконом-класса более чем достаточно,
    это центр города.
fa:
  name: کلیسای کاشوتی (سنت گئورگ)
  short: کلیسای سفید روبه‌روی پارلمان در خیابان روستاولی — بازآفرینی سامتاویسی با دیوارنگاره‌های لادو
    گودیاشویلی.
  body: >-
    **کاشوتی در قلب خیابان روستاولی، درست روبه‌روی ساختمان پارلمان ایستاده است** — کلیسایی سفید با حجاری‌های
    تورمانند که روزانه هزاران نفر از کنارش می‌گذرند و کمتر کسی داستان نامش را می‌داند.


    بنا بر افسانه، در سدهٔ ششم به راهبی به نام داوید گارجلی تهمت زدند: زنی تفلیسی او را پدر فرزندش خواند.
    راهب گفت آن زن سنگ خواهد زایید — و چنین شد. نام «کاشوتی» از همین‌جاست: از واژه‌های گرجی «کوا» (سنگ)
    و «شوا» (زایید). قرن‌ها کلیساها در این نقطه جای یکدیگر را گرفتند؛ بنای کنونی در ۱۹۰۴–۱۹۱۰ به طرح معمار
    لئوپولد بیلفلد ساخته شد و از کلیسای جامع سامتاویسی متعلق به سدهٔ یازدهم الگو گرفته است.


    دیدنی‌ها:


    - حجاری سنگی نما — ادامهٔ مکتب سامتاویسی در سدهٔ بیستم

    - دیوارنگارهٔ محراب، کار لادو گودیاشویلی در ۱۹۴۷ — نقاشی کلیسا در دوران شوروی برای هنرمند گران تمام
    شد

    - حیاطی آرام، دو قدم دورتر از هیاهوی خیابان


    کلیسا فعال است و مراسم به‌طور منظم برگزار می‌شود. پارک ۹ آوریل و موزهٔ ملی همسایهٔ آن‌اند و کاشوتی
    به‌طبع در هر پیاده‌روی روستاولی جا می‌گیرد.
  tip: >-
    ورود رایگان است و کلیسا در طول روز باز است. پوشش مناسب الزامی است: روسری برای بانوان (کنار در گذاشته
    شده) و شلوارک کوتاه برای هیچ‌کس مناسب نیست. هنگام مراسم (صبح و عصر) از گشت‌وگذار توریستی دست بکشید
    و آرام بایستید. عکاسی در داخل خوشایند نیست. ده تا پانزده دقیقه کافی است، اما به دیوارنگارهٔ گودیاشویلی
    وقت بدهید.
  route: >-
    کلیسا در خیابان روستاولی است، پنج دقیقه پیاده از میدان آزادی — رانندگی تا اینجا تقریباً بی‌معناست.
    توقف در روستاولی عملاً ناممکن است؛ خودرو را در پارکینگ پولی اطراف میدان آزادی یا هتل بگذارید و پیاده
    بروید، یا با مترو بیایید (ایستگاه روستاولی یا میدان آزادی، از هر دو ۵ تا ۷ دقیقه پیاده). اگر با خودرو
    آمدید، اقتصادی بیش از کافی است — اینجا مرکز شهر است و تماماً آسفالت.
he:
  name: כנסיית קשווטי (גאורגי הקדוש)
  short: הכנסייה הלבנה מול הפרלמנט בשדרות רוסתוולי — העתק של סמטוויסי עם ציורי הקיר של לאדו גודיאשווילי.
  body: >-
    **קשווטי עומדת בלב שדרות רוסתוולי, ממש מול בניין הפרלמנט** — כנסייה לבנה מעוטרת בגילופי אבן דמויי
    תחרה, שאלפים חולפים על פניה מדי יום ומעטים מכירים את הסיפור שמאחורי שמה.


    לפי האגדה, במאה ה-6 הועלל על הנזיר דוד מגארג'ה עלילה: אישה מטביליסי טענה שהוא אבי ילדהּ. הנזיר הכריז
    שהיא תלד אבן — וכך היה. מכאן «קשווטי», מהמילים הגאורגיות קווה (אבן) ושווה (ילדה). כנסיות התחלפו במקום
    הזה במשך מאות שנים; הבניין הנוכחי הוקם ב-1904–1910 לפי תוכניתו של האדריכל לאופולד בילפלדט, בהשראה
    צמודה של קתדרלת סמטוויסי מן המאה ה-11.


    שווה תשומת לב:


    - גילוף האבן של החזית — אסכולת סמטוויסי שהועברה אל המאה ה-20

    - ציור המזבח שצייר לאדו גודיאשווילי ב-1947 — עיטור כנסייה עלה לאמן ביוקר בתקופה הסובייטית

    - חצר שקטה, שני צעדים מרעש השדרה


    הכנסייה פעילה ותפילות מתקיימות בקביעות. פארק 9 באפריל והמוזיאון הלאומי סמוכים, כך שקשווטי משתלבת טבעית
    בכל טיול ברוסתוולי.
  tip: >-
    הכניסה חינם והכנסייה פתוחה לאורך היום. יש קוד לבוש: מטפחות ראש לנשים (מונחות בכניסה), מכנסיים קצרים
    לא מתאימים לאיש. בזמן תפילה (בוקר וערב) עצרו את שוטטות התיירים ועמדו בשקט. צילום בפנים אינו מקובל.
    עשר עד חמש עשרה דקות מספיקות, אבל הקדישו זמן לציור של גודיאשווילי.
  route: >-
    הכנסייה נמצאת בשדרות רוסתוולי, חמש דקות הליכה מכיכר החירות — לנסוע לכאן ברכב כמעט חסר טעם. עצירה ברוסתוולי
    בלתי אפשרית למעשה; השאירו את הרכב בחניון בתשלום סביב כיכר החירות או במלון ולכו ברגל, או בואו במטרו
    (תחנת רוסתוולי או כיכר החירות, 5–7 דקות הליכה משתיהן). אם בכל זאת נוהגים — רכב חסכוני מספיק ויותר,
    זהו מרכז העיר.
ar:
  name: كنيسة كاشفيتي (القديس جاورجيوس)
  short: الكنيسة البيضاء قبالة البرلمان في جادة روستافيلي — نسخة عن سامتافيسي بجداريات لادو غودياشفيلي.
  body: >-
    **تقف كاشفيتي في قلب جادة روستافيلي، قبالة مبنى البرلمان مباشرة** — كنيسة بيضاء مكسوّة بنقوش حجرية
    كالمخرّمات، يمرّ بها آلاف الناس يومياً وقليلون يعرفون الحكاية وراء اسمها.


    تقول الأسطورة إن الراهب داود الغاريجي اتُّهم زوراً في القرن السادس: زعمت امرأة من تبليسي أنه والد
    طفلها. فأعلن الراهب أنها ستلد حجراً — وهكذا كان. من هنا جاء اسم «كاشفيتي»، من الكلمتين الجورجيتين
    «كفا» (حجر) و«شفا» (ولدت). تعاقبت الكنائس على هذا الموضع قروناً؛ أما البناء الحالي فشُيّد بين 1904
    و1910 بتصميم المعماري ليوبولد بيلفلدت، على غرار كاتدرائية سامتافيسي من القرن الحادي عشر.


    يستحق الانتباه:


    - النقش الحجري للواجهة — مدرسة سامتافيسي منقولة إلى القرن العشرين

    - جدارية الهيكل التي رسمها لادو غودياشفيلي عام 1947 — وقد كلّف تزيين كنيسةٍ الفنانَ غالياً في الزمن
    السوفيتي

    - فناء هادئ على خطوتين من ضجيج الجادة


    الكنيسة عامرة والقداديس تقام بانتظام. حديقة التاسع من أبريل والمتحف الوطني جاران لها، فتدخل كاشفيتي
    طبيعياً في أي جولة على روستافيلي.
  tip: >-
    الدخول مجاني والكنيسة مفتوحة نهاراً. ثمة قواعد لباس: غطاء رأس للنساء (موضوع عند المدخل)، والشورت القصير
    لا يليق بأحد. أثناء القداس (صباحاً ومساءً) أوقف جولة السائح وقف بهدوء. التصوير في الداخل غير محبّذ.
    تكفي عشر دقائق إلى ربع ساعة، لكن أعطِ جدارية غودياشفيلي حقها.
  route: >-
    تقع الكنيسة على جادة روستافيلي، على بعد خمس دقائق سيراً من ساحة الحرية — والقيادة إلى هنا تكاد تكون
    بلا معنى. التوقف على روستافيلي شبه مستحيل؛ اترك السيارة في موقف مدفوع حول ساحة الحرية أو عند الفندق
    وامشِ، أو تعال بالمترو (محطة روستافيلي أو ساحة الحرية، 5–7 دقائق سيراً من كلتيهما). وإن قدت سيارتك
    فالاقتصادية أكثر من كافية — هذا وسط المدينة والطرق كلها معبّدة.
