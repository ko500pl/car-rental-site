ka:
  name: ქაშვეთის წმინდა გიორგის ეკლესია
  short: >-
    ქვის ტაძარი რუსთაველზე, პარლამენტის პირდაპირ: თქმულება სახელში, სამთავისი ხაზებში და მოხატულობა, რომელიც
    ლადო გუდიაშვილს ძვირად დაუჯდა.
  body: >-
    **ქაშვეთის სახელში ცილისწამება, სასწაული და ქვა იმალება.** გადმოცემით, VI საუკუნეში ცამეტ ასურელ მამათაგანი,
    დავით გარეჯელი, მთაწმინდაზე, ქალაქის თავზე მდებარე მღვიმიდან ყოველ ხუთშაბათს თბილისში საქადაგებლად
    ჩამოდიოდა. მისმა მტრებმა, მაზდეანებმა, ფეხმძიმე ქალი მოისყიდეს, რომელმაც ბერს ხალხის თვალწინ სიძვა
    დასწამა. დავითმა ქალს მუცელზე კვერთხი შეახო და ჰკითხა, ვინ იყო ბავშვის მამა, მუცლიდან კი ხმა გაისმა:
    „მამა მჭედელიაო“. ერთი ვერსიით, ხალხმა ცილისმწამებელი ქვებით ჩაქოლა და ადგილს „ქვათაშუეთი“ შეერქვა;
    უფრო ცნობილი თქმულებით კი ქალმა ყრმის ნაცვლად ქვა შვა, აქედან წარმოდგა „ქვაშვეთი“, ანუ ქაშვეთი.


    ამ ადგილას ეკლესიები ერთმანეთს ენაცვლებოდა. 1753 წელს თავადმა გივი ამილახვარმა წმინდა გიორგის ეკლესია
    საძირკვლიდან ახლად, აგურით ააგო: ნახევრად ტაძარი, ნახევრად ციხე, კედლებში სამალავითა და სათოფურებით.
    დღევანდელი ტაძარი 1904–1910 წლებში აშენდა ლეოპოლდ ბილფელდის პროექტით, რომელმაც ნიმუშად XI საუკუნის
    სამთავისის ტაძარი აიღო; მდიდრულ ჩუქურთმაზე ძმები აღლაძეები მუშაობდნენ.


    შიგნით მოხატულობა ლადო გუდიაშვილს ეკუთვნის და მეორე მსოფლიო ომის შემდეგ, 1946–1947 წლებში შეიქმნა.
    საბჭოთა კავშირში აღიარებული მხატვრისთვის ეკლესიის მოხატვა სარისკო ნაბიჯი იყო და მან ეს ძვირად გადაიხადა:
    კომუნისტური პარტიიდან გარიცხეს და თბილისის სამხატვრო აკადემიიდან, სადაც 1926 წლიდან ასწავლიდა, დაითხოვეს.


    ეკლესიის ეზოში განისვენებენ პოეტი გრიგოლ ორბელიანი და დავით სარაჯიშვილი, ქართული კონიაკის ფუძემდებელი.
    ჭიშკარს გასცდებით და რუსთაველი ისევ გუგუნებს, გზის გადაღმა პარლამენტი დგას, თქვენ კი მიდიხართ და იცით
    ის, რაც ამ ნაკადმა არ იცის.
  tip: >-
    შესვლა უფასოა, ეკლესია მთელი დღე ღიაა. ჩაიცვით მოკრძალებულად: ქალები თავს იფარავენ (თავსაფრები, როგორც
    წესი, კართან ელაგება) და ქვედაბოლოს იცვამენ, მამაკაცებმა შორტი სხვა დღისთვის შემოინახონ. წირვა დილით
    და საღამოს აღევლინება; ამ დროს ბოლოში ჩუმად დადექით და კამერა შეინახეთ, შიგნით გადაღება კი საერთოდ
    არ არის მიღებული. ათი-თხუთმეტი წუთი საკმარისია, მაგრამ გუდიაშვილის მოხატულობას აუჩქარებლად შეხედეთ
    და ტაძარს გარედანაც შემოუარეთ, ჩუქურთმის სანახავად. 9 აპრილის ბაღი და ეროვნული გალერეა იქვეა, გვერდით.
  route: >-
    ქაშვეთი რუსთაველის გამზირზე, პარლამენტის პირდაპირ დგას, თავისუფლების მოედნიდან რამდენიმე წუთის სავალზე,
    ასე რომ, აქ მანქანით მოსვლას დიდი აზრი არ აქვს. თავად რუსთაველზე გაჩერება თითქმის შეუძლებელია. მანქანა
    თავისუფლების მოედნის მიდამოებში, ფასიან სადგომზე ან სასტუმროსთან დატოვეთ და ფეხით მოდით, ან მეტროთი
    ჩამოდით „თავისუფლების მოედნამდე“ ან „რუსთაველამდე“: ორივედან ხუთიდან ათ წუთამდე სავალია. თუ მაინც
    მანქანით ჩაივლით, ეკონომკლასი საკმარისზე მეტია: ეს ქალაქის ცენტრია, ყველგან ასფალტი, ერთადერთი გამოწვევა
    კი ადგილის პოვნაა.
en:
  name: Kashveti Church of St George
  short: >-
    The stone church facing Parliament on Rustaveli: a legend in its name, Samtavisi in its lines, and
    paintings that cost Lado Gudiashvili his post.
  body: >-
    **The name Kashveti hides a slander, a miracle and a stone.** Tradition says that in the sixth century
    David of Gareja, one of the Thirteen Assyrian Fathers, came down every Thursday from his cave on Mtatsminda,
    the mountain above the city, to preach in Tbilisi. His enemies, the Mazdaeans, bribed a pregnant woman
    to accuse him in public of fathering her child. The monk touched her belly with his staff and asked
    who the father was, and a voice from the womb replied: the blacksmith. In one telling the crowd stoned
    the woman; in the better-known one she gave birth to a stone, kva shva, 'she bore a stone', and the
    place took its name.


    Churches have succeeded one another here. In 1753 Prince Givi Amilakhvari rebuilt the church of St
    George in brick from its foundations: half sanctuary, half fortress, with a hiding place and gun slits
    in its walls. The present building rose between 1904 and 1910 to a design by Leopold Bilfeldt, who
    took the eleventh-century cathedral of Samtavisi as his model, while the Agladze brothers worked on
    its rich carved ornament.


    Inside, the paintings are by Lado Gudiashvili, made just after the Second World War, in 1946–1947.
    For a celebrated Soviet artist to decorate a church was a risk, and he paid for it: he was expelled
    from the Communist Party and dismissed from the Tbilisi Academy of Arts, where he had taught since
    1926.


    The churchyard holds the poet Grigol Orbeliani and David Sarajishvili, the pioneer of Georgian brandy.
    Step back through the gate and Rustaveli roars on, Parliament across the road, and you walk away knowing
    what the traffic does not.
  tip: >-
    Entry is free and the church is open through the day. Dress modestly: women cover their heads (scarves
    are usually left by the door) and wear skirts; men leave the shorts for later. Services are held in
    the morning and the evening; during them stand quietly at the back and put the camera away, and photography
    inside is frowned upon at any time. Ten or fifteen minutes is enough, but give Gudiashvili's paintings
    a slow look and walk round the outside to see the carving. The 9 April Garden and the National Gallery
    are right next door.
  route: >-
    Kashveti stands on Rustaveli Avenue opposite Parliament, a few minutes' walk from Freedom Square,
    so driving here makes little sense. Stopping on Rustaveli itself is practically impossible. Leave
    the car in a paid car park around Freedom Square or at your hotel and walk, or take the metro to Liberty
    Square or Rustaveli station, each five to ten minutes away on foot. If you are passing through by
    car anyway, an economy car is more than enough: this is the city centre, asphalt everywhere, and the
    only real challenge is finding somewhere to park.
ru:
  name: Церковь Святого Георгия Кашвети
  short: >-
    Каменная церковь напротив Парламента на Руставели: легенда в имени, Самтависи в очертаниях и росписи,
    стоившие Ладо Гудиашвили должности.
  body: >-
    **В имени Кашвети спрятаны клевета, чудо и камень.** Предание рассказывает, что в VI веке Давид Гареджийский,
    один из Тринадцати сирийских отцов, каждый четверг спускался из своей пещеры на Мтацминде, горе над
    городом, чтобы проповедовать в Тбилиси. Враги-маздеисты подкупили беременную женщину, чтобы она прилюдно
    обвинила его в отцовстве её ребёнка. Монах коснулся её живота посохом и спросил, кто отец, и голос
    из утробы ответил: кузнец. По одной версии, толпа побила женщину камнями; по другой, более известной,
    она родила камень — «ква шва», «родила камень», — и место получило своё имя.


    Церкви здесь сменяли одна другую. В 1753 году князь Гиви Амилахвари заново, от самого основания, отстроил
    в кирпиче церковь Святого Георгия — наполовину святилище, наполовину крепость, с тайником и ружейными
    бойницами в стенах. Нынешнее здание возведено в 1904–1910 годах по проекту Леопольда Бильфельда, взявшего
    за образец собор Самтависи XI века, а над богатым резным декором работали братья Агладзе.


    Внутри — росписи Ладо Гудиашвили, созданные сразу после Второй мировой войны, в 1946–1947 годах. Для
    прославленного советского художника расписывать церковь было риском, и он за это поплатился: его исключили
    из Коммунистической партии и уволили из Тбилисской академии художеств, где он преподавал с 1926 года.


    На церковном дворе похоронены поэт Григол Орбелиани и Давид Сараджишвили, основоположник грузинского
    коньячного дела. Выйдите за ворота — и Руставели снова ревёт, через дорогу Парламент, а вы уходите,
    зная то, чего не знает поток машин.
  tip: >-
    Вход свободный, церковь открыта весь день. Одевайтесь скромно: женщины покрывают голову (платки обычно
    лежат у двери) и надевают юбку; мужчинам шорты лучше приберечь на потом. Службы идут утром и вечером;
    в это время тихо стойте позади и уберите камеру, да и в любое другое время съёмку внутри не одобряют.
    Десяти-пятнадцати минут достаточно, но не торопитесь с росписями Гудиашвили и обойдите храм снаружи,
    чтобы рассмотреть резьбу. Сад 9 Апреля и Национальная галерея — совсем рядом.
  route: >-
    Кашвети стоит на проспекте Руставели напротив Парламента, в нескольких минутах ходьбы от площади Свободы,
    так что ехать сюда на машине особого смысла нет. Остановиться на самом Руставели практически невозможно.
    Оставьте машину на платной парковке у площади Свободы или у отеля и идите пешком либо доезжайте на
    метро до станции «Площадь Свободы» или «Руставели» — от каждой пять-десять минут пешком. Если вы всё
    же проезжаете мимо на машине, эконом-класса более чем достаточно: это центр города, везде асфальт,
    и единственная настоящая трудность — найти, где встать.
fa:
  name: کلیسای سنت گئورگی کاشوتی
  short: >-
    کلیسای سنگی روبه‌روی پارلمان در خیابان روستاولی: افسانه‌ای در نامش، سامتاویسی در خطوطش، و نقاشی‌هایی
    که به بهای شغل لادو گودیاشویلی تمام شد.
  body: >-
    **نام کاشوتی تهمتی، معجزه‌ای و سنگی را در خود پنهان کرده است.** روایت است که در سدهٔ ششم، داوید گارجی،
    یکی از سیزده پدر آشوری، هر پنجشنبه از غارش در متاتسمیندا، کوهی بر فراز شهر، پایین می‌آمد تا در تفلیس
    موعظه کند. دشمنانش، مزداپرستان، به زنی باردار رشوه دادند تا در برابر مردم او را متهم کند که پدر فرزندش
    است. راهب با عصایش شکم زن را لمس کرد و پرسید پدر کیست، و صدایی از درون زهدان پاسخ داد: آهنگر. در یک
    روایت، مردم زن را سنگسار کردند؛ در روایت مشهورتر، او سنگی زایید، «کوا شوا»، یعنی «سنگ زایید»، و نام
    این مکان از همین آمد.


    کلیساها در اینجا یکی پس از دیگری جای هم را گرفته‌اند. در ۱۷۵۳ شاهزاده گیوی آمیلاخواری کلیسای سنت گئورگی
    را از پی با آجر از نو ساخت: نیمی پرستشگاه و نیمی دژ، با نهانگاه و مزغل‌هایی برای تفنگ در دیوارهایش.
    بنای کنونی میان ۱۹۰۴ و ۱۹۱۰ بر پایهٔ طرح لئوپولد بیلفلدت برپا شد که کلیسای جامع سامتاویسی از سدهٔ
    یازدهم را الگو گرفت، و برادران آگلادزه روی تزیینات کنده‌کاری پرکار آن کار کردند.


    درون، نقاشی‌ها کار لادو گودیاشویلی است که درست پس از جنگ جهانی دوم، در ۱۹۴۶–۱۹۴۷، کشیده شد. برای هنرمند
    نامدار شوروی آراستن کلیسا خطر کردن بود و او بهایش را پرداخت: از حزب کمونیست اخراج شد و از آکادمی هنرهای
    تفلیس، که از ۱۹۲۶ در آن درس می‌داد، برکنار شد.


    در حیاط کلیسا گریگول اوربلیانیِ شاعر و داوید ساراجیشویلی، پیشگام براندی گرجی، به خاک سپرده شده‌اند.
    از دروازه که بیرون بیایید، روستاولی دوباره می‌غرد و پارلمان آن‌سوی خیابان است، و شما دور می‌شوید در
    حالی که چیزی می‌دانید که این ترافیک نمی‌داند.
  tip: >-
    ورود رایگان است و کلیسا در طول روز باز است. پوشیده لباس بپوشید: زنان سر را می‌پوشانند (معمولاً روسری‌هایی
    کنار در گذاشته‌اند) و دامن به تن می‌کنند؛ مردان شلوارک را برای بعد بگذارند. مراسم صبح و عصر برگزار
    می‌شود؛ در این هنگام آرام در انتهای کلیسا بایستید و دوربین را کنار بگذارید، و عکاسی در داخل در هیچ
    زمانی پسندیده نیست. ده تا پانزده دقیقه کافی است، اما نقاشی‌های گودیاشویلی را با حوصله تماشا کنید و
    گرداگرد بنا قدم بزنید تا کنده‌کاری‌ها را ببینید. باغ ۹ آوریل و گالری ملی درست همسایهٔ آن‌اند.
  route: >-
    کاشوتی در خیابان روستاولی روبه‌روی پارلمان است، چند دقیقه پیاده از میدان آزادی، پس رانندگی تا اینجا
    چندان معنایی ندارد. توقف در خود خیابان روستاولی عملاً ناممکن است. خودرو را در پارکینگی پولی در اطراف
    میدان آزادی یا در هتل‌تان بگذارید و پیاده بیایید، یا با مترو به ایستگاه میدان آزادی یا روستاولی بروید؛
    هر یک پنج تا ده دقیقه پیاده فاصله دارد. اگر به هر حال با خودرو از اینجا می‌گذرید، خودروی کلاس اقتصادی
    بیش از کافی است: اینجا مرکز شهر است، همه‌جا آسفالت، و تنها چالش واقعی پیدا کردن جای پارک است.
he:
  name: כנסיית קשווטי (גאורגיוס הקדוש)
  short: 'כנסיית האבן מול הפרלמנט בשדרות רוסתאוולי: אגדה בשמה, סמטביסי בקוויה, וציורים שעלו ללאדו גודיאשווילי
    במשרתו.'
  body: >-
    **בשם קשווטי מסתתרים עלילת שקר, נס ואבן.** המסורת מספרת שבמאה ה-6 היה דוד מגארג'ה, אחד משלושה-עשר
    האבות האשורים, יורד מדי יום חמישי מן המערה שלו במתצמינדה, ההר שמעל העיר, כדי להטיף בטביליסי. אויביו,
    המזדאיסטים, שיחדו אישה הרה שתאשים אותו בפומבי שהוא אבי ילדה. הנזיר נגע בבטנה במקלו ושאל מי האב, וקול
    מן הרחם השיב: הנפח. לפי גרסה אחת ההמון סקל את האישה באבנים; לפי הגרסה המוכרת יותר היא ילדה אבן — "קווה
    שווה", "ילדה אבן" — ועל שם כך נקרא המקום.


    כנסיות התחלפו כאן זו אחר זו. ב-1753 בנה הנסיך גיבי אמילחוורי מחדש, מן היסודות ובלבנים, את כנסיית גאורגיוס
    הקדוש: חציה מקדש וחציה מבצר, עם מחבוא וחרכי ירי בקירותיה. המבנה הנוכחי קם בין 1904 ל-1910 לפי תכנונו
    של ליאופולד בילפלדט, שלקח לו לדגם את קתדרלת סמטביסי מהמאה ה-11, ואילו האחים אגלאדזה עבדו על עיטורי
    הגילוף העשירים שלו.


    בפנים, הציורים הם של לאדו גודיאשווילי, והם נעשו מיד אחרי מלחמת העולם השנייה, ב-1946–1947. לצייר סובייטי
    מהולל, לעטר כנסייה היה סיכון, והוא שילם עליו: הוא גורש מהמפלגה הקומוניסטית ופוטר מהאקדמיה לאמנויות
    של טביליסי, שבה לימד מאז 1926.


    בחצר הכנסייה קבורים המשורר גריגול אורבליאני ודוד סרג'ישווילי, חלוץ הברנדי הגאורגי. צאו בחזרה דרך השער,
    ושדרות רוסתאוולי שוב שואגות, הפרלמנט מעבר לכביש, ואתם מתרחקים ויודעים את מה שהתנועה אינה יודעת.
  tip: >-
    הכניסה חינם והכנסייה פתוחה במשך היום. התלבשו בצניעות: נשים מכסות את הראש (בדרך כלל יש מטפחות ליד הדלת)
    ולובשות חצאית; גברים ישאירו את המכנסיים הקצרים להמשך היום. תפילות מתקיימות בבוקר ובערב; בזמנן עמדו
    בשקט מאחור והכניסו את המצלמה לתיק, וגם בשאר הזמן לא מקובל לצלם בפנים. עשר עד חמש עשרה דקות מספיקות,
    אבל הקדישו מבט איטי לציורי גודיאשווילי והקיפו את המבנה מבחוץ כדי לראות את הגילופים. גן 9 באפריל והגלריה
    הלאומית נמצאים ממש בסמוך.
  route: >-
    קשווטי ניצבת בשדרות רוסתאוולי מול הפרלמנט, כמה דקות הליכה מכיכר החירות, כך שאין הרבה טעם לבוא לכאן
    ברכב. לעצור ברוסתאוולי עצמה כמעט בלתי אפשרי. השאירו את הרכב בחניון בתשלום סביב כיכר החירות או במלון
    והגיעו ברגל, או סעו במטרו לתחנת כיכר החירות או לתחנת רוסתאוולי, כל אחת מהן חמש עד עשר דקות הליכה.
    אם בכל זאת אתם עוברים כאן ברכב, רכב מקטגוריית אקונומי מספיק ויותר: זה מרכז העיר, אספלט בכל מקום, והאתגר
    האמיתי היחיד הוא למצוא חניה.
ar:
  name: كنيسة كاشفيتي للقديس جاورجيوس
  short: >-
    الكنيسة الحجرية قبالة البرلمان في شارع روستافيلي: أسطورة في اسمها، وسامتافيسي في خطوطها، ورسوم كلّفت
    لادو غودياشفيلي منصبه.
  body: >-
    **يخفي اسم كاشفيتي افتراءً ومعجزة وحجراً.** تقول الرواية إن داود الغاريجي، أحد الآباء الآشوريين الثلاثة
    عشر، كان في القرن السادس ينزل كل خميس من مغارته في متاتسميندا، الجبل المطل على المدينة، ليعظ في تبليسي.
    فرشا أعداؤه من أتباع الديانة المزدية امرأة حاملاً لتتهمه علناً بأنه أبو جنينها. فلمس الراهب بطنها
    بعصاه وسأل عن الأب، فأجاب صوت من الرحم: الحداد. وفي إحدى الروايات رجم الجمع المرأة بالحجارة، وفي الرواية
    الأشهر ولدت حجراً، «كفا شفا» أي «ولدت حجراً»، ومن هنا أخذ المكان اسمه.


    توالت الكنائس في هذا الموضع. ففي عام 1753 أعاد الأمير غيفي أميلاخفاري بناء كنيسة القديس جاورجيوس بالآجر
    من أساسها: نصفها معبد ونصفها حصن، فيها مخبأ وفتحات للبنادق في جدرانها. أما المبنى الحالي فشُيّد بين
    عامي 1904 و1910 وفق تصميم ليوبولد بيلفيلدت، الذي اتخذ كاتدرائية سامتافيسي من القرن الحادي عشر نموذجاً،
    فيما عمل الإخوة أغلادزه على زخارفه المنحوتة الغنية.


    وفي الداخل رسوم لادو غودياشفيلي، أنجزها بعد الحرب العالمية الثانية مباشرة، في 1946–1947. كان تزيين
    كنيسة مجازفة لفنان سوفييتي مشهور، وقد دفع ثمنها: فُصل من الحزب الشيوعي وطُرد من أكاديمية تبليسي للفنون
    التي كان يدرّس فيها منذ 1926.


    وفي فناء الكنيسة يرقد الشاعر غريغول أوربلياني وداود ساراجيشفيلي، رائد البراندي الجورجي. اخرج من البوابة،
    فيعود شارع روستافيلي إلى هديره، والبرلمان على الجانب الآخر من الطريق، وتمضي وأنت تعرف ما لا تعرفه
    زحمة السير.
  tip: >-
    الدخول مجاني والكنيسة مفتوحة طوال النهار. البس ثياباً محتشمة: تغطي النساء رؤوسهن (تُترك الأوشحة عادةً
    عند الباب) ويرتدين التنانير، ويؤجل الرجال السراويل القصيرة لوقت لاحق. تقام الصلوات صباحاً ومساءً؛
    فقف خلالها بهدوء في الخلف وضع الكاميرا جانباً، والتصوير في الداخل غير مستحب في أي وقت. تكفي عشر دقائق
    أو ربع ساعة، لكن تأمل رسوم غودياشفيلي على مهل ودُر حول المبنى من الخارج لترى النقوش. وحديقة 9 أبريل
    والمعرض الوطني على مقربة مباشرة.
  route: >-
    تقع كاشفيتي في شارع روستافيلي قبالة البرلمان، على بعد دقائق سيراً من ساحة الحرية، فلا معنى كبيراً
    للمجيء بالسيارة. والتوقف في شارع روستافيلي نفسه شبه مستحيل. اترك السيارة في موقف مدفوع حول ساحة الحرية
    أو في فندقك وتعال سيراً، أو خذ المترو إلى محطة ساحة الحرية أو محطة روستافيلي، وكل منهما على بعد خمس
    إلى عشر دقائق مشياً. وإن كنت مارّاً بالسيارة على أي حال، فالسيارة الاقتصادية تكفي وتزيد: هذا وسط المدينة،
    والأسفلت في كل مكان، والتحدي الحقيقي الوحيد هو إيجاد مكان للوقوف.
