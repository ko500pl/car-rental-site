ka:
  name: მაჭახელას ეროვნული პარკი
  short: >-
    კოლხური ტყით შემოსილი ხეობა თურქეთის საზღვართან, სადაც ოდესღაც სტამბოლამდე სახელგანთქმულ კაჟიან თოფებს
    ჭედავდნენ.
  body: >-
    **ძველი აჭარელი მელექსეები ამბობდნენ, კარგი თოფი მხოლოდ ორ ადგილას კეთდებაო: „ან მაჭახელა, ან სტამბოლი“.**


    ეს თქმა ზაქარია ჭიჭინაძემ XIX საუკუნის ბოლოს ჩაიწერა. მაჭახლური კაჟიანი თოფი XVIII საუკუნის მეორე
    ნახევრიდან იხსენიება: მას გურიაში, იმერეთსა და სამეგრელოში ატარებდნენ, სტამბოლელი ფაშებიც კი დიდად
    აფასებდნენ. საუკეთესო, „თოფხანე“, ხრახნილლულიანი იყო, ვერცხლითა და ძვლით მოოჭვილი; გლუვლულიანი „ნალფარა“
    გაცილებით იაფი ღირდა. რუსი სამხედრო კორესპონდენტის ანგარიშით, პირველი 75 მანეთი ღირდა, მეორე კი 20.
    1878 წლის შემდეგ ბევრი ოსტატი მუჰაჯირად გადაიხვეწა ოსმალეთში, ბაზარი იაფმა ქარხნულმა თოფმა დაიპყრო
    და სამჭედლოები გაცივდა. დღეს მაჭახლურ თოფს ზედა ჩხუტუნეთის ისტორიულ-ეთნოგრაფიულ მუზეუმში ნახავთ, ხეობის
    შესასვლელთან კი სოფლელებმა მას ძეგლი დაუდგეს.


    ძნელაძეების საგვარეულო გადმოცემით, მაჭახლური თოფი მათმა წინაპარმა, ზედა ჩხუტუნეთელმა უსტა სალიხმა
    მოიგონა; სხვები ამ პატივს ქავთარაძეებს ან ნაგერვაძეებს მიაწერენ, ერთი ვერსია კი დავას ასე აგვარებს:
    „თოფი ძნელაძემ მოიგონა, წამალი — ქავთარაძემ“.


    1921 წელს საბჭოთა-თურქეთის ახალმა საზღვარმა მაჭახელი ორად გაჭრა. ზემო სოფლები, მათ შორის ჯამილი, თურქეთში
    დარჩა; მათი ტყე 2005 წლიდან იუნესკოს ბიოსფერული რეზერვატია. ქვემო მაჭახელი საქართველოს ერგო და 2012
    წელს პარლამენტმა მისი ტყიანი ფერდობები ეროვნულ პარკად გამოაცხადა.


    ტყე კოლხურია: ბზა, წაბლი, წიფელი, რცხილა და მურყანი გზასა და მდინარეს თაღად ეხურება. პარკის ადმინისტრაციიდან
    ორ კილომეტრში ცხემლარის ხიდი დგას: მისი ვიწრო თაღი ერთ ნაპირზე შიშველი კლდიდან ამოდის, მეორეზე კი
    ნაშენ ბურჯს ეყრდნობა. სოფელი ამ ხიდით 1960-იან წლებამდე, ახლის აშენებამდე, დადიოდა. ასეთ ხიდებს აქ
    „თამარის ხიდებს“ უწოდებენ, თუმცა ეს ხალხური სახელია და არა მშენებლობის მატიანე.


    კოკოლეთის გადასახედიდან პირდაპირ ჯამილს უყურებთ: იგივე მდინარე, იგივე ტყე, სხვა ქვეყანა.
  tip: >-
    ვიზიტორთა ცენტრი აჭარისაღმართში 09:00–18:00 საათებში მუშაობს, სეზონი კი მაისიდან ოქტომბრამდე გრძელდება.
    ხეობის გზიდან ორი ბილიკი იწყება. მთავარანგელოზის ბილიკი (9 კმ, დაახლოებით ოთხი საათი) ბათუმის ხედებამდე
    ადის. კოკოლეთის ბილიკი (15 კმ, დაახლოებით ექვსი საათი) საზღვარს მიუყვება და პარკის ადმინისტრაციის
    ნებართვას საჭიროებს, სულ მცირე ხუთი სამუშაო დღით ადრე, ამიტომ პასპორტი თან იქონიეთ. ზედა ჩხუტუნეთის
    მეიარაღეთა მუზეუმში შესვლა 10 ლარი ღირს. წვიმა ნებისმიერ თვეს მოსალოდნელია, ქვეტყეში კი ტკიპაა: ჩაიცვით
    გრძელი შარვალი და დახურული ფეხსაცმელი. ოქტომბერში ხეობა „მაჭახელობას“ მართავს, ხალხურ დღესასწაულს
    ადგილობრივი ნაწარმისა და ხელნაკეთი ნივთების ბაზრობით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ ს12-ით ლანჩხუთის გავლით
    ზღვისპირა გრიგოლეთამდე, იქიდან კი ს2-ით სამხრეთით, ქობულეთის გავლით, ბათუმამდე. ბათუმიდან ჭოროხს დაახლოებით
    20 კილომეტრი აუყევით, მაჭახლისწყლის შესართავამდე, გვარის ციხესთან, და გვერდით ხეობაში შეუხვიეთ. ვიზიტორთა
    ცენტრი ბათუმიდან დაახლოებით 30 კმ-შია: თბილისიდან სულ დაახლოებით 400 კმ და ექვსი საათი და თხუთმეტი
    წუთი. ქვედა სოფლებში გზა ასფალტიანია, კოკოლეთისკენ კი ხრეშსა და ორმოებზე გადადის. წვიმის შემდეგ ამ
    ზედა მონაკვეთზე მაღალი გამავლობის ავტომობილი თავს იმართლებს. საწვავი ბათუმში ჩაასხით: ხეობაში ბენზინგასამართი
    სადგური არ არის.
en:
  name: Machakhela National Park
  short: >-
    A Colchic forest valley on the Turkish border, where gunsmiths once forged flintlocks prized as far
    away as Istanbul.
  body: >-
    **A good gun, the old poets of Adjara used to say, came from one of two places: Machakhela or Istanbul.**


    Zakaria Chichinadze wrote the saying down in the late nineteenth century. Machakhela flintlocks, known
    from the second half of the 18th century, were carried across Guria, Imereti and Samegrelo and prized
    in the houses of Istanbul pashas. The finest, the tophane, had a rifled barrel inlaid with silver
    and bone; the smooth-bore nalpara was the cheap version: 75 roubles against 20, by one Russian military
    correspondent's reckoning. After 1878 many master smiths emigrated to the Ottoman Empire as muhajirs,
    factory rifles flooded in, and the forges went cold. The guns now sit in the museum at Zeda Chkhutuneti;
    the villagers have raised a monument to them near the valley mouth.


    The Dzneladzes say their ancestor Usta Salikh of Zeda Chkhutuneti invented the Machakhela gun; others
    credit the Kavtaradzes or the Nagervadzes, and one version keeps the peace: ‘Dzneladze invented the
    gun, Kavtaradze the gunpowder.’


    In 1921 the new Soviet–Turkish frontier cut Machakheli in two. The upper villages, Camili among them,
    stayed in Turkey, where their forest has been a UNESCO biosphere reserve since 2005. The lower valley
    went to Georgia, and in 2012 Parliament made its wooded slopes a national park.


    The forest is Colchic: box, chestnut, beech, hornbeam and alder close over the road and the river.
    Two kilometres from the park office, the Tskhemlara bridge throws a single narrow arch from bare rock
    on one bank to a built pier on the other; villagers crossed it until a new bridge came in the 1960s.
    Locals call such bridges ‘Tamar bridges’, a folk name rather than a building record.


    From the Kokoleti viewpoint you look straight across at Camili: the same river, the same forest, another
    country.
  tip: >-
    The visitor centre in Acharisaghmarti is open 09:00–18:00, and the season runs from May to October.
    Two trails start from the valley road. Mtavarangelozi (9 km, about four hours) climbs to views over
    Batumi. Kokoleti (15 km, about six hours) follows the border and needs a permit from the park administration
    at least five working days ahead, so carry your passport. The gunsmith museum in Zeda Chkhutuneti
    charges 10 GEL. Rain can come in any month and ticks live in the undergrowth, so wear long trousers
    and closed shoes. In October the valley holds Machakheloba, its folk festival, with a market of local
    produce and crafts.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia, the S12 through Lanchkhuti to Grigoleti
    on the coast, and the S2 south through Kobuleti to Batumi. From Batumi follow the Chorokhi upstream
    for about 20 km to its confluence with the Machakhela near Gvara fortress, then turn up the side valley.
    The visitor centre is about 30 km from Batumi, some 400 km and six and a quarter hours from Tbilisi
    in all. The road is asphalt through the lower villages, then gravel and potholes towards Kokoleti.
    On that upper stretch after rain, an SUV is worth having. Fill up in Batumi; there is no fuel in the
    valley.
ru:
  name: Национальный парк Мачахела
  short: >-
    Колхидская лесистая долина на турецкой границе, где когда-то оружейники ковали кремнёвые ружья, ценимые
    до самого Стамбула.
  body: >-
    **Хорошее ружьё, говорили старые аджарские поэты, делают лишь в двух местах: в Мачахеле или в Стамбуле.**


    Закария Чичинадзе записал эту поговорку в конце XIX века. Мачахельские кремнёвые ружья, известные
    со второй половины XVIII века, носили по всей Гурии, Имеретии и Самегрело, а ценили их и в домах стамбульских
    пашей. Лучшие, «топхане», имели нарезной ствол с инкрустацией серебром и костью; гладкоствольная «налпара»
    была дешёвой версией: 75 рублей против 20, по подсчётам одного русского военного корреспондента. После
    1878 года многие мастера-оружейники эмигрировали в Османскую империю как мухаджиры, рынок затопили
    фабричные ружья, и кузницы остыли. Сегодня эти ружья можно увидеть в музее в Зеда-Чхутунети; у входа
    в долину селяне поставили им памятник.


    Дзнеладзе говорят, что мачахельское ружьё изобрёл их предок, уста Салих из Зеда-Чхутунети; другие
    отдают эту честь Кавтарадзе или Нагервадзе, а одна версия примиряет всех: «Ружьё изобрёл Дзнеладзе,
    порох — Кавтарадзе».


    В 1921 году новая советско-турецкая граница разрезала Мачахели на две части. Верхние сёла, среди них
    Джамили, остались в Турции, где их лес с 2005 года — биосферный заповедник ЮНЕСКО. Нижняя долина отошла
    Грузии, и в 2012 году парламент объявил её лесистые склоны национальным парком.


    Лес здесь колхидский: самшит, каштан, бук, граб и ольха смыкаются сводом над дорогой и рекой. В двух
    километрах от офиса парка мост Цхемлара перекидывает единственную узкую арку от голой скалы на одном
    берегу к рукотворной опоре на другом; селяне переходили по нему до тех пор, пока в 1960-х не построили
    новый мост. Такие мосты здесь называют «мостами Тамары» — народное название, а не свидетельство о
    дате постройки.


    Со смотровой площадки Коколети вы смотрите прямо на Джамили: та же река, тот же лес, другая страна.
  tip: >-
    Визит-центр в Ачарисагмарти открыт с 09:00 до 18:00, сезон длится с мая по октябрь. От дороги долины
    начинаются два маршрута. Мтаварангелози (9 км, около четырёх часов) поднимается к видам на Батуми.
    Коколети (15 км, около шести часов) идёт вдоль границы и требует разрешения от администрации парка,
    полученного не менее чем за пять рабочих дней, так что возьмите с собой паспорт. Вход в музей оружейников
    в Зеда-Чхутунети стоит 10 лари. Дождь может пойти в любой месяц, а в подлеске водятся клещи, так что
    наденьте длинные штаны и закрытую обувь. В октябре в долине проходит «Мачахелоба», народный праздник
    с ярмаркой местной продукции и ремёсел.
  route: >-
    Из Тбилиси по S1 (E60) через Кутаиси до Самтредиа, по S12 через Ланчхути до Григолети на побережье,
    и по S2 на юг через Кобулети до Батуми. От Батуми поднимитесь вдоль Чорохи примерно на 20 км до её
    слияния с Мачахелой у крепости Гвара, затем сверните в боковую долину. Визит-центр находится примерно
    в 30 км от Батуми, всего около 400 км и шесть часов пятнадцать минут от Тбилиси. Дорога асфальтирована
    через нижние сёла, дальше к Коколети — гравий и выбоины. На этом верхнем участке после дождя стоит
    взять внедорожник. Заправьтесь в Батуми — в долине заправок нет.
fa:
  name: پارک ملی ماچاخلا
  short: >-
    دره‌ای جنگل‌پوش کلخیسی بر مرز ترکیه، جایی که زمانی اسلحه‌سازان تفنگ‌های چخماقی می‌ساختند که تا استانبول
    شهره بودند.
  body: >-
    **شاعران کهن آجارا می‌گفتند تفنگ خوب تنها در دو جا ساخته می‌شود: یا ماچاخلا، یا استانبول.**


    این گفته را زکریا چیچینادزه در اواخر سده‌ی نوزدهم ثبت کرد. تفنگ چخماقی ماچاخلایی، که از نیمه‌ی دوم
    سده‌ی هجدهم شناخته می‌شود، در سراسر گوریا، ایمرتی و سامگرلو حمل می‌شد، و حتی در خانه‌ی پاشاهای استانبول
    نیز گران‌قدر بود. بهترین نوع، که آن را به نامی ترکی «تُپخانه» می‌خواندند، لوله‌ی شیاردار داشت و با
    نقره و استخوان تزیین می‌شد؛ نوع لوله‌صاف، «نالپارا»، ارزان‌تر بود: به گفته‌ی خبرنگار نظامی روس، ۷۵
    روبل در برابر ۲۰. پس از ۱۸۷۸ بسیاری از استادکاران به‌عنوان مهاجر به عثمانی رفتند، بازار از تفنگ کارخانه‌ای
    پُر شد، و کوره‌ها خاموش گشت. امروز این تفنگ‌ها را در موزه‌ی زدا چخوتونتی می‌بینید؛ روستاییان نیز در
    دهانه‌ی دره یادبودی برایشان برپا کرده‌اند.


    خانواده‌ی دزنلادزه می‌گویند نیای‌شان، اوستا صالح از زدا چخوتونتی، تفنگ ماچاخلایی را اختراع کرد؛ دیگران
    این افتخار را به کاوتارادزه‌ها یا ناگروادزه‌ها می‌دهند، و روایتی همه را آشتی می‌دهد: «تفنگ را دزنلادزه
    اختراع کرد، باروت را کاوتارادزه».


    در سال ۱۹۲۱ مرز تازه‌ی شوروی-ترکیه ماچاخلی را به دو نیم کرد. روستاهای بالادست، از جمله جامیلی، در
    ترکیه ماندند، جایی که جنگلشان از سال ۲۰۰۵ ذخیره‌گاه زیست‌کره‌ی یونسکو است. دره‌ی پایین به گرجستان
    رسید، و در سال ۲۰۱۲ پارلمان دامنه‌های جنگلی‌اش را پارک ملی اعلام کرد.


    جنگل این‌جا کلخیسی است: شمشاد، شاه‌بلوط، راش، ممرز و توسکا بر فراز راه و رودخانه به‌هم می‌پیوندند.
    دو کیلومتری دفتر پارک، پل تسخملارا طاقی باریک و تنها را از صخره‌ی برهنه در یک ساحل به پایه‌ای دست‌ساخته
    در ساحل دیگر می‌کشد؛ روستاییان از این پل می‌گذشتند تا در دهه‌ی ۱۹۶۰ پل تازه‌ای ساخته شد. این‌جا چنین
    پل‌ها را «پل‌های تامار» می‌خوانند، نامی عامیانه و نه سندی از ساخت.


    از نقطه‌ی دیدبانی کوکولتی، مستقیم به جامیلی می‌نگرید: همان رود، همان جنگل، کشوری دیگر.
  tip: >-
    مرکز بازدیدکنندگان در آچاریساغمارتی از ۰۹:۰۰ تا ۱۸:۰۰ باز است، و فصل بازدید از مه تا اکتبر ادامه دارد.
    از راه دره دو مسیر پیاده‌روی آغاز می‌شود. مسیر متاوارانگلوزی (۹ کیلومتر، حدود چهار ساعت) تا چشم‌اندازهای
    باتومی بالا می‌رود. مسیر کوکولتی (۱۵ کیلومتر، حدود شش ساعت) مرز را دنبال می‌کند و به مجوز اداره‌ی
    پارک نیاز دارد، دست‌کم پنج روز کاری پیش‌تر، پس گذرنامه همراه داشته باشید. ورود به موزه‌ی اسلحه‌سازان
    در زدا چخوتونتی ۱۰ لاری هزینه دارد. باران در هر ماهی ممکن است ببارد، و در زیراشکوب کنه هست: شلوار
    بلند و کفش بسته بپوشید. در اکتبر دره جشن «ماچاخلوبا» را برگزار می‌کند، جشنی عامیانه با بازارچه‌ی محصولات
    و دست‌سازه‌های محلی.
  route: >-
    از تفلیس مسیر S1 (E60) را از کنار کوتایسی تا سامتردیا بروید، سپس S12 را از میان لانچخوتی تا گریگولتی
    بر ساحل، و آن‌گاه S2 را به سوی جنوب از میان کوبولتی تا باتومی. از باتومی، رودخانه‌ی چوروخی را نزدیک
    ۲۰ کیلومتر رو به بالا بروید، تا نقطه‌ی پیوستنش به ماچاخلا، نزدیک قلعه‌ی گوارا، سپس به دره‌ی کناری
    بپیچید. مرکز بازدیدکنندگان نزدیک ۳۰ کیلومتر از باتومی است: از تفلیس در کل نزدیک ۴۰۰ کیلومتر و شش ساعت
    و پانزده دقیقه. در روستاهای پایین‌دست راه آسفالت است، و به سوی کوکولتی به راهی شنی و پرچاله بدل می‌شود.
    پس از باران، در این بخش بالادست، خودرویی شاسی‌بلند به کارتان می‌آید. در باتومی سوخت‌گیری کنید؛ در
    دره پمپ بنزینی نیست.
he:
  name: הגן הלאומי מצ'חלה
  short: עמק יער קולכי על הגבול הטורקי, שבו יצרו נפחי נשק רובי צור שהיו מבוקשים עד איסטנבול.
  body: >-
    **רובה טוב, כך אמרו משוררי אג'אריה של פעם, מגיע רק משני מקומות: מצ'חלה או איסטנבול.**


    זכריה צ'יצ'ינדזה העלה את האמרה הזאת על הכתב בשלהי המאה ה-19. רובי הצור של מצ'חלה, המוכרים מהמחצית
    השנייה של המאה ה-18, נישאו ברחבי גוריה, אימרתי וסמגרלו, והוערכו אף בבתי הפאשות באיסטנבול. הטוב ביותר,
    ה"טופחנה", היה בעל קנה מחורק משובץ כסף ועצם; ה"נלפרה" חלקת-הקנה הייתה הגרסה הזולה: 75 רובל לעומת 20,
    לפי חשבונו של כתב צבאי רוסי אחד. אחרי 1878 היגרו רבים מנפחי הנשק המומחים לאימפריה העות'מאנית כמוהאג'ירים,
    רובי בית-חרושת הציפו את השוק, והנפחיות התקררו. הרובים מוצגים כיום במוזיאון בזדה-צ'חוטונטי, ובפתח העמק
    הקימו להם הכפריים אנדרטה.


    בני משפחת דזנלדזה אומרים שאביהם הקדמון, אוסטה סאליח מזדה-צ'חוטונטי, המציא את רובה מצ'חלה; אחרים מזכים
    בכך את בני קבטרדזה או בני נגרוודזה, וגרסה אחת משכינה שלום: "דזנלדזה המציא את הרובה, קבטרדזה את אבק
    השריפה".


    ב-1921 חצה הגבול הסובייטי-טורקי החדש את מצ'חלי לשניים. הכפרים העליונים, ובהם ג'מילי, נשארו בטורקיה,
    ושם היער שלהם הוא שמורת ביוספרה של אונסק"ו מאז 2005. העמק התחתון עבר לגאורגיה, וב-2012 הפרלמנט הכריז
    על מדרוניו המיוערים כגן לאומי.


    היער כאן קולכי: אשכרוע, ערמון, אשור, קרפינוס ואלמון נסגרים כקמרון מעל הדרך והנהר. שני קילומטרים ממשרד
    הגן, גשר צחמלרה מותח קשת יחידה וצרה מסלע חשוף בגדה אחת לתומך בנוי בגדה השנייה; הכפריים חצו אותו עד
    שגשר חדש נבנה בשנות ה-60. כאן קוראים לגשרים כאלה "גשרי תמר", שם עממי ולא עדות לזמן בנייתם.


    מנקודת התצפית בקוקולטי מבטכם נופל ישר על ג'מילי: אותו הנהר, אותו היער, מדינה אחרת.
  tip: >-
    מרכז המבקרים באצ'ריסאגמרטי פתוח 09:00–18:00, והעונה נמשכת ממאי עד אוקטובר. שני שבילים מתחילים מדרך
    העמק. מטוורנגלוזי (9 ק"מ, כארבע שעות) מטפס לנקודות תצפית על בטומי. קוקולטי (15 ק"מ, כשש שעות) עוקב
    אחר הגבול ומחייב אישור מהנהלת הגן לפחות חמישה ימי עסקים מראש, אז קחו דרכון. הכניסה למוזיאון נפחי הנשק
    בזדה-צ'חוטונטי עולה 10 לארי. גשם עשוי לרדת בכל חודש, וקרציות חיות בסבך, אז לבשו מכנסיים ארוכים ונעליים
    סגורות. באוקטובר מתקיים בעמק "מצ'חלובה", חג עממי עם שוק תוצרת ומלאכת יד מקומית.
  route: >-
    מטביליסי סעו ב-S1 (E60) דרך קוטאיסי עד סמטרדיה, אחר כך ב-S12 דרך לנצ'חוטי לגריגולטי על החוף, ומשם
    ב-S2 דרומה דרך קובולטי לבטומי. מבטומי עלו לאורך הצ'ורוחי כ-20 ק"מ עד מפגשו עם נהר מצ'חלה, סמוך למצודת
    גוארה, ואז פנו לעמק הצדי. מרכז המבקרים נמצא כ-30 ק"מ מבטומי: מטביליסי בסך הכול כ-400 ק"מ ושש שעות
    ורבע. הדרך סלולה בכפרים התחתונים, ולכיוון קוקולטי היא הופכת לחצץ ובורות. בקטע העליון הזה, אחרי גשם,
    כדאי להיות ברכב שטח. תדלקו בבטומי — אין דלק בעמק.
ar:
  name: حديقة ماتشاخيلا الوطنية
  short: وادٍ تكسوه غابات كولخية على الحدود التركية، صنع فيه الحدّادون يومًا بنادق بزناد الصوان بلغت شهرتها
    إسطنبول.
  body: >-
    **كان شعراء أدجاريا القدامى يقولون إن البندقية الجيدة لا تُصنع إلا في مكانين: ماتشاخيلا أو إسطنبول.**


    دوّن زكريا تشيتشينادزه هذا القول في أواخر القرن التاسع عشر. بنادق ماتشاخيلا ذات زناد الصوان، المعروفة
    منذ النصف الثاني من القرن الثامن عشر، كانت تُحمَل في غوريا وإيميريتي وسامغريلو، وكانت محلّ تقدير في
    بيوت باشوات إسطنبول. أجودها، "توفخانه"، كانت ذات سبطانة محلزنة مطعّمة بالفضة والعظم؛ أما "نالبارا"
    ذات السبطانة الملساء فكانت النسخة الأرخص: 75 روبلًا مقابل 20، بحسب حساب أحد المراسلين العسكريين الروس.
    وبعد 1878 هاجر كثير من الصنّاع الحرفيين إلى الدولة العثمانية كمهاجرين، وغمرت السوق بنادق المصانع،
    وخمدت نيران الكِير. توجد هذه البنادق اليوم في متحف زيدا تشخوتونيتي؛ وقد أقام لها القرويون نصبًا عند
    مدخل الوادي.


    تقول عائلة دزنيلادزه إن جدّهم أوستا صالح من زيدا تشخوتونيتي هو من ابتكر بندقية ماتشاخيلا؛ ويُنسب هذا
    الفخر عند آخرين إلى عائلتي كافتارادزه أو ناغيرفادزه، وتُصالح إحدى الروايات بين الجميع: "دزنيلادزه
    ابتكر البندقية، وكافتارادزه ابتكر البارود".


    في عام 1921 قسمت الحدود السوفياتية-التركية الجديدة وادي ماتشاخيلي إلى قسمين. بقيت القرى العليا، ومنها
    جاميلي، في تركيا، حيث غدت غابتها منذ 2005 محميةَ محيطٍ حيوي تابعةً لليونسكو. أما الوادي الأسفل فذهب
    إلى جورجيا، وفي عام 2012 أعلن البرلمان منحدراته الحرجية حديقة وطنية.


    الغابة هنا كولخية: البقس والكستناء والزان والشَّرد وجار الماء تتعانق أغصانها فوق الطريق والنهر. على
    بعد كيلومترين من مكتب الحديقة، يمتد جسر تسخملارا بقوس واحدة ضيقة من صخرة عارية على ضفة إلى دعامة مبنية
    على الضفة الأخرى؛ وكان القرويون يعبرونه إلى أن بُني جسر جديد في الستينيات. يسمّي السكان المحليون مثل
    هذه الجسور "جسور تامار"، وهو اسم شعبي لا دليل على تاريخ البناء.


    من نقطة مراقبة كوكوليتي تنظرون مباشرة إلى جاميلي: النهر نفسه، والغابة نفسها، وبلد آخر.
  tip: >-
    مركز الزوار في أتشاريساغمارتي يعمل من 09:00 إلى 18:00، والموسم يمتد من مايو إلى أكتوبر. يبدأ مساران
    من طريق الوادي. مسار متافارانغيلوزي (9 كم، نحو أربع ساعات) يصعد إلى مناظر تطلّ على باتومي. مسار كوكوليتي
    (15 كم، نحو ست ساعات) يتبع الحدود ويحتاج إلى تصريح من إدارة الحديقة قبل خمسة أيام عمل على الأقل، فاحملوا
    جوازكم. تذكرة الدخول إلى متحف صانعي البنادق في زيدا تشخوتونيتي 10 لاري. قد يهطل المطر في أي شهر، والقُراد
    يعيش في الشُّجيرات، فارتدوا سراويل طويلة وأحذية مغلقة. في أكتوبر يقيم الوادي "ماتشاخيلوبا"، مهرجانه
    الشعبي، بسوق للمنتجات والحِرف المحلية.
  route: >-
    من تبليسي خذوا S1 (E60) عبر كوتايسي إلى سامتريديا، ثم S12 عبر لانتشخوتي إلى غريغوليتي على الساحل،
    ثم S2 جنوبًا عبر كوبوليتي إلى باتومي. من باتومي، سيروا بمحاذاة نهر تشوروخي عكس مجراه نحو 20 كم حتى
    ملتقاه بماتشاخيلا، قرب قلعة غوارا، ثم انحرفوا إلى الوادي الجانبي. يقع مركز الزوار على نحو 30 كم من
    باتومي: نحو 400 كم وست ساعات وربع من تبليسي في المجموع. الطريق مُعبّد عبر القرى السفلى، ثم يتحول إلى
    حصى وحفر نحو كوكوليتي. في هذا المقطع العلوي، بعد المطر، يُستحسن أن تكونوا في سيارة دفع رباعي. عبّئوا
    الوقود في باتومي؛ لا وقود في الوادي.
