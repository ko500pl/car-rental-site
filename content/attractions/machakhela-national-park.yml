ka:
  name: მაჭახლის ეროვნული პარკი
  short: >-
    კოლხური ტყით შემოსილი ხეობა თურქეთის საზღვართან, თაღოვანი ხიდებითა და იარაღის ოსტატების სოფლებით.
  body: >-
    **მაჭახლის ხეობა აჭარის ყველაზე ნაკლებად შეცვლილი კუთხეა.** მდინარე მაჭახლისწყალი თურქეთის საზღვრიდან
    ჩამოდის და ჭოროხს გონიოსთან უერთდება; ხეობა ვიწროა, ორივე მხრიდან ციცაბო და ტყე თითქმის ხელუხლებელი.
    2012 წელს აქ ეროვნული პარკი შეიქმნა, რომელიც ლაშქარიშენიდან საზღვრამდე ვრცელდება.

    ტყე ის არის, რასაც კოლხურ რელიქტურ ტყეს უწოდებენ — ბუნებრივი გარემო, რომელიც ბოლო გამყინვარებას გადაურჩა.
    წაბლი, წიფელი და მუხა ზემოთ, ქვემოთ კი მარადმწვანე ქვეტყე: შქერი, წყავი, შქერისებრი დაფნა. აქ დაფიქსირებულია
    დათვი, ფოცხვერი და ქურციკი, თუმცა მათი ნახვის შანსი მინიმალურია. რაც ნამდვილად დაინახება, ის ტყის
    სიმკვრივეა — ხეობის ფერდობებზე მზე ძლივს აღწევს.

    ხეობის კულტურული ნაწილი არანაკლებ საინტერესოა:

    - **მაჭახლის თოფი** — XVIII-XIX საუკუნეებში აქაური ოსტატები კავკასიაში საუკეთესო ხელნაკეთ თოფებს
    აწარმოებდნენ; ხელობა თითქმის გაქრა, მაგრამ ცალკეული ნიმუშები სოფლებში დღემდე ინახება

    - **თაღოვანი ხიდები** — ხეობაში რამდენიმეა, ყველაზე ცნობილი წივალეთისა და ჩიქუნეთის მიდამოებში

    - **ხის სახლები** აივნებით და ქვის საძირკვლით, კვლავ დასახლებული

    პარკს ვიზიტორთა ცენტრი და მონიშნული ბილიკები აქვს, თუმცა ინფრასტრუქტურა მიტირალაზე უფრო მოკრძალებულია.
    სწორედ ეს არის მთავარი: აქ ტურისტული ავტობუსები არ დადის და შაბათსაც კი შეიძლება ბილიკზე მარტო აღმოჩნდე.
  tip: >-
    ნახევარი დღე — ვიზიტორთა ცენტრი, ერთი მოკლე ბილიკი და სოფლების შემოვლა. სასაზღვრო ზონაა: პასპორტი
    აუცილებლად თან იქონიე, სასაზღვრო პოლიცია რეგულარულად ამოწმებს. ტყეში ტკიპა და ჭინჭარია — გრძელი
    შარვალი და დახურული ფეხსაცმელი. წვიმა აქ ხშირია მთელი წლის განმავლობაში. კაფე მხოლოდ ქვედა სოფლებშია;
    წყალი და საკვები ბათუმიდან წაიღე.
  route: >-
    ბათუმიდან სამხრეთით ჭოროხის ხიდამდე, შემდეგ მარცხნივ მაჭახლის ხეობაში და აღმოსავლეთით ზემოთ — თბილისიდან
    ჯამში 400 კმ, დაახლოებით ექვსი საათი და მეოთხედი. ხეობის პირველი ოცი კილომეტრი ასფალტია, ზემოთ კი
    ხრეშიანი და ორმოებიანი ხდება. მაღალი კლირენსი აშკარად სასარგებლოა, განსაკუთრებით წვიმის შემდეგ.
    საწვავი ბათუმსა და ადლიაშია, ხეობაში აღარაა. მანქანა ვიზიტორთა ცენტრთან ან სოფლის ბოლოს დატოვე.
en:
  name: Machakhela National Park
  short: >-
    A Colchic forest valley running to the Turkish border, with arched bridges and villages of gunsmiths.
  body: >-
    **The Machakhela valley is the least altered corner of Adjara.** The Machakhlistsqali comes down from
    the Turkish frontier and joins the Chorokhi near Gonio; the valley is narrow, steep on both sides,
    and the forest is close to untouched. A national park was declared here in 2012, running from Lashkarisheni
    up to the border.

    The woodland is what botanists call Colchic relict forest — a habitat that survived the last glaciation
    intact. Chestnut, beech and oak above, and beneath them an evergreen understorey of rhododendron, cherry
    laurel and box. Bear, lynx and chamois are all recorded, though your chance of seeing one is close
    to nil. What you will certainly notice is the density: on the valley slopes, sunlight barely reaches
    the ground.

    The cultural side of the valley matters just as much:

    - The **Machakhela rifle** — in the 18th and 19th centuries smiths here made the finest handmade firearms
    in the Caucasus; the craft has all but vanished, but individual pieces are still kept in the villages

    - **Arched bridges**, several of them, the best known near Tsivaleti and Chikuneti

    - **Wooden houses** with carved balconies on stone footings, still lived in

    The park has a visitor centre and marked trails, though the infrastructure is more modest than at Mtirala.
    That is exactly the point. No coaches come up here, and on a Saturday you can easily find yourself
    alone on the path.
  tip: >-
    Half a day covers the visitor centre, one short trail and a drive through the villages. This is a border
    zone: carry your passport, as the border police check regularly. Ticks and nettles are common in the
    forest, so wear long trousers and closed shoes. Rain is frequent here all year. Cafes exist only in
    the lower villages — bring water and food from Batumi.
  route: >-
    From Batumi drive south to the Chorokhi bridge, then turn left into the Machakhela valley and follow
    it east and upstream — 400 km from Tbilisi in total, about six and a quarter hours. The first twenty
    kilometres of the valley are asphalt; higher up the surface becomes gravel and potholed. Good ground
    clearance genuinely helps, especially after rain. Fuel is available in Batumi and Adlia and nowhere
    in the valley. Leave the car at the visitor centre or at the end of the village road.
ru:
  name: Национальный парк Мачахела
  short: >-
    Ущелье с колхидским лесом до самой турецкой границы, с арочными мостами и сёлами оружейников.
  body: >-
    **Ущелье Мачахела — наименее изменённый угол Аджарии.** Река Мачахлисцкали спускается от турецкой
    границы и впадает в Чорохи у Гонио; ущелье узкое, крутое с обеих сторон, а лес почти нетронут. В 2012
    году здесь объявили национальный парк, тянущийся от Лашкаришени до границы.

    Лес относится к тому, что ботаники называют колхидским реликтовым: среда, пережившая последнее оледенение
    целиком. Каштан, бук и дуб сверху, под ними вечнозелёный подлесок из рододендрона, лавровишни и самшита.
    Здесь отмечены медведь, рысь и серна, хотя шанс увидеть кого-то из них близок к нулю. Что заметно
    наверняка — плотность: на склонах ущелья свет едва достаёт до земли.

    Культурная сторона ущелья не менее интересна:

    - **Мачахельское ружьё** — в XVIII-XIX веках здешние мастера делали лучшее ручное огнестрельное оружие
    на Кавказе; ремесло почти исчезло, но отдельные экземпляры до сих пор хранятся в сёлах

    - **Арочные мосты**, их несколько, самые известные у Цивалети и Чикунети

    - **Деревянные дома** с резными балконами на каменном основании, до сих пор жилые

    У парка есть визит-центр и размеченные тропы, хотя инфраструктура скромнее, чем в Мтирале. В этом
    и суть: сюда не заезжают автобусы, и даже в субботу легко оказаться на тропе одному.
  tip: >-
    Полдня — визит-центр, одна короткая тропа и проезд по сёлам. Это пограничная зона: паспорт обязательно
    при себе, погранполиция проверяет регулярно. В лесу клещи и крапива, так что длинные брюки и закрытая
    обувь. Дождь здесь частый круглый год. Кафе есть только в нижних сёлах — воду и еду везите из Батуми.
  route: >-
    Из Батуми на юг до моста через Чорохи, затем налево в ущелье Мачахела и вверх на восток — от Тбилиси
    всего 400 км, около шести с четвертью часов. Первые двадцать километров ущелья асфальтированы, выше
    покрытие становится гравийным и разбитым. Хороший клиренс здесь по-настоящему помогает, особенно
    после дождя. Заправки есть в Батуми и Адлии, в самом ущелье их нет. Машину оставьте у визит-центра
    или в конце сельской дороги.
fa:
  name: پارک ملی ماچاخلا
  short: >-
    دره‌ای با جنگل کلخیدی تا مرز ترکیه، با پل‌های طاقی و روستاهای تفنگ‌سازان.
  body: >-
    **درهٔ ماچاخلا دست‌نخورده‌ترین گوشهٔ آجاراست.** رود ماچاخلیسْتسقالی از مرز ترکیه پایین می‌آید و نزدیک
    گونیو به چوروخی می‌پیوندد؛ دره باریک است، دو سویش تند، و جنگل تقریباً بکر. در ۲۰۱۲ اینجا پارک ملی
    اعلام شد که از لاشکاریشنی تا مرز کشیده می‌شود.

    این جنگل همان است که گیاه‌شناسان جنگل بازماندهٔ کلخیدی می‌نامند؛ زیستگاهی که آخرین دورهٔ یخبندان
    را دست‌نخورده از سر گذراند. شاه‌بلوط و راش و بلوط در بالا، و زیرشان زیراشکوبی همیشه‌سبز از خرزهره‌کوهی
    و برگ‌بو و شمشاد. خرس و سیاه‌گوش و بز کوهی ثبت شده‌اند، هرچند بخت دیدنشان نزدیک به صفر است. آنچه
    بی‌گمان می‌بینید تراکم است: بر دامنه‌های دره نور آفتاب به‌سختی به زمین می‌رسد.

    وجه فرهنگی دره کم‌اهمیت‌تر نیست:

    - **تفنگ ماچاخلا** — در سده‌های هجدهم و نوزدهم استادان اینجا بهترین سلاح‌های گرم دست‌ساز قفقاز را
    می‌ساختند؛ این پیشه تقریباً از میان رفته اما نمونه‌هایی هنوز در روستاها نگه داشته می‌شود

    - **پل‌های طاقی**، چند تایی، که شناخته‌شده‌ترینشان نزدیک تسیوالتی و چیکونتی است

    - **خانه‌های چوبی** با ایوان‌های کنده‌کاری‌شده بر پی سنگی، که هنوز در آن‌ها زندگی می‌کنند

    پارک مرکز بازدید و مسیرهای نشانه‌گذاری‌شده دارد، هرچند زیرساختش از میتیرالا ساده‌تر است. و نکته دقیقاً
    همین است: اتوبوس گردشگری تا اینجا نمی‌آید و حتی شنبه هم به‌راحتی تنها روی مسیر می‌مانید.
  tip: >-
    نیم روز برای مرکز بازدید، یک مسیر کوتاه و رانندگی میان روستاها کافی است. اینجا منطقهٔ مرزی است: گذرنامه
    حتماً همراه داشته باشید، پلیس مرزی مرتب بازرسی می‌کند. کنه و گزنه در جنگل فراوان است، پس شلوار بلند
    و کفش بسته بپوشید. باران اینجا تمام سال زیاد است. کافه تنها در روستاهای پایین هست؛ آب و خوراک را
    از باتومی بیاورید.
  route: >-
    از باتومی به جنوب تا پل چوروخی، سپس به چپ در درهٔ ماچاخلا و رو به شرق و بالا — از تفلیس روی‌هم ۴۰۰
    کیلومتر، حدود شش ساعت و ربع. بیست کیلومتر نخست دره آسفالت است و بالاتر شنی و پرچاله می‌شود. ارتفاع
    مناسب از زمین واقعاً کمک می‌کند، به‌ویژه پس از باران. سوخت در باتومی و آدلیا هست و در خود دره نیست.
    خودرو را کنار مرکز بازدید یا در انتهای جادهٔ روستا بگذارید.
he:
  name: הפארק הלאומי מאצ׳אחלה
  short: >-
    עמק של יער קולכי עד גבול טורקיה, ובו גשרי קשת וכפרים של רובאים.
  body: >-
    **עמק מאצ׳אחלה הוא הפינה הפחות משתנה באג׳ריה.** נהר מאצ׳אחליסצקאלי יורד מגבול טורקיה ומתחבר לצ׳ורוחי
    ליד גוניו; העמק צר, תלול משני צדדיו, והיער כמעט בתולי. ב-2012 הוכרז כאן פארק לאומי המשתרע מלשקארישני
    עד הגבול.

    היער הוא מה שהבוטנאים מכנים יער קולכי שריד — בית גידול ששרד את תקופת הקרח האחרונה בשלמותו. ערמון,
    אשור ואלון למעלה, ומתחתיהם תת-יער ירוק-עד של רודודנדרון, דפנה ואשכרוע. דוב, שונר ויעל מתועדים כאן,
    אף שהסיכוי לראות אחד מהם קרוב לאפס. מה שבוודאי תבחינו בו הוא הצפיפות: על מדרונות העמק האור בקושי
    מגיע לקרקע.

    הצד התרבותי של העמק חשוב לא פחות:

    - **רובה מאצ׳אחלה** — במאות ה-18 וה-19 ייצרו כאן אומנים את כלי הנשק המשובחים ביותר בקווקז; המלאכה
    כמעט נעלמה, אך פריטים בודדים עדיין נשמרים בכפרים

    - **גשרי קשת**, כמה מהם, והמוכרים ביותר ליד ציוואלטי וצ׳יקונטי

    - **בתי עץ** עם מרפסות מגולפות על יסודות אבן, שעדיין גרים בהם

    לפארק יש מרכז מבקרים ושבילים מסומנים, אף שהתשתית צנועה משל מטיראלה. וזו בדיוק הנקודה: אוטובוסים אינם
    מגיעים לכאן, ואפילו בשבת קל למצוא את עצמך לבד על השביל.
  tip: >-
    חצי יום מכסה את מרכז המבקרים, שביל קצר אחד ונסיעה בין הכפרים. זהו אזור גבול: שאו דרכון, משמר הגבול
    בודק באופן קבוע. יש קרציות וסרפדים ביער, אז מכנסיים ארוכים ונעליים סגורות. הגשם כאן תכוף כל השנה.
    בתי קפה יש רק בכפרים התחתונים — הביאו מים ואוכל מבאטומי.
  route: >-
    מבאטומי דרומה עד גשר צ׳ורוחי, ואז שמאלה אל עמק מאצ׳אחלה ומזרחה במעלה הזרם — 400 ק״מ מטביליסי בסך
    הכול, כשש שעות ורבע. עשרים הקילומטרים הראשונים בעמק סלולים; מעלה משם המשטח הופך לחצץ ומלא בורות.
    מרווח גחון טוב באמת עוזר, במיוחד אחרי גשם. תדלוק בבאטומי ובאדליה, ובעמק עצמו אין. השאירו את הרכב
    במרכז המבקרים או בסוף דרך הכפר.
ar:
  name: منتزه ماتشاخيلا الوطني
  short: >-
    وادٍ بغابة كولخيدية يمتد حتى الحدود التركية، بجسور مقوسة وقرى لصانعي البنادق.
  body: >-
    **وادي ماتشاخيلا أقل زوايا أجاريا تبدلاً.** ينحدر نهر ماتشاخليستسقالي من الحدود التركية ويصب في تشوروخي
    قرب غونيو؛ والوادي ضيق، حاد الجانبين، وغابته تكاد تكون بكراً. وفي 2012 أُعلن هنا منتزه وطني يمتد
    من لاشكاريشيني حتى الحدود.

    والغابة هي ما يسميه علماء النبات الغابة الكولخيدية المتبقية: موئل نجا من العصر الجليدي الأخير سليماً.
    كستناء وزان وبلوط في الأعلى، وتحتها طبقة دائمة الخضرة من الرودودندرون وغار الكرز والبقس. سُجّل هنا
    الدب والوشق والشامواه، وإن كان احتمال رؤيتها قريباً من الصفر. أما ما ستلاحظه يقيناً فهو الكثافة:
    على منحدرات الوادي يكاد ضوء الشمس لا يبلغ الأرض.

    والجانب الثقافي للوادي لا يقل أهمية:

    - **بندقية ماتشاخيلا** — في القرنين الثامن عشر والتاسع عشر صنع حدادو هذا الوادي أجود الأسلحة النارية
    اليدوية في القوقاز؛ كادت الحرفة تختفي، لكن قطعاً مفردة ما زالت محفوظة في القرى

    - **جسور مقوسة**، عدة منها، وأشهرها قرب تسيفاليتي وتشيكونيتي

    - **بيوت خشبية** بشرفات محفورة على أساسات حجرية، لا تزال مسكونة

    للمنتزه مركز زوار ومسارات معلّمة، وإن كانت البنية أبسط مما في ميتيرالا. وهذا هو المقصود بالضبط: لا
    تصعد الحافلات إلى هنا، وحتى في يوم السبت قد تجد نفسك وحدك على الدرب.
  tip: >-
    نصف يوم يغطي مركز الزوار ومساراً قصيراً وجولة بين القرى. هذه منطقة حدودية: احمل جواز سفرك، فشرطة
    الحدود تفتش بانتظام. القراد والقُرّاص كثيران في الغابة، فالبس بنطالاً طويلاً وحذاءً مغلقاً. والمطر
    هنا متواتر طوال العام. المقاهي في القرى السفلى فقط؛ فاحمل الماء والطعام من باتومي.
  route: >-
    من باتومي جنوباً حتى جسر تشوروخي، ثم يساراً إلى وادي ماتشاخيلا وشرقاً صعوداً — 400 كم من تبليسي إجمالاً،
    نحو ست ساعات وربع. أول عشرين كيلومتراً من الوادي معبّدة، وفوقها يصير السطح حصوياً كثير الحفر. وارتفاع
    الهيكل عن الأرض يفيد فعلاً، خاصة بعد المطر. الوقود في باتومي وأدليا ولا شيء في الوادي. اترك السيارة
    عند مركز الزوار أو في نهاية طريق القرية.
