ka:
  name: ყვარლის ტბა
  short: >-
    ყვარლის პირას, კავკასიონის ძირში მიწაყრილი კაშხლით შექმნილი წყალსაცავი — ნავები, კურორტი და ტყიანი
    ფერდობის ანარეკლი.
  body: >-
    **ყვარლის ტბა ბუნებამ კი არ შექმნა, ადამიანმა: ეს პატარა წყალსაცავია, რომელსაც ოციმეტრიანი მიწაყრილი
    კაშხალი აკავებს, კავკასიონის ძირში, ყვარლის პირას.**


    წყალსაცავი მდინარე დურუჯის მარჯვენა მხარეს, ზღვის დონიდან 430 მეტრზე, ძველ, პატარა ნამდინარევ ქვაბულშია
    მოწყობილი. კაშხალი 800 მეტრი სიგრძისაა. ტბა 0,9 კილომეტრზე გრძელდება, სიგანე 0,3 კილომეტრია, სიღრმე
    ადგილ-ადგილ 20 მეტრს აღწევს, საშუალოდ კი 12 მეტრია. მას მხოლოდ წვიმა და თოვლი ასაზრდოებს, წყალს კი
    სარწყავად იყენებენ.


    სამხრეთ-დასავლეთ ნაპირზე 2010 წლიდან „ყვარლის ტბის“ კურორტი მუშაობს — ასამდე ოთახი, აუზები, სპა. წყალზე
    მოტორიანი, პედლებიანი და ნიჩბიანი ნავები და წყლის ველოსიპედები დაცურავენ. მოწმენდილ დღეს კი ტბის იქით
    კავკასიონის ტყიანი კალთა მოჩანს და წყალში ირეკლება.


    ილიას ტბაში ნუ აგერევათ — ის ოთხიოდე კილომეტრითაა მოშორებით. აქედან ილია ჭავჭავაძის სახლ-მუზეუმი ექვსი
    კილომეტრია, ქინძმარაულის ვენახები კი — იქვე, ქალაქის ირგვლივ.


    ეს არ არის ველური ბუნება, და არც ცდილობს იყოს. ეს ის ადგილია, სადაც მარნებსა და მუზეუმებში გატარებული
    დილის შემდეგ ნავს იქირავებთ და წყალზე ერთ მშვიდ საათს გაატარებთ.
  tip: >-
    ნაპირზე გასვლა უფასოა; ნავები, აუზები და სპა კურორტის ფასიანი მომსახურებაა. საბანაოდ საუკეთესო დრო
    ივნისიდან სექტემბრამდეა — ადგილზე იკითხეთ, ნაპირის რომელ მონაკვეთზეა ბანაობა ნებადართული. კურორტი
    წლის ნებისმიერ დროს მუშაობს, მაგრამ დანარჩენ თვეებში ტბა მხოლოდ სასეირნოდ და სანახავად გამოდგება.
    ზაფხულის შაბათ-კვირას ხალხმრავლობას ელოდეთ. ერთ დღეში ადვილად შეუთავსებთ ილია ჭავჭავაძის მუზეუმს და
    ქინძმარაულის მარნებს; სადილად კი ყვარელში შეიარეთ.
  route: >-
    თბილისიდან ყვარლის ტბამდე დაახლოებით 150 კმ-ია — 2 სთ 30 წთ, მთელი გზა ასფალტზე. კახეთის გზატკეცილით
    (ს5) საგარეჯოს გავლით ბაკურციხემდე იარეთ, იქიდან ჩრდილოეთით გურჯაანისკენ და მუკუზანი–ყვარლის გზით
    (შ69) ქალაქამდე, შემდეგ ყვარლის გავლით ტბის სამხრეთ ნაპირამდე. ალტერნატივაა გომბორის უღელტეხილი თელავის
    გავლით (დაახლოებით 145 კმ), ოღონდ ზამთარში, თოვლის შემდეგ, ის შეიძლება დროებით ჩაიკეტოს. პარკინგი
    კურორტის მხარესაა, ნაპირზე სწორი ბილიკია. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Kvareli Lake
  short: >-
    A small reservoir behind an earth dam at the foot of the Caucasus, with rowing boats, a lakeside resort
    and the forested slopes mirrored in the water.
  body: >-
    **Kvareli Lake was made, not found: a small reservoir held back by a 20-metre earth dam at the foot
    of the Caucasus, on the edge of Kvareli town.**


    It lies on the right bank of the Duruji River, 430 m above sea level, in a small hollow once carved
    by a stream; the dam is 800 m long. The water stretches 0.9 km by 0.3 km and reaches 20 m at its deepest,
    with an average depth of 12 m. Nothing but rain and snowmelt feeds it, and its water is used for irrigation.


    Since 2010 the Kvareli Lake Resort has occupied the south-western shore, with about a hundred rooms,
    pools and a spa. Motorboats, pedal boats, rowing boats and water bikes go out on the water, and on
    a clear day the wooded wall of the Caucasus rises behind it and doubles itself on the surface.


    Do not confuse it with Ilia Lake, about 4 km away. From here the Ilia Chavchavadze House Museum is
    6 km off, and the Kindzmarauli vineyards lie all around the town.


    This is not wild nature, and it does not pretend to be. It is where, after a morning among qvevri
    and museum rooms, you hire a boat and spend a quiet hour on the water.
  tip: >-
    The shoreline is free; boats, pools and the spa are paid resort services. For swimming, June to September
    is the season — ask on the spot which stretch of shore is open for bathing. The resort runs all year,
    but outside summer the lake is for a walk and a view rather than a swim. Expect crowds on summer weekends.
    It pairs easily with the Ilia Chavchavadze museum and the Kindzmarauli cellars in a single day, with
    lunch in Kvareli town.
  route: >-
    Kvareli Lake is about 150 km from Tbilisi — roughly 2 hours 30 minutes, asphalt all the way. Take
    the Kakheti Highway (S5) through Sagarejo to Bakurtsikhe, head north through Gurjaani and follow the
    Mukuzani–Kvareli road (Sh69) into town, then cross Kvareli to the lake's south shore. The alternative
    runs over the Gombori Pass via Telavi (about 145 km), but it can close briefly after winter snow.
    Parking is on the resort side, with a flat path along the shore. An economy car is entirely adequate.
ru:
  name: Кварельское озеро
  short: >-
    Небольшое водохранилище за земляной плотиной у подножия Кавказа: вёсельные лодки, курорт на берегу
    и лесистые склоны, отражённые в воде.
  body: >-
    **Кварельское озеро не нашли, а создали: это небольшое водохранилище, которое удерживает 20-метровая
    земляная плотина у подножия Кавказа, на краю города Кварели.**


    Оно лежит на правом берегу реки Дуруджи, на высоте 430 м над уровнем моря, в небольшой котловине,
    когда-то промытой ручьём; длина плотины — 800 м. Водоём вытянулся на 0,9 км при ширине 0,3 км; наибольшая
    глубина — 20 м, средняя — 12 м. Питают его только дожди и талый снег, а вода идёт на орошение.


    С 2010 года юго-западный берег занимает курорт «Кварельское озеро» — около сотни номеров, бассейны
    и спа. По воде ходят моторные лодки, катамараны, вёсельные лодки и водные велосипеды, а в ясный день
    за озером поднимается лесистая стена Кавказа и повторяется в его глади.


    Не путайте его с озером Илии, которое лежит примерно в 4 км. Отсюда до дома-музея Ильи Чавчавадзе
    6 км, а виноградники Киндзмараули раскинулись вокруг всего города.


    Это не дикая природа, и притворяться ею озеро не пытается. Это место, где после утра среди квеври
    и музейных залов берут лодку и проводят тихий час на воде.
  tip: >-
    Берег открыт для всех бесплатно; лодки, бассейны и спа — платные услуги курорта. Купальный сезон —
    с июня по сентябрь; на месте уточните, какой участок берега открыт для купания. Курорт работает круглый
    год, но вне лета на озеро едут погулять и полюбоваться видом, а не плавать. В летние выходные будьте
    готовы к толпам. Озеро легко совместить за один день с музеем Ильи Чавчавадзе и погребами Киндзмараули,
    пообедав в самом Кварели.
  route: >-
    Кварельское озеро находится примерно в 150 км от Тбилиси — около 2 часов 30 минут, асфальт на всём
    пути. Езжайте по Кахетинскому шоссе (S5) через Сагареджо до Бакурцихе, поверните на север через Гурджаани
    и по дороге Мукузани — Кварели (Sh69) въезжайте в город, затем пересеките Кварели до южного берега
    озера. Альтернативный путь идёт через Гомборский перевал и Телави (около 145 км), но после зимних
    снегопадов перевал ненадолго закрывают. Парковка — со стороны курорта, вдоль берега тянется ровная
    дорожка. Машины эконом-класса вполне достаточно.
fa:
  name: دریاچهٔ کوارلی
  short: >-
    مخزنی کوچک پشت سدی خاکی در دامنهٔ قفقاز، با قایق‌های پارویی، استراحتگاهی کنار آب و دامنه‌های جنگلی
    که در آب بازتاب می‌یابند.
  body: >-
    **دریاچهٔ کوارلی را نیافته‌اند، ساخته‌اند: مخزنی کوچک که سدی خاکی به بلندی ۲۰ متر آن را در دامنهٔ
    قفقاز، در حاشیهٔ شهر کوارلی، نگه داشته است.**


    دریاچه بر کرانهٔ راست رود دوروجی، در ارتفاع ۴۳۰ متری از سطح دریا، در گودالی کوچک جای دارد که روزگاری
    جویباری آن را کنده بود؛ طول سد ۸۰۰ متر است. پهنهٔ آب ۰٫۹ کیلومتر درازا و ۰٫۳ کیلومتر پهنا دارد، ژرفایش
    در عمیق‌ترین نقطه به ۲۰ متر می‌رسد و میانگین آن ۱۲ متر است. جز باران و آب برف چیزی آن را تغذیه نمی‌کند
    و آبش صرف آبیاری می‌شود.


    از سال ۲۰۱۰ استراحتگاه «دریاچهٔ کوارلی» کرانهٔ جنوب‌غربی را در اختیار دارد، با حدود صد اتاق، استخرها
    و اسپا. قایق‌های موتوری، قایق‌های پدالی، قایق‌های پارویی و دوچرخه‌های آبی روی آب می‌روند، و در روز
    صاف دیوارهٔ جنگلی قفقاز پشت آن قد می‌کشد و بر سطح آب دوباره نقش می‌بندد.


    آن را با دریاچهٔ ایلیا، حدود ۴ کیلومتر دورتر، اشتباه نگیرید. از این‌جا تا خانه‌موزهٔ ایلیا چاوچاوادزه
    ۶ کیلومتر راه است و تاکستان‌های کیندزماراولی گرداگرد شهر گسترده‌اند.


    این‌جا طبیعت بکر نیست و ادعایش را هم ندارد. جایی است که پس از صبحی در میان کووِری‌ها و تالارهای موزه،
    قایقی کرایه می‌کنید و ساعتی آرام روی آب می‌گذرانید.
  tip: >-
    کرانه رایگان است؛ قایق‌ها، استخرها و اسپا از خدمات پولی استراحتگاه‌اند. فصل شنا ژوئن تا سپتامبر است
    — همان‌جا بپرسید کدام بخش از ساحل برای شنا باز است. استراحتگاه در تمام سال کار می‌کند، اما بیرون از
    تابستان دریاچه برای قدم زدن و تماشاست، نه شنا. آخر هفته‌های تابستان منتظر شلوغی باشید. به‌آسانی می‌توان
    آن را با موزهٔ ایلیا چاوچاوادزه و سرداب‌های کیندزماراولی در یک روز جمع کرد، با ناهاری در شهر کوارلی.
  route: >-
    دریاچهٔ کوارلی حدود ۱۵۰ کیلومتر با تفلیس فاصله دارد — تقریباً ۲ ساعت و ۳۰ دقیقه، سراسر آسفالت. بزرگراه
    کاختی (S5) را از ساگارجو تا باکورتسیخه بروید، از راه گورجانی به سوی شمال بپیچید و جادهٔ موکوزانی–کوارلی
    (Sh69) را تا شهر دنبال کنید، سپس از میان کوارلی تا کرانهٔ جنوبی دریاچه بگذرید. راه دیگر از گردنهٔ
    گومبوری و تلاوی می‌گذرد (حدود ۱۴۵ کیلومتر)، اما پس از برف زمستانی ممکن است مدتی کوتاه بسته شود. پارکینگ
    در سمت استراحتگاه است و مسیری هموار در امتداد ساحل کشیده شده. خودروی اقتصادی کاملاً کافی است.
he:
  name: אגם קוורלי
  short: מאגר קטן מאחורי סכר עפר למרגלות הקווקז, עם סירות משוטים, אתר נופש על החוף ומדרונות מיוערים המשתקפים
    במים.
  body: >-
    **את אגם קוורלי לא מצאו, אלא יצרו: זהו מאגר קטן שסכר עפר בגובה 20 מטר עוצר למרגלות הקווקז, בקצה העיירה
    קוורלי.**


    הוא שוכן על הגדה הימנית של נהר דורוג'י, בגובה 430 מ' מעל פני הים, בשקע קטן שחצב בזמנו נחל; אורך הסכר
    800 מ'. המים משתרעים על פני 0.9 ק״מ על 0.3 ק״מ, עומקם המרבי 20 מ' והממוצע 12 מ'. דבר אינו מזין אותו
    מלבד גשם ושלג נמס, ומימיו משמשים להשקיה.


    מאז 2010 תופס את החוף הדרום-מערבי אתר הנופש „אגם קוורלי“, ובו כמאה חדרים, בריכות וספא. סירות מנוע,
    סירות פדלים, סירות משוטים ואופני מים יוצאים אל המים, וביום בהיר מתנשאת מאחוריו חומת הקווקז המיוערת
    ומשתקפת כפולה על פני המים.


    אל תבלבלו אותו עם אגם איליה, כ-4 ק״מ משם. מכאן בית-המוזיאון של איליה צ'בצ'בדזה נמצא במרחק 6 ק״מ, וכרמי
    קינדזמראולי פרושים סביב העיירה.


    זה אינו טבע פראי, והוא גם לא מתיימר להיות. זה המקום שבו, אחרי בוקר בין כדי קוורי ואולמות מוזיאון,
    שוכרים סירה ומבלים שעה שקטה על המים.
  tip: >-
    קו החוף פתוח לכולם בחינם; הסירות, הבריכות והספא הם שירותים בתשלום של אתר הנופש. עונת הרחצה היא מיוני
    עד ספטמבר — שאלו במקום איזה קטע חוף פתוח לרחצה. אתר הנופש פועל כל השנה, אבל מחוץ לקיץ האגם מתאים לטיול
    ולנוף ולא לשחייה. בסופי שבוע בקיץ צפו לעומס. קל לשלב אותו ביום אחד עם מוזיאון איליה צ'בצ'בדזה ועם
    מרתפי קינדזמראולי, ולאכול צהריים בעיירה קוורלי.
  route: >-
    אגם קוורלי נמצא כ-150 ק״מ מטביליסי — כשעתיים וחצי, אספלט לכל אורך הדרך. סעו בכביש קאחתי (S5) דרך סגרג'ו
    עד בקורציחה, פנו צפונה דרך גורג'אאני והמשיכו בכביש מוקוזאני–קוורלי (Sh69) אל העיירה, ואז חצו את קוורלי
    עד החוף הדרומי של האגם. החלופה עוברת במעבר גומבורי דרך טלאווי (כ-145 ק״מ), אבל המעבר עלול להיסגר לזמן
    קצר אחרי שלג חורפי. החניה בצד של אתר הנופש, ולאורך החוף עובר שביל מישורי. רכב חסכוני מספיק לגמרי.
ar:
  name: بحيرة كفاريلي
  short: >-
    خزان صغير خلف سد ترابي عند سفح القوقاز، فيه قوارب تجديف ومنتجع على الضفة، وتنعكس المنحدرات المشجرة
    على صفحة مائه.
  body: >-
    **بحيرة كفاريلي صُنعت ولم تُكتشف: خزان صغير يحتجزه سد ترابي بارتفاع 20 متراً عند سفح القوقاز، على
    طرف بلدة كفاريلي.**


    تقع على الضفة اليمنى لنهر دوروجي، على ارتفاع 430 م فوق سطح البحر، في منخفض صغير حفره جدول في زمن مضى؛
    ويبلغ طول السد 800 م. يمتد الماء 0.9 كم طولاً و0.3 كم عرضاً، ويبلغ عمقه 20 م في أعمق نقطة، و12 م في
    المتوسط. لا يغذيها سوى المطر وذوبان الثلوج، وتُستخدم مياهها للري.


    منذ عام 2010 يشغل منتجع «بحيرة كفاريلي» الضفة الجنوبية الغربية، وفيه نحو مئة غرفة ومسابح ومركز سبا.
    تخرج إلى الماء قوارب بمحرك وقوارب بدواسات وقوارب تجديف ودراجات مائية، وفي اليوم الصافي ينتصب خلفها
    جدار القوقاز المكسوّ بالغابات فيتضاعف على سطح الماء.


    لا تخلط بينها وبين بحيرة إيليا، على بعد نحو 4 كم. ومن هنا يبعد بيت-متحف إيليا تشافتشافادزه 6 كم، وتمتد
    كروم كيندزماراولي حول البلدة.


    ليست هذه طبيعة برية، ولا تدّعي ذلك. إنها المكان الذي تستأجر فيه قارباً، بعد صباح بين جرار القفيفري
    وقاعات المتحف، وتقضي ساعة هادئة على الماء.
  tip: >-
    الشاطئ مجاني؛ أما القوارب والمسابح والسبا فخدمات مدفوعة يقدمها المنتجع. موسم السباحة من يونيو إلى
    سبتمبر — واسأل في المكان عن الجزء المفتوح للسباحة من الشاطئ. يعمل المنتجع طوال العام، لكن البحيرة
    خارج الصيف للنزهة والمنظر أكثر منها للسباحة. توقّع الزحام في عطلات نهاية الأسبوع صيفاً. ويسهل الجمع
    بينها وبين متحف إيليا تشافتشافادزه وأقبية كيندزماراولي في يوم واحد، مع غداء في بلدة كفاريلي.
  route: >-
    تبعد بحيرة كفاريلي نحو 150 كم عن تبليسي — قرابة ساعتين ونصف، على الإسفلت طوال الطريق. اسلك طريق كاخيتي
    السريع (S5) عبر ساغاريجو حتى باكورتسيخي، ثم اتجه شمالاً عبر غورجاني واتبع طريق موكوزاني–كفاريلي (Sh69)
    إلى البلدة، ثم اعبر كفاريلي إلى الضفة الجنوبية للبحيرة. البديل يمر بممر غومبوري عبر تيلافي (نحو 145
    كم)، لكنه قد يُغلق لفترة قصيرة بعد ثلوج الشتاء. الموقف في جهة المنتجع، ويمتد على طول الشاطئ ممشى مستوٍ.
    السيارة الاقتصادية كافية تماماً.
