ka:
  name: ხაბელაშვილების თაღოვანი ხიდი
  short: >-
    ხის გადახურული თაღოვანი ხიდი ჭვანის ხეობაში — თელის, წაბლისა და მუხისგან ნაგები და, სოფლელების თქმით,
    სამასი წლის.
  body: >-
    **აჭარის ძველი ხიდების უმეტესობა ქვისაა; ხაბელაშვილების ხიდი კი ხისაა, სახლივით გადახურული, და, სოფლელების
    თქმით, ხალხს მდინარეზე უკვე სამასი წელია გადაჰყავს.**


    ხიდი შუახევის მუნიციპალიტეტში, ჭვანის ხეობაში დგას, სიმწვანეში ჩაფლული, მდინარის გაყოლებით მიმავალი
    500-მეტრიანი ბილიკის ბოლოს. ადგილობრივი ცნობებით, იგი ხეობის სოფლების ხულოსთან დასაკავშირებლად ააგეს,
    ხაბელაშვილებს კი მეზობელ ბრილთანაც აკავშირებდა. სიგრძე 25 მეტრია, სავალი ნაწილის სიგანე — სულ 1,2
    მეტრი.


    მშენებლებმა ყოველ ჯიშს თავისი საქმე მიუჩინეს: თელას — კოჭები, წაბლს — მალები, მუხას — საყრდენი ბოძები,
    ურთხელს კი — სახურავის ქვეშა ნაწილი. თავდაპირველად ხიდი ყავრით იყო გადახურული; XX საუკუნეში დაზიანებული
    სახურავი თუნუქით შეცვალეს. მშენებლის სახელი და ზუსტი თარიღი არ შემორჩენილა — სამასი წელი სოფლის საკუთარი
    ანგარიშია, — მაგრამ ხიდს მთელ დასავლეთ საქართველოში იშვიათს უწოდებენ, და შესადარებელი აქ ბევრია: ქვემოთ,
    ქედის მუნიციპალიტეტში, დანდალოსა და მახუნცეთის შუა საუკუნეების ქვის თაღები დგას.


    გადმოცემით, თუ ხიდზე გავლისას მდინარეში მონეტას ჩააგდებთ, სურვილი აგიხდებათ. იმავე ბილიკით შეგიძლიათ
    წისქვილების სოფლამდე გაიაროთ ან ლელთის ტბისკენ გაილაშქროთ.


    ხე ამდენ ნესტიან ზამთარს არ უნდა უძლებდეს. ეს ხიდი, თავისი თუნუქის სახურავის ქვეშ, უძლებს.
  tip: >-
    მანქანა სოფელში დატოვეთ და ბოლო 500 მეტრი მდინარისპირა ბილიკით ფეხით გაიარეთ; ბილიკი ხშირად სველია,
    ამიტომ მოუცურებელი ფეხსაცმელი ჩაიცვით. ხიდს ნახევარი საათი ეყოფა, წისქვილებისკენ ან ლელთის ტბისკენ
    გაგრძელებას კი რამდენიმე საათი დასჭირდება — ბილიკის მდგომარეობა წინასწარ სოფელში იკითხეთ. შესვლა უფასოა,
    ინფრასტრუქტურა კი არ არის, ამიტომ წყალი და საჭმელი შუახევიდან ან ხულოდან წამოიღეთ. სავალი ნაწილი ვიწროა
    და წვიმის შემდეგ სრიალებს: ბავშვებს ხელი მოჰკიდეთ.
  route: >-
    მთელი წლის გზა ბათუმსა და ქედაზე გადის: დაახლოებით 430 კილომეტრი და 6 საათი და 45 წუთი — ს1-ით (E60),
    ს12-ითა და ს2-ით ბათუმამდე, იქიდან კი შ1-ით აჭარისწყლის ხეობას ქედის გავლით ხიჩაურამდე აუყევით. ზაფხულში
    გოდერძის უღელტეხილი გზას 350 კილომეტრამდე და დაახლოებით 6 საათსა და 20 წუთამდე ამოკლებს: ს1-ით (E60)
    დასავლეთით, ს8-ით ბორჯომის გავლით ახალციხემდე, შ1-ით უღელტეხილის გადავლით ხულომდე, შემდეგ კი აჭარისწყალს
    შუახევის გავლით ხიჩაურამდე ჩაუყევით. წინასწარ დარწმუნდით, რომ უღელტეხილი ღიაა და ქირავნობის ხელშეკრულება
    მასზე გავლის უფლებას გაძლევთ. ხიჩაურში ბათუმი–ხულოს გზიდან ჩრდილოეთით გადაუხვიეთ და ჭვანის ხეობას
    დაახლოებით 13 კილომეტრი აუყევით ხაბელაშვილებამდე. გზა ვიწრო და კლაკნილია; მშრალ ამინდში ეკონომ-კლასის
    მანქანა თავს ართმევს, ოღონდ ნელა იარეთ. საწვავი ხულოში, შუახევსა ან ქედაში ჩაასხით.
en:
  name: Khabelashvilebi Arched Bridge
  short: >-
    A roofed wooden arched bridge in the Chvani valley, built of elm, chestnut and oak and, the villagers
    say, some three hundred years old.
  body: >-
    **Most of Adjara's old bridges are stone; the one at Khabelashvilebi is timber, roofed like a house,
    and the villagers say it has been carrying people over the river for three hundred years.**


    It stands in the Chvani valley in Shuakhevi municipality, sunk in greenery at the end of a 500-metre
    path along the river. Local accounts say it was built to link the valley's villages with Khulo, and
    it joined Khabelashvilebi to neighbouring Brili. It is 25 metres long, and its walkway is barely 1.2
    metres wide.


    The builders gave each wood its own job: elm for the beams, chestnut for the spans, oak for the posts,
    and yew beneath the roof. That roof was first laid with wooden shingles; in the 20th century, once
    damaged, it was replaced with tin. No builder's name or firm date survives, and the three hundred
    years are the village's own reckoning, but the bridge is called rare across the whole of western Georgia.
    Adjara offers plenty to compare it with: downriver in Keda municipality stand the medieval stone arches
    of Dandalo and Makhuntseti.


    Tradition says that if you drop a coin into the river as you cross, your wish will come true. The
    same path runs on to a village of mills, and hikers follow it towards Lelti Lake.


    Timber is not meant to outlast so many wet winters. This bridge, under its tin roof, has.
  tip: >-
    Leave the car in the village and walk the last 500 metres on the riverside path; it is often damp,
    so wear shoes with grip. Half an hour is enough for the bridge itself. Continuing to the mills or
    towards Lelti Lake takes a few hours, so ask in the village about the state of the trail first. Entry
    is free and there are no facilities, so bring water and food from Shuakhevi or Khulo. The walkway
    is narrow and slippery after rain: hold children by the hand.
  route: >-
    Year-round, the way is via Batumi and Keda: about 430 km and 6 hours 45 minutes on the S1 (E60), S12
    and S2 to Batumi, then up the Adjaristsqali valley on the Sh1 through Keda to Khichauri. In summer
    the Goderdzi Pass cuts it to 350 km and about 6 hours 20 minutes: west on the S1 (E60), south on the
    S8 through Borjomi to Akhaltsikhe, over the pass on the Sh1 to Khulo, then down the Adjaristsqali
    past Shuakhevi to Khichauri. Check that the pass is open and that your rental contract allows it.
    At Khichauri turn north off the Batumi–Khulo road and follow the Chvani valley for about 13 km to
    Khabelashvilebi. The road is narrow and winding; an economy car copes in dry weather if you take it
    slowly. Fuel in Khulo, Shuakhevi or Keda.
ru:
  name: Арочный мост Хабелашвилеби
  short: >-
    Крытый деревянный арочный мост в долине Чвани из вяза, каштана и дуба; по словам сельчан, ему около
    трёхсот лет.
  body: >-
    **Большинство старых мостов Аджарии каменные; мост у Хабелашвилеби — деревянный, крытый, словно дом,
    и, по словам сельчан, вот уже триста лет переводит людей через реку.**


    Он стоит в долине Чвани, в Шуахевском муниципалитете, утопая в зелени в конце 500-метровой тропы вдоль
    реки. По местным рассказам, его построили, чтобы связать сёла долины с Хуло, и он соединял Хабелашвилеби
    с соседним Брили. Длина моста — 25 метров, а настил едва достигает 1,2 метра в ширину.


    Строители поручили каждой породе дерева своё дело: вяз пошёл на балки, каштан — на пролёты, дуб —
    на стойки, а тис — под крышу. Сначала крышу крыли деревянной дранкой; в XX веке, когда она пострадала,
    её заменили жестью. Ни имени строителя, ни точной даты не сохранилось, и триста лет — это счёт самой
    деревни, но мост называют редкостью для всей Западной Грузии. Сравнить его в Аджарии есть с чем: ниже
    по течению, в Кедском муниципалитете, стоят средневековые каменные арки Дандало и Махунцети.


    По преданию, если, переходя мост, бросить в реку монетку, желание сбудется. Та же тропа ведёт дальше,
    к селу мельниц, а туристы уходят по ней в сторону озера Лелти.


    Дереву не положено переживать столько сырых зим. Этот мост под жестяной крышей пережил.
  tip: >-
    Оставьте машину в селе и пройдите последние 500 метров по тропе вдоль реки; она часто сырая, так что
    наденьте обувь с цепкой подошвой. На сам мост хватит получаса. Прогулка дальше, к мельницам или в
    сторону озера Лелти, займёт несколько часов, поэтому сначала спросите в селе, в каком состоянии тропа.
    Вход свободный, никакой инфраструктуры нет — везите воду и еду из Шуахеви или Хуло. Настил узкий и
    после дождя скользкий: держите детей за руку.
  route: >-
    Круглый год — через Батуми и Кеду: около 430 км и 6 часов 45 минут по S1 (E60), S12 и S2 до Батуми,
    затем вверх по долине Аджарисцкали по Sh1 через Кеду до Хичаури. Летом перевал Годердзи сокращает
    путь до 350 км и примерно 6 часов 20 минут: на запад по S1 (E60), на юг по S8 через Боржоми до Ахалцихе,
    по Sh1 через перевал до Хуло, затем вниз по долине Аджарисцкали мимо Шуахеви до Хичаури. Убедитесь,
    что перевал открыт и что договор проката разрешает этот маршрут. В Хичаури сверните с дороги Батуми
    — Хуло на север и около 13 км езжайте по долине Чвани до Хабелашвилеби. Дорога узкая и извилистая;
    в сухую погоду машина эконом-класса справится, если не спешить. Заправки — в Хуло, Шуахеви или Кеде.
fa:
  name: پل طاقی خابلاشویلبی
  short: >-
    پلی چوبی، طاق‌دار و سرپوشیده در درهٔ چوانی، ساخته از نارون، شاه‌بلوط و بلوط، که به گفتهٔ روستاییان
    حدود سیصد سال عمر دارد.
  body: >-
    **بیشتر پل‌های کهن آجارا سنگی‌اند؛ پل خابلاشویلبی اما چوبی است، سقفی دارد مانند خانه، و به گفتهٔ روستاییان
    سیصد سال است که مردم را از رودخانه می‌گذراند.**


    این پل در درهٔ چوانی در شهرستان شواخوی ایستاده است، غرق در سبزی، در انتهای کوره‌راهی ۵۰۰ متری در کنار
    رود. به روایت محلی، آن را ساختند تا روستاهای دره را به خولو پیوند دهد، و خابلاشویلبی را به روستای
    همسایه، بریلی، وصل می‌کرد. طولش ۲۵ متر است و گذرگاهش به‌زحمت ۱٫۲ متر پهنا دارد.


    سازندگان به هر چوبی کاری سپردند: نارون برای تیرها، شاه‌بلوط برای دهانه‌ها، بلوط برای پایه‌ها و سرخدار
    برای زیر سقف. سقف را نخست با تخته‌های نازک چوبیِ روی‌هم‌چیده پوشانده بودند؛ در سدهٔ بیستم، پس از آسیب
    دیدن، حلبی جای آن را گرفت. نه نام سازنده‌ای مانده و نه تاریخ قطعی‌ای، و آن سیصد سال حساب خود روستاست،
    اما این پل را در سراسر غرب گرجستان کمیاب می‌دانند. آجارا برای مقایسه کم ندارد: پایین‌تر در دره، در
    شهرستان کدا، پل‌های طاقی سنگیِ سده‌های میانه در داندالو و ماخونتستی ایستاده‌اند.


    بنا بر باوری کهن، اگر هنگام گذشتن از پل سکه‌ای در رود بیندازید، آرزویتان برآورده می‌شود. همین کوره‌راه
    تا روستایی پر از آسیاب ادامه دارد و کوهپیمایان از آن به سوی دریاچهٔ للتی می‌روند.


    چوب قرار نیست این‌همه زمستان خیس را تاب بیاورد. این پل، زیر سقف حلبی‌اش، تاب آورده است.
  tip: >-
    خودرو را در روستا بگذارید و ۵۰۰ متر آخر را از کوره‌راه کنار رود پیاده بروید؛ این راه اغلب نمناک است،
    پس کفشی با کف غیرلغزنده بپوشید. برای خود پل نیم ساعت کافی است. ادامهٔ راه تا آسیاب‌ها یا به سوی دریاچهٔ
    للتی چند ساعت طول می‌کشد، پس نخست در روستا از وضع مسیر بپرسید. ورود رایگان است و هیچ امکاناتی نیست،
    پس آب و غذا را از شواخوی یا خولو بیاورید. گذرگاه باریک است و پس از باران لغزنده: دست کودکان را بگیرید.
  route: >-
    مسیر تمام‌سال از راه باتومی و کدا می‌گذرد: حدود ۴۳۰ کیلومتر و ۶ ساعت و ۴۵ دقیقه، با S1 (E60)، S12
    و S2 تا باتومی، و سپس با Sh1 در درهٔ آجاریس‌تسکالی رو به بالا از راه کدا تا خیچائوری. در تابستان گردنهٔ
    گودردزی راه را به ۳۵۰ کیلومتر و حدود ۶ ساعت و ۲۰ دقیقه کوتاه می‌کند: با S1 (E60) رو به غرب، با S8
    رو به جنوب از راه بورجومی تا آخالتسیخه، با Sh1 از گردنه تا خولو، و سپس در سرازیری درهٔ آجاریس‌تسکالی
    از کنار شواخوی تا خیچائوری. مطمئن شوید گردنه باز است و قرارداد اجاره عبور از آن را مجاز می‌داند. در
    خیچائوری از جادهٔ باتومی–خولو رو به شمال بپیچید و حدود ۱۳ کیلومتر درهٔ چوانی را تا خابلاشویلبی دنبال
    کنید. جاده باریک و پرپیچ‌وخم است؛ در هوای خشک، اگر آهسته برانید، خودروی اقتصادی از پسش برمی‌آید. سوخت
    در خولو، شواخوی یا کدا.
he:
  name: הגשר המקומר של חבלשווילבי
  short: גשר עץ מקומר ומקורה בעמק צ'וואני, בנוי מבוקיצה, ערמון ואלון, ולדברי תושבי הכפר בן כשלוש מאות
    שנה.
  body: >-
    **רוב הגשרים העתיקים של אג'ריה בנויים מאבן; הגשר בחבלשווילבי עשוי עץ, מקורה בגג כמו בית, ולפי תושבי
    הכפר הוא מעביר אנשים מעל הנהר כבר שלוש מאות שנה.**


    הוא ניצב בעמק צ'וואני שבמוניציפליטת שואחבי, שקוע בירק, בקצה שביל של 500 מטרים לאורך הנהר. לפי המסורת
    המקומית הוא נבנה כדי לחבר את כפרי העמק עם חולו, והוא קישר בין חבלשווילבי לכפר השכן ברילי. אורכו 25
    מטרים, ומשטח ההליכה שלו רחב בקושי 1.2 מטרים.


    הבונים הקצו לכל סוג עץ את תפקידו: בוקיצה לקורות, ערמון למפתחי הגשר, אלון לעמודים, וטקסוס מתחת לגג.
    הגג כוסה תחילה ברעפי עץ; במאה ה-20, לאחר שניזוק, הוחלף בפח. שם הבונה ותאריך ודאי לא השתמרו, ושלוש
    מאות השנים הן החשבון של הכפר עצמו, אבל הגשר נחשב נדיר בכל מערב גאורגיה. באג'ריה לא חסר עם מה להשוות:
    במורד הזרם, במוניציפליטת קדה, עומדות קשתות האבן של דנדאלו ומאחונצטי מימי הביניים.


    המסורת אומרת שאם תשליכו מטבע לנהר בזמן שאתם חוצים את הגשר, משאלתכם תתגשם. אותו שביל ממשיך אל כפר של
    טחנות, ומטיילים הולכים בו לעבר אגם ללטי.


    עץ אינו אמור לשרוד כל כך הרבה חורפים רטובים. הגשר הזה, תחת גג הפח שלו, שרד.
  tip: >-
    השאירו את הרכב בכפר ולכו את 500 המטרים האחרונים בשביל שלאורך הנהר; הוא לח לעיתים קרובות, אז נעלו נעליים
    עם אחיזה טובה. לגשר עצמו מספיקה חצי שעה. ההמשך אל הטחנות או לעבר אגם ללטי אורך כמה שעות, לכן שאלו
    קודם בכפר על מצב השביל. הכניסה חופשית ואין במקום שום מתקנים, אז הביאו מים ואוכל משואחבי או מחולו.
    משטח ההליכה צר וחלקלק אחרי גשם: החזיקו ילדים ביד.
  route: >-
    כל השנה הדרך עוברת דרך בטומי וקדה: כ-430 ק״מ וכ-6 שעות ו-45 דקות בכבישים S1 (E60),‏ S12 ו-S2 עד בטומי,
    ומשם במעלה עמק האג'ריסצקאלי בכביש Sh1 דרך קדה עד חיצ'אורי. בקיץ מעבר גודרדזי מקצר את הדרך ל-350 ק״מ
    וכ-6 שעות ו-20 דקות: מערבה בכביש S1 (E60), דרומה בכביש S8 דרך בורג'ומי לאחלציחה, מעל המעבר בכביש Sh1
    עד חולו, ומשם במורד עמק האג'ריסצקאלי על פני שואחבי עד חיצ'אורי. בדקו שהמעבר פתוח ושחוזה ההשכרה מתיר
    לנסוע בו. בחיצ'אורי פנו צפונה מכביש בטומי–חולו והמשיכו כ-13 ק״מ לאורך עמק צ'וואני עד חבלשווילבי. הדרך
    צרה ומתפתלת; רכב חסכוני מסתדר בה במזג אוויר יבש אם נוסעים לאט. דלק בחולו, בשואחבי או בקדה.
ar:
  name: جسر خابيلاشفيليبي المقوّس
  short: >-
    جسر خشبي مقوّس ومسقوف في وادي تشفاني، مبني من الدردار والكستناء والبلوط، ويقول أهل القرية إن عمره
    نحو ثلاثمئة عام.
  body: >-
    **معظم الجسور القديمة في أدجارا من الحجر؛ أما جسر خابيلاشفيليبي فمن الخشب، مسقوف كأنه بيت، ويقول أهل
    القرية إنه يحمل الناس فوق النهر منذ ثلاثمئة عام.**


    يقف الجسر في وادي تشفاني ببلدية شواخيفي، غارقاً في الخضرة عند نهاية درب طوله 500 متر على امتداد النهر.
    وتقول الروايات المحلية إنه بُني ليصل قرى الوادي بخولو، وكان يربط خابيلاشفيليبي بقرية بريلي المجاورة.
    يبلغ طوله 25 متراً، وبالكاد يبلغ عرض ممشاه 1.2 متر.


    أعطى البنّاؤون كل نوع من الخشب مهمته: الدردار للعوارض، والكستناء للبحور، والبلوط للدعائم، والطقسوس
    تحت السقف. وكان السقف مغطى أولاً بألواح خشبية رقيقة متراكبة؛ وفي القرن العشرين، بعد أن تضرر، حلّ محلها
    الصفيح. لم يبقَ اسم للبنّاء ولا تاريخ مؤكد، والثلاثمئة عام حسابُ القرية نفسها، لكن الجسر يوصف بأنه
    نادر في غرب جورجيا كله. وفي أدجارا ما يكفي للمقارنة: فأسفل مجرى النهر، في بلدية كيدا، تقوم الأقواس
    الحجرية لجسري داندالو وماخونتسيتي من العصور الوسطى.


    يقول الموروث إنك إن ألقيت قطعة نقدية في النهر وأنت تعبر، تحققت أمنيتك. والدرب نفسه يمضي إلى قرية للطواحين،
    ويسلكه المتنزهون سيراً نحو بحيرة ليلتي.


    ليس من شأن الخشب أن يصمد أمام هذا العدد من الشتاءات الماطرة. لكن هذا الجسر، تحت سقفه من الصفيح، صمد.
  tip: >-
    اترك السيارة في القرية وامشِ آخر 500 متر على الدرب المحاذي للنهر؛ غالباً ما يكون رطباً، فانتعل حذاءً
    لا ينزلق. نصف ساعة تكفي للجسر نفسه. أما مواصلة المشي إلى الطواحين أو نحو بحيرة ليلتي فتستغرق بضع ساعات،
    فاسأل في القرية أولاً عن حال الدرب. الدخول مجاني ولا توجد أي مرافق، فأحضر الماء والطعام من شواخيفي
    أو خولو. الممشى ضيق وزلق بعد المطر: أمسك بأيدي الأطفال.
  route: >-
    على مدار السنة يمر الطريق بباتومي وكيدا: نحو 430 كم وقرابة 6 ساعات و45 دقيقة على S1 (E60) وS12 وS2
    حتى باتومي، ثم صعوداً في وادي أدجاريستسكالي على Sh1 عبر كيدا حتى خيتشاوري. وفي الصيف يختصر ممر غودردزي
    الطريق إلى 350 كم ونحو 6 ساعات و20 دقيقة: غرباً على S1 (E60)، ثم جنوباً على S8 عبر بورجومي إلى أخالتسيخه،
    ثم عبر الممر على Sh1 إلى خولو، ومنها نزولاً مع وادي أدجاريستسكالي مروراً بشواخيفي حتى خيتشاوري. تأكد
    أن الممر مفتوح وأن عقد الاستئجار يسمح بعبوره. في خيتشاوري انعطف شمالاً عن طريق باتومي–خولو واتبع وادي
    تشفاني نحو 13 كم حتى خابيلاشفيليبي. الطريق ضيق ومتعرج؛ وتتدبر السيارة الاقتصادية أمرها في الطقس الجاف
    إن قدتَ على مهل. الوقود في خولو أو شواخيفي أو كيدا.
