ka:
  name: ლეღვთახევის ჩანჩქერი
  short: >-
    ჩანჩქერი ძველი თბილისის შუაგულში: გოგირდის აბანოებიდან ხუთ წუთში ქვიშაქვის ხეობა იწყება, კლდის პირზე
    გადმოკიდებული აივნებით.
  body: >-
    **აბანოების აგურის გუმბათებს ჩაუვლით, ხუთიოდე წუთს გაივლით და ქალაქი უცებ წყდება: თქვენ წინ ქვიშაქვის
    კლდიდან ჩანჩქერი ეშვება.**


    ხეობას ლეღვთახევი ჰქვია — ოდესღაც მის ფერდობებს ლეღვის ხეები ფარავდა. წერილობით წყაროებში ის პირველად
    1429 წელს იხსენიება. ხევში წავკისისწყალი მოედინება — პატარა მდინარე, რომელიც ბოტანიკური ბაღის გავლით
    ჩამოდის და აბანოების ქვეშ მტკვარს უერთდება. საუკუნეების განმავლობაში ეს ნაპრალი საზღვარი იყო: თბილისის
    უძველეს უბანს, კალას, დანარჩენი ქალაქისგან ჰყოფდა. ხევს სხვა სახელებიც ჰქონია — მათ შორის წავკისისხევი
    და დაბახანა; ქართული საცნობარო წყაროები ამ უკანასკნელს მეტყავეებს უკავშირებენ, რომლებიც აქ, გოგირდიან
    წყალში, ტყავს ამუშავებდნენ.


    დღეს ბილიკი ციცაბო კლდეებს შორის მიიკლაკნება, თაღოვან ხიდებზე გადადის და ხვეულ კიბეს ჩაუვლის, მაღლა
    კი, ნაპრალის პირას, ძველ სახლებს ხის აივნები გადმოუკიდიათ. მანქანების გუგუნს წყლის შხუილი ანაცვლებს.
    გაზაფხულზე ჩანჩქერი ხმაურობს და ორ ნაკადად ეშვება, შუა ზაფხულში თხელ ფარდად იქცევა, მკაცრ ზამთარში
    კი შეიძლება გაიყინოს კიდეც. ხეობა 2012 წელს გაწმინდეს და კეთილმოაწყვეს; დაბინდებისას ფერადი განათება
    ირთვება — ზოგს ეს ჯადოსნური ეჩვენება, ზოგს ოდნავ თეატრალური.


    გადმოცემა თბილისის დაბადებასაც სულ ახლოს, ორიოდე ნაბიჯში ათავსებს. თითქოს ვახტანგ გორგასალი ნადირობდა,
    როცა მისი შევარდენი და ხოხობი ცხელ წყაროში ჩავარდნენ და დაიხარშნენ; მეფემ თბილი წყლის ირგვლივ ქალაქის
    აშენება ბრძანა — აქედან მოდის სახელიც.


    ჩანჩქერის ძირიდან ახედეთ ზემოთ და მთელ თბილისს ერთ კადრში დაინახავთ: კლდე, თბილი წყალი და სახლები,
    რომლებიც ნაპრალის პირს იმდენად მიუახლოვდნენ, რამდენადაც მათმა პატრონებმა გაბედეს.
  tip: >-
    შესვლა უფასოა და ხეობა, როგორც წესი, დღე-ღამის ნებისმიერ დროს ღიაა; 2025 წელს აქ სამშენებლო სამუშაოები
    მიმდინარეობდა, ამიტომ სპეციალურად წამოსვლამდე გადაამოწმეთ, ბილიკი ღიაა თუ არა. ყველაზე რბილი შუქი
    და ყველაზე მშვიდი ბილიკი დილის ათ საათამდეა; დაბინდებისას ფერადი განათება ირთვება. გასავლელი მოკლეა
    და თითქმის სწორი, მაგრამ წყალთან ქვები წვიმის შემდეგ სრიალებს — ჩაიცვით ფეხსაცმელი არასრიალა ძირით.
    ზაფხულის შაბათ-კვირას შუადღისას ხალხმრავლობაა, ჩანჩქერთან კი სკამები ცოტაა. ტუალეტი, ყავა და გასეირნების
    შემდეგ აბანოში შესვლა — ყველაფერი ორ წუთშია, აბანოთუბანში. წყალი ყველაზე უხვად აპრილსა და მაისშია;
    აგვისტოს ბოლოს ჩანჩქერი შეიძლება თხელ ძაფად იქცეს.
  route: >-
    ხეობაში მხოლოდ ფეხით შეხვალთ, ასე რომ, მანქანით მგზავრობა აბანოთუბანში მთავრდება. თავისუფლების მოედნიდან
    მტკვრის მარჯვენა სანაპიროზე ჩადით და დინების მიმართულებით გორგასლის მოედნამდე გაჰყევით — დაახლოებით
    2 კილომეტრი, ჩვეულებრივ მოძრაობაში ათიოდე წუთი. მანქანა დატოვეთ გორგასლის მოედნის ფასიან ავტოსადგომზე
    ან მეტეხის ხიდის გაღმა, ევროპის მოედანზე (საათობრივი ტარიფი, „თბილისი პარკინგის“ აპლიკაცია), შემდეგ
    აბანოს ქუჩას აბანოების გუმბათების გასწვრივ გაჰყევით; ქუჩის ბოლოს ხეობა იწყება, ჩანჩქერამდე კი ხუთიდან
    შვიდ წუთამდე სავალია. ეკონომკლასის მანქანა სავსებით საკმარისია. შაბათ-კვირას ავტოსადგომები შუადღემდე
    ივსება, ამიტომ ადრე მოდით.
en:
  name: Leghvtakhevi Waterfall
  short: >-
    A waterfall in the heart of Old Tbilisi: five minutes from the sulphur baths, a sandstone gorge with
    old balconies hanging over its edge.
  body: >-
    **Walk five minutes past the brick domes of the sulphur baths and the city simply stops: in front
    of you a waterfall drops down a sandstone cliff.**


    The gorge is Leghvtakhevi, the "fig ravine", named for the fig trees that once crowded its slopes;
    written sources first mention it in 1429. Through it runs the Tsavkisistskali, a small river that
    comes down past the Botanical Garden and slips beneath the baths into the Mtkvari. For centuries this
    cleft was a frontier, dividing Kala, the oldest quarter of Tbilisi, from the rest of the town. It
    has carried other names too, Tsavkisiskhevi among them, and Dabakhana, which Georgian reference works
    trace to the tanners who once worked hides in the sulphurous water here.


    Today the path winds between sheer rock walls, over arched footbridges and past a spiral stair, while
    high above the old houses push their wooden balconies out over the edge. The sound of water replaces
    the traffic. In spring the fall is loud and runs in a double stream; by high summer it thins to a
    veil, and in a hard winter it can freeze. The gorge was cleared and landscaped in 2012, and after
    dark it is lit in colour, magical to some, a touch theatrical to others.


    Tradition puts the birth of Tbilisi within a stone's throw of this spot. King Vakhtang Gorgasali,
    the legend goes, was out hunting when his falcon and a pheasant fell into a hot spring and were scalded
    to death; the king ordered a city built around the warm water, and *tbili* means warm.


    Look up from the foot of the fall and you see the whole bargain of Tbilisi in one frame: rock, hot
    water, and houses built as close to the edge as their owners dared.
  tip: >-
    Free and normally open at any hour; the gorge saw construction works in 2025, so if you are coming
    specially, check that the path is open. The softest light and the emptiest path come before ten in
    the morning; from dusk the coloured lighting takes over. The walk is short and nearly level, but the
    stones by the water turn slick after rain, so wear shoes with grip. On summer weekends the gorge fills
    up by midday and benches near the fall are few. Toilets, coffee and a post-walk soak are all two minutes
    away in Abanotubani. Come in April or May for the fullest flow; by late August the fall can shrink
    to a thread.
  route: >-
    The gorge is for walkers only, so the drive ends in Abanotubani. From Freedom Square drop down to
    the right-bank embankment and follow it downstream to Gorgasali Square: about 2 km, ten minutes in
    ordinary traffic. Park at the paid car park on Gorgasali Square or across the Metekhi Bridge at Europe
    Square (hourly rates, Tbilisi Parking app), then walk along Abano Street past the bath domes; the
    gorge opens where the street ends, and the waterfall is five to seven minutes on foot. An economy
    car is all you need. At weekends the car parks fill by late morning, so come early.
ru:
  name: Водопад Легвтахеви
  short: >-
    Водопад в сердце Старого Тбилиси: в пяти минутах от серных бань — песчаниковое ущелье, над краем которого
    нависают старые балконы.
  body: >-
    **Пройдите пять минут мимо кирпичных куполов серных бань — и город вдруг обрывается: перед вами по
    песчаниковой скале падает водопад.**


    Ущелье называется Легвтахеви, «инжирная балка», — по смоковницам, что когда-то теснились на его склонах;
    в письменных источниках оно впервые упоминается в 1429 году. По нему бежит речка Цавкисисцкали: она
    спускается мимо Ботанического сада и ныряет под бани, в Мтквари. Веками эта расселина служила границей,
    отделяя Калу, древнейший квартал Тбилиси, от остального города. Были у неё и другие имена — среди
    них Цавкисисхеви и Дабахана: грузинские справочники связывают это название с кожевниками, которые
    когда-то выделывали здесь шкуры в сернистой воде.


    Сегодня тропа петляет между отвесными скальными стенами, по арочным мостикам и мимо винтовой лестницы,
    а высоко над головой старые дома выдвигают свои деревянные балконы за край обрыва. Шум воды вытесняет
    шум машин. Весной водопад гремит и падает двумя струями, к разгару лета истончается до вуали, а в
    суровую зиму может замёрзнуть. В 2012 году ущелье расчистили и благоустроили, и после заката его подсвечивают
    цветными огнями — одним это кажется волшебным, другим чуть театральным.


    Предание помещает рождение Тбилиси буквально в двух шагах отсюда. Царь Вахтанг Горгасали, гласит легенда,
    охотился, когда его сокол и фазан упали в горячий источник и сварились; царь повелел построить вокруг
    тёплой воды город, а *тбили* по-грузински значит «тёплый».


    Поднимите глаза от подножия водопада — и увидите в одном кадре всю суть Тбилиси: скала, горячая вода
    и дома, построенные у самого края — так близко, как только отваживались их хозяева.
  tip: >-
    Бесплатно и обычно открыто круглосуточно; в 2025 году в ущелье шли строительные работы, так что, если
    едете специально, уточните, открыта ли тропа. Самый мягкий свет и самая пустая тропа — до десяти утра;
    с сумерек власть переходит к цветной подсветке. Прогулка короткая и почти ровная, но камни у воды
    после дождя становятся скользкими, так что нужна обувь с цепкой подошвой. Летними выходными к полудню
    ущелье заполняется, а скамеек у водопада немного. Туалеты, кофе и баня после прогулки — в двух минутах,
    в Абанотубани. Самый полный поток бывает в апреле и мае; к концу августа водопад может истончиться
    до ниточки.
  route: >-
    По ущелью ходят только пешком, поэтому поездка заканчивается в Абанотубани. От площади Свободы спуститесь
    к набережной правого берега и поезжайте по ней вниз по течению до площади Горгасали: около 2 км, десять
    минут при обычном движении. Оставьте машину на платной стоянке на площади Горгасали или за Метехским
    мостом, на площади Европы (почасовая оплата, приложение «Тбилиси Паркинг»), и идите пешком по улице
    Абано мимо куполов бань; ущелье открывается там, где улица кончается, а до водопада пять–семь минут
    ходьбы. Хватит машины эконом-класса. В выходные стоянки заполняются к позднему утру, так что приезжайте
    пораньше.
fa:
  name: آبشار لگوتاخوی
  short: >-
    آبشاری در دل تفلیس قدیم: پنج دقیقه از حمام‌های گوگردی، دره‌ای از ماسه‌سنگ با بالکن‌های کهنه‌ای که
    بر لبه‌اش آویخته‌اند.
  body: >-
    **پنج دقیقه از کنار گنبدهای آجری حمام‌های گوگردی قدم بزنید تا شهر ناگهان تمام شود: پیش رویتان آبشاری
    از صخره‌ای ماسه‌سنگی فرو می‌ریزد.**


    این دره لگوتاخوی نام دارد، «درهٔ انجیر»، به یاد درختان انجیری که روزگاری دامنه‌هایش را پوشانده بودند؛
    نخستین بار در منابع مکتوب در سال ۱۴۲۹ از آن یاد شده است. از میانش رود کوچک تسافکیسیستسکالی می‌گذرد
    که از کنار باغ گیاه‌شناسی پایین می‌آید و از زیر حمام‌ها به مِتکواری می‌ریزد. قرن‌ها این شکاف مرزی
    بود که کالا، کهن‌ترین محلهٔ تفلیس، را از باقی شهر جدا می‌کرد. نام‌های دیگری هم داشته است، از جمله
    تسافکیسیسخوی و دباخانه؛ منابع مرجع گرجی این نام اخیر را به دباغانی نسبت می‌دهند که روزگاری در آب گوگردی
    اینجا پوست دباغی می‌کردند.


    امروز راه‌باریکه میان دیواره‌های صخره‌ای عمودی پیچ‌وتاب می‌خورد، از روی پل‌های طاق‌دار عابر پیاده
    و از کنار پلکانی مارپیچ می‌گذرد، و آن بالا خانه‌های قدیمی بالکن‌های چوبی‌شان را از لبه بیرون آورده‌اند.
    صدای آب جای هیاهوی خودروها را می‌گیرد. در بهار، آبشار پرخروش است و در دو رشته فرو می‌ریزد؛ در اوج
    تابستان تا حد پرده‌ای نازک باریک می‌شود، و در زمستانی سخت ممکن است یخ بزند. دره در ۲۰۱۲ پاک‌سازی و
    آراسته شد، و پس از تاریکی با نورهای رنگی روشن می‌شود؛ برای بعضی جادویی است و برای بعضی کمی نمایشی.


    روایت‌ها زادگاه تفلیس را در چند قدمی همین‌جا می‌دانند. به افسانه، شاه واختانگ گورگاسالی به شکار رفته
    بود که شاهینش و قرقاولی در چشمه‌ای داغ افتادند و از داغی آب جان باختند؛ شاه فرمان داد گرداگرد آن آب
    گرم شهری بسازند، و *تبیلی* در گرجی به معنای «گرم» است.


    از پای آبشار سر بلند کنید تا تمام داستان تفلیس را در یک قاب ببینید: صخره، آب گرم، و خانه‌هایی که تا
    جایی که صاحبانشان جرئت کرده‌اند به لبه نزدیک ساخته شده‌اند.
  tip: >-
    رایگان است و معمولاً در هر ساعتی باز؛ در ۲۰۲۵ در دره کارهای ساختمانی انجام می‌شد، پس اگر فقط برای
    آن می‌آیید، باز بودن مسیر را از پیش بپرسید. نرم‌ترین نور و خلوت‌ترین مسیر پیش از ساعت ده صبح است؛
    از غروب به بعد نورپردازی رنگی میدان‌دار می‌شود. پیاده‌روی کوتاه و تقریباً هموار است، اما سنگ‌های کنار
    آب پس از باران لغزنده می‌شوند، پس کفشی با زیرهٔ ضدلغزش بپوشید. آخر هفته‌های تابستان دره تا ظهر پر
    می‌شود و نیمکت‌های نزدیک آبشار کم‌اند. سرویس بهداشتی، قهوه و یک حمام آب گرم پس از گردش همه در دو دقیقه‌ای،
    در آبانوتوبانی، در دسترس‌اند. برای پرآب‌ترین آبشار در آوریل یا مه بیایید؛ تا اواخر اوت ممکن است به
    رشته‌ای باریک بدل شود.
  route: >-
    دره تنها برای پیاده‌هاست، پس رانندگی در آبانوتوبانی تمام می‌شود. از میدان آزادی به خیابان ساحلی کرانهٔ
    راست رود پایین بروید و در جهت جریان آب تا میدان گورگاسالی ادامه دهید: حدود ۲ کیلومتر، ده دقیقه در
    ترافیک معمولی. خودرو را در پارکینگ پولی میدان گورگاسالی یا آن سوی پل متخی در میدان اروپا بگذارید (پرداخت
    ساعتی، اپلیکیشن «تفلیس پارکینگ») و پیاده در خیابان آبانو از کنار گنبدهای حمام بروید؛ دره جایی باز
    می‌شود که خیابان تمام می‌شود، و آبشار پنج تا هفت دقیقه پیاده‌روی است. یک خودروی اقتصادی کاملاً کافی
    است. آخر هفته‌ها پارکینگ‌ها تا اواخر صبح پر می‌شوند، پس زود بیایید.
he:
  name: מפל לגווטחווי
  short: 'מפל בלב טביליסי העתיקה: חמש דקות ממרחצאות הגופרית, ערוץ אבן חול שמרפסות ישנות תלויות מעל שפתו.'
  body: >-
    **לכו חמש דקות על פני כיפות הלבנים של מרחצאות הגופרית, והעיר פשוט נעצרת: מולכם צונח מפל במורד מצוק
    של אבן חול.**


    הערוץ נקרא לגווטחווי, «ערוץ התאנים», על שם עצי התאנה שגדלו פעם בצפיפות על מדרונותיו; מקורות כתובים
    מזכירים אותו לראשונה ב-1429. זורם בו הצאווקיסיסצקאלי, נהר קטן שיורד על פני הגן הבוטני ומחליק מתחת
    למרחצאות אל המטקוורי. במשך מאות שנים היה הבקע הזה גבול, שהפריד את קאלה, הרובע העתיק ביותר של טביליסי,
    משאר העיר. היו לו גם שמות אחרים, ובהם צאווקיסיסחווי ודבאחאנה, שמקורות עיון גאורגיים קושרים לבורסקאים
    שעיבדו כאן פעם עורות במים הגופרתיים.


    היום השביל מתפתל בין קירות סלע זקופים, מעל גשרוני הולכי רגל מקושתים ועל פני גרם מדרגות לולייני, ובגובה
    רב מעליכם הבתים הישנים שולחים את מרפסות העץ שלהם אל מעבר לשפת המצוק. קול המים מחליף את רעש התנועה.
    באביב המפל רועם ויורד בשני זרמים; בשיא הקיץ הוא מידלדל לכדי צעיף דק, ובחורף קשה הוא עלול לקפוא. הערוץ
    נוקה ועוצב מחדש ב-2012, ואחרי רדת החשכה הוא מואר באורות צבעוניים – קסום בעיני אחדים, מעט תיאטרלי בעיני
    אחרים.


    המסורת ממקמת את הולדתה של טביליסי במרחק זריקת אבן מכאן. לפי האגדה, המלך וחטנג גורגסאלי יצא לצוד, והבז
    שלו ופסיון נפלו למעיין חם ונכוו למוות; המלך ציווה לבנות עיר סביב המים החמים, ו*טבילי* פירושו בגאורגית
    חם.


    הרימו את העיניים מרגלי המפל ותראו בפריים אחד את כל הסיפור של טביליסי: סלע, מים חמים, ובתים שנבנו קרוב
    לשפה ככל שבעליהם העזו.
  tip: >-
    חינם ובדרך כלל פתוח בכל שעה; ב-2025 נערכו בערוץ עבודות בנייה, לכן אם אתם באים במיוחד, בדקו מראש שהשביל
    פתוח. האור הרך ביותר והשביל הריק ביותר – לפני עשר בבוקר; משעת הדמדומים משתלטת התאורה הצבעונית. ההליכה
    קצרה וכמעט מישורית, אבל האבנים ליד המים חלקלקות אחרי גשם, לכן נעלו נעליים עם אחיזה טובה. בסופי שבוע
    בקיץ הערוץ מתמלא עד הצהריים, והספסלים ליד המפל מעטים. שירותים, קפה וטבילה במרחצאות אחרי ההליכה – כולם
    במרחק שתי דקות, באבנותובני. באו באפריל או במאי לזרימה המלאה ביותר; עד סוף אוגוסט המפל עלול להצטמק
    לחוט דק.
  route: >-
    הערוץ מיועד להולכי רגל בלבד, ולכן הנסיעה מסתיימת באבנותובני. מכיכר החירות רדו אל הטיילת של הגדה הימנית
    ונסעו לאורכה במורד הזרם עד כיכר גורגסאלי: כ-2 ק"מ, עשר דקות בתנועה רגילה. חנו בחניון בתשלום בכיכר
    גורגסאלי או מעבר לגשר מטחי, בכיכר אירופה (תשלום לפי שעה, אפליקציית "טביליסי פארקינג"), והמשיכו ברגל
    ברחוב אבאנו על פני כיפות המרחצאות; הערוץ נפתח במקום שבו הרחוב מסתיים, והמפל במרחק חמש עד שבע דקות
    הליכה. רכב אקונומי מספיק לגמרי. בסופי שבוע החניונים מתמלאים עד שעות הבוקר המאוחרות, לכן הגיעו מוקדם.
ar:
  name: شلال ليغفتاخيفي
  short: >-
    شلال في قلب تبليسي القديمة: على بعد خمس دقائق من الحمّامات الكبريتية، وادٍ من الحجر الرملي تتدلّى
    فوق حافته شرفات عتيقة.
  body: >-
    **امشوا خمس دقائق متجاوزين القباب الآجرية للحمّامات الكبريتية، فتنتهي المدينة فجأة: أمامكم شلال ينحدر
    على جرف من الحجر الرملي.**


    يُسمّى الوادي ليغفتاخيفي، أي «وادي التين»، نسبة إلى أشجار التين التي كانت تزدحم يوماً على منحدراته؛
    وأول ذكر له في المصادر المكتوبة يعود إلى عام 1429. يجري فيه نهر صغير هو تسافكيسيستسكالي، ينزل مارّاً
    بالحديقة النباتية ثم ينساب تحت الحمّامات إلى نهر متكفاري. وطوال قرون كان هذا الشقّ حدّاً يفصل كالا،
    أقدم أحياء تبليسي، عن سائر المدينة. وقد عُرف بأسماء أخرى، منها تسافكيسيسخيفي ودباخانة، وهو اسم تردّه
    المراجع الجورجية إلى الدبّاغين الذين كانوا يدبغون الجلود هنا في الماء الكبريتي.


    اليوم يتلوّى الممر بين جدران صخرية عمودية، فوق جسور مقوّسة للمشاة ومروراً بدرج حلزوني، بينما تمدّ
    البيوت القديمة في الأعلى شرفاتها الخشبية فوق الحافة. يحلّ صوت الماء محلّ ضجيج السيارات. في الربيع
    يهدر الشلال وينحدر في مجريين، وفي ذروة الصيف يرقّ حتى يصير كالغلالة، وفي الشتاء القاسي قد يتجمّد.
    نُظّف الوادي وأُعيد تنسيقه عام 2012، وبعد حلول الظلام يُضاء بأنوار ملوّنة، ساحرة في عين بعضهم ومسرحية
    قليلاً في عين آخرين.


    تضع الرواية ميلاد تبليسي على مرمى حجر من هذا الموضع. تقول الأسطورة إن الملك فاختانغ غورغاسالي كان
    في رحلة صيد حين سقط صقره وطائرُ تَدرُج في نبع حار فماتا من شدة سخونته؛ فأمر الملك ببناء مدينة حول
    الماء الدافئ، و*تبيلي* تعني بالجورجية «دافئ».


    ارفعوا أعينكم من أسفل الشلال لتروا حكاية تبليسي كلها في إطار واحد: صخر، وماء ساخن، وبيوت بُنيت على
    أقرب مسافة من الحافة جرؤ عليها أصحابها.
  tip: >-
    الدخول مجاني والمكان مفتوح عادةً في كل ساعة؛ وقد شهد الوادي أعمال بناء عام 2025، فإن كنتم قادمين خصيصاً
    فتحقّقوا مسبقاً من أن الممر مفتوح. أنعم ضوء وأخلى ممر قبل العاشرة صباحاً؛ ومع الغسق تتولى الإضاءة
    الملوّنة المشهد. المشي قصير ومستوٍ تقريباً، لكن الحجارة قرب الماء تصبح زلقة بعد المطر، فانتعلوا أحذية
    بنعال مانعة للانزلاق. في عطلات نهاية الأسبوع صيفاً يمتلئ الوادي بحلول الظهيرة، والمقاعد قرب الشلال
    قليلة. دورات المياه والقهوة وحمّام دافئ بعد النزهة كلها على بعد دقيقتين في أبانوتوباني. تعالوا في
    أبريل أو مايو لأغزر تدفق؛ ففي أواخر أغسطس قد يضمر الشلال حتى يصير خيطاً.
  route: >-
    الوادي للمشاة فقط، لذا تنتهي القيادة في أبانوتوباني. من ساحة الحرية انزلوا إلى كورنيش الضفة اليمنى
    واتبعوه مع مجرى النهر حتى ساحة غورغاسالي: نحو 2 كم، عشر دقائق في حركة السير العادية. اركنوا في الموقف
    المدفوع في ساحة غورغاسالي أو عبر جسر ميتيخي في ساحة أوروبا (أجرة بالساعة، تطبيق «تبليسي باركينغ»)،
    ثم امشوا في شارع أبانو مروراً بقباب الحمّامات؛ ينفتح الوادي حيث ينتهي الشارع، والشلال على بعد خمس
    إلى سبع دقائق سيراً. تكفي سيارة اقتصادية. في عطلات نهاية الأسبوع تمتلئ المواقف بحلول أواخر الصباح،
    فتعالوا باكراً.
