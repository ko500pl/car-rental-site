ka:
  name: ლეღვთახევის ჩანჩქერი
  short: >-
    22-მეტრიანი ჩანჩქერი გოგირდის აბანოების უკან — ხეობა შუა ქალაქში, რომლის არსებობასაც ბევრი ტურისტი
    ვერც ხვდება.
  body: >-
    **შუა თბილისში ნამდვილი ჩანჩქერი მოედინება** — აბანოთუბნის გოგირდის აბანოების უკან ხუთწუთიანი გასეირნება
    და ხარ 22-მეტრიან ჩანჩქერთან, კლდეებით შემოფარგლულ ხეობაში, სადაც ქალაქის ხმაური თითქმის აღარ ისმის.


    ხეობას ლეღვთახევი ჰქვია — სახელი ლეღვის ხეებიდან მოდის, რომლებიც აქ ოდესღაც ხშირად ხარობდა. წყალი
    წავკისისწყალია, პატარა მდინარე, რომელიც ბოტანიკური ბაღის მხრიდან ჩამოდის და აბანოების ქვეშ მტკვარს
    ერთვის. ხეობა წერილობით წყაროებში პირველად 1429 წელს იხსენიება; საუკუნეების განმავლობაში აქ დაბახანა
    — ტყავის დამუშავების უბანი — მდებარეობდა. 2012 წელს ხეობა მოეწყო: გაიწმინდა ბილიკები, აღდგა აივნიანი
    სახლები, გაჩნდა ხიდები და კიბეები.


    რას ნახავ:


    - 22-მეტრიანი ჩანჩქერი კლდის კედელზე

    - სამასიოდე მეტრი ხის ბილიკი ხეობის ძირში

    - გადმოკიდებული აივნები კლდის პირზე — ძველი თბილისის სავიზიტო ბარათი


    გაზაფხულზე ჩანჩქერი მძლავრობს, ზაფხულში მშვიდდება, ზამთარში კი ზოგჯერ იყინება. საღამოს ხეობა ფერადი
    განათებით ინთება და გასეირნება სულ სხვა განცდად იქცევა — აბანოების გუმბათები, კლდე და წყლის ხმა ერთ
    კადრში ერთიანდება.
  tip: >-
    შესვლა უფასოა და ხეობა მუდამ ღიაა. ყველაზე ლამაზი შუქი დილითაა, საღამოს კი განათება ირთვება — ორივე
    ღირს. ბილიკი მოსწორებულია და საბავშვო ეტლითაც გაივლება, თუმცა წვიმის შემდეგ ქვები სრიალებს. ჩანჩქერთან
    ჩამოჯდომის ადგილები ცოტაა და შუადღისას ხალხმრავლობაა. ტუალეტი და კაფეები აბანოთუბანშია, ორ ნაბიჯში.
    ზაფხულის პიკზე წყალი თხელდება — ფოტოზე ნაკლებად ეფექტურია.
  route: >-
    მანქანით ხეობაში ვერ შეხვალ — ის მთლიანად საფეხმავლოა. მიდი აბანოთუბნამდე: ცენტრიდან გორგასლის მოედნისკენ
    2 კმ-ია, ათიოდე წუთი. მანქანა გააჩერე ევროპის მოედნის ან გორგასლის მოედნის ფასიან პარკინგზე (საათობრივი
    გადასახადი, Tbilisi Parking-ის აპი), შემდეგ აბანოს ქუჩის ბოლოდან ხეობაში შეუხვიე — ჩანჩქერამდე ხუთი-შვიდი
    წუთია ფეხით. ეკონომ-კლასის მანქანა სავსებით საკმარისია; შაბათ-კვირას პარკინგის პოვნა უფრო რთულია,
    ამიტომ დილით ადრე მოდი.
en:
  name: Leghvtakhevi Waterfall
  short: >-
    A 22-metre waterfall hidden behind the sulphur baths — a canyon in the middle of the city that many
    tourists never suspect.
  body: >-
    **A real waterfall pours in the middle of Tbilisi** — five minutes' walk behind the Abanotubani sulphur
    baths and you stand before a 22-metre cascade in a cliff-walled gorge where the city noise all but
    disappears.


    The gorge is called Leghvtakhevi — "fig gorge", after the fig trees that once grew thickly here. The
    water is the Tsavkisistskali, a small stream that descends from the Botanical Garden side and joins
    the Mtkvari beneath the baths. The gorge is first mentioned in written sources in 1429; for centuries
    this was Dabakhana, the tanners' district. In 2012 the area was landscaped: paths were cleared, balconied
    houses restored, bridges and stairways added.


    What you'll see:


    - The 22-metre fall down a rock wall

    - Some three hundred metres of boardwalk along the gorge floor

    - Balconies overhanging the cliff edge — Old Tbilisi's calling card


    In spring the waterfall roars, in summer it calms down, and in winter it occasionally freezes solid.
    After dark the gorge lights up in colour, which turns the walk into a different experience entirely.
  tip: >-
    Entry is free and the gorge never closes. The prettiest light is in the morning; in the evening the
    illumination comes on — both are worth it. The path is level and even stroller-friendly, though the
    stones get slippery after rain. Seating near the fall is scarce and midday gets crowded. Toilets and
    cafés are two steps away in Abanotubani. At the height of summer the flow thins out and photographs
    less dramatically.
  route: >-
    You can't drive into the gorge — it is entirely pedestrian. Head for Abanotubani: from the centre
    towards Gorgasali Square it's 2 km, about ten minutes. Park at the paid lots by Europe Square or Gorgasali
    Square (hourly rates, Tbilisi Parking app), then turn into the gorge from the end of Abano Street
    — the waterfall is five to seven minutes on foot. An economy car is entirely sufficient; on weekends
    parking is harder to find, so come early in the morning.
ru:
  name: Водопад Легвтахеви
  short: >-
    22-метровый водопад за серными банями — каньон посреди города, о существовании которого многие туристы
    не догадываются.
  body: >-
    **Посреди Тбилиси льётся настоящий водопад** — пять минут пешком за серными банями Абанотубани, и
    вы стоите перед 22-метровым каскадом в ущелье со скальными стенами, где городской шум почти исчезает.


    Ущелье называется Легвтахеви — «инжирное ущелье», по фиговым деревьям, которые когда-то густо здесь
    росли. Вода — это Цавкисисцкали, небольшая речка, спускающаяся со стороны Ботанического сада и впадающая
    в Куру под банями. Впервые ущелье упоминается в письменных источниках в 1429 году; веками здесь находилась
    Дабахана — квартал кожевников. В 2012 году территорию благоустроили: расчистили дорожки, восстановили
    дома с балконами, добавили мостики и лестницы.


    Что вы увидите:


    - 22-метровый водопад по скальной стене

    - Около трёхсот метров деревянного настила по дну ущелья

    - Балконы, нависающие над обрывом, — визитная карточка Старого Тбилиси


    Весной водопад грохочет, летом успокаивается, зимой изредка замерзает целиком. После наступления темноты
    ущелье подсвечивается цветными огнями — совсем другое впечатление.
  tip: >-
    Вход бесплатный, ущелье не закрывается никогда. Самый красивый свет утром; вечером включается подсветка
    — стоит увидеть и то и другое. Дорожка ровная, пройдёт даже коляска, но после дождя камни скользкие.
    Скамеек у водопада мало, в полдень многолюдно. Туалеты и кафе — в двух шагах, в Абанотубани. В разгар
    лета поток мелеет и на фото выглядит скромнее.
  route: >-
    Заехать в ущелье на машине нельзя — оно целиком пешеходное. Держите путь на Абанотубани: от центра
    к площади Горгасали 2 км, около десяти минут. Машину оставьте на платных парковках у площади Европы
    или площади Горгасали (почасовая оплата, приложение Tbilisi Parking), затем сверните в ущелье с конца
    улицы Абано — до водопада пять-семь минут пешком. Машины эконом-класса вполне достаточно; в выходные
    с парковкой сложнее, приезжайте пораньше утром.
fa:
  name: آبشار لغوتاخوی
  short: آبشاری ۲۲ متری پنهان پشت حمام‌های گوگردی — دره‌ای در دل شهر که بسیاری از گردشگران از وجودش بی‌خبرند.
  body: >-
    **در دل تفلیس آبشاری واقعی جاری است** — پنج دقیقه پیاده‌روی پشت حمام‌های گوگردی آبانوتوبانی، و روبه‌روی
    آبشاری ۲۲ متری در دره‌ای با دیواره‌های صخره‌ای ایستاده‌اید که همهمهٔ شهر در آن تقریباً محو می‌شود.


    نام دره لغوتاخوی است — «درهٔ انجیر»، از درختان انجیری که روزگاری اینجا انبوه می‌روییدند. آبِ آن نهر
    تساوکیسیس‌تسکالی است که از سمت باغ گیاه‌شناسی پایین می‌آید و زیر حمام‌ها به رود متکواری می‌پیوندد.
    دره نخستین بار در ۱۴۲۹ در منابع مکتوب آمده است؛ قرن‌ها اینجا «داباخانه» — محلهٔ دباغان — بود. در ۲۰۱۲
    محوطه ساماندهی شد: راه‌ها پاک، خانه‌های بالکن‌دار مرمت و پل‌ها و پلکان‌ها افزوده شدند.


    آنچه خواهید دید:


    - آبشار ۲۲ متری بر دیوارهٔ سنگی

    - حدود سیصد متر گذرگاه چوبی در کف دره

    - بالکن‌های آویخته بر لبهٔ پرتگاه — نشان شناختهٔ تفلیس قدیم


    در بهار آبشار می‌غرد، در تابستان آرام می‌گیرد و در زمستان گاه یکسره یخ می‌بندد. پس از تاریکی، دره
    با نورهای رنگی روشن می‌شود و گشت‌وگذار حال‌وهوایی دیگر می‌یابد.
  tip: >-
    ورود رایگان است و دره هیچ‌گاه بسته نمی‌شود. زیباترین نور صبح است؛ شب‌ها هم نورپردازی روشن می‌شود —
    هر دو می‌ارزد. مسیر هموار است و حتی با کالسکه می‌توان رفت، اما پس از باران سنگ‌ها لیز می‌شوند. نیمکت
    نزدیک آبشار کم است و ظهرها شلوغ می‌شود. سرویس بهداشتی و کافه‌ها دو قدم آن‌طرف‌تر در آبانوتوبانی‌اند.
    در اوج تابستان آب کم می‌شود و در عکس چشمگیری کمتری دارد.
  route: >-
    با خودرو نمی‌توان وارد دره شد — سراسر آن پیاده‌راه است. به سمت آبانوتوبانی بروید: از مرکز تا میدان
    گورگاسالی ۲ کیلومتر است، حدود ده دقیقه. خودرو را در پارکینگ‌های پولی میدان اروپا یا میدان گورگاسالی
    بگذارید (پرداخت ساعتی، اپلیکیشن Tbilisi Parking)، سپس از انتهای خیابان آبانو وارد دره شوید — تا آبشار
    پنج تا هفت دقیقه پیاده است. خودروی اقتصادی کاملاً کافی است؛ آخر هفته‌ها جای پارک سخت‌تر پیدا می‌شود،
    پس صبح زود بیایید.
he:
  name: מפל לגווטחווי
  short: מפל בגובה 22 מטר חבוי מאחורי מרחצאות הגופרית — קניון בלב העיר שתיירים רבים כלל אינם מודעים לקיומו.
  body: >-
    **בלב טביליסי ניתך מפל אמיתי** — חמש דקות הליכה מאחורי מרחצאות הגופרית של אבנותובני, ואתם עומדים מול
    אשד בגובה 22 מטר בערוץ מוקף קירות סלע, שבו רעש העיר כמעט נעלם.


    הערוץ נקרא לגווטחווי — «ערוץ התאנים», על שם עצי התאנה שצמחו כאן בשפע. המים הם נחל צאווקיסיצקאלי, פלג
    קטן היורד מכיוון הגן הבוטני ונשפך למטקווארי מתחת למרחצאות. הערוץ נזכר לראשונה במקורות כתובים ב-1429;
    במשך מאות שנים שכן כאן רובע הבורסקאים, דבחאנה. ב-2012 טופח האזור: השבילים פונו, בתים עם מרפסות שוחזרו,
    ונוספו גשרונים וגרמי מדרגות.


    מה תראו:


    - המפל בן 22 המטרים על קיר הסלע

    - כשלוש מאות מטרים של טיילת עץ לאורך קרקעית הערוץ

    - מרפסות תלויות על שפת המצוק — כרטיס הביקור של טביליסי העתיקה


    באביב המפל רועם, בקיץ הוא נרגע, ובחורף הוא קופא לעיתים כליל. אחרי רדת החשכה הערוץ מואר באורות צבעוניים,
    וההליכה הופכת לחוויה אחרת לגמרי.
  tip: >-
    הכניסה חינם והערוץ לעולם אינו נסגר. האור היפה ביותר בבוקר; בערב נדלקת התאורה — שניהם שווים ביקור.
    השביל ישר ומתאים אפילו לעגלת תינוק, אך אחרי גשם האבנים חלקלקות. מקומות ישיבה ליד המפל מעטים ובצהריים
    צפוף. שירותים ובתי קפה במרחק שני צעדים, באבנותובני. בשיא הקיץ הזרם נחלש ומצטלם פחות דרמטי.
  route: >-
    אי אפשר להיכנס לערוץ ברכב — הוא כולו להולכי רגל. סעו לכיוון אבנותובני: מהמרכז לכיכר גורגסאלי 2 ק״מ,
    כעשר דקות. חנו בחניונים בתשלום ליד כיכר אירופה או כיכר גורגסאלי (תשלום שעתי, אפליקציית Tbilisi Parking),
    ואז פנו אל הערוץ מקצה רחוב אבנו — המפל במרחק חמש עד שבע דקות הליכה. רכב חסכוני מספיק לגמרי; בסופי
    שבוע קשה יותר למצוא חניה, אז בואו מוקדם בבוקר.
ar:
  name: شلال ليغفتاخيفي
  short: شلال بارتفاع 22 متراً مختبئ خلف الحمامات الكبريتية — وادٍ في قلب المدينة لا يخطر ببال كثير من
    السياح.
  body: >-
    **في قلب تبليسي ينهمر شلال حقيقي** — خمس دقائق سيراً خلف حمامات أبانوتوباني الكبريتية وتقف أمام مسقط
    ماء بارتفاع 22 متراً في وادٍ محاط بجدران صخرية يكاد ضجيج المدينة يختفي فيه.


    يسمى الوادي ليغفتاخيفي — «وادي التين»، نسبة إلى أشجار التين التي كانت تنمو هنا بكثافة. والماء هو جدول
    تسافكيسيس-تسكالي، نهيرٌ صغير ينحدر من جهة الحديقة النباتية ويصب في نهر متكفاري تحت الحمامات. ذُكر
    الوادي أول مرة في المصادر المكتوبة عام 1429؛ وعلى مدى قرون كان هنا حي الدباغين «داباخانه». وفي 2012
    هُيّئت المنطقة: نُظفت الممرات ورُممت البيوت ذات الشرفات وأضيفت جسور وسلالم.


    ما ستراه:


    - الشلال المنحدر 22 متراً على الجدار الصخري

    - نحو ثلاثمئة متر من الممر الخشبي في قاع الوادي

    - شرفات معلقة على حافة الجرف — بطاقة تعريف تبليسي القديمة


    في الربيع يهدر الشلال، وفي الصيف يهدأ، وفي الشتاء يتجمد أحياناً بأكمله. وبعد حلول الظلام يضاء الوادي
    بأنوار ملونة فتغدو الجولة تجربة مختلفة تماماً.
  tip: >-
    الدخول مجاني والوادي لا يغلق أبداً. أجمل ضوء في الصباح، وفي المساء تُضاء الأنوار — وكلاهما يستحق.
    الممر مستوٍ ويصلح حتى لعربة الأطفال، لكن الحجارة تنزلق بعد المطر. أماكن الجلوس قرب الشلال قليلة والظهيرة
    مزدحمة. دورات المياه والمقاهي على بعد خطوتين في أبانوتوباني. وفي ذروة الصيف يضعف التدفق ويبدو في الصور
    أقل إبهاراً.
  route: >-
    لا يمكن دخول الوادي بالسيارة — فهو للمشاة بالكامل. اقصد أبانوتوباني: من المركز إلى ساحة غورغاسالي
    كيلومتران، نحو عشر دقائق. اركن في المواقف المدفوعة قرب ساحة أوروبا أو ساحة غورغاسالي (تعرفة بالساعة،
    تطبيق Tbilisi Parking)، ثم ادخل الوادي من نهاية شارع أبانو — الشلال على بعد خمس إلى سبع دقائق سيراً.
    سيارة اقتصادية تكفي تماماً؛ وفي عطلات نهاية الأسبوع يصعب إيجاد موقف، فتعال باكراً صباحاً.
