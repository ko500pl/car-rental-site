ka:
  name: ატენის ციხე
  short: >-
    X–XI საუკუნეების ციხე ატენის ხეობის კლდეზე: იერიშით ვერავინ აიღო — 1554 წელს მხოლოდ მაშინ დაეცა, როცა
    ტყვედ ჩავარდნილმა ფარეშმა მისი წყალი გასცა.
  body: >-
    **ატენის ციხე იერიშით არავის აუღია. როცა 1554 წელს ბოლოს და ბოლოს დაეცა, ის წყურვილმა და ტყვედ ჩავარდნილი
    მსახურის გამხელილმა საიდუმლომ დაამარცხა.**


    ციხე, რომელსაც საცივისა და ორბელიანის ციხესაც უწოდებენ, X–XI საუკუნეებით თარიღდება და ატენის ხეობაში,
    მაღალ, ძნელად მისადგომ კლდეზე დგას: ერთ მხარეს საცივისხევი ჩამოუდის, მეორეზე — აბანოსხევი. ნატეხი
    ქვით ნაგები ციხე ორი ნაწილისგან შედგება — პატარა ჩრდილოეთისგან, სადაც შესასვლელია, და მთავარი, სამხრეთისგან.
    მშენებლებმა კარგად იცოდნენ, რას ნიშნავს ალყა: ქვედა ნაწილში მოზრდილი წყალსაცავები მოაწყვეს, რომლებშიც
    წყალი ჩრდილო-დასავლეთის ხევიდან თიხის მილებით ჩამოდიოდა.


    X საუკუნეში ციხე კლდეკარის ერისთავებს ეკუთვნოდა: რატი ერისთავთერისთავი დიდხანს ეურჩებოდა ქვეყნის გამაერთიანებელ
    ბაგრატ III-ს, სანამ ციხის დათმობა არ მოუწია. XI საუკუნის შუა ხანებში ლიპარიტ კლდეკარელმა ბიზანტიელთა
    და კახელთა შემწეობით სცადა მისი აღება, მაგრამ კედლებმა გაუძლო, მეციხოვნეებმა კი არ უღალატეს. XVI საუკუნის
    დასაწყისში მამისმკვლელმა ავ-გიორგიმ, კახეთის მეფემ, ქართლის მეფე დავით X-ს აქ რამდენიმე დღე ალყა შემოარტყა,
    ბოლოს კი მხოლოდ ნადავლით გაბრუნდა შინ.


    1554 წელს შაჰ-თამაზის მეოთხე ლაშქრობისას ყიზილბაშები ატენს მოადგნენ, სადაც ლუარსაბ I-ის დედა აფარებდა
    თავს. კედლებს ვერც ხვრელს უკეთებდნენ, ვერც სანგრევ მანქანებს უახლოებდნენ. მაშინ მეფის დედის ფარეში,
    კავთისხეველი ბეთიაშვილი შეიპყრეს და უვნებლობის ფიცით ალაპარაკეს. ბერი ეგნატაშვილის სიტყვით, მან გასცა:
    „ჭის წყალი დალევიათო და ჩრდილოეთისკენ მომცრო წყალი ჩამოუდისო“. მტერმა წყარო ჩაიგდო, წყურვილით დაუძლურებულმა
    მეციხოვნეებმა კი ციხე დათმეს.


    ბოლო დარტყმა ქართველმა მეფემ მიაყენა: 1642 წელს როსტომი აჯანყებულ ნოდარ ციციშვილს დაედევნა, რომელიც
    ციხეში ჩაიკეტა და შემდეგ საათაბაგოში გაიქცა. როსტომმა ციხე აიღო და დაანგრია, 1920 წლის მიწისძვრამ
    კი კიდევ უფრო დააზიანა. ქვედა კედლებთან, სადაც ოდესღაც წყალსაცავები იყო, დადექით: ეს ციხე წყლის შესანახად
    აგებული მანქანა იყო და მხოლოდ მაშინ დამარცხდა, როცა ვიღაცამ ეს წყალი გასცა.
  tip: >-
    შესვლა უფასოა; ეს ღია ნანგრევია, სალარო და დარაჯი აქ არ დაგხვდებათ. მონიშნული ბილიკი მსუბუქია, მაგრამ
    წვიმის შემდეგ სრიალებს — კარგი ძირის ფეხსაცმელი ჩაიცვით. დანგრეულ კედლებზე ნუ აძვრებით: კლდე ციხის
    ქვეშ ციცაბოდ წყდება. ბილიკიანად ერთიდან სამ საათამდე გაითვალისწინეთ. ციხე 1,3 კილომეტრში მდებარე ატენის
    სიონსა და ხეობის მარნებთან ერთად მოინახულეთ. წყალი და ტუალეტი ადგილზე არ არის — წყალი თან წაიღეთ,
    კაფეები გორშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 80 კილომეტრი გაიარეთ და გორის გასასვლელზე
    გადაუხვიეთ. ქალაქი გადაკვეთეთ და ხიდისთავი–ატენის გზას (შ137) გაჰყევით სამხრეთით, ტანას ხეობის აღმა.
    ციხე დიდი ატენის ახლოს, ატენის სიონამდე ცოტა ადრე, გზის ზემოთ, კლდეზე დგას. სულ დაახლოებით 96 კილომეტრი
    და საათნახევარი. ხეობის გზა ასფალტიანია, მაგრამ ვიწრო, ორმოებითა და ცალზოლიანი ხიდებით. ეკონომკლასის
    მანქანა სავსებით საკმარისია. საწვავი გორში ჩაასხით — ხეობაში ბენზინგასამართი სადგური არ არის. მანქანა
    გზისპირას დატოვეთ და ციხემდე მონიშნული ბილიკით ფეხით ადით.
en:
  name: Ateni Fortress
  short: >-
    A cliff-top castle in the Ateni gorge that no army could storm: in 1554 it fell only when a captured
    servant gave away its water.
  body: >-
    **No army ever took Ateni Fortress by storm. When it finally fell, in 1554, it was to thirst and a
    captured servant's secret.**


    Also called Satsivi or Orbeliani Fortress, the castle dates from the 10th–11th century and stands
    on a high cliff in the Ateni gorge, between the Satsivkhevi and Abanoskhevi ravines. Built of rubble
    stone, it has a smaller northern section with the entrance and a main block to the south. Its builders
    understood sieges: in the lower part they made large reservoirs, fed by clay pipes from a ravine to
    the north-west.


    In the 10th century it belonged to the dukes of Kldekari, and Duke Rati held out against Bagrat III,
    the king who united Georgia, before surrendering it. In the mid-11th century Liparit of Kldekari,
    backed by Byzantium and Kakheti, failed: the garrison stayed loyal. Early in the 16th century Av-Giorgi
    of Kakheti, who had murdered his own father, besieged David X of Kartli here for days and left with
    only plunder.


    In 1554 came Shah Tahmasp's fourth campaign. The Qizilbash reached Ateni, where King Luarsab I's mother
    had taken refuge, but could neither breach the walls nor bring up siege engines. They seized the queen
    mother's attendant, Bethiashvili of Kavtiskhevi, swore to spare him and made him talk. The well, he
    told them, had been drunk dry, and a small stream ran down on the north side. They cut it off, and
    thirst did the rest.


    The last blow came from a Georgian king: in 1642 Rostom of Kartli, hunting the rebel Nodar Tsitsishvili,
    took the fortress and wrecked it, and the earthquake of 1920 did further damage. Stand by the lower
    walls where the reservoirs were. This was a machine for keeping water, and it failed only when someone
    gave the water away.
  tip: >-
    Entry is free: this is an open ruin, with no ticket office. The signed path up is easy but turns slippery
    after rain, so wear shoes with grip. Stay off the tops of the broken walls, because the cliff falls
    away steeply below. Allow one to three hours, including the walk. Pair it with Ateni Sioni Church,
    1.3 km away, and the gorge's wine cellars. There is no water or toilet at the site; carry a bottle
    and use the cafés in Gori.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi for about 80 km and leave at the Gori exit. Cross the
    town and pick up the Khidistavi–Ateni road (Sh137) south up the Tana valley. The fortress stands on
    a cliff above the road near Didi Ateni, a little before Ateni Sioni: about 96 km and an hour and a
    half in all. The gorge road is asphalt but narrow, with potholes and single-lane bridges. An economy
    car is perfectly adequate. Fill up in Gori, as there is no fuel station in the gorge. Park by the
    road and walk up the signed path.
ru:
  name: Атенская крепость
  short: >-
    Замок на скале в Атенском ущелье, который не взяла штурмом ни одна армия: в 1554 году он пал, лишь
    когда пленный слуга выдал тайну его воды.
  body: >-
    **Ни одной армии не удалось взять Атенскую крепость штурмом. Когда в 1554 году она всё же пала, её
    погубили жажда и тайна, выданная пленным слугой.**


    Крепость, которую называют также Сациви или крепостью Орбелиани, построена в X–XI веках и стоит на
    высокой скале в Атенском ущелье, между балками Сацивхеви и Абаносхеви. Сложена она из бутового камня:
    меньшая северная часть со входом и главный корпус на юге. Строители хорошо понимали, что такое осада:
    в нижней части они устроили большие водохранилища, куда вода шла по глиняным трубам из оврага на северо-западе.


    В X веке крепость принадлежала клдекарским эриставам, и эристав Рати противостоял здесь Баграту III,
    царю-объединителю Грузии, прежде чем сдал её. В середине XI века Липарит Клдекарский, опираясь на
    Византию и Кахети, пытался её взять — и не смог: гарнизон остался верен. В начале XVI века кахетинский
    царь Ав-Гиорги, убийца собственного отца, несколько дней осаждал здесь картлийского царя Давида X
    и ушёл лишь с добычей.


    В 1554 году начался четвёртый поход шаха Тахмаспа. Кызылбаши дошли до Атени, где укрылась мать царя
    Луарсаба I, но не смогли ни пробить стены, ни подвести осадные машины. Тогда они схватили слугу царицы-матери,
    Бетиашвили из Кавтисхеви, поклялись сохранить ему жизнь и заставили говорить. Колодец, сказал он,
    выпит до дна, а с северной стороны сбегает небольшой ручей. Ручей перекрыли, остальное довершила жажда.


    Последний удар нанёс грузинский царь: в 1642 году Ростом Картлийский, преследуя мятежного Нодара Цицишвили,
    взял крепость и разорил её, а землетрясение 1920 года добавило разрушений. Постойте у нижних стен,
    там, где были водохранилища. Эта крепость была машиной для хранения воды — и отказала лишь тогда,
    когда кто-то выдал эту воду.
  tip: >-
    Вход свободный: это открытые руины без кассы. Тропа наверх отмечена указателями и несложна, но после
    дождя становится скользкой, так что нужна обувь с цепкой подошвой. На гребни разрушенных стен не забирайтесь:
    под ними скала круто обрывается вниз. Закладывайте от часа до трёх вместе с подъёмом. Крепость хорошо
    сочетается с Атенским Сиони в 1,3 км и винными погребами ущелья. Воды и туалета на месте нет: возьмите
    бутылку с собой, а кафе ищите в Гори.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад около 80 км до съезда на Гори. Проезжайте через город
    и выезжайте на дорогу Хидистави — Атени (Sh137), которая ведёт на юг вверх по долине Таны. Крепость
    стоит на скале над дорогой у Диди-Атени, немного не доезжая Атенского Сиони: всего около 96 км и полтора
    часа пути. Дорога по ущелью асфальтирована, но узкая, с выбоинами и однополосными мостами. Машины
    эконом-класса вполне достаточно. Заправьтесь в Гори: в ущелье заправок нет. Оставьте машину у дороги
    и поднимайтесь по размеченной тропе.
fa:
  name: دژ آتنی
  short: >-
    دژی بر فراز صخره در درهٔ آتنی که هیچ لشکری نتوانست با یورش بگشاید: در سال ۱۵۵۴ تنها زمانی فرو افتاد
    که خدمتکاری اسیر راز آبش را فاش کرد.
  body: >-
    **هیچ لشکری دژ آتنی را با یورش نگشود. وقتی سرانجام در سال ۱۵۵۴ فرو افتاد، کار را تشنگی و رازی کرد
    که خدمتکاری اسیر فاش ساخت.**


    این دژ را ساتسیوی یا دژ اوربلیانی هم می‌نامند. در سده‌های دهم و یازدهم ساخته شده و بر صخره‌ای بلند
    در درهٔ آتنی، میان آبکندهای ساتسیوخِوی و آبانوسخِوی، ایستاده است. دیوارهایش از لاشه‌سنگ است: بخشی
    کوچک‌تر در شمال که درِ ورودی در آن است، و بدنهٔ اصلی در جنوب. سازندگانش محاصره را خوب می‌شناختند:
    در بخش پایینی آب‌انبارهای بزرگی ساختند که آب را با لوله‌های سفالی از آبکندی در شمال‌غرب به آن‌ها می‌رساندند.


    در سدهٔ دهم دژ از آنِ اریستاوهای (فرمانروایان) کلدکاری بود و اریستاو راتی این‌جا در برابر باگرات سوم،
    شاهی که گرجستان را یکپارچه کرد، ایستادگی کرد و سپس دژ را واگذاشت. در میانهٔ سدهٔ یازدهم لیپاریتِ کلدکاری
    با پشتیبانی بیزانس و کاختی به آن تاخت و ناکام شد، زیرا پادگان از وفاداری دست نکشید. در آغاز سدهٔ شانزدهم
    آو-گیورگیِ کاختی، که پدر خود را کشته بود، چند روز داوید دهم، شاه کارتلی، را این‌جا در محاصره گرفت
    و جز غنیمت چیزی با خود نبرد.


    در سال ۱۵۵۴ چهارمین لشکرکشی شاه طهماسب فرا رسید. قزلباشان به آتنی رسیدند، جایی که مادر شاه لوارساب
    یکم پناه گرفته بود، اما نه توانستند دیوارها را بشکافند و نه ادوات محاصره را به پای آن برسانند. پس
    خدمتکار ملکه‌مادر، بتیاشویلی از کاوتیسخِوی، را گرفتند، سوگند خوردند که جانش را ببخشند و به حرفش آوردند.
    گفت آب چاه تا ته نوشیده شده و در سوی شمال جویبار کوچکی روان است. جوی را بستند و تشنگی باقی کار را
    کرد.


    آخرین ضربه را شاهی گرجی زد: در سال ۱۶۴۲ روستوم، شاه کارتلی، در پی نودار تسیتسیشویلیِ شورشی دژ را گرفت
    و ویران کرد، و زمین‌لرزهٔ ۱۹۲۰ آسیب بیشتری رساند. کنار دیوارهای پایینی، همان‌جا که آب‌انبارها بودند،
    بایستید. این دژ ماشینی برای نگه‌داشتن آب بود و تنها زمانی از کار افتاد که کسی راز آبش را فاش کرد.
  tip: >-
    ورود رایگان است: این‌جا ویرانه‌ای باز است و گیشهٔ بلیتی ندارد. مسیر بالارفتن نشانه‌گذاری شده و آسان
    است، اما پس از باران لغزنده می‌شود؛ پس کفشی با کفِ محکم بپوشید. از بالای دیوارهای فروریخته دور بمانید،
    چون زیرشان صخره با شیبی تند فرو می‌افتد. با پیاده‌روی، یک تا سه ساعت وقت بگذارید. دیدار را با کلیسای
    آتنی سیونی در ۱٫۳ کیلومتری و سرداب‌های شراب دره همراه کنید. در محل نه آب هست و نه سرویس بهداشتی؛ بطری
    آب همراه داشته باشید و برای کافه به گوری بروید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را حدود ۸۰ کیلومتر به سوی غرب بروید و از خروجی گوری بیرون بیایید. از شهر
    بگذرید و جادهٔ خیدیستاوی–آتنی (Sh137) را به سوی جنوب، در امتداد درهٔ تانا، در پیش بگیرید. دژ بر صخره‌ای
    بالای جاده، نزدیک دیدی آتنی و کمی پیش از آتنی سیونی، ایستاده است: روی‌هم حدود ۹۶ کیلومتر و یک ساعت
    و نیم راه. جادهٔ دره آسفالت است اما باریک، با چاله‌ها و پل‌های یک‌خطه. خودروی اقتصادی کاملاً کافی
    است. در گوری باک را پر کنید، چون در دره پمپ‌بنزین نیست. کنار جاده پارک کنید و از مسیر نشانه‌گذاری‌شده
    بالا بروید.
he:
  name: מבצר אטני
  short: 'טירה על צוק בערוץ אטני שאף צבא לא כבש בסערה: ב-1554 נפלה רק כשמשרת שבוי גילה את סוד המים שלה.'
  body: >-
    **אף צבא לא כבש את מבצר אטני בסערה. כשנפל לבסוף, ב-1554, הכניעו אותו הצמא וסוד שגילה משרת שבוי.**


    המבצר, המכונה גם סציווי או מבצר אורבליאני, נבנה במאות ה-10–11 ועומד על צוק גבוה בערוץ אטני, בין הנקיקים
    סציווחווי ואבנוסחווי. הוא בנוי מאבני גוויל: חלק צפוני קטן יותר ובו הכניסה, וגוש מרכזי מדרום. בוניו
    הבינו היטב מהו מצור: בחלקו התחתון הקימו מאגרי מים גדולים, שהוזנו בצינורות חרס מנקיק בצפון-מערב.


    במאה ה-10 היה המבצר בידי הדוכסים (אריסתאווים) של קלדקרי, והדוכס ראטי עמד בו מול בגרט השלישי, המלך
    שאיחד את גאורגיה, לפני שמסר אותו. באמצע המאה ה-11 ניסה ליפריט מקלדקרי, בגיבוי ביזנטיון וקאחתי, לכבוש
    אותו ונכשל: חיל המצב נשאר נאמן. בראשית המאה ה-16 צר כאן אב-גיורגי מקאחתי, שרצח את אביו, במשך כמה ימים
    על דוד העשירי מלך קרתלי, והסתלק עם שלל בלבד.


    ב-1554 בא מסע המלחמה הרביעי של השאה טהמאספ. הקזילבאש הגיעו לאטני, שבו מצאה מקלט אמו של המלך לוארסאב
    הראשון, אך לא הצליחו לפרוץ את החומות וגם לא לקרב אליהן מכונות מצור. הם תפסו את משרתה של המלכה האם,
    בתיאשווילי מקוותיסחווי, נשבעו לחוס על חייו והביאו אותו לדבר. הבאר, סיפר, רוקנה עד הטיפה האחרונה, ובצד
    הצפוני זורם פלג קטן. הם חסמו את הפלג, והצמא עשה את השאר.


    המכה האחרונה באה ממלך גאורגי: ב-1642 כבש רוסטום, מלך קרתלי, את המבצר בעת שרדף אחרי המורד נודר ציצישווילי,
    והחריב אותו, ורעידת האדמה של 1920 הוסיפה נזק. עמדו ליד החומות התחתונות, במקום שבו היו המאגרים. זו
    הייתה מכונה לשמירת מים, והיא כשלה רק כשמישהו הסגיר את המים.
  tip: >-
    הכניסה חופשית: זו חורבה פתוחה, בלי קופה. השביל המסומן למעלה קל, אבל אחרי גשם הוא נעשה חלקלק, אז נעלו
    נעליים עם אחיזה טובה. אל תעלו על ראשי החומות השבורות: מתחתן הצוק צונח בתלילות. הקדישו שעה עד שלוש
    שעות, כולל ההליכה. שלבו את הביקור עם כנסיית אטני סיוני, במרחק 1.3 ק״מ, ועם מרתפי היין של הערוץ. באתר
    אין מים ואין שירותים; קחו בקבוק מים, ואת בתי הקפה חפשו בגורי.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) כ-80 ק״מ וצאו במחלף גורי. חצו את העיר ועלו על כביש חידיסתאווי–אטני
    (Sh137) דרומה, במעלה עמק הטאנה. המבצר ניצב על צוק מעל הכביש ליד דידי אטני, מעט לפני אטני סיוני: בסך
    הכול כ-96 ק״מ ושעה וחצי. הכביש בערוץ סלול אך צר, עם בורות וגשרים חד-נתיביים. רכב אקונומי מספיק בהחלט.
    תדלקו בגורי, כי בערוץ אין תחנת דלק. חנו בצד הכביש ועלו בשביל המסומן.
ar:
  name: قلعة أتيني
  short: 'حصن على قمة جرف في وادي أتيني لم يقتحمه جيش قطّ: سقط عام 1554 فقط حين أفشى خادم أسير سرّ مائه.'
  body: >-
    **لم يأخذ أيّ جيش قلعة أتيني عنوةً. وحين سقطت أخيراً عام 1554، أسقطها العطش وسرٌّ باح به خادم أسير.**


    تُعرف القلعة أيضاً باسم ساتسيفي أو قلعة أوربيلياني، وتعود إلى القرنين العاشر والحادي عشر، وتقوم على
    جرف عالٍ في وادي أتيني بين شِعبَي ساتسيفخيفي وأبانوسخيفي. بُنيت من الحجر الغشيم، ولها قسم شمالي أصغر
    فيه المدخل، وكتلة رئيسية إلى الجنوب. وكان بناتها يفهمون الحصار جيداً: فأقاموا في الجزء السفلي خزانات
    كبيرة تُغذّيها أنابيب فخارية من شِعبٍ في الشمال الغربي.


    في القرن العاشر كانت القلعة لدوقات (إريستافي) كلدكاري، وقد صمد فيها الدوق راتي في وجه باغرات الثالث،
    الملك الذي وحّد جورجيا، قبل أن يسلّمها. وفي منتصف القرن الحادي عشر حاول ليباريت الكلدكاري، مدعوماً
    من بيزنطة وكاخيتي، أخذها ففشل، إذ بقيت الحامية على ولائها. وفي مطلع القرن السادس عشر حاصر آف-غيورغي
    الكاخيتي، قاتل أبيه، ملكَ كارتلي داود العاشر هنا أياماً، ثم انصرف ولم يظفر إلا بالغنائم.


    وفي عام 1554 جاءت الحملة الرابعة للشاه طهماسب. بلغ القزلباش أتيني، حيث لجأت والدة الملك لوارساب الأول،
    لكنهم لم يستطيعوا إحداث ثغرة في الأسوار ولا إدناء آلات الحصار منها. فأسروا خادم الملكة الأم، بيتياشفيلي
    من كافتيسخيفي، وأقسموا أن يُبقوا على حياته، وحملوه على الكلام. قال لهم إن ماء البئر شُرب حتى نفد،
    وإن جدولاً صغيراً يجري على الجانب الشمالي. فقطعوه، وأتمّ العطش الباقي.


    وجاءت الضربة الأخيرة من ملك جورجي: ففي عام 1642 استولى روستوم ملك كارتلي على القلعة وهو يطارد المتمرد
    نودار تسيتسيشفيلي، ودمّرها، ثم زاد زلزال عام 1920 في خرابها. قف عند الأسوار السفلى حيث كانت الخزانات.
    كانت هذه آلةً لحفظ الماء، ولم تخذل أهلها إلا حين وشى أحدهم بالماء.
  tip: >-
    الدخول مجاني: فهذه أطلال مفتوحة بلا شبّاك تذاكر. الدرب المؤدي إلى الأعلى معلَّم وسهل، لكنه يصير زلقاً
    بعد المطر، فانتعل حذاءً جيد الثبات. ابتعد عن أعالي الأسوار المتهدمة، فالجرف تحتها شديد الانحدار. خصّص
    من ساعة إلى ثلاث ساعات بما فيها المشي. اجمع الزيارة مع كنيسة أتيني سيوني على بعد 1.3 كم ومع أقبية
    النبيذ في الوادي. لا ماء ولا دورات مياه في الموقع؛ احمل قارورة ماء، واقصد مقاهي غوري.
  route: >-
    من تبليسي اسلك الطريق السريع S1 (E60) غرباً نحو 80 كم واخرج عند مخرج غوري. اعبر المدينة وخذ طريق خيديستافي–أتيني
    (Sh137) جنوباً صعوداً في وادي تانا. تقوم القلعة على جرف فوق الطريق قرب ديدي أتيني، قبل أتيني سيوني
    بقليل: نحو 96 كم وساعة ونصف في المجموع. طريق الوادي معبّد لكنه ضيق، فيه حفر وجسور بمسار واحد. السيارة
    الاقتصادية كافية تماماً. املأ خزان الوقود في غوري، إذ لا محطة وقود في الوادي. اركن بجانب الطريق واصعد
    الدرب المعلَّم.
