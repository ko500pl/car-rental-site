ka:
  name: ქულბაქის ტბა
  short: >-
    მწვანე ტბა ლეჩხუმის გრილ, ტყიან ხეობაში: ნაპირზე კალმახის მეურნეობა, საბანაოდ ყინულივით ცივი მდინარე
    და მთებისკენ მიმავალი ბილიკები.
  body: >-
    **როცა ლეჩხუმის დაბალ ხეობებში სიცხე ჩამოწვება, ხალხი სიგრილისთვის ქულბაქში ადის.**


    სოფელი ზღვის დონიდან დაახლოებით 720 მეტრზე, ჯონოულას ხეობაში მდებარეობს. ეს 21-კილომეტრიანი მდინარე
    ეგრისის ქედზე იწყება და ცხენისწყალს უერთდება; ცაგერამდე აქედან 17 კილომეტრია. 2014 წლის აღწერით სოფელში
    131 მოსახლე ცხოვრობდა. სოფლიდან ხეობას დაახლოებით სამი კილომეტრით ზემოთ ტბაა: მწვანე წყალი ციცაბო,
    ტყიანი ფერდობების ძირას, ნაკადულები, რომლებიც მას ასაზრდოებს, და ხეობა, რომელიც ქვემოთ, ვენახებს შორის
    გაშლილ ცხელ სოფლებზე შესამჩნევად გრილია.


    ქულბაქის წარსულზე ბევრი არაფერი დაწერილა და ჩვენც არაფერს მოვიგონებთ. აქ სხვა, უფრო უბრალო რამ გელით:
    ნაპირზე კალმახის მეურნეობა, წყლის პირას შემწვარი კალმახი, კოტეჯი ღამის გასათევად და ბანაობა ჯონოულას
    ყინულივით წყალში — სწორედ ამ სიცივისთვის ამოდიან აქ.


    ქულბაქი მთებისკენ გაღებული კარიცაა. აქედან მოლაშქრეები ასხის კირქვიან მასივზე ადიან — იქიდან მეორე
    მხარეს, კინჩხისკენ ჩასვლაც შეიძლება — და ახალჭალისკენ, მთაში მიტოვებული კურორტისკენ, მიდიან: ეს წრიული
    მარშრუტი სულ ცოტა სამ დღეს მოითხოვს. ორივე სერიოზული გზაა მომზადებული მოლაშქრეებისთვის და არა შუადღის
    სასეირნოდ.


    ქულბაქი შთაბეჭდილების მოხდენას არ ცდილობს. გაგაგრილებთ, დაგაპურებთ და მთისკენ გაგიშვებთ.
  tip: >-
    ქულბაქი თბილი სეზონის ადგილია: მაისიდან ოქტომბრამდე კალმახი, კოტეჯი და მდინარე მგზავრობას ამართლებს,
    ზამთარში კი აქ ამოსასვლელი მიზეზი ცოტაა. ტბა უფასოა, საჭმელსა და ღამისთევაში კი ნაღდი ფულით იხდით,
    ამიტომ ქუთაისიდან ან ცაგერიდან საკმარისი თანხა წამოიღეთ. ჯონოულა ძალიან ცივია და მაშველი აქ არავინაა:
    წყნარ ადგილას იბანავეთ და არასოდეს მარტო. ახალჭალისკენ ჯიპის გზა ცაგერის მხრიდან, ზედა ლუხვანოს გავლით
    მიდის — 20 კილომეტრზე მეტი გრუნტი, მხოლოდ ძველი საბჭოთა სატვირთოებისთვის ვარგისი და არა ნაქირავები
    მანქანისთვის. ლაშქრობებზე გიდი ან სანდო GPS-ტრეკი, ბევრი წყალი და კარავი წაიღეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ქუთაისამდე, შემდეგ შ15-ით ჩრდილოეთით, წყალტუბოს გავლით,
    ცაგერის მიმართულებით. ოყურეშს რამდენიმე კილომეტრით რომ გასცდებით, იქ, სადაც ჯონოულა ცხენისწყალს ერთვის,
    გადაუხვიეთ და ჯონოულას ხეობას ქულბაქამდე აუყევით. სულ დაახლოებით 285 კმ და ხუთ საათზე ცოტა ნაკლებია.
    გზა მეტწილად ასფალტიანია, წყალტუბოს შემდეგ ვიწრო და კლაკნილი; მშრალ ამინდში ეკონომკლასის მანქანაც
    გაივლის. საწვავი ქუთაისში ან წყალტუბოში ჩაასხით, ან 17 კილომეტრში მდებარე ცაგერში. მანქანის გარეშე
    ქუთაისი–ცაგერის ავტობუსი ქულბაქის შესახვევთან ჩამოგსვამთ.
en:
  name: Kulbaki Lake
  short: >-
    A green lake in a cool, wooded Lechkhumi valley, with a trout farm on the shore, an icy river to swim
    in and trails into the mountains.
  body: >-
    **When the lower valleys of Lechkhumi swelter, people drive up to Kulbaki for the cold.**


    The village sits at about 720 metres in the valley of the Jonoula, a 21 km river that rises on the
    Egrisi range and runs down to the Tskhenistskali; Tsageri is 17 km away. The 2014 census counted 131
    people here. About three kilometres further up the valley lies the lake: green water under steep,
    wooded slopes, fed by small streams, in a gorge noticeably cooler than the hot vineyard villages below.


    Little of Kulbaki's past has been written down, and we will not invent it. What the place offers is
    simpler: a trout farm on the shore, fried trout eaten by the water, a cottage for the night and a
    swim in the ice-cold Jonoula, which is exactly what people come up here for.


    Kulbaki is also a door into the mountains. Hikers set out from here for the Askhi limestone massif,
    with the option of descending towards Kinchkha on the far side, and on a loop of at least three days
    to Akhalchala, an abandoned resort high in the hills, and back. These are serious routes for prepared
    walkers, not afternoon strolls.


    Kulbaki does not try to impress. It cools you down, feeds you and points you uphill.
  tip: >-
    Kulbaki is a warm-season place: from May to October the trout, the cottage and the river justify the
    drive; in winter there is little reason to come. The lake is free, but food and beds are paid in cash,
    so bring enough from Kutaisi or Tsageri. The Jonoula is very cold and there are no lifeguards: swim
    where the water is calm, never alone. The jeep track to Akhalchala starts on the Tsageri side, via
    Zeda Lukhvano, and is 20-plus km of dirt fit only for old Soviet trucks, not a rental car. For the
    hikes, take a guide or a reliable GPS track, plenty of water and a tent.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh15 north through Tskaltubo towards Tsageri.
    A few kilometres beyond Okureshi, where the Jonoula meets the Tskhenistskali, turn off and follow
    the Jonoula valley up to Kulbaki. In all it is about 285 km and just under five hours. The road is
    mostly asphalt, narrow and winding after Tskaltubo, and an economy car manages in dry weather. Fill
    up in Kutaisi or Tskaltubo, or in Tsageri, 17 km away. Without a car, the Kutaisi–Tsageri bus will
    drop you at the Kulbaki turn-off.
ru:
  name: Озеро Кулбаки
  short: >-
    Зелёное озеро в прохладной лесистой долине Лечхуми: форелевое хозяйство на берегу, ледяная река для
    купания и тропы в горы.
  body: >-
    **Когда нижние долины Лечхуми изнывают от зноя, люди едут в Кулбаки за прохладой.**


    Село лежит на высоте около 720 метров в долине Джоноулы — 21-километровой реки, которая берёт начало
    на Эгрисском хребте и сбегает к Цхенисцкали; до Цагери 17 км. Перепись 2014 года насчитала здесь 131
    человека. Примерно в трёх километрах выше по долине — озеро: зелёная вода под крутыми лесистыми склонами,
    питаемая небольшими ручьями, в ущелье, заметно более прохладном, чем жаркие винодельческие сёла внизу.


    О прошлом Кулбаки записано немного, и выдумывать его мы не станем. Здесь всё проще: форелевое хозяйство
    на берегу, жареная форель у самой воды, домик на ночь и купание в ледяной Джоноуле — именно за этим
    сюда и поднимаются.


    Кулбаки — это ещё и дверь в горы. Отсюда туристы уходят к известняковому массиву Асхи, с возможностью
    спуститься к Кинчхе на другой стороне, и на кольцевой маршрут не меньше чем на три дня — до Ахалчалы,
    заброшенного курорта высоко в горах, и обратно. Это серьёзные маршруты для подготовленных ходоков,
    а не послеобеденные прогулки.


    Кулбаки не пытается впечатлить. Оно остудит вас, накормит и укажет дорогу вверх.
  tip: >-
    Кулбаки — место для тёплого сезона: с мая по октябрь форель, домик и река оправдывают дорогу; зимой
    ехать сюда почти незачем. Озеро бесплатное, но за еду и ночлег платят наличными, так что запаситесь
    ими в Кутаиси или Цагери. Джоноула очень холодная, спасателей нет: купайтесь там, где вода спокойна,
    и никогда в одиночку. Джиповая дорога на Ахалчалу начинается со стороны Цагери, через Зеда-Лухвано:
    это больше 20 км грунтовки, которая по силам только старым советским грузовикам, но не арендованной
    машине. В походы берите гида или надёжный GPS-трек, побольше воды и палатку.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh15 на север через Цхалтубо в сторону Цагери.
    Через несколько километров после Окуреши, там, где Джоноула впадает в Цхенисцкали, сверните и поднимайтесь
    по долине Джоноулы до Кулбаки. Всего около 285 км и чуть меньше пяти часов. Дорога в основном асфальтовая,
    после Цхалтубо узкая и извилистая; в сухую погоду справится и машина эконом-класса. Заправьтесь в
    Кутаиси или Цхалтубо либо в Цагери, в 17 км от села. Без машины можно доехать автобусом Кутаиси —
    Цагери: он высадит вас у поворота на Кулбаки.
fa:
  name: دریاچهٔ کولباکی
  short: >-
    دریاچه‌ای سبز در دره‌ای خنک و جنگلی در لچخومی، با پرورشگاه قزل‌آلا بر کرانه، رودی یخ‌سرد برای شنا
    و کوره‌راه‌هایی به دل کوهستان.
  body: >-
    **وقتی دره‌های پایین‌دست لچخومی در گرما می‌سوزند، مردم برای خنکی به کولباکی می‌آیند.**


    روستا در ارتفاع حدود ۷۲۰ متری در درهٔ جونولا قرار دارد؛ رودی ۲۱ کیلومتری که از رشته‌کوه اگریسی سرچشمه
    می‌گیرد و به تسخنیستسکالی می‌ریزد. تساگری ۱۷ کیلومتر دورتر است. سرشماری ۲۰۱۴ در اینجا ۱۳۱ نفر را شمرد.
    حدود سه کیلومتر بالاتر در دره، دریاچه است: آبی سبز زیر دامنه‌های پرشیب و جنگلی که جویبارهای کوچک سیرابش
    می‌کنند، در تنگه‌ای که آشکارا خنک‌تر از روستاهای داغ و پرتاکستان پایین‌دست است.


    از گذشتهٔ کولباکی چیز زیادی نوشته نشده و ما هم چیزی از خود نمی‌سازیم. آنچه این مکان پیش رویتان می‌گذارد
    ساده‌تر است: پرورشگاه قزل‌آلا بر کرانه، قزل‌آلای سرخ‌کرده کنار آب، کلبه‌ای برای شب و شنا در آب یخ‌سرد
    جونولا؛ همان چیزی که مردم درست برای آن به اینجا می‌آیند.


    کولباکی دری به کوهستان هم هست. کوه‌پیمایان از اینجا راهی تودهٔ آهکی آسخی می‌شوند، با امکان فرود به
    سوی کینچخا در آن سو، و نیز مسیری حلقوی و دست‌کم سه‌روزه را تا آخالچالا، تفرجگاهی متروک در بلندی‌های
    کوهستان، و بازگشت از آن می‌پیمایند. این‌ها مسیرهایی جدی برای کوه‌پیمایان آماده‌اند، نه گشتی برای یک
    بعدازظهر.


    کولباکی نمی‌کوشد کسی را شگفت‌زده کند. خنکتان می‌کند، سیرتان می‌کند و راه سربالایی را نشانتان می‌دهد.
  tip: >-
    کولباکی جایی برای فصل گرم است: از ماه مه تا اکتبر، قزل‌آلا، کلبه و رودخانه ارزش این راه را دارند؛
    در زمستان دلیل چندانی برای آمدن نیست. دیدن دریاچه رایگان است، اما پول غذا و جای خواب نقدی پرداخت می‌شود،
    پس به اندازهٔ کافی از کوتائیسی یا تساگری همراه بیاورید. جونولا بسیار سرد است و نجات‌غریقی در کار نیست:
    جایی شنا کنید که آب آرام است، و هرگز تنها. جادهٔ جیپ‌رو به آخالچالا از سمت تساگری و از راه زدا لوخوانو
    آغاز می‌شود و بیش از ۲۰ کیلومتر راه خاکی است که تنها از عهدهٔ کامیون‌های قدیمی شوروی برمی‌آید، نه
    خودروی اجاره‌ای. برای کوه‌پیمایی راهنما یا ردّ جی‌پی‌اس معتبر، آب فراوان و چادر همراه داشته باشید.
  route: >-
    از تفلیس از S1 (E60) به سمت غرب تا کوتائیسی بروید، سپس از Sh15 به سمت شمال از تسخالتوبو به سوی تساگری.
    چند کیلومتر پس از اوکورشی، جایی که جونولا به تسخنیستسکالی می‌پیوندد، از جاده جدا شوید و درهٔ جونولا
    را تا کولباکی بالا بروید. روی هم حدود ۲۸۵ کیلومتر و کمی کمتر از پنج ساعت راه است. جاده بیشتر آسفالت
    است و پس از تسخالتوبو باریک و پرپیچ‌وخم می‌شود؛ در هوای خشک خودروی اقتصادی از پسش برمی‌آید. در کوتائیسی
    یا تسخالتوبو، یا در تساگری در ۱۷ کیلومتری، سوخت‌گیری کنید. بی‌خودرو هم می‌شود رفت: اتوبوس کوتائیسی–تساگری
    شما را سر دوراهی کولباکی پیاده می‌کند.
he:
  name: אגם קולבקי
  short: אגם ירוק בעמק מיוער וקריר בלצ'חומי, עם חוות פורלים על החוף, נהר קר כקרח לרחצה ושבילים אל ההרים.
  body: >-
    **כשהעמקים התחתונים של לצ'חומי מתבשלים בחום, אנשים עולים לקולבקי בשביל הקור.**


    הכפר שוכן בגובה של כ-720 מטר בעמק הג'ונואולה, נהר באורך 21 ק״מ שנובע ברכס אגריסי ויורד אל הצחניסצקאלי;
    צאגרי נמצאת במרחק 17 ק״מ. במפקד 2014 נמנו כאן 131 איש. כשלושה קילומטרים במעלה העמק מן הכפר שוכן האגם:
    מים ירוקים למרגלות מדרונות תלולים ומיוערים, הניזונים מנחלים קטנים, בערוץ קריר בהרבה מכפרי הכרמים החמים
    שלמטה.


    מעט מאוד מעברה של קולבקי הועלה על הכתב, ואנחנו לא נמציא אותו. מה שהמקום מציע פשוט יותר: חוות פורלים
    על החוף, פורל מטוגן שאוכלים ליד המים, בקתה ללילה ורחצה במי הג'ונואולה הקפואים — ובדיוק בשביל זה אנשים
    עולים לכאן.


    קולבקי היא גם שער אל ההרים. מטיילים יוצאים מכאן אל מסיף הגיר אסחי, עם אפשרות לרדת לעבר קינצ'חה שבצדו
    השני, ולמסלול מעגלי של שלושה ימים לפחות אל אחלצ'לה, אתר נופש נטוש גבוה בהרים, ובחזרה. אלה מסלולים
    רציניים להולכי רגל מוכנים, לא טיול של אחר צהריים.


    קולבקי לא מנסה להרשים. היא מצננת אתכם, מאכילה אתכם ומכוונת אתכם במעלה ההר.
  tip: >-
    קולבקי היא מקום לעונה החמה: ממאי עד אוקטובר הפורל, הבקתה והנהר מצדיקים את הנסיעה; בחורף אין הרבה סיבות
    לבוא. הכניסה לאגם חופשית, אבל על אוכל ולינה משלמים במזומן, אז הביאו מספיק מקותאיסי או מצאגרי. הג'ונואולה
    קר מאוד ואין מצילים: שחו רק במקום שבו המים שקטים, ולעולם לא לבד. דרך הג'יפים לאחלצ'לה מתחילה מצד צאגרי,
    דרך זדה לוחוואנו, ואלה יותר מ-20 ק״מ של דרך עפר שמתאימה רק למשאיות סובייטיות ישנות, לא לרכב שכור.
    לטיולים הרגליים קחו מדריך או מסלול GPS אמין, הרבה מים ואוהל.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד קותאיסי, ואז בכביש Sh15 צפונה דרך צחלטובו לכיוון צאגרי. כמה קילומטרים
    אחרי אוקורשי, במקום שבו הג'ונואולה נפגש עם הצחניסצקאלי, פנו מהכביש ועלו לאורך עמק הג'ונואולה עד קולבקי.
    בסך הכול כ-285 ק״מ וקצת פחות מחמש שעות. הכביש סלול ברובו, צר ומפותל אחרי צחלטובו, ורכב חסכוני מסתדר
    בו במזג אוויר יבש. תדלקו בקותאיסי או בצחלטובו, או בצאגרי, במרחק 17 ק״מ. בלי רכב, האוטובוס קותאיסי–צאגרי
    יוריד אתכם בפנייה לקולבקי.
ar:
  name: بحيرة كولباكي
  short: >-
    بحيرة خضراء في وادٍ حرجي بارد في ليتشخومي، على شاطئها مزرعة لسمك التروتة، ونهر بارد كالثلج للسباحة،
    ودروب نحو الجبال.
  body: >-
    **حين تختنق الأودية السفلى في ليتشخومي بالحر، يصعد الناس إلى كولباكي طلباً للبرد.**


    تقع القرية على ارتفاع نحو 720 متراً في وادي نهر جونولا، وهو نهر طوله 21 كم ينبع من سلسلة إيغريسي الجبلية
    وينحدر إلى نهر تسخينيستسكالي؛ وتبعد تساغيري 17 كم. وقد أحصى تعداد 2014 هنا 131 نسمة. وعلى بعد نحو
    ثلاثة كيلومترات أعلى الوادي من القرية تقع البحيرة: ماء أخضر تحت منحدرات شديدة كستها الغابات، تغذّيه
    جداول صغيرة، في مضيق أبرد بوضوح من قرى الكروم الحارّة في الأسفل.


    لم يُدوَّن من ماضي كولباكي إلا القليل، ولن نختلقه. ما يقدّمه المكان أبسط من ذلك: مزرعة تروتة على الشاطئ،
    وتروتة مقلية تؤكل عند الماء، وكوخ للمبيت، وسباحة في مياه جونولا الباردة كالثلج، وهذا بالضبط ما يأتي
    الناس من أجله.


    وكولباكي أيضاً بابٌ إلى الجبال. ينطلق المشّاؤون من هنا إلى كتلة أسخي الكلسية، مع إمكانية النزول نحو
    كينتشخا على الجانب الآخر، وفي مسار دائري لا يقل عن ثلاثة أيام إلى أخالتشالا، وهو منتجع مهجور عالياً
    في الجبال، ثم العودة. إنها مسارات جادة لمشّائين مستعدين، لا نزهات ما بعد الظهر.


    لا تحاول كولباكي أن تبهر أحداً. إنها تبرّدك، وتطعمك، وتدلّك على الطريق صعوداً.
  tip: >-
    كولباكي مكان للموسم الدافئ: من مايو إلى أكتوبر تستحق التروتة والكوخ والنهر عناء الطريق؛ أما في الشتاء
    فلا سبب يُذكر للمجيء. البحيرة مجانية، لكن الطعام والمبيت يُدفعان نقداً، فاحمل ما يكفي من كوتايسي أو
    تساغيري. نهر جونولا بارد جداً ولا منقذين فيه: اسبح حيث الماء هادئ، ولا تسبح وحدك أبداً. يبدأ مسلك
    سيارات الجيب إلى أخالتشالا من جهة تساغيري، عبر زيدا لوخفانو، وهو أكثر من 20 كم من الطريق الترابي لا
    تقوى عليه إلا الشاحنات السوفييتية القديمة، لا السيارات المستأجرة. وللمشي في الجبال خذ دليلاً أو مسار
    GPS موثوقاً، وماءً وفيراً وخيمة.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً إلى كوتايسي، ثم Sh15 شمالاً عبر تسخالتوبو باتجاه تساغيري. وبعد
    أوكوريشي ببضعة كيلومترات، حيث يلتقي جونولا بنهر تسخينيستسكالي، انعطف وتابع وادي جونولا صعوداً حتى
    كولباكي. المسافة الإجمالية نحو 285 كم وأقل بقليل من خمس ساعات. الطريق معبّد في معظمه، ضيق ومتعرّج
    بعد تسخالتوبو، وتكفيه سيارة اقتصادية في الطقس الجاف. تزوّد بالوقود في كوتايسي أو تسخالتوبو، أو في
    تساغيري على بعد 17 كم. ومن دون سيارة، تُنزلك حافلة كوتايسي–تساغيري عند مفترق كولباكي.
