ka:
  name: უდაბნო და ცისარტყელას გორები
  short: >-
    ზოლებად შეღებილი გორები და მრავალწყაროს წყალსაცავი დავითგარეჯის ნახევარუდაბნოში — მარსული პეიზაჟი
    თბილისიდან ორ საათში.
  body: >-
    **აქ საქართველო მარსს ჰგავს.** სოფელ უდაბნოსა და დავითგარეჯის სამონასტრო კომპლექსს შორის სტეპი უეცრად
    ფერად ზოლებად იშლება — მოწითალო, სპილენძისფერი, მოთეთრო და მომწვანო შრეები, რომლებიც მინერალებით მდიდარმა
    დანალექმა ქანებმა შექმნა ევრაზიისა და არაბეთის ფილების შეჯახებისას.


    ყველაზე მასშტაბური „ცისარტყელას გორები“ მრავალწყაროს წყალსაცავის ირგვლივაა — გარეჯის ლავრადან დაახლოებით
    10 კილომეტრში, 510 მეტრზე. ფირუზისფერი წყალი ზოლიან ბორცვებს შორის ნახევარუდაბნოს სიურრეალისტურ ოაზისად
    იქცევა. უფრო პატარა, მაგრამ ისეთივე კაშკაშა გორები თავად მონასტრის მისადგომებთანაცაა.


    რა ღირს ნახვად:


    - **მრავალწყაროს წყალსაცავი** და მის გარშემო ფერადი ბორცვები

    - **სოფელი უდაბნო** — სტეპის შუაგულში, ცნობილი „ოაზის კლუბით“

    - **დავითგარეჯის ლავრა** — ლოგიკური გაგრძელება იმავე დღეს


    საუკეთესო შუქი დილაა და მზის ჩასვლის წინა საათი, როცა ზოლები ყველაზე მკვეთრი ჩანს. გაზაფხულზე სტეპი
    მწვანედება და ყაყაჩოებით იფარება, ზაფხულში კი გადამწვარი და ცხელია.
  tip: >-
    გორებამდე მისასვლელი გზები მიწისაა — წვიმის შემდეგ თიხა ცურავს და დაბალი მანქანა ადვილად ეფლობა, ამიტომ
    მშრალ ამინდში წადი. მაღაზია და საწვავი ადგილზე არ არის; წყალი, საკვები და ბენზინი წინასწარ მოიმარაგე.
    სადილად უდაბნოს „ოაზის კლუბი“ გამოგადგება. ზაფხულში გველგესლას შეიძლება გადააწყდე — მაღალ ბალახში
    ფრთხილად, დახურული ფეხსაცმლით. ჩრდილი პრაქტიკულად არსად არის, ქუდი აუცილებელია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით საგარეჯომდე, იქიდან კი სამხრეთით, უდაბნოსკენ მიმავალი გზით — მონასტრამდე
    გზა ბოლო წლებში სრულად დაასფალტეს. სოფლიდან და ლავრის მისადგომებიდან გორებისა და მრავალწყაროსკენ მიწის
    და ხრეშის ბილიკები მიდის. სულ დაახლოებით 85 კმ და პური საათ-ნახევარი-ორი. ბოლო გასამართი საგარეჯოშია.
    მშრალ ამინდში მაღალი კლირენსის SUV საკმარისია; წვიმის შემდეგ მიწის მონაკვეთებს საერთოდ მოერიდე.
en:
  name: Udabno & the Rainbow Hills
  short: >-
    Candy-striped badlands and the Mravaltskaro reservoir in the David Gareja semi-desert — a Martian
    landscape two hours from Tbilisi.
  body: >-
    **This is where Georgia does its best impression of Mars.** Between the village of Udabno and the
    David Gareja monastery complex, the steppe suddenly breaks into coloured stripes — bands of rust red,
    copper, cream and pale green, mineral-rich sedimentary layers folded upwards when the Eurasian and
    Afro-Arabian plates collided.


    The largest of these "rainbow hills" cluster around the Mravaltskaro reservoir, roughly 10 km northwest
    of the Gareja Lavra at 510 m, where turquoise water among striped mounds makes a surreal oasis in
    the semi-desert. Smaller but equally vivid hills rise right on the approach to the monastery itself.


    Worth building a loop around:


    - **Mravaltskaro reservoir** and the banded badlands surrounding it

    - **Udabno village** — a lonely steppe settlement, known for its Oasis Club café

    - **David Gareja Lavra** — the natural continuation of the same day


    The stripes are sharpest in early morning and the hour before sunset. In spring the steppe turns green
    and fills with poppies; by high summer it is scorched, shadeless and seriously hot.
  tip: >-
    The tracks to the hills are bare earth — after rain the clay turns to grease and low cars bog down,
    so come in dry weather. There are no shops or fuel out here: stock up on water, food and petrol beforehand.
    For lunch, the Oasis Club in Udabno is the reliable option. Vipers live in the tall grass in summer
    — wear closed shoes and watch your step. There is effectively no shade anywhere; a hat is non-negotiable.
  route: >-
    From Tbilisi take the Kakheti highway to Sagarejo, then turn south on the Udabno road — the stretch
    to the monastery has been fully asphalted in recent years. From the village and the Lavra approaches,
    dirt and gravel tracks branch off towards the hills and Mravaltskaro. Count on about 85 km and an
    hour and three quarters. The last fuel is in Sagarejo. In dry weather a high-clearance SUV is enough;
    after rain, avoid the earth sections entirely.
ru:
  name: Удабно и радужные холмы
  short: >-
    Полосатые холмы и водохранилище Мравалцкаро в полупустыне Давид-Гареджи — марсианский пейзаж в двух
    часах от Тбилиси.
  body: >-
    **Здесь Грузия лучше всего изображает Марс.** Между селом Удабно и монастырским комплексом Давид-Гареджи
    степь внезапно рассыпается цветными полосами — ржаво-красные, медные, кремовые и бледно-зелёные слои
    богатых минералами осадочных пород, смятые при столкновении Евразийской и Афро-Аравийской плит.


    Самые масштабные "радужные холмы" собраны вокруг водохранилища Мравалцкаро, примерно в 10 км к северо-западу
    от лавры Гареджи, на высоте 510 м: бирюзовая вода среди полосатых бугров превращается в сюрреалистический
    оазис полупустыни. Холмы поменьше, но такие же яркие, поднимаются прямо на подъезде к монастырю.


    Из чего собрать маршрут:


    - **Водохранилище Мравалцкаро** и полосатые бедленды вокруг

    - **Село Удабно** — одинокое степное поселение с известным кафе Oasis Club

    - **Лавра Давид-Гареджи** — естественное продолжение того же дня


    Полосы контрастнее всего ранним утром и за час до заката. Весной степь зеленеет и покрывается маками;
    в разгар лета она выжжена, лишена тени и по-настоящему раскалена.
  tip: >-
    Дороги к холмам грунтовые — после дождя глина превращается в мыло, и низкая машина легко садится,
    поэтому приезжайте в сухую погоду. Магазинов и заправок здесь нет: воду, еду и бензин берите заранее.
    Пообедать надёжнее всего в Oasis Club в Удабно. Летом в высокой траве встречаются гадюки — закрытая
    обувь и внимательность обязательны. Тени практически нигде нет, без головного убора никак.
  route: >-
    Из Тбилиси по Кахетинской трассе до Сагареджо, затем поворот на юг, на дорогу к Удабно — участок до
    монастыря в последние годы полностью заасфальтировали. От села и от подъездов к лавре к холмам и Мравалцкаро
    уходят грунтовки и гравийки. В сумме около 85 км и час сорок пять. Последняя заправка — в Сагареджо.
    В сухую погоду достаточно кроссовера с высоким клиренсом; после дождя грунтовых участков лучше избегать
    вовсе.
fa:
  name: اودابنو و تپه‌های رنگین‌کمانی
  short: تپه‌های راه‌راه رنگی و مخزن مراوال‌تسکارو در نیمه‌بیابان داوید گارجا — چشم‌اندازی مریخی در دو
    ساعتی تفلیس.
  body: >-
    **اینجا گرجستان بهترین ادای مریخ را درمی‌آورد.** میان روستای اودابنو و مجموعهٔ صومعه‌های داوید گارجا،
    استپ ناگهان به نوارهای رنگی می‌شکند — لایه‌های سرخ زنگاری، مسی، کرم و سبز کم‌رنگ از سنگ‌های رسوبی
    غنی از مواد معدنی که در برخورد صفحه‌های اوراسیا و عربی-آفریقایی چین خورده‌اند.


    بزرگ‌ترین این «تپه‌های رنگین‌کمانی» گرد مخزن مراوال‌تسکارو جمع‌اند، حدود 10 کیلومتری شمال غرب لاورای
    گارجا در ارتفاع 510 متر؛ آب فیروزه‌ای میان پشته‌های راه‌راه، واحه‌ای سوررئال در نیمه‌بیابان ساخته
    است. تپه‌های کوچک‌تر اما به همان درخشانی، درست بر سر راه خود صومعه سر برآورده‌اند.


    برنامهٔ خوب یک روز:


    - **مخزن مراوال‌تسکارو** و بدلندهای نواری پیرامونش

    - **روستای اودابنو** — آبادی تنهای استپ با کافهٔ معروف اوآسیس کلاب

    - **لاورای داوید گارجا** — ادامهٔ طبیعی همان روز


    نوارها صبح زود و ساعت پیش از غروب از همه‌جا تیزترند. بهار استپ سبز می‌شود و از شقایق پر؛ اوج تابستان
    اما سوخته، بی‌سایه و به‌راستی داغ است.
  tip: >-
    راه‌های رسیدن به تپه‌ها خاکی‌اند — پس از باران، رس مثل صابون لیز می‌شود و خودروی کوتاه به‌راحتی گیر
    می‌کند؛ در هوای خشک بروید. اینجا مغازه و پمپ بنزین نیست: آب، خوراک و سوخت را از پیش بردارید. برای
    ناهار، اوآسیس کلاب در اودابنو گزینهٔ مطمئن است. تابستان‌ها در علف‌های بلند افعی هست — کفش بسته بپوشید
    و جلوی پا را بپایید. سایه عملاً وجود ندارد؛ کلاه واجب است.
  route: >-
    از تفلیس با بزرگراه کاختی تا ساگارجو، سپس به جنوب در جادهٔ اودابنو — قطعهٔ تا صومعه در سال‌های اخیر
    به‌کلی آسفالت شده است. از روستا و از مسیرهای نزدیک لاورا، راه‌های خاکی و شنی به سوی تپه‌ها و مراوال‌تسکارو
    جدا می‌شوند. روی‌هم حدود 85 کیلومتر و یک ساعت و سه ربع. آخرین پمپ بنزین در ساگارجوست. در هوای خشک
    شاسی‌بلند کافی است؛ پس از باران از بخش‌های خاکی یکسره بپرهیزید.
he:
  name: אודבנו וגבעות הקשת
  short: גבעות פסים צבעוניות ומאגר מרוואלצקארו בחצי-המדבר של דוד גארג'ה — נוף מאדים במרחק שעתיים מטביליסי.
  body: >-
    **כאן גאורגיה עושה את חיקוי המאדים הטוב שלה.** בין הכפר אודבנו למתחם המנזרים דוד גארג'ה, הערבה נשברת
    לפתע לפסים צבעוניים — שכבות בגוני חלודה, נחושת, קרם וירוק חיוור של סלעי משקע עשירים במינרלים, שקומטו
    בהתנגשות הלוחות האירואסייתי והאפרו-ערבי.


    "גבעות הקשת" הגדולות ביותר מקובצות סביב מאגר מרוואלצקארו, כ-10 ק״מ מצפון-מערב ללברה של גארג'ה, בגובה
    510 מ': מים בצבע טורקיז בין תלוליות מפוספסות יוצרים נווה מדבר סוריאליסטי. גבעות קטנות יותר אך חיות
    באותה מידה מתרוממות ממש בדרך הגישה למנזר עצמו.


    ממה מרכיבים את היום:


    - **מאגר מרוואלצקארו** והבדלנדס המפוספסים סביבו

    - **הכפר אודבנו** — יישוב ערבה בודד עם הקפה המוכר אואזיס קלאב

    - **הלברה של דוד גארג'ה** — ההמשך הטבעי של אותו יום


    הפסים חדים במיוחד בבוקר מוקדם ובשעה שלפני השקיעה. באביב הערבה מוריקה ומתמלאת פרגים; בשיא הקיץ היא
    חרוכה, חסרת צל וחמה ברצינות.
  tip: >-
    הדרכים אל הגבעות הן עפר חשוף — אחרי גשם החרסית הופכת לסבון ורכב נמוך שוקע בקלות, אז בואו במזג אוויר
    יבש. אין כאן חנויות או תחנות דלק: הצטיידו מראש במים, אוכל ודלק. לארוחת צהריים, אואזיס קלאב באודבנו
    הוא ההימור הבטוח. בקיץ חיים צפעים בעשב הגבוה — נעליים סגורות ותשומת לב לצעדים. צל אין כמעט בשום מקום;
    כובע הוא לא המלצה.
  route: >-
    מטביליסי בכביש קחתי עד סגרג'ו, ואז דרומה בדרך לאודבנו — הקטע עד המנזר נסלל במלואו בשנים האחרונות.
    מהכפר ומדרכי הגישה ללברה מתפצלות דרכי עפר וחצץ אל הגבעות ואל מרוואלצקארו. בסך הכול כ-85 ק״מ ושעה ושלושה
    רבעים. הדלק האחרון בסגרג'ו. במזג אוויר יבש מספיק רכב פנאי גבוה; אחרי גשם הימנעו לגמרי מקטעי העפר.
ar:
  name: أودابنو وتلال قوس قزح
  short: تلال مخططة بالألوان وخزان مرافالتسكارو في شبه صحراء ديفيد غاريجا — مشهد مريخي على ساعتين من تبليسي.
  body: >-
    **هنا تؤدي جورجيا أفضل تقليد لكوكب المريخ.** بين قرية أودابنو ومجمع أديرة ديفيد غاريجا، تتكسر السهوب
    فجأة إلى خطوط ملونة — طبقات بلون الصدأ والنحاس والقشدة والأخضر الشاحب من صخور رسوبية غنية بالمعادن،
    التوت وارتفعت عند اصطدام الصفيحتين الأوراسية والعربية-الأفريقية.


    أكبر «تلال قوس قزح» هذه تتجمع حول خزان مرافالتسكارو، على نحو 10 كم شمال غرب لافرا غاريجا وارتفاع 510
    أمتار، حيث يصنع الماء الفيروزي بين الروابي المخططة واحة سريالية في شبه الصحراء. وتنهض تلال أصغر لكن
    بالحيوية نفسها على مشارف الدير ذاته.


    مما تُبنى الجولة:


    - **خزان مرافالتسكارو** والأراضي الوعرة المخططة حوله

    - **قرية أودابنو** — مستوطنة سهوب وحيدة تشتهر بمقهى «أواسيس كلوب»

    - **لافرا ديفيد غاريجا** — الامتداد الطبيعي لليوم نفسه


    الخطوط أوضح ما تكون في الصباح الباكر وقبل الغروب بساعة. في الربيع تخضرّ السهوب وتمتلئ بشقائق النعمان؛
    وفي عز الصيف تكون محروقة بلا ظل وحارة بحق.
  tip: >-
    الدروب إلى التلال ترابية — بعد المطر يصير الطين كالصابون وتغرز السيارة المنخفضة بسهولة، فتعال في طقس
    جاف. لا متاجر ولا وقود هنا: تزود مسبقاً بالماء والطعام والبنزين. للغداء، «أواسيس كلوب» في أودابنو
    هو الخيار المضمون. في الصيف تعيش الأفاعي في العشب العالي — البس حذاءً مغلقاً وانتبه لخطواتك. لا ظل
    عملياً في أي مكان؛ والقبعة لا نقاش فيها.
  route: >-
    من تبليسي عبر طريق كاخيتي السريع إلى ساغاريجو، ثم انعطف جنوباً على طريق أودابنو — وقد عُبّد المقطع
    حتى الدير كاملاً في السنوات الأخيرة. من القرية ومن مشارف اللافرا تتفرع دروب ترابية وحصوية نحو التلال
    وخزان مرافالتسكارو. احسب نحو 85 كم وساعة وثلاثة أرباع. آخر محطة وقود في ساغاريجو. في الطقس الجاف تكفي
    سيارة دفع رباعي مرتفعة؛ وبعد المطر تجنب المقاطع الترابية كلياً.
