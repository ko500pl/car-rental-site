ka:
  name: უდაბნო და ცისარტყელას გორები
  short: >-
    ჟანგისფრად, ოხრისფრად და მკრთალ მწვანედ დაზოლილი გორები მრავალწყაროს წყალსაცავის ირგვლივ — ცარიელ
    სტეპში, უდაბნოსა და დავითგარეჯას შორის.
  body: >-
    **საგარეჯოს სამხრეთით სტეპი ისეთი ცარიელია, რომ სოფლის სახელი — უდაბნო — სულაც არ გეჩვენებათ გადაჭარბებად.
    მერე კი მიწა ფერს იცვლის.**


    სოფელ უდაბნოსა და დავითგარეჯის ქედს შორის შიშველი გორები ზოლებადაა აჭრელებული, თითქოს ფენოვანი ნამცხვარი
    გადაუჭრიათ: ჟანგისფერი, ოხრისფერი, რძისფერი, მოიისფრო-ნაცრისფერი, მკრთალი მომწვანო. ეს მინერალებით
    მდიდარი დანალექი ქანების შრეებია — ოდესღაც ჰორიზონტალურად დალექილი, შემდეგ კი ევრაზიისა და არაბეთის
    ფილების ნელი შეჯახებით ამოწეული და გადახრილი; იგივე ძალა კავკასიონს დღესაც ზრდის. წვიმა ფერდობებს
    რეცხავს და ზოლებს თითქმის არაფერი ფარავს.


    ყველაზე შთამბეჭდავი გორები მრავალწყაროს წყალსაცავს არტყია გარს — გარეჯის ლავრიდან 15-იოდე კილომეტრში,
    ჩრდილო-დასავლეთით, ზღვის დონიდან 510 მეტრზე. ფირუზისფერი წყალი დაზოლილ ბორცვებს შორის წევს და უქარო
    დილით ყოველი გორა ორჯერ ჩანს. უფრო პატარა ფერადი ფერდობები თავად მონასტრისკენ მიმავალ გზასაც მიუყვება.


    სოფელი უდაბნო გარეჯის ზეგანზე, 750 მეტრზე დგას; 2024 წლის აღწერით აქ 700-ზე ოდნავ მეტი ადამიანი ცხოვრობს.
    მისი ყველაზე ცნობილი მისამართი „ოაზის კლუბია“, რომელიც პოლონელმა წყვილმა გახსნა, რათა თითქმის დაცარიელებულ
    დასახლებაში სამუშაო და სიცოცხლე დაებრუნებინა. პოლონელების კაფე კახურ სტეპში ამ გზის ერთ-ერთი ყველაზე
    მოულოდნელი სიამოვნებაა.


    ეს სასაზღვრო მხარეცაა: დავითგარეჯის სამონასტრო კომპლექსის ნაწილი საქართველო-აზერბაიჯანის ჯერ კიდევ
    დაუზუსტებელ საზღვარზე მდებარეობს და 1991 წლიდან სადავოა, ამიტომ სასაზღვრო პოლიცია აქაური პეიზაჟის
    ჩვეული ნაწილია.


    მოსასვლელად შეარჩიეთ მზის ამოსვლის შემდეგ პირველი საათი ან ჩასვლამდე უკანასკნელი, როცა დახრილი სხივი
    თითოეულ ზოლს ამკვეთრებს. ივლისის შუადღეზე ფერები ხუნდება და გორები ისევ იმ უდაბნოს უბრუნდება, რომლის
    სახელიც სოფელს ჰქვია.
  tip: >-
    გორებამდე მისასვლელი გზები შიშველი თიხაა: მშრალ ამინდში მაღალი კლირენსის მანქანა თავისუფლად გადის,
    წვიმის შემდეგ კი თიხა საპონივით სრიალებს და დაბალ მანქანას ითრევს — თუ მიწა ბზინავს, უკან გამობრუნდით.
    ჩრდილი, მაღაზია და ბენზინგასამართი აქ არ არის: წაიღეთ წყალი (ზაფხულში სამი ლიტრი თითოეულზე) და ქუდი,
    საგარეჯოდან კი სავსე ავზით გამოდით. სადილისა და შესვენებისთვის საუკეთესო ადგილი უდაბნოს „ოაზის კლუბია“.
    თბილ თვეებში გველები გვხვდება — დახურული ფეხსაცმელი ჩაიცვით. ყველაზე სასიამოვნო აპრილი და მაისია,
    როცა სტეპი ხანმოკლედ მწვანდება; ივლის-აგვისტოში სიცხე მძიმეა. მობილური კავშირი წყვეტილია, ამიტომ რუკები
    წინასწარ ჩამოტვირთეთ.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) საგარეჯომდე იარეთ და იქვე შეავსეთ ავზი — ეს ბოლო საიმედო ბენზინგასამართია.
    საგარეჯოში სამხრეთით, შ172-ზე (საგარეჯო–უდაბნო–დავითგარეჯა) გადაუხვიეთ: გზა ღია, ტალღოვან სტეპს მიუყვება,
    თითქმის მთლიანად ასფალტიანია და სოფელ უდაბნომდე მიდის — თბილისიდან დაახლოებით 85 კილომეტრი, 1 საათი
    და 45 წუთი. სოფლიდან მრავალწყაროს წყალსაცავამდე, დასავლეთით, დაახლოებით 12 კილომეტრი უნიშნო გრუნტის
    გზაა; ერთი საათი მაინც გაითვალისწინეთ. იქირავეთ ჯიპი: ეკონომ კლასი უდაბნომდე მიაღწევს, გორებამდე —
    ვერა. წვიმის შემდეგ გრუნტის მონაკვეთებს საერთოდ მოერიდეთ.
en:
  name: Udabno & the Rainbow Hills
  short: >-
    Hills striped rust, ochre and pale green around the Mravaltskaro reservoir, on the empty steppe between
    Udabno and David Gareja.
  body: >-
    **South of Sagarejo the steppe is so empty that the village's name, Udabno, "desert", sounds like
    plain description. Then the ground begins to change colour.**


    Between Udabno village and the David Gareja ridge, bare hills are banded like a sliced layer cake:
    rust red, ochre, cream, lilac-grey, a pale acid green. These are layers of mineral-rich sedimentary
    rock, laid down flat and later heaved up and tilted by the slow collision of the Eurasian and Arabian
    plates, the same pressure that is still raising the Caucasus. Rain scours the slopes, so almost nothing
    grows over the stripes.


    The finest cluster rings the Mravaltskaro reservoir, some 15 km north-west of the Gareja Lavra at
    about 510 m. Its water lies turquoise among the banded mounds, and on a windless morning every hill
    appears twice. Smaller striped slopes line the road to the monastery itself.


    Udabno village stands on the Gareji plateau at 750 m and counted just over 700 residents in the 2024
    census. Its best-known address is the Oasis Club, opened by a Polish couple who wanted to bring work
    and life back to a largely abandoned settlement. A Polish-run café on a Kakhetian steppe is one of
    the stranger pleasures of this road.


    This is border country, too. Part of the David Gareja complex lies on the still undemarcated line
    with Azerbaijan, disputed since 1991, and border police are an ordinary part of the scenery.


    Come in the first hour after sunrise or the last before sunset, when low light sharpens every stripe.
    At noon in July the colours bleach out, and the hills sink back into the desert whose name the village
    carries.
  tip: >-
    The tracks to the hills are bare clay: in dry weather a high-clearance car copes easily, but after
    rain the clay turns to soap and swallows low cars. If the ground shines, turn back. There is no shade,
    shop or fuel out here, so bring water (three litres each in summer) and a hat, and leave Sagarejo
    with a full tank. The Oasis Club in Udabno is the place for lunch and a rest. Snakes are about in
    the warm months; wear closed shoes. April and May, when the steppe briefly greens, are the kindest
    months; July and August are punishing. Mobile signal is patchy, so download offline maps first.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) east to Sagarejo and fill the tank there: it is the last
    reliable fuel. Turn south onto the Sh172, the Sagarejo–Udabno–David Gareja road, which crosses open,
    rolling steppe, paved nearly all the way, to Udabno village: about 85 km and 1 hour 45 minutes from
    the capital. From the village, unsigned dirt tracks lead roughly 12 km west to the Mravaltskaro reservoir;
    allow an hour or more. Rent an SUV, because an economy car reaches Udabno but not the hills. After
    rain, leave the dirt sections alone.
ru:
  name: Удабно и Радужные холмы
  short: >-
    Холмы в ржаво-охристых и бледно-зелёных полосах вокруг водохранилища Мравалцкаро, в пустой степи между
    Удабно и Давид-Гареджи.
  body: >-
    **Южнее Сагареджо степь настолько пуста, что название села Удабно, «пустыня», звучит как простое описание.
    А потом земля начинает менять цвет.**


    Между селом Удабно и хребтом Давид-Гареджи голые холмы полосаты, как разрезанный слоёный пирог: ржаво-красный,
    охристый, кремовый, лилово-серый, бледный кислотно-зелёный. Это слои богатых минералами осадочных
    пород, отложенных горизонтально и позднее поднятых и наклонённых медленным столкновением Евразийской
    и Аравийской плит — тем же давлением, которое до сих пор поднимает Кавказ. Дожди размывают склоны,
    поэтому на полосах почти ничего не растёт.


    Самое красивое скопление окружает водохранилище Мравалцкаро, примерно в 15 км к северо-западу от лавры
    Гареджи, на высоте около 510 м. Его вода лежит бирюзовой лентой среди полосатых холмов, и в безветренное
    утро каждый холм виден дважды. Меньшие полосатые склоны тянутся вдоль дороги к самому монастырю.


    Село Удабно стоит на плато Гареджи на высоте 750 м, и по переписи 2024 года в нём чуть больше 700
    жителей. Самый известный его адрес — клуб «Оазис», открытый польской парой, которая хотела вернуть
    работу и жизнь в почти опустевшее селение. Польское кафе посреди кахетинской степи — одно из самых
    неожиданных удовольствий этой дороги.


    Это и приграничная земля. Часть комплекса Давид-Гареджи лежит на до сих пор не демаркированной границе
    с Азербайджаном, спорной с 1991 года, и пограничники здесь — обычная часть пейзажа.


    Приезжайте в первый час после восхода или в последний перед закатом, когда низкий свет обостряет каждую
    полосу. В июльский полдень краски выгорают, и холмы снова тонут в пустыне, чьё имя носит село.
  tip: >-
    Дороги к холмам — оголённая глина: в сухую погоду машина с высоким клиренсом проходит легко, но после
    дождя глина превращается в мыло и не отпускает низкие машины. Если земля блестит — разворачивайтесь.
    Здесь нет ни тени, ни магазина, ни заправки, так что берите воду (три литра на человека летом) и шляпу,
    а из Сагареджо выезжайте с полным баком. Клуб «Оазис» в Удабно — место для обеда и отдыха. В тёплые
    месяцы водятся змеи — носите закрытую обувь. Апрель и май, когда степь ненадолго зеленеет, — самые
    щадящие месяцы; июль и август — беспощадны. Мобильная связь неустойчива, так что скачайте офлайн-карты
    заранее.
  route: >-
    Из Тбилиси по Кахетинскому шоссе (S5) на восток до Сагареджо, и заправьтесь там: это последняя надёжная
    заправка. Поверните на юг на дорогу Sh172 (Сагареджо–Удабно–Давид-Гареджи): почти целиком асфальтированная,
    она пересекает открытую холмистую степь и приводит в село Удабно — около 85 км и 1 час 45 минут от
    столицы. От села немаркированные грунтовые дороги ведут примерно 12 км на запад к водохранилищу Мравалцкаро;
    закладывайте час и больше. Возьмите внедорожник: обычная машина доедет до Удабно, но не до холмов.
    После дождя грунтовые участки лучше не трогать.
fa:
  name: اودابنو و تپه‌های رنگین‌کمانی
  short: >-
    تپه‌هایی به رنگ زنگ‌آهنی، اُخرایی و سبز کم‌رنگ در پیرامون مخزن سد مراوالتسکارو، بر استپ خالی میان
    اودابنو و داوید گارجا.
  body: >-
    **در جنوب ساگارِجو، استپ چنان خالی است که نام روستای اودابنو، یعنی «بیابان»، صرفاً توصیفی ساده به‌نظر
    می‌رسد. اما در ادامه، رنگ زمین تغییر می‌کند.**


    میان روستای اودابنو و رشته‌کوه داوید گارجا، تپه‌های عریان مانند لایه‌های یک کیک ورقه‌شده نواری‌اند:
    سرخِ زنگ‌آهنی، اُخرایی، کِرِم، بنفش‌خاکستری، سبزِ لیمویی کم‌رنگ. اینها لایه‌هایی از سنگ‌های رسوبی
    سرشار از مواد معدنی‌اند که به‌صورت افقی نهشته شده و سپس با برخورد آرام صفحه‌های اوراسیا و عربستان
    بالا آمده و کج شده‌اند؛ همان فشاری که هنوز هم قفقاز را بالا می‌برد. باران دامنه‌ها را می‌شوید، از
    این‌رو بر روی این نوارها تقریباً چیزی نمی‌روید.


    زیباترین خوشه‌ی این تپه‌ها مخزن سد مراوالتسکارو را در برمی‌گیرد، حدود ۱۵ کیلومتری شمال‌غربی صومعه‌ی
    گارجا، در ارتفاع حدود ۵۱۰ متری. آب آن به‌رنگ فیروزه‌ای میان پشته‌های نواری قرار گرفته، و در صبحی بی‌باد
    هر تپه دوبار دیده می‌شود. دامنه‌های نواری کوچک‌تر نیز در کنار راه صومعه کشیده شده‌اند.


    روستای اودابنو بر فلات گارجی در ارتفاع ۷۵۰ متری قرار دارد و بر پایه‌ی سرشماری ۲۰۲۴ کمی بیش از ۷۰۰
    ساکن دارد. شناخته‌شده‌ترین نشانی آن باشگاه اوآسیس است، که زوجی لهستانی آن را گشودند تا کار و زندگی
    را به سکونتگاهی نیمه‌متروک بازگردانند. کافه‌ای لهستانی در دل استپ کاختی یکی از عجیب‌ترین لذت‌های این
    راه است.


    این سرزمین، سرزمین مرزی نیز هست. بخشی از مجموعه‌ی داوید گارجا بر خط هنوز مرزبندی‌نشده با آذربایجان
    قرار دارد، که از سال ۱۹۹۱ محل اختلاف بوده، و پلیس مرزی در اینجا بخشی عادی از منظره است.


    در نخستین ساعت پس از طلوع یا واپسین ساعت پیش از غروب بیایید، وقتی نور کم‌ارتفاع هر نوار را تیزتر می‌کند.
    در نیمروزِ ژوئیه رنگ‌ها می‌پرند، و تپه‌ها دوباره در دل بیابانی فرومی‌روند که نام روستا از آن گرفته
    شده است.
  tip: >-
    مسیرهای رسیدن به تپه‌ها از خاک رس عریان‌اند: در هوای خشک، خودرویی شاسی‌بلند به‌آسانی می‌گذرد، اما
    پس از باران، این خاک رس مانند صابون می‌شود و خودروهای کم‌ارتفاع را می‌بلعد. اگر زمین برق می‌زند، بازگردید.
    در اینجا سایه، مغازه یا پمپ بنزینی نیست، پس آب (سه لیتر برای هر نفر در تابستان) و کلاه همراه ببرید،
    و از ساگارِجو با باک پر حرکت کنید. باشگاه اوآسیس در اودابنو جای مناسبی برای ناهار و استراحت است. در
    ماه‌های گرم مار دیده می‌شود؛ کفش بسته بپوشید. آوریل و مه، وقتی استپ اندکی سبز می‌شود، مهربان‌ترین
    ماه‌هایند؛ ژوئیه و اوت سخت و بی‌رحم‌اند. آنتن موبایل نامنظم است، پس پیش‌تر نقشه‌ی آفلاین دانلود کنید.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق تا ساگارِجو بروید و آنجا باک را پر کنید: این آخرین پمپ بنزین
    مطمئن است. سپس به سمت جنوب بر جاده‌ی Sh172، مسیر ساگارِجو–اودابنو–داوید گارجا، بپیچید که از استپ باز
    و موج‌دار می‌گذرد و تا روستای اودابنو تقریباً همه آسفالته است: نزدیک به ۸۵ کیلومتر و یک ساعت و چهل‌وپنج
    دقیقه از پایتخت. از روستا، جاده‌های خاکی بدون علامت حدود ۱۲ کیلومتر به‌سوی غرب به مخزن سد مراوالتسکارو
    می‌رسند؛ حدود یک ساعت یا بیشتر در نظر بگیرید. خودرویی شاسی‌بلند کرایه کنید، زیرا خودروی معمولی به
    اودابنو می‌رسد اما به تپه‌ها نه. پس از باران، از بخش‌های خاکی صرف‌نظر کنید.
he:
  name: אודבנו וגבעות הקשת
  short: גבעות מפוספסות בחלודה, אוכרה וירוק בהיר סביב מאגר מראבלצקרו, בערבה הריקה שבין אודבנו לדוד גארג'ה.
  body: >-
    **מדרום לסאגארג'ו הערבה ריקה כל-כך שהשם של הכפר, אודבנו, "מדבר", נשמע כתיאור פשוט. ואז הקרקע מתחילה
    להחליף צבע.**


    בין הכפר אודבנו לרכס דוד גארג'ה, גבעות חשופות מפוספסות כעוגת שכבות חתוכה: אדום חלודה, אוכרה, קרם,
    סגול-אפרפר, ירוק חמצי בהיר. אלה שכבות של סלע סדימנטרי עשיר במינרלים, שהורבדו אופקית ולאחר מכן הורמו
    והוטו בהתנגשות האיטית של הלוחות האירואסייתי והערבי — אותו לחץ שממשיך להרים את הקווקז עד היום. הגשם
    שוחק את המדרונות, כך שכמעט שום דבר לא צומח על הפסים.


    האשכול היפה ביותר מקיף את מאגר מראבלצקרו, כ-15 ק"מ צפון-מערבית ללברה של גארג'ה, בגובה של כ-510 מטר.
    מימיו בצבע טורקיז שוכבים בין התלוליות המפוספסות, ובבוקר נטול רוח כל גבעה נראית פעמיים. מדרונות מפוספסים
    קטנים יותר משתרעים לאורך הדרך למנזר עצמו.


    הכפר אודבנו שוכן על רמת גארג'י בגובה 750 מטר ומנה, לפי מפקד 2024, מעט יותר מ-700 תושבים. הכתובת המוכרת
    ביותר בו היא מועדון האואזיס, שנפתח בידי זוג פולני שרצה להחזיר עבודה וחיים לישוב שהיה נטוש ברובו. בית
    קפה פולני בערבה הקאחתית הוא אחת ההנאות המשונות ביותר של הדרך הזאת.


    זהו גם אזור גבול. חלק ממתחם דוד גארג'ה שוכן על הקו שטרם סומן עם אזרבייג'ן, השנוי במחלוקת מאז 1991,
    ומשמר הגבול הוא חלק שגרתי מהנוף.


    בואו בשעה הראשונה שאחרי הזריחה או בשעה האחרונה שלפני השקיעה, כשאור נמוך משחיז כל פס. בשעת הצהריים
    ביולי הצבעים דוהים, והגבעות שוקעות חזרה במדבר שממנו נשאל שם הכפר.
  tip: >-
    השבילים לגבעות הם חרסית חשופה: במזג אוויר יבש, רכב עם גחון גבוה מתגבר בקלות, אך לאחר גשם החרסית הופכת
    לסבון ובולעת רכבים נמוכים. אם הקרקע נוצצת — חזרו על עקבותיכם. אין כאן צל, חנות או תחנת דלק, כך שיש
    להביא מים (שלושה ליטר לאדם בקיץ) וכובע, ולצאת מסאגארג'ו עם מיכל מלא. מועדון האואזיס באודבנו הוא המקום
    לצהריים ולמנוחה. נחשים נמצאים בסביבה בחודשים החמים; יש לנעול נעליים סגורות. אפריל ומאי, כשהערבה מוריקה
    לזמן קצר, הם החודשים הנעימים ביותר; יולי ואוגוסט אכזריים. הקליטה הסלולרית לסירוגין, כך שכדאי להוריד
    מפות אופליין מראש.
  route: >-
    מטביליסי סעו בכביש קאחתי (S5) מזרחה לסאגארג'ו ותדלקו שם: זו תחנת הדלק האחרונה שאפשר לסמוך עליה. פנו
    דרומה לכביש Sh172, כביש סאגארג'ו–אודבנו–דוד גארג'ה, החוצה ערבה גלית ופתוחה, סלולה כמעט כל הדרך, עד
    לכפר אודבנו: כ-85 ק"מ ושעה ו-45 דקות מהבירה. מהכפר, שבילי עפר לא מסומנים מובילים כ-12 ק"מ מערבה למאגר
    מראבלצקרו; יש להקציב שעה או יותר. השכירו רכב שטח, כי רכב רגיל מגיע לאודבנו אך לא לגבעות. לאחר גשם,
    הימנעו מקטעי העפר.
ar:
  name: أودابنو وتلال قوس قزح
  short: تلال مخطّطة بالصدإ والأُخرة والأخضر الفاتح حول خزان مرافالتسكارو، في السهب الخالي بين أودابنو
    وداود غارجا.
  body: >-
    **جنوب ساغاريجو، يبلغ السهب من الخلاء حدًّا يجعل اسم قرية أودابنو، "الصحراء"، يبدو وصفًا بسيطًا لا
    أكثر. ثم تبدأ الأرض بتغيير لونها.**


    بين قرية أودابنو وسلسلة داود غارجا، تنتصب تلال عارية مخطّطة كطبقات كعكة مقطوعة: أحمر صدئي، أُخرة،
    كريمي، رمادي-بنفسجي، أخضر فاتح حامضي. هذه طبقات من صخور رسوبية غنية بالمعادن، ترسّبت أفقيًا ثم رفعها
    وأمالها الاصطدامُ البطيء بين الصفيحتين الأوراسية والعربية، وهو نفسه الضغط الذي ما يزال يرفع جبال القوقاز
    إلى اليوم. يجرف المطر المنحدرات، فلا ينبت على الخطوط شيء تقريبًا.


    وتحيط أجمل هذه التلال بخزان مرافالتسكارو، على نحو 15 كم شمال غرب دير غارجا، عند ارتفاع نحو 510 أمتار.
    تستلقي مياهها الفيروزية بين التلال المخطّطة، وفي صباح هادئ الريح تبدو كل تلة مرتين. كما تحفّ منحدرات
    مخطّطة أصغر الطريق المؤدي إلى الدير نفسه.


    تقع قرية أودابنو على هضبة غارجي عند ارتفاع 750 مترًا، وضمّت بحسب تعداد 2024 ما يزيد قليلًا على 700
    نسمة. وأشهر عنوان فيها هو نادي "الواحة"، الذي افتتحه زوجان بولنديان أرادا إعادة العمل والحياة إلى
    قرية كانت شبه مهجورة. ومقهى يديره بولنديون وسط سهب كاختي من أغرب متع هذا الطريق.


    وهذه أيضًا أرض حدودية: يقع جزء من مجمع داود غارجا على الخط الذي لم يُرسَّم بعد مع أذربيجان، والمتنازع
    عليه منذ عام 1991، وشرطة الحدود جزء عادي من المشهد هنا.


    تعال في الساعة الأولى بعد شروق الشمس أو الساعة الأخيرة قبل غروبها، حين يشحذ الضوء المنخفض كل خط. وعند
    ظهيرة يوليو تبهت الألوان، وتغرق التلال من جديد في الصحراء التي تحمل القرية اسمها.
  tip: >-
    مسارات الوصول إلى التلال طينٌ عارٍ: في الجو الجاف تتجاوزها سيارة ذات ارتفاع أرضي عالٍ بسهولة، لكن
    بعد المطر يتحول الطين إلى صابون يبتلع السيارات المنخفضة. إن لمعت الأرض، فعُد من حيث أتيت. لا ظل هنا
    ولا متجر ولا محطة وقود، فاحمل الماء (ثلاثة لترات للشخص في الصيف) وقبعة، واخرج من ساغاريجو بخزان ممتلئ.
    نادي الواحة في أودابنو هو المكان المناسب للغداء والراحة. تنشط الثعابين في الأشهر الحارة؛ ارتدِ حذاءً
    مغلقًا. أبريل ومايو، حين يخضرّ السهب لفترة قصيرة، ألطف الأشهر؛ يوليو وأغسطس قاسيان. تغطية الهاتف متقطعة،
    فنزّل مسبقًا خرائط تعمل دون اتصال.
  route: >-
    من تبليسي، سِر على طريق كاختي السريع (S5) شرقًا حتى ساغاريجو، وعبّئ الوقود هناك: فهي آخر محطة موثوقة.
    ثم انحرف جنوبًا إلى طريق Sh172، طريق ساغاريجو–أودابنو–داود غارجا، الذي يعبر سهبًا مفتوحًا ومتموّجًا،
    معبّدًا تقريبًا بأكمله، حتى قرية أودابنو: نحو 85 كم وساعة و45 دقيقة من العاصمة. ومن القرية، تمتد مسارات
    ترابية غير موسومة نحو 12 كم غربًا إلى خزان مرافالتسكارو؛ احسب ساعة أو أكثر. استأجر سيارة دفع رباعي،
    فالسيارة الاقتصادية تصل إلى أودابنو لكن لا تصل إلى التلال. وبعد المطر، تجنّب المقاطع الترابية كليًا.
