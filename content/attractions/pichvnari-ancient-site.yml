ka:
  name: ფიჭვნარის ნაქალაქარი
  short: >-
    კოლხური ნასახლარი და კოლხურ-ბერძნული სამაროვანი ჩოლოქის შესართავთან: დღეს — ღია ველი, აღმოჩენილი ნივთები
    კი ბათუმის მუზეუმშია.
  body: >-
    **ფიჭვნარში ღია მიწას უყურებთ და დანარჩენი თავად უნდა წარმოიდგინოთ: ამ ზღვისპირა ბალახის ქვეშ კოლხები
    და ბერძნები გვერდიგვერდ იყვნენ დაკრძალულნი.**


    ძეგლი იქ მდებარეობს, სადაც შავ ზღვასთან ახლოს ჩოლოქი და ოჩხამური ერთმანეთს ერთვის, ქობულეთიდან დაახლოებით
    10 კილომეტრით ჩრდილოეთით. აქ ძველი კოლხეთის დროს ცხოვრობდნენ; რა ერქვა მაშინ დასახლებას, უცნობია —
    ფიჭვნარი ადგილის დღევანდელი სახელია. სამაროვანში როგორც ადგილობრივი კოლხები, ისე ბერძენი ახალმოსახლეები
    განისვენებდნენ — იშვიათი მოწმობა იმისა, როგორ ცხოვრობდა ეს ორი სამყარო ერთად ამ სანაპიროზე. ძვ. წ.
    V საუკუნის სამარხებიდან შავი ზღვის სანაპირო ქალაქებში მოჭრილი ვერცხლის მონეტები ამოვიდა, ირანული სურმის
    ჭურჭელი კი იმაზე მიანიშნებს, რა შორს აღწევდა ვაჭრობა. სანაპიროს გაყოლებით ჩრდილოეთით ცალკე ძეგლია
    — ფიჩორი, ბრინჯაოს ხანის მრავალფენიანი ნასახლარი.


    1998 წელს გათხრები განახლდა ბრიტანულ-ქართული ფიჭვნარის ექსპედიციის სახით — ბათუმის არქეოლოგიური მუზეუმის,
    ნ. ბერძენიშვილის სახელობის ბათუმის სამეცნიერო-კვლევითი ინსტიტუტისა და ოქსფორდის აშმოლის მუზეუმის ერთობლივი
    პროექტი.


    იცოდეთ, რას ხვდებით: აქ არც ვიზიტორთა ცენტრია, არც მანიშნებლები და არც ექსპოზიცია. ნივთები ბათუმშია.
    ფიჭვნარი მხოლოდ თავად მიწას გთავაზობთ — დაბალს, მწვანეს და ნესტიანს, ზღვაში ჩამდინარე მდინარეებს და
    იმის ცოდნას, რომ ოდესღაც ამ ნაპირზე ბერძენმა ახალმოსახლეებმა ცხოვრება გაიჩინეს.
  tip: >-
    ფიჭვნარი ზღვისპირა გზაზე ხანმოკლე გაჩერებად მიიჩნიეთ და არა დანიშნულების ადგილად: ნახევარი საათიც
    ბევრია, ადგილზე არც საყიდელი რამეა, არც საკითხავი და არც დასათვალიერებელი. აღმოჩენილი ნივთები ბათუმის
    არქეოლოგიურ მუზეუმში ნახეთ — ჩამოსვლამდე ან შემდეგ. მდინარის შესართავთან მიწა დაბალი და ხშირად სველია,
    ამიტომ სანდლები კი არა, ჩექმები ჩაიცვით, ზაფხულში კი მწერების საწინააღმდეგო საშუალებაც წაიღეთ. თუ
    არქეოლოგები მუშაობენ, მოშორებით იდექით, სანამ თავად არ მოგიწვევენ, და მიწიდან არაფერი აიღოთ. საუკეთესო
    სეზონი მაისიდან ოქტომბრამდეა. ქობულეთში, სამხრეთით დაახლოებით 10 კილომეტრზე, კაფეებიც არის, საპირფარეშოც
    და საწვავიც.
  route: >-
    თბილისიდან დაახლოებით 330 კილომეტრი და ხუთი საათია. ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე
    იარეთ, შემდეგ ს12-ით ლანჩხუთის გავლით ზღვისპირა გრიგოლეთამდე. იქიდან ძველ სანაპირო გზას, შ130-ს, გაჰყევით
    შეკვეთილის გავლით ქობულეთისკენ, ჩოლოქის შესართავამდე, ქობულეთამდე დაახლოებით 10 კილომეტრით ადრე. თითქმის
    მთელი გზა ასფალტია; ბოლო მონაკვეთი ღია, უსწორმასწორო ადგილზე გამავალი ადგილობრივი გრუნტის გზებია,
    მანიშნებლებისა და მოწყობილი სადგომის გარეშე, ამიტომ კოორდინატებით იარეთ და მანქანა მყარ ნიადაგზე გააჩერეთ.
    მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის. საწვავი და საჭმელი ქობულეთშია.
en:
  name: Pichvnari Ancient Site
  short: >-
    A Colchian settlement and Greek-Colchian necropolis where the Choloki meets the sea: open ground today,
    its finds kept in Batumi's museum.
  body: >-
    **At Pichvnari you look at open ground and supply the rest yourself: beneath this coastal grass, Colchians
    and Greeks were buried side by side.**


    The site lies where the Choloki and Ochkhamuri rivers meet near the Black Sea, about 10 km north of
    Kobuleti. People lived here in the days of ancient Colchis; what they called their settlement is unknown,
    and Pichvnari is simply the modern name of the place. Its necropolis held both local Colchians and
    Greek settlers, a rare record of the two worlds living alongside each other on this coast. Silver
    coins struck in Black Sea coastal cities came out of graves of the fifth century BC, and an Iranian
    kohl tube hints at how far trade could reach. Further north along the coast lies Pichori, a separate
    Bronze Age settlement with several layers.


    In 1998 excavation resumed as the British-Georgian Pichvnari Expedition, a joint project of the Batumi
    Archaeological Museum, the N. Berdzenishvili Batumi Research Institute and the Ashmolean Museum in
    Oxford.


    Know what you are coming to: there is no visitor centre, no signage and nothing on display. The objects
    are in Batumi. What Pichvnari offers is the ground itself, low, green and damp, the rivers slipping
    into the sea, and the knowledge that Greek settlers once made a life on this shore.
  tip: >-
    Treat Pichvnari as a short stop on the coast road, not a destination: half an hour is plenty, and
    there is nothing to buy, read or visit on site. See the finds at the Batumi Archaeological Museum,
    before or after. The ground by the river mouth is low and often wet, so wear boots rather than sandals,
    and bring insect repellent in summer. If an excavation team is at work, keep your distance unless
    invited, and never pick anything up from the soil. May to October is the sensible season. Kobuleti,
    about 10 km south, has cafés, toilets and fuel.
  route: >-
    Roughly 330 km and five hours from Tbilisi. Take the S1 (E60) past Kutaisi to Samtredia, then the
    S12 through Lanchkhuti to Grigoleti on the coast. From there follow the older coastal road, the Sh130
    through Shekvetili towards Kobuleti, to the mouth of the Choloki, about 10 km short of Kobuleti. Asphalt
    carries you almost all the way; the last stretch is local tracks over open, uneven ground with no
    signs and no formal parking, so navigate by coordinates and park where the surface is firm. An economy
    car copes in dry weather. Fuel and food in Kobuleti.
ru:
  name: Древнее поселение Пичвнари
  short: >-
    Колхидское поселение и греко-колхидский некрополь там, где Чолоки встречается с морем: сегодня — открытое
    поле, а находки хранятся в музее Батуми.
  body: >-
    **В Пичвнари вы смотрите на открытое поле, а остальное дорисовываете сами: под этой приморской травой
    бок о бок хоронили колхов и греков.**


    Памятник лежит у слияния рек Чолоки и Очхамури близ Чёрного моря, примерно в 10 км к северу от Кобулети.
    Люди жили здесь во времена древней Колхиды; как они называли своё поселение, неизвестно, а Пичвнари
    — лишь современное название местности. В некрополе погребены и местные колхи, и греческие поселенцы
    — редкое свидетельство того, как два мира жили бок о бок на этом побережье. Из погребений V века до
    н. э. извлекли серебряные монеты, отчеканенные в городах черноморского побережья, а иранский флакон
    для сурьмы намекает, как далеко могла простираться торговля. Севернее по побережью лежит Пичори —
    отдельное многослойное поселение бронзового века.


    В 1998 году раскопки возобновила Британско-грузинская Пичвнарская экспедиция — совместный проект Батумского
    археологического музея, Батумского научно-исследовательского института имени Н. Бердзенишвили и Музея
    Эшмола в Оксфорде.


    Знайте, куда едете: здесь нет ни визит-центра, ни указателей, ни экспозиции. Находки — в Батуми. Пичвнари
    предлагает саму землю — низкую, зелёную и сырую, реки, неслышно уходящие в море, и знание о том, что
    когда-то на этом берегу обживались греческие поселенцы.
  tip: >-
    Считайте Пичвнари короткой остановкой на прибрежной дороге, а не целью поездки: получаса более чем
    достаточно, и на месте нечего купить, прочитать или посетить. Находки смотрите в Батумском археологическом
    музее — до или после. Земля у устья реки низкая и часто мокрая, поэтому надевайте ботинки, а не сандалии,
    а летом возьмите средство от насекомых. Если работает экспедиция, держитесь на расстоянии, пока вас
    не пригласят, и никогда ничего не поднимайте с земли. Разумный сезон — с мая по октябрь. В Кобулети,
    примерно в 10 км к югу, есть кафе, туалеты и заправки.
  route: >-
    Примерно 330 км и пять часов от Тбилиси. Езжайте по S1 (E60) мимо Кутаиси до Самтредиа, затем по S12
    через Ланчхути до Григолети на побережье. Оттуда по старой прибрежной дороге Sh130 через Шекветили
    в сторону Кобулети — до устья Чолоки, примерно за 10 км до Кобулети. Почти весь путь по асфальту;
    последний отрезок — местные колеи по открытой неровной земле без указателей и оборудованной парковки,
    так что ориентируйтесь по координатам и паркуйтесь там, где грунт твёрдый. В сухую погоду справится
    и автомобиль эконом-класса. Топливо и еда — в Кобулети.
fa:
  name: محوطهٔ باستانی پیچوناری
  short: >-
    سکونتگاهی کلخیسی و گورستانی یونانی-کلخیسی در جایی که چولوکی به دریا می‌رسد: امروز زمینی باز، و یافته‌هایش
    در موزهٔ باتومی.
  body: >-
    **در پیچوناری به زمینی باز می‌نگرید و باقی را خودتان در خیال می‌سازید: زیر این علف‌های ساحلی، کلخیسی‌ها
    و یونانیان در کنار هم به خاک سپرده شدند.**


    این محوطه در جایی قرار دارد که رودهای چولوکی و اوچخاموری نزدیک دریای سیاه به هم می‌رسند، حدود ۱۰ کیلومتر
    شمال کوبولتی. مردم در روزگار کلخیس باستان اینجا می‌زیستند؛ اینکه سکونتگاه خود را چه می‌نامیدند معلوم
    نیست و پیچوناری تنها نام امروزی این مکان است. در گورستان آن هم کلخیسی‌های بومی به خاک سپرده شده‌اند
    و هم مهاجران یونانی — سندی کمیاب از زندگی دو جهان در کنار یکدیگر بر این کرانه. از گورهای سدهٔ پنجم
    پیش از میلاد سکه‌های نقره‌ای ضرب‌شده در شهرهای ساحلی دریای سیاه بیرون آمده و یک سرمه‌دان ایرانی نشان
    می‌دهد که بازرگانی تا کجاها می‌توانست دامن بگستراند. در شمال، در امتداد ساحل، پیچوری قرار دارد، سکونتگاهی
    جداگانه و چندلایه از عصر مفرغ.


    در سال ۱۹۹۸ کاوش در اینجا با هیئت باستان‌شناسی بریتانیایی-گرجی پیچوناری از سر گرفته شد؛ طرحی مشترک
    میان موزهٔ باستان‌شناسی باتومی، مؤسسهٔ پژوهشی باتومی به نام ن. بردزنیشویلی و موزهٔ اشمولین آکسفورد.


    بدانید به کجا می‌آیید: نه مرکز بازدیدکنندگان هست، نه تابلو و نه چیزی به نمایش گذاشته شده. اشیا در
    باتومی‌اند. آنچه پیچوناری عرضه می‌کند خود زمین است — پست، سبز و نمناک — رودهایی که آرام به دریا می‌لغزند،
    و این دانستن که روزگاری مهاجران یونانی بر این کرانه زندگی ساختند.
  tip: >-
    پیچوناری را توقفی کوتاه در جادهٔ ساحلی بدانید، نه مقصد: نیم ساعت کاملاً بس است و در محل چیزی برای
    خریدن، خواندن یا بازدید نیست. یافته‌ها را پیش یا پس از آن در موزهٔ باستان‌شناسی باتومی ببینید. زمینِ
    کنار دهانهٔ رود پست و اغلب خیس است، پس به‌جای صندل کفش ساق‌دار بپوشید و در تابستان دافع حشرات همراه
    داشته باشید. اگر گروه کاوش سرگرم کار است، فاصله‌تان را نگه دارید مگر آنکه دعوتتان کنند، و هرگز چیزی
    از خاک برندارید. فصل معقول از ماه مه تا اکتبر است. کوبولتی، حدود ۱۰ کیلومتر جنوب‌تر، کافه، سرویس بهداشتی
    و پمپ‌بنزین دارد.
  route: >-
    از تفلیس تقریباً ۳۳۰ کیلومتر و پنج ساعت راه است. از راه S1 (E60) از کنار کوتایسی تا سامتردیا بروید،
    سپس از S12 و از راه لانچخوتی تا گریگولتی بر کرانهٔ دریا. از آنجا جادهٔ ساحلی قدیمی‌تر، Sh130، را از
    راه شکوتیلی به سوی کوبولتی دنبال کنید تا به دهانهٔ چولوکی برسید، حدود ۱۰ کیلومتر پیش از کوبولتی. تقریباً
    تمام راه آسفالت است؛ آخرین بخش، راه‌های محلی بر زمینی باز و ناهموار است، بی‌تابلو و بی‌پارکینگ رسمی،
    پس با مختصات جغرافیایی مسیریابی کنید و جایی پارک کنید که زمین سفت باشد. در هوای خشک خودروی اقتصادی
    از پسش برمی‌آید. سوخت و غذا در کوبولتی.
he:
  name: האתר העתיק פיצ'בנרי
  short: >-
    יישוב קולכי ובית קברות יווני-קולכי במקום שבו הצ'ולוקי פוגש את הים: היום שטח פתוח, והממצאים שמורים
    במוזיאון בבטומי.
  body: >-
    **בפיצ'בנרי אתם מביטים בשטח פתוח ומשלימים את השאר בעצמכם: מתחת לעשב החוף הזה נקברו קולכים ויוונים
    זה לצד זה.**


    האתר שוכן במפגש הנהרות צ'ולוקי ואוצ'חמורי, סמוך לים השחור, כ-10 ק"מ צפונית לקובולטי. אנשים חיו כאן
    בימי קולכיס העתיקה; איך קראו ליישובם אין אנו יודעים, ופיצ'בנרי הוא פשוט השם המודרני של המקום. בבית
    הקברות שלו נקברו גם קולכים מקומיים וגם מתיישבים יוונים — תיעוד נדיר של שני עולמות שחיו זה לצד זה על
    החוף הזה. מקברים מהמאה החמישית לפני הספירה עלו מטבעות כסף שנטבעו בערי החוף של הים השחור, ושפופרת כחל
    איראנית רומזת עד כמה רחוק יכול היה המסחר להגיע. צפונה משם לאורך החוף שוכן פיצ'ורי, יישוב נפרד מתקופת
    הברונזה ובו כמה שכבות.


    ב-1998 חודשו כאן החפירות במסגרת משלחת פיצ'בנרי הבריטית-גאורגית, מיזם משותף של המוזיאון הארכאולוגי
    של בטומי, מכון המחקר של בטומי על שם נ. ברדזנישווילי ומוזיאון אשמוליאן באוקספורד.


    דעו לקראת מה אתם באים: אין מרכז מבקרים, אין שילוט ואין שום דבר מוצג. הממצאים נמצאים בבטומי. מה שפיצ'בנרי
    מציע הוא האדמה עצמה, נמוכה, ירוקה ולחה, הנהרות הגולשים אל הים, והידיעה שמתיישבים יוונים בנו פעם את
    חייהם על החוף הזה.
  tip: >-
    ראו בפיצ'בנרי עצירה קצרה בדרך החוף ולא יעד בפני עצמו: חצי שעה מספיקה בהחלט, ואין במקום מה לקנות, לקרוא
    או לבקר. את הממצאים ראו במוזיאון הארכאולוגי של בטומי, לפני הביקור או אחריו. הקרקע ליד שפך הנהר נמוכה
    ולעיתים קרובות רטובה, לכן נעלו נעליים גבוהות ולא סנדלים, והביאו דוחה חרקים בקיץ. אם צוות חפירה עובד
    במקום, שמרו מרחק אלא אם הוזמנתם, ולעולם אל תרימו דבר מהאדמה. העונה ההגיונית היא מאי עד אוקטובר. בקובולטי,
    כ-10 ק"מ דרומה, יש בתי קפה, שירותים ודלק.
  route: >-
    כ-330 ק"מ וחמש שעות מטביליסי. סעו בכביש S1 (E60) על פני קותאיסי עד סמטרדיה, ומשם בכביש S12 דרך לנצ'חוטי
    עד גריגולטי שעל החוף. משם המשיכו בדרך החוף הוותיקה יותר, כביש Sh130, דרך שקווטילי לכיוון קובולטי,
    עד שפך הצ'ולוקי, כ-10 ק"מ לפני קובולטי. אספלט מלווה אתכם כמעט כל הדרך; הקטע האחרון הוא שבילים מקומיים
    על קרקע פתוחה ולא אחידה, בלי שלטים ובלי חניה מסודרת, לכן נווטו לפי קואורדינטות וחנו היכן שהקרקע יציבה.
    במזג אוויר יבש רכב אקונומי יסתדר. דלק ואוכל בקובולטי.
ar:
  name: موقع بيتشفناري الأثري
  short: >-
    مستوطنة كولخية ومقبرة يونانية-كولخية حيث يلتقي نهر تشولوكي بالبحر: أرض مكشوفة اليوم، ولقاها محفوظة
    في متحف باتومي.
  body: >-
    **في بيتشفناري تنظر إلى أرض مكشوفة وتكمل الباقي بخيالك: تحت هذا العشب الساحلي دُفن الكولخيون واليونانيون
    جنبًا إلى جنب.**


    يقع الموقع حيث يلتقي نهرا تشولوكي وأوتشخاموري قرب البحر الأسود، على بعد نحو 10 كم شمال كوبوليتي. عاش
    الناس هنا في أيام كولخيس القديمة؛ ولا يُعرف بأي اسم كانوا يسمّون مستوطنتهم، وما بيتشفناري إلا الاسم
    الحديث للمكان. وضمّت مقبرته الكولخيين المحليين والمستوطنين اليونانيين معًا، في سجلّ نادر لعالمين عاشا
    جنبًا إلى جنب على هذا الساحل. ومن قبور القرن الخامس قبل الميلاد خرجت عملات فضية سُكّت في مدن ساحل
    البحر الأسود، فيما تلمّح مكحلة إيرانية إلى المدى الذي كانت التجارة تبلغه. وإلى الشمال على الساحل تقع
    بيتشوري، وهي مستوطنة مستقلة متعددة الطبقات من العصر البرونزي.


    وفي عام 1998 استُؤنف التنقيب هنا مع البعثة البريطانية الجورجية في بيتشفناري، وهي مشروع مشترك بين متحف
    باتومي الأثري، ومعهد باتومي للأبحاث الذي يحمل اسم ن. بيردزينيشفيلي، ومتحف أشموليان في أكسفورد.


    اعرف ما الذي ينتظرك: لا مركز للزوار هنا، ولا لافتات، ولا شيء معروض. اللقى في باتومي. ما تقدّمه بيتشفناري
    هو الأرض نفسها، منخفضة وخضراء ورطبة، والأنهار تنساب إلى البحر، والعلم بأن مستوطنين يونانيين بنوا حياتهم
    ذات يوم على هذا الشاطئ.
  tip: >-
    اعتبر بيتشفناري وقفة قصيرة على الطريق الساحلي لا وجهة بحد ذاتها: نصف ساعة تكفي وتزيد، ولا شيء في الموقع
    يُشترى أو يُقرأ أو يُزار. شاهد اللقى في متحف باتومي الأثري، قبل الزيارة أو بعدها. الأرض عند مصب النهر
    منخفضة ورطبة في أغلب الأحيان، فانتعل حذاءً عالي الساق لا صندلًا، واحمل طاردًا للحشرات صيفًا. إن كان
    فريق تنقيب يعمل، فالزم مسافة ما لم تُدعَ، ولا تلتقط أي شيء من التربة أبدًا. الموسم المعقول من مايو
    إلى أكتوبر. وفي كوبوليتي، على بعد نحو 10 كم جنوبًا، مقاهٍ ودورات مياه ووقود.
  route: >-
    نحو 330 كم وخمس ساعات من تبليسي. اسلك الطريق S1 (E60) متجاوزًا كوتايسي حتى سامتريديا، ثم الطريق S12
    عبر لانتشخوتي إلى غريغوليتي على الساحل. ومن هناك اتبع الطريق الساحلي الأقدم Sh130 عبر شيكفيتيلي نحو
    كوبوليتي حتى مصب تشولوكي، قبل كوبوليتي بنحو 10 كم. يحملك الإسفلت طوال الطريق تقريبًا؛ أما المقطع الأخير
    فدروب محلية على أرض مكشوفة غير مستوية، بلا لافتات ولا موقف رسمي، فاعتمد على الإحداثيات واركن حيث تكون
    الأرض صلبة. تتدبّر السيارة الاقتصادية أمرها في الطقس الجاف. الوقود والطعام في كوبوليتي.
