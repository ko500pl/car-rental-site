ka:
  name: ნუცუბიძის ხიდები (პლატო 1)
  short: >-
    სამოცდაათიანი წლების თბილისური საცხოვრებელი, სადაც ქუჩას ლიფტები და ცაში გადებული ხიდები ცვლის — საბჭოთა
    უტოპიად ჩაფიქრებული და დღესაც ცოცხალი სახლი.
  body: >-
    **ნუცუბიძის ხიდები ჰაერში გაკიდებული ქუჩაა: თბილისის ფერდობზე სამი ბეტონის კოშკი, მიწიდან მაღლა ფოლადის
    გადასასვლელებით ერთმანეთზე გადაბმული.**


    კომპლექსი 1974–1976 წლებში აშენდა ნუცუბიძის პლატოზე; მისი ავტორები არიან არქიტექტორები ოთარ (ტონი)
    კალანდარიშვილი და გიზო ფოცხიშვილი. ასეთ ციცაბო ფერდზე ხიდები ქუჩის ფუნქციას ასრულებს: ორი საჯარო ლიფტი
    ხალხს მაღლა აჰყავს, კორპუსებს კი მე-14, მე-12 და მე-10 სართულების დონეზე გადებული გადასასვლელები აკავშირებს.
    თავის დროზე ეს თამამ საინჟინრო გადაწყვეტად ითვლებოდა — ამბობენ, მის სანახავად თბილისში იაპონელ ინჟინერთა
    ჯგუფიც ჩამოვიდა. ჩანაფიქრი გაცილებით დიდი იყო: მთელი ფერდობი მაღლივი კოშკების ქალაქად უნდა ქცეულიყო,
    მაგრამ, როგორც ამბობენ, სახსრები არ ეყო და გეგმის დიდი ნაწილი ქაღალდზე დარჩა.


    ახლოდან ბეტონი მოულოდნელად სენტიმენტალური აღმოჩნდება: ჯვრისა და სათოფურის ფორმის ამონაჭრები, ნალისებრი
    ფანჯრები, ქვედა კორპუსზე წითელი ხის მოპირკეთება — დეტალები, რომლებიც, ამბობენ, ძველი თბილისის ხის
    აივნებს ეხმიანება. კომპლექსს თავიდან „შატილი“ ერქვა, და ბევრი ფიქრობს, რომ სახელი ხევსურეთის იმ სოფელზე
    მიანიშნებს, სადაც შუა საუკუნეების ციხე-სახლები ერთმანეთს ეკვრის და ერთ მთლიან ციხე-სოფლად ერწყმის.


    ეს მუზეუმი არ არის. პატარა ბინები, თავდაპირველად ქარხნების მუშებსა და უნივერსიტეტის თანამშრომლებზე
    განაწილებული, დღესაც საცხოვრებელია და აქაურთა ბევრს მთელი ცხოვრება აქ გაუტარებია. 2024 წლის ბოლოს
    რამდენიმეთვიანი დახურვის შემდეგ, 2025 წელს საჯარო გადასასვლელები ახალი მოპირკეთებით, გაგრძელებული
    მოაჯირებითა და პანდუსით გაიხსნა; თავად კორპუსები ისე დატოვეს, როგორც იყო.


    დადექით ყველაზე მაღალ ხიდზე და ქვემოთ დაიხედეთ. ამ ფერდობისთვის ჩაფიქრებული უტოპია არასოდეს დასრულებულა,
    მაგრამ მისი აშენებული ნაწილი უკვე ნახევარი საუკუნეა, დღითიდღე ცოცხლობს.
  tip: >-
    ხიდებზე გავლა უფასოა, ლიფტი კი, ბოლო ცნობით, 20 თეთრი ღირდა თითო მიმართულებით და მხოლოდ 20-თეთრიან
    მონეტებს იღებდა — რამდენიმე წინასწარ მოიმარაგეთ, თუმცა ადგილზე გადაამოწმეთ: 2024–25 წლების რემონტის
    შემდეგ წესი შესაძლოა შეცვლილი იყოს. გახსოვდეთ, რომ ეს ხალხის სახლია: ხმამაღლა ნუ ილაპარაკებთ, მაცხოვრებლებს
    ნებართვის გარეშე ნუ გადაუღებთ და საჯარო გადასასვლელებს ნუ გადაცდებით — სადარბაზოებსა და დერეფნებში
    შესვლა არ შეიძლება. მეზობლებთან მისალმება ბევრ კარს გაგიღებთ. ჩაიცვით დახურული ფეხსაცმელი, ფეხქვეშ
    ხშირად ნამსხვრევები ყრია. ადგილზე არც საპირფარეშოა, არც კაფე. ნახევარი საათი საკმარისია.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 11 კმ-ია ქალაქის ასფალტიან ქუჩებზე, ვაკის გავლით — საცობის გათვალისწინებით,
    20 წუთამდე. მისამართია შალვა ნუცუბიძის ქუჩა 213, ნუცუბიძის პლატოზე. ეკონომ კლასის მანქანა სავსებით
    საკმარისია, მაგრამ პლატოს ვიწრო საცხოვრებელ ქუჩებზე პარკირება ძნელი და არაოფიციალურია — ნურასოდეს
    გადაკეტავთ ეზოებსა და სადარბაზოების შესასვლელებს. ხშირად მანქანის დატოვება აჯობებს: მეტროსადგური „სახელმწიფო
    უნივერსიტეტი“ 450 მეტრშია, დაახლოებით ექვსი წუთის სავალზე, 326-ე და 347-ე ავტობუსები კი პირდაპირ კომპლექსთან
    ჩერდება. საწვავზე ფიქრი არ გჭირდებათ — ქალაქიდან არსად გადიხართ.
en:
  name: Nutsubidze Skybridge (Plato 1)
  short: >-
    A 1970s Tbilisi housing estate where lifts and footbridges in the sky do the work of streets — planned
    as a Soviet utopia, still lived in every day.
  body: >-
    **The Nutsubidze skybridge is a street hung in mid-air: three concrete towers on a Tbilisi hillside,
    stitched together by steel walkways high above the ground.**


    The complex went up between 1974 and 1976 on the Nutsubidze plateau, designed by the architects Otar
    "Toni" Kalandarishvili and Gizo Potskhishvili. On a slope this steep, the bridges do the work of streets:
    two public lifts carry people up, and walkways link the blocks at the 14th, 12th and 10th floors.
    It was admired as bold engineering in its day — a team of Japanese engineers is said to have travelled
    to Tbilisi to see it — and it was meant as the first piece of a whole hillside city of towers, most
    of which, reportedly for lack of money, was never built.


    Look closer and the concrete turns out to be sentimental. Cut-outs shaped like crosses and arrow slits,
    horseshoe-shaped windows, mahogany cladding on the lower building: details said to echo the carved
    wooden balconies of Old Tbilisi. The complex was originally known as "Shatili", and many suspect a
    nod to the highland village of that name, where medieval tower-houses huddle together into a single
    fortress.


    This is not a museum. The small flats, first allotted to factory workers and university staff, are
    still homes, and many residents have lived here all their lives. After a few months' closure in late
    2024 the public walkways reopened in 2025 with new paving, longer railings and a ramp; the towers
    themselves were left as they were.


    Stand on the highest bridge and look down. The utopia planned for this hillside was never finished
    — but the part that was built has been lived in, every single day, for half a century.
  tip: >-
    Walking the bridges is free; the lift, when last reported, cost 20 tetri each way and took only 20-tetri
    coins, so carry a few, but check on arrival, as the 2024–25 renovation may have changed the system.
    Remember these are people's homes: keep your voice down, do not photograph residents without asking,
    and stay on the public walkways — no wandering into stairwells or corridors. A hello to the neighbours
    goes a long way. Wear closed shoes, as there is often debris underfoot. There are no toilets or cafés
    on site. Half an hour is enough.
  route: >-
    From Freedom Square it is about 11 km on paved city streets, up through Vake — allow 20 minutes with
    traffic. The address is 213 Shalva Nutsubidze Street, on the Nutsubidze plateau. An economy car is
    all you need, but parking on the plateau's narrow residential streets is tight and informal; never
    block courtyards or entrances. Often it is easier to leave the car behind: State University metro
    station is 450 metres away, about a six-minute walk, and city buses 326 and 347 stop right outside.
    Fuel is no concern — you never leave the city.
ru:
  name: Воздушный мост Нуцубидзе (Плато 1)
  short: >-
    Тбилисский жилой комплекс 1970-х, где улицы заменяют лифты и мосты в небе, — задуманный как советская
    утопия и по сей день обжитой.
  body: >-
    **Воздушный мост Нуцубидзе — это улица, подвешенная в воздухе: три бетонные башни на тбилисском склоне,
    сшитые стальными переходами высоко над землёй.**


    Комплекс построили в 1974–1976 годах на плато Нуцубидзе по проекту архитекторов Отара «Тони» Каландаришвили
    и Гизо Поцхишвили. На таком крутом склоне мосты работают как улицы: два общественных лифта поднимают
    людей наверх, а переходы соединяют корпуса на уровне 14-го, 12-го и 10-го этажей. В своё время им
    восхищались как смелым инженерным решением — говорят, посмотреть на него в Тбилиси приезжала группа
    японских инженеров, — и задумывался он как первая часть целого города башен на склоне, большая часть
    которого, по имеющимся сведениям из-за нехватки денег, так и не была построена.


    Присмотритесь — и бетон окажется сентиментальным. Прорези в форме крестов и бойниц, подковообразные
    окна, облицовка из красного дерева на нижнем корпусе — детали, которые, как говорят, перекликаются
    с резными деревянными балконами Старого Тбилиси. Изначально комплекс назывался «Шатили», и многие
    подозревают в этом намёк на одноимённое высокогорное село, где средневековые дома-башни теснятся друг
    к другу, сливаясь в единую крепость.


    Это не музей. Маленькие квартиры, когда-то выделенные рабочим заводов и сотрудникам университетов,
    по-прежнему остаются чьими-то домами, и многие жильцы прожили здесь всю жизнь. После нескольких месяцев
    закрытия в конце 2024 года общественные переходы вновь открылись в 2025-м — с новым покрытием, удлинёнными
    перилами и пандусом; сами башни оставили такими, какими они были.


    Встаньте на самый верхний мост и посмотрите вниз. Утопия, задуманная для этого склона, так и не была
    достроена — но в той её части, что успели построить, вот уже полвека живут, изо дня в день.
  tip: >-
    Прогулка по мостам бесплатна; лифт, по последним сведениям, стоил 20 тетри в одну сторону и принимал
    только монеты по 20 тетри, так что запаситесь ими, но уточните на месте: после ремонта 2024–2025 годов
    порядок мог измениться. Помните, что это чужие дома: не шумите, не фотографируйте жильцов без спроса
    и оставайтесь на общественных переходах — не заходите в подъезды и коридоры. Приветствие соседям творит
    чудеса. Наденьте закрытую обувь: под ногами часто попадаются обломки и мусор. Туалетов и кафе на месте
    нет. Получаса достаточно.
  route: >-
    От площади Свободы около 11 км по асфальтированным городским улицам, вверх через Ваке, — с учётом
    пробок заложите 20 минут. Адрес: улица Шалвы Нуцубидзе, 213, на плато Нуцубидзе. Хватит машины эконом-класса,
    но парковка на узких жилых улочках плато тесная и стихийная; никогда не загораживайте дворы и подъезды.
    Часто проще вовсе оставить машину: станция метро «Государственный университет» в 450 метрах, примерно
    в шести минутах ходьбы, а городские автобусы 326 и 347 останавливаются прямо у комплекса. О топливе
    можно не думать — вы не покидаете города.
fa:
  name: پل هوایی نوتسوبیدزه (پلاتو ۱)
  short: >-
    مجتمعی مسکونی از دههٔ ۱۹۷۰ در تفلیس که در آن آسانسورها و پل‌هایی در دل آسمان کار خیابان را می‌کنند
    — آرمان‌شهری شوروی که هنوز هر روز در آن زندگی می‌کنند.
  body: >-
    **پل هوایی نوتسوبیدزه خیابانی است آویخته در هوا: سه برج بتنی بر دامنه‌ای در تفلیس که گذرگاه‌هایی فولادی،
    بلند بالای زمین، آنها را به هم دوخته‌اند.**


    این مجموعه میان سال‌های ۱۹۷۴ و ۱۹۷۶ بر فلات نوتسوبیدزه ساخته شد، با طراحی معماران اوتار «تونی» کالانداریشویلی
    و گیزو پوتسخیشویلی. در شیبی به این تندی، پل‌ها کار خیابان را می‌کنند: دو آسانسور عمومی مردم را بالا
    می‌برند و گذرگاه‌ها ساختمان‌ها را در طبقه‌های ۱۴، ۱۲ و ۱۰ به هم وصل می‌کنند. این مجموعه در روزگار
    خود به‌عنوان مهندسی‌ای جسورانه تحسین می‌شد — گفته می‌شود گروهی از مهندسان ژاپنی برای دیدنش به تفلیس
    سفر کردند — و قرار بود نخستین تکه از شهری کامل از برج‌ها بر این دامنه باشد، که بیشترش، ظاهراً به دلیل
    کمبود پول، هرگز ساخته نشد.


    از نزدیک که نگاه کنید، بتن احساساتی از آب درمی‌آید. بریدگی‌هایی به شکل صلیب و مزغل، پنجره‌هایی نعلی‌شکل،
    روکش چوب ماهون بر ساختمان پایینی: جزئیاتی که گفته می‌شود پژواک بالکن‌های چوبی کنده‌کاری‌شدهٔ تفلیس
    قدیم‌اند. نام نخستین مجموعه «شاتیلی» بود، و بسیاری گمان می‌کنند اشاره‌ای است به روستای کوهستانی هم‌نامش،
    جایی که خانه‌برج‌های قرون‌وسطایی چنان تنگ کنار هم نشسته‌اند که دژی یکپارچه ساخته‌اند.


    اینجا موزه نیست. آپارتمان‌های کوچک، که نخست به کارگران کارخانه‌ها و کارکنان دانشگاه‌ها واگذار شدند،
    هنوز خانهٔ مردم‌اند و بسیاری از ساکنان همهٔ عمرشان را اینجا گذرانده‌اند. گذرگاه‌های عمومی پس از چند
    ماه تعطیلی در اواخر ۲۰۲۴، در ۲۰۲۵ با کف‌پوش نو، نرده‌های طولانی‌تر و یک سطح شیب‌دار دوباره گشوده شدند؛
    خود برج‌ها همان‌گونه که بودند ماندند.


    روی بلندترین پل بایستید و به پایین نگاه کنید. آرمان‌شهری که برای این دامنه طراحی شده بود هرگز کامل
    نشد — اما در بخشی که ساخته شد، نیم قرن است که هر روزِ خدا زندگی جریان دارد.
  tip: >-
    قدم زدن روی پل‌ها رایگان است؛ آسانسور، طبق آخرین گزارش‌ها، برای هر مسیر ۲۰ تتری هزینه داشت و فقط سکهٔ
    ۲۰ تتری می‌پذیرفت، پس چند سکه همراه داشته باشید، اما در محل هم جویا شوید، چون ممکن است پس از نوسازی
    ۲۰۲۴–۲۰۲۵ این ترتیب تغییر کرده باشد. به یاد داشته باشید که اینجا خانهٔ مردم است: آهسته حرف بزنید،
    بدون اجازه از ساکنان عکس نگیرید و روی گذرگاه‌های عمومی بمانید — به راه‌پله‌ها و راهروها سرک نکشید.
    یک سلام به همسایه‌ها خیلی کارساز است. کفش جلوبسته بپوشید، چون زیر پا اغلب نخاله و آشغال هست. در محل
    نه سرویس بهداشتی هست نه کافه. نیم ساعت کافی است.
  route: >-
    از میدان آزادی حدود ۱۱ کیلومتر در خیابان‌های آسفالتهٔ شهر، رو به بالا از میان واکه — با ترافیک ۲۰
    دقیقه در نظر بگیرید. نشانی: خیابان شالوا نوتسوبیدزه، شمارهٔ ۲۱۳، بر فلات نوتسوبیدزه. خودروی اقتصادی
    همهٔ آن چیزی است که لازم دارید، اما پارک کردن در کوچه‌های تنگ مسکونی فلات دشوار و بی‌قاعده است؛ هرگز
    جلوی حیاط‌ها و ورودی‌ها را نبندید. اغلب ساده‌تر است که خودرو را کنار بگذارید: ایستگاه متروی «دانشگاه
    دولتی» ۴۵۰ متر فاصله دارد، حدود شش دقیقه پیاده، و اتوبوس‌های شهری ۳۲۶ و ۳۴۷ درست جلوی مجموعه می‌ایستند.
    نگران سوخت نباشید — از شهر بیرون نمی‌روید.
he:
  name: גשר השמיים של נוצובידזה (פלטו 1)
  short: >-
    מתחם מגורים משנות השבעים בטביליסי, שבו מעליות וגשרים באוויר ממלאים את תפקיד הרחוב — אוטופיה סובייטית
    שעדיין חיים בה יום-יום.
  body: >-
    **גשר השמיים של נוצובידזה הוא רחוב התלוי באוויר: שלושה מגדלי בטון על מדרון בטביליסי, תפורים זה לזה
    במעברי פלדה גבוה מעל הקרקע.**


    המתחם הוקם בין 1974 ל-1976 ברמת נוצובידזה, בתכנון האדריכלים אותר "טוני" קלנדרישווילי וגיזו פוצחישווילי.
    על מדרון תלול כל כך הגשרים ממלאים את תפקיד הרחובות: שתי מעליות ציבוריות מעלות את האנשים, ומעברים מחברים
    בין הבניינים בקומות 14, 12 ו-10. בזמנו זכה המתחם להערצה כהישג הנדסי נועז — מספרים שצוות של מהנדסים
    יפנים הגיע לטביליסי כדי לראותו — והוא נועד להיות החלק הראשון של עיר מגדלים שלמה על המדרון, שרובה,
    כך מדווח, לא נבנה מעולם מחוסר כסף.


    הביטו מקרוב, ויתברר שהבטון סנטימנטלי. פתחים בצורת צלבים וחרכי ירי, חלונות בצורת פרסה, חיפוי עץ מהגוני
    על הבניין התחתון: פרטים שלפי הנאמר מהדהדים את מרפסות העץ המגולפות של טביליסי העתיקה. במקור נקרא המתחם
    "שאטילי", ורבים חושדים ברמיזה לכפר ההררי הנושא שם זה, שבו בתי-מגדל מימי הביניים מצטופפים יחד למבצר
    אחד.


    זה אינו מוזיאון. הדירות הקטנות, שהוקצו בתחילה לפועלי מפעלים ולעובדי אוניברסיטאות, הן עדיין בתים, ורבים
    מן הדיירים חיו כאן כל חייהם. אחרי סגירה של כמה חודשים בסוף 2024 נפתחו המעברים הציבוריים מחדש ב-2025,
    עם ריצוף חדש, מעקות ארוכים יותר ורמפה; המגדלים עצמם נותרו כפי שהיו.


    עמדו על הגשר הגבוה ביותר והביטו למטה. האוטופיה שתוכננה למדרון הזה לא הושלמה מעולם — אבל בחלק שנבנה
    חיים אנשים, יום אחר יום, כבר חצי מאה.
  tip: >-
    ההליכה על הגשרים חינם; המעלית, לפי הדיווח האחרון, עלתה 20 טטרי לכל כיוון וקיבלה רק מטבעות של 20 טטרי,
    אז הצטיידו בכמה, אך בדקו במקום, כי ייתכן שהשיפוץ של 2024–2025 שינה את ההסדר. זכרו שאלה בתים של אנשים:
    דברו בשקט, אל תצלמו דיירים בלי לבקש רשות, והישארו על המעברים הציבוריים — אל תשוטטו בחדרי מדרגות או
    במסדרונות. ברכת שלום לשכנים עושה פלאים. נעלו נעליים סגורות, כי לעתים קרובות יש פסולת מתחת לרגליים.
    אין במקום שירותים או בתי קפה. חצי שעה מספיקה.
  route: >-
    מכיכר החירות זה כ-11 ק"מ ברחובות עיר סלולים, בעלייה דרך ואקה — עם התנועה הקצו 20 דקות. הכתובת: רחוב
    שלווה נוצובידזה 213, ברמת נוצובידזה. רכב חסכוני הוא כל מה שצריך, אבל החניה ברחובות המגורים הצרים של
    הרמה דחוקה ולא מוסדרת; לעולם אל תחסמו חצרות או כניסות. לעתים קרובות קל יותר לוותר על הרכב: תחנת המטרו
    "האוניברסיטה הממלכתית" נמצאת במרחק 450 מטר, כשש דקות הליכה, ואוטובוסים עירוניים 326 ו-347 עוצרים ממש
    מול המתחם. דלק אינו עניין — אתם לא יוצאים מהעיר.
ar:
  name: جسر نوتسوبيدزه الجوي (بلاتو 1)
  short: >-
    مجمّع سكني من سبعينيات القرن العشرين في تبليسي، تؤدي فيه المصاعد والجسور المعلّقة في السماء عمل الشارع
    — يوتوبيا سوفييتية ما زالت مأهولة كل يوم.
  body: >-
    **جسر نوتسوبيدزه الجوي شارعٌ معلّق في الهواء: ثلاثة أبراج خرسانية على سفح في تبليسي، خاطتها ممرات
    فولاذية بعضها إلى بعض عالياً فوق الأرض.**


    شُيّد المجمّع بين عامي 1974 و1976 على هضبة نوتسوبيدزه، بتصميم المعماريين أوتار «توني» كالانداريشفيلي
    وغيزو بوتسخيشفيلي. وعلى سفح بهذا الانحدار تؤدي الجسور عمل الشوارع: مصعدان عامان يرفعان الناس إلى الأعلى،
    وممرات تصل المباني عند الطوابق 14 و12 و10. وقد أُعجب به الناس في زمنه بوصفه إنجازاً هندسياً جريئاً
    — ويقال إن فريقاً من المهندسين اليابانيين سافر إلى تبليسي ليراه — وكان يُراد له أن يكون الجزء الأول
    من مدينة كاملة من الأبراج على السفح، لم يُبنَ معظمها قط، بسبب نقص المال على ما يُروى.


    أمعن النظر وستكتشف أن الخرسانة عاطفية. فتحات على شكل صلبان وكوى رماية، ونوافذ على هيئة حدوة حصان،
    وكسوة من خشب الماهوغني على المبنى السفلي: تفاصيل يقال إنها تستعيد الشرفات الخشبية المنحوتة في تبليسي
    القديمة. وكان المجمّع يُعرف في الأصل باسم «شاتيلي»، ويرى كثيرون في ذلك إشارة إلى القرية الجبلية التي
    تحمل الاسم نفسه، حيث تتلاصق البيوت-الأبراج التي تعود إلى القرون الوسطى لتشكّل قلعة واحدة.


    هذا ليس متحفاً. فالشقق الصغيرة، التي خُصصت أولاً لعمال المصانع وموظفي الجامعات، لا تزال بيوتاً، وكثير
    من السكان عاشوا هنا طوال حياتهم. وبعد إغلاق دام بضعة أشهر في أواخر 2024، أعيد فتح الممرات العامة عام
    2025 بأرضية جديدة ودرابزين أطول ومنحدر؛ وتُركت الأبراج نفسها على حالها.


    قف على أعلى الجسور وانظر إلى الأسفل. اليوتوبيا التي خُطط لها على هذا السفح لم تكتمل قط — لكن الجزء
    الذي بُني ظلّ مسكوناً، يوماً بعد يوم، منذ نصف قرن.
  tip: >-
    المشي على الجسور مجاني؛ وكان المصعد، بحسب آخر ما أُفيد، يكلّف 20 تتري لكل اتجاه ولا يقبل إلا قطع العشرين
    تتري، فاحمل بعضها، لكن تحقّق من ذلك عند وصولك، فقد يكون تجديد 2024–2025 غيّر النظام. وتذكّر أن هذه
    بيوت الناس: اخفض صوتك، ولا تصوّر السكان من دون استئذان، والزم الممرات العامة — لا تتجول في السلالم
    الداخلية أو الممرات. وتحيةٌ للجيران تفتح القلوب. البس حذاءً مغلقاً، فكثيراً ما تتناثر الأنقاض تحت
    القدمين. لا دورات مياه ولا مقاهٍ في الموقع. ونصف ساعة تكفي.
  route: >-
    من ساحة الحرية نحو 11 كم في شوارع المدينة المعبّدة، صعوداً عبر فاكي — خصّص 20 دقيقة مع الازدحام. العنوان:
    شارع شالفا نوتسوبيدزه رقم 213، على هضبة نوتسوبيدزه. سيارة اقتصادية هي كل ما تحتاجه، لكن الوقوف في
    الشوارع السكنية الضيقة على الهضبة صعب وعشوائي؛ ولا تسدّ الأفنية أو المداخل أبداً. وكثيراً ما يكون
    الأسهل ترك السيارة: فمحطة مترو «الجامعة الحكومية» على بعد 450 متراً، أي نحو ست دقائق سيراً، والحافلتان
    326 و347 تتوقفان أمام المجمّع مباشرة. ولا داعي للقلق بشأن الوقود — فأنت لا تغادر المدينة.
