ka:
  name: შავნაბადის მონასტერი
  short: >-
    წმინდა გიორგის მონასტერი თელეთის თავზე, ტყიან მთაზე, რომელსაც ლეგენდარული შავნაბდიანი მხედრის სახელი
    ჰქვია — თავისი ხატწერის სკოლითა და ღვინით.
  body: >-
    **მთას მოსასხამის სახელი ჰქვია: შავი ნაბადი — იმ მხედრისა, რომელმაც, გადმოცემით, საქართველოსთვის ბრძოლა
    მოიგო და შემდეგ აღარავის უნახავს.**


    გადმოცემა რამდენიმე სახით შემორჩა. ერთის მიხედვით, უცნობ მეომარს მეფემ სიმამაცისთვის შავი ნაბადი უბოძა;
    სამადლობელი პარაკლისის შემდეგ ის გაუჩინარდა, მოგვიანებით კი მისი სახე წმინდა გიორგის ფრესკაზე იცნეს.
    მეორის მიხედვით, მეფის ლაშქარს შავნაბდიანი თავად წმინდა გიორგი წინ მიუძღოდა. ზოგი ვერსია ამბავს 1795
    წელს უკავშირებს, როცა აღა-მაჰმად-ხანის სპარსულმა ლაშქარმა თბილისი აიკლო — ლეგენდაში, ყოველ შემთხვევაში,
    დამპყრობლები აქ დამარცხდნენ.


    ისტორია უფრო მოკრძალებულია. მონასტრის წმინდა გიორგის ეკლესია XII საუკუნით თარიღდება; მოგვიანებით კომპლექსს
    მეორე ეკლესია და სამრეკლო შეემატა, თუმცა როდის — ამაზე წყაროები ერთმანეთს არ ეთანხმება. დღეს ეს მოქმედი
    მონასტერია ხატწერის სკოლით; ტაძრის ხატების უმეტესობა ადგილობრივ ხატმწერებს დაუწერიათ. აქვეა მარანიც:
    ბერები ღვინოს აყენებენ, რომელსაც მთის სახელი — „შავნაბადა“ — ჰქვია.


    გზაც სტუმრობის ნაწილია: ბოლო კილომეტრები ტყეში, უხეში გრუნტის გზაზე მიიკლაკნება, მწვერვალიდან კი,
    დაახლოებით 790 მეტრის სიმაღლიდან, ჩრდილოეთით თბილისი იშლება.


    ვის ეხურა შავი ნაბადი, არავინ იცის. მთამ მისი სახელი მაინც შეინახა, ბერები კი მას ბოთლებში ასხამენ.
  tip: >-
    ეს მოქმედი მონასტერია, შესვლა უფასოა. ჩაიცვით მოკრძალებულად: მამაკაცებს — გრძელი შარვალი, ქალებს —
    ქვედაბოლო და თავსაფარი. ტაძარში ხმადაბლა იყავით და ფოტოს გადაღებამდე ნებართვა ითხოვეთ. ადგილზე ეკლესიის
    გარდა არაფერია — არც კაფე, არც საპირფარეშო, — ამიტომ წყალი თან იქონიეთ. თუ მონასტრის ღვინის შეძენა
    გსურთ, ჰკითხეთ, ხომ არ იყიდება. ქალაქის ხედი მზის ჩასვლისას განსაკუთრებით კარგია, მაგრამ დაღმართი
    სიბნელემდე დაიწყეთ: ტყის გზაზე ღამით სიარული არ ღირს. ერთი საათი საკმარისია.
  route: >-
    ქალაქის ცენტრიდან სამხრეთისკენ, მტკვრის მარჯვენა სანაპიროთი და რუსთავის გზატკეცილით იარეთ, შემდეგ
    მარნეულის მიმართულებით ს6 გზაზე გადადით და ფონიჭალას გაიარეთ. ს6-ზე დაახლოებით 3 კილომეტრის შემდეგ
    მარჯვნივ, მთისკენ მიმავალ ადგილობრივ გზაზე გადაუხვიეთ; ბოლო რამდენიმე კილომეტრი ტყეში ამავალი, დაღარული
    ხრეშიანი გზაა. სულ დაახლოებით 19 კმ და 35 წუთი. მშრალ ამინდში ეკონომ კლასის მანქანა ნელი სვლით გაივლის;
    ძლიერი წვიმის შემდეგ ან ზამთარში გზა ტალახად იქცევა — მაშინ SUV აიღეთ ან ასვლა სხვა დღისთვის გადადეთ.
    საწვავი ქალაქში ჩაასხით; ჭიშკართან პარკირების ადგილი ცოტაა.
en:
  name: Shavnabada Monastery
  short: >-
    A monastery of St George on a forested mountain above Teleti, named after a legendary black-cloaked
    rider — with its own icon school and wine.
  body: >-
    **The mountain is named after a cloak — *shavi nabadi*, the black felt cape of a rider who, the story
    goes, won a battle for Georgia and was never seen again.**


    Tradition tells it more than one way. In one version the king gave an unknown warrior a black cloak
    as a reward for his courage; after the thanksgiving service the man vanished, and people later recognised
    his face in a fresco of St George. In another, St George himself led the royal army in the black cloak.
    Some tellings set the battle in 1795, the year Agha Mohammad Khan's Persian army sacked Tbilisi —
    in the legend, at least, the invaders were beaten here.


    The history is quieter. The monastery's Church of St George dates from the 12th century; a second
    church and a bell tower were added later, though sources disagree on when. Today it is a working monastery
    with an icon-painting school, and most of the icons in the church were painted by local hands. There
    is a cellar too, and the monks make a wine that carries the mountain's name: Shavnabada.


    The drive is part of the visit. The last kilometres climb through forest on a rough track, and from
    the top, at around 790 metres, Tbilisi spreads out to the north.


    Nobody knows who wore the black cloak. The mountain has kept his name anyway, and the monks pour it
    into bottles.
  tip: >-
    This is a working monastery and entry is free. Dress modestly: long trousers for men, a skirt and
    headscarf for women. Keep your voice low in the church and ask before taking photographs. There is
    nothing on site beyond the church — no café, no toilets — so bring water. If you would like a bottle
    of the monastery's wine, ask whether any is for sale. The view over the city is especially fine towards
    sunset, but start down before dark: the forest track is no place for night driving. An hour is enough.
  route: >-
    From the centre, head south along the Right Bank embankment and the Rustavi highway, then fork onto
    the S6 towards Marneuli and pass through Ponichala. About 3 km along the S6, turn right onto the local
    road towards the mountain; the last few kilometres climb through forest on a rutted gravel track.
    In all it is about 19 km and 35 minutes. In dry weather an economy car manages at a crawl; after heavy
    rain or in winter the track turns to mud — then take an SUV or leave it for another day. Fill up in
    the city; parking at the gate is limited.
ru:
  name: Монастырь Шавнабада
  short: >-
    Монастырь Святого Георгия на лесистой горе над Телети, названный в честь легендарного всадника в чёрной
    бурке, — со своей иконописной школой и вином.
  body: >-
    **Гора названа по плащу — *шави набади*, чёрной войлочной бурке всадника, который, как гласит предание,
    выиграл битву за Грузию и больше никогда не появлялся.**


    Предание рассказывают по-разному. В одной версии царь подарил безвестному воину чёрную бурку в награду
    за храбрость; после благодарственного молебна тот исчез, а позже люди узнали его лицо на фреске святого
    Георгия. В другой сам святой Георгий в чёрной бурке вёл царское войско. Некоторые версии относят битву
    к 1795 году, когда персидская армия Ага-Мохаммед-хана разорила Тбилиси, — в легенде, по крайней мере,
    захватчики были разбиты здесь.


    История скромнее. Церковь Святого Георгия в монастыре относится к XII веку; вторая церковь и колокольня
    появились позже, хотя источники расходятся в том, когда именно. Сегодня это действующий монастырь
    с иконописной школой, и большинство икон в церкви написаны местными мастерами. Есть и винный погреб:
    монахи делают вино, носящее имя горы, — «Шавнабада».


    Дорога — часть визита. Последние километры дорога петляет вверх через лес по разбитой грунтовке, а
    с вершины, примерно с 790 метров, видно, как к северу раскинулся Тбилиси.


    Никто не знает, кто носил чёрную бурку. Гора всё равно сохранила его имя, а монахи разливают его по
    бутылкам.
  tip: >-
    Это действующий монастырь, вход бесплатный. Одевайтесь скромно: мужчинам — длинные брюки, женщинам
    — юбка и платок. В церкви говорите вполголоса и спрашивайте разрешения, прежде чем фотографировать.
    На месте, кроме церкви, ничего нет — ни кафе, ни туалетов, — так что возьмите воду. Если хотите бутылку
    монастырского вина, спросите, продаётся ли оно. Вид на город особенно хорош ближе к закату, но начинайте
    спуск до темноты: лесная грунтовка — не место для ночной езды. Часа достаточно.
  route: >-
    Из центра езжайте на юг по правобережной набережной и Руставскому шоссе, затем уйдите на S6 в сторону
    Марнеули и проезжайте через Поничалу. Примерно через 3 км по S6 сверните направо на местную дорогу
    к горе; последние несколько километров дорога поднимается через лес по разбитой гравийке. Всего около
    19 км и 35 минут. В сухую погоду машина эконом-класса справится, если ползти; после сильного дождя
    или зимой грунтовку развозит — тогда берите внедорожник или отложите поездку. Заправьтесь в городе;
    парковка у ворот ограничена.
fa:
  name: صومعه شاونابادا
  short: >-
    صومعه گئورگیوس مقدس بر کوهی جنگلی بالای تلتی، که نامش را از سواری افسانه‌ای با شنل سیاه گرفته — با
    مدرسه شمایل‌نگاری و شراب خودش.
  body: >-
    **این کوه نامش را از یک شنل گرفته است — *شاوی نابادی*، شنل نمدیِ سیاه سواری که به روایت داستان، نبردی
    را برای گرجستان برد و دیگر هرگز دیده نشد.**


    این داستان را به بیش از یک شکل بازگو می‌کنند. در یک روایت، شاه به جنگاوری ناشناس به پاداش دلاوری‌اش
    شنلی سیاه بخشید؛ پس از مراسم شکرگزاری مرد ناپدید شد و مردم بعدها چهره‌اش را در نقش دیواری گئورگیوس
    مقدس بازشناختند. در روایتی دیگر، خودِ گئورگیوس مقدس با شنل سیاه سپاه شاهی را رهبری کرد. برخی روایت‌ها
    نبرد را در سال ۱۷۹۵ می‌گذارند، سالی که سپاه ایرانیِ آغا محمدخان تفلیس را غارت کرد — دست‌کم در افسانه،
    مهاجمان این‌جا شکست خوردند.


    تاریخ آرام‌تر است. کلیسای گئورگیوس مقدسِ صومعه از سده دوازدهم است؛ کلیسای دوم و برج ناقوس بعدها افزوده
    شدند، هرچند منابع درباره زمانش هم‌داستان نیستند. امروز این‌جا صومعه‌ای فعال با یک مدرسه شمایل‌نگاری
    است و بیشتر شمایل‌های کلیسا را دست‌های محلی کشیده‌اند. سردابی هم هست و راهبان شرابی می‌سازند که نام
    کوه را بر خود دارد: شاونابادا.


    راه، بخشی از دیدار است. کیلومترهای پایانی از میان جنگل و بر کوره‌راهی ناهموار بالا می‌روند، و از فراز
    کوه، در ارتفاع حدود ۷۹۰ متر، تفلیس در شمال گسترده است.


    هیچ‌کس نمی‌داند شنل سیاه را چه کسی بر دوش داشت. کوه با این همه نامش را نگه داشته، و راهبان آن را در
    بطری می‌ریزند.
  tip: >-
    این صومعه‌ای فعال است و ورود رایگان است. لباس پوشیده بپوشید: شلوار بلند برای آقایان، دامن و روسری
    برای بانوان. در کلیسا آهسته سخن بگویید و پیش از عکاسی اجازه بگیرید. در محل جز کلیسا چیزی نیست — نه
    کافه، نه سرویس بهداشتی — پس آب همراه بیاورید. اگر یک بطری از شراب صومعه می‌خواهید، بپرسید آیا چیزی
    برای فروش هست. منظره شهر به‌ویژه نزدیک غروب زیباست، اما پیش از تاریکی سرازیر شوید: کوره‌راه جنگلی
    جای رانندگی در شب نیست. یک ساعت کافی است.
  route: >-
    از مرکز شهر از خیابان ساحلی کرانه راست و بزرگراه روستاوی به‌سوی جنوب بروید، سپس به S6 به‌سوی مارنئولی
    بپیچید و از پونیچالا بگذرید. حدود ۳ کیلومتر پس از ورود به S6، به راست و به جاده محلی به‌سوی کوه بپیچید؛
    چند کیلومتر پایانی بر جاده شنی پرچاله‌ای از میان جنگل بالا می‌رود. روی‌هم‌رفته حدود ۱۹ کیلومتر و ۳۵
    دقیقه. در هوای خشک، خودروی سواری معمولی با سرعتی بسیار کم از پسش برمی‌آید؛ پس از باران شدید یا در
    زمستان جاده گِل می‌شود — آن‌وقت خودروی شاسی‌بلند بگیرید یا سفر را به روز دیگری بسپارید. در شهر سوخت‌گیری
    کنید؛ جای پارک کنار دروازه محدود است.
he:
  name: מנזר שבנבדה
  short: >-
    מנזר גאורגיוס הקדוש על הר מיוער מעל טלטי, הקרוי על שם פרש אגדי בגלימה שחורה — ויש לו בית ספר לציור
    איקונות ויין משלו.
  body: >-
    **ההר קרוי על שם גלימה — *שאווי נאבאדי*, גלימת הלבד השחורה של פרש שלפי הסיפור ניצח בקרב למען גאורגיה
    ולא נראה עוד לעולם.**


    המסורת מספרת זאת ביותר מדרך אחת. בגרסה אחת העניק המלך ללוחם אלמוני גלימה שחורה כגמול על אומץ לבו;
    אחרי תפילת ההודיה נעלם האיש, ומאוחר יותר זיהו אנשים את פניו בציור קיר של גאורגיוס הקדוש. בגרסה אחרת
    גאורגיוס הקדוש עצמו הוביל את צבא המלך בגלימה השחורה. יש גרסאות שממקמות את הקרב ב-1795, השנה שבה צבאו
    הפרסי של אגא מוחמד ח'אן בזז את טביליסי — באגדה, לפחות, הפולשים הובסו כאן.


    ההיסטוריה שקטה יותר. כנסיית גאורגיוס הקדוש של המנזר היא מהמאה ה-12; כנסייה שנייה ומגדל פעמונים נוספו
    מאוחר יותר, אף שהמקורות חלוקים על המועד. כיום זהו מנזר פעיל ובו בית ספר לציור איקונות, ורוב האיקונות
    בכנסייה צוירו בידי ציירים מקומיים. יש גם מרתף יין, והנזירים מייצרים יין שנושא את שם ההר: שבנבדה.


    הדרך היא חלק מהביקור. הקילומטרים האחרונים מטפסים ביער בדרך עפר משובשת, ומן הפסגה, בגובה של כ-790 מטר,
    טביליסי נפרשת לצפון.


    איש אינו יודע מי לבש את הגלימה השחורה. ההר שמר על שמו בכל זאת, והנזירים יוצקים אותו לבקבוקים.
  tip: >-
    זהו מנזר פעיל והכניסה חופשית. התלבשו בצניעות: מכנסיים ארוכים לגברים, חצאית וכיסוי ראש לנשים. דברו
    בשקט בכנסייה ובקשו רשות לפני שמצלמים. אין במקום דבר מלבד הכנסייה — לא בית קפה ולא שירותים — אז הביאו
    מים. אם תרצו בקבוק מיין המנזר, שאלו אם יש יין למכירה. הנוף על העיר יפה במיוחד לקראת השקיעה, אבל התחילו
    לרדת לפני החשכה: דרך העפר ביער אינה מקום לנהיגת לילה. שעה מספיקה.
  route: >-
    מהמרכז סעו דרומה לאורך הכביש שעל הגדה הימנית ובכביש רוסתאווי, ואז פנו לכביש S6 לכיוון מרנאולי ועברו
    דרך פוניצ'לה. כ-3 ק"מ לאחר העלייה על S6 פנו ימינה לדרך המקומית לכיוון ההר; הקילומטרים האחרונים מטפסים
    ביער בדרך חצץ משובשת. בסך הכול כ-19 ק"מ ו-35 דקות. במזג אוויר יבש רכב פרטי רגיל יעבור בנסיעה איטית
    מאוד; אחרי גשם כבד או בחורף הדרך הופכת לבוץ — אז קחו רכב שטח או דחו את הביקור ליום אחר. תדלקו בעיר;
    החניה ליד השער מוגבלת.
ar:
  name: دير شافنابادا
  short: >-
    دير للقديس جاورجيوس على جبل مكسوّ بالغابات فوق تيليتي، سُمّي باسم فارس أسطوري ذي عباءة سوداء، وله
    مدرسة لرسم الأيقونات ونبيذه الخاص.
  body: >-
    **سُمّي الجبل باسم عباءة: *شافي نابادي*، العباءة اللبّادية السوداء لفارسٍ تقول الحكاية إنه كسب معركة
    لجورجيا ثم لم يُرَ بعدها قط.**


    يروي التقليد القصة بأكثر من وجه. ففي رواية، أهدى الملك محاربًا مجهولًا عباءة سوداء مكافأةً على شجاعته؛
    وبعد صلاة الشكر اختفى الرجل، ثم تعرّف الناس لاحقًا إلى وجهه في جدارية للقديس جاورجيوس. وفي رواية أخرى،
    قاد القديس جاورجيوس نفسه الجيش الملكي مرتديًا العباءة السوداء. وبعض الروايات تجعل المعركة عام 1795،
    العام الذي نهب فيه جيش آغا محمد خان الفارسي تبليسي، وفي الأسطورة على الأقل هُزم الغزاة هنا.


    التاريخ أهدأ من ذلك. تعود كنيسة القديس جاورجيوس في الدير إلى القرن الثاني عشر؛ وأُضيفت لاحقًا كنيسة
    ثانية وبرج للأجراس، وإن اختلفت المصادر في تاريخ ذلك. واليوم هو دير عامر بالرهبان فيه مدرسة لرسم الأيقونات،
    ومعظم الأيقونات في الكنيسة رسمتها أيدٍ محلية. وفيه قبو للنبيذ أيضًا، إذ يصنع الرهبان نبيذًا يحمل اسم
    الجبل: شافنابادا.


    الطريق جزء من الزيارة. تصعد الكيلومترات الأخيرة عبر الغابة على درب وعر، ومن القمة، على ارتفاع نحو
    790 مترًا، تنبسط تبليسي نحو الشمال.


    لا أحد يعرف من ارتدى العباءة السوداء. ومع ذلك احتفظ الجبل باسمه، والرهبان يسكبونه في الزجاجات.
  tip: >-
    هذا دير عامر بالرهبان والدخول مجاني. ارتدِ ملابس محتشمة: سراويل طويلة للرجال، وتنورة وغطاء رأس للنساء.
    اخفض صوتك في الكنيسة واستأذن قبل التصوير. لا شيء في الموقع سوى الكنيسة، فلا مقهى ولا دورات مياه، لذا
    أحضر الماء. وإن رغبت في زجاجة من نبيذ الدير، فاسأل إن كان متاحًا للبيع. منظر المدينة جميل خصوصًا قرب
    الغروب، لكن ابدأ النزول قبل حلول الظلام: فدرب الغابة ليس مكانًا للقيادة ليلًا. تكفي ساعة واحدة.
  route: >-
    من وسط المدينة اتجه جنوبًا على طريق الضفة اليمنى وطريق روستافي السريع، ثم انعطف إلى الطريق S6 باتجاه
    مارنيولي ومُرّ عبر بونيتشالا. وبعد نحو 3 كم على S6 انعطف يمينًا إلى الطريق المحلي نحو الجبل؛ وتصعد
    الكيلومترات القليلة الأخيرة عبر الغابة على درب حصوي مليء بالحفر. المسافة الإجمالية نحو 19 كم و35 دقيقة.
    في الطقس الجاف تتدبر سيارة الركاب العادية أمرها إن سارت ببطء شديد؛ أما بعد المطر الغزير أو في الشتاء
    فيتحول الدرب إلى وحل، فخذ حينها سيارة دفع رباعي أو أجّل الزيارة إلى يوم آخر. املأ الخزان في المدينة؛
    أماكن الوقوف عند البوابة محدودة.
