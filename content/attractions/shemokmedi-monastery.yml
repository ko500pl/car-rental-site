ka:
  name: შემოქმედის მონასტერი
  short: გურიის მთავრების, გურიელების, სამარხი მონასტერი ოზურგეთთან — მდიდარი ხატების ისტორიით.
  body: >-
    შემოქმედის მონასტერი ოზურგეთიდან რამდენიმე კილომეტრში, მთის ფერდობზე დგას და გურიის ერთ-ერთი მთავარი
    სასულიერო ცენტრია. კომპლექსი ორი ეკლესიისგან შედგება და ძირითადად XV–XVI საუკუნეებით თარიღდება, თუმცა
    ადგილი უფრო ადრეც იყო გამოყენებული.


    მონასტრის ისტორიული მნიშვნელობა გურიელებთანაა დაკავშირებული — გურიის მთავრების საგვარეულოსთან, რომელთათვისაც
    შემოქმედი საეპისკოპოსო კათედრასაც წარმოადგენდა და საგვარეულო სამარხსაც. სწორედ მათი შემოწირულობებით
    შეიქმნა შემოქმედის ცნობილი საგანძური: ჭედური ხატები, ჯვრები და ოქრომჭედლობის ნიმუშები, რომლებიც ქართული
    შუა საუკუნეების ხელოვნების საუკეთესო მაგალითებს შორისაა. ამ ნივთების დიდი ნაწილი დღეს თბილისში, ეროვნული
    მუზეუმის საგანძურშია დაცული და ადგილზე მათი ნახვა არ შეიძლება — ეს წინასწარ უნდა იცოდეთ.


    რას ნახავთ ადგილზე:


    - **ორი ქვის ეკლესია** ერთ ეზოში, ფრესკების ფრაგმენტებით

    - **სამრეკლო და შემოგარენის კედლები**

    - **ხედი გურიის ბარზე** მონასტრის ტერასიდან


    ვიზიტი მოკლეა — ერთი საათი სავსებით საკმარისია. მონასტერი მოქმედია და აქ ჩვეულებრივი სამრევლო ცხოვრება
    მიმდინარეობს, ტურისტული ინფრასტრუქტურის გარეშე, რაც მას მშვიდ და უხმაურო ადგილად აქცევს უფრო ცნობილ
    ქართულ სავანეებთან შედარებით. გურიის მარშრუტში შემოქმედი კარგად ჯდება ოზურგეთსა და სანაპიროს შორის:
    ერთ დღეში მას ურეკს ან ნაბეღლავს დაუმატებთ და რეგიონის ორივე სახეს — ბარისა და მთისწინეთის — ერთდროულად
    ნახავთ.
  tip: >-
    მონასტერი მოქმედია, ამიტომ ჩაცმის წესი მკაცრია: ქალებს თავსაფარი და გრძელი კალთა სჭირდებათ, მამაკაცებს
    — გრძელი შარვალი. შორტებში შესვლა არ დაგრთავთ. ვიზიტისთვის დილა ან შუადღის შემდეგ სჯობს, რადგან შუადღისას
    ხშირად წირვაა. ფოტოგადაღება ეკლესიების შიგნით ჩვეულებრივ აკრძალულია — ნებართვა წინასწარ იკითხეთ. მანქანა
    ეზოს წინ, ვიწრო მოედანზე ტოვებთ. კაფე და ბანკომატი ოზურგეთშია, აქ არაფერია.
  route: >-
    თბილისიდან დაახლოებით 335 კმ და ხუთი საათია. E60-ით მიდიხართ ხაშურის, რიკოთის მაგისტრალის, ქუთაისისა
    და სამტრედიის გავლით, შემდეგ ლანჩხუთსა და ოზურგეთზე უხვევთ. ოზურგეთიდან შემოქმედამდე მხოლოდ რამდენიმე
    კილომეტრია — მისასვლელი ვიწრო ასფალტია, ბოლო მონაკვეთი კი ციცაბო და ადგილ-ადგილ დაზიანებული. მშრალ
    ამინდში ეკონომ კლასის ავტომობილი უპრობლემოდ ადის. საწვავი ოზურგეთში აავსეთ, სოფლის გზაზე გასამართი
    აღარაა.
en:
  name: Shemokmedi Monastery
  short: The burial monastery of the Gurieli princes near Ozurgeti, with a famous history of icons and
    metalwork.
  body: >-
    Shemokmedi Monastery stands on a hillside a few kilometres from Ozurgeti and is one of the principal
    religious centres of Guria. The complex consists of two churches and dates mainly from the fifteenth
    and sixteenth centuries, although the site was in use earlier.


    Its historical importance is tied to the Gurieli, the princely house of Guria, for whom Shemokmedi
    served both as an episcopal seat and as a family burial place. Their donations built up the famous
    Shemokmedi treasury: chased icons, processional crosses and goldsmith work counted among the finest
    surviving examples of Georgian medieval art. Most of these objects are now kept in the treasury of
    the National Museum in Tbilisi and cannot be seen on site, which is worth knowing before you go.


    What you will find here:


    - **Two stone churches** in a single walled yard, with fragments of frescoes

    - **A bell tower** and the surrounding enclosure walls

    - **A view over the Guria lowland** from the monastery terrace


    The visit is short — an hour is entirely enough. The monastery is active and ordinary parish life
    continues here without any tourist infrastructure, which is precisely what makes it quiet and unhurried
    compared with better-known Georgian monasteries.
  tip: >-
    This is a working monastery, so the dress code is enforced: women need a headscarf and a long skirt,
    men long trousers. You will not be admitted in shorts. Morning or late afternoon is better than the
    middle of the day, when services are often under way. Photography inside the churches is normally
    not allowed — ask before raising a camera. Park on the narrow area in front of the gate. There is
    no cafe or ATM here; the nearest are in Ozurgeti.
  route: >-
    It is about 335 km and five hours from Tbilisi. Follow the E60 through Khashuri, the Rikoti section,
    Kutaisi and Samtredia, then turn toward Lanchkhuti and Ozurgeti. From Ozurgeti the monastery is only
    a few kilometres away: the approach is narrow asphalt, with the final stretch steep and broken in
    places. In dry weather an economy car manages it without difficulty, though take the last bends slowly.
    Fill up in Ozurgeti, since there are no fuel stations on the village road beyond it.
ru:
  name: Монастырь Шемокмеди
  short: Усыпальница гурийских князей Гуриели близ Озургети со знаменитой историей икон и чеканки.
  body: >-
    Монастырь Шемокмеди стоит на склоне в нескольких километрах от Озургети и остаётся одним из главных
    духовных центров Гурии. Комплекс состоит из двух церквей и относится в основном к XV–XVI векам, хотя
    само место использовалось и раньше.


    Историческое значение обители связано с Гуриели — княжеским домом Гурии, для которого Шемокмеди служил
    и епископской кафедрой, и родовой усыпальницей. Их вкладами сложилась знаменитая шемокмедская сокровищница:
    чеканные иконы, выносные кресты и ювелирные работы, входящие в число лучших образцов грузинского средневекового
    искусства. Большая часть этих предметов сегодня хранится в сокровищнице Национального музея в Тбилиси
    и на месте недоступна — об этом стоит знать заранее.


    Что вы увидите здесь:


    - **Две каменные церкви** в общем огороженном дворе с фрагментами фресок

    - **Колокольню** и стены ограды

    - **Вид на гурийскую равнину** с монастырской террасы


    Визит короткий — часа вполне достаточно. Монастырь действующий, здесь идёт обычная приходская жизнь
    без всякой туристической инфраструктуры, и именно это делает его тихим и неспешным на фоне более известных
    грузинских обителей.
  tip: >-
    Это действующий монастырь, дресс-код соблюдается строго: женщинам нужны платок и длинная юбка, мужчинам
    — длинные брюки. В шортах внутрь не пустят. Утро или вторая половина дня удобнее середины дня, когда
    часто идёт служба. Съёмка внутри церквей обычно запрещена — спросите разрешения заранее. Машину оставляйте
    на узкой площадке перед воротами. Кафе и банкомата здесь нет, ближайшие в Озургети.
  route: >-
    От Тбилиси около 335 км и пять часов. По трассе E60 через Хашури, Рикотский участок, Кутаиси и Самтредиа,
    затем поворот на Ланчхути и Озургети. От Озургети до монастыря всего несколько километров: подъезд
    — узкий асфальт, последний отрезок крутой и местами разбитый. В сухую погоду машина эконом-класса
    справляется без труда, но последние повороты проходите медленно. Заправляйтесь в Озургети, дальше
    на сельской дороге заправок уже нет.
fa:
  name: صومعهٔ شموکمدی
  short: صومعهٔ آرامگاهی شاهزادگان گوریلی نزدیک اوزورگتی، با تاریخی پرآوازه در شمایل و فلزکاری.
  body: >-
    صومعهٔ شموکمدی روی دامنه‌ای در چند کیلومتری اوزورگتی ایستاده است و یکی از مراکز اصلی مذهبی گوریا به
    شمار می‌رود. مجموعه از دو کلیسا تشکیل شده و عمدتاً به سده‌های پانزدهم و شانزدهم بازمی‌گردد، هرچند
    این محل پیش از آن هم استفاده می‌شده است.


    اهمیت تاریخی آن به گوریلی‌ها گره خورده است، خاندان شاهزادگان گوریا، که شموکمدی برایشان هم مقر اسقفی
    بود و هم آرامگاه خانوادگی. بخشش‌های آنان گنجینهٔ پرآوازهٔ شموکمدی را ساخت: شمایل‌های کوبیده، صلیب‌های
    تشریفاتی و آثار زرگری که در شمار بهترین نمونه‌های بازماندهٔ هنر گرجی سده‌های میانه‌اند. بیشتر این
    اشیا امروز در گنجینهٔ موزهٔ ملی در تفلیس نگهداری می‌شوند و در محل قابل دیدن نیستند — خوب است پیش از
    رفتن این را بدانید.


    آنچه اینجا خواهید یافت روشن است: **دو کلیسای سنگی** در یک حیاط حصاردار با تکه‌هایی از نقاشی‌های دیواری،
    **یک برج ناقوس** و دیوارهای محوطه پیرامون آن، و **چشم‌اندازی به دشت گوریا** از مصطبهٔ صومعه. بازدید
    کوتاه است — یک ساعت کاملاً کافی است. صومعه فعال است و زندگی عادی کلیسایی بدون هیچ زیرساخت گردشگری
    در آن جریان دارد، و دقیقاً همین است که آن را در مقایسه با صومعه‌های شناخته‌شده‌تر گرجستان آرام و بی‌شتاب
    نگه داشته است.
  tip: >-
    این صومعه‌ای فعال است، پس قواعد پوشش جدی گرفته می‌شود: زنان به روسری و دامن بلند نیاز دارند و مردان
    به شلوار بلند. با شلوارک راهتان نمی‌دهند. صبح یا اواخر بعدازظهر بهتر از میانهٔ روز است، چون آن ساعت‌ها
    اغلب مراسم برگزار می‌شود. عکاسی درون کلیساها معمولاً مجاز نیست — پیش از بالا بردن دوربین بپرسید. خودرو
    را در محوطهٔ باریک روبه‌روی دروازه پارک کنید. اینجا نه کافه‌ای هست و نه خودپردازی؛ نزدیک‌ترینشان در
    اوزورگتی است.
  route: >-
    از تفلیس حدود 335 کیلومتر و پنج ساعت راه است. E60 را از خاشوری، مقطع ریکوتی، کوتایسی و سامتردیا دنبال
    کنید و بعد به سوی لانچخوتی و اوزورگتی بپیچید. از اوزورگتی تا صومعه فقط چند کیلومتر است: راه دسترسی
    آسفالتی باریک است و بخش پایانی تند و جاهایی شکسته. در هوای خشک خودروی اقتصادی بدون دشواری از پسش برمی‌آید،
    فقط پیچ‌های آخر را آرام بگیرید. باک را در اوزورگتی پر کنید، چون در جادهٔ روستایی بعد از آن پمپ‌بنزینی
    نیست.
he:
  name: מנזר שמוקמדי
  short: מנזר הקבורה של נסיכי גוריאלי ליד אוזורגטי, עם היסטוריה מפורסמת של איקונות ומלאכת מתכת.
  body: >-
    מנזר שמוקמדי עומד על מדרון כמה קילומטרים מאוזורגטי, והוא אחד המרכזים הדתיים החשובים ביותר של גוריה.
    המכלול מורכב משתי כנסיות ומתוארך בעיקר למאות ה-15 וה-16, אף שהאתר עצמו היה בשימוש עוד הרבה לפני כן.


    חשיבותו ההיסטורית קשורה לגוריאלי, בית הנסיכים של גוריה, שעבורם שימש שמוקמדי גם מושב הגמוני וגם מקום
    קבורה משפחתי. התרומות שלהם בנו את אוצר שמוקמדי המפורסם: איקונות מרוקעות, צלבי תהלוכה ומלאכת צורפות
    הנמנים עם הדוגמאות המשובחות ששרדו מן האמנות הגאורגית של ימי הביניים. רוב החפצים האלה שמורים היום באוצר
    המוזיאון הלאומי בטביליסי ואי אפשר לראותם באתר עצמו — כדאי לדעת את זה מראש ולא להגיע עם ציפייה אחרת.


    מה שתמצאו כאן: **שתי כנסיות אבן** בחצר מוקפת חומה אחת, ובהן שברי ציורי קיר; **מגדל פעמונים** וחומות
    המתחם שסביבו; ו**תצפית אל שפלת גוריה** ממרפסת המנזר. הביקור כאן קצר — שעה מספיקה בהחלט לכל המכלול.
    המנזר פעיל וחיי הקהילה הרגילים נמשכים בו בלי שום תשתית תיירותית, וזה בדיוק מה שהופך אותו לשקט ולנינוח
    בהשוואה למנזרים גאורגיים מוכרים יותר.
  tip: >-
    זהו מנזר פעיל, ולכן קוד הלבוש נאכף: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים. במכנסיים
    קצרים לא ייתנו לכם להיכנס. הבוקר או שעות אחר הצהריים המאוחרות עדיפים על אמצע היום, שבו נערכות התפילות
    לעיתים קרובות. הצילום בתוך הכנסיות אסור בדרך כלל — שאלו לפני שאתם מרימים מצלמה. החנו במשטח הצר שלפני
    השער. אין כאן בית קפה ואין כספומט; הקרובים ביותר נמצאים באוזורגטי.
  route: >-
    מטביליסי מדובר בכ-335 ק״מ ובכחמש שעות נסיעה. עקבו אחרי E60 דרך חשורי, קטע ריקוטי, קוטאיסי וסמטרדיה,
    ואז פנו לכיוון לאנצחוטי ואוזורגטי. מאוזורגטי המנזר רחוק רק כמה קילומטרים: הגישה היא אספלט צר, והקטע
    האחרון תלול ומשובש במקומות. במזג אוויר יבש רכב חסכוני מתמודד איתו בלי קושי, רק קחו את הפניות האחרונות
    לאט. תדלקו באוזורגטי, כי בדרך הכפרית שמעבר לה אין תחנות דלק.
ar:
  name: دير شيموكميدي
  short: دير الدفن الخاص بأمراء غورييلي قرب أوزورغيتي، بتاريخ شهير في الأيقونات والمشغولات المعدنية.
  body: >-
    يقف دير شيموكميدي على منحدر على بعد بضعة كيلومترات من أوزورغيتي، وهو أحد المراكز الدينية الرئيسية
    في غوريا. ويتألف المجمع من كنيستين ويعود أساساً إلى القرنين الخامس عشر والسادس عشر، وإن كان الموقع
    مستخدماً قبل ذلك.


    وترتبط أهميته التاريخية بأسرة غورييلي، بيت أمراء غوريا، إذ كان شيموكميدي مقراً أسقفياً ومدفناً عائلياً
    لهم معاً. وقد بنت هباتهم خزانة شيموكميدي الشهيرة: أيقونات مطروقة وصلبان مواكب ومشغولات ذهبية تُعد
    من أرقى ما بقي من الفن الجورجي في العصور الوسطى. ومعظم هذه القطع محفوظ اليوم في خزانة المتحف الوطني
    في تبليسي ولا يمكن رؤيته في الموقع — وهو أمر يحسن معرفته قبل الذهاب.


    وما تجده هنا: **كنيستان حجريتان** في فناء واحد مسوّر، وفيهما شذرات من الرسوم الجدارية؛ و**برج أجراس**
    وأسوار المجمع المحيطة به؛ و**إطلالة على سهل غوريا** من مصطبة الدير. الزيارة قصيرة — ساعة تكفي تماماً.
    والدير عامر تجري فيه حياة الرعية العادية بلا أي بنية سياحية، وهذا بالضبط ما يجعله هادئاً ومتمهلاً
    بالمقارنة مع الأديرة الجورجية الأشهر منه.
  tip: >-
    هذا دير عامر، ولذلك تُطبّق قواعد اللباس: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال إلى بنطال
    طويل. ولن يُسمح لك بالدخول بالشورت. والصباح أو أواخر العصر أفضل من منتصف النهار، حيث تُقام الصلوات
    غالباً. والتصوير داخل الكنائس غير مسموح عادة — فاسأل قبل أن ترفع الكاميرا. أوقف السيارة في المساحة
    الضيقة أمام البوابة. ولا مقهى هنا ولا صراف آلي؛ وأقربها في أوزورغيتي.
  route: >-
    المسافة من تبليسي نحو 335 كم وخمس ساعات. اتبع E60 عبر خاشوري ومقطع ريكوتي وكوتايسي وسامتريديا، ثم
    انعطف نحو لانتشخوتي وأوزورغيتي. ومن أوزورغيتي لا يبعد الدير سوى بضعة كيلومترات: طريق الوصول إسفلت
    ضيق، ومقطعه الأخير حاد ومتهالك في مواضع. وفي الطقس الجاف تتدبره سيارة اقتصادية بلا صعوبة، فقط خذ المنعطفات
    الأخيرة ببطء. املأ الخزان في أوزورغيتي، فلا محطات وقود على الطريق القروي بعدها.
