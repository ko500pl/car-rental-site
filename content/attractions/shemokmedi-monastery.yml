ka:
  name: შემოქმედის მონასტერი
  short: >-
    ორი ერთმანეთზე მიდგმული ტაძარი ბჟუჟის პირას — გურიელთა საძვალე, საეპისკოპოსო კათედრა და ციხე, რომელიც
    რუსებმა 1820 წელს მიწასთან გაასწორეს.
  body: >-
    **შემოქმედი ძვირფასის შესანახად აშენდა — აქ მთავრები სამარხებში განისვენებდნენ, ხატები ვერცხლის ჭედურ
    ჩარჩოებში ბრწყინავდნენ — და ოთხი საუკუნის განმავლობაში ეს სავანე თავის განძს თითქმის უვნებლად ინახავდა.**


    მონასტერი დაბალ გორაზე დგას, სოფელ შემოქმედისა და მდინარე ბჟუჟის თავზე, ოზურგეთიდან დაახლოებით შვიდ
    კილომეტრში. XV საუკუნეში გურიის მთავრებმა, გურიელებმა, აქ საეპისკოპოსო კათედრა დააარსეს და საგვარეულო
    საძვალედაც ეს ადგილი აირჩიეს. ერთ გალავანში ორი ტაძარი ერთმანეთს მხარით ეყრდნობა. უფროსი, მაცხოვრის
    ეკლესია, სამნავიანი ბაზილიკაა, სავარაუდოდ XIII–XIV საუკუნეებისა; მოგვიანებით ის ახალი პერანგით შემოსეს
    — სხვადასხვა ფერის ქვით, ჭადრაკულად განლაგებულით. იატაკი თეთრი მარმარილოსია, დასავლეთის სარკმელს ჩუქურთმა
    შემოუყვება. უმცროსი, გუმბათიანი „ზარზმა“, გურიელებმა XVI–XVII საუკუნეების მიჯნაზე ააგეს — გადმოცემით,
    მისი მშენებელი ვახტანგ გურიელი იყო. ოსმალებმა სამცხე დაიპყრეს და ზარზმის მონასტრიდან გადმოსვენებულ
    ფერისცვალების ხატს ახალი სავანე სჭირდებოდა. რვასარკმლიანი გუმბათის ყელი აქვე მოჭრილი მოცისფრო პორფირითაა
    მოპირკეთებული, კარის არქიტრავზე კი სამი ნიშანია ამოკვეთილი: თანაბარმკლავებიანი ჯვარი ექვსქიმიან და
    ხუთქიმიან ვარსკვლავებს შორის.


    ამ გორას მშვიდად ცხოვრება არ ეწერა. 1819–1820 წლების აჯანყებისას მონასტრის გვერდით მდგარი ციხე ამბოხებულ
    გურულთა მთავარი ბურჯი იყო; 1820 წლის 24 ივლისს გენერალმა ველიამინოვმა ის შტურმით აიღო და მიწასთან
    გაასწორა. 1881 წელს თბილისელმა ფოტოგრაფმა საბინ-გუსმა სიძველეები „რესტავრაციისთვის“ წაიღო და უკან
    აღარ დააბრუნა, 1919 წელს კი მონასტერი კიდევ ერთხელ გაძარცვეს. შემოქმედის საგანძურიდან რაც გადარჩა,
    დღეს თბილისის მუზეუმებშია დაცული.


    XVIII საუკუნეში ვახუშტი ბატონიშვილი ასე აღწერდა: „…არს შემოქმედი, ეკლესია დიდ შენი, გუნბათიანი, შემკული
    ყოვლითა“. ოქრო-ვერცხლი დიდი ხანია აქ აღარაა; დღეს ამ ტაძრის სამკაული სინათლეა. გვიან ნაშუადღევს მოდით,
    როცა დახრილი მზე ჭადრაკულ კედლებს ირიბად ეფინება და გუმბათის პორფირი, როგორც იქნა, თავის ცისფერს ამჟღავნებს.
  tip: >-
    მონასტერი მოქმედია და ჩაცმის წესი აქ მკაცრად დაცულია: ქალებს თავსაფარი და მუხლს ქვემოთ კაბა ან ქვედაბოლო
    სჭირდებათ, მამაკაცებს — გრძელი შარვალი; შორტებით ჭიშკარს ვერ გასცდებით. დილა წირვის დროა, განსაკუთრებით
    კვირასა და დღესასწაულებზე; სამუშაო დღის ნაშუადღევი უფრო წყნარია და კედლებზე სინათლეც მაშინაა საუკეთესო.
    ტაძრებში ფოტოს გადაღებამდე ნებართვა იკითხეთ. მანქანას ჭიშკრის წინ, პატარა მოედანზე დატოვებთ. კაფე
    და ბანკომატი აქ არ არის — ორივე შვიდ კილომეტრში, ოზურგეთშია. ლიხაურის ეკლესია და ჯუმათის მონასტერი
    შემოქმედთან ერთად ბუნებრივ ნახევარდღიან მარშრუტს ქმნის.
  route: >-
    თბილისიდან დაახლოებით 305 კმ-ია — გზას ოთხნახევარი ან ხუთი საათი დასჭირდება. ს1 (E60) მაგისტრალით
    დასავლეთისკენ მიდიხართ ხაშურის, რიკოთის მონაკვეთისა და ქუთაისის გავლით სამტრედიამდე, იქიდან ს12-ით
    ლანჩხუთისკენ და შემდეგ ოზურგეთამდე. ოზურგეთიდან შ45 გზას — ოზურგეთი–შემოქმედი–გომისმთა — დაადექით
    და დაახლოებით შვიდ კილომეტრს სამხრეთ-აღმოსავლეთით გაივლით სოფლამდე. მისასვლელი ვიწრო ასფალტია; მონასტრის
    გორაზე ამავალი ბოლო მოსახვევები ციცაბოა და ადგილ-ადგილ დაზიანებული, ამიტომ დაბალ გადაცემაზე აიარეთ.
    მშრალ ამინდში ეკონომ კლასის ავტომობილი უპრობლემოდ ადის. საწვავი ოზურგეთში შეავსეთ — სოფლის გზაზე ბენზინგასამართი
    სადგური არ არის.
en:
  name: Shemokmedi Monastery
  short: >-
    Two joined churches above the Bzhuzhi river: a Gurieli burial place, a bishop's seat, and a castle
    that Russian troops razed in 1820.
  body: >-
    **Shemokmedi was built to keep precious things safe — princes in their tombs, icons in their silver
    — and for four centuries it very nearly managed it.**


    The monastery stands on a low hill above the village of Shemokmedi and the Bzhuzhi river, about seven
    kilometres from Ozurgeti. In the fifteenth century the Gurieli, rulers of the Principality of Guria,
    made it the seat of a bishop and the burial ground of their house. Two churches lean together inside
    one wall. The elder, the Church of the Saviour, is a three-aisled basilica, probably of the thirteenth
    or fourteenth century, later re-clad in a chequerboard of different-coloured stone, with a white marble
    floor and a carved frame around its west window. The smaller domed church, called Zarzma, was added
    by the Gurieli around the turn of the seventeenth century — tradition names Prince Vakhtang Gurieli
    as its builder. The Ottomans had overrun Samtskhe, and the icon of the Transfiguration carried here
    from Zarzma Monastery needed a home. Zarzma's eight-windowed drum is faced with bluish porphyry cut
    close by, and above the door three signs are carved — a cross between a six-pointed and a five-pointed
    star.


    The hill was never left in peace. In the Gurian uprising of 1819–1820 the castle beside the monastery
    was the rebels' stronghold; on 24 July 1820 General Velyaminov stormed it and razed it. In 1881 a
    Tbilisi photographer, Sabin-Gus, carried off antiquities "for restoration" and never brought them
    back, and in 1919 the monastery was plundered again. What survives of the Shemokmedi treasury is now
    in museums in Tbilisi.


    In the eighteenth century Prince Vakhushti described "a church of great build, domed, adorned with
    everything". The gold has gone; the adornment now is light. Come late in the afternoon, when the sun
    rakes the chequered walls and the porphyry of the drum at last shows its blue.
  tip: >-
    A working monastery with a firm dress code: women need a headscarf and a skirt below the knee, men
    long trousers — shorts will not get you past the gate. Mornings belong to the liturgy, especially
    on Sundays and feast days; a weekday afternoon is quieter, and the light on the walls is better then
    too. Ask before photographing inside the churches. Parking is a small patch of ground in front of
    the gate. There is no café or ATM — Ozurgeti, seven kilometres away, has both. Likhauri church and
    Jumati Monastery make a natural half-day loop with Shemokmedi.
  route: >-
    From Tbilisi it is about 305 km; allow four and a half to five hours. Take the S1 (E60) west past
    Khashuri, through the Rikoti section and past Kutaisi to Samtredia, then the S12 towards Lanchkhuti
    and on to Ozurgeti. From Ozurgeti take the Sh45 — the Ozurgeti–Shemokmedi–Gomismta road — about seven
    kilometres south-east to the village. The approach is narrow asphalt; the last bends up the monastery
    hill are steep and broken in places, so take them in low gear. In dry weather an economy car copes
    easily. Fill up in Ozurgeti: there are no fuel stations on the village road.
ru:
  name: Монастырь Шемокмеди
  short: >-
    Две сросшиеся церкви над рекой Бжужи: усыпальница Гуриели, кафедра епископа и крепость, которую русские
    войска срыли в 1820 году.
  body: >-
    **Шемокмеди возвели, чтобы хранить драгоценное — князей в их гробницах, иконы в серебряных окладах,
    — и четыре века он почти справлялся с этой задачей.**


    Монастырь стоит на невысоком холме над селом Шемокмеди и рекой Бжужи, примерно в семи километрах от
    Озургети. В XV веке Гуриели, правители Гурийского княжества, сделали его кафедрой епископа и усыпальницей
    своего рода. Две церкви прислонились друг к другу внутри одной стены. Старшая, церковь Спасителя,
    — трёхнефная базилика, вероятно, XIII–XIV века, позднее облицованная шахматным узором из разноцветного
    камня, с белым мраморным полом и резной рамой вокруг западного окна. Меньшую купольную церковь, называемую
    Зарзма, Гуриели пристроили на рубеже XVI–XVII веков — предание называет её строителем князя Вахтанга
    Гуриели. Османы захватили Самцхе, и иконе Преображения, перенесённой сюда из Зарзмского монастыря,
    требовался новый дом. Восьмиоконный барабан Зарзмы облицован голубоватым порфиром, добытым здесь же,
    а над дверью вырезаны три знака — крест между шести- и пятиконечной звёздами.


    Холму не суждено было жить в покое. Во время Гурийского восстания 1819–1820 годов крепость рядом с
    монастырём была опорным пунктом повстанцев; 24 июля 1820 года генерал Вельяминов взял её штурмом и
    разрушил. В 1881 году тбилисский фотограф Сабин-Гус увёз древности «на реставрацию» и никогда не вернул
    их, а в 1919 году монастырь был разграблен снова. То, что осталось от сокровищницы Шемокмеди, сейчас
    хранится в музеях Тбилиси.


    В XVIII веке царевич Вахушти описывал «церковь великой постройки, купольную, всем украшенную». Золота
    давно нет; теперь её украшение — свет. Приезжайте под вечер, когда солнце скользит по шахматным стенам
    и порфир барабана наконец показывает свою синь.
  tip: >-
    Это действующий монастырь со строгим дресс-кодом: женщинам нужен платок и юбка ниже колена, мужчинам
    — длинные брюки, в шортах за ворота не пропустят. Утро принадлежит литургии, особенно по воскресеньям
    и в праздники; в будний день после обеда спокойнее, да и свет на стенах лучше. Перед съёмкой внутри
    церквей спросите разрешения. Парковка — небольшая площадка перед воротами. Кафе и банкомата здесь
    нет — оба есть в Озургети, в семи километрах. Церковь Лихаури и монастырь Джумати вместе с Шемокмеди
    складываются в естественный маршрут на полдня.
  route: >-
    Из Тбилиси около 305 км; на дорогу уйдёт от четырёх с половиной до пяти часов. Двигайтесь по S1 (E60)
    на запад через Хашури, Рикотский участок и Кутаиси до Самтредиа, затем по S12 в сторону Ланчхути и
    далее до Озургети. Из Озургети сверните на Sh45 — дорогу Озургети–Шемокмеди–Гомисмта — и проедьте
    около семи километров на юго-восток до села. Подъезд — узкий асфальт; последние повороты в гору к
    монастырю крутые и местами разбитые, берите их на пониженной передаче. В сухую погоду машина эконом-класса
    справится без труда. Заправьтесь в Озургети: на сельской дороге заправок нет.
fa:
  name: صومعهٔ شمکمدی
  short: >-
    دو کلیسای به‌هم‌پیوسته بر فراز رود بژوژی: آرامگاه گوریِلی‌ها، کرسی اسقفی، و قلعه‌ای که سپاهیان روسی
    در ۱۸۲۰ ویران کردند.
  body: >-
    **شمکمدی برای نگاهبانی از چیزهای گران‌بها ساخته شد — شاهزادگان در آرامگاه‌هایشان، شمایل‌ها در قاب‌های
    نقره‌شان — و چهار قرن تقریباً در این کار موفق بود.**


    این صومعه بر تپه‌ای نه‌چندان بلند، بر فراز روستای شمکمدی و رود بژوژی، در حدود هفت کیلومتری اوزورگتی
    ایستاده است. در سدهٔ پانزدهم، گوریِلی‌ها، فرمانروایان شاهزاده‌نشین گوریا، آن را کرسی اسقفی و آرامگاه
    خانوادهٔ خود کردند. دو کلیسا در درون یک دیوار به هم تکیه داده‌اند. کهن‌تر، کلیسای منجی، بازیلیکایی
    سه‌شبستانی است، احتمالاً از سدهٔ سیزدهم یا چهاردهم، که بعدها با نقشی شطرنجی از سنگ‌های رنگارنگ روکش
    شد، با کفی از مرمر سفید و قابی منبت‌کاری‌شده گرداگرد پنجرهٔ غربی‌اش. کلیسای کوچک‌تر و گنبددار، به‌نام
    زارزما، را گوریِلی‌ها در حدود آغاز سدهٔ هفدهم افزودند — روایت‌ها سازندهٔ آن را شاهزاده واختانگ گوریِلی
    می‌دانند. عثمانی‌ها سامتسخه را درنوردیده بودند، و شمایل تجلی، که از صومعهٔ زارزما بدین‌جا آورده شده
    بود، نیازمند خانه‌ای بود. طبل هشت‌پنجرهٔ زارزما با سنگ پورفیر آبی‌رنگی که در همان نزدیکی بریده شده،
    روکش شده، و بالای در سه نشان تراشیده شده‌اند — صلیبی میان ستاره‌ای شش‌پر و ستاره‌ای پنج‌پر.


    این تپه هرگز آرام نماند. در شورش گوریایی سال‌های ۱۸۱۹–۱۸۲۰، قلعهٔ کنار صومعه پایگاه شورشیان بود؛ در
    ۲۴ ژوئیهٔ ۱۸۲۰ ژنرال ولیامینوف آن را به یورش گرفت و با خاک یکسان کرد. در ۱۸۸۱ عکاسی تفلیسی به‌نام
    سابین-گوس آثار عتیقه را «برای بازسازی» برد و هرگز بازنگرداند، و در ۱۹۱۹ صومعه بار دیگر تاراج شد. آنچه
    از خزانهٔ شمکمدی باقی مانده، اکنون در موزه‌های تفلیس نگه‌داری می‌شود.


    در سدهٔ هجدهم شاهزاده واخوشتی آن را چنین وصف کرد: «کلیسایی با بنایی بزرگ، گنبددار، آراسته به هر چیز».
    طلا رفته است؛ زیور اکنون روشنایی است. در واپسین ساعات بعدازظهر بیایید، وقتی خورشیدِ مایل بر دیوارهای
    شطرنجی می‌لغزد و پورفیر طبل، سرانجام، آبی‌اش را نشان می‌دهد.
  tip: >-
    این صومعه‌ای فعال است با قواعد پوشش سختگیرانه: زنان به روسری و دامنی زیر زانو نیاز دارند، مردان به
    شلوار بلند — با شلوارک از دروازه نمی‌گذرید. صبح‌ها وقت آیین عشای ربانی است، به‌ویژه یکشنبه‌ها و روزهای
    جشن؛ بعدازظهر روزهای هفته آرام‌تر است، و نور بر دیوارها هم آن‌گاه بهتر است. پیش از عکس‌گرفتن در درون
    کلیساها اجازه بخواهید. پارکینگ قطعه‌زمینی کوچک در برابر دروازه است. کافه یا خودپردازی اینجا نیست —
    هر دو در اوزورگتی، هفت کیلومتری، هستند. کلیسای لیخائوری و صومعهٔ جوماتی همراه با شمکمدی مسیری طبیعی
    نیم‌روزه می‌سازند.
  route: >-
    از تفلیس نزدیک به ۳۰۵ کیلومتر است؛ چهار ساعت و نیم تا پنج ساعت زمان بگیرید. از S1 (E60) به سوی غرب،
    از خاشوری و بخش ریکوتی و کوتایسی گذشته، تا سامتردیا برانید، سپس از S12 به سوی لانچخوتی و از آن‌جا
    تا اوزورگتی. از اوزورگتی، Sh45 — راه اوزورگتی–شمکمدی–گومیسمتا — را در پیش گیرید و نزدیک به هفت کیلومتر
    به سوی جنوب‌شرق تا روستا بروید. راه ورودی آسفالت باریکی است؛ پیچ‌های پایانی به‌سوی تپهٔ صومعه تند
    و جای‌جای شکسته و ناهموارند، پس با دندهٔ سنگین برانید. در هوای خشک، خودرویی اقتصادی به‌آسانی از پس
    آن برمی‌آید. در اوزورگتی سوخت‌گیری کنید: در راه روستا پمپ بنزینی نیست.
he:
  name: מנזר שמוקמדי
  short: >-
    שתי כנסיות מחוברות מעל נהר בז'וז'י: מקום קבורתם של הגוריאלי, מושבו של בישוף, ומצודה שכוחות רוסיים
    החריבו ב־1820.
  body: >-
    **שמוקמדי נבנה כדי לשמור על יקרי ערך — נסיכים בקבריהם, איקונות במסגרות הכסף שלהן — וארבע מאות שנה
    הוא הצליח בכך כמעט לחלוטין.**


    המנזר עומד על גבעה נמוכה מעל כפר שמוקמדי ונהר בז'וז'י, כשבעה קילומטרים מאוזורגטי. במאה החמש־עשרה עשו
    הגוריאלי, שליטי נסיכות גוריה, אותו למקום מושבו של בישוף ולבית הקברות של משפחתם. שתי כנסיות נשענות
    זו על זו בתוך חומה אחת. הוותיקה, כנסיית המושיע, היא בזיליקה בעלת שלוש ספינות, כנראה מהמאה השלוש־עשרה
    או הארבע־עשרה, שכוסתה מאוחר יותר בתבנית שחמט של אבנים בצבעים שונים, עם רצפת שיש לבנה ומסגרת מגולפת
    סביב חלון המערב. הכנסייה הקטנה יותר בעלת הכיפה, הקרויה זרזמה, נוספה בידי הגוריאלי בסביבות ראשית המאה
    השבע־עשרה — המסורת מייחסת את בנייתה לנסיך וחטנג גוריאלי. העות'מאנים כבשו את סמצחה, והאיקונה של ההשתנות
    שהובאה לכאן ממנזר זרזמה נזקקה לבית. תוף שמונה החלונות של זרזמה מחופה בפורפיר כחלחל שנחצב בקרבת מקום,
    ומעל הפתח מגולפים שלושה סימנים — צלב בין כוכב שש־קצוות לכוכב חמש־קצוות.


    לגבעה הזו לא היה מנוח. במרד בגוריה של 1819–1820 הייתה המצודה שלצד המנזר מעוזם של המורדים; ב-24 ביולי
    1820 הסתער עליה הגנרל וליאמינוב, כבש אותה והחריב אותה עד היסוד. ב-1881 לקח הצלם הטביליסי סבין-גוס
    עתיקות "לשיפוץ" ולעולם לא החזירן, וב-1919 נשדד המנזר שוב. מה שנותר מאוצר שמוקמדי מוחזק כיום במוזיאונים
    בטביליסי.


    במאה השמונה־עשרה תיאר הנסיך וחושטי "כנסייה בעלת מבנה גדול, כיפתית, מקושטת בכול". הזהב אבד; הקישוט
    כיום הוא האור. הגיעו בשעות אחר הצהריים המאוחרות, כשהשמש הנמוכה מחליקה על הקירות המשובצים כלוח שחמט
    והפורפיר של התוף מגלה סוף־סוף את כחלחלותו.
  tip: >-
    זהו מנזר פעיל עם קוד לבוש נוקשה: נשים זקוקות לכיסוי ראש ולחצאית מתחת לברך, גברים למכנסיים ארוכים —
    במכנסיים קצרים לא תעברו את השער. הבוקר שייך לתפילה, במיוחד בימי ראשון ובחגים; אחר הצהריים באמצע השבוע
    שקט יותר, וגם האור על הקירות טוב יותר אז. שאלו רשות לפני צילום בתוך הכנסיות. החניה היא חלקת קרקע קטנה
    לפני השער. אין בית קפה או כספומט — שניהם באוזורגטי, שבעה קילומטרים משם. כנסיית ליחאורי ומנזר ג'ומאטי
    יוצרים עם שמוקמדי מסלול טבעי לחצי יום.
  route: >-
    מטביליסי כ-305 ק"מ; הקצו ארבע וחצי עד חמש שעות. סעו ב-S1 (E60) מערבה, ליד חשורי, בקטע ריקוטי וליד
    קוטאיסי עד סמטרדיה, ואז ב-S12 לכיוון לנצ'חוטי ומשם לאוזורגטי. מאוזורגטי סעו ב-Sh45 — כביש אוזורגטי–שמוקמדי–גומיסמטה
    — כשבעה קילומטרים דרומית-מזרחית לכפר. הגישה היא אספלט צר; העיקולים האחרונים במעלה גבעת המנזר תלולים
    ומשובשים פה ושם, לכן סעו בהילוך נמוך. במזג אוויר יבש רכב חסכוני יתמודד בקלות. תדלקו באוזורגטי: אין
    תחנות דלק בכביש הכפר.
ar:
  name: دير شيموكميدي
  short: 'كنيستان متلاصقتان فوق نهر بجوجي: مدفن الغورييلي، وكرسي أسقفي، وقلعة دمّرتها القوات الروسية عام
    1820.'
  body: >-
    **بُني شيموكميدي ليحفظ النفائس — الأمراء في قبورهم، والأيقونات في فضتها — وقد كاد أن ينجح في ذلك طوال
    أربعة قرون.**


    يقع الدير على تلة منخفضة فوق قرية شيموكميدي ونهر بجوجي، على نحو سبعة كيلومترات من أوزورغيتي. وفي القرن
    الخامس عشر جعله الغورييلي، حكام إمارة غوريا، كرسيًا أسقفيًا ومدفنًا لأسرتهم. تتلاصق كنيستان داخل سور
    واحد. الأقدم، كنيسة المخلّص، بازيليكا ثلاثية الأروقة، يُرجَّح أنها من القرن الثالث عشر أو الرابع عشر،
    أُعيد تكسيتها لاحقًا بنقشة شطرنجية من حجارة متعددة الألوان، وأرضها من المرمر الأبيض، وحول نافذتها
    الغربية إطار محفور. والكنيسة الأصغر ذات القبة، المسمّاة زارزما، أضافها الغورييلي نحو مطلع القرن السابع
    عشر — ويذكر التقليد أن بانيها هو الأمير فاختانغ غورييلي. فقد كان العثمانيون قد اجتاحوا سامتسخي، وكانت
    أيقونة التجلّي المحمولة إلى هنا من دير زارزما تحتاج بيتًا. وقد كُسيت رقبة قبة زارزما ذات النوافذ الثماني
    بحجر البورفير المزرقّ المستخرج من مكان قريب، وفوق بابها نُقشت ثلاث علامات: صليب بين نجمة سداسية ونجمة
    خماسية.


    لم يُترك التلّ في سلام قط. فأثناء انتفاضة غوريا 1819–1820 كانت القلعة المجاورة للدير معقل الثوار؛
    وفي 24 يوليو 1820 اقتحمها الجنرال فيليامينوف وسوّاها بالأرض. وفي عام 1881 حمل المصوّر التبليسي سابين-غوس
    تحفًا أثرية «للترميم» ولم يُعِدها قط، وفي عام 1919 نُهب الدير مرة أخرى. وما تبقّى من خزانة شيموكميدي
    محفوظ اليوم في متاحف تبليسي.


    في القرن الثامن عشر وصفها الأمير فاخوشتي بأنها «كنيسة عظيمة البناء، ذات قبة، مزخرفة بكل شيء». ذهب
    الذهب؛ وزينتها اليوم هي النور. تعال في وقت متأخر من بعد الظهر، حين تنساب أشعة الشمس المائلة على الجدران
    ذات النقش الشطرنجي ويُظهر بورفير الرقبة زرقته أخيرًا.
  tip: >-
    هذا دير عامر بالرهبان، وله قواعد لباس صارمة: تحتاج النساء إلى غطاء رأس وتنورة تحت الركبة، والرجال
    إلى سراويل طويلة — لن تعبر البوابة بالشورت. الصباح للقداس، لا سيما أيام الأحد والأعياد؛ أما بعد ظهر
    أيام الأسبوع فأهدأ، والضوء على الجدران أفضل حينها أيضًا. اطلب الإذن قبل التصوير داخل الكنائس. الموقف
    رقعة أرض صغيرة أمام البوابة. لا يوجد مقهى أو صراف آلي — يوجد كلاهما في أوزورغيتي، على بعد سبعة كيلومترات.
    تشكّل كنيسة ليخاوري ودير جوماتي مع شيموكميدي مسارًا طبيعيًا لنصف يوم.
  route: >-
    من تبليسي نحو 305 كم؛ خصص من أربع ساعات ونصف إلى خمس ساعات. اتخذ الطريق S1 (E60) غربًا عبر خاشوري،
    وقطاع ريكوتي، ومرورًا بكوتايسي حتى سامتريديا، ثم الطريق S12 نحو لانتشخوتي ومنه إلى أوزورغيتي. من أوزورغيتي،
    اتخذ الطريق Sh45 — طريق أوزورغيتي–شيموكميدي–غوميسمتا — نحو سبعة كيلومترات جنوب شرقًا إلى القرية. المسار
    الأخير إسفلت ضيق؛ والمنعطفات الأخيرة صعودًا إلى تلة الدير حادة ومتشققة في مواضع، فاصعدها بغيار منخفض.
    في الطقس الجاف تتدبر سيارة اقتصادية أمرها بسهولة. تزوَّد بالوقود في أوزورغيتي: لا توجد محطات وقود
    على طريق القرية.
