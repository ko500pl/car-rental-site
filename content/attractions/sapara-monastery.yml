ka:
  name: საფარის მონასტერი
  short: >-
    ჯაყელთა საგვარეულო მონასტერი ახალციხის ზემოთ, ტყიანი ხეობის ბოლოს — კედლებზე სამცხის მთავართა XIV
    საუკუნის პორტრეტებით.
  body: >-
    **საფარა თავს ადვილად არ გაჩვენებთ: გზა ტყიან ხეობას მიუყვება და მონასტერი მხოლოდ ბოლოს გამოჩნდება
    — ვარდისფერ-ყვითელი კლდის რაფაზე მიკრული.**


    ბერები აქ არაუგვიანეს X საუკუნიდან მოღვაწეობდნენ, მაგრამ საფარის დიდება სამცხის მფლობელ ჯაყელებს უკავშირდება:
    XIII–XIV საუკუნეებში მათ მონასტერი თავიანთ რეზიდენციად და საგვარეულო საძვალედ აქციეს. სარგის I ჯაყელმა
    მონღოლებთან გონივრული ურთიერთობით სამცხეს იმ დროისთვის იშვიათი მშვიდობა შეუნარჩუნა; გადმოცემით, სიბერეში
    ბერად აღიკვეცა და საბა ეწოდა. მისმა ძემ, ბექამ, XIII–XIV საუკუნეთა მიჯნაზე წმინდა საბას გუმბათოვანი
    ტაძარი ააგო, ხუროთმოძღვრის, ფარეზასძის, სახელი კი წარწერამ შემოგვინახა. რაფა ისე ვიწრო იყო, რომ ტაძრისთვის
    შვეული კლდის ქიმზე საგანგებო საყრდენის ამოყვანა დასჭირდათ.


    ტაძრის XIV საუკუნის მოხატულობა საგვარეულო მატიანესავით იკითხება. სამხრეთ კედლის ქვედა რიგში წმინდა
    საბა და სამცხის მმართველები დგანან — სარგის I, ბექა და ბექას ძეები, სარგის II და ყვარყვარე; ზემოთ
    საუფლო დღესასწაულებია, დასავლეთ კედელზე — განკითხვის დღე, გუმბათში — ამაღლება. გვერდით მიძინების ეკლესიაა,
    კომპლექსის უძველესი ნაგებობა. XIX საუკუნეში რუსმა ბერებმა მისი კედლები კირით შელესეს; რესტავრაციისას
    ბათქაში მოაცილეს და ქვეშ დამალული ფრესკები და ჩუქურთმა გამოჩნდა. ეკლესიის მწვანე ქვის კანკელი, XI
    საუკუნის რელიეფებით, დღეს საქართველოს ხელოვნების მუზეუმში ინახება. სამრეკლოს ქვედა სართული ჯაყელთა
    ვასალების, ლასურისძეების, სამარხი იყო — მათი პორტრეტები კედლებზე დღესაც ჩანს.


    XVI–XVII საუკუნეთა მიჯნაზე, სამცხეში ოსმალთა დამკვიდრების შემდეგ, წმინდა საბას ხატი იმერეთში, სოფელ
    ჩხარში გაიხიზნა და საფარა დაცარიელდა. ქართველი ბერები XIX საუკუნის 50-იან წლებში დაბრუნდნენ, 1893
    წელს რუსული მონასტერი დაარსდა, დღეს კი საფარა კვლავ მოქმედი სავანეა.


    საღამოსკენ ამოდით, როცა ტყე წყნარდება და ზარის ხმა ხეობაში ეშვება — ოღონდ დაბნელებამდე დაბრუნდით:
    ხეობის გზა ვიწროა და განათება არ აქვს.
  tip: >-
    ეს მოქმედი მონასტერია: ქალებს თავსაფარი და გრძელი ქვედაბოლო სჭირდებათ, მამაკაცებს — გრძელი შარვალი;
    შორტებით შესვლა არ შეიძლება. ეკლესიებში ფოტოგადაღება, როგორც წესი, ნებადართული არ არის — ჯერ იკითხეთ;
    წირვის დროს ხმადაბლა ილაპარაკეთ. გზა მონასტერთან მთავრდება: მანქანა ჭიშკრის ქვემოთ, პატარა მოედანზე
    დატოვეთ და ბოლო რამდენიმე წუთი ფეხით აიარეთ. კაფე, მაღაზია და ბანკომატი აქ არ არის — წყალი და ნაღდი
    ფული ახალციხიდან, დაახლოებით 10 კილომეტრიდან, წამოიღეთ. ეკლესიებში ბინდია: სანამ პორტრეტებს მოძებნით,
    თვალს შეჩვევის დრო მიეცით. საფარა ახალციხის რაბათთან ერთად ერთ დღეში კარგად ეწყობა.
  route: >-
    თბილისიდან E60-ით (ს-1) დასავლეთით ხაშურამდე, შემდეგ ს-8-ით, ბორჯომის ხეობით, ახალციხემდე — სულ დაახლოებით
    205 კმ. ახალციხეში საფარის ქუჩას გაჰყევით ქალაქიდან სამხრეთ-აღმოსავლეთით; შემდეგ შ-125 ტყიან ხეობას
    დაახლოებით 8 კილომეტრზე აუყვება და მონასტრის ქვემოთ მთავრდება. სულ დაახლოებით 215 კმ და 3 საათი და
    35 წუთი. ბოლო მონაკვეთი ვიწრო და კლაკნილია, ასფალტი ადგილ-ადგილ ჩამონგრეულია, მოსახვევებში კი ორი
    მანქანა ძლივს ცდება ერთმანეთს — ამიტომ კროსოვერი ან ჯიპი აჯობებს, განსაკუთრებით წვიმის შემდეგ და ზამთარში.
    საწვავი ახალციხეში ჩაასხით.
en:
  name: Sapara Monastery
  short: >-
    The Jaqeli family's monastery at the head of a wooded valley above Akhaltsikhe, its walls painted
    with 14th-century portraits of Samtskhe's rulers.
  body: >-
    **Sapara keeps itself hidden: the road threads a wooded valley, and only at the very end does the
    monastery appear, pinned to a ledge of pink and yellow rock.**


    Monks lived here by the 10th century, but Sapara's great age belongs to the Jaqeli, lords of Samtskhe,
    who in the 13th and 14th centuries made it their residence and family burial place. Sargis I Jaqeli
    kept his land at peace by staying on terms with the Mongols; in old age, tradition says, he became
    a monk under the name Saba. His son Beka built the domed church of St Saba at the turn of the 14th
    century, and its architect, Parezasdze, left his name in an inscription. The ledge was so narrow that
    a special support had to be raised from the cliff edge to carry the church.


    The 14th-century murals inside read like a family chronicle. Along the lower south wall stand St Saba
    and the rulers of Samtskhe: Sargis I, Beka, and Beka's sons Sargis II and Kvarkvare. Above them run
    the Great Feasts, the Last Judgement fills the west wall and the Ascension the dome. Next door, the
    Dormition church, the oldest building here, was limewashed by 19th-century Russian monks; restoration
    stripped the lime and revealed frescoes and carving underneath. Its green stone chancel screen, carved
    in the 11th century, is now in the Art Museum of Georgia. The ground floor of the bell tower was the
    crypt of the Lasuridze, Jaqeli vassals, whose painted portraits survive.


    When the Ottomans settled in Samtskhe around 1600, the icon of St Saba was carried off to Chkhari
    in Imereti and Sapara emptied. Georgian monks returned in the 1850s, a Russian community followed
    in 1893, and today it is again a working monastery.


    Come towards evening, when the forest goes quiet and the bell carries down the valley — but leave
    before dark: the valley road is narrow and unlit.
  tip: >-
    This is a working monastery: women need a headscarf and a skirt, men long trousers, and nobody goes
    in wearing shorts. Photography inside the churches is usually not allowed, so ask first, and keep
    your voice low during services. The road ends by the monastery; park on the small terrace below the
    gate and walk up the last few minutes. There is no café, shop or ATM, so bring water and cash from
    Akhaltsikhe, about 10 km away. The churches are dim inside, so give your eyes a minute before you
    look for the portraits. Sapara pairs naturally with Rabati Castle in Akhaltsikhe.
  route: >-
    From Tbilisi take the E60 (S1) west to Khashuri, then the S8 through the Borjomi gorge to Akhaltsikhe,
    about 205 km in all. In Akhaltsikhe follow Sapara Street out of town to the south-east; the Sh125
    then climbs roughly 8 km up a wooded valley and ends just below the monastery. The total is about
    215 km, around 3 h 35 min. The last stretch is narrow and winding, the asphalt is broken in places
    and two cars barely pass on the bends. A crossover or SUV is the comfortable choice, especially after
    rain or in winter. Fill up in Akhaltsikhe.
ru:
  name: Монастырь Сапара
  short: >-
    Монастырь рода Джакели в верховье лесистой долины над Ахалцихе; на его стенах — портреты правителей
    Самцхе XIV века.
  body: >-
    **Сапара не спешит показываться: дорога петляет по лесистой долине, и лишь в самом её конце появляется
    монастырь, прижатый к уступу розовато-жёлтой скалы.**


    Монахи жили здесь уже в X веке, но великая пора Сапары связана с Джакели, владетелями Самцхе, которые
    в XIII–XIV веках сделали её своей резиденцией и родовой усыпальницей. Саргис I Джакели хранил мир
    на своей земле, умея ладить с монголами; на склоне лет, по преданию, он принял постриг с именем Савва.
    Его сын Бека на рубеже XIV века выстроил купольную церковь Святого Саввы, и её зодчий Парезасдзе оставил
    своё имя в надписи. Уступ был так узок, что для церкви пришлось возвести от края обрыва особую опору.


    Росписи XIV века внутри читаются как семейная хроника. В нижнем ярусе южной стены стоят святой Савва
    и правители Самцхе: Саргис I, Бека и сыновья Беки — Саргис II и Кваркваре. Над ними тянутся сцены
    великих праздников, западную стену занимает Страшный суд, купол — Вознесение. По соседству церковь
    Успения, старейшая постройка монастыря, была побелена русскими монахами в XIX веке; реставраторы сняли
    известь и открыли под ней фрески и резьбу. Её алтарная преграда из зелёного камня, вырезанная в XI
    веке, теперь хранится в Художественном музее Грузии. Нижний ярус колокольни служил усыпальницей Ласуридзе,
    вассалов Джакели, — их расписные портреты сохранились.


    Когда около 1600 года в Самцхе утвердились османы, икону Святого Саввы увезли в Чхари в Имерети, и
    Сапара опустела. Грузинские монахи вернулись в 1850-х, в 1893 году появилась русская община, а сегодня
    обитель снова действует.


    Приезжайте ближе к вечеру, когда лес затихает и звон колокола уходит вниз по долине, — но уезжайте
    засветло: дорога в долине узкая и не освещена.
  tip: >-
    Это действующий монастырь: женщинам нужны платок и юбка, мужчинам — длинные брюки, в шортах не пускают
    никого. Фотографировать внутри церквей обычно нельзя — сначала спросите, а во время службы говорите
    вполголоса. Дорога заканчивается у монастыря; оставьте машину на небольшой площадке ниже ворот и поднимитесь
    последние несколько минут пешком. Кафе, магазина и банкомата нет, так что воду и наличные берите в
    Ахалцихе, примерно в 10 км. Внутри церквей сумрачно: дайте глазам минуту привыкнуть, прежде чем искать
    портреты. Сапару естественно совместить с крепостью Рабати в Ахалцихе.
  route: >-
    Из Тбилиси по E60 (S1) на запад до Хашури, затем по S8 через Боржомское ущелье до Ахалцихе — всего
    около 205 км. В Ахалцихе по улице Сапара выезжайте из города на юго-восток; дальше дорога Sh125 около
    8 км поднимается по лесистой долине и заканчивается прямо под монастырём. Итого около 215 км и примерно
    3 ч 35 мин. Последний участок узкий и извилистый, асфальт местами разбит, а на поворотах две машины
    едва разъезжаются. Удобнее всего кроссовер или внедорожник, особенно после дождя и зимой. Заправьтесь
    в Ахалцихе.
fa:
  name: صومعهٔ ساپارا
  short: >-
    صومعهٔ خاندان جاقلی در بالای دره‌ای جنگلی نزدیک آخالتسیخه، با دیوارهایی که چهرهٔ فرمانروایان سامتسخه
    در سدهٔ چهاردهم بر آن‌ها نقش بسته است.
  body: >-
    **ساپارا خود را پنهان نگه می‌دارد: جاده در دره‌ای جنگلی پیچ‌وتاب می‌خورد و تنها در انتهای راه، صومعه
    پدیدار می‌شود، چسبیده به لبه‌ای از صخرهٔ صورتی و زرد.**


    راهبان از سدهٔ دهم در این‌جا می‌زیستند، اما دوران شکوه ساپارا از آنِ خاندان جاقلی، فرمانروایان سامتسخه،
    است که در سده‌های سیزدهم و چهاردهم آن را اقامتگاه و آرامگاه خانوادگی خود کردند. سرگیس یکم جاقلی با
    کنار آمدن با مغولان سرزمینش را در آرامش نگه داشت؛ بنا بر روایت، در پیری راهب شد و نام سابا را برگزید.
    پسرش بکا در آستانهٔ سدهٔ چهاردهم کلیسای گنبددار سابای قدیس را ساخت و معمارش، پارزاسدزه، نام خود را
    در کتیبه‌ای به یادگار گذاشت. لبهٔ صخره چنان باریک بود که برای نگه داشتن کلیسا ناچار تکیه‌گاهی ویژه
    از لبهٔ پرتگاه برافراشتند.


    نقاشی‌های دیواری سدهٔ چهاردهم در درون، همچون وقایع‌نامهٔ یک خاندان خوانده می‌شوند. در ردیف پایینی
    دیوار جنوبی، سابای قدیس و فرمانروایان سامتسخه ایستاده‌اند: سرگیس یکم، بکا، و پسران بکا، سرگیس دوم
    و کوارکواره. بالای سرشان صحنه‌های جشن‌های بزرگ کلیسا ردیف شده، داوری واپسین دیوار غربی را پر کرده
    و عروج مسیح گنبد را. در همسایگی، کلیسای خفتن مریم مقدس، کهن‌ترین بنای این‌جا، را راهبان روس در سدهٔ
    نوزدهم آهک‌اندود کردند؛ مرمت، آهک را زدود و نقاشی‌ها و کنده‌کاری‌های زیرین را آشکار کرد. دیوارهٔ محراب
    آن از سنگ سبز، که در سدهٔ یازدهم تراشیده شده، اکنون در موزهٔ هنر گرجستان است. طبقهٔ همکف برج ناقوس
    سردابهٔ آرامگاهیِ خاندان لاسوریدزه، دست‌نشاندگان جاقلی‌ها، بود و چهره‌نگاره‌های رنگی آنان بر جا مانده
    است.


    هنگامی که عثمانیان حدود سال ۱۶۰۰ در سامتسخه مستقر شدند، شمایل سابای قدیس را به چخاری در ایمرتی بردند
    و ساپارا خالی شد. راهبان گرجی در دههٔ ۱۸۵۰ بازگشتند، در ۱۸۹۳ جماعتی از راهبان روس از پی آنان آمدند،
    و امروز این‌جا بار دیگر صومعه‌ای فعال است.


    نزدیک غروب بیایید، وقتی جنگل خاموش می‌شود و بانگ ناقوس در دره فرو می‌رود؛ اما پیش از تاریکی برگردید،
    چون جادهٔ دره باریک است و چراغ ندارد.
  tip: >-
    این‌جا صومعه‌ای فعال است: بانوان روسری و دامن لازم دارند و آقایان شلوار بلند، و هیچ‌کس با شلوارک وارد
    نمی‌شود. عکاسی درون کلیساها معمولاً مجاز نیست؛ پس اول بپرسید و هنگام مراسم آهسته سخن بگویید. جاده
    کنار صومعه به پایان می‌رسد؛ خودرو را در سکوی کوچکی پایین‌تر از دروازه پارک کنید و چند دقیقهٔ آخر را
    پیاده بالا بروید. نه کافه‌ای هست، نه مغازه و نه خودپرداز؛ پس آب و پول نقد را از آخالتسیخه، حدود ۱۰
    کیلومتر آن‌سوتر، همراه بیاورید. درون کلیساها نیمه‌تاریک است؛ یک دقیقه به چشم‌هایتان فرصت دهید و بعد
    به دنبال چهره‌نگاره‌ها بگردید. دیدار از ساپارا را به‌آسانی می‌توان با قلعهٔ رباطی در آخالتسیخه در
    یک روز همراه کرد.
  route: >-
    از تفلیس جادهٔ E60 (S1) را رو به غرب تا خاشوری بگیرید، سپس از راه S8 و از میان تنگهٔ بورجومی تا آخالتسیخه
    بروید؛ روی هم حدود ۲۰۵ کیلومتر. در آخالتسیخه خیابان ساپارا را به سوی جنوب شرقی تا بیرون شهر دنبال
    کنید؛ از آن‌جا جادهٔ Sh125 حدود ۸ کیلومتر در دره‌ای جنگلی بالا می‌رود و درست پایین صومعه به پایان
    می‌رسد. مجموع راه حدود ۲۱۵ کیلومتر و نزدیک ۳ ساعت و ۳۵ دقیقه است. تکهٔ پایانی باریک و پرپیچ است، آسفالت
    جابه‌جا شکسته و در پیچ‌ها دو خودرو به‌زحمت از کنار هم می‌گذرند. کراس‌اوور یا شاسی‌بلند انتخاب راحت‌تری
    است، به‌ویژه پس از باران یا در زمستان. در آخالتسیخه باک را پر کنید.
he:
  name: מנזר סאפארה
  short: מנזר משפחת ג'אקלי בראש עמק מיוער מעל אחלציחה, שעל קירותיו דיוקנאות של שליטי סמצחה מן המאה ה-14.
  body: >-
    **סאפארה אינה ממהרת להתגלות: הדרך מתפתלת בעמק מיוער, ורק בקצה ממש מופיע המנזר, צמוד למדף של סלע ורדרד
    וצהוב.**


    נזירים חיו כאן כבר במאה ה-10, אבל תור הזהב של סאפארה שייך לבית ג'אקלי, אדוני סמצחה, שבמאות ה-13 וה-14
    הפכו אותה למקום מושבם ולמקום קבורת המשפחה. סרגיס הראשון ג'אקלי שמר על השקט בארצו בזכות יחסים תקינים
    עם המונגולים; לפי המסורת, לעת זקנתו נעשה נזיר בשם סאבא. בנו, בקה, בנה בסוף המאה ה-13 ובתחילת ה-14
    את כנסיית סאבא הקדוש בעלת הכיפה, והאדריכל שלה, פרזסדזה, השאיר את שמו בכתובת. המדף היה צר כל כך, שנדרש
    להקים מקצה הצוק תמך מיוחד שיישא את הכנסייה.


    ציורי הקיר מן המאה ה-14 שבפנים נקראים כמו כרוניקה משפחתית. בחלק התחתון של הקיר הדרומי עומדים סאבא
    הקדוש ושליטי סמצחה: סרגיס הראשון, בקה, ובניו של בקה – סרגיס השני וקווארקווארה. מעליהם נמשכות סצנות
    החגים הגדולים של הכנסייה, יום הדין ממלא את הקיר המערבי ועליית ישו השמימה את הכיפה. בסמוך, את כנסיית
    הדורמיציון (הירדמות מרים), המבנה העתיק ביותר במקום, סיידו נזירים רוסים במאה ה-19; השיקום הסיר את הסיד
    וחשף מתחתיו ציורי קיר וגילופים. מחיצת המזבח שלה, מאבן ירוקה וגולפה במאה ה-11, נמצאת כיום במוזיאון
    האמנות של גאורגיה. הקומה התחתונה של מגדל הפעמונים שימשה קריפטה למשפחת לסורידזה, וסאלים של בית ג'אקלי,
    ודיוקנאותיהם המצוירים שרדו.


    כשהעות'מאנים התבססו בסמצחה בסביבות שנת 1600, נלקחה האיקונה של סאבא הקדוש לצ'חארי שבאימרתי, וסאפארה
    התרוקנה. נזירים גאורגים חזרו בשנות ה-50 של המאה ה-19, קהילה רוסית באה אחריהם ב-1893, וכיום זהו שוב
    מנזר פעיל.


    בואו לקראת ערב, כשהיער משתתק וצליל הפעמון מתגלגל במורד העמק – אבל צאו לדרך חזרה לפני החשכה: הכביש
    בעמק צר ואינו מואר.
  tip: >-
    זהו מנזר פעיל: נשים זקוקות למטפחת ראש ולחצאית, גברים למכנסיים ארוכים, ואיש אינו נכנס במכנסיים קצרים.
    צילום בתוך הכנסיות בדרך כלל אסור, לכן שאלו קודם, ובזמן תפילה דברו בשקט. הדרך מסתיימת ליד המנזר; חנו
    ברחבה הקטנה שמתחת לשער ועלו ברגל את הדקות האחרונות. אין בית קפה, חנות או כספומט, לכן הביאו מים ומזומן
    מאחלציחה, כ-10 ק״מ משם. בתוך הכנסיות חשוך למחצה, אז תנו לעיניים דקה להתרגל לפני שתחפשו את הדיוקנאות.
    נוח לשלב את סאפארה באותו יום עם ביקור במצודת רבאטי שבאחלציחה.
  route: >-
    מטביליסי סעו מערבה בכביש E60 (S1) עד חשורי, ומשם בכביש S8 דרך ערוץ בורג'ומי עד אחלציחה – כ-205 ק״מ
    בסך הכול. באחלציחה צאו מהעיר ברחוב סאפארה לכיוון דרום-מזרח; משם כביש Sh125 מטפס כ-8 ק״מ במעלה עמק
    מיוער ומסתיים ממש מתחת למנזר. בסך הכול כ-215 ק״מ ובערך 3 שעות ו-35 דקות. הקטע האחרון צר ומפותל, האספלט
    שבור במקומות, ובסיבובים שתי מכוניות בקושי עוברות זו את זו. קרוסאובר או רכב שטח הם הבחירה הנוחה, במיוחד
    אחרי גשם או בחורף. תדלקו באחלציחה.
ar:
  name: دير سابارا
  short: دير أسرة جاكيلي في أعلى وادٍ مشجّر فوق أخالتسيخي، تحمل جدرانه صور حكّام سامتسخي من القرن الرابع
    عشر.
  body: >-
    **سابارا لا تكشف نفسها بسهولة: يتلوّى الطريق في وادٍ مشجّر، ولا يظهر الدير إلا عند نهايته، معلّقاً
    على حافة من صخر وردي وأصفر.**


    عاش الرهبان هنا منذ القرن العاشر، لكن العصر الذهبي لسابارا ارتبط بأسرة جاكيلي، سادة سامتسخي، الذين
    جعلوها في القرنين الثالث عشر والرابع عشر مقرّاً لهم ومدفناً للعائلة. حفظ سرغيس الأول جاكيلي السلام
    في أرضه بمداراة المغول؛ ويقول التقليد إنه ترهّب في شيخوخته باسم سابا. وبنى ابنه بيكا عند مطلع القرن
    الرابع عشر كنيسة القديس سابا ذات القبة، وترك معماريّها باريزاسدزه اسمه في نقش كتابي. وكانت الحافة
    من الضيق بحيث اقتضى الأمر إقامة دعامة خاصة من طرف الجرف لتحمل الكنيسة.


    تُقرأ الرسوم الجدارية التي تعود إلى القرن الرابع عشر في الداخل كأنها سجلّ عائلي. ففي الصف السفلي من
    الجدار الجنوبي يقف القديس سابا وحكّام سامتسخي: سرغيس الأول، وبيكا، وابنا بيكا سرغيس الثاني وكفاركفاري.
    وفوقهم تمتد مشاهد الأعياد الكبرى، ويملأ مشهد الدينونة الأخيرة الجدار الغربي، ومشهد الصعود القبة. وفي
    الجوار كنيسة رقاد السيدة العذراء، أقدم مباني الموقع، التي طلاها رهبان روس بالجير في القرن التاسع عشر؛
    ثم أزال الترميم الجير فكشف ما تحته من رسوم ونقوش. أما حاجز الهيكل المنحوت من الحجر الأخضر في القرن
    الحادي عشر فهو اليوم في متحف جورجيا للفنون. وكان الطابق الأرضي من برج الأجراس مدفناً لأسرة لاسوريدزه،
    أتباع آل جاكيلي، ولا تزال صورهم الملوّنة باقية.


    وحين استقر العثمانيون في سامتسخي نحو عام 1600، نُقلت أيقونة القديس سابا إلى تشخاري في إيميريتي وخلت
    سابارا من أهلها. عاد رهبان جورجيون في خمسينيات القرن التاسع عشر، وتبعتهم جماعة روسية عام 1893، وهي
    اليوم ديرٌ عامر من جديد.


    تعالَ قُبيل المساء، حين يسكن الغاب ويتردّد صوت الجرس نزولاً في الوادي، لكن غادر قبل حلول الظلام، فطريق
    الوادي ضيق وغير مضاء.
  tip: >-
    هذا دير عامر: تحتاج النساء إلى غطاء للرأس وتنورة، والرجال إلى سراويل طويلة، ولا يدخل أحد بسراويل قصيرة.
    التصوير داخل الكنائس غير مسموح عادة، فاستأذن أولاً، واخفض صوتك أثناء الصلوات. ينتهي الطريق عند الدير؛
    اركن سيارتك في الساحة الصغيرة أسفل البوابة واصعد سيراً الدقائق الأخيرة. لا مقهى ولا متجر ولا صراف
    آلي، فاحمل الماء والنقود من أخالتسيخي على بعد نحو 10 كم. الكنائس معتمة من الداخل، فامنح عينيك دقيقة
    قبل أن تبحث عن الصور. ويسهل الجمع بين زيارة سابارا وقلعة رباطي في أخالتسيخي في يوم واحد.
  route: >-
    من تبليسي اسلك الطريق E60 (S1) غرباً حتى خاشوري، ثم الطريق S8 عبر مضيق بورجومي حتى أخالتسيخي، نحو
    205 كم إجمالاً. في أخالتسيخي اتبع شارع سابارا خارج المدينة نحو الجنوب الشرقي؛ ثم يصعد الطريق Sh125
    نحو 8 كم في وادٍ مشجّر وينتهي أسفل الدير مباشرة. المجموع نحو 215 كم، قرابة 3 ساعات و35 دقيقة. المقطع
    الأخير ضيق ومتعرّج، والأسفلت متكسّر في مواضع، وبالكاد تتسع المنعطفات لمرور سيارتين. سيارة كروس أوفر
    أو دفع رباعي هي الخيار المريح، خاصة بعد المطر أو في الشتاء. املأ خزانك في أخالتسيخي.
