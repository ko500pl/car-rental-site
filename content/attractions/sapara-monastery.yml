ka:
  name: საფარის მონასტერი
  short: ახალციხესთან, ციცაბო კლდის ტერასაზე მიმალული მოქმედი მონასტერი XIII საუკუნის ფრესკებით.
  body: >
    საფარა ახალციხიდან სამხრეთ-აღმოსავლეთით, ვიწრო ხეობის ბოლოს, კლდის ტერასაზეა აშენებული. ადგილი განზრახ
    არის შერჩეული ისე, რომ ქვემოდან თითქმის არ ჩანდეს — სახელიც სწორედ „მიფარულს“ ნიშნავს. სწორედ ამ დამალულობამ
    გადაარჩინა მონასტერი მაშინ, როცა სამცხის დანარჩენი სავანეები ნადგურდებოდა.


    მონასტერი ჯერ კიდევ IX–X საუკუნეებში არსებობდა, თუმცა მისი აყვავება ჯაყელთა სამთავროს დროს დადგა.
    XIII საუკუნის ბოლოს ბექა ჯაყელმა აქ ააგო **წმინდა საბას სახელობის მთავარი ეკლესია**, რომელიც დღემდე
    კომპლექსის ცენტრია. მისი კედლები ამავე ეპოქის მოხატულობას ინახავს — შუა საუკუნეების ქართული ფერწერის
    ერთ-ერთი მნიშვნელოვანი ნიმუშია.


    კომპლექსში სულ ათამდე ეკლესია და სამლოცველოა, სამრეკლო, საცხოვრებელი კორპუსები და ნაწილობრივ შემორჩენილი
    გალავანი. მონასტერი მოქმედია, ბერები აქ მუდმივად ცხოვრობენ.


    რაზე უნდა გაამახვილო ყურადღება:


    - წმინდა საბას ეკლესიის ფრესკები და საკურთხევლის მოხატულობა

    - ხედი ხეობაზე ტერასის კიდიდან

    - სიჩუმე, რომელიც აქ ვარძიისგან განსხვავებით ნამდვილად არის — ტურისტული ავტობუსები აქამდე იშვიათად
    ადიან


    საფარა ახალციხიდან მხოლოდ ნახევარ საათშია და რაბათის ვიზიტს ბუნებრივად ემატება.


    საფარას ეზოდან ხეობა ღრმად ჩანს და ტერასის კიდეზე რამდენიმე პატარა სამლოცველოა კლდეში ჩაშენებული.
    კომპლექსში სიარული თავისუფალია, თუმცა ნაწილი საცხოვრებელი კორპუსია და იქ შესვლა არ შეიძლება. ბერები
    ჩვეულებრივ მშვიდად რეაგირებენ სტუმრებზე, თუ ხმას არ იმაღლებ და კამერას ეკლესიაში არ შეიტან.
  tip: >-
    ეს მოქმედი მონასტერია: ქალებს თავსაფარი და გრძელი კაბა სჭირდებათ, მამაკაცებს — გრძელი შარვალი; შორტებით
    არ შეუშვებენ. ფოტოს გადაღება ეკლესიის შიგნით ჩვეულებრივ არ არის ნებადართული. მოდი დილით ან შუადღის
    შემდეგ, ლოცვის საათებში სიჩუმეს გაუფრთხილდი. მანქანა კომპლექსის ქვემოთ, პატარა მოედანზე დატოვე. ტუალეტი
    მარტივია, კაფე და ბანკომატი არაა — უახლოესი ახალციხეშია, ოცდაათი კილომეტრის მანძილზე.
  route: >
    თბილისიდან ჩვეული გზით ხაშურამდე, შემდეგ ბორჯომსა და ახალციხემდე — ორას თხუთმეტ კილომეტრამდე და დაახლოებით
    სამი საათი ნახევარი. ახალციხიდან სამხრეთ-აღმოსავლეთით უხვევ და ბოლო რვა-ცხრა კილომეტრი ვიწრო, ციცაბო
    სერპანტინია: ასფალტი არსებობს, მაგრამ ადგილ-ადგილ ჩამონგრეულია და მოხვევებში ორი მანქანა ძლივს ცილდება.
    სწორედ ამიტომ სჯობს კროსოვერი. ზამთარში ან წვიმის შემდეგ ეს მონაკვეთი შესამჩნევად რთულდება. საწვავი
    ახალციხეში აავსე, ზემოთ არაფერია. ბოლო მონაკვეთზე ავტობუსები ვერ ადიან, ამიტომ ორგანიზებული ჯგუფები
    აქ იშვიათია — პარკინგზე ადგილი თითქმის ყოველთვის მოიძებნება.
en:
  name: Sapara Monastery
  short: An active monastery hidden on a cliff terrace near Akhaltsikhe, with 13th-century frescoes.
  body: >-
    Sapara stands southeast of Akhaltsikhe at the end of a tight valley, built onto a terrace in the cliff
    face. The location was chosen so that the monastery is almost invisible from below — the name itself
    means hidden. That concealment is largely why it survived while other monasteries of Meskheti were
    destroyed.


    A community existed here by the 9th or 10th century, but Sapara flourished under the Jaqeli princes.
    At the end of the 13th century Beka Jaqeli built **the main church of St Saba**, which remains the
    centre of the complex. Its walls carry painting from the same period, one of the significant surviving
    examples of medieval Georgian wall art.


    Altogether the site holds around a dozen churches and chapels, a bell tower, monastic quarters and
    partly preserved defensive walls. It is an active monastery with a permanent community of monks.


    Worth focusing on:


    - the frescoes of St Saba's church and the painted sanctuary

    - the view down the valley from the edge of the terrace

    - the quiet, which unlike at Vardzia is genuine — coaches rarely make the climb


    Sapara is only half an hour from Akhaltsikhe and pairs naturally with a visit to Rabati Castle on
    the same day.
  tip: >-
    This is a working monastery: women need a headscarf and a long skirt, men long trousers, and shorts
    will not get you in. Photography inside the churches is normally not permitted. Come in the morning
    or mid-afternoon, and keep quiet during services. Leave the car on the small terrace below the complex
    and walk the last stretch up. Toilets are basic; there is no cafe and no ATM, with the nearest in
    Akhaltsikhe about thirty kilometres back.
  route: >-
    From Tbilisi take the usual road to Khashuri, then Borjomi and Akhaltsikhe — roughly 215 km and three
    and a half hours. From Akhaltsikhe turn southeast; the final eight or nine kilometres are a narrow,
    steep serpentine. Asphalt exists but has collapsed in places, and two cars barely pass each other
    on the bends, which is why a crossover is the better choice. After rain or in winter this section
    becomes noticeably harder. Fill up in Akhaltsikhe, because there is nothing at all above the town.
ru:
  name: Монастырь Сапара
  short: Действующий монастырь, спрятанный на скальной террасе под Ахалцихе, с фресками XIII века.
  body: >
    Сапара стоит к юго-востоку от Ахалцихе, в конце тесного ущелья, на террасе в скальной стене. Место
    выбрано так, чтобы монастырь почти не был виден снизу — само название означает «укрытый». Именно эта
    скрытность во многом и спасла обитель, когда другие монастыри Месхети разрушались.


    Община существовала здесь уже в IX-X веках, но расцвет пришёлся на время князей Джакели. В конце XIII
    века Бека Джакели построил **главный храм во имя святого Саввы**, который до сих пор остаётся центром
    комплекса. Его стены хранят роспись той же эпохи — один из значимых сохранившихся образцов средневековой
    грузинской живописи.


    Всего на территории около десятка церквей и часовен, колокольня, жилые корпуса и частично уцелевшие
    стены. Монастырь действующий, здесь постоянно живёт братия.


    На что обратить внимание:


    - фрески храма святого Саввы и роспись алтаря

    - вид на ущелье с края террасы

    - тишина, которая здесь, в отличие от Вардзии, настоящая: автобусные группы поднимаются сюда редко


    От Ахалцихе до Сапары всего полчаса, и визит естественно дополняет осмотр крепости Рабат в тот же
    день.


    Со двора Сапары ущелье просматривается на всю глубину, а по краю террасы встроено в скалу несколько
    небольших часовен. По комплексу можно ходить свободно, но часть построек жилая, и туда заходить нельзя.
    Монахи обычно спокойно относятся к гостям, если не повышать голос и не заносить камеру в храм.
  tip: >-
    Это действующий монастырь: женщинам нужен платок и длинная юбка, мужчинам — длинные брюки, в шортах
    не пустят. Съёмка внутри храмов обычно запрещена. Приезжайте утром или после полудня, во время службы
    соблюдайте тишину. Машину оставляйте на небольшой площадке ниже комплекса и последний отрезок пройдите
    пешком. Туалет простой, кафе и банкомата нет — ближайшие в Ахалцихе, километрах в тридцати.
  route: >-
    Из Тбилиси обычной дорогой до Хашури, затем Боржоми и Ахалцихе — около 215 км и три с половиной часа.
    От Ахалцихе поворот на юго-восток, последние восемь-девять километров — узкий крутой серпантин. Асфальт
    есть, но местами обвалился, а на поворотах две машины расходятся с трудом, поэтому лучше ехать на
    кроссовере. После дождя и зимой этот участок заметно усложняется. Заправляйтесь в Ахалцихе: выше нет
    ни заправок, ни магазинов.
fa:
  name: صومعهٔ ساپارا
  short: صومعه‌ای فعال، پنهان روی مصطبه‌ای در دل صخره نزدیک آخالتسیخه، با نقاشی‌های دیواری سدهٔ سیزدهم.
  body: >-
    ساپارا در جنوب‌شرق آخالتسیخه، در انتهای دره‌ای تنگ ایستاده است و روی مصطبه‌ای در دیوارهٔ صخره بنا
    شده. جای آن چنان انتخاب شده که صومعه از پایین تقریباً دیده نمی‌شود — خود نام هم یعنی پنهان. همین پنهان‌بودن
    تا حد زیادی دلیل آن است که ساپارا زنده ماند، در حالی که دیگر صومعه‌های مسختی ویران شدند.


    جماعتی دینی تا سدهٔ نهم یا دهم اینجا شکل گرفته بود، اما شکوفایی ساپارا زیر دست شاهزادگان جاقلی رخ
    داد. در پایان سدهٔ سیزدهم بکا جاقلی **کلیسای اصلی سنت سابا** را ساخت که هنوز هستهٔ مجموعه است. دیوارهای
    آن نقاشی‌هایی از همان دوره دارد، یکی از نمونه‌های مهم بازمانده از نقاشی دیواری گرجی سده‌های میانه.
    روی هم رفته در این محوطه نزدیک دوازده کلیسا و نمازخانه، یک برج ناقوس، حجره‌های راهبان و دیوارهای دفاعی
    نیمه‌سالم هست. صومعه فعال است و جماعتی دائمی از راهبان در آن زندگی می‌کنند.


    آنچه بیش از همه ارزش دقت دارد: نقاشی‌های کلیسای سنت سابا و محراب مصور آن؛ منظرهٔ دره از لبهٔ مصطبه
    به پایین؛ و سکوتی که برخلاف واردزیا واقعی است، چون اتوبوس‌های گردشگری به‌ندرت این سربالایی را بالا
    می‌آیند. ساپارا فقط نیم ساعت با آخالتسیخه فاصله دارد و به‌خوبی با بازدید از قلعهٔ راباتی در همان روز
    جفت می‌شود.
  tip: >-
    این صومعه‌ای فعال است: زنان به روسری و دامن بلند نیاز دارند و مردان به شلوار بلند، و با شلوارک راهتان
    نمی‌دهند. عکاسی درون کلیساها معمولاً مجاز نیست. صبح یا اواسط بعدازظهر بیایید و در طول مراسم سکوت را
    نگه دارید. خودرو را روی مصطبهٔ کوچک زیر مجموعه بگذارید و آخرین بخش را پیاده بالا بروید. سرویس بهداشتی
    ابتدایی است؛ نه کافه‌ای هست و نه خودپردازی، و نزدیک‌ترینشان در آخالتسیخه است، حدود سی کیلومتر عقب‌تر.
  route: >-
    از تفلیس جادهٔ همیشگی را تا خاشوری بگیرید، بعد بورجومی و آخالتسیخه — تقریباً 215 کیلومتر و سه ساعت
    و نیم. از آخالتسیخه به جنوب‌شرق بپیچید؛ هشت‌نه کیلومتر آخر سربالایی مارپیچ و باریکی است. آسفالت هست
    اما جاهایی فرو ریخته و دو خودرو به‌زحمت در پیچ‌ها از کنار هم رد می‌شوند، و به همین دلیل کراس‌اوور
    انتخاب بهتری است. پس از باران یا در زمستان این مقطع به‌طور محسوسی سخت‌تر می‌شود. باک را در آخالتسیخه
    پر کنید، چون بالاتر از شهر هیچ چیز نیست.
he:
  name: מנזר סאפארה
  short: מנזר פעיל החבוי על מדף בצוק ליד אחאלציחה, ובו ציורי קיר מן המאה ה-13.
  body: >-
    סאפארה עומד דרומית-מזרחית לאחאלציחה בקצה עמק צר, בנוי על מדף בתוך קיר הצוק. המקום נבחר כך שהמנזר כמעט
    אינו נראה מלמטה — והשם עצמו פירושו נסתר. ההסתתרות הזאת היא במידה רבה הסיבה לכך שהוא שרד, בעוד מנזרים
    אחרים של מסחתי נהרסו.


    קהילה נזירית התקיימה כאן כבר במאה התשיעית או העשירית, אבל פריחתו האמיתית של סאפארה הגיעה תחת נסיכי
    ג'קלי. בסוף המאה ה-13 בנה בקה ג'קלי את **הכנסייה המרכזית של סבא הקדוש**, שנותרה עד היום ליבו של המכלול.
    על קירותיה ציור מאותה תקופה, אחת הדוגמאות החשובות ששרדו מציור הקיר הגאורגי של ימי הביניים. בסך הכול
    יש באתר כתריסר כנסיות וקפלות, מגדל פעמונים, מגורי נזירים וחומות הגנה ששרדו בחלקן. זהו מנזר פעיל ובו
    קהילת נזירים קבועה.


    מה שכדאי במיוחד להתעכב עליו: ציורי הקיר של כנסיית סבא הקדוש וקודש הקודשים המצויר שלה; המבט מטה אל
    העמק מקצה המדף; והשקט, שבניגוד לוורדזיה הוא אמיתי — אוטובוסים מאורגנים כמעט אינם מטפסים לכאן. סאפארה
    נמצא חצי שעה בלבד מאחאלציחה ומשתלב באופן טבעי עם ביקור במבצר רבאטי באותו יום.
  tip: >-
    זהו מנזר פעיל: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים, ובמכנסיים קצרים לא ייתנו
    לכם להיכנס. הצילום בתוך הכנסיות אסור בדרך כלל. הגיעו בבוקר או באמצע אחר הצהריים, ושמרו על שקט בזמן
    התפילות. השאירו את הרכב על המדף הקטן שמתחת למכלול ועלו את הקטע האחרון ברגל. השירותים בסיסיים; אין
    כאן בית קפה ואין כספומט, והקרוב ביותר נמצא באחאלציחה, כשלושים קילומטרים לאחור.
  route: >-
    מטביליסי סעו בדרך הרגילה עד חשורי, ומשם לבורג'ומי ולאחאלציחה — כ-215 ק״מ ושלוש שעות וחצי. מאחאלציחה
    פנו דרומה-מזרחה; שמונת או תשעת הקילומטרים האחרונים הם סרפנטינה צרה ותלולה. יש אספלט, אך הוא קרס במקומות,
    ושתי מכוניות בקושי חולפות זו על פני זו בפניות — ולכן קרוסאובר הוא הבחירה הנכונה יותר. אחרי גשם או
    בחורף הקטע הזה נעשה קשה בהרבה. תדלקו באחאלציחה, כי מעל העיר אין שום דבר.
ar:
  name: دير سابارا
  short: دير عامر مختبئ على مصطبة في وجه الجرف قرب أخالتسيخي، برسوم جدارية من القرن الثالث عشر.
  body: >-
    يقف دير سابارا جنوب شرق أخالتسيخي عند نهاية واد ضيق، مبنياً على مصطبة داخل وجه الجرف. وقد اختير الموقع
    بحيث يكاد الدير لا يُرى من الأسفل — والاسم نفسه يعني المختبئ. وهذا الاختفاء هو إلى حد بعيد سبب بقائه،
    بينما دُمّرت أديرة ميسخيتي الأخرى.


    كانت هنا جماعة رهبانية منذ القرن التاسع أو العاشر، لكن ازدهار سابارا الحقيقي جاء في ظل أمراء جاكيلي.
    وفي أواخر القرن الثالث عشر بنى بيكا جاكيلي **كنيسة القديس سابا الرئيسية**، التي ما زالت قلب المجمع.
    وتحمل جدرانها رسوماً من الحقبة نفسها، وهي من أهم الأمثلة الباقية على التصوير الجداري الجورجي في العصور
    الوسطى. ويضم الموقع إجمالاً نحو اثنتي عشرة كنيسة وكنيسة صغيرة، وبرج أجراس، ومساكن الرهبان، وأسواراً
    دفاعية حُفظ جزء منها. وهو دير عامر تقيم فيه جماعة رهبان دائمة.


    وما يستحق التركيز عليه: رسوم كنيسة القديس سابا وهيكلها المصوَّر؛ والإطلالة نزولاً على الوادي من حافة
    المصطبة؛ والهدوء، وهو هنا حقيقي بخلاف فاردزيا، لأن الحافلات السياحية نادراً ما تصعد هذا الطريق. ولا
    يبعد سابارا عن أخالتسيخي سوى نصف ساعة، وهو يقترن طبيعياً بزيارة قلعة راباتي في اليوم نفسه.
  tip: >-
    هذا دير عامر: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال إلى بنطال طويل، ولن يُسمح لك بالدخول
    بالشورت. والتصوير داخل الكنائس غير مسموح عادة. تعال في الصباح أو منتصف العصر، والتزم الصمت أثناء الصلوات.
    اترك السيارة على المصطبة الصغيرة أسفل المجمع واصعد المقطع الأخير سيراً. دورات المياه بدائية؛ ولا مقهى
    ولا صراف آلي، وأقربها في أخالتسيخي على بعد نحو ثلاثين كيلومتراً إلى الخلف.
  route: >-
    من تبليسي اسلك الطريق المعتاد حتى خاشوري، ثم بورجومي فأخالتسيخي — نحو 215 كم وثلاث ساعات ونصف. ومن
    أخالتسيخي انعطف جنوباً شرقاً؛ والكيلومترات الثمانية أو التسعة الأخيرة طريق ملتوٍ ضيق وشديد الانحدار.
    الإسفلت موجود لكنه منهار في مواضع، وتكاد سيارتان لا تتجاوزان بعضهما عند المنعطفات، ولهذا فالكروس أوفر
    هو الخيار الأفضل. وبعد المطر أو في الشتاء يصبح هذا المقطع أصعب بوضوح. املأ الخزان في أخالتسيخي، فلا
    شيء إطلاقاً فوق البلدة.
