ka:
  name: ატენის ხეობის მარნები
  short: >-
    ოჯახური მარნები გორის სამხრეთით, ტანას ხეობაში — ატენურის სამშობლო, ჩინურისა და გორული მწვანისგან
    დაყენებული მკვეთრი, ცქრიალა ღვინისა.
  body: >-
    **ატენი კახეთს არ ეჯიბრება: მისი ღვინო სხვა ენაზე ლაპარაკობს — მსუბუქად და მკვეთრად.**


    გორის სამხრეთით მდინარე ტანა თრიალეთის ქედის მთისწინეთში ვიწრო ხეობას ჭრის. ვენახები ფერდობებზე ზღვის
    დონიდან 620–750 მეტრამდე ადის, ღვინის ზონას კი სამი სოფელი ინაწილებს — პატარა ატენი, გარდატენი და
    დიდი ატენი. ღვინის ქარხნის ჭიშკარსა და შუშის სადეგუსტაციო დარბაზებს აქ ნუ დაეძებთ: მარნები ოჯახების
    სახლების ქვეშაა, ქვევრები კი იატაკშია ჩაფლული.


    ატენური დაცული ადგილწარმოშობის დასახელებაა — ჩალისფერი ცქრიალა თეთრი ღვინო ჩინურისა და გორული მწვანისგან,
    რომელსაც ბუშტუკებს მეორადი დუღილი აჩენს. ჩინურს სახელი „ჩინებულისგან“ დაჰყვა და ამ სახელს სიმძიმით
    კი არა, მჟავიანობით იმართლებს. ჯიში ნელა მწიფდება და სრულ სიმწიფეს მხოლოდ ოქტომბრის ბოლოს აღწევს —
    ამიტომაც რთველი ამ ხეობაში გვიან დგება.


    ორგანიზებულ ღვინის მარშრუტს ნუ მოელით. ვიზიტს სასტუმრო სახლის ან ადგილობრივი ნაცნობის მეშვეობით აწყობენ;
    ბარათით გადახდა და ინგლისური ენა აქ იშვიათობაა. სამაგიეროდ მიიღებთ იმას, რასაც ვერცერთი ღვინის ბარი
    ვერ გაითამაშებს: ნესტიანი თიხისა და ჭაჭის სურნელით გაჟღენთილ გრილ მარანს, ძაფზე ასხმულ ჩურჩხელებს
    და მასპინძელს, რომელიც ქვევრიდან ამოღებულ ღვინოს ჭიქაში ჩამოგისხამთ და თქვენს აზრს სრულიად სერიოზულად
    დაელოდება.


    ხეობა ყოველთვის ასე წყნარი არ ყოფილა. ვენახებს შორის VII საუკუნის ატენის სიონი დგას, რომლის კედლებზეც
    ორი ქართული დამწერლობის — ნუსხურისა და მხედრულის — უძველესი ცნობილი თარიღიანი წარწერებია შემორჩენილი.
    ერთი წარწერა გვამცნობს, რომ XI საუკუნის 60-იან წლებში ბაგრატ IV-მ ატენში მთელი ქალაქის აშენება ბრძანა.
    ქალაქი გაქრა. ვენახები დარჩა.
  tip: >-
    სამი საათი გამოყავით და ვიზიტი ატენის სიონის ნახვას დაუკავშირეთ — ეკლესია აქედან დაახლოებით ერთ კილომეტრშია.
    მარნის მონახულება ერთი-ორი დღით ადრე შეათანხმეთ გორის ან ატენის სასტუმრო სახლის მეშვეობით: მოულოდნელ
    სტუმარს კარს ალბათ მაინც გაუღებენ, მაგრამ მასპინძლისთვის ეს უსამართლობაა. ვინ დაჯდება საჭესთან, პირველ
    ჭიქამდე გადაწყვიტეთ — ქართულ სუფრაზე უარის თქმა ძნელია. ოქტომბერი რთველის დროა: სტუმრობისთვის საუკეთესო
    თვე და ის დრო, როცა სოფლის ვიწრო გზებს ტრაქტორები იკავებენ. ხეობაში ბანკომატი არ არის — ლარი თან იქონიეთ,
    მათ შორის შინ წასაღები ღვინისთვის.
  route: >-
    თბილისიდან E60 (S1) მაგისტრალით დასავლეთისკენ გაემართეთ და ოთხზოლიანი ჩქაროსნული გზით 86 კილომეტრი
    გორამდე გაიარეთ. გორთან სამხრეთით, ხიდისთავის გავლით, ტანას ხეობაში შეუხვიეთ. მთელი გზა 94 კილომეტრია,
    დაახლოებით საათი და ოცდახუთი წუთი. ხეობის გზა ვიწროა, ასფალტი ადგილ-ადგილ დაკემსილი და დაზიანებული,
    ზედა სოფლებში კი ხრეშზე გადადის; ეკონომკლასის მანქანა მშრალ ამინდში უპრობლემოდ გაივლის. საწვავი გორში
    ჩაასხით — ხეობაში ბენზინგასამართი სადგური არ არის. სოფლის შესახვევები მჭიდროა, ამიტომ მანქანა ეკლესიასთან
    ან იქ დააყენეთ, სადაც მასპინძელი გირჩევთ.
en:
  name: Ateni Valley Wine Cellars
  short: >-
    Family cellars in the Tana gorge south of Gori, home of Atenuri: a crisp, pale sparkling white made
    from Chinuri and Goruli Mtsvane.
  body: >-
    **Kakheti has the fame; the Ateni gorge has the edge.**


    South of Gori the Tana river cuts a narrow valley into the foothills of the Trialeti range. Vineyards
    climb its slopes between 620 and 750 metres, and three villages, Patara Ateni, Gardateni and Didi
    Ateni, share the wine zone. Do not look for château gates or glass-walled tasting rooms: the cellars
    lie beneath family houses, their qvevri sunk into the floor.


    The wine is Atenuri, a protected appellation of origin: a straw-pale sparkling white made from Chinuri
    and Goruli Mtsvane, its bubbles raised by a second fermentation. Chinuri takes its name from *chinebuli*,
    "excellent", and earns it through acidity rather than weight. It ripens slowly, reaching full maturity
    only in late October, so the rtveli, the grape harvest, comes late to this gorge.


    This is not an organised wine route. Visits are arranged through a guesthouse or a local contact,
    and card payment and English are rare. In return you get what no tasting bar can stage: a cool cellar
    smelling of damp clay and pressed grape skins, churchkhela drying on strings, and a host who fills
    your glass from the qvevri and waits, quite seriously, for your verdict.


    The valley was not always this quiet. Among the vines stands Ateni Sioni, a 7th-century church whose
    walls carry the earliest known dated inscriptions in two Georgian scripts, nuskhuri and mkhedruli.
    One inscription records that in the 1060s King Bagrat IV ordered a whole town to be built at Ateni.
    The town has vanished. The vineyards have not.
  tip: >-
    Give it three hours and pair it with Ateni Sioni, about a kilometre away. Arrange a cellar visit a
    day or two ahead through a guesthouse in Gori or Ateni; an unannounced knock may still be answered,
    but it is unfair on the host. Settle who is driving before the first glass, because Georgian hospitality
    makes refusing hard. October is harvest time: the best month to come, and the month when tractors
    own the lanes. There is no cash machine in the valley, so bring lari, including for wine to take home.
  route: >-
    Leave Tbilisi westbound on the E60 (S1) and follow the fast dual carriageway 86 km to Gori. There,
    turn south via Khidistavi into the Tana gorge. The whole trip is 94 km, about 1 hour 25 minutes. The
    gorge road is narrow, its asphalt patched and broken in places, and it turns to gravel in the upper
    villages; an economy car copes easily in dry weather. Fill up in Gori, as there is no filling station
    in the valley. The village lanes are tight, so park by the church or wherever your host suggests.
ru:
  name: Винные погреба Атенского ущелья
  short: >-
    Семейные марани в ущелье Таны к югу от Гори, родина атенури — свежего соломенно-бледного игристого
    из чинури и горули мцване.
  body: >-
    **Слава досталась Кахетии, а характер — Атенскому ущелью.**


    К югу от Гори река Тана прорезает узкую долину в предгорьях Триалетского хребта. Виноградники поднимаются
    по её склонам на высоту от 620 до 750 метров, а винную зону делят три села: Патара-Атени, Гардатени
    и Диди-Атени. Не ищите здесь ворот шато и дегустационных залов со стеклянными стенами: погреба устроены
    под семейными домами, и квеври вкопаны прямо в пол.


    Здешнее вино — атенури, наименование места происхождения, защищённое законом: соломенно-бледное игристое
    белое из чинури и горули мцване, пузырьки которому даёт вторичное брожение. Имя чинури происходит
    от слова «чинебули» — «превосходный», и сорт оправдывает его не плотностью, а кислотностью. Созревает
    он медленно, полной зрелости достигает лишь в конце октября, поэтому ртвели, сбор винограда, приходит
    в это ущелье поздно.


    Организованного винного маршрута здесь нет. О визите договариваются через гостевой дом или знакомых
    на месте; карты к оплате принимают редко, английский тоже встречается нечасто. Зато вы получите то,
    что не поставит ни один дегустационный бар: прохладный погреб, пахнущий сырой глиной и виноградными
    выжимками, чурчхелы, сохнущие на нитках, и хозяина, который наливает вам из квеври и совершенно всерьёз
    ждёт вашего вердикта.


    Долина не всегда была такой тихой. Среди виноградников стоит Атенский Сиони, храм VII века, на стенах
    которого сохранились древнейшие известные датированные надписи двух грузинских письменностей — нусхури
    и мхедрули. Одна из надписей сообщает, что в 1060-х годах царь Баграт IV повелел выстроить в Атени
    целый город. Города больше нет. Виноградники остались.
  tip: >-
    Выделите три часа и совместите визит с Атенским Сиони — до него примерно километр. Договоритесь о
    посещении погреба за день-два через гостевой дом в Гори или Атени; на неожиданный стук в дверь, может
    быть, и откроют, но по отношению к хозяевам это нечестно. Решите, кто сядет за руль, до первого бокала:
    грузинское гостеприимство почти не оставляет права на отказ. Октябрь — время ртвели: лучший месяц
    для поездки и месяц, когда переулки принадлежат тракторам. Банкоматов в долине нет, так что возьмите
    лари наличными, в том числе на вино с собой.
  route: >-
    Из Тбилиси выезжайте на запад по E60 (S1) и по скоростной магистрали проезжайте 86 км до Гори. Там
    сворачивайте на юг через Хидистави в ущелье Таны. Весь путь — 94 км, около 1 часа 25 минут. Дорога
    по ущелью узкая, асфальт местами латаный и разбитый, а в верхних сёлах переходит в гравий; в сухую
    погоду машина эконом-класса справится без труда. Заправьтесь в Гори: в долине заправок нет. Сельские
    улочки тесные, поэтому оставляйте машину у храма или там, где подскажет хозяин.
fa:
  name: سردابه‌های شراب درهٔ آتنی
  short: >-
    سردابه‌های خانوادگی در درهٔ تانا، جنوب گوری، زادگاه آتنوری: شرابی سفید، گازدار، رنگ‌پریده چون کاه
    و تازه، از انگور چینوری و گورولی متسوانه.
  body: >-
    **آوازه از آنِ کاختی است؛ تیزی و طراوت از آنِ درهٔ آتنی.**


    در جنوب گوری، رود تانا دره‌ای باریک در کوهپایه‌های رشته‌کوه تریالتی بریده است. تاکستان‌ها بر دامنه‌هایش
    از ارتفاع ۶۲۰ تا ۷۵۰ متر بالا می‌روند و سه روستا، پاتارا آتنی، گارداتنی و دیدی آتنی، این منطقهٔ شراب
    را میان خود قسمت کرده‌اند. دنبال دروازهٔ شاتو و سالن‌های شیشه‌ای مزه‌کردن شراب نگردید: سردابه‌ها زیر
    خانه‌های خانوادگی‌اند و کووری‌ها در کف آن‌ها در خاک فرو رفته‌اند.


    شراب اینجا آتنوری است، با نام مبدأ حمایت‌شده: شرابی سفید و گازدار به رنگ کاهِ کم‌رنگ، از انگورهای
    چینوری و گورولی متسوانه، که حباب‌هایش را از تخمیر دوم می‌گیرد. نام چینوری از واژهٔ «چینبولی» به معنای
    «عالی» می‌آید، و این انگور شایستگی این نام را با اسیدیته‌اش نشان می‌دهد، نه با غلظت و سنگینی. دیر
    می‌رسد و تنها در اواخر اکتبر به پختگی کامل می‌رسد؛ برای همین رتولی، یعنی انگورچینی، در این دره دیر
    از راه می‌رسد.


    اینجا مسیر شرابِ سازمان‌یافته‌ای نیست. بازدید را از طریق یک مهمان‌خانه یا آشنایی محلی هماهنگ می‌کنند
    و پرداخت با کارت و زبان انگلیسی کمیاب است. در عوض چیزی نصیبتان می‌شود که هیچ بار مزه‌کردن شرابی نمی‌تواند
    به صحنه ببرد: سردابه‌ای خنک با بوی گِل نمناک و پوست فشردهٔ انگور، چورچخلاهایی که بر نخ‌ها خشک می‌شوند،
    و میزبانی که جامتان را از کووری پر می‌کند و، کاملاً جدی، منتظر داوری شما می‌ماند.


    این دره همیشه این‌قدر آرام نبوده است. میان تاک‌ها کلیسای سیونی آتنی ایستاده است، از سدهٔ هفتم، که
    بر دیوارهایش کهن‌ترین کتیبه‌های تاریخ‌دارِ شناخته‌شده به دو خط گرجی، نوسخوری و مخدرولی، مانده است.
    یکی از کتیبه‌ها می‌گوید که در دههٔ ۱۰۶۰ شاه باگرات چهارم فرمان داد در آتنی شهری کامل بسازند. آن شهر
    از میان رفته است. تاکستان‌ها مانده‌اند.
  tip: >-
    سه ساعت وقت بگذارید و دیدار را با سیونی آتنی، که حدود یک کیلومتر آن‌سوتر است، یکی کنید. بازدید از
    سردابه را یکی دو روز زودتر از طریق مهمان‌خانه‌ای در گوری یا آتنی هماهنگ کنید؛ شاید به در زدنِ بی‌خبر
    هم جواب بدهند، اما این با میزبان منصفانه نیست. پیش از نخستین جام معلوم کنید چه کسی رانندگی می‌کند،
    چون مهمان‌نوازی گرجی نه گفتن را دشوار می‌کند. اکتبر فصل انگورچینی است: بهترین ماه برای آمدن، و ماهی
    که کوچه‌ها از آنِ تراکتورهاست. در دره خودپرداز نیست؛ لاری نقد همراه داشته باشید، از جمله برای شرابی
    که می‌خواهید با خود ببرید.
  route: >-
    از تفلیس از مسیر E60 (S1) به سوی غرب بیرون بروید و ۸۶ کیلومتر در بزرگراه دوبانده و سریع تا گوری برانید.
    آنجا از راه خیدیستاوی به جنوب، به درهٔ تانا بپیچید. کل مسیر ۹۴ کیلومتر است، حدود ۱ ساعت و ۲۵ دقیقه.
    جادهٔ دره باریک است، آسفالتش جابه‌جا وصله‌خورده و شکسته، و در روستاهای بالادست به شنی بدل می‌شود؛
    در هوای خشک خودروی اکونومی به‌راحتی از پسش برمی‌آید. در گوری سوخت بگیرید، چون در دره جایگاه سوخت نیست.
    کوچه‌های روستا تنگ‌اند؛ پس کنار کلیسا یا هر جا که میزبان پیشنهاد کرد پارک کنید.
he:
  name: מרתפי היין של עמק אתני
  short: >-
    מרתפים משפחתיים בערוץ הטאנה מדרום לגורי, ביתו של האתנורי: יין לבן מבעבע, רענן וחיוור כקש, מענבי צ'ינורי
    וגורולי מצוואנה.
  body: >-
    **לקאחתי יש את התהילה; לערוץ אתני יש את החדות.**


    מדרום לגורי חותך נהר טאנה עמק צר למרגלות רכס טריאלטי. הכרמים מטפסים במדרונותיו בין 620 ל-750 מטר,
    ושלושה כפרים — פאטארה אתני, גרדאתני ודידי אתני — חולקים את אזור היין. אל תחפשו כאן שערי שאטו או חדרי
    טעימות עם קירות זכוכית: המרתפים נמצאים מתחת לבתי המשפחות, וכדי הקוורי שקועים ברצפתם.


    היין הוא אתנורי, כינוי מקור מוגן: יין לבן מבעבע בגוון קש חיוור, מענבי צ'ינורי וגורולי מצוואנה, והבועות
    שבו נוצרות בתסיסה שנייה. שמו של הצ'ינורי בא מן המילה "צ'ינבולי", "מצוין", והוא זוכה בו בזכות החומציות
    ולא בזכות הגוף. הזן מבשיל לאט ומגיע לבשלות מלאה רק בסוף אוקטובר, ולכן הרטוולי, הבציר, מגיע לערוץ הזה
    באיחור.


    אין כאן דרך יין מאורגנת. ביקורים מתאמים דרך בית הארחה או איש קשר מקומי, ותשלום בכרטיס אשראי ואנגלית
    הם דבר נדיר. בתמורה מקבלים משהו שאף בר טעימות לא יוכל לביים: מרתף קריר שריחו ריח חמר לח וקליפות ענבים
    סחוטות, צ'ורצ'חלות המתייבשות על חוטים, ומארח שממלא את כוסכם מן הקוורי ומחכה, ברצינות גמורה, לפסק הדין
    שלכם.


    העמק לא היה תמיד שקט כל כך. בין הגפנים עומדת אתני סיוני, כנסייה מן המאה ה-7 שעל קירותיה שרדו הכתובות
    המתוארכות הקדומות ביותר הידועות בשני כתבים גאורגיים, נוסחורי ומחדרולי. אחת הכתובות מספרת שבשנות ה-60
    של המאה ה-11 ציווה המלך בגרט הרביעי לבנות באתני עיר שלמה. העיר נעלמה. הכרמים נשארו.
  tip: >-
    הקדישו לכך שלוש שעות ושלבו את הביקור עם אתני סיוני, כקילומטר משם. תאמו ביקור במרתף יום או יומיים מראש
    דרך בית הארחה בגורי או באתני; ייתכן שגם לדפיקה בלתי צפויה בדלת ייענו, אבל זה לא הוגן כלפי המארחים.
    החליטו מי נוהג לפני הכוס הראשונה, כי הכנסת האורחים הגאורגית מקשה מאוד לסרב. אוקטובר הוא עונת הבציר:
    החודש הטוב ביותר לבוא, וגם החודש שבו הטרקטורים שולטים בסמטאות. בעמק אין כספומט, אז הביאו לארי במזומן,
    גם בשביל היין שתיקחו הביתה.
  route: >-
    צאו מטביליסי מערבה בכביש E60 (S1) ונסעו 86 ק״מ בכביש המהיר הדו-מסלולי עד גורי. שם פנו דרומה דרך חידיסטאווי
    אל ערוץ הטאנה. הדרך כולה 94 ק״מ, כשעה ו-25 דקות. הכביש בערוץ צר, האספלט מטולא ושבור במקומות, ובכפרים
    העליונים הוא הופך לדרך חצץ; במזג אוויר יבש רכב חסכוני מסתדר בקלות. תדלקו בגורי, כי בעמק אין תחנת דלק.
    סמטאות הכפר צרות, אז חנו ליד הכנסייה או היכן שהמארח יציע.
ar:
  name: أقبية النبيذ في وادي أتيني
  short: >-
    أقبية عائلية في وادي تانا جنوب غوري، موطن الأتينوري: نبيذ أبيض فوّار منعش بلون القش الشاحب، من عنبَي
    تشينوري وغورولي متسفانه.
  body: >-
    **لكاخيتي الشهرة، ولوادي أتيني النَّضارة والحيوية.**


    جنوب غوري يشق نهر تانا وادياً ضيقاً في سفوح سلسلة تريالتي. تتسلق الكروم منحدراته بين 620 و750 متراً،
    وتتقاسم منطقة النبيذ ثلاث قرى: باتارا أتيني وغارداتيني وديدي أتيني. لا تبحث هنا عن بوابات شاتوهات
    ولا عن قاعات تذوق بجدران زجاجية: فالأقبية تحت بيوت العائلات، وجرار القفيفري مدفونة في أرضياتها.


    النبيذ هنا هو الأتينوري، وهو تسمية منشأ محمية: نبيذ أبيض فوّار بلون القش الشاحب، يُصنع من عنبَي تشينوري
    وغورولي متسفانه، وتنشأ فقاعاته من تخمير ثانٍ. يأخذ التشينوري اسمه من كلمة «تشينيبولي» أي «ممتاز»،
    ويستحقه بحموضته لا بثقل قوامه. ينضج ببطء، ولا يبلغ تمام نضجه إلا في أواخر أكتوبر، ولذلك يأتي «الرتفيلي»،
    أي قطاف العنب، إلى هذا الوادي متأخراً.


    ليس هنا مسار نبيذ منظّم. تُرتَّب الزيارات عبر بيت ضيافة أو معارف محليين، ونادراً ما تجد الدفع بالبطاقة
    أو من يتكلم الإنجليزية. لكنك تنال في المقابل ما لا تستطيع أي حانة تذوق أن تصطنعه: قبواً بارداً تفوح
    منه رائحة الطين الرطب وقشور العنب المعصورة، وحلوى التشورتشخيلا تجف على خيوطها، ومضيفاً يملأ كأسك من
    القفيفري ثم ينتظر، بكل جدية، حكمك.


    لم يكن الوادي هادئاً هكذا دائماً. بين الكروم تقوم كنيسة أتيني سيوني، من القرن السابع، وعلى جدرانها
    أقدم النقوش المؤرَّخة المعروفة بخطّين جورجيين، النوسخوري والمخيدرولي. ويسجّل أحد نقوشها أن الملك باغرات
    الرابع أمر في ستينيات القرن الحادي عشر ببناء مدينة كاملة في أتيني. اختفت المدينة. أما الكروم فباقية.
  tip: >-
    خصص للزيارة ثلاث ساعات، واجمعها بكنيسة أتيني سيوني التي تبعد نحو كيلومتر. رتّب زيارة القبو قبل يوم
    أو يومين عبر بيت ضيافة في غوري أو أتيني؛ فقد يُفتح لك الباب إن طرقته دون موعد، لكن في ذلك إجحافاً
    بالمضيف. اتفق مع رفاقك على من سيقود السيارة قبل الكأس الأولى، فالضيافة الجورجية تجعل الرفض عسيراً.
    أكتوبر موسم القطاف: أفضل شهر للمجيء، والشهر الذي تستولي فيه الجرارات على الأزقة. لا صراف آلياً في
    الوادي، فاحمل اللاري نقداً، ومنه ثمن النبيذ الذي ستأخذه معك.
  route: >-
    غادر تبليسي غرباً على الطريق E60 (S1) وتابع 86 كم على الطريق السريع المزدوج حتى غوري. هناك انعطف جنوباً
    عبر خيديستافي إلى وادي تانا. الرحلة كلها 94 كم وتستغرق نحو ساعة و25 دقيقة. طريق الوادي ضيق، وإسفلته
    مرقّع ومتكسّر في مواضع، ويتحول إلى حصى في القرى العليا؛ وفي الطقس الجاف تتدبر السيارة الاقتصادية أمرها
    بسهولة. املأ الخزان في غوري، إذ لا محطة وقود في الوادي. أزقة القرية ضيقة، فأوقف السيارة عند الكنيسة
    أو حيث يقترح مضيفك.
