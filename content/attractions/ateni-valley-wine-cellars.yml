ka:
  name: ატენის ხეობის მარნები
  short: ვიწრო ხეობა გორის სამხრეთით, სადაც ატენური ღვინო მზადდება — ქართლის ერთ-ერთი ყველაზე გამორჩეული
    ღვინის კუთხე.
  body: >-
    **ატენის ხეობა კახეთი არ არის და ეს მისი უპირატესობაა.** ტანას მდინარე გორის სამხრეთით ვიწრო, კლდოვან
    ხეობას ჭრის; ფერდობებზე ტერასული ვენახებია, ძირში კი სოფლები — დიდი ატენი, პატარა ატენი, ბოშური. დიდი
    ღვინის ქარხნები აქ არ არის. არის ოჯახები, რომლებსაც მარანი სახლის ქვეშ აქვთ.


    ატენური თეთრი ღვინოა, ძირითადად ჩინურისა და გორული მწვანესგან. ეს არ არის მძიმე, ქარვისფერი კახური
    ღვინო: ატენური მსუბუქია, მჟავიანი და ხშირად ოდნავ მოცქრიალე — ბუნებრივი აირი მეორადი დუღილისგან რჩება,
    თუ ღვინო ადრე ჩამოისხმება. ქართული ტრადიციით სწორედ ატენი ითვლება ბუნებრივი ცქრიალა ღვინის ადგილად
    და საბჭოთა პერიოდში ატენური ცალკე დასახელებად იყო აღიარებული.


    ხეობის ჰავა და ნიადაგი ამას ხსნის: ვიწრო ხეობა ღამით ცივდება, დღისით თბება, ნიადაგი კი კირქვიანი და
    ქვიანია. მოსავალი სექტემბრის ბოლოს და ოქტომბრის დასაწყისში ხდება — რთველის დროს სოფლები ცოცხლდება
    და მარნები იღება.


    გაითვალისწინეთ: ეს ორგანიზებული ღვინის მარშრუტი არ არის. მისაღები დარბაზები, ბარათით გადახდა და ინგლისურენოვანი
    გიდები აქ იშვიათია. ვიზიტი წინასწარ უნდა შეთანხმდეს — სასტუმროს ან ადგილობრივის დახმარებით. სამაგიეროდ,
    ის რასაც ნახავთ, ნამდვილია: ქვევრი მიწაში, ჭერზე დაკიდებული ჩურჩხელა და მასპინძელი, რომელიც სამი სახეობის
    ღვინოს ერთდროულად გასინჯვინებთ.
  tip: >-
    სამი საათი გამოყავით ატენის სიონთან ერთად — ისინი ერთსა და იმავე ხეობაშია. მარნის მონახულება წინასწარ
    შეათანხმეთ; შემთხვევით მისულს ხშირად მაინც არ გიშვებენ უპასუხოდ, მაგრამ დაგეგმვა ჯობია. მძღოლმა არ
    უნდა დალიოს — ქართული სტუმართმოყვარეობა უარის თქმას ართულებს, ამიტომ ჯგუფში მძღოლი წინასწარ შეთანხმდით.
    რთველის დროს სოფლის გზები ტრაქტორებით არის დაკავებული. ბანკომატი ხეობაში არ არის.
  route: >-
    თბილისიდან E60-ით გორამდე — 86 კმ სწრაფი ავტობანით. გორიდან სამხრეთით ხიდისთავზე გაუხვევთ და ტანას
    ხეობის გზას გაჰყვებით. სულ 94 კმ, დაახლოებით საათი და ოცდახუთი წუთი. ხეობის გზა ვიწროა, ასფალტი ადგილ-ადგილ
    დაზიანებულია, ბოლო სოფლებში კი ხრეშზე გადადის — ეკონომ-კლასის მანქანა მშრალ ამინდში ადვილად გაივლის.
    საწვავი გორში აიღეთ, ხეობაში სადგური არ არის.
en:
  name: Ateni Valley Wine Cellars
  short: A narrow gorge south of Gori where Atenuri wine is made, one of the most distinctive wine corners
    of Kartli.
  body: >-
    **The Ateni valley is not Kakheti, and that is the point.** The Tana river cuts a narrow, rocky gorge
    south of Gori; terraced vineyards climb the slopes and villages sit on the floor — Didi Ateni, Patara
    Ateni, Boshuri. There are no large wineries here. There are families with a cellar under the house.


    Atenuri is a white wine, made mainly from Chinuri and Goruli Mtsvane. It is not the heavy amber wine
    of Kakheti: Atenuri is light, sharp with acid, and often faintly sparkling, the gas left by a second
    fermentation when the wine is bottled early. Georgian tradition treats Ateni as the home of naturally
    sparkling wine, and in the Soviet period Atenuri was recognised as an appellation in its own right.


    The gorge explains the wine. It is narrow enough to cool sharply at night and warm through the day,
    and the soils are stony and limy. Harvest falls at the end of September and the beginning of October;
    during rtveli the villages come alive and cellar doors stand open.


    Be realistic about what this is. It is not an organised wine route. Tasting rooms, card payment and
    English-speaking guides are rare. A visit needs to be arranged in advance, usually through a guesthouse
    or a local contact. In return, what you see is unstaged: qvevri sunk in the earth floor, churchkhela
    hanging from the beams, and a host who will pour three wines at once and want an opinion on each.
  tip: >-
    Allow three hours and combine it with Ateni Sioni, which stands in the same gorge. Arrange a cellar
    visit ahead; turning up unannounced rarely gets you turned away, but planning works better. The driver
    should not drink — Georgian hospitality makes refusal awkward, so agree who is driving before you
    arrive. During harvest the village roads are full of tractors. There is no cash machine in the valley,
    so bring money with you.
  route: >-
    Take the E60 from Tbilisi to Gori, 86 km of fast dual carriageway. From Gori turn south at Khidistavi
    and follow the Tana gorge road. Ninety-four kilometres in total, about an hour and twenty-five minutes.
    The gorge road is narrow, the asphalt broken in places, and it turns to gravel in the upper villages,
    though an economy car handles it easily in dry weather. Refuel in Gori; there is no filling station
    in the valley.
ru:
  name: Винные погреба Атенского ущелья
  short: Узкое ущелье южнее Гори, где делают вино атенури, — один из самых своеобразных винных уголков
    Картли.
  body: >-
    **Атенское ущелье — не Кахетия, и в этом всё дело.** Река Тана прорезает южнее Гори узкое скалистое
    ущелье; по склонам поднимаются террасные виноградники, внизу стоят сёла — Диди Атени, Патара Атени,
    Бошури. Крупных винзаводов здесь нет. Есть семьи, у которых марани под домом.


    Атенури — белое вино, в основном из чинури и горули мцване. Это не тяжёлое янтарное кахетинское: атенури
    лёгкое, с выраженной кислотностью, часто чуть игристое — газ остаётся от вторичного брожения, если
    вино разлить рано. Грузинская традиция считает Атени родиной естественно игристого вина, а в советское
    время атенури признавалось отдельным наименованием.


    Вино объясняется самим ущельем: оно достаточно узкое, чтобы резко остывать ночью и прогреваться днём,
    а почвы каменистые и известковые. Сбор приходится на конец сентября и начало октября; во время ртвели
    сёла оживают, а двери погребов стоят открытыми.


    Стоит понимать, что это такое. Организованного винного маршрута здесь нет. Дегустационные залы, оплата
    картой и англоговорящие гиды — редкость. Визит нужно договаривать заранее, обычно через гостевой дом
    или местного знакомого. Зато увиденное ничем не подготовлено: квеври, вкопанные в земляной пол, чурчхела
    под балками и хозяин, который нальёт три вина сразу и будет ждать мнения о каждом.
  tip: >-
    Заложите три часа и объедините поездку с Атенским Сиони — он в том же ущелье. Посещение погреба договаривайте
    заранее; приехавших без предупреждения редко разворачивают, но с планом лучше. Водителю пить нельзя
    — грузинское гостеприимство делает отказ неловким, поэтому решите, кто за рулём, до приезда. Во время
    сбора урожая сельские дороги забиты тракторами. Банкомата в ущелье нет, берите наличные.
  route: >-
    Из Тбилиси по E60 до Гори — 86 км по скоростной трассе. От Гори поворот на юг у Хидистави и дальше
    по дороге вдоль Танского ущелья. Всего 94 км, примерно час двадцать пять. Дорога в ущелье узкая, асфальт
    местами разбит, в верхних сёлах переходит в гравий, но машина эконом-класса проходит легко в сухую
    погоду. Заправляйтесь в Гори, в ущелье станций нет.
fa:
  name: سردابه‌های شراب درّهٔ آتنی
  short: درّه‌ای باریک در جنوب گوری که شراب آتنوری در آن ساخته می‌شود، از متمایزترین گوشه‌های شراب کارتلی.
  body: >-
    **درّهٔ آتنی کاختی نیست، و نکته همین است.** رود تانا در جنوب گوری درّه‌ای باریک و صخره‌ای می‌بُرد؛
    تاکستان‌های پلکانی از دامنه‌ها بالا می‌روند و روستاها در کف درّه نشسته‌اند: دیدی آتنی، پاتارا آتنی
    و بوشوری. اینجا کارخانهٔ شراب بزرگی نیست. خانواده‌هایی هست که سردابه‌ای زیر خانه دارند.


    آتنوری شرابی سفید است که بیشتر از انگور چینوری و گورولی متسوانه ساخته می‌شود. این شراب کهربایی و سنگین
    کاختی نیست: آتنوری سبک است، با اسیدی تیز، و اغلب اندکی گازدار، چون هنگام بطری کردنِ زودهنگام گاز تخمیر
    دوم در آن می‌ماند. سنت گرجی آتنی را خانهٔ شراب طبیعیِ گازدار می‌داند و در دورهٔ شوروی آتنوری به‌عنوان
    نامی مستقل به رسمیت شناخته شد.


    خودِ درّه شراب را توضیح می‌دهد. آنقدر باریک است که شب‌ها به‌تندی سرد و روزها گرم شود، و خاک‌ها سنگی
    و آهکی‌اند. برداشت در پایان شهریور و آغاز مهر است؛ در ایام رتولی روستاها جان می‌گیرند و درِ سردابه‌ها
    باز می‌ماند.


    واقع‌بین باشید که اینجا چیست. مسیر شراب سازمان‌یافته‌ای در کار نیست. اتاق مزه‌آزمایی، پرداخت با کارت
    و راهنمای انگلیسی‌زبان کمیاب‌اند. بازدید را باید از پیش هماهنگ کرد، معمولاً از راه مهمان‌خانه یا آشنایی
    محلی. در عوض آنچه می‌بینید ساختگی نیست: کوره‌های سفالی فرورفته در کف خاکی، چورچخلا آویخته از تیرها،
    و میزبانی که سه شراب را با هم می‌ریزد و دربارهٔ هر سه نظر می‌خواهد.
  tip: >-
    سه ساعت در نظر بگیرید و آن را با آتنی سیونی که در همین درّه است یکجا کنید. بازدید از سردابه را از
    پیش هماهنگ کنید؛ رسیدن بی‌خبر به‌ندرت به رد شدن می‌انجامد، اما برنامه‌ریزی بهتر جواب می‌دهد. راننده
    نباید بنوشد — مهمان‌نوازی گرجی رد کردن را دشوار می‌کند، پس پیش از رسیدن روشن کنید چه کسی می‌راند.
    در فصل برداشت جاده‌های روستایی پر از تراکتور است. در درّه خودپرداز نیست، پس پول نقد همراه ببرید.
  route: >-
    از تفلیس روی E60 تا گوری، ۸۶ کیلومتر جادهٔ دوبانده و تند. از گوری در خیدیستاوی به جنوب بپیچید و جادهٔ
    درّهٔ تانا را دنبال کنید. نود و چهار کیلومتر روی‌هم، حدود یک ساعت و بیست‌وپنج دقیقه. جادهٔ درّه باریک
    است، آسفالت جای‌جای شکسته، و در روستاهای بالادست به شن بدل می‌شود، هرچند خودروی اقتصادی در هوای خشک
    به‌آسانی از پس آن برمی‌آید. سوخت را در گوری بگیرید؛ در درّه پمپی نیست.
he:
  name: מרתפי היין של עמק אתני
  short: ערוץ צר מדרום לגורי שבו מייצרים את יין האתנורי, אחת מפינות היין המובחנות של קרתלי.
  body: >-
    **עמק אתני אינו קאחתי, וזה בדיוק העניין.** נהר טאנה חותך מדרום לגורי ערוץ צר וסלעי; כרמי מדרגות מטפסים
    במדרונות וכפרים יושבים בקרקעיתו — דידי אתני, פאטארה אתני ובושורי. אין כאן יקבים גדולים. יש משפחות
    שמתחת לביתן מרתף.


    אתנורי הוא יין לבן, בעיקר מזני צ'ינורי וגורולי מצוואנה. אין זה היין הענברי הכבד של קאחתי: האתנורי
    קל, חד בחומציותו, ולעיתים קרובות מבעבע קלות — הגז נותר מתסיסה שנייה כשהיין מבוקבק מוקדם. המסורת הגאורגית
    רואה באתני את מולדת היין המבעבע הטבעי, ובתקופה הסובייטית הוכר האתנורי כשם מקור בפני עצמו.


    הערוץ מסביר את היין. הוא צר די הצורך כדי להתקרר בחדות בלילה ולהתחמם ביום, והקרקעות אבניות וגיריות.
    הבציר חל בסוף ספטמבר ובתחילת אוקטובר; בימי הרתוולי הכפרים מתעוררים ודלתות המרתפים פתוחות.


    כדאי להיות מציאותיים לגבי המקום. אין כאן מסלול יין מאורגן. חדרי טעימות, תשלום בכרטיס ומדריכים דוברי
    אנגלית הם נדירים. ביקור צריך תיאום מראש, בדרך כלל דרך בית הארחה או מכר מקומי. בתמורה, מה שרואים אינו
    מבוים: קווברי שקועים ברצפת האדמה, צ'ורצ'חלה תלויה מן הקורות, ומארח שימזוג שלושה יינות בבת אחת ויבקש
    חוות דעת על כל אחד.
  tip: >-
    הקצו שלוש שעות ושלבו עם אתני סיוני, שעומדת באותו ערוץ. תאמו ביקור במרתף מראש; מי שמגיע בלי הודעה בדרך
    כלל אינו נדחה, אך תכנון עובד טוב יותר. הנהג לא צריך לשתות — הכנסת האורחים הגאורגית מקשה לסרב, לכן
    סכמו מי נוהג לפני שמגיעים. בעונת הבציר דרכי הכפר מלאות טרקטורים. אין כספומט בעמק, לכן קחו מזומן.
  route: >-
    סעו מטביליסי בכביש E60 עד גורי, 86 ק״מ של כביש מהיר. מגורי פנו דרומה בחידיסטאווי ועקבו אחרי דרך ערוץ
    טאנה. 94 ק״מ בסך הכול, כשעה ועשרים וחמש. דרך הערוץ צרה, האספלט שבור במקומות והיא הופכת לחצץ בכפרים
    העליונים, אך רכב חסכוני מתמודד בקלות במזג אוויר יבש. תדלקו בגורי; בעמק אין תחנת דלק.
ar:
  name: أقبية النبيذ في وادي أتيني
  short: وادٍ ضيق جنوب غوري يُصنع فيه نبيذ الأتينوري، وهو من أكثر أركان النبيذ تميزاً في كارتلي.
  body: >-
    **وادي أتيني ليس كاخيتي، وهذا هو المقصد.** يشق نهر تانا جنوب غوري وادياً ضيقاً صخرياً؛ تتسلق كروم
    المصاطب سفوحه وتجلس القرى في قاعه: ديدي أتيني، وباتارا أتيني، وبوشوري. لا مصانع نبيذ كبيرة هنا، بل
    عائلات لكل منها قبو تحت البيت.


    والأتينوري نبيذ أبيض يُصنع أساساً من عنبي التشينوري والغورولي متسفانه. وليس هو النبيذ الكهرماني الثقيل
    الكاخيتي: فالأتينوري خفيف، حاد الحموضة، وكثيراً ما يكون فوّاراً قليلاً، إذ يبقى الغاز من تخمّر ثانٍ
    حين يُعبأ النبيذ مبكراً. ويعدّ التقليد الجورجي أتيني موطن النبيذ الفوّار الطبيعي، وفي العهد السوفييتي
    اعتُرف بالأتينوري تسميةً قائمة بذاتها.


    والوادي نفسه يفسّر النبيذ. فهو ضيق بما يكفي ليبرد بحدة ليلاً ويدفأ نهاراً، وتربته حجرية كلسية. ويقع
    القطاف في أواخر أيلول ومطلع تشرين الأول؛ وفي أيام الرتفيلي تدبّ الحياة في القرى وتبقى أبواب الأقبية
    مفتوحة.


    وكن واقعياً في تصور المكان. لا مسار نبيذ منظم هنا. وغرف التذوق والدفع بالبطاقة والمرشدون الناطقون
    بالإنجليزية نادرة. والزيارة تحتاج ترتيباً مسبقاً، عادةً عبر بيت ضيافة أو معرفة محلية. وفي المقابل
    ما تراه غير مُعدّ للعرض: جرار كفيفري مغروسة في الأرضية الترابية، وتشورتشخيلا معلقة من العوارض، ومضيف
    يصبّ ثلاثة أنواع دفعة واحدة وينتظر رأيك في كل منها.
  tip: >-
    خصّص ثلاث ساعات واجمعها مع أتيني سيوني القائمة في الوادي نفسه. ورتّب زيارة القبو مسبقاً؛ فالقدوم دون
    إشعار نادراً ما يُقابل بالرفض، لكن التخطيط أنجع. وعلى السائق ألا يشرب — فكرم الضيافة الجورجي يجعل
    الرفض محرجاً، فاتفقوا على من يقود قبل الوصول. وفي موسم القطاف تمتلئ طرق القرى بالجرارات. ولا صراف
    آلي في الوادي، فاحمل نقداً.
  route: >-
    خذ الطريق E60 من تبليسي حتى غوري، 86 كم من الطريق المزدوج السريع. ومن غوري انعطف جنوباً عند خيديستافي
    واتبع طريق وادي تانا. أربعة وتسعون كيلومتراً إجمالاً، نحو ساعة وخمس وعشرين دقيقة. وطريق الوادي ضيق،
    والإسفلت متكسر في مواضع، ويتحول إلى حصى في القرى العليا، وإن كانت سيارة اقتصادية تتدبره بسهولة في
    الطقس الجاف. تزوّد بالوقود في غوري؛ فلا محطة في الوادي.
