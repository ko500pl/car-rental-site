ka:
  name: კაცხის სვეტი
  short: >-
    40-მეტრიანი კირქვის სვეტი კაცხურის ხეობის თავზე, აღდგენილი შუა საუკუნეების სავანით თხემზე; 2012 წლიდან
    მას მხოლოდ ქვემოდან უცქერენ.
  body: >-
    **საუკუნეების განმავლობაში კაცხის სვეტის თავზე მდგარ ეკლესიას ყველა ხედავდა, მასთან მისვლა კი არავის
    შეეძლო.**


    XVIII საუკუნეში ვახუშტი ბატონიშვილი აღნიშნავდა, რომ ხევში სვეტივით აღმართული, საკმაოდ მაღალი კლდე
    დგას, თავზე პატარა ეკლესია აქვს, მაგრამ მასზე ასვლა არავის ძალუძს და არც ის იციან, როგორ ავიდნენ.
    კლდე ბუნებრივი კირქვის სვეტია, დაახლოებით 40 მეტრის სიმაღლისა, ჭიათურასთან ახლოს, კაცხურის — ყვირილის
    მარჯვენა შენაკადის — ხეობის თავზე. ადგილობრივები მას სიცოცხლის სვეტად, ჭეშმარიტი ჯვრის სიმბოლოდ მიიჩნევდნენ.
    გადმოცემით, სვეტის თხემი ოდესღაც გრძელი რკინის ჯაჭვით იყო დაკავშირებული სოფლის ეკლესიის გუმბათთან,
    რომელიც აქედან კილომეტრნახევარშია.


    1944 წლის ივლისში ალპინისტ ალექსანდრე ჯაფარიძისა და მწერალ ლევან გოთუას ხელმძღვანელობით ჯგუფმა სვეტზე
    პირველი დოკუმენტირებული ასვლა განახორციელა. დაახლოებით 150 კვადრატული მეტრის თხემზე ნანგრევები დახვდათ;
    არქიტექტურის ისტორიკოსმა ვახტანგ ცინცაძემ ისინი V–VI საუკუნეების ორ ეკლესიად მიიჩნია და მესვეტეობას
    — სვეტზე მდგომ მეუდაბნოეთა ასკეზას — დაუკავშირა. შემდგომმა კვლევამ, უპირველესად გიორგი გაგოშიძის 2006
    წლის გათხრებმა, კომპლექსი IX–X საუკუნეებით დაათარიღა: სამონასტრო ეკლესია, განდეგილთა სენაკები და მარანი
    რვა ქვევრით. 2007 წელს ნაპოვნ XIII საუკუნის ასომთავრულ წარწერაში მოხსენიებულია ვინმე გიორგი, რომელმაც
    სამი სენაკი ააშენა, და თვითონ სვეტიც — როგორც სიცოცხლის სვეტი.


    ცხოვრება აქ 1995 წელს დაბრუნდა, როცა ჭიათურელი ბერი მაქსიმე ყავთარაძე სვეტზე ავიდა და დაახლოებით ოცი
    წელი იქ დაჰყო; ძირს კვირაში ორჯერ ჩამოდიოდა. 2005–2009 წლებში თხემზე წმინდა მაქსიმე აღმსარებლის პატარა
    ეკლესია აღადგინეს.


    2012 წლიდან რკინის კიბე უსაფრთხოების გამო სტუმრებისთვის დაკეტილია. თქვენ ქვემოთ რჩებით — წმინდა სვიმეონ
    მესვეტის ახალ ეკლესიასთან და სვეტის ძირში ამოკვეთილ რელიეფურ ჯვართან — და მაღლა იყურებით, ზუსტად ისე,
    როგორც ოდესღაც ვახუშტი.
  tip: >-
    ასვლას ნუ დაგეგმავთ: 2012 წლიდან კიბე სტუმრებისთვის დაკეტილია. პარკინგიდან მოკლე ბილიკი სვეტის ძირამდე
    და ქვედა ეკლესიამდე მიდის. სამონასტრო ჩაცმის წესი მოქმედებს: ქალებს — თავსაფარი და კაბა, მამაკაცებს
    — გრძელი შარვალი. ორმოცი წუთიდან ერთ საათამდე საკმარისია. ფოტოსთვის დილით ან გვიან ნაშუადღევს მოდით,
    როცა გვერდითი შუქი კლდეს რელიეფს აძლევს; შუადღისას სვეტი ბრტყელი ჩანს. ძირში ამოკვეთილი ჯვარი არ გამოგრჩეთ.
    კაფე და ბანკომატი ჭიათურაშია, მანქანით ათიოდე წუთში.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონამდე (დაახლოებით 181 კმ), იქიდან კი შ22-ით
    ჩრდილოეთისკენ, ყვირილის ხეობით ჭიათურის მიმართულებით. დაახლოებით 26 კილომეტრში, ჭიათურამდე რამდენიმე
    კილომეტრით ადრე, კაცხთან გადაუხვიეთ; სოფლის გზის ბოლო კილომეტრი სვეტის ძირამდე მიგიყვანთ. სულ დაახლოებით
    213 კმ და 3 სთ 15 წთ. გზა ბოლომდე ასფალტიანია, თუმცა შ22 ვიწროა და სამთო ტრანსპორტისგან ადგილ-ადგილ
    დაზიანებული. საწვავი ზესტაფონსა და ჭიათურაშია. სვეტთან პარკინგი მცირეა. ეკონომ-კლასი საკმარისია.
en:
  name: Katskhi Pillar
  short: >-
    A 40-metre limestone column above the Katskhuri valley, crowned by a restored medieval hermitage;
    since 2012 visitors admire it from below.
  body: >-
    **For centuries the church on top of Katskhi was something everyone could see and no one could reach.**


    In the 18th century Prince Vakhushti wrote: "There is a rock within the ravine standing like a pillar,
    considerably high. There is a small church on the top of the rock, but nobody is able to ascend it;
    nor know they how to do that." The rock is a natural limestone monolith about 40 metres high, near
    Chiatura, above the valley of the Katskhuri, a right tributary of the Kvirila. Locals revered it as
    the Pillar of Life, a symbol of the True Cross, and legend says an iron chain once ran from its summit
    to the dome of the village church, a kilometre and a half away.


    In July 1944 the mountaineer Alexander Japaridze and the writer Levan Gotua led the first documented
    ascent. On a summit of roughly 150 square metres they found ruins that the architectural historian
    Vakhtang Tsintsadze took for two churches of the 5th–6th century and linked to stylites, ascetics
    who lived on pillars. Giorgi Gagoshidze's excavations of 2006 later re-dated the complex to the 9th–10th
    century: a monastery church, hermit cells, and a wine cellar with eight qvevri. A 13th-century inscription
    found in 2007 names one Giorgi, builder of three cells, and speaks of the Pillar of Life.


    Life returned in 1995, when the monk Maxime Qavtaradze, a native of Chiatura, climbed up and stayed
    for some twenty years, coming down about twice a week. The summit church of St Maximus the Confessor
    was restored in 2005–2009.


    Since 2012 the iron ladder has been closed to visitors for safety. You stay at the foot, by the new
    church of St Simeon the Stylite and a relief cross carved into the base, and look up, as Vakhushti
    did.
  tip: >-
    Do not plan on climbing: the ladder has been closed to visitors since 2012. From the parking area
    a short path leads to the foot of the pillar and the lower church. Monastery dress applies: headscarf
    and skirt for women, long trousers for men. Forty minutes to an hour is enough. For photographs come
    in the morning or late afternoon, when side light gives the rock its relief; at noon it looks flat.
    Look for the relief cross at the base. Cafés and cash machines are in Chiatura, about ten minutes'
    drive on.
  route: >-
    From Tbilisi follow the S1 (E60) west to Zestaponi (about 181 km), then turn north on the Sh22, the
    road up the Kvirila valley towards Chiatura. After some 26 km, a few kilometres short of Chiatura,
    turn off at Katskhi; the last kilometre of village road brings you to the foot of the pillar. In all
    it is about 213 km and 3 h 15 min. The road is paved throughout, but the Sh22 is narrow and worn in
    places by mining traffic. Fuel is available in Zestaponi and Chiatura. Parking by the pillar is limited.
    An economy car is fine.
ru:
  name: Кацхский столп
  short: >-
    40-метровый известняковый столб над долиной Кацхури, увенчанный отреставрированным средневековым скитом;
    с 2012 года на него смотрят только снизу.
  body: >-
    **Веками церковь на вершине Кацхи была тем, что видели все и куда не мог подняться никто.**


    В XVIII веке царевич Вахушти писал: «В овраге стоит скала, подобная столбу, весьма высокая. На вершине
    скалы есть маленькая церковь, но взойти на неё никто не может, и никто не знает, как это делается».
    Скала — природный известняковый монолит высотой около 40 метров, близ Чиатуры, над долиной Кацхури,
    правого притока Квирилы. Местные жители почитали её как Столп Жизни, символ Животворящего Креста,
    и, по преданию, некогда с её вершины к куполу сельской церкви, стоящей в полутора километрах, тянулась
    железная цепь.


    В июле 1944 года альпинист Александр Джапаридзе и писатель Леван Готуа возглавили первое документально
    засвидетельствованное восхождение. На вершине площадью около 150 квадратных метров они обнаружили
    руины, которые историк архитектуры Вахтанг Цинцадзе принял за две церкви V–VI веков и связал со столпничеством
    — подвигом отшельников, живших на столбах. Раскопки Гиорги Гагошидзе в 2006 году передатировали комплекс
    IX–X веками: монастырская церковь, кельи затворников и винный погреб с восемью квеври. Найденная в
    2007 году надпись XIII века называет некоего Гиорги, построившего три кельи, и говорит о Столпе Жизни.


    Жизнь вернулась сюда в 1995 году, когда монах Максиме Кавтарадзе, уроженец Чиатуры, поднялся наверх
    и провёл там около двадцати лет, спускаясь примерно два раза в неделю. Церковь Максима Исповедника
    на вершине была отреставрирована в 2005–2009 годах.


    С 2012 года железная лестница закрыта для посетителей из соображений безопасности. Гости остаются
    у подножия, возле новой церкви Симеона Столпника и рельефного креста, высеченного в основании скалы,
    и смотрят вверх — так же, как когда-то Вахушти.
  tip: >-
    Не планируйте восхождение: с 2012 года лестница закрыта для посетителей. От автостоянки короткая тропа
    ведёт к подножию столба и нижней церкви. Действуют монастырские правила одежды: женщинам — платок
    и юбка, мужчинам — длинные брюки. Сорока минут — часа вполне достаточно. Для фотографий приезжайте
    утром или в конце дня, когда боковой свет подчёркивает рельеф скалы; в полдень она выглядит плоской.
    Обратите внимание на рельефный крест у основания. Кафе и банкоматы — в Чиатуре, в десяти минутах езды.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад до Зестафони (около 181 км), затем на север по дороге Ш22,
    вверх по долине Квирилы в сторону Чиатуры. Примерно через 26 км, за несколько километров до Чиатуры,
    поверните к Кацхи; последний километр сельской дороги приведёт вас к подножию столба. Всего около
    213 км и 3 ч 15 мин. Дорога полностью асфальтирована, но Ш22 узкая и местами разбита горнодобывающим
    транспортом. Заправиться можно в Зестафони и Чиатуре. Парковка у столба ограничена. Подойдёт экономичный
    автомобиль.
fa:
  name: ستون کاتسخی
  short: >-
    ستونی آهکی ۴۰ متری بر فراز درهٔ کاتسخوری با صومعه‌ای بازسازی‌شده بر تارکش؛ از ۲۰۱۲ تنها از پایین می‌توان
    تماشایش کرد.
  body: >-
    **قرن‌ها کلیسای بر فراز کاتسخی چیزی بود که همه می‌دیدند و هیچ‌کس نمی‌توانست به آن دست یابد.**


    در سده هجدهم، شاهزاده واخوشتی نوشت: «در درون دره تخته‌سنگی چون ستون ایستاده، بسیار بلند. بر فراز آن
    کلیسای کوچکی است، اما هیچ‌کس نمی‌تواند بر آن بالا رود؛ و کسی نمی‌داند این کار چگونه ممکن است.» این
    تخته‌سنگ توده‌ای طبیعی از سنگ آهک به ارتفاع حدود ۴۰ متر است، نزدیک چیاتورا، بر فراز دره کاتسخوری،
    شاخابه راست رود کویریلا. مردم محلی آن را ستون حیات می‌دانستند، نمادی از صلیب راستین، و افسانه می‌گوید
    زنجیری آهنین از فراز آن تا گنبد کلیسای روستا، در یک‌ونیم کیلومتری، کشیده بوده است.


    در ژوئیه ۱۹۴۴، کوهنورد الکساندر جاپاریدزه و نویسنده لوان گوتوا نخستین صعود ثبت‌شده را رهبری کردند.
    بر تارکی به مساحت تقریبی ۱۵۰ متر مربع، ویرانه‌هایی یافتند که واختانگ تسینتسادزه، تاریخ‌نگار معماری،
    آن‌ها را دو کلیسای سده پنجم تا ششم دانست و به سبک زندگی ستون‌نشینان، زاهدانی که بر فراز ستون‌ها می‌زیستند،
    پیوند داد. کاوش‌های گیورگی گاگوشیدزه در سال ۲۰۰۶ بعدها تاریخ این مجموعه را سده‌های نهم تا دهم تعیین
    کردند: کلیسای صومعه‌ای، حجره‌های زاهدان، و انبار شرابی با هشت خمرهٔ کوِوری. کتیبه‌ای از سده سیزدهم
    که در سال ۲۰۰۷ یافت شد، از شخصی به نام گیورگی سخن می‌گوید که سازنده سه حجره بود و از ستون حیات یاد
    می‌کند.


    زندگی در سال ۱۹۹۵ بازگشت، هنگامی که راهب ماکسیمه کاوتارادزه، زاده چیاتورا، بر فراز آن رفت و نزدیک
    به بیست سال در آن‌جا ماند و تنها حدود دو بار در هفته پایین می‌آمد. کلیسای تارک ستون، به نام قدیس ماکسیموس
    معترف، در سال‌های ۲۰۰۵ تا ۲۰۰۹ بازسازی شد.


    از سال ۲۰۱۲، نردبان آهنی به دلایل ایمنی بر بازدیدکنندگان بسته است. اکنون در پای ستون، نزد کلیسای تازه
    سیمئون ستون‌نشین و صلیبی حجاری‌شده در پایه آن می‌مانید و به بالا می‌نگرید، همان‌گونه که واخوشتی می‌نگریست.
  tip: >-
    در اندیشه بالا رفتن نباشید: نردبان از سال ۲۰۱۲ بر بازدیدکنندگان بسته است. از محوطه پارک، مسیری کوتاه
    به پای ستون و کلیسای زیرین می‌رسد. آیین پوشش صومعه رعایت می‌شود: زنان روسری و دامن، مردان شلوار بلند.
    چهل دقیقه تا یک ساعت کافی است. برای عکاسی صبح یا اواخر بعدازظهر بیایید، زمانی که نور از پهلو برجستگی
    سنگ را نشان می‌دهد؛ در نیمروز صخره صاف به نظر می‌رسد. صلیب حجاری‌شده در پایه را از یاد نبرید. کافه
    و دستگاه خودپرداز در چیاتورا، حدود ده دقیقه رانندگی از آن‌جا، در دسترس است.
  route: >-
    از تفلیس، جاده S1 (E60) را به سوی غرب تا زستافونی (حدود ۱۸۱ کیلومتر) دنبال کنید، سپس به سوی شمال بر
    جاده Sh22 بپیچید که از دره کویریلا به سوی چیاتورا بالا می‌رود. پس از حدود ۲۶ کیلومتر، چند کیلومتر
    پیش از چیاتورا، به سوی کاتسخی بپیچید؛ آخرین کیلومتر جاده روستایی شما را به پای ستون می‌رساند. در مجموع
    حدود ۲۱۳ کیلومتر و ۳ ساعت و ۱۵ دقیقه راه است. جاده به‌طور کامل آسفالت است، اما Sh22 باریک و در جاهایی
    به‌سبب تردد کامیون‌های معدن آسیب‌دیده است. سوخت در زستافونی و چیاتورا در دسترس است. پارکینگ کنار ستون
    محدود است. خودرویی اقتصادی کافی است.
he:
  name: עמוד קאצחי
  short: עמוד גיר בגובה 40 מטר מעל עמק קאצחורי, ובראשו מנזר ימי-ביניים משוחזר; מאז 2012 המבקרים צופים
    בו רק מלמטה.
  body: >-
    **במשך מאות שנים הכנסייה שבראש קאצחי הייתה דבר שכל אחד יכול לראות ואיש לא יכול להגיע אליו.**


    במאה ה-18 כתב הנסיך ואחושטי: 'יש סלע בתוך הערוץ העומד כעמוד, גבוה למדי. בראש הסלע כנסייה קטנה, אך
    איש אינו מסוגל לעלות אליה, ואיש אינו יודע כיצד עולים.' הסלע הוא גוש גיר טבעי בגובה כ-40 מטר, קרוב
    לצ'יאטורה, מעל עמק קאצחורי, יובל ימני של נהר קווירילה. תושבי המקום העריצו אותו כ'עמוד החיים', סמל
    לצלב האמיתי, והמסורת מספרת כי שלשלת ברזל השתרעה בעבר מפסגתו אל כיפת כנסיית הכפר, במרחק קילומטר וחצי.


    ביולי 1944 הובילו המטפס אלכסנדר ג'פרידזה והסופר לוואן גוטואה את הטיפוס המתועד הראשון. בפסגה ששטחה
    כ-150 מ"ר מצאו חורבות, שההיסטוריון של האדריכלות ואחטנג צינצדזה זיהה כשתי כנסיות מהמאות ה-5 עד ה-6,
    וקשר אותן ל'עמודנות' — סגפנות של נזירים שחיו על גבי עמודים. חפירותיו של גיאורגי גגושידזה ב-2006 תיארכו
    את המתחם מחדש למאות ה-9 עד ה-10: כנסיית מנזר, תאי נזירים ומרתף יין עם שמונה כדי 'קוורי'. כתובת מהמאה
    ה-13 שנתגלתה ב-2007 מזכירה אדם בשם גיאורגי, בונה שלושה תאים, ומדברת על 'עמוד החיים'.


    החיים חזרו לכאן ב-1995, כאשר הנזיר מקסימה קבטרדזה, בן צ'יאטורה, טיפס למעלה ונשאר כעשרים שנה, וירד
    כפעמיים בשבוע. כנסיית הפסגה, המוקדשת למקסימוס המודה, שוחזרה בשנים 2005–2009.


    מאז 2012 סולם הברזל סגור למבקרים מטעמי בטיחות. המבקרים נשארים למרגלות העמוד, לצד הכנסייה החדשה של
    שמעון העמודי וצלב תבליט החצוב בבסיס, ומביטים מעלה — כשם שעשה ואחושטי.
  tip: >-
    אל תתכננו לטפס: הסולם סגור למבקרים מאז 2012. ממגרש החניה מוביל שביל קצר למרגלות העמוד ולכנסייה התחתונה.
    חלים כללי לבוש של מנזר: לנשים — כיסוי ראש וחצאית, לגברים — מכנסיים ארוכים. ארבעים דקות עד שעה מספיקות.
    לצילום, הגיעו בבוקר או בשעות אחר הצהריים המאוחרות, כשהאור הצדי מדגיש את תבליט הסלע; בצהריים הוא נראה
    שטוח. שימו לב לצלב התבליט בבסיס. בתי קפה וכספומטים נמצאים בצ'יאטורה, כעשר דקות נסיעה משם.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד זסטפוני (כ-181 ק"מ), ואז פנו צפונה על כביש Sh22, העולה בעמק קווירילה
    לכיוון צ'יאטורה. אחרי כ-26 ק"מ, כמה קילומטרים לפני צ'יאטורה, פנו אל קאצחי; הקילומטר האחרון בכביש הכפרי
    מוביל למרגלות העמוד. בסך הכול כ-213 ק"מ ו-3 שעות ו-15 דקות. הכביש סלול לכל אורכו, אך Sh22 צר ושחוק
    במקומות מתעבורת הכרייה. תדלוק אפשרי בזסטפוני ובצ'יאטורה. החניה סמוך לעמוד מוגבלת. רכב חסכוני מתאים.
ar:
  name: عمود كاتسخي
  short: >-
    عمود من الحجر الجيري يبلغ ارتفاعه 40 مترًا يعلو وادي كاتسخوري، يتوّجه دير من العصور الوسطى أُعيد ترميمه؛
    ومنذ عام 2012 لا يراه الزوار إلا من الأسفل.
  body: >-
    **على مدى قرون، كانت الكنيسة المشيدة على قمة كاتسخي شيئًا يراه الجميع ولا يستطيع الوصول إليه أحد.**


    في القرن الثامن عشر كتب الأمير فاخوشتي: «توجد صخرة داخل الوادي تقف كعمود، شديدة العلوّ. وعلى قمة الصخرة
    كنيسة صغيرة، لكن لا يستطيع أحد الصعود إليها، ولا يعرف أحد كيف يمكن ذلك». والصخرة كتلة كلسية طبيعية
    يبلغ ارتفاعها نحو 40 مترًا، قرب تشياتورا، تعلو وادي كاتسخوري، أحد الروافد اليمنى لنهر كفيريلا. وقد
    قدّسها السكان المحليون بوصفها «عمود الحياة»، رمزًا للصليب الحقيقي، وتقول الأسطورة إن سلسلة من الحديد
    كانت تمتد من قمتها إلى قبة كنيسة القرية، على مسافة كيلومتر ونصف.


    في يوليو 1944 قاد المتسلق ألكسندر جاباريدزه، إلى جانب الكاتب ليفان غوتوا، أول تسلّق موثّق للصخرة.
    وعلى قمة تبلغ مساحتها نحو 150 مترًا مربعًا، عثرا على أنقاض ظنّها مؤرخ العمارة فاختانغ تسينتسادزه كنيستين
    تعودان إلى القرنين الخامس والسادس، وربطها بظاهرة النسّاك العموديين الذين عاشوا فوق الأعمدة. وأعادت
    حفريات جيورجي غاغوشيدزه في عام 2006 تأريخ المجمع إلى القرنين التاسع والعاشر: كنيسة دير، وخلايا للنسّاك،
    وقبو للنبيذ يحوي ثماني جرار «كفيفري» فخارية. وكتابة من القرن الثالث عشر عُثر عليها عام 2007 تذكر رجلًا
    اسمه جيورجي، بنى ثلاث خلايا، وتتحدث عن «عمود الحياة».


    وعادت الحياة إلى المكان عام 1995، حين صعد الراهب مكسيمه كافتارادزه، وهو من مواليد تشياتورا، إلى القمة
    وأقام فيها نحو عشرين عامًا، كان ينزل منها مرتين أسبوعيًا تقريبًا. وقد رُمّمت كنيسة القمة المكرّسة
    للقديس مكسيموس المعترف بين عامي 2005 و2009.


    ومنذ عام 2012 أُغلق السلّم الحديدي أمام الزوار لأسباب تتعلق بالسلامة. فيبقى الزائر عند سفح الصخرة،
    عند كنيسة القديس سمعان العموديّ الجديدة وصليب بارز محفور في قاعدتها، يرفع نظره إلى الأعلى، كما فعل
    فاخوشتي قبل قرون.
  tip: >-
    لا تخطط للتسلّق: السلّم مغلق أمام الزوار منذ عام 2012. من موقف السيارات يقود ممرّ قصير إلى سفح العمود
    وكنيسته السفلى. تُطبَّق قواعد اللباس الديرية: على النساء وضع غطاء رأس وارتداء تنورة، وعلى الرجال ارتداء
    بنطال طويل. تكفي أربعون دقيقة إلى ساعة. للتصوير، تعالَ صباحًا أو في وقت متأخر من بعد الظهر، حين يكشف
    الضوء الجانبي تفاصيل الصخرة؛ فهي تبدو مسطّحة عند الظهيرة. لا تفوّت الصليب البارز المحفور في القاعدة.
    توجد المقاهي وأجهزة الصرف الآلي في تشياتورا، على نحو عشر دقائق بالسيارة.
  route: >-
    من تبليسي، اتبع الطريق S1 (E60) غربًا حتى زستافوني (نحو 181 كم)، ثم انحرف شمالًا على طريق Sh22 الصاعد
    في وادي كفيريلا نحو تشياتورا. وبعد نحو 26 كم، على مسافة قليلة قبل تشياتورا، انحرف نحو كاتسخي؛ ويقودك
    الكيلومتر الأخير من طريق القرية إلى سفح العمود. المسافة الإجمالية نحو 213 كم، أي ثلاث ساعات وربع الساعة
    تقريبًا. الطريق مُعبَّد بالكامل، لكن طريق Sh22 ضيّق ومتهالك في بعض المواضع بسبب حركة شاحنات التعدين.
    يمكن التزوّد بالوقود في زستافوني وتشياتورا. مواقف السيارات قرب العمود محدودة. تكفي سيارة اقتصادية
    عادية.
