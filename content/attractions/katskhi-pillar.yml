ka:
  name: ქაცხის სვეტი
  short: ორმოცმეტრიანი კირქვის მონოლითი ეკლესიით მწვერვალზე — ასვლა სტუმრებისთვის დახურულია.
  body: >
    ქაცხის სვეტი ჭიათურასთან, სოფელ ქაცხთან დგას: ბუნებრივი კირქვის მონოლითი, რომელიც მიმდებარე ველიდან
    დაახლოებით ორმოცი მეტრით ამოიწევა და ზემოთ ბრტყელი მოედნით სრულდება. მის თხემზე პატარა ეკლესია და
    სენაკებია — გადმოცემით, IX–X საუკუნეებისა.


    ეს ადგილი წარმართული ხანიდან იყო საკულტო; შემდეგ სვეტზე მდგომ ბერთა, სტილიტების ტრადიციამ იმკვიდრა
    ფეხი. თანამედროვე ისტორია 1990-იან წლებში დაიწყო, როცა ბერი მაქსიმე ყავთარაძე სვეტზე ავიდა და იქ,
    პრაქტიკულად სრულ იზოლაციაში, ათწლეულების განმავლობაში ცხოვრობდა. საკვები და მასალა მას ჯაჭვის კიბითა
    და ჭოჭონაქით აჰქონდა.


    **მნიშვნელოვანი: სვეტზე ასვლა ვიზიტორებისთვის დახურულია.** კიბე მხოლოდ სასულიერო პირებისთვისაა და
    ტურისტს ზემოთ არ უშვებენ — ეს არ არის საკამათო წესი და გამონაკლისს არ აკეთებენ. სანახავად კი სვეტი
    ქვემოდან რჩება, და ეს სრულიად საკმარისია: ორმოცმეტრიანი ქვის სვეტი ეკლესიით მწვერვალზე შორიდანაც შთამბეჭდავია.


    ქვემოთ, სვეტის ძირში, სამონასტრო კომპლექსია — ეკლესია, ეზო და საკურთხეველი, სადაც შესვლა თავისუფალია.
    ვიზიტი ორმოც წუთს იკავებს და ჭიათურის საბაგიროებთან ერთად ერთდღიან მარშრუტს ქმნის.


    ქაცხიდან ათიოდე კილომეტრში ჭიათურაა — ქალაქი, რომელიც მანგანუმის მოპოვებაზე აშენდა და საბჭოთა პერიოდში
    საბაგიროების ქსელით დაიფარა. ნაწილი დღემდე მუშაობს განახლებული სახით. ეს ორი ობიექტი ერთმანეთს ძალიან
    განსხვავებული, მაგრამ თანაბრად უჩვეულო კადრებით ავსებს.
  tip: >-
    ასვლას ნუ დაგეგმავ — კიბესთან მისვლაც კი არ შეიძლება და დაცვა მკაცრია. საუკეთესო ფოტო დილით ან საღამოს
    გამოდის, როცა მზე გვერდიდან ანათებს სვეტს; შუადღისას განათება ბრტყელია. ქვედა ეზოში ჩვეულებრივი სამონასტრო
    ჩაცმის წესია: ქალებს თავსაფარი, მამაკაცებს გრძელი შარვალი. ორმოცი წუთი სავსებით საკმარისია. ტუალეტი
    მარტივია, კაფე და ბანკომატი — ჭიათურაში, ათიოდე კილომეტრში.
  route: >
    თბილისიდან E60-ით ზესტაფონის მიმართულებით მიდიხარ, შემდეგ ჩრდილოეთით უხვევ ჭიათურაზე და იქიდან ათიოდე
    კილომეტრში ქაცხშია. სულ დაახლოებით ორასხუთი კილომეტრი და სამი საათი. მთელი გზა ასფალტიანია; ჭიათურის
    მიმართულებით მონაკვეთი ვიწროა და მრეწველობის გამო ადგილ-ადგილ დაზიანებული, მაგრამ ეკონომ კლასისთვის
    პრობლემას არ ქმნის. საწვავი ზესტაფონსა და ჭიათურაშია. სვეტთან პატარა პარკინგია, ავტობუსებისთვის ადგილი
    ცოტაა. ჭიათურაში მისვლა ქაცხიდან ოციოდე წუთია და ორივეს ერთ ნახევარდღეში მოხვედრა ადვილია.
en:
  name: Katskhi Pillar
  short: A forty-metre limestone monolith with a church on top — visitors cannot climb it.
  body: >-
    Katskhi Pillar stands near Chiatura by the village of Katskhi: a natural limestone monolith rising
    roughly forty metres from the surrounding land, ending in a flat summit. On top sit a small church
    and monastic cells, traditionally dated to the 9th or 10th century.


    The site was a place of worship in pagan times, and later the tradition of stylites — monks who lived
    on pillars — took hold here. Its modern history began in the 1990s, when the monk Maxime Qavtaradze
    climbed up and lived there in near-total isolation for decades, hauling food and building material
    up on a chain ladder and a winch.


    **Important: visitors are not allowed to climb the pillar.** The ladder is reserved for clergy, tourists
    are not permitted to the top, and no exceptions are made. What remains is the view from below, which
    is genuinely enough: a forty-metre stone column crowned by a church is striking from a distance.


    At the base is a monastery complex with a church and courtyard, open to visitors. A stop takes about
    forty minutes, and it combines well with the cable cars and Soviet mining landscape of Chiatura a
    short drive away.
  tip: >-
    Do not plan on going up — you cannot even approach the ladder, and this is enforced. The best photographs
    come in the morning or late afternoon, when the sun hits the pillar from the side; at midday the light
    is flat. Standard monastery dress applies in the lower courtyard: headscarf for women, long trousers
    for men. Forty minutes covers it. Toilets are basic; cafes and ATMs are in Chiatura, about ten kilometres
    away.
  route: >-
    From Tbilisi take the E60 west towards Zestaponi, then turn north for Chiatura and continue about
    ten kilometres to Katskhi — around 205 km and three hours. The route is paved throughout. The Chiatura
    road is narrow and damaged in places by mining traffic, but it presents no problem for an economy
    car. Fuel is available in Zestaponi and Chiatura. There is a small parking area by the pillar with
    limited space for coaches.
ru:
  name: Столп Кацхи
  short: Сорокаметровый известняковый монолит с церковью на вершине — подъём для посетителей закрыт.
  body: >
    Столп Кацхи стоит рядом с Чиатурой у села Кацхи: природный известняковый монолит поднимается примерно
    на сорок метров над окружающей местностью и заканчивается плоской вершиной. Наверху — небольшая церковь
    и кельи, которые традиционно датируют IX-X веками.


    Место было культовым ещё в языческие времена, а позже здесь закрепилась традиция столпников — монахов,
    живущих на столпе. Новейшая история началась в 1990-х, когда монах Максиме Кавтарадзе поднялся наверх
    и десятилетиями жил там почти в полной изоляции, поднимая еду и стройматериалы по цепной лестнице
    и на лебёдке.


    **Важно: подниматься на столп посетителям нельзя.** Лестница предназначена только для священнослужителей,
    туристов наверх не пускают, и исключений не делают. Остаётся вид снизу, и его вполне достаточно: сорокаметровая
    каменная колонна с церковью на вершине впечатляет и издалека.


    У подножия расположен монастырский комплекс с церковью и двором, куда вход свободный. Осмотр занимает
    около сорока минут и хорошо сочетается с поездкой в Чиатуру с её канатными дорогами и советским горнопромышленным
    пейзажем.


    В десяти километрах от Кацхи находится Чиатура — город, выросший на добыче марганца и покрытый в советское
    время сетью канатных дорог. Часть из них работает и сегодня, уже в обновлённом виде. Эти два объекта
    дополняют друг друга совершенно разными, но одинаково необычными кадрами.
  tip: >-
    Подъём не планируйте — к лестнице даже не подойти, правило соблюдают строго. Лучшие кадры получаются
    утром или ближе к вечеру, когда солнце подсвечивает столп сбоку; в полдень свет плоский. В нижнем
    дворе действуют обычные монастырские правила: платок женщинам, длинные брюки мужчинам. Сорока минут
    достаточно. Туалет простой, кафе и банкоматы — в Чиатуре, примерно в десяти километрах.
  route: >-
    Из Тбилиси по трассе E60 в сторону Зестафони, затем поворот на север к Чиатуре и ещё около десяти
    километров до Кацхи — всего примерно 205 км и три часа. Дорога асфальтированная на всём протяжении.
    Участок к Чиатуре узкий и местами разбит грузовым транспортом рудников, но для машины эконом-класса
    это не проблема. Заправки есть в Зестафони и Чиатуре. У столпа небольшая парковка, места для автобусов
    немного.
fa:
  name: ستون کاتسخی
  short: تک‌سنگی آهکی چهل‌متری با کلیسایی بر قله‌اش — بازدیدکنندگان اجازهٔ بالا رفتن ندارند.
  body: >-
    ستون کاتسخی نزدیک چیاتورا کنار روستای کاتسخی ایستاده است: تک‌سنگی طبیعی از آهک که حدود چهل متر از
    زمین پیرامون بالا می‌آید و به قله‌ای تخت ختم می‌شود. بر بالای آن کلیسایی کوچک و حجره‌های راهبان قرار
    دارند که به‌طور سنتی به سدهٔ نهم یا دهم نسبت داده می‌شوند.


    این محل در روزگار پیش از مسیحیت جایگاه پرستش بود و بعدها سنت ستون‌نشینی — راهبانی که بر ستون‌ها زندگی
    می‌کردند — اینجا پا گرفت. تاریخ نوین آن از دههٔ 1990 آغاز شد، وقتی راهب ماکسیمه قاوتارادزه بالا رفت
    و دهه‌ها در انزوایی تقریباً کامل آنجا زیست و خوراک و مصالح ساختمانی را با نردبان زنجیری و چرخ‌چاه
    بالا کشید.


    **مهم: بازدیدکنندگان اجازهٔ بالا رفتن از ستون را ندارند.** نردبان ویژهٔ روحانیان است، گردشگران به
    قله راه ندارند و هیچ استثنایی قائل نمی‌شوند. آنچه می‌ماند منظره از پایین است، که واقعاً کافی است:
    ستونی سنگی به بلندی چهل متر با تاجی از کلیسا، از فاصله چشمگیر است.


    در پای آن مجموعه‌ای صومعه‌ای با کلیسا و حیاط هست که به روی بازدیدکنندگان باز است. توقف اینجا حدود
    چهل دقیقه طول می‌کشد و به‌خوبی با تله‌کابین‌ها و چشم‌انداز معدنی دوران شوروی چیاتورا در چند دقیقه
    رانندگی آن‌سوتر جفت می‌شود.
  tip: >-
    برنامهٔ بالا رفتن نریزید — حتی نمی‌توانید به نردبان نزدیک شوید و این قاعده اجرا می‌شود. بهترین عکس‌ها
    صبح یا اواخر بعدازظهر گرفته می‌شوند، وقتی آفتاب از پهلو به ستون می‌تابد؛ ظهرها نور تخت است. در حیاط
    پایین پوشش معمول صومعه‌ها لازم است: روسری برای زنان و شلوار بلند برای مردان. چهل دقیقه کافی است. سرویس
    بهداشتی ابتدایی است؛ کافه و خودپرداز در چیاتورا، حدود ده کیلومتر آن‌طرف‌تر.
  route: >-
    از تفلیس E60 را به سمت غرب تا زستافونی بگیرید، سپس به شمال به سوی چیاتورا بپیچید و حدود ده کیلومتر
    تا کاتسخی ادامه دهید — نزدیک 205 کیلومتر و سه ساعت. مسیر سرتاسر آسفالت است. جادهٔ چیاتورا باریک است
    و جاهایی از ترافیک معدن آسیب دیده، اما برای ماشین اقتصادی مشکلی ایجاد نمی‌کند. سوخت در زستافونی و
    چیاتورا موجود است. کنار ستون پارکینگ کوچکی هست که جای محدودی برای اتوبوس‌ها دارد.
he:
  name: עמוד קצחי
  short: מונוליט גיר בגובה ארבעים מטר ובראשו כנסייה — מבקרים אינם רשאים לטפס עליו.
  body: >-
    עמוד קצחי ניצב ליד צ'יאתורה, סמוך לכפר קצחי: מונוליט גיר טבעי המתנשא כארבעים מטר מעל הקרקע שסביבו
    ומסתיים בפסגה שטוחה. בראשו עומדים כנסייה קטנה ותאי נזירים, המתוארכים על פי המסורת למאה ה-9 או ה-10.


    האתר שימש מקום פולחן עוד בימי האלילות, ומאוחר יותר השתרשה כאן מסורת הסטיליטים — נזירים שחיו על גבי
    עמודים. ההיסטוריה המודרנית שלו החלה בשנות ה-90 של המאה ה-20, כשהנזיר מקסימה קווטרדזה טיפס למעלה וחי
    שם עשרות שנים בבידוד כמעט מוחלט, כשהוא מעלה מזון וחומרי בנייה בסולם שרשרת ובכננת.


    **חשוב: מבקרים אינם רשאים לטפס על העמוד.** הסולם שמור לאנשי הדת, תיירים אינם מורשים לעלות אל הפסגה,
    ואין יוצאים מן הכלל. מה שנשאר הוא הנוף מלמטה, והוא באמת מספיק לחלוטין: עמוד אבן בן ארבעים מטר שכנסייה
    קטנה מכתירה את ראשו הוא מראה מרשים כבר ממרחק גדול.


    למרגלותיו נמצא מתחם מנזר עם כנסייה וחצר, הפתוח למבקרים. עצירה כאן אורכת בערך ארבעים דקות, והיא משתלבת
    היטב עם הרכבלים ועם נוף הכרייה הסובייטי של צ'יאתורה, שנמצאת במרחק נסיעה קצרה מכאן.
  tip: >-
    אל תתכננו לעלות — אי אפשר אפילו להתקרב אל הסולם, וזה נאכף בפועל. הצילומים הטובים ביותר יוצאים בבוקר
    או לקראת ערב, כשהשמש פוגעת בעמוד מן הצד; בצהריים האור שטוח. בחצר התחתונה חל קוד לבוש רגיל של מנזר:
    מטפחת ראש לנשים ומכנסיים ארוכים לגברים. ארבעים דקות מספיקות. השירותים בסיסיים; בתי קפה וכספומטים נמצאים
    בצ'יאתורה, כעשרה קילומטרים משם.
  route: >-
    מטביליסי סעו בכביש E60 מערבה לכיוון זסטפוני, ואז פנו צפונה לכיוון צ'יאתורה והמשיכו עוד כעשרה קילומטרים
    עד קצחי — בסך הכול כ-205 ק״מ ושלוש שעות נסיעה. המסלול סלול לכל אורכו. הכביש לצ'יאתורה צר ופגום במקומות
    בגלל תנועת המכרות, אך אינו מציב שום בעיה לרכב אקונומי. דלק זמין בזסטפוני ובצ'יאתורה. ליד העמוד יש
    מגרש חניה קטן עם מקום מוגבל לאוטובוסים.
ar:
  name: عمود كاتسخي
  short: كتلة كلسية أحادية بارتفاع أربعين متراً وفوقها كنيسة — ولا يُسمح للزوار بتسلقها.
  body: >-
    يقوم عمود كاتسخي قرب تشياتورا بجوار قرية كاتسخي: كتلة كلسية طبيعية ترتفع نحو أربعين متراً عن الأرض
    المحيطة وتنتهي بقمة مسطحة. وفي أعلاها كنيسة صغيرة وقلالٍ للرهبان، تُؤرَّخ تقليدياً بالقرن التاسع أو
    العاشر.


    كان الموقع مكاناً للعبادة في العصر الوثني، ثم ترسّخ فيه لاحقاً تقليد العموديين — أي الرهبان الذين
    عاشوا فوق الأعمدة. وبدأ تاريخه الحديث في تسعينيات القرن الماضي، حين تسلّق الراهب مكسيمي كافتارادزه
    إلى الأعلى وعاش هناك عقوداً في عزلة شبه تامة، رافعاً الطعام ومواد البناء بسلّم سلسلي وونش.


    **مهم: لا يُسمح للزوار بتسلق العمود.** فالسلّم مخصص لرجال الدين، ولا يُسمح للسياح بالصعود إلى القمة،
    ولا استثناءات في ذلك. وما يبقى هو المنظر من الأسفل، وهو كافٍ فعلاً: عمود حجري بارتفاع أربعين متراً
    تتوّجه كنيسة صغيرة يبدو لافتاً حتى من مسافة بعيدة.


    وعند القاعدة مجمع دير فيه كنيسة وفناء مفتوح للزوار. وتستغرق الوقفة نحو أربعين دقيقة، وتتكامل جيداً
    مع تلفريكات تشياتورا ومشهد التعدين السوفييتي فيها، وهي على بعد قيادة قصيرة من هنا.
  tip: >-
    لا تخطط للصعود — فلا يمكنك حتى الاقتراب من السلّم، وهذا مطبق فعلاً. وأفضل الصور تُلتقط صباحاً أو في
    أواخر العصر، حين تضرب الشمس العمود من الجانب؛ أما عند الظهيرة فالضوء مسطح. ويسري في الفناء السفلي
    لباس الأديرة المعتاد: غطاء رأس للنساء وسراويل طويلة للرجال. وأربعون دقيقة تكفي. دورات المياه بدائية؛
    والمقاهي وأجهزة الصراف الآلي في تشياتورا على بعد نحو عشرة كيلومترات.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً نحو زيستافوني، ثم انعطف شمالاً إلى تشياتورا وتابع نحو عشرة كيلومترات
    حتى كاتسخي — أي نحو 205 كم وثلاث ساعات. والمسار معبّد طوال المسافة. وطريق تشياتورا ضيق ومتضرر في مواضع
    بسبب حركة شاحنات المناجم، لكنه لا يشكل أي مشكلة لسيارة اقتصادية. والوقود متوفر في زيستافوني وتشياتورا.
    وعند العمود موقف صغير بمساحة محدودة للحافلات.
