ka:
  name: ლომისის ეკლესია
  short: >-
    წმინდა გიორგის პატარა ქვის ეკლესია 2200 მეტრზე, მლეთის ზემოთ — აღმოსავლეთ საქართველოს ერთ-ერთი ყველაზე
    ცოცხალი სალოცავი.
  body: >-
    **ლომისა პატარა ქვის ეკლესიაა შიშველ ქედზე, დაახლოებით 2200 მეტრზე, და საქართველოს ერთ-ერთი ყველაზე
    ცოცხალი ხალხური სალოცავი.** მასთან ფეხით ადიან სამხედრო გზაზე მდებარე სოფელ მლეთიდან — დაახლოებით
    ორსაათიანი აღმართი ბალახიან კონცხზე, უკან არაგვის ხეობა ეშვება, წინ კი ქსნის მხარე იშლება.


    თავად ნაგებობა მოკრძალებულია: უთლელი ქვის დაბალი დარბაზული ეკლესია, შიგნით ბნელი, პატარა კამაროვანი
    სივრცით და პრაქტიკულად უდეკორო. მასში ჩამოკიდებულია მძიმე რკინის ჯაჭვი. მლოცველები მას წევენ ან მხარზე
    იდებენ აღთქმის დადებისას, და სწორედ სიმძიმეა აზრი — ეს სალოცავია, სადაც აკეთებენ და არა უყურებენ.


    ადგილს ძველი და ფართოდ ცნობილი თქმულება უკავშირდება. სპარსეთში ტყვედ წაყვანილი ქართველები წმინდა გიორგის
    შეევედრნენ; წმინდანის ხატი ტყვეობიდან ხარის რქებზე გამობრძანდა და სადაც დაქანცული პირუტყვი დაწვა,
    იქ ეკლესია ააშენეს. როგორიც არ უნდა იყოს ისტორია, კულტი ეკლესიაზე ძველია და მისი ელემენტები აშკარად
    ქრისტიანობამდელია: შესაწირავი პირუტყვი, ჯაჭვზე დადებული ფიცი, სალოცავი მწვერვალზე და არა სოფელში.


    ლომისობა, დღესასწაული, აღდგომიდან მეშვიდე ოთხშაბათს მოდის. იმ დღეს ქედზე რამდენიმე ათასი ადამიანი
    იყრის თავს, ცხვარსა და ხარს ამოიყვანენ და დაკლავენ, იმართება ჭიდაობა და სუფრა. ეს ტურისტებისთვის დადგმული
    სანახაობა არ არის და უნებართვო გადაღებას ცუდად იღებენ. ზოგი ოჯახი დღემდე იცავს ძველ წესებს იმის შესახებ,
    ვის სად შეიძლება შესვლა — უყურე, როგორ იქცევიან ადგილობრივი მლოცველები, და გაიმეორე.


    ჩვეულებრივ საზაფხულო დღეს ქედი შეიძლება ცხენების გარდა ცარიელი დაგხვდეს, ხედი კი ყაზბეგის მასივიდან
    ქსნის სათავეებამდე მიდის.
  tip: >-
    მლეთიდან ოთხი საათი ჩათვალე: ორი ასვლა, ერთი ზემოთ, ერთი ჩამოსვლა, პლუს დასვენება. ბილიკი ტექნიკურად
    რთული არაა, მაგრამ ღიაა, უჩრდილო და უწყლო, ივლის-აგვისტოში კი ქედზე შუადღის ჭექა-ქუხილი ჩვეულებრივია
    — ადრე დაიწყე. ჩექმა, ქარგაუმტარი ქურთუკი და ორ-ორი ლიტრი წყალი. ადგილობრივი მძღოლები ჯიპით თითქმის
    ზემოთამდე აგიყვანენ საფასურად, მაგრამ ბილიკი უხეშია და ყოველთვის გავლადი არაა. ნოემბრიდან მაისამდე
    ქედი თოვლქვეშაა და ასვლა უკვე ალპინიზმია და არა გასეირნება.
  route: >-
    საქართველოს სამხედრო გზით (E117) ჩრდილოეთით მიდიხარ ანანურსა და ფასანაურზე გავლით მლეთამდე — დაახლოებით
    108 კმ და ორი საათი და ათი წუთი ასფალტზე. მლეთა გუდაურისკენ ასასვლელი სერპანტინის ძირშია; სოფელში
    შეუხვიე და გზის ბოლოს დააპარკინგე. ამ წერტილამდე ეკონომ-კლასის მანქანაც უპრობლემოდ მიდის, თუმცა სოფლის
    შიდა გზები საკმარისად უხეშია იმისთვის, რომ ჯიპში უფრო კომფორტული იყოს. ბილიკი ბოლო სახლების ზემოთ
    იწყება და კარგად ნიშანდებული არაა — იკითხე. უახლოესი საწვავი და საჭმელი ფასანაურშია.
en:
  name: Lomisa Church
  short: >-
    A small stone church of St George at 2,200 metres above Mleta, one of the most genuinely living shrines
    in eastern Georgia.
  body: >-
    **Lomisa is a small stone church on a bare ridge at about 2,200 metres, and one of the most genuinely
    living folk shrines in Georgia.** It is reached on foot from the village of Mleta on the Military
    Highway — a climb of roughly two hours up a grassy spur, with the Aragvi valley dropping away behind
    you and the Ksani side opening ahead.


    The building itself is modest: a low hall church of undressed stone, dark inside, with a small vaulted
    chamber and virtually no decoration. Hanging in it is a heavy iron chain. Pilgrims lift it or put
    it over the shoulder while making a vow, and the weight is the point — this is a shrine where things
    are done rather than looked at.


    The story attached to the place is old and widely known. Georgians taken captive to Persia prayed
    to St George; an icon of the saint was carried out of captivity on the horns of a bull, and where
    the exhausted animal lay down the church was built. Whatever the history, the cult is older than the
    church and parts of it are plainly pre-Christian: animal sacrifice, oaths sworn on a chain, a shrine
    on a summit rather than in a village.


    Lomisoba, the feast, falls on the seventh Wednesday after Easter. On that day several thousand people
    fill the ridge, sheep and bulls are brought up and slaughtered, and there is wrestling and drinking.
    It is not staged for visitors, and photographing it without asking is badly received. Some families
    still keep older rules about who may enter which part of the shrine; watch what local pilgrims do
    and follow it.


    On an ordinary summer day you may find the ridge empty apart from horses, with a view running from
    the Kazbegi massif to the headwaters of the Ksani.
  tip: >-
    Count four hours from Mleta: two up, one at the top, one down, plus recovery. The path is steady rather
    than technical but it is exposed, with no shade and no water, and afternoon thunderstorms on the ridge
    are common in July and August — start early. Boots, a windproof layer and two litres of water each.
    Local drivers will take you most of the way up in a 4x4 for a fee, but the track is rough and not
    always passable. From November to May the ridge lies under snow and the climb becomes a mountaineering
    matter rather than a walk.
  route: >-
    Follow the Georgian Military Highway (E117) north from Tbilisi past Ananuri and Pasanauri to Mleta,
    about 108 km and two hours and ten minutes on asphalt. Mleta sits at the foot of the switchbacks up
    to Gudauri; turn into the village and park where the road ends. An economy car reaches that point
    without difficulty, though the village lanes are rough enough that an SUV is more comfortable. The
    trail up the ridge starts above the last houses and is poorly signed, so ask. The nearest fuel and
    food are in Pasanauri.
ru:
  name: Церковь Ломиса
  short: >-
    Маленькая каменная церковь святого Георгия на высоте 2200 метров над Млетой, одно из самых живых святилищ
    восточной Грузии.
  body: >-
    **Ломиса — маленькая каменная церковь на голом хребте на высоте около 2200 метров и одно из самых
    живых народных святилищ Грузии.** К ней поднимаются пешком из села Млета на Военно-Грузинской дороге:
    примерно два часа подъёма по травянистому отрогу, за спиной уходит вниз ущелье Арагви, впереди открывается
    ксанская сторона.


    Само здание скромно: низкая зальная церковь из необработанного камня, тёмная внутри, с маленьким сводчатым
    помещением и практически без декора. Внутри висит тяжёлая железная цепь. Паломники поднимают её или
    кладут на плечо, давая обет, и вес здесь — суть дела: это святилище, где действуют, а не смотрят.


    С местом связано старое и широко известное предание. Грузины, угнанные в плен в Персию, молились святому
    Георгию; икона святого вышла из плена на рогах быка, и там, где обессиленное животное легло, построили
    церковь. Какова бы ни была история, культ древнее церкви, и часть его явно дохристианская: жертвенные
    животные, клятва на цепи, святилище на вершине, а не в селе.


    Ломисоба, престольный праздник, приходится на седьмую среду после Пасхи. В этот день на хребет поднимаются
    несколько тысяч человек, приводят и режут овец и быков, борются и пируют. Это не постановка для приезжих,
    и съёмка без спроса воспринимается плохо. Часть семей до сих пор соблюдает старые правила о том, кому
    куда можно входить: смотрите, как поступают местные паломники, и повторяйте.


    В обычный летний день хребет может оказаться пустым, если не считать лошадей, а вид тянется от массива
    Казбека до верховьев Ксани.
  tip: >-
    Считайте четыре часа от Млеты: два вверх, час наверху, час вниз плюс отдых. Тропа не техническая,
    но открытая, без тени и без воды, а послеобеденные грозы на хребте в июле и августе обычны — выходите
    рано. Ботинки, ветрозащитная куртка и по два литра воды. Местные водители за плату довезут почти доверху
    на внедорожнике, но колея разбита и проходима не всегда. С ноября по май хребет под снегом, и подъём
    становится делом альпинистским, а не прогулочным.
  route: >-
    По Военно-Грузинской дороге (E117) на север от Тбилиси мимо Ананури и Пасанаури до Млеты — около 108
    км и два часа десять минут по асфальту. Млета лежит у подножия серпантина, ведущего на Гудаури; сверните
    в село и оставьте машину там, где кончается дорога. До этой точки без труда доезжает и машина эконом-класса,
    хотя сельские проезды разбиты настолько, что на внедорожнике комфортнее. Тропа наверх начинается выше
    последних домов и плохо обозначена — спросите. Ближайшие заправка и еда — в Пасанаури.
fa:
  name: کلیسای لومیسا
  short: کلیسای سنگی کوچک سنت گئورگی در ارتفاع 2200 متری بالای ملتا، از زنده‌ترین زیارتگاه‌های شرق گرجستان.
  body: >-
    **لومیسا کلیسایی سنگی و کوچک بر یالی برهنه در ارتفاع نزدیک 2200 متر است و از زنده‌ترین زیارتگاه‌های
    مردمی گرجستان.** از روستای ملتا بر بزرگراه نظامی پیاده به آن می‌روند: حدود دو ساعت بالا رفتن از زبانه‌ای
    علفی، با درهٔ آراگوی که پشت سرتان فرو می‌افتد و سمت کسانی که پیش رویتان گشوده می‌شود.


    خود بنا فروتن است: کلیسایی تالاری و کوتاه از سنگ نتراشیده، تاریک در درون، با فضایی کوچک و طاقی و تقریباً
    بدون هیچ تزیین. در آن زنجیری آهنی و سنگین آویخته است. زائران هنگام نذر آن را بلند می‌کنند یا بر دوش
    می‌گذارند و سنگینی‌اش خودِ مقصود است؛ اینجا زیارتگاهی است که در آن کاری می‌کنند، نه چیزی تماشا.


    روایتی کهن و شناخته‌شده به این جا پیوسته است. گرجیانی که به اسارت به ایران برده شده بودند به سنت گئورگی
    روی آوردند؛ شمایل قدیس بر شاخ گاوی نری از اسارت بیرون آمد و همان جا که جانور از پا افتاده خوابید،
    کلیسا را ساختند. تاریخ هرچه باشد، آیین کهن‌تر از کلیساست و بخش‌هایی از آن آشکارا پیش از مسیحیت است:
    قربانی جانور، سوگند بر زنجیر، و زیارتگاهی بر قله نه در روستا.


    لومیسوبا، جشن این زیارتگاه، هفتمین چهارشنبهٔ پس از عید پاک است. آن روز چند هزار تن یال را پر می‌کنند،
    گوسفند و گاو نر بالا می‌آورند و قربانی می‌کنند، و کشتی و بزم برپاست. این نمایشی برای مهمانان نیست
    و عکس گرفتن بی‌اجازه بد تلقی می‌شود. برخی خانواده‌ها هنوز قواعد کهن دربارهٔ اینکه چه کسی به کدام بخش
    می‌تواند وارد شود را نگه می‌دارند؛ ببینید زائران محلی چه می‌کنند و همان کنید.


    در یک روز معمولی تابستان ممکن است یال را جز چند اسب خالی بیابید، و چشم‌انداز از تودهٔ کازبگی تا سرچشمه‌های
    کسانی کشیده می‌شود.
  tip: >-
    از ملتا چهار ساعت حساب کنید: دو ساعت بالا، یکی در قله، یکی پایین، به‌علاوهٔ استراحت. مسیر فنی نیست
    اما باز است، بی‌سایه و بی‌آب، و رگبار و رعد بعدازظهر روی یال در تیر و مرداد معمول است، پس زود راه
    بیفتید. پوتین، لایهٔ بادگیر و دو لیتر آب برای هر نفر. رانندگان محلی با خودروی چهارچرخ‌محرک شما را
    در برابر کرایه تا نزدیک بالا می‌برند، اما مسیر ناهموار است و همیشه باز نیست. از آبان تا اردیبهشت یال
    زیر برف است و صعود کاری کوهنوردی می‌شود نه پیاده‌روی.
  route: >-
    بزرگراه نظامی گرجستان (E117) را از تفلیس به شمال و از کنار آنانوری و پاسانائوری تا ملتا بروید، حدود
    108 کیلومتر و دو ساعت و ده دقیقه روی آسفالت. ملتا در پای پیچ‌های صعود به گودائوری است؛ به درون روستا
    بپیچید و آنجا که جاده تمام می‌شود پارک کنید. تا همین نقطه خودروی اقتصادی هم بی‌دردسر می‌رسد، هرچند
    کوچه‌های روستا چنان ناهموار است که شاسی‌بلند راحت‌تر است. مسیر پیاده بالای آخرین خانه‌ها آغاز می‌شود
    و تابلوی درستی ندارد، پس بپرسید. نزدیک‌ترین سوخت و غذا در پاسانائوری است.
he:
  name: כנסיית לומיסה
  short: כנסיית אבן קטנה של גאורגיוס הקדוש בגובה 2,200 מטר מעל מלטה, מן המקדשים החיים ביותר במזרח גאורגיה.
  body: >-
    **לומיסה היא כנסיית אבן קטנה על רכס חשוף בגובה כ-2,200 מטר, ואחד המקדשים העממיים החיים באמת בגאורגיה.**
    מגיעים אליה ברגל מן הכפר מלטה שעל כביש הצבא: טיפוס של כשעתיים במעלה שלוחה מכוסת עשב, כשעמק האראגווי
    צונח מאחוריכם וצד הקסאני נפתח לפנים.


    המבנה עצמו צנוע: כנסיית אולם נמוכה מאבן לא מסותתת, אפלה בפנים, עם חלל מקומר קטן וכמעט בלי עיטור. בתוכה
    תלויה שרשרת ברזל כבדה. עולי רגל מרימים אותה או מניחים אותה על הכתף בשעה שהם נודרים נדר, והמשקל הוא
    העניין: זהו מקדש שבו עושים ולא מסתכלים.


    הסיפור הקשור למקום עתיק ומוכר. גאורגים שנלקחו בשבי לפרס התפללו לגאורגיוס הקדוש; אייקון של הקדוש יצא
    מן השבי על קרני שור, ובמקום שבו רבצה החיה המותשת נבנתה הכנסייה. תהא ההיסטוריה אשר תהא, הפולחן עתיק
    מן הכנסייה וחלקים ממנו קדם-נוצריים בעליל: קורבן בעלי חיים, שבועה על שרשרת, ומקדש על פסגה ולא בכפר.


    לומיסובה, החג, חל ביום רביעי השביעי אחרי הפסחא. באותו יום מתמלא הרכס בכמה אלפי אנשים, מעלים כבשים
    ופרים ושוחטים אותם, ויש היאבקות ומשתה. זו אינה הצגה למבקרים, וצילום בלי לשאול מתקבל רע. משפחות אחדות
    עדיין שומרות על כללים ישנים בדבר מי רשאי להיכנס לאיזה חלק; התבוננו במה שעושים עולי הרגל המקומיים ועשו
    כמותם.


    ביום קיץ רגיל ייתכן שתמצאו את הרכס ריק פרט לסוסים, והנוף נמתח ממסיף קזבגי עד מקורות הקסאני.
  tip: >-
    חשבו ארבע שעות ממלטה: שעתיים למעלה, שעה בפסגה, שעה למטה ועוד התאוששות. השביל אינו טכני אלא מתמשך,
    אך הוא חשוף, בלי צל ובלי מים, וסופות רעמים אחר הצהריים על הרכס שכיחות ביולי ובאוגוסט — צאו מוקדם.
    נעלי הליכה, שכבה אטומה לרוח ושני ליטרים מים לאדם. נהגים מקומיים יעלו אתכם כמעט עד למעלה ברכב שטח בתשלום,
    אך הדרך גסה ולא תמיד עבירה. מנובמבר עד מאי הרכס מושלג והטיפוס נעשה עניין של טיפוס הרים ולא של הליכה.
  route: >-
    סעו צפונה מטביליסי בכביש הצבא הגאורגי (E117) על פני אנאנורי ופסנאורי עד מלטה, כ-108 ק״מ ושעתיים ועשר
    דקות על אספלט. מלטה נמצאת למרגלות סיבובי העלייה לגודאורי; פנו אל תוך הכפר וחנו במקום שבו הדרך נגמרת.
    עד הנקודה הזאת מגיע גם רכב חסכוני בלי קושי, אף שדרכי הכפר גסות דיין כדי שרכב שטח יהיה נוח יותר. השביל
    אל הרכס מתחיל מעל הבתים האחרונים ואינו משולט היטב, אז שאלו. הדלק והמזון הקרובים ביותר הם בפסנאורי.
ar:
  name: كنيسة لوميسا
  short: كنيسة حجرية صغيرة للقديس جيورجي على ارتفاع 2200 متر فوق مليتا، من أحيا المزارات الشعبية في شرق
    جورجيا.
  body: >-
    **لوميسا كنيسة حجرية صغيرة على سلسلة عارية عند ارتفاع نحو 2200 متر، وهي من أكثر المزارات الشعبية حياةً
    في جورجيا.** يُوصل إليها سيراً من قرية مليتا على الطريق العسكري: صعود نحو ساعتين على نتوء عشبي، بينما
    ينحدر وادي أراغفي خلفك وينفتح جانب كساني أمامك.


    المبنى نفسه متواضع: كنيسة قاعية منخفضة من حجر غير منحوت، مظلمة من الداخل، بحيز معقود صغير وبلا زخرفة
    تقريباً. وفيها سلسلة حديدية ثقيلة معلقة. يرفعها الحجاج أو يضعونها على الكتف وهم ينذرون، والثقل هو
    المقصد؛ فهذا مزار يُفعل فيه شيء ولا يُنظر إليه فحسب.


    والحكاية المرتبطة بالمكان قديمة ومعروفة. فقد دعا جورجيون أُسروا إلى بلاد فارس القديس جيورجي؛ فخرجت
    أيقونته من الأسر على قرني ثور، وحيث ربض الحيوان المنهك بُنيت الكنيسة. وأياً كان التاريخ، فالطقس أقدم
    من الكنيسة وبعض عناصره سابق للمسيحية بوضوح: ذبح القرابين، والحلف على السلسلة، ومزار على قمة لا في
    قرية.


    ولوميسوبا، وهو العيد، يقع في الأربعاء السابع بعد الفصح. في ذلك اليوم يملأ السلسلة آلاف من الناس، ويُصعَد
    بالخراف والثيران وتُذبح، ويقام الصراع والولائم. وهذا ليس عرضاً للزوار، والتصوير دون استئذان يُستقبل
    بسوء. وما زالت بعض العائلات تحفظ قواعد قديمة عمن يجوز له دخول أي جزء؛ فراقب ما يفعله الحجاج المحليون
    واتبعه.


    وفي يوم صيف عادي قد تجد السلسلة خالية إلا من الخيول، والمنظر يمتد من كتلة كازبيغي إلى منابع كساني.
  tip: >-
    احسب أربع ساعات من مليتا: ساعتان صعوداً، وساعة في الأعلى، وساعة نزولاً، وراحة فوق ذلك. الدرب ليس تقنياً
    بل متواصل، لكنه مكشوف بلا ظل ولا ماء، والعواصف الرعدية بعد الظهر على السلسلة شائعة في تموز وآب، فابدأ
    باكراً. حذاء جبلي، وطبقة صادّة للريح، ولتران من الماء لكل شخص. وسيأخذك سائقون محليون بسيارة دفع رباعي
    إلى قرب القمة بأجر، لكن المسلك وعر وليس سالكاً دائماً. ومن تشرين الثاني إلى أيار تكون السلسلة تحت
    الثلج ويصير الصعود شأناً جبلياً لا نزهة.
  route: >-
    اتبع الطريق العسكري الجورجي (E117) شمالاً من تبليسي بمحاذاة أنانوري وباسانائوري حتى مليتا، نحو 108
    كم وساعتين وعشر دقائق على الإسفلت. تقع مليتا عند سفح المنعطفات الصاعدة إلى غودااوري؛ انعطف إلى داخل
    القرية وأوقف السيارة حيث ينتهي الطريق. تصل سيارة اقتصادية إلى تلك النقطة بلا عناء، وإن كانت طرقات
    القرية وعرة بما يجعل سيارة الدفع الرباعي أريح. ويبدأ الدرب فوق آخر البيوت وهو ضعيف اللافتات، فاسأل.
    وأقرب وقود وطعام في باسانائوري.
