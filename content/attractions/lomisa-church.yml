ka:
  name: ლომისის ეკლესია
  short: >-
    წმინდა გიორგის IX–X საუკუნეების სალოცავი მლეთის ზემოთ, 2200 მეტრზე: აქ მთიელები უმძიმეს ფიცს დებდნენ
    და ლომისობას დღესაც ცხვრით ადიან.
  body: >-
    **აღმოსავლეთ საქართველოს მთიელისთვის ყველაზე მძიმე ფიცი ლომისის წმინდა გიორგიზე იდებოდა — თავად სალოცავი
    კი დაბალი ქვის ეკლესიაა შიშველ ქედზე, 2200 მეტრზე, სადაც ქარისა და ორი ხეობის მეტი არაფერია.**


    ეკლესია IX–X საუკუნეებში ნატეხი ქვით აუგიათ არაგვისა და ქსნის წყალგამყოფ ქედზე, მლეთიდან დაახლოებით
    შვიდი კილომეტრით სამხრეთით. ლომისა მთიულეთისა და ქსნის ხეობის უპირველესი სალოცავი იყო: აქ იკრიბებოდა
    თემი ომისა და ზავის გადასაწყვეტად. მეფეებიც სცემდნენ პატივს: XIV საუკუნის 20-იან წლებში გიორგი V ბრწყინვალე
    დარიალიდან დაბრუნებისას აქ შეიარა სალოცავად, მის მიერ მთისთვის დადგენილი სამართალი კი ლომისის ყმის
    მკვლელს ათას ხუთას თეთრს აზღვევინებდა.


    შიგნით ბნელა და დაბალია, შენობა კი ნახევრად საკუთარ ნანგრევებშია ჩამჯდარი. ორ რამეს მიაქციეთ ყურადღება:
    რკინით მოჭედილ მუხის კარს XVI–XVII საუკუნეების ქართული წარწერებით და ძველ, მძიმე ჯაჭვს. მლოცველი ჯაჭვს
    კისერზე იდებს და სათხოვრის ასასრულებლად ან აღთქმის დასადებად ეკლესიას სამჯერ შემოუვლის, საათის ისრის
    საწინააღმდეგოდ.


    გადმოცემით, ეკლესია შვიდი ათასი ქართველის ხვარაზმელთა ტყვეობიდან დახსნას აღნიშნავს: ტყვეები წმინდა
    გიორგის ხატმა გამოიხსნა, ხატი კი ხარმა, სახელად ლომამ, ზურგით ჩამოაბრძანა. მეორე თქმულება მოგვითხრობს,
    რომ სამეფო რაზმის მეთაურმა ეკლესიის კარი შეშად დაჩეხა; მეომრებს თვალი დაუბნელდათ და თვალის ჩინი მხოლოდ
    მაშინ დაუბრუნდათ, როცა მეთაურმა რკინის კარის შეწირვა აღუთქვა.


    ლომისობა სულთმოფენობის მომდევნო ოთხშაბათს იმართება. ქედზე ათასობით ადამიანი ადის მთიულეთიდან, ხევიდან,
    ხევსურეთიდან; ლოცულობენ სნეულთა განკურნებისა და უშვილოთა შვილისთვის, ფერხულს აბამენ ჯაჭვზე შეთხზული
    სიმღერით და ასობით ცხვარს სწირავენ. ეს ღვთისმსახურებაა და არა სანახაობა.


    სხვა დროს, ზაფხულის ჩვეულებრივ დღეს, ქედი ცხენებსა და ქარს ეკუთვნის. სამხრეთით ქსნის ზემო ხეობა მოჩანს,
    2008 წლის ომის შემდეგ ოკუპირებული: თვალი წვდება, ფეხი — ვეღარ.
  tip: >-
    მლეთიდან ოთხ-ხუთ საათს ანგარიშობენ ასვლა-ჩამოსვლით და ზემოთ შესვენებით. ბილიკი ტექნიკურად მარტივია,
    მაგრამ ქედზე არც წყალია და არც ჩრდილი, ივლის-აგვისტოში კი შუადღისას ჭექა-ქუხილი ხშირია — გზას განთიადზე
    დაადექით. ჩაიცვით მთის ფეხსაცმელი, წაიღეთ ქარსაფარი და კაცზე ორი ლიტრი წყალი. ნოემბრიდან მაისამდე
    ქედი თოვლშია და ასვლა უკვე ზამთრის ალპინიზმია. ჩაიცვით თავდაჭერილად, გადაღებამდე ნებართვა ითხოვეთ,
    მით უფრო ლომისობაზე, როცა მსხვერპლს ღია ცის ქვეშ სწირავენ. ქედის სამხრეთ ფერდზე ნუ ჩახვალთ: ის საოკუპაციო
    ხაზისკენ ეშვება, სადაც მოგზაურს დაკავება ემუქრება.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთისკენ გაემართეთ ჟინვალის, ანანურისა და ფასანაურის
    გავლით მლეთამდე — ბოლო სოფლამდე, საიდანაც სერპანტინი გუდაურისკენ იწყებს ასვლას. ეს დაახლოებით 108
    კილომეტრი და ორი საათი და ათი წუთია, მთელ გზაზე ასფალტი, ჯვრის უღელტეხილის თოვლიან მონაკვეთამდე კი
    არ მიდიხართ. სოფელში შეუხვიეთ და მანქანა იქ დატოვეთ, სადაც ქუჩები თავდება. აქამდე ეკონომკლასის მანქანაც
    მოვა, თუმცა ორმოიან სოფლის გზაზე ჯიპი უფრო მოსახერხებელია. შემდეგ მხოლოდ ფეხით: ბილიკი ბოლო სახლების
    ზემოთ იწყება და ცუდადაა მონიშნული, ამიტომ სოფელში ჰკითხეთ. საწვავი და საჭმელი ფასანაურშია.
en:
  name: Lomisa Church
  short: >-
    A 9th–10th-century shrine of St George on a 2,200 m ridge above Mleta, where highlanders swore their
    gravest oaths and still bring sheep on Lomisoba.
  body: >-
    **The most binding oath a highlander of eastern Georgia could swear was by St George of Lomisa, and
    his church is a low stone hall on a bare ridge at 2,200 metres, with nothing around it but wind and
    the two valleys it divides.**


    It was raised in rough, unhewn stone in the 9th or 10th century on the watershed between the Aragvi
    and the Ksani, some seven kilometres south of Mleta, and here the communities of Mtiuleti gathered
    to decide on war and peace. In the 1320s King George V stopped to pray on his way back from Darial,
    and his law for the mountains fined the killer of a Lomisa peasant fifteen hundred pieces of silver.


    Inside it is dark and low, the building half-sunk in its own rubble. Look for two things: an oak door
    sheathed in iron, with Georgian inscriptions of the 16th–17th centuries, and a heavy old chain, which
    pilgrims hang round their necks before walking three times anticlockwise round the church to seal
    a vow.


    Tradition says the church marks the deliverance of seven thousand Georgians from Khwarazmian captivity
    by an icon of St George that came home on the back of an ox called Loma (the name means "lion"). Another
    tale explains the door: a royal captain chopped the old one up for firewood, his men went blind, and
    they saw again only when he vowed a door of iron.


    On Lomisoba, the Wednesday after Pentecost, thousands climb from Mtiuleti, Khevi and Khevsureti to
    pray for the sick and the childless, dance a round to a song about the chain and sacrifice sheep by
    the hundred. It is worship, not a show.


    On an ordinary summer day the ridge belongs to horses and wind. To the south lies the upper Ksani
    valley, occupied since the war of 2008: close enough to see, no longer close enough to walk to.
  tip: >-
    Allow four to five hours from Mleta, up and back, with a rest at the top. The path is not technical,
    but the ridge has no water and no shade, and afternoon thunderstorms are common in July and August,
    so set off at first light with boots, a windproof layer and two litres of water each. From November
    to May the ridge is under snow and the climb becomes winter mountaineering. Dress modestly and ask
    before photographing, above all on Lomisoba, when sacrifices happen in the open. Stay off the southern
    slopes: they run down towards the occupation line, where walkers risk detention.
  route: >-
    From Tbilisi take the Georgian Military Highway (S3/E117) north through Zhinvali, Ananuri and Pasanauri
    to Mleta, the last village before the hairpins climb to Gudauri: about 108 km and 2 hours 10 minutes,
    asphalt all the way and short of the snow-prone Jvari Pass. Turn into the village and park where the
    lanes give out. An economy car gets this far, though the potholed village lanes make an SUV more comfortable.
    Everything above is on foot; the trail leaves from above the last houses and is poorly marked, so
    ask a villager for the Lomisa path. Fuel and food in Pasanauri.
ru:
  name: Церковь Ломиса
  short: >-
    Святилище святого Георгия IX–X веков на хребте высотой 2200 м над Млетой, где горцы приносили самые
    страшные клятвы и куда до сих пор ведут овец на Ломисобу.
  body: >-
    **Самой нерушимой клятвой, какую мог дать горец восточной Грузии, была клятва святым Георгием Ломисским,
    а его церковь — низкий каменный зал на голом хребте высотой 2200 метров, вокруг которого нет ничего,
    кроме ветра и двух долин, которые этот хребет разделяет.**


    Её сложили из грубого, неотёсанного камня в IX или X веке на водоразделе Арагви и Ксани, примерно
    в семи километрах к югу от Млеты, и здесь общины Мтиулети собирались решать вопросы войны и мира.
    В 1320-х годах царь Георгий V остановился здесь помолиться на обратном пути из Дарьяла, а его закон
    для горцев назначал убийце ломисского крестьянина пеню в полторы тысячи серебряных монет.


    Внутри темно и тесно, здание наполовину утонуло в собственных завалах. Ищите две вещи: дубовую дверь,
    окованную железом, с грузинскими надписями XVI–XVII веков, и тяжёлую старую цепь — паломники надевают
    её на шею, прежде чем трижды обойти церковь против часовой стрелки, скрепляя обет.


    Предание говорит, что церковь отмечает избавление семи тысяч грузин из хорезмийского плена иконой
    святого Георгия, которая вернулась домой на спине быка по имени Лома (это имя значит «лев»). Другая
    легенда объясняет дверь: царский военачальник изрубил старую на дрова, его люди ослепли и прозрели
    лишь тогда, когда он дал обет поставить дверь из железа.


    На Ломисобу, в среду после Троицы, тысячи людей поднимаются сюда из Мтиулети, Хеви и Хевсурети, чтобы
    помолиться о больных и бездетных, водят хоровод под песню о цепи и приносят в жертву сотни овец. Это
    богослужение, а не представление.


    В обычный летний день хребет принадлежит лошадям и ветру. На юге лежит верхняя долина Ксани, оккупированная
    после войны 2008 года: достаточно близко, чтобы увидеть, и уже недостаточно, чтобы дойти.
  tip: >-
    Закладывайте четыре-пять часов от Млеты туда и обратно с отдыхом наверху. Тропа нетехничная, но на
    хребте нет ни воды, ни тени, а в июле и августе после полудня часты грозы, так что выходите на рассвете
    в ботинках, с ветрозащитным слоем и двумя литрами воды на человека. С ноября по май хребет под снегом,
    и подъём превращается в зимний альпинизм. Одевайтесь скромно и спрашивайте, прежде чем фотографировать,
    — особенно на Ломисобу, когда жертвоприношения совершаются под открытым небом. Не спускайтесь на южные
    склоны: они ведут к линии оккупации, где путникам грозит задержание.
  route: >-
    Из Тбилиси поезжайте по Военно-Грузинской дороге (S3/E117) на север через Жинвали, Ананури и Пасанаури
    до Млеты — последнего села перед серпантином, который поднимается к Гудаури: около 108 км и 2 часа
    10 минут, всё по асфальту и ещё до снежного Крестового перевала. Заезжайте в село и оставьте машину
    там, где кончаются проулки. Машина эконом-класса доберётся сюда, хотя по разбитым сельским улочкам
    удобнее на внедорожнике. Дальше всё пешком: тропа начинается над последними домами и размечена плохо,
    так что спросите у местных дорогу на Ломиса. Заправка и еда — в Пасанаури.
fa:
  name: کلیسای لومیسا
  short: >-
    زیارتگاه گئورگی قدیس از سدهٔ نهم تا دهم بر یالی ۲۲۰۰ متری بالای ملتا، جایی که کوه‌نشینان گران‌ترین
    سوگندهایشان را می‌خوردند و هنوز در لومیسوبا گوسفند می‌آورند.
  body: >-
    **استوارترین سوگندی که یک کوه‌نشین شرق گرجستان می‌توانست بخورد، سوگند به گئورگی قدیسِ لومیسا بود،
    و کلیسای او تالاری سنگی و کوتاه است بر یالی برهنه در ارتفاع ۲۲۰۰ متری، که گرداگردش چیزی جز باد و دو
    دره‌ای که این یال از هم جدا می‌کند نیست.**


    این کلیسا در سدهٔ نهم یا دهم از سنگ ناهموار و نتراشیده بر آبپخشان میان آراگوی و کسانی، حدود هفت کیلومتری
    جنوب ملتا، برپا شد، و جماعت‌های متیولتی اینجا گرد می‌آمدند تا دربارهٔ جنگ و صلح تصمیم بگیرند. در دههٔ
    ۱۳۲۰، شاه گئورگی پنجم در بازگشت از داریال برای نیایش اینجا درنگ کرد، و قانونی که برای کوهستان نهاد،
    کشندهٔ یک دهقان لومیسا را به پرداخت هزار و پانصد سکهٔ نقره محکوم می‌کرد.


    درونش تاریک و کوتاه است و بنا تا نیمه در آوار خود فرو رفته است. به دنبال دو چیز بگردید: دری از چوب
    بلوط با روکش آهن و کتیبه‌های گرجی از سده‌های شانزدهم و هفدهم، و زنجیری کهنه و سنگین که زائران پیش
    از سه بار گشتن به دور کلیسا در خلاف جهت عقربه‌های ساعت، برای استوار کردن نذرشان، به گردن می‌آویزند.


    روایت‌ها می‌گویند این کلیسا یادگار رهایی هفت هزار گرجی از اسارت خوارزمیان است، به یاری شمایل گئورگی
    قدیس که بر پشت گاوی به نام لوما (به معنای «شیرِ بیشه») به خانه بازگشت. داستانی دیگر ماجرای در را بازمی‌گوید:
    سرداری از سپاه شاه در کهنه را برای هیزم خرد کرد، مردانش کور شدند، و تنها وقتی بینایی‌شان بازگشت که
    او نذر کرد دری از آهن بسازد.


    در لومیسوبا، چهارشنبهٔ پس از عید پنجاهه (پنطیکاست)، هزاران نفر از متیولتی، خِوی و خِوسورتی بالا می‌آیند
    تا برای بیماران و بی‌فرزندان دعا کنند، به آواز ترانه‌ای دربارهٔ زنجیر حلقه‌وار می‌رقصند و گوسفندان
    را صدتا صدتا قربانی می‌کنند. این عبادت است، نه نمایش.


    در یک روز عادی تابستان، یال از آنِ اسب‌ها و باد است. در جنوب، بخش بالایی درهٔ کسانی گسترده است که
    از جنگ ۲۰۰۸ در اشغال است: آن‌قدر نزدیک که دیده شود، و دیگر نه آن‌قدر نزدیک که بتوان پیاده تا آنجا
    رفت.
  tip: >-
    از ملتا، رفت و برگشت با استراحتی در بالا، چهار تا پنج ساعت وقت بگذارید. مسیر فنی نیست، اما یال نه
    آب دارد نه سایه، و در ژوئیه و اوت توفان‌های تندری بعدازظهر رایج است؛ پس با نخستین روشنایی روز راه
    بیفتید، با پوتین، لایه‌ای بادگیر و دو لیتر آب برای هر نفر. از نوامبر تا مه یال زیر برف است و صعود
    به کوهنوردی زمستانی بدل می‌شود. پوشیده لباس بپوشید و پیش از عکاسی اجازه بگیرید، به‌ویژه در لومیسوبا
    که قربانی‌ها در فضای باز انجام می‌شود. از دامنه‌های جنوبی دوری کنید: به سوی خط اشغال پایین می‌روند،
    جایی که کوه‌پیمایان در خطر بازداشت‌اند.
  route: >-
    از تفلیس از جادهٔ نظامی گرجستان (S3/E117) به شمال، از ژینوالی، آنانوری و پاسانائوری تا ملتا بروید،
    آخرین روستا پیش از آنکه پیچ‌های تند به سوی گودائوری بالا بروند: حدود ۱۰۸ کیلومتر و ۲ ساعت و ۱۰ دقیقه،
    سراسر آسفالت و پیش از گردنهٔ برفگیر جواری. وارد روستا شوید و جایی که کوچه‌ها تمام می‌شوند پارک کنید.
    خودروی اقتصادی تا اینجا می‌رسد، هرچند کوچه‌های پرچاله‌چولهٔ روستا با شاسی‌بلند راحت‌ترند. از آنجا
    به بعد همه‌اش پیاده است؛ مسیر از بالای آخرین خانه‌ها آغاز می‌شود و نشانه‌گذاری‌اش ضعیف است، پس راه
    لومیسا را از یکی از اهالی بپرسید. سوخت و غذا در پاسانائوری.
he:
  name: כנסיית לומיסה
  short: >-
    מקדש של גאורגיוס הקדוש מן המאות ה-9–10 על רכס בגובה 2,200 מטר מעל מלטה, שבו נשבעו בני ההרים את שבועותיהם
    החמורות ביותר, ואליו מביאים כבשים עד היום בלומיסובה.
  body: >-
    **השבועה המחייבת ביותר שיכול היה בן הרים ממזרח גאורגיה להישבע הייתה בגאורגיוס הקדוש של לומיסה, וכנסייתו
    היא אולם אבן נמוך על רכס חשוף בגובה 2,200 מטר, שאין סביבו דבר מלבד הרוח ושני העמקים שהרכס מפריד ביניהם.**


    היא הוקמה מאבן גסה ולא מסותתת במאה ה-9 או ה-10, על קו פרשת המים בין האראגווי לקסני, כשבעה קילומטרים
    דרומית למלטה, וכאן התכנסו קהילות מתיולתי כדי להכריע על מלחמה ושלום. בשנות ה-1320 עצר כאן המלך גאורגי
    החמישי להתפלל בדרכו חזרה מדריאל, והחוק שחוקק להרים הטיל על רוצחו של איכר מלומיסה קנס של אלף וחמש מאות
    מטבעות כסף.


    בפנים חשוך ונמוך, והמבנה שקוע למחצה בהריסותיו שלו. חפשו שני דברים: דלת עץ אלון מצופה ברזל, ועליה כתובות
    גאורגיות מן המאות ה-16–17, ושרשרת ישנה וכבדה, שעולי הרגל תולים על צווארם לפני שהם מקיפים את הכנסייה
    שלוש פעמים נגד כיוון השעון כדי לחתום נדר.


    המסורת מספרת שהכנסייה מציינת את שחרורם של שבעת אלפים גאורגים מן השבי החוארזמי בזכות איקונה של גאורגיוס
    הקדוש, שחזרה הביתה על גבו של שור בשם לומה (שמו פירושו "אריה"). סיפור אחר מסביר את הדלת: מפקד מצבא
    המלך ביקע את הדלת הישנה לעצי הסקה, אנשיו התעוורו, והם שבו לראות רק כשנדר להציב דלת מברזל.


    בלומיסובה, יום רביעי שאחרי חג הפנטקוסט, עולים לכאן אלפים ממתיולתי, מחבי ומחבסורתי כדי להתפלל לחולים
    ולחשוכי ילדים, רוקדים במעגל לצלילי שיר על השרשרת ומקריבים כבשים במאות. זו עבודת קודש, לא מופע.


    ביום קיץ רגיל הרכס שייך לסוסים ולרוח. מדרום משתרע עמק הקסני העליון, הכבוש מאז מלחמת 2008: קרוב מספיק
    כדי לראות אותו, וכבר לא קרוב מספיק כדי ללכת אליו.
  tip: >-
    הקציבו ארבע עד חמש שעות ממלטה, הלוך ושוב, עם מנוחה בפסגה. השביל אינו טכני, אבל על הרכס אין מים ואין
    צל, וסופות רעמים אחר הצהריים נפוצות ביולי ובאוגוסט, לכן צאו עם אור ראשון, בנעלי הליכה, עם שכבה חוסמת
    רוח ושני ליטרים מים לאדם. מנובמבר עד מאי הרכס מכוסה שלג, והעלייה הופכת לטיפוס הרים חורפי. התלבשו בצניעות
    ובקשו רשות לפני שאתם מצלמים, ובמיוחד בלומיסובה, כשמקריבים קורבנות תחת כיפת השמיים. התרחקו מן המדרונות
    הדרומיים: הם יורדים לעבר קו הכיבוש, ושם מטיילים מסתכנים במעצר.
  route: >-
    מטביליסי סעו צפונה בכביש הצבא הגאורגי (S3/E117) דרך ז׳ינוואלי, אנאנורי ופסנאורי עד מלטה, הכפר האחרון
    לפני שהסרפנטינות מטפסות לגודאורי: כ-108 ק״מ ושעתיים ועשר דקות, אספלט לכל אורך הדרך ועוד לפני מעבר
    ג׳ווארי המושלג לעתים קרובות. היכנסו לכפר והחנו היכן שהסמטאות נגמרות. רכב אקונומי מגיע עד כאן, אם כי
    בסמטאות הכפר המלאות בורות נוח יותר ברכב שטח. מכאן והלאה הכול ברגל; השביל יוצא מעל הבתים האחרונים והסימון
    שלו דל, לכן שאלו את אחד מתושבי הכפר על הדרך ללומיסה. דלק ואוכל בפסנאורי.
ar:
  name: كنيسة لوميسا
  short: >-
    مزار للقديس جاورجيوس من القرنين التاسع والعاشر على سلسلة بارتفاع 2200 م فوق مليتا، حيث أقسم الجبليون
    أغلظ أيمانهم، ولا يزالون يسوقون إليه الخراف في لوميسوبا.
  body: >-
    **أوثق يمين كان يمكن لجبليّ من شرق جورجيا أن يقسمها هي اليمين بالقديس جاورجيوس اللوميسي، وكنيسته قاعة
    حجرية واطئة على سلسلة جرداء بارتفاع 2200 متر، لا يحيط بها سوى الريح والواديين اللذين تفصل بينهما.**


    شُيّدت من حجر خشن غير منحوت في القرن التاسع أو العاشر، على خط تقسيم المياه بين أراغفي وكساني، على
    بعد نحو سبعة كيلومترات جنوب مليتا، وهنا كانت جماعات متيوليتي تجتمع لتقرّر الحرب والسلم. وفي عشرينيات
    القرن الرابع عشر توقف الملك غيورغي الخامس هنا ليصلّي في طريق عودته من داريال، وكان قانونه الخاص بالجبال
    يفرض على قاتل فلاح من فلاحي لوميسا غرامة قدرها ألف وخمسمئة قطعة فضية.


    في الداخل عتمة وسقف واطئ، والمبنى غائص إلى نصفه في ركامه. ابحث عن شيئين: باب من خشب البلوط مصفّح بالحديد،
    عليه نقوش جورجية من القرنين السادس عشر والسابع عشر، وسلسلة قديمة ثقيلة يعلّقها الحجاج في أعناقهم قبل
    أن يطوفوا حول الكنيسة ثلاث مرات عكس اتجاه عقارب الساعة ليختموا نذرهم.


    وتقول الرواية إن الكنيسة تخلّد خلاص سبعة آلاف جورجي من الأسر الخوارزمي بفضل أيقونة للقديس جاورجيوس
    عادت إلى الديار على ظهر ثور يُدعى لوما (ومعنى الاسم «الأسد»). وحكاية أخرى تفسّر الباب: قائد من جند
    الملك قطّع الباب القديم حطباً، فعمي رجاله، ولم يعودوا يبصرون إلا حين نذر أن يقيم باباً من حديد.


    وفي لوميسوبا، يوم الأربعاء التالي لعيد العنصرة، يصعد الآلاف من متيوليتي وخيفي وخيفسوريتي ليصلّوا من
    أجل المرضى ومن حُرموا الأولاد، ويرقصون رقصة دائرية على أنغام أغنية عن السلسلة، ويذبحون الخراف بالمئات.
    إنها عبادة، لا عرض.


    وفي يوم صيفي عادي تكون السلسلة للخيول والريح. وإلى الجنوب تمتد أعالي وادي كساني، المحتلة منذ حرب 2008:
    قريبة بما يكفي لتراها، ولم تعد قريبة بما يكفي لتمشي إليها.
  tip: >-
    خصّص أربع إلى خمس ساعات من مليتا ذهاباً وإياباً مع استراحة في الأعلى. الدرب ليس تقنياً، لكن السلسلة
    بلا ماء ولا ظل، والعواصف الرعدية بعد الظهر شائعة في يوليو وأغسطس، فانطلق مع أول ضوء بحذاء جبلي وطبقة
    واقية من الريح ولترين من الماء لكل شخص. ومن نوفمبر إلى مايو تكسو الثلوج السلسلة ويصبح الصعود تسلقاً
    شتوياً للجبال. البس لباساً محتشماً واستأذن قبل التصوير، ولا سيما في لوميسوبا حين تُقدَّم الأضاحي في
    العراء. وابتعد عن المنحدرات الجنوبية: فهي تنحدر نحو خط الاحتلال، حيث يتعرض المتنزهون لخطر الاحتجاز.
  route: >-
    من تبليسي اسلك الطريق العسكري الجورجي (S3/E117) شمالاً عبر جينفالي وأنانوري وباسانائوري حتى مليتا،
    آخر قرية قبل أن تصعد المنعطفات الملتوية إلى غوداوري: نحو 108 كم وساعتان وعشر دقائق، على الأسفلت طوال
    الطريق وقبل الوصول إلى ممر جواري المعرّض للثلوج. ادخل القرية واركن السيارة حيث تنتهي الأزقة. تصل السيارة
    الاقتصادية إلى هنا، وإن كانت أزقة القرية المليئة بالحفر أيسر مع سيارة دفع رباعي. وما بعد ذلك كله سيراً
    على الأقدام؛ يبدأ الدرب فوق آخر البيوت وعلاماته ضعيفة، فاسأل أحد أهل القرية عن طريق لوميسا. الوقود
    والطعام في باسانائوري.
