ka:
  name: ოკაცეს კანიონი
  short: კლდეზე მიმაგრებული ლითონის ბილიკი ხეობის ზემოთ, გორდის ტყის იქით.
  body: >
    ოკაცეს კანიონი ხონის მუნიციპალიტეტში, სოფელ გორდისთან მდებარეობს და დღეს იმერეთის ერთ-ერთი ყველაზე
    პოპულარული ბუნებრივი ობიექტია. მდინარე ოკაცემ კირქვაში ვიწრო, ღრმა ხეობა გამოკვეთა და მისი კედლის
    გასწვრივ **დაახლოებით შვიდას ოთხმოცმეტრიანი ლითონის ბილიკია გაყვანილი**, რომელიც ადგილ-ადგილ ხეობის
    ფსკერიდან ას ორმოც მეტრზეა აწეული. ბოლოში ბილიკი ჰაერში გამოშვერილი ხედვის მოედნით სრულდება.


    მთავარი, რაც წინასწარ უნდა იცოდე: **ეს არ არის ობიექტი, სადაც მანქანით მიდიხარ და ხედს იღებ**. ვიზიტორთა
    ცენტრი გორდშია და იქიდან ბილიკის დასაწყისამდე კიდევ ორიოდე კილომეტრია. ნაწილს შატლი გაივლის, ნაწილს
    კი ფეხით უნდა გაუყვე დადიანების ძველ ტყე-პარკში.


    რეალური სცენარი ასეთია:


    - ვიზიტორთა ცენტრში ბილეთი და შატლი

    - გასეირნება ტყეში, აღმართებით და დაღმართებით

    - ლითონის ბილიკი კანიონის კედელზე და ხედვის მოედანი

    - იმავე გზით უკან


    სულ ორნახევრიდან სამ საათამდე — და ეს დროის მხოლოდ მცირე ნაწილია თავად კანიონზე. ბილიკი ვიწროა და
    ქარში ოდნავ ირხევა; სიმაღლის შიშის მქონე ადამიანებისთვის ეს რთული გამოცდილებაა, თუმცა კონსტრუქცია
    მდგრადია და მოაჯირებით არის დაცული.


    ოკაცეს ჩანჩქერი ცალკე ობიექტია და კანიონის ბილიკიდან არ ჩანს — მასთან მისასვლელად კიდევ რამდენიმე
    კილომეტრიანი ლაშქრობაა საჭირო. ბევრი სტუმარი ამას წინასწარ არ ითვალისწინებს და იმედგაცრუებული რჩება,
    ამიტომ ჯობია გეგმაში მხოლოდ კანიონი ჩადო.
  tip: >-
    დაითვალე სამი საათი და დამატებით სასეირნო ფეხსაცმელი — გზის დიდი ნაწილი ფეხითაა, არა კანიონზე. წვიმის
    შემდეგ ლითონი და ქვა ორივე პრიალაა. წყალი თან წაიღე, ბილიკზე მაღაზია არაა. ბოლო შატლი შუადღის შემდეგ
    დადის, ამიტომ 15:00-ის შემდეგ ჩასვლა რისკია. მაღალქუსლიანი ან ღია ფეხსაცმელი გამორიცხულია. ტუალეტი
    და კაფე ვიზიტორთა ცენტრშია, ბანკომატი — ხონში ან ქუთაისში.
  route: >
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ ჩრდილო-დასავლეთით ხონის მიმართულებით და გორდში — სულ ორას სამოცდახუთი
    კილომეტრი და დაახლოებით ოთხი საათი. ქუთაისამდე მაგისტრალია, შემდეგ ჩვეულებრივი ასფალტი, ბოლო ათი-თხუთმეტი
    კილომეტრი კი ვიწრო და ადგილ-ადგილ დაზიანებულია, თუმცა ეკონომ კლასიც გაივლის. მანქანა ვიზიტორთა ცენტრთან
    პარკინგზე რჩება. საწვავი ქუთაისში ან ხონში აავსე; გორდში გასამართი არაა. გორდის ტყე-პარკი დადიანების
    ყოფილი სამონადირეო რეზიდენციაა და ბილიკის ნაწილი სწორედ მასზე გადის.
en:
  name: Okatse Canyon
  short: A metal walkway pinned to the canyon wall high above the river, beyond the Gordi forest.
  body: >-
    Okatse Canyon sits near the village of Gordi in Khoni municipality and has become one of the most
    visited natural sites in Imereti. The Okatse river cut a narrow, deep gorge into limestone, and **a
    metal walkway around 780 metres long** now runs along its wall, at points some 140 metres above the
    canyon floor. It ends in a viewing platform projecting into open air.


    The thing to know before you go: **this is not a drive-up viewpoint**. The visitor centre is in Gordi,
    and the start of the walkway is a further couple of kilometres away. A shuttle covers part of that
    distance and the rest is on foot, through the old Dadiani forest park.


    A realistic sequence looks like this:


    - ticket and shuttle at the visitor centre

    - a walk through the forest, with climbs and descents

    - the metal walkway along the canyon wall and the viewing platform

    - the same route back


    Budget two and a half to three hours in total, and accept that only a modest share of that is spent
    on the canyon itself. The walkway is narrow and flexes slightly in wind, which makes it a demanding
    experience for anyone afraid of heights, though the structure is solid and fully railed.
  tip: >-
    Plan for three hours and wear proper walking shoes, because most of the visit is on foot rather than
    on the canyon walkway. After rain both the metal and the stone are slippery. Carry water — there is
    no shop along the trail. The last shuttle runs in the afternoon, so arriving after 15:00 is a gamble.
    Open or heeled shoes are a bad idea. Toilets and a cafe are at the visitor centre; the nearest ATM
    is in Khoni or Kutaisi.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head northwest towards Khoni and on to Gordi — about 265
    km and four hours in total. Motorway as far as Kutaisi, then ordinary asphalt, with the final ten
    to fifteen kilometres narrow and patchy in places, though an economy car will manage. You leave the
    car at the visitor centre car park and go no further by road. Fill up in Kutaisi or Khoni; there is
    no fuel station in Gordi itself.
ru:
  name: Каньон Окаце
  short: Металлическая тропа, закреплённая на стене каньона высоко над рекой, за лесом у села Горди.
  body: >
    Каньон Окаце находится у села Горди в Хонском муниципалитете и стал одним из самых посещаемых природных
    объектов Имеретии. Река Окаце прорезала в известняке узкое глубокое ущелье, и вдоль его стены проложена
    **металлическая тропа длиной около 780 метров**, местами поднятая на 140 метров над дном каньона.
    Заканчивается она смотровой площадкой, вынесенной в воздух.


    Что важно знать заранее: **сюда нельзя подъехать и сразу увидеть вид**. Визит-центр расположен в Горди,
    а до начала тропы остаётся ещё пара километров. Часть этого расстояния проходит шаттл, остальное —
    пешком через старый лесопарк Дадиани.


    Реалистичный сценарий выглядит так:


    - билет и шаттл в визит-центре

    - прогулка по лесу с подъёмами и спусками

    - металлическая тропа по стене каньона и смотровая площадка

    - обратный путь тем же маршрутом


    Закладывайте два с половиной-три часа, понимая, что на сам каньон придётся лишь небольшая часть этого
    времени. Тропа узкая и слегка покачивается на ветру, так что для боящихся высоты это испытание, хотя
    конструкция надёжная и полностью ограждена.


    Водопад Окаце — отдельный объект, и с тропы над каньоном он не виден: до него нужен ещё пеший переход
    в несколько километров. Многие этого заранее не учитывают и уезжают разочарованными, поэтому в план
    разумнее закладывать только сам каньон.
  tip: >-
    Рассчитывайте на три часа и наденьте нормальную обувь для ходьбы: большая часть визита — это пеший
    путь, а не сама тропа над каньоном. После дождя скользит и металл, и камень. Возьмите воду, по дороге
    магазинов нет. Последний шаттл уходит во второй половине дня, поэтому приезжать после 15:00 рискованно.
    Открытая обувь и каблуки исключены. Туалеты и кафе — в визит-центре, банкомат в Хони или Кутаиси.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на северо-запад в сторону Хони и далее в Горди — всего около 265
    км и четыре часа. До Кутаиси идёт магистраль, дальше обычный асфальт, а последние десять-пятнадцать
    километров узкие и местами разбитые, но машина эконом-класса пройдёт. Автомобиль остаётся на парковке
    визит-центра, дальше проезда нет. Заправляйтесь в Кутаиси или Хони: в самом Горди заправки нет.
fa:
  name: کانیون اوکاتسه
  short: گذرگاهی فلزی مهارشده به دیوارهٔ کانیون، بالای رودخانه، آن‌سوی جنگل گوردی.
  body: >-
    کانیون اوکاتسه نزدیک روستای گوردی در شهرستان خونی قرار دارد و به یکی از پربازدیدترین جاذبه‌های طبیعی
    ایمرتی بدل شده است. رود اوکاتسه شکافی باریک و ژرف در سنگ آهک بریده است و اکنون **گذرگاهی فلزی به طول
    حدود 780 متر** در امتداد دیوارهٔ آن کشیده شده که در جاهایی حدود 140 متر بالای کف کانیون قرار می‌گیرد.
    این گذرگاه به سکوی دیدی ختم می‌شود که در فضای باز پیش می‌رود.


    آنچه پیش از رفتن باید بدانید: **این نقطهٔ دیدی نیست که با خودرو کنارش بایستید**. مرکز بازدیدکنندگان
    در گوردی است و آغاز گذرگاه چند کیلومتر آن‌سوتر. بخشی از این فاصله را ون رفت‌وآمدی می‌پیماید و بقیه
    پیاده است، از میان پارک جنگلی قدیم دادیانی.


    ترتیب واقع‌بینانه چنین است: بلیت و ون در مرکز بازدیدکنندگان؛ پیاده‌روی در جنگل با بالا و پایین رفتن؛
    گذرگاه فلزی در امتداد دیوارهٔ کانیون و سکوی دید؛ و بازگشت از همان مسیر. روی هم دو ساعت و نیم تا سه
    ساعت در نظر بگیرید و بپذیرید که تنها سهم اندکی از آن صرف خود کانیون می‌شود. گذرگاه باریک است و در
    باد کمی می‌لرزد، که تجربه را برای هر کس که از ارتفاع می‌ترسد دشوار می‌کند، هرچند سازه محکم و کاملاً
    نرده‌کشی‌شده است.
  tip: >-
    سه ساعت در نظر بگیرید و کفش پیاده‌روی مناسب بپوشید، چون بیشتر بازدید پیاده است و نه روی گذرگاه کانیون.
    پس از باران، هم فلز و هم سنگ لغزنده می‌شوند. آب همراه ببرید — در طول مسیر فروشگاهی نیست. آخرین ون
    بعدازظهر حرکت می‌کند، پس رسیدن پس از 15:00 قمار است. کفش باز یا پاشنه‌دار فکر بدی است. سرویس بهداشتی
    و کافه در مرکز بازدیدکنندگان هست؛ نزدیک‌ترین خودپرداز در خونی یا کوتایسی است.
  route: >-
    از تفلیس با E60 تا کوتایسی بروید، سپس رو به شمال‌غرب به سوی خونی و از آنجا به گوردی — روی هم حدود
    265 کیلومتر و چهار ساعت. تا کوتایسی بزرگراه است و پس از آن آسفالت معمولی، با ده تا پانزده کیلومتر
    پایانی که باریک و جاهایی وصله‌دار است، هرچند خودروی اقتصادی از پس آن برمی‌آید. خودرو را در پارکینگ
    مرکز بازدیدکنندگان می‌گذارید و با جاده جلوتر نمی‌روید. در کوتایسی یا خونی باک را پر کنید؛ در خود گوردی
    جایگاه سوخت نیست.
he:
  name: קניון אוקאצה
  short: שביל מתכת מוצמד לקיר הקניון גבוה מעל הנחל, מעבר ליער גורדי.
  body: >-
    קניון אוקאצה שוכן ליד הכפר גורדי במחוז חוני, והוא הפך לאחד האתרים הטבעיים המבוקרים ביותר באימרתי.
    נהר אוקאצה חתך ערוץ צר ועמוק בסלע גיר, וכיום נמתח לאורך הקיר שלו **שביל מתכת באורך של כ-780 מטר**,
    שבנקודות מסוימות נמצא כ-140 מטר מעל קרקעית הקניון. הוא מסתיים במרפסת תצפית הבולטת אל תוך החלל הפתוח.


    מה שכדאי לדעת לפני שיוצאים: **זו אינה נקודת תצפית שנוסעים אליה עד הסוף**. מרכז המבקרים נמצא בגורדי,
    ותחילת השביל רחוקה משם עוד כמה קילומטרים. הסעה מכסה חלק מהמרחק הזה והשאר נעשה ברגל, דרך פארק היער
    העתיק של בית דדיאני.


    רצף מציאותי נראה כך: כרטיס והסעה במרכז המבקרים; הליכה ביער עם עליות וירידות; שביל המתכת לאורך קיר
    הקניון ומרפסת התצפית; ואותה דרך חזרה. הקצו שעתיים וחצי עד שלוש שעות בסך הכול, וקבלו שרק חלק צנוע מהזמן
    הזה מוקדש לקניון עצמו. השביל צר ומתנדנד קלות ברוח, מה שהופך אותו לחוויה תובענית לכל מי שחושש מגבהים,
    אף שהמבנה יציב ומגודר לגמרי במעקות.
  tip: >-
    תכננו שלוש שעות ונעלו נעלי הליכה של ממש, מפני שרוב הביקור מתנהל ברגל ולא על שביל הקניון. אחרי גשם
    גם המתכת וגם האבן חלקלקות. קחו מים — אין חנות לאורך המסלול. ההסעה האחרונה יוצאת בשעות אחר הצהריים,
    ולכן הגעה אחרי 15:00 היא הימור. נעליים פתוחות או עם עקב הן רעיון רע. שירותים ובית קפה נמצאים במרכז
    המבקרים; הכספומט הקרוב ביותר בחוני או בקוטאיסי.
  route: >-
    מטביליסי סעו בכביש E60 עד קוטאיסי, ומשם צפונה-מערבה לכיוון חוני והלאה לגורדי — כ-265 ק"מ וארבע שעות
    בסך הכול. כביש מהיר עד קוטאיסי, לאחר מכן אספלט רגיל, כשעשרה עד חמישה-עשר הקילומטרים האחרונים צרים
    ומטולאים במקומות, אף שרכב חסכוני יסתדר בהם. את הרכב משאירים בחניון מרכז המבקרים ולא ממשיכים הלאה בכביש.
    תדלקו בקוטאיסי או בחוני; בגורדי עצמה אין תחנת דלק כלל.
ar:
  name: وادي أوكاتسي
  short: ممشى معدني مثبّت في جدار الوادي على ارتفاع كبير فوق النهر، خلف غابة غوردي.
  body: >-
    يقع وادي أوكاتسي قرب قرية غوردي في بلدية خوني، وقد صار من أكثر المواقع الطبيعية زيارة في إيميريتي.
    حفر نهر أوكاتسي شقاً ضيقاً عميقاً في الصخر الكلسي، ويمتد اليوم على طول جداره **ممشى معدني بطول نحو
    780 متراً**، يعلو في بعض النقاط قاع الوادي بنحو 140 متراً. وينتهي بمنصة إطلالة تبرز في الهواء الطلق.


    وما ينبغي معرفته قبل الذهاب: **هذا ليس مطلاً تصل إليه بسيارتك**. فمركز الزوار في غوردي، وبداية الممشى
    تبعد عنه بضعة كيلومترات أخرى. وتغطي حافلة ناقلة جزءاً من تلك المسافة، أما البقية فسيراً على الأقدام
    عبر متنزه غابة دادياني القديم.


    والتسلسل الواقعي كالتالي: التذكرة والحافلة الناقلة في مركز الزوار؛ ثم مشي في الغابة بصعود وهبوط؛ ثم
    الممشى المعدني بمحاذاة جدار الوادي ومنصة الإطلالة؛ ثم العودة من الطريق نفسه. خصّص ساعتين ونصفاً إلى
    ثلاث ساعات إجمالاً، وتقبّل أن نصيباً متواضعاً فقط من هذا الوقت يُقضى في الوادي ذاته. والممشى ضيق ويهتز
    قليلاً مع الرياح، ما يجعله تجربة شاقة على كل من يخشى المرتفعات، وإن كانت المنشأة متينة ومسوّرة بالكامل.
  tip: >-
    خطط لثلاث ساعات والبس حذاء مشي حقيقياً، لأن معظم الزيارة يجري سيراً لا على ممشى الوادي. وبعد المطر
    يصبح المعدن والحجر زلقين معاً. احمل ماءً — فلا متجر على طول الدرب. وآخر حافلة ناقلة تنطلق بعد الظهر،
    لذا فالوصول بعد الساعة 15:00 مجازفة. والأحذية المفتوحة أو ذات الكعب فكرة سيئة. دورات المياه والمقهى
    في مركز الزوار؛ وأقرب صراف آلي في خوني أو كوتايسي.
  route: >-
    من تبليسي اسلك الطريق E60 إلى كوتايسي، ثم اتجه شمالاً غرباً نحو خوني ومنها إلى غوردي — نحو 265 كم
    وأربع ساعات إجمالاً. طريق سريع حتى كوتايسي، ثم إسفلت عادي، وآخر عشرة إلى خمسة عشر كيلومتراً ضيقة ومرقّعة
    في مواضع، وإن كانت سيارة اقتصادية تتدبرها. وتترك السيارة في موقف مركز الزوار ولا تتقدم أبعد من ذلك
    بالطريق. املأ الخزان في كوتايسي أو خوني؛ فلا محطة وقود في غوردي نفسها.
