ka:
  name: ოკაცეს კანიონი
  short: კირქვის კედელზე მიმაგრებული 780-მეტრიანი ბილიკი ოკაცეს თავზე; მისკენ გზა გორდში, დადიანების ძველ
    ტყეში გადის.
  body: >-
    **ოკაცეს ბილიკი კანიონის კედელს დაუმთავრებელი თაროსავით ეკვრის, ბოლოს კი უბრალოდ ჰაერში წყდება.**


    მდინარე ოკაცე სულ 14 კილომეტრია, მაგრამ ორ კილომეტრზე, სოფელ ზედა გორდთან, კირქვაში ვიწრო ღარი გამოხერხა:
    უმეტესად 3–6 მეტრის სიგანისა და 20-დან 100 მეტრამდე სიღრმის. 2007 წლიდან ეს მონაკვეთი ბუნების ძეგლია.
    780-მეტრიანი ლითონის ბილიკი მის ზედა კედელზეა მიმაგრებული და უფსკრულის თავზე გადმოშვერილი 20-მეტრიანი
    ბაქნით სრულდება.


    აქამდე ისტორიის გავლით მიდიხართ. გორდის ვიზიტორთა ცენტრიდან 2,3-კილომეტრიანი ქვაფენილი ბილიკი დადიანების
    ისტორიულ ტყეში გადის; ტყეს სამთავრო გვარის სახელი ჰქვია, მათი ციხის ნანგრევები კი იმავე დაცულ ტერიტორიაზე
    დგას. ძველი ხეების ჩრდილში ფეხით ნახევარი საათის სავალია, შატლით — სულ რამდენიმე წუთი.


    ქვემოთაც ჩაიხედეთ. კირქვის ნაპირებს მსხვილი ბზის ხეები ებღაუჭება. ბოგად წოდებულ ადგილას კედლები მდინარის
    თავზე თითქმის ერთმანეთს ეხება, მის ქვემოთ კი კანიონი მთელ ას მეტრს აღწევს. მეორე ბილიკი, 645 მეტრის
    სიგრძისა და 989 ლითონის საფეხურით, წყლამდე ჩადის — იქ ხეობა ოთხ მეტრამდე ვიწროვდება, კედლები კი ორმოცდაათ
    მეტრზე აიწევა.


    კლდე უფრო ნელ ამბავსაც ინახავს. ოდესღაც ტექტონიკურმა რღვევამ ხეობა ჩაკეტა და ტბა გააჩინა. მის 27 მეტრზე
    მეტი სისქის ნალექებში დღემდე შემორჩა ჭაობის კვიპაროსის, ცუგისა და სხვა ხეების პლეისტოცენური ყვავილის
    მტვერი — ხეებისა, რომლებიც ამ მხარეში დიდი ხანია აღარ იზრდება.


    ბაქანზე ადრე დილით დადექით და მოუსმინეთ: ჯერჯერობით მდინარე ხალხზე ხმამაღალია.
  tip: >-
    სამი საათი გამოყავით — დროის უმეტესი ნაწილი სიარულს მიაქვს და არა თავად ბილიკს. ჩაიცვით ნამდვილი სალაშქრო
    ფეხსაცმელი: წვიმის შემდეგ ლითონიც და ქვაც სრიალაა, ქუსლი და სანდალი კი ცუდი არჩევანია. ბილეთი დაახლოებით
    20 ლარი ღირს, შატლი — დაახლოებით 5 ლარი. წყალი თან იქონიეთ, გზაზე ვერაფერს იყიდით. ბილიკი ვიწროა,
    მაგრამ მთლიანად მოაჯირით არის დაცული; უფსკრულზე გადმოშვერილი ბაქანი სიმაღლის შიშის მქონეთათვის რთული
    იქნება. ვიზიტორთა ცენტრში იკითხეთ, ღიაა თუ არა მდინარემდე ჩამავალი კიბე. დილით წადით. კაფე, შესანახი
    კარადები, ტუალეტი და პარკინგი ვიზიტორთა ცენტრშია; ბანკომატი — ხონსა და ქუთაისში.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის უღელტეხილის გავლით ქუთაისამდე, დაახლოებით 220
    კმ. იქიდან შ15-ით ჩრდილო-დასავლეთით, წყალტუბოს მიმართულებით გადით, შემდეგ სოფლის გზებით ხონისკენ და
    გორდამდე აუყევით, კანიონის ნიშნების მიხედვით. სულ დაახლოებით 265 კმ-ია და ოთხი საათი. მაგისტრალი სწრაფია;
    ქუთაისის შემდეგ ჩვეულებრივი ასფალტია, ბოლო ათი-თხუთმეტი კილომეტრი კი ვიწრო და ადგილ-ადგილ დაკერებულია,
    თუმცა ეკონომ კლასის მანქანაც გაივლის. გორდში ბენზინგასამართი სადგური არ არის, ამიტომ ავზი ქუთაისში
    ან ხონში შეავსეთ. მანქანა ვიზიტორთა ცენტრთან რჩება.
en:
  name: Okatse Canyon
  short: >-
    A 780-metre walkway pinned to a limestone wall above the Okatse river, reached on foot through the
    old Dadiani forest at Gordi.
  body: >-
    **The walkway at Okatse clings to the canyon wall like a shelf nobody finished, and at the far end
    it simply stops in mid-air.**


    The Okatse is only 14 kilometres long, but for two of them, near the village of Zeda Gordi, it has
    sawn a slot through the limestone, three to six metres wide in most places and 20 to 100 metres deep.
    Since 2007 that stretch has been a protected natural monument. The metal path, 780 metres long, is
    fixed along its upper wall and ends in a 20-metre platform cantilevered over the drop.


    You reach it through history. From the visitor centre in Gordi a stone-paved path of 2.3 kilometres
    runs through the Dadiani historical forest, named for the princely family whose castle ruins stand
    within the same protected area. It is half an hour on foot under old trees, or a short ride by shuttle.


    Look down as well as out. Box trees of real girth grip the limestone banks. At a place called Boga
    the walls almost close over the river, and below it the canyon reaches its full hundred metres. A
    second path, 645 metres long with 989 metal steps, descends to the water, where the gorge narrows
    to four metres between walls fifty metres high.


    The rock keeps a slower story too. A tectonic fault once blocked the valley and made a lake, and its
    sediments, more than 27 metres thick, still hold Pleistocene pollen of swamp cypress, hemlock and
    other trees long vanished from this region.


    Stand on the platform early in the morning and listen: for now, the river is still louder than the
    crowd.
  tip: >-
    Allow three hours; most of that is walking, not the walkway itself. Wear proper shoes, as metal and
    stone are slippery after rain and heels or sandals are a poor idea. Tickets are around 20 lari, plus
    about 5 for the shuttle. Carry water, since there is nothing to buy on the path. The walkway is narrow
    but fully railed; the platform over the void is hard going for anyone afraid of heights. Ask at the
    visitor centre whether the stairs to the river are open. Come in the morning. Café, lockers, toilets
    and parking are at the visitor centre; ATMs are in Khoni or Kutaisi.
  route: >-
    From Tbilisi take the S1 (E60) west over the Rikoti Pass to Kutaisi, about 220 km. From there take
    the Sh15 north-west towards Tskaltubo, then local roads through the villages towards Khoni and up
    to Gordi, following signs for the canyon. In total it is about 265 km and four hours. The highway
    is quick; beyond Kutaisi the roads are ordinary asphalt, and the last ten to fifteen kilometres are
    narrow and patched, but an economy car manages. There is no fuel in Gordi, so fill up in Kutaisi or
    Khoni. You leave the car at the visitor centre.
ru:
  name: Каньон Окаце
  short: >-
    780-метровая тропа, прикреплённая к известняковой стене над рекой Окаце — сюда идут пешком через старый
    лес Дадиани у Горди.
  body: >-
    **Тропа Окаце цепляется за стену каньона, будто недостроенная полка, а на дальнем конце просто обрывается
    в воздухе.**


    Окаце — река всего в 14 километров, но на двух из них, у села Зеда-Горди, она прорезала в известняке
    узкую щель шириной в основном 3–6 метров и глубиной от 20 до 100 метров. С 2007 года этот участок
    — охраняемый природный памятник. Металлическая дорожка длиной 780 метров закреплена на верхней стене
    каньона и заканчивается 20-метровой площадкой, нависающей над обрывом.


    Путь к ней лежит через историю. От визит-центра в Горди мощённая камнем тропа длиной 2,3 км ведёт
    через исторический лес Дадиани, названный в честь княжеского рода, руины замка которого стоят на той
    же охраняемой территории. Пешком под старыми деревьями — полчаса, шаттлом — считанные минуты.


    Смотрите не только вперёд, но и вниз. Могучие самшиты цепляются за известняковые склоны. У места,
    называемого Бога, стены почти сходятся над рекой, а ниже каньон достигает полной глубины в сто метров.
    Вторая тропа, длиной 645 метров с 989 металлическими ступенями, спускается к воде, где ущелье сужается
    до четырёх метров между стенами высотой в пятьдесят метров.


    Скала хранит и более медленную историю. Когда-то тектонический разлом перекрыл долину и образовал
    озеро, и его отложения толщиной более 27 метров до сих пор содержат плейстоценовую пыльцу болотного
    кипариса, тсуги и других деревьев, давно исчезнувших из этих мест.


    Встаньте на площадку ранним утром и слушайте: пока река ещё громче толпы.
  tip: >-
    Отведите три часа; большая часть времени уходит на ходьбу, а не на саму тропу. Наденьте нормальную
    обувь: после дождя металл и камень становятся скользкими, а каблуки и сандалии — плохая идея. Билет
    стоит около 20 лари, плюс около 5 за шаттл. Возьмите воду — на тропе ничего не купить. Дорожка узкая,
    но целиком с перилами; площадка над обрывом дастся нелегко тем, кто боится высоты. Спросите в визит-центре,
    открыта ли лестница к реке. Приезжайте утром. Кафе, шкафчики, туалеты и парковка — у визит-центра;
    банкоматы — в Хони или Кутаиси.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Рикотский перевал, до Кутаиси — около 220 км. Оттуда
    по трассе Sh15 на северо-запад в сторону Цхалтубо, затем местными дорогами через сёла в сторону Хони
    и вверх до Горди, следуя указателям на каньон. Всего около 265 км и четыре часа. Магистраль быстрая;
    за Кутаиси идёт обычный асфальт, а последние десять-пятнадцать километров узкие и в заплатках, но
    машина эконом-класса проедет. В Горди заправок нет, так что заправляйтесь в Кутаиси или Хони. Машину
    оставляют у визит-центра.
fa:
  name: کانیون اوکاتسه
  short: >-
    پیاده‌راهی به طول ۷۸۰ متر که به دیوارهٔ آهکی بالای رود اوکاتسه چسبیده است؛ راه رسیدن به آن پیاده از
    میان جنگل کهن دادیانی در گوردی می‌گذرد.
  body: >-
    **پیاده‌راه اوکاتسه به دیوارهٔ کانیون چسبیده، مثل طاقچه‌ای که کسی هرگز تمامش نکرده، و در انتها به‌سادگی
    در هوا قطع می‌شود.**


    رود اوکاتسه تنها ۱۴ کیلومتر طول دارد، اما در دو کیلومتر از آن، نزدیک روستای زدا گوردی، شکافی در دل
    سنگ آهک بریده است، شکافی که عموماً پهنایش سه تا شش متر و ژرفایش بیست تا صد متر است. از سال ۲۰۰۷ این
    بخش یادمان طبیعی حفاظت‌شده است. پیاده‌راه فلزی، به طول ۷۸۰ متر، بر دیوارهٔ بالایی کانیون نصب شده و
    به سکویی ۲۰ متری ختم می‌شود که بر فراز پرتگاه آویزان است.


    به آن‌جا از دل تاریخ می‌رسید. از مرکز بازدیدکنندگان در گوردی، مسیری سنگ‌فرش به طول ۲٫۳ کیلومتر از
    میان جنگل تاریخی دادیانی می‌گذرد، جنگلی که به نام خاندان شاهزادگانی است که ویرانه‌های قلعه‌شان درون
    همان منطقهٔ حفاظت‌شده ایستاده است. زیر سایهٔ درختان کهن، نیم ساعت پیاده راه است، یا چند دقیقه با سرویس
    رفت‌وآمد.


    هم به پایین نگاه کنید، هم به دوردست. درختان شمشاد تنومند به کناره‌های آهکی چنگ زده‌اند. در جایی به‌نام
    بوگا، دیواره‌ها بر فراز رود تقریباً به هم می‌رسند، و پایین‌تر از آن کانیون به ژرفای کامل خود، صد متر،
    می‌رسد. مسیری دوم، به طول ۶۴۵ متر و با ۹۸۹ پله‌ی فلزی، تا آب پیش می‌رود، جایی که دره تا چهار متر باریک
    می‌شود، میان دیواره‌هایی پنجاه متر بلند.


    سنگ داستانی آرام‌تر نیز در خود نگاه داشته است. زمانی گسلی زمین‌ساختی دره را بسته و دریاچه‌ای پدید
    آورده بود، و رسوبات آن، بیش از ۲۷ متر ستبر، هنوز دانه‌های گَرد گیاهیِ پلیستوسنی سرو باتلاقی، تسوگا
    و درختان دیگری را در خود دارند که مدت‌هاست از این ناحیه رخت بربسته‌اند.


    صبح زود بر سکو بایستید و گوش دهید: هنوز صدای رود از صدای جمعیت بلندتر است.
  tip: >-
    سه ساعت در نظر بگیرید؛ بیشتر آن به پیاده‌روی می‌گذرد، نه خود پیاده‌راه. کفشی مناسب بپوشید، چون فلز
    و سنگ پس از باران لیز می‌شوند و پاشنه یا صندل انتخابی بد است. بلیت حدود ۲۰ لاری است، به‌همراه نزدیک
    ۵ لاری برای سرویس رفت‌وآمد. آب همراه داشته باشید، چون در مسیر چیزی برای خریدن نیست. پیاده‌راه باریک
    اما کاملاً نرده‌دار است؛ سکوی بالای پرتگاه برای کسانی که از ارتفاع می‌ترسند دشوار است. در مرکز بازدیدکنندگان
    بپرسید که آیا پله‌های رسیدن به رود باز است یا نه. صبح بیایید. کافه، کمد امانات، سرویس بهداشتی و پارکینگ
    در مرکز بازدیدکنندگان است؛ دستگاه خودپرداز در خونی یا کوتایسی.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب، از گذرگاه ریکوتی تا کوتایسی بروید، نزدیک به ۲۲۰ کیلومتر.
    از آن‌جا در مسیر Sh15 به سوی شمال غربی، به سمت تسکالتوبو بروید، سپس با راه‌های محلی از میان روستاها
    به سوی خونی و بالا تا گوردی بروید و تابلوهای کانیون را دنبال کنید. در کل نزدیک به ۲۶۵ کیلومتر و چهار
    ساعت راه است. بزرگراه سریع است؛ پس از کوتایسی آسفالت معمولی است، و ده تا پانزده کیلومتر آخر باریک
    و وصله‌دار است، اما یک خودروی اقتصادی هم از آن می‌گذرد. در گوردی پمپ بنزین نیست، پس در کوتایسی یا
    خونی باک را پر کنید. ماشین را کنار مرکز بازدیدکنندگان می‌گذارید.
he:
  name: קניון אוקצה
  short: מסלול הליכה תלוי באורך 780 מטר, מחובר לקיר גיר מעל נהר אוקצה, שאליו מגיעים ברגל דרך יער דדיאני
    העתיק שבגורדי.
  body: >-
    **המסלול באוקצה נדבק לקיר הקניון כמו מדף שמעולם לא הושלם, ובקצהו הרחוק הוא נקטע פשוט באוויר.**


    נהר אוקצה קצר, רק 14 קילומטרים, אך על פני שניים מהם, סמוך לכפר זדה-גורדי, הוא חצב חריץ בגיר, ברוב
    מקומותיו רחב שלושה עד שישה מטרים ועמוק עשרים עד מאה מטרים. מאז 2007 המקטע הזה הוא אתר טבע מוגן. השביל
    המתכתי, באורך 780 מטרים, מעוגן על הקיר העליון ומסתיים במרפסת תצפית של 20 מטרים הבולטת מעל התהום.


    הדרך לשם עוברת בהיסטוריה. ממרכז המבקרים בגורדי יוצא שביל אבן סלול באורך 2.3 קילומטרים החוצה את יער
    דדיאני ההיסטורי, הקרוי על שם בית הנסיכים אשר חורבות טירתם שרדו באותו שטח מוגן. חצי שעה הליכה בצל עצים
    עתיקים, או נסיעה קצרה במיניבוס הסעה.


    הביטו גם למטה, לא רק למרחק. עצי אשכרוע עבי-גזע נצמדים לגדות הגיר. במקום הקרוי בוגה הקירות נסגרים כמעט
    זה על זה מעל הנהר, ומתחתיו מגיע הקניון לעומקו המלא, מאה מטרים. שביל שני, באורך 645 מטרים ועם 989 מדרגות
    מתכת, יורד אל המים, שם הערוץ מצטמצם לארבעה מטרים בין קירות בגובה חמישים מטר.


    הסלע שומר גם סיפור איטי יותר. פעם חסם קו שבר טקטוני את העמק ויצר אגם, ומשקעי האגם, בעובי של יותר מ-27
    מטרים, עדיין מכילים גרגרי אבקה מתקופת הפלייסטוקן של ברוש-ביצה, טסוגה ועצים נוספים שנעלמו מכבר מהאזור
    הזה.


    עמדו על המרפסת מוקדם בבוקר והאזינו: בינתיים הנהר עדיין קולני יותר מהקהל.
  tip: >-
    הקדישו שלוש שעות; רוב הזמן מוקדש להליכה ולא לשביל התלוי עצמו. נעלו נעליים מתאימות, כי מתכת ואבן חלקלקות
    אחרי גשם, וסנדלים או נעלי עקב הם בחירה גרועה. הכרטיס עולה כ-20 לארי, ובנוסף כ-5 לארי להסעה. הביאו
    מים, כי אין מה לקנות בשביל. השביל צר אך מוגן במעקה לכל אורכו; המרפסת שמעל התהום מאתגרת מאוד למי שסובל
    מפחד גבהים. שאלו במרכז המבקרים אם המדרגות לנהר פתוחות. הגיעו בבוקר. בית קפה, לוקרים, שירותים וחניה
    נמצאים במרכז המבקרים; כספומטים - בחוני או בקוטאיסי.
  route: >-
    מטביליסי קחו את כביש S1 (E60) מערבה, דרך מעבר ריקוטי עד קוטאיסי, כ-220 ק"מ. משם קחו את דרך Sh15 צפונית-מערבית
    לכיוון צקלטובו, ואז דרכים מקומיות בין הכפרים לכיוון חוני ומעלה לגורדי, לפי השילוט לקניון. בסך הכול
    כ-265 ק"מ וארבע שעות. הכביש הראשי מהיר; מעבר לקוטאיסי הכביש אספלט רגיל, ועשרה עד חמישה עשר הקילומטרים
    האחרונים צרים ומתוקנים במקומות, אך רכב חסכוני מתמודד איתם. בגורדי אין תחנת דלק, לכן תדלקו בקוטאיסי
    או בחוני. את הרכב משאירים במרכז המבקרים.
ar:
  name: أخدود أوكاتسه
  short: >-
    ممر معلّق بطول 780 متراً مُثبَّت على جدار كلسي فوق نهر أوكاتسه، يُقصَد سيراً على الأقدام عبر غابة
    دادياني القديمة في غوردي.
  body: >-
    **يتعلّق ممر أوكاتسه بجدار الوادي كرفٍّ لم يُكمله أحد، وعند نهايته البعيدة ينقطع فجأة في الهواء.**


    لا يتجاوز طول نهر أوكاتسه 14 كيلومتراً، لكنه على مسافة كيلومترين منها، قرب قرية زيدا-غوردي، نشر شقاً
    في الحجر الكلسي، عرضه في أغلب الأماكن من ثلاثة إلى ستة أمتار، وعمقه من عشرين إلى مئة متر. ومنذ عام
    2007 أصبح هذا المقطع معلماً طبيعياً محمياً. الممر المعدني، بطول 780 متراً، مثبَّت على الجدار العلوي
    وينتهي بشرفة معلّقة طولها 20 متراً فوق الهاوية.


    تصل إليه عبر التاريخ. من مركز الزوار في غوردي يمتد مسار مرصوف بالحجارة طوله 2.3 كم عبر غابة دادياني
    التاريخية، المسمّاة على اسم الأسرة الأميرية التي لا تزال أنقاض قلعتها قائمة في المنطقة المحمية نفسها.
    نصف ساعة سيراً تحت الأشجار العتيقة، أو دقائق معدودة بالحافلة المكوكية.


    انظر إلى الأسفل كما تنظر إلى الأمام. أشجار البقس الضخمة تتشبث بالضفاف الكلسية. وعند موضع يسمّى بوغا،
    تكاد الجدران تتلامس فوق النهر، وتحته يبلغ الوادي عمقه الكامل، مئة متر. مسار ثانٍ، طوله 645 متراً وفيه
    989 درجة معدنية، ينحدر إلى الماء، حيث يضيق الوادي إلى أربعة أمتار بين جدارين ارتفاعهما خمسون متراً.


    ويحفظ الصخر أيضاً حكاية أبطأ. سدّ صدعٌ تكتوني الوادي قديماً فتكوّنت بحيرة، وما زالت رواسبها، التي
    يزيد سمكها على 27 متراً، تحمل حبوب لقاح من العصر البليستوسيني لسرو المستنقعات والتسوغا وأشجار أخرى
    غابت عن هذه المنطقة منذ زمن بعيد.


    قف على الشرفة في الصباح الباكر واستمع: فما زال صوت النهر أعلى من صوت الزوار.
  tip: >-
    خصص ثلاث ساعات؛ يذهب معظمها في المشي لا في الممر نفسه. ارتدِ حذاءً مناسباً، فالمعدن والحجر يصبحان
    زلقين بعد المطر، والكعب العالي أو الصندل خيار سيئ. سعر التذكرة نحو 20 لاري، إضافة إلى نحو 5 لاري للحافلة
    المكوكية. احمل الماء، فلا يوجد ما تشتريه على المسار. الممر ضيق لكنه محاط بالدرابزين بالكامل؛ الشرفة
    المعلّقة فوق الهاوية شاقة على من يخاف المرتفعات. اسأل في مركز الزوار إن كانت الأدراج المؤدية إلى النهر
    مفتوحة. تعال في الصباح. المقهى والخزائن والمراحيض والمواقف كلها في مركز الزوار؛ أما أجهزة الصرف الآلي
    ففي خوني أو كوتايسي.
  route: >-
    من تبليسي خذ الطريق السريع S1 (E60) غرباً، عبر ممر ريكوتي وصولاً إلى كوتايسي، نحو 220 كم. ومن هناك
    خذ طريق Sh15 شمال غرباً نحو تسكالتوبو، ثم طرقاً محلية عبر القرى نحو خوني وصعوداً إلى غوردي، متتبعاً
    لافتات الأخدود. الإجمالي نحو 265 كم وأربع ساعات. الطريق السريع يُقطع بسرعة؛ وبعد كوتايسي يصبح الأسفلت
    عادياً، وآخر عشرة إلى خمسة عشر كيلومتراً ضيقة ومرقّعة، لكن سيارة اقتصادية تكفي لعبورها. لا محطة وقود
    في غوردي، فعبّئ الخزان في كوتايسي أو خوني. تُترك السيارة عند مركز الزوار.
