ka:
  name: ტყიბულის წყალსაცავი
  short: >-
    ნაქერალას კლდის ძირას დაგუბებული კარსტული ქვაბული: მონაცრისფრო-მწვანე წყალი, ტყიანი კუნძულები და მაღაროელთა
    ქალაქის მყუდრო ეზო.
  body: >-
    **სანამ აქ ტბა გაჩნდებოდა, მდინარე ტყიბულა ოკრიბის ქვაბულის ფსკერზე უკვალოდ ქრებოდა — კარსტულ შახტში
    ჩადიოდა, იმ ადგილას, რომელსაც ხალხი „წყალდასავალს“ ეძახდა.** საბჭოთა ინჟინრებმა სწორედ იქ, სადაც მდინარე
    მიწას ემალებოდა, მიწაყრილი კაშხალი აღმართეს. დაგუბებული ტყიბულა 8,1 კილომეტრი სიგრძისა და 3,2 კილომეტრამდე
    სიგანის წყალსაცავად გაიშალა; მის შუა და დასავლეთ ნაწილში პატარა ტყიანი კუნძულები მოჩანს.


    ეს ტბა დიდი კიბის ქვედა საფეხურია. ზემოთ, კლდის მიღმა, რაჭის კარსტულ ზეგანზე, დაახლოებით 1150 მეტრზე
    შაორის წყალსაცავი წევს. ორ წყლის სარკეს შორის ექვსასიოდე მეტრის ვარდნაა, და შაორ-ტყიბულის ჰიდროენერგეტიკული
    ჯაჭვი, რომლის სადგურიც 1955 წელს ამუშავდა, ამ ვარდნას დენად აქცევს.


    ტყიბული ნახშირის ქალაქია. მაღაროები აქ 1846 წლიდან მუშაობს, ქალაქის სტატუსი 1939 წელს მიიღო. საბჭოთა
    მოპოვების ზენიტში ოც ათასზე მეტი ადამიანი ცხოვრობდა, 2024 წლის იანვარში — 8130. 2008 წელს განახლებული
    შახტები დღესაც ორიოდე ათას კაცს ასაქმებს და მათ ოჯახებს არჩენს, მაგრამ სიცოცხლესაც ართმევს: მხოლოდ
    2018 წლის ავარიებს თექვსმეტი კაცი ემსხვერპლა. მიდამოს ბორცვებზე ჩაი მოჰყავთ.


    ნაპირი უმეტესად დაბალი და დამრეცია. ჩრდილოეთით ნაქერალას მოთეთრო კირქვის კედელი აღმართულა — სამასიდან
    ექვსას მეტრამდე სიმაღლის ფლატე, რაჭის ძველი საზღვარი. წყალი წელიწადის დროებთან ერთად სუნთქავს: ყველაზე
    მაღლა აგვისტო-სექტემბერში დგას, ყველაზე დაბლა — თებერვალ-მარტში, როცა დონე საშუალოდ ხუთნახევარ მეტრზე
    მეტით ეცემა და ნაპირს ტალახის ფართო სარტყელი და წყალქვეშ მოქცეული ბუჩქები შემოერტყმება. წყალსაცავი
    თევზით მდიდარია და ნაპირზე ანკესით მჯდომ კაცს თითქმის ყოველთვის ნახავთ.


    საღამოს მოდით, როცა წყალი უკვე ჩამუქებულია, ნაქერალას თეთრ კედელს კი ჯერ კიდევ შერჩენია დღის უკანასკნელი
    მზე.
  tip: >-
    ერთი-ორი საათი საკმარისია. ნაპირზე არაფერია მოწყობილი — არც კაფე, არც ტუალეტი, არც ნაგვის ურნა, ამიტომ
    წყალი, საჭმელი და ნაგვის პარკი თან იქონიეთ; მაღაზია, კაფე და ბენზინგასამართი ტყიბულში, რამდენიმე წუთის
    სავალზეა. სავსე ტბისა და ნაკლები ტალახისთვის ზაფხულის ბოლოს ან შემოდგომის დასაწყისში ჩამოდით — თებერვალ-მარტში
    წყალი ნაპირს შორს სცილდება. მაშველი აქ არ მორიგეობს, ფსკერი კი რბილი ტალახია, ამიტომ სტუმრები უფრო
    თევზაობენ, პიკნიკს აწყობენ ან უბრალოდ კლდეს უყურებენ. ზაფხულის საღამოს კოღოს საწინააღმდეგო საშუალება
    გამოგადგებათ. ზამთარში ნაპირზე თოვლი და ყინული დაგხვდებათ.
  route: >-
    თბილისიდან დასავლეთისკენ ს1 (E60) მაგისტრალით იარეთ — გორისა და ხაშურის გავლით, დაახლოებით 190 კილომეტრი;
    შემდეგ ზესტაფონთან, ჩოლაბურის ხიდთან გადაუხვიეთ და შ19-ით თერჯოლის გავლით ჩრდილოეთით ტყიბულისკენ ადით
    — სულ დაახლოებით 230 კმ და სამი საათი და ნახევარი. ბოლო კილომეტრებზე გზა შ17-ს, ქუთაისი–ტყიბული–ამბროლაურის
    გზას უერთდება; ქალაქამდე ცოტა ადრე წყლისკენ გვერდითი გზა ეშვება, რომელიც მოკლე გრუნტის მონაკვეთით
    მთავრდება. საწვავი თერჯოლაში ან ტყიბულში ჩაასხით. ამ ბოლო მონაკვეთის გარდა ყველგან ასფალტია, ამიტომ
    ეკონომკლასის მანქანაც საკმარისია; ძლიერი წვიმის შემდეგ მანქანა ასფალტის ბოლოს დატოვეთ და ბოლო რამდენიმე
    ასეული მეტრი ფეხით გაიარეთ.
en:
  name: Tkibuli Reservoir
  short: >-
    A dammed-up karst basin at the foot of the Nakerala cliff: grey-green water, wooded islands and a
    coal town's quiet back garden.
  body: >-
    **Before there was a lake here, the river Tkibula simply disappeared: it crossed the floor of the
    Okriba basin and slipped into a karst shaft that locals called Tskaldasavali, the place where the
    water goes down.** Soviet engineers dammed that very spot with earth, and the swallowed river rose
    into a reservoir 8.1 kilometres long and up to 3.2 wide, with small wooded islands scattered through
    its middle and western reaches.


    The lake is the lower step of a staircase. Above it, beyond the cliff, the Shaori reservoir lies on
    the Racha karst plateau at about 1,150 metres; between the two mirrors of water there is a drop of
    some 600 metres, and the Shaori–Tkibuli power chain, whose station opened in 1955, turns that fall
    into electricity.


    Tkibuli itself is a coal town. Mining began in 1846 and the settlement became a town in 1939; at the
    Soviet peak more than 20,000 people lived here, and in January 2024 there were 8,130. The mines, reopened
    in 2008, still employ about two thousand people and keep their families afloat, and they have also
    taken lives — sixteen in the accidents of 2018. Tea grows on the surrounding hills.


    The shore is mostly low and gently shelving. To the north stands the pale limestone face of Nakerala,
    a cliff 300 to 600 metres high that marks the old boundary of Racha. The water breathes with the seasons:
    highest in August and September, lowest in February and March, when the level falls by more than five
    and a half metres on average and a wide collar of mud and drowned shrubs appears. The lake is rich
    in fish, and someone is nearly always casting from the bank.


    Come in the evening, when the water has already gone dark and the white wall of Nakerala is still
    holding the last of the sun.
  tip: >-
    Allow an hour or two. The shore has no facilities at all — no café, toilets or bins — so bring water,
    food and a bag for your rubbish; shops, cafés and fuel are a few minutes away in Tkibuli. For the
    fullest lake and the least mud, come between late summer and early autumn; in February and March the
    water retreats far from the bank. There is no supervised swimming and the bottom is soft mud, so most
    visitors fish, picnic or simply watch the cliff. Repellent helps on summer evenings. In winter, expect
    snow and ice along the banks.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri for roughly 190 km, then leave it near
    Zestaponi at the Cholaburi bridge turn-off and follow the Sh19 north via Terjola to Tkibuli — about
    230 km and three and a half hours in all. The last kilometres join the Sh17, the Kutaisi–Tkibuli–Ambrolauri
    road; just short of town a side road runs down to the water, ending in a short dirt stretch. Fuel
    up in Terjola or Tkibuli. The whole way is asphalt apart from that final track, so an economy car
    is enough; after heavy rain, park where the tarmac ends and walk the last few hundred metres.
ru:
  name: Ткибульское водохранилище
  short: >-
    Карстовая котловина, запертая дамбой у подножия скалы Накерала: серо-зелёная вода, лесистые острова
    и тихие задворки шахтёрского города.
  body: >-
    **До того как здесь появилось озеро, река Ткибула просто исчезала: она пересекала дно Окрибской котловины
    и уходила в карстовый провал, который местные называли Цкалдасавали — «место, где уходит вода».**
    Советские инженеры перегородили именно это место земляной плотиной, и поглощённая река разлилась водохранилищем
    длиной 8,1 километра и шириной до 3,2, с небольшими лесистыми островами, разбросанными в его средней
    и западной части.


    Озеро — нижняя ступень лестницы. Выше него, за скалой, на карстовом плато Рачи, на высоте около 1150
    метров, лежит Шаорское водохранилище; между двумя зеркалами воды перепад составляет около 600 метров,
    и каскад Шаори–Ткибули, чья ГЭС заработала в 1955 году, превращает это падение в электричество.


    Сам Ткибули — угольный город. Добыча началась в 1846 году, посёлок стал городом в 1939-м; на советском
    пике здесь жило более 20 000 человек, а в январе 2024-го — 8130. Шахты, вновь открытые в 2008 году,
    до сих пор дают работу примерно двум тысячам человек и кормят их семьи, но и отнимают жизни — шестнадцать
    в авариях 2018 года. На окружающих холмах растёт чай.


    Берег в основном низкий и отлого спускается к воде. На севере встаёт светлая известняковая стена Накералы
    — утёс высотой от 300 до 600 метров, отмечающий старую границу Рачи. Вода дышит вместе с временами
    года: выше всего в августе-сентябре, ниже всего в феврале-марте, когда уровень падает в среднем более
    чем на пять с половиной метров и у берега открывается широкая полоса ила и утонувших кустов. Озеро
    богато рыбой, и на берегу почти всегда кто-то сидит с удочкой.


    Приезжайте вечером, когда вода уже потемнела, а белая стена Накералы ещё держит последний свет солнца.
  tip: >-
    Хватит часа-двух. На берегу совсем нет никакой инфраструктуры — ни кафе, ни туалетов, ни урн, — так
    что возьмите с собой воду, еду и пакет для мусора; магазины, кафе и заправка есть в нескольких минутах
    езды, в Ткибули. Самое полное озеро и меньше всего ила — с конца лета до начала осени; в феврале-марте
    вода отступает далеко от берега. Организованного купания здесь нет, дно илистое, поэтому большинство
    приезжает рыбачить, устроить пикник или просто полюбоваться скалой. Летними вечерами не обойтись без
    репеллента. Зимой на берегах ожидайте снег и лёд.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Гори и Хашури, около 190 км, затем у моста Чолабури
    близ Зестафони сверните на Sh19 и двигайтесь на север через Терджолу до Ткибули — всего около 230
    км и три с половиной часа. На последних километрах дорога соединяется с Sh17, трассой Кутаиси–Ткибули–Амбролаури;
    чуть не доезжая до города боковая дорога спускается к воде, заканчиваясь коротким грунтовым участком.
    Заправиться можно в Терджоле или Ткибули. Весь путь асфальтирован, кроме этого последнего участка,
    так что хватит машины эконом-класса; после сильного дождя оставьте машину там, где кончается асфальт,
    и пройдите последние несколько сотен метров пешком.
fa:
  name: مخزن تکیبولی
  short: >-
    حوضه‌ای کارستی که در پای صخره‌ی ناکرالا پشت سدی محبوس شده: آبی به رنگ خاکستری‌سبز، جزیره‌هایی پوشیده
    از درخت و حیاط خلوتِ آرام یک شهر زغال‌سنگ.
  body: >-
    **پیش از آنکه اینجا دریاچه‌ای پدید آید، رود تکیبولا به‌سادگی ناپدید می‌شد: از بستر حوضه‌ی اوکریبا
    می‌گذشت و به گودالی کارستی که مردم محلی آن را تسکالداساوالی، یعنی «جایی که آب پایین می‌رود»، می‌نامیدند،
    فرو می‌رفت.** مهندسان دوران شوروی همان نقطه را با خاک سد کردند، و رود بلعیده‌شده به مخزنی به طول ۸٫۱
    کیلومتر و پهنای تا ۳٫۲ کیلومتر تبدیل شد که جزیره‌های کوچک پوشیده از درخت در بخش میانی و غربی آن پراکنده‌اند.


    این دریاچه پله‌ی پایینی یک راه‌پله است. بالاتر از آن، پس از صخره، مخزن شائوری بر فلات کارستی راچا
    در ارتفاع نزدیک به ۱۱۵۰ متری قرار دارد؛ میان این دو آینه‌ی آب، افتی نزدیک به ۶۰۰ متر وجود دارد، و
    زنجیره‌ی نیروگاهی شائوری-تکیبولی، که نیروگاهش در سال ۱۹۵۵ گشایش یافت، این افت را به برق بدل می‌کند.


    خود تکیبولی شهری معدنیِ زغال‌سنگ است. استخراج از سال ۱۸۴۶ آغاز شد و این آبادی در سال ۱۹۳۹ به شهر بدل
    شد؛ در اوج دوران شوروی بیش از بیست هزار نفر در آن می‌زیستند، و در ژانویه ۲۰۲۴ تنها ۸۱۳۰ نفر. معادنی
    که در سال ۲۰۰۸ دوباره گشوده شدند، هنوز به حدود دو هزار نفر کار می‌دهند و خانواده‌هایشان را نان می‌دهند،
    اما جان‌هایی نیز گرفته‌اند — شانزده تن در حوادث سال ۲۰۱۸. بر تپه‌های پیرامون چای می‌کارند.


    ساحل بیشتر پست و کم‌شیب است. در شمال، دیواره‌ی سنگ‌آهکی روشن ناکرالا برافراشته — صخره‌ای به بلندای
    ۳۰۰ تا ۶۰۰ متر که مرز کهن راچا را نشان می‌دهد. آب با فصل‌ها نفس می‌کشد: بالاترین سطح در اوت و سپتامبر،
    پایین‌ترین در فوریه و مارس، وقتی سطح آب به‌طور میانگین بیش از پنج‌و‌نیم متر فرومی‌نشیند و کمربندی
    گسترده از گِل و بوته‌های غرقه پدیدار می‌شود. دریاچه از ماهی سرشار است، و تقریباً همیشه کسی در کنار
    ساحل قلاب انداخته است.


    عصرگاه بیایید، آنگاه که آب پیشاپیش تیره شده، اما دیوار سپید ناکرالا هنوز آخرین پرتو خورشید را نگاه
    داشته است.
  tip: >-
    یک تا دو ساعت کافی است. ساحل هیچ امکاناتی ندارد — نه کافه، نه سرویس بهداشتی، نه سطل زباله — پس آب،
    غذا و کیسه‌ای برای زباله همراه ببرید؛ مغازه، کافه و پمپ‌بنزین چند دقیقه‌ای در تکیبولی در دسترس است.
    برای پُرآب‌ترین دریاچه و کمترین گِل، از اواخر تابستان تا اوایل پاییز بیایید؛ در فوریه و مارس آب از
    ساحل دور می‌شود. ناجی غریق در کار نیست و بستر گِلی نرم است، پس بیشتر بازدیدکنندگان به ماهی‌گیری، پیک‌نیک
    یا فقط تماشای صخره می‌پردازند. در عصرهای تابستانی دافع حشرات کمک می‌کند. زمستان، انتظار برف و یخ در
    کنار ساحل را داشته باشید.
  route: >-
    از تفلیس از بزرگراه S1 (E60) به سوی غرب، از گوری و خاشوری، حدود ۱۹۰ کیلومتر بروید، سپس نزدیک زستافونی،
    در دوراهی پل چولابوری، از آن خارج شوید و از Sh19 به سوی شمال، از راه ترجولا تا تکیبولی برانید — در
    مجموع نزدیک به ۲۳۰ کیلومتر و سه‌ونیم ساعت. در کیلومترهای پایانی، جاده به Sh17، مسیر کوتائیسی–تکیبولی–آمبرولائوری،
    می‌پیوندد؛ کمی پیش از شهر، راهی فرعی به سوی آب سرازیر می‌شود که به قطعه‌ای کوتاه خاکی می‌رسد. سوخت
    را در ترجولا یا تکیبولی بزنید. تمام مسیر به‌جز آن قطعه‌ی پایانی آسفالته است، پس خودروی اقتصادی کافی
    است؛ پس از باران شدید، خودرو را در پایان آسفالت پارک کنید و چند صد متر آخر را پیاده بروید.
he:
  name: מאגר טקיבולי
  short: >-
    אגן קארסטי שנכלא מאחורי סכר למרגלות מצוק נקרלה: מים אפורים-ירקרקים, איים מיוערים וחצר אחורית שקטה
    של עיירת פחם.
  body: >-
    **לפני שהאגם הזה נוצר, נהר טקיבולה פשוט נעלם: הוא חצה את קרקעית אגן אוקריבה ונבלע בפיר קרסטי שהתושבים
    המקומיים קראו לו צקלדסאוואלי — 'המקום שבו המים יורדים'.** מהנדסים סובייטים סתמו בעפר בדיוק את הנקודה
    הזאת, והנהר שנבלע התרומם למאגר באורך 8.1 קילומטרים וברוחב של עד 3.2, עם איים מיוערים קטנים הפזורים
    בחלקו האמצעי והמערבי.


    האגם הוא המדרגה התחתונה בסולם. מעליו, מעבר לצוק, שוכן מאגר שאורי על רמת הקארסט של רָאצָ'ה, בגובה של
    כ-1,150 מטרים; בין שני מראות המים יש הפרש של כ-600 מטרים, ושרשרת תחנות הכוח שאורי–טקיבולי, שתחנתו
    נפתחה ב-1955, הופך את הפרש הגבהים הזה לחשמל.


    טקיבולי עצמה היא עיירת פחם. הכרייה החלה ב-1846, והיישוב הפך לעיר ב-1939; בשיא התקופה הסובייטית חיו
    כאן יותר מ-20,000 בני אדם, ובינואר 2024 — 8,130. המכרות, שנפתחו מחדש ב-2008, עדיין מעסיקים כאלפיים
    איש ומפרנסים את משפחותיהם, אך גם גבו חיים — שישה־עשר בתאונות 2018. על הגבעות שמסביב מגדלים תה.


    החוף רובו נמוך ומשתפל בעדינות. בצפון מזדקר הקיר הבהיר של אבן הגיר של נקרלה, מצוק בגובה 300 עד 600
    מטרים המסמן את גבולה העתיק של רָאצָ'ה. המים נושמים עם העונות: המפלס הגבוה ביותר באוגוסט-ספטמבר, והנמוך
    ביותר בפברואר-מרץ, כשהמפלס יורד בממוצע ביותר מחמישה מטרים וחצי וצווארון רחב של בוץ ושיחים טבועים נחשף.
    האגם עשיר בדגים, וכמעט תמיד יש מישהו שדג מהחוף.


    בואו בערב, כשהמים כבר הכהו אך הקיר הלבן של נקרלה עדיין אוחז באור השמש האחרון.
  tip: >-
    שעה עד שעתיים מספיקות. בחוף אין שום תשתית — לא בית קפה, לא שירותים, לא פחי אשפה — אז הביאו מים, אוכל
    ושקית לזבל; חנויות, בתי קפה ותחנת דלק נמצאים כמה דקות משם, בטקיבולי. לאגם המלא ביותר ולכמות הבוץ הקטנה
    ביותר, בואו מסוף הקיץ עד תחילת הסתיו; בפברואר ומרץ המים נסוגים הרחק מהחוף. אין רחצה מפוקחת, והתחתית
    בוצית ורכה, ולכן רוב המבקרים דגים, עושים פיקניק או פשוט מתבוננים בצוק. תרסיס יתושים עוזר בערבי הקיץ.
    בחורף, יש לצפות לשלג וקרח לאורך הגדות.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי וחשורי, כ-190 ק"מ, ואז רדו ממנו ליד זסטפוני, בפנייה של גשר
    צ'ולבורי, והמשיכו ב-Sh19 צפונה דרך טרג'ולה עד טקיבולי — כ-230 ק"מ ושלוש שעות וחצי בסך הכול. בקילומטרים
    האחרונים הכביש מתחבר ל-Sh17, כביש קוטאיסי–טקיבולי–אמברולאורי; קצת לפני העיר יורדת דרך צד למים ומסתיימת
    בקטע עפר קצר. תדלקו בטרג'ולה או בטקיבולי. כל הדרך אספלט מלבד אותו קטע אחרון, כך שרכב חסכוני קטן מספיק;
    אחרי גשם חזק מומלץ לחנות בקצה האספלט וללכת ברגל את מאות המטרים האחרונים.
ar:
  name: خزان تكيبولي
  short: 'حوض كارستي محبوس خلف سد عند سفح صخرة ناكيرالا: مياه رمادية مخضرة، جزر مشجرة، وملاذ هادئ لبلدة
    الفحم.'
  body: >-
    **قبل أن تكون هنا بحيرة، كان نهر تكيبولا يختفي ببساطة: يعبر قاع حوض أوكريبا وينزلق في فتحة كارستية
    كان السكان المحليون يسمّونها تسكالداسافالي، أي «المكان الذي ينزل إليه الماء».** سدّ المهندسون السوفييت
    تلك النقطة بعينها بسدّ ترابي، فارتفع النهر المُبتلَع إلى خزان يبلغ طوله 8.1 كيلومترات وعرضه حتى 3.2،
    تتناثر فيه جزر صغيرة مشجّرة في جزئه الأوسط والغربي.


    هذه البحيرة هي الدرجة السفلى في سلّم. وفوقها، خلف الصخرة، يقع خزان شاوري على هضبة راتشا الكارستية
    على ارتفاع نحو 1150 مترًا؛ وبين مرآتَي الماء انحدارٌ يبلغ نحو 600 متر، ومنظومة محطات شاوري–تكيبولي
    الكهرومائية، التي افتُتحت محطتها عام 1955، تحوّل هذا الانحدار إلى كهرباء.


    تكيبولي نفسها مدينة تعدين فحم. بدأ التعدين عام 1846، وأصبحت البلدة مدينة عام 1939؛ وفي ذروة العهد
    السوفييتي عاش فيها أكثر من 20,000 نسمة، وفي يناير 2024 كان عدد سكانها 8130. أما المناجم، التي أُعيد
    افتتاحها عام 2008، فما زالت تشغّل نحو ألفي شخص وتُعيل أسرهم، لكنها حصدت أرواحًا أيضًا — ستة عشر شخصًا
    في حوادث عام 2018. وعلى التلال المحيطة يُزرع الشاي.


    الشاطئ منخفض في معظمه ومتدرّج بلطف. وفي الشمال ينتصب جدار ناكيرالا الجيري الفاتح، صخرة يبلغ ارتفاعها
    من 300 إلى 600 متر تحدّد الحدود القديمة لراتشا. يتنفّس الماء مع الفصول: أعلى منسوب في أغسطس وسبتمبر،
    وأدناه في فبراير ومارس، حين ينخفض المستوى بمعدل يزيد على خمسة أمتار ونصف ويظهر حزام واسع من الطين
    والشجيرات الغارقة. البحيرة غنية بالأسماك، وثمّة دائمًا تقريبًا من يرمي صنّارته من الضفة.


    تعالَ في المساء، حين يكون الماء قد أظلم وجدار ناكيرالا الأبيض لا يزال محتفظًا بآخر ضوء الشمس.
  tip: >-
    تكفي ساعة أو ساعتان. لا توجد على الضفة أي مرافق على الإطلاق — لا مقهى، لا مراحيض، لا سلال قمامة —
    فاحمل معك الماء والطعام وكيسًا للنفايات؛ المتاجر والمقاهي ومحطة الوقود على بُعد دقائق قليلة في تكيبولي.
    لأكمل ما تكون البحيرة وأقل ما يكون الطين، تعالَ بين أواخر الصيف وأوائل الخريف؛ في فبراير ومارس ينسحب
    الماء بعيدًا عن الضفة. لا توجد سباحة مُراقَبة والقعر طين رخو، فمعظم الزوّار يصطادون أو يتنزّهون أو
    يتأمّلون الصخرة فقط. طارد الحشرات مفيد في أمسيات الصيف. في الشتاء، توقّع الثلج والجليد على الضفاف.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري لنحو 190 كم، ثم اخرج منه قرب زيستافوني عند مفترق
    جسر تشولابوري، واتبع Sh19 شمالًا عبر ترجولا إلى تكيبولي — نحو 230 كم وثلاث ساعات ونصف إجمالًا. في
    الكيلومترات الأخيرة يلتقي الطريق بـ Sh17، طريق كوتايسي–تكيبولي–أمبرولاوري؛ وقبل المدينة بقليل ينزل
    طريق جانبي إلى الماء ينتهي بمقطع تُرابي قصير. تزوّد بالوقود في ترجولا أو تكيبولي. الطريق كله مُعبّد
    باستثناء ذلك المقطع الأخير، فسيارة اقتصادية كافية؛ وبعد المطر الغزير، اترك السيارة حيث ينتهي الإسفلت
    وامشِ بضع مئات الأمتار الأخيرة.
