ka:
  name: ტყიბულის წყალსაცავი
  short: ხელოვნური ტბა ტყიბულის ქვემოთ, ნაქერალას კირქვის კედლის ფონზე — მშვიდი გაჩერება რაჭისკენ მიმავალ
    გზაზე.
  body: >-
    **ტყიბულის წყალსაცავი ჰიდროენერგეტიკის ნაწილია და არა კურორტი — და სწორედ ამიტომ არის აქ წყნარად.**
    ტბა ტყიბულის სამხრეთ-დასავლეთით, დაახლოებით 520 მეტრზეა; ჩრდილოეთით ნაქერალას თეთრი კირქვის კედელი
    ჩანს, რომელიც იმერეთსა და რაჭას შორის საზღვარს ქმნის.


    ქალაქი ორ წყალსაცავს შორის დგას და მათ შორის სიმაღლის სხვაობა ექვსას მეტრს აღემატება: ზემოთ, რაჭის
    კიდეზე, შაორია, ქვემოთ — ტყიბული. სწორედ ეს ვარდნა გამოიყენება ელექტროენერგიის გამოსამუშავებლად. სქემა
    საბჭოთა პერიოდის ინჟინერიის ტიპურია და დღემდე მუშაობს.


    ტყიბული თავად სამთო ქალაქია: ქვანახშირს აქ 1846 წლიდან მოიპოვებენ, ქალაქის სტატუსი 1939 წელს მიიღო.
    საბჭოთა პერიოდში აქ ოცი ათასზე მეტი ადამიანი ცხოვრობდა; 1990-იანებში მოსახლეობა განახევრდა. მაღაროები
    დღესაც მუშაობს და უბედური შემთხვევების გამო არაერთხელ შეჩერებულა. ამ რეგიონში ჩაიც მოჰყავთ.


    რას აკეთებ ტბასთან:


    - თევზაობა — ნაპირზე ადგილობრივები ხშირად სხედან


    - პიკნიკი ჩრდილში, ჩრდილო-აღმოსავლეთ ნაპირზე


    - ფოტო ნაქერალას კედლის ფონზე, განსაკუთრებით საღამოს


    სანაპირო არსად არის მოწყობილი: არც კაფე, არც აბაზანა, არც სალაშქრო ბილიკი. წყლის დონე სეზონურად იცვლება
    და ზაფხულის ბოლოს ტალახიანი ზოლი შიშვლდება. ეს ერთსაათიანი გაჩერებაა ნაქერალას უღელტეხილისკენ ან რაჭისკენ
    მიმავალ გზაზე და არა დამოუკიდებელი დანიშნულების ადგილი.


    აქ ასვლის მეორე მიზეზი თავად გზაა. ქუთაისიდან ტყიბულამდე ის თანდათან იკრებს სიმაღლეს ჩაის ტერასებსა
    და წიფლნარში, წყალსაცავი კი ის წერტილია, სადაც ლანდშაფტი ხასიათს იცვლის: ქვემოთ ყველაფერი კოლხეთის
    დაბლობია, ზემოთ კი რაჭის კირქვა იწყება. თუ ნაქერალასკენ ან ამბროლაურისკენ მიდიხარ, ეს ბუნებრივი ადგილია
    გასაჩერებლად და უკან, გავლილი გზისკენ მოსახედად.
  tip: >-
    ერთი-ორი საათი. სანაპიროზე ინფრასტრუქტურა არ არის — წყალი, საჭმელი და ნაგვის პარკი თან წაიღე. ბანაობა
    არ არის რეკომენდებული: ნაპირი ციცაბოა, ფსკერი ტალახიანი, დონე კი ჰიდროსადგურის რეჟიმზეა დამოკიდებული
    და მოულოდნელად იცვლება. ზაფხულში ბუზი და კოღოა, ჩამოკიდებული საშუალება გამოგადგება. ტყიბულში მაღაზია,
    ბენზინგასამართი და კაფე ხუთ წუთშია. ზამთარში ნაპირზე ზოგან თოვლი და ყინულია.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ჩრდილოეთით თერჯოლაზე გავლით ტყიბულისკენ — სულ დაახლოებით 230
    კმ და სამი საათნახევარი. გზა ასფალტიანია, ბოლო ოცი კილომეტრი კი ხეობაშია ჩაჭრილი და ვიწროვდება. ტყიბულამდე
    ცოტა ადრე წყალსაცავისკენ მიმავალი გზა მარცხნივ ეშვება; ბოლო ორიოდე კილომეტრი მოხრეშილია, მაგრამ გამავალი.
    საწვავი ზესტაფონსა და ტყიბულში აიღე. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Tkibuli Reservoir
  short: A man-made lake below Tkibuli under the white cliff of Nakerala — a quiet stop on the way to
    Racha.
  body: >-
    **Tkibuli reservoir is part of a hydroelectric scheme rather than a resort, which is exactly why it
    is quiet.** The lake lies south-west of Tkibuli at about 520 metres, and to the north the white limestone
    wall of Nakerala marks the boundary between Imereti and Racha.


    The town sits between two reservoirs whose difference in level is more than six hundred metres: Shaori
    above on the edge of Racha, Tkibuli below. That drop is what generates the power. The arrangement
    is typical Soviet-era engineering and still works.


    Tkibuli itself is a mining town. Coal has been dug here since 1846 and the settlement was made a town
    in 1939. More than twenty thousand people lived here in Soviet times; the population roughly halved
    in the 1990s. The mines still operate and have been suspended more than once after fatal accidents.
    Tea is also grown in the surrounding hills.


    What you actually do at the lake:


    - fish, as the locals do along the shore


    - picnic in the shade on the north-eastern bank


    - photograph the Nakerala wall across the water, best in the evening


    Nothing on the shoreline is developed: no cafe, no changing rooms, no marked trail. Water levels move
    with the demands of the power station and by late summer a muddy band is exposed. Think of it as an
    hour's stop on the way up to the Nakerala pass or into Racha, not as a destination in itself.


    There is a second reason to come up here, and it is the drive itself. The road from Kutaisi to Tkibuli
    climbs steadily through tea terraces and beech forest, and the reservoir is the point where the landscape
    changes character: below it everything is Colchic lowland, above it the limestone of Racha begins.
    If you are heading for Nakerala or Ambrolauri, this is the natural place to stop and look back at
    where you have come from.
  tip: >-
    One to two hours. There is no infrastructure on the shore, so bring water, food and a bag for your
    rubbish. Swimming is not advisable: the bank is steep, the bottom muddy, and the level depends on
    the power station and can change without warning. In summer there are flies and mosquitoes, so repellent
    helps. Shops, fuel and cafes are five minutes away in Tkibuli. In winter parts of the shore carry
    snow and ice.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then north through Terjola towards Tkibuli — about 230
    km in all, three and a half hours. The road is asphalt, and the last twenty kilometres narrow as they
    cut into the valley. Shortly before Tkibuli a road drops away to the left towards the reservoir; the
    final couple of kilometres are gravel but passable. Fuel is available in Zestaponi and Tkibuli. An
    economy car is sufficient.
ru:
  name: Ткибульское водохранилище
  short: Искусственное озеро ниже Ткибули под белой стеной Накералы — тихая остановка по дороге в Рачу.
  body: >-
    **Ткибульское водохранилище — часть гидроэнергетической схемы, а не курорт, и именно поэтому здесь
    тихо.** Озеро лежит к юго-западу от Ткибули на высоте около 520 метров, а на севере белая известняковая
    стена Накералы отмечает границу между Имеретией и Рачей.


    Город стоит между двумя водохранилищами, разница уровней которых превышает шестьсот метров: выше,
    на краю Рачи, Шаори, ниже — Ткибули. Именно этот перепад даёт электроэнергию. Схема типична для советской
    инженерии и работает до сих пор.


    Сам Ткибули — шахтёрский город. Уголь добывают здесь с 1846 года, статус города посёлок получил в
    1939-м. В советское время тут жило больше двадцати тысяч человек; в 1990-е население сократилось примерно
    вдвое. Шахты работают и сегодня и не раз останавливались после смертельных аварий. В окрестных холмах
    выращивают чай.


    Что здесь делают у воды:


    - ловят рыбу, как это делают местные вдоль берега


    - устраивают пикник в тени на северо-восточном берегу


    - снимают стену Накералы через озеро, лучше всего вечером


    Берег никак не обустроен: ни кафе, ни раздевалок, ни размеченной тропы. Уровень воды меняется по режиму
    станции, и к концу лета обнажается грязная полоса. Считайте это часовой остановкой по пути на перевал
    Накерала или в Рачу, а не самостоятельной целью.


    Есть и вторая причина сюда подняться — сама дорога. От Кутаиси до Ткибули она равномерно набирает
    высоту среди чайных террас и букового леса, а водохранилище — та точка, где пейзаж меняет характер:
    ниже всё ещё Колхидская низменность, выше начинается известняк Рачи. Если вы едете на Накералу или
    в Амбролаури, это естественное место, чтобы остановиться и посмотреть назад, на пройденный путь.
  tip: >-
    Один-два часа. Инфраструктуры на берегу нет, так что берите воду, еду и пакет для мусора. Купаться
    не советуем: берег крутой, дно илистое, а уровень зависит от станции и может измениться без предупреждения.
    Летом много мошки и комаров, репеллент пригодится. Магазины, заправка и кафе — в Ткибули, в пяти минутах.
    Зимой на части берега лежат снег и лёд.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем на север через Тержолу в сторону Ткибули — всего около 230 км,
    три с половиной часа. Дорога асфальтированная, последние двадцать километров сужаются, врезаясь в
    долину. Незадолго до Ткибули влево уходит спуск к водохранилищу; последние пара километров — гравий,
    но проезжий. Заправки есть в Зестафони и Ткибули. Машины эконом-класса достаточно.
fa:
  name: دریاچهٔ سد تکیبولی
  short: دریاچه‌ای مصنوعی پایین‌تر از تکیبولی زیر دیوارهٔ سفید ناکرالا — توقفی آرام در راه راچا.
  body: >-
    **آبگیر تکیبولی بخشی از یک طرح برق‌آبی است نه یک تفرجگاه، و دقیقاً به همین سبب آرام است.** دریاچه
    در جنوب غربی تکیبولی و در ارتفاع حدود ۵۲۰ متر قرار دارد، و در شمال دیوارهٔ سفید سنگ آهکی ناکرالا مرز
    میان ایمرتی و راچا را نشان می‌دهد.


    شهر میان دو آبگیر نشسته که اختلاف ترازشان بیش از ششصد متر است: شائوری بالا در لبهٔ راچا، و تکیبولی
    پایین. همین سقوط ارتفاع است که برق تولید می‌کند. این چیدمان نمونه‌ای از مهندسی دورهٔ شوروی است و هنوز
    کار می‌کند.


    خود تکیبولی شهری معدنی است. زغال‌سنگ از ۱۸۴۶ اینجا استخراج می‌شود و آبادی در ۱۹۳۹ شهر شد. در دورهٔ
    شوروی بیش از بیست هزار نفر اینجا زندگی می‌کردند و جمعیت در دههٔ ۱۹۹۰ تقریباً نصف شد. معادن هنوز کار
    می‌کنند و بیش از یک بار پس از سوانح مرگبار تعطیل شده‌اند. در تپه‌های پیرامون چای هم می‌کارند.


    کنار دریاچه چه می‌کنید:


    - ماهیگیری، همان‌طور که اهالی در طول ساحل می‌کنند


    - پیک‌نیک در سایهٔ کرانهٔ شمال شرقی


    - عکاسی از دیوارهٔ ناکرالا آن‌سوی آب، بهتر از همه در غروب


    هیچ بخشی از ساحل آماده‌سازی نشده: نه کافه، نه رختکن، نه مسیر علامت‌گذاری‌شده. تراز آب تابع نیاز نیروگاه
    است و در اواخر تابستان نواری گِلی نمایان می‌شود. آن را توقفی یک‌ساعته در راه گردنهٔ ناکرالا یا راچا
    بدانید، نه مقصدی مستقل.


    دلیل دومی هم برای بالا آمدن هست و آن خود رانندگی است. جاده از کوتایسی تا تکیبولی پیوسته میان تراس‌های
    چای و جنگل راش اوج می‌گیرد، و آبگیر همان نقطه‌ای است که چشم‌انداز عوض می‌شود: پایین‌تر همه‌چیز پست‌دشت
    کلخی است و بالاتر سنگ آهک راچا آغاز می‌شود. اگر به ناکرالا یا آمبرولاوری می‌روید، اینجا جای طبیعی
    ایستادن و نگاه کردن به راهی است که آمده‌اید.
  tip: >-
    یک تا دو ساعت. کنار آب هیچ امکاناتی نیست، پس آب و خوراک و کیسه‌ای برای زباله همراه ببرید. شنا توصیه
    نمی‌شود: کرانه تند است، کف گِلی است و تراز آب به نیروگاه بستگی دارد و بی‌خبر تغییر می‌کند. تابستان
    مگس و پشه هست و دورکننده کمک می‌کند. مغازه و پمپ بنزین و کافه در تکیبولی و پنج دقیقه آن‌سوترند. زمستان
    بخش‌هایی از ساحل برف و یخ دارد.
  route: >-
    از تفلیس با E60 تا زستافونی، سپس شمال از راه ترجولا به سوی تکیبولی — روی‌هم حدود ۲۳۰ کیلومتر و سه
    ساعت و نیم. جاده آسفالت است و بیست کیلومتر آخر با بریدن در دره باریک می‌شود. کمی پیش از تکیبولی راهی
    به چپ به سوی آبگیر پایین می‌رود؛ دو کیلومتر آخر شنی اما قابل عبور است. سوخت در زستافونی و تکیبولی
    هست. خودروی اقتصادی کافی است.
he:
  name: מאגר טקיבולי
  short: אגם מלאכותי מתחת לטקיבולי, מתחת למצוק הלבן של נאקראלה — עצירה שקטה בדרך לראצ'ה.
  body: >-
    **מאגר טקיבולי הוא חלק ממערך הידרו־חשמלי ולא אתר נופש, ובדיוק משום כך שקט בו.** האגם שוכן דרומית־מערבית
    לטקיבולי בגובה כ-520 מטר, ובצפון מסמן קיר הגיר הלבן של נאקראלה את הגבול בין אימרתי לראצ'ה.


    העיירה יושבת בין שני מאגרים שהפרש הגובה ביניהם עולה על שש מאות מטר: שאורי למעלה בשולי ראצ'ה, וטקיבולי
    למטה. הנפילה הזאת היא שמייצרת את החשמל. המערך אופייני להנדסה הסובייטית ועדיין פועל.


    טקיבולי עצמה היא עיירת מכרות. פחם נכרה כאן מאז 1846, והיישוב הוכר כעיר ב-1939. בתקופה הסובייטית חיו
    כאן יותר מעשרים אלף איש; בשנות התשעים התמעטה האוכלוסייה בערך במחצית. המכרות פועלים עד היום והושבתו
    יותר מפעם אחת אחרי תאונות קטלניות. בגבעות שמסביב מגדלים גם תה.


    מה עושים כאן ליד המים:


    - דגים, כפי שעושים המקומיים לאורך החוף


    - עורכים פיקניק בצל בגדה הצפונית־מזרחית


    - מצלמים את קיר נאקראלה מעבר לאגם, ובעיקר לפנות ערב


    שום דבר בקו המים אינו מפותח: אין בית קפה, אין תאי הלבשה, אין שביל מסומן. מפלס המים משתנה לפי צורכי
    התחנה, ובשלהי הקיץ נחשפת רצועת בוץ. חשבו על זה כעצירה של שעה בדרך למעבר נאקראלה או לראצ'ה, ולא כיעד
    בפני עצמו.


    יש סיבה שנייה לעלות לכאן, והיא הנסיעה עצמה. הכביש מקוטאיסי לטקיבולי מטפס בהתמדה בין טרסות תה ויער
    אשור, והמאגר הוא הנקודה שבה הנוף משנה אופי: מתחתיו הכול שפלה קולכית, ומעליו מתחילה אבן הגיר של ראצ'ה.
    אם אתם בדרך לנאקראלה או לאמברולאורי, זהו המקום הטבעי לעצור ולהביט לאחור אל הדרך שעברתם.
  tip: >-
    שעה עד שעתיים. אין תשתית בגדה, לכן קחו מים, אוכל ושקית לאשפה. לא מומלץ לשחות: הגדה תלולה, הקרקעית
    בוצית, והמפלס תלוי בתחנת הכוח ועשוי להשתנות בלי התראה. בקיץ יש זבובים ויתושים ותכשיר הרחקה עוזר. חנויות,
    דלק ובתי קפה בטקיבולי, חמש דקות משם. בחורף חלקים מן החוף מכוסים שלג וקרח.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז צפונה דרך טרז'ולה לכיוון טקיבולי — כ-230 ק״מ בסך הכול, שלוש שעות
    וחצי. הכביש סלול, ועשרים הקילומטרים האחרונים מצטמצמים כשהם נחצבים בעמק. מעט לפני טקיבולי יורדת שמאלה
    דרך אל המאגר; שני הקילומטרים האחרונים חצץ אך עבירים. דלק יש בזסטפוני ובטקיבולי. רכב חסכוני מספיק.
ar:
  name: بحيرة سد تكيبولي
  short: بحيرة اصطناعية أسفل تكيبولي تحت جرف ناكيرالا الأبيض — محطة هادئة في الطريق إلى راتشا.
  body: >-
    **بحيرة سد تكيبولي جزء من منظومة كهرومائية لا منتجعاً، ولهذا بالذات هي هادئة.** تقع البحيرة جنوب غرب
    تكيبولي على ارتفاع نحو 520 متراً، وفي الشمال يرسم جدار ناكيرالا الجيري الأبيض الحدّ بين إيميريتي وراتشا.


    تجلس البلدة بين خزانين يزيد فارق منسوبيهما على ستمئة متر: شاوري في الأعلى عند حافة راتشا، وتكيبولي
    في الأسفل. وهذا الهبوط هو ما يولّد الكهرباء. والترتيب نموذج للهندسة السوفييتية وما زال يعمل.


    وتكيبولي نفسها بلدة مناجم. يُستخرج الفحم هنا منذ 1846، ونالت البلدة صفتها عام 1939. عاش فيها أكثر
    من عشرين ألف نسمة في العهد السوفييتي، وتراجع العدد إلى النصف تقريباً في التسعينيات. وما زالت المناجم
    عاملة وقد توقفت أكثر من مرة بعد حوادث مميتة. كما تُزرع الشاي في التلال المحيطة.


    ما تفعله فعلاً عند البحيرة:


    - الصيد، كما يفعل الأهالي على امتداد الشاطئ


    - نزهة في الظل على الضفة الشمالية الشرقية


    - تصوير جدار ناكيرالا عبر الماء، وأفضله عند المساء


    لا شيء على الشاطئ مهيّأ: لا مقهى ولا غرف تبديل ولا مسار مُعلَّم. ومنسوب الماء يتحرك بحسب حاجة المحطة،
    وفي أواخر الصيف ينكشف شريط طيني. فاعتبرها توقفاً لساعة في الطريق إلى ممر ناكيرالا أو إلى راتشا، لا
    وجهة بذاتها.


    ثمة سبب ثانٍ للصعود إلى هنا، وهو القيادة نفسها. تصعد الطريق من كوتايسي إلى تكيبولي باطراد بين مصاطب
    الشاي وغابات الزان، والخزان هو النقطة التي يتبدل عندها طابع المشهد: تحته كل شيء سهل كولخيس المنخفض،
    وفوقه يبدأ حجر راتشا الجيري. فإن كنت متجهاً إلى ناكيرالا أو أمبرولاوري، فهذا مكان طبيعي للتوقف والنظر
    إلى الوراء نحو الطريق الذي قطعته.
  tip: >-
    ساعة إلى ساعتين. لا بنية تحتية على الشاطئ، فاحمل ماءً وطعاماً وكيساً لنفاياتك. والسباحة غير مستحسنة:
    الضفة حادة والقاع طيني والمنسوب تابع للمحطة وقد يتغير بلا إنذار. في الصيف ذباب وبعوض، والطارد مفيد.
    المتاجر والوقود والمقاهي في تكيبولي على بعد خمس دقائق. وفي الشتاء تغطي الثلوج والجليد أجزاء من الشاطئ.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم شمالاً عبر ترجولا نحو تكيبولي — نحو 230 كم إجمالاً وثلاث
    ساعات ونصف. الطريق معبّد، والعشرون كيلومتراً الأخيرة تضيق وهي محفورة في الوادي. وقبل تكيبولي بقليل
    ينحدر طريق يساراً نحو الخزان؛ والكيلومتران الأخيران حصى لكنهما سالكان. الوقود متوفر في زستافوني وتكيبولي.
    وتكفي سيارة اقتصادية.
