ka:
  name: ვაჟა-ფშაველას სახლ-მუზეუმი ჩარგალში
  short: >-
    ოროთახიანი სახლი ფშავის სოფელში, სადაც ლუკა რაზიკაშვილი ვაჟა-ფშაველად იქცა: მისი თოფი, დის ნაქსოვი
    ხურჯინი და გარშემო — მისივე მთები.
  body: >-
    **ჩარგალში, ერთსართულიან ოროთახიან სახლში, ცხოვრობდა პოეტი, რომელსაც ქართველები უბრალოდ ვაჟას ეძახიან
    — აქედან შევიდა ფშავის მთა ქართულ ლიტერატურაში.**


    ლუკა რაზიკაშვილი 1861 წლის 14 ივლისს ჩარგალში, სასულიერო პირის ოჯახში დაიბადა. ტყისა და ნადირობის
    სიყვარული ბიძამ ჩაუნერგა, რომლის სახეც მოგვიანებით მის თხზულებებშიც გაჩნდა. 1882 წელს გორის საოსტატო
    სემინარია დაამთავრა, 1883–1884 წლებში პეტერბურგის უნივერსიტეტის იურიდიულ ფაკულტეტზე თავისუფალ მსმენლად
    ისწავლა, მაგრამ სახსრების უქონლობის გამო მთაში დაბრუნდა, ქართულს ასწავლიდა და წერდა. მის კალამს ეკუთვნის
    36 პოემა და დაახლოებით 400 ლექსი, მათ შორის „ალუდა ქეთელაური“ (1888), „ბახტრიონი“ (1892), „სტუმარ-მასპინძელი“
    (1893) და „გველის მჭამელი“ (1901). მის პოემებში ადამიანი თემს უპირისპირდება, ბუნება კი ცოცხალი და
    დაძაბულია. ინგლისელი ქართველოლოგი დონალდ რეიფილდი მას ყველა სხვა ქართველ მწერალზე უფრო დიდი მასშტაბის
    შემოქმედად მიიჩნევს.


    მუზეუმი და მემორიალი 1961 წელს გაიხსნა. პოეტის ოთახი თითქმის ცარიელია: მაგიდა, სკამი, ბუხარი; კედელზე
    თოფი კიდია — ვაჟა გამოცდილი მონადირე იყო. აქვეა ხურჯინი, რომელიც დამ, მართამ, საჩუქრად მოუქსოვა და
    რომლითაც პოეტი თავის ბარგს დაატარებდა. ექსპოზიციაში მისი ხელნაწერები, გამოცემები, ფოტოები, XIX–XX
    საუკუნეების ეთნოგრაფიული ნივთები და მისადმი მიძღვნილი ფერწერა და ქანდაკებაა, ეზოში კი — სამეურნეო
    ნაგებობები, ძველებური ღუმელი და წისქვილი. სოფელში ყოველწლიურად ტრადიციული დღესასწაული, „ვაჟაობა“ იმართება.


    ვაჟა 1915 წლის 10 ივლისს თბილისში გარდაიცვალა და მთაწმინდის პანთეონში განისვენებს. საფლავი დედაქალაქშია,
    მაგრამ ტყე, რომელიც მის ლექსებში ლაპარაკობს, აქვე, ჭიშკრის იქით იწყება.
  tip: >-
    ყველაზე მნიშვნელოვანი: კულტურის სამინისტრომ 2025–2027 წლებისთვის მუზეუმის სრული რეაბილიტაცია გამოაცხადა
    — შენობის აღდგენა, ექსპოზიციის განახლება და კონსერვაცია. არც ერთი წყარო არ ადასტურებს, ღიაა თუ არა
    ის სამუშაოების დროს, ამიტომ გამგზავრებამდე დარეკეთ და გადაამოწმეთ, ასევე — შესვლის საფასური. დასათვალიერებლად
    ერთი საათი საკმარისია. სოფელი პატარაა, კაფის იმედად ნუ იქნებით: წყალი და საჭმელი თან წაიღეთ. ოქტომბრის
    შემდეგ ხეობის გზას თოვლი და ტალახი ართულებს, ამიტომ საუკეთესო დრო მაისიდან ოქტომბრამდეა.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117, ს3) ჟინვალამდე მიდიხართ, იქ ჟინვალი–ბარისახო–შატილის გზაზე
    (შ26) უხვევთ და ფშავის არაგვის ხეობას დაახლოებით 30 კილომეტრზე მიუყვებით. ბარისახომდე არ ახვიდეთ:
    ჩარგლისკენ ცალკე მისასვლელი გზა (შ145) უხვევს, საიდანაც სოფლამდე დაახლოებით სამი კილომეტრია. სულ 89
    კმ და დაახლოებით ორი საათი. ხეობის გზა ადგილ-ადგილ დაზიანებულია, ბოლო მონაკვეთი კი ხრეშიანი და ვიწროა,
    ამიტომ SUV კლასი ჯობია — მშრალ ამინდშიც. საწვავი ჟინვალში ჩაასხით. მუზეუმს საკუთარი ეზო აქვს, მანქანიდან
    მისასვლელი გზა კი სწორია.
en:
  name: Vazha-Pshavela House Museum, Chargali
  short: >-
    The two-room house in a Pshavi village where Luka Razikashvili became Vazha-Pshavela: his rifle, his
    sister’s saddlebag, and his mountains outside.
  body: >-
    **In a single-storey, two-room house in Chargali lived the poet Georgians call simply Vazha — and
    from here the mountains of Pshavi walked into Georgian literature.**


    Luka Razikashvili was born in Chargali on 14 July 1861 into a family of clergymen. An uncle gave him
    his love of forest and hunting, and the uncle himself later found his way into the poems. He graduated
    from the teachers’ seminary in Gori in 1882, audited law at St Petersburg University in 1883–84, ran
    out of money and came home to the mountains to teach Georgian and write. The output is enormous: 36
    epic poems and some 400 lyrics, among them Aluda Ketelauri (1888), Bakhtrioni (1892), Host and Guest
    (1893) and The Snake-Eater (1901). In them the individual defies the community, and nature is alive
    and full of tension. The British scholar Donald Rayfield ranks him “qualitatively of a greater magnitude
    than any other Georgian writer”.


    The museum and memorial opened in 1961. His room is almost bare: a table, a chair, a fireplace, and
    his rifle on the wall — Vazha was a practised hunter. Beside it hangs the saddlebag his sister Marta
    wove for him, in which he carried his belongings. The collection adds manuscripts, first editions,
    photographs, 19th- and 20th-century ethnographic objects, and paintings and sculpture made in his
    honour; in the yard stand outbuildings, an old-style oven and a mill. Every year the village holds
    its traditional festival, Vazhaoba.


    Vazha died in Tbilisi on 10 July 1915 and lies in the Mtatsminda Pantheon. The grave is in the capital,
    but the forest that speaks in his poems begins just beyond this gate.
  tip: >-
    Most important: Georgia’s Ministry of Culture has announced a full 2025–2027 rehabilitation of the
    museum — building works, conservation and a new exhibition. No source confirms whether it stays open
    during the work, so phone ahead before driving out, and confirm the entry fee at the same time. An
    hour is enough inside. The village is small; do not count on a café, and bring water and food. After
    October snow and mud make the valley road harder, so May to October is the sensible window.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117, S3) to Zhinvali, then turn onto the Zhinvali–Barisakho–Shatili
    road (Sh26) and follow the Pshavi Aragvi valley for about 30 km. Do not go as far as Barisakho: a
    short spur road (Sh145) branches off to Chargali, roughly three more kilometres to the village. In
    total it is 89 km and about two hours. The valley road is patchy in places and the final stretch is
    narrow gravel, so an SUV is the better choice even in dry weather. Refuel in Zhinvali. The museum
    has its own yard, with a level walk from where you park.
ru:
  name: Дом-музей Важа Пшавела в Чаргали
  short: >-
    Двухкомнатный дом в пшавском селе, где Лука Разикашвили стал Важа Пшавела: его ружьё, перемётная сума,
    сотканная сестрой, и его горы за окном.
  body: >-
    **В одноэтажном доме из двух комнат в Чаргали жил поэт, которого грузины называют просто Важа, — и
    отсюда горы Пшави шагнули в грузинскую литературу.**


    Лука Разикашвили родился в Чаргали 14 июля 1861 года в семье священнослужителей. Дядя привил ему любовь
    к лесу и охоте — и позже сам появился в его стихах. В 1882 году он окончил Горийскую учительскую семинарию,
    в 1883–84 годах вольнослушателем посещал юридический факультет Петербургского университета, остался
    без денег и вернулся в горы — преподавать грузинский язык и писать. Наследие его огромно: 36 поэм
    и около 400 лирических стихотворений, среди них «Алуда Кетелаури» (1888), «Бахтриони» (1892), «Гость
    и хозяин» (1893) и «Змееед» (1901). В них личность восстаёт против общины, а природа живая и полна
    напряжения. Британский исследователь Дональд Рейфилд считает его «по своему качеству — величиной большего
    масштаба, чем любой другой грузинский писатель».


    Музей и мемориал открылись в 1961 году. Комната поэта почти пуста: стол, стул, камин и ружьё на стене
    — Важа был опытным охотником. Рядом висит перемётная сума, которую соткала для него сестра Марта:
    в ней он носил свои пожитки. Собрание дополняют рукописи, первые издания, фотографии, этнографические
    предметы XIX–XX веков, а также живопись и скульптура, созданные в его честь; во дворе стоят хозяйственные
    постройки, старинная печь и мельница. Каждый год в селе проходит традиционный праздник — Важаоба.


    Важа умер в Тбилиси 10 июля 1915 года и похоронен в Пантеоне на Мтацминде. Могила — в столице, но
    лес, который говорит в его стихах, начинается сразу за этой калиткой.
  tip: >-
    Самое важное: Министерство культуры Грузии объявило о полной реабилитации музея в 2025–2027 годах
    — строительные работы, консервация и новая экспозиция. Ни один источник не подтверждает, будет ли
    музей открыт во время работ, поэтому позвоните заранее, прежде чем ехать, и заодно уточните стоимость
    входа. Внутри хватит часа. Село маленькое, на кафе не рассчитывайте — берите воду и еду. После октября
    снег и грязь усложняют дорогу по долине, так что разумное окно — с мая по октябрь.
  route: >-
    Из Тбилиси езжайте по Военно-Грузинской дороге (E117, S3) до Жинвали, затем сверните на дорогу Жинвали
    — Барисахо — Шатили (Sh26) и следуйте по долине Пшавской Арагви около 30 км. До Барисахо не доезжайте:
    короткое ответвление (Sh145) уходит к Чаргали — ещё примерно три километра до села. Всего 89 км и
    около двух часов. Дорога по долине местами разбита, а последний участок — узкая гравийная дорога,
    поэтому даже в сухую погоду лучше взять внедорожник (SUV). Заправьтесь в Жинвали. У музея свой двор,
    и от места парковки идти по ровному.
fa:
  name: خانه‌موزهٔ واژا-پشاولا، چارگالی
  short: >-
    خانهٔ دواتاقه‌ای در روستایی در پشاوی که لوکا رازیکاشویلی در آن به واژا-پشاولا بدل شد: تفنگش، خورجینی
    که خواهرش بافت، و کوه‌هایش آن سوی پنجره.
  body: >-
    **در خانه‌ای یک‌طبقه و دواتاقه در چارگالی، شاعری زندگی می‌کرد که گرجی‌ها او را به‌سادگی «واژا» می‌نامند
    — و از همین‌جا کوه‌های پشاوی به ادبیات گرجی قدم گذاشتند.**


    لوکا رازیکاشویلی در ۱۴ ژوئیهٔ ۱۸۶۱ در چارگالی، در خانواده‌ای از روحانیان، به دنیا آمد. یکی از عموهایش
    عشق به جنگل و شکار را در او کاشت و بعدها خودش به شعرهای او راه یافت. در ۱۸۸۲ از دانشسرای معلمان گوری
    فارغ‌التحصیل شد، در ۱۸۸۳–۸۴ به‌عنوان مستمع آزاد در کلاس‌های حقوق دانشگاه سن‌پترزبورگ حاضر شد، پولش
    ته کشید و به کوهستان بازگشت تا زبان گرجی درس بدهد و بنویسد. کارنامه‌اش عظیم است: ۳۶ منظومهٔ حماسی
    و حدود ۴۰۰ شعر غنایی، از جمله «آلودا کتلائوری» (۱۸۸۸)، «باختریونی» (۱۸۹۲)، «میزبان و مهمان» (۱۸۹۳)
    و «مارخوار» (۱۹۰۱). در این آثار فرد در برابر جماعت می‌ایستد و طبیعت زنده و سرشار از تنش است. دونالد
    ریفیلد، پژوهشگر بریتانیایی، او را «از نظر کیفی در مرتبه‌ای بزرگ‌تر از هر نویسندهٔ گرجی دیگر» می‌داند.


    موزه و یادمان در ۱۹۶۱ گشایش یافت. اتاق او تقریباً خالی است: یک میز، یک صندلی، یک بخاری دیواری و تفنگش
    بر دیوار — واژا شکارچی کارآزموده‌ای بود. کنار آن خورجینی آویخته است که خواهرش، مارتا، برایش بافته
    بود و او وسایلش را در آن حمل می‌کرد. مجموعهٔ موزه با دست‌نوشته‌ها، چاپ‌های نخست، عکس‌ها، اشیای مردم‌نگاری
    سده‌های نوزدهم و بیستم، و نقاشی‌ها و پیکره‌هایی که به افتخار او ساخته شده‌اند کامل می‌شود؛ در حیاط،
    ساختمان‌های جانبی، تنوری به سبک قدیم و آسیابی برپاست. هر سال روستا جشن سنتی خود، واژائوبا، را برگزار
    می‌کند.


    واژا در ۱۰ ژوئیهٔ ۱۹۱۵ در تفلیس درگذشت و در آرامگاه بزرگان متاتسمیندا به خاک سپرده شد. گورش در پایتخت
    است، اما جنگلی که در شعرهایش سخن می‌گوید درست آن سوی همین دروازه آغاز می‌شود.
  tip: >-
    مهم‌ترین نکته: وزارت فرهنگ گرجستان بازسازی کامل موزه را در سال‌های ۲۰۲۵ تا ۲۰۲۷ اعلام کرده است — کارهای
    ساختمانی، مرمت و نمایشگاهی تازه. هیچ منبعی تأیید نمی‌کند که موزه در طول کار باز می‌ماند یا نه؛ پس
    پیش از راه افتادن تلفن بزنید و هم‌زمان بهای ورودی را هم بپرسید. یک ساعت برای درون موزه کافی است. روستا
    کوچک است؛ روی کافه حساب نکنید و آب و خوراک همراه داشته باشید. پس از اکتبر برف و گل جادهٔ دره را دشوارتر
    می‌کند، پس بازهٔ معقول سفر از مه تا اکتبر است.
  route: >-
    از تفلیس از جادهٔ نظامی گرجستان (E117، S3) تا ژینوالی بروید، سپس به جادهٔ ژینوالی–باریساخو–شاتیلی
    (Sh26) بپیچید و حدود ۳۰ کیلومتر درهٔ آراگوی پشاوی را دنبال کنید. تا باریساخو نروید: انشعاب کوتاهی
    (Sh145) به سوی چارگالی جدا می‌شود — حدود سه کیلومتر دیگر تا روستا. روی هم ۸۹ کیلومتر و حدود دو ساعت
    راه است. جادهٔ دره جاهایی خراب است و تکهٔ آخر شنی و باریک، پس حتی در هوای خشک خودروی شاسی‌بلند (SUV)
    انتخاب بهتری است. در ژینوالی سوخت‌گیری کنید. موزه حیاط خودش را دارد و از جای پارک تا آن‌جا راهی هموار
    است.
he:
  name: בית־מוזיאון ואז׳ה־פשאוולה בצ׳רגלי
  short: >-
    הבית בן שני החדרים בכפר בפשאווי שבו הפך לוקה רזיקשווילי לוואז׳ה־פשאוולה: הרובה שלו, תרמיל האוכף שאחותו
    ארגה, וההרים שלו מעבר לחלון.
  body: >-
    **בבית חד־קומתי בן שני חדרים בצ׳רגלי חי המשורר שהגאורגים קוראים לו פשוט ואז׳ה — ומכאן צעדו הרי פשאווי
    אל תוך הספרות הגאורגית.**


    לוקה רזיקשווילי נולד בצ׳רגלי ב־14 ביולי 1861 למשפחה של אנשי דת. דוד אחד הנחיל לו את אהבת היער והציד,
    והדוד עצמו מצא מאוחר יותר את דרכו אל השירים. ב־1882 סיים את סמינר המורים בגורי, ב־1883–84 שמע הרצאות
    במשפטים כשומע חופשי באוניברסיטת סנקט פטרבורג, נותר בלי כסף וחזר להרים כדי ללמד גאורגית ולכתוב. יבולו
    הספרותי עצום: 36 פואמות אפיות וכ־400 שירים ליריים, ובהם "אלודה קטלאורי" (1888), "בחטריוני" (1892),
    "מארח ואורח" (1893) ו"אוכל הנחשים" (1901). ביצירות האלה היחיד מתריס נגד הקהילה, והטבע חי ומלא מתח.
    החוקר הבריטי דונלד רייפילד מדרג אותו "מבחינה איכותית בסדר גודל גדול יותר מכל סופר גאורגי אחר".


    המוזיאון ואתר ההנצחה נפתחו ב־1961. החדר שלו כמעט ריק: שולחן, כיסא, אח, והרובה שלו על הקיר — ואז׳ה
    היה צייד מיומן. לצידו תלוי תרמיל האוכף שארגה לו אחותו מרתה, ובו נשא את חפציו. האוסף כולל גם כתבי יד,
    מהדורות ראשונות, תצלומים, חפצים אתנוגרפיים מהמאות ה־19 וה־20, וציורים ופסלים שנוצרו לכבודו; בחצר עומדים
    מבני משק, תנור בסגנון הישן וטחנה. מדי שנה מקיים הכפר את החג המסורתי שלו, ואז׳אובה.


    ואז׳ה נפטר בטביליסי ב־10 ביולי 1915 ונקבר בפנתיאון במטאצמינדה. הקבר נמצא בבירה, אבל היער שמדבר בשיריו
    מתחיל ממש מעבר לשער הזה.
  tip: >-
    הכי חשוב: משרד התרבות של גאורגיה הכריז על שיקום מלא של המוזיאון בשנים 2025–2027 — עבודות בנייה, שימור
    ותצוגה חדשה. אף מקור אינו מאשר אם המוזיאון יישאר פתוח במהלך העבודות, לכן התקשרו לפני שאתם יוצאים לדרך,
    ובאותה הזדמנות בררו גם את דמי הכניסה. שעה מספיקה בפנים. הכפר קטן; אל תסמכו על בית קפה, והביאו מים
    ואוכל. אחרי אוקטובר השלג והבוץ מקשים על הדרך בעמק, כך שהחלון ההגיוני הוא מאי עד אוקטובר.
  route: >-
    מטביליסי סעו בדרך הצבאית הגאורגית (E117, S3) עד ז׳ינוואלי, ואז פנו לכביש ז׳ינוואלי–בריסאחו–שאטילי
    (Sh26) והמשיכו לאורך עמק האראגווי הפשאווי כ־30 ק"מ. אל תגיעו עד בריסאחו: שלוחה קצרה (Sh145) מסתעפת
    לצ׳רגלי — עוד כשלושה קילומטרים עד הכפר. בסך הכול 89 ק"מ וכשעתיים. כביש העמק משובש פה ושם, והקטע האחרון
    הוא דרך חצץ צרה, ולכן רכב SUV עדיף גם במזג אוויר יבש. תדלקו בז׳ינוואלי. למוזיאון יש חצר משלו, ומהחניה
    מגיעים אליו בהליכה במישור.
ar:
  name: البيت المتحف لفاجا-بشافيلا، تشارغالي
  short: >-
    البيت ذو الغرفتين في قرية من بشافي حيث صار لوكا رازيكاشفيلي فاجا-بشافيلا: بندقيته، والخُرج الذي نسجته
    أخته، وجباله خلف النافذة.
  body: >-
    **في بيت من طابق واحد وغرفتين في تشارغالي عاش الشاعر الذي يسمّيه الجورجيون ببساطة «فاجا» — ومن هنا
    دخلت جبال بشافي الأدب الجورجي.**


    وُلد لوكا رازيكاشفيلي في تشارغالي في 14 يوليو 1861 لأسرة من رجال الدين. غرس فيه أحد أعمامه حب الغابة
    والصيد، ثم وجد ذلك العمّ نفسه طريقه لاحقًا إلى قصائده. تخرّج في دار المعلمين في غوري عام 1882، وحضر
    دروس القانون مستمعًا في جامعة سانت بطرسبورغ في 1883–1884، ثم نفد ماله فعاد إلى الجبال ليعلّم اللغة
    الجورجية ويكتب. نتاجه هائل: 36 ملحمة شعرية ونحو 400 قصيدة غنائية، منها «ألودا كيتيلاوري» (1888) و«باختريوني»
    (1892) و«المضيف والضيف» (1893) و«آكل الأفاعي» (1901). في هذه الأعمال يتحدى الفردُ الجماعة، والطبيعة
    حيّة مشحونة بالتوتر. ويرى الباحث البريطاني دونالد رايفيلد أنه «من حيث النوعية أعظم قدرًا من أي كاتب
    جورجي آخر».


    افتُتح المتحف والنصب التذكاري عام 1961. غرفته شبه خالية: طاولة، وكرسي، ومدفأة، وبندقيته على الجدار
    — فقد كان فاجا صيادًا متمرّسًا. وإلى جانبها يتدلّى الخُرج الذي نسجته له أخته مارتا، وكان يحمل فيه
    أغراضه. وتكتمل المجموعة بالمخطوطات والطبعات الأولى والصور، وبقطع إثنوغرافية من القرنين التاسع عشر
    والعشرين، ولوحات ومنحوتات صُنعت تكريمًا له؛ وفي الفناء مبانٍ ملحقة، وفرن على الطراز القديم، وطاحونة.
    وفي كل عام تقيم القرية مهرجانها التقليدي «فاجاوبا».


    توفي فاجا في تبليسي في 10 يوليو 1915، ودُفن في مقبرة العظماء في متاتسميندا. القبر في العاصمة، لكن
    الغابة التي تتكلم في قصائده تبدأ خلف هذه البوابة مباشرة.
  tip: >-
    الأهم أولًا: أعلنت وزارة الثقافة الجورجية عن إعادة تأهيل شاملة للمتحف في 2025–2027 — أعمال بناء وترميم
    ومعرض جديد. لا يؤكد أي مصدر ما إذا كان المتحف سيبقى مفتوحًا أثناء الأعمال، فاتصل قبل أن تنطلق، واسأل
    في الاتصال نفسه عن رسم الدخول. تكفي ساعة في الداخل. القرية صغيرة؛ لا تعوّل على وجود مقهى، واحمل الماء
    والطعام. بعد أكتوبر يجعل الثلج والوحل طريق الوادي أصعب، فالفترة المعقولة من مايو إلى أكتوبر.
  route: >-
    من تبليسي اسلك الطريق العسكري الجورجي (E117، S3) حتى جينفالي، ثم انعطف إلى طريق جينفالي–بريساخو–شاتيلي
    (Sh26) وتابع وادي أراغفي البشافي نحو 30 كم. لا تصل إلى بريساخو: يتفرع طريق جانبي قصير (Sh145) نحو
    تشارغالي — قرابة ثلاثة كيلومترات أخرى حتى القرية. المسافة الإجمالية 89 كم ونحو ساعتين. طريق الوادي
    متضرر في بعض المواضع، والمقطع الأخير حصويّ ضيق، لذا فسيارة الدفع الرباعي (SUV) خيار أفضل حتى في الطقس
    الجاف. تزوّد بالوقود في جينفالي. للمتحف فناؤه الخاص، والمشي إليه من موقف السيارة على أرض مستوية.
