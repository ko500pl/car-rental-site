ka:
  name: წრომის ტაძარი
  short: >-
    626–634 წლებში ერისმთავარ სტეფანოზ II-ის დაკვეთით აგებული წრომი პირველი ქართული ტაძარია, რომლის გუმბათიც
    ოთხ თავისუფლად მდგარ ბურჯს ეყრდნობა.
  body: >-
    **წრომამდე ქართული გუმბათი კედლებს ეყრდნობოდა; წრომიდან მოყოლებული კი ოთხ თავისუფალ ბურჯზე დადგა —
    და ქართულ ხუროთმოძღვრებას უკან აღარ მოუხედავს.**


    სამხრეთ ფასადის ასომთავრული წარწერა ქტიტორს ასახელებს: ქართლის ერისმთავარი სტეფანოზ II, ადარნასეს
    ძე. ტაძარი 626–634 წლებით თარიღდება. მისი გეგმის საფუძველი ტოლმკლავა ჯვარია, სწორკუთხედში ჩაწერილი.
    შუაგულში ოთხი ცალკე მდგომი ბურჯი რვაწახნაგა ყელს ატარებს, კვადრატიდან რვაწახნაგზე გადასვლას კი ოთხი
    დიდი ტრომპი ახერხებს. ხელოვნებათმცოდნეები წრომს მცხეთის ჯვრის გვერდით აყენებენ — ორივე ქართული საეკლესიო
    ხუროთმოძღვრების ქვაკუთხედია. აღმოსავლეთ ფასადზე კიდევ ერთი სიახლე ჩანს: აფსიდის ორივე მხარეს ამოკვეთილი
    ღრმა სამკუთხა ნიშები, რომლებსაც ქართველი ოსტატები მერე საუკუნეების განმავლობაში გაიმეორებენ.


    ეს ადგილი ქვაზე ადრე იყო წმინდა. მემატიანის გადმოცემით, აქ უფრო ძველი ეკლესია იდგა და 457 წლის აგვისტოში
    სწორედ წრომში აწამეს რაჟდენი, რომელსაც ვახტანგ გორგასლის დროს ჰქონდა ქრისტიანობა მიღებული.


    1940 წლის 8 მაისის მიწისძვრამ გუმბათი და კამარების დიდი ნაწილი ჩამოაქცია, დასავლეთის კედელი კი გადახარა.
    რესტავრაცია 1949 წელს დაიწყო: 1959-ში კედელი გამართეს, 1974–1975 წლებში ტრომპები ხელახლა ამოიყვანეს
    და მათზე საცდელი ხის გუმბათი დადგეს. დღეს ტაძარი კვლავ მთლიანია — გუმბათის ყელითა და კრამიტის სახურავით.


    საკურთხევლის კონქს ოდესღაც VII საუკუნის მოზაიკა ამკობდა: დიდებით მოსილი ქრისტე და მისკენ მიმავალი
    ორი ფიგურა, როგორც ფიქრობენ, პეტრე და პავლე მოციქულები, ოქროს, წითელი, შავი და მკრთალი მწვანე კენჭების
    ფონზე. გადარჩენილი ფრაგმენტები 1930-იან წლებში თბილისში, საქართველოს ხელოვნების მუზეუმში გადაიტანეს;
    კონქში მხოლოდ მოსამზადებელი ნახატის კონტურები დარჩა.


    ამიტომ კედლებს დაუკვირდით: კარგად გათლილი ქვიშაქვა, აქა-იქ მუქი ნაცრისფერი და მოყვითალო პორფირიტით,
    ისეთი სწორი წყობით, თითქოს სახაზავით იყოს გავლებული. ყოველი ქართული გუმბათი, რომელსაც ამის შემდეგ
    ნახავთ, რაღაც ზომით ამ ოთხი ბურჯის მემკვიდრეა.
  tip: >-
    ორმოცდახუთი წუთიდან საათამდე საკმარისია. წრომი მოქმედი ტაძარია: მხრები და მუხლები დაფარული უნდა გქონდეთ,
    ქალებს თავსაფარი დასჭირდებათ. თუ კარი დაკეტილია, აღმოსავლეთით შემოუარეთ — სამკუთხა ნიშები და სამმაგი
    თაღედი აქ მთავარი გაკვეთილია და გასაღებს არ საჭიროებს. დილის მზე პირდაპირ ამ ფასადს ეცემა, ამიტომ
    ფოტოსთვის ადრე მოდით. სოფელში კაფე არ არის: სადილი ხაშურში ან გორში სჯობს, წყალი თან იქონიეთ. ახლოსაა
    სამწევრისი და ქინწვისიც — სამივე ერთად ადრეული ქართლის სრულ დღეს შეადგენს.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ, გორისა და ქარელის გავლით — დაახლოებით 115 კმ სწრაფი,
    ოთხზოლიანი გზა. ხაშურამდე ცოტა ადრე მაგისტრალიდან ძველ გზაზე (შ203) გომისკენ გადაუხვიეთ; გომიდან წრომამდე
    ბოლო სამიოდე კილომეტრი ადგილობრივი გზა სამხრეთით მიდის; ტაძარი სოფლის შუაგულში, მტკვრის მარჯვენა ნაპირზე
    დგას. სულ დაახლოებით 122 კმ და საათი და ორმოცი წუთი. ასფალტი ბოლომდეა, თუმცა სოფლის გზა ვიწროა, ორიოდე
    ბრმა მოსახვევით. საწვავი გორსა და ხაშურშია. მანქანა უფასოდ დატოვეთ ეკლესიის გალავანთან; ეკონომ-კლასის
    ავტომობილი სავსებით საკმარისია.
en:
  name: Tsromi Church
  short: >-
    Built in 626–634 for Prince Stepanoz II, Tsromi was the first Georgian church to raise its dome on
    four free-standing piers.
  body: >-
    **Before Tsromi, Georgian domes leaned on walls; after it, they stood on four free piers, and the
    country's churches never went back.**


    An inscription on the south façade names the patron, Stepanoz II, prince of Kartli and son of Adarnase,
    and the church is dated to 626–634. The plan is an equal-armed cross drawn inside a rectangle. At
    its centre four free-standing piers carry an octagonal drum, and four great squinches turn the square
    into the octagon. Art historians pair it with Jvari at Mtskheta as a founding monument of Georgian
    church building. The east façade shows another first: two deep triangular niches flanking the apse,
    a device builders would repeat for centuries.


    The ground was holy before the stone. The Georgian chronicle tradition says an older church stood
    here, and that in August 457 Razhden, who had become a Christian in the days of King Vakhtang Gorgasali,
    was martyred at Tsromi.


    On 8 May 1940 an earthquake brought down the dome and much of the vaulting, and tilted the west wall.
    Restorers started in 1949, pulled the wall upright in 1959 and in 1974–75 rebuilt the squinches under
    a trial timber dome. Today the church stands whole again under its drum and tiled roof.


    The apse once held a seventh-century mosaic: Christ in glory, approached by two figures read as Peter
    and Paul, on a ground of gold tesserae with red, black and pale green stone. The surviving fragments
    went to the Art Museum of Georgia in Tbilisi in the 1930s; in the conch only the lines of the preparatory
    drawing remain.


    So read the walls instead: dressed sandstone, flecked with dark grey and yellowish porphyrite, laid
    in courses so straight they look ruled. Every Georgian dome you meet after this is, in some measure,
    an heir of these four piers.
  tip: >-
    Allow 45 minutes to an hour. Tsromi is a working church: cover shoulders and knees, and women will
    want a headscarf. If the door is shut, walk round to the east end — the triangular niches and the
    triple arcade are the real lesson here and need no key. Morning sun falls straight on that façade,
    so come early for photographs. The village has no café; eat in Khashuri or Gori and carry water. Samtsevrisi
    and Kintsvisi are both close, and the three together make a fine day of early Kartli.
  route: >-
    From Tbilisi take the S1 (E60) motorway west past Gori and Kareli, about 115 km of fast dual carriageway.
    Just short of Khashuri leave the motorway for Gomi on the old road (Sh203); from Gomi a local road
    runs south for the last three kilometres or so into Tsromi; the church stands in the middle of the
    village on the right bank of the Mtkvari. Around 122 km and 1 hour 40 minutes in all. Asphalt the
    whole way, though the village lane is narrow with a couple of blind bends. Fuel in Gori or Khashuri.
    Free parking by the churchyard wall; an economy car is all you need.
ru:
  name: Церковь Цроми
  short: >-
    Построенная в 626–634 годах для князя Степаноза II, церковь Цроми первой в Грузии подняла купол на
    четыре свободно стоящих столба.
  body: >-
    **До Цроми грузинские купола опирались на стены; после неё они встали на четыре свободных столба —
    и церкви страны уже никогда не вернулись к прежнему.**


    Надпись на южном фасаде называет заказчика — Степаноза II, князя Картли, сына Адарнасе; церковь датируют
    626–634 годами. План — равноконечный крест, вписанный в прямоугольник. В центре четыре свободно стоящих
    столба несут восьмигранный барабан, а четыре больших тромпа переводят квадрат в восьмигранник. Искусствоведы
    ставят Цроми рядом с мцхетским Джвари как основополагающий памятник грузинского храмового зодчества.
    Восточный фасад показывает ещё одно новшество: две глубокие треугольные ниши по сторонам апсиды —
    приём, который зодчие будут повторять веками.


    Место было святым ещё до камня. Грузинская летописная традиция говорит, что здесь стояла более древняя
    церковь и что в августе 457 года в Цроми принял мученическую смерть Раждени, обратившийся в христианство
    во времена царя Вахтанга Горгасали.


    8 мая 1940 года землетрясение обрушило купол и большую часть сводов и накренило западную стену. Реставраторы
    взялись за работу в 1949 году, в 1959-м выпрямили стену, а в 1974–1975 годах восстановили тромпы под
    пробным деревянным куполом. Сегодня церковь вновь стоит целой — под барабаном и черепичной кровлей.


    В апсиде когда-то была мозаика VII века: Христос во славе, к которому приближаются две фигуры, толкуемые
    как Пётр и Павел, на фоне золотой смальты с красным, чёрным и бледно-зелёным камнем. Уцелевшие фрагменты
    в 1930-х годах перевезли в Музей искусств Грузии в Тбилиси; в конхе остались лишь линии подготовительного
    рисунка.


    Так что читайте стены: тёсаный песчаник вперемежку с тёмно-серым и желтоватым порфиритом, уложенный
    рядами настолько ровными, будто их расчертили по линейке. Каждый грузинский купол, который встретится
    вам после этого, — в какой-то мере наследник этих четырёх столбов.
  tip: >-
    Заложите от 45 минут до часа. Цроми — действующая церковь: плечи и колени должны быть закрыты, женщинам
    понадобится платок. Если дверь заперта, обойдите храм к восточному фасаду: треугольные ниши и тройная
    аркада — главный урок этого места, и ключ для них не нужен. Утреннее солнце падает прямо на этот фасад,
    так что для фотографий приезжайте пораньше. Кафе в селе нет: поешьте в Хашури или Гори и возьмите
    с собой воду. Самцевриси и Кинцвиси совсем рядом, и все три храма вместе складываются в прекрасный
    день, посвящённый ранней Картли.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад мимо Гори и Карели — около 115 км быстрой дороги с
    разделёнными полосами. Не доезжая Хашури, сверните с магистрали на старую дорогу (Sh203) к Гоми; от
    Гоми последние три с небольшим километра до Цроми на юг ведёт местная дорога; церковь стоит посреди
    села, на правом берегу Куры. Всего около 122 км и 1 час 40 минут. Асфальт на всём пути, хотя сельская
    улица узкая, с парой слепых поворотов. Заправка — в Гори или Хашури. Бесплатная парковка у ограды
    церковного двора; хватит машины эконом-класса.
fa:
  name: کلیسای تسرومی
  short: >-
    کلیسای تسرومی، ساخته‌شده در سال‌های ۶۲۶ تا ۶۳۴ برای شاهزاده استپانوز دوم، نخستین کلیسای گرجی بود که
    گنبدش را بر چهار پایهٔ آزاد برافراشت.
  body: >-
    **پیش از تسرومی، گنبدهای گرجی بر دیوارها تکیه داشتند؛ پس از آن، بر چهار پایهٔ آزاد ایستادند و کلیساهای
    این سرزمین دیگر هرگز به راه پیشین بازنگشتند.**


    کتیبه‌ای بر نمای جنوبی بانی را نام می‌برد: استپانوز دوم، فرمانروای کارتلی و پسر آدارناسه؛ و کلیسا
    را به سال‌های ۶۲۶ تا ۶۳۴ تاریخ‌گذاری می‌کنند. نقشهٔ آن صلیبی با بازوان برابر است که درون مستطیلی جای
    گرفته. در مرکز، چهار پایهٔ آزاد ساقهٔ هشت‌ضلعی گنبد را بر دوش دارند و چهار سکنج بزرگ مربع را به هشت‌ضلعی
    بدل می‌کنند. تاریخ‌نگاران هنر تسرومی را در کنار جواری در متسختا از بناهای بنیادگذار معماری کلیسایی
    گرجستان می‌شمارند. نمای شرقی نوآوری دیگری را هم نشان می‌دهد: دو طاقچهٔ سه‌گوش ژرف در دو سوی آبسید،
    شگردی که سازندگان سده‌ها تکرارش کردند.


    این زمین پیش از سنگ مقدس بود. سنت وقایع‌نگاری گرجی می‌گوید پیش‌تر کلیسایی کهن‌تر اینجا بوده و در اوت
    ۴۵۷، راژدن، که در روزگار شاه واختانگ گورگاسالی مسیحی شده بود، در تسرومی به شهادت رسید.


    در ۸ مه ۱۹۴۰ زمین‌لرزه‌ای گنبد و بخش بزرگی از طاق‌ها را فرو ریخت و دیوار غربی را کج کرد. مرمت‌گران
    در ۱۹۴۹ دست به کار شدند، در ۱۹۵۹ دیوار را راست کردند و در ۱۹۷۴ تا ۱۹۷۵ سکنج‌ها را زیر گنبدی چوبی و
    آزمایشی از نو ساختند. امروز کلیسا بار دیگر با ساقهٔ گنبد و بام سفالی‌اش یکپارچه برپاست.


    آبسید روزگاری موزاییکی از سدهٔ هفتم داشت: مسیح در جلال، که دو پیکر به سویش پیش می‌آیند و آنان را پطرس
    و پولس می‌دانند، بر زمینه‌ای از تکه‌های زرین با سنگ‌های سرخ، سیاه و سبز کم‌رنگ. پاره‌های بازمانده
    در دههٔ ۱۹۳۰ به موزهٔ هنر گرجستان در تفلیس برده شد؛ در نیم‌گنبد آبسید تنها خطوط طرح مقدماتی مانده
    است.


    پس به جای آن دیوارها را بخوانید: ماسه‌سنگ تراش‌خورده، آمیخته با پورفیریت خاکستری تیره و زردفام، که
    در رج‌هایی چنان راست چیده شده که گویی با خط‌کش کشیده‌اند. هر گنبد گرجی که پس از این ببینید، به نوعی
    وارث همین چهار پایه است.
  tip: >-
    ۴۵ دقیقه تا یک ساعت وقت بگذارید. تسرومی کلیسایی فعال است: شانه‌ها و زانوها را بپوشانید و بانوان روسری
    همراه داشته باشند. اگر در بسته بود، ساختمان را دور بزنید و به نمای شرقی بروید: طاقچه‌های سه‌گوش و
    طاق‌نمای سه‌دهانه درس اصلی اینجا هستند و کلید نمی‌خواهند. آفتاب صبح مستقیم بر همین نما می‌تابد، پس
    برای عکاسی زود بیایید. روستا کافه ندارد؛ در خاشوری یا گوری غذا بخورید و آب همراه ببرید. سامتسوریسی
    و کینتسویسی هر دو نزدیک‌اند و این سه با هم روزی دلپذیر در کارتلی سده‌های نخستین می‌سازند.
  route: >-
    از تفلیس آزادراه S1 (E60) را به سوی غرب، از کنار گوری و کارلی، بگیرید: حدود ۱۱۵ کیلومتر بزرگراه تندرو
    با مسیرهای جدا. کمی پیش از خاشوری از آزادراه خارج شوید و از جادهٔ قدیمی (Sh203) به گومی بروید؛ از
    گومی جاده‌ای محلی حدود سه کیلومتر پایانی را به سوی جنوب تا تسرومی می‌پیماید؛ کلیسا در میانهٔ روستا
    و بر کرانهٔ راست متکواری ایستاده است. روی‌هم حدود ۱۲۲ کیلومتر و ۱ ساعت و ۴۰ دقیقه. همهٔ راه آسفالت
    است، هرچند کوچهٔ روستا باریک است و چند پیچ کور دارد. سوخت را در گوری یا خاشوری بزنید. کنار دیوار حیاط
    کلیسا پارکینگ رایگان هست؛ یک خودروی اقتصادی کافی است.
he:
  name: כנסיית צרומי
  short: >-
    צרומי, שנבנתה בשנים 626–634 עבור הנסיך סטפנוז השני, הייתה הכנסייה הגאורגית הראשונה שהרימה את כיפתה
    על ארבעה עמודים חופשיים.
  body: >-
    **לפני צרומי נשענו הכיפות הגאורגיות על קירות; אחריה הן ניצבו על ארבעה עמודים חופשיים, וכנסיות גאורגיה
    לא חזרו עוד לדרך הישנה.**


    כתובת בחזית הדרומית נוקבת בשם המזמין, סטפנוז השני, נסיך קרתלי ובנו של אדרנסה, והכנסייה מתוארכת לשנים
    626–634. התוכנית היא צלב שווה-זרועות החסום בתוך מלבן. במרכזה נושאים ארבעה עמודים חופשיים תוף מתומן,
    וארבעה טרומפים גדולים הופכים את הריבוע למתומן. היסטוריונים של האמנות מציבים אותה לצד ג׳ווארי שבמצחתה
    כמונומנט מכונן של בניית הכנסיות הגאורגית. החזית המזרחית מציגה חידוש נוסף: שתי גומחות משולשות עמוקות
    משני צדי האפסיס, פתרון שהבונים חזרו עליו במשך מאות שנים.


    המקום היה קדוש עוד לפני האבן. מסורת הכרוניקות הגאורגית מספרת שעמדה כאן כנסייה עתיקה יותר, ושבאוגוסט
    457 מת בצרומי מות קדושים ראז׳דן, שהתנצר בימי המלך וחטנג גורגסלי.


    ב-8 במאי 1940 מוטטה רעידת אדמה את הכיפה ואת רוב הקמרונות, והטתה את הקיר המערבי. המשחזרים החלו לעבוד
    ב-1949, יישרו את הקיר ב-1959, וב-1974–1975 בנו מחדש את הטרומפים מתחת לכיפת עץ ניסיונית. כיום הכנסייה
    עומדת שוב שלמה, תחת התוף וגג הרעפים.


    באפסיס היה פעם פסיפס מהמאה השביעית: ישו בהדרו, ואליו מתקרבות שתי דמויות שמזוהות כפטרוס ופאולוס, על
    רקע של אבני פסיפס מוזהבות עם אבן אדומה, שחורה וירוקה-חיוורת. השרידים שנותרו הועברו בשנות ה-30 של המאה
    ה-20 למוזיאון האמנות של גאורגיה בטביליסי; בקונכיית האפסיס נותרו רק קווי רישום ההכנה.


    אז קראו במקום זאת את הקירות: אבן חול מסותתת, משולבת בפורפיריט אפור-כהה וצהבהב, מונחת בנדבכים ישרים
    כל כך, כאילו שורטטו בסרגל. כל כיפה גאורגית שתפגשו מכאן והלאה היא, במידה כלשהי, יורשת של ארבעת העמודים
    האלה.
  tip: >-
    הקדישו 45 דקות עד שעה. צרומי היא כנסייה פעילה: כסו כתפיים וברכיים, ונשים יזדקקו לכיסוי ראש. אם הדלת
    נעולה, הקיפו את המבנה עד לצדו המזרחי: הגומחות המשולשות והארקדה בת שלוש הקשתות הן השיעור האמיתי כאן,
    ואין צורך במפתח כדי לראות אותן. שמש הבוקר מאירה ישירות את החזית הזאת, לכן בואו מוקדם לצילומים. בכפר
    אין בית קפה; אכלו בחשורי או בגורי והביאו מים. סמצבריסי וקינצוויסי קרובות מאוד, ושלושתן יחד הן יום
    נהדר בקרתלי הקדומה.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60), על פני גורי וקארלי – כ-115 ק״מ של כביש מהיר ומופרד. מעט לפני
    חשורי צאו מהכביש המהיר אל הכביש הישן (Sh203) לכיוון גומי; מגומי מוביל כביש מקומי דרומה, כשלושה קילומטרים
    אחרונים, עד צרומי; הכנסייה עומדת במרכז הכפר, על הגדה הימנית של המטקווארי. בסך הכול כ-122 ק״מ ושעה
    ו-40 דקות. אספלט לאורך כל הדרך, אם כי הדרך בכפר צרה ויש בה כמה עיקולים עיוורים. דלק בגורי או בחשורי.
    חניה חינם ליד חומת חצר הכנסייה; רכב אקונומי מספיק לגמרי.
ar:
  name: كنيسة تسرومي
  short: >-
    شُيّدت كنيسة تسرومي بين عامَي 626 و634 للأمير ستيبانوز الثاني، وكانت أول كنيسة جورجية ترفع قبّتها
    على أربع دعامات قائمة بذاتها.
  body: >-
    **قبل تسرومي كانت القباب الجورجية تستند إلى الجدران؛ وبعدها قامت على أربع دعامات حرّة، ولم تعد كنائس
    البلاد إلى الطريقة القديمة قط.**


    يذكر نقشٌ على الواجهة الجنوبية اسم المُنشئ، ستيبانوز الثاني، أمير كارتلي وابن أدارناسي، وتُؤرَّخ الكنيسة
    بالأعوام 626–634. مخطّطها صليب متساوي الأذرع مرسوم داخل مستطيل. وفي وسطه تحمل أربع دعامات قائمة بذاتها
    طنبورًا مثمّنًا، فيما تحوّل أربع حنايا ركنية كبيرة المربّعَ إلى مثمّن. ويقرن مؤرخو الفن بينها وبين
    جفاري في متسخيتا بوصفهما من الآثار المؤسِّسة لعمارة الكنائس الجورجية. وتكشف الواجهة الشرقية عن سبق
    آخر: كوّتان مثلثتان عميقتان على جانبي الحنية، وهو أسلوب ظلّ البنّاؤون يكرّرونه قرونًا.


    كان المكان مقدّسًا قبل الحجر. إذ يروي التقليد الجورجي في السجلات أن كنيسة أقدم قامت هنا، وأنّ راجدن،
    الذي اعتنق المسيحية في أيام الملك فاختانغ غورغاسالي، استُشهد في تسرومي في أغسطس عام 457.


    في 8 مايو 1940 أسقط زلزالٌ القبة ومعظم الأقبية، وأمال الجدار الغربي. بدأ المرمّمون العمل عام 1949،
    وأعادوا الجدار إلى استقامته عام 1959، ثم أعادوا في 1974–1975 بناء الحنايا الركنية تحت قبة خشبية تجريبية.
    واليوم تقف الكنيسة كاملة من جديد تحت طنبورها وسقفها القرميدي.


    كانت الحنية تضمّ ذات يوم فسيفساء من القرن السابع: المسيح في مجده، تتقدّم نحوه هيئتان تُفسَّران على
    أنهما بطرس وبولس، على أرضية من الفسيفساء المذهّبة مع حجارة حمراء وسوداء وخضراء باهتة. نُقلت الشذرات
    الباقية في ثلاثينيات القرن العشرين إلى متحف الفنون في جورجيا بتبليسي؛ ولم يبقَ في نصف قبة الحنية سوى
    خطوط الرسم التمهيدي.


    فاقرأ الجدران إذن: حجر رملي مشذّب، تتخلله حجارة البورفيريت الرمادية الداكنة والمصفرّة، مرصوف في مداميك
    مستقيمة كأنها خُطّت بالمسطرة. وكل قبة جورجية ستلقاها بعد هذا هي، على نحو ما، وريثة هذه الدعامات الأربع.
  tip: >-
    خصّص من 45 دقيقة إلى ساعة. تسرومي كنيسة تُقام فيها الصلوات: غطِّ الكتفين والركبتين، ويُستحسن أن تضع
    النساء غطاءً للرأس. إن وجدت الباب مغلقًا فدُر حول المبنى إلى طرفه الشرقي: فالكوّتان المثلثتان والرواق
    الثلاثي العقود هي الدرس الحقيقي هنا، ولا تحتاج إلى مفتاح. تسقط شمس الصباح مباشرة على تلك الواجهة،
    فتعالَ باكرًا لالتقاط الصور. لا مقهى في القرية؛ تناول طعامك في خاشوري أو غوري واحمل الماء. سامتسفريسي
    وكينتسفيسي قريبتان كلتاهما، والثلاث معًا تصنع يومًا رائعًا في كارتلي المبكرة.
  route: >-
    من تبليسي اسلك الطريق السريع S1 (E60) غربًا مرورًا بغوري وكاريلي، نحو 115 كم من طريق سريع مزدوج. قبيل
    خاشوري غادر الطريق السريع إلى الطريق القديم (Sh203) نحو غومي؛ ومن غومي يتجه طريق محلي جنوبًا في الكيلومترات
    الثلاثة الأخيرة تقريبًا حتى تسرومي؛ تقف الكنيسة في وسط القرية على الضفة اليمنى لنهر متكفاري. المجموع
    نحو 122 كم وساعة و40 دقيقة. الطريق معبّد بالكامل، وإن كان زقاق القرية ضيقًا وفيه منعطفان أو ثلاثة
    محجوبة الرؤية. الوقود في غوري أو خاشوري. موقف مجاني بجانب سور فناء الكنيسة؛ وتكفي سيارة اقتصادية.
