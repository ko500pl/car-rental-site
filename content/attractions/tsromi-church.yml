ka:
  name: წრომის ტაძარი
  short: >-
    626-634 წლების ტაძარი ხაშურთან, ქართული არქიტექტურის საკვანძო ძეგლი, დღეს ნაწილობრივ დანგრეული.
  body: >-
    **წრომი იმ შენობათა რიცხვშია, რომლებმაც ქართული ხუროთმოძღვრების მიმართულება შეცვალეს.** ტაძარი
    626-634 წლებში ააგო სტეფანოზ ერისმთავარმა და აქ პირველად ქართულ პრაქტიკაში გუმბათი ოთხ თავისუფლად
    მდგარ ბურჯს დაეყრდნო, კედლების ნაცვლად. ეს ტექნიკური ნაბიჯი შემდეგი ხუთი საუკუნის ქართული ეკლესიების
    გეგმას განსაზღვრავს — მათ შორის სამთავისისა და ალავერდისას.


    შენობა დღეს ნახევრად ნანგრევია და ამის ცოდნა წინასწარ ჯობია. 1940 წლის მიწისძვრამ გუმბათი ჩამოაქცია;
    კედლების დიდი ნაწილი, აფსიდი და ბურჯები დგას, სახურავი კი აღარ არსებობს. სივრცე ღიაა ცისკენ, იატაკზე
    ბალახია, ქვის ბლოკები კი დაწყობილია გვერდზე. კონსერვაციის სამუშაოები პერიოდულად მიმდინარეობს.


    ტაძარს ოდესღაც აფსიდში მოზაიკა ჰქონდა — ქრისტე მოციქულებს შორის, ადრეული ბიზანტიური ტრადიციის იშვიათი
    ნიმუში კავკასიაში. მოზაიკის შემორჩენილი ფრაგმენტები საქართველოს ეროვნულ მუზეუმშია თბილისში; ადგილზე
    მხოლოდ ცარიელი აფსიდი და მისი მრუდე ზედაპირია.


    რაც სანახავია: ქვის სიზუსტე. ბლოკები ისეა გათლილი და მიდგმული, რომ ნაკერი თითქმის არ ჩანს — VII
    საუკუნის ხელოსნობა, რომელიც მოგვიანებით ხშირად უფრო უხეშია. ბორცვიდან ხედი ლიხის ქედისკენ იშლება. ეს
    ადგილი მათთვისაა, ვისაც არქიტექტურა და ისტორია აინტერესებს; ვინც მთლიან, მოხატულ ტაძარს ეძებს,
    სხვაგან უნდა წავიდეს.
  tip: >-
    ორმოცდაათი წუთი საკმარისია. ნანგრევებში სიარული ფრთხილად სჭირდება: ბალახში ჩამოცვენილი ქვებია და
    ნიადაგი არათანაბარია, ღია ფეხსაცმელი არ გამოდგება. ჩრდილი თითქმის არ არის, ზაფხულში შუადღისას ცხელა.
    სოფელში მაღაზია და კაფე არ არის — ყველაფერი ხაშურში იყიდეთ. თუ დროებითი შემოღობვა ან სამშენებლო
    ტექნიკა დახვდათ, კონსერვაციის სამუშაოები მიმდინარეობს და შიგნით შესვლა შეიძლება აკრძალული იყოს.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ გორზე გავლით ხაშურამდე — დაახლოებით 115 კმ ავტობანით. ხაშურამდე ცოტა
    ადრე ჩრდილოეთით, ძველ გორი-ქარელის გზაზე გაუხვევთ და წრომის მიმართულებით გაჰყვებით. სულ 122 კმ,
    დაახლოებით საათი და ორმოცი წუთი. ბოლომდე ასფალტია, სოფლის შესასვლელი ვიწროა. საწვავი გორსა და ხაშურში
    არის. ტაძართან პატარა მოედანზე გაჩერდით; ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Tsromi Church
  short: >-
    A church of 626-634 near Khashuri, a pivotal monument of Georgian architecture and today a partial
    ruin.
  body: >-
    **Tsromi is one of the buildings that changed the direction of Georgian architecture.** It was raised
    between 626 and 634 by the prince Stepanoz, and it is the first Georgian church in which the dome
    rests on four free-standing piers rather than on the walls. That structural move set the plan for
    Georgian churches for the next five hundred years, Samtavisi and Alaverdi among them.


    It is important to know before you go that the building is now half a ruin. The earthquake of 1940
    brought the dome down. Much of the walling, the apse and the piers still stand, but there is no roof.
    The interior is open to the sky, grass grows on the floor, and cut blocks lie stacked to one side.
    Consolidation work comes and goes.


    The church once had a mosaic in the apse — Christ between the apostles, a rare survival of early
    Byzantine practice in the Caucasus. The surviving fragments are in the Georgian National Museum in
    Tbilisi; on site you see only the empty curve of the apse where they sat.


    What is worth the drive is the stone itself. The blocks are cut and set so precisely that the joints
    almost disappear, seventh-century masonry of a quality that later centuries often failed to match.
    From the low rise the view opens west towards the Likhi range. This is a place for people interested
    in architecture and history; anyone hoping for a complete, painted church should go elsewhere.
  tip: >-
    Fifty minutes is enough. Walking among the ruins needs care: fallen stones hide in the grass and the
    ground is uneven, so open shoes are a bad idea. There is almost no shade and midday in summer is hot.
    The village has no shop or cafe, so buy everything in Khashuri. If you find temporary fencing or
    machinery on site, conservation work is under way and the interior may be closed off.
  route: >-
    Head west from Tbilisi on the E60 past Gori towards Khashuri, about 115 km of dual carriageway.
    Shortly before Khashuri turn north onto the old Gori-Kareli road and follow signs for Tsromi. One
    hundred and twenty-two kilometres in all, about an hour and forty minutes. Asphalt the whole way,
    though the village approach is narrow. Fuel is available in Gori and Khashuri. Park on the small open
    space beside the church; an economy car is entirely sufficient.
ru:
  name: Храм Цроми
  short: >-
    Храм 626-634 годов близ Хашури, поворотный памятник грузинской архитектуры, сегодня наполовину руина.
  body: >-
    **Цроми — одно из зданий, изменивших направление грузинской архитектуры.** Он возведён между 626 и
    634 годами эриставом Степанозом и стал первым грузинским храмом, где купол опирается на четыре
    свободно стоящих столба, а не на стены. Этот конструктивный ход задал план грузинских церквей на пять
    столетий вперёд — включая Самтависи и Алаверди.


    Стоит знать заранее: сегодня здание наполовину разрушено. Землетрясение 1940 года обрушило купол.
    Большая часть стен, апсида и столбы стоят, но кровли нет. Интерьер открыт небу, на полу растёт трава,
    тёсаные блоки сложены в стороне. Работы по консервации то ведутся, то останавливаются.


    В апсиде когда-то была мозаика — Христос между апостолами, редкий пример ранневизантийской практики
    на Кавказе. Уцелевшие фрагменты хранятся в Национальном музее Грузии в Тбилиси; на месте остаётся
    только пустая вогнутая поверхность апсиды.


    Ради чего ехать — ради самого камня. Блоки вытесаны и подогнаны так, что швы почти исчезают: работа
    VII века такого качества, какое в более поздние века удавалось далеко не всегда. С невысокого холма
    открывается вид на запад, к Лихскому хребту. Это место для тех, кому интересны архитектура и история;
    тому, кто ищет целый расписанный храм, лучше поехать в другое место.
  tip: >-
    Пятидесяти минут достаточно. Ходить среди руин нужно осторожно: в траве прячутся упавшие камни, земля
    неровная, открытая обувь тут ни к чему. Тени почти нет, летом в полдень жарко. В селе нет ни
    магазина, ни кафе — покупайте всё в Хашури. Если увидите временное ограждение или технику, значит
    идут работы, и внутрь могут не пустить.
  route: >-
    Из Тбилиси на запад по E60 мимо Гори в сторону Хашури — около 115 км по скоростной дороге. Незадолго
    до Хашури поверните на север, на старую дорогу Гори — Карели, и следуйте указателям на Цроми. Всего
    122 км, примерно час сорок. Асфальт до конца, хотя въезд в село узкий. Заправки есть в Гори и Хашури.
    Оставьте машину на небольшой площадке у храма; машины эконом-класса вполне достаточно.
fa:
  name: کلیسای تسرومی
  short: >-
    کلیسایی از سال‌های ۶۲۶ تا ۶۳۴ نزدیک خاشوری، بنایی سرنوشت‌ساز در معماری گرجستان و امروز نیمه‌ویران.
  body: >-
    **تسرومی از بناهایی است که مسیر معماری گرجستان را عوض کرد.** آن را میان سال‌های ۶۲۶ و ۶۳۴ استپانوز
    امیر برپا کرد و نخستین کلیسای گرجی است که در آن گنبد بر چهار جرز آزادایستا تکیه دارد، نه بر دیوارها.
    همین گام سازه‌ای نقشهٔ کلیساهای گرجی را برای پانصد سال بعد تعیین کرد، از جمله سامتاویسی و آلاوردی.


    پیش از رفتن باید بدانید که بنا اکنون نیمه‌ویران است. زلزلهٔ ۱۹۴۰ گنبد را فرو ریخت. بخش بزرگی از
    دیوارها، محراب و جرزها هنوز برپاست، اما سقفی در کار نیست. درون بنا رو به آسمان باز است، بر کف علف
    روییده و سنگ‌های تراشیده کناری روی هم چیده شده‌اند. کارهای استحکام‌بخشی گاه آغاز و گاه متوقف می‌شود.


    کلیسا زمانی در محراب موزاییکی داشت: مسیح میان حواریان، نمونه‌ای کمیاب از سنت بیزانسی متقدم در قفقاز.
    پاره‌های بازمانده در موزهٔ ملی گرجستان در تفلیس نگهداری می‌شود؛ در محل تنها انحنای خالی محراب دیده
    می‌شود.


    آنچه ارزش این راه را دارد خودِ سنگ است. قطعه‌ها چنان تراشیده و کنار هم نشسته‌اند که درزها تقریباً
    ناپدید می‌شوند؛ سنگ‌کاری سدهٔ هفتم با کیفیتی که سده‌های بعد اغلب به آن نرسیدند. از این بلندی کوتاه،
    چشم‌انداز به سوی غرب و رشتهٔ لیخی باز می‌شود. اینجا جای کسانی است که به معماری و تاریخ علاقه دارند؛
    هر که کلیسایی کامل و نقاشی‌شده می‌خواهد باید جای دیگری برود.
  tip: >-
    پنجاه دقیقه کافی است. راه رفتن میان ویرانه‌ها احتیاط می‌خواهد: سنگ‌های افتاده در علف پنهان‌اند و زمین
    ناهموار است، پس کفش باز مناسب نیست. سایه‌ای تقریباً نیست و ظهر تابستان گرم است. روستا مغازه و کافه
    ندارد، پس همه‌چیز را در خاشوری بخرید. اگر حصار موقت یا ماشین‌آلات دیدید، کار مرمت در جریان است و ممکن
    است ورود به داخل بسته باشد.
  route: >-
    از تفلیس به سمت غرب روی E60 از کنار گوری به سوی خاشوری، حدود ۱۱۵ کیلومتر جادهٔ دوبانده. کمی پیش از
    خاشوری به شمال و به جادهٔ قدیم گوری-کارلی بپیچید و نشانه‌های تسرومی را دنبال کنید. روی‌هم ۱۲۲
    کیلومتر، نزدیک یک ساعت و چهل دقیقه. تا انتها آسفالت است، هرچند ورودی روستا باریک است. سوخت در گوری و
    خاشوری هست. خودرو را در محوطهٔ کوچک کنار کلیسا بگذارید؛ خودروی اقتصادی کاملاً کافی است.
he:
  name: כנסיית צרומי
  short: >-
    כנסייה מן השנים 626-634 ליד חשורי, אתר מפתח באדריכלות הגאורגית וכיום חורבה חלקית.
  body: >-
    **צרומי היא אחד המבנים ששינו את כיוון האדריכלות הגאורגית.** היא הוקמה בין 626 ל-634 בידי הנסיך
    סטפנוז, והיא הכנסייה הגאורגית הראשונה שבה הכיפה נשענת על ארבעה עמודים חופשיים ולא על הקירות. המהלך
    המבני הזה קבע את תוכנית הכנסיות הגאורגיות לחמש מאות השנים הבאות, ובהן סמטאוויסי ואלאוורדי.


    כדאי לדעת מראש שהמבנה כיום חורבה למחצה. רעידת האדמה של 1940 הפילה את הכיפה. חלק גדול מן הקירות,
    האפסיס והעמודים עדיין עומדים, אך אין גג. הפנים פתוח לשמיים, על הרצפה גדל עשב, ואבני גזית ערוכות
    בערימה בצד. עבודות שימור מתחילות ונפסקות לסירוגין.


    בכנסייה היה פעם פסיפס באפסיס: ישו בין השליחים, שריד נדיר של מנהג ביזנטי קדום בקווקז. השברים שנותרו
    שמורים במוזיאון הלאומי הגאורגי בטביליסי; באתר עצמו רואים רק את קימור האפסיס הריק.


    מה שמצדיק את הנסיעה הוא האבן עצמה. הבלוקים חצובים ומונחים בדיוק כזה שהמישקים כמעט נעלמים, בנאות מן
    המאה השביעית באיכות שמאות מאוחרות יותר לא תמיד השיגו. מן הגבעה הנמוכה נפתח נוף מערבה אל רכס ליחי. זהו
    מקום למי שמתעניין באדריכלות ובהיסטוריה; מי שמחפש כנסייה שלמה ומצוירת מוטב שילך למקום אחר.
  tip: >-
    חמישים דקות מספיקות. ההליכה בין החורבות דורשת זהירות: אבנים שנפלו מסתתרות בעשב והקרקע לא אחידה, לכן
    נעליים פתוחות אינן רעיון טוב. אין כמעט צל וצהרי הקיץ חמים. בכפר אין חנות או בית קפה, לכן קנו הכול
    בחשורי. אם תמצאו גדר זמנית או כלים כבדים באתר, סימן שמתבצעות עבודות שימור והכניסה פנימה עשויה להיות
    חסומה.
  route: >-
    צאו מטביליסי מערבה בכביש E60 דרך גורי לכיוון חשורי, כ-115 ק״מ של כביש מהיר. מעט לפני חשורי פנו צפונה
    לדרך הישנה גורי-קארלי ועקבו אחרי השילוט לצרומי. 122 ק״מ בסך הכול, כשעה וארבעים. אספלט לכל האורך, אם
    כי הכניסה לכפר צרה. דלק יש בגורי ובחשורי. החנו במגרש הקטן שליד הכנסייה; רכב חסכוני מספיק לחלוטין.
ar:
  name: كنيسة تسرومي
  short: >-
    كنيسة من سنوات 626-634 قرب خاشوري، معلم مفصلي في العمارة الجورجية وهي اليوم خراب جزئي.
  body: >-
    **تسرومي من الأبنية التي غيّرت اتجاه العمارة الجورجية.** أقامها الأمير ستيبانوز بين عامي 626 و634،
    وهي أول كنيسة جورجية ترتكز فيها القبة على أربع دعامات قائمة بذاتها لا على الجدران. وقد حدّدت هذه
    الخطوة الإنشائية مخطط الكنائس الجورجية لخمسة قرون تالية، ومنها سامتافيسي وألافيردي.


    ومن المهم أن تعرف قبل الذهاب أن البناء اليوم نصف خراب. فقد أسقط زلزال 1940 القبة. وما زال جزء كبير من
    الجدران والحنية والدعامات قائماً، لكن لا سقف. والداخل مفتوح على السماء، وينبت العشب على الأرضية،
    وتُكدّس الكتل المنحوتة جانباً. وأعمال التدعيم تأتي وتتوقف.


    كان في الحنية فسيفساء ذات يوم: المسيح بين الرسل، وهي من النماذج النادرة الباقية للتقليد البيزنطي
    المبكر في القوقاز. والشذرات الباقية محفوظة في المتحف الوطني الجورجي في تبليسي؛ أما في الموقع فلا يُرى
    غير تقوّس الحنية الفارغ.


    وما يستحق الطريق هو الحجر نفسه. فالكتل منحوتة وموضوعة بدقة تكاد تُخفي المفاصل، بناء من القرن السابع
    بجودة لم تبلغها القرون التالية دائماً. ومن هذا المرتفع المنخفض ينفتح المشهد غرباً نحو سلسلة ليخي. هذا
    مكان لمن يهتم بالعمارة والتاريخ؛ ومن يرجو كنيسة كاملة مزدانة بالرسوم فليقصد غيره.
  tip: >-
    خمسون دقيقة تكفي. والمشي بين الأطلال يحتاج حذراً: فالحجارة الساقطة تختبئ في العشب والأرض غير مستوية،
    والحذاء المفتوح فكرة سيئة. ولا ظل يُذكر، وظهيرة الصيف حارة. ولا متجر ولا مقهى في القرية، فاشترِ كل
    شيء في خاشوري. وإن وجدت سياجاً مؤقتاً أو آليات في الموقع فذلك يعني أن أعمال الصيانة جارية وقد يكون
    الداخل مغلقاً.
  route: >-
    اتجه غرباً من تبليسي على الطريق E60 مروراً بغوري نحو خاشوري، نحو 115 كم على طريق مزدوج. وقبل خاشوري
    بقليل انعطف شمالاً إلى طريق غوري-كاريلي القديم واتبع لافتات تسرومي. مئة واثنان وعشرون كيلومتراً
    إجمالاً، نحو ساعة وأربعين دقيقة. الإسفلت ممتد حتى النهاية، وإن كان مدخل القرية ضيقاً. والوقود متوفر
    في غوري وخاشوري. أوقف السيارة في الساحة الصغيرة بجانب الكنيسة؛ وسيارة اقتصادية تكفي تماماً.
