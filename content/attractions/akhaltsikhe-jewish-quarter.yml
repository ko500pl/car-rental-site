ka:
  name: ახალციხის ებრაული უბანი და სინაგოგები
  short: რაბათის ქვემოთ, ძველ ქალაქში შემორჩენილი ორი XIX საუკუნის სინაგოგა და ვაჭართა უბნის ქუჩები.
  body: >-
    **ახალციხეში საქართველოს ერთ-ერთი უდიდესი ებრაული თემი ცხოვრობდა.** ქალაქი ოსმალურ საზღვარზე იდგა
    და სავაჭრო კვანძი იყო; ებრაელი ვაჭრები აქ სულ მცირე XVIII საუკუნიდან ცხოვრობდნენ, ხოლო 1828 წლის შემდეგ,
    როცა ახალციხე რუსეთის იმპერიაში აღმოჩნდა, თემი კიდევ გაიზარდა.


    ძველი უბანი რაბათის ბორცვის ქვემოთ, ფოცხოვის მარცხენა ნაპირზეა: ვიწრო ქუჩები, დაბალი ქვისა და აგურის
    სახლები ხის აივნებით, ეზოები, რომლებიც ერთმანეთში გადადის. ორი სინაგოგა ერთმანეთისგან რამდენიმე ათეულ
    მეტრში დგას — **დიდი სინაგოგა, 1863 წელს აშენებული**, და მეორე, 1902 წლისა. ისინი საქართველოში შემორჩენილ
    უძველეს სინაგოგურ ნაგებობათა შორისაა: სქელკედლიანი, თაღოვანფანჯრებიანი ქვის შენობები, შიგნით მოხატული
    ჭერით და ხის კვეთილი კიდობნით.


    უბანი მხოლოდ ებრაული არასოდეს ყოფილა. 1828-29 წლების ომის შემდეგ ახალციხეში ერზურუმიდან ათიათასობით
    სომეხი ლტოლვილი ჩამოსახლდა და ქალაქის დემოგრაფია საბოლოოდ შეიცვალა; ქართველი, სომეხი და ებრაელი მეზობლები
    ერთსა და იმავე ქუჩებზე ცხოვრობდნენ. სწორედ ამიტომ დგას აქ ერთ კვარტალში სინაგოგა, სომხური და ქართული
    ეკლესია.


    თემი 1970-იან წლებში დაიწყო წასვლა და 1990-იანებში თითქმის მთლიანად ისრაელში გადასახლდა. დღეს ახალციხეში
    ებრაელი ოჯახები ერთეულებია. ერთი სინაგოგა მოვლილია და ხანდახან იღება, მეორე კი ჩვეულებრივ ჩაკეტილია
    — შესვლა მხოლოდ იმ შემთხვევაშია შესაძლებელი, თუ მეზობელს ან მცველს დაუძახებ.


    აქ ერთი გარემოება ცალკე უნდა ითქვას: აღდგენილ რაბათის ციხეში ასევე დგას სინაგოგის სახელით ცნობილი
    ნაგებობა, მაგრამ ის თანამედროვე რეკონსტრუქციაა, ტურისტული კომპლექსის ნაწილი. ნამდვილი, ისტორიული სინაგოგები
    ბორცვის ქვემოთ, ჩვეულებრივ საცხოვრებელ ქუჩაზეა და არავითარი მითითება მათკენ არ მიგიძღვება. სწორედ
    ეს სიჩუმე და უპრეტენზიობაა აქ მთავარი.
  tip: >-
    ერთი საათი საკმარისია, თუ უბანს ფეხით შემოუვლი. სინაგოგები კულტურული ძეგლებია და არა მუზეუმები — ღიაობა
    არაა გარანტირებული; თუ დაკეტილია, სცადე მეზობლებთან კითხვა, ხშირად გასაღები ახლოსაა. შესვლისას მამაკაცებს
    თავსაბურავი სჭირდებათ, კართან ჩვეულებრივ დევს. ქუჩები ვიწროა და მანქანის დატოვება რთულია — უმჯობესია
    რაბათის პარკინგზე დატოვო და ქვევით ჩახვიდე. კაფეები და ტუალეტი ცენტრალურ ქუჩაზეა.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომზე და აწყურზე გავლით ახალციხემდე — 205 კმ, დაახლოებით სამი
    საათი და ოცი წუთი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. ქალაქში რაბათის ციხის მიმანიშნებელს
    გაჰყევი; ებრაული უბანი ციხის ბორცვის ჩრდილო-დასავლეთ ძირშია, ფოცხოვის ნაპირზე. მანქანა რაბათის დიდ
    პარკინგზე დატოვე. საწვავი ბორჯომსა და ახალციხეშია. ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: The Jewish quarter and synagogues of Akhaltsikhe
  short: Two surviving 19th-century synagogues and the streets of the old merchant quarter below the Rabati
    hill.
  body: >-
    **Akhaltsikhe held one of the largest Jewish communities in Georgia.** The town sat on the Ottoman
    frontier and lived by trade; Jewish merchants were established here from at least the 18th century,
    and after 1828, when Akhaltsikhe passed to the Russian empire, the community grew further.


    The old quarter lies below the Rabati hill on the left bank of the Potskhovi: narrow streets, low
    houses of stone and brick with wooden balconies, courtyards that run into one another. Two synagogues
    stand a few dozen metres apart — **the Great Synagogue, built in 1863**, and a second of 1902. They
    are among the oldest surviving synagogue buildings in the country: thick-walled stone halls with arched
    windows, painted ceilings and carved wooden Torah arks inside.


    The quarter was never exclusively Jewish. After the war of 1828-29 tens of thousands of Armenian refugees
    from Erzurum were resettled in Akhaltsikhe, permanently changing the town's demography, and Georgian,
    Armenian and Jewish neighbours lived along the same streets. That is why a synagogue, an Armenian
    church and a Georgian church all stand within a few blocks of each other.


    The community began to leave in the 1970s and had almost entirely emigrated to Israel by the end of
    the 1990s. Only a handful of Jewish families remain in the town today. One synagogue is looked after
    and opens from time to time; the other is usually locked, and getting in depends on finding a neighbour
    or a caretaker with the key.


    One thing is worth stating plainly. The restored Rabati castle also contains a building presented
    as a synagogue, but that is a modern reconstruction and part of the tourist complex. The real historical
    synagogues are down the hill on an ordinary residential street, with nothing to signpost them. That
    quietness, and the complete absence of presentation, is exactly what makes the walk worth taking.
  tip: >-
    An hour on foot covers the quarter. The synagogues are protected monuments rather than museums, so
    opening is not guaranteed; if the door is locked, ask at the neighbouring houses, since the key is
    often close by. Men need a head covering to go inside, and one is usually left by the door. The streets
    are narrow and parking is awkward, so it is easier to leave the car at the Rabati car park and walk
    down. Cafes and toilets are on the main street.
  route: >-
    From Tbilisi take the E60 to Khashuri, then head south through Borjomi and Atskuri to Akhaltsikhe
    — 205 km, about three hours twenty. The road is asphalt the whole way and in good condition. In town
    follow the signs for Rabati castle; the Jewish quarter lies at the north-western foot of the castle
    hill, along the Potskhovi river. Leave the car in the large Rabati car park. Fuel is available in
    Borjomi and Akhaltsikhe. An economy car is entirely sufficient.
ru:
  name: Еврейский квартал и синагоги Ахалцихе
  short: Две сохранившиеся синагоги XIX века и улицы старого купеческого квартала под холмом Рабати.
  body: >-
    **В Ахалцихе жила одна из крупнейших еврейских общин Грузии.** Город стоял на османской границе и
    жил торговлей; еврейские купцы обосновались здесь по меньшей мере с XVIII века, а после 1828 года,
    когда Ахалцихе отошёл Российской империи, община ещё выросла.


    Старый квартал лежит под холмом Рабати, на левом берегу Поцхови: узкие улицы, низкие дома из камня
    и кирпича с деревянными балконами, дворы, перетекающие один в другой. Две синагоги стоят в нескольких
    десятках метров друг от друга — **Большая синагога, построенная в 1863 году**, и вторая, 1902 года.
    Это одни из старейших сохранившихся синагогальных зданий в стране: толстостенные каменные залы с арочными
    окнами, расписными потолками и резными деревянными ковчегами внутри.


    Квартал никогда не был исключительно еврейским. После войны 1828-29 годов в Ахалцихе переселили десятки
    тысяч армянских беженцев из Эрзурума, что окончательно изменило демографию города, и грузинские, армянские
    и еврейские соседи жили на одних и тех же улицах. Поэтому синагога, армянская церковь и грузинский
    храм стоят здесь в нескольких кварталах друг от друга.


    Община начала уезжать в 1970-х и к концу 1990-х почти полностью переселилась в Израиль. Сегодня в
    городе остаётся лишь несколько еврейских семей. За одной синагогой ухаживают, и её иногда открывают;
    вторая обычно заперта, и попасть внутрь можно, только найдя соседа или сторожа с ключом.


    Об одном стоит сказать прямо. В восстановленной крепости Рабати тоже есть здание, представленное как
    синагога, но это современная реконструкция и часть туристического комплекса. Настоящие исторические
    синагоги стоят внизу, на обычной жилой улице, и никаких указателей к ним нет. Именно эта тишина и
    полное отсутствие подачи и делают прогулку сюда стоящей.
  tip: >-
    Часа пешком на квартал достаточно. Синагоги — охраняемые памятники, а не музеи, так что открытость
    не гарантирована; если дверь заперта, спросите в соседних домах, ключ часто рядом. Мужчинам для входа
    нужен головной убор, обычно он лежит у двери. Улицы узкие и парковаться неудобно, проще оставить машину
    на стоянке у Рабати и спуститься пешком. Кафе и туалеты — на центральной улице.
  route: >-
    Из Тбилиси по E60 до Хашури, затем на юг через Боржоми и Ацкури до Ахалцихе — 205 км, около трёх часов
    двадцати минут. Дорога асфальтированная на всём протяжении и в хорошем состоянии. В городе держитесь
    указателей на крепость Рабати; еврейский квартал находится у северо-западного подножия крепостного
    холма, вдоль реки Поцхови. Машину оставьте на большой парковке у Рабати. Заправки есть в Боржоми и
    Ахалцихе. Машины эконом-класса вполне достаточно.
fa:
  name: محلهٔ یهودیان و کنیسه‌های آخالتسیخه
  short: دو کنیسهٔ بازمانده از سدهٔ نوزدهم و کوچه‌های محلهٔ کهن بازرگانان در دامنهٔ تپهٔ راباتی.
  body: >-
    **آخالتسیخه یکی از بزرگ‌ترین جماعت‌های یهودی گرجستان را در خود داشت.** شهر بر مرز عثمانی بود و از
    بازرگانی زندگی می‌کرد؛ بازرگانان یهودی دست‌کم از سدهٔ هجدهم اینجا مستقر بودند و پس از ۱۸۲۸، هنگامی
    که آخالتسیخه به امپراتوری روسیه پیوست، جماعت باز هم بزرگ‌تر شد.


    محلهٔ کهن پایین تپهٔ راباتی و بر کرانهٔ چپ رود پوتسخووی است: کوچه‌های باریک، خانه‌های کوتاه سنگی و
    آجری با ایوان‌های چوبی، و حیاط‌هایی که به هم راه دارند. دو کنیسه در فاصلهٔ چند ده متری هم ایستاده‌اند:
    **کنیسهٔ بزرگ، ساختهٔ ۱۸۶۳**، و دومی از سال ۱۹۰۲. اینها از کهن‌ترین بناهای کنیسه‌ای بازمانده در کشورند:
    تالارهای سنگی با دیوارهای ستبر و پنجره‌های طاقدار، سقف‌های نقاشی‌شده و تابوت تورات چوبی کنده‌کاری‌شده
    در درون.


    این محله هرگز تنها یهودی نبود. پس از جنگ ۱۸۲۸ تا ۱۸۲۹ ده‌ها هزار پناهندهٔ ارمنی از ارزروم در آخالتسیخه
    اسکان یافتند و ترکیب جمعیتی شهر برای همیشه دگرگون شد، و همسایگان گرجی و ارمنی و یهودی در همان کوچه‌ها
    زیستند. به همین سبب کنیسه و کلیسای ارمنی و کلیسای گرجی همه در فاصلهٔ چند کوچه از یکدیگرند.


    جماعت از دههٔ ۱۹۷۰ آغاز به رفتن کرد و تا پایان دههٔ ۱۹۹۰ تقریباً یکسره به اسرائیل کوچید. امروز تنها
    چند خانوادهٔ یهودی در شهر مانده‌اند. از یکی از کنیسه‌ها نگهداری می‌شود و گاه باز است؛ دیگری معمولاً
    قفل است و ورود به یافتن همسایه یا سرایداری با کلید بستگی دارد.


    یک نکته را باید صریح گفت. در قلعهٔ بازسازی‌شدهٔ راباتی نیز بنایی هست که آن را کنیسه معرفی می‌کنند،
    اما آن بازسازی امروزی و بخشی از مجموعهٔ گردشگری است. کنیسه‌های تاریخی واقعی پایین تپه و در کوچه‌ای
    مسکونی‌اند و هیچ تابلویی به آنها راه نمی‌نماید. همین بی‌ادعایی و سکوت است که این گشت را ارزشمند می‌کند.
  tip: >-
    یک ساعت پیاده‌روی برای محله کافی است. کنیسه‌ها یادمان‌های حفاظت‌شده‌اند نه موزه، پس باز بودنشان تضمینی
    نیست؛ اگر در قفل بود از خانه‌های همسایه بپرسید، کلید اغلب نزدیک است. مردان برای ورود به پوشش سر نیاز
    دارند و معمولاً یکی کنار در گذاشته شده است. کوچه‌ها باریک‌اند و پارک کردن دشوار، پس بهتر است خودرو
    را در پارکینگ راباتی بگذارید و پیاده پایین بیایید. کافه‌ها و سرویس بهداشتی در خیابان اصلی‌اند.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری و سپس جنوب از راه بورجومی و آتسکوری تا آخالتسیخه — ۲۰۵ کیلومتر و
    حدود سه ساعت و بیست دقیقه. جاده تا انتها آسفالت و در وضعیت خوب است. در شهر تابلوهای قلعهٔ راباتی را
    دنبال کنید؛ محلهٔ یهودیان در دامنهٔ شمال‌غربی تپهٔ قلعه و کنار رود پوتسخووی است. خودرو را در پارکینگ
    بزرگ راباتی بگذارید. سوخت در بورجومی و آخالتسیخه هست. خودروی اقتصادی کاملاً کافی است.
he:
  name: הרובע היהודי ובתי הכנסת של אחלציחה
  short: שני בתי כנסת מן המאה ה-19 ששרדו, ורחובות רובע הסוחרים הישן למרגלות גבעת רבתי.
  body: >-
    **באחלציחה חיה אחת הקהילות היהודיות הגדולות בגאורגיה.** העיר ישבה על גבול האימפריה העות'מאנית והתפרנסה
    ממסחר; סוחרים יהודים היו מיושבים כאן לפחות מן המאה ה-18, ואחרי 1828, כשאחלציחה עברה לידי האימפריה
    הרוסית, הקהילה גדלה עוד.


    הרובע הישן שוכן מתחת לגבעת רבתי, על הגדה השמאלית של נהר פוצחובי: סמטאות צרות, בתים נמוכים מאבן ומלבנים
    עם מרפסות עץ, וחצרות שנשפכות זו לתוך זו. שני בתי כנסת עומדים במרחק כמה עשרות מטרים זה מזה — **בית
    הכנסת הגדול, שנבנה ב-1863**, ושני משנת 1902. אלה מבין מבני בתי הכנסת העתיקים ביותר ששרדו במדינה: אולמות
    אבן עבי קיר עם חלונות מקושתים, תקרות מצוירות וארונות קודש מעץ מגולף בפנים.


    הרובע מעולם לא היה יהודי בלבד. אחרי מלחמת 1828-1829 יושבו באחלציחה עשרות אלפי פליטים ארמנים מארזרום,
    והדבר שינה לצמיתות את הרכב האוכלוסייה, ושכנים גאורגים, ארמנים ויהודים חיו באותם רחובות עצמם. משום
    כך עומדים כאן בית כנסת, כנסייה ארמנית וכנסייה גאורגית במרחק כמה בלוקים זה מזה.


    הקהילה החלה לעזוב בשנות השבעים, ועד סוף שנות התשעים היגרה כמעט כולה לישראל. כיום נותרו בעיר רק כמה
    משפחות יהודיות. בבית כנסת אחד מטפלים והוא נפתח מפעם לפעם; השני נעול בדרך כלל, והכניסה תלויה באיתור
    שכן או שומר שבידיו המפתח.


    דבר אחד ראוי להיאמר בפירוש. בטירת רבתי המשוחזרת עומד גם מבנה המוצג כבית כנסת, אך זהו שחזור מודרני
    וחלק מן המתחם התיירותי. בתי הכנסת ההיסטוריים האמיתיים נמצאים במורד הגבעה, ברחוב מגורים רגיל, ואין
    שום שילוט המוליך אליהם. דווקא השקט הזה, והיעדר ההגשה, הם שהופכים את ההליכה לכדאית.
  tip: >-
    שעה ברגל מכסה את הרובע. בתי הכנסת הם אתרים מוגנים ולא מוזיאונים, ולכן פתיחה אינה מובטחת; אם הדלת נעולה,
    שאלו בבתים הסמוכים, המפתח לרוב קרוב. גברים זקוקים לכיסוי ראש כדי להיכנס, ובדרך כלל מונח אחד ליד הדלת.
    הרחובות צרים והחניה מסורבלת, ולכן קל יותר להשאיר את הרכב בחניון רבתי ולרדת ברגל. בתי קפה ושירותים
    נמצאים ברחוב הראשי.
  route: >-
    מטביליסי בכביש E60 עד חשורי, ומשם דרומה דרך בורג'ומי ואצקורי עד אחלציחה — 205 ק״מ, כשלוש שעות ועשרים
    דקות. הכביש סלול לכל אורכו ובמצב טוב. בעיר לכו לפי השילוט לטירת רבתי; הרובע היהודי נמצא למרגלות הצפון-מערביות
    של גבעת הטירה, לאורך נהר פוצחובי. השאירו את הרכב בחניון הגדול של רבתי. דלק יש בבורג'ומי ובאחלציחה.
    רכב חסכוני מספיק לחלוטין.
ar:
  name: الحي اليهودي وكنيسا أخالتسيخه
  short: كنيسان يهوديان باقيان من القرن التاسع عشر وشوارع حي التجار القديم تحت تلة راباتي.
  body: >-
    **ضمّت أخالتسيخه واحدة من أكبر الجماعات اليهودية في جورجيا.** كانت المدينة على الحدود العثمانية وتعيش
    على التجارة؛ واستقر التجار اليهود هنا منذ القرن الثامن عشر على الأقل، وبعد عام 1828 حين آلت أخالتسيخه
    إلى الإمبراطورية الروسية ازدادت الجماعة اتساعاً.


    يقع الحي القديم تحت تلة راباتي على الضفة اليسرى لنهر بوتسخوفي: أزقة ضيقة، وبيوت منخفضة من الحجر والآجر
    بشرفات خشبية، وأفنية يفضي بعضها إلى بعض. ويقوم الكنيسان على بعد عشرات الأمتار من بعضهما: **الكنيس
    الكبير المبني عام 1863**، وآخر من عام 1902. وهما من أقدم مباني الكنس الباقية في البلاد: قاعات حجرية
    سميكة الجدران بنوافذ معقودة، وأسقف مرسومة، وتوابيت توراة خشبية محفورة في الداخل.


    لم يكن الحي يهودياً خالصاً قط. فبعد حرب 1828-1829 وُطّن في أخالتسيخه عشرات الآلاف من اللاجئين الأرمن
    القادمين من أرضروم، فتبدلت تركيبة المدينة نهائياً، وعاش الجيران الجورجيون والأرمن واليهود في الشوارع
    نفسها. ولهذا يقوم هنا كنيس وكنيسة أرمنية وكنيسة جورجية على بعد بضعة مربعات من بعضها.


    بدأت الجماعة بالرحيل في السبعينيات وهاجرت كلها تقريباً إلى إسرائيل بنهاية التسعينيات. ولم يبقَ في
    المدينة اليوم سوى بضع أسر يهودية. أحد الكنيسين مصان ويُفتح بين حين وآخر؛ والآخر مقفل عادة، والدخول
    رهن العثور على جار أو حارس بيده المفتاح.


    ويجدر قول أمر بصراحة. ففي قلعة راباتي المرممة مبنى يُقدَّم على أنه كنيس، لكنه إعادة بناء حديثة وجزء
    من المجمع السياحي. أما الكنيسان التاريخيان الحقيقيان فأسفل التلة في شارع سكني عادي، ولا لافتة تدل
    عليهما. وهذا الهدوء وغياب أي عرض هما بالضبط ما يجعل المشي إلى هنا يستحق.
  tip: >-
    ساعة سيراً تكفي للحي. والكنيسان أثران محميان لا متحفان، ففتحهما غير مضمون؛ وإن كان الباب مقفلاً فاسأل
    في البيوت المجاورة، فالمفتاح قريب غالباً. ويحتاج الرجال إلى غطاء رأس للدخول، وعادة ما يوجد واحد عند
    الباب. الأزقة ضيقة والوقوف عسير، فالأسهل ترك السيارة في موقف راباتي والنزول سيراً. المقاهي ودورات
    المياه في الشارع الرئيسي.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري، ثم جنوباً عبر بورجومي وأتسكوري إلى أخالتسيخه — 205 كم ونحو ثلاث
    ساعات وعشرين دقيقة. الطريق معبّد على امتداده وبحالة جيدة. وفي المدينة اتبع لافتات قلعة راباتي؛ فالحي
    اليهودي عند السفح الشمالي الغربي لتلة القلعة بمحاذاة نهر بوتسخوفي. اترك السيارة في موقف راباتي الكبير.
    الوقود متوفر في بورجومي وأخالتسيخه. وسيارة اقتصادية تكفي تماماً.
