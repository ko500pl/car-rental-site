ka:
  name: ახალციხის ებრაული უბანი და სინაგოგები
  short: >-
    1862 წლის სინაგოგა მოხატული ხის ინტერიერით, მისი დაცარიელებული უმცროსი მეზობელი და ძველი სასაფლაო
    ფერდობზე, ახალციხის რაბათის უბანში.
  body: >-
    **რაბათის ციხის ქვემოთ, დაქანებულ ქუჩაზე, უბრალო ქვის ფასადს მიღმა დგას შენობა, რომელიც, შესაძლოა,
    საქართველოში უძველესი შემორჩენილი სინაგოგაა.** სამხრეთ კედლის წარწერა მის აგებას 1862 წლით ათარიღებს,
    სხვა წყაროების თანახმად კი იგი 1863 წელს დასრულდა. შიგნით ქვის კედლებს მოხატული ხე ცვლის. მამაკაცები
    ქვედა დარბაზში ლოცულობდნენ, ქალები კი ზემოთ, გეომეტრიული ორნამენტით შემკულ გალერეაში ისხდნენ.


    ებრაელები ახალციხეში ამ შენობაზე გაცილებით ადრე ცხოვრობდნენ. ძველი უბნის თავზე, ბორცვზე, ებრაულ სასაფლაოზე
    საფლავის ქვებია, რომელთაგან ზოგიერთს XVII საუკუნით ათარიღებენ, ზოგზე კი წარწერა ლადინოზეა ამოკვეთილი:
    ეს იმ ოჯახების კვალია, რომლებიც აქ ოსმალეთის იმპერიის გზით მოვიდნენ, მანამდე კი ესპანეთსა და პორტუგალიაში
    ცხოვრობდნენ. ქალაქი 1828 წლის რუსულ დაპყრობამდე ოსმალეთის სასაზღვრო ბაზარი იყო, შემდეგ აქ ერზრუმიდან
    სომეხი ოჯახებიც დასახლდნენ და რაბათის ქუჩებში ებრაელი, სომეხი, ქართველი და მუსლიმი მეზობლები გვერდიგვერდ
    ცხოვრობდნენ.


    XX საუკუნე უფრო მძიმე აღმოჩნდა. 1952 წელს, სტალინის დროს, საბჭოთა ხელისუფლებამ სინაგოგა დახურა და
    თემმა მისი ხელახლა გახსნის ნებართვა მხოლოდ 1986 წელს მიიღო. ამ დროისთვის ისრაელში გადასახლება უკვე
    დაწყებული იყო, დღეს კი ქალაქში ებრაული ოჯახი თითქმის აღარ დარჩა. 2012 წელს განახლებული შენობა ნაწილობრივ
    მუზეუმად მუშაობს: დაცულია იმ რაბინების პორტრეტები, რომლებიც აქ მსახურობდნენ, და თორის ორი გრაგნილი.
    სინაგოგას ყოფილი რაბინის ვაჟი უვლის და სტუმრებს ის უღებს კარს.


    იმავე ქუჩაზე, დაახლოებით ოცი მეტრით ქვემოთ, მეორე სინაგოგა დგას, XX საუკუნის დასაწყისში აგებული. 1970-იანი
    წლების დასაწყისიდან მასში სპორტული დარბაზი იყო, დღეს კი ცარიელია, თუმცა კედლები ჯერაც მტკიცედ დგას.
    ამ ორ კარს შორის მთელი ამბავი ეტევა: ერთი სალოცავი, რომელსაც ერთი ოჯახი ინახავს, და მეორე, რომელიც
    ჯერაც თავის მლოცველებს ელის.
  tip: >-
    ერთი საათი გამოყავით, სასაფლაოსთან ერთად კი მეტი. სინაგოგა მკაცრი განრიგით მომუშავე მუზეუმი არ არის:
    კარი მაშინ იღება, როცა მომვლელი ადგილზეა, ყველაზე საიმედოდ ზაფხულის სეზონზე. თუ დაკეტილია, მეზობელს
    ჰკითხეთ. შიგნით მამაკაცებს თავი უნდა ჰქონდეთ დაფარული, ყველას კი თავშეკავებული ჩაცმა შეეფერება; მცირე
    შემოწირულობა მადლიერებით მიიღება. ქუჩები ვიწრო და ციცაბოა, ამიტომ მანქანა რაბათის პარკინგზე დატოვეთ
    და ფეხით ჩადით. რაბათის ციხის მუზეუმში XIX საუკუნის ტილოებია, რომლებზეც ქალაქის ებრაული თემის ყოფაა
    ასახული; გასეირნება სწორედ იქიდან დაიწყეთ. კაფეები და ტუალეტი მთავარ ქუჩაზეა.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია, შემდეგ S8-ით
    სამხრეთისკენ, ბორჯომისა და აწყურის გავლით, ახალციხემდე: სულ 205 კმ, დაახლოებით 3 საათი და 20 წუთი.
    გზა ბოლომდე ასფალტია, მაგრამ ბორჯომსა და ახალციხეს შორის 45 კილომეტრი ვიწრო და მიხვეულ-მოხვეულია,
    დეკემბრიდან მარტამდე კი ყინულიცა და ნისლიც იცის. ქალაქში რაბათის ციხის მიმანიშნებლებს მიჰყევით. სინაგოგა
    დავით გურამიშვილის ქუჩაზეა, ძველ რაბათის უბანში, ციხის ქვემოთ, ფოცხოვის ჩრდილოეთ ნაპირზე. მანქანა
    რაბათთან დატოვეთ და ფეხით გაისეირნეთ. საწვავი ბორჯომში ან ახალციხეში ჩაასხით; ეკონომ-კლასის მანქანა
    საკმარისია.
en:
  name: The Jewish quarter and synagogues of Akhaltsikhe
  short: >-
    A synagogue of 1862 with a painted wooden interior, its empty younger neighbour and an old hillside
    cemetery in Akhaltsikhe's Rabati district.
  body: >-
    **On a sloping street below Rabati castle, behind a plain stone front, stands what may be the oldest
    synagogue building in Georgia.** An inscription on its south wall dates it to 1862; other sources
    give 1863 for its completion. Inside, the stone shell gives way to painted wood. The men prayed in
    the lower hall, and the women sat above in a gallery patterned with geometric ornament.


    Jews lived in Akhaltsikhe long before that. On the hill above the old quarter, the Jewish cemetery
    keeps tombstones said to go back to the 17th century, and some are inscribed in Ladino, the trace
    of families who came by way of the Ottoman Empire and, earlier still, from Spain and Portugal. The
    town was an Ottoman frontier market until the Russian conquest of 1828, after which Armenian families
    from Erzurum settled here too, and in the Rabati district Jewish, Armenian, Georgian and Muslim neighbours
    shared the same streets.


    The 20th century was harder. In 1952, under Stalin, the Soviet authorities closed the synagogue, and
    the community won permission to reopen it only in 1986. By then emigration to Israel had already begun,
    and today almost no Jewish families remain. Renovated in 2012, it now works partly as a museum, keeping
    portraits of its rabbis and two Torah scrolls; the former rabbi's son looks after it and opens it
    for visitors.


    About twenty metres further down the same street stands a second synagogue, built at the beginning
    of the 20th century. From the early 1970s it served as a gym; today it stands empty, though its walls
    are still sound. Between those two doors lies the whole story: one house of prayer kept alive by a
    single family, and one still waiting for a congregation.
  tip: >-
    Give it an hour, and more if you add the cemetery. The synagogue is not a museum with fixed hours:
    it opens when the caretaker is there, most reliably in the summer season. If the door is shut, ask
    a neighbour. Men should cover their heads inside, and modest dress is right for everyone; a small
    donation is welcome. The lanes are narrow and steep, so leave the car at the Rabati car park and walk
    down. The museum inside Rabati castle shows 19th-century paintings of the town's Jewish community,
    a good way to begin. Cafés and toilets are on the main street.
  route: >-
    From Tbilisi take the E60/S1 west past Gori to Khashuri, about 130 km, then the S8 south through Borjomi
    and Atskuri to Akhaltsikhe: 205 km and about 3 hours 20 minutes. It is asphalt all the way, but the
    45 km between Borjomi and Akhaltsikhe are narrow and full of bends, and from December to March can
    carry ice and fog. In town follow signs for Rabati castle. The synagogue is on Davit Guramishvili
    Street in the old Rabati district, just below the castle on the north bank of the Potskhovi. Park
    at Rabati and walk. Refuel in Borjomi or Akhaltsikhe; an economy car is enough.
ru:
  name: Еврейский квартал и синагоги Ахалцихе
  short: >-
    Синагога 1862 года с расписным деревянным интерьером, её опустевшая младшая соседка и старое кладбище
    на склоне в ахалцихском районе Рабат.
  body: >-
    **На покатой улице под крепостью Рабат, за скромным каменным фасадом, стоит, возможно, старейшее здание
    синагоги в Грузии.** Надпись на её южной стене датирует постройку 1862 годом; по другим источникам,
    строительство завершили в 1863-м. Внутри каменная оболочка уступает место расписному дереву. Мужчины
    молились в нижнем зале, а женщины сидели наверху, на галерее, украшенной геометрическим орнаментом.


    Евреи жили в Ахалцихе задолго до этого. На холме над старым кварталом еврейское кладбище хранит надгробия,
    которые, как говорят, восходят к XVII веку; на некоторых — надписи на ладино, след семей, пришедших
    через Османскую империю, а ещё раньше — из Испании и Португалии. До русского завоевания 1828 года
    город был османским приграничным торжищем; после него здесь поселились и армянские семьи из Эрзурума,
    и на улицах Рабата соседствовали евреи, армяне, грузины и мусульмане.


    XX век оказался тяжелее. В 1952 году, при Сталине, советские власти закрыли синагогу, и лишь в 1986
    году общине разрешили открыть её вновь. К тому времени уже началась эмиграция в Израиль, и сегодня
    еврейских семей здесь почти не осталось. После реставрации 2012 года синагога отчасти работает как
    музей: здесь хранятся портреты её раввинов и два свитка Торы; за зданием присматривает сын бывшего
    раввина — он и открывает его для посетителей.


    Метрах в двадцати ниже по той же улице стоит вторая синагога, построенная в начале XX века. С начала
    1970-х в ней был спортзал, теперь она пустует, но стены её по-прежнему крепки. Между этими двумя дверями
    — вся история: один молитвенный дом, который держит живым одна семья, и другой, всё ещё ждущий своей
    общины.
  tip: >-
    Отведите на визит час, а если добавите кладбище — больше. Синагога — не музей с часами работы: она
    открыта, когда на месте смотритель, надёжнее всего в летний сезон. Если дверь заперта, спросите у
    соседей. Мужчинам внутри следует покрыть голову, а скромная одежда уместна для всех; небольшое пожертвование
    будет кстати. Переулки узкие и крутые, поэтому оставьте машину на парковке у Рабата и спуститесь пешком.
    Музей в крепости Рабат показывает картины XIX века, изображающие еврейскую общину города, — хорошее
    начало прогулки. Кафе и туалеты — на главной улице.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори до Хашури, около 130 км, затем по S8 на юг через Боржоми и
    Ацкури до Ахалцихе: 205 км и около 3 часов 20 минут. Асфальт на всём пути, но 45 км между Боржоми
    и Ахалцихе — узкие и извилистые, а с декабря по март там бывают гололёд и туман. В городе следуйте
    указателям на крепость Рабат. Синагога — на улице Давида Гурамишвили в старом районе Рабат, чуть ниже
    крепости, на северном берегу Поцхови. Оставьте машину у Рабата и идите пешком. Заправляйтесь в Боржоми
    или Ахалцихе; хватит машины эконом-класса.
fa:
  name: محلهٔ یهودیان و کنیسه‌های آخالتسیخه
  short: >-
    کنیسه‌ای از ۱۸۶۲ با فضای درونی چوبی و نقاشی‌شده، همسایهٔ جوان‌ترِ خالی‌مانده‌اش و گورستانی کهن بر
    دامنهٔ تپه، در محلهٔ رباطِ آخالتسیخه.
  body: >-
    **در خیابانی شیب‌دار زیر قلعهٔ رباط، پشت نمایی سنگی و ساده، بنایی ایستاده که شاید کهن‌ترین ساختمان
    کنیسه در گرجستان باشد.** کتیبه‌ای بر دیوار جنوبی‌اش تاریخ ۱۸۶۲ را بر آن می‌نهد؛ منابع دیگر ۱۸۶۳ را
    سال پایان ساختش می‌دانند. در درون، پوستهٔ سنگی جای خود را به چوب نقاشی‌شده می‌دهد. مردان در تالار
    پایین عبادت می‌کردند و زنان در بالا، در بالکنی آراسته به نقش‌های هندسی، می‌نشستند.


    یهودیان مدت‌ها پیش از آن در آخالتسیخه زندگی می‌کردند. بر تپهٔ بالای محلهٔ قدیم، گورستان یهودیان سنگ‌قبرهایی
    را نگه داشته که گفته می‌شود به سدهٔ هفدهم بازمی‌گردند، و بر برخی از آن‌ها نوشته‌هایی به زبان لادینو
    دیده می‌شود، نشانِ خانواده‌هایی که از راه امپراتوری عثمانی و پیش‌تر از آن از اسپانیا و پرتغال آمده
    بودند. شهر تا فتح روس‌ها در ۱۸۲۸ بازاری مرزی در قلمرو عثمانی بود و پس از آن خانواده‌های ارمنی از ارزروم
    نیز اینجا ساکن شدند، و در کوچه‌های رباط همسایگانی یهودی، ارمنی، گرجی و مسلمان در کنار هم زندگی می‌کردند.


    سدهٔ بیستم سخت‌تر بود. در ۱۹۵۲، در دوران استالین، مقامات شوروی کنیسه را بستند و جامعهٔ یهودی تنها
    در ۱۹۸۶ اجازه یافت آن را دوباره بگشاید. تا آن زمان مهاجرت به اسرائیل آغاز شده بود و امروز تقریباً
    هیچ خانوادهٔ یهودی‌ای باقی نمانده است. کنیسه که در ۲۰۱۲ نوسازی شد، اکنون تا اندازه‌ای چون موزه کار
    می‌کند و تصویرهای خاخام‌هایش و دو طومار تورات را نگه می‌دارد؛ پسر خاخام پیشین از آن نگهداری می‌کند
    و درش را به روی بازدیدکنندگان می‌گشاید.


    حدود بیست متر پایین‌تر در همان خیابان، کنیسهٔ دومی ایستاده که در آغاز سدهٔ بیستم ساخته شد. این بنا
    از اوایل دههٔ ۱۹۷۰ سالن ورزش بود و اکنون خالی مانده، اما دیوارهایش هنوز استوارند. همهٔ داستان میان
    این دو در نهفته است: عبادتگاهی که تنها یک خانواده زنده نگهش داشته، و دیگری که هنوز چشم‌انتظار جماعتی
    است.
  tip: >-
    یک ساعت وقت بگذارید، و اگر گورستان را هم ببینید بیشتر. کنیسه موزه‌ای با ساعت کاری ثابت نیست: وقتی
    سرایدار آنجاست باز است، و بیش از همه در فصل تابستان می‌شود رویش حساب کرد. اگر در بسته بود، از همسایه‌ها
    بپرسید. مردان باید در داخل سرشان را بپوشانند و پوشش ساده و پوشیده برای همه مناسب است؛ کمک مالی کوچک
    با خوشرویی پذیرفته می‌شود. کوچه‌ها باریک و پرشیب‌اند، پس خودرو را در پارکینگ رباط بگذارید و پیاده
    پایین بروید. موزهٔ درون قلعهٔ رباط نقاشی‌هایی از سدهٔ نوزدهم دربارهٔ جامعهٔ یهودی شهر را نشان می‌دهد
    و نقطهٔ شروع خوبی است. کافه‌ها و سرویس بهداشتی در خیابان اصلی‌اند.
  route: >-
    از تفلیس با E60/S1 به غرب، از کنار گوری تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس از S8 به جنوب از راه
    بورجومی و آتسکوری تا آخالتسیخه: ۲۰۵ کیلومتر و حدود ۳ ساعت و ۲۰ دقیقه. سراسر راه آسفالت است، اما ۴۵
    کیلومترِ میان بورجومی و آخالتسیخه باریک و پرپیچ است و از دسامبر تا مارس ممکن است یخ‌زده و مه‌گرفته
    باشد. در شهر تابلوهای قلعهٔ رباط را دنبال کنید. کنیسه در خیابان داویت گورامیشویلی در محلهٔ قدیمی رباط
    است، کمی پایین‌تر از قلعه، در کرانهٔ شمالی رود پوتسخووی. در رباط پارک کنید و پیاده بروید. در بورجومی
    یا آخالتسیخه سوخت‌گیری کنید؛ خودروی اقتصادی کافی است.
he:
  name: הרובע היהודי ובתי הכנסת של אחלציחה
  short: בית כנסת משנת 1862 עם פנים מעץ צבוע, שכנו הצעיר והנטוש ובית קברות ישן על צלע הגבעה, ברובע רבאטי
    שבאחלציחה.
  body: >-
    **ברחוב משופע מתחת למצודת רבאטי, מאחורי חזית אבן פשוטה, עומד מה שעשוי להיות בניין בית הכנסת העתיק
    ביותר בגאורגיה.** כתובת על הקיר הדרומי מתארכת אותו לשנת 1862; לפי מקורות אחרים הושלמה בנייתו ב-1863.
    בפנים מפנה מעטפת האבן את מקומה לעץ צבוע. הגברים התפללו באולם התחתון, והנשים ישבו למעלה, בעזרת נשים
    מעוטרת בדגמים גאומטריים.


    יהודים חיו באחלציחה הרבה לפני כן. על הגבעה שמעל הרובע הישן שומר בית הקברות היהודי על מצבות שלפי המסופר
    מגיעות עד המאה ה-17, ועל חלקן כתובות בלדינו – עקבות של משפחות שהגיעו דרך האימפריה העות'מאנית, ולפני
    כן מספרד ומפורטוגל. עד הכיבוש הרוסי ב-1828 הייתה העיר עיר שוק עות'מאנית סמוכה לגבול, ואחריו התיישבו
    כאן גם משפחות ארמניות מארזורום, וברחובות רובע רבאטי חיו זה לצד זה שכנים יהודים, ארמנים, גאורגים ומוסלמים.


    המאה העשרים הייתה קשה יותר. ב-1952, בימי סטלין, סגרו השלטונות הסובייטיים את בית הכנסת, והקהילה קיבלה
    אישור לפתוח אותו מחדש רק ב-1986. עד אז כבר החלה העלייה לישראל, וכיום כמעט לא נותרו כאן משפחות יהודיות.
    בית הכנסת שופץ ב-2012 ומשמש כיום בחלקו מוזיאון, שבו שמורים דיוקנאות של רבניו ושני ספרי תורה; בנו של
    הרב הקודם מטפל בו ופותח אותו למבקרים.


    כעשרים מטר במורד אותו רחוב עומד בית כנסת שני, שנבנה בתחילת המאה העשרים. מתחילת שנות ה-70 שימש אולם
    התעמלות, וכיום הוא עומד ריק, אך קירותיו עדיין איתנים. בין שתי הדלתות האלה טמון הסיפור כולו: בית תפילה
    אחד שמשפחה אחת שומרת עליו בחיים, ואחר שעדיין מחכה לקהל מתפללים.
  tip: >-
    הקדישו לביקור שעה, ויותר אם מוסיפים את בית הקברות. בית הכנסת אינו מוזיאון עם שעות פתיחה קבועות: הוא
    פתוח כשהאחראי על המקום נמצא, והסיכוי הטוב ביותר הוא בעונת הקיץ. אם הדלת סגורה, שאלו את השכנים. גברים
    צריכים לכסות את הראש בפנים, ולבוש צנוע מתאים לכולם; תרומה קטנה תתקבל בברכה. הסמטאות צרות ותלולות,
    אז השאירו את הרכב בחניון של רבאטי ורדו ברגל. המוזיאון שבתוך מצודת רבאטי מציג ציורים מהמאה ה-19 המתארים
    את הקהילה היהודית בעיר – דרך טובה להתחיל. בתי קפה ושירותים יש ברחוב הראשי.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי, עד חשורי, כ-130 ק"מ, ומשם דרומה בכביש S8 דרך בורג'ומי
    ואצקורי עד אחלציחה: 205 ק"מ וכ-3 שעות ו-20 דקות. אספלט לכל אורך הדרך, אבל הקטע של 45 ק"מ בין בורג'ומי
    לאחלציחה צר ומפותל, ומדצמבר עד מרץ עלולים להיות בו קרח וערפל. בעיר עקבו אחר השלטים למצודת רבאטי. בית
    הכנסת נמצא ברחוב דוויט גוראמישווילי ברובע רבאטי הישן, ממש מתחת למצודה, על הגדה הצפונית של נהר הפוצחובי.
    חנו ברבאטי והמשיכו ברגל. תדלקו בבורג'ומי או באחלציחה; רכב מקטגוריית אקונומי מספיק.
ar:
  name: الحي اليهودي وكنيسا أخالتسيخه
  short: >-
    كنيس من عام 1862 بداخل من الخشب الملوّن، وجاره الأصغر المهجور، ومقبرة قديمة على سفح التل في حي رباطي
    بأخالتسيخه.
  body: >-
    **في شارع منحدر أسفل قلعة رباطي، خلف واجهة حجرية بسيطة، يقوم ما قد يكون أقدم مبنى كنيس في جورجيا.**
    يؤرّخه نقش على جداره الجنوبي بعام 1862، فيما تذكر مصادر أخرى عام 1863 تاريخاً لاكتماله. وفي الداخل
    يُفسح الغلاف الحجري المجال لخشب ملوّن. كان الرجال يصلّون في القاعة السفلى، وتجلس النساء في الأعلى،
    في رواق مزدان بزخارف هندسية.


    عاش اليهود في أخالتسيخه قبل ذلك بزمن طويل. فعلى التل المطلّ على الحي القديم تحتفظ المقبرة اليهودية
    بشواهد قبور يقال إنها تعود إلى القرن السابع عشر، وبعضها منقوش باللادينو، أثراً لعائلات جاءت عبر الدولة
    العثمانية، وقبل ذلك من إسبانيا والبرتغال. وظلت المدينة سوقاً عثمانية على التخوم حتى استيلاء الروس
    عليها عام 1828، ثم استقرّت هنا أيضاً عائلات أرمنية من أرضروم، فتقاسم الجيران اليهود والأرمن والجورجيون
    والمسلمون شوارع حي رباطي نفسها.


    كان القرن العشرون أقسى. ففي عام 1952، في عهد ستالين، أغلقت السلطات السوفيتية الكنيس، ولم تحصل الطائفة
    على إذن بإعادة فتحه إلا عام 1986. وبحلول ذلك الوقت كانت الهجرة إلى إسرائيل قد بدأت، واليوم لا تكاد
    تبقى أي عائلة يهودية. وبعد ترميمه عام 2012 صار يعمل جزئياً متحفاً، يحفظ صور حاخاماته ولفافتين من التوراة؛
    ويعتني به ابن الحاخام السابق، وهو من يفتحه للزوار.


    وعلى بعد نحو عشرين متراً في أسفل الشارع نفسه يقوم كنيس ثانٍ، بُني في مطلع القرن العشرين. وقد استُخدم
    صالةً رياضية منذ مطلع السبعينيات، وهو اليوم خالٍ، غير أن جدرانه ما زالت متينة. وبين هذين البابين تكمن
    الحكاية كلها: بيت صلاة تبقيه عائلة واحدة على قيد الحياة، وآخر ما زال ينتظر جماعة من المصلّين.
  tip: >-
    خصّص للزيارة ساعة، وأكثر إن أضفت المقبرة. ليس الكنيس متحفاً بمواعيد ثابتة: فهو يُفتح حين يكون القيّم
    عليه حاضراً، وأوثق ما يكون ذلك في موسم الصيف. إن وجدت الباب مغلقاً فاسأل أحد الجيران. على الرجال تغطية
    رؤوسهم في الداخل، واللباس المحتشم مناسب للجميع؛ والتبرع البسيط موضع ترحيب. الأزقة ضيقة وشديدة الانحدار،
    فاترك السيارة في موقف رباطي وانزل سيراً. يعرض المتحف داخل قلعة رباطي لوحات من القرن التاسع عشر تصوّر
    الجالية اليهودية في المدينة، وهي بداية جيدة للزيارة. المقاهي ودورات المياه في الشارع الرئيسي.
  route: >-
    من تبليسي اسلك E60/S1 غرباً مروراً بغوري حتى خاشوري، نحو 130 كم، ثم S8 جنوباً عبر بورجومي وأتسكوري
    إلى أخالتسيخه: 205 كم ونحو 3 ساعات و20 دقيقة. الطريق معبّد كله، لكن الـ45 كم بين بورجومي وأخالتسيخه
    ضيقة وكثيرة المنعطفات، وقد يغطيها الجليد والضباب من ديسمبر إلى مارس. في المدينة اتبع اللافتات إلى
    قلعة رباطي. يقع الكنيس في شارع دافيت غوراميشفيلي في حي رباطي القديم، أسفل القلعة مباشرة، على الضفة
    الشمالية لنهر بوتسخوفي. اركن في رباطي وأكمل سيراً. تزوّد بالوقود في بورجومي أو أخالتسيخه؛ السيارة
    الاقتصادية تكفي.
