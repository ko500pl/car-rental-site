ka:
  name: სვეტიცხოვლის საკათედრო ტაძარი
  short: >-
    მცხეთის XI საუკუნის საკათედრო ტაძარი, სადაც გადმოცემით ქრისტეს კვართია დაკრძალული — ქართული ეკლესიის
    მთავარი სიწმინდე.
  body: >-
    **სვეტიცხოველი საქართველოს სულიერი ცენტრია.** მცხეთა IV საუკუნიდან იყო ქრისტიანობის სამშობლო ამ ქვეყანაში
    და სწორედ აქ, ამ ადგილას, გადმოცემით დაკრძალულია უფლის კვართი, იერუსალიმიდან ჩამოტანილი ებრაელი ელიოზის
    მიერ. სახელი ნიშნავს „სვეტს ცხოველს" — ცოცხალ, სასწაულმოქმედ სვეტს, რომელიც პირველი ხის ტაძრის შენებისას
    აღიმართა.


    დღევანდელი შენობა 1010–1029 წლებში ააგო არქიტექტორმა არსუკისძემ. ეს საქართველოს ერთ-ერთი უდიდესი ისტორიული
    ნაგებობაა და მისი პროპორციები შიგნიდან უფრო შთამბეჭდავია, ვიდრე გარედან. ტაძარი გალავნით არის შემოზღუდული,
    კოშკებით და ჭიშკრით — ეს ერთდროულად ეკლესია და ციხე იყო.


    რას ნახავ შიგნით:


    - XI–XVII საუკუნეების ფრესკები, მათ შორის „ცხოველთა" და უკანასკნელი განკითხვის სცენები

    - ბაგრატიონთა სამეფო საძვალეები იატაკის ქვეშ, ნიშნებით მონიშნული

    - ქრისტეს კვართის სავარაუდო ადგილი ცენტრში, ქვის კივორიუმით

    - არსუკისძის მარჯვენა ხელის რელიეფი ჩრდილოეთ ფასადზე — ლეგენდის თანახმად მეფემ ოსტატს ხელი მოკვეთა,
    რომ მეორე ასეთი აღარ აეშენებინა


    სვეტიცხოველი მოქმედი საკათედროა და კვირაობით აქ ნათლობები და ჯვრისწერები მიმდინარეობს. ეს ტურისტულ
    დათვალიერებას ხელს არ უშლის, პირიქით — ცოცხალ კონტექსტს ჰმატებს.
  tip: >-
    ჩაცმის კოდი მკაცრია — ქალებს თავსაფარი და გრძელი კალთა, მამაკაცებს გრძელი შარვალი; შესასვლელთან უფასოდ
    გასცემენ. ფოტოს გადაღება შიგნით ჩვეულებრივ ნებადართულია აფეთქების გარეშე, მაგრამ მსახურების დროს ისევე.
    მოდი დილით, სანამ ავტობუსები ჩამოვლენ, ან 17:00-ის შემდეგ. მცხეთა პატარაა და გალავნის გარშემო კაფეები,
    ტუალეტი და ბანკომატია. ორი საათი გამოგადგება, თუ ქალაქშიც გაივლი.
  route: >-
    თბილისიდან მცხეთამდე 25 კმ-ია საქართველოს სამხედრო გზით (E117) — ავტობანი ბოლომდე, ნახევარი საათი
    უსაფრთხოდ. მცხეთის მოსახვევი მკაფიოდ არის მონიშნული; ქალაქში შესვლის შემდეგ ტაძარი ცენტრშივეა და გალავანი
    შორიდან ჩანს. მოძრაობა ისტორიულ ცენტრში შეზღუდულია — ავტომობილი დატოვე გალავნის გარეთა ფასიან პარკინგზე
    ან მდინარისპირა სადგომზე და გაიარე ფეხით ხუთი წუთი. გზა მთლიანად ასფალტია, ნებისმიერი ავტომობილი გამოდგება.
    საწვავი და მაღაზიები გზის გასწვრივ არის.
en:
  name: Svetitskhoveli Cathedral
  short: >-
    The 11th-century cathedral of Mtskheta, said to hold the robe of Christ — the mother church of Georgian
    Orthodoxy.
  body: >-
    **Svetitskhoveli is the spiritual centre of Georgia.** Mtskheta was the country's capital when Christianity
    arrived in the 4th century, and tradition holds that the robe of Christ, brought here from Jerusalem
    by a Jewish Mtskhetan named Elias, is buried beneath this floor. The name means "the living pillar",
    after the miraculous column that is said to have raised itself during the building of the first wooden
    church.


    The present building was completed between 1010 and 1029 by the architect Arsukisdze. It is one of
    the largest historical structures in Georgia, and its proportions read more powerfully inside than
    out. Walls, towers and a gate surround it: this was a cathedral and a fortress at the same time.


    Inside you will find:


    - Frescoes from the 11th to the 17th century, including a large Last Judgement on the west wall

    - Royal tombs of the Bagrationi dynasty set into the floor and marked with slabs

    - The presumed site of the robe, marked by a stone ciborium near the centre

    - A carved right hand on the north facade, tied to the legend that the king had the architect's hand
    cut off so he could never build its equal


    Svetitskhoveli is an active cathedral, and on Sundays it fills with baptisms and weddings. That does
    not block visiting; it gives the place its living context.
  tip: >-
    The dress code is enforced: headscarf and long skirt for women, long trousers for men, both handed
    out free at the gate. Photography inside is normally allowed without flash, though not during services.
    Come in the morning before the coaches or after five in the afternoon. Mtskheta is small, and cafés,
    toilets and ATMs are all within a couple of minutes of the cathedral walls. Allow two hours if you
    also walk through the old town.
  route: >-
    Mtskheta lies 25 km north of Tbilisi on the Georgian Military Highway (E117), motorway the entire
    way and about half an hour in normal traffic. The turn-off is clearly signed; once in town the cathedral
    is central and its walls are visible from a distance. Traffic inside the historic core is restricted,
    so leave the car in the paid lot outside the walls or on the riverside parking and walk five minutes.
    Everything is asphalt and any car category is fine. Fuel and shops line the approach road.
ru:
  name: Собор Светицховели
  short: Кафедральный собор Мцхеты XI века, где, по преданию, хранится хитон Христа, — главная святыня
    Грузии.
  body: >-
    **Светицховели — духовный центр Грузии.** Мцхета была столицей страны, когда сюда в IV веке пришло
    христианство, и предание гласит, что под этим полом погребён хитон Христа, привезённый из Иерусалима
    мцхетским евреем Элиозом. Название означает «животворящий столп» — по чудесной колонне, которая, как
    рассказывают, сама поднялась при строительстве первой деревянной церкви.


    Нынешнее здание возведено между 1010 и 1029 годами зодчим Арсукисдзе. Это одно из самых крупных исторических
    сооружений Грузии, и его пропорции сильнее ощущаются изнутри, чем снаружи. Собор окружён стенами,
    башнями и воротами: он был одновременно храмом и крепостью.


    Что вы увидите внутри:


    - Фрески XI–XVII веков, в том числе большой «Страшный суд» на западной стене

    - Царские усыпальницы Багратиони в полу, отмеченные плитами

    - Предполагаемое место хитона в центре, обозначенное каменным киворием

    - Рельеф правой руки на северном фасаде, связанный с легендой о том, что царь велел отрубить зодчему
    руку, чтобы тот не построил второго такого храма


    Светицховели — действующий кафедральный собор, по воскресеньям здесь идут крестины и венчания. Осмотру
    это не мешает, наоборот, даёт живой контекст.
  tip: >-
    Дресс-код соблюдают: платок и длинная юбка женщинам, длинные брюки мужчинам, накидки выдают бесплатно
    у ворот. Снимать внутри обычно можно без вспышки, но не во время службы. Приезжайте утром до автобусов
    или после пяти вечера. Мцхета маленькая, кафе, туалеты и банкоматы — в паре минут от стен собора.
    Закладывайте два часа, если пройдётесь и по старому городу.
  route: >-
    Мцхета лежит в 25 км к северу от Тбилиси по Военно-Грузинской дороге (E117), всю дорогу автомагистраль,
    около получаса при обычном трафике. Поворот хорошо обозначен; в городе собор стоит в центре, стены
    видны издалека. Движение в историческом ядре ограничено, поэтому оставьте машину на платной стоянке
    за стенами или на набережной и пройдите пять минут пешком. Асфальт везде, подойдёт автомобиль любого
    класса. Заправки и магазины есть вдоль подъездной дороги.
fa:
  name: کلیسای جامع سوتیتسخوولی
  short: کلیسای جامع سدهٔ یازدهم متسختا که بنا بر روایت جامهٔ مسیح را در خود دارد — کلیسای مادر ارتدکسی
    گرجی.
  body: >-
    **سوتیتسخوولی مرکز معنوی گرجستان است.** متسختا در سدهٔ چهارم، هنگام ورود مسیحیت، پایتخت کشور بود و
    بنا بر سنت جامهٔ مسیح که یهودی متسختایی به نام الیاس آن را از اورشلیم آورد، زیر همین کف دفن شده است.
    نام بنا یعنی «ستون زنده» و به ستونی اشاره دارد که می‌گویند هنگام ساخت نخستین کلیسای چوبی خود به‌خود
    برخاست.


    ساختمان کنونی میان 1010 و 1029 به دست معمار آرسوکیسدزه به پایان رسید. این یکی از بزرگ‌ترین بناهای
    تاریخی گرجستان است و تناسبات آن از درون بسیار گیراتر از بیرون خوانده می‌شود. دیوار، برج و دروازه گرداگرد
    آن کشیده شده‌اند: این بنا هم‌زمان کلیسای جامع و دژ بوده است.


    در درون فرسکوهایی از سدهٔ یازدهم تا هفدهم می‌بینید، از جمله داوری واپسین بزرگی بر دیوار غربی؛ آرامگاه‌های
    سلطنتی خاندان باگراتیونی که در کف نشسته و با سنگ‌های نشان‌دار مشخص شده‌اند؛ جایگاه فرضی جامه که سایبان
    سنگی نزدیک مرکز آن را نشان می‌دهد؛ و دست راست کنده‌شده بر نمای شمالی، پیوسته به افسانه‌ای که می‌گوید
    پادشاه دست معمار را برید تا هرگز نظیر آن بنا را نسازد. سوتیتسخوولی کلیسای جامع فعالی است و یکشنبه‌ها
    از غسل تعمید و عروسی پر می‌شود؛ این مانع بازدید نمی‌شود، بلکه به مکان بافت زندهٔ آن را می‌بخشد.
  tip: >-
    پوشش الزامی است: روسری و دامن بلند برای زنان، شلوار بلند برای مردان — هر دو رایگان کنار دروازه داده
    می‌شود. عکاسی در داخل معمولاً بدون فلاش آزاد است، اما نه هنگام مراسم. صبح پیش از اتوبوس‌ها یا پس از
    ساعت پنج بعدازظهر بیایید. متسختا کوچک است و کافه، سرویس بهداشتی و خودپرداز همه چند دقیقه‌ای با دیوارهای
    کلیسا فاصله دارند. اگر شهر قدیم را هم قدم بزنید، دو ساعت در نظر بگیرید.
  route: >-
    متسختا 25 کیلومتر شمال تفلیس روی بزرگراه نظامی گرجستان (E117) قرار دارد؛ تمام مسیر بزرگراه است و در
    ترافیک عادی حدود نیم ساعت طول می‌کشد. خروجی به‌روشنی تابلو دارد و در شهر کلیسای جامع مرکزی است و دیوارهایش
    از دور دیده می‌شود. تردد در هستهٔ تاریخی محدود است، پس خودرو را در پارکینگ پولی بیرون دیوارها یا در
    پارکینگ کنار رود بگذارید و پنج دقیقه پیاده بروید. همه‌جا آسفالت است و هر ردهٔ خودرو مناسب است. سوخت
    و فروشگاه در جادهٔ ورودی فراوان است.
he:
  name: קתדרלת סווטיצחוולי
  short: קתדרלת מצחתה מן המאה ה-11, שעל פי המסורת טמונה בה גלימת ישו — כנסיית האם של הנצרות האורתודוקסית
    הגאורגית.
  body: >-
    **סווטיצחוולי היא המרכז הרוחני של גאורגיה.** מצחתה הייתה בירת המדינה כשהנצרות הגיעה במאה ה-4, והמסורת
    גורסת שגלימת ישו, שהובאה לכאן מירושלים בידי יהודי מצחתי בשם אליאס, טמונה מתחת לרצפה הזאת. פירוש השם
    הוא "העמוד החי", על שם העמוד הפלאי שלפי האגדה התרומם מעצמו בעת בניית כנסיית העץ הראשונה.


    המבנה הנוכחי הושלם בין 1010 ל-1029 בידי האדריכל ארסוקיסדזה. זהו אחד המבנים ההיסטוריים הגדולים בגאורגיה,
    והפרופורציות שלו נקראות בעוצמה רבה יותר מבפנים מאשר מבחוץ. חומות, מגדלים ושער מקיפים אותו: זו הייתה
    קתדרלה ומבצר בעת ובעונה אחת.


    בפנים תמצאו ציורי קיר מן המאה ה-11 ועד המאה ה-17, ובהם יום דין גדול על הקיר המערבי; קברי המלוכה של
    שושלת הבגרטיוני, המשוקעים ברצפה ומסומנים בלוחות אבן; מקומה המשוער של הגלימה, שאותו מסמן חופת אבן סמוך
    למרכז; ויד ימין מגולפת בחזית הצפונית, הקשורה לאגדה שלפיה ציווה המלך לכרות את ידו של האדריכל כדי שלא
    יוכל לעולם לבנות מבנה שווה לו. סווטיצחוולי היא קתדרלה פעילה, ובימי ראשון היא מתמלאת בטבילות ובחתונות.
    הדבר אינו מונע ביקור; הוא נותן למקום את ההקשר החי שלו.
  tip: >-
    כללי הלבוש נאכפים: מטפחת ראש וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים, ושניהם מחולקים בחינם בשער.
    צילום בפנים מותר בדרך כלל בלי פלאש, אך לא במהלך תפילות. הגיעו בבוקר לפני האוטובוסים או אחרי חמש אחר
    הצהריים. מצחתה קטנה, ובתי הקפה, השירותים והכספומטים נמצאים כולם במרחק דקות ספורות מחומות הקתדרלה.
    הקצו שעתיים אם אתם גם מטיילים בעיר העתיקה.
  route: >-
    מצחתה שוכנת 25 ק"מ מצפון לטביליסי על כביש הצבא הגאורגי (E117), כביש מהיר לכל האורך וכחצי שעה נסיעה
    בתנועה רגילה. הפנייה מסומנת היטב בשילוט; בתוך העיר הקתדרלה מרכזית וחומותיה נראות מרחוק. התנועה בגרעין
    ההיסטורי מוגבלת, ולכן השאירו את הרכב בחניון בתשלום מחוץ לחומות או בחניה שלצד הנהר וצעדו חמש דקות.
    הכול אספלט וכל קטגוריית רכב מתאימה. תחנות דלק וחנויות פרושות לאורך כביש הגישה.
ar:
  name: كاتدرائية سفيتيتسخوفيلي
  short: كاتدرائية متسخيتا من القرن الحادي عشر، ويُقال إنها تضم رداء المسيح — الكنيسة الأم للأرثوذكسية
    الجورجية.
  body: >-
    **سفيتيتسخوفيلي هي المركز الروحي لجورجيا.** كانت متسخيتا عاصمة البلاد حين وصلت المسيحية في القرن الرابع،
    وتقول الرواية إن رداء المسيح، الذي جلبه من القدس يهودي من متسخيتا اسمه إلياس، مدفون تحت هذه الأرضية.
    ويعني الاسم "العمود الحي"، نسبة إلى العمود العجيب الذي يُروى أنه ارتفع من تلقاء نفسه أثناء بناء أول
    كنيسة خشبية.


    أُنجز المبنى الحالي بين عامي 1010 و1029 على يد المعماري أرسوكيسدزي. وهو من أكبر المنشآت التاريخية
    في جورجيا، وتُقرأ نسبه من الداخل أقوى مما تُقرأ من الخارج. تحيط به أسوار وأبراج وبوابة: فقد كان كاتدرائية
    وحصناً في آن واحد.


    في الداخل ستجد رسوماً جدارية تمتد من القرن الحادي عشر إلى السابع عشر، منها مشهد كبير ليوم الدينونة
    على الجدار الغربي؛ وقبور ملوك أسرة باغراتيوني مغروسة في الأرضية ومعلَّمة بألواح حجرية؛ والموضع المفترض
    للرداء، تحدده مظلة حجرية قرب الوسط؛ ويد يمنى منحوتة على الواجهة الشمالية ترتبط بأسطورة تقول إن الملك
    أمر بقطع يد المعماري كي لا يبني مثلها أبداً. وسفيتيتسخوفيلي كاتدرائية عاملة تمتلئ أيام الأحد بالمعموديات
    وحفلات الزفاف؛ وهذا لا يمنع الزيارة، بل يمنح المكان سياقه الحي.
  tip: >-
    قواعد اللباس مطبَّقة: غطاء رأس وتنورة طويلة للنساء، وبنطال طويل للرجال، ويُوزَّع كلاهما مجاناً عند
    البوابة. التصوير في الداخل مسموح عادة من دون فلاش، لكن ليس أثناء القداديس. تعال صباحاً قبل الحافلات
    أو بعد الخامسة عصراً. متسخيتا صغيرة، والمقاهي ودورات المياه وأجهزة الصراف كلها على بعد دقيقتين من
    أسوار الكاتدرائية. خصص ساعتين إن أردت أن تتجول في البلدة القديمة أيضاً.
  route: >-
    تقع متسخيتا على بعد 25 كم شمال تبليسي على الطريق العسكري الجورجي (E117)، وهو طريق سريع طوال المسافة
    ونحو نصف ساعة في الحركة العادية. المخرج معلَّم بوضوح، وداخل البلدة تقع الكاتدرائية في المركز وتُرى
    أسوارها من بعيد. الحركة داخل النواة التاريخية مقيدة، فاترك السيارة في الموقف المدفوع خارج الأسوار
    أو في موقف ضفة النهر وامشِ خمس دقائق. الطريق كله إسفلت وأي فئة سيارة تفي بالغرض. محطات الوقود والمتاجر
    تصطف على طريق الوصول.
