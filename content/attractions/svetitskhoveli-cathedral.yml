ka:
  name: სვეტიცხოვლის საკათედრო ტაძარი
  short: >-
    საქართველოს დედა-ტაძარი: XI საუკუნის კათედრალი, სადაც გადმოცემით უფლის კვართი განისვენებს, იატაკქვეშ
    მეფეები წვანან, კედელზე კი ხუროთმოძღვრის მარჯვენაა.
  body: >-
    **სვეტიცხოვლის ჩრდილოეთ კედელზე, მაღლა, გამოკვეთილ მარჯვენას კუთხედი უჭირავს, წარწერა კი ღვთის მონა
    არსუკიძისთვის შენდობას ითხოვს. ამ ხელმოწერამ აქ დაკრძალული ყველა მეფე და თავად სამეფოც გადაიტანა.**


    ტაძარი ლეგენდას ეფუძნება. გადმოცემით, მცხეთელმა ებრაელმა ელიოზმა გოლგოთაზე რომაელი ჯარისკაცისგან უფლის
    კვართი იყიდა და შინ ჩამოიტანა. მისმა დამ, სიდონიამ, კვართს ხელი შეახო, იქვე სული განუტევა; ისე დაკრძალეს,
    რომ კვართი ხელიდან ვერ გამოართვეს. საფლავზე კედარი ამოიზარდა. წმინდა ნინომ ის ეკლესიის სვეტებისთვის
    მოაჭრევინა, მეშვიდე სვეტი კი თავისით აიჭრა ჰაერში და მხოლოდ ნინოს ღამისთევის ლოცვის შემდეგ დაეშვა.
    აქედანაა სახელიც — სვეტი ცხოველი. ტაძრის შიგნით პატარა ქვის სამლოცველო, უფლის საფლავის სიმბოლური ასლი,
    სიდონიას განსასვენებელს აღნიშნავს.


    პირველი ეკლესია IV საუკუნეში, მირიან III-ის დროს აიგო, ბაზილიკა — V საუკუნეში, ვახტანგ გორგასლის ხელით.
    დღევანდელი ჯვარგუმბათოვანი ტაძარი 1010-1029 წლებში, კათოლიკოს მელქისედეკ I-ის მოწვევით აშენდა. 1787
    წელს ერეკლე II-მ იგი კოშკებიანი გალავნით შემოზღუდა, რომლის კარიბჭეშიც დღესაც შედიხართ. ყველაზე უცნაური
    დარტყმა ტაძარმა XIX საუკუნის 30-იან წლებში მიიღო, როცა იმპერატორ ნიკოლოზ I-ის ვიზიტის მოლოდინში, რომელიც
    არც შედგა, რუსმა მოხელეებმა შუა საუკუნეების ფრესკები შეათეთრეს. რესტავრატორებმა ნაწილი დაიბრუნეს,
    მათ შორის XIII საუკუნის აპოკალიფსის მხეცი და ზოდიაქოს ნიშნები.


    საკურთხევლის წინ ვახტანგ გორგასალი, ერეკლე II — მის საფლავს ხმალი და ფარი ამშვენებს — და მისი ძე,
    საქართველოს უკანასკნელი მეფე გიორგი XII განისვენებენ. გარეთ, აღმოსავლეთ ფასადზე, ფრთაგაშლილი არწივის
    ქვეშ ლომი ზის, V საუკუნის ეკლესიიდან კი ორი ხარის თავია შემორჩენილი.


    კვირა დილით მოდით, როცა ერთ სვეტთან ბავშვს ნათლავენ, მეორესთან — ჯვარს იწერენ, და ტაძარი ძეგლად ყოფნას
    წყვეტს.
  tip: >-
    ჩაცმის წესს ჭიშკართანვე ამოწმებენ: ქალებს თავსაფარი და ქვედაბოლო სჭირდებათ, მამაკაცებს — გრძელი შარვალი;
    მოსასხამებს შესასვლელთან გაძლევენ. ფოტო ფლეშის გარეშე გადაიღეთ, წირვის დროს კი საერთოდ ნუ გადაიღებთ.
    მოდით დილით ადრე ან 17:00-ის შემდეგ, რომ შუადღის ტურისტულ ჯგუფებს თავი აარიდოთ — განსაკუთრებით ზაფხულში.
    გალავნის ირგვლივ ქუჩებში კაფეები, ტუალეტები და ბანკომატებია. ორი საათი გამოყავით, თუ ძველ ქალაქშიც
    გაისეირნებთ და ქუჩის ზემოთ, ხუთ წუთში, სამთავროსაც ეწვევით.
  route: >-
    თბილისიდან ჩრდილო-დასავლეთით ს1 (E60) ავტომაგისტრალით გადით და დაახლოებით 20 კმ-ში მცხეთის მონიშნულ
    გასასვლელზე გადაუხვიეთ; ძველი გზა მტკვარს გადაკვეთს და პირდაპირ ცენტრში შეგიყვანთ. სულ 25 კმ და ჩვეულებრივ
    ნაკადში დაახლოებით 30 წუთია, მთლიანად ასფალტზე, ასე რომ, ნებისმიერი მანქანა გამოდგება. ისტორიულ ცენტრში
    მოძრაობა შეზღუდულია: მანქანა მის კიდეზე ან მდინარის პირას, ფასიან სადგომზე დატოვეთ და რამდენიმე წუთი
    ფეხით იარეთ გალავნამდე, რომელიც შორიდანვე მოჩანს. საწვავის სადგურები ს1-ის გასწვრივ ბევრია.
en:
  name: Svetitskhoveli Cathedral
  short: >-
    Georgia's mother church: an 11th-century cathedral said to guard Christ's robe, with kings beneath
    its floor and its architect's carved hand on the wall.
  body: >-
    **High on the north wall of Svetitskhoveli a carved right arm grips a mason's square, and the inscription
    asks forgiveness for "Arsukidze, slave of God" — a signature that has outlasted every king buried
    inside, and the kingdom too.**


    The cathedral rests on a legend. Tradition says Elias, a Jew of Mtskheta, bought Christ's robe from
    a Roman soldier at Golgotha and carried it home; his sister Sidonia touched it, died on the spot and
    was buried still clutching it. A cedar grew from her grave. St Nino had it felled for the church's
    columns; the seventh rose into the air by itself and came down only after she had prayed all night.
    Hence the name: sveti, pillar, tskhoveli, living. Inside, a small stone copy of the Holy Sepulchre
    marks Sidonia's grave.


    The first church went up under King Mirian III in the 4th century and a basilica under Vakhtang Gorgasali
    in the 5th. The present cross-domed cathedral was built between 1010 and 1029, at the invitation of
    Catholicos Melchizedek I. In 1787 Erekle II ringed it with the towered wall you still walk through.
    The oddest blow came in the 1830s, when Russian officials whitewashed the medieval frescoes ahead
    of a visit by Tsar Nicholas I that never happened. Restorers have recovered fragments, among them
    a 13th-century Beast of the Apocalypse and figures of the zodiac.


    Before the altar lie Vakhtang Gorgasali, Erekle II, his tomb marked with a sword and shield, and his
    son George XII, the last king of Georgia. Outside, on the east front, an eagle spreads its wings above
    a lion, and two bulls' heads survive from the 5th-century church.


    Come on a Sunday, with a christening at one pillar and a wedding at the next, and it stops being a
    monument.
  tip: >-
    The dress code is enforced at the gate: a headscarf and skirt for women, long trousers for men; wraps
    are lent at the entrance. Photograph without flash, and not at all during a service. Arrive early
    in the morning or after 5 pm to avoid the midday tour groups, especially in summer. The streets around
    the walls have cafés, toilets and cash machines. Allow two hours if you also want to wander the old
    town and walk five minutes up the street to Samtavro.
  route: >-
    Take the S1 motorway (E60) north-west from Tbilisi and leave it at the signed Mtskheta exit after
    about 20 km; the old road crosses the Mtkvari straight into the centre. That is 25 km and roughly
    30 minutes in normal traffic, asphalt all the way, so any car will do. Traffic in the historic core
    around the cathedral is restricted: leave the car in one of the paid lots on its edge or by the river
    and walk a few minutes to the walls, which you will see long before you reach them. Fuel stations
    line the S1.
ru:
  name: Собор Светицховели
  short: >-
    Главный храм Грузии: собор XI века, где, по преданию, хранится хитон Христа, под полом покоятся цари,
    а на стене высечена рука зодчего.
  body: >-
    **Высоко на северной стене Светицховели резная правая рука сжимает наугольник каменщика, а надпись
    молит о прощении «Арсукидзе, раба Божьего» — подпись, пережившая всех царей, погребённых внутри, и
    само царство.**


    Собор стоит на легенде. Предание гласит, что Элиоз, мцхетский еврей, купил хитон Христа у римского
    воина на Голгофе и привёз его домой; его сестра Сидония коснулась хитона, тут же умерла и была похоронена,
    так и не выпустив его из рук. Из её могилы вырос кедр. Святая Нино велела срубить его и сделать из
    него колонны для церкви; седьмая колонна сама поднялась в воздух и опустилась лишь после того, как
    Нино молилась всю ночь. Отсюда и название: «свети» — столп, «цховели» — живой. Внутри могилу Сидонии
    отмечает небольшая каменная копия Гроба Господня.


    Первую церковь возвели при царе Мириане III в IV веке, базилику — при Вахтанге Горгасали в V веке.
    Нынешний крестово-купольный собор построен в 1010–1029 годах по приглашению католикоса Мелхиседека
    I. В 1787 году Ираклий II обнёс его стеной с башнями, через которую входят и сегодня. Самый странный
    удар храм перенёс в 1830-х: русские чиновники забелили средневековые фрески к визиту императора Николая
    I, который так и не состоялся. Реставраторы раскрыли фрагменты росписи, среди них Зверя Апокалипсиса
    XIII века и фигуры зодиака.


    Перед алтарём покоятся Вахтанг Горгасали, Ираклий II, чья гробница отмечена мечом и щитом, и его сын
    Георгий XII, последний царь Грузии. Снаружи, на восточном фасаде, орёл распростёр крылья над львом,
    а две бычьи головы уцелели от церкви V века.


    Приезжайте в воскресенье, когда у одного столпа крестят, а у соседнего венчают, — и собор перестанет
    быть памятником.
  tip: >-
    Дресс-код проверяют у ворот: женщинам нужны платок и юбка, мужчинам — длинные брюки; накидки дают
    на входе. Снимайте без вспышки, а во время службы не снимайте вовсе. Приходите рано утром или после
    пяти вечера, чтобы разминуться с полуденными экскурсионными группами, особенно летом. На улицах вокруг
    стен есть кафе, туалеты и банкоматы. Закладывайте два часа, если хотите ещё побродить по старому городу
    и подняться пять минут по улице к Самтавро.
  route: >-
    Выезжайте из Тбилиси на северо-запад по автомагистрали S1 (E60) и примерно через 20 км сверните на
    обозначенный съезд к Мцхете; старая дорога пересекает Мтквари и ведёт прямо в центр. Это 25 км и около
    30 минут при обычном движении, асфальт на всём пути — подойдёт любая машина. Движение в историческом
    центре вокруг собора ограничено: оставьте автомобиль на одной из платных стоянок на его краю или у
    реки и пройдите несколько минут пешком до стен — их вы увидите задолго до того, как дойдёте. Заправки
    стоят вдоль всей S1.
fa:
  name: کلیسای جامع سوتیتسخولی
  short: >-
    کلیسای مادر گرجستان: کلیسای جامعی از سدهٔ یازدهم که می‌گویند ردای مسیح را نگه می‌دارد، با شاهانی زیر
    کف و دست تراشیدهٔ معمارش بر دیوار.
  body: >-
    **بالای دیوار شمالی سوتیتسخولی، بازوی راستی از سنگ گونیای بنّایی را در مشت دارد و نبشته‌ای برای «آرسوکیدزه،
    بندهٔ خدا» آمرزش می‌طلبد — امضایی که از همهٔ شاهانِ به خاک‌سپرده در درون، و از خودِ پادشاهی نیز، دیرپاتر
    بوده است.**


    این کلیسا بر افسانه‌ای بنا شده است. روایت است که الیاس، یهودی‌ای از متسختا، ردای مسیح را در جلجتا
    از سربازی رومی خرید و به خانه آورد؛ خواهرش سیدونیا به ردا دست زد، در دم جان داد و در حالی به خاک سپرده
    شد که هنوز آن را در دست می‌فشرد. از گور او درخت سدری رویید. قدیسه نینو فرمان داد آن را ببُرند و از
    آن ستون‌های کلیسا را بسازند؛ ستون هفتم خودبه‌خود به هوا برخاست و تنها پس از آنکه نینو تمام شب را به
    دعا گذراند، فرود آمد. نام کلیسا از همین است: «سوتی» یعنی ستون و «تسخولی» یعنی زنده. در درون، نمونهٔ
    سنگی کوچکی از مقبرهٔ مقدس مسیح در اورشلیم، گور سیدونیا را نشان می‌دهد.


    نخستین کلیسا در سدهٔ چهارم در روزگار شاه میریان سوم برپا شد و بازیلیکایی در سدهٔ پنجم در زمان واختانگ
    گورگاسالی. کلیسای جامع کنونی، با نقشهٔ صلیبی و گنبددار، میان سال‌های ۱۰۱۰ و ۱۰۲۹ به دعوت جاثلیق ملکیصدق
    یکم ساخته شد. در ۱۷۸۷ ارکلی (هراکلیوس) دوم گرداگرد آن حصاری برج‌دار کشید که هنوز از آن می‌گذرید. غریب‌ترین
    ضربه در دههٔ ۱۸۳۰ فرود آمد: مأموران روس نقاشی‌های دیواری سده‌های میانه را برای دیدار تزار نیکلای یکم،
    دیداری که هرگز رخ نداد، با دوغاب آهک سفید پوشاندند. مرمت‌گران پاره‌هایی را بازیافته‌اند، از جمله «وحش
    مکاشفه» از سدهٔ سیزدهم و پیکره‌هایی از صورت‌های منطقةالبروج.


    پیش از محراب، واختانگ گورگاسالی، ارکلی دوم که گورش با شمشیر و سپری نشان شده، و پسرش گیورگی دوازدهم،
    آخرین شاه گرجستان، آرمیده‌اند. بیرون، بر نمای شرقی، عقابی بر فراز شیری بال گسترده است و دو سر گاو
    نر از کلیسای سدهٔ پنجم به جا مانده است.


    یکشنبه‌ای بیایید که کنار یک ستون غسل تعمید برپاست و کنار ستون بعدی عروسی — آن‌وقت دیگر یک بنای تاریخی
    نیست.
  tip: >-
    قاعدهٔ پوشش از همان دروازه کنترل می‌شود: برای زنان روسری و دامن، برای مردان شلوار بلند؛ پارچهٔ پوششی
    در ورودی امانت داده می‌شود. بدون فلاش عکس بگیرید و هنگام مراسم دینی اصلاً عکس نگیرید. صبح زود یا بعد
    از ساعت پنج عصر بیایید تا با گروه‌های تور نیمروز روبه‌رو نشوید، به‌ویژه در تابستان. در کوچه‌های پیرامون
    حصار کافه، سرویس بهداشتی و خودپرداز هست. اگر می‌خواهید در شهر قدیم هم پرسه بزنید و پنج دقیقه در خیابان
    بالا بروید تا به سامتاورو برسید، دو ساعت کنار بگذارید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی شمال‌غرب بگیرید و پس از حدود ۲۰ کیلومتر از خروجی متسختا که تابلو
    دارد بیرون بروید؛ جادهٔ قدیم از روی متکواری می‌گذرد و یکراست به مرکز شهر می‌رسد. این مسیر ۲۵ کیلومتر
    و در ترافیک عادی حدود ۳۰ دقیقه است و سراسر آسفالت، پس هر خودرویی از پسش برمی‌آید. رفت‌وآمد خودرو در
    هستهٔ تاریخی پیرامون کلیسا محدود است: ماشین را در یکی از پارکینگ‌های پولی حاشیهٔ آن یا کنار رود بگذارید
    و چند دقیقه تا حصار پیاده بروید؛ حصار را خیلی پیش از رسیدن خواهید دید. در طول S1 پمپ‌بنزین فراوان
    است.
he:
  name: קתדרלת סבטיצחובלי
  short: >-
    כנסיית האם של גאורגיה: קתדרלה מהמאה ה-11 שלפי המסורת שומרת את כותונת ישו, מלכים קבורים מתחת לרצפתה,
    ויד האדריכל חקוקה בקירה.
  body: >-
    **גבוה על הקיר הצפוני של סבטיצחובלי, זרוע ימין מגולפת אוחזת בזוויתן של בנאי, והכתובת מבקשת מחילה עבור
    "ארסוקידזה, עבד האל" — חתימה שהאריכה ימים יותר מכל המלכים הקבורים בפנים, ויותר מהממלכה עצמה.**


    הקתדרלה נשענת על אגדה. המסורת מספרת שאליאס, יהודי ממצחתה, קנה את כותונת ישו מחייל רומאי בגולגותא והביא
    אותה לביתו; אחותו סידוניה נגעה בה, מתה במקום ונקברה כשהיא עדיין לופתת אותה. מקברה צמח ארז. נינו הקדושה
    ציוותה לכרות אותו ולעשות ממנו עמודים לכנסייה; העמוד השביעי התרומם מעצמו לאוויר, וירד רק אחרי שנינו
    התפללה כל הלילה. מכאן השם: "סבטי" — עמוד, "צחובלי" — חי. בפנים, העתק קטן מאבן של הקבר הקדוש בירושלים
    מסמן את קברה של סידוניה.


    הכנסייה הראשונה נבנתה בימי המלך מיריאן השלישי במאה ה-4, ובזיליקה קמה בימי וחטנג גורגסלי במאה ה-5.
    הקתדרלה הנוכחית, כנסיית צלב בעלת כיפה, נבנתה בין 1010 ל-1029 בהזמנת הקתוליקוס מלכיצדק הראשון. ב-1787
    הקיף אותה המלך ארקלה השני בחומה עם מגדלים, שדרכה נכנסים גם היום. המכה המשונה ביותר הגיעה בשנות ה-30
    של המאה ה-19, כשפקידים רוסים סיידו בלבן את ציורי הקיר מימי הביניים לקראת ביקור של הצאר ניקולאי הראשון,
    ביקור שמעולם לא התקיים. משחזרים חשפו מאז שברים, ובהם החיה מספר ההתגלות, מן המאה ה-13, ודמויות של גלגל
    המזלות.


    לפני המזבח קבורים וחטנג גורגסלי, ארקלה השני, שקברו מסומן בחרב ובמגן, ובנו גיאורגי השנים-עשר, המלך
    האחרון של גאורגיה. בחוץ, בחזית המזרחית, נשר פורש כנפיים מעל אריה, ושני ראשי שוורים שרדו מן הכנסייה
    של המאה ה-5.


    בואו ביום ראשון, כשליד עמוד אחד עורכים טבילה וליד העמוד הסמוך חתונה — והקתדרלה חדלה להיות מונומנט.
  tip: >-
    קוד הלבוש נאכף כבר בשער: לנשים כיסוי ראש וחצאית, לגברים מכנסיים ארוכים; בכניסה משאילים בדים לכיסוי.
    צלמו בלי פלאש, ובזמן טקס דתי אל תצלמו כלל. בואו מוקדם בבוקר או אחרי חמש אחר הצהריים כדי לחמוק מקבוצות
    המטיילים של שעות הצהריים, במיוחד בקיץ. ברחובות שסביב החומות יש בתי קפה, שירותים וכספומטים. הקדישו
    שעתיים אם תרצו גם לשוטט בעיר העתיקה ולעלות חמש דקות ברחוב עד מנזר סמטאברו.
  route: >-
    צאו מטביליסי צפון-מערבה בכביש המהיר S1 (E60) ורדו ממנו במחלף המסומן למצחתה אחרי כ-20 ק"מ; הכביש הישן
    חוצה את המטקוורי ונכנס ישר למרכז העיירה. בסך הכול 25 ק"מ וכ-30 דקות בתנועה רגילה, כביש סלול לכל אורכו,
    כך שכל רכב יתאים. התנועה בגרעין ההיסטורי שסביב הקתדרלה מוגבלת: השאירו את הרכב באחד החניונים בתשלום
    בשוליו או ליד הנהר, ולכו כמה דקות ברגל אל החומות — תראו אותן הרבה לפני שתגיעו. תחנות דלק פזורות לאורך
    ה-S1.
ar:
  name: كاتدرائية سفيتيتسخوفيلي
  short: >-
    الكنيسة الأم في جورجيا: كاتدرائية من القرن الحادي عشر يُقال إنها تحفظ رداء المسيح، تحت أرضها ملوك،
    وعلى جدارها يدُ معماريّها منحوتة.
  body: >-
    **عالياً على الجدار الشمالي لسفيتيتسخوفيلي، تقبض ذراعٌ يمنى منحوتة على زاوية البنّاء، ويطلب النقش
    المغفرة لـ«أرسوكيدزه، عبدِ الربّ»، في توقيعٍ عاش أطول من كل الملوك المدفونين في الداخل، بل من المملكة
    نفسها.**


    تقوم الكاتدرائية على أسطورة. يروي التقليد أن إلياس، وهو يهودي من متسخيتا، اشترى رداء المسيح من جندي
    روماني عند الجلجثة وحمله إلى بيته؛ فلمسته أخته سيدونيا وماتت في الحال، ودُفنت وهي لا تزال تقبض عليه.
    ونبتت من قبرها أرزة. أمرت القديسة نينو بقطعها لتُصنع منها أعمدة الكنيسة، فارتفع العمود السابع في الهواء
    من تلقاء نفسه، ولم ينزل إلا بعد أن صلّت نينو الليل كله. ومن هنا جاء الاسم: «سفيتي» أي عمود، و«تسخوفيلي»
    أي حيّ. وفي الداخل تقوم نسخة حجرية صغيرة من القبر المقدس في القدس، تُعلِّم موضع قبر سيدونيا.


    بُنيت الكنيسة الأولى في عهد الملك ميريان الثالث في القرن الرابع، ثم بازيليكا في عهد فاختانغ غورغاسالي
    في القرن الخامس. أما الكاتدرائية الحالية، ذات المخطط الصليبي والقبة، فشُيّدت بين عامَي 1010 و1029
    بدعوة من الكاثوليكوس ملكيصادق الأول. وفي عام 1787 أحاطها الملك إريكلي الثاني بالسور ذي الأبراج الذي
    تعبره اليوم. وأغرب ضربة جاءت في ثلاثينيات القرن التاسع عشر، حين طلى موظفون روس جداريات العصور الوسطى
    بالجير الأبيض استعداداً لزيارة القيصر نيقولا الأول، وهي زيارة لم تتم قط. وقد استعاد المرمّمون أجزاءً
    منها، بينها «وحش الرؤيا» من القرن الثالث عشر وصورٌ لأبراج دائرة البروج.


    أمام المذبح يرقد فاختانغ غورغاسالي، وإريكلي الثاني الذي يُعلِّم قبرَه سيفٌ وترس، وابنه غيورغي الثاني
    عشر، آخر ملوك جورجيا. وفي الخارج، على الواجهة الشرقية، يبسط نسرٌ جناحيه فوق أسد، وقد نجا رأسا ثورين
    من كنيسة القرن الخامس.


    تعالَ يوم أحد، حين تُقام معمودية عند أحد الأعمدة وعرسٌ عند العمود المجاور، فتكفّ الكاتدرائية عن أن
    تكون مجرد أثر.
  tip: >-
    يُطبَّق قانون اللباس عند البوابة: غطاء رأس وتنورة للنساء، وسراويل طويلة للرجال، وتُعار الأوشحة عند
    المدخل. صوّر من دون فلاش، ولا تصوّر إطلاقاً أثناء القداس. تعالَ في الصباح الباكر أو بعد الخامسة مساءً
    لتتفادى المجموعات السياحية في منتصف النهار، خصوصاً في الصيف. في الشوارع المحيطة بالأسوار مقاهٍ ودورات
    مياه وأجهزة صرّاف آلي. خصّص ساعتين إن أردت أيضاً التجول في البلدة القديمة والصعود خمس دقائق في الشارع
    إلى دير سامتافرو.
  route: >-
    اسلك الطريق السريع S1 (E60) باتجاه الشمال الغربي من تبليسي، واخرج منه عند مخرج متسخيتا المشار إليه
    بعد نحو 20 كم؛ يعبر الطريق القديم نهر متكفاري ويدخل مباشرة إلى وسط البلدة. المسافة 25 كم ونحو 30 دقيقة
    في حركة مرور عادية، والطريق معبّد بالكامل، فأي سيارة تفي بالغرض. حركة السيارات مقيّدة في النواة التاريخية
    حول الكاتدرائية: اترك سيارتك في أحد المواقف المدفوعة على أطرافها أو قرب النهر، وامشِ دقائق قليلة إلى
    الأسوار، التي ستراها قبل أن تبلغها بوقت طويل. تنتشر محطات الوقود على طول S1.
