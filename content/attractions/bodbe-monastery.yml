ka:
  name: ბოდბის მონასტერი
  short: >-
    წმინდა ნინოს სამარხი ალაზნის ველის თავზე: დაბალი ბაზილიკა კვიპაროსებში, მოქმედი დედათა მონასტერი და
    ციცაბო ბილიკი მის წყარომდე.
  body: >-
    **საქართველოს ქრისტიანობა ქალით დაიწყო და, გადმოცემით, სწორედ აქ განისვენებს იგი.**


    წმინდა ნინო, IV საუკუნის განმანათლებელი, რომელმაც მეფე მირიან III ქრისტიანობაზე მოაქცია, სიცოცხლის
    ბოლოს ბოდბის ხევში განმარტოვდა და აქვე აღესრულა, დაახლოებით 338–340 წლებში. მირიანის ბრძანებით მის
    საფლავზე მცირე მონასტერი აიგო. (ზოგი მეცნიერი ნინოს აღსასრულს ნინოწმინდასთან ვარაუდობს, მაგრამ ეკლესიისა
    და საუკუნეების მომლოცველთათვის ეს ადგილი ბოდბეა.) დღევანდელი სამნავიანი ბაზილიკა IX–XI საუკუნეებში
    აშენდა და მას შემდეგ იმდენჯერ გადაკეთდა — 1615 წელს შაჰ-აბასის ლაშქარმა გაძარცვა, XIX საუკუნის 20-იან
    წლებში ხელახლა მოხატეს, 1880-იან წლებში კვლავ განაახლეს, — რომ მის შელესილ კედლებს ფენა-ფენა ამოიკითხავთ.
    ნინოს საფლავი ტაძრის შიგნითაა, პატარა სამლოცველოში, რომელიც დიდ ბაზილიკას შეერწყა.


    მონასტერი არაერთხელ მოკვდა და კვლავ გაცოცხლდა. 1837 წელს რუსეთის საეგზარქოსომ გააუქმა, 1889 წელს ალექსანდრე
    III-ის ბრძანებით აქ დედათა მონასტერი გაიხსნა, 1924 წელს საბჭოთა ხელისუფლებამ დახურა და საავადმყოფოდ
    აქცია. 1991 წელს მონაზვნები დაბრუნდნენ და დღესაც აქ არიან — მათ გალობას ხშირად კარს მიღმა გაიგონებთ,
    სანამ ვინმეს დაინახავთ.


    გარეთ ბილიკს მუქი კვიპაროსები მიუყვება, გაზონების პირას ვარდები ყვავის, 1862–1885 წლებში აგებული სამსართულიანი
    სამრეკლო კი განცალკევებით დგას. ფოტოაპარატების უმეტესობას დიდი, გაცილებით ახალი გუმბათოვანი ტაძარი
    იზიდავს, ნინო კი დაბალ, ძველ ბაზილიკაში განისვენებს. ტერასიდან ალაზნის ველი ბრტყლად გადაიშლება და
    კავკასიონის კედლამდე მიდის.


    ქვემოთ გრძელი, ციცაბო ბილიკი წმინდა ნინოს წყარომდე ეშვება; 1990-იანი წლებიდან წყაროს ნინოს მშობლების
    — წმინდა ზაბულონისა და სოსანას — სახელობის სამლოცველო ადგას. გადმოცემით, წყარომ ნინოს ლოცვით ამოხეთქა
    და მომლოცველები დღემდე განიბანებიან მასში. უკან, აღმართზე, უმეტესობა ჩუმად ადის — ამაზე ფერდობი თავად
    ზრუნავს.
  tip: >-
    ჩაიცვით ისე, როგორც ნებისმიერ ქართულ დედათა მონასტერში: ქალებს — გრძელი კაბა და თავსაფარი, მამაკაცებს
    — გრძელი შარვალი, მხრები ყველასთვის დაფარული. კართან გადასაფარებელს, როგორც წესი, გაძლევენ, მაგრამ
    საკუთარი მანდილი რიგს აგარიდებთ. მოდით დილით ადრე ან ნაშუადღევს — შუადღისას თბილისიდან ტურისტული ავტობუსები
    ჩამოდის. ბაზილიკაში ფოტოგადაღება შეზღუდულია, ამიტომ ჯერ იკითხეთ. ტაძარს, ბაღსა და ტერასას ორი საათი
    ეყოფა, წყაროს — კიდევ ერთი; ფეხსაცმელი ისეთი ჩაიცვით, რომ ბილიკზე არ მოგისრიალდეთ. თუ განბანვას აპირებთ,
    გრძელი პერანგი და პირსახოცი თან იქონიეთ. წმინდა ნინოს დღესასწაულებზე, 27 იანვარსა და 1 ივნისს, ეზო
    მომლოცველებით ივსება.
  route: >-
    თბილისიდან აღმოსავლეთით, კახეთის გზატკეცილით (ს5), საგარეჯოს გავლით იარეთ. დაახლოებით 94-ე კილომეტრზე
    მარჯვნივ, შ40-ზე გადაუხვიეთ — გზა ვენახებს შორის სიღნაღისკენ ადის; ქალაქის პირას მინიშნებული შ176
    დაახლოებით ერთ კილომეტრში მონასტრის კარიბჭესთან ჩაგიყვანთ. სულ დაახლოებით 112 კმ-ია და ორ საათზე ცოტა
    ნაკლები. გზა ბოლომდე ასფალტიანია, თუმცა ბოლო მონაკვეთი ვიწრო, ციცაბო და მკვეთრი მოსახვევებითაა. ეკონომ-კლასის
    მანქანა ნებისმიერ სეზონზე საკმარისია. საწვავი თბილისში ან საგარეჯოში ჩაასხით. სიღნაღის ცენტრი აქედან
    ხუთ წუთშია, ამიტომ ორივე ერთ გასვლას ეტევა.
en:
  name: Bodbe Monastery
  short: >-
    St Nino's resting place above the Alazani Valley: a low basilica among cypresses, a working convent,
    and a steep path down to her spring.
  body: >-
    **Georgia's Christianity began with a woman, and tradition says this is where she lies.**


    St Nino, the fourth-century evangelist who brought King Mirian III to the faith, withdrew in her last
    years to the gorge of Bodbe and died here around 338–340. Mirian ordered a small monastery raised
    over her grave. (Some scholars place her death near Ninotsminda instead; for the Church and for centuries
    of pilgrims, it is Bodbe.) The three-nave basilica you enter was built between the ninth and eleventh
    centuries and reworked so often since — pillaged by Shah Abbas's troops in 1615, repainted in the
    1820s, restored again in the 1880s — that its plastered walls read in layers. Her tomb lies inside,
    in a small chapel absorbed into the larger church.


    The convent has died and come back more than once. The Russian exarchate abolished it in 1837; Tsar
    Alexander III ordered a nunnery opened in 1889; the Soviets closed it in 1924 and made it a hospital.
    The nuns returned in 1991 and are here still, and you often hear their singing through a door before
    you see anyone.


    Outside, dark cypresses line the path, roses edge the lawns, and a three-storey bell tower of 1862–1885
    stands apart. A much newer, much larger domed church catches most cameras, but Nino rests in the low
    old basilica. From the terrace the Alazani Valley runs flat all the way to the wall of the Caucasus.


    Below, a long, steep path drops to St Nino's Spring, sheltered since the 1990s by a chapel of Saints
    Zabulon and Sosana — her parents. Legend says the water rose at her prayer, and pilgrims still bathe
    in it. Most walk back up in silence; the gradient sees to that.
  tip: >-
    Dress as for any Georgian convent: a long skirt and headscarf for women, long trousers for men, shoulders
    covered. Wraps are usually lent at the gate, but your own scarf saves a queue. Come early in the morning
    or late in the afternoon — midday brings the coaches from Tbilisi. Photography inside the basilica
    is restricted, so ask first. Allow two hours for the church, garden and terrace, and one more for
    the spring, in shoes with grip. If you mean to bathe, bring a long shirt and a towel. On St Nino's
    feasts, 27 January and 1 June, the grounds fill with pilgrims.
  route: >-
    From Tbilisi follow the S5 Kakheti highway east through Sagarejo. About 94 km out, turn right onto
    the Sh40, which climbs through vineyards towards Sighnaghi; at the edge of the town the signposted
    Sh176 drops a kilometre or so to the monastery gate. In all it is about 112 km and just under two
    hours. It is asphalt the whole way, though the final stretch is narrow, steep and tightly curved.
    An economy car is fine in any season. Fill up in Tbilisi or Sagarejo. Sighnaghi's centre is five minutes
    back up the hill, so the two make a single outing.
ru:
  name: Монастырь Бодбе
  short: >-
    Место упокоения Святой Нино над Алазанской долиной: невысокая базилика среди кипарисов, действующий
    женский монастырь и крутая тропа к её источнику.
  body: >-
    **Христианство Грузии началось с женщины, и, по преданию, именно здесь она покоится.**


    Святая Нино, просветительница IV века, обратившая в веру царя Мириана III, в последние годы жизни
    удалилась в ущелье Бодбе и скончалась здесь около 338–340 года. Мириан повелел возвести над её могилой
    небольшой монастырь. (Некоторые учёные полагают, что она скончалась у Ниноцминды, но для церкви и
    многих поколений паломников это Бодбе.) Трёхнефная базилика, в которую вы входите, была построена
    между IX и XI веками и с тех пор столько раз перестраивалась — разграблена войсками шаха Аббаса в
    1615 году, расписана заново в 1820-х, снова отреставрирована в 1880-х, — что её оштукатуренные стены
    читаются слоями. Гробница Нино находится внутри, в маленьком приделе, вошедшем в состав большей церкви.


    Монастырь не раз умирал и возрождался. Русский экзархат упразднил его в 1837 году; по указу царя Александра
    III в 1889 году здесь открыли женскую обитель; советская власть закрыла её в 1924-м и устроила в здании
    больницу. Монахини вернулись в 1991 году и остаются здесь до сих пор — их пение часто слышно из-за
    двери раньше, чем вы кого-нибудь увидите.


    Снаружи вдоль тропы стоят тёмные кипарисы, розы обрамляют газоны, а трёхъярусная колокольня 1862–1885
    годов стоит отдельно. Гораздо более новый и куда более крупный купольный храм притягивает большинство
    фотоаппаратов, но сама Нино покоится в низкой старой базилике. С террасы Алазанская долина плоско
    тянется до самой стены Кавказа.


    Внизу длинная крутая тропа спускается к источнику Святой Нино, укрытому с 1990-х годов часовней святых
    Завулона и Сосаны — её родителей. Легенда говорит, что вода забила по её молитве, и паломники до сих
    пор в ней купаются. Большинство поднимается обратно молча — об этом заботится сам склон.
  tip: >-
    Одевайтесь так же, как для любого грузинского женского монастыря: длинная юбка и платок для женщин,
    длинные брюки для мужчин, плечи закрыты. У ворот обычно дают накидки, но собственный шарф избавит
    от очереди. Приезжайте ранним утром или под вечер — в середине дня приходят автобусы из Тбилиси. Фотосъёмка
    внутри базилики ограничена, так что сначала спросите разрешения. На церковь, сад и террасу отведите
    два часа, ещё час — на источник, в обуви с хорошим сцеплением. Если собираетесь купаться, возьмите
    длинную рубашку и полотенце. На праздники Святой Нино, 27 января и 1 июня, территория заполняется
    паломниками.
  route: >-
    Из Тбилиси по Кахетинской трассе S5 на восток, через Сагареджо. Примерно через 94 км поверните направо
    на Sh40, которая поднимается сквозь виноградники к Сигнахи; на краю города по указателю сворачивайте
    на Sh176, которая спускается около километра к воротам монастыря. Всего это около 112 км и чуть меньше
    двух часов. Дорога асфальтирована на всём протяжении, хотя последний участок узкий, крутой и извилистый,
    с резкими поворотами. Машины эконом-класса достаточно в любой сезон. Заправьтесь в Тбилиси или Сагареджо.
    Центр Сигнахи — пять минут наверх по склону, так что оба места легко объединить в одну поездку.
fa:
  name: صومعه‌ی بودبه
  short: >-
    آرامگاه نینوی قدیسه بالای دشت آلازانی: بازیلیکایی کوتاه در میان سروها، صومعه‌ای فعال، و مسیری پرشیب
    رو به چشمه‌ی او.
  body: >-
    **مسیحیت گرجستان با زنی آغاز شد، و روایت است که او همین‌جا آرمیده است.**


    نینوی قدیسه، مبشّر سده‌ی چهارم که پادشاه میریان سوم را به این کیش گروانید، در سال‌های پایانی زندگی
    به دره‌ی بودبه رخت کشید و در همین‌جا، نزدیک به سال‌های ۳۳۸ تا ۳۴۰، درگذشت. میریان فرمان داد بر گور
    او صومعه‌ای کوچک بنا شود. (برخی پژوهشگران درگذشت او را نزدیک نینوتسمیندا می‌دانند، اما برای کلیسا
    و برای سده‌ها زائر، این‌جا همان بودبه است.) بازیلیکای سه‌ناوه‌ای که به آن گام می‌گذارید، میان سده‌های
    نهم و یازدهم بنا شد و از آن پس چندان بازسازی شد — در سال ۱۶۱۵ سپاه شاه‌عباس آن را غارت کرد، در دهه‌ی
    ۱۸۲۰ دوباره نگارگری شد، در دهه‌ی ۱۸۸۰ بار دیگر بازسازی شد — که دیوارهای گچ‌کاری‌شده‌اش لایه‌لایه خوانده
    می‌شوند. مقبره‌ی او درون کلیسا، در نمازخانه‌ای کوچک که به کلیسای بزرگ‌تر پیوسته، جای دارد.


    صومعه بیش از یک‌بار مرده و دوباره زنده شده است. اگزارخیتِ کلیسای روسیه در گرجستان آن را در سال ۱۸۳۷
    منحل کرد؛ تزار الکساندر سوم فرمان داد در سال ۱۸۸۹ دیرِ زنان در آن گشوده شود؛ شوروی در سال ۱۹۲۴ آن
    را بست و به بیمارستان بدل کرد. راهبه‌ها در سال ۱۹۹۱ بازگشتند و هنوز اینجایند — سرودشان را غالباً از
    پس دری می‌شنوید، پیش از آنکه کسی را ببینید.


    بیرون، سروهای تیره در امتداد مسیر صف کشیده‌اند، گل‌سرخ‌ها لبه‌ی چمنزارها را می‌آرایند، و ناقوس‌خانه‌ی
    سه‌طبقه‌ای که در سال‌های ۱۸۶۲ تا ۱۸۸۵ ساخته شده، جدا از بقیه ایستاده است. کلیسایی گنبددار بسیار تازه‌تر
    و بسیار بزرگ‌تر بیشتر دوربین‌ها را می‌رباید، اما نینو در همان بازیلیکای کهن و کوتاه آرمیده است. از
    تراس، دشت آلازانی مسطح تا دیواره‌ی قفقاز پیش می‌رود.


    در پایین، مسیری بلند و پرشیب به چشمه‌ی نینوی قدیسه می‌رسد، که از دهه‌ی ۱۹۹۰ نمازخانه‌ای به‌نام قدیسان
    زابولون و سوسانا — والدین او — آن را در پناه گرفته است. افسانه می‌گوید آب به دعای او جوشید، و زائران
    هنوز در آن غسل می‌کنند. بیشتر آن‌ها در سکوت بازمی‌گردند — شیب خود ترتیبش را می‌دهد.
  tip: >-
    مانند هر صومعه‌ی زنان گرجی بپوشید: برای زنان دامنی بلند و روسری، برای مردان شلواری بلند، شانه‌ها همه
    پوشیده. کنار دروازه معمولاً شنلی به شما می‌دهند، اما روسری خودتان از صف‌ایستادن می‌کاهد. صبح زود یا
    اواخر بعدازظهر بیایید — نیمروز اتوبوس‌های گردشگری از تفلیس می‌رسند. عکس‌برداری درون بازیلیکا محدود
    است، پس نخست بپرسید. برای کلیسا، باغ و تراس دو ساعت در نظر بگیرید، و یک ساعت دیگر برای چشمه، با کفشی
    که لیز نخورد. اگر قصد غسل دارید، پیراهنی بلند و حوله همراه ببرید. در روزهای عید نینوی قدیسه، ۲۷ ژانویه
    و ۱ ژوئن، محوطه از زائران پر می‌شود.
  route: >-
    از تفلیس از بزرگراه کاختی S5 به سوی شرق، از ساگارجو بگذرید. پس از حدود ۹۴ کیلومتر، به راست به Sh40
    بپیوندید، که از میان تاکستان‌ها به‌سوی سیغناغی بالا می‌رود؛ در کناره‌ی شهر، بر پایه‌ی تابلوهای راهنما
    به Sh176 بپیچید، که نزدیک به یک کیلومتر تا دروازه‌ی صومعه پایین می‌رود. در مجموع نزدیک به ۱۱۲ کیلومتر
    و اندکی کمتر از دو ساعت است. تمام مسیر آسفالته است، هرچند بخش پایانی تنگ، پرشیب و پرپیچ است. خودروی
    اقتصادی در هر فصل کافی است. در تفلیس یا ساگارجو سوخت‌گیری کنید. مرکز سیغناغی پنج دقیقه بالاتر از همین
    جاده است، پس هر دو را در یک سفر جا دهید.
he:
  name: מנזר בודבה
  short: 'מקום מנוחתה של הקדושה נינו מעל עמק אלזני: בזיליקה נמוכה בין ברושים, מנזר פעיל, ושביל תלול היורד
    למעיינה.'
  body: >-
    **הנצרות בגאורגיה התחילה באישה, והמסורת מספרת שכאן היא טמונה.**


    הקדושה נינו, המבשרת מהמאה הרביעית שהביאה את המלך מיריאן השלישי לאמונה, התבודדה בשנותיה האחרונות בעמק
    בודבה ומתה כאן בסביבות 338–340. מיריאן הורה להקים מנזר קטן מעל קברה. (חלק מהחוקרים ממקמים את מותה
    בקרבת נינוצמינדה, אבל לכנסייה ולדורות של עולי רגל, זהו בודבה.) הבזיליקה התלת-ספינתית שאתם נכנסים אליה
    נבנתה בין המאות התשיעית לאחת-עשרה ומאז עוצבה מחדש פעמים רבות כל כך — נבזזה בידי חיילי שאה עבאס ב-1615,
    נצבעה מחדש בשנות ה-1820, שוחזרה שוב בשנות ה-1880 — עד שאת קירותיה המטויחים אפשר לקרוא שכבה אחר שכבה.
    קברה שוכן בפנים, בקפלה קטנה שנקלטה בתוך הכנסייה הגדולה יותר.


    המנזר מת וקם לתחייה יותר מפעם אחת. האקסרכט הרוסי ביטל אותו ב-1837; הצאר אלכסנדר השלישי הורה לפתוח
    בו מנזר נשים ב-1889; הסובייטים סגרו אותו ב-1924 והפכוהו לבית חולים. הנזירות חזרו ב-1991 ונשארות כאן
    עד היום — לעיתים קרובות שומעים את שירתן מבעד לדלת לפני שרואים מישהו.


    בחוץ, ברושים כהים מלווים את השביל, ורדים גובלים במדשאות, ומגדל פעמונים תלת-קומתי משנות 1862–1885 עומד
    בנפרד. כנסייה כיפתית חדשה בהרבה וגדולה בהרבה מושכת את רוב המצלמות, אבל נינו נחה בבזיליקה הישנה והנמוכה.
    מהמרפסת נמשך עמק אלזני שטוח עד חומת הקווקז.


    מתחת, שביל ארוך ותלול יורד למעיין הקדושה נינו, המוגן משנות ה-1990 בקפלה של הקדושים זבולון וסוסנה —
    הוריה. האגדה מספרת שהמים עלו בזכות תפילתה, ועולי רגל עדיין טובלים בהם. רוב האנשים חוזרים בדממה — המדרון
    כבר דואג לכך.
  tip: >-
    התלבשו כמו בכל מנזר נשים גאורגי: חצאית ארוכה ומטפחת ראש לנשים, מכנסיים ארוכים לגברים, כתפיים מכוסות
    לכולם. בשער נותנים בדרך כלל עטיפות, אבל צעיף משלכם חוסך תור. הגיעו בבוקר מוקדם או בשעות אחר הצהריים
    המאוחרות — בשעות הצהריים מגיעים האוטובוסים מטביליסי. צילום בתוך הבזיליקה מוגבל, אז שאלו קודם. הקציבו
    שעתיים לכנסייה, לגן ולמרפסת, ועוד שעה למעיין, בנעליים עם אחיזה טובה. אם אתם מתכוונים לטבול, הביאו
    חולצה ארוכה ומגבת. בחגי הקדושה נינו, 27 בינואר וה-1 ביוני, השטח מתמלא בעולי רגל.
  route: >-
    מטביליסי קחו את כביש קאחתי S5 מזרחה, דרך סגרג'ו. אחרי כ-94 ק"מ פנו ימינה ל-Sh40, המטפס בין הכרמים
    לכיוון סיגנאגי; בקצה העיר, לפי השילוט, פנו ל-Sh176, היורד כקילומטר לשער המנזר. בסך הכול זה כ-112 ק"מ
    ומעט פחות משעתיים. הכביש אספלט כל הדרך, אף שהקטע האחרון צר, תלול ומתפתל בחדות. רכב חסכוני מספיק בכל
    עונה. תדלקו בטביליסי או בסגרג'ו. מרכז סיגנאגי נמצא חמש דקות במעלה הגבעה, כך ששני היעדים משתלבים בנסיעה
    אחת.
ar:
  name: دير بودبي
  short: >-
    مثوى القديسة نينو فوق وادي ألازاني: بازيليك منخفض بين أشجار السرو، ودير نساء ناشط، ومسار شديد الانحدار
    ينزل إلى نبعها.
  body: >-
    **بدأت المسيحية في جورجيا بامرأة، وتقول التقاليد إنها ترقد هنا.**


    القديسة نينو، المبشّرة في القرن الرابع التي هدت الملك ميريان الثالث إلى الإيمان، انزوت في سنواتها
    الأخيرة في وادي بودبي وتوفيت هنا نحو عام 338–340. أمر ميريان ببناء دير صغير فوق قبرها. (يضع بعض الباحثين
    وفاتها بالقرب من نينوتسميندا، لكنها بودبي عند الكنيسة وعند أجيال من الحجّاج.) بُني البازيليك الثلاثي
    الأصحن الذي تدخله بين القرنين التاسع والحادي عشر، وأُعيد تشكيله منذ ذلك الحين مرارًا — نهبته قوات
    الشاه عباس عام 1615، ورُسم من جديد في عشرينيات القرن التاسع عشر، ورُمِّم مرة أخرى في ثمانينياته —
    حتى أصبحت جدرانه المُجصَّصة تُقرأ كطبقات. يقع ضريحها في الداخل، في مصلّى صغير استُوعب في الكنيسة الأكبر.


    مات الدير وعاد إلى الحياة أكثر من مرة. أبطلته إكسرخوسية الكنيسة الروسية عام 1837؛ وأمر القيصر ألكسندر
    الثالث بفتح دير نساء فيه عام 1889؛ وأغلقه السوفييت عام 1924 وحوّلوه إلى مستشفى. عادت الراهبات عام
    1991 وما زلن هنا — وغالبًا ما تسمع ترتيلهن من خلف الباب قبل أن ترى أحدًا.


    في الخارج، تحفّ أشجار سرو داكنة بالمسار، ويحيط الورد بالمروج، ويقف برج جرس من ثلاث طبقات يعود إلى
    1862–1885 منفصلًا. وتجذب كنيسة أحدث وأكبر بكثير ذات قبة معظم الكاميرات، لكن نينو ترقد في البازيليك
    القديم المنخفض. ومن الشرفة يمتد وادي ألازاني مسطحًا حتى جدار القوقاز.


    في الأسفل، ينزل مسار طويل شديد الانحدار إلى نبع القديسة نينو، الذي يحميه منذ التسعينيات مصلّى القديسين
    زابولون وسوسانا — والديها. تقول الأسطورة إن الماء نبع بصلاتها، وما زال الحجّاج يغتسلون فيه. يصعد معظمهم
    عائدين في صمت — والمنحدر نفسه يتكفّل بذلك.
  tip: >-
    الْبَس كما تفعل في أي دير نساء جورجي: تنورة طويلة ووشاح للرأس للنساء، بنطال طويل للرجال، والأكتاف
    مغطاة للجميع. عادةً تُقرَض أوشحة عند البوابة، لكن وشاحك الخاص يوفّر عليك الانتظار في الطابور. تعالَ
    في الصباح الباكر أو أواخر بعد الظهر — يجلب الظهر حافلات السياح من تبليسي. التصوير داخل البازيليك مقيَّد،
    فاسأل أولًا. خصّص ساعتين للكنيسة والحديقة والشرفة، وساعة أخرى للنبع، بحذاء لا ينزلق. إن كنت تنوي الاغتسال
    في النبع، احمل قميصًا طويلًا ومنشفة. في أعياد القديسة نينو، 27 يناير و1 يونيو، تمتلئ الأرجاء بالحجّاج.
  route: >-
    من تبليسي اسلك طريق كاخيتي السريع S5 شرقًا، عبر ساغاريجو. بعد نحو 94 كم انعطف يمينًا إلى Sh40، الذي
    يصعد بين الكروم نحو سيغناغي؛ عند حافة المدينة، وبحسب اللوحات، انعطف إلى Sh176، الذي ينزل نحو كيلومتر
    واحد إلى بوابة الدير. المسافة الإجمالية نحو 112 كم وأقل بقليل من ساعتين. الطريق مُعبّد بالكامل، مع
    أن المقطع الأخير ضيق وشديد الانحدار وكثير المنعرجات. سيارة اقتصادية كافية في أي فصل. تزوّد بالوقود
    في تبليسي أو ساغاريجو. مركز سيغناغي على بُعد خمس دقائق صعودًا، فأدرج الوجهتين في رحلة واحدة.
