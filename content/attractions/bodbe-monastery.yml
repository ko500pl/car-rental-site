ka:
  name: ბოდბის მონასტერი
  short: წმინდა ნინოს საძვალე სიღნაღის გვერდით — კახეთის ერთ-ერთი მთავარი სალოცავი და კიპარისების ხეივანი.
  body: >-
    ბოდბე სიღნაღიდან სულ ორიოდე კილომეტრშია და ორივე ერთ დღეში ბუნებრივად ლაგდება. მონასტერი წმინდა ნინოს,
    საქართველოს განმანათლებლის, საძვალეზეა აშენებული — გადმოცემით, IV საუკუნეში სწორედ აქ დაასაფლავეს.
    პირველი ტაძარი მეფე მირიანს მიეწერება; დღევანდელი სამნავიანი ბაზილიკა ძირითადად IX საუკუნისაა, არაერთხელ
    გადაკეთებული, ხოლო სამრეკლო XIX საუკუნეში დაემატა.


    ტერიტორია მოწესრიგებული და მშვიდია. შესასვლელიდან ტაძრამდე კიპარისების ხეივანი მიდის, გვერდით ვარდების
    ბაღი და ვრცელი ხედი ალაზნის ველზე. თავად ბაზილიკაში წმინდა ნინოს სამარხია მარჯვენა ნავში, კედლები
    კი XIX საუკუნის მოხატულობას ინარჩუნებს. მონასტერი მოქმედია — აქ დედათა სავანეა, ამიტომ ტერიტორიაზე
    სიჩუმეა და ფოტოგრაფირება ტაძრის შიგნით შეზღუდულია.


    მრავალი მომლოცველი მონასტრიდან ბილიკით ქვევით ეშვება წმინდა ნინოს წყაროსთან. დაღმართი დაახლოებით ოცი
    წუთია, ასვლა კი ცხელ დღეს საგრძნობლად რთულია — ბილიკი ციცაბოა და ჩრდილი მცირე. წყაროსთან პატარა სამლოცველო
    და აუზია, სადაც სურვილის შემთხვევაში ჩაძირვა შეიძლება; ამისთვის საკუთარი პერანგი და პირსახოცი უნდა
    წაიღოთ. ბოდბე მოქმედი სასულიერო ცენტრია და აქ მთელი წლის განმავლობაში ჩამოდიან მომლოცველები საქართველოს
    ყველა კუთხიდან, განსაკუთრებით კი წმინდა ნინოს ხსენების დღეებში. სწორედ ამიტომ ადგილის განწყობა უფრო
    სალოცავისაა, ვიდრე მუზეუმის, და ეს დათვალიერების ტემპსაც კარნახობს.
  tip: >-
    მონასტერში ჩაცმის წესია: ქალებს გრძელი კაბა და თავსაბურავი, მამაკაცებს გრძელი შარვალი — შესასვლელთან
    ჩვეულებრივ დევს გასახვევები, მაგრამ საკუთარი შარფი მაინც სჯობს. მოდით დილით ან შუადღის შემდეგ, შუადღისას
    ავტობუსების ნაკადია. მანქანა შესასვლელთანვე დგება, უფასოდ. ორი საათი ეყოფა ტაძარს, ბაღს და ხედს; წყაროზე
    ჩასვლა კიდევ საათს მატებს და მოსახერხებელი ფეხსაცმელი აუცილებელია.
  route: >-
    მარშრუტი იგივეა, რაც სიღნაღში: კახეთის გზატკეცილი საგარეჯოს, ბადიაურისა და წნორის გავლით, სულ 112
    კმ და დაახლოებით ორი საათი. ბოდბის მოსახვევი სიღნაღამდე ცოტა ადრეა და კარგად არის მინიშნებული; მონასტრამდე
    ბოლო ორი კილომეტრი ვიწრო, მაგრამ ასფალტიანი გზაა. ეკონომ კლასის მანქანა სავსებით საკმარისია. საწვავს
    ავსებთ წნორში ან გურჯაანში. სიღნაღი აქედან ხუთ წუთშია, ამიტომ ორივე ერთ გასვლაში აერთიანება.
en:
  name: Bodbe Monastery
  short: >-
    The burial place of St Nino beside Sighnaghi — one of Kakheti's most visited shrines, with a cypress
    avenue and valley views.
  body: >-
    Bodbe lies barely two kilometres from Sighnaghi, so the two fit naturally into one outing. The monastery
    was built over the grave of **St Nino**, the woman credited with converting Georgia to Christianity
    in the fourth century; tradition places her burial precisely here. The first church is attributed
    to King Mirian, while the three-nave basilica standing today is largely ninth-century, reworked several
    times, with a bell tower added in the nineteenth.


    The grounds are calm and carefully kept. A cypress avenue runs from the gate to the church, a rose
    garden sits alongside it, and the terrace at the far end opens onto a wide view over the Alazani Valley.
    Inside the basilica, St Nino's tomb occupies the right-hand nave and the walls keep their nineteenth-century
    painting. This is a working convent, so the atmosphere is quiet and photography inside the church
    is restricted.


    Many pilgrims continue down a footpath below the monastery to St Nino's Spring. The descent takes
    around twenty minutes; the climb back is noticeably harder on a hot day, since the trail is steep
    with little shade. At the bottom there is a small chapel and a pool where visitors may immerse themselves
    — if you intend to, bring your own shirt and towel, as nothing is provided.
  tip: >-
    A dress code applies: women need a long skirt and a head covering, men long trousers. Wraps are usually
    available at the entrance, but bringing your own scarf saves waiting. Come early in the morning or
    later in the afternoon; midday brings a steady flow of tour coaches. Parking sits right at the gate
    and is free. Two hours covers the church, the garden and the viewpoint; adding the spring costs another
    hour and needs decent footwear.
  route: >-
    The drive is the same as for Sighnaghi: the Kakheti Highway through Sagarejo, Badiauri and on past
    Tsnori, roughly 112 km and just under two hours. The Bodbe turning comes shortly before Sighnaghi
    itself and is clearly signposted; the last two kilometres are a narrow but properly surfaced lane.
    An economy car is fine throughout. Fill up in Tsnori or Gurjaani, where stations are frequent. Sighnaghi
    is five minutes further on, so almost everyone combines the two in a single trip.
ru:
  name: Монастырь Бодбе
  short: >-
    Место погребения святой Нино рядом с Сигнахи — одна из главных святынь Кахетии, кипарисовая аллея
    и вид на долину.
  body: >-
    Бодбе находится всего в двух километрах от Сигнахи, поэтому оба места естественно укладываются в одну
    поездку. Монастырь построен над могилой **святой Нино**, просветительницы Грузии; предание относит
    её погребение именно сюда, к IV веку. Первый храм приписывают царю Мириану, нынешняя трёхнефная базилика
    в основе своей относится к IX веку и не раз перестраивалась, а колокольня добавлена в XIX столетии.


    Территория ухоженная и очень спокойная. От ворот к храму ведёт кипарисовая аллея, рядом розарий, а
    дальняя терраса открывается широким видом на Алазанскую долину. Внутри базилики гробница святой Нино
    занимает правый неф, стены сохраняют роспись XIX века. Это действующий женский монастырь, поэтому
    здесь тихо, а съёмка внутри храма ограничена.


    Многие паломники спускаются по тропе ниже монастыря к источнику святой Нино. Спуск занимает около
    двадцати минут, обратный подъём в жаркий день заметно тяжелее: тропа крутая, тени почти нет. Внизу
    небольшая часовня и купель, где при желании можно окунуться, — но рубашку и полотенце нужно брать
    с собой, на месте их не выдают.
  tip: >-
    В монастыре действует дресс-код: женщинам длинная юбка и платок, мужчинам длинные брюки. У входа обычно
    лежат накидки, но свой шарф избавит от ожидания. Приезжайте утром или ближе к вечеру — в середине
    дня идёт поток экскурсионных автобусов. Парковка прямо у ворот, бесплатная. Двух часов хватит на храм,
    сад и смотровую площадку; спуск к источнику добавит ещё час и потребует нормальной обуви.
  route: >-
    Дорога та же, что и в Сигнахи: Кахетинское шоссе через Сагареджо, Бадиаури и далее мимо Цнори — примерно
    112 км, чуть меньше двух часов. Поворот на Бодбе идёт незадолго до самого Сигнахи и хорошо обозначен
    указателем; последние два километра — узкая, но асфальтированная дорога. Машины эконом-класса достаточно
    на всём маршруте. Заправиться удобно в Цнори или Гурджаани. Сигнахи отсюда в пяти минутах езды, поэтому
    почти все объединяют оба места в один выезд.
fa:
  name: صومعهٔ بودبه
  short: آرامگاه سنت نینو کنار سیغناغی — از پربازدیدترین زیارتگاه‌های کاختی، با خیابان سروها و منظرهٔ
    دره.
  body: >-
    بودبه به‌سختی دو کیلومتر با سیغناغی فاصله دارد، پس این دو به‌طور طبیعی در یک گشت جا می‌شوند. صومعه
    بر گور **سنت نینو** ساخته شد، زنی که گرواندن گرجستان به مسیحیت در سدهٔ چهارم به او نسبت داده می‌شود؛
    سنت محل تدفین او را دقیقاً همین‌جا می‌داند. نخستین کلیسا به شاه میریان منسوب است، در حالی که باسیلیکای
    سه‌شبستانی امروزی عمدتاً از سدهٔ نهم است، چند بار بازسازی شده و برج ناقوسش در سدهٔ نوزدهم افزوده شده
    است.


    محوطه آرام و با دقت نگهداری می‌شود. خیابانی از سروها از دروازه تا کلیسا کشیده شده، گلستانی از رز کنار
    آن است و مصطبهٔ انتهایی به منظره‌ای پهن بر درهٔ آلازانی باز می‌شود. درون باسیلیکا، آرامگاه سنت نینو
    در شبستان راست قرار دارد و دیوارها نقاشی سدهٔ نوزدهم خود را نگه داشته‌اند. اینجا دیر فعال راهبه‌هاست،
    پس فضا ساکت است و عکاسی درون کلیسا محدود.


    بسیاری از زائران از راه پیاده‌ای زیر صومعه تا چشمهٔ سنت نینو پایین می‌روند. پایین رفتن حدود بیست دقیقه
    است؛ بالا آمدن در روز گرم به‌مراتب سخت‌تر است، چون مسیر تند و کم‌سایه است. پایین نمازخانه‌ای کوچک
    و حوضی هست که بازدیدکنندگان می‌توانند در آن غوطه بخورند — اگر قصدش را دارید، پیراهن و حولهٔ خودتان
    را بیاورید، چون چیزی در محل داده نمی‌شود.
  tip: >-
    قواعد پوشش برقرار است: زنان به دامن بلند و روسری نیاز دارند، مردان به شلوار بلند. شال معمولاً در ورودی
    هست، اما آوردن روسری خودتان از انتظار جلوگیری می‌کند. صبح زود یا بعدازظهر دیر بیایید؛ ظهر جریان پیوسته‌ای
    از اتوبوس‌های تور می‌رسد. پارکینگ درست کنار دروازه و رایگان است. دو ساعت کلیسا، باغ و نقطهٔ دید را
    پوشش می‌دهد؛ افزودن چشمه یک ساعت دیگر می‌گیرد و کفش مناسب می‌خواهد.
  route: >-
    مسیر همان مسیر سیغناغی است: بزرگراه کاختی از راه ساگارجو و بادیااوری و سپس از کنار تسنوری، حدود 112
    کیلومتر و کمی کمتر از دو ساعت. انشعاب بودبه اندکی پیش از خود سیغناغی می‌آید و تابلوی روشنی دارد؛ دو
    کیلومتر آخر کوچه‌ای باریک اما درست آسفالت‌شده است. خودروی اقتصادی در سراسر مسیر مناسب است. باک را
    در تسنوری یا گورجاانی پر کنید که پمپ‌بنزین‌ها پرشمارند. سیغناغی پنج دقیقه جلوتر است، پس تقریباً همه
    این دو را در یک سفر ترکیب می‌کنند.
he:
  name: מנזר בודבה
  short: >-
    מקום קבורתה של נינו הקדושה ליד סיגנאגי — מן המקומות הקדושים המבוקרים ביותר בקחתי, עם שדרת ברושים ותצפית
    על העמק.
  body: >-
    בודבה נמצא במרחק שני קילומטרים בלבד מסיגנאגי, ולכן השניים משתלבים באופן טבעי ביציאה אחת. המנזר נבנה
    מעל קברה של **נינו הקדושה**, האישה שנחשבת למי שהביאה את גאורגיה לנצרות במאה הרביעית; המסורת ממקמת
    את קבורתה בדיוק כאן. הכנסייה הראשונה מיוחסת למלך מיריאן, ואילו הבזיליקה תלת-האולמית העומדת היום היא
    ברובה מן המאה התשיעית, עברה עיבודים אחדים, ומגדל הפעמונים נוסף לה במאה ה-19.


    המתחם רגוע ומטופח בקפידה. שדרת ברושים מוליכה מן השער אל הכנסייה, גן ורדים משתרע לצידה, והמרפסת בקצה
    נפתחת אל נוף רחב על עמק אלאזני. בתוך הבזיליקה נמצא קברה של נינו הקדושה באולם הימני, והקירות שומרים
    על ציוריהם מן המאה ה-19. זהו מנזר נשים פעיל, ולכן האווירה שקטה והצילום בתוך הכנסייה מוגבל.


    עולי רגל רבים ממשיכים בשביל היורד מתחת למנזר אל מעיין נינו הקדושה. הירידה אורכת כעשרים דקות; העלייה
    חזרה קשה בהרבה ביום חם, שכן השביל תלול וכמעט ללא צל. למטה יש קפלה קטנה ובריכה שאפשר לטבול בה — אם
    בכוונתכם לעשות זאת, הביאו חולצה ומגבת משלכם, כי לא מספקים דבר במקום.
  tip: >-
    חל קוד לבוש: נשים זקוקות לחצאית ארוכה ולכיסוי ראש, גברים למכנסיים ארוכים. מטפחות זמינות בדרך כלל בכניסה,
    אבל מטפחת משלכם חוסכת המתנה. הגיעו מוקדם בבוקר או מאוחר אחר הצהריים; בצהריים מגיע זרם קבוע של אוטובוסי
    תיירים. החניה ממש בשער וללא תשלום. שעתיים מכסות את הכנסייה, הגן ונקודת התצפית; תוספת המעיין דורשת
    שעה נוספת ונעליים סבירות.
  route: >-
    הנסיעה זהה לזו של סיגנאגי: כביש קחתי דרך סאגארג'ו ובאדיאורי והלאה מעבר לצנורי, כ-112 ק״מ וקצת פחות
    משעתיים. הפנייה לבודבה מגיעה מעט לפני סיגנאגי עצמה והשילוט ברור; שני הקילומטרים האחרונים הם דרך צרה
    אך סלולה כהלכה. רכב חסכוני מתאים לכל המסלול. תדלקו בצנורי או בגורג'אני, שם התחנות תכופות. סיגנאגי
    נמצאת חמש דקות הלאה, ולכן כמעט כולם משלבים את השניים בנסיעה אחת.
ar:
  name: دير بودبي
  short: مدفن القديسة نينو قرب سيغناغي — من أكثر مزارات كاخيتي زيارة، بجادة سرو وإطلالات على الوادي.
  body: >-
    لا يبعد بودبي عن سيغناغي سوى كيلومترين، فيتلاءم الموقعان طبيعياً في جولة واحدة. بُني الدير فوق قبر
    **القديسة نينو**، المرأة التي يُنسب إليها تحويل جورجيا إلى المسيحية في القرن الرابع؛ وتضع الرواية
    موضع دفنها هنا بالتحديد. وتُنسب الكنيسة الأولى إلى الملك ميريان، أما البازيليكا ذات الصحون الثلاثة
    القائمة اليوم فترجع في معظمها إلى القرن التاسع، وقد أُعيدت صياغتها مرات، وأُضيف إليها برج أجراس في
    القرن التاسع عشر.


    الساحات هادئة ومعتنى بها بدقة. تمتد جادة من أشجار السرو من البوابة إلى الكنيسة، وإلى جانبها حديقة
    ورد، وتنفتح المصطبة في الطرف البعيد على إطلالة واسعة على وادي ألازاني. وداخل البازيليكا يشغل قبر القديسة
    نينو الصحن الأيمن، وتحتفظ الجدران برسومها من القرن التاسع عشر. وهذا دير راهبات عامل، فالأجواء هادئة
    والتصوير داخل الكنيسة مقيد.


    ويواصل كثير من الحجاج النزول على درب أسفل الدير إلى نبع القديسة نينو. يستغرق النزول نحو عشرين دقيقة؛
    أما الصعود فأشق بوضوح في يوم حار، لأن الدرب حاد وقليل الظل. وفي الأسفل مصلى صغير وحوض يمكن للزوار
    الاغتسال فيه — وإن كنت تنوي ذلك فأحضر قميصك ومنشفتك، إذ لا يُوفَّر شيء هناك.
  tip: >-
    تُطبق قواعد اللباس: تحتاج النساء إلى تنورة طويلة وغطاء رأس، والرجال إلى سروال طويل. والأغطية متاحة
    عادة عند المدخل، لكن إحضار غطاء رأسك يوفر عليك الانتظار. تعال في الصباح الباكر أو في وقت متأخر من
    العصر؛ فالظهيرة تجلب تدفقاً متواصلاً من حافلات الجولات. والموقف عند البوابة مباشرة ومجاني. ساعتان
    تغطيان الكنيسة والحديقة والمطل؛ وإضافة النبع تكلف ساعة أخرى وتحتاج حذاءً مناسباً.
  route: >-
    القيادة هي نفسها المؤدية إلى سيغناغي: طريق كاخيتي عبر ساغاريجو وباديوري ثم بعد تسنوري، نحو 112 كم
    وأقل قليلاً من ساعتين. ويأتي منعطف بودبي قبل سيغناغي بقليل وعليه لافتة واضحة؛ والكيلومتران الأخيران
    طريق ضيق لكنه معبّد جيداً. وسيارة اقتصادية مناسبة طوال الطريق. املأ الخزان في تسنوري أو غورجاني حيث
    المحطات كثيرة. وسيغناغي على بعد خمس دقائق أبعد، فيجمع الجميع تقريباً بين الموقعين في رحلة واحدة.
