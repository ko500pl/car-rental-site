ka:
  name: ქართლის დედა
  short: 20-მეტრიანი ალუმინის ქალაქის სიმბოლო სოლოლაკის ქედზე — ღვინის თასით, ხმლითა და თბილისის საუკეთესო
    ხედით.
  body: >-
    **ქართლის დედა თბილისს ისე დაჰყურებს, როგორც ქალაქის მთავარი სიმბოლო** — 20-მეტრიანი ალუმინის ფიგურა
    სოლოლაკის ქედზე, რომელიც თითქმის ყველა ხედში ჩანს და რომლის ძირიდანაც ძველი ქალაქი პანორამულად იშლება.


    ძეგლი 1958 წელს, თბილისის დაარსების 1500 წლისთავზე დაიდგა; ავტორი მოქანდაკე ელგუჯა ამაშუკელია. თავდაპირველად
    ფიგურა ხის იყო, 1963 წელს ალუმინით შეიმოსა, 1997 წელს კი მთლიანად ახლით შეიცვალა. სიმბოლიკა ცნობილია:
    მარცხენა ხელში ღვინის თასი უჭირავს სტუმრისთვის, მარჯვენაში — ხმალი მტრისთვის.


    ასვლა თავად ნახევარი თავგადასავალია:


    - საბაგირო რიყის პარკიდან — ოთხ წუთში ნარიყალას ზედა სადგურზე ხარ

    - ქედის გასწვრივ ბილიკი ძეგლამდე და ნარიყალას ციხემდე მიდის

    - გზად ბოტანიკური ბაღის ხეობის ხედები იშლება


    საღამოს ჩასვლისას ქალაქი ოქროსფრად ინთება — ფოტოსთვის საუკეთესო დროა. ქარი ქედზე თითქმის ყოველთვის
    უბერავს, ზამთარში კი ბილიკი ზოგან მოყინულია, ასე რომ, კარგი ფეხსაცმელი აქაც გამოგადგება.
  tip: >-
    ძეგლთან შესვლა უფასოა, საბაგირო კი Metromoney-ის ბარათით მუშაობს — ბარათი ქვედა სადგურზეც იყიდება.
    საბაგირო გვიანობამდე მუშაობს, მაგრამ ძლიერ ქარში ჩერდება. მზის ჩასვლისას ხალხმრავლობაა — ადრე დილით
    თითქმის მარტო იქნები. ქედზე მოაჯირები ყველგან არ არის, ბავშვებს მიხედე. წყალი და ყავა ზედა სადგურთან
    იყიდება, ტუალეტი რიყის პარკშია.
  route: >-
    მანქანით პირდაპირ ძეგლთან ვერ ახვალ — და არც ღირს: სოლოლაკის შესახვევები ვიწრო და ცალმხრივია. ყველაზე
    მარტივი გზაა ევროპის მოედანთან ან რიყის პარკის ფასიან პარკინგზე გაჩერება და საბაგიროთი ასვლა. ალტერნატივა:
    კოჯრის გზით ოქროყანისკენ ასვლა და ნარიყალას ზედა შესასვლელიდან ქედზე ათწუთიანი გასეირნება. ცენტრიდან
    სულ 3 კმ-ია, თხუთმეტიოდე წუთი. ეკონომ-კლასის მანქანა სრულიად საკმარისია — გზა ბოლომდე ასფალტია.
en:
  name: Kartlis Deda (Mother of Georgia)
  short: >-
    The 20-metre aluminium symbol of Tbilisi on the Sololaki ridge — wine bowl, sword and the city's best
    panorama.
  body: >-
    **Kartlis Deda watches over Tbilisi as the city's defining symbol** — a 20-metre aluminium figure
    on the Sololaki ridge that appears in almost every skyline view, and whose feet offer the classic
    panorama of the Old Town.


    The monument went up in 1958 for the 1,500th anniversary of Tbilisi's founding; the sculptor was Elguja
    Amashukeli. The original figure was wooden, clad in aluminium in 1963, and replaced entirely with
    a new statue in 1997. The symbolism is famous: in her left hand she holds a bowl of wine for those
    who come as friends, in her right a sword for those who come as enemies.


    Getting up is half the fun:


    - The cable car from Rike Park reaches the upper station by Narikala in about four minutes

    - A ridge path links the statue with Narikala Fortress

    - Views open over the Botanical Garden gorge along the way


    At sunset the city below turns gold — the best hour for photos. Wind blows on the ridge almost constantly,
    and in winter stretches of the path ice over, so decent shoes help here too.
  tip: >-
    The statue itself is free; the cable car runs on a Metromoney card, sold at the lower station. It
    operates until late evening but stops in strong wind. Sunset is crowded — come early morning and you'll
    have the ridge almost to yourself. Railings are patchy along the drop, so watch children. Water and
    coffee are sold near the upper station; toilets are down in Rike Park.
  route: >-
    You can't drive right up to the statue — and shouldn't try: Sololaki's lanes are narrow and one-way.
    The easiest plan is to park at the paid lots by Europe Square or Rike Park and ride the cable car
    up. Alternatively, take the Kojori road towards Okrokana and walk ten minutes along the ridge from
    Narikala's upper entrance. It's about 3 km from the centre, fifteen minutes. An economy car is entirely
    sufficient — asphalt the whole way.
ru:
  name: Мать Картли (Картлис Деда)
  short: 20-метровый алюминиевый символ Тбилиси на Сололакском хребте — чаша вина, меч и лучшая панорама
    города.
  body: >-
    **Картлис Деда смотрит на Тбилиси как главный символ города** — 20-метровая алюминиевая фигура на
    Сололакском хребте, которая видна почти с любой точки, а от её подножия открывается классическая панорама
    Старого города.


    Монумент установили в 1958 году к 1500-летию основания Тбилиси; автор — скульптор Элгуджа Амашукели.
    Первоначально фигура была деревянной, в 1963 году её обшили алюминием, а в 1997-м полностью заменили
    новой. Символика известна каждому грузину: в левой руке — чаша вина для тех, кто пришёл с миром, в
    правой — меч для врагов.


    Подъём — половина удовольствия:


    - Канатная дорога от парка Рике за четыре минуты доставляет к верхней станции у Нарикала

    - Тропа по хребту связывает статую с крепостью Нарикала

    - По пути открываются виды на ущелье Ботанического сада


    На закате город внизу становится золотым — лучший час для фотографий. Ветер на хребте дует почти всегда,
    а зимой участки тропы обледеневают, так что нормальная обувь пригодится и здесь.
  tip: >-
    Вход к статуе бесплатный; канатная дорога работает по карте Metromoney, которую продают на нижней
    станции. Она ходит до позднего вечера, но останавливается при сильном ветре. На закате многолюдно
    — придите рано утром, и хребет будет почти вашим. Ограждения над обрывом есть не везде, следите за
    детьми. Вода и кофе продаются у верхней станции, туалеты — внизу в парке Рике.
  route: >-
    Подъехать на машине прямо к статуе нельзя — и не стоит пытаться: переулки Сололаки узкие и односторонние.
    Проще всего оставить машину на платных парковках у площади Европы или парка Рике и подняться на канатке.
    Альтернатива — Коджорская дорога в сторону Окроканы и десять минут пешком по хребту от верхнего входа
    Нарикала. От центра всего 3 км, минут пятнадцать. Машины эконом-класса хватает полностью — асфальт
    до конца.
fa:
  name: کارتلیس ددا (مادر گرجستان)
  short: نماد ۲۰ متری آلومینیومی تفلیس بر ستیغ سولولاکی — جام شراب، شمشیر و بهترین چشم‌انداز شهر.
  body: >-
    **کارتلیس ددا همچون نماد اصلی شهر بر تفلیس نظارت می‌کند** — پیکره‌ای آلومینیومی به بلندی ۲۰ متر بر
    ستیغ سولولاکی که تقریباً در هر منظره‌ای از شهر دیده می‌شود و از پای آن چشم‌انداز کلاسیک شهر قدیم گسترده
    است.


    این یادمان در ۱۹۵۸ به مناسبت هزار و پانصدمین سالگرد بنیان‌گذاری تفلیس برپا شد؛ سازنده‌اش پیکرتراش
    الگوجا آماشوکلی است. پیکرهٔ نخست چوبی بود، در ۱۹۶۳ با آلومینیوم پوشانده شد و در ۱۹۹۷ به‌کلی با نسخه‌ای
    نو جایگزین گشت. نمادپردازی‌اش مشهور است: در دست چپ جامی شراب برای دوستان و در دست راست شمشیری برای
    دشمنان.


    بالا رفتن خودش نیمی از لذت است:


    - تله‌کابین از پارک ریکه در حدود چهار دقیقه به ایستگاه بالایی کنار ناریکالا می‌رسد

    - کوره‌راهی روی ستیغ، مجسمه را به قلعهٔ ناریکالا پیوند می‌دهد

    - در مسیر، چشم‌انداز درهٔ باغ گیاه‌شناسی گشوده می‌شود


    هنگام غروب، شهرِ پایین طلایی می‌شود — بهترین ساعت عکاسی. باد روی ستیغ تقریباً همیشه می‌وزد و در زمستان
    بخش‌هایی از راه یخ می‌زند، پس کفش مناسب اینجا هم به کار می‌آید.
  tip: >-
    دیدن مجسمه رایگان است؛ تله‌کابین با کارت Metromoney کار می‌کند که در ایستگاه پایینی فروخته می‌شود.
    تا پاسی از شب فعال است اما در باد شدید می‌ایستد. غروب‌ها شلوغ است — صبح زود بیایید تا ستیغ تقریباً
    از آن شما باشد. نرده‌ها همه‌جا نیستند، مراقب کودکان باشید. آب و قهوه نزدیک ایستگاه بالایی فروخته می‌شود
    و سرویس بهداشتی پایین، در پارک ریکه است.
  route: >-
    با خودرو نمی‌توان تا خود مجسمه رفت — و بهتر هم همین است: کوچه‌های سولولاکی تنگ و یک‌طرفه‌اند. ساده‌ترین
    راه، پارک خودرو در پارکینگ‌های پولی میدان اروپا یا پارک ریکه و بالا رفتن با تله‌کابین است. راه دیگر:
    جادهٔ کوجوری به سمت اوکروکانا و ده دقیقه پیاده‌روی روی ستیغ از ورودی بالایی ناریکالا. از مرکز شهر
    فقط ۳ کیلومتر است، حدود پانزده دقیقه. خودروی اقتصادی کاملاً کافی است — تمام مسیر آسفالت است.
he:
  name: קרטליס דדה (אם גאורגיה)
  short: סמל טביליסי — פסל אלומיניום בגובה 20 מטר על רכס סולולאקי, עם גביע יין, חרב והפנורמה הטובה בעיר.
  body: >-
    **קרטליס דדה משקיפה על טביליסי כסמל המובהק של העיר** — דמות אלומיניום בגובה 20 מטר על רכס סולולאקי,
    שנראית כמעט מכל נקודה בקו הרקיע, ולמרגלותיה נפרשת הפנורמה הקלאסית של העיר העתיקה.


    האנדרטה הוקמה ב-1958 לציון 1,500 שנה לייסוד טביליסי; הפסל הוא אלגוג'ה אמאשוקלי. הדמות המקורית הייתה
    מעץ, ב-1963 צופתה באלומיניום, וב-1997 הוחלפה כולה בפסל חדש. הסמליות מפורסמת: בידה השמאלית גביע יין
    למי שבא כידיד, ובימנית חרב למי שבא כאויב.


    הדרך למעלה היא חצי מהחוויה:


    - הרכבל מפארק ריקה מגיע לתחנה העליונה ליד נאריקלה בכארבע דקות

    - שביל לאורך הרכס מחבר את הפסל עם מבצר נאריקלה

    - בדרך נפתחים נופים אל ערוץ הגן הבוטני


    בשקיעה העיר שמתחת נצבעת זהב — השעה הטובה ביותר לצילום. על הרכס נושבת רוח כמעט תמיד, ובחורף קטעים מהשביל
    מתקרחים, כך שנעליים טובות עוזרות גם כאן.
  tip: >-
    הגישה לפסל חינם; הרכבל פועל עם כרטיס Metromoney שנמכר בתחנה התחתונה. הוא עובד עד שעות הערב המאוחרות
    אך נעצר ברוח חזקה. בשקיעה צפוף — בואו מוקדם בבוקר והרכס יהיה כמעט כולו שלכם. מעקות אינם רציפים לאורך
    המצוק, השגיחו על ילדים. מים וקפה נמכרים ליד התחנה העליונה; שירותים למטה בפארק ריקה.
  route: >-
    אי אפשר לנסוע עד הפסל עצמו — וגם לא כדאי לנסות: סמטאות סולולאקי צרות וחד-סטריות. התוכנית הפשוטה ביותר:
    חנו בחניונים בתשלום ליד כיכר אירופה או פארק ריקה ועלו ברכבל. חלופה: כביש קוג'ורי לכיוון אוקרוקנה ועשר
    דקות הליכה לאורך הרכס מהכניסה העליונה של נאריקלה. מהמרכז בסך הכול 3 ק״מ, כרבע שעה. רכב חסכוני מספיק
    לגמרי — אספלט לכל האורך.
ar:
  name: كارتليس ديدا (أم جورجيا)
  short: رمز تبليسي الألومنيومي بارتفاع 20 متراً على حافة سولولاكي — كأس نبيذ وسيف وأجمل بانوراما للمدينة.
  body: >-
    **تطلّ كارتليس ديدا على تبليسي بوصفها الرمز الأول للمدينة** — تمثال من الألومنيوم بارتفاع 20 متراً
    على حافة سولولاكي، يظهر في كل مشهد للأفق تقريباً، وتمتد من عند قدميه البانوراما الكلاسيكية للمدينة
    القديمة.


    أُقيم النصب عام 1958 في الذكرى الـ1500 لتأسيس تبليسي؛ ونحته إلغوجا أماشوكيلي. كان التمثال الأصلي خشبياً،
    ثم كُسي بالألومنيوم عام 1963، واستُبدل كلياً بتمثال جديد عام 1997. رمزيته يعرفها الجميع: في يدها اليسرى
    كأس نبيذ لمن يأتي صديقاً، وفي اليمنى سيف لمن يأتي عدواً.


    الصعود نصف المتعة:


    - التلفريك من حديقة ريكه يبلغ المحطة العليا قرب ناريكالا في نحو أربع دقائق

    - درب على الحافة يربط التمثال بقلعة ناريكالا

    - وتنفتح في الطريق إطلالات على وادي الحديقة النباتية


    عند الغروب تتحول المدينة في الأسفل إلى ذهب — أفضل ساعة للتصوير. الريح على الحافة شبه دائمة، وفي الشتاء
    تتجمد مقاطع من الدرب، فالحذاء الجيد ينفع هنا أيضاً.
  tip: >-
    الوصول إلى التمثال مجاني؛ ويعمل التلفريك ببطاقة Metromoney التي تُباع في المحطة السفلى. يستمر حتى
    وقت متأخر من المساء لكنه يتوقف عند اشتداد الريح. الغروب مزدحم — تعال باكراً صباحاً وستكون الحافة لك
    وحدك تقريباً. الدرابزين غير متصل فوق المنحدر، فانتبه للأطفال. الماء والقهوة يباعان قرب المحطة العليا،
    ودورات المياه في حديقة ريكه بالأسفل.
  route: >-
    لا يمكنك القيادة حتى التمثال نفسه — ولا تحاول: أزقة سولولاكي ضيقة وذات اتجاه واحد. أسهل خطة أن تركن
    في المواقف المدفوعة قرب ساحة أوروبا أو حديقة ريكه وتصعد بالتلفريك. والبديل: طريق كوجوري باتجاه أوكروكانا
    ثم عشر دقائق مشياً على الحافة من مدخل ناريكالا العلوي. المسافة من المركز نحو 3 كم، أي ربع ساعة تقريباً.
    سيارة اقتصادية تكفي تماماً — الطريق معبّد بالكامل.
rating: 4.0
