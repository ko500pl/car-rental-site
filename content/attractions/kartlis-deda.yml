ka:
  name: ქართლის დედა
  short: 'ოცი მეტრი ალუმინი სოლოლაკის ქედზე: ღვინის თასი მოყვრისთვის, ხმალი მტრისთვის და მთელი ძველი ქალაქი
    ფეხქვეშ.'
  body: >-
    **მარცხენა ხელში ღვინის თასი უჭირავს, მარჯვენაში ხმალი, და სოლოლაკის ქედიდან თბილისი მის სათქმელს
    დღესაც ისევე კითხულობს, როგორც 1958 წელს: მოყვარეს ღვინო, მტერს მახვილი.** ქართულ ეროვნულ სამოსში
    გამოწყობილი ქალის ოცმეტრიანი ფიგურა ქართლის დედაა, ენციკლოპედიებში „ქართვლის დედა“, და თბილისის თითქმის
    ყველა ფოტოში ჩანს.


    ქანდაკება 1958 წელს აღიმართა, როცა თბილისი დაარსების 1500 წლისთავს ზეიმობდა. მოქანდაკე ელგუჯა ამაშუკელი,
    რომელსაც ამ ნამუშევრისთვის 1966 წელს შოთა რუსთაველის სახელობის სახელმწიფო პრემია მიენიჭა, თასსა და
    ხმალში ქალაქის ისტორიას ხედავდა: მტერთან დაუსრულებელ ბრძოლებს და მეგობარი სტუმრის გულღია დახვედრას.
    ქანდაკება თავიდან დროებითი უნდა ყოფილიყო: პირველი ფიგურა ზეიმისთვის გაკეთებული ხის ალეგორია იყო. როცა
    მისი დატოვება გადაწყდა, ხის ზედაპირი 1963 წელს დაზიანებისგან დასაცავად ალუმინით შემოსეს, 1997 წელს
    კი ძველი ქანდაკება ახლით, დღევანდელით, შეცვალეს.


    ახლოდან ის ქანდაკებაზე მეტად სილუეტია, ლითონი კი ცის ფერს იღებს. მისი ძირიდან მთელი ქვაბული იშლება:
    ძველი ქალაქის გუმბათები, მეტეხის კლდის ძირში მოხრილი მტკვარი, ზურგს უკან კი ბოტანიკური ბაღის მწვანე
    ხეობა. ქედის ბილიკი აღმოსავლეთით, ნარიყალამდე მიდის, სულ რამდენიმე წუთის სავალზე: ერთ მხარეს ფრიალო,
    მეორეზე ქალაქის სახურავები.


    აქ დღის ბოლოს ამოდით. ძველი ქალაქი ჯერ ოქროსფრად იფერება, მერე ლურჯდება, შუქი ქუჩა-ქუჩა ინთება, ქალი
    კი თასითა და ხმლით ისევ ფხიზლად დგას იმ ქალაქის თავზე, რომლის სტუმრების დახვედრაც და დაცვაც ერთად
    მიანდეს.
  tip: >-
    ქანდაკების ნახვა უფასოა, რიყის პარკიდან საბაგირო კი ფასიანია; ყველაზე მარტივად „მეტრომანის“ ბარათით
    გადაიხდით, რომელიც ქვედა სადგურზეც იყიდება. საბაგირო საღამომდე მუშაობს, მაგრამ ძლიერ ქარში შეიძლება
    გაჩერდეს. მზის ჩასვლისას აქ ხალხმრავლობაა, დილის რვა საათზე კი ქედი შეიძლება თითქმის მთლიანად თქვენი
    იყოს. ფრიალოს გასწვრივ მოაჯირი ყველგან არ არის, ამიტომ ბავშვებს თვალი ადევნეთ; ჩაიცვით არამოსრიალე
    ფეხსაცმელი: ბილიკი უსწორმასწოროა, ზამთარში კი ზოგან იყინება. წყალი და ყავა ზედა სადგურთან იყიდება,
    ტუალეტი ქვემოთ, რიყის პარკშია.
  route: >-
    ქანდაკებამდე მანქანით ვერ ახვალთ და სოლოლაკის ვიწრო, ცალმხრივ შესახვევებში არც მოგინდებათ ცდა. მანქანა
    მარცხენა სანაპიროზე, ევროპის მოედანთან ან რიყის პარკთან, ფასიან სადგომზე დატოვეთ, თავისუფლების მოედნიდან
    დაახლოებით 3 კილომეტრში, ჩვეულებრივ მოძრაობაში თხუთმეტ წუთში, და რიყის პარკიდან საბაგიროთი ნარიყალამდე
    ადით; იქიდან ქანდაკებამდე ქედის გასწვრივ დასავლეთით მცირე მანძილია ფეხით. სხვა გზაც არსებობს: მანქანა
    ცენტრში დატოვეთ და ბეთლემის უბნიდან ფეხით ადით, ციცაბო კიბეებითა და შესახვევებით, მაგრამ ლამაზად.
    ყველგან ასფალტია; ეკონომკლასის მანქანა სავსებით საკმარისია, აქ მთავარი გამოწვევა გზა კი არა, პარკინგია.
en:
  name: Kartlis Deda (Mother of Georgia)
  short: >-
    Twenty metres of aluminium on the Sololaki ridge: a bowl of wine for friends, a sword for enemies,
    and the whole Old Town at her feet.
  body: >-
    **She holds a bowl of wine in her left hand and a sword in her right, and from the Sololaki ridge
    Tbilisi still reads her message as it did in 1958: wine for the friend, the blade for the enemy.**
    The twenty-metre figure of a woman in Georgian national dress is Kartlis Deda, in the encyclopaedias
    Kartvlis Deda, 'Mother of the Georgians', and she stands in almost every photograph of the city.


    She went up in 1958, the year Tbilisi celebrated 1,500 years since its founding. The sculptor Elguja
    Amashukeli, who received the Shota Rustaveli State Prize for her in 1966, saw the two objects in her
    hands as the city's history in brief: endless battles against enemies and an equally endless welcome
    for friendly guests. She was meant to be temporary. The first figure was a wooden allegory made for
    the celebrations; when the city decided to keep her, the timber was sheathed in aluminium in 1963
    to protect it, and in 1997 the old statue was replaced by the one you see today.


    Close up she is less a statue than a silhouette, her metal taking on the colour of the sky. From her
    feet the whole basin opens: the domes of the Old Town, the Mtkvari bending beneath the Metekhi cliff,
    and behind you the green gorge of the Botanical Garden. The ridge path runs east to Narikala Fortress,
    a few minutes' walk, with a drop on one side and the city's roofs on the other.


    Come at the end of the day. The Old Town turns gold, then blue, the lights come on street by street,
    and the woman with the cup and the sword keeps watch over the city she was made both to welcome and
    to defend.
  tip: >-
    The statue costs nothing to visit; the cable car from Rike Park is paid, most easily with a Metromoney
    transport card, which is sold at the lower station. It runs into the evening but can stop in strong
    wind. Sunset draws the crowds, while at eight in the morning you may have the ridge almost to yourself.
    Railings along the drop are patchy, so keep children close, and wear shoes with grip: the path is
    uneven and in winter parts of it ice over. Water and coffee are sold near the upper station; the toilets
    are down in Rike Park.
  route: >-
    You cannot drive up to the statue, and in Sololaki's narrow one-way lanes you would not want to try.
    Park in a paid lot by Europe Square or Rike Park on the left bank, about 3 km and fifteen minutes
    from Freedom Square in normal traffic, and ride the cable car from Rike Park up to Narikala; the statue
    is a short walk west along the ridge. Alternatively leave the car in the centre and climb on foot
    from the Betlemi quarter: steep steps and lanes, but a fine approach. Asphalt everywhere; an economy
    car is entirely sufficient, and the real challenge is parking, not the road.
ru:
  name: Картлис Деда (Мать Грузии)
  short: >-
    Двадцать метров алюминия на хребте Сололаки: чаша вина для друзей, меч для врагов и весь Старый город
    у её ног.
  body: >-
    **В левой руке у неё чаша с вином, в правой меч, и с хребта Сололаки Тбилиси по-прежнему читает её
    послание так же, как в 1958 году: вино — другу, клинок — врагу.** Двадцатиметровая женская фигура
    в грузинском национальном платье — это Картлис Деда, в энциклопедиях Картвлис Деда, «Мать грузин»,
    и она есть почти на каждой фотографии города.


    Её установили в 1958 году, когда Тбилиси праздновал 1500 лет со дня основания. Скульптор Элгуджа Амашукели,
    получивший за неё в 1966 году Государственную премию имени Шота Руставели, видел в двух предметах
    в её руках краткую историю города: бесконечные битвы с врагами и столь же бесконечное радушие к гостям-друзьям.
    Задумывали её как временную. Первая фигура была деревянной аллегорией, сделанной к празднествам; когда
    город решил её оставить, в 1963 году дерево для защиты обшили алюминием, а в 1997 году старую статую
    заменили той, что вы видите сегодня.


    Вблизи она скорее силуэт, чем статуя: металл принимает цвет неба. От её подножия открывается вся котловина
    — купола Старого города, Мтквари, изгибающаяся под Метехской скалой, а за спиной зелёное ущелье Ботанического
    сада. Тропа по гребню ведёт на восток к крепости Нарикала, в нескольких минутах ходьбы: с одной стороны
    обрыв, с другой — крыши города.


    Приходите в конце дня. Старый город становится золотым, потом синим, огни загораются улица за улицей,
    а женщина с чашей и мечом стережёт город, ради которого создана: чтобы и встречать, и защищать.
  tip: >-
    Посмотреть на статую ничего не стоит; канатная дорога из парка Рике платная, удобнее всего расплачиваться
    транспортной картой «Метромани», которую продают на нижней станции. Канатка работает до вечера, но
    в сильный ветер может останавливаться. На закат собираются толпы, а в восемь утра гребень может оказаться
    почти в вашем распоряжении. Ограждения вдоль обрыва есть не везде, так что держите детей рядом, и
    наденьте обувь с цепкой подошвой: тропа неровная, а зимой местами обледеневает. Воду и кофе продают
    у верхней станции; туалеты — внизу, в парке Рике.
  route: >-
    Подъехать к статуе на машине нельзя, да и в узких односторонних переулках Сололаки пытаться не захочется.
    Оставьте машину на платной стоянке у площади Европы или парка Рике на левом берегу, примерно в 3 км
    и пятнадцати минутах от площади Свободы при обычном движении, и поднимитесь по канатной дороге из
    парка Рике к Нарикале; статуя — в нескольких минутах ходьбы на запад по гребню. Или оставьте машину
    в центре и поднимитесь пешком из квартала Бетлеми: крутые лестницы и переулки, зато прекрасный подход.
    Везде асфальт; машины эконом-класса вполне достаточно, а настоящая трудность — парковка, а не дорога.
fa:
  name: کارتلیس ددا (مادر گرجستان)
  short: 'بیست متر آلومینیوم بر ستیغ سولولاکی: جامی شراب برای دوستان، شمشیری برای دشمنان، و سراسر شهر
    قدیم زیر پایش.'
  body: >-
    **در دست چپش جامی شراب است و در دست راستش شمشیری، و تفلیس هنوز از ستیغ سولولاکی پیامش را همان‌گونه
    می‌خواند که در ۱۹۵۸: شراب برای دوست، تیغ برای دشمن.** این پیکر بیست‌متری زنی در جامهٔ ملی گرجی، کارتلیس
    ددا است، که در دانشنامه‌ها کارتولیس ددا، یعنی «مادر گرجیان»، خوانده می‌شود، و تقریباً در هر عکسی از
    شهر حضور دارد.


    در ۱۹۵۸ برپا شد، سالی که تفلیس ۱۵۰۰ سالگی بنیاد خود را جشن گرفت. پیکرتراش، الگوجا آماشوکلی، که در
    ۱۹۶۶ برای این اثر جایزهٔ دولتی شوتا روستاولی را گرفت، دو چیزِ در دستان او را خلاصهٔ تاریخ شهر می‌دانست:
    نبردهای بی‌پایان با دشمنان و مهمان‌نوازیِ به همان اندازه بی‌پایان از مهمانان دوست. قرار بود این تندیس
    موقتی باشد. نخستین پیکر، تمثیلی چوبی بود که برای جشن‌ها ساخته شد؛ وقتی شهر تصمیم گرفت نگهش دارد، در
    ۱۹۶۳ برای محافظت روی چوب را با آلومینیوم پوشاندند و در ۱۹۹۷ تندیس کهنه جای خود را به تندیسی داد که
    امروز می‌بینید.


    از نزدیک بیشتر سایه‌نمایی است تا تندیسی، و فلزش رنگ آسمان را به خود می‌گیرد. از پای او سراسر گودال
    شهر گشوده می‌شود: گنبدهای شهر قدیم، رود متکواری که زیر صخرهٔ متخی خم می‌شود، و پشت سرتان درهٔ سبز
    باغ گیاه‌شناسی. راه ستیغ به سوی شرق تا دژ ناریکالا می‌رود، چند دقیقه پیاده، با پرتگاهی در یک سو و
    بام‌های شهر در سوی دیگر.


    در پایان روز بیایید. شهر قدیم زرین می‌شود، سپس آبی، چراغ‌ها کوچه به کوچه روشن می‌شوند، و زنِ جام و
    شمشیر به دست پاسدار شهری می‌ماند که ساخته شد تا هم از مهمانانش استقبال کند و هم از آن دفاع کند.
  tip: >-
    دیدن تندیس هزینه‌ای ندارد؛ تله‌کابین پارک ریکه پولی است و آسان‌ترین راه پرداخت، کارت حمل‌ونقل «مترومانی»
    است که در ایستگاه پایینی فروخته می‌شود. تله‌کابین تا شامگاه کار می‌کند، اما در باد شدید ممکن است بایستد.
    غروب جمعیت را می‌کشاند، حال آنکه ساعت هشت صبح شاید ستیغ تقریباً از آنِ شما باشد. کنار پرتگاه همه‌جا
    نرده نیست، پس کودکان را نزدیک خود نگه دارید و کفشی با کف محکم بپوشید: مسیر ناهموار است و در زمستان
    بخش‌هایی از آن یخ می‌بندد. آب و قهوه نزدیک ایستگاه بالایی فروخته می‌شود؛ سرویس بهداشتی پایین، در پارک
    ریکه است.
  route: >-
    با خودرو نمی‌توان تا پای تندیس رفت، و در کوچه‌های باریک یک‌طرفهٔ سولولاکی هم دلتان نمی‌خواهد امتحانش
    کنید. خودرو را در پارکینگی پولی کنار میدان اروپا یا پارک ریکه در کرانهٔ چپ بگذارید، حدود ۳ کیلومتر
    و پانزده دقیقه از میدان آزادی در ترافیک عادی، و با تله‌کابین از پارک ریکه تا ناریکالا بالا بروید؛
    تندیس چند دقیقه پیاده به سمت غرب در امتداد ستیغ است. راه دیگر این است که خودرو را در مرکز شهر بگذارید
    و از محلهٔ بتلمی پیاده بالا بروید: پله‌ها و کوچه‌هایی پرشیب، اما راهی دل‌انگیز. همه‌جا آسفالت است؛
    خودروی کلاس اقتصادی کاملاً کافی است و دشواری واقعی پیدا کردن جای پارک است، نه جاده.
he:
  name: כרתליס דדה (אם גאורגיה)
  short: 'עשרים מטרים של אלומיניום על רכס סולולאקי: קערת יין לידידים, חרב לאויבים, וכל העיר העתיקה לרגליה.'
  body: >-
    **בידה השמאלית היא אוחזת קערת יין ובימנית חרב, ומרכס סולולאקי טביליסי עדיין קוראת את המסר שלה כפי
    שקראה אותו ב-1958: יין לידיד, להב לאויב.** דמות האישה בת עשרים המטרים, בלבוש לאומי גאורגי, היא כרתליס
    דדה — באנציקלופדיות כרתווליס דדה, "אם הגאורגים" — והיא מופיעה כמעט בכל תצלום של העיר.


    היא הוצבה ב-1958, השנה שבה חגגה טביליסי 1,500 שנה להיווסדה. הפסל אלגוג'ה אמשוקלי, שזכה בזכותה ב-1966
    בפרס המדינה על שם שותא רוסתאוולי, ראה בשני החפצים שבידיה את תולדות העיר בקצרה: קרבות אינסופיים נגד
    אויבים, וקבלת פנים אינסופית לא פחות לאורחים ידידים. היא נועדה להיות זמנית. הדמות הראשונה הייתה אלגוריה
    מעץ שהוכנה לחגיגות; כשהעיר החליטה להשאיר אותה, צופה העץ ב-1963 באלומיניום כדי להגן עליו, וב-1997 הוחלף
    הפסל הישן בזה שאתם רואים היום.


    מקרוב היא פחות פסל ויותר צללית, והמתכת שלה מקבלת את צבע השמיים. מלרגליה נפרש האגן כולו: כיפות העיר
    העתיקה, המטקוורי המתעקל מתחת לצוק מטחי, ומאחוריכם הערוץ הירוק של הגן הבוטני. שביל הרכס מוביל מזרחה
    אל מבצר נריקלה, כמה דקות הליכה, עם מדרון תלול מצד אחד וגגות העיר מהצד השני.


    בואו בסוף היום. העיר העתיקה מזהיבה, אחר כך מכחילה, האורות נדלקים רחוב אחר רחוב, והאישה עם הקערה והחרב,
    שנוצרה כדי לקבל את פני אורחי העיר וגם להגן עליה, ממשיכה לשמור עליה.
  tip: >-
    הביקור בפסל אינו עולה דבר; הרכבל מפארק ריקה כרוך בתשלום, והדרך הנוחה ביותר לשלם היא כרטיס התחבורה
    "מטרומאני", הנמכר בתחנה התחתונה. הרכבל פועל עד שעות הערב, אבל עלול להיעצר ברוח חזקה. השקיעה מושכת
    המונים, ואילו בשמונה בבוקר ייתכן שהרכס יהיה כמעט כולו שלכם. מעקות לאורך המדרון יש רק בחלק מהמקומות,
    אז החזיקו ילדים קרוב, ונעלו נעליים עם אחיזה טובה: השביל לא אחיד, ובחורף חלקים ממנו מתכסים בקרח. מים
    וקפה נמכרים ליד התחנה העליונה; השירותים למטה, בפארק ריקה.
  route: >-
    אי אפשר לנסוע עד הפסל, ובסמטאות הצרות והחד-סטריות של סולולאקי גם לא תרצו לנסות. חנו בחניון בתשלום
    ליד כיכר אירופה או פארק ריקה שעל הגדה השמאלית, כ-3 ק״מ ורבע שעה מכיכר החירות בתנועה רגילה, ועלו ברכבל
    מפארק ריקה אל נריקלה; הפסל נמצא הליכה קצרה מערבה לאורך הרכס. לחלופין השאירו את הרכב במרכז ועלו ברגל
    מרובע בתלמי: מדרגות וסמטאות תלולות, אבל דרך גישה יפהפייה. אספלט בכל מקום; רכב מקטגוריית אקונומי מספיק
    לגמרי, והאתגר האמיתי הוא החניה, לא הדרך.
ar:
  name: كارتليس ديدا (أم جورجيا)
  short: 'عشرون متراً من الألومنيوم على حَيد سولولاكي: كأس نبيذ للأصدقاء، وسيف للأعداء، والبلدة القديمة
    كلها عند قدميها.'
  body: >-
    **في يسراها كأس نبيذ وفي يمناها سيف، ومن على حَيد سولولاكي لا تزال تبليسي تقرأ رسالتها كما قرأتها
    عام 1958: النبيذ للصديق، والنصل للعدو.** هذا التمثال لامرأة بالزي الجورجي الوطني، بطول عشرين متراً،
    هو كارتليس ديدا، أو كارتفليس ديدا في الموسوعات، أي «أم الجورجيين»، ويكاد يظهر في كل صورة للمدينة.


    أُقيم عام 1958، العام الذي احتفلت فيه تبليسي بمرور 1500 عام على تأسيسها. ورأى النحات إلغوجا أماشوكيلي،
    الذي نال عنه جائزة شوتا روستافيلي الحكومية عام 1966، في الشيئين اللذين تحملهما تاريخ المدينة موجزاً:
    معارك لا تنتهي مع الأعداء، وترحيباً لا ينتهي كذلك بالضيوف الأصدقاء. وقد أُريد له أن يكون مؤقتاً. فالتمثال
    الأول كان رمزاً مجازياً من الخشب صُنع للاحتفالات؛ ولما قررت المدينة الإبقاء عليه، كُسي الخشب بالألومنيوم
    عام 1963 لحمايته، ثم استُبدل التمثال القديم عام 1997 بالتمثال الذي تراه اليوم.


    وهي عن قرب صورة ظلية أكثر منها تمثالاً، يكتسي معدنها لون السماء. ومن عند قدميها ينفتح الحوض كله: قباب
    البلدة القديمة، ونهر متكفاري ينعطف تحت جرف ميتيخي، ومن خلفك وادي الحديقة النباتية الأخضر. ويمضي درب
    الحَيد شرقاً إلى قلعة ناريكالا على بعد دقائق سيراً، والهاوية في جانب وسطوح المدينة في الجانب الآخر.


    تعال في آخر النهار. تصير البلدة القديمة ذهبية ثم زرقاء، وتضاء الأنوار شارعاً بعد شارع، والمرأة ذات
    الكأس والسيف تحرس المدينة التي صُنعت لتستقبل ضيوفها وتذود عنها في آن.
  tip: >-
    زيارة التمثال بلا مقابل؛ أما التلفريك من حديقة ريكه فمدفوع، وأسهل طريقة للدفع بطاقة النقل «ميترو ماني»
    التي تُباع في المحطة السفلى. يعمل التلفريك حتى المساء لكنه قد يتوقف في الرياح الشديدة. الغروب يجذب
    الحشود، بينما قد تجد الحَيد في الثامنة صباحاً شبه خالٍ لك وحدك. الدرابزين على طول الحافة متقطع، فأبقِ
    الأطفال قريبين منك، والبس حذاءً ثابت النعل: فالدرب غير مستوٍ وتتجمد أجزاء منه في الشتاء. يُباع الماء
    والقهوة قرب المحطة العليا، ودورات المياه في الأسفل، في حديقة ريكه.
  route: >-
    لا يمكن الوصول إلى التمثال بالسيارة، ولن ترغب في المحاولة في أزقة سولولاكي الضيقة ذات الاتجاه الواحد.
    اركن سيارتك في موقف مدفوع قرب ساحة أوروبا أو حديقة ريكه على الضفة اليسرى، على بعد نحو 3 كم وربع ساعة
    من ساحة الحرية في حركة المرور العادية، واصعد بالتلفريك من حديقة ريكه إلى ناريكالا؛ والتمثال على مسافة
    قصيرة سيراً غرباً على طول الحَيد. أو اترك السيارة في المركز واصعد مشياً من حي بيتليمي: درجات وأزقة
    شديدة الانحدار، لكنها مدخل جميل. الأسفلت في كل مكان، وتكفي سيارة اقتصادية تماماً، والتحدي الحقيقي
    هو إيجاد موقف لا الطريق.
