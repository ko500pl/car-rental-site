ka:
  name: აბასთუმნის ასტროფიზიკური ობსერვატორია
  short: >-
    ყანობილის მთაზე, ფიჭვნარში ამოზრდილი თეთრი გუმბათები: აქ 1932 წელს ქართული ასტრონომია დაიწყო, ძველი
    საკურორტო აბასთუმნის თავზე.
  body: >-
    **ყანობილის მთაზე ფიჭვნარი თეთრ გუმბათებს ეხსნება და მალევე მიხვდებით, რომ ამ ადგილისთვის უპირველესად
    ცა შეარჩიეს.**


    ქვემოთ, ოცხის ხეობაში გაშენებული აბასთუმანი XIX საუკუნეში ფილტვის სნეულთა სამკურნალოდ დაწინაურდა:
    მშრალი, ქარისგან დაცული ჰაერი, 1864 წლიდან კი ზაფხულობით სამხედრო ჰოსპიტალიც. 1892 წელს პეტერბურგის
    უნივერსიტეტმა დაბაში დროებითი ობსერვატორია გამართა და პროფესორმა სერგეი გლაზენაპმა მცირე ტელესკოპით
    ისეთი მჭიდრო ორმაგი ვარსკვლავები გაარჩია, რომელთა დანახვაც სხვაგან ვერ ხერხდებოდა.


    მუდმივი ობსერვატორია 1932 წლის 28 თებერვალს დააარსა ახალგაზრდა ასტრონომმა ევგენი ხარაძემ, რომელიც
    მას სამოცი წელი ხელმძღვანელობდა. ტელესკოპები გუმბათ-გუმბათ ემატებოდა: ცაისის 40-სანტიმეტრიანი რეფრაქტორი,
    1950-იანი წლების შუა ხანში მაქსუტოვის 70-სანტიმეტრიანი მენისკური ტელესკოპი, 1977 წელს კი 125-სანტიმეტრიანი
    რიჩი-კრეტიენის რეფლექტორი. 1942 წელს გიორგი თევზაძემ აქედან ორი ახალი კომეტა აღმოაჩინა — პირველი ასტრონომიული
    აღმოჩენა, რომელიც ქართველს ეკუთვნის. 2007 წლიდან ობსერვატორია ილიას სახელმწიფო უნივერსიტეტის შემადგენლობაშია
    და დღესაც მუშაობს.


    დაბაში ამბავი ადამიანურ სახეს იღებს. რუსეთის ტახტის მემკვიდრე, ცესარევიჩი გიორგი ალექსანდრეს ძე, ნიკოლოზ
    II-ის ძმა, აქ წლობით მკურნალობდა და 1899 წლის 28 ივნისს, 28 წლისა, ზეკარის უღელტეხილიდან დაღმართზე
    უეცრად გარდაიცვალა — ოფიციალური ცნობით, „ბენზინის ძრავიან ველოსიპედზე“ მჯდომი, მოლოკანი ქალის, ანა
    დასოევას თვალწინ. იმ ადგილას კარარის მარმარილოს სამლოცველო დგას, მისივე დაკვეთით აგებულ ალექსანდრე
    ნეველის ეკლესიაში კი მიხაილ ნესტეროვის ფრესკებია.


    ტელესკოპების სანახავად ამოდიხართ, მაგრამ სიბნელე დაგამახსოვრდებათ: როცა ბოლო მანქანა სერპანტინზე ჩაიკარგება,
    ყანობილს ისევ ის მოწმენდილი ღამე რჩება, რომელმაც 1892 წელს გლაზენაპი თავისი პატარა ტელესკოპით ამ ხეობაში
    ამოიყვანა.
  tip: >-
    ეს მოქმედი სამეცნიერო დაწესებულებაა და არა მუზეუმი, სადაც თავისუფლად შეხვალთ: ექსკურსია წინასწარ დაჯავშნეთ
    ილიას სახელმწიფო უნივერსიტეტის (iliauni.edu.ge) მეშვეობით და წინა დღეს კიდევ ერთხელ დაადასტურეთ. ტური
    ფასიანია — მიმდინარე ფასი დაჯავშნისას დააზუსტეთ. ექსკურსიები დღისით ტარდება; საღამოს ტელესკოპში ცქერა
    მხოლოდ მოწმენდილ ცაზე ხერხდება, ამიტომ ის საჩუქრად მიიჩნიეთ და არა გეგმად. ყანობილზე დაბაზე შესამჩნევად
    ცივა — თბილი სამოსი აგვისტოშიც წაიღეთ. მანქანას ზედა მოედანზე დატოვებთ. საჭმელი, ღამის გასათევი და
    ნესტეროვის ეკლესია ქვემოთ, აბასთუმანშია; ნაღდი ფული ახალციხეში აიღეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთით ხაშურამდე იარეთ, იქიდან S8-ით სამხრეთით, ბორჯომის გავლით, ახალციხემდე,
    შემდეგ კი დასავლეთით, ოცხის ტყიანი ხეობით, დაახლოებით 30 კილომეტრი აბასთუმნამდე. სულ დაახლოებით 240
    კილომეტრი და ოთხ საათზე ცოტა მეტი. კურორტამდე ასფალტია, ადგილ-ადგილ დაკემსილი. ობსერვატორიამდე ბოლო
    8 კილომეტრი ციცაბო, ვიწრო სერპანტინია დაზიანებული საფარით — სწორედ ამიტომ გირჩევთ ჯიპს ან კროსოვერს
    და არა ეკონომ-კლასს. საწვავი ახალციხეში შეავსეთ, მერე საიმედო ბენზინგასამართი აღარ შეგხვდებათ. ზამთარში
    და ძლიერი წვიმის შემდეგ სერპანტინი შეიძლება ჩაიკეტოს — ასვლამდე დაბაში იკითხეთ.
en:
  name: Abastumani Astrophysical Observatory
  short: >-
    White domes in the pines of Mount Kanobili, where Georgian astronomy began in 1932, above the faded
    imperial spa of Abastumani.
  body: >-
    **On Mount Kanobili the pines open onto white domes, and you soon understand that what was chosen
    here, before anything else, was the sky.**


    Below, in the gorge of the Otskhe, Abastumani rose in the 19th century as a mountain cure for the
    lungs: dry, sheltered air and, from 1864, a military hospital every summer. In 1892 St Petersburg
    University set up a temporary observatory in the village, and Professor Sergei Glazenap used a small
    telescope to separate close double stars that could not be resolved elsewhere.


    The permanent observatory followed on 28 February 1932, founded by the young astronomer Evgeni Kharadze,
    who led it for sixty years. The instruments arrived one dome at a time: a 40 cm Zeiss refractor, a
    70 cm Maksutov meniscus telescope in the mid-1950s, the 125 cm Ritchey–Chrétien reflector in 1977.
    In 1942 Giorgi Tevzadze discovered two new comets from here, the first astronomical discovery made
    by a Georgian. Since 2007 the observatory has been part of Ilia State University, and it is still
    at work.


    Down in the village the story turns human. Tsesarevich George Alexandrovich, heir to the Russian throne
    and brother of Nicholas II, spent years here under treatment, and on 28 June 1899, aged 28, died suddenly
    on the road down from the Zekari Pass — riding, according to the official notice, 'a bicycle with
    a petrol engine', in front of a Molokan woman named Anna Dasoeva. A chapel of Carrara marble marks
    the spot, and the Church of St Alexander Nevsky, built at his wish, holds frescoes by Mikhail Nesterov.


    You climb up for the telescopes, but it is the darkness you remember: when the last car has gone down
    the serpentine, Kanobili keeps the same clear night that drew Glazenap up this valley with his small
    telescope in 1892.
  tip: >-
    This is a working research institute, not a museum you can wander into: book a guided visit in advance
    through Ilia State University (iliauni.edu.ge) and confirm the day before. Tours are paid; check the
    current price when you book. Visits run in daylight, and an evening session at the eyepiece happens
    only under a clear sky, so treat it as luck rather than a plan. Kanobili is noticeably colder than
    the village, so bring a warm layer even in August. Parking is on the upper terrace. Food, rooms and
    the Nesterov church are down in Abastumani; for cash, use an ATM in Akhaltsikhe.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, then the S8 south through Borjomi to Akhaltsikhe, and
    from there head west up the wooded Otskhe valley for about 30 km to Abastumani. Allow roughly 240
    km and a little over four hours. Asphalt reaches the resort, patched in places. The last 8 km to the
    observatory are a steep, narrow serpentine with a broken surface, which is why we suggest an SUV or
    crossover rather than an economy car. Fill up in Akhaltsikhe; there is no reliable fuel beyond it.
    In winter and after heavy rain the serpentine can close, so ask in the village before you climb.
ru:
  name: Абастуманская астрофизическая обсерватория
  short: >-
    Белые купола в соснах горы Канобили, где в 1932 году началась грузинская астрономия, — над поблёкшим
    царским курортом Абастумани.
  body: >-
    **На горе Канобили сосны расступаются перед белыми куполами, и вскоре понимаешь: прежде всего здесь
    выбирали небо.**


    Внизу, в ущелье Оцхе, в XIX веке вырос Абастумани — горный курорт для лечения лёгких: сухой воздух,
    укрытый от ветров, и, с 1864 года, каждое лето военный госпиталь. В 1892 году Петербургский университет
    устроил в посёлке временную обсерваторию, и профессор Сергей Глазенап с небольшим телескопом разделял
    тесные двойные звёзды, которые в других местах разрешить не удавалось.


    Постоянная обсерватория появилась 28 февраля 1932 года. Её основал молодой астроном Евгений Харадзе,
    руководивший ею шестьдесят лет. Инструменты прибывали купол за куполом: 40-сантиметровый рефрактор
    Цейса, 70-сантиметровый менисковый телескоп Максутова в середине 1950-х, 125-сантиметровый рефлектор
    Ричи — Кретьена в 1977 году. В 1942 году Георгий Тевзадзе открыл отсюда две новые кометы — первое
    астрономическое открытие, сделанное грузином. С 2007 года обсерватория входит в Государственный университет
    Ильи и работает до сих пор.


    А в посёлке история становится человеческой. Цесаревич Георгий Александрович, наследник российского
    престола и брат Николая II, годами лечился здесь и 28 июня 1899 года, в 28 лет, внезапно умер на дороге,
    спускающейся с Зекарского перевала, — он ехал, согласно официальному сообщению, «на велосипеде с бензиновым
    двигателем», на глазах у молоканки Анны Дасоевой. Это место отмечает часовня из каррарского мрамора,
    а в церкви Святого Александра Невского, построенной по его желанию, хранятся росписи Михаила Нестерова.


    Наверх поднимаются ради телескопов, но запоминается темнота: когда последняя машина уходит вниз по
    серпантину, Канобили хранит ту же ясную ночь, что в 1892 году привела Глазенапа с его маленьким телескопом
    в эту долину.
  tip: >-
    Это действующий научный институт, а не музей, куда можно зайти просто так: экскурсию нужно заказать
    заранее через Государственный университет Ильи (iliauni.edu.ge) и подтвердить накануне. Экскурсии
    платные; актуальную цену уточните при бронировании. Посещения проходят днём, а вечерний сеанс у окуляра
    бывает только при ясном небе — считайте его удачей, а не планом. На Канобили заметно холоднее, чем
    в посёлке, так что тёплая одежда пригодится даже в августе. Парковка — на верхней террасе. Еда, ночлег
    и церковь с росписями Нестерова — внизу, в Абастумани; наличные снимайте в банкомате в Ахалцихе.
  route: >-
    Из Тбилиси езжайте по E60/S1 на запад до Хашури, затем по S8 на юг через Боржоми до Ахалцихе, а оттуда
    — на запад, вверх по лесистой долине Оцхе, около 30 км до Абастумани. Закладывайте примерно 240 км
    и чуть больше четырёх часов. Асфальт доходит до самого курорта, местами латаный. Последние 8 км до
    обсерватории — крутой узкий серпантин с разбитым покрытием, поэтому мы советуем внедорожник или кроссовер,
    а не машину эконом-класса. Заправьтесь в Ахалцихе: дальше надёжных заправок нет. Зимой и после сильных
    дождей серпантин могут закрыть, так что перед подъёмом спросите в посёлке.
fa:
  name: رصدخانهٔ اخترفیزیک آباستومانی
  short: >-
    گنبدهای سفید در میان کاج‌های کوه کانوبیلی، جایی که اخترشناسی گرجستان در ۱۹۳۲ آغاز شد، بر فراز استراحتگاه
    امپراتوریِ رنگ‌باختهٔ آباستومانی.
  body: >-
    **بر کوه کانوبیلی کاج‌ها کنار می‌روند و گنبدهای سفید پدیدار می‌شوند، و زود درمی‌یابید که آنچه اینجا
    پیش از هر چیز برگزیده شد، آسمان بود.**


    در پایین، در درهٔ رود اوتسخه، آباستومانی در سدهٔ نوزدهم چون درمانگاهی کوهستانی برای بیماران ریوی شکل
    گرفت: هوایی خشک و در پناه باد، و از ۱۸۶۴ هر تابستان یک بیمارستان نظامی. در ۱۸۹۲ دانشگاه سن‌پترزبورگ
    رصدخانه‌ای موقت در این آبادی برپا کرد و پروفسور سرگئی گلازناپ با تلسکوپی کوچک ستاره‌های دوتاییِ نزدیک
    به هم را از یکدیگر جدا کرد، ستاره‌هایی که در جاهای دیگر تفکیکشان ممکن نبود.


    رصدخانهٔ دائمی در ۲۸ فوریهٔ ۱۹۳۲ پا گرفت، به همت اخترشناس جوان، اوگنی خارادزه، که شصت سال آن را اداره
    کرد. ابزارها گنبد به گنبد از راه رسیدند: تلسکوپ شکستی ۴۰ سانتی‌متری زایس، تلسکوپ منیسکی ۷۰ سانتی‌متری
    ماکسوتوف در میانهٔ دههٔ ۱۹۵۰، و تلسکوپ بازتابی ۱۲۵ سانتی‌متری ریچی–کرتین در ۱۹۷۷. در ۱۹۴۲ گیورگی توزادزه
    از همین‌جا دو دنباله‌دار تازه کشف کرد، نخستین کشف نجومی به دست یک گرجی. از ۲۰۰۷ رصدخانه بخشی از دانشگاه
    دولتی ایلیا است و هنوز کار می‌کند.


    پایین‌تر، در آبادی، داستان رنگ انسانی به خود می‌گیرد. گئورگی آلکساندرویچ، ولیعهد روسیه و برادر نیکلای
    دوم، سال‌ها برای درمان اینجا ماند و در ۲۸ ژوئن ۱۸۹۹، در ۲۸ سالگی، در جاده‌ای که از گردنهٔ زکاری پایین
    می‌آید ناگهان درگذشت — به گفتهٔ اطلاعیهٔ رسمی، سوار بر «دوچرخه‌ای با موتور بنزینی»، پیش چشم زنی مولوکان
    به نام آنا داسویوا. نمازخانه‌ای از مرمر کارارا آن نقطه را نشان می‌دهد، و کلیسای قدیس الکساندر نوسکی،
    که به خواست خود او ساخته شد، دیوارنگاره‌هایی از میخائیل نستروف را در خود نگه داشته است.


    برای تلسکوپ‌ها بالا می‌روید، اما آنچه در یاد می‌ماند تاریکی است: وقتی آخرین خودرو از جادهٔ مارپیچ
    پایین رفت، کانوبیلی همان شب صافی را نگه می‌دارد که در ۱۸۹۲ گلازناپ را با تلسکوپ کوچکش به بالای این
    دره کشاند.
  tip: >-
    اینجا مؤسسه‌ای پژوهشی و فعال است، نه موزه‌ای که بشود سرزده واردش شد: بازدید با راهنما را از پیش از
    طریق دانشگاه دولتی ایلیا (iliauni.edu.ge) رزرو کنید و روز قبل دوباره تأیید بگیرید. تورها پولی‌اند؛
    هنگام رزرو قیمت فعلی را بپرسید. بازدیدها در روز انجام می‌شوند و نشست شبانه پشت چشمی تلسکوپ فقط زیر
    آسمان صاف پیش می‌آید، پس آن را بخت بدانید، نه برنامه. کانوبیلی به‌طور محسوسی از آبادی سردتر است؛ حتی
    در اوت لباس گرم همراه داشته باشید. پارکینگ روی تراس بالایی است. غذا، اقامتگاه و کلیسای دیوارنگاره‌های
    نستروف پایین، در آباستومانی‌اند؛ برای پول نقد از خودپردازی در آخالتسیخه استفاده کنید.
  route: >-
    از تفلیس با جادهٔ E60/S1 به غرب تا خاشوری بروید، سپس از S8 به جنوب از راه بورجومی تا آخالتسیخه، و
    از آنجا به غرب، سربالا در درهٔ جنگلی اوتسخه، حدود ۳۰ کیلومتر تا آباستومانی. روی‌هم حدود ۲۴۰ کیلومتر
    و کمی بیش از چهار ساعت در نظر بگیرید. آسفالت تا خود استراحتگاه می‌رسد، جابه‌جا وصله‌خورده. ۸ کیلومتر
    آخر تا رصدخانه جاده‌ای مارپیچ، پرشیب و باریک با رویه‌ای خراب است، و از همین رو به‌جای خودروی اقتصادی،
    شاسی‌بلند یا کراس‌اوور پیشنهاد می‌کنیم. در آخالتسیخه باک را پر کنید؛ پس از آن پمپ‌بنزینِ قابل‌اعتمادی
    نیست. در زمستان و پس از باران‌های سنگین ممکن است این جادهٔ مارپیچ بسته شود، پس پیش از بالا رفتن در
    آبادی بپرسید.
he:
  name: המצפה האסטרופיזי של אבסתומני
  short: >-
    כיפות לבנות בין האורנים של הר קנובילי, שבו החלה האסטרונומיה הגאורגית ב-1932, מעל עיירת המרפא הקיסרית
    הדהויה אבסתומני.
  body: >-
    **על הר קנובילי נפתחים האורנים אל כיפות לבנות, ומהר מאוד מבינים שמה שנבחר כאן, לפני כל דבר אחר, היה
    השמיים.**


    למטה, בערוץ נהר אוצחה, צמחה אבסתומני במאה ה-19 כמקום מרפא הררי לחולי ריאות: אוויר יבש ומוגן מרוחות,
    ומשנת 1864 בית חולים צבאי בכל קיץ. ב-1892 הקימה אוניברסיטת סנקט פטרבורג מצפה זמני בכפר, והפרופסור
    סרגיי גלזנאפ הצליח בעזרת טלסקופ קטן להפריד כוכבים כפולים צמודים שבמקומות אחרים לא ניתן היה להבחין
    ביניהם.


    המצפה הקבוע נוסד ב-28 בפברואר 1932 בידי האסטרונום הצעיר יבגני חרדזה, שעמד בראשו שישים שנה. המכשירים
    הגיעו כיפה אחר כיפה: טלסקופ שבירה של צייס בקוטר 40 ס"מ, טלסקופ מניסקוס מסוג מקסוטוב בקוטר 70 ס"מ באמצע
    שנות ה-50, וטלסקופ מחזיר אור מסוג ריצ'י–כרטיין בקוטר 125 ס"מ ב-1977. ב-1942 גילה מכאן גיורגי טבזאדזה
    שני שביטים חדשים – התגלית האסטרונומית הראשונה שנעשתה בידי גאורגי. מאז 2007 המצפה הוא חלק מאוניברסיטת
    איליה הממלכתית, והוא פעיל עד היום.


    למטה, בכפר, הסיפור נעשה אנושי. הצסרביץ' גאורגי אלכסנדרוביץ', יורש העצר הרוסי ואחיו של ניקולאי השני,
    שהה כאן שנים לצורך טיפול, וב-28 ביוני 1899, בן 28, מת לפתע בדרך היורדת ממעבר זקרי – כשהוא רוכב, לפי
    ההודעה הרשמית, על "אופניים עם מנוע בנזין", לעיני אישה מולוקנית בשם אנה דסויבה. קפלה משיש קררה מסמנת
    את המקום, ובכנסיית אלכסנדר נבסקי הקדוש, שנבנתה לפי רצונו, יש ציורי קיר של מיכאיל נסטרוב.


    עולים לכאן בשביל הטלסקופים, אבל את החושך זוכרים: כשהמכונית האחרונה ירדה בדרך המתפתלת, קנובילי שומר
    על אותו לילה צלול שמשך את גלזנאפ במעלה העמק הזה עם הטלסקופ הקטן שלו ב-1892.
  tip: >-
    זהו מכון מחקר פעיל, לא מוזיאון שאפשר פשוט להיכנס אליו: הזמינו סיור מודרך מראש דרך אוניברסיטת איליה
    הממלכתית (iliauni.edu.ge) ואשרו שוב יום לפני. הסיורים בתשלום; בדקו את המחיר העדכני בעת ההזמנה. הביקורים
    מתקיימים באור יום, ותצפית ערב דרך הטלסקופ מתקיימת רק כשהשמיים בהירים, אז התייחסו אליה כאל מזל ולא
    כאל תוכנית. בקנובילי קר במידה ניכרת יותר מאשר בכפר, לכן הביאו שכבה חמה גם באוגוסט. החניה בטרסה העליונה.
    אוכל, לינה והכנסייה עם ציורי נסטרוב נמצאים למטה, באבסתומני; למזומן השתמשו בכספומט באחלציחה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, אחר כך דרומה בכביש S8 דרך בורג'ומי עד אחלציחה, ומשם מערבה
    במעלה עמק אוצחה המיוער, כ-30 ק"מ עד אבסתומני. קחו בחשבון כ-240 ק"מ וקצת יותר מארבע שעות נסיעה. האספלט
    מגיע עד עיירת המרפא, עם טלאים פה ושם. הקטע האחרון, 8 ק"מ עד המצפה, הוא דרך מתפתלת, תלולה וצרה עם משטח
    שבור, ולכן אנו ממליצים על רכב שטח או קרוסאובר ולא על רכב מקטגוריית אקונומי. תדלקו באחלציחה; אחריה
    אין תחנת דלק שאפשר לסמוך עליה. בחורף ואחרי גשמים כבדים הדרך המתפתלת עלולה להיסגר, לכן שאלו בכפר לפני
    שאתם עולים.
ar:
  name: مرصد أباستوماني للفيزياء الفلكية
  short: >-
    قباب بيضاء بين صنوبر جبل كانوبيلي، حيث وُلد علم الفلك الجورجي عام 1932، فوق منتجع أباستوماني الإمبراطوري
    الذي خبا بريقه.
  body: >-
    **على جبل كانوبيلي ينفرج الصنوبر عن قباب بيضاء، وسرعان ما تدرك أن ما اختير هنا قبل أي شيء آخر كان
    السماء.**


    في الأسفل، في وادي نهر أوتسخي، نشأت أباستوماني في القرن التاسع عشر منتجعاً جبلياً لعلاج أمراض الرئة:
    هواء جاف محميّ من الرياح، ومنذ عام 1864 مستشفى عسكري كل صيف. وفي عام 1892 أقامت جامعة سانت بطرسبرغ
    مرصداً مؤقتاً في القرية، فتمكّن البروفيسور سيرغي غلازناب بتلسكوب صغير من الفصل بين نجوم مزدوجة متقاربة
    تعذّر تمييزها في أماكن أخرى.


    ثم جاء المرصد الدائم في 28 فبراير 1932، وقد أسسه الفلكي الشاب يفغيني خارادزه، الذي تولّى إدارته ستين
    عاماً. ووصلت الأجهزة قبةً بعد قبة: تلسكوب زايس الانكساري بقطر 40 سم، وتلسكوب ماكسوتوف ذو العدسة الهلالية
    بقطر 70 سم في منتصف الخمسينيات، والتلسكوب العاكس من طراز ريتشي–كريتيان بقطر 125 سم عام 1977. وفي عام
    1942 اكتشف غيورغي تيفزادزه من هنا مذنّبين جديدين، في أول اكتشاف فلكي يحققه جورجي. ومنذ عام 2007 أصبح
    المرصد جزءاً من جامعة إيليا الحكومية، وما زال يعمل حتى اليوم.


    أما في القرية في الأسفل فتتخذ الحكاية وجهاً إنسانياً. فقد أمضى غيورغي ألكسندروفيتش، وليّ عهد العرش
    الروسي وشقيق نيقولا الثاني، سنوات هنا يتلقى العلاج، وفي 28 يونيو 1899، وهو في الـ28 من عمره، مات فجأة
    على الطريق النازل من ممر زيكاري — وكان يركب، بحسب البلاغ الرسمي، «دراجة بمحرك بنزين»، أمام امرأة من
    طائفة المولوكان تُدعى آنا داسوييفا. ويقوم في الموضع مُصلّى من رخام كرارا، أما كنيسة القديس ألكسندر
    نيفسكي، التي بُنيت بناءً على رغبته، فتضم جداريات لميخائيل نيستيروف.


    تصعد من أجل التلسكوبات، لكن الظلمة هي ما يبقى في الذاكرة: حين تنزل آخر سيارة على الطريق المتعرّج،
    يحتفظ كانوبيلي بالليل الصافي نفسه الذي اجتذب غلازناب إلى أعلى هذا الوادي بتلسكوبه الصغير عام 1892.
  tip: >-
    هذا معهد بحثي عامل، لا متحف تدخله متى شئت: احجز زيارة مع مرشد مسبقاً عبر جامعة إيليا الحكومية (iliauni.edu.ge)
    وأكّدها في اليوم السابق. الجولات مدفوعة؛ تحقّق من السعر الحالي عند الحجز. تجري الزيارات نهاراً، أما
    جلسة الرصد المسائية عند العينية فلا تكون إلا حين تصفو السماء، فاعتبرها حظاً لا خطة. كانوبيلي أبرد
    من القرية بشكل ملحوظ، فاحمل ثياباً دافئة حتى في أغسطس. الموقف على المصطبة العليا. الطعام والمبيت وكنيسة
    جداريات نيستيروف في الأسفل في أباستوماني؛ وللنقد استخدم صرافاً آلياً في أخالتسيخه.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، ثم S8 جنوباً عبر بورجومي إلى أخالتسيخه، ومن هناك اتجه
    غرباً صعوداً في وادي أوتسخي المشجّر نحو 30 كم حتى أباستوماني. احسب نحو 240 كم وما يزيد قليلاً على
    أربع ساعات. يصل الأسفلت إلى المنتجع، مرقّعاً في مواضع. أما آخر 8 كم إلى المرصد فطريق متعرّج شديد الانحدار
    وضيق وسطحه متكسّر، ولهذا ننصح بسيارة دفع رباعي أو كروس أوفر بدلاً من سيارة اقتصادية. املأ الخزان في
    أخالتسيخه، فلا محطة وقود يُعتمد عليها بعدها. في الشتاء وبعد الأمطار الغزيرة قد يُغلق الطريق المتعرّج،
    فاسأل في القرية قبل الصعود.
