ka:
  name: აბასთუმნის ასტროფიზიკური ობსერვატორია
  short: მთა ყანობილზე აშენებული პირველი მთის ობსერვატორია რეგიონში, სამკურნალო კურორტ აბასთუმანთან.
  body: >
    აბასთუმანი ჯერ კიდევ XIX საუკუნეში გახდა ცნობილი მშრალი, წიწვოვანი ჰაერით — აქ ფილტვის დაავადებებს
    მკურნალობდნენ და სწორედ ამ კურორტზე გაატარა ბოლო წლები დიდმა მთავარმა გიორგი რომანოვმა. იმავე კლიმატურმა
    თვისებამ, კერძოდ კი წელიწადში ასეულობით უღრუბლო ღამემ, ადგილი ასტრონომებისთვისაც იდეალური გახადა.


    ობსერვატორია 1932 წელს დაარსდა მთა ყანობილზე, კურორტის ზემოთ, დაახლოებით 1 650 მეტრზე. ეს იყო **რეგიონის
    პირველი მაღალმთიანი ასტროფიზიკური ობსერვატორია** და ათწლეულების განმავლობაში მისი ტელესკოპები საბჭოთა
    ასტრონომიის მთავარ ინსტრუმენტებს შორის იყო. დღეს ის ილიას სახელმწიფო უნივერსიტეტს ეკუთვნის.


    რას ნახავს სტუმარი:


    - გუმბათებში დაცული ისტორიული ტელესკოპები, მათ შორის დიდი რეფლექტორი და მენისკური სისტემა

    - საბჭოთა ეპოქის სამეცნიერო შენობები ტყის შუაგულში

    - ხედი მესხეთის ქედებზე ზედა მოედნიდან


    აბასთუმანი თავადაც ღირს გაჩერებას: ხის აივნებიანი ძველი აგარაკები, გოგირდოვანი აბანოები და ვიწრო ხეობის
    მდინარე ოტსხე ერთმანეთს ერწყმის. კურორტი ბოლო წლებში თანდათან ახლდება, თუმცა მისი მთავარი ხიბლი სწორედ
    დროში გაჩერებული, გაუბზარავი ატმოსფეროა.


    ექსკურსია ჩვეულებრივ დღის საათებში ტარდება, ხოლო კარგ ამინდში ზოგჯერ საღამოს დაკვირვებაც ეწყობა.


    ობსერვატორიის გარშემო წიწვოვანი ტყეა და ზედა მოედნიდან რამდენიმე მოკლე ბილიკი გამოდის. ღამის დაკვირვების
    შემთხვევაში გაითვალისწინე, რომ ბნელ სერპანტინზე ჩამოსვლა ფრთხილად ტარებას მოითხოვს — განათება არსად
    არის და მოხვევები მკვეთრია.
  tip: >
    ვიზიტი წინასწარ შეათანხმე — ობსერვატორია სამუშაო სამეცნიერო ობიექტია და გიდის გარეშე შესვლა არ ხდება.
    ტელესკოპებში დაკვირვება მხოლოდ უღრუბლო ღამეს არის შესაძლებელი, ამიტომ საღამოს ვიზიტი ყოველთვის ამინდზეა
    დამოკიდებული. კურორტიდან ზემოთ ტემპერატურა შესამჩნევად ეცემა: თბილი ტანსაცმელი ზაფხულშიც წაიღე. მანქანა
    ზედა მოედანზე ტოვებ. კაფე და მაღაზია მხოლოდ აბასთუმანშია, ბანკომატი — ახალციხეში. ღამის ვიზიტის შემთხვევაში
    ჩამოსვლა სიბნელეში მოგიწევს — ფანარი და დასვენებული მძღოლი აუცილებელია.
  route: >
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომზე და ახალციხემდე. ახალციხიდან დასავლეთით უხვევ და დაახლოებით
    ოცდაათ კილომეტრში ხეობის სიღრმეში აბასთუმანშია. სულ ორას ოცდათხუთმეტი კილომეტრი და თითქმის ოთხი საათი.
    კურორტამდე ასფალტია, თუმცა ადგილ-ადგილ დაზიანებული; ობსერვატორიამდე ბოლო რვა კილომეტრი ციცაბო სერპანტინია
    ვიწრო და უხეში საფარით — სწორედ ამიტომ სჯობს კროსოვერი. ზამთარში ეს მონაკვეთი შეიძლება თოვლის გამო
    გაუვალი იყოს. საწვავი ახალციხეში აავსე. აბასთუმანში სასტუმროებია, ამიტომ ღამის დაკვირვების შემთხვევაში
    ღამის გათევა აქვე დაგეგმე.
en:
  name: Abastumani Astrophysical Observatory
  short: The first mountain observatory in the region, on Mount Kanobili above the old lung-cure resort
    of Abastumani.
  body: >-
    Abastumani made its name in the 19th century for dry pine air prescribed against lung disease; Grand
    Duke George Romanov spent his final years at this resort. The same climate — hundreds of cloudless
    nights a year — later turned out to be ideal for a very different purpose.


    The observatory was founded in 1932 on Mount Kanobili, above the resort at roughly 1,650 metres. It
    was **the first high-altitude astrophysical observatory in the region**, and for decades its telescopes
    were among the principal instruments of Soviet astronomy. Today the site belongs to Ilia State University
    and still carries out research.


    What a visit involves:


    - historic telescopes inside their domes, including the large reflector and a meniscus system

    - Soviet-era scientific buildings scattered through the forest

    - a long view over the Meskheti ridges from the upper terrace


    Abastumani itself deserves the stop. Old wooden dachas with carved balconies, sulphur bathhouses and
    the Otskhe river fill a tight forested valley. The resort is slowly being renovated, but its appeal
    is precisely that it feels stopped in time, unpolished and quiet in a way few Georgian resorts still
    manage.


    Tours normally run during daylight hours, and in clear weather an evening observing session is sometimes
    arranged.
  tip: >-
    Arrange the visit in advance: this is a working research site and you cannot simply walk in without
    a guide. Actual observing through a telescope depends entirely on clear skies, so treat an evening
    session as a bonus rather than a plan. Temperatures drop noticeably above the resort — bring a warm
    layer even in August. Park on the upper terrace. Cafes and shops exist only down in Abastumani; the
    nearest ATM is in Akhaltsikhe.
  route: >-
    Follow the E60 from Tbilisi to Khashuri, then head south through Borjomi to Akhaltsikhe. From there
    turn west and drive about 30 km up a wooded valley to Abastumani — 235 km and close to four hours
    in total. Asphalt reaches the resort, though it is patchy in places. The final eight kilometres up
    to the observatory are a steep, narrow serpentine with rough surface, which is why a crossover is
    the sensible choice. In winter this section can be blocked by snow. Fill up in Akhaltsikhe.
ru:
  name: Абастуманская астрофизическая обсерватория
  short: Первая горная обсерватория региона на горе Канобили над старым климатическим курортом Абастумани.
  body: >
    Абастумани прославился ещё в XIX веке сухим хвойным воздухом, который прописывали при лёгочных заболеваниях;
    на этом курорте провёл последние годы великий князь Георгий Романов. Тот же климат — сотни безоблачных
    ночей в году — позже оказался идеальным совсем для другой задачи.


    Обсерваторию основали в 1932 году на горе Канобили, выше курорта, примерно на 1 650 метрах. Это была
    **первая высокогорная астрофизическая обсерватория в регионе**, и десятилетиями её телескопы оставались
    одними из главных инструментов советской астрономии. Сегодня комплекс принадлежит Университету Ильи
    и продолжает вести исследования.


    Что входит в визит:


    - исторические телескопы под куполами, включая большой рефлектор и менисковую систему

    - научные корпуса советской эпохи, разбросанные по лесу

    - широкий вид на хребты Месхети с верхней площадки


    Сам Абастумани стоит остановки: деревянные дачи с резными балконами, серные бани и река Оцхе в тесном
    лесистом ущелье. Курорт понемногу обновляют, но его обаяние именно в ощущении остановившегося времени
    — тихого и неотреставрированного, каким мало какие грузинские курорты остаются.


    Экскурсии обычно проводят днём, а в ясную погоду иногда организуют вечерние наблюдения.


    Обсерваторию окружает хвойный лес, и от верхней площадки расходятся несколько коротких троп. Если
    планируете ночные наблюдения, учтите: спуск по тёмному серпантину требует аккуратности — освещения
    нет нигде, а повороты резкие.
  tip: >-
    Визит согласуйте заранее: это действующий научный объект, попасть внутрь без сопровождающего нельзя.
    Наблюдения в телескоп возможны только в безоблачную ночь, поэтому вечерний сеанс стоит считать удачей,
    а не пунктом плана. Выше курорта заметно холоднее — тёплую одежду берите даже в августе. Машину оставляют
    на верхней площадке. Кафе и магазины есть только внизу, в Абастумани, ближайший банкомат — в Ахалцихе.
  route: >-
    Из Тбилиси по E60 до Хашури, затем через Боржоми на Ахалцихе. Оттуда поворот на запад и около 30 км
    вверх по лесистому ущелью до Абастумани — всего 235 км и почти четыре часа. До курорта идёт асфальт,
    местами разбитый. Последние восемь километров к обсерватории — крутой узкий серпантин с грубым покрытием,
    поэтому разумнее ехать на кроссовере. Зимой этот участок может быть закрыт снегом. Заправляйтесь в
    Ахалцихе, выше заправок нет.
fa:
  name: رصدخانهٔ اخترفیزیک آباستومانی
  short: نخستین رصدخانهٔ کوهستانی منطقه، بر کوه کانوبیلی بالای آسایشگاه قدیمی ریوی آباستومانی.
  body: >-
    آباستومانی در سدهٔ نوزدهم به‌خاطر هوای خشک کاج که برای بیماری‌های ریوی تجویز می‌شد نام درکرد؛ گرند
    دوک گئورگی رومانوف سال‌های پایانی عمرش را در همین آسایشگاه گذراند. بعدها معلوم شد همان اقلیم — صدها
    شب بی‌ابر در سال — برای هدفی کاملاً متفاوت ایده‌آل است.


    رصدخانه در 1932 بر کوه کانوبیلی، بالای آسایشگاه و در ارتفاع حدود 1,650 متر بنیاد گذاشته شد. این **نخستین
    رصدخانهٔ اخترفیزیک کوهستانی منطقه** بود و تلسکوپ‌هایش ده‌ها سال از ابزارهای اصلی اخترشناسی شوروی به
    شمار می‌رفتند. امروز این مجموعه به دانشگاه دولتی ایلیا تعلق دارد و هنوز پژوهش انجام می‌دهد.


    بازدید شامل این‌هاست:


    - تلسکوپ‌های تاریخی درون گنبدهایشان، از جمله بازتابندهٔ بزرگ و یک سامانهٔ منیسک

    - ساختمان‌های علمی دوران شوروی که میان جنگل پراکنده‌اند

    - چشم‌اندازی دور بر ستیغ‌های مسختی از مصطبهٔ بالایی


    خود آباستومانی هم ارزش توقف دارد. ویلاهای چوبی قدیمی با بالکن‌های کنده‌کاری‌شده، گرمابه‌های گوگردی
    و رودخانهٔ اوتسخه دره‌ای تنگ و جنگلی را پر کرده‌اند. آسایشگاه به‌آرامی بازسازی می‌شود، اما جذابیتش
    دقیقاً در همین است که انگار زمان در آن ایستاده — بی‌آرایش و آرام، به شکلی که کمتر آسایشگاه گرجی امروز
    حفظ کرده است.


    گشت‌ها معمولاً در ساعات روشنایی روز برگزار می‌شوند و در هوای صاف گاهی یک نشست رصد شبانه هم ترتیب داده
    می‌شود.
  tip: >-
    بازدید را از پیش هماهنگ کنید: اینجا مرکز پژوهشی فعالی است و بدون راهنما نمی‌توان همین‌طور وارد شد.
    رصد واقعی از پشت تلسکوپ کاملاً به صاف بودن آسمان بستگی دارد، پس نشست شبانه را جایزه بدانید نه برنامه.
    دما بالاتر از آسایشگاه به‌روشنی افت می‌کند — حتی در اوت یک لایهٔ گرم بردارید. در مصطبهٔ بالایی پارک
    کنید. کافه و مغازه فقط پایین در آباستومانی هست؛ نزدیک‌ترین خودپرداز در آخالتسیخه است.
  route: >-
    از تفلیس E60 را تا خاشوری بروید، سپس از راه بورجومی به سمت جنوب و آخالتسیخه. از آنجا به غرب بپیچید
    و حدود 30 کیلومتر در دره‌ای جنگلی تا آباستومانی بالا بروید — در مجموع 235 کیلومتر و نزدیک به چهار
    ساعت. آسفالت تا آسایشگاه ادامه دارد، هرچند جاهایی وصله‌پینه است. هشت کیلومتر پایانی تا رصدخانه سرپیچی
    تند و باریک با سطح ناهموار است و به همین دلیل کراس‌اوور انتخاب معقولی است. در زمستان این بخش ممکن
    است زیر برف مسدود شود. باک را در آخالتسیخه پر کنید.
he:
  name: המצפה האסטרופיזי של אבסתומני
  short: המצפה ההררי הראשון באזור, על הר קנובילי מעל אתר ההבראה הישן של אבסתומני.
  body: >-
    אבסתומני התפרסמה במאה ה-19 בזכות אוויר האורנים היבש שנרשם כתרופה למחלות ריאה; הדוכס הגדול גאורגי רומנוב
    בילה כאן את שנותיו האחרונות. אותו אקלים עצמו — מאות לילות נטולי עננים בשנה — התברר מאוחר יותר כאידיאלי
    למטרה שונה לגמרי.


    המצפה נוסד ב-1932 על הר קנובילי, מעל אתר ההבראה בגובה של כ-1,650 מטר. זה היה **מצפה הכוכבים האסטרופיזי
    הראשון בגובה רב באזור**, ובמשך עשורים היו הטלסקופים שלו בין המכשירים המרכזיים של האסטרונומיה הסובייטית.
    כיום שייך המתחם לאוניברסיטת איליה הממלכתית ועדיין נערך בו מחקר.


    מה כולל הביקור:


    - טלסקופים היסטוריים בתוך הכיפות שלהם, ובהם הטלסקופ המחזיר הגדול ומערכת מניסקוס

    - מבני מחקר מן התקופה הסובייטית פזורים בין העצים

    - מבט רחוק אל רכסי מסחתי מן המרפסת העליונה


    גם אבסתומני עצמה שווה עצירה. בתי עץ ישנים עם מרפסות מגולפות, מרחצאות גופרית ונחל אוצחה ממלאים עמק
    צר ומיוער. אתר ההבראה משופץ לאט, אבל הקסם שלו הוא בדיוק בכך שהוא נראה עצור בזמן, לא מלוטש ושקט באופן
    שמעטים מאתרי הנופש בגאורגיה עדיין מציעים.


    הסיורים מתקיימים בדרך כלל בשעות האור, ובמזג אוויר בהיר מארגנים לעיתים גם מפגש תצפית ערבי.
  tip: >-
    תאמו את הביקור מראש: זהו אתר מחקר פעיל ואי אפשר פשוט להיכנס בלי מדריך. תצפית אמיתית דרך הטלסקופ תלויה
    לחלוטין בשמיים בהירים, ולכן התייחסו למפגש ערב כאל בונוס ולא כאל תוכנית. הטמפרטורות יורדות בבירור מעל
    אתר ההבראה — קחו שכבה חמה גם באוגוסט. החנו במרפסת העליונה. בתי קפה וחנויות יש רק למטה באבסתומני; הכספומט
    הקרוב ביותר נמצא באחאלציחה.
  route: >-
    סעו מטביליסי בכביש E60 עד חשורי, ומשם דרומה דרך בורג'ומי לאחאלציחה. משם פנו מערבה ועלו כ-30 ק״מ בעמק
    מיוער עד אבסתומני — 235 ק״מ וקרוב לארבע שעות בסך הכול. האספלט מגיע עד אתר ההבראה, אם כי במקומות הוא
    מטולא. שמונת הקילומטרים האחרונים אל המצפה הם סרפנטינה תלולה וצרה במשטח מחוספס, ולכן קרוסאובר הוא הבחירה
    ההגיונית. בחורף הקטע הזה עלול להיחסם בשלג. תדלקו באחאלציחה.
ar:
  name: مرصد أباستوماني الفيزيائي الفلكي
  short: أول مرصد جبلي في المنطقة، على جبل كانوبيلي فوق منتجع أباستوماني القديم لعلاج الرئة.
  body: >-
    ذاع صيت أباستوماني في القرن التاسع عشر بفضل هواء الصنوبر الجاف الذي كان يُوصف لعلاج أمراض الرئة؛ وفيه
    أمضى الأمير الكبير غيورغي رومانوف سنواته الأخيرة. وتبيّن لاحقاً أن المناخ نفسه — مئات الليالي الصافية
    في السنة — مثالي لغرض مختلف تماماً.


    أُسس المرصد عام 1932 على جبل كانوبيلي، فوق المنتجع على ارتفاع نحو 1,650 متراً. وكان **أول مرصد فيزيائي
    فلكي مرتفع في المنطقة**، وظلت مقاريبه عقوداً من الأدوات الرئيسية لعلم الفلك السوفييتي. واليوم يتبع
    الموقع جامعة إيليا الحكومية وما زال يجري فيه البحث العلمي.


    ما تتضمنه الزيارة:


    - مقاريب تاريخية داخل قبابها، ومنها المقراب العاكس الكبير ومنظومة الهلالة

    - مبانٍ علمية من العهد السوفييتي متناثرة بين الأشجار

    - إطلالة بعيدة على سلاسل ميسخيتي من المصطبة العليا


    وأباستوماني نفسها تستحق التوقف. بيوت خشبية قديمة بشرفات منقوشة وحمامات كبريتية ونهر أوتسخي تملأ وادياً
    ضيقاً كثيف الغابات. يُرمَّم المنتجع ببطء، لكن جاذبيته تكمن تحديداً في إحساس أن الزمن توقف فيه، غير
    مصقول وهادئ على نحو لم تعد تحفظه كثير من المنتجعات الجورجية.


    تجري الجولات عادة في ساعات النهار، وفي الطقس الصافي تُنظَّم أحياناً جلسة رصد مسائية.
  tip: >-
    رتّب الزيارة مسبقاً: فهذا موقع بحثي عامل ولا يمكن دخوله ببساطة من دون مرشد. أما الرصد الفعلي عبر المقراب
    فيتوقف كلياً على صفاء السماء، فاعتبر الجلسة المسائية مكسباً إضافياً لا خطة. تنخفض الحرارة بوضوح فوق
    المنتجع — احمل طبقة دافئة حتى في أغسطس. أوقف السيارة على المصطبة العليا. المقاهي والمتاجر لا توجد
    إلا في الأسفل في أباستوماني؛ وأقرب صراف آلي في أخالتسيخي.
  route: >-
    اسلك الطريق E60 من تبليسي حتى خاشوري، ثم اتجه جنوباً عبر بورجومي إلى أخالتسيخي. ومن هناك انعطف غرباً
    واصعد نحو 30 كم في واد مشجر إلى أباستوماني — 235 كم وقرابة أربع ساعات إجمالاً. يصل الإسفلت حتى المنتجع،
    وإن كان مرقّعاً في مواضع. أما الكيلومترات الثمانية الأخيرة صعوداً إلى المرصد فطريق ملتوٍ حاد وضيق
    بسطح وعر، ولهذا تكون سيارة الكروس أوفر الخيار المعقول. وفي الشتاء قد يُغلق هذا المقطع بالثلج. املأ
    الخزان في أخالتسيخي.
