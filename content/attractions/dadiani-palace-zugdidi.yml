ka:
  name: დადიანების სასახლე ზუგდიდში
  short: >-
    სამეგრელოს მთავრების სასახლეები 1840 წელს გაშენებულ ბაღში — ნაპოლეონის ბრინჯაოს ნიღბითა და ღვთისმშობლის
    კვართად თაყვანცემული სიწმინდით.
  body: >-
    **მეგრული ქალაქის შუაგულში, ტიუდორული ფასადის მიღმა, ნაპოლეონის სახის ბრინჯაოს ანაბეჭდი ინახება.**
    ნიღაბი 1833 წელს პარიზში ანატომიის პროფესორის, ფრანჩესკო ანტომარკის დაკვეთით ჩამოასხეს — მისი სახელი
    და თარიღი დღესაც იკითხება ბრინჯაოზე. ზუგდიდში ის ქორწინებით მოხვდა: სალომე დადიანი ცოლად გაჰყვა პრინც
    აშილ მიურატს, მარშალ იოახიმ მიურატისა და ნაპოლეონის დის, კაროლინას შვილიშვილს, და აშილმა ოჯახის ფრანგული
    რელიკვიები თან ჩამოიტანა.


    დადიანები სამეგრელოს საუკუნეების განმავლობაში ზუგდიდიდან მართავდნენ — XVIII საუკუნეში ვახუშტი ბატონიშვილი
    აქ „დიდშენ და პალატებიან“ სასახლეს აღწერდა, „ზღუდე გოდლიანს“, — თუმცა დღევანდელი კომპლექსი XIX საუკუნისაა.
    დედოფლის სასახლე არქიტექტორმა ედვინ რაისმა გადააკეთა: გარედან ინგლისური ტიუდორების სტილი მისცა, შიდა
    ეზოში კი ქართული და ოსმალური ხელოვნება ლაზური აივნის გარშემო შეაზავა. XIX საუკუნის 80-იან წლებში რუსმა
    არქიტექტორმა ლეონიდ ვასილიევმა სამეგრელოს მთავარ ნიკო დადიანს მეორე სასახლე აუშენა, საქართველოში ყველაზე
    დიდი სამეჯლისო დარბაზით. ამ თაღებქვეშ ილია ჭავჭავაძე და აკაკი წერეთელი სტუმრობდნენ. სასახლე 1921 წლიდან
    მუზეუმია.


    დაახლოებით 50 000 ექსპონატს შორის მოძებნეთ ღვთისმშობლის კვართად თაყვანცემული სიწმინდე, რომელიც ოდესღაც
    ხობის მონასტერში ინახებოდა, და თამარ მეფის დედის, ბურდუხან დედოფლის XII საუკუნის ხატი 52 სანაწილე
    ბუდით.


    მერე ბაღში გადით. ბაღი 1840 წელს დავით დადიანმა მეუღლეს, ეკატერინეს გაუშენა; მებაღე ჟოზეფ ბაბინი ტრიესტიდან
    მოიწვიეს, თესლი კი ვერსალის ბაღიდან გამოიწერეს. 1856 წელს ოსმალო ჯარმა ბაღი გაჩეხა. „ზუგდიდი აღარ
    არის“, — წერდა დამწუხრებული ეკატერინე, და ბაღი ხელახლა გააშენა. ინდოეთიდან, იაპონიიდან, იტალიიდან
    და ჩრდილოეთ ამერიკიდან ჩამოტანილი ხეები, რომელთა ჩრდილშიც დღეს სეირნობთ, ფაქტობრივად, ორჯერ არის დარგული.
  tip: >-
    ბაღთან ერთად ორი საათი დაუთმეთ. ბილეთი დაახლოებით 15 ლარი ღირს; სამუშაო საათები სეზონის მიხედვით იცვლება
    და ორშაბათი ხშირად დასვენების დღეა, ამიტომ დღის დაგეგმვამდე გადაამოწმეთ. ინგლისური წარწერები მწირია
    — გიდის მომსახურება თავის ფასად ნამდვილად ღირს. ზოგ დარბაზში ფოტოგადაღება შეზღუდულია. მანქანა უფასოდ
    დატოვეთ სასახლის წინა მოედანზე ან მიმდებარე ქუჩებზე. ბაღის ჩრდილი ივლისის ნოტიო სიცხეში ნამდვილი შვებაა.
    კაფეები და ბანკომატები ცენტრში, რამდენიმე წუთის სავალზეა.
  route: >-
    თბილისიდან დაახლოებით 320 კმ და 4 საათი და 40 წუთია, თითქმის მთლიანად E60 მაგისტრალზე: გორის გვერდით,
    რიკოთის უღელტეხილზე, ქუთაისის შემოვლით, სამტრედიისა და სენაკის გავლით ზუგდიდამდე. ასფალტი ბოლომდე
    კარგია და ეკონომ-კლასის ავტომობილი ნებისმიერ სეზონზე სავსებით საკმარისია. საწვავი ქუთაისში, სამტრედიაში
    ან თავად ზუგდიდში ჩაასხით. სასახლე ქალაქის ცენტრშია, ქალაქში შემავალი მთავარი გზიდან ნიშნებით ადვილად
    მოიძებნება, მანქანის დასადგმელი კი ჭიშკართანვეა. თუ მეორე დღეს სვანეთისკენ მიდიხართ, ზუგდიდი ღამის
    გასათევად ბუნებრივი არჩევანია: ენგურის კაშხალი სულ რაღაც 30 კილომეტრშია.
en:
  name: Dadiani Palace, Zugdidi
  short: >-
    The palaces of the princes of Mingrelia in a garden first planted in 1840, with a bronze death mask
    of Napoleon and the robe venerated as the Virgin's.
  body: >-
    **In the middle of a Mingrelian market town, behind a Tudor-Gothic front, lies a bronze cast of Napoleon's
    face.** The mask was made in Paris in 1833 for the anatomist Francesco Antommarchi, whose name and
    the date are still legible on the bronze. It came to Zugdidi by marriage: Salome Dadiani wed Prince
    Achille Murat, grandson of Marshal Joachim Murat and Napoleon's sister Caroline, and Achille brought
    the family's French relics east with him.


    The Dadiani ruled Mingrelia from Zugdidi for centuries — in the 18th century the geographer Vakhushti
    described a palace here "of great building and many chambers", with a towered wall — but the complex
    you see is 19th-century. The architect Edwin Race remodelled the Queen's Palace, giving it an English
    Tudor face and a courtyard where Georgian and Ottoman work meet around a Laz-style balcony. In the
    1880s the Russian architect Leonid Vasiliev built a second palace for Prince Niko Dadiani, with the
    largest ballroom in Georgia. Ilia Chavchavadze and Akaki Tsereteli were guests under these arches.
    The palace has been a museum since 1921.


    Among some 50,000 objects, look for the robe venerated as the Virgin's, once kept at Khobi, and the
    12th-century icon of Queen Burdukhan, Tamar's mother, with 52 compartments for relics.


    Then go out into the garden. Prince David Dadiani laid it out in 1840 for his wife, Ekaterine; the
    gardener Joseph Babin came from Trieste, and seeds were ordered from Versailles. In 1856 Ottoman troops
    cut it down. "Zugdidi is no more," Ekaterine wrote in grief — and she planted it again. The trees
    from India, Japan, Italy and North America you walk beneath today were, in effect, planted twice.
  tip: >-
    Give it two hours with the garden. Tickets are around 15 lari; opening hours shift with the season
    and Monday is often a closed day, so check before you build a day around it. English labelling is
    thin, and a guided tour repays its fee. Photography is restricted in some halls. Park free on the
    square in front of the palace or in the nearby streets. The garden's shade is a mercy in humid July
    heat. Cafés and cash machines are a few minutes' walk away in the centre.
  route: >-
    About 320 km and 4 hours 40 minutes from Tbilisi, almost all on the E60 motorway: past Gori, over
    the Rikoti Pass, round Kutaisi, through Samtredia and Senaki to Zugdidi. The asphalt is good throughout
    and an economy car is all you need, in any season. Refuel in Kutaisi, Samtredia or Zugdidi itself.
    The palace is in the town centre, signposted from the main approach, with parking by the gates. If
    you are bound for Svaneti the next day, Zugdidi is the natural overnight stop: the Enguri dam is only
    30 km on.
ru:
  name: Дворец Дадиани в Зугдиди
  short: >-
    Дворцы мегрельских князей в саду, впервые заложенном в 1840 году: бронзовая посмертная маска Наполеона
    и риза, почитаемая как риза Богородицы.
  body: >-
    **Посреди мегрельского торгового городка, за тюдоровско-готическим фасадом, хранится бронзовый слепок
    лица Наполеона.** Маску отлили в Париже в 1833 году для анатома Франческо Антоммарки — его имя и дата
    до сих пор читаются на бронзе. В Зугдиди она попала благодаря браку: Саломе Дадиани вышла замуж за
    принца Ашиля Мюрата, внука маршала Иоахима Мюрата и сестры Наполеона Каролины, и Ашиль привёз фамильные
    французские реликвии с собой на восток.


    Дадиани веками правили Мегрелией из Зугдиди — в XVIII веке географ Вахушти описывал здесь дворец «большой
    постройки и со многими палатами», обнесённый стеной с башнями, — но комплекс, который вы видите, относится
    к XIX веку. Архитектор Эдвин Рейс перестроил Дворец царицы, придав ему английский тюдоровский облик
    и внутренний двор, где грузинские и османские мотивы сходятся вокруг балкона в лазском стиле. В 1880-х
    годах русский архитектор Леонид Васильев построил для князя Нико Дадиани второй дворец — с самым большим
    бальным залом в Грузии. Под этими арками бывали в гостях Илья Чавчавадзе и Акакий Церетели. С 1921
    года дворец — музей.


    Среди примерно 50 000 экспонатов найдите ризу, почитаемую как риза Богородицы, — когда-то она хранилась
    в Хоби, — и икону царицы Бурдухан, матери Тамар, XII века, с 52 ячейками для мощей.


    Потом выйдите в сад. Князь Давид Дадиани разбил его в 1840 году для своей жены Екатерины; садовника
    Жозефа Бабена пригласили из Триеста, а семена выписали из Версаля. В 1856 году османские войска вырубили
    сад. «Зугдиди больше нет», — писала в горе Екатерина, — и посадила его заново. Деревья из Индии, Японии,
    Италии и Северной Америки, под которыми вы гуляете сегодня, по сути, посажены дважды.
  tip: >-
    Вместе с садом отведите на визит два часа. Билет стоит около 15 лари; часы работы меняются по сезону,
    а понедельник часто выходной, так что уточните расписание, прежде чем строить вокруг музея весь день.
    Подписей на английском мало, и экскурсия с гидом стоит своих денег. В некоторых залах фотосъёмка ограничена.
    Бесплатно припарковаться можно на площади перед дворцом или на соседних улицах. Тень сада — спасение
    во влажную июльскую жару. Кафе и банкоматы — в нескольких минутах ходьбы, в центре.
  route: >-
    Около 320 км и 4 часа 40 минут от Тбилиси, почти всё — по автомагистрали E60: мимо Гори, через Рикотский
    перевал, в объезд Кутаиси, через Самтредиа и Сенаки до Зугдиди. Асфальт хороший на всём пути, и в
    любое время года хватит машины эконом-класса. Заправиться можно в Кутаиси, Самтредиа или в самом Зугдиди.
    Дворец в центре города, от главного въезда в город есть указатели, парковка у ворот. Если назавтра
    едете в Сванетию, Зугдиди — естественное место для ночёвки: до Ингурской плотины всего 30 км.
fa:
  name: کاخ دادیانی، زوگدیدی
  short: >-
    کاخ‌های شاهزادگان مگرلیا در باغی که نخستین بار در ۱۸۴۰ کاشته شد، با نقاب مرگ برنزی ناپلئون و ردایی
    که به نام ردای مریم مقدس گرامی‌اش می‌دارند.
  body: >-
    **در میانهٔ شهرکی بازاری در مگرلیا، پشت نمایی به سبک گوتیک تودوری، قالبی برنزی از چهرهٔ ناپلئون نگهداری
    می‌شود.** این نقاب در ۱۸۳۳ در پاریس برای کالبدشناس، فرانچسکو آنتومارکی، ریخته شد و نام او و تاریخ
    هنوز بر برنز خواندنی است. نقاب از راه ازدواج به زوگدیدی رسید: سالومه دادیانی همسر شاهزاده آشیل مورا
    شد، نوهٔ مارشال ژواکیم مورا و کارولین، خواهر ناپلئون، و آشیل یادگارهای فرانسوی خانواده را با خود به
    شرق آورد.


    دادیانی‌ها سده‌ها از زوگدیدی بر مگرلیا فرمان راندند — در سدهٔ هجدهم واخوشتیِ جغرافی‌دان از کاخی در
    اینجا «با بناهای بزرگ و تالارهای بسیار» و دیواری برج‌دار سخن گفت — اما مجموعه‌ای که امروز می‌بینید
    از سدهٔ نوزدهم است. معمار، ادوین ریس، کاخ ملکه را از نو آراست: به آن نمایی تودوری به شیوهٔ انگلیسی
    داد و حیاطی که در آن هنر گرجی و عثمانی گرد بالکنی به سبک لازی به هم می‌رسند. در دههٔ ۱۸۸۰ معمار روس،
    لئونید واسیلیف، کاخ دومی برای شاهزاده نیکو دادیانی ساخت با بزرگ‌ترین تالار رقص گرجستان. ایلیا چاوچاوادزه
    و آکاکی تسرتلی زیر این طاق‌ها مهمان بوده‌اند. کاخ از ۱۹۲۱ موزه است.


    در میان نزدیک به ۵۰ هزار شیء، ردایی را بجویید که به نام ردای مریم مقدس گرامی داشته می‌شود و روزگاری
    در صومعهٔ شهرِ خُبی نگهداری می‌شد، و نیز شمایل ملکه بوردوخان، مادر ملکه تامار، از سدهٔ دوازدهم، با
    ۵۲ خانه برای بقایای متبرک.


    سپس به باغ بروید. شاهزاده داویت دادیانی آن را در ۱۸۴۰ برای همسرش، اکاترینه، بنا نهاد؛ باغبان، ژوزف
    بابن، از تریست آمد و بذرها از ورسای سفارش داده شد. در ۱۸۵۶ سپاهیان عثمانی باغ را از بن بریدند. اکاترینه
    اندوهگین نوشت: «زوگدیدی دیگر نیست» — و باغ را دوباره کاشت. درختان هند، ژاپن، ایتالیا و آمریکای شمالی
    که امروز زیر سایه‌شان قدم می‌زنید، در واقع دو بار کاشته شده‌اند.
  tip: >-
    با باغ، دو ساعت وقت بگذارید. بلیت حدود ۱۵ لاری است؛ ساعت کار با فصل تغییر می‌کند و دوشنبه‌ها اغلب
    تعطیل است، پس پیش از آنکه برنامهٔ روزتان را بر آن بچینید، ساعت‌ها را بررسی کنید. توضیحات انگلیسی اندک
    است و تور با راهنما ارزش هزینه‌اش را دارد. عکاسی در برخی تالارها محدود است. در میدان روبه‌روی کاخ
    یا خیابان‌های نزدیک رایگان پارک کنید. سایهٔ باغ در گرمای شرجی ژوئیه نعمتی است. کافه‌ها و خودپردازها
    چند دقیقه پیاده‌روی دورتر، در مرکز شهرند.
  route: >-
    از تفلیس حدود ۳۲۰ کیلومتر و ۴ ساعت و ۴۰ دقیقه راه است و تقریباً همه‌اش در بزرگراه E60: از کنار گوری،
    از گردنهٔ ریکوتی، گرداگرد کوتائیسی و از سامتردیا و سناکی تا زوگدیدی. آسفالت در سراسر راه خوب است و
    در هر فصلی خودروی اکونومی کافی است. در کوتائیسی، سامتردیا یا خود زوگدیدی سوخت بزنید. کاخ در مرکز شهر
    است، از ورودی اصلی شهر تابلو دارد و کنار دروازه‌ها جای پارک هست. اگر فردای آن روز راهی سوانتی هستید،
    زوگدیدی جای طبیعی شب‌مانی است: سد انگوری تنها ۳۰ کیلومتر جلوتر است.
he:
  name: ארמון דדיאני, זוגדידי
  short: >-
    ארמונות נסיכי מגרליה בגן שניטע לראשונה ב-1840, ובהם מסכת מוות מברונזה של נפוליאון והגלימה הנערצת כגלימתה
    של מרים הבתולה.
  body: >-
    **בלב עיירת שוק מגרלית, מאחורי חזית בסגנון טיודור-גותי, שמורה יציקת ברונזה של פני נפוליאון.** המסכה
    נוצקה בפריז ב-1833 עבור האנטומיסט פרנצ'סקו אנטומרקי, ושמו והתאריך עדיין קריאים על הברונזה. היא הגיעה
    לזוגדידי בזכות נישואים: סלומה דדיאני נישאה לנסיך אשיל מירה, נכדם של המרשל יואכים מירה ושל קרולין,
    אחותו של נפוליאון, ואשיל הביא עמו מזרחה את המזכרות הצרפתיות של המשפחה.


    בית דדיאני שלט במגרליה מזוגדידי במשך מאות שנים – במאה ה-18 תיאר הגאוגרף ואחושטי ארמון שעמד כאן, "רב
    בניין ורב חדרים", ובו חומה עם מגדלים – אך המתחם שאתם רואים הוא מהמאה ה-19. האדריכל אדווין רייס עיצב
    מחדש את ארמון המלכה, העניק לו חזות טיודורית אנגלית וחצר פנימית שבה נפגשות אומנות גאורגית ועות'מאנית
    סביב מרפסת בסגנון לאזי. בשנות ה-80 של המאה ה-19 בנה האדריכל הרוסי לאוניד וסילייב ארמון שני עבור הנסיך
    ניקו דדיאני, ובו אולם הנשפים הגדול בגאורגיה. איליה צ'בצ'בדזה ואקאקי צרתלי התארחו תחת הקשתות האלה.
    מאז 1921 הארמון הוא מוזיאון.


    בין כ-50,000 הפריטים חפשו את הגלימה הנערצת כגלימתה של מרים הבתולה, שנשמרה בעבר במנזר שבעיר חובי, ואת
    האיקונה של המלכה בורדוחאן, אמה של המלכה תמר, מהמאה ה-12, ובו 52 תאים לשרידי קדושים.


    אחר כך צאו אל הגן. הנסיך דוד דדיאני הקים אותו ב-1840 למען אשתו, יקטרינה; הגנן ז'וזף באבן הגיע מטריאסטה,
    והזרעים הוזמנו מוורסאי. ב-1856 כרתו אותו כוחות עות'מאניים. "זוגדידי איננה עוד", כתבה יקטרינה באבלה
    – ונטעה אותו מחדש. העצים מהודו, מיפן, מאיטליה ומצפון אמריקה שבצלם אתם מטיילים היום ניטעו, למעשה, פעמיים.
  tip: >-
    הקדישו שעתיים, כולל הגן. כרטיס עולה כ-15 לארי; שעות הפתיחה משתנות לפי העונה, ויום שני הוא לעתים קרובות
    יום סגור, אז בדקו מראש לפני שאתם בונים סביבו יום שלם. השילוט באנגלית דל, וסיור מודרך מצדיק את מחירו.
    הצילום מוגבל בחלק מהאולמות. חנו בחינם בכיכר שמול הארמון או ברחובות הסמוכים. הצל של הגן הוא חסד בחום
    הלח של יולי. בתי קפה וכספומטים נמצאים כמה דקות הליכה משם, במרכז.
  route: >-
    כ-320 ק"מ ו-4 שעות ו-40 דקות מטביליסי, כמעט כולם בכביש המהיר E60: על פני גורי, דרך מעבר ריקוטי, סביב
    קוטאיסי, דרך סמטרדיה וסנאקי ועד זוגדידי. האספלט טוב לכל אורך הדרך, ורכב חסכוני הוא כל מה שצריך, בכל
    עונה. תדלקו בקוטאיסי, בסמטרדיה או בזוגדידי עצמה. הארמון נמצא במרכז העיר, מסומן בשלטים מדרך הכניסה
    הראשית לעיר, ויש חניה ליד השערים. אם אתם בדרך לסוואנטי למחרת, זוגדידי היא תחנת הלינה הטבעית: סכר אנגורי
    נמצא 30 ק"מ בלבד בהמשך.
ar:
  name: قصر دادياني، زوغديدي
  short: >-
    قصور أمراء ميغريليا في حديقة غُرست أول مرة عام 1840، وفيها قناع موت برونزي لنابليون والثوب المبجَّل
    بوصفه ثوب السيدة العذراء.
  body: >-
    **في قلب بلدة سوقية ميغريلية، خلف واجهة قوطية على طراز تيودور، يُحفظ قالب برونزي لوجه نابليون.** صُبّ
    القناع في باريس عام 1833 لعالم التشريح فرانشيسكو أنتوماركي، ولا يزال اسمه والتاريخ مقروءين على البرونز.
    وقد وصل إلى زوغديدي عن طريق الزواج: تزوجت سالومي دادياني الأمير أشيل مورات، حفيد المارشال يواكيم مورات
    وكارولين أخت نابليون، فحمل أشيل معه إلى الشرق مقتنيات العائلة الفرنسية الأثيرة.


    حكم آل دادياني ميغريليا من زوغديدي قرونًا — ففي القرن الثامن عشر وصف الجغرافي فاخوشتي قصرًا هنا «عظيم
    البنيان كثير الحجرات» يحيط به سور ذو أبراج — لكن المجمّع الذي تراه يعود إلى القرن التاسع عشر. أعاد
    المعماري إدوين ريس تشكيل قصر الملكة، فمنحه وجهًا إنجليزيًا على طراز تيودور، وفناءً داخليًا يلتقي فيه
    الفن الجورجي والعثماني حول شرفة على الطراز اللازي. وفي ثمانينيات القرن التاسع عشر شيّد المعماري الروسي
    ليونيد فاسيلييف قصرًا ثانيًا للأمير نيكو دادياني، فيه أكبر قاعة رقص في جورجيا. وقد نزل إيليا تشافتشافادزه
    وأكاكي تسيريتيلي ضيفين تحت هذه الأقواس. والقصر متحف منذ عام 1921.


    بين نحو 50,000 قطعة، ابحث عن الثوب المبجَّل بوصفه ثوب السيدة العذراء، الذي كان محفوظًا في خوبي، وعن
    أيقونة الملكة بوردوخان، والدة الملكة تامار، من القرن الثاني عشر، وفيها 52 تجويفًا للذخائر المقدسة.


    ثم اخرج إلى الحديقة. أنشأها الأمير دافيد دادياني عام 1840 لزوجته إيكاتيريني؛ وجاء البستاني جوزيف بابان
    من تريستي، وطُلبت البذور من فرساي. وفي عام 1856 قطعت القوات العثمانية أشجارها. كتبت إيكاتيريني مفجوعة:
    «لم تعد زوغديدي موجودة» — ثم غرستها من جديد. فالأشجار الآتية من الهند واليابان وإيطاليا وأمريكا الشمالية،
    التي تتمشى تحتها اليوم، غُرست في الواقع مرتين.
  tip: >-
    خصّص ساعتين مع الحديقة. التذكرة نحو 15 لاري؛ وتتغير ساعات العمل بحسب الموسم، وكثيرًا ما يكون الإثنين
    يوم إغلاق، فتحقّق قبل أن تبني يومك حوله. البطاقات التعريفية بالإنجليزية شحيحة، والجولة المصحوبة بمرشد
    تستحق أجرها. التصوير مقيّد في بعض القاعات. اركن مجانًا في الساحة أمام القصر أو في الشوارع المجاورة.
    ظلّ الحديقة رحمة في حرّ تموز/يوليو الرطب. المقاهي وأجهزة الصراف الآلي على بعد دقائق سيرًا في وسط المدينة.
  route: >-
    نحو 320 كم و4 ساعات و40 دقيقة من تبليسي، معظمها تقريبًا على الطريق السريع E60: مرورًا بغوري، وعبر
    ممر ريكوتي، وحول كوتايسي، ثم عبر سامتريديا وسيناكي حتى زوغديدي. الإسفلت جيد طوال الطريق، ولا تحتاج
    إلا إلى سيارة اقتصادية في أي فصل. تزوّد بالوقود في كوتايسي أو سامتريديا أو زوغديدي نفسها. يقع القصر
    في وسط المدينة، وتدلّ عليه اللافتات من مدخل المدينة الرئيسي، ويمكن الوقوف عند البوابات. وإن كنت متجهًا
    إلى سفانيتي في اليوم التالي، فزوغديدي محطة المبيت الطبيعية: سد إنغوري على بعد 30 كم فقط.
