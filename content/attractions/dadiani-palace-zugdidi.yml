ka:
  name: დადიანების სასახლე ზუგდიდში
  short: სამეგრელოს მთავრების რეზიდენცია ბოტანიკურ ბაღში — ნაპოლეონის სამარხი ნიღაბი და საოჯახო კოლექცია.
  body: >-
    დადიანების სასახლე ზუგდიდის ისტორიულ ცენტრში დგას და სამეგრელოს მთავრების, დადიანების, საგვარეულო
    რეზიდენცია იყო. კომპლექსი XIX საუკუნეშია აშენებული და მოიცავს რამდენიმე შენობას, სასახლის ეკლესიასა
    და ვრცელ ბოტანიკურ ბაღს, რომელიც დღემდე ქალაქის მთავარი პარკია.


    მუზეუმის ყველაზე ცნობილი ექსპონატი ნაპოლეონ ბონაპარტეს ერთ-ერთი სამარხი ნიღაბია — მსოფლიოში მხოლოდ
    რამდენიმე ასეთი ეგზემპლარი არსებობს. ის საქართველოში ოჯახური კავშირით მოხვდა: სალომე დადიანი ცოლად
    გაჰყვა აშილ მიურატს, ნაპოლეონის მარშლის, იოახიმ მიურატის შვილიშვილს, და ოჯახის ნაწილი კოლექციისა ზუგდიდში
    გადმოვიდა. სასახლის დარბაზებში ასევე დაცულია ქართული ჭედური ხელოვნება, ხატები, ხელნაწერები, ავეჯი
    და მთავრების პირადი ნივთები.


    რას ნახავთ:


    - **მთავარი სასახლე** ისტორიულ ინტერიერებთან მიახლოებული ექსპოზიციით

    - **ბოტანიკური ბაღი** ეგზოტიკური ხეებით, XIX საუკუნეში გაშენებული

    - **სასახლის ეკლესია** კომპლექსის ტერიტორიაზე


    ზუგდიდი უმეტესად სვანეთის გზაზე გამვლელი ქალაქია და ბევრი მას გვერდს უვლის. სასახლე კი სწორედ ის ადგილია,
    რომელიც აჩვენებს, რომ სამეგრელოს საკუთარი, სრულიად განსხვავებული სამთავრო ისტორია აქვს, ვიდრე მთიან
    სვანეთს ჩრდილოეთით. ბარის სამეგრელო XIX საუკუნეში ევროპულ პოლიტიკასა და დინასტიურ ქორწინებებში იყო
    ჩართული, სვანეთი კი იმავე დროს კოშკებით დაცულ თემურ წყობაში ცხოვრობდა. სასახლის ბაღი ცალკეც ღირს გასეირნებას
    — მოასფალტებული ბილიკები, ძველი ხეები და ჩრდილი ზაფხულის სიცხეში.
  tip: >-
    ვიზიტს საათნახევრიდან ორ საათამდე სჭირდება, ბაღის გასეირნების ჩათვლით. მუზეუმის განრიგი სეზონურად
    იცვლება და ორშაბათი ხშირად დასვენების დღეა — ჩამოსვლამდე დარეკეთ ან შეამოწმეთ. ინგლისურენოვანი ეტიკეტები
    ყველგან არაა, ამიტომ გიდი ან აუდიოგზამკვლევი ღირს. ფოტოგადაღება ზოგ დარბაზში შეზღუდულია. მანქანა სასახლის
    წინა მოედანზე ან მიმდებარე ქუჩაზე დატოვეთ — უფასოა. კაფეები და ბანკომატები ცენტრში, ორ წუთის სავალზეა.
  route: >-
    თბილისიდან ზუგდიდამდე დაახლოებით 320 კმ და ოთხნახევარ-ხუთი საათია. მარშრუტი მთლიანად E60-ზე გადის:
    გორი, ხაშური, რიკოთის ახალი მაგისტრალი, ქუთაისი, სამტრედია და შემდეგ ჩრდილო-დასავლეთით ზუგდიდისკენ.
    გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, ამიტომ ეკონომ კლასის ავტომობილი სავსებით საკმარისია.
    საწვავი ქუთაისში ან სამტრედიაში აავსეთ; ზუგდიდში არჩევანი ასევე ნორმალურია. სასახლე ქალაქის ცენტრშია
    და პირველივე მითითებით მოიძებნება.
en:
  name: Dadiani Palace, Zugdidi
  short: >-
    The residence of the princes of Mingrelia set in a botanical garden — Napoleon's death mask and the
    family collection.
  body: >-
    The Dadiani Palace stands in the historic centre of Zugdidi and was the seat of the Dadiani family,
    hereditary princes of Mingrelia. The complex was built in the nineteenth century and includes several
    buildings, a palace church and an extensive botanical garden that still serves as the town's main
    park.


    Its best-known exhibit is one of the small number of authentic death masks of Napoleon Bonaparte.
    It reached Georgia through marriage: Salome Dadiani married Achille Murat, grandson of Napoleon's
    marshal Joachim Murat, and part of the family collection came to Zugdidi with her. The palace rooms
    also hold Georgian chased metalwork, icons, manuscripts, furniture and the personal effects of the
    princely family.


    What you will see:


    - **The main palace**, with displays arranged close to the historic interiors

    - **The botanical garden**, laid out in the nineteenth century with exotic trees

    - **The palace church** within the grounds


    Zugdidi is mostly treated as a town you pass through on the way to Svaneti, and many travellers skip
    it entirely. The palace is the thing that makes stopping worthwhile: it shows that lowland Mingrelia
    had its own princely history, quite separate from the mountain world of Svaneti an hour and a half
    to the north.
  tip: >-
    Allow an hour and a half to two hours including a walk in the garden. Opening arrangements change
    with the season and Monday is often a closing day, so check before you build a day around it. English
    labelling is patchy, which makes a guide or audio guide worth the extra fee. Photography is restricted
    in some rooms. Park on the square in front of the palace or on the adjoining street, both free. Cafes
    and ATMs are a two-minute walk away in the town centre.
  route: >-
    Zugdidi is about 320 km and four and a half to five hours from Tbilisi. The route runs almost entirely
    on the E60: Gori, Khashuri, the new Rikoti section, Kutaisi, Samtredia, then north-west to Zugdidi.
    The road is paved and in good condition throughout, so an economy car is entirely sufficient. Fill
    up in Kutaisi or Samtredia; Zugdidi also has a reasonable choice of stations. The palace sits in the
    town centre and is signposted from the main approach, with parking directly in front of the gates.
ru:
  name: Дворец Дадиани в Зугдиди
  short: Резиденция владетельных князей Мегрелии в ботаническом саду — посмертная маска Наполеона и семейная
    коллекция.
  body: >-
    Дворец Дадиани стоит в историческом центре Зугдиди и был родовой резиденцией Дадиани, владетельных
    князей Мегрелии. Комплекс построен в XIX веке и включает несколько зданий, дворцовую церковь и обширный
    ботанический сад, который до сих пор служит главным парком города.


    Самый известный экспонат — одна из немногих подлинных посмертных масок Наполеона Бонапарта. В Грузию
    она попала через родство: Саломе Дадиани вышла замуж за Ашиля Мюрата, внука наполеоновского маршала
    Иоахима Мюрата, и часть семейной коллекции переехала в Зугдиди. В залах дворца хранятся также грузинская
    чеканка, иконы, рукописи, мебель и личные вещи княжеской семьи.


    Что вы увидите:


    - **Главный дворец** с экспозицией, приближенной к историческим интерьерам

    - **Ботанический сад** XIX века с экзотическими деревьями

    - **Дворцовую церковь** на территории комплекса


    Зугдиди обычно воспринимают как город, который проезжают по дороге в Сванетию, и многие путешественники
    его пропускают. Именно дворец делает остановку осмысленной: он показывает, что у равнинной Мегрелии
    была собственная княжеская история, совершенно отдельная от горного мира Сванетии в полутора часах
    к северу.
  tip: >-
    На осмотр закладывайте полтора-два часа вместе с прогулкой по саду. График работы меняется по сезонам,
    а понедельник часто выходной — уточните до приезда. Английские подписи есть не везде, поэтому гид
    или аудиогид оправдывают доплату. В части залов съёмка ограничена. Машину оставьте на площади перед
    дворцом или на соседней улице, стоянка бесплатная. Кафе и банкоматы находятся в двух минутах ходьбы
    в центре города.
  route: >-
    От Тбилиси до Зугдиди около 320 км и четыре с половиной — пять часов. Маршрут почти целиком идёт по
    трассе E60: Гори, Хашури, новый Рикотский участок, Кутаиси, Самтредиа, затем на северо-запад к Зугдиди.
    Дорога асфальтированная и в хорошем состоянии на всём протяжении, поэтому достаточно машины эконом-класса.
    Заправляйтесь в Кутаиси или Самтредиа, в самом Зугдиди выбор станций тоже нормальный. Дворец расположен
    в центре города, к нему есть указатели, парковка прямо у ворот.
fa:
  name: کاخ دادیانی، زوگدیدی
  short: اقامتگاه شاهزادگان سامگرلو در دل باغی گیاه‌شناسی — نقاب مرگ ناپلئون و مجموعهٔ خاندان.
  body: >-
    کاخ دادیانی در مرکز تاریخی زوگدیدی ایستاده است و مقر خاندان دادیانی، شاهزادگان موروثی سامگرلو، بود.
    مجموعه در سدهٔ نوزدهم ساخته شد و چند ساختمان، یک کلیسای درباری و باغ گیاه‌شناسی گسترده‌ای را در بر
    می‌گیرد که هنوز پارک اصلی شهر است.


    مشهورترین شیء آن یکی از معدود نقاب‌های مرگ اصیل ناپلئون بناپارت است. این شیء از راه یک ازدواج به گرجستان
    رسید: سالومه دادیانی با آشیل مورا، نوهٔ ژوآشن مورا مارشال ناپلئون، ازدواج کرد و بخشی از مجموعهٔ خانوادگی
    همراه او به زوگدیدی آمد. اتاق‌های کاخ فلزکاری قلم‌زنی‌شدهٔ گرجی، شمایل، دست‌نویس، مبلمان و اسباب شخصی
    خاندان شاهزادگان را هم نگه داشته‌اند، و در محوطه، جز ساختمان اصلی که چیدمانش به فضاهای تاریخی نزدیک
    مانده، باغ گیاه‌شناسی سدهٔ نوزدهم با درختان غیربومی و کلیسای کاخ قرار دارند.


    زوگدیدی را بیشتر شهری می‌دانند که در راه سوانتی از آن رد می‌شوند و بسیاری از مسافران کلاً از آن می‌گذرند.
    همین کاخ است که توقف را ارزشمند می‌کند: نشان می‌دهد سامگرلوی پست تاریخ شاهزادگی خودش را داشته است،
    جدا از جهان کوهستانی سوانتی که یک ساعت و نیم شمالی‌تر است.
  tip: >-
    با احتساب گشتی در باغ، یک ساعت و نیم تا دو ساعت در نظر بگیرید. ساعات کار با فصل عوض می‌شود و دوشنبه
    اغلب روز تعطیلی است، پس پیش از آنکه روزتان را حول آن ببندید بررسی کنید. برچسب‌های انگلیسی ناقص‌اند
    و همین راهنما یا راهنمای صوتی را به هزینهٔ اضافی می‌ارزاند. در بعضی اتاق‌ها عکاسی محدود است. خودرو
    را در میدان روبه‌روی کاخ یا خیابان کناری بگذارید؛ هر دو رایگان‌اند. کافه و خودپرداز دو دقیقه پیاده
    در مرکز شهر است.
  route: >-
    زوگدیدی حدود 320 کیلومتر و چهار ساعت و نیم تا پنج ساعت با تفلیس فاصله دارد. مسیر تقریباً تماماً روی
    E60 است: گوری، خاشوری، بخش تازهٔ ریکوتی، کوتایسی، سامتردیا و سپس شمال‌غرب به سوی زوگدیدی. جاده در
    تمام طول آسفالت و در وضعیت خوب است، بنابراین خودروی اقتصادی کاملاً کافی است. باک را در کوتایسی یا
    سامتردیا پر کنید؛ زوگدیدی هم انتخاب معقولی از پمپ‌بنزین دارد. کاخ در مرکز شهر است و از مسیر اصلی ورودی
    تابلو دارد، با پارکینگ درست روبه‌روی دروازه‌ها.
he:
  name: ארמון דדיאני, זוגדידי
  short: מעונם של נסיכי סמגרלו בתוך גן בוטני — מסכת המוות של נפוליאון ואוסף המשפחה.
  body: >-
    ארמון דדיאני עומד במרכזה ההיסטורי של זוגדידי והיה מושבה של משפחת דדיאני, נסיכיה התורשתיים של סמגרלו.
    המתחם נבנה במאה התשע עשרה וכולל כמה מבנים, כנסיית ארמון וגן בוטני נרחב שעד היום משמש כפארק המרכזי
    של העיר.


    המוצג הידוע ביותר שלו הוא אחת ממסכות המוות האותנטיות המעטות של נפוליאון בונפרטה. היא הגיעה לגאורגיה
    דרך נישואין: סלומה דדיאני נישאה לאשיל מורא, נכדו של המרשל של נפוליאון ז'ואשן מורא, וחלק מאוסף המשפחה
    הגיע איתה לזוגדידי. חדרי הארמון מחזיקים גם מלאכת מתכת גאורגית מרוקעת, איקונות, כתבי יד, רהיטים וחפציה
    האישיים של משפחת הנסיכים, ובשטח המתחם עומדים, לצד בניין הארמון הראשי שתצוגותיו סודרו קרוב לחללים ההיסטוריים
    המקוריים, גם הגן הבוטני שתוכנן במאה התשע עשרה ונטוע בעצים אקזוטיים, וכנסיית הארמון שבתוך החצר.


    זוגדידי נתפסת בעיקר כעיירה שחולפים דרכה בדרך לסוואנטי, ורבים מדלגים עליה לגמרי. הארמון הוא מה שהופך
    את העצירה לכדאית: הוא מראה שלסמגרלו השפלתית הייתה היסטוריה נסיכותית משלה, נפרדת לחלוטין מעולם ההרים
    של סוואנטי שעה וחצי צפונה משם.
  tip: >-
    הקצו שעה וחצי עד שעתיים כולל טיול בגן. שעות הפתיחה משתנות עם העונה ויום שני הוא לעיתים קרובות יום
    סגירה, אז בדקו לפני שאתם בונים סביבו יום שלם. השילוט באנגלית חלקי, ולכן מדריך או מדריך שמע שווים את
    התוספת. הצילום מוגבל בחלק מהחדרים. החנו בכיכר שלפני הארמון או ברחוב הסמוך, שניהם חינם. בתי קפה וכספומטים
    במרחק שתי דקות הליכה במרכז העיר.
  route: >-
    זוגדידי נמצאת כ-320 ק״מ וארבע וחצי עד חמש שעות מטביליסי. המסלול עובר כמעט כולו על E60: גורי, חשורי,
    קטע ריקוטי החדש, קוטאיסי, סמטרדיה, ומשם צפונה-מערבה לזוגדידי. הכביש סלול ובמצב טוב לכל אורכו, ולכן
    רכב חסכוני מספיק לחלוטין. תדלקו בקוטאיסי או בסמטרדיה; גם בזוגדידי יש בחירה סבירה של תחנות. הארמון
    יושב במרכז העיר ומשולט מכיוון הכניסה הראשית, עם חניה ממש מול השערים.
ar:
  name: قصر دادياني، زوغديدي
  short: مقر أمراء سامغريلو داخل حديقة نباتية — قناع نابليون الجنائزي ومجموعة العائلة.
  body: >-
    يقف قصر دادياني في المركز التاريخي لزوغديدي، وكان مقر أسرة دادياني، أمراء سامغريلو الوراثيين. شُيّد
    المجمع في القرن التاسع عشر ويضم عدة مبانٍ وكنيسة قصر وحديقة نباتية واسعة لا تزال المتنزه الرئيسي للبلدة.


    وأشهر معروضاته أحد الأقنعة الجنائزية الأصلية القليلة لنابليون بونابرت. وقد بلغ جورجيا عن طريق زواج:
    تزوجت سالومي دادياني من أشيل مورا، حفيد جواشان مورا مارشال نابليون، وانتقل جزء من مجموعة العائلة معها
    إلى زوغديدي. وتضم غرف القصر كذلك أشغالاً معدنية جورجية مطروقة وأيقونات ومخطوطات وأثاثاً ومقتنيات شخصية
    للأسرة الأميرية، وفي أرض المجمع يقوم إلى جانب المبنى الرئيسي، الذي رُتّبت معروضاته قريباً من الفراغات
    التاريخية، الحديقةُ النباتية من القرن التاسع عشر بأشجارها الغريبة وكنيسةُ القصر.


    ويُنظر إلى زوغديدي غالباً على أنها بلدة تمر بها في الطريق إلى سفانيتي، ويتخطاها كثير من المسافرين
    تماماً. والقصر هو ما يجعل التوقف مجدياً: فهو يُظهر أن سامغريلو المنخفضة كان لها تاريخها الأميري الخاص،
    منفصلاً تماماً عن عالم الجبال في سفانيتي على بعد ساعة ونصف شمالاً.
  tip: >-
    احسب ساعة ونصفاً إلى ساعتين مع نزهة في الحديقة. وتتبدل مواعيد الفتح بحسب الموسم، والاثنين يوم إغلاق
    في الغالب، فتحقق قبل أن تبني يومك حوله. والشروح بالإنجليزية متفاوتة، وهذا ما يجعل مرشداً أو دليلاً
    صوتياً يستحق الرسم الإضافي. والتصوير مقيَّد في بعض الغرف. اترك السيارة في الساحة أمام القصر أو في
    الشارع المجاور، وكلاهما مجاني. والمقاهي وأجهزة الصراف على بعد دقيقتين سيراً في وسط البلدة.
  route: >-
    تبعد زوغديدي نحو 320 كم وأربع ساعات ونصف إلى خمس ساعات عن تبليسي. ويسير المسار كله تقريباً على E60:
    غوري وخاشوري ومقطع ريكوتي الجديد وكوتايسي وسامتريديا، ثم شمالاً غرباً إلى زوغديدي. والطريق معبّد وبحالة
    جيدة على امتداده، فسيارة اقتصادية تكفي تماماً. املأ الخزان في كوتايسي أو سامتريديا؛ وفي زوغديدي أيضاً
    خيارات معقولة من المحطات. ويقع القصر في وسط البلدة وعليه لافتات من مدخلها الرئيسي، مع موقف أمام البوابات
    مباشرة.
