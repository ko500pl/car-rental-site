ka:
  name: ბორჯომის მხარეთმცოდნეობის მუზეუმი
  short: >-
    რომანოვების მამულის ყოფილი კანცელარია — ფსევდოგოთიკური შენობა, სადაც სასახლის ჭურჭელი, მინერალური
    წყლის ისტორია და ხეობის ბუნება ინახება.
  body: >-
    **სანამ ბორჯომი ბოთლის ეტიკეტად იქცეოდა, ის რომანოვების მამული იყო — ამ ფსევდოგოთიკურ შენობაში კი
    მამულის საქმეები იწარმოებოდა.**


    1871 წელს იმპერატორის ოჯახმა ბორჯომი დიდ მთავარ მიხეილ ნიკოლოზის ძეს, კავკასიის მეფისნაცვალს, უბოძა.
    XIX საუკუნის 90-იან წლებში მისმა ძემ, ნიკოლოზმა, ქალაქის დასავლეთ ბოლოში, ლიკანში, სასახლე ააგო და
    პარკი გააშენა. ამხელა მეურნეობას საკუთარი კანცელარია სჭირდებოდა — ის სწორედ აქ იყო, იმდროინდელი გემოვნებით,
    გოთიკის მიბაძვით აგებულ სახლში.


    1938 წელს დაარსებული მუზეუმი ბევრ რამეს მოიცავს: ბორჯომის ტყეების მცენარეებსა და ცხოველებს, რომლებსაც
    დღეს ეროვნული პარკი იცავს, ხეობის წარსულს და იმ მინერალური წყლის ამბავს, რომელმაც ქალაქს სახელი გაუთქვა.


    ყველაზე დიდხანს კი ყველაზე მოკრძალებული ნივთები გამახსოვრდებათ: რომანოვების სასახლიდან გადარჩენილი
    თეფშები, თიხის ჭურჭელი და ავეჯი — იმ ოჯახის ყოველდღიური ყოფის ნაშთები, რომლის კვალიც დღემდე აჩნია
    მთელ ხეობას.


    მუზეუმი პატარაა და ერთი საათი მისთვის სავსებით საკმარისია. გარეთ გამოსვლისას კი ზემოთ აიხედეთ: შუა
    საუკუნეების გოგიას ციხის ნანგრევები თითქმის პირდაპირ თავზე დაგყურებთ. ბორჯომის ორი ეპოქა — ციხე და
    კანცელარია — აქ ერთმანეთზეა დაშენებული.
  tip: >-
    შესვლა 5 ლარი ღირს; ინგლისურენოვანი გიდი დამატებით 30 ლარია და ღირს მისი აყვანა, თუ რომანოვების ამბის
    დაწვრილებით მოსმენა გსურთ. მუზეუმი აპრილიდან ოქტომბრამდე 10:00–18:00 საათებში მუშაობს, ნოემბრიდან
    მარტამდე — 10:00–17:00 საათებში. გამოცხადებულია, რომ მუზეუმი ახალ შენობაში გადავა, ამიტომ წასვლამდე
    მისამართი გადაამოწმეთ. წვიმიანი დღისთვის კარგი არჩევანია. გოგიას ციხისკენ მიმავალი ბილიკი დაახლოებით
    200 მეტრშია და ასვლას 10–20 წუთი სჭირდება; ცენტრალური პარკის შესასვლელიც ახლოსაა. კაფეები და ტუალეტები
    ქალაქის ცენტრშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია;
    იქ სამხრეთით, ს8-ზე გადაუხვიეთ და ბორჯომის ხეობით ბოლო 30 კილომეტრი გაიარეთ — სულ 160 კილომეტრი, დაახლოებით
    2 საათი და 20 წუთი, მთელ გზაზე კარგი ასფალტით. ეკონომკლასის ნებისმიერი მანქანა ნებისმიერ სეზონზე გამოდგება.
    საწვავი ხაშურამდე ბევრგანაა, ბორჯომშიც. მუზეუმი ქალაქის ახალ ნაწილში, ცენტრალური პარკის შესასვლელთან
    ახლოს დგას. მანქანა ცენტრში დატოვეთ და ფეხით გაიარეთ: ზაფხულის შაბათ-კვირას პარკირების ადგილები სწრაფად
    ივსება.
en:
  name: Borjomi Museum of Local Lore
  short: >-
    The Romanov estate's old chancellery, a pseudo-Gothic house that now keeps palace tableware, the mineral-water
    story and the valley's wildlife.
  body: >-
    **Before Borjomi became a label on a bottle, it was a Romanov estate, and this pseudo-Gothic house
    is where the estate kept its books.**


    In 1871 the imperial family granted Borjomi to Grand Duke Mikhail Nikolayevich, viceroy of the Caucasus.
    In the 1890s his son Nikolay built a chateau and laid out a park at Likani, at the western end of
    town. An estate on that scale needed a chancellery, and it was housed here, in a building dressed
    in the Gothic-revival taste of the day.


    Founded in 1938, the museum covers a lot of ground: the plants and animals of the forests around the
    town, now protected by the national park; the history of the valley; and the mineral water that made
    Borjomi's name.


    What stays with you, though, are the humblest things: plates, pottery and furniture salvaged from
    the Romanov palace, the everyday belongings of a family whose mark is still on the whole valley.


    This is a small museum, and an hour does it justice. When you step outside, look up. The medieval
    ruins of Gogia Fortress stand almost directly above you: Borjomi's two ages, a fortress and a filing
    office, stacked one on top of the other.
  tip: >-
    Entry is 5 GEL; an English-speaking guide costs another 30 GEL and is worth it if you want the Romanov
    story told properly. Hours are 10:00–18:00 from April to October and 10:00–17:00 from November to
    March. A move to a new building has been announced, so check the address before you go. It is a good
    choice for a rainy day. The path up to Gogia Fortress starts about 200 metres away and takes 10–20
    minutes, and the Central Park gates are a short walk off. Cafés and toilets are in the town centre.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori to Khashuri, about 130 km, then turn south onto the
    S8 for the last 30 km down the Borjomi gorge: 160 km in all, roughly 2 hours 20 minutes, on good asphalt
    the whole way. Any economy car will do, in any season. Fuel is easy to find up to Khashuri and in
    Borjomi itself. The museum stands in the newer part of town, close to the Central Park entrance. Park
    in the centre and walk, as spaces vanish on summer weekends.
ru:
  name: Боржомский краеведческий музей
  short: >-
    Бывшая канцелярия романовского имения — псевдоготический дом, где теперь хранятся дворцовая посуда,
    история минеральной воды и животный мир долины.
  body: >-
    **Прежде чем Боржоми стал этикеткой на бутылке, он был имением Романовых, и в этом псевдоготическом
    доме вели дела поместья.**


    В 1871 году императорская семья пожаловала Боржоми великому князю Михаилу Николаевичу, наместнику
    Кавказа. В 1890-х годах его сын Николай построил в Ликани, на западной окраине города, дворец и разбил
    парк. Хозяйству такого размаха нужна была канцелярия, и она разместилась здесь, в здании, одетом в
    модный тогда неоготический наряд.


    Музей, основанный в 1938 году, охватывает многое: растения и животных окрестных лесов, которые сегодня
    охраняет национальный парк; историю долины; и минеральную воду, прославившую Боржоми.


    Но в памяти остаются самые скромные вещи: тарелки, керамика и мебель, спасённые из романовского дворца,
    — повседневный обиход семьи, чей след до сих пор лежит на всей долине.


    Музей небольшой, и часа ему вполне достаточно. А выйдя на улицу, поднимите голову. Средневековые руины
    крепости Гогиа стоят почти прямо над вами: две эпохи Боржоми, крепость и контора, поставлены одна
    на другую.
  tip: >-
    Вход — 5 лари; англоязычный гид стоит ещё 30 лари и оправдывает себя, если хочется услышать историю
    Романовых как следует. Часы работы: с апреля по октябрь — 10:00–18:00, с ноября по март — 10:00–17:00.
    Объявлено о переезде музея в новое здание, так что перед визитом проверьте адрес. Хороший выбор на
    дождливый день. Тропа к крепости Гогиа начинается примерно в 200 метрах и занимает 10–20 минут, до
    ворот Центрального парка — короткая прогулка. Кафе и туалеты — в центре города.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад мимо Гори до Хашури, около 130 км, затем сверните на юг на
    S8 и последние 30 км спускайтесь Боржомским ущельем: всего 160 км, примерно 2 часа 20 минут, по хорошему
    асфальту на всём протяжении. Подойдёт любой автомобиль эконом-класса в любое время года. Заправиться
    легко до Хашури и в самом Боржоми. Музей стоит в новой части города, недалеко от входа в Центральный
    парк. Паркуйтесь в центре и идите пешком: в летние выходные свободные места исчезают.
fa:
  name: موزه‌ی تاریخ محلی بورجومی
  short: >-
    دیوان‌خانه‌ی قدیمی ملک رومانوف‌ها، خانه‌ای به سبک گوتیک‌نما که امروز ظروف کاخ، داستان آب معدنی و حیات‌وحش
    دره را نگه می‌دارد.
  body: >-
    **پیش از آن‌که بورجومی برچسبی روی بطری شود، ملکی از آنِ رومانوف‌ها بود، و این خانه‌ی گوتیک‌نما همان‌جایی
    است که حساب‌وکتاب ملک در آن نگه داشته می‌شد.**


    در ۱۸۷۱ خاندان امپراتوری بورجومی را به گراند دوک میخائیل نیکولایویچ، نایب‌السلطنه‌ی قفقاز، بخشید.
    در دهه‌ی ۱۸۹۰ پسرش نیکلای در لیکانی، در انتهای غربی شهر، کاخی ساخت و پارکی طرح انداخت. ملکی به این
    وسعت دیوان‌خانه‌ای لازم داشت، و این دیوان‌خانه همین‌جا بود، در ساختمانی که به سلیقه‌ی آن روزگار جامه‌ای
    گوتیک‌نما بر تن داشت.


    موزه که در ۱۹۳۸ بنیان گذاشته شد، گستره‌ی وسیعی را در بر می‌گیرد: گیاهان و جانوران جنگل‌های پیرامون
    شهر، که امروز پارک ملی از آن‌ها نگهبانی می‌کند؛ تاریخ دره؛ و آب معدنی‌ای که نام بورجومی را بلندآوازه
    کرد.


    اما آنچه در یاد می‌ماند فروتن‌ترین چیزهاست: بشقاب‌ها، سفالینه‌ها و مبلمانی که از کاخ رومانوف‌ها نجات
    یافته‌اند، اسباب روزمره‌ی خاندانی که ردّش هنوز بر سراسر دره پیداست.


    این موزه‌ای کوچک است و یک ساعت برای آن بس است. بیرون که آمدید، سر بلند کنید. ویرانه‌های قرون‌وسطایی
    دژ گوگیا تقریباً درست بالای سرتان ایستاده‌اند: دو دوران بورجومی، یک دژ و یک دیوان‌خانه، روی هم چیده
    شده‌اند.
  tip: >-
    بهای ورود ۵ لاری است؛ راهنمای انگلیسی‌زبان ۳۰ لاری دیگر هزینه دارد و اگر می‌خواهید داستان رومانوف‌ها
    را درست بشنوید، می‌ارزد. ساعت کار از آوریل تا اکتبر ۱۰:۰۰ تا ۱۸:۰۰ و از نوامبر تا مارس ۱۰:۰۰ تا ۱۷:۰۰
    است. انتقال موزه به ساختمانی تازه اعلام شده، پس پیش از رفتن نشانی را بررسی کنید. برای روزهای بارانی
    انتخاب خوبی است. کوره‌راه دژ گوگیا حدود ۲۰۰ متر آن‌سوتر آغاز می‌شود و ۱۰ تا ۲۰ دقیقه راه است، و دروازه‌های
    پارک مرکزی هم چند قدم بیشتر فاصله ندارند. کافه و سرویس بهداشتی در مرکز شهر است.
  route: >-
    از تفلیس جاده‌ی S1 (E60) را به سمت غرب بگیرید، از کنار گوری بگذرید و تا خاشوری، حدود ۱۳۰ کیلومتر،
    برانید؛ سپس به جنوب، به جاده‌ی S8 بپیچید و ۳۰ کیلومتر پایانی را در تنگه‌ی بورجومی پایین بروید: روی‌هم
    ۱۶۰ کیلومتر، حدود ۲ ساعت و ۲۰ دقیقه، سراسر روی آسفالت خوب. هر خودروی اکونومی در هر فصلی از پسش برمی‌آید.
    سوخت تا خاشوری و در خود بورجومی به‌آسانی پیدا می‌شود. موزه در بخش نوساز شهر، نزدیک ورودی پارک مرکزی
    است. در مرکز پارک کنید و پیاده بروید، چون آخر هفته‌های تابستان جای پارک ناپدید می‌شود.
he:
  name: המוזיאון לתולדות האזור של בורג'ומי
  short: >-
    לשכת המנהלה לשעבר של אחוזת בית רומנוב, בית בסגנון פסאודו-גותי, שומרת היום כלי אוכל מהארמון, את סיפור
    המים המינרליים ואת חיי הבר של העמק.
  body: >-
    **לפני שבורג'ומי הפכה לתווית על בקבוק, היא הייתה אחוזה של בית רומנוב, ובבית הפסאודו-גותי הזה ניהלה
    האחוזה את ענייניה.**


    ב-1871 העניקה משפחת הקיסר את בורג'ומי לדוכס הגדול מיכאיל ניקולאייביץ', המשנה למלך בקווקז. בשנות ה-90
    של המאה ה-19 בנה בנו ניקולאי ארמון ונטע פארק בליקאני, בקצה המערבי של העיר. אחוזה בקנה מידה כזה נזקקה
    ללשכת מנהלה, והיא שוכנה כאן, בבניין שהתלבש בטעם הגותי-המחודש של אותם ימים.


    המוזיאון, שנוסד ב-1938, מכסה הרבה: את הצמחים ובעלי החיים של היערות סביב העיר, שהיום מוגנים בפארק הלאומי;
    את תולדות העמק; ואת המים המינרליים שעשו לבורג'ומי שם.


    ובכל זאת, מה שנשאר איתכם הם הדברים הצנועים ביותר: צלחות, כלי חרס ורהיטים שניצלו מארמון בית רומנוב,
    חפצי היומיום של משפחה שחותמה עדיין טבוע בכל העמק.


    זה מוזיאון קטן, ושעה מספיקה לו בהחלט. כשתצאו, הרימו את הראש. חורבות מבצר גוגיה מימי הביניים עומדות
    כמעט ממש מעליכם: שני העידנים של בורג'ומי, מבצר ומשרד, מונחים זה על גבי זה.
  tip: >-
    הכניסה עולה 5 לארי; מדריך דובר אנגלית עולה עוד 30 לארי ושווה את זה, אם אתם רוצים לשמוע את סיפור בית
    רומנוב כמו שצריך. שעות הפתיחה: 10:00–18:00 מאפריל עד אוקטובר, ו-10:00–17:00 מנובמבר עד מרץ. הוכרז
    על מעבר לבניין חדש, לכן בדקו את הכתובת לפני שאתם יוצאים. בחירה טובה ליום גשום. השביל למבצר גוגיה מתחיל
    כ-200 מטר משם ואורך 10–20 דקות, ושערי הפארק המרכזי במרחק הליכה קצר. בתי קפה ושירותים יש במרכז העיר.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי עד חשורי, כ-130 ק"מ, ואז פנו דרומה לכביש S8 ל-30 הק"מ
    האחרונים, במורד ערוץ בורג'ומי: 160 ק"מ בסך הכול, כשעתיים ועשרים דקות, על אספלט טוב לכל אורך הדרך.
    כל רכב אקונומי יתאים, בכל עונה. קל למצוא דלק עד חשורי ובבורג'ומי עצמה. המוזיאון נמצא בחלק החדש של
    העיר, קרוב לכניסה לפארק המרכזי. החנו במרכז והמשיכו ברגל, כי בסופי שבוע בקיץ המקומות הפנויים נעלמים.
ar:
  name: متحف بورجومي للتاريخ المحلي
  short: >-
    ديوان ضيعة آل رومانوف القديم، بيتٌ على الطراز القوطي الزائف يحفظ اليوم أواني القصر وحكاية المياه المعدنية
    وحياة الوادي البرية.
  body: >-
    **قبل أن تصبح بورجومي ملصقًا على زجاجة، كانت ضيعةً لآل رومانوف، وفي هذا البيت القوطي الزائف كانت تُدار
    شؤونها.**


    في عام 1871 منحت الأسرة الإمبراطورية بورجومي للدوق الأكبر ميخائيل نيكولايفيتش، نائب الملك في القوقاز.
    وفي تسعينيات القرن التاسع عشر شيّد ابنه نيكولاي قصرًا وأنشأ حديقة في ليكاني، عند الطرف الغربي للمدينة.
    واحتاجت ضيعة بهذا الحجم إلى ديوان، فكان مقرّه هنا، في مبنى ارتدى زيّ الإحياء القوطي الذي كان رائجًا
    يومذاك.


    يغطّي المتحف، الذي تأسّس عام 1938، مساحة واسعة: نباتات الغابات المحيطة بالمدينة وحيواناتها، التي تحميها
    اليوم الحديقة الوطنية؛ وتاريخ الوادي؛ والمياه المعدنية التي صنعت شهرة بورجومي.


    غير أن ما يبقى في الذاكرة هو أبسط الأشياء: أطباق وخزفيات وأثاث أُنقذت من قصر آل رومانوف، متاع الحياة
    اليومية لأسرة لا يزال أثرها باديًا على الوادي كله.


    إنه متحف صغير، وساعة واحدة تفيه حقه. وحين تخرج، ارفع بصرك. أطلال قلعة غوغيا من القرون الوسطى تقوم
    فوقك مباشرةً تقريبًا: عصرا بورجومي، قلعةٌ ودار سجلّات، أحدهما فوق الآخر.
  tip: >-
    رسم الدخول 5 لاري؛ ويكلّف المرشد الناطق بالإنجليزية 30 لاري إضافية، وهو يستحقها إن أردت أن تُروى لك
    قصة آل رومانوف كما ينبغي. ساعات العمل من 10:00 إلى 18:00 بين أبريل وأكتوبر، ومن 10:00 إلى 17:00 بين
    نوفمبر ومارس. أُعلن عن انتقال المتحف إلى مبنى جديد، فتحقّق من العنوان قبل الذهاب. إنه خيار جيد ليوم
    ماطر. يبدأ الممشى إلى قلعة غوغيا على بُعد نحو 200 متر ويستغرق 10–20 دقيقة، وبوابات الحديقة المركزية
    على مسافة قصيرة سيرًا. المقاهي ودورات المياه في وسط المدينة.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) غربًا مرورًا بغوري حتى خاشوري، نحو 130 كم، ثم انعطف جنوبًا إلى الطريق
    S8 لآخر 30 كم نزولًا في مضيق بورجومي: 160 كم إجمالًا، نحو ساعتين و20 دقيقة، على أسفلت جيد طوال الطريق.
    أي سيارة اقتصادية تفي بالغرض في كل الفصول. الوقود متوفر بسهولة حتى خاشوري وفي بورجومي نفسها. يقع المتحف
    في الجزء الأحدث من المدينة، قرب مدخل الحديقة المركزية. أوقف سيارتك في الوسط وتابع سيرًا، فالأماكن
    الشاغرة تختفي في عطلات الصيف الأسبوعية.
