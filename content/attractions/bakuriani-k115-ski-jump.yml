ka:
  name: ბაკურიანის სათხილამურო ტრამპლინები
  short: >-
    ბაკურიანის საბჭოთა ტრამპლინები: 1971 წლის 115,5-მეტრიანი რეკორდი, უმოქმედოდ დარჩენილი დიდი ტრამპლინი
    და პატარა, სადაც ახალგაზრდები დღესაც ვარჯიშობენ.
  body: >-
    **1971 წლის იანვარში სერგეი ზონტოვი ბაკურიანის დიდი ტრამპლინიდან 115,5 მეტრზე გაფრინდა — მას შემდეგ
    აქ უფრო შორს არავის უხტია, მხოლოდ ერთმა გაუთანაბრა.**


    ბაკურიანი სათხილამურო ადგილად ტრამპლინებამდე დიდი ხნით ადრე იქცა: კურორტის პირველი სათხილამურო ბაზა
    1932 წელს გაიხსნა, 1930-იანი წლების შუა ხანებში კი აქ საქართველოს პირველი ტრამპლინი ააგეს — მოკრძალებული,
    40-მეტრიანი, ახალგაზრდა მოთხილამურე-მხტომელთა სავარჯიშოდ. 1969 წელს კომპლექსი ძირფესვიანად გადააკეთეს:
    ძველის ადგილას სამი ახალი ტრამპლინი აღიმართა, მათ შორის უდიდესი — „საქართველო“.


    1971 წლიდან 1980-იანი წლების დასაწყისამდე დიდ ტრამპლინზე საერთაშორისო შეჯიბრებები იმართებოდა. ზონტოვის
    1971 წლის 17 იანვრის რეკორდს 1983 წლის 16 იანვარს ფინელი ველი-მატი აჰონენი გაუთანაბრდა. 1972 და 1973
    წლებში აქ ქართველმა კობა ცაკაძემ გაიმარჯვა, რომელმაც მოგვიანებით ქართველ მხტომელთა ახალი თაობა აღზარდა.


    დღევანდელ სურათზე გულახდილები უნდა ვიყოთ. ორი დიდი ტრამპლინი დიდი ხანია არ მოქმედებს, 2019 წლისთვის
    კი კომპლექსი ნახევრად მიტოვებული იდგა — ფერდობზე აზიდული გასაქანები, რომლებზეც აღარავინ ეშვება. პატარა,
    55-მეტრიანი ტრამპლინი 2011 წელს კვლავ ამოქმედდა. მასზე ქართველი სპორტსმენები ვარჯიშობენ და ყოველწლიურად
    მიშკა მიქაბერიძის მემორიალი იმართება — ახალგაზრდა ქართველი მხტომელისა, რომელიც 1982 წელს, თექვსმეტი
    წლისა, კიროვში, ტრამპლინზე დაიღუპა.


    დიდი ტრამპლინის გასაქანს თვალით ზემოთ აუყევით: ეს ის რეკორდია, რომელსაც მთა ნახევარ საუკუნეზე მეტია
    ინახავს — უბრალოდ იმით, რომ ადგილიდან არ იძვრის.
  tip: >-
    შესვლა უფასოა და არც არაფერი იყიდება — უბრალოდ უყურებთ. დიდი კოშკები უმოქმედო და მიტოვებულია, ამიტომ
    გასაქანებზე, კიბეებსა და ბაქნებზე ნუ ახვალთ, რაოდენ მაცდურიც უნდა იყოს იქიდან ხედი. ერთი საათი, ძირში
    გასეირნების ჩათვლით, სავსებით საკმარისია. ზამთარში შეიძლება პატარა ტრამპლინზე მოვარჯიშე ახალგაზრდა
    მხტომელებსაც შეხვდეთ, მაგრამ განრიგს ნუ დაეყრდნობით. პარკინგი, საჭმელი და საპირფარეშო ბაკურიანის ცენტრშია.
    სრული დღისთვის ბოტანიკურ ბაღს ან დიდველისა და კოხტის ფერდობებს შეუთავსეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ხაშურის გასაყრელამდე დაახლოებით 120 კილომეტრი იარეთ, შემდეგ ს8 გზით
    სამხრეთისკენ, ბორჯომამდე. ბორჯომიდან ბაკურიანისკენ მთის გზას აუყევით — დაახლოებით 30 კილომეტრი ტყეში
    მიკლაკნილი აღმართია. სულ 186 კილომეტრი და დაახლოებით 2 საათი და 50 წუთი, მთელ გზაზე ასფალტია. ტრამპლინები
    კურორტის განაპირას, ფერდობზე დგას, გზიდან ფეხით ახლოს. ზაფხულში ნებისმიერი მანქანა გაივლის; ზამთარში
    ბორჯომი–ბაკურიანის აღმართი თოვლიანი და მოყინულია, ამიტომ ზამთრის საბურავებიანი ჯიპი ან კროსოვერი ყველაზე
    გონივრული არჩევანია. საწვავი ბორჯომშიც არის და ბაკურიანშიც.
en:
  name: Bakuriani Ski Jumping Complex
  short: >-
    Bakuriani's Soviet ski jumps: a 115.5 m hill record from 1971, a giant hill now out of use, and a
    small one where young Georgians still train.
  body: >-
    **In January 1971 Sergei Zontov flew 115.5 metres off Bakuriani's big hill, and no one has jumped
    farther here since — only one man has ever matched him.**


    Bakuriani was a skiing town long before the towers went up. The resort's first ski base opened in
    1932, and in the mid-1930s the first ski jump in Georgia, a modest 40-metre hill for training young
    jumpers, was built here. In 1969 the complex was rebuilt from scratch: three new hills replaced the
    old jump, the biggest of them known as 'Sakartvelo'.


    From 1971 into the early 1980s the big hill hosted international competitions. Zontov's record of
    17 January 1971 was equalled on 16 January 1983 by the Finn Veli-Matti Ahonen. The Georgian Koba Tsakadze
    won here in 1972 and 1973 and went on to train a new generation of Georgian jumpers.


    Today's picture needs honesty. The two big hills have long been out of use, and by 2019 the complex
    stood half-abandoned, its in-runs rising over the slope with nobody on them. The smaller 55-metre
    hill came back into use in 2011. Georgian athletes train there, and every year a memorial competition
    remembers Mishka Mikaberidze, a young Georgian jumper who died in 1982, aged sixteen, at a ski jump
    in Kirov.


    Follow the big hill's in-run upwards with your eye. It holds a record the mountain has kept for more
    than half a century, simply by standing still.
  tip: >-
    Free, and there is nothing to buy or book; you simply look. The big towers are disused and derelict,
    so keep off the in-runs, stairways and platforms however tempting the view. An hour is plenty, including
    a walk around the base. In winter you may catch young jumpers training on the small hill, but there
    is no timetable to rely on. Parking, food and toilets are in Bakuriani centre. For a full day, combine
    it with the botanical garden or the Didveli and Kokhta slopes.
  route: >-
    From Tbilisi take the S1 (E60) west to the Khashuri junction, about 120 km, then the S8 south to Borjomi.
    There turn up the mountain road to Bakuriani, some 30 km of climbing bends through the forest: 186
    km and about 2 h 50 min in all, asphalt throughout. The jumps stand on the slope at the edge of the
    resort, a short walk from the road. In summer any car copes; in winter the Borjomi–Bakuriani climb
    is snowy and icy, so an SUV or crossover on winter tyres is the sensible rental. Fuel is available
    in Borjomi and Bakuriani.
ru:
  name: Трамплинный комплекс Бакуриани
  short: >-
    Советские трамплины Бакуриани: рекорд трамплина — 115,5 м, установленный в 1971 году, заброшенный
    большой трамплин и малый, где тренируется молодёжь.
  body: >-
    **В январе 1971 года Сергей Зонтов пролетел с большого трамплина Бакуриани 115,5 метра, и с тех пор
    никто не прыгнул здесь дальше — лишь один человек повторил его результат.**


    Бакуриани был лыжным посёлком задолго до того, как здесь выросли башни трамплинов. Первая лыжная база
    курорта открылась в 1932 году, а в середине 1930-х здесь построили первый в Грузии трамплин — скромный,
    40-метровый, для тренировки юных прыгунов. В 1969 году комплекс перестроили с нуля: вместо старого
    трамплина появились три новых, и самый большой из них получил имя «Сакартвело».


    С 1971 года и до начала 1980-х на большом трамплине проходили международные соревнования. Рекорд Зонтова,
    установленный 17 января 1971 года, повторил 16 января 1983 года финн Вели-Матти Ахонен. Грузин Коба
    Цакадзе побеждал здесь в 1972 и 1973 годах, а затем воспитал новое поколение грузинских прыгунов.


    Нынешняя картина требует честности. Два больших трамплина давно не используются, и к 2019 году комплекс
    стоял полузаброшенным: разгоны тянутся вверх по склону, и на них ни души. Малый, 55-метровый трамплин
    вернули в строй в 2011 году. На нём тренируются грузинские спортсмены, и каждый год там проходят мемориальные
    соревнования памяти Мишки Микаберидзе — юного грузинского прыгуна, погибшего в 1982 году в шестнадцать
    лет на трамплине в Кирове.


    Проследите взглядом разгон большого трамплина снизу вверх: этот рекорд держится уже больше полувека
    — просто потому, что трамплин давно стоит без дела.
  tip: >-
    Бесплатно, и ничего не нужно покупать или бронировать — вы просто смотрите. Большие башни заброшены
    и обветшали, так что не поднимайтесь на разгоны, лестницы и площадки, как бы ни манил вид. Часа хватит
    с лихвой, включая прогулку вокруг подножия. Зимой можно застать юных прыгунов на тренировке на малом
    трамплине, но расписания, на которое можно положиться, нет. Парковка, еда и туалеты — в центре Бакуриани.
    На целый день объедините визит с ботаническим садом или склонами Дидвели и Кохта.
  route: >-
    Из Тбилиси по S1 (E60) на запад до развязки у Хашури, около 120 км, затем по S8 на юг до Боржоми.
    Там сворачивайте на горную дорогу в Бакуриани — около 30 км подъёма по серпантину через лес: всего
    186 км и около 2 ч 50 мин, асфальт на всём пути. Трамплины стоят на склоне у края курорта, в нескольких
    минутах ходьбы от дороги. Летом справится любая машина; зимой подъём Боржоми — Бакуриани заснежен
    и обледенел, так что разумнее арендовать внедорожник или кроссовер на зимней резине. Заправки есть
    в Боржоми и Бакуриани.
fa:
  name: مجموعهٔ پرش اسکی باکوریانی
  short: >-
    سکوهای پرش اسکی دوران شوروی در باکوریانی: رکورد ۱۱۵٫۵ متری از سال ۱۹۷۱، سکویی غول‌پیکرِ از کار افتاده،
    و سکویی کوچک که جوانان گرجی هنوز بر آن تمرین می‌کنند.
  body: >-
    **در ژانویهٔ ۱۹۷۱ سرگئی زونتوف از سکوی بزرگ باکوریانی ۱۱۵٫۵ متر پرواز کرد، و از آن پس هیچ‌کس اینجا
    دورتر از او نپریده است — تنها یک نفر توانسته رکوردش را تکرار کند.**


    باکوریانی مدت‌ها پیش از برپا شدن این برج‌ها شهرکی اسکی بود. نخستین پایگاه اسکی این تفرجگاه در سال
    ۱۹۳۲ گشایش یافت و در میانهٔ دههٔ ۱۹۳۰ نخستین سکوی پرش اسکی گرجستان — سکویی ساده و کوچک، ۴۰ متری، برای
    تمرین پرشگران جوان — اینجا ساخته شد. در سال ۱۹۶۹ مجموعه از نو ساخته شد: سه سکوی تازه جای سکوی قدیمی
    را گرفتند، و بزرگ‌ترینشان «ساکارتولو» نام گرفت.


    از سال ۱۹۷۱ تا اوایل دههٔ ۱۹۸۰ سکوی بزرگ میزبان مسابقات بین‌المللی بود. رکوردی را که زونتوف در ۱۷
    ژانویهٔ ۱۹۷۱ ثبت کرده بود، پرشگر فنلاندی، ولی-ماتی آهونن، در ۱۶ ژانویهٔ ۱۹۸۳ تکرار کرد. کوبا تساکادزهٔ
    گرجی در سال‌های ۱۹۷۲ و ۱۹۷۳ در اینجا پیروز شد و بعدها نسل تازه‌ای از پرشگران گرجی را پرورش داد.


    تصویر امروز صداقت می‌طلبد. دو سکوی بزرگ مدت‌هاست بلااستفاده مانده‌اند، و تا سال ۲۰۱۹ مجموعه نیمه‌متروک
    مانده بود و سرشیبی‌های شتاب‌گیری‌اش، خالی از هر پرشگری، بر دامنه قد کشیده بودند. سکوی کوچک‌تر ۵۵ متری
    در سال ۲۰۱۱ دوباره به کار افتاد. ورزشکاران گرجی بر آن تمرین می‌کنند و هر سال مسابقه‌ای یادبود به نام
    میشکا میکابریدزه برگزار می‌شود؛ پرشگر جوان گرجی‌ای که در سال ۱۹۸۲، در شانزده‌سالگی، روی سکوی پرشی
    در کیروف جان باخت.


    سرشیبی شتاب‌گیری سکوی بزرگ را با چشم تا بالا دنبال کنید. این سکو رکوردی را نگه داشته است که کوه بیش
    از نیم قرن است حفظش کرده — تنها با بی‌حرکت ایستادن.
  tip: >-
    رایگان است و چیزی برای خرید یا رزرو وجود ندارد؛ فقط تماشا می‌کنید. برج‌های بزرگ متروک و فرسوده‌اند،
    پس هر قدر هم منظره وسوسه‌انگیز باشد، از سرشیبی‌ها، پلکان‌ها و سکوها دوری کنید. یک ساعت کاملاً کافی
    است، همراه با قدم زدنی گرداگرد پای سکوها. در زمستان ممکن است پرشگران جوان را در حال تمرین روی سکوی
    کوچک ببینید، اما برنامهٔ زمانی قابل اتکایی در کار نیست. پارکینگ، غذا و دست‌شویی در مرکز باکوریانی
    است. برای یک روز کامل، این دیدار را با باغ گیاه‌شناسی یا پیست‌های دیدولی و کوختا همراه کنید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب تا تقاطع خاشوری، حدود ۱۲۰ کیلومتر، بروید، سپس با S8 به سمت جنوب
    تا بورجومی برانید. آنجا به جادهٔ کوهستانی باکوریانی بپیچید؛ حدود ۳۰ کیلومتر سربالایی پرپیچ‌وخم در
    میان جنگل: روی‌هم ۱۸۶ کیلومتر و حدود ۲ ساعت و ۵۰ دقیقه، سراسر آسفالت. سکوها بر دامنه‌ای در حاشیهٔ
    تفرجگاه قرار دارند و از جاده چند دقیقه پیاده‌راه است. در تابستان هر خودرویی از پسش برمی‌آید؛ در زمستان
    سربالایی بورجومی–باکوریانی برفی و یخ‌زده است، پس اجارهٔ شاسی‌بلند یا کراس‌اوور با لاستیک زمستانی انتخاب
    عاقلانه‌ای است. سوخت در بورجومی و باکوریانی در دسترس است.
he:
  name: מתחם קפיצות הסקי בבקוריאני
  short: >-
    מקפצות הסקי הסובייטיות של בקוריאני: שיא של 115.5 מטרים מ-1971, מקפצת ענק שיצאה משימוש, ומקפצה קטנה
    שבה צעירים גאורגים עדיין מתאמנים.
  body: >-
    **בינואר 1971 עף סרגיי זונטוב 115.5 מטרים מהמקפצה הגדולה של בקוריאני, ומאז איש לא קפץ כאן רחוק יותר
    — אדם אחד בלבד השווה את הישגו.**


    בקוריאני הייתה עיירת סקי הרבה לפני שהמגדלים הוקמו. בסיס הסקי הראשון של אתר הנופש נפתח ב-1932, ובאמצע
    שנות ה-30 נבנתה כאן מקפצת הסקי הראשונה בגאורגיה — מקפצה צנועה של 40 מטרים לאימון קופצים צעירים. ב-1969
    נבנה המתחם מחדש מן היסוד: שלוש מקפצות חדשות החליפו את הישנה, והגדולה שבהן זכתה לכינוי 'סקרטוולו'.


    מ-1971 ועד ראשית שנות ה-80 אירחה המקפצה הגדולה תחרויות בינלאומיות. את השיא של זונטוב מ-17 בינואר 1971
    השווה ב-16 בינואר 1983 הפיני ולי-מאטי אהונן. הגאורגי קובה צקדזה ניצח כאן ב-1972 וב-1973, ובהמשך אימן
    דור חדש של קופצים גאורגים.


    התמונה של היום מחייבת כנות. שתי המקפצות הגדולות יצאו משימוש מזמן, וכבר ב-2019 עמד המתחם נטוש למחצה,
    ומסלולי ההאצה שלו מתנשאים מעל המדרון ואיש אינו עליהם. המקפצה הקטנה, בת 55 המטרים, חזרה לשימוש ב-2011.
    ספורטאים גאורגים מתאמנים בה, ומדי שנה נערכת בה תחרות לזכרו של מישקה מיקברידזה, קופץ גאורגי צעיר שנהרג
    ב-1982, בגיל שש-עשרה, במקפצת סקי בעיר קירוב.


    עקבו במבטכם אחר מסלול ההאצה של המקפצה הגדולה כלפי מעלה. הוא שומר על שיא שההר מחזיק בו כבר יותר מחצי
    מאה, פשוט בכך שהוא עומד במקומו.
  tip: >-
    הכניסה חופשית, ואין מה לקנות או להזמין; פשוט מסתכלים. המגדלים הגדולים נטושים ומתפוררים, לכן אל תעלו
    על מסלולי ההאצה, על המדרגות ועל הפלטפורמות, מפתה ככל שיהיה הנוף. שעה מספיקה בהחלט, כולל הליכה סביב
    בסיס המקפצות. בחורף אפשר לפעמים לראות קופצים צעירים מתאמנים במקפצה הקטנה, אבל אין לוח זמנים שאפשר
    לסמוך עליו. חניה, אוכל ושירותים נמצאים במרכז בקוריאני. ליום שלם, שלבו את הביקור עם הגן הבוטני או עם
    מדרונות דידוולי וקוחטה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד צומת חשורי, כ-120 ק"מ, ומשם בכביש S8 דרומה עד בורג'ומי. שם פנו
    לכביש ההררי לבקוריאני — כ-30 ק"מ של עלייה בפיתולים דרך היער: 186 ק"מ וכ-2 שעות ו-50 דקות בסך הכול,
    אספלט לכל האורך. המקפצות ניצבות על המדרון בשולי אתר הנופש, במרחק הליכה קצר מהכביש. בקיץ כל רכב יסתדר;
    בחורף העלייה מבורג'ומי לבקוריאני מושלגת וקפואה, ולכן השכרה נבונה היא רכב שטח או קרוסאובר עם צמיגי
    חורף. דלק יש בבורג'ומי ובבקוריאני.
ar:
  name: مجمّع القفز التزلجي في باكورياني
  short: >-
    منصّات القفز السوفيتية في باكورياني: رقم قياسي قدره 115.5 متر منذ 1971، ومنصّة عملاقة خرجت من الخدمة،
    وأخرى صغيرة ما زال الشبّان الجورجيون يتدرّبون عليها.
  body: >-
    **في يناير/كانون الثاني 1971 طار سيرغي زونتوف 115.5 مترًا عن المنصّة الكبرى في باكورياني، ولم يقفز
    أحد هنا أبعد منه منذ ذلك الحين — ولم يعادله سوى رجل واحد.**


    كانت باكورياني بلدة تزلّج قبل أن تنتصب هذه الأبراج بزمن طويل. فقد افتُتحت أول قاعدة تزلّج في المنتجع
    عام 1932، وفي منتصف ثلاثينيات القرن العشرين بُنيت هنا أول منصّة للقفز التزلجي في جورجيا، وهي منصّة
    متواضعة بطول 40 مترًا لتدريب القافزين الناشئين. وفي عام 1969 أُعيد بناء المجمّع من الصفر: حلّت ثلاث
    منصّات جديدة محلّ المنصّة القديمة، وعُرفت كبراها باسم «ساكارتفيلو».


    ومن عام 1971 حتى مطلع الثمانينيات استضافت المنصّة الكبرى مسابقات دولية. وقد عادل الفنلندي فيلي-ماتي
    أهونن في 16 يناير/كانون الثاني 1983 الرقمَ الذي سجّله زونتوف في 17 يناير/كانون الثاني 1971. أما الجورجي
    كوبا تساكادزه ففاز هنا عامَي 1972 و1973، ثم درّب جيلًا جديدًا من القافزين الجورجيين.


    غير أن صورة اليوم تستدعي الصراحة. فالمنصّتان الكبيرتان متوقّفتان عن العمل منذ زمن بعيد، وبحلول عام
    2019 كان المجمّع شبه مهجور، تمتدّ منحدرات انطلاقه صاعدةً فوق السفح بلا أحد عليها. وقد عادت المنصّة
    الأصغر، بطول 55 مترًا، إلى الخدمة عام 2011. يتدرّب عليها رياضيون جورجيون، وتُقام فيها كل عام مسابقة
    تخليدًا لذكرى ميشكا ميكابيريدزه، القافز الجورجي الشاب الذي لقي حتفه عام 1982، في السادسة عشرة من عمره،
    على منصّة قفز في كيروف.


    تتبّع بعينك منحدر الانطلاق في المنصّة الكبرى صعودًا. إنه يحفظ رقمًا قياسيًا يحتفظ به الجبل منذ أكثر
    من نصف قرن، لا لشيء إلا لأنه ما زال واقفًا في مكانه.
  tip: >-
    الزيارة مجانية، ولا شيء يُشترى أو يُحجز؛ أنت تتفرّج فحسب. الأبراج الكبيرة مهجورة ومتداعية، فلا تصعد
    إلى منحدرات الانطلاق أو السلالم أو المنصّات مهما أغراك المنظر. تكفي ساعة واحدة وتزيد، بما فيها جولة
    سيرًا حول القاعدة. في الشتاء قد تصادف قافزين صغارًا يتدرّبون على المنصّة الصغيرة، لكن لا جدول مواعيد
    يُعتمد عليه. المواقف والطعام ودورات المياه في وسط باكورياني. ولقضاء يوم كامل، اجمع الزيارة مع الحديقة
    النباتية أو منحدرات ديدفيلي وكوختا.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا حتى تقاطع خاشوري، نحو 120 كم، ثم الطريق S8 جنوبًا حتى بورجومي.
    وهناك انعطف إلى الطريق الجبلي المؤدي إلى باكورياني، نحو 30 كم من المنعطفات الصاعدة عبر الغابة: 186
    كم ونحو ساعتين و50 دقيقة إجمالًا، والطريق معبّد بالأسفلت طوال المسافة. تقوم المنصّات على السفح عند
    طرف المنتجع، على بُعد خطوات من الطريق. في الصيف تفي أي سيارة بالغرض؛ أما في الشتاء فالصعود من بورجومي
    إلى باكورياني مغطّى بالثلج والجليد، فالخيار الحكيم استئجار سيارة دفع رباعي أو كروس أوفر بإطارات شتوية.
    الوقود متوفّر في بورجومي وباكورياني.
