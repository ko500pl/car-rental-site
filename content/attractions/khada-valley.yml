ka:
  name: ხადის ხეობა
  short: არაგვის გვერდითი ხეობა ქვეშეთთან, სამოცამდე შუასაუკუნეების კოშკით პატარა, თითქმის დაცლილ სოფლებში.
  body: >-
    **ხადა არაგვის გვერდითი ხეობაა, სადაც სამხედრო გზის ნებისმიერ სხვა ხეობაზე მეტი შუასაუკუნეების კოშკია**
    — და თითქმის არავინ უხვევს მათ სანახავად. ხეობის შესასვლელი ქვეშეთთანაა, გუდაურის ასასვლელის დაწყებამდე
    დაახლოებით ათი კილომეტრით ადრე; იქიდან უხეში გზა ხადისწყალს მიჰყვება სამხრეთ-დასავლეთით, ციცაბო ბალახიან
    ფერდობებს შორის, თითქმის ოცი კილომეტრის მანძილზე.


    მასზე გაბნეულია ათამდე პატარა სოფელი, ზოგში ორი-სამი ოჯახიღა დარჩა, და დაახლოებით სამოცი კოშკი და
    კოშკის ნაშთი. ესენი სვანური მაღალი და წვრილი კოშკები არ არის, არამედ დაბალი, კვადრატული, სამ-ოთხსართულიანი
    ნაგებობებია, უთლელი ფიქლისგან, ერთადერთი მაღალი შესასვლელით და პრაქტიკულად უსარკმლო. ზოგი მათგანი
    იმ სოფლებშია, რომლებზეც გაივლი — ცხერე და ყოროღო ჩვეულებრივ პირველი გაჩერებებია — სხვები კი მარტო
    დგანან კონცხებზე და ბილიკის მონაკვეთს დარაჯობენ.


    ამდენი გამაგრების მიზეზი მარშრუტია. სანამ რუსები 1810-1820-იან წლებში ჯვრის უღელტეხილზე თანამედროვე
    გზას გაჭრიდნენ, ხადის ხეობა ქედის გადასალახად ქსნისკენ ერთ-ერთი გზა იყო, და მასზე მოძრაობა უნდა გაკონტროლებულიყო
    და დაბეგრილიყო. კოშკები, დანგრეული სამლოცველოები და სამარხები სწორედ იმ ძველ ეკონომიკას ეკუთვნის,
    რომელიც მაშინვე დასრულდა, როცა მაგისტრალი გადაინაცვლა.


    ორი პრაქტიკული შენიშვნა აწმყოზე. ქვეშეთ-კობის საგზაო პროექტს, გრძელი გვირაბით სამხედრო გზის უმაღლესი
    მონაკვეთის შემოსავლელად, სამხრეთი ბოლო ხეობის შესასვლელთან აქვს — მისადგომზე მძიმე ტექნიკასა და სამშენებლო
    ტრანსპორტს ელოდე. ხეობის გზა კი პირველი სოფლების შემდეგ მოუასფალტებელია: ღარტაფებიანი, ქვიანი და ნაკადულებით
    გადაჭრილი, რომლებიც წვიმის შემდეგ იზრდება.


    ივნისის ბოლო და სექტემბერი კარგი თვეებია, როცა ბალახი მაღალია ან სინათლე დაბალი და კოშკები ფერდობებზე
    ჩრდილს აგდებენ.
  tip: >-
    სამი საათი გამოყავი, თუ ზემო სოფლებამდე მიდიხარ და ორ-სამ კოშკის ჯგუფს შორის ფეხით გადიხარ; მთელი
    დღე — თუ ხეობას ფეხით ივლი. მაღაზია, კაფე და საწვავი არ არის: წყალი და საჭმელი თან წაიღე. კოშკები
    შემოუღობავი ნანგრევებია კერძო მიწაზე — ასვლამდე იკითხე და ჩამონგრეულ პერეკრიტიებიან კოშკებში ნუ შეხვალ.
    ერთ-ორ სოფელში საოჯახო სასტუმროა, მაგრამ სეზონურად. ნოემბრიდან აპრილამდე თოვლი ზემო ხეობას კეტავს,
    ზაფხულშიც კი ძლიერი წვიმის შემდეგ ნაკადულის ფონი შეიძლება უკან დაგაბრუნოს.
  route: >-
    საქართველოს სამხედრო გზით (E117) ჩრდილოეთით ქვეშეთამდე მიდიხარ — თბილისიდან დაახლოებით 97 კმ და ორი
    საათი, ანანურისა და ფასანაურის გავლით. სწორედ იქამდე, სადაც გზა გუდაურისკენ სერიოზულ ასვლას იწყებს,
    მარცხნივ ნიშანდებული გასახვევი ხადის ხეობაში შედის. იქიდან პირველ საკოშკე სოფლებამდე დაახლოებით 8
    კმ მოუასფალტებელი გზაა, ხეობის თავამდე კი მნიშვნელოვნად მეტი. ასფალტი მალევე მთავრდება; საფარი ქვა
    და ღარტაფია, ფონებით. სწორი არჩევანი კარგკლირენსიანი ჯიპია; დაბალი სედანი ხეობის შესასვლელთან უნდა
    გაჩერდეს. ბოლო საწვავი ფასანაურშია.
en:
  name: Khada Valley
  short: >-
    A side gorge of the Aragvi near Kvesheti holding some sixty medieval towers among small, nearly emptied
    villages.
  body: >-
    **Khada is a side gorge of the Aragvi with more medieval towers in it than any other valley on the
    Military Highway,** and almost nobody turns off to see them. The mouth of the valley is at Kvesheti,
    about ten kilometres below the start of the Gudauri climb; from there a rough road follows the Khadistskali
    stream south-west between steep grass slopes for close to twenty kilometres.


    Scattered along it are a dozen small villages, several with only two or three families left, and around
    sixty towers and tower fragments. These are not the tall slender towers of Svaneti but squat square
    structures of three or four storeys, built of undressed shale, with a single high entrance and hardly
    any windows. Some stand in villages you drive through — Tskere and Korogo are the usual first stops
    — while others stand alone on spurs, watching a length of the path.


    The reason for so much fortification is the route. Before the Russians cut the modern road over the
    Jvari Pass in the 1810s and 1820s, the Khada valley was one of the ways over the ridge to the Ksani,
    and traffic through it had to be controlled and taxed. The towers, the ruined chapels and the graves
    belong to that older economy, which ended the moment the highway moved.


    Two practical notes about the present. The Kvesheti–Kobi road project, a long tunnel scheme meant
    to bypass the highest section of the Military Highway, has its southern end near the mouth of the
    valley, so expect heavy machinery and construction traffic on the approach. And the valley road is
    unsurfaced beyond the first villages: rutted, stony and crossed by streams that swell after rain.


    Late June and September are the good months, when the grass is high or the light is low and the towers
    throw shadows down the slopes.
  tip: >-
    Allow three hours if you drive to the upper villages and walk between two or three tower clusters,
    and a full day if you walk the valley. There is no shop, no café and no fuel, so carry water and food.
    The towers are unfenced ruins on private land: ask before climbing, and stay out of any with collapsed
    floors. One or two villages have guesthouses, but only in season. From November to April snow closes
    the upper valley, and even in summer a stream crossing after heavy rain can turn you back.
  route: >-
    Take the Georgian Military Highway (E117) north to Kvesheti, about 97 km and two hours from Tbilisi,
    passing Ananuri and Pasanauri. Just before the road begins its serious climb towards Gudauri, a signed
    turning leads left into the Khada valley. From there it is roughly 8 km of unsurfaced road to the
    first tower villages and considerably more to the head of the valley. The asphalt ends quickly; the
    surface is stone and rut, with fords. An SUV with decent clearance is the right car, and low saloons
    should stop at the valley mouth. The last fuel is in Pasanauri.
ru:
  name: Ущелье Хада
  short: >-
    Боковое ущелье Арагви у Квешети, где в маленьких почти опустевших сёлах стоит около шестидесяти средневековых
    башен.
  body: >-
    **Хада — боковое ущелье Арагви, где средневековых башен больше, чем в любой другой долине Военно-Грузинской
    дороги,** и почти никто не сворачивает на них посмотреть. Вход в ущелье — у Квешети, километрах в
    десяти ниже начала подъёма на Гудаури; оттуда разбитая дорога идёт вдоль речки Хадисцкали на юго-запад
    между крутыми травяными склонами почти двадцать километров.


    Вдоль неё разбросано около десятка маленьких сёл, в некоторых осталось по две-три семьи, и порядка
    шестидесяти башен и их остатков. Это не высокие тонкие сванские башни, а приземистые квадратные постройки
    в три-четыре этажа из необработанного сланца, с единственным высоко расположенным входом и почти без
    окон. Часть стоит в сёлах, через которые вы едете, — Цхере и Корого обычно первые остановки, — другие
    стоят особняком на отрогах и караулят отрезок тропы.


    Причина такого количества укреплений — сам маршрут. До того как русские в 1810-1820-х проложили современную
    дорогу через Крестовый перевал, ущелье Хада было одним из путей через хребет к Ксани, и движение по
    нему приходилось контролировать и облагать пошлиной. Башни, разрушенные часовни и могильники принадлежат
    той старой экономике, которая закончилась в тот момент, когда трасса сместилась.


    Два практических замечания о настоящем. У дорожного проекта Квешети–Коби, длинного тоннеля в обход
    самого высокого участка Военно-Грузинской дороги, южный конец находится у входа в ущелье, так что
    на подъезде вас ждут техника и строительный транспорт. А дорога вверх по ущелью за первыми сёлами
    не асфальтирована: колеи, камни и ручьи, вздувающиеся после дождя.


    Конец июня и сентябрь — удачные месяцы: трава высокая или свет низкий, и башни бросают тени вниз по
    склонам.
  tip: >-
    Три часа, если доехать до верхних сёл и пройти пешком между двумя-тремя группами башен; целый день,
    если идти по ущелью пешком. Ни магазина, ни кафе, ни заправки — берите воду и еду. Башни стоят без
    ограждения на частной земле: спрашивайте разрешения, прежде чем лезть, и не заходите в те, где обрушены
    перекрытия. В одном-двух сёлах есть гостевые дома, но только в сезон. С ноября по апрель снег закрывает
    верхнюю часть ущелья, а летом после сильного дождя брод через ручей может вас развернуть.
  route: >-
    По Военно-Грузинской дороге (E117) на север до Квешети — около 97 км и два часа от Тбилиси, мимо Ананури
    и Пасанаури. Прямо перед тем, как трасса начинает серьёзный подъём к Гудаури, налево уходит обозначенный
    поворот в ущелье Хада. Оттуда примерно 8 км грунтовки до первых башенных сёл и заметно больше до верховьев.
    Асфальт кончается быстро, дальше камень и колея с бродами. Правильная машина — внедорожник с приличным
    клиренсом; низкому седану лучше остановиться у входа в ущелье. Последняя заправка — в Пасанаури.
fa:
  name: درهٔ خادا
  short: دره‌ای فرعی از آراگوی نزدیک کوشتی، با نزدیک شصت برج سده‌های میانه در روستاهای کوچک و کمابیش خالی.
  body: >-
    **خادا دره‌ای فرعی از آراگوی است که برج‌های سده‌های میانهٔ آن از هر درهٔ دیگری در مسیر بزرگراه نظامی
    بیشتر است،** و تقریباً هیچ‌کس برای دیدنشان از جاده جدا نمی‌شود. دهانهٔ دره نزد کوشتی است، حدود ده
    کیلومتر پیش از آغاز سربالایی گودائوری؛ از آنجا جاده‌ای ناهموار رودخانهٔ خادیستسکالی را به سوی جنوب
    غرب و میان دامنه‌های تند علفی نزدیک بیست کیلومتر دنبال می‌کند.


    در طول آن ده‌ها روستای کوچک پراکنده است، در برخی تنها دو سه خانوار مانده، و نزدیک شصت برج و بازماندهٔ
    برج. اینها برج‌های بلند و باریک سوانتی نیستند، بلکه بناهایی کوتاه و چهارگوش در سه یا چهار طبقه‌اند،
    از سنگ لوح نتراشیده، با تنها یک ورودی بلند و تقریباً بی‌پنجره. برخی در روستاهایی است که از میانشان
    می‌گذرید — تسکره و کوروغو معمولاً نخستین توقف‌هاست — و برخی دیگر تنها بر زبانه‌های کوه ایستاده‌اند
    و بخشی از راه را می‌پایند.


    دلیل این همه استحکام، خود مسیر است. پیش از آنکه روس‌ها در دهه‌های 1810 و 1820 جادهٔ امروزی را از گردنهٔ
    جواری بگذرانند، درهٔ خادا یکی از راه‌های گذشتن از یال به سوی کسانی بود و رفت‌وآمد در آن باید کنترل
    و از آن باج گرفته می‌شد. برج‌ها و نیایشگاه‌های ویران و گورها به همان اقتصاد کهن تعلق دارند، اقتصادی
    که با جابه‌جا شدن شاهراه ناگهان پایان یافت.


    دو نکتهٔ عملی دربارهٔ امروز. پروژهٔ جادهٔ کوشتی-کوبی، طرح تونلی بلند برای دور زدن مرتفع‌ترین بخش بزرگراه
    نظامی، دهانهٔ جنوبی‌اش نزدیک ورودی دره است، پس انتظار ماشین‌آلات سنگین و ترافیک ساختمانی را در مسیر
    دسترسی داشته باشید. و جادهٔ درون دره پس از نخستین روستاها آسفالت نیست: پرچاله، سنگلاخ و بریده با جویبارهایی
    که پس از باران بالا می‌آیند.


    اواخر خرداد و شهریور ماه‌های خوبی است، وقتی علف بلند است یا نور کم‌ارتفاع، و برج‌ها سایه بر دامنه‌ها
    می‌اندازند.
  tip: >-
    سه ساعت وقت بگذارید اگر تا روستاهای بالادست برانید و میان دو سه گروه برج پیاده بروید، و یک روز کامل
    اگر دره را پیاده طی کنید. نه مغازه‌ای هست، نه کافه‌ای و نه سوختی؛ آب و خوراک همراه ببرید. برج‌ها ویرانه‌هایی
    بی‌حصار بر زمین خصوصی‌اند: پیش از بالا رفتن اجازه بگیرید و به آنهایی که کف‌شان فرو ریخته وارد نشوید.
    یکی دو روستا خانهٔ مهمان دارد، اما تنها در فصل. از آبان تا فروردین برف بالای دره را می‌بندد، و حتی
    در تابستان گذشتن از جویباری پس از باران سنگین ممکن است شما را برگرداند.
  route: >-
    بزرگراه نظامی گرجستان (E117) را به شمال تا کوشتی بروید، حدود 97 کیلومتر و دو ساعت از تفلیس، از کنار
    آنانوری و پاسانائوری. درست پیش از آنکه جاده سربالایی جدی به سوی گودائوری را آغاز کند، انشعابی تابلودار
    به چپ و به درون درهٔ خادا می‌رود. از آنجا حدود 8 کیلومتر جادهٔ خاکی تا نخستین روستاهای برج‌دار است
    و بسیار بیشتر تا سرِ دره. آسفالت زود تمام می‌شود؛ روکش سنگ و چاله است با گدارهای آب. خودروی درست،
    شاسی‌بلندی با ارتفاع مناسب است و سواری‌های کوتاه باید در دهانهٔ دره بایستند. آخرین سوخت در پاسانائوری
    است.
he:
  name: עמק חאדה
  short: ערוץ צדדי של האראגווי ליד קווששתי ובו כשישים מגדלי מגן מימי הביניים בכפרים קטנים וכמעט ריקים.
  body: >-
    **חאדה הוא ערוץ צדדי של האראגווי שיש בו יותר מגדלים מימי הביניים מכל עמק אחר לאורך כביש הצבא,** וכמעט
    איש אינו פונה לראותם. פתח העמק נמצא בקווששתי, כעשרה קילומטרים לפני תחילת העלייה לגודאורי; משם דרך
    גסה עוקבת אחרי נחל חאדיסצקאלי דרומה-מערבה בין מדרונות עשב תלולים לאורך כמעט עשרים קילומטרים.


    לאורכה פזורים כתריסר כפרים קטנים, בכמה מהם נותרו שתיים-שלוש משפחות בלבד, וכשישים מגדלים ושברי מגדלים.
    אלה אינם המגדלים הגבוהים והדקים של סוואנטי אלא מבנים נמוכים ומרובעים בני שלוש או ארבע קומות, מאבן
    צפחה לא מסותתת, עם פתח כניסה גבוה יחיד וכמעט בלי חלונות. אחדים עומדים בכפרים שדרכם נוסעים — צקרה וקורוגו
    הן בדרך כלל העצירות הראשונות — ואחרים עומדים לבדם על שלוחות ומשקיפים על קטע מן השביל.


    הסיבה לכל כך הרבה ביצורים היא הדרך. לפני שהרוסים סללו בשנות ה-10 וה-20 של המאה ה-19 את הכביש המודרני
    מעל מעבר ג׳ווארי, היה עמק חאדה אחד המסלולים מעבר לרכס אל הקסאני, ואת התנועה בו היה צריך לפקח ולמסות.
    המגדלים, הקפלות ההרוסות והקברים שייכים לאותה כלכלה ישנה, שנסתיימה ברגע שהכביש הראשי זז.


    שתי הערות מעשיות על ההווה. לפרויקט הכביש קווששתי-קובי, מנהרה ארוכה שנועדה לעקוף את הקטע הגבוה ביותר
    של כביש הצבא, יש קצה דרומי סמוך לפתח העמק, ולכן צפו לציוד כבד ולתנועת עבודות בגישה. ודרך העמק אינה
    סלולה מעבר לכפרים הראשונים: מחורצת, אבנית וחצויה בנחלים שגואים אחרי גשם.


    סוף יוני וספטמבר הם החודשים הטובים, כשהעשב גבוה או האור נמוך והמגדלים מטילים צללים במורד המדרונות.
  tip: >-
    הקצו שלוש שעות אם תיסעו עד הכפרים העליונים ותלכו בין שניים-שלושה מקבצי מגדלים, ויום שלם אם תלכו את
    העמק ברגל. אין חנות, אין בית קפה ואין דלק — קחו מים ואוכל. המגדלים הם חורבות לא מגודרות על אדמה פרטית:
    שאלו לפני שאתם מטפסים, והימנעו מאלה שרצפותיהם קרסו. בכפר או שניים יש בתי הארחה, אך רק בעונה. מנובמבר
    עד אפריל שלג סוגר את העמק העליון, וגם בקיץ מעבר נחל אחרי גשם כבד עלול להחזיר אתכם.
  route: >-
    סעו צפונה בכביש הצבא הגאורגי (E117) עד קווששתי, כ-97 ק״מ ושעתיים מטביליסי, על פני אנאנורי ופסנאורי.
    ממש לפני שהכביש מתחיל את הטיפוס הרציני לגודאורי, פנייה משולטת שמאלה נכנסת אל עמק חאדה. משם כ-8 ק״מ
    של דרך לא סלולה עד כפרי המגדלים הראשונים והרבה יותר עד ראש העמק. האספלט נגמר מהר; המשטח אבן וחריצים,
    עם מעברי מים. הרכב הנכון הוא רכב שטח עם מרווח גחון סביר, ומכוניות נמוכות מוטב שיעצרו בפתח העמק. תחנת
    הדלק האחרונה היא בפסנאורי.
ar:
  name: وادي خادا
  short: وادٍ جانبي لأراغفي قرب كفيشيتي، فيه نحو ستين برجاً من العصور الوسطى بين قرى صغيرة تكاد تكون خاوية.
  body: >-
    **خادا وادٍ جانبي لأراغفي تكثر فيه أبراج العصور الوسطى أكثر من أي وادٍ آخر على الطريق العسكري،** ولا
    يكاد أحد ينعطف لرؤيتها. مدخل الوادي عند كفيشيتي، على بعد نحو عشرة كيلومترات قبل بداية صعود غودااوري؛
    ومن هناك يتبع طريق وعر مجرى خاديستسكالي جنوباً غرباً بين منحدرات عشبية شديدة قرابة عشرين كيلومتراً.


    تتناثر على طوله نحو اثنتي عشرة قرية صغيرة، لم يبق في بعضها غير أسرتين أو ثلاث، وقرابة ستين برجاً وبقايا
    أبراج. وليست هذه أبراج سفانيتي الرفيعة العالية، بل مبانٍ منخفضة مربعة من ثلاث أو أربع طبقات، من حجر
    صفائحي غير منحوت، بمدخل واحد مرتفع وبلا نوافذ تُذكر. بعضها في قرى تمر بها — تسكيري وكوروغو عادة أول
    محطتين — وبعضها قائم وحده على نتوءات يراقب مقطعاً من الدرب.


    وسبب هذا الكم من التحصين هو الطريق نفسه. فقبل أن يشق الروس في عشرينيات القرن التاسع عشر الطريق الحديث
    فوق ممر جواري، كان وادي خادا أحد المسالك عبر السلسلة نحو كساني، وكان لا بد من ضبط المرور فيه وفرض
    المكوس عليه. والأبراج والمصليات الخربة والقبور تنتمي إلى ذلك الاقتصاد القديم الذي انتهى ساعة انتقل
    الطريق الرئيسي.


    وملاحظتان عمليتان عن الحاضر. مشروع طريق كفيشيتي-كوبي، وهو نفق طويل يهدف إلى تجاوز أعلى مقاطع الطريق
    العسكري، طرفه الجنوبي قريب من مدخل الوادي، فتوقع آليات ثقيلة وحركة إنشاءات على مسار الوصول. وطريق
    الوادي غير معبّد بعد القرى الأولى: محفّر وحجري وتقطعه جداول تنتفخ بعد المطر.


    أواخر حزيران وأيلول شهران جيدان، حين يعلو العشب أو ينخفض الضوء وترمي الأبراج ظلالها على المنحدرات.
  tip: >-
    خصص ثلاث ساعات إن قدت إلى القرى العليا ومشيت بين مجموعتين أو ثلاث من الأبراج، ويوماً كاملاً إن مشيت
    الوادي. لا متجر ولا مقهى ولا وقود؛ فاحمل ماءً وطعاماً. والأبراج أطلال بلا أسوار على أرض خاصة: استأذن
    قبل الصعود، وابتعد عن تلك التي انهارت أرضياتها. في قرية أو قريتين بيوت ضيافة، لكن في الموسم فقط. ومن
    تشرين الثاني إلى نيسان يغلق الثلج أعلى الوادي، وحتى في الصيف قد يعيدك مخاضة جدول بعد مطر غزير.
  route: >-
    اسلك الطريق العسكري الجورجي (E117) شمالاً حتى كفيشيتي، نحو 97 كم وساعتين من تبليسي، مروراً بأنانوري
    وباسانائوري. وقبيل أن يبدأ الطريق صعوده الجاد نحو غودااوري، يقودك منعطف عليه لافتة إلى اليسار داخل
    وادي خادا. ومن هناك نحو 8 كم من طريق غير معبّد حتى أولى قرى الأبراج، وأكثر من ذلك بكثير حتى رأس الوادي.
    ينتهي الإسفلت سريعاً؛ والسطح حجر وأخاديد مع مخاضات. السيارة الصحيحة دفع رباعي بخلوص أرضي معقول، وعلى
    السيارات المنخفضة أن تقف عند مدخل الوادي. وآخر وقود في باسانائوري.
