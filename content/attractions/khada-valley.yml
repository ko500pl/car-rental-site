ka:
  name: ხადის ხეობა
  short: >-
    გვერდითი ხეობა ქვეშეთის ზემოთ, რომელსაც ძველი ლექსი სამოც ციხეს მიაწერს, და ათასი წლის ეკლესია თავისი
    მშენებლების გამოსახულებით.
  body: >-
    **„ხადაში გამიგონია სამოცი ციხე მაგარი“, — ამბობს ძველი ხალხური ლექსი, და XVIII საუკუნის გეოგრაფი
    ვახუშტი ბაგრატიონიც ეთანხმება: ადგილი „კლდოვანი და 60 კოშკოვანი“.**


    ხადა თეთრი არაგვის გვერდითი ხეობაა, რომელიც ქვეშეთთან, გუდაურის გრძელი აღმართის ძირას იწყება და ჩრდილო-დასავლეთით,
    მთებში შედის. ცხავატთან ერთად იგი ეთნოგრაფიულ მთიულეთს ქმნიდა; თავად სახელი, ადგილობრივთა განმარტებით,
    მთას, მთიან ადგილს ნიშნავს. ხეობა ნეოლითის ხანიდან არის დასახლებული. შუა საუკუნეებში ხადა უმთავრესად
    არაგვის საერისთავოს ეკუთვნოდა; XIII საუკუნის დასაწყისში ხადელები თამარ მეფის მხარეს აჯანყებულ დიდოელებსა
    და ფხოველებს ებრძოდნენ, იმავე საუკუნის ბოლოს კი ხეობაში მონღოლთა სადამსჯელო ლაშქარი ამოვიდა. 1804
    წელს, მთიულეთის აჯანყებისას, მთავრობის ჯართან პირველი შეტაკება სწორედ აქ, სოფელ კაიშაურნთან მოხდა.


    შემორჩენილი კოშკები დაბალი, მძიმე ქვის ნაგებობებია და არა სვანური წვრილი კოშკები. ხეობაში ასვლის მთავარი
    მიზეზი კი ქოროღოს ღვთისმშობლის ეკლესიაა — X საუკუნის ბოლოს ან XI-ის დასაწყისის პატარა დარბაზი, ადგილობრივი
    ფილაქვითა და ფიქლით ნაგები. დასავლეთ ფასადის ზღუდარი ქვაზე ამოკვეთილი მოთხრობაა თავად ამ ეკლესიის
    შენებაზე: ოსტატები ქვას ტეხენ, ეზიდებიან, თლიან, მერე კი სადილად სხდებიან — და ყველა სცენა ფრონტონზე
    ამოკვეთილი ღვთისმშობლის — „ნიშისას“ — გამოსახულებისკენ იყრის თავს. ჩრდილოეთ შესასვლელთან მეორადად
    ჩასმულ ქვაზე სამი ქტიტორია, ერთს ეკლესიის გეგმა უჭირავს. გვერდით სამსართულიანი კოშკი დგას, ეკლესიის
    XI საუკუნის სპილოს ძვლის ღვთისმშობლის ხატი კი ახლა თბილისში, საქართველოს ეროვნულ მუზეუმშია.


    ხეობის შესასვლელთან მშენებარე ქვეშეთ-კობის გზა იწყება, რომელიც სამხედრო გზის ყველაზე მაღალ მონაკვეთს
    უნდა აუაროს გვერდი. ზემოთ, ქოროღოში კი ზღუდარზე გამოსახული ოსტატები ათასი წელია სადილობენ და საქმეს
    არ უბრუნდებიან.
  tip: >-
    სამი საათი გამოყავით ასვლისთვის, ქოროღოსა და ერთ-ორ კოშკამდე გასასეირნებლად; მთელი დღე — თუ ხეობის
    ფეხით შემოვლა გინდათ. მაღაზია, კაფე და საწვავი აქ არ არის: წყალი და საჭმელი თან წაიღეთ. ეკლესია სოფლის
    ზემოთ, ციცაბო ფერდობზე დგას — კარგი ფეხსაცმელი ჩაიცვით, შიგნით კი მხრები და მუხლები დაიფარეთ. კოშკები
    შემოუღობავი ნანგრევებია კერძო მიწაზე: ასვლამდე ნებართვა ითხოვეთ და იმ კოშკებში, რომლებსაც სართულები
    ჩანგრეული აქვთ, ნუ შეხვალთ. ნოემბრიდან აპრილამდე ზემო ხეობას თოვლი კეტავს, ზაფხულშიც კი ძლიერი წვიმის
    შემდეგ ადიდებულმა ფონმა შეიძლება უკან გაგაბრუნოთ.
  route: >-
    ს1-ით მცხეთისკენ გადით, შემდეგ საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთით, ანანურისა და ფასანაურის
    გავლით, ქვეშეთამდე იარეთ — დაახლოებით 102 კმ და ორი საათი. ქვეშეთში, სანამ გზა გუდაურისკენ სერიოზულ
    აღმართს დაიწყებს, მარცხნივ, ხადის ხეობაში შეუხვიეთ. ქოროღომდე ვიწრო გვერდითი გზით კიდევ დაახლოებით
    7 კმ-ია; ასფალტი მალე მთავრდება და ქვიანი, ღრმულებიანი საფარი იწყება, ფონებით, რომლებიც წვიმის შემდეგ
    დიდდება. სულ დაახლოებით 108 კმ და 2 სთ 20 წთ. სწორი არჩევანი მაღალი კლირენსის ჯიპია; დაბალი სედანი
    ხეობის შესასვლელთან დატოვეთ. გასახვევთან ქვეშეთ-კობის გზის სამშენებლო ტექნიკა შეგხვდებათ. ბოლო ბენზინგასამართი
    სადგური ფასანაურშია.
en:
  name: Khada Valley
  short: >-
    A side valley above Kvesheti that an old verse credits with sixty towers, and a thousand-year-old
    church carved with the men who built it.
  body: >-
    **"In Khada, I have heard, stand sixty mighty towers," runs an old mountain verse, and the 18th-century
    geographer Prince Vakhushti Bagrationi agreed, calling the place rocky and "of sixty towers".**


    Khada is a side valley of the White Aragvi that opens at Kvesheti, below the climb to Gudauri, and
    runs north-west into the mountains. With neighbouring Tskhavati it made up ethnographic Mtiuleti,
    and locals say the name means "mountain". People have lived here since the Neolithic. In the Middle
    Ages the valley belonged mostly to the Eristavis of Aragvi; in the early 13th century its men fought
    for Queen Tamar against rebel highlanders of Didoeti and Pkhovi, and late in that century Mongol punitive
    troops came up the gorge. In 1804, when Mtiuleti rose against the Russian authorities, the first clash
    with government troops happened here, at the village of Kaishaurni.


    The surviving towers are squat stone keeps, not the slender Svan kind. The reason to drive up is the
    church of the Mother of God at Korogho, a small hall church of the late 10th or early 11th century
    built of local flagstone and schist. Its western lintel tells the story of its own making: men quarry,
    haul and dress the stone, then sit down to eat, all leading up to the Virgin of the Sign in the gable.
    By the north door a reused relief shows three donors, one holding the church's plan. A three-storey
    tower stands alongside, and the church's 11th-century ivory icon of the Virgin is now in the Georgian
    National Museum in Tbilisi.


    Down at the valley mouth begins the Kvesheti–Kobi road now being built to bypass the highest stretch
    of the Military Highway. Up at Korogho, the masons on the lintel have been on their lunch break for
    a thousand years.
  tip: >-
    Allow three hours for the drive up, Korogho and a walk to a tower or two; a full day if you want to
    hike the valley. There is no shop, café or fuel, so carry water and food. The church stands on a steep
    slope above the village: wear proper shoes, and cover shoulders and knees inside. The towers are unfenced
    ruins on private land, so ask before climbing and keep out of any with collapsed floors. Snow closes
    the upper valley from November to April, and even in summer a swollen ford after heavy rain can turn
    you back.
  route: >-
    Take the S1 towards Mtskheta, then the Georgian Military Highway (S3/E117) north past Ananuri and
    Pasanauri to Kvesheti: about 102 km and two hours. In Kvesheti, before the road begins its serious
    climb to Gudauri, turn left into the Khada valley. Korogho is roughly 7 km further on a narrow side
    road; the asphalt soon gives way to stone and ruts, with fords that swell after rain. Allow about
    108 km and 2 h 20 min in all. An SUV with decent clearance is the right car; low saloons should stay
    at the valley mouth. Expect construction traffic from the Kvesheti–Kobi road near the turn. The last
    fuel is in Pasanauri.
ru:
  name: Ущелье Хада
  short: >-
    Боковая долина над Квешети, которой старый стих приписывает шестьдесят башен, и тысячелетняя церковь
    с резными фигурами тех, кто её строил.
  body: >-
    **«В Хаде, слышал я, шестьдесят могучих башен стоит», — говорится в старом горском стихе, и географ
    XVIII века царевич Вахушти Багратиони был с ним согласен, назвав это место каменистым и «шестидесятибашенным».**


    Хада — боковая долина Белой Арагви, которая открывается у Квешети, ниже подъёма на Гудаури, и уходит
    на северо-запад в горы. Вместе с соседним Цхавати она составляла этнографическое Мтиулети, а название,
    по словам местных, означает «гора». Люди живут здесь со времён неолита. В Средние века долина принадлежала
    в основном арагвским эриставам; в начале XIII века её мужчины сражались за царицу Тамару против мятежных
    горцев Дидоэти и Пхови, а в конце того же века по ущелью поднялись монгольские карательные отряды.
    В 1804 году, когда Мтиулети восстало против российских властей, первое столкновение с правительственными
    войсками произошло именно здесь, у села Каишаурни.


    Уцелевшие башни — приземистые каменные твердыни, совсем не похожие на стройные сванские. Ехать сюда
    стоит ради церкви Богоматери в Корого — небольшой однонефной церкви конца X или начала XI века, сложенной
    из местного плитняка и сланца. Её западная перемычка рассказывает историю собственного строительства:
    люди добывают камень, везут его, обтёсывают, а потом садятся за трапезу, и всё это ведёт к образу
    Богоматери «Знамение» во фронтоне. У северной двери вмурован более древний рельеф с тремя ктиторами,
    один из которых держит план храма. Рядом стоит трёхэтажная башня, а принадлежавшая церкви икона Богоматери
    XI века из слоновой кости хранится теперь в Национальном музее Грузии в Тбилиси.


    Внизу, у входа в долину, начинается строящаяся дорога Квешети — Коби, которая пройдёт в обход самого
    высокого участка Военно-Грузинской дороги. А наверху, в Корого, каменщики на перемычке уже тысячу
    лет сидят на обеденном перерыве.
  tip: >-
    Закладывайте три часа на подъём, Корого и прогулку к одной-двум башням; целый день — если хотите пройти
    долину пешком. Магазинов, кафе и заправок здесь нет, так что берите воду и еду с собой. Церковь стоит
    на крутом склоне над селом: наденьте нормальную обувь, а внутри прикройте плечи и колени. Башни —
    неогороженные руины на частной земле: спросите разрешения, прежде чем лезть, и не заходите туда, где
    обрушились перекрытия. С ноября по апрель верхнюю часть долины закрывает снег, и даже летом вздувшийся
    после ливня брод может заставить повернуть назад.
  route: >-
    Поезжайте по S1 в сторону Мцхеты, затем по Военно-Грузинской дороге (S3/E117) на север мимо Ананури
    и Пасанаури до Квешети: около 102 км и два часа. В Квешети, прежде чем дорога начнёт настоящий подъём
    к Гудаури, сверните налево в ущелье Хада. До Корого ещё примерно 7 км по узкой боковой дороге; асфальт
    быстро сменяется камнем и колеями, а броды после дождя вздуваются. Всего выходит около 108 км и 2
    ч 20 мин. Правильная машина — внедорожник с приличным клиренсом; низким седанам лучше остаться у входа
    в долину. Возле поворота ждите строительную технику с дороги Квешети — Коби. Последняя заправка —
    в Пасанаури.
fa:
  name: درهٔ خادا
  short: >-
    دره‌ای فرعی بالای کوِشِتی که شعری کهن شصت برج به آن نسبت می‌دهد، و کلیسایی هزارساله که سازندگانش را
    بر سنگ نقش کرده است.
  body: >-
    **شعری کهن از کوهستان می‌گوید: «در خادا، شنیده‌ام، شصت برج ستبر ایستاده است»، و جغرافی‌دان سدهٔ هجدهم،
    شاهزاده واخوشتی باگراتیونی، نیز با آن هم‌داستان بود و این مکان را سنگلاخ و «شصت‌برجی» خواند.**


    خادا دره‌ای فرعی از آراگوی سفید است که در کوِشِتی، پایین‌تر از سربالایی گودائوری، دهان می‌گشاید و
    به سوی شمال‌غرب در دل کوه‌ها پیش می‌رود. این دره همراه با تسخاواتیِ همسایه، ناحیهٔ قوم‌شناختیِ متیولتی
    را می‌ساخت، و به گفتهٔ اهالی نامش به معنای «کوه» است. از دوران نوسنگی مردم در اینجا زیسته‌اند. در
    سده‌های میانه دره بیشتر از آنِ اریستاوهای آراگوی بود؛ در آغاز سدهٔ سیزدهم مردانش در سپاه ملکه تامار
    با کوه‌نشینان شورشی دیدوئتی و پخوی جنگیدند، و در اواخر همان سده سپاهیان تنبیهی مغول از این تنگه بالا
    آمدند. در ۱۸۰۴، هنگامی که متیولتی بر ضد مقامات روسی برخاست، نخستین درگیری با نیروهای دولتی همین‌جا،
    در روستای کایشائورنی، روی داد.


    برج‌های بازمانده دژهای سنگیِ کوتاه و ستبرند، نه از گونهٔ برج‌های باریک سوانی. دلیل بالا رفتن، کلیسای
    مریم مقدس در کوروغو است: کلیسایی تالاری و کوچک از اواخر سدهٔ دهم یا اوایل سدهٔ یازدهم، ساخته از سنگ
    لاشهٔ ورقه‌ای محلی و شیست. نعل‌درگاه غربی آن داستان ساخته شدن خودش را روایت می‌کند: مردانی سنگ را
    از کان می‌کَنند، می‌کشانند و می‌تراشند، سپس برای خوردن می‌نشینند، و همهٔ این صحنه‌ها به مریم باکره
    از گونهٔ «نشانه» در پیشانی سه‌گوش بنا می‌رسد. کنار در شمالی، نقش برجسته‌ای که دوباره به کار رفته سه
    بانی را نشان می‌دهد که یکی نقشهٔ کلیسا را در دست دارد. برجی سه‌طبقه در کنارش ایستاده، و شمایل عاجیِ
    مریم باکره از سدهٔ یازدهم که از آنِ این کلیسا بود، اکنون در موزهٔ ملی گرجستان در تفلیس است.


    پایین، در دهانهٔ دره، جادهٔ کوِشِتی–کوبی آغاز می‌شود که در دست ساخت است تا مرتفع‌ترین بخش جادهٔ نظامی
    گرجستان را دور بزند. و آن بالا در کوروغو، سنگتراشانِ نعل‌درگاه هزار سال است که در استراحت ناهارند.
  tip: >-
    برای رفتن تا بالا، کوروغو و پیاده‌روی تا یکی دو برج سه ساعت وقت بگذارید؛ اگر می‌خواهید دره را پیاده
    بپیمایید، یک روز کامل. نه مغازه‌ای هست، نه کافه‌ای، نه پمپ‌بنزینی، پس آب و خوراک همراه بیاورید. کلیسا
    بر شیبی تند بالای روستا ایستاده است: کفش مناسب بپوشید و درون کلیسا شانه‌ها و زانوها را بپوشانید. برج‌ها
    ویرانه‌هایی بی‌حصار بر زمین‌های خصوصی‌اند؛ پیش از بالا رفتن اجازه بگیرید و به برج‌هایی که کف‌هایشان
    فروریخته وارد نشوید. از نوامبر تا آوریل برف بخش بالایی دره را می‌بندد، و حتی در تابستان، گداری که
    پس از بارانی سنگین آب‌خیز شده می‌تواند شما را به بازگشت وادارد.
  route: >-
    از S1 به سوی متسختا بروید، سپس از جادهٔ نظامی گرجستان (S3/E117) به شمال، از کنار آنانوری و پاسانائوری
    تا کوِشِتی: حدود ۱۰۲ کیلومتر و دو ساعت. در کوِشِتی، پیش از آنکه جاده سربالایی جدی‌اش به سوی گودائوری
    را آغاز کند، به چپ و به درهٔ خادا بپیچید. کوروغو تقریباً ۷ کیلومتر جلوتر بر جاده‌ای فرعی و باریک است؛
    آسفالت زود جایش را به سنگ و شیار می‌دهد و گدارها پس از باران پرآب می‌شوند. روی هم حدود ۱۰۸ کیلومتر
    و ۲ ساعت و ۲۰ دقیقه است. خودروی مناسب، شاسی‌بلندی با فاصلهٔ کف خوب است؛ سدان‌های کوتاه بهتر است در
    دهانهٔ دره بمانند. نزدیک دوراهی منتظر ماشین‌آلات ساختمانی جادهٔ کوِشِتی–کوبی باشید. آخرین پمپ‌بنزین
    در پاسانائوری است.
he:
  name: עמק חאדה
  short: עמק צדדי מעל קווישתי, שבית שיר ישן מייחס לו שישים מגדלים, ובו כנסייה בת אלף שנה שחקוקים עליה
    האנשים שבנו אותה.
  body: >-
    **״בחאדה, כך שמעתי, עומדים שישים מגדלים אדירים״, אומר שיר הררי ישן, והגאוגרף בן המאה ה-18, הנסיך ואחושטי
    בגרטיוני, הסכים עמו וכינה את המקום סלעי ו״בעל שישים המגדלים״.**


    חאדה הוא עמק צדדי של האראגווי הלבן, הנפתח בקווישתי, מתחת לעלייה לגודאורי, ונמשך צפון-מערבה אל תוך
    ההרים. יחד עם צחוואטי השכן הוא הרכיב את מתיולתי האתנוגרפית, והמקומיים אומרים שפירוש השם הוא ״הר״.
    בני אדם חיים כאן מאז התקופה הנאוליתית. בימי הביניים השתייך העמק ברובו לאריסטאווים של האראגווי; בראשית
    המאה ה-13 נלחמו אנשיו למען המלכה תמר נגד בני הרים מורדים מדידואתי ומפחובי, ובסוף אותה מאה עלו במעלה
    הערוץ כוחות עונשין מונגוליים. ב-1804, כשמתיולתי התקוממה נגד השלטונות הרוסיים, ההתנגשות הראשונה עם
    כוחות הממשל אירעה כאן, בכפר קאישאורני.


    המגדלים ששרדו הם מבצרי אבן גוצים, לא מן הסוג הסוואני הדקיק. הסיבה לעלות לכאן היא כנסיית אם האלוהים
    בקורוגו, כנסיית אולם קטנה מסוף המאה ה-10 או מראשית המאה ה-11, בנויה מלוחות אבן מקומיים ומשיסט. המשקוף
    המערבי שלה מספר את סיפור הקמתה: אנשים חוצבים את האבן, גוררים אותה ומסתתים אותה, ואז מתיישבים לאכול,
    וכל זה מוביל אל דמות הבתולה מטיפוס ״האות״ שבגמלון. ליד הדלת הצפונית משולב תבליט ישן יותר, שמציג שלושה
    תורמים, ואחד מהם אוחז את תוכנית הכנסייה. לצדה עומד מגדל בן שלוש קומות, ואיקונת הבתולה מן המאה ה-11,
    עשויה שנהב, שהייתה שייכת לכנסייה, נמצאת היום במוזיאון הלאומי של גאורגיה בטביליסי.


    למטה, בפתח העמק, מתחיל הכביש קווישתי–קובי, הנמצא בבנייה ונועד לעקוף את הקטע הגבוה ביותר של הדרך הצבאית
    הגאורגית. ולמעלה, בקורוגו, הבנאים שעל המשקוף נמצאים בהפסקת צהריים כבר אלף שנה.
  tip: >-
    הקציבו שלוש שעות לנסיעה למעלה, לקורוגו ולהליכה אל מגדל או שניים; יום שלם אם אתם רוצים לטייל ברגל לאורך
    העמק. אין כאן חנות, בית קפה או תחנת דלק, לכן הביאו מים ואוכל. הכנסייה עומדת על מדרון תלול מעל הכפר:
    נעלו נעליים מתאימות, ובפנים כסו כתפיים וברכיים. המגדלים הם חורבות לא מגודרות על קרקע פרטית, לכן בקשו
    רשות לפני שאתם מטפסים, והתרחקו מכל מגדל שרצפותיו קרסו. השלג סוגר את העמק העליון מנובמבר עד אפריל,
    וגם בקיץ, אחרי גשם כבד, מעבר מים גואה עלול להחזיר אתכם לאחור.
  route: >-
    סעו בכביש S1 לכיוון מצחתה, ואז צפונה בדרך הצבאית הגאורגית (S3/E117) על פני אנאנורי ופסנאורי עד קווישתי:
    כ-102 ק״מ ושעתיים. בקווישתי, לפני שהכביש מתחיל את הטיפוס הרציני לגודאורי, פנו שמאלה אל עמק חאדה. קורוגו
    נמצאת כ-7 ק״מ הלאה, בדרך צדדית צרה; האספלט מתחלף במהרה באבנים ובתלמים, ומעברי המים גואים אחרי גשם.
    בסך הכול כ-108 ק״מ ושעתיים ועשרים דקות. הרכב הנכון הוא רכב שטח עם מרווח גחון סביר; מכוניות סדאן נמוכות
    מוטב שיישארו בפתח העמק. צפו לתנועת רכבי עבודה של כביש קווישתי–קובי ליד הפנייה. הדלק האחרון בפסנאורי.
ar:
  name: وادي خادا
  short: >-
    وادٍ جانبي فوق كفيشيتي ينسب إليه بيت شعر قديم ستين برجاً، وفيه كنيسة عمرها ألف عام نُقش عليها الرجال
    الذين بنوها.
  body: >-
    **«في خادا، كما سمعتُ، تقوم ستون برجاً منيعاً»، هكذا يقول بيت شعر جبلي قديم، وقد وافقه جغرافي القرن
    الثامن عشر الأمير فاخوشتي باغراتيوني، فوصف المكان بأنه صخري و«ذو ستين برجاً».**


    خادا وادٍ جانبي لنهر أراغفي الأبيض، ينفتح عند كفيشيتي أسفل الصعود إلى غوداوري، ويمتد نحو الشمال الغربي
    في قلب الجبال. وكان هو وجاره تسخافاتي يؤلّفان إقليم متيوليتي بمعناه الإثنوغرافي، ويقول أهله إن اسمه
    يعني «الجبل». وقد سكنه البشر منذ العصر الحجري الحديث. وفي القرون الوسطى كان الوادي في معظمه ملكاً
    لإريستافات أراغفي؛ وفي مطلع القرن الثالث عشر قاتل رجاله في صف الملكة تامار ضد جبليين متمردين من ديدوئيتي
    وبخوفي، وفي أواخر القرن نفسه صعدت الوادي الضيق قوات مغولية تأديبية. وفي عام 1804، حين ثارت متيوليتي
    على السلطات الروسية، وقع أول صدام مع القوات الحكومية هنا، عند قرية كايشاورني.


    الأبراج الباقية حصون حجرية قصيرة ممتلئة، لا من طراز الأبراج السفانية الرشيقة. أما سبب الصعود إلى هنا
    فهو كنيسة والدة الإله في كوروغو، كنيسة صغيرة ذات صحن واحد من أواخر القرن العاشر أو مطلع الحادي عشر،
    مبنية من الحجر الصفائحي المحلي والشِّست. وتروي عتبتها الغربية العليا قصة بنائها هي نفسها: رجال يقتلعون
    الحجر ويجرّونه وينحتونه، ثم يجلسون ليأكلوا، وكل ذلك يفضي إلى صورة العذراء من طراز «العلامة» في الجملون.
    وعند الباب الشمالي نقش بارز أُعيد استخدامه يُظهر ثلاثة واهبين، أحدهم يحمل مخطط الكنيسة. وإلى جوارها
    برج من ثلاثة طوابق، أما أيقونة العذراء العاجية العائدة إلى القرن الحادي عشر، التي كانت للكنيسة، فهي
    اليوم في المتحف الوطني الجورجي في تبليسي.


    وفي الأسفل، عند مدخل الوادي، يبدأ طريق كفيشيتي–كوبي الذي يجري شقّه ليتجاوز أعلى مقاطع الطريق العسكري
    الجورجي. وفي الأعلى، في كوروغو، لا يزال البنّاؤون على العتبة في استراحة الغداء منذ ألف عام.
  tip: >-
    خصّص ثلاث ساعات للصعود وكوروغو والمشي إلى برج أو اثنين؛ ويوماً كاملاً إن أردت أن تجوب الوادي سيراً
    على الأقدام. لا متجر هنا ولا مقهى ولا وقود، فاحمل الماء والطعام. تقف الكنيسة على منحدر شديد فوق القرية:
    البس حذاءً مناسباً، وغطِّ الكتفين والركبتين في الداخل. الأبراج أطلال غير مسيّجة على أرض خاصة، فاستأذن
    قبل التسلّق وابتعد عن أي برج انهارت أرضياته. يغلق الثلج أعالي الوادي من نوفمبر إلى أبريل، وحتى في
    الصيف قد تجبرك مخاضة فاضت بعد مطر غزير على العودة.
  route: >-
    اسلك الطريق S1 باتجاه متسخيتا، ثم الطريق العسكري الجورجي (S3/E117) شمالاً مروراً بأنانوري وباسانائوري
    حتى كفيشيتي: نحو 102 كم وساعتين. وفي كفيشيتي، قبل أن يبدأ الطريق صعوده الجدي نحو غوداوري، انعطف يساراً
    إلى وادي خادا. تقع كوروغو على بعد نحو 7 كم أخرى على طريق جانبي ضيق؛ سرعان ما يفسح الأسفلت المجال للحجارة
    والأخاديد، وتفيض المخاضات بعد المطر. المجموع نحو 108 كم وساعتان وعشرون دقيقة. السيارة المناسبة هي
    سيارة دفع رباعي بخلوص أرضي جيد؛ أما السيارات المنخفضة فالأفضل أن تبقى عند مدخل الوادي. توقّع حركة
    آليات بناء طريق كفيشيتي–كوبي قرب المنعطف. آخر محطة وقود في باسانائوري.
