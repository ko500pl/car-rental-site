ka:
  name: კოჯრის ციხე (აზეულა)
  short: შუა საუკუნეების ციხე კლდოვან ქიმზე კოჯრის თავზე — თამარ მეფის კარის საზაფხულო თავშესაფარი და თბილისის
    საუკეთესო მზის ჩასვლის წერტილი.
  body: >-
    **კოჯრის ციხე — იგივე აზეულა ან აგარანი — კლდოვან ქიმზეა შემომჯდარი კოჯრის სამხრეთით.** უძველესი ფენები
    XI საუკუნის მიწურულს განეკუთვნება, დღეს შემორჩენილი კედლების უმეტესობა კი XVI–XVIII საუკუნეებისაა.
    ციხე ორბელთა საგვარეულოს ემსახურებოდა, მოგვიანებით კი ქართული სამეფო კარის საზაფხულო თავშესაფარი გახდა
    — წყაროები თამარ მეფის კარს სწორედ აგარანში იხსენიებენ, გადმოცემით კი დიდი დედოფალი აქ გარდაიცვალა.


    ამ ადგილს უფრო ახალი და მძიმე ისტორიაც აწევს: 1921 წლის თებერვალში კოჯრის მიმდებარე სიმაღლეებზე წითელი
    არმიის შემოჭრის ყველაზე სასტიკი ბრძოლები გაიმართა. ახლოს დგას დაღუპული ქართველი იუნკრებისა და მარო
    მაყაშვილის მემორიალი — ჩერდები და ორი ეპოქა ერთ გორაზე გხვდება.


    კლდის წვერიდან თბილისის ქვაბულისა და თრიალეთის ქედის განიერი პანორამა იშლება. ეს თბილისელების საყვარელი
    მოკლე ლაშქრობა და მზის ჩასვლის ადგილია: გზისპირიდან ციხემდე 15–20 წუთის აღმართია, ზემოთ კი გრილი კოჯრის
    ჰაერი და ქალაქის შორეული ხმაური. მთელი წელი ღიაა და უფასოა.
  tip: >-
    ყველაზე ლამაზი შუქი მზის ჩასვლისას არის, როცა კლდე ოქროსფრად ინთება და ქვემოთ თბილისი ინათებს — მაგრამ
    ფანარი წამოიღე, დაბრუნება სიბნელეში მოგიწევს. ფეხსაცმელი მოხერხებული გქონდეს: ბოლო ასვლა კლდოვან ბილიკზეა.
    კოჯრის ჰაერი ქალაქზე რამდენიმე გრადუსით გრილია, ქარიან დღეს ზემოთ ქურთუკი გინდა. წყალი და საჭმელი კოჯრის
    მაღაზიებში იყიდე — ციხესთან არაფერია.
  route: >-
    თბილისიდან კოჯრის გზას აჰყევი წავკისის გავლით — სულ 21 კმ და დაახლოებით 40 წუთი მთლიანად ასფალტიან
    გზაზე, რომელსაც ნებისმიერი მანქანა ივლის. ციხის ქიმი კოჯრის სამხრეთითაა: მანქანას გზისპირას ტოვებ და
    15–20 წუთში კლდოვანი ბილიკით ადიხარ. მარშრუტი მთელი წლის განმავლობაში მუშაობს; ზამთარში მხოლოდ მოყინულ
    ბილიკს მიაქციე ყურადღება.
en:
  name: Kojori Fortress (Azeula)
  short: A medieval fortress on a rocky crag above Kojori — summer refuge of Queen Tamar's court and Tbilisi's
    favourite sunset hike.
  body: >-
    **Kojori Fortress — also known as Azeula or Agarani — crowns a rocky crag just south of Kojori.** Its
    earliest layers date to the late 11th century, while most of the surviving walls belong to the 16th–18th
    centuries. The fortress served the Orbeli family and later became the summer refuge of the Georgian
    royal court: the chronicles record Queen Tamar's court at Agarani, and tradition holds that the great
    queen died here.


    The place carries a newer, heavier history too. In February 1921 the heights around Kojori saw the
    fiercest fighting of the Red Army invasion of Georgia. A monument to the fallen Georgian cadets — the
    junkers — and to Maro Makashvili stands nearby, so two eras meet on one hill.


    From the top of the crag a sweeping panorama opens over the Tbilisi basin and the Trialeti ridge. This
    is a favourite short hike and sunset spot for Tbilisians: from the roadside it is a 15–20 minute climb,
    and at the top you get Kojori's cool air and the distant hum of the city. The ruin is open year-round
    and free.
  tip: >-
    The finest light is at sunset, when the crag glows gold and Tbilisi switches its lights on below —
    but bring a torch, as you will descend in the dark. Wear proper shoes: the final approach is a rocky
    path. Kojori's air runs several degrees cooler than the city, so take a jacket on windy days. Buy water
    and snacks in Kojori's shops — there is nothing at the fortress itself.
  route: >-
    From Tbilisi take the Kojori road through Tsavkisi — 21 km and about 40 minutes on fully paved road
    that any car manages. The fortress crag is just south of Kojori: leave the car at the roadside and
    walk up the rocky path for 15–20 minutes. The trip works year-round; in winter just watch for ice on
    the final stretch.
ru:
  name: Коджорская крепость (Азеула)
  short: Средневековая крепость на скалистом утёсе над Коджори — летнее убежище двора царицы Тамары и любимая
    закатная прогулка тбилисцев.
  body: >-
    **Коджорская крепость — она же Азеула или Агарани — венчает скалистый утёс к югу от Коджори.** Древнейшие
    слои относятся к концу XI века, а большинство сохранившихся стен — к XVI–XVIII векам. Крепость служила
    роду Орбели, а позже стала летним убежищем грузинского царского двора: летописи упоминают двор царицы
    Тамары в Агарани, а предание гласит, что великая царица скончалась именно здесь.


    У этого места есть и более новая, тяжёлая история. В феврале 1921 года на высотах вокруг Коджори шли
    самые ожесточённые бои вторжения Красной армии в Грузию. Рядом стоит памятник павшим грузинским юнкерам
    и Маро Макашвили — две эпохи встречаются на одном холме.


    С вершины утёса открывается широкая панорама Тбилисской котловины и Триалетского хребта. Это любимая
    короткая прогулка и закатная точка тбилисцев: от дороги наверх 15–20 минут подъёма, а наверху — прохладный
    коджорский воздух и далёкий гул города. Руины открыты круглый год, вход свободный.
  tip: >-
    Лучший свет — на закате, когда утёс золотится, а внизу зажигаются огни Тбилиси; но возьмите фонарик
    — спускаться придётся в темноте. Обувь нужна нормальная: финальный подход идёт по каменистой тропе.
    В Коджори на несколько градусов прохладнее, чем в городе, в ветреный день наверху пригодится куртка.
    Воду и перекус купите в магазинах Коджори — у самой крепости ничего нет.
  route: >-
    Из Тбилиси по коджорской дороге через Цавкиси — 21 км и около 40 минут по полностью асфальтированной
    дороге, доступной любой машине. Утёс с крепостью — сразу к югу от Коджори: машину оставляют у дороги
    и поднимаются по каменистой тропе 15–20 минут. Маршрут работает круглый год; зимой лишь остерегайтесь
    наледи на последнем участке.
fa:
  name: دژ کوجوری (آزئولا)
  short: دژی سده‌های میانه بر ستیغ صخره‌ای بالای کوجوری — پناهگاه تابستانی دربار ملکه تامار و محبوب‌ترین
    نقطهٔ غروب تفلیسی‌ها.
  body: >-
    **دژ کوجوری — که آزئولا یا آگارانی هم خوانده می‌شود — بر ستیغی صخره‌ای درست در جنوب کوجوری نشسته است.**
    کهن‌ترین لایه‌های آن به اواخر سدهٔ یازدهم بازمی‌گردد و بیشتر دیوارهای برجای‌مانده از سده‌های شانزدهم
    تا هجدهم است. دژ در خدمت خاندان اوربلی بود و سپس پناهگاه تابستانی دربار سلطنتی گرجستان شد: وقایع‌نامه‌ها
    دربار ملکه تامار را در آگارانی ثبت کرده‌اند و بنا بر روایت، ملکهٔ بزرگ همین‌جا درگذشت.


    این مکان تاریخی تازه‌تر و سنگین‌تر هم دارد. در فوریهٔ 1921 بلندی‌های پیرامون کوجوری صحنهٔ سخت‌ترین
    نبردهای هجوم ارتش سرخ به گرجستان بود. یادبود دانشجویان افسری گرجی جان‌باخته و مارو ماکاشویلی در همان
    نزدیکی ایستاده است — دو دوران بر یک تپه به هم می‌رسند.


    از فراز ستیغ چشم‌اندازی فراخ بر گودی تفلیس و ستیغ تریالتی گشوده می‌شود. این پیاده‌روی کوتاه محبوب و
    نقطهٔ تماشای غروب تفلیسی‌هاست: از کنار جاده 15 تا 20 دقیقه بالا می‌روید و در بالا هوای خنک کوجوری و
    همهمهٔ دوردست شهر در انتظار است. ویرانه تمام سال باز و رایگان است.
  tip: >-
    زیباترین نور هنگام غروب است، وقتی صخره طلایی می‌شود و چراغ‌های تفلیس در پایین روشن می‌شوند — اما چراغ‌قوه
    بیاورید، چون بازگشت در تاریکی خواهد بود. کفش مناسب بپوشید: پایان مسیر کوره‌راهی سنگی است. هوای کوجوری
    چند درجه از شهر خنک‌تر است و در روزهای بادی بالای صخره ژاکت می‌خواهید. آب و تنقلات را از فروشگاه‌های
    کوجوری بخرید — کنار خود دژ چیزی نیست.
  route: >-
    از تفلیس جادهٔ کوجوری را از میان تساوکیسی بگیرید — 21 کیلومتر و حدود 40 دقیقه روی جاده‌ای سراسر آسفالت
    که هر خودرویی از پس آن برمی‌آید. ستیغ دژ درست در جنوب کوجوری است: خودرو را کنار جاده بگذارید و 15 تا
    20 دقیقه از کوره‌راه سنگی بالا بروید. این گشت تمام سال ممکن است؛ در زمستان فقط مواظب یخ‌زدگی تکهٔ پایانی
    باشید.
he:
  name: מבצר קוג'ורי (אזאולה)
  short: מבצר ימי-ביניימי על צוק סלעי מעל קוג'ורי — מפלט הקיץ של חצר המלכה תמר ונקודת השקיעה האהובה על
    תושבי טביליסי.
  body: >-
    **מבצר קוג'ורי — הידוע גם כאזאולה או אגראני — מעטר צוק סלעי מדרום לקוג'ורי.** שכבותיו הקדומות ביותר
    מתוארכות לשלהי המאה ה-11, ורוב החומות ששרדו שייכות למאות ה-16 עד ה-18. המבצר שירת את משפחת אורבלי ואחר
    כך הפך למפלט הקיץ של חצר המלוכה הגאורגית: הכרוניקות מתעדות את חצר המלכה תמר באגראני, והמסורת גורסת
    שהמלכה הגדולה נפטרה כאן.


    למקום יש גם היסטוריה חדשה וכבדה יותר. בפברואר 1921 התחוללו ברמות סביב קוג'ורי הקרבות העזים ביותר של
    פלישת הצבא האדום לגאורגיה. אנדרטה לצוערים הגאורגים שנפלו — היונקרים — ולמארו מקשווילי ניצבת בקרבת מקום,
    כך ששתי תקופות נפגשות על גבעה אחת.


    מראש הצוק נפרשת פנורמה רחבה על אגן טביליסי ורכס טריאלטי. זהו מסלול קצר אהוב ונקודת שקיעה מבוקשת של
    תושבי טביליסי: מהכביש זהו טיפוס של 15–20 דקות, ולמעלה מחכים האוויר הצונן של קוג'ורי והמיית העיר הרחוקה.
    האתר פתוח כל השנה והכניסה חופשית.
  tip: >-
    האור היפה ביותר הוא בשקיעה, כשהצוק מוזהב וטביליסי מדליקה את אורותיה למטה — אבל קחו פנס, כי הירידה תהיה
    בחושך. נעלו נעליים טובות: הגישה האחרונה עוברת בשביל סלעי. האוויר בקוג'ורי קריר בכמה מעלות מהעיר, וביום
    סוער כדאי מעיל למעלה. מים וחטיפים קנו בחנויות קוג'ורי — ליד המבצר עצמו אין דבר.
  route: >-
    מטביליסי נוסעים בכביש קוג'ורי דרך צאווקיסי — 21 ק״מ וכ-40 דקות על כביש סלול לחלוטין שכל רכב עובר בו.
    צוק המבצר נמצא ממש מדרום לקוג'ורי: משאירים את הרכב בצד הדרך ומטפסים בשביל הסלעי 15–20 דקות. המסלול
    פתוח כל השנה; בחורף רק היזהרו מקרח בקטע האחרון.
ar:
  name: قلعة كوجوري (أزيولا)
  short: قلعة من العصور الوسطى على نتوء صخري فوق كوجوري — ملاذ بلاط الملكة تامار الصيفي وموقع الغروب المفضل
    لأهل تبليسي.
  body: >-
    **تتوّج قلعة كوجوري — المعروفة أيضاً بأزيولا أو أغاراني — نتوءاً صخرياً جنوبي كوجوري مباشرة.** تعود
    أقدم طبقاتها إلى أواخر القرن الحادي عشر، بينما تنتمي معظم الجدران الباقية إلى القرون من السادس عشر
    إلى الثامن عشر. خدمت القلعة أسرة أوربيلي ثم غدت ملاذ البلاط الملكي الجورجي في الصيف: فالحوليات تذكر
    بلاط الملكة تامار في أغاراني، ويقول التقليد إن الملكة العظيمة توفيت هنا.


    وللمكان تاريخ أحدث وأثقل أيضاً. ففي فبراير 1921 شهدت المرتفعات المحيطة بكوجوري أعنف معارك غزو الجيش
    الأحمر لجورجيا. وقريباً من هنا ينتصب نصب للطلبة العسكريين الجورجيين الذين سقطوا — اليونكرز — ولمارو
    ماكاشفيلي، فيلتقي عصران على تلة واحدة.


    من قمة النتوء تنفتح بانوراما واسعة على حوض تبليسي وسلسلة تريالتي. هذا مسير قصير محبب وموقع غروب مفضل
    لأهل تبليسي: من جانب الطريق صعود 15 إلى 20 دقيقة، وفي الأعلى هواء كوجوري العليل وهمهمة المدينة البعيدة.
    الأطلال مفتوحة طوال العام ومجانية.
  tip: >-
    أجمل الضوء عند الغروب، حين يتوهج الصخر ذهبياً وتضيء تبليسي أنوارها في الأسفل — لكن خذ مصباحاً، فالنزول
    سيكون في الظلام. البس حذاءً متيناً: فالوصلة الأخيرة درب صخري. هواء كوجوري أبرد من المدينة بدرجات، وفي
    يوم عاصف ستحتاج سترة في الأعلى. اشترِ الماء والوجبات الخفيفة من متاجر كوجوري — فلا شيء عند القلعة نفسها.
  route: >-
    من تبليسي خذ طريق كوجوري عبر تسافكيسي — 21 كم ونحو 40 دقيقة على طريق معبّد بالكامل تجتازه أي سيارة.
    نتوء القلعة جنوبي كوجوري مباشرة: اترك السيارة على جانب الطريق واصعد الدرب الصخري 15 إلى 20 دقيقة. الرحلة
    ممكنة طوال العام؛ وفي الشتاء انتبه فقط للجليد على المقطع الأخير.
