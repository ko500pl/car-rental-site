ka:
  name: კოჯრის ციხე (აზეულა)
  short: >-
    აგარანის ციხის ნანგრევები აზეულას კლდეზე, კოჯრის თავზე: მეფეთა საზაფხულო სადგომი, სადაც, მატიანის
    თანახმად, თამარი გარდაიცვალა, და 1921 წლის ბრძოლის ველი.
  body: >-
    **აზეულას კლდე კოჯრის თავზე ქვის მუშტივით აღმართულა, მის ქიმზე კი აგარანის ციხის დანგრეული კედლები
    ზის.**


    ზღვის დონიდან დაახლოებით 1350 მეტრზე, ტრიალეთის ქედის ვულკანური წარმოშობის განშტოებაზე მდგარი ციხე
    სომხითიდან თბილისისკენ მიმავალ საქარავნო გზას იცავდა და ხელიდან ხელში მონეტასავით გადადიოდა. XI საუკუნის
    60-იან წლებში ბაგრატ IV-მ ის ამირა ფადლონს წაართვა; 1080 წელს, „დიდი თურქობის“ დროს, სელჩუკებმა ჩაიგდეს
    ხელში; 1118 წლის ივლისში დავით აღმაშენებელმა ერთ დღეში აიღო, 1123 წელს კი ივანე ორბელს უწყალობა. 1177
    წელს გიორგი III-ის წინააღმდეგ აჯანყებული დიდებულები აქ გამაგრდნენ, მაგრამ მეფემ აგარანი იმავე წელს
    აიღო.


    ციხე მეფეთა საზაფხულო სადგომიც იყო. მატიანის თანახმად, სნეული თამარი აქ მოიყვანეს და აქვე გარდაიცვალა;
    მისი განსასვენებელი დღემდე უცნობია. XV საუკუნიდან ციხე სოლაღაშვილებს ეკუთვნოდა და „კოჯრის ციხე“ ეწოდა.
    იმავე საუკუნის მიწურულს აყ-ყოიუნლუს მმართველის, იაყუბ ყაენის, თურქმანმა მეთოფეებმა ის ისე დააზიანეს,
    რომ მცირერიცხოვანმა მეციხოვნეებმა ციხე დატოვეს. XVII საუკუნეში როსტომ მეფემ კოჯორი კვლავ სამეფო საზაფხულო
    რეზიდენციად აქცია. გადმოცემით, აქ ლეგენდარული ქოროღლიც აფარებდა თავს — აქედან მოდის ციხის ძველი სახელი,
    ქოროღლის ციხე.


    დღეს აქ ცოტა რამ დგას: ორი კოშკის ნაშთი და მათ შორის გალავნის ნანგრევი, ნატეხი ქვითა და აგურით ნაგები
    — ძირითადად XVI–XVIII საუკუნეების წყობა XI საუკუნის ფუძეზე.


    1921 წლის თებერვალში კოჯრის სიმაღლეებზე შემოჭრილ წითელ არმიასთან მძიმე ბრძოლები გაიმართა. აქ ოცი-ოცდაერთი
    წლის იუნკრები იბრძოდნენ, მათთან ერთად კი დაიღუპა ცხრამეტი წლის მოხალისე მედდა მარო მაყაშვილი; იუნკრების
    ძეგლი 1990-იან წლებში აღიმართა. შებინდებისას, როცა ქვემოთ, ქვაბულში თბილისის შუქები ინთება, ხვდებით,
    რას იცავდნენ ისინი.
  tip: >-
    ამოდით დღის ბოლო საათზე, როცა კლდე ოქროსფრად ინთება და ქვემოთ ქალაქი ნათდება, ოღონდ ფანარი თან იქონიეთ
    — ჩამოსვლა სიბნელეში მოგიწევთ. ბილიკი მოკლეა, მაგრამ კლდოვანი და ზოგან ფხვიერი: მოხერხებული ფეხსაცმელი
    ჩაიცვით, ციცაბო კიდეებთან კი ბავშვები გვერდით გყავდეთ. კოჯორში თბილისზე შესამჩნევად გრილა და ქარიანია,
    ამიტომ თბილი ტანსაცმელი წაიღეთ. თავად ნანგრევებთან არაფერია — არც წყალი, არც ტუალეტი, არც ჯიხური,
    — ამიტომ საჭირო ყველაფერი კოჯორში იყიდეთ. ადგილი მთელი წელი ღიაა და უფასოა.
  route: >-
    თბილისის ცენტრიდან კოჯრის გზატკეცილს აჰყევით — ის მარო მაყაშვილის აღმართით იწყება და ქალაქის თავზე,
    ტყიან გორაკებში მიიკლაკნება: 21 კმ, დაახლოებით 40 წუთი, მთელ გზაზე ასფალტი. კოჯორში იუნკერთა ქუჩას,
    შემდეგ კი აზეულას ქუჩას გაჰყევით დაბის სამხრეთ ბოლოში აღმართული კლდისკენ და მანქანა გზისპირას, ბილიკის
    დასაწყისთან დატოვეთ. იქიდან ციხემდე ფეხით 15–20 წუთის აღმართია. გზას ნებისმიერი ეკონომ-კლასის მანქანა
    გაივლის; ზამთარში ზედა მოსახვევებსა და თავად ბილიკზე ყინულს გაუფრთხილდით. საწვავი თბილისში ჩაასხით.
en:
  name: Kojori Fortress (Azeula)
  short: >-
    The ruined walls of Agarani on Azeula crag above Kojori: a royal summer seat, where the chronicles
    say Queen Tamar died, and a battlefield of 1921.
  body: >-
    **Azeula crag rises over Kojori like a stone fist, and on its knuckles sit the broken walls of Agarani.**


    At about 1,350 metres, on a volcanic spur of the Trialeti range, the fortress guarded the caravan
    road from Somkhiti into Tbilisi, and it changed hands like a coin. Bagrat IV took it from the emir
    Fadlon in the 1060s; the Seljuks seized it during the "Great Turkish Invasion" of 1080; David the
    Builder won it back in a single day in July 1118 and in 1123 granted it to Ivane Orbeli. When nobles
    rebelled against Giorgi III in 1177, they dug in here, and the king took Agarani that same year.


    It was also a summer seat of kings. The chronicles say Queen Tamar was brought here ill and died here;
    where she lies buried is still unknown. From the 15th century the fortress belonged to the Sologashvili
    family and took the name Kojori. At the end of that century Turkoman musketeers sent by Yaqub, ruler
    of the Aq Qoyunlu, battered it until the small garrison withdrew. In the 17th century King Rostom
    made Kojori a royal summer residence again. Tradition says the folk hero Koroghli once sheltered here,
    hence the old name Koroghli Fortress.


    What stands today is modest: the stumps of two towers and the wall between them, rubble stone patched
    with brick, mostly 16th–18th-century work on an 11th-century core.


    In February 1921 the heights of Kojori saw heavy fighting against the invading Red Army. Georgian
    cadets of twenty or twenty-one fought here, and with them died Maro Makashvili, a nineteen-year-old
    volunteer nurse; a monument to the cadets was raised in the 1990s. At dusk, as the lights of Tbilisi
    come on in the basin below, you see what they were defending.
  tip: >-
    Come for the last hour of daylight, when the crag turns gold and the city lights up below, but carry
    a torch: you will walk down in the dark. The path is short but rocky and loose in places, so wear
    proper shoes and keep children close near the drops. Kojori is noticeably cooler and windier than
    Tbilisi; bring an extra layer. There is nothing at the ruin itself, no water, toilet or kiosk, so
    shop in Kojori. The site is open year-round and free.
  route: >-
    From central Tbilisi take the Kojori road, which starts as Maro Makashvili Ascent and winds up through
    wooded hills above the city: 21 km, about 40 minutes on asphalt all the way. In Kojori follow Junkers
    Street and then Azeula Street towards the crag at the southern edge of town, and park at the roadside
    where the path begins. From there it is a 15–20 minute climb on foot. Any economy car manages the
    road; in winter watch for ice on the upper bends and on the path itself. Fill up in Tbilisi.
ru:
  name: Коджорская крепость (Азеула)
  short: >-
    Разрушенные стены Агарани на скале Азеула над Коджори: летняя резиденция царей, где, по летописям,
    умерла царица Тамара, и поле боя 1921 года.
  body: >-
    **Скала Азеула поднимается над Коджори каменным кулаком, и на его костяшках сидят разбитые стены Агарани.**


    На высоте около 1350 метров, на вулканическом отроге Триалетского хребта, крепость стерегла караванную
    дорогу из Сомхити в Тбилиси и переходила из рук в руки, как монета. Баграт IV отнял её у эмира Фадлона
    в 1060-х; сельджуки захватили её во время «Великого турецкого нашествия» 1080 года; Давид Строитель
    отвоевал её за один день в июле 1118 года, а в 1123-м пожаловал Иване Орбели. Когда в 1177 году знать
    восстала против Георгия III, мятежники засели здесь, и в том же году царь взял Агарани.


    Здесь же было летнее пристанище царей. Летописи рассказывают, что сюда привезли больную царицу Тамару
    и здесь она умерла; где она похоронена, неизвестно до сих пор. С XV века крепость принадлежала роду
    Сологашвили и получила имя Коджори. В конце того же столетия туркменские мушкетёры, посланные Якубом,
    правителем Ак-Коюнлу, громили её, пока малочисленный гарнизон не ушёл. В XVII веке царь Ростом снова
    сделал Коджори летней царской резиденцией. Предание гласит, что здесь когда-то укрывался народный
    герой Кёроглы, — отсюда старое название: крепость Кёроглы.


    Сохранилось немногое: остовы двух башен и стена между ними, бутовая кладка, залатанная кирпичом, —
    в основном работа XVI–XVIII веков поверх ядра XI века.


    В феврале 1921 года на высотах Коджори шли тяжёлые бои с вторгшейся Красной армией. Здесь сражались
    грузинские юнкера двадцати — двадцати одного года, и вместе с ними погибла Маро Макашвили, девятнадцатилетняя
    сестра милосердия, ушедшая на фронт добровольцем; памятник юнкерам поставили в 1990-х. В сумерках,
    когда внизу, в котловине, загораются огни Тбилиси, видно, что они защищали.
  tip: >-
    Приезжайте к последнему часу светового дня, когда скала становится золотой, а внизу загорается город,
    но возьмите фонарик: спускаться придётся в темноте. Тропа короткая, но каменистая, местами с осыпью,
    так что нужна нормальная обувь, а детей у обрывов держите рядом. В Коджори заметно прохладнее и ветренее,
    чем в Тбилиси, — прихватите лишний слой одежды. У самих руин нет ничего — ни воды, ни туалета, ни
    киоска, так что всё нужное купите в Коджори. Место открыто круглый год, вход свободный.
  route: >-
    Из центра Тбилиси поезжайте по Коджорской дороге: она начинается как подъём Маро Макашвили и петляет
    вверх по лесистым холмам над городом — 21 км, около 40 минут, асфальт на всём пути. В Коджори следуйте
    по улице Юнкеров, затем по улице Азеула к скале на южной окраине посёлка и оставьте машину на обочине,
    где начинается тропа. Оттуда 15–20 минут подъёма пешком. Дорогу осилит любая машина эконом-класса;
    зимой берегитесь льда на верхних поворотах и на самой тропе. Заправьтесь в Тбилиси.
fa:
  name: دژ کوجوری (آزئولا)
  short: >-
    دیوارهای ویران آگارانی بر صخرهٔ آزئولا بالای کوجوری: اقامتگاه تابستانی شاهان، جایی که به روایت وقایع‌نامه‌ها
    ملکه تامار درگذشت، و میدان نبردی در ۱۹۲۱.
  body: >-
    **صخرهٔ آزئولا چون مشتی سنگی بر فراز کوجوری برخاسته است، و بر بندهای انگشتانش دیوارهای شکستهٔ آگارانی
    نشسته‌اند.**


    در ارتفاع حدود ۱۳۵۰ متری، بر پشته‌ای آتشفشانی از رشته‌کوه تریالتی، این دژ از راه کاروان‌رو سومخیتی
    به تفلیس پاسداری می‌کرد و مانند سکه دست‌به‌دست می‌شد. باگرات چهارم در دههٔ ۱۰۶۰ آن را از امیر فضلون
    گرفت؛ سلجوقیان در «هجوم بزرگ ترکان» در ۱۰۸۰ تصرفش کردند؛ داوید سازنده در ژوئیهٔ ۱۱۱۸ در یک روز آن
    را پس گرفت و در ۱۱۲۳ به ایوانه اوربلی بخشید. هنگامی که در ۱۱۷۷ اشراف بر گیورگی سوم شوریدند، در همین‌جا
    سنگر گرفتند، و شاه همان سال آگارانی را گشود.


    این‌جا اقامتگاه تابستانی شاهان نیز بود. وقایع‌نامه‌ها می‌گویند ملکه تامار را بیمار به این‌جا آوردند
    و همین‌جا درگذشت؛ آرامگاهش هنوز ناشناخته است. از سدهٔ پانزدهم دژ از آنِ خاندان سولوگاشویلی بود و نام
    کوجوری گرفت. در پایان همان سده، تفنگداران ترکمنی که یعقوب، فرمانروای آق‌قویونلو، فرستاده بود، آن‌قدر
    دژ را کوبیدند تا پادگان کوچکش عقب نشست. در سدهٔ هفدهم شاه رستم کوجوری را دوباره اقامتگاه تابستانی
    شاهی کرد. روایت است که کوراوغلو، قهرمان افسانه‌ای مردم، زمانی این‌جا پناه گرفته بود؛ نام کهن «دژ کوراوغلو»
    از همین‌جاست.


    آنچه امروز برجاست فروتن است: تنهٔ دو برج و دیوار میانشان، از سنگ لاشه که با آجر وصله شده، بیشتر کار
    سده‌های شانزدهم تا هجدهم بر هسته‌ای از سدهٔ یازدهم.


    در فوریهٔ ۱۹۲۱ بلندی‌های کوجوری صحنهٔ نبردهای سخت با ارتش سرخِ مهاجم بود. دانشجویان افسریِ گرجی بیست
    و بیست‌ویک‌ساله این‌جا جنگیدند، و همراهشان مارو ماکاشویلی، پرستار داوطلب نوزده‌ساله، جان باخت؛ بنای
    یادبود این دانشجویان افسری در دههٔ ۱۹۹۰ برپا شد. هنگام غروب، وقتی چراغ‌های تفلیس در گودی پایین روشن
    می‌شوند، می‌بینید از چه دفاع می‌کردند.
  tip: >-
    برای آخرین ساعت روشنایی روز بیایید، وقتی صخره طلایی می‌شود و شهر در پایین چراغان، اما چراغ‌قوه همراه
    داشته باشید: در تاریکی پایین خواهید آمد. کوره‌راه کوتاه است اما سنگلاخ و جابه‌جا لغزنده، پس کفش مناسب
    بپوشید و نزدیک پرتگاه‌ها بچه‌ها را کنار خود نگه دارید. کوجوری به‌طور محسوسی خنک‌تر و بادخیزتر از تفلیس
    است؛ یک لایه لباس اضافه بیاورید. کنار خودِ ویرانه هیچ نیست، نه آب، نه دستشویی، نه دکه، پس خریدتان
    را در کوجوری بکنید. این مکان در تمام سال باز و رایگان است.
  route: >-
    از مرکز تفلیس جادهٔ کوجوری را بگیرید؛ این جاده با نام سربالایی مارو ماکاشویلی آغاز می‌شود و پیچ‌پیچان
    از تپه‌های جنگلی بالای شهر بالا می‌رود: ۲۱ کیلومتر، حدود ۴۰ دقیقه، سراسر آسفالت. در کوجوری خیابان
    یونکرها و سپس خیابان آزئولا را به سوی صخره در لبهٔ جنوبی شهرک دنبال کنید و کنار جاده، جایی که کوره‌راه
    آغاز می‌شود، پارک کنید. از آن‌جا ۱۵ تا ۲۰ دقیقه پیاده بالا می‌روید. هر خودروی کلاس اقتصادی از پس این
    جاده برمی‌آید؛ در زمستان مراقب یخ در پیچ‌های بالایی و روی خود کوره‌راه باشید. در تفلیس باک را پر کنید.
he:
  name: מבצר קוג'ורי (אזאולה)
  short: >-
    חומותיו ההרוסות של אגרני על צוק אזאולה שמעל קוג'ורי: מושב קיץ של מלכים, שבו, לפי הכרוניקות, מתה המלכה
    תמר, ושדה קרב מ־1921.
  body: >-
    **צוק אזאולה מתרומם מעל קוג'ורי כמו אגרוף של אבן, ועל פרקי אצבעותיו יושבות החומות השבורות של אגרני.**


    בגובה של כ־1,350 מטר, על שלוחה געשית של רכס טריאלטי, שמר המבצר על דרך השיירות מסומחיתי אל טביליסי,
    ועבר מיד ליד כמו מטבע. בגרט הרביעי לקח אותו מידי האמיר פדלון בשנות השישים של המאה ה־11; הסלג'וקים
    תפסו אותו בזמן "הפלישה הטורקית הגדולה" של 1080; דוד הבונה כבש אותו בחזרה ביום אחד ביולי 1118, וב־1123
    העניק אותו לאיוואנה אורבלי. כשהאצילים מרדו בגיורגי השלישי ב־1177 הם התבצרו כאן, והמלך כבש את אגרני
    באותה שנה.


    זה היה גם מושב קיץ של מלכים. הכרוניקות מספרות שהמלכה תמר הובאה לכאן חולה ומתה כאן; מקום קבורתה אינו
    ידוע עד היום. מן המאה ה־15 השתייך המבצר למשפחת סולוגשווילי וקיבל את השם קוג'ורי. בסוף אותה מאה הלמו
    בו מוסקטרים טורקמנים ששלח יעקוב, שליט אק־קויונלו, עד שחיל המצב הקטן נסוג. במאה ה־17 הפך המלך רוסטום
    את קוג'ורי שוב למעון קיץ מלכותי. לפי המסורת, גיבור העם קוראוגלו מצא כאן פעם מחסה, ומכאן שמו הישן:
    מבצר קוראוגלו.


    מה שעומד כאן היום צנוע: גדמי שני מגדלים והחומה שביניהם, אבני גוויל מטולאות בלבנים, ברובם עבודה מן
    המאות ה־16–18 על גרעין מן המאה ה־11.


    בפברואר 1921 התחוללו על מרומי קוג'ורי קרבות קשים נגד הצבא האדום הפולש. צוערים גאורגים בני עשרים ועשרים
    ואחת נלחמו כאן, ואיתם נהרגה מרו מקשווילי, אחות מתנדבת בת תשע־עשרה; אנדרטה לצוערים הוקמה בשנות התשעים
    של המאה ה־20. בשעת בין הערביים, כשאורות טביליסי נדלקים באגן שלמטה, רואים על מה הם הגנו.
  tip: >-
    בואו בשעת האור האחרונה של היום, כשהצוק מזהיב והעיר נדלקת למטה, אבל קחו פנס: את הירידה תעשו בחושך.
    השביל קצר אבל סלעי, ובמקומות מסוימים החצץ בו מתדרדר, אז נעלו נעליים מתאימות והחזיקו ילדים קרוב ליד
    המצוקים. בקוג'ורי קריר יותר ויש יותר רוח מאשר בטביליסי, וההבדל מורגש; הביאו שכבת ביגוד נוספת. ליד
    החורבה עצמה אין דבר — לא מים, לא שירותים ולא קיוסק — אז הצטיידו בקוג'ורי. האתר פתוח כל השנה והכניסה
    חופשית.
  route: >-
    ממרכז טביליסי סעו בכביש קוג'ורי, שמתחיל בשם "מעלה מרו מקשווילי" ומתפתל במעלה גבעות מיוערות מעל העיר:
    21 ק"מ, כ־40 דקות, באספלט לכל אורך הדרך. בקוג'ורי המשיכו ברחוב היונקרים (הצוערים) ואחר כך ברחוב אזאולה
    לעבר הצוק בקצה הדרומי של העיירה, וחנו בשולי הדרך במקום שבו מתחיל השביל. משם 15–20 דקות טיפוס ברגל.
    כל רכב בקטגוריית אקונומי יעמוד בדרך; בחורף היזהרו מקרח בעיקולים העליונים ועל השביל עצמו. תדלקו בטביליסי.
ar:
  name: قلعة كوجوري (أزيولا)
  short: >-
    أسوار أغاراني المتهدّمة على صخرة أزيولا فوق كوجوري: مقرّ صيفي للملوك، تقول الحوليات إن الملكة تامار
    ماتت فيه، وساحة معركة عام 1921.
  body: >-
    **ترتفع صخرة أزيولا فوق كوجوري كقبضة من حجر، وعلى مفاصل أصابعها تجثم أسوار أغاراني المحطّمة.**


    على ارتفاع نحو 1350 متراً، فوق نتوء بركاني من سلسلة جبال ترياليتي، كانت القلعة تحرس طريق القوافل من
    سومخيتي إلى تبليسي، وتنتقل من يد إلى يد كقطعة نقد. انتزعها باغرات الرابع من الأمير فضلون في ستينيات
    القرن الحادي عشر؛ واستولى عليها السلاجقة خلال "الغزو التركي الكبير" عام 1080؛ واستعادها داود البنّاء
    في يوم واحد في يوليو/تموز 1118، ثم منحها عام 1123 لإيفانه أوربيلي. وحين ثار النبلاء على جورجي الثالث
    عام 1177 تحصّنوا هنا، فاستولى الملك على أغاراني في العام نفسه.


    وكانت أيضاً مقرّاً صيفياً للملوك. تروي الحوليات أن الملكة تامار حُملت إليها مريضة وفيها توفيت؛ ولا
    يزال مكان دفنها مجهولاً. ومنذ القرن الخامس عشر آلت القلعة إلى أسرة سولوغاشفيلي واتخذت اسم كوجوري.
    وفي أواخر ذلك القرن دكّها رماة البنادق التركمان الذين أرسلهم يعقوب، حاكم آق قويونلو، حتى انسحبت حاميتها
    الصغيرة. وفي القرن السابع عشر جعل الملك روستوم من كوجوري مقرّاً ملكياً صيفياً من جديد. ويُروى أن البطل
    الشعبي كوراوغلو احتمى هنا ذات يوم، ومن هنا اسمها القديم: قلعة كوراوغلو.


    ما بقي اليوم متواضع: جذعا برجين والسور الممتد بينهما، من الحجر الغشيم المرقّع بالطوب، ومعظمه من عمل
    القرون السادس عشر إلى الثامن عشر فوق نواة من القرن الحادي عشر.


    وفي فبراير/شباط 1921 شهدت مرتفعات كوجوري قتالاً عنيفاً ضد الجيش الأحمر الغازي. قاتل هنا طلاب الكلية
    العسكرية الجورجيون في العشرين والحادية والعشرين من أعمارهم، ومعهم لقيت حتفها مارو ماكاشفيلي، الممرضة
    المتطوعة ذات التسعة عشر عاماً؛ وقد أُقيم نُصب لأولئك الطلاب في تسعينيات القرن العشرين. وعند الغسق،
    حين تتلألأ أضواء تبليسي في الحوض أسفلك، ترى ما كانوا يدافعون عنه.
  tip: >-
    تعالَ في الساعة الأخيرة من ضوء النهار، حين تتذهّب الصخرة وتضيء المدينة في الأسفل، لكن احمل مصباحاً
    يدوياً: فستنزل في الظلام. الدرب قصير لكنه صخري وتنزلق حصاه في مواضع، فالبس حذاءً مناسباً وأبقِ الأطفال
    قريبين منك عند الحافات. كوجوري أبرد وأكثر رياحاً من تبليسي بوضوح؛ فاحمل طبقة إضافية من الثياب. لا
    شيء عند الأطلال نفسها، لا ماء ولا دورة مياه ولا كشك، فتزوّد بما تحتاج في كوجوري. الموقع مفتوح طوال
    العام والدخول مجاني.
  route: >-
    من وسط تبليسي خذ طريق كوجوري، الذي يبدأ باسم "مرتقى مارو ماكاشفيلي" ويتلوّى صاعداً عبر تلال مكسوّة
    بالغابات فوق المدينة: 21 كم، نحو 40 دقيقة على الإسفلت طوال الطريق. وفي كوجوري اتبع شارع اليونكر (طلاب
    الكلية العسكرية) ثم شارع أزيولا نحو الصخرة عند الطرف الجنوبي للبلدة، واركن على جانب الطريق حيث يبدأ
    الدرب. ومن هناك صعود سيراً على الأقدام يستغرق 15–20 دقيقة. أي سيارة اقتصادية تقدر على هذا الطريق؛
    وفي الشتاء احذر الجليد في المنعطفات العليا وعلى الدرب نفسه. املأ الخزان في تبليسي.
