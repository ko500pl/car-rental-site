ka:
  name: გუდარეხის მონასტერი
  short: >-
    XIII საუკუნის სამონასტრო კომპლექსი ტრიალეთის ქედის ძირას, საქართველოში ერთ-ერთი უძველესი დათარიღებული
    სამრეკლოთი.
  body: >-
    **გუდარეხი იმ ადგილთაგანია, სადაც ჩვეულებრივ მარტო ხართ.** კომპლექსი თეთრიწყაროს მუნიციპალიტეტში,
    ალგეთის ტყიან ფერდობებსა და ტრიალეთის ქედის ძირას, მდელოზე დგას; მიმდებარე სოფელი პატარაა და ტურისტული
    ინფრასტრუქტურა არ არსებობს.


    მთავარი ტაძარი ღვთისმშობლის მიძინებას ეძღვნება და XIII საუკუნის პირველი ნახევრით თარიღდება — რუსუდან
    მეფის დროით. ის ჩვეულებრივი ზომისაა, კარგად გათლილი ქვით, ორნამენტული სარკმლის ჩარჩოებით; დეკორი შედარებით
    თავშეკავებულია ფიტარეთთან ან წუღრუღაშენთან.


    ყველაზე მნიშვნელოვანი ნაწილი **სამრეკლოა**, რომელიც 1278 წლით არის დათარიღებული წარწერით. ეს საქართველოში
    შემორჩენილთა შორის ერთ-ერთი უადრესი დათარიღებული სამრეკლოა და მნიშვნელოვანია იმისთვის, რომ ქართულ
    არქიტექტურაში სამრეკლო შედარებით გვიან გაჩნდა — ეს ტიპი XIII საუკუნეში ჩნდება და გუდარეხი ამ ცვლილების
    დასაწყისშია.


    ირგვლივ ნანგრევებია: სატრაპეზო, სამეურნეო ნაგებობები, გალავნის ფრაგმენტები, ბალახში ჩამარხული საფლავის
    ქვები. ბევრი აქედან მხოლოდ საძირკვლამდეა შემორჩენილი და მოვლა არათანაბარია. ხედი ჩრდილოეთისკენ იშლება
    — ალგეთის ხეობა და ტყე. ივნისში ველი ყვავილოვანია, ოქტომბერში ტყე ყვითლდება; ზამთარში აქ 1200 მეტრზე
    ცივია და გზა ხშირად თოვლიანია.
  tip: >-
    საათნახევარი საკმარისია. ბოლო კილომეტრები ხრეშია და ღრმა ღარებით; მშრალ ამინდში დაბალი მანქანაც გაივლის
    ფრთხილად, წვიმის შემდეგ SUV სჯობს. ტაძარი ხშირად ღიაა, მაგრამ არა ყოველთვის. ნანგრევებში სიარულისას
    ფრთხილად — ქვები არამდგრადია და ბალახში ორმოებია. ტუალეტი, კაფე და მაღაზია არ არის; ყველაფერი თეთრიწყაროდან
    წამოიღეთ. მობილურის კავშირი სუსტია.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით კოდის გავლით თეთრიწყაროსკენ — დაახლოებით 55 კმ ასფალტით. თეთრიწყაროდან
    დასავლეთით გუდარეხის მიმართულებით გაუხვევთ, კიდევ 11 კმ. სულ 66 კმ, დაახლოებით საათი და ოცდათხუთმეტი
    წუთი. ბოლო მონაკვეთი ვიწრო ასფალტისა და ხრეშის ნაზავია, ადგილ-ადგილ ჩამორეცხილი. საწვავი კოდაში ან
    თეთრიწყაროში აიღეთ. მანქანა მდელოზე, ნანგრევების წინ რჩება.
en:
  name: Gudarekhi Monastery
  short: >-
    A 13th-century monastic complex at the foot of the Trialeti range, with one of the earliest dated
    bell towers in Georgia.
  body: >-
    **Gudarekhi is one of those places where you are usually alone.** The complex stands in Tetritskaro
    municipality on a meadow below the wooded slopes of the Trialeti range. The village beside it is small
    and there is no tourist infrastructure of any kind.


    The main church is dedicated to the Dormition and dates from the first half of the 13th century, the
    reign of Queen Rusudan. It is of ordinary size, built in well-cut stone with ornamented window surrounds;
    the decoration is restrained compared with Pitareti or Tsughrughasheni.


    The most significant element is the **bell tower**, dated by inscription to 1278. It is among the
    earliest dated bell towers surviving in Georgia, and it matters because the free-standing bell tower
    arrived comparatively late in Georgian architecture — the type appears in the 13th century, and Gudarekhi
    stands near the start of that change.


    Around these two buildings lie ruins: a refectory, service buildings, fragments of the enclosure wall,
    and gravestones half sunk in grass. Much of it survives only to foundation level and the upkeep is
    uneven. The view opens north over the Algeti valley and its forest. In June the meadow is full of
    flowers and in October the woods turn; in winter it is cold at 1,200 metres and the road is often
    under snow.
  tip: >-
    An hour and a half is enough. The final kilometres are gravel with deep ruts; in dry weather a low
    car gets through carefully, but after rain an SUV is better. The church is often open, though not
    always. Take care walking through the ruins — stones are loose and there are holes in the grass. No
    toilets, cafe or shop, so bring everything from Tetritskaro. Mobile signal is weak.
  route: >-
    Head southwest from Tbilisi through Koda towards Tetritskaro, about 55 km of asphalt. From Tetritskaro
    turn west towards Gudarekhi for a further 11 km. Sixty-six kilometres in total, roughly an hour and
    thirty-five minutes. The last stretch mixes narrow asphalt and gravel and is washed out in places.
    Refuel in Koda or Tetritskaro. Cars are left on the meadow in front of the ruins.
ru:
  name: Монастырь Гударехи
  short: >-
    Монастырский комплекс XIII века у подножия Триалетского хребта, с одной из древнейших датированных
    колоколен Грузии.
  body: >-
    **Гударехи — из тех мест, где вы обычно один.** Комплекс стоит в Тетрицкаройском муниципалитете на
    лугу под лесистыми склонами Триалетского хребта. Соседнее село невелико, туристической инфраструктуры
    нет никакой.


    Главный храм посвящён Успению и относится к первой половине XIII века, времени царицы Русудан. Он
    обычного размера, сложен из хорошо тёсаного камня, с орнаментированными обрамлениями окон; декор сдержанный
    по сравнению с Питарети или Цугругашени.


    Самая значимая часть — **колокольня**, датированная надписью 1278 годом. Это одна из древнейших сохранившихся
    датированных колоколен Грузии, и она важна потому, что отдельно стоящая звонница появилась в грузинской
    архитектуре сравнительно поздно: тип возникает в XIII веке, и Гударехи стоит у начала этой перемены.


    Вокруг двух построек лежат руины: трапезная, хозяйственные здания, фрагменты ограды, надгробия, наполовину
    ушедшие в траву. Многое сохранилось лишь до уровня фундамента, уход неравномерный. Вид открывается
    на север, на Алгетскую долину и лес. В июне луг в цветах, в октябре желтеет лес; зимой на высоте 1200
    метров холодно, и дорогу часто заносит.
  tip: >-
    Полутора часов достаточно. Последние километры — гравий с глубокой колеёй; в сухую погоду низкая машина
    пройдёт аккуратно, после дождя лучше внедорожник. Храм часто открыт, но не всегда. По руинам ходите
    осторожно: камни шатаются, в траве ямы. Ни туалета, ни кафе, ни магазина — везите всё из Тетрицкаро.
    Связь слабая.
  route: >-
    Из Тбилиси на юго-запад через Кода в сторону Тетрицкаро, около 55 км асфальта. От Тетрицкаро поворот
    на запад к Гударехи, ещё 11 км. Всего 66 км, примерно час тридцать пять. Последний участок — смесь
    узкого асфальта и гравия, местами размытая. Заправляйтесь в Кода или Тетрицкаро. Машины оставляют
    на лугу перед руинами.
fa:
  name: صومعهٔ گودارخی
  short: مجموعه‌ای رهبانی از سدهٔ سیزدهم در پای رشتهٔ تریالتی، با یکی از کهن‌ترین برج‌های ناقوس تاریخ‌دار
    گرجستان.
  body: >-
    **گودارخی از جاهایی است که معمولاً در آن تنهایید.** مجموعه در شهرستان تتریتسکارو بر چمنزاری زیر دامنه‌های
    جنگلی رشتهٔ تریالتی ایستاده است. روستای کنار آن کوچک است و هیچ زیرساخت گردشگری وجود ندارد.


    کلیسای اصلی به خوابیدگی مریم اختصاص دارد و به نیمهٔ نخست سدهٔ سیزدهم، دوران ملکه روسودان، بازمی‌گردد.
    اندازه‌اش معمولی است، از سنگ تراشیدهٔ خوب با قاب‌های آراستهٔ پنجره؛ تزیین آن در سنجش با پیتارتی یا
    تسوغروغاشنی خویشتن‌دار است.


    مهم‌ترین عنصر، **برج ناقوس** است که کتیبه‌ای آن را به سال ۱۲۷۸ تاریخ می‌زند. این از کهن‌ترین برج‌های
    ناقوس تاریخ‌دارِ برجای‌مانده در گرجستان است و اهمیتش از آنجاست که برج ناقوسِ مستقل نسبتاً دیر به معماری
    گرجی راه یافت؛ این گونه در سدهٔ سیزدهم پدیدار می‌شود و گودارخی نزدیک آغاز همان دگرگونی ایستاده است.


    پیرامون این دو بنا ویرانه‌هایی است: تالار غذاخوری، ساختمان‌های خدماتی، پاره‌های دیوار محوطه، و سنگ‌قبرهایی
    نیمه‌فرورفته در علف. بسیاری از آنها تنها تا پیِ خود مانده‌اند و نگهداری یکدست نیست. چشم‌انداز به سوی
    شمال، بر درّهٔ آلگتی و جنگلش، باز می‌شود. در خرداد چمنزار پر از گل است و در مهر جنگل رنگ می‌گیرد؛
    زمستان در ارتفاع ۱۲۰۰ متری سرد است و جاده اغلب زیر برف می‌رود.
  tip: >-
    یک ساعت‌ونیم کافی است. کیلومترهای پایانی شنی با شیارهای عمیق است؛ در هوای خشک خودروی کوتاه با احتیاط
    می‌گذرد، اما پس از باران شاسی‌بلند بهتر است. کلیسا اغلب باز است، هرچند نه همیشه. در ویرانه‌ها با احتیاط
    راه بروید — سنگ‌ها لق‌اند و در علف چاله هست. سرویس بهداشتی، کافه و مغازه نیست، پس همه‌چیز را از تتریتسکارو
    بیاورید. آنتن‌دهی ضعیف است.
  route: >-
    از تفلیس به جنوب‌غرب از کودا به سوی تتریتسکارو بروید، حدود ۵۵ کیلومتر آسفالت. از تتریتسکارو به غرب
    و به سوی گودارخی بپیچید، ۱۱ کیلومتر دیگر. روی‌هم ۶۶ کیلومتر، نزدیک یک ساعت و سی‌وپنج دقیقه. بخش پایانی
    آمیزه‌ای از آسفالت باریک و شن است و جای‌جای شسته شده. سوخت را در کودا یا تتریتسکارو بگیرید. خودروها
    را در چمنزار پیش از ویرانه‌ها می‌گذارند.
he:
  name: מנזר גודארחי
  short: מתחם מנזרי מן המאה ה-13 למרגלות רכס טריאלטי, ובו אחד ממגדלי הפעמונים המתוארכים העתיקים בגאורגיה.
  body: >-
    **גודארחי הוא מן המקומות שבהם בדרך כלל אתם לבד.** המתחם עומד במחוז תטריצקארו על אחו מתחת למדרונות
    המיוערים של רכס טריאלטי. הכפר שלצידו קטן ואין שום תשתית תיירותית.


    הכנסייה המרכזית מוקדשת להירדמות ומתוארכת למחצית הראשונה של המאה ה-13, ימי המלכה רוסודן. גודלה רגיל,
    בנויה אבן גזית מהוקצעת היטב עם מסגרות חלון מעוטרות; העיטור מאופק בהשוואה לפיטארתי או לצוגרוגאשני.


    המרכיב המשמעותי ביותר הוא **מגדל הפעמונים**, המתוארך בכתובת לשנת 1278. הוא מן המגדלים המתוארכים העתיקים
    ששרדו בגאורגיה, וחשיבותו בכך שמגדל הפעמונים העצמאי הגיע לאדריכלות הגאורגית מאוחר יחסית — הטיפוס מופיע
    במאה ה-13, וגודארחי עומד סמוך לראשית השינוי הזה.


    סביב שני המבנים מוטלות חורבות: חדר אוכל, מבני שירות, שברי חומת מתחם ומצבות שקועות למחצה בעשב. חלק
    גדול מהן שרד רק עד גובה היסודות והתחזוקה אינה אחידה. הנוף נפתח צפונה אל עמק אלגטי ויערו. ביוני האחו
    מלא פרחים ובאוקטובר היער מחליף צבע; בחורף קר בגובה 1,200 מטר והדרך לעיתים קרובות מושלגת.
  tip: >-
    שעה וחצי מספיקה. הקילומטרים האחרונים הם חצץ עם תלמים עמוקים; במזג אוויר יבש רכב נמוך עובר בזהירות,
    אך אחרי גשם עדיף רכב שטח. הכנסייה פתוחה לרוב, אך לא תמיד. היזהרו בהליכה בין החורבות — האבנים רופפות
    ובעשב יש בורות. אין שירותים, בית קפה או חנות, לכן הביאו הכול מתטריצקארו. הקליטה חלשה.
  route: >-
    צאו מטביליסי דרום-מערבה דרך קודה לכיוון תטריצקארו, כ-55 ק״מ של אספלט. מתטריצקארו פנו מערבה לגודארחי,
    עוד 11 ק״מ. 66 ק״מ בסך הכול, כשעה ושלושים וחמש. הקטע האחרון מערבב אספלט צר וחצץ והוא שטוף במקומות.
    תדלקו בקודה או בתטריצקארו. את הרכב משאירים על האחו לפני החורבות.
ar:
  name: دير غوداريخي
  short: مجمع رهباني من القرن الثالث عشر عند سفح سلسلة تريالتي، فيه أحد أقدم أبراج الأجراس المؤرخة في
    جورجيا.
  body: >-
    **غوداريخي من الأماكن التي تكون فيها وحدك عادة.** يقوم المجمع في بلدية تيتريتسكارو على مرج أسفل السفوح
    الحرجية لسلسلة تريالتي. والقرية المجاورة صغيرة، ولا توجد بنية سياحية من أي نوع.


    والكنيسة الرئيسية مكرسة لرقاد العذراء وتعود إلى النصف الأول من القرن الثالث عشر، أي عهد الملكة روسودان.
    وهي بحجم عادي، مبنية بحجر منحوت جيد وبأطر نوافذ مزخرفة؛ وزخرفتها متحفظة قياساً ببيتاريتي أو تسوغروغاشيني.


    وأهم عناصر المكان **برج الأجراس**، المؤرخ بنقش إلى سنة 1278. وهو من أقدم أبراج الأجراس المؤرخة الباقية
    في جورجيا، وأهميته أن البرج القائم بذاته دخل العمارة الجورجية متأخراً نسبياً؛ فالنمط يظهر في القرن
    الثالث عشر، وغوداريخي يقف قرب بداية هذا التحول.


    وحول هذين المبنيين أطلال: قاعة طعام، ومبانٍ خدمية، وشظايا من السور، وشواهد قبور نصف غائرة في العشب.
    وكثير منها بقي عند مستوى الأساس فقط، والعناية متفاوتة. وينفتح المنظر شمالاً على وادي ألغيتي وغابته.
    وفي حزيران يمتلئ المرج بالأزهار وفي تشرين الأول تتبدل ألوان الغابة؛ وفي الشتاء يبرد المكان على ارتفاع
    1200 متر وتغطي الثلوج الطريق كثيراً.
  tip: >-
    ساعة ونصف تكفي. والكيلومترات الأخيرة حصى بأخاديد عميقة؛ في الجو الجاف تمرّ سيارة منخفضة بحذر، لكن
    بعد المطر يكون الدفع الرباعي أفضل. والكنيسة مفتوحة غالباً لا دائماً. وانتبه أثناء المشي بين الأطلال
    — فالحجارة غير ثابتة وفي العشب حفر. ولا دورات مياه ولا مقهى ولا متجر، فاحمل كل شيء من تيتريتسكارو.
    والتغطية ضعيفة.
  route: >-
    اتجه جنوب غرب من تبليسي عبر كودا نحو تيتريتسكارو، نحو 55 كم من الإسفلت. ومن تيتريتسكارو انعطف غرباً
    إلى غوداريخي مسافة 11 كم أخرى. ستة وستون كيلومتراً إجمالاً، نحو ساعة وخمس وثلاثين دقيقة. والمقطع الأخير
    مزيج من إسفلت ضيق وحصى وهو منجرف في مواضع. تزوّد بالوقود في كودا أو تيتريتسكارو. وتُترك السيارات على
    المرج أمام الأطلال.
