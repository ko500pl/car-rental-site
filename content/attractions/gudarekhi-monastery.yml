ka:
  name: გუდარეხის მონასტერი
  short: >-
    XIII საუკუნის მონასტერი თეთრიწყაროს ზემოთ, ტყიან გორაზე, სადაც დგას საქართველოში უძველესი დათარიღებული
    სამრეკლო — 1278 წლისა.
  body: >-
    **1278 წელს ქვემო ქართლში, ტყიან გორაზე, სამრეკლოს კედელზე თარიღი ამოკვეთეს — და საქართველოში ამაზე
    ადრინდელი დათარიღებული სამრეკლო აღარსად შემორჩენილა.**


    გუდარეხის მონასტერი თეთრიწყაროდან ჩრდილოეთით დაახლოებით რვა კილომეტრზე, ამავე სახელის სოფლის დასავლეთით
    დგას. მთავარი ტაძარი ღვთისმშობელს ეძღვნება: ეს მოყვითალო, სუფთად გათლილი ქვით ნაგები დარბაზული ეკლესიაა,
    16 მეტრი სიგრძისა და 9,5 მეტრი სიგანისა, ერთადერთი კარით სამხრეთიდან. კარის თავზე შვიდსტრიქონიანი
    ასომთავრული წარწერა ხუროთმოძღვარ ჭიჭაფორისძეს, მანგლელ ეპისკოპოს ანტონსა და „დედოფალთ დედოფალ რუსუდანს“
    იხსენიებს. რომელ რუსუდანზეა საუბარი, დღემდე სადავოა: დიდხანს ფიქრობდნენ, რომ ეს 1223–1245 წლებში მეფე
    რუსუდანია, უახლესი კვლევით კი ის შესაძლოა დემეტრე II-ის ასული იყოს — მაშინ ტაძრის მშენებლობა 1282
    წელზე ადრე ვერ დაიწყებოდა.


    შიგნით ჯერ კიდევ ჩანან გახუნებული მთავარანგელოზები, მიქაელი და გაბრიელი, და მხედარი წმინდანები — გიორგი,
    დემეტრე და თევდორე. XII საუკუნის ჩუქურთმიანი ქვის კანკელის ნაშთები საქართველოს ეროვნულ მუზეუმში გადაიტანეს.
    ტაძრის სამხრეთ-აღმოსავლეთით სამრეკლო აღმართულა: ქვედა სართული ღიაა, ზედა სართული რვათაღიანი სარეკლოა,
    აღმოსავლეთ კედელზე კი წარწერა დემეტრე II-სა და მღვდელ აბრაამს იხსენიებს.


    ირგვლივ, ხეებქვეშ, ნანგრევებია: სასახლე, საჯინიბო, მარანი, სენაკები, კლდეში ნაკვეთი სათავსები. 1643
    წელს თავად მაჰმადიანმა ქართლის მეფე როსტომმა მონასტერი ბარათაშვილთა შტოს, გერმანოზიშვილებს უბოძა,
    და საუკუნეზე მეტ ხანს ის მათი საგვარეულო მონასტერი და სამარხი იყო. 1756 წლისთვის დაკნინდა გვარიც და
    მონასტერიც; ომებმა მიდამო დააცარიელა და ტყემ ყველაფერი დაფარა, სანამ XIX საუკუნის სიძველეთა მკვლევრებმა
    ხელახლა არ მიაგნეს.


    ზარები იცვლებოდა, სამრეკლო კი თავის თარიღს შვიდ საუკუნეზე მეტია ინახავს.
  tip: >-
    საათნახევარი საკმარისია. აქ არც შესასვლელის საფასურია, არც დარაჯი, არც საპირფარეშო, კაფე ან მაღაზია,
    მობილური კავშირიც სუსტია — წყალი და საგზალი თეთრიწყაროდან წამოიღეთ. ტაძარი ხშირად ღიაა, თუმცა არა
    ყოველთვის; შესვლისას ჩაიცვით ისე, როგორც ნებისმიერ ქართულ ეკლესიაში: მხრები და მუხლები დაფარული, ქალებს
    — თავსაფარი. ნანგრევებში ბალახი ფხვიერ ქვებსა და ორმოებს მალავს, ამიტომ მყარი ფეხსაცმელი ჩაიცვით და
    ბავშვებს თვალი ადევნეთ. უმჯობესია მაისიდან ოქტომბრამდე ჩამოხვიდეთ: 1200 მეტრზე ზამთარში ბოლო მონაკვეთს
    თოვლი ფარავს. დილით მოდით, როცა მზე აღმოსავლეთ ფასადის ჩუქურთმას ანათებს.
  route: >-
    თბილისიდან ს6-ით სამხრეთით, მარნეულის მიმართულებით წადით, კოდასთან დასავლეთით შ31-ზე გადაუხვიეთ, შემდეგ
    კი შ34-ით თეთრიწყარომდე იარეთ — დაახლოებით 55 კილომეტრი კარგი ასფალტი. ქალაქიდან მაჩვენებელი გუდარეხისკენ
    მიგიყვანთ, კიდევ დაახლოებით 11 კილომეტრი: გზა ვიწროვდება, ასფალტი ხრეშში გადადის, ადგილ-ადგილ ღარებითა
    და ჩამორეცხილი ნაპირებით. სულ დაახლოებით 66 კილომეტრი და საათი და ოცდათხუთმეტი წუთი. აიღეთ SUV: მშრალ
    ზაფხულში სედანიც შეიძლება გაძვრეს, მაგრამ წვიმის შემდეგ ბოლო მონაკვეთი დაბალი კლირენსისთვის არ არის.
    საწვავი თბილისში ან თეთრიწყაროში ჩაასხით — მერე აღარაფერია. მანქანა გზის ბოლოს დატოვეთ და მონასტრამდე
    ფეხით ადით.
en:
  name: Gudarekhi Monastery
  short: >-
    A 13th-century monastery on a wooded hill above Tetritskaro, with the oldest dated bell tower in Georgia,
    finished in 1278.
  body: >-
    **In 1278 a date was cut into the wall of a bell tower on a wooded hill in Kvemo Kartli, and no older
    dated bell tower survives anywhere in Georgia.**


    Gudarekhi stands west of the village of the same name, some eight kilometres north of Tetritskaro.
    The main church, dedicated to the Mother of God, is a plain hall of smoothly hewn yellowish stone,
    16 by 9.5 metres, with a single door on the south. Over that door a seven-line inscription in medieval
    asomtavruli script names the architect Chichaporisdze, Bishop Anton of Manglisi and a "Queen of Queens
    Rusudan". Which Rusudan is still argued over: long read as the queen who reigned from 1223 to 1245,
    she may instead have been a daughter of Demetrius II, which would mean building began no earlier than
    1282.


    Inside, faded archangels Michael and Gabriel and the warrior saints George, Demetrius and Theodore
    still hold the walls; the fragments of a carved 12th-century stone altar screen have gone to the Georgian
    National Museum. South-east of the church rises the bell tower: an open lower storey and, above it,
    a gallery of eight arches, with an inscription on its east wall commemorating Demetrius II and the
    priest Abraham.


    Around them, under the trees, lie the ruins of a palace, stables, a wine cellar, monks' cells and
    rooms cut into the rock. In 1643 King Rostom of Kartli, himself a Muslim, gave the monastery to the
    Germanozishvili, a branch of the Baratashvili princes, and for more than a century it was their family
    abbey and burial ground. By 1756 family and monastery had both declined; war emptied the district,
    and the forest closed in until 19th-century antiquarians came looking.


    Bells have come and gone; the tower has kept its date for more than seven centuries.
  tip: >-
    An hour and a half is enough. There is no fee, no guard and nothing else: no toilets, café or shop,
    and only a weak mobile signal, so bring water and food from Tetritskaro. The church is often, but
    not always, open; if you go in, dress as for any Georgian church, with shoulders and knees covered
    and a headscarf for women. The grass among the ruins hides loose stones and holes, so wear proper
    boots and keep children close. May to October is the easy season; at 1,200 metres winter brings snow
    to the last stretch. Come in the morning, when the sun falls on the carved east façade.
  route: >-
    Leave Tbilisi south on the S6 towards Marneuli, turn west at Koda onto the Sh31, then take the Sh34
    to Tetritskaro: about 55 km of good asphalt. From the town a signed road runs on to Gudarekhi, roughly
    11 km more, narrowing from asphalt to gravel with ruts and washouts. That makes about 66 km and an
    hour and thirty-five minutes. Take an SUV: a saloon may scrape through in a dry summer week, but after
    rain the final stretch is no place for low clearance. Refuel in Tbilisi or Tetritskaro, as there is
    nothing beyond. Leave the car where the road ends and walk up to the monastery.
ru:
  name: Монастырь Гударехи
  short: >-
    Монастырь XIII века на лесистом холме над Тетрицкаро, а при нём древнейшая датированная колокольня
    Грузии, достроенная в 1278 году.
  body: >-
    **В 1278 году на стене колокольни, стоящей на лесистом холме в Квемо-Картли, высекли дату — и ни одной
    более древней датированной колокольни в Грузии не сохранилось.**


    Гударехи стоит к западу от одноимённого села, километрах в восьми к северу от Тетрицкаро. Главная
    церковь, посвящённая Богородице, — простой зал из гладко отёсанного желтоватого камня, 16 на 9,5 метра,
    с единственной дверью на юге. Над этой дверью семистрочная надпись средневековым шрифтом асомтаврули
    называет зодчего Чичапорисдзе, епископа Манглисского Антона и «царицу цариц Русудан». Какую именно
    Русудан — спорят до сих пор: долго считалось, что речь о царице, правившей в 1223–1245 годах, но,
    возможно, это дочь Деметре II, и тогда строительство началось не раньше 1282 года.


    Внутри на стенах всё ещё держатся поблёкшие архангелы Михаил и Гавриил и святые воины Георгий, Димитрий
    и Феодор; фрагменты резной каменной алтарной преграды XII века увезены в Национальный музей Грузии.
    К юго-востоку от церкви поднимается колокольня: открытый нижний ярус, над ним галерея из восьми арок,
    а на восточной стене — надпись в память Деметре II и священника Авраама.


    Вокруг, под деревьями, лежат руины дворца, конюшен, винного погреба, монашеских келий и вырубленных
    в скале помещений. В 1643 году картлийский царь Ростом, сам мусульманин, передал монастырь Германозишвили,
    ветви князей Бараташвили, и больше века он оставался их родовой обителью и усыпальницей. К 1756 году
    пришли в упадок и род, и монастырь; война опустошила округу, и лес сомкнулся над руинами, пока в XIX
    веке сюда не добрались любители древностей.


    Колокола приходили и уходили, а башня хранит свою дату уже больше семи столетий.
  tip: >-
    Полутора часов хватит. Платы за вход нет, сторожа нет — и вообще ничего нет: ни туалетов, ни кафе,
    ни магазина, а мобильная связь слабая, так что воду и еду везите из Тетрицкаро. Церковь часто, но
    не всегда открыта; если заходите внутрь, одевайтесь как для любого грузинского храма: плечи и колени
    закрыты, женщинам — платок. Трава среди руин прячет шаткие камни и ямы, поэтому наденьте крепкие ботинки
    и держите детей рядом. Удобный сезон — с мая по октябрь; на высоте 1200 метров зимой последний участок
    заметает снегом. Приезжайте утром, когда солнце ложится на резной восточный фасад.
  route: >-
    Выезжайте из Тбилиси на юг по S6 в сторону Марнеули, у Коды сверните на запад, на Sh31, а затем по
    Sh34 доезжайте до Тетрицкаро: около 55 км хорошего асфальта. От городка к Гударехи ведёт дорога с
    указателями — ещё примерно 11 км; она сужается, и асфальт сменяется гравием с колеями и промоинами.
    Всего выходит около 66 км и час тридцать пять минут. Берите кроссовер (SUV): седан, может, и проскребёт
    в сухую летнюю неделю, но после дождя на последнем участке низкому клиренсу делать нечего. Заправьтесь
    в Тбилиси или Тетрицкаро — дальше заправок нет. Оставьте машину там, где кончается дорога, и поднимитесь
    к монастырю пешком.
fa:
  name: صومعهٔ گودارخی
  short: >-
    صومعه‌ای از سدهٔ سیزدهم بر تپه‌ای جنگلی بالای تتریتسکارو، با کهن‌ترین برج ناقوسِ تاریخ‌دارِ گرجستان
    که در ۱۲۷۸ به پایان رسید.
  body: >-
    **در سال ۱۲۷۸ تاریخی بر دیوار برج ناقوسی بر تپه‌ای جنگلی در کوِمو کارتلی کنده شد، و در هیچ جای گرجستان
    برج ناقوسِ تاریخ‌داری کهن‌تر از آن باقی نمانده است.**


    گودارخی در غرب روستایی به همین نام، حدود هشت کیلومتری شمال تتریتسکارو، برپاست. کلیسای اصلی، که به
    مریم، مادر خدا، تقدیم شده، تالاری ساده از سنگ تراش‌خوردهٔ صاف و مایل به زرد است، ۱۶ در ۹٫۵ متر، با
    تنها یک در در ضلع جنوبی. بر سر همین در، کتیبه‌ای هفت‌سطری به خط آسومتاورولیِ سده‌های میانه از معمار
    بنا، چیچاپوریسدزه، از آنتون، اسقف مانگلیسی، و از «ملکهٔ ملکه‌ها روسودان» نام می‌برد. اینکه کدام روسودان،
    هنوز محل بحث است: زمانی دراز او را همان ملکه‌ای می‌دانستند که از ۱۲۲۳ تا ۱۲۴۵ فرمان راند، اما شاید
    دختر دمتره دوم بوده باشد، و در این صورت ساخت بنا زودتر از ۱۲۸۲ آغاز نشده است.


    درون کلیسا، فرشتگان مقرب میکائیل و جبرئیل و قدیسان جنگاور، گئورگیوس و دیمیتریوس و تئودوروس، رنگ‌باخته
    اما هنوز بر دیوارها ایستاده‌اند؛ پاره‌های دیوارهٔ سنگیِ کنده‌کاری‌شدهٔ محراب از سدهٔ دوازدهم به موزهٔ
    ملی گرجستان برده شده است. در جنوب شرقی کلیسا برج ناقوس سر برمی‌آورد: طبقهٔ زیرینی باز، بر فراز آن
    رواقی با هشت طاق، و بر دیوار شرقی‌اش کتیبه‌ای در بزرگداشت دمتره دوم و کشیش آبراهام.


    گرداگردشان، زیر درختان، ویرانه‌های کاخ، اصطبل‌ها، سرداب شراب، حجره‌های راهبان و اتاق‌هایی کنده در
    دل صخره افتاده است. در سال ۱۶۴۳ رستم، پادشاه کارتلی، که خود مسلمان بود، صومعه را به خاندان گرمانوزیشویلی،
    شاخه‌ای از شاهزادگان باراتاشویلی، بخشید و بیش از یک سده اینجا صومعهٔ خانوادگی و آرامگاه آنان بود.
    تا ۱۷۵۶ هم خاندان و هم صومعه رو به زوال رفته بودند؛ جنگ این ناحیه را از مردم خالی کرد و جنگل بر همه‌چیز
    پنجه انداخت، تا آنکه در سدهٔ نوزدهم دوستداران آثار کهن به جست‌وجویش آمدند.


    ناقوس‌ها آمدند و رفتند؛ برج بیش از هفت سده است که تاریخ خود را نگه داشته.
  tip: >-
    یک ساعت و نیم بس است. نه ورودیه‌ای هست، نه نگهبانی و نه هیچ چیز دیگر: نه سرویس بهداشتی، نه کافه و
    نه مغازه، و آنتن موبایل هم ضعیف است؛ پس آب و خوراک را از تتریتسکارو همراه بیاورید. کلیسا اغلب باز
    است، اما نه همیشه؛ اگر به درون می‌روید، همان‌گونه بپوشید که برای هر کلیسای گرجی: شانه‌ها و زانوها
    پوشیده و روسری برای بانوان. علف‌های میان ویرانه‌ها سنگ‌های لق و چاله‌ها را پنهان می‌کنند، پس پوتین
    مناسب به پا کنید و کودکان را نزدیک خود نگه دارید. فصل آسان از ماه مه تا اکتبر است؛ در ارتفاع ۱۲۰۰
    متری، زمستان تکهٔ پایانی راه را زیر برف می‌برد. صبح بیایید، وقتی آفتاب بر نمای شرقیِ کنده‌کاری‌شده
    می‌تابد.
  route: >-
    از تفلیس با جادهٔ S6 رو به جنوب و به سوی مارنئولی بروید، در کودا به غرب و به جادهٔ Sh31 بپیچید و سپس
    از جادهٔ Sh34 تا تتریتسکارو برانید: حدود ۵۵ کیلومتر آسفالت خوب. از شهر، جاده‌ای تابلودار حدود ۱۱ کیلومتر
    دیگر تا گودارخی ادامه می‌یابد؛ باریک می‌شود و آسفالتش جای خود را به شنی پر از شیار و آب‌بردگی می‌دهد.
    روی‌هم حدود ۶۶ کیلومتر و یک ساعت و سی‌وپنج دقیقه. خودروی شاسی‌بلند (SUV) بگیرید: سواری معمولی شاید
    در هفته‌ای خشک از تابستان به‌زحمت بگذرد، اما پس از باران، تکهٔ پایانی جای خودروی کم‌ارتفاع نیست. در
    تفلیس یا تتریتسکارو سوخت بگیرید، چون پس از آن هیچ جایگاهی نیست. خودرو را همان‌جا که جاده تمام می‌شود
    بگذارید و پیاده تا صومعه بالا بروید.
he:
  name: מנזר גודארחי
  short: מנזר מן המאה ה-13 על גבעה מיוערת מעל טטריצקרו, ובו מגדל הפעמונים המתוארך העתיק ביותר בגאורגיה,
    שהושלם ב-1278.
  body: >-
    **ב-1278 נחצב תאריך בקירו של מגדל פעמונים על גבעה מיוערת בקוומו קרתלי, ובכל גאורגיה לא שרד מגדל פעמונים
    מתוארך עתיק ממנו.**


    גודארחי עומד ממערב לכפר הנושא אותו שם, כשמונה קילומטרים צפונית לטטריצקרו. הכנסייה הראשית, המוקדשת
    לאם האלוהים, היא אולם פשוט מאבן צהבהבה מסותתת בקפידה, 16 על 9.5 מטרים, ובו דלת אחת בלבד, בצד הדרומי.
    מעל הדלת הזאת כתובת בת שבע שורות בכתב האסומטברולי של ימי הביניים מזכירה את האדריכל צ'יצ'פוריסדזה,
    את הבישוף אנטון ממאנגליסי ואת "מלכת המלכות רוסודן". על השאלה איזו רוסודן זו, עדיין מתווכחים: זמן רב
    סברו שזו המלכה ששלטה בשנים 1223–1245, אבל ייתכן שהייתה זו בתו של דמטרה השני, ואז הבנייה החלה לא לפני
    1282.


    בפנים עדיין נאחזים בקירות, דהויים, המלאכים מיכאל וגבריאל והקדושים הלוחמים גאורגיוס, דמטריוס ותאודורוס;
    שברי מחיצת המזבח מאבן מגולפת, מן המאה ה-12, הועברו למוזיאון הלאומי של גאורגיה. מדרום-מזרח לכנסייה
    מתנשא מגדל הפעמונים: קומה תחתונה פתוחה, מעליה אכסדרה של שמונה קשתות, ועל קירו המזרחי כתובת לזכר דמטרה
    השני והכומר אברהם.


    סביבם, בצל העצים, פזורות חורבות של ארמון, אורוות, מרתף יין, תאי נזירים וחדרים חצובים בסלע. ב-1643
    העניק רוסטום מלך קרתלי, שהיה בעצמו מוסלמי, את המנזר למשפחת גרמנוזישווילי, ענף של בית הנסיכים ברטשווילי,
    ויותר ממאה שנה היה המקום מנזר המשפחה ובית הקברות שלה. עד 1756 שקעו גם המשפחה וגם המנזר; המלחמה רוקנה
    את הסביבה מיושביה, והיער סגר על הכול, עד שבמאה ה-19 באו חובבי עתיקות לחפש את המקום.


    פעמונים באו והלכו; המגדל שומר על התאריך שלו כבר יותר משבע מאות שנה.
  tip: >-
    שעה וחצי מספיקה. אין דמי כניסה, אין שומר, ואין שום דבר אחר: לא שירותים, לא בית קפה ולא חנות, והקליטה
    הסלולרית חלשה, אז הביאו מים ואוכל מטטריצקרו. הכנסייה פתוחה לעיתים קרובות, אך לא תמיד; אם אתם נכנסים,
    התלבשו כמו לכל כנסייה גאורגית: כתפיים וברכיים מכוסות, ולנשים – כיסוי ראש. העשב בין החורבות מסתיר אבנים
    רופפות ובורות, לכן נעלו נעלי הליכה יציבות ושמרו על הילדים קרוב. העונה הנוחה היא מאי עד אוקטובר; בגובה
    1,200 מטרים החורף מכסה בשלג את הקטע האחרון. בואו בבוקר, כשהשמש מאירה את החזית המזרחית המגולפת.
  route: >-
    צאו מטביליסי דרומה בכביש S6 לכיוון מרנאולי, בקודה פנו מערבה לכביש Sh31, ואחר כך המשיכו בכביש Sh34
    עד טטריצקרו: כ-55 ק״מ של אספלט טוב. מן העיירה ממשיכה דרך מסומנת לגודארחי, עוד כ-11 ק״מ; היא הולכת
    ומצטמצמת, והאספלט מתחלף בחצץ עם תלמים ובורות שחצבו המים. בסך הכול כ-66 ק״מ ושעה ושלושים וחמש דקות.
    קחו רכב SUV: מכונית סדאן אולי תעבור בקושי בשבוע קיצי יבש, אבל אחרי גשם הקטע האחרון אינו מקום לרכב
    נמוך. תדלקו בטביליסי או בטטריצקרו, כי מעבר להן אין דבר. השאירו את הרכב במקום שבו הדרך נגמרת, ועלו
    ברגל אל המנזר.
ar:
  name: دير غوداريخي
  short: دير من القرن الثالث عشر على تلة مشجرة فوق تيتريتسكارو، وفيه أقدم برج أجراس مؤرَّخ في جورجيا،
    اكتمل عام 1278.
  body: >-
    **في عام 1278 نُقش تاريخٌ على جدار برج أجراس فوق تلة مشجرة في كفيمو كارتلي، ولم يبقَ في جورجيا كلها
    برج أجراس مؤرَّخ أقدم منه.**


    يقوم غوداريخي غربَ القرية التي تحمل الاسم نفسه، على نحو ثمانية كيلومترات شمال تيتريتسكارو. والكنيسة
    الرئيسية، المكرَّسة لوالدة الإله، قاعة بسيطة من حجر مائل إلى الصفرة أُحكم نحته وتسويته، طولها 16 متراً
    وعرضها 9.5 أمتار، ولها باب واحد في الجهة الجنوبية. وفوق هذا الباب نقش من سبعة أسطر بخط الأسومتافرولي
    الجورجي الوسيط يذكر المعماري تشيتشابوريسدزه، وأسقف مانغليسي أنطون، و«ملكة الملكات روسودان». أما أيّ
    روسودان هي، فما زال موضع جدل: فقد ظُنّ طويلاً أنها الملكة التي حكمت بين 1223 و1245، لكنها ربما كانت
    ابنة ديميتري الثاني، وعندئذ لا يكون البناء قد بدأ قبل عام 1282.


    وفي الداخل ما زال على الجدران، وقد بهتت ألوانهم، رئيسا الملائكة ميخائيل وجبرائيل والقديسون المحاربون
    جاورجيوس وديمتريوس وثيودوروس؛ أما قطع حاجز المذبح الحجري المنحوت من القرن الثاني عشر فقد نُقلت إلى
    المتحف الوطني الجورجي. وإلى الجنوب الشرقي من الكنيسة ينتصب برج الأجراس: طابق سفلي مفتوح، وفوقه رواق
    من ثمانية أقواس، وعلى جداره الشرقي نقش يخلّد ذكرى ديميتري الثاني والكاهن إبراهيم.


    ومن حولهما، تحت الأشجار، تتناثر أطلال قصر وإسطبلات وقبو للنبيذ وقلالي للرهبان وغرف منحوتة في الصخر.
    وفي عام 1643 وهب رستم ملك كارتلي، وكان هو نفسه مسلماً، الديرَ لآل غيرمانوزيشفيلي، وهم فرع من أمراء
    باراتاشفيلي، فظل أكثر من قرن ديرَ الأسرة ومدفنها. وبحلول عام 1756 كانت الأسرة والدير قد انحدرا معاً؛
    ثم أفرغت الحرب المنطقة من أهلها، وأطبقت الغابة على المكان حتى جاءه هواة الآثار باحثين عنه في القرن
    التاسع عشر.


    جاءت الأجراس وذهبت، والبرج يحفظ تاريخه منذ أكثر من سبعة قرون.
  tip: >-
    تكفي ساعة ونصف. لا رسوم دخول ولا حارس ولا أي شيء آخر: لا دورات مياه ولا مقهى ولا متجر، وإشارة الهاتف
    ضعيفة، فأحضِر الماء والطعام من تيتريتسكارو. والكنيسة مفتوحة في الغالب لا دائماً؛ فإن دخلتها فالبس
    كما تلبس لأي كنيسة جورجية: الكتفان والركبتان مستورتان، وغطاء للرأس للنساء. والعشب بين الأطلال يخفي
    حجارة متقلقلة وحفراً، فانتعل حذاءً متيناً للمشي وأبقِ الأطفال قريبين منك. الموسم الميسَّر من مايو
    إلى أكتوبر؛ وعلى ارتفاع 1200 متر يكسو الثلج المقطع الأخير في الشتاء. تعالَ صباحاً، حين تسقط الشمس
    على الواجهة الشرقية المنحوتة.
  route: >-
    اخرج من تبليسي جنوباً على الطريق S6 باتجاه مارنئولي، وانعطف غرباً عند كودا إلى الطريق Sh31، ثم خذ
    الطريق Sh34 حتى تيتريتسكارو: نحو 55 كيلومتراً من الإسفلت الجيد. ومن البلدة تمضي طريق عليها لافتات
    إلى غوداريخي، نحو 11 كيلومتراً أخرى، تضيق شيئاً فشيئاً ويتحول إسفلتها إلى حصى تحفره أخاديد العجلات
    وتجرفه السيول. فالمجموع نحو 66 كيلومتراً وساعة وخمس وثلاثون دقيقة. استأجر سيارة SUV: قد تمرّ سيارة
    صالون بشقّ الأنفس في أسبوع صيفي جاف، لكن المقطع الأخير بعد المطر ليس مكاناً للسيارات المنخفضة. تزوَّد
    بالوقود في تبليسي أو تيتريتسكارو، فلا شيء بعدهما. اترك السيارة حيث تنتهي الطريق واصعد إلى الدير سيراً
    على الأقدام.
