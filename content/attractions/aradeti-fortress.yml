ka:
  name: არადეთის ციხე
  short: >-
    ფრონის პირას აღმართული კოშკებიანი ციხე-დარბაზი, რომელიც 1666 წელს დედოფალ მარიამის დაკვეთით აგებულ
    ეკლესიას გარს ერტყმის.
  body: >-
    **1666 წელს დედოფალმა ფრონის პირას პატარა ეკლესიის კედელზე თავისი სახელი ამოაკვეთინა — და ქვა მას
    დღემდე ინახავს.**


    წმინდა საბას ეკლესიის სამხრეთ ფასადზე ასომთავრული წარწერა გვამცნობს, რომ ტაძარი იმ წელს დადიანის ასულის,
    დედოფალ მარიამის დაკვეთით აიგო. ეკლესიის ირგვლივ ციხე-დარბაზი აღიმართა — გალავნითა და კოშკებით შემოზღუდული
    ფეოდალის რეზიდენცია, რომელიც, შესაძლოა, ისტორიული ტაოდან მომდინარე დიდგვაროვან საგვარეულოს — იშხნელებს
    ეკუთვნოდა. ქართველი მკვლევრები გალავანს XVII საუკუნის შუა წლებით ათარიღებენ, სხვა მოსაზრებით კი იგი
    უფრო გვიან, XVIII საუკუნეში, ლეკიანობისგან თავდასაცავად შემოავლეს. ასეა თუ ისე, ეს სახლი იმ ხალხმა
    აიშენა, ვინც თავდასხმას ელოდა.


    გალავანი გეგმით კვადრატს უახლოვდება — დაახლოებით 40 × 40 მეტრი, კედლის სისქე 1,2 მეტრი. აღმოსავლეთის
    კედელი ოთხი კოშკითურთ შემორჩა. სამხრეთ კუთხის ცილინდრული კოშკი ოთხსართულიანია: ქვედა სამი სართული
    საცხოვრებელიც იყო და საბრძოლოც, ზედა კი ღია საბრძოლო ბანია, რომლის კედლებშიც ნისკარტა სალოდეები და
    ერთი საზარბაზნეა დატანებული. ეკლესია (9,35 × 5 მ) დღეს შეთეთრებულია, მაგრამ კამარიდან ქრისტეს ფრესკის
    ფრაგმენტი ჯერაც იყურება.


    სახელი კოშკებზე ძველია. 1483 წლის აგვისტოში სამცხის ათაბაგმა ყვარყვარე II ჯაყელმა არადეთთან სამეფო
    ლაშქარი დაამარცხა — ეს იყო ერთ-ერთი დარტყმა, რომლის შემდეგაც ერთიანი საქართველოს სამეფო ცალკეულ სამეფოებად
    და სამთავროებად დაიშალა. აქ იმ ბრძოლას არაფერი გაგახსენებთ: ციხე თითქმის ორი საუკუნით გვიან აშენდა.


    აღმოსავლეთის კოშკი 1960 წელს დააკონსერვეს, მთელი კომპლექსი კი 2020 წელს აღადგინეს, ამიტომ აქ ძველი
    წყობა და ფრთხილი შეკეთება გვერდიგვერდ დგას. ნაშუადღევს მოდით, როცა მზე სამხრეთ კედელს მოადგება და
    დედოფლის წარწერის ყოველ ასოს თავისი პატარა ჩრდილი გაუჩნდება.
  tip: >-
    შესვლა უფასოა; აქ არც მცველი დაგხვდებათ და არც კაფე. წყალი თან იქონიეთ, დანარჩენი კი რამდენიმე კილომეტრში,
    ქარელში შეიძინეთ. ბოლო რამდენიმე ასეული მეტრი გრუნტის გზაა, ეზო — უსწორმასწორო, ამიტომ მყარი ფეხსაცმელი
    ჩაიცვით და ჩამონგრეული კედლების თავზე ნუ აძვრებით: გალავნის ნაწილი ჯერაც ნანგრევია. თუ ეკლესია ღიაა,
    მხრები და მუხლები დაიფარეთ, ქალები ჩვეულებრივ თავსაფარს იკეთებენ. ერთი საათი სავსებით საკმარისია.
    საუკეთესო დრო ნაშუადღევია, როცა მზე სამხრეთ ფასადსა და წარწერას ანათებს. ნახევარდღიანი მარშრუტისთვის
    ურბნისის ტაძარი ან ყინწვისის მონასტერიც დაუმატეთ.
  route: >-
    104 კმ, დაახლოებით 1 საათი და 30 წუთი. თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ გაემართეთ, მცხეთისა
    და გორის გავლით, და დაახლოებით 100 კილომეტრის შემდეგ ქარელთან ჩამოუხვიეთ. ქალაქში შესვლა საჭირო არ
    არის: გასასვლელთან, წრიული გზაჯვარედინიდან შ203 გზას (ქარელი — აგარა) დასავლეთით დაახლოებით 2,5 კილომეტრი
    გაჰყევით, შემდეგ მარჯვნივ შეუხვიეთ და ნახევარი კილომეტრი ჩრდილოეთით იარეთ არადეთამდე; ციხე სოფელშივე,
    მდინარე ფრონის მარჯვენა ნაპირზე დგას. სოფლამდე ასფალტია, შემდეგ კედლებამდე რამდენიმე ასეული მეტრი
    გრუნტის გზაა. მშრალ ამინდში ეკონომ-კლასის ნებისმიერი მანქანა გაივლის, წვიმის შემდეგ ნელა იარეთ. საწვავი
    ს1-ზეც ბევრია და ქარელშიც.
en:
  name: Aradeti Fortress
  short: >-
    A towered fortress-hall on the Prone river, wrapped around the church Queen Mariam built in 1666,
    a short hop off the motorway at Kareli.
  body: >-
    **In 1666 a queen had her name cut into the wall of a small church above the Prone river, and the
    stone has kept it ever since.**


    An Asomtavruli inscription on the south façade of the Church of St Saba records that it was built
    that year at the order of Queen Mariam, born a Dadiani of Samegrelo. Around it rose a fortress-hall,
    a lord's residence behind walls and towers, possibly held by the Ishkhneli, a noble family from historic
    Tao. Georgian scholars date the walls to the mid-17th century; another view holds that they came later,
    in the 18th, as a defence against Lezgin raids. Either way, this was a home built by people who expected
    to be attacked.


    The enclosure is nearly square, about 40 by 40 metres, with walls 1.2 metres thick. The east side
    survives with four towers. The round one in the south corner rises four storeys: three for living
    and fighting, and on top an open fighting platform whose parapet carries machicolations and a single
    cannon port. The church itself (9.35 × 5 m) is whitewashed now, but a fragment of Christ still looks
    down from the vault.


    The name is older than the towers. In August 1483 Qvarqvare II Jaqeli, atabeg of Samtskhe, routed
    a royal army at Aradeti, one of the blows that broke the united Kingdom of Georgia into rival kingdoms
    and principalities. Nothing here recalls it: the fortress came almost two centuries later.


    The east tower was conserved in 1960 and the whole complex restored in 2020, so old masonry and careful
    repair stand side by side. Come in the afternoon, when the sun swings onto the south wall and every
    letter of the queen's inscription grows its own small shadow.
  tip: >-
    There is no fee, no guard and no café: bring water, and buy anything else in Kareli, a few kilometres
    away. The last few hundred metres are on dirt and the courtyard is uneven, so wear shoes with grip
    and stay off crumbling wall-tops, as part of the circuit is still ruin. If the church is open, cover
    shoulders and knees; women usually cover their hair. An hour is plenty. The afternoon is best, when
    light falls on the south façade and its inscription. For a half-day in Kareli country, add Urbnisi
    Cathedral or Kintsvisi Monastery.
  route: >-
    104 km, about 1 hour 30 minutes. Leave Tbilisi west on the S1 (E60) motorway past Mtskheta and Gori,
    and after about 100 km take the Kareli exit. You need not enter the town: at the roundabout by the
    exit join the Sh203 (Kareli–Agara) west for about 2.5 km, then turn right and drive half a kilometre
    north into Aradeti; the fortress stands in the village, on the right bank of the Prone. Asphalt runs
    to the village, then a few hundred metres of dirt to the walls. Any economy car manages it in dry
    weather; after rain, take it slowly. Fuel is plentiful on the S1 and in Kareli.
ru:
  name: Крепость Арадети
  short: >-
    Укреплённый дворец с башнями над рекой Проне, обнимающий церковь, которую царица Мариам построила
    в 1666 году; в двух шагах от трассы у Карели.
  body: >-
    **В 1666 году царица велела высечь своё имя на стене маленькой церкви над рекой Проне, и камень хранит
    его до сих пор.**


    Надпись асомтаврули на южном фасаде церкви Святого Саввы сообщает, что храм построен в тот год по
    велению царицы Мариам, урождённой Дадиани из Самегрело. Вокруг вырос укреплённый дворец — жилище феодала
    за стенами и башнями; возможно, он принадлежал Ишхнели — знатной семье из исторического Тао. Грузинские
    учёные датируют стены серединой XVII века; по другой версии, они появились позже, в XVIII веке, для
    защиты от набегов лезгин. Так или иначе, это был дом, построенный людьми, которые ждали нападения.


    Ограда почти квадратная, примерно 40 на 40 метров, со стенами толщиной 1,2 метра. Восточная сторона
    сохранилась вместе с четырьмя башнями. Круглая башня в южном углу поднимается на четыре этажа: три
    — для жизни и обороны, а наверху — открытая боевая площадка, в парапете которой устроены машикули
    и одна пушечная бойница. Сама церковь (9,35 × 5 м) сегодня побелена, но с её свода всё ещё смотрит
    вниз фрагмент образа Христа.


    Название старше башен. В августе 1483 года Кваркваре II Джакели, атабег Самцхе, разгромил при Арадети
    царское войско — это был один из ударов, расколовших единое Грузинское царство на соперничающие царства
    и княжества. Здесь ничто о том не напоминает: крепость появилась почти два века спустя.


    Восточную башню законсервировали в 1960 году, а весь комплекс отреставрировали в 2020-м, так что старая
    кладка и бережный ремонт стоят здесь бок о бок. Приезжайте после полудня, когда солнце поворачивает
    на южную стену и каждая буква царицыной надписи отбрасывает собственную маленькую тень.
  tip: >-
    Ни платы, ни сторожа, ни кафе: возьмите воду, а всё остальное купите в Карели, в нескольких километрах
    отсюда. Последние несколько сотен метров — грунтовка, двор неровный, поэтому нужна обувь с цепкой
    подошвой; не вставайте на осыпающиеся гребни стен — часть ограды всё ещё в руинах. Если церковь открыта,
    закройте плечи и колени; женщины обычно покрывают голову. Часа вполне достаточно. Лучшее время — после
    полудня, когда свет ложится на южный фасад и надпись. Чтобы провести полдня в окрестностях Карели,
    добавьте Урбнисский собор или монастырь Кинцвиси.
  route: >-
    104 км, около 1 часа 30 минут. Выезжайте из Тбилиси на запад по автомагистрали S1 (E60) мимо Мцхеты
    и Гори и примерно через 100 км сверните на Карели. В сам город заезжать не нужно: на кольце у съезда
    выезжайте на Sh203 (Карели — Агара), двигайтесь по ней на запад около 2,5 км, затем поверните направо
    и через полкилометра к северу окажетесь в Арадети; крепость стоит в самом селе, на правом берегу Проне.
    Асфальт доходит до села, дальше — несколько сотен метров грунтовки до стен. В сухую погоду справится
    любая машина эконом-класса; после дождя езжайте медленно. Заправок хватает и на S1, и в Карели.
fa:
  name: قلعهٔ آرادتی
  short: >-
    قلعه‌کاخی برج‌دار کنار رود پرونه که کلیسای ساختهٔ ملکه مریم در ۱۶۶۶ را در بر گرفته است؛ چند قدم دورتر
    از بزرگراه در نزدیکی کارلی.
  body: >-
    **در ۱۶۶۶ ملکه‌ای فرمان داد نامش را بر دیوار کلیسایی کوچک بالای رود پرونه بکنند، و سنگ از آن روز تاکنون
    نگهش داشته است.**


    کتیبه‌ای به خط آسومتاورولی بر نمای جنوبی کلیسای قدیس سابا گواهی می‌دهد که این کلیسا در همان سال به
    فرمان ملکه مریم ساخته شد، که از خاندان دادیانیِ سامگرلو زاده شده بود. پیرامون آن قلعه‌کاخی برپا شد،
    اقامتگاه اربابی پشت دیوارها و برج‌ها، که شاید از آنِ ایشخنلی‌ها بوده است، خاندانی اشرافی از تائوی
    تاریخی. پژوهشگران گرجی دیوارها را از میانهٔ سدهٔ هفدهم می‌دانند؛ به روایتی دیگر، آن‌ها متأخرترند و
    در سدهٔ هجدهم برای دفاع در برابر تاخت‌وتاز لزگی‌ها ساخته شده‌اند. به هر روی، این خانه‌ای بود که مردمانی
    ساختند که انتظار حمله داشتند.


    حصار تقریباً مربع است، حدود ۴۰ در ۴۰ متر، با دیوارهایی به ضخامت ۱٫۲ متر. ضلع شرقی همراه با چهار برج
    برجا مانده است. برج گرد در گوشهٔ جنوبی چهار طبقه بالا می‌رود: سه طبقه برای زندگی و نبرد، و بر فراز
    آن سکوی رزمی روبازی که جان‌پناهش روزنه‌های سنگ‌انداز و تنها یک روزنهٔ توپ دارد. خود کلیسا (۹٫۳۵ ×
    ۵ متر) امروز سفیدکاری شده است، اما پاره‌ای از چهرهٔ مسیح هنوز از طاق به پایین می‌نگرد.


    نام این مکان از برج‌ها کهن‌تر است. در اوت ۱۴۸۳ قوارقوارهٔ دوم جاقلی، اتابک سامتسخه، در آرادتی سپاه
    شاهی را درهم شکست؛ یکی از ضربه‌هایی که پادشاهی یکپارچهٔ گرجستان را به پادشاهی‌ها و امیرنشین‌های رقیب
    تجزیه کرد. هیچ چیز در اینجا یادآور آن نبرد نیست: قلعه نزدیک به دو سده بعد پدید آمد.


    برج شرقی در ۱۹۶۰ حفاظت شد و کل مجموعه در ۲۰۲۰ مرمت شد، از این رو سنگ‌چین کهن و تعمیر سنجیده کنار هم
    ایستاده‌اند. بعدازظهر بیایید، هنگامی که خورشید به دیوار جنوبی می‌چرخد و هر حرف کتیبهٔ ملکه سایهٔ کوچک
    خود را می‌یابد.
  tip: >-
    نه ورودیه‌ای هست، نه نگهبانی، نه کافه‌ای: آب همراه داشته باشید و هر چیز دیگر را از کارلی، چند کیلومتر
    آن‌طرف‌تر، بخرید. چند صد متر آخر راه خاکی است و حیاط ناهموار، پس کفشی با زیرهٔ ضدلغزش بپوشید و روی
    لبه‌های فرسودهٔ دیوارها نروید، چون بخشی از حصار هنوز ویرانه است. اگر کلیسا باز بود، شانه‌ها و زانوها
    را بپوشانید؛ زنان معمولاً موی خود را می‌پوشانند. یک ساعت کاملاً کافی است. بعدازظهر بهترین زمان است،
    وقتی نور بر نمای جنوبی و کتیبه‌اش می‌افتد. برای نیم‌روزی در حوالی کارلی، کلیسای جامع اوربنیسی یا صومعهٔ
    کینتسویسی را هم بیفزایید.
  route: >-
    ۱۰۴ کیلومتر، حدود ۱ ساعت و ۳۰ دقیقه. از تفلیس بزرگراه S1 (E60) را به سمت غرب، از کنار متسختا و گوری
    بروید و پس از حدود ۱۰۰ کیلومتر، از خروجی کارلی بیرون بروید. لازم نیست وارد شهر شوید: در میدان کنار
    خروجی، جادهٔ Sh203 (کارلی–آگارا) را حدود ۲٫۵ کیلومتر به سمت غرب دنبال کنید، سپس به راست بپیچید و نیم
    کیلومتر رو به شمال تا آرادتی بروید؛ قلعه در خود روستا و بر کرانهٔ راست پرونه قرار دارد. آسفالت تا
    روستا می‌رسد و بعد چند صد متر راه خاکی تا دیوارها. در هوای خشک هر خودروی اقتصادی از پسش برمی‌آید؛
    پس از باران آهسته برانید. سوخت هم روی S1 و هم در کارلی فراوان است.
he:
  name: מבצר ארדטי
  short: >-
    ארמון מבוצר ובו מגדלים על נהר פרונה, המקיף את הכנסייה שבנתה המלכה מריאם ב-1666, במרחק קפיצה מהכביש
    המהיר ליד קארלי.
  body: >-
    **ב-1666 ציוותה מלכה לחקוק את שמה בקיר כנסייה קטנה מעל נהר פרונה, והאבן שומרת עליו מאז.**


    כתובת באותיות אסומטוורולי בחזית הדרומית של כנסיית סבא הקדוש מתעדת שהיא נבנתה באותה שנה בפקודת המלכה
    מריאם, שנולדה בבית דדיאני מסמגרלו. סביבה קם ארמון מבוצר, מעון של אדון מאחורי חומות ומגדלים, שאולי
    היה שייך לבית אישחנלי, משפחת אצולה מחבל טאו ההיסטורי. חוקרים גאורגים מתארכים את החומות לאמצע המאה
    ה-17; לפי דעה אחרת הן מאוחרות יותר, מן המאה ה-18, ונבנו להגנה מפני פשיטות הלזגינים. כך או כך, זה היה
    בית שבנו אנשים שציפו להתקפה.


    המתחם כמעט ריבועי, כ-40 על 40 מטרים, וחומותיו בעובי 1.2 מטרים. הצד המזרחי שרד יחד עם ארבעה מגדלים.
    המגדל העגול בפינה הדרומית מתנשא לארבע קומות: שלוש למגורים וללחימה, ובראשו משטח לחימה פתוח שבמעקה שלו
    פתחי הטלה ופתח תותח יחיד. הכנסייה עצמה (9.35 × 5 מ') מסוידת היום בלבן, אבל שריד של דמות ישו עדיין
    משקיף מן הקמרון.


    השם עתיק מן המגדלים. באוגוסט 1483 הביס קוורקוורה השני ג'קלי, האתאבג של סמצחה, צבא מלכותי בארדטי, באחת
    המכות שפיצלו את ממלכת גאורגיה המאוחדת לממלכות ולנסיכויות יריבות. דבר כאן אינו מזכיר זאת: המבצר קם
    כמעט מאתיים שנה מאוחר יותר.


    המגדל המזרחי עבר שימור ב-1960 והמכלול כולו שוקם ב-2020, כך שבנייה עתיקה ותיקון זהיר עומדים כאן זה
    לצד זה. בואו אחר הצהריים, כשהשמש נוטה אל החומה הדרומית וכל אות בכתובת של המלכה מקבלת צל קטן משלה.
  tip: >-
    אין דמי כניסה, אין שומר ואין בית קפה: הביאו מים, וכל השאר קנו בקארלי, כמה קילומטרים משם. מאות המטרים
    האחרונים הם בדרך עפר והחצר לא אחידה, אז נעלו נעליים עם אחיזה טובה והתרחקו מראשי החומות המתפוררים,
    כי חלק מן המתחם עדיין הרוס. אם הכנסייה פתוחה, כסו כתפיים וברכיים; נשים נוהגות לכסות את השיער. שעה
    מספיקה בהחלט. אחר הצהריים הוא הזמן הטוב ביותר, כשהאור נופל על החזית הדרומית ועל הכתובת. לחצי יום באזור
    קארלי הוסיפו את קתדרלת אורבניסי או את מנזר קינצוויסי.
  route: >-
    104 ק"מ, כשעה וחצי. צאו מטביליסי מערבה בכביש המהיר S1 (E60), על פני מצחתה וגורי, ואחרי כ-100 ק"מ צאו
    ביציאה לקארלי. אין צורך להיכנס לעיר: בכיכר שליד היציאה עלו על כביש Sh203 (קארלי–אגרה) מערבה לכ-2.5
    ק"מ, ואז פנו ימינה וסעו חצי קילומטר צפונה אל ארדטי; המבצר עומד בתוך הכפר, על הגדה הימנית של הפרונה.
    האספלט מגיע עד הכפר, ומשם כמה מאות מטרים בדרך עפר עד החומות. במזג אוויר יבש כל רכב מקטגוריית אקונומי
    יסתדר; אחרי גשם סעו לאט. תחנות דלק יש בשפע על כביש S1 ובקארלי.
ar:
  name: قلعة أراديتي
  short: >-
    قصر محصّن ذو أبراج على نهر بروني يحتضن الكنيسة التي بنتها الملكة مريم عام 1666، على بُعد خطوات من
    الطريق السريع قرب كاريلي.
  body: >-
    **في عام 1666 أمرت ملكة بنقش اسمها على جدار كنيسة صغيرة فوق نهر بروني، وما زال الحجر يحفظه منذ ذلك
    الحين.**


    يسجّل نقش بخط الأسومتافرولي على الواجهة الجنوبية لكنيسة القديس سابا أنها بُنيت في تلك السنة بأمر الملكة
    مريم، المولودة في أسرة دادياني من ساميغريلو. ومن حولها نشأ قصر محصّن، أي مسكن لسيّد إقطاعي خلف الأسوار
    والأبراج، ربما كان لآل إيشخنيلي، وهي أسرة نبيلة من إقليم تاو التاريخي. يؤرّخ الباحثون الجورجيون الأسوار
    بمنتصف القرن السابع عشر؛ وفي رأي آخر أنها جاءت لاحقًا، في القرن الثامن عشر، لصدّ غارات الليزغيين.
    وأيًّا كان الأمر، فهذا بيت بناه أناس كانوا يتوقعون الهجوم.


    السور شبه مربع، نحو 40 في 40 مترًا، وسماكة جدرانه 1.2 متر. وقد بقي الجانب الشرقي بأبراجه الأربعة.
    ويرتفع البرج المستدير في الركن الجنوبي أربعة طوابق: ثلاثة للسكن والقتال، وفي أعلاه منصة قتال مكشوفة
    يحمل حاجزها سقّاطات وفتحة مدفع واحدة. أما الكنيسة نفسها (9.35 × 5 م) فمطليّة اليوم بالجير الأبيض،
    غير أن جزءًا من صورة المسيح لا يزال يطلّ من القبو.


    والاسم أقدم من الأبراج. ففي آب/أغسطس 1483 سحق كفاركفاري الثاني جاكيلي، أتابك سامتسخه، جيشًا ملكيًّا
    عند أراديتي، في واحدة من الضربات التي مزّقت مملكة جورجيا الموحّدة إلى ممالك وإمارات متنافسة. ولا شيء
    هنا يذكّر بذلك: فالقلعة جاءت بعد نحو قرنين.


    خضع البرج الشرقي للصيانة عام 1960 ورُمّم المجمّع كله عام 2020، فصار البناء القديم والإصلاح المتأنّي
    يقفان جنبًا إلى جنب. تعالَ بعد الظهر، حين تميل الشمس إلى الجدار الجنوبي فيكتسب كل حرف من نقش الملكة
    ظلًّا صغيرًا خاصًّا به.
  tip: >-
    لا رسوم ولا حارس ولا مقهى: احمل الماء، واشترِ كل ما عداه من كاريلي على بُعد بضعة كيلومترات. بضع مئات
    الأمتار الأخيرة على طريق ترابي والفناء غير مستوٍ، فالبس حذاءً مانعًا للانزلاق وابتعد عن رؤوس الأسوار
    المتفتّتة، إذ لا يزال جزء من السور أطلالًا. إن كانت الكنيسة مفتوحة فاستر كتفيك وركبتيك؛ وتغطي النساء
    شعورهن عادةً. تكفي ساعة تمامًا. وأفضل الأوقات بعد الظهر، حين يسقط الضوء على الواجهة الجنوبية ونقشها.
    ولنصف يوم في نواحي كاريلي، أضِف كاتدرائية أوربنيسي أو دير كينتسفيسي.
  route: >-
    104 كم، نحو ساعة و30 دقيقة. غادر تبليسي غربًا على الطريق السريع S1 (E60) متجاوزًا متسخيتا وغوري، وبعد
    نحو 100 كم خذ مخرج كاريلي. ولا حاجة إلى دخول المدينة: عند الدوّار المجاور للمخرج اسلك الطريق Sh203
    (كاريلي–أغارا) غربًا نحو 2.5 كم، ثم انعطف يمينًا وسِر نصف كيلومتر شمالًا حتى أراديتي؛ تقوم القلعة
    داخل القرية على الضفة اليمنى لنهر بروني. يمتدّ الإسفلت حتى القرية، ثم بضع مئات من الأمتار غير المعبّدة
    حتى الأسوار. في الطقس الجاف تجتازه أي سيارة اقتصادية؛ وبعد المطر تمهّل. الوقود متوفر بكثرة على الطريق
    S1 وفي كاريلي.
