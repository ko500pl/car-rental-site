ka:
  name: სალხინოს დადიანების რეზიდენცია
  short: დადიანების საზაფხულო რეზიდენცია მარტვილის ჩრდილოეთით, ხეზე ატანილი ოჯალეშის ვენახებით და მიძინების
    ეკლესიით.
  body: >-
    **სალხინო ის ადგილია, სადაც დადიანები ზაფხულს ატარებდნენ** — და სახელიც ზუსტად ამას ნიშნავს. სოფელი
    მარტვილიდან თერთმეტიოდე კილომეტრში ჩრდილოეთით, ეგრისის ქედის წინა კალთებზეა, სადაც დაბლობის სიცხე
    უკვე იკლებს.


    რეზიდენცია XIX საუკუნეში აშენდა. ეს არ არის ზუგდიდის სასახლის მასშტაბის ნაგებობა: ორსართულიანი, აივნიანი,
    შედარებით მოკრძალებული სახლი, რომელიც უფრო აგარაკს ჰგავს, ვიდრე სასახლეს. სწორედ ეს იყო აზრი — აქ
    ოჯახი ისვენებდა და არა იღებდა.


    მთავარი, რითაც სალხინო ცნობილია, ღვინოა. ოჯალეში, სამეგრელოს წითელი ჯიში, აქ მაღლარად იზრდება: ვაზი
    მურყანსა და სხვა ხეებზეა ატანილი, რაც ნოტიო კლიმატში ჰაერის მოძრაობას უზრუნველყოფს. დადიანებმა ეს
    ჯიში სისტემატურად გააშენეს და სალხინოს ღვინო რუსეთის იმპერატორის კარზეც მიდიოდა. მევენახეობა დღესაც
    გრძელდება და ზოგი ვაზი ხის კენწერომდე აღწევს — ეს ისეთი სანახავია, რომელსაც სხვაგან იშვიათად ნახავ.


    ოჯალეში ძალიან გვიან მწიფდება — ხშირად ნოემბერში, როცა სხვა ჯიშები უკვე დაკრეფილია. სწორედ ამიტომ
    სჭირდება მას თბილი შემოდგომა და კარგად განიავებული მდებარეობა; ხეზე ატანილი ვაზი ორივეს იძლევა. სახელი
    მეგრულ სიტყვას უკავშირდება, რომელიც ხეს ნიშნავს, და ეს ჯიშის მოყვანის წესსაც ზუსტად აღწერს.


    ეს ტექნიკა თანდათან ქრება. სასოფლო-სამეურნეო თვალსაზრისით მაღლარი არაეფექტიანია: მოსავალი მცირეა,
    კრეფა კი კიბეს მოითხოვს. სწორედ ამიტომ ღირს სალხინოში მისვლა — აქ ის ჯერ კიდევ ცოცხალია და არა მუზეუმის
    ექსპონატი.


    რეზიდენციის ეზოში მიძინების ეკლესიაა; დღეს ტერიტორიაზე მონასტერია და სწორედ ის არის ყველაზე ცოცხალი
    ნაწილი. ბერები ვენახსაც უვლიან.


    პირდაპირ უნდა ითქვას: სასახლის ინტერიერი ჩვეულებრივ დახურულია და აქ არც მუზეუმია და არც ბილეთი. აღდგენა
    წლების განმავლობაში წყვეტილად მიმდინარეობდა. თუ ავეჯით მოწყობილ სასახლეს ელოდები, ზუგდიდში წადი.


    აქ სხვა რამისთვის მოდიან: ხეზე ატანილი ვაზისთვის, ძველი ხეებისთვის, ეკლესიის სიჩუმისთვის და იმ ხედისთვის,
    რომელიც ბორცვიდან სამხრეთით, დაბლობისკენ იშლება. ეზოში ძველი ბზა და მუხებია, ხოლო სახლის აივნიდან,
    თუ კარი ღიაა, ვენახი მთლიანად ჩანს. სექტემბრისა და ოქტომბრის დასაწყისი ყველაზე კარგი დროა — რთველი
    მიმდინარეობს და ჰაერი ტკბილია.


    ვიზიტი ბუნებრივად ერწყმის მარტვილის კანიონსა და ბალდას იმავე დღეს; სამივე ერთმანეთისგან ნახევარ საათშია.
  tip: >-
    ერთი საათი კმარა. ტერიტორიაზე მოქმედი მონასტერია: ჩაცმის წესები მოქმედებს, ხმამაღლა ლაპარაკი და ვენახში
    თვითნებურად შესვლა არ ღირს — ჯობია ჯერ იკითხო. სასახლის შენობა ხშირად დაკეტილია და შიგნით შესვლა არ
    არის გარანტირებული. ტუალეტი მარტივია, კაფე არ არის; საჭმელი მარტვილში აიღე. ბილიკები ბალახიანია, წვიმის
    შემდეგ სრიალა — დახურული ფეხსაცმელი გამოგადგება. რთველის დროს ადგილობრივები ხშირად თავად გაჩვენებენ
    მაღლარ ვაზს. ზამთარში ტერიტორია ღიაა, მაგრამ ნესტიანი და ცარიელი.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე და აბაშამდე, შემდეგ ჩრდილოეთით მარტვილისკენ — მარტვილიდან კიდევ თერთმეტიოდე
    კილომეტრი ჩრდილოეთით, სალხინოსკენ. სულ დაახლოებით 312 კმ და ოთხი საათი ორმოცი წუთი. მთავარი გზა ასფალტია;
    ბოლო მონაკვეთი ვიწროა, ადგილ-ადგილ დაზიანებული, თუმცა მშრალ ამინდში დაბალი მანქანაც გაივლის; ხანგრძლივი
    წვიმის შემდეგ კი უფრო მაღალი ავტომობილი სჯობს. ნიშნები მწირია — სოფელში კითხვა ჯობია. საწვავი აბაშაში
    ან მარტვილში აიღე. მშრალ ამინდში ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Salkhino Dadiani Residence
  short: >-
    The Dadiani summer estate north of Martvili, with Ojaleshi vines trained up trees and a monastery
    in the grounds.
  body: >-
    **Salkhino is where the Dadiani spent their summers,** and the name says exactly that. The village
    lies about eleven kilometres north of Martvili, on the first slopes of the Egrisi range, where the
    heat of the lowland begins to let go.


    The residence was built in the nineteenth century. It is nothing like the palace at Zugdidi: a two-storey
    house with a veranda, closer to a country retreat than to a seat of government. That was the point.
    The family rested here rather than received here.


    What Salkhino is really known for is wine. Ojaleshi, the red grape of Mingrelia, is grown here in
    the old way, trained high into alders and other trees so that air moves through the fruit in a very
    wet climate. The Dadiani planted it here systematically, and the wine from this estate went as far
    as the Russian imperial court. Vines are still worked, and some of them climb to the tops of the trees,
    which is a sight you will not easily find elsewhere.


    Ojaleshi ripens very late, often into November, when other Georgian varieties are long picked. That
    is why it needs a warm autumn and a well-aired position, and a vine in a tree gives it both. The name
    is usually explained from the Mingrelian word for tree, which describes the method exactly.


    The technique is disappearing. In farming terms training vines into trees is inefficient: yields are
    small and picking requires a ladder. That is precisely why Salkhino is worth the detour — here it
    is still alive rather than an exhibit.


    In the grounds stands a church of the Dormition. The site is now a monastery, and that is the living
    part of it; the monks look after the vineyard too.


    Be clear about what you will not get. The house is usually locked, there is no museum inside and no
    ticket desk, and restoration has come and gone over the years. If you want a furnished palace, go
    to Zugdidi.


    People come here for something else: for vines in trees, for old timber, for the quiet round the church,
    and for the view that opens south from the slope across the plain. Late September and early October
    are best, when the harvest is in progress and the air is sweet.


    The visit combines naturally with Martvili canyon and Balda in the same day; all three are within
    half an hour of one another.
  tip: >-
    An hour is enough. The grounds hold a working monastery, so dress rules apply, voices should stay
    low, and you should not wander into the vineyard without asking first. The house itself is often locked
    and getting inside is not guaranteed. The toilet is basic and there is no café, so bring food from
    Martvili. Paths are grassy and slippery after rain, and closed shoes help. During the vintage local
    people will often show you the trained vines themselves if you ask.
  route: >-
    From Tbilisi follow the E60 to Samtredia and Abasha, then turn north for Martvili; from Martvili it
    is another eleven kilometres north to Salkhino. About 312 km in total, four hours forty. The main
    road is asphalt; the final stretch is narrow and broken in places, though a low car will manage in
    dry weather. Signposting is thin, so be ready to ask in the village. Refuel in Abasha or Martvili.
    In dry conditions an economy car is enough; after heavy rain the last kilometres are better in something
    higher.
ru:
  name: Резиденция Дадиани в Салхино
  short: Летнее имение Дадиани к северу от Мартвили, с лозой оджалеши на деревьях и монастырём на территории.
  body: >-
    **Салхино — место, где Дадиани проводили лето,** и само название говорит именно об этом. Село лежит
    километрах в одиннадцати к северу от Мартвили, на первых склонах Эгрисского хребта, где жара низины
    уже отпускает.


    Резиденцию построили в XIX веке. Это совсем не зугдидский дворец: двухэтажный дом с верандой, ближе
    к загородному прибежищу, чем к парадной резиденции. В этом и был смысл: здесь семья отдыхала, а не
    принимала.


    Настоящую известность Салхино принесло вино. Оджалеши, красный мегрельский сорт, растёт тут по-старому
    — маглари: лозу поднимают высоко на ольху и другие деревья, чтобы во влажном климате гроздья продувало.
    Дадиани высадили этот сорт систематически, и вино из имения доходило до русского императорского двора.
    Виноградники работают и сейчас, а отдельные лозы забираются до вершин деревьев — зрелище, которое
    нелегко найти где-либо ещё.


    Оджалеши созревает очень поздно, часто уже в ноябре, когда другие грузинские сорта давно сняты. Поэтому
    ему нужны тёплая осень и хорошо проветриваемое место, а лоза на дереве даёт и то и другое. Название
    обычно объясняют из мегрельского слова «дерево», и это точно описывает способ.


    Приём этот исчезает. С хозяйственной точки зрения маглари невыгодно: урожай мал, а собирать приходится
    с лестницы. Именно поэтому в Салхино стоит заехать — здесь он ещё живой, а не музейный экспонат.


    На территории стоит церковь Успения. Сегодня здесь монастырь, и именно он — живая часть места; монахи
    ухаживают и за виноградником.


    Скажем прямо, чего не будет. Дом обычно заперт, музея внутри нет, кассы тоже, а реставрация шла с
    перерывами. Если хочется обставленного дворца, езжайте в Зугдиди.


    Сюда приезжают за другим: за лозой на деревьях, за старыми стволами, за тишиной вокруг церкви и за
    видом, который открывается со склона на юг, к равнине. Лучше всего конец сентября и начало октября,
    когда идёт сбор и воздух сладковатый.


    Поездка естественно соединяется с Мартвильским каньоном и Балдой в один день: все три места в получасе
    друг от друга.
  tip: >-
    Часа достаточно. На территории действующий монастырь: соблюдайте правила одежды, говорите тише и не
    заходите в виноградник, не спросив. Сам дом чаще всего заперт, и попасть внутрь не гарантировано.
    Туалет простой, кафе нет — еду берите в Мартвили. Дорожки травяные и после дождя скользкие, закрытая
    обувь пригодится. Во время сбора местные часто сами показывают, как поднята лоза, если вы спросите.
    Зимой территория открыта, но сыро и совершенно пусто.
  route: >-
    Из Тбилиси по E60 до Самтредиа и Абаши, затем на север к Мартвили; от Мартвили ещё около одиннадцати
    километров на север, в Салхино. Всего примерно 312 км и четыре часа сорок минут. Основная дорога асфальтированная,
    последний отрезок узкий и местами разбитый, но в сухую погоду низкая машина проходит. Указателей мало,
    будьте готовы спросить в селе. Заправляйтесь в Абаше или Мартвили. В сухую погоду достаточно машины
    эконом-класса, после сильных дождей лучше что-то повыше.
fa:
  name: اقامتگاه تابستانی داديانی در سالخینو
  short: ملک تابستانی داديانی در شمال مارتویلی، با تاک‌های اوجالشی بر درختان و صومعه‌ای در محوطه.
  body: >-
    **سالخینو جایی است که داديانی‌ها تابستان را در آن می‌گذراندند** و نام آن دقیقاً همین را می‌گوید. روستا
    حدود یازده کیلومتری شمال مارتویلی، بر نخستین دامنه‌های رشته‌کوه اگریسی است، آنجا که گرمای جلگه رها
    می‌کند.


    اقامتگاه در سدهٔ نوزدهم ساخته شد. هیچ شباهتی به کاخ زوگدیدی ندارد: خانه‌ای دو طبقه با ایوان، نزدیک‌تر
    به پناهگاهی روستایی تا مقر فرمانروایی. مقصود هم همین بود؛ خانواده اینجا می‌آسود، نه اینکه پذیرایی
    رسمی کند.


    آنچه سالخینو را به‌راستی نامدار کرده شراب است. اوجالشی، انگور سرخ مینگرلیا، اینجا به شیوهٔ کهن پرورش
    می‌یابد: تاک را بالای درختان توسکا و درختان دیگر می‌برند تا در اقلیم بسیار مرطوب هوا میان خوشه‌ها
    جریان یابد. داديانی‌ها این رقم را به‌شکل منظم کاشتند و شراب این ملک تا دربار امپراتوری روسیه می‌رفت.
    تاکستان‌ها هنوز کار می‌کنند و برخی تاک‌ها تا نوک درختان بالا می‌روند؛ منظره‌ای که جای دیگر به‌آسانی
    نمی‌بینید.


    اوجالشی بسیار دیر می‌رسد، بارها تا آبان، وقتی رقم‌های دیگر گرجی مدت‌هاست چیده شده‌اند. به همین سبب
    به پاییزی گرم و جایگاهی خوش‌هوا نیاز دارد و تاک بر درخت هر دو را فراهم می‌کند. نام آن را معمولاً از
    واژهٔ مینگرلی به معنای درخت توضیح می‌دهند، و همین شیوه را دقیق وصف می‌کند.


    این شیوه رو به نابودی است. از دید کشاورزی، بالا بردن تاک بر درخت به‌صرفه نیست: محصول اندک است و برداشت
    نردبان می‌خواهد. دقیقاً به همین دلیل سالخینو ارزش انحراف از مسیر را دارد؛ اینجا این کار هنوز زنده
    است نه شیء موزه‌ای.


    در محوطه کلیسای خوابیدگی مریم ایستاده است. امروز اینجا صومعه‌ای برپاست و همان بخش زندهٔ ماجراست؛ راهبان
    از تاکستان هم نگهداری می‌کنند.


    روشن بگوییم چه چیزی نصیبتان نمی‌شود. خانه معمولاً قفل است، موزه‌ای در آن نیست و گیشه‌ای هم نیست، و
    مرمت در طول سال‌ها با وقفه پیش رفته است. اگر کاخی مبله می‌خواهید، به زوگدیدی بروید.


    مردم برای چیز دیگری می‌آیند: برای تاک بر درخت، برای تنه‌های کهن، برای سکوت پیرامون کلیسا و برای چشم‌اندازی
    که از دامنه به جنوب و به سوی دشت گشوده می‌شود. اواخر شهریور و اوایل مهر بهترین زمان است، وقتی برداشت
    جریان دارد و هوا شیرین است.


    این دیدار به‌طور طبیعی با درهٔ مارتویلی و بالدا در یک روز جمع می‌شود؛ هر سه در نیم‌ساعتی یکدیگرند.
  tip: >-
    یک ساعت کافی است. در محوطه صومعه‌ای فعال هست، پس قواعد پوشش برقرار است، صدا را پایین نگه دارید و بی‌اجازه
    وارد تاکستان نشوید. خود خانه اغلب قفل است و ورود به آن تضمینی نیست. سرویس بهداشتی ساده است و کافه‌ای
    نیست، پس خوراک را از مارتویلی بیاورید. راه‌ها علفی و پس از باران لغزنده است و کفش بسته کمک می‌کند.
    در فصل برداشت اگر بپرسید، اهالی خودشان تاک‌های بالای درخت را نشانتان می‌دهند.
  route: >-
    از تفلیس با E60 تا سامترِدیا و آباشا، سپس به شمال به سوی مارتویلی؛ از مارتویلی یازده کیلومتر دیگر
    به شمال تا سالخینو. رویهم حدود ۳۱۲ کیلومتر و چهار ساعت و چهل دقیقه. جادهٔ اصلی آسفالت است؛ بخش پایانی
    باریک و جاهایی خراب، هرچند در هوای خشک خودروی کم‌ارتفاع از آن می‌گذرد. تابلوها کم است، پس آمادهٔ پرسیدن
    در روستا باشید. سوخت را در آباشا یا مارتویلی بگیرید. در هوای خشک خودروی اقتصادی کافی است و پس از باران
    سنگین خودروی بلندتر بهتر است.
he:
  name: אחוזת דאדיאני בסלחינו
  short: אחוזת הקיץ של בית דאדיאני מצפון למרטווילי, עם גפני אוג׳לשי מטופסות על עצים ומנזר בשטח.
  body: >-
    **סלחינו הוא המקום שבו בילו בני דאדיאני את קיציהם,** והשם אומר בדיוק את זה. הכפר שוכן כאחד-עשר קילומטרים
    מצפון למרטווילי, במדרונות הראשונים של רכס אגריסי, שם חום המישור מתחיל להרפות.


    האחוזה נבנתה במאה התשע-עשרה. היא אינה דומה כלל לארמון בזוגדידי: בית בן שתי קומות עם מרפסת, קרוב יותר
    למקום מפלט כפרי מאשר למושב שלטון. זו הייתה הכוונה. המשפחה נחה כאן ולא קיבלה כאן פנים.


    מה שסלחינו נודע בו באמת הוא היין. אוג׳לשי, ענב אדום של מינגרליה, גדל כאן בדרך הישנה: הגפן מטופסת גבוה
    על עצי אלמון ואחרים, כדי שהאוויר יזרום בין האשכולות באקלים לח מאוד. בני דאדיאני נטעו אותו כאן בשיטתיות,
    והיין מן האחוזה הגיע עד חצר הקיסר הרוסי. הכרמים עדיין מעובדים, וחלק מן הגפנים מטפסות עד צמרות העצים
    — מראה שלא תמצאו בקלות במקום אחר.


    אוג׳לשי מבשיל מאוד מאוחר, לא פעם עד נובמבר, כשזני גאורגיה האחרים נקטפו מזמן. לכן הוא זקוק לסתיו חמים
    ולמיקום מאוורר היטב, וגפן על עץ נותנת לו את שניהם. את השם נוהגים להסביר מן המילה המינגרלית לעץ, וזה
    מתאר בדיוק את השיטה.


    השיטה הזאת נעלמת. מבחינה חקלאית טיפוס גפנים על עצים אינו יעיל: היבול קטן והקטיף מחייב סולם. בדיוק
    משום כך שווה לסטות אל סלחינו — כאן הדבר עדיין חי ואינו מוצג במוזיאון.


    בשטח עומדת כנסיית ההירדמות. היום פועל כאן מנזר, וזה החלק החי של המקום; הנזירים מטפלים גם בכרם.


    נאמר בבירור מה לא יהיה. הבית בדרך כלל נעול, אין בו מוזיאון ואין קופה, והשיפוץ התקדם לסירוגין לאורך
    השנים. אם אתם רוצים ארמון מרוהט, סעו לזוגדידי.


    לכאן באים בשביל משהו אחר: בשביל גפנים על עצים, בשביל גזעים עתיקים, בשביל השקט סביב הכנסייה ובשביל
    הנוף הנפתח מן המדרון דרומה אל המישור. סוף ספטמבר ותחילת אוקטובר הם הזמן הטוב ביותר, כשהבציר בעיצומו
    והאוויר מתוק.


    הביקור משתלב בטבעיות עם קניון מרטווילי ועם בלדה באותו יום; שלושת המקומות במרחק חצי שעה זה מזה.
  tip: >-
    שעה מספיקה. בשטח פועל מנזר, ולכן חלים כללי לבוש, כדאי לדבר בשקט, ואין להיכנס לכרם בלי לשאול קודם.
    הבית עצמו נעול לרוב והכניסה אליו אינה מובטחת. השירותים בסיסיים ואין בית קפה, לכן הביאו אוכל ממרטווילי.
    השבילים עשבייים וחלקלקים אחרי גשם, ונעליים סגורות מסייעות. בעונת הבציר התושבים לעיתים קרובות יראו
    לכם בעצמם את הגפנים המטופסות אם תשאלו. בחורף השטח פתוח אך לח וריק לגמרי.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה ואבאשה, ואז צפונה למרטווילי; ממרטווילי עוד אחד-עשר קילומטרים צפונה לסלחינו.
    כ-312 ק״מ בסך הכול, ארבע שעות וארבעים. הכביש הראשי סלול; הקטע האחרון צר ושבור במקומות, אך רכב נמוך
    יעבור בו במזג אוויר יבש. השילוט דל, אז היו מוכנים לשאול בכפר. תדלקו באבאשה או במרטווילי. בתנאים יבשים
    רכב חסכוני מספיק; אחרי גשמים כבדים עדיף רכב גבוה יותר.
ar:
  name: مقر داديياني الصيفي في سالخينو
  short: ضيعة آل داديياني الصيفية شمال مارتفيلي، بكروم أوجاليشي المرفوعة على الأشجار ودير في المحيط.
  body: >-
    **سالخينو هو المكان الذي كان آل داديياني يقضون فيه صيفهم،** والاسم يقول ذلك بالضبط. تقع القرية على
    نحو أحد عشر كيلومتراً شمال مارتفيلي، على أولى منحدرات سلسلة إيغريسي، حيث يبدأ حر السهل بالانحسار.


    بُني المقر في القرن التاسع عشر. وهو لا يشبه قصر زوغديدي في شيء: بيت من طابقين بشرفة، أقرب إلى ملاذ
    ريفي منه إلى مقر حكم. وهذا كان المقصود؛ فالأسرة كانت تستريح هنا لا تستقبل.


    أما ما اشتهرت به سالخينو حقاً فهو النبيذ. فأوجاليشي، عنب مينغريليا الأحمر، يُزرع هنا على الطريقة القديمة:
    تُرفع الكرمة عالياً على أشجار الجار وغيرها حتى يجري الهواء بين العناقيد في مناخ شديد الرطوبة. غرس
    آل داديياني هذا الصنف بانتظام، وبلغ نبيذ الضيعة بلاط القيصر الروسي. وما زالت الكروم تُعمل، وبعض الكرمات
    تتسلق حتى قمم الأشجار، وهو مشهد لا تجده بسهولة في مكان آخر.


    ينضج أوجاليشي متأخراً جداً، وكثيراً ما يمتد إلى تشرين الثاني حين تكون الأصناف الجورجية الأخرى قد قُطفت
    منذ زمن. ولهذا يحتاج إلى خريف دافئ وموضع جيد التهوية، والكرمة على الشجرة تمنحه الأمرين. ويُفسَّر اسمه
    عادة من كلمة مينغريلية تعني الشجرة، وهو وصف دقيق للطريقة.


    وهذه التقنية آخذة في الاندثار. فمن الناحية الزراعية رفع الكرمة على الشجر غير مجدٍ: الغلة قليلة والقطاف
    يحتاج سلماً. ولهذا بالذات يستحق سالخينو الانعطاف إليه؛ فالأمر هنا ما زال حياً لا معروضاً في متحف.


    وفي المحيط تقوم كنيسة رقاد العذراء. واليوم هنا دير، وهو الجزء الحي من المكان؛ والرهبان يعتنون بالكرم
    أيضاً.


    ولنكن صريحين في ما لن تجده. البيت مغلق عادةً، ولا متحف في داخله ولا شباك تذاكر، والترميم جاء متقطعاً
    على مر السنين. فإن أردت قصراً مؤثثاً فاذهب إلى زوغديدي.


    يأتي الناس إلى هنا لشيء آخر: للكرمة فوق الشجر، وللجذوع العتيقة، وللسكون حول الكنيسة، وللمنظر المنفتح
    من المنحدر جنوباً نحو السهل. وأواخر أيلول وأوائل تشرين الأول أفضل وقت، حين يجري القطاف ويحلو الهواء.


    وتنتظم الزيارة طبيعياً مع وادي مارتفيلي وبالدا في يوم واحد؛ فالمواضع الثلاثة على بعد نصف ساعة من بعضها.
  tip: >-
    ساعة تكفي. في المحيط دير عامل، فقواعد اللباس مطبقة، وأبقِ صوتك منخفضاً، ولا تدخل الكرم دون استئذان.
    والبيت نفسه مغلق غالباً ودخوله غير مضمون. دورة المياه بسيطة ولا مقهى هنا، فاحمل طعامك من مارتفيلي.
    الممرات عشبية وزلقة بعد المطر، والحذاء المغلق يفيد. وفي موسم القطاف كثيراً ما يريك الأهالي بأنفسهم
    الكرمات المرفوعة إن سألتهم. وفي الشتاء المكان مفتوح لكنه رطب وخالٍ تماماً.
  route: >-
    من تبليسي على الطريق E60 حتى سامتريديا وأباشا، ثم شمالاً إلى مارتفيلي؛ ومن مارتفيلي أحد عشر كيلومتراً
    أخرى شمالاً إلى سالخينو. نحو 312 كم إجمالاً وأربع ساعات وأربعين دقيقة. الطريق الرئيسي معبّد؛ والمقطع
    الأخير ضيق ومتهالك في مواضع، وإن كانت السيارة المنخفضة تجتازه في الجو الجاف. اللافتات قليلة، فكن مستعداً
    للسؤال في القرية. تزوّد بالوقود في أباشا أو مارتفيلي. وفي الجو الجاف تكفي السيارة الاقتصادية، أما
    بعد الأمطار الغزيرة فالأفضل مركبة أعلى.
