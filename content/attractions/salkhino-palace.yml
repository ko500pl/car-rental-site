ka:
  name: სალხინოს დადიანების რეზიდენცია
  short: >-
    დადიანების „ლხინის სახლი“ მარტვილის ჩრდილოეთით: ქვის სასახლე, რომლის დარბაზშიც ქვევრი იყო ჩაშენებული,
    ოჯალეშის სამშობლოსთან ახლოს.
  body: >-
    **სახელი თავადვე გპირდებათ: სალხინო ლხინისგან მოდის, და სამეგრელოს მთავრები აქ XIX საუკუნის დიდ ნაწილში
    სწორედ ლხინისთვის ჩამოდიოდნენ.** სოფელი ქვიბიის მთების კალთებამდე გაშლილ ბორცვიან ვაკეზე, ზღვის დონიდან
    250 მეტრზე წევს, სასახლე კი წაჩხურას ნაპირზე დგას — მდინარისა, რომელიც ოდესღაც კალმახით იყო განთქმული.


    1825-1826 წლებში აქ მხოლოდ უბრალო ხის ოდა იდგა, რომელშიც ქვრივი დედოფალი ანა ცხოვრობდა. ლევან V დადიანმა
    (მმართველობდა 1804-1840 წლებში) არჩილ ბატონიშვილისა და გიორგი გეგელიას რჩევით ორსართულიანი ქვის სასახლის
    მშენებლობა წამოიწყო; საბოლოო სახე შენობამ მოგვიანებით, სალომე მიურატის დროს მიიღო. ზუგდიდის მსგავსად,
    აქაც თურქი და ბერძენი ოსტატები მუშაობდნენ. ქვა გლეხებს ახლომდებარე ლეცავედან მოჰქონდათ მარხილებით,
    რომლებშიც ას უღელ ხარ-კამეჩს აბამდნენ; უფროსი ოსტატი ოსმანი მშენებლობის დასრულებას ვერ მოესწრო.


    აქ ყველაფერი ღვინის გარშემო ტრიალებდა. ქვედა სართულზე 35 მეტრი სიგრძისა და 10 მეტრი სიგანის მარანი
    იყო, მუხის სვეტებზე დაყრდნობილი; დიდ დარბაზში ქვევრი იყო ჩაშენებული, მის გვერდით კი მასიური ბუხარი
    იდგა, რომლის თავზეც ბახუსის ქანდაკება იჯდა. კედლები მუხისა და წაბლის პანელებით იყო მოპირკეთებული.
    სასახლიდან ორ ვერსზე ის ადგილია, რომელსაც ძველი აღწერა „ოჯალეშის სამშობლოს“ უწოდებს — მეგრული წითელი
    ჯიშისა, რომელსაც ტრადიციულად მაღლარად, ხეზე აშვებდნენ; სახელიც მეგრულ „ჯა“-ს, ანუ ხეს, უკავშირდება.
    უკანასკნელი დიდი ლხინი სასახლეში 1897 წელს გადაიხადეს, ლუსიენ მიურატისა და მარი დე როან-შაბოს ჯვრისწერაზე.


    დღეს სახლი მდუმარეა და ხშირად დაკეტილიც; აქ არც მუზეუმია, არც სალარო. ეზოში ეკლესია დგას და ადგილს
    ყოველდღიურ სიცოცხლეს სწორედ ის ანიჭებს. შემოუარეთ კედლებს, წარმოიდგინეთ ასი უღელი ხარი და ბახუსი ბუხრის
    თავზე, და მიაყურადეთ: აქაური სიჩუმე სადღეგრძელოს შემდგომ პაუზას ჰგავს.
  tip: >-
    ერთი საათი საკმარისია. სასახლე ხშირად დაკეტილია, რესტავრაცია კი წლების განმავლობაში ხან იწყებოდა,
    ხან წყდებოდა — შიგნით შეხედვა, თუ მოხერხდა, საჩუქრად ჩათვალეთ. ეზოში მოქმედი ეკლესიაა: მხრები და მუხლები
    დაფარეთ, ხმადაბლა ილაპარაკეთ და სასულიერო პირების გადაღებამდე ნებართვა ითხოვეთ. კაფე არ არის — საჭმელი
    მარტვილიდან წამოიღეთ ან იქ ისადილეთ. ბილიკები ბალახიანი და თიხნარია, წვიმის შემდეგ სრიალებს, ამიტომ
    დახურული ფეხსაცმელი ჩაიცვით. საუკეთესო დრო შემოდგომაა, როცა სამეგრელოში გვიანი ოჯალეში იკრიფება და
    ჰაერს ახალი ტკბილის სუნი ასდის.
  route: >-
    თბილისიდან დაახლოებით 312 კმ და 4 საათი და 40 წუთია. E60 მაგისტრალით დასავლეთისკენ, ქუთაისის გვერდით
    სამტრედიამდე და აბაშამდე იარეთ, იქიდან კი ჩრდილოეთით, მარტვილისკენ გაუხვიეთ; სალხინო მარტვილიდან კიდევ
    დაახლოებით 15 კილომეტრშია ჩრდილოეთით. მაგისტრალიც და აბაშა–მარტვილის გზაც კარგი ასფალტია, სოფლის ბოლო
    მონაკვეთი კი ვიწრო და დაკერებულია, ორმოებით, რომლებიც წვიმის შემდეგ ღრმავდება. ნიშნები მწირია — ადგილობრივებს
    „დადიანების სასახლე“ ჰკითხეთ. საწვავი აბაშაში ან მარტვილში ჩაასხით. მშრალ ამინდში ეკონომკლასის ავტომობილიც
    გაივლის, ხანგრძლივი წვიმების შემდეგ კი კროსოვერის მაღალი კლირენსი გამოგადგებათ.
en:
  name: Salkhino Dadiani Residence
  short: >-
    The Dadiani 'house of feasting' north of Martvili: a stone palace with a qvevri set into its great
    hall, near the old home of the Ojaleshi grape.
  body: >-
    **The name is a promise: Salkhino comes from the Georgian lkhini, a feast, and for much of the 19th
    century the princes of Mingrelia came here to keep it.** The village lies 250 metres up, below the
    Kvibi hills, and the palace stands on the bank of the Tsachkhura, a stream once famous for its trout.


    In 1825–26 there was nothing here but a plain wooden oda house, home to the widowed Princess Ana.
    Levan V Dadiani (ruled 1804–1840) began a two-storey stone palace on the advice of Prince Archil and
    Giorgi Gegelia; it took its final form only later, in the time of Salome Murat. As at Zugdidi, Turkish
    and Greek masons did the work. Villagers hauled the stone from nearby Letsave on sledges drawn by
    a hundred yoke of oxen and buffalo, and the master builder, Osman, died before it was finished.


    Everything turned on wine. The ground floor held a marani 35 metres long and 10 wide, its roof carried
    on oak columns; a qvevri was set into the great hall beside a massive fireplace crowned by a figure
    of Bacchus, and the walls were panelled in oak and chestnut. Two versts away lies what an old description
    calls "the homeland of Ojaleshi", the Mingrelian red grape traditionally trained high into trees —
    its name is linked to the Mingrelian ja, "tree". The last great feast was held in 1897, for the wedding
    of Lucien Murat and Marie de Rohan-Chabot.


    Today the house is quiet and often shut; there is no museum and no ticket desk. A working church in
    the grounds gives the place its daily life. Walk round the walls, picture the hundred oxen and Bacchus
    above the fire, and listen: the silence here sounds like the pause after a toast.
  tip: >-
    Allow an hour. The palace is often locked and restoration has started and stalled over the years,
    so treat any glimpse inside as a bonus. There is a working church in the grounds: cover shoulders
    and knees, keep voices low and ask before photographing the clergy. There is no café — bring food
    from Martvili or plan lunch there. Paths are grass and clay and turn slick after rain, so wear closed
    shoes. Autumn is the best time, when the late-ripening Ojaleshi is picked across Samegrelo and the
    air smells of fresh must.
  route: >-
    About 312 km and 4 hours 40 minutes from Tbilisi. Take the E60 motorway west past Kutaisi to Samtredia
    and on to Abasha, then turn north for Martvili; Salkhino is about 15 km further north. The motorway
    and the Abasha–Martvili road are good asphalt, but the final village stretch is narrow and patched,
    with potholes that deepen after rain. Signs are sparse — ask locals for 'Dadianebis sasakhle'. Refuel
    in Abasha or Martvili. In dry weather an economy car copes; after a wet spell, a crossover's extra
    clearance is welcome.
ru:
  name: Резиденция Дадиани в Салхино
  short: >-
    «Дом пиров» Дадиани к северу от Мартвили: каменный дворец с квеври, встроенным в парадный зал, рядом
    со старой родиной винограда оджалеши.
  body: >-
    **Само название — обещание: Салхино происходит от грузинского «лхини», пир, и большую часть XIX века
    мегрельские владетельные князья приезжали сюда, чтобы сдержать это обещание.** Село лежит на высоте
    250 метров, под Квибскими холмами, а дворец стоит на берегу речки Цачхура, некогда славившейся форелью.


    В 1825–26 годах здесь не было ничего, кроме простого деревянного дома-оды, где жила овдовевшая княгиня
    Анна. Леван V Дадиани (правил в 1804–1840 годах) по совету князя Арчила и Георгия Гегелии начал строить
    двухэтажный каменный дворец; окончательный облик тот обрёл лишь позже, при Саломе Мюрат. Как и в Зугдиди,
    строили турецкие и греческие каменщики. Крестьяне возили камень из соседнего Лецаве на санях, запряжённых
    сотней пар волов и буйволов, а главный мастер, Осман, умер, не дождавшись окончания работ.


    Всё здесь вращалось вокруг вина. На первом этаже был марани — винный погреб — длиной 35 метров и шириной
    10, его перекрытие держали дубовые колонны; в парадном зале, рядом с массивным камином, увенчанным
    фигурой Вакха, был встроен квеври, а стены обшили дубом и каштаном. В двух верстах отсюда лежит то,
    что одно старое описание называет «родиной оджалеши», — мегрельского красного винограда, который по
    традиции пускают высоко по деревьям; его название связывают с мегрельским словом «джа» — «дерево».
    Последний большой пир состоялся в 1897 году, на свадьбе Люсьена Мюрата и Мари де Роган-Шабо.


    Сегодня в доме тихо, и он часто заперт; ни музея, ни кассы здесь нет. Повседневную жизнь месту даёт
    действующая церковь на территории. Обойдите стены, представьте сотню волов и Вакха над огнём и прислушайтесь:
    здешняя тишина звучит как пауза после тоста.
  tip: >-
    Заложите час. Дворец часто заперт, а реставрация за эти годы не раз начиналась и замирала, так что
    любой взгляд внутрь считайте подарком. На территории действующая церковь: закройте плечи и колени,
    говорите вполголоса и спрашивайте разрешения, прежде чем фотографировать священнослужителей. Кафе
    нет — привезите еду из Мартвили или пообедайте там. Дорожки травяные и глинистые, после дождя они
    скользкие, так что наденьте закрытую обувь. Лучшее время — осень, когда по всему Самегрело собирают
    поздний оджалеши и в воздухе пахнет молодым суслом.
  route: >-
    Около 312 км и 4 часа 40 минут от Тбилиси. Езжайте по автомагистрали E60 на запад мимо Кутаиси до
    Самтредиа и дальше до Абаши, затем сверните на север, к Мартвили; Салхино — ещё примерно в 15 км к
    северу. Магистраль и дорога Абаша — Мартвили покрыты хорошим асфальтом, но последний сельский участок
    узкий и латаный, с выбоинами, которые после дождя становятся глубже. Указателей мало — спрашивайте
    у местных «Дадианебис сасахле» (дворец Дадиани). Заправьтесь в Абаше или Мартвили. В сухую погоду
    справится и машина эконом-класса; после дождей пригодится кроссовер с его увеличенным клиренсом.
fa:
  name: اقامتگاه دادیانی در سالخینو
  short: >-
    «خانهٔ ضیافت» دادیانی‌ها در شمال مارتویلی: کاخی سنگی با کووری‌ای در تالار بزرگش، نزدیک زادگاه دیرین
    انگور اوجالشی.
  body: >-
    **نام این مکان خود وعده‌ای است: سالخینو از واژهٔ گرجی «لخینی» به معنای ضیافت آمده، و در بخش بزرگی
    از سدهٔ نوزدهم شاهزادگان مگرلیا به اینجا می‌آمدند تا به این وعده وفا کنند.** روستا در ارتفاع ۲۵۰ متری،
    پای تپه‌های کویبی، قرار دارد و کاخ کنار تساچخورا ایستاده است، جویباری که روزگاری به قزل‌آلایش شهره
    بود.


    در سال‌های ۱۸۲۵–۲۶ اینجا چیزی جز یک خانهٔ چوبی سادهٔ «اودا» نبود، خانهٔ شاهزاده‌بانوی بیوه، آنا. لوان
    پنجم دادیانی (فرمانروایی ۱۸۰۴–۱۸۴۰) به توصیهٔ شاهزاده آرچیل و گیورگی گگلیا ساختن کاخی سنگی و دوطبقه
    را آغاز کرد؛ کاخ تنها بعدها، در روزگار سالومه مورا، به شکل نهایی‌اش رسید. همچون زوگدیدی، سنگ‌تراشان
    ترک و یونانی آن را ساختند. روستاییان سنگ را از لتساوه در همان نزدیکی با سورتمه‌هایی می‌آوردند که صد
    جفت گاو نر و گاومیش آن‌ها را می‌کشیدند، و استادکار اصلی، عثمان، پیش از پایان کار درگذشت.


    همه‌چیز گرد شراب می‌چرخید. در طبقهٔ همکف مارانی — شراب‌خانه — به طول ۳۵ و پهنای ۱۰ متر بود که سقفش
    بر ستون‌های بلوط استوار بود؛ در تالار بزرگ، کنار بخاری دیواری عظیمی که پیکرهٔ باکوس بر تارکش بود،
    یک کووری (خمرهٔ سفالی شراب) جاسازی کرده بودند، و دیوارها را با چوب بلوط و شاه‌بلوط پوشانده بودند.
    دو ورست آن‌سوتر جایی است که توصیفی قدیمی «زادگاه اوجالشی» می‌نامدش: انگور سرخ مگرلی که به رسم دیرین
    آن را بلند بر درختان می‌دوانند؛ نامش را با واژهٔ مگرلی «جا» به معنای «درخت» مرتبط می‌دانند. آخرین
    ضیافت بزرگ در ۱۸۹۷، در جشن عروسی لوسین مورا و ماری دو روهان-شابو، برپا شد.


    امروز خانه خاموش است و اغلب بسته؛ نه موزه‌ای هست و نه باجهٔ بلیتی. کلیسایی فعال در محوطه به این مکان
    زندگی روزمره می‌بخشد. گرداگرد دیوارها قدم بزنید، صد گاو نر و باکوس بالای آتش را در ذهن مجسم کنید و
    گوش بسپارید: سکوت اینجا به مکثی می‌ماند که پس از بلند کردن جام به سلامتی می‌آید.
  tip: >-
    یک ساعت وقت بگذارید. کاخ اغلب قفل است و مرمتش در این سال‌ها بارها آغاز شده و متوقف مانده، پس هر نگاهی
    به درونش را غنیمت بشمارید. در محوطه کلیسایی فعال هست: شانه‌ها و زانوها را بپوشانید، آهسته سخن بگویید
    و پیش از عکس گرفتن از روحانیان اجازه بخواهید. کافه‌ای نیست — غذا را از مارتویلی بیاورید یا ناهار را
    آنجا بخورید. راه‌ها چمنی و گلی‌اند و پس از باران لغزنده می‌شوند، پس کفش بسته بپوشید. بهترین زمان پاییز
    است، وقتی اوجالشیِ دیررس در سراسر سامگرلو چیده می‌شود و هوا بوی شیرهٔ تازهٔ انگور می‌دهد.
  route: >-
    از تفلیس حدود ۳۱۲ کیلومتر و ۴ ساعت و ۴۰ دقیقه راه است. بزرگراه E60 را به سوی غرب بگیرید، از کنار کوتائیسی
    تا سامتردیا و سپس تا آباشا بروید، آنگاه به شمال به سوی مارتویلی بپیچید؛ سالخینو حدود ۱۵ کیلومتر شمال‌تر
    است. بزرگراه و جادهٔ آباشا–مارتویلی آسفالت خوبی دارند، اما تکهٔ پایانیِ روستایی باریک و وصله‌پینه
    است و چاله‌هایش پس از باران عمیق‌تر می‌شوند. تابلو کم است — از اهالی سراغ «دادیانبیس ساساخله» (کاخ
    دادیانی‌ها) را بگیرید. در آباشا یا مارتویلی سوخت بزنید. در هوای خشک خودروی اکونومی از پس راه برمی‌آید؛
    پس از چند روز بارانی، فاصلهٔ بیشتر یک کراس‌اوور از زمین غنیمت است.
he:
  name: מעון דדיאני בסלחינו
  short: >-
    "בית המשתאות" של בית דדיאני מצפון למרטווילי: ארמון אבן שבאולמו הגדול שוקע קווברי, סמוך למולדתו הישנה
    של הענב אוג'לשי.
  body: >-
    **השם עצמו הוא הבטחה: סלחינו נגזר מהמילה הגאורגית "לחיני", משתה, ובמשך רוב המאה ה-19 באו לכאן נסיכי
    מגרליה כדי לקיים אותה.** הכפר שוכן בגובה 250 מטרים, למרגלות גבעות קוויבי, והארמון עומד על גדת הצאצ'חורה,
    פלג שהיה מפורסם פעם בפורלים שלו.


    ב-1825–26 לא היה כאן דבר מלבד בית עץ פשוט מסוג "אודה", ביתה של הנסיכה האלמנה אנה. לבאן החמישי דדיאני
    (שלט בשנים 1804–1840) החל, בעצת הנסיך ארצ'יל וגיאורגי גגליה, בבניית ארמון אבן בן שתי קומות; הארמון
    קיבל את צורתו הסופית רק מאוחר יותר, בימי סלומה מירא. כמו בזוגדידי, את העבודה עשו בנאי אבן טורקים ויוונים.
    בני הכפר גררו את האבנים מלצאווה הסמוכה על מזחלות שמשכו מאה צמדי שוורים ותאואים, ורב-האומן, עוסמאן,
    מת לפני שהבנייה הושלמה.


    הכול סבב סביב היין. בקומת הקרקע היה מרני – מרתף יין – באורך 35 מטרים וברוחב 10, שגגו נשען על עמודי
    אלון; באולם הגדול, ליד אח מסיבית שבראשה ניצבה דמותו של בכחוס, שוקע קווברי – כד חרס ליין – והקירות
    חופו בעץ אלון וערמון. במרחק שתי ורסטאות שוכן מה שתיאור ישן מכנה "מולדת האוג'לשי", ענב אדום מגרלי שנהוג
    מסורתית להדלות גבוה על עצים; את שמו קושרים למילה המגרלית "ג'א", "עץ". המשתה הגדול האחרון נערך ב-1897,
    בחתונתם של לוסיין מירא ומארי דה רוהאן-שאבו.


    כיום הבית שקט ולעתים קרובות נעול; אין בו מוזיאון ואין קופה. כנסייה פעילה בשטח מעניקה למקום את חיי
    היומיום שלו. הקיפו את החומות, דמיינו את מאה השוורים ואת בכחוס מעל האש, והקשיבו: הדממה כאן נשמעת כמו
    השתיקה שאחרי הרמת כוסית.
  tip: >-
    הקדישו שעה. הארמון נעול לעתים קרובות, והשיפוץ התחיל ונתקע כמה פעמים לאורך השנים, אז כל הצצה פנימה
    היא בונוס. בשטח יש כנסייה פעילה: כסו כתפיים וברכיים, דברו בשקט ובקשו רשות לפני שאתם מצלמים אנשי כמורה.
    אין בית קפה – הביאו אוכל ממרטווילי או תכננו שם ארוחת צהריים. השבילים עשויים דשא וחימר והופכים חלקלקים
    אחרי גשם, לכן נעלו נעליים סגורות. הסתיו הוא הזמן הטוב ביותר, כשהאוג'לשי המבשיל באיחור נבצר ברחבי סמגרלו
    והאוויר מריח מתירוש טרי.
  route: >-
    כ-312 ק"מ ו-4 שעות ו-40 דקות מטביליסי. סעו מערבה בכביש המהיר E60 על פני קוטאיסי עד סמטרדיה והלאה עד
    אבשה, ואז פנו צפונה לכיוון מרטווילי; סלחינו נמצא כ-15 ק"מ צפונה משם. הכביש המהיר והכביש אבשה–מרטווילי
    סלולים היטב, אבל הקטע הכפרי האחרון צר ומטולא, עם בורות שמעמיקים אחרי גשם. השילוט דל – שאלו את המקומיים
    על "דדיאנביס סאסאחלה" (ארמון בית דדיאני). תדלקו באבשה או במרטווילי. במזג אוויר יבש רכב אקונומי יסתדר;
    אחרי תקופה גשומה יועיל מרווח הגחון הגבוה של קרוסאובר.
ar:
  name: مقر دادياني في سالخينو
  short: >-
    «بيت الولائم» لآل دادياني شمال مارتفيلي: قصر حجري ثُبّتت في قاعته الكبرى جرّة كفيفري، قرب الموطن القديم
    لعنب الأوجاليشي.
  body: >-
    **الاسم بحد ذاته وعد: فـ«سالخينو» مشتق من الكلمة الجورجية «لخيني»، أي الوليمة، وطوال معظم القرن التاسع
    عشر كان أمراء ميغريليا يأتون إلى هنا ليفوا به.** تقع القرية على ارتفاع 250 مترًا عند سفوح تلال كفيبي،
    ويقوم القصر على ضفة جدول تساتشخورا الذي اشتهر قديمًا بسمك التروتة.


    في 1825–26 لم يكن هنا سوى بيت خشبي بسيط من طراز «أودا»، مسكن الأميرة الأرملة آنا. وبمشورة الأمير أرتشيل
    وغيورغي غيغيليا شرع ليفان الخامس دادياني (حكم 1804–1840) في بناء قصر حجري من طابقين، لم يتخذ شكله
    النهائي إلا لاحقًا، في عهد سالومي مورات. وكما في زوغديدي، تولّى العمل بنّاؤون أتراك ويونانيون. جرّ
    القرويون الحجارة من ليتسافي القريبة على زلاجات تسحبها مئة زوج من الثيران والجواميس، وتوفي كبير البنّائين،
    عثمان، قبل أن يكتمل البناء.


    كان كل شيء يدور حول النبيذ. ضمّ الطابق الأرضي «ماراني» — قبو نبيذ — طوله 35 مترًا وعرضه 10 أمتار،
    يحمل سقفه أعمدة من البلوط؛ وفي القاعة الكبرى، إلى جانب مدفأة ضخمة يعلوها تمثال لباخوس، ثُبّتت جرّة
    «كفيفري» الفخارية، وكُسيت الجدران بخشب البلوط والكستناء. وعلى مسافة فرستين يقع ما يسميه وصف قديم «موطن
    الأوجاليشي»، العنب الأحمر الميغريلي الذي جرت العادة أن يُرفع عاليًا على الأشجار، ويُربط اسمه بالكلمة
    الميغريلية «جا»، أي «شجرة». أقيمت آخر وليمة كبرى عام 1897، في زفاف لوسيان مورات وماري دو روهان-شابو.


    اليوم يلفّ البيتَ الهدوءُ وكثيرًا ما يكون مغلقًا؛ فلا متحف ولا شباك تذاكر. وتمنح كنيسةٌ عاملة في الأرض
    المحيطة المكانَ حياته اليومية. طُف حول الجدران، وتخيّل الثيران المئة وباخوس فوق النار، ثم أنصت: للصمت
    هنا وقعُ الوقفة التي تلي نخبًا.
  tip: >-
    خصّص ساعة. القصر مغلق في أغلب الأحيان، وقد بدأ الترميم وتعثّر مرارًا على مرّ السنين، فاعتبر أي لمحة
    إلى الداخل مكسبًا إضافيًا. في الأرض المحيطة كنيسة عاملة: غطِّ الكتفين والركبتين، واخفض صوتك، واستأذن
    قبل تصوير رجال الدين. لا يوجد مقهى — أحضر طعامك من مارتفيلي أو خطّط لتناول الغداء هناك. الممرات من
    عشب وطين وتصبح زلقة بعد المطر، فارتدِ حذاءً مغلقًا. الخريف أفضل الأوقات، حين يُقطف الأوجاليشي المتأخر
    النضج في أنحاء ساميغريلو ويعبق الهواء برائحة العصير الطازج.
  route: >-
    نحو 312 كم و4 ساعات و40 دقيقة من تبليسي. اسلك الطريق السريع E60 غربًا مرورًا بكوتايسي حتى سامتريديا
    ثم إلى أباشا، ومنها انعطف شمالًا نحو مارتفيلي؛ وتقع سالخينو على بُعد نحو 15 كم أخرى إلى الشمال. الطريق
    السريع وطريق أباشا–مارتفيلي من إسفلت جيد، أما المقطع القروي الأخير فضيّق مرقّع، فيه حفر تزداد عمقًا
    بعد المطر. اللافتات قليلة، فاسأل الأهالي عن «داديانبيس ساساخلي» (قصر آل دادياني). تزوّد بالوقود في
    أباشا أو مارتفيلي. في الطقس الجاف تكفي سيارة اقتصادية، وبعد فترة ممطرة تنفعك سيارة كروس أوفر بخلوصها
    الأرضي الأعلى.
