ka:
  name: ლენტეხის ლადო მუსელიანის სახელობის მხარეთმცოდნეობის მუზეუმი
  short: >-
    ქვემო სვანეთის რაიონული მუზეუმი: ბრინჯაოს ხანის აღმოჩენები, XI–XII საუკუნეების საეკლესიო ნივთები და
    XVII–XVIII საუკუნეებში ხელით გადაწერილი ლოცვები.
  body: >-
    **ქვემო სვანეთი თავის წარსულს მიმოფანტულ კოშკებსა და მოხატულ ეკლესიებში ინახავს; ლენტეხის მხარეთმცოდნეობის
    მუზეუმში ის ერთ ჭერქვეშაა შეკრებილი და დალაგებული.**


    ლენტეხი მუნიციპალიტეტის ცენტრია, ცხენისწყლის ხეობაში, 760 მეტრზე. 1953 წლამდე მას ლექსურა ერქვა, რაიონის
    ცენტრი კი 1930 წელს გახდა; 2014 წლის აღწერით დაბაში სულ 947 კაცი ცხოვრობდა. მუზეუმი ლადო მუსელიანის
    სახელს ატარებს. ეს მხარე ოდესღაც კოლხეთისა და ეგრისის ნაწილი იყო, შემდეგ გაერთიანებული საქართველოს
    სამეფოსი, გვიან საუკუნეებში კი გელოვანების სამფლობელო, რომელიც დროებით ოდიშის დადიანებმაც დაიმორჩილეს.


    კოლექციაში ოთხი ფენა გამოირჩევა: ბრინჯაოს ხანის არქეოლოგიური მასალა, XI–XII საუკუნეების საეკლესიო
    ნივთები, XVII–XVIII საუკუნეებში ხელით გადაწერილი ლოცვები და ქვემო სვანეთის ეთნოგრაფიული ნივთები. ყოველი
    მათგანი ხეობის რომელიმე კუთხეს უკავშირდება: IX–XI საუკუნეების ეკლესიებს, რომელთა ფრესკები ხშირად გარე
    კედლებზეცაა გადმოსული, რაც სვანეთისთვისაა დამახასიათებელი, და სოფლებს, სადაც ახლაც სვანურად ლაპარაკობენ.


    სავარაუდოდ, ერთ საათზე მეტს აქ არ დაჰყოფთ. მუზეუმი საგნებით დახატულ რუკად აღიქვით — მერე კი ხეობაში
    ადით და დედნები თავად მოძებნეთ.
  tip: >-
    სამუშაო საათები და შესვლის ფასი ინტერნეტში არ ქვეყნდება: წინა დღეს სასტუმროს მასპინძელს სთხოვეთ დარეკვა,
    ან მუნიციპალიტეტის შენობაში იკითხეთ. მუზეუმი დაბის ცენტრშია, სასტუმროებიდან და ავტოსადგურიდან ფეხით
    მისასვლელი; მანქანა მოედანთან დატოვეთ. ლენტეხში ბანკომატიც არის და მაღაზიებიც, ზესხოსა და ცანასკენ
    კი აღარაფერი დაგხვდებათ — ნაღდი ფული აქვე აიღეთ. აქ წვიმა ივლისშიც ხშირია, ამიტომ მუზეუმი ცუდი ამინდის
    დღისთვის კარგი არჩევანია. თუ ზემოთ მუაშის წყაროებისკენ მიდიხართ, ჯერ აქ შემოიარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ ქუთაისამდე, იქიდან ჩრდილოეთით ცაგერამდე, ცაგერიდან კი
    შ15-ით ცხენისწყლის ხეობას აჰყევით ლენტეხამდე — დაახლოებით 320 კმ და ხუთნახევარი საათი. გზა თითქმის
    მთლიანად ასფალტიანია, მაგრამ ცაგერის ზემოთ ვიწრო და დაკერებულია, ძლიერი წვიმის შემდეგ კი ქვაც ცვივა.
    გირჩევთ მაღალი გამავლობის მანქანას — ამ ხეობაში უფრო მშვიდად იგრძნობთ თავს, თუმცა მშრალ ამინდში ეკონომ-კლასის
    მანქანაც ჩადის. საწვავი ქუთაისში ჩაასხით; ცაგერშიც არის ბენზინგასამართი, მაგრამ არჩევანი მცირეა. მუზეუმი
    დაბის ცენტრშია.
en:
  name: Lentekhi Local Lore Museum
  short: >-
    Lower Svaneti's district museum: Bronze Age finds, church objects of the 11th–12th centuries and prayers
    copied by hand in the 17th and 18th.
  body: >-
    **Lower Svaneti keeps its past scattered among towers and painted churches; in Lentekhi's local lore
    museum it is brought under one roof and set in order.**


    Lentekhi is the municipal centre, in the Tskhenistskali gorge at 760 metres. It was called Leksura
    until 1953 and became a district centre in 1930; the 2014 census counted just 947 people in the town.
    The museum bears the name of Lado Museliani. This corner of Georgia was part of Colchis and then Egrisi,
    later of the united Georgian kingdom, and in later centuries was held by the Gelovani princes, with
    the Dadiani of Mingrelia ruling it for a time.


    Four layers stand out in the collection: Bronze Age archaeology, church objects from the 11th and
    12th centuries, prayers copied by hand in the 17th and 18th, and the ethnography of Lower Svaneti.
    Each points somewhere up the valley. There are churches of the 9th to 11th centuries, whose frescoes
    often spill onto the outer walls, a Svan hallmark. There are villages where Svan is still spoken.


    You are unlikely to need more than an hour. Treat it as a map drawn in objects, then drive up the
    valley and find the originals.
  tip: >-
    Opening hours and the entry fee are not published online, so ask your guesthouse host to phone the
    day before, or enquire at the municipal building. The museum is in the town centre, a walk from the
    hotels and the bus stand; leave the car by the square. Lentekhi has a cash machine and shops, but
    towards Zeskho and Tsana you will find neither, so take cash here. Rain is frequent even in July,
    which makes the museum a good wet-day plan. If you are heading up to the Muashi springs, stop here
    first.
  route: >-
    From Tbilisi take the E60 (S1) west to Kutaisi, then head north to Tsageri and follow the Sh15 up
    the Tskhenistskali gorge to Lentekhi: about 320 km and five and a half hours. The road is almost all
    asphalt, but above Tsageri it is narrow and patched, and rockfall is not unusual after heavy rain.
    We recommend an SUV, which is simply calmer in this gorge, though an economy car gets through in dry
    weather. Fill up in Kutaisi; Tsageri has a station, but little choice. The museum is in the centre
    of town.
ru:
  name: Лентехский краеведческий музей
  short: >-
    Районный музей Нижней Сванетии: находки бронзового века, церковные предметы XI–XII веков и молитвы,
    переписанные от руки в XVII–XVIII веках.
  body: >-
    **Нижняя Сванетия хранит своё прошлое вразброс — по башням и расписанным церквям; в краеведческом
    музее Лентехи оно собрано под одной крышей и разложено по порядку.**


    Лентехи — центр муниципалитета, он стоит в ущелье Цхенисцкали на высоте 760 метров. До 1953 года посёлок
    назывался Лексура, районным центром стал в 1930-м; перепись 2014 года насчитала здесь всего 947 жителей.
    Музей носит имя Ладо Муселиани. Этот уголок Грузии входил в Колхиду, затем в Эгриси, позже в единое
    Грузинское царство, а в последующие века им владели князья Геловани; какое-то время здесь правили
    и Дадиани, владетели Мегрелии.


    В собрании выделяются четыре пласта: археология бронзового века, церковные предметы XI и XII веков,
    молитвы, переписанные от руки в XVII и XVIII веках, и этнография Нижней Сванетии. Каждый из них указывает
    куда-то вверх по долине. Там стоят церкви IX–XI веков, чьи фрески нередко выходят на наружные стены
    — что характерно для Сванетии. Там есть сёла, где до сих пор говорят по-свански.


    Больше часа вам здесь вряд ли понадобится. Смотрите на музей как на карту, нарисованную предметами,
    а потом поезжайте вверх по долине и отыщите оригиналы.
  tip: >-
    Часы работы и цена билета в интернете не опубликованы, поэтому попросите хозяина гостевого дома позвонить
    накануне или узнайте в здании муниципалитета. Музей в центре городка, в пешей доступности от гостиниц
    и автостанции; машину оставьте у площади. В Лентехи есть банкомат и магазины, а в сторону Зесхо и
    Цаны не будет ни того ни другого, так что наличные берите здесь. Дожди идут часто даже в июле, и музей
    — хороший план на ненастный день. Если едете к источникам Муаши, сначала загляните сюда.
  route: >-
    Из Тбилиси по E60 (S1) на запад до Кутаиси, затем на север до Цагери и по Sh15 вверх по ущелью Цхенисцкали
    до Лентехи: около 320 км и пять с половиной часов. Дорога почти целиком асфальтовая, но выше Цагери
    она узкая и в заплатах, а после сильных дождей нередки камнепады. Мы советуем внедорожник — в этом
    ущелье с ним просто спокойнее, хотя в сухую погоду проедет и машина эконом-класса. Заправьтесь в Кутаиси;
    в Цагери заправка есть, но выбор небогат. Музей находится в центре городка.
fa:
  name: موزهٔ تاریخ و فرهنگ محلی لنتخی
  short: >-
    موزهٔ منطقه‌ای سوانتی پایین: یافته‌های عصر مفرغ، اشیای کلیسایی سده‌های یازدهم و دوازدهم و دعاهایی
    که در سده‌های هفدهم و هجدهم با دست نسخه‌برداری شده‌اند.
  body: >-
    **سوانتی پایین گذشته‌اش را پراکنده میان برج‌ها و کلیساهای نقاشی‌شده نگه می‌دارد؛ در موزهٔ تاریخ و
    فرهنگ محلی لنتخی این گذشته زیر یک سقف گرد آمده و سامان یافته است.**


    لنتخی مرکز شهرستان است و در درّهٔ تسخنیستسکالی، در ارتفاع ۷۶۰ متری، قرار دارد. نامش تا سال ۱۹۵۳ لکسورا
    بود و در ۱۹۳۰ مرکز بخش شد؛ سرشماری ۲۰۱۴ تنها ۹۴۷ نفر را در این شهرک شمرد. موزه نام لادو موسلیانی را
    بر خود دارد. این گوشه از گرجستان بخشی از کلخیس و سپس اگریسی بود، بعدها بخشی از پادشاهی یکپارچهٔ گرجستان،
    و در سده‌های پسین در دست شاهزادگان گلوانی بود؛ مدتی نیز دادیانی‌ها، فرمانروایان مگرلی، بر آن حکم راندند.


    در این مجموعه چهار لایه برجسته است: باستان‌شناسی عصر مفرغ، اشیای کلیسایی سده‌های یازدهم و دوازدهم،
    دعاهایی که در سده‌های هفدهم و هجدهم با دست نسخه‌برداری شده‌اند، و مردم‌نگاری سوانتی پایین. هر یک به
    جایی در بالادست درّه اشاره می‌کند. آنجا کلیساهایی از سده‌های نهم تا یازدهم هست که نقاشی‌های دیواری‌شان
    اغلب تا دیوارهای بیرونی سرریز می‌شود، که از ویژگی‌های سوانتی است. آنجا روستاهایی هست که هنوز به زبان
    سوانی سخن می‌گویند.


    بعید است بیش از یک ساعت وقت لازم داشته باشید. موزه را نقشه‌ای بدانید که با اشیا کشیده شده، سپس در
    درّه بالا بروید و نمونه‌های اصلی را پیدا کنید.
  tip: >-
    ساعات کار و بهای ورودی در اینترنت منتشر نشده است؛ پس از میزبان مهمان‌خانه بخواهید روز پیش تماس بگیرد،
    یا در ساختمان شهرداری جویا شوید. موزه در مرکز شهرک است و تا هتل‌ها و ایستگاه اتوبوس پیاده راهی نیست؛
    خودرو را کنار میدان بگذارید. لنتخی خودپرداز و مغازه دارد، اما به سوی زسخو و تسانا هیچ‌کدام را نخواهید
    یافت، پس پول نقد را همین‌جا بگیرید. حتی در ژوئیه هم باران زیاد می‌بارد و موزه برنامهٔ خوبی برای روز
    بارانی است. اگر به سوی چشمه‌های مواشی می‌روید، اول به اینجا سر بزنید.
  route: >-
    از تفلیس با E60 (S1) به سوی غرب تا کوتائیسی بروید، سپس به شمال تا تساگری و از Sh15 در درّهٔ تسخنیستسکالی
    بالا تا لنتخی: حدود ۳۲۰ کیلومتر و پنج ساعت و نیم. جاده تقریباً سراسر آسفالت است، اما بالاتر از تساگری
    باریک و وصله‌پینه‌دار است و پس از باران‌های سنگین ریزش سنگ غیرعادی نیست. خودروی شاسی‌بلند را توصیه
    می‌کنیم، چون در این تنگه خیال را آسوده‌تر می‌کند، هرچند در هوای خشک خودروی اقتصادی هم می‌گذرد. در
    کوتائیسی سوخت‌گیری کنید؛ تساگری پمپ‌بنزین دارد، اما حق انتخاب چندانی نیست. موزه در مرکز شهرک است.
he:
  name: המוזיאון לתולדות האזור בלנטחי
  short: >-
    המוזיאון האזורי של סוונטי התחתונה: ממצאים מתקופת הברונזה, תשמישי כנסייה מהמאות ה-11–12 ותפילות שהועתקו
    ביד במאות ה-17 וה-18.
  body: >-
    **סוונטי התחתונה שומרת את עברה מפוזר בין מגדלים וכנסיות מצוירות; במוזיאון לתולדות האזור בלנטחי הוא
    מכונס תחת קורת גג אחת ומסודר.**


    לנטחי היא מרכז המחוז, והיא שוכנת בערוץ הצחניסצקאלי בגובה 760 מטר. עד 1953 נקראה לקסורה, ובשנת 1930
    הפכה למרכז נפה; מפקד 2014 מנה בעיירה 947 תושבים בלבד. המוזיאון נושא את שמו של לאדו מוסליאני. פינה
    זו של גאורגיה הייתה חלק מקולכיס ואחר כך מאגריסי, מאוחר יותר מהממלכה הגאורגית המאוחדת, ובמאות שלאחר
    מכן החזיקו בה נסיכי בית גלובני, ולתקופה מסוימת שלטו בה בני דדיאני, שליטי מגרליה.


    באוסף בולטות ארבע שכבות: ארכאולוגיה מתקופת הברונזה, תשמישי כנסייה מהמאות ה-11 וה-12, תפילות שהועתקו
    ביד במאות ה-17 וה-18, והאתנוגרפיה של סוונטי התחתונה. כל אחת מהן מצביעה אל מקום כלשהו במעלה העמק. שם
    עומדות כנסיות מהמאות ה-9 עד ה-11, שציורי הקיר שלהן גולשים לעיתים קרובות אל הקירות החיצוניים – תופעה
    האופיינית לסוונטי. שם יש כפרים שבהם עדיין מדברים סוואנית.


    לא סביר שתזדקקו ליותר משעה. ראו במוזיאון מפה משורטטת בחפצים, ואז סעו במעלה העמק ומצאו את המקוריים.
  tip: >-
    שעות הפתיחה ודמי הכניסה אינם מפורסמים ברשת, לכן בקשו ממארחכם בבית ההארחה להתקשר יום קודם, או בררו
    בבניין העירייה. המוזיאון נמצא במרכז העיירה, במרחק הליכה מבתי המלון ומתחנת האוטובוס; השאירו את הרכב
    ליד הכיכר. בלנטחי יש כספומט וחנויות, אבל לכיוון זסחו וצאנה לא תמצאו לא את זה ולא את זה, אז משכו מזומן
    כאן. גשם יורד לעיתים קרובות אפילו ביולי, והמוזיאון הוא תוכנית טובה ליום גשום. אם אתם בדרך למעיינות
    מואשי, עצרו כאן קודם.
  route: >-
    מטביליסי סעו מערבה בכביש E60 (S1) עד קוטאיסי, משם צפונה עד צאגרי, ובכביש Sh15 במעלה ערוץ הצחניסצקאלי
    עד לנטחי: כ-320 ק״מ וחמש שעות וחצי. הכביש סלול כמעט כולו, אבל מעל צאגרי הוא צר ומלא טלאים, ואחרי גשמים
    כבדים נפילות אבנים אינן נדירות. אנו ממליצים על רכב פנאי-שטח, פשוט כי בערוץ הזה נוסעים איתו בראש שקט,
    אם כי במזג אוויר יבש יעבור גם רכב חסכוני. תדלקו בקוטאיסי; בצאגרי יש תחנה, אבל מבחר מועט. המוזיאון
    נמצא במרכז העיירה.
ar:
  name: متحف لنتيخي للتراث المحلي
  short: >-
    المتحف المحلي لسوانيتي السفلى: لقى من العصر البرونزي، وأدوات كنسية من القرنين الحادي عشر والثاني عشر،
    وصلوات نُسخت باليد في القرنين السابع عشر والثامن عشر.
  body: >-
    **تحفظ سوانيتي السفلى ماضيها موزّعاً بين الأبراج والكنائس المزيّنة بالرسوم؛ وفي متحف لنتيخي للتراث
    المحلي يُجمع هذا الماضي تحت سقف واحد ويُرتَّب.**


    لنتيخي مركز البلدية، تقع في وادي تسخينيستسكالي على ارتفاع 760 متراً. كان اسمها ليكسورا حتى عام 1953،
    وصارت مركز ناحية في عام 1930، ولم يُحصِ تعداد 2014 فيها سوى 947 نسمة. يحمل المتحف اسم لادو موسيلياني.
    كانت هذه الزاوية من جورجيا جزءاً من كولخيس ثم إغريسي، ولاحقاً من المملكة الجورجية الموحّدة، وفي القرون
    التالية صارت في يد أمراء غيلوفاني، وحكمها آل دادياني، سادة ميغريليا، حيناً من الزمن.


    تبرز في المجموعة أربع طبقات: آثار العصر البرونزي، وأدوات كنسية من القرنين الحادي عشر والثاني عشر،
    وصلوات نُسخت باليد في القرنين السابع عشر والثامن عشر، والإثنوغرافيا الخاصة بسوانيتي السفلى. وكل منها
    يشير إلى موضع ما في أعلى الوادي. فهناك كنائس من القرن التاسع إلى الحادي عشر كثيراً ما تفيض جدارياتها
    على جدرانها الخارجية، وهي سمة مميزة لسوانيتي. وهناك قرى ما زالت تتكلم السوانية.


    لن تحتاج على الأرجح إلى أكثر من ساعة. انظر إلى المتحف كخريطة مرسومة بالأشياء، ثم اصعد في الوادي وابحث
    عن الأصول.
  tip: >-
    ساعات العمل ورسم الدخول غير منشورة على الإنترنت، فاطلب من مضيفك في بيت الضيافة أن يتصل قبلها بيوم،
    أو استفسر في مبنى البلدية. يقع المتحف في وسط البلدة، على مسافة مشي من الفنادق ومحطة الحافلات؛ اترك
    السيارة عند الساحة. في لنتيخي صراف آلي ومتاجر، لكنك لن تجد هذا ولا ذاك في اتجاه زيسخو وتسانا، فاسحب
    النقد هنا. المطر كثير حتى في تموز/يوليو، والمتحف خطة جيدة ليوم ماطر. وإن كنت متجهاً إلى ينابيع مواشي
    فتوقّف هنا أولاً.
  route: >-
    من تبليسي خذ الطريق E60 (S1) غرباً إلى كوتايسي، ثم شمالاً إلى تساغيري، واتبع الطريق Sh15 صعوداً في
    وادي تسخينيستسكالي حتى لنتيخي: نحو 320 كم وخمس ساعات ونصف. الطريق معبّد بكامله تقريباً، لكنه فوق تساغيري
    ضيق ومرقّع، وتساقط الصخور بعد الأمطار الغزيرة ليس نادراً. ننصح بسيارة دفع رباعي، فهي ببساطة أبعث على
    الطمأنينة في هذا الوادي، وإن كانت السيارة الاقتصادية تعبر في الطقس الجاف. تزوّد بالوقود في كوتايسي؛
    ففي تساغيري محطة لكن الخيارات قليلة. المتحف في وسط البلدة.
