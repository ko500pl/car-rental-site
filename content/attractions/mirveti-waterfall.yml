ka:
  name: მირვეთის ჩანჩქერი
  short: >-
    დაახლოებით ოცმეტრიანი ჩანჩქერი კოლხურ ტყეში და ახლოს — ერთთაღიანი შუა საუკუნეების ხიდი: გრილი საათი
    ბათუმიდან სულ ახლოს.
  body: >-
    **ბათუმის ცათამბჯენებიდან ოციოდე კილომეტრში ნაკადული კოლხურ ტყეში დაახლოებით ოცი მეტრიდან ეშვება —
    და ქალაქი თითქოს ქრება.** მირვეთი ჭოროხის მარცხენა ნაპირზე მდებარე პატარა სოფელია — 2014 წლის აღწერით
    აქ 57 კაცი ცხოვრობდა — იმ გზაზე, რომელიც მდინარეს სამხრეთით, მაჭახლის ხეობისკენ მიუყვება.


    ჩანჩქერამდე ბილიკი მოკლე და ჩრდილიანია. ის კოლხურ ტყეში, გზამკვლევებში ბზის ხეივნად მოხსენიებულ ადგილას
    გადის — კოლხური ბზა დღეს საქართველოს წითელ ნუსხაშია შეტანილი, — ღეროებს სურო ეხვევა, ყოველ ქვას ხავსი
    ფარავს და ივლისშიც კი ჰაერი სანაპიროსთან შედარებით შესამჩნევად გრილია. ათ-თხუთმეტ წუთში წყლის ხმა
    თავად ჩანჩქერზე ადრე მოგეგებებათ: თეთრი ზოლი მუქ კლდის კედელზე სრიალებს და არაღრმა აუზში ეშვება.


    ჩანჩქერიდან დაახლოებით ოთხას მეტრში მირვეთის ნამდვილი საუნჯე დგას. XI–XIII საუკუნეების ქვის ხიდი ერთი
    თაღით გადადის მირვეთის წყალზე, ჭოროხთან შესართავის სიახლოვეს. ბურჯები არ სჭირდება — ორივე ბოლოთი პირდაპირ
    კლდეს ეყრდნობა. შუაში ორმეტრიანი, წყლიდან ხუთი მეტრის სიმაღლეზე გადებული ეს ხიდი ოდესღაც შავი ზღვის
    სანაპიროდან ჭოროხის აღმა, ტაო-კლარჯეთისკენ მიმავალ გზას ემსახურებოდა — ისტორიული საქართველოს იმ მიწებისკენ,
    რომლებიც დღეს თურქეთის საზღვარს მიღმაა. გვერდით ციხის გალავნის ნაშთები და კარგად თლილი ქვით ნაგები
    ეკლესიის ნანგრევები შემორჩა.


    ადგილობრივები მას თამარის ხიდს უწოდებენ. ტრადიცია ამ სახელს აჭარის ბევრ ძველ თაღოვან ხიდს მიაკუთვნებს
    და მეფე თამარის კავშირს სწორედ ამ ხიდთან არცერთი საბუთი არ ადასტურებს; მაგრამ მწვანე წყლის თავზე,
    გაცვეთილ ფილებზე რომ დადგებით, მიხვდებით, რატომ მოუნდა ხალხს მისთვის მეფის სახელის დარქმევა.


    ჩამოდით გვიან გაზაფხულზე, როცა ჩანჩქერი ყველაზე უხვია, ან შუა ზაფხულში, როცა აუზში ფეხების ჩაყოფაც
    საკმარისი მიზეზია ამ გზისთვის.
  tip: >-
    შესვლა უფასოა. ბილიკი მარტივია, მაგრამ ხავსიანი ქვები წვიმის შემდეგ მოლიპულია: ჩაიცვით დახურული, კარგი
    ძირის მქონე ფეხსაცმელი და არა ჩუსტები. ზაფხულში 11:00-მდე მიდით, სანამ ბათუმიდან ექსკურსიები და ოჯახები
    ჩამოვლენ. სოფელში პატარა სადგომია, სხვა თითქმის არაფერი — ჩანჩქერთან არც მაღაზიაა და არც ნორმალური
    ტუალეტი, ამიტომ წყალი და წასახემსებელი თან იქონიეთ; მაჭახლის ხეობაში, უფრო ზემოთ, საოჯახო კაფეები
    აჭარულ კერძებს გთავაზობენ. აუზი ბავშვებისთვის საკმაოდ არაღრმაა, ოღონდ მეთვალყურეობით. ჩანჩქერის გვერდით
    სველ კლდეზე ნუ აძვრებით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, შემდეგ ს12-ით (E692) გრიგოლეთამდე, ზღვის პირას,
    და ს2-ით სამხრეთით, ქობულეთის გავლით, ბათუმამდე. ბათუმიდან შ1-ს — ბათუმი–ახალციხის გზას — გაჰყევით
    აღმოსავლეთით, ხელვაჩაურის გავლით აჭარისწყლისკენ, შემდეგ მარჯვნივ, ჭოროხის გასწვრივ სამხრეთით მიმავალ
    ადგილობრივ გზაზე გადაუხვიეთ; მირვეთი დაახლოებით 3,5 კმ-შია, ბათუმის ცენტრიდან 22 კილომეტრზე. თბილისიდან
    სულ დაახლოებით 390 კმ და 6 საათია. სოფლამდე თითქმის მთლიანად ასფალტია, ბოლოს — მოკლე სოფლის გზა. საწვავი
    ბათუმში ან ხელვაჩაურში ჩაასხით. მშრალ ამინდში ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Mirveti Waterfall
  short: >-
    A fall of some twenty metres in Colchic forest, and a single-arched medieval bridge nearby — a cool
    hour's escape from Batumi.
  body: >-
    **Twenty-odd kilometres from Batumi's towers, a stream drops some twenty metres through Colchic forest,
    and the city simply disappears.** Mirveti is a small village — 57 people at the 2014 census — on the
    left bank of the Chorokhi, on the road that follows the river south towards the Machakhela valley.


    The path to the fall is short and shaded. It runs through Colchic forest, along what guidebooks call
    a boxwood alley — Colchic boxwood is now listed as endangered in Georgia's Red Book — with ivy climbing
    the trunks and moss on every stone; even in July the air is noticeably cooler than on the coast. After
    ten or fifteen minutes the sound reaches you before the view: a white ribbon sliding down a dark rock
    wall into a shallow pool.


    About four hundred metres from the fall stands Mirveti's real treasure. The stone bridge, built between
    the 11th and 13th centuries, throws a single arch over the Mirveti stream close to where it meets
    the Chorokhi. It needs no piers — both ends rest on bare rock. Two metres wide at the crown and five
    metres above the water, it once carried the road from the Black Sea coast up the Chorokhi towards
    Tao-Klarjeti, the historic Georgian lands now across the Turkish border. Beside it survive a few stretches
    of fortress wall and the lower courses of a church in finely dressed stone.


    Locals call it Queen Tamar's Bridge. Tradition hangs her name on many of Adjara's old arches, and
    no document ties her to this one; but stand on its worn flagstones above the green water and you understand
    why people wanted a queen for it.


    Come in late spring, when the fall runs fullest, or in high summer, when cooling your feet in the
    pool is reason enough for the drive.
  tip: >-
    Entry is free. The path is easy, but the stones are mossy and slick after rain: wear closed shoes
    with grip, not flip-flops. In summer go before 11:00, ahead of the tour groups and families from Batumi.
    There is a small parking area in the village and very little else — no shop at the fall and no proper
    toilets — so bring water and a snack; family-run cafés further up the Machakhela valley serve Adjarian
    food. The pool is shallow enough for children under supervision. Resist climbing the wet rock beside
    the fall.
  route: >-
    From Tbilisi take the S1 (E60) west to Samtredia, the S12 (E692) to the coast at Grigoleti and the
    S2 south through Kobuleti to Batumi. From Batumi follow the Sh1, the Batumi–Akhaltsikhe road, east
    through Khelvachauri towards Adjaristskali, then turn right onto the local road running south along
    the Chorokhi; Mirveti is about 3.5 km further on, some 22 km from central Batumi. In all roughly 390
    km and 6 hours from Tbilisi. It is asphalt almost to the village, then a short lane. Fuel up in Batumi
    or Khelvachauri. An economy car is fine in dry weather.
ru:
  name: Водопад Мирвети
  short: >-
    Водопад высотой около двадцати метров в колхидском лесу, а рядом — средневековый однопролётный мост:
    прохладный час отдыха от Батуми.
  body: >-
    **В двадцати с лишним километрах от батумских высоток ручей падает примерно на двадцать метров сквозь
    колхидский лес — и город просто исчезает.** Мирвети — небольшое село, 57 жителей по переписи 2014
    года, на левом берегу Чорохи, на дороге, что ведёт вдоль реки на юг, к долине Мачахела.


    Тропа к водопаду короткая и тенистая. Она идёт колхидским лесом, по месту, которое путеводители называют
    самшитовой аллеей, — колхидский самшит сегодня внесён в Красную книгу Грузии как исчезающий вид, —
    плющ обвивает стволы, мох покрывает каждый камень, и даже в июле воздух здесь заметно прохладнее,
    чем на побережье. Через десять-пятнадцать минут шум воды доносится раньше, чем открывается вид: белая
    лента скользит по тёмной скале и падает в неглубокую каменную чашу.


    В четырёхстах метрах от водопада стоит настоящее сокровище Мирвети. Каменный мост, построенный между
    XI и XIII веками, перекинут одним пролётом через ручей Мирвети, у самого его впадения в Чорохи. Опоры
    ему не нужны — оба конца лежат прямо на скале. Шириной два метра посередине, на высоте пяти метров
    над водой, он когда-то служил дороге от черноморского побережья вверх по Чорохи, в Тао-Кларджети —
    исторические грузинские земли, что сегодня лежат за турецкой границей. Рядом сохранились участки крепостной
    стены и нижние ряды церкви, сложенной из тщательно отёсанного камня.


    Местные называют его мостом царицы Тамары. Традиция приписывает её имя многим старым арочным мостам
    Аджарии, и ни один документ не связывает саму царицу с этим мостом; но постойте на его истёртых плитах
    над зелёной водой — и поймёте, почему людям хотелось назвать его именем царицы.


    Приезжайте поздней весной, когда водопад полноводнее всего, или в разгар лета, когда одно лишь желание
    окунуть ноги в прохладную воду — достаточный повод для этой дороги.
  tip: >-
    Вход бесплатный. Тропа лёгкая, но камни после дождя мшистые и скользкие: наденьте закрытую обувь с
    хорошим сцеплением, а не шлёпанцы. Летом идите до 11:00, до того как приедут экскурсии и семьи из
    Батуми. В селе есть небольшая парковка и почти ничего больше — у водопада нет ни магазина, ни нормального
    туалета, — так что возьмите с собой воду и еду; выше по долине Мачахела семейные кафе подают аджарскую
    кухню. Чаша под водопадом достаточно мелкая для детей под присмотром взрослых. Не пытайтесь забраться
    на мокрую скалу рядом с водопадом.
  route: >-
    От Тбилиси по S1 (E60) на запад до Самтредиа, по S12 (E692) до побережья у Григолети и по S2 на юг
    через Кобулети до Батуми. От Батуми следуйте по Sh1 — дороге Батуми–Ахалцихе — на восток через Хелвачаури
    к Аджарисцкали, затем сверните направо на местную дорогу, идущую на юг вдоль Чорохи; до Мирвети ещё
    около 3,5 км, примерно 22 км от центра Батуми. Всего от Тбилиси — около 390 км и 6 часов. До самого
    села почти всё асфальт, затем короткий сельский проезд. Заправьтесь в Батуми или Хелвачаури. В сухую
    погоду хватит машины эконом-класса.
fa:
  name: آبشار میروتی
  short: >-
    آبشاری در حدود بیست متر، در جنگلی کولخیسی، و نزدیک آن پلی تک‌طاقهٔ سده‌های میانه — ساعتی خنک و نزدیک
    به باتومی.
  body: >-
    **بیست‌وچند کیلومتر دورتر از برج‌های باتومی، نهری در جنگلی کولخیسی از نزدیک بیست متری فرومی‌ریزد —
    و شهر به‌سادگی محو می‌شود.** میروتی روستایی کوچک است — به گفتهٔ سرشماری ۲۰۱۴، پنجاه‌وهفت نفر — بر
    کنارهٔ چپ چوروخی، در راهی که رود را به سوی جنوب، به سوی درهٔ ماچاخلا، دنبال می‌کند.


    مسیر تا آبشار کوتاه و سایه‌دار است. از میان جنگل کولخیسی، از جایی که راهنماها «خیابان شمشاد» می‌نامند،
    می‌گذرد — شمشاد کولخیسی امروز در کتاب سرخ گرجستان به‌عنوان گونهٔ در معرض خطر ثبت شده — پیچک بر تنه‌ها
    بالا می‌رود، خزه هر سنگ را می‌پوشاند، و حتی در ژوئیه هوا به‌طرز محسوسی از ساحل خنک‌تر است. پس از ده
    تا پانزده دقیقه، صدا پیش از خودِ آبشار به شما می‌رسد: نواری سفید بر دیوارهٔ تاریک صخره می‌لغزد و در
    برکه‌ای کم‌عمق فرومی‌ریزد.


    حدود چهارصد متر دورتر از آبشار، گنجینهٔ راستین میروتی ایستاده است. پل سنگی، ساخته‌شده میان سده‌های
    یازدهم و سیزدهم، با یک طاق از نهر میروتی، نزدیک به جایی که به چوروخی می‌پیوندد، می‌گذرد. نیازی به
    پایه ندارد — هر دو سرش بر صخرهٔ برهنه استوار است. با دو متر پهنا در میانه و پنج متر ارتفاع از آب،
    این پل زمانی راه ساحل دریای سیاه را به بالادست چوروخی، به سوی تائو-کلارجتی — سرزمین‌های تاریخی گرجستان
    که امروز آن‌سوی مرز ترکیه‌اند — می‌رساند. کنارش بخش‌هایی از دیوار قلعه و ردیف‌های زیرین کلیسایی از
    سنگ به‌دقت تراش‌خورده باقی مانده است.


    مردم محلی آن را پل ملکه تامار می‌نامند. سنّت این نام را بر بسیاری از پل‌های طاقی کهن آجاریا می‌نشاند،
    و هیچ سندی ملکه را به این پل خاص پیوند نمی‌دهد؛ اما کافی است بر سنگ‌فرش‌های ساییده‌اش، بالای آب سبز،
    بایستید تا دریابید چرا مردم خواستند نام ملکه‌ای بر آن بگذارند.


    در اواخر بهار بیایید، آن‌گاه که آبشار پرآب‌ترین است، یا در گرمای تابستان، آن‌گاه که تنها خیساندن پا
    در برکه، دلیلی کافی برای این راه است.
  tip: >-
    ورود رایگان است. مسیر آسان است، اما سنگ‌های خزه‌گرفته پس از باران لیزند: کفشی بسته و چسبنده بپوشید،
    نه دمپایی. در تابستان پیش از ساعت ۱۱:۰۰ بروید، پیش از رسیدن تورها و خانواده‌ها از باتومی. در روستا
    پارکینگی کوچک است و تقریباً چیز دیگری نیست — نه مغازه‌ای نزدیک آبشار و نه سرویس بهداشتی مناسبی — پس
    آب و خوراکی با خود بیاورید؛ در درهٔ ماچاخلا، بالاتر، کافه‌های خانوادگی غذاهای آجارایی سرو می‌کنند.
    برکه برای کودکان زیر نظارت به‌قدر کافی کم‌عمق است. از بالارفتن از صخرهٔ خیس کنار آبشار بپرهیزید.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب تا سامتردیا، با S12 (E692) تا ساحل در گریگولتی و با S2 به سوی جنوب
    از میان کوبولتی تا باتومی بروید. از باتومی، از Sh1 — راه باتومی–آخالتسیخه — به سوی شرق از میان خلواچائوری
    تا آجاریستسقالی بروید، سپس به راست، به راه محلی‌ای که به سوی جنوب در کنار چوروخی می‌رود بپیچید؛ میروتی
    حدود ۳٫۵ کیلومتر دورتر است، نزدیک به ۲۲ کیلومتر از مرکز باتومی. در مجموع از تفلیس حدود ۳۹۰ کیلومتر
    و شش ساعت. تا نزدیک روستا تقریباً همه آسفالت است، سپس راهی روستایی و کوتاه. در باتومی یا خلواچائوری
    سوخت‌گیری کنید. در هوای خشک، خودروی اقتصادی کافی است.
he:
  name: מפל מירוטי
  short: מפל בגובה כעשרים מטרים ביער קולכי, וסמוך לו גשר מימי הביניים בעל קשת אחת — בריחה קרירה של שעה
    מבאתומי.
  body: >-
    **עשרים ומשהו קילומטרים ממגדלי באתומי, נחל נופל כעשרים מטרים ביער קולכי — והעיר פשוט נעלמת.** מירוטי
    הוא כפר קטן — 57 תושבים לפי מפקד 2014 — על הגדה השמאלית של הצ'ורוכי, על הדרך העוקבת אחרי הנהר דרומה
    אל עמק מאצ'חלה.


    השביל למפל קצר ומוצל. הוא עובר ביער קולכי, לאורך מה שמדריכי הטיולים מכנים שדרת תאשור — התאשור הקולכי
    רשום כיום בספר האדום של גאורגיה כמין בסכנת הכחדה — עם קיסוס מטפס על הגזעים ואזוב על כל אבן; אפילו
    ביולי, האוויר קריר במידה מורגשת יותר מאשר על החוף. אחרי עשר עד חמש-עשרה דקות, קול המים מגיע אליכם
    לפני המראה: סרט לבן גולש על קיר סלע כהה ונופל לבריכה רדודה.


    כ-400 מטרים מהמפל עומד האוצר האמיתי של מירוטי. גשר האבן, שנבנה בין המאה ה-11 למאה ה-13, נמתח בקשת
    אחת מעל נחל מירוטי, קרוב למקום שבו הוא נפגש עם הצ'ורוכי. אין לו צורך בעמודי תווך — שני קצותיו נשענים
    על סלע חשוף. ברוחב שני מטרים באמצעו וחמישה מטרים מעל המים, הוא נשא בעבר את הדרך מחוף הים השחור במעלה
    הצ'ורוכי לעבר טאו-קלארג'טי — האדמות ההיסטוריות של גאורגיה שנמצאות כיום מעבר לגבול הטורקי. לצדו שרדו
    קטעים מחומת מבצר ושורות תחתונות של כנסייה מאבן מסותתת בקפידה.


    המקומיים קוראים לו גשר המלכה תמר. המסורת תולה את שמה בהרבה מגשרי הקשת העתיקים של אג'ריה, ואין תיעוד
    שמקשר אותה עצמה לגשר הזה; אך עמדו על אבניו השחוקות מעל המים הירוקים, ותבינו מדוע רצו לתת לו שם של
    מלכה.


    הגיעו בסוף האביב, כשהמפל בשיאו, או בלב הקיץ, כשטבילת הרגליים בבריכה היא כבר סיבה מספקת לנסיעה.
  tip: >-
    הכניסה חינם. השביל קל, אבל האבנים המכוסות אזוב חלקלקות אחרי גשם: נעלו נעליים סגורות עם אחיזה טובה,
    לא כפכפים. בקיץ הגיעו לפני 11:00, לפני קבוצות התיירים והמשפחות מבאתומי. יש חניון קטן בכפר וכמעט שום
    דבר נוסף — אין חנות במפל ואין שירותים ראויים — כך שהביאו מים ונשנוש; בתי קפה משפחתיים גבוה יותר בעמק
    מאצ'חלה מגישים אוכל אג'רי. הבריכה רדודה מספיק לילדים בהשגחה. הימנעו מלטפס על הסלע הרטוב לצד המפל.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה עד סמטרדיה, S12 (E692) עד לחוף בגריגולטי ו-S2 דרומה דרך קובולטי לבאתומי.
    מבאתומי המשיכו ב-Sh1, דרך באתומי–אחלציחה, מזרחה דרך חלווצ'אורי לעבר אג'ריסצקלי, ואז פנו ימינה לדרך
    המקומית הנעה דרומה לצד הצ'ורוכי; מירוטי במרחק כ-3.5 ק"מ נוספים, כ-22 ק"מ ממרכז באתומי. בסך הכל כ-390
    ק"מ ו-6 שעות מטביליסי. אספלט כמעט עד הכפר, ואז דרך כפרית קצרה. תדלקו בבאתומי או בחלווצ'אורי. במזג
    אוויר יבש, רכב חסכוני רגיל מספיק.
ar:
  name: شلال ميرفيتي
  short: >-
    شلال يبلغ ارتفاعه نحو عشرين مترًا في غابة كولخيسية، وقربه جسر من العصور الوسطى بقنطرة واحدة — ملاذ
    منعش لساعة واحدة قرب باتومي.
  body: >-
    **على مسافة عشرين كيلومترًا وزيادة من أبراج باتومي، ينحدر جدول نحو عشرين مترًا عبر غابة كولخيسية —
    وتختفي المدينة ببساطة.** ميرفيتي قرية صغيرة — 57 نسمة بحسب تعداد 2014 — على الضفة اليسرى لنهر تشوروخي،
    على الطريق الذي يتبع النهر جنوبًا نحو وادي ماتشاخيلا.


    المسار إلى الشلال قصير وظليل. يمرّ عبر الغابة الكولخيسية، على امتداد ما تسمّيه الأدلة السياحية ممرّ
    البقس — والبقس الكولخيسي مسجَّل اليوم في الكتاب الأحمر لجورجيا بصفته نوعًا مهدَّدًا بالانقراض — واللبلاب
    يتسلق الجذوع، والطحالب تغطي كل حجر؛ وحتى في يوليو يكون الهواء أبرد بوضوح من الساحل. بعد عشر إلى خمس
    عشرة دقيقة يصلك صوت الماء قبل أن تراه: شريط أبيض ينسدل على جدار صخري داكن ليسقط في بركة ضحلة.


    على نحو أربعمئة متر من الشلال يقف كنز ميرفيتي الحقيقي. الجسر الحجري، المبني بين القرنين الحادي عشر
    والثالث عشر، يمتد بقنطرة واحدة فوق جدول ميرفيتي، قرب ملتقاه بنهر تشوروخي. لا يحتاج إلى دعامات — يرتكز
    طرفاه مباشرة على الصخر العاري. بعرض مترين في منتصفه وارتفاع خمسة أمتار فوق الماء، كان يحمل قديمًا
    الطريق من ساحل البحر الأسود صعودًا بمحاذاة تشوروخي نحو تاو-كلارجيتي، الأراضي الجورجية التاريخية التي
    تقع اليوم عبر الحدود التركية. وإلى جانبه بقيت أجزاء من سور حصن وصفوف سفلية من كنيسة مبنية بحجر منحوت
    بدقة.


    يسمّيه السكان المحليون جسر الملكة تمار. تُلحق التقاليد اسمها بكثير من الجسور المقوّسة القديمة في أجاريا،
    ولا توجد وثيقة تربطها هي نفسها بهذا الجسر؛ لكن قِف على بلاطاته المتآكلة فوق الماء الأخضر، وستفهم لماذا
    أراد الناس أن ينسبوه إلى ملكة.


    تعال في أواخر الربيع، حين يكون الشلال في أوفر حالاته، أو في عزّ الصيف، حين تكون رغبة تبريد قدميك في
    البركة سببًا كافيًا لهذا الطريق.
  tip: >-
    الدخول مجاني. المسار سهل، لكن الحجارة المغطاة بالطحالب زلقة بعد المطر: انتعل حذاء مغلقًا ذا نعل مانع
    للانزلاق، لا شبشبًا. في الصيف اذهب قبل الساعة 11:00، قبل وصول الجولات والعائلات من باتومي. في القرية
    موقف سيارات صغير ولا شيء آخر تقريبًا — لا متجر عند الشلال ولا مرافق صحية مناسبة — فاحمل الماء والطعام؛
    وفي أعالي وادي ماتشاخيلا تقدّم مقاهٍ عائلية المأكولات الأجارية. البركة ضحلة بما يكفي للأطفال تحت المراقبة.
    تجنّب تسلّق الصخر المبلل قرب الشلال.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا حتى سامتريديا، ثم S12 (E692) إلى الساحل عند غريغوليتي، وS2 جنوبًا
    عبر كوبوليتي إلى باتومي. من باتومي اتبع Sh1 — طريق باتومي-أخالتسيخه — شرقًا عبر خيلفاتشاوري نحو أجاريستسكالي،
    ثم انحرف يمينًا إلى الطريق المحلي المتجه جنوبًا بمحاذاة تشوروخي؛ تبعد ميرفيتي نحو 3.5 كم أخرى، أي
    نحو 22 كم من وسط باتومي. الإجمالي من تبليسي نحو 390 كم وست ساعات. أسفلت تقريبًا حتى القرية، ثم درب
    ريفي قصير. عبّئ الوقود في باتومي أو خيلفاتشاوري. في الجو الجاف تكفي سيارة اقتصادية عادية.
