ka:
  name: მირვეთის ჩანჩქერი
  short: >-
    22-მეტრიანი ჩანჩქერი და შუა საუკუნეების ქვის თაღოვანი ხიდი მაჭახელას ხეობის შესასვლელთან — მოკლე ტყის
    ბილიკი ბათუმიდან ნახევარ საათში.
  body: >-
    **მირვეთი ის ადგილია, სადაც ბათუმის სანაპირო ხმაური ათ წუთში სუბტროპიკული ტყის სიჩუმეში იცვლება.**
    სოფელი მაჭახელას ხეობის ქვედა ნაწილშია, ბათუმიდან სულ რაღაც 15-17 კმ-ში, ჩანჩქერამდე კი მისასვლელი
    გზა თავად არის მოგზაურობის ნახევარი: ჯერ საკიდი ხიდით გადადიხარ, შემდეგ დაკლაკნილი ბილიკით ტყეში შედიხარ.


    ბილიკი ხის ჩრდილში მიდის — ირგვლივ კოლხური ტყეა, სურო და ხავსი, ტენიანი ჰაერით. დაახლოებით 10-15 წუთში
    ისმის წყლის ხმა და გამოჩნდება ჩანჩქერი: 22 მეტრი სიმაღლის წყლის ფარდა კლდის შავ კედელზე, ძირში პატარა
    აუზით.


    გზად ორი რამ ნახე:


    - **ქვის თაღოვანი ხიდი** — შუა საუკუნეების ე.წ. „თამარის ხიდი", აჭარის ერთ-ერთი ულამაზესი თაღოვანი
    ხიდი მდინარეზე

    - თავად სოფელი მირვეთი — ციტრუსის ბაღები და ტრადიციული აჭარული სახლები


    საუკეთესო დროა გვიანი გაზაფხული, როცა წყალი უხვია. ზაფხულის პაპანაქებაში ტყე მაცოცხლებელ სიგრილეს
    ინახავს, აუზში ფეხების ჩაყოფა კი ბუნებრივი ფინალია. მირვეთი იდეალურად ეწყობა მაჭახელას ან გონიოს დღიურ
    მარშრუტს.
  tip: >-
    შესვლა უფასოა. ბილიკი მარტივია, მაგრამ ქვები ხავსიანია და სველდება — საცურაო ჩუსტებით ნუ წახვალ, ჩაკეტილი
    ფეხსაცმელი ჩაიცვი. წვიმის შემდეგ ბილიკი მოლიპულია. ზაფხულში დილით მიდი — შუადღისას ექსკურსიის ჯგუფები
    ჩამოდიან. სოფელში პატარა მოედანია მანქანისთვის; მაღაზია და ტუალეტი ადგილზე თითქმის არაა, წყალი და
    საჭმელი თან წამოიღე. საბანაო აუზი ზედაპირულია — ბავშვებისთვის უსაფრთხოა ზედამხედველობით.
  route: >-
    თბილისიდან ბათუმამდე E60/S1 მაგისტრალით იმგზავრე (დაახლოებით 375 კმ, 5:30 სთ, სულ ასფალტი), შემდეგ
    ბათუმიდან სარფის მიმართულებით გაემართე და ხელვაჩაურთან მაჭახელას ხეობის გზაზე შეუხვიე. მირვეთის მისახვევი
    აჭარისწყლის ხეობის დასაწყისშივეა, მთავარი გზიდან სოფლამდე მოკლე მონაკვეთია — უმეტესად ასფალტი, ბოლო
    ასეული მეტრი სოფლის გზაა. მანქანა სოფელში რჩება, შემდეგ საკიდი ხიდი და 10-15 წუთი ფეხით. საწვავი ბათუმში
    აიღე. ეკონომ-კლასი მშრალ ამინდში საკმარისია.
en:
  name: Mirveti Waterfall
  short: >-
    A 22-metre waterfall and a medieval stone arch bridge at the mouth of the Machakhela valley — a short
    forest walk half an hour from Batumi.
  body: >-
    **Mirveti is where the noise of Batumi's seafront turns into subtropical forest silence in about ten
    minutes.** The village sits at the lower end of the Machakhela valley, only 15-17 km from Batumi,
    and the approach is half the pleasure: you cross a swaying suspension footbridge, then follow a winding
    path into the trees.


    The trail runs in deep shade through Colchic forest — ivy, moss and humid air pressing in from all
    sides. After 10-15 minutes of easy walking you hear the water, and the falls appear: a 22-metre curtain
    dropping down a dark rock wall into a small pool.


    Two things to catch on the way:


    - The **stone arch bridge** — a medieval span known locally as a "Queen Tamar bridge", one of the
    prettiest of Adjara's famous arched bridges

    - The village of Mirveti itself, with citrus orchards and traditional Adjarian houses


    Late spring is the best time, when the flow is at full strength. In the summer heat the forest holds
    a life-saving coolness, and dipping your feet in the pool is the natural finale. Mirveti pairs perfectly
    with a day trip to Machakhela National Park or Gonio fortress.
  tip: >-
    Entry is free. The walk is easy but the stones are mossy and wet — wear closed shoes with grip, not
    beach sandals, and take extra care after rain. Go in the morning in summer: tour groups arrive around
    midday. There is a small parking spot in the village, but almost no shops or toilets, so bring water
    and snacks. The pool is shallow — fine for children under supervision.
  route: >-
    From Tbilisi drive the E60/S1 to Batumi (about 375 km, 5:30, asphalt all the way), then head out of
    Batumi towards Sarpi and turn inland at Khelvachauri onto the Machakhela valley road. The Mirveti
    turnoff comes early in the Ajaristskali valley; the stretch from the main road to the village is short
    — mostly asphalt with a final bit of village track. Leave the car in the village, cross the suspension
    bridge and walk 10-15 minutes. Refuel in Batumi. An economy car copes fine in dry weather.
ru:
  name: Водопад Мирвети
  short: >-
    Водопад высотой 22 метра и средневековый каменный арочный мост у входа в Мачахельское ущелье — короткая
    лесная прогулка в получасе от Батуми.
  body: >-
    **Мирвети — это место, где шум батумской набережной за десять минут сменяется тишиной субтропического
    леса.** Деревня стоит в нижней части Мачахельского ущелья, всего в 15-17 км от Батуми, и дорога к
    водопаду — половина удовольствия: сначала переходишь качающийся подвесной мост, потом углубляешься
    в лес по извилистой тропе.


    Тропа идёт в густой тени колхидского леса — плющ, мох и влажный воздух со всех сторон. Через 10-15
    минут лёгкой ходьбы слышится вода, и открывается водопад: 22-метровая завеса, падающая по тёмной скале
    в небольшую чашу.


    По пути стоит увидеть две вещи:


    - **Каменный арочный мост** — средневековый, из тех, что здесь называют «мостами царицы Тамары», один
    из самых красивых арочных мостов Аджарии

    - Саму деревню Мирвети с цитрусовыми садами и традиционными аджарскими домами


    Лучшее время — поздняя весна, когда воды больше всего. В летнюю жару лес хранит спасительную прохладу,
    а опустить ноги в чашу водопада — естественный финал прогулки. Мирвети отлично сочетается с поездкой
    в Мачахельский нацпарк или крепость Гонио.
  tip: >-
    Вход свободный. Прогулка лёгкая, но камни мшистые и мокрые — идите в закрытой обуви с протектором,
    а не в пляжных шлёпанцах; после дождя особенно скользко. Летом приезжайте утром: к полудню подтягиваются
    экскурсионные группы. В деревне есть небольшая площадка для машин, но магазинов и туалетов почти нет
    — берите воду и перекус. Чаша мелкая, детям безопасно под присмотром.
  route: >-
    Из Тбилиси — по E60/S1 до Батуми (около 375 км, 5:30, весь путь асфальт), затем из Батуми в сторону
    Сарпи и у Хелвачаури — поворот вглубь, на дорогу Мачахельского ущелья. Съезд на Мирвети — в самом
    начале долины Аджарисцкали; участок от главной дороги до деревни короткий, в основном асфальт с финальной
    сотней метров сельской дороги. Машину оставляют в деревне, дальше подвесной мост и 10-15 минут пешком.
    Заправьтесь в Батуми. Эконом-класса в сухую погоду достаточно.
fa:
  name: آبشار میرْوتی
  short: آبشاری 22 متری و پل سنگی قوسی قرون‌وسطایی در دهانهٔ درهٔ ماچاخلا — پیاده‌روی کوتاه جنگلی، نیم
    ساعت از باتومی.
  body: >-
    **میرْوتی جایی است که هیاهوی ساحل باتومی در ده دقیقه به سکوت جنگل نیمه‌گرمسیری بدل می‌شود.** روستا
    در بخش پایینی درهٔ ماچاخلا، تنها 15 تا 17 کیلومتر از باتومی قرار دارد و خودِ راه رسیدن نیمی از لذت
    است: اول از پل معلق لرزان می‌گذرید و بعد با کوره‌راهی پیچ‌درپیچ وارد جنگل می‌شوید.


    مسیر در سایهٔ انبوه جنگل کلخیسی می‌رود — پیچک، خزه و هوای مرطوب از هر سو. پس از 10 تا 15 دقیقه پیاده‌روی
    آسان، صدای آب می‌آید و آبشار پیدا می‌شود: پرده‌ای 22 متری که از دیوارهٔ سنگی تیره در حوضچه‌ای کوچک
    فرو می‌ریزد.


    در راه دو چیز را از دست ندهید:


    - **پل سنگی قوسی** — پلی قرون‌وسطایی که اهالی «پل ملکه تامار» می‌نامند؛ از زیباترین پل‌های قوسی مشهور
    آجارا

    - خود روستای میروتی با باغ‌های مرکبات و خانه‌های سنتی آجاری


    بهترین زمان اواخر بهار است که آب پرزور است. در گرمای تابستان جنگل خنکای نجات‌بخشی دارد و فرو بردن
    پا در حوضچه پایان طبیعی گردش است. میروتی با سفر یک‌روزهٔ پارک ملی ماچاخلا یا قلعهٔ گونیو خوب جفت می‌شود.
  tip: >-
    ورود رایگان است. پیاده‌روی آسان است اما سنگ‌ها خزه‌بسته و خیس‌اند — کفش بسته و آجدار بپوشید نه دمپایی
    ساحلی؛ بعد از باران حسابی لیز است. تابستان‌ها صبح بروید: نزدیک ظهر گروه‌های تور می‌رسند. در روستا
    جای پارک کوچکی هست اما مغازه و سرویس بهداشتی تقریباً نیست — آب و خوراکی همراه ببرید. حوضچه کم‌عمق
    است و برای بچه‌ها با مراقبت امن است.
  route: >-
    از تفلیس با E60/S1 تا باتومی برانید (حدود 375 کیلومتر، 5:30 ساعت، سراسر آسفالت)، سپس از باتومی به
    سمت سارپی بروید و در خلواچائوری به جادهٔ درهٔ ماچاخلا بپیچید. جدایی مسیر میروتی همان ابتدای درهٔ آجاریس‌تسکالی
    است؛ فاصلهٔ جادهٔ اصلی تا روستا کوتاه است — بیشترش آسفالت با تکهٔ پایانی راه روستایی. خودرو را در
    روستا بگذارید، از پل معلق بگذرید و 10 تا 15 دقیقه پیاده بروید. بنزین را در باتومی بزنید. در هوای خشک
    خودروی اقتصادی کافی است.
he:
  name: מפל מירווטי
  short: מפל בגובה 22 מטר וגשר קשת אבן מימי הביניים בפתח עמק מצ'חלה — הליכת יער קצרה, חצי שעה מבתומי.
  body: >-
    **מירווטי הוא המקום שבו רעש הטיילת של בתומי מתחלף תוך עשר דקות בשקט של יער סובטרופי.** הכפר יושב בחלקו
    התחתון של עמק מצ'חלה, רק 15-17 ק"מ מבתומי, והדרך אל המפל היא חצי מהחוויה: חוצים גשר תלוי מתנדנד, ואז
    נכנסים ליער בשביל מתפתל.


    השביל עובר בצל עמוק של יער קולכי — קיסוס, טחב ואוויר לח מכל עבר. אחרי 10-15 דקות הליכה קלה נשמעים
    המים, והמפל נגלה: וילון מים בגובה 22 מטר שצונח על קיר סלע כהה אל בריכה קטנה.


    שני דברים שכדאי לתפוס בדרך:


    - **גשר קשת האבן** — גשר מימי הביניים מהסוג שמכונה כאן "גשר המלכה תמר", מהיפים שבגשרי הקשת המפורסמים
    של אג'ריה

    - הכפר מירווטי עצמו, עם מטעי הדרים ובתים אג'ריים מסורתיים


    הזמן הטוב ביותר הוא סוף האביב, כשהזרימה בשיאה. בחום הקיץ היער שומר על צינה מצילת חיים, וטבילת רגליים
    בבריכה היא הסיום הטבעי. מירווטי משתלב מצוין עם יום טיול לפארק הלאומי מצ'חלה או למבצר גוניו.
  tip: >-
    הכניסה חופשית. ההליכה קלה אבל האבנים מכוסות טחב ורטובות — נעלו נעליים סגורות עם אחיזה, לא כפכפי ים,
    והיזהרו במיוחד אחרי גשם. בקיץ בואו בבוקר: קבוצות מאורגנות מגיעות לקראת הצהריים. בכפר יש משטח חניה
    קטן אבל כמעט אין חנויות או שירותים — הביאו מים וחטיפים. הבריכה רדודה ובטוחה לילדים בהשגחה.
  route: >-
    מטביליסי נוסעים ב-E60/S1 עד בתומי (כ-375 ק"מ, 5:30 שעות, אספלט כל הדרך), ואז יוצאים מבתומי לכיוון
    סרפי ופונים פנימה בחלוואצ'אורי אל כביש עמק מצ'חלה. הפנייה למירווטי מגיעה כבר בתחילת עמק האג'ריסצקאלי;
    הקטע מהכביש הראשי לכפר קצר — רובו אספלט עם סוף של דרך כפרית. משאירים את הרכב בכפר, חוצים את הגשר התלוי
    והולכים 10-15 דקות. תדלקו בבתומי. רכב חסכוני מסתדר היטב במזג אוויר יבש.
ar:
  name: شلال ميرفيتي
  short: >-
    شلال بارتفاع 22 متراً وجسر حجري مقوس من القرون الوسطى عند مدخل وادي ماتشاخيلا — مشي قصير في الغابة
    على نصف ساعة من باتومي.
  body: >-
    **ميرفيتي هو المكان الذي يتحول فيه ضجيج كورنيش باتومي خلال عشر دقائق إلى صمت غابة شبه استوائية.**
    تقع القرية في الجزء الأسفل من وادي ماتشاخيلا، على بعد 15-17 كم فقط من باتومي، والطريق إلى الشلال نصف
    المتعة: تعبر أولاً جسراً معلقاً متمايلاً، ثم تدخل الغابة على درب متعرج.


    يمضي الدرب في ظل كثيف من غابة كولخيس — لبلاب وطحالب وهواء رطب من كل جانب. وبعد 10-15 دقيقة من مشي
    سهل يُسمع صوت الماء ويظهر الشلال: ستارة مائية بارتفاع 22 متراً تهوي على جدار صخري داكن إلى بركة صغيرة.


    شيئان يستحقان الالتفات في الطريق:


    - **الجسر الحجري المقوس** — جسر من القرون الوسطى من النوع الذي يسمونه هنا «جسر الملكة تامار»، من أجمل
    جسور أجاريا المقوسة الشهيرة

    - قرية ميرفيتي نفسها ببساتين الحمضيات وبيوتها الأجارية التقليدية


    أفضل وقت هو أواخر الربيع حين يكون الماء في أوجه. وفي قيظ الصيف تحفظ الغابة برودة منقذة، وغمس القدمين
    في البركة هو الختام الطبيعي. يتكامل ميرفيتي تماماً مع رحلة يوم إلى حديقة ماتشاخيلا الوطنية أو قلعة
    غونيو.
  tip: >-
    الدخول مجاني. المشي سهل لكن الحجارة مكسوة بالطحالب ومبتلة — البس حذاءً مغلقاً بنعل مانع للانزلاق لا
    صندل الشاطئ، وكن حذراً بعد المطر. في الصيف اذهب صباحاً: مجموعات الرحلات تصل قرابة الظهر. في القرية
    مساحة صغيرة لركن السيارة لكن لا متاجر ولا دورات مياه تقريباً — خذ ماءً وطعاماً خفيفاً. البركة ضحلة
    وآمنة للأطفال تحت المراقبة.
  route: >-
    من تبليسي قُد على E60/S1 حتى باتومي (نحو 375 كم، 5:30 ساعة، أسفلت كامل)، ثم اخرج من باتومي باتجاه
    ساربي وانعطف نحو الداخل عند خلفاتشاوري إلى طريق وادي ماتشاخيلا. مفرق ميرفيتي يأتي في بداية وادي أجاريس‌تسكالي؛
    والمسافة من الطريق الرئيسي إلى القرية قصيرة — معظمها أسفلت مع مقطع أخير من طريق قروي. اترك السيارة
    في القرية واعبر الجسر المعلق وامشِ 10-15 دقيقة. تزود بالوقود في باتومي. سيارة اقتصادية تكفي في الطقس
    الجاف.
