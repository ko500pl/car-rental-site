ka:
  name: ხაშური
  short: >-
    სარკინიგზო და საავტომობილო კვანძი შიდა ქართლის დასავლეთ კიდეზე, საიდანაც გზები ბორჯომსა და დასავლეთ
    საქართველოსკენ იშლება.
  body: >-
    **ხაშური ღირსშესანიშნაობა არ არის და არც თავს ასაღებს ასეთად — მაგრამ საქართველოში მოგზაურობისას მასზე
    გავლა თითქმის გარდაუვალია.** ქალაქი იმ წერტილში დგას, სადაც მთავარი გზა ორად იყოფა: ერთი დასავლეთისკენ,
    რიკოთის უღელტეხილზე, ქუთაისსა და ზღვისკენ; მეორე სამხრეთისკენ, ბორჯომზე, ახალციხესა და თურქეთის საზღვრისკენ.


    ეს გზაჯვარედინი ქალაქის ისტორიაა. სადგური 1871 წელს გაიხსნა ამიერკავკასიის რკინიგზაზე და მაშინ მიხაილოვო
    ერქვა; ბორჯომის განშტოებაც აქედან იწყება. საბჭოთა პერიოდში ხაშური სარკინიგზო დეპოს, საწყობებისა და
    მცირე ინდუსტრიის ქალაქი იყო. დღეს მოსახლეობა 25 ათასამდეა და ქალაქი შესამჩნევად დაცლილია.


    რას ნახავთ: ფართო ცენტრალური ქუჩა, საბჭოთა ადმინისტრაციული შენობები, ბაზარი, სადგურის შენობა და გზისპირა
    კვების რიგი. არქიტექტურული ძეგლი ან მუზეუმი, რომლისთვისაც სპეციალურად ჩამოხვიდოდით, აქ არ არის.


    რისთვისაც ღირს გაჩერება, პრაქტიკულია. ეს არის ბოლო დიდი ქალაქი ბორჯომის ხეობაში ან რიკოთის უღელტეხილზე
    შესვლამდე: სუპერმარკეტი, ბანკომატები, საბურავის შეკეთება, აფთიაქი, სამი-ოთხი წესიერი სასადილო. სურამი
    ხუთ კილომეტრშია ციხითა და ნაზუქით, ბორჯომი — ოცდაათში. ვინც ხაშურს დღეს გამოუყოფს, შეცდომას უშვებს;
    ვინც ერთ საათს — სწორად აკეთებს.
  tip: >-
    ერთი საათი პრაქტიკული გაჩერებისთვის საკმარისია. ცენტრში სუპერმარკეტი, ბანკომატები და აფთიაქი ერთმანეთის
    გვერდითაა. საწვავი ორივე შესასვლელშია და ბორჯომის გზაზეც. სასადილოები მაგისტრალის პირას მარტივია,
    მაგრამ ხაჭაპური და ლობიო კარგია. ტუალეტი გამზრდელ სადგურებზეა უფრო სუფთა, ვიდრე ბაზართან. ზამთარში
    ქუჩები ლაფიანია და ტროტუარი ყინულდება. ღამის გასათევად ბორჯომი ან სურამი ჯობია.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ გორზე გავლით — 128 კმ, დაახლოებით საათი და ორმოცი წუთი. გზა ბოლომდე
    ასფალტია და უმეტესწილად ავტობანი. ხაშურში ორი შესასვლელია, ორივე მკაფიოდ მონიშნული. აქედან ბორჯომისკენ
    სამხრეთით გაუხვევთ, დასავლეთისკენ კი რიკოთის ახალ მონაკვეთზე გადადიხართ. საწვავი და დასვენების ადგილი
    ორივე მიმართულებაზეა. ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Khashuri
  short: >-
    A rail and road junction at the western edge of Shida Kartli, where the routes to Borjomi and to western
    Georgia divide.
  body: >-
    **Khashuri is not a sight and does not pretend to be one, but almost any road trip in Georgia passes
    through it.** The town sits at the point where the main road splits: west over the Rikoti pass towards
    Kutaisi and the sea, or south through Borjomi towards Akhaltsikhe and the Turkish border.


    That junction is the town's history. The station opened in 1871 on the Transcaucasian railway under
    the name Mikhailovo, and the branch line to Borjomi still leaves from here. In the Soviet period Khashuri
    was a place of locomotive depots, warehouses and light industry. Today the population is around 25,000
    and the town is visibly emptier than it was.


    What you see: a broad central street, Soviet administrative buildings, a market, the station, and
    a row of roadside eating places. There is no monument or museum you would drive out from Tbilisi for.


    What makes it worth a stop is practical. This is the last substantial town before you commit to the
    Borjomi valley or the Rikoti pass: a full supermarket, cash machines, tyre repair, a pharmacy, and
    three or four decent canteens. Surami and its fortress are five kilometres away, Borjomi thirty. Giving
    Khashuri a day would be a mistake; giving it an hour, on the right day, is exactly right.
  tip: >-
    An hour is enough for a practical stop. The supermarket, cash machines and pharmacy in the centre
    sit within a block of each other. Fuel is available at both entrances to town and on the Borjomi road.
    The roadside canteens are plain but the khachapuri and lobio are good. Toilets at the fuel stations
    are cleaner than those near the market. In winter the streets are muddy and pavements ice over. For
    an overnight stop, Borjomi or Surami are better choices.
  route: >-
    Head west from Tbilisi on the E60 past Gori — 128 km, about an hour and forty minutes. The road is
    asphalt throughout and mostly dual carriageway. Khashuri has two exits, both clearly signed. From
    here you turn south for Borjomi or continue west onto the rebuilt Rikoti sections. Fuel and rest stops
    exist in both directions. An economy car is entirely sufficient.
ru:
  name: Хашури
  short: >-
    Железнодорожный и автомобильный узел на западном краю Шида-Картли, где расходятся дороги на Боржоми
    и в Западную Грузию.
  body: >-
    **Хашури — не достопримечательность и не притворяется ею, но почти любая поездка по Грузии проходит
    через него.** Город стоит в точке, где главная дорога раздваивается: на запад через Рикотский перевал
    к Кутаиси и морю или на юг через Боржоми к Ахалцихе и турецкой границе.


    Эта развилка и есть история города. Станция открылась в 1871 году на Закавказской железной дороге
    под названием Михайлово, и ветка на Боржоми до сих пор отходит отсюда. В советское время Хашури был
    городом депо, складов и лёгкой промышленности. Сегодня здесь около 25 тысяч жителей, и город заметно
    опустел.


    Что вы увидите: широкая центральная улица, советские административные здания, рынок, вокзал и ряд
    придорожных заведений. Памятника или музея, ради которого стоило бы ехать из Тбилиси, здесь нет.


    Останавливаться имеет смысл по практическим причинам. Это последний крупный город перед тем, как вы
    уйдёте в Боржомское ущелье или на Рикотский перевал: полноценный супермаркет, банкоматы, шиномонтаж,
    аптека и три-четыре приличные столовые. Сурами с крепостью в пяти километрах, Боржоми в тридцати.
    Отводить Хашури целый день — ошибка; отвести ему час в нужный момент — правильно.
  tip: >-
    Часа достаточно для практической остановки. Супермаркет, банкоматы и аптека в центре стоят в одном
    квартале. Заправки есть на обоих въездах и на боржомской дороге. Придорожные столовые простые, но
    хачапури и лобио хорошие. Туалеты на заправках чище, чем у рынка. Зимой улицы грязные, тротуары обледеневают.
    Для ночёвки лучше Боржоми или Сурами.
  route: >-
    Из Тбилиси на запад по E60 мимо Гори — 128 км, примерно час сорок. Дорога асфальтированная и в основном
    скоростная. У Хашури два съезда, оба хорошо обозначены. Отсюда поворот на юг ведёт в Боржоми, а на
    запад — на перестроенные участки Рикотской трассы. Заправки и места отдыха есть в обоих направлениях.
    Машины эконом-класса вполне достаточно.
fa:
  name: خاشوری
  short: گره راه‌آهن و جاده در لبهٔ غربی شیدا کارتلی، جایی که راه‌های بورجومی و غرب گرجستان از هم جدا
    می‌شوند.
  body: >-
    **خاشوری دیدنی نیست و ادعایش را هم ندارد، اما تقریباً هر سفر جاده‌ای در گرجستان از آن می‌گذرد.** شهر
    در نقطه‌ای است که جادهٔ اصلی دو شاخه می‌شود: به غرب از گردنهٔ ریکوتی به سوی کوتایسی و دریا، یا به
    جنوب از بورجومی به سوی آخالتسیخه و مرز ترکیه.


    همین دوراهی، تاریخ شهر است. ایستگاه در ۱۸۷۱ روی خط آهن ماوراء قفقاز با نام میخایلوو گشوده شد، و خط
    فرعی بورجومی هنوز از همین‌جا جدا می‌شود. در دورهٔ شوروی خاشوری شهر انبارها و تعمیرگاه‌های لکوموتیو
    و صنایع سبک بود. امروز جمعیت آن نزدیک ۲۵ هزار تن است و شهر به‌روشنی خالی‌تر از گذشته است.


    آنچه می‌بینید: خیابانی مرکزی و پهن، ساختمان‌های اداری دورهٔ شوروی، بازار، ایستگاه، و ردیفی از غذاخوری‌های
    کنار جاده. بنا یا موزه‌ای که برای آن از تفلیس راه بیفتید اینجا نیست.


    آنچه توقف را ارزشمند می‌کند، عملی است. این آخرین شهر بزرگ پیش از ورود به درّهٔ بورجومی یا گردنهٔ ریکوتی
    است: فروشگاه بزرگ، خودپرداز، پنچرگیری، داروخانه، و سه چهار غذاخوری آبرومند. سورامی با قلعه‌اش پنج
    کیلومتر و بورجومی سی کیلومتر فاصله دارد. اختصاص یک روز به خاشوری خطاست؛ اختصاص یک ساعت، در روز مناسب،
    درست است.
  tip: >-
    یک ساعت برای توقفی کاربردی کافی است. فروشگاه بزرگ، خودپردازها و داروخانه در مرکز، در یک بلوک از هم
    قرار دارند. سوخت در هر دو ورودی شهر و در جادهٔ بورجومی هست. غذاخوری‌های کنار جاده ساده‌اند اما خاچاپوری
    و لوبیو خوب می‌دهند. سرویس بهداشتی پمپ بنزین‌ها تمیزتر از سرویس نزدیک بازار است. زمستان خیابان‌ها
    گِل‌آلود و پیاده‌روها یخ‌زده‌اند. برای اقامت شبانه بورجومی یا سورامی گزینهٔ بهتری‌اند.
  route: >-
    از تفلیس به غرب روی E60 از کنار گوری — ۱۲۸ کیلومتر، حدود یک ساعت و چهل دقیقه. جاده تا انتها آسفالت
    و بیشتر دوبانده است. خاشوری دو خروجی دارد که هر دو تابلوی روشن دارند. از اینجا برای بورجومی به جنوب
    می‌پیچید و برای غرب به قطعه‌های بازسازی‌شدهٔ ریکوتی می‌روید. سوخت و توقفگاه در هر دو جهت هست. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: חשורי
  short: צומת רכבת וכביש בקצה המערבי של שידה קרתלי, שבו נפרדות הדרכים לבורג'ומי ולמערב גאורגיה.
  body: >-
    **חשורי אינה אתר תיירות ואינה מתיימרת להיות כזה, אך כמעט כל מסע כבישים בגאורגיה עובר בה.** העיירה
    יושבת בנקודה שבה הכביש הראשי מתפצל: מערבה דרך מעבר ריקוטי לכיוון קותאיסי והים, או דרומה דרך בורג'ומי
    לכיוון אחלציחה וגבול טורקיה.


    הצומת הזה הוא ההיסטוריה של העיירה. התחנה נפתחה ב-1871 על מסילת עבר הקווקז בשם מיכאילובו, וקו ההסתעפות
    לבורג'ומי עדיין יוצא מכאן. בתקופה הסובייטית הייתה חשורי עיר של מוסכי קטרים, מחסנים ותעשייה קלה. כיום
    מונה האוכלוסייה כ-25 אלף והעיירה ריקה בבירור מכפי שהייתה.


    מה שרואים: רחוב מרכזי רחב, מבני ממשל סובייטיים, שוק, תחנת הרכבת ושורת מסעדות דרכים. אין כאן אנדרטה
    או מוזיאון שבשבילם הייתם נוסעים מטביליסי.


    מה שמצדיק עצירה הוא מעשי. זו העיירה המשמעותית האחרונה לפני שנכנסים לעמק בורג'ומי או למעבר ריקוטי:
    סופרמרקט מלא, כספומטים, פנצ'ריה, בית מרקחת ושלוש-ארבע מסעדות פועלים סבירות. סורמי ומבצרה במרחק חמישה
    קילומטרים, בורג'ומי בשלושים. להקדיש לחשורי יום שלם זו טעות; להקדיש לה שעה, ביום הנכון, זה בדיוק נכון.
  tip: >-
    שעה מספיקה לעצירה מעשית. הסופרמרקט, הכספומטים ובית המרקחת במרכז נמצאים במרחק בלוק זה מזה. דלק יש בשתי
    הכניסות לעיר ובכביש לבורג'ומי. מסעדות הדרכים פשוטות אך החצ'פורי והלוביו טובים. השירותים בתחנות הדלק
    נקיים מאלה שליד השוק. בחורף הרחובות בוציים והמדרכות מכוסות קרח. ללינה עדיפות בורג'ומי או סורמי.
  route: >-
    צאו מטביליסי מערבה בכביש E60 דרך גורי — 128 ק״מ, כשעה וארבעים. הכביש סלול לכל אורכו וברובו דו-מסלולי.
    לחשורי שתי יציאות, שתיהן משולטות היטב. מכאן פונים דרומה לבורג'ומי או ממשיכים מערבה לקטעים המחודשים
    של ריקוטי. דלק ותחנות מנוחה יש בשני הכיוונים. רכב חסכוני מספיק לחלוטין.
ar:
  name: خاشوري
  short: ملتقى سكة حديد وطرق عند الطرف الغربي لشيدا كارتلي، حيث يفترق طريقا بورجومي وغرب جورجيا.
  body: >-
    **خاشوري ليست معلماً سياحياً ولا تدّعي ذلك، لكن كل رحلة برية في جورجيا تكاد تمرّ بها.** تقع البلدة
    عند النقطة التي ينقسم فيها الطريق الرئيسي: غرباً عبر ممر ريكوتي نحو كوتايسي والبحر، أو جنوباً عبر
    بورجومي نحو أخالتسيخه والحدود التركية.


    وهذا الملتقى هو تاريخ البلدة. افتُتحت المحطة عام 1871 على خط سكة حديد ما وراء القوقاز باسم ميخايلوفو،
    وما زال فرع بورجومي ينطلق من هنا. وفي العهد السوفييتي كانت خاشوري مدينة مستودعات وورش قاطرات وصناعات
    خفيفة. واليوم يقارب عدد سكانها 25 ألفاً، والبلدة أخلى بوضوح مما كانت.


    ما تراه: شارع مركزي عريض، ومبانٍ إدارية سوفييتية، وسوق، ومحطة القطار، وصف من مطاعم الطريق. ولا نصب
    ولا متحف تقود من تبليسي من أجله.


    وما يجعل التوقف مجدياً عملي. فهذه آخر بلدة ذات حجم قبل أن تدخل وادي بورجومي أو ممر ريكوتي: سوق كبير،
    وصرافات آلية، وتصليح إطارات، وصيدلية، وثلاثة أو أربعة مطاعم شعبية محترمة. سورامي وقلعتها على بعد خمسة
    كيلومترات، وبورجومي على بعد ثلاثين. وتخصيص يوم لخاشوري خطأ؛ أما ساعة، في اليوم المناسب، فصواب تام.
  tip: >-
    ساعة تكفي لتوقف عملي. السوق الكبير والصرافات والصيدلية في المركز على بعد مربّع سكني بعضها من بعض.
    والوقود متوفر عند مدخلي البلدة وعلى طريق بورجومي. ومطاعم الطريق بسيطة لكن الخاتشابوري واللوبيو جيدان.
    ودورات المياه في محطات الوقود أنظف من التي قرب السوق. وفي الشتاء تكون الشوارع موحلة والأرصفة متجمدة.
    وللمبيت، بورجومي أو سورامي خياران أفضل.
  route: >-
    اتجه غرباً من تبليسي على الطريق E60 مروراً بغوري — 128 كم، نحو ساعة وأربعين دقيقة. الطريق معبّد بكامله
    ومزدوج في معظمه. ولخاشوري مخرجان، كلاهما بلافتات واضحة. ومن هنا تنعطف جنوباً إلى بورجومي أو تتابع
    غرباً إلى مقاطع ريكوتي المعاد بناؤها. والوقود ومحطات الاستراحة متوفرة في الاتجاهين. وسيارة اقتصادية
    تكفي تماماً.
