ka:
  name: ხაშური
  short: >-
    რკინიგზის ქალაქი შიდა ქართლის დასავლეთ კიდეზე, სადაც მთავარი გზა იყოფა: ერთი ბორჯომისკენ ეშვება, მეორე
    რიკოთზე ზღვისკენ მიიწევს.
  body: >-
    **ხაშური დანიშნულების ადგილი არ არის — ეს ის წერტილია, სადაც გზა წყვეტს, საით მიდიხართ.**


    ქალაქი მდინარე სურამულას ნაპირზე, ზღვის დონიდან 700-იოდე მეტრზე, შიდა ქართლის ვაკის დასავლეთ კიდეზე
    დგას — ზუსტად იქ, სადაც ქვეყნის მთავარი მაგისტრალი ორად იტოტება. დასავლეთით გზა რიკოთის უღელტეხილისკენ,
    ქუთაისისა და შავი ზღვისკენ მიიწევს, სამხრეთით კი ბორჯომის ხეობაში ეშვება, ახალციხისა და თურქეთის საზღვრისკენ.


    ქალაქი რკინიგზამ შექმნა. ხაშური 1693 წლის სამეფო სიგელში უკვე იხსენიება, მაგრამ თანამედროვე ქალაქი
    1872 წელს თბილისი–ფოთის ხაზზე მოკრძალებული სადგურით დაიწყო, რომელსაც კავკასიის მეფისნაცვლის, დიდი
    მთავრის მიხეილ ნიკოლოზის ძის პატივსაცემად მიხაილოვო დაარქვეს. ძველი სახელი იმპერიის დაცემასთან ერთად
    დაბრუნდა, 1934 წლამდე კი ქალაქს რამდენიმე წელი სტალინისი ერქვა.


    1921 წლის მარტში სადგური ფრონტის ხაზზე აღმოჩნდა. 5 მარტს წითელმა არმიამ მიხაილოვოს შეუტია; ქართულმა
    ჯარმა შეტევა მოიგერია და საღამოს კონტრშეტევაზეც გადავიდა — ამ წარმატებამ თბილისში მყოფი საბჭოთა სარდლობა
    მოლაპარაკებაზე დააფიქრა. მომდევნო ღამით გენერალმა კონიაშვილმა დღემდე აუხსნელი მიზეზით პოზიციები მიატოვა
    და 6 მარტს სადგური დაეცა.


    დღეს ხაშური ფართო მთავარი ქუჩის, საბჭოთა ადმინისტრაციული შენობების, ხმაურიანი ბაზრისა და გზისპირა
    სასადილოების ქალაქია. XVIII საუკუნის კოშკი, იოანე ნათლისმცემლისა და წმინდა მარინეს ეკლესიები შემორჩენილია,
    მაგრამ მხოლოდ მათ სანახავად თბილისიდან აქ ჩამოსვლა არ ღირს.


    ხაშურის ღირსება პრაქტიკულია: ეს უკანასკნელი დიდი ქალაქია ბორჯომის ხეობამდე ან რიკოთის აღმართამდე —
    სუპერმარკეტით, ბანკომატებით, აფთიაქითა და საბურავების სახელოსნოთი. სურამი, თავისი ციხითა და ნაზუქის
    დახლებით, დასავლეთით რამდენიმე კილომეტრშია, ბორჯომი — სამხრეთით, ოცდაათიოდე კილომეტრზე. ხაშურს მთელი
    დღე რომ დაუთმოთ, ინანებთ; ერთი საათი და სავსე ავზი კი ზუსტად ის არის, რისთვისაც ეს ქალაქი აშენდა.
  tip: >-
    პრაქტიკული გაჩერებისთვის ერთი საათი საკმარისია. სუპერმარკეტი, ბანკომატები და აფთიაქი ცენტრში ერთმანეთისგან
    ერთი კვარტლის მანძილზეა, ბენზინგასამართი სადგურები კი ქალაქის ორივე შესასვლელთან და ბორჯომის გზაზე
    დგას. გზისპირა სასადილოები უბრალოა, მაგრამ ხაჭაპურსა და ლობიოს სწრაფად და პატიოსნად მოგართმევენ. ტუალეტი
    ბენზინგასამართ სადგურებზე, როგორც წესი, უფრო სუფთაა, ვიდრე ბაზართან. ზამთარში გვერდითი ქუჩები ტალახიანდება,
    ტროტუარები კი იყინება. ღამის გასათევად ბორჯომი ან სურამი აჯობებს.
  route: >-
    თბილისიდან E60 (ს1) მაგისტრალით დასავლეთისკენ, მცხეთისა და გორის გვერდით — 128 კილომეტრი, დაახლოებით
    საათი და ორმოცი წუთი, მთელ სიგრძეზე ასფალტით და უმეტესად ოთხზოლიანი გზით. ხაშურს ორი მკაფიოდ მონიშნული
    გასასვლელი აქვს. აქ გზა იყოფა: სამხრეთით ს8 ბორჯომისა და ახალციხისკენ მიდის, დასავლეთით კი მაგისტრალი
    სურამის გვერდით რიკოთის უღელტეხილის ახალი მონაკვეთებისკენ გრძელდება. ორივე მიმართულებით ბენზინგასამართი
    სადგურები და დასასვენებელი ადგილები ხშირია, ამიტომ ავზის შევსება აქ აუცილებელი არ არის — თუმცა ბორჯომის
    ხეობაში შესვლამდე ეს ყველაზე მოსახერხებელი წერტილია. ეკონომკლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Khashuri
  short: >-
    A railway town on the western rim of Shida Kartli, where the main road splits: south to Borjomi, west
    over the Rikoti pass to the sea.
  body: >-
    **Khashuri is not a destination; it is the place where the road decides where you are going.**


    The town stands on the Suramula river, some 700 metres up, on the western rim of the Shida Kartli
    plain, exactly where Georgia's main highway forks. West, the road climbs towards the Rikoti pass,
    Kutaisi and the Black Sea; south, it drops into the Borjomi gorge towards Akhaltsikhe and the Turkish
    border.


    The railway made the town. Khashuri appears in a royal charter of 1693, but the modern town began
    in 1872 as a modest stop on the Tbilisi–Poti line, named Mikhailovo after Grand Duke Michael Nikolaevich,
    viceroy of the Caucasus. The old name returned as the empire fell, and for a few years before 1934
    the town was called Stalinisi.


    In March 1921 the station was a front line. On 5 March the Red Army stormed Mikhailovo; Georgian troops
    threw it back and counter-attacked that evening, a success that led the Soviet command in Tbilisi
    to consider talks. In the night that followed, General Koniashvili abandoned his positions for reasons
    never explained, and on 6 March the station fell.


    Today Khashuri is a broad main street, Soviet administrative blocks, a busy market and roadside canteens.
    An 18th-century tower and the churches of St John the Baptist and St Marine survive, but none justifies
    the drive from Tbilisi alone.


    Its value is practical: this is the last sizeable town before the Borjomi gorge or the Rikoti climb,
    with a supermarket, cash machines, a pharmacy and tyre repair. Surami, with its fortress and nazuki
    bread stalls, is a few kilometres west; Borjomi about thirty kilometres south. Give Khashuri a day
    and you will resent it. Give it an hour and a full tank, and it will do exactly what it was built
    for.
  tip: >-
    An hour covers a practical stop. The supermarket, cash machines and pharmacy sit within a block of
    one another in the centre, and fuel stations stand at both ends of town and on the Borjomi road. The
    roadside canteens are plain, but their khachapuri and lobio come quickly and honestly made. Fuel-station
    toilets are usually cleaner than those by the market. In winter the side streets turn to mud and the
    pavements ice over. For the night, Borjomi or Surami make better beds.
  route: >-
    Leave Tbilisi westbound on the E60 (S1) and follow it past Mtskheta and Gori: 128 km, about 1 hour
    40 minutes, asphalt all the way and mostly dual carriageway. Khashuri has two clearly signed exits.
    Here the road divides: south, the S8 runs to Borjomi and Akhaltsikhe; west, the highway continues
    past Surami towards the new sections over the Rikoti pass. Fuel stations and rest stops are frequent
    in both directions, so there is no need to fill up here, though it is the handiest place to do so
    before the Borjomi gorge. An economy car is all you need.
ru:
  name: Хашури
  short: >-
    Железнодорожный город на западной окраине Шида-Картли, где главная трасса расходится: на юг к Боржоми,
    на запад через Рикотский перевал к морю.
  body: >-
    **Хашури — не цель поездки; это место, где дорога решает, куда вы едете.**


    Город стоит на реке Сурамула, примерно на высоте 700 метров, на западном краю Шида-Картлийской равнины
    — ровно там, где разветвляется главная трасса Грузии. На запад дорога поднимается к Рикотскому перевалу,
    Кутаиси и Чёрному морю; на юг спускается в Боржомское ущелье, к Ахалцихе и турецкой границе.


    Город сделала железная дорога. Хашури упоминается в царской грамоте 1693 года, но современный город
    начался в 1872 году со скромной станции на линии Тбилиси — Поти, названной Михайлово в честь великого
    князя Михаила Николаевича, наместника Кавказа. Старое имя вернулось, когда рухнула империя, а несколько
    лет, вплоть до 1934 года, город назывался Сталиниси.


    В марте 1921 года станция оказалась на линии фронта. 5 марта Красная армия штурмовала Михайлово; грузинские
    войска отбросили её и в тот же вечер перешли в контратаку — успех, после которого советское командование
    в Тбилиси стало подумывать о переговорах. Следующей ночью генерал Кониашвили по так и не выясненным
    причинам оставил свои позиции, и 6 марта станция пала.


    Сегодня Хашури — это широкая главная улица, советские административные корпуса, оживлённый рынок и
    придорожные столовые. Сохранились башня XVIII века и церкви Иоанна Крестителя и святой Марины, но
    ни одна из них сама по себе не оправдывает поездку из Тбилиси.


    Его ценность практическая: это последний крупный город перед Боржомским ущельем или подъёмом на Рикоти,
    с супермаркетом, банкоматами, аптекой и шиномонтажом. Сурами с крепостью и лотками хлеба назуки —
    в нескольких километрах к западу; Боржоми — примерно в тридцати километрах к югу. Отдайте Хашури день
    — и будете на него в обиде. Отдайте ему час и полный бак — и он сделает ровно то, ради чего был построен.
  tip: >-
    На практическую остановку хватит часа. Супермаркет, банкоматы и аптека в центре — в пределах одного
    квартала друг от друга, а заправки стоят на обоих концах города и на боржомской дороге. Придорожные
    столовые простые, но хачапури и лобио там подают быстро и готовят честно. Туалеты на заправках обычно
    чище, чем у рынка. Зимой боковые улицы тонут в грязи, а тротуары покрываются льдом. Ночевать лучше
    в Боржоми или Сурами.
  route: >-
    Выезжайте из Тбилиси на запад по E60 (S1) и держитесь её мимо Мцхеты и Гори: 128 км, около 1 часа
    40 минут, всюду асфальт и по большей части дорога с разделительной полосой. У Хашури два хорошо обозначенных
    съезда. Здесь дорога разделяется: на юг S8 идёт к Боржоми и Ахалцихе; на запад трасса продолжается
    мимо Сурами к новым участкам через Рикотский перевал. Заправки и места для отдыха часто встречаются
    в обоих направлениях, так что заправляться именно здесь не обязательно, хотя перед Боржомским ущельем
    это самое удобное место. Машины эконом-класса вполне достаточно.
fa:
  name: خاشوری
  short: >-
    شهری راه‌آهنی در حاشیهٔ غربی شیدا کارتلی، جایی که جادهٔ اصلی دوشاخه می‌شود: به جنوب تا بورجومی، به
    غرب از گردنهٔ ریکوتی تا دریا.
  body: >-
    **خاشوری مقصد نیست؛ جایی است که جاده تصمیم می‌گیرد شما به کجا می‌روید.**


    شهر کنار رود سورامولا، در ارتفاع حدود ۷۰۰ متری، بر لبهٔ غربی دشت شیدا کارتلی قرار دارد، درست همان‌جا
    که بزرگراه اصلی گرجستان دوشاخه می‌شود. به سوی غرب، جاده به طرف گردنهٔ ریکوتی، کوتائیسی و دریای سیاه
    بالا می‌رود؛ به سوی جنوب، به درهٔ بورجومی سرازیر می‌شود و رو به آخالتسیخه و مرز ترکیه پیش می‌رود.


    راه‌آهن این شهر را ساخت. نام خاشوری در فرمانی شاهانه از سال ۱۶۹۳ آمده است، اما شهر امروزی در ۱۸۷۲
    به صورت ایستگاهی ساده بر خط تفلیس-پوتی آغاز شد که به نام دوک بزرگ میخائیل نیکولایویچ، نایب‌السلطنهٔ
    قفقاز، میخائیلوو نام گرفت. با فروپاشی امپراتوری نام قدیم بازگشت، و چند سالی پیش از ۱۹۳۴ شهر استالینیسی
    خوانده می‌شد.


    در مارس ۱۹۲۱ ایستگاه به خط مقدم جبهه بدل شد. در ۵ مارس ارتش سرخ به میخائیلوو یورش برد؛ نیروهای گرجی
    آن را عقب راندند و همان شامگاه ضدحمله کردند، پیروزی‌ای که فرماندهی شوروی در تفلیس را به فکر مذاکره
    انداخت. شب بعد، ژنرال کونیاشویلی به دلایلی که هرگز روشن نشد مواضعش را رها کرد و در ۶ مارس ایستگاه
    سقوط کرد.


    امروز خاشوری یعنی خیابانی اصلی و پهن، ساختمان‌های اداری دوران شوروی، بازاری شلوغ و غذاخوری‌های کنار
    جاده. برجی از سدهٔ هجدهم و کلیساهای یحیای تعمیددهنده و مارینای مقدس برجا مانده‌اند، اما هیچ‌کدام به‌تنهایی
    ارزش رانندگی از تفلیس را ندارد.


    ارزش این شهر عملی است: آخرین شهر بزرگ پیش از درهٔ بورجومی یا سربالایی ریکوتی است، با سوپرمارکت، خودپرداز،
    داروخانه و پنچرگیری. سورامی با دژش و بساط نان نازوکی چند کیلومتر آن‌سوتر در غرب است؛ بورجومی حدود
    سی کیلومتر در جنوب. یک روز به خاشوری بدهید، از دستش دلخور می‌شوید. یک ساعت و یک باک پر به آن بدهید،
    دقیقاً همان کاری را می‌کند که برایش ساخته شده است.
  tip: >-
    برای توقفی کاربردی یک ساعت بس است. سوپرمارکت، خودپردازها و داروخانه در مرکز شهر در فاصلهٔ یک بلوک
    از هم‌اند، و پمپ‌بنزین‌ها در دو سر شهر و در جادهٔ بورجومی قرار دارند. غذاخوری‌های کنار جاده ساده‌اند،
    اما خاچاپوری و لوبیوی آن‌ها زود می‌رسد و صادقانه پخته شده است. سرویس بهداشتی پمپ‌بنزین‌ها معمولاً
    از سرویس‌های کنار بازار تمیزتر است. در زمستان خیابان‌های فرعی گل‌آلود می‌شوند و پیاده‌روها یخ می‌بندند.
    برای شب، بورجومی یا سورامی جای خواب بهتری است.
  route: >-
    از تفلیس از راه E60 (S1) به سمت غرب بیرون بروید و از کنار متسختا و گوری ادامه دهید: ۱۲۸ کیلومتر، حدود
    ۱ ساعت و ۴۰ دقیقه، سراسر آسفالت و بیشترش جادهٔ دوطرفه با جداکنندهٔ میانی. خاشوری دو خروجی با تابلوی
    روشن دارد. اینجا راه دوشاخه می‌شود: به جنوب، جادهٔ S8 به بورجومی و آخالتسیخه می‌رود؛ به غرب، بزرگراه
    از کنار سورامی به سوی بخش‌های تازه‌ساز روی گردنهٔ ریکوتی ادامه می‌یابد. پمپ‌بنزین‌ها و استراحتگاه‌ها
    در هر دو جهت فراوان‌اند، پس لازم نیست حتماً اینجا سوخت بزنید، هرچند پیش از درهٔ بورجومی اینجا دم‌دست‌ترین
    جاست. خودروی کلاس اقتصادی همهٔ آن چیزی است که لازم دارید.
he:
  name: חשורי
  short: >-
    עיירת רכבת בשוליה המערביים של שידה קרתלי, במקום שבו הכביש הראשי מתפצל: דרומה לבורג'ומי, מערבה דרך
    מעבר ריקוטי אל הים.
  body: >-
    **חשורי אינה יעד; זה המקום שבו הדרך מחליטה לאן אתם נוסעים.**


    העיירה שוכנת על נהר הסוראמולה, בגובה של כ-700 מטרים, בקצה המערבי של מישור שידה קרתלי, בדיוק במקום
    שבו הכביש הראשי של גאורגיה מתפצל. מערבה הדרך מטפסת אל מעבר ריקוטי, קוטאיסי והים השחור; דרומה היא יורדת
    אל ערוץ בורג'ומי, לכיוון אחלציחה וגבול טורקיה.


    הרכבת היא שעשתה את העיירה. חשורי נזכרת בכתב מלכותי משנת 1693, אבל העיירה המודרנית החלה את דרכה ב-1872
    כתחנה צנועה על קו טביליסי–פוטי, שנקראה מיכאילובו על שם הדוכס הגדול מיכאיל ניקולאייביץ', משנה המלך
    בקווקז. השם הישן חזר עם נפילת האימפריה, ובמשך כמה שנים, עד 1934, נקראה העיירה סטליניסי.


    במרץ 1921 הייתה התחנה קו חזית. ב-5 במרץ הסתער הצבא האדום על מיכאילובו; הכוחות הגאורגיים הדפו אותו
    ופתחו בהתקפת נגד באותו ערב — הצלחה שהביאה את הפיקוד הסובייטי בטביליסי לשקול משא ומתן. בלילה שלאחר
    מכן נטש הגנרל קוניאשווילי את עמדותיו מסיבות שלא הוסברו מעולם, וב-6 במרץ נפלה התחנה.


    היום חשורי היא רחוב ראשי רחב, בנייני מִנהל סובייטיים, שוק הומה ומסעדות דרכים פשוטות. שרדו בה מגדל
    מהמאה ה-18 והכנסיות של יוחנן המטביל ומרינה הקדושה, אבל אף אחד מהם אינו מצדיק לבדו את הנסיעה מטביליסי.


    ערכה מעשי: זו העיירה הגדולה האחרונה לפני ערוץ בורג'ומי או העלייה לריקוטי, עם סופרמרקט, כספומטים, בית
    מרקחת ופנצ'רייה. סורמי, עם המבצר שלה ודוכני לחם הנזוקי, נמצאת כמה קילומטרים מערבה; בורג'ומי כשלושים
    קילומטרים דרומה. תנו לחשורי יום שלם, ותתרעמו עליה. תנו לה שעה ומיכל דלק מלא, והיא תעשה בדיוק את מה
    שלשמו נבנתה.
  tip: >-
    שעה מספיקה לעצירה מעשית. הסופרמרקט, הכספומטים ובית המרקחת נמצאים במרכז, במרחק בלוק זה מזה, ותחנות
    דלק ניצבות בשני קצות העיירה ועל הדרך לבורג'ומי. מסעדות הדרכים פשוטות, אבל החצ'אפורי והלוביו שלהן מגיעים
    מהר ועשויים ביושר. השירותים בתחנות הדלק בדרך כלל נקיים יותר מאלה שליד השוק. בחורף הרחובות הצדדיים
    הופכים לבוץ והמדרכות מתכסות בקרח. ללינה, בורג'ומי או סורמי הן מקום טוב יותר.
  route: >-
    צאו מטביליסי מערבה בכביש E60 (S1) והמשיכו בו על פני מצחתה וגורי: 128 ק״מ, כשעה ו-40 דקות, אספלט לכל
    אורך הדרך ורובה כביש מחולק. לחשורי יש שתי יציאות מסומנות היטב. כאן הדרך מתפצלת: דרומה, כביש S8 מוביל
    לבורג'ומי ולאחלציחה; מערבה, הכביש המהיר ממשיך על פני סורמי אל הקטעים החדשים שחוצים את מעבר ריקוטי.
    תחנות דלק ומקומות מנוחה יש לרוב בשני הכיוונים, כך שאין צורך לתדלק דווקא כאן, אף שזה המקום הנוח ביותר
    לעשות זאת לפני ערוץ בורג'ומי. רכב מקטגוריית אקונומי הוא כל מה שצריך.
ar:
  name: خاشوري
  short: >-
    بلدة سكك حديدية على الطرف الغربي لشيدا كارتلي، حيث يتفرع الطريق الرئيسي: جنوباً إلى بورجومي، وغرباً
    عبر ممر ريكوتي إلى البحر.
  body: >-
    **ليست خاشوري وجهة، بل المكان الذي يقرر فيه الطريق إلى أين أنت ذاهب.**


    تقع البلدة على نهر سورامولا، على ارتفاع نحو 700 متر، عند الحافة الغربية لسهل شيدا كارتلي، في الموضع
    نفسه الذي يتفرع فيه الطريق الرئيسي في جورجيا. غرباً يصعد الطريق نحو ممر ريكوتي وكوتايسي والبحر الأسود،
    وجنوباً ينحدر إلى وادي بورجومي باتجاه أخالتسيخه والحدود التركية.


    السكة الحديدية هي التي صنعت البلدة. يرد اسم خاشوري في مرسوم ملكي يعود إلى عام 1693، لكن البلدة الحديثة
    بدأت عام 1872 محطةً متواضعة على خط تبليسي–بوتي، سُميت ميخائيلوفو نسبة إلى الدوق الأكبر ميخائيل نيكولايفيتش،
    نائب الملك في القوقاز. وعاد الاسم القديم مع سقوط الإمبراطورية، وحملت البلدة بضع سنوات قبل عام 1934
    اسم ستالينيسي.


    في مارس 1921 صارت المحطة خط جبهة. ففي 5 مارس اقتحم الجيش الأحمر ميخائيلوفو، فصدّته القوات الجورجية
    وشنّت هجوماً مضاداً في المساء نفسه، وهو نجاح دفع القيادة السوفييتية في تبليسي إلى التفكير في التفاوض.
    وفي الليلة التالية ترك الجنرال كونياشفيلي مواقعه لأسباب لم تُكشف قط، وفي 6 مارس سقطت المحطة.


    خاشوري اليوم شارع رئيسي عريض، ومبانٍ إدارية سوفييتية، وسوق مزدحمة، ومطاعم بسيطة على جانب الطريق. ولا
    يزال فيها برج من القرن الثامن عشر وكنيستا يوحنا المعمدان والقديسة مارينا، لكن أياً منها لا يبرر وحده
    الرحلة من تبليسي.


    قيمتها عملية: إنها آخر بلدة كبيرة قبل وادي بورجومي أو صعود ريكوتي، وفيها متجر كبير وأجهزة صراف آلي
    وصيدلية وورشة لإصلاح الإطارات. وتقع سورامي، بقلعتها وأكشاك خبز النازوكي، على بعد بضعة كيلومترات غرباً،
    وبورجومي على بعد نحو ثلاثين كيلومتراً جنوباً. امنح خاشوري يوماً كاملاً وستضيق بها، وامنحها ساعة وخزاناً
    ممتلئاً وستؤدي بالضبط ما بُنيت من أجله.
  tip: >-
    تكفي ساعة لوقفة عملية. المتجر الكبير وأجهزة الصراف والصيدلية متقاربة في الوسط لا يفصل بينها أكثر من
    مبنى، ومحطات الوقود عند طرفي البلدة وعلى طريق بورجومي. المطاعم على جانب الطريق بسيطة، لكن الخاتشابوري
    واللوبيو فيها يصلان سريعاً ومطهوّان بأمانة. ودورات مياه محطات الوقود أنظف عادةً من تلك التي قرب السوق.
    في الشتاء تتحول الشوارع الجانبية إلى وحل وتتجمد الأرصفة. وللمبيت، بورجومي أو سورامي أفضل.
  route: >-
    اخرج من تبليسي غرباً على الطريق E60 (S1) وتابعه مروراً بمتسخيتا وغوري: 128 كم، نحو ساعة و40 دقيقة،
    أسفلت على طول الطريق ومعظمه طريق مزدوج. لخاشوري مخرجان واضحا اللافتات. هنا يتفرع الطريق: جنوباً يمضي
    الطريق S8 إلى بورجومي وأخالتسيخه، وغرباً يواصل الطريق السريع مروراً بسورامي نحو المقاطع الجديدة فوق
    ممر ريكوتي. محطات الوقود واستراحات الطريق كثيرة في الاتجاهين، فلا حاجة إلى التزود بالوقود هنا تحديداً،
    وإن كان هذا أنسب مكان لذلك قبل وادي بورجومي. والسيارة الاقتصادية هي كل ما تحتاجه.
