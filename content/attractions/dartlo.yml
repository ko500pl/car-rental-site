ka:
  name: დართლო
  short: >-
    თუშეთის ქვის სოფელი 2000 მეტრზე: ფიქლის სახურავები, შუა საუკუნეების კოშკები და ქვაში ამოკვეთილი მზის
    ნიშნები. ზამთარში აქ აღარავინ რჩება.
  body: >-
    **2014 წლის აღწერით დართლოში მუდმივად არავინ ცხოვრობდა — და მაინც, ყოველ ზაფხულს მისი საკვამურები
    ისევ ბოლავს და კოშკები ხალხით სავსე სოფელს დაჰყურებს.**


    დართლო თუშეთში, ზღვის დონიდან დაახლოებით 2000 მეტრზე, მდინარე დიდხევის, პირიქითა ალაზნის მარცხენა
    შენაკადის, მარჯვენა ფერდზე დგას, ომალოდან თორმეტიოდე კილომეტრში. ქვის სახლები ფერდზე საფეხურებად მიუყვება
    ერთმანეთს, სახურავები ბრტყელი ფიქლისაა, მათ შორის კი შუა საუკუნეების კოშკები აღმართულა — სარკმლების
    ნაცვლად ვიწრო სამზერებითა და სათოფურებით. 2002 წელს აქ ცხრა კაცი იზამთრებდა, 2014 წლისთვის — აღარავინ.
    2000-იანი წლებიდან სახლები თანდათან სტუმრებისთვის იღება.


    კედლებს დააკვირდით. ერთი კოშკის ფასადში სამი სხვადასხვა ფერის მოზრდილი ქვაა ჩაყოლებული, ერთ ჰორიზონტალურ
    ზოლად, შუა ქვა კედლის ღერძზეა. მათზე წრეებია ამოკვეთილი, ზოგს გარშემო სხივები შემოსდევს. წრეა გამოსახული
    სოფლის განაპირას მდგარი აკლდამის დასავლეთ კედელზეც — როგორც ჩანს, მიცვალებულთა მზის ნიშანი. მკვლევრები
    ამ სახეებს ქართველთა უძველეს რწმენა-წარმოდგენებს უკავშირებენ. დართლოს ნაგებობებზე თვრამეტამდე პეტროგლიფია
    შემორჩენილი, და სოფლის ცენტრში დადგმული დაფა გიჩვენებთ, სად მოძებნოთ ისინი.


    ცენტრშივეა საბჭეო — ქვის სასხდომი, სადაც სოფლის უხუცესები იკრიბებოდნენ და დავებს არჩევდნენ; სოფლის
    სამხრეთით კი XIX საუკუნის დარბაზული ეკლესია დგას.


    დართლოს თავზე, ციცაბო აღმართის ბოლოს, კვავლოა. XIX საუკუნის ბოლოს იქ ოცდათექვსმეტი კომლი ცხოვრობდა,
    1920-იან წლებში — ოცდაშვიდი, ორმოცდასამი სული; საბჭოთა ხანაში სოფელი ნელ-ნელა დაცარიელდა და მისი ხალხი
    კახეთში ჩავიდა. დღეს იქ მხოლოდ ქვა და ქარია.


    თუშები დღემდე მთასა და ბარს შორის ცხოვრობენ: გაზაფხულზე ფარებს მთაში ერეკებიან, შემოდგომაზე — ალვანში,
    კახეთის ბარში. დართლო არც ნანგრევია და არც მუზეუმი. ეს სოფელია, რომელმაც წელიწადში სამი თვით ცხოვრება
    ისწავლა.
  tip: >-
    აქ ღამისთევა აუცილებელია — ერთ დღეში თბილისიდან ჩამოსვლა და დაბრუნება შეუძლებელია. საოჯახო სასტუმროები
    დაახლოებით ივნისიდან სექტემბრამდე მუშაობს; წინასწარ დაჯავშნეთ, თუმცა მობილური კავშირი მერყევია და
    პასუხს შეიძლება დაელოდოთ. დენი მზის პანელებიდან და გენერატორიდან მოდის — მოწყობილობები შესაძლებლობისთანავე
    დატენეთ. ბანკომატი და ნამდვილი მაღაზია არ არის, ამიტომ ნაღდი ფული თან იქონიეთ. ივლისშიც ღამით 5–8
    გრადუსამდე ცივა — თბილი ტანსაცმელი წამოიღეთ. სალოცავებს (ხატებს) პატივი ეცით და მათ ღობეს არ გადააბიჯოთ;
    ბევრ თუშურ ოჯახში ღორის ხორცზე ძველი აკრძალვა დღემდე მოქმედებს — ნუ წაიღებთ მას არც საგზლად, არც საჩუქრად.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) ვაზიანამდე, გომბორის უღელტეხილით (შ38) თელავამდე, იქიდან კი ახმეტისა
    და ფშაველის გავლით; ავზი ახმეტაში შეავსეთ — ეს ბოლო საიმედო ბენზინგასამართია. ფშაველთან ასფალტი მთავრდება
    და იწყება დაახლოებით 70-კილომეტრიანი ხრეშიანი მთის გზა: აბანოს უღელტეხილზე (2826 მ) ასვლა და ომალოსკენ
    დაშვება ოთხ საათს ან მეტს წაიღებს, კარნიზებითა და ციცაბო მოსახვევებით. ომალოდან დართლომდე კიდევ 12–15
    კმ გრუნტის გზაა, მდინარის ფონებით, დაახლოებით ერთი საათი. სულ დაახლოებით 228 კმ და შვიდი საათი ან
    მეტი. გზა მხოლოდ თბილ თვეებშია ღია — ჩვეულებრივ ივნისიდან ოქტომბრის შუა რიცხვებამდე, თოვლის მიხედვით.
    აუცილებელია ოთხწამყვანიანი ჯიპი და გამოცდილი მძღოლი; ბევრი ადგილობრივ მძღოლს ქირაობს.
en:
  name: Dartlo
  short: >-
    A Tusheti stone village at 2,000 m, with slate roofs, medieval towers and sun signs carved into its
    walls. Busy in summer, empty all winter.
  body: >-
    **At the 2014 census Dartlo had no permanent residents at all, and yet every summer its chimneys smoke
    again and its towers look down on a village full of people.**


    Dartlo stands at about 2,000 metres in Tusheti, on the right-hand slope above the Didkhevi, a left-bank
    tributary of the Pirikiti Alazani, some 12 km beyond Omalo. Stone houses climb the hillside in steps
    under roofs of flat slate, and between them rise medieval towers pierced by narrow loopholes instead
    of windows. In 2002 nine people still spent the winter here; by 2014 none did. Since the 2000s the
    houses have been reopening, one after another, as summer guesthouses.


    Look closely at the walls. Set into the face of one tower is a band of three large stones of different
    colours, the middle one on the tower's axis, carved with circles, some ringed with rays. A circle
    also marks the west wall of the burial vault at the edge of the village, apparently a sun sign for
    the dead. Scholars link these images to the oldest Georgian beliefs. Up to 18 petroglyphs survive
    on Dartlo's buildings, and a board in the village centre shows where to find them.


    Also in the centre is the sabcheo, the stone-seated place where the elders met to settle disputes.
    South of the village stands a 19th-century hall church.


    Above Dartlo, at the top of a steep climb, lies Kvavlo. In the late 19th century it had 36 households,
    and in the 1920s still 27 households of 43 people; in Soviet times it emptied as its families moved
    down to Kakheti. Today it holds only stone and wind.


    The Tush still live between mountain and plain, driving their flocks up in spring and down to the
    Alvani villages of Kakheti in autumn. Dartlo is neither a ruin nor a museum. It is a village that
    has learned to live three months a year.
  tip: >-
    You must stay overnight, because getting here from Tbilisi and back in a day is not possible. Guesthouses
    open roughly from June to September. Book ahead, but expect slow replies, as mobile coverage is patchy.
    Power comes from solar panels and generators, so charge devices whenever you can. There is no ATM
    and no real shop, so bring cash. Nights drop to 5–8°C even in July; pack a warm layer. Respect the
    shrines (khati) and do not step inside their enclosures. Many Tush families still keep an old taboo
    against pork, so leave it out of your provisions and gifts.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) as far as Vaziani, cross the Gombori Pass (Sh38) to Telavi,
    and continue through Akhmeta to Pshaveli; fill up in Akhmeta, the last reliable fuel. At Pshaveli
    the asphalt ends and some 70 km of gravel mountain road begins: the climb over the Abano Pass (2,826
    m) and the descent to Omalo take four hours or more, on ledges and tight hairpins. From Omalo it is
    another 12–15 km of dirt track with river fords to Dartlo, about an hour. Allow about 228 km and seven
    hours or more in all. The road is open only in the warm months, usually from June to mid-October depending
    on snow. You need an off-road 4x4 and an experienced driver, and many visitors hire a local one.
ru:
  name: Дартло
  short: >-
    Каменное тушинское село на 2000 м: сланцевые крыши, средневековые башни и солнечные знаки на стенах.
    Летом людно, зимой пусто.
  body: >-
    **По переписи 2014 года в Дартло не осталось ни одного постоянного жителя, и всё же каждое лето из
    его труб снова поднимается дым, а башни смотрят на деревню, полную людей.**


    Дартло стоит на высоте около 2000 метров в Тушетии, на правом склоне над Дидхеви, левым притоком Пирикитской
    Алазани, примерно в 12 км за Омало. Каменные дома поднимаются по склону уступами под крышами из плоского
    сланца, а между ними встают средневековые башни, пронзённые узкими бойницами вместо окон. В 2002 году
    здесь ещё зимовали девять человек; к 2014-му — никто. С 2000-х годов дома один за другим открываются
    вновь — уже как летние гостевые.


    Присмотритесь к стенам. В лицевую сторону одной из башен вделана полоса из трёх крупных камней разного
    цвета, средний — на оси башни; на них вырезаны круги, некоторые с расходящимися лучами. Круг отмечает
    и западную стену погребального склепа на краю деревни — видимо, знак солнца для мёртвых. Учёные связывают
    эти изображения с самыми древними грузинскими верованиями. На постройках Дартло сохранилось до 18
    петроглифов, и стенд в центре деревни показывает, где их искать.


    Там же, в центре, находится сабчео — место с каменными сиденьями, где старейшины собирались решать
    споры. К югу от деревни стоит зальная церковь XIX века.


    Над Дартло, после крутого подъёма, лежит Квавло. В конце XIX века там было 36 дворов, а в 1920-х годах
    ещё 27 дворов, в которых жили 43 человека; в советское время деревня опустела, когда семьи переселились
    вниз, в Кахетию. Сегодня там остались только камень и ветер.


    Тушины до сих пор живут между горой и равниной, перегоняя стада вверх весной и вниз, в алванские сёла
    Кахетии, осенью. Дартло — не руина и не музей. Это деревня, которая научилась жить три месяца в году.
  tip: >-
    Здесь нужно остаться на ночь: доехать сюда из Тбилиси и обратно за один день невозможно. Гостевые
    дома открыты примерно с июня по сентябрь. Бронируйте заранее, но ждите медленных ответов — мобильная
    связь неустойчива. Электричество дают солнечные панели и генераторы, так что заряжайте устройства
    при первой возможности. Здесь нет ни банкомата, ни настоящего магазина, так что берите наличные. Ночи
    прохладны — 5–8 °C даже в июле; возьмите тёплую одежду. Уважайте святилища (хати) и не заходите внутрь
    их оград. Многие тушинские семьи до сих пор соблюдают старый запрет на свинину, так что не берите
    её ни в припасы, ни в подарки.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) до Вазиани, через Гомборский перевал (Sh38) до Телави и далее
    через Ахмету до Пшавели; заправьтесь в Ахмете — это последняя надёжная заправка. В Пшавели асфальт
    кончается и начинается около 70 км горной гравийной дороги: подъём на перевал Абано (2826 м) и спуск
    к Омало занимают четыре часа и больше, по карнизам и крутым серпантинам. От Омало до Дартло ещё 12–15
    км грунтовки с бродами, около часа. Всего закладывайте около 228 км и семь часов или больше. Дорога
    открыта только в тёплые месяцы, обычно с июня до середины октября, в зависимости от снега. Нужен настоящий
    полноприводный внедорожник и опытный водитель — многие приезжие нанимают местного.
fa:
  name: دارتلو
  short: >-
    روستایی سنگی توشتی در ارتفاع ۲۰۰۰ متری، با بام‌های سنگ‌لوحی، برج‌های قرون‌وسطایی و نشان‌های خورشیدی
    حک‌شده بر دیوارها. تابستان پرجمعیت، تمام زمستان خالی.
  body: >-
    **در سرشماری سال ۲۰۱۴، دارتلو هیچ ساکن دائمی نداشت، و با این‌همه هر تابستان دودکش‌هایش بار دیگر دود
    می‌کنند و برج‌هایش بر روستایی پر از مردم می‌نگرند.**


    دارتلو در ارتفاع نزدیک به ۲۰۰۰ متری در توشتی، بر شیب راست بالای دیدخوی، یکی از شاخابه‌های چپ رود آلازانی
    پیریکیتی، حدود ۱۲ کیلومتر دورتر از اومالو، ایستاده است. خانه‌های سنگی پله‌پله بر دامنه بالا می‌روند
    زیر بام‌هایی از سنگ‌لوح صاف، و میان آن‌ها برج‌هایی قرون‌وسطایی با تیرکش‌های باریک به‌جای پنجره سر
    برمی‌کشند. در سال ۲۰۰۲ نُه نفر هنوز زمستان را این‌جا می‌گذراندند؛ تا ۲۰۱۴ هیچ‌کس. از دههٔ ۲۰۰۰ خانه‌ها
    یکی پس از دیگری به اقامتگاه تابستانی بدل شده‌اند.


    به دیوارها با دقت بنگرید. در نمای یکی از برج‌ها نواری از سه سنگ بزرگ به رنگ‌های گوناگون جای گرفته،
    سنگ میانی بر محور برج، حک‌شده با دایره‌هایی که برخی پرتوهایی دارند. دایره‌ای نیز بر دیوار غربی دخمهٔ
    خاکسپاری در کنارهٔ روستا دیده می‌شود، ظاهراً نشانی خورشیدی برای مردگان. پژوهشگران این تصاویر را به
    کهن‌ترین باورهای گرجی پیوند می‌دهند. تا ۱۸ سنگ‌نگاره بر بناهای دارتلو باقی مانده، و تابلویی در مرکز
    روستا محل آن‌ها را نشان می‌دهد.


    در همان مرکز، سابچئو نیز هست، جایی با نشیمن‌های سنگی که ریش‌سفیدان برای حل‌وفصل نزاع‌ها گرد می‌آمدند.
    در جنوب روستا کلیسایی تک‌سالنی از سدهٔ نوزدهم ایستاده است.


    بالای دارتلو، پس از صعودی تند، کواولو جای دارد. در پایان سدهٔ نوزدهم ۳۶ خانوار در آن بود، و در دههٔ
    ۱۹۲۰ هنوز ۲۷ خانوار با ۴۳ نفر؛ در دوران شوروی، با نقل‌مکان خانواده‌ها به کاختی در پایین‌دست، خالی
    شد. امروز تنها سنگ و باد در آن مانده است.


    توش‌ها هنوز میان کوه و دشت زندگی می‌کنند، بهار گله را بالا و پاییز به روستاهای آلوانی در کاختی پایین
    می‌برند. دارتلو نه ویرانه است و نه موزه. روستایی است که آموخته سه ماه از سال زندگی کند.
  tip: >-
    باید شب را همین‌جا بمانید، چون رفت‌وبرگشت یک‌روزه از تفلیس ممکن نیست. اقامتگاه‌ها تقریباً از ژوئن
    تا سپتامبر بازند. از پیش رزرو کنید، اما پاسخ‌دهی کند خواهد بود، چون پوشش تلفن همراه ناپایدار است.
    برق از پنل‌های خورشیدی و ژنراتور می‌آید، پس هر گاه فرصت شد وسایل را شارژ کنید. نه دستگاه خودپرداز
    و نه فروشگاه واقعی وجود دارد، پس نقد همراه ببرید. شب‌ها حتی در ژوئیه به ۵ تا ۸ درجه سانتی‌گراد می‌رسد؛
    لایه‌ای گرم همراه داشته باشید. به زیارتگاه‌ها (خاتی) احترام بگذارید و به درون محوطهٔ آن‌ها پا نگذارید.
    بسیاری از خانواده‌های توش هنوز پرهیز کهن از گوشت خوک را حفظ می‌کنند، پس آن را از توشه و هدایای خود
    کنار بگذارید.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را تا وازیانی بگیرید، از گذرگاه گومبوری (Sh38) بگذرید تا تلاوی و از راه
    آخمِتا تا پشاولی ادامه دهید؛ باک را در آخمِتا پر کنید، که آخرین پمپ‌بنزین مطمئن است. در پشاولی آسفالت
    پایان می‌یابد و حدود ۷۰ کیلومتر راه کوهستانی شنی آغاز می‌شود: صعود از گذرگاه آبانو (۲٬۸۲۶ متر) و فرود
    تا اومالو چهار ساعت یا بیشتر طول می‌کشد، بر لبه‌های تنگ و پیچ‌های سخت. از اومالو تا دارتلو ۱۲ تا ۱۵
    کیلومتر دیگر راه خاکی با گذر از رود باقی می‌ماند، حدود یک ساعت. در کل حدود ۲۲۸ کیلومتر و هفت ساعت
    یا بیشتر زمان بگذارید. این راه تنها در ماه‌های گرم باز است، معمولاً از ژوئن تا میانه‌ی اکتبر، بسته
    به برف. به خودرویی آفرود واقعی و راننده‌ای باتجربه نیاز دارید، و بسیاری از بازدیدکنندگان راننده‌ای
    محلی کرایه می‌کنند.
he:
  name: דרטלו
  short: >-
    כפר אבן טושתי בגובה 2,000 מ', עם גגות צפחה, מגדלים מימי הביניים וסימני שמש חרוטים בקירות. עמוס בקיץ,
    ריק כל החורף.
  body: >-
    **במפקד 2014 לא היו לדרטלו תושבים קבועים כלל, ובכל זאת מדי קיץ עולה שוב עשן מארובותיה, ומגדליה משקיפים
    על כפר מלא אנשים.**


    דרטלו עומדת בגובה של כ-2,000 מטרים בטושתי, על המדרון הימני מעל דידחווי, יובל בגדה השמאלית של האלזני
    הפיריקיטי, כ-12 ק"מ מעבר לאומאלו. בתי אבן מטפסים על המדרון במדרגות תחת גגות של לוחות צפחה שטוחים,
    וביניהם מזדקרים מגדלים מימי הביניים המנוקבים בחרכי ירי צרים במקום חלונות. ב-2002 עדיין חיו כאן תשעה
    אנשים בחורף; ב-2014 אף אחד. משנות ה-2000 הבתים נפתחים בזה אחר זה כבתי הארחה קיציים.


    הביטו מקרוב בקירות. בחזית אחד המגדלים משוקעת רצועה של שלוש אבנים גדולות בצבעים שונים, האמצעית על ציר
    המגדל, חרוטה בעיגולים, חלקם מוקפים בקרניים. עיגול מסמן גם את הקיר המערבי של קריפטת הקבורה בקצה הכפר,
    כנראה סימן שמש למתים. חוקרים מקשרים דימויים אלה לאמונות הגאורגיות העתיקות ביותר. עד 18 פטרוגליפים
    שרדו על בנייני דרטלו, ולוח במרכז הכפר מציג היכן למצוא אותם.


    גם במרכז נמצא הסבצ'או, המקום בעל מושבי האבן שבו נפגשו הזקנים להסדיר סכסוכים. מדרום לכפר עומדת כנסיית
    אולם מהמאה ה-19.


    מעל דרטלו, בקצה טיפוס תלול, שוכנת קוואבלו. בסוף המאה ה-19 היו בה 36 משקי בית, ובשנות ה-1920 עדיין
    27 משקי בית של 43 בני אדם; בתקופה הסובייטית התרוקנה כשמשפחותיה עברו לכפרי קאחתי שבמטה. כיום נותרו
    בה רק אבן ורוח.


    הטוש עדיין חיים בין ההר למישור, מעלים את עדריהם להרים באביב ומורידים אותם בסתיו לכפרי אלוואני שבקאחתי.
    דרטלו אינה הריסה ואינה מוזיאון. זהו כפר שלמד לחיות שלושה חודשים בשנה.
  tip: >-
    עליכם ללון בכפר, כי הגעה מטביליסי וחזרה ביום אחד אינה אפשרית. בתי הארחה פתוחים בקירוב מיוני עד ספטמבר.
    הזמינו מראש, אך צפו לתשובות איטיות, כי הכיסוי הסלולרי מוגבל. החשמל מגיע מפאנלים סולריים וגנרטורים,
    אז טענו מכשירים בכל הזדמנות. אין כספומט ואין חנות ממשית, אז הביאו מזומן. הלילות קרים, 5–8 מעלות אפילו
    ביולי; קחו בגד חם. כבדו את המקדשים (חאטי) ואל תיכנסו לתוך המתחמים שלהם. משפחות טוש רבות עדיין שומרות
    על איסור עתיק על בשר חזיר, אז השאירו אותו מחוץ לצידה ולמתנות.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) עד ואזיאני, חצו את מעבר גומבורי (Sh38) לטלאווי והמשיכו דרך אחמטה לפשאוולי;
    תדלקו באחמטה, תחנת הדלק האחרונה שאפשר לסמוך עליה. בפשאוולי נגמר האספלט ומתחילים כ-70 ק"מ של דרך הרים
    בחצץ: הטיפוס על מעבר אבאנו (2,826 מ') והירידה לאומאלו אורכים ארבע שעות או יותר, על מדפי סלע ובסיבובי
    פרסה חדים. מאומאלו נותרים עוד 12–15 ק"מ של דרך עפר, עם חציות נהר, עד דרטלו — כשעה. הקצו בסך הכול כ-228
    ק"מ ושבע שעות או יותר. הדרך פתוחה רק בחודשים החמים, בדרך כלל מיוני עד אמצע אוקטובר, בהתאם לשלג. צריך
    רכב שטח 4x4 אמיתי ונהג מנוסה, ומבקרים רבים שוכרים נהג מקומי.
ar:
  name: دارتلو
  short: >-
    قرية توشيتية حجرية على ارتفاع 2000 متر، بأسقف من الإردواز، وأبراج من العصور الوسطى، ورموز شمسية منقوشة
    على جدرانها. مزدحمة صيفًا، خالية طوال الشتاء.
  body: >-
    **في تعداد 2014 لم يكن لدارتلو أي سكان دائمين على الإطلاق، ومع ذلك يتصاعد الدخان من مداخنها كل صيف
    من جديد، وتنظر أبراجها إلى قرية مليئة بالناس.**


    تقف دارتلو على ارتفاع نحو 2000 متر في توشيتي، على السفح الأيمن فوق ديدخيفي، أحد روافد الضفة اليسرى
    لألازاني بيريكيتي، على نحو 12 كم بعد أومالو. تتسلق البيوت الحجرية المنحدر على شكل مدرجات تحت أسقف
    من الإردواز المسطح، وترتفع بينها أبراج من العصور الوسطى تثقبها مزاغل ضيقة بدل النوافذ. في عام 2002
    كان تسعة أشخاص لا يزالون يقضون الشتاء هنا؛ وفي 2014 لم يبق أحد. ومنذ العقد الأول من القرن الحادي والعشرين،
    أُعيد فتح البيوت واحدًا تلو الآخر كبيوت ضيافة صيفية.


    انظر جيدًا إلى الجدران. في واجهة أحد الأبراج شريط من ثلاثة حجارة كبيرة بألوان مختلفة، الحجر الأوسط
    على محور البرج، منقوش بدوائر، بعضها محاط بأشعة. وتُميّز دائرة أيضًا الجدار الغربي لقبو الدفن على حافة
    القرية، وهو على ما يبدو رمز شمسي للموتى. يربط الباحثون هذه الصور بأقدم المعتقدات الجورجية. تبقّى ما
    يصل إلى 18 نقشًا صخريًا على مباني دارتلو، وتعرض لوحة في وسط القرية أماكن وجودها.


    وفي الوسط أيضًا يقع السابتشيو، المكان ذو المقاعد الحجرية الذي كان يجتمع فيه الشيوخ لحسم النزاعات.
    وجنوب القرية تقف كنيسة ذات صحن واحد من القرن التاسع عشر.


    فوق دارتلو، بعد صعود شديد، تقع كفافلو. في أواخر القرن التاسع عشر كانت تضم 36 أسرة، وفي عشرينيات القرن
    العشرين لا تزال تضم 27 أسرة تعدّ 43 شخصًا؛ وفي العهد السوفيتي خلت من سكانها مع انتقال عائلاتها إلى
    قرى كاختي في الأسفل. واليوم لا يبقى فيها إلا الحجر والريح.


    لا يزال التوش يعيشون بين الجبل والسهل، يقودون قطعانهم صعودًا في الربيع ونزولًا إلى قرى ألفاني في كاختي
    خريفًا. دارتلو ليست خرابًا ولا متحفًا. إنها قرية تعلّمت أن تحيا ثلاثة أشهر في السنة.
  tip: >-
    عليك المبيت هناك، فالوصول من تبليسي والعودة في يوم واحد غير ممكن. تفتح بيوت الضيافة تقريبًا من يونيو
    إلى سبتمبر. احجز مسبقًا، لكن توقع ردودًا بطيئة، فتغطية الهاتف المحمول متقطعة. تأتي الكهرباء من ألواح
    شمسية ومولدات، فاشحن أجهزتك كلما أمكن. لا يوجد صرّاف آلي ولا متجر حقيقي، فاحمل نقدًا. تنخفض حرارة
    الليل إلى 5–8 درجات حتى في يوليو؛ فاحمل طبقة دافئة. احترم الأضرحة (خاتي) ولا تتخطَّ أسوارها. لا تزال
    عائلات توش كثيرة تحافظ على محرّم قديم يمنع لحم الخنزير، فلا تُدرجه في مؤنك أو هداياك.
  route: >-
    من تبليسي، خذ طريق كاختي السريع (S5) حتى فازياني، واعبر ممر غومبوري (Sh38) إلى تيلافي وتابع عبر آخميتا
    إلى بشافيلي؛ وعبّئ الوقود في آخميتا، فهي آخر محطة موثوقة. في بشافيلي ينتهي الأسفلت ويبدأ نحو 70 كم
    من الطريق الجبلي الحصوي: يستغرق الصعود إلى ممر أبانو (2826 مترًا) والنزول إلى أومالو أربع ساعات أو
    أكثر، على حواف ضيقة ومنعطفات حادة. ومن أومالو يبقى 12–15 كم أخرى من الطريق الترابي مع مخاضات نهرية
    حتى دارتلو، نحو ساعة. خصّص نحو 228 كم وسبع ساعات أو أكثر إجمالًا. لا يُفتح الطريق إلا في الأشهر الدافئة،
    عادةً من يونيو إلى منتصف أكتوبر تبعًا للثلوج. تحتاج سيارة دفع رباعي حقيقية وسائقًا متمرسًا، وكثير
    من الزوار يستأجرون سائقًا محليًا.
