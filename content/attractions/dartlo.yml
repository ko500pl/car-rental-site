ka:
  name: დართლო
  short: თუშეთის ყველაზე ლამაზი სოფელი პირიქითა ალაზნის ხეობაში, ფიქლის სახურავებით და აღდგენილი კოშკებით.
  body: >-
    **დართლო თუშეთის სავიზიტო ბარათია და ამის მიზეზი აშკარაა.** სოფელი პირიქითა ალაზნის მარცხენა ნაპირზე,
    ტერასებადაა განლაგებული; ქვის სახლები ერთმანეთის ზემოთ დგას, ყველა ბრტყელი ფიქლის სახურავით, ხოლო
    მათ შორის ოთხკუთხა თავდაცვითი კოშკები ამოდის.


    კოშკები XVI-XVIII საუკუნეებისაა. ისინი დაღესტნური თარეშისგან თავდაცვას ემსახურებოდა: ქვედა სართული
    საქონლისთვის, ზედა — ოჯახისთვის, ბოლო — სათვალთვალო. რამდენიმე მათგანი ბოლო ოცი წლის განმავლობაში
    აღადგინეს საერთაშორისო პროგრამების დახმარებით, ორიგინალური მშრალი წყობის ტექნიკით.


    სოფლის ცენტრში „საბჭოა" — ქვის სკამების ნახევარწრე, სადაც უხუცესთა სასამართლო იკრიბებოდა და დავებს
    წყვეტდა. ეს არ არის რეკონსტრუქცია; ქვები იმ ადგილას დგას, სადაც საუკუნეების განმავლობაში იდგა.


    დართლოს ზემოთ, ერთსაათიანი ციცაბო ასვლის შემდეგ, კვავლოა — მიტოვებული სოფელი ერთი შემორჩენილი კოშკით
    და ხედით მთელ ხეობაზე. ეს არის საუკეთესო გასეირნება დართლოდან, თუ ერთი დღე გაქვს.


    სოფელი მხოლოდ ზაფხულში ცოცხლობს. ივნისში ოჯახები ჩამოვლის შემდეგ ბრუნდებიან, ოქტომბერში კი ისევ ჩადიან
    ბარში — თუშური მეცხვარეობა დღემდე სეზონურ გადასვლას ეყრდნობა. ზამთარში დართლო ცარიელია და მიუწვდომელი.
  tip: >-
    ღამისთევა აუცილებელია — ერთ დღეში აქამდე მოსვლა და დაბრუნება რეალური არ არის. საოჯახო სასტუმროები
    ივნისიდან სექტემბრამდე მუშაობს, ჯავშანი სასურველია, თუმცა კავშირი ხშირად არ არის. ელექტროენერგია მზის
    პანელებიდან და გენერატორიდანაა, ბანკომატი და მაღაზია პრაქტიკულად არ არსებობს — ნაღდი ფული თან იქონიე.
    წყალი წყაროსია და სუფთა. ღამით 5-8 გრადუსია ივლისშიც.
  route: >-
    თბილისიდან თელავამდე გომბორით (95 კმ), შემდეგ ფშაველამდე ასფალტი. ფშაველიდან იწყება გრუნტი აბანოს
    უღელტეხილზე (2850 მ) და შემდეგ ომალომდე — ეს მთელი მონაკვეთი ხუთ საათს იღებს. ომალოდან დართლომდე კიდევ
    15 კმ ხეობის გასწვრივ, დაახლოებით ერთი საათი, მდინარის ფონებით. სულ 228 კმ და დაახლოებით შვიდი საათი.
    მხოლოდ ჯიპით. საწვავი ფშაველში ბოლოა.
en:
  name: Dartlo
  short: >-
    The most photographed village in Tusheti, terraced above the Pirikiti Alazani with slate roofs and
    restored towers.
  body: >-
    **Dartlo is the image most people carry away from Tusheti, and the reason is obvious on arrival.**
    The village is built in terraces on the left bank of the Pirikiti Alazani; stone houses stand one
    above another, every roof laid in flat slate, and square defensive towers rise between them.


    The towers date from the 16th to 18th centuries and were built against Dagestani raiding parties who
    crossed the ridge each summer. The ground floor held livestock, the middle floor the family, the top
    floor was for watching and shooting. Several have been rebuilt over the past twenty years with international
    funding, using the original dry-stone technique rather than mortar, and the work is good enough that
    it takes a second look to tell old from new.


    In the middle of the village stands the sabcheo, a half-circle of stone benches where the council
    of elders sat and settled disputes. It is not a reconstruction: the stones sit where they have sat
    for centuries.


    Above Dartlo, an hour of steep climbing, is Kvavlo, an abandoned hamlet with one surviving tower and
    a view down the whole valley. If you have a single spare day in Dartlo, that is the walk to do.


    The village lives only in summer. Families come up in June after the flocks and go back down to the
    plains in October — Tush shepherding still runs on that seasonal migration, with sheep walked hundreds
    of kilometres each way. In winter Dartlo is empty, snowed in and unreachable.


    Beyond Dartlo the track continues up the gorge to Chesho, Parsma and Girevi, each smaller and emptier
    than the last, until the road stops short of the Chechen border. Walking or riding that stretch is
    the reason a good many people come to Tusheti in the first place.
  tip: >-
    You need to stay overnight; getting here and back in a day is not realistic. Guesthouses operate from
    June to September and booking is advisable, though phone coverage is patchy and messages often go
    unanswered. Power comes from solar panels and generators, so charge everything when you can. There
    is no ATM and effectively no shop, so bring cash. Spring water is clean and drinkable. Nights drop
    to 5-8°C even in July, so bring a warm layer.
  route: >-
    From Tbilisi to Telavi over the Gombori Pass (95 km), then asphalt as far as Pshaveli. From Pshaveli
    the gravel begins, climbing the Abano Pass at 2,850 m and descending to Omalo; that whole section
    takes about five hours. From Omalo it is a further 15 km along the gorge to Dartlo, roughly an hour,
    with river fords on the way. Total 228 km and around seven hours. Only by 4x4. The last fuel is at
    Pshaveli.
ru:
  name: Дартло
  short: >-
    Самое фотографируемое село Тушети, террасами над Пирикитской Алазани, со сланцевыми крышами и восстановленными
    башнями.
  body: >-
    **Дартло — тот образ, который увозят из Тушети почти все, и по приезде понятно почему.** Село выстроено
    террасами на левом берегу Пирикитской Алазани: каменные дома стоят один над другим, каждая крыша выложена
    плоским сланцем, а между домами поднимаются квадратные оборонительные башни.


    Башни относятся к XVI-XVIII векам и строились против дагестанских отрядов, переходивших хребет каждое
    лето. Нижний этаж занимал скот, средний — семья, верхний служил для наблюдения и стрельбы. Несколько
    башен восстановлены за последние двадцать лет на международные средства, в оригинальной технике сухой
    кладки, и сделано это достаточно аккуратно, чтобы старое от нового отличалось не сразу.


    В середине села стоит сабчео — полукруг каменных скамей, где заседал совет старейшин и разбирал споры.
    Это не реконструкция: камни лежат там же, где лежали столетиями.


    Выше Дартло, час крутого подъёма, находится Квавло — покинутый хутор с одной уцелевшей башней и видом
    на всё ущелье. Если в Дартло у вас есть свободный день, идти нужно именно туда.


    Село живёт только летом. Семьи поднимаются в июне вслед за отарами и в октябре спускаются на равнину:
    тушинское овцеводство до сих пор держится на этой сезонной перекочёвке, и овец перегоняют за сотни
    километров. Зимой Дартло пусто, засыпано снегом и недостижимо.
  tip: >-
    Ночевать здесь обязательно: съездить и вернуться за день нереально. Гостевые дома работают с июня
    по сентябрь, бронировать желательно, хотя связь ловит плохо и сообщения часто остаются без ответа.
    Электричество от солнечных панелей и генераторов, так что заряжайте технику при любой возможности.
    Банкомата нет, магазина по сути тоже — берите наличные. Родниковая вода чистая и пригодна для питья.
    Ночью и в июле бывает 5-8 градусов, тёплый слой одежды нужен.
  route: >-
    Из Тбилиси в Телави через Гомборский перевал (95 км), затем асфальт до Пшавели. От Пшавели начинается
    грунт: подъём на перевал Абано (2850 м) и спуск к Омало, весь этот участок занимает около пяти часов.
    От Омало ещё 15 км вдоль ущелья до Дартло, примерно час, с бродами через реку. Всего 228 км и около
    семи часов. Только на внедорожнике. Последняя заправка в Пшавели.
fa:
  name: دارتلو
  short: پرعکس‌ترین روستای توشتی، پلکانی بر فراز آلازانی پیریکیتی، با بام‌های سنگ‌لوح و برج‌های مرمت‌شده.
  body: >-
    **دارتلو همان تصویری است که بیشتر مردم از توشتی با خود می‌برند، و به‌محض رسیدن دلیلش روشن می‌شود.**
    روستا به‌صورت پلکانی بر کرانهٔ چپ آلازانی پیریکیتی ساخته شده؛ خانه‌های سنگی یکی بالای دیگری ایستاده‌اند،
    هر بام از سنگ‌لوح تخت پوشیده شده، و میان خانه‌ها برج‌های دفاعی چهارگوش سر برآورده‌اند.


    برج‌ها از سدهٔ شانزدهم تا هجدهم‌اند و در برابر دسته‌های مهاجم داغستانی ساخته شدند که هر تابستان از
    یال می‌گذشتند. طبقهٔ همکف جای دام بود، طبقهٔ میانی خانواده و طبقهٔ بالا برای دیده‌بانی و تیراندازی.
    چند برج در بیست سال اخیر با پول بین‌المللی و به شیوهٔ اصیل چیدن سنگ بدون ملات بازسازی شده‌اند، و کار
    چنان تمیز است که تشخیص کهنه از نو نگاه دوم می‌خواهد.


    در میان روستا «سابچئو» قرار دارد؛ نیم‌دایره‌ای از نیمکت‌های سنگی که شورای ریش‌سفیدان بر آن می‌نشست
    و دعواها را فیصله می‌داد. این بازسازی نیست: سنگ‌ها همان‌جایی هستند که قرن‌ها بوده‌اند.


    بالای دارتلو، پس از یک ساعت صعود تند، کواولو است؛ آبادی متروکی با یک برج برجای‌مانده و دیدی بر تمام
    درّه. اگر یک روز آزاد در دارتلو دارید، همین پیاده‌روی را انجام دهید.


    روستا فقط در تابستان زنده است. خانواده‌ها در خرداد پشت سر گله‌ها بالا می‌آیند و در مهر به دشت برمی‌گردند؛
    دامداری توشی هنوز بر همین کوچ فصلی استوار است و گوسفندان صدها کیلومتر پیاده رانده می‌شوند. در زمستان
    دارتلو خالی است، زیر برف و دست‌نیافتنی.
  tip: >-
    باید شب را بمانید؛ رفت و برگشت در یک روز واقع‌بینانه نیست. مهمان‌خانه‌ها از خرداد تا شهریور کار می‌کنند
    و رزرو بهتر است، هرچند آنتن ضعیف است و پیام‌ها اغلب بی‌پاسخ می‌ماند. برق از پنل خورشیدی و ژنراتور
    می‌آید، پس هر وقت توانستید همه‌چیز را شارژ کنید. خودپرداز نیست و مغازه هم عملاً نیست، پس پول نقد همراه
    ببرید. آب چشمه پاک و آشامیدنی است. شب‌ها حتی در تیر به 5 تا 8 درجه می‌رسد، پس لایهٔ گرم بیاورید.
  route: >-
    از تفلیس تا تلاوی از گردنهٔ گومبوری (95 کیلومتر) و سپس آسفالت تا پشاولی. از پشاولی راه خاکی آغاز می‌شود:
    صعود گردنهٔ آبانو در 2850 متر و سرازیری تا اومالو؛ این بخش در مجموع حدود پنج ساعت طول می‌کشد. از اومالو
    15 کیلومتر دیگر در امتداد تنگه تا دارتلو، نزدیک یک ساعت، با چند گدار رودخانه. جمعاً 228 کیلومتر و
    حدود هفت ساعت. فقط با خودروی چهارچرخ‌محرک. آخرین سوخت در پشاولی است.
he:
  name: דארטלו
  short: הכפר המצולם ביותר בטושתי, מדורג מעל האלאזני הפיריקיטית, עם גגות צפחה ומגדלים משוחזרים.
  body: >-
    **דארטלו היא התמונה שרוב האנשים לוקחים איתם מטושתי, והסיבה מובנת ברגע ההגעה.** הכפר בנוי במדרגות על
    הגדה השמאלית של האלאזני הפיריקיטית; בתי אבן עומדים זה מעל זה, כל גג מרוצף בצפחה שטוחה, ובין הבתים
    מתנשאים מגדלי הגנה מרובעים.


    המגדלים הם מן המאות ה-16 עד ה-18 ונבנו נגד כנופיות פשיטה דאגסטניות שחצו את הרכס בכל קיץ. קומת הקרקע
    שימשה למקנה, הקומה האמצעית למשפחה, והעליונה לתצפית וירי. אחדים שוחזרו בעשרים השנים האחרונות במימון
    בינלאומי, בטכניקת בנייה יבשה מקורית ולא במלט, והעבודה טובה דיה כדי שיידרש מבט שני להבחין בין ישן לחדש.


    במרכז הכפר ניצב הסאבצ'או, חצי מעגל של ספסלי אבן שבו ישבה מועצת הזקנים והכריעה בסכסוכים. זו אינה שחזור:
    האבנים יושבות במקום שבו ישבו מאות שנים.


    מעל דארטלו, שעה של טיפוס תלול, נמצאת קוואוולו, כפר נטוש עם מגדל אחד ששרד ונוף על העמק כולו. אם יש
    לכם יום פנוי בדארטלו, זה הטיול שכדאי לעשות.


    הכפר חי רק בקיץ. המשפחות עולות ביוני בעקבות העדרים ויורדות למישור באוקטובר; גידול הצאן הטושי עדיין
    נשען על הנדידה העונתית הזו, והכבשים מובלות מאות קילומטרים לכל כיוון. בחורף דארטלו ריקה, קבורה בשלג
    ובלתי נגישה.
  tip: >-
    צריך ללון כאן; להגיע ולחזור ביום אחד אינו ריאלי. בתי ההארחה פועלים מיוני עד ספטמבר וכדאי להזמין, אף
    שהקליטה חלקית והודעות נשארות לא פעם ללא מענה. החשמל מגיע מפאנלים סולריים ומגנרטורים, אז הטעינו הכול
    כשאפשר. אין כספומט ולמעשה אין חנות, לכן הביאו מזומן. מי המעיין נקיים וראויים לשתייה. הלילות יורדים
    ל-5-8 מעלות גם ביולי, אז קחו שכבה חמה.
  route: >-
    מטביליסי לטלאווי מעל מעבר גומבורי (95 ק״מ), ואז אספלט עד פשאוולי. מפשאוולי מתחילה דרך העפר: טיפוס
    למעבר אבאנו בגובה 2,850 מ' וירידה לאומאלו; הקטע הזה כולו אורך כחמש שעות. מאומאלו עוד 15 ק״מ לאורך
    הערוץ עד דארטלו, כשעה, עם מעברות בנהר. בסך הכול 228 ק״מ וכשבע שעות. רק ברכב שטח. הדלק האחרון בפשאוולי.
ar:
  name: دارتلو
  short: أكثر قرى توشيتي تصويراً، مدرّجة فوق ألازاني بيريكيتي، بسقوف من الأردواز وأبراج مُرممة.
  body: >-
    **دارتلو هي الصورة التي يحملها معظم الناس من توشيتي، والسبب يتضح لحظة الوصول.** بُنيت القرية مدرّجات
    على الضفة اليسرى لنهر ألازاني بيريكيتي؛ بيوت حجرية يعلو بعضها بعضاً، وكل سقف مفروش بألواح أردواز مسطحة،
    وبين البيوت تنهض أبراج دفاع مربعة.


    والأبراج من القرن السادس عشر إلى الثامن عشر، وبُنيت في وجه جماعات الغارة الداغستانية التي كانت تعبر
    الحيد كل صيف. الطابق الأرضي للماشية والأوسط للعائلة والأعلى للمراقبة والرمي. وقد أُعيد بناء عدة أبراج
    في العشرين سنة الأخيرة بتمويل دولي، بتقنية البناء الجاف الأصلية لا بالملاط، والعمل متقن بحيث تحتاج
    نظرة ثانية لتفرّق القديم من الجديد.


    وفي وسط القرية يقوم «السابتشئو»، نصف دائرة من مقاعد حجرية كان يجلس عليها مجلس الشيوخ ويفصل في الخصومات.
    وليس هذا إعادة بناء: فالحجارة في مواضعها منذ قرون.


    وفوق دارتلو، بعد ساعة من الصعود الحاد، تقع كفافلو، قرية مهجورة ببرج واحد باقٍ وإطلالة على الوادي كله.
    وإن كان لديك يوم فارغ في دارتلو فهذه هي النزهة التي تستحق.


    والقرية لا تحيا إلا في الصيف. تصعد الأسر في حزيران خلف القطعان وتنزل إلى السهول في تشرين الأول؛ ولا
    تزال رعاية الغنم التوشية قائمة على هذا الترحال الموسمي، إذ تُساق الأغنام مئات الكيلومترات في كل اتجاه.
    وفي الشتاء تخلو دارتلو وتدفنها الثلوج ويتعذر بلوغها.
  tip: >-
    لا بد من المبيت؛ فالذهاب والعودة في يوم واحد غير واقعي. تعمل بيوت الضيافة من حزيران إلى أيلول ويُستحسن
    الحجز، وإن كانت التغطية متقطعة وكثيراً ما تبقى الرسائل بلا رد. والكهرباء من ألواح شمسية ومولدات، فاشحن
    كل شيء متى استطعت. ولا صراف آلي ولا متجر عملياً، فاحمل نقداً. وماء النبع نظيف صالح للشرب. وتهبط الليالي
    إلى 5 أو 8 درجات حتى في تموز، فخذ طبقة دافئة.
  route: >-
    من تبليسي إلى تيلافي عبر ممر غومبوري (95 كم)، ثم إسفلت حتى بشاولي. ومن بشاولي يبدأ التراب: صعود ممر
    أبانو عند 2850 م ثم النزول إلى أومالو؛ ويستغرق هذا القسم كله نحو خمس ساعات. ومن أومالو 15 كم أخرى
    بمحاذاة المضيق حتى دارتلو، نحو ساعة، مع مخاضات في النهر. المجموع 228 كم وقرابة سبع ساعات. ولا يُسلك
    إلا بدفع رباعي. وآخر وقود في بشاولي.
