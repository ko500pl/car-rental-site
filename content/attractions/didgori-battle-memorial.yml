ka:
  name: დიდგორის ბრძოლის მემორიალი
  short: გიგანტური ლითონის ხმლები დიდგორის მთაზე — 1121 წლის ბრძოლის მემორიალი, სადაც დავით აღმაშენებელმა
    სელჩუკთა უზარმაზარი ლაშქარი დაამარცხა.
  body: >-
    **დიდგორის მემორიალი საქართველოს ისტორიის ყველაზე დიდი გამარჯვების ადგილას დგას.** 1121 წლის 12 აგვისტოს
    დიდგორის ველზე დავით IV აღმაშენებელმა მრავალჯერ აღმატებული სელჩუკთა ლაშქარი გაანადგურა. ეს გამარჯვება
    გარდამტეხი აღმოჩნდა: მომდევნო წელს, 1122-ში, დავითმა თბილისი გაათავისუფლა და ქვეყანა ოქროს ხანაში
    შევიდა. ქართულ ცნობიერებაში „ძლევაი საკვირველი" დღემდე ეროვნული სიამაყის მთავარი სიმბოლოა.


    მემორიალური კომპლექსი მოქანდაკე მერაბ ბერძენიშვილმა და არქიტექტორმა თამაზ გაბუნიამ შექმნეს. მისი ყველაზე
    ცნობადი ელემენტი გიგანტური ლითონის ხმლებია, პირით მიწაში ჩარჭობილი — ჯვრებივით აღმართული ფერდობზე.
    კომპლექსში ასევე შედის ბარელიეფებიანი ცენტრალური სტელა, მეომრების ბრინჯაოს ფიგურები, ზარები და ფერდობზე
    გაშლილი კოლონადიანი ამფითეატრი. ყოველ აგვისტოს აქ „დიდგორობის" დღესასწაული იმართება.


    ადგილი ღია ცის ქვეშაა და დაუბრკოლებლად დაათვალიერებ 30–60 წუთში. მთავარი ჯილდო ხედებია: მემორიალიდან
    ქვემო ქართლის ველები და თრიალეთის ქედი იშლება. ამინდი აქ სწრაფად იცვლება და ნისლი ხშირია — ყველაზე
    შთამბეჭდავი ადრეული ზაფხულის მოწმენდილი დილაა, როცა ხმლების სილუეტები ცას ეხატება.
  tip: >-
    ამინდი წინასწარ შეამოწმე: მთაზე ნისლი მოულოდნელად ადგება და ხედს მთლიანად ფარავს. თან აიღე ქარის ქურთუკი
    ზაფხულშიც — 1650 მეტრზე ყოველთვის ქრის. კაფე და მაღაზია ადგილზე არ არის, წყალი და საჭმელი თბილისიდანვე
    წამოიღე. თუ აგვისტოში ხარ, დიდგორობის დღესასწაულს დაამთხვიე — ხალხური მუსიკით და სუფრებით მთელი მთა
    ცოცხლდება. მემორიალი უფასოა და ღობე არ აქვს.
  route: >-
    თბილისიდან წავკისისა და კოჯრის გავლით მანგლისის გზას გაჰყევი, შემდეგ მაჩვენებელი დიდგორისკენ აგიყვანს
    — სულ 57 კმ და დაახლოებით საათი და 20 წუთი. გზა ბოლომდე ასფალტიანია და მშრალ ამინდში ჩვეულებრივი სედანით
    თავისუფლად ივლი. ზამთარში მთის მონაკვეთი თოვლმა შეიძლება ჩაკეტოს — გვიან შემოდგომიდან გაზაფხულამდე
    გამგზავრებამდე გზის მდგომარეობა გადაამოწმე.
en:
  name: Didgori Battle Memorial
  short: Giant metal swords on Didgori mountain mark the 1121 battle where David the Builder crushed a
    vastly larger Seljuk army.
  body: >-
    **The Didgori memorial stands on the site of the greatest victory in Georgian history.** On 12 August
    1121, on the Didgori field, King David IV the Builder routed a Seljuk army many times the size of his
    own. The victory proved decisive: the following year, in 1122, David liberated Tbilisi, and the country
    entered its Golden Age. In Georgian memory the battle is still called the "miraculous victory", and
    it remains the nation's proudest single day.


    The memorial complex was created by sculptor Merab Berdzenishvili with architect Tamaz Gabunia. Its
    most recognisable element is a group of giant metal swords plunged blade-down into the hillside, rising
    like crosses against the sky. The ensemble also includes a central stele carved with bas-reliefs, bronze
    figures of warriors, bells, and a colonnaded amphitheatre spread across the slope. Every August the
    site hosts the "Didgoroba" festival commemorating the battle.


    The site is open-air and free, and an unhurried visit takes 30–60 minutes. The real reward is the setting:
    from the memorial the plains of Kvemo Kartli and the Trialeti range open out in every direction. Weather
    changes suddenly up here and fog is common — the most impressive moment is a clear early-summer morning,
    when the sword silhouettes stand sharp against the sky.
  tip: >-
    Check the forecast before you go: fog rolls onto the mountain without warning and can hide the views
    completely. Bring a windproof jacket even in summer — at 1,650 metres the wind rarely stops. There
    is no café or shop on site, so carry water and food from Tbilisi. If you are here in August, time your
    visit for the Didgoroba festival, when the whole mountain comes alive with folk music and feasting.
    The memorial is free and unfenced.
  route: >-
    From Tbilisi follow the Manglisi road through Tsavkisi and Kojori, then a signposted turn climbs to
    Didgori — 57 km and about an hour and twenty minutes in total. The road is paved the whole way, and
    in dry weather an ordinary sedan manages easily. In winter snow can close the mountain section — from
    late autumn to spring check road conditions before setting out.
ru:
  name: Мемориал Дидгорской битвы
  short: Гигантские металлические мечи на горе Дидгори — памятник битвы 1121 года, в которой Давид Строитель
    разгромил многократно превосходящую армию сельджуков.
  body: >-
    **Мемориал Дидгори стоит на месте величайшей победы в истории Грузии.** 12 августа 1121 года на Дидгорском
    поле царь Давид IV Строитель разгромил сельджукскую армию, многократно превосходившую его собственную.
    Победа оказалась решающей: уже в следующем, 1122 году Давид освободил Тбилиси, и страна вступила в
    свой Золотой век. В грузинской памяти эта битва до сих пор зовётся «чудесной победой» и остаётся главным
    днём национальной гордости.


    Мемориальный комплекс создали скульптор Мераб Бердзенишвили и архитектор Тамаз Габуния. Его самый узнаваемый
    элемент — гигантские металлические мечи, вонзённые остриём в склон и поднимающиеся к небу, как кресты.
    В ансамбль входят также центральная стела с барельефами, бронзовые фигуры воинов, колокола и колоннадный
    амфитеатр, раскинувшийся по склону. Каждый август здесь проходит праздник «Дидгороба» в память о битве.


    Мемориал находится под открытым небом, вход свободный, на неспешный осмотр уходит 30–60 минут. Главная
    награда — само место: отсюда во все стороны открываются равнины Квемо-Картли и Триалетский хребет.
    Погода наверху меняется внезапно, туман — обычное дело; самый впечатляющий момент — ясное раннелетнее
    утро, когда силуэты мечей чётко рисуются на фоне неба.
  tip: >-
    Проверьте прогноз перед выездом: туман накрывает гору без предупреждения и может полностью скрыть виды.
    Возьмите ветровку даже летом — на 1650 метрах ветер почти не стихает. Кафе и магазинов на месте нет,
    воду и еду везите из Тбилиси. Если вы здесь в августе, подгадайте под праздник Дидгороба — вся гора
    оживает народной музыкой и застольями. Вход свободный, ограждений нет.
  route: >-
    Из Тбилиси следуйте по манглисской дороге через Цавкиси и Коджори, затем указатель уводит наверх к
    Дидгори — всего 57 км и около часа двадцати минут. Дорога асфальтирована до конца, и в сухую погоду
    обычный седан справляется без труда. Зимой горный участок может закрыть снег — с поздней осени до весны
    уточняйте состояние дороги перед выездом.
fa:
  name: یادبود نبرد دیدگوری
  short: شمشیرهای غول‌پیکر فلزی بر کوه دیدگوری — یادبود نبرد سال 1121 که در آن داوود سازنده سپاه بسیار
    بزرگ‌تر سلجوقیان را در هم شکست.
  body: >-
    **یادبود دیدگوری بر جایگاه بزرگ‌ترین پیروزی تاریخ گرجستان ایستاده است.** در 12 اوت 1121، در دشت دیدگوری،
    شاه داوود چهارم سازنده سپاه سلجوقی‌ای را که چند برابر نیروی خودش بود تار و مار کرد. این پیروزی سرنوشت‌ساز
    شد: سال بعد، در 1122، داوود تفلیس را آزاد کرد و کشور به عصر طلایی خود گام نهاد. در حافظهٔ گرجی‌ها این
    نبرد هنوز «پیروزی شگفت» خوانده می‌شود و پرافتخارترین روز ملت باقی مانده است.


    مجموعهٔ یادبود را پیکرتراش مراب بردزنیشویلی همراه با معمار تاماز گابونیا آفریدند. شناخته‌شده‌ترین عنصر
    آن شمشیرهای غول‌پیکر فلزی است که تیغه‌به‌پایین در دامنه فرو رفته‌اند و چون صلیب‌هایی رو به آسمان برخاسته‌اند.
    مجموعه همچنین ستون یادبود مرکزی با نقش‌برجسته‌ها، پیکره‌های برنزی جنگاوران، ناقوس‌ها و آمفی‌تئاتری
    ستون‌دار را در بر می‌گیرد که بر دامنه گسترده است. هر اوت جشنوارهٔ «دیدگوروبا» به یاد نبرد در اینجا برگزار
    می‌شود.


    محوطه روباز و رایگان است و بازدیدی بی‌شتاب 30 تا 60 دقیقه می‌گیرد. پاداش اصلی خودِ چشم‌انداز است: از
    یادبود دشت‌های کومو کارتلی و رشته‌کوه تریالتی از هر سو گشوده می‌شوند. هوا اینجا ناگهانی عوض می‌شود
    و مه رایج است — باشکوه‌ترین لحظه بامداد صاف اوایل تابستان است، وقتی سایه‌نمای شمشیرها تیز بر آسمان
    نقش می‌بندد.
  tip: >-
    پیش از رفتن پیش‌بینی هوا را ببینید: مه بی‌خبر روی کوه می‌نشیند و می‌تواند منظره را یکسره بپوشاند. حتی
    در تابستان بادگیر بردارید — در ارتفاع 1,650 متر باد به‌ندرت می‌ایستد. در محل کافه و فروشگاهی نیست،
    آب و خوراک را از تفلیس بیاورید. اگر در ماه اوت اینجا هستید، بازدیدتان را با جشنوارهٔ دیدگوروبا هماهنگ
    کنید — تمام کوه با موسیقی محلی و سفره‌ها جان می‌گیرد. یادبود رایگان است و حصاری ندارد.
  route: >-
    از تفلیس جادهٔ مانگلیسی را از میان تساوکیسی و کوجوری دنبال کنید، سپس تابلویی شما را به بالا به دیدگوری
    می‌برد — روی هم 57 کیلومتر و حدود یک ساعت و بیست دقیقه. جاده تا انتها آسفالت است و در هوای خشک سواری
    معمولی به‌راحتی از پس آن برمی‌آید. در زمستان برف ممکن است بخش کوهستانی را ببندد — از اواخر پاییز تا
    بهار پیش از حرکت وضعیت جاده را بپرسید.
he:
  name: אנדרטת קרב דידגורי
  short: חרבות מתכת ענקיות על הר דידגורי — אנדרטה לקרב של שנת 1121, שבו דוד הבונה הביס צבא סלג'וקי גדול
    לאין שיעור.
  body: >-
    **אנדרטת דידגורי עומדת על אתר הניצחון הגדול ביותר בתולדות גאורגיה.** ב-12 באוגוסט 1121, בשדה דידגורי,
    הביס המלך דוד הרביעי הבונה צבא סלג'וקי שגדל פי כמה מכוחו שלו. הניצחון הוכרע כגורלי: בשנה שלאחר מכן,
    1122, שחרר דוד את טביליסי, והמדינה נכנסה לתור הזהב שלה. בזיכרון הגאורגי הקרב עדיין נקרא "הניצחון המופלא",
    והוא נותר יום הגאווה הלאומית הגדול מכולם.


    את מתחם ההנצחה יצרו הפסל מרב ברדזנישווילי והאדריכל תמז גבוניה. המרכיב המזוהה ביותר שלו הוא קבוצת חרבות
    מתכת ענקיות הנעוצות בלהבן במורד הגבעה ומתנשאות אל השמיים כמו צלבים. המכלול כולל גם מצבת אבן מרכזית
    מעוטרת בתבליטים, דמויות ברונזה של לוחמים, פעמונים ואמפיתיאטרון עמודים הפרוש על המדרון. מדי אוגוסט מתקיים
    כאן פסטיבל "דידגורובה" לזכר הקרב.


    האתר פתוח תחת כיפת השמיים והכניסה חופשית; ביקור נינוח אורך 30–60 דקות. הפרס האמיתי הוא הנוף: מהאנדרטה
    נפרשים לכל עבר מישורי קוומו-קרתלי ורכס טריאלטי. מזג האוויר כאן משתנה בפתאומיות והערפל שכיח — הרגע המרשים
    ביותר הוא בוקר צלול של תחילת הקיץ, כשצלליות החרבות מצטיירות חדות על רקע השמיים.
  tip: >-
    בדקו את התחזית לפני היציאה: הערפל עולה על ההר ללא התרעה ועלול להסתיר את הנוף לגמרי. קחו מעיל רוח גם
    בקיץ — בגובה 1,650 מטר הרוח כמעט אינה פוסקת. אין באתר בית קפה או חנות, אז הצטיידו במים ובאוכל מטביליסי.
    אם אתם כאן באוגוסט, כוונו את הביקור לפסטיבל דידגורובה — ההר כולו מתעורר לחיים במוזיקה עממית ובסעודות.
    האנדרטה חופשית לביקור וללא גדר.
  route: >-
    מטביליסי נוסעים בכביש מנגליסי דרך צאווקיסי וקוג'ורי, ואז פנייה משולטת מטפסת לדידגורי — 57 ק״מ וכשעה
    ועשרים דקות בסך הכול. הכביש סלול לכל אורכו, ובמזג אוויר יבש סדאן רגיל מסתדר בקלות. בחורף שלג עלול לסגור
    את הקטע ההררי — מסוף הסתיו עד האביב בדקו את מצב הדרך לפני היציאה.
ar:
  name: نصب معركة ديدغوري
  short: سيوف معدنية عملاقة على جبل ديدغوري — نصب معركة عام 1121 التي سحق فيها داود الباني جيشاً سلجوقياً
    يفوقه عدداً بأضعاف.
  body: >-
    **يقف نصب ديدغوري في موقع أعظم انتصار في تاريخ جورجيا.** في 12 أغسطس 1121، وعلى سهل ديدغوري، هزم الملك
    داود الرابع الباني جيشاً سلجوقياً يفوق جيشه عدداً بأضعاف. وكان النصر حاسماً: ففي العام التالي، 1122،
    حرّر داود تبليسي ودخلت البلاد عصرها الذهبي. وفي الذاكرة الجورجية ما تزال المعركة تُدعى «النصر العجيب»،
    وتبقى أكثر أيام الأمة مدعاةً للفخر.


    أبدع المجمّعَ التذكاري النحّاتُ ميراب بردزينيشفيلي مع المعماري تاماز غابونيا. وأشهر عناصره مجموعة سيوف
    معدنية عملاقة مغروسة بنصالها في سفح التل، ترتفع نحو السماء كالصلبان. ويضم المجمّع أيضاً نصباً مركزياً
    منحوتاً بالنقوش البارزة، وتماثيل برونزية لمحاربين، وأجراساً، ومدرّجاً ذا أعمدة يمتد على المنحدر. وفي
    كل أغسطس يستضيف الموقع مهرجان «ديدغوروبا» إحياءً لذكرى المعركة.


    الموقع في الهواء الطلق ومجاني، وتستغرق زيارته المتأنية 30 إلى 60 دقيقة. والمكافأة الحقيقية هي المشهد
    نفسه: فمن النصب تنبسط سهول كفيمو كارتلي وسلسلة تريالتي في كل اتجاه. يتقلب الطقس هنا فجأة والضباب مألوف
    — وأبهى اللحظات صباحٌ صافٍ من أوائل الصيف، حين ترتسم ظلال السيوف حادةً على صفحة السماء.
  tip: >-
    تحقق من النشرة الجوية قبل الانطلاق: فالضباب يزحف على الجبل دون سابق إنذار وقد يحجب المشهد كلياً. خذ
    سترة واقية من الريح حتى في الصيف — فعلى ارتفاع 1,650 متراً لا تكاد الريح تهدأ. لا مقهى ولا متجر في
    الموقع، فاحمل الماء والطعام من تبليسي. وإن كنت هنا في أغسطس فوافِق زيارتك مع مهرجان ديدغوروبا — إذ
    يدبّ في الجبل كله دبيب الموسيقى الشعبية والموائد. النصب مجاني وبلا سياج.
  route: >-
    من تبليسي اتبع طريق مانغليسي عبر تسافكيسي وكوجوري، ثم يصعد بك منعطف مُعلَّم إلى ديدغوري — 57 كم ونحو
    ساعة وعشرين دقيقة إجمالاً. الطريق معبّد حتى النهاية، وفي الجو الجاف تجتازه سيارة سيدان عادية بسهولة.
    وفي الشتاء قد يغلق الثلج المقطع الجبلي — فمن أواخر الخريف إلى الربيع تحقق من حالة الطريق قبل الانطلاق.
