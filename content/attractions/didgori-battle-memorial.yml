ka:
  name: დიდგორის ბრძოლის მემორიალი
  short: >-
    1650 მეტრზე, ბალახში ჩარჭობილი გოლიათური ხმლები იმ ადგილს აღნიშნავს, სადაც 1121 წლის 12 აგვისტოს დავით
    აღმაშენებელმა მრავალჯერ აღმატებული მტერი გატეხა.
  body: >-
    **დიდგორის შიშველ ქედზე გოლიათური ხმლები პირით მიწაშია ჩარჭობილი — თითქოს ლაშქარმა საქმე აქ დაასრულა
    და იარაღი ადგილზევე დატოვა.**


    1121 წლის 12 აგვისტოს დავით IV აღმაშენებელი სელჩუკთა კოალიციას შეება, რომელსაც მარდინის ამირა ილღაზი
    მეთაურობდა — ის, ვინც ორი წლით ადრე ჯვაროსნები „სისხლის ველზე“ გაანადგურა. შუა საუკუნეების მემატიანეები
    ილღაზის ლაშქარს 400 ან თუნდაც 600 ათასად ითვლიდნენ, თანამედროვე ქართველი ისტორიკოსები კი 100–250 ათასს
    ვარაუდობენ. დავითს დაახლოებით 56 ათასი მებრძოლი ჰყავდა: ქართველები, 15 ათასი ყივჩაღი მხედარი, ალანები
    და ფრანგ რაინდთა რაზმი.


    გამარჯვება ადგილის არჩევამ მოიტანა. დავითმა მტერი მანგლისსა და თბილისს შორის, ვიწრო, ტყიან მთებში
    დაუხვდა, სადაც რიცხობრივი უპირატესობა თითქმის აღარაფერს ნიშნავდა. ანტიოქიის სამთავროს კანცლერი გოტიე
    მეფეს ბრძოლისწინა მკაცრ აღთქმას მიაწერს: თუ ვინმე უკან დახევას მოისურვებს, ხევის შესასვლელი ტოტებით
    ჩავკეტოთო. იბნ ალ-ასირის ცნობით, ყივჩაღთა მცირე რაზმი მტერს თითქოს მოსალაპარაკებლად მიუახლოვდა და
    სელჩუკ სარდლებს ისრები დაუშინა. მძიმე ცხენოსნებმა ორივე ფრთიდან შეუტიეს — ერთს თავად მეფე წინამძღოლობდა,
    მეორეს მისი ძე დემეტრე, — და დაახლოებით სამ საათში კოალიციური ლაშქარი გაიქცა. მომდევნო წელს დავითმა
    თბილისი აიღო, მატიანემ კი ეს დღე „ძლევაჲ საკვირველის“ სახელით შემოინახა.


    მემორიალისთვის მოქანდაკე მერაბ ბერძენიშვილსა და არქიტექტორ თამაზ გაბუნიას 1995 წელს საქართველოს სახელმწიფო
    პრემია მიენიჭათ. კიბე მოჩუქურთმებულ ცენტრალურ სტელამდე ადის, მის ქვემოთ კი კოლონადა ღია ამფითეატრს
    რკალად შემოუვლის. ხმლები ყველაზე მძაფრად ლურჯ, მოწმენდილ ცაზე იკითხება, ან ნისლიდან ამოზრდილი — ნისლი
    კი აქ ხშირი სტუმარია. ყოველ 12 აგვისტოს დიდგორობა ბრძოლის წლისთავს ისევ ამ მთაზე აბრუნებს.


    გაიარეთ ხმლებს შორის და ქვემოთ, ტყიან ნაოჭებს გადახედეთ: ბრძოლა სწორედ ამ რელიეფმა მოიგო და აქ დღესაც
    ის არის მთავარი ექსპონატი.
  tip: >-
    გასვლამდე ამინდის პროგნოზი ნახეთ: ნისლს ქედის დაფარვა რამდენიმე წუთში შეუძლია და ხმლები მთლიანად ქრება.
    1650 მეტრზე ქარი იშვიათად ჩადგება, ამიტომ ქარგაუმტარი ქურთუკი ივლისშიც წაიღეთ. კაფე, მაღაზია და ტუალეტი
    არ არის — წყალი და საჭმელი თან იქონიეთ. მემორიალი ღია ცის ქვეშაა, შემოღობილი არ არის და უფასოა; 30–60
    წუთი საკმარისია. 12 აგვისტოს, დიდგორობაზე, მთა ხალხითა და ზეიმით ივსება — სანახაობა დასამახსოვრებელია,
    ოღონდ მთის გზაზე ნელ მოძრაობას მოელოდეთ. ყველაზე მკვეთრ სილუეტებს მაისიდან ოქტომბრამდე მოწმენდილი
    დილა იძლევა.
  route: >-
    კლასიკური გზა თბილისიდან კოჯრის გზატკეცილით ადის, კოჯორს გასცდება, თბილისი–მანგლისის გზაზე (შ36) გადის
    და შემდეგ, საგზაო ნიშნების მიხედვით, მთის გზით (შ153) მემორიალამდე ამოდის: 57 კმ, დაახლოებით 1 საათი
    და 20 წუთი, უამრავი მოსახვევით. ოდნავ მოკლე ალტერნატივა მცხეთაზე გადის: შ29-ით კავთისხევის მიმართულებით,
    შემდეგ კი მეორე მხრიდან იმავე შ153-ზე — დაახლოებით 53 კმ, ერთი საათის სავალი. გზა მთლიანად მოასფალტებულია
    და მშრალ ამინდში ეკონომ-კლასის მანქანაც თავისუფლად გაივლის. საწვავი თბილისში ჩაასხით. გვიან შემოდგომიდან
    გაზაფხულამდე თოვლმა და ყინულმა ზედა მონაკვეთი შეიძლება ჩაკეტოს — გზის მდგომარეობა წინასწარ გადაამოწმეთ.
en:
  name: Didgori Battle Memorial
  short: >-
    Giant swords stand in the turf at 1,650 metres where, on 12 August 1121, David the Builder broke a
    far larger Seljuk-led coalition.
  body: >-
    **On the bare ridge of Didgori, giant swords stand point-down in the turf, as if an army had finished
    its work here and left its blades behind.**


    On 12 August 1121 King David IV the Builder met a Seljuk-led coalition under Ilghazi of Mardin, the
    emir who two years earlier had destroyed a Crusader army at the Field of Blood. Medieval chroniclers
    credited Ilghazi with 400,000 or even 600,000 men; modern Georgian historians estimate 100,000–250,000.
    David had about 56,000: Georgians, 15,000 Kipchak horsemen, Alans and a band of Frankish knights.


    He won by choosing the ground. He met the enemy in the narrow, wooded mountains between Manglisi and
    Tbilisi, where numbers counted for little. The chronicler Walter the Chancellor gives him a hard vow
    before the fight: should anyone think of retreat, "let us take branches and block the entrance to
    the gorge". According to Ibn al-Athir, a small Kipchak detachment rode over as if to parley, then
    loosed arrows on the Seljuk commanders. Heavy cavalry struck both flanks — David led one wing, his
    son Demetrius the other — and within about three hours the coalition was in flight. The next year
    David took Tbilisi, and the chronicles remember the day as the "miraculous victory".


    For the memorial, the sculptor Merab Berdzenishvili and the architect Tamaz Gabunia received the Georgian
    State Prize in 1995. Steps climb to a carved central stele, and below it a colonnade curves round
    an open-air amphitheatre. The swords read best against a hard blue sky, or looming out of fog, which
    is frequent. Every 12 August, Didgoroba brings the anniversary back to the hill.


    Walk among the blades and look down at the wooded folds below: the ground that won the battle is still
    the main exhibit.
  tip: >-
    Check the forecast before you set out: fog can swallow the ridge in minutes and hide the swords completely.
    At 1,650 metres the wind rarely drops, so bring a windproof layer even in July. There is no café,
    shop or toilet, so carry water and food. The memorial is open-air, unfenced and free; 30–60 minutes
    is enough. On 12 August, Didgoroba fills the hill with crowds and celebration — memorable, but expect
    slow traffic on the mountain road. Clear mornings between May and October give the sharpest silhouettes.
  route: >-
    The classic approach climbs out of Tbilisi on the Kojori road, continues beyond Kojori to the Tbilisi–Manglisi
    road (Sh36) and then takes the signposted mountain road (Sh153) up to the memorial: 57 km, about 1
    hour 20 minutes, with plenty of bends. A slightly shorter alternative runs via Mtskheta and the Sh29
    towards Kavtiskhevi, joining the same Sh153 from the other side — roughly 53 km and an hour. The road
    is paved throughout, and an economy car copes in dry weather. Fill up in Tbilisi. From late autumn
    to spring, snow and ice can close the upper section, so check conditions first.
ru:
  name: Мемориал Дидгорской битвы
  short: >-
    Гигантские мечи в дёрне на высоте 1650 метров — там, где 12 августа 1121 года Давид Строитель разбил
    куда более многочисленную коалицию во главе с сельджуками.
  body: >-
    **На голом хребте Дидгори в дёрн остриём вниз вонзены гигантские мечи — словно войско закончило здесь
    своё дело и оставило клинки.**


    12 августа 1121 года царь Давид IV Строитель встретил коалицию во главе с сельджуками, которую вёл
    Иль-Гази, эмир Мардина, — тот самый, что двумя годами раньше уничтожил армию крестоносцев на Кровавом
    поле. Средневековые хронисты приписывали Иль-Гази 400 000 и даже 600 000 воинов; современные грузинские
    историки оценивают его силы в 100 000–250 000. У Давида было около 56 000: грузины, 15 000 кипчакских
    всадников, аланы и отряд франкских рыцарей.


    Он победил, потому что сам выбрал поле боя. Давид встретил врага в тесных лесистых горах между Манглиси
    и Тбилиси, где численность мало что решала. Хронист Готье Канцлер вкладывает в его уста суровую клятву
    перед битвой: если кто-то задумает отступать, «возьмём ветви и завалим вход в ущелье». По словам Ибн
    аль-Асира, небольшой кипчакский отряд подъехал к противнику будто бы для переговоров — и осыпал стрелами
    сельджукских военачальников. Тяжёлая конница ударила по обоим флангам — одно крыло вёл сам Давид,
    другое — его сын Деметре, — и примерно через три часа коалиция бежала. На следующий год Давид взял
    Тбилиси, а летописи запомнили этот день как «чудесную победу».


    За мемориал скульптор Мераб Бердзенишвили и архитектор Тамаз Габуния в 1995 году получили Государственную
    премию Грузии. Ступени поднимаются к резной центральной стеле, а ниже неё колоннада полукругом огибает
    амфитеатр под открытым небом. Мечи лучше всего читаются на фоне густо-синего безоблачного неба — или
    когда проступают из тумана, а туман здесь частый гость. Каждый год 12 августа праздник Дидгороба возвращает
    годовщину битвы на этот холм.


    Пройдитесь между клинками и посмотрите вниз, на лесистые складки гор: земля, выигравшая битву, по-прежнему
    главный экспонат.
  tip: >-
    Перед выездом проверьте прогноз: туман способен за считаные минуты проглотить хребет и целиком скрыть
    мечи. На высоте 1650 метров ветер почти не стихает, так что ветровка пригодится даже в июле. Кафе,
    магазина и туалета нет — возьмите воду и еду. Мемориал под открытым небом, без ограды и бесплатный;
    30–60 минут вполне достаточно. 12 августа Дидгороба заполняет холм толпами и праздником — это запоминается,
    но на горной дороге будьте готовы к медленному движению. Самые чёткие силуэты дарят ясные утра с мая
    по октябрь.
  route: >-
    Классический путь поднимается из Тбилиси по Коджорской дороге, продолжается за Коджори до трассы Тбилиси
    — Манглиси (Sh36), а затем горная дорога Sh153 по указателям выводит к мемориалу: 57 км, около 1 часа
    20 минут, поворотов хватает. Чуть более короткий вариант идёт через Мцхету и по Sh29 в сторону Кавтисхеви,
    выходя на ту же Sh153 с другой стороны, — примерно 53 км и час. Асфальт на всём протяжении, и в сухую
    погоду справится машина эконом-класса. Заправьтесь в Тбилиси. С поздней осени до весны снег и лёд
    могут закрыть верхний участок, так что заранее узнайте, проезжа ли дорога.
fa:
  name: یادمان نبرد دیدگوری
  short: >-
    شمشیرهای غول‌آسا در ارتفاع ۱۶۵۰ متری در چمن فرو رفته‌اند؛ جایی که در ۱۲ اوت ۱۱۲۱ داوید سازنده ائتلافی
    بسیار بزرگ‌تر به سرکردگی سلجوقیان را درهم شکست.
  body: >-
    **بر یال برهنهٔ دیدگوری، شمشیرهای غول‌آسا نوک‌به‌پایین در چمن فرو رفته‌اند، گویی لشکری کارش را این‌جا
    به پایان برده و تیغ‌هایش را جا گذاشته است.**


    در ۱۲ اوت ۱۱۲۱، داوید چهارم، شاه گرجستان ملقب به «سازنده»، با ائتلافی به سرکردگی سلجوقیان رو‌به‌رو
    شد که فرمانده‌اش ایلغازی، امیر ماردین، بود؛ همان امیری که دو سال پیش‌تر سپاه صلیبیان را در «میدان
    خون» نابود کرده بود. وقایع‌نگاران سده‌های میانه شمار سپاه ایلغازی را ۴۰۰ هزار و حتی ۶۰۰ هزار نفر نوشته‌اند؛
    تاریخ‌نگاران امروزی گرجستان آن را ۱۰۰ تا ۲۵۰ هزار نفر برآورد می‌کنند. داوید حدود ۵۶ هزار نفر داشت:
    گرجیان، ۱۵ هزار سوارِ قپچاق، آلان‌ها و دسته‌ای از شوالیه‌های فرنگی.


    او با برگزیدن میدان نبرد پیروز شد. داوید دشمن را در کوهستان تنگ و جنگلی میان مانگلیسی و تفلیس پذیرا
    شد، جایی که شمار سپاه چندان به کار نمی‌آمد. والتر، دبیرِ دیوان انطاکیه و وقایع‌نگار، پیش از نبرد پیمانی
    سخت را از زبان او نقل می‌کند: اگر کسی به فکر عقب‌نشینی افتاد، «شاخه‌ها برگیریم و دهانهٔ تنگه را ببندیم».
    به روایت ابن اثیر، دسته‌ای کوچک از قپچاق‌ها چنان پیش تاختند که گویی برای گفت‌وگو می‌آیند، و آنگاه
    فرماندهان سلجوقی را به تیر بستند. سواره‌نظام سنگین بر هر دو جناح تاخت — یک جناح را خود داوید رهبری
    می‌کرد و دیگری را پسرش دمتره — و در حدود سه ساعت ائتلاف پا به فرار گذاشت. سال بعد داوید تفلیس را گرفت
    و وقایع‌نامه‌ها آن روز را «پیروزی شگفت» به یاد می‌آورند.


    برای این یادمان، مراب بردزنیشویلیِ پیکرتراش و تاماز گابونیای معمار در سال ۱۹۹۵ جایزهٔ دولتی گرجستان
    را گرفتند. پله‌هایی به ستون‌سنگِ منقوشِ میانی بالا می‌روند و پایین‌تر از آن، ردیفی از ستون‌ها گرداگرد
    آمفی‌تئاتری روباز قوس برمی‌دارد. شمشیرها در برابر آسمان آبیِ یکدست و بی‌ابر از همیشه گویاترند، یا
    وقتی از دل مه سر برمی‌آورند، که این‌جا کم پیش نمی‌آید. هر سال در ۱۲ اوت، جشن دیدگوروبا سالگرد نبرد
    را به این تپه بازمی‌گرداند.


    میان تیغه‌ها قدم بزنید و به چین‌خوردگی‌های جنگلیِ پایین نگاه کنید: زمینی که نبرد را برد، هنوز مهم‌ترین
    چیزِ دیدنیِ این‌جاست.
  tip: >-
    پیش از راه افتادن پیش‌بینی هوا را ببینید: مه می‌تواند در چند دقیقه یال را ببلعد و شمشیرها را یکسره
    پنهان کند. در ارتفاع ۱۶۵۰ متری باد به‌ندرت آرام می‌گیرد، پس حتی در ژوئیه یک لایهٔ بادگیر همراه داشته
    باشید. نه کافه‌ای هست، نه مغازه و نه دستشویی؛ آب و خوراک بیاورید. یادمان در فضای باز، بی‌حصار و رایگان
    است؛ ۳۰ تا ۶۰ دقیقه کافی است. در ۱۲ اوت جشن دیدگوروبا تپه را از جمعیت و شادی پر می‌کند — تجربه‌ای
    به‌یادماندنی، اما در جادهٔ کوهستانی منتظر ترافیک کُند باشید. صبح‌های صاف از ماه مه تا اکتبر واضح‌ترین
    سایه‌نماها را به دست می‌دهند.
  route: >-
    مسیر کلاسیک از تفلیس با جادهٔ کوجوری بالا می‌رود، پس از کوجوری تا جادهٔ تفلیس–مانگلیسی (Sh36) ادامه
    می‌یابد و سپس از جادهٔ کوهستانیِ Sh153، که تابلو دارد، تا یادمان بالا می‌رود: ۵۷ کیلومتر، حدود ۱ ساعت
    و ۲۰ دقیقه، با پیچ‌های فراوان. گزینهٔ اندکی کوتاه‌تر از راه متسختا و جادهٔ Sh29 به سوی کاوتیسخِوی
    می‌گذرد و از سوی دیگر به همان Sh153 می‌پیوندد — حدود ۵۳ کیلومتر و یک ساعت. جاده سراسر آسفالت است و
    در هوای خشک خودروی کلاس اقتصادی از پسش برمی‌آید. در تفلیس باک را پر کنید. از اواخر پاییز تا بهار ممکن
    است برف و یخ بخش بالایی را ببندد، پس پیش از رفتن از وضعیت راه باخبر شوید.
he:
  name: אנדרטת קרב דידגורי
  short: >-
    חרבות ענק נעוצות בדשא בגובה 1,650 מטר, במקום שבו ב־12 באוגוסט 1121 ריסק דוד הבונה קואליציה בהנהגה
    סלג'וקית שהייתה גדולה מצבאו בהרבה.
  body: >-
    **על רכס דידגורי החשוף ניצבות חרבות ענק, חודן נעוץ בדשא, כאילו צבא סיים כאן את מלאכתו והשאיר את להביו
    מאחור.**


    ב־12 באוגוסט 1121 יצא המלך דוד הרביעי הבונה מול קואליציה בהנהגה סלג'וקית בפיקודו של אילע'אזי, אמיר
    מרדין — האמיר שנתיים קודם לכן השמיד צבא צלבני בקרב "שדה הדם". כרוניקנים בני ימי הביניים ייחסו לאילע'אזי
    400,000 ואפילו 600,000 לוחמים; היסטוריונים גאורגים בני זמננו מעריכים את כוחו ב־100,000–250,000. לדוד
    היו כ־56,000: גאורגים, 15,000 פרשים קיפצ'קים, אלאנים וקבוצת אבירים פרנקים.


    הוא ניצח משום שבחר את שדה הקרב. הוא פגש את האויב בשטח ההררי, הצר והמיוער שבין מנגליסי לטביליסי, שבו
    לגודל הצבא היה משקל מועט. הכרוניקן ולטר הקנצלר שם בפיו נדר קשה לפני הקרב: אם מישהו יחשוב על נסיגה,
    "ניקח ענפים ונחסום את פתח הערוץ". לפי אבן אל־אתיר, יחידה קטנה של קיפצ'קים רכבה אל האויב כאילו באה
    לשאת ולתת, ואז המטירה חצים על מפקדי הסלג'וקים. פרשים כבדים הסתערו על שני האגפים — דוד הוביל אגף אחד
    ובנו דמטרה את השני — ובתוך כשלוש שעות נסה הקואליציה. בשנה שלאחר מכן כבש דוד את טביליסי, והכרוניקות
    זוכרות את היום ההוא בשם "הניצחון המופלא".


    על האנדרטה זכו הפסל מרב ברדזנישווילי והאדריכל תמז גבוניה בפרס המדינה של גאורגיה ב־1995. מדרגות מטפסות
    אל סטלה מרכזית מגולפת, ומתחתיה מקיפה שדרת עמודים בקשת אמפיתיאטרון פתוח. החרבות בולטות במיטבן על רקע
    שמיים כחולים ועזים, או כשהן מגיחות מתוך הערפל, שיורד כאן לעתים קרובות. בכל 12 באוגוסט מחזיר חג הדידגורובה
    את יום השנה לקרב אל הגבעה.


    טיילו בין הלהבים והביטו מטה אל קפלי היער: השטח שהכריע את הקרב הוא עדיין המוצג המרכזי.
  tip: >-
    בדקו את התחזית לפני היציאה: ערפל יכול לבלוע את הרכס בתוך דקות ולהסתיר את החרבות לגמרי. בגובה 1,650
    מטר הרוח כמעט אינה שוככת, אז קחו שכבה חוסמת רוח גם ביולי. אין כאן בית קפה, חנות או שירותים, ולכן הביאו
    מים ואוכל. האנדרטה פתוחה, ללא גדר וללא תשלום; 30–60 דקות מספיקות. ב־12 באוגוסט ממלאת הדידגורובה את
    הגבעה בהמונים ובחגיגה — חוויה בלתי נשכחת, אבל צפו לתנועה איטית בכביש ההררי. בקרים צלולים בין מאי לאוקטובר
    מעניקים את הצלליות החדות ביותר.
  route: >-
    הדרך הקלאסית מטפסת מטביליסי בכביש קוג'ורי, ממשיכה מעבר לקוג'ורי עד כביש טביליסי–מנגליסי (Sh36), ומשם
    עולה בכביש ההררי המשולט Sh153 אל האנדרטה: 57 ק"מ, כשעה ועשרים דקות, עם פיתולים רבים. חלופה מעט קצרה
    יותר עוברת דרך מצחתה וכביש Sh29 לכיוון קאוטיסחווי, ומצטרפת לאותו Sh153 מהצד השני — כ־53 ק"מ ושעה.
    הכביש סלול לכל אורכו, ורכב חסכוני מסתדר במזג אוויר יבש. תדלקו בטביליסי. מסוף הסתיו ועד האביב שלג וקרח
    עלולים לסגור את הקטע העליון, אז בדקו את מצב הדרך מראש.
ar:
  name: نُصب معركة ديدغوري
  short: >-
    سيوف عملاقة مغروزة في العشب على ارتفاع 1650 متراً، حيث حطّم داود البنّاء في 12 أغسطس 1121 تحالفاً
    بزعامة سلجوقية يفوق جيشه عدداً بكثير.
  body: >-
    **على سلسلة ديدغوري الجرداء تنتصب سيوف عملاقة غُرزت رؤوسها في العشب، كأن جيشاً أنجز مهمته هنا وترك
    نصاله خلفه.**


    في 12 أغسطس/آب 1121 واجه الملك داود الرابع البنّاء تحالفاً بزعامة سلجوقية يقوده إيلغازي صاحب ماردين،
    الأمير الذي أباد قبل عامين جيشاً صليبياً في معركة "ساحة الدم". نسب مؤرخو العصور الوسطى إلى إيلغازي
    400 ألف رجل بل 600 ألف؛ أما المؤرخون الجورجيون المعاصرون فيقدّرون قواته بما بين 100 ألف و250 ألفاً.
    وكان مع داود نحو 56 ألفاً: جورجيون، و15 ألف فارس من القفجاق، وآلان، وكتيبة من فرسان الفرنجة.


    انتصر لأنه اختار أرض المعركة. فقد لاقى العدو في الجبال الضيقة المكسوّة بالغابات بين مانغليسي وتبليسي،
    حيث لا يغني العدد كثيراً. ويضع المؤرخ والتر المستشار على لسانه نذراً صارماً قبل القتال: إن فكّر أحد
    في التراجع، "فلنأخذ الأغصان ونسدّ مدخل المضيق". وبحسب ابن الأثير، تقدّمت مفرزة صغيرة من القفجاق كأنها
    جاءت للتفاوض، ثم أمطرت قادة السلاجقة بالسهام. وانقضّ الفرسان الثقال على الجناحين كليهما — قاد داود
    أحدهما وابنه ديميتري الآخر — وفي نحو ثلاث ساعات كان التحالف يولّي الأدبار. وفي العام التالي استولى
    داود على تبليسي، وتذكر الحوليات ذلك اليوم باسم "النصر العجيب".


    وقد نال النحّات ميراب بيردزينيشفيلي والمعماري تاماز غابونيا جائزة الدولة الجورجية عام 1995 عن هذا
    النُّصب. وتصعد درجات إلى مسلّة مركزية منقوشة، وتحتها رواق من الأعمدة ينعطف حول مدرّج مكشوف. وتبدو
    السيوف في أجلى صورها على خلفية سماء زرقاء صافية حادّة، أو وهي تبرز من الضباب الذي يكثر هنا. وفي 12
    أغسطس/آب من كل عام يعيد مهرجان ديدغوروبا ذكرى المعركة إلى التلة.


    تمشَّ بين النصال وانظر إلى طيّات الغابات في الأسفل: فالأرض التي كسبت المعركة ما زالت المعروض الرئيسي
    هنا.
  tip: >-
    تحقّق من النشرة الجوية قبل الانطلاق: فالضباب قد يبتلع السلسلة في دقائق ويخفي السيوف تماماً. على ارتفاع
    1650 متراً قلّما تهدأ الريح، فاحمل طبقة واقية من الريح حتى في يوليو. لا مقهى هنا ولا متجر ولا دورة
    مياه، فاحمل الماء والطعام. النُّصب في الهواء الطلق، بلا سياج ولا رسوم؛ وتكفي 30–60 دقيقة. في 12 أغسطس
    يملأ مهرجان ديدغوروبا التلة بالحشود والاحتفالات — تجربة لا تُنسى، لكن توقّع سيراً بطيئاً على الطريق
    الجبلي. وتمنحك الصباحات الصافية بين مايو وأكتوبر أوضح الصور الظلّية للسيوف.
  route: >-
    يصعد الطريق التقليدي من تبليسي عبر طريق كوجوري، ويستمر بعد كوجوري حتى طريق تبليسي–مانغليسي (Sh36)،
    ثم يسلك الطريق الجبلي Sh153 المزوّد باللافتات صعوداً إلى النُّصب: 57 كم، نحو ساعة و20 دقيقة، مع منعطفات
    كثيرة. وثمة بديل أقصر قليلاً يمرّ عبر متسخيتا والطريق Sh29 باتجاه كافتيسخيفي، ويلتقي بالطريق Sh153
    نفسه من الجهة الأخرى — نحو 53 كم وساعة واحدة. الطريق معبّد على طوله، وتتدبّر السيارة الاقتصادية أمرها
    في الطقس الجاف. املأ الخزان في تبليسي. ومن أواخر الخريف حتى الربيع قد يغلق الثلج والجليد القسم العلوي،
    فتحقّق من حالة الطريق أولاً.
