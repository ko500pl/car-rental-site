ka:
  name: მძოვრეთის ციხე
  short: >-
    ციციშვილების ციხე-დარბაზი ძამის ხეობაში, რომელიც 1640 წელს ქართლის მეფე როსტომმა ვერ აიღო: შვიდსართულიანი
    კოშკი და თაღოვანი სამრეკლო.
  body: >-
    **1640 წელს ქართლის მეფე როსტომის წინააღმდეგ აჯანყებულმა თავადმა ნოდარ ციციშვილმა მძოვრეთში გაიმაგრა
    თავი — და მეფე ციხის აუღებლად გაბრუნდა.**


    ციხე-დარბაზი სოფელ ორთუბნის დასაწყისში, მდინარე ძამის მარჯვენა ნაპირზე, ნაქალაქარ მძოვრეთის სამხრეთ-აღმოსავლეთ
    მონაკვეთში, კლდოვანი ფერდობის ძირას დგას. ამ ადგილის ისტორია მის კედლებზე ბევრად ძველია. X საუკუნეში
    აქ თავი შეაფარა აფხაზთა სამეფო სახლის დევნილმა უფლისწულმა — მომავალმა მეფემ თეოდოს III ბრმამ; XIII
    საუკუნეში ციხე კახას ძეს, გამრეკელ თორელს ეკუთვნოდა. XIV საუკუნიდან ძამის ხეობას ფანასკერტელ-ციციშვილები
    განაგებდნენ, XVII საუკუნის დასაწყისში კი მათ საფეოდალოს ცენტრი სამწევრისიდან მძოვრეთში გადმოიტანეს.
    რასაც დღეს ხედავთ, ძირითადად სწორედ ამ დროისაა.


    გალავნით შემოზღუდული ციხე-დარბაზი ფერდობის ძირას, დაახლოებით 75×180 მეტრის წაგრძელებულ შევაკებაზე
    იყო გაშენებული; გალავნის ჩრდილოეთი კედელი დღესაც მთელ სიგრძეზე დგას. სამხრეთ-დასავლეთ კუთხეში კოშკი
    აღმართულა: შვიდი სართული და 22,3 მეტრი რიყის ქვა, სამ მხარეს ნახევარწრიული კონტრფორსებით გამაგრებული,
    ბუხრებითა და სათოფურებით, მეხუთე და მეექვსე სართულებზე კი კედლიდან გადმოკიდებული საპირფარეშოებით.
    გალავნის შიგნით, აღმოსავლეთით, ღვთისმშობლის ეკლესიაა — XVII საუკუნის დასაწყისის მოკრძალებული დარბაზი,
    ნატეხი ქვით ნაგები. XVIII საუკუნის მეორე ნახევარში მიშენებული სამსართულიანი სამრეკლო ერთმანეთზე აწყობს
    თაღოვან კარიბჭეს, ხის მისადგმელი კიბით მისასვლელ მცველის ოთახს და ზარების ღია ფანჩატურს, რომელსაც
    რვაწახნაგა პირამიდა აგვირგვინებს.


    კედლები, რომლებმაც მეფე შეაჩერეს, დღეს პირველია, რასაც სოფელში შესვლისას თავს ზემოთ დაინახავთ.
  tip: >-
    მანქანა ორთუბანში დატოვეთ: ციხე სოფლის დასაწყისშია, გზიდან სულ ცოტა სავალზე; ნიადაგი უსწორმასწოროა,
    ამიტომ კარგად მოჭიდებადი ფეხსაცმელი ჩაიცვით. შესვლა შესაძლოა შეზღუდული იყოს — სოფელში იკითხეთ, შეიძლება
    თუ არა შიგნით შესვლა და რომელ საათებში. კაფეს ან საპირფარეშოს ნუ ელით; საწვავი და საჭმელი ხეობაში
    შესვლამდე, ქარელში შეიძინეთ. ეკლესია შესაძლოა დაკეტილი იყოს; ყოველი შემთხვევისთვის მოკრძალებულად ჩაიცვით.
    ვიზიტისთვის საათნახევარი გაითვალისწინეთ. გაზაფხული და შემოდგომა საუკეთესოა, ზაფხულის შუადღით ხეობაში
    ცხელა. იმავე გზაზე ყინწვისის მონასტერიც ნახეთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალს დასავლეთისკენ დაახლოებით 100 კილომეტრი გაჰყევით და ქარელთან გადაუხვიეთ.
    ქალაქი გაიარეთ და შ134 გზას აუყევით, რომელიც ყინწვისის მონასტრისკენ მიდის და ძამის ხეობით სამხრეთისკენ
    ადის; ორთუბანი ამ გზაზე დაახლოებით 13 კილომეტრშია, ციხე კი სოფლის დასაწყისშივე დგას. სულ დაახლოებით
    122 კმ და 2 საათი და 5 წუთია. ხეობის გზა თავიდან მოასფალტებულია, ბოლო მონაკვეთი კი დაზიანებული და
    ნაწილობრივ ხრეშიანია, ამიტომ მაღალი გამავლობის მანქანა უფრო კომფორტულია, განსაკუთრებით წვიმის შემდეგ.
    ქარელის შემდეგ ბენზინგასამართი სადგური აღარ შეგხვდებათ — საწვავი იქვე ჩაასხით.
en:
  name: Mdzovreti Fortress
  short: >-
    A Tsitsishvili castle-palace in the Dzama valley that King Rostom of Kartli failed to take in 1640,
    with a seven-storey tower and an arched belfry.
  body: >-
    **In 1640 Prince Nodar Tsitsishvili, in revolt against King Rostom of Kartli, shut himself in Mdzovreti
    — and the king went home without it.**


    The castle-palace stands at the foot of a rocky slope at the entrance to Ortubani village, on the
    right bank of the Dzama, in the south-eastern corner of what was once the town of Mdzovreti. The place
    is far older than the walls you see. In the 10th century a fugitive prince of the Abkhazian royal
    house, the future King Theodosius III, remembered as 'the Blind', found shelter here; in the 13th
    century it belonged to Gamrekeli Toreli, son of Kakha. From the 14th century the Dzama valley was
    ruled by the Panaskerteli-Tsitsishvili princes, and in the early 17th century they moved the centre
    of their domain here from Samtsevrisi. Most of what survives dates from that move.


    The walled enclosure ran along the foot of the slope, a long terrace of about 75 by 180 metres; its
    northern wall still stands for its full length. In the south-western corner rises the tower: seven
    storeys and 22.3 metres of river stone, braced by half-round buttresses on three sides, with fireplaces,
    gun-ports and, on the fifth and sixth floors, small latrines jutting out from the wall. Inside the
    enclosure, to the east, is the Church of the Virgin, a modest early-17th-century hall of rubble stone.
    Its three-storey bell tower, added in the second half of the 18th century, stacks a vaulted gateway,
    a guard's room reached by a wooden ladder and an open belfry crowned by an eight-sided pyramid.


    The walls that turned back a king are now the first thing you see above you as you drive into the
    village.
  tip: >-
    Park in Ortubani: the castle stands at the start of the village, a short walk from the road; the ground
    is uneven, so wear shoes with grip. Access may be restricted — ask in the village whether visitors
    can go in, and at what hours. Do not count on a café or toilets; buy fuel and food in Kareli before
    heading up the valley. The church may be locked; dress modestly in case it is open. Allow an hour
    and a half. Spring and autumn are kindest; summer afternoons in the valley are hot. Kintsvisi Monastery
    lies along the same road.
  route: >-
    Take the S1 (E60) west from Tbilisi for about 100 km and leave at Kareli. Cross the town and pick
    up the Sh134, the road to Kintsvisi Monastery, which climbs south up the Dzama valley; Ortubani is
    about 13 km along it, and the fortress stands at the start of the village. Total: about 122 km and
    2 hours 5 minutes. The valley road begins paved, but the final stretch is broken and partly gravel,
    so an SUV is the comfortable choice, especially after rain. There is no fuel beyond Kareli — fill
    up there.
ru:
  name: Крепость Мдзоврети
  short: >-
    Замок-дворец Цицишвили в долине Дзамы, который картлийский царь Ростом не сумел взять в 1640 году:
    семиэтажная башня и арочная колокольня.
  body: >-
    **В 1640 году князь Нодар Цицишвили, восставший против картлийского царя Ростома, заперся в Мдзоврети
    — и царь ушёл ни с чем.**


    Замок-дворец стоит у подножия скалистого склона при въезде в село Ортубани, на правом берегу Дзамы,
    в юго-восточном углу бывшего города Мдзоврети. Само место гораздо старше стен, которые вы видите.
    В X веке здесь нашёл приют беглый царевич из абхазского царского дома, будущий царь Феодосий III,
    прозванный Слепым; в XIII веке оно принадлежало Гамрекели Торели, сыну Кахи. С XIV века долиной Дзамы
    правили князья Панаскертели-Цицишвили, а в начале XVII века они перенесли сюда центр своих владений
    из Самцевриси. Большая часть уцелевшего относится как раз ко времени этого переезда.


    Ограда тянулась вдоль подножия склона длинной террасой примерно 75 на 180 метров; её северная стена
    стоит до сих пор во всю длину. В юго-западном углу поднимается башня: семь этажей и 22,3 метра речного
    камня, с полукруглыми контрфорсами с трёх сторон, каминами, бойницами для огнестрельного оружия, а
    на пятом и шестом этажах — небольшими нужниками, выступающими из стены. Внутри ограды, в восточной
    части, стоит церковь Богородицы — скромный зальный храм начала XVII века из бутового камня. Её трёхъярусная
    колокольня, пристроенная во второй половине XVIII века, складывается из сводчатых ворот, караульни,
    куда поднимались по деревянной лестнице, и открытой звонницы под восьмигранной пирамидой.


    Стены, остановившие царя, теперь первое, что вы видите над собой, въезжая в село.
  tip: >-
    Машину оставьте в Ортубани: замок стоит в начале села, в нескольких минутах ходьбы от дороги; земля
    неровная, так что наденьте обувь с цепкой подошвой. Доступ может быть ограничен — спросите в селе,
    можно ли зайти внутрь и в какие часы. На кафе и туалеты не рассчитывайте: бензин и еду купите в Карели,
    прежде чем ехать вверх по долине. Церковь может быть заперта; на случай, если она открыта, оденьтесь
    скромно. Заложите на визит полтора часа. Весна и осень — самое мягкое время; летом после полудня в
    долине жарко. Монастырь Кинцвиси — на той же дороге.
  route: >-
    Из Тбилиси — по S1 (E60) на запад около 100 км до съезда на Карели. Проезжайте через город и выезжайте
    на Sh134 — дорогу к монастырю Кинцвиси, которая поднимается на юг по долине Дзамы; Ортубани примерно
    в 13 км по ней, и крепость стоит в начале села. Всего — около 122 км и 2 часа 5 минут. Дорога по долине
    начинается асфальтом, но последний участок разбит и местами гравийный, поэтому удобнее внедорожник,
    особенно после дождя. Дальше Карели заправок нет — залейте полный бак там.
fa:
  name: قلعهٔ مدزوورتی
  short: >-
    قلعه‌کاخ خاندان تسیتسیشویلی در درهٔ دزاما که رستم، پادشاه کارتلی، در ۱۶۴۰ نتوانست آن را بگیرد، با
    برجی هفت‌طبقه و ناقوس‌خانه‌ای طاق‌دار.
  body: >-
    **در ۱۶۴۰ شاهزاده نودار تسیتسیشویلی، که بر رستم پادشاه کارتلی شوریده بود، در مدزوورتی سنگر گرفت —
    و شاه دست خالی بازگشت.**


    این قلعه‌کاخ در پای دامنه‌ای صخره‌ای، در ورودی روستای اورتوبانی، بر کرانهٔ راست رود دزاما و در گوشهٔ
    جنوب‌شرقی شهری که روزگاری مدزوورتی نام داشت، ایستاده است. خود این مکان بسیار کهن‌تر از دیوارهایی است
    که می‌بینید. در سدهٔ دهم شاهزاده‌ای فراری از خاندان شاهی آبخاز، که بعدها با نام تئودوسیوس سوم، ملقب
    به «نابینا»، به پادشاهی رسید، در اینجا پناه یافت؛ در سدهٔ سیزدهم این مکان از آنِ گامرکلی تورلی، پسر
    کاخا، بود. از سدهٔ چهاردهم شاهزادگان پاناسکرتلی-تسیتسیشویلی بر درهٔ دزاما فرمان می‌راندند و در آغاز
    سدهٔ هفدهم مرکز قلمرو خود را از سامتسوریسی به اینجا آوردند. بیشتر آنچه برجا مانده از همان جابه‌جایی
    است.


    حصار در امتداد پای دامنه کشیده می‌شد، بر سکویی دراز به ابعاد حدود ۷۵ در ۱۸۰ متر؛ دیوار شمالی آن هنوز
    در تمام طولش پابرجاست. در گوشهٔ جنوب‌غربی برج قد برافراشته است: هفت طبقه و ۲۲٫۳ متر سنگ رودخانه‌ای،
    با پشت‌بندهای نیم‌گرد در سه سو، بخاری‌های دیواری، روزنه‌های تیراندازی با تفنگ، و در طبقه‌های پنجم
    و ششم، آبریزگاه‌های کوچکی که از دیوار بیرون زده‌اند. درون حصار، در بخش شرقی، کلیسای حضرت مریم قرار
    دارد، کلیسایی تک‌ناوه و ساده از آغاز سدهٔ هفدهم با سنگ‌لاشه. ناقوس‌خانهٔ سه‌طبقهٔ آن که در نیمهٔ دوم
    سدهٔ هجدهم افزوده شد، دروازه‌ای طاق‌دار، اتاق نگهبانی که با نردبانی چوبی به آن می‌رسیدند و ناقوس‌گاهی
    باز را روی هم می‌نشاند که هرمی هشت‌وجهی بر سرش است.


    دیوارهایی که پادشاهی را واپس راندند، اکنون نخستین چیزی‌اند که هنگام ورود به روستا بالای سرتان می‌بینید.
  tip: >-
    خودرو را در اورتوبانی پارک کنید: قلعه در آغاز روستا و چند دقیقه پیاده از جاده است؛ زمین ناهموار است،
    پس کفشی با زیرهٔ ضدلغزش بپوشید. ممکن است ورود محدود باشد؛ در روستا بپرسید که آیا بازدیدکنندگان می‌توانند
    وارد شوند و در چه ساعت‌هایی. روی کافه یا سرویس بهداشتی حساب نکنید؛ پیش از بالا رفتن در دره، سوخت و
    خوراک را در کارلی تهیه کنید. کلیسا ممکن است قفل باشد؛ اگر باز بود، پوشش مناسب داشته باشید. برای بازدید
    یک ساعت و نیم وقت بگذارید. بهار و پاییز مطبوع‌ترین فصل‌هایند؛ بعدازظهرهای تابستان در دره گرم است.
    صومعهٔ کینتسویسی بر همین جاده است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۰۰ کیلومتر به سمت غرب بروید و در کارلی خارج شوید. از شهر بگذرید و
    جادهٔ Sh134 را بگیرید، همان راه صومعهٔ کینتسویسی که رو به جنوب در درهٔ دزاما بالا می‌رود؛ اورتوبانی
    حدود ۱۳ کیلومتر جلوتر است و قلعه در آغاز روستا ایستاده است. روی هم حدود ۱۲۲ کیلومتر و ۲ ساعت و ۵ دقیقه.
    جادهٔ دره آسفالته آغاز می‌شود، اما تکهٔ آخر خراب و بخشی از آن شنی است، پس خودروی شاسی‌بلند انتخاب
    راحت‌تری است، به‌ویژه پس از باران. پس از کارلی پمپ‌بنزینی نیست؛ همان‌جا باک را پر کنید.
he:
  name: מבצר מדזוורטי
  short: >-
    טירת-ארמון של בית ציצישווילי בעמק הדזאמה, שרוסטום, מלך קרתלי, נכשל בכיבושה ב-1640, ובה מגדל בן שבע
    קומות ומגדל פעמונים מקושת.
  body: >-
    **ב-1640 התבצר הנסיך נודר ציצישווילי, שמרד ברוסטום מלך קרתלי, במדזוורטי — והמלך חזר בידיים ריקות.**


    טירת-הארמון עומדת למרגלות מדרון סלעי בכניסה לכפר אורטובני, על הגדה הימנית של הדזאמה, בפינה הדרום-מזרחית
    של מה שהיה פעם העיירה מדזוורטי. המקום עצמו עתיק בהרבה מן החומות שאתם רואים. במאה העשירית מצא כאן מחסה
    נסיך נמלט מבית המלוכה האבחזי, לימים המלך תאודוסיוס השלישי, שנזכר בכינוי "העיוור"; במאה ה-13 היה המקום
    שייך לגמרקלי טורלי, בנו של קאחה. מן המאה ה-14 שלטו בעמק הדזאמה נסיכי פנסקרטלי-ציצישווילי, ובראשית
    המאה ה-17 הם העבירו לכאן את מרכז נחלתם מסמצבריסי. רוב מה ששרד מתוארך למעבר הזה.


    המתחם המוקף חומה נמתח לאורך רגלי המדרון, על טרסה ארוכה של כ-75 על 180 מטרים; החומה הצפונית שלו עדיין
    עומדת לכל אורכה. בפינה הדרום-מערבית מתנשא המגדל: שבע קומות ו-22.3 מטרים של אבני נהר, נתמך בשלושה צדדים
    בתומכות חצי-עגולות, ובו קמינים, חרכי ירי לכלי נשק חם, ובקומות החמישית והשישית בתי שימוש קטנים הבולטים
    מן הקיר. בתוך המתחם, בצדו המזרחי, עומדת כנסיית מריה הבתולה, כנסיית אולם צנועה מאבן גוויל מראשית המאה
    ה-17. מגדל הפעמונים, שנוסף במחצית השנייה של המאה ה-18, בנוי משלוש קומות זו על גבי זו: שער מקומר, חדר
    שמירה שעלו אליו בסולם עץ וקומת פעמונים פתוחה שבראשה פירמידה מתומנת.


    החומות שהדפו מלך הן היום הדבר הראשון שתראו מעליכם בכניסה לכפר.
  tip: >-
    השאירו את הרכב באורטובני: הטירה עומדת בתחילת הכפר, הליכה קצרה מהכביש; הקרקע לא אחידה, לכן נעלו נעליים
    עם אחיזה טובה. ייתכן שהגישה מוגבלת; שאלו בכפר אם מותר להיכנס ובאילו שעות. אל תסמכו על בית קפה או על
    בתי שימוש; קנו דלק ואוכל בקארלי לפני שאתם עולים בעמק. הכנסייה עשויה להיות נעולה; התלבשו בצניעות למקרה
    שתהיה פתוחה. הקדישו לביקור שעה וחצי. האביב והסתיו נעימים ביותר; אחר הצהריים בקיץ חם בעמק. מנזר קינצוויסי
    נמצא על אותה דרך.
  route: >-
    סעו מטביליסי מערבה בכביש S1 (E60) כ-100 ק"מ וצאו בקארלי. חצו את העיר ועלו על כביש Sh134, הדרך למנזר
    קינצוויסי, שמטפסת דרומה במעלה עמק הדזאמה; אורטובני נמצא כ-13 ק"מ לאורכה, והמבצר עומד בתחילת הכפר.
    בסך הכול כ-122 ק"מ ושעתיים וחמש דקות. דרך העמק מתחילה סלולה, אבל הקטע האחרון משובש ובחלקו חצץ, ולכן
    רכב שטח הוא הבחירה הנוחה, במיוחד אחרי גשם. אחרי קארלי אין תחנות דלק; מלאו שם את המיכל.
ar:
  name: قلعة مدزوفريتي
  short: >-
    قلعة-قصر لآل تسيتسيشفيلي في وادي دزاما عجز روستوم ملك كارتلي عن الاستيلاء عليها عام 1640، ببرج من
    سبعة طوابق وبرج أجراس مقنطر.
  body: >-
    **في عام 1640 تحصّن الأمير نودار تسيتسيشفيلي، الثائر على روستوم ملك كارتلي، في مدزوفريتي، فعاد الملك
    خالي الوفاض.**


    تقوم القلعة-القصر عند سفح منحدر صخري في مدخل قرية أورتوباني، على الضفة اليمنى لنهر دزاما، في الركن
    الجنوبي الشرقي لما كان يومًا بلدة مدزوفريتي. والمكان نفسه أقدم بكثير من الأسوار التي تراها. ففي القرن
    العاشر لجأ إليه أمير هارب من البيت الملكي الأبخازي، سيصبح لاحقًا الملك ثيودوسيوس الثالث المعروف بـ«الأعمى»؛
    وفي القرن الثالث عشر كان ملكًا لغامريكيلي توريلي بن كاخا. ومنذ القرن الرابع عشر حكم وادي دزاما أمراء
    باناسكيرتيلي-تسيتسيشفيلي، وفي مطلع القرن السابع عشر نقلوا إليه مركز إقطاعهم من سامتسيفريسي. ومعظم
    ما بقي قائمًا يعود إلى زمن ذلك الانتقال.


    امتدّ السور على طول سفح المنحدر، فوق مصطبة طويلة أبعادها نحو 75 في 180 مترًا؛ ولا يزال جداره الشمالي
    قائمًا بكامل طوله. وفي الركن الجنوبي الغربي يرتفع البرج: سبعة طوابق و22.3 مترًا من حجارة النهر، تدعمه
    من ثلاث جهات دعامات نصف دائرية، وفيه مواقد وفتحات للبنادق، وفي الطابقين الخامس والسادس مراحيض صغيرة
    ناتئة من الجدار. وداخل السور، في جانبه الشرقي، تقوم كنيسة السيدة العذراء، وهي كنيسة متواضعة ذات صحن
    واحد من الحجر الغشيم تعود إلى مطلع القرن السابع عشر. أما برج أجراسها ذو الطوابق الثلاثة، الذي أُضيف
    في النصف الثاني من القرن الثامن عشر، فيضع بعضها فوق بعض: بوابة معقودة، وغرفة حراسة كان يُصعد إليها
    بسلّم خشبي، وطابق أجراس مفتوح يتوّجه هرم مثمّن.


    والأسوار التي ردّت ملكًا هي اليوم أول ما تراه فوقك وأنت تدخل القرية.
  tip: >-
    اترك سيارتك في أورتوباني: فالقلعة عند أول القرية على مسافة قصيرة سيرًا من الطريق، والأرض غير مستوية،
    لذا البس حذاءً مانعًا للانزلاق. وقد يكون الدخول مقيّدًا، فاسأل في القرية إن كان يُسمح للزوار بالدخول
    وفي أي ساعات. لا تعوّل على مقهى أو دورات مياه؛ واشترِ الوقود والطعام في كاريلي قبل الصعود في الوادي.
    قد تكون الكنيسة مغلقة؛ البس لباسًا محتشمًا تحسّبًا لأن تكون مفتوحة. خصّص للزيارة ساعة ونصفًا. الربيع
    والخريف ألطف الفصول؛ وبعد الظهر في الصيف يكون الوادي حارًّا. ودير كينتسفيسي على الطريق نفسه.
  route: >-
    اسلك من تبليسي الطريق S1 (E60) غربًا نحو 100 كم واخرج عند كاريلي. اعبر المدينة واسلك الطريق Sh134،
    طريق دير كينتسفيسي، الذي يصعد جنوبًا في وادي دزاما؛ تقع أورتوباني على بُعد نحو 13 كم منه، والقلعة
    عند أول القرية. المجموع نحو 122 كم وساعتان و5 دقائق. يبدأ طريق الوادي معبّدًا، لكن المقطع الأخير متكسّر
    وحصويّ في أجزاء منه، لذا فسيارة الدفع الرباعي هي الخيار المريح، خاصة بعد المطر. لا وقود بعد كاريلي،
    فاملأ الخزان هناك.
