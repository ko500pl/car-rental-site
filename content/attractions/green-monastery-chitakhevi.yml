ka:
  name: მწვანე მონასტერი (ჩითახევის წმინდა გიორგის მონასტერი)
  short: >-
    IX–X საუკუნეების მომწვანო ქვის ბაზილიკა ბორჯომთან, ტყიან ხეობაში: ორი საუკუნე მიტოვებული, 2003 წლიდან
    კი ისევ მოქმედი.
  body: >-
    **მწვანე მონასტრის დამაარსებელი არავინ იცის და ტყემ ეს საიდუმლო კინაღამ სამუდამოდ შეინახა: ორასზე
    მეტი წლის განმავლობაში ეკლესია ბორჯომთან, ტყიან ხეობაში, უკაცრიელად იდგა და მწვანე მას თანდათან ფარავდა.**


    მონასტერი სოფელ ჩითახევთან, ბორჯომიდან დაახლოებით 12 კილომეტრზე სამხრეთ-დასავლეთით, ვიწრო გვერდით
    ხეობაშია, ბორჯომ-ხარაგაულის ეროვნული პარკის პირას. წმინდა გიორგის ეკლესია სამნავიანი ბაზილიკაა, 14,5
    × 19,2 მეტრი; სტილის მიხედვით IX საუკუნის ბოლოთი ან X საუკუნით თარიღდება. კედლები უხეშად თლილი ქვითა
    და ნატეხითაა ამოყვანილი, სვეტები, პილასტრები და თაღები კი სუფთად გათლილი, მომწვანო ელფერის ქვისაა
    — ტყესთან ერთად ესეც ხსნის, რატომ შეარქვეს მონასტერს „მწვანე“. შიგნით ბინდი და სისადავეა: შუქი ძირითადად
    აფსიდის ორი სარკმლიდან შემოდის, აფსიდსა და დასავლეთ კედელზე კი XII–XIII საუკუნეების მხატვრობის მკრთალი
    კვალი შემორჩა. რამდენიმე მეტრში XV–XVI საუკუნეების ორსართულიანი სამრეკლო დგას: ქვემოთ პატარა სამლოცველოა,
    ზემოთ — თაღებიანი სარეკლო.


    XVIII საუკუნეში ომებმა და ყაჩაღობამ ბორჯომის ხეობა დააცარიელა და სავანეც მიტოვებული დარჩა. ნაგებობები
    ბუჩქნარისგან 1978 წელს გაწმინდეს, 1988 წელს აღადგინეს, 2003 წელს კი აქ ისევ ბერები დასახლდნენ. 2012
    წელს მიწიდან ანტეფიქსის ნატეხი ამოიღეს წმინდა გიორგის სახელით — პირველი წერილობითი დადასტურება იმისა,
    რასაც ადგილობრივები ყოველთვის ამბობდნენ.


    მომლოცველებს უფრო მძიმე ამბავი იზიდავს. გადმოცემით, 1550-იან წლებში შაჰ თამაზ I-ის ჯარისკაცებმა აქაური
    ბერები ამოხოცეს და მას შემდეგ ნაკადულის ქვები მოწითალოა. წყალში ჩაიხედეთ და თავად განსაჯეთ.


    ეზოს გვერდით ნაკადული მიჩუხჩუხებს, ფოთლები შუქს ცრის, ჰაერი კი მაშინაც გრილია, როცა ბორჯომი ხურს.
    ეს ორმოცწუთიანი გაჩერებაა, რომელიც გაცილებით დიდხანს გაგყვებათ.
  tip: >-
    ერთი საათი სავსებით საკმარისია. მოედნიდან ჭიშკრამდე სავალი მოკლეა, მაგრამ წვიმის შემდეგ სრიალებს —
    ჩაიცვით არასრიალა ძირიანი ფეხსაცმელი. მონასტერი მოქმედია: ქალებს თავსაფარი და კაბა სჭირდებათ (მოსასხამები
    ჩვეულებრივ კართანაა), კაცებს გრძელი შარვალი; ხმადაბლა ილაპარაკეთ და ბერების გადაღებამდე ნებართვა ითხოვეთ.
    კაფე და მაღაზია არ არის, წყალი ბორჯომიდან წამოიღეთ. ზაფხულის საღამოობით ნაკადულთან კოღოები იკრიბება.
    ზამთარში ხეობა ჩრდილშია და მისასვლელ გზაზე ყინული კვირობით ძლებს — ფრთხილად და ნელა იარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ხაშურამდე იარეთ (დაახლოებით 130 კმ), შემდეგ ს8-ით სამხრეთით
    ბორჯომამდე. ბორჯომიდან ს8-ს ახალციხის მიმართულებით კიდევ დაახლოებით 9 კილომეტრი გაჰყევით და ჩითახევის
    ნიშანთან მარცხნივ გადაუხვიეთ: ვიწრო გზა გვერდით ხეობაში დაახლოებით 2 კილომეტრს ადის მონასტრამდე. სულ
    დაახლოებით 172 კილომეტრი და ორნახევარი საათი. შესახვევამდე ასფალტია, შემდეგ ვიწრო და ნაწილობრივ ხრეშიანი
    გზაა, რომელსაც მშრალ ამინდში ეკონომ-კლასის მანქანა ადვილად გაივლის. მანქანა ჭიშკართან დააყენეთ. საწვავი
    ბორჯომში შეავსეთ. ყინვიან დილას საშიში მაგისტრალი კი არა, სწორედ ეს გვერდითი გზაა.
en:
  name: The Green Monastery (Chitakhevi St George)
  short: >-
    A 9th–10th-century basilica of green-tinged stone in a wooded gorge near Borjomi, abandoned for two
    centuries and alive again since 2003.
  body: >-
    **Nobody knows who founded the Green Monastery, and the forest nearly kept the secret for good: for
    more than two hundred years the church stood empty in a wooded gorge near Borjomi while the green
    slowly closed over it.**


    It lies by the village of Chitakhevi, some 12 km south-west of Borjomi, in a narrow side valley at
    the edge of the Borjomi-Kharagauli National Park. The Church of St George is a three-nave basilica,
    14.5 by 19.2 metres, dated by its style to the late 9th or the 10th century. The walls are rough ashlar
    and rubble, but the columns, pilasters and arches are cut from neatly dressed stone with a green tint
    — which, as much as the forest, explains the name. Inside it is dim and plain: light comes mainly
    through two windows in the apse, and faint traces of 12th- or 13th-century painting cling to the apse
    and west wall. A few metres away stands the two-storey bell tower of the 15th or 16th century, a small
    chapel below and an arched belfry above.


    In the 18th century war and brigandage emptied the Borjomi valley, and the monastery was abandoned.
    It was cleared of undergrowth in 1978, restored in 1988 and resettled by monks in 2003. In 2012 a
    fragment of an antefix bearing the name of St George came out of the ground, the first written proof
    of what locals had always said.


    Pilgrims come for a darker story. Tradition holds that in the 1550s soldiers of Shah Tahmasp I massacred
    the monks here, and that the stones of the stream have been reddish ever since. Look into the water
    and judge for yourself.


    The stream runs past the yard, the leaves sift the light, and the air stays cool when Borjomi swelters.
    It is a forty-minute stop that stays with you far longer.
  tip: >-
    An hour is plenty. The walk from the parking to the gate is short but slippery after rain, so wear
    shoes with grip. This is a living monastery: women need a headscarf and a skirt (wraps are usually
    by the door), men long trousers; keep your voice low and ask before photographing the monks. There
    is no café or shop, so bring water from Borjomi. Mosquitoes gather by the stream on summer evenings.
    In winter the gorge stays in shadow and ice lingers on the access road for weeks, so drive it slowly
    and carefully.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south to Borjomi. Stay on
    the S8 towards Akhaltsikhe for about 9 km more and turn left at the sign for Chitakhevi; a narrow
    road climbs some 2 km up the side valley to the monastery. In all, about 172 km and two and a half
    hours. It is asphalt to the turn, then narrow and partly gravel, which an economy car handles easily
    in dry weather. Park by the gate. Refuel in Borjomi. On icy winter mornings the tricky part is this
    side road, not the highway.
ru:
  name: Зелёный монастырь (церковь Святого Георгия в Читахеви)
  short: >-
    Базилика IX–X веков из зеленоватого камня в лесном ущелье под Боржоми: два столетия запустения — и
    новая жизнь с 2003 года.
  body: >-
    **Никто не знает, кто основал Зелёный монастырь, и лес едва не сохранил эту тайну навсегда: больше
    двухсот лет церковь стояла пустой в лесистом ущелье под Боржоми, а зелень медленно смыкалась над ней.**


    Монастырь находится у села Читахеви, примерно в 12 км к юго-западу от Боржоми, в узкой боковой долине
    на краю Боржоми-Харагаульского национального парка. Церковь Святого Георгия — трёхнефная базилика
    размером 14,5 на 19,2 метра; по стилю её относят к концу IX или к X веку. Стены сложены из грубо отёсанного
    камня и бута, а колонны, пилястры и арки вытесаны из тщательно обработанного камня с зеленоватым отливом
    — он объясняет название не меньше, чем лес. Внутри сумрачно и просто: свет проникает в основном через
    два окна апсиды, а в апсиде и на западной стене ещё держатся бледные следы росписи XII или XIII века.
    В нескольких метрах стоит двухъярусная колокольня XV или XVI века: внизу маленькая часовня, наверху
    арочная звонница.


    В XVIII веке войны и разбой опустошили Боржомскую долину, и монастырь был заброшен. В 1978 году его
    расчистили от зарослей, в 1988-м отреставрировали, а в 2003-м сюда вернулись монахи. В 2012 году из
    земли показался фрагмент антефикса с именем святого Георгия — первое письменное подтверждение того,
    что местные жители говорили всегда.


    Паломников же влечёт история потемнее. Предание гласит, что в 1550-х годах воины шаха Тахмаспа I перебили
    здесь монахов и с тех пор камни в ручье красноватые. Загляните в воду и решите сами.


    Ручей бежит мимо двора, листва просеивает свет, и воздух остаётся прохладным, даже когда Боржоми изнывает
    от жары. Остановка на сорок минут, которая помнится куда дольше.
  tip: >-
    Часа вполне достаточно. Дорожка от парковки до ворот короткая, но после дождя скользкая, так что нужна
    обувь с цепкой подошвой. Монастырь действующий: женщинам нужны платок и юбка (накидки обычно лежат
    у входа), мужчинам — длинные брюки; говорите вполголоса и спрашивайте разрешения, прежде чем фотографировать
    монахов. Кафе и магазина нет, поэтому воду возьмите в Боржоми. Летними вечерами у ручья собираются
    комары. Зимой ущелье остаётся в тени и лёд неделями держится на подъездной дороге — езжайте медленно
    и осторожно.
  route: >-
    Из Тбилиси по E60/S1 на запад до Хашури, около 130 км, затем по S8 на юг до Боржоми. Оставайтесь на
    S8 в сторону Ахалцихе ещё примерно 9 км и у указателя на Читахеви поверните налево: узкая дорога поднимается
    по боковой долине около 2 км до самого монастыря. Всего около 172 км и два с половиной часа. До поворота
    асфальт, дальше узко и местами гравий, но в сухую погоду машина эконом-класса справится без труда.
    Парковка у ворот. Заправьтесь в Боржоми. Ледяным зимним утром трудна именно эта боковая дорога, а
    не трасса.
fa:
  name: صومعهٔ سبز (کلیسای گئورگی قدیس در چیتاخوی)
  short: >-
    باسیلیکایی از سدهٔ نهم یا دهم با سنگ‌هایی به ته‌رنگ سبز، در دره‌ای جنگلی نزدیک بورجومی؛ دو سده متروک
    ماند و از ۲۰۰۳ دوباره جان گرفته است.
  body: >-
    **هیچ‌کس نمی‌داند صومعهٔ سبز را چه کسی بنا کرد، و جنگل نزدیک بود این راز را برای همیشه نگه دارد: بیش
    از دویست سال کلیسا در دره‌ای جنگلی نزدیک بورجومی خالی ماند و سبزی آرام‌آرام بر آن بسته شد.**


    صومعه کنار روستای چیتاخوی است، حدود ۱۲ کیلومتری جنوب‌غربی بورجومی، در دره‌ای فرعی و باریک در حاشیهٔ
    پارک ملی بورجومی-خاراگائولی. کلیسای گئورگی قدیس باسیلیکایی سه‌شبستانی به ابعاد ۱۴٫۵ در ۱۹٫۲ متر است
    که از روی سبکش آن را به اواخر سدهٔ نهم یا سدهٔ دهم نسبت می‌دهند. دیوارها از سنگ نیمه‌تراش و لاشه‌سنگ
    است، اما ستون‌ها، ستون‌نماها و طاق‌ها از سنگی خوش‌تراش با ته‌رنگی سبز ساخته شده‌اند؛ همین سنگ، به
    اندازهٔ جنگل، نام صومعه را توضیح می‌دهد. درون کلیسا نیمه‌تاریک و ساده است: نور بیشتر از دو پنجرهٔ
    شاه‌نشینِ کلیسا (اَپسیس) می‌تابد و ردهای کم‌رنگی از نقاشی‌های دیواری سدهٔ دوازدهم یا سیزدهم هنوز بر
    شاه‌نشین و دیوار غربی مانده است. چند متر آن‌سوتر برج ناقوس دوطبقه‌ای از سدهٔ پانزدهم یا شانزدهم ایستاده
    است: پایین نمازخانه‌ای کوچک و بالا ناقوس‌خانه‌ای طاق‌دار.


    در سدهٔ هجدهم جنگ و راهزنی درهٔ بورجومی را از سکنه خالی کرد و صومعه متروک شد. در ۱۹۷۸ آن را از بوته
    و خار پاک کردند، در ۱۹۸۸ مرمتش کردند و در ۲۰۰۳ راهبان دوباره در آن ساکن شدند. در ۲۰۱۲ تکه‌ای از یک
    آنتفیکس (سفال تزیینی لبهٔ بام) با نام گئورگی قدیس از خاک بیرون آمد؛ نخستین گواه مکتوب بر آنچه اهالی
    همیشه می‌گفتند.


    اما زائران برای داستانی تیره‌تر می‌آیند. روایت است که در دههٔ ۱۵۵۰ سربازان شاه تهماسب یکم راهبان را
    در اینجا قتل‌عام کردند و از آن زمان سنگ‌های جویبار سرخ‌فام مانده‌اند. به آب نگاه کنید و خودتان داوری
    کنید.


    جویبار از کنار حیاط می‌گذرد، برگ‌ها نور را غربال می‌کنند و هوا خنک می‌ماند، حتی وقتی بورجومی در گرما
    می‌سوزد. توقفی چهل‌دقیقه‌ای است که بسیار بیشتر در یاد می‌ماند.
  tip: >-
    یک ساعت کاملاً کافی است. راه پیاده از پارکینگ تا دروازه کوتاه است اما پس از باران لیز می‌شود، پس کفشی
    با کف ضدلغزش بپوشید. این صومعه فعال است و راهبان در آن زندگی می‌کنند: زنان روسری و دامن لازم دارند
    (معمولاً کنار در پارچه‌ای برای پوشش هست) و مردان شلوار بلند؛ آهسته صحبت کنید و پیش از عکس گرفتن از
    راهبان اجازه بگیرید. کافه و مغازه‌ای در کار نیست، پس آب را از بورجومی بردارید. عصرهای تابستان پشه‌ها
    کنار جویبار جمع می‌شوند. در زمستان دره در سایه می‌ماند و یخ هفته‌ها روی جادهٔ دسترسی باقی است؛ آهسته
    و با احتیاط برانید.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب تا خاشوری بگیرید، حدود ۱۳۰ کیلومتر، و سپس جادهٔ S8 را به سمت جنوب
    تا بورجومی. حدود ۹ کیلومتر دیگر روی S8 به سوی آخالتسیخه ادامه دهید و کنار تابلوی چیتاخوی به چپ بپیچید؛
    جاده‌ای باریک حدود ۲ کیلومتر در درهٔ فرعی بالا می‌رود تا به صومعه برسد. روی هم حدود ۱۷۲ کیلومتر و
    دو ساعت و نیم. تا سر پیچ آسفالت است و پس از آن باریک و بخشی شنی، که خودروی اقتصادی در هوای خشک به‌راحتی
    از پسش برمی‌آید. کنار دروازه پارک کنید و در بورجومی سوخت بزنید. در صبح‌های یخ‌زدهٔ زمستان، بخش دشوار
    راه همین جادهٔ فرعی است، نه بزرگراه.
he:
  name: המנזר הירוק (כנסיית גאורגיוס הקדוש בצ'יטחווי)
  short: >-
    בזיליקה מהמאה ה-9 או ה-10, בנויה אבן בגוון ירקרק, בערוץ מיוער ליד בורג'ומי: מאתיים שנה עמדה נטושה,
    ומאז 2003 היא שוב חיה.
  body: >-
    **איש אינו יודע מי ייסד את המנזר הירוק, והיער כמעט שמר על הסוד לעד: יותר ממאתיים שנה עמדה הכנסייה
    ריקה בערוץ מיוער ליד בורג'ומי, והירק נסגר עליה לאט-לאט.**


    המנזר שוכן ליד הכפר צ'יטחווי, כ-12 ק״מ דרומית-מערבית לבורג'ומי, בעמק צדדי צר בשולי הפארק הלאומי בורג'ומי-חרגאולי.
    כנסיית גאורגיוס הקדוש היא בזיליקה בת שלוש ספינות, במידות 14.5 על 19.2 מטרים, ולפי סגנונה היא מתוארכת
    לסוף המאה ה-9 או למאה ה-10. הקירות בנויים אבנים מסותתות גס ואבני שדה, אבל העמודים, האומנות והקשתות
    עשויים אבן מסותתת בקפידה בגוון ירקרק — והיא, לא פחות מהיער, מסבירה את השם. בפנים אפלולי ופשוט: האור
    נכנס בעיקר דרך שני חלונות באפסיס, ושרידים דהויים של ציורי קיר מהמאה ה-12 או ה-13 עדיין נאחזים באפסיס
    ובקיר המערבי. במרחק כמה מטרים עומד מגדל הפעמונים הדו-קומתי מהמאה ה-15 או ה-16: למטה קפלה קטנה, ולמעלה
    חדר פעמונים פתוח בקשתות.


    במאה ה-18 רוקנו מלחמות ושודדים את עמק בורג'ומי מיושביו, והמנזר ננטש. ב-1978 פינו ממנו את הסבך, ב-1988
    הוא שוחזר, וב-2003 שבו אליו נזירים. ב-2012 עלה מן האדמה שבר של אנטפיקס (אריח עיטור משולי הגג) ועליו
    שמו של גאורגיוס הקדוש — ההוכחה הכתובה הראשונה למה שהמקומיים אמרו תמיד.


    עולי הרגל באים בשביל סיפור אפל יותר. המסורת מספרת שבשנות ה-50 של המאה ה-16 טבחו כאן חייליו של השאה
    טהמאספ הראשון בנזירים, ומאז האבנים בנחל אדמדמות. הביטו במים ושפטו בעצמכם.


    הנחל זורם לצד החצר, העלים מסננים את האור, והאוויר נשאר קריר גם כשבורג'ומי לוהטת. זו עצירה של ארבעים
    דקות שנשארת איתכם הרבה יותר זמן.
  tip: >-
    שעה מספיקה בהחלט. ההליכה מהחניה אל השער קצרה, אבל אחרי גשם היא חלקלקה, לכן נעלו נעליים עם אחיזה טובה.
    זהו מנזר פעיל: נשים צריכות כיסוי ראש וחצאית (ליד הדלת יש בדרך כלל בדים להתעטף בהם), וגברים — מכנסיים
    ארוכים; דברו בשקט ובקשו רשות לפני שאתם מצלמים את הנזירים. אין בית קפה ואין חנות, אז הצטיידו במים בבורג'ומי.
    בערבי קיץ מתקבצים יתושים ליד הנחל. בחורף הערוץ נשאר בצל, והקרח מחזיק על דרך הגישה שבועות, אז סעו לאט
    ובזהירות.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק״מ, ומשם דרומה בכביש S8 עד בורג'ומי. המשיכו בכביש
    S8 לכיוון אחלציחה עוד כ-9 ק״מ, ופנו שמאלה בשלט לצ'יטחווי; דרך צרה מטפסת כ-2 ק״מ במעלה העמק הצדדי עד
    המנזר. בסך הכול כ-172 ק״מ ושעתיים וחצי נסיעה. עד הפנייה הכביש סלול, ומשם הדרך צרה ובחלקה חצץ, אבל
    רכב חסכוני מסתדר איתה בקלות במזג אוויר יבש. חנו ליד השער ותדלקו בבורג'ומי. בבקרי חורף קפואים הקטע
    הקשה הוא דרך הצד הזאת, לא הכביש הראשי.
ar:
  name: الدير الأخضر (كنيسة القديس جاورجيوس في تشيتاخيفي)
  short: >-
    بازيليكا من القرن التاسع أو العاشر، حجارتها مشوبة بالخضرة، في وادٍ مشجّر قرب بورجومي؛ هُجرت قرنين
    ثم عادت إليها الحياة منذ 2003.
  body: >-
    **لا أحد يعرف من أسس الدير الأخضر، وكادت الغابة تحفظ السرّ إلى الأبد: فطوال أكثر من مئتي عام ظلت الكنيسة
    خالية في وادٍ مشجّر قرب بورجومي، والخضرة تنطبق عليها رويداً رويداً.**


    يقع الدير عند قرية تشيتاخيفي، على بعد نحو 12 كم جنوب غربي بورجومي، في وادٍ جانبي ضيق على طرف منتزه
    بورجومي-خاراغاولي الوطني. وكنيسة القديس جاورجيوس بازيليكا ذات ثلاثة أروقة، أبعادها 14.5 في 19.2 متراً،
    ويؤرّخها طرازها بأواخر القرن التاسع أو بالقرن العاشر. جدرانها من حجارة منحوتة نحتاً خشناً ومن الدَّبْش،
    أما الأعمدة والأعمدة الجدارية والأقواس فمن حجر مشذَّب بعناية تشوبه خضرة، وهو، بقدر الغابة، ما يفسّر
    الاسم. والداخل خافت الضوء بسيط: يدخله النور أساساً من نافذتين في الحنية، وما زالت آثار باهتة من رسوم
    القرن الثاني عشر أو الثالث عشر عالقة بالحنية والجدار الغربي. وعلى بعد أمتار قليلة يقوم برج الأجراس
    ذو الطابقين من القرن الخامس عشر أو السادس عشر: في أسفله مصلّى صغير، وفي أعلاه حجرة أجراس مقنطرة.


    في القرن الثامن عشر أفرغت الحروب وقطّاع الطرق وادي بورجومي من أهله، فهُجر الدير. وفي عام 1978 نُظّف
    من الأدغال، ورُمّم عام 1988، وعاد إليه الرهبان عام 2003. وفي عام 2012 خرجت من التراب قطعة من حلية
    طرف السقف (أنتفكس) تحمل اسم القديس جاورجيوس، فكانت أول دليل مكتوب على ما ظل أهل المكان يقولونه دائماً.


    لكن الحجاج يأتون من أجل حكاية أشد قتامة. تقول الرواية المتوارثة إن جنود الشاه طهماسب الأول ذبحوا الرهبان
    هنا في خمسينيات القرن السادس عشر، وإن حجارة الجدول ظلت مائلة إلى الحمرة منذ ذلك الحين. انظر في الماء
    واحكم بنفسك.


    يجري الجدول بمحاذاة الفناء، وتغربل الأوراق الضوء، ويبقى الهواء منعشاً حين تلتهب بورجومي حرّاً. إنها
    وقفة من أربعين دقيقة تبقى معك زمناً أطول بكثير.
  tip: >-
    ساعة واحدة تكفي تماماً. الممشى من الموقف إلى البوابة قصير لكنه زلق بعد المطر، فالبس حذاءً ثابت النعل.
    هذا دير عامر بالرهبان: تحتاج النساء إلى غطاء للرأس وتنورة (وتوجد عادةً أوشحة عند الباب)، والرجال إلى
    سراويل طويلة؛ اخفض صوتك واستأذن قبل تصوير الرهبان. لا مقهى ولا متجر، فاحمل الماء من بورجومي. وفي أمسيات
    الصيف يتجمع البعوض قرب الجدول. وفي الشتاء يبقى الوادي في الظل ويلازم الجليد طريق الوصول أسابيع، فقُد
    ببطء وحذر.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، نحو 130 كم، ثم الطريق S8 جنوباً إلى بورجومي. تابع على
    S8 باتجاه أخالتسيخه نحو 9 كم أخرى، ثم انعطف يساراً عند لافتة تشيتاخيفي؛ طريق ضيق يصعد قرابة 2 كم في
    الوادي الجانبي حتى الدير. المجموع نحو 172 كم وساعتان ونصف. الطريق معبّد حتى المنعطف، ثم ضيق وبعضه
    حصوي، وتجتازه سيارة اقتصادية بسهولة في الطقس الجاف. اركن السيارة عند البوابة وتزوّد بالوقود في بورجومي.
    في صباحات الشتاء المتجمدة يكمن الجزء الصعب في هذا الطريق الجانبي، لا في الطريق السريع.
