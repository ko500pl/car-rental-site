ka:
  name: მწვანე მონასტერი (ჩითახევის წმინდა გიორგის მონასტერი)
  short: ბორჯომთან, ხავსით დაფარულ ტყის ხეობაში მიმალული პატარა მონასტერი, დაარსებული IX საუკუნეში.
  body: >-
    **მწვანე მონასტერს სახელი ფერისგან აქვს, არა მეტაფორისგან.** ჩითახევის ვიწრო ხეობაში, სადაც მდინარე
    პირდაპირ სამონასტრო ეზოს კიდეზე ჩამოდის, ხავსი ქვებზე, კედლებზე და ხის ტანებზეა; მზე ფოთლებში იფილტრება
    და მთელი ადგილი მწვანე შუქშია ჩაძირული. ზაფხულის შუადღეს, როცა ბორჯომში ოცდაათი გრადუსია, აქ სვიტერი
    გინდება.


    სავანე IX საუკუნეში დაარსდა — გადმოცემით ასურელ მამათა მოწაფეებმა, ქრისტეფორემ და თეოდორემ. დღევანდელი
    წმინდა გიორგის ეკლესია ძირითადად XV საუკუნისაა: მცირე, სადა ქვის ნაგებობა, ცალკე მდგარი სამრეკლოთი,
    რომელიც კომპლექსის ყველაზე მოხდენილი ნაწილია. შიგნით მხატვრობა თითქმის არ შემორჩა, ინტერიერი მკაცრი
    და ბნელია.


    მდინარის კალაპოტში ქვები წითელი ლაქებითაა დაფარული და ადგილობრივი გადმოცემა ამბობს, რომ ეს XVI საუკუნეში
    დახოცილი ბერების სისხლია, როცა შაჰ თამაზის ლაშქარმა ხეობა გადაწვა. სინამდვილეში ფერს ქანში არსებული
    რკინის ნაერთები იძლევა — მაგრამ ისტორია, რომელსაც ეს ლეგენდა ეყრდნობა, სამწუხაროდ, რეალურია: სამცხის
    სავანეთა უმეტესობა სწორედ იმ საუკუნეში დაცარიელდა.


    ხეობა მონასტრის ზემოთ ტყის გზად გრძელდება და ნახევარსაათიანი სავალის შემდეგ იქ მხოლოდ წიფელი და მდინარეა.
    ეს ბორჯომის მიდამოებში ერთ-ერთი ყველაზე მარტივი გზაა იმის სანახავად, როგორია ბორჯომის ხეობის ტყე,
    თუ ეროვნული პარკის სრულ მარშრუტს არ იწყებ.


    მონასტერი ბოლო ოცი წელია ისევ მოქმედია, აქ რამდენიმე ბერი ცხოვრობს და მეურნეობას უვლის. ტერიტორია
    პატარაა: ეკლესია, სამრეკლო, ორიოდე სამეურნეო ნაგებობა და ხის ხიდი მდინარეზე. სწორედ სიმცირე და სიჩუმეა
    აქ მთავარი — ეს არ არის ძეგლი, რომელსაც სამი საათი უნდა, არამედ ორმოცი წუთი, რომელიც კარგად გახსოვს.
  tip: >-
    ერთი საათი სავსებით საკმარისია. ბოლო მონაკვეთი ტყეშია და წვიმის შემდეგ სრიალა — ჩვეულებრივი ფეხსაცმელი
    ვარგისია, სანდლები არა. ეკლესიაში შესვლისას თავსაფარი და გრძელი კალთა საჭიროა, კართან ჩვეულებრივ დევს.
    ტუალეტი მარტივია, კაფე ან მაღაზია ადგილზე არაა — წყალი თან წაიღე. კოღოები ზაფხულში მდინარესთან შესამჩნევია.
    ზამთარში ხეობა ჩრდილშია და ყინული დიდხანს რჩება, ფრთხილად ჩადი.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომამდე, და ბორჯომიდან ახალციხის მიმართულებით კიდევ დაახლოებით
    ცხრა კილომეტრი. ჩითახევის ნიშანთან მარცხნივ გადაუხვევ და ხეობაში ორ კილომეტრს აუყვები. სულ 172 კმ,
    ორი საათი და ოცდათხუთმეტი წუთი. მთავარი გზა ასფალტია, ბოლო მონაკვეთი — ვიწრო, ნაწილობრივ მოხრეშილი,
    მაგრამ მშრალ ამინდში ეკონომ-კლასის მანქანით სავსებით გასავლელი. პარკინგი მონასტრის წინაა. საწვავი
    ბორჯომში.
en:
  name: The Green Monastery (Chitakhevi St George)
  short: A small monastery founded in the 9th century, hidden near Borjomi in a moss-covered forest gorge.
  body: >-
    **The Green Monastery is named for a colour, not a metaphor.** In the narrow Chitakhevi gorge, where
    the stream runs right along the edge of the monastic yard, moss covers the stones, the walls and the
    tree trunks; sunlight filters through leaves and the whole place is sunk in green light. On a summer
    afternoon, when Borjomi is at thirty degrees, you want a sweater here.


    The community was founded in the 9th century, traditionally by two disciples of the Assyrian Fathers
    named Christopher and Theodore. The present church of St George is largely 15th century: a small,
    plain stone building with a free-standing bell tower that is the most elegant thing on the site. Almost
    no painting survives inside, and the interior is austere and dark.


    The stones in the streambed are flecked with red, and local tradition holds that this is the blood
    of monks killed in the 16th century, when the army of Shah Tahmasp burned its way through the valley.
    The colour in fact comes from iron in the rock, but the history behind the legend is real enough:
    most of the monasteries of Samtskhe emptied in exactly that century and did not recover for four hundred
    years.


    The gorge above the monastery continues as a forest track, and half an hour further up there is nothing
    but beech and the stream. It is one of the easiest ways near Borjomi to get a sense of what the gorge
    forest actually looks like without committing to a full national park route.


    The monastery has been active again for the last twenty years, with a handful of monks who keep a
    garden and a few animals. The grounds are small: church, bell tower, two or three outbuildings and
    a wooden footbridge over the water. That modesty is the point. This is not a monument that demands
    three hours, but forty minutes that stay with you.
  tip: >-
    An hour is more than enough. The last stretch is woodland path and gets slippery after rain, so ordinary
    shoes work and sandals do not. Entering the church requires a headscarf and long skirt for women;
    wraps are usually available at the door. The toilet is basic and there is no cafe or shop, so bring
    water. Mosquitoes are noticeable near the stream in summer. In winter the gorge sits in shade and
    ice lingers for weeks, so drive down carefully.
  route: >-
    From Tbilisi take the E60 to Khashuri, continue to Borjomi, and then follow the Akhaltsikhe road for
    another nine kilometres or so. At the sign for Chitakhevi turn left and climb two kilometres up the
    side valley. The total is 172 km, two hours thirty-five. The main road is asphalt; the final stretch
    is narrow and partly gravel, but in dry weather an economy car handles it without trouble. There is
    parking in front of the monastery. Fuel in Borjomi.
ru:
  name: Зелёный монастырь (монастырь Святого Георгия в Читахеви)
  short: Небольшой монастырь IX века, спрятанный близ Боржоми в заросшем мхом лесном ущелье.
  body: >-
    **Зелёный монастырь назван по цвету, а не ради метафоры.** В узком Читахевском ущелье, где речка бежит
    прямо вдоль края монастырского двора, мох покрывает камни, стены и стволы деревьев; свет процеживается
    сквозь листву, и всё место погружено в зелёное свечение. Летним днём, когда в Боржоми тридцать градусов,
    здесь хочется свитер.


    Обитель основана в IX веке — по преданию, двумя учениками ассирийских отцов, Христофором и Феодором.
    Нынешняя церковь Святого Георгия относится в основном к XV веку: небольшое простое каменное здание
    с отдельно стоящей колокольней, которая и есть самое изящное сооружение комплекса. Росписи внутри
    почти не сохранилось, интерьер суровый и тёмный.


    Камни в русле речки испещрены красными пятнами, и местное предание говорит, что это кровь монахов,
    убитых в XVI веке, когда войско шаха Тахмаспа прошло по ущелью огнём. На самом деле цвет даёт железо
    в породе, но история за легендой вполне реальна: большинство обителей Самцхе опустело именно в том
    столетии и не возрождалось четыреста лет.


    Выше монастыря ущелье продолжается лесной дорогой, и через полчаса подъёма вокруг остаются только
    буки и речка. Это один из самых простых способов под Боржоми понять, как выглядит здешний лес, не
    начиная полноценный маршрут национального парка.


    Последние двадцать лет монастырь снова действует, здесь живёт несколько монахов, есть огород и немного
    скотины. Территория маленькая: церковь, колокольня, пара хозяйственных построек и деревянный мостик
    через воду. В этой скромности и суть. Это памятник не на три часа, а на сорок минут, которые запоминаются.
  tip: >-
    Часа более чем достаточно. Последний отрезок идёт по лесной тропе и после дождя скользит, так что
    обычная обувь подойдёт, сандалии нет. Для входа в церковь женщинам нужны платок и длинная юбка, накидки
    обычно лежат у двери. Туалет простой, кафе и магазина нет — берите воду с собой. Летом у речки заметны
    комары. Зимой ущелье стоит в тени, и лёд держится неделями, спускайтесь аккуратно.
  route: >-
    Из Тбилиси по E60 до Хашури, далее до Боржоми, а от Боржоми по дороге на Ахалцихе ещё около девяти
    километров. У указателя на Читахеви поверните налево и поднимитесь два километра по боковому ущелью.
    Всего 172 км, два часа тридцать пять минут. Основная дорога асфальтированная, последний участок узкий
    и частично гравийный, но в сухую погоду машина эконом-класса проходит его без проблем. Парковка перед
    монастырём. Заправка в Боржоми.
fa:
  name: صومعهٔ سبز (صومعهٔ سنت گئورگی چیتاخوی)
  short: صومعه‌ای کوچک از سدهٔ نهم، پنهان نزدیک بورجومی در دره‌ای جنگلی پوشیده از خزه.
  body: >-
    **نام صومعهٔ سبز از یک رنگ می‌آید، نه از استعاره.** در درهٔ باریک چیتاخوی، جایی که رود درست از کنار
    حیاط صومعه می‌گذرد، خزه بر سنگ‌ها و دیوارها و تنهٔ درختان نشسته است؛ نور از میان برگ‌ها می‌گذرد و
    همه‌جا در روشنایی سبز فرو رفته است. بعدازظهر تابستان، وقتی بورجومی سی درجه است، اینجا دلتان پلیور
    می‌خواهد.


    این جماعت در سدهٔ نهم بنیاد گرفت، بنا بر روایت به دست دو شاگرد پدران آشوری به نام‌های کریستوفر و تئودور.
    کلیسای کنونی سنت گئورگی عمدتاً از سدهٔ پانزدهم است: بنایی سنگی کوچک و ساده با برج ناقوسی جدا که زیباترین
    عنصر مجموعه است. در داخل تقریباً هیچ نقاشی نمانده و فضا سخت‌گیرانه و تاریک است.


    سنگ‌های بستر رود لکه‌های سرخ دارند و روایت محلی می‌گوید این خون راهبانی است که در سدهٔ شانزدهم کشته
    شدند، آنگاه که سپاه شاه تهماسب دره را به آتش کشید. رنگ در واقع از آهن موجود در سنگ می‌آید، اما تاریخ
    پشت این افسانه واقعی است: بیشتر صومعه‌های سامتسخه دقیقاً در همان سده خالی شد و چهارصد سال بازنگشت.


    دره بالاتر از صومعه به راهی جنگلی ادامه می‌یابد و نیم ساعت بالاتر چیزی جز راش و رودخانه نیست. این
    یکی از ساده‌ترین راه‌ها در نزدیکی بورجومی است تا دریابید جنگل این دره واقعاً چه شکلی است، بی‌آنکه
    مسیر کامل پارک ملی را آغاز کنید.


    صومعه بیست سالی است دوباره فعال شده و چند راهب در آن زندگی می‌کنند و باغچه و چند دام دارند. محوطه
    کوچک است: کلیسا، برج ناقوس، دو سه بنای خدماتی و پلی چوبی روی آب. همین کوچکی نکتهٔ اصلی است. این یادمانی
    نیست که سه ساعت بخواهد، چهل دقیقه است که در ذهن می‌ماند.
  tip: >-
    یک ساعت بیش از کافی است. بخش پایانی راه جنگلی است و پس از باران لیز می‌شود، پس کفش معمولی مناسب است
    و صندل نه. برای ورود به کلیسا زنان به روسری و دامن بلند نیاز دارند؛ پوشش‌ها معمولاً کنار در هست. سرویس
    بهداشتی ساده است و کافه یا مغازه‌ای نیست، پس آب همراه ببرید. تابستان کنار رود پشه محسوس است. زمستان
    دره در سایه می‌ماند و یخ هفته‌ها باقی است، پس با احتیاط پایین بروید.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری، سپس تا بورجومی، و از بورجومی حدود نه کیلومتر دیگر در جادهٔ آخالتسیخه.
    کنار تابلوی چیتاخوی به چپ بپیچید و دو کیلومتر در درهٔ فرعی بالا بروید. مجموع ۱۷۲ کیلومتر و دو ساعت
    و سی‌وپنج دقیقه. جادهٔ اصلی آسفالت است و بخش پایانی باریک و تا حدی شنی، اما در هوای خشک خودروی اقتصادی
    بی‌دردسر از آن می‌گذرد. پارکینگ روبه‌روی صومعه است. سوخت در بورجومی.
he:
  name: המנזר הירוק (מנזר גאורגיוס הקדוש בצ'יטחווי)
  short: מנזר קטן שנוסד במאה ה-9 ומסתתר ליד בורג'ומי בערוץ יער מכוסה טחב.
  body: >-
    **המנזר הירוק קרוי על שם צבע, לא על שם מטאפורה.** בערוץ הצר של צ'יטחווי, שבו הנחל זורם ממש לאורך שולי
    חצר המנזר, טחב מכסה את האבנים, את החומות ואת גזעי העצים; האור מסתנן דרך העלים וכל המקום שקוע בזוהר
    ירוק. בצהרי יום קיץ, כשבבורג'ומי שלושים מעלות, כאן רוצים סוודר.


    הקהילה נוסדה במאה ה-9, על פי המסורת בידי שני תלמידים של האבות האשוריים, כריסטופר ותאודור. כנסיית גאורגיוס
    הקדוש הנוכחית היא ברובה מן המאה ה-15: מבנה אבן קטן ופשוט ולצידו מגדל פעמונים עומד בפני עצמו, והוא
    הדבר האלגנטי ביותר באתר. כמעט לא שרד ציור בפנים, והחלל חמור וחשוך.


    האבנים באפיק הנחל מנומרות באדום, ומסורת מקומית אומרת שזה דמם של נזירים שנהרגו במאה ה-16, כשצבאו של
    שאה תהמאספ שרף את דרכו בעמק. הצבע בא למעשה מברזל שבסלע, אבל ההיסטוריה שמאחורי האגדה אמיתית לגמרי:
    רוב מנזרי סמצחה התרוקנו בדיוק באותה מאה ולא התאוששו במשך ארבע מאות שנה.


    מעל המנזר ממשיך הערוץ כדרך יער, וחצי שעה גבוה יותר אין דבר מלבד אשור והנחל. זו אחת הדרכים הפשוטות
    ביותר ליד בורג'ומי להבין איך נראה יער הערוץ באמת, בלי להתחייב למסלול מלא בפארק הלאומי.


    בעשרים השנים האחרונות המנזר פעיל שוב, וחיים בו כמה נזירים המחזיקים גינה ומעט בעלי חיים. השטח קטן:
    כנסייה, מגדל פעמונים, שניים-שלושה מבני עזר וגשר עץ מעל המים. הצניעות הזאת היא העיקר. זה אינו אתר שדורש
    שלוש שעות, אלא ארבעים דקות שנשארות איתך.
  tip: >-
    שעה היא יותר ממספיקה. הקטע האחרון הוא שביל יער והוא מחליק אחרי גשם, כך שנעליים רגילות מתאימות וסנדלים
    לא. לכניסה לכנסייה נשים זקוקות למטפחת ולחצאית ארוכה; כיסויים מונחים בדרך כלל ליד הדלת. השירותים בסיסיים
    ואין בית קפה או חנות, אז הביאו מים. בקיץ יש יתושים ליד הנחל. בחורף הערוץ נמצא בצל והקרח מחזיק שבועות,
    אז רדו בזהירות.
  route: >-
    מטביליסי בכביש E60 עד חשורי, משם לבורג'ומי, ומבורג'ומי בדרך לאחלציחה עוד תשעה קילומטרים בערך. בשילוט
    לצ'יטחווי פנו שמאלה ועלו שני קילומטרים בערוץ הצדדי. בסך הכול 172 ק״מ, שעתיים ושלושים וחמש דקות. הדרך
    הראשית סלולה, והקטע האחרון צר וחלקו חצץ, אך במזג אוויר יבש רכב חסכוני עובר אותו בלי בעיה. יש חניה
    מול המנזר. תדלוק בבורג'ומי.
ar:
  name: الدير الأخضر (دير القديس جيورجي في تشيتاخيفي)
  short: دير صغير أُسس في القرن التاسع ويختبئ قرب بورجومي في وادٍ حرجي مكسو بالطحلب.
  body: >-
    **سُمي الدير الأخضر بلون لا بمجاز.** في وادي تشيتاخيفي الضيق، حيث يجري الجدول بمحاذاة فناء الدير مباشرة،
    يغطي الطحلب الحجارة والجدران وجذوع الأشجار؛ ويتسرب الضوء بين الأوراق فيغرق المكان كله في وهج أخضر.
    وفي ظهيرة صيفية، حين تبلغ بورجومي ثلاثين درجة، تتمنى هنا سترة صوف.


    تأسست الجماعة في القرن التاسع، وتقول الرواية إن مؤسسيها تلميذان من تلاميذ الآباء الآشوريين اسمهما
    كريستوفر وثيودور. أما كنيسة القديس جيورجي الحالية فتعود في معظمها إلى القرن الخامس عشر: بناء حجري
    صغير بسيط إلى جانبه برج أجراس قائم بذاته، وهو أجمل ما في الموقع. ولم يبقَ في الداخل رسم يُذكر، والفضاء
    صارم مظلم.


    وحجارة مجرى الجدول منقطة بالأحمر، وتقول الرواية المحلية إن هذا دم رهبان قُتلوا في القرن السادس عشر
    حين أحرق جيش الشاه طهماسب طريقه في الوادي. واللون في الحقيقة من الحديد في الصخر، لكن التاريخ وراء
    الأسطورة حقيقي تماماً: فمعظم أديرة سامتسخه خلت في ذلك القرن بعينه ولم تتعافَ أربعمئة سنة.


    ويتابع الوادي فوق الدير على هيئة درب حرجي، وبعد نصف ساعة صعوداً لا يبقى سوى الزان والجدول. وهي من
    أيسر السبل قرب بورجومي لإدراك كيف تبدو غابة الوادي فعلاً، دون الالتزام بمسار كامل داخل المنتزه الوطني.


    وقد عاد الدير عامراً منذ عشرين عاماً، ويعيش فيه بضعة رهبان يرعون بستاناً وقليلاً من الماشية. والمساحة
    صغيرة: كنيسة وبرج أجراس ومبنيان أو ثلاثة للخدمات وجسر خشبي فوق الماء. وهذا التواضع هو المقصد. ليس
    هذا أثراً يطلب ثلاث ساعات، بل أربعين دقيقة تبقى معك.
  tip: >-
    ساعة أكثر من كافية. والمقطع الأخير درب حرجي يصير زلقاً بعد المطر، فالحذاء العادي مناسب والصندل لا.
    ولدخول الكنيسة تحتاج النساء إلى غطاء رأس وتنورة طويلة، والأغطية موجودة عادة عند الباب. دورة المياه
    بسيطة ولا مقهى ولا متجر، فاحمل الماء. والبعوض ملحوظ قرب الجدول صيفاً. وفي الشتاء يبقى الوادي في الظل
    ويدوم الجليد أسابيع، فانزل بحذر.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري، ثم إلى بورجومي، ومن بورجومي على طريق أخالتسيخه نحو تسعة كيلومترات
    أخرى. وعند لافتة تشيتاخيفي انعطف يساراً واصعد كيلومترين في الوادي الجانبي. المجموع 172 كم وساعتان
    وخمس وثلاثون دقيقة. الطريق الرئيسي معبّد، والمقطع الأخير ضيق وبعضه حصوي، لكن في الطقس الجاف تعبره
    سيارة اقتصادية دون عناء. والوقوف أمام الدير. والوقود في بورجومي.
