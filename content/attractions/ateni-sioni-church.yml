ka:
  name: ატენის სიონი
  short: VII საუკუნის ტაძარი ტანას ხეობაში, ფრიალო კლდის პირას — აქ ჩნდება მხედრულის უძველესი თარიღიანი
    წარწერა.
  body: >-
    **ანბანი, რომელსაც დღეს ყოველ ქართულ აბრაზე კითხულობთ, თარიღიანი სახით პირველად ამ ტაძრის კედლებზე
    ჩნდება.** ატენის სიონზეა ნუსხურის უძველესი თარიღიანი წარწერა, 835 წლისა, და მხედრულის უძველესი თარიღიანი
    სტრიქონები — X საუკუნის 80-იანი წლებისა. სხვა წარწერა მოგვითხრობს, როგორ აიღო და გადაწვა ხალიფას სარდალმა
    ბუღამ თბილისი 853 წლის 5 აგვისტოს; კიდევ ერთი იხსენიებს, რომ XI საუკუნის 60-იან წლებში ბაგრატ IV-მ
    აქ ქალაქის აშენება ბრძანა. იმ ქალაქის ნანგრევები ტაძრის სიახლოვეს დღესაც ჩანს.


    თავად ტაძარი ყველა ამ წარწერაზე ძველია. VII საუკუნის პირველ ნახევარში მცხეთის ჯვრის ყაიდაზეა აგებული
    — ოთხი აფსიდი გუმბათქვეშა კვადრატის ირგვლივ — და გორიდან დაახლოებით 12 კილომეტრში, მდინარე ტანას მარცხენა
    ნაპირზე, ფრიალო კლდის კიდეზე, საყრდენი კედლით გამაგრებულ ბაქანზე დგას. სამხრეთ ფასადზე უთარიღო სომხური
    წარწერაა: „მე, თოდოსაკი, ამ წმინდა ეკლესიის მაშენებელი“. მეცნიერები დღემდე დაობენ, თოდოსაკმა ტაძარი
    ააგო თუ X საუკუნეში განაახლა; ამ განახლებამ ფასადების ზედა ნაწილი მომწვანო-ნაცრისფერი ქვით შემოსა,
    ქვედა რიგებს კი ძველი, თბილი ფერი შერჩა.


    შესვლამდე ტაძარს შემოუარეთ. დასავლეთ ფასადზე ცხენოსანი მონადირე ირემს ყელში ისარს არჭობს, ორი სხვა
    ირემი კი დამფრთხალი გარბის; ჩრდილოეთ კარის თავზე ორი ირემი მრგვალი აუზიდან წყალს სვამს.


    შიგნით გუმბათი სამ წყებად დაწყობილ ტრომპებს ეყრდნობა, კედლებს კი XI საუკუნის მეორე ნახევრის მოხატულობა
    ფარავს, რომელზეც სულ მცირე ოთხი მხატვარი მუშაობდა. ყოველ აფსიდს თავისი ციკლი აქვს: სამხრეთისაში ღვთისმშობლის
    ცხოვრება იშლება — იოაკიმესა და ანადან ტაძრად მიყვანებამდე — ცისფრად, ნაცრისფრად და იისფრად.


    საქართველოში იშვიათია შენობა, რომლის კედლებიც ქვეყნის ხელწერას ასე უხვად ინახავს.
  tip: >-
    შესვლა უფასოა. კარი ყოველთვის ღია არ არის — თუ დაკეტილი დაგხვდათ, თავაზიანად იკითხეთ უახლოეს სახლებში
    ან წირვის შემდეგ მობრძანდით. ფრესკებს მხოლოდ გუმბათისა და აფსიდების სარკმლებიდან შემოსული დღის სინათლე
    ანათებს, ამიტომ შუადღის საათები აირჩიეთ და თვალს რამდენიმე წუთი აცალეთ, რომ ნახევარსიბნელეს შეეჩვიოს;
    ფლეშს ნუ გამოიყენებთ. მხრები და მუხლები დაფარული უნდა იყოს, ქალებს თავსაფარი დასჭირდებათ. ტაძართან
    არაფერი იყიდება: წყალი თან იქონიეთ, კაფე და ტუალეტი გორშია. ტაძარს ერთი საათი ეყოფა, კიდევ ერთი ხეობაში
    გასეირნებას მოახმარეთ — ატენი ღვინითაც ისევე ცნობილია, როგორც ძეგლებით.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ დაახლოებით 80 კმ გაიარეთ და გორის გასასვლელზე გადაუხვიეთ.
    ქალაქი და რკინიგზის ხიდი გადაკვეთეთ, შემდეგ ხიდისთავი–ატენის გზას (შ137) გაჰყევით სამხრეთით, ტანას
    ხეობის აღმა; ტაძარი მდინარის მარცხენა ნაპირზე, გორიდან დაახლოებით 12 კმ-ში დგას. სულ დაახლოებით 98
    კმ და საათნახევარი. ხეობის გზა ასფალტიანია, მაგრამ ვიწრო, ორმოებითა და ცალზოლიანი ხიდებით — წვიმის
    შემდეგ ფრთხილად იარეთ. ეკონომ-კლასის მანქანა სავსებით საკმარისია. საწვავი გორში ჩაასხით: ხეობაში ბენზინგასამართი
    სადგური არ არის.
en:
  name: Ateni Sioni Church
  short: >-
    A 7th-century church on a cliff above the Tana, where the script on every Georgian shop sign first
    appears in a dated inscription.
  body: >-
    **The alphabet on every Georgian shop sign makes its first dated appearance on the walls of this church.**
    Ateni Sioni carries the earliest known dated inscription in the Nuskhuri script, from 835, and the
    earliest dated lines in Mkhedruli, from the 980s. Another text records how the caliph's general Bugha
    took Tbilisi on 5 August 853 and burned it; yet another tells how King Bagrat IV ordered a town built
    here in the 1060s. Its ruins still lie near the church.


    The building is older than all of them. Raised in the first half of the 7th century on the plan of
    Jvari above Mtskheta — four apses around a domed square — it stands about 12 km south of Gori, on
    a terrace held by a retaining wall at the edge of a sheer drop to the river Tana. On the south front
    an undated Armenian inscription reads: "I, Todosak, the builder of this holy church." Scholars still
    argue whether Todosak built it or rebuilt it in the 10th century; that rebuilding faced the upper
    walls in greenish-grey stone, while the lower courses keep their older, warmer colour.


    Walk round before you go in. On the west front a horseman looses an arrow into a deer's neck while
    two other deer start away; over the north door two deer drink from a round pool.


    Inside, the dome rises on three tiers of squinches, and the walls carry frescoes of the later 11th
    century by at least four painters. Each apse has its own cycle: in the south one the life of the Virgin
    unfolds in blues, greys and purples, from Joachim and Anna to her Presentation in the Temple.


    Few buildings in Georgia keep so much of the country's handwriting in one place.
  tip: >-
    Entry is free. The door is not always open; if it is shut, ask politely at the nearest houses or come
    back after a service. The frescoes are lit only by daylight from the drum and apse windows, so aim
    for late morning to mid-afternoon and give your eyes a few minutes to adjust; no flash. Cover shoulders
    and knees; women should bring a headscarf. Nothing is sold at the church, so carry water and use cafés
    and toilets in Gori. An hour covers the church; add another for a walk in the gorge, which is known
    for its wine as much as its monuments.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi for about 80 km and leave at the Gori exit. Cross the
    town and the railway bridge, then pick up the Khidistavi–Ateni road (Sh137), which runs south up the
    Tana valley; the church stands on the left bank, about 12 km from Gori. In all, roughly 98 km and
    an hour and a half. The gorge road is asphalt but narrow, with potholes and single-lane bridges, so
    take it gently after rain. An economy car is perfectly adequate. Fill up in Gori, as there is no fuel
    station in the gorge.
ru:
  name: Атенский Сиони
  short: >-
    Храм VII века на обрыве над Таной: здесь в датированной надписи впервые появляется письмо, которым
    сегодня написана каждая грузинская вывеска.
  body: >-
    **Алфавит, которым написана любая грузинская вывеска, впервые появляется в датированной надписи на
    стенах этого храма.** В Атенском Сиони сохранилась древнейшая известная датированная надпись письмом
    нусхури — 835 года — и древнейшие датированные строки мхедрули, 980-х годов. Другая надпись рассказывает,
    как полководец халифа Буга 5 августа 853 года взял Тбилиси и сжёг его; ещё одна — как царь Баграт
    IV в 1060-х годах повелел построить здесь город. Его руины и сейчас лежат неподалёку от храма.


    Сама церковь старше всех этих надписей. Её возвели в первой половине VII века по плану Джвари над
    Мцхетой — четыре апсиды вокруг подкупольного квадрата. Она стоит примерно в 12 км к югу от Гори, на
    террасе, которую держит подпорная стена, у самого края отвесного обрыва к реке Тана. На южном фасаде
    — недатированная армянская надпись: «Я, Тодосак, строитель этой святой церкви». Учёные до сих пор
    спорят, построил ли Тодосак храм или перестроил его в X веке; при той перестройке верх стен облицевали
    зеленовато-серым камнем, а нижние ряды кладки сохранили прежний, более тёплый цвет.


    Прежде чем войти, обойдите храм кругом. На западном фасаде всадник пускает стрелу в шею оленя, а два
    других оленя бросаются прочь; над северной дверью два оленя пьют из круглого водоёма.


    Внутри купол поднимается на трёх ярусах тромпов, а стены покрыты росписями второй половины XI века,
    над которыми работали по меньшей мере четыре мастера. У каждой апсиды свой цикл: в южной, в синих,
    серых и лиловых тонах, разворачивается житие Богородицы — от Иоакима и Анны до Введения во храм.


    Мало где в Грузии в одних стенах уцелело столько её почерка.
  tip: >-
    Вход свободный. Дверь открыта не всегда; если заперто, вежливо спросите в ближайших домах или вернитесь
    после службы. Фрески освещены только дневным светом из окон барабана и апсид, поэтому приезжайте между
    поздним утром и серединой второй половины дня и дайте глазам несколько минут привыкнуть к полумраку;
    вспышкой не пользуйтесь. Плечи и колени должны быть закрыты, женщинам стоит взять платок. У храма
    ничего не продают: возьмите с собой воду, а кафе и туалеты ищите в Гори. На храм хватит часа; добавьте
    ещё один на прогулку по ущелью, которое славится вином не меньше, чем памятниками.
  route: >-
    Из Тбилиси — на запад по автомагистрали S1 (E60), около 80 км до съезда на Гори. Проезжайте через
    город и железнодорожный мост и выезжайте на дорогу Хидистави — Атени (Sh137), которая уходит на юг
    вверх по долине Таны; храм стоит на левом берегу, примерно в 12 км от Гори. Всего около 98 км и полтора
    часа пути. Дорога по ущелью асфальтирована, но узкая, с выбоинами и однополосными мостами, так что
    после дождя не торопитесь. Машины эконом-класса вполне достаточно. Заправьтесь в Гори: в ущелье заправок
    нет.
fa:
  name: کلیسای سیونی آتنی
  short: >-
    کلیسایی از سدهٔ هفتم بر پرتگاهی بالای رود تانا، جایی که خطِ همهٔ تابلوهای امروز گرجستان نخستین بار
    در کتیبه‌ای تاریخ‌دار دیده می‌شود.
  body: >-
    **الفبایی که امروز بر هر تابلوی مغازه‌ای در گرجستان نوشته می‌شود، نخستین بار در کتیبه‌ای تاریخ‌دار
    بر دیوارهای همین کلیسا پیدا می‌شود.** سیونی آتنی کهن‌ترین کتیبهٔ تاریخ‌دارِ شناخته‌شده به خط نوسخوری
    را، از سال ۸۳۵، و کهن‌ترین سطرهای تاریخ‌دار به خط مخدرولی را، از دههٔ ۹۸۰، در خود دارد. کتیبه‌ای دیگر
    روایت می‌کند که بُغا، سردار خلیفه، در ۵ اوت ۸۵۳ تفلیس را گرفت و به آتش کشید؛ و کتیبهٔ سومی می‌گوید
    که شاه باگرات چهارم در دههٔ ۱۰۶۰ فرمان داد اینجا شهری بسازند. ویرانه‌های آن شهر هنوز نزدیک کلیسا بر
    جا مانده است.


    خودِ بنا از همهٔ این نوشته‌ها کهن‌تر است. در نیمهٔ نخست سدهٔ هفتم بر نقشهٔ کلیسای جواری بالای متسختا
    ساخته شد — چهار آپسیس (فرورفتگی نیم‌دایره) گرداگرد مربعی گنبددار — و حدود ۱۲ کیلومتری جنوب گوری، بر
    صُفّه‌ای ایستاده که دیواری حائل نگهش داشته است، درست بر لبهٔ پرتگاهی که یکسره به رود تانا فرو می‌افتد.
    بر نمای جنوبی کتیبه‌ای ارمنی و بی‌تاریخ آمده است: «من، تودوساک، سازندهٔ این کلیسای مقدس». پژوهشگران
    هنوز بحث می‌کنند که تودوساک آن را ساخت یا در سدهٔ دهم بازسازی کرد؛ در آن بازسازی بخش بالایی دیوارها
    را با سنگ خاکستریِ مایل به سبز روکش کردند، و رج‌های پایینی رنگ کهن‌تر و گرم‌ترِ خود را نگه داشتند.


    پیش از ورود، دور بنا بگردید. بر نمای غربی سوارکاری تیری در گردن گوزنی می‌نشاند و دو گوزن دیگر رم می‌کنند؛
    بالای در شمالی دو گوزن از حوضچه‌ای گرد آب می‌نوشند.


    درون، گنبد بر سه ردیف سُکُنج بالا می‌رود و دیوارها دیوارنگاره‌هایی از نیمهٔ دوم سدهٔ یازدهم دارند
    که دست‌کم چهار نقاش آن‌ها را کشیده‌اند. هر آپسیس چرخهٔ نقش‌های خود را دارد: در آپسیس جنوبی، زندگی
    مریم مقدس با رنگ‌های آبی و خاکستری و ارغوانی، از یواخیم و حنا تا تقدیم مریم به معبد، پیش چشم باز می‌شود.


    کمتر بنایی در گرجستان این‌همه از دست‌خطِ این سرزمین را یک‌جا نگه داشته است.
  tip: >-
    ورود رایگان است. در همیشه باز نیست؛ اگر بسته بود، مؤدبانه از خانه‌های نزدیک بپرسید یا پس از پایان
    مراسم دعا برگردید. دیوارنگاره‌ها فقط با نور روزی روشن می‌شوند که از پنجره‌های ساقهٔ گنبد و آپسیس‌ها
    می‌تابد؛ پس از اواخر صبح تا میانهٔ بعدازظهر بیایید و چند دقیقه به چشم‌هایتان فرصت دهید تا به نیم‌تاریکی
    عادت کنند. از فلاش استفاده نکنید. شانه‌ها و زانوها باید پوشیده باشد و بانوان روسری همراه بیاورند.
    کنار کلیسا چیزی فروخته نمی‌شود؛ آب همراه داشته باشید و برای کافه و سرویس بهداشتی به گوری بروید. یک
    ساعت برای کلیسا بس است؛ ساعتی دیگر هم برای گردش در دره بگذارید که به شرابش همان‌قدر نامدار است که
    به بناهایش.
  route: >-
    از تفلیس از بزرگراه S1 (E60) به سوی غرب بروید و پس از حدود ۸۰ کیلومتر از خروجی گوری بیرون بیایید.
    از شهر و پل راه‌آهن بگذرید و وارد جادهٔ خیدیستاوی–آتنی (Sh137) شوید که رو به جنوب در درهٔ تانا بالا
    می‌رود؛ کلیسا بر کرانهٔ چپ رود، حدود ۱۲ کیلومتری گوری است. روی‌هم حدود ۹۸ کیلومتر و یک ساعت و نیم
    راه. جادهٔ دره آسفالت است اما باریک، با چاله‌ها و پل‌های یک‌خطه؛ پس از باران آهسته برانید. خودروی
    اکونومی کاملاً کافی است. در گوری سوخت بگیرید، چون در دره جایگاه سوخت نیست.
he:
  name: כנסיית אתני סיוני
  short: >-
    כנסייה מן המאה ה-7 על צוק מעל נהר טאנה; כאן מופיע לראשונה בכתובת מתוארכת הכתב שבו כתוב היום כל שלט
    חנות בגאורגיה.
  body: >-
    **האלפבית שעל כל שלט חנות בגאורגיה מופיע לראשונה בכתובת מתוארכת על קירות הכנסייה הזאת.** באתני סיוני
    נמצאת הכתובת המתוארכת הקדומה ביותר הידועה בכתב נוסחורי, משנת 835, והשורות המתוארכות הקדומות ביותר
    בכתב מחדרולי, משנות ה-80 של המאה ה-10. כתובת אחרת מספרת כיצד בוע'א, המצביא של הח'ליף, כבש את טביליסי
    ב-5 באוגוסט 853 ושרף אותה; ועוד אחת מספרת שהמלך בגרט הרביעי ציווה בשנות ה-60 של המאה ה-11 לבנות כאן
    עיר. חורבותיה שוכבות עד היום לא הרחק מן הכנסייה.


    הבניין עצמו עתיק מכל הכתובות האלה. הוא הוקם במחצית הראשונה של המאה ה-7 לפי התוכנית של ג'וארי שמעל
    מצחתה — ארבעה אפסיסים סביב ריבוע שמעליו כיפה — ועומד כ-12 ק״מ מדרום לגורי, על טרסה שקיר תומך מחזיק
    אותה, בשפת מצוק תלול היורד אל נהר טאנה. בחזית הדרומית חקוקה כתובת ארמנית שאינה מתוארכת: "אני, תודוסק,
    בונה הכנסייה הקדושה הזאת". החוקרים עדיין חלוקים אם תודוסק בנה אותה או שיקם אותה במאה ה-10; בשיקום
    ההוא צופו החלקים העליונים של הקירות באבן אפורה-ירקרקה, ואילו הנדבכים התחתונים שמרו על צבעם הישן והחם
    יותר.


    לפני שנכנסים, הקיפו את המבנה. בחזית המערבית פרש יורה חץ בצווארו של אייל, ושני איילים אחרים נמלטים;
    מעל הדלת הצפונית שני איילים שותים מבריכה עגולה.


    בפנים מתרוממת הכיפה על שלושה נדבכים של טרומפים, והקירות מכוסים ציורי קיר מן המחצית השנייה של המאה
    ה-11, מעשי ידיהם של ארבעה ציירים לפחות. לכל אפסיס מחזור משלו: בדרומי נפרשים חיי מרים הבתולה בגוני
    כחול, אפור וסגול, מיואכים וחנה ועד הבאתה אל בית המקדש.


    מעטים הבניינים בגאורגיה ששומרים במקום אחד כל כך הרבה מכתב ידה של הארץ.
  tip: >-
    הכניסה חינם. הדלת אינה פתוחה תמיד; אם היא נעולה, שאלו בנימוס בבתים הקרובים או חזרו אחרי התפילה. ציורי
    הקיר מוארים רק באור היום שחודר מחלונות התוף והאפסיסים, לכן כדאי להגיע בין שעות הבוקר המאוחרות לאמצע
    אחר הצהריים ולתת לעיניים כמה דקות להסתגל לאפלולית. בלי פלאש. יש לכסות כתפיים וברכיים, ונשים צריכות
    להביא כיסוי ראש. ליד הכנסייה לא מוכרים דבר, אז הביאו מים, ובתי קפה ושירותים חפשו בגורי. שעה מספיקה
    לכנסייה; הוסיפו עוד שעה לטיול בערוץ, הידוע ביינו לא פחות מאשר באתריו.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) כ-80 ק״מ וצאו במחלף גורי. חצו את העיר ואת גשר הרכבת, ועלו
    על כביש חידיסטאווי–אתני (Sh137), שעולה דרומה בעמק הטאנה; הכנסייה עומדת על הגדה השמאלית, כ-12 ק״מ מגורי.
    בסך הכול כ-98 ק״מ ושעה וחצי נסיעה. הכביש בערוץ סלול אך צר, עם בורות וגשרים חד-נתיביים, לכן סעו לאט
    אחרי גשם. רכב חסכוני מספיק בהחלט. תדלקו בגורי, כי בערוץ אין תחנת דלק.
ar:
  name: كنيسة أتيني سيوني
  short: >-
    كنيسة من القرن السابع على جرف فوق نهر تانا، يظهر فيها لأول مرة في نقش مؤرَّخ الخطُّ الذي تُكتب به
    اليوم كل لافتة متجر في جورجيا.
  body: >-
    **الأبجدية التي تُكتب بها كل لافتة متجر في جورجيا تظهر لأول مرة في نقش مؤرَّخ على جدران هذه الكنيسة.**
    تحمل أتيني سيوني أقدم نقش مؤرَّخ معروف بخط النوسخوري، ويعود إلى عام 835، وأقدم أسطر مؤرَّخة بخط المخيدرولي،
    من ثمانينيات القرن العاشر. ويروي نقش آخر كيف استولى بُغا، قائد الخليفة، على تبليسي في 5 أغسطس 853
    وأحرقها؛ ويحكي ثالث كيف أمر الملك باغرات الرابع في ستينيات القرن الحادي عشر ببناء مدينة هنا. وما زالت
    أطلالها قائمة قرب الكنيسة.


    غير أن المبنى أقدم منها جميعاً. شُيّد في النصف الأول من القرن السابع على مخطط كنيسة جفاري المطلة على
    متسخيتا — أربع حنيات حول مربع تعلوه قبة — ويقوم على بعد نحو 12 كم جنوب غوري، فوق مصطبة يسندها جدار
    استنادي على حافة منحدر شاهق يهوي إلى نهر تانا. وعلى الواجهة الجنوبية نقش أرمني غير مؤرَّخ نصّه: «أنا
    تودوساك، باني هذه الكنيسة المقدسة». وما زال الباحثون يختلفون: أبناها تودوساك أم أعاد بناءها في القرن
    العاشر؟ وفي إعادة البناء تلك كُسيت أعالي الجدران بحجر رمادي ضارب إلى الخضرة، بينما احتفظت المداميك
    السفلى بلونها الأقدم والأدفأ.


    طُف حول المبنى قبل أن تدخل. على الواجهة الغربية فارس يُطلق سهماً في عنق أيّل، وأيّلان آخران يفرّان؛
    وفوق الباب الشمالي أيّلان يشربان من حوض مستدير.


    في الداخل ترتفع القبة على ثلاث طبقات من الحنايا الركنية، وتغطي الجدران رسوم جدارية من النصف الثاني
    من القرن الحادي عشر، عمل عليها أربعة رسامين على الأقل. لكل حنية دورتها الخاصة: في الحنية الجنوبية
    تتكشّف سيرة السيدة العذراء بدرجات الأزرق والرمادي والبنفسجي، من يواكيم وحنة حتى دخولها إلى الهيكل.


    قليلة هي المباني في جورجيا التي تحفظ في مكان واحد هذا القدر من خطّ يد البلاد.
  tip: >-
    الدخول مجاني. الباب ليس مفتوحاً دائماً؛ فإن وجدته مغلقاً فاسأل بلطف في أقرب البيوت، أو عُد بعد انتهاء
    القداس. لا تضيء الرسوم الجدارية إلا بنور النهار الداخل من نوافذ رقبة القبة والحنيات، فاقصدها بين أواخر
    الصباح ومنتصف ما بعد الظهر، وامنح عينيك بضع دقائق لتعتادا العتمة، ولا تستخدم الفلاش. غطِّ الكتفين
    والركبتين، وعلى النساء إحضار غطاء للرأس. لا يُباع شيء عند الكنيسة، فاحمل الماء، والمقاهي ودورات المياه
    في غوري. تكفي ساعة للكنيسة؛ وأضف ساعة أخرى للتنزه في الوادي، المشهور بنبيذه بقدر شهرته بآثاره.
  route: >-
    من تبليسي اتجه غرباً على الطريق السريع S1 (E60) نحو 80 كم، واخرج عند مخرج غوري. اعبر المدينة وجسر
    السكة الحديدية، ثم اسلك طريق خيديستافي–أتيني (Sh137) الذي يصعد جنوباً في وادي تانا؛ تقوم الكنيسة على
    الضفة اليسرى، على بعد نحو 12 كم من غوري. المسافة كلها قرابة 98 كم، والرحلة نحو ساعة ونصف. طريق الوادي
    معبّد لكنه ضيق، فيه حُفر وجسور بمسرب واحد، فتمهّل بعد المطر. سيارة اقتصادية تكفي تماماً. املأ الخزان
    في غوري، إذ لا محطة وقود في الوادي.
