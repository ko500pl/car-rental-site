ka:
  name: ჭალაადის მყინვარი
  short: >-
    კავკასიონის სამხრეთ კალთაზე ყველაზე დაბლა ჩამოსული მყინვარი: ნაცრისფერი ენა ტყეში, მესტიიდან 8 კმ-ში
    მდებარე ბილიკის სათავიდან ერთი საათის სავალზე.
  body: >-
    **ჭალაადი ის მყინვარია, რომელიც თავად გამოგეგებებათ: კავკასიონის სამხრეთ კალთაზე არცერთი მყინვარი
    ასე დაბლა არ ეშვება — მისი ენა პირდაპირ ტყეში იჭრება.**


    მას ოთხ ათას მეტრზე მაღალი კედლები კვებავს — უშბა, ჩათინი, კავკასი და ბჟედუხი. მყინვარი ორი ნაკადისგან
    შედგება; მთავარი ნაკადი ცხრა კილომეტრზე გრძელია, ენა კი, ქართველ გლაციოლოგთა მონაცემებით, ზღვის დონიდან
    დაახლოებით 1960 მეტრამდე ჩამოდის. სამეცნიერო ცნობარებში მას ჭალაათის მყინვარს უწოდებენ, რუკებსა და
    ბილიკის ნიშნებზე კი უფრო ხშირად ჭალაადს ამოიკითხავთ.


    აქ თავად მისასვლელი გზაც სიამოვნებაა. მესტიიდან გრუნტის გზა მესტიაჭალას აუყვება, პატარა აეროპორტს
    ჩაუვლის და ტყისპირა მოედანზე წყდება. რძისფერ, ხმაურიან მდინარეზე ბაგირხიდი ირწევა; შემდეგ ტყე იწყება
    — ხავსი, ნესტიანი ქერქი, ფოთლებში გაცრილი შუქი — და უცებ ყველაფერი მთავრდება. წინ მხოლოდ მორენაა:
    ნაცრისფერი ნაშალი, ბოსლის ოდენა ლოდები, ცივი ქვისა და შლამის სუნი. მანქანიდან დაახლოებით ერთ საათში
    ყინულის ძირას დგახართ.


    თეთრ საფოსტო ბარათს ნუ მოელით. ქვედა ენა მოყავისფრო-ნაცრისფერია, საკუთარ ნაშალშია ჩაფლული, ძირში კი
    ყინულის ბნელი ხახიდან ნადნობი წყალი ამოხეთქავს. სითეთრე მაღლაა: ზედა ყინულჩანჩქერი, დაახლოებით 300
    მეტრის სიმაღლისა და 700 მეტრის სიგანის, ფერდზე ვარდნისას გაყინული ნიაღვარივით კიდია.


    ყინულზე ნუ ახვალთ და გამოქვაბულებში ნუ შეხვალთ: ენა უკან იხევს და უეცრად ინგრევა. სჯობს, მორენაზე
    დადგეთ და ყური მიუგდოთ. მყინვარი ტკაცუნებს, ღრჭიალებს, მდინარეში ქვებს აგორებს. ეს ნელი დაზგა ამ ხეობას
    მანამდეც თლიდა, სანამ აქ პირველი კოშკი აშენდებოდა, და დღესაც მუშაობს — ოღონდ ყოველ ზაფხულს რამდენიმე
    მეტრით უფრო შორს.
  tip: >-
    დილით წადით: შუადღის შემდეგ ხეობას ხშირად ღრუბელი ავსებს, ყინულჩანჩქერზე კი ყველაზე სუფთა სინათლე
    დილაობითაა. ჩაიცვით მყარლანჩიანი სალაშქრო ფეხსაცმელი — ბოლო ნახევარი საათი ფეხქვეშ მოგორავ ქვებზე
    გადის. წყალი, საჭმელი და თბილი ტანსაცმელი თან იქონიეთ: ბილიკის სათავესთან რამის ყიდვის იმედი ნუ გექნებათ,
    ყინულთან კი ჰაერი მესტიაზე შესამჩნევად ცივია. ბავშვები გზას ადვილად ძლევენ, თუ მოქანავე ხიდისა არ
    ეშინიათ. მანქანიდან მანქანამდე დაახლოებით სამი საათი გამოყავით. ენას ნუ მიუახლოვდებით: აქ მთავარი
    საფრთხე ჩამოცვენილი ქვა და ჩამონგრეული ყინულია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ იმავე ს1-ით სენაკის გავლით
    ზუგდიდამდე, იქიდან კი ზუგდიდი–ჯვარი–მესტიის გზით ენგურის ხეობას აუყევით: მესტიამდე დაახლოებით 470
    კმ და რვანახევარი საათია, მთელ გზაზე ასფალტი. საწვავი ზუგდიდში ან მესტიაში ჩაასხით — ზემოთ ბენზინგასამართი
    სადგური არ არის. მესტიიდან ჩრდილოეთით, მესტიაჭალის გასწვრივ, ბილიკის სათავემდე დაახლოებით რვა კილომეტრია:
    ჯერ ასფალტი, შემდეგ ორმოებიანი ხრეში და წყალგამტარი ღარები. თბილისიდან სულ დაახლოებით 480 კმ და რვა
    საათი და ორმოცდაათი წუთი გამოდის. მშრალ ამინდში ჯიპი ან კროსოვერი უპრობლემოდ ადის; დაბალი სედანი ჯობს,
    კილომეტრით ადრე გააჩეროთ და ფეხით გააგრძელოთ. მესტიის ცენტრიდან ადგილობრივი მძღოლებიც დაგიყვანენ.
en:
  name: Chalaadi Glacier
  short: >-
    The lowest-reaching glacier on the Caucasus's southern flank: grey ice pushing into the forest, an
    hour's walk from a trailhead 8 km above Mestia.
  body: >-
    **Chalaadi is the glacier that comes down to meet you: no other ice on the southern flank of the Caucasus
    reaches so low, and its tongue pushes right into the forest.**


    It is fed from walls above four thousand metres — Ushba, Chatini, Kavkasi and Bzhedukhi — and flows
    in two streams, the main one more than nine kilometres long. Georgian glaciologists place its snout
    at about 1,960 metres. Scientific reference books call it Chalaati; on maps and trail signs you will
    mostly read Chalaadi.


    The approach is half the pleasure. From Mestia a track follows the Mestiachala upstream, past the
    little airport, to a clearing where the road gives out. A suspension footbridge sways over the milky,
    roaring river; then comes forest — moss, wet bark, light sifting through leaves — and then, abruptly,
    nothing but moraine: grey rubble, boulders as big as barns, the smell of cold stone and silt. About
    an hour from the car you stand below the ice.


    Do not expect a white postcard. The lower tongue is grey-brown, buried in its own debris, and at its
    foot meltwater bursts from a dark mouth in the ice. The white is higher up: the upper icefall, some
    300 metres tall and 700 wide, hangs on the headwall like a cataract frozen mid-fall.


    Keep off the ice and out of the caves; the snout is retreating and collapses without warning. Stand
    on the moraine instead and listen. The glacier ticks, groans and rolls stones into the river — a slow
    machine that was carving this valley long before anyone built a tower in it, and is still at work,
    a few metres further back each summer.
  tip: >-
    Go early: cloud tends to fill the valley after midday, and the light on the icefall is cleanest in
    the morning. Wear boots with real grip, because the last half-hour crosses loose moraine that rolls
    underfoot. Carry water, food and a warm layer — do not count on buying anything at the trailhead,
    and the air by the ice is noticeably colder than in Mestia. Children manage the walk well if the swaying
    bridge does not frighten them. Allow about three hours car to car, and stay well back from the snout:
    falling stones and collapsing ice are the real dangers here.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia, stay on the S1 through Senaki to Zugdidi,
    then climb the Enguri gorge on the Zugdidi–Jvari–Mestia road: about 470 km and eight and a half hours
    to Mestia, asphalt throughout. Fill the tank in Zugdidi or Mestia; there is no fuel further up. From
    Mestia a track runs roughly eight kilometres north along the Mestiachala — asphalt at first, then
    gravel with potholes and drainage ruts — to the trailhead clearing, some 480 km and 8 hours 50 minutes
    from Tbilisi in all. In dry weather an SUV or crossover copes easily; in a low sedan, park a kilometre
    early and walk. Local drivers also run transfers from central Mestia.
ru:
  name: Ледник Чалаади
  short: >-
    Ледник, спускающийся ниже всех на южном склоне Кавказа: серый лёд врезается в лес в часе ходьбы от
    начала тропы, в 8 км выше Местии.
  body: >-
    **Чалаади — ледник, который сам выходит вам навстречу: ни один другой лёд на южном склоне Кавказа
    не спускается так низко, и его язык вторгается прямо в лес.**


    Его питают стены выше четырёх тысяч метров — Ушба, Чатини, Кавкаси и Бжедухи; течёт он двумя потоками,
    главный длиной более девяти километров. Грузинские гляциологи определяют высоту его языка примерно
    в 1960 метров. В научных справочниках он значится как Чалаати, но на картах и указателях вы чаще прочтёте
    «Чалаади».


    Дорога сюда — половина удовольствия. Из Местии грунтовка идёт вверх по Местиачале, мимо маленького
    аэропорта, к поляне, где дорога кончается. Над молочной ревущей рекой качается подвесной пешеходный
    мост; за ним лес — мох, мокрая кора, свет, процеженный сквозь листву, — а потом вдруг ничего, кроме
    морены: серый щебень, валуны величиной с сарай, запах холодного камня и ила. Примерно через час от
    машины вы стоите под льдом.


    Не ждите белой открытки. Нижний язык серо-бурый, погребённый под собственными обломками, а у его подножия
    из тёмного устья во льду вырывается талая вода. Белизна выше: верхний ледопад высотой около 300 и
    шириной около 700 метров висит на тыльной стене цирка, как водопад, застывший на лету.


    На лёд не выходите и в гроты не заходите: язык отступает и обрушивается без предупреждения. Лучше
    встаньте на морене и прислушайтесь. Ледник потрескивает, стонет и скатывает камни в реку — медленная
    машина, которая прорезала эту долину задолго до того, как здесь построили первую башню, и всё ещё
    работает, каждое лето отступая на несколько метров.
  tip: >-
    Выходите пораньше: после полудня долину обычно затягивают облака, а свет на ледопаде чище всего утром.
    Нужны ботинки с хорошим протектором: последние полчаса идут по подвижной морене, камни уходят из-под
    ног. Возьмите воду, еду и тёплую одежду — не рассчитывайте что-нибудь купить у начала тропы, а у льда
    заметно холоднее, чем в Местии. Дети проходят маршрут легко, если их не пугает качающийся мост. От
    машины до машины — около трёх часов. Держитесь подальше от языка ледника: главная опасность здесь
    — падающие камни и обрушения льда.
  route: >-
    Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа, дальше по той же S1 через Сенаки до Зугдиди, затем
    вверх по ущелью Ингури по дороге Зугдиди — Джвари — Местиа: около 470 км и восьми с половиной часов
    до Местии, всё по асфальту. Заправьтесь в Зугдиди или Местии — выше заправок нет. Из Местии примерно
    восемь километров на север вдоль Местиачалы идёт дорога — сначала асфальт, потом гравий с выбоинами
    и водоотводными канавами — до поляны у начала тропы; всего от Тбилиси около 480 км и 8 часов 50 минут.
    В сухую погоду кроссовер или внедорожник проедет без труда; на низком седане оставьте машину за километр
    и пройдите пешком. Из центра Местии туда возят и местные водители.
fa:
  name: یخچال طبیعی چالاادی
  short: >-
    یخچالی که در دامنهٔ جنوبی قفقاز از همه پایین‌تر می‌آید: یخی خاکستری که به دل جنگل می‌خزد، یک ساعت
    پیاده‌روی از آغاز مسیری در ۸ کیلومتری بالای مستیا.
  body: >-
    **چالاادی یخچالی است که خود به پیشواز شما می‌آید: هیچ یخ دیگری در دامنهٔ جنوبی قفقاز تا این اندازه
    پایین نمی‌آید و زبانه‌اش درست به درون جنگل پیش می‌رود.**


    دیواره‌هایی بلندتر از چهار هزار متر آن را سیراب می‌کنند — اوشبا، چاتینی، کاوکاسی و بژدوخی — و در دو
    شاخه جاری است که شاخهٔ اصلی‌اش بیش از نه کیلومتر درازا دارد. یخچال‌شناسان گرجی پیشانی آن را در ارتفاع
    حدود ۱٬۹۶۰ متر می‌دانند. در کتاب‌های مرجع علمی «چالاآتی» نامیده می‌شود، اما روی نقشه‌ها و تابلوهای
    مسیر بیشتر «چالاادی» می‌خوانید.


    رسیدن به آن نیمی از لذت است. از مستیا راهی خاکی در امتداد مستیاچالا رو به بالادست می‌رود، از کنار
    فرودگاه کوچک می‌گذرد و به فضای بازی می‌رسد که جاده در آن تمام می‌شود. پلی معلق برای عابران بر فراز
    رود شیری‌رنگ و خروشان تاب می‌خورد؛ سپس جنگل می‌آید — خزه، پوست خیس درختان، نوری که از لای برگ‌ها بیخته
    می‌شود — و آن‌گاه ناگهان چیزی جز یخرفت نمی‌ماند: قلوه‌سنگ خاکستری، تخته‌سنگ‌هایی به بزرگی انبار علوفه،
    بوی سنگ سرد و لای. نزدیک به یک ساعت پس از ترک خودرو، زیر یخ ایستاده‌اید.


    منتظر کارت‌پستالی سفید نباشید. زبانهٔ پایینی خاکستری‌قهوه‌ای است و زیر آوارِ خودش مدفون، و در پای
    آن آب ذوب‌شده از دهانه‌ای تیره در یخ بیرون می‌جهد. سپیدی بالاتر است: آبشار یخی بالایی، به بلندی حدود
    ۳۰۰ و پهنای حدود ۷۰۰ متر، بر دیوارهٔ انتهایی دره آویخته است، چون آبشاری که در میانهٔ فرو ریختن یخ
    زده باشد.


    روی یخ نروید و وارد غارهای یخی نشوید؛ پیشانی یخچال در حال عقب‌نشینی است و بی‌خبر فرو می‌ریزد. به جای
    آن روی یخرفت بایستید و گوش بسپارید. یخچال تق‌تق می‌کند، ناله سر می‌دهد و سنگ‌ها را به رود می‌غلتاند
    — ماشینی کُند که مدت‌ها پیش از آن‌که کسی در این دره برجی بسازد به تراشیدنش مشغول بود و هنوز هم کار
    می‌کند، هر تابستان چند متری عقب‌تر.
  tip: >-
    زود بروید: پس از نیمروز ابر معمولاً دره را پر می‌کند و نورِ روی آبشار یخی صبح‌ها از همه شفاف‌تر است.
    کفشی با آج واقعی بپوشید، چون نیم ساعت پایانی از روی یخرفتی لق می‌گذرد که زیر پا می‌لغزد. آب، خوراک
    و یک لایهٔ گرم همراه داشته باشید — روی خرید چیزی در آغاز مسیر حساب نکنید، و هوای کنار یخ به‌روشنی
    سردتر از مستیاست. کودکان اگر از پلِ لرزان نترسند، به‌خوبی از پس این پیاده‌روی برمی‌آیند. از خودرو
    تا خودرو حدود سه ساعت در نظر بگیرید و از پیشانی یخچال فاصلهٔ زیادی بگیرید: خطر واقعی این‌جا ریزش سنگ
    و فروریختن یخ است.
  route: >-
    از تفلیس از جادهٔ S1 (E60) و از کنار کوتائیسی تا سامتردیا بروید، روی همان S1 از سناکی بگذرید تا به
    زوگدیدی برسید، سپس از جادهٔ زوگدیدی–جواری–مستیا درهٔ اینگوری را بالا بروید: حدود ۴۷۰ کیلومتر و هشت
    ساعت و نیم تا مستیا، سراسر آسفالت. در زوگدیدی یا مستیا باک را پر کنید؛ بالاتر پمپ بنزینی نیست. از
    مستیا راهی نزدیک به هشت کیلومتر به سوی شمال در امتداد مستیاچالا می‌رود — نخست آسفالت، سپس شنی با چاله
    و شیارهای آب‌رو — تا فضای باز آغاز مسیر پیاده؛ روی هم رفته حدود ۴۸۰ کیلومتر و ۸ ساعت و ۵۰ دقیقه از
    تفلیس. در هوای خشک، شاسی‌بلند یا کراس‌اوور به‌آسانی از پس آن برمی‌آید؛ با سدان کوتاه، یک کیلومتر زودتر
    پارک کنید و پیاده بروید. رانندگان محلی از مرکز مستیا هم مسافر می‌برند.
he:
  name: קרחון צ׳לאדי
  short: >-
    הקרחון היורד הכי נמוך במדרון הדרומי של הקווקז: קרח אפור הנדחק אל תוך היער, שעת הליכה מראש שביל שנמצא
    8 ק״מ מעל מסטיה.
  body: >-
    **צ׳לאדי הוא הקרחון שיורד לקראתכם: שום קרח אחר במדרון הדרומי של הקווקז אינו מגיע נמוך כל כך, ולשונו
    נדחקת היישר אל תוך היער.**


    הוא ניזון מקירות שגובהם יותר מארבעת אלפים מטרים — אושבה, צ׳אטיני, קבקסי ובז׳דוחי — וזורם בשתי זרועות,
    שהראשית שבהן ארוכה מתשעה קילומטרים. חוקרי קרחונים גאורגים ממקמים את חזיתו בגובה של כ-1,960 מטרים.
    בספרי העיון המדעיים הוא נקרא צ׳לאאטי; על המפות ועל שלטי השביל תקראו בדרך כלל צ׳לאדי.


    הדרך אליו היא חצי מן ההנאה. ממסטיה עולה דרך עפר במעלה נהר המסטיאצ׳אלה, על פני שדה התעופה הקטן, אל
    קרחת שבה הדרך נגמרת. גשר תלוי להולכי רגל מתנדנד מעל הנהר החלבי השוצף; אחריו בא יער — טחב, קליפות עצים
    רטובות, אור המסתנן בין העלים — ואז, בבת אחת, רק מורנה: שברי סלע אפורים, סלעי ענק בגודל של אסם, ריח
    של אבן קרה ושל טין. כשעה מן הרכב אתם עומדים מתחת לקרח.


    אל תצפו לגלויה לבנה. הלשון התחתונה אפורה-חומה, קבורה תחת הפסולת שהיא עצמה נושאת, ולמרגלותיה פורצים
    מי הפשרה מפתח כהה בקרח. הלבן נמצא גבוה יותר: מפל הקרח העליון, כ-300 מטרים גובהו וכ-700 מטרים רוחבו,
    תלוי על הקיר שבראש העמק כמו מפל מים שקפא באמצע נפילתו.


    אל תעלו על הקרח ואל תיכנסו למערות; חזית הקרחון נסוגה וקורסת בלי אזהרה. עמדו במקום זאת על המורנה והקשיבו.
    הקרחון מתקתק, נאנק ומגלגל אבנים אל הנהר — מכונה איטית שחצבה את העמק הזה זמן רב לפני שמישהו בנה בו
    מגדל, ועדיין היא עובדת, נסוגה כמה מטרים בכל קיץ.
  tip: >-
    צאו מוקדם: אחרי הצהריים עננים ממלאים בדרך כלל את העמק, והאור על מפל הקרח צלול ביותר בבוקר. נעלו נעליים
    עם אחיזה של ממש, כי חצי השעה האחרונה חוצה מורנה רופפת שמתגלגלת מתחת לרגליים. קחו מים, אוכל ושכבה חמה
    — אל תסמכו על כך שתוכלו לקנות משהו בתחילת השביל, והאוויר ליד הקרח קר בהרבה מאשר במסטיה. ילדים מתמודדים
    היטב עם ההליכה, אם הגשר המתנדנד אינו מפחיד אותם. הקציבו כשלוש שעות מהרכב ועד הרכב, ושמרו מרחק רב מחזית
    הקרחון: אבנים נופלות וקרח קורס הם הסכנות האמיתיות כאן.
  route: >-
    מטביליסי סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, המשיכו ב-S1 דרך סנקי עד זוגדידי, ואז טפסו במעלה
    ערוץ האנגורי בכביש זוגדידי–ג׳ווארי–מסטיה: כ-470 ק״מ ושמונה וחצי שעות עד מסטיה, כולו סלול. תדלקו בזוגדידי
    או במסטיה; גבוה יותר אין דלק. ממסטיה עולה דרך כשמונה קילומטרים צפונה לאורך המסטיאצ׳אלה — בתחילה סלולה,
    אחר כך חצץ עם בורות ותעלות ניקוז — עד הקרחת שבראש השביל: בסך הכול כ-480 ק״מ ו-8 שעות ו-50 דקות מטביליסי.
    במזג אוויר יבש רכב שטח או קרוסאובר עובר בקלות; ברכב סדאן נמוך, החנו קילומטר לפני הסוף והמשיכו ברגל.
    נהגים מקומיים מציעים גם הסעות ממרכז מסטיה.
ar:
  name: نهر تشالادي الجليدي
  short: >-
    أدنى الأنهار الجليدية امتداداً على السفح الجنوبي للقوقاز: جليد رمادي يتوغّل في الغابة على مسيرة ساعة
    من بداية درب يبعد 8 كم عن ميستيا.
  body: >-
    **تشالادي نهر جليدي ينزل للقائك: فلا جليد آخر على السفح الجنوبي للقوقاز يبلغ هذا الانخفاض، ولسانه
    يتوغّل في قلب الغابة.**


    تغذّيه جدران يزيد ارتفاعها على أربعة آلاف متر — أوشبا وتشاتيني وكافكاسي وبجيدوخي — ويجري في مجريين،
    يزيد طول الرئيسي منهما على تسعة كيلومترات. ويحدّد علماء الجليد الجورجيون موضع جبهته على ارتفاع 1,960
    متراً تقريباً. تسمّيه المراجع العلمية تشالاتي، أما على الخرائط ولافتات الدروب فستقرأ في الغالب تشالادي.


    الطريق إليه نصف المتعة. من ميستيا يتبع مسلكٌ نهرَ ميستياتشالا صعوداً، مروراً بالمطار الصغير، حتى فسحة
    ينتهي عندها الطريق. هناك يتأرجح جسر مشاة معلّق فوق النهر الحليبي الهادر، ثم تأتي الغابة — طحلب ولحاء
    مبتلّ وضوء يتسرّب بين الأوراق — ثم فجأة لا شيء سوى الركام الجليدي: حطام صخري رمادي، وجلاميد بحجم الحظائر،
    ورائحة الحجر البارد والطمي. وبعد نحو ساعة من السيارة تقف تحت الجليد.


    لا تنتظر بطاقة بريدية بيضاء. فاللسان السفلي رماديّ بنّي، مدفون تحت حطامه، وعند قدمه تتفجّر مياه الذوبان
    من فمٍ مظلم في الجليد. البياض في الأعلى: الشلال الجليدي العلوي، بارتفاع نحو 300 متر وعرض نحو 700 متر،
    معلّق على الجدار الخلفي كأنه شلال تجمّد في منتصف سقوطه.


    ابقَ بعيداً عن الجليد وخارج الكهوف؛ فجبهة النهر الجليدي تتراجع وتنهار دون سابق إنذار. قف بدلاً من
    ذلك على الركام وأنصت. النهر الجليدي يطقطق ويئنّ ويدحرج الحجارة إلى النهر — آلة بطيئة كانت تنحت هذا
    الوادي قبل أن يبني فيه أحدٌ برجاً بزمن طويل، ولا تزال تعمل، متراجعةً بضعة أمتار كل صيف.
  tip: >-
    انطلق باكراً: فالغيوم تملأ الوادي عادة بعد الظهر، والضوء على الشلال الجليدي أصفى ما يكون في الصباح.
    البس حذاءً ذا نعل متماسك حقاً، لأن نصف الساعة الأخير يعبر ركاماً مفككاً يتدحرج تحت القدمين. احمل الماء
    والطعام وطبقة دافئة — ولا تعوّل على شراء أي شيء عند بداية الدرب، والهواء قرب الجليد أبرد بوضوح منه
    في ميستيا. يجتاز الأطفال المسيرة بسهولة إن لم يُخِفهم الجسر المتأرجح. خصّص نحو ثلاث ساعات من السيارة
    إلى السيارة، وابقَ بعيداً عن جبهة الجليد: فتساقط الحجارة وانهيار الجليد هما الخطر الحقيقي هنا.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي،
    ثم اصعد مضيق إنغوري على طريق زوغديدي–جفاري–ميستيا: نحو 470 كم وثماني ساعات ونصف حتى ميستيا، كلها معبّدة.
    املأ الخزان في زوغديدي أو ميستيا، فلا وقود بعدهما. من ميستيا يمتد مسلك نحو ثمانية كيلومترات شمالاً
    على طول ميستياتشالا — معبّد أولاً، ثم حصى مليء بالحفر وأخاديد تصريف المياه — حتى فسحة بداية الدرب،
    أي نحو 480 كم و8 ساعات و50 دقيقة من تبليسي إجمالاً. في الطقس الجاف تجتازه سيارة دفع رباعي أو كروس
    أوفر بسهولة، أما بسيارة سيدان منخفضة فاركنها قبل النهاية بكيلومتر وأكمل سيراً. ويوفّر سائقون محليون
    أيضاً رحلات نقل من وسط ميستيا.
