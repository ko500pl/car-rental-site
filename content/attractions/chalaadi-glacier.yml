ka:
  name: ჭალაადის მყინვარი
  short: მესტიასთან ყველაზე ახლოს მდებარე მყინვარი — მოკლე მისასვლელი გზა და ორსაათიანი ლაშქრობა ყინულის
    ენამდე.
  body: >-
    ჭალაადის მყინვარი კავკასიონის მთავარი ქედიდან ჩამოდის და მესტიასთან ყველაზე ხელმისაწვდომი მყინვარია.
    სწორედ ამიტომ არის ის სვანეთში პირველი დღის ლოგიკური არჩევანი: არ სჭირდება არც გიდი, არც ალპინისტური
    აღჭურვილობა და არც მთელი დღე.


    მარშრუტი მარტივია. მესტიიდან ჩრდილო-აღმოსავლეთით მიდიხართ მდინარე მესტიაჭალის ხეობაში დაახლოებით შვიდი
    კილომეტრი, სადაც გზა პარკინგთან მთავრდება. იქიდან ბილიკი მდინარეზე გადებულ ბაგირხიდს კვეთს და მშრალ
    ტყეში, შემდეგ კი ქვიან მორენაზე ადის. ერთი მხარე დაახლოებით ერთი საათია, სულ სამ საათამდე გაჩერებებით.


    რას ნახავთ:


    - **ბაგირხიდი მესტიაჭალაზე** — მოძრავი, მაგრამ სრულიად უსაფრთხო გადასასვლელი

    - **წიფლისა და მურყნის ტყე**, რომელიც პირდაპირ მყინვარულ მორენაში გადადის

    - **ყინულის ენა** მოყავისფრო-ნაცრისფერი ზედაპირით და ყინულის გამოქვაბულებით ქვედა ნაწილში


    მნიშვნელოვანია რეალისტური მოლოდინი: ჭალაადი, ისევე როგორც კავკასიის სხვა მყინვარები, უკან იხევს, ამიტომ
    ყინულის კიდე წლიდან წლამდე ცოტათი შორდება. ყინულზე ასვლა და გამოქვაბულებში შესვლა კატეგორიულად არ
    არის რეკომენდებული — ზედაპირი არასტაბილურია და ჩამონგრევა ხშირია. სამაგიეროდ, ქვედა მორენიდან ხედი
    სრულიად საკმარისია იმისთვის, რომ მასშტაბი გაიგოთ.
  tip: >-
    დაიწყეთ დილით: შუადღის შემდეგ ხეობა ხშირად იფარება ღრუბლით და წვიმა იწყება. ფეხსაცმელი აუცილებლად
    სოლიდური ლანჩვის ან სალაშქრო უნდა იყოს — ბოლო მონაკვეთი მოძრავ ქვებზე გადის და კროსოვკებში ეს არასასიამოვნოა.
    თან წაიღეთ წყალი და საჭმელი, რადგან პარკინგთან სტაბილურად არაფერი იყიდება. მყინვართან ტემპერატურა
    მკვეთრად ეცემა, ამიტომ ქურთუკი დაგჭირდებათ ზაფხულშიც. ბავშვებთან ერთად მარშრუტი გასავლელია, თუ ბაგირხიდი
    არ აშინებთ.
  route: >-
    თბილისიდან ჯერ მესტიამდე მიდიხართ — 470 კმ, რვა-ცხრა საათი ზუგდიდისა და ენგურის ხეობის გავლით. მესტიიდან
    საწყის პარკინგამდე დაახლოებით შვიდი-ცხრა კილომეტრია მდინარე მესტიაჭალის გასწვრივ; დასაწყისი ასფალტია,
    ბოლო რამდენიმე კილომეტრი კი ხრეშოვანი გზაა ორმოებით. მშრალ ამინდში კროსოვერი უპრობლემოდ ადის, სედანით
    კი უმჯობესია ერთი კილომეტრით ადრე გაჩერდეთ და ფეხით გააგრძელოთ. საწვავი მესტიაში აავსეთ. ალტერნატივა
    — ადგილობრივი ტრანსფერი მესტიის ცენტრიდან, თუ საკუთარი მანქანის რისკი არ გინდათ.
en:
  name: Chalaadi Glacier
  short: The most accessible glacier near Mestia — a short drive up the valley and a two-hour walk to
    the ice tongue.
  body: >-
    The Chalaadi glacier flows down from the main Caucasus ridge and is the easiest glacier to reach from
    Mestia. That makes it the logical choice for a first full day in Svaneti: no guide, no mountaineering
    equipment and no dawn start are required.


    The route is straightforward. From Mestia you drive north-east up the Mestiachala valley for about
    seven kilometres to a small parking area where the road ends. From there a path crosses the river
    on a suspension bridge, climbs through birch and alder forest, and then works its way up loose glacial
    moraine. It is roughly an hour each way, or up to three hours in total with stops and photographs.


    What you will see:


    - **The suspension bridge over the Mestiachala** — it sways, but it is entirely safe

    - **Dense riverside forest** that gives way abruptly to bare glacial rubble

    - **The ice tongue itself**, grey-brown with debris, with meltwater caves at its base


    Keep expectations realistic. Like most glaciers in the Caucasus, Chalaadi is retreating, so the ice
    edge sits slightly further back each year. Climbing onto the ice or entering the caves is strongly
    discouraged: the surface is unstable and collapses are common. From the lower moraine the view is
    more than enough to grasp the scale of the thing.
  tip: >-
    Start in the morning. Cloud usually fills the valley after midday and rain follows. Wear proper walking
    shoes with grip — the last section crosses loose stone and is unpleasant in trainers. Carry water
    and a snack, since nothing is reliably sold at the trailhead. Temperatures drop sharply at the ice,
    so bring a jacket even in July. The walk is manageable with children if they are comfortable on the
    swinging bridge. Allow about three hours from car to car and do not plan anything tight afterwards.
  route: >-
    From Tbilisi you first drive to Mestia — 470 km and eight to nine hours via Zugdidi and the Enguri
    gorge. From Mestia it is roughly seven to nine kilometres up the Mestiachala valley to the trailhead
    parking. The first part is asphalt; the last few kilometres are gravel with potholes and shallow drainage
    cuts. In dry weather a crossover handles it easily, while with a sedan it is better to stop a kilometre
    early and walk. Fill up in Mestia, as there is no fuel in the valley. Local drivers also run transfers
    from the town centre if you would rather not take your own car up.
ru:
  name: Ледник Чалаади
  short: Самый доступный ледник у Местиа — короткий подъезд по ущелью и двухчасовая прогулка до языка
    льда.
  body: >-
    Ледник Чалаади спускается с Главного Кавказского хребта и является самым доступным ледником в окрестностях
    Местиа. Поэтому он логичный выбор для первого полноценного дня в Сванетии: не нужны ни гид, ни альпинистское
    снаряжение, ни выход затемно.


    Маршрут прост. Из Местиа вы едете на северо-восток по ущелью реки Местиачала примерно семь километров
    до небольшой стоянки, где дорога заканчивается. Дальше тропа пересекает реку по подвесному мосту,
    поднимается через берёзово-ольховый лес и выходит на осыпную ледниковую морену. В одну сторону — около
    часа, всего с остановками до трёх часов.


    Что вы увидите:


    - **Подвесной мост через Местиачалу** — он раскачивается, но совершенно безопасен

    - **Густой прибрежный лес**, который резко сменяется голым каменным навалом

    - **Сам язык ледника** серо-бурого цвета с талыми гротами в нижней части


    Ожидания стоит держать реалистичными. Как и большинство ледников Кавказа, Чалаади отступает, поэтому
    кромка льда каждый год оказывается чуть дальше. Подниматься на лёд и заходить в гроты настоятельно
    не рекомендуется: поверхность нестабильна, обрушения случаются регулярно. С нижней морены вид полностью
    передаёт масштаб.
  tip: >-
    Выходите утром: после полудня ущелье обычно затягивает облаками, следом начинается дождь. Обувь нужна
    нормальная треккинговая — последний участок идёт по подвижным камням, в кроссовках это неприятно.
    Возьмите воду и перекус, у начала тропы стабильно ничего не продают. У льда температура резко падает,
    куртка пригодится даже в июле. С детьми маршрут проходим, если их не пугает качающийся мост. От машины
    до машины закладывайте около трёх часов.
  route: >-
    Из Тбилиси сначала едете в Местиа — 470 км и восемь-девять часов через Зугдиди и Ингурское ущелье.
    От Местиа до стоянки у начала тропы примерно семь-девять километров вверх по долине Местиачалы. Начало
    асфальтовое, последние несколько километров — грунт с ямами и водоотводными канавами. В сухую погоду
    кроссовер проходит легко, на седане лучше остановиться на километр раньше и пройти пешком. Заправляйтесь
    в Местиа, в ущелье топлива нет. Местные водители возят и трансферы из центра посёлка, если не хотите
    гнать свою машину наверх.
fa:
  name: یخچال چالاادی
  short: در دسترس‌ترین یخچال نزدیک مستیا — کمی رانندگی در بالادست دره و دو ساعت پیاده‌روی تا زبانهٔ یخ.
  body: >-
    یخچال چالاادی از ستیغ اصلی قفقاز پایین می‌آید و دسترس‌ترین یخچال از مستیاست. همین آن را به انتخاب
    منطقی نخستین روز کامل در سوانتی تبدیل می‌کند: نه راهنما لازم است، نه تجهیزات کوهنوردی و نه راه‌افتادن
    پیش از سپیده.


    مسیر ساده است. از مستیا حدود هفت کیلومتر به سمت شمال‌شرق و بالادست درهٔ مستیاچالا می‌رانید تا جایی
    که جاده به پارکینگ کوچکی ختم می‌شود. از آنجا کوره‌راهی روی پل معلق از رودخانه می‌گذرد، از جنگل توس
    و توسکا بالا می‌رود و بعد روی مورن سست یخچالی راه خود را باز می‌کند. هر طرف تقریباً یک ساعت است و
    با توقف و عکس گرفتن در مجموع تا سه ساعت. پل معلق روی مستیاچالا تاب می‌خورد اما کاملاً امن است؛ جنگل
    انبوه کنار رود ناگهان جای خود را به قلوه‌سنگ برهنهٔ یخچالی می‌دهد؛ و زبانهٔ یخ، خاکستری-قهوه‌ای از
    خرده‌سنگ، در پای خود غارهای آب‌شدگی دارد.


    انتظارها را واقع‌بینانه نگه دارید. چالاادی هم مثل بیشتر یخچال‌های قفقاز عقب می‌نشیند و لبهٔ یخ هر
    سال کمی دورتر می‌رود. بالا رفتن روی یخ یا رفتن به داخل غارها به‌شدت توصیه نمی‌شود: سطح ناپایدار است
    و ریزش عادی. از روی مورن پایینی، منظره برای درک مقیاس کار بیش از اندازه کافی است.
  tip: >-
    صبح راه بیفتید. معمولاً بعد از ظهر ابر دره را پر می‌کند و باران پشت آن می‌آید. کفش پیاده‌روی با کف
    چنگ‌دار بپوشید — بخش پایانی از سنگ سست می‌گذرد و با کتانی ناخوشایند است. آب و خوراک همراه ببرید، چون
    سرِ مسیر چیزی به‌طور مطمئن فروخته نمی‌شود. کنار یخ دما به‌شدت پایین می‌آید، پس حتی در ژوئیه ژاکت بردارید.
    با کودکان هم شدنی است، به شرطی که روی پل تاب‌خور راحت باشند. از خودرو تا خودرو حدود سه ساعت در نظر
    بگیرید و بعدش برنامهٔ فشرده نچینید.
  route: >-
    از تفلیس نخست باید به مستیا برسید — 470 کیلومتر و هشت تا نه ساعت از راه زوگدیدی و تنگهٔ انگوری. از
    مستیا حدود هفت تا نه کیلومتر بالادست درهٔ مستیاچالا تا پارکینگ سرِ مسیر راه است. بخش اول آسفالت است؛
    چند کیلومتر آخر شنی با چاله و جوی‌های کم‌عمق آب. در هوای خشک کراس‌اوور به‌راحتی از پس آن برمی‌آید،
    اما با سواری بهتر است یک کیلومتر زودتر بایستید و پیاده بروید. باک را در مستیا پر کنید، چون در دره
    سوختی نیست. رانندگان محلی هم از مرکز شهر ترانسفر دارند، اگر ترجیح می‌دهید خودروی خودتان را بالا نبرید.
he:
  name: קרחון צ'לאדי
  short: הקרחון הנגיש ביותר ליד מסטיה — נסיעה קצרה במעלה העמק והליכה של שעתיים אל לשון הקרח.
  body: >-
    קרחון צ'לאדי יורד מן הרכס הראשי של הקווקז והוא הקרחון הקל ביותר להגעה ממסטיה. זו הבחירה ההגיונית ליום
    המלא הראשון בסוואנטי: בלי מדריך, בלי ציוד טיפוס ובלי יציאה לפני עלות השחר.


    המסלול פשוט. ממסטיה נוסעים צפונה-מזרחה במעלה עמק מסטיאצ'לה כשבעה קילומטרים, עד מגרש חניה קטן שבו נגמר
    הכביש. משם שביל חוצה את הנהר על גשר תלוי, מטפס ביער לבנה ואלמון, ואז מפלס את דרכו במעלה מורנה קרחונית
    מתפוררת. כשעה לכל כיוון, או עד שלוש שעות בסך הכול עם עצירות וצילומים. הגשר התלוי מעל המסטיאצ'לה מתנדנד
    אך בטוח לחלוטין; היער הצפוף שלגדת הנהר מתחלף בבת אחת בגרוסת סלעים קרחונית חשופה; ולשון הקרח עצמה אפורה-חומה
    מרסק אבנים, ובבסיסה מערות מי הפשרה.


    שמרו על ציפיות מציאותיות. כמו רוב הקרחונים בקווקז, צ'לאדי נסוג, וקצה הקרח נמצא מדי שנה מעט אחורה יותר.
    הטיפוס על הקרח או הכניסה למערות אינם מומלצים בעליל: פני השטח אינם יציבים והתמוטטויות הן דבר שכיח.
    מן המורנה התחתונה הנוף די והותר כדי לתפוס את קנה המידה של הדבר הזה.
  tip: >-
    צאו בבוקר. בדרך כלל הענן ממלא את העמק אחרי הצהריים והגשם בא בעקבותיו. נעלו נעלי הליכה עם אחיזה טובה
    — הקטע האחרון עובר על אבן מתפוררת ובנעלי ספורט הוא לא נעים. קחו מים וחטיף, כי בראש השביל שום דבר אינו
    נמכר באופן קבוע. ליד הקרח הטמפרטורה צונחת, אז קחו מעיל גם ביולי. ההליכה אפשרית עם ילדים אם הם מרגישים
    בנוח על הגשר המתנדנד. הקצו כשלוש שעות מהרכב ובחזרה, ואל תתכננו אחריה שום דבר צמוד.
  route: >-
    מטביליסי צריך קודם כול להגיע למסטיה — 470 ק״מ ושמונה עד תשע שעות דרך זוגדידי וערוץ אנגורי. ממסטיה
    זה עוד כשבעה עד תשעה קילומטרים במעלה עמק מסטיאצ'לה עד חניית ראש השביל. החלק הראשון אספלט; הקילומטרים
    האחרונים הם חצץ עם בורות ותעלות ניקוז רדודות. במזג אוויר יבש קרוסאובר מתמודד בקלות, ואילו עם רכב נמוך
    עדיף לעצור קילומטר קודם וללכת ברגל. תדלקו במסטיה, כי בעמק אין דלק. נהגים מקומיים מפעילים גם הסעות
    ממרכז העיירה, אם אינכם רוצים להעלות לשם את הרכב שלכם.
ar:
  name: نهر تشالادي الجليدي
  short: أيسر نهر جليدي وصولاً قرب ميستيا — قيادة قصيرة صعوداً في الوادي ومشي ساعتين إلى لسان الجليد.
  body: >-
    ينحدر نهر تشالادي الجليدي من السلسلة الرئيسية للقوقاز، وهو أسهل نهر جليدي وصولاً من ميستيا. وهذا ما
    يجعله الخيار المنطقي لأول يوم كامل في سفانيتي: لا مرشد ولا معدات تسلق ولا انطلاق قبل الفجر.


    والطريق مباشر. من ميستيا تقود شمالاً شرقاً صعوداً في وادي مستياتشالا نحو سبعة كيلومترات إلى موقف صغير
    ينتهي عنده الطريق. ومن هناك يعبر درب النهر على جسر معلق، ويصعد في غابة من البتولا والجار، ثم يشق طريقه
    فوق ركام جليدي هش. وهي نحو ساعة في كل اتجاه، أو حتى ثلاث ساعات إجمالاً مع الوقفات والتصوير. الجسر
    المعلق فوق مستياتشالا يتأرجح لكنه آمن تماماً؛ والغابة الكثيفة على ضفة النهر تفسح المجال فجأة لحطام
    جليدي عارٍ؛ ولسان الجليد نفسه رمادي بني بما يحمله من فتات، وفي أسفله كهوف من مياه الذوبان.


    واحتفظ بتوقعات واقعية. فمثل معظم أنهار القوقاز الجليدية، يتراجع تشالادي، وحافة الجليد تنزاح إلى الوراء
    قليلاً كل عام. والصعود على الجليد أو دخول الكهوف مثبَّط بشدة: فالسطح غير مستقر والانهيارات شائعة.
    ومن الركام الأسفل يكفي المنظر وزيادة لإدراك حجم المشهد.
  tip: >-
    انطلق صباحاً. فالسحب تملأ الوادي عادة بعد الظهر ويتبعها المطر. والبس حذاء مشي جيد القبضة — فالمقطع
    الأخير يمر على حجارة سائبة ويكون مزعجاً بحذاء رياضي. واحمل ماءً ووجبة خفيفة، إذ لا شيء يُباع بانتظام
    عند مدخل الدرب. وتهبط الحرارة بحدة عند الجليد، فخذ سترة حتى في يوليو. والمشية ممكنة مع الأطفال إن
    كانوا مرتاحين على الجسر المتأرجح. واحسب نحو ثلاث ساعات من السيارة إلى السيارة، ولا تضع بعدها موعداً
    ضيقاً.
  route: >-
    من تبليسي عليك أولاً الوصول إلى ميستيا — 470 كم وثماني إلى تسع ساعات عبر زوغديدي ومضيق إنغوري. ومن
    ميستيا نحو سبعة إلى تسعة كيلومترات صعوداً في وادي مستياتشالا حتى موقف بداية الدرب. الجزء الأول إسفلت؛
    والكيلومترات الأخيرة حصوية بحفر ومجارٍ ضحلة لتصريف المياه. وفي الطقس الجاف تتعامل معها سيارة كروس
    أوفر بسهولة، أما بسيارة منخفضة فالأفضل التوقف قبل كيلومتر ومواصلة المشي. املأ الخزان في ميستيا، فلا
    وقود في الوادي. ويشغّل سائقون محليون رحلات نقل من وسط البلدة إن كنت تفضل ألا تصعد بسيارتك.
