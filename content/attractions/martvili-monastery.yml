ka:
  name: მარტვილის (ჭყონდიდის) მონასტერი
  short: >-
    გორაზე, სადაც მეგრელები ოდესღაც მუხას სცემდნენ თაყვანს, ჭყონდიდის ტაძარი დგას ჩუქურთმიანი ფრიზებით
    და იმერეთსა და სამეგრელოს გადაჰყურებს.
  body: >-
    **ამ გორაზე ეკლესიამდე მუხა იდგა და, გადმოცემით, ხალხი მას ბავშვებს სწირავდა.** ადგილობრივები მწვერვალზე
    უზარმაზარ წმინდა ხეს იხსენებენ — ნაყოფიერებისა და ოჯახის კეთილდღეობის სალოცავს, სადაც ქურუმები ჩვილებს
    სწირავდნენ. ქრისტიანობის მოსვლისას მუხა მოჭრეს, მის ფესვებზე კი პირველი, ანდრია პირველწოდებულის სახელობის
    ეკლესია აღიმართა. მეგრულად „ჭყონი“ მუხაა — და ადგილის მეორე სახელიც, ჭყონდიდი, სწორედ „დიდ მუხას“
    ნიშნავს.


    ღვთისმშობლის მიძინების გუმბათოვანი ტაძარი VII საუკუნეში აიგო, X საუკუნეში კი აფხაზთა მეფე გიორგი II-მ
    საფუძვლიანად გადააკეთა. გეგმით ის მცხეთის ჯვარს ენათესავება, თუმცა პროპორციები საკუთარი აქვს — შიგნით
    უფრო მსუბუქი და ფართო სივრცე იშლება. გარედან ჩუქურთმიანი ფრიზები შეათვალიერეთ: დანიელი ლომთა ხაროში,
    სამსონი და ლომი, ქრისტეს ამაღლება ოთხი ანგელოზით. შიგნით XIV, XVI და XVII საუკუნეების ფრესკებია შემორჩენილი,
    მათ შორის საუკეთესო — მარტვილის ღვთისმშობელი საკურთხევლის კონქში.


    შუა საუკუნეებში აქ ნამდვილი ძალაუფლება იყო თავმოყრილი. 1103 წლის რუის-ურბნისის კრების შემდეგ ჭყონდიდელი
    ეპისკოპოსი, როგორც წესი, მწიგნობართუხუცესიც იყო — მეფის პირველი ვაზირი. აქაურ მღვდელმთავართა შორის
    ყველაზე სახელოვანი გიორგი ჭყონდიდელია, დავით აღმაშენებლის აღმზრდელი. „ქართლის ცხოვრების“ ცნობით, აქვეა
    დაკრძალული ბაგრატ IV. ტაძრის დასავლეთით ქვის სვეტი დგას: გადმოცემით, მასზე მოწყობილ სენაკში მონასტრის
    უკანასკნელი მესვეტე მოღვაწეობდა.


    საბჭოთა წლებში მიტოვებული მონასტერი 1998 წელს აღორძინდა და დღეს აქ ბერებიც მოღვაწეობენ და მონაზვნებიც.
    მზის ჩასვლისას გალავანთან დადექით: ქვემოთ ცხენისწყლისა და აბაშის ველები იშლება, და მუხის ძველი გორა
    კვლავ სამყაროს შუაგულად გეჩვენებათ.
  tip: >-
    ჩაცმის წესი მკაცრად მოქმედებს: მხრები და მუხლები დაფარული, ქალებს თავსაფარი — მოსასხამები ჭიშკართან,
    როგორც წესი, ხელმისაწვდომია. ადრე მოდით: შუადღისთვის ათი წუთის სავალზე მდებარე მარტვილის კანიონიდან
    ჯგუფები ტალღებად მოდიან. ქალაქიდან ძველი საბჭოთა საბაგირო ადის, მგზავრობა ხურდის ფასია, თუმცა ყოველდღე
    არ მუშაობს; სხვა შემთხვევაში მოკლე მოასფალტებული გზით ზემოთ ადით და მანქანა გალავნის ქვემოთ დატოვეთ.
    გორაზე კაფე არ არის — ისადილეთ მარტვილში, სადაც რამდენიმე კარგი ადგილია. დაუთმეთ საათნახევარი, გალავნიდან
    ხედის ჩათვლით.
  route: >-
    თბილისიდან დაახლოებით 280 კმ და 4 საათი და 15 წუთია. E60 მაგისტრალით დასავლეთისკენ იარეთ — გორის გვერდით,
    რიკოთის უღელტეხილზე, ქუთაისის შემოვლით სამტრედიამდე, შემდეგ აბაშამდე, სადაც მარტვილის გზა ჩრდილოეთით
    უხვევს. ასფალტი ბოლომდე კარგია, ქალაქიდან მონასტრის ჭიშკრამდე კი მოკლე მოასფალტებული სერპენტინი აგიყვანთ.
    საწვავი ქუთაისში ან სამტრედიაში ჩაასხით; მარტვილშიც არის სადგურები. ეკონომ-კლასის ავტომობილი მთელი
    წლის განმავლობაში საკმარისია. მონასტერი მარტვილის კანიონსა და სალხინოსთან ერთად ერთ დაუჩქარებელ დღეში
    მშვენივრად ეტევა.
en:
  name: Martvili (Chkondidi) Monastery
  short: >-
    On the hill where Mingrelians once worshipped an oak, the cathedral of Chkondidi, carved with Daniel
    and his lions, looks out over Imereti and Samegrelo.
  body: >-
    **Before there was a church on this hill there was an oak, and, tradition says, people offered it
    their children.** The local story tells of a giant sacred tree on the summit, a shrine of fertility
    and family fortune where priests sacrificed infants. When Christianity came the oak was felled, and
    the first church, dedicated to St Andrew the First-Called, rose over its roots. The Mingrelian word
    for oak, chkoni, survives in the place's second name: Chkondidi, "great oak".


    The domed cathedral of the Dormition was built in the 7th century and thoroughly rebuilt in the 10th
    under King George II of Abkhazia. Its plan echoes the Jvari church at Mtskheta, but its proportions
    are its own, and the space inside feels lighter and wider. Walk round the outside for the carved friezes:
    Daniel in the lions' den, Samson and the lion, Christ's Ascension borne by four angels. Inside, frescoes
    of the 14th, 16th and 17th centuries survive; the finest is the Virgin of Martvili in the conch of
    the apse.


    In the Middle Ages this hill held real power. After the Ruisi-Urbnisi council of 1103, the bishop
    of Chkondidi usually also served as mtsignobartukhutsesi, the king's first minister. The most famous
    of them, Giorgi Chkondideli, was tutor to David the Builder, and the chronicle Kartlis Tskhovreba
    says King Bagrat IV lies buried here. West of the church stands a stone pillar; tradition says the
    monastery's last stylite lived in a cell on top.


    Abandoned in the Soviet years, the monastery revived in 1998 and now houses both monks and nuns. Stand
    by the wall at sunset: the valleys of the Tskhenistskali and the Abasha open below, and the old oak
    hill still feels like the centre of the world.
  tip: >-
    The dress code is enforced: shoulders and knees covered, headscarves for women — wraps are usually
    available at the gate. Come early: by midday, groups from Martvili Canyon, ten minutes away, arrive
    in waves. An old Soviet cable car climbs from the town for a few coins, but it does not run every
    day; otherwise drive the short paved road to the top and park below the walls. There is no café on
    the hill — eat in Martvili, which has a few good places. Allow an hour and a half, including time
    at the wall for the view.
  route: >-
    About 280 km and 4 hours 15 minutes from Tbilisi. Take the E60 motorway west past Gori, over the Rikoti
    Pass and round Kutaisi to Samtredia, then on to Abasha, where the Martvili road turns north. The asphalt
    is good all the way, and a short paved serpentine lifts you from the town to the monastery gate. Refuel
    in Kutaisi or Samtredia; Martvili has stations too. An economy car is enough all year. The monastery
    pairs naturally with Martvili Canyon and Salkhino for a full, unhurried day.
ru:
  name: Мартвильский монастырь (Чкондиди)
  short: >-
    На холме, где мегрелы некогда поклонялись дубу, собор Чкондиди с резным Даниилом среди львов смотрит
    на Имерети и Самегрело.
  body: >-
    **Прежде чем на этом холме появилась церковь, здесь стоял дуб, и, по преданию, люди приносили ему
    в жертву своих детей.** Местные рассказывают об огромном священном дереве на вершине — святилище плодородия
    и семейного благополучия, где жрецы приносили в жертву младенцев. С приходом христианства дуб срубили,
    и над его корнями поднялась первая церковь, освящённая во имя святого Андрея Первозванного. Мегрельское
    слово «чкони» — дуб — живёт во втором имени этого места: Чкондиди, «великий дуб».


    Купольный собор Успения Богородицы построили в VII веке и основательно перестроили в X веке при абхазском
    царе Георгии II. Его план перекликается с храмом Джвари в Мцхете, но пропорции у него свои, и пространство
    внутри кажется легче и шире. Обойдите храм снаружи, чтобы рассмотреть резные фризы: Даниил во рву
    львином, Самсон со львом, Вознесение Христово, где Спасителя несут четыре ангела. Внутри сохранились
    фрески XIV, XVI и XVII веков; лучшая из них — Мартвильская Богоматерь в конхе апсиды.


    В Средние века этот холм был средоточием настоящей власти. После Руис-Урбнисского собора 1103 года
    епископ Чкондидский, как правило, был одновременно и мцигнобартухуцеси — первым министром царя. Самый
    знаменитый из них, Георгий Чкондидели, был наставником Давида Строителя, а летопись «Картлис цховреба»
    сообщает, что здесь похоронен царь Баграт IV. К западу от церкви стоит каменный столп; по преданию,
    в келье на его вершине жил последний столпник монастыря.


    Заброшенный в советские годы, монастырь возродился в 1998 году, и теперь здесь живут и монахи, и монахини.
    Встаньте у ограды на закате: внизу открываются долины Цхенисцкали и Абаши, и старый дубовый холм по-прежнему
    кажется центром мира.
  tip: >-
    Дресс-код здесь соблюдают строго: плечи и колени закрыты, женщинам — платок; накидки обычно можно
    взять у ворот. Приезжайте пораньше: к полудню волнами накатывают группы из Мартвильского каньона,
    до которого десять минут езды. Из города за несколько монет наверх поднимается старая советская канатная
    дорога, но работает она не каждый день; в остальные дни поднимитесь на машине по короткой асфальтовой
    дороге и оставьте её под стенами. Кафе на холме нет — поешьте в Мартвили, там есть несколько хороших
    мест. Заложите полтора часа, включая время у ограды ради вида.
  route: >-
    Около 280 км и 4 часа 15 минут от Тбилиси. Езжайте по автомагистрали E60 на запад мимо Гори, через
    Рикотский перевал и в объезд Кутаиси до Самтредиа, затем до Абаши, где дорога на Мартвили уходит на
    север. Асфальт хороший на всём пути, а короткий асфальтированный серпантин поднимает от города прямо
    к воротам монастыря. Заправьтесь в Кутаиси или Самтредиа; в Мартвили тоже есть заправки. Машины эконом-класса
    хватит круглый год. Монастырь естественно сочетается с Мартвильским каньоном и Салхино — выходит полный
    и неспешный день.
fa:
  name: صومعهٔ مارتویلی (چکوندیدی)
  short: >-
    بر تپه‌ای که روزگاری مگرل‌ها بلوطی را می‌پرستیدند، کلیسای جامع چکوندیدی با نقش برجستهٔ دانیال و شیرانش
    بر ایمرتی و سامگرلو می‌نگرد.
  body: >-
    **پیش از آنکه بر این تپه کلیسایی باشد، بلوطی بود و به روایت سنت، مردم فرزندانشان را پیشکشش می‌کردند.**
    داستان محلی از درختی مقدس و غول‌آسا بر ستیغ تپه یاد می‌کند — زیارتگاه باروری و بخت خانواده — که کاهنان
    در آن نوزادان را قربانی می‌کردند. با آمدن مسیحیت بلوط را بریدند و نخستین کلیسا، به نام قدیس آندریاس
    نخستین‌فراخوانده، بر ریشه‌هایش برپا شد. واژهٔ مگرلی بلوط، «چکونی»، در نام دوم این مکان زنده مانده
    است: چکوندیدی، یعنی «بلوط بزرگ».


    کلیسای جامع گنبددار خفتن مریم مقدس در سدهٔ هفتم ساخته شد و در سدهٔ دهم، در روزگار گئورگی دوم، پادشاه
    آبخازیا، از بنیاد بازسازی شد. نقشه‌اش یادآور کلیسای جواری در متسختاست، اما تناسب‌هایش از آن خود اوست
    و فضای درونش سبک‌تر و گشاده‌تر می‌نماید. گرداگرد بیرون بنا قدم بزنید تا نقش‌برجسته‌های کنده‌کاری‌شده
    را ببینید: دانیال در چاه شیران، شمشون و شیر، و عروج مسیح که چهار فرشته او را بر دست می‌برند. در درون،
    نقاشی‌های دیواری سده‌های چهاردهم، شانزدهم و هفدهم بر جای مانده است؛ زیباترینشان مریم مارتویلی در نیم‌گنبد
    محراب است.


    در سده‌های میانه این تپه کانون قدرتی واقعی بود. پس از شورای روئیسی-اوربنیسی در ۱۱۰۳، اسقف چکوندیدی
    معمولاً متسیگنوبارتوخوتسسی، یعنی وزیر اول پادشاه، هم بود. نامدارترین آنان، گیورگی چکوندیدلی، آموزگار
    داوود سازنده بود، و وقایع‌نامهٔ «کارتلیس تسخووربا» می‌گوید پادشاه باگرات چهارم اینجا به خاک سپرده
    شده است. در غرب کلیسا ستونی سنگی ایستاده است؛ به روایت سنت، آخرین ستون‌نشین صومعه در حجره‌ای بر فراز
    آن می‌زیست.


    صومعه که در سال‌های شوروی متروک مانده بود، در ۱۹۹۸ دوباره جان گرفت و اکنون هم راهبان و هم راهبه‌ها
    در آن زندگی می‌کنند. هنگام غروب کنار دیوار بایستید: دره‌های تسخنیستسقالی و آباشا زیر پایتان گشوده
    می‌شوند و تپهٔ کهن بلوط هنوز همچون مرکز جهان به نظر می‌رسد.
  tip: >-
    رعایت پوشش را جدی می‌گیرند: شانه‌ها و زانوها پوشیده و برای بانوان روسری — معمولاً کنار دروازه شال
    و پوشش قرضی هست. زود بیایید: تا ظهر گروه‌ها موج‌موج از کانیون مارتویلی، که ده دقیقه راه است، از راه
    می‌رسند. تله‌کابینی قدیمی از دوران شوروی با چند سکه از شهر بالا می‌رود، اما هر روز کار نمی‌کند؛ وگرنه
    جادهٔ کوتاه آسفالته را تا بالا برانید و زیر دیوارها پارک کنید. روی تپه کافه‌ای نیست — در مارتویلی
    غذا بخورید که چند جای خوب دارد. یک ساعت و نیم وقت بگذارید، با فرصتی کنار دیوار برای تماشای منظره.
  route: >-
    از تفلیس حدود ۲۸۰ کیلومتر و ۴ ساعت و ۱۵ دقیقه راه است. بزرگراه E60 را به سوی غرب بگیرید، از کنار گوری
    و از گردنهٔ ریکوتی بگذرید و کوتائیسی را دور بزنید تا سامتردیا، سپس تا آباشا ادامه دهید که جادهٔ مارتویلی
    از آنجا به شمال می‌پیچد. آسفالت سراسر راه خوب است و جاده‌ای کوتاه، پیچاپیچ و آسفالته شما را از شهر
    تا دروازهٔ صومعه بالا می‌برد. در کوتائیسی یا سامتردیا سوخت بزنید؛ مارتویلی هم پمپ‌بنزین دارد. خودروی
    اقتصادی در تمام سال کافی است. صومعه با کانیون مارتویلی و سالخینو یک روز کامل و بی‌شتاب می‌سازد.
he:
  name: מנזר מרטווילי (צ'קונדידי)
  short: >-
    על הגבעה שבה סגדו פעם המגרלים לעץ אלון, קתדרלת צ'קונדידי, שעליה מגולף דניאל בין האריות, משקיפה על
    אימרתי ועל סמגרלו.
  body: >-
    **לפני שעמדה על הגבעה הזאת כנסייה עמד עליה אלון, ולפי האגדה, אנשים הקריבו לו את ילדיהם.** המסורת המקומית
    זוכרת עץ קדוש ענק על הפסגה, מקדש של פריון ושל מזל המשפחה, שבו כוהנים הקריבו תינוקות. כשהגיעה הנצרות
    נכרת האלון, והכנסייה הראשונה, שהוקדשה לאנדראס הקדוש "הנקרא ראשון", קמה מעל שורשיו. המילה המגרלית לאלון,
    "צ'קוני", השתמרה בשמו השני של המקום: צ'קונדידי, "האלון הגדול".


    קתדרלת הדורמיציון (הירדמותה של מרים), בעלת הכיפה, נבנתה במאה ה-7 ונבנתה מחדש ביסודיות במאה ה-10, בימי
    גיורגי השני, מלך אבחזיה. תוכניתה מהדהדת את כנסיית ג'וארי שבמצחתה, אך הפרופורציות שלה משלה, והחלל הפנימי
    נראה קל ורחב יותר. הקיפו אותה מבחוץ כדי לראות את האפריזים המגולפים: דניאל בגוב האריות, שמשון והאריה,
    ועליית ישו השמיימה כשארבעה מלאכים נושאים אותו. בפנים שרדו ציורי קיר מהמאות ה-14, ה-16 וה-17; היפה
    שבהם הוא הבתולה של מרטווילי בקונכיית האפסיס.


    בימי הביניים ישב על הגבעה הזאת כוח של ממש. אחרי מועצת רואיסי-אורבניסי ב-1103 כיהן הבישוף של צ'קונדידי
    בדרך כלל גם כמציגנוברטוחוצסי – השר הראשון של המלך. המפורסם שבהם, גיורגי צ'קונדידלי, היה מורו של דוד
    הבונה, והכרוניקה "קרתליס צחוברבה" מספרת שהמלך בגרט הרביעי קבור כאן. ממערב לכנסייה ניצב עמוד אבן; לפי
    המסורת, הסטיליט האחרון של המנזר – נזיר שחי על עמוד – התגורר בתא שבראשו.


    המנזר, שננטש בשנים הסובייטיות, קם לתחייה ב-1998, וכיום חיים בו נזירים ונזירות כאחד. עמדו ליד החומה
    בשקיעה: עמקי הצחניסצקלי והאבאשה נפרשים למטה, וגבעת האלון העתיקה עדיין נדמית כמרכז העולם.
  tip: >-
    כללי הלבוש נאכפים: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש – בדרך כלל אפשר לקבל בשער בד להתעטף בו.
    בואו מוקדם: עד הצהריים מגיעות בגלים קבוצות מקניון מרטווילי, שנמצא עשר דקות נסיעה משם. רכבל סובייטי
    ישן עולה מהעיר תמורת כמה מטבעות, אבל הוא לא פועל כל יום; אחרת סעו בדרך הסלולה הקצרה עד למעלה וחנו
    מתחת לחומות. אין בית קפה על הגבעה – אכלו במרטווילי, שיש בה כמה מקומות טובים. הקדישו שעה וחצי, כולל
    זמן ליד החומה בשביל הנוף.
  route: >-
    כ-280 ק"מ ו-4 שעות ו-15 דקות מטביליסי. סעו מערבה בכביש המהיר E60 על פני גורי, דרך מעבר ריקוטי וסביב
    קוטאיסי עד סמטרדיה, ומשם לאבאשה, שבה הכביש למרטווילי פונה צפונה. האספלט טוב לאורך כל הדרך, ודרך מתפתלת
    קצרה וסלולה מעלה אתכם מהעיר עד שער המנזר. תדלקו בקוטאיסי או בסמטרדיה; גם במרטווילי יש תחנות דלק. רכב
    אקונומי מספיק כל השנה. המנזר משתלב באופן טבעי עם קניון מרטווילי ועם סלחינו ליום מלא ונינוח.
ar:
  name: دير مارتفيلي (تشكونديدي)
  short: >-
    على التلة التي عبد فيها الميغريليون يومًا شجرة بلوط، تطلّ كاتدرائية تشكونديدي، بنقش دانيال بين أسوده،
    على إيميريتي وساميغريلو.
  body: >-
    **قبل أن تقوم على هذه التلة كنيسة، كانت عليها شجرة بلوط، ويُروى أن الناس كانوا يقدّمون لها أطفالهم
    قرابين.** تحفظ الرواية المحلية ذكرى شجرة مقدسة عملاقة على القمة، كانت مزارًا للخصوبة وحظ الأسرة، يقدّم
    فيه الكهنة الرُّضّع قرابين. ومع مجيء المسيحية قُطعت الشجرة، وقامت فوق جذورها الكنيسة الأولى المكرّسة
    للقديس أندراوس المدعو أولًا. وما زالت الكلمة الميغريلية للبلوط، «تشكوني»، حيّة في الاسم الثاني للمكان:
    تشكونديدي، أي «البلوطة العظيمة».


    بُنيت كاتدرائية رقاد السيدة العذراء ذات القبة في القرن السابع، وأُعيد بناؤها جذريًا في القرن العاشر
    في عهد غيورغي الثاني ملك أبخازيا. يذكّر مخططها بكنيسة جفاري في متسخيتا، لكن لها نِسَبها الخاصة، ويبدو
    فضاؤها الداخلي أخفّ وأرحب. طُف حولها من الخارج لتتأمل الأفاريز المنحوتة: دانيال في جبّ الأسود، وشمشون
    والأسد، وصعود المسيح تحمله أربعة ملائكة. وفي الداخل بقيت رسوم جدارية من القرون الرابع عشر والسادس
    عشر والسابع عشر، أروعها «عذراء مارتفيلي» في محارة الحنية.


    في العصور الوسطى كانت هذه التلة مركز سلطة حقيقية. فبعد مجمع رويسي-أوربنيسي عام 1103 صار أسقف تشكونديدي
    في العادة يشغل أيضًا منصب «متسيغنوبارتوخوتسيسي»، أي الوزير الأول للملك. وأشهرهم، غيورغي تشكونديديلي،
    كان مؤدّب داود البنّاء، وتذكر حولية «كارتليس تسخوفريبا» أن الملك باغرات الرابع مدفون هنا. وإلى الغرب
    من الكنيسة يقوم عمود حجري، تقول الرواية إن آخر النسّاك العموديين في الدير عاش في صومعة على قمته.


    هُجر الدير في السنوات السوفييتية، ثم انبعث عام 1998، ويقيم فيه اليوم رهبان وراهبات معًا. قف عند السور
    ساعة الغروب: ينفتح تحتك واديا تسخينيستسكالي وأباشا، وما زالت تلة البلوط القديمة تبدو كأنها مركز العالم.
  tip: >-
    قواعد اللباس مطبّقة بصرامة: الكتفان والركبتان مغطّيتان، وغطاء رأس للنساء — وعادةً ما تتوفر أوشحة عند
    البوابة. تعالَ باكرًا: فبحلول الظهيرة تتوافد موجات من المجموعات القادمة من أخدود مارتفيلي الذي يبعد
    عشر دقائق. يصعد تلفريك سوفييتي قديم من البلدة مقابل بضع قطع نقدية، لكنه لا يعمل كل يوم؛ وإلا فاصعد
    بالسيارة عبر الطريق المعبّد القصير إلى القمة واركن تحت الأسوار. لا مقهى على التلة — تناول طعامك في
    مارتفيلي ففيها بضعة أماكن جيدة. خصّص ساعة ونصفًا، بما في ذلك وقت عند السور للتمتع بالمنظر.
  route: >-
    نحو 280 كم و4 ساعات و15 دقيقة من تبليسي. اسلك الطريق السريع E60 غربًا مرورًا بغوري وعبر ممر ريكوتي
    وحول كوتايسي حتى سامتريديا، ثم إلى أباشا حيث يتفرّع طريق مارتفيلي شمالًا. الإسفلت جيد طوال الطريق،
    ويصعد بك طريق متعرّج قصير معبّد من البلدة إلى بوابة الدير. تزوّد بالوقود في كوتايسي أو سامتريديا،
    وفي مارتفيلي محطات أيضًا. تكفي سيارة اقتصادية طوال العام. ويقترن الدير على نحو طبيعي بأخدود مارتفيلي
    وسالخينو ليوم كامل على مهل.
