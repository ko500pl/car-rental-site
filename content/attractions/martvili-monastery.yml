ka:
  name: მარტვილის (ჭყონდიდის) მონასტერი
  short: >-
    VII საუკუნეში დაარსებული სამონასტრო კომპლექსი მარტვილის გორაზე — სამეგრელოს სულიერი ცენტრი, საბჭოთა
    საბაგიროთი და მესვეტის სვეტით.
  body: >-
    **მარტვილის მონასტერი იმ გორაზე დგას, სადაც ოდესღაც წარმართები უზარმაზარ მუხას სცემდნენ თაყვანს**
    — მეგრულად "ჭყონი" მუხაა და აქედან მოდის კომპლექსის მეორე სახელი, ჭყონდიდი. ქრისტიანობის გავრცელების
    შემდეგ, VII საუკუნის ბოლოს, აქ ანდრია პირველწოდებულის სახელობის ეკლესია აშენდა, ხოლო X საუკუნეში დღევანდელი
    გუმბათოვანი ტაძარი აღიმართა.


    შუა საუკუნეებში ჭყონდიდი უბრალო ეპარქიაზე მეტი იყო: ჭყონდიდელი ეპისკოპოსი ერთიანი საქართველოს სამეფოში
    მწიგნობართუხუცესის — ფაქტობრივად, პირველი ვეზირის — თანამდებობას ითავსებდა. ტაძრის შიგნით XIV–XVII
    საუკუნეების ფრესკებია, ძველი აღთქმის იშვიათი სცენებით. მთავარი ეკლესიის დასავლეთით ქვის სვეტი დგას
    — გადმოცემით, მასზე მოწყობილ სენაკში უკანასკნელი მესვეტე ბერი მოღვაწეობდა, კატსხის სვეტის მსგავსი
    ასკეტური ტრადიციის კვალი.


    ცალკე ატრაქციონია გზა: მარტვილის ქუჩიდან გორაზე საბჭოთა დროის ერთვაგონიანი საბაგირო ადის — მგზავრობა
    ლარამდე ღირს და თავად კაბინა მუზეუმის ექსპონატს ჰგავს. ზემოდან კოლხეთის დაბლობი ჰორიზონტამდე ჩანს.
    კომპლექსი მოქმედია, შესასვლელი უფასო, ეზო კი მარტვილის კანიონიდან ათ წუთშია — ორივე ერთ დღეში ბუნებრივად
    ჯდება.
  tip: >-
    ჩაცმის წესი მკაცრია: მხრები და მუხლები დაფარული, ქალებისთვის თავსაფარი — შესასვლელთან უფასო მოსახვევები
    დევს. საბაგირო ყოველდღე არ მუშაობს, ზემოთ მანქანითაც ადის მოასფალტებული გზა. დილით ტაძარი თითქმის
    ცარიელია, შუადღეს კანიონიდან წამოსული ჯგუფები შემოდიან. ტუალეტი და პატარა მაღაზიები ქალაქშია, გორაზე
    — მხოლოდ მონასტერი.
  route: >-
    თბილისიდან E60 ავტობანით სამტრედიის მიმართულებით, შემდეგ აბაშა–მარტვილის გზით — ჯამში დაახლოებით 280
    კმ და 4:15. ასფალტი ბოლომდე კარგია, მონასტრის გორაზეც მოკლე მოასფალტებული სერპენტინი ადის. ეკონომ-კლასის
    მანქანა მთელი წლის განმავლობაში საკმარისია. საწვავი ქუთაისში ან სამტრედიაში ჩაასხი; მარტვილში ბენზინგასამართიც
    არის და კარგი კაფეებიც.
en:
  name: Martvili (Chkondidi) Monastery
  short: >-
    A monastic complex founded in the 7th century on the hill above Martvili — Samegrelo's spiritual heart,
    with a Soviet cable car and a stylite's pillar.
  body: >-
    **Martvili Monastery stands on the hill where pagans once worshipped a giant oak** — "chkoni" is Megrelian
    for oak, which gave the complex its second name, Chkondidi. After Christianity took hold, a church
    dedicated to St Andrew the First-Called rose here in the late 7th century, and in the 10th century
    the present domed cathedral was built.


    In the Middle Ages Chkondidi was far more than a bishopric: the Chkondideli bishop doubled as the
    mtsignobartukhutsesi of the unified Georgian kingdom — in effect the king's first minister. Inside
    the cathedral survive frescoes of the 14th–17th centuries, including rare Old Testament scenes. West
    of the main church stands a stone pillar: tradition holds that the last stylite monk lived in a cell
    on top of it, a trace of the same ascetic tradition as the Katskhi Pillar.


    Getting up is an attraction in itself: a Soviet-era single-cabin cable car climbs from a Martvili
    street to the hilltop for about a lari, the cabin itself feeling like a museum piece. From the top,
    the Colchis lowland stretches to the horizon. The monastery is active, entry is free, and Martvili
    Canyon is ten minutes away — the two pair naturally into one day.
  tip: >-
    The dress code is enforced: shoulders and knees covered, headscarves for women — free wraps lie at
    the entrance. The cable car does not run every day, but a short paved road also climbs the hill. Mornings
    are nearly empty; around midday the canyon tour groups arrive. Toilets and small shops are down in
    town — on the hill there is only the monastery.
  route: >-
    From Tbilisi take the E60 motorway towards Samtredia, then the Abasha–Martvili road — about 280 km
    and 4 hours 15 in total. Asphalt is good the whole way, and a short paved serpentine climbs the monastery
    hill itself. An economy car is sufficient all year round. Refuel in Kutaisi or Samtredia; Martvili
    also has petrol stations and decent cafés.
ru:
  name: Мартвильский монастырь (Чкондиди)
  short: >-
    Монастырский комплекс VII века на холме над Мартвили — духовное сердце Самегрело с советской канатной
    дорогой и столпом монаха-столпника.
  body: >-
    **Мартвильский монастырь стоит на холме, где язычники когда-то поклонялись гигантскому дубу** — «чкони»
    по-мегрельски «дуб», отсюда второе имя комплекса, Чкондиди. После утверждения христианства здесь в
    конце VII века возвели церковь апостола Андрея Первозванного, а в X веке поднялся нынешний купольный
    собор.


    В Средние века Чкондиди был куда больше, чем епархией: чкондидский епископ совмещал сан с должностью
    мцигнобартухуцеси — фактически первого министра единого Грузинского царства. Внутри собора сохранились
    фрески XIV–XVII веков, включая редкие ветхозаветные сцены. К западу от главного храма стоит каменный
    столп: по преданию, в келье на его вершине жил последний монах-столпник — след той же аскетической
    традиции, что и Кацхийский столп.


    Сам подъём — отдельный аттракцион: с улицы Мартвили на холм ведёт советская однокабинная канатная
    дорога, поездка стоит около лари, а кабина сама похожа на музейный экспонат. Сверху Колхидская низменность
    расстилается до горизонта. Монастырь действующий, вход бесплатный, а Мартвильский каньон в десяти
    минутах — оба места естественно складываются в один день.
  tip: >-
    Дресс-код строгий: плечи и колени закрыты, женщинам — платок; бесплатные накидки лежат у входа. Канатная
    дорога работает не каждый день, но на холм ведёт и короткая асфальтированная дорога. Утром почти безлюдно,
    к полудню приезжают группы из каньона. Туалеты и магазинчики — внизу, в городке; на холме только монастырь.
  route: >-
    Из Тбилиси по автомагистрали E60 в сторону Самтредиа, затем по дороге Абаша–Мартвили — всего около
    280 км и 4:15. Асфальт хорош на всём протяжении, на монастырский холм тоже ведёт короткий асфальтированный
    серпантин. Машины эконом-класса достаточно круглый год. Заправьтесь в Кутаиси или Самтредиа; в Мартвили
    есть и АЗС, и приличные кафе.
fa:
  name: صومعهٔ مارتویلی (چکوندیدی)
  short: >-
    مجموعهٔ رهبانی بنیان‌گذاری‌شده در سدهٔ هفتم بر تپهٔ مشرف به مارتویلی — قلب معنوی سامگرلو، با تله‌کابین
    شوروی و ستون راهب ستون‌نشین.
  body: >-
    **صومعهٔ مارتویلی بر تپه‌ای ایستاده که بت‌پرستان روزگاری بلوطی غول‌آسا را در آن می‌پرستیدند** — «چکونی»
    در زبان مگرلی یعنی بلوط، و نام دوم مجموعه، چکوندیدی، از همین‌جاست. پس از استوار شدن مسیحیت، در اواخر
    سدهٔ هفتم کلیسایی به نام آندریاس قدیس اینجا برپا شد و در سدهٔ دهم کلیسای جامع گنبددار کنونی قد برافراشت.


    در سده‌های میانه چکوندیدی بسیار بیش از یک اسقف‌نشین بود: اسقفِ چکوندیدلی هم‌زمان مقام متسیگنوبارت‌اوخوتسسی
    — عملاً وزیر اول پادشاهی یکپارچهٔ گرجستان — را بر عهده داشت. درون کلیسا دیوارنگاره‌های سده‌های ۱۴
    تا ۱۷ برجاست، از جمله صحنه‌های کمیاب عهد عتیق. در غرب کلیسای اصلی ستونی سنگی ایستاده است: به روایت
    سنت، واپسین راهبِ ستون‌نشین در حجره‌ای بر فراز آن می‌زیست — ردی از همان سنت زاهدانهٔ ستون کاتسخی.


    خودِ بالارفتن هم تفریحی جداگانه است: تله‌کابین تک‌کابینهٔ دوران شوروی از خیابان مارتویلی تا سر تپه
    می‌رود؛ کرایه حدود یک لاری است و خود کابین به شیء موزه‌ای می‌ماند. از بالا جلگهٔ کلخیس تا افق گسترده
    است. صومعه فعال است، ورود رایگان، و درهٔ مارتویلی ده دقیقه فاصله دارد — این دو به‌طبع در یک روز جا
    می‌گیرند.
  tip: >-
    پوشش جدی گرفته می‌شود: شانه‌ها و زانوها پوشیده، برای زنان روسری — شال‌های رایگان کنار در هست. تله‌کابین
    هر روز کار نمی‌کند، اما جادهٔ آسفالت کوتاهی هم تا تپه بالا می‌رود. صبح‌ها تقریباً خلوت است؛ نزدیک
    ظهر گروه‌های تور دره می‌رسند. سرویس بهداشتی و فروشگاه‌های کوچک پایین در شهرند؛ روی تپه فقط صومعه است.
  route: >-
    از تفلیس با آزادراه E60 به سوی سامتردیا، سپس با جادهٔ آباشا–مارتویلی — روی‌هم حدود ۲۸۰ کیلومتر و چهار
    ساعت و ربع. آسفالت سراسر خوب است و پیچ‌راه آسفالتهٔ کوتاهی هم تا تپهٔ صومعه بالا می‌رود. خودروی اقتصادی
    در تمام سال کفایت می‌کند. در کوتائیسی یا سامتردیا بنزین بزنید؛ در مارتویلی هم پمپ بنزین هست و هم کافه‌های
    خوب.
he:
  name: מנזר מרטווילי (צ'קונדידי)
  short: >-
    מכלול נזירי שנוסד במאה השביעית על הגבעה מעל מרטווילי — לבה הרוחני של סמגרלו, עם רכבל סובייטי ועמוד
    של נזיר סטיליט.
  body: >-
    **מנזר מרטווילי עומד על הגבעה שבה עובדי אלילים סגדו פעם לעץ אלון ענק** — "צ'קוני" פירושו אלון במגרלית,
    ומכאן שמו השני של המכלול, צ'קונדידי. לאחר שהנצרות התבססה, נבנתה כאן בסוף המאה השביעית כנסייה על שם
    אנדריאס הקדוש, ובמאה העשירית הוקמה הקתדרלה המכופפת שעומדת עד היום.


    בימי הביניים היה צ'קונדידי הרבה יותר מבישופות: הבישוף הצ'קונדידלי שימש גם כמצינובארטוחוצסי — בפועל,
    השר הראשון של הממלכה הגאורגית המאוחדת. בתוך הקתדרלה שרדו ציורי קיר מהמאות ה-14 עד ה-17, ובהם סצנות
    נדירות מהתנ"ך. ממערב לכנסייה הראשית ניצב עמוד אבן: המסורת מספרת שבתא על ראשו חי הנזיר הסטיליט האחרון
    — שריד לאותה מסורת סגפנית של עמוד קצחי.


    גם העלייה עצמה היא אטרקציה: רכבל סובייטי חד-תאי מטפס מרחוב במרטווילי אל ראש הגבעה תמורת כלארי אחד,
    והתא עצמו נראה כמו מוצג מוזיאוני. מלמעלה נפרשת שפלת קולכיס עד האופק. המנזר פעיל, הכניסה חופשית, וקניון
    מרטווילי במרחק עשר דקות — השניים משתלבים באופן טבעי ליום אחד.
  tip: >-
    קוד הלבוש נאכף: כתפיים וברכיים מכוסות, מטפחת לנשים — כיסויים חינם מונחים בכניסה. הרכבל לא פועל כל
    יום, אבל אל הגבעה עולה גם דרך סלולה קצרה. בבקרים כמעט ריק; סביב הצהריים מגיעות קבוצות מהקניון. שירותים
    וחנויות קטנות נמצאים למטה בעיירה — על הגבעה יש רק את המנזר.
  route: >-
    מטביליסי בכביש המהיר E60 לכיוון סמטרדיה, ואז בדרך אבאשה–מרטווילי — בסך הכול כ-280 ק"מ ו-4:15 שעות.
    האספלט טוב לכל האורך, וגם אל גבעת המנזר מטפסת סרפנטינה סלולה קצרה. רכב חסכוני מספיק כל השנה. תדלקו
    בקוטאיסי או בסמטרדיה; במרטווילי יש גם תחנות דלק וגם בתי קפה סבירים.
ar:
  name: دير مارتفيلي (تشقونديدي)
  short: >-
    مجمع رهباني تأسس في القرن السابع على التلة المطلة على مارتفيلي — القلب الروحي لسامغريلو، مع تلفريك
    سوفييتي وعمود ناسك عمودي.
  body: >-
    **يقوم دير مارتفيلي على التلة التي كان الوثنيون يعبدون فيها سنديانة عملاقة** — «تشقوني» تعني السنديان
    بالمغريلية، ومنها جاء الاسم الثاني للمجمع: تشقونديدي. وبعد رسوخ المسيحية شُيّدت هنا في أواخر القرن
    السابع كنيسة باسم القديس أندراوس، وفي القرن العاشر ارتفعت الكاتدرائية المقببة القائمة اليوم.


    في العصور الوسطى كان تشقونديدي أكثر بكثير من أبرشية: فقد جمع أسقفها بين منصبه ومنصب المتسيغنوبارت‌أوخوتسيسي
    — أي الوزير الأول فعلياً للمملكة الجورجية الموحدة. وداخل الكاتدرائية بقيت جداريات من القرون الرابع
    عشر إلى السابع عشر، بينها مشاهد نادرة من العهد القديم. وغربي الكنيسة الرئيسية يقف عمود حجري تقول التقاليد
    إن آخر الرهبان العموديين عاش في صومعة فوقه — أثر من التقليد الزهدي نفسه الذي يمثله عمود كاتسخي.


    والصعود نفسه متعة مستقلة: تلفريك سوفييتي بمقصورة واحدة يصعد من شارع في مارتفيلي إلى قمة التلة بنحو
    لاري واحد، والمقصورة ذاتها أشبه بقطعة متحفية. ومن الأعلى يمتد سهل كولخيس حتى الأفق. الدير عامر بالرهبان،
    والدخول مجاني، ووادي مارتفيلي على بعد عشر دقائق — ويجتمع الاثنان بطبيعتهما في يوم واحد.
  tip: >-
    قواعد اللباس مطبقة بجدية: الكتفان والركبتان مغطاة، وغطاء رأس للنساء — وثمة لفاعات مجانية عند المدخل.
    لا يعمل التلفريك كل يوم، لكن طريقاً معبّداً قصيراً يصعد التلة أيضاً. الصباح شبه خالٍ؛ وقرب الظهيرة
    تصل مجموعات الوادي السياحية. دورات المياه والمتاجر الصغيرة في البلدة تحت — وعلى التلة الدير وحده.
  route: >-
    من تبليسي عبر الطريق السريع E60 باتجاه سامتريديا، ثم بطريق أباشا–مارتفيلي — نحو 280 كم و4 ساعات وربع
    إجمالاً. الأسفلت جيد على الامتداد كله، ويصعد إلى تلة الدير منعطف معبّد قصير. السيارة الاقتصادية تكفي
    على مدار السنة. تزوّد بالوقود في كوتايسي أو سامتريديا؛ وفي مارتفيلي محطات وقود ومقاهٍ جيدة أيضاً.
