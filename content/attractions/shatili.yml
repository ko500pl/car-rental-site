ka:
  name: შატილი
  short: >-
    სამოცზე მეტი ბანიანი კოშკი, ერთ კედლად შეზრდილი არღუნის ხეობაში, ჩეჩნეთის საზღვართან — ხევსურეთის
    ციხე-სოფელი, რომლისკენაც გზა მხოლოდ ზაფხულობით იხსნება.
  body: >-
    **შატილში ოდესღაც მთელი სოფლის შემოვლა ქუჩაში ჩაუსვლელად შეიძლებოდა: ერთი სახლის ბანი მეორის ეზო იყო,
    კოშკებს შორის კი, შუკების თავზე, ძელის ფიცარნაგები იყო გადებული.**


    სოფელი ზღვის დონიდან დაახლოებით 1400 მეტრზე, არღუნის ღრმა ხეობაში, კავკასიონის ჩრდილოეთ კალთაზე დგას,
    ჩეჩნეთის საზღვართან ახლოს. სამოცზე მეტი კოშკი და ბანიანი ციხე-სახლი, ფიქლით, რიყის ქვითა და ღორღით
    ნაგები, დაახლოებით ერთ ჰექტარზეა შეჯგუფებული, გარე კედლები კი ერთ განუწყვეტელ თავდაცვით ზღუდეს ქმნის.
    საუკუნეების განმავლობაში შატილი ჩრდილოეთიდან შემომავალ გზებს დარაჯობდა; დანარჩენ საქართველოსთან მას
    ადრეც და დღესაც მხოლოდ ხეობაში გამავალი ვიწრო გზა აკავშირებს.


    XX საუკუნემ სოფელი დააცარიელა. 1950-იანი წლების დასაწყისში საბჭოთა ხელისუფლებამ ხევსურეთის მოსახლეობის
    დიდი ნაწილი ბარად ჩაასახლა, 1960-იან წლებში კი მიტოვებულ შუკებს კინემატოგრაფისტები მთიელთა ყოფაზე
    გადაღებული ფილმებისთვის მზა დეკორაციად იყენებდნენ. რესტავრაცია 1970-იან წლებში დაიწყო, 2007 წელს კი
    შატილი იუნესკოს მსოფლიო მემკვიდრეობის წინასწარ სიაში შეიტანეს. 2014 წლის აღწერით აქ 22 ადამიანი ცხოვრობდა
    — რამდენიმე ოჯახი; ზოგიერთი კოშკი ახლა სტუმრებს იღებს.


    სამიოდე კილომეტრში, სადაც არდოტის (ანდაკის) წყალი არღუნს ერთვის, ანატორის ქვის აკლდამები დგას. ადგილობრივი
    გადმოცემით, როცა იქაურ სოფელს ეპიდემია დაატყდა, უხუცესთა საბჭომ წყლის გაღმა ეს სამარხები ააშენებინა,
    სნეულები კი თავად შედიოდნენ შიგ, ფიქლის თახჩებზე წვებოდნენ და სიკვდილს ელოდნენ. შატილიდან არღუნის
    აღმა 11-იოდე კილომეტრში მეორე ციხე-სოფელი, მუცოა.


    ღამე აქ გაათიეთ. შატილი ნამდვილ სახეს მაშინ აჩენს, როცა ხეობა ბნელდება, კოშკები ერთ სილუეტად ერწყმის
    ერთმანეთს და მხოლოდ არღუნიღა ლაპარაკობს.
  tip: >-
    სეზონი მოკლეა: დათვისჯვარი ჩვეულებრივ ოქტომბრიდან გაზაფხულის ბოლომდე თოვლშია, ამიტომ ივნისის შუა რიცხვებიდან
    სექტემბრამდე დაგეგმეთ. ღამისთევა წინასწარ დაჯავშნეთ — საოჯახო სასტუმროები და კოშკ-სასტუმროები ცოტაა,
    აგვისტოში კი ივსება; ზოგი კარავს არღუნის ნაპირზე შლის. ნაღდი ფული საკმარისად წაიღეთ: ბანკომატი არ
    არის, მობილური კავშირი სუსტია ან საერთოდ არ არის. სასაზღვრო ზონაა — პასპორტი თან იქონიეთ. ღამით აგვისტოშიც
    ცივა, თბილი ტანსაცმელი არ დაგავიწყდეთ. ხევსურული ხინკალი კი აუცილებლად გასინჯეთ.
  route: >-
    თბილისიდან სამხედრო გზით (S3/E117) ჟინვალამდე იარეთ — დაახლოებით 53 კმ, შემდეგ შ26-ით არაგვის ხეობას
    ბარისახომდე აუყევით (თბილისიდან 105 კმ), სადაც ასფალტი მთავრდება. ბოლო 48-იოდე კილომეტრი გრუნტის გზაა:
    სერპანტინი დათვისჯვრის უღელტეხილამდე (დაახლოებით 2680 მ), მერე გრძელი, ვიწრო, მოაჯირის გარეშე დაღმართი
    ფხვიერ ქვაზე არღუნის ხეობაში. სულ დაახლოებით 153 კმ; გაითვალისწინეთ ოთხნახევარი საათი, წვიმის შემდეგ
    — მეტი. საჭიროა ნამდვილი, მაღალი კლირენსის 4x4 კარგი საბურავებით — ჩვეულებრივი კროსოვერით წასვლა რისკზე
    თამაშია. საწვავი ჟინვალში ან ბარისახოში ჩაასხით: შატილში ბენზინგასამართი არ არის.
en:
  name: Shatili
  short: >-
    More than sixty flat-roofed towers fused into one wall in the Argun gorge near the Chechen border
    — Khevsureti's fortress-village, reachable only in summer.
  body: >-
    **In Shatili you could once cross the whole village without setting foot in the street: one house's
    roof was the next one's yard, and timber walkways ran between the towers above the lanes.**


    The village stands at about 1,400 metres in the deep Argun gorge, on the northern slope of the Greater
    Caucasus, close to the border with Chechnya. More than sixty towers and flat-roofed fortified houses
    of shale, cobble and rubble crowd onto roughly a hectare of rock, their outer walls forming a single
    defensive line. For centuries Shatili guarded the roads coming down from the north; its only link
    with the rest of Georgia was, and still is, the narrow road through the gorge.


    The twentieth century emptied it. In the early 1950s the Soviet authorities moved most of Khevsureti's
    highlanders down to the plains, and in the 1960s film crews used the deserted lanes as a ready-made
    set for films about mountain life. Restoration began in the 1970s, and in 2007 Shatili went onto Georgia's
    UNESCO tentative list. The 2014 census counted 22 residents — a handful of families — and several
    towers now take in guests.


    Three kilometres away, where the Ardoti (Andaki) stream meets the Argun, stand the stone crypts of
    Anatori. Local tradition says that when an epidemic struck the village there, the council of elders
    had these vaults built across the water, and the sick walked in, lay down on the slate benches and
    waited for death. Mutso, a second fortress-village, lies about 11 km from Shatili, further up the
    Argun.


    Stay the night. Shatili shows its true face when the gorge goes dark, the towers merge into one silhouette,
    and only the Argun keeps talking.
  tip: >-
    The season is short: Datvisjvari is usually snowbound from October until late spring, so plan for
    mid-June to September. Book a bed ahead — there are only a few guesthouses and tower hotels, and August
    fills them; some visitors pitch tents on the banks of the Argun. Bring enough cash: there is no ATM,
    and mobile signal is weak or absent. This is a border zone, so carry your passport. Nights are cold
    even in August — pack a warm layer. And try the local Khevsur khinkali.
  route: >-
    From Tbilisi follow the Georgian Military Highway (S3/E117) to Zhinvali, about 53 km, then the Sh26
    up the Aragvi valley to Barisakho, 105 km out, where the asphalt ends. The last 48 km or so are unpaved:
    switchbacks up to the Datvisjvari Pass at about 2,680 m, then a long, narrow, unfenced descent over
    loose rock into the Argun gorge. About 153 km in all; allow four and a half hours, more after rain.
    Take a proper high-clearance 4x4 with good tyres — an ordinary crossover is a gamble. Fill up in Zhinvali
    or Barisakho: there is no fuel in Shatili.
ru:
  name: Шатили
  short: >-
    Больше шестидесяти плоскокрыших башен, сросшихся в одну стену, в Аргунском ущелье у чеченской границы
    — село-крепость Хевсуретии, доступное только летом.
  body: >-
    **Когда-то Шатили можно было пройти из конца в конец, ни разу не ступив на улицу: крыша одного дома
    служила двором другому, а над переулками от башни к башне тянулись деревянные мостки.**


    Село стоит на высоте около 1400 метров в глубоком Аргунском ущелье, на северном склоне Большого Кавказа,
    совсем рядом с границей Чечни. Больше шестидесяти башен и плоскокрыших домов-крепостей из сланца,
    булыжника и бутового камня теснятся примерно на гектаре скалы, и их наружные стены складываются в
    единую оборонительную линию. Веками Шатили стерёг дороги, спускавшиеся с севера; с остальной Грузией
    его связывала — и связывает до сих пор — лишь узкая дорога по ущелью.


    XX век его опустошил. В начале 1950-х советские власти переселили большинство горцев Хевсуретии на
    равнину, а в 1960-х киногруппы снимали в опустевших переулках, как в готовых декорациях, фильмы о
    горской жизни. Реставрация началась в 1970-х, а в 2007 году Грузия внесла Шатили в свой предварительный
    список Всемирного наследия ЮНЕСКО. Перепись 2014 года насчитала 22 жителя — несколько семей; в нескольких
    башнях теперь принимают гостей.


    В трёх километрах, там, где ручей Ардоти (Андаки) впадает в Аргун, стоят каменные склепы Анатори.
    По местному преданию, когда на тамошнее село обрушилась эпидемия, совет старейшин велел построить
    эти склепы за рекой, и больные сами входили в них, ложились на сланцевые лавки и ждали смерти. Муцо,
    второе село-крепость, лежит примерно в 11 км от Шатили, выше по Аргуну.


    Останьтесь на ночь. Настоящее лицо Шатили открывается, когда ущелье погружается во тьму, башни сливаются
    в один силуэт и говорить продолжает только Аргун.
  tip: >-
    Сезон короткий: перевал Датвисджвари обычно засыпан снегом с октября до поздней весны, так что рассчитывайте
    на время с середины июня по сентябрь. Ночлег бронируйте заранее — гостевых домов и башен-гостиниц
    здесь всего несколько, и в августе они заполнены; некоторые ставят палатки на берегу Аргуна. Возьмите
    достаточно наличных: банкомата нет, мобильная связь слабая или её нет вовсе. Это пограничная зона,
    поэтому паспорт держите при себе. Ночи холодные даже в августе — возьмите что-нибудь тёплое. И не
    уезжайте, не попробовав местных хевсурских хинкали.
  route: >-
    Из Тбилиси езжайте по Военно-Грузинской дороге (S3/E117) до Жинвали — около 53 км, затем по Sh26 вверх
    по долине Арагви до Барисахо: здесь, в 105 км от города, кончается асфальт. Последние 48 км или около
    того — грунт: серпантин до перевала Датвисджвари (около 2680 м), затем долгий узкий спуск без ограждений
    по сыпучему камню в Аргунское ущелье. Всего около 153 км; закладывайте четыре с половиной часа, после
    дождя — больше. Нужен настоящий внедорожник 4x4 с высоким клиренсом и хорошей резиной — обычный кроссовер
    здесь лотерея. Заправьтесь в Жинвали или Барисахо: в Шатили топлива нет.
fa:
  name: شاتیلی
  short: >-
    بیش از شصت برج بام‌تخت که در تنگهٔ آرگون، نزدیک مرز چچن، دیواری یکپارچه ساخته‌اند — روستا-دژ خوسورتی
    که تنها تابستان راهش باز است.
  body: >-
    **روزگاری می‌شد سراسر شاتیلی را پیمود بی‌آنکه پا به کوچه گذاشت: بام هر خانه حیاط خانهٔ بعدی بود و
    راهروهای چوبی بر فراز کوچه‌ها برج‌ها را به هم می‌پیوست.**


    روستا در ارتفاع حدود ۱,۴۰۰ متری، در تنگهٔ ژرف آرگون و بر دامنهٔ شمالی قفقاز بزرگ، نزدیک مرز چچن ایستاده
    است. بیش از شصت برج و خانهٔ مستحکم بام‌تخت از سنگ لوح، قلوه‌سنگ و لاشه‌سنگ روی حدود یک هکتار صخره
    تنگ هم نشسته‌اند و دیوارهای بیرونی‌شان یک خط دفاعی یکپارچه می‌سازند. شاتیلی سده‌ها نگهبان راه‌هایی
    بود که از شمال فرود می‌آمدند؛ تنها پیوندش با باقی گرجستان جادهٔ باریک تنگه بود و هنوز هم هست.


    سدهٔ بیستم روستا را خالی کرد. در آغاز دههٔ ۱۹۵۰ مقامات شوروی بیشتر کوه‌نشینان خوسورتی را به دشت کوچاندند،
    و در دههٔ ۱۹۶۰ گروه‌های فیلم‌سازی کوچه‌های متروک را صحنه‌ای آماده برای فیلم‌هایی دربارهٔ زندگی کوهستانی
    کردند. مرمت در دههٔ ۱۹۷۰ آغاز شد و در سال ۲۰۰۷ گرجستان شاتیلی را در فهرست موقت میراث جهانی یونسکو
    گنجاند. سرشماری ۲۰۱۴ تنها ۲۲ ساکن شمرد — چند خانواده — و اکنون چند برج مهمان می‌پذیرند.


    سه کیلومتر آن‌سوتر، جایی که نهر آردوتی (آنداکی) به آرگون می‌ریزد، دخمه‌های سنگی آناتوری برپاست. روایت
    محلی می‌گوید وقتی بیماری همه‌گیر به روستای آنجا افتاد، شورای ریش‌سفیدان دستور داد این سردابه‌ها را
    آن سوی آب بسازند، و بیماران خود به درونشان می‌رفتند، روی سکوهای سنگ لوح دراز می‌کشیدند و چشم به راه
    مرگ می‌ماندند. موتسو، روستا-دژ دیگر، حدود ۱۱ کیلومتر از شاتیلی فاصله دارد، بالاتر در امتداد آرگون.


    شب را بمانید. شاتیلی چهرهٔ راستینش را هنگامی نشان می‌دهد که تنگه تاریک می‌شود، برج‌ها در یک سایه‌نمای
    یگانه در هم می‌روند و تنها آرگون است که همچنان سخن می‌گوید.
  tip: >-
    فصل کوتاه است: گردنهٔ داتویسجواری معمولاً از اکتبر تا اواخر بهار زیر برف است، پس سفر را برای میانهٔ
    ژوئن تا سپتامبر بگذارید. جای خواب را از پیش رزرو کنید — تنها چند مهمانسرا و برج‌هتل هست و در اوت همه
    پر می‌شوند؛ برخی مسافران کنار آرگون چادر می‌زنند. پول نقد کافی همراه داشته باشید: خودپرداز نیست و
    آنتن تلفن همراه ضعیف است یا اصلاً نیست. اینجا منطقهٔ مرزی است، پس گذرنامه همراهتان باشد. شب‌ها حتی
    در اوت سرد است — یک لایه لباس گرم بردارید. و خینکالی محلی خوسوری را از دست ندهید.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (S3/E117) را تا ژینوالی، حدود ۵۳ کیلومتر، بروید و سپس از راه Sh26 درهٔ
    آراگوی را تا باریساخو بالا بروید؛ در این نقطه، ۱۰۵ کیلومتر دورتر از تفلیس، آسفالت تمام می‌شود. حدود
    ۴۸ کیلومتر پایانی خاکی است: پیچ‌های تند تا گردنهٔ داتویسجواری در ارتفاع حدود ۲,۶۸۰ متر، سپس سرازیری‌ای
    طولانی، باریک و بی‌حفاظ روی سنگ‌های لق به درون تنگهٔ آرگون. روی‌هم حدود ۱۵۳ کیلومتر؛ چهار ساعت و نیم
    وقت بگذارید، و پس از باران بیشتر. یک خودروی 4x4 واقعی با فاصلهٔ زیاد از زمین و لاستیک خوب بگیرید —
    کراس‌اوور معمولی قمار است. در ژینوالی یا باریساخو باک را پر کنید: در شاتیلی سوخت نیست.
he:
  name: שאטילי
  short: >-
    יותר משישים מגדלים שטוחי גג שהתמזגו לחומה אחת בערוץ נהר הארגון, סמוך לגבול צ'צ'ניה — כפר-המבצר של
    חבסורתי, שאפשר להגיע אליו רק בקיץ.
  body: >-
    **פעם אפשר היה לחצות את שאטילי מקצה לקצה בלי לרדת לרחוב: הגג של בית אחד היה החצר של הבית הבא, ומעל
    הסמטאות נמתחו גשרונים מעץ בין המגדלים.**


    הכפר ניצב בגובה של כ-1,400 מטר בערוץ העמוק של נהר הארגון, על המדרון הצפוני של הקווקז הגדול, קרוב לגבול
    צ'צ'ניה. יותר משישים מגדלים ובתים מבוצרים שטוחי גג, בנויים מצפחה, מאבני נחל ומאבן גוויל, נדחקים זה
    אל זה על שטח סלעי של כהקטאר אחד, והקירות החיצוניים שלהם יוצרים קו הגנה אחד ורציף. במשך מאות שנים שמר
    שאטילי על הדרכים שירדו מן הצפון; הקשר היחיד שלו עם שאר גאורגיה היה, ועודנו, הדרך הצרה שבערוץ.


    המאה ה-20 רוקנה אותו. בראשית שנות ה-50 העבירו השלטונות הסובייטיים את רוב תושבי ההרים של חבסורתי אל
    המישורים, ובשנות ה-60 השתמשו צוותי קולנוע בסמטאות הנטושות כתפאורה מוכנה לסרטים על חיי ההרים. השיקום
    החל בשנות ה-70, וב-2007 הכניסה גאורגיה את שאטילי לרשימת המועמדים שלה לאתרי מורשת עולמית של אונסק״ו.
    במפקד 2014 נמנו בכפר 22 תושבים — משפחות ספורות — וכמה מן המגדלים משמשים היום לאירוח.


    שלושה קילומטרים משם, במקום שבו נחל ארדוטי (אנדאקי) נשפך אל הארגון, עומדים מבני הקבורה מאבן של אנאטורי.
    לפי המסורת המקומית, כשפרצה מגפה בכפר שהיה שם, ציוותה מועצת הזקנים לבנות את המבנים האלה מעבר למים,
    והחולים נכנסו אליהם, נשכבו על ספסלי הצפחה וחיכו למוות. מוצו, כפר-מבצר נוסף, שוכן כ-11 ק״מ משאטילי,
    במעלה הארגון.


    הישארו ללילה. שאטילי מראה את פניו האמיתיות כשהערוץ מחשיך, המגדלים מתמזגים לצללית אחת, ורק נהר הארגון
    ממשיך לדבר.
  tip: >-
    העונה קצרה: מעבר דטוויסג'ווארי מושלג בדרך כלל מאוקטובר ועד סוף האביב, ולכן תכננו את הביקור בין אמצע
    יוני לספטמבר. הזמינו מקום לינה מראש — יש רק מעט בתי הארחה ומלונות-מגדל, ובאוגוסט הם מלאים; יש מבקרים
    שמקימים אוהל על גדות הארגון. הביאו מספיק מזומן: אין כספומט, והקליטה הסלולרית חלשה או שאינה קיימת כלל.
    זהו אזור גבול, לכן החזיקו את הדרכון בהישג יד. הלילות קרים גם באוגוסט — קחו שכבה חמה. ואל תוותרו על
    החינקלי החבסורי המקומי.
  route: >-
    מטביליסי סעו בדרך הצבא הגאורגית (S3/E117) עד ז'ינוואלי, כ-53 ק״מ, ומשם בכביש Sh26 במעלה עמק האראגווי
    עד בריסאחו, 105 ק״מ מהעיר, שם נגמר האספלט. כ-48 הקילומטרים האחרונים אינם סלולים: סרפנטינות עד מעבר
    דטוויסג'ווארי בגובה של כ-2,680 מטר, ואחריהן ירידה ארוכה וצרה, בלי מעקות, על אבנים רופפות אל ערוץ הארגון.
    בסך הכול כ-153 ק״מ; הקצו ארבע וחצי שעות, ויותר אחרי גשם. קחו רכב 4x4 של ממש, עם מרווח גחון גבוה וצמיגים
    טובים — קרוסאובר רגיל הוא הימור. תדלקו בז'ינוואלי או בבריסאחו: בשאטילי אין דלק.
ar:
  name: شاتيلي
  short: >-
    أكثر من ستين برجاً مسطّح السقف التحمت في جدار واحد بمضيق أرغون قرب الحدود الشيشانية — قرية-حصن خيفسوريتي
    التي لا تُبلغ إلا صيفاً.
  body: >-
    **كان بوسعك يوماً أن تعبر شاتيلي من أولها إلى آخرها دون أن تطأ الشارع: فسطح كل بيت فناءٌ للبيت الذي
    يليه، وممرات خشبية معلّقة فوق الأزقة تصل بين الأبراج.**


    تقوم القرية على ارتفاع نحو 1,400 متر في مضيق أرغون العميق، على السفح الشمالي للقوقاز الكبير، قريباً
    من الحدود مع الشيشان. أكثر من ستين برجاً وبيتاً محصّناً مسطّح السقف، من الأردواز والحجارة النهرية
    والدبش، تتزاحم على نحو هكتار من الصخر، وتؤلّف جدرانها الخارجية خطاً دفاعياً واحداً. حرست شاتيلي قروناً
    الطرقَ النازلة من الشمال، ولم يكن يصلها ببقية جورجيا — ولا يزال — سوى الطريق الضيق عبر المضيق.


    أفرغها القرن العشرون. ففي مطلع الخمسينيات نقلت السلطات السوفييتية معظم جبليّي خيفسوريتي إلى السهول،
    وفي الستينيات اتخذت فرق التصوير أزقتها المهجورة ديكوراً جاهزاً لأفلام عن حياة الجبل. بدأ الترميم في
    السبعينيات، وفي عام 2007 أدرجت جورجيا شاتيلي في قائمتها التمهيدية للتراث العالمي لدى اليونسكو. وأحصى
    تعداد 2014 فيها 22 ساكناً — بضع عائلات — وباتت عدة أبراج تستقبل الضيوف.


    على بعد ثلاثة كيلومترات، حيث يصبّ جدول أردوتي (أنداكي) في نهر أرغون، تقوم مدافن أناتوري الحجرية. تقول
    الرواية المحلية إن وباءً حلّ بالقرية التي كانت هناك، فأمر مجلس كبار القرية ببناء هذه الأقبية عبر الماء،
    فكان المرضى يدخلونها بأنفسهم ويستلقون على مصاطب الأردواز منتظرين الموت. وعلى بعد نحو 11 كم من شاتيلي،
    صعوداً مع مجرى أرغون، تقع موتسو، قرية-حصن ثانية.


    ابقَ ليلتك هنا. فشاتيلي لا تُظهر وجهها الحقيقي إلا حين يعتم المضيق، وتذوب الأبراج في ظلّ واحد، ولا
    يبقى متكلماً سوى نهر أرغون.
  tip: >-
    الموسم قصير: فممر داتفيسجفاري يغمره الثلج عادةً من أكتوبر حتى أواخر الربيع، فخطّط لزيارتك بين منتصف
    يونيو وسبتمبر. احجز مكان مبيتك مسبقاً — فليس هناك سوى قليل من بيوت الضيافة وفنادق الأبراج، وتمتلئ
    كلها في أغسطس؛ وبعض الزوار ينصبون خيامهم على ضفاف أرغون. احمل ما يكفي من النقد: لا صراف آلياً، وإشارة
    الهاتف ضعيفة أو معدومة. وهذه منطقة حدودية، فأبقِ جواز سفرك معك. والليالي باردة حتى في أغسطس — فخذ
    ملابس دافئة. ولا تفوّت الخينكالي الخيفسوري المحلي.
  route: >-
    من تبليسي اتبع الطريق العسكري الجورجي (S3/E117) حتى جينفالي، نحو 53 كم، ثم الطريق Sh26 صعوداً في وادي
    أراغفي حتى باريساخو، على بعد 105 كم من المدينة، حيث ينتهي الإسفلت. أما الـ48 كم الأخيرة تقريباً فغير
    معبّدة: منعطفات متعرجة حتى ممر داتفيسجفاري على ارتفاع نحو 2,680 م، ثم نزول طويل ضيق بلا حواجز فوق
    صخور سائبة إلى مضيق أرغون. المجموع نحو 153 كم؛ خصّص أربع ساعات ونصفاً، وأكثر بعد المطر. خذ سيارة دفع
    رباعي 4x4 حقيقية، عالية الخلوص الأرضي وبإطارات جيدة — فالكروس أوفر العادية مجازفة. املأ الخزان في
    جينفالي أو باريساخو: لا وقود في شاتيلي.
