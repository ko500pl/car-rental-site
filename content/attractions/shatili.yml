ka:
  name: შატილი
  short: ხევსურეთის ქვის ციხე-სოფელი ჩეჩნეთის საზღვართან — ერთ-ერთი ყველაზე შთამბეჭდავი ადგილი კავკასიაში.
  body: >-
    **შატილი ცალკეული სახლების ერთობა კი არა, ერთი შეზრდილი ორგანიზმია.** ხევსურეთის ჩრდილოეთ კიდეზე,
    არღუნის ხეობაში, კლდის ფერდობზე ერთმანეთზეა მიშენებული ორმოცდაათამდე ქვის კოშკი და საცხოვრებელი. ისინი
    ტერასულად ადის ზემოთ, გადადის ერთმანეთის სახურავებში და ერთად ქმნის განუყოფელ თავდაცვით სისტემას —
    შუა საუკუნეებში აქ მთელი სოფელი ერთი ციხე იყო.


    ნაგებობები ძირითადად IX–XIII საუკუნეებით თარიღდება. ხევსურები საუკუნეების განმავლობაში ჩრდილოეთიდან
    შემოსევებს იგერიებდნენ და შატილი ამ საზღვრის ბოლო წერტილი იყო. 1950-იან წლებში მოსახლეობა იძულებით
    გადაასახლეს ბარში; დღეს სოფელი ნაწილობრივ დასახლებულია, ზოგიერთი კოშკი სასტუმროდაა გადაკეთებული.


    შატილის მიდამოებში:


    - **ანატორის აკლდამები** — 3 კმ-ში, ქვის სამარხები, სადაც შავი ჭირის დროს ავადმყოფები თავად შედიოდნენ
    მოსაკვდავად

    - **მუცოს ციხე-სოფელი** — შატილიდან 12 კმ, კიდევ უფრო ველური და თითქმის მიტოვებული

    - **არღუნის ხეობა** — ვიწრო, ღრმა, სასაზღვრო ზონა


    ეს საქართველოს ერთ-ერთი ყველაზე შორეული ხელმისაწვდომი წერტილია და ღამის გათევა ადგილზე თითქმის სავალდებულოა
    — ერთ დღეში მისვლა და დაბრუნება ძალიან მძიმეა როგორც მძღოლისთვის, ისე მანქანისთვის.


    ხევსურეთის კულტურა ცალკე მსოფლიოა: აქ XX საუკუნის დასაწყისამდე შემორჩა ჯავშანი, ხმალი და სისხლის აღების
    წესი, ქალის ქსოვილზე კი ჯვრებიანი ორნამენტი დღემდე იკერება. ადგილობრივი გესთჰაუზების მასპინძლები ხშირად
    თავად ჰყვებიან ამ ისტორიებს ვახშმის დროს — და სწორედ ეს, და არა მხოლოდ ქვის კოშკები, ხდის შატილში
    ჩასვლას ღირებულს.
  tip: >-
    სეზონი მოკლეა: ივნისის შუიდან სექტემბრის ბოლომდე, დათვიჯვრის უღელტეხილი (2676 მ) დანარჩენ დროს თოვლითაა
    დახურული. ღამისთევა წინასწარ დაჯავშნე — შატილში რამდენიმე გესთჰაუზია და ისინი აგვისტოში ივსება. კავშირი
    პრაქტიკულად არ არის, ბანკომატი არ არსებობს, ნაღდი ფული აუცილებლად თან იქონიე. სასაზღვრო ზონაა: პასპორტი
    აუცილებელია. თბილი ტანსაცმელი აგვისტოშიც — ღამით 5–8 გრადუსია.
  route: >-
    თბილისიდან სამხედრო გზით ჟინვალამდე, შემდეგ მარჯვნივ ბარისახოსკენ არაგვის ხეობაში. ბარისახომდე ასფალტია;
    შემდეგ იწყება დაახლოებით 60 კმ გრუნტის გზა დათვიჯვრის უღელტეხილზე გავლით — ვიწრო, უმოაჯირო, ციცაბო
    თავდაღმართებით და ბევრი ქვით. სულ 155 კმ და მინიმუმ ოთხნახევარი საათი, წვიმის შემდეგ მეტიც. აქ მხოლოდ
    სრულფასოვანი 4x4 გამოდგება, კარგი საბურავებით; ჩვეულებრივი კროსოვერიც კი რისკია. საწვავი ბოლოს ჟინვალში
    ან ბარისახოში აიღე — შატილში საწვავის სადგური არ არის.
en:
  name: Shatili
  short: >-
    A stone fortress-village in Khevsureti on the Chechen border — one of the most striking places in
    the Caucasus.
  body: >-
    **Shatili is not a collection of houses but a single grown organism.** On the northern edge of Khevsureti,
    in the Arghuni gorge, some fifty stone towers and dwellings are built into and onto each other on
    a steep slope. They rise in terraces, one roof serving as another's yard, and together they form an
    indivisible defensive system: in the Middle Ages the entire village was one fortress.


    Most of the structures date from the 9th to the 13th century. For centuries the Khevsurs held this
    frontier against raids from the north, and Shatili was its last outpost. In the 1950s the population
    was forcibly resettled to the lowlands; today the village is partly inhabited again and several towers
    have been converted into guesthouses.


    Around Shatili:


    - The **Anatori crypts**, 3 km away, stone tombs where plague victims are said to have walked in to
    die rather than infect the village

    - **Mutso**, another fortress-village 12 km further on, wilder and almost entirely abandoned

    - The **Arghuni gorge** itself, narrow, deep and within the border zone


    This is one of the remotest places in Georgia that you can still drive to, and staying overnight is
    close to obligatory: doing it as a day trip from Tbilisi is punishing.
  tip: >-
    The season is short — mid-June to late September, since the Datvijvari Pass at 2,676 m is snowbound
    the rest of the year. Book accommodation ahead: Shatili has only a handful of guesthouses and they
    fill in August. There is essentially no mobile signal and no ATM, so bring cash. It is a border zone,
    so a passport is required. Pack warm clothing even in August, when nights drop to five or eight degrees.
  route: >-
    From Tbilisi take the Military Highway to Zhinvali, then turn right towards Barisakho up the Aragvi
    valley. Asphalt continues to Barisakho; after that comes roughly 60 km of gravel over the Datvijvari
    Pass — narrow, unbarriered, with steep descents and loose rock. In total 155 km and at least four
    and a half hours, more after rain. Only a proper 4x4 with good tyres belongs on this road; an ordinary
    crossover is a gamble. Take your last fuel at Zhinvali or Barisakho, as there is no station in Shatili.
ru:
  name: Шатили
  short: Каменное село-крепость в Хевсуретии у чеченской границы — одно из самых сильных мест на Кавказе.
  body: >-
    **Шатили — не набор домов, а единый сросшийся организм.** На северном краю Хевсуретии, в Аргунском
    ущелье, около полусотни каменных башен и жилищ встроены друг в друга на крутом склоне. Они поднимаются
    террасами, крыша одного дома служит двором другому, и вместе они образуют неделимую оборонительную
    систему: в Средневековье всё село было одной крепостью.


    Большинство построек датируется IX–XIII веками. Веками хевсуры держали эту границу против набегов
    с севера, и Шатили был её последним рубежом. В 1950-х жителей принудительно переселили на равнину;
    сегодня село снова частично обитаемо, несколько башен переоборудованы в гостевые дома.


    В окрестностях:


    - **Склепы Анатори** в трёх километрах — каменные усыпальницы, куда, по преданию, заражённые чумой
    уходили умирать сами, чтобы не заразить село

    - **Муцо** — ещё одно село-крепость в двенадцати километрах, более дикое и почти полностью покинутое

    - **Аргунское ущелье** — узкое, глубокое, в пограничной зоне


    Это одно из самых удалённых мест Грузии, куда ещё можно доехать, и ночёвка здесь практически обязательна:
    однодневная поездка из Тбилиси выматывает до предела.
  tip: >-
    Сезон короткий — с середины июня до конца сентября, перевал Датвиджвари (2676 м) остальное время закрыт
    снегом. Жильё бронируйте заранее: гостевых домов в Шатили единицы, и в августе они заполнены. Связи
    практически нет, банкомата нет вовсе, наличные обязательны. Зона пограничная, паспорт нужен. Тёплые
    вещи берите и в августе: ночью здесь пять-восемь градусов.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге до Жинвали, затем направо на Барисахо вверх по Арагвскому ущелью.
    До Барисахо асфальт; дальше около 60 км грунта через перевал Датвиджвари — узкая дорога без ограждений,
    крутые спуски, много подвижного камня. Всего 155 км и минимум четыре с половиной часа, после дождя
    дольше. Здесь уместен только полноценный внедорожник с хорошей резиной; обычный кроссовер — риск.
    Последняя заправка — Жинвали или Барисахо, в Шатили топлива нет.
fa:
  name: شاتیلی
  short: روستا-دژی سنگی در خوسورتی بر مرز چچن — یکی از چشمگیرترین جاهای قفقاز.
  body: >-
    **شاتیلی مجموعه‌ای از خانه‌ها نیست، بلکه یک اندام واحد است که رشد کرده.** در لبهٔ شمالی خوسورتی، در
    تنگهٔ آرغونی، نزدیک پنجاه برج و خانهٔ سنگی روی شیبی تند در دل هم و روی هم ساخته شده‌اند. پله‌پله بالا
    می‌روند، بام یکی حیاط دیگری است، و همه با هم یک سامانهٔ دفاعی تقسیم‌ناپذیر می‌سازند: در سده‌های میانه
    تمام روستا یک دژ بود.


    بیشتر سازه‌ها به سدهٔ نهم تا سیزدهم بازمی‌گردند. خوسورها قرن‌ها این مرز را در برابر تاخت‌وتازهای شمال
    نگه داشتند و شاتیلی آخرین پاسگاه آن بود. در دههٔ 1950 جمعیت به‌اجبار به دشت کوچانده شد؛ امروز روستا
    دوباره تا حدی مسکونی است و چند برج به مهمانسرا بدل شده‌اند.


    پیرامون شاتیلی سه چیز هست: **دخمه‌های آناتوری** در 3 کیلومتری، گورهای سنگی که می‌گویند قربانیان طاعون
    خودشان به درون آن‌ها می‌رفتند تا بمیرند و روستا را آلوده نکنند؛ **موتسو**، روستا-دژ دیگری 12 کیلومتر
    جلوتر، وحشی‌تر و تقریباً یکسره متروک؛ و خودِ **تنگهٔ آرغونی**، باریک و عمیق و درون منطقهٔ مرزی. اینجا
    یکی از دورافتاده‌ترین جاهای گرجستان است که هنوز می‌شود با خودرو به آن رسید، و ماندن یک شب تقریباً
    اجباری است: انجام دادنش به‌صورت سفر یک‌روزه از تفلیس طاقت‌فرساست.
  tip: >-
    فصل کوتاه است — از میانهٔ ژوئن تا اواخر سپتامبر، چون گردنهٔ داتویسجواری در ارتفاع 2,676 متر باقی سال
    زیر برف است. اقامتگاه را از پیش رزرو کنید: شاتیلی فقط چند مهمانسرا دارد و در اوت پر می‌شوند. عملاً
    نه آنتن تلفن همراه هست و نه خودپرداز، پس پول نقد همراه ببرید. اینجا منطقهٔ مرزی است و پاسپورت لازم
    است. حتی برای اوت لباس گرم ببندید، چون شب‌ها دما به پنج تا هشت درجه می‌افتد.
  route: >-
    از تفلیس بزرگراه نظامی را تا ژینوالی بگیرید، بعد به راست به سوی باریساخو و بالا رفتن از درهٔ آراگوی
    بپیچید. آسفالت تا باریساخو ادامه دارد؛ پس از آن حدود 60 کیلومتر جادهٔ شنی از گردنهٔ داتویسجواری می‌گذرد
    — باریک، بدون حفاظ، با سرازیری‌های تند و سنگ‌های لق. روی هم 155 کیلومتر و دست‌کم چهار ساعت و نیم،
    و پس از باران بیشتر. فقط یک 4x4 واقعی با لاستیک خوب به این جاده تعلق دارد؛ کراس‌اوور معمولی یک قمار
    است. آخرین سوخت را در ژینوالی یا باریساخو بزنید، چون در شاتیلی پمپ‌بنزینی نیست.
he:
  name: שאטילי
  short: כפר-מבצר מאבן בחבסורתי על גבול צ'צ'ניה — אחד המקומות המרשימים ביותר בקווקז.
  body: >-
    **שאטילי אינו אוסף של בתים אלא אורגניזם אחד שצמח.** בקצה הצפוני של חבסורתי, בערוץ ארגוני, בנויים כחמישים
    מגדלי אבן ובתי מגורים זה בתוך זה וזה על גבי זה, על מדרון תלול. הם עולים במדרגות, גג של אחד משמש חצר
    לאחר, וביחד הם יוצרים מערכת הגנה אחת שאי אפשר לפרק: בימי הביניים היה הכפר כולו מבצר יחיד.


    רוב המבנים מתוארכים למאה התשיעית עד ה-13. במשך מאות שנים החזיקו החבסורים בגבול הזה מול פשיטות מן הצפון,
    ושאטילי היה המוצב האחרון שלו. בשנות ה-1950 הועברה האוכלוסייה בכפייה אל השפלה; היום הכפר מיושב שוב
    בחלקו וכמה מגדלים הוסבו לבתי הארחה.


    סביב שאטילי יש שלושה דברים: **מרתפי הקבורה של אנאטורי**, במרחק 3 ק״מ, קברי אבן שלפי המסופר נכנסו אליהם
    חולי מגפה למות מרצונם ובלבד שלא ידביקו את הכפר; **מוצו**, כפר-מבצר נוסף 12 ק״מ הלאה, פראי יותר ונטוש
    כמעט לחלוטין; ו**ערוץ ארגוני** עצמו, צר, עמוק ונמצא בתוך אזור הגבול. זהו אחד המקומות המרוחקים ביותר
    בגאורגיה שעדיין אפשר להגיע אליהם ברכב, ולינה כאן היא כמעט חובה: לעשות זאת כטיול יום מטביליסי זו חוויה
    מתישה.
  tip: >-
    העונה קצרה — מאמצע יוני עד סוף ספטמבר, מפני שמעבר דאטוויסג'ווארי בגובה 2,676 מ' מכוסה שלג בשאר חודשי
    השנה. הזמינו לינה מראש: בשאטילי יש רק קומץ בתי הארחה והם מתמלאים באוגוסט. אין כאן כמעט קליטה סלולרית
    ואין כספומט, לכן קחו מזומן. זהו אזור גבול, ולכן נדרש דרכון. ארזו בגדים חמים גם לאוגוסט, כשהלילות יורדים
    לחמש או שמונה מעלות.
  route: >-
    מטביליסי סעו על כביש הצבא עד ז'ינוואלי, ואז פנו ימינה לכיוון בריסאחו במעלה עמק אראגווי. האספלט נמשך
    עד בריסאחו; אחריו מגיעים כ-60 ק״מ של חצץ מעל מעבר דאטוויסג'ווארי — צר, בלי מעקות, עם ירידות תלולות
    ואבנים מתפוררות. בסך הכול 155 ק״מ ולפחות ארבע שעות וחצי, ויותר מכך אחרי גשם. רק רכב 4x4 אמיתי עם צמיגים
    טובים שייך לדרך הזאת; קרוסאובר רגיל הוא הימור. תדלקו בפעם האחרונה בז'ינוואלי או בבריסאחו, כי בשאטילי
    אין תחנה.
ar:
  name: شاتيلي
  short: قرية-حصن حجرية في خيفسوريتي على الحدود الشيشانية — من أكثر الأماكن إبهاراً في القوقاز.
  body: >-
    **شاتيلي ليست مجموعة بيوت بل كائناً واحداً نما على مهل.** على الطرف الشمالي من خيفسوريتي، في مضيق
    أرغوني، بُني نحو خمسين برجاً ومسكناً حجرياً بعضها في بعض وبعضها فوق بعض على منحدر حاد. ترتفع مصاطب
    متتالية، فسطح أحدها فناء لغيره، وتشكل معاً منظومة دفاعية لا تتجزأ: ففي العصور الوسطى كانت القرية كلها
    حصناً واحداً.


    يعود معظم المنشآت إلى ما بين القرنين التاسع والثالث عشر. وقد حرس الخيفسوريون هذه الجبهة قروناً في
    وجه الغارات القادمة من الشمال، وكانت شاتيلي آخر مواقعها. وفي عقد 1950 هُجّر السكان قسراً إلى السهول؛
    واليوم عادت القرية مأهولة جزئياً وتحولت عدة أبراج إلى بيوت ضيافة.


    وحول شاتيلي ثلاثة مواضع: **سراديب أناتوري** على بعد 3 كم، وهي قبور حجرية يُقال إن مصابي الطاعون كانوا
    يدخلونها بأنفسهم ليموتوا فيها بدل أن يعدوا القرية؛ و**موتسو**، قرية-حصن أخرى تبعد 12 كم أبعد، أكثر
    توحشاً ومهجورة كلياً تقريباً؛ و**مضيق أرغوني** نفسه، الضيق العميق الواقع داخل المنطقة الحدودية. وهذا
    من أبعد أماكن جورجيا التي ما زال يمكن الوصول إليها بالسيارة، والمبيت هنا شبه إلزامي: أما القيام بها
    كرحلة يوم واحد من تبليسي فأمر مرهق.
  tip: >-
    الموسم قصير — من منتصف يونيو إلى أواخر سبتمبر، لأن ممر داتفيسجفاري على ارتفاع 2,676 م يبقى تحت الثلج
    بقية العام. احجز الإقامة مسبقاً: ففي شاتيلي بضعة بيوت ضيافة فقط وتمتلئ في أغسطس. ولا تكاد توجد تغطية
    للهاتف المحمول ولا صراف آلي، فاحمل نقداً. والمنطقة حدودية، ولذلك جواز السفر مطلوب. واحزم ملابس دافئة
    حتى لأغسطس، حين تهبط حرارة الليل إلى خمس أو ثماني درجات.
  route: >-
    من تبليسي اسلك الطريق العسكري حتى جينفالي، ثم انعطف يميناً نحو باريساخو صعوداً في وادي أراغفي. يستمر
    الإسفلت حتى باريساخو؛ وبعده نحو 60 كم من الحصى فوق ممر داتفيسجفاري — ضيق وبلا حواجز، بمنحدرات حادة
    وصخور سائبة. المجموع 155 كم وأربع ساعات ونصف على الأقل، وأكثر بعد المطر. ولا يصلح لهذا الطريق إلا
    دفع رباعي حقيقي بإطارات جيدة؛ أما الكروس أوفر العادي فمقامرة. تزوّد بالوقود آخر مرة في جينفالي أو
    باريساخو، فلا محطة في شاتيلي.
