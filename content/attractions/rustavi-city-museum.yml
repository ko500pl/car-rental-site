ka:
  name: რუსთავის ისტორიის მუზეუმი
  short: >-
    1950 წელს, რუსთავის ქარხნის პირველი ფოლადის წელს დაარსებული მუზეუმი — ქალაქის ამბავი ბრინჯაოს ხანის
    მოსახლეებიდან ბრძმედებამდე.
  body: >-
    **მუზეუმი 1950 წელს დაარსდა — იმავე წელს, როცა რუსთავის ქარხანამ პირველი ფოლადი გამოადნო, — და მას
    შემდეგ ქალაქის ორივე ამბავს ინახავს.**


    პირველი ამბავი გრძელია. ექსპონატები შუა ბრინჯაოს ხანით იწყება და იმ რუსთავს ეკუთვნის, რომელიც არაუგვიანეს
    ძვ. წ. V–IV საუკუნეებისა უკვე იბერიის სამეფოს ერთ-ერთი პოლიტიკური და ადმინისტრაციული ცენტრი იყო. ეს
    ქალაქი თემურ-ლენგის შემოსევების შემდეგ საბოლოოდ განადგურდა და მისი ადგილი საუკუნეობით ცარიელი იდგა.


    მეორე ამბავი სწრაფია. 1948 წლის 19 იანვრის დადგენილებით ახალი რუსთავი იმ მეტალურგიული ქარხნის ირგვლივ
    შეიქმნა, რომლის მშენებლობაც 1941 წელს დაიწყო. პირველი ფოლადი ქარხანამ 1950 წლის 27 აპრილს გამოუშვა;
    ის კავკასიაში პირველი საწარმო გახდა, რომელიც უნაკერო მილებს აწარმოებდა, და აყვავების ხანაში დაახლოებით
    15 000 ადამიანს ასაქმებდა. ქალაქის მოსახლეობა 1959 წლის 62 395-იდან 1990-იანი წლების შუა ხანებისთვის
    დაახლოებით 160 000-მდე გაიზარდა. ყველაზე მეტი დრო ზედა სართულს დაუთმეთ, რომელიც ქარხანასა და მასთან
    დაკავშირებულ მრეწველობას ეძღვნება: ფოტოები და დოკუმენტები ქალაქისა, რომელიც, თავისი ფოლადის მსგავსად,
    თითქმის ერთბაშად ჩამოისხა.


    მუზეუმი ძველ რუსთავში დგას — „ძველ“ უბანში, რომლის სტალინური ხანის ფასადები ლოჯიებით, ბელვედერებითა
    და ნატიფი ბათქაშის ორნამენტით მოგვიანო მიკრორაიონების უბრალო ბეტონის გვერდით თითქმის მხიარულად გამოიყურება.


    რუსთავში „ძველი“ 1950 წელს ნიშნავს. მუზეუმი კი ის ადგილია, სადაც ქალაქს ახსოვს, რომ გაცილებით ძველია.
  tip: >-
    ღიაა 10:00–18:00 საათებში, სამშაბათიდან კვირის ჩათვლით; ორშაბათობით და უქმე დღეებში დაკეტილია. ბოლო
    ცნობით, შესვლა 5 ლარი ღირს, ინგლისურენოვანი გიდი კი დამატებით 20 ლარი — ღირს, რადგან დარბაზებს ამბად
    სწორედ გიდი აქცევს; ნაღდი ფული იქონიეთ. შესასვლელი შენობის გვერდზეა, გივი ოდიშარიას ქუჩიდან. შიგნით
    ფოტოგადაღება აკრძალულია. დაახლოებით ერთი საათი დაგჭირდებათ, შემდეგ კი ძველი უბნის სტალინური ფასადები
    დაათვალიერეთ — მერია, დრამატული თეატრი, რკინიგზის სადგური — და, თუ დრო დაგრჩათ, რუსთავის პარკში ციხის
    ნანგრევებიც. რუსთავის სიონი 3,6 კილომეტრშია.
  route: >-
    თბილისის ცენტრიდან მარჯვენა სანაპიროს სამხრეთ-აღმოსავლეთით გაჰყევით და ს4 (თბილისი — წითელი ხიდი)
    მაგისტრალზე გადადით, რომელიც ველს სწორად კვეთს რუსთავამდე. რუსთავის გასასვლელზე გადაუხვიეთ და ქალაქის
    ქუჩებით ძველი რუსთავისკენ იარეთ, სადაც მუზეუმი დგას. სულ დაახლოებით 28 კმ და 35 წუთია, საცობებში —
    მეტი. გზა ბოლომდე ასფალტიანია, ამიტომ ნებისმიერი ეკონომკლასის მანქანა გამოდგება, წლის ნებისმიერ დროს.
    ბენზინგასამართი სადგურები ს4-ზე ბევრია, მუზეუმთან კი ჩვეულებრივ ქუჩაზე გააჩერებთ. ვიზიტი IX მიკრორაიონში
    მდებარე რუსთავის სიონთან ერთად დაგეგმეთ — ქალაქის გავლით 3,6 კილომეტრია.
en:
  name: Rustavi History Museum
  short: >-
    Founded in 1950, the year Rustavi's steelworks produced its first steel: the city's story from Bronze
    Age settlers to the blast furnaces.
  body: >-
    **The museum was founded in 1950, the same year Rustavi's steel plant produced its first steel — and
    it has been keeping both of the city's stories ever since.**


    The first story is long. Its exhibits begin in the Middle Bronze Age, and they belong to a Rustavi
    that was already, by the 5th–4th centuries BC at the latest, one of the political and administrative
    centres of the kingdom of Iberia. That town was finally destroyed in the wake of Timur's invasions,
    and the site lay empty for centuries.


    The second story is fast. A decree of 19 January 1948 created a new Rustavi around a metallurgical
    plant begun in 1941; its first steel came out on 27 April 1950, it became the first plant in the Caucasus
    to make seamless pipes, and at its peak it employed around 15,000 people. The city swelled from 62,395
    residents in 1959 to about 160,000 by the mid-1990s. The upper floor, devoted to the plant and its
    sister industries, is the part to linger over: photographs and records of a city that was poured,
    like its steel, almost all at once.


    The museum stands in Dzveli Rustavi, the "old" quarter, whose Stalin-era façades — loggias, belvederes,
    ornate plasterwork — look almost playful beside the plain concrete of the later microdistricts.


    In Rustavi, "old" means 1950. The museum is where the city remembers that it is far older than that.
  tip: >-
    Open 10:00–18:00, Tuesday to Sunday; closed on Mondays and public holidays. Entry was 5 ₾ at last
    report, and an English-speaking guide costs 20 ₾ more — worth it, because the guide is what turns
    the rooms into a story; bring cash. The entrance is round the side of the building, on Givi Odisharia
    Street. Photography is not allowed inside. Allow about an hour, then walk the old quarter's Stalinist
    façades — the Mayor's Office, the Drama Theatre and the railway station — and, if you have time, the
    ruined fortress in Rustavi Park. Rustavi Sioni Church is 3.6 km away.
  route: >-
    From central Tbilisi follow the right-bank embankment south-east onto the S4 (Tbilisi – Red Bridge)
    motorway, which runs straight across the plain to Rustavi. Take the Rustavi exit and follow the city
    streets towards Dzveli Rustavi, the old town, where the museum stands; the whole drive is about 28
    km and 35 minutes, longer in commuter traffic. It is asphalt all the way, so any economy car will
    do, in any season. Fuel stations line the S4, and there is ordinary street parking near the museum.
    Combine it with Rustavi Sioni Church in the 9th microdistrict, 3.6 km across town.
ru:
  name: Музей истории Рустави
  short: >-
    Основан в 1950-м, в год первой стали руставского завода: история города от поселенцев бронзового века
    до доменных печей.
  body: >-
    **Музей основали в 1950 году — в тот самый год, когда металлургический завод Рустави выдал первую
    сталь, — и с тех пор он хранит обе истории города.**


    Первая история длинная. Экспозиция начинается со среднего бронзового века и принадлежит Рустави, который
    не позднее V–IV веков до н. э. уже был одним из политических и административных центров Иберийского
    царства. Тот город окончательно погиб после нашествий Тимура, и место на века опустело.


    Вторая история стремительная. Указ от 19 января 1948 года создал новый Рустави вокруг металлургического
    завода, заложенного в 1941 году; первая сталь вышла 27 апреля 1950 года, завод первым на Кавказе начал
    выпускать бесшовные трубы, а в лучшие годы на нём работало около 15 000 человек. Население выросло
    с 62 395 человек в 1959 году примерно до 160 000 к середине 1990-х. Верхний этаж, посвящённый заводу
    и смежным производствам, — вот где стоит задержаться: фотографии и документы города, который отлили,
    как и его сталь, почти разом.


    Музей стоит в Дзвели Рустави, «старом» квартале, чьи сталинские фасады — лоджии, бельведеры, пышная
    лепнина — выглядят почти игриво рядом с простым бетоном поздних микрорайонов.


    В Рустави «старое» означает 1950 год. Музей — то место, где город помнит, что он гораздо старше.
  tip: >-
    Открыт с 10:00 до 18:00, со вторника по воскресенье; в понедельник и праздничные дни закрыт. Вход,
    по последним данным, 5 ₾, англоязычный гид — ещё 20 ₾, и он того стоит: именно гид превращает залы
    в рассказ. Возьмите наличные. Вход — сбоку здания, с улицы Гиви Одишариа. Фотографировать внутри нельзя.
    Закладывайте около часа, а потом пройдитесь мимо сталинских фасадов старого квартала — мэрии, драматического
    театра и вокзала — и, если останется время, загляните к руинам крепости в Руставском парке. Церковь
    Сиони в Рустави — в 3,6 км.
  route: >-
    Из центра Тбилиси следуйте по правобережной набережной на юго-восток к автомагистрали S4 (Тбилиси
    — Красный мост), которая прямой линией пересекает равнину до Рустави. Сверните на съезд к Рустави
    и по городским улицам езжайте к Дзвели Рустави, старому городу, где стоит музей; весь путь — около
    28 км и 35 минут, дольше в часы пик. Асфальт на всём протяжении, так что подойдёт любая машина эконом-класса
    в любое время года. Заправки стоят вдоль S4, у музея — обычная уличная парковка. Совместите поездку
    с церковью Сиони в 9-м микрорайоне, в 3,6 км через город.
fa:
  name: موزهٔ تاریخ روستاوی
  short: >-
    بنیان‌گذاشته در ۱۹۵۰، همان سالی که کارخانهٔ فولاد روستاوی نخستین فولادش را داد: داستان شهر از ساکنان
    عصر مفرغ تا کوره‌های بلند.
  body: >-
    **این موزه در سال ۱۹۵۰ بنیان گذاشته شد، همان سالی که کارخانهٔ فولاد روستاوی نخستین فولادش را تولید
    کرد — و از آن زمان هر دو داستان شهر را نگه داشته است.**


    داستان نخست بلند است. اشیای موزه از عصر مفرغ میانی آغاز می‌شوند و به روستاوی‌ای تعلق دارند که حداکثر
    تا سده‌های پنجم تا چهارم پیش از میلاد یکی از کانون‌های سیاسی و اداری پادشاهی ایبریا شده بود. آن شهر
    سرانجام در پی یورش‌های تیمور ویران شد و جایش سده‌ها خالی ماند.


    داستان دوم شتابان است. فرمانی به تاریخ ۱۹ ژانویه ۱۹۴۸ روستاوی تازه‌ای را پیرامون کارخانهٔ ذوب‌آهنی
    پدید آورد که ساختش در ۱۹۴۱ آغاز شده بود؛ نخستین فولادش در ۲۷ آوریل ۱۹۵۰ بیرون آمد، نخستین کارخانهٔ
    قفقاز شد که لوله بدون درز می‌ساخت، و در اوج خود حدود ۱۵٬۰۰۰ کارگر داشت. جمعیت شهر از ۶۲٬۳۹۵ نفر در
    ۱۹۵۹ به حدود ۱۶۰٬۰۰۰ نفر در میانهٔ دههٔ ۱۹۹۰ رسید. طبقهٔ بالا، که به این کارخانه و صنایع وابسته‌اش
    اختصاص دارد، جایی است که باید در آن درنگ کرد: عکس‌ها و اسناد شهری که همچون فولادش تقریباً یک‌باره
    ریخته شد.


    موزه در دزولی روستاوی، محلهٔ «قدیمی»، قرار دارد؛ محله‌ای که نماهای دوران استالینی‌اش — ایوان‌های سرپوشیده،
    کلاه‌فرنگی‌ها، گچ‌بری‌های پرنقش — در کنار بتن سادهٔ میکرورایون‌های بعدی تقریباً بازیگوش به نظر می‌رسند.


    در روستاوی، «قدیمی» یعنی ۱۹۵۰. موزه جایی است که شهر به یاد می‌آورد بسیار کهن‌تر از آن است.
  tip: >-
    ساعت ۱۰:۰۰ تا ۱۸:۰۰، سه‌شنبه تا یکشنبه باز است؛ دوشنبه‌ها و روزهای تعطیل رسمی بسته است. بلیت ورود
    بنا بر آخرین گزارش‌ها ۵ لاری (₾) بود و راهنمای انگلیسی‌زبان ۲۰ لاری دیگر هزینه دارد — که می‌ارزد،
    چون همین راهنماست که تالارها را به یک داستان بدل می‌کند؛ پول نقد همراه داشته باشید. ورودی در کنار
    ساختمان، در خیابان گیوی اودیشاریا است. عکاسی در داخل مجاز نیست. حدود یک ساعت وقت بگذارید، سپس در میان
    نماهای استالینی محلهٔ قدیمی قدم بزنید — ساختمان شهرداری، تئاتر درام و ایستگاه راه‌آهن — و اگر وقت
    ماند، ویرانه‌های قلعه در پارک روستاوی را ببینید. کلیسای سیونی روستاوی ۳٫۶ کیلومتر دورتر است.
  route: >-
    از مرکز تفلیس از خیابان ساحلی کرانهٔ راست به‌سوی جنوب‌شرقی بروید تا به آزادراه S4 (تفلیس – پل سرخ)
    برسید که مستقیم از دشت می‌گذرد و به روستاوی می‌رسد. از خروجی روستاوی بیرون بروید و از خیابان‌های شهر
    به‌سوی دزولی روستاوی، شهر قدیم، بروید که موزه در آن است؛ کل مسیر حدود ۲۸ کیلومتر و ۳۵ دقیقه است و
    در ساعات شلوغیِ رفت‌وآمد بیشتر. سراسر راه آسفالت است، پس هر خودروی اقتصادی در هر فصلی کافی است. جایگاه‌های
    سوخت در امتداد S4 قرار دارند و نزدیک موزه پارک معمولی کنار خیابان هست. این دیدار را با کلیسای سیونی
    روستاوی در میکرورایون نهم، ۳٫۶ کیلومتر آن سوی شهر، همراه کنید.
he:
  name: מוזיאון ההיסטוריה של רוסתאווי
  short: >-
    נוסד ב-1950, בשנה שבה הפיק מפעל הפלדה של רוסתאווי את הפלדה הראשונה שלו: סיפור העיר ממתיישבי תקופת
    הברונזה ועד כבשני ההתכה.
  body: >-
    **המוזיאון נוסד ב-1950, באותה שנה שבה הפיק מפעל הפלדה של רוסתאווי את הפלדה הראשונה שלו — ומאז הוא
    שומר על שני סיפוריה של העיר.**


    הסיפור הראשון ארוך. המוצגים מתחילים בתקופת הברונזה התיכונה, והם שייכים לרוסתאווי שכבר במאות ה-5–4
    לפני הספירה לכל המאוחר הייתה אחד המרכזים הפוליטיים והמנהליים של ממלכת איבריה. העיר ההיא נחרבה סופית
    בעקבות פלישות טימור, והמקום עמד שומם במשך מאות שנים.


    הסיפור השני מהיר. צו מ-19 בינואר 1948 הקים רוסתאווי חדשה סביב מפעל מטלורגי שהקמתו החלה ב-1941; הפלדה
    הראשונה יצאה ממנו ב-27 באפריל 1950, הוא היה המפעל הראשון בקווקז שייצר צינורות ללא תפר, ובשיאו הועסקו
    בו כ-15,000 איש. אוכלוסיית העיר גדלה מ-62,395 תושבים ב-1959 לכ-160,000 באמצע שנות ה-90. הקומה העליונה,
    המוקדשת למפעל ולתעשיות הנלוות לו, היא המקום שבו כדאי להתעכב: צילומים ותעודות של עיר שנוצקה, כמו הפלדה
    שלה, כמעט בבת אחת.


    המוזיאון עומד בדזוולי רוסתאווי, הרובע ה"ישן", שחזיתותיו מתקופת סטלין — לוג'יות, בלוודרים, עיטורי טיח
    מפוארים — נראות כמעט שובבות לצד הבטון הפשוט של המיקרו-רובעים המאוחרים.


    ברוסתאווי, "ישן" פירושו 1950. המוזיאון הוא המקום שבו העיר זוכרת שהיא עתיקה בהרבה.
  tip: >-
    פתוח 10:00–18:00, שלישי עד ראשון; סגור בימי שני ובחגים הרשמיים. הכניסה עלתה 5 ₾ לפי הדיווח האחרון,
    ומדריך דובר אנגלית עולה עוד 20 ₾ — וזה שווה, כי המדריך הוא שהופך את האולמות לסיפור; הביאו מזומן. הכניסה
    בצד הבניין, מרחוב גיווי אודישריה. אסור לצלם בפנים. הקדישו כשעה, ואחר כך צאו לסיור בין החזיתות הסטליניסטיות
    של הרובע הישן — בניין העירייה, התיאטרון הדרמטי ותחנת הרכבת — ואם נשאר זמן, גם אל חורבות המבצר בפארק
    רוסתאווי. כנסיית סיוני ברוסתאווי נמצאת 3.6 ק"מ משם.
  route: >-
    ממרכז טביליסי סעו דרומה-מזרחה לאורך הכביש שעל הגדה הימנית אל הכביש המהיר S4 (טביליסי – הגשר האדום),
    שחוצה בקו ישר את המישור עד רוסתאווי. צאו במחלף לרוסתאווי והמשיכו ברחובות העיר לכיוון דזוולי רוסתאווי,
    העיר הישנה, שבה עומד המוזיאון; כל הנסיעה כ-28 ק"מ ו-35 דקות, יותר בשעות העומס. אספלט לכל אורך הדרך,
    כך שכל רכב חסכוני יתאים, בכל עונה. תחנות דלק פזורות לאורך S4, וליד המוזיאון יש חניה רגילה ברחוב. שלבו
    את הביקור עם כנסיית סיוני ברוסתאווי במיקרו-רובע התשיעי, 3.6 ק"מ משם בצד השני של העיר.
ar:
  name: متحف تاريخ روستافي
  short: >-
    تأسس عام 1950، في السنة التي أنتج فيها مصنع روستافي أول فولاذه: حكاية المدينة من مستوطني العصر البرونزي
    إلى الأفران العالية.
  body: >-
    **تأسس المتحف عام 1950، في السنة نفسها التي أنتج فيها مصنع الفولاذ في روستافي أول فولاذه، ومنذ ذلك
    الحين وهو يحفظ حكايتي المدينة كلتيهما.**


    الحكاية الأولى طويلة. تبدأ معروضاتها بالعصر البرونزي الأوسط، وتنتمي إلى روستافي التي كانت، في موعد
    أقصاه القرنان الخامس والرابع قبل الميلاد، أحد المراكز السياسية والإدارية لمملكة أيبيريا. وقد دُمّرت
    تلك المدينة نهائيًا في أعقاب غزوات تيمور، وظل موقعها خاليًا قرونًا.


    الحكاية الثانية سريعة. فقد أنشأ مرسومٌ صادر في 19 يناير 1948 روستافي جديدة حول مجمّع للصناعات المعدنية
    بدأ إنشاؤه عام 1941؛ وخرج منه أول فولاذ في 27 أبريل 1950، وصار أول مصنع في القوقاز ينتج الأنابيب غير
    الملحومة، وبلغ عدد العاملين فيه في ذروته نحو 15,000 شخص. وتضخم عدد سكان المدينة من 62,395 نسمة عام
    1959 إلى نحو 160,000 بحلول منتصف التسعينيات. أما الطابق العلوي، المخصص للمصنع والصناعات المرتبطة به،
    فهو الجزء الذي يستحق التمهل: صور وسجلات لمدينة صُبّت، مثل فولاذها، دفعةً واحدة تقريبًا.


    يقع المتحف في دزفيلي روستافي، الحي «القديم»، الذي تبدو واجهاته الستالينية — بشرفاتها المسقوفة وأبراجها
    المطلة وزخارفها الجصية المتأنقة — شبه مرحة إلى جانب الخرسانة العارية للأحياء السكنية اللاحقة.


    في روستافي، «القديم» يعني عام 1950. والمتحف هو المكان الذي تتذكر فيه المدينة أنها أقدم من ذلك بكثير.
  tip: >-
    يفتح من 10:00 إلى 18:00، من الثلاثاء إلى الأحد، ويغلق أيام الاثنين والعطل الرسمية. كانت رسوم الدخول
    5 لاري (₾) وفق آخر المعلومات، والمرشد الناطق بالإنجليزية يكلّف 20 ₾ إضافية، وهو يستحقها، لأن المرشد
    هو من يحوّل القاعات إلى حكاية؛ احمل نقودًا. المدخل على جانب المبنى، في شارع غيفي أوديشاريا. التصوير
    ممنوع في الداخل. خصّص نحو ساعة، ثم تجوّل بين الواجهات الستالينية في الحي القديم — مبنى البلدية والمسرح
    الدرامي ومحطة القطار — وإن اتسع الوقت، فزُر أطلال القلعة في حديقة روستافي. تقع كنيسة سيوني في روستافي
    على بعد 3.6 كم.
  route: >-
    من وسط تبليسي اتبع طريق الضفة اليمنى نحو الجنوب الشرقي إلى الطريق السريع S4 (تبليسي – الجسر الأحمر)،
    الذي يعبر السهل في خط مستقيم حتى روستافي. اسلك مخرج روستافي وتابع في شوارع المدينة نحو دزفيلي روستافي،
    البلدة القديمة، حيث يقع المتحف؛ تبلغ الرحلة كلها نحو 28 كم و35 دقيقة، وتطول في ساعات الذروة. الطريق
    معبّد بالكامل، فأي سيارة اقتصادية تفي بالغرض في أي فصل. محطات الوقود منتشرة على طول S4، وقرب المتحف
    مواقف عادية في الشارع. اجمع الزيارة مع كنيسة سيوني في الحي السكني التاسع، على بعد 3.6 كم عبر المدينة.
