ka:
  name: ცუცხვათის მღვიმეები
  short: ცამეტსართულიანი კარსტული სისტემა ჩიშურას ხეობაში, სადაც ნეანდერტალელების კვალი აღმოაჩინეს.
  body: >-
    **ცუცხვათი საქართველოს ყველაზე რთული კარსტული სისტემაა და ტურისტული მღვიმე არ არის.** ის ტყიბულის
    მუნიციპალიტეტში, სოფელ ცუცხვათთან, ოქრიბა-არგვეთის ქედში, ჩიშურას ხეობის კედელშია, დაახლოებით 320
    მეტრზე.


    წყალმა კირქვაში ცამეტი სართული გამოკვეთა — ერთმანეთზე დაწყობილი გალერეები, რომლებიც სხვადასხვა ეპოქაში
    სხვადასხვა დონეზე ჩამოყალიბდა. ზედა სართულები მშრალია, ქვედაზე კი დღემდე მიედინება წყალი. მეორე სართული
    გამორჩეულია: ეს ორასმეტრიანი ბუნებრივი გვირაბია, ათიდან ოცდაათ მეტრამდე სიგანით და ოცდარვა მეტრამდე
    სიმაღლით — სწორედ იქ არის ყველაზე ადვილი შესვლა.


    არქეოლოგიური მასალა შუა პალეოლითიდან ბრინჯაოს ხანამდე გრძელდება. აღმოჩენილია ნეანდერტალელების კვალი
    დაახლოებით ორმოცდაათი ათასი წლის წინანდელი, ჰომო საპიენსის ნაშთები ოთხმოცი ათასიდან თორმეტ ათას წლამდე
    პერიოდისა, და ქვის იარაღები, რომელთა ასაკი ოთხასი ათას წლამდე მიდის. ცხოველთა ორმოცამდე სახეობა დაფიქსირდა.
    მეთერთმეტე სართულზე მსხვერპლშეწირული ცხოველების სპეციალურად დალაგებული ძვლები და კბილები იპოვეს. 2017
    წლიდან აქ საერთაშორისო ექსპედიცია მუშაობს.


    რას უნდა ელოდო: განათება არ არის, ბილიკი არ არის, მოაჯირი არ არის. ეს ველური მღვიმეა, სადაც ფონარი,
    მაგარი ფეხსაცმელი და, სასურველია, ადგილობრივი თანმხლები გჭირდება. სამაგიეროდ, ის სიჩუმე და მასშტაბი,
    რასაც მეორე სართულის გვირაბში იგრძნობ, გაწყობილ მღვიმეში არასდროს გექნება.


    ძვლოვანი მასალა სწორედ ის არის, რის გამოც სპეციალისტები ბრუნდებიან. ნალექებში ცხოველთა ძვალი უხვადაა
    — ორმოცამდე სახეობა დაფიქსირდა — და ფენების თანმიმდევრობა პლეისტოცენის კლიმატურ რყევებს აღრიცხავს.
    ვიზიტორისთვის ეს თითქმის უხილავია, მაგრამ ხსნის, რატომ დგას განათების გარეშე დარჩენილ მღვიმესთან ზაფხულობით
    არქეოლოგიური ბანაკი.
  tip: >-
    ორი საათი, მისვლა-მოსვლის ჩათვლით. ფონარი (და სათადარიგო) სავალდებულოა, ტელეფონის შუქი არ კმარა. ჩაიცვი
    ის, რაც ტალახის არ გეშინია; შესასვლელამდე ბილიკი ციცაბოა და სველ ამინდში სრიალა. მარტო ნუ შეხვალ და
    ზედა სართულებზე ასვლას ნუ სცდი — გადასასვლელები საშიშია. ზამთარსა და ადრე გაზაფხულზე წყალი მაღლა დგას
    და ქვედა დონეები მიუწვდომელია. ტუალეტი, კაფე ან ბილეთის სალარო აქ არ არსებობს; უახლოესი მაღაზია სოფელშია.
  route: >-
    თბილისიდან E60-ით ზესტაფონსა და თერჯოლაზე გავლით, შემდეგ ჩრდილოეთით, ცუცხვათის მიმართულებით — სულ
    დაახლოებით 215 კმ და სამი საათი და თხუთმეტი წუთი. ასფალტი სოფლამდე მიდის, ბოლო ორი-სამი კილომეტრი
    კი ხრეშისა და მიწის გზაა ხეობისკენ. მშრალ ამინდში კროსოვერიც გაივლის, წვიმის შემდეგ კი კლირენსი ნამდვილად
    დაგჭირდება. საწვავი ზესტაფონსა და თერჯოლაში აიღე. მანქანას ბილიკის დასაწყისში, სოფლის ბოლოს დატოვებ.
en:
  name: Tsutskhvati Caves
  short: A thirteen-storey karst system in the Chishura gorge, where traces of Neanderthals have been
    excavated.
  body: >-
    **Tsutskhvati is the most complicated cave system in Georgia, and it is not a show cave.** It lies
    in Tkibuli municipality near the village of Tsutskhvati, in the Okriba-Argveti ridge, cut into the
    wall of the Chishura gorge at about 320 metres.


    Water has hollowed thirteen storeys out of the limestone — galleries stacked one above another, each
    formed when the river stood at a different level. The upper floors are dry; water still runs through
    the lowest. The second floor is the exceptional one: a natural tunnel two hundred metres long, ten
    to thirty metres wide and up to twenty-eight metres high. It is also the easiest part to enter.


    The archaeology runs from the Middle Palaeolithic to the Bronze Age. Excavation has produced Neanderthal
    material of roughly fifty thousand years ago, evidence of modern humans between eighty thousand and
    twelve thousand years ago, and stone tools reaching back as far as four hundred thousand years. Up
    to forty animal species have been identified in the bone assemblages. On the eleventh floor archaeologists
    found deliberately arranged bones and teeth of sacrificed animals. An international expedition has
    worked here since 2017.


    What to expect: no lighting, no walkway, no handrail. This is a wild cave, and you need a torch, solid
    boots and preferably a local companion who knows the entrances. In exchange you get a silence and
    a sense of scale in the second-floor tunnel that no fitted-out cave will give you.


    The bone deposits are the reason specialists keep coming back. Animal bone is abundant in the layers
    — up to forty species have been identified — and the sequence through the deposits records the climate
    swings of the Pleistocene. Almost none of that is visible to a visitor, but it explains why a cave
    with no lighting still has an archaeological camp beside it each summer.
  tip: >-
    Two hours including the approach. A torch — and a spare — is essential; a phone light is not enough.
    Wear clothes you do not mind covering in mud, as the path to the entrance is steep and slick in wet
    weather. Do not go in alone, and do not try to climb between the upper storeys: the connections are
    dangerous. In winter and early spring the water table is high and the lower levels are out of reach.
    There are no toilets, cafe or ticket desk; the nearest shop is in the village.
  route: >-
    Take the E60 west from Tbilisi past Zestaponi and Terjola, then turn north towards Tsutskhvati — about
    215 km in all, three hours fifteen. Asphalt runs as far as the village; the last two or three kilometres
    towards the gorge are gravel and earth. A crossover will manage in dry weather, but after rain you
    genuinely want ground clearance. Refuel in Zestaponi or Terjola. Leave the car at the end of the village
    where the footpath begins.
ru:
  name: Пещеры Цуцхвати
  short: Тринадцатиярусная карстовая система в ущелье Чишура, где нашли следы неандертальцев.
  body: >-
    **Цуцхвати — самая сложная карстовая система Грузии, и это не оборудованная пещера.** Она находится
    в Ткибульском муниципалитете у села Цуцхвати, в хребте Окриба-Аргвети, врезана в стену ущелья Чишура
    на высоте около 320 метров.


    Вода выточила в известняке тринадцать ярусов — галереи, лежащие одна над другой, каждая образовалась,
    когда река стояла на своём уровне. Верхние этажи сухие, по нижним до сих пор течёт вода. Второй ярус
    исключителен: природный тоннель длиной двести метров, шириной от десяти до тридцати и высотой до двадцати
    восьми метров. Туда же проще всего попасть.


    Археология тянется от среднего палеолита до бронзового века. Найдены неандертальские материалы возрастом
    около пятидесяти тысяч лет, следы людей современного типа в интервале от восьмидесяти до двенадцати
    тысяч лет назад и каменные орудия, уходящие вглубь до четырёхсот тысяч лет. В костных сборах определено
    до сорока видов животных. На одиннадцатом ярусе археологи нашли специально уложенные кости и зубы
    принесённых в жертву животных. С 2017 года здесь работает международная экспедиция.


    Чего ждать: ни освещения, ни настила, ни перил. Это дикая пещера, нужен фонарь, крепкие ботинки и
    лучше местный спутник, знающий входы. Взамен вы получаете тишину и ощущение масштаба в тоннеле второго
    яруса, какого не даст ни одна благоустроенная пещера.


    Костные отложения — то, ради чего специалисты возвращаются сюда снова. В слоях много костей животных,
    определено до сорока видов, а последовательность отложений фиксирует климатические колебания плейстоцена.
    Посетителю почти ничего из этого не видно, но именно это объясняет, почему у пещеры без освещения
    каждое лето стоит археологический лагерь.
  tip: >-
    Два часа с подходом. Фонарь — и запасной — обязателен, света телефона не хватает. Одежду берите ту,
    которую не жалко испачкать: тропа ко входу крутая и в сырость скользкая. Не заходите в одиночку и
    не пытайтесь лазить между верхними ярусами, переходы опасны. Зимой и ранней весной вода стоит высоко,
    и нижние уровни недоступны. Ни туалета, ни кафе, ни кассы здесь нет, ближайший магазин — в селе.
  route: >-
    Из Тбилиси по E60 мимо Зестафони и Тержолы, затем поворот на север в сторону Цуцхвати — всего около
    215 км, три часа пятнадцать минут. Асфальт доходит до села, последние два-три километра к ущелью —
    гравий и грунт. В сухую погоду проедет и кроссовер, после дождя клиренс действительно нужен. Заправляйтесь
    в Зестафони или Тержоле. Машину оставляют в конце села, там, где начинается тропа.
fa:
  name: غارهای تسوتسخواتی
  short: سامانه‌ای کارستی با سیزده طبقه در تنگهٔ چیشورا، که در آن ردّ نئاندرتال‌ها کاوش شده است.
  body: >-
    **تسوتسخواتی پیچیده‌ترین سامانهٔ کارستی گرجستان است و غاری آمادهٔ بازدید عمومی نیست.** در شهرستان
    تکیبولی نزدیک روستای تسوتسخواتی، در رشتهٔ اوکریبا‑آرگوتی و بریده در دیوارهٔ تنگهٔ چیشورا، در ارتفاع
    حدود ۳۲۰ متر قرار دارد.


    آب سیزده طبقه در سنگ آهک کنده است؛ دالان‌هایی روی هم که هر یک زمانی شکل گرفت که رودخانه در تراز دیگری
    بود. طبقه‌های بالا خشک‌اند و در پایین‌ترین‌ها هنوز آب جاری است. طبقهٔ دوم استثنایی است: تونلی طبیعی
    به درازای دویست متر، پهنای ده تا سی متر و بلندی تا بیست‌وهشت متر. ورود به همین بخش از همه آسان‌تر
    است.


    یافته‌های باستان‌شناسی از پارینه‌سنگی میانه تا عصر مفرغ ادامه دارد. مواد نئاندرتالی نزدیک به پنجاه
    هزار سال پیش، نشانه‌های انسان امروزین میان هشتاد هزار تا دوازده هزار سال پیش، و ابزارهای سنگی تا چهارصد
    هزار سال پیش به دست آمده است. تا چهل گونهٔ جانوری در مجموعه‌های استخوانی شناسایی شده. در طبقهٔ یازدهم
    استخوان‌ها و دندان‌های جانوران قربانی‌شده را چیده‌شده و عمدی یافتند. از ۲۰۱۷ هیئتی بین‌المللی اینجا
    کار می‌کند.


    چه انتظاری داشته باشید: نه روشنایی، نه پیاده‌رو، نه نرده. غاری وحشی است و به چراغ‌قوه، پوتین محکم
    و ترجیحاً همراهی محلی که دهانه‌ها را بشناسد نیاز دارید. در عوض سکوت و حس مقیاسی را در تونل طبقهٔ دوم
    می‌یابید که هیچ غار مجهزی به شما نمی‌دهد.


    نهشته‌های استخوانی همان چیزی است که متخصصان را باز می‌گرداند. در لایه‌ها استخوان جانوری فراوان است
    — تا چهل گونه شناسایی شده — و توالی نهشته‌ها نوسان‌های اقلیمی پلیستوسن را ثبت کرده است. برای بازدیدکننده
    تقریباً هیچ‌کدام دیدنی نیست، اما توضیح می‌دهد چرا کنار غاری بی‌روشنایی هر تابستان اردوی باستان‌شناسی
    برپاست.
  tip: >-
    دو ساعت با احتساب رفت‌وبرگشت پیاده. چراغ‌قوه — و یکی یدکی — ضروری است و نور تلفن کافی نیست. لباسی
    بپوشید که گِلی شدنش مهم نباشد؛ مسیر تا دهانه تند است و در هوای مرطوب لیز. تنها وارد نشوید و کوشش نکنید
    میان طبقه‌های بالا بالا بروید، چون گذرگاه‌ها خطرناک‌اند. در زمستان و اوایل بهار سطح آب بالاست و طبقه‌های
    پایین دسترس‌ناپذیرند. سرویس بهداشتی و کافه و باجهٔ بلیت وجود ندارد؛ نزدیک‌ترین مغازه در روستاست.
  route: >-
    از تفلیس با E60 از کنار زستافونی و ترجولا بگذرید و سپس به شمال و به سوی تسوتسخواتی بپیچید — روی‌هم
    حدود ۲۱۵ کیلومتر و سه ساعت و ربع. آسفالت تا روستا می‌رسد و دو سه کیلومتر آخر به سمت تنگه شن و خاک
    است. در هوای خشک یک کراس‌اوور هم از پس آن برمی‌آید، اما پس از باران واقعاً به ارتفاع کف خودرو نیاز
    دارید. سوخت را در زستافونی یا ترجولا بگیرید. خودرو را در انتهای روستا، جایی که مسیر پیاده آغاز می‌شود،
    بگذارید.
he:
  name: מערות צוצחוואטי
  short: מערכת קרסטית בת שלוש־עשרה קומות בגיא צ'ישורה, שבה נחפרו עקבות ניאנדרטלים.
  body: >-
    **צוצחוואטי היא מערכת המערות המורכבת בגאורגיה, והיא אינה מערה מתויירת.** היא נמצאת בנפת טקיבולי ליד
    הכפר צוצחוואטי, ברכס אוקריבה־ארגווטי, חצובה בקיר גיא צ'ישורה בגובה כ-320 מטר.


    המים חצבו באבן הגיר שלוש־עשרה קומות — אולמות זה מעל זה, שכל אחד נוצר כשהנהר עמד בגובה אחר. הקומות
    העליונות יבשות, ובתחתונות עדיין זורמים מים. הקומה השנייה חריגה: מנהרה טבעית באורך מאתיים מטר, ברוחב
    עשרה עד שלושים מטר ובגובה של עד עשרים ושמונה מטר. זהו גם החלק שהכניסה אליו הקלה ביותר.


    הממצא הארכיאולוגי נמתח מן הפליאולית התיכון ועד תקופת הברונזה. נמצאו חומרים ניאנדרטליים בני כחמישים
    אלף שנה, עדויות לאדם המודרני בין שמונים אלף לשנים־עשר אלף שנה, וכלי אבן שמגיעים אחורה עד ארבע מאות
    אלף שנה. באוספי העצמות זוהו עד ארבעים מיני בעלי חיים. בקומה האחת־עשרה מצאו הארכיאולוגים עצמות ושיניים
    של בעלי חיים שהוקרבו, מסודרות בכוונה. משנת 2017 פועלת כאן משלחת בינלאומית.


    למה לצפות: אין תאורה, אין שביל, אין מעקה. זו מערה פראית, ודרושים פנס, נעליים חזקות ורצוי מלווה מקומי
    שמכיר את הפתחים. בתמורה מקבלים שקט ותחושת ממדים במנהרת הקומה השנייה, שאף מערה מסודרת לא תעניק.


    מרבצי העצמות הם הסיבה שמומחים חוזרים לכאן. בשכבות יש עצמות בעלי חיים בשפע — זוהו עד ארבעים מינים —
    ורצף המרבצים מתעד את תנודות האקלים של הפלייסטוקן. כמעט דבר מזה אינו נראה למבקר, אך זה מסביר מדוע ליד
    מערה בלי תאורה עומד בכל קיץ מחנה חפירות.
  tip: >-
    שעתיים כולל ההליכה. פנס — ורזרבי — הוא חובה; אור טלפון אינו מספיק. לבשו בגדים שלא אכפת לכם ללכלך,
    שכן השביל אל הפתח תלול וחלקלק ברטיבות. אל תיכנסו לבד ואל תנסו לטפס בין הקומות העליונות: המעברים מסוכנים.
    בחורף ובתחילת האביב מפלס המים גבוה והמפלסים התחתונים אינם נגישים. אין כאן שירותים, בית קפה או קופה;
    החנות הקרובה בכפר.
  route: >-
    מטביליסי בכביש E60 ליד זסטפוני וטרז'ולה, ואז פנייה צפונה לכיוון צוצחוואטי — כ-215 ק״מ בסך הכול, שלוש
    שעות ורבע. האספלט מגיע עד הכפר, ושניים-שלושה הקילומטרים האחרונים אל הגיא הם חצץ ואדמה. ברכב פנאי־שטח
    קל אפשר בימים יבשים, אך אחרי גשם דרוש גובה סרן. תדלקו בזסטפוני או בטרז'ולה. משאירים את הרכב בקצה הכפר,
    במקום שבו מתחיל השביל.
ar:
  name: كهوف تسوتسخفاتي
  short: منظومة كارستية من ثلاث عشرة طبقة في وادي تشيشورا، نُقّب فيها عن آثار إنسان نياندرتال.
  body: >-
    **تسوتسخفاتي أعقد منظومة كهفية في جورجيا، وهي ليست كهفاً مهيّأً للزوار.** تقع في بلدية تكيبولي قرب
    قرية تسوتسخفاتي، في سلسلة أوكريبا‑أرغفيتي، محفورة في جدار وادي تشيشورا على ارتفاع نحو 320 متراً.


    حفر الماء في الحجر الجيري ثلاث عشرة طبقة: أروقة فوق بعضها، تشكّلت كل واحدة حين كان النهر عند منسوب
    مختلف. الطوابق العليا جافة، وما زال الماء يجري في أدناها. والطابق الثاني استثنائي: نفق طبيعي طوله
    مئتا متر وعرضه من عشرة إلى ثلاثين متراً وارتفاعه حتى ثمانية وعشرين متراً. وهو أيضاً أسهل الأجزاء دخولاً.


    تمتد اللقى الأثرية من العصر الحجري القديم الأوسط إلى العصر البرونزي. وقد أنتج التنقيب مواد نياندرتالية
    عمرها نحو خمسين ألف سنة، وأدلة على الإنسان الحديث بين ثمانين ألفاً واثني عشر ألف سنة، وأدوات حجرية
    تعود إلى أربعمئة ألف سنة. وحُدّد في مجموعات العظام ما يصل إلى أربعين نوعاً حيوانياً. وفي الطابق الحادي
    عشر وجد الأثريون عظاماً وأسناناً لحيوانات ذُبحت قرباناً ورُتّبت عمداً. وتعمل هنا بعثة دولية منذ 2017.


    ما ينبغي توقعه: لا إضاءة ولا ممشى ولا درابزين. هذا كهف بري، وتحتاج إلى مصباح وحذاء متين ويفضَّل مرافق
    محلي يعرف المداخل. وفي المقابل تنال في نفق الطابق الثاني سكوناً وإحساساً بالحجم لن يمنحك إياه أي كهف
    مجهّز.


    الرواسب العظمية هي السبب الذي يعيد المختصين إلى هنا. فعظام الحيوانات وافرة في الطبقات — حُدّد ما يصل
    إلى أربعين نوعاً — ويسجّل تعاقب الرواسب تقلبات المناخ في العصر البليستوسيني. ولا يكاد الزائر يرى شيئاً
    من ذلك، لكنه يفسّر لماذا يقوم بجوار كهف بلا إضاءة مخيم تنقيب كل صيف.
  tip: >-
    ساعتان بما فيها المسير. المصباح — ومعه احتياطي — ضروري، وضوء الهاتف لا يكفي. البس ما لا تأسف على اتساخه
    بالطين، فالدرب إلى المدخل شديد الانحدار وزلق عند الرطوبة. لا تدخل وحدك ولا تحاول التسلق بين الطوابق
    العليا، فالمعابر خطرة. وفي الشتاء وأوائل الربيع يرتفع منسوب الماء وتتعذّر المستويات السفلى. ولا توجد
    دورات مياه ولا مقهى ولا شباك تذاكر؛ وأقرب متجر في القرية.
  route: >-
    من تبليسي على الطريق E60 مروراً بزستافوني وترجولا، ثم انعطف شمالاً نحو تسوتسخفاتي — نحو 215 كم إجمالاً
    وثلاث ساعات وربع. يصل الإسفلت إلى القرية، والكيلومتران أو الثلاثة الأخيرة نحو الوادي حصى وتراب. تكفي
    سيارة مرتفعة قليلاً في الجو الجاف، أما بعد المطر فتحتاج فعلاً إلى خلوص أرضي. تزوّد بالوقود في زستافوني
    أو ترجولا. واترك السيارة في آخر القرية حيث يبدأ الممر.
