ka:
  name: ცუცხვათის მღვიმეები
  short: >-
    ცამეტსართულიანი კარსტული მღვიმე ჩიშურას ხეობაში, სადაც ნეანდერტალელები ბინადრობდნენ, მღვიმის დათვის
    თავის ქალები კი ვიღაცამ გულდასმით დაალაგა.
  body: >-
    **ცუცხვათი ერთი მღვიმე კი არა, მღვიმეების კოშკია: ცამეტი სართული, რომელიც კირქვაში ერთმა პატარა მდინარემ
    გამოკვეთა.** მდინარე შაბათაღელე, რომელსაც მღვიმის ქვემოთ უკვე ჩიშურა ჰქვია, ოკრიბის კირქვის მასივს
    იმდენ ხანს ღრღნის, რომ მისი ყოველი მიტოვებული კალაპოტი ცალკე სართულად შემორჩა. პროფესორ ლევან მარუაშვილის
    ექსპედიციამ 75-მეტრიან ვერტიკალურ ჭრილში ცამეტი სართული დაითვალა. ადგილობრივები ამ ადგილს უბრალოდ
    „მაღარას“ ეძახიან.


    ყველაზე ქვედა სართული ადამიანისთვის გაუვალი ვიწრო ხვრელია, რომელშიც მდინარე მთელი წლის განმავლობაში
    მიედინება. მეორე სართული მთავარი ტალანია — უზარმაზარი ბუნებრივი გვირაბი, 200 მეტრი სიგრძის, 10–30
    მეტრი სიგანისა და 28 მეტრამდე სიმაღლის. განშტოებებში წყაროები, პატარა ტბა და კალციტის ნაწვეთი ფორმებია,
    ჭერთან კი ადამიანის ხელით დამაგრებული ძელები შემორჩა — უძველესი საკულტო ნაგებობის ნაშთი.


    მეოთხე სართულიდან ზემოთ მღვიმეები მშრალია და ადამიანი მათ უხსოვარი დროიდან იყენებდა. მეხუთე სართულის
    ბრინჯაოს მღვიმეში 12–13 მეტრის სისქის ნალექია, რომელშიც ბოლო 140 000 წლის კლიმატის ცვლილებებია ჩაწერილი.
    ბავშვის კბილი ნეანდერტალელისად დადასტურდა და დაახლოებით 50 000 წლით დათარიღდა, თანამედროვე ადამიანის
    კვალი 80 000-დან 12 000 წლამდე პერიოდს განეკუთვნება, ქვის იარაღების ასაკი კი 400 000 წლამდეც აღწევს.
    მეთერთმეტე სართულზე, ზედა მღვიმეში, მღვიმის დათვის საგანგებოდ დალაგებული თავის ქალები, ბარძაყის ძვლები
    და კბილები იპოვეს. მეშვიდე–მეცხრე სართულების სამი მღვიმე შუა საუკუნეებში სიმაგრედ იქცა: ქვითკირის
    კედლები, გამოკვეთილი საფეხურები და ქვევრის ნატეხები დღემდე ჩანს, იქვე კი ღამურების დიდი კოლონია ბინადრობს.


    2017 წლიდან აქ საერთაშორისო ექსპედიცია — საქართველოს, საფრანგეთისა და აშშ-ის არქეოლოგები და ორმოცდაათამდე
    ადგილობრივი სტუდენტი — გათხრებს აწარმოებს. დანარჩენებს რჩება დიდი გვირაბი, ფარნის სხივი და შეგრძნება,
    რომ ათეულ ათასობით წლის განმავლობაში ეს ვიღაცის სახლის ზღურბლი იყო.
  tip: >-
    ორი საათი დაუთმეთ, მისვლა-მოსვლის ჩათვლით. განათება, ბილიკი და სალარო აქ არ არის: წამოიღეთ ძლიერი
    ფარანი და სათადარიგოც, ჩაიცვით არასრიალა ძირიანი ფეხსაცმელი და ისეთი ტანსაცმელი, რომლის დასვრაც არ
    დაგენანებათ. მეორე სართულის დიდ გვირაბში დარჩით — ზედა სართულები არქეოლოგიური ძეგლია, მათ შორის ასვლა
    კი სახიფათოა. ღამურებს ნუ შეაწუხებთ. შაბათაღელემ შეიძლება მთავარი ტალანი დატბოროს, ამიტომ ძლიერი წვიმის
    შემდეგ და გაზაფხულზე, თოვლის დნობისას, აქ ნუ მოხვალთ. მარტო ნუ წახვალთ და გეგმა ვინმეს წინასწარ უთხარით
    — მიწისქვეშ მობილური კავშირი არ არის. უახლოესი მაღაზია სოფელშია.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთისკენ იმგზავრეთ თერჯოლის გასაყრელამდე (დაახლოებით 190 კმ), შემდეგ ჩრდილოეთით,
    შ19-ით, თერჯოლის გავლით ტყიბულისკენ აიღეთ გეზი. ტყიბულამდე ცოტა ადრე დასავლეთით, ქუთაისისკენ მიმავალ
    შ17-ზე გადადით და ადგილობრივ გზებს ორპირამდე გაჰყევით, საიდანაც შ201 მღვიმემდე მიდის. სულ დაახლოებით
    240 კმ და სამი საათი და ორმოცი წუთი. ბოლო კილომეტრებზე გზა ვიწროვდება და უარესდება: მშრალ ამინდში
    ფრთხილი კროსოვერი გაივლის, წვიმის შემდეგ კი SUV-ის კლირენსი დაგჭირდებათ. საწვავი ზესტაფონში ან თერჯოლაში
    ჩაასხით — ბოლო მონაკვეთზე აღარაფერია.
en:
  name: Tsutskhvati Caves
  short: >-
    A thirteen-storey karst cave in the Chishura gorge, where Neanderthals camped and someone once laid
    out cave-bear skulls with care.
  body: >-
    **Tsutskhvati is not one cave but a tower of them: thirteen storeys carved into the limestone by one
    small river.** The Shabataghele, which becomes the Chishura below the cave, has been cutting down
    through the Okriba massif for so long that each abandoned riverbed survives as a separate floor. Professor
    Levan Maruashvili’s expedition counted thirteen in a vertical section of 75 metres. Locals simply
    call the place Maghara.


    The lowest floor is a slot too narrow for a person, and the river runs through it all year. The second
    is the main gallery, a natural tunnel 200 metres long, 10 to 30 metres wide and up to 28 metres high.
    Its side passages hold springs, a small lake and calcite flowstone, and beams fixed to the ceiling
    by human hands survive from an ancient cult structure.


    From the fourth floor up the caves are dry, and people have used them since deep prehistory. In the
    Bronze Cave on the fifth floor, 12–13 metres of sediment record 140,000 years of climate change. A
    child’s tooth has been confirmed as Neanderthal and dated to about 50,000 years ago, traces of modern
    humans fall between 80,000 and 12,000 years ago, and stone tools are dated as far back as 400,000
    years. In the Upper Cave on the eleventh floor, excavators found cave-bear skulls, thigh bones and
    teeth deliberately arranged. Three caves on floors seven to nine were walled into refuges in the Middle
    Ages; mortared walls, cut steps and wine-jar shards remain, along with a large colony of bats.


    Since 2017 an international team from Georgia, France and the United States has been excavating here
    with around fifty local students. Everyone else gets the great tunnel, a torch beam and the knowledge
    that, for tens of thousands of years, this was someone’s doorstep.
  tip: >-
    Allow two hours, including the walk in. There is no lighting, walkway or ticket office, so bring a
    strong torch and a spare, boots with grip and clothes you do not mind muddying. Stay in the great
    second-floor tunnel: the upper storeys are archaeological sites and the climbs between them are dangerous.
    Leave the bats in peace. The Shabataghele can flood the main gallery, so stay away after heavy rain
    and during the spring melt. Never go alone, and tell someone your plan, as there is no phone signal
    underground. The nearest shop is in the village.
  route: >-
    Take the E60 (S1) west from Tbilisi to the Terjola turn-off, about 190 km, then head north on the
    Sh19 through Terjola towards Tkibuli. Just short of Tkibuli, bear west on the Sh17 towards Kutaisi
    and follow local roads to Orpiri, where the Sh201 lane leads to the cave. That makes about 240 km
    and three hours forty in all. The lane is narrow and deteriorates on the final kilometres: a careful
    crossover copes in the dry, but after rain you want an SUV’s clearance. Fuel up in Zestaponi or Terjola,
    as there is nothing on the last stretch.
ru:
  name: Пещеры Цуцхвати
  short: >-
    Тринадцатиэтажная карстовая пещера в ущелье Чишура, где были стоянки неандертальцев и кто-то бережно
    разложил черепа пещерных медведей.
  body: >-
    **Цуцхвати — не одна пещера, а целая башня пещер: тринадцать этажей, вырезанных в известняке одной
    небольшой рекой.** Шабатагеле, которая ниже пещеры становится Чишурой, так долго врезалась в массив
    Окриба, что каждое покинутое русло сохранилось отдельным этажом. Экспедиция профессора Левана Маруашвили
    насчитала тринадцать этажей на вертикальном участке в 75 метров. Местные жители просто называют это
    место Магара.


    Самый нижний этаж — щель, слишком узкая для человека, и река течёт через неё весь год. Второй — главная
    галерея, естественный туннель длиной 200 метров, шириной от 10 до 30 метров и высотой до 28 метров.
    В её боковых ходах — источники, небольшое озеро и кальцитовые натёки, а балки, закреплённые в потолке
    человеческими руками, сохранились от древнего культового сооружения.


    Начиная с четвёртого этажа пещеры сухие, и люди пользовались ими с глубокой древности. В Бронзовой
    пещере на пятом этаже 12–13 метров отложений хранят летопись климата за 140 000 лет. Принадлежность
    детского зуба неандертальцу подтверждена, его возраст — около 50 000 лет; следы людей современного
    типа относятся к периоду от 80 000 до 12 000 лет назад, а каменные орудия датированы возрастом до
    400 000 лет. В Верхней пещере на одиннадцатом этаже археологи нашли черепа, бедренные кости и зубы
    пещерных медведей, намеренно разложенные. Три пещеры на седьмом-девятом этажах были в Средние века
    замурованы и превращены в убежища; сохранились стены, сложенные на растворе, вырубленные ступени и
    черепки винных кувшинов, а также большая колония летучих мышей.


    С 2017 года международная команда из Грузии, Франции и США ведёт здесь раскопки с участием около пятидесяти
    местных студентов. Всем остальным достаются большой туннель, луч фонаря и знание, что десятки тысяч
    лет здесь был чей-то порог.
  tip: >-
    Отведите два часа, включая пеший подход. Освещения, настилов и кассы здесь нет, так что берите мощный
    фонарь и запасной, обувь с хорошим сцеплением и одежду, которую не жалко испачкать. Оставайтесь в
    большом туннеле второго этажа: верхние этажи — археологические объекты, а подъёмы между ними опасны.
    Не тревожьте летучих мышей. Шабатагеле может затопить главную галерею, так что не ходите туда после
    сильных дождей и во время весеннего паводка. Никогда не идите одни и сообщите кому-то о своих планах,
    поскольку под землёй сигнала мобильной связи нет. Ближайший магазин — в деревне.
  route: >-
    Двигайтесь по трассе E60 (S1) на запад от Тбилиси до поворота на Терджолу, около 190 км, затем на
    север по дороге Ш19 через Терджолу в сторону Ткибули. Немного не доезжая Ткибули, сверните на запад
    на дорогу Ш17 в сторону Кутаиси и по местным дорогам доберитесь до Орпири, откуда к пещере ведёт дорога
    Ш201. Всего получается около 240 км и три часа сорок минут. Дорога узкая и ухудшается на последних
    километрах: аккуратный кроссовер справится в сухую погоду, но после дождя нужен клиренс внедорожника.
    Заправляйтесь в Зестафони или Терджоле — на последнем участке ничего нет.
fa:
  name: غارهای تسوتسخواتی
  short: >-
    غاری کارستی سیزده‌طبقه در دره چیشورا، جایی که نئاندرتال‌ها اردو زدند و کسی جمجمه‌های خرس غاری را با
    دقت چیده بود.
  body: >-
    **تسوتسخواتی یک غار نیست، بلکه برجی از غارهاست: سیزده طبقه که رودی کوچک در سنگ آهک تراشیده است.**
    رود شاباتاغله، که در پایین غار به چیشورا بدل می‌شود، چنان دیرزمانی در توده آهکی اوکریبا فرو بریده
    که هر بستر رودخانه‌ای رهاشده به‌صورت طبقه‌ای جدا باقی مانده است. هیئت اعزامی پروفسور لوان مارواشویلی
    سیزده طبقه را در بریدگی عمودی ۷۵ متری شمرد. مردم محلی این‌جا را به‌سادگی مغاره می‌نامند.


    پایین‌ترین طبقه شکافی است تنگ‌تر از آن‌که انسان از آن بگذرد، و رودخانه تمام سال از آن جریان دارد.
    طبقه دوم رواق اصلی است، تونلی طبیعی به درازای ۲۰۰ متر، پهنای ۱۰ تا ۳۰ متر، و بلندی تا ۲۸ متر. راهروهای
    جانبی‌اش چشمه‌ها، دریاچه‌ای کوچک و رسوبات جریانیِ کلسیتی در بر دارند، و تیرهایی که به دست انسان بر
    سقف نصب شده‌اند از ساختاری آیینی کهن بازمانده‌اند.


    از طبقه چهارم به بالا غارها خشک‌اند، و مردم از ژرفای دوران پیش از تاریخ از آن‌ها استفاده کرده‌اند.
    در غار برنزی، طبقه پنجم، ۱۲ تا ۱۳ متر رسوب ۱۴۰٬۰۰۰ سال تغییر آب‌وهوا را ثبت کرده است. تأیید شده که
    دندان کودکی از آنِ یک نئاندرتال است و قدمتش به حدود ۵۰٬۰۰۰ سال پیش می‌رسد، آثار انسان مدرن به میان
    ۸۰٬۰۰۰ و ۱۲٬۰۰۰ سال پیش تعلق دارد، و ابزارهای سنگی تا ۴۰۰٬۰۰۰ سال پیش تاریخ‌گذاری شده‌اند. در غار
    بالایی، طبقه یازدهم، کاوشگران جمجمه‌ها، استخوان‌های ران و دندان‌های خرس غاری را یافتند که عمداً چیده
    شده بودند. سه غار در طبقات هفتم تا نهم در سده‌های میانه به پناهگاه‌هایی دیواردار بدل شدند؛ دیوارهای
    ملاطی، پله‌های تراشیده و خرده‌های خمره شراب هنوز باقی‌اند، در کنار دسته‌ای بزرگ از خفاش‌ها.


    از سال ۲۰۱۷ تیمی بین‌المللی از گرجستان، فرانسه و ایالات متحده با نزدیک به پنجاه دانشجوی محلی در این‌جا
    کاوش می‌کند. برای دیگران فقط تونل بزرگ، پرتو چراغ‌قوه، و این آگاهی می‌ماند که ده‌ها هزار سال، این‌جا
    آستانه در خانه کسی بود.
  tip: >-
    دو ساعت زمان بگذارید، با احتساب پیاده‌روی تا غار. نور، پیاده‌راه یا باجه بلیتی نیست، پس چراغ‌قوه‌ای
    قوی و یکی یدکی، پوتینی با کف ضدلغزش و لباسی که از گِلی شدنش نگران نباشید همراه داشته باشید. در تونل
    بزرگ طبقه دوم بمانید: طبقات بالاتر محل‌های باستان‌شناسی‌اند و صعود میان آن‌ها خطرناک است. خفاش‌ها
    را به حال خود بگذارید. شاباتاغله می‌تواند رواق اصلی را به آب فروبرد، بنابراین پس از باران‌های سنگین
    و در زمان آب‌شدن برف‌ها در بهار از آن دور بمانید. هرگز تنها نروید، و برنامه‌تان را به کسی بگویید،
    چراکه زیر زمین آنتن تلفن همراه نیست. نزدیک‌ترین مغازه در روستاست.
  route: >-
    از تفلیس بر جاده E60 (S1) به سوی غرب تا دوراهی ترجولا حرکت کنید، حدود ۱۹۰ کیلومتر، سپس به سوی شمال
    بر جاده Sh19 از میان ترجولا به سوی تکیبولی بروید. کمی پیش از تکیبولی، به سمت غرب وارد جاده Sh17 (به
    سوی کوتایسی) شوید و از راه‌های محلی تا اورپیری بروید، جایی که جاده فرعی Sh201 به غار می‌رسد. در مجموع
    حدود ۲۴۰ کیلومتر و سه ساعت و چهل دقیقه می‌شود. این جاده باریک است و در کیلومترهای پایانی وضعش بد می‌شود:
    کراس‌اوری با احتیاط در هوای خشک کافی است، اما پس از باران فاصلهٔ کف تا زمینِ یک شاسی‌بلند لازم است.
    در زستافونی یا ترجولا سوخت‌گیری کنید، چون در بخش پایانی هیچ‌چیز نیست.
he:
  name: מערות צוצחואטי
  short: מערת קארסט בת שלוש-עשרה קומות בגיא צ'ישורה, שבה חנו ניאנדרטלים ומישהו סידר בקפידה גולגלות של
    דובי מערות.
  body: >-
    **צוצחואטי איננה מערה אחת אלא מגדל של מערות: שלוש עשרה קומות שחצב נהר קטן אחד באבן הגיר.** נהר שבתאגלה,
    שהופך לצ'ישורה מתחת למערה, חתך את מסיף אוקריבה זמן כה רב שכל אפיק נהר נטוש שרד כקומה נפרדת. משלחתו
    של פרופסור לוואן מארואשווילי ספרה שלוש עשרה קומות בחתך אנכי של 75 מטרים. התושבים המקומיים קוראים למקום
    פשוט 'מגרה'.


    הקומה התחתונה היא סדק צר מכדי שאדם יעבור בו, והנהר זורם בו כל השנה. הקומה השנייה היא הגלריה המרכזית,
    מנהרה טבעית באורך 200 מטרים, ברוחב 10 עד 30 מטרים ובגובה של עד 28 מטרים. במעברים הצדדיים שלה מעיינות,
    אגם קטן ותצורות זרימה של קלציט, וקורות שקבעו ידי אדם בתקרה שרדו ממבנה פולחני עתיק.


    מהקומה הרביעית ומעלה המערות יבשות, ואנשים השתמשו בהן מאז הפרהיסטוריה העמוקה. במערת הברונזה שבקומה
    החמישית, 12–13 מטרים של שכבות משקעים מתעדים 140,000 שנות שינוי אקלים. שן של ילד אושרה כשן ניאנדרטלית
    ותוארכה לפני כ-50,000 שנה, עקבות האדם המודרני מתוארכים לתקופה שבין 80,000 ל-12,000 שנה לפני זמננו,
    וכלי אבן תוארכו עד לפני 400,000 שנה. במערה העילית שבקומה האחת-עשרה מצאו החופרים גולגלות, עצמות ירך
    ושיניים של דובי מערות, שסודרו בכוונה. שלוש מערות בקומות שבע עד תשע נחסמו בקירות והפכו למקומות מחסה
    בימי הביניים; קירות בנויים בטיט, מדרגות חצובות ושברי כדי יין שרדו, לצד קולוניית עטלפים גדולה.


    מאז 2017 חופר כאן צוות בין-לאומי מגיאורגיה, צרפת וארצות הברית, בעזרת כחמישים סטודנטים מקומיים. לכל
    האחרים נותרות המנהרה הגדולה, קרן אור של פנס, והידיעה שבמשך עשרות אלפי שנים היה זה סף ביתו של מישהו.
  tip: >-
    הקדישו שעתיים, כולל ההליכה אל המערה. אין תאורה, שביל מוסדר או קופה, אז הביאו פנס חזק ופנס רזרבי, נעליים
    עם אחיזה טובה ולבוש שלא תצטערו שיתלכלך. הישארו במנהרה הגדולה של הקומה השנייה: הקומות העליונות הן אתרי
    חפירה ארכיאולוגיים והטיפוס ביניהן מסוכן. הניחו לעטלפים לנפשם. שבתאגלה עלול להציף את הגלריה המרכזית,
    אז התרחקו מהמקום אחרי גשמים חזקים ובזמן הפשרת השלגים באביב. לעולם אל תלכו לבד, ומסרו למישהו את התוכנית,
    שכן אין קליטת טלפון מתחת לאדמה. החנות הקרובה ביותר נמצאת בכפר.
  route: >-
    נסעו בכביש E60 (S1) מטביליסי מערבה עד לפניה לטרג'ולה, כ-190 ק"מ, ואז צפונה בכביש Sh19 דרך טרג'ולה
    לעבר טקיבולי. ממש לפני טקיבולי, פנו מערבה בכביש Sh17 לעבר קוטאיסי והמשיכו בכבישים מקומיים עד אורפירי,
    שם מוביל הכביש המקומי Sh201 למערה. בסך הכול כ-240 ק"מ ושלוש שעות וארבעים דקות. הדרך צרה ומתדרדרת בקילומטרים
    האחרונים: קרוסאובר בנהיגה זהירה יעבור במזג אוויר יבש, אך אחרי גשם דרוש מרווח גחון של רכב שטח. תדלקו
    בזסטפוני או בטרג'ולה, שכן בקטע האחרון אין שום תחנה.
ar:
  name: كهوف تسوتسخفاتي
  short: >-
    كهف كارستي من ثلاث عشرة طبقة في وادي تشيشورا، حيث خيّم إنسان نياندرتال وحيث رتّب أحدهم يومًا جماجم
    دببة الكهوف بعناية.
  body: >-
    **تسوتسخفاتي ليس كهفًا واحدًا بل برجًا من الكهوف: ثلاث عشرة طبقة نحتها نهر صغير واحد في الحجر الجيري.**
    فنهر شاباتاغيلي، الذي يتحوّل إلى تشيشورا تحت الكهف، ظلّ يحفر كتلة أوكريبا الصخرية طويلًا حتى بقي كل
    مجرى مهجور طبقة مستقلة. وعدّت بعثة البروفيسور ليفان مارواشفيلي ثلاث عشرة طبقة في مقطع عمودي بلغ 75
    مترًا. ويسمّي السكان المحليون المكان ببساطة ماغارا.


    الطبقة السفلى شقّ أضيق من أن يعبره إنسان، ويجري النهر خلاله طوال السنة. والطبقة الثانية هي الدهليز
    الرئيسي، نفق طبيعي يمتد 200 متر بعرض يتراوح بين 10 و30 مترًا وارتفاع يصل إلى 28 مترًا. وتحوي ممرّاته
    الجانبية عيونًا وبحيرة صغيرة ورواسب كلسية انسيابية، وما زالت في سقفه عوارض ثبّتتها أيدٍ بشرية، بقايا
    منشأة عبادية قديمة.


    ومن الطبقة الرابعة فما فوق تكون الكهوف جافّة، وقد استخدمها الناس منذ عصور ما قبل التاريخ الغابرة.
    وفي كهف البرونز عند الطبقة الخامسة، تسجّل رواسب بعمق 12 إلى 13 مترًا 140 ألف سنة من التغيّر المناخي.
    وثبت أن سنَّ طفلٍ عُثر عليها تعود إلى إنسان نياندرتال، ويرجع تاريخها إلى نحو 50 ألف سنة، وتعود آثار
    الإنسان الحديث إلى ما بين 80 ألف سنة و12 ألف سنة مضت، ويرجع عمر أقدم الأدوات الحجرية إلى نحو 400 ألف
    سنة. وفي الكهف العلوي عند الطبقة الحادية عشرة، عثر المنقّبون على جماجم وعظام فخذ وأسنان لدببة الكهوف
    رُتّبت عمدًا. وحُوّلت ثلاثة كهوف عند الطبقات السابعة إلى التاسعة إلى ملاجئ مسوّرة في العصور الوسطى؛
    وبقيت منها جدران مبنيّة بالملاط، ودرجات محفورة، وشقف من جرار خمر، إلى جانب مستعمرة كبيرة من الخفافيش.


    ومنذ عام 2017 يحفر هنا فريق دولي من جورجيا وفرنسا والولايات المتحدة بمعاونة نحو خمسين طالبًا محليًا.
    وليس لبقية الزائرين إلا النفق الكبير، وشعاع مصباح يدوي، ومعرفة أن هذا كان، لعشرات آلاف السنين، عتبة
    بيت أحدهم.
  tip: >-
    خصّص ساعتين، بما في ذلك المسير للوصول. لا إضاءة ولا ممرّ مُعد ولا شبّاك تذاكر، فاحمل مصباحًا قويًا
    وآخر احتياطيًا، وحذاءً جيّد القبضة، وثيابًا لا يهمّك اتساخها. التزم بالنفق الكبير في الطبقة الثانية:
    فالطبقات العلوية مواقع أثرية والتسلّق بينها خطِر. اترك الخفافيش بسلام. قد يُغرِق نهر شاباتاغيلي الدهليز
    الرئيسي، فتجنّبه بعد الأمطار الغزيرة وخلال ذوبان الثلوج الربيعي. لا تذهب أبدًا وحدك، وأخبر أحدًا بخطتك،
    فلا تغطية هاتفية تحت الأرض. أقرب متجر في القرية.
  route: >-
    اتبع الطريق E60 (S1) غربًا من تبليسي حتى مفرق تيرجولا، على مسافة نحو 190 كم، ثم اتجه شمالًا على طريق
    Sh19 عبر تيرجولا نحو تكيبولي. وقبل تكيبولي بقليل، انحرف غربًا على طريق Sh17 نحو كوتايسي واتبع الطرق
    المحلية حتى أوربيري، حيث يقود طريق Sh201 إلى الكهف. فيكون المجموع نحو 240 كم وثلاث ساعات وأربعين دقيقة.
    الطريق ضيّق ويتدهور في الكيلومترات الأخيرة: تجتازه سيارة كروس أوفر بقيادة حذرة في الطقس الجاف، لكن
    بعد المطر يلزم ارتفاع سيارة دفع رباعي عن الأرض. تزوّد بالوقود في زيستافوني أو تيرجولا، فلا شيء في
    المقطع الأخير.
