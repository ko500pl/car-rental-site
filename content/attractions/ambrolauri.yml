ka:
  name: ამბროლაური
  short: >-
    საქართველოს უმცირესი რეგიონული ცენტრი რიონზე, 550 მეტრზე: მაჩაბლის კოშკი, სახვითი ხელოვნების მუზეუმი,
    რაჭული სუფრა და ბოლო მოსახერხებელი საწვავი.
  body: >-
    **ამბროლაური საქართველოს ყველაზე პატარა რეგიონული ცენტრია და ამ წოდებას ზედმეტი ხმაურის გარეშე ატარებს.**
    რიონის ორივე ნაპირზე, კრიხულის შესართავთან, ზღვის დონიდან 550 მეტრზე, დაახლოებით 1960 კაცი ცხოვრობს.
    1968 წელს აქ 4400 ადამიანი ცხოვრობდა — ამ ორ რიცხვს შორის მთის საქართველოს მთელი ამბავი ეტევა.


    ქალაქი იმაზე ძველია, ვიდრე ერთი შეხედვით ჩანს. აქ იმერეთის მეფეთა ერთ-ერთი რეზიდენცია იდგა: შესართავთან
    მდგარი სამეფო ციხე-დარბაზი 1650 წელს რუსმა ელჩმა ალექსეი ევლევმა ნახა, დაახლოებით 1745 წელს კი ვახუშტი
    ბატონიშვილმაც აღწერა — დღეს მისგან მხოლოდ უმნიშვნელო ნანგრევებია დარჩენილი. 1769 წელს სოლომონ I-მა
    ამბროლაური თავად ზურაბ მაჩაბელს უბოძა; ქვითკირის სამსართულიან კოშკს ადგილობრივები დღესაც მაჩაბლის
    კოშკს ეძახიან. 1934 წელს საბჭოთა ხელისუფლებამ ქალაქს ბოლშევიკ აბელ ენუქიძის სახელი დაარქვა, 1937 წელს
    კი, ენუქიძის დახვრეტის შემდეგ, ძველი სახელი დაუბრუნა. 1991 წლის რაჭის მიწისძვრამ აქაც დატოვა კვალი.


    დღეს ამბროლაური რაჭული სუფრის კარიბჭეა. ეს ლორის მხარეა — მარილში დაყენებულის და ზამთრის განმავლობაში
    ნელა შებოლილის — და თიხის ქოთანში გამომცხვარი ლობიოსი; შქმერული, ნივრიან-რძიანი ქათამი, რომელიც დღეს
    თბილისის თითქმის ყველა მენიუშია, სახელს ზემო რაჭის სოფელ შქმერს უნდა უმადლოდეს. ქალაქის ქვემოთ ხვანჭკარის
    ვენახები იწყება და სექტემბრის ბოლოდან ხეობას დაწურული ყურძნის სუნი ასდის. წვიმიან საათს სახვითი ხელოვნების
    მუზეუმში გაატარებთ, ქალაქის პატარა აეროპორტი კი, 2017 წელს გახსნილი, 1,1-კილომეტრიანი ასაფრენ-დასაფრენი
    ზოლით მსუბუქ თვითმფრინავებს იღებს.


    მოგზაურთა უმეტესობა ამბროლაურს მხოლოდ საქარე მინიდან ხედავს, უფრო მაღლა მიმავალ გზაზე. ერთი საღამო
    მდინარის პირას აჩუქეთ — და ის სანაცვლოდ რაჭას მინიატურაში გაჩვენებთ.
  tip: >-
    ქალაქის სანახავად ორი საათი საკმარისია: სახვითი ხელოვნების მუზეუმი, მაჩაბლის კოშკი და გასეირნება რიონის
    პირას. ამბროლაური ბაზად და მარაგის შესავსებ წერტილად გამოიყენეთ — ნაღდი ფული აქ აიღეთ, რადგან სოფლის
    სასტუმროების დიდი ნაწილი ბარათს არ იღებს, და საწვავიც აქ ჩაასხით, სანამ მაღლა ახვალთ. ივლის-აგვისტოში
    ოთახი წინასწარ დაჯავშნეთ. ზაფხულის შუადღე შეიძლება მხურვალე იყოს — ქალაქში 41,8 გრადუსიც დაფიქსირებულა,
    იანვრის საშუალო ტემპერატურა კი ოდნავ ნულს ქვემოთაა. სექტემბრის ბოლოდან მასპინძელს რთველზე ჰკითხეთ:
    ოჯახურ ვენახში გატარებული დილა ნებისმიერ სადეგუსტაციო დარბაზს სჯობს.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონის გავლით ქუთაისამდე, შემდეგ Sh17-ით ჩრდილოეთით
    — ტყიბულსა და ნაქერალას უღელტეხილზე გადავლით: 313 კმ, დაახლოებით ხუთი საათი და ოცდახუთი წუთი. გზა
    ბოლომდე ასფალტია, მაგრამ ტყიბულ-ნაქერალას მონაკვეთი ვიწროა, მკვეთრი მოსახვევებით სავსე და წიფლის ტყის
    ჩრდილში ხშირად სველი; ზამთარში უღელტეხილზე თოვლი დიდხანს დევს. ალტერნატივა ქუთაისიდან Sh16-ია, რიონის
    ხეობით ალპანას გავლით — დროით დაახლოებით იგივე, უფრო დაბალი და უღელტეხილის გარეშე. საწვავი ზესტაფონში,
    ქუთაისსა და ტყიბულში ჩაასხით. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Ambrolauri
  short: >-
    Georgia's smallest regional capital, astride the Rioni at 550 metres: a princely tower, a fine-arts
    museum, Racha's table and your last easy fuel.
  body: >-
    **Ambrolauri is Georgia's smallest regional capital, and it carries the title without fuss.** Some
    1,960 people live on both banks of the Rioni at 550 metres, where the Krikhula stream joins it. In
    1968 there were 4,400 — the gap between those two numbers is the story of mountain Georgia.


    The town is older than it looks. The kings of Imereti kept a residence here: the Russian envoy Alexey
    Yevlev saw a royal castle at the confluence in 1650, and Prince Vakhushti recorded it again around
    1745, though only scraps of it survive. In 1769 King Solomon I granted Ambrolauri to Prince Zurab
    Machabeli, and a three-storey tower of stone and lime is still known locally as the Machabeli Tower.
    In 1934 the Soviets renamed the place Enukidze, after the Bolshevik Avel Enukidze; when he was shot
    in 1937, the old name came back. The 1991 Racha earthquake left its mark here too.


    Today Ambrolauri is the front door to Racha's table. This is the country of lori, ham salted and slowly
    smoked through the winter, and of lobio baked in clay pots; shkmeruli, the garlic-and-milk chicken
    now on almost every Tbilisi menu, takes its name from Shkmeri, a village in upper Racha. The Khvanchkara
    vineyards begin just downstream, and from late September the valley smells of crushed grapes. A rainy
    hour is well spent in the Museum of Fine Arts, and a small airfield, opened in 2017 with a 1.1 km
    runway, takes light aircraft.


    Most travellers see Ambrolauri only through a windscreen, on the way to somewhere higher. Give it
    one evening by the river, and it will show you Racha in miniature.
  tip: >-
    Two hours cover the town: the Museum of Fine Arts, the Machabeli Tower and a stroll along the Rioni.
    Treat Ambrolauri as your base and supply stop — draw cash here, because many village guesthouses do
    not take cards, and fill the tank before heading higher. Book rooms ahead in July and August. Summer
    afternoons can be fierce: the town has recorded 41.8 °C, while January averages just below freezing.
    From late September, ask your host about the harvest; a morning in a family vineyard beats any tasting
    room.
  route: >-
    From Tbilisi take the S1 (E60) west past Zestaponi to Kutaisi, then the Sh17 north through Tkibuli
    and over the Nakerala pass: 313 km, about five hours and twenty-five minutes. The road is asphalt
    throughout, but the Tkibuli–Nakerala section is narrow, full of tight bends and often damp under the
    beech forest; in winter snow lingers on the pass. The alternative from Kutaisi is the Sh16 up the
    Rioni gorge via Alpana — similar in time, lower, and without the pass. Fuel is available at Zestaponi,
    Kutaisi and Tkibuli. An economy car is entirely sufficient.
ru:
  name: Амбролаури
  short: >-
    Самый маленький региональный центр Грузии, на Риони, 550 м: башня Мачабели, музей изобразительных
    искусств, рачинская кухня и последняя удобная заправка.
  body: >-
    **Амбролаури — самый маленький региональный центр Грузии, и носит он этот титул без всякой суеты.**
    Около 1960 человек живут на обоих берегах Риони на высоте 550 метров, там, где в неё впадает речка
    Крихула. В 1968 году жителей было 4400 — разница между этими двумя числами и есть история горной Грузии.


    Город старше, чем кажется. Здесь была резиденция имеретинских царей: русский посланник Алексей Евлев
    видел царский замок у слияния рек в 1650 году, а царевич Вахушти описал его снова около 1745 года,
    хотя сохранились от него лишь обломки. В 1769 году царь Соломон I пожаловал Амбролаури князю Зурабу
    Мачабели, и трёхэтажную башню из камня на известковом растворе здесь до сих пор называют башней Мачабели.
    В 1934 году советская власть переименовала посёлок в Енукидзе — в честь большевика Авеля Енукидзе;
    когда в 1937 году его расстреляли, старое имя вернулось. Рачинское землетрясение 1991 года оставило
    свой след и здесь.


    Сегодня Амбролаури — парадный вход к рачинскому столу. Это край лори — свиного окорока, который солят
    и всю зиму медленно коптят, — и лобио, запечённого в глиняных горшках; шкмерули, курица в чесночно-молочном
    соусе, которая теперь есть почти в каждом тбилисском меню, названа по Шкмери, селу в Верхней Раче.
    Виноградники Хванчкары начинаются чуть ниже по течению, и с конца сентября долина пахнет давленым
    виноградом. Дождливый час хорошо провести в Музее изобразительных искусств, а небольшой аэродром,
    открытый в 2017 году, с полосой длиной 1,1 км, принимает лёгкие самолёты.


    Большинство путешественников видит Амбролаури только сквозь лобовое стекло, по дороге куда-нибудь
    повыше. Подарите ему один вечер у реки — и он покажет вам Рачу в миниатюре.
  tip: >-
    Двух часов хватит на весь город: Музей изобразительных искусств, башня Мачабели и прогулка вдоль Риони.
    Считайте Амбролаури базой и пунктом снабжения: снимите здесь наличные — многие сельские гостевые дома
    не принимают карты — и заправьтесь, прежде чем подниматься выше. В июле и августе бронируйте комнаты
    заранее. Летом после полудня бывает изнурительно жарко: в городе фиксировали 41,8 °C, а средняя температура
    января чуть ниже нуля. С конца сентября расспросите хозяев о сборе винограда: утро в семейном винограднике
    стоит любого дегустационного зала.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад мимо Зестафони до Кутаиси, затем по Sh17 на север через Ткибули
    и перевал Накерала: 313 км, около пяти часов двадцати пяти минут. Асфальт на всём пути, но участок
    Ткибули — Накерала узкий, с крутыми поворотами и под буковым лесом часто сырой; зимой на перевале
    подолгу лежит снег. Альтернатива от Кутаиси — Sh16 вверх по ущелью Риони через Алпану: по времени
    примерно так же, дорога ниже и без перевала. Заправки есть в Зестафони, Кутаиси и Ткибули. Машины
    эконом-класса вполне достаточно.
fa:
  name: آمبرولائوری
  short: >-
    کوچک‌ترین مرکز منطقه در گرجستان، بر دو کرانهٔ ریونی در ارتفاع ۵۵۰ متری: برجی اشرافی، موزهٔ هنرهای
    زیبا، سفرهٔ راچا و آخرین پمپ بنزینِ در دسترس.
  body: >-
    **آمبرولائوری کوچک‌ترین مرکز منطقه در گرجستان است و این عنوان را بی‌هیاهو بر دوش می‌کشد.** حدود ۱۹۶۰
    نفر بر دو کرانهٔ ریونی در ارتفاع ۵۵۰ متری زندگی می‌کنند، همان‌جا که نهر کریخولا به آن می‌پیوندد. در
    سال ۱۹۶۸ شمار ساکنان ۴۴۰۰ نفر بود؛ فاصلهٔ این دو عدد، داستان گرجستانِ کوهستانی است.


    شهر کهن‌تر از آن است که به چشم می‌آید. پادشاهان ایمرتی اینجا اقامتگاهی داشتند: الکسی یِولِف، فرستادهٔ
    روسیه، در سال ۱۶۵۰ قلعه‌ای شاهی را در محل به‌هم‌پیوستن دو رود دید و شاهزاده واخوشتی حدود سال ۱۷۴۵
    بار دیگر از آن یاد کرد، هرچند امروز جز تکه‌هایی از آن باقی نمانده است. در سال ۱۷۶۹ سولومون یکم، پادشاه
    ایمرتی، آمبرولائوری را به شاهزاده زوراب ماچابلی بخشید، و برجی سه‌طبقه از سنگ و ملات آهک هنوز در زبان
    مردم «برج ماچابلی» خوانده می‌شود. در سال ۱۹۳۴ شوروی‌ها نام اینجا را به یاد آول انوکیدزهٔ بلشویک به
    «انوکیدزه» تغییر دادند؛ وقتی او در سال ۱۹۳۷ تیرباران شد، نام قدیم بازگشت. زمین‌لرزهٔ ۱۹۹۱ راچا اینجا
    هم ردّ خود را بر جا گذاشت.


    امروز آمبرولائوری درگاه سفرهٔ راچاست. اینجا سرزمین لوری است، ران خوکی که نمک‌سودش می‌کنند و سراسر
    زمستان آرام‌آرام دودش می‌دهند، و سرزمین لوبیو که در ظرف‌های سفالی پخته می‌شود؛ شکمرولی، مرغ با سیر
    و شیر که حالا تقریباً در هر منوی تفلیس پیدا می‌شود، نامش را از شکمری، روستایی در راچای علیا، گرفته
    است. تاکستان‌های خوانچکارا کمی پایین‌تر در مسیر رود آغاز می‌شوند و از اواخر سپتامبر دره بوی انگورِ
    لِه‌شده می‌گیرد. ساعتی بارانی را می‌توان به‌خوبی در موزهٔ هنرهای زیبا گذراند، و فرودگاهی کوچک که در
    سال ۲۰۱۷ با باندی ۱٫۱ کیلومتری گشایش یافت، هواپیماهای سبک را می‌پذیرد.


    بیشتر مسافران آمبرولائوری را فقط از پشت شیشهٔ جلوی خودرو می‌بینند، در راهِ جایی بلندتر. یک شب کنار
    رود به آن فرصت بدهید تا راچا را در قابی کوچک به شما نشان دهد.
  tip: >-
    دو ساعت برای دیدن شهر کافی است: موزهٔ هنرهای زیبا، برج ماچابلی و قدم‌زدنی در کنار ریونی. آمبرولائوری
    را پایگاه و ایستگاه تدارکات خود بدانید: پول نقد را همین‌جا بگیرید، چون بسیاری از اقامتگاه‌های روستایی
    کارت بانکی نمی‌پذیرند، و پیش از رفتن به ارتفاعات باک را پر کنید. در ژوئیه و اوت اتاق را از پیش رزرو
    کنید. بعدازظهرهای تابستان می‌تواند سوزان باشد: دمای ۴۱٫۸ درجهٔ سانتی‌گراد در شهر ثبت شده است، در حالی
    که میانگین ژانویه اندکی زیر صفر است. از اواخر سپتامبر دربارهٔ انگورچینی از میزبان‌تان بپرسید؛ صبحی
    در تاکستان یک خانواده از هر سالن شراب‌چشی بهتر است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب، از کنار زستافونی تا کوتائیسی بروید، سپس جادهٔ Sh17 را به سمت
    شمال از راه تکیبولی و گردنهٔ ناکرالا بگیرید: ۳۱۳ کیلومتر، حدود پنج ساعت و بیست‌وپنج دقیقه. جاده سراسر
    آسفالت است، اما بخش تکیبولی–ناکرالا باریک و پر از پیچ‌های تند است و زیر جنگل راش اغلب نمناک؛ در زمستان
    برف مدت‌ها بر گردنه می‌ماند. راه دیگر از کوتائیسی جادهٔ Sh16 است که از راه آلپانا در تنگهٔ ریونی بالا
    می‌رود: زمانش کمابیش همان است، ارتفاعش کمتر و بی‌گردنه. سوخت در زستافونی، کوتائیسی و تکیبولی پیدا
    می‌شود. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: אמברולאורי
  short: >-
    בירת המחוז הקטנה ביותר בגאורגיה, משני צדי הריוני בגובה 550 מטר: מגדל של בית אצולה, מוזיאון לאמנויות
    יפות, המטבח של ראצ'ה ותחנת הדלק הנוחה האחרונה.
  body: >-
    **אמברולאורי היא בירת המחוז הקטנה ביותר בגאורגיה, והיא נושאת את התואר בלי שום גינונים.** כ-1,960 איש
    חיים משני צדי הריוני, בגובה 550 מטר, במקום שבו נחל קריחולה נשפך אליו. ב-1968 חיו כאן 4,400 — הפער
    בין שני המספרים האלה הוא סיפורה של גאורגיה ההררית.


    העיירה עתיקה יותר ממה שהיא נראית. למלכי אימרטי היה כאן מקום מושב: השליח הרוסי אלכסיי יבלב ראה ב-1650
    טירה מלכותית במפגש הנהרות, והנסיך ואחושטי תיעד אותה שוב בסביבות 1745, אף שנותרו ממנה רק שרידים. ב-1769
    העניק המלך סולומון הראשון את אמברולאורי לנסיך זוראב מצ'בלי, ומגדל בן שלוש קומות מאבן וטיט סיד עדיין
    מכונה בפי המקומיים "מגדל מצ'בלי". ב-1934 שינו הסובייטים את שם המקום לאנוקידזה, על שם הבולשביק אוול
    אנוקידזה; כשהוצא להורג בירייה ב-1937, חזר השם הישן. גם רעידת האדמה של ראצ'ה ב-1991 הותירה כאן את חותמה.


    היום אמברולאורי היא שער הכניסה אל שולחנה של ראצ'ה. זו ארץ הלורי, ירך חזיר שמומלחת ומעושנת לאט לאורך
    כל החורף, ושל הלוביו האפוי בסירי חרס; השקמרולי, עוף בשום ובחלב שמופיע היום כמעט בכל תפריט בטביליסי,
    קרוי על שם שקמרי, כפר בראצ'ה העילית. כרמי חוונצ'קארה מתחילים מעט במורד הנהר, ומסוף ספטמבר העמק מריח
    מענבים כתושים. שעה גשומה מנוצלת היטב במוזיאון לאמנויות יפות, ושדה תעופה קטן, שנפתח ב-2017 ומסלולו
    באורך 1.1 ק"מ, קולט מטוסים קלים.


    רוב המטיילים רואים את אמברולאורי רק מבעד לשמשה הקדמית, בדרך למקום גבוה יותר. תנו לה ערב אחד על גדת
    הנהר, והיא תראה לכם את ראצ'ה בזעיר אנפין.
  tip: >-
    שעתיים מספיקות לעיירה כולה: המוזיאון לאמנויות יפות, מגדל מצ'בלי וטיול לאורך הריוני. התייחסו לאמברולאורי
    כאל בסיס ותחנת הצטיידות: משכו כאן מזומן, כי בתי הארחה רבים בכפרים אינם מקבלים כרטיסי אשראי, ומלאו
    את המכל לפני שאתם עולים גבוה יותר. ביולי ובאוגוסט הזמינו חדרים מראש. שעות אחר הצהריים בקיץ עלולות
    להיות לוהטות: בעיירה נמדדו 41.8 מעלות, ואילו הממוצע בינואר נמוך מעט מאפס. מסוף ספטמבר שאלו את המארחים
    על הבציר; בוקר בכרם משפחתי שווה יותר מכל חדר טעימות.
  route: >-
    מטביליסי סעו מערבה בכביש S1 ‏(E60), על פני זסטאפוני, עד קוטאיסי, ומשם צפונה בכביש Sh17 דרך טקיבולי
    ומעל מעבר נקרלה: 313 ק"מ, כחמש שעות ועשרים וחמש דקות. הכביש סלול לכל אורכו, אבל הקטע טקיבולי–נקרלה
    צר, רצוף עיקולים חדים ולעתים קרובות לח בצל יער האשור; בחורף השלג נשאר על המעבר זמן רב. החלופה מקוטאיסי
    היא כביש Sh16 במעלה ערוץ הריוני דרך אלפנה — זמן נסיעה דומה, בגובה נמוך יותר וללא מעבר הרים. אפשר לתדלק
    בזסטאפוני, בקוטאיסי ובטקיבולי. רכב מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: أمبرولاوري
  short: >-
    أصغر مركز إقليمي في جورجيا، على ضفتي نهر ريوني وعلى ارتفاع 550 متراً: برج أميري، ومتحف للفنون الجميلة،
    ومائدة راتشا، وآخر محطة وقود في المتناول.
  body: >-
    **أمبرولاوري أصغر مراكز الأقاليم في جورجيا، وهي تحمل هذا اللقب بلا تكلّف.** يعيش نحو 1960 نسمة على
    ضفتي نهر ريوني على ارتفاع 550 متراً، حيث يصبّ فيه جدول كريخولا. وفي عام 1968 كان عددهم 4400، والفارق
    بين هذين الرقمين هو حكاية جورجيا الجبلية.


    البلدة أقدم مما تبدو. فقد كان لملوك إيميريتي مقرّ هنا: رأى المبعوث الروسي أليكسي يفليف قلعةً ملكية
    عند ملتقى النهرين عام 1650، ثم دوّنها الأمير فاخوشتي من جديد نحو عام 1745، وإن لم يبقَ منها اليوم
    إلا شذرات. وفي عام 1769 منح الملك سليمان الأول أمبرولاوري للأمير زوراب ماتشابيلي، ولا يزال برج من
    ثلاثة طوابق مبني بالحجر وملاط الجير يُعرف محلياً باسم «برج ماتشابيلي». وفي عام 1934 غيّر السوفييت
    اسم المكان إلى إنوكيدزه، نسبةً إلى البلشفي أفيل إنوكيدزه؛ وحين أُعدم رمياً بالرصاص عام 1937 عاد الاسم
    القديم. وقد ترك زلزال راتشا عام 1991 أثره هنا أيضاً.


    واليوم تُعدّ أمبرولاوري البوابة الأمامية إلى مائدة راتشا. فهذه بلاد اللوري، وهو فخذ خنزير يُملَّح
    ويُدخَّن ببطء طوال الشتاء، وبلاد اللوبيو المخبوز في قدور الفخار؛ أما الشكميرولي، الدجاج بالثوم والحليب
    الذي بات حاضراً في كل قائمة طعام تقريباً في تبليسي، فيحمل اسم شكميري، وهي قرية في راتشا العليا. تبدأ
    كروم خفانتشكارا بعد البلدة بقليل في اتجاه مجرى النهر، ومنذ أواخر سبتمبر تفوح في الوادي رائحة العنب
    المهروس. والساعة الممطرة تُقضى على أحسن وجه في متحف الفنون الجميلة، كما يستقبل مطار صغير افتُتح عام
    2017، بمدرج طوله 1.1 كم، الطائراتِ الخفيفة.


    يرى معظم المسافرين أمبرولاوري من خلف الزجاج الأمامي فحسب، في طريقهم إلى مكان أعلى. امنحها أمسية واحدة
    على ضفة النهر، وستريك راتشا في صورة مصغّرة.
  tip: >-
    تكفي ساعتان للبلدة كلها: متحف الفنون الجميلة وبرج ماتشابيلي ونزهة على ضفة ريوني. اتخذ من أمبرولاوري
    قاعدةً ومحطة تزوّد: اسحب النقود هنا، لأن كثيراً من بيوت الضيافة في القرى لا تقبل البطاقات، واملأ خزان
    الوقود قبل الصعود إلى الأعالي. احجز غرفتك مسبقاً في يوليو وأغسطس. قد تكون ساعات العصر في الصيف لاهبة:
    فقد سُجّلت في البلدة 41.8 درجة مئوية، بينما يقلّ متوسط يناير عن الصفر بقليل. ومنذ أواخر سبتمبر اسأل
    مضيفك عن موسم القطاف؛ فصباحٌ في كرم عائلي خير من أي قاعة تذوّق.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) غرباً مروراً بزيستافوني حتى كوتايسي، ثم الطريق Sh17 شمالاً عبر تكيبولي
    وفوق ممر ناكيرالا: 313 كم، نحو خمس ساعات وخمس وعشرين دقيقة. الطريق معبّد بالكامل، لكن مقطع تكيبولي–ناكيرالا
    ضيق، كثير المنعطفات الحادة، وكثيراً ما يكون رطباً تحت غابة الزان؛ وفي الشتاء يبقى الثلج على الممر
    طويلاً. والبديل من كوتايسي هو الطريق Sh16 صعوداً في مضيق ريوني عبر ألبانا: زمن مماثل تقريباً، وارتفاع
    أقل، ومن دون ممر جبلي. تتوفر محطات الوقود في زيستافوني وكوتايسي وتكيبولي. وتفي سيارة اقتصادية بالغرض
    تماماً.
