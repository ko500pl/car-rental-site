ka:
  name: ამბროლაური
  short: საქართველოს უმცირესი რეგიონული ცენტრი რიონის ორივე ნაპირზე — რაჭის ბაზა, სადაც ხვანჭკარის ზონა
    იწყება.
  body: >-
    **ამბროლაური საქართველოს ყველაზე პატარა რეგიონული ცენტრია და ამას არ მალავს.** დაახლოებით ორი ათასი
    კაცი ცხოვრობს რიონის ორივე ნაპირზე, ხუთას ორმოცდაათ მეტრზე: დაბალი სახლების ბადე, საბჭოთა ადმინისტრაციული
    კორპუსი, ბაზარი, რომელიც შაბათ დილას ივსება, და რამდენიმე კაფე მთავარ ქუჩაზე. ქალაქის დათვალიერებას
    ნახევარი დღეც ეყოფა — მაგრამ სწორედ აქაა რაჭის ერთადერთი ბანკი, აფთიაქი, ნორმალური სუპერმარკეტი და
    გამართული ავტოგასამართი, ამიტომ მთაში ყოველი მოგზაურობა აქ იწყება ან მთავრდება.


    ქალაქის დიდება თხევადია. ამბროლაური ხვანჭკარის მიკროზონის აღმოსავლეთ კიდეზე დგას; დასავლეთის შესასვლელთან
    გიგანტური ღვინის ბოთლის ფორმის ძეგლი დგას, რომელიც პირველ სახლებზე ბევრად ადრე ჩანს. ამბროლაურის მხარეთმცოდნეობის
    მუზეუმი მოკრძალებულ შენობაშია და ირგვლივ ხეობების არქეოლოგიურ და ეთნოგრაფიულ მასალას ინახავს: ბრინჯაოს
    ხანის ლითონს რიონის ტერასებიდან, სახვნელ იარაღს, ქსოვილებს, იმ სოფლების ფოტოებს, სადაც დღეს ათიოდე
    კაცი დარჩა.


    რაჭის მეორე ექსპორტი საკვებია. ეს ლორის მხარეა — მარილში დაყენებული და ზამთრის განმავლობაში ნელა შებოლილი
    — და თიხის ქოთანში გამომცხვარი ლობიოსი, ადგილობრივი პატარა მუქი მარცვლით. შქმერული, ნივრიან-რძიანი
    ქათამი, რომელიც დღეს თბილისის ყველა მენიუშია, რაჭის ქედზე მდებარე სოფელ შქმერს ეწოდა.


    ქალაქს პატარა აეროპორტიც აქვს, რომლის ტერმინალი ღვინის ბოთლის ფორმით ააშენეს — რაჭული იუმორის ნიმუში,
    რომელიც ცოტა ვინმეს ელოდება.


    სექტემბრის ბოლოს და ოქტომბერში ხეობა ტკბილის სუნით ივსება და ქუჩებში ყურძნის ყუთებით დატვირთული მანქანები
    დადის. ზამთარში ამბროლაური მშვიდი და ცივია, სასტუმროების ნახევარი დაკეტილია, სამაგიეროდ თოვლიან რაჭას
    ისეთი სიჩუმე აქვს, რომელსაც სხვაგან ვეღარ იპოვი.
  tip: >-
    თავად ქალაქში სანახავი ცოტაა — ამბროლაური ბაზაა და არა მიზანი. ორი საათი საკმარისია მუზეუმისთვის,
    ბაზრისთვის და რიონის ხიდისთვის. აქ აიღე ნაღდი ფული: მთის სოფლებში ბანკომატი არ არის და გესტჰაუსების
    უმეტესობა ბარათს არ იღებს. სასურსათო მაღაზიები საღამოს შვიდზე იკეტება, კვირას ბევრი საერთოდ არ მუშაობს.
    საწვავი აუცილებლად აქ ჩაასხი — ონამდე ბენზინგასამართი პრაქტიკულად აღარაა. ზაფხულში ოთახი წინასწარ
    დაჯავშნე, ივლის-აგვისტოში ქალაქი ივსება.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ ზესტაფონსა და ქუთაისამდე, შემდეგ ჩრდილოეთით ტყიბულზე და ნაქერალას
    უღელტეხილზე — 313 კმ, დაახლოებით ხუთი საათი და ნახევარი. გზა ბოლომდე ასფალტია, მაგრამ ტყიბულ-ნაქერალას
    მონაკვეთი ვიწროა, მკვეთრი მოსახვევებით და წიფლის ტყის ქვეშ ხშირად სველი; ზამთარში აქ თოვლი ჩერდება.
    ალტერნატივა ქუთაისიდან წყალტუბოსა და ალპანაზე გადის რიონის ხეობით, დაახლოებით იმავე სიგრძის. საწვავი
    ზესტაფონში, ქუთაისსა და ტყიბულში აიღე. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Ambrolauri
  short: >-
    Georgia's smallest regional capital, on both banks of the Rioni — the practical base for Racha and
    the edge of the Khvanchkara wine zone.
  body: >-
    **Ambrolauri is the smallest regional capital in Georgia, and it does not pretend otherwise.** Around
    two thousand people live on both banks of the Rioni at 550 metres, in a grid of low houses, a Soviet
    administrative block, a market that fills up on Saturday mornings and a handful of cafes along the
    main street. Half a day covers it. But this is the only place in Racha with a bank, a pharmacy, a
    real supermarket and a reliable filling station, so almost every trip into these mountains begins
    or ends here.


    The town's fame is liquid. Ambrolauri sits at the eastern edge of the Khvanchkara appellation, and
    a monument shaped like a giant wine bottle stands at the western approach, visible long before the
    first houses. The Ambrolauri museum of local lore, in a modest building near the centre, holds the
    archaeological and ethnographic material of the surrounding valleys: Bronze Age metalwork from the
    Rioni terraces, farm tools, textiles, and photographs of villages that now have a dozen residents.


    Racha's other export is food. This is the country of lori, ham salted and smoked slowly through the
    winter, and of lobio baked in a clay pot with the small dark local beans. Shkmeruli, the garlic-and-milk
    chicken now on every Tbilisi menu, takes its name from Shkmeri, a village high on the Racha ridge.


    The town also has a small airport whose terminal was built in the shape of a wine bottle — a piece
    of Racha humour that few visitors expect.


    From late September into October the valley smells of fermenting must and cars move through the streets
    stacked with crates of grapes. In winter Ambrolauri is cold and very quiet, half the guesthouses shut,
    and the snowbound valley has a stillness that is hard to find elsewhere in Georgia.
  tip: >-
    There is not much to see in the town itself — Ambrolauri is a base, not a destination. Two hours covers
    the museum, the market and the bridge over the Rioni. Draw cash here: the mountain villages have no
    ATMs and most guesthouses do not take cards. Food shops close around seven in the evening and many
    do not open on Sunday. Fill the tank before leaving, since there is effectively nothing until Oni.
    Book a room ahead in July and August, when the town fills up.
  route: >-
    From Tbilisi take the E60 west past Zestaponi to Kutaisi, then turn north through Tkibuli and over
    the Nakerala pass — 313 km, about five and a half hours. The road is asphalt throughout, but the Tkibuli–Nakerala
    section is narrow, tightly curved and often damp under the beech forest; in winter it holds snow.
    An alternative from Kutaisi runs via Tskaltubo and Alpana up the Rioni gorge and is a similar length.
    Fuel at Zestaponi, Kutaisi and Tkibuli. An economy car is entirely sufficient.
ru:
  name: Амбролаури
  short: >-
    Самый маленький региональный центр Грузии на обоих берегах Риони — база для Рачи и восточный край
    зоны Хванчкары.
  body: >-
    **Амбролаури — самый маленький региональный центр Грузии, и он этого не скрывает.** Около двух тысяч
    человек живут на обоих берегах Риони на высоте 550 метров: сетка невысоких домов, советский административный
    корпус, рынок, оживающий субботним утром, и несколько кафе вдоль главной улицы. На осмотр хватит полудня.
    Но это единственное место в Раче с банком, аптекой, нормальным супермаркетом и работающей заправкой,
    поэтому почти любая поездка в здешние горы начинается или заканчивается тут.


    Слава города — жидкая. Амбролаури стоит на восточной границе аппелласьона Хванчкара, а на западном
    въезде установлен памятник в виде гигантской винной бутылки, который видно задолго до первых домов.
    Краеведческий музей занимает скромное здание в центре и хранит археологию и этнографию окрестных ущелий:
    металл бронзового века с террас Риони, земледельческие орудия, ткани и фотографии сёл, где сегодня
    осталось по десятку жителей.


    Второй экспорт Рачи — еда. Это край лори, окорока, который солят и медленно коптят всю зиму, и лобио,
    запечённого в глиняном горшке из мелкой тёмной местной фасоли. Шкмерули, курица в чесноке и молоке,
    попавшая теперь в каждое тбилисское меню, названа по селу Шкмери на рачинском хребте.


    Есть здесь и маленький аэропорт, терминал которого построили в форме винной бутылки — образец рачинского
    юмора, к которому мало кто готов.


    С конца сентября и весь октябрь долина пахнет бродящим суслом, а по улицам ездят машины, гружённые
    ящиками винограда. Зимой Амбролаури холодный и очень тихий, половина гостевых домов закрыта, зато
    у заснеженной долины появляется тишина, которой в Грузии больше почти нигде не найти.
  tip: >-
    В самом городе смотреть почти нечего — Амбролаури это база, а не цель. Двух часов хватит на музей,
    рынок и мост через Риони. Снимите наличные здесь: в горных сёлах банкоматов нет, и большинство гостевых
    домов карты не принимает. Продуктовые закрываются около семи вечера, в воскресенье многие не работают
    вовсе. Заправьтесь до выезда — до Они заправок практически нет. В июле и августе комнату лучше бронировать
    заранее, город заполняется.
  route: >-
    Из Тбилиси по E60 на запад мимо Зестафони до Кутаиси, затем на север через Ткибули и перевал Накерала
    — 313 км, около пяти с половиной часов. Асфальт на всём протяжении, но участок Ткибули — Накерала
    узкий, с крутыми поворотами и часто сырой под буковым лесом; зимой там держится снег. Альтернатива
    от Кутаиси идёт через Цхалтубо и Алпану по ущелью Риони, длина примерно та же. Заправки в Зестафони,
    Кутаиси и Ткибули. Машины эконом-класса вполне достаточно.
fa:
  name: آمبرولائوری
  short: کوچک‌ترین مرکز استانی گرجستان بر دو کرانهٔ ریونی — پایگاه عملی راچا و لبهٔ شرقی منطقهٔ شراب خوانچکارا.
  body: >-
    **آمبرولائوری کوچک‌ترین مرکز استانی گرجستان است و این را پنهان نمی‌کند.** حدود دو هزار نفر بر دو کرانهٔ
    رود ریونی در ارتفاع ۵۵۰ متری زندگی می‌کنند: شبکه‌ای از خانه‌های کوتاه، یک ساختمان اداری از دورهٔ شوروی،
    بازاری که صبح شنبه شلوغ می‌شود و چند کافه در خیابان اصلی. نیم روز برای دیدنش کافی است. اما این تنها
    جای راچاست که بانک، داروخانه، سوپرمارکت درست‌وحسابی و پمپ بنزین قابل اعتماد دارد، پس تقریباً هر سفری
    به این کوهستان از اینجا آغاز یا به اینجا ختم می‌شود.


    شهرت این شهر مایع است. آمبرولائوری در لبهٔ شرقی منطقهٔ خوانچکارا قرار دارد و در ورودی غربی، یادمانی
    به شکل بطری غول‌پیکر شراب برپاست که خیلی پیش از نخستین خانه‌ها دیده می‌شود. موزهٔ مردم‌شناسی شهر در
    ساختمانی ساده نزدیک مرکز است و مواد باستان‌شناسی و قوم‌نگاری دره‌های اطراف را نگه می‌دارد: فلزکاری
    عصر برنز از پشته‌های ریونی، ابزار کشاورزی، پارچه، و عکس روستاهایی که امروز ده‌دوازده ساکن دارند.


    صادرات دیگر راچا خوراک است. اینجا سرزمین لوری است، ران نمک‌سود که تمام زمستان آرام دود می‌خورد، و
    لوبیو که در دیگ سفالی با لوبیای ریز و تیرهٔ محلی پخته می‌شود. شکمرولی، همان مرغ با سیر و شیر که امروز
    در هر منوی تفلیس هست، نامش را از روستای شکمری بر ستیغ راچا گرفته است.


    شهر فرودگاه کوچکی هم دارد که ساختمان ترمینالش را به شکل بطری شراب ساخته‌اند؛ نمونه‌ای از شوخ‌طبعی
    راچایی که کمتر کسی انتظارش را دارد.


    از اواخر شهریور تا آبان، درّه بوی شیرهٔ در حال تخمیر می‌گیرد و خودروها با جعبه‌های انگور در خیابان‌ها
    می‌گذرند. زمستان آمبرولائوری سرد و بسیار ساکت است، نیمی از خانه‌های مهمان بسته‌اند و درّهٔ برف‌گرفته
    سکوتی دارد که جای دیگری در گرجستان کمتر پیدا می‌شود.
  tip: >-
    در خود شهر دیدنی چندانی نیست؛ آمبرولائوری پایگاه است، نه مقصد. دو ساعت برای موزه، بازار و پل روی ریونی
    کافی است. پول نقد را همین‌جا بگیرید: روستاهای کوهستانی خودپرداز ندارند و بیشتر اقامتگاه‌ها کارت نمی‌پذیرند.
    خواربارفروشی‌ها حدود ساعت هفت عصر می‌بندند و بسیاری یکشنبه‌ها اصلاً باز نمی‌کنند. پیش از حرکت باک
    را پر کنید، چون تا اونی عملاً پمپ بنزینی نیست. در تیر و مرداد اتاق را از پیش رزرو کنید، شهر پر می‌شود.
  route: >-
    از تفلیس بزرگراه E60 را به سمت غرب تا زستافونی و کوتائیسی بروید، سپس به شمال از تکیبولی و گردنهٔ ناکرالا
    — ۳۱۳ کیلومتر، حدود پنج ساعت و نیم. جاده تا انتها آسفالت است، اما بخش تکیبولی تا ناکرالا باریک و پرپیچ
    و زیر جنگل راش اغلب نمناک است؛ در زمستان برف روی آن می‌ماند. مسیر جایگزین از کوتائیسی از تسخالتوبو
    و آلپانا در تنگهٔ ریونی می‌گذرد و طولی نزدیک به همین دارد. سوخت را در زستافونی، کوتائیسی و تکیبولی
    بگیرید. خودروی اقتصادی کاملاً کافی است.
he:
  name: אמברולאורי
  short: בירת המחוז הקטנה ביותר בגאורגיה, על שתי גדות הריוני — בסיס מעשי לראצ'ה וקצה אזור היין חוונצ'קארה.
  body: >-
    **אמברולאורי היא בירת המחוז הקטנה ביותר בגאורגיה, והיא אינה מעמידה פנים אחרת.** כאלפיים תושבים חיים
    על שתי גדות נהר הריוני בגובה 550 מטר: רשת של בתים נמוכים, בניין מנהלה סובייטי, שוק שמתמלא בבוקר שבת
    וכמה בתי קפה ברחוב הראשי. חצי יום מספיק כדי לראות הכול. אבל זה המקום היחיד בראצ'ה שיש בו בנק, בית
    מרקחת, סופרמרקט אמיתי ותחנת דלק שאפשר לסמוך עליה, ולכן כמעט כל מסע אל ההרים האלה מתחיל או מסתיים כאן.


    התהילה של העיירה נוזלית. אמברולאורי יושבת בקצה המזרחי של אזור היין חוונצ'קארה, ובכניסה המערבית ניצבת
    אנדרטה בצורת בקבוק יין ענק, שנראית הרבה לפני הבתים הראשונים. המוזיאון האזורי, בבניין צנוע ליד המרכז,
    שומר את החומר הארכיאולוגי והאתנוגרפי של העמקים סביב: מתכת מתקופת הברונזה ממדרגות הריוני, כלי עבודה
    חקלאיים, אריגים ותצלומים של כפרים שנותרו בהם היום עשרה תושבים.


    הייצוא השני של ראצ'ה הוא אוכל. זו ארץ הלורי, ירך מומלחת שמעשנים לאט לאורך כל החורף, והלוביו הנאפה
    בסיר חרס משעועית מקומית קטנה וכהה. השקמרולי, עוף בשום ובחלב שמופיע היום בכל תפריט בטביליסי, קרוי על
    שם הכפר שקמרי שעל רכס ראצ'ה.


    לעיירה יש גם שדה תעופה קטן שמסוף הנוסעים שלו נבנה בצורת בקבוק יין — הומור מקומי שמעט מבקרים מצפים
    לו.


    מסוף ספטמבר ולתוך אוקטובר הבקעה מריחה מתירוש מתסיס, ומכוניות עמוסות ארגזי ענבים נעות ברחובות. בחורף
    אמברולאורי קרה ושקטה מאוד, מחצית מבתי ההארחה סגורים, ולעמק המושלג יש דממה שקשה למצוא במקום אחר בגאורגיה.
  tip: >-
    בעיירה עצמה אין הרבה מה לראות — אמברולאורי היא בסיס ולא יעד. שעתיים מכסות את המוזיאון, השוק והגשר
    על הריוני. משכו כאן מזומן: בכפרי ההר אין כספומטים ורוב בתי ההארחה אינם מקבלים כרטיסים. חנויות המזון
    נסגרות סביב שבע בערב ורבות אינן נפתחות בכלל בימי ראשון. מלאו דלק לפני היציאה, שכן עד אוני כמעט אין
    תחנות. ביולי ובאוגוסט הזמינו חדר מראש, העיירה מתמלאת.
  route: >-
    מטביליסי סעו מערבה בכביש E60 דרך זסטאפוני עד קותאיסי, ומשם צפונה דרך טקיבולי ומעלה מעבר נקראלה — 313
    ק״מ, כחמש שעות וחצי. הכביש סלול לכל אורכו, אך הקטע טקיבולי–נקראלה צר, מפותל ולעיתים לח מתחת ליער האשור;
    בחורף נערם עליו שלג. חלופה מקותאיסי עוברת דרך צחלטובו ואלפאנה בנקיק הריוני, באורך דומה. דלק בזסטאפוני,
    בקותאיסי ובטקיבולי. רכב חסכוני מספיק לחלוטין.
ar:
  name: أمبرولاوري
  short: أصغر مركز إقليمي في جورجيا على ضفتي نهر ريوني — قاعدة عملية لراتشا وحافة منطقة نبيذ خفانتشكارا.
  body: >-
    **أمبرولاوري أصغر مركز إقليمي في جورجيا، وهي لا تدّعي غير ذلك.** يعيش نحو ألفي شخص على ضفتي نهر ريوني
    عند ارتفاع 550 متراً، في شبكة من البيوت المنخفضة، ومبنى إداري من الحقبة السوفييتية، وسوق يمتلئ صباح
    السبت، وبضعة مقاهٍ على الشارع الرئيسي. نصف يوم يكفي لرؤيتها. لكنها المكان الوحيد في راتشا الذي فيه
    مصرف وصيدلية ومتجر كبير حقيقي ومحطة وقود يُعتمد عليها، ولذلك تبدأ هنا أو تنتهي كل رحلة تقريباً إلى
    هذه الجبال.


    شهرة البلدة سائلة. تقع أمبرولاوري على الطرف الشرقي من منطقة خفانتشكارا، وعند المدخل الغربي نصب على
    هيئة زجاجة نبيذ عملاقة يُرى قبل أول البيوت بكثير. ويحتفظ متحف التراث المحلي، في مبنى متواضع قرب المركز،
    بمواد الآثار والإثنوغرافيا من الأودية المجاورة: معادن من العصر البرونزي من مصاطب ريوني، وأدوات زراعية،
    ومنسوجات، وصور لقرى لم يبقَ فيها اليوم سوى عشرة سكان.


    الصادرة الأخرى لراتشا هي الطعام. هذه بلاد اللوري، فخذ مملّح يُدخَّن ببطء طوال الشتاء، واللوبيو المخبوز
    في قدر فخاري بفاصولياء محلية صغيرة داكنة. أما الشكميرولي، الدجاج بالثوم والحليب الحاضر اليوم في كل
    قائمة طعام في تبليسي، فقد أخذ اسمه من قرية شكميري على سلسلة راتشا.


    وللبلدة مطار صغير بُني مبنى ركابه على شكل زجاجة نبيذ، وهي دعابة راتشية قلّ من يتوقعها.


    من أواخر أيلول وطوال تشرين الأول يفوح في الوادي عبق العصير المتخمّر، وتمرّ في الشوارع سيارات محمّلة
    بصناديق العنب. وفي الشتاء تكون أمبرولاوري باردة وهادئة جداً، ونصف بيوت الضيافة مغلق، بينما يكتسب الوادي
    المكسو بالثلج سكوناً يصعب أن تجد مثله في مكان آخر من جورجيا.
  tip: >-
    لا يوجد في البلدة نفسها الكثير لرؤيته — أمبرولاوري قاعدة لا وجهة. ساعتان تغطيان المتحف والسوق وجسر
    ريوني. اسحب النقود هنا: قرى الجبل بلا صرافات آلية، ومعظم بيوت الضيافة لا تقبل البطاقات. تغلق محال
    الطعام نحو السابعة مساءً، وكثير منها لا يفتح يوم الأحد. املأ الخزان قبل المغادرة، فحتى أوني لا توجد
    محطات عملياً. في تموز وآب احجز غرفة مسبقاً، إذ تمتلئ البلدة.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً عبر زيستافوني إلى كوتايسي، ثم اتجه شمالاً عبر تكيبولي وممر ناكيرالا
    — 313 كم، نحو خمس ساعات ونصف. الطريق معبّد بكامله، لكن مقطع تكيبولي–ناكيرالا ضيق وكثير المنعطفات ورطب
    غالباً تحت غابة الزان؛ وفي الشتاء يتراكم عليه الثلج. وثمة بديل من كوتايسي يمرّ بتسخالتوبو وألبانا
    في مضيق ريوني بطول مماثل. الوقود في زيستافوني وكوتايسي وتكيبولي. وسيارة اقتصادية تكفي تماماً.
