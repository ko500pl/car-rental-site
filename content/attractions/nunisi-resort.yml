ka:
  name: ნუნისი
  short: >-
    პაწაწინა კურორტი ბორჯომ-ხარაგაულის ტყეების სიღრმეში, სადაც თბილი გოგირდოვანი წყალი 1856 წლიდან კანის
    სნეულებებს კურნავს.
  body: >-
    **ნუნისს სახელიც კი იმ კანის სნეულებამ დაარქვა, რომელსაც მისი წყალი კურნავს.** სოფელს ძველად მუნისი
    ერქვა, სიტყვიდან „მუნი“ — ასე ეძახდნენ კანის დაავადებას, რომლისგანაც აქაური წყლით იკურნებოდნენ; დროთა
    განმავლობაში პირველი ბგერა შეიცვალა და მუნისი ნუნისად იქცა.


    წყაროს სახელი ნებისმიერ სასტუმროზე გაცილებით ძველია. საქართველოს ტურიზმის ეროვნული ადმინისტრაციის
    ცნობით, იგი მხარეში XVII საუკუნიდან იყო განთქმული, XVIII საუკუნეში კი ვახუშტი ბატონიშვილმა აქაური
    წყალი სასიამოვნო და სასარგებლოდ მოიხსენია. ავადმყოფებს აქ 1856 წლიდან მკურნალობენ — ანუ ნუნისი იმპერიის
    ეპოქის კურორტია და არა საბჭოთა ქმნილება, როგორც ხშირად ჰგონიათ. გადმოცემა უფრო შორსაც მიდის: დავით
    აღმაშენებლის დაჭრილი პირუტყვი — ერთი ვერსიით ცხენები, მეორით სახედრები — თბილ წყალში ჩაწოლილა და წყლულებმოშუშებული
    წამომდგარა, რის შემდეგაც მეფეს სოფელში ეკლესია აუშენებია. ეს ლეგენდაა, მაგრამ ზუსტად შერჩეული.


    წყალი ბუნებრივად თბილი და გოგირდოვანია, ზვარის წყაროდან ამოდის და მას როგორც სასმელად, ისე აბაზანებისთვის
    იყენებენ, უპირველესად კანის დაავადებების დროს. თავად კურორტი მოკრძალებულია: ტყის სასტუმრო სააბაზანოთი
    და რამდენიმე კოტეჯი დაახლოებით 750 მეტრზე, სოფელი კი მესხეთის ქედის ჩრდილოეთ კალთაზე უფრო მაღლა, 920
    მეტრამდე აუყვება.


    ნამდვილი ფუფუნება გარემოა — ბორჯომ-ხარაგაულის ეროვნული პარკის სამხრეთ-აღმოსავლეთი კუთხე. გაზაფხულზე
    ჰაერში აყვავებული ფიჭვისა და სოჭის სუნი დგას, ზაფხულის ღამეები გრილია, ბილიკები კი პირდაპირ ტყეში
    შედის. მახლობლად ბერების კლდედ წოდებული გამოქვაბულთა კომპლექსია, სადაც ექსპედიციებს ლოდით ჩახერგილი
    გასასვლელი უპოვიათ.


    ნუნისი ერთდღიანი მოგზაურობისთვის არ შექმნილა. ის იმისთვისაა, რომ ერთი კვირა თქვენ გარშემო ნელ-ნელა
    ჩაჩუმდეს.
  tip: >-
    ადგილის სანახავად ოთხი საათიც კმარა, მაგრამ ვინც აქამდე ჩამოაღწევს, ჩვეულებრივ ერთი ღამით მაინც რჩება.
    აბაზანები და პროცედურები კურორტის მეშვეობით ეწყობა, ამიტომ წინასწარ დაჯავშნეთ და სამედიცინო ცნობები,
    თუ გაქვთ, თან იქონიეთ; კანის პრობლემაზე ჯობს, ჯერ საკუთარ ექიმს გაესაუბროთ. სასტუმროს გარეთ საჭმელს
    თითქმის ვერსად იშოვით — სურსათი ხარაგაულში ან ხაშურში იყიდეთ და ბანკომატის იმედი ნუ გექნებათ. მობილური
    კავშირი ზოგან წყდება. ტყის ბილიკებზე გრძელი შარვალი და დახურული ფეხსაცმელი ჩაიცვით: ტკიპა გვიანი გაზაფხულიდან
    შემოდგომამდე აქტიურია.
  route: >-
    ნუნისი ხარაგაულიდან გზით დაახლოებით 24 კილომეტრშია. თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ
    იარეთ; უფრო მოკლე გზა სურამთან ტოვებს მაგისტრალს და კლაკნილ შ55-ს ფონისა და მოლითის გავლით დასავლეთისკენ
    მიჰყვება, ალტერნატივა კი რიკოთის გვირაბით შორაპნამდე ჩადის და ხარაგაულის გავლით აღმოსავლეთისკენ ბრუნდება.
    ორივე შემთხვევაში დაახლოებით 160–175 კილომეტრი და თითქმის სამი საათია. ბოლო კილომეტრები, კურორტისკენ
    ჩამავალ განშტოებაზე, ვიწრო და დაკერებულია, მკვეთრი მოსახვევებით — მშრალ ამინდში ჩვეულებრივი მანქანა
    უპრობლემოდ გაივლის, წვიმის შემდეგ კი ნელა სიარული მოგიწევთ. საწვავი ხაშურში ჩაასხით — ტყეში გასამართი
    არ არის.
en:
  name: Nunisi
  short: >-
    A tiny warm-sulphur resort deep in the forests of Borjomi-Kharagauli, where the water has been treating
    skin complaints since 1856.
  body: >-
    **Nunisi owes even its name to the skin disease its water heals.** The village was once called Munisi,
    from *muni*, the old name of a skin ailment its water was used to cure; over time the first letter
    slipped, and Munisi became Nunisi.


    The spring's reputation is far older than any hotel. The Georgian National Tourism Administration
    dates its local fame to the 17th century, and in the 18th the prince and geographer Vakhushti Batonishvili
    recorded the water as pleasant and beneficial. Patients have been treated here since 1856, which makes
    Nunisi a resort of the imperial era rather than, as is often assumed, a Soviet creation. Tradition
    reaches back further still: the animals of King David the Builder — horses in one telling, pack donkeys
    in another — are said to have lain wounded in the warm water and risen with their sores healed, after
    which the king had a church built in the village. It is a legend, but a well-chosen one.


    The water rises naturally warm and sulphurous from the Zvare source and is used both for drinking
    and for bathing, above all for skin conditions. The resort itself is modest: a forest hotel with a
    bath block and a few cottages at about 750 metres, while the village spreads higher up the northern
    slope of the Meskheti Range, to around 920.


    The real luxury is the setting, in the southeastern corner of Borjomi-Kharagauli National Park. Spring
    brings the scent of flowering pine and fir; summer nights stay cool; paths lead straight into the
    woods. Nearby rises the Monks' Cliff, a cave complex where expeditions found a passage sealed by a
    boulder.


    Nunisi is not built for a day trip. It is built for letting a week go quiet around you.
  tip: >-
    Four hours is enough to see the place, but most people who make the effort stay at least a night.
    Baths and treatments are arranged through the resort, so book ahead and bring any medical notes you
    have; a skin condition is best discussed with your own doctor first. There is almost nowhere to eat
    outside the hotel — buy supplies in Kharagauli or Khashuri, and do not count on an ATM. Mobile signal
    can be patchy. On forest paths wear long trousers and closed shoes: ticks are active from late spring
    to autumn.
  route: >-
    Nunisi sits about 24 km beyond Kharagauli by road. From Tbilisi, take the S1 (E60) west; the shorter
    approach leaves the motorway near Surami and follows the winding Sh55 west through Pona and Moliti,
    while the alternative runs through the Rikoti tunnel, down to Shorapani and back east through Kharagauli.
    Either way it is roughly 160–175 km and close to three hours. The last kilometres, on the side road
    down to the resort, are narrow and patched, with tight bends — fine for an ordinary car in dry weather,
    slower after rain. Fill up in Khashuri; there is no fuel in the forest.
ru:
  name: Нуниси
  short: >-
    Крошечный курорт с тёплой сероводородной водой в глубине лесов Боржоми-Харагаули, где ею лечат кожные
    болезни с 1856 года.
  body: >-
    **Даже своим именем Нуниси обязано кожной болезни, которую лечит его вода.** Село когда-то называлось
    Муниси — от «муни», старого названия кожной болезни, которую лечила здешняя вода; со временем первая
    буква стёрлась, и Муниси стало Нуниси.


    Слава источника гораздо старше любой гостиницы. Национальная туристическая администрация Грузии относит
    его местную известность к XVII веку, а в XVIII веке князь и географ Вахушти Багратиони описал воду
    как приятную и полезную. Пациентов здесь лечат с 1856 года, что делает Нуниси курортом имперской эпохи,
    а не советским творением, как часто полагают. Предание уходит ещё глубже: животные царя Давида Строителя
    — в одном рассказе кони, в другом — вьючные ослы — будто бы лежали раненые в тёплой воде и поднимались
    с зажившими ранами, после чего царь велел построить в селе церковь. Это легенда, но выбрана она не
    случайно.


    Вода выходит из источника Зваре уже тёплой и сероводородной и используется и для питья, и для купания
    — прежде всего при кожных заболеваниях. Сам курорт скромен: лесной отель с банным корпусом и несколько
    коттеджей на высоте около 750 метров, тогда как село поднимается выше по северному склону Месхетского
    хребта, до отметки около 920 метров.


    Настоящая роскошь здесь — сама местность, юго-восточный угол Боржоми-Харагаульского национального
    парка. Весной пахнет цветущей сосной и пихтой; летними ночами держится прохлада; тропы ведут прямо
    в лес. Рядом возвышается Монашеская скала — пещерный комплекс, где экспедиции нашли проход, запечатанный
    валуном.


    Нуниси не создано для однодневной поездки. Оно создано для того, чтобы дать неделе спокойно затихнуть
    вокруг вас.
  tip: >-
    Четырёх часов достаточно, чтобы осмотреть это место, но большинство тех, кто добрался сюда, остаются
    хотя бы на ночь. Ванны и процедуры организуются через курорт, так что бронируйте заранее и возьмите
    с собой все имеющиеся медицинские заключения; кожное заболевание лучше сначала обсудить со своим врачом.
    Кроме как в гостинице, поесть почти негде — купите продукты в Харагаули или Хашури и не рассчитывайте
    на банкомат. Мобильная связь может быть неустойчивой. На лесных тропах носите длинные брюки и закрытую
    обувь: клещи активны с конца весны до осени.
  route: >-
    Нуниси лежит примерно в 24 км за Харагаули по дороге. Из Тбилиси возьмите трассу S1 (E60) на запад;
    более короткий путь сворачивает с магистрали у Сурами и идёт по извилистой Sh55 через Пону и Молити,
    а альтернативный маршрут проходит через Рикотский тоннель, спускается к Шорапани и возвращается на
    восток через Харагаули. В любом случае это примерно 160–175 км и около трёх часов. Последние километры,
    на боковой дороге, ведущей к курорту, узкие и в заплатках, с крутыми поворотами — в сухую погоду обычная
    машина проедет без проблем, после дождя придётся ехать медленнее. Заправляйтесь в Хашури; в лесу топлива
    нет.
fa:
  name: نونیسی
  short: >-
    استراحتگاهی کوچک با آب گرم گوگردی، در ژرفای جنگل‌های بورجومی-خاراگائولی، جایی که این آب از سال ۱۸۵۶
    بیماری‌های پوستی را درمان می‌کند.
  body: >-
    **نونیسی حتی نامش را وامدار همان بیماری پوستی است که آبش درمان می‌کند.** این روستا زمانی مونیسی نامیده
    می‌شد، از واژه‌ی *مونی*، نام کهنِ بیماری پوستی‌ای که آبِ آن برای درمانش به کار می‌رفت؛ با گذر زمان
    حرف نخست فروافتاد و مونیسی به نونیسی بدل شد.


    آوازه‌ی این چشمه بسیار کهن‌تر از هر هتلی است. سازمان ملی گردشگری گرجستان شهرت محلی آن را به سده‌ی
    هفدهم بازمی‌گرداند، و در سده‌ی هجدهم شاهزاده و جغرافی‌دان واخوشتی باتونیشویلی آب آن را گوارا و شفابخش
    وصف کرده است. بیماران از سال ۱۸۵۶ در اینجا درمان می‌شوند، و همین نونیسی را استراحتگاهی از دوران امپراتوری
    می‌سازد، نه آفریده‌ی دوران شوروی، چنان‌که غالباً پنداشته می‌شود. روایت‌های سنتی از این هم دورتر می‌روند:
    گفته می‌شود جانوران شاه داوید سازنده — در یک روایت اسبان، در روایتی دیگر خران باربر — زخم‌خورده در
    آب گرم دراز کشیدند و با زخم‌هایی بهبود یافته برخاستند، و پس از آن شاه فرمان داد کلیسایی در روستا بنا
    شود. این یک افسانه است، اما افسانه‌ای به‌جا.


    آب به‌گونه‌ی طبیعی گرم و گوگردی از چشمه‌ی زواره برمی‌خیزد و هم برای نوشیدن و هم برای حمام‌کردن به
    کار می‌رود، بیش از همه برای بیماری‌های پوستی. خود استراحتگاه ساده است: هتلی جنگلی با بخش حمام و چند
    کلبه در ارتفاع نزدیک ۷۵۰ متری، حال آنکه روستا بالاتر، بر دامنه‌ی شمالی رشته‌کوه مسختی تا نزدیک ۹۲۰
    متر گسترده می‌شود.


    شکوه راستین اینجا، خود محیط است، در گوشه‌ی جنوب‌شرقی پارک ملی بورجومی-خاراگائولی. بهار بوی شکوفه‌ی
    کاج و نراد می‌آورد؛ شب‌های تابستان خنک می‌مانند؛ راه‌ها راست به جنگل می‌رسند. در نزدیکی، صخره‌ی راهبان
    سر برمی‌کشد، مجموعه‌ای غاری که در آن گروه‌های کاوشگر گذرگاهی مسدود با تخته‌سنگی یافته‌اند.


    نونیسی برای گشت یک‌روزه ساخته نشده. برای این ساخته شده که بگذارید یک هفته آرام‌آرام در اطرافتان بی‌صدا
    شود.
  tip: >-
    چهار ساعت برای دیدن اینجا کافی است، اما بیشتر کسانی که زحمت آمدن را بر خود هموار می‌کنند، دست‌کم یک
    شب می‌مانند. حمام‌ها و درمان‌ها از طریق استراحتگاه ترتیب داده می‌شوند، پس پیشاپیش رزرو کنید و هر گونه
    یادداشت پزشکی که دارید را همراه بیاورید؛ بهتر است بیماری پوستی را نخست با پزشک خودتان مطرح کنید. بیرون
    از هتل تقریباً جایی برای غذاخوردن نیست — آذوقه را در خاراگائولی یا خاشوری بخرید، و روی دستگاه خودپرداز
    حساب نکنید. ممکن است آنتن تلفن همراه ضعیف یا قطع‌ووصل باشد. در راه‌های جنگلی شلوار بلند و کفش بسته
    بپوشید: کنه‌ها از اواخر بهار تا پاییز فعال‌اند.
  route: >-
    نونیسی از راه زمینی حدود ۲۴ کیلومتر آن‌سوی خاراگائولی است. از تفلیس، مسیر S1 (E60) را به سوی غرب بگیرید؛
    مسیر کوتاه‌تر از بزرگراه نزدیک سورامی خارج می‌شود و از راه پرپیچ‌وخم Sh55 از میان پونا و مولیتی به
    غرب می‌رود، در حالی که مسیر دیگر از تونل ریکوتی می‌گذرد، به شوراپانی پایین می‌آید و از خاراگائولی
    به شرق برمی‌گردد. در هر حال حدود ۱۶۰ تا ۱۷۵ کیلومتر است و نزدیک به سه ساعت. کیلومترهای پایانی، بر
    راه فرعی که به استراحتگاه پایین می‌رود، تنگ و وصله‌خورده‌اند، با پیچ‌های تند — برای خودرویی معمولی
    در هوای خشک مناسب است، پس از باران کندتر. در خاشوری سوخت‌گیری کنید؛ در جنگل سوختی یافت نمی‌شود.
he:
  name: נוניסי
  short: אתר מרפא זעיר במים גופרתיים חמים, עמוק בתוך יערות בורז'ומי-חרגאולי, שבו המים מטפלים במחלות עור
    מאז 1856.
  body: >-
    **נוניסי חייבת אפילו את שמה למחלת העור שמימיה מרפאים.** הכפר נקרא בעבר מוניסי, מהמילה *מוני*, השם
    הישן של מחלת עור שמימיו שימשו לרפא אותה; במרוצת הזמן האות הראשונה נשמטה, ומוניסי הפכה לנוניסי.


    תהילת המעיין עתיקה בהרבה מכל מלון. הרשות הלאומית לתיירות של גאורגיה מתארכת את פרסומו המקומי למאה ה-17,
    ובמאה ה-18 תיאר הנסיך והגאוגרף ואחושטי בטונישווילי את המים כנעימים ומועילים. חולים מטופלים כאן מאז
    1856, מה שהופך את נוניסי לאתר מרפא מהעידן הקיסרי, ולא, כמו שנוטים לחשוב, יצירה סובייטית. המסורת מגיעה
    אף רחוק יותר: מספרים שבעלי החיים של המלך דוד הבנאי — סוסים בגרסה אחת, חמורי משא בגרסה שנייה — שכבו
    פצועים במים החמים והתרוממו כשפצעיהם החלימו, ולאחר מכן הורה המלך לבנות כנסייה בכפר. זו אגדה, אך אגדה
    שנבחרה היטב.


    המים עולים באופן טבעי חמים וגופרתיים ממעיין זווארה, ומשמשים לשתייה ולרחצה כאחד, בעיקר לטיפול במחלות
    עור. האתר עצמו צנוע: מלון יער עם מבנה מרחצאות וכמה בקתות בגובה של כ-750 מטר, בעוד הכפר משתרע גבוה
    יותר על המדרון הצפוני של רכס מסחתי, עד לכ-920 מטר.


    המותרות האמיתיות כאן הן הנוף עצמו, בפינה הדרום-מזרחית של הפארק הלאומי בורז'ומי-חרגאולי. באביב האוויר
    מבושם באורן ובאשוח הפורחים; לילות הקיץ נשארים קרירים; שבילים מובילים ישר לתוך היער. בקרבת מקום מזדקר
    צוק הנזירים, מערכת מערות שבה מצאו משלחות מעבר שנחסם באבן גדולה.


    נוניסי לא נבנתה לביקור של יום. היא נבנתה כדי לאפשר לשבוע שלם להשתקט סביבכם.
  tip: >-
    ארבע שעות מספיקות לראות את המקום, אך רוב מי שעושים את המאמץ נשארים לפחות ללילה אחד. מרחצאות וטיפולים
    מתואמים באמצעות האתר, לכן הזמינו מראש והביאו איתכם מסמכים רפואיים שיש לכם; מומלץ לדון במחלת עור תחילה
    עם הרופא שלכם. אין כמעט מקום לאכול מחוץ למלון — קנו אספקה בחרגאולי או בחשורי, ואל תסמכו על כספומט.
    הקליטה הסלולרית עשויה להיות לא רציפה. בשבילי היער לבשו מכנסיים ארוכים ונעליים סגורות: קרציות פעילות
    מסוף האביב עד הסתיו.
  route: >-
    נוניסי ממוקמת כ-24 ק"מ מעבר לחרגאולי בכביש. מטביליסי, סעו בכביש S1 (E60) מערבה; הגישה הקצרה יותר יורדת
    מהכביש הראשי סמוך לסוראמי ועוקבת אחר הכביש המתפתל Sh55 מערבה דרך פונה ומוליטי, ואילו החלופה עוברת
    דרך מנהרת ריקוטי, יורדת לשוראפני וחוזרת מזרחה דרך חרגאולי. בכל מקרה זה כ-160–175 ק"מ וכשלוש שעות.
    הקילומטרים האחרונים, בכביש הצדדי היורד לאתר, צרים ומטולאים, עם עיקולים חדים — מתאימים לרכב רגיל במזג
    אוויר יבש, איטיים יותר לאחר גשם. תדלקו בחשורי; ביער אין דלק.
ar:
  name: نونيسي
  short: منتجع صغير بمياه كبريتية دافئة، في عمق غابات بورجومي-خاراغاولي، حيث تعالج المياه أمراض الجلد
    منذ عام 1856.
  body: >-
    **تدين نونيسي حتى باسمها للداء الجلدي الذي تشفيه مياهها.** كانت القرية تُدعى مونيسي، من *موني*، الاسم
    القديم لداء جلدي كانت مياهها تُستخدم لعلاجه؛ ومع الزمن سقط الحرف الأول، فصارت مونيسي نونيسي.


    شهرة النبع أقدم بكثير من أي فندق. تُرجع الوكالة الوطنية الجورجية للسياحة شهرته المحلية إلى القرن السابع
    عشر، وفي القرن الثامن عشر وصف الأمير والجغرافي واخوشتي باتونيشفيلي مياهه بأنها لطيفة ومفيدة. يُعالَج
    المرضى هنا منذ عام 1856، ما يجعل نونيسي منتجعًا من العصر الإمبراطوري لا اختراعًا سوفييتيًا كما يُظن
    غالبًا. وتمتد الروايات المتوارثة إلى أبعد من ذلك: يُقال إن حيوانات الملك داود البنّاء — أحصنة في رواية،
    وحمير حِمل في رواية أخرى — رقدت جريحة في الماء الدافئ ونهضت وقد شُفيت جروحها، فأمر الملك ببناء كنيسة
    في القرية. إنها أسطورة، لكنها أسطورة حسنة الاختيار.


    تتدفّق المياه من نبع زفاره دافئةً وكبريتيةً بطبيعتها، وتُستخدم للشرب والاستحمام على السواء، ولا سيما
    لعلاج أمراض الجلد. المنتجع نفسه متواضع: فندق غابي بمبنى حمامات وبضعة أكواخ على ارتفاع نحو 750 مترًا،
    بينما تمتد القرية أعلى على السفح الشمالي لسلسلة جبال مسخيتي، حتى نحو 920 مترًا.


    الرفاهية الحقيقية هنا هي المكان نفسه، في الزاوية الجنوبية الشرقية من حديقة بورجومي-خاراغاولي الوطنية.
    الربيع يجلب عبير الصنوبر والشوح المزهر؛ وليالي الصيف تبقى منعشة؛ والمسارات تقود مباشرة إلى الغابة.
    وترتفع بالقرب صخرة الرهبان، وهي مجمّع كهوف عثرت فيه بعثات على ممر مغلق بصخرة كبيرة.


    لم تُبنَ نونيسي لرحلة يوم واحد. بُنيت لتترك أسبوعًا كاملاً يهدأ حولك.
  tip: >-
    تكفي أربع ساعات لرؤية المكان، لكن معظم من يبذلون جهد الوصول إليه يمكثون ليلة واحدة على الأقل. تُرتَّب
    الحمامات والعلاجات عبر المنتجع، فاحجز مسبقًا واحمل معك أي ملاحظات طبية لديك؛ ويُفضَّل مناقشة أي حالة
    جلدية مع طبيبك أولاً. لا يوجد تقريبًا مكان للأكل خارج الفندق — اشترِ المؤن في خاراغاولي أو خاشوري،
    ولا تعتمد على وجود صراف آلي. يمكن أن تكون تغطية الهاتف المحمول متقطعة. في مسارات الغابة، ارتدِ بنطالاً
    طويلاً وحذاءً مغلقًا: القُراد نشط من أواخر الربيع حتى الخريف.
  route: >-
    تقع نونيسي على نحو 24 كم بعد خاراغاولي بالطريق. من تبليسي، خذ الطريق S1 (E60) غربًا؛ المسار الأقصر
    يخرج من الطريق السريع قرب سورامي ويتبع طريق Sh55 المتعرج غربًا عبر بونا وموليتي، بينما يمر المسار
    البديل عبر نفق ريكوتي، وينزل إلى شوراباني ويعود شرقًا عبر خاراغاولي. في الحالتين، المسافة نحو 160–175
    كم وقرابة ثلاث ساعات. الكيلومترات الأخيرة، على الطريق الجانبي المنحدر إلى المنتجع، ضيقة ومرقّعة، بمنحنيات
    حادة — مناسبة لسيارة عادية في الطقس الجاف، وأبطأ بعد المطر. تزوّد بالوقود في خاشوري؛ فلا وقود في الغابة.
