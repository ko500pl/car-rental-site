ka:
  name: ნუნისი
  short: პატარა სატყეო ბალნეოლოგიური კურორტი ხარაგაულის მუნიციპალიტეტში, კანის დაავადებების სამკურნალო
    წყლით.
  body: >-
    **ნუნისი საქართველოს ერთ-ერთი ყველაზე პატარა კურორტია და ამას არ მალავს.** სოფელი ხარაგაულის მუნიციპალიტეტში,
    დაახლოებით 700-750 მეტრზე, ბორჯომ-ხარაგაულის ეროვნული პარკის კიდესთან, წიფლის, მუხის, წაბლისა და რცხილის
    ტყეშია.


    აქაური მინერალური წყალი მრავალკომპონენტიანია — შემადგენლობაში მანგანუმი, იოდი, კალიუმი და გოგირდოვანი
    ნაერთებია. მისი ძირითადი გამოყენება კანის დაავადებებია: ეგზემა, ჭინჭრის ციება, ქავილი; ტრადიციულად
    კუჭ-ნაწლავის სამკურნალოდაც იყენებენ. სამკურნალო კურსი ჩვეულებრივ ერთ-ორ კვირას გრძელდება — ერთდღიანი
    ვიზიტი აქ სამედიცინო აზრს არ ატარებს.


    წყაროების შესახებ ადგილობრივი გადმოცემა დავით აღმაშენებელს უკავშირებს: თითქოს მისი ლაშქრის ცხენები
    აქ განიკურნენ და ამის შემდეგ გავრცელდა ხმა წყლის თვისებებზე. დოკუმენტურად კურორტად ის საბჭოთა პერიოდში
    ჩამოყალიბდა, დღეს კი პატარა სასტუმრო, სააბაზანო კორპუსი და რამდენიმე კოტეჯია.


    რას იღებ აქ: ტყის ჰაერს, სიჩუმეს, გრილ ღამეებს ზაფხულშიც კი და ბილიკებს, რომლებიც პირდაპირ ეროვნული
    პარკის ტყეში გადადის. რას არ იღებ: რესტორნების არჩევანს, ღამის ცხოვრებას, მაღაზიებს, სანაპიროს. მობილური
    კავშირი ზოგან სუსტია.


    ნუნისი ლოგიკურია, თუ ბორჯომ-ხარაგაულის პარკში მიდიხარ და ღამის გასათევი გჭირდება, ან თუ საირმესა და
    ბორჯომს შორის რაღაც უფრო ჩუმს ეძებ.


    ნუნისის მთავარი არგუმენტი მაინც გარემოა. სოფლიდან გამავალი ბილიკები ბორჯომ-ხარაგაულის ქსელს უერთდება,
    მარელისისა და ხარაგაულის შესასვლელებამდე კი მანქანით მიდიხარ — ანუ აქ ყოფნა შეიძლება მკურნალობის გარეშეც,
    უბრალოდ ფეხით სიარულისთვის. ტყე ფოთლოვანია და სეზონთან ერთად სრულიად იცვლება: მაისში ახალი წიფლის
    ფოთოლი, აგვისტოში ღრმა ჩრდილი, ოქტომბრის ბოლოს კი ორიოდე კვირა ისეთი ფერისა, რომელსაც საქართველოში
    ჩამოსული უცხოელი თითქმის არასდროს ხედავს, რადგან ამ დროს კახეთშია.
  tip: >-
    დღის ვიზიტს ოთხი საათი ეყოფა, თუმცა ნუნისში ჩვეულებრივ ღამით რჩებიან. სამკურნალო პროცედურა წინასწარ
    ჯავშანს და ხშირად ექიმის ცნობას მოითხოვს; უბრალოდ წყაროსთან მისვლა უფასოა. სასტუმროს გარეთ კვების
    ადგილი თითქმის არ არის — სურსათი ხარაგაულში იყიდე. ტყის ბილიკებზე გრძელი შარვალი და დახურული ფეხსაცმელი
    ჯობია, ზაფხულში ტკიპაა. ბანკომატი აქ არ არის, ნაღდი ფული თან იქონიე.
  route: >-
    თბილისიდან E60-ით ხაშურამდე და რიკოთის მონაკვეთამდე, შემდეგ ხარაგაულის მაჩვენებელი ნიშნით სამხრეთით
    გადაუხვიე და აღმოსავლეთით ნუნისისკენ გაუყევი — სულ დაახლოებით 175 კმ და ორი საათი და ორმოცდაათი წუთი.
    ხარაგაულამდე ასფალტია; შემდეგი ოციოდე კილომეტრი ვიწრო გზაა, ნაწილობრივ დაზიანებული საფარით და მოსახვევებით.
    მშრალ ამინდში ჩვეულებრივი მანქანა გაივლის. საწვავი ხაშურსა და ხარაგაულში აიღე.
en:
  name: Nunisi
  short: A very small forest spa in Kharagauli municipality, whose mineral water is used for skin conditions.
  body: >-
    **Nunisi is one of the smallest spas in Georgia and makes no secret of it.** The village sits in Kharagauli
    municipality at roughly 700 to 750 metres, at the edge of the Borjomi-Kharagauli National Park, in
    forest of beech, oak, chestnut and hornbeam.


    The mineral water here has an unusual multi-component composition, including manganese, iodine, potassium
    and sulphur compounds. Its main application is dermatological — eczema, urticaria, persistent itching
    — and it has traditionally also been drunk for digestive complaints. A course of treatment normally
    runs one to two weeks; a single day's visit has no medical meaning.


    Local tradition attributes the discovery to David the Builder, whose cavalry horses are said to have
    been cured here, after which word of the water spread. Documented development as a resort belongs
    to the Soviet period. Today it amounts to a small hotel, a bath block and a handful of cottages.


    What you get: forest air, quiet, cool nights even in summer, and paths that run straight into national
    park woodland. What you do not get: a choice of restaurants, nightlife, shops or a view. Mobile coverage
    is weak in places.


    Nunisi makes sense if you are walking in Borjomi-Kharagauli and need a base, or if you want something
    quieter than Sairme and less built up than Borjomi.


    The setting is the real argument for Nunisi. Paths from the village link into the Borjomi-Kharagauli
    network, and the Marelisi and Kharagauli park entrances are within reach by car, so a stay here can
    be built around walking rather than around treatment. The forest is deciduous and changes completely
    with the season: new beech leaf in May, deep shade in August, and in late October a fortnight of colour
    that visitors to Georgia almost never see, because at that time of year they are all in Kakheti.
  tip: >-
    Four hours covers a day visit, though most people who come to Nunisi stay overnight. Treatments need
    booking in advance and often a doctor's note; simply walking to the spring costs nothing. There is
    almost nowhere to eat outside the hotel, so buy supplies in Kharagauli. On the forest paths wear long
    trousers and closed shoes — there are ticks in summer. There is no ATM, so carry cash.
  route: >-
    Take the E60 west from Tbilisi as far as Khashuri and the Rikoti section, then turn south at the sign
    for Kharagauli and follow the road east towards Nunisi — about 175 km in all, two hours fifty. Asphalt
    runs as far as Kharagauli; the following twenty kilometres are a narrow road with a partly broken
    surface and tight bends. A normal car manages in dry weather. Fuel is available in Khashuri and Kharagauli.
ru:
  name: Нуниси
  short: Очень маленький лесной бальнеологический курорт в Харагаульском муниципалитете, с водой для лечения
    кожи.
  body: >-
    **Нуниси — один из самых маленьких курортов Грузии, и он этого не скрывает.** Село лежит в Харагаульском
    муниципалитете на высоте примерно 700–750 метров, у края Боржоми-Харагаульского национального парка,
    в лесу из бука, дуба, каштана и граба.


    Здешняя минеральная вода имеет необычный многокомпонентный состав: марганец, йод, калий, сернистые
    соединения. Основное её применение — дерматологическое: экзема, крапивница, стойкий зуд; традиционно
    её пили и при желудочных расстройствах. Курс лечения обычно длится одну-две недели, и однодневный
    визит медицинского смысла не имеет.


    Местное предание связывает открытие источников с Давидом Строителем: будто бы здесь исцелились кони
    его войска, после чего молва о воде разошлась. Документированное развитие курорта относится к советскому
    времени. Сегодня это небольшой отель, ванный корпус и несколько коттеджей.


    Что вы получаете: лесной воздух, тишину, прохладные ночи даже летом и тропы, уходящие прямо в лес
    национального парка. Чего не получаете: выбора ресторанов, ночной жизни, магазинов и вида. Мобильная
    связь местами слабая.


    Нуниси имеет смысл, если вы идёте в Боржоми-Харагаульский парк и нужна база, или если хочется чего-то
    тише Саирме и менее застроенного, чем Боржоми.


    Главный аргумент в пользу Нуниси — всё-таки окружение. Тропы из села выходят в сеть Боржоми-Харагаульского
    парка, а входы в парк у Марелиси и Харагаули достижимы на машине, так что пребывание здесь можно построить
    вокруг прогулок, а не вокруг процедур. Лес лиственный и полностью меняется по сезонам: молодой буковый
    лист в мае, густая тень в августе и в конце октября пара недель такого цвета, какого приезжающие в
    Грузию почти никогда не видят, потому что в это время все они в Кахетии.
  tip: >-
    На дневной визит хватит четырёх часов, но в Нуниси обычно остаются с ночёвкой. Процедуры требуют предварительной
    записи и часто справки от врача; просто дойти до источника ничего не стоит. Поесть вне отеля почти
    негде, так что продукты берите в Харагаули. На лесных тропах нужны длинные брюки и закрытая обувь
    — летом есть клещи. Банкомата здесь нет, имейте наличные.
  route: >-
    Из Тбилиси по E60 до Хашури и участка Рикоти, затем поворот на юг по указателю на Харагаули и дальше
    на восток к Нуниси — всего около 175 км, два часа пятьдесят минут. Асфальт доходит до Харагаули; следующие
    двадцать километров — узкая дорога с местами разбитым покрытием и крутыми поворотами. В сухую погоду
    проходит обычная машина. Заправки есть в Хашури и Харагаули.
fa:
  name: نونیسی
  short: آبگرمی جنگلی و بسیار کوچک در شهرستان خاراگاولی، که آب معدنی‌اش برای بیماری‌های پوستی به کار می‌رود.
  body: >-
    **نونیسی از کوچک‌ترین آبگرم‌های گرجستان است و این را پنهان نمی‌کند.** روستا در شهرستان خاراگاولی و
    در ارتفاع حدود ۷۰۰ تا ۷۵۰ متر، در کنارهٔ پارک ملی بورجومی‑خاراگاولی، در جنگلی از راش و بلوط و شاه‌بلوط
    و ممرز نشسته است.


    آب معدنی اینجا ترکیبی چندجزئی و غیرمعمول دارد؛ از جمله منگنز، ید، پتاسیم و ترکیبات گوگردی. کاربرد
    اصلی آن پوستی است — اگزما، کهیر، خارش مزمن — و به‌طور سنتی برای ناراحتی‌های گوارشی هم نوشیده می‌شود.
    دورهٔ درمان معمولاً یک تا دو هفته است و بازدید یک‌روزه هیچ معنای پزشکی ندارد.


    روایت محلی کشف چشمه‌ها را به داوود سازنده نسبت می‌دهد؛ می‌گویند اسبان سپاه او اینجا شفا یافتند و پس
    از آن آوازهٔ آب پیچید. توسعهٔ مستند آن به‌عنوان استراحتگاه به دورهٔ شوروی بازمی‌گردد. امروز مجموعه
    شامل هتلی کوچک، ساختمان حمام و چند کلبه است.


    چه به دست می‌آورید: هوای جنگل، سکوت، شب‌های خنک حتی در تابستان، و مسیرهایی که مستقیم به جنگل پارک
    ملی می‌روند. چه به دست نمی‌آورید: تنوع رستوران، زندگی شبانه، مغازه یا چشم‌انداز. پوشش تلفن همراه جاهایی
    ضعیف است.


    نونیسی وقتی منطقی است که در بورجومی‑خاراگاولی پیاده‌روی می‌کنید و پایگاهی می‌خواهید، یا جایی آرام‌تر
    از سایرمه و کم‌ساخت‌وسازتر از بورجومی می‌جویید.


    استدلال اصلی به سود نونیسی همان محیط آن است. مسیرهای پیاده از روستا به شبکهٔ بورجومی‑خاراگاولی می‌پیوندد
    و ورودی‌های مارلیسی و خاراگاولی با خودرو در دسترس‌اند، پس اقامت اینجا را می‌توان بر پیاده‌روی بنا
    کرد نه بر درمان. جنگل پهن‌برگ است و با فصل یکسره دگرگون می‌شود: برگ تازهٔ راش در ماه مه، سایهٔ انبوه
    در اوت، و در اواخر اکتبر دو هفته رنگی که مسافران گرجستان تقریباً هرگز نمی‌بینند، چون آن وقت سال همه
    در کاختی‌اند.
  tip: >-
    برای بازدید یک‌روزه چهار ساعت کافی است، هرچند بیشتر کسانی که به نونیسی می‌آیند شب می‌مانند. درمان‌ها
    نیاز به رزرو پیشین و اغلب گواهی پزشک دارند؛ رفتن ساده تا چشمه هزینه‌ای ندارد. بیرون از هتل تقریباً
    جایی برای غذا نیست، پس آذوقه را در خاراگاولی بخرید. در مسیرهای جنگلی شلوار بلند و کفش بسته بپوشید؛
    تابستان کنه هست. خودپرداز وجود ندارد، پس پول نقد همراه داشته باشید.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری و مقطع ریکوتی بروید، سپس در تابلوی خاراگاولی به جنوب بپیچید و جاده
    را به شرق و به سوی نونیسی دنبال کنید — روی‌هم حدود ۱۷۵ کیلومتر و دو ساعت و پنجاه دقیقه. آسفالت تا
    خاراگاولی ادامه دارد؛ بیست کیلومتر بعد جاده‌ای باریک با روکش تا حدی خراب و پیچ‌های تند است. در هوای
    خشک خودروی معمولی از پسش برمی‌آید. سوخت در خاشوری و خاراگاولی موجود است.
he:
  name: נוניסי
  short: אתר מרפא יערי קטן מאוד בנפת חראגאולי, שמימיו המינרליים משמשים למחלות עור.
  body: >-
    **נוניסי הוא מן האתרים הקטנים ביותר בגאורגיה, ואינו מנסה להסתיר זאת.** הכפר יושב בנפת חראגאולי בגובה
    של כ-700 עד 750 מטר, בשולי הפארק הלאומי בורג'ומי־חראגאולי, ביער של אשור, אלון, ערמונים וגרביל.


    למים המינרליים כאן הרכב רב־רכיבי יוצא דופן, ובו מנגן, יוד, אשלגן ותרכובות גופרית. השימוש העיקרי בהם
    הוא עורי — אקזמה, אורטיקריה, גירוד מתמשך — ובמסורת גם שתו אותם למחלות עיכול. מהלך טיפול נמשך בדרך
    כלל שבוע עד שבועיים; לביקור של יום אחד אין משמעות רפואית.


    המסורת המקומית מייחסת את גילוי המעיינות לדוד הבנאי, שסוסי צבאו נרפאו כאן לפי הסיפור, ומאז התפרסמו
    המים. הפיתוח המתועד כאתר מרפא שייך לתקופה הסובייטית. היום מדובר במלון קטן, מבנה מרחצאות וכמה בקתות.


    מה מקבלים: אוויר יער, שקט, לילות קרירים גם בקיץ ושבילים היוצאים היישר אל יערות הפארק הלאומי. מה לא
    מקבלים: מבחר מסעדות, חיי לילה, חנויות או נוף. הקליטה הסלולרית חלשה במקומות.


    נוניסי הגיוני אם אתם מטיילים בבורג'ומי־חראגאולי וזקוקים לבסיס, או אם אתם מחפשים משהו שקט מסאירמה ובנוי
    פחות מבורג'ומי.


    הטיעון האמיתי לטובת נוניסי הוא הסביבה. שבילים מן הכפר מתחברים לרשת בורג'ומי־חראגאולי, ושערי הפארק
    במארליסי ובחראגאולי בהישג נסיעה, כך שאפשר לבנות שהות כאן סביב הליכה ולא סביב טיפולים. היער נשיר ומשתנה
    לחלוטין עם העונה: עלה אשור צעיר במאי, צל עמוק באוגוסט, ובסוף אוקטובר שבועיים של צבע שמבקרים בגאורגיה
    כמעט אינם רואים, משום שבאותה עונה כולם בקאחתי.
  tip: >-
    ארבע שעות מספיקות לביקור יומי, אך רוב הבאים לנוניסי לנים כאן. הטיפולים דורשים הזמנה מראש ולעתים אישור
    רופא; ההליכה אל המעיין עצמה חינם. כמעט אין היכן לאכול מחוץ למלון, אז קנו מצרכים בחראגאולי. בשבילי
    היער לבשו מכנסיים ארוכים ונעליים סגורות — יש קרציות בקיץ. אין כספומט, אז החזיקו מזומן.
  route: >-
    מטביליסי בכביש E60 עד חשורי ומקטע ריקוטי, ואז פנייה דרומה בשילוט לחראגאולי והמשך מזרחה לכיוון נוניסי
    — כ-175 ק״מ בסך הכול, שעתיים וחמישים. האספלט מגיע עד חראגאולי; עשרים הקילומטרים שאחריו הם כביש צר
    עם מיסעה שבורה בחלקה ופניות חדות. ברכב רגיל אפשר בימים יבשים. דלק יש בחשורי ובחראגאולי.
ar:
  name: نونيسي
  short: منتجع استشفائي حرجي صغير جداً في بلدية خاراغاولي، تُستعمل مياهه المعدنية لأمراض الجلد.
  body: >-
    **نونيسي من أصغر المنتجعات في جورجيا ولا يخفي ذلك.** تجلس القرية في بلدية خاراغاولي على ارتفاع نحو
    700 إلى 750 متراً، عند حافة منتزه بورجومي‑خاراغاولي الوطني، في غابة من الزان والبلوط والكستناء والغرب.


    للمياه المعدنية هنا تركيب متعدد المكونات غير مألوف، يشمل المنغنيز واليود والبوتاسيوم ومركبات كبريتية.
    واستعمالها الأساسي جلدي: الإكزيما والشرى والحكة المزمنة، وقد شُربت تقليدياً لاضطرابات الهضم أيضاً.
    وتمتد دورة العلاج عادة أسبوعاً إلى أسبوعين، ولا معنى طبياً لزيارة يوم واحد.


    تنسب الرواية المحلية اكتشاف الينابيع إلى داود البنّاء، إذ يُقال إن خيول جيشه شُفيت هنا فذاع خبر الماء
    بعدها. أما التطوير الموثق كمنتجع فيعود إلى الحقبة السوفييتية. واليوم يتألف المكان من فندق صغير ومبنى
    للحمامات وبضعة أكواخ.


    ما تناله: هواء الغابة والسكون وليالٍ باردة حتى في الصيف ودروباً تمضي مباشرة إلى غابات المنتزه الوطني.
    وما لا تناله: تنوعاً في المطاعم أو حياة ليلية أو متاجر أو إطلالة. وتغطية الهاتف ضعيفة في مواضع.


    يصير نونيسي خياراً منطقياً إن كنت تمشي في بورجومي‑خاراغاولي وتحتاج إلى قاعدة، أو إن أردت مكاناً أهدأ
    من سايرمه وأقل عمراناً من بورجومي.


    الحجة الحقيقية لصالح نونيسي هي محيطها. تتصل الدروب من القرية بشبكة بورجومي‑خاراغاولي، ومدخلا المنتزه
    في مارليسي وخاراغاولي في متناول السيارة، فيمكن بناء الإقامة هنا حول المشي لا حول العلاج. الغابة عريضة
    الأوراق وتتبدل كلياً مع الفصل: ورق زان جديد في مايو، وظل كثيف في أغسطس، وفي أواخر أكتوبر أسبوعان من
    الألوان لا يكاد زائرو جورجيا يرونها، لأنهم في ذلك الوقت من السنة يكونون جميعاً في كاخيتي.
  tip: >-
    أربع ساعات تكفي لزيارة نهارية، وإن كان معظم من يأتي نونيسي يبيت فيها. تحتاج الجلسات إلى حجز مسبق وغالباً
    إلى تقرير طبي؛ أما الوصول إلى النبع سيراً فمجاني. ولا يكاد يوجد مكان للأكل خارج الفندق، فاشترِ مؤونتك
    في خاراغاولي. وفي دروب الغابة البس سروالاً طويلاً وحذاءً مغلقاً، فالقراد موجود صيفاً. ولا صراف آلي
    هنا، فاحمل نقداً.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري ومقطع ريكوتي، ثم انعطف جنوباً عند لافتة خاراغاولي واتبع الطريق
    شرقاً نحو نونيسي — نحو 175 كم إجمالاً وساعتان وخمسون دقيقة. يمتد الإسفلت حتى خاراغاولي؛ والعشرون كيلومتراً
    التالية طريق ضيق سطحه متضرر جزئياً ومنعطفاته حادة. وتكفي سيارة عادية في الجو الجاف. الوقود متوفر في
    خاشوري وخاراغاولي.
