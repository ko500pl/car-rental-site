ka:
  name: სულორის ბალნეოლოგიური კურორტი
  short: >-
    პატარა კურორტი ვანთან, მწვანე ხეობაში: დაახლოებით 35-გრადუსიანი გოგირდოვანი წყალი, 32 ცალკე აბაზანა
    და საბჭოური დასვენების სახლის წყნარი რიტმი.
  body: >-
    **სულორი ისეთია, როგორიც ქართული კურორტი იქნებოდა, რეკლამა რომ არავის გაეკეთებინა: სოფელი რიონის შენაკადის
    წყნარ ხეობაში და წყალი, რომელიც მიწიდან დაახლოებით 35-გრადუსიანი ამოდის.**


    კურორტი ვანიდან 11 კილომეტრზე, მდინარე სულორის ნაპირას მდებარეობს — ეს რიონის 33-კილომეტრიანი მარცხენა
    შენაკადია. ზომით მოკრძალებულია: დაახლოებით სამი ჰექტარი, 32 ინდივიდუალური აბაზანა და საკუთარი პოლიკლინიკა.
    სეზონი ივნისიდან ოქტომბრამდე გრძელდება, როცა კოლხეთის დაბლობი ცხელი, ნოტიო და ბოლომდე მწვანეა.


    წყალი სუსტად მინერალიზებულია — ლიტრზე 0,3–0,6 გრამი, — გოგირდოვანი, სულფატურ-ჰიდროკარბონატული და ნატრიუმიანი.
    მას საყრდენ-მამოძრავებელი სისტემის, პერიფერიული ნერვული სისტემის, გულ-სისხლძარღვთა, კანისა და გინეკოლოგიური
    დაავადებების სამკურნალოდ იყენებენ.


    ადგილობრივი თქმულებით, ერთ თოვლიან ზამთარს მონადირეებმა მდინარის პირას ორთქლი შენიშნეს. ახლოს მივიდნენ
    და კლდის ძირისკენ ჩამდინარე ცხელი ნაკადი იპოვეს. გაზაფხულზე ავადმყოფი ჭაბუკი მოიყვანეს და ცხელ წყალში
    ჩააწვინეს; აბანოს შემდეგ ყმაწვილი ფეხზე წამოდგა — და მთელმა სოფელმა მაშინვე გაიგო სასწაულის ამბავი.


    საბჭოთა წლებში სულორი ადგილობრივი მნიშვნელობის კურორტი იყო და ზაფხულობით ასობით დამსვენებელს იღებდა;
    დასვენების სახლი დღესაც მუშაობს. სოფელში ისტორიული კოშკი, გორმაღალის ციხე დგას, ახლოს კი, სულორისა
    და რიონის შესართავთან, ძველი ვანია — კოლხური ქალაქი, რომლის ნაქალაქარმა ოქროს დიადემები, ყელსაბამები
    და საყურეები დაგვიბრუნა. სულორი ცხოვრებას არ შეგიცვლით. სამაგიეროდ, ერთი აბაზანის განმავლობაში გზის
    დაღლილობას მოგხსნით და კოლხეთის ოქროსკენ გაგისტუმრებთ.
  tip: >-
    აბაზანები, ოფიციალური სეზონის მიხედვით, ივნისიდან ოქტომბრამდე უნდა მუშაობდეს; სხვა დროს ჯერ დარეკეთ
    ან სოფელში იკითხეთ. ფასები და სამუშაო საათები ინტერნეტში გამოქვეყნებული არ არის, ამიტომ ყველაფერი
    ადგილზე დააზუსტეთ. ეს სამკურნალო აბაზანებია: პირველად ხანმოკლედ ჩაწექით, გულის პრობლემების ან ორსულობის
    შემთხვევაში კი ჯერ კურორტის ექიმს ჰკითხეთ. პირსახოცი და ფლოსტები თან იქონიეთ. კვებისა და ღამის გათევის
    არჩევანი მცირეა; სადილისთვის ვანი ან ვარციხე უფრო იმედიანია. დღე ასე დაგეგმეთ: დილით ვანის არქეოლოგიური
    მუზეუმი, შუადღით სულორის თბილი წყალი.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორის, ხაშურისა და ზესტაფონის გავლით, ქუთაისის მისადგომებამდე
    იარეთ — დაახლოებით 210 კილომეტრი. იქიდან სამხრეთით ვარციხის გზას (შ51) გაჰყევით, შემდეგ ბაღდათი–ვანის
    გზაზე (შ13) ვანისკენ გადადით და ადგილობრივ გზას სულორის ხეობაში აუყევით. სულ დაახლოებით 246 კილომეტრი
    და 3 საათი და 35 წუთი. გზა ბოლომდე მოასფალტებულია, ამიტომ ეკონომკლასის მანქანა სავსებით საკმარისია.
    საწვავი ქუთაისში ან ვანში ჩაასხით. გზად ვარციხე და ვანის მუზეუმი ორივე ხელსაყრელი გაჩერებაა.
en:
  name: Sulori Balneological Resort
  short: >-
    A small spa village in a green valley near Vani: sulphurous water at about 35°C, 32 private baths
    and the unhurried pace of a Soviet-era rest house.
  body: >-
    **Sulori is what a Georgian spa looks like when nobody is marketing it: a village in a quiet side
    valley of the Rioni, and water that comes out of the ground at about 35°C.**


    The resort lies 11 km from Vani on the Sulori, a modest left-bank tributary of the Rioni some 33 km
    long. It is modest by any measure — about three hectares, 32 individual baths and its own polyclinic
    — and its season runs from June to October, when the Colchian lowland is hot, humid and green to the
    edges.


    The water is lightly mineralised (0.3–0.6 g per litre), sulphurous, sodium sulphate-bicarbonate. It
    is prescribed for the joints and musculoskeletal system, the peripheral nerves, the heart and circulation,
    skin and gynaecological conditions.


    Local legend says that one snowbound winter, hunters noticed steam rising from the riverbank. Coming
    closer, they found a hot stream running down to the foot of a cliff. In spring they carried a sick
    young man there and lowered him into the water; after bathing he stood up on his own feet, and the
    whole village heard of the miracle.


    In Soviet times Sulori was a resort of local importance that received hundreds of holidaymakers each
    summer, and a rest house still operates today. The village keeps a historic tower, Gormagali Fortress,
    and not far away, near where the Sulori meets the Rioni, lies ancient Vani — the Colchian city whose
    excavations returned gold diadems, necklaces and earrings to the light. Sulori will not change your
    life. For the length of a bath, though, it will loosen the road out of your shoulders, and then send
    you on to the gold of Colchis.
  tip: >-
    The baths should be running from June to October (the official season); at other times phone ahead
    or ask in the village. Prices and hours are not published online, so confirm everything on the spot.
    These are therapeutic baths: keep a first soak short, and if you have a heart condition or are pregnant,
    ask the resort's doctor first. Bring a towel and flip-flops. Food and lodging choices are thin; Vani
    or Vartsikhe are better bets for lunch. A good shape for the day: Vani Archaeological Museum in the
    morning, Sulori's warm water in the afternoon.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori, Khashuri and Zestaponi to the approaches of Kutaisi
    — about 210 km. There turn south on the Sh51 through Vartsikhe, join the Sh13 Baghdati–Vani road towards
    Vani, and take the local road up into the Sulori valley. In all, about 246 km and 3 hours 35 minutes.
    The road is paved all the way, so an economy car is entirely adequate. Fill up in Kutaisi or Vani.
    Vartsikhe and the Vani museum both make natural stops on the way.
ru:
  name: Бальнеологический курорт Сулори
  short: >-
    Маленькое курортное село в зелёной долине близ Вани: сернистая вода около 35 °C, 32 индивидуальные
    ванны и неспешный ритм советского дома отдыха.
  body: >-
    **Сулори — это грузинский курорт, каким он бывает, когда его никто не рекламирует: село в тихой боковой
    долине Риони и вода, которая выходит из-под земли с температурой около 35 °C.**


    Курорт лежит в 11 км от Вани, на Сулори — небольшом левом притоке Риони длиной около 33 км. Он скромен
    по любым меркам: около трёх гектаров, 32 индивидуальные ванны и собственная поликлиника. Сезон длится
    с июня по октябрь, когда Колхидская низменность стоит жаркая, влажная и зелёная до краёв.


    Вода слабоминерализованная (0,3–0,6 г на литр), сернистая, сульфатно-гидрокарбонатная натриевая. Её
    назначают при болезнях суставов и опорно-двигательного аппарата, периферической нервной системы, сердца
    и сосудов, кожи, а также при гинекологических заболеваниях.


    Местная легенда рассказывает, что однажды снежной зимой охотники заметили пар над речным берегом.
    Подойдя ближе, они нашли горячий ручей, сбегавший к подножию скалы. Весной туда принесли больного
    юношу и опустили его в воду; после купания он сам встал на ноги, и о чуде узнало всё село.


    В советское время Сулори был курортом местного значения и каждое лето принимал сотни отдыхающих; дом
    отдыха работает и сегодня. В селе сохранилась историческая башня — крепость Гормагали, а неподалёку,
    там, где Сулори впадает в Риони, лежит древний Вани — колхидский город, раскопки которого вернули
    на свет золотые диадемы, ожерелья и серьги. Сулори не изменит вашу жизнь. Но на время одной ванны
    снимет с плеч усталость дороги — и отправит вас дальше, к золоту Колхиды.
  tip: >-
    Ванны по официальному сезону должны работать с июня по октябрь; в другое время позвоните заранее или
    спросите в селе. Цены и часы работы в интернете не публикуются, так что всё уточняйте на месте. Это
    лечебные ванны: первое погружение сделайте коротким, а при болезнях сердца или беременности сначала
    посоветуйтесь с врачом курорта. Возьмите полотенце и шлёпанцы. С едой и жильём здесь негусто: пообедать
    лучше в Вани или Варцихе. Удачная схема дня: утром — Ванский археологический музей, после обеда —
    тёплая вода Сулори.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Гори, Хашури и Зестафони до подъездов к Кутаиси
    — около 210 км. Там сверните на юг, на Sh51 через Варцихе, выйдите на дорогу Sh13 Багдати — Вани в
    сторону Вани, а затем по местной дороге поднимитесь в долину Сулори. Всего около 246 км и 3 часа 35
    минут. Асфальт на всём протяжении, так что автомобиля эконом-класса вполне достаточно. Заправьтесь
    в Кутаиси или Вани. Варцихе и музей в Вани — естественные остановки по пути.
fa:
  name: تفرجگاه آب‌درمانی سولوری
  short: >-
    روستای آب‌درمانی کوچکی در دره‌ای سرسبز نزدیک وانی: آب گوگردی با دمای حدود ۳۵ درجه، ۳۲ وان انفرادی
    و آهنگ آرام یک آسایشگاه دوران شوروی.
  body: >-
    **سولوری همان چیزی است که یک آب‌درمانگاه گرجی می‌شود وقتی هیچ‌کس برایش تبلیغ نمی‌کند: روستایی در یکی
    از دره‌های فرعی و آرام ریونی، و آبی که با دمای حدود ۳۵ درجه از دل زمین می‌جوشد.**


    این تفرجگاه در ۱۱ کیلومتری وانی، کنار رود سولوری قرار دارد؛ شاخه‌ای کوچک که از کرانهٔ چپ به ریونی
    می‌پیوندد و حدود ۳۳ کیلومتر درازا دارد. با هر معیاری کوچک و بی‌تکلف است: حدود سه هکتار، ۳۲ وان انفرادی
    و درمانگاهی از آنِ خود. فصل کارش از ژوئن تا اکتبر است، روزهایی که دشت کلخیس گرم و شرجی است و تا کرانه‌هایش
    سبز.


    آب آن کم‌املاح است (۰٫۳ تا ۰٫۶ گرم در لیتر)، گوگردی، و از نوع سولفاته-بی‌کربناتهٔ سدیمی. آن را برای
    بیماری‌های مفاصل و دستگاه حرکتی، اعصاب محیطی، قلب و گردش خون، پوست و بیماری‌های زنان تجویز می‌کنند.


    افسانه‌ای محلی می‌گوید در زمستانی پربرف، شکارچیان دیدند که از کنارهٔ رود بخار برمی‌خیزد. نزدیک‌تر
    که رفتند، جویباری گرم یافتند که تا پای صخره‌ای روان بود. بهار که رسید، جوان بیماری را به آنجا بردند
    و در آب فرو بردند؛ پس از آب‌تنی، او بی‌یاری دیگران روی پاهای خود ایستاد و خبر این معجزه در سراسر روستا
    پیچید.


    در دوران شوروی، سولوری تفرجگاهی با اهمیت محلی بود که هر تابستان صدها مسافر را پذیرا می‌شد، و آسایشگاهش
    هنوز هم دایر است. در روستا برجی تاریخی، یعنی دژ گورماغالی، برپاست و در همان نزدیکی، جایی که سولوری
    به ریونی می‌پیوندد، وانیِ باستانی قرار دارد — شهر کلخیسی که کاوش‌هایش دیهیم‌های زرین، گردنبندها و
    گوشواره‌ها را دوباره به روشنایی بازگرداند. سولوری زندگی‌تان را دگرگون نمی‌کند. اما به اندازهٔ یک آب‌تنی،
    خستگی راه را از شانه‌هایتان می‌گیرد و سپس شما را به سوی طلای کلخیس روانه می‌کند.
  tip: >-
    طبق فصل رسمی، حمام‌ها باید از ژوئن تا اکتبر دایر باشند؛ در ماه‌های دیگر پیش از رفتن تماس بگیرید یا
    در روستا بپرسید. قیمت‌ها و ساعت کار در اینترنت منتشر نشده است، پس همه‌چیز را در محل جویا شوید. این
    حمام‌ها درمانی‌اند: نخستین آب‌تنی را کوتاه نگه دارید، و اگر بیماری قلبی دارید یا باردارید، پیش از
    آن با پزشک تفرجگاه مشورت کنید. حوله و دمپایی همراه بیاورید. گزینه‌های غذا و اقامت اندک است؛ برای ناهار،
    وانی یا وارتسیخه انتخاب‌های بهتری‌اند. برنامه‌ای خوب برای یک روز: صبح موزهٔ باستان‌شناسی وانی، بعدازظهر
    آب گرم سولوری.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب بروید و از کنار گوری، خاشوری و زستافونی بگذرید تا به حوالی کوتایسی
    برسید — حدود ۲۱۰ کیلومتر. آنجا به جنوب بپیچید و از جادهٔ Sh51 از وارتسیخه بگذرید، سپس وارد جادهٔ Sh13
    باغداتی–وانی شوید و به سمت وانی بروید و از جادهٔ محلی به درهٔ سولوری بالا بروید. روی‌هم حدود ۲۴۶ کیلومتر
    و ۳ ساعت و ۳۵ دقیقه راه است. تمام مسیر آسفالت است، پس یک خودروی اقتصادی کاملاً کافی است. در کوتایسی
    یا وانی باک را پر کنید. وارتسیخه و موزهٔ وانی هر دو توقف‌هایی طبیعی در طول راه‌اند.
he:
  name: אתר המרפא סולורי
  short: >-
    כפר מרפא קטן בעמק ירוק ליד ואני: מים גופריתיים בחום של כ-35 מעלות, 32 אמבטיות פרטיות וקצב נינוח של
    בית הבראה מהתקופה הסובייטית.
  body: >-
    **סולורי הוא מה שקורה לאתר מרפא גאורגי כשאיש אינו משווק אותו: כפר בעמק צדדי ושקט של הריוני, ומים שיוצאים
    מן האדמה בחום של כ-35 מעלות.**


    אתר המרפא שוכן 11 ק"מ מהעיר ואני, על נהר סולורי — יובל צנוע שנשפך אל הריוני מגדתו השמאלית ואורכו כ-33
    ק"מ. הוא צנוע בכל קנה מידה: כשלושה הקטרים, 32 אמבטיות נפרדות ומרפאה משלו. העונה נמשכת מיוני עד אוקטובר,
    כששפלת קולכיס חמה, לחה וירוקה עד קצה האופק.


    המים דלי מינרלים (0.3–0.6 גרם לליטר), גופריתיים, מסוג סולפטי-ביקרבונטי נתרני. הם ניתנים כטיפול במחלות
    המפרקים ומערכת השלד והשרירים, העצבים ההיקפיים, הלב וכלי הדם, העור, ובבעיות גינקולוגיות.


    אגדה מקומית מספרת שבחורף מושלג אחד הבחינו ציידים באדים העולים מגדת הנהר. כשהתקרבו, מצאו פלג חם הזורם
    אל רגלי צוק. באביב נשאו לשם צעיר חולה והורידו אותו אל המים; אחרי הרחצה קם על רגליו בכוחות עצמו, וכל
    הכפר שמע על הנס.


    בתקופה הסובייטית היה סולורי אתר מרפא בעל חשיבות מקומית, שקלט מדי קיץ מאות נופשים, ובית ההבראה פועל
    עד היום. בכפר עומד מגדל היסטורי, מבצר גורמגאלי, ולא הרחק משם, סמוך למקום שבו הסולורי נשפך אל הריוני,
    שוכנת ואני העתיקה — העיר הקולכית שחפירותיה השיבו אל האור נזרי זהב, שרשראות ועגילים. סולורי לא ישנה
    את חייכם. אבל למשך אמבטיה אחת הוא ישחרר מהכתפיים את עייפות הדרך, ואז ישלח אתכם הלאה, אל הזהב של קולכיס.
  tip: >-
    האמבטיות אמורות לפעול מיוני עד אוקטובר, בעונה הרשמית; בחודשים אחרים התקשרו מראש או שאלו בכפר. מחירים
    ושעות פעילות אינם מתפרסמים ברשת, לכן ודאו הכול במקום. אלה אמבטיות מרפא: הקפידו שהטבילה הראשונה תהיה
    קצרה, ואם יש לכם בעיית לב או שאתן בהריון, היוועצו קודם ברופא האתר. הביאו מגבת וכפכפים. האפשרויות לאוכל
    וללינה דלות; לארוחת צהריים עדיף לעצור בוואני או בוורציחה. מבנה טוב ליום: בבוקר המוזיאון הארכאולוגי
    של ואני, אחר הצהריים המים החמימים של סולורי.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), על פני גורי, חשורי וזסטפוני, עד לפאתי קותאיסי — כ-210 ק"מ. שם פנו
    דרומה לכביש Sh51 דרך ורציחה, המשיכו לכביש Sh13 (בגדאתי–ואני) לכיוון ואני, ומשם עלו בדרך המקומית אל
    עמק סולורי. בסך הכול כ-246 ק"מ ו-3 שעות ו-35 דקות. הכביש סלול לכל אורכו, כך שרכב אקונומי מספיק בהחלט.
    תדלקו בקותאיסי או בוואני. ורציחה ומוזיאון ואני הן תחנות טבעיות בדרך.
ar:
  name: منتجع سولوري للعلاج بالمياه المعدنية
  short: >-
    قرية استشفائية صغيرة في وادٍ أخضر قرب فاني: مياه كبريتية بحرارة نحو 35 درجة مئوية، و32 حمّامًا فرديًا،
    وإيقاع هادئ لدار استراحة من الحقبة السوفيتية.
  body: >-
    **سولوري هو ما يبدو عليه المنتجع الجورجي حين لا يروّج له أحد: قرية في وادٍ جانبي هادئ من أودية ريوني،
    وماء يخرج من باطن الأرض بحرارة تقارب 35 درجة مئوية.**


    يقع المنتجع على بعد 11 كم من فاني، على نهر سولوري، وهو رافد متواضع يصبّ في ريوني من ضفته اليسرى ويبلغ
    طوله نحو 33 كم. إنه متواضع بكل المقاييس: نحو ثلاثة هكتارات، و32 حمّامًا فرديًا، وعيادة خاصة به. ويمتد
    موسمه من يونيو إلى أكتوبر، حين يكون سهل كولخيس حارًّا رطبًا أخضر حتى أطرافه.


    المياه قليلة التمعدن (0.3–0.6 غرام في اللتر)، كبريتية، من النوع الكبريتاتي البيكربوناتي الصودي. وتوصف
    لعلاج أمراض المفاصل والجهاز العضلي الهيكلي، والأعصاب الطرفية، والقلب والدورة الدموية، والجلد، والأمراض
    النسائية.


    تقول أسطورة محلية إن صيّادين لمحوا، في شتاء غزير الثلج، بخارًا يتصاعد من ضفة النهر. ولما اقتربوا وجدوا
    جدولًا ساخنًا ينحدر إلى أسفل جرف صخري. وفي الربيع حملوا إليه شابًا مريضًا وأنزلوه في الماء؛ وبعد الاستحمام
    وقف على قدميه دون عون، وسمعت القرية كلها بالمعجزة.


    في الحقبة السوفيتية كان سولوري منتجعًا ذا أهمية محلية يستقبل مئات المصطافين كل صيف، ولا تزال دار الاستراحة
    تعمل حتى اليوم. وفي القرية برج تاريخي هو قلعة غورماغالي، وعلى مقربة منها، قرب ملتقى سولوري بريوني،
    تقع فاني القديمة، المدينة الكولخية التي أعادت حفرياتها إلى النور تيجانًا ذهبية وقلائد وأقراطًا. لن
    يغيّر سولوري حياتك. لكنه، طوال مدة حمّام واحد، سيزيل عن كتفيك تعب الطريق، ثم يمضي بك إلى ذهب كولخيس.
  tip: >-
    يُفترض أن تعمل الحمّامات من يونيو إلى أكتوبر، خلال الموسم الرسمي؛ وفي غير ذلك من الأشهر اتصل مسبقًا
    أو اسأل في القرية. الأسعار ومواعيد العمل غير منشورة على الإنترنت، فتحقّق من كل شيء في المكان. هذه
    حمّامات علاجية: اجعل الغطسة الأولى قصيرة، ويُنصح مرضى القلب والحوامل باستشارة طبيب المنتجع أولًا.
    أحضر منشفة وشبشبًا. خيارات الطعام والإقامة شحيحة، وفاني أو فارتسيخه خياران أفضل للغداء. وإليك صيغة
    جيدة لليوم: متحف فاني الأثري صباحًا، ومياه سولوري الدافئة بعد الظهر.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وخاشوري وزيستافوني حتى مشارف كوتايسي، أي نحو 210
    كم. هناك انعطف جنوبًا إلى الطريق Sh51 عبر فارتسيخه، ثم انضم إلى طريق Sh13 بين باغداتي وفاني متجهًا
    إلى فاني، واسلك الطريق المحلي صعودًا إلى وادي سولوري. المسافة الإجمالية نحو 246 كم و3 ساعات و35 دقيقة.
    الطريق معبّد بالكامل، لذا تكفي سيارة اقتصادية تمامًا. املأ الخزان في كوتايسي أو فاني. وتشكّل فارتسيخه
    ومتحف فاني محطتين طبيعيتين على الطريق.
