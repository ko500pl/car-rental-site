ka:
  name: საქართველოს პარლამენტის ყოფილი შენობა ქუთაისში
  short: >-
    მინისა და ფოლადის გუმბათი რიონის ნაპირზე: 2012 წელს პარლამენტისთვის აშენდა და 2019 წლიდან, დეპუტატების
    თბილისში დაბრუნების შემდეგ, დუმს.
  body: >-
    **ექვს წელზე მეტხანს საქართველოს კანონები ქუთაისის დასავლეთ განაპირას, მინის გუმბათის ქვეშ იწერებოდა
    — მერე კი შუქი ჩაქრა.**


    ეს შენობა პრეზიდენტ მიხეილ სააკაშვილის დეცენტრალიზაციის ყველაზე თამამი ჟესტი იყო: ქვეყნის საკანონმდებლო
    ორგანო თბილისიდან იმერეთის ძველ დედაქალაქში უნდა გადასულიყო. პროექტის ავტორია ესპანური კომპანია CMD
    Ingenieros, არქიტექტორ ალბერტო დომინგო კაბოს ხელმძღვანელობით. შენობა 2011–2012 წლებში აშენდა და 2012
    წლის 26 მაისს, დამოუკიდებლობის დღეს, გაიხსნა. პარლამენტი აქ იმავე წლის ოქტომბრიდან 2019 წლის იანვრამდე
    იკრიბებოდა, სანამ კონსტიტუციურმა ცვლილებამ ისევ თბილისში არ დააბრუნა.


    მისი დასაწყისი უმწიკვლო არ ყოფილა. ამ ადგილას მეორე მსოფლიო ომში დაღუპულ ჯარისკაცთა საბჭოური მემორიალი
    იდგა; 2009 წლის დეკემბერში ტერიტორიის გასათავისუფლებლად ის ააფეთქეს და აფეთქებას დედა-შვილი ემსხვერპლა.
    საქართველოში ცოტა თანამედროვე ნაგებობა თუ დაწყებულა ასეთი ფასით. მემორიალისგან ერთი რამ შემორჩა —
    მხედრის ქანდაკება, რომელიც 2021 წლისთვის შენობასთან ახლოს, ახალ კვარცხლბეკზე იდგა; შემოვლისას მოძებნეთ.


    დღეს მხოლოდ გარსს ხედავთ: მინისა და ფოლადის ოვალური გუმბათი, დაახლოებით 150 მეტრი სიგრძისა, თეთრი
    ბეტონის ლენტით შემოსალტული, რიონის ნაპირზე ცისკენ ამობრუნებული ლინზასავით წევს. დილით მინა ცის ფერს
    იღებს, დღის მიწურულს კი ბეტონის ზოლი მდინარის ზემოთ ამართული მწვანე ფერდობების ფონზე თბილად ანათებს.


    2019 წლიდან დარბაზები ცარიელია. 2022 წელს მთავრობამ შენობაში ტექნოლოგიური ჰაბის შექმნა გამოაცხადა,
    მოგვიანებით კი TUMO-ს ცენტრზეც დაიწყეს საუბარი; გაიღო თუ არა მისი კარი, ქალაქში იკითხეთ. ჯერჯერობით
    ეს ერთი იდეის ძეგლია — იმ იდეისა, რომ ძალაუფლება დასავლეთით გადაინაცვლებდა, — და უჩვეულოდ გულწრფელი
    ძეგლი: დიდებული, ძვირი და მდუმარე.
  tip: >-
    პარლამენტის წასვლის შემდეგ შენობის ინტერიერი საზოგადოებისთვის დახურულია, ამიტომ ეს ნახევარსაათიანი
    გაჩერებაა და შენობას მხოლოდ გარედან ნახავთ: გაიარეთ მდინარის ნაპირი და ირაკლი აბაშიძის ქუჩიდან მისასვლელი
    გზა; გიდს ან სალაროს ნუ ელით. დათვალიერება უფასოა. გუმბათი ყველაზე კარგად დილის ან დღის მიწურულის
    დახრილ შუქზე ჩანს, როცა მინა ცას ირეკლავს და თვალს არ გჭრით. შენობასთან არც კაფეა და არც საპირფარეშო
    — ორივეს ცენტრში იპოვით, სადაც ბაგრატის ტაძარი, მწვანე ბაზარი და ძველი ებრაული უბანი დაახლოებით 4
    კილომეტრშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთით გაუყევით — მცხეთის, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე
    გადასვლით და ზესტაფონის გვერდით; ბენზინგასამართი სადგურები მთელ გზაზე უხვადაა. ქუთაისის გადასახვევზე
    მაგისტრალიდან გადაუხვიეთ და ქალაქი დასავლეთ ნაწილამდე გადაკვეთეთ: შენობა რიონის ნაპირზე, ირაკლი აბაშიძის
    ქუჩაზე დგას. სულ დაახლოებით 224 კილომეტრი და სამი საათია გაჩერებების გარეშე. გზა ბოლომდე ასფალტიანია,
    ამიტომ ეკონომკლასის მანქანაც საკმარისია; შენელება მხოლოდ რიკოთის აღმართზე და ქუთაისის საცობებში მოგიწევთ.
    მიმდებარე ქუჩებში მანქანის დაყენება, როგორც წესი, იოლია.
en:
  name: Former Georgian Parliament Building, Kutaisi
  short: >-
    A glass-and-steel dome on the Rioni, built in 2012 to bring Georgia's parliament to Kutaisi and silent
    since the deputies returned to Tbilisi in 2019.
  body: >-
    **For six years and more, Georgia's laws were made under a glass dome on the western edge of Kutaisi;
    then the lights went out.**


    The building was President Mikheil Saakashvili's boldest gesture of decentralisation: the national
    legislature would leave Tbilisi for the old capital of Imereti. It was designed by the Spanish firm
    CMD Ingenieros under the architect Alberto Domingo Cabo, built in 2011–12 and inaugurated on 26 May
    2012, Independence Day. Parliament sat here from that October until January 2019, when a constitutional
    amendment sent it back to Tbilisi.


    Its beginning was not innocent. The site had held Kutaisi's Soviet memorial to the soldiers of the
    Second World War, and when it was blown up in December 2009 to clear the ground, the blast killed
    a mother and her daughter. Few modern buildings in Georgia began at such a price. One piece of the
    memorial was kept: its horseman statue, which by 2021 stood on a new base near the building — look
    for it on your walk round.


    What you see today is the shell: an oval dome of glass and steel some 150 metres long, bound by a
    white ribbon of concrete, lying on the bank of the Rioni like an upturned lens. In the morning the
    glass takes the colour of the sky; in the late afternoon the concrete band warms against the green
    slopes above the river.


    Since 2019 the halls have stood empty. In 2022 the government announced a technology hub for the building,
    and later reports spoke of a TUMO centre; whether its doors are open yet, ask in town. For now it
    is a monument to an idea, that power could move west, and an unusually candid one: grand, costly and
    silent.
  tip: >-
    The interior has not been open to the public since Parliament left, so treat this as a half-hour stop
    from the outside: walk along the river and the approach from Irakli Abashidze Street, and expect no
    guides or ticket office. Looking is free. The dome is at its best in low morning or late-afternoon
    light, when the glass mirrors the sky instead of glaring. There is no café or toilet at the building;
    find both in the centre, where Bagrati Cathedral, the Green Bazaar and the old Jewish Quarter lie
    about 4 km away.
  route: >-
    From Tbilisi follow the S1 (E60) west past Mtskheta, Gori and Khashuri, through the Rikoti Pass and
    on past Zestaponi; fuel stations are plentiful the whole way. Leave the highway at the Kutaisi turn-off
    and cross the city to its western side, where the building stands on the Rioni at Irakli Abashidze
    Street. Count on about 224 km and three hours without stops. It is asphalt from door to door, so an
    economy car is all you need; the only slow stretches are the Rikoti climb and Kutaisi's own traffic.
    Parking in the surrounding streets is usually easy.
ru:
  name: Бывшее здание парламента Грузии, Кутаиси
  short: >-
    Купол из стекла и стали на Риони: построен в 2012 году для парламента Грузии и молчит с 2019-го, когда
    депутаты вернулись в Тбилиси.
  body: >-
    **Больше шести лет законы Грузии принимались под стеклянным куполом на западной окраине Кутаиси, а
    потом свет погас.**


    Здание стало самым смелым жестом децентрализации при президенте Михаиле Саакашвили: национальный законодательный
    орган должен был покинуть Тбилиси ради старой столицы Имеретии. Проект выполнила испанская компания
    CMD Ingenieros под руководством архитектора Альберто Доминго Кабо; здание построили в 2011–2012 годах
    и торжественно открыли 26 мая 2012 года, в День независимости. Парламент заседал здесь с октября того
    же года до января 2019-го, когда поправка к конституции вернула его в Тбилиси.


    Начало у этой истории было недобрым. На этом месте стоял советский мемориал Кутаиси воинам Второй
    мировой войны, и когда в декабре 2009 года его взорвали, расчищая площадку, взрыв убил мать и дочь.
    Мало какое современное здание в Грузии начиналось такой ценой. Одна часть мемориала всё же сохранилась:
    статую всадника к 2021 году установили на новом постаменте рядом со зданием — поищите её, обходя купол.


    Сегодня перед вами оболочка: овальный купол из стекла и стали длиной около 150 метров, опоясанный
    белой бетонной лентой, лежит на берегу Риони, словно перевёрнутая линза. Утром стекло принимает цвет
    неба; ближе к вечеру бетонный пояс теплеет на фоне зелёных склонов над рекой.


    С 2019 года залы пустуют. В 2022 году правительство объявило о размещении в здании технологического
    хаба, позже сообщалось о центре TUMO; открыты ли уже его двери, спросите в городе. Пока же это памятник
    идее — что власть может переместиться на запад, — и памятник на редкость откровенный: величественный,
    дорогой и безмолвный.
  tip: >-
    С тех пор как парламент уехал, внутрь публику не пускают, так что считайте это получасовой остановкой
    снаружи: пройдитесь вдоль реки и по подходу со стороны улицы Ираклия Абашидзе; гидов и касс не ждите.
    Смотреть можно бесплатно. Лучше всего купол выглядит в низком утреннем или предвечернем свете, когда
    стекло отражает небо, а не слепит. Кафе и туалета у здания нет; и то и другое найдётся в центре, примерно
    в 4 км, — там же собор Баграти, Зелёный базар и старый Еврейский квартал.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Мцхеты, Гори и Хашури, через Рикотский перевал
    и дальше мимо Зестафони; заправок по всему пути много. Сверните с трассы на Кутаиси и пересеките город
    до западной окраины, где здание стоит на берегу Риони, на улице Ираклия Абашидзе. Рассчитывайте примерно
    на 224 км и три часа без остановок. Асфальт от двери до двери, так что автомобиля эконом-класса вполне
    достаточно; медленные участки — лишь подъём на Рикоти и городские пробки Кутаиси. Припарковаться на
    соседних улицах обычно несложно.
fa:
  name: ساختمان پیشین پارلمان گرجستان، کوتایسی
  short: >-
    گنبدی از شیشه و فولاد کنار ریونی که در سال ۲۰۱۲ ساخته شد تا پارلمان گرجستان را به کوتایسی بیاورد و
    از زمان بازگشت نمایندگان به تفلیس در ۲۰۱۹ خاموش مانده است.
  body: >-
    **بیش از شش سال، قوانین گرجستان زیر گنبدی شیشه‌ای در لبهٔ غربی کوتایسی وضع می‌شد؛ سپس چراغ‌ها خاموش
    شدند.**


    این ساختمان جسورانه‌ترین نمایش تمرکززدایی میخائیل ساکاشویلی، رئیس‌جمهور وقت، بود: قوهٔ مقننهٔ ملی
    قرار بود تفلیس را ترک کند و به پایتخت کهن ایمرتی برود. طراحی آن را شرکت اسپانیایی CMD Ingenieros به
    سرپرستی معمار آلبرتو دومینگو کابو انجام داد؛ در سال‌های ۲۰۱۱ تا ۲۰۱۲ ساخته شد و در ۲۶ مه ۲۰۱۲، روز
    استقلال، گشایش یافت. پارلمان از اکتبر همان سال تا ژانویهٔ ۲۰۱۹ در اینجا تشکیل جلسه می‌داد، تا آنکه
    اصلاحیه‌ای در قانون اساسی آن را به تفلیس بازگرداند.


    آغازش بی‌فاجعه نبود. در این محل یادمان دوران شوروی کوتایسی برای سربازان جنگ جهانی دوم قرار داشت، و
    هنگامی که در دسامبر ۲۰۰۹ برای آماده‌سازی زمین منفجرش کردند، انفجار جان یک مادر و دخترش را گرفت. کمتر
    ساختمان مدرنی در گرجستان با چنین بهایی آغاز شده است. تنها یک بخش از یادمان برجا ماند: تندیس سوارکار
    که تا سال ۲۰۲۱ بر پایه‌ای تازه در نزدیکی ساختمان نصب شده بود؛ هنگام گشت زدن گرد بنا سراغش را بگیرید.


    آنچه امروز می‌بینید پوستهٔ آن است: گنبدی بیضی از شیشه و فولاد به درازای حدود ۱۵۰ متر که نواری سفید
    از بتن آن را در بر گرفته و همچون عدسی واژگون بر کرانهٔ ریونی آرمیده است. بامدادان شیشه رنگ آسمان را
    به خود می‌گیرد؛ در واپسین ساعات بعدازظهر، نوار بتنی در برابر شیب‌های سبز بالای رود گرم می‌شود.


    از سال ۲۰۱۹ تالارها خالی مانده‌اند. در سال ۲۰۲۲ دولت اعلام کرد که این ساختمان به مرکزی فناوری بدل
    می‌شود و بعدها گزارش‌هایی از یک مرکز TUMO سخن گفتند؛ اینکه درهایش باز شده یا نه، در شهر بپرسید. فعلاً
    این بنا یادمان یک ایده است، اینکه قدرت می‌تواند به غرب کوچ کند، و یادمانی به‌طرز غریبی صادق: باشکوه،
    پرهزینه و خاموش.
  tip: >-
    از زمانی که پارلمان رفت، درون ساختمان به روی عموم باز نبوده است، پس آن را توقفی نیم‌ساعته از بیرون
    بدانید: کنار رود و در مسیر ورودی از خیابان ایراکلی آباشیدزه قدم بزنید و انتظار راهنما یا باجهٔ بلیت
    نداشته باشید. تماشا رایگان است. گنبد در نور مایل صبح یا اواخر بعدازظهر در بهترین حالت است، وقتی شیشه
    به‌جای خیره‌کردن چشم، آسمان را بازمی‌تاباند. کنار ساختمان کافه یا سرویس بهداشتی نیست؛ هر دو را در
    مرکز شهر، حدود ۴ کیلومتر دورتر، می‌یابید؛ همان‌جا که کلیسای جامع بگراتی، بازار سبز و محلهٔ قدیمی یهودیان
    قرار دارند.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب و از کنار متسختا، گوری و خاشوری بروید، از گردنهٔ ریکوتی بگذرید
    و از کنار زستافونی ادامه دهید؛ در سراسر مسیر پمپ‌بنزین فراوان است. در خروجی کوتایسی از بزرگراه خارج
    شوید و از شهر بگذرید تا به سوی غربی آن برسید، جایی که ساختمان در خیابان ایراکلی آباشیدزه کنار ریونی
    ایستاده است. حدود ۲۲۴ کیلومتر و سه ساعت راه بی‌توقف در پیش دارید. از در تا در آسفالت است، پس خودروی
    اقتصادی همهٔ آن چیزی است که لازم دارید؛ تنها بخش‌های کُند، سربالایی ریکوتی و ترافیک خود کوتایسی است.
    پارک کردن در خیابان‌های اطراف معمولاً آسان است.
he:
  name: בניין הפרלמנט הגאורגי לשעבר, קותאיסי
  short: >-
    כיפה של זכוכית ופלדה על גדת הריוני, שנבנתה ב-2012 כדי להביא את הפרלמנט של גאורגיה לקותאיסי ושותקת
    מאז שחברי הפרלמנט חזרו לטביליסי ב-2019.
  body: >-
    **במשך יותר משש שנים נחקקו חוקי גאורגיה תחת כיפת זכוכית בקצה המערבי של קותאיסי; ואז כבו האורות.**


    הבניין היה המחווה הנועזת ביותר של הנשיא מיכאיל סאאקשווילי למען ביזור השלטון: בית המחוקקים הלאומי יעזוב
    את טביליסי לטובת הבירה העתיקה של אימרתי. הוא תוכנן בידי החברה הספרדית CMD Ingenieros בהובלת האדריכל
    אלברטו דומינגו קאבו, נבנה בשנים 2011–2012 ונחנך ב-26 במאי 2012, יום העצמאות. הפרלמנט ישב כאן מאוקטובר
    אותה שנה ועד ינואר 2019, כשתיקון חוקתי החזיר אותו לטביליסי.


    ראשיתו לא הייתה תמימה. במקום עמדה האנדרטה הסובייטית של קותאיסי לזכר חיילי מלחמת העולם השנייה, וכשפוצצה
    בדצמבר 2009 כדי לפנות את השטח, הרג הפיצוץ אם ובתה. מעט בניינים מודרניים בגאורגיה החלו את דרכם במחיר
    כזה. חלק אחד מהאנדרטה בכל זאת שרד: פסל הפרש, שעד 2021 הוצב על בסיס חדש סמוך לבניין — חפשו אותו כשתקיפו
    את המבנה.


    מה שרואים היום הוא הקליפה: כיפה סגלגלה של זכוכית ופלדה, באורך של כ-150 מטר, עטופה בסרט לבן של בטון,
    השרועה על גדת הריוני כמו עדשה הפוכה. בבוקר הזכוכית מקבלת את צבע השמיים; בשעות אחר הצהריים המאוחרות
    רצועת הבטון מתחממת על רקע המדרונות הירוקים שמעל הנהר.


    מאז 2019 האולמות עומדים ריקים. ב-2022 הודיעה הממשלה על מרכז טכנולוגי בבניין, ובהמשך דווח על מרכז TUMO;
    אם דלתותיו כבר נפתחו — שאלו בעיר. בינתיים זו אנדרטה לרעיון, שהשלטון יכול לנדוד מערבה, ואנדרטה כנה
    במיוחד: מפוארת, יקרה ושותקת.
  tip: >-
    פנים הבניין לא נפתח לציבור מאז שהפרלמנט עזב, לכן ראו בזה עצירה של חצי שעה מבחוץ: טיילו לאורך הנהר
    ובדרך הגישה מרחוב אירקלי אבשידזה, ואל תצפו למדריכים או לקופה. ההתבוננות חינם. הכיפה במיטבה באור נמוך
    של בוקר או של שעות אחר הצהריים המאוחרות, כשהזכוכית משקפת את השמיים במקום לסנוור. ליד הבניין אין בית
    קפה או שירותים; את שניהם תמצאו במרכז העיר, כ-4 ק"מ משם, שם נמצאים גם קתדרלת בגרטי, השוק הירוק והרובע
    היהודי הישן.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני מצחתה, גורי וחשורי, דרך מעבר ריקוטי והלאה על פני זסטפוני;
    תחנות דלק יש בשפע לכל אורך הדרך. צאו מהכביש המהיר ביציאה לקותאיסי וחצו את העיר אל צדה המערבי, שם עומד
    הבניין על גדת הריוני, ברחוב אירקלי אבשידזה. חשבו על כ-224 ק"מ ושלוש שעות בלי עצירות. אספלט מדלת לדלת,
    כך שרכב אקונומי הוא כל מה שצריך; הקטעים האיטיים היחידים הם העלייה לריקוטי והתנועה בקותאיסי עצמה. חניה
    ברחובות הסמוכים בדרך כלל קלה.
ar:
  name: مبنى البرلمان الجورجي السابق، كوتايسي
  short: >-
    قبة من الزجاج والفولاذ على ضفة ريوني، شُيّدت عام 2012 لنقل البرلمان الجورجي إلى كوتايسي، وصامتة منذ
    عاد النواب إلى تبليسي عام 2019.
  body: >-
    **لأكثر من ست سنوات، كانت قوانين جورجيا تُسنّ تحت قبة زجاجية على الطرف الغربي لكوتايسي؛ ثم انطفأت
    الأضواء.**


    كان المبنى أجرأ خطوات الرئيس ميخائيل ساكاشفيلي نحو اللامركزية: إذ تقرّر أن تغادر السلطة التشريعية
    الوطنية تبليسي إلى عاصمة إيميريتي القديمة. صمّمته الشركة الإسبانية CMD Ingenieros بقيادة المهندس المعماري
    ألبرتو دومينغو كابو، وبُني في 2011–2012، وافتُتح في 26 مايو 2012، يوم الاستقلال. وانعقد البرلمان هنا
    من أكتوبر من العام نفسه حتى يناير 2019، حين أعاده تعديل دستوري إلى تبليسي.


    لم تكن بدايته بريئة. فقد كان في الموقع النصب التذكاري السوفيتي لجنود الحرب العالمية الثانية في كوتايسي،
    وحين نُسف في ديسمبر 2009 لتمهيد الأرض، قتل الانفجار أمًّا وابنتها. قليلة هي المباني الحديثة في جورجيا
    التي بدأت بثمن كهذا. غير أن جزءًا واحدًا من النصب نجا: تمثال الفارس، الذي نُصب بحلول عام 2021 على
    قاعدة جديدة قرب المبنى؛ فابحث عنه وأنت تدور حول القبة.


    ما تراه اليوم هو الهيكل: قبة بيضاوية من الزجاج والفولاذ يبلغ طولها نحو 150 مترًا، يطوّقها شريط أبيض
    من الخرسانة، ممدّدة على ضفة ريوني كعدسة مقلوبة. في الصباح يأخذ الزجاج لون السماء؛ وفي آخر العصر يدفأ
    الشريط الخرساني على خلفية المنحدرات الخضراء فوق النهر.


    منذ 2019 والقاعات خاوية. في 2022 أعلنت الحكومة عن مركز تكنولوجي في المبنى، وتحدثت تقارير لاحقة عن
    مركز TUMO؛ أما إن كانت أبوابه قد فُتحت بعد، فاسأل في المدينة. إنه الآن نصب تذكاري لفكرة، أن السلطة
    يمكن أن تنتقل غربًا، ونصب صريح على نحو نادر: فخم، مكلف، وصامت.
  tip: >-
    لم يُفتح الداخل للجمهور منذ رحيل البرلمان، فاعتبرها وقفة نصف ساعة من الخارج: تمشَّ على امتداد النهر
    وعند المدخل من شارع إيراكلي أباشيدزه، ولا تتوقع مرشدين أو شباك تذاكر. المشاهدة مجانية. تبدو القبة
    في أبهى حالاتها في ضوء الصباح المائل أو في آخر العصر، حين يعكس الزجاج السماء بدلًا من أن يبهر العين.
    لا مقهى ولا دورة مياه عند المبنى؛ ستجد كليهما في وسط المدينة على بعد نحو 4 كم، حيث كاتدرائية باغراتي
    والسوق الأخضر والحي اليهودي القديم.
  route: >-
    من تبليسي اتبع الطريق S1 (E60) غربًا مرورًا بمتسخيتا وغوري وخاشوري، عبر ممر ريكوتي ثم متجاوزًا زيستافوني؛
    ومحطات الوقود كثيرة على طول الطريق. اخرج من الطريق السريع عند مخرج كوتايسي واعبر المدينة إلى جانبها
    الغربي، حيث يقف المبنى على ضفة ريوني في شارع إيراكلي أباشيدزه. احسب نحو 224 كم وثلاث ساعات دون توقف.
    الطريق معبّد من الباب إلى الباب، فالسيارة الاقتصادية كل ما تحتاجه؛ والمقطعان البطيئان الوحيدان هما
    صعود ريكوتي وزحام كوتايسي نفسها. وعادة ما يكون ركن السيارة في الشوارع المحيطة سهلًا.
