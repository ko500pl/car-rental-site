ka:
  name: გუდაური
  short: >-
    საქართველოს ყველაზე ცნობილი სათხილამურო კურორტი ჯვრის უღელტეხილის ქვემოთ: საბაგიროები 3279 მეტრამდე,
    ექვსთვიანი თოვლი და ზაფხულის პარაპლანები.
  body: >-
    **გუდაური ჯალამბარით დაიწყო: სანამ ნამდვილი საბაგიროები გაჩნდებოდა, პირველ მოთხილამურეებს ფერდობზე
    ავტომობილის ჯალამბარი ეზიდებოდა.**


    სოფელი, ზღვის დონიდან 2196 მეტრზე, პირველად 1868 წელს იხსენიება. იგი საქართველოს სამხედრო გზაზე, ჯვრის
    უღელტეხილის (2379 მ) ქვემოთ გაიზარდა, 1887 წელს კი აქ მეტეოროლოგიური სადგური გაიხსნა. სოფლის ქვემოთ
    1855–1861 წლებში ინჟინერმა ბ. სტატკოვსკიმ მლეთის დაღმართი გაიყვანა — ის სერპანტინი, რომელსაც დღესაც
    ადიხართ. ნამდვილი კურორტი 1988 წლიდან იწყება, როცა პირველი კეთილმოწყობილი სასტუმრო — „მარკო პოლო“,
    ახლანდელი „გუდაური“ — გაიხსნა, ავსტრიულმა კომპანია „დოპელმაიერმა“ კი საბაგიროები ააშენა.


    დღეს საბაგიროები 1990 მეტრიდან საძელის 3279 მეტრამდე ადის და 70 კილომეტრზე მეტ ტრასას ემსახურება სამხრეთისკენ
    მიქცეულ ფერდობებზე, ტყის ზოლს ზემოთ — აქ ხეებს შორის ლავირება არ მოგიწევთ, მხოლოდ ღია თეთრი სივრცეა.
    თოვლი წელიწადში დაახლოებით ექვს თვეს დევს, ტრასებზე საშუალოდ 190 სანტიმეტრის სისქით. 2018 წლიდან გონდოლა
    კურორტს უღელტეხილის იქით მდებარე კობთან აკავშირებს, ვერტმფრენი კი ფრირაიდერებს 1500-დან 4200 მეტრამდე
    ფერდობებზე აჰყავს. ზაფხულში იმავე ფერდობებს პარაპლანერები და სპიდრაიდერები ეპატრონებიან.


    გზით რამდენიმე კილომეტრში, ზემოთ, რუსეთ-საქართველოს მეგობრობის მონუმენტი დგას, 1983 წელს გეორგიევსკის
    1783 წლის ტრაქტატის 200 წლისთავზე აგებული: ბეტონის რკალი უზარმაზარი მოზაიკით, ღრმა ხეობის თავზე გადაკიდებული.
    მას ცალკე გვერდი აქვს. მისი პოლიტიკური დატვირთვა დიდი ხანია გაცვდა, ხედი კი — არა.


    თებერვლის მოწმენდილ დილას საძელის თავზე დადექით და კავკასიონის თეთრი ქედები ყოველი მხრიდან ტალღებად
    გადაგეშლებათ.
  tip: >-
    ამინდი დღეში რამდენჯერმე იცვლება: სოფელში მზეა, ზედა საბაგიროებთან კი წუთებში ყველაფერი თეთრ ბურუსში
    იძირება. ტრასის გარეთ სრიალი და ჰელისკი მხოლოდ გიდთან ერთად. საბაგიროები ზამთარში ჩვეულებრივ 10:00-დან
    16:00-მდე მუშაობს, ზაფხულში — უფრო დიდხანს; სკი-პასის ფასი ყოველ სეზონს იცვლება, ამიტომ წინასწარ გადაამოწმეთ.
    სკი-პასსა და ქირავნობის აღჭურვილობას კურორტზე შეიძენთ, ახალი წლის დღეებში კი გრძელ რიგებს ელოდეთ.
    მონუმენტთან კლდე ციცაბოა, მოაჯირი კი დაბალი — ბავშვებს ხელი მაგრად მოკიდეთ. ივლისშიც თბილი ტანსაცმელი
    წაიღეთ. საწვავი, ბანკომატები და კაფეები გუდაურშია.
  route: >-
    ს1-ით მცხეთისკენ გადით, შემდეგ საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთით, ჟინვალის, ანანურისა
    და ფასანაურის გავლით იარეთ — 120 კმ და კარგ ამინდში დაახლოებით ორი საათი და ათი წუთი. გზა ბოლომდე
    მოასფალტებულია, მაგრამ ქვეშეთის შემდეგ მლეთის სერპანტინზე ადის, რომელსაც რუსეთის საზღვრისკენ მიმავალ
    და იქიდან მომავალ მძიმე ტვირთმზიდებთან ერთად იყოფთ. ძლიერი თოვლის დროს გზა შეიძლება ჩაიკეტოს — გამგზავრებამდე
    მისი მდგომარეობა გადაამოწმეთ. ნოემბრიდან აპრილამდე ზამთრის საბურავები აუცილებელია, ჯაჭვებიც თან იქონიეთ;
    მაღალი კლირენსის კროსოვერი ან ჯიპი დაბალ სედანზე გაცილებით კომფორტულია. საწვავი ფასანაურში ან გუდაურში
    ჩაასხით.
en:
  name: Gudauri
  short: >-
    Georgia's best-known ski resort, on treeless slopes below the Jvari Pass: lifts to 3,279 metres, six
    months of snow and summer paragliders.
  body: >-
    **Gudauri began with a winch: before there were proper lifts, the first skiers here were hauled up
    the slope by a car's winch.**


    The village, at 2,196 metres, is first recorded in 1868. It grew up on the Georgian Military Highway
    just below the Jvari Pass (2,379 m), and a weather station opened here in 1887. Below it, between
    1855 and 1861, the engineer B. Statkovsky laid out the Mleti descent, the ladder of hairpins you still
    climb today. The resort proper dates from 1988, when the first real hotel, the Marco Polo (now the
    Gudauri), opened and the Austrian firm Doppelmayr built the lifts.


    Today the lifts run from 1,990 metres up to 3,279 metres on Sadzele and serve more than 70 km of runs
    on south-facing slopes above the tree line, so there is no forest to thread, only open white ground.
    Snow lies for about six months of the year, on average 190 cm deep on the pistes. Since 2018 a gondola
    has linked the resort with Kobi on the far side of the pass, and helicopters lift freeriders to runs
    anywhere between 1,500 and 4,200 metres. In summer paragliders and speed-riders take over the same
    slopes.


    A few kilometres up the highway stands the Russia–Georgia Friendship Monument, built in 1983 for the
    bicentenary of the 1783 Treaty of Georgievsk: a concrete arc lined with a vast mosaic, hanging over
    a deep gorge. It has its own page. Its politics have worn thin; the view has not.


    Stand on top of Sadzele on a clear February morning and the white ridges of the Greater Caucasus roll
    away on every side.
  tip: >-
    The weather turns several times a day: sun in the village, whiteout on the top lifts within minutes.
    Off-piste and heli-skiing only with a guide. Lifts usually run 10:00–16:00 in winter and longer in
    summer; pass prices change every season, so check before you go. Passes and rental gear are sold at
    the resort, with long queues over the New Year holidays. At the monument the drop is sheer and the
    railing modest, so keep hold of children. Bring warm layers even in July. Fuel, ATMs and cafés are
    in Gudauri.
  route: >-
    Take the S1 towards Mtskheta, then the Georgian Military Highway (S3/E117) north through Zhinvali,
    Ananuri and Pasanauri: 120 km and about two hours ten minutes in good conditions. The road is asphalt
    throughout, but beyond Kvesheti it climbs the Mleti hairpins, shared with heavy freight to and from
    the Russian border. In heavy snow the highway can close, so check its status before setting out. From
    November to April winter tyres are essential and chains worth carrying; a crossover or SUV with good
    ground clearance is far more comfortable than a low saloon. Fill up in Pasanauri or in Gudauri.
ru:
  name: Гудаури
  short: >-
    Самый известный горнолыжный курорт Грузии на безлесных склонах под Крестовым перевалом: подъёмники
    до 3279 метров, полгода снега и парапланы летом.
  body: >-
    **Гудаури начался с лебёдки: пока не было настоящих подъёмников, первых лыжников затаскивали вверх
    по склону автомобильной лебёдкой.**


    Село на высоте 2196 метров впервые упоминается в 1868 году. Оно выросло на Военно-Грузинской дороге
    чуть ниже Крестового перевала (Джвари, 2379 м), а в 1887 году здесь открылась метеостанция. Ниже,
    в 1855–1861 годах, инженер Б. Статковский проложил Млетский спуск — ту самую лестницу серпантинов,
    по которой поднимаются и сегодня. Собственно курорт ведёт отсчёт с 1988 года, когда открылась первая
    настоящая гостиница, «Марко Поло» (ныне «Гудаури»), а австрийская фирма «Доппельмайр» построила подъёмники.


    Сегодня подъёмники идут от 1990 до 3279 метров на Садзеле и обслуживают больше 70 км трасс на южных
    склонах выше границы леса, так что никаких деревьев, между которыми надо лавировать, — только открытое
    белое пространство. Снег лежит около полугода, в среднем 190 см на трассах. С 2018 года гондола связывает
    курорт с Коби по ту сторону перевала, а вертолёты забрасывают фрирайдеров на спуски где угодно между
    1500 и 4200 метрами. Летом те же склоны занимают парапланеристы и спидрайдеры.


    В нескольких километрах выше по трассе стоит монумент Дружбы России и Грузии, построенный в 1983 году
    к двухсотлетию Георгиевского трактата 1783 года: бетонная арка с огромной мозаикой, нависшая над глубоким
    ущельем. Ему посвящена отдельная страница. Политический смысл его поистёрся; вид — нисколько.


    Встаньте на вершине Садзеле ясным февральским утром — и белые хребты Большого Кавказа покатятся во
    все стороны.
  tip: >-
    Погода меняется по нескольку раз в день: в селе солнце, а на верхних подъёмниках через несколько минут
    — сплошная белая мгла. Внетрассовое катание и хели-ски — только с гидом. Зимой подъёмники обычно работают
    с 10:00 до 16:00, летом дольше; цены на ски-пассы меняются каждый сезон, так что уточняйте заранее.
    Ски-пассы и прокат снаряжения — на самом курорте, в новогодние праздники с длинными очередями. У монумента
    обрыв отвесный, а ограждение скромное, так что крепко держите детей. Тёплые вещи берите даже в июле.
    Заправка, банкоматы и кафе есть в Гудаури.
  route: >-
    Поезжайте по S1 в сторону Мцхеты, затем по Военно-Грузинской дороге (S3/E117) на север через Жинвали,
    Ананури и Пасанаури: 120 км и около двух часов десяти минут в хороших условиях. Асфальт на всём пути,
    но за Квешети дорога поднимается по серпантинам Млетского спуска, деля их с тяжёлыми фурами, идущими
    к российской границе и обратно. В сильный снегопад трассу могут закрыть, поэтому проверяйте её состояние
    перед выездом. С ноября по апрель зимняя резина обязательна, а цепи стоит возить с собой; кроссовер
    или внедорожник с хорошим клиренсом гораздо удобнее низкого седана. Заправляйтесь в Пасанаури или
    в Гудаури.
fa:
  name: گودائوری
  short: >-
    نامدارترین پیست اسکی گرجستان بر دامنه‌های بی‌درخت زیر گردنهٔ جواری: تله‌اسکی تا ۳۲۷۹ متر، شش ماه برف
    و پاراگلایدرهای تابستانی.
  body: >-
    **گودائوری با یک وینچ آغاز شد: پیش از آنکه تله‌اسکیِ درست و حسابی در کار باشد، نخستین اسکی‌بازان را
    با وینچ یک خودرو از شیب بالا می‌کشیدند.**


    نخستین بار در ۱۸۶۸ از این روستا، در ارتفاع ۲۱۹۶ متری، یاد شده است. روستا بر جادهٔ نظامی گرجستان، اندکی
    پایین‌تر از گردنهٔ جواری (۲۳۷۹ متر)، شکل گرفت و در ۱۸۸۷ ایستگاه هواشناسی‌ای در آن گشوده شد. پایین‌تر،
    میان ۱۸۵۵ و ۱۸۶۱، مهندسی به نام ب. استاتکوفسکی سرازیری ملتی را طراحی کرد، همان نردبان پیچ‌های تندی
    که امروز هم از آن بالا می‌روید. خود تفرجگاه اسکی به ۱۹۸۸ بازمی‌گردد، هنگامی که نخستین هتل واقعی، «مارکو
    پولو» (امروز «گودائوری»)، گشایش یافت و شرکت اتریشی دوپلمایر تله‌اسکی‌ها را ساخت.


    امروز تله‌اسکی‌ها از ۱۹۹۰ متر تا ۳۲۷۹ متر بر قلهٔ سادزله می‌روند و بیش از ۷۰ کیلومتر پیست را بر دامنه‌های
    جنوبیِ بالای مرز درختان پوشش می‌دهند؛ پس جنگلی نیست که از میانش راه بجویید، فقط زمینی باز و سپید.
    برف حدود شش ماه از سال می‌ماند و ژرفای میانگینش بر پیست‌ها ۱۹۰ سانتی‌متر است. از ۲۰۱۸ یک تله‌کابین
    تفرجگاه را به کوبی در آن سوی گردنه می‌پیوندد، و بالگردها اسکی‌بازان آزاد را به مسیرهایی در هر ارتفاعی
    میان ۱۵۰۰ تا ۴۲۰۰ متر می‌برند. در تابستان پاراگلایدرها و اسپیدرایدرها همین دامنه‌ها را در دست می‌گیرند.


    چند کیلومتر بالاتر در امتداد جاده، بنای یادبود دوستی روسیه و گرجستان ایستاده است که در ۱۹۸۳ به مناسبت
    دویستمین سالگرد پیمان گئورگیفسک (۱۷۸۳) ساخته شد: کمانی بتنی با موزاییکی عظیم که بر فراز دره‌ای ژرف
    آویخته است. صفحهٔ جداگانه‌ای دارد. پیام سیاسی‌اش رنگ باخته است؛ منظره‌اش نه.


    در صبحی صاف از فوریه بر فراز سادزله بایستید تا یال‌های سپید قفقاز بزرگ را ببینید که از هر سو موج‌وار
    دور می‌شوند.
  tip: >-
    هوا چند بار در روز عوض می‌شود: آفتاب در روستا، و چند دقیقه بعد سفیدیِ مطلق بر تله‌اسکی‌های بالا. اسکی
    خارج از پیست و هلی‌اسکی فقط با راهنما. تله‌اسکی‌ها در زمستان معمولاً از ۱۰:۰۰ تا ۱۶:۰۰ کار می‌کنند
    و در تابستان بیشتر؛ بهای کارت‌ها هر فصل عوض می‌شود، پس پیش از رفتن بپرسید. کارت تله‌اسکی و وسایل کرایه‌ای
    در خود تفرجگاه فروخته می‌شود و در تعطیلات سال نو صف‌ها طولانی است. کنار بنای یادبود، پرتگاه عمودی
    است و نرده کوتاه، پس دست کودکان را محکم بگیرید. حتی در ژوئیه لباس گرم بیاورید. سوخت، خودپرداز و کافه
    در گودائوری هست.
  route: >-
    از S1 به سوی متسختا بروید، سپس از جادهٔ نظامی گرجستان (S3/E117) به شمال، از ژینوالی، آنانوری و پاسانائوری
    بگذرید: ۱۲۰ کیلومتر و در شرایط خوب حدود دو ساعت و ده دقیقه. تمام راه آسفالت است، اما پس از کوِشِتی
    جاده از پیچ‌های سرازیری ملتی بالا می‌رود و آن را با کامیون‌های سنگینی که به مرز روسیه می‌روند و از
    آن بازمی‌گردند شریک است. در برف سنگین ممکن است جاده بسته شود، پس پیش از حرکت وضعیتش را بپرسید. از
    نوامبر تا آوریل لاستیک زمستانی ضروری است و بردن زنجیر ارزشش را دارد؛ کراس‌اوور یا شاسی‌بلندی با فاصلهٔ
    کف خوب بسیار راحت‌تر از سدانی کوتاه است. در پاسانائوری یا گودائوری باک را پر کنید.
he:
  name: גודאורי
  short: >-
    אתר הסקי המוכר ביותר בגאורגיה, על מדרונות חשופים מעצים מתחת למעבר ג׳ווארי: רכבלים עד 3,279 מטר, חצי
    שנה של שלג ומצנחי רחיפה בקיץ.
  body: >-
    **גודאורי התחילה בכננת: לפני שהיו כאן מעליות סקי של ממש, משכו את הגולשים הראשונים במעלה המדרון בכננת
    של מכונית.**


    הכפר, בגובה 2,196 מטר, נזכר לראשונה ב-1868. הוא צמח על הדרך הצבאית הגאורגית ממש מתחת למעבר ג׳ווארי
    (2,379 מטר), וב-1887 נפתחה בו תחנה מטאורולוגית. מתחתיו, בין 1855 ל-1861, התווה המהנדס ב. סטטקובסקי
    את מורד מלטי, סולם הסרפנטינות שבו מטפסים גם היום. אתר הנופש עצמו נולד ב-1988, כשנפתח המלון האמיתי
    הראשון, ״מרקו פולו״ (היום ״גודאורי״), והחברה האוסטרית דופלמאייר בנתה את המעליות.


    היום עולות המעליות מ-1,990 מטר עד 3,279 מטר על הר סאדזלה, ומשרתות יותר מ-70 ק״מ של מסלולים על מדרונות
    דרומיים מעל קו העצים, כך שאין יער להשתחל בו, רק שטח לבן ופתוח. השלג נשאר כחצי שנה, ועומקו הממוצע על
    המסלולים 190 ס״מ. מאז 2018 מחבר רכבל גונדולה את אתר הנופש עם קובי שבצדו השני של המעבר, ומסוקים מעלים
    גולשי פרירייד למסלולים בכל גובה בין 1,500 ל-4,200 מטר. בקיץ משתלטים על אותם מדרונות מצנחי רחיפה וגולשי
    ספיד-רייד.


    כמה קילומטרים במעלה הכביש עומדת אנדרטת הידידות רוסיה–גאורגיה, שנבנתה ב-1983 לציון מאתיים שנה לאמנת
    גאורגייבסק מ-1783: קשת בטון מצופה בפסיפס עצום, התלויה מעל ערוץ עמוק. יש לה עמוד משלה. המסר הפוליטי
    שלה נשחק; הנוף לא.


    עמדו על פסגת סאדזלה בבוקר בהיר של פברואר, ורכסיו הלבנים של הקווקז הגדול יתגלגלו הרחק לכל עבר.
  tip: >-
    מזג האוויר מתהפך כמה פעמים ביום: שמש בכפר, ותוך דקות לובן מוחלט במעליות העליונות. סקי מחוץ למסלולים
    וסקי ממסוק רק עם מדריך. בחורף המעליות פועלות בדרך כלל 10:00–16:00, ובקיץ זמן רב יותר; מחירי הכרטיסים
    משתנים בכל עונה, לכן בדקו לפני שאתם יוצאים. כרטיסים וציוד להשכרה נמכרים באתר עצמו, ובחופשת ראש השנה
    האזרחית התורים ארוכים. ליד האנדרטה המצוק אנכי והמעקה צנוע, לכן החזיקו היטב את הילדים. הביאו שכבות
    חמות גם ביולי. דלק, כספומטים ובתי קפה יש בגודאורי.
  route: >-
    סעו בכביש S1 לכיוון מצחתה, ואז צפונה בדרך הצבאית הגאורגית (S3/E117) דרך ז׳ינוואלי, אנאנורי ופסנאורי:
    120 ק״מ, כשעתיים ועשר דקות בתנאים טובים. הכביש סלול לכל אורכו, אך אחרי קווישתי הוא מטפס בסרפנטינות
    של מורד מלטי, שאותן הוא חולק עם משאיות כבדות בדרכן אל גבול רוסיה וממנו. בשלג כבד הכביש עלול להיסגר,
    לכן בדקו את מצבו לפני היציאה. מנובמבר עד אפריל צמיגי חורף הם חובה, וכדאי לקחת שרשראות; קרוסאובר או
    רכב שטח עם מרווח גחון טוב נוחים בהרבה ממכונית סדאן נמוכה. תדלקו בפסנאורי או בגודאורי.
ar:
  name: غوداوري
  short: >-
    أشهر منتجعات التزلج في جورجيا، على منحدرات جرداء من الشجر تحت ممر جواري: مصاعد حتى 3279 متراً، وستة
    أشهر من الثلج، ومظليون في الصيف.
  body: >-
    **بدأت غوداوري بونش: قبل أن تكون هنا مصاعد حقيقية، كان المتزلجون الأوائل يُسحبون إلى أعلى المنحدر
    بونش سيارة.**


    ورد ذكر القرية، القائمة على ارتفاع 2196 متراً، لأول مرة عام 1868. وقد نشأت على الطريق العسكري الجورجي
    أسفل ممر جواري (2379 م) مباشرة، وافتُتحت فيها محطة للأرصاد الجوية عام 1887. وتحتها، بين عامي 1855
    و1861، خطّ المهندس ب. ستاتكوفسكي منحدر مليتي، ذلك السلّم من المنعطفات الملتوية الذي لا تزال تصعده
    اليوم. أما المنتجع بمعناه الحقيقي فيعود إلى عام 1988، حين افتُتح أول فندق حقيقي، «ماركو بولو» (اليوم
    «غوداوري»)، وبنت الشركة النمساوية دوبلماير المصاعد.


    واليوم تمتد المصاعد من 1990 متراً حتى 3279 متراً على جبل سادزيلي، وتخدم أكثر من 70 كم من المسارات
    على منحدرات جنوبية فوق خط الأشجار، فلا غابة تضطر إلى التعرّج بين أشجارها، بل أرض بيضاء مكشوفة فحسب.
    يبقى الثلج نحو ستة أشهر في السنة، بعمق متوسطه 190 سم على المسارات. ومنذ عام 2018 يربط تلفريكٌ المنتجعَ
    بكوبي على الجانب الآخر من الممر، وتنقل المروحيات متزلجي الفري رايد إلى مسارات على أي ارتفاع بين 1500
    و4200 متر. وفي الصيف يستولي على المنحدرات نفسها المظليون وراكبو السبيد رايدينغ.


    وعلى بعد بضعة كيلومترات أعلى الطريق يقوم نصب الصداقة الروسي الجورجي، الذي شُيّد عام 1983 في الذكرى
    المئوية الثانية لمعاهدة غيورغييفسك عام 1783: قوس خرساني تكسوه فسيفساء هائلة، معلّق فوق وادٍ سحيق.
    وله صفحته الخاصة. لقد بهت مغزاه السياسي؛ أما المنظر فلم يبهت.


    قف على قمة سادزيلي في صباح صافٍ من فبراير، وسترى سلاسل القوقاز الكبير البيضاء تتدحرج بعيداً من كل
    جانب.
  tip: >-
    يتقلّب الطقس مرات عدة في اليوم: شمس في القرية، وبياض تام يحجب الرؤية على المصاعد العليا في غضون دقائق.
    التزلج خارج المسارات والتزلج بالمروحية مع دليل فقط. تعمل المصاعد عادة من 10:00 إلى 16:00 في الشتاء،
    ولساعات أطول في الصيف؛ وتتغير أسعار البطاقات كل موسم، فتحقّق منها قبل الذهاب. تُباع البطاقات ومعدات
    الاستئجار في المنتجع نفسه، مع طوابير طويلة في عطلة رأس السنة. وعند النصب الهاوية عمودية والدرابزين
    متواضع، فأمسك الأطفال جيداً. احمل ملابس دافئة حتى في يوليو. الوقود وأجهزة الصرف الآلي والمقاهي متوفرة
    في غوداوري.
  route: >-
    اسلك الطريق S1 باتجاه متسخيتا، ثم الطريق العسكري الجورجي (S3/E117) شمالاً عبر جينفالي وأنانوري وباسانائوري:
    120 كم ونحو ساعتين وعشر دقائق في الأحوال الجيدة. الطريق معبّد بالكامل، لكنه بعد كفيشيتي يصعد منعطفات
    منحدر مليتي، ويتقاسمها مع شاحنات النقل الثقيل الذاهبة إلى الحدود الروسية والعائدة منها. وقد يُغلق
    الطريق في الثلوج الكثيفة، فتحقّق من حاله قبل الانطلاق. ومن نوفمبر إلى أبريل لا غنى عن الإطارات الشتوية،
    ويحسن حمل السلاسل؛ وسيارة كروس أوفر أو دفع رباعي بخلوص أرضي جيد أريح بكثير من سيارة سيدان منخفضة.
    املأ الخزان في باسانائوري أو في غوداوري.
