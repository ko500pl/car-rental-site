ka:
  name: გუდაური და რუსეთ-საქართველოს მეგობრობის მონუმენტი
  short: საქართველოს მთავარი სათხილამურო კურორტი ჯვრის უღელტეხილთან, მოზაიკური მონუმენტითა და უზარმაზარი
    პანორამით.
  body: >-
    **გუდაური საქართველოს ყველაზე დიდი და ყველაზე მაღალმთიანი სათხილამურო კურორტია.** ის 2000–3300 მეტრზეა
    განლაგებული, ჯვრის უღელტეხილის სამხრეთ კალთაზე, და ტრასების საერთო სიგრძე 70 კილომეტრს აღემატება.
    სეზონი ჩვეულებრივ დეკემბრიდან აპრილამდე გრძელდება, ხოლო თოვლის ხარისხი — მშრალი, ფხვიერი — კავკასიის
    საუკეთესოა.


    გუდაური განსაკუთრებით ცნობილია ტრასის გარეთ სრიალით: აქ ჰელი-სკი და ფრირაიდი მრავალი წელია განვითარებულია
    და კურორტს სწორედ ეს განასხვავებს ბაკურიანისგან, რომელიც უფრო საოჯახოა. ზაფხულში იმავე კალთებზე პარაპლანერიზმი
    და მთის ველოსიპედია.


    გუდაურიდან 6 კმ-ში, უღელტეხილთან ახლოს, დგას **რუსეთ-საქართველოს მეგობრობის მონუმენტი** — 1983 წელს
    აშენებული ბეტონის ნახევარწრიული ტერასა, შიგნიდან სრულად დაფარული ფერადი მოზაიკით, რომელიც ორი ქვეყნის
    ისტორიის სცენებს ასახავს. მისი პოლიტიკური კონტექსტი დღეს დაძაბულია, მაგრამ როგორც სამონტაჟო ობიექტი
    და ხედის წერტილი ის უნიკალურია: ტერასა უფსკრულის თავზეა და ქვემოთ დევდორაკის ხეობა იშლება.


    კურორტზე მოქმედებს:


    - რამდენიმე გონდოლა და საბაგირო, რომლებიც 3000 მეტრზე მაღლა გადის

    - ტრასები ყველა დონისთვის, დამწყებიდან შავამდე, სასწავლო ზონებით ცენტრში

    - სასტუმროებისა და აპარტამენტების დიდი შერჩევა უშუალოდ ფერდობებთან

    - ზაფხულის საბაგირო, საიდანაც უღელტეხილის პანორამა ღიაა თხილამურების გარეშეც


    მონუმენტთან პარაპლანით ტანდემურ ფრენას სთავაზობენ ტურისტებს — ეს გუდაურის ერთ-ერთი ყველაზე პოპულარული
    ზაფხულის აქტივობაა და ჰაერიდან უღელტეხილი სულ სხვანაირად გამოიყურება.
  tip: >-
    ზამთარში ამინდი დღეში რამდენჯერმე იცვლება: ქვემოთ მზეა, ზემოთ ღრუბელი და ხილვადობა ნულამდე ეცემა.
    სკი-პასი და აღჭურვილობის ქირაობა კურორტზევე შესაძლებელია, მაგრამ დღესასწაულებზე რიგებია. მონუმენტთან
    ჩრდილი და მოაჯირი მინიმალურია — უფსკრულის კიდესთან ბავშვს ხელი მაგრად დაუჭირე. ზაფხულშიც წაიღე თბილი
    ტანსაცმელი: 2400 მეტრზე საღამოს 10 გრადუსია. საწვავი, ბანკომატი და კაფეები გუდაურის ცენტრშია.
  route: >-
    საქართველოს სამხედრო გზა (E117): თბილისი — მცხეთა — ჟინვალი — ანანური — ფასანაური — გუდაური, სულ 120
    კმ და დაახლოებით ორი საათი და ათი წუთი. ასფალტი მთელ მონაკვეთზეა, მაგრამ ფასანაურის ზემოთ იწყება ხანგრძლივი
    სერპანტინი დიდი ტვირთის მანქანების ნაკადით. ზამთარში ეს გზა ზვავსაშიშია და პერიოდულად იკეტება — გამგზავრებამდე
    შეამოწმე სტატუსი. ზამთრის საბურავები სავალდებულოა, ჯაჭვები სასურველი; მაღალი კლირენსის კროსოვერი გაცილებით
    კომფორტულია, ვიდრე დაბალი სედანი. საწვავი აიღე პასანაურში.
en:
  name: Gudauri and the Russia–Georgia Friendship Monument
  short: >-
    Georgia's main ski resort below the Jvari Pass, with a mosaic-lined monument and an enormous mountain
    panorama.
  body: >-
    **Gudauri is Georgia's largest and highest ski resort.** It spreads between roughly 2,000 and 3,300
    metres on the southern slope below the Jvari Pass, with more than 70 kilometres of marked pistes.
    The season usually runs from December to April, and the snow — dry and light — is among the best in
    the Caucasus.


    The resort is particularly known for off-piste skiing. Heli-skiing and freeride have been established
    here for years, which is what distinguishes Gudauri from the gentler, more family-oriented Bakuriani.
    In summer the same slopes carry paragliders and mountain bikers instead.


    Six kilometres above the resort, close to the pass, stands the **Russia–Georgia Friendship Monument**:
    a semicircular concrete terrace built in 1983 and lined inside with a huge colour mosaic showing scenes
    from the shared history of the two countries. Its political framing has aged badly, but as an object
    and a viewpoint it is unique — the terrace hangs over a sheer drop into the Devdoraki gorge, and the
    scale of the panorama is hard to convey in photographs.


    Tandem paragliding flights launch from beside the monument, and in summer this is one of the most
    popular things visitors do in Gudauri.
  tip: >-
    Mountain weather changes several times a day here: sunshine below, cloud above, visibility down to
    nothing within minutes. Ski passes and rental gear are available at the resort, but queues are long
    over holidays. At the monument there is minimal shade and almost no railing, so hold on to children
    near the edge. Bring warm layers even in summer — at 2,400 metres evenings sit around ten degrees.
    Fuel, ATMs and cafés are in central Gudauri.
  route: >-
    Take the Georgian Military Highway (E117): Tbilisi, Mtskheta, Zhinvali, Ananuri, Pasanauri, Gudauri
    — 120 km and about two hours ten minutes. The road is asphalt the whole way, but above Pasanauri it
    becomes a long climb of switchbacks shared with heavy freight traffic. In winter this section is avalanche-prone
    and closes periodically, so check its status before setting out. Winter tyres are mandatory in the
    cold season and chains are worth carrying; a crossover with decent ground clearance is far more comfortable
    here than a low sedan. Fill up in Pasanauri.
ru:
  name: Гудаури и монумент Дружбы
  short: Главный горнолыжный курорт Грузии под Крестовым перевалом, мозаичный монумент и огромная панорама
    гор.
  body: >-
    **Гудаури — крупнейший и самый высокогорный курорт Грузии.** Он раскинулся примерно между 2000 и 3300
    метрами на южном склоне под Крестовым перевалом, размеченных трасс здесь более 70 километров. Сезон
    обычно длится с декабря по апрель, а снег — сухой и лёгкий — один из лучших на Кавказе.


    Курорт особенно известен катанием вне трасс. Хели-ски и фрирайд развиты тут давно, и именно это отличает
    Гудаури от более спокойного, семейного Бакуриани. Летом на тех же склонах вместо лыжников появляются
    парапланеристы и горные велосипедисты.


    В шести километрах выше курорта, у самого перевала, стоит **монумент Дружбы народов**: полукруглая
    бетонная терраса 1983 года, изнутри полностью покрытая огромной цветной мозаикой со сценами общей
    истории двух стран. Политическая рамка памятника сегодня выглядит спорно, но как объект и смотровая
    площадка он уникален — терраса нависает над обрывом в Девдоракское ущелье, и масштаб панорамы фотографии
    передают плохо.


    Рядом с монументом стартуют полёты на параплане в тандеме — летом это одно из самых популярных занятий
    в Гудаури.
  tip: >-
    Погода в горах меняется по несколько раз в день: внизу солнце, наверху облако и нулевая видимость.
    Ски-пассы и прокат снаряжения есть на курорте, но в праздники очереди. У монумента почти нет тени
    и практически нет ограждения — детей у края держите за руку. Тёплые вещи нужны и летом: на 2400 метрах
    вечером около десяти градусов. Заправка, банкоматы и кафе — в центре Гудаури.
  route: >-
    Военно-Грузинская дорога (E117): Тбилиси, Мцхета, Жинвали, Ананури, Пасанаури, Гудаури — 120 км и
    около двух часов десяти минут. Асфальт на всём протяжении, но выше Пасанаури начинается длинный серпантин
    с плотным потоком фур. Зимой этот участок лавиноопасен и периодически закрывается, поэтому статус
    дороги стоит проверить до выезда. Зимняя резина в холодный сезон обязательна, цепи желательны; кроссовер
    с нормальным клиренсом здесь заметно комфортнее низкого седана. Заправляйтесь в Пасанаури.
fa:
  name: گودائوری و بنای یادبود دوستی روسیه و گرجستان
  short: اصلی‌ترین پیست اسکی گرجستان زیر گردنهٔ جواری، با بنایی موزاییک‌پوش و پانورامای عظیم کوهستانی.
  body: >-
    **گودائوری بزرگ‌ترین و مرتفع‌ترین پیست اسکی گرجستان است.** میان تقریباً 2,000 تا 3,300 متر روی دامنهٔ
    جنوبی زیر گردنهٔ جواری گسترده شده و بیش از 70 کیلومتر مسیر علامت‌گذاری‌شده دارد. فصل معمولاً از دسامبر
    تا آوریل ادامه دارد و برف — خشک و سبک — از بهترین‌های قفقاز است.


    این پیست به‌ویژه برای اسکی خارج از پیست شناخته می‌شود. هلی‌اسکی و فری‌راید سال‌هاست اینجا جا افتاده‌اند
    و همین گودائوری را از باکوریانی آرام‌تر و خانواده‌پسندتر جدا می‌کند. در تابستان همان دامنه‌ها به‌جای
    اسکی‌بازان، پاراگلایدرسواران و دوچرخه‌سواران کوهستان را بر پشت خود می‌برند.


    شش کیلومتر بالاتر از پیست، نزدیک گردنه، **بنای یادبود دوستی روسیه و گرجستان** ایستاده است: مصطبه‌ای
    بتنی و نیم‌دایره که در 1983 ساخته شد و درونش را موزاییکی رنگی و عظیم با صحنه‌هایی از تاریخ مشترک دو
    کشور پوشانده است. قاب سیاسی آن خوب کهنه نشده، اما به‌عنوان یک شیء و یک نقطهٔ دید بی‌همتاست — مصطبه
    بر پرتگاهی عمودی رو به درهٔ دودوراکی آویزان است و بزرگی این پانوراما به‌سختی در عکس منتقل می‌شود.


    پروازهای تاندم پاراگلایدر از کنار همین بنا آغاز می‌شوند و در تابستان این یکی از محبوب‌ترین کارهایی
    است که بازدیدکنندگان در گودائوری انجام می‌دهند.
  tip: >-
    هوای کوهستان اینجا روزی چند بار عوض می‌شود: آفتاب در پایین، ابر در بالا، و دیدی که در چند دقیقه به
    صفر می‌رسد. اسکی‌پاس و اجارهٔ تجهیزات در پیست موجود است، اما در تعطیلات صف‌ها طولانی می‌شوند. کنار
    بنای یادبود سایه‌ای در کار نیست و نرده تقریباً وجود ندارد، پس نزدیک لبه دست بچه‌ها را رها نکنید. حتی
    در تابستان لباس گرم بیاورید — در ارتفاع 2,400 متر شب‌ها حدود ده درجه است. سوخت، خودپرداز و کافه در
    مرکز گودائوری‌اند.
  route: >-
    بزرگراه نظامی گرجستان (E117) را بگیرید: تفلیس، متسختا، ژینوالی، آنانوری، پاساناوری، گودائوری — 120
    کیلومتر و حدود دو ساعت و ده دقیقه. جاده سرتاسر آسفالت است، اما بالاتر از پاساناوری به صعودی طولانی
    از سرپیچ‌ها بدل می‌شود که با ترافیک سنگین باری مشترک است. زمستان‌ها این بخش بهمن‌خیز است و هرازگاه
    بسته می‌شود، پس پیش از حرکت وضعیتش را بررسی کنید. در فصل سرد لاستیک زمستانی الزامی است و همراه داشتن
    زنجیر چرخ ارزش دارد؛ یک کراس‌اوور با ارتفاع کف مناسب اینجا به‌مراتب راحت‌تر از سدان کوتاه است. باک
    را در پاساناوری پر کنید.
he:
  name: גודאורי ואנדרטת הידידות הרוסית-גאורגית
  short: אתר הסקי המרכזי של גאורגיה מתחת למעבר ג'וארי, עם אנדרטה מצופת פסיפס ופנורמת הרים אדירה.
  body: >-
    **גודאורי הוא אתר הסקי הגדול והגבוה ביותר בגאורגיה.** הוא משתרע בין כ-2,000 ל-3,300 מטר על המדרון
    הדרומי שמתחת למעבר ג'וארי, ויש בו יותר מ-70 קילומטרים של מסלולים מסומנים. העונה נמשכת בדרך כלל מדצמבר
    עד אפריל, והשלג — יבש וקל — נחשב מן הטובים בקווקז.


    האתר מוכר במיוחד בזכות הגלישה מחוץ למסלולים. הלי-סקי ופרירייד מבוססים כאן שנים רבות, וזה בדיוק מה
    שמבדיל את גודאורי מבקוריאני הרגועה והמשפחתית יותר. בקיץ נושאים אותם מדרונות עצמם גולשי מצנחי רחיפה
    ורוכבי אופני הרים במקום גולשי סקי.


    שישה קילומטרים מעל האתר, סמוך למעבר, ניצבת **אנדרטת הידידות הרוסית-גאורגית**: מרפסת בטון חצי-עגולה
    שנבנתה ב-1983 ומצופה מבפנים בפסיפס צבעוני ענק ובו סצנות מן ההיסטוריה המשותפת של שתי המדינות. המסגור
    הפוליטי שלה התיישן רע, אך כאובייקט וכנקודת תצפית היא ייחודית — המרפסת תלויה מעל תהום תלולה אל ערוץ
    דבדוראקי, וקנה המידה של הפנורמה כמעט אינו ניתן להעברה בצילום.


    טיסות טנדם במצנחי רחיפה ממריאות מצד האנדרטה, ובקיץ זו אחת הפעילויות הפופולריות ביותר של המבקרים בגודאורי.
  tip: >-
    מזג האוויר ההררי כאן משתנה כמה פעמים ביום: שמש למטה, עננים למעלה, וראות שיורדת לאפס בתוך דקות. סקי-פס
    והשכרת ציוד זמינים באתר, אך התורים ארוכים בימי החג. באנדרטה כמעט אין צל ואין מעקה של ממש, לכן החזיקו
    את הילדים קרוב אליכם ליד הקצה. הביאו שכבות חמות גם בקיץ — בגובה 2,400 מטר הערבים עומדים על כעשר מעלות.
    דלק, כספומטים ובתי קפה נמצאים במרכז גודאורי.
  route: >-
    סעו בכביש הצבא הגאורגי (E117): טביליסי, מצחתה, ז'ינוואלי, אנאנורי, פסאנאורי, גודאורי — 120 ק״מ וכשעתיים
    ועשר דקות. הכביש סלול לכל אורכו, אך מעל פסאנאורי הוא הופך לטיפוס ארוך של סרפנטינות המשותף לתנועת משאיות
    כבדה. בחורף הקטע הזה חשוף למפולות שלגים ונסגר מדי פעם, לכן בדקו את מצבו לפני היציאה. צמיגי חורף הם
    חובה בעונה הקרה וכדאי להחזיק שרשראות ברכב; קרוסאובר עם גובה גחון סביר נוח כאן הרבה יותר מסדאן נמוכה.
    מלאו דלק בפסאנאורי.
ar:
  name: غوداوري ونصب الصداقة الروسي الجورجي
  short: منتجع التزلج الرئيسي في جورجيا تحت ممر جفاري، مع نصب مبطّن بالفسيفساء وبانوراما جبلية هائلة.
  body: >-
    **غوداوري أكبر منتجعات التزلج في جورجيا وأعلاها.** يمتد بين نحو 2,000 و3,300 متر على المنحدر الجنوبي
    تحت ممر جفاري، وفيه أكثر من 70 كيلومتراً من المسارات المعلَّمة. ويمتد الموسم عادة من ديسمبر إلى أبريل،
    والثلج — الجاف الخفيف — من أفضل ما في القوقاز.


    ويشتهر المنتجع بصفة خاصة بالتزلج خارج المسارات. فالهيلي-سكي والفريرايد راسخان هنا منذ سنوات، وهذا
    ما يميز غوداوري عن باكورياني الأهدأ والأكثر ملاءمة للعائلات. وفي الصيف تحمل المنحدرات نفسها طائرات
    الشراع المظلي ودراجات الجبال بدلاً من المتزلجين.


    وعلى بعد ستة كيلومترات فوق المنتجع، قرب الممر، يقوم **نصب الصداقة الروسي الجورجي**: شرفة خرسانية نصف
    دائرية بُنيت عام 1983 وبُطّنت من الداخل بفسيفساء ملونة ضخمة تصور مشاهد من التاريخ المشترك للبلدين.
    لم يشخ إطاره السياسي جيداً، لكنه كعمل وكمطل يبقى فريداً — إذ تتدلى الشرفة فوق هبوط عمودي نحو مضيق
    ديفدوراكي، ومقياس البانوراما يصعب نقله في الصور.


    وتنطلق رحلات الشراع المظلي الثنائية من جوار النصب، وهي في الصيف من أكثر ما يقبل عليه الزوار في غوداوري.
  tip: >-
    يتبدل طقس الجبال هنا عدة مرات في اليوم: شمس في الأسفل وغيوم في الأعلى، ورؤية تنعدم خلال دقائق. وتتوفر
    تذاكر المصاعد ومعدات الإيجار في المنتجع، لكن الطوابير طويلة في العطلات. وعند النصب لا ظل يُذكر ولا
    سياج تقريباً، فأمسك بالأطفال قرب الحافة. واحمل طبقات دافئة حتى في الصيف — فعلى ارتفاع 2,400 متر تقارب
    الأمسيات عشر درجات. أما الوقود وأجهزة الصراف الآلي والمقاهي فتوجد في وسط غوداوري.
  route: >-
    اسلك الطريق العسكري الجورجي (E117): تبليسي، متسخيتا، جينفالي، أنانوري، باسانوري، غوداوري — 120 كم
    ونحو ساعتين وعشر دقائق. الطريق معبّد طوال المسافة، لكنه فوق باسانوري يتحول إلى صعود طويل من المنعطفات
    تتقاسمه مع حركة الشحن الثقيلة. وفي الشتاء يتعرض هذا المقطع للانهيارات الثلجية ويُغلق دورياً، فتحقق
    من حالته قبل الانطلاق. وإطارات الشتاء إلزامية في الموسم البارد ويستحسن حمل السلاسل؛ وسيارة كروس أوفر
    بخلوص أرضي مناسب أريح هنا بكثير من سيدان منخفضة. املأ الخزان في باسانوري.
