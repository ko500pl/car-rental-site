ka:
  name: წმინდა სამების საკათედრო ტაძარი
  short: >-
    ელიას გორაზე 2004 წელს ნაკურთხი საქართველოს მთავარი ტაძარი: მიწიდან 86 მეტრზე ოქროს ჯვარი, ცხრა ეკლესია
    და ქალაქი, რომელიც მასზე დღემდე დაობს.
  body: >-
    **ელიას გორაზე მიწიდან 86 მეტრის სიმაღლეზე მოოქროვილი ჯვარი დგას და მთელი თბილისი თითქოს მის ირგვლივ
    ლაგდება.** ჩანაფიქრი 1989 წელს, ეროვნული გამოღვიძების წელს, დაიბადა: ახალი ტაძარი ქართული ეკლესიის
    ავტოკეფალიის 1500 წლისა და ქრისტეს შობიდან ორი ათასი წლის აღსანიშნავად. კონკურსზე ასზე მეტი პროექტი
    შემოვიდა; არჩევანი არჩილ მინდიაშვილის ნამუშევარზე შეჩერდა. სამოქალაქო ომმა საქმე ექვსი წლით შეაფერხა,
    საძირკველი მხოლოდ 1990-იანი წლების შუა ხანებში ჩაიყარა, 2004 წლის 23 ნოემბერს, გიორგობას, კი კათოლიკოს-პატრიარქმა
    ილია II-მ ტაძარი აკურთხა.


    მინდიაშვილმა ძველი ქართული ჯვარ-გუმბათოვანი სქემა აიღო და ცისკენ გაჭიმა. გუმბათი რვა ბურჯს ეყრდნობა
    და 7,5-მეტრიან ჯვარს ატარებს; შენობის სიგრძე 70 მეტრია, სიგანე — 65, მიწისქვეშა ორ სართულზე კი ცხრიდან
    ხუთი ეკლესია დგას. ზარები გერმანიაში ჩამოასხეს, უდიდესი მათგანი 8200 კილოგრამს იწონის. შიგნით სინათლე
    მაღალი ყელიდან მარმარილოს იატაკზე ეცემა, სანთლები უზარმაზარი კედლების ძირას ციმციმებს — ამ კედლებს
    ამირან გოგლიძის ხელმძღვანელობით მხატვართა ჯგუფი ხატავს.


    თბილისი სამებაზე ბოლომდე არასოდეს შეთანხმებულა. ბევრისთვის ის საბჭოთა ათეიზმის შემდეგ აღორძინებული
    ეკლესიის სიმბოლოა, სხვებისთვის — ზედმეტად დიდი და ზედმეტად ახალი. არის უფრო მძიმე ამბავიც: ნაკვეთის
    ნაწილი ხოჯავანქის ძველ სომხურ სასაფლაოს ეკავა და მშენებლობის დაწყებისას ძვლები და საფლავის ქვები მთელ
    მოედანზე ეყარა; ერთი ცნობით მაინც, ძველ საფლავებს უპატივცემულოდ მოეპყრნენ.


    ტაძრის შემდეგ ტერასები შემოიარეთ: სამრეკლო, პატრიარქის რეზიდენცია, სემინარია და ბაღები, საიდანაც მდინარის
    გაღმა ძველი ქალაქი და ნარიყალა ერთ ხაზზე დგება. შებინდებამდე დარჩით, როცა პროჟექტორები ქვას ათბობს
    და ჯვარი ქალაქის თავზე ლამპარივით ეკიდება.
  tip: >-
    ჩაცმის წესი მკაცრად მოქმედებს: ქალებს თავსაფარი და მუხლს ქვემოთ ქვედაბოლო სჭირდებათ — მოსასხამს შესასვლელთან
    უფასოდ გაძლევენ, — მამაკაცებს კი გრძელი შარვალი. შიგნით ფოტოს გადაღება ხშირად აკრძალულია, წირვა-ლოცვის
    დროს კი — ყოველთვის. კვირა დილა მრევლს ეკუთვნის; დიდ დღესასწაულებზე, განსაკუთრებით შობას (7 იანვარს)
    და აღდგომის ღამეს, ტაძარი ხალხს ვეღარ იტევს. ტაძრისა და ეზოსთვის ერთი საათი საკმარისია. შუადღისას
    ტერასებზე ჩრდილი არ არის, ამიტომ დილით ან მზის ჩასვლისკენ მოდით. ტუალეტი ტერიტორიაზეა, კაფეები — ავლაბრის
    მეტროსთან, ახლოს.
  route: >-
    სამება ავლაბარში, ელიას გორაზე, მტკვრის მარცხენა ნაპირზე დგას — თავისუფლების მოედნიდან დაახლოებით
    3 კილომეტრი, საცობში 10–15 წუთი. მდინარე მეტეხის ან ბარათაშვილის ხიდით გადაკვეთეთ და ავლაბრის მეტროსკენ
    აუყევით; ტაძარი თითქმის ყველგან ჩანს, ასე რომ, ვერ დაკარგავთ. ეზოს ქვედა კართან უფასო სადგომია, რომელიც
    დღესასწაულებზე სწრაფად ივსება; მაშინ ავლაბრის მოედნის მიმდებარე ქუჩებს მიმართეთ. გზა ბოლომდე ასფალტია,
    აღმართი — მსუბუქი, ამიტომ ნებისმიერი მანქანა გამოდგება. ბენზინგასამართი სადგურები ქეთევან დედოფლის
    გამზირზეა. მეტეხის ეკლესია და რიყის პარკი დაღმართზე, დაახლოებით ერთ კილომეტრშია.
en:
  name: Holy Trinity Cathedral (Sameba)
  short: >-
    Georgia's main cathedral, consecrated on Elia Hill in 2004: a golden cross 86 metres above the ground,
    nine chapels, and a city that still argues about it.
  body: >-
    **On Elia Hill a gilded cross stands 86 metres above the ground, and the whole of Tbilisi seems to
    arrange itself around it.** The idea was born in 1989, the year of Georgia's national awakening: a
    new cathedral for 1,500 years of the Georgian Church's autocephaly and two thousand years since the
    birth of Christ. More than a hundred designs came in, and Archil Mindiashvili's was chosen. Civil
    war held the work back for six years; the foundations went in only in the mid-1990s, and on St George's
    Day, 23 November 2004, Catholicos-Patriarch Ilia II consecrated the church.


    Mindiashvili took the old Georgian cross-and-dome plan and stretched it skywards. The dome rests on
    eight pillars and carries a cross 7.5 metres tall; the building runs 70 metres by 65, and two underground
    floors hold five of its nine chapels. The bells were cast in Germany, the largest weighing 8,200 kilograms.
    Inside, light falls from the high drum onto marble floors, and candles flicker at the foot of vast
    walls that a team of painters led by Amiran Goglidze has been covering with murals.


    Tbilisi has never quite agreed about Sameba. For many it is the emblem of a church reborn after Soviet
    atheism; for others it is too big and too new. There is a harder story too. Part of the site belonged
    to Khojavank, an old Armenian cemetery, and when building began, bones and gravestones lay scattered
    across the ground; by at least one account, the old graves were treated with little respect.


    Walk the terraces after the church: the bell tower, the Patriarch's residence, the seminary, and gardens
    from which the old town and Narikala line up across the river. Stay until dusk, when floodlights warm
    the stone and the cross hangs over the city like a lamp.
  tip: >-
    The dress code is enforced: women need a headscarf and a skirt below the knee — wraps are lent free
    at the entrance — and men need long trousers. Photography inside is often not allowed, and never during
    services. Sunday morning belongs to worshippers; on great feasts, above all Christmas (7 January)
    and Easter night, the cathedral overflows. An hour covers the church and the grounds. The terraces
    are shadeless at midday, so come in the morning or towards sunset. Toilets are on site; cafés cluster
    around Avlabari metro, a short walk away.
  route: >-
    Sameba stands on Elia Hill in Avlabari, on the left bank, about 3 km from Freedom Square: ten to fifteen
    minutes' drive in traffic. Cross the Mtkvari by Metekhi or Baratashvili bridge and climb towards Avlabari
    metro; the cathedral is visible from almost everywhere, so you will not lose it. There is free parking
    at the lower gate of the compound, which fills quickly on feast days; the side streets around Avlabari
    Square are the fallback. The road is paved throughout, with only a gentle climb, so any car will do.
    Fuel stations are on Ketevan Dedopali Avenue. Metekhi Church and Rike Park are about a kilometre downhill.
ru:
  name: Кафедральный собор Святой Троицы (Самеба)
  short: >-
    Главный собор Грузии, освящённый на холме Элиа в 2004 году: золотой крест в 86 метрах над землёй,
    девять приделов и город, который до сих пор о нём спорит.
  body: >-
    **На холме Элиа позолоченный крест стоит в 86 метрах над землёй, и кажется, будто весь Тбилиси выстраивается
    вокруг него.** Замысел родился в 1989 году, в год национального пробуждения Грузии: новый собор к
    1500-летию автокефалии Грузинской церкви и двухтысячелетию Рождества Христова. На конкурс поступило
    больше ста проектов, и выбрали проект Арчила Миндиашвили. Гражданская война задержала работы на шесть
    лет; фундамент заложили лишь в середине 1990-х, а в день святого Георгия, 23 ноября 2004 года, Католикос-Патриарх
    Илия II освятил храм.


    Миндиашвили взял старую грузинскую крестово-купольную схему и вытянул её к небу. Купол опирается на
    восемь столпов и несёт крест высотой 7,5 метра; здание имеет размеры 70 на 65 метров, а на двух подземных
    этажах разместились пять из девяти его приделов. Колокола отлиты в Германии, самый большой весит 8200
    килограммов. Внутри свет падает из высокого барабана на мраморный пол, и у подножия огромных стен,
    которые покрывает росписями артель художников во главе с Амираном Гоглидзе, мерцают свечи.


    Тбилиси так до конца и не пришёл к согласию насчёт Самебы. Для многих это символ церкви, возродившейся
    после советского атеизма; для других собор слишком велик и слишком нов. Есть и история потяжелее.
    Часть участка принадлежала старому армянскому кладбищу Ходживанк, и когда началось строительство,
    по земле были разбросаны кости и надгробия; по крайней мере по одному свидетельству, со старыми могилами
    обошлись без должного уважения.


    После храма пройдитесь по террасам: колокольня, резиденция Патриарха, семинария и сады, откуда за
    рекой в одну линию выстраиваются Старый город и Нарикала. Останьтесь до сумерек, когда прожекторы
    согревают камень, а крест висит над городом, словно лампада.
  tip: >-
    Дресс-код соблюдают строго: женщинам нужны платок и юбка ниже колена — накидки бесплатно выдают у
    входа, — мужчинам длинные брюки. Фотографировать внутри часто нельзя, а во время службы — никогда.
    Воскресное утро принадлежит молящимся; в большие праздники, прежде всего на Рождество (7 января) и
    в пасхальную ночь, собор переполнен. На храм и территорию хватит часа. В полдень на террасах нет тени,
    так что приходите утром или ближе к закату. Туалеты есть на территории; кафе сосредоточены у метро
    «Авлабари», в нескольких минутах ходьбы.
  route: >-
    Самеба стоит на холме Элиа в Авлабари, на левом берегу, примерно в 3 км от площади Свободы — 10–15
    минут с учётом пробок. Переезжайте Мтквари по Метехскому мосту или мосту Бараташвили и поднимайтесь
    к метро «Авлабари»; собор виден почти отовсюду, так что потерять его из виду не получится. У нижних
    ворот комплекса есть бесплатная парковка, но в праздники она быстро заполняется; запасной вариант
    — боковые улицы вокруг площади Авлабари. Дорога асфальтирована на всём протяжении, подъём лишь пологий,
    подойдёт любая машина. Заправки есть на проспекте Кетеван Дедопали. Метехская церковь и парк Рике
    — примерно в километре вниз по склону.
fa:
  name: کلیسای جامع تثلیث مقدس (سامبا)
  short: >-
    کلیسای جامع اصلی گرجستان که در ۲۰۰۴ بر تپهٔ الیا تقدیس شد: صلیبی زرین ۸۶ متر بالاتر از زمین، نه نمازخانه،
    و شهری که هنوز بر سرش بحث دارد.
  body: >-
    **بر تپهٔ الیا صلیبی زراندود ۸۶ متر بالاتر از زمین ایستاده است و گویی سراسر تفلیس گرد آن سامان می‌گیرد.**
    این اندیشه در ۱۹۸۹ زاده شد، سال بیداری ملی گرجستان: کلیسای جامعی تازه به مناسبت ۱۵۰۰ سال خودمختاری
    (اتوکفالی) کلیسای گرجستان و دو هزار سال از میلاد مسیح. بیش از صد طرح رسید و طرح آرچیل میندیاشویلی
    برگزیده شد. جنگ داخلی کار را شش سال عقب انداخت؛ پی‌ها تنها در میانهٔ دههٔ ۱۹۹۰ ریخته شد و در روز قدیس
    گئورگیوس، ۲۳ نوامبر ۲۰۰۴، کاتولیکوس-پاتریارک ایلیای دوم کلیسا را تقدیس کرد.


    میندیاشویلی نقشهٔ کهن گرجی صلیبی‌گنبددار را برگرفت و آن را به سوی آسمان کشید. گنبد بر هشت ستون استوار
    است و صلیبی به بلندی ۷٫۵ متر را بر دوش دارد؛ ابعاد بنا ۷۰ در ۶۵ متر است و دو طبقهٔ زیرزمینی آن پنج
    نمازخانه از نه نمازخانه‌اش را در خود جای داده‌اند. ناقوس‌ها در آلمان ریخته شده‌اند و بزرگ‌ترینشان
    ۸۲۰۰ کیلوگرم وزن دارد. درون، نور از ساقهٔ بلند گنبد بر کف‌های مرمرین می‌ریزد و شمع‌ها پای دیوارهای
    عظیمی سوسو می‌زنند که گروهی از نقاشان به سرپرستی امیران گوگلیدزه سال‌هاست آن‌ها را با نقاشی دیواری
    می‌پوشانند.


    تفلیس هرگز دربارهٔ سامبا به توافق کامل نرسیده است. برای بسیاری، نماد کلیسایی است که پس از الحاد دوران
    شوروی دوباره زاده شد؛ برای دیگران، بیش از اندازه بزرگ و بیش از اندازه نو است. داستانی تلخ‌تر هم در
    میان است. بخشی از زمین به خوجاوانک، گورستان کهن ارمنیان، تعلق داشت و هنگامی که ساخت آغاز شد، استخوان‌ها
    و سنگ‌قبرها در سراسر زمین پراکنده بود؛ به روایت دست‌کم یک منبع، با گورهای کهن بی‌احترامی شد.


    پس از کلیسا در تراس‌ها قدم بزنید: برج ناقوس، اقامتگاه پاتریارک، مدرسهٔ دینی و باغ‌هایی که از آن‌ها
    شهر قدیم و ناریکالا آن‌سوی رود در یک خط دیده می‌شوند. تا غروب بمانید، وقتی نورافکن‌ها سنگ را گرم می‌کنند
    و صلیب همچون چراغی بر فراز شهر آویخته است.
  tip: >-
    قواعد پوشش جدی گرفته می‌شود: زنان به روسری و دامنی تا زیر زانو نیاز دارند (دم در پارچهٔ پوشش را رایگان
    امانت می‌دهند) و مردان به شلوار بلند. عکاسی در داخل اغلب مجاز نیست و هنگام مراسم هرگز. صبح یکشنبه
    از آنِ نمازگزاران است؛ در اعیاد بزرگ، به‌ویژه کریسمس (۷ ژانویه) و شب عید پاک، کلیسا لبریز از جمعیت
    می‌شود. یک ساعت برای کلیسا و محوطه بس است. تراس‌ها نیمروز سایه ندارند، پس صبح یا نزدیک غروب بیایید.
    سرویس بهداشتی در محوطه هست؛ کافه‌ها گرد ایستگاه متروی آولاباری جمع‌اند، چند دقیقه پیاده آن‌سوتر.
  route: >-
    سامبا بر تپهٔ الیا در محلهٔ آولاباری، در کرانهٔ چپ رود، حدود ۳ کیلومتر از میدان آزادی فاصله دارد:
    ۱۰ تا ۱۵ دقیقه رانندگی با ترافیک. از پل متخی یا پل باراتاشویلی از رود متکواری بگذرید و به سوی ایستگاه
    متروی آولاباری بالا بروید؛ کلیسا تقریباً از همه‌جا پیداست، پس گمش نمی‌کنید. کنار دروازهٔ پایینی مجموعه
    پارکینگ رایگان هست که در روزهای عید زود پر می‌شود؛ جایگزینش خیابان‌های فرعی گرداگرد میدان آولاباری
    است. راه سراسر آسفالت است و شیبی ملایم دارد، پس هر خودرویی از پسش برمی‌آید. پمپ‌بنزین‌ها در خیابان
    کتوان ددوپالی‌اند. کلیسای متخی و پارک ریکه حدود یک کیلومتر پایین‌تر، در سراشیبی، قرار دارند.
he:
  name: קתדרלת השילוש הקדוש (סאמבה)
  short: >-
    הקתדרלה הראשית של גאורגיה, שהוקדשה על גבעת אליה ב-2004: צלב מוזהב 86 מטרים מעל הקרקע, תשע קפלות, ועיר
    שעדיין מתווכחת עליה.
  body: >-
    **על גבעת אליה ניצב צלב מוזהב 86 מטרים מעל הקרקע, ונדמה שכל טביליסי מסתדרת סביבו.** הרעיון נולד ב-1989,
    שנת ההתעוררות הלאומית של גאורגיה: קתדרלה חדשה לציון 1,500 שנות אוטוקפליה (עצמאות כנסייתית) של הכנסייה
    הגאורגית ואלפיים שנה להולדת ישו. הוגשו יותר ממאה הצעות, ונבחרה זו של ארצ'יל מינדיאשווילי. מלחמת האזרחים
    עיכבה את העבודות בשש שנים; היסודות הונחו רק באמצע שנות ה-90, וביום גאורגיוס הקדוש, 23 בנובמבר 2004,
    הקדיש הקתוליקוס-הפטריארך איליה השני את הכנסייה.


    מינדיאשווילי לקח את תוכנית הצלב והכיפה הגאורגית הוותיקה ומתח אותה אל השמיים. הכיפה נשענת על שמונה
    עמודים ונושאת צלב בגובה 7.5 מטרים; מידות המבנה 70 על 65 מטרים, ושתי קומות תת-קרקעיות מכילות חמש מתוך
    תשע הקפלות שלו. הפעמונים נוצקו בגרמניה, והגדול שבהם שוקל 8,200 קילוגרם. בפנים האור נופל מצוואר הכיפה
    הגבוה על רצפות השיש, ונרות מהבהבים לרגלי קירות עצומים שצוות ציירים בהנהגת אמירן גוגלידזה מכסה בציורי
    קיר.


    טביליסי מעולם לא הגיעה להסכמה של ממש על סאמבה. לרבים היא סמל לכנסייה שקמה לתחייה אחרי האתאיזם הסובייטי;
    לאחרים היא גדולה מדי וחדשה מדי. יש גם סיפור קשה יותר. חלק מהשטח השתייך לחוג'וואנק, בית קברות ארמני
    עתיק, וכשהחלה הבנייה היו עצמות ומצבות פזורות על פני הקרקע; לפי עדות אחת לפחות, נהגו בקברים הישנים
    בחוסר כבוד.


    אחרי הכנסייה טיילו בטרסות: מגדל הפעמונים, מעון הפטריארך, הסמינר, וגנים שמהם העיר העתיקה ונריקלה נפרשות
    בשורה אחת מעבר לנהר. הישארו עד רדת החשכה, כשהזרקורים מחממים את האבן והצלב תלוי מעל העיר כמו מנורה.
  tip: >-
    קוד הלבוש נאכף: נשים צריכות כיסוי ראש וחצאית מתחת לברך — בכניסה משאילים בחינם בדים להתעטף בהם — וגברים
    צריכים מכנסיים ארוכים. צילום בפנים לרוב אסור, ובזמן תפילה — אף פעם. בוקר יום ראשון שייך למתפללים;
    בחגים הגדולים, ובראשם חג המולד (7 בינואר) וליל הפסחא, הקתדרלה מלאה עד אפס מקום. שעה מספיקה לכנסייה
    ולשטח שסביבה. בצהריים אין צל בטרסות, אז בואו בבוקר או לקראת השקיעה. יש שירותים במקום; בתי הקפה מרוכזים
    סביב תחנת המטרו אבלבארי, במרחק הליכה קצר.
  route: >-
    סאמבה ניצבת על גבעת אליה ברובע אבלבארי, על הגדה השמאלית, כ-3 ק״מ מכיכר החירות, 10–15 דקות נסיעה בפקקים.
    חצו את נהר המטקוורי בגשר מטחי או בגשר ברטשווילי ועלו לכיוון תחנת המטרו אבלבארי; הקתדרלה נראית כמעט
    מכל מקום, כך שלא תאבדו אותה. ליד השער התחתון של המתחם יש חניה חינם, שמתמלאת מהר בימי חג; החלופה היא
    הרחובות הצדדיים סביב כיכר אבלבארי. הדרך סלולה לכל אורכה והעלייה מתונה בלבד, כך שכל רכב יתאים. תחנות
    דלק יש בשדרות קטוואן דדופלי. כנסיית מטחי ופארק ריקה נמצאים כקילומטר במורד.
ar:
  name: كاتدرائية الثالوث الأقدس (سامبا)
  short: >-
    الكاتدرائية الرئيسية في جورجيا، كُرّست على تلة إيليا عام 2004: صليب مذهّب على ارتفاع 86 متراً، وتسعة
    مصليات، ومدينة لا تزال تتجادل بشأنها.
  body: >-
    **على تلة إيليا يقوم صليب مذهّب على ارتفاع 86 متراً فوق الأرض، ويبدو كأن تبليسي كلها تنتظم من حوله.**
    وُلدت الفكرة عام 1989، عام اليقظة الوطنية في جورجيا: كاتدرائية جديدة احتفاءً بمرور 1500 عام على استقلال
    الكنيسة الجورجية الذاتي (الأوتوكيفالية) وألفي عام على ميلاد المسيح. ووصل أكثر من مئة تصميم، فوقع الاختيار
    على تصميم أرتشيل ميندياشفيلي. أخّرت الحرب الأهلية العمل ست سنوات، فلم تُرسَ الأساسات إلا في منتصف
    التسعينيات، وفي عيد القديس جاورجيوس، في 23 نوفمبر 2004، كرّس الكاثوليكوس البطريرك إيليا الثاني الكنيسة.


    أخذ ميندياشفيلي المخطط الجورجي القديم ذا الصليب والقبة ومدّه نحو السماء. تستند القبة إلى ثماني دعامات
    وتحمل صليباً ارتفاعه 7.5 أمتار؛ ويمتد المبنى 70 متراً في 65، ويضم طابقان تحت الأرض خمسة من مصلياته
    التسعة. صُبّت الأجراس في ألمانيا، وأثقلها يزن 8200 كيلوغرام. وفي الداخل ينسكب الضوء من رقبة القبة
    العالية على أرضيات الرخام، وتتراقص الشموع عند أقدام جدران هائلة يكسوها بالجداريات فريق من الرسامين
    بقيادة أميران غوغليدزه.


    لم تتفق تبليسي قط اتفاقاً تاماً على سامبا. فهي عند كثيرين رمز لكنيسة بُعثت من جديد بعد الإلحاد السوفييتي،
    وعند آخرين أكبر مما ينبغي وأحدث مما ينبغي. وثمة حكاية أقسى أيضاً. فجزء من الموقع كان تابعاً لخوجافانك،
    وهي مقبرة أرمنية قديمة، وحين بدأ البناء كانت العظام وشواهد القبور متناثرة على الأرض، وبحسب رواية واحدة
    على الأقل عوملت القبور القديمة بقلة احترام.


    بعد الكنيسة تجوّل في المصاطب: برج الأجراس، ومقر البطريرك، والمدرسة الإكليريكية، وحدائق تبدو منها البلدة
    القديمة وقلعة ناريكالا مصطفّتين على الضفة الأخرى من النهر. ابقَ حتى الغسق، حين تدفئ الأضواء الكاشفة
    الحجر ويتدلى الصليب فوق المدينة كقنديل.
  tip: >-
    قواعد اللباس مطبّقة بصرامة: تحتاج النساء إلى غطاء للرأس وتنورة تنسدل إلى ما دون الركبة (تُعار الأوشحة
    مجاناً عند المدخل)، والرجال إلى سراويل طويلة. التصوير في الداخل غير مسموح في أغلب الأحيان، وممنوع
    قطعاً أثناء القداس. صباح الأحد للمصلين؛ وفي الأعياد الكبرى، ولا سيما عيد الميلاد (7 يناير) وليلة الفصح،
    تفيض الكاتدرائية بالناس. تكفي ساعة للكنيسة وما حولها. المصاطب بلا ظل عند الظهيرة، فتعال صباحاً أو
    قرب الغروب. دورات المياه في الموقع، والمقاهي تتجمع حول محطة مترو أفلاباري على مسافة قصيرة سيراً.
  route: >-
    تقوم سامبا على تلة إيليا في حي أفلاباري على الضفة اليسرى، على بعد نحو 3 كم من ساحة الحرية، أي 10–15
    دقيقة بالسيارة مع الازدحام. اعبر نهر متكفاري على جسر ميتيخي أو جسر باراتاشفيلي واصعد نحو محطة مترو
    أفلاباري؛ الكاتدرائية ظاهرة من كل مكان تقريباً، فلن تضيّعها. ثمة موقف مجاني عند البوابة السفلى للمجمع
    يمتلئ سريعاً في أيام الأعياد، والبديل هو الشوارع الجانبية حول ساحة أفلاباري. الطريق معبّد بالكامل
    وصعوده خفيف، فتصلح له أي سيارة. محطات الوقود في جادة كيتيفان ديدوبالي. أما كنيسة ميتيخي وحديقة ريكه
    فعلى بعد كيلومتر تقريباً نزولاً.
