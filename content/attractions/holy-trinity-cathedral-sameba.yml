ka:
  name: წმინდა სამების საკათედრო ტაძარი
  short: ელიას გორაზე აღმართული სამება — საქართველოს უდიდესი ტაძარი და ქალაქის მეორე დომინანტი ნარიყალას
    შემდეგ.
  body: >-
    **სამება თანამედროვე თბილისის მთავარი არქიტექტურული ჟესტია.** ტაძარი 1995–2004 წლებში აშენდა საბჭოთა
    პერიოდის შემდგომი აღორძინების სიმბოლოდ და ჯვრის მწვერვალიდან 100 მეტრზე მაღლა იწევს — ეს სამხრეთ კავკასიის
    ერთ-ერთი ყველაზე მაღალი მართლმადიდებლური ტაძარია.


    არქიტექტორმა არჩილ მინდიაშვილმა კლასიკური ქართული ჯვარგუმბათოვანი სქემა უზარმაზარ მასშტაბზე გადაიტანა.
    შედეგი სადავოა — ნაწილი კრიტიკოსებისა მას ზედმეტად ახალს უწოდებს — მაგრამ სივრცის შეგრძნება შიგნით
    მართლაც განსხვავებულია: სინათლე გუმბათიდან ეშვება და ქვედა იარუსში თითქმის ცარიელ, უზარმაზარ ჰაერს
    ქმნის.


    კომპლექსი ერთ შენობაზე მეტია:


    - მთავარი ტაძარი ცხრა სამლოცველოთი, აქედან სამი მიწისქვეშაა

    - სამრეკლო, პატრიარქის რეზიდენცია, სასულიერო აკადემია და მონასტერი

    - ტერასული ბაღი, საიდანაც ძველი თბილისი და ავლაბრის სახურავები ერთ კადრში ჯდება

    - ხედი, რომელიც განსაკუთრებით კარგია საღამოს, როცა ტაძარი ნათდება


    მნიშვნელოვანია გვახსოვდეს, რომ სამება მოქმედი საკათედრო ტაძარია და არა მუზეუმი. ლიტურგიის დროს შესვლა
    შესაძლებელია, მაგრამ ფოტოაპარატით სიარული მსახურების მიმდინარეობისას მიღებული არ არის. კვირა დილით
    აქ ტურისტზე მეტი ადგილობრივი მრევლია და სწორედ ეს ხდის ვიზიტს უფრო საინტერესოს — ხედავ არა ღირსშესანიშნაობას,
    არამედ ცოცხალ ტრადიციას.


    ტაძრის მშენებლობა საზოგადოებრივი შემოწირულობებით დაფინანსდა და თითქმის ათი წელი გაგრძელდა. ინტერიერში
    ჯერ კიდევ მიმდინარეობს მოზაიკებისა და კედლის მხატვრობის შესრულება, ამიტომ ყოველი შემდეგი ვიზიტისას
    რაღაც ახალს შეამჩნევ. კედლის ქვა ბოლნისური ტუფია, იატაკი — მარმარილო, ხოლო კარიბჭეები ბრინჯაოსია და
    ცალკე დათვალიერებას იმსახურებს.
  tip: >-
    ჩაცმის კოდი მკაცრია: ქალებს თავსაფარი და მუხლს ქვემოთ კაბა ან გრძელი კალთა სჭირდებათ (შესასვლელთან
    უფასოდ გაიცემა), მამაკაცებს — გრძელი შარვალი. მოკლე შორტებში არ შეგიშვებენ. ფოტოაპარატი შიგნით ხშირად
    აკრძალულია, ტელეფონი ჩუმად. საუკეთესო დროა დილა ან საღამო; დღის შუაში ტერასაზე ჩრდილი არ არის. ერთი
    საათი სავსებით საკმარისია. ტუალეტი ტერიტორიაზეა, კაფე — ავლაბრის მეტროსთან.
  route: >-
    სამება ავლაბარშია, ელიას გორაზე, ცენტრიდან 10–15 წუთის სავალზე. მეტეხის ხიდიდან ან ბარათაშვილის ხიდიდან
    წარწერებს მიჰყევი — ტაძარი თითქმის ყოველთვის ჩანს, ამიტომ დაკარგვა რთულია. საკუთარი უფასო პარკინგი
    ტერიტორიის ქვედა შესასვლელთანაა, მაგრამ დღესასწაულებზე სწრაფად ივსება; ალტერნატივა ავლაბრის მოედნის
    მიმდებარე ქუჩებია. გზა მთლიანად ასფალტია, აღმართი მსუბუქი — ნებისმიერი კლასის ავტომობილი გამოდგება.
    საწვავის აღება მოსახერხებელია ქეთევან დედოფლის გამზირზე.
en:
  name: Holy Trinity Cathedral (Sameba)
  short: >-
    The vast Sameba cathedral on Elia Hill — Georgia's largest church and the city's second landmark after
    Narikala.
  body: >-
    **Sameba is modern Tbilisi's boldest architectural statement.** Built between 1995 and 2004 as a symbol
    of post-Soviet religious revival, it rises about a hundred metres from floor to the top of its cross,
    making it one of the tallest Orthodox churches in the South Caucasus.


    The architect, Archil Mindiashvili, took the classic Georgian cross-dome plan and scaled it up enormously.
    The result divides opinion — critics call it too new, too smooth — but the interior genuinely feels
    different from an old church. Light drops straight from the dome into an almost empty volume, and
    the sheer emptiness is the point.


    The complex is more than one building:


    - The main cathedral with nine chapels, three of them underground

    - A free-standing bell tower, the Patriarch's residence, a seminary and a working monastery

    - Terraced gardens where the Old Town and the roofs of Avlabari line up in a single frame

    - A view that is at its best in the evening, when the cathedral itself is lit


    It is worth remembering that Sameba is an active cathedral rather than a monument. You can enter during
    the liturgy, but wandering with a camera during a service is not welcome, and Sunday mornings are
    busy with local worshippers rather than visitors.
  tip: >-
    The dress code is enforced. Women need a headscarf and a skirt below the knee — wraps are handed out
    free at the entrance — and men need long trousers; shorts will not get you in. Photography inside
    is often prohibited, so keep the phone away unless you see others using one. Mornings and evenings
    are best; the terrace has no shade at midday. An hour is enough for the church and the gardens. Toilets
    are on site, cafés are near Avlabari metro.
  route: >-
    The cathedral stands in Avlabari on Elia Hill, ten to fifteen minutes from the centre. Follow signs
    from either the Metekhi or the Baratashvili bridge — the building is visible from almost everywhere,
    so getting lost is difficult. There is free parking at the lower gate of the compound, though it fills
    quickly on feast days; the side streets around Avlabari Square are the fallback. The approach is fully
    paved with a gentle climb, so any car category is fine. The nearest convenient fuel stations are on
    Ketevan Dedopali Avenue.
ru:
  name: Кафедральный собор Святой Троицы (Самеба)
  short: Огромный собор Самеба на холме Элия — крупнейший храм Грузии и вторая доминанта города после
    Нарикалы.
  body: >-
    **Самеба — самое смелое архитектурное высказывание современного Тбилиси.** Собор построен в 1995–2004
    годах как символ послесоветского религиозного возрождения и поднимается примерно на сто метров до
    верхушки креста, что делает его одним из самых высоких православных храмов Южного Кавказа.


    Архитектор Арчил Миндиашвили взял классическую грузинскую крестово-купольную схему и увеличил её до
    предела. Результат спорный — критики говорят, что храм слишком новый и слишком гладкий, — но внутри
    ощущение действительно иное, чем в древней церкви. Свет падает прямо из купола в почти пустой объём,
    и эта пустота и есть главный эффект.


    Комплекс — не одно здание:


    - Главный собор с девятью приделами, три из которых подземные

    - Отдельно стоящая колокольня, резиденция патриарха, семинария и действующий монастырь

    - Террасные сады, откуда Старый город и крыши Авлабари попадают в один кадр

    - Вид, который особенно хорош вечером, когда собор подсвечен


    Стоит помнить, что Самеба — действующий кафедральный собор, а не памятник. Войти во время литургии
    можно, но ходить с камерой во время службы не принято.
  tip: >-
    Дресс-код здесь соблюдают. Женщинам нужен платок и юбка ниже колена — накидки выдают бесплатно у входа,
    — мужчинам длинные брюки; в шортах не пустят. Съёмка внутри часто запрещена, телефон лучше убрать.
    Лучшее время — утро или вечер, днём на террасе нет тени. Часа достаточно на храм и сады. Туалеты на
    территории, кафе — у метро «Авлабари».
  route: >-
    Собор стоит в Авлабари на холме Элия, в десяти-пятнадцати минутах от центра. Указатели есть и с Метехского
    моста, и с моста Бараташвили, а сам храм виден почти отовсюду, так что заблудиться трудно. У нижних
    ворот есть бесплатная парковка, но по праздникам она быстро заполняется; запасной вариант — улицы
    вокруг площади Авлабари. Дорога полностью асфальтированная, подъём пологий, подойдёт машина любого
    класса. Ближайшие удобные заправки — на проспекте Кетеван Дедопали.
fa:
  name: کلیسای جامع تثلیث مقدس (سامبا)
  short: کلیسای جامع عظیم سامبا بر تپهٔ الیا — بزرگ‌ترین کلیسای گرجستان و دومین نشانهٔ شهر پس از ناریکالا.
  body: >-
    **سامبا جسورانه‌ترین اظهار معماری تفلیس مدرن است.** میان 1995 و 2004 به نشانهٔ احیای دینی پس از دوران
    شوروی ساخته شد و از کف تا نوک صلیبش حدود صد متر بالا می‌رود، و همین آن را به یکی از بلندترین کلیساهای
    ارتدکس قفقاز جنوبی بدل کرده است.


    معمار آن، آرچیل میندیاشویلی، نقشهٔ کلاسیک گرجی صلیب-گنبد را برداشت و در مقیاسی عظیم بزرگ کرد. نتیجه
    اختلاف‌برانگیز است — منتقدان آن را بیش از حد نو و بیش از حد صیقلی می‌خوانند — اما فضای درون واقعاً
    با یک کلیسای کهن فرق دارد. نور مستقیم از گنبد در حجمی تقریباً خالی فرو می‌ریزد، و همین خالی‌بودن نکتهٔ
    اصلی است.


    مجموعه بیش از یک بنا است:


    - کلیسای جامع اصلی با نُه نمازخانه که سه‌تای آن‌ها زیرزمینی است

    - برج ناقوس مستقل، اقامتگاه پاتریارک، یک حوزهٔ دینی و صومعه‌ای فعال

    - باغ‌های مصطبه‌ای که شهر قدیم و بام‌های آولاباری را در یک قاب کنار هم می‌چینند

    - نمایی که در غروب بهترین حالت را دارد، وقتی خود کلیسا نورپردازی می‌شود


    خوب است به یاد داشته باشید که سامبا کلیسای جامعی فعال است، نه یک بنای یادبود. می‌توانید در حین مراسم
    وارد شوید، اما پرسه‌زدن با دوربین در میانهٔ عبادت پسندیده نیست، و صبح‌های یکشنبه بیشتر با مؤمنان محلی
    شلوغ است تا با بازدیدکنندگان.
  tip: >-
    کد پوشش اجرا می‌شود. زنان به روسری و دامن زیر زانو نیاز دارند — پارچه‌ها در ورودی رایگان داده می‌شود
    — و مردان به شلوار بلند؛ با شلوارک راهتان نمی‌دهند. عکاسی در داخل اغلب ممنوع است، پس تا وقتی دیگران
    را در حال عکس گرفتن نبینید گوشی را کنار بگذارید. صبح و غروب بهترین وقت‌اند؛ مصطبه ظهرها سایه ندارد.
    یک ساعت برای کلیسا و باغ‌ها کافی است. سرویس بهداشتی در محوطه است و کافه‌ها نزدیک مترو آولاباری.
  route: >-
    کلیسای جامع در آولاباری روی تپهٔ الیا ایستاده است، ده تا پانزده دقیقه از مرکز شهر. تابلوها را از پل
    متخی یا پل باراتاشویلی دنبال کنید — ساختمان تقریباً از همه جا دیده می‌شود و گم شدن دشوار است. کنار
    دروازهٔ پایینی مجموعه پارکینگ رایگان هست، هرچند در روزهای عید زود پر می‌شود؛ گزینهٔ جایگزین کوچه‌های
    اطراف میدان آولاباری است. مسیر دسترسی سرتاسر آسفالت با شیبی ملایم است، پس هر ردهٔ خودرویی مناسب است.
    نزدیک‌ترین پمپ‌بنزین‌های راحت در خیابان کتوان ددوپالی‌اند.
he:
  name: קתדרלת השילוש הקדוש (סאמבה)
  short: קתדרלת סאמבה העצומה על גבעת אליה — הכנסייה הגדולה בגאורגיה וסמל העיר השני אחרי נריקלה.
  body: >-
    **סאמבה היא ההצהרה האדריכלית הנועזת ביותר של טביליסי המודרנית.** היא נבנתה בין 1995 ל-2004 כסמל לתחייה
    הדתית שאחרי התקופה הסובייטית, ומתנשאת כמאה מטרים מן הרצפה ועד לראש הצלב שלה, ובכך היא אחת הכנסיות
    האורתודוקסיות הגבוהות בדרום הקווקז.


    האדריכל, ארצ'יל מינדיאשווילי, לקח את תוכנית הצלב-כיפה הגאורגית הקלאסית והגדיל אותה לממדים אדירים.
    התוצאה מפלגת את הדעות — מבקרים אומרים שהיא חדשה מדי וחלקה מדי — אבל הפנים באמת מרגיש אחרת מכנסייה
    עתיקה. האור נופל היישר מן הכיפה אל חלל כמעט ריק, והריקנות הזאת עצמה היא העניין.


    המתחם הוא יותר מבניין אחד:


    - הקתדרלה הראשית ובה תשע קפלות, שלוש מהן תת-קרקעיות

    - מגדל פעמונים נפרד, מעון הפטריארך, סמינר ומנזר פעיל

    - גנים מדורגים שבהם העיר העתיקה וגגות אוולבארי מסתדרים במסגרת אחת

    - נוף שהוא במיטבו בערב, כשהקתדרלה עצמה מוארת


    כדאי לזכור שסאמבה היא קתדרלה פעילה ולא אנדרטה. מותר להיכנס בשעת הליטורגיה, אך שיטוט עם מצלמה בזמן
    טקס אינו רצוי, ובבקרי יום ראשון המקום הומה מתפללים מקומיים יותר מאשר מבקרים.
  tip: >-
    קוד הלבוש נאכף. נשים זקוקות למטפחת ראש ולחצאית מתחת לברך — כיסויים מחולקים חינם בכניסה — וגברים למכנסיים
    ארוכים; במכנסיים קצרים לא תיכנסו. הצילום בפנים אסור פעמים רבות, לכן החזיקו את הטלפון בכיס אלא אם אתם
    רואים אחרים מצלמים. הבוקר והערב הם הזמן הטוב ביותר; במרפסת אין צל בשעות הצהריים. שעה מספיקה לכנסייה
    ולגנים. יש שירותים בשטח, ובתי הקפה נמצאים ליד תחנת המטרו אוולבארי.
  route: >-
    הקתדרלה ניצבת באוולבארי על גבעת אליה, עשר עד חמש עשרה דקות מן המרכז. עקבו אחרי השילוט מגשר מטחי או
    מגשר ברטשווילי — הבניין נראה כמעט מכל מקום בעיר, כך שקשה ללכת לאיבוד. יש חניה חינם ליד השער התחתון
    של המתחם, אך היא מתמלאת מהר בימי חג; החלופה היא רחובות הצד שסביב כיכר אוולבארי. דרך הגישה סלולה לחלוטין
    ועולה בשיפוע מתון, ולכן כל קטגוריית רכב מתאימה לה. תחנות הדלק הנוחות הקרובות ביותר נמצאות בשדרות קטוואן
    דדופלי.
ar:
  name: كاتدرائية الثالوث المقدس (سامبا)
  short: كاتدرائية سامبا الشاسعة على تل إيليا — أكبر كنائس جورجيا وثاني معالم المدينة بعد ناريكالا.
  body: >-
    **سامبا هي أجرأ تصريح معماري في تبليسي الحديثة.** بُنيت بين عامي 1995 و2004 رمزاً للنهضة الدينية بعد
    الحقبة السوفييتية، وترتفع نحو مئة متر من الأرضية إلى قمة صليبها، ما يجعلها من أعلى الكنائس الأرثوذكسية
    في جنوب القوقاز.


    أخذ المعماري أرتشيل مينديَاشفيلي المخطط الجورجي الكلاسيكي ذا الصليب والقبة وكبّره تكبيراً هائلاً.
    والنتيجة تقسم الآراء — إذ يصفها النقاد بأنها جديدة أكثر مما ينبغي وناعمة أكثر مما ينبغي — لكن الداخل
    يبدو فعلاً مختلفاً عن كنيسة قديمة. فالضوء ينزل مباشرة من القبة إلى فراغ يكاد يكون خالياً، وهذا الخلاء
    نفسه هو المقصود.


    والمجمع أكثر من مبنى واحد:


    - الكاتدرائية الرئيسية بتسع مصلّيات، ثلاث منها تحت الأرض

    - برج أجراس قائم بذاته، ومقر البطريرك، ومعهد لاهوتي ودير عامل

    - حدائق مدرَّجة تصطف فيها المدينة القديمة وسطوح أفلاباري في إطار واحد

    - إطلالة تبلغ ذروتها مساءً، حين تُضاء الكاتدرائية نفسها


    ويجدر تذكّر أن سامبا كاتدرائية عاملة لا نصباً تذكارياً. يمكنك الدخول أثناء القداس، لكن التجول بالكاميرا
    في أثناء الصلاة غير مرحب به، وصباحات الأحد مزدحمة بالمصلين المحليين أكثر منها بالزوار.
  tip: >-
    قواعد اللباس مطبقة فعلياً. تحتاج النساء إلى غطاء رأس وتنورة تحت الركبة — وتوزَّع الأغطية مجاناً عند
    المدخل — ويحتاج الرجال إلى سراويل طويلة؛ ولن تدخل بسروال قصير. والتصوير في الداخل ممنوع في أحيان كثيرة،
    فأبقِ الهاتف بعيداً ما لم تر غيرك يستعمله. والصباح والمساء أفضل الأوقات؛ فالمصطبة بلا ظل عند الظهيرة.
    وساعة واحدة تكفي للكنيسة والحدائق. دورات المياه في الموقع، والمقاهي قرب محطة مترو أفلاباري.
  route: >-
    تقوم الكاتدرائية في أفلاباري على تل إيليا، على بعد عشر إلى خمس عشرة دقيقة من المركز. اتبع اللافتات
    من جسر ميتيخي أو من جسر باراتاشفيلي — فالمبنى مرئي من كل مكان تقريباً، ومن الصعب أن تضل الطريق. ويوجد
    موقف مجاني عند البوابة السفلى للمجمع، غير أنه يمتلئ سريعاً في الأعياد؛ والبديل هو الشوارع الجانبية
    حول ساحة أفلاباري. وطريق الوصول معبّد بالكامل بصعود لطيف، فأي فئة سيارة تفي بالغرض. وأقرب محطات الوقود
    المريحة تقع في شارع كيتيفان ديدوبالي.
