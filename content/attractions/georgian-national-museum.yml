ka:
  name: საქართველოს ეროვნული მუზეუმი
  short: >-
    ჯანაშიას მუზეუმი რუსთაველზე: დმანისის 1,8 მილიონი წლის თავის ქალები, კოლხური ოქრო და საბჭოთა ოკუპაციის
    მკაცრი დარბაზი.
  body: >-
    **ევრაზიის უძველესი ზუსტად დათარიღებული ადამიანური სახეები რუსთაველის გამზირზე, მანქანების ნაკადიდან
    ორიოდე ნაბიჯზე ინახება.**


    ისინი დმანისიდან, სამხრეთ საქართველოდან მოდიან, სადაც ადამიანები 1,85–1,77 მილიონი წლის წინ ცხოვრობდნენ:
    დაბალი, პატარატვინიანი, გრძელფეხება მოსიარულეები, რომელთა ზუსტი ადგილი ადამიანის საგვარეულო ხეზე დღემდე
    სადავოა. მათი თავის ქალები სიმონ ჯანაშიას სახელობის საქართველოს მუზეუმის — ეროვნული მუზეუმის მთავარი
    შენობის — უძვირფასეს ექსპონატებს შორისაა.


    მუზეუმი შენობაზე ხნიერია. ის 1852 წელს რუსეთის გეოგრაფიული საზოგადოების კავკასიის განყოფილების კოლექციიდან
    აღმოცენდა, 1865 წელს კი მკვლევარმა გუსტავ რადემ კავკასიის მუზეუმად აქცია. ახლანდელი შენობა ნიკოლაი
    სევეროვმა 1910 წელს დააპროექტა და შუა საუკუნეების ქართული ტაძრების ორნამენტით შეამკო. მისი საუკეთესო
    ამბავი ერთგულებაზეა: 1921 წელს, როცა თბილისი წითელმა არმიამ აიღო, მთავრობამ კოლექციის ბირთვი ევროპაში
    გაიტანა, 1945 წელს კი ემიგრანტი მეცნიერის, ექვთიმე თაყაიშვილის, ძალისხმევით განძი სამშობლოში დაბრუნდა.
    ორი წლის შემდეგ მუზეუმს ისტორიკოს სიმონ ჯანაშიას სახელი მიენიჭა.


    შემდეგ ოქროა. საგანძურში ძვ. წ. III ათასწლეულიდან მოყოლებული სამკაულებია — კოლხური და იბერიული ნახელავი,
    თხელი ოქროს ფურცლითა და მარცვლოვანი ტექნიკით ისეთი სინატიფით შესრულებული, რომ ოქროს საწმისის ძველი
    თქმულება აღარ ჰგავს სრულ გამონაგონს. მოძებნეთ ძვ. წ. V საუკუნის ახალგორის განძი, სადაც სპარსული და
    ადგილობრივი გემოვნება ერთსა და იმავე სამკაულში ხვდება ერთმანეთს.


    გარდა ამისა, აქაა დაახლოებით 80 000 მონეტა, IV–V საუკუნეების შუხუთის აბანოს მოზაიკა, ურარტული წარწერების
    ერთ-ერთი უმდიდრესი კოლექცია მსოფლიოში და საბჭოთა ოკუპაციის მუზეუმი, რომელიც 1921–1991 წლების სამოცდაათწლიან
    რეპრესიებს ხმამაღალი სიტყვების გარეშე მოგვითხრობს.


    მერე ისევ რუსთაველზე გამოდით — და გამზირი უცებ ძალიან ახალგაზრდა მოგეჩვენებათ.
  tip: >-
    ღიაა სამშაბათიდან კვირის ჩათვლით, 10:00-დან 18:00-მდე; ორშაბათობით და ოფიციალურ დღესასწაულებზე დაკეტილია,
    ბოლო ვიზიტორს 17:30-მდე უშვებენ. უცხოელი ზრდასრულის ბილეთი 40 ლარი ღირს, საქართველოს მოქალაქისა —
    20; იყიდეთ სალაროში ან ონლაინ, biletebi.ge-ზე. შესასვლელთანვე იკითხეთ, საგანძურს იმ დღეს ცალკე დრო
    ხომ არ სჭირდება, და პირველად იქ ჩადით, სანამ ჯგუფები მოვლენ. ორი საათი რეალური მინიმუმია, სამი — კომფორტული.
    დიდ ჩანთას გარდერობში ჩააბარებთ. ტუალეტი შენობაშია, კაფეები და ბანკომატები — გამზირზე.
  route: >-
    მუზეუმი რუსთაველის გამზირზე დგას, ცენტრის სასტუმროების უმეტესობიდან დაახლოებით 2 კილომეტრსა და ათ
    წუთში, თავისუფლების მოედნიდან ორასიოდე მეტრში. აქ მოსვლა მარტივია, გაჩერება — არა: გამზირზე დგომა
    უმეტესად აკრძალულია და ევაკუატორები არ ისვენებენ. ისარგებლეთ ჩიტაძის, ლერმონტოვის ან ინგოროყვას ქუჩის
    ფასიანი მიწისქვეშა ან ეზოს ავტოსადგომით. უკეთესია, მანქანა სასტუმროსთან დატოვოთ და მეტროთი „თავისუფლების
    მოედნის“ სადგურამდე ჩამოხვიდეთ — კარამდე სამი წუთის სავალია, პიკის საათში კი ნებისმიერ მანქანას გაასწრებთ.
    გზა მთლიანად ასფალტიანია, ნებისმიერი კლასის ავტომობილი გამოდგება.
en:
  name: Georgian National Museum
  short: >-
    The Janashia Museum on Rustaveli Avenue: 1.8-million-year-old Dmanisi skulls, Colchian gold and a
    sober hall on the Soviet occupation.
  body: >-
    **The oldest well-dated human faces in Eurasia are kept on Rustaveli Avenue, a few steps from the
    traffic.**


    They come from Dmanisi, in southern Georgia, where people lived between 1.85 and 1.77 million years
    ago: short, small-brained, long-legged walkers whose exact place in the human family is still argued
    over. Their skulls are among the most valuable things in the Simon Janashia Museum of Georgia, the
    flagship of the Georgian National Museum.


    The museum is older than the building. It grew from a collection begun in 1852 by the Caucasian department
    of the Russian Geographical Society, which the explorer Gustav Radde turned into the Caucasian Museum
    in 1865. The present hall, designed by Nikolay Severov in 1910, borrows its ornament from medieval
    Georgian churches. Its best story is one of loyalty: when the Red Army took Tbilisi in 1921, the government
    carried the core of the collection to Europe, and in 1945 it came home through the efforts of the
    émigré scholar Ekvtime Takaishvili. Two years later the museum took the name of the historian Simon
    Janashia.


    Then there is the gold. The Treasury holds jewellery from the third millennium BC onwards — Colchian
    and Iberian work in sheet gold and granulation so fine that it makes the old tale of the Golden Fleece
    feel less like fiction. Look for the Akhalgori hoard of the fifth century BC, where Persian and local
    taste meet in the same ornaments.


    Beyond it are some 80,000 coins, the Shukhuti bath mosaic of the fourth or fifth century, one of the
    world's richest collections of Urartian inscriptions, and the Museum of Soviet Occupation, which records
    seventy years of repression, from 1921 to 1991, without raising its voice.


    Walk back out into Rustaveli afterwards, and the avenue suddenly seems very young.
  tip: >-
    Open Tuesday to Sunday, 10:00 to 18:00; closed on Mondays and public holidays, with last entry at
    17:30. An adult ticket for foreign visitors costs 40 GEL (Georgian citizens pay 20); buy at the till
    or online at biletebi.ge. Ask at the desk whether the Treasury needs a separate slot that day, and
    go there first, before the groups. Two hours is a realistic minimum, three is comfortable. Large bags
    go to the cloakroom. There are toilets inside; cafés and ATMs line the avenue.
  route: >-
    The museum stands on Rustaveli Avenue, about 2 km and ten minutes from most central hotels and two
    hundred metres from Freedom Square. Driving here is easy; stopping is not: parking on the avenue itself
    is largely forbidden and tow trucks are busy. Use one of the paid underground or courtyard car parks
    on Chitadze, Lermontov or Ingorokva Street. Better still, leave the car at the hotel and take the
    metro to Freedom Square (Tavisuplebis Moedani) station, a three-minute walk from the door — in rush
    hour it beats any car. Asphalt all the way; any category will do.
ru:
  name: Грузинский национальный музей
  short: >-
    Музей Джанашия на проспекте Руставели: черепа из Дманиси возрастом 1,8 миллиона лет, золото Колхиды
    и сдержанный зал о советской оккупации.
  body: >-
    **Древнейшие надёжно датированные человеческие лица Евразии хранятся на проспекте Руставели, в нескольких
    шагах от потока машин.**


    Они из Дманиси, на юге Грузии, где люди жили между 1,85 и 1,77 миллиона лет назад: невысокие, с небольшим
    мозгом, длинноногие ходоки, чьё точное место в человеческой родословной до сих пор вызывает споры.
    Их черепа — одно из главных сокровищ Музея Грузии имени Симона Джанашия, флагмана Грузинского национального
    музея.


    Музей старше своего здания. Он вырос из коллекции, которую в 1852 году начал собирать Кавказский отдел
    Русского географического общества, а исследователь Густав Радде в 1865 году превратил её в Кавказский
    музей. Нынешнее здание, спроектированное Николаем Северовым в 1910 году, заимствует орнамент у средневековых
    грузинских храмов. Лучшая его история — о верности: когда в 1921 году Красная армия взяла Тбилиси,
    правительство вывезло ядро коллекции в Европу, и в 1945 году оно вернулось домой благодаря усилиям
    учёного-эмигранта Эквтиме Такаишвили. Двумя годами позже музею присвоили имя историка Симона Джанашия.


    А потом — золото. В Сокровищнице хранятся украшения начиная с III тысячелетия до н. э. — колхидская
    и иберийская работа из листового золота с зернью такой тонкости, что древнее сказание о золотом руне
    начинает казаться не таким уж вымыслом. Найдите Ахалгорский клад V века до н. э., где персидский и
    местный вкус встречаются в одних и тех же украшениях.


    Дальше — около 80 000 монет, мозаика бани из Шухути IV или V века, одно из богатейших в мире собраний
    урартских надписей и Музей советской оккупации, который рассказывает о семидесяти годах репрессий,
    с 1921 по 1991 год, не повышая голоса.


    Выйдите потом обратно на Руставели — и проспект вдруг покажется совсем молодым.
  tip: >-
    Открыт со вторника по воскресенье, с 10:00 до 18:00; выходной — понедельник и праздничные дни, последний
    вход в 17:30. Взрослый билет для иностранцев стоит 40 лари (граждане Грузии платят 20); купить его
    можно в кассе или онлайн на biletebi.ge. Спросите на входе, не нужен ли в этот день в Сокровищницу
    отдельный сеанс, и идите туда первым делом, пока не подошли группы. Два часа — реалистичный минимум,
    три — с комфортом. Крупные сумки сдают в гардероб. Туалеты внутри; кафе и банкоматы — вдоль проспекта.
  route: >-
    Музей стоит на проспекте Руставели, примерно в 2 км и десяти минутах от большинства центральных гостиниц
    и в двухстах метрах от площади Свободы. Доехать просто, остановиться — нет: на самом проспекте парковаться
    почти везде запрещено, а эвакуаторы не сидят без дела. Пользуйтесь платными подземными или дворовыми
    парковками на улицах Читадзе, Лермонтова или Ингороква. А лучше оставьте машину у гостиницы и доедьте
    на метро до станции «Площадь Свободы» — оттуда три минуты до дверей; в час пик метро обгонит любую
    машину. Асфальт на всём пути, подойдёт машина любого класса.
fa:
  name: موزهٔ ملی گرجستان
  short: >-
    موزهٔ جاناشیا در خیابان روستاولی: جمجمه‌های ۱٫۸ میلیون‌سالهٔ دمانیسی، طلای کلخید و تالاری آرام دربارهٔ
    اشغال شوروی.
  body: >-
    **کهن‌ترین چهره‌های انسانیِ اوراسیا که سنشان با اطمینان تعیین شده، در خیابان روستاولی نگه داشته می‌شوند،
    چند قدم آن‌سوتر از ترافیک.**


    این چهره‌ها از دمانیسی در جنوب گرجستان می‌آیند، جایی که انسان‌ها میان ۱٫۸۵ تا ۱٫۷۷ میلیون سال پیش
    می‌زیستند: کوتاه‌قد، با مغزی کوچک و پاهایی بلند برای راه‌رفتن، که جایگاه دقیقشان در خانوادهٔ انسان
    هنوز محل بحث است. جمجمه‌هایشان از گران‌بهاترین دارایی‌های موزهٔ گرجستان به نام سیمون جاناشیا است،
    گل سرسبد موزهٔ ملی گرجستان.


    موزه از ساختمانش قدیمی‌تر است. از مجموعه‌ای روییده که شعبهٔ قفقازِ انجمن جغرافیایی روسیه در ۱۸۵۲ گردآوری‌اش
    را آغاز کرد و گوستاو راده، کاوشگر، در ۱۸۶۵ آن را به موزهٔ قفقاز بدل کرد. ساختمان کنونی که نیکلای سوروف
    در ۱۹۱۰ طراحی کرد، نقش‌ونگارش را از کلیساهای قرون وسطایی گرجستان وام گرفته است. بهترین داستانش داستان
    وفاداری است: وقتی ارتش سرخ در ۱۹۲۱ تفلیس را گرفت، دولت هستهٔ مجموعه را به اروپا برد، و در ۱۹۴۵ به
    همت اکوتیمه تاکایشویلی، دانشمند مهاجر، به خانه بازگشت. دو سال بعد موزه نام سیمون جاناشیای تاریخ‌نگار
    را گرفت.


    و بعد، طلا. خزانه جواهراتی از هزارهٔ سوم پیش از میلاد به این سو را در خود دارد: کار کلخیدی و ایبریایی
    از ورقهٔ طلا با دانه‌کاری‌ای چنان ظریف که افسانهٔ کهن پشم زرین را کمتر افسانه جلوه می‌دهد. سراغ گنجینهٔ
    آخالگوری از سدهٔ پنجم پیش از میلاد بروید، جایی که ذوق ایرانی و ذوق محلی در همان زیورها به هم می‌رسند.


    فراتر از آن، حدود ۸۰,۰۰۰ سکه است، موزاییک گرمابهٔ شوخوتی از سدهٔ چهارم یا پنجم، یکی از غنی‌ترین مجموعه‌های
    کتیبه‌های اورارتویی در جهان، و موزهٔ اشغال شوروی که هفتاد سال سرکوب، از ۱۹۲۱ تا ۱۹۹۱، را بی‌آنکه صدایش
    را بالا ببرد روایت می‌کند.


    پس از آن به روستاولی برگردید؛ خیابان ناگهان بسیار جوان به نظر می‌رسد.
  tip: >-
    از سه‌شنبه تا یکشنبه، ساعت ۱۰:۰۰ تا ۱۸:۰۰ باز است؛ دوشنبه‌ها و روزهای تعطیل رسمی بسته است و آخرین
    ورود ساعت ۱۷:۳۰. بلیت بزرگسال برای بازدیدکنندگان خارجی ۴۰ لاری است (شهروندان گرجستان ۲۰ لاری می‌پردازند)؛
    از باجه یا به‌صورت آنلاین در biletebi.ge بخرید. در پیشخوان بپرسید که آیا خزانه در آن روز نوبت جداگانه
    لازم دارد، و پیش از رسیدن گروه‌ها اول به آنجا بروید. دو ساعت حداقلِ واقع‌بینانه است و سه ساعت راحت.
    کیف‌های بزرگ را باید به رختکن سپرد. سرویس بهداشتی داخل موزه است؛ کافه‌ها و خودپردازها در طول خیابان
    صف کشیده‌اند.
  route: >-
    موزه در خیابان روستاولی است، حدود ۲ کیلومتر و ده دقیقه از بیشتر هتل‌های مرکز شهر و دویست متر از میدان
    آزادی. رسیدن آسان است، ایستادن نه: پارک در خود خیابان تقریباً همه‌جا ممنوع است و یدک‌کش‌ها بیکار نمی‌نشینند.
    از پارکینگ‌های پولیِ زیرزمینی یا حیاط‌دار در خیابان‌های چیتادزه، لرمانتوف یا اینگوروکوا استفاده کنید.
    بهتر از آن: ماشین را در هتل بگذارید و با مترو تا ایستگاه میدان آزادی بیایید که سه دقیقه پیاده تا در
    موزه فاصله دارد؛ در ساعت شلوغی از هر ماشینی جلو می‌زند. تمام مسیر آسفالت است و هر رده خودرویی کافی
    است.
he:
  name: המוזיאון הלאומי של גאורגיה
  short: >-
    מוזיאון ג'נשיה בשדרות רוסתוולי: גולגולות דמניסי בנות 1.8 מיליון שנה, זהב קולכיס ואולם מאופק על הכיבוש
    הסובייטי.
  body: >-
    **פני האדם העתיקים ביותר באירואסיה שגילם תוארך בוודאות שמורים בשדרות רוסתוולי, כמה צעדים מהתנועה.**


    מקורם בדמניסי שבדרום גאורגיה, שם חיו בני אדם לפני 1.85 עד 1.77 מיליון שנה: נמוכי קומה, בעלי מוח קטן
    ורגליים ארוכות להליכה, שמקומם המדויק במשפחת האדם עדיין שנוי במחלוקת. הגולגולות שלהם הן מן הנכסים היקרים
    ביותר של מוזיאון גאורגיה על שם שמעון ג'נשיה, ספינת הדגל של המוזיאון הלאומי של גאורגיה.


    המוזיאון ותיק מהבניין שלו. הוא צמח מאוסף שהחלה לקבץ ב-1852 המחלקה הקווקזית של החברה הגאוגרפית הרוסית,
    ושהחוקר גוסטב ראדה הפך ב-1865 למוזיאון הקווקזי. הבניין הנוכחי, שתכנן ניקולאי סברוב ב-1910, שואל את
    עיטוריו מכנסיות גאורגיות מימי הביניים. הסיפור הטוב ביותר שלו הוא סיפור של נאמנות: כשהצבא האדום כבש
    את טביליסי ב-1921, הממשלה הבריחה את לב האוסף לאירופה, וב-1945 הוא שב הביתה בזכות מאמציו של החוקר הגולה
    אקווטימה טקאישווילי. שנתיים אחר כך קיבל המוזיאון את שמו של ההיסטוריון שמעון ג'נשיה.


    ואחר כך — הזהב. אולם האוצר מחזיק תכשיטים מן האלף השלישי לפני הספירה ואילך: עבודה קולכית ואיברית בזהב
    מרוקע ובגרנולציה — עיטור בגרגרי זהב זעירים — עדינה כל כך, שהאגדה העתיקה על גיזת הזהב נראית פחות בדיה.
    חפשו את מטמון אחלגורי מן המאה ה-5 לפני הספירה, שבו הטעם הפרסי והטעם המקומי נפגשים באותם תכשיטים עצמם.


    מעבר לו יש כ-80,000 מטבעות, פסיפס בית המרחץ משוחוטי מן המאה ה-4 או ה-5, אחד האוספים העשירים בעולם
    של כתובות אורארטיות, והמוזיאון לכיבוש הסובייטי, שמתעד שבעים שנות דיכוי, מ-1921 עד 1991, בלי להרים
    את הקול.


    צאו אחר כך בחזרה לרוסתוולי, והשדרה תיראה פתאום צעירה מאוד.
  tip: >-
    פתוח בימים שלישי עד ראשון, 10:00 עד 18:00; סגור בימי שני ובחגים רשמיים, כניסה אחרונה ב-17:30. כרטיס
    מבוגר למבקרים זרים עולה 40 לארי (אזרחי גאורגיה משלמים 20); קונים בקופה או באינטרנט ב-biletebi.ge.
    שאלו בדלפק אם לאולם האוצר נדרש באותו יום מועד כניסה נפרד, ולכו אליו ראשון, לפני הקבוצות. שעתיים הן
    מינימום מציאותי, שלוש — בנחת. תיקים גדולים מפקידים במלתחה. יש שירותים בפנים; בתי קפה וכספומטים לאורך
    השדרה.
  route: >-
    המוזיאון עומד בשדרות רוסתוולי, כ-2 ק"מ ועשר דקות מרוב המלונות שבמרכז ומאתיים מטר מכיכר החירות. להגיע
    קל, לעצור — לא: החניה בשדרה עצמה אסורה כמעט לכל אורכה, וגררי העירייה לא נחים. השתמשו באחד החניונים
    בתשלום, התת-קרקעיים או שבחצרות, ברחובות צ'יטדזה, לרמונטוב או אינגורוקווה. עדיף עוד יותר להשאיר את
    הרכב במלון ולנסוע במטרו לתחנת כיכר החירות, שלוש דקות הליכה מהדלת — בשעת העומס הוא עוקף כל מכונית.
    אספלט לכל אורך הדרך; כל רכב מתאים.
ar:
  name: المتحف الوطني الجورجي
  short: >-
    متحف جاناشيا في جادة روستافيلي: جماجم دمانيسي البالغ عمرها 1.8 مليون سنة، وذهب كولخيس، وقاعة رصينة
    عن الاحتلال السوفييتي.
  body: >-
    **أقدم وجوه بشرية مؤرَّخة بدقة في أوراسيا محفوظة في جادة روستافيلي، على بعد خطوات من زحام السيارات.**


    مصدرها دمانيسي في جنوب جورجيا، حيث عاش بشر قبل ما بين 1.85 و1.77 مليون سنة: قصار القامة، صغار الأدمغة،
    طوال السيقان، مشّاؤون لا يزال موقعهم الدقيق في شجرة العائلة البشرية موضع جدل. وجماجمهم من أثمن ما
    يملكه متحف جورجيا الذي يحمل اسم سيمون جاناشيا، درّة المتحف الوطني الجورجي.


    المتحف أقدم من مبناه. فقد نشأ من مجموعة بدأ جمعها عام 1852 الفرعُ القوقازي للجمعية الجغرافية الروسية،
    وحوّلها المستكشف غوستاف راده عام 1865 إلى المتحف القوقازي. أما المبنى الحالي، الذي صممه نيكولاي سيفيروف
    عام 1910، فيستعير زخارفه من الكنائس الجورجية في العصور الوسطى. وأجمل حكاياته حكاية وفاء: حين استولى
    الجيش الأحمر على تبليسي عام 1921، حملت الحكومة نواة المجموعة إلى أوروبا، وفي عام 1945 عادت إلى الوطن
    بفضل جهود العالم المهاجر إكفتيمي تاكايشفيلي. وبعد عامين حمل المتحف اسم المؤرخ سيمون جاناشيا.


    ثم يأتي الذهب. تضم الخزانة حُليّاً من الألفية الثالثة قبل الميلاد فما بعد، صنعة كولخية وإيبيرية من
    صفائح الذهب والتحبيب بلغت من الدقة حداً يجعل أسطورة الجزة الذهبية القديمة تبدو أقل خيالاً. ابحث عن
    كنز أخالغوري من القرن الخامس قبل الميلاد، حيث يلتقي الذوق الفارسي والذوق المحلي في الحُليّ نفسها.


    وبعدها نحو 80,000 قطعة نقدية، وفسيفساء حمّام شوخوتي من القرن الرابع أو الخامس، وإحدى أغنى مجموعات
    النقوش الأورارتية في العالم، ومتحف الاحتلال السوفييتي الذي يوثّق سبعين عاماً من القمع، من 1921 إلى
    1991، دون أن يرفع صوته.


    اخرج بعد ذلك إلى روستافيلي، وستبدو لك الجادة فجأة فتيّة جداً.
  tip: >-
    يفتح من الثلاثاء إلى الأحد، من 10:00 إلى 18:00؛ ويغلق أيام الاثنين والعطل الرسمية، وآخر دخول عند 17:30.
    تذكرة البالغ للزوار الأجانب 40 لاري (يدفع المواطنون الجورجيون 20)؛ اشترها من الشباك أو عبر الإنترنت
    على biletebi.ge. اسأل عند المكتب إن كانت الخزانة تتطلب موعداً منفصلاً في ذلك اليوم، واذهب إليها أولاً
    قبل المجموعات. ساعتان حدّ أدنى واقعي، وثلاث ساعات براحة. تُسلَّم الحقائب الكبيرة إلى غرفة الأمانات.
    دورات المياه في الداخل، والمقاهي وأجهزة الصراف على امتداد الجادة.
  route: >-
    يقع المتحف في جادة روستافيلي، على بعد نحو 2 كم وعشر دقائق من معظم فنادق الوسط، ومئتي متر من ساحة الحرية.
    الوصول سهل، والتوقف ليس كذلك: فالوقوف في الجادة نفسها ممنوع في معظمها، وشاحنات السحب لا تهدأ. استخدم
    أحد المرائب المدفوعة تحت الأرض أو في الأفنية في شوارع تشيتادزه أو ليرمونتوف أو إنغوروكفا. والأفضل
    أن تترك السيارة في الفندق وتركب المترو إلى محطة ساحة الحرية، على بعد ثلاث دقائق سيراً من الباب — ففي
    ساعة الذروة يسبق أي سيارة. الطريق مسفلت كله، وتفي أي سيارة بالغرض.
