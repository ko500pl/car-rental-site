ka:
  name: საქართველოს ეროვნული მუზეუმი
  short: რუსთაველზე მდებარე მთავარი მუზეუმი — კოლხური ოქრო, დმანისის ჰომინიდები და საბჭოთა ოკუპაციის დარბაზი.
  body: >-
    **ერთი შენობა, რომელშიც საქართველოს მთელი ისტორია ეტევა.** სიმონ ჯანაშიას სახელობის მუზეუმი რუსთაველის
    გამზირზე ეროვნული მუზეუმის ქსელის მთავარი ფილიალია და თუ ქვეყანაზე მხოლოდ ერთი მუზეუმის ნახვის დრო
    გაქვს, ეს სწორედ ის არის.


    ორი კოლექცია ნამდვილად უნიკალურია. პირველი — **საგანძურის დარბაზი** მიწისქვეშა სართულზე: ძვ. წ. III
    ათასწლეულიდან მოყოლებული ოქროს სამკაულები, კოლხური და იბერიული ნაკეთობები, თხელი ფურცლის დამუშავების
    ისეთი დონით, რომ თანამედროვე ოსტატებიც ვერ იმეორებენ. სწორედ ეს ნივთები დგას არგონავტების და ოქროს
    საწმისის მითის უკან.


    მეორე — **დმანისის კოლექცია**: 1.8 მილიონი წლის ჰომინიდების თავის ქალები, აფრიკის გარეთ აღმოჩენილი
    უძველესი ადამიანის ნაშთები. ეს არა მხოლოდ ქართული, არამედ მსოფლიო მასშტაბის აღმოჩენაა და მუზეუმი მას
    სათანადოდ წარმოაჩენს.


    დანარჩენი ექსპოზიცია:


    - საბჭოთა ოკუპაციის მუზეუმი — 1921–1991 წლების რეპრესიების დოკუმენტური დარბაზი

    - არქეოლოგიური სართული ბრინჯაოს ხანიდან შუა საუკუნეებამდე

    - ეთნოგრაფიული და ნუმიზმატიკური ფონდები

    - დროებითი გამოფენები, ხშირად თანამედროვე ხელოვნების


    ტექსტები ქართულად და ინგლისურად არის; რუსული ეტიკეტები ყველგან არ არის, ამიტომ აუდიოგიდი ან ცოცხალი
    გიდი ღირს.
  tip: >-
    საგანძურის დარბაზში შესვლა ხშირად ცალკე ბილეთით ან ცალკე დროის სლოტით ხდება — შესასვლელთანვე იკითხე
    და პირველ რიგში იქ ჩადი, სანამ ჯგუფები მოვლენ. ორი საათი რეალური მინიმუმია, სამი კომფორტული. ჩანთის
    დატოვება გარდერობში სავალდებულოა. მუზეუმი ცენტრშია, ამიტომ დაგეგმე მასთან ერთად რუსთაველზე სეირნობა;
    კაფე და ტუალეტი შენობაშივეა, ბანკომატები — გამზირზე.
  route: >-
    მუზეუმი რუსთაველის გამზირზეა, პარლამენტის მოპირდაპირედ, თავისუფლების მოედნიდან ხუთი წუთის სავალზე.
    მანქანით მისვლა მარტივია, პარკინგი — არა: გამზირზე გაჩერება ხშირად აკრძალულია და ევაკუატორი მუშაობს.
    ყველაზე გონივრული გამოსავალია მიწისქვეშა ან ეზოს პარკინგი ჩიტაძის, ლერმონტოვის ან ინგოროყვას ქუჩაზე,
    სადაც საათობრივი გადასახადია. ალტერნატივა — მანქანა სასტუმროსთან დატოვო და მეტროთი „რუსთაველის" სადგურამდე
    ჩამოხვიდე, რაც პიკის საათებში ნამდვილად სწრაფია. გზა ასფალტია, ნებისმიერი ავტომობილი გამოდგება.
en:
  name: Georgian National Museum
  short: The flagship museum on Rustaveli Avenue — Colchian gold, the Dmanisi hominids and the Soviet
    Occupation hall.
  body: >-
    **One building that holds the whole of Georgian history.** The Simon Janashia Museum on Rustaveli
    Avenue is the main branch of the National Museum network, and if you only have time for one museum
    in the country, this is the one to choose.


    Two collections here are genuinely world class. The first is the **Treasury** in the basement: gold
    jewellery from the third millennium BC onwards, Colchian and Iberian work in sheet gold and granulation
    so fine that modern goldsmiths struggle to reproduce it. These are the objects that sit behind the
    myth of the Argonauts and the Golden Fleece, and seeing them makes the legend feel a good deal less
    like fiction.


    The second is the **Dmanisi collection**: hominid skulls roughly 1.8 million years old, the earliest
    human remains found outside Africa. This is a discovery of global significance, and the museum presents
    it properly rather than as a footnote.


    The rest of the permanent display covers:


    - The Museum of Soviet Occupation, documenting repression between 1921 and 1991

    - An archaeology floor running from the Bronze Age to the Middle Ages

    - Ethnographic and numismatic collections

    - Temporary exhibitions, often contemporary art


    Labels are in Georgian and English. Russian captions are patchy, so an audio guide or a live guide
    is worth the extra cost if you want more than the objects themselves.
  tip: >-
    The Treasury often needs a separate ticket or a timed slot — ask at the desk on arrival and go down
    there first, before the tour groups. Two hours is a realistic minimum and three is comfortable. Large
    bags must be left in the cloakroom. Since the museum is right in the centre, pair it with a walk along
    Rustaveli. There is a café and toilets inside the building and plenty of ATMs on the avenue.
  route: >-
    The museum stands on Rustaveli Avenue opposite parliament, five minutes' walk from Freedom Square.
    Driving here is easy; parking is not. Stopping on the avenue itself is usually prohibited and tow
    trucks are active. The sensible answer is one of the paid underground or courtyard car parks on Chitadze,
    Lermontov or Ingorokva street. The alternative is to leave the car at your hotel and take the metro
    to Rustaveli station, which during rush hour is genuinely faster. Everything is asphalt, so any car
    category is fine.
ru:
  name: Национальный музей Грузии
  short: Главный музей на проспекте Руставели — колхидское золото, гоминиды Дманиси и зал советской оккупации.
  body: >-
    **Одно здание, в которое помещается вся история Грузии.** Музей имени Симона Джанашия на проспекте
    Руставели — центральный филиал сети Национального музея, и если время есть только на один музей в
    стране, стоит выбрать именно этот.


    Две коллекции здесь мирового уровня. Первая — **Золотой фонд** в подвальном этаже: украшения начиная
    с третьего тысячелетия до нашей эры, колхидские и иберийские изделия из тончайшего листового золота
    с зернью такой работы, что современные ювелиры повторить её не берутся. Именно эти предметы стоят
    за мифом об аргонавтах и золотом руне, и после зала легенда выглядит куда менее выдуманной.


    Вторая — **коллекция Дманиси**: черепа гоминидов возрастом около 1,8 миллиона лет, древнейшие останки
    человека, найденные за пределами Африки. Это открытие глобального значения, и музей подаёт его всерьёз,
    а не мимоходом.


    Остальная постоянная экспозиция:


    - Музей советской оккупации с документами о репрессиях 1921–1991 годов

    - Археологический этаж от бронзового века до Средневековья

    - Этнографические и нумизматические фонды

    - Временные выставки, часто современного искусства


    Подписи на грузинском и английском, русских этикеток мало, поэтому аудиогид или живой гид оправдывают
    свою цену.
  tip: >-
    В Золотой фонд часто нужен отдельный билет или сеанс по времени — спросите на кассе сразу и спускайтесь
    туда первым делом, пока не подошли группы. Два часа — реальный минимум, три — комфортно. Крупные сумки
    сдают в гардероб. Музей в самом центре, так что логично совместить его с прогулкой по Руставели. Кафе
    и туалеты есть внутри, банкоматов на проспекте достаточно.
  route: >-
    Музей стоит на проспекте Руставели напротив парламента, в пяти минутах пешком от площади Свободы.
    Доехать легко, припарковаться — нет: остановка на самом проспекте обычно запрещена, эвакуаторы работают.
    Разумное решение — платный подземный или дворовый паркинг на улицах Читадзе, Лермонтова или Ингороква.
    Альтернатива — оставить машину у отеля и приехать на метро до станции «Руставели», в час пик это действительно
    быстрее. Покрытие асфальтовое, подойдёт автомобиль любого класса.
fa:
  name: موزهٔ ملی گرجستان
  short: موزهٔ اصلی خیابان روستاولی — طلای کلخیس، انسان‌تباران دمانیسی و تالار اشغال شوروی.
  body: >-
    **یک ساختمان که تمام تاریخ گرجستان را در خود دارد.** موزهٔ سیمون جاناشیا در خیابان روستاولی شعبهٔ
    اصلی شبکهٔ موزهٔ ملی است، و اگر فقط برای یک موزه در این کشور وقت دارید، همین است.


    دو مجموعه اینجا به‌راستی در تراز جهانی‌اند. نخست **گنجینه** در طبقهٔ زیرین: زیورهای طلا از هزارهٔ
    سوم پیش از میلاد به این سو، کار کلخی و ایبری در ورق‌طلا و دانه‌کاری‌ای چنان ظریف که زرگران امروزی
    به‌سختی می‌توانند بازسازی‌اش کنند. این‌ها همان اشیایی‌اند که پشت اسطورهٔ آرگونوت‌ها و پشم زرین ایستاده‌اند،
    و دیدن‌شان افسانه را بسیار کمتر افسانه‌ای جلوه می‌دهد. دوم **مجموعهٔ دمانیسی**: جمجمه‌های انسان‌تباران
    با قدمت تقریبی 1.8 میلیون سال، کهن‌ترین بقایای انسانی یافت‌شده بیرون از آفریقا؛ کشفی با اهمیت جهانی
    که موزه آن را چنان که باید عرضه می‌کند، نه در حاشیه.


    بقیهٔ نمایش دائمی شامل موزهٔ اشغال شوروی است که سرکوب میان 1921 و 1991 را مستند می‌کند، طبقهٔ باستان‌شناسی
    از عصر برنز تا سده‌های میانه، مجموعه‌های مردم‌شناسی و سکه‌شناسی، و نمایشگاه‌های موقت که اغلب هنر معاصرند.
    برچسب‌ها به گرجی و انگلیسی‌اند. توضیح‌های روسی ناقص‌اند، پس اگر بیش از خود اشیا می‌خواهید، راهنمای
    صوتی یا راهنمای زنده ارزش هزینهٔ اضافی را دارد.
  tip: >-
    گنجینه اغلب بلیت جداگانه یا نوبت زمانی می‌خواهد — موقع ورود از باجه بپرسید و اول از همه به آن طبقه
    بروید، پیش از گروه‌های تور. دو ساعت حداقلی واقع‌بینانه است و سه ساعت راحت. کیف‌های بزرگ باید در رختکن
    بماند. چون موزه درست در مرکز است، آن را با قدم زدن در روستاولی جفت کنید. داخل ساختمان کافه و سرویس
    بهداشتی هست و در خیابان خودپرداز فراوان.
  route: >-
    موزه در خیابان روستاولی روبه‌روی پارلمان است، پنج دقیقه پیاده از میدان آزادی. رانندگی تا اینجا آسان
    است؛ پارک کردن نه. توقف روی خود خیابان معمولاً ممنوع است و جرثقیل‌ها فعال‌اند. پاسخ معقول یکی از پارکینگ‌های
    پولی زیرزمینی یا حیاطی در خیابان‌های چیتادزه، لرمانتوف یا اینگوروکواست. راه دیگر این است که خودرو
    را در هتل بگذارید و با مترو به ایستگاه روستاولی بیایید، که در ساعت اوج واقعاً سریع‌تر است. همه‌جا
    آسفالت است، پس هر ردهٔ خودرویی مناسب است.
he:
  name: המוזיאון הלאומי הגאורגי
  short: מוזיאון הדגל ברחוב רוסתאוולי — זהב קולכיס, ההומינידים מדמניסי ואולם הכיבוש הסובייטי.
  body: >-
    **בניין אחד שמכיל את כל ההיסטוריה הגאורגית.** מוזיאון סימון ג'נאשיה ברחוב רוסתאוולי הוא הסניף הראשי
    של רשת המוזיאון הלאומי, ואם יש לכם זמן למוזיאון אחד בלבד בארץ הזאת, זה המוזיאון שכדאי לבחור.


    שני אוספים כאן הם ברמה עולמית של ממש. הראשון הוא **אוצר הזהב** שבמרתף: תכשיטי זהב מן האלף השלישי לפני
    הספירה ואילך, עבודה קולכית ואיברית ביריעות זהב ובגרנולציה עדינה עד כדי כך שצורפים בני זמננו מתקשים
    לשחזר אותה. אלה הפריטים שעומדים מאחורי מיתוס הארגונאוטים וגיזת הזהב, וכשרואים אותם האגדה נראית הרבה
    פחות בדיונית. השני הוא **אוסף דמניסי**: גולגולות הומינידים בנות כ-1.8 מיליון שנה, השרידים האנושיים
    הקדומים ביותר שנמצאו מחוץ לאפריקה — תגלית בעלת חשיבות עולמית שהמוזיאון מציג כראוי ולא כהערת שוליים.


    שאר התצוגה הקבועה כוללת את מוזיאון הכיבוש הסובייטי, המתעד את הדיכוי בין 1921 ל-1991; קומת ארכיאולוגיה
    מתקופת הברונזה ועד ימי הביניים; אוספים אתנוגרפיים ונומיסמטיים; ותערוכות מתחלפות, לא פעם של אמנות עכשווית.
    השילוט הוא בגאורגית ובאנגלית. הכיתובים ברוסית חלקיים, ולכן מדריך שמע או מדריך חי שווים את התוספת אם
    רוצים יותר מהחפצים עצמם.
  tip: >-
    אוצר הזהב דורש לעיתים קרובות כרטיס נפרד או חלון זמן קבוע — שאלו בדלפק עם ההגעה ורדו לשם ראשונים, לפני
    קבוצות התיירים. שעתיים הן מינימום מציאותי ושלוש נוחות. תיקים גדולים חייבים להישאר במלתחה. מכיוון שהמוזיאון
    ממש במרכז, שלבו אותו עם הליכה לאורך רוסתאוולי. בתוך הבניין יש בית קפה ושירותים, ובשדרה כספומטים למכביר.
  route: >-
    המוזיאון ניצב ברחוב רוסתאוולי מול הפרלמנט, חמש דקות הליכה מכיכר החירות. הנסיעה לכאן קלה; החניה לא.
    העצירה בשדרה עצמה אסורה בדרך כלל וגוררים פועלים שם. הפתרון ההגיוני הוא אחד מחניוני התשלום התת-קרקעיים
    או חצרות החניה ברחובות צ'יטדזה, לרמונטוב או אינגורוקווה. החלופה היא להשאיר את הרכב במלון ולנסוע ברכבת
    התחתית לתחנת רוסתאוולי, שבשעות העומס היא באמת מהירה יותר. הכול אספלט, ולכן כל קטגוריית רכב מתאימה.
ar:
  name: المتحف الوطني الجورجي
  short: المتحف الأبرز في شارع روستافيلي — ذهب كولخيس وبشرانيو دمانيسي وقاعة الاحتلال السوفييتي.
  body: >-
    **مبنى واحد يضم تاريخ جورجيا كله.** متحف سيمون جاناشيا في شارع روستافيلي هو الفرع الرئيسي لشبكة المتحف
    الوطني، وإن لم يكن لديك وقت إلا لمتحف واحد في البلاد فهذا هو الذي تختاره.


    وثمة مجموعتان هنا في مصاف عالمي حقيقي. الأولى **الخزانة** في الطابق السفلي: حلي ذهبية من الألف الثالث
    قبل الميلاد فصاعداً، وأعمال كولخية وإيبيرية في صفائح الذهب والتحبيب من الدقة بحيث يعجز صاغة اليوم
    عن محاكاتها. وهذه هي القطع القائمة خلف أسطورة الأرغونوت والجزة الذهبية، ورؤيتها تجعل الأسطورة أقل
    خيالاً بكثير. والثانية **مجموعة دمانيسي**: جماجم بشرانية عمرها نحو 1.8 مليون سنة، وهي أقدم بقايا بشرية
    عُثر عليها خارج أفريقيا — اكتشاف ذو أهمية عالمية يعرضه المتحف كما ينبغي لا كهامش.


    أما بقية العرض الدائم فتشمل متحف الاحتلال السوفييتي الذي يوثق القمع بين 1921 و1991؛ وطابق آثار يمتد
    من العصر البرونزي إلى العصور الوسطى؛ ومجموعات إثنوغرافية ونقدية؛ ومعارض مؤقتة كثيراً ما تكون للفن
    المعاصر. والشروح بالجورجية والإنجليزية. أما التعليقات بالروسية فمتفاوتة، لذا يستحق دليل صوتي أو مرشد
    حي كلفته الإضافية إن أردت أكثر من القطع نفسها.
  tip: >-
    غالباً ما تتطلب الخزانة تذكرة منفصلة أو موعداً محدداً — اسأل عند المكتب فور وصولك وانزل إليها أولاً
    قبل المجموعات السياحية. وساعتان حد أدنى واقعي وثلاث ساعات مريحة. ويجب ترك الحقائب الكبيرة في المشلح.
    وبما أن المتحف في قلب المركز، اجمعه مع نزهة على طول روستافيلي. وفي المبنى مقهى ودورات مياه، وعلى الشارع
    أجهزة صراف كثيرة.
  route: >-
    يقف المتحف في شارع روستافيلي مقابل البرلمان، على بعد خمس دقائق سيراً من ميدان الحرية. القيادة إلى
    هنا سهلة؛ أما الوقوف فلا. والتوقف في الشارع نفسه ممنوع عادة وشاحنات السحب نشطة. والحل المعقول أحد
    المواقف المدفوعة تحت الأرض أو في الأفنية في شوارع تشيتادزه أو ليرمونتوف أو إنغوروكفا. والبديل أن تترك
    السيارة في فندقك وتأخذ المترو إلى محطة روستافيلي، وهو في ساعة الذروة أسرع فعلاً. وكل شيء إسفلت، فأي
    فئة سيارة تفي بالغرض.
