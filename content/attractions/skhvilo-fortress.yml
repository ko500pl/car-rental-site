ka:
  name: სხვილოს ციხე
  short: >-
    ამილახვრების XIV საუკუნის ციხე ლეხურის ხეობის თავზე, მაღალ ქედზე, რომლის ერთადერთი კარი მიწიდან ორ
    მეტრზე იყო დატანებული.
  body: >-
    **სხვილოს ციხე ალყისთვის მზადმყოფმა ხალხმა ააგო: მისი ერთადერთი კარი მიწიდან ორ მეტრზე იყო დატანებული
    და მასთან ხის კიბით ადიოდნენ, მთავარი კოშკის კარი კი ექვსი მეტრის სიმაღლეზეა.**


    ციხე მაღალ ქედზე გაწოლილა და ლეხურის ხეობასა და ტირიფონის გაშლილ ვაკეს დაჰყურებს. დღევანდელი კედლები
    XIV საუკუნისაა, თუმცა ციხე აქ, როგორც ჩანს, უფრო ადრეც იდგა: XI საუკუნის „მატიანე ქართლისაი“ უკვე
    იხსენიებს X საუკუნის ორ დიდებულს — დაჩი სხვილოსელსა და ივანე სხვილოსელს.


    სხვილოს ისტორია ერთი საგვარეულოს ისტორიაა. XIV საუკუნეში ზევდგინიძეებმა, შემდგომში ამილახვრებად ცნობილებმა,
    სხვილოს მამული მიიღეს და რეზიდენციაც აქ გამართეს. XVI–XVII საუკუნეებში ისინი ხეობაში, ქვემო ჭალაში
    ჩავიდნენ, სხვილო კი მხოლოდ ციხესიმაგრედ დარჩა. XVII საუკუნის 30-იან წლებში მეფე როსტომი თავს დაესხა
    აქ გამაგრებულ იოთამ ამილახვარს და დაამარცხა; 40-იან წლებში კი ციხე ქართლის გამგებლის, გივი ამილახვრის,
    ერთ-ერთი საყრდენი იყო ირანის აგრესიის წინააღმდეგ ბრძოლაში. XVIII საუკუნის ბოლომდე სხვილო ამილახვრებს
    ეკუთვნოდა.


    გეგმით ციხე წაგრძელებული ოთხკუთხედია. კედლები 11–14 მეტრზე ადის, სისქით კი ორ მეტრს აღწევს; თავზე
    მებრძოლთა სავალი ბილიკი გასდევს სათოფურებითა და სალოდეებით, ყველაფერს ქონგურები აგვირგვინებს. ციხის
    თავსა და ბოლოში თითო კოშკი დგას, ორივე, როგორც ჩანს, ხუთსართულიანი; მთავარი ჩრდილოეთისაა, მეხუთე სართულზე
    ეზოს საყურებელი დიდი აივნით. შიგნით თავიდან მცირე ეკლესია იდგა; როცა ციხეში მცხოვრებნი გამრავლდნენ
    და ადგილი აღარ ეყოთ, მას თავზე მეორე ეკლესია დააშენეს. დასავლეთით, კედელთან, დიდი წყალსაცავია, ირგვლივ
    კი საცხოვრებელი და სამეურნეო ნაგებობების ნაშთები.


    ქართულმა კინომ აქ „შერეკილების“ ერთი სცენა გადაიღო. სავალი ბილიკიდან პირდაპირ ქვემო ჭალას დაჰყურებთ,
    სადაც საგვარეულო საბოლოოდ დასახლდა, და ხვდებით, რატომ შემოინახეს ეს ქედი შავი დღისთვის.
  tip: >-
    ეს გასეირნებაა და არა გზისპირა გაჩერება: ქვემო ჭალიდან ბილიკი ქედს უსწორმასწორო, უჩრდილო ფერდობით
    ადის — ორივე მიმართულებით დაახლოებით ორი საათი გაითვალისწინეთ, პლუს დრო თავად ციხეში. წყალი, კაფე
    ან საპირფარეშო აქ არ არის, ამიტომ წყალი და კარგი ფეხსაცმელი აუცილებელია; ზაფხულში ადრე დილით წადით,
    ტალახსა და თოვლში კი ნუ აძვრებით. 2020 წელს დაწყებული სარეაბილიტაციო სამუშაოების გამო ზოგი მონაკვეთი
    შეიძლება ჯერაც შემოღობილი იყოს. კედლებსა და ჩამონგრეულ კიდეებზე ფრთხილად იარეთ. შესვლა უფასოა. ქვემოთ,
    სოფელში, ამილახვართა ციხე-დარბაზებიც ნახეთ — საგვარეულოს გვიანდელი სახლი — და ერთ ხეობაში ნახევარი
    დღე გაატარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთისკენ გაჰყევით. ქალაქის ცენტრიდან დაახლოებით 55 კილომეტრში,
    კასპის მუნიციპალიტეტში, მარჯვნივ ადგილობრივ შ133 გზაზე გადაუხვიეთ, რომელიც ჩრდილოეთით, ლეხურის ხეობას
    აუყვება ქვემო ჭალამდე. სოფლის განაპირამდე დაახლოებით 65 კმ და 1 საათი და 15 წუთია; ასფალტის შემდეგ
    ბოლო მონაკვეთი უსწორმასწორო გრუნტის გზაა, თავად ციხემდე კი მხოლოდ ფეხით ახვალთ. მაღალი გამავლობის
    მანქანა (კროსოვერი ან ჯიპი) ამ გზას უკეთ უმკლავდება და უფრო ახლოს მიგიყვანთ; დაბალი მანქანა სოფელში
    დატოვეთ და ფეხით განაგრძეთ. საწვავი გადახვევამდე, ს1-ზე ჩაასხით.
en:
  name: Skhvilo Fortress
  short: >-
    A 14th-century Amilakhvari stronghold on a high ridge above the Lekhura valley, whose only gate was
    set two metres off the ground.
  body: >-
    **Skhvilo was built by people who expected a siege: its only gate sat two metres above the ground
    reached by a wooden ladder, and the keep's own door is six metres up.**


    The fortress runs along a high ridge above the Lekhura valley and the open Tiriponi plain. Its walls
    date from the 14th century, but a stronghold probably stood here earlier: the 11th-century chronicle
    Matiane Kartlisa already names two 10th-century nobles, Dachi and Ivane 'of Skhvilo'.


    Its story is the story of one family. In the 14th century the Zevdginidze, later known as the Amilakhvari,
    acquired the Skhvilo estate and made it their seat. In the 16th–17th centuries they moved down to
    Kvemo Chala in the valley, and Skhvilo became purely a fortress. In the 1630s King Rostom of Kartli
    attacked Iotam Amilakhvari, entrenched here, and defeated him; in the 1640s Givi Amilakhvari, then
    governing Kartli, held it as a stronghold against Iranian aggression. The family kept it until the
    end of the 18th century.


    The plan is a long rectangle; the walls rise 11–14 metres and are two metres thick, with a fighting
    walkway along the top, gun-ports, holes for dropping stones and a crown of crenellations. A tower
    stands at each end, both apparently five storeys high; the northern one is the keep, with a large
    fifth-floor balcony over the courtyard. When the small church inside grew too cramped for the people
    within the walls, a second was built on top of it. A large cistern and the footings of houses and
    storerooms fill the rest.


    A scene of the Georgian film classic The Eccentrics was shot here. From the walkway you look straight
    down on Kvemo Chala, where the family finally settled, and understand why they kept this ridge in
    reserve for the bad days.
  tip: >-
    This is a walk, not a roadside stop: from Kvemo Chala a trail climbs the ridge over uneven, unshaded
    ground — allow about two hours there and back, plus time inside. There is no water, café or toilet,
    so carry water and wear proper shoes; in summer start early, and skip it in mud or snow. Rehabilitation
    began in 2020; parts may still be fenced off. Watch your footing on the walls and broken edges. Entry
    is free. Pair it with Amilakhvari Castle down in the village — the family's later home — for a half-day
    in one valley.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi. About 55 km from the city centre, in Kaspi Municipality,
    turn right onto the local Sh133, which runs north up the Lekhura valley to Kvemo Chala. To the edge
    of the village it is about 65 km and 1 hour 15 minutes; beyond the asphalt the last stretch is a rough
    unpaved track, and the fortress itself can only be reached on foot. An SUV copes better with the track
    and gets you closer; in a low car, park in the village and walk. Fill up on the S1 before the turn-off.
ru:
  name: Крепость Схвило
  short: >-
    Твердыня рода Амилахвари XIV века на высоком гребне над долиной Лехуры; её единственные ворота были
    подняты на два метра над землёй.
  body: >-
    **Схвило строили люди, которые ждали осады: единственные ворота крепости располагались в двух метрах
    над землёй, и попадали к ним по деревянной лестнице, а дверь самого донжона поднята на шесть метров.**


    Крепость тянется по высокому гребню над долиной Лехуры и открытой Тирипонской равниной. Её стены относятся
    к XIV веку, но укрепление, вероятно, стояло здесь и раньше: уже хроника XI века «Матиане Картлиса»
    упоминает двух вельмож X века, Дачи и Иване Схвилосели («из Схвило»).


    Её история — история одного рода. В XIV веке Зевдгинидзе, позднее известные как Амилахвари, приобрели
    имение Схвило и сделали его своей резиденцией. В XVI–XVII веках они переселились вниз, в Квемо-Чала
    в долине, и Схвило осталась только крепостью. В 1630-х годах картлийский царь Ростом напал на укрепившегося
    здесь Иотама Амилахвари и разбил его; в 1640-х Гиви Амилахвари, управлявший тогда Картли, держал её
    как оплот против иранской агрессии. Род владел крепостью до конца XVIII века.


    В плане она — вытянутый прямоугольник; стены высотой 11–14 метров и толщиной два метра, поверху идёт
    боевой ход, есть бойницы, отверстия для сбрасывания камней и венец зубцов. По концам стоят две башни,
    обе, по-видимому, пятиэтажные; северная — донжон, с большим балконом на пятом этаже над двором. Когда
    маленькая церковь внутри стала слишком тесной для людей за стенами, поверх неё построили вторую. Остальное
    пространство занимают большая цистерна и основания домов и кладовых.


    Здесь снимали эпизод грузинской киноклассики — фильма «Чудаки». С боевого хода смотришь прямо вниз
    на Квемо-Чала, где род в конце концов осел, и понимаешь, почему этот гребень держали про запас — на
    чёрный день.
  tip: >-
    Это прогулка, а не остановка у дороги: от Квемо-Чала тропа поднимается на гребень по неровной местности
    без тени — закладывайте около двух часов туда и обратно плюс время на осмотр. Воды, кафе и туалета
    нет, поэтому несите воду и надевайте нормальную обувь; летом выходите пораньше, а в грязь или снег
    лучше отказаться от похода. Реставрация началась в 2020 году; часть участков может быть всё ещё огорожена.
    Смотрите под ноги на стенах и у обрушенных краёв. Вход свободный. Совместите крепость с замком Амилахвари
    внизу, в селе, — более поздним домом рода: получится полдня в одной долине.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад. Примерно в 55 км от центра города, в Каспском муниципалитете,
    поверните направо на местную дорогу Sh133, которая идёт на север вверх по долине Лехуры к Квемо-Чала.
    До края села около 65 км и 1 час 15 минут; за асфальтом последний отрезок — разбитая грунтовка, а
    к самой крепости можно подняться только пешком. На кроссовере или внедорожнике по грунтовке ехать
    проще и можно подъехать ближе; на низкой машине оставьте её в селе и идите пешком. Заправьтесь на
    S1 до поворота.
fa:
  name: دژ سخویلو
  short: >-
    دژی از سدهٔ چهاردهم از آنِ خاندان آمیلاخواری بر ستیغی بلند بالای درهٔ لخورا، که تنها دروازه‌اش دو
    متر بالاتر از زمین بود.
  body: >-
    **سخویلو را مردمانی ساختند که چشم‌به‌راه محاصره بودند: تنها دروازهٔ آن دو متر بالاتر از زمین بود و
    با نردبانی چوبی به آن می‌رسیدند، و درِ خودِ برج اصلی شش متر بالاتر است.**


    دژ در امتداد ستیغی بلند بالای درهٔ لخورا و دشت باز تیریپونی کشیده شده است. دیوارهایش از سدهٔ چهاردهم
    است، اما احتمالاً پیش از آن هم استحکاماتی این‌جا بوده: وقایع‌نامهٔ «ماتیانه کارتلیسا» از سدهٔ یازدهم
    از دو نجیب‌زادهٔ سدهٔ دهم، داچی و ایوانهٔ «سخویلویی»، نام می‌برد.


    داستان آن داستان یک خاندان است. در سدهٔ چهاردهم خاندان زودگینیدزه، که بعدها با نام آمیلاخواری شناخته
    شدند، ملک سخویلو را به دست آوردند و آن را مقر خود کردند. در سده‌های شانزدهم و هفدهم به کوِمو چالا
    در دره فرود آمدند و سخویلو تنها دژ ماند. در دههٔ ۱۶۳۰ روستوم، شاه کارتلی، به یوتام آمیلاخواری که این‌جا
    سنگر گرفته بود تاخت و شکستش داد؛ در دههٔ ۱۶۴۰ گیوی آمیلاخواری، که در آن زمان کارتلی را اداره می‌کرد،
    آن را سنگری در برابر تهاجم ایرانیان نگه داشت. خاندان تا پایان سدهٔ هجدهم آن را در دست داشت.


    نقشهٔ دژ مستطیلی کشیده است؛ دیوارها ۱۱ تا ۱۴ متر ارتفاع و دو متر ضخامت دارند، با گذرگاه نبرد بر فرازشان،
    مزغل‌های تفنگ، سوراخ‌هایی برای فروانداختن سنگ و تاجی از کنگره‌ها. در هر سر برجی ایستاده که ظاهراً
    هر دو پنج طبقه‌اند؛ برج شمالی برج اصلی (دونژون) است، با بالکنی بزرگ در طبقهٔ پنجم رو به حیاط. وقتی
    کلیسای کوچک درون دژ برای مردمِ پشت دیوارها تنگ شد، کلیسای دومی روی آن ساختند. باقی فضا را آب‌انباری
    بزرگ و پی‌های خانه‌ها و انبارها پر کرده است.


    صحنه‌ای از فیلم کلاسیک گرجی «عجیب‌ها» (شرکیلبی) این‌جا فیلم‌برداری شد. از گذرگاه بالای دیوار مستقیم
    به کوِمو چالا نگاه می‌کنید، جایی که خاندان سرانجام در آن ماندگار شد، و درمی‌یابید چرا این ستیغ را
    برای روزهای سخت نگه داشته بودند.
  tip: >-
    این یک پیاده‌روی است، نه توقفی کنار جاده: از کوِمو چالا مسیری از زمینی ناهموار و بی‌سایه به ستیغ بالا
    می‌رود — برای رفت‌وبرگشت حدود دو ساعت در نظر بگیرید، به‌علاوهٔ زمان گشتن درون دژ. نه آب هست، نه کافه،
    نه سرویس بهداشتی؛ پس آب همراه ببرید و کفش مناسب بپوشید. در تابستان زود راه بیفتید و در گل‌ولای یا
    برف از رفتن صرف‌نظر کنید. کار بازسازی در ۲۰۲۰ آغاز شد و ممکن است بخش‌هایی هنوز حصارکشی شده باشد. روی
    دیوارها و لبه‌های شکسته مراقب جای پایتان باشید. ورود رایگان است. آن را با قلعهٔ آمیلاخواری در پایین،
    در روستا — خانهٔ بعدی خاندان — همراه کنید تا نیم‌روزی در یک دره داشته باشید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی غرب بروید. حدود ۵۵ کیلومتر از مرکز شهر، در شهرداری کاسپی، به راست
    و به جادهٔ محلی Sh133 بپیچید که به سوی شمال، در امتداد درهٔ لخورا، تا کوِمو چالا بالا می‌رود. تا لبهٔ
    روستا حدود ۶۵ کیلومتر و یک ساعت و ۱۵ دقیقه راه است؛ پس از پایان آسفالت، تکهٔ پایانی راهی خاکی و ناهموار
    است و به خود دژ تنها پیاده می‌توان رسید. خودروی شاسی‌بلند از پس این راه خاکی بهتر برمی‌آید و شما را
    نزدیک‌تر می‌برد؛ با خودروی کف‌کوتاه، در روستا پارک کنید و پیاده بروید. پیش از پیچیدن، روی S1 باک را
    پر کنید.
he:
  name: מבצר סחווילו
  short: מעוז של משפחת אמילחווארי מהמאה ה-14 על רכס גבוה מעל עמק הלחורה, ששערו היחיד היה ממוקם שני מטרים
    מעל הקרקע.
  body: >-
    **את סחווילו בנו אנשים שציפו למצור: שערו היחיד היה שני מטרים מעל הקרקע, והגיעו אליו בסולם עץ, ודלת
    המגדל המרכזי עצמו נמצאת בגובה שישה מטרים.**


    המבצר נמתח לאורך רכס גבוה מעל עמק הלחורה ומישור טיריפוני הפתוח. חומותיו מן המאה ה-14, אך כנראה עמד
    כאן מעוז עוד קודם: כבר הכרוניקה "מטיאנה קרתליסה" מן המאה ה-11 מזכירה שני אצילים מן המאה ה-10, דאצ'י
    ואיוואנה "מסחווילו".


    סיפורו הוא סיפורה של משפחה אחת. במאה ה-14 רכשו בני זבדגינידזה, שנודעו מאוחר יותר בשם אמילחווארי, את
    אחוזת סחווילו ועשו אותה למושבם. במאות ה-16–17 ירדו אל קוומו צ'אלה שבעמק, וסחווילו נותר מבצר בלבד.
    בשנות ה-30 של המאה ה-17 תקף רוסטום, מלך קרתלי, את יותם אמילחווארי, שהתבצר כאן, והביס אותו; בשנות ה-40
    של אותה מאה החזיק בו גיווי אמילחווארי, ששלט אז בקרתלי, כמעוז מול התוקפנות האיראנית. המשפחה החזיקה
    בו עד סוף המאה ה-18.


    תוכניתו מלבן מוארך; החומות מתנשאות לגובה 11–14 מטר ועוביין שני מטרים, ולאורך ראשן עובר מעבר לחימה,
    עם חרכי ירי, פתחים להטלת אבנים ועטרה של בדנים. בכל קצה עומד מגדל, ושניהם, כך נראה, בני חמש קומות;
    הצפוני הוא המגדל המרכזי (הדונז'ון), עם מרפסת גדולה בקומה החמישית מעל החצר. כשהכנסייה הקטנה שבפנים
    נעשתה צרה מדי לאנשים שבין החומות, נבנתה כנסייה שנייה על גבה. בור מים גדול ויסודות של בתים ומחסנים
    ממלאים את השאר.


    סצנה מן הסרט הגאורגי הקלאסי "המשונים" (שרקילבי) צולמה כאן. ממעבר הלחימה משקיפים היישר על קוומו צ'אלה,
    שבה השתקעה המשפחה לבסוף, ומבינים מדוע שמרה את הרכס הזה בעתודה לימים הרעים.
  tip: >-
    זו הליכה, לא עצירה בצד הדרך: מקוומו צ'אלה מטפס שביל אל הרכס בשטח לא אחיד וללא צל — הקדישו כשעתיים
    הלוך ושוב, ועוד זמן בתוך המבצר. אין מים, בית קפה או שירותים, אז קחו מים ונעלו נעליים מתאימות; בקיץ
    צאו מוקדם, ובבוץ או בשלג ותרו על ההליכה. עבודות שיקום החלו ב-2020, וייתכן שחלקים עדיין מגודרים. שימו
    לב לצעדים על החומות ובקצוות השבורים. הכניסה חופשית. שלבו את הביקור עם טירת אמילחווארי למטה בכפר —
    ביתה המאוחר של המשפחה — לחצי יום בעמק אחד.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60). כ-55 ק״מ ממרכז העיר, במוניציפליות קספי, פנו ימינה לכביש המקומי
    Sh133, העולה צפונה במעלה עמק הלחורה עד קוומו צ'אלה. עד קצה הכפר כ-65 ק״מ ושעה ורבע; אחרי שהאספלט נגמר,
    הקטע האחרון הוא דרך עפר משובשת, ואל המבצר עצמו אפשר להגיע רק ברגל. רכב פנאי-שטח מתמודד טוב יותר עם
    הדרך ומקרב אתכם יותר; ברכב נמוך, חנו בכפר והמשיכו ברגל. תדלקו בכביש S1 לפני הפנייה.
ar:
  name: قلعة سخفيلو
  short: >-
    معقل لآل أميلاخفاري من القرن الرابع عشر على حيد عالٍ فوق وادي ليخورا، كانت بوابته الوحيدة مرفوعة مترين
    فوق الأرض.
  body: >-
    **بنى سخفيلو قومٌ كانوا يتوقعون الحصار: فبوابتها الوحيدة كانت على ارتفاع مترين فوق الأرض يُصعد إليها
    بسلّم خشبي، أما باب البرج الرئيسي نفسه فعلى ارتفاع ستة أمتار.**


    تمتد القلعة على حيد عالٍ فوق وادي ليخورا وسهل تيريبوني المكشوف. أسوارها من القرن الرابع عشر، لكن حصناً
    قام هنا على الأرجح قبل ذلك: فحولية القرن الحادي عشر «ماتيانه كارتليسا» تذكر نبيلين من القرن العاشر،
    داتشي وإيفانه «من سخفيلو».


    قصتها قصة أسرة واحدة. ففي القرن الرابع عشر حاز آل زيفدغينيدزه، الذين عُرفوا لاحقاً باسم أميلاخفاري،
    إقطاعة سخفيلو واتخذوها مقراً لهم. وفي القرنين السادس عشر والسابع عشر نزلوا إلى كفيمو تشالا في الوادي،
    فصارت سخفيلو قلعةً لا غير. في ثلاثينيات القرن السابع عشر هاجم روستوم ملك كارتلي يوتام أميلاخفاري المتحصّن
    هنا وهزمه؛ وفي أربعينياته اتخذها غيفي أميلاخفاري، الذي كان يدير كارتلي حينئذ، معقلاً في وجه العدوان
    الإيراني. وظلت في يد الأسرة حتى نهاية القرن الثامن عشر.


    مخططها مستطيل متطاول؛ ترتفع الأسوار من 11 إلى 14 متراً بسماكة مترين، ويجري في أعلاها ممشى قتال، وفيها
    مرامٍ للبنادق وفتحات لإلقاء الحجارة وتاج من الشرفات المسنّنة. في كل طرف برج، ويبدو أن كليهما من خمسة
    طوابق؛ والشمالي هو البرج الرئيسي (الدونجون)، وله شرفة كبيرة في الطابق الخامس تطلّ على الفناء. وحين
    ضاقت الكنيسة الصغيرة في الداخل بالناس المقيمين وراء الأسوار، بُنيت فوقها كنيسة ثانية. ويملأ الباقي
    صهريج كبير وأسس بيوت ومخازن.


    صُوّر هنا مشهد من الفيلم الجورجي الكلاسيكي «غريبو الأطوار» (شيريكيليبي). ومن ممشى السور تنظر مباشرة
    إلى كفيمو تشالا، حيث استقرت الأسرة في النهاية، فتفهم لماذا احتفظت بهذا الحيد ذخراً للأيام العصيبة.
  tip: >-
    هذه نزهة سيراً لا وقفة على جانب الطريق: من كفيمو تشالا يصعد درب إلى الحيد عبر أرض وعرة بلا ظل — خصّص
    نحو ساعتين ذهاباً وإياباً، إضافة إلى وقت التجول في الداخل. لا ماء ولا مقهى ولا دورات مياه، فاحمل ماءً
    وانتعل حذاءً مناسباً؛ وابدأ مبكراً في الصيف، وتجنّبها في الوحل أو الثلج. بدأت أعمال الترميم عام 2020،
    وقد تكون بعض الأجزاء لا تزال مسيّجة. انتبه لموطئ قدميك على الأسوار والحواف المتهدمة. الدخول مجاني.
    اجمعها مع قلعة آل أميلاخفاري في القرية أسفلها — بيت الأسرة اللاحق — لتقضي نصف يوم في وادٍ واحد.
  route: >-
    من تبليسي اسلك الطريق السريع S1 (E60) غرباً. على بعد نحو 55 كم من وسط المدينة، في بلدية كاسبي، انعطف
    يميناً إلى الطريق المحلي Sh133 الذي يتجه شمالاً صعوداً في وادي ليخورا حتى كفيمو تشالا. المسافة حتى
    طرف القرية نحو 65 كم وساعة وربع؛ وبعد انتهاء الإسفلت يكون المقطع الأخير درباً ترابياً وعراً، ولا يُبلغ
    الحصن نفسه إلا سيراً على الأقدام. السيارة الرياضية متعددة الاستخدامات تتعامل مع الدرب أفضل وتقرّبك
    أكثر؛ أما بالسيارة المنخفضة فاركنها في القرية وامشِ. املأ الخزان على S1 قبل المنعطف.
