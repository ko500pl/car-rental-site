ka:
  name: დეხვირის ციხე
  short: >-
    ციხის ნანგრევები ცაგერის თავზე, ორ მდინარეს შორის ქედზე: სასაზღვრო სიმაგრე, რომელსაც იმერეთი და სამეგრელო
    XIX საუკუნის დასაწყისამდე ეცილებოდნენ.
  body: >-
    **დეხვირის ციხე ორი ხეობის ერთდროულად სადარაჯოდ აიგო — და დღესაც დარაჯობს, თუმცა მისი მეციხოვნეები
    დიდი ხანია აღარ არიან.**


    ნანგრევები ცხენისწყლისა და ლაჯანურის წყალგამყოფ ქედზე, სოფელ დეხვირის თავზე დგას, ცაგერიდან სულ რამდენიმე
    კილომეტრში. სპეციალისტები ციხეს განვითარებული შუა საუკუნეების ძეგლად მიიჩნევენ, თუმცა წერილობით წყაროებში
    იგი პირველად მხოლოდ XVII საუკუნეში იხსენიება. მისი დანიშნულება მწვერვალზე ასვლისთანავე ნათელი ხდება:
    ვინც ამ ქედს ფლობდა, ორივე მდინარის ხეობის დიდ ნაწილს აკონტროლებდა.


    ამიტომაც ღირდა მისთვის ბრძოლა. XVI–XVIII საუკუნეებში დეხვირი, მთელ ლეჩხუმთან ერთად, იმერეთის მეფეებს
    ეკუთვნოდა. XVIII საუკუნეში იგი სამეგრელოს მთავრებს გადაეცა. 1802 წელს იმერეთის მეფე სოლომონ II-მ ციხე
    კვლავ დაიკავა, მაგრამ რუსეთის იმპერიის ხელისუფლებამ ის სამეგრელოს მთავარს დაუბრუნა. ასე აღმოჩნდა პატარა
    ციხე ორი ქართული სახელმწიფოს უკანასკნელი დავის შუაგულში — სანამ იმპერია ორივეს შთანთქავდა.


    დღეს მხოლოდ დანგრეული კედლებია შემორჩენილი. ძეგლის კვლევა 2015 წელს დაიწყო, არქეოლოგიური აღმოჩენების
    შესახებ 2019 წლის ივლისში ეცნობა საზოგადოებას, ციხეს კი ეროვნული მნიშვნელობის კულტურის ძეგლის სტატუსი
    მიენიჭა.


    დადექით ქედზე და ნელა შემობრუნდით: ერთი მდინარე მარცხნივაა, მეორე — მარჯვნივ, მათ შორის კი ციხის არსებობის
    მთელი მიზეზი.
  tip: >-
    ძეგლი უფასოა, უყარაულო და მთელი წლის განმავლობაში ღია; აქ არც ნიშნებია, არც ღობე და არც რაიმე ინფრასტრუქტურა.
    სოფლიდან ციხემდე მოკლე, მაგრამ ციცაბო აღმართია: ჩაიცვით კარგი ფეხსაცმელი და ყინულსა თუ ძლიერ წვიმაში,
    როცა ბილიკი სრიალა ხდება, ასვლას მოერიდეთ. კედლები ნანგრევია და არა სათამაშო მოედანი: ზედ ნუ აძვრებით,
    ქვები ადვილად ცვივა. ვიზიტს დაახლოებით ერთი საათი სჭირდება. საჭმელი, წყალი და საწვავი ცაგერშია, რამდენიმე
    წუთის სავალზე. მურის ციხე დაახლოებით სამ კილომეტრშია, ამიტომ ისტორიის მოყვარულები ორივეს ერთ დილაში
    მოასწრებენ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთით ქუთაისამდე იარეთ, შემდეგ Sh15-ით, ქუთაისი–ცაგერი–ლენტეხის გზით, ჩრდილოეთით
    ცაგერისკენ. ცაგერის მახლობლად გვერდითი გზა სოფელ დეხვირისკენ ადის, ქალაქის ცენტრიდან გზით დაახლოებით
    5 კილომეტრზე; ზოგან მოუასფალტებელია, მაგრამ ჩვეულებრივი მანქანით ფრთხილად სავალია. მანქანა სოფელში
    დატოვეთ და ქედზე ნანგრევებამდე ფეხით ადით. გზა დაახლოებით 295 კილომეტრია და 5 საათს გრძელდება. ის
    ძირითადად მოასფალტებულია და ეკონომკლასის მანქანაც საკმარისია. ავზი ცაგერში შეავსეთ, ვიზიტი კი მურის
    ციხეს, ლაჯანურის წყალსაცავსა და ღვირიშის ჩანჩქერს შეუთავსეთ.
en:
  name: Dekhviri Fortress
  short: >-
    A ruined frontier fortress on the ridge between two rivers above Tsageri, fought over by Imereti and
    Samegrelo into the nineteenth century.
  body: >-
    **Dekhviri was built to watch two valleys at once, and it still does, though its garrison is long
    gone.**


    The ruins stand on the watershed ridge between the Tskhenistskali and the Lajanuri, above the village
    of Dekhviri, just a couple of kilometres from Tsageri. Specialists count the fortress among the monuments
    of the High Middle Ages, though written sources first name it only in the seventeenth century. Its
    purpose is obvious the moment you reach the top: whoever held this ridge controlled a large part of
    both river valleys.


    That made it worth fighting over. From the sixteenth to the eighteenth century Dekhviri belonged,
    with the rest of Lechkhumi, to the kings of Imereti. In the eighteenth century it passed to the princes
    of Samegrelo. In 1802 King Solomon II of Imereti seized it back, only for the Russian imperial authorities
    to return it to the ruler of Samegrelo. It was a small castle caught in the last quarrels of two Georgian
    states before the empire absorbed them both.


    Only broken walls remain. Research on the site began in 2015, archaeological finds were reported in
    July 2019, and the fortress now holds the status of a Cultural Monument of National Importance.


    Stand on the ridge and turn slowly: one river on your left, the other on your right, and the whole
    reason for the fortress in between.
  tip: >-
    The site is free, unstaffed and open all year, with no signs, fences or facilities. The approach is
    a short but steep uphill walk from the village: wear proper shoes, and avoid it in ice or heavy rain,
    when the path turns slick. The walls are ruins, not a playground; do not climb them, as loose stones
    fall easily. Allow about an hour. Food, water and fuel are in Tsageri, a few minutes away. Muri Fortress
    stands about three kilometres off, so history-minded visitors can pair the two in a single morning.
  route: >-
    From Tbilisi take the E60/S1 west to Kutaisi, then the Sh15, the Kutaisi–Tsageri–Lentekhi road, north
    towards Tsageri. Near Tsageri a side road climbs to Dekhviri village, about 5 km by road from the
    town centre; it is unpaved in places but fine for an ordinary car driven with care. Park in the village
    and continue on foot up the ridge to the ruins. The drive is about 295 km and takes roughly 5 hours.
    The road is mostly paved, and an economy car is all you need. Fill up in Tsageri, and combine the
    visit with Muri Fortress, the Lajanuri reservoir and Ghvirishi Waterfall.
ru:
  name: Крепость Дехвири
  short: >-
    Руины пограничной крепости на гребне между двумя реками над Цагери, за которую Имерети и Самегрело
    спорили вплоть до XIX века.
  body: >-
    **Дехвири построили, чтобы следить сразу за двумя долинами, — и крепость следит за ними до сих пор,
    хотя гарнизона давно нет.**


    Руины стоят на водораздельном гребне между Цхенисцкали и Ладжанури, над селом Дехвири, всего в паре
    километров от Цагери. Специалисты относят крепость к памятникам развитого Средневековья, хотя письменные
    источники впервые называют её лишь в XVII веке. Её назначение становится очевидным, едва поднимешься
    наверх: кто владел этим гребнем, тот контролировал значительную часть обеих речных долин.


    Поэтому за неё и стоило сражаться. С XVI по XVIII век Дехвири, как и весь Лечхуми, принадлежала имеретинским
    царям. В XVIII веке крепость перешла к князьям Самегрело. В 1802 году имеретинский царь Соломон II
    отбил её — лишь для того, чтобы российские имперские власти вернули крепость правителю Самегрело.
    Маленький замок оказался втянут в последние распри двух грузинских государств, пока оба не были поглощены
    империей.


    От крепости остались лишь разрушенные стены. Исследования памятника начались в 2015 году, об археологических
    находках сообщили в июле 2019-го, и сегодня крепость имеет статус памятника культуры национального
    значения.


    Встаньте на гребне и медленно повернитесь: одна река слева, другая справа, а между ними — вся причина,
    по которой здесь стоит крепость.
  tip: >-
    Вход свободный, смотрителя нет, место открыто круглый год; указателей, ограждений и удобств тоже нет.
    Подход из села короткий, но крутой: нужна нормальная обувь, а в гололёд или сильный дождь, когда тропа
    становится скользкой, лучше не ходить. Стены — руины, а не площадка для игр: не забирайтесь на них,
    камни легко осыпаются. Закладывайте около часа. Еда, вода и топливо — в Цагери, в нескольких минутах
    езды. Крепость Мури стоит примерно в трёх километрах, так что любители истории могут объединить обе
    за одно утро.
  route: >-
    Из Тбилиси по E60/S1 на запад до Кутаиси, затем по Sh15 — дороге Кутаиси — Цагери — Лентехи — на север
    в сторону Цагери. Около Цагери боковая дорога поднимается в село Дехвири, примерно в 5 км езды от
    центра города; местами она грунтовая, но при аккуратной езде годится для обычной машины. Оставьте
    машину в селе и дальше поднимайтесь пешком по гребню к руинам. Путь составляет около 295 км и занимает
    примерно 5 часов. Дорога в основном асфальтирована, и машины эконом-класса вполне достаточно. Заправьтесь
    в Цагери и совместите поездку с крепостью Мури, Ладжанурским водохранилищем и водопадом Гвириши.
fa:
  name: دژ دخویری
  short: >-
    ویرانه‌های دژی مرزی بر ستیغ میان دو رود در بالای تساگری، که ایمرتی و سامگرلو تا سدهٔ نوزدهم بر سرش
    کشمکش داشتند.
  body: >-
    **دخویری را ساختند تا هم‌زمان دو دره را زیر نظر داشته باشد، و هنوز هم دارد، هرچند پادگانش مدت‌هاست
    رفته است.**


    ویرانه‌ها بر ستیغ آبپخشان میان تسخنیستسکالی و لاجانوری، بالای روستای دخویری و تنها دو سه کیلومتر دورتر
    از تساگری، ایستاده‌اند. کارشناسان این دژ را در شمار بناهای اوج سده‌های میانه می‌آورند، هرچند منابع
    نوشتاری نخستین بار تنها در سدهٔ هفدهم از آن نام می‌برند. هدفش همان لحظه که به بالا می‌رسید آشکار است:
    هر که این ستیغ را در دست داشت، بخش بزرگی از هر دو درهٔ رود را در اختیار داشت.


    همین آن را شایستهٔ جنگیدن می‌کرد. از سدهٔ شانزدهم تا هجدهم، دخویری همراه با سراسر لچخومی از آنِ شاهان
    ایمرتی بود. در سدهٔ هجدهم به شاهزادگان سامگرلو رسید. در سال ۱۸۰۲ سلیمان دوم، شاه ایمرتی، آن را پس
    گرفت، اما تنها برای آن‌که مقامات امپراتوری روسیه دوباره آن را به فرمانروای سامگرلو بازگردانند. دژی
    کوچک در واپسین کشمکش‌های دو دولت گرجی گرفتار آمده بود، پیش از آن‌که امپراتوری هر دو را در خود فرو
    برد.


    از آن تنها دیوارهای شکسته مانده است. پژوهش در محل در سال ۲۰۱۵ آغاز شد، یافته‌های باستان‌شناختی در
    ژوئیهٔ ۲۰۱۹ گزارش شد، و اکنون این دژ جایگاه «بنای فرهنگی دارای اهمیت ملی» را دارد.


    بر ستیغ بایستید و آرام بچرخید: یک رود در چپ، دیگری در راست، و همهٔ دلیل وجود دژ در میانشان.
  tip: >-
    ورود رایگان است، نگهبانی ندارد و در همهٔ سال باز است؛ نه تابلویی هست، نه حصاری، نه امکاناتی. راه رسیدن
    از روستا کوتاه اما پرشیب است: کفش مناسب بپوشید و در یخبندان یا باران شدید، که مسیر لغزنده می‌شود،
    نروید. دیوارها ویرانه‌اند، نه زمین بازی؛ از آن‌ها بالا نروید، چون سنگ‌های لق به‌آسانی فرو می‌افتند.
    حدود یک ساعت وقت بگذارید. غذا، آب و سوخت در تساگری است، چند دقیقه آن‌سوتر. دژ موری حدود سه کیلومتر
    دورتر است، پس دوستداران تاریخ می‌توانند هر دو را در یک صبح ببینند.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سوی غرب تا کوتائیسی بروید، سپس Sh15، یعنی جادهٔ کوتائیسی–تساگری–لنتخی،
    را به سوی شمال و تساگری بگیرید. نزدیک تساگری جاده‌ای فرعی به روستای دخویری بالا می‌رود که از مرکز
    شهر حدود ۵ کیلومتر راه است؛ جاهایی خاکی است، اما با رانندگی محتاطانه برای خودروی معمولی مناسب است.
    در روستا پارک کنید و پیاده از ستیغ تا ویرانه‌ها بالا بروید. مسیر حدود ۲۹۵ کیلومتر است و نزدیک به ۵
    ساعت طول می‌کشد. جاده بیشتر آسفالت است و خودروی اقتصادی کافی است. در تساگری باک را پر کنید و دیدار
    را با دژ موری، مخزن لاجانوری و آبشار غویریشی همراه کنید.
he:
  name: מבצר דחווירי
  short: הריסות מבצר גבול על הרכס שבין שני נהרות מעל צאגרי, שעליו נאבקו אימרתי וסמגרלו עד המאה ה-19.
  body: >-
    **דחווירי נבנה כדי לצפות בשני עמקים בבת אחת, והוא עדיין צופה בהם, אף שחיל המצב שלו נעלם מזמן.**


    ההריסות ניצבות על רכס פרשת המים שבין הצחניסצקאלי ללאג'אנורי, מעל הכפר דחווירי, קילומטרים ספורים בלבד
    מצאגרי. המומחים מונים את המבצר בין המבנים של ימי הביניים הגבוהים, אף שהמקורות הכתובים מזכירים אותו
    לראשונה רק במאה ה-17. ייעודו ברור ברגע שמגיעים למעלה: מי שהחזיק ברכס הזה שלט בחלק גדול משני עמקי הנהרות.


    ולכן היה שווה להילחם עליו. מן המאה ה-16 ועד המאה ה-18 היה דחווירי, יחד עם כל לצ'חומי, בידי מלכי אימרתי.
    במאה ה-18 עבר לנסיכי סמגרלו. ב-1802 כבש אותו בחזרה סולומון השני, מלך אימרתי, רק כדי שהשלטונות האימפריאליים
    הרוסיים ישיבו אותו לשליט סמגרלו. זו הייתה טירה קטנה שנקלעה למריבות האחרונות של שתי מדינות גאורגיות,
    לפני שהאימפריה בלעה את שתיהן.


    נותרו רק חומות שבורות. המחקר באתר החל ב-2015, ממצאים ארכאולוגיים דווחו ביולי 2019, וכיום נושא המבצר
    מעמד של אתר מורשת תרבות בעל חשיבות לאומית.


    עמדו על הרכס והסתובבו לאט: נהר אחד משמאלכם, השני מימינכם, וכל הסיבה לקיומו של המבצר ביניהם.
  tip: >-
    הכניסה חינם, אין באתר צוות והוא פתוח כל השנה, בלי שלטים, גדרות או מתקנים. הגישה היא עלייה רגלית קצרה
    אך תלולה מן הכפר: נעלו נעליים מתאימות, והימנעו ממנה בקרח או בגשם כבד, כשהשביל נעשה חלקלק. החומות הן
    הריסות ולא מגרש משחקים; אל תטפסו עליהן, כי אבנים רופפות נופלות בקלות. הקדישו כשעה. אוכל, מים ודלק
    בצאגרי, מרחק דקות ספורות. מבצר מורי עומד כשלושה קילומטרים משם, כך שחובבי היסטוריה יכולים לשלב את שניהם
    בבוקר אחד.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד קותאיסי, ומשם בכביש Sh15, דרך קותאיסי–צאגרי–לנטחי, צפונה לכיוון
    צאגרי. סמוך לצאגרי מטפסת דרך צדדית אל הכפר דחווירי, כ-5 ק״מ בכביש ממרכז העיר; במקומות היא לא סלולה,
    אבל מתאימה לרכב רגיל בנהיגה זהירה. חנו בכפר והמשיכו ברגל במעלה הרכס אל ההריסות. הנסיעה היא כ-295 ק״מ
    ונמשכת כחמש שעות. הכביש סלול ברובו, ורכב אקונומי הוא כל מה שצריך. תדלקו בצאגרי, ושלבו את הביקור עם
    מבצר מורי, מאגר לאג'אנורי ומפל גווירישי.
ar:
  name: قلعة ديخفيري
  short: أطلال قلعة حدودية على الحيد بين نهرين فوق تساغيري، تنازعتها إيميريتي وساميغريلو حتى القرن التاسع
    عشر.
  body: >-
    **بُنيت ديخفيري لتراقب واديين في آن واحد، وما زالت تفعل، وإن كانت حاميتها قد رحلت منذ زمن بعيد.**


    تقوم الأطلال على حَيد خطّ تقسيم المياه بين نهرَي تسخينيستسكالي ولاجانوري، فوق قرية ديخفيري، على بعد
    كيلومترين أو نحوهما من تساغيري. يعدّ المختصون القلعة من آثار العصور الوسطى العليا، وإن كانت المصادر
    المكتوبة لا تذكرها أول مرة إلا في القرن السابع عشر. وتتضح غايتها لحظة تبلغ القمة: من ملك هذا الحيد
    تحكّم في جزء كبير من واديي النهرين كليهما.


    ولهذا كانت جديرة بالقتال عليها. فمن القرن السادس عشر حتى الثامن عشر كانت ديخفيري، مع سائر ليتشخومي،
    تابعة لملوك إيميريتي. وفي القرن الثامن عشر انتقلت إلى أمراء ساميغريلو. وفي عام 1802 استعادها سليمان
    الثاني ملك إيميريتي، لكن السلطات الإمبراطورية الروسية ما لبثت أن أعادتها إلى حاكم ساميغريلو. قلعة
    صغيرة علقت في آخر خصومات دولتين جورجيتين قبل أن تبتلعهما الإمبراطورية كلتيهما.


    لم يبقَ منها سوى أسوار متهدمة. بدأت الأبحاث في الموقع عام 2015، وأُعلن عن لقى أثرية في يوليو/تموز
    2019، وتحمل القلعة اليوم صفة «معلم ثقافي ذي أهمية وطنية».


    قف على الحيد واستدر ببطء: نهر عن يسارك، وآخر عن يمينك، وعلّة وجود القلعة كلها بينهما.
  tip: >-
    الموقع مجاني، بلا حرّاس، ومفتوح طوال العام، ولا لافتات فيه ولا أسوار حماية ولا مرافق. الطريق إليه
    من القرية مشيٌ قصير لكنه شديد الصعود: انتعل حذاءً مناسباً، وتجنّبه في الجليد أو المطر الغزير حين يصير
    الدرب زلقاً. الأسوار أطلال لا ملعب؛ لا تتسلقها، فالحجارة المفككة تسقط بسهولة. خصّص نحو ساعة. الطعام
    والماء والوقود في تساغيري، على بعد دقائق. وتقوم قلعة موري على بعد نحو ثلاثة كيلومترات، فيمكن لهواة
    التاريخ الجمع بينهما في صباح واحد.
  route: >-
    من تبليسي اسلك E60/S1 غرباً حتى كوتايسي، ثم الطريق Sh15، طريق كوتايسي–تساغيري–لنتيخي، شمالاً نحو تساغيري.
    وقرب تساغيري يصعد طريق جانبي إلى قرية ديخفيري، على بعد نحو 5 كم بالطريق من وسط البلدة؛ هو غير معبّد
    في بعض المواضع، لكنه مناسب للسيارة العادية مع القيادة بحذر. اركن في القرية وتابع سيراً صعوداً على
    الحيد إلى الأطلال. تبلغ المسافة نحو 295 كم، وتستغرق الرحلة قرابة 5 ساعات. الطريق معبّد في معظمه، والسيارة
    الاقتصادية تكفيك. املأ الخزان في تساغيري، واجمع الزيارة مع قلعة موري وخزان لاجانوري وشلال غفيريشي.
