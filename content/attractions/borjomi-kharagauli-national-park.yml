ka:
  name: ბორჯომ-ხარაგაულის ეროვნული პარკი
  short: ევროპის ერთ-ერთი უდიდესი დაცული ტყე — მრავალდღიანი ბილიკები, თავშესაფრები და სუბალპური მდელოები.
  body: >
    ბორჯომ-ხარაგაულის ეროვნული პარკი საქართველოს ტერიტორიის დაახლოებით ერთ პროცენტს იკავებს და ევროპის
    მასშტაბით ერთ-ერთი უდიდესი დაცული ტყის მასივია. ის 1995 წელს დაარსდა და პირველი ქართული პარკია, რომელიც
    საერთაშორისო სტანდარტით მოეწყო: მარკირებული ბილიკები, მთის თავშესაფრები, კარვის ადგილები და სავალდებულო
    რეგისტრაცია ვიზიტორთა ცენტრში. ტერიტორია ორ ადმინისტრაციულ რეგიონს ფარავს და სიმაღლეები ექვსასი მეტრიდან
    ორ ათას სამასამდე მერყეობს.


    ეს არ არის ადგილი, სადაც მანქანით მიდიხარ და ხედს იღებ. აქ ფეხით დადიან — რამდენიმე საათიდან რვა დღემდე.


    პოპულარული ვარიანტები:


    - **ლიკანისა და ატენის მოკლე ბილიკები** — ორიდან ოთხ საათამდე, ვიზიტორთა ცენტრიდან

    - **ერთდღიანი მარშრუტები** — წიფლის ტყე და სუბალპური მდელოები

    - **მრავალდღიანი ტრეკები თავშესაფრებით** — რომანოვების ბილიკის ჩათვლით, ორი-სამი დღე


    ტყეში ჯერ კიდევ ბინადრობს დათვი, ფოცხვერი, ირემი და არწივი; მარშრუტების ნაწილი ორ ათას მეტრს გადის,
    სადაც ივნისამდე თოვლი ხშირად რჩება. სხვაობა მოკლე გასვლაზეც ეტყობა: ერთ საათში საკურორტო პარკიდან
    ნამდვილ ველურ ტყეში გადადიხარ, სადაც მობილური კავშირი თითქმის აღარაა.


    ვიზიტორთა ცენტრი ბორჯომშია — რეგისტრაცია, რუკები, ბილიკის მდგომარეობის ინფორმაცია და მეგზურის დაქირავება
    იქ ხდება.


    პარკში ღამის გათევა ორ ფორმატშია შესაძლებელი: მარკირებულ ბილიკებზე განლაგებულ ხის თავშესაფრებში, სადაც
    საწოლები და ღუმელია, ან ოფიციალურ საკარვე ადგილებში. ორივე შემთხვევაში ადგილი წინასწარ უნდა დაჯავშნო
    ვიზიტორთა ცენტრში, რადგან ზაფხულში თავშესაფრები ხშირად სავსეა.
  tip: >-
    ჯერ ბორჯომის ვიზიტორთა ცენტრში შედი: რეგისტრაცია სავალდებულოა, ბილიკის ნაწილი ამინდის მიხედვით იკეტება
    და მეგზურიც იქ ჯავშნება. აიღე წყალი, საკვები, ქურთუკი და ნამდვილი სალაშქრო ფეხსაცმელი — ამინდი დღეში
    ორჯერ იცვლება. მობილური კავშირი ბილიკის დიდ ნაწილზე არაა. თუ ერთდღიანი გასვლა გინდა, დილის 09:00-ზე
    დაიწყე. ტყეში ნაგავი არ რჩება, ცეცხლი მხოლოდ მონიშნულ ადგილებშია დაშვებული.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომზე გადაუხვევ — ას სამოცდახუთი კილომეტრი, ორი საათი ნახევარი.
    ვიზიტორთა ცენტრი ბორჯომში, ლიკანის მიმართულებითაა და ჯერ იქ უნდა შეხვიდე. შესასვლელებამდე მისასვლელი
    გზები — ლიკანი, მარელისი, ატენი, ხარაგაული — ნაწილობრივ ხრეშოვანია და წვიმის შემდეგ ღრმა თხრილები
    ჩნდება; სწორედ ამიტომაა კროსოვერი უფრო საიმედო არჩევანი. საწვავი ბორჯომში აავსე: შესასვლელებთან არც
    გასამართია და არც მაღაზია. მანქანა თავად ბილიკზე არ გჭირდება, მხოლოდ ტრეილჰედამდე მისაღწევად.
en:
  name: Borjomi-Kharagauli National Park
  short: One of the largest protected forests in Europe, with marked trails, huts and multi-day treks.
  body: >-
    Borjomi-Kharagauli National Park covers roughly one percent of Georgia and is among the largest protected
    forest areas in Europe. Founded in 1995, it was the first Georgian park set up to international standards:
    waymarked trails, mountain huts, designated campsites and compulsory registration at a visitor centre.


    This is not a drive-up viewpoint. The park is walked, on routes ranging from a couple of hours to
    eight days.


    The usual options:


    - **short Likani and Atskuri trails** — two to four hours from the visitor centre

    - **day routes** — a full day through beech forest into subalpine meadow

    - **multi-day treks with hut nights**, including the Romanov trail, over two or three days


    Bears, lynx, red deer and eagles still live in this forest, and higher sections of the trail network
    cross 2,000 metres, where snow often lingers into June. Even on a short walk the change is obvious:
    within an hour you go from spa-town parkland into genuinely wild, thickly wooded country with almost
    no phone signal.


    The visitor centre in Borjomi handles registration, maps, trail-condition updates and guide bookings.
  tip: >-
    Start at the visitor centre in Borjomi: registration is required, sections close depending on weather,
    and guides are booked there. Carry water, food, a windproof layer and real hiking boots — conditions
    change twice a day at this altitude. There is no mobile coverage across much of the trail network.
    For a day walk, be moving by 09:00. Pack out all rubbish; fires are permitted only at marked sites,
    and the rule is enforced.
  route: >-
    Take the E60 from Tbilisi to Khashuri, then turn south for Borjomi — 160 km, about two and a half
    hours. The visitor centre sits in Borjomi on the Likani side of town. Access roads to the individual
    gates (Likani, Marelisi, Atskuri, Kharagauli) are partly gravel and develop deep ruts after rain,
    which is why a crossover is the safer choice here. Fill up in Borjomi: there is no fuel and no shop
    at the trailheads. You need the car only to reach the gate, not beyond it.
ru:
  name: Боржоми-Харагаульский национальный парк
  short: 'Один из крупнейших охраняемых лесов Европы: маркированные тропы, приюты и многодневные треки.'
  body: >
    Боржоми-Харагаульский национальный парк занимает около одного процента территории Грузии и входит
    в число крупнейших охраняемых лесных массивов Европы. Он основан в 1995 году и стал первым грузинским
    парком, устроенным по международным стандартам: маркированные тропы, горные приюты, оборудованные
    стоянки и обязательная регистрация в визит-центре. Территория лежит в двух административных регионах,
    а высоты меняются от шестисот до примерно двух тысяч трёхсот метров.


    Сюда не приезжают «посмотреть с парковки». Парк проходят пешком — от пары часов до восьми дней.


    Основные варианты:


    - **короткие тропы Ликани и Ацкури** — два-четыре часа от визит-центра

    - **однодневные маршруты** — буковый лес и субальпийские луга

    - **многодневные треки с ночёвкой в приютах**, включая Романовскую тропу, два-три дня


    В лесу по-прежнему водятся медведь, рысь, благородный олень и орлы, а верхние участки троп выходят
    выше двух тысяч метров, где снег нередко лежит до июня. Разница чувствуется даже на коротком выходе:
    за час вы уходите из курортного парка в по-настоящему дикий лес почти без связи.


    Визит-центр в Боржоми оформляет регистрацию, выдаёт карты, сообщает о состоянии троп и бронирует гидов.


    Ночевать в парке можно в двух форматах: в деревянных приютах на маркированных тропах, где есть кровати
    и печь, или на официальных стоянках для палаток. И то и другое бронируется заранее в визит-центре,
    потому что летом приюты часто заполнены.
  tip: >-
    Начните с визит-центра в Боржоми: регистрация обязательна, часть троп закрывают по погоде, там же
    бронируют гида. Возьмите воду, еду, ветрозащитную куртку и настоящие треккинговые ботинки — погода
    на высоте меняется дважды в день. Мобильной связи на большей части маршрутов нет. Для однодневного
    выхода стартуйте в 09:00. Мусор выносите с собой, костры разрешены только в отмеченных местах, и за
    этим следят.
  route: >-
    Из Тбилиси по E60 до Хашури, затем поворот на юг к Боржоми — 160 км, около двух с половиной часов.
    Визит-центр находится в Боржоми, со стороны Ликани. Подъезды к отдельным входам (Ликани, Марелиси,
    Ацкури, Харагаули) частично гравийные, после дождя разбиваются в глубокую колею, поэтому кроссовер
    здесь надёжнее. Заправляйтесь в Боржоми: у входов в парк нет ни заправки, ни магазина. Машина нужна
    только чтобы доехать до старта тропы.
fa:
  name: پارک ملی بورجومی-خاراگاولی
  short: یکی از بزرگ‌ترین جنگل‌های حفاظت‌شدهٔ اروپا، با مسیرهای علامت‌گذاری‌شده، پناهگاه‌ها و پیاده‌روی‌های
    چندروزه.
  body: >-
    پارک ملی بورجومی-خاراگاولی حدود یک درصد خاک گرجستان را می‌پوشاند و از بزرگ‌ترین پهنه‌های جنگلی حفاظت‌شدهٔ
    اروپاست. در 1995 بنیاد گذاشته شد و نخستین پارک گرجستان بود که بر پایهٔ استانداردهای بین‌المللی سامان
    گرفت: مسیرهای علامت‌گذاری‌شده، پناهگاه‌های کوهستانی، محوطه‌های مشخص برای چادر و ثبت‌نام اجباری در
    مرکز بازدیدکنندگان. اینجا نقطه‌ای نیست که با خودرو تا منظره برسید؛ پارک را باید پیاده رفت، روی مسیرهایی
    از دو ساعت تا هشت روز.


    گزینه‌های معمول سه دسته‌اند. مسیرهای کوتاه لیکانی و آتسکوری دو تا چهار ساعت از مرکز بازدیدکنندگان
    طول می‌کشند. مسیرهای یک‌روزه یک روز کامل شما را از جنگل راش تا چمنزار زیرآلپی می‌برند. و پیاده‌روی‌های
    چندروزه با شب‌مانی در پناهگاه، از جمله مسیر رومانوف، دو یا سه روز وقت می‌خواهند.


    خرس، سیاه‌گوش، گوزن سرخ و عقاب هنوز در این جنگل زندگی می‌کنند و بخش‌های بالایی شبکهٔ مسیرها از 2,000
    متر می‌گذرند، جایی که برف اغلب تا ژوئن می‌ماند. حتی در یک پیاده‌روی کوتاه تغییر آشکار است: در یک ساعت
    از پارک شهر آب‌درمانی به جنگلی انبوه و به‌راستی وحشی می‌رسید که تقریباً هیچ آنتنی ندارد. مرکز بازدیدکنندگان
    در بورجومی کار ثبت‌نام، نقشه، خبر وضعیت مسیرها و رزرو راهنما را انجام می‌دهد.
  tip: >-
    کار را از مرکز بازدیدکنندگان بورجومی شروع کنید: ثبت‌نام الزامی است، بعضی بخش‌ها بسته به هوا بسته می‌شوند
    و راهنما هم همان‌جا رزرو می‌شود. آب، خوراک، یک لایهٔ بادگیر و کفش کوهنوردی واقعی همراه ببرید — در
    این ارتفاع هوا روزی دو بار عوض می‌شود. در بیشتر شبکهٔ مسیرها آنتن موبایل وجود ندارد. برای یک پیاده‌روی
    یک‌روزه ساعت 09:00 باید در راه باشید. همهٔ زباله را با خود برگردانید؛ آتش فقط در نقاط علامت‌گذاری‌شده
    مجاز است و این قاعده جدی گرفته می‌شود.
  route: >-
    از تفلیس با E60 تا خاشوری بروید و بعد به سمت جنوب به بورجومی بپیچید — 160 کیلومتر، حدود دو ساعت و
    نیم. مرکز بازدیدکنندگان در بورجومی و در سمت لیکانی شهر است. جاده‌های دسترسی به دروازه‌های جداگانه
    — لیکانی، مارلیسی، آتسکوری و خاراگاولی — بخشی شنی‌اند و پس از باران شیارهای عمیق برمی‌دارند، و به
    همین دلیل کراس‌اوور اینجا انتخاب مطمئن‌تری است. باک را در بورجومی پر کنید: در سرِ مسیرها نه سوخت هست
    و نه مغازه. خودرو را فقط برای رسیدن به دروازه لازم دارید، نه فراتر از آن.
he:
  name: הפארק הלאומי בורג'ומי-חראגאולי
  short: אחד היערות המוגנים הגדולים באירופה, עם שבילים מסומנים, בקתות וטרקים בני כמה ימים.
  body: >-
    הפארק הלאומי בורג'ומי-חראגאולי משתרע על כאחוז אחד משטחה של גאורגיה והוא מן השטחים היעריים המוגנים
    הגדולים באירופה. הוא נוסד ב-1995 והיה הפארק הגאורגי הראשון שהוקם לפי סטנדרטים בינלאומיים: שבילים מסומנים,
    בקתות הרים, אתרי מחנאות מוגדרים ורישום חובה במרכז המבקרים. זו אינה נקודת תצפית שמגיעים אליה ברכב.
    את הפארק הולכים ברגל, במסלולים שאורכם נע משעתיים ועד שמונה ימים.


    האפשרויות הרגילות הן שלוש. שבילי ליקאני ואצקורי הקצרים אורכים שעתיים עד ארבע שעות ממרכז המבקרים. מסלולי
    היום לוקחים יום שלם דרך יער אשור אל אחו תת-אלפיני. והטרקים הרב-יומיים עם לינה בבקתות, ובהם שביל רומנוב,
    נמשכים יומיים או שלושה.


    דובים, שונרים, אילים אדומים ונשרים עדיין חיים ביער הזה, והקטעים הגבוהים של רשת השבילים חוצים 2,000
    מטר, שם השלג נשאר לא פעם עד יוני. גם בהליכה קצרה השינוי ברור: בתוך שעה עוברים מגן העיר המרפאה אל ארץ
    מיוערת בצפיפות ופראית באמת, כמעט בלי קליטה סלולרית. מרכז המבקרים בבורג'ומי מטפל ברישום, במפות, בעדכוני
    מצב השבילים ובהזמנת מדריכים.
  tip: >-
    התחילו במרכז המבקרים בבורג'ומי: הרישום הוא חובה, קטעים נסגרים בהתאם למזג האוויר, ומדריכים מזמינים
    שם. קחו מים, אוכל, שכבה חוסמת רוח ונעלי הליכה אמיתיות — התנאים בגובה הזה משתנים פעמיים ביום. בחלק
    גדול מרשת השבילים אין קליטה סלולרית. להליכת יום, כדאי להיות בדרך עד 09:00. קחו אתכם את כל האשפה החוצה;
    מדורות מותרות רק באתרים המסומנים, והכלל הזה נאכף.
  route: >-
    מטביליסי סעו בכביש E60 עד חשורי, ומשם פנו דרומה לבורג'ומי — 160 ק״מ, כשעתיים וחצי. מרכז המבקרים נמצא
    בבורג'ומי, בצד ליקאני של העיר. דרכי הגישה אל השערים השונים — ליקאני, מארליסי, אצקורי וחראגאולי — הן
    חלקית חצץ ונחרצות בתלמים עמוקים אחרי גשם, ולכן קרוסאובר הוא הבחירה הבטוחה כאן. תדלקו בבורג'ומי: בראשי
    השבילים אין דלק ואין חנות. את הרכב אתם צריכים רק כדי להגיע אל השער, לא מעבר לו.
ar:
  name: منتزه بورجومي-خاراغاولي الوطني
  short: إحدى أكبر الغابات المحمية في أوروبا، بمسارات معلَّمة وأكواخ ورحلات مشي تمتد أياماً.
  body: >-
    يغطي منتزه بورجومي-خاراغاولي الوطني نحو واحد في المئة من مساحة جورجيا، وهو من أكبر المناطق الحرجية
    المحمية في أوروبا. أُنشئ عام 1995 وكان أول منتزه جورجي يُجهَّز وفق معايير دولية: مسارات معلَّمة وأكواخ
    جبلية ومواقع تخييم محددة وتسجيل إلزامي في مركز الزوار. وهو ليس مطلاً تصل إليه بسيارتك؛ فالمنتزه يُقطع
    سيراً، على دروب تتراوح بين ساعتين وثمانية أيام.


    والخيارات المعتادة ثلاثة. دربا ليكاني وأتسكوري القصيران يستغرقان ساعتين إلى أربع ساعات من مركز الزوار.
    ومسارات اليوم الواحد تأخذ يوماً كاملاً عبر غابة الزان صعوداً إلى مروج تحت-ألبية. أما رحلات الأيام
    المتعددة مع المبيت في الأكواخ، ومنها درب رومانوف، فتمتد يومين أو ثلاثة.


    ولا تزال الدببة والوشق والأيائل الحمراء والنسور تعيش في هذه الغابة، وتتجاوز المقاطع العليا من شبكة
    الدروب 2,000 متر، حيث يبقى الثلج غالباً حتى يونيو. وحتى في نزهة قصيرة يكون التحول واضحاً: في ساعة
    واحدة تنتقل من حديقة بلدة الاستشفاء إلى أرض حرجية كثيفة وبرية فعلاً، بلا تغطية هاتفية تقريباً. ويتولى
    مركز الزوار في بورجومي التسجيل والخرائط وأخبار حالة المسارات وحجز المرشدين.
  tip: >-
    ابدأ من مركز الزوار في بورجومي: التسجيل إلزامي، وبعض المقاطع تُغلق تبعاً للطقس، والمرشدون يُحجزون
    هناك. احمل ماءً وطعاماً وطبقة صادّة للريح وحذاء مشي حقيقياً — فالأحوال على هذا الارتفاع تتبدل مرتين
    في اليوم. ولا تغطية للهاتف المحمول في جزء كبير من شبكة الدروب. ولنزهة يوم واحد، ينبغي أن تكون في الطريق
    عند 09:00. أخرج معك كل النفايات؛ وإشعال النار مسموح في المواقع المعلَّمة وحدها، وهذه القاعدة تُطبَّق
    فعلاً.
  route: >-
    من تبليسي اسلك E60 حتى خاشوري، ثم انعطف جنوباً إلى بورجومي — 160 كم، نحو ساعتين ونصف. ويقع مركز الزوار
    في بورجومي على جهة ليكاني من البلدة. أما طرق الوصول إلى البوابات المختلفة — ليكاني ومارليسي وأتسكوري
    وخاراغاولي — فحصوية جزئياً وتتشقق بأخاديد عميقة بعد المطر، ولهذا تكون سيارة الكروس أوفر الخيار الأسلم
    هنا. املأ الخزان في بورجومي: فلا وقود ولا متجر عند مداخل الدروب. وأنت تحتاج السيارة للوصول إلى البوابة
    فقط، لا إلى ما بعدها.
