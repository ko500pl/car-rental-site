ka:
  name: ბორჯომ-ხარაგაულის ეროვნული პარკი
  short: >-
    საქართველოს ტერიტორიის ერთ პროცენტზე მეტი — ტყე და მდელო, მონიშნული ბილიკებითა და თავშესაფრებით, რომლებიც
    ბორჯომის განაპირას იწყება.
  body: >-
    **ამ ტყის დაცვა დიდმა მთავარმა დაიწყო, რომელსაც ის საკუთარი თავისთვის უნდოდა.**


    შუა საუკუნეებში ეს კალთები ქართველი დიდებულების სანადირო ადგილი იყო. როცა 1871 წელს ბორჯომი კავკასიის
    მეფისნაცვალს, დიდ მთავარ მიხეილ ნიკოლოზის ძეს, გადაეცა, მან ტყის ჭრა და ნადირობა თავისი ნებართვის
    გარეშე აკრძალა — და ამით ტყე საუკუნეზე მეტი ხნის შემდეგ დაარსებული პარკისთვის შემოინახა.


    ეროვნული პარკი 1995 წელს, ბუნების მსოფლიო ფონდისა და გერმანიის მთავრობის მხარდაჭერით დაარსდა, ოფიციალურად
    კი 2001 წელს გაიხსნა — როგორც კავკასიაში პირველი დაცული ტერიტორია, რომელიც საერთაშორისო სტანდარტით
    მოეწყო. ის ბორჯომიდან ხარაგაულამდე ექვს მუნიციპალიტეტსა და სამ მხარეს მოიცავს და ბორჯომის სახელმწიფო
    ნაკრძალთან ერთად საქართველოს ტერიტორიის ერთ პროცენტზე მეტს იკავებს.


    ეს მანქანიდან სანახავი ადგილი არ არის. ბილიკების ქსელი დაახლოებით 400 მეტრიდან 2642 მეტრამდე ადის
    — მდინარის ხეობებიდან მცირე კავკასიონის ხშირი შერეული ტყის გავლით ღია სუბალპურ მდელოებამდე. გზაში
    ღამის გასათევი თავშესაფრები, საპიკნიკე და საკარვე ადგილები, უთხოვრის რელიქტური კორომები და ცხოველები
    გხვდებათ, მათ შორის ფოცხვერი და კავკასიური როჭო. საკურორტო ბულვარიდან საათის სავალზე მობილური კავშირი
    ქრება და მხოლოდ წყლის ხმაღა ისმის.


    პარკს ჭრილობებიც აქვს. მის განაპირას ბაქო–თბილისი–ჯეიჰანის ნავთობსადენი გადის, 2008 წლის აგვისტოში
    კი სამ კვადრატულ კილომეტრზე მეტი ტყე დაიწვა; საქართველომ ეს რუსეთის მიერ განზრახ განადგურებად შეაფასა.


    დიდმა მთავარმა ეს ტყე იმისთვის დაკეტა, რომ თავად ენადირა. პარკმა ის ყველასთვის გახსნა, ვინც ფეხით
    სიარულს არ დაიზარებს — ერთი პირობით: ტყე ისეთივე უნდა დატოვოთ, როგორიც დაგხვდათ.
  tip: >-
    დაიწყეთ ვიზიტორთა ცენტრიდან ბორჯომში, მესხეთის ქუჩა 23-ში (მეორე ცენტრი ხარაგაულშია). იქ დარეგისტრირდით,
    აიღეთ რუკა, გაიგეთ, რომელი მონაკვეთებია ღია, და დაჯავშნეთ თავშესაფარში ადგილი ან მეგზური; ბილიკისა
    და ღამისთევის საფასური ცენტრშივე იხდება. თან იქონიეთ წყალი, საკვები, ქარგაუმტარი ქურთუკი და ნამდვილი
    სალაშქრო ფეხსაცმელი: ქედებზე ამინდი სწრაფად იცვლება, მაღლა კი თოვლი ზაფხულის დასაწყისამდეც რჩება.
    ქსელის დიდ ნაწილზე მობილური კავშირი არ არის. ერთდღიანი გასვლა ცხრა საათამდე დაიწყეთ. ცეცხლი მხოლოდ
    მონიშნულ ადგილებში დაანთეთ, ნაგავი კი ბოლომდე თან წაიღეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კილომეტრია, იქიდან S8-ით სამხრეთისკენ
    ბორჯომამდე — ვიზიტორთა ცენტრამდე სულ 165 კილომეტრი, დაახლოებით 2 საათი და 30 წუთი. ლიკანის ბილიკების
    სათავეები ქალაქის დასავლეთ განაპირას, ასფალტზეა. პარკის სხვა შესასვლელებამდე გზები ნაწილობრივ ხრეშიანია
    და წვიმის შემდეგ ღრმა ღარები ჩნდება, ამიტომ აქ ჯიპი გონივრული არჩევანია. საწვავისა და საყიდლების ბოლო
    ადგილი ამ მხარეს ბორჯომია — ბილიკების სათავეებთან არაფერია. მანქანა მხოლოდ სტარტამდე მიგიყვანთ: პარკი
    ფეხით ილაშქრება.
en:
  name: Borjomi-Kharagauli National Park
  short: >-
    More than one per cent of Georgia under forest and meadow, crossed by marked trails with mountain
    shelters, beginning at the edge of Borjomi.
  body: >-
    **The protection of this forest began with a grand duke who wanted it for himself.**


    In the Middle Ages these slopes were hunting grounds for the Georgian nobility. When Grand Duke Mikhail
    Nikolayevich, the Tsar's viceroy in the Caucasus, took possession of Borjomi in 1871, he forbade logging
    and hunting without his permission, and in doing so kept this forest intact for the park that came
    more than a century later.


    That park was founded in 1995 with the support of WWF and the German government and officially opened
    in 2001, the first protected area in the Caucasus built to international standards. It reaches from
    the resort of Borjomi to the town of Kharagauli across six municipalities and three regions, and together
    with the Borjomi Strict Nature Reserve it covers more than one per cent of Georgia.


    This is not a place to see from the car. Its trail network climbs from about 400 metres to 2,642,
    from river valleys through the dense mixed forest of the Lesser Caucasus to open subalpine meadows.
    On the way are overnight shelters, picnic spots and campsites, relict groves of yew, and animals that
    include lynx and Caucasian grouse. An hour from the spa-town promenade the phone signal fades and
    the only sound is water.


    The park carries scars too. The Baku–Tbilisi–Ceyhan oil pipeline skirts its edge, and in August 2008
    more than three square kilometres of forest burned; Georgia called it deliberate destruction by Russia.


    The grand duke closed this forest so that he could hunt in it. The park has opened it again to anyone
    willing to walk it, on one condition: that they leave it exactly as they found it.
  tip: >-
    Begin at the visitor centre at 23 Meskheti Street in Borjomi (there is another in Kharagauli). Register
    there, pick up a map, ask which sections are open, and book shelter bunks and guides; fees for trails
    and overnight stays are paid at the centre. Carry water, food, a windproof layer and proper boots,
    because the weather turns fast on the ridges and snow can linger high up into early summer. Much of
    the network has no phone signal. Start day walks by nine. Light fires only at marked sites, and carry
    every scrap of rubbish out.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south into Borjomi: 165 km
    and about 2 hours 30 minutes to the visitor centre. The Likani trailheads on the western edge of town
    are on asphalt. The roads to the park's other gates are partly gravel and develop deep ruts after
    rain, which is why an SUV is the sensible choice here. Borjomi is the last place for fuel and shopping
    on this side; there is nothing at the trailheads. The car only gets you to the start: the park itself
    is walked.
ru:
  name: Боржоми-Харагаульский национальный парк
  short: >-
    Больше одного процента территории Грузии — леса и луга, прорезанные маркированными тропами с горными
    приютами; начинается парк прямо на окраине Боржоми.
  body: >-
    **Охрана этого леса началась с великого князя, который хотел оставить его себе.**


    В Средние века эти склоны были охотничьими угодьями грузинской знати. Когда в 1871 году великий князь
    Михаил Николаевич, царский наместник на Кавказе, вступил во владение Боржоми, он запретил рубить лес
    и охотиться без его разрешения — и тем самым сохранил этот лес нетронутым для парка, появившегося
    больше века спустя.


    Сам парк основан в 1995 году при поддержке Всемирного фонда природы и правительства Германии и официально
    открыт в 2001-м — первая охраняемая территория на Кавказе, созданная по международным стандартам.
    Он тянется от курорта Боржоми до города Харагаули через шесть муниципалитетов и три региона, а вместе
    с Боржомским заповедником занимает больше одного процента площади Грузии.


    Это место не для того, чтобы смотреть на него из окна машины. Сеть троп поднимается примерно с 400
    метров до 2642: от речных долин через густой смешанный лес Малого Кавказа к открытым субальпийским
    лугам. По пути встречаются приюты для ночёвки, места для пикника и кемпинги, реликтовые тисовые рощи,
    а среди обитателей парка — рысь и кавказский тетерев. В часе пути от курортного променада пропадает
    связь, и слышна только вода.


    Есть у парка и шрамы. По его краю проходит нефтепровод Баку — Тбилиси — Джейхан, а в августе 2008
    года здесь сгорело больше трёх квадратных километров леса; Грузия назвала это умышленным уничтожением
    со стороны России.


    Великий князь закрыл этот лес, чтобы охотиться в нём. Парк снова открыл его для всех, кто готов пройти
    его пешком, — с одним условием: оставить его ровно таким, каким его застали.
  tip: >-
    Начните с визит-центра на улице Месхети, 23 в Боржоми (второй есть в Харагаули). Там нужно зарегистрироваться,
    взять карту, узнать, какие участки открыты, и забронировать места в приютах и гидов; плата за тропы
    и ночёвки вносится в центре. Несите с собой воду, еду, ветрозащитный слой и нормальные треккинговые
    ботинки: на гребнях погода меняется быстро, а наверху снег может лежать до начала лета. На большей
    части маршрутов нет связи. На однодневные прогулки выходите до девяти. Костры разводите только в отмеченных
    местах и уносите с собой весь мусор до последней обёртки.
  route: >-
    Из Тбилиси по E60/S1 на запад до Хашури — около 130 км, затем по S8 на юг в Боржоми: 165 км и около
    2 часов 30 минут до визит-центра. К началу троп в Ликани, на западной окраине города, ведёт асфальт.
    Дороги к другим входам в парк частично гравийные и после дождя покрываются глубокими колеями, поэтому
    разумный выбор здесь — внедорожник. Боржоми — последнее место с этой стороны, где можно заправиться
    и купить продукты; у начала троп нет ничего. Машина лишь доставит вас к старту: сам парк проходят
    пешком.
fa:
  name: پارک ملی بورجومی-خاراگاولی
  short: >-
    بیش از یک درصد خاک گرجستان در زیر جنگل و مرتع، با مسیرهای نشانه‌گذاری‌شده و پناهگاه‌های کوهستانی،
    که درست از حاشیهٔ بورجومی آغاز می‌شود.
  body: >-
    **حفاظت از این جنگل با دوک بزرگی آغاز شد که آن را برای خودش می‌خواست.**


    در سده‌های میانه این دامنه‌ها شکارگاه اشراف گرجی بود. وقتی دوک بزرگ میخائیل نیکولایویچ، نایب‌السلطنهٔ
    تزار در قفقاز، در ۱۸۷۱ بورجومی را به تملک درآورد، قطع درختان و شکار بدون اجازهٔ خودش را ممنوع کرد
    و با همین کار این جنگل را برای پارکی که بیش از یک قرن بعد پدید آمد دست‌نخورده نگه داشت.


    آن پارک در ۱۹۹۵ با پشتیبانی صندوق جهانی طبیعت و دولت آلمان بنیان گذاشته شد و در ۲۰۰۱ رسماً گشایش یافت:
    نخستین منطقهٔ حفاظت‌شده در قفقاز که بر پایهٔ استانداردهای بین‌المللی ساخته شد. از تفرجگاه بورجومی
    تا شهر خاراگاولی، در شش شهرستان و سه منطقه گسترده است و همراه با ذخیره‌گاه طبیعی حفاظت‌شدهٔ بورجومی
    بیش از یک درصد خاک گرجستان را در بر می‌گیرد.


    اینجا جایی نیست که از پشت شیشهٔ خودرو تماشایش کنید. شبکهٔ مسیرهایش از حدود ۴۰۰ متر تا ۲۶۴۲ متر بالا
    می‌رود، از دره‌های رودخانه‌ای، از میان جنگل انبوه و آمیختهٔ قفقاز کوچک، تا مراتع باز زیرآلپی. در راه
    پناهگاه‌هایی برای شب‌مانی، جاهایی برای پیک‌نیک و محل‌های کمپینگ هست، بیشه‌های کهن‌ماندهٔ سرخدار، و
    جانورانی از جمله سیاه‌گوش و سیاه‌خروس قفقازی. یک ساعت دورتر از گردشگاه شهر آب‌درمانی، آنتن تلفن محو
    می‌شود و تنها صدا، صدای آب است.


    این پارک زخم‌هایی هم بر تن دارد. خط لولهٔ نفت باکو-تفلیس-جیحان از حاشیهٔ آن می‌گذرد، و در اوت ۲۰۰۸
    بیش از سه کیلومتر مربع از جنگل سوخت؛ گرجستان آن را تخریب عمدی به دست روسیه خواند.


    دوک بزرگ این جنگل را بست تا در آن شکار کند. پارک آن را دوباره به روی هر کسی که حاضر باشد پیاده در
    آن گام بزند گشوده است، به یک شرط: که آن را درست همان‌گونه که یافته ترک کند.
  tip: >-
    از مرکز بازدیدکنندگان در خیابان مسختی، شمارهٔ ۲۳، در بورجومی شروع کنید (مرکز دیگری هم در خاراگاولی
    هست). آنجا ثبت‌نام کنید، نقشه بگیرید، بپرسید کدام بخش‌ها بازند، و تخت پناهگاه‌ها و راهنما رزرو کنید؛
    هزینهٔ مسیرها و شب‌مانی در همان مرکز پرداخت می‌شود. آب، غذا، یک لایهٔ بادگیر و پوتین مناسب همراه داشته
    باشید، چون روی خط‌الرأس‌ها هوا زود برمی‌گردد و در ارتفاعات ممکن است برف تا اوایل تابستان بماند. بیشتر
    شبکهٔ مسیرها آنتن تلفن ندارد. پیاده‌روی‌های یک‌روزه را پیش از ساعت نه آغاز کنید. آتش را فقط در جاهای
    مشخص‌شده روشن کنید و هر تکه زباله را با خود بیرون ببرید.
  route: >-
    از تفلیس با E60/S1 به سمت غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس با S8 به جنوب تا بورجومی: ۱۶۵
    کیلومتر و حدود ۲ ساعت و ۳۰ دقیقه تا مرکز بازدیدکنندگان. سرِ مسیرهای لیکانی، در لبهٔ غربی شهر، آسفالت
    است. جاده‌های منتهی به دیگر ورودی‌های پارک تا حدی شنی‌اند و پس از باران شیارهای عمیق برمی‌دارند؛ برای
    همین اینجا خودروی شاسی‌بلند انتخاب عاقلانه است. بورجومی آخرین جای سوخت‌گیری و خرید در این سوست؛ سرِ
    مسیرها هیچ‌چیز نیست. خودرو فقط شما را به نقطهٔ آغاز می‌رساند: خود پارک را باید پیاده پیمود.
he:
  name: הפארק הלאומי בורג'ומי-חראגאולי
  short: >-
    יותר מאחוז אחד משטחה של גאורגיה, מכוסה יער ואחו וחצוי בשבילים מסומנים עם בקתות הרים, ומתחיל ממש בשולי
    בורג'ומי.
  body: >-
    **ההגנה על היער הזה התחילה בדוכס גדול שרצה אותו לעצמו.**


    בימי הביניים שימשו המדרונות האלה שטחי ציד לאצולה הגאורגית. כשהדוכס הגדול מיכאיל ניקולאייביץ', המשנה
    למלך מטעם הצאר בקווקז, קיבל לידיו את בורג'ומי ב-1871, הוא אסר על כריתת עצים ועל ציד ללא רשותו, ובכך
    שמר על היער הזה שלם עבור הפארק שקם יותר ממאה שנה לאחר מכן.


    הפארק נוסד ב-1995 בתמיכת הקרן העולמית לטבע וממשלת גרמניה, ונפתח רשמית ב-2001 – השטח המוגן הראשון בקווקז
    שהוקם לפי סטנדרטים בינלאומיים. הוא משתרע מעיירת הנופש בורג'ומי ועד העיירה חראגאולי, על פני שש רשויות
    מקומיות ושלושה מחוזות, ויחד עם שמורת הטבע המוחלטת של בורג'ומי הוא מכסה יותר מאחוז אחד משטחה של גאורגיה.


    זה לא מקום להתבונן בו מחלון המכונית. רשת השבילים שלו מטפסת מגובה של כ-400 מטר ועד 2,642 מטר, מעמקי
    נהרות, דרך היער המעורב והסבוך של הקווקז הקטן, ועד כרי דשא פתוחים באזור התת-אלפיני. לאורך הדרך יש בקתות
    לינה, פינות פיקניק ואתרי קמפינג, חורשות שריד של טקסוס, ובעלי חיים ובהם שונר ותרנגול-הבר הקווקזי. במרחק
    שעה מן הטיילת של עיירת המרפא, קליטת הטלפון נמוגה, והקול היחיד הוא קול המים.


    גם צלקות יש לפארק. צינור הנפט באקו–טביליסי–ג'יהאן עובר בשוליו, ובאוגוסט 2008 נשרפו יותר משלושה קילומטרים
    רבועים של יער; גאורגיה כינתה זאת הרס מכוון מצד רוסיה.


    הדוכס הגדול סגר את היער הזה כדי שיוכל לצוד בו. הפארק פתח אותו מחדש לכל מי שמוכן לצעוד בו ברגל, בתנאי
    אחד: שישאיר אותו בדיוק כפי שמצא אותו.
  tip: >-
    התחילו במרכז המבקרים ברחוב מסחתי 23 בבורג'ומי (יש מרכז נוסף בחראגאולי). הירשמו שם, קחו מפה, בררו אילו
    קטעים פתוחים, והזמינו מקומות בבקתות ומדריכים; את דמי השבילים והלינה משלמים במרכז. קחו מים, אוכל, שכבה
    חוסמת רוח ונעלי הליכה ראויות, כי מזג האוויר על הרכסים מתהפך מהר, ובגבהים עלול השלג להחזיק מעמד עד
    תחילת הקיץ. ברוב רשת השבילים אין קליטה סלולרית. צאו לטיולי יום עד השעה תשע. הדליקו אש רק במקומות המסומנים,
    והוציאו איתכם כל פיסת אשפה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק"מ, ואז דרומה בכביש S8 אל בורג'ומי: 165 ק"מ וכ-2
    שעות ו-30 דקות עד מרכז המבקרים. לראשי השבילים של ליקאני, בקצה המערבי של העיר, מגיע כביש סלול. הדרכים
    אל שערי הפארק האחרים הן בחלקן דרכי חצץ, ואחרי גשם נחרצים בהן תלמים עמוקים, ולכן כאן רכב שטח הוא הבחירה
    הנבונה. בורג'ומי היא המקום האחרון בצד הזה לתדלק ולקנות מצרכים; בראשי השבילים אין דבר. המכונית רק מביאה
    אתכם לנקודת ההתחלה: את הפארק עצמו עוברים ברגל.
ar:
  name: منتزه بورجومي-خاراغاولي الوطني
  short: >-
    أكثر من واحد في المئة من مساحة جورجيا تكسوه الغابات والمروج، تخترقه دروب معلَّمة فيها ملاجئ جبلية،
    ويبدأ عند طرف بورجومي مباشرة.
  body: >-
    **بدأت حماية هذه الغابة مع دوق أكبر أرادها لنفسه.**


    في العصور الوسطى كانت هذه المنحدرات ميادين صيد لنبلاء جورجيا. وحين تملّك الدوق الأكبر ميخائيل نيكولايفيتش،
    نائب القيصر في القوقاز، بورجومي عام 1871، منع قطع الأشجار والصيد دون إذنه، فحفظ بذلك هذه الغابة سليمة
    للمنتزه الذي جاء بعد أكثر من قرن.


    تأسس المنتزه عام 1995 بدعم من الصندوق العالمي للطبيعة والحكومة الألمانية، وافتُتح رسميًا عام 2001،
    ليكون أول منطقة محمية في القوقاز أُنشئت وفق المعايير الدولية. ويمتد من منتجع بورجومي إلى بلدة خاراغاولي
    عبر ست بلديات وثلاثة أقاليم، ويغطي مع محمية بورجومي الطبيعية الصارمة أكثر من واحد في المئة من مساحة
    جورجيا.


    هذا ليس مكانًا يُشاهَد من نافذة السيارة. تصعد شبكة دروبه من نحو 400 متر إلى 2642 مترًا، من أودية الأنهار
    عبر الغابة المختلطة الكثيفة في القوقاز الصغير إلى المروج المفتوحة شبه الألبية. وعلى الطريق ملاجئ للمبيت،
    وأماكن للنزهة، ومواقع للتخييم، وأيكات طقسوس متبقية من عصور غابرة، وحيوانات منها الوشق والطيهوج القوقازي.
    وعلى بعد ساعة من كورنيش بلدة المياه المعدنية، تخبو إشارة الهاتف ولا يبقى من صوت سوى صوت الماء.


    وللمنتزه ندوب أيضًا. فخط أنابيب النفط باكو-تبليسي-جيهان يمرّ بمحاذاة طرفه، وفي أغسطس 2008 احترق أكثر
    من ثلاثة كيلومترات مربعة من الغابة؛ ووصفت جورجيا ذلك بأنه تدمير متعمّد من جانب روسيا.


    أغلق الدوق الأكبر هذه الغابة ليصطاد فيها. وقد أعاد المنتزه فتحها لكل من يرغب في أن يجوبها سيرًا، بشرط
    واحد: أن يتركها تمامًا كما وجدها.
  tip: >-
    ابدأ من مركز الزوار في 23 شارع مسخيتي في بورجومي (وهناك مركز آخر في خاراغاولي). سجّل هناك، وخذ خريطة،
    واسأل عن المقاطع المفتوحة، واحجز أسرّة الملاجئ والأدلاء؛ رسوم الدروب والمبيت تُدفع في المركز. احمل
    الماء والطعام وطبقة واقية من الريح وأحذية مشي مناسبة، فالطقس يتقلّب بسرعة على الذُّرى، وقد يبقى الثلج
    في الأعالي حتى أوائل الصيف. معظم الشبكة بلا إشارة هاتف. ابدأ جولات اليوم الواحد قبل التاسعة. لا توقد
    النار إلا في المواقع المحددة، واحمل معك كل قصاصة من النفايات.
  route: >-
    من تبليسي خذ الطريق E60/S1 غربًا حتى خاشوري، نحو 130 كم، ثم S8 جنوبًا إلى بورجومي: 165 كم ونحو ساعتين
    و30 دقيقة حتى مركز الزوار. ويصل الأسفلت إلى نقاط انطلاق دروب ليكاني على الطرف الغربي للبلدة. أما الطرق
    إلى بوابات المنتزه الأخرى فحصوية جزئيًا وتتشكّل فيها أخاديد عميقة بعد المطر، ولهذا فسيارة الدفع الرباعي
    هي الخيار المعقول هنا. بورجومي آخر مكان للتزوّد بالوقود والتسوّق من هذه الجهة؛ ولا شيء عند نقاط الانطلاق.
    السيارة توصلك إلى البداية فقط: أما المنتزه نفسه فلا يُستكشف إلا سيرًا على الأقدام.
