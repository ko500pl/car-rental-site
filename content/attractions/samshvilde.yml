ka:
  name: სამშვილდის ნაქალაქარი
  short: მიტოვებული შუასაუკუნეების ქალაქი ვიწრო კონცხზე ორ კანიონს შორის, ნანგრევებით და შთამბეჭდავი რელიეფით.
  body: >-
    **სამშვილდე რუკაზე ვერ გამოიყურება ისე შთამბეჭდავად, როგორც ადგილზე.** ქალაქი სამკუთხა კონცხზე იდგა,
    რომელსაც ორივე მხრიდან ღრმა ხეობები კვეთს — ხრამი და ჩივჩავი. კლდე თითქმის ვერტიკალურად ეშვება ორივე
    მხარეს და ერთადერთი შესასვლელი ვიწრო ყელია. ბუნებრივი ციხე, რომელსაც კედლები მხოლოდ ერთ ადგილას სჭირდებოდა.


    ქალაქი ანტიკური ხანიდან არსებობდა და ქართული მატიანეები მას ქართლის უძველეს ქალაქებს შორის ასახელებენ.
    XI საუკუნეში სამშვილდე სომხური კვირიკიანთა სამეფოს დედაქალაქი გახდა; 1110 წელს დავით აღმაშენებელმა
    აიღო და ეს იყო მისი პირველი დიდი წარმატება ქვეყნის გაერთიანების გზაზე. მოგვიანებით თემურ-ლენგმა დაანგრია
    და ქალაქი თანდათან დაცარიელდა.


    დღეს კონცხზე გაფანტულია: **სამშვილდის სიონის** ნანგრევები — 759-777 წლების გუმბათოვანი ტაძარი, რომლის
    კედლის წარწერა მაშენებლებს ასახელებს; ქალაქის კედლის მონაკვეთები და კარიბჭე; კლდეში ნაკვეთი სათავსოები
    და სამარხები; აბანოს ნაშთი. 2010-იანი წლების ბოლოდან აქ საქართველოს უნივერსიტეტის ექსპედიცია მუშაობს
    და ყოველ სეზონზე ახალი მონაკვეთი იხსნება.


    სიარული კონცხზე დაახლოებით ორ კილომეტრს იკავებს, ბოლომდე კიდემდე. ხედი ხრამის კანიონში საკმაოდ თავბრუდამხვევია
    და ღობე არსად არის. გაზაფხულზე ველი ყვავილოვანია, ზაფხულში კი მზე დაუნდობელია — ხე თითქმის არ არის.
  tip: >-
    სამი საათი გამოყავით — ნაქალაქარი დიდია და ბილიკები არ არის მონიშნული. კიდეებთან ფრთხილად: ხრამის
    კანიონი მკვეთრად ეშვება და დამცავი ღობე არ არსებობს, ბავშვები ხელით გეჭიროთ. დახურული ფეხსაცმელი აუცილებელია,
    ბალახში ქვები და ხვრელებია. ჩრდილი და წყალი არ არის — ზაფხულში მინიმუმ ორი ლიტრი წამოიღეთ. გვიან შემოდგომაზე
    და გაზაფხულზე ბევრად სასიამოვნოა. ტუალეტი არ არის.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით კოდის გავლით თეთრიწყაროს გზით, შემდეგ სამშვილდის მაჩვენებელზე გაუხვევთ.
    სულ 66 კმ, დაახლოებით საათი და ოცდახუთი წუთი. მთავარი გზა ასფალტია და კარგ მდგომარეობაში; ბოლო ხუთი
    კილომეტრი ხრეშისა და მიწის გზაა, რომელიც წვიმის შემდეგ სრიალდება — მაღალი კლირენსი სასურველია. საწვავი
    კოდაში ან თეთრიწყაროში აიღეთ. მანქანა კონცხის ყელთან რჩება, დანარჩენი ფეხითაა.
en:
  name: Samshvilde
  short: >-
    An abandoned medieval city on a narrow promontory between two canyons, with substantial ruins and
    dramatic ground.
  body: >-
    **Samshvilde looks far less impressive on a map than it does on the ground.** The city stood on a
    triangular promontory cut on both sides by deep gorges, those of the Khrami and the Chivchavi. The
    rock drops almost vertically on either flank, and the only approach is a narrow neck of land. It is
    a natural fortress that needed walls in one place only.


    The site was inhabited from antiquity, and Georgian chronicles list it among the oldest cities of
    Kartli. In the 11th century Samshvilde became the capital of the Armenian Kiurikian kingdom; in 1110
    David the Builder took it, his first major success on the road to unifying the country. Timur later
    destroyed it, and the city emptied out over the following centuries.


    Scattered across the promontory today are the ruins of **Samshvilde Sioni**, a domed cathedral of
    759-777 whose wall inscription names its builders; sections of city wall and a gate; rock-cut chambers
    and tombs; and the remains of a bathhouse. A University of Georgia expedition has been excavating
    since the late 2010s and a new section opens most seasons.


    Walking out to the far tip and back is around two kilometres. The view down into the Khrami canyon
    is genuinely vertiginous, and there is no railing anywhere. In spring the plateau is full of flowers;
    in summer the sun is merciless, since there is almost no tree cover.
  tip: >-
    Allow three hours — the site is large and the paths are unmarked. Take real care near the edges: the
    Khrami canyon drops sharply and nothing is fenced, so hold on to children. Closed shoes are essential;
    stones and open shafts hide in the grass. There is no shade and no water, so carry at least two litres
    in summer. Late autumn and spring are much more comfortable. There are no toilets.
  route: >-
    Head southwest from Tbilisi through Koda on the Tetritskaro road, then turn off at the sign for Samshvilde.
    Sixty-six kilometres in all, about an hour and twenty-five minutes. The main road is asphalt and in
    good condition; the last five kilometres are gravel and dirt that turn slippery after rain, so decent
    ground clearance helps. Refuel in Koda or Tetritskaro. Cars are left at the neck of the promontory
    and the rest is on foot.
ru:
  name: Самшвилде
  short: >-
    Заброшенный средневековый город на узком мысу между двумя каньонами, с внушительными руинами и драматичным
    рельефом.
  body: >-
    **На карте Самшвилде выглядит гораздо скромнее, чем на местности.** Город стоял на треугольном мысу,
    с двух сторон срезанном глубокими ущельями — Храми и Чивчави. Скала обрывается почти отвесно с обоих
    флангов, и единственный подход — узкий перешеек. Природная крепость, которой стены понадобились лишь
    в одном месте.


    Место было обитаемо с античности, и грузинские летописи называют его среди древнейших городов Картли.
    В XI веке Самшвилде стал столицей армянского Кюрикидского царства; в 1110 году его взял Давид Строитель
    — это был его первый крупный успех на пути к объединению страны. Позже город разрушил Тимур, и в следующие
    столетия он опустел.


    Сегодня по мысу разбросаны руины **Самшвилдского Сиони** — купольного собора 759-777 годов, надпись
    на стене которого называет строителей; отрезки городской стены и ворота; вырубленные в скале помещения
    и гробницы; остатки бани. С конца 2010-х здесь копает экспедиция Университета Грузии, и почти каждый
    сезон открывается новый участок.


    Прогулка до дальнего края и обратно — около двух километров. Вид вниз, в каньон Храми, по-настоящему
    головокружителен, и ограждений нет нигде. Весной плато в цветах; летом солнце беспощадно, деревьев
    почти нет.
  tip: >-
    Заложите три часа: площадь большая, тропы не размечены. У краёв будьте по-настоящему осторожны: каньон
    Храми обрывается резко, ограждений нет, детей держите за руку. Закрытая обувь обязательна — в траве
    камни и открытые провалы. Тени и воды нет, летом берите минимум два литра. Поздняя осень и весна гораздо
    комфортнее. Туалетов нет.
  route: >-
    Из Тбилиси на юго-запад через Кода по дороге на Тетрицкаро, затем поворот по указателю на Самшвилде.
    Всего 66 км, примерно час двадцать пять. Основная дорога асфальтированная и в хорошем состоянии; последние
    пять километров — гравий и грунт, после дождя скользкие, так что приличный клиренс не помешает. Заправляйтесь
    в Кода или Тетрицкаро. Машины оставляют у перешейка, дальше пешком.
fa:
  name: سامشویلده
  short: شهری متروک از سده‌های میانه بر زبانه‌ای باریک میان دو درّه، با ویرانه‌های چشمگیر و زمینی نفس‌گیر.
  body: >-
    **سامشویلده روی نقشه بسیار کم‌اهمیت‌تر از آن می‌نماید که در محل هست.** شهر بر زبانه‌ای مثلثی ایستاده
    بود که از دو سو درّه‌های ژرف خرامی و چیوچاوی آن را بریده‌اند. صخره از هر دو پهلو تقریباً عمودی فرو
    می‌ریزد و تنها راه ورود، گردنی باریک از خشکی است. دژی طبیعی که تنها در یک نقطه به دیوار نیاز داشت.


    این محل از دوران باستان مسکون بود و تواریخ گرجی آن را در شمار کهن‌ترین شهرهای کارتلی می‌آورند. در
    سدهٔ یازدهم سامشویلده پایتخت پادشاهی ارمنی کیوریکیان شد؛ و در ۱۱۱۰ داوید سازنده آن را گرفت، نخستین
    کامیابی بزرگ او در راه یکپارچه کردن کشور. سپس تیمور ویرانش کرد و شهر در سده‌های بعد خالی شد.


    امروز بر زبانه پراکنده است: ویرانه‌های **سیونی سامشویلده**، کلیسای جامع گنبدداری از سال‌های ۷۵۹ تا
    ۷۷۷ که کتیبهٔ دیوارش نام سازندگان را می‌برد؛ بخش‌هایی از دیوار شهر و یک دروازه؛ اتاق‌ها و گورهای کنده
    در سنگ؛ و بازماندهٔ یک گرمابه. از اواخر دههٔ ۲۰۱۰ هیئتی از دانشگاه گرجستان اینجا کاوش می‌کند و در
    بیشتر فصل‌ها بخشی تازه گشوده می‌شود.


    پیاده‌روی تا نوک دور و بازگشت حدود دو کیلومتر است. نگاه به پایین، به درّهٔ خرامی، به‌راستی سرگیجه‌آور
    است و هیچ‌جا نرده‌ای نیست. بهار فلات پر از گل است؛ تابستان آفتاب بی‌رحم است، چون درختی در کار نیست.
  tip: >-
    سه ساعت در نظر بگیرید — محوطه بزرگ است و مسیرها علامت ندارند. نزدیک لبه‌ها واقعاً محتاط باشید: درّهٔ
    خرامی به‌تندی فرو می‌افتد و هیچ حفاظی نیست، پس دست کودکان را نگه دارید. کفش بسته ضروری است؛ سنگ‌ها
    و چاه‌های باز در علف پنهان‌اند. سایه و آب نیست، پس در تابستان دست‌کم دو لیتر آب همراه ببرید. اواخر
    پاییز و بهار بسیار راحت‌ترند. سرویس بهداشتی وجود ندارد.
  route: >-
    از تفلیس به جنوب‌غرب از کودا روی جادهٔ تتریتسکارو بروید، سپس سر تابلوی سامشویلده بپیچید. روی‌هم ۶۶
    کیلومتر، حدود یک ساعت و بیست‌وپنج دقیقه. جادهٔ اصلی آسفالت و در وضعیت خوبی است؛ پنج کیلومتر پایانی
    شن و خاک است که پس از باران لغزنده می‌شود، پس ارتفاع مناسب از زمین کمک می‌کند. سوخت را در کودا یا
    تتریتسکارو بگیرید. خودروها را در گردنِ زبانه می‌گذارند و باقی راه پیاده است.
he:
  name: סמשווילדה
  short: עיר נטושה מימי הביניים על לשון סלע צרה בין שני קניונים, עם חורבות נרחבות ושטח דרמטי.
  body: >-
    **סמשווילדה נראית על מפה הרבה פחות מרשימה מכפי שהיא בשטח.** העיר עמדה על לשון משולשת שנחתכת משני צדדיה
    בערוצים עמוקים, של החראמי ושל הצ'יבצ'אווי. הסלע צונח כמעט אנכית משני האגפים, והגישה היחידה היא צוואר
    קרקע צר. מבצר טבעי שנזקק לחומות במקום אחד בלבד.


    האתר היה מיושב מן העת העתיקה, והכרוניקות הגאורגיות מונות אותו בין הערים העתיקות של קרתלי. במאה ה-11
    הפכה סמשווילדה לבירת ממלכת קיוריקיאן הארמנית; ב-1110 כבש אותה דוד הבנאי, הצלחתו הגדולה הראשונה בדרך
    לאיחוד הארץ. אחר כך החריב אותה תימור, והעיר התרוקנה במאות שלאחר מכן.


    פזורים היום על הלשון: חורבות **סמשווילדה סיוני**, קתדרלה מכופפת מן השנים 759-777 שכתובת על קירה נוקבת
    בשמות בוניה; קטעי חומת עיר ושער; חדרים וקברים חצובים בסלע; ושרידי בית מרחץ. משלחת של אוניברסיטת גאורגיה
    חופרת כאן מאז שלהי שנות העשרה, ובכל עונה כמעט נפתח קטע חדש.


    ההליכה עד הקצה הרחוק וחזרה היא כשני קילומטרים. המבט מטה אל קניון החראמי מסחרר באמת, ואין מעקה בשום
    מקום. באביב הרמה מלאה פרחים; בקיץ השמש חסרת רחמים, שכן כמעט אין עצים.
  tip: >-
    הקצו שלוש שעות — האתר גדול והשבילים אינם מסומנים. היזהרו באמת ליד השוליים: קניון החראמי צונח בחדות
    ושום דבר אינו מגודר, לכן החזיקו ילדים ביד. נעליים סגורות הכרחיות; אבנים ופירים פתוחים מסתתרים בעשב.
    אין צל ואין מים, לכן קחו לפחות שני ליטרים בקיץ. סוף הסתיו והאביב נוחים בהרבה. אין שירותים.
  route: >-
    צאו מטביליסי דרום-מערבה דרך קודה בכביש לתטריצקארו, ואז פנו בשילוט לסמשווילדה. 66 ק״מ בסך הכול, כשעה
    ועשרים וחמש. הכביש הראשי סלול ובמצב טוב; חמשת הקילומטרים האחרונים הם חצץ ועפר שנעשים חלקלקים אחרי
    גשם, ולכן מרווח גחון סביר עוזר. תדלקו בקודה או בתטריצקארו. את הרכב משאירים בצוואר הלשון והשאר ברגל.
ar:
  name: سامشفيلده
  short: مدينة مهجورة من العصور الوسطى على لسان صخري ضيق بين واديين سحيقين، بأطلال واسعة وأرض مهيبة.
  body: >-
    **تبدو سامشفيلده على الخريطة أقل إثارة بكثير مما هي عليه في الموقع.** قامت المدينة على لسان مثلث يقطعه
    من جانبيه واديان عميقان، وادي خرامي ووادي تشيفتشافي. وينحدر الصخر شبه عمودي على الجناحين، والمدخل
    الوحيد عنق ضيق من الأرض. حصن طبيعي لم يحتج أسواراً إلا في موضع واحد.


    كان الموقع مأهولاً منذ العصور القديمة، وتذكره الحوليات الجورجية بين أقدم مدن كارتلي. وفي القرن الحادي
    عشر صارت سامشفيلده عاصمة مملكة كيوريكيان الأرمنية؛ وفي 1110 استولى عليها داوود البنّاء، وكان ذلك نجاحه
    الكبير الأول في طريق توحيد البلاد. ثم دمّرها تيمور، وأخذت المدينة تخلو في القرون التالية.


    وينتشر اليوم على اللسان: أطلال **سيوني سامشفيلده**، وهي كاتدرائية مقببة من سنوات 759-777 يذكر نقش
    على جدارها أسماء بنّائيها؛ ومقاطع من سور المدينة وبوابة؛ وغرف وقبور منحوتة في الصخر؛ وبقايا حمّام.
    وتنقّب بعثة من جامعة جورجيا هنا منذ أواخر عقد 2010، ويُفتح قطاع جديد في معظم المواسم.


    والمشي حتى الطرف البعيد والعودة نحو كيلومترين. والنظر إلى أسفل داخل وادي خرامي مُدوّخ فعلاً، ولا درابزين
    في أي موضع. وفي الربيع تمتلئ الهضبة بالأزهار؛ وفي الصيف تكون الشمس بلا رحمة إذ لا شجر يُذكر.
  tip: >-
    خصّص ثلاث ساعات — الموقع واسع والمسارات غير معلّمة. واحذر جدياً قرب الحواف: فوادي خرامي ينحدر بحدة
    ولا شيء مسيّج، فأمسك أيدي الأطفال. والحذاء المغلق ضروري؛ فالحجارة والفتحات المكشوفة تختبئ في العشب.
    ولا ظل ولا ماء، فاحمل لترين على الأقل في الصيف. وأواخر الخريف والربيع أكثر راحة بكثير. ولا دورات مياه.
  route: >-
    اتجه جنوب غرب من تبليسي عبر كودا على طريق تيتريتسكارو، ثم انعطف عند لافتة سامشفيلده. ستة وستون كيلومتراً
    إجمالاً، نحو ساعة وخمس وعشرين دقيقة. الطريق الرئيسي معبّد وبحالة جيدة؛ والكيلومترات الخمسة الأخيرة
    حصى وتراب تصير زلقة بعد المطر، فارتفاع مناسب عن الأرض يساعد. تزوّد بالوقود في كودا أو تيتريتسكارو.
    وتُترك السيارات عند عنق اللسان والباقي سيراً.
