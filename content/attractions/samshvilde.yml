ka:
  name: სამშვილდის ნაქალაქარი
  short: >-
    2,5 კილომეტრის სიგრძის ნაქალაქარი ხრამისა და ჩივჩავის ხეობების შესართავთან, სამკუთხა კონცხზე: ძველი
    ქართლის ციხე-ქალაქი, 1440 წელს აოხრებული.
  body: >-
    **სამშვილდეს გალავანი მხოლოდ ერთ ადგილას სჭირდებოდა — ყველგან სხვაგან კლდე ხრამისა და ჩივჩავის ხეობებში
    ციცაბოდ ეშვება.**


    ნანგრევები 2,5 კილომეტრზეა გადაჭიმული და სიგანით 400 მეტრამდე აღწევს. ისინი სამკუთხა კონცხს ფარავს,
    სადაც ორი მდინარე ერთვის ერთმანეთს: აღმოსავლეთით ციტადელია, დასავლეთით თავად ქალაქი, მათ შორის კი
    გალავნიანი ციხე. აქ ადამიანი ჯერ კიდევ ადრებრინჯაოს ხანიდან, ძვ. წ. IV–III ათასწლეულებიდან ცხოვრობდა.
    ქართული მატიანეები სამშვილდეს ქართლის უძველეს ქალაქთა შორის ასახელებს; გადმოცემით, მას ოდესღაც ორბი
    ერქვა, ქართლოსს დაუარსებია და ალექსანდრე მაკედონელს ალყა შემოურტყამს. VII საუკუნეში სომეხმა გეოგრაფმა
    ანანია შირაკაცმა ის თბილისსა და მცხეთასთან ერთად ქვეყნის სამ მთავარ ქალაქად მოიხსენია.


    მას ყველა ეცილებოდა. X საუკუნის 90-იან წლებში სომეხმა კვირიკიანმა მეფეებმა იგი თავიანთ დედაქალაქად
    აქციეს; 1064 წელს ბაგრატ IV-მ საქართველოს დაუბრუნა; დაახლოებით 1074 წლიდან თურქ-სელჩუკებს ეპყრათ,
    1110 წლამდე, როცა ჭყონდიდელმა ეპისკოპოსმა გიორგიმ დავით აღმაშენებლის სახელით აიღო. გადამწყვეტი დარტყმა
    1440 წელს დაატყდა: ყარა-ყოიუნლუს მმართველმა ჯაჰან-შაჰმა ქალაქი ვერაგობით აიღო და მოსახლეობა ამოწყვიტა;
    მემატიანე თომა მეწოფელი წერს, რომ ქალაქის კარიბჭესთან 1664 მოკვეთილი თავისგან კოშკი აღმართეს. სამშვილდე
    ციხედ კიდევ დიდხანს იდგა, 1751 წელს ერეკლე II-ს დანებდა, შემდეგ კი თანდათან ნანგრევად იქცა.


    მთავარი ღირსშესანიშნაობა სიონია — დანგრეული გუმბათოვანი ტაძარი. აღმოსავლეთ ფასადის წარწერა, რომელშიც
    ბიზანტიის იმპერატორები კონსტანტინე V და ლეონ IV არიან მოხსენიებული, მას დაახლოებით 759–777 წლებით
    ათარიღებს, თუმცა გადმოცემა მის აგებას V საუკუნის დედოფალ საგდუხტს მიაწერს. გალავნის შიგნით მოძებნეთ
    პატარა მიძინების ეკლესია: მასში დგას წინაისტორიული შავი მენჰირი, სანთლის კვამლით გაბოლილი, რომელზეც
    XI საუკუნეში ჯვარი და მთავარ სმბატის მომხსენიებელი სომხური წარწერა ამოკვეთეს.


    კონცხის წვერზე დადექით, ქვემოთ, სიღრმეში, ხრამი მოჩანს — და მაშინვე მიხვდებით, რატომ ეცილებოდა ამ
    ადგილს ყველა და რატომ ვერავინ შეინარჩუნა.
  tip: >-
    სამი საათი გამოყავით: ნაქალაქარი დიდია, ბილიკები მონიშნული არ არის, საუკეთესო ხედი კი კონცხის ბოლოშია.
    არაფერია შემოღობილი და კანიონის კიდეები ციცაბოა — ბავშვებს ხელი არ გაუშვათ. დახურული ფეხსაცმელი ჩაიცვით:
    ბალახში ქვები და ღია ორმოები იმალება. ჩრდილი, წყალი და ტუალეტი არ არის; ზაფხულში მინიმუმ ორი ლიტრი
    წყალი წაიღეთ. გაზაფხული, როცა პლატო ყვავილობს, და შემოდგომა ივლისზე გაცილებით ლმობიერია. შესვლა უფასოა,
    სამუშაო დღეს კი შესაძლოა მთელი ქალაქი მხოლოდ თქვენ დაგრჩეთ.
  route: >-
    თბილისიდან ს6-ით სამხრეთით, მარნეულის მიმართულებით გადით, შემდეგ შ31-ზე გადაუხვიეთ და კოდის გავლით
    შ34-ით თეთრიწყარომდე იარეთ. ქალაქის გასვლისთანავე შ35-ით ბოლნისის მიმართულებით დაახლოებით სამი კილომეტრი
    გაიარეთ და სამშვილდისკენ მიმავალ შ167-ზე გადაუხვიეთ. სულ დაახლოებით 66 კმ-ია, საათი და ოცდახუთი წუთი.
    გზის უმეტესი ნაწილი ასფალტიანია, ბოლო რამდენიმე კილომეტრი კი ხრეშიანი და გრუნტიანია, წვიმის შემდეგ
    მოლიპული, ამიტომ კლირენსს მნიშვნელობა აქვს და ჯიპი ყველაზე საიმედო არჩევანია. საწვავი თეთრიწყაროში
    ჩაასხით. მანქანა კონცხის ყელთან რჩება, დანარჩენი ფეხით უნდა გაიაროთ.
en:
  name: Samshvilde
  short: >-
    A ruined city 2.5 km long on a triangular promontory where the Khrami and Chivchavi gorges meet: ancient
    Kartli's stronghold, sacked in 1440.
  body: >-
    **Samshvilde needed walls in only one place; everywhere else the rock drops sheer into the gorges
    of the Khrami and the Chivchavi.**


    The ruins run for 2.5 kilometres, up to 400 metres wide, across the triangular promontory where the
    two rivers meet: the citadel to the east, the city proper to the west, the walled fortress between.
    People lived here from the Early Bronze Age, in the 4th–3rd millennia BC. Georgian chronicles count
    Samshvilde among the oldest cities of Kartli, and tradition says it was once called Orbi, founded
    by Kartlos and besieged by Alexander the Great. The 7th-century Armenian geographer Anania Shirakatsi
    ranked it with Tbilisi and Mtskheta as the country's three main towns.


    Everyone wanted it. In the 990s the Armenian Kiurikid kings made it their capital; Bagrat IV won it
    for Georgia in 1064; the Seljuks held it from about 1074 until 1110, when Bishop George of Chqondidi
    took it for David the Builder. The blow that broke it fell in 1440: Jahan Shah of the Kara Koyunlu
    took the city by deceit and massacred its people, and the chronicler Thomas of Metsoph wrote of a
    tower of 1,664 severed heads at the gate. Samshvilde lingered as a fortress, surrendered to Erekle
    II in 1751, and afterwards fell into ruin.


    The landmark is the Sioni, a ruined domed church. An inscription on its east facade naming the Byzantine
    emperors Constantine V and Leo IV dates it to about 759–777, though legend credits it to the 5th-century
    queen Sagdukht. Seek out the small Dormition church inside the fortress walls: in it stands a prehistoric
    black menhir, sooty from candles, carved in the 11th century with a cross and an Armenian inscription
    naming a prince Smbat.


    Stand at the tip with the Khrami far below and you see at once why everyone wanted this place, and
    why no one could keep it.
  tip: >-
    Allow three hours: the site is large, the paths are unmarked and the finest view is at the far tip.
    Nothing is fenced and the canyon edges are sheer, so keep children by the hand. Wear closed shoes,
    since loose stones and open pits hide in the grass. There is no shade, no water and no toilet; carry
    at least two litres in summer. Spring, when the plateau flowers, and autumn are far kinder than July.
    Entry is free, and on a weekday you may have the whole city to yourself.
  route: >-
    Leave Tbilisi south on the S6 towards Marneuli, turn off onto the Sh31 through Koda, then take the
    Sh34 to Tetritskaro. Just beyond the town follow the Sh35 towards Bolnisi for about three kilometres,
    then turn onto the Sh167 approach road to Samshvilde. About 66 km and an hour and twenty-five minutes
    in all. Asphalt carries you most of the way; the last few kilometres are gravel and dirt, slippery
    after rain, so ground clearance matters and an SUV is the safe choice. Refuel in Tetritskaro. You
    leave the car at the neck of the promontory and walk the rest.
ru:
  name: Самшвилде
  short: >-
    Руины города длиной 2,5 км на треугольном мысу у слияния ущелий Храми и Чивчави — твердыня древней
    Картли, разорённая в 1440 году.
  body: >-
    **Стены Самшвилде понадобились лишь в одном месте: со всех остальных сторон скала отвесно обрывается
    в ущелья Храми и Чивчави.**


    Руины тянутся на 2,5 километра при ширине до 400 метров по треугольному мысу, где сходятся две реки:
    цитадель на востоке, собственно город на западе, между ними обнесённая стенами крепость. Люди жили
    здесь ещё с раннего бронзового века, в IV–III тысячелетиях до н. э. Грузинские летописи числят Самшвилде
    среди древнейших городов Картли, а предание гласит, что прежде он звался Орби, был основан Картлосом
    и осаждён Александром Македонским. Армянский географ VII века Анания Ширакаци ставил его в один ряд
    с Тбилиси и Мцхетой как три главных города страны.


    Им хотели владеть все. В 990-х годах армянские цари из династии Кюрикидов сделали его своей столицей;
    в 1064 году Баграт IV добыл его для Грузии; сельджуки удерживали город примерно с 1074 по 1110 год,
    когда епископ Чкондидский Георгий взял его для Давида Строителя. Удар, сломивший Самшвилде, пришёлся
    на 1440 год: Джаханшах из Кара-Коюнлу хитростью овладел городом и вырезал его жителей, а летописец
    Товма Мецопеци писал о башне из 1664 отрубленных голов у ворот. Самшвилде ещё держался как крепость,
    в 1751 году сдался Ираклию II, а затем пришёл в запустение и обратился в руины.


    Главная достопримечательность — Сиони, разрушенный купольный храм. Надпись на его восточном фасаде
    с именами византийских императоров Константина V и Льва IV датирует его примерно 759–777 годами, хотя
    предание приписывает постройку царице V века Сагдухт. Отыщите внутри крепостных стен маленькую церковь
    Успения: в ней стоит доисторический чёрный менгир, закопчённый свечами, на котором в XI веке высекли
    крест и армянскую надпись с именем князя Смбата.


    Встаньте на самом острие мыса, где Храми течёт далеко внизу, и вы сразу поймёте, почему этим местом
    хотели владеть все и почему никто не смог его удержать.
  tip: >-
    Закладывайте три часа: территория большая, тропы не размечены, а лучший вид открывается с дальнего
    острия. Ничего не огорожено, края каньона отвесны, так что держите детей за руку. Надевайте закрытую
    обувь: в траве прячутся камни и открытые ямы. Здесь нет ни тени, ни воды, ни туалета; летом берите
    с собой минимум два литра. Весна, когда плато цветёт, и осень куда милосерднее июля. Вход бесплатный,
    и в будний день весь город может достаться вам одному.
  route: >-
    Выезжайте из Тбилиси на юг по S6 в сторону Марнеули, сверните на Sh31 через Коду, затем по Sh34 до
    Тетрицкаро. Сразу за городом езжайте по Sh35 в сторону Болниси около трёх километров, а потом сверните
    на подъездную дорогу Sh167 к Самшвилде. Всего около 66 км и час двадцать пять минут. Большая часть
    пути идёт по асфальту; последние несколько километров — гравий и грунт, скользкие после дождя, так
    что клиренс важен и надёжнее всего внедорожник или кроссовер. Заправьтесь в Тетрицкаро. Машину оставляют
    у перешейка мыса, дальше — пешком.
fa:
  name: سامشویلده
  short: >-
    ویرانه‌های شهری به طول ۲٫۵ کیلومتر بر دماغه‌ای سه‌گوش، جایی که درّه‌های خرامی و چیوچاوی به هم می‌رسند؛
    دژ کارتلیِ کهن که در ۱۴۴۰ ویران شد.
  body: >-
    **سامشویلده تنها در یک نقطه به دیوار نیاز داشت؛ در هر جای دیگر، صخره یکسره به درون درّه‌های خرامی
    و چیوچاوی فرو می‌افتد.**


    ویرانه‌ها بر دماغهٔ سه‌گوشی که دو رود در آن به هم می‌رسند، ۲٫۵ کیلومتر درازا و تا ۴۰۰ متر پهنا دارند:
    ارگ در شرق، خودِ شهر در غرب و دژ بارودار در میانه. مردم از آغاز عصر مفرغ، در هزاره‌های چهارم و سوم
    پیش از میلاد، اینجا می‌زیستند. وقایع‌نامه‌های گرجی سامشویلده را در شمار کهن‌ترین شهرهای کارتلی می‌آورند
    و روایت‌ها می‌گویند روزگاری «اوربی» نام داشت، کارتلوس بنیانش نهاد و اسکندر مقدونی محاصره‌اش کرد. آنانیا
    شیراکاتسی، جغرافی‌دان ارمنی سدهٔ هفتم، آن را همراه تفلیس و متسختا از سه شهر اصلی کشور شمرده است.


    همه خواهانش بودند. در دههٔ ۹۹۰ میلادی پادشاهان ارمنیِ خاندان کیوریکیان آن را پایتخت خود کردند؛ باگرات
    چهارم در ۱۰۶۴ آن را برای گرجستان به دست آورد؛ سلجوقیان از حدود ۱۰۷۴ تا ۱۱۱۰ نگهش داشتند، تا آنکه اسقف
    گیورگی چقوندیدلی آن را برای داوید سازنده گشود. ضربه‌ای که کمرش را شکست در ۱۴۴۰ فرود آمد: جهانشاه قراقویونلو
    با نیرنگ شهر را گرفت و مردمش را قتل‌عام کرد، و توما متسوپی، وقایع‌نگار، از برجی از ۱۶۶۴ سرِ بریده
    کنار دروازه نوشته است. سامشویلده چندی در مقام دژ دوام آورد، در ۱۷۵۱ تسلیم هراکلیوس دوم (ارکله) شد
    و پس از آن رفته‌رفته به ویرانه‌ای بدل شد.


    نشانهٔ شاخص این مکان سیونی است، کلیسایی گنبددار و ویران. کتیبه‌ای بر نمای شرقی آن که نام امپراتوران
    بیزانس، کنستانتین پنجم و لئون چهارم، را آورده، تاریخ آن را به حدود ۷۵۹ تا ۷۷۷ می‌رساند، هرچند افسانه
    ساختش را به ملکه ساگدوخت در سدهٔ پنجم نسبت می‌دهد. کلیسای کوچکِ خوابِ مریم مقدس را درون باروی دژ پیدا
    کنید: در آن سنگ‌افراشتی سیاه از دوران پیش از تاریخ ایستاده، دوده‌گرفته از شمع‌ها، که در سدهٔ یازدهم
    صلیبی و کتیبه‌ای ارمنی با نام شاهزاده‌ای به نام سمبات بر آن کنده‌اند.


    بر نوک دماغه بایستید، با خرامی در ژرفای پایین، تا به یک نگاه دریابید چرا همه خواهان این مکان بودند،
    و چرا هیچ‌کس نتوانست نگهش دارد.
  tip: >-
    سه ساعت وقت بگذارید: محوطه بزرگ است، کوره‌راه‌ها نشانه‌گذاری نشده‌اند و زیباترین منظره در دورترین
    نوک دماغه است. هیچ جا حصار ندارد و لبه‌های دره عمودی‌اند، پس دست کودکان را رها نکنید. کفش جلوبسته
    بپوشید، چون سنگ‌های لق و گودال‌های باز در میان علف‌ها پنهان‌اند. نه سایه هست، نه آب، نه سرویس بهداشتی؛
    در تابستان دست‌کم دو لیتر آب همراه ببرید. بهار، که فلات گل می‌کند، و پاییز بسیار مهربان‌تر از ماه
    ژوئیه‌اند. ورود رایگان است و در روزهای کاری چه‌بسا کل شهر از آنِ شما باشد.
  route: >-
    از تفلیس با S6 به سوی جنوب و مارنئولی بروید، به جادهٔ Sh31 از راه کودا بپیچید و سپس با Sh34 تا تتری‌تسقارو
    ادامه دهید. کمی پس از شهر، حدود سه کیلومتر در Sh35 به سوی بولنیسی بروید و آن‌گاه به جادهٔ دسترسی Sh167
    به سامشویلده بپیچید. در مجموع حدود ۶۶ کیلومتر و یک ساعت و بیست‌وپنج دقیقه. بیشتر راه آسفالت است؛ چند
    کیلومتر پایانی شنی و خاکی است و پس از باران لغزنده، پس فاصلهٔ کف خودرو از زمین اهمیت دارد و شاسی‌بلند
    انتخاب مطمئن است. در تتری‌تسقارو سوخت‌گیری کنید. خودرو را در گلوگاه دماغه می‌گذارید و باقی راه را
    پیاده می‌روید.
he:
  name: סמשווילדה
  short: >-
    עיר חרבה באורך 2.5 ק"מ על לשון יבשה משולשת במפגש ערוצי החראמי והצ'יבצ'אבי: מבצרה של קרתלי העתיקה,
    שנחרבה ב-1440.
  body: >-
    **סמשווילדה נזקקה לחומות רק במקום אחד; בכל מקום אחר הסלע צונח אנכית אל ערוצי החראמי והצ'יבצ'אבי.**


    החורבות משתרעות לאורך 2.5 קילומטרים וברוחב של עד 400 מטרים על פני לשון היבשה המשולשת שבה נפגשים שני
    הנהרות: המצודה במזרח, העיר עצמה במערב, והמבצר המוקף חומה ביניהן. בני אדם חיו כאן כבר מתקופת הברונזה
    הקדומה, באלפים הרביעי והשלישי לפני הספירה. הכרוניקות הגאורגיות מונות את סמשווילדה בין הערים העתיקות
    ביותר של קרתלי, והמסורת מספרת שבעבר נקראה אורבי, שייסד אותה קרתלוס ושאלכסנדר מוקדון צר עליה. הגאוגרף
    הארמני בן המאה השביעית אנניה שירקצי מנה אותה עם טביליסי ומצחתה כשלוש הערים הראשיות של הממלכה.


    כולם רצו בה. בשנות ה-90 של המאה העשירית הפכו אותה מלכי בית קיוריקה הארמנים לבירתם; ב-1064 זכה בה בגרט
    הרביעי לגאורגיה; הסלג'וקים החזיקו בה מסביבות 1074 ועד 1110, אז כבש אותה הבישוף גיאורגי מצ'קונדידי
    עבור דוד הבונה. המכה ששברה אותה נחתה ב-1440: ג'האן שאה, שליט קארה קויונלו, לקח את העיר בתחבולה וטבח
    בתושביה, והכרוניקן תומא ממצוף כתב על מגדל של 1,664 ראשים כרותים ליד השער. סמשווילדה המשיכה להתקיים
    כמבצר, נכנעה לארקלה השני ב-1751, ולאחר מכן הפכה לחורבה.


    ציון הדרך הבולט הוא הסיוני, כנסיית כיפה הרוסה. כתובת בחזיתה המזרחית, הנוקבת בשמות הקיסרים הביזנטים
    קונסטנטינוס החמישי ולאון הרביעי, מתארכת אותה לשנים 759–777 בקירוב, אף שהאגדה מייחסת אותה למלכה סגדוכט
    בת המאה החמישית. חפשו בתוך חומות המבצר את כנסיית שנת מרים הקטנה: בתוכה עומד מנהיר שחור פרהיסטורי,
    מפויח מעשן נרות, שבמאה ה-11 נחקקו עליו צלב וכתובת ארמנית הנוקבת בשמו של נסיך בשם סמבט.


    עמדו בקצה הלשון, כשהחראמי זורם הרחק למטה, ותבינו מיד מדוע כולם רצו במקום הזה, ומדוע איש לא הצליח להחזיק
    בו.
  tip: >-
    הקצו שלוש שעות: האתר גדול, השבילים אינם מסומנים והנוף היפה ביותר נפתח בקצה הרחוק. שום דבר אינו מגודר
    ושפות הקניון תלולות כקיר, לכן החזיקו ילדים ביד. נעלו נעליים סגורות, כי אבנים רופפות ובורות פתוחים
    מסתתרים בעשב. אין צל, אין מים ואין שירותים; בקיץ קחו לפחות שני ליטרים. האביב, כשהרמה פורחת, והסתיו
    נוחים הרבה יותר מיולי. הכניסה חופשית, וביום חול ייתכן שהעיר כולה תהיה שלכם לבד.
  route: >-
    צאו מטביליסי דרומה בכביש S6 לכיוון מרנאולי, פנו לכביש Sh31 דרך קודה, ואז המשיכו בכביש Sh34 עד טטריצקארו.
    מעט אחרי העיירה סעו בכביש Sh35 לכיוון בולניסי כשלושה קילומטרים, ואז פנו לכביש הגישה Sh167 אל סמשווילדה.
    בסך הכול כ-66 ק"מ ושעה ועשרים וחמש דקות. רוב הדרך סלולה; הקילומטרים האחרונים הם חצץ ועפר, חלקלקים
    אחרי גשם, כך שמרווח גחון חשוב ורכב שטח הוא הבחירה הבטוחה. תדלקו בטטריצקארו. את הרכב משאירים בצוואר
    לשון היבשה, ואת השאר עוברים ברגל.
ar:
  name: سامشفيلدي
  short: >-
    أطلال مدينة طولها 2.5 كم على لسان صخري مثلث حيث يلتقي واديا خرامي وتشيفتشافي: معقل كارتلي القديمة
    الذي دُمّر عام 1440.
  body: >-
    **لم تحتج سامشفيلدي إلى الأسوار إلا في موضع واحد؛ ففي كل ما عداه تهوي الصخرة عمودياً إلى واديي خرامي
    وتشيفتشافي.**


    تمتد الأطلال 2.5 كيلومتر بعرض يصل إلى 400 متر على اللسان المثلث حيث يلتقي النهران: القلعة الداخلية
    في الشرق، والمدينة نفسها في الغرب، والحصن المسوّر بينهما. سكن الناس هنا منذ العصر البرونزي المبكر،
    في الألفيتين الرابعة والثالثة قبل الميلاد. تعدّ الحوليات الجورجية سامشفيلدي من أقدم مدن كارتلي، وتقول
    الروايات المتوارثة إنها كانت تُدعى قديماً أوربي، وإن كارتلوس أسسها وإن الإسكندر الأكبر حاصرها. وقد
    عدّها الجغرافي الأرمني أنانيا الشيراكي، من القرن السابع، واحدةً من المدن الرئيسية الثلاث في البلاد
    إلى جانب تبليسي ومتسخيتا.


    طمع فيها الجميع. في تسعينيات القرن العاشر جعلها الملوك الكيوريكيون الأرمن عاصمتهم؛ وفي عام 1064 انتزعها
    باغرات الرابع لجورجيا؛ وأمسك بها السلاجقة من نحو 1074 حتى 1110، حين استولى عليها الأسقف جيورجي التشقونديدي
    لداود البنّاء. أما الضربة التي كسرتها فجاءت عام 1440: استولى جهان شاه، زعيم القره قويونلو، على المدينة
    بالخديعة وذبح أهلها، وكتب المؤرخ توما الميتسوبي عن برج من 1664 رأساً مقطوعاً عند البوابة. وظلت سامشفيلدي
    قائمة حصناً، واستسلمت لإريكلي الثاني عام 1751، ثم آلت بعد ذلك إلى الخراب.


    المعلم الأبرز هو السيوني، كنيسة مقبّبة متهدمة. ويؤرّخها نقشٌ على واجهتها الشرقية، يذكر الإمبراطورين
    البيزنطيين قسطنطين الخامس وليو الرابع، بنحو الأعوام 759–777، وإن كانت الأسطورة تنسبها إلى الملكة ساغدوخت
    في القرن الخامس. وابحث داخل أسوار الحصن عن الكنيسة الصغيرة المكرّسة لرقاد السيدة العذراء: فيها منهير
    أسود من عصور ما قبل التاريخ، اسودّ من دخان الشموع، نُحت عليه في القرن الحادي عشر صليب ونقش أرمني يذكر
    أميراً يُدعى سمباط.


    قف عند طرف اللسان الصخري وخرامي بعيد في الأسفل، وستدرك على الفور لماذا طمع الجميع في هذا المكان، ولماذا
    لم يستطع أحد الاحتفاظ به.
  tip: >-
    خصّص ثلاث ساعات: الموقع واسع، والدروب غير معلّمة، وأجمل منظر عند الطرف البعيد. لا شيء مسيّج وحواف
    الأخدود عمودية، فأمسك بأيدي الأطفال. البس حذاءً مغلقاً، فالحجارة المفككة والحفر المكشوفة تختبئ في
    العشب. لا ظل ولا ماء ولا دورات مياه؛ احمل لترين على الأقل في الصيف. الربيع، حين تزهر الهضبة، والخريف
    أرحم بكثير من يوليو. الدخول مجاني، وفي أيام العمل قد تحظى بالمدينة كلها وحدك.
  route: >-
    اخرج من تبليسي جنوباً على S6 باتجاه مارنيولي، ثم انعطف إلى Sh31 عبر كودا، ثم Sh34 إلى تيتريتسكارو.
    بعد البلدة مباشرة اتبع Sh35 باتجاه بولنيسي نحو ثلاثة كيلومترات، ثم انعطف إلى طريق الوصول Sh167 المؤدي
    إلى سامشفيلدي. المجموع نحو 66 كم وساعة وخمس وعشرون دقيقة. الأسفلت يحملك معظم الطريق؛ أما الكيلومترات
    القليلة الأخيرة فحصى وتراب، زلقة بعد المطر، لذا يهمّ ارتفاع السيارة عن الأرض، وسيارة الدفع الرباعي
    هي الخيار الآمن. تزوّد بالوقود في تيتريتسكارو. تترك السيارة عند عنق اللسان الصخري وتكمل سيراً على
    الأقدام.
