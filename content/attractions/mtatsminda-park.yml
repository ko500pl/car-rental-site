ka:
  name: მთაწმინდის პარკი და ფუნიკულიორი
  short: ქალაქის თავზე მდებარე გასართობი პარკი, ისტორიული ფუნიკულიორითა და თბილისის ყველაზე ფართო პანორამით.
  body: >-
    **მთაწმინდა თბილისის სახურავია.** 727 მეტრზე მდებარე ქედიდან ქალაქი მთლიანად იშლება — მტკვრის ხაზი,
    ნარიყალა, სამება და შორეულ ჰორიზონტზე თრიალეთის მთები. ეს ერთადერთი ადგილია, სადაც თბილისის მასშტაბი
    ნამდვილად შეიგრძნობა.


    ფუნიკულიორი 1905 წელს ბელგიელი ინჟინრების პროექტით გაიხსნა და დღემდე ორიგინალურ ტრასაზე დადის. სამი
    სადგურია: ქვედა ჭონქაძის ქუჩაზე, შუალედური — მთაწმინდის პანთეონთან, სადაც ილია ჭავჭავაძე, აკაკი წერეთელი,
    ნიკო ფიროსმანი და გრიბოედოვი არიან დაკრძალული, და ზედა — პარკში.


    პარკში ერთდროულად რამდენიმე რამაა:


    - დიდი ბორბალი, რომელიც ქედის კიდეზე დგას და ხედს ჰაერშივე გაძლევს

    - ატრაქციონები ბავშვებისთვის, კარუსელები და პატარა თემატური ზონები

    - სარესტორნო ტერასები, საიდანაც მზის ჩასვლა საუკეთესოდ ჩანს

    - საფეხმავლო ბილიკები ტყეში, თუ ხმაურისგან გაქცევა გინდა

    - სატელევიზიო ანძა, ღამით განათებული — თბილისის ღამის ორიენტირი


    ზამთარში პარკის ნაწილი მუშაობს, თუმცა ატრაქციონები შეიძლება დაკეტილი დაგხვდეს; ხედი კი, პირიქით, გაცილებით
    სუფთაა ცივ ჰაერში, როცა ზაფხულის ნისლი აღარ დგას ქალაქზე.


    მთაწმინდა მხოლოდ გასართობი ადგილი არ არის. პანთეონი, რომელიც შუალედურ სადგურთანაა, ქართული კულტურის
    რუკაა ერთ ეზოში მოთავსებული — მწერლები, მხატვრები, საზოგადო მოღვაწეები. იქვე დგას მამა დავითის ეკლესია,
    რომლის სახელიც მთას მიეკუთვნება: „მთაწმინდა" წმინდა მთას ნიშნავს. თუ დრო გაქვს, ფუნიკულიორით შუა სადგურამდე
    ავედი, ნახე პანთეონი და მერე გააგრძელე ზემოთ — ეს ერთი ბილეთით კეთდება და პარკს სრულიად სხვა კონტექსტს
    ჰმატებს.
  tip: >-
    წადი მზის ჩასვლამდე ორი საათით ადრე — ასე ნახავ დღის, ოქროს საათისა და ღამის ქალაქს ერთ ვიზიტში. ატრაქციონები
    ცალკე ბარათით იხდის, რომელსაც შესასვლელთან ტენი; ბავშვებთან ერთად ჩადე მარაგი. ქედზე ქარია და ტემპერატურა
    ქალაქზე 4–6 გრადუსით დაბალია — ქურთუკი ზაფხულშიც წაიღე. ფუნიკულიორზე რიგი შაბათ-კვირას საღამოს გრძელია,
    ამიტომ მანქანით ასვლა უფრო სწრაფი გამოდის. ტუალეტი და კაფეები პარკშივეა.
  route: >-
    პარკამდე ორი გზაა. პირველი — ფუნიკულიორი ჭონქაძის ქუჩიდან, სადაც მანქანას მიმდებარე ქუჩებში დატოვებ.
    მეორე — ავტომობილით მთაწმინდის სერპანტინით ვაკის ან კუს ტბის მხრიდან: ვიწრო, მაგრამ სრულად ასფალტირებული
    გზა, დაახლოებით 20 წუთი ცენტრიდან. ზემოთ დიდი უფასო პარკინგია. ზამთარში ეს აღმართი მოყინვისას რთულდება,
    ამიტომ თოვლის შემდეგ ფუნიკულიორი უფრო საიმედოა. ჩვეულებრივ პირობებში ეკონომ-კლასის მანქანა სავსებით
    საკმარისია.
en:
  name: Mtatsminda Park and Funicular
  short: A hilltop amusement park above the city, reached by a 1905 funicular, with the widest panorama
    of Tbilisi.
  body: >-
    **Mtatsminda is the roof of Tbilisi.** From the ridge at 727 metres the whole city unfolds: the line
    of the Mtkvari, Narikala, the Sameba cathedral and the Trialeti mountains on the far horizon. It is
    the one place where the actual scale of Tbilisi becomes obvious.


    The funicular opened in 1905 to a Belgian design and still runs on its original alignment. There are
    three stations: the lower one on Chonkadze Street, an intermediate stop at the Mtatsminda Pantheon,
    where Ilia Chavchavadze, Akaki Tsereteli, Niko Pirosmani and the Russian writer Griboyedov are buried,
    and the upper station inside the park.


    The park itself is several things at once:


    - A Ferris wheel built right on the edge of the ridge, which puts the view underneath you

    - Rides and carousels for children, plus small themed zones

    - Restaurant terraces that are the best sunset seats in the city

    - Woodland paths for anyone who wants to escape the noise of the fairground

    - The television tower, floodlit at night and used by locals as a navigation point


    In winter part of the park keeps working, though some rides close. The view, on the other hand, is
    far sharper in cold air than in the summer haze.
  tip: >-
    Arrive about two hours before sunset and you get the daytime city, the golden hour and the night city
    in a single visit. Rides are paid with a rechargeable card bought at the entrance, so load enough
    if you are with children. The ridge is windy and four to six degrees cooler than the centre — bring
    a jacket even in summer. Queues for the funicular are long on weekend evenings, so driving up can
    actually be faster. Toilets and cafés are inside the park.
  route: >-
    There are two ways up. The first is the funicular from Chonkadze Street, leaving your car in the surrounding
    streets. The second is to drive the Mtatsminda switchbacks from the Vake or Turtle Lake side: narrow
    but fully asphalted, about twenty minutes from the centre, with a large free car park at the top.
    In winter the climb can be awkward when the surface ices over, so after snowfall the funicular is
    the reliable option. In normal conditions an economy car handles the road without any trouble.
ru:
  name: Парк Мтацминда и фуникулёр
  short: Парк развлечений на вершине над городом, куда ведёт фуникулёр 1905 года, и самая широкая панорама
    Тбилиси.
  body: >-
    **Мтацминда — крыша Тбилиси.** С хребта на высоте 727 метров город раскрывается целиком: линия Куры,
    Нарикала, собор Самеба и Триалетские горы на дальнем горизонте. Это единственное место, где масштаб
    Тбилиси становится по-настоящему очевидным.


    Фуникулёр открылся в 1905 году по бельгийскому проекту и до сих пор работает на исходной трассе. Станций
    три: нижняя на улице Чонкадзе, промежуточная у Пантеона Мтацминда, где похоронены Илья Чавчавадзе,
    Акакий Церетели, Нико Пиросмани и Грибоедов, и верхняя — в самом парке.


    Парк — это сразу несколько вещей:


    - Колесо обозрения на самом краю хребта, из-за чего вид оказывается прямо под вами

    - Аттракционы и карусели для детей, несколько тематических зон

    - Террасы ресторанов — лучшие места в городе, чтобы встретить закат

    - Лесные тропинки для тех, кто хочет уйти от шума аттракционов

    - Телебашня, подсвеченная ночью и служащая горожанам ориентиром


    Зимой часть парка работает, хотя некоторые аттракционы закрыты. Зато вид в холодном воздухе гораздо
    чётче, чем в летней дымке.
  tip: >-
    Приезжайте примерно за два часа до заката: тогда за один визит увидите дневной город, золотой час
    и ночную панораму. Аттракционы оплачиваются картой, которую пополняют у входа, — с детьми закладывайте
    запас. На хребте ветрено и на четыре-шесть градусов холоднее, чем в центре, куртка нужна даже летом.
    Очередь на фуникулёр в выходные вечером длинная, так что подняться на машине бывает быстрее. Туалеты
    и кафе есть в парке.
  route: >-
    Наверх ведут два пути. Первый — фуникулёр с улицы Чонкадзе, машину оставляют на соседних улицах. Второй
    — подняться самому по серпантину Мтацминда со стороны Ваке или Черепашьего озера: дорога узкая, но
    полностью асфальтированная, около двадцати минут от центра, наверху большая бесплатная парковка. Зимой
    подъём становится неприятным при гололёде, поэтому после снегопада надёжнее фуникулёр. В обычных условиях
    машины эконом-класса более чем достаточно.
fa:
  name: پارک و فونیکولار متاتسمیندا
  short: شهربازی روی تپه‌ای بالای شهر، با فونیکولار 1905، با گسترده‌ترین نمای تفلیس.
  body: >-
    **متاتسمیندا بام تفلیس است.** از ستیغ 727 متری، تمام شهر باز می‌شود: خط متکواری، ناریکالا، کلیسای
    جامع تثلیث مقدس و کوه‌های تریالتی در افق دور. این تنها جایی است که مقیاس واقعی تفلیس در آن آشکار می‌شود.


    فونیکولار در 1905 با طراحی بلژیکی افتتاح شد و هنوز روی همان مسیر اصلی کار می‌کند. سه ایستگاه دارد:
    ایستگاه پایین در خیابان چونکادزه، ایستگاه میانی در پانتئون متاتسمیندا که ایلیا چاوچاوادزه، آکاکی تسرتلی،
    نیکو پیروسمانی و گریبایدوف نویسندهٔ روس در آن به خاک سپرده شده‌اند، و ایستگاه بالا درون پارک.


    خود پارک چند چیز را هم‌زمان در خود دارد: چرخ فلکی که درست روی لبهٔ ستیغ ساخته شده و منظره را زیر پای
    شما می‌گذارد؛ وسایل بازی و چرخ‌فلک‌های کودکان به‌همراه محوطه‌های کوچک موضوعی؛ مهتابی رستوران‌ها که
    بهترین صندلی‌های غروب شهرند؛ گذرگاه‌های جنگلی برای هر کس که بخواهد از هیاهوی شهربازی بگریزد؛ و برج
    تلویزیون که شب‌ها نورافکن دارد و مردم محلی از آن به‌عنوان نقطهٔ جهت‌یابی استفاده می‌کنند. در زمستان
    بخشی از پارک کار می‌کند، هرچند برخی وسایل بسته‌اند. در عوض، منظره در هوای سرد بسیار شفاف‌تر از مه
    تابستانی است.
  tip: >-
    حدود دو ساعت پیش از غروب برسید تا در یک بازدید هم شهر روز، هم ساعت طلایی و هم شهر شب را ببینید. هزینهٔ
    وسایل بازی با کارت شارژی پرداخت می‌شود که در ورودی می‌خرید، پس اگر با بچه‌ها هستید کافی شارژ کنید.
    ستیغ بادخیز است و چهار تا شش درجه خنک‌تر از مرکز شهر — حتی در تابستان یک ژاکت بیاورید. صف فونیکولار
    در شب‌های آخر هفته طولانی است، پس بالا رفتن با خودرو گاهی سریع‌تر است. سرویس بهداشتی و کافه‌ها داخل
    پارک‌اند.
  route: >-
    دو راه برای بالا رفتن هست. نخست فونیکولار از خیابان چونکادزه است و خودرو را در خیابان‌های اطراف می‌گذارید.
    دوم رانندگی در سربالایی‌های مارپیچ متاتسمیندا از سمت واکه یا دریاچهٔ لاک‌پشت است: باریک اما کاملاً
    آسفالت، حدود بیست دقیقه از مرکز، با پارکینگ رایگان بزرگ در بالا. در زمستان، وقتی سطح جاده یخ می‌زند،
    این صعود دشوار می‌شود، پس پس از بارش برف فونیکولار گزینهٔ مطمئن است. در شرایط عادی خودروی اقتصادی
    بی‌هیچ دردسری از پس این جاده برمی‌آید.
he:
  name: פארק מטאצמינדה והפוניקולר
  short: פארק שעשועים על ראש הרכס מעל העיר, שאליו מגיעים בפוניקולר משנת 1905, עם הפנורמה הרחבה ביותר של
    טביליסי.
  body: >-
    **מטאצמינדה היא הגג של טביליסי.** מן הרכס בגובה 727 מטר נפרשת כל העיר: קו המטקווארי, מבצר נריקלה,
    קתדרלת השילוש הקדוש והרי טריאלטי באופק הרחוק. זהו המקום היחיד שבו קנה המידה האמיתי של טביליסי נעשה
    ברור לגמרי.


    הפוניקולר נפתח ב-1905 לפי תכנון בלגי ועדיין פועל על התוואי המקורי שלו. יש בו שלוש תחנות: התחנה התחתונה
    ברחוב צ'ונקדזה, תחנת ביניים בפנתיאון מטאצמינדה, שבו קבורים איליה צ'אבצ'אבדזה, אקאקי צרתלי, ניקו פירוסמני
    והסופר הרוסי גריבויידוב, והתחנה העליונה בתוך הפארק עצמו.


    הפארק הוא כמה דברים בבת אחת: גלגל ענק שנבנה ממש על שפת הרכס, כך שהנוף נמצא מתחתיכם; מתקנים וקרוסלות
    לילדים לצד אזורים נושאיים קטנים; מרפסות מסעדה שהן המושבים הטובים בעיר לשקיעה; שבילי יער לכל מי שרוצה
    להימלט מרעש הלונה פארק; ומגדל הטלוויזיה, המואר בלילה ומשמש את תושבי העיר כנקודת התמצאות. בחורף חלק
    מהפארק ממשיך לפעול, אף שחלק מהמתקנים נסגרים לעונה. הנוף, לעומת זאת, חד ובהיר בהרבה באוויר הקר של החורף
    מאשר באובך הכבד של חודשי הקיץ.
  tip: >-
    הגיעו כשעתיים לפני השקיעה ותקבלו בביקור אחד את העיר באור יום, את שעת הזהב ואת העיר בלילה. על המתקנים
    משלמים בכרטיס נטען שנרכש בכניסה, לכן טענו מספיק אם אתם עם ילדים. ברכס נושבת רוח והטמפרטורה נמוכה בארבע
    עד שש מעלות מזו שבמרכז — קחו מעיל גם בקיץ. התורים לפוניקולר ארוכים בערבי סוף שבוע, ולכן נסיעה למעלה
    עשויה להיות מהירה יותר. שירותים ובתי קפה נמצאים בתוך הפארק.
  route: >-
    יש שתי דרכים לעלות. הראשונה היא הפוניקולר מרחוב צ'ונקדזה, כשהרכב נשאר ברחובות הסמוכים. השנייה היא
    לנסוע בסרפנטינות של מטאצמינדה מצד ואקה או מצד אגם הצבים: כביש צר אך סלול לחלוטין, כעשרים דקות מהמרכז,
    ובראש חניון חינם גדול. בחורף העלייה עלולה להיות בעייתית כשפני הכביש מתקרחים, ולכן אחרי שלג הפוניקולר
    הוא האפשרות האמינה. בתנאים רגילים רכב חסכוני מתמודד עם הדרך הזאת בלי שום קושי.
ar:
  name: حديقة متاتسميندا والقطار المائل
  short: مدينة ملاهٍ على قمة التل فوق المدينة، يُوصل إليها بقطار مائل من عام 1905، وفيها أوسع إطلالة على
    تبليسي.
  body: >-
    **متاتسميندا هي سطح تبليسي.** فمن الحافة على ارتفاع 727 متراً تنكشف المدينة كلها: خط نهر متكفاري،
    وناريكالا، وكاتدرائية الثالوث المقدس، وجبال تريالتي في الأفق البعيد. وهذا هو المكان الوحيد الذي يتضح
    فيه حجم تبليسي الحقيقي.


    افتُتح القطار المائل عام 1905 بتصميم بلجيكي، وما زال يعمل على مساره الأصلي. وله ثلاث محطات: السفلى
    في شارع تشونكادزي، ومحطة وسطى عند بانثيون متاتسميندا حيث يرقد إيليا تشافتشافادزه وأكاكي تسيريتيلي
    ونيكو بيروسماني والكاتب الروسي غريبويدوف، والمحطة العليا داخل الحديقة.


    والحديقة نفسها عدة أشياء في آن واحد: عجلة دوارة بُنيت على حافة الحافة تماماً فتضع المشهد تحت قدميك؛
    وألعاب ودوامات للأطفال إلى جانب مناطق صغيرة ذات طابع خاص؛ وشرفات مطاعم هي أفضل مقاعد الغروب في المدينة؛
    ودروب في الغابة لمن يريد الهرب من ضجيج الملاهي؛ وبرج التلفزيون المضاء ليلاً الذي يستخدمه السكان علامة
    للاتجاه. وفي الشتاء يظل جزء من الحديقة عاملاً، وإن أُغلقت بعض الألعاب. في المقابل، تكون الإطلالة أوضح
    كثيراً في الهواء البارد منها في ضباب الصيف.
  tip: >-
    احضر قبل الغروب بساعتين تقريباً لتحصل في زيارة واحدة على المدينة نهاراً وعلى الساعة الذهبية وعلى المدينة
    ليلاً. تُدفع الألعاب ببطاقة قابلة للشحن تُشترى عند المدخل، فاشحنها بما يكفي إن كنت مع أطفال. والحافة
    مكشوفة للرياح وأبرد بأربع إلى ست درجات من الوسط — احمل سترة حتى في الصيف. وطوابير القطار المائل طويلة
    في أمسيات نهاية الأسبوع، لذا قد يكون الصعود بالسيارة أسرع فعلاً. دورات المياه والمقاهي داخل الحديقة.
  route: >-
    هناك طريقتان للصعود. الأولى هي القطار المائل من شارع تشونكادزي، مع ترك السيارة في الشوارع المجاورة.
    والثانية هي قيادة منعطفات متاتسميندا الحلزونية من جهة فاكي أو من جهة بحيرة السلاحف: طريق ضيق لكنه
    معبّد بالكامل، نحو عشرين دقيقة من الوسط، وفي الأعلى موقف مجاني كبير. وفي الشتاء يصبح الصعود صعباً
    حين يتجمد سطح الطريق، لذا يبقى القطار المائل الخيار الموثوق بعد تساقط الثلج. وفي الظروف العادية تتدبر
    سيارة اقتصادية هذا الطريق بلا أي عناء.
