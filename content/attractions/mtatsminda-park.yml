ka:
  name: მთაწმინდის პარკი და ფუნიკულიორი
  short: >-
    თბილისის ყველაზე მაღალი აივანი: 1905 წლის ფუნიკულიორი ქედის კიდეზე მდგარ ბორბალთან აგიყვანთ, ქვემოთ
    კი მთელი ქალაქი ტრიალებს.
  body: >-
    **ფუნიკულიორის ზედა სადგურიდან, ზღვის დონიდან 727 მეტრზე, თბილისი ბოლოს და ბოლოს ერთ მზერაში ეტევა.**
    მტკვარი ხეობას დაგდებული ლენტივით მიუყვება; ნარიყალა, სამების მოოქროვილი გუმბათი და საბჭოთა კორპუსების
    ნაცრისფერი რიგები ერთ ხაზზე ლაგდება, მათ მიღმა კი ბორცვები ფენა-ფენა ქრება.


    მთას ოდესღაც მამადავითი ერქვა — VI საუკუნის ბერის, დავით გარეჯელის სახელით, რომელმაც მის კალთაზე სენაკი
    გამოიქვაბა. X–XI საუკუნეებში მას ათონის წმინდა მთის კვალად მთაწმინდა უწოდეს. XX საუკუნის დამდეგს მთას
    უფრო მიწიერ ბედს უმზადებდნენ: პლატოზე „ზედა თბილისის“ გაშენება, ასასვლელ გზად კი ქალაქის ტრამვაის
    მფლობელმა ბელგიურმა კომპანიამ ფუნიკულიორი შესთავაზა. ის 1905 წლის 27 მარტს გაიხსნა. ნიკო ფიროსმანმა
    ამ ამბავს დიდი ტილო მიუძღვნა, მისი „ფუნიკულიორი“ კი დღეს საქართველოს ხელოვნების მუზეუმში ინახება.
    თავად მხატვარი 1918 წელს სიღარიბეში გარდაიცვალა და ნინოს სასაფლაოზე დაკრძალეს; საფლავის ადგილი არავის
    ჩაუწერია. ხაზის შუა სადგურთან, პანთეონში, როგორც ხშირად ამბობენ, ფიროსმანი არ განისვენებს.


    „ზედა თბილისი“ არასოდეს აშენებულა. 1930-იან წლებში საბჭოთა ხელისუფლებამ აქ პარკი გააშენა, 2001 წლიდან
    კი ის თანამედროვე გასართობ პარკად გადაკეთდა. გაცვეთილი ფუნიკულიორი 2000 წლის ივნისში გაჩერდა და მგზავრები
    ხელახლა მხოლოდ 2012 წელს აიყვანა.


    დღეს აქ ყველაფერი ბორბლის გარშემო ტრიალებს. სამოცდახუთმეტრიანი პანორამული ბორბალი ქედის ნაპირზე დგას
    და სრულ წრეს ათ-თორმეტ წუთში შემოწერს — ქალაქი ფეხქვეშ ნელა იხრება. ირგვლივ სწრაფი ატრაქციონებია,
    წყლის სასრიალოები, „მოჩვენებათა ციხე“, ტყის ბილიკები და რესტორნების ტერასები.


    დარჩით დაბნელებამდე. ქალაქი ქუჩა-ქუჩა აინთება, ბოლო ვაგონები კი ძილმორეული ბავშვებით ქვემოთ, სინათლეში
    ჩაცურდება.
  tip: >-
    მოდით მზის ჩასვლამდე დაახლოებით ორი საათით ადრე — ერთ ვიზიტში ნახავთ დღის ქალაქს, საღამოს ოქროსფერ
    შუქს და ღამის ციმციმს. ფუნიკულიორისა და ატრაქციონების საფასური პარკის შესავსები ბარათით იხდება, რომელსაც
    სადგურებში ყიდიან: ერთხელ შეავსეთ, ბავშვებთან ერთად კი — მარაგით. ქედზე ქარია და რუსთაველის გამზირთან
    შედარებით რამდენიმე გრადუსით გრილა, ამიტომ ივლისშიც წამოიღეთ თბილი სამოსი. შაბათ-კვირას საღამოობით
    ქვედა სადგურთან რიგი გრძელია, სამუშაო დღეებში უფრო მშვიდადაა. კაფეები, რესტორანი და ტუალეტები პარკშივეა.
    ზამთარში ატრაქციონების ნაწილი იკეტება, სამაგიეროდ ცივი, გამჭვირვალე ჰაერი წლის ყველაზე მკვეთრ ხედს
    გაჩუქებთ.
  route: >-
    ზემოთ ორი გზა ადის. მარტივი: მანქანით ან ტაქსით მიდით ფუნიკულიორის ქვედა სადგურამდე ჭონქაძის ქუჩაზე,
    მიმდებარე ქუჩებში ფასიანი ადგილი მოძებნეთ (საღამოს ძნელად იშოვება) და ვაგონით ადით. მეორე: მთელი გზა
    საჭესთან — თავისუფლების მოედნიდან დაახლოებით 6 კილომეტრი და 20 წუთი, ვაკის გავლით, ოკროყანის მიმართულებით
    ქედზე ამავალი სერპანტინით. გზა ბოლომდე ასფალტიანია და პარკის შესასვლელთან, დიდ ავტოსადგომზე მთავრდება.
    მოსახვევები ვიწროა, თოვლის ან ძლიერი ყინვის შემდეგ კი იყინება — ასეთ დღეებში ერთადერთი გონივრული არჩევანი
    ფუნიკულიორია. აღმართს ნებისმიერი ეკონომკლასის მანქანა გაუმკლავდება.
en:
  name: Mtatsminda Park and Funicular
  short: >-
    Tbilisi's highest balcony: a 1905 funicular lifts you to a Ferris wheel on the lip of the ridge, with
    the whole city turning below.
  body: >-
    **From the top station of the funicular, 727 metres above the sea, Tbilisi finally fits into a single
    look.** The Mtkvari coils through the valley like a dropped ribbon; Narikala, the gilded dome of Sameba
    and the grey ranks of Soviet housing blocks line up in one sweep, and behind them the hills fade out
    layer by layer.


    The mountain was once called Mamadaviti, after the sixth-century monk David of Gareja, who cut himself
    a cell on its slope; in the tenth or eleventh century it was renamed Mtatsminda, the Holy Mountain,
    after Athos. The 1900s had more worldly plans. The city dreamed of an "Upper Tbilisi" on the plateau,
    and the Belgian company that ran the trams offered the way up: a funicular, opened on 27 March 1905.
    Niko Pirosmani dedicated a large canvas to the occasion, and his painting "Funicular" hangs today
    in the Art Museum of Georgia. The painter himself died poor in 1918 and lies in the Nino cemetery,
    in a grave nobody recorded — not, as is often claimed, in the Pantheon at the line's halfway stop.


    Upper Tbilisi was never built. In the 1930s the Soviet authorities laid out a park instead, and from
    2001 it was remade as a modern amusement park. The funicular, worn out, stopped in June 2000 and carried
    passengers again only in 2012.


    The wheel is the point now. Sixty-five metres high, it stands right on the edge of the ridge and takes
    ten to twelve minutes to turn, so the city tilts slowly beneath your feet. Around it are roller coasters,
    water slides, a Ghost Castle ride, woodland paths and restaurant terraces.


    Stay until dark. The city switches itself on street by street, and the last carriages slide back down
    into the light, full of sleepy children.
  tip: >-
    Come about two hours before sunset and you get the daytime city, the golden light and the night lights
    in one visit. The funicular and the rides are paid with a rechargeable park card sold at the stations:
    top it up once, and generously if children are with you. The ridge is windy and a few degrees cooler
    than Rustaveli Avenue, so bring a layer even in July. On weekend evenings the queue at the lower station
    can be long; weekdays are calmer. Cafés, a restaurant and toilets are inside the park. In winter some
    rides close, but the cold, clean air gives the sharpest views of the year.
  route: >-
    There are two ways up. The easy one: drive or take a taxi to the lower funicular station on Chonkadze
    Street, find a metered bay in the surrounding streets (scarce in the evening) and ride up. The other:
    drive the whole way, about 6 km and 20 minutes from Freedom Square, through Vake and up the hairpin
    road that climbs the ridge towards Okrokana. It is asphalt throughout and ends at a large car park
    by the park gates. The bends are narrow, and after snow or a hard frost they ice over; on those days
    the funicular is the only sensible choice. Any economy car will manage the climb.
ru:
  name: Парк Мтацминда и фуникулёр
  short: >-
    Самый высокий балкон Тбилиси: фуникулёр 1905 года поднимает вас к колесу обозрения на самом краю хребта,
    а внизу медленно поворачивается весь город.
  body: >-
    **С верхней станции фуникулёра, на высоте 727 метров над уровнем моря, Тбилиси наконец умещается в
    один взгляд.** Кура вьётся по долине, как обронённая лента; Нарикала, золочёный купол Самебы и серые
    шеренги советских многоэтажек выстраиваются в одну линию, а за ними слой за слоем растворяются холмы.


    Когда-то гора называлась Мамадавити — в честь монаха VI века Давида Гареджийского, вырубившего себе
    келью на её склоне; в X или XI веке её переименовали в Мтацминду, Святую гору, по образу Афона. Начало
    XX века готовило горе судьбу более мирскую. Город мечтал о «Верхнем Тбилиси» на плато, а бельгийская
    компания, державшая трамваи, предложила путь наверх — фуникулёр, открытый 27 марта 1905 года. Нико
    Пиросмани посвятил этому событию большое полотно, и его картина «Фуникулёр» висит сегодня в Художественном
    музее Грузии. Сам художник умер в бедности в 1918 году и похоронен на кладбище Святой Нино, в могиле,
    место которой никто не записал, — а вовсе не в пантеоне у средней станции, как часто утверждают.


    «Верхний Тбилиси» так и не построили. В 1930-е годы советская власть разбила здесь вместо него парк,
    а с 2001 года его перестроили в современный парк аттракционов. Изношенный фуникулёр остановился в
    июне 2000 года и снова повёз пассажиров лишь в 2012-м.


    Теперь главное здесь — колесо обозрения. Высотой шестьдесят пять метров, оно стоит прямо на краю хребта
    и делает оборот за десять–двенадцать минут, так что город медленно кренится у вас под ногами. Вокруг
    — американские горки, водные горки, аттракцион «Замок привидений», лесные тропинки и ресторанные террасы.


    Оставайтесь дотемна. Город включается улица за улицей, а последние вагончики, полные сонных детей,
    соскальзывают обратно вниз, в огни.
  tip: >-
    Приезжайте часа за два до заката — и за один визит увидите дневной город, золотой свет и ночные огни.
    Фуникулёр и аттракционы оплачиваются пополняемой картой парка, которую продают на станциях: пополните
    её один раз, и с запасом, если вы с детьми. На хребте ветрено и на несколько градусов прохладнее,
    чем на проспекте Руставели, так что даже в июле возьмите кофту. В выходные вечером очередь на нижней
    станции бывает длинной; в будни спокойнее. Кафе, ресторан и туалеты есть в самом парке. Зимой часть
    аттракционов закрыта, зато холодный чистый воздух дарит самые ясные виды в году.
  route: >-
    Подняться можно двумя путями. Простой: доехать на машине или такси до нижней станции фуникулёра на
    улице Чонкадзе, найти платное место на соседних улицах (вечером с ними туго) и подняться на фуникулёре.
    Другой: весь путь за рулём — около 6 км и 20 минут от площади Свободы через Ваке и дальше по серпантину,
    который взбирается на хребет в сторону Окроканы. Дорога асфальтирована на всём протяжении и заканчивается
    большой парковкой у ворот парка. Повороты узкие, а после снегопада или сильного мороза покрываются
    льдом; в такие дни разумный выбор только один — фуникулёр. Любая машина эконом-класса справится с
    подъёмом.
fa:
  name: پارک و فونیکولار متاتسمیندا
  short: 'بلندترین بالکن تفلیس: فونیکولاری از ۱۹۰۵ شما را به چرخ‌وفلکی بر لبهٔ یال می‌برد و همهٔ شهر زیر
    پایتان می‌چرخد.'
  body: >-
    **از ایستگاه بالایی فونیکولار، در ارتفاع ۷۲۷ متری از سطح دریا، تفلیس سرانجام در یک نگاه جا می‌گیرد.**
    رود کورا چون روبانی رهاشده در دره پیچ و تاب می‌خورد؛ ناریقلعه، گنبد زرین کلیسای جامع تثلیث مقدس (سامه‌با)
    و ردیف‌های خاکستری آپارتمان‌های دوران شوروی در یک امتداد کنار هم می‌نشینند و پشت سرشان تپه‌ها لایه
    به لایه محو می‌شوند.


    این کوه روزگاری مامادویتی نام داشت، به نام داوود گارجی، راهب سدهٔ ششم، که در دامنه‌اش حجره‌ای برای
    خود کند؛ در سدهٔ دهم یا یازدهم، به پیروی از کوه آتوس، نامش را متاتسمیندا یعنی «کوه مقدس» گذاشتند.
    سال‌های نخست سدهٔ بیستم نقشه‌هایی زمینی‌تر داشت. شهر در آرزوی «تفلیس بالا» بر فراز فلات بود و شرکت
    بلژیکی‌ای که تراموای شهر را می‌گرداند راه بالا رفتن را پیشنهاد کرد: فونیکولاری که در ۲۷ مارس ۱۹۰۵
    گشوده شد. نیکو پیروسمانی پرده‌ای بزرگ به این رویداد پیشکش کرد و تابلوی «فونیکولار» او امروز در موزهٔ
    هنر گرجستان آویخته است. خود نقاش در ۱۹۱۸ در فقر درگذشت و در گورستان نینوی مقدس، در گوری که هیچ‌کس
    نشانی‌اش را ثبت نکرد، به خاک سپرده شد — نه، آن‌گونه که بسیار گفته می‌شود، در پانتئونِ ایستگاه میانی
    خط.


    «تفلیس بالا» هرگز ساخته نشد. در دههٔ ۱۹۳۰ مقامات شوروی به جای آن پارکی ساختند و از ۲۰۰۱ آن را به شهربازی‌ای
    امروزی بدل کردند. فونیکولارِ فرسوده در ژوئن ۲۰۰۰ از کار افتاد و تنها در ۲۰۱۲ دوباره مسافر برد.


    اکنون همه‌چیز گرد چرخ‌وفلک می‌گردد. شصت‌وپنج متر بلندی دارد، درست بر لبهٔ یال ایستاده و هر دورش ده
    تا دوازده دقیقه طول می‌کشد، چنان که شهر آرام‌آرام زیر پایتان کج می‌شود. پیرامونش ترن‌های هوایی، سرسره‌های
    آبی، بازی «قلعهٔ ارواح»، کوره‌راه‌های جنگلی و مهتابی‌های رستوران‌ها قرار دارد.


    تا تاریکی بمانید. شهر خیابان به خیابان روشن می‌شود و آخرین واگن‌ها، پر از کودکان خواب‌آلود، به سوی
    روشنایی پایین سر می‌خورند.
  tip: >-
    حدود دو ساعت پیش از غروب بیایید تا در یک دیدار، شهرِ روز، نور طلایی و چراغ‌های شب را ببینید. بهای
    فونیکولار و بازی‌ها با کارت شارژی پارک پرداخت می‌شود که در ایستگاه‌ها فروخته می‌شود: یک بار شارژش
    کنید، و اگر کودک همراه دارید دست‌ودل‌باز باشید. یال بادگیر است و چند درجه از خیابان روستاولی خنک‌تر،
    پس حتی در ژوئیه یک لایه لباس اضافه بیاورید. شب‌های آخر هفته صف ایستگاه پایینی ممکن است طولانی باشد؛
    روزهای کاری آرام‌ترند. کافه، رستوران و سرویس بهداشتی درون پارک هست. در زمستان برخی بازی‌ها تعطیل‌اند،
    اما هوای سرد و پاک روشن‌ترین منظره‌های سال را می‌بخشد.
  route: >-
    دو راه برای بالا رفتن هست. راه آسان: با خودرو یا تاکسی تا ایستگاه پایینی فونیکولار در خیابان چونکادزه
    بروید، در خیابان‌های اطراف جای پارک پولی پیدا کنید (که شب‌ها کمیاب است) و با فونیکولار بالا بروید.
    راه دیگر: تمام مسیر را برانید — حدود ۶ کیلومتر و ۲۰ دقیقه از میدان آزادی، از محلهٔ واکه و سپس جادهٔ
    پرپیچی که یال را به سوی اوکروکانا بالا می‌رود. سراسر آسفالت است و به پارکینگی بزرگ کنار دروازهٔ پارک
    می‌رسد. پیچ‌ها باریک‌اند و پس از برف یا یخبندان سخت یخ می‌زنند؛ در چنین روزهایی تنها گزینهٔ عاقلانه
    فونیکولار است. هر خودروی اقتصادی از پس این سربالایی برمی‌آید.
he:
  name: פארק מטאצמינדה והפוניקולר
  short: 'המרפסת הגבוהה ביותר של טביליסי: פוניקולר משנת 1905 מעלה אתכם אל גלגל ענק על שפת הרכס, והעיר
    כולה מסתובבת למטה.'
  body: >-
    **מהתחנה העליונה של הפוניקולר, 727 מטר מעל פני הים, טביליסי נכנסת סוף סוף למבט אחד.** המטקווארי מתפתל
    בעמק כמו סרט שנשמט מהיד; נריקלה, הכיפה המוזהבת של קתדרלת השילוש הקדוש (סאמבה) והשורות האפורות של שיכוני
    הבטון הסובייטיים מסתדרים ברצף אחד, ומאחוריהם הגבעות מתעמעמות שכבה אחר שכבה.


    פעם נקרא ההר מאמדוויתי, על שם הנזיר דוד מגרג'ה בן המאה השישית, שחצב לעצמו תא על המדרון; במאה העשירית
    או האחת עשרה שונה שמו למטאצמינדה, "ההר הקדוש", בהשראת הר אתוס. ראשית המאה העשרים תכננה להר עתיד ארצי
    יותר. העיר חלמה על "טביליסי העליונה" על הרמה, והחברה הבלגית שהפעילה את החשמליות הציעה את הדרך למעלה:
    פוניקולר, שנפתח ב־27 במרץ 1905. ניקו פירוסמני הקדיש לאירוע בד גדול, והציור שלו "פוניקולר" תלוי היום
    במוזיאון האמנות של גאורגיה. הצייר עצמו מת בעוני ב־1918 ונקבר בבית הקברות של נינו הקדושה, בקבר שאיש
    לא תיעד את מקומו – ולא, כפי שנטען לעיתים קרובות, בפנתיאון שבתחנת האמצע של הקו.


    טביליסי העליונה לא נבנתה מעולם. בשנות ה־30 הקימו כאן השלטונות הסובייטיים פארק במקומה, ומ־2001 הוא
    עוצב מחדש כפארק שעשועים מודרני. הפוניקולר השחוק הפסיק לפעול ביוני 2000 וחזר להסיע נוסעים רק ב־2012.


    היום העיקר הוא הגלגל הענק. גובהו שישים וחמישה מטר, הוא ניצב ממש על שפת הרכס, וסיבוב שלם שלו נמשך עשר
    עד שתים עשרה דקות, כך שהעיר נוטה לאיטה מתחת לרגליכם. סביבו רכבות הרים, מגלשות מים, מתקן "טירת הרוחות",
    שבילי יער ומרפסות של מסעדות.


    הישארו עד החשכה. העיר נדלקת רחוב אחר רחוב, והקרונות האחרונים, מלאים ילדים מנומנמים, מחליקים בחזרה
    אל האורות.
  tip: >-
    הגיעו כשעתיים לפני השקיעה, ותקבלו בביקור אחד את העיר באור יום, את אור הזהב ואת אורות הלילה. את הפוניקולר
    ואת המתקנים משלמים בכרטיס פארק נטען שנמכר בתחנות: טענו אותו פעם אחת, ובנדיבות אם יש איתכם ילדים. על
    הרכס נושבת רוח, והטמפרטורה נמוכה בכמה מעלות מאשר בשדרות רוסתוולי, אז קחו שכבה נוספת גם ביולי. בערבי
    סוף שבוע התור בתחנה התחתונה עלול להיות ארוך; באמצע השבוע רגוע יותר. בתוך הפארק יש בתי קפה, מסעדה ושירותים.
    בחורף חלק מהמתקנים סגורים, אבל האוויר הקר והצלול מעניק את התצפיות החדות ביותר בשנה.
  route: >-
    יש שתי דרכים לעלות. הקלה: לנסוע ברכב או במונית לתחנה התחתונה של הפוניקולר ברחוב צ'ונקדזה, למצוא חנייה
    בתשלום ברחובות הסמוכים (בערב היא נדירה) ולעלות בפוניקולר. השנייה: לנסוע כל הדרך – כ־6 ק"מ ו־20 דקות
    מכיכר החירות, דרך ואקה ובמעלה כביש הסרפנטינות שמטפס על הרכס לכיוון אוקרוקנה. הכביש סלול לכל אורכו
    ומסתיים בחניון גדול ליד שערי הפארק. הסיבובים צרים, ואחרי שלג או כפור חזק הם מתכסים קרח; בימים כאלה
    הפוניקולר הוא הבחירה הנבונה היחידה. כל רכב בקטגוריית אקונומי יעמוד בעלייה.
ar:
  name: حديقة متاتسميندا والقطار المائل
  short: 'أعلى شرفات تبليسي: قطار مائل يعود إلى 1905 يحملكم إلى عجلة دوّارة على حافة الجبل، والمدينة كلها
    تدور تحتكم.'
  body: >-
    **من المحطة العليا للقطار المائل، على ارتفاع 727 مترًا فوق سطح البحر، تتسع نظرة واحدة أخيرًا لتبليسي
    كلها.** يتلوّى نهر كورا في الوادي كشريط سقط من يد؛ وتصطفّ ناريكالا والقبة المذهّبة لكاتدرائية الثالوث
    الأقدس (ساميبا) والصفوف الرمادية من العمارات السوفيتية في مشهد واحد، وخلفها تتلاشى التلال طبقةً بعد
    طبقة.


    كان الجبل يُسمّى قديمًا مامادافيتي، نسبةً إلى الراهب داود الغاريجي من القرن السادس، الذي نحت لنفسه
    صومعة على منحدره؛ وفي القرن العاشر أو الحادي عشر أُعيدت تسميته متاتسميندا، أي «الجبل المقدس»، تيمّنًا
    بجبل آثوس. أما مطلع القرن العشرين فكانت له خطط أكثر دنيوية. فقد حلمت المدينة بـ«تبليسي العليا» على
    الهضبة، وعرضت الشركة البلجيكية التي كانت تدير الترام طريق الصعود: قطارًا مائلًا افتُتح في 27 مارس
    1905. وأهدى نيكو بيروسماني إلى المناسبة لوحة كبيرة، ولوحته «القطار المائل» معلّقة اليوم في متحف جورجيا
    للفنون. أما الرسام نفسه فقد مات فقيرًا عام 1918 ودُفن في مقبرة القديسة نينو، في قبر لم يسجّل أحد موضعه،
    وليس، كما يُقال كثيرًا، في مقبرة العظماء عند المحطة الوسطى من الخط.


    لم تُبنَ «تبليسي العليا» قط. ففي الثلاثينيات أنشأت السلطات السوفيتية مكانها حديقة، ومنذ 2001 أُعيد
    تشكيلها مدينةَ ملاهٍ حديثة. أما القطار المائل فقد أنهكه الزمن فتوقف في يونيو 2000، ولم يعد إلى نقل
    الركاب إلا عام 2012.


    العجلة الدوّارة هي بيت القصيد اليوم. يبلغ ارتفاعها خمسة وستين مترًا، وتقوم على حافة الجبل تمامًا،
    وتستغرق دورتها عشر دقائق إلى اثنتي عشرة دقيقة، فتميل المدينة ببطء تحت أقدامكم. ومن حولها الأفعوانيات
    والمزالق المائية ولعبة «قلعة الأشباح» ومسارات الغابة وشرفات المطاعم.


    ابقوا حتى يحلّ الظلام. تضيء المدينة نفسها شارعًا بعد شارع، وتنزلق العربات الأخيرة عائدةً إلى الأضواء،
    مليئةً بالأطفال الناعسين.
  tip: >-
    تعالوا قبل الغروب بساعتين تقريبًا لتحظوا في زيارة واحدة بالمدينة في النهار وبالضوء الذهبي وبأنوار
    الليل. تُدفع أجرة القطار المائل والألعاب ببطاقة الحديقة القابلة للشحن التي تُباع في المحطات: اشحنوها
    مرة واحدة، وبسخاء إن كان معكم أطفال. الحافة كثيرة الرياح وأبرد ببضع درجات من جادة روستافيلي، فاحملوا
    طبقة إضافية من الثياب حتى في يوليو. في أمسيات عطلة نهاية الأسبوع قد يطول الطابور في المحطة السفلى؛
    وأيام الأسبوع أهدأ. في داخل الحديقة مقاهٍ ومطعم ودورات مياه. وفي الشتاء تُغلق بعض الألعاب، لكن الهواء
    البارد النقي يمنح أوضح المناظر في السنة.
  route: >-
    هناك طريقان للصعود. الأسهل: أن تقودوا سياراتكم أو تستقلوا سيارة أجرة إلى المحطة السفلى للقطار المائل
    في شارع تشونكادزه، وتجدوا موقفًا مدفوعًا في الشوارع المحيطة (وهي نادرة مساءً)، ثم تصعدوا بالقطار.
    والآخر: أن تقودوا الطريق كله، نحو 6 كم و20 دقيقة من ساحة الحرية، عبر حي فاكي ثم صعودًا في الطريق المتعرج
    الذي يتسلق الجبل باتجاه أوكروكانا. الطريق معبّد على طوله وينتهي بموقف كبير عند بوابات الحديقة. المنعطفات
    ضيقة، وبعد الثلج أو الصقيع الشديد يكسوها الجليد؛ وفي تلك الأيام يكون القطار المائل الخيار العاقل الوحيد.
    أي سيارة من الفئة الاقتصادية ستتدبر الصعود.
