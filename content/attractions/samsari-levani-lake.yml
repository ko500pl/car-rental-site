ka:
  name: ლევანის ტბა (სამსარი)
  short: >-
    მაღალმთიანი ტბა სამსარის ვულკანურ ქედზე, სადაც მხოლოდ ფეხით მიხვალთ — გამოქვაბულის ეკლესიის, პრეისტორიული
    მეგალითური ციხისა და ზაფხულის მდელოების გზით.
  body: >-
    **ლევანის ტბამდე გზა არ მიდის: 2565 მეტრზე, სამსარის ვულკანურ ქედზე, ყველაფერს, რასაც მისი ნაპირიდან
    დაინახავთ, საკუთარი ფეხით გამოიმუშავებთ.**


    სამსარის ქედი ჯავახეთის ზეგანზე ვულკანური მწვერვალების ჯაჭვად აღმართულა. ტბა ერთ-ერთი მათგანის, გოდორების
    კალთაზე წევს და პირდაპირ დიდ და პატარა აბულს გადაჰყურებს. ზაფხულში მთებს შორის მდელოები ჭრელი ყვავილებით
    ივსება, წლის დიდ ნაწილში კი აქ თოვლი ბატონობს.


    საქართველოს ტურიზმის ეროვნული ადმინისტრაცია ტბას მაღალმთიანი მარშრუტის ერთ-ერთ მონაკვეთად აღწერს.
    გზა სამსარის მთის დასავლეთით, 2010 მეტრზე მდებარე სოფელ პატარა სამსარში იწყება. აქ გამოქვაბულში VIII–IX
    საუკუნეების გუმბათიანი ეკლესიაა გამოკვეთილი, რომელიც სხვადასხვა ზომის მღვიმეებს უკავშირდება; ადმინისტრაციის
    რჩევით, მისი ნახვა მხოლოდ ადგილობრივ გიდთან ერთად შეიძლება. ტბის შემდეგ ბილიკი შაორზე ადის — 2752
    მეტრზე მდგარ ძვ. წ. II ათასწლეულის მეგალითურ ციხეზე — და ფარავნის ნაპირზე, ტამბოვკაში ეშვება. ეს სოფელი
    XIX საუკუნის 40-იან წლებში რუსეთიდან გადმოსახლებულმა რელიგიურმა თემმა, დუხობორებმა დააარსეს.


    ხალხთა კვალი ამ მიწას დღესაც ატყვია: ზეგნის სოფლები უმეტესად სომხურია, საზაფხულო საძოვრებზე შემხვედრი
    მწყემსების დიდი ნაწილი კი აზერბაიჯანელია. ბრინჯაოს ხანის მშენებლები, შუა საუკუნეების ბერები, XIX საუკუნის
    გადმოსახლებულები, დღევანდელი მწყემსები — ყველამ გადაიარა ეს ქედი და არცერთი მათგანი მანქანით არ მოსულა.
  tip: >-
    ეს სერიოზული მთის დღეა და არა ტბის პირას გაჩერება. პირდაპირი ხაზით ტბა პატარა სამსარიდან დაახლოებით
    8–9 კილომეტრითაა დაშორებული, ტამბოვკიდან — 12-ით, ორივე მხრიდან 500–550 მეტრის ასვლით; შაორის გავლით
    სრული გადასვლა ორ დღეზე სჯობს გაანაწილოთ. ინფრასტრუქტურა არ არის და ბილიკი საიმედოდ მონიშნული არაა
    — ადგილობრივი გიდი აიყვანეთ, როგორც ადმინისტრაცია გამოქვაბულის ეკლესიისთვისაც გირჩევთ. იარეთ ივნისიდან
    სექტემბრამდე; თოვლი ზაფხულის დასაწყისამდე რჩება. სალაშქრო ფეხსაცმელი, წყალი, მზისა და წვიმისგან დაცვა
    თან იქონიეთ. ფარის მცველ ნაგაზებს შორიდან აუარეთ. შესვლა უფასოა.
  route: >-
    თბილისთან ყველაზე ახლოს მდებარე საწყისი წერტილი ტამბოვკაა: შ36-ით, წყნეთისა და კოჯრის გავლით, მანგლისამდე
    იარეთ, შემდეგ შ31-ით დასავლეთისკენ, წალკის გავლით, ნინოწმინდის მიმართულებით, სანამ ფარავნის ჩრდილოეთ
    ნაპირზე სოფელი არ გამოჩნდება. ეს დაახლოებით 125 კილომეტრია, ზეგნის არათანაბარ გზაზე ორნახევარ–სამ
    საათს მოითხოვს. სოფლის იქით უხეში გრუნტის გზები დასავლეთით, ქედისკენ ადის და რუკის მიხედვით ტბამდე
    დაახლოებით 4 კილომეტრით ადრე წყდება — თბილისიდან 136 კილომეტრზე. ამ წერტილამდე ოთხ საათზე მეტი გაითვალისწინეთ
    და ეს გზები მხოლოდ მაღალი კლირენსის ჯიპით, მშრალ ამინდში და ადგილობრივებთან გადამოწმების შემდეგ გაიარეთ.
    კლასიკური საწყისი, პატარა სამსარი, მეორეხარისხოვანი გზებით დაახლოებით 170 კილომეტრშია. საწვავი წალკაში
    ჩაასხით.
en:
  name: Lake Levani and the Samsari Range
  short: >-
    A high lake on the volcanic Samsari range, reached only on foot, on a route that links a cave church,
    a prehistoric megalithic fortress and summer meadows.
  body: >-
    **No road reaches Lake Levani: at 2,565 metres on the volcanic Samsari range, everything you see from
    its shore you will have walked for.**


    The Samsari range stands over the Javakheti plateau as a chain of volcanic summits. The lake lies
    on the flank of one of them, Mount Godorebi, and looks straight across to the two Abuli mountains,
    Big and Small. In summer the meadows between the peaks fill with wildflowers; for much of the year
    this is snow country.


    Georgia's National Tourism Administration describes the lake as one stage of a high-mountain route.
    It begins in Patara Samsari, a village at 2,010 metres west of Mount Samsari, where a domed church
    of the 8th–9th century was cut into a cave and opens onto smaller caves of different sizes; the administration's
    advice is to visit it only with a local guide. Beyond the lake the path climbs to Shaori, a megalithic
    fortress of the 2nd millennium BC on a 2,752-metre summit, and drops to Tambovka on the shore of Lake
    Paravani, a village founded in the 1840s by the Doukhobors, a religious community resettled from Russia.


    People still shape this landscape. The plateau villages are mostly Armenian, and many of the shepherds
    you meet on the summer pastures are Azerbaijani. Bronze Age builders, medieval monks, nineteenth-century
    settlers, today's herdsmen: all of them crossed this range, and none of them came by car.
  tip: >-
    Treat this as a serious mountain day, not a lakeside stop. In a straight line the lake is some 8–9
    km from Patara Samsari and about 12 km from Tambovka, with 500–550 metres of ascent either way, and
    the full traverse via Shaori is better split over two days. There are no facilities and the way is
    not reliably marked, so hire a local guide, as the tourism administration also advises for the cave
    church. Go between June and September; snow can linger into early summer. Bring boots, water, and
    protection from both sun and rain. Give sheepdogs guarding flocks a wide berth. There is no fee.
  route: >-
    The trailhead nearest Tbilisi is Tambovka. Take the Sh36 through Tskneti and Kojori to Manglisi, then
    the Sh31 west through Tsalka towards Ninotsminda until the village appears on the northern shore of
    Lake Paravani: about 125 km, which the uneven plateau road stretches to two and a half or three hours.
    Beyond the village, rough tracks climb west towards the range and, on the map, stop about 4 km short
    of the lake, some 136 km from Tbilisi. Allow more than four hours to get that far, and drive them
    only in a high-clearance SUV, in dry weather, after asking locally. Patara Samsari, the classic start,
    is about 170 km by back roads. Refuel in Tsalka.
ru:
  name: Озеро Левани и хребет Самсари
  short: >-
    Озеро высоко на вулканическом хребте Самсари, куда ведёт лишь тропа — мимо пещерной церкви, доисторической
    мегалитической крепости и летних пастбищ.
  body: >-
    **К озеру Левани не ведёт ни одна дорога: оно лежит на высоте 2565 метров на вулканическом хребте
    Самсари, и всё, что вы увидите с его берега, вы заработаете ногами.**


    Хребет Самсари поднимается над Джавахетским нагорьем цепью вулканических вершин. Озеро лежит на склоне
    одной из них, горы Годореби, и смотрит прямо на две горы Абули — Большую и Малую. Летом луга между
    вершинами полны полевых цветов; бо́льшую часть года здесь царит снег.


    Национальная администрация туризма Грузии описывает озеро как один из этапов высокогорного маршрута.
    Он начинается в Патара-Самсари — селе на высоте 2010 метров к западу от горы Самсари, где в пещере
    высечена купольная церковь VIII–IX веков, соединённая с пещерами разного размера; администрация советует
    посещать её только с местным проводником. За озером тропа поднимается к Шаори — мегалитической крепости
    II тысячелетия до н. э. на вершине высотой 2752 метра — и спускается к Тамбовке на берегу озера Паравани,
    селу, основанному в 1840-х годах духоборами, религиозной общиной, переселённой из России.


    Люди до сих пор формируют этот пейзаж. Сёла нагорья в основном армянские, а многие пастухи, которых
    вы встретите на летних пастбищах, — азербайджанцы. Строители бронзового века, средневековые монахи,
    переселенцы XIX века, сегодняшние пастухи — все они пересекали этот хребет, и никто из них не приезжал
    на машине.
  tip: >-
    Относитесь к этому как к серьёзному горному дню, а не к прогулке у озера. По прямой от Патара-Самсари
    до озера около 8–9 км, от Тамбовки — около 12 км, с набором 500–550 метров с любой стороны, а полный
    траверс через Шаори лучше разбить на два дня. Инфраструктуры нет, тропа надёжно не размечена, поэтому
    наймите местного проводника — администрация туризма советует то же и для пещерной церкви. Идите с
    июня по сентябрь; снег может лежать до начала лета. Нужны ботинки, вода и защита и от солнца, и от
    дождя. Обходите стороной овчарок, охраняющих отары. Платы нет.
  route: >-
    Ближайшая к Тбилиси точка старта — Тамбовка. Поезжайте по Sh36 через Цкнети и Коджори до Манглиси,
    затем по Sh31 на запад через Цалку в сторону Ниноцминды, пока на северном берегу озера Паравани не
    покажется село: около 125 км, которые неровная дорога по нагорью растягивает на два с половиной —
    три часа. За селом разбитые колеи поднимаются на запад к хребту и, судя по карте, обрываются примерно
    в 4 км от озера, в 136 км от Тбилиси. Чтобы добраться туда, закладывайте больше четырёх часов и езжайте
    только на внедорожнике с высоким клиренсом, в сухую погоду и расспросив местных. Патара-Самсари, классическая
    точка старта, — около 170 км по второстепенным дорогам. Заправляйтесь в Цалке.
fa:
  name: دریاچهٔ لوانی و رشته‌کوه سامساری
  short: >-
    دریاچه‌ای بر رشته‌کوه آتشفشانی سامساری که فقط پیاده به آن می‌رسید، بر مسیری که کلیسایی غاری، دژی مگالیتی
    پیش‌ازتاریخی و چراگاه‌های تابستانی را به هم می‌پیوندد.
  body: >-
    **هیچ جاده‌ای به دریاچهٔ لوانی نمی‌رسد: در ارتفاع ۲۵۶۵ متری بر رشته‌کوه آتشفشانی سامساری، هرچه از
    کرانه‌اش می‌بینید، بهایش را با پای خود پرداخته‌اید.**


    رشته‌کوه سامساری چون زنجیره‌ای از قله‌های آتشفشانی بر فراز فلات جاواخِتی ایستاده است. دریاچه بر دامنهٔ
    یکی از آن‌ها، کوه گودوربی، قرار دارد و درست رو به دو کوه آبولی، بزرگ و کوچک، است. در تابستان مرغزارهای
    میان قله‌ها پر از گل‌های وحشی می‌شود؛ در بیشتر روزهای سال اینجا سرزمین برف است.


    ادارهٔ ملی گردشگری گرجستان این دریاچه را یکی از منزل‌های یک مسیر کوهستانی مرتفع معرفی می‌کند. مسیر
    از پاتارا سامساری آغاز می‌شود، روستایی در ارتفاع ۲۰۱۰ متری در غرب کوه سامساری، که در آن کلیسایی گنبددار
    از قرن هشتم تا نهم درون غاری تراشیده شده و به غارهای کوچک‌تری در اندازه‌های گوناگون راه دارد؛ توصیهٔ
    این اداره آن است که فقط همراه راهنمای محلی از آن دیدن کنید. پس از دریاچه، راه به شائوری بالا می‌رود،
    دژی مگالیتی از هزارهٔ دوم پیش از میلاد بر قله‌ای به ارتفاع ۲۷۵۲ متر، و سپس به تامبوفکا بر کرانهٔ دریاچهٔ
    پاراوانی فرود می‌آید؛ روستایی که در دههٔ ۱۸۴۰ دوخوبورها، جامعه‌ای مذهبی که از روسیه کوچانده شده بودند،
    بنیان گذاشتند.


    مردم هنوز به این چشم‌انداز شکل می‌دهند. روستاهای فلات بیشتر ارمنی‌نشین‌اند و بسیاری از چوپانانی که
    در چراگاه‌های تابستانی می‌بینید آذربایجانی‌اند. سازندگان عصر مفرغ، راهبان سده‌های میانه، مهاجران قرن
    نوزدهم، گله‌داران امروز: همه از این رشته‌کوه گذشته‌اند و هیچ‌کدام با خودرو نیامده‌اند.
  tip: >-
    این را یک روز جدی کوهستانی بدانید، نه توقفی کنار دریاچه. در خط مستقیم، دریاچه حدود ۸ تا ۹ کیلومتر
    از پاتارا سامساری و حدود ۱۲ کیلومتر از تامبوفکا فاصله دارد، با ۵۰۰ تا ۵۵۰ متر صعود از هر دو سو، و
    پیمایش کامل از راه شائوری بهتر است در دو روز انجام شود. هیچ امکاناتی نیست و راه به‌طور مطمئن نشانه‌گذاری
    نشده، پس راهنمای محلی بگیرید؛ همان‌طور که ادارهٔ گردشگری برای کلیسای غاری هم توصیه می‌کند. میان ژوئن
    و سپتامبر بروید؛ برف ممکن است تا اوایل تابستان بماند. کفش کوه، آب و محافظ در برابر آفتاب و باران همراه
    داشته باشید. از سگ‌های گله که از رمه‌ها نگهبانی می‌کنند فاصلهٔ زیادی بگیرید. ورودیه‌ای در کار نیست.
  route: >-
    نزدیک‌ترین نقطهٔ شروع به تفلیس، تامبوفکا است. جادهٔ Sh36 را از راه تسکنتی و کوجوری تا مانگلیسی بگیرید،
    سپس جادهٔ Sh31 را به سمت غرب از میان تسالکا به سوی نینوتسمیندا ادامه دهید تا روستا بر کرانهٔ شمالی
    دریاچهٔ پاراوانی پیدا شود: حدود ۱۲۵ کیلومتر که جادهٔ ناهموار فلات آن را به دو ساعت و نیم تا سه ساعت
    می‌کشاند. پس از روستا، راه‌های خاکی ناهموار به سمت غرب و رشته‌کوه بالا می‌روند و روی نقشه حدود ۴ کیلومتر
    مانده به دریاچه، در حدود ۱۳۶ کیلومتری تفلیس، تمام می‌شوند. برای رسیدن تا آنجا بیش از چهار ساعت وقت
    بگذارید و فقط با خودروی شاسی‌بلند با فاصلهٔ زیاد از زمین، در هوای خشک و پس از پرس‌وجو از اهالی برانید.
    پاتارا سامساری، نقطهٔ شروع کلاسیک، از راه‌های فرعی حدود ۱۷۰ کیلومتر فاصله دارد. در تسالکا سوخت بگیرید.
he:
  name: אגם לוואני ורכס סמסרי
  short: >-
    אגם גבוה על רכס סמסרי הגעשי, שאליו מגיעים רק ברגל, במסלול שמחבר כנסיית מערה, מבצר מגליתי פרהיסטורי
    וכרי מרעה של קיץ.
  body: >-
    **שום כביש אינו מגיע לאגם לוואני: בגובה 2,565 מטר על רכס סמסרי הגעשי, כל מה שתראו מחופו — הרווחתם
    בהליכה.**


    רכס סמסרי מתנשא מעל רמת ג'וואחתי כשרשרת של פסגות געשיות. האגם שוכן על צלע אחת מהן, הר גודורבי, ומשקיף
    ישירות על שני הרי אבולי, הגדול והקטן. בקיץ ממלאים פרחי בר את כרי הדשא שבין הפסגות; ברוב ימות השנה
    זו ארץ של שלג.


    מנהלת התיירות הלאומית של גאורגיה מתארת את האגם כשלב אחד במסלול הררי גבוה. המסלול מתחיל בפטרה סמסרי,
    כפר בגובה 2,010 מטר ממערב להר סמסרי, שבו נחצבה בתוך מערה כנסייה בעלת כיפה מהמאות ה-8–9, הנפתחת אל
    מערות קטנות יותר בגדלים שונים; המנהלת ממליצה לבקר בה רק עם מדריך מקומי. מעבר לאגם השביל מטפס לשאורי,
    מבצר מגליתי מהאלף השני לפני הספירה על פסגה בגובה 2,752 מטר, ויורד לטמבובקה שעל חוף אגם פאראווני —
    כפר שנוסד בשנות ה-40 של המאה ה-19 בידי הדוחובורים, קהילה דתית שהועברה מרוסיה.


    אנשים עדיין מעצבים את הנוף הזה. כפרי הרמה הם ברובם ארמניים, ורבים מהרועים שתפגשו בכרי המרעה של הקיץ
    הם אזרים. בוני תקופת הברונזה, נזירים מימי הביניים, מתיישבי המאה ה-19, רועי הצאן של היום: כולם חצו
    את הרכס הזה, ואף אחד מהם לא הגיע ברכב.
  tip: >-
    התייחסו לזה כאל יום הררי רציני, לא כאל עצירה ליד אגם. בקו אווירי האגם נמצא כ-8–9 ק"מ מפטרה סמסרי וכ-12
    ק"מ מטמבובקה, עם עלייה של 500–550 מטר מכל כיוון, ואת חציית הרכס המלאה דרך שאורי עדיף לפצל ליומיים.
    אין שום מתקנים והשביל אינו מסומן באופן אמין, אז שכרו מדריך מקומי, כפי שגם מנהלת התיירות ממליצה לגבי
    כנסיית המערה. צאו בין יוני לספטמבר; שלג עלול להישאר עד תחילת הקיץ. הביאו נעלי הליכה, מים והגנה גם
    מפני שמש וגם מפני גשם. התרחקו מכלבי רועים ששומרים על עדרים. אין דמי כניסה.
  route: >-
    נקודת המוצא הקרובה ביותר לטביליסי היא טמבובקה. סעו בכביש Sh36 דרך צקנתי וקוג'ורי עד מאנגליסי, ומשם
    בכביש Sh31 מערבה דרך צאלקה לכיוון נינוצמינדה, עד שהכפר מופיע על החוף הצפוני של אגם פאראווני: כ-125
    ק"מ, שהכביש הלא אחיד של הרמה מותח לשעתיים וחצי עד שלוש שעות. אחרי הכפר דרכי עפר משובשות מטפסות מערבה
    לעבר הרכס, ולפי המפה נגמרות כ-4 ק"מ לפני האגם, כ-136 ק"מ מטביליסי. הקצו יותר מארבע שעות כדי להגיע
    עד שם, ונסעו בהן רק ברכב שטח גבוה, במזג אוויר יבש, ואחרי בירור אצל המקומיים. פטרה סמסרי, נקודת המוצא
    הקלאסית, נמצאת כ-170 ק"מ מטביליסי בדרכים צדדיות. תדלקו בצאלקה.
ar:
  name: بحيرة ليفاني وسلسلة سامساري
  short: >-
    بحيرة عالية على سلسلة سامساري البركانية لا تُبلغ إلا مشيًا، على درب يصل كنيسة كهفية وقلعة ميغاليثية
    من عصور ما قبل التاريخ ومراعي الصيف.
  body: >-
    **لا طريق يصل إلى بحيرة ليفاني: فعلى ارتفاع 2565 مترًا فوق سلسلة سامساري البركانية، كل ما ترونه من
    شاطئها ستكونون قد مشيتم لأجله.**


    تنتصب سلسلة سامساري فوق هضبة جاواخيتي عِقدًا من القمم البركانية. وتقع البحيرة على سفح إحداها، جبل
    غودوريبي، وتطل مباشرة على جبلي أبولي، الكبير والصغير. في الصيف تمتلئ المروج بين القمم بالأزهار البرية؛
    وفي معظم أيام السنة هذه بلاد الثلج.


    تصف الإدارة الوطنية للسياحة في جورجيا البحيرة بأنها مرحلة من مسار جبلي عالٍ. يبدأ المسار في باتارا
    سامساري، وهي قرية على ارتفاع 2010 أمتار غربي جبل سامساري، نُحتت فيها داخل كهف كنيسة ذات قبة من القرنين
    الثامن والتاسع تنفتح على كهوف أصغر مختلفة الأحجام؛ وتنصح الإدارة بزيارتها برفقة دليل محلي فقط. بعد
    البحيرة يصعد الدرب إلى شاوري، وهي قلعة ميغاليثية من الألفية الثانية قبل الميلاد على قمة ارتفاعها 2752
    مترًا، ثم ينحدر إلى تامبوفكا على شاطئ بحيرة بارافاني، وهي قرية أسسها الدوخوبور في أربعينيات القرن
    التاسع عشر، وهم جماعة دينية هُجِّرت من روسيا.


    وما زال الناس يشكّلون هذا المشهد. قرى الهضبة أرمنية في معظمها، وكثير من الرعاة الذين ستلتقونهم في
    المراعي الصيفية أذربيجانيون. بناة العصر البرونزي، ورهبان العصور الوسطى، ومهاجرو القرن التاسع عشر،
    ورعاة اليوم: كلهم عبروا هذه السلسلة، ولم يأتِ أحد منهم بالسيارة.
  tip: >-
    تعاملوا مع هذه الرحلة بوصفها يومًا جبليًا جادًا لا وقفة على ضفة بحيرة. في خط مستقيم تبعد البحيرة نحو
    8–9 كم عن باتارا سامساري ونحو 12 كم عن تامبوفكا، مع صعود 500–550 مترًا من أي الجهتين، ومن الأفضل تقسيم
    العبور الكامل عبر شاوري على يومين. لا مرافق، والدرب غير مُعلَّم على نحو يُعتمد عليه، فاستأجروا دليلًا
    محليًا، كما تنصح إدارة السياحة أيضًا لزيارة الكنيسة الكهفية. اذهبوا بين يونيو وسبتمبر؛ فقد يبقى الثلج
    حتى مطلع الصيف. أحضروا أحذية مشي وماءً وحماية من الشمس والمطر معًا. ابتعدوا مسافة واسعة عن كلاب الرعاة
    التي تحرس القطعان. لا رسوم.
  route: >-
    أقرب نقطة انطلاق إلى تبليسي هي تامبوفكا. خذوا طريق Sh36 عبر تسكنيتي وكوجوري حتى مانغليسي، ثم طريق
    Sh31 غربًا عبر تسالكا باتجاه نينوتسميندا حتى تظهر القرية على الشاطئ الشمالي لبحيرة بارافاني: نحو 125
    كم، يمدّها طريق الهضبة غير المستوي إلى ساعتين ونصف أو ثلاث ساعات. بعد القرية تصعد مسالك وعرة غربًا
    نحو السلسلة، وتنتهي على الخريطة على بعد نحو 4 كم من البحيرة، على مسافة نحو 136 كم من تبليسي. خصصوا
    أكثر من أربع ساعات لبلوغ ذلك الموضع، ولا تسلكوا تلك المسالك إلا بسيارة دفع رباعي عالية الخلوص الأرضي،
    في طقس جاف، وبعد السؤال محليًا. أما باتارا سامساري، نقطة الانطلاق التقليدية، فتبعد نحو 170 كم عبر
    طرق فرعية. تزوّدوا بالوقود في تسالكا.
