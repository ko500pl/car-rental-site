ka:
  name: აღმაშენებლის გამზირი („ახალი ტფილისი“)
  short: >-
    გერმანელი კოლონისტების სოფლის გზა, მარცხენა სანაპიროს დიდ გამზირად ქცეული: აღდგენილი ფასადები, რკინის
    აივნები და საღამოს გამოცოცხლებული საფეხმავლო ქუჩა.
  body: >-
    **ორასი წლის წინ ეს გამზირი სოფლის ქუჩა იყო, რომელსაც ორივე მხრიდან შვაბური ბოსტნები მიუყვებოდა.**
    1818 წელს ვიურტემბერგიდან გადმოსახლებულმა გერმანელებმა მტკვრის მარცხენა ნაპირზე, სოფელ კუკიის მახლობლად,
    ალექსანდერდორფი დააარსეს: ბაღ-ბოსტნით გარშემორტყმული სახლების ორი მწკრივი, ერთი გზის გასწვრივ ჩამწკრივებული.
    კოლონისტები მიწას ამუშავებდნენ და მოსავალს თბილისის ბაზრებზე ყიდდნენ, 1820 წელს კი იქ, სადაც ახლა
    მარჯანიშვილის მოედანია, ლუთერანული ეკლესია, „კირხე“, ააგეს. აქედან მომდინარეობს იქიდან გამავალი ქუჩის
    ძველი სახელი, „კიროჩნაია“.


    ქალაქმა კოლონია თანდათან შთანთქა. 1851 წლიდან გზას მიხეილის ქუჩა ერქვა, ნიკოლოზ I-ის ძის, დიდი მთავრის,
    შემდგომში კავკასიის მეფისნაცვლის, მიხეილ რომანოვის პატივსაცემად; გამზირზე მდგარ საავადმყოფოს „მიხაილოვის“
    სახელი დღემდე შემორჩა. 1918 წლიდან ქუჩა რუსი მარქსისტის, გიორგი პლეხანოვის, სახელს ატარებდა, 1988
    წელს კი დავით აღმაშენებლის სახელი ეწოდა. კირხემ საბჭოთა წლებს ვერ გაუძლო: 1946–1947 წლებში ხელისუფლებამ
    ის დაანგრია, დანგრევა კი გერმანელ სამხედრო ტყვეებს დააკისრა.


    2009 წლის ბოლოს გამზირის რეაბილიტაცია დაიწყო: სამოცდაათამდე შენობა აღადგინეს, ახლიდან მოაწყვეს სავალი
    ნაწილი, ტროტუარები და განათება, განახლებული გამზირი კი 2011 წლის 23 ნოემბერს გაიხსნა. ზაარბრიუკენის
    მოედნისკენ მიმავალი ქვედა მონაკვეთი დღეს საფეხმავლოა და „ახალ ტფილისად“ იწოდება.


    აქ აუჩქარებლად უნდა იაროთ. პასტელისფერი ბათქაში, მაქმანივით ნატიფი თუჯის აივნები, მძიმე კარები, რომლებიც
    მოხატულ სადარბაზოებსა და სარეცხგაფენილ ეზოებში გადის. მოდით შებინდებისას, როცა ფარნები ინთება და ტერასები
    ივსება, და გახსოვდეთ: ფილაქნის ქვეშ ჯერაც ის სოფლის გზა მიიკლაკნება, რომელსაც ოდესღაც ორივე მხრიდან
    ბოსტნები მიუყვებოდა.
  tip: >-
    მოდით გვიან შუადღით, რომ ფასადები დღის სინათლეზეც ნახოთ და დაღამების შემდეგ ფარნების შუქზეც. საფეხმავლო
    მონაკვეთის კაფეებში ფასები სტუმრისთვისაა გათვლილი, ერთი-ორი ქუჩის იქით კი უკეთესად და იაფად ჭამთ.
    ბევრი სადარბაზო კერძო სახლია: თუ კარი ღიაა, ჩუმად შეიხედეთ და მცხოვრებლებს ნუ გადაუღებთ. მეტრო „მარჯანიშვილი“
    გამზირზეა, „ფაბრიკამდე“ ხუთი წუთის სავალია. ტუალეტი კაფეებშია. ჯიბგირობა იშვიათია, მაგრამ ზაფხულის
    ხალხმრავალ საღამოებში ჩანთას თვალი ადევნეთ. ზამთარშიც სასიამოვნო სასეირნოა: ქუჩა ქარისგან საკმაოდ
    დაცულია.
  route: >-
    თავისუფლების მოედნიდან ბარათაშვილის ხიდით გადაკვეთეთ მტკვარი და ზაარბრიუკენის მოედნისკენ აიღეთ გეზი:
    დაახლოებით 2 კილომეტრი, უსაცობოდ ათი წუთი. საფეხმავლო მონაკვეთზე მანქანით შესვლა აკრძალულია, ამიტომ
    მანქანა გვერდით ქუჩებზე, ქალაქის ზონალურ ფასიან პარკინგზე დატოვეთ (საფასური Tbilisi Parking-ის აპლიკაციით
    გადაიხდება) ან „ფაბრიკის“ ეზოს სადგომზე და ფეხით გააგრძელეთ. პიკის საათებში მარჯანიშვილის ხიდთან საცობს
    ელოდეთ. არც გზის ნომრები, არც ხრეში, არც სხვა საფიქრალი: ეკონომკლასის მანქანა სავსებით კმარა. გულახდილად
    რომ ვთქვათ, მეტროთი „მარჯანიშვილამდე“ ხშირად უფრო სწრაფად მიხვალთ და პარკინგის ძებნაც აღარ მოგიწევთ.
en:
  name: Aghmashenebeli Avenue (New Tiflis)
  short: >-
    A German colonists' village road turned grand avenue on the left bank: restored facades, iron balconies
    and a car-free stretch that wakes at dusk.
  body: >-
    **Two hundred years ago this avenue was a village street lined with Swabian kitchen gardens.** In
    1818 colonists from Württemberg founded Alexanderdorf here, on the left bank of the Mtkvari beside
    the village of Kukia: two rows of houses, each wrapped in orchard and vegetable plot, strung along
    a single road. They farmed and sold their produce in the Tbilisi markets, and in 1820 they built a
    Lutheran church, the Kirche, where Marjanishvili Square is now. That is why the street leading off
    it was long known as Kirochnaya.


    The city swallowed the colony. From 1851 the road was Mikheil Street, named for Grand Duke Mikhail
    Nikolayevich, son of Nicholas I and later viceroy of the Caucasus; the hospital on the avenue still
    carries the name Mikhailov. From 1918 it was Plekhanov Street, after the Russian Marxist, and only
    in 1988 did it take the name of King David IV the Builder. The Kirche did not survive the Soviet years:
    in 1946–1947 the authorities had it pulled down, and set German prisoners of war to do the work.


    Restoration began at the end of 2009. Some seventy buildings were repaired along with the roadway,
    pavements and lighting, and the renewed avenue reopened on 23 November 2011. The lower stretch towards
    Saarbrücken Square is now car-free and goes by the name New Tiflis.


    Walk it slowly. Pastel stucco, cast-iron balconies fine as lace, heavy doors that open onto painted
    stairwells and courtyards hung with washing. Come at dusk, when the lamps come on and the terraces
    fill, and remember that under the paving still runs a village road with gardens on either side.
  tip: >-
    Arrive in the late afternoon to see the facades by daylight and the lamps after dark. Cafés on the
    pedestrian stretch charge visitor prices; a street or two away you eat better for less. Many entrance
    halls are private homes: if a door is open, look quietly and do not photograph residents. Marjanishvili
    metro station is on the avenue, and Fabrika is a five-minute walk. Toilets are in the cafés. Pickpocketing
    is rare, but keep an eye on your bag on crowded summer evenings. In winter the avenue stays pleasant:
    it is fairly sheltered from the wind.
  route: >-
    From Freedom Square cross the Mtkvari by Baratashvili Bridge towards Saarbrücken Square: about 2 km,
    ten minutes without traffic. The pedestrian stretch is closed to cars, so park in the side streets
    in the city's zonal paid parking (pay through the Tbilisi Parking app) or in the courtyard lot at
    Fabrika, and walk. At rush hour expect jams around Marjanishvili Bridge. No road numbers, no gravel,
    nothing to worry about: an economy car is all you need. Honestly, the metro to Marjanishvili is often
    quicker than driving, and it saves the hunt for a parking space.
ru:
  name: Проспект Агмашенебели («Новый Тифлис»)
  short: >-
    Сельская улица немецких колонистов стала парадным проспектом левого берега: фасады, чугунные балконы
    и пешеходный участок, оживающий в сумерках.
  body: >-
    **Двести лет назад этот проспект был деревенской улицей, вдоль которой тянулись швабские огороды.**
    В 1818 году колонисты из Вюртемберга основали здесь, на левом берегу Мтквари рядом с селом Кукия,
    Александерсдорф: два ряда домов, каждый в кольце сада и огорода, вытянулись вдоль единственной дороги.
    Колонисты возделывали землю и продавали урожай на тбилисских рынках, а в 1820 году построили лютеранскую
    церковь — кирху — там, где теперь площадь Марджанишвили. Поэтому улица, уходившая от неё, долго называлась
    Кирочной.


    Город поглотил колонию. С 1851 года дорога звалась Михайловской улицей — в честь великого князя Михаила
    Николаевича, сына Николая I, впоследствии наместника на Кавказе; больница на проспекте до сих пор
    носит имя Михайловской. С 1918 года это была улица Плеханова, в честь русского марксиста, и лишь в
    1988 году она получила имя царя Давида IV Строителя — Агмашенебели. Кирха не пережила советских лет:
    в 1946–1947 годах власти её снесли, поручив эту работу немецким военнопленным.


    Реставрация началась в конце 2009 года. Отремонтировали около семидесяти зданий, а заодно проезжую
    часть, тротуары и освещение, и обновлённый проспект открылся 23 ноября 2011 года. Нижний участок в
    сторону Саарбрюккенской площади теперь закрыт для машин и зовётся «Новым Тифлисом».


    Идите по нему не спеша. Штукатурка пастельных тонов, кружевные чугунные балконы, тяжёлые двери, за
    которыми расписные лестничные клетки и дворики с развешанным бельём. Приходите в сумерках, когда зажигаются
    фонари и заполняются летние веранды, и помните, что под мостовой до сих пор бежит деревенская дорога
    с садами по обе стороны.
  tip: >-
    Приходите ближе к вечеру, чтобы увидеть фасады при дневном свете, а фонари — уже в темноте. Кафе на
    пешеходном участке берут туристические цены; через одну-две улицы можно поесть лучше и дешевле. Многие
    подъезды принадлежат жилым домам: если дверь открыта, смотрите тихо и не фотографируйте жильцов. Станция
    метро «Марджанишвили» — прямо на проспекте, до «Фабрики» пять минут пешком. Туалеты — в кафе. Карманники
    здесь редкость, но в людные летние вечера присматривайте за сумкой. Зимой на проспекте тоже приятно:
    он неплохо укрыт от ветра.
  route: >-
    От площади Свободы переезжайте Мтквари по мосту Бараташвили в сторону Саарбрюккенской площади: около
    2 км, десять минут без пробок. Пешеходный участок закрыт для машин, поэтому паркуйтесь на боковых
    улицах в городской зоне платной парковки (оплата через приложение Tbilisi Parking) или на дворовой
    стоянке у «Фабрики» и идите пешком. В час пик ждите пробок у моста Марджанишвили. Ни номерных трасс,
    ни гравия, ни поводов для беспокойства: вполне хватит машины эконом-класса. Честно говоря, на метро
    до «Марджанишвили» часто быстрее, чем на машине, — и не придётся искать, где припарковаться.
fa:
  name: خیابان آغماشنبلی («تفلیس نو»)
  short: >-
    جادهٔ روستایی مهاجران آلمانی که به خیابانی باشکوه در کرانهٔ چپ بدل شد: نماهای مرمت‌شده، بالکن‌های
    آهنی و بخشی بی‌خودرو که با غروب جان می‌گیرد.
  body: >-
    **دویست سال پیش این خیابان کوچه‌ای روستایی بود که در دو سویش باغچه‌های سبزی شوابی ردیف شده بود.**
    در ۱۸۱۸ مهاجرانی از وورتمبرگ اینجا، در کرانهٔ چپ رود متکواری و کنار روستای کوکیا، آلکساندردورف را
    بنیاد نهادند: دو ردیف خانه، هر یک در میان باغ میوه و کرت سبزی، در امتداد یک جادهٔ تنها. آنان کشت‌وکار
    می‌کردند و محصولشان را در بازارهای تفلیس می‌فروختند، و در ۱۸۲۰ کلیسایی لوتری، «کیرخه»، ساختند، همان‌جا
    که امروز میدان مارجانیشویلی است. از همین رو خیابانی که از آنجا جدا می‌شد، مدت‌ها «کیروچنایا» نام داشت.


    شهر آبادی مهاجران را در خود فرو برد. از ۱۸۵۱ این جاده خیابان میخائیل بود، به نام دوک بزرگ میخائیل
    نیکلایویچ، پسر نیکلای یکم و بعدها نایب‌السلطنهٔ قفقاز؛ بیمارستانی در این خیابان هنوز نام «میخائیلوف»
    را بر خود دارد. از ۱۹۱۸ خیابان پلخانوف شد، به نام مارکسیست روس، و تنها در ۱۹۸۸ نام شاه داوید چهارم
    سازنده (آغماشنبلی) را گرفت. کیرخه از سال‌های شوروی جان به در نبرد: در ۱۹۴۶–۱۹۴۷ مقامات آن را ویران
    کردند و این کار را بر دوش اسیران جنگی آلمانی گذاشتند.


    مرمت در پایان ۲۰۰۹ آغاز شد. حدود هفتاد ساختمان همراه با سواره‌رو، پیاده‌روها و روشنایی بازسازی شد
    و خیابانِ نوشده در ۲۳ نوامبر ۲۰۱۱ دوباره گشوده شد. بخش پایینی، به‌سوی میدان زاربروکن، اکنون بی‌خودرو
    است و «تفلیس نو» خوانده می‌شود.


    آهسته در آن قدم بزنید. گچ‌بری‌های پاستلی، بالکن‌های چدنی ظریف چون تور، درهای سنگینی که به راه‌پله‌های
    نقاشی‌شده و حیاط‌هایی پر از رخت آویخته باز می‌شوند. هنگام غروب بیایید، وقتی چراغ‌ها روشن می‌شوند و
    میزهای بیرون کافه‌ها پر می‌شوند، و به یاد داشته باشید که زیر این سنگفرش هنوز جاده‌ای روستایی با باغ‌هایی
    در دو سو امتداد دارد.
  tip: >-
    اواخر بعدازظهر برسید تا نماها را در روشنایی روز و چراغ‌ها را پس از تاریکی ببینید. کافه‌های بخش پیاده
    قیمت توریستی می‌گیرند؛ یکی دو خیابان آن‌طرف‌تر بهتر و ارزان‌تر غذا می‌خورید. بسیاری از سرسراهای ورودی
    به خانه‌های مسکونی تعلق دارند: اگر دری باز بود، آرام نگاه کنید و از ساکنان عکس نگیرید. ایستگاه متروی
    مارجانیشویلی روی همین خیابان است و فابریکا پنج دقیقه پیاده فاصله دارد. سرویس بهداشتی در کافه‌هاست.
    جیب‌بری نادر است، اما در شب‌های شلوغ تابستان حواستان به کیفتان باشد. در زمستان هم خیابان دلپذیر می‌ماند،
    چون تا حد خوبی از باد در امان است.
  route: >-
    از میدان آزادی با پل باراتاشویلی از متکواری بگذرید و به‌سوی میدان زاربروکن بروید: حدود ۲ کیلومتر،
    ده دقیقه بدون ترافیک. بخش پیاده به روی خودرو بسته است، پس در خیابان‌های فرعی و در پارکینگ منطقه‌ای
    پولی شهر (پرداخت از طریق اپلیکیشن Tbilisi Parking) یا در پارکینگ حیاط فابریکا پارک کنید و پیاده بروید.
    در ساعت‌های شلوغی نزدیک پل مارجانیشویلی منتظر ترافیک باشید. نه شمارهٔ جاده‌ای، نه شن، نه جای نگرانی:
    خودروی اقتصادی کاملاً کافی است. راستش را بخواهید، مترو تا مارجانیشویلی اغلب از رانندگی سریع‌تر است
    و از گشتن دنبال جای پارک هم نجاتتان می‌دهد.
he:
  name: שדרות אגמשנבלי ("טיפליס החדשה")
  short: >-
    דרך כפרית של מתיישבים גרמנים שהפכה לשדרה מפוארת בגדה השמאלית: חזיתות משוחזרות, מרפסות ברזל וקטע ללא
    מכוניות שמתעורר עם רדת החשכה.
  body: >-
    **לפני מאתיים שנה הייתה השדרה הזאת רחוב כפרי שלאורכו השתרעו גינות ירק שוואביות.** ב-1818 ייסדו כאן
    מתיישבים מווירטמברג את אלכסנדרדורף, על הגדה השמאלית של המטקוורי ליד הכפר קוקיה: שתי שורות של בתים,
    כל אחד מוקף מטע וערוגות ירק, לאורך דרך אחת. הם עיבדו את האדמה ומכרו את התוצרת בשווקים של טביליסי,
    וב-1820 בנו כנסייה לותרנית, ה"קירכה", במקום שבו נמצאת היום כיכר מרג'נישווילי. לכן הרחוב שיצא ממנה
    נקרא זמן רב "קירוצ'נאיה".


    העיר בלעה את המושבה. משנת 1851 נקראה הדרך רחוב מיכאיל, על שם הדוכס הגדול מיכאיל ניקולאייביץ', בנו
    של ניקולאי הראשון ולימים המשנה למלך בקווקז; בית החולים שבשדרה נושא עד היום את השם "מיכאילוב". מ-1918
    היה זה רחוב פלחנוב, על שם המרקסיסט הרוסי, ורק ב-1988 קיבל את שמו של המלך דוד הרביעי הבונה – אגמשנבלי.
    הקירכה לא שרדה את השנים הסובייטיות: ב-1946–1947 הרסו אותה השלטונות, והטילו את העבודה על שבויי מלחמה
    גרמנים.


    השיקום החל בסוף 2009. כשבעים בניינים שופצו, ואיתם הכביש, המדרכות והתאורה, והשדרה המחודשת נפתחה שוב
    ב-23 בנובמבר 2011. הקטע התחתון, לכיוון כיכר זארבריקן, סגור כיום לתנועת מכוניות ונקרא "טיפליס החדשה".


    לכו בה לאט. טיח בגווני פסטל, מרפסות ברזל יצוק עדינות כתחרה, דלתות כבדות שנפתחות אל חדרי מדרגות מצוירים
    ואל חצרות שכביסה תלויה בהן. בואו בשעת בין הערביים, כשהפנסים נדלקים והשולחנות שבחוץ מתמלאים, וזכרו
    שמתחת לריצוף עדיין עוברת דרך כפרית עם גינות משני צדדיה.
  tip: >-
    הגיעו בשעות אחר הצהריים המאוחרות כדי לראות את החזיתות באור יום ואת הפנסים אחרי החשכה. בתי הקפה במדרחוב
    גובים מחירי תיירים; רחוב או שניים משם אוכלים טוב יותר בפחות כסף. רבים מהמבואות שייכים לבתי מגורים
    פרטיים: אם דלת פתוחה, הציצו בשקט ואל תצלמו את הדיירים. תחנת המטרו מרג'נישווילי נמצאת על השדרה עצמה,
    ופבריקה במרחק חמש דקות הליכה. שירותים יש בבתי הקפה. כייסים הם תופעה נדירה, אבל שימו עין על התיק בערבי
    קיץ צפופים. גם בחורף השדרה נעימה: היא מוגנת למדי מהרוח.
  route: >-
    מכיכר החירות חצו את המטקוורי בגשר ברטשווילי לכיוון כיכר זארבריקן: כ-2 ק"מ, עשר דקות בלי פקקים. המדרחוב
    סגור לרכב, אז חנו ברחובות הצדדיים, באזורי החניה העירוניים בתשלום (תשלום דרך אפליקציית Tbilisi Parking),
    או בחניון החצר של פבריקה, והמשיכו ברגל. בשעות העומס צפו לפקקים סביב גשר מרג'נישווילי. בלי מספרי כבישים,
    בלי חצץ, בלי סיבה לדאגה: רכב מקטגוריית אקונומי הוא כל מה שצריך. ובכנות, המטרו עד מרג'נישווילי מהיר
    לעיתים קרובות יותר מהנסיעה ברכב, וחוסך את החיפוש אחר חניה.
ar:
  name: جادة أغماشينيبيلي («تفليس الجديدة»)
  short: >-
    طريق قرية أسسها مستوطنون ألمان صار جادة فخمة على الضفة اليسرى: واجهات مرمّمة، وشرفات من الحديد، وجزء
    خالٍ من السيارات يستيقظ عند الغسق.
  body: >-
    **قبل مئتي عام كانت هذه الجادة شارعاً قروياً تصطف على جانبيه بساتين خضار شوابية.** ففي عام 1818 أسس
    مستوطنون من فورتمبيرغ هنا قرية ألكسندردورف، على الضفة اليسرى لنهر متكفاري بجوار قرية كوكيا: صفّان
    من البيوت، يحيط بكل بيت بستان فاكهة وحقل خضار، ممتدّان على طريق واحد. كانوا يزرعون الأرض ويبيعون محاصيلهم
    في أسواق تبليسي، وفي عام 1820 بنوا كنيسة لوثرية، «الكيرخه»، حيث تقع اليوم ساحة مارجانيشفيلي. ولهذا
    ظل الشارع المتفرّع منها يُعرف طويلاً باسم «كيروتشنايا».


    ثم ابتلعت المدينة المستوطنة. فمنذ عام 1851 صار الطريق شارع ميخائيل، نسبة إلى الدوق الأكبر ميخائيل
    نيكولايفيتش، ابن نيقولا الأول ونائب الملك في القوقاز لاحقاً؛ وما زال المستشفى الواقع على الجادة يحمل
    اسم «ميخائيلوف». ومن عام 1918 صار شارع بليخانوف، نسبة إلى الماركسي الروسي، ولم يتخذ اسم الملك داود
    الرابع البنّاء (أغماشينيبيلي) إلا في عام 1988. أما الكيرخه فلم تنجُ من السنوات السوفيتية: ففي 1946–1947
    هدمتها السلطات، وسخّرت أسرى حرب ألماناً للقيام بالعمل.


    بدأ الترميم في أواخر عام 2009. فرُمّم نحو سبعين مبنى إلى جانب الطريق والأرصفة والإنارة، وأُعيد افتتاح
    الجادة المجدّدة في 23 نوفمبر 2011. أما الجزء السفلي باتجاه ساحة زاربروكن فصار اليوم مغلقاً أمام السيارات
    ويُعرف باسم «تفليس الجديدة».


    امشِ فيها على مهل. جصّ بألوان الباستيل، وشرفات من الحديد المصبوب رقيقة كالدانتيل، وأبواب ثقيلة تنفتح
    على سلالم مزدانة بالرسوم وأفنية يتدلّى فيها الغسيل. تعالَ عند الغسق، حين تُضاء المصابيح وتمتلئ طاولات
    المقاهي في الهواء الطلق، وتذكّر أن تحت البلاط ما زال يمتد طريق قرية تحفّ به البساتين من الجانبين.
  tip: >-
    تعالَ في أواخر العصر لترى الواجهات في ضوء النهار والمصابيح بعد حلول الظلام. مقاهي الجزء المخصص للمشاة
    تتقاضى أسعار السياح؛ وعلى بُعد شارع أو اثنين تأكل أفضل بسعر أقل. كثير من المداخل تابعة لبيوت سكنية
    خاصة: إن وجدت باباً مفتوحاً فانظر بهدوء ولا تصوّر السكان. محطة مترو مارجانيشفيلي على الجادة نفسها،
    و«فابريكا» على بعد خمس دقائق سيراً. دورات المياه في المقاهي. النشل نادر، لكن انتبه لحقيبتك في أمسيات
    الصيف المزدحمة. وفي الشتاء تبقى الجادة لطيفة، فهي محمية نسبياً من الريح.
  route: >-
    من ساحة الحرية اعبر نهر متكفاري على جسر باراتاشفيلي باتجاه ساحة زاربروكن: نحو 2 كم، عشر دقائق من دون
    زحام. الجزء المخصص للمشاة مغلق أمام السيارات، فاركن في الشوارع الجانبية ضمن مواقف المدينة المدفوعة
    حسب المناطق (الدفع عبر تطبيق Tbilisi Parking) أو في موقف الفناء في «فابريكا»، ثم أكمل سيراً. في ساعة
    الذروة توقّع ازدحاماً حول جسر مارجانيشفيلي. لا أرقام طرق، ولا حصى، ولا ما يدعو للقلق: السيارة الاقتصادية
    تكفي تماماً. وبصراحة، كثيراً ما يكون المترو إلى مارجانيشفيلي أسرع من السيارة، ويعفيك من البحث عن مكان
    للركن.
