ka:
  name: აღმაშენებლის გამზირი („ახალი ტფილისი“)
  short: მტკვრის მარცხენა ნაპირის აღდგენილი XIX საუკუნის გამზირი — პასტელისფერი ფასადები, კაფეები და საფეხმავლო
    ზონა.
  body: >-
    **აღმაშენებლის გამზირი მარცხენა ნაპირის რუსთაველია** — XIX საუკუნის კლასიცისტური ფასადების, ჭედური
    აივნებისა და მოხატული სადარბაზოების თითქმის ორკილომეტრიანი ჯებირი, რომელიც ბოლო ათწლეულში ქალაქის
    ერთ-ერთ ყველაზე სასიამოვნო სასეირნო ადგილად იქცა.


    ქუჩა გერმანელი კოლონისტების დასახლების ადგილზე გაიზარდა: შვაბი გადმოსახლებულები აქ 1817–1818 წლებში
    დამკვიდრდნენ და უბანს „ნოი-ტიფლისი“ ერქვა. მოგვიანებით გამზირი მიხეილის ქუჩა იყო (1851 წლიდან), საბჭოთა
    ეპოქაში — პლეხანოვის, 1988 წლიდან კი დავით აღმაშენებლის სახელს ატარებს. 2010 წლიდან აქ სამოცდაათამდე
    შენობა აღდგა, ხოლო 2016 წელს პროგრამამ „ახალი ტფილისი“ ქვედა მონაკვეთი ზაარბრიუკენის მოედნიდან მარჯანიშვილამდე
    საფეხმავლო ზონად აქცია.


    რას ნახავ:


    - საფეხმავლო მონაკვეთი აღდგენილი ფასადებითა და საღამოს განათებით

    - მარჯანიშვილის მოედანი და თეატრის უბანი

    - თბილისური შიდა ეზოები — შეაღე ღია სადარბაზოები

    - კაფეები, საცხობები და აღმოსავლური რესტორნები ზედიზედ


    საღამოს გამზირი ცოცხლდება: ტერასები ივსება, ფასადებს განათება ერთვება. ზამთარშიც სასეირნოა — ქუჩა
    ქარისგან შედარებით დაცულია.
  tip: >-
    მოდი გვიან შუადღეს, რომ დღის შუქზეც ნახო ფასადები და საღამოს განათებაც. საფეხმავლო მონაკვეთის კაფეები
    ტურისტულ ფასებშია — გვერდით ქუჩებში იაფი და უფრო ავთენტური ადგილებია. მეტრო „მარჯანიშვილი“ პირდაპირ
    გამზირზე გადის, ფაბრიკა კი ხუთ წუთშია. ტუალეტი კაფეებშია. ჯიბგირობა იშვიათია, მაგრამ ხალხმრავალ საღამოებში
    ჩანთას მიხედე.
  route: >-
    ცენტრიდან ბარათაშვილის ხიდით გადადი მტკვარზე ზაარბრიუკენის მოედნისკენ — თავისუფლების მოედნიდან სულ
    2 კმ და ათიოდე წუთია. საფეხმავლო მონაკვეთზე მანქანა არ დაიშვება, ამიტომ გააჩერე გვერდით ქუჩებზე ზონალურ
    ფასიან პარკინგზე (Tbilisi Parking-ის აპით) ან ფაბრიკის ეზოს პარკინგზე და ფეხით იარე. პიკის საათებში
    მარჯანიშვილის ხიდთან საცობია — გაითვალისწინე. ეკონომ-კლასის მანქანა სავსებით საკმარისია; გულახდილად
    რომ ვთქვათ, აქ მეტროთი მისვლა ხშირად უფრო სწრაფია.
en:
  name: Aghmashenebeli Avenue (New Tiflis)
  short: >-
    The restored 19th-century avenue of the left bank — pastel facades, wrought-iron balconies and a lively
    pedestrian stretch.
  body: >-
    **Aghmashenebeli Avenue is the Rustaveli of the left bank** — nearly two kilometres of 19th-century
    neoclassical facades, wrought-iron balconies and painted hallways that have become one of Tbilisi's
    most pleasant strolls.


    The street grew out of a German colony: Swabian settlers arrived here in 1817–1818 and their quarter
    was called Neu-Tiflis. The avenue later carried the names Mikheil Street (from 1851) and Plekhanov
    Street through the Soviet era, and since 1988 has been named after King David IV the Builder. Since
    2010 around seventy buildings have been restored, and in 2016 the "New Tiflis" programme turned the
    lower stretch, from Saarbrücken Square to Marjanishvili Square, into a pedestrian zone.


    What to look for:


    - The car-free section with its restored facades and evening lighting

    - Marjanishvili Square and the theatre district around it

    - Classic Tbilisi courtyards — push open any unlocked hallway door

    - A run of cafés, bakeries and Middle Eastern restaurants


    The avenue comes alive after dark, when the terraces fill and the facades light up. It works in winter
    too — the street is fairly sheltered from the wind.
  tip: >-
    Come in the late afternoon so you catch the facades in daylight and the lights after dusk. Cafés on
    the pedestrian stretch charge tourist prices; the side streets are cheaper and more authentic. Marjanishvili
    metro station is right on the avenue, and Fabrika is a five-minute walk. Toilets are in the cafés.
    Pickpocketing is rare, but mind your bag on crowded evenings.
  route: >-
    From Freedom Square cross the Mtkvari on Baratashvili Bridge towards Saarbrücken Square — about 2
    km, ten minutes without traffic. The pedestrian section is closed to cars, so park on the side streets
    in the zonal paid parking (Tbilisi Parking app) or in the Fabrika courtyard lot and walk. Expect jams
    near Marjanishvili Bridge at rush hour. An economy car is all you need; honestly, the metro is often
    quicker here.
ru:
  name: Проспект Агмашенебели («Новый Тифлис»)
  short: Отреставрированный проспект XIX века на левом берегу — пастельные фасады, кованые балконы и пешеходная
    зона.
  body: >-
    **Проспект Агмашенебели — это Руставели левого берега:** почти два километра неоклассических фасадов
    XIX века, кованых балконов и расписных парадных, ставшие одной из самых приятных прогулок Тбилиси.


    Улица выросла на месте немецкой колонии: швабские переселенцы обосновались здесь в 1817–1818 годах,
    и квартал назывался Ной-Тифлис. Позже проспект носил имена Михайловской улицы (с 1851 года) и Плеханова
    в советскую эпоху, а с 1988 года назван в честь царя Давида IV Строителя. С 2010 года здесь отреставрировано
    около семидесяти зданий, а в 2016-м программа «Новый Тифлис» превратила нижний отрезок — от площади
    Саарбрюкен до площади Марджанишвили — в пешеходную зону.


    На что смотреть:


    - Пешеходный участок с восстановленными фасадами и вечерней подсветкой

    - Площадь Марджанишвили и театральный квартал вокруг

    - Классические тбилисские дворики — заглядывайте в открытые парадные

    - Череда кафе, пекарен и ближневосточных ресторанов


    Вечером проспект оживает: террасы заполняются, включается подсветка. Зимой здесь тоже неплохо — улица
    довольно защищена от ветра.
  tip: >-
    Приходите ближе к вечеру, чтобы застать фасады при дневном свете и подсветку после заката. Кафе на
    пешеходном участке работают по туристическим ценам — в переулках дешевле и аутентичнее. Метро «Марджанишвили»
    выходит прямо на проспект, до «Фабрики» пять минут пешком. Туалеты — в кафе. Карманники редки, но
    в людные вечера следите за сумкой.
  route: >-
    От площади Свободы пересеките Куру по мосту Бараташвили в сторону площади Саарбрюкен — около 2 км,
    десять минут без пробок. Пешеходный участок закрыт для машин, поэтому оставьте автомобиль на боковых
    улицах в зональной платной парковке (приложение Tbilisi Parking) или на стоянке во дворе «Фабрики»
    и идите пешком. В час пик у Марджанишвильского моста бывают заторы. Машины эконом-класса более чем
    достаточно; честно говоря, на метро сюда часто быстрее.
fa:
  name: خیابان آغماشنبلی («تفلیس نو»)
  short: خیابان بازسازی‌شدهٔ قرن نوزدهمی در ساحل چپ رود — نماهای پاستلی، بالکن‌های فلزی و محور پیاده‌راه
    سرزنده.
  body: >-
    **خیابان آغماشنبلی، روستاولیِ ساحل چپ است** — نزدیک به دو کیلومتر نمای نئوکلاسیک قرن نوزدهم، بالکن‌های
    چدنی و راهروهای نقاشی‌شده که به یکی از دلپذیرترین پیاده‌روی‌های تفلیس بدل شده است.


    این خیابان بر جای یک مهاجرنشین آلمانی شکل گرفت: مهاجران شوابی در سال‌های ۱۸۱۷–۱۸۱۸ اینجا ساکن شدند
    و محله «نوی-تفلیس» نام داشت. خیابان بعدها خیابان میخائیل (از ۱۸۵۱) و در دورهٔ شوروی خیابان پلخانف
    نامیده می‌شد و از ۱۹۸۸ نام داویت چهارم سازنده را بر خود دارد. از ۲۰۱۰ حدود هفتاد ساختمان آن مرمت شده
    و در ۲۰۱۶ برنامهٔ «تفلیس نو» بخش پایینی — از میدان زاربروکن تا میدان مارجانیشویلی — را به پیاده‌راه
    تبدیل کرد.


    آنچه باید دید:


    - بخش بدون خودرو با نماهای بازسازی‌شده و نورپردازی شبانه

    - میدان مارجانیشویلی و محلهٔ تئاتری اطراف آن

    - حیاط‌های سنتی تفلیسی — درِ هر راهروی باز را امتحان کنید

    - ردیفی از کافه‌ها، نانوایی‌ها و رستوران‌های خاورمیانه‌ای


    خیابان پس از تاریکی جان می‌گیرد: تراس‌ها پر می‌شوند و نماها روشن. در زمستان هم پیاده‌روی خوبی است،
    چون خیابان نسبتاً از باد در امان است.
  tip: >-
    اواخر بعدازظهر بیایید تا هم نماها را در روشنایی روز ببینید و هم نورپردازی شب را. کافه‌های پیاده‌راه
    قیمت توریستی دارند؛ کوچه‌های فرعی ارزان‌تر و اصیل‌ترند. ایستگاه متروی مارجانیشویلی درست کنار خیابان
    است و «فابریکا» پنج دقیقه پیاده فاصله دارد. سرویس بهداشتی در کافه‌هاست. جیب‌بری نادر است، اما در شب‌های
    شلوغ مراقب کیف خود باشید.
  route: >-
    از میدان آزادی با پل باراتاشویلی از رود متکواری بگذرید و به سمت میدان زاربروکن بروید — حدود ۲ کیلومتر
    و ده دقیقه بدون ترافیک. بخش پیاده‌راه به روی خودرو بسته است؛ خودرو را در خیابان‌های فرعی در پارکینگ
    منطقه‌ای پولی (اپلیکیشن Tbilisi Parking) یا در پارکینگ حیاط فابریکا بگذارید و پیاده بروید. در ساعات
    شلوغی نزدیک پل مارجانیشویلی ترافیک است. خودروی اقتصادی کاملاً کافی است؛ راستش را بخواهید، مترو اغلب
    سریع‌تر می‌رساند.
he:
  name: שדרות אגמשנבלי («טיפליס החדשה»)
  short: השדרה המשוחזרת מן המאה ה-19 בגדה השמאלית — חזיתות פסטל, מרפסות ברזל מחושל ומקטע הולכי רגל תוסס.
  body: >-
    **שדרות אגמשנבלי הן הרוסתוולי של הגדה השמאלית** — כמעט שני קילומטרים של חזיתות נאו-קלאסיות מן המאה
    ה-19, מרפסות ברזל מחושל וחדרי מדרגות מצוירים, שהפכו לאחד הטיולים הנעימים בטביליסי.


    הרחוב צמח על מקומה של מושבה גרמנית: מתיישבים שוואבים הגיעו לכאן ב-1817–1818, והרובע נקרא נוי-טיפליס.
    השדרה נשאה אחר כך את השמות רחוב מיכאיל (מ-1851) ורחוב פלחנוב בתקופה הסובייטית, ומאז 1988 היא קרויה
    על שם המלך דוד הרביעי הבונה. מאז 2010 שוחזרו כאן כשבעים בניינים, וב-2016 הפכה תוכנית «טיפליס החדשה»
    את הקטע התחתון — מכיכר זארבריקן עד כיכר מרג'נישווילי — למדרחוב.


    מה מחפשים:


    - המקטע ללא מכוניות עם החזיתות המשוחזרות והתאורה הלילית

    - כיכר מרג'נישווילי ורובע התיאטרון סביבה

    - חצרות טביליסאיות קלאסיות — דחפו כל דלת כניסה פתוחה

    - שורה של בתי קפה, מאפיות ומסעדות מזרח-תיכוניות


    השדרה מתעוררת אחרי רדת החשכה, כשהטרסות מתמלאות והחזיתות נדלקות. גם בחורף נעים כאן — הרחוב מוגן יחסית
    מהרוח.
  tip: >-
    בואו בשעות אחר הצהריים המאוחרות, כדי לתפוס את החזיתות באור יום ואת התאורה אחרי השקיעה. בתי הקפה במדרחוב
    גובים מחירי תיירים; ברחובות הצדדיים זול ואותנטי יותר. תחנת המטרו מרג'נישווילי יוצאת ישר אל השדרה,
    ו«פבריקה» במרחק חמש דקות הליכה. שירותים יש בבתי הקפה. כייסות נדירה, אבל שימו עין על התיק בערבים עמוסים.
  route: >-
    מכיכר החירות חצו את המטקווארי בגשר ברטאשווילי לכיוון כיכר זארבריקן — כ-2 ק״מ, עשר דקות בלי פקקים.
    מקטע המדרחוב סגור לרכב, לכן חנו ברחובות הצדדיים בחניה האזורית בתשלום (אפליקציית Tbilisi Parking) או
    במגרש שבחצר «פבריקה» ולכו ברגל. בשעות העומס יש פקקים ליד גשר מרג'נישווילי. רכב חסכוני מספיק בהחלט;
    למען האמת, המטרו לרוב מהיר יותר לכאן.
ar:
  name: جادة أغماشينيبيلي («تفليس الجديدة»)
  short: جادة القرن التاسع عشر المرمّمة على الضفة اليسرى — واجهات باستيلية وشرفات حديدية ومقطع مشاة نابض
    بالحياة.
  body: >-
    **جادة أغماشينيبيلي هي روستافيلي الضفة اليسرى** — نحو كيلومترين من واجهات القرن التاسع عشر النيوكلاسيكية
    والشرفات الحديدية المشغولة والمداخل المزخرفة، صارت واحدة من أمتع نزهات تبليسي.


    نشأ الشارع على موضع مستوطنة ألمانية: وصل المستوطنون الشفابيون إلى هنا في 1817–1818 وسُمي الحي «نوي-تفليس».
    حمل الشارع لاحقاً اسم شارع ميخائيل (من 1851) ثم شارع بليخانوف في الحقبة السوفيتية، ومنذ 1988 يحمل
    اسم الملك داود الرابع الباني. ومنذ 2010 رُمم فيه نحو سبعين مبنى، وفي 2016 حوّل برنامج «تفليس الجديدة»
    المقطع السفلي — من ساحة زاربروكن إلى ساحة مارجانيشفيلي — إلى منطقة مشاة.


    ما الذي تبحث عنه:


    - مقطع المشاة بواجهاته المرممة وإضاءته المسائية

    - ساحة مارجانيشفيلي وحي المسرح من حولها

    - أفنية تبليسي التقليدية — ادفع أي باب مدخل مفتوح

    - سلسلة من المقاهي والمخابز والمطاعم الشرقية


    تدبّ الحياة في الجادة بعد الغروب حين تمتلئ الشرفات وتضاء الواجهات. وهي ممتعة شتاءً أيضاً، فالشارع
    محميّ نسبياً من الريح.
  tip: >-
    تعال في وقت متأخر من بعد الظهر لترى الواجهات في ضوء النهار والإضاءة بعد الغسق. مقاهي مقطع المشاة بأسعار
    سياحية؛ والشوارع الجانبية أرخص وأكثر أصالة. محطة مترو مارجانيشفيلي تطل مباشرة على الجادة، و«فابريكا»
    على بعد خمس دقائق سيراً. دورات المياه في المقاهي. النشل نادر، لكن انتبه لحقيبتك في الأمسيات المزدحمة.
  route: >-
    من ساحة الحرية اعبر نهر متكفاري على جسر باراتاشفيلي باتجاه ساحة زاربروكن — نحو كيلومترين وعشر دقائق
    من دون زحام. مقطع المشاة مغلق أمام السيارات، فاركن في الشوارع الجانبية ضمن المواقف المدفوعة بالمناطق
    (تطبيق Tbilisi Parking) أو في موقف فناء فابريكا وامشِ. توقّع ازدحاماً قرب جسر مارجانيشفيلي في ساعات
    الذروة. سيارة اقتصادية تكفي تماماً؛ وبصراحة، المترو غالباً أسرع إلى هنا.
