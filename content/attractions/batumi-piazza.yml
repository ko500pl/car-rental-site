ka:
  name: ბათუმის პიაცა
  short: >-
    2009 წელს აგებული იტალიური იერის მოედანი ძველ ბათუმში, რომლის იატაკზე ხუთი ზღვის ქალღმერთის მარმარილოს
    მოზაიკა ათ დღეში აიწყო.
  body: >-
    **ბათუმის პიაცაზე ხალხი თავაწეული თაღებს ათვალიერებს, მთავარი სანახაობა კი ფეხქვეშ აქვს.** მოედანი
    2009 წელს არქიტექტორ ვაჟა ორბელაძის პროექტით აშენდა: 5 700 კვადრატული მეტრი თაღებით, აივნებითა და
    მაღალი საათიანი კოშკით, სადაც ქართული, კლასიკური ევროპული და აღმოსავლური მოტივები ერთმანეთშია გადახლართული.
    ეს უფრო თეატრის დეკორაციაა, ვიდრე ვენეცია — და პიაცას ამის სულაც არ რცხვენია.


    2010 წლის აგვისტოში იატაკიც მოვიდა. ქართველ-შვეიცარიელი დიზაინერის, ნატალი დე პიტა-ამირეჯიბის ესკიზით
    მოზაიკა აბუ-დაბიში, „ფანტინი მოზაიჩის“ სახელოსნოში დაამზადეს, ბათუმში კი სულ ათ დღეში ააწყვეს. 106
    კვადრატული მეტრი ევროპის უდიდეს ფიგურულ მარმარილოს მოზაიკად ითვლება; იგი თხუთმეტი ქვეყნიდან ჩამოტანილი
    მარმარილოს ერთსანტიმეტრიანი ნატეხებითაა აწყობილი.


    მოედნის კიდეზე დადექით და ნახატი თვალწინ აეწყობა: რვა წრე, ერთმანეთში ჩასმული, როგორც მორევი მშვიდ
    ზღვაზე. შიდა წრეში ხუთი ზღვის ქალღმერთი ტრიალებს — წითელ, ცისფერ, იისფერ, ვარდისფერ და მწვანე სამოსში.
    იისფერ კაბასა და წითლის მუქ ნაწილს კარგად დააკვირდით: ეს მარმარილო კი არა, სმალტი და კერამიკაა. შუაგულში
    პატარა ქალთევზაა, რომლის პროტოტიპი დიზაინერის ხუთი წლის ქალიშვილი, რომინა იყო.


    დღისით მოედანი მოზაიკასა და კაფეების მაგიდებს ეკუთვნის, რომლებიც მას ნელ-ნელა ეფინება. დაბნელებისას
    თაღები ნათდება, საათიანი კოშკი — დღეს ბუტიკ-სასტუმრო — სახურავებს ზემოთ ანათებს და მთელი მოედანი სცენად
    იქცევა.


    ზღვამდე სულ ოთხი კვარტალია. დილით ადრე მოდით, სანამ მოედანი ხალხით აივსება, და ქალღმერთები მხოლოდ
    თქვენი იქნება.
  tip: >-
    მოედანი საჯაროა, უფასოა და არასდროს იკეტება. თუ მოახერხებთ, ორჯერ მოდით: დილით ადრე, სანამ კაფეების
    ავეჯი მოზაიკას გადაეფარება, და საღამოს, განათების სანახავად. მოედნის კაფეებში ფასს გარემოც ემატება.
    ძველ ბათუმში პარკინგი ვიწროა — მანქანა ბულვართან, ფასიან ავტოსადგომზე დატოვეთ და ფეხით გაისეირნეთ.
    ევროპის მოედნამდე ხუთი წუთია, ახლოსაა ნეოგოთიკური ტაძარიც ფერადი ვიტრაჟებით. ტუალეტი კაფეებშია.
  route: >-
    თბილისიდან დაახლოებით 375 კილომეტრი და ხუთნახევარი საათია. ს1 (E60) მაგისტრალით დასავლეთისკენ, გორისა
    და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით და ქუთაისის გვერდის ავლით სამტრედიამდე იარეთ; იქ
    ს12-ზე (E692) გადადით და ლანჩხუთის გავლით გრიგოლეთამდე, ზღვამდე ჩადით, შემდეგ კი ს2-ით (E70) სამხრეთისკენ,
    ქობულეთისა და ჩაქვი–მახინჯაურის გვირაბის გავლით ბათუმში შედით. გზა ბოლომდე ასფალტია, დიდწილად ოთხზოლიანი,
    ბენზინგასამართი სადგურები ყველგანაა. პიაცა საფეხმავლო ზონაშია, ზღვიდან ოთხ კვარტალში: მანქანა ახლომახლო
    ფასიან ავტოსადგომზე ან ქუჩაზე დატოვეთ და ფეხით მიდით. ეკონომკლასის ავტომობილიც სავსებით საკმარისია.
en:
  name: Batumi Piazza
  short: >-
    An Italianate square in Old Batumi, built in 2009, whose floor is a 106 m² marble mosaic of five sea
    goddesses laid in just ten days.
  body: >-
    **Most people cross the Batumi Piazza looking up at the arcades; the real show is under their feet.**
    The square was built in 2009 to designs by the architect Vazha Orbeladze: 5,700 square metres of arcades,
    balconies and a tall clock tower, mixing Georgian, classical European and Eastern motifs. It is closer
    to a stage set than to Venice, and it seems perfectly happy about that.


    In August 2010 the floor arrived. The Georgian-Swiss designer Natali de Pita-Amirejibi had her mosaic
    made at the Fantini Mosaici workshop in Abu Dhabi, and in Batumi it was laid in ten days. It covers
    106 square metres and is billed as the largest figurative marble mosaic in Europe, set in one-centimetre
    pieces of marble gathered from fifteen countries.


    Stand at the edge and the design resolves: eight circles set one inside another, like a whirlpool
    on a calm sea. In the innermost ring five sea goddesses turn in red, light blue, purple, pink and
    green. Look closely at the purple dress and the darkest part of the red one: they are not marble at
    all, but smalt and ceramic. The little siren at the centre was modelled on the designer's five-year-old
    daughter, Romina.


    By day the square belongs to the mosaic and to the café tables that creep across it. After dark the
    arcades are lit, the clock tower — now a boutique hotel — glows above the roofs, and the whole place
    turns theatrical.


    The sea is only four blocks away. Come early in the morning, before the square fills, and the goddesses
    are yours alone.
  tip: >-
    The square is public, free and never closes. Come twice if you can: early in the morning, before café
    furniture spreads across the mosaic, and again after dark for the lights. Prices at the cafés on the
    square include the setting. Parking in Old Batumi is tight, so leave the car in a paid lot near the
    Boulevard and walk. Europe Square is five minutes away, and the neo-Gothic cathedral, with its coloured
    glass, is close by. Toilets are in the cafés.
  route: >-
    From Tbilisi it is about 375 km and five and a half hours. Take the S1 (E60) west past Gori and Khashuri,
    over the Rikoti Pass and past Kutaisi to Samtredia; there switch to the S12 (E692) through Lanchkhuti
    to Grigoleti on the coast, then follow the S2 (E70) south through Kobuleti and the Chakvi–Makhinjauri
    tunnel into Batumi. It is asphalt all the way, much of it four-lane, and fuel is never far off. The
    Piazza is pedestrian, four blocks from the sea: park in a paid lot or on a nearby street and walk
    in. An economy car is all you need.
ru:
  name: Батумская Пьяцца
  short: >-
    Площадь в итальянском духе в Старом Батуми (2009): её пол — мраморная мозаика в 106 м² с пятью морскими
    богинями, уложенная за десять дней.
  body: >-
    **Большинство людей проходят через батумскую Пьяццу, глядя на аркады; настоящее представление — под
    ногами.** Площадь построили в 2009 году по проекту архитектора Важи Орбеладзе: 5700 квадратных метров
    аркад, балконов и высокой башни с часами, где смешаны грузинские, классические европейские и восточные
    мотивы. Это скорее театральная декорация, чем Венеция, — и, кажется, площадь этим вполне довольна.


    В августе 2010 года появился пол. Грузинско-швейцарский дизайнер Натали де Пита-Амирэджиби заказала
    мозаику в мастерской «Фантини Мозаичи» в Абу-Даби, а в Батуми её уложили за десять дней. Она покрывает
    106 квадратных метров и заявлена как крупнейшая фигуративная мраморная мозаика в Европе; она набрана
    из сантиметровых кусочков мрамора, собранного в пятнадцати странах.


    Встаньте у края — и рисунок сложится: восемь кругов, вложенных один в другой, как водоворот на спокойном
    море. В самом внутреннем кольце пять морских богинь кружатся в красном, светло-голубом, фиолетовом,
    розовом и зелёном. Присмотритесь к фиолетовому платью и самой тёмной части красного: это вовсе не
    мрамор, а смальта и керамика. Маленькую сирену в центре смоделировали по образу пятилетней дочери
    дизайнера, Ромины.


    Днём площадь принадлежит мозаике и кофейным столикам, что расползаются по ней. После наступления темноты
    аркады подсвечивают, башня с часами — теперь бутик-отель — светится над крышами, и всё вокруг становится
    театральным.


    Море всего в четырёх кварталах отсюда. Приходите ранним утром, до того как площадь заполнится, — и
    богини достанутся только вам.
  tip: >-
    Площадь общественная, бесплатная и никогда не закрывается. Приходите дважды, если получится: рано
    утром, до того как кафе расставят мебель по мозаике, и ещё раз после наступления темноты — за подсветкой.
    Цены в кафе на площади включают этот вид. Парковка в Старом Батуми тесная, так что оставьте машину
    на платной стоянке у бульвара и дойдите пешком. Площадь Европы — пять минут отсюда, а рядом — неоготический
    собор с цветными витражами. Туалеты — в кафе.
  route: >-
    От Тбилиси около 375 км и пяти с половиной часов. По трассе S1 (E60) на запад через Гори и Хашури,
    через Рикотский перевал и Кутаиси до Самтредиа; там переходите на S12 (E692) через Ланчхути до Григолети
    на побережье, затем по S2 (E70) на юг через Кобулети и тоннель Чакви–Махинджаури в Батуми. Дорога
    асфальтирована на всём протяжении, во многом — четырёхполосная, а заправки всегда рядом. Пьяцца —
    пешеходная зона, в четырёх кварталах от моря: оставьте машину на платной стоянке или на близлежащей
    улице и идите пешком. Автомобиля экономкласса вполне достаточно.
fa:
  name: میدان پیاتزای باتومی
  short: >-
    میدانی به سبک ایتالیایی در باتومی قدیم، ساخته‌شده در سال ۲۰۰۹، که کف آن موزاییکی مرمرین به مساحت ۱۰۶
    متر مربع با پنج الههٔ دریایی است، فرش‌شده تنها در ده روز.
  body: >-
    **بیشتر مردم میدان پیاتزای باتومی را در حالی می‌گذرند که نگاهشان به رواق‌هاست؛ نمایش واقعی زیر پایشان
    است.** این میدان در سال ۲۰۰۹ بر پایهٔ طرح معمار واژا اوربلادزه ساخته شد: ۵۷۰۰ متر مربع از رواق‌ها،
    بالکن‌ها و برجی بلند با ساعت، که در آن نمادهای گرجی، اروپای کلاسیک و شرقی به‌هم آمیخته‌اند. این میدان
    بیشتر به یک صحنهٔ تئاتری شبیه است تا به ونیز، و به نظر می‌رسد از این بابت کاملاً راضی است.


    در اوت ۲۰۱۰ کف میدان رسید. طراح گرجی-سوئیسی، ناتالی دو پیتا-امیرجیبی، موزاییک خود را در کارگاه فانتینی
    موزائیچی در ابوظبی ساخت، و در باتومی آن را در ده روز فرش کردند. این موزاییک ۱۰۶ متر مربع را می‌پوشاند
    و بزرگ‌ترین موزاییک مرمرین تصویری اروپا معرفی شده است؛ این موزاییک از قطعه‌های یک‌سانتی‌متری مرمری
    ساخته شده که از پانزده کشور گردآوری شده است.


    در کنارهٔ آن بایستید تا طرح شکل بگیرد: هشت دایره که یکی درون دیگری نشسته، مانند گردابی بر دریایی آرام.
    در درونی‌ترین حلقه، پنج الههٔ دریایی به رنگ‌های قرمز، آبی روشن، بنفش، صورتی و سبز می‌چرخند. به لباس
    بنفش و تیره‌ترین بخش قرمز دقیق نگاه کنید: آن‌ها اصلاً مرمر نیستند، بلکه شیشهٔ رنگی (اسمالت) و سرامیک‌اند.
    پری کوچک دریایی در مرکز، برگرفته از دختر پنج‌سالهٔ طراح، رومینا، است.


    در روز، میدان از آن موزاییک و میزهای کافه‌هایی است که آرام‌آرام بر آن می‌خزند. پس از تاریکی، رواق‌ها
    روشن می‌شوند، برج ساعت — که اکنون هتلی بوتیک است — بر فراز بام‌ها می‌درخشد، و همه‌جا نمایشی می‌شود.


    دریا تنها چهار بلوک آن‌سوتر است. صبح زود بیایید، پیش از آنکه میدان پر شود، و الهه‌ها فقط از آن شما
    خواهند بود.
  tip: >-
    میدان عمومی و رایگان است و هرگز بسته نمی‌شود. اگر می‌توانید، دو بار بیایید: صبح زود، پیش از آنکه صندلی‌های
    کافه بر موزاییک پخش شوند، و بار دیگر پس از تاریکی برای دیدن نورها. قیمت‌های کافه‌های میدان، این چشم‌انداز
    را هم شامل می‌شود. پارک‌کردن در باتومی قدیم تنگ است، پس ماشین را در پارکینگی پولی نزدیک بلوار بگذارید
    و پیاده بروید. میدان اروپا پنج دقیقه آن‌سوتر است، و کلیسای جامع نو-گوتیک با شیشه‌های رنگی‌اش نزدیک
    است. سرویس‌های بهداشتی در کافه‌هاست.
  route: >-
    از تفلیس حدود ۳۷۵ کیلومتر و پنج‌ونیم ساعت است. مسیر S1 (E60) را رو به غرب از کنار گوری و خاشوری، از
    گذرگاه ریکوتی و کنار کوتایسی تا سامتردیا بروید؛ از آن‌جا به S12 (E692) از میان لانچخوتی تا گریگولتی
    بر ساحل بروید، سپس S2 (E70) را رو به جنوب از کوبولتی و از تونل چاکوی–ماخینجائوری به باتومی بروید.
    تمام راه آسفالت و بخش بزرگی از آن چهارخطه است، و سوخت هرگز دور نیست. میدان پیاتزا منطقه‌ای پیاده است،
    چهار بلوک از دریا: ماشین را در پارکینگی پولی یا خیابانی نزدیک بگذارید و پیاده بروید. یک خودروی اقتصادی
    کافی است.
he:
  name: פיאצה בטומי
  short: >-
    כיכר בסגנון איטלקי בבטומי העתיקה, שנבנתה ב-2009, שרצפתה פסיפס שיש בשטח 106 מ"ר עם חמש אלות ים, שהונח
    בעשרה ימים בלבד.
  body: >-
    **רוב האנשים חוצים את פיאצה בטומי כשמבטם נישא אל הארקדות; ההצגה האמיתית היא מתחת לרגליים.** הכיכר
    נבנתה ב-2009 לפי תכנון האדריכל ואז'ה אורבלדזה: 5,700 מטרים רבועים של ארקדות, מרפסות ומגדל שעון גבוה,
    המשלב מוטיבים גאורגיים, אירופיים קלאסיים ומזרחיים. היא קרובה יותר לתפאורת תיאטרון מאשר לוונציה, ונראה
    שהיא מרוצה מזה לחלוטין.


    באוגוסט 2010 הגיעה הרצפה. המעצבת הגאורגית-שוויצרית נטלי דה פיטה-אמירג'יבי הזמינה את הפסיפס שלה מסדנת
    פנטיני מוסאיצי באבו דאבי, ובבטומי הוא הונח בעשרה ימים. הוא משתרע על 106 מטרים רבועים ומתואר כפסיפס
    השיש הפיגורטיבי הגדול ביותר באירופה, והוא מורכב מאבנים בנות סנטימטר אחד משיש שנאסף מחמש עשרה מדינות.


    עמדו בקצה והתבנית מתבררת: שמונה עיגולים משוכנים זה בזה, כמו מערבולת בים שקט. בטבעת הפנימית ביותר מסתובבות
    חמש אלות ים בצבעי אדום, תכלת, סגול, ורוד וירוק. הביטו מקרוב בשמלה הסגולה ובחלק הכהה ביותר של האדומה:
    אלה אינם שיש בכלל, אלא זכוכית צבעונית וקרמיקה. בת הים הקטנה במרכז עוצבה בדמות בתה בת החמש של המעצבת,
    רומינה.


    ביום שייכת הכיכר לפסיפס ולשולחנות בתי הקפה שמזדחלים עליו. לאחר רדת החשכה מוארות הארקדות, מגדל השעון
    — כיום מלון בוטיק — זוהר מעל הגגות, וכל המקום מקבל אופי תיאטרלי.


    הים במרחק ארבעה רחובות בלבד. באו מוקדם בבוקר, לפני שהכיכר מתמלאת, והאלות יהיו שלכם בלבד.
  tip: >-
    הכיכר ציבורית, חינמית ולעולם לא נסגרת. באו פעמיים אם אפשר: מוקדם בבוקר, לפני שרהיטי בתי הקפה מתפשטים
    על הפסיפס, ופעם נוספת לאחר רדת החשכה בשביל התאורה. המחירים בבתי הקפה בכיכר כוללים את הנוף. חנייה בבטומי
    העתיקה צפופה, אז השאירו את הרכב במגרש חנייה בתשלום סמוך לטיילת והמשיכו ברגל. כיכר אירופה במרחק חמש
    דקות, והקתדרלה הניו-גותית, עם הזכוכית הצבעונית שלה, קרובה מאוד. שירותים נמצאים בבתי הקפה.
  route: >-
    מטביליסי כ-375 ק"מ וחמש שעות וחצי. סעו בכביש S1 (E60) מערבה דרך גורי וחשורי, דרך מעבר ריקוטי ולצד
    קוטאיסי עד סמטרדיה; שם עברו ל-S12 (E692) דרך לנצ'חוטי עד גריגולטי על החוף, ואז ב-S2 (E70) דרומה דרך
    קובולטי ומנהרת צ'קווי–מחינג'אורי לבטומי. הכביש אספלט לכל אורכו, חלק גדול ממנו בעל ארבעה נתיבים, ותחנות
    דלק אינן רחוקות לעולם. הפיאצה היא אזור הולכי רגל, במרחק ארבעה רחובות מהים: חנו במגרש חנייה בתשלום
    או ברחוב סמוך והמשיכו ברגל. רכב אקונומי מספיק בהחלט.
ar:
  name: ساحة باتومي (بياتزا)
  short: >-
    ساحة بطراز إيطالي في باتومي القديمة، بُنيت عام 2009، أرضها فسيفساء مرمرية بمساحة 106 م² تصوّر خمس
    ربّات بحر، أُنجزت في عشرة أيام فقط.
  body: >-
    **يعبر معظم الناس ساحة باتومي (البياتزا) وأعينهم شاخصة إلى الأروقة؛ العرض الحقيقي تحت أقدامهم.** بُنيت
    الساحة عام 2009 بتصميم المهندس فازا أوربيلادزه: 5700 متر مربع من الأروقة والشرفات وبرج ساعة مرتفع،
    يمزج بين الطابع الجورجي والأوروبي الكلاسيكي والشرقي. وهي أقرب إلى ديكور مسرحي منها إلى البندقية، ويبدو
    أنها راضية عن ذلك تمامًا.


    في أغسطس 2010 وصلت الأرضية. صمّمت المصمّمة الجورجية السويسرية ناتالي دي بيتا-أميريجيبي الفسيفساء،
    ونُفّذت في ورشة فانتيني موزائيتشي بأبوظبي، وفي باتومي أُنجز تركيبها في عشرة أيام. تغطي 106 أمتار مربعة،
    وتُوصف بأنها أكبر فسيفساء مرمرية تصويرية في أوروبا، وقد رُصفت من قطع بحجم سنتيمتر واحد من مرمر جُمع
    من خمسة عشر بلدًا.


    قف عند الحافة فيتّضح التصميم: ثماني دوائر متداخلة، مثل دوّامة في بحر ساكن. وفي الحلقة الأعمق تدور
    خمس ربّات بحر بالأحمر والأزرق الفاتح والبنفسجي والوردي والأخضر. تأمّل الثوب البنفسجي وأغمق جزء من
    الثوب الأحمر: إنهما ليسا مرمرًا على الإطلاق، بل زجاجًا ملوّنًا (سمالت) وخزفًا. صُمّمت الحورية الصغيرة
    في المركز على صورة ابنة المصمّمة البالغة خمس سنوات، رومينا.


    نهارًا تنتمي الساحة إلى الفسيفساء وإلى طاولات المقاهي التي تتسلّل عليها. وبعد حلول الظلام تُضاء الأروقة،
    ويتوهّج برج الساعة — وهو اليوم فندق بوتيكي — فوق الأسطح، ويصبح المكان كله أشبه بمسرح.


    البحر على مسافة أربع مربعات سكنية فقط. تعال في الصباح الباكر، قبل أن تمتلئ الساحة، وستكون الربّات
    لك وحدك.
  tip: >-
    الساحة عامة، مجانية، ولا تُغلق أبدًا. تعال مرتين إن استطعت: في الصباح الباكر، قبل أن ينتشر أثاث المقاهي
    على الفسيفساء، ومرة أخرى بعد حلول الظلام لرؤية الأضواء. أسعار المقاهي في الساحة تشمل هذا المشهد. أماكن
    الوقوف في باتومي القديمة قليلة، فاترك السيارة في موقف مدفوع قرب الكورنيش وامشِ. ساحة أوروبا على خمس
    دقائق، والكاتدرائية القوطية الجديدة بزجاجها الملوّن قريبة أيضًا. المراحيض داخل المقاهي.
  route: >-
    من تبليسي نحو 375 كم وخمس ساعات ونصف. خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري، فوق ممر ريكوتي وقرب
    كوتايسي إلى سامتريديا؛ ثم انتقل إلى S12 (E692) عبر لانتشخوتي إلى غريغوليتي على الساحل، ثم S2 (E70)
    جنوبًا عبر كوبوليتي ونفق تشاكفي–ماخينجاوري إلى باتومي. الطريق مُعبّد بالكامل، وجزء كبير منه بأربعة
    مسارات، والوقود ليس بعيدًا أبدًا. البياتزا منطقة مشاة، على مسافة أربع مربعات سكنية من البحر: اترك
    السيارة في موقف مدفوع أو في شارع قريب وامشِ. سيارة اقتصادية كافية تمامًا.
