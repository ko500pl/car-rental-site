ka:
  name: ბათუმის პიაცა
  short: იტალიური სტილის მოედანი ძველ ბათუმში — მოზაიკა, ვიტრაჟები, კაფეები და საღამოს კონცერტები.
  body: >-
    **პიაცა ბათუმის ვენეციური ეზოა** — და ეს შედარება გადაჭარბებული სულაც არ არის. 2010 წელს გახსნილი
    მოედანი ძველი ბათუმის შუაგულში, ფარნავაზ მეფის ქუჩაზე დგას და მთლიანად იტალიური პიაცების მიხედვითაა
    აშენებული: თაღები, აივნები, საათიანი კოშკი და ღია ცის ქვეშ გაშლილი კაფეები.


    მთავარი განძი იატაკზეა. ცენტრალური მარმარილოს მოზაიკა (106 მ², დიზაინერი ნატალი დე პიტა-ამირეჯიბი)
    ევროპაში უდიდეს ფიგურულ მარმარილოს მოზაიკად ითვლება — თითო კვადრატული სანტიმეტრის ზომის დაახლოებით
    88 მილიონი ქვისგან არის აწყობილი, მარმარილო კი 15 ქვეყნიდან ჩამოიტანეს. კომპოზიციაში ხუთი ზღვის ქალღმერთია,
    ცენტრალური ფიგურა კი დიზაინერის ხუთი წლის ქალიშვილის მიხედვით შეიქმნა.


    რას ნახავ და გააკეთებ:


    - მოზაიკა და კოშკის ვიტრაჟები — დღის შუქზე საუკეთესოდ ჩანს

    - კაფე-რესტორნები მოედნის პერიმეტრზე, ცოცხალი მუსიკით

    - ზაფხულის საღამოებში — უფასო კონცერტები და ჯაზი ღია სცენაზე

    - ღამით მოედანი მთლიანად ნათდება და სულ სხვა განწყობა დგება


    პიაცა წლის ნებისმიერ დროს მუშაობს: ზაფხულში ყველაზე ხალხმრავალია, ზამთარში კი საახალწლო მორთულობით
    ბათუმის ერთ-ერთი მთავარი შესაკრები ადგილი ხდება.
  tip: >-
    მოედანზე შესვლა უფასოა და 24 საათი ღიაა. ორჯერ მისვლა ღირს — დღისით მოზაიკისა და ვიტრაჟების სანახავად,
    საღამოს კი მუსიკისთვის. პერიმეტრის კაფეები ბათუმის საშუალოზე ძვირია: ყავა აქ ატმოსფეროს ფასს შეიცავს.
    ძველ ქალაქში პარკინგი ვიწრო და დატვირთულია — მანქანა ბულვართან ან ფასიან მოედანზე დატოვე და ფეხით
    შემოიარე, ყველაფერი ახლოსაა.
  route: >-
    თბილისიდან ბათუმამდე მთავარი მაგისტრალით (E60/S1) მიდიხარ: რიკოთის გვირაბები, ქუთაისის შემოვლითი,
    სამტრედია, შემდეგ ზღვისპირა გზა ქობულეთის გავლით. სულ დაახლოებით 375 კმ და 5:30 სთ წმინდა მგზავრობა
    — გზა ბოლომდე ასფალტია, დიდი ნაწილი ავტობანი. საწვავი ყველგანაა, დიდი ჩერდომები ზესტაფონსა და ქობულეთშია.
    ბათუმში პიაცა ფარნავაზ მეფის ქუჩაზეა, საფეხმავლო ზონაში — მანქანა მიმდებარე ქუჩების ფასიან პარკინგზე
    დატოვე. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Batumi Piazza
  short: >-
    An Italian-style square in Old Batumi — a giant marble mosaic, stained glass, cafes and free summer-evening
    concerts.
  body: >-
    **The Piazza is Batumi doing its best Venice impression — and largely pulling it off.** Opened in
    2010 in the heart of the Old Town on Parnavaz Mepe Street, the square was built from scratch in the
    manner of an Italian piazza: arcades, balconies, a clock tower and open-air cafes filling the space
    between them.


    The real treasure is underfoot. The central marble mosaic (106 square metres, designed by Georgian-Swiss
    artist Natali de Pita-Amirejibi) is billed as the largest figurative marble mosaic in Europe — roughly
    88 million cut stone elements of one square centimetre each, with marble sourced from 15 countries.
    The composition shows five sea goddesses; the central figure was modelled on the designer's five-year-old
    daughter.


    What you actually do here:


    - Study the mosaic and the tower's stained glass — both look best in daylight

    - Settle into a perimeter cafe with live music

    - Catch the free open-air concerts and jazz on summer evenings

    - Come back after dark, when the whole square is lit and feels theatrical


    The Piazza works year-round: packed in summer, and at New Year it turns into one of Batumi's main
    gathering points under heavy festive decoration.
  tip: >-
    Entry is free and the square never closes. It rewards two visits — daytime for the mosaic and stained
    glass, evening for the music. The cafes on the square charge above the Batumi average; you are paying
    for the setting. Parking in the Old Town is tight, so leave the car near the Boulevard or in a paid
    lot and walk — everything is close together.
  route: >-
    From Tbilisi take the main east–west highway (E60/S1): through the Rikoti tunnels, past the Kutaisi
    bypass and Samtredia, then down the coast road through Kobuleti into Batumi — about 375 km and 5:30
    of pure driving, asphalt the whole way and motorway-grade for much of it. Fuel stations are everywhere;
    the best rest stops are around Zestaponi and Kobuleti. In Batumi the Piazza sits in the pedestrian
    Old Town on Parnavaz Mepe Street, so park on nearby streets or in a paid lot. An economy car is all
    you need.
ru:
  name: Батумская Пьяцца
  short: >-
    Площадь в итальянском стиле в Старом Батуми — гигантская мраморная мозаика, витражи, кафе и бесплатные
    вечерние концерты летом.
  body: >-
    **Пьяцца — это Батуми, играющий в Венецию, и играющий убедительно.** Площадь открыли в 2010 году в
    сердце Старого города, на улице Парнаваза Мепе, и построили целиком по образцу итальянских пьяцц:
    аркады, балконы, башня с часами и кафе под открытым небом.


    Главное сокровище — под ногами. Центральная мраморная мозаика (106 м², автор — грузино-швейцарский
    дизайнер Натали де Пита-Амиреджиби) считается крупнейшей фигуративной мраморной мозаикой Европы: около
    88 миллионов каменных элементов размером в один квадратный сантиметр, мрамор привозили из 15 стран.
    В композиции пять морских богинь, а центральную фигуру автор писала со своей пятилетней дочери.


    Чем здесь заняться:


    - Рассмотреть мозаику и витражи башни — при дневном свете они лучше всего

    - Посидеть в кафе по периметру под живую музыку

    - Летними вечерами — бесплатные концерты и джаз на открытой сцене

    - Вернуться после заката, когда площадь подсвечена и выглядит театрально


    Пьяцца живёт круглый год: летом здесь плотная толпа, а на Новый год площадь в праздничном убранстве
    становится одним из главных мест сбора всего Батуми.
  tip: >-
    Вход свободный, площадь открыта всегда. Стоит прийти дважды: днём — ради мозаики и витражей, вечером
    — ради музыки. Кафе на самой площади дороже среднего по Батуми — платите за декорации. Парковка в
    Старом городе тесная: оставьте машину у Бульвара или на платной стоянке и гуляйте пешком, всё рядом.
  route: >-
    Из Тбилиси в Батуми едут по главной трассе (E60/S1): Рикотские тоннели, объезд Кутаиси, Самтредиа,
    дальше прибрежная дорога через Кобулети. Всего около 375 км и 5:30 чистой езды; асфальт на всём протяжении,
    значительная часть — автомагистраль. Заправки повсюду, удобные остановки — у Зестафони и Кобулети.
    В Батуми Пьяцца находится в пешеходной зоне Старого города на улице Парнаваза Мепе — машину оставляйте
    на платных парковках соседних улиц. Эконом-класса достаточно.
fa:
  name: پیاتزای باتومی
  short: >-
    میدانی به سبک ایتالیایی در باتومی قدیم — موزاییک عظیم مرمری، شیشه‌های رنگی، کافه‌ها و کنسرت‌های رایگان
    شب‌های تابستان.
  body: >-
    **پیاتزا همان جایی است که باتومی ادای ونیز را درمی‌آورد — و به‌خوبی از پسش برمی‌آید.** این میدان در
    سال 2010 در قلب شهر قدیم، در خیابان پارناواز مپه گشوده شد و از پایه به سبک میدان‌های ایتالیایی ساخته
    شده است: طاق‌ها، بالکن‌ها، برج ساعت و کافه‌های روباز میان آن‌ها.


    گنج اصلی زیر پای شماست. موزاییک مرمری مرکزی (106 مترمربع، طراحی ناتالی دِ پیتا-آمیرجیبی، هنرمند گرجی-سوئیسی)
    بزرگ‌ترین موزاییک مرمری فیگوراتیو اروپا خوانده می‌شود — حدود 88 میلیون قطعه سنگ یک‌سانتی‌متری، با
    مرمری که از 15 کشور آورده شد. در ترکیب‌بندی پنج الهه دریا دیده می‌شود و چهرهٔ مرکزی از روی دختر پنج‌سالهٔ
    طراح ساخته شده است.


    اینجا چه می‌کنید:


    - تماشای موزاییک و شیشه‌های رنگی برج — در نور روز بهترین جلوه را دارند

    - نشستن در کافه‌های دور میدان با موسیقی زنده

    - در شب‌های تابستان، کنسرت‌های رایگان و جاز روی صحنهٔ روباز

    - بازگشت پس از تاریکی، وقتی کل میدان نورپردازی شده و حال‌وهوایی نمایشی دارد


    پیاتزا در تمام سال زنده است: تابستان شلوغ‌ترین فصل است و در سال نو با آذین‌بندی مفصل یکی از پاتوق‌های
    اصلی باتومی می‌شود.
  tip: >-
    ورود رایگان است و میدان هیچ‌وقت بسته نمی‌شود. دو بار آمدن می‌ارزد: روز برای موزاییک و شیشه‌های رنگی،
    شب برای موسیقی. کافه‌های خود میدان از میانگین باتومی گران‌ترند — پول فضا را می‌دهید. پارک خودرو در
    شهر قدیم دشوار است؛ ماشین را نزدیک بلوار یا در پارکینگ پولی بگذارید و پیاده بگردید، همه‌چیز نزدیک
    است.
  route: >-
    از تفلیس با بزرگراه اصلی (E60/S1) به سمت غرب بروید: تونل‌های ریکوتی، کمربندی کوتایسی، سامتردیا و سپس
    جادهٔ ساحلی از کوبولتی تا باتومی — حدود 375 کیلومتر و 5:30 ساعت رانندگی خالص. جاده سراسر آسفالت و
    بخش بزرگی از آن اتوبان است. پمپ‌بنزین همه‌جا هست؛ توقف‌های خوب حوالی زستافونی و کوبولتی است. در باتومی،
    پیاتزا در محدودهٔ پیادهٔ شهر قدیم در خیابان پارناواز مپه قرار دارد — خودرو را در پارکینگ‌های پولی
    خیابان‌های مجاور بگذارید. خودروی اقتصادی کاملاً کافی است.
he:
  name: פיאצה של בתומי
  short: כיכר בסגנון איטלקי בבתומי העתיקה — פסיפס שיש ענק, ויטראז'ים, בתי קפה וקונצרטים חינמיים בערבי
    הקיץ.
  body: >-
    **הפיאצה היא בתומי שמחקה את ונציה — ומצליחה בגדול.** הכיכר נחנכה ב-2010 בלב העיר העתיקה, ברחוב פרנוואז
    מפה, ונבנתה מאפס בדגם של פיאצה איטלקית: קשתות, מרפסות, מגדל שעון ובתי קפה פתוחים שממלאים את החלל.


    האוצר האמיתי נמצא מתחת לרגליים. פסיפס השיש המרכזי (106 מ"ר, בעיצוב האמנית הגאורגית-שווייצרית נטלי
    דה פיטה-אמירג'יבי) מוצג כפסיפס השיש הפיגורטיבי הגדול באירופה — כ-88 מיליון אבנים חתוכות בגודל סנטימטר
    רבוע כל אחת, משיש שהובא מ-15 מדינות. בקומפוזיציה חמש אלות ים, והדמות המרכזית עוצבה בהשראת בתה בת החמש
    של המעצבת.


    מה עושים כאן בפועל:


    - מתבוננים בפסיפס ובוויטראז'ים של המגדל — באור יום הם במיטבם

    - מתיישבים בבית קפה בהיקף הכיכר עם מוזיקה חיה

    - בערבי הקיץ — קונצרטים חינמיים וג'אז על במה פתוחה

    - חוזרים אחרי החשכה, כשהכיכר כולה מוארת ונראית תיאטרלית


    הפיאצה חיה כל השנה: בקיץ צפוף כאן, ובראש השנה האזרחית היא הופכת, מקושטת כולה, לאחת מנקודות ההתכנסות
    המרכזיות של בתומי.
  tip: >-
    הכניסה חופשית והכיכר פתוחה תמיד. שווה לבוא פעמיים — ביום בשביל הפסיפס והוויטראז'ים, בערב בשביל המוזיקה.
    בתי הקפה שעל הכיכר יקרים מהממוצע בבתומי; משלמים על התפאורה. החניה בעיר העתיקה צפופה — השאירו את הרכב
    ליד הטיילת או בחניון בתשלום ולכו ברגל, הכול קרוב.
  route: >-
    מטביליסי נוסעים לבתומי בכביש הראשי (E60/S1): מנהרות ריקוטי, עוקף כותאיסי, סמטרדיה, ואז כביש החוף דרך
    קובולטי — כ-375 ק"מ ו-5:30 שעות נסיעה נטו. הכביש סלול לכל אורכו, וחלק ניכר ממנו ברמת אוטוסטרדה. תחנות
    דלק יש בשפע; עצירות נוחות באזור זסטפוני וקובולטי. בבתומי הפיאצה נמצאת במדרחוב של העיר העתיקה ברחוב
    פרנוואז מפה — חנו ברחובות הסמוכים בחניה בתשלום. רכב חסכוני מספיק בהחלט.
ar:
  name: بياتزا باتومي
  short: >-
    ساحة على الطراز الإيطالي في باتومي القديمة — فسيفساء رخامية عملاقة وزجاج ملون ومقاهٍ وحفلات مجانية
    في أمسيات الصيف.
  body: >-
    **البياتزا هي باتومي وهي تقلد البندقية — وتنجح في ذلك إلى حد بعيد.** افتُتحت الساحة عام 2010 في قلب
    المدينة القديمة على شارع بارنافاز مبه، وبُنيت من الصفر على نمط الساحات الإيطالية: أروقة معقودة وشرفات
    وبرج ساعة ومقاهٍ مكشوفة تملأ الفراغ بينها.


    الكنز الحقيقي تحت الأقدام. الفسيفساء الرخامية المركزية (106 أمتار مربعة، من تصميم الفنانة الجورجية
    السويسرية ناتالي دي بيتا-أميرجيبي) تُقدَّم بوصفها أكبر فسيفساء رخامية تصويرية في أوروبا — نحو 88 مليون
    قطعة حجرية مقصوصة بمساحة سنتيمتر مربع للواحدة، برخام جُلب من 15 بلداً. تُظهر التركيبة خمس ربات بحر،
    وقد صُممت الشخصية المركزية على صورة ابنة المصممة ذات الأعوام الخمسة.


    ما الذي تفعله هنا فعلاً:


    - تأمل الفسيفساء والزجاج الملون في البرج — يبدوان في أبهى صورة في ضوء النهار

    - الجلوس في مقهى على محيط الساحة مع موسيقى حية

    - في أمسيات الصيف حفلات مجانية وجاز على مسرح مكشوف

    - العودة بعد الغروب حين تُضاء الساحة كلها فتبدو مسرحية


    البياتزا حية طوال السنة: مزدحمة صيفاً، وفي رأس السنة تتحول بزينتها الاحتفالية إلى أحد أهم أماكن التجمع
    في باتومي.
  tip: >-
    الدخول مجاني والساحة لا تُغلق أبداً. تستحق زيارتين: نهاراً من أجل الفسيفساء والزجاج الملون، ومساءً
    من أجل الموسيقى. مقاهي الساحة نفسها أغلى من متوسط باتومي — أنت تدفع ثمن المكان. مواقف السيارات في
    المدينة القديمة ضيقة، فاترك السيارة قرب الكورنيش أو في موقف مدفوع وتجول سيراً؛ كل شيء قريب.
  route: >-
    من تبليسي إلى باتومي عبر الطريق السريع الرئيسي (E60/S1): أنفاق ريكوتي، ثم التفافية كوتايسي وسامتريديا،
    فبطريق الساحل عبر كوبوليتي — نحو 375 كم و5:30 ساعة قيادة صافية. الطريق معبّد بالكامل وقسم كبير منه
    بمواصفات الطرق السريعة. محطات الوقود منتشرة في كل مكان، وأفضل الاستراحات قرب زيستافوني وكوبوليتي.
    في باتومي تقع البياتزا في المنطقة المخصصة للمشاة بالمدينة القديمة على شارع بارنافاز مبه — اركن السيارة
    في مواقف الشوارع المجاورة المدفوعة. سيارة اقتصادية تكفي تماماً.
