ka:
  name: ცხრაწყაროს უღელტეხილი
  short: >-
    თრიალეთის ქედის მაღალი, მოუასფალტებელი უღელტეხილი ბაკურიანის თავზე: ნაძვნარი სუბალპურ მდელოდ იქცევა,
    გზა კი ტაბაწყურისკენ ეშვება.
  body: >-
    **ბაკურიანის ზემოთ ნაძვნარი თხელდება, ასფალტი თავდება, გზა კი მაინც მაღლა მიიწევს — სანამ თავზე მხოლოდ
    ბალახი და ცა არ დაგრჩებათ.**


    ცხრაწყარო დაახლოებით 2450 მეტრის სიმაღლის უღელტეხილია თრიალეთის ქედის დასავლეთ ნაწილში. ის ბორჯომის
    ხეობას ჯავახეთის ზეგანს, ბორჯომის მუნიციპალიტეტს კი ახალქალაქისას უკავშირებს და თაობების მანძილზე
    ქედზე გადასასვლელ გზად ემსახურებოდა. ქედი ეოცენური ანდეზიტის ლავებითაა აგებული, ფერდობებს სუბალპური
    მდელო ფარავს.


    ქვემოთ, ვულკანურ ქვაბულში, 1700 მეტრზე, ბაკურიანი დევს, სადაც საქართველოს პირველი სათხილამურო ბაზა
    1932 წელს გაიხსნა; ზამთარში უღელტეხილის გზა თოვლქვეშ იმარხება და მთა მოთხილამურეებს ეკუთვნის.


    უღელტეხილი ქცია-ტაბაწყურის აღკვეთილშია, რომელიც 1995 წელს ტაბაწყურის ტბისა და მისი ჭაობების დასაცავად
    შეიქმნა. ტბა ქედის სამხრეთით, 1991 მეტრზე, ვულკანურ ქვაბულს ავსებს: სარკის ფართობი 14,2 კმ²-ია, სიღრმე
    40 მეტრამდე, წყლის მოცულობით კი საქართველოს უდიდესი ტბაა. დეკემბრიდან მარტამდე ყინული ფარავს, კუნძულებზე
    კი, როგორც ვარაუდობენ, ზღვის იხვის (Melanitta fusca) კავკასიაში უკანასკნელი მობუდარი პოპულაცია ბინადრობს.
    თუმცა ეს მხარე სრულიად ხელუხლებელი არ არის: აღკვეთილზე ბაქო–თბილისი–ჯეიჰანის ნავთობსადენი გადის.


    გზის აღწერებში წერენ, რომ ყველაზე მოწმენდილ დღეს ჩრდილოეთით კავკასიონი, იალბუზიც კი, მოჩანს. შეიძლება
    მხოლოდ მდელოზე მორბენალი ღრუბლები დაგხვდეთ. მაინც ღირს: აქ მოსვლის მიზეზი თავად გზაა — ტყე, მერე ბალახი,
    მერე ქარი.
  tip: >-
    იმგზავრეთ მხოლოდ დაახლოებით ივნისიდან სექტემბრამდე და მხოლოდ მშრალ დღეს: წვიმის შემდეგ გრუნტი ღრმა,
    მოლიპულ ნაკვალევებად იქცევა. ქედზე ამინდი საათში იცვლება — ბორჯომში რომ ცხელოდეს, თბილი, ქარგაუმტარი
    ტანსაცმელი მაინც წამოიღეთ. ავზი შეავსეთ და საჭმელ-სასმელი ბაკურიანში მოიმარაგეთ: მის შემდეგ არაფერია,
    მობილური კავშირიც წყვეტილია. გზის აღწერების მიხედვით, უღელტეხილზე პოლიციის საგუშაგოა — პასპორტი და
    მანქანის საბუთები თან იქონიეთ. სექტემბრის ბოლოს თოვლი შეიძლება დაბრუნდეს. წინასწარ დარწმუნდით, რომ
    გაქირავების ხელშეკრულება მოუასფალტებელ გზაზე მგზავრობას ნებას გრთავთ.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით ხაშურამდე, ს8-ით ბორჯომამდე და მთის გზით ბაკურიანამდე — დაახლოებით
    183 კმ ასფალტი, სამ საათზე ცოტა ნაკლები. ბაკურიანიდან უღელტეხილამდე დაახლოებით 15 კილომეტრია მოუასფალტებელ
    გზაზე: ფხვიერი ქვა, ვიწრო თაროები, ციცაბო აღმართები — 40–60 წუთი დაითვალეთ. სულ დაახლოებით 200 კმ
    და ოთხი საათი. მშრალ ზაფხულში მაღალი კლირენსის ჯიპი გაუმკლავდება; წვიმის შემდეგ ან სეზონის დასაწყისსა
    და ბოლოს ნამდვილი ოთხწამყვანიანი აჯობებს. გზა სამხრეთით, ტაბაწყურის გავლით, ახალქალაქისკენ გრძელდება
    — ბორჯომიდან ახალქალაქამდე მთელი გადასასვლელი დაახლოებით 80 კილომეტრია, უმეტესად გრუნტზე.
en:
  name: Tskhratskaro Pass
  short: >-
    An unpaved pass high on the Trialeti range above Bakuriani, where spruce gives way to subalpine meadow
    and the road drops towards Lake Tabatskuri.
  body: >-
    **Above Bakuriani the spruce thins, the asphalt gives out, and the road keeps climbing until there
    is nothing above you but grass and sky.**


    Tskhratskaro, "nine springs", is a pass of about 2,450 metres in the western Trialeti range. It links
    the Borjomi valley with the Javakheti plateau, Borjomi municipality with Akhalkalaki's, and for generations
    it has been the way over the ridge between the two. The ridge here is built of Eocene andesite lavas,
    and the slopes are dressed in subalpine meadow.


    Below, in a volcanic hollow at 1,700 metres, lies Bakuriani, where Georgia's first ski base opened
    in 1932; in winter the pass road vanishes under snow and the mountain belongs to the skiers.


    The pass lies within the Ktsia-Tabatskuri Managed Reserve, created in 1995 to protect Lake Tabatskuri
    and its wetlands. The lake, south of the ridge at 1,991 metres, fills a volcanic basin of 14.2 km²
    and holds more water than any other lake in Georgia; it is up to 40 metres deep and frozen from December
    to March. Its islands shelter what is thought to be the last breeding population of velvet scoter
    in the Caucasus. This is not pure wilderness, though: the Baku–Tbilisi–Ceyhan oil pipeline crosses
    the reserve.


    Road guides say that on the clearest days the Greater Caucasus, Elbrus included, shows on the northern
    horizon. You may get only cloud racing across the meadow. Even then the drive is the point: forest,
    then grass, then wind.
  tip: >-
    Go only from about June to September, and only on a dry day: after rain the dirt turns into deep,
    slick ruts. Weather on the ridge changes within the hour, so pack a warm, windproof layer even if
    Borjomi is sweltering. Fill the tank and buy food and water in Bakuriani; there is nothing beyond
    it, and phone coverage is patchy. Road guides report a police checkpoint on the summit, so carry your
    passport and the car's papers. Snow can return by late September. Before you set off, check that your
    rental contract allows unpaved roads.
  route: >-
    From Tbilisi take the E60 (S1) west to Khashuri, the S8 to Borjomi and the mountain road up to Bakuriani:
    about 183 km of asphalt, just under three hours. From Bakuriani it is about 15 km to the pass on an
    unpaved road of loose stone, narrow ledges and steep pitches; allow 40 to 60 minutes. The total is
    about 200 km and four hours. In a dry summer a high-clearance SUV copes; after rain or at either end
    of the season, take a proper 4x4. The track continues south past Tabatskuri towards Akhalkalaki; the
    whole Borjomi–Akhalkalaki crossing is about 80 km, mostly unpaved.
ru:
  name: Перевал Цхрацкаро
  short: >-
    Грунтовый перевал высоко на Триалетском хребте над Бакуриани: ельник уступает место субальпийским
    лугам, а дорога спускается к озеру Табацкури.
  body: >-
    **Над Бакуриани ельник редеет, асфальт кончается, а дорога всё карабкается вверх, пока над вами не
    останутся только трава и небо.**


    Цхрацкаро, «девять родников», — перевал высотой около 2450 метров в западной части Триалетского хребта.
    Он связывает Боржомскую долину с Джавахетским плато, Боржомский муниципалитет — с Ахалкалакским, и
    из поколения в поколение именно здесь переходили хребет с одной стороны на другую. Хребет в этих местах
    сложен эоценовыми андезитовыми лавами, а склоны одеты субальпийскими лугами.


    Внизу, в вулканической котловине на высоте 1700 метров, лежит Бакуриани, где в 1932 году открылась
    первая в Грузии лыжная база; зимой дорогу на перевал заметает снегом, и гора достаётся лыжникам.


    Перевал лежит в пределах заказника Кция-Табацкури, созданного в 1995 году для охраны озера Табацкури
    и окрестных болот. Озеро, к югу от хребта, на высоте 1991 метр, заполняет вулканическую котловину
    площадью 14,2 км² и вмещает больше воды, чем любое другое озеро Грузии; глубина его доходит до 40
    метров, а с декабря по март оно сковано льдом. На его островах гнездится, как считается, последняя
    на Кавказе популяция обыкновенного турпана. Впрочем, нетронутой глушью это место не назовёшь: через
    заказник проходит нефтепровод Баку — Тбилиси — Джейхан.


    Дорожные путеводители уверяют, что в самые ясные дни на северном горизонте встаёт Большой Кавказ вместе
    с Эльбрусом. Вам может достаться лишь облако, несущееся над лугом. Но и тогда смысл — в самой дороге:
    лес, потом трава, потом ветер.
  tip: >-
    Ехать стоит примерно с июня по сентябрь и только в сухой день: после дождя грунт превращается в глубокую
    скользкую колею. Погода на хребте меняется в течение часа, поэтому возьмите тёплую ветрозащитную куртку,
    даже если в Боржоми изнуряющая жара. Заправьтесь и купите еду и воду в Бакуриани: дальше ничего нет,
    а связь неустойчива. Путеводители сообщают о полицейском посту на самом перевале, так что держите
    при себе паспорт и документы на машину. Снег может вернуться уже в конце сентября. Перед поездкой
    убедитесь, что договор проката разрешает езду по грунтовым дорогам.
  route: >-
    Из Тбилиси по E60 (S1) на запад до Хашури, по S8 до Боржоми и по горной дороге вверх до Бакуриани:
    около 183 км асфальта, чуть меньше трёх часов. От Бакуриани до перевала около 15 км грунтовки — сыпучий
    камень, узкие полки, крутые подъёмы; заложите 40–60 минут. Всего около 200 км и четыре часа. Сухим
    летом справится внедорожник с высоким клиренсом; после дождя, а также в начале и в конце сезона нужна
    настоящая машина с полным приводом. Дальше колея уходит на юг мимо Табацкури к Ахалкалаки; весь переезд
    Боржоми — Ахалкалаки составляет около 80 км, в основном без асфальта.
fa:
  name: گردنهٔ تسخراتسکارو
  short: >-
    گردنه‌ای خاکی بر بلندای رشته‌کوه تریالتی، بالای باکوریانی، جایی که جنگل نوئل جای خود را به چمنزار
    زیرآلپی می‌دهد و جاده به سوی دریاچهٔ تاباتسکوری سرازیر می‌شود.
  body: >-
    **بالای باکوریانی درختان نوئل تنک می‌شوند، آسفالت به پایان می‌رسد و جاده همچنان بالا می‌رود تا آنجا
    که بالای سرتان چیزی جز علف و آسمان نماند.**


    تسخراتسکارو، یعنی «نُه چشمه»، گردنه‌ای است در ارتفاع حدود ۲,۴۵۰ متر در بخش غربی رشته‌کوه تریالتی.
    این گردنه درهٔ بورجومی را به فلات جاواختی، و شهرستان بورجومی را به شهرستان آخالکالاکی پیوند می‌دهد
    و نسل‌ها راه گذر از این ستیغ میان دو سوی آن بوده است. ستیغ در اینجا از گدازه‌های آندزیتی دورهٔ ائوسن
    ساخته شده و دامنه‌ها جامهٔ چمنزار زیرآلپی بر تن دارند.


    پایین‌تر، در گودالی آتشفشانی به ارتفاع ۱,۷۰۰ متر، باکوریانی آرمیده است، جایی که نخستین پایگاه اسکی
    گرجستان در ۱۹۳۲ گشایش یافت؛ در زمستان جادهٔ گردنه زیر برف ناپدید می‌شود و کوهستان از آنِ اسکی‌بازان
    است.


    گردنه در محدودهٔ ذخیره‌گاه مدیریت‌شدهٔ کتسیا-تاباتسکوری قرار دارد که در ۱۹۹۵ برای حفاظت از دریاچهٔ
    تاباتسکوری و تالاب‌هایش پدید آمد. دریاچه، در جنوب ستیغ و در ارتفاع ۱,۹۹۱ متر، حوضه‌ای آتشفشانی به
    وسعت ۱۴٫۲ کیلومتر مربع را پر کرده و بیش از هر دریاچهٔ دیگری در گرجستان آب در خود دارد؛ ژرفایش تا ۴۰
    متر می‌رسد و از دسامبر تا مارس یخ‌بسته است. جزیره‌هایش پناهگاه جمعیتی از اردک دریایی مخملی (Melanitta
    fusca) است که گمان می‌رود آخرین جمعیت زادآور این پرنده در قفقاز باشد. با این همه، اینجا طبیعتی یکسره
    دست‌نخورده نیست: خط لولهٔ نفت باکو–تفلیس–جیحان از میان ذخیره‌گاه می‌گذرد.


    راهنماهای جاده‌ای می‌گویند در صاف‌ترین روزها قفقاز بزرگ، و البروس نیز، بر افق شمالی پیداست. شاید سهم
    شما تنها ابری باشد که بر چمنزار می‌تازد. حتی آن‌وقت هم خودِ راه است که اهمیت دارد: جنگل، سپس علف،
    سپس باد.
  tip: >-
    تنها از حدود ژوئن تا سپتامبر و فقط در روزی خشک بروید: پس از باران، جادهٔ خاکی به شیارهایی ژرف و لغزنده
    بدل می‌شود. هوا روی ستیغ در عرض یک ساعت دگرگون می‌شود، پس حتی اگر بورجومی از گرما بسوزد، لباسی گرم
    و ضدباد همراه داشته باشید. در باکوریانی باک را پر کنید و خوراک و آب بخرید؛ پس از آن هیچ چیز نیست و
    آنتن تلفن هم ناپایدار است. راهنماهای جاده‌ای از پاسگاه پلیس بر فراز گردنه خبر می‌دهند، پس گذرنامه
    و مدارک خودرو را همراه داشته باشید. برف ممکن است از اواخر سپتامبر بازگردد. پیش از حرکت مطمئن شوید
    قرارداد اجارهٔ خودرو رانندگی در جاده‌های خاکی را مجاز می‌داند.
  route: >-
    از تفلیس جادهٔ E60 (S1) را به سوی غرب تا خاشوری بروید، سپس S8 را تا بورجومی و جادهٔ کوهستانی را تا
    باکوریانی: حدود ۱۸۳ کیلومتر آسفالت، کمی کمتر از سه ساعت. از باکوریانی تا گردنه حدود ۱۵ کیلومتر جادهٔ
    خاکی است با سنگ‌های لق، لبه‌های باریک و شیب‌های تند؛ ۴۰ تا ۶۰ دقیقه وقت بگذارید. روی‌هم حدود ۲۰۰ کیلومتر
    و چهار ساعت. در تابستانی خشک، شاسی‌بلندی با فاصلهٔ کف زیاد از پسش برمی‌آید؛ پس از باران یا در آغاز
    و پایان فصل، یک خودروی چهارچرخ‌محرک واقعی بردارید. مسیر از آنجا به سوی جنوب، از کنار تاباتسکوری، تا
    آخالکالاکی ادامه دارد؛ کل گذر بورجومی–آخالکالاکی حدود ۸۰ کیلومتر است و بیشترش آسفالت‌نشده.
he:
  name: מעבר צחראצקרו
  short: >-
    מעבר הרים לא סלול גבוה ברכס טריאלטי מעל בקוריאני, שבו יער האשוחית מפנה את מקומו לאחו תת-אלפיני והדרך
    יורדת לעבר אגם טבאצקורי.
  body: >-
    **מעל בקוריאני יער האשוחית מידלדל, האספלט נגמר, והדרך ממשיכה לטפס עד שמעליכם אין דבר מלבד עשב ושמיים.**


    צחראצקרו, "תשעה מעיינות", הוא מעבר בגובה של כ-2,450 מטרים בחלקו המערבי של רכס טריאלטי. הוא מחבר את
    עמק בורג׳ומי עם רמת ג׳ווחטי, ואת מחוז בורג׳ומי עם מחוז אחלקלקי, ובמשך דורות עברה כאן הדרך מצדו האחד
    של הרכס אל צדו השני. הרכס בנוי כאן מלבות אנדזיט מתקופת האאוקן, והמדרונות מכוסים אחו תת-אלפיני.


    למטה, בשקע געשי בגובה 1,700 מטרים, שוכנת בקוריאני, שבה נפתח ב-1932 בסיס הסקי הראשון של גאורגיה; בחורף
    דרך המעבר נעלמת תחת השלג וההר שייך לגולשים.


    המעבר נמצא בתחומי השמורה המנוהלת קציה-טבאצקורי, שהוקמה ב-1995 כדי להגן על אגם טבאצקורי ועל אזורי הביצות
    שלו. האגם, מדרום לרכס ובגובה 1,991 מטרים, ממלא אגן געשי בשטח 14.2 קמ״ר ומכיל יותר מים מכל אגם אחר
    בגאורגיה; עומקו מגיע עד 40 מטרים, והוא קפוא מדצמבר עד מרץ. באייו מקננת, לפי ההערכה, אוכלוסיית הרבייה
    האחרונה בקווקז של ברווז הים הקטיפתי (Melanitta fusca). ובכל זאת אין זה טבע בתולי לגמרי: צינור הנפט
    באקו–טביליסי–ג׳ייהאן חוצה את השמורה.


    מדריכי דרכים מספרים שבימים הצלולים ביותר נראה באופק הצפוני הקווקז הגדול, ובכלל זה האלברוס. ייתכן שתזכו
    רק לענן שדוהר על פני האחו. גם אז, הנסיעה עצמה היא העיקר: יער, אחר כך עשב, אחר כך רוח.
  tip: >-
    סעו רק בערך מיוני עד ספטמבר, ורק ביום יבש: אחרי גשם דרך העפר הופכת לתלמים עמוקים וחלקלקים. מזג האוויר
    על הרכס משתנה בתוך שעה, לכן קחו שכבה חמה ואטומה לרוח גם אם בבורג׳ומי שורר חום כבד. תדלקו וקנו אוכל
    ומים בבקוריאני: אחריה אין כלום, והקליטה הסלולרית מקוטעת. מדריכי דרכים מדווחים על מחסום משטרה בראש
    המעבר, לכן החזיקו אצלכם דרכון ואת מסמכי הרכב. השלג עלול לחזור כבר בסוף ספטמבר. לפני היציאה ודאו שחוזה
    ההשכרה מתיר נסיעה בדרכים לא סלולות.
  route: >-
    מטביליסי סעו מערבה בכביש E60 (S1) עד חשורי, בכביש S8 עד בורג׳ומי ובדרך ההררית עד בקוריאני: כ-183 ק״מ
    של אספלט, קצת פחות משלוש שעות. מבקוריאני עד המעבר כ-15 ק״מ של דרך עפר עם אבנים רופפות, מדפים צרים
    ועליות תלולות; הקדישו לכך 40 עד 60 דקות. בסך הכול כ-200 ק״מ וארבע שעות. בקיץ יבש יסתדר רכב פנאי-שטח
    עם מרווח גחון גבוה; אחרי גשם, או בתחילת העונה ובסופה, קחו רכב שטח בהנעה כפולה של ממש. הדרך ממשיכה
    דרומה על פני טבאצקורי לכיוון אחלקלקי; כל החצייה מבורג׳ומי לאחלקלקי היא כ-80 ק״מ, רובה לא סלולה.
ar:
  name: ممر تسخراتسكارو
  short: >-
    ممر جبلي غير معبّد عالٍ في سلسلة تريالتي فوق باكورياني، حيث تُفسح غابات التنّوب المجال لمروج شبه ألبية،
    وينحدر الطريق نحو بحيرة تاباتسكوري.
  body: >-
    **فوق باكورياني تتخلخل أشجار التنّوب، وينتهي الإسفلت، ويواصل الطريق صعوده حتى لا يبقى فوقك سوى العشب
    والسماء.**


    تسخراتسكارو، أي «الينابيع التسعة»، ممرٌّ على ارتفاع نحو 2,450 مترًا في الجزء الغربي من سلسلة تريالتي.
    يصل وادي بورجومي بهضبة جافاخيتي، وبلدية بورجومي ببلدية أخالكالاكي، وظلّ أجيالًا طريقَ عبور السلسلة
    من جانب إلى آخر. تتكوّن السلسلة هنا من حمم أنديزيتية تعود إلى عصر الإيوسين، وتكسو المنحدراتِ مروجٌ
    شبه ألبية.


    في الأسفل، في منخفض بركاني على ارتفاع 1,700 متر، تقع باكورياني التي افتُتحت فيها أول قاعدة للتزلج
    في جورجيا عام 1932؛ وفي الشتاء يختفي طريق الممر تحت الثلج ويصير الجبل ملكًا للمتزلجين.


    يقع الممر ضمن محمية كتسيا-تاباتسكوري المُدارة، التي أُنشئت عام 1995 لحماية بحيرة تاباتسكوري وأراضيها
    الرطبة. تملأ البحيرة، الواقعة جنوب السلسلة على ارتفاع 1,991 مترًا، حوضًا بركانيًا مساحته 14.2 كم²،
    وتختزن من الماء أكثر من أي بحيرة أخرى في جورجيا؛ يصل عمقها إلى 40 مترًا، وتتجمّد من ديسمبر إلى مارس.
    وتؤوي جزرها ما يُعتقد أنه آخر جماعة متكاثرة في القوقاز من البط الأسود المخملي (Melanitta fusca). ومع
    ذلك فالمكان ليس برّيةً بكرًا تمامًا: إذ يعبر المحمية خط أنابيب النفط باكو–تبليسي–جيهان.


    تقول أدلة الطرق إن القوقاز الكبير، ومعه قمة إلبروس، يلوح في الأفق الشمالي في أصفى الأيام. وقد لا يصيبك
    سوى غيمة تعدو فوق المرج. وحتى عندئذٍ تبقى الرحلة نفسها هي الغاية: غابة، ثم عشب، ثم ريح.
  tip: >-
    لا تذهب إلا من يونيو تقريبًا حتى سبتمبر، وفي يوم جافّ فقط: فبعد المطر يتحوّل التراب إلى أخاديد عميقة
    زلقة. يتقلّب الطقس على السلسلة في غضون ساعة، فاحمل طبقة دافئة واقية من الريح حتى لو كانت بورجومي تتلظّى
    حرًّا. املأ الخزان واشترِ الطعام والماء في باكورياني؛ فلا شيء بعدها، وتغطية الهاتف متقطعة. تذكر أدلة
    الطرق وجود نقطة تفتيش للشرطة على قمة الممر، فاحمل جواز سفرك ووثائق السيارة. قد يعود الثلج في أواخر
    سبتمبر. وقبل الانطلاق تأكّد أن عقد الاستئجار يسمح بالقيادة على الطرق غير المعبّدة.
  route: >-
    من تبليسي اسلك الطريق E60 (S1) غربًا حتى خاشوري، ثم S8 إلى بورجومي، ثم الطريق الجبلي صعودًا إلى باكورياني:
    نحو 183 كم من الإسفلت، في أقل بقليل من ثلاث ساعات. ومن باكورياني إلى الممر نحو 15 كم على طريق ترابي
    من الحجارة المفكّكة والحواف الضيقة والمقاطع شديدة الانحدار؛ خصّص لها 40 إلى 60 دقيقة. المجموع نحو
    200 كم وأربع ساعات. في صيف جافّ تكفي سيارة رياضية متعددة الاستخدامات عالية الخلوص الأرضي؛ أما بعد
    المطر أو في أول الموسم وآخره فخذ سيارة دفع رباعي حقيقية. ويمضي المسار جنوبًا مارًّا بتاباتسكوري نحو
    أخالكالاكي؛ ويبلغ العبور كله من بورجومي إلى أخالكالاكي نحو 80 كم، معظمها غير معبّد.
