ka:
  name: ცხრაწყაროს უღელტეხილი
  short: >-
    2454-მეტრიანი უღელტეხილი ბაკურიანსა და ტაბაწყურს შორის — ალპური პანორამები თრიალეთის ქედზე, კარგ ამინდში
    ელბრუსამდე.
  body: >-
    **ცხრაწყაროზე ბაკურიანის ტყე მთავრდება და ალპური სამყარო იწყება.** უღელტეხილი (2454 მ) თრიალეთის ქედზე
    გადადის და ბორჯომის ხეობას ჯავახეთის ვულკანურ პლატოს უერთებს — ეს არის გზა ბაკურიანიდან ტაბაწყურის
    ტბისა და ახალქალაქისკენ. სახელი „ცხრა წყაროს" ნიშნავს — ფერდობებიდან მართლაც უამრავი ნაკადული გამოდის.


    გზა ბაკურიანიდან სერპენტინით ადის: ჯერ წიწვოვანი ტყე, მერე დეკიანი ველები, ბოლოს კი მხოლოდ ქარიანი
    მდელოები და ჰორიზონტამდე გადაშლილი ქედები. რას ნახავ ზემოდან:


    - კავკასიონის მთავარი ქედის პანორამა — ნათელ დღეს ელბრუსიც ჩანს

    - ტაბაწყურის ტბა, რომელიც სამხრეთით, ვულკანურ ქვაბულში ლურჯად დგას

    - ზაფხულში — ალპური ყვავილების ხალიჩები და მწყემსების ბანაკები


    ივნისიდან სექტემბრამდე უღელტეხილზე ჩვეულებრივი მაღალი გამავლობის მანქანით ახვალ; დანარჩენ დროს გზა
    თოვლითაა ჩაკეტილი — ზამთარში აქ ბაკურიანის საბაგიროც კი ადის სათხილამურო ტრასებისკენ. მწვერვალზე პოლიციის
    საგუშაგოა. ეს ის მარშრუტია, სადაც გზა თავად არის ღირსშესანიშნაობა.
  tip: >-
    ამინდი წამში იცვლება: ქვემოთ სიცხეშიც კი თბილი ქურთუკი წამოიღე, ზემოთ მუდმივად ქარია. საწვავი, საჭმელი
    და წყალი წინასწარ მოიმარაგე — ბაკურიანის შემდეგ არაფერია. წვიმის შემდეგ გზა მოლიპულია და ღრმა ნაკვალევებია
    — მშრალ ამინდში იმგზავრე. მობილური კავშირი წყვეტილია. სექტემბრის ბოლოს პირველი თოვლი უკვე შესაძლებელია.
    დაბრუნება ან იმავე გზით, ან ტაბაწყურისკენ ჩაშვებით.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, იქიდან ბორჯომში და სერპენტინით ბაკურიანამდე — დაახლოებით 190 კმ ასფალტი,
    3 საათი. ბაკურიანიდან უღელტეხილამდე კიდევ 12-13 კმ-ია: გრუნტი და ღორღი, ციცაბო და ვიწრო მონაკვეთებით,
    დაახლოებით 40-50 წუთი. მშრალ ზაფხულში მაღალი კლირენსის SUV საკმარისია; წვიმის შემდეგ ან სეზონის კიდეებზე
    სრულფასოვანი 4x4 აჯობებს. საწვავი აუცილებლად ბორჯომში ან ბაკურიანში ჩაასხი. გაგრძელება ტაბაწყურისკენ
    იმავე ხარისხის გრუნტია.
en:
  name: Tskhratskaro Pass
  short: >-
    A 2,454-metre pass between Bakuriani and Tabatskuri — alpine panoramas over the Trialeti ridge, with
    Elbrus visible on a clear day.
  body: >-
    **At Tskhratskaro the Bakuriani forest ends and the alpine world begins.** The pass (2,454 m) crosses
    the Trialeti ridge and links the Borjomi valley with the volcanic plateau of Javakheti — this is the
    road from Bakuriani towards Lake Tabatskuri and Akhalkalaki. The name means "nine springs", and streams
    really do pour off the slopes on all sides.


    The road climbs out of Bakuriani in switchbacks: conifer forest first, then rhododendron slopes, and
    finally nothing but windswept meadows and ridgelines running to the horizon. What you get from the
    top:


    - A panorama of the Greater Caucasus — on a clear day you can pick out Elbrus

    - Lake Tabatskuri lying deep blue in its volcanic bowl to the south

    - In summer, carpets of alpine flowers and shepherds' camps


    From June to September a normal high-clearance vehicle gets you up; the rest of the year the road
    is closed by snow — in winter Bakuriani's ski lifts run up this way instead. There is a police checkpoint
    at the top. This is one of those routes where the road itself is the sight.
  tip: >-
    The weather flips in minutes: bring a warm jacket even in valley heat, as the top is permanently windy.
    Stock up on fuel, food and water beforehand — there is nothing after Bakuriani. After rain the surface
    turns slick with deep ruts, so pick a dry day. Mobile signal is patchy. First snow can arrive by late
    September. Return the same way or drop down to Tabatskuri.
  route: >-
    From Tbilisi take the E60 to Khashuri, then to Borjomi and up the switchbacks to Bakuriani — about
    190 km of asphalt, 3 hours. From Bakuriani the pass is another 12-13 km: dirt and gravel with steep,
    narrow stretches, roughly 40-50 minutes. In a dry summer a high-clearance SUV is enough; after rain
    or at the edges of the season a proper 4x4 is the better call. Fill the tank in Borjomi or Bakuriani
    without fail. The continuation down to Tabatskuri is dirt of the same grade.
ru:
  name: Перевал Цхрацкаро
  short: >-
    Перевал высотой 2454 метра между Бакуриани и Табацкури — альпийские панорамы Триалетского хребта,
    в ясный день виден Эльбрус.
  body: >-
    **На Цхрацкаро кончается бакурианский лес и начинается альпийский мир.** Перевал (2454 м) пересекает
    Триалетский хребет и связывает Боржомскую долину с вулканическим плато Джавахети — это дорога из Бакуриани
    к озеру Табацкури и Ахалкалаки. Название означает «девять родников», и ручьи действительно стекают
    со склонов со всех сторон.


    Дорога поднимается из Бакуриани серпантином: сначала хвойный лес, потом склоны с рододендроном, а
    под конец — только продуваемые луга и уходящие к горизонту хребты. Что видно сверху:


    - Панорама Большого Кавказа — в ясный день различим Эльбрус

    - Озеро Табацкури, синеющее в вулканической котловине к югу

    - Летом — ковры альпийских цветов и пастушьи стоянки


    С июня по сентябрь наверх поднимется обычная машина с высоким клиренсом; в остальное время дорога
    закрыта снегом — зимой сюда поднимаются разве что канатные дороги Бакуриани к лыжным трассам. На вершине
    — полицейский пост. Это один из тех маршрутов, где достопримечательность — сама дорога.
  tip: >-
    Погода меняется за минуты: возьмите тёплую куртку даже в жару внизу — наверху постоянный ветер. Топливо,
    еду и воду запасите заранее: после Бакуриани нет ничего. После дождя покрытие раскисает, остаются
    глубокие колеи — выбирайте сухой день. Мобильная связь прерывистая. Первый снег возможен уже в конце
    сентября. Обратно — тем же путём или спуском к Табацкури.
  route: >-
    Из Тбилиси — по E60 до Хашури, затем в Боржоми и серпантином до Бакуриани: около 190 км асфальта,
    3 часа. От Бакуриани до перевала ещё 12-13 км — грунт и гравий с крутыми узкими участками, примерно
    40-50 минут. Сухим летом достаточно кроссовера с высоким клиренсом; после дождей и на краях сезона
    надёжнее полноценный 4x4. Обязательно заправьтесь в Боржоми или Бакуриани. Продолжение вниз к Табацкури
    — грунтовка того же качества.
fa:
  name: گردنهٔ تسخراتسکارو
  short: >-
    گردنه‌ای در ارتفاع 2454 متر میان باکوریانی و تاباتسکوری — چشم‌اندازهای آلپی رشته‌کوه تریالتی و در
    روز صاف، البروس.
  body: >-
    **در تسخراتسکارو جنگل باکوریانی تمام می‌شود و دنیای آلپی آغاز می‌گردد.** گردنه (2454 متر) از رشته‌کوه
    تریالتی می‌گذرد و درهٔ بورجومی را به فلات آتشفشانی جاواختی می‌پیوندد — این همان جادهٔ باکوریانی به
    دریاچهٔ تاباتسکوری و آخال‌کالاکی است. نامش یعنی «نُه چشمه» و به‌راستی از دامنه‌ها از هر سو جویبار
    جاری است.


    جاده با پیچ‌های پیاپی از باکوریانی بالا می‌رود: نخست جنگل سوزنی‌برگ، سپس دامنه‌های خرزهره و در پایان
    فقط علفزارهای بادخیز و خط‌الرأس‌هایی تا افق. از بالا چه نصیبتان می‌شود:


    - پانورامای قفقاز بزرگ — در روز صاف حتی البروس پیداست

    - دریاچهٔ تاباتسکوری که در جنوب، در کاسهٔ آتشفشانی‌اش آبی می‌زند

    - در تابستان فرش گل‌های آلپی و اتراق چوپان‌ها


    از ژوئن تا سپتامبر با خودروی معمولی شاسی‌بلند بالا می‌روید؛ باقی سال جاده زیر برف بسته است — زمستان‌ها
    به جای جاده، بالابرهای اسکی باکوریانی به این سو می‌آیند. بر فراز گردنه پاسگاه پلیس هست. این از آن
    مسیرهاست که خودِ جاده جاذبه است.
  tip: >-
    هوا در چند دقیقه برمی‌گردد: حتی در گرمای پایین هم کاپشن گرم بردارید — بالا همیشه باد می‌وزد. بنزین
    و خوراک و آب را از قبل تهیه کنید — بعد از باکوریانی هیچ چیز نیست. پس از باران سطح جاده لغزنده و شیاردار
    می‌شود؛ روز خشک را انتخاب کنید. آنتن موبایل قطع‌ووصل است. اواخر سپتامبر ممکن است اولین برف ببارد.
    برگشت یا از همان راه است یا با سرازیری به سوی تاباتسکوری.
  route: >-
    از تفلیس با E60 تا خاشوری، سپس بورجومی و با پیچ‌ها تا باکوریانی — حدود 190 کیلومتر آسفالت، 3 ساعت.
    از باکوریانی تا گردنه 12 تا 13 کیلومتر دیگر است: خاکی و شنی با تکه‌های تند و باریک، حدود 40 تا 50
    دقیقه. در تابستان خشک، شاسی‌بلند با ارتفاع مناسب کافی است؛ پس از باران یا در حاشیهٔ فصل، چهارچرخ‌محرک
    واقعی انتخاب بهتری است. حتماً در بورجومی یا باکوریانی باک را پر کنید. ادامهٔ مسیر به تاباتسکوری هم
    خاکی با همین کیفیت است.
he:
  name: מעבר צחראצקרו
  short: מעבר הרים בגובה 2,454 מטר בין בקוריאני לטבצקורי — נופים אלפיניים על רכס טריאלטי, וביום בהיר גם
    האלברוס.
  body: >-
    **בצחראצקרו נגמר היער של בקוריאני ומתחיל העולם האלפיני.** המעבר (2,454 מ') חוצה את רכס טריאלטי ומחבר
    את עמק בורג'ומי עם הרמה הוולקנית של ג'ווחתי — זו הדרך מבקוריאני אל אגם טבצקורי ואחלקלאקי. פירוש השם
    "תשעה מעיינות", ואכן פלגים ניגרים מהמדרונות מכל עבר.


    הדרך מטפסת מבקוריאני בפיתולים: תחילה יער מחטני, אחר כך מדרונות רודודנדרון, ולבסוף רק אחו סחוף רוחות
    ורכסים הנמתחים עד האופק. מה מקבלים למעלה:


    - פנורמה של הקווקז הגדול — ביום בהיר אפשר לזהות את האלברוס

    - אגם טבצקורי, כחול עמוק באגן הוולקני שלו מדרום

    - בקיץ — מרבדי פרחים אלפיניים ומאהלי רועים


    מיוני עד ספטמבר רכב רגיל עם מרווח גחון גבוה מעלה אתכם; בשאר השנה הדרך חסומה בשלג — בחורף מטפסות לכאן
    רק הרכבלים של אתר הסקי בקוריאני. בפסגה עמדת משטרה. זה אחד המסלולים שבהם הדרך עצמה היא האטרקציה.
  tip: >-
    מזג האוויר מתהפך בדקות: קחו מעיל חם גם כשחם למטה — למעלה הרוח קבועה. הצטיידו מראש בדלק, אוכל ומים
    — אחרי בקוריאני אין כלום. אחרי גשם פני הדרך הופכים חלקלקים עם תלמים עמוקים — בחרו יום יבש. הקליטה
    הסלולרית מקוטעת. שלג ראשון אפשרי כבר בסוף ספטמבר. חוזרים באותה דרך או יורדים לטבצקורי.
  route: >-
    מטביליסי ב-E60 עד חשורי, משם לבורג'ומי ובפיתולים עד בקוריאני — כ-190 ק"מ אספלט, 3 שעות. מבקוריאני
    עד המעבר עוד 12-13 ק"מ: עפר וחצץ עם קטעים תלולים וצרים, בערך 40-50 דקות. בקיץ יבש מספיק רכב שטח עם
    מרווח גחון גבוה; אחרי גשם או בשולי העונה עדיף 4x4 אמיתי. תדלקו בלי לוותר בבורג'ומי או בבקוריאני. ההמשך
    בירידה לטבצקורי הוא דרך עפר באותה רמה.
ar:
  name: ممر تسخراتسكارو
  short: >-
    ممر جبلي على ارتفاع 2454 متراً بين باكورياني وتاباتسكوري — بانوراما ألبية فوق سلسلة تريالتي، ويُرى
    إلبروس في اليوم الصافي.
  body: >-
    **عند تسخراتسكارو تنتهي غابة باكورياني ويبدأ العالم الألبي.** يعبر الممر (2454 م) سلسلة تريالتي ويصل
    وادي بورجومي بهضبة جافاخيتي البركانية — إنه طريق باكورياني نحو بحيرة تاباتسكوري وأخالكالاكي. الاسم
    يعني «الينابيع التسعة»، وبالفعل تنحدر الجداول من السفوح في كل اتجاه.


    يتسلق الطريق من باكورياني في منعطفات متعاقبة: غابة صنوبرية أولاً، ثم سفوح مكسوة بالورد الجبلي، وأخيراً
    لا شيء سوى مروج تعصف بها الريح وسلاسل تمتد حتى الأفق. ما الذي تناله في الأعلى:


    - بانوراما القوقاز الكبير — في اليوم الصافي تميز قمة إلبروس

    - بحيرة تاباتسكوري تتلألأ بزرقتها العميقة في حوضها البركاني جنوباً

    - في الصيف بسط من الزهور الألبية ومضارب الرعاة


    من يونيو إلى سبتمبر تصعد بسيارة عادية عالية القاعدة؛ وبقية السنة يغلق الثلج الطريق — في الشتاء تصعد
    إلى هنا مصاعد التزلج في باكورياني بدلاً منه. وعلى القمة نقطة شرطة. هذا من الطرق التي يكون فيها الطريق
    نفسه هو المعلم.
  tip: >-
    الطقس ينقلب في دقائق: خذ سترة دافئة حتى في حر الوادي — الأعلى عاصف دائماً. تزود مسبقاً بالوقود والطعام
    والماء — لا شيء بعد باكورياني. بعد المطر يصير السطح زلقاً بأخاديد عميقة، فاختر يوماً جافاً. إشارة
    الهاتف متقطعة. قد يهطل أول ثلج في أواخر سبتمبر. العودة من الطريق نفسه أو بالانحدار نحو تاباتسكوري.
  route: >-
    من تبليسي عبر E60 حتى خاشوري، ثم إلى بورجومي وبالمنعطفات حتى باكورياني — نحو 190 كم من الأسفلت في
    3 ساعات. من باكورياني إلى الممر 12-13 كم أخرى: تراب وحصى مع مقاطع حادة وضيقة، نحو 40-50 دقيقة. في
    الصيف الجاف تكفي سيارة SUV عالية القاعدة؛ وبعد المطر أو على أطراف الموسم يكون الدفع الرباعي الحقيقي
    خياراً أصوب. املأ الخزان في بورجومي أو باكورياني دون تهاون. ومتابعة الطريق نزولاً إلى تاباتسكوري تراب
    من الدرجة نفسها.
