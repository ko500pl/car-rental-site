ka:
  name: ზანდოს წმინდა გიორგის მონასტერი
  short: >-
    1519 წლის პატარა უგუმბათო ეკლესია თხილნარით შემოსილ მაღლობზე სამტრედიის სამხრეთით — მოწმენდილ დღეს
    აქედან პალიასტომიცა და ფოთის შუქურაც ჩანს.
  body: >-
    **გადმოცემით, ამ მთას თავდაპირველად „სანდო“ ერქვა, რადგან გასაჭირის დროს ხალხს კარგად მალავდა; წლების
    განმავლობაში სახელი „ზანდოდ“ გადაიქცა.** ქვემოთ მდებარე სოფელს — 2007 წლამდე ორ სოფელს, ზემო და ქვემო
    აბაშას — დღეს გამოჩინებული ჰქვია, და მაღლობზე მდგარ მონასტერსაც იმავე მიზეზით ასე უწოდებენ: აქედან
    თვალი ძალიან შორს სწვდება.


    წმინდა გიორგის ეკლესია პატარა, უგუმბათო ნაგებობაა, თლილი ქვით აშენებული და 1519 წლით დათარიღებული.
    გურიის ქედის ერთ-ერთ განშტოებაზე, თხილისა და ჭადრის ტევრში დგას. დასავლეთით ქვიტკირის ორსართულიანი
    სამრეკლო აღმართულა, რომლის აღმოსავლეთ კარს თავზე მხედრული წარწერა ჰქონდა: „მოსახსენებლად სულთა გიგო
    კალოიანისა და მშობელთა თვისთა ამ სამრეკლოის აშენებაზე შევაწიე სამი თუმანი აზნაურმა ოტია კალოიანმა“
    — 1856 წელს.


    XVIII საუკუნის 80-იან წლებში, როცა ოსმალებმა ხინოწმინდის საეპისკოპოსო გააუქმეს, კათედრამ თავი აქ შეაფარა
    და გამოხიზნული ეპისკოპოსი იოანე ხინოწმინდელი აქ მოღვაწეობდა. ხინოწმინდიდან ღვთისმშობლის ოქროს ხატიც
    გადმოასვენეს, რომელიც 1904 წელს ტაძრიდან მოიპარეს. სოფელში დაიბადა ფილიმონ ქორიძე — საოპერო მომღერალი,
    რომელმაც ქართული საგალობლები სანოტოდ ჩაწერა.


    აქ ძველად ასეთი სააღდგომო წესიც არსებობდა. წითელ პარასკევს თარგამაძეების გვარის კაცი სოფელში ვერცხლით
    მოჭედილ დროშა-ჯვარს ჩამოატარებდა და ხალხი ნებით სწირავდა. შეგროვილი ფულით ზვარაკს — ცხვარს — ყიდულობდნენ,
    აღდგომის დილას, წირვის შემდეგ, შემწვარს კალოიანებს მიართმევდნენ, ისინი ბეჭებს აიღებდნენ და ხალხს დაუძახებდნენ:
    „ზვარაკი არის და მოგროვდითო“ — და ყველას უნაწილებდნენ.


    მოწმენდილ დღეს თვალი ბახმაროს მთებსა და გურიის მთიანეთს წვდება, ერთ მხარეს კი პალიასტომის ტბა და ფოთის
    შუქურა ციმციმებს.
  tip: >-
    მონასტერი ჩვეულებრივ 10:00-დან 17:00-მდეა ღია. ჩაიცვით ისე, როგორც ნებისმიერ ქართულ მონასტერში შეეფერება:
    მხრები და მუხლები დაფარული, ქალებს თავსაბური, ხმადაბლა საუბარი, განსაკუთრებით წირვისას. მაღლობზე რამის
    ყიდვის იმედი ნუ გექნებათ — წყალი თან იქონიეთ. პალიასტომისა და ფოთის სანახავად მოწმენდილი, მშრალი დღე
    შეარჩიეთ — ზაფხულში დაბლობის ბურუსი სანაპიროს ხშირად მალავს — და დილით ან ნაშუადღევს მოდით, როცა ქვას
    რბილი სინათლე ეცემა. ძლიერი წვიმის შემდეგ ბოლო აღმართი სრიალებს, ამიტომ ფეხსაცმელი მყარი ძირით აირჩიეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორის, ხაშურის, ზესტაფონისა და ქუთაისის გავლით, სამტრედიის
    წრიულ გზაჯვარედინამდე იარეთ — დაახლოებით 247 კმ. იქიდან სამხრეთით, ს12-ზე, ლანჩხუთის მიმართულებით
    გადაუხვიეთ და ოთხ-ხუთ კილომეტრში, დაფნართან, სოფლის გზებს დაადექით, რომლებიც გამოჩინებულის გავლით
    სამხრეთით მთის ძირამდე მიდის — სულ დაახლოებით 263 კმ და ოთხი საათი და მეოთხედი. მთავარი გზები ასფალტიანია;
    ბოლო, დაახლოებით კილომეტრიანი აღმართი უსწორმასწოროა და რეგიონის ტურისტული სამსახური ოთხწამყვანიან
    მანქანას გირჩევთ. ეკონომ-კლასის მანქანა სოფელში დატოვეთ და ზემოთ ფეხით ადით. საწვავი სამტრედიაში ჩაასხით.
en:
  name: Zando St George Monastery
  short: >-
    A small domeless church of 1519 on a hazel-wooded hill south of Samtredia, where on clear days the
    view reaches Lake Paliastomi and Poti.
  body: >-
    **Tradition says this hill was first called Sando, 'the trusty one', because in hard times it hid
    people well; over the years the name wore down to Zando.** The village below — until 2007 the two
    villages of Zemo and Kvemo Abasha — is now called Gamochinebuli, 'the one in plain view', and the
    monastery on the height shares that name for the same reason: from here the eye travels far.


    The church of St George is small and domeless, built of dressed stone and dated to 1519, standing
    in a thicket of hazel and plane trees on one of the spurs of the Guria range. West of it rises a two-storey
    bell tower of stone and lime. Over its eastern door it carried an inscription in Georgian script:
    in 1856, 'for the remembrance of the souls of Gigo Kaloiani and his parents', the nobleman Otia Kaloiani
    gave three tumans towards building the tower.


    In the 1780s, after the Ottomans abolished the bishopric of Khinotsminda, its see took refuge here,
    with the exiled Bishop Ioane. A golden icon of the Virgin came with it from Khinotsminda; it was stolen
    from the church in 1904. The opera singer Pilimon Koridze, who wrote down Georgian church chant in
    musical notation, was born in the village.


    An old Easter custom is on record here. On Good Friday a man of the Targamadze family carried a silver-mounted
    banner-cross through the village and people gave freely; the money bought a sheep, which after the
    Easter morning liturgy was roasted and presented to the Kaloiani family. They took the shoulders,
    then called out that the offering was ready, and shared the rest among everyone.


    On the clearest days the view runs from the Bakhmaro mountains and the Gurian highlands to the glint
    of Lake Paliastomi and the lighthouse at Poti.
  tip: >-
    The monastery is usually open from 10:00 to 17:00. Dress as for any Georgian monastery: covered shoulders
    and knees, a headscarf for women, and quiet voices, especially during services. Don't count on buying
    anything on the hill; bring water. For the long view to Paliastomi and Poti, choose a clear, dry day
    — the haze over the lowland often hides the coast in summer — and come in the morning or late afternoon,
    when the light is kinder to the stone. After heavy rain the last climb gets slippery, so wear shoes
    with grip.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori, Khashuri, Zestaponi and Kutaisi to the Samtredia roundabout,
    about 247 km. Turn south onto the S12 towards Lanchkhuti and after four or five kilometres, at Dapnari,
    turn off onto the village roads that run south through Gamochinebuli to the foot of the hill — about
    263 km and some four and a quarter hours in all. The main roads are asphalt; the final climb of a
    kilometre or so is rough, and the regional tourism office recommends a 4×4. In an economy car, leave
    it in the village and walk up. Fuel is easiest in Samtredia.
ru:
  name: Монастырь Святого Георгия в Зандо
  short: >-
    Небольшая бескупольная церковь 1519 года на холме, заросшем орешником, к югу от Самтредиа — в ясный
    день отсюда видны озеро Палиастоми и Поти.
  body: >-
    **Предание говорит, что этот холм сначала звался Сандо, «надёжный», потому что в тяжёлые времена он
    хорошо прятал людей; со временем имя стёрлось до Зандо.** Село под ним — до 2007 года два села, Земо
    и Квемо Абаша — теперь называется Гамочинебули, «то, что на виду», и монастырь на высоте носит то
    же имя по той же причине: отсюда взгляд уходит далеко.


    Церковь Святого Георгия — небольшая, бескупольная, из тёсаного камня, датированная 1519 годом, стоит
    в зарослях орешника и платанов на одном из отрогов Гурийского хребта. К западу от неё поднимается
    двухэтажная колокольня из камня и известкового раствора. Над её восточной дверью была надпись грузинским
    письмом: в 1856 году «в память душ Гиго Калоиани и его родителей» дворянин Отиа Калоиани дал три тумана
    на строительство колокольни.


    В 1780-х годах, после того как османы упразднили Хиноцминдскую епархию, её кафедра нашла здесь укрытие
    вместе с изгнанным епископом Иоане. Из Хиноцминды сюда же принесли золотую икону Богородицы; её украли
    из церкви в 1904 году. В селе родился оперный певец Пилимон Коридзе, записавший грузинские церковные
    песнопения нотами.


    Здесь зафиксирован старинный пасхальный обычай. В Страстную пятницу мужчина из рода Таргамадзе проносил
    по селу знамя-крест в серебряной оправе, и люди подавали, кто сколько может; на собранные деньги покупали
    овцу, которую после утренней пасхальной литургии зажаривали и преподносили семье Калоиани. Те брали
    себе лопатки, затем объявляли, что жертва готова, и делили остальное между всеми.


    В самые ясные дни взгляд достигает гор Бахмаро и Гурийского нагорья, а дальше — блеска озера Палиастоми
    и маяка Поти.
  tip: >-
    Монастырь обычно открыт с 10:00 до 17:00. Одевайтесь как для любого грузинского монастыря: плечи и
    колени закрыты, у женщин — платок на голове, и говорите негромко, особенно во время службы. На холме
    почти нечего купить — возьмите воду. Для дальнего вида на Палиастоми и Поти выбирайте ясный, сухой
    день — летом дымка над низменностью часто скрывает побережье — и приезжайте утром или к вечеру, когда
    свет мягче ложится на камень. После сильного дождя последний подъём становится скользким, так что
    нужна обувь с хорошим сцеплением.
  route: >-
    Из Тбилиси по S1 (E60) на запад, через Гори, Хашури, Зестафони и Кутаиси, до кольца у Самтредиа —
    около 247 км. Поверните на юг на S12 в сторону Ланчхути и через четыре-пять километров, у Дапнари,
    съезжайте на сельские дороги, ведущие через Гамочинебули к подножию холма — всего около 263 км и около
    четырёх с четвертью часов. Основные дороги асфальтированы; последний подъём протяжённостью около километра
    — грунтовый, и региональное туристическое управление рекомендует полноприводный автомобиль. Если вы
    на обычной машине, оставьте её в селе и поднимитесь пешком. Заправиться легче в Самтредиа.
fa:
  name: صومعه‌ی گئورگیوس قدیس در زاندو
  short: >-
    کلیسایی کوچک و بی‌گنبد از سال ۱۵۱۹ بر تپه‌ای پوشیده از فندق، در جنوب سامتردیا — در روزهای صاف از اینجا
    دریاچه پالیاستومی و پوتی نیز دیده می‌شود.
  body: >-
    **روایت است که این تپه در ابتدا ساندو، یعنی «آنکه قابل‌اعتماد است»، نام داشت، زیرا در روزهای دشوار
    مردم را به‌خوبی پنهان می‌کرد؛ با گذر سال‌ها این نام به زاندو ساده شد.** روستای زیر آن — که تا سال
    ۲۰۰۷ دو روستای زمو و کوئمو آباشا بود — امروز گاموچینه‌بولی، یعنی «آنکه در دیدرس است»، نامیده می‌شود،
    و صومعه بر بلندی به همین دلیل همان نام را دارد: از اینجا چشم تا دوردست‌ها می‌رود.


    کلیسای گئورگیوس قدیس، کوچک و بی‌گنبد، از سنگ تراش‌خورده ساخته شده و به سال ۱۵۱۹ بازمی‌گردد و در بیشه‌ای
    از فندق و چنار بر یکی از شاخه‌های رشته‌کوه گوریا برپاست. در غرب آن ناقوس‌خانه‌ای دو طبقه از سنگ و
    ساروج بالا می‌رود. بر بالای در شرقی آن کتیبه‌ای به خط گرجی بود: در سال ۱۸۵۶، «به یادبود روان گیگو
    کالویانی و والدینش»، نجیب‌زاده اوتیا کالویانی سه تومان برای ساخت ناقوس‌خانه بخشید.


    در دهه‌ی ۱۷۸۰، پس از آنکه عثمانی‌ها اسقف‌نشین خینوتسمیندا را برانداختند، کرسی آن به اینجا پناه آورد،
    همراه با اسقف تبعیدی یووانه. شمایلی زرین از مریم مقدس (مادر خدا) نیز از خینوتسمیندا به اینجا آورده
    شد که در سال ۱۹۰۴ از کلیسا دزدیده شد. خواننده اپرا پیلیمون کوریدزه، که سرود کلیسایی گرجی را به نت
    موسیقی درآورد، در همین روستا زاده شد.


    رسمی کهن عید پاک در اینجا ثبت شده است. در جمعه‌ی مقدس، مردی از خاندان تارگامادزه صلیب-پرچمی مرصع به
    نقره را در روستا می‌گرداند و مردم به دلخواه نذر می‌دادند؛ با پول گردآمده گوسفندی می‌خریدند که پس از
    عبادت صبح عید، بریان و به خاندان کالویانی پیشکش می‌شد. آن‌ها شانه‌ها را برمی‌داشتند، سپس فرا می‌خواندند
    که پیشکش آماده است، و باقی را میان همه تقسیم می‌کردند.


    در روشن‌ترین روزها، چشم از کوه‌های باخمارو و کوهستان گوریا تا درخشش دریاچه پالیاستومی و فانوس دریایی
    پوتی می‌رسد.
  tip: >-
    صومعه معمولاً از ساعت ۱۰:۰۰ تا ۱۷:۰۰ باز است. همان‌گونه بپوشید که در هر صومعه‌ی گرجی شایسته است: شانه‌ها
    و زانوها پوشیده، برای زنان روسری، و صدا آرام، به‌ویژه هنگام عبادت. روی بلندی امیدی به خرید چیزی نداشته
    باشید؛ آب همراه ببرید. برای دید دوردست به پالیاستومی و پوتی، روزی صاف و خشک برگزینید — در تابستان
    غبار دشت اغلب ساحل را پنهان می‌کند — و صبح یا اواخر بعدازظهر بیایید، وقتی نور بر سنگ مهربان‌تر است.
    پس از باران شدید، آخرین صعود لغزنده می‌شود، پس کفشی با کف غیرلغزنده بپوشید.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از گوری، خاشوری، زستافونی و کوتائیسی، تا میدان سامتردیا برانید —
    حدود ۲۴۷ کیلومتر. به جنوب بپیچید و وارد S12 به‌سوی لانچخوتی شوید و پس از چهار تا پنج کیلومتر، نزدیک
    داپناری، به راه‌های روستایی که از میان گاموچینه‌بولی به دامنه‌ی تپه می‌رسند بپیچید — در مجموع نزدیک
    به ۲۶۳ کیلومتر و نزدیک به چهار ساعت و ربع. راه‌های اصلی آسفالته‌اند؛ صعود نهایی، نزدیک به یک کیلومتر،
    ناهموار است و اداره‌ی گردشگری منطقه خودرویی چهارچرخ‌محرک را توصیه می‌کند. با خودروی معمولی، آن را
    در روستا بگذارید و پیاده بالا بروید. سوخت‌گیری در سامتردیا آسان‌تر است.
he:
  name: מנזר גאורגיוס הקדוש בזנדו
  short: >-
    כנסייה קטנה וחסרת כיפה משנת 1519 על גבעה מיוערת באגוזי לוז מדרום לסמטרדיה — בימים צחים נראים משם גם
    אגם פליאסטומי ופוטי.
  body: >-
    **המסורת מספרת שהגבעה הזו נקראה בתחילה סנדו, 'הנאמן', כי בעתות קושי היטיבה להסתיר אנשים; עם השנים
    השם נשחק לזנדו.** הכפר שלמרגלותיה — עד 2007 שני כפרים, זמו וקוומו אבאשה — נקרא כיום גמוצ'ינבולי, 'הנראה
    בבירור', והמנזר על הגבעה נושא את השם הזה מהסיבה עצמה: מכאן העין נודדת רחוק.


    כנסיית גאורגיוס הקדוש קטנה וחסרת כיפה, בנויה מאבן מסותתת ומתוארכת ל-1519, ועומדת בסבך של אגוזי לוז
    ודולבים על אחת משלוחות רכס גוריה. ממערב לה מתנשא מגדל פעמונים דו-קומתי מאבן וסיד. מעל דלתה המזרחית
    הייתה כתובת בכתב גאורגי: ב-1856, "לזכר נשמות גיגו קלויאני והוריו", תרם האציל אוטיה קלויאני שלושה טומאן
    לבניית המגדל.


    בשנות ה-1780, לאחר שהעות'מאנים חיסלו את הבישופות של חינוצמינדה, מצא כס הבישופות מחסה כאן, עם הבישוף
    המגורש יואנה. איקונת זהב של הבתולה הובאה גם היא מחינוצמינדה; היא נגנבה מהכנסייה ב-1904. בכפר נולד
    הזמר האופראי פילימון קורידזה, שתיעד את הזמרה הכנסייתית הגאורגית בתווים.


    מנהג פסחא עתיק מתועד כאן. ביום שישי הטוב נשא איש ממשפחת טרגמדזה צלב-דגל מצופה כסף בכפר, והתושבים תרמו
    כרצונם; בכסף שנאסף נקנה כבש, שאחרי מיסת הבוקר של הפסחא נצלה והוגש למשפחת קלויאני. הם נטלו את הכתפיים,
    ואז הכריזו שהקרבן מוכן, וחלקו את השאר בין כולם.


    בימים הצחים ביותר נודדת העין מהרי בחמארו ומהרי גוריה עד לניצוץ אגם פליאסטומי ומגדלור פוטי.
  tip: >-
    המנזר פתוח בדרך כלל מ-10:00 עד 17:00. התלבשו כמו בכל מנזר גאורגי: כתפיים וברכיים מכוסות, מטפחת ראש
    לנשים, וקול נמוך, בייחוד בזמן תפילות. אל תסמכו על קניית משהו על הגבעה; הביאו מים. לנוף המרוחק לפליאסטומי
    ופוטי, בחרו יום צח ויבש — בקיץ הערפל שמעל המישור מסתיר לעיתים קרובות את החוף — ובואו בבוקר או בשעות
    אחר הצהריים המאוחרות, כשהאור עדין יותר על האבן. אחרי גשם חזק השביל האחרון בעלייה מחליק, אז חשוב לנעול
    נעליים עם אחיזה טובה.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי, חשורי, זסטפוני וקוטאיסי, עד מעגל התנועה של סמטרדיה — כ-247
    ק"מ. פנו דרומה ל-S12 לכיוון לנצ'חוטי, ואחרי כארבעה-חמישה קילומטרים, בדפנארי, פנו לדרכי הכפר הפונות
    דרומה דרך גמוצ'ינבולי עד רגלי הגבעה — כ-263 ק"מ בסך הכול וכארבע שעות ורבע. הכבישים הראשיים אספלט;
    העלייה האחרונה, כקילומטר, לא סלולה, ומשרד התיירות האזורי ממליץ על רכב שטח. ברכב רגיל השאירו אותו בכפר
    וטפסו ברגל. תדלוק קל יותר בסמטרדיה.
ar:
  name: دير زاندو للقديس جورج
  short: >-
    كنيسة صغيرة بلا قبة من عام 1519 على تلة مغطاة بشجيرات البندق جنوب سمتريديا — في الأيام الصافية تُرى
    من هنا بحيرة بالياستومي وبوتي أيضًا.
  body: >-
    **تقول الرواية إن هذه التلة سُمّيت في البداية ساندو، أي «الجدير بالثقة»، لأنها كانت تُخفي الناس جيدًا
    في الأزمات؛ ومع مرور السنين تحوّل الاسم إلى زاندو.** القرية الواقعة أسفلها — التي كانت حتى عام 2007
    قريتين، زيمو وكفيمو آباشا — تُسمّى اليوم غاموتشينيبولي، أي «المرئي بوضوح»، والدير على التلة يحمل الاسم
    نفسه للسبب نفسه: من هنا تمتد الرؤية بعيدًا.


    كنيسة القديس جورج صغيرة وبلا قبة، بُنيت من حجر منحوت وتعود إلى عام 1519، وتقف وسط غابة من شجيرات البندق
    والدلب على أحد متفرّعات سلسلة غوريا. وإلى الغرب منها ينتصب برج جرس من طبقتين مبني بالحجر والجير. وكانت
    فوق بابها الشرقي كتابة بالخط الجورجي: في عام 1856، «تخليدًا لأرواح غيغو كالوياني ووالديه»، تبرّع النبيل
    أوتيا كالوياني بثلاثة تومانات لبناء البرج.


    في ثمانينيات القرن الثامن عشر، بعد أن ألغى العثمانيون أسقفية خينوتسميندا، لجأ كرسيّها إلى هنا مع الأسقف
    المنفي يوآنه. وجُلبت أيضًا من خينوتسميندا أيقونة ذهبية للعذراء، وقد سُرقت من الكنيسة عام 1904. وفي
    القرية وُلد المغني الأوبرالي بيليمون كوريدزه، الذي دوّن الترتيل الكنسي الجورجي بالنوتة الموسيقية.


    ثمة عادة قديمة لعيد الفصح مسجّلة هنا. في الجمعة العظيمة كان رجل من عائلة تارغامادزه يحمل صليبًا-رايةً
    ملبّسًا بالفضة في القرية، ويتبرّع الناس عن طيب خاطر؛ وبالمال المجموع كانوا يشترون خروفًا، يُشوى بعد
    قداس صباح الفصح ويُقدَّم إلى عائلة كالوياني. فكان آل كالوياني يأخذون الكتفين، ثم ينادون أن القربان
    جاهز، ويقتسمون الباقي بين الجميع.


    في أصفى الأيام تمتد الرؤية من جبال باخمارو ومرتفعات غوريا حتى وميض بحيرة بالياستومي ومنارة بوتي.
  tip: >-
    الدير مفتوح عادة من الساعة 10:00 حتى 17:00. الْبَس كما تفعل في أي دير جورجي: الأكتاف والركب مغطاة،
    وشاح للرأس للنساء، وأصوات خافتة، خصوصًا أثناء القداس. لا تعتمد على شراء أي شيء فوق التلة؛ احمل الماء.
    للمشهد البعيد نحو بالياستومي وبوتي، اختر يومًا صافيًا وجافًا — في الصيف يحجب ضباب السهل الساحل غالبًا
    — وتعالَ في الصباح أو أواخر بعد الظهر، حين يكون الضوء ألطف على الحجر. بعد مطر غزير يصبح الصعود الأخير
    زلقًا، فارتدِ حذاءً ذا قبضة جيدة.
  route: >-
    من تبليسي خذ S1 (E60) غربًا عبر غوري وخاشوري وزيستافوني وكوتايسي إلى دوّار سمتريديا — نحو 247 كم.
    اتجه جنوبًا على S12 نحو لانتشخوتي، وبعد أربعة أو خمسة كيلومترات، عند دابناري، انعطف إلى طرق القرية
    التي تمتد جنوبًا عبر غاموتشينيبولي إلى سفح التلة — نحو 263 كم إجمالًا ونحو أربع ساعات وربع. الطرق
    الرئيسية مُعبّدة؛ الصعود الأخير، نحو كيلومتر واحد، غير مُعبّد، ومكتب السياحة الإقليمي يوصي بسيارة
    دفع رباعي. وإن كنت بسيارة اقتصادية فاتركها في القرية واصعد سيرًا. الوقود أسهل في سمتريديا.
