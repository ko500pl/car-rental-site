ka:
  name: ქუთაისის მწვანე ბაზარი
  short: >-
    ქუთაისის ორსართულიანი ცენტრალური ბაზარი: ახალი იმერული ყველი, წონაზე გაყიდული უცხო სუნელი და ქარვის
    მძივებივით რიგად ჩამოკიდებული ჩურჩხელა.
  body: >-
    **მწვანე ბაზარი ის ადგილია, სადაც ქუთაისი თავის თავს ესაუბრება — ხმამაღლა, გულუხვად, ახალი ყველით
    სავსე დახლის გადაღმა.**


    XIX საუკუნის 30-იან წლებში აქ ფრანგულენოვანი ნატურალისტი ფრედერიკ დიუბუა დე მონპერე გაიარა და ქუთაისის
    ბაზარს ასე უწოდა: „ბაზარი, რომელიც, ისევე როგორც ათენში, ცხოვრებისა და მოძრაობის ცენტრია“. ბაზრობის
    დღეები მაშინ ოთხშაბათი და პარასკევი იყო და ხალხი აქ ყიდვაზე არანაკლებ ამბების გასაგებად, მისალმებისთვის
    და შორს მყოფი ახლობლებისთვის შეთვლილი სიტყვის გადასაცემად მოდიოდა. თითქმის ორი საუკუნის შემდეგ ვაჭრობა
    პალიაშვილის ქუჩასთან მდგარ ორსართულიან დახურულ შენობაში გადავიდა და მიმდებარე ქუჩებშიც გადმოიღვარა,
    საუბრის რიტმი კი იგივე დარჩა.


    შედით და სუნს მიჰყევით:


    - **იმერული ყველი** — ახალი, მარილიანი, სოფლებიდან ჩამოტანილი; ნაჭერს ჩვეულებრივ თხოვნამდე გაგასინჯებენ

    - **სუნელები წონით** — უცხო სუნელი, ხმელი ყვითელი ყვავილი, სვანური მარილი და აჯიკა

    - **ჩურჩხელა და ტყლაპი** — თათარაში ამოვლებული კაკალი და მჟავე ხილის თხელი ფენები

    - **მწვანილი, სოკო, თაფლი და სოფლის ღვინო** — სეზონის მიხედვით


    ბაზარს სიკეთის ხსოვნაც დიდი აქვს. XX საუკუნის 40-იან წლებში პატარა ერემია სვანაძე, შემდგომში მსახიობი,
    მამასთან ერთად ბაზარში მივიდა და შენიშნა, რომ მწვანილით მოვაჭრენი მყიდველებს ერთსა და იმავე ქალთან
    აგზავნიდნენ. მამამ აუხსნა: ქალი დაქვრივებული იყო და ბავშვს ელოდებოდა, და დანარჩენები ცდილობდნენ, რაც
    შეიძლება მეტი გაეყიდა, სანამ მუშაობას შეძლებდა.


    აი, ეს არის აქაური ნამდვილი ვალუტა. ცოტა ივაჭრეთ, გასინჯეთ, რასაც გთავაზობენ, იყიდეთ იმისგან, ვინც
    გაგასინჯათ — და ნება მიეცით ვინმეს, ისეთი ყველი შემოგასაღოთ, რომლის ყიდვასაც სულაც არ აპირებდით.
  tip: >-
    დილით მოდით, როცა პროდუქტი ყველაზე ახალია და რიგებში ყველაზე მეტი ხმაურია; ნაშუადღევს ბევრი დახლი
    იკეცება. ნაღდი ფული წვრილ კუპიურებად იქონიეთ — მოვაჭრეთა უმეტესობა ბარათს არ იღებს. გასინჯვა რიტუალის
    ნაწილია, მაგრამ ზრდილობა მოითხოვს, იმისგან იყიდოთ, ვინც გაგასინჯათ. ხმელი სუნელი და ჩურჩხელა ჩემოდანში
    კარგად ძლებს; სუნელი ჰერმეტულ პარკში ჩადეთ, ყველი კი გამაგრილებელ ჩანთაში. ხალხმრავალ რიგებში ჯიბეებს
    მიხედეთ. ბაგრატის ტაძარი, ძველი ებრაული უბანი და ბოტანიკური ბაღი კილომეტრის რადიუსშია, ასე რომ, ერთი
    სადგომიდან ყველაფერს ფეხით მოივლით.
  route: >-
    თბილისიდან S1 (E60) ავტომაგისტრალი რიკოთის გვირაბის გავლით პირდაპირ ქუთაისამდე მიდის — დაახლოებით
    230 კილომეტრი, სამ საათზე ცოტა მეტი. ქალაქში შესვლისას ცენტრის მაჩვენებლებს მიჰყევით; ბაზარი ცენტრალური
    მოედნიდან ფეხით რამდენიმე წუთის სავალზეა, პალიაშვილის ქუჩასთან. საწვავი გზაში, ხაშურში ან ზესტაფონში
    ჩაასხით. მარშრუტი მთლიანად ასფალტიანია და ეკონომკლასის ავტომობილიც სრულიად საკმარისია. მანქანის პირდაპირ
    ბაზართან გაჩერებას ნუ ეცდებით: ირგვლივ ქუჩები ვიწრო და გადატვირთულია, ორი-სამი კვარტლით მოშორებით
    ნაპოვნი ადგილი კი ოცი წუთის ტყუილუბრალო ტრიალს აგარიდებთ.
en:
  name: Kutaisi Green Bazaar
  short: >-
    Kutaisi's two-storey central market: young Imeretian cheese, blue fenugreek by the scoop and churchkhela
    hanging in rows like strings of amber beads.
  body: >-
    **The Green Bazaar is Kutaisi talking to itself — loudly, generously, across a counter of fresh cheese.**


    In the 1830s the French-speaking naturalist Frédéric Dubois de Montperreux passed through and called
    it “a bazaar which, just like in Athens, is the central point of life and movement.” Market days then
    were Wednesday and Friday, and people came as much for news, greetings and messages to absent relatives
    as for anything they meant to buy. Nearly two centuries on, the trading has moved into a two-storey
    covered hall off Paliashvili Street and overflowed into the lanes around it, but the talk has not
    changed its tempo.


    Walk in and follow your nose:


    - **Imeretian cheese** — young, salty, brought in from the villages; a sliver is usually offered before
    you ask

    - **Spices by weight** — utskho suneli (blue fenugreek), dried marigold petals, Svan salt and adjika

    - **Churchkhela and tklapi** — walnuts dipped in thickened grape must, and sheets of sour fruit leather

    - **Herbs, mushrooms, honey and village wine**, changing with the season


    The bazaar has a long memory for kindness, too. In the 1940s a boy named Eremia Svanadze, later an
    actor, went to the market with his father and noticed that the herb sellers kept sending their customers
    to one particular woman. His father explained: she had lost her husband and was expecting a child,
    and the others were making sure she sold what she could while she was still able to work.


    That is the real currency here. Haggle a little, taste what you are offered, buy from the person who
    fed you — and let someone talk you into a cheese you had no intention of buying.
  tip: >-
    Come in the morning, when the produce is freshest and the aisles are at their noisiest; by mid-afternoon
    many stalls pack up. Carry cash in small notes — most sellers do not take cards. Tasting is part of
    the ritual, but it is good manners to buy from whoever gave you a taste. Dried spices and churchkhela
    survive a suitcase well; seal spices in a zip bag, and keep cheese in a cool bag. Watch your pockets
    in the crowded rows. Bagrati Cathedral, the old Jewish quarter and the botanical garden are all within
    a kilometre, so one parking spot covers the lot.
  route: >-
    From Tbilisi the S1 (E60) motorway runs west through the Rikoti tunnel to Kutaisi — about 230 km,
    a little over three hours. Entering the city, follow signs for the centre; the bazaar lies a short
    walk from the central square, off Paliashvili Street. Refuel on the way in Khashuri or Zestafoni.
    The whole route is asphalt and an economy car is all you need. Do not try to park beside the market
    itself: the surrounding streets are narrow and jammed, and a space two or three blocks away will save
    you twenty minutes of circling.
ru:
  name: Зелёный базар Кутаиси
  short: >-
    Двухэтажный центральный рынок Кутаиси: молодой имеретинский сыр, синий пажитник на развес и чурчхела,
    свисающая рядами, как нити янтарных бус.
  body: >-
    **Зелёный базар — это Кутаиси, разговаривающий сам с собой: громко, щедро, через прилавок со свежим
    сыром.**


    В 1830-х годах здесь проезжал франкоязычный натуралист Фредерик Дюбуа де Монпере и назвал его «базаром,
    который, как и в Афинах, служит главной точкой жизни и движения». Тогда рыночными днями были среда
    и пятница, и люди приходили сюда не меньше за новостями, приветствиями и весточками для дальней родни,
    чем за покупками. Почти два века спустя торговля переместилась в двухэтажный крытый павильон возле
    улицы Палиашвили и растеклась по соседним переулкам, но темп разговоров не изменился ни на йоту.


    Зайдите и идите на запах:


    - **Имеретинский сыр** — молодой, солоноватый, привезённый прямо из деревень; кусочек обычно предлагают
    ещё до того, как вы спросите

    - **Специи на вес** — уцхо-сунели (синий пажитник), сушёные лепестки бархатцев, сванская соль и аджика

    - **Чурчхела и тклапи** — грецкие орехи, окунутые в загущенное виноградное сусло, и листы кислой фруктовой
    пастилы

    - **Зелень, грибы, мёд и домашнее вино**, меняющиеся по сезону


    Базар помнит доброту надолго. В 1940-х мальчик по имени Еремия Сванадзе, позже актёр, пришёл на рынок
    с отцом и заметил, что торговцы зеленью постоянно отправляли покупателей к одной и той же женщине.
    Отец объяснил: она потеряла мужа и ждала ребёнка, и остальные старались, чтобы она успела продать
    всё, что могла, пока ещё была в силах работать.


    Вот она, настоящая здешняя валюта. Немного поторгуйтесь, попробуйте то, что вам предложат, купите
    у того, кто вас накормил — и позвольте кому-нибудь убедить вас взять сыр, который вы совсем не собирались
    покупать.
  tip: >-
    Приходите утром, когда продукты самые свежие, а ряды — самые шумные; к середине дня многие лавки уже
    закрываются. Возьмите наличные мелкими купюрами — большинство продавцов карты не принимают. Пробовать
    товар — часть здешнего ритуала, но хорошим тоном будет купить хоть немного у того, кто вас угостил.
    Сушёные специи и чурчхела хорошо переносят чемодан; специи упакуйте в пакет с застёжкой, а сыр держите
    в сумке-холодильнике. Следите за карманами в тесных рядах. Собор Баграти, старый еврейский квартал
    и ботанический сад — все в пределах километра, так что, припарковавшись один раз, всё обойдёте пешком.
  route: >-
    Из Тбилиси автомагистраль S1 (E60) идёт на запад через Рикотский тоннель до Кутаиси — около 230 км,
    чуть больше трёх часов. При въезде в город следуйте указателям на центр; базар находится в паре минут
    ходьбы от центральной площади, у улицы Палиашвили. Заправляйтесь по дороге в Хашури или Зестафони.
    Весь маршрут асфальтирован, достаточно автомобиля эконом-класса. Не пытайтесь парковаться прямо у
    рынка: соседние улицы узкие и забиты машинами, а место в паре кварталов сэкономит вам двадцать минут
    кружения.
fa:
  name: بازار سبز کوتایسی
  short: >-
    بازار مرکزی دوطبقه‌ی کوتایسی: پنیر تازه‌ی ایمرتی، شنبلیله‌ی آبی به‌پیمانه، و چورچخلا آویخته در ردیف‌هایی
    چون رشته‌های مهره‌ی کهربایی.
  body: >-
    **بازار سبز، کوتایسی است که با خودش سخن می‌گوید — بلند، بخشنده، آن سوی پیشخوانی پر از پنیر تازه.**


    در دهه‌ی ۱۸۳۰ طبیعی‌دان فرانسه‌زبان فردریک دوبوا دو مونپرو از اینجا گذشت و آن را «بازاری که، درست
    همچون آتن، کانون زندگی و جنب‌وجوش است» خواند. روزهای بازار در آن زمان چهارشنبه و جمعه بود، و مردم
    به همان اندازه برای خبر، احوال‌پرسی و پیام برای خانواده‌ی دور می‌آمدند که برای خریدن چیزی. نزدیک به
    دو سده بعد، داد و ستد به تالاری سرپوشیده و دوطبقه در نزدیکی خیابان پالیاشویلی منتقل شده و به کوچه‌های
    اطراف سرریز کرده، اما آهنگ گفت‌وگو تغییری نکرده است.


    قدم بگذارید و بو را دنبال کنید:


    - **پنیر ایمرتی** — تازه، نمکین، آورده‌شده از روستاها؛ معمولاً پیش از آنکه بخواهید، تکه‌ای به شما
    پیشکش می‌شود

    - **ادویه به وزن** — اوتسخو سونلی (شنبلیله‌ی آبی)، گلبرگ‌های خشک همیشه‌بهار، نمک سوانی و آجیکا

    - **چورچخلا و تکلاپی** — گردوهایی که در شیره‌ی غلیظ انگور غوطه داده شده‌اند، و ورقه‌های برگه‌ی میوه‌ی
    ترش

    - **سبزی‌های معطر، قارچ، عسل و شراب روستایی**، که با فصل تغییر می‌کنند


    بازار حافظه‌ی درازی نیز برای مهربانی دارد. در دهه‌ی ۱۹۴۰ پسری به نام ارمیا سوانادزه، که بعدها بازیگر
    شد، همراه پدرش به بازار رفت و دید سبزی‌فروشان همیشه مشتریان را به سوی یک زن معین می‌فرستند. پدرش توضیح
    داد: او همسرش را از دست داده بود و منتظر فرزندی بود، و دیگران مراقب بودند که او تا زمانی که هنوز می‌تواند
    کار کند، هرچه دارد بفروشد.


    این همان پول رایج واقعی اینجاست. کمی چک‌وچانه بزنید، از آنچه به شما پیشکش می‌شود بچشید، از کسی بخرید
    که به شما چشانده — و بگذارید کسی شما را به خریدن پنیری که قصدش را نداشتید ترغیب کند.
  tip: >-
    صبح بیایید، وقتی که محصولات تازه‌ترین‌اند و راهروها پرهیاهوترین؛ تا اواسط بعدازظهر بسیاری از غرفه‌ها
    جمع می‌شوند. پول نقد با اسکناس‌های کوچک همراه داشته باشید — بیشتر فروشندگان کارت نمی‌پذیرند. چشیدن
    بخشی از آیین اینجاست، اما ادب حکم می‌کند از کسی که به شما چشاند، چیزی بخرید. ادویه‌های خشک و چورچخلا
    سفر در چمدان را خوب تاب می‌آورند؛ ادویه را در کیسه‌ی زیپی و پنیر را در کیف خنک‌نگهدار قرار دهید. در
    راهروهای پرازدحام مراقب جیب‌هایتان باشید. کلیسای جامع باگراتی، محله‌ی قدیمی یهودیان و باغ گیاه‌شناسی
    همگی در فاصله‌ی یک کیلومتری‌اند، پس یک جای پارک برای همه‌شان کافی است.
  route: >-
    از تفلیس، بزرگراه S1 (E60) به سوی غرب از میان تونل ریکوتی تا کوتایسی می‌رود — حدود ۲۳۰ کیلومتر، کمی
    بیش از سه ساعت. هنگام ورود به شهر، تابلوهای مرکز شهر را دنبال کنید؛ بازار چند دقیقه پیاده تا میدان
    مرکزی فاصله دارد، در نزدیکی خیابان پالیاشویلی. در راه، در خاشوری یا زستافونی سوخت‌گیری کنید. تمام
    مسیر آسفالت است و یک خودروی اقتصادی کافی است. سعی نکنید دقیقاً کنار بازار پارک کنید: خیابان‌های اطراف
    تنگ و پرازدحام‌اند، و جایی دو یا سه بلوک دورتر شما را از بیست دقیقه دور زدن نجات می‌دهد.
he:
  name: השוק הירוק של קוטאיסי
  short: >-
    השוק המרכזי הדו-קומתי של קוטאיסי: גבינת אימרתי צעירה, חילבה כחולה שנמכרת בכף, וצ'ורצ'חלה תלויה בשורות
    כמחרוזות של חרוזי ענבר.
  body: >-
    **השוק הירוק הוא קוטאיסי המדברת עם עצמה — בקול רם, בנדיבות, מעל דוכן של גבינה טרייה.**


    בשנות ה-1830 עבר בו הטבען דובר הצרפתית פרדריק דובואה דה מונפרו וכינה אותו "שוק שהוא, בדיוק כמו באתונה,
    נקודת המרכז של החיים והתנועה". ימי השוק אז היו יום רביעי ויום שישי, ואנשים הגיעו לא פחות בשביל חדשות,
    ברכות והודעות לקרובים נעדרים מאשר בשביל דבר מה שהתכוונו לקנות. כמעט מאתיים שנה לאחר מכן, המסחר עבר
    לאולם מקורה בן שתי קומות סמוך לרחוב פליאשווילי, וגלש לסמטאות שמסביבו, אך קצב השיחה לא השתנה.


    היכנסו ועקבו אחרי הריח:


    - **גבינת אימרתי** — צעירה, מלוחה, מובאת ישירות מהכפרים; פרוסה מוצעת בדרך כלל לפני שאתם מבקשים

    - **תבלינים לפי משקל** — אוצחו סונלי (חילבה כחולה), עלי כותרת מיובשים של טגטס, מלח סוואני ואג'יקה

    - **צ'ורצ'חלה וטקלאפי** — אגוזי מלך שהוטבלו במיץ ענבים מעובה, ויריעות של רסק פירות חמוץ

    - **עשבי תיבול, פטריות, דבש ויין כפרי**, המשתנים לפי העונה


    לשוק יש גם זיכרון ארוך לחסד. בשנות ה-1940 ילד בשם ירמיה סוונדזה, שלימים נעשה שחקן, הגיע לשוק עם אביו
    והבחין שמוכרי עשבי התיבול מפנים תמיד את הלקוחות לאישה מסוימת אחת. אביו הסביר: היא איבדה את בעלה והייתה
    בהיריון, וכל האחרים דאגו שהיא תספיק למכור את מה שיש לה כל עוד היא מסוגלת לעבוד.


    זה המטבע האמיתי כאן. התמקחו קצת, טעמו ממה שמוצע לכם, קנו ממי שהאכיל אתכם — ותנו למישהו לשדל אתכם לקנות
    גבינה שלא תכננתם לקנות.
  tip: >-
    הגיעו בבוקר, כשהתוצרת הכי טרייה והמעברים הכי הומים; לקראת אמצע היום דוכנים רבים נסגרים. הביאו מזומן
    בשטרות קטנים — רוב המוכרים אינם מקבלים כרטיסים. הטעימה היא חלק מהטקס, אך מן הנימוס לקנות ממי שהעניק
    לכם טעימה. תבלינים מיובשים וצ'ורצ'חלה שורדים היטב במזוודה; אטמו תבלינים בשקית רוכסן, ושמרו גבינה בצידנית.
    שימו עין על הכיסים בשורות הצפופות. קתדרלת בגרטי, הרובע היהודי הישן והגן הבוטני נמצאים כולם בטווח של
    קילומטר, כך שאפשר לחנות פעם אחת ולהגיע לכולם ברגל.
  route: >-
    מטביליסי הכביש המהיר S1 (E60) עובר מערבה דרך מנהרת ריקותי עד קוטאיסי — כ-230 ק"מ, קצת יותר משלוש שעות.
    בכניסה לעיר, עקבו אחר השילוט למרכז; השוק נמצא בהליכה קצרה מהכיכר המרכזית, סמוך לרחוב פליאשווילי. תדלקו
    בדרך בחשורי או בזסטפוני. כל המסלול סלול ורכב אקונומי מספיק. אל תנסו לחנות ממש לצד השוק: הרחובות שמסביב
    צרים וצפופים, ומקום שני-שלושה רחובות משם יחסוך לכם עשרים דקות של סיבובים.
ar:
  name: السوق الأخضر في كوتايسي
  short: >-
    سوق كوتايسي المركزي المكوّن من طابقين: جبن إيميريتي الطازج، وحلبة زرقاء تُباع بالمكيال، وتشورتشخيلا
    معلّقة في صفوف كعقود الكهرمان.
  body: >-
    **السوق الأخضر هو كوتايسي تتحدث إلى نفسها — بصوت عالٍ وسخاء، عبر منضدة من الجبن الطازج.**


    في الثلاثينيات من القرن التاسع عشر، مرّ به عالم الطبيعة الفرنكوفوني فريدريك دوبوا دو مونبيرو ووصفه
    بأنه «سوق، تمامًا كما في أثينا، هو النقطة المركزية للحياة والحركة». كانت أيام السوق حينها الأربعاء
    والجمعة، وكان الناس يأتون لأجل الأخبار والتحيات والرسائل إلى الأقارب الغائبين بقدر ما يأتون لشراء
    شيء ما. بعد نحو قرنين، انتقلت التجارة إلى قاعة مسقوفة من طابقين قرب شارع بالياشفيلي وفاضت إلى الأزقة
    المحيطة، لكن وتيرة الحديث لم تتغيّر.


    ادخل واتّبع الرائحة:


    - **جبن إيميريتي** — طازج ومالح، يُجلب مباشرة من القرى؛ تُقدَّم لك شريحة منه عادةً قبل أن تطلبها

    - **بهارات تُباع بالوزن** — أوتسخو سونيلي (الحلبة الزرقاء)، بتلات القطيفة المجففة، والملح السفاني
    والأجيكا

    - **التشورتشخيلا والتكلابي** — جوز مغموس في عصير عنب مكثّف، وشرائح من رقائق الفاكهة الحامضة

    - **أعشاب عطرية وفطر وعسل ونبيذ قروي**، تتبدّل بحسب الفصل


    للسوق أيضًا ذاكرة طويلة للطيبة. في أربعينيات القرن العشرين، ذهب صبي يُدعى إرميا سفانادزه، الذي أصبح
    لاحقًا ممثلاً، إلى السوق مع والده ولاحظ أن بائعي الأعشاب كانوا دائمًا يوجّهون الزبائن إلى امرأة واحدة
    بعينها. فأوضح والده: إنها فقدت زوجها وكانت حاملاً، وكان الآخرون يتأكدون من أنها تبيع ما تستطيع بيعه
    ما دامت قادرة على العمل.


    تلك هي العملة الحقيقية هنا. ساوِم قليلاً، تذوّق ما يُقدَّم لك، اشترِ من الشخص الذي أطعمك — ودَع أحدهم
    يقنعك بشراء جبنة لم تكن تنوي شراءها.
  tip: >-
    تعال في الصباح، حين تكون المنتجات في أطرى حالاتها والممرات في أعلى ضجيجها؛ فبحلول منتصف بعد الظهر
    يُغلق كثير من الأكشاك. احمل نقودًا بأوراق فئات صغيرة — معظم البائعين لا يقبلون البطاقات. التذوّق جزء
    من الطقس، لكن من حسن الأدب أن تشتري ممّن قدّم لك ما تذوّقته. تتحمل البهارات المجففة والتشورتشخيلا
    السفر في الحقيبة جيدًا؛ ضع البهارات في كيس مُحكم الإغلاق، واحفظ الجبن في حقيبة تبريد. انتبه لجيوبك
    في الممرات المزدحمة. تقع كاتدرائية باغراتي والحيّ اليهودي القديم والحديقة النباتية جميعها ضمن كيلومتر
    واحد، فموقف سيارة واحد يكفيها كلها.
  route: >-
    من تبليسي، يمتد طريق S1 (E60) السريع غربًا عبر نفق ريكوتي إلى كوتايسي — نحو 230 كم، أي أكثر بقليل
    من ثلاث ساعات. عند دخول المدينة، اتبع لافتات وسط المدينة؛ يقع السوق على مسافة قصيرة سيرًا على الأقدام
    من الساحة المركزية، قرب شارع بالياشفيلي. تزوّد بالوقود في الطريق في خاشوري أو زيستافوني. الطريق كله
    مُعبّد وتكفي سيارة اقتصادية. لا تحاول أن توقف السيارة مباشرة عند السوق: الشوارع المحيطة ضيقة ومزدحمة،
    وموقف على بُعد شارعين أو ثلاثة سيوفّر عليك عشرين دقيقة من الدوران.
