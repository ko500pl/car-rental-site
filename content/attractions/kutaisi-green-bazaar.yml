ka:
  name: ქუთაისის მწვანე ბაზარი
  short: >-
    ქუთაისის ცენტრალური დახურული ბაზარი — იმერული ყველი, სუნელები, ჩურჩხელა და დასავლეთ საქართველოს ყველაზე
    ცოცხალი ვაჭრობა.
  body: >-
    **თუ გინდა გაიგო, რით ცხოვრობს იმერეთი, პირდაპირ მწვანე ბაზარში შედი.** ქუთაისის ცენტრალური ბაზარი
    პალიაშვილის ქუჩასთან საუკუნეების განმავლობაში ქალაქის გულად რჩება — XIX საუკუნის ფრანგი მოგზაური წერდა,
    რომ აქაური ბაზარი, ათენის მსგავსად, „ცხოვრებისა და მოძრაობის ცენტრიაო“. ორსართულიანი დახურული სივრცე
    და მის გარშემო გაშლილი რიგები დღემდე ისე მუშაობს, როგორც ყოველთვის.


    რას ეძებ დახლებზე:


    - **იმერული ყველი და სულგუნი** — დილით ჩამოტანილი, გასინჯვას თავად შემოგთავაზებენ

    - **სუნელები** — ხმელი სვანური მარილი, ყვითელი ყვავილი, უცხო სუნელი და აჯიკა წონით

    - **ჩურჩხელა და ტყლაპი** — კაკლითა და ბადაგით, ფაბრიკულზე შეუდარებლად უკეთესი

    - **მწვანილი, სოკო, თაფლი და გლეხური ღვინო** სეზონის მიხედვით


    ბაზარი დილაადრიან ცოცხლდება და ვაჭრობა ნაშუადღევს ნელდება. აქ ფასზე შეთანხმება ჯერ კიდევ საუბრის ნაწილია,
    გასინჯვა კი — სტუმართმოყვარეობის. გზად ბაგრატის ტაძრისკენ ეს ქალაქის ყველაზე გემრიელი გაჩერებაა.
  tip: >-
    ყველაზე ცოცხალი დროა დილის 9-დან შუადღემდე; ორშაბათს რიგები ნახევრად ცარიელია. ნაღდი ფული წამოიღე
    — ბარათს ყველგან არ იღებენ, ბანკომატი შესასვლელთანაა. გასინჯვა ბუნებრივია, მაგრამ იყიდე იმასთან, ვინც
    გაგასინჯა. ჩურჩხელა და სუნელები კარგად იტანს გზას და საუკეთესო სუვენირია. მანქანა ბაზრის პირდაპირ
    ნუ გააჩერებ — ვიწრო ქუჩები გადატვირთულია, ორიოდე კვარტლით მოშორებით ადგილი ყოველთვის იძებნება.
  route: >-
    თბილისიდან E60 (S1) ავტომაგისტრალით დასავლეთისკენ ქუთაისამდე დაახლოებით 230 კილომეტრია — რიკოთის გვირაბის
    გავლით სამ საათამდე მოკლდება. ქალაქში შესვლისას ცენტრს, რიონის ხიდებს მიჰყევი; ბაზარი ცენტრალურ მოედანთან
    ახლოსაა. საწვავი გზაზე ხაშურში ან ზესტაფონში აიღე. მთელი მარშრუტი ასფალტიანია და ეკონომ-კლასის ავტომობილი
    იდეალურად ეყოფა; ქუთაისში პარკინგისთვის ცოტა მოთმინება დაგჭირდება.
en:
  name: Kutaisi Green Bazaar
  short: >-
    Kutaisi's covered central market — Imeretian cheese, spices, churchkhela and the liveliest trading
    floor in western Georgia.
  body: >-
    **If you want to know what makes Imereti tick, walk straight into the Green Bazaar.** Kutaisi's central
    market off Paliashvili Street has been the city's beating heart for centuries — a 19th-century French
    traveller wrote that the bazaar here, like in Athens, was "the central point of life and movement".
    The two-storey covered hall and the rows spilling around it still work exactly as they always have.


    What to hunt for at the stalls:


    - **Imeretian cheese and sulguni** — brought in that morning; tastings are offered before you ask

    - **Spices** — Svan salt, blue fenugreek, utskho suneli and adjika sold by weight

    - **Churchkhela and tklapi** — walnut strings and fruit leather, incomparably better than factory
    versions

    - **Herbs, mushrooms, honey and farmhouse wine**, rotating with the seasons


    The market wakes early and trade slows after midday. Agreeing on a price is still part of the conversation
    here, and tasting is part of the hospitality. On your way to Bagrati Cathedral, this is the tastiest
    stop in the city.
  tip: >-
    The liveliest window is 9 am to noon; on Mondays many rows stand half empty. Bring cash — cards are
    not accepted everywhere, and there is an ATM by the entrance. Tasting is natural, but buy from the
    person who fed you. Churchkhela and spices travel well and make the best souvenirs. Do not try to
    park right outside — the narrow streets are jammed; a spot two blocks away is always easier.
  route: >-
    From Tbilisi the E60 (S1) motorway runs west to Kutaisi, about 230 km — with the Rikoti tunnel the
    trip now takes around three hours. Entering the city, follow signs for the centre and the Rioni bridges;
    the bazaar sits close to the central square. Refuel en route in Khashuri or Zestafoni. The whole route
    is asphalt and an economy car is perfectly adequate; just budget a little patience for parking in
    central Kutaisi.
ru:
  name: Зелёный базар Кутаиси
  short: Крытый центральный рынок Кутаиси — имеретинский сыр, специи, чурчхела и самая живая торговля
    западной Грузии.
  body: >-
    **Хотите понять, чем живёт Имеретия, — заходите прямо на Зелёный базар.** Центральный рынок Кутаиси
    у улицы Палиашвили веками остаётся сердцем города: французский путешественник XIX века писал, что
    здешний базар, как в Афинах, — "центральная точка жизни и движения". Двухэтажный крытый корпус и ряды
    вокруг него работают так же, как и всегда.


    За чем охотиться на прилавках:


    - **Имеретинский сыр и сулугуни** — привезённые этим утром; попробовать предложат раньше, чем спросите

    - **Специи** — сванская соль, голубой пажитник, уцхо-сунели и аджика на развес

    - **Чурчхела и тклапи** — ореховые связки и фруктовая пастила, несравнимо лучше фабричных

    - **Зелень, грибы, мёд и крестьянское вино** — по сезону


    Рынок просыпается рано, после полудня торговля стихает. Сговориться о цене здесь до сих пор часть
    разговора, а дегустация — часть гостеприимства. По дороге к храму Баграта это самая вкусная остановка
    в городе.
  tip: >-
    Самое живое время — с 9 утра до полудня; по понедельникам многие ряды полупусты. Возьмите наличные
    — карты принимают не везде, банкомат у входа. Пробовать — нормально, но покупайте у того, кто вас
    угостил. Чурчхела и специи хорошо переносят дорогу и остаются лучшим сувениром. Не пытайтесь встать
    прямо у входа — узкие улицы забиты; в паре кварталов место находится всегда.
  route: >-
    Из Тбилиси автомагистраль E60 (S1) ведёт на запад до Кутаиси, около 230 км — с Рикотским тоннелем
    дорога занимает теперь около трёх часов. Въезжая в город, держитесь указателей на центр и мосты через
    Риони; базар стоит рядом с центральной площадью. Заправляйтесь по пути в Хашури или Зестафони. Весь
    маршрут асфальтированный, машины эконом-класса более чем достаточно; немного терпения понадобится
    только для парковки в центре Кутаиси.
fa:
  name: بازار سبز کوتائیسی
  short: بازار مرکزی سرپوشیدهٔ کوتائیسی — پنیر ایمرتی، ادویه، چورچخلا و زنده‌ترین داد و ستد غرب گرجستان.
  body: >-
    **اگر می‌خواهید بدانید ایمرتی با چه نفس می‌کشد، یک‌راست وارد بازار سبز شوید.** بازار مرکزی کوتائیسی
    کنار خیابان پالیاشویلی قرن‌هاست قلب تپندهٔ شهر است — جهانگردی فرانسوی در قرن نوزدهم نوشت که بازار
    اینجا، همچون آتن، «نقطهٔ مرکزی زندگی و جنب‌وجوش» است. سالن سرپوشیدهٔ دوطبقه و ردیف‌های پیرامونش هنوز
    همان‌طور کار می‌کنند که همیشه.


    در بساط‌ها پی چه بگردید:


    - **پنیر ایمرتی و سولگونی** — همان صبح رسیده؛ پیش از آنکه بپرسید، چشیدن تعارف می‌شود

    - **ادویه‌ها** — نمک سوانی، شنبلیلهٔ آبی، اوتسخو سونلی و آجیکا به وزن

    - **چورچخلا و تکلاپی** — رشته‌های گردویی و لواشک میوه، بی‌قیاس بهتر از کارخانه‌ای

    - **سبزی، قارچ، عسل و شراب روستایی** به فراخور فصل


    بازار سحرخیز است و بعدازظهر داد و ستد فروکش می‌کند. اینجا چانه‌زدن هنوز بخشی از گفت‌وگوست و چشاندن،
    بخشی از مهمان‌نوازی. سر راه کلیسای باگراتی، این خوش‌مزه‌ترین توقف شهر است.
  tip: >-
    زنده‌ترین ساعت‌ها از 9 صبح تا ظهر است؛ دوشنبه‌ها بسیاری از ردیف‌ها نیمه‌خالی‌اند. پول نقد بیاورید
    — کارت همه‌جا پذیرفته نمی‌شود و عابربانک کنار ورودی است. چشیدن عادی است، اما از همان کسی بخرید که
    به شما چشاند. چورچخلا و ادویه راه را خوب تاب می‌آورند و بهترین سوغات‌اند. درست جلوی بازار پارک نکنید
    — کوچه‌های تنگ شلوغ‌اند؛ دو کوچه آن‌طرف‌تر همیشه جا پیدا می‌شود.
  route: >-
    از تفلیس آزادراه E60 (S1) به غرب تا کوتائیسی می‌رود، حدود 230 کیلومتر — با تونل ریکوتی سفر حالا حدود
    سه ساعت است. هنگام ورود به شهر، تابلوهای مرکز و پل‌های ریونی را دنبال کنید؛ بازار نزدیک میدان مرکزی
    است. در راه، در خاشوری یا زستافونی سوخت بزنید. تمام مسیر آسفالت است و خودروی اقتصادی کاملاً بس است؛
    فقط برای پارک در مرکز کوتائیسی کمی حوصله لازم دارید.
he:
  name: הבזאר הירוק של קוטאיסי
  short: השוק המרכזי המקורה של קוטאיסי — גבינה אימרתית, תבלינים, צ'ורצ'חלה והמסחר החי ביותר במערב גאורגיה.
  body: >-
    **אם אתם רוצים להבין ממה אימרתי חיה — היכנסו ישר לבזאר הירוק.** השוק המרכזי של קוטאיסי ליד רחוב פליאשווילי
    הוא לב העיר כבר מאות שנים: נוסע צרפתי מהמאה ה-19 כתב שהבזאר כאן, כמו באתונה, הוא "הנקודה המרכזית של
    החיים והתנועה". ההיכל המקורה בן שתי הקומות והשורות שנשפכות סביבו עובדים בדיוק כפי שעבדו תמיד.


    אחרי מה לצוד בדוכנים:


    - **גבינה אימרתית וסולגוני** — שהגיעו באותו בוקר; טעימה מוצעת עוד לפני שביקשתם

    - **תבלינים** — מלח סוואני, חילבה כחולה, אוצחו-סונלי ואג'יקה במשקל

    - **צ'ורצ'חלה וטקלאפי** — מחרוזות אגוזים ועלי פרי מיובשים, טובים לאין ערוך מהגרסאות התעשייתיות

    - **ירק, פטריות, דבש ויין איכרים** לפי העונה


    השוק מתעורר מוקדם, ואחרי הצהריים המסחר נרגע. לסגור מחיר זה עדיין חלק מהשיחה כאן, ולטעום — חלק מהכנסת
    האורחים. בדרך לקתדרלת בגרטי, זו העצירה הטעימה ביותר בעיר.
  tip: >-
    השעות החיות ביותר הן 9 עד צהריים; בימי שני שורות רבות עומדות חצי ריקות. הביאו מזומן — כרטיסים לא מתקבלים
    בכל מקום, ויש כספומט ליד הכניסה. לטעום זה טבעי, אבל קנו ממי שהאכיל אתכם. צ'ורצ'חלה ותבלינים שורדים
    את הדרך היטב והם המזכרת הטובה ביותר. אל תנסו לחנות ממש בכניסה — הרחובות הצרים פקוקים; שני רחובות משם
    תמיד קל יותר.
  route: >-
    מטביליסי כביש E60 (S1) מוביל מערבה עד קוטאיסי, כ-230 ק״מ — עם מנהרת ריקוטי הנסיעה אורכת כיום כשלוש
    שעות. בכניסה לעיר עקבו אחר השילוט למרכז ולגשרי הריוני; הבזאר שוכן סמוך לכיכר המרכזית. תדלקו בדרך בחשורי
    או בזסטפוני. כל המסלול סלול ורכב חסכוני מספיק בהחלט; רק לחניה במרכז קוטאיסי כדאי להקצות קצת סבלנות.
ar:
  name: بازار كوتايسي الأخضر
  short: سوق كوتايسي المركزي المسقوف — جبن إيميريتي والتوابل والتشورتشخيلا وأحيا تجارة في غرب جورجيا.
  body: >-
    **إن أردت أن تعرف بمَ تنبض إيميريتي، فادخل مباشرة إلى البازار الأخضر.** ظل سوق كوتايسي المركزي قرب
    شارع بالياشفيلي قلب المدينة النابض قروناً — كتب رحالة فرنسي في القرن التاسع عشر أن البازار هنا، كما
    في أثينا، «النقطة المركزية للحياة والحركة». وما زالت القاعة المسقوفة ذات الطابقين والصفوف المنسابة
    حولها تعمل كما كانت دائماً.


    عمّ تبحث بين البسطات:


    - **جبن إيميريتي والسولغوني** — وصل صباح اليوم نفسه؛ يُعرض عليك التذوق قبل أن تسأل

    - **التوابل** — ملح سفانيتي والحلبة الزرقاء وأوتسخو سونيلي والأجيكا بالوزن

    - **التشورتشخيلا والتكلابي** — عقود الجوز ورقائق الفاكهة المجففة، أفضل بما لا يقاس من نظيراتها المصنعية

    - **الأعشاب والفطر والعسل ونبيذ الفلاحين** بحسب الموسم


    يستيقظ السوق باكراً وتهدأ التجارة بعد الظهر. الاتفاق على السعر هنا ما زال جزءاً من الحديث، والتذوق
    جزءاً من الضيافة. وفي طريقك إلى كاتدرائية باغراتي، هذه ألذّ محطة في المدينة.
  tip: >-
    أنشط الأوقات من التاسعة صباحاً حتى الظهر؛ ويوم الاثنين تقف صفوف كثيرة نصف فارغة. أحضر نقوداً — البطاقات
    غير مقبولة في كل مكان، والصراف الآلي عند المدخل. التذوق طبيعي، لكن اشترِ ممن أطعمك. التشورتشخيلا والتوابل
    تتحمل السفر جيداً وهي أفضل الهدايا. لا تحاول الوقوف أمام السوق مباشرة — فالشوارع الضيقة مكتظة؛ وعلى
    بعد شارعين يوجد مكان دائماً.
  route: >-
    من تبليسي يمضي أوتوستراد E60 (S1) غرباً إلى كوتايسي، نحو 230 كم — ومع نفق ريكوتي صارت الرحلة نحو ثلاث
    ساعات. عند دخول المدينة اتبع لافتات الوسط وجسور نهر ريوني؛ فالبازار قريب من الساحة المركزية. تزود
    بالوقود في الطريق في خاشوري أو زيستافوني. الطريق كله معبّد وسيارة اقتصادية كافية تماماً؛ خصص فقط قليلاً
    من الصبر لركن السيارة في وسط كوتايسي.
