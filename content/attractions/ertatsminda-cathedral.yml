ka:
  name: ერთაწმინდის ტაძარი
  short: >-
    XIII საუკუნის გუმბათოვანი ტაძარი კასპის მუნიციპალიტეტში, მდიდარი ქვის კვეთით და გიორგი სააკაძის სახელთან
    დაკავშირებული საფლავით.
  body: >-
    **ერთაწმინდა ერთ-ერთი ყველაზე კარგად შენარჩუნებული XIII საუკუნის ტაძარია შიდა ქართლში** და სახელიც
    წმინდა ევსტათეს — ევსტატეწმინდას — ეწოდა, საიდანაც სოფლის სახელი მოდის. მთელი კომპლექსი კასპის სამხრეთით,
    ბორცვებში ჩამალულ სოფელში დგას, გალავანსა და ხეებს შორის.


    ეს არის დაგრძელებული პროპორციების ჯვარგუმბათოვანი ეკლესია. აღმოსავლეთ ფასადი ყველაზე მდიდარია: ორნამენტული
    ჯვარი, სარკმლის რთული ჩარჩო და გეომეტრიული ქსოვილი, რომელიც შუასაუკუნეების ქართული კვეთის საუკეთესო
    ტრადიციას მიჰყვება. გუმბათის ყელი მაღალია და თითქმის მთლიანად დეკორითაა დაფარული. სწორედ ეს პროპორცია
    — მაღალი, ვიწრო, აზიდული — განასხვავებს XIII საუკუნეს უფრო ადრეული, დაბალი და მძიმე ნაგებობებისგან.


    ტაძარი მრავალჯერ დაზიანდა და შეაკეთეს; XIX საუკუნეში სამრეკლო დაუმატეს და ინტერიერი შელესეს, ამიტომ
    შიგნით ძველი მოხატულობა თითქმის აღარ ჩანს. სამაგიეროდ სივრცე მაღალი და მშვიდია, სინათლე კი გუმბათიდან
    ეშვება.


    ერთაწმინდა ქართული მეხსიერების ერთ-ერთი კვანძია: ტრადიციით აქ არის დაკრძალული გიორგი სააკაძე, დიდი
    მოურავი — XVII საუკუნის სარდალი, რომელიც ჯერ სპარსელებთან იბრძოდა, შემდეგ მათ მიემხრო, ბოლოს კი ანატოლიაში
    სიკვდილით დასაჯეს. ამბობენ, რომ მისი ნეშტი 1629 წელს სამშობლოში დააბრუნეს და აქ დაასაფლავეს. დამადასტურებელი
    დოკუმენტი არ არსებობს, მაგრამ ქართველისთვის ეს ადგილი სწორედ ამიტომ არის მნიშვნელოვანი.
  tip: >-
    საათი სავსებით საკმარისია. ტაძარი მოქმედია და ჩვეულებრივ ღიაა, თუმცა თუ დაკეტილია, სოფელში კლიტის
    მცველს იპოვით — იკითხეთ ეზოებში. ჩაცმის წესები ჩვეულებრივია: თავსაფარი და გრძელი კაბა ქალებისთვის.
    გალავანში საფეხურები არათანაბარია და ბალახში ქვები იმალება. ტუალეტი და კაფე სოფელში არ არის, კასპში
    ან იგოეთის გზისპირზე გაჩერდით. ზამთარში სოფლის ქუჩები ლაფიანია.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით იგოეთამდე, დაახლოებით 40 კმ, შემდეგ სამხრეთით კასპი-ერთაწმინდის
    გზაზე გაუხვევთ. სულ 60 კმ, დაახლოებით საათი და ათი წუთი. მთელი მარშრუტი ასფალტია; ბოლო ოცი კილომეტრი
    ვიწრო სოფლის გზაა ხშირი მოსახვევებით და ზოგან ორმოებით, მაგრამ ეკონომ-კლასის მანქანისთვის პრობლემას
    არ ქმნის. საწვავი იგოეთში ან კასპში აიღეთ. ტაძართან პატარა მოედანია, სადაც მანქანის დატოვება უფასოა.
en:
  name: Ertatsminda Cathedral
  short: >-
    A 13th-century domed church south of Kaspi, richly carved outside and tied by tradition to the grave
    of Giorgi Saakadze.
  body: >-
    **Ertatsminda is one of the best-preserved 13th-century churches in Shida Kartli.** It is dedicated
    to Saint Eustace — Evstatetsminda in Georgian — and the village took its name from the church rather
    than the other way round. The whole complex sits inside a low wall among trees, in a village folded
    into the hills south of Kaspi.


    The building is a cross-in-square church with unusually elongated proportions. The east facade carries
    the richest work: an ornamental cross, an elaborate window surround, and a band of geometric interlace
    that belongs to the best tradition of medieval Georgian stone carving. The drum is tall and almost
    entirely covered in decoration. That verticality is precisely what separates the 13th century from
    the lower, heavier churches of three hundred years earlier.


    The church has been damaged and repaired many times. A bell tower was added in the 19th century and
    the interior was replastered then, so almost no old painting is visible inside. What remains is a
    high, calm volume with light falling from the drum.


    Ertatsminda also carries a piece of Georgian memory. Tradition holds that Giorgi Saakadze, the Great
    Mouravi, is buried here — the 17th-century commander who fought the Persians, then served them, then
    turned against them again, and was executed in Anatolia. His remains are said to have been brought
    home in 1629 and laid in this church. No document proves it, and historians treat the story carefully,
    but for Georgian visitors that is the reason the place matters.
  tip: >-
    An hour covers it. The church is in use and normally open; if the door is locked, the keyholder lives
    in the village and asking at a nearby gate usually works. Standard dress rules apply — a scarf and
    long skirt for women. The ground inside the enclosure is uneven and stones hide in the grass. There
    are no toilets or cafes in the village, so stop in Kaspi or at the roadside places near Igoeti. In
    winter the village lanes turn to mud.
  route: >-
    Take the E60 from Tbilisi towards Gori as far as Igoeti, about 40 km, then turn south on the Kaspi-Ertatsminda
    road. Sixty kilometres in total, roughly an hour and ten minutes. The whole route is asphalt; the
    last twenty kilometres are a narrow rural road with frequent bends and some potholes, but nothing
    an economy car cannot handle. Fuel is available at Igoeti or in Kaspi. There is a small square in
    front of the church where you can leave the car for nothing.
ru:
  name: Храм Эрцминда
  short: >-
    Купольный храм XIII века южнее Каспи, с богатой резьбой снаружи и с могилой, которую предание связывает
    с Георгием Саакадзе.
  body: >-
    **Эрцминда — один из лучше всего сохранившихся храмов XIII века в Шида-Картли.** Он посвящён святому
    Евстафию, по-грузински Эвстатецминда, и село получило имя от церкви, а не наоборот. Весь комплекс
    стоит внутри невысокой ограды среди деревьев, в селе, спрятанном в холмах южнее Каспи.


    Это крестово-купольный храм с необычно вытянутыми пропорциями. Богаче всего восточный фасад: орнаментальный
    крест, сложное обрамление окна и полоса геометрического плетения, принадлежащая лучшей традиции грузинской
    средневековой резьбы. Барабан высокий и почти целиком покрыт декором. Именно эта вертикальность отличает
    XIII век от более низких и тяжёлых храмов, построенных тремя столетиями раньше.


    Церковь много раз страдала и чинилась. В XIX веке к ней пристроили колокольню и заново оштукатурили
    интерьер, поэтому старой росписи внутри почти не видно. Остаётся высокий спокойный объём и свет, падающий
    из барабана.


    С Эрцминдой связан и узел грузинской памяти. Предание говорит, что здесь похоронен Георгий Саакадзе,
    Великий Моурави, — полководец XVII века, который сначала воевал с персами, потом служил им, потом
    снова восстал и был казнён в Анатолии. Считается, что его останки привезли на родину в 1629 году и
    положили в этом храме. Документального подтверждения нет, и историки осторожны, но для грузинского
    посетителя именно поэтому место и важно.
  tip: >-
    Часа хватит. Храм действующий и обычно открыт; если дверь заперта, ключ у жителя села — достаточно
    спросить у ближайших ворот. Правила одежды обычные: платок и длинная юбка для женщин. Земля внутри
    ограды неровная, в траве прячутся камни. Туалетов и кафе в селе нет, останавливайтесь в Каспи или
    у придорожных точек возле Игоети. Зимой сельские улицы раскисают.
  route: >-
    По E60 из Тбилиси в сторону Гори до Игоети, около 40 км, затем поворот на юг по дороге Каспи — Эрцминда.
    Всего 60 км, примерно час десять. Весь маршрут асфальтирован; последние двадцать километров — узкая
    сельская дорога с частыми поворотами и местами с ямами, но для машины эконом-класса это не проблема.
    Заправиться можно в Игоети или Каспи. Перед храмом небольшая площадка, оставить машину можно бесплатно.
fa:
  name: کلیسای جامع ارتاتسمیندا
  short: >-
    کلیسایی گنبددار از سدهٔ سیزدهم در جنوب کاسپی، با کنده‌کاری پرکار بیرونی و آرامگاهی که سنت آن را به
    گیورگی ساآکادزه نسبت می‌دهد.
  body: >-
    **ارتاتسمیندا از بهترین نمونه‌های برجای‌مانده از سدهٔ سیزدهم در شیدا کارتلی است.** کلیسا به نام قدیس
    اوستاتیوس است و روستا نام خود را از کلیسا گرفته، نه برعکس. کل مجموعه درون دیواری کوتاه و میان درختان
    قرار دارد، در روستایی که در تپه‌های جنوب کاسپی پنهان شده است.


    بنا کلیسایی چلیپایی با تناسبات به‌طرز غیرعادی کشیده است. نمای شرقی پرکارترین بخش است: صلیبی تزیینی،
    قاب پیچیدهٔ پنجره و نواری از گره‌های هندسی که به بهترین سنت کنده‌کاری سنگ گرجی در سده‌های میانه تعلق
    دارد. گردن گنبد بلند است و تقریباً یکسره پوشیده از تزیین. همین کشیدگی عمودی است که سدهٔ سیزدهم را
    از کلیساهای کوتاه‌تر و سنگین‌تر سه سده پیش از آن جدا می‌کند.


    کلیسا بارها آسیب دیده و مرمت شده است. در سدهٔ نوزدهم برج ناقوسی به آن افزودند و درون را دوباره گچ
    کردند، پس نقاشی کهن تقریباً دیده نمی‌شود. آنچه مانده حجمی بلند و آرام است و نوری که از گنبد فرو می‌ریزد.


    ارتاتسمیندا گرهی از حافظهٔ گرجی را نیز با خود دارد. سنت می‌گوید گیورگی ساآکادزه، مورآوی بزرگ، اینجا
    به خاک سپرده شده است؛ سرداری از سدهٔ هفدهم که نخست با ایرانیان جنگید، سپس در خدمتشان درآمد، بار دیگر
    بر آنان شورید و سرانجام در آناتولی کشته شد. می‌گویند پیکر او را در ۱۶۲۹ به وطن آوردند و در همین کلیسا
    نهادند. سندی آن را اثبات نمی‌کند و تاریخ‌نگاران محتاط‌اند، اما برای بازدیدکنندهٔ گرجی اهمیت این مکان
    از همین‌جاست.
  tip: >-
    یک ساعت بس است. کلیسا فعال است و معمولاً باز؛ اگر در بسته بود، کلیددار در روستا زندگی می‌کند و پرسیدن
    از نزدیک‌ترین خانه معمولاً کارساز است. قواعد پوشش معمول است: روسری و دامن بلند برای زنان. زمین درون
    محوطه ناهموار است و سنگ‌ها در علف پنهان‌اند. در روستا سرویس بهداشتی و کافه نیست، پس در کاسپی یا کنار
    جاده نزدیک ایگوئتی توقف کنید. زمستان کوچه‌های روستا گِل می‌شوند.
  route: >-
    از تفلیس روی E60 به سوی گوری تا ایگوئتی، حدود ۴۰ کیلومتر، سپس به جنوب و به جادهٔ کاسپی-ارتاتسمیندا
    بپیچید. روی‌هم ۶۰ کیلومتر، نزدیک یک ساعت و ده دقیقه. کل مسیر آسفالت است؛ بیست کیلومتر پایانی جاده‌ای
    روستایی و باریک با پیچ‌های پیاپی و جای‌جای چاله است، اما برای خودروی اقتصادی مشکلی نیست. سوخت در ایگوئتی
    یا کاسپی موجود است. پیش از کلیسا میدانچه‌ای هست که می‌توان خودرو را رایگان گذاشت.
he:
  name: קתדרלת ארתאצמינדה
  short: כנסייה מכופפת מן המאה ה-13 מדרום לקאספי, מגולפת בעושר מבחוץ וקשורה במסורת לקברו של גיאורגי סאקדזה.
  body: >-
    **ארתאצמינדה היא אחת הכנסיות השמורות ביותר מן המאה ה-13 בשידה קרתלי.** היא מוקדשת לקדוש אווסטתיוס,
    ובגאורגית אווסטטהצמינדה, והכפר קיבל את שמו מן הכנסייה ולא להפך. המתחם כולו עומד בתוך חומה נמוכה בין
    עצים, בכפר המקופל בגבעות שמדרום לקאספי.


    זהו מבנה צלב-בריבוע ביחסים מוארכים באופן חריג. החזית המזרחית נושאת את העבודה העשירה ביותר: צלב עיטורי,
    מסגרת חלון מורכבת ורצועת שזירה גיאומטרית השייכת למיטב מסורת גילוף האבן הגאורגית של ימי הביניים. התוף
    גבוה ומכוסה כמעט כולו בעיטור. הנטייה האנכית הזו היא בדיוק מה שמפריד את המאה ה-13 מן הכנסיות הנמוכות
    והכבדות שנבנו שלוש מאות שנים קודם.


    הכנסייה נפגעה ותוקנה פעמים רבות. במאה ה-19 נוסף לה מגדל פעמונים והפנים טויח מחדש, ולכן כמעט אין לראות
    בתוכה ציור עתיק. מה שנותר הוא חלל גבוה ורגוע ואור היורד מן התוף.


    ארתאצמינדה נושאת גם קשר של זיכרון גאורגי. המסורת אומרת שכאן קבור גיאורגי סאקדזה, המוראווי הגדול —
    מצביא מן המאה ה-17 שנלחם בפרסים, אחר כך שירת אותם, שוב מרד בהם ולבסוף הוצא להורג באנטוליה. לפי המסופר
    הובאו עצמותיו ארצה ב-1629 והונחו בכנסייה הזו. אין מסמך המאשר זאת, וההיסטוריונים נזהרים, אך למבקר הגאורגי
    זו בדיוק הסיבה שהמקום חשוב.
  tip: >-
    שעה מספיקה. הכנסייה פעילה ובדרך כלל פתוחה; אם הדלת נעולה, מחזיק המפתח גר בכפר ושאלה בשער הסמוך בדרך
    כלל פותרת. כללי לבוש רגילים: מטפחת וחצאית ארוכה לנשים. הקרקע בתוך המתחם לא אחידה ואבנים מסתתרות בעשב.
    אין שירותים או בתי קפה בכפר, לכן עצרו בקאספי או בפינות שלצד הכביש ליד איגואתי. בחורף סמטאות הכפר נעשות
    בוציות.
  route: >-
    סעו מטביליסי בכביש E60 לכיוון גורי עד איגואתי, כ-40 ק״מ, ואז פנו דרומה לדרך קאספי-ארתאצמינדה. 60 ק״מ
    בסך הכול, כשעה ועשר דקות. כל המסלול סלול; עשרים הקילומטרים האחרונים הם דרך כפרית צרה עם עיקולים תכופים
    ובמקומות בורות, אך שום דבר שרכב חסכוני אינו מתמודד איתו. דלק אפשר למצוא באיגואתי או בקאספי. לפני הכנסייה
    כיכר קטנה שבה אפשר להשאיר את הרכב בחינם.
ar:
  name: كاتدرائية إرتاتسميندا
  short: كنيسة ذات قبة من القرن الثالث عشر جنوب كاسبي، غنية النقش من الخارج وترتبط بالتقليد بقبر غيورغي
    ساكادزه.
  body: >-
    **إرتاتسميندا من أفضل كنائس القرن الثالث عشر حفظاً في شيدا كارتلي.** وهي مكرسة للقديس أوستاثيوس، وبالجورجية
    إفستاتيتسميندا، وقد أخذت القرية اسمها من الكنيسة لا العكس. ويقوم المجمع كله داخل سور منخفض بين الأشجار،
    في قرية منطوية في تلال جنوب كاسبي.


    والبناء كنيسة صليبية داخل مربع بنسب ممدودة على نحو غير مألوف. وتحمل الواجهة الشرقية أغنى الأعمال:
    صليب زخرفي، وإطار نافذة مركّب، وشريط من التضفير الهندسي ينتمي إلى أرقى تقاليد نحت الحجر الجورجي في
    العصور الوسطى. ورقبة القبة عالية ومغطاة كلها تقريباً بالزخرفة. وهذا التصاعد الرأسي هو بالضبط ما يفصل
    القرن الثالث عشر عن الكنائس الأخفض والأثقل التي بُنيت قبله بثلاثة قرون.


    تعرضت الكنيسة للضرر ورُممت مراراً. وفي القرن التاسع عشر أُضيف إليها برج أجراس وأُعيد تلبيس الداخل
    بالجص، فلم يعد يُرى في الداخل تصوير قديم يُذكر. والباقي حجم عالٍ هادئ وضوء ينزل من القبة.


    وتحمل إرتاتسميندا عقدة من الذاكرة الجورجية. يقول التقليد إن غيورغي ساكادزه، الموراوي الكبير، مدفون
    هنا؛ وهو قائد من القرن السابع عشر حارب الفرس ثم خدمهم ثم انقلب عليهم، وأُعدم في الأناضول. ويُقال إن
    رفاته أُعيد إلى الوطن عام 1629 ووُضع في هذه الكنيسة. ولا وثيقة تثبت ذلك، والمؤرخون حذرون، لكن هذا
    بعينه سبب أهمية المكان عند الزائر الجورجي.
  tip: >-
    ساعة تكفي. الكنيسة عاملة ومفتوحة عادة؛ وإن كان الباب مغلقاً فحامل المفتاح يسكن القرية، والسؤال عند
    أقرب بوابة يحل الأمر غالباً. وقواعد اللباس معتادة: غطاء رأس وتنورة طويلة للنساء. والأرض داخل السور
    غير مستوية وتختبئ الحجارة في العشب. ولا دورات مياه ولا مقاهي في القرية، فتوقف في كاسبي أو عند نقاط
    الطريق قرب إيغويتي. وفي الشتاء تتحول أزقة القرية إلى وحل.
  route: >-
    خذ الطريق E60 من تبليسي نحو غوري حتى إيغويتي، نحو 40 كم، ثم انعطف جنوباً على طريق كاسبي-إرتاتسميندا.
    ستون كيلومتراً إجمالاً، نحو ساعة وعشر دقائق. المسار كله معبّد؛ والعشرون كيلومتراً الأخيرة طريق ريفي
    ضيق كثير المنعطفات وفيه حفر في مواضع، لكن لا شيء يعجز عنه محرك اقتصادي. والوقود متوفر في إيغويتي أو
    كاسبي. وأمام الكنيسة ساحة صغيرة يمكن ترك السيارة فيها بلا مقابل.
