ka:
  name: ერთაწმინდის ტაძარი
  short: 'XIII საუკუნის ტაძარი კასპის სამხრეთით: ჯვარი ოთხივე ფასადზე, 1654 წლის მოხატულობა და სააკაძეთა
    საძვალე.'
  body: >-
    **ერთაწმინდის სახელში წმინდანი იმალება: საუკუნეების ყოველდღიურმა მეტყველებამ „ესტატე წმინდა“ ისე გაცვითა,
    რომ სოფლის სახელად — ერთაწმინდად — იქცა.**


    წმინდანი ევსტათი მცხეთელია — სპარსეთში დაბადებული მეწაღე გვირობანდაკი, ცეცხლთაყვანისმცემელი ქურუმის
    შვილი. ქრისტიანობა მიიღო, დაახლოებით 541 წელს მცხეთაში დასახლდა და დაახლოებით 550 წელს თბილისში თავი
    მოჰკვეთეს, რადგან რწმენაზე უარი არ თქვა. მისი წამების თხრობა ქართული მწერლობის უძველეს შემორჩენილ
    ძეგლთა შორისაა.


    ტაძარი XIII საუკუნის პირველ ნახევარში აიგო და ოქროს ხანის გუმბათოვან ეკლესიათა ოჯახს ეკუთვნის, რომელშიც
    იკორთა, ფიტარეთი, ბეთანია, ქვათახევი და წუღრუღაშენია. მისი ხელწერა ჩუქურთმაა. ოთხივე ფასადზე ფრონტონიდან
    დიდი მოჩუქურთმებული ჯვარი ეშვება; აღმოსავლეთ ფასადს ღრმა, მდიდრულად შემკული ნიშები და სარკმლის საპირეები
    ემატება, სამ მხარეს გაჭრილი პორტალებიც ქვის მაქმანშია გახვეული. თვალს თუ ზემოთ აიტანთ, შეამჩნევთ,
    რომ გუმბათი დანარჩენ ნაგებობას ოდნავ ვერ ეწყობა: იგი საგრძნობლად გვიანდელია, 1951 წელს კი კვლავ აღადგინეს.


    შიგნით, ჯვრის მკლავების კედლებზე, წმინდა ევსტათის ცხოვრების სცენებია. საქტიტორო წარწერის თანახმად,
    ისინი 1654 წელს დახატა იერუსალიმის ჯვრის მონასტრის მამამ მელეტიოსმა, იორამ სააკაძის შეწირულობით. XVII
    საუკუნის დასაწყისიდან ტაძარი სააკაძეებისა და მათი შთამომავლების, თარხნიშვილების, საძვალე იყო და მათი
    საფლავის ქვები დღემდე აქ არის. გადმოცემით, ერთ-ერთი მათგანი დიდი მოურავის, გიორგი სააკაძის, ირანში
    დაღუპული ვაჟის — პაატას — საფლავს ფარავს.


    სპარსი მოწამე, იერუსალიმელი მხატვარი და სარდლის დამწუხრებული ოჯახი — ყველა ერთი სოფლური გუმბათის ქვეშ.
  tip: >-
    შესვლა უფასოა. ტაძარი მოქმედია და ჩვეულებრივ ღიაა; თუ დაკეტილი დაგხვდათ, მეზობელ სახლებში იკითხეთ.
    ქალებს თავსაფარი და ქვედაბოლო დასჭირდებათ. გალავნის შიგნით მიწა უსწორმასწოროა, ბალახში ქვები იმალება.
    მოჩუქურთმებული აღმოსავლეთ ფასადი დილის შუქზე ყველაზე კარგად იკითხება. სოფელში კაფე და ტუალეტი არ არის
    — კასპში ან მცხეთაში გაჩერდით. ტაძრის დღეობა, ერთაწმინდობა, 3 ოქტომბერს (ძველი სტილით 20 სექტემბერს)
    აღინიშნება. საათი სავსებით საკმარისია.
  route: >-
    ყველაზე მოკლე გზა გორის ძველ გზაზე გადის. თბილისიდან ს1 (E60) გზით მცხეთის მიმართულებით გადით, შემდეგ
    შ29-ზე გადადით, რომელიც მტკვრის მარჯვენა ნაპირს მიუყვება, და დასავლეთისკენ, კავთისხევის გავლით იარეთ.
    ცენტრიდან დაახლოებით 55 კმ-ში სამხრეთით, შ129-ზე გადაუხვიეთ და ბოლო 4 კმ გაიარეთ — ტაძარი სოფლის შუაგულში
    დგას. სულ დაახლოებით 60 კმ და საათი და ათი წუთი, მთლიანად ასფალტზე; ბოლო მონაკვეთი ვიწრო და კლაკნილია,
    თუმცა ეკონომ-კლასის მანქანა მას ადვილად გაუმკლავდება. შეგიძლიათ ს1-ის იგოეთის გასასვლელიდან კასპის
    გავლითაც ჩამოხვიდეთ. საწვავი მცხეთასა და კასპშია, ტაძართან პატარა მოედანზე კი მანქანის დაყენება უფასოა.
en:
  name: Ertatsminda Cathedral
  short: >-
    A 13th-century church south of Kaspi with a carved cross on every façade, 1654 frescoes of its martyr
    saint and the Saakadze family tombs.
  body: >-
    **Ertatsminda's name hides a saint: centuries of everyday speech wore "Estate-tsminda", Saint Eustathius,
    down to the name of the village.**


    The saint is Eustathius of Mtskheta, born in Persia as Gvirobandak, a cobbler and the son of a Zoroastrian
    priest. He became a Christian, settled in Mtskheta around 541 and was beheaded in Tbilisi around 550
    for refusing to renounce his faith. The account of his martyrdom is among the oldest surviving works
    of Georgian literature.


    His church went up in the first half of the 13th century and belongs to a family of Golden Age domed
    churches that includes Ikorta, Pitareti, Betania, Kvatakhevi and Tsughrughasheni. Its signature is
    the carving. A great ornamented cross descends from the gable of each of the four façades; the east
    front adds deep, richly worked niches and window surrounds, and the portals on three sides are dressed
    in stone lace. Look up and the dome seems slightly out of step with the rest. It is noticeably later,
    and it was restored again in 1951.


    Inside, scenes from the saint's life cover the walls of the cross-arms. An inscription records that
    they were painted in 1654 by Meletios, a monk of the Georgian Monastery of the Cross in Jerusalem,
    paid for by Ioram Saakadze. From the early 17th century the church was the burial vault of the Saakadzes
    and their descendants the Tarkhnishvilis, and their gravestones are still here. Tradition holds that
    one covers the grave of Paata, the Great Mouravi Giorgi Saakadze's son, who perished in Iran.


    A Persian martyr, a painter from Jerusalem and a warlord's grieving family, all under one village
    dome.
  tip: >-
    Entry is free. The church is in use and usually open; if it isn't, ask at the neighbouring houses.
    Women should bring a headscarf and a skirt. The ground inside the enclosure is uneven, with stones
    hidden in the grass. Morning light suits the carved east façade best. The village has no café or toilets,
    so stop in Kaspi or Mtskheta. The church's feast day, Ertatsmindoba, falls on 3 October (20 September
    in the old calendar). An hour is plenty.
  route: >-
    The quickest way is the old Gori road. Leave Tbilisi on the S1 (E60) towards Mtskheta, switch to the
    Sh29 along the south bank of the Mtkvari and follow it west through Kavtiskhevi. About 55 km from
    the centre, turn south onto the Sh129 for the last 4 km; the church stands in the middle of the village.
    In all about 60 km and an hour and ten minutes, on asphalt throughout, with a narrow, winding final
    stretch that an economy car handles easily. You can also come via the S1's Igoeti exit and Kaspi.
    Fuel is available in Mtskheta or Kaspi, and parking in the small square by the church is free.
ru:
  name: Собор Эртацминда
  short: >-
    Храм XIII века к югу от Каспи: резной крест на каждом фасаде, фрески 1654 года о жизни святого мученика
    и родовые гробницы Саакадзе.
  body: >-
    **В названии Эртацминда прячется святой: века повседневной речи стёрли «Эстате-цминда», то есть «святой
    Евстафий», до имени деревни.**


    Это Евстафий Мцхетский, уроженец Персии по имени Гвиробандак, сапожник и сын зороастрийского жреца.
    Он принял христианство, около 541 года поселился в Мцхете и около 550 года был обезглавлен в Тбилиси
    за отказ отречься от веры. Повесть о его мученичестве входит в число древнейших сохранившихся произведений
    грузинской литературы.


    Его храм поднялся в первой половине XIII века и принадлежит к семье купольных церквей Золотого века,
    куда входят Икорта, Питарети, Бетания, Кватахеви и Цугругашени. Главная его примета — резьба. С фронтона
    каждого из четырёх фасадов спускается большой орнаментированный крест; на восточном фасаде к нему
    добавляются глубокие, богато отделанные ниши и обрамления окон, а порталы с трёх сторон одеты в каменное
    кружево. Поднимите взгляд: купол словно слегка выбивается из общего ритма. Он заметно позднее, а в
    1951 году его ещё раз реставрировали.


    Внутри стены рукавов креста покрыты сценами из жития святого. Надпись сообщает, что их написал в 1654
    году Мелетий, монах грузинского Крестового монастыря в Иерусалиме, на средства Иорама Саакадзе. С
    начала XVII века храм служил усыпальницей Саакадзе и их потомков Тархнишвили, и их надгробия по-прежнему
    здесь. Предание гласит, что одно из них покрывает могилу Пааты — погибшего в Иране сына Георгия Саакадзе,
    Великого Моурави.


    Персидский мученик, художник из Иерусалима и скорбящая семья полководца — все под одним деревенским
    куполом.
  tip: >-
    Вход свободный. Храм действующий и обычно открыт; если заперт, спросите в соседних домах. Женщинам
    стоит взять платок и юбку. Земля внутри ограды неровная, в траве прячутся камни. Резной восточный
    фасад лучше всего смотрится в утреннем свете. В деревне нет ни кафе, ни туалетов, так что остановитесь
    в Каспи или Мцхете. Престольный праздник храма, Эртацминдоба, приходится на 3 октября (20 сентября
    по старому стилю). Часа более чем достаточно.
  route: >-
    Быстрее всего ехать по старой Горийской дороге. Выезжайте из Тбилиси по трассе S1 (E60) в сторону
    Мцхеты, переходите на Sh29 вдоль южного берега Мтквари и следуйте по ней на запад через Кавтисхеви.
    Примерно в 55 км от центра сворачивайте на юг, на Sh129, на последние 4 км; храм стоит посреди деревни.
    Всего около 60 км и час десять минут, асфальт на всём пути, последний отрезок узкий и извилистый,
    но машина эконом-класса справится с ним легко. Можно ехать и через съезд на Игоэти с трассы S1 и Каспи.
    Заправиться можно в Мцхете или Каспи, парковка на маленькой площади у храма бесплатная.
fa:
  name: کلیسای جامع ارتاتسمیندا
  short: >-
    کلیسایی از سدهٔ سیزدهم در جنوب کاسپی، با صلیبی کنده‌کاری‌شده بر هر نما، دیوارنگاره‌های ۱۶۵۴ از قدیس
    شهیدش و آرامگاه‌های خاندان ساآکادزه.
  body: >-
    **نام ارتاتسمیندا قدیسی را در خود پنهان کرده است: قرن‌ها گفتار روزمره «استاته-تسمیندا»، یعنی «قدیس
    اوستاتیوس»، را سابید تا به نام روستا رسید.**


    این قدیس اوستاتیوس متسختایی است که در ایران با نام گویروبندک زاده شد؛ کفاشی بود و پسر یک موبد زرتشتی.
    او مسیحی شد، حدود سال ۵۴۱ در متسختا ساکن شد و حدود ۵۵۰ به جرم سر باز زدن از انکار ایمانش در تفلیس
    گردن زده شد. روایت شهادت او از کهن‌ترین آثار بازمانده از ادبیات گرجی است.


    کلیسای او در نیمهٔ نخست سدهٔ سیزدهم برپا شد و از خانوادهٔ کلیساهای گنبددار عصر طلایی است که ایکورتا،
    پیتارتی، بتانیا، کواتاخوی و تسوغروغاشنی را نیز در بر می‌گیرد. نشانِ ویژهٔ آن کنده‌کاری است. از رأس
    سنتوری هر یک از چهار نما صلیبی بزرگ و آراسته فرود می‌آید؛ نمای شرقی طاقچه‌هایی ژرف و پرکار و قاب‌هایی
    تزئینی بر گرد پنجره‌ها نیز دارد، و درگاه‌های سه سوی بنا جامه‌ای از توری سنگی بر تن کرده‌اند. سر بلند
    کنید: گنبد اندکی با باقی بنا ناهماهنگ به نظر می‌رسد. آشکارا متأخرتر است و در ۱۹۵۱ یک بار دیگر مرمت
    شد.


    درون کلیسا، صحنه‌هایی از زندگی قدیس دیوارهای بازوهای صلیب را پوشانده است. کتیبه‌ای گواهی می‌دهد که
    آن‌ها را در ۱۶۵۴ ملتیوس، راهب صومعهٔ گرجی صلیب در اورشلیم، با هزینهٔ یورام ساآکادزه نقش کرده است.
    از آغاز سدهٔ هفدهم کلیسا آرامگاه خاندان ساآکادزه و نوادگانشان، تارخنیشویلی‌ها، بود و سنگ‌قبرهایشان
    هنوز این‌جاست. روایت سنتی می‌گوید یکی از آن‌ها بر گور پاآتا، پسرِ در ایران جان‌باختهٔ گیورگی ساآکادزه
    («موراوی بزرگ»)، نهاده شده است.


    شهیدی ایرانی، نقاشی از اورشلیم و خاندان داغدار یک سردار، همه زیر یک گنبد روستایی.
  tip: >-
    ورود رایگان است. کلیسا فعال است و معمولاً باز؛ اگر بسته بود، از خانه‌های همسایه بپرسید. زنان روسری
    و دامن همراه داشته باشند. زمینِ درون محوطه ناهموار است و سنگ‌هایی در میان علف‌ها پنهان‌اند. نور صبح
    برای نمای شرقیِ کنده‌کاری‌شده بهترین است. روستا کافه و سرویس بهداشتی ندارد، پس در کاسپی یا متسختا
    توقف کنید. جشن کلیسا، ارتاتسمیندوبا، در ۳ اکتبر (۲۰ سپتامبر در تقویم قدیم) برگزار می‌شود. یک ساعت
    بیش از کافی است.
  route: >-
    سریع‌ترین راه، جادهٔ قدیم گوری است. از تفلیس با S1 (E60) به سمت متسختا بیرون بروید، به Sh29 در امتداد
    کرانهٔ جنوبی متکواری بپیچید و آن را به سمت غرب، از کاوتیسخوی، دنبال کنید. حدود ۵۵ کیلومتر از مرکز،
    برای ۴ کیلومتر پایانی به سمت جنوب وارد Sh129 شوید؛ کلیسا در میانهٔ روستا ایستاده است. روی هم حدود
    ۶۰ کیلومتر و یک ساعت و ده دقیقه، سراسر آسفالت، با تکهٔ پایانیِ باریک و پرپیچ‌وخمی که خودروی اکونومی
    به‌راحتی از پسش برمی‌آید. می‌توانید از خروجی ایگوئتیِ S1 و کاسپی هم بیایید. سوخت در متسختا یا کاسپی
    پیدا می‌شود و پارک در میدان کوچک کنار کلیسا رایگان است.
he:
  name: קתדרלת ארטצמינדה
  short: >-
    כנסייה מהמאה ה-13 מדרום לקספי, עם צלב מגולף על כל חזית, ציורי קיר משנת 1654 של הקדוש המעונה ומצבות
    משפחת סאאקדזה.
  body: >-
    **בשם ארטצמינדה מסתתר קדוש: מאות שנים של דיבור יומיומי שחקו את "אסטטה-צמינדה", כלומר "אוסטתיוס הקדוש",
    עד שנעשה לשמו של הכפר.**


    הקדוש הוא אוסטתיוס ממצחתה, שנולד בפרס בשם גווירובנדק, סנדלר ובנו של כוהן זורואסטרי. הוא התנצר, השתקע
    במצחתה בסביבות 541 והוצא להורג בעריפת ראש בטביליסי בסביבות 550, משום שסירב להתכחש לאמונתו. סיפור מות
    הקדושים שלו נמנה עם היצירות העתיקות ביותר של הספרות הגאורגית שהגיעו לידינו.


    כנסייתו הוקמה במחצית הראשונה של המאה ה-13, והיא שייכת למשפחה של כנסיות כיפה מתור הזהב, שנמנות עמה
    גם איקורטה, פיטארטי, בטניה, קווטחווי וצוגרוגשני. חותמה הוא הגילוף. מן הגמלון של כל אחת מארבע החזיתות
    יורד צלב גדול ומעוטר; בחזית המזרחית נוספות גומחות עמוקות, מעובדות בעושר, ומסגרות מגולפות לחלונות,
    והפורטלים בשלושה צדדים עטויים תחרת אבן. הרימו את המבט: הכיפה נראית מעט זרה לשאר המבנה. היא מאוחרת
    יותר באופן ניכר, וב-1951 שוחזרה פעם נוספת.


    בפנים מכסות סצנות מחיי הקדוש את קירות זרועות הצלב. כתובת מציינת שצייר אותן ב-1654 מלטיוס, נזיר במנזר
    המצלבה הגאורגי בירושלים, במימונו של יוראם סאאקדזה. מראשית המאה ה-17 שימשה הכנסייה מקום קבורה למשפחת
    סאאקדזה ולצאצאיהם, בני טרחנישווילי, ומצבותיהם עדיין כאן. המסורת מספרת שאחת מהן מכסה את קברו של פאטה
    – בנו של גיורגי סאאקדזה, "המוראווי הגדול" – שנספה באיראן.


    קדוש מעונה פרסי, צייר מירושלים ומשפחה אבלה של מצביא, כולם תחת כיפה כפרית אחת.
  tip: >-
    הכניסה חינם. הכנסייה פעילה ובדרך כלל פתוחה; אם היא סגורה, שאלו בבתים הסמוכים. נשים יביאו מטפחת ראש
    וחצאית. הקרקע בתוך המתחם אינה אחידה, ואבנים מסתתרות בעשב. אור הבוקר מחמיא ביותר לחזית המזרחית המגולפת.
    בכפר אין בית קפה ואין שירותים, אז עצרו בקספי או במצחתה. חג הכנסייה, ארטצמינדובה, חל ב-3 באוקטובר (20
    בספטמבר לפי הלוח הישן). שעה מספיקה בהחלט.
  route: >-
    הדרך המהירה ביותר היא דרך גורי הישנה. צאו מטביליסי בכביש S1 (E60) לכיוון מצחתה, עברו לכביש Sh29 לאורך
    הגדה הדרומית של המטקווארי והמשיכו בו מערבה דרך קוותיסחווי. כ-55 ק"מ מן המרכז פנו דרומה לכביש Sh129
    לארבעת הקילומטרים האחרונים; הכנסייה ניצבת במרכז הכפר. בסך הכול כ-60 ק"מ ושעה ועשר דקות, אספלט לכל
    אורך הדרך, עם קטע אחרון צר ומפותל שרכב חסכוני מתמודד איתו בקלות. אפשר להגיע גם דרך מחלף איגואטי של
    כביש S1 ודרך קספי. דלק יש במצחתה או בקספי, והחניה בכיכר הקטנה ליד הכנסייה חינם.
ar:
  name: كاتدرائية إرتاتسميندا
  short: >-
    كنيسة من القرن الثالث عشر جنوب كاسبي، على كل واجهة منها صليب منحوت، وفيها جداريات من عام 1654 لقديسها
    الشهيد ومقابر أسرة ساكادزه.
  body: >-
    **في اسم إرتاتسميندا يختبئ قديس: فقد صقلت قرون من الكلام اليومي عبارة "إستاتي-تسميندا"، أي "القديس
    أوسطاثيوس"، حتى صارت اسم القرية.**


    القديس هو أوسطاثيوس المتسخيتي، المولود في بلاد فارس باسم غفيروباندك، وكان إسكافياً وابن كاهن زرادشتي.
    اعتنق المسيحية واستقر في متسخيتا نحو عام 541، ثم قُطع رأسه في تبليسي نحو عام 550 لرفضه أن يرتد عن
    إيمانه. وتُعدّ رواية استشهاده من أقدم ما بقي من آثار الأدب الجورجي.


    شُيّدت كنيسته في النصف الأول من القرن الثالث عشر، وهي تنتمي إلى أسرة من كنائس العصر الذهبي ذات القباب
    تضم إيكورتا وبيتاريتي وبيتانيا وكفاتاخيفي وتسوغروغاشيني. وسِمتها المميزة هي النحت. فمن رأس الجملون
    في كل واجهة من الواجهات الأربع يتدلى صليب كبير مزخرف؛ وتضيف الواجهة الشرقية كوّات عميقة غنية الزخرفة
    وأطراً منحوتة للنوافذ، أما البوابات في ثلاث جهات فمكسوة بدانتيل من حجر. ارفع بصرك: تبدو القبة غير
    منسجمة تماماً مع بقية البناء. إنها أحدث عهداً بوضوح، وقد رُمّمت مرة أخرى عام 1951.


    في الداخل تغطي مشاهد من سيرة القديس جدران أذرع الصليب. ويسجل نقش كتابي أن من رسمها عام 1654 هو ملاتيوس،
    راهب دير المصلبة الجورجي في القدس، على نفقة يورام ساكادزه. ومنذ مطلع القرن السابع عشر صارت الكنيسة
    مدفناً لأسرة ساكادزه وأحفادهم من آل تارخنيشفيلي، وما زالت شواهد قبورهم هنا. وتقول الرواية المتوارثة
    إن أحدها يغطي قبر باتا، ابن غيورغي ساكادزه "المورافي العظيم"، وقد لقي باتا حتفه في إيران.


    شهيد فارسي، ورسام من القدس، وأسرة قائد عسكري مفجوعة، كلهم تحت قبة قروية واحدة.
  tip: >-
    الدخول مجاني. الكنيسة عاملة ومفتوحة عادةً؛ وإن وجدتها مغلقة فاسأل في البيوت المجاورة. على النساء إحضار
    غطاء للرأس وتنورة. الأرض داخل السور غير مستوية، وتختبئ الحجارة في العشب. ضوء الصباح هو الأنسب للواجهة
    الشرقية المنحوتة. لا مقهى ولا دورات مياه في القرية، فتوقف في كاسبي أو متسخيتا. يحلّ عيد الكنيسة، إرتاتسميندوبا،
    في 3 أكتوبر (20 سبتمبر بالتقويم القديم). ساعة واحدة تكفي وتزيد.
  route: >-
    أسرع الطرق هو طريق غوري القديم. اخرج من تبليسي على الطريق S1 (E60) باتجاه متسخيتا، ثم انتقل إلى Sh29
    على امتداد الضفة الجنوبية لنهر متكفاري واتبعه غرباً عبر كافتيسخيفي. وعلى بعد نحو 55 كم من المركز انعطف
    جنوباً إلى Sh129 للكيلومترات الأربعة الأخيرة؛ وتقوم الكنيسة وسط القرية. المجموع نحو 60 كم وساعة وعشر
    دقائق، والطريق مسفلت كله، ومقطعه الأخير ضيق متعرج تجتازه السيارة الاقتصادية بسهولة. ويمكنك أيضاً القدوم
    عبر مخرج إيغوئيتي على الطريق S1 ثم كاسبي. الوقود متوفر في متسخيتا أو كاسبي، والوقوف في الساحة الصغيرة
    بجوار الكنيسة مجاني.
