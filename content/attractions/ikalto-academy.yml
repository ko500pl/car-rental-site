ka:
  name: იყალთოს აკადემია
  short: >-
    წმინდა ზენონის VI საუკუნის მონასტერი თელავის დასავლეთით და შუა საუკუნეების აკადემიის უსახურავო დარბაზი,
    სადაც, გადმოცემით, რუსთაველი სწავლობდა.
  body: >-
    **ოცდაოთხმეტრიან დარბაზში, რომელსაც დღეს ცა ახურავს, შუა საუკუნეების კახეთი ასტრონომიას, გეომეტრიას,
    გალობას — და ღვინის დაყენებასაც — ასწავლიდა.**


    იყალთო წმინდა ზენონით იწყება. ცამეტ ასურელ მამათაგან ერთ-ერთმა მონასტერი VI საუკუნის ბოლოს დააარსა
    და მისი წმინდა ნაწილები დღემდე აქ განისვენებს. გალავანში სამი ეკლესიაა; ეზოს თავზე მაღალი კვიპაროსები
    აზიდულა, ბალახში კი ძველი თიხის ქვევრები ყრია. მთავარი, „ღვთაება“ — ფერისცვალების ტაძარი, VIII–IX
    საუკუნეებში აიგო იმ ძველი ეკლესიის ადგილას, რომელშიც ზენონი იყო დაკრძალული. სამების პატარა ეკლესია
    ძირფესვიანად გადაკეთებულია, მაგრამ მასში VI საუკუნის გუმბათოვანი ეკლესიის ნაწილები დღესაც ჩანს. ყველაწმინდის
    ერთნავიანი ეკლესია XII–XIII საუკუნეების მიჯნას ეკუთვნის.


    აკადემია მოგვიანებით გაჩნდა. ჩვეული ცნობით, ის 1106 წელს, დავით აღმაშენებლის დროს, დააარსა არსენ იყალთოელმა
    — მეცნიერმა და მეფის მრჩეველმა, რომელიც აქ გელათიდან მოვიდა. აქ ეუფლებოდნენ ღვთისმეტყველებას, რიტორიკას,
    ფილოსოფიას, ასტრონომიას, გეოგრაფიას, გეომეტრიას, არითმეტიკას, მუსიკასა და გალობას, ამასთან — ლითონის
    დამუშავებას, კერამიკას, ფარმაკოლოგიას, მევენახეობა-მეღვინეობას. თავად არსენმა ქართულად თარგმნა „დიდი
    სჯულისკანონი“ — ბიზანტიური საეკლესიო სამართლის კრებული.


    შედით ნანგრევში. ეს რიყის ქვით ნაშენი წაგრძელებული შენობაა: ქვედა სართულზე ორი ოთახი, ზედაზე კი ერთიანი,
    24,5 × 9 მეტრის დარბაზი, სამეცნიერო შეკრებებისთვის განკუთვნილი. დღესაც გაარჩევთ კათედრის ფუძესა და
    ღრმა თახჩა-სარკმლებს. ახლოს ქვის საწნახელი და ძველი მარნებია — სასწავლო პროგრამის პრაქტიკული ნახევარი.


    გადმოცემით, აქ ახალგაზრდა შოთა რუსთაველი სწავლობდა. ამას საბუთი არ ადასტურებს, იყალთოდან შემორჩენილი
    ხელნაწერები კი უფრო გვიანდელია და აკადემიაზე დუმს, მაგრამ გადმოცემა ცოცხლობს. 1616 წელს შაჰ-აბას I-ის
    ლაშქარმა აკადემია გადაწვა. ეკლესიებში დღეს კვლავ გალობენ; დარბაზი მხოლოდ უსმენს.
  tip: >-
    სამი ეკლესიისა და აკადემიის ნანგრევისთვის ერთი საათი საკმარისია. შესვლა უფასოა, სანთლებისთვის ხურდა
    თან იქონიეთ. ეს მოქმედი მონასტერია: მხრები და მუხლები დაფარული უნდა იყოს, ქალებს თავსაფარი დასჭირდებათ,
    წირვა-ლოცვის დროს კი ხმადაბლა ისაუბრეთ. აკადემიის დარბაზის გადასაღებად საუკეთესოა დილის ან შუადღის
    შემდეგ დახრილი, რბილი სინათლე. კაფე, ბანკომატი და საწვავი თელავშია. იყალთო ბუნებრივად ერწყმის ალავერდსა
    და ორ შუამთას — ყველა ახლოსაა, და ერთად აუჩქარებელ დილას ქმნის.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით გადით, ვაზიანის გავლით შ38-ზე გადაუხვიეთ და გომბორის უღელტეხილზე გადადით.
    კახეთის მხარეს, თელავამდე, შ42-ზე დასავლეთით, ახმეტის მიმართულებით შეუხვიეთ; დაახლოებით 4 კილომეტრის
    შემდეგ მარცხნივ, შ179-ზე აუხვიეთ — ეს მოკლე მისასვლელი გზა 2 კილომეტრში მონასტრამდე ადის. სულ 96 კილომეტრი,
    დაახლოებით ორი საათი, მთელ გზაზე ასფალტი. ეკონომ-კლასის მანქანა სავსებით საკმარისია. საწვავი თელავშია,
    რამდენიმე კილომეტრით აღმოსავლეთით. თუ ზამთარში გომბორი თოვლმა ჩაკეტა, ს5-ით საგარეჯოს გავლით ბაკურციხემდე
    იარეთ, იქიდან კი შ42-ით ჩრდილოეთით, გურჯაანისა და თელავის გავლით.
en:
  name: Ikalto Academy
  short: >-
    Saint Zenon's 6th-century monastery west of Telavi, and the roofless hall of the medieval academy
    where, tradition says, Rustaveli studied.
  body: >-
    **In a hall twenty-four metres long, now open to the sky, medieval Kakheti taught astronomy, geometry
    and chant, and how to make wine.**


    Ikalto begins with Saint Zenon, one of the Thirteen Assyrian Fathers, who founded the monastery in
    the late 6th century; his relics rest here still. Three churches share the enclosure, where tall cypresses
    rise over the yard and old clay qvevri lie in the grass. The main one, Khvtaeba, the Church of the
    Transfiguration, was built in the 8th–9th century over the older church where Zenon had been buried.
    Sameba, the Trinity, is small and heavily rebuilt, yet it still holds parts of a 6th-century domed
    church. Kvelatsminda, All Saints, a single-naved chapel, dates from around 1200.


    The academy came later. By the usual account it was founded in 1106, under David the Builder, by Arsen
    Ikaltoeli, a scholar and royal adviser who had come here from Gelati. Its students learned theology,
    rhetoric, philosophy, astronomy, geography, geometry, arithmetic, music and chant, and also metalwork,
    pottery, pharmacology, viticulture and winemaking. Arsen himself translated the Great Nomocanon, the
    Byzantine body of church law, into Georgian.


    Walk into the ruin. It is a long building of river cobble: two rooms below and, above them, a single
    hall of 24.5 by 9 metres, made for gatherings. You can still make out the base of the teacher's rostrum
    and the deep window niches. Nearby stand a stone winepress and the old wine cellars, the practical
    half of the syllabus.


    Tradition says the young Shota Rustaveli studied here. No document proves it, and the manuscripts
    that survive from Ikalto are later and silent about the academy, but the story endures. In 1616 the
    troops of Shah Abbas I set the academy on fire. The churches sing again today; the hall only listens.
  tip: >-
    An hour covers the three churches and the academy ruin. Entry is free; bring small change for candles.
    This is an active monastery, so shoulders and knees should be covered and women will want a headscarf;
    keep your voice down during services. The academy hall is the place for photographs in the soft light
    of early morning or late afternoon. Cafés, ATMs and fuel are in Telavi. Ikalto pairs naturally with
    Alaverdi and with the two Shuamta monasteries, all a short drive away, and together they make an unhurried
    morning.
  route: >-
    From Tbilisi take the S5 east and, just past Vaziani, the Sh38 over the Gombori Pass. On the Kakheti
    side, before Telavi, join the Sh42 heading west towards Akhmeta; after about 4 km turn left onto the
    short Sh179 access road, which climbs 2 km to the monastery. The total is 96 km, about two hours,
    on asphalt throughout. An economy car is fine. Fuel is in Telavi, a few kilometres east. If snow closes
    Gombori in winter, take the S5 through Sagarejo to Bakurtsikhe and the Sh42 north through Gurjaani
    and Telavi instead.
ru:
  name: Икалтойская академия
  short: >-
    Монастырь святого Зенона VI века к западу от Телави и открытый небу зал средневековой академии, где,
    по преданию, учился Руставели.
  body: >-
    **В зале длиной двадцать четыре метра, ныне открытом небу, средневековая Кахетия учила астрономии,
    геометрии, церковному песнопению — и виноделию.**


    Икалто начинается со святого Зенона, одного из Тринадцати ассирийских отцов, основавшего монастырь
    в конце VI века; его мощи покоятся здесь до сих пор. Три церкви делят одну ограду; над двором поднимаются
    высокие кипарисы, а в траве лежат старые глиняные квеври. Главная, Хвтаеба, церковь Преображения,
    была построена в VIII–IX веке над более древней церковью, где был похоронен Зенон. Самеба, Троицкая,
    невелика и сильно перестроена, но всё же хранит части купольной церкви VI века. Квелацминда, Всех
    Святых, однонефная часовня, датируется примерно 1200 годом.


    Академия появилась позже. По общепринятой версии, она была основана в 1106 году при Давиде Строителе
    Арсеном Икалтоели — учёным и царским советником, прибывшим сюда из Гелати. Здесь изучали богословие,
    риторику, философию, астрономию, географию, геометрию, арифметику, музыку и церковное песнопение,
    а также металлообработку, гончарное дело, фармакологию, виноградарство и виноделие. Сам Арсен перевёл
    на грузинский Большой номоканон — византийский свод церковного права.


    Войдите в развалины. Это длинное здание из речного булыжника: два помещения внизу, а над ними — единый
    зал размером 24,5 на 9 метров, устроенный для собраний. Ещё можно разглядеть основание учительской
    кафедры и глубокие оконные ниши. Рядом стоят каменная давильня и старые винные погреба — практическая
    половина учебной программы.


    Предание говорит, что здесь учился молодой Шота Руставели. Ни один документ этого не доказывает, а
    сохранившиеся икалтойские рукописи относятся к более позднему времени и молчат об академии, но легенда
    живёт. В 1616 году войска шаха Аббаса I сожгли академию. Церкви поют и сегодня; зал лишь слушает.
  tip: >-
    Час хватит на три церкви и развалины академии. Вход бесплатный; возьмите мелкие деньги на свечи. Это
    действующий монастырь, так что плечи и колени должны быть закрыты, женщинам стоит взять платок; во
    время службы говорите тише. Зал академии лучше всего фотографировать в мягком свете раннего утра или
    позднего дня. Кафе, банкоматы и заправка — в Телави. Икалто естественно сочетается с Алаверди и двумя
    монастырями Шуамта, до которых недалеко, и вместе они складываются в неспешное утро.
  route: >-
    Из Тбилиси езжайте по трассе S5 на восток и, сразу за Вазиани, по дороге Sh38 через Гомборский перевал.
    На кахетинской стороне, перед Телави, выйдите на Sh42 в сторону Ахметы; примерно через 4 км сверните
    налево на короткую подъездную дорогу Sh179, которая через 2 км поднимается к монастырю. Всего 96 км,
    около двух часов, полностью по асфальту. Машины эконом-класса достаточно. Заправка — в Телави, в нескольких
    километрах к востоку. Если зимой Гомборский перевал закрыт снегом, поезжайте по S5 через Сагареджо
    к Бакурцихе и далее по Sh42 на север через Гурджаани и Телави.
fa:
  name: آکادمی ایکالتو
  short: >-
    صومعهٔ سدهٔ ششم زنون مقدس، در غرب تلاوی، و تالار بی‌سقفِ آکادمی سده‌های میانه که، به روایتی، روستاولی
    در آن آموزش دید.
  body: >-
    **در تالاری به طول بیست‌وچهار متر، که اکنون رو به آسمان گشوده است، کاختیِ سده‌های میانه ستاره‌شناسی،
    هندسه و سرودخوانی می‌آموخت - و نیز چگونگی ساخت شراب.**


    ایکالتو با زنون مقدس آغاز می‌شود، یکی از سیزده پدر آشوری، که در اواخر سدهٔ ششم صومعه را بنیاد گذاشت؛
    بقایای پیکرش هنوز همین‌جا آرام گرفته است. سه کلیسا در این محوطه کنار هم‌اند؛ سروهای بلند بر حیاط سر
    کشیده‌اند و کوزه‌های سفالیِ کهنِ شراب، کوِوری‌ها، در میان علف‌ها افتاده‌اند. کلیسای اصلی، خواتائبا،
    یعنی کلیسای تبدیلِ هیئت، در سدهٔ هشتم یا نهم بر روی کلیسای کهن‌تری بنا شد که زنون در آن به خاک سپرده
    شده بود. سامبا، یعنی تثلیث، کوچک و بسیار بازسازی‌شده است، اما هنوز بخش‌هایی از کلیسایی گنبددار از
    سدهٔ ششم را در خود دارد. کوِلاتسمیندا، یعنی همهٔ مقدسان، نمازخانه‌ای یک‌ناوه، به دور و بر سال ۱۲۰۰
    برمی‌گردد.


    آکادمی دیرتر پدید آمد. به روایت رایج، در سال ۱۱۰۶، در زمان داوید سازنده، به دست ارسن ایکالتوئلی -
    دانشوری و مستشار سلطنتی که از گلاتی به این‌جا آمده بود - بنیاد گذاشته شد. دانش‌آموزانش الهیات، سخنوری،
    فلسفه، ستاره‌شناسی، جغرافیا، هندسه، حساب، موسیقی و سرودخوانی می‌آموختند، و نیز فن فلزکاری، سفالگری،
    داروسازی، انگورداری و شراب‌سازی. خودِ ارسن نوموکانون بزرگ، مجموعهٔ قوانین کلیسایی بیزانسی، را به گرجی
    برگرداند.


    به درون خرابه گام بگذارید. بنایی دراز از قلوه‌سنگ رودخانه‌ای است: دو اتاق در پایین و، بالای آن‌ها،
    تالاری یگانه به ابعاد ۲۴٫۵ در ۹ متر، برای گردهمایی‌ها ساخته شده. هنوز می‌توان پایهٔ سخن‌گاه استاد
    و طاقچه‌های ژرف پنجره را بازشناخت. نزدیک آن، چرخشتی سنگی و سردابه‌های کهن شراب برپاست - نیمهٔ عملی
    برنامهٔ درسی.


    روایت می‌گوید شوتا روستاولی جوان در این‌جا درس آموخت. هیچ سندی این را ثابت نمی‌کند، و دست‌نوشته‌هایی
    که از ایکالتو باقی مانده‌اند متأخرترند و دربارهٔ آکادمی خاموش‌اند، اما داستان پایدار می‌ماند. در سال
    ۱۶۱۶ سپاهیان شاه‌عباس اول آکادمی را به آتش کشیدند. کلیساها امروز باز می‌سرایند؛ تالار تنها می‌شنود.
  tip: >-
    یک ساعت برای سه کلیسا و خرابهٔ آکادمی کافی است. ورود رایگان است؛ پول خرد برای شمع همراه داشته باشید.
    این صومعه‌ای فعال است، پس شانه‌ها و زانوها باید پوشیده باشد و زنان بهتر است روسری بیاورند؛ در زمان
    مراسم آرام سخن بگویید. تالار آکادمی بهترین جا برای عکاسی در نور نرم بامداد زود یا اواخر بعدازظهر است.
    کافه، دستگاه خودپرداز و سوخت‌گیری در تلاوی است. ایکالتو به‌طور طبیعی با آلاوردی و دو صومعهٔ شوآمتا،
    همه در فاصله‌ای کوتاه، همراه می‌شود و با هم صبحی بی‌شتاب می‌سازند.
  route: >-
    از تفلیس مسیر S5 را به سوی شرق بگیرید و درست پس از وازیانی، از راه Sh38 از گذرگاه گومبوری بگذرید.
    در سوی کاختی، پیش از تلاوی، به Sh42 به سوی آخمتا بپیوندید؛ پس از حدود ۴ کیلومتر به چپ، به راه کوتاه
    دسترسی Sh179 بپیچید، که ۲ کیلومتر تا صومعه بالا می‌رود. مسافت کل ۹۶ کیلومتر است، حدود دو ساعت، همه
    بر آسفالت. خودرویی اقتصادی کافی است. سوخت‌گیری در تلاوی، چند کیلومتر شرق‌تر. اگر برف زمستانی گذرگاه
    گومبوری را ببندد، از راه S5 از ساگارجو تا باکورتسیخه و سپس Sh42 به شمال، از گورجانی و تلاوی بروید.
he:
  name: אקדמיית איקלטו
  short: >-
    מנזרו של הקדוש זנון מהמאה ה-6, ממערב לטלאווי, ואולם האקדמיה מימי הביניים החשוף לשמיים, שבו, כך המסורת,
    למד רוסתאוולי.
  body: >-
    **באולם באורך עשרים וארבעה מטרים, פתוח כיום לשמיים, לימדה קאחתי של ימי הביניים אסטרונומיה, גיאומטריה
    ומזמורים - וגם איך לעשות יין.**


    איקלטו מתחיל בקדוש זנון, אחד משלושה-עשר האבות האשוריים, שהקים את המנזר בשלהי המאה ה-6; שרידיו נחים
    כאן עד היום. שלוש כנסיות חולקות את החצר; ברושים גבוהים מתנשאים מעליה, ובעשב מוטלים קוורי ישנים, כדי
    חרס ליין. הראשית, חוותאבה, כנסיית ההשתנות, נבנתה במאה ה-8 עד ה-9 מעל כנסייה עתיקה יותר שבה נקבר זנון.
    סאמבה, השילוש, קטנה ועברה שיפוצים נרחבים, ובכל זאת עדיין שומרת חלקים מכנסיית כיפה מהמאה ה-6. קוולצמינדה,
    כל הקדושים, קפלה חד-ספינתית, מתוארכת לסביבות שנת 1200.


    האקדמיה הגיעה מאוחר יותר. לפי הגרסה המקובלת, היא נוסדה ב-1106, בימי דוד הבנאי, בידי ארסן איקלטואלי,
    מלומד ויועץ מלכותי שהגיע לכאן מגלאתי. תלמידיה למדו תיאולוגיה, רטוריקה, פילוסופיה, אסטרונומיה, גאוגרפיה,
    גיאומטריה, אריתמטיקה, מוזיקה ומזמורים, וגם עבודת מתכת, קדרות, פרמקולוגיה, גידול גפנים וייצור יין.
    ארסן עצמו תרגם את הנומוקנון הגדול, אוסף החוק הכנסייתי הביזנטי, לגאורגית.


    היכנסו לחורבה. זהו בניין ארוך מצרור נחל: שני חדרים בקומת הקרקע, ומעליהם אולם יחיד בגודל 24.5 על 9
    מטרים, שנועד להתכנסויות. עדיין ניתן להבחין בבסיס בימת המורה ובגומחות החלונות העמוקות. בקרבת מקום עומדים
    מכבש יין מאבן ומרתפי היין הישנים - המחצית המעשית של תכנית הלימודים.


    המסורת מספרת שהצעיר שוטה רוסתאוולי למד כאן. שום מסמך לא מוכיח זאת, וכתבי היד ששרדו מאיקלטו מאוחרים
    יותר ושותקים בנוגע לאקדמיה, אך הסיפור נמשך. ב-1616 הציתו חיילי השאה עבאס הראשון את האקדמיה. הכנסיות
    שרות שוב היום; האולם רק מקשיב.
  tip: >-
    שעה מספיקה לשלוש הכנסיות ולחורבת האקדמיה. הכניסה חינם; הביאו כסף קטן לנרות. זהו מנזר פעיל, אז כתפיים
    וברכיים צריכות להיות מכוסות ונשים צריכות כיסוי ראש; דברו בשקט בזמן תפילות. אולם האקדמיה הוא המקום
    לצילומים באור הרך של הבוקר המוקדם או אחר הצהריים המאוחר. בתי קפה, כספומטים ותדלוק בטלאווי. איקלטו
    משתלב באופן טבעי עם אלוורדי ועם שני מנזרי שואמטה, כולם במרחק נסיעה קצר, ויחד הם מרכיבים בוקר נינוח.
  route: >-
    מטביליסי סעו בכביש S5 מזרחה, ומעבר לוואזיאני פנו לדרך Sh38 העולה על מעבר גומבורי. בצד קאחתי, לפני
    טלאווי, התחברו ל-Sh42 בכיוון אחמטה; לאחר כ-4 ק"מ פנו שמאלה לדרך הגישה הקצרה Sh179, שעולה 2 ק"מ למנזר.
    בסך הכול 96 ק"מ, כשעתיים, כולו על אספלט. רכב אקונומי מספיק. תדלוק בטלאווי, כמה קילומטרים מזרחה. אם
    שלג חוסם את מעבר גומבורי בחורף, סעו בכביש S5 דרך סאגארג'ו לבקורציחה ומשם ב-Sh42 צפונה דרך גורג'אני
    וטלאווי.
ar:
  name: أكاديمية إيكالتو
  short: >-
    دير القديس زينون من القرن السادس، غرب تيلافي، وقاعة الأكاديمية القروسطية المفتوحة على السماء التي
    درس فيها، بحسب التراث، روستافيلي.
  body: >-
    **في قاعة طولها أربعة وعشرون مترًا، مفتوحة الآن على السماء، كانت كاختي القروسطية تُعلِّم الفلك والهندسة
    والترتيل - وكذلك صناعة النبيذ.**


    تبدأ إيكالتو بالقديس زينون، أحد الآباء الآشوريين الثلاثة عشر، الذي أسس الدير في أواخر القرن السادس؛
    ولا تزال رفاته هنا. تتشارك ثلاث كنائس هذا السور؛ وترتفع فوق الفناء أشجار سرو عالية، وفي العشب ترقد
    جرار كفيفري فخارية قديمة للنبيذ. الرئيسية، خفتاييبا، كنيسة التجلي، بُنيت في القرن الثامن أو التاسع
    فوق كنيسة أقدم كان زينون قد دُفن فيها. سامبا، كنيسة الثالوث، صغيرة وأُعيد بناؤها كثيرًا، لكنها لا
    تزال تحمل أجزاء من كنيسة ذات قبة من القرن السادس. كفيلاتسميندا، كنيسة جميع القديسين، وهي مصلى ذو صحن
    واحد، تعود إلى نحو عام 1200.


    ظهرت الأكاديمية في وقت لاحق. وفق الرواية المتعارف عليها، تأسست عام 1106، في عهد داود الباني، على يد
    أرسن إيكالتوئيلي، عالم ومستشار ملكي وصل إلى هنا من غيلاتي. تعلم طلابها اللاهوت والبلاغة والفلسفة والفلك
    والجغرافيا والهندسة والحساب والموسيقى والترتيل، وأيضًا صناعة المعادن والفخار وعلم العقاقير وزراعة
    الكرمة وصناعة النبيذ. وترجم أرسن نفسه الناموكانون الكبير، مجموعة القانون الكنسي البيزنطي، إلى الجورجية.


    ادخل إلى الأطلال. إنه مبنى طويل من الحصى النهري: غرفتان في الأسفل، وفوقهما قاعة واحدة أبعادها 24.5
    في 9 أمتار، بُنيت للتجمعات. ما زال بإمكانك تمييز قاعدة منبر المعلم وفجوات النوافذ العميقة. قريبًا
    منه تقف معصرة نبيذ حجرية وأقبية النبيذ القديمة - النصف العملي من المنهج الدراسي.


    يقول التراث إن شوتا روستافيلي الشاب درس هنا. لا وثيقة تثبت ذلك، والمخطوطات الباقية من إيكالتو أحدث
    عهدًا وصامتة بشأن الأكاديمية، لكن الرواية باقية. في عام 1616 أحرقت جيوش الشاه عباس الأول الأكاديمية.
    تُرتِّل الكنائس مجددًا اليوم؛ أما القاعة فتكتفي بالإصغاء.
  tip: >-
    ساعة واحدة تكفي للكنائس الثلاث وأطلال الأكاديمية. الدخول مجاني؛ احمل نقودًا صغيرة للشموع. هذا دير
    عامر بالرهبان، فيجب تغطية الأكتاف والركبتين، وتحتاج النساء إلى غطاء رأس؛ اخفض صوتك أثناء القداس. قاعة
    الأكاديمية هي المكان المناسب للتصوير في الضوء الناعم للصباح الباكر أو لآخر النهار. المقاهي والصرافات
    الآلية والوقود في تيلافي. تُزار إيكالتو عادةً مع ألافردي وديري شوامتا، فكلها على مسافة قصيرة، وتصنع
    معًا صباحًا هادئًا.
  route: >-
    من تبليسي خذ الطريق S5 شرقًا، وبعد فازياني مباشرة، خذ الطريق Sh38 عبر ممر غومبوري. في جانب كاختي،
    قبل تيلافي، انضم إلى الطريق Sh42 نحو أخميتا؛ بعد حوالي 4 كم انحرف يسارًا إلى طريق الوصول القصير Sh179،
    الذي يصعد 2 كم إلى الدير. المسافة الإجمالية 96 كم، حوالي ساعتين، كلها على الإسفلت. سيارة اقتصادية
    كافية. التزود بالوقود في تيلافي، على بعد كيلومترات قليلة شرقًا. إذا أغلق الثلج ممر غومبوري في الشتاء،
    خذ الطريق S5 عبر ساغاريجو إلى باكورتسيخه ثم Sh42 شمالًا عبر غورجاني وتيلافي.
