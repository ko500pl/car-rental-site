ka:
  name: იყალთოს აკადემია
  short: VI საუკუნის მონასტერი და შუა საუკუნეების აკადემიის ნანგრევები, სადაც გადმოცემით შოთა რუსთაველი
    სწავლობდა.
  body: >-
    იყალთო თელავიდან დასავლეთით ათიოდე კილომეტრში, ცივ-გომბორის ქედის ფერდობზე დგას, კვიპაროსებით და ჭადრებით
    შემოსილ ეზოში. მონასტერი VI საუკუნეში ასურელმა მამამ ზენონ იყალთოელმა დააარსა; მისი სამარხი მთავარ
    ტაძარშია. ტერიტორიაზე სამი ეკლესიაა: ღვთაების ტაძარი VIII–IX საუკუნეებისა, სამების და კვირიაცხოვლის
    მცირე ეკლესიები.


    ადგილის სახელი მაინც აკადემიამ გაითქვა. XII საუკუნის დასაწყისში დავით აღმაშენებლის დროს არსენ იყალთოელმა
    აქ სასწავლებელი დააარსა, რომელიც გელათთან ერთად ეპოქის ორ მთავარ სამეცნიერო ცენტრად ითვლებოდა. ასწავლიდნენ
    ღვთისმეტყველებას, ფილოსოფიას, რიტორიკას და ასევე პრაქტიკულ ხელობებს — მეღვინეობას, მჭედლობას, კერამიკას.
    გადმოცემით სწორედ აქ სწავლობდა შოთა რუსთაველი; დოკუმენტური დადასტურება არ არსებობს, მაგრამ ტრადიცია
    მყარია.


    აკადემიის შენობა 1616 წელს შაჰ-აბასის ლაშქრობამ დაწვა და დღეს მისი კედლების ნანგრევებია შემორჩენილი
    — თაღები, ფანჯრების ღიობები, სამეურნეო ნაწილი. ეზოში მიწაში ჩაფლული ქვევრები ჩანს: აქ ღვინოს თავად
    ამზადებდნენ. ადგილი მშვიდი და ჩრდილიანია, ტურისტული ნაკადი ალავერდზე ბევრად ნაკლები, და სწორედ ეს
    ხდის მას სასიამოვნო გაჩერებად. იყალთოში დღესაც ტარდება ღვთისმსახურება და ტერიტორია მოვლილია, თუმცა
    აკადემიის ნანგრევები შეგნებულად აღუდგენელი დარჩა. სწორედ ეს კონტრასტი — ცოცხალი ეკლესია და გაშიშვლებული,
    უსახურავო სასწავლებელი — ქმნის ადგილის მთავარ შთაბეჭდილებას.
  tip: >-
    იყალთო ალავერდის ბუნებრივი წყვილია — ორივე თელავიდან ნახევარ საათშია და ერთ დილაში ორივე მოინახულება.
    საათი სავსებით საკმარისია. ეკლესიაში მოკრძალებული ჩაცმაა საჭირო, თავსაბურავები შესასვლელთან დევს.
    მანქანა ეზოს წინ, ხეების ჩრდილში დგება. შესვლა უფასოა, თუმცა სანთლებისთვის ხურდა გქონდეთ. კაფე და
    ბანკომატი მხოლოდ თელავშია, ტუალეტი — ტერიტორიაზე.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ ახმეტის გზაზე დასავლეთით ხუთიოდე კილომეტრი
    და მარცხნივ, სოფელ იყალთოსკენ მოსახვევი — სულ დაახლოებით 100 კმ და ორ საათამდე. მთელი გზა ასფალტიანია,
    ბოლო ორი კილომეტრი ვიწრო სოფლის ქუჩაა აღმართით. ეკონომ კლასის მანქანა საკმარისია. საწვავს თელავში
    ავსებთ. ზამთარში, თუ გომბორი თოვლის გამო დაიკეტა, გადით საგარეჯო–გურჯაანის ბრტყელი გზით.
en:
  name: Ikalto Academy
  short: A sixth-century monastery with the ruins of a medieval academy where, by tradition, Shota Rustaveli
    studied.
  body: >-
    Ikalto lies about ten kilometres west of Telavi on the slope of the Tsiv-Gombori range, in a shaded
    yard of cypresses and plane trees. The monastery was founded in the sixth century by **Zenon of Ikalto**,
    one of the Assyrian Fathers, and his tomb is in the main church. Three churches stand on the grounds:
    the Church of the Holy Spirit, dated to the eighth or ninth century, and the smaller Trinity and Kvirike
    churches beside it.


    What made the name, though, was the academy. In the early twelfth century, under David the Builder,
    Arsen of Ikalto established a school here that ranked alongside Gelati as one of the two leading centres
    of learning of the age. Students were taught theology, philosophy and rhetoric, but also practical
    crafts — winemaking, smithing, pottery. Tradition holds that Shota Rustaveli studied here; there is
    no documentary proof, but the association is old and firmly held.


    The academy building was burned during Shah Abbas's campaign in 1616, and what remains is the shell
    of its walls: arches, window openings, the working rooms at one end. In the yard you can see qvevri
    sunk into the ground, evidence that wine was made on site. The place is quiet and shaded, with a fraction
    of the visitor traffic that Alaverdi gets, and that alone makes it a rewarding stop.
  tip: >-
    Ikalto pairs naturally with Alaverdi — both are half an hour from Telavi and fit into one morning.
    An hour on site is enough. Modest dress is expected in the churches and head coverings are laid out
    at the door. Park in front of the yard, in the shade of the trees. Entry is free, though small change
    is useful for candles. Cafés and ATMs are only in Telavi; there is a toilet on the grounds.
  route: >-
    From Tbilisi cross the Gombori Pass to Telavi (95 km), then take the Akhmeta road west for around
    five kilometres and turn left towards the village of Ikalto — roughly 100 km and just under two hours
    in total. The whole route is asphalt; the final two kilometres are a narrow village street climbing
    gently uphill. An economy car handles it without difficulty. Fill up in Telavi. In winter, if Gombori
    is closed by snow, use the flat Sagarejo–Gurjaani road instead.
ru:
  name: Академия Икалто
  short: Монастырь VI века и руины средневековой академии, где, по преданию, учился Шота Руставели.
  body: >-
    Икалто расположен примерно в десяти километрах западнее Телави, на склоне Цив-Гомборского хребта,
    в тенистом дворе с кипарисами и платанами. Монастырь основал в VI веке **Зенон Икалтойский**, один
    из ассирийских отцов, его гробница находится в главном храме. На территории три церкви: храм Святого
    Духа VIII–IX веков и меньшие церкви Троицы и Квирике рядом с ним.


    Известность месту принесла всё же академия. В начале XII века при Давиде Строителе Арсен Икалтойский
    основал здесь школу, которая наряду с Гелати считалась одним из двух главных научных центров эпохи.
    Преподавали богословие, философию и риторику, но также и практические ремёсла — виноделие, кузнечное
    дело, керамику. По преданию именно здесь учился Шота Руставели; документальных подтверждений нет,
    но традиция устойчивая.


    Здание академии сожгли во время похода шаха Аббаса в 1616 году, и сегодня от него остались стены:
    арки, оконные проёмы, хозяйственная часть в торце. Во дворе видны вкопанные в землю квеври — вино
    делали прямо здесь. Место тихое и тенистое, поток посетителей несравнимо меньше, чем в Алаверди, и
    уже одно это делает остановку приятной.
  tip: >-
    Икалто естественно объединяется с Алаверди: оба в получасе от Телави и укладываются в одно утро. Часа
    на месте достаточно. В храмах нужна скромная одежда, платки лежат у входа. Машину оставляют перед
    двором, в тени деревьев. Вход бесплатный, но мелочь пригодится на свечи. Кафе и банкоматы есть только
    в Телави, туалет — на территории.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави (95 км), затем по дороге на Ахмету на запад около пяти
    километров и налево, к селу Икалто, — всего примерно 100 км и чуть меньше двух часов. Весь маршрут
    асфальтовый, последние два километра — узкая сельская улица с пологим подъёмом. Машина эконом-класса
    справляется без труда. Заправляйтесь в Телави. Зимой, если Гомбори закрыт из-за снега, используйте
    ровную дорогу через Сагареджо и Гурджаани.
fa:
  name: آکادمی ایکالتو
  short: >-
    صومعه‌ای از سدهٔ ششم با ویرانه‌های آکادمی‌ای از سده‌های میانه که بنا بر سنت شوتا روستاولی در آن درس
    خوانده است.
  body: >-
    ایکالتو حدود ده کیلومتر غرب تلاوی روی دامنهٔ رشته‌کوه تسیو-گومبوری قرار دارد، در حیاطی سایه‌دار از
    سروها و چنارها. صومعه در سدهٔ ششم به دست **زنون ایکالتویی**، یکی از پدران آشوری، بنیاد گذاشته شد و
    آرامگاه او در کلیسای اصلی است. سه کلیسا در محوطه ایستاده‌اند: کلیسای روح‌القدس، متعلق به سدهٔ هشتم
    یا نهم، و دو کلیسای کوچک‌تر تثلیث و کویریکه در کنارش.


    اما آنچه نام اینجا را ساخت، آکادمی بود. در آغاز سدهٔ دوازدهم، در روزگار داوود سازنده، آرسن ایکالتویی
    مدرسه‌ای اینجا برپا کرد که در کنار گلاتی یکی از دو مرکز پیشروی دانش آن روزگار به‌شمار می‌رفت. به دانشجویان
    الهیات، فلسفه و بلاغت می‌آموختند، اما همچنین پیشه‌های عملی — شراب‌سازی، آهنگری و سفالگری. سنت می‌گوید
    شوتا روستاولی اینجا درس خوانده است؛ سندی در دست نیست، اما این پیوند کهن است و سخت ریشه دوانده.


    ساختمان آکادمی در لشکرکشی شاه عباس در 1616 سوخت و آنچه مانده پوستهٔ دیوارهای آن است: طاق‌ها، بازشوهای
    پنجره و اتاق‌های کار در یک سو. در حیاط می‌توانید کوِوری‌های فرورفته در خاک را ببینید، نشانهٔ آنکه
    اینجا شراب می‌ساخته‌اند. جا آرام و سایه‌دار است، با کسری از رفت‌وآمدی که آلاوردی دارد، و همین به‌تنهایی
    آن را به توقفی ارزشمند بدل می‌کند.
  tip: >-
    ایکالتو به‌طور طبیعی با آلاوردی جفت می‌شود — هر دو نیم ساعت از تلاوی فاصله دارند و در یک صبح جا می‌شوند.
    یک ساعت در محوطه کافی است. در کلیساها پوشش محجوب انتظار می‌رود و روسری‌ها کنار در گذاشته شده‌اند.
    ماشین را جلوی حیاط، زیر سایهٔ درختان پارک کنید. ورود رایگان است، هرچند پول خرد برای شمع به کار می‌آید.
    کافه و خودپرداز تنها در تلاوی هست؛ سرویس بهداشتی در محوطه است.
  route: >-
    از تفلیس گردنهٔ گومبوری را تا تلاوی (95 کیلومتر) بگذرید، سپس جادهٔ آخمتا را به سمت غرب حدود پنج کیلومتر
    بروید و به چپ، به سوی روستای ایکالتو بپیچید — روی‌هم نزدیک 100 کیلومتر و کمی کمتر از دو ساعت. تمام
    مسیر آسفالت است؛ دو کیلومتر پایانی کوچه‌ای باریک روستایی است که با شیبی ملایم بالا می‌رود. ماشین اقتصادی
    بدون دردسر از پسش برمی‌آید. در تلاوی سوخت‌گیری کنید. زمستان‌ها اگر گومبوری زیر برف بسته باشد، به‌جایش
    از جادهٔ هموار ساگارجو–گورجاانی استفاده کنید.
he:
  name: אקדמיית איקלטו
  short: מנזר מן המאה ה-6 עם חורבות אקדמיה מימי הביניים, שעל פי המסורת למד בה שוטא רוסתאוולי.
  body: >-
    איקלטו שוכנת כעשרה קילומטרים ממערב לטלאווי, על מדרון רכס ציב-גומבורי, בחצר מוצלת של ברושים ודולבים.
    המנזר נוסד במאה ה-6 בידי **זנון מאיקלטו**, אחד האבות האשורים, וקברו נמצא בכנסייה הראשית. שלוש כנסיות
    עומדות בשטח: כנסיית רוח הקודש, המתוארכת למאה ה-8 או ה-9, ולצידה כנסיות השילוש וקוויריקה הקטנות יותר.


    ואולם את השם עשתה האקדמיה. בראשית המאה ה-12, בימי דוד הבנאי, הקים כאן ארסן מאיקלטו בית מדרש שנחשב
    לצד גלאטי לאחד משני מרכזי הלימוד המובילים של התקופה. התלמידים למדו תיאולוגיה, פילוסופיה ורטוריקה,
    אך גם מלאכות מעשיות — ייצור יין, נפחות וקדרות. המסורת גורסת ששוטא רוסתאוולי למד כאן; אין לכך הוכחה
    תיעודית, אך הקישור עתיק ומושרש היטב.


    מבנה האקדמיה נשרף במסע המלחמה של השאה עבאס ב-1616, ומה שנותר הוא שלד קירותיו: קשתות, פתחי חלונות וחדרי
    העבודה בקצה האחד. בחצר אפשר לראות כדי קווברי שקועים באדמה, עדות לכך שיין נעשה כאן במקום. המקום שקט
    ומוצל, ותנועת המבקרים בו היא שבריר מזו של אלאוורדי, וכבר בכך יש כדי להפוך אותו לעצירה מתגמלת.
  tip: >-
    איקלטו משתלבת באופן טבעי עם אלאוורדי — שתיהן במרחק חצי שעה מטלאווי ונכנסות לבוקר אחד. שעה במקום מספיקה.
    בכנסיות מצופה לבוש צנוע וכיסויי ראש מונחים ליד הדלת. אפשר להחנות לפני החצר, בצל העצים. הכניסה חינם,
    אך כדאי להחזיק כסף קטן לנרות. בתי קפה וכספומטים יש רק בטלאווי; בשטח המנזר יש שירותים.
  route: >-
    מטביליסי חוצים את מעבר גומבורי אל טלאווי (95 ק״מ), משם ממשיכים מערבה בכביש אחמטה כחמישה קילומטרים
    ופונים שמאלה לכיוון הכפר איקלטו — בסך הכול כ-100 ק״מ ומעט פחות משעתיים. כל המסלול סלול; שני הקילומטרים
    האחרונים הם רחוב כפרי צר שעולה בשיפוע מתון. רכב אקונומי מתמודד איתו בלי שום קושי. מלאו דלק בטלאווי.
    בחורף, אם מעבר גומבורי סגור בשלג, השתמשו במקומו בכביש השטוח סאגארג'ו–גורג'אני.
ar:
  name: أكاديمية إيكالتو
  short: دير من القرن السادس مع أطلال أكاديمية من العصور الوسطى يقول التقليد إن شوتا روستافيلي درس فيها.
  body: >-
    تقع إيكالتو على نحو عشرة كيلومترات غرب تيلافي على منحدر سلسلة تسيف-غومبوري، في ساحة ظليلة من أشجار
    السرو والدلب. أسّس الدير في القرن السادس **زينون الإيكالتي**، أحد الآباء الآشوريين، وقبره في الكنيسة
    الرئيسية. وتقوم في الساحة ثلاث كنائس: كنيسة الروح القدس المؤرخة بالقرن الثامن أو التاسع، وإلى جانبها
    كنيستا الثالوث وكفيريكي الأصغر.


    غير أن ما صنع الاسم هو الأكاديمية. ففي مطلع القرن الثاني عشر، في عهد داود الباني، أنشأ أرسين الإيكالتي
    هنا مدرسة عُدّت إلى جانب غيلاتي أحد أبرز مركزي العلم في ذلك العصر. كان الطلاب يدرسون اللاهوت والفلسفة
    والبلاغة، وأيضاً الحرف العملية — صناعة النبيذ والحدادة والفخار. ويقول التقليد إن شوتا روستافيلي درس
    هنا؛ ولا دليل وثائقي على ذلك، لكن الصلة قديمة وراسخة.


    أُحرق مبنى الأكاديمية خلال حملة الشاه عباس عام 1616، وما بقي منه هيكل جدرانه: أقواس وفتحات نوافذ وغرف
    العمل في أحد طرفيه. وفي الساحة ترى جرار كفيفري مغروسة في الأرض، دليلاً على أن النبيذ كان يُصنع في
    الموقع. والمكان هادئ ظليل، وحركة الزوار فيه جزء يسير مما تشهده ألافيردي، وهذا وحده يجعله محطة مجزية.
  tip: >-
    تقترن إيكالتو طبيعياً بألافيردي — فكلتاهما على بعد نصف ساعة من تيلافي وتتسع لهما صبيحة واحدة. وساعة
    في الموقع تكفي. ويُتوقع اللباس المحتشم في الكنائس، وأغطية الرأس موضوعة عند الباب. اركن أمام الساحة
    في ظل الأشجار. والدخول مجاني، وإن كانت النقود الصغيرة مفيدة لشراء الشموع. أما المقاهي وأجهزة الصراف
    الآلي فلا توجد إلا في تيلافي؛ وفي الموقع دورة مياه.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي (95 كم)، ثم اسلك طريق أخميتا غرباً نحو خمسة كيلومترات وانعطف
    يساراً نحو قرية إيكالتو — أي نحو 100 كم وأقل قليلاً من ساعتين إجمالاً. والمسار كله معبّد؛ والكيلومتران
    الأخيران شارع قروي ضيق يصعد بلطف. وسيارة اقتصادية تتولى الأمر دون أي عناء. املأ الخزان في تيلافي.
    وفي الشتاء، إن أُغلق ممر غومبوري بالثلج، استخدم بدلاً منه طريق ساغاريجو–غورجاني المستوي.
