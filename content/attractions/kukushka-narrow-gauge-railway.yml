ka:
  name: „კუკუშკა“ — ბორჯომ-ბაკურიანის ვიწროლიანდაგიანი რკინიგზა და ცაღვერის ხიდი
  short: >-
    1902 წელს გაყვანილი 37-კილომეტრიანი ვიწროლიანდაგიანი ხაზი, რომელიც ბორჯომიდან ბაკურიანამდე ორნახევარ
    საათში ადის.
  body: >-
    **ეს საქართველოში შემორჩენილი ერთადერთი მოქმედი ვიწროლიანდაგიანი რკინიგზაა.** ხაზი 1902 წელს გაიხსნა,
    ლიანდაგის სიგანე 900 მილიმეტრია და მთელი მანძილი ბორჯომიდან ბაკურიანამდე 37 კილომეტრია. ამ 37 კილომეტრს
    მატარებელი დაახლოებით ორნახევარ საათს ანდომებს — რადგან ამავე დროს რვაასი მეტრით მაღლა უნდა აიყვანოს
    თავი. სახელი „კუკუშკა“ ძველი ორთქლმავლის სასტვენს უკავშირდება.


    ხაზი 1967 წელს გაელექტრიფიცირდა და საბჭოთა კავშირში ერთ-ერთი პირველი ელექტრიფიცირებული ვიწროლიანდაგიანი
    გზა იყო; დღემდე ორ-სამვაგონიანი შემადგენლობა საკონტაქტო ქსელქვეშ დადის. გზა ტყეში, ხეობის კალთაზე
    მიიკლაკნება და ხშირად ისეთი ნელი სვლით მიდის, რომ ფანჯრიდან ხელით ჟოლოს მოწყვეტა თითქმის შესაძლებელია.


    მარშრუტის მთავარი ღირსშესანიშნაობა **ცაღვერთან, მდინარე წემისწყალზე გადებული ლითონის ხიდია** — 1902
    წლის მოხდენილი გისოსური კონსტრუქცია, რომელსაც ტრადიციულად გუსტავ ეიფელის ფირმას მიაწერენ. დოკუმენტურად
    ეს ატრიბუცია დადასტურებული არაა, მაგრამ ხიდი მართლაც ეპოქის საუკეთესო საინჟინრო ნიმუშია და მას გზიდანაც
    კარგად ხედავ, თუ მატარებელში არ ჯდები.


    შუალედური სადგურებია ცემი, პატარა ცემი, ცაღვერი და საკოჭავი — მცირე ხის შენობები, რომელთა ნაწილი ჯერ
    კიდევ თავდაპირველია.


    რასაც არ უნდა ელოდო: ეს არა სამუზეუმო ატრაქციონი, არამედ ჩვეულებრივი ადგილობრივი მიმოსვლაა. სავარძლები
    მაგარია, ვაგონები ზამთარში ცივი და ხშირად ადგილობრივებით და მათი ჩანთებით სავსე. სამაგიეროდ ბილეთი
    უმნიშვნელო ღირს და მარშრუტის შუა მონაკვეთის ხედები რეალურად კარგია. მოძრაობა დღეში ჩვეულებრივ ორჯერაა
    თითო მიმართულებით, თუმცა სარემონტო სამუშაოების გამო ხაზი ხანდახან ჩერდება — გამგზავრებამდე ადგილზე
    გადაამოწმე.
  tip: >-
    სრული მარშრუტი ერთი მიმართულებით ორნახევარ საათს გრძელდება, ანუ მთელი დღე ორივე მხარეს არ გამოგივა
    — ბევრი ერთი მიმართულებით მიდის და უკან ტაქსით ან საკუთარი მანქანით ბრუნდება. ბორჯომში ჩასხდომა პარკის
    სადგურიდანაა, ცენტრალურ პარკთან ახლოს. ტუალეტი მატარებელში არაა. თბილი ტანსაცმელი აიღე ზაფხულშიც:
    ბაკურიანში ბორჯომზე რვა-ათი გრადუსით ცივა. საჭმელი და წყალი წინასწარ იყიდე, გზაში არსად არ ჩერდები.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ სამხრეთით ბორჯომის მიმართულებით — 162 კმ, ორ საათსა და ოც-ოცდახუთ
    წუთში. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. ბორჯომ-პარკის სადგური ქალაქის ცენტრში, ცენტრალურ
    პარკთან ახლოსაა, პარკინგი გზისპირას უფასოა. თუ მატარებელში არ ჯდები და მხოლოდ ეიფელის ხიდის ნახვა
    გინდა, ბაკურიანის გზით ცაღვერამდე აიღე — ხიდი სოფლის ზემოთ, გზიდან ჩანს. საწვავი ხაშურსა და ბორჯომში.
en:
  name: The Kukushka narrow-gauge railway and the Tsagveri bridge
  short: >-
    A 37-kilometre narrow-gauge line opened in 1902 that takes two and a half hours to climb from Borjomi
    to Bakuriani.
  body: >-
    **This is the only working narrow-gauge railway left in Georgia.** The line opened in 1902, the track
    is 900 millimetres wide, and the whole distance from Borjomi to Bakuriani is 37 kilometres. The train
    needs about two and a half hours to cover them, because in the same stretch it has to lift itself
    some eight hundred metres. The nickname Kukushka, the cuckoo, comes from the whistle of the old steam
    engines.


    The line was electrified in 1967 and was among the first electrified narrow-gauge railways in the
    Soviet Union; two or three carriages still run under the overhead wire. The track winds through forest
    along the valley side, often slowly enough that you could almost pick raspberries through the window.


    The set piece of the route is **the steel bridge over the Tsemistskali river near Tsagveri** — an
    elegant lattice span of 1902 traditionally credited to Gustave Eiffel's company. The attribution has
    never been documented, but the bridge is genuinely a fine piece of period engineering, and you can
    see it perfectly well from the road if you are not taking the train.


    The intermediate stops are Tsemi, Patara Tsemi, Tsagveri and Sakochavi: small wooden station buildings,
    some of them still original.


    What not to expect: this is not a heritage attraction but an ordinary local service. The seats are
    hard, the carriages are cold in winter and often full of villagers with their shopping. In exchange
    the ticket costs almost nothing and the views on the middle section are genuinely good. There are
    usually two departures a day in each direction, though the line is suspended from time to time for
    track repairs, so check locally before planning a day around it.
  tip: >-
    The full run in one direction takes two and a half hours, so doing it both ways eats a whole day;
    many people ride one way and return by taxi or by their own car. In Borjomi you board at the Park
    station, near the central park. There is no toilet on the train. Bring warm clothes even in summer,
    since Bakuriani is eight to ten degrees colder than Borjomi. Buy food and water beforehand, because
    the train makes no useful stops.
  route: >-
    From Tbilisi take the E60 to Khashuri, then turn south towards Borjomi — 162 km, about two hours and
    twenty-five minutes. The road is asphalt throughout and in good condition. Borjomi Park station sits
    in the centre of town beside the central park, with free parking along the street. If you are not
    riding the train and only want to see the Eiffel bridge, drive the Bakuriani road as far as Tsagveri;
    the span stands above the village and is visible from the road. Fuel in Khashuri and Borjomi.
ru:
  name: Узкоколейка «Кукушка» Боржоми — Бакуриани и Цагверский мост
  short: >-
    Открытая в 1902 году узкоколейная линия длиной 37 километров, поднимающаяся из Боржоми в Бакуриани
    за два с половиной часа.
  body: >-
    **Это единственная действующая узкоколейка, оставшаяся в Грузии.** Линию открыли в 1902 году, ширина
    колеи — 900 миллиметров, а всё расстояние от Боржоми до Бакуриани составляет 37 километров. На них
    поезд тратит около двух с половиной часов, потому что за то же время должен подняться примерно на
    восемьсот метров. Прозвище «кукушка» пошло от гудка старых паровозов.


    В 1967 году линию электрифицировали — она была одной из первых электрифицированных узкоколеек в Советском
    Союзе, и два-три вагона до сих пор идут под контактным проводом. Путь вьётся лесом по склону ущелья,
    часто настолько медленно, что малину впору рвать прямо из окна.


    Главный сюжет маршрута — **металлический мост через реку Цемисцкали у Цагвери**, изящная решётчатая
    конструкция 1902 года, которую по традиции приписывают фирме Гюстава Эйфеля. Документально это никогда
    не подтверждалось, но мост действительно хороший образец инженерии своего времени, и его отлично видно
    с автомобильной дороги, если вы не едете поездом.


    Промежуточные станции — Цеми, Патара Цеми, Цагвери и Сакочави: небольшие деревянные здания, часть
    из них ещё первоначальные.


    Чего не стоит ждать: это не музейный аттракцион, а обычный местный рейс. Сиденья жёсткие, зимой в
    вагонах холодно, и часто они полны местных с сумками. Зато билет стоит сущие копейки, а виды на среднем
    участке действительно хороши. Обычно бывает по два отправления в день в каждую сторону, но линию время
    от времени закрывают на ремонт пути, так что перед поездкой стоит уточнить на месте.
  tip: >-
    Полный маршрут в одну сторону занимает два с половиной часа, так что поездка туда и обратно съедает
    целый день; многие едут в одну сторону и возвращаются на такси или на своей машине. В Боржоми садятся
    на станции Боржоми-Парк, рядом с центральным парком. Туалета в поезде нет. Тёплую одежду берите даже
    летом: в Бакуриани на восемь-десять градусов холоднее, чем в Боржоми. Еду и воду купите заранее, поезд
    нигде толком не стоит.
  route: >-
    Из Тбилиси по трассе E60 до Хашури, затем поворот на юг к Боржоми — 162 км, примерно два часа двадцать
    пять минут. Дорога асфальтированная и в хорошем состоянии. Станция Боржоми-Парк находится в центре
    города у центрального парка, парковка вдоль улицы бесплатная. Если поезд вам не нужен и хочется только
    увидеть «эйфелев» мост, поезжайте по дороге на Бакуриани до Цагвери: пролёт стоит выше села и виден
    с трассы. Заправки — в Хашури и Боржоми.
fa:
  name: راه‌آهن خط‌باریک کوکوشکا و پل تساگوری
  short: خط ریلی خط‌باریک به طول ۳۷ کیلومتر که در ۱۹۰۲ گشوده شد و در دو ساعت‌ونیم از بورجومی به باکوریانی
    بالا می‌رود.
  body: >-
    **این تنها راه‌آهن خط‌باریک فعالی است که در گرجستان مانده است.** خط در سال ۱۹۰۲ گشوده شد، عرض ریل
    ۹۰۰ میلی‌متر است و همهٔ فاصلهٔ بورجومی تا باکوریانی ۳۷ کیلومتر. قطار برای همین ۳۷ کیلومتر حدود دو
    ساعت‌ونیم وقت می‌گذارد، چون در همان مسیر باید نزدیک هشتصد متر بالا بکشد. نام کوکوشکا، یعنی فاخته،
    از سوت لکوموتیوهای بخار قدیمی گرفته شده است.


    خط در ۱۹۶۷ برقی شد و از نخستین خطوط باریک برقی اتحاد شوروی بود؛ هنوز دو یا سه واگن زیر سیم بالاسری
    حرکت می‌کنند. ریل در جنگل و بر دامنهٔ دره می‌پیچد و اغلب چنان کند می‌رود که تقریباً می‌شود از پنجره
    تمشک چید.


    نقطهٔ اوج مسیر **پل فلزی روی رود تسمیستسکالی نزدیک تساگوری است** — دهانه‌ای خرپایی و خوش‌ترکیب از
    سال ۱۹۰۲ که به‌طور سنتی به شرکت گوستاو ایفل نسبت داده می‌شود. این انتساب هرگز مستند نشده، اما پل واقعاً
    نمونهٔ خوبی از مهندسی دوران خود است و اگر سوار قطار نشوید هم از جادهٔ ماشین‌رو به‌خوبی دیده می‌شود.


    ایستگاه‌های میانی تسمی، پاتارا تسمی، تساگوری و ساکوچاوی‌اند: ساختمان‌های چوبی کوچک که بخشی از آنها
    هنوز اصل است.


    آنچه نباید انتظار داشت: این یک جاذبهٔ موزه‌ای نیست، سرویسی محلی و معمولی است. صندلی‌ها سخت‌اند، واگن‌ها
    زمستان سرد می‌شوند و اغلب پر از اهالی و خریدهایشان است. در عوض بلیت تقریباً هیچ هزینه‌ای ندارد و مناظر
    بخش میانی واقعاً خوب است. معمولاً روزی دو حرکت در هر جهت هست، هرچند خط گاهی برای تعمیر ریل تعطیل می‌شود،
    پس پیش از برنامه‌ریزی در محل بپرسید.
  tip: >-
    مسیر کامل در یک جهت دو ساعت‌ونیم طول می‌کشد، پس رفت و برگشت یک روز کامل را می‌بلعد؛ بسیاری یک طرف
    را با قطار می‌روند و با تاکسی یا خودروی خود بازمی‌گردند. در بورجومی از ایستگاه پارک، نزدیک پارک مرکزی،
    سوار می‌شوید. در قطار سرویس بهداشتی نیست. حتی در تابستان لباس گرم ببرید، چون باکوریانی هشت تا ده درجه
    از بورجومی سردتر است. خوراکی و آب را از پیش بخرید، قطار توقف به‌دردبخوری ندارد.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری بروید و سپس به جنوب به سوی بورجومی بپیچید — ۱۶۲ کیلومتر و حدود دو
    ساعت و بیست‌وپنج دقیقه. جاده تا انتها آسفالت و در وضعیت خوب است. ایستگاه پارک بورجومی در مرکز شهر
    و کنار پارک مرکزی است و پارک خودرو در خیابان رایگان. اگر قطار نمی‌خواهید و فقط پل ایفل را می‌بینید،
    جادهٔ باکوریانی را تا تساگوری برانید؛ پل بالای روستا و از جاده پیداست. سوخت در خاشوری و بورجومی.
he:
  name: רכבת המסילה הצרה קוקושקה וגשר צגברי
  short: קו מסילה צרה באורך 37 ק״מ שנפתח ב-1902 ומטפס מבורג'ומי לבקוריאני בשעתיים וחצי.
  body: >-
    **זו רכבת המסילה הצרה הפעילה היחידה שנותרה בגאורגיה.** הקו נפתח ב-1902, רוחב המסילה 900 מילימטר, וכל
    המרחק מבורג'ומי לבקוריאני הוא 37 קילומטרים. הרכבת זקוקה לכשעתיים וחצי כדי לעבור אותם, משום שבאותו
    קטע עליה גם להתרומם כשמונה מאות מטר. הכינוי קוקושקה, קוקייה, בא משריקת קטרי הקיטור הישנים.


    הקו חושמל ב-1967 והיה בין קווי המסילה הצרה המחושמלים הראשונים בברית המועצות; שניים או שלושה קרונות
    עדיין נוסעים תחת החוט העילי. המסילה מתפתלת ביער לאורך מדרון העמק, ולעיתים קרובות באיטיות כזאת שכמעט
    אפשר לקטוף פטל דרך החלון.


    שיא המסלול הוא **גשר הפלדה מעל נהר צמיסצקאלי סמוך לצגברי** — מפתח סבכה אלגנטי משנת 1902 שמיוחס במסורת
    לחברתו של גוסטב אייפל. הייחוס מעולם לא תועד, אך הגשר הוא באמת דוגמה טובה להנדסת התקופה, ואפשר לראותו
    היטב גם מכביש המכוניות אם אינכם עולים לרכבת.


    התחנות שבדרך הן צמי, פטרה צמי, צגברי וסקוצ'אבי: מבני תחנה קטנים מעץ, חלקם עדיין מקוריים.


    למה לא לצפות: זו איננה אטרקציה מוזיאלית אלא קו תחבורה מקומי רגיל. המושבים קשים, הקרונות קרים בחורף
    ולא פעם מלאים בתושבי הכפרים ובשקיות הקניות שלהם. בתמורה הכרטיס עולה כמעט כלום, והנופים בקטע האמצעי
    טובים באמת. בדרך כלל יש שתי יציאות ביום לכל כיוון, אך הקו נסגר מדי פעם לשיפוץ מסילה, ולכן כדאי לברר
    במקום לפני שבונים סביבו יום שלם.
  tip: >-
    הנסיעה המלאה לכיוון אחד אורכת שעתיים וחצי, ולכן הלוך ושוב בולעים יום שלם; רבים נוסעים לכיוון אחד וחוזרים
    במונית או ברכבם. בבורג'ומי עולים בתחנת הפארק, ליד הפארק המרכזי. אין שירותים ברכבת. קחו בגדים חמים
    גם בקיץ, שכן בבקוריאני קר בשמונה עד עשר מעלות מבורג'ומי. קנו אוכל ומים מראש, כי הרכבת אינה עוצרת בשום
    מקום שימושי.
  route: >-
    מטביליסי בכביש E60 עד חשורי, ואז פנייה דרומה לכיוון בורג'ומי — 162 ק״מ, כשעתיים ועשרים וחמש דקות.
    הכביש סלול לכל אורכו ובמצב טוב. תחנת בורג'ומי-פארק נמצאת במרכז העיר ליד הפארק המרכזי, והחניה לאורך
    הרחוב חינם. אם אינכם נוסעים ברכבת ורוצים רק לראות את גשר אייפל, סעו בדרך לבקוריאני עד צגברי; המפתח
    עומד מעל הכפר ונראה מן הכביש. תדלוק בחשורי ובבורג'ומי.
ar:
  name: سكة كوكوشكا الضيقة وجسر تساغفيري
  short: خط سكة ضيقة طوله 37 كيلومتراً افتُتح عام 1902 ويصعد من بورجومي إلى باكورياني في ساعتين ونصف.
  body: >-
    **هذه هي سكة الحديد الضيقة الوحيدة التي بقيت عاملة في جورجيا.** افتُتح الخط عام 1902، وعرض السكة 900
    مليمتر، والمسافة كلها من بورجومي إلى باكورياني 37 كيلومتراً. ويحتاج القطار نحو ساعتين ونصف لقطعها،
    لأنه في المسافة نفسها عليه أن يرفع نفسه نحو ثمانمئة متر. واللقب كوكوشكا، أي الوقواق، جاء من صفير القاطرات
    البخارية القديمة.


    كُهرب الخط عام 1967 وكان من أوائل خطوط السكك الضيقة المكهربة في الاتحاد السوفييتي؛ وما زالت عربتان
    أو ثلاث تسير تحت السلك العلوي. تتلوى السكة في الغابة على جانب الوادي، وكثيراً ما تمضي ببطء يكاد يسمح
    بقطف التوت من النافذة.


    وذروة المسار **الجسر الحديدي فوق نهر تسيميستسكالي قرب تساغفيري**، وهو بحر شبكي أنيق من عام 1902 يُنسب
    تقليدياً إلى شركة غوستاف إيفل. لم يُوثَّق هذا النسب قط، لكن الجسر نموذج جيد فعلاً لهندسة عصره، ويُرى
    بوضوح من طريق السيارات إن لم تركب القطار.


    والمحطات الوسيطة هي تسيمي وباتارا تسيمي وتساغفيري وساكوتشافي: مبانٍ خشبية صغيرة بعضها ما زال أصلياً.


    وما لا ينبغي توقعه: هذه ليست جاذبة متحفية بل خدمة محلية عادية. المقاعد صلبة، والعربات باردة في الشتاء
    وكثيراً ما تمتلئ بأهل القرى وأكياس تسوقهم. في المقابل لا تكلف التذكرة شيئاً يُذكر، ومناظر المقطع الأوسط
    جيدة حقاً. وعادة توجد رحلتان يومياً في كل اتجاه، غير أن الخط يتوقف من حين لآخر لإصلاح السكة، فاسأل
    في المكان قبل أن تبني يوماً كاملاً حوله.
  tip: >-
    الرحلة الكاملة في اتجاه واحد ساعتان ونصف، فالذهاب والإياب يبتلعان يوماً كاملاً؛ وكثيرون يركبون في
    اتجاه واحد ويعودون بسيارة أجرة أو بسيارتهم. في بورجومي يكون الركوب من محطة الحديقة قرب الحديقة المركزية.
    ولا توجد دورة مياه في القطار. واحمل ملابس دافئة حتى في الصيف، فباكورياني أبرد من بورجومي بثماني إلى
    عشر درجات. واشترِ الطعام والماء مسبقاً فالقطار لا يقف وقفة مفيدة.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري، ثم انعطف جنوباً نحو بورجومي — 162 كم ونحو ساعتين وخمس وعشرين
    دقيقة. الطريق معبّد على امتداده وبحالة جيدة. تقع محطة بورجومي-الحديقة في وسط المدينة بجوار الحديقة
    المركزية، والوقوف على الشارع مجاني. وإن لم تركب القطار وأردت رؤية جسر إيفل فقط، فسر على طريق باكورياني
    حتى تساغفيري؛ فالجسر فوق القرية ويُرى من الطريق. الوقود في خاشوري وبورجومي.
