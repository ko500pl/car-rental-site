ka:
  name: „კუკუშკა“ — ბორჯომ-ბაკურიანის ვიწროლიანდაგიანი რკინიგზა და წაღვერის ხიდი
  short: >-
    1902 წლის 37-კილომეტრიანი, 900-მილიმეტრიანი ხაზი ბორჯომიდან ბაკურიანამდე, გისოსური ხიდით, რომელსაც
    გადმოცემა გუსტავ ეიფელს მიაწერს.
  body: >-
    **საუკუნეზე მეტია, „კუკუშკა“ 37 კილომეტრს ორნახევარ საათში გადის — და მთელი მისი ხიბლიც სწორედ ამ
    სინელეშია.**


    ხაზის მშენებლობა 1897 წელს, რუსეთის იმპერიის დროს დაიწყო. რელიეფი იმდენად რთული აღმოჩნდა, რომ სამუშაოებმა
    ოთხ წელიწადს გასტანა, პირველი მატარებელი კი 1902 წლის იანვარში გავიდა. ლიანდაგის სიგანე 900 მილიმეტრია;
    820 მეტრზე მდებარე ბორჯომიდან 1700 მეტრზე მდებარე ბაკურიანამდე მატარებელი თითქმის 900 მეტრით ადის,
    საშუალოდ საათში 15 კილომეტრის სიჩქარით. სახელი რუსულად „პატარა გუგულს“ ნიშნავს.


    პირველი ლოკომოტივი ამერიკული ფირმის, „ჰ. კ. პორტერის“ პატარა ორთქლმავალი იყო, მგზავრები კი მოაჯირიან
    ღია ვაგონებში ისხდნენ. 1966 წელს ხაზი გაელექტრიფიცირდა და ორთქლმავალი ჩეხოსლოვაკიურმა, „შკოდას“ წარმოების
    „ნიანგებმა“ შეცვალა. 1991 წლამდე მატარებლები ბაკურიანთან ახლოს მდებარე მაღაროდან ანდეზიტსაც ეზიდებოდნენ.


    მარშრუტის მთავარი სანახაობა წაღვერისა და წემის სადგურებს შორისაა: ჟანგისფერი ფოლადის გისოსური ხიდი
    წვრილ საყრდენებზე, წემისწყლის ხევზე გადებული, რომლის მშენებლობაც 1897 წელს დაიწყო. გადმოცემით, ის
    დიდმა მთავარმა მიხეილ ნიკოლოზის ძემ გუსტავ ეიფელს შეუკვეთა. ამ ატრიბუციას მყარი საბუთი არ უდევს, მაგრამ
    ხიდს გაჩერების ღირსად ცნობილი სახელი არ სჭირდება.


    ხაზის დღევანდელობა კი ბუნდოვანია. მოძრაობა 2022 წელს შეჩერდა, მის აღდგენაზე კი ბაკურიანის განვითარების
    სააგენტო მუშაობს. თუ მატარებელი დადის, აღმა იმგზავრეთ; თუ არა — წაღვერამდე მანქანით ადით და ხიდი ნახეთ.
    გუგული ხომ ყოველთვის უფრო ხშირად ისმის, ვიდრე ჩანს.
  tip: >-
    სანამ მთელ დღეს მატარებელზე ააწყობთ, ბორჯომის სადგურში ან საქართველოს რკინიგზაში გადაამოწმეთ, დადის
    თუ არა ის. როცა დადის, მგზავრობა თითო მიმართულებით ორნახევარი საათია, ამიტომ უმეტესობა მატარებლით
    ადის და უკან მანქანით ბრუნდება. მატარებელში ტუალეტი არ არის, გზაში საჭმელს ვერსად იყიდით. ბაკურიანში
    ბორჯომზე შესამჩნევად ცივა — თბილი ტანსაცმელი ზაფხულშიც აიღეთ. ხიდის საპოვნელად ნავიგატორში ჩაწერეთ
    41.8010, 43.4704. უყურეთ გზიდან ან ნაპირიდან ხიდზე ან ლიანდაგზე კი არავითარ შემთხვევაში არ გახვიდეთ.
  route: >-
    თბილისიდან E60/ს1-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კილომეტრია, შემდეგ ს8-ით სამხრეთისკენ
    ბორჯომამდე — სულ 162 კილომეტრი, დაახლოებით 2 საათი და 25 წუთი, მთლიანად ასფალტზე. ვიწროლიანდაგიანი
    რკინიგზის სადგური ბორჯომის ცენტრშია, ცენტრალური პარკიდან რამდენიმე წუთის სავალზე, მანქანის დასაყენებელი
    ადგილი ქუჩაზეა. თუ მატარებლის გარეშე მხოლოდ ხიდის ნახვა გსურთ, ბორჯომიდან შ20-ით, ბაკურიანის გზით
    წაღვერამდე ადით: ხიდი გზიდან დაახლოებით ნახევარ კილომეტრშია. საწვავი ხაშურში ან ბორჯომში ჩაასხით.
    ეკონომკლასის მანქანა საკმარისია, დეკემბრიდან მარტამდე — ზამთრის საბურავებით.
en:
  name: The Kukushka narrow-gauge railway and the Tsagveri bridge
  short: >-
    A 37-kilometre, 900-mm line of 1902 climbing from Borjomi to Bakuriani over a lattice bridge that
    tradition credits to Gustave Eiffel.
  body: >-
    **For more than a century the Kukushka has taken two and a half hours to cover 37 kilometres, and
    that slowness is exactly the point.**


    Work on the line began in 1897, when Georgia was part of the Russian Empire. The terrain was so difficult
    that construction took four years, and the first train ran in January 1902. The track is 900 millimetres
    wide, and between Borjomi at 820 metres and Bakuriani at 1,700 it climbs almost 900 metres at an average
    of 15 km/h. Its name is Russian for "little cuckoo".


    The first engine was a small steam locomotive built by H.K. Porter in America, and passengers rode
    in open carriages with handrails. In 1966 the line was electrified and the steam engine gave way to
    Škoda "crocodile" locomotives from Czechoslovakia. Until 1991 the trains also hauled andesite down
    from a mine near Bakuriani.


    The set piece lies between Tsagveri and Tsemi stations: a rust-red steel lattice bridge on slender
    trestles over the Tsemistskali ravine, begun in 1897. Tradition says Grand Duke Mikhail Nikolayevich
    ordered it from Gustave Eiffel. The attribution rests on thin evidence, but the bridge needs no famous
    name to earn a stop.


    Be ready for the line's uncertain present. Service was suspended in 2022, and the Bakuriani Development
    Agency has been working to restore it. If the train is running, ride it uphill; if not, drive to Tsagveri
    and look at the bridge. A cuckoo, after all, is heard far more often than it is seen.
  tip: >-
    Before planning a day around the train, check at Borjomi station or with Georgian Railway whether
    it is running. When it runs, the journey takes two and a half hours each way, so most people ride
    up and return by road. There is no toilet on board, and nowhere useful to buy food along the way.
    Bakuriani is noticeably colder than Borjomi, so take a warm layer even in summer. To find the bridge,
    set your navigator to 41.8010, 43.4704. Look from the road or the bank, and never walk onto the bridge
    or the track.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south to Borjomi: 162 km,
    roughly 2 hours 25 minutes, asphalt throughout. The narrow-gauge station is in the centre of Borjomi,
    a few minutes' walk from the Central Park, with street parking nearby. To see the bridge without the
    train, take the Sh20 Bakuriani road out of Borjomi as far as Tsagveri; the bridge stands about half
    a kilometre from the road. Fill up in Khashuri or Borjomi. An economy car is enough, with winter tyres
    from December to March.
ru:
  name: Узкоколейка «Кукушка» и Цагверский мост
  short: >-
    Узкоколейка 1902 года: 37 км из Боржоми в Бакуриани и решётчатый мост, который предание приписывает
    Гюставу Эйфелю.
  body: >-
    **Больше века «Кукушка» тратит два с половиной часа на 37 километров — и весь смысл именно в этой
    неспешности.**


    Строить линию начали в 1897 году, когда Грузия входила в Российскую империю. Местность оказалась настолько
    трудной, что работы растянулись на четыре года, и первый поезд прошёл в январе 1902-го. Ширина колеи
    — 900 миллиметров; между Боржоми на высоте 820 метров и Бакуриани на высоте 1700 дорога набирает почти
    900 метров, двигаясь со средней скоростью 15 км/ч. Имя у неё русское и птичье — «Кукушка».


    Первым локомотивом был небольшой паровоз американской фирмы «Х. К. Портер», а пассажиры ехали в открытых
    вагонах с поручнями. В 1966 году линию электрифицировали, и паровоз уступил место чехословацким электровозам
    «Шкода» по прозвищу «крокодилы». До 1991 года поезда возили вниз ещё и андезит с карьера под Бакуриани.


    Главное зрелище — между станциями Цагвери и Цеми: ржаво-красный стальной решётчатый мост на тонких
    опорах над ущельем Цемисцкали, начатый в 1897 году. Предание гласит, что великий князь Михаил Николаевич
    заказал его Гюставу Эйфелю. Доказательства этой версии скудны, но мосту не нужно громкое имя, чтобы
    ради него стоило остановиться.


    Будьте готовы к тому, что у линии неясное настоящее. В 2022 году движение приостановили, и Агентство
    развития Бакуриани работает над его восстановлением. Если поезд ходит, поезжайте на нём в гору; если
    нет — доезжайте до Цагвери и посмотрите на мост. В конце концов, кукушку гораздо чаще слышат, чем
    видят.
  tip: >-
    Прежде чем строить день вокруг поезда, уточните на вокзале Боржоми или в Грузинской железной дороге,
    ходит ли он. Когда ходит, дорога занимает два с половиной часа в одну сторону, поэтому большинство
    поднимается поездом, а обратно возвращается по шоссе. Туалета в вагонах нет, и толком купить еду по
    пути негде. В Бакуриани заметно холоднее, чем в Боржоми, так что даже летом возьмите тёплую кофту.
    Чтобы найти мост, введите в навигатор 41.8010, 43.4704. Смотрите на него с дороги или с берега и никогда
    не выходите на мост или на пути.
  route: >-
    Из Тбилиси по E60/S1 на запад до Хашури — около 130 км, затем по S8 на юг до Боржоми: 162 км, примерно
    2 часа 25 минут, асфальт на всём пути. Станция узкоколейки находится в центре Боржоми, в нескольких
    минутах ходьбы от Центрального парка, рядом можно встать у обочины. Чтобы увидеть мост без поезда,
    поезжайте из Боржоми по дороге Sh20 на Бакуриани до Цагвери; мост стоит примерно в полукилометре от
    дороги. Заправьтесь в Хашури или Боржоми. Хватит машины эконом-класса, с декабря по март — на зимней
    резине.
fa:
  name: راه‌آهن باریک کوکوشکا و پل تساگوری
  short: >-
    خطی ۳۷ کیلومتری با عرض ریل ۹۰۰ میلی‌متر از سال ۱۹۰۲ که از بورجومی تا باکوریانی بالا می‌رود و از روی
    پلی مشبک می‌گذرد که روایت‌ها آن را کار گوستاو ایفل می‌دانند.
  body: >-
    **بیش از یک قرن است که کوکوشکا دو ساعت و نیم وقت می‌گذارد تا ۳۷ کیلومتر را بپیماید، و لطف ماجرا درست
    در همین کندی است.**


    ساخت این خط در ۱۸۹۷ آغاز شد، زمانی که گرجستان بخشی از امپراتوری روسیه بود. زمین چنان دشوار بود که
    ساخت‌وساز چهار سال طول کشید، و نخستین قطار در ژانویهٔ ۱۹۰۲ به راه افتاد. عرض ریل ۹۰۰ میلی‌متر است
    و خط میان بورجومی در ارتفاع ۸۲۰ متری و باکوریانی در ۱۷۰۰ متری، با سرعت میانگین ۱۵ کیلومتر در ساعت،
    نزدیک به ۹۰۰ متر بالا می‌رود. نامش در زبان روسی به معنای «فاختهٔ کوچک» است.


    نخستین لکوموتیو، لکوموتیو بخار کوچکی ساخت شرکت آمریکایی «اچ. کی. پورتر» بود و مسافران در واگن‌های
    روباز با نرده سفر می‌کردند. در ۱۹۶۶ خط برقی شد و لکوموتیو بخار جای خود را به لکوموتیوهای اشکودا از
    چکسلواکی داد که به «کروکودیل» معروف بودند. تا ۱۹۹۱ قطارها از معدنی نزدیک باکوریانی سنگ آندزیت هم به
    پایین می‌آوردند.


    صحنهٔ اصلی میان ایستگاه‌های تساگوری و تسمی است: پلی مشبک از فولاد، به سرخیِ زنگ آهن، بر پایه‌های باریک،
    بر فراز درهٔ تسمیستسکالی، که ساختش در ۱۸۹۷ آغاز شد. روایت است که دوک بزرگ میخائیل نیکولایویچ آن را
    به گوستاو ایفل سفارش داد. این انتساب بر شواهد اندکی تکیه دارد، اما پل برای آنکه ارزش توقف داشته باشد
    نیازی به نامی مشهور ندارد.


    برای وضعیت نامعلوم کنونی این خط آماده باشید. حرکت قطار در ۲۰۲۲ متوقف شد و آژانس توسعهٔ باکوریانی برای
    راه‌اندازی دوباره‌اش تلاش می‌کند. اگر قطار کار می‌کند، برای مسیر سربالا سوارش شوید؛ اگر نه، تا تساگوری
    برانید و پل را تماشا کنید. هرچه باشد، آواز فاخته را بسیار بیشتر می‌شنوند تا خودش را ببینند.
  tip: >-
    پیش از آنکه یک روز کامل را بر پایهٔ قطار برنامه‌ریزی کنید، در ایستگاه بورجومی یا از راه‌آهن گرجستان
    بپرسید که آیا کار می‌کند. وقتی کار کند، سفر در هر جهت دو ساعت و نیم طول می‌کشد، برای همین بیشتر مردم
    با قطار بالا می‌روند و از جاده برمی‌گردند. در قطار سرویس بهداشتی نیست و در طول راه جای درست‌وحسابی
    برای خرید غذا هم پیدا نمی‌شود. باکوریانی به‌وضوح از بورجومی سردتر است، پس حتی در تابستان یک لایهٔ
    گرم همراه بیاورید. برای یافتن پل، مختصات ۴۱٫۸۰۱۰, ۴۳٫۴۷۰۴ را به مسیریاب بدهید. پل را از جاده یا از
    کرانه تماشا کنید و هرگز پا روی پل یا ریل نگذارید.
  route: >-
    از تفلیس با E60/S1 به سمت غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس با S8 به جنوب تا بورجومی: ۱۶۲
    کیلومتر و حدود ۲ ساعت و ۲۵ دقیقه، سراسر آسفالت. ایستگاه راه‌آهن باریک در مرکز بورجومی است، چند دقیقه
    پیاده تا پارک مرکزی، و همان نزدیکی کنار خیابان جای پارک هست. برای دیدن پل بدون قطار، جادهٔ Sh20 به
    سوی باکوریانی را از بورجومی تا تساگوری بگیرید؛ پل حدود نیم کیلومتر با جاده فاصله دارد. در خاشوری یا
    بورجومی سوخت‌گیری کنید. خودروی اقتصادی کافی است، با لاستیک زمستانی از دسامبر تا مارس.
he:
  name: מסילת הרכבת הצרה "קוקושקה" וגשר צגוורי
  short: >-
    קו באורך 37 קילומטרים וברוחב 900 מ"מ משנת 1902, המטפס מבורג'ומי לבקוריאני על פני גשר סריג שהמסורת
    מייחסת לגוסטב אייפל.
  body: >-
    **כבר יותר ממאה שנה נוסעת הקוקושקה שעתיים וחצי כדי לעבור 37 קילומטרים, והאיטיות הזאת היא בדיוק העניין.**


    העבודות על הקו החלו ב-1897, כשגאורגיה הייתה חלק מהאימפריה הרוסית. השטח היה קשה כל כך שהבנייה נמשכה
    ארבע שנים, והרכבת הראשונה יצאה לדרכה בינואר 1902. רוחב המסילה 900 מילימטרים, ובין בורג'ומי, בגובה
    820 מטר, לבקוריאני, בגובה 1,700 מטר, היא מטפסת כמעט 900 מטר במהירות ממוצעת של 15 קמ"ש. שמה ברוסית
    פירושו "קוקייה קטנה".


    הקטר הראשון היה קטר קיטור קטן מתוצרת החברה האמריקנית "ה. ק. פורטר", והנוסעים ישבו בקרונות פתוחים עם
    מעקות. ב-1966 חושמל הקו, וקטר הקיטור פינה את מקומו לקטרי שקודה מצ'כוסלובקיה, המכונים "תנינים". עד
    1991 הובילו הרכבות במורד גם אנדזיט ממכרה ליד בקוריאני.


    גולת הכותרת נמצאת בין התחנות צגוורי וצמי: גשר סריג מפלדה בצבע אדום-חלודה, על עמודי תמך דקים, מעל ערוץ
    הצמיסצקאלי, שבנייתו החלה ב-1897. המסורת מספרת שהדוכס הגדול מיכאיל ניקולאייביץ' הזמין אותו מגוסטב אייפל.
    הייחוס נשען על ראיות דלות, אבל הגשר אינו זקוק לשם מפורסם כדי להצדיק עצירה.


    היו מוכנים לכך שההווה של הקו אינו ודאי. השירות הופסק ב-2022, והסוכנות לפיתוח בקוריאני פועלת לחדשו.
    אם הרכבת פועלת, עלו בה במעלה ההר; אם לא, סעו לצגוורי והביטו בגשר. אחרי הכול, את הקוקייה שומעים הרבה
    יותר משרואים.
  tip: >-
    לפני שאתם מתכננים יום שלם סביב הרכבת, בררו בתחנת בורג'ומי או בחברת רכבת גאורגיה אם היא פועלת. כשהיא
    פועלת, הנסיעה נמשכת שעתיים וחצי לכל כיוון, ולכן רוב האנשים עולים ברכבת וחוזרים בכביש. אין שירותים
    ברכבת, ואין לאורך הדרך מקום של ממש לקנות אוכל. בבקוריאני קר בהרבה מאשר בבורג'ומי, אז קחו שכבה חמה
    גם בקיץ. כדי למצוא את הגשר, הזינו לניווט 41.8010, 43.4704. הביטו בו מן הכביש או מן הגדה, ולעולם אל
    תעלו על הגשר או על המסילה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק"מ, ואז דרומה בכביש S8 עד בורג'ומי: 162 ק"מ, כ-2
    שעות ו-25 דקות, בכביש סלול לכל אורכו. תחנת הרכבת הצרה נמצאת במרכז בורג'ומי, כמה דקות הליכה מהפארק
    המרכזי, ויש חניה ברחוב בקרבת מקום. כדי לראות את הגשר בלי הרכבת, סעו מבורג'ומי בכביש Sh20 לכיוון בקוריאני
    עד צגוורי; הגשר עומד כחצי קילומטר מן הכביש. תדלקו בחשורי או בבורג'ומי. רכב חסכוני מספיק, עם צמיגי
    חורף מדצמבר עד מרץ.
ar:
  name: سكة كوكوشكا الضيقة وجسر تساغفيري
  short: >-
    خط طوله 37 كيلومترًا وعرض سكته 900 مليمتر، افتُتح عام 1902، يصعد من بورجومي إلى باكورياني عابرًا جسرًا
    شبكيًا تنسبه الرواية الشائعة إلى غوستاف إيفل.
  body: >-
    **منذ أكثر من قرن يستغرق قطار كوكوشكا ساعتين ونصفًا ليقطع 37 كيلومترًا، وهذا البطء هو بيت القصيد.**


    بدأ العمل في الخط عام 1897، حين كانت جورجيا جزءًا من الإمبراطورية الروسية. وكانت التضاريس من الصعوبة
    بحيث استغرق البناء أربع سنوات، وسار أول قطار في يناير 1902. يبلغ عرض السكة 900 مليمتر، وبين بورجومي
    على ارتفاع 820 مترًا وباكورياني على ارتفاع 1700 متر يصعد الخط ما يقارب 900 متر بسرعة متوسطة قدرها
    15 كم/ساعة. واسمه بالروسية يعني «الوقواق الصغير».


    كانت أول قاطرة قاطرةً بخارية صغيرة صنعتها شركة «إتش. كيه. بورتر» الأمريكية، وكان الركاب يستقلّون عربات
    مكشوفة ذات درابزين. وفي 1966 كُهرب الخط وأفسحت القاطرة البخارية المكان لقاطرات سكودا التشيكوسلوفاكية
    الملقّبة بـ«التماسيح». وحتى عام 1991 كانت القطارات تنقل نزولًا أيضًا حجر الأنديزيت من منجم قرب باكورياني.


    أما المشهد الأبرز فيقع بين محطتي تساغفيري وتسيمي: جسر شبكي من الفولاذ بلون الصدأ الأحمر، قائم على
    دعامات نحيلة فوق وادي تسيميستسكالي، بدأ بناؤه عام 1897. وتقول الرواية إن الدوق الأكبر ميخائيل نيكولايفيتش
    طلبه من غوستاف إيفل. هذه النسبة تستند إلى أدلة واهية، لكن الجسر لا يحتاج إلى اسم شهير ليستحق التوقف
    عنده.


    استعدّوا لحاضر الخط الملتبس. توقفت الخدمة عام 2022، وتعمل وكالة تطوير باكورياني على إعادتها. فإن كان
    القطار يعمل، فاركبوه صعودًا؛ وإن لم يكن، فقودوا إلى تساغفيري وتأمّلوا الجسر. فالوقواق، في نهاية المطاف،
    يُسمَع أكثر بكثير مما يُرى.
  tip: >-
    قبل أن تبنوا يومكم حول القطار، تحقّقوا في محطة بورجومي أو لدى سكك حديد جورجيا مما إذا كان يعمل. وحين
    يعمل، تستغرق الرحلة ساعتين ونصفًا في كل اتجاه، لذا يصعد معظم الناس بالقطار ويعودون بالسيارة. لا توجد
    دورة مياه على متنه، ولا مكان يُعتدّ به لشراء الطعام على الطريق. باكورياني أبرد من بورجومي بشكل ملحوظ،
    فاحملوا طبقة دافئة حتى في الصيف. للعثور على الجسر، أدخلوا في جهاز الملاحة 41.8010, 43.4704. شاهدوه
    من الطريق أو من الضفة، ولا تمشوا أبدًا على الجسر أو على السكة.
  route: >-
    من تبليسي خذوا الطريق E60/S1 غربًا حتى خاشوري، نحو 130 كم، ثم S8 جنوبًا حتى بورجومي: 162 كم، ونحو
    ساعتين و25 دقيقة، والطريق معبّد بالكامل. تقع محطة السكة الضيقة في وسط بورجومي، على بعد دقائق سيرًا
    من الحديقة المركزية، ويمكن الوقوف في الشارع قريبًا منها. ولرؤية الجسر من دون القطار، خذوا من بورجومي
    طريق باكورياني Sh20 حتى تساغفيري؛ ويقف الجسر على بعد نحو نصف كيلومتر من الطريق. تزوّدوا بالوقود في
    خاشوري أو بورجومي. تكفي سيارة اقتصادية، مع إطارات شتوية من ديسمبر إلى مارس.
