ka:
  name: ბარეთის ტბა
  short: >-
    არაღრმა, ატმოსფერული ნალექებით ნაკვები ბუნებრივი ტბა თრიალეთის ღია ზეგანზე, 1612 მეტრზე — სეზონზე
    ფრინველით სავსე, წალკის წყალსაცავის ველური მეზობელი.
  body: >-
    **ბარეთის ტბას არცერთი მდინარე არ ასაზრდოებს: მასში ყოველი წვეთი თრიალეთის ზეგანზე მოსული წვიმა და
    თოვლია.**


    ტბა ზღვის დონიდან 1612 მეტრზე, წალკის წყალსაცავის ჩრდილო-აღმოსავლეთით მდებარეობს და, ამ საბჭოთა ჰიდროენერგეტიკული
    წყალსაცავისგან განსხვავებით, სრულიად ბუნებრივია. მას ბაშქოის ტბასაც უწოდებენ. ცნობარები მის ფართობად
    1,34 კვადრატულ კილომეტრს ასახელებენ, მაგრამ სამხრეთ-დასავლეთ ნაპირიდან გაყვანილმა არხმა წყლის დონე
    მნიშვნელოვნად დასწია; ტურიზმის ეროვნული ადმინისტრაცია დღეს ტბის ფართობად დაახლოებით 100 ჰექტარს ასახელებს.
    გასაოცრად არაღრმაა: საშუალო სიღრმე მეტრსაც ვერ აღწევს, ყველაზე ღრმა ადგილას კი დაახლოებით 1,3 მეტრია.
    დონე ყველაზე მაღალი გაზაფხულზეა, ყველაზე დაბალი — ზაფხულის ბოლოს.


    ირგვლივ ფართო ცის ქვეშ ღია, თითქმის უხეო ზეგანი იშლება. ნაპირს დუმფარები და მოყვავილე მცენარეები შემოსავს,
    სეზონზე კი ტბა წყლის ფრინველით ივსება — სწორედ ამიტომ აქეთ ფრინველთა დამკვირვებლები უხვევენ. დაცული
    ტერიტორიების სააგენტო ბარეთს ალგეთის ეროვნული პარკის გაფართოების შემთხვევაში მის შესაძლო ნაწილად განიხილავს.


    წალკის მხარეს თავისი მრავალფენიანი ამბავი აქვს: XIX საუკუნეში აქ ქართველებთან ერთად კავკასიელი ბერძნები
    და სხვა თემები დასახლდნენ, და ზეგანს ეს ნაზავი დღემდე ეტყობა.


    ბარეთი ძლივს მეტრის სიღრმისაა. მოწმენდილ დღეს აქ ყველაზე ღრმა მის თავზე გადაჭიმული ცაა.
  tip: >-
    ტბასთან მისვლა უფასოა; ის არ არის შემოღობილი, ახლოს კი არც კაფეა, არც ბენზინგასამართი და არც საპირფარეშო
    — ყველაფერი წალკაში მოიმარაგეთ. ბინოკლი წაიღეთ და დილით ადრე მოდით, როცა ფრინველი ყველაზე აქტიურია,
    ზეგანის ქარი კი ჯერ არ ამდგარა. 1600 მეტრზე, ღია ადგილას, ივლისშიც შეიძლება შეგცივდეთ, ამიტომ თბილი
    ტანსაცმელიც თან იქონიეთ. ნაპირზე მანქანით ნუ ჩახვალთ: რბილია, ზაფხულის ბოლოს კი, წყლის დაწევისას,
    ტალახად იქცევა. ზამთარში ზეგანს თოვლი ფარავს და გრუნტის გზა გაუვალია. ტბა წალკის წყალსაცავს, დაშბაშის
    კანიონსა და ბეშთაშენს გაუერთიანეთ — ყველა დაახლოებით 15 კილომეტრის რადიუსშია.
  route: >-
    თბილისიდან შ36-ით წყნეთისა და კოჯრის გავლით მანგლისამდე იარეთ, იქიდან კი შ31-ით დასავლეთით, ღია ზეგანზე.
    წალკამდე ცოტა ადრე ადგილობრივ შ169-ზე გადაუხვიეთ ტბის მიმართულებით; ნაპირამდე ბოლო მონაკვეთი ხრეშისა
    და გრუნტის გზაა, ქალაქ წალკიდან კი ტბამდე დაახლოებით ოცი წუთის სავალია. სულ დაახლოებით 87 კმ და ორ
    საათზე ცოტა ნაკლები. კოჯრის შემდეგ ასფალტი აღმართსა და მკვეთრ მოსახვევებს მიუყვება, ზეგანზე კი ძლიერი
    გვერდითი ქარი უბერავს. მშრალ ამინდში ეკონომ-კლასის მანქანაც გაართმევს თავს, წვიმის შემდეგ კი მაღალი
    გამავლობის მანქანა უფრო საიმედოა. საწვავი თბილისში ან წალკაში ჩაასხით.
en:
  name: Bareti Lake
  short: >-
    A shallow, rain-fed natural lake at 1,612 m on the open Trialeti plateau, full of waterfowl in season
    — the wild neighbour of the Tsalka Reservoir.
  body: >-
    **No river feeds Bareti: every drop in this lake fell as rain or snow on the Trialeti plateau.**


    The lake lies at 1,612 metres, north-east of the Tsalka Reservoir, and unlike that Soviet-era hydropower
    lake it is entirely natural. It is also known as Bashkoi. Reference books give it a surface of 1.34
    square kilometres, but a canal cut from the south-western shore has lowered the water considerably;
    Georgia's national tourism board now gives about 100 hectares. It is astonishingly shallow: under
    a metre on average and about 1.3 metres at its deepest. The level peaks in spring and sinks to its
    lowest at the end of summer.


    Around it the plateau spreads open and almost treeless under a wide sky. Water lilies and flowering
    plants fringe the shore, and in season the lake fills with waterfowl, which is why birdwatchers make
    the detour. Georgia's Agency of Protected Areas has marked it as a candidate for an enlarged Algeti
    National Park.


    The Tsalka district has its own layered story: in the 19th century Caucasus Greeks and other communities
    settled here alongside Georgians, and the plateau still carries that mixed character.


    Bareti is barely a metre deep. On a clear day the deepest thing here is the sky above it.
  tip: >-
    The lake is free and unfenced, with no café, fuel or toilets, so stock up in Tsalka. Bring binoculars
    and come early, when the birds are busiest and the plateau wind has not yet risen. Even in July, 1,600
    metres on open ground can feel cold, so pack a warm layer. Do not drive onto the shore: it is soft,
    and in late summer, as the water drops, it turns to mud. In winter the plateau is snowbound and the
    track impassable. Pair the lake with the Tsalka Reservoir, the Dashbashi Canyon and Beshtasheni, all
    within about 15 km.
  route: >-
    Take the Sh36 out of Tbilisi through Tskneti and Kojori to Manglisi, then the Sh31 west across the
    open plateau. A little before Tsalka, turn off onto the minor Sh169 towards the lake; the last stretch
    to the shore is gravel and dirt, and the lake is some twenty minutes' drive from Tsalka town. In all,
    about 87 km and just under two hours. The asphalt climbs with tight bends after Kojori, and crosswinds
    are strong on the plateau. An economy car copes in dry weather; after rain an SUV is the safer choice.
    Refuel in Tbilisi or Tsalka.
ru:
  name: Озеро Барети
  short: >-
    Мелкое озеро дождевого питания на высоте 1612 м на открытом Триалетском плато, в сезон полное водоплавающих
    птиц, — дикий сосед Цалкского водохранилища.
  body: >-
    **Ни одна река не питает Барети: каждая капля в этом озере упала на Триалетское плато дождём или снегом.**


    Озеро лежит на высоте 1612 метров, к северо-востоку от Цалкского водохранилища, и, в отличие от этого
    советского водохранилища ГЭС, оно целиком природное. Его называют также Башкои. Справочники дают площадь
    зеркала в 1,34 квадратного километра, но канал, прорытый от юго-западного берега, заметно понизил
    уровень воды; Национальная администрация туризма Грузии сегодня указывает площадь около 100 гектаров.
    Оно поразительно мелкое: в среднем меньше метра, а в самом глубоком месте — около 1,3 метра. Уровень
    воды выше всего весной и опускается до минимума к концу лета.


    Вокруг раскинулось открытое, почти безлесное плато под огромным небом. Берега окаймлены кувшинками
    и цветущими растениями, а в сезон озеро заполняют водоплавающие птицы — ради них любители птиц и делают
    крюк. Агентство охраняемых территорий Грузии рассматривает озеро как кандидата на включение в расширенный
    Алгетский национальный парк.


    У Цалкского района своя многослойная история: в XIX веке здесь рядом с грузинами поселились кавказские
    греки и другие общины, и плато до сих пор хранит этот смешанный характер.


    Глубина Барети — едва ли метр. В ясный день самое глубокое здесь — небо над ним.
  tip: >-
    Вход на озеро свободный, оно не огорожено; кафе, заправки и туалетов нет, так что запаситесь всем
    в Цалке. Возьмите бинокль и приезжайте пораньше, пока птицы активнее всего, а ветер на плато ещё не
    поднялся. Даже в июле на открытом месте на высоте 1600 метров бывает холодно — захватите тёплую одежду.
    Не заезжайте на берег: грунт там мягкий, а в конце лета, когда вода отступает, он превращается в грязь.
    Зимой плато под снегом и грунтовка непроезжая. Озеро удобно совместить с Цалкским водохранилищем,
    каньоном Дашбаши и Бешташени — всё в пределах примерно 15 км.
  route: >-
    Выезжайте из Тбилиси по Sh36 через Цхнети и Коджори на Манглиси, затем по Sh31 на запад через открытое
    плато. Немного не доезжая Цалки, сверните на второстепенную Sh169 к озеру; последний отрезок к берегу
    — гравий и грунт, от города Цалка до озера минут двадцать езды. Всего около 87 км и чуть меньше двух
    часов. После Коджори асфальт идёт в гору крутыми поворотами, а на плато дует сильный боковой ветер.
    В сухую погоду справится и машина эконом-класса; после дождя надёжнее внедорожник. Заправьтесь в Тбилиси
    или в Цалке.
fa:
  name: دریاچهٔ بارتی
  short: >-
    دریاچه‌ای طبیعی و کم‌عمق که از باران آب می‌گیرد، در ارتفاع ۱۶۱۲ متری بر فلات باز تریالتی و در فصلش
    پر از پرندگان آبزی — همسایهٔ وحشی آبگیر تسالکا.
  body: >-
    **هیچ رودی به بارتی آب نمی‌رساند: هر قطرهٔ این دریاچه به صورت باران یا برف بر فلات تریالتی باریده
    است.**


    دریاچه در ارتفاع ۱۶۱۲ متری، در شمال‌شرقی آبگیر تسالکا قرار دارد و برخلاف آن دریاچهٔ برق‌آبیِ دوران
    شوروی، سراسر طبیعی است. آن را باشکوی نیز می‌نامند. کتاب‌های مرجع مساحتش را ۱٫۳۴ کیلومتر مربع ذکر می‌کنند،
    اما آبراهه‌ای که از کرانهٔ جنوب‌غربی کنده شده سطح آب را به‌طور چشمگیری پایین آورده است؛ ادارهٔ ملی
    گردشگری گرجستان اکنون مساحت آن را حدود ۱۰۰ هکتار ذکر می‌کند. عمقش به‌طرز شگفت‌آوری کم است: به‌طور
    میانگین کمتر از یک متر و در ژرف‌ترین نقطه حدود ۱٫۳ متر. سطح آب در بهار به بالاترین حد می‌رسد و در
    پایان تابستان به پایین‌ترین.


    پیرامونش فلات، باز و تقریباً بی‌درخت، زیر آسمانی پهناور گسترده است. نیلوفرهای آبی و گیاهان گلدار کرانه
    را قاب گرفته‌اند و در فصلش دریاچه پر از پرندگان آبزی می‌شود؛ از همین روست که پرنده‌نگرها راهشان را
    به اینجا کج می‌کنند. آژانس مناطق حفاظت‌شدهٔ گرجستان آن را نامزد پیوستن به پارک ملی آلگتی در محدودهٔ
    گسترش‌یافته‌اش کرده است.


    ناحیهٔ تسالکا داستان چندلایهٔ خود را دارد: در سدهٔ نوزدهم یونانیان قفقاز و جوامع دیگر در کنار گرجی‌ها
    در اینجا ساکن شدند و فلات هنوز همان سرشت آمیخته را با خود دارد.


    عمق بارتی به زحمت به یک متر می‌رسد. در روزی صاف، ژرف‌ترین چیز اینجا آسمانِ بالای آن است.
  tip: >-
    دریاچه رایگان و بی‌حصار است و کافه، پمپ‌بنزین یا سرویس بهداشتی ندارد، پس هرچه لازم دارید در تسالکا
    تهیه کنید. دوربین دوچشمی بیاورید و زود برسید، وقتی پرندگان در اوج جنب‌وجوش‌اند و باد فلات هنوز برنخاسته
    است. حتی در ژوئیه، ارتفاع ۱۶۰۰ متر در زمین باز می‌تواند سرد باشد، پس لباس گرم بردارید. با خودرو به
    کرانه نروید: زمینش نرم است و اواخر تابستان، که آب پایین می‌رود، به گل‌ولای بدل می‌شود. زمستان فلات
    زیر برف است و راه خاکی بسته. دریاچه را با آبگیر تسالکا، درهٔ داشباشی و بشتاشنی همراه کنید که همه در
    شعاع حدود ۱۵ کیلومتری‌اند.
  route: >-
    از تفلیس با Sh36 از راه تسکنتی و کوجوری به مانگلیسی بروید، سپس با Sh31 به سمت غرب از فلات باز بگذرید.
    کمی پیش از تسالکا به جادهٔ فرعی Sh169 به سوی دریاچه بپیچید؛ تکهٔ آخر تا کرانه شنی و خاکی است و دریاچه
    حدود بیست دقیقه رانندگی با شهر تسالکا فاصله دارد. روی‌هم حدود ۸۷ کیلومتر و کمی کمتر از دو ساعت. پس
    از کوجوری آسفالت با پیچ‌های تند بالا می‌رود و روی فلات باد پهلوی شدیدی می‌وزد. در هوای خشک خودروی
    اقتصادی از پس راه برمی‌آید؛ پس از باران شاسی‌بلند انتخاب مطمئن‌تری است. در تفلیس یا تسالکا سوخت بگیرید.
he:
  name: אגם בארטי
  short: >-
    אגם טבעי רדוד הניזון ממי גשמים, בגובה 1,612 מטר על רמת טריאלטי הפתוחה, ובעונה מלא בעופות מים — השכן
    הפראי של מאגר צאלקה.
  body: >-
    **שום נהר אינו מזין את בארטי: כל טיפה באגם הזה ירדה כגשם או כשלג על רמת טריאלטי.**


    האגם שוכן בגובה 1,612 מטר, מצפון-מזרח למאגר צאלקה, ובניגוד לאגם ההידרואלקטרי ההוא מהתקופה הסובייטית
    הוא טבעי לחלוטין. הוא ידוע גם בשם בשקוי. ספרי עיון מייחסים לו שטח של 1.34 קילומטרים רבועים, אבל תעלה
    שנחפרה מן החוף הדרום-מערבי הורידה את מפלס המים במידה ניכרת; מינהל התיירות הלאומי של גאורגיה נוקב כיום
    בשטח של כ-100 הקטאר. הוא רדוד להפליא: פחות ממטר בממוצע, וכ-1.3 מטר בנקודה העמוקה ביותר. המפלס מגיע
    לשיאו באביב ויורד לשפל בסוף הקיץ.


    סביבו נפרשת הרמה, פתוחה וכמעט נטולת עצים, תחת שמיים רחבים. נופרים וצמחים פורחים מעטרים את החוף, ובעונה
    האגם מתמלא בעופות מים, ובגללם צפרים סוטים מדרכם אליו. הסוכנות לשטחים מוגנים של גאורגיה סימנה אותו
    כמועמד להיכלל בפארק הלאומי אלגטי המורחב.


    למחוז צאלקה סיפור רב-שכבתי משלו: במאה ה-19 התיישבו כאן יוונים קווקזים וקהילות נוספות לצד הגאורגים,
    והרמה נושאת עד היום את האופי המעורב הזה.


    עומקו של בארטי בקושי מטר. ביום בהיר, הדבר העמוק ביותר כאן הוא השמיים שמעליו.
  tip: >-
    הכניסה לאגם חופשית והוא אינו מגודר; אין בו בית קפה, דלק או שירותים, לכן הצטיידו בצאלקה. הביאו משקפת
    והגיעו מוקדם, כשהציפורים פעילות ביותר ורוח הרמה עוד לא התעוררה. גם ביולי, 1,600 מטר בשטח פתוח עלולים
    להיות קרים, אז קחו שכבה חמה. אל תעלו עם הרכב על החוף: הקרקע רכה, ובסוף הקיץ, כשהמים נסוגים, היא הופכת
    לבוץ. בחורף הרמה מושלגת ודרך העפר אינה עבירה. שלבו את האגם עם מאגר צאלקה, קניון דשבאשי ובשטשני, כולם
    בטווח של כ-15 ק"מ.
  route: >-
    צאו מטביליסי בכביש Sh36 דרך צקנטי וקוג'ורי אל מאנגליסי, ואז בכביש Sh31 מערבה לרוחב הרמה הפתוחה. מעט
    לפני צאלקה פנו לכביש המשני Sh169 לכיוון האגם; הקטע האחרון עד החוף הוא חצץ ועפר, והאגם נמצא כעשרים
    דקות נסיעה מהעיירה צאלקה. בסך הכול כ-87 ק"מ וקצת פחות משעתיים. אחרי קוג'ורי האספלט מטפס בסיבובים חדים,
    ועל הרמה נושבות רוחות צד חזקות. רכב חסכוני יסתדר במזג אוויר יבש; אחרי גשם רכב שטח הוא הבחירה הבטוחה
    יותר. תדלקו בטביליסי או בצאלקה.
ar:
  name: بحيرة باريتي
  short: >-
    بحيرة طبيعية ضحلة تتغذى من الأمطار على ارتفاع 1612 متراً فوق هضبة تريالتي المكشوفة، تمتلئ بالطيور
    المائية في موسمها — الجارة البرية لخزان تسالكا.
  body: >-
    **لا نهر يغذّي باريتي: كل قطرة في هذه البحيرة سقطت مطراً أو ثلجاً على هضبة تريالتي.**


    تقع البحيرة على ارتفاع 1612 متراً شمال شرقي خزان تسالكا، وعلى خلاف تلك البحيرة الكهرومائية من الحقبة
    السوفييتية فهي طبيعية تماماً. وتُعرف أيضاً باسم باشكوي. تذكر المراجع أن مساحة سطحها 1.34 كيلومتر مربع،
    لكن قناة شُقّت من الضفة الجنوبية الغربية خفضت منسوب الماء كثيراً؛ وتذكر الإدارة الوطنية للسياحة في
    جورجيا اليوم أن مساحتها نحو 100 هكتار. وهي ضحلة على نحو مدهش: أقل من متر في المتوسط، ونحو 1.3 متر
    في أعمق نقطة. يبلغ المنسوب ذروته في الربيع وينحدر إلى أدناه في آخر الصيف.


    من حولها تنبسط الهضبة مكشوفة شبه خالية من الأشجار تحت سماء رحبة. تحفّ زنابق الماء والنباتات المزهرة
    بالضفاف، وفي الموسم تمتلئ البحيرة بالطيور المائية، ولهذا يعرّج عليها هواة مراقبة الطيور. وقد رشّحتها
    وكالة المناطق المحمية في جورجيا للانضمام إلى منتزه ألغيتي الوطني بعد توسيعه.


    ولمنطقة تسالكا حكايتها متعددة الطبقات: ففي القرن التاسع عشر استقر هنا يونانيو القوقاز وجماعات أخرى
    إلى جانب الجورجيين، وما زالت الهضبة تحمل ذلك الطابع المختلط.


    لا يكاد عمق باريتي يبلغ متراً. وفي يوم صافٍ يكون أعمق ما هنا هو السماء فوقها.
  tip: >-
    البحيرة مجانية وغير مسيّجة، بلا مقهى أو وقود أو دورات مياه، فتزوّد بما تحتاج في تسالكا. أحضر منظاراً
    وتعالَ مبكراً، حين تكون الطيور في أوج نشاطها ولم تهبّ ريح الهضبة بعد. حتى في يوليو قد يكون الجو بارداً
    على ارتفاع 1600 متر في أرض مكشوفة، فاحمل ثياباً دافئة. لا تقُد سيارتك إلى الشاطئ: فأرضه رخوة، وفي
    أواخر الصيف، مع انحسار الماء، تتحول إلى وحل. وفي الشتاء تكسو الثلوج الهضبة ويصبح المسلك الترابي غير
    سالك. واجمع البحيرة مع خزان تسالكا وأخدود داشباشي وبشتاشيني، وكلها في حدود 15 كم تقريباً.
  route: >-
    اخرج من تبليسي على الطريق Sh36 مروراً بتسكنيتي وكوجوري إلى مانغليسي، ثم على Sh31 غرباً عبر الهضبة
    المكشوفة. وقبل تسالكا بقليل انعطف إلى الطريق الفرعي Sh169 نحو البحيرة؛ الجزء الأخير حتى الشاطئ من
    الحصى والتراب، والبحيرة على بعد نحو عشرين دقيقة بالسيارة من بلدة تسالكا. المسافة الإجمالية نحو 87
    كم وأقل من ساعتين بقليل. بعد كوجوري يصعد الأسفلت بمنعطفات حادة، والرياح الجانبية قوية على الهضبة.
    تكفي سيارة اقتصادية في الطقس الجاف؛ أما بعد المطر فسيارة الدفع الرباعي هي الخيار الأسلم. تزوّد بالوقود
    في تبليسي أو تسالكا.
