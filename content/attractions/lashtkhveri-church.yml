ka:
  name: ლაშთხვერის მთავარანგელოზის ეკლესია
  short: >-
    მესტიასთან ახლოს, პატარა სვანური ეკლესიის გარე კედლებზე წმინდანთა გვერდით შუა საუკუნეების ქართული
    რომანის რაინდები მიჯირითობენ.
  body: >-
    **მესტიასთან ახლოს, სოფლის პატარა ეკლესიის ჩრდილოეთ კედელზე, XII საუკუნის ქართული რომანის რაინდები
    წმინდანთა გვერდით მიჯირითობენ — ასეთ სიუჟეტს ქართულ ტაძრებზე თითქმის ვერსად ნახავთ.**


    ლაშთხვერი ლენჯერის თემის პატარა უბანია ენგურის ხეობით ამომავალ გზაზე, მესტიის ცენტრამდე სამიოდე კილომეტრით
    ადრე, ზღვის დონიდან დაახლოებით 1380 მეტრზე. XIX საუკუნეში ამ მხარეს „თავისუფალ სვანეთს“ უწოდებდნენ:
    აქაური თემები მთავრის ხელისუფლებას არ ცნობდნენ. ვინ ააშენა ეკლესია და როდის, შუა საუკუნეების არც ერთი
    წყარო არ გვამცნობს; პირველად იგი დაწვრილებით ექვთიმე თაყაიშვილმა აღწერა 1910 წელს, სვანეთში ექსპედიციისას.
    ადგილობრივები მას თარინგზელს ეძახიან — მთავარანგელოზის სახელით.


    ნაგებობა თავისთავად უბრალოა: სუფთად გათლილი კირქვის დარბაზი ორსაფეხურიან ცოკოლზე დგას, შიგნით ორ თითქმის
    თანაბარ მონაკვეთად იყოფა, ოთხი სარკმლით ნათდება და მარტივი ლავგარდნით სრულდება. დასავლეთ კედელს მოგვიანებით
    ხის სახურავიანი სათავსი მიაშენეს. აქ მთავარი მხატვრობაა. XIV საუკუნის მეორე ნახევარსა და XV საუკუნის
    დასაწყისში ადგილობრივმა ოსტატებმა ეკლესია შიგნითაც და გარედანაც მოხატეს — გვიანბიზანტიური სტილის უხეში,
    მაგრამ ცოცხალი, თავისებური ხელით. შიგნით ქრისტეს ცხოვრების სცენები, ეკლესიის მამები და მრავალი წმინდანია;
    ერთი სარკმლიდან შემოსული სხივი პირდაპირ ცხენოსან წმინდა გიორგის ეცემა.


    ახლა ეკლესიას გარს შემოუარეთ. აღმოსავლეთ ფასადზე წმინდა ევსტათი ნადირობს, სამხრეთით შარავანდედიანი
    მხედრები მიდიან, დასავლეთით ვედრებაა გამოსახული. ჩრდილოეთ კედელზე კი, დღეს უკვე ნაწილობრივ გაფერმკრთალებულ
    მხატვრობაში, „ამირანდარეჯანიანის“ — მოსე ხონელისადმი მიწერილი პროზაული რაინდული თხზულების — ეპიზოდებია.
    სცენებს ასომთავრული წარწერები ახლავს და გეუბნებათ, ვინ ვინ არის.


    ვინ გაიღო ამ ყველაფრის საფასური და რატომ მოხვდა საერო ეპოსი ტაძრის კედელზე, არავინ იცის. კედლის წინ
    რომ დადგებით, ეს კითხვა სულაც აღარ შეგაწუხებთ.
  tip: >-
    ეკლესია ხშირად დაკეტილია. უბანში, ან მესტიის სასტუმრო სახლის მასპინძლის შუამავლობით, მოიკითხეთ, ვისთანაა
    გასაღები, და სათადარიგო გეგმაც იქონიეთ: გარე მხატვრობა, მათ შორის ამირანის სცენები ჩრდილოეთ კედელზე,
    ნებისმიერ დროს ჩანს. შესასვლელის ფასი არსად არის მითითებული; თუ ვინმე კარს გაგიღებთ, შესაწირი დატოვეთ.
    შიგნით მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალები თავსაც იბურავენ. ჩრდილოეთ კედელი დღის უმეტეს
    ნაწილს ჩრდილში ატარებს, ამიტომ თვალს ერთი წუთი აცალეთ, რომ გაფერმკრთალებული ფიგურები გაარჩიოს. ნახევარი
    საათი საკმარისია; ვიზიტი მესტიის სვანეთის მუზეუმთან ერთად დაგეგმეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ წადით, ქუთაისისა და სენაკის გავლით ზუგდიდამდე, იქიდან
    კი ჩრდილოეთით, შ7 გზით, ჯვრის გავლით ენგურის ხეობას აუყევით მესტიისკენ. სულ დაახლოებით 467 კმ და 8
    საათი და 25 წუთია, გზა ბოლომდე ასფალტიანია. ლაშთხვერი ლენჯერის თემს ეკუთვნის, მესტიის ცენტრამდე დაახლოებით
    3 კმ-ით ადრე; ეკლესია უბნის სამხრეთ-დასავლეთ კიდეზე დგას, გზიდან ორიოდე წუთის სავალზე. საწვავი და
    საჭმელი საიმედოდ ზუგდიდსა და მესტიაში იშოვება. გირჩევთ ჯიპს: საფარი ასფალტია, მაგრამ ხეობის გზა გრძელი
    და კლაკნილია, ძლიერი წვიმის შემდეგ ქვაცვენა ხშირია, ოქტომბრიდან აპრილამდე კი ჩრდილიან მოსახვევებზე
    თოვლი და ყინული დგას.
en:
  name: Lashtkhveri Church of the Archangel
  short: >-
    A small Svan church near Mestia whose outer walls hold a rare sight: knights from a medieval Georgian
    romance, painted beside the saints.
  body: >-
    **On the north wall of a small village church near Mestia, knights from a twelfth-century romance
    ride among the saints, a subject almost no other Georgian church ever painted.**


    Lashtkhveri is a hamlet of the Lenjeri community, about three kilometres short of central Mestia on
    the Enguri valley road, at some 1,380 metres. In the nineteenth century this was "Free Svaneti", so
    called because its communities recognised no ruling prince. No medieval source records who built the
    church or when; the first scholar to describe it in detail was Ekvtime Taqaishvili, on his expedition
    to Svaneti in 1910. Locals call it Taringzel, after the Archangel.


    The building itself is plain: a hall of neatly cut limestone on a two-step plinth, divided into two
    almost equal bays, lit by four windows and finished with a simple cornice. A wooden-roofed room was
    later added on the west. What matters is the paint. Between the second half of the fourteenth century
    and the early fifteenth a local workshop covered the walls inside and out in a rough, vigorous version
    of late Byzantine style. Inside are scenes from the life of Christ, Church Fathers and saints; one
    window throws its light straight onto Saint George on horseback.


    Then walk round the outside. On the east façade Saint Eustace is out hunting; on the south, haloed
    horsemen ride; on the west is the Deesis. And on the north, partly faded now, are episodes from Amiran-Darejaniani,
    "The Story of Amiran, Son of Darejan", a prose tale of knights attributed to Mose Khoneli. Captions
    in asomtavruli, the old Georgian capitals, tell you who is who.


    Nobody knows who paid for all this, or why a secular epic earned a place on a church wall. Standing
    in front of it, you will not mind the question staying open.
  tip: >-
    The church is often locked. Ask in the hamlet, or have your Mestia guesthouse ask, who keeps the key,
    and come with a plan B: the outer frescoes, including the Amiran scenes on the north wall, can be
    seen at any time. No entry fee is published; if someone opens the door for you, leave a donation.
    Inside, cover shoulders and knees; women usually cover their hair too. The north wall stays in shade
    for most of the day, so give your eyes a minute to find the faded figures. Half an hour is enough.
    Pair it with the Svaneti Museum in Mestia.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi and Senaki to Zugdidi, then turn north onto the Sh7
    through Jvari and up the Enguri gorge towards Mestia: about 467 km and 8 hours 25 minutes, asphalt
    all the way. Lashtkhveri belongs to the Lenjeri community, roughly 3 km before central Mestia; the
    church stands at the south-western edge of the hamlet, a couple of minutes on foot from the road.
    Reliable fuel and food are in Zugdidi and Mestia. We recommend an SUV: the surface is paved, but the
    gorge road is long and winding, rockfall is common after heavy rain, and from October to April shaded
    bends hold snow and ice.
ru:
  name: Церковь Архангела в Лаштхвери
  short: >-
    Маленькая сванская церковь близ Местиа, на внешних стенах которой — редкость: рыцари из средневекового
    грузинского романа рядом со святыми.
  body: >-
    **На северной стене маленькой сельской церкви близ Местиа среди святых скачут рыцари из романа XII
    века — сюжет, который почти ни одна другая грузинская церковь не решилась написать.**


    Лаштхвери — хутор общины Ленджери примерно в трёх километрах от центра Местиа, на дороге, что поднимается
    по долине Ингури, на высоте около 1380 метров. В XIX веке эти места звались «Вольной Сванетией»: здешние
    общины не признавали над собой власти князя. Ни один средневековый источник не сообщает, кто и когда
    построил церковь; первым подробно описал её Эквтиме Такаишвили во время экспедиции в Сванетию в 1910
    году. Местные называют её Тарингзел — по имени архангела.


    Сама постройка проста: зал из аккуратно тёсанного известняка на двухступенчатом цоколе, разделённый
    на две почти равные части, освещённый четырьмя окнами и завершённый простым карнизом. С запада позднее
    пристроили помещение под деревянной кровлей. Но главное здесь — живопись. Во второй половине XIV —
    начале XV века местная мастерская расписала стены изнутри и снаружи в грубоватом, но энергичном варианте
    поздневизантийского стиля. Внутри — сцены из жизни Христа, Отцы Церкви и святые; одно из окон направляет
    свет прямо на конного святого Георгия.


    Потом обойдите церковь снаружи. На восточном фасаде охотится святой Евстафий, на южном едут всадники
    в нимбах, на западном — Деисус. А на северном, уже частично поблёкшие, — эпизоды «Амирандареджаниани»,
    «Повести об Амиране, сыне Дареджан», прозаического рыцарского сказания, которое приписывают Мосе Хонели.
    Надписи асомтаврули, древними грузинскими заглавными буквами, подсказывают, кто есть кто.


    Никто не знает, кто за всё это заплатил и почему светский эпос удостоился места на церковной стене.
    Стоя перед ней, вы легко смиритесь с тем, что вопрос остаётся открытым.
  tip: >-
    Церковь часто заперта. Спросите на хуторе — или попросите хозяев вашего гостевого дома в Местиа узнать,
    — у кого ключ, и держите в уме запасной вариант: внешние фрески, в том числе сцены из «Амирандареджаниани»
    на северной стене, видны в любое время. Плата за вход нигде не объявлена; если вам откроют, оставьте
    пожертвование. Внутри закрывайте плечи и колени; женщины обычно покрывают и голову. Северная стена
    почти весь день в тени, так что дайте глазам минуту, чтобы различить поблёкшие фигуры. Получаса достаточно.
    Совместите визит с Музеем Сванетии в Местиа.
  route: >-
    Из Тбилиси поезжайте по S1 (E60) на запад мимо Кутаиси и Сенаки до Зугдиди, затем сверните на север,
    на Sh7, через Джвари и вверх по Ингурскому ущелью к Местиа: около 467 км и 8 часов 25 минут, асфальт
    на всём пути. Лаштхвери входит в общину Ленджери, примерно в 3 км от центра Местиа; церковь стоит
    на юго-западной окраине хутора, в паре минут пешком от дороги. Надёжные заправки и еда — в Зугдиди
    и Местиа. Советуем внедорожник: покрытие асфальтовое, но дорога по ущелью длинная и извилистая, после
    сильных дождей часты камнепады, а с октября по апрель на затенённых поворотах держатся снег и лёд.
fa:
  name: کلیسای فرشتهٔ مقرب لاشتخوری
  short: >-
    کلیسای کوچک سوانی در نزدیکی مستیا که دیوارهای بیرونی‌اش منظره‌ای کمیاب دارند: شهسوارانی از یک رمان
    گرجی سده‌های میانه در کنار قدیسان.
  body: >-
    **بر دیوار شمالی کلیسای روستایی کوچکی نزدیک مستیا، شهسوارانی از یک رمان سدهٔ دوازدهم در میان قدیسان
    اسب می‌تازند — موضوعی که تقریباً هیچ کلیسای گرجی دیگری هرگز نقش نکرده است.**


    لاشتخوری آبادی کوچکی از بخش لنجری است، حدود سه کیلومتر پیش از مرکز مستیا بر سر جاده‌ای که از درهٔ
    انگوری بالا می‌آید، در ارتفاع نزدیک به ۱,۳۸۰ متر. در سدهٔ نوزدهم اینجا را «سوانتی آزاد» می‌خواندند،
    زیرا جماعت‌هایش هیچ امیر فرمانروایی را به رسمیت نمی‌شناختند. هیچ منبع سده‌های میانه نمی‌گوید چه کسی
    و کِی کلیسا را ساخت؛ نخستین پژوهشگری که آن را به تفصیل وصف کرد اکوتیمه تاکائیشویلی بود، در سفر پژوهشی‌اش
    به سوانتی در ۱۹۱۰. مردم محل آن را به نام فرشتهٔ مقرب، تارینگزل می‌نامند.


    خود بنا ساده است: تالاری از سنگ آهک تراش‌خورده و پاکیزه بر پایه‌ای دوپله، که به دو بخش تقریباً برابر
    تقسیم می‌شود، از چهار پنجره نور می‌گیرد و با قرنیزی ساده به پایان می‌رسد. بعدها در سوی غربی اتاقی
    با سقف چوبی به آن افزوده شد. آنچه اهمیت دارد نقاشی است. از نیمهٔ دوم سدهٔ چهاردهم تا آغاز سدهٔ پانزدهم،
    کارگاهی محلی دیوارها را از درون و بیرون با گونه‌ای زمخت اما پرتوان از سبک بیزانسی متأخر پوشاند. درون
    کلیسا صحنه‌هایی از زندگی مسیح، پدران کلیسا و قدیسان را می‌بینید؛ یکی از پنجره‌ها نورش را یکراست بر
    گئورگیوس قدیس سوار بر اسب می‌اندازد.


    سپس گرد بنا بچرخید. بر نمای شرقی اوستاتیوس قدیس در شکار است؛ بر نمای جنوبی سوارانی هاله‌دار می‌تازند؛
    بر نمای غربی صحنهٔ دیسیس (شفاعت) است. و بر نمای شمالی، که اکنون بخشی از آن رنگ باخته، اپیزودهایی از
    «امیران‌دارجانیانی» یا «داستان امیران، پسر دارجان» نقش شده است؛ قصه‌ای منثور از شهسواران که آن را
    به موسه خونلی نسبت می‌دهند. نوشته‌هایی به خط آسومتاورولی، حروف بزرگ کهن گرجی، می‌گویند چه کسی کیست.


    هیچ‌کس نمی‌داند هزینهٔ این همه را چه کسی پرداخت، یا چرا حماسه‌ای غیردینی جایی بر دیوار کلیسا یافت.
    وقتی در برابرش بایستید، باز ماندنِ این پرسش آزارتان نخواهد داد.
  tip: >-
    کلیسا اغلب قفل است. در آبادی بپرسید — یا از مهمان‌خانه‌تان در مستیا بخواهید بپرسد — که کلید دست کیست،
    و نقشهٔ جایگزینی هم داشته باشید: نقاشی‌های بیرونی، از جمله صحنه‌های امیران بر دیوار شمالی، همیشه دیدنی‌اند.
    ورودیه‌ای اعلام نشده است؛ اگر کسی در را برایتان گشود، اعانه‌ای بگذارید. درون کلیسا شانه‌ها و زانوها
    را بپوشانید؛ بانوان معمولاً موی سر را هم می‌پوشانند. دیوار شمالی بیشتر روز در سایه است، پس به چشمانتان
    یک دقیقه فرصت دهید تا پیکره‌های رنگ‌باخته را پیدا کنند. نیم ساعت کافی است. بازدید را با موزهٔ سوانتی
    در مستیا همراه کنید.
  route: >-
    از تفلیس با S1 (E60) رو به غرب، از کنار کوتائیسی و سناکی تا زوگدیدی بروید، سپس به شمال و به Sh7 بپیچید
    و از جواری، درهٔ انگوری را به سوی مستیا بالا بروید: حدود ۴۶۷ کیلومتر و ۸ ساعت و ۲۵ دقیقه، سراسر آسفالت.
    لاشتخوری جزو بخش لنجری است، حدود ۳ کیلومتر پیش از مرکز مستیا؛ کلیسا در لبهٔ جنوب غربی آبادی، دو سه
    دقیقه پیاده از جاده، ایستاده است. سوخت و غذای مطمئن در زوگدیدی و مستیا پیدا می‌شود. خودروی شاسی‌بلند
    را توصیه می‌کنیم: جاده آسفالت است، اما راهِ دره طولانی و پرپیچ است، پس از باران‌های سنگین ریزش سنگ
    رایج است و از اکتبر تا آوریل در پیچ‌های سایه‌گیر برف و یخ می‌ماند.
he:
  name: כנסיית המלאך הראשי בלשתחוורי
  short: >-
    כנסייה סוואנית קטנה ליד מסטיה, שעל קירותיה החיצוניים מראה נדיר: אבירים מרומן גאורגי מימי הביניים,
    מצוירים לצד הקדושים.
  body: >-
    **על הקיר הצפוני של כנסיית כפר קטנה ליד מסטיה רוכבים בין הקדושים אבירים מתוך רומן מן המאה ה-12 — נושא
    שכמעט אף כנסייה גאורגית אחרת לא ציירה מעולם.**


    לשתחוורי היא כפרון בקהילת לנג'רי, כשלושה קילומטרים לפני מרכז מסטיה על הכביש העולה בעמק האנגורי, בגובה
    של כ-1,380 מטר. במאה ה-19 נקרא האזור "סוואנטי החופשית", משום שקהילותיו לא הכירו בשום נסיך שליט. אף
    מקור מימי הביניים אינו מספר מי בנה את הכנסייה ומתי; החוקר הראשון שתיאר אותה בפירוט היה אקבתימה תקאישווילי,
    במשלחת שלו לסוואנטי ב-1910. המקומיים קוראים לה טרינגזל, על שם המלאך הראשי.


    המבנה עצמו פשוט: אולם מאבן גיר מסותתת בקפידה על בסיס בן שתי מדרגות, מחולק לשני חלקים שווים כמעט, מואר
    בארבעה חלונות ומסתיים בכרכוב פשוט. במערב נוסף מאוחר יותר חדר בעל גג עץ. אבל העיקר הוא הציור. בין המחצית
    השנייה של המאה ה-14 לתחילת המאה ה-15 כיסתה סדנה מקומית את הקירות מבפנים ומבחוץ בגרסה גסה אך נמרצת
    של הסגנון הביזנטי המאוחר. בפנים יש סצנות מחיי ישו, אבות הכנסייה וקדושים; אחד החלונות מטיל את אורו
    היישר על גאורגיוס הקדוש רכוב על סוסו.


    אחר כך הקיפו את הכנסייה מבחוץ. בחזית המזרחית אוסטתיוס הקדוש יוצא לציד; בדרומית רוכבים פרשים עטורי
    הילה; במערבית — הדאיסיס, תמונת התחינה. ובצפונית, שדהתה כיום בחלקה, מופיעים פרקים מתוך "אמיראן-דרג'אניאני",
    "סיפור אמיראן בן דרג'אן" — סיפור אבירים בפרוזה המיוחס למוסה חונלי. כיתובים באסומתברולי, האותיות הגאורגיות
    הגדולות העתיקות, מספרים מי הוא מי.


    איש אינו יודע מי מימן את כל זה, או מדוע זכה אפוס חילוני למקום על קיר כנסייה. כשתעמדו מול הקיר, לא
    יפריע לכם שהשאלה נשארת פתוחה.
  tip: >-
    הכנסייה נעולה לעיתים קרובות. שאלו בכפרון, או בקשו מבית ההארחה שלכם במסטיה לברר, אצל מי המפתח — והכינו
    תוכנית חלופית: את ציורי הקיר החיצוניים, ובהם סצנות אמיראן שעל הקיר הצפוני, אפשר לראות בכל עת. לא פורסמו
    דמי כניסה; אם מישהו פותח לכם את הדלת, השאירו תרומה. בפנים כסו כתפיים וברכיים; נשים נוהגות לכסות גם
    את השיער. הקיר הצפוני נשאר בצל רוב היום, לכן תנו לעיניים דקה למצוא את הדמויות הדהויות. חצי שעה מספיקה.
    שלבו עם מוזיאון סוואנטי במסטיה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, על פני קוטאיסי וסנאקי, עד זוגדידי, ומשם צפונה בכביש Sh7 דרך ג'וארי
    ובמעלה ערוץ האנגורי לכיוון מסטיה: כ-467 ק״מ ו-8 שעות ו-25 דקות, אספלט לכל אורך הדרך. לשתחוורי שייכת
    לקהילת לנג'רי, כ-3 ק״מ לפני מרכז מסטיה; הכנסייה עומדת בקצה הדרום-מערבי של הכפרון, דקה או שתיים ברגל
    מן הכביש. דלק ואוכל אפשר להשיג בוודאות בזוגדידי ובמסטיה. אנו ממליצים על רכב שטח: הכביש סלול, אבל הדרך
    בערוץ ארוכה ומפותלת, אחרי גשמים עזים נפוצות מפולות סלעים, ומאוקטובר עד אפריל נשארים שלג וקרח בעיקולים
    המוצלים.
ar:
  name: كنيسة رئيس الملائكة في لاشتخفيري
  short: >-
    كنيسة سفانية صغيرة قرب ميستيا تحمل جدرانها الخارجية مشهداً نادراً: فرسان من رواية جورجية من العصور
    الوسطى مرسومون إلى جانب القديسين.
  body: >-
    **على الجدار الشمالي لكنيسة قروية صغيرة قرب ميستيا، يمتطي فرسان من رواية تعود إلى القرن الثاني عشر
    خيولهم بين القديسين، وهو موضوع لم تكد ترسمه أي كنيسة جورجية أخرى.**


    لاشتخفيري قرية صغيرة من تجمّع لينجيري، على بعد نحو ثلاثة كيلومترات قبل وسط ميستيا على الطريق الصاعد
    في وادي إنغوري، وعلى ارتفاع 1,380 متراً تقريباً. في القرن التاسع عشر كانت هذه المنطقة تُعرف بـ«سفانيتي
    الحرة»، لأن جماعاتها لم تعترف بأي أمير حاكم. لا يذكر أي مصدر من العصور الوسطى من بنى الكنيسة ولا متى؛
    وأول باحث وصفها بالتفصيل كان إكفتيمه تاكايشفيلي، في بعثته إلى سفانيتي عام 1910. ويسميها الأهالي تارينغزيل،
    نسبةً إلى رئيس الملائكة.


    البناء نفسه بسيط: قاعة من الحجر الجيري المنحوت بعناية على قاعدة من درجتين، مقسومة إلى قسمين متساويين
    تقريباً، تضيئها أربع نوافذ ويتوّجها إفريز بسيط. وأُضيفت إليها لاحقاً من الغرب غرفة بسقف خشبي. لكن
    الأهم هو التصوير. فبين النصف الثاني من القرن الرابع عشر ومطلع القرن الخامس عشر غطّت ورشة محلية الجدران
    من الداخل والخارج بصيغة خشنة لكنها نابضة من الطراز البيزنطي المتأخر. في الداخل مشاهد من حياة المسيح
    وآباء الكنيسة وقديسون؛ وإحدى النوافذ تُلقي ضوءها مباشرة على القديس جاورجيوس ممتطياً جواده.


    ثم دُر حول الكنيسة من الخارج. على الواجهة الشرقية القديس أفستاثيوس في رحلة صيد؛ وعلى الجنوبية فرسان
    بهالات؛ وعلى الغربية مشهد الديسيس (الشفاعة). أما على الشمالية، وقد بهت بعضها الآن، فحلقات من «أميران
    داريجانياني»، أي «حكاية أميران بن داريجان»، وهي قصة نثرية عن الفرسان تُنسب إلى موسي خونيلي. وتخبرك
    نقوش بالأسومتافرولي، الحروف الجورجية الكبيرة القديمة، مَن هو مَن.


    لا أحد يعرف من دفع ثمن كل هذا، ولا لماذا نالت ملحمة دنيوية مكاناً على جدار كنيسة. وحين تقف أمامها،
    لن يضيرك أن يبقى السؤال مفتوحاً.
  tip: >-
    كثيراً ما تكون الكنيسة مغلقة. اسأل في القرية، أو اطلب من بيت الضيافة في ميستيا أن يسأل، عمّن يحتفظ
    بالمفتاح، وجهّز خطة بديلة: فالتصاوير الخارجية، ومنها مشاهد أميران على الجدار الشمالي، يمكن رؤيتها
    في أي وقت. لا رسوم دخول معلنة؛ وإن فتح لك أحد الباب فاترك تبرعاً. في الداخل غطِّ الكتفين والركبتين؛
    وعادة ما تغطي النساء شعورهن أيضاً. يبقى الجدار الشمالي في الظل معظم النهار، فامنح عينيك دقيقة لتتبيّنا
    الشخوص الباهتة. نصف ساعة تكفي. اجمع الزيارة مع متحف سفانيتي في ميستيا.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي وسيناكي حتى زوغديدي، ثم انعطف شمالاً إلى الطريق
    Sh7 عبر جفاري صعوداً في مضيق إنغوري نحو ميستيا: نحو 467 كم و8 ساعات و25 دقيقة، والإسفلت على طول الطريق.
    تتبع لاشتخفيري تجمّع لينجيري، على بعد نحو 3 كم قبل وسط ميستيا؛ وتقوم الكنيسة عند الطرف الجنوبي الغربي
    للقرية، على بعد دقيقتين سيراً من الطريق. الوقود والطعام المضمونان في زوغديدي وميستيا. ننصح بسيارة
    دفع رباعي: فالطريق معبّد، لكن طريق المضيق طويل ومتعرج، وتكثر فيه الانهيارات الصخرية بعد الأمطار الغزيرة،
    ومن أكتوبر إلى أبريل يبقى الثلج والجليد في المنعطفات الظليلة.
