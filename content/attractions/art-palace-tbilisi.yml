ka:
  name: ხელოვნების სასახლე (კულტურის ისტორიის მუზეუმი)
  short: >-
    ოლდენბურგის პრინცის უცნაური გოთურ-მავრიტანული სასახლე ჩუღურეთში — ქართული თეატრისა და კინოს ისტორიის
    300 000 ექსპონატით.
  body: >-
    **ეს სასახლე გერმანელმა პრინცმა გათხოვილი ქართველი ქალის სიყვარულის გამო ააშენა** — და ამბავი შენობასავით
    კინემატოგრაფიულია. 1882 წელს ქუთაისში, მეჯლისზე, რუსეთის იმპერატორის ნათესავმა კონსტანტინე ოლდენბურგელმა
    აგრაფინა ჯაფარიძე გაიცნო, დადიანის მეუღლეს გაჰყვა თვალი და სკანდალური რომანი წყვილის თბილისში დასახლებით
    დასრულდა. მათთვის არქიტექტორმა პაულ შტერნმა 1880–90-იანებში ქალაქში ანალოგის არმქონე რეზიდენცია ააგო:
    გოთური ისრისებრი სარკმლები, მავრიტანული თაღები, ალექსანდერ როგოისკის მდიდრული ინტერიერები.


    1927 წლიდან აქ თეატრის, მუსიკის, კინოსა და ქორეოგრაფიის სახელმწიფო მუზეუმია — „ხელოვნების სასახლე",
    რომელიც დავით არსენიშვილმა დააარსა. ფონდებში 300 000-ზე მეტი ნივთია:


    - სცენის ესკიზები, კოსტიუმები და აფიშები ქართული თეატრისა და ადრეული კინოს ისტორიიდან

    - ყაჯარული ირანის მინიატურები და პორტრეტები

    - ლევ ბაქსტისა და კონსტანტინე კოროვინის ნამუშევრები, ვანში ნაპოვნი ანტიკური თეატრალური ნიღაბი


    შენობა თავად არის მთავარი ექსპონატი — სასახლის დარბაზები თითქმის ხელუხლებელია. ეზო მშვიდი და ჩრდილიანია;
    ტურისტები აქ ცოტანი არიან, ამიტომ ხშირად მთელი მუზეუმი შენია.
  tip: >-
    ღიაა სამშაბათიდან კვირამდე 10:30–17:30, ორშაბათი დასვენებაა. ბილეთი 12 ლარია; ღირს გიდიანი ტური —
    ინტერიერების ისტორიებს თავად ვერ ამოიკითხავ. მისამართია ია კარგარეთელის 6, მარჯანიშვილის მოედნიდან
    ხუთი წუთის სავალზე. ქუჩაზე პარკინგი ფასიანი ზონაა, ადგილი თითქმის ყოველთვის იძებნება. დაუკავშირდი
    წინასწარ, თუ დიდი ჯგუფით მიდიხარ — დარბაზების ნაწილი ზოგჯერ ღონისძიებებისთვისაა დაკავებული.
  route: >-
    სასახლე მდინარის მარცხენა სანაპიროზეა, ჩუღურეთში. ცენტრიდან (რუსთაველი, თავისუფლების მოედანი) გადადი
    მშრალი ხიდით ან საარბრიუკენის ხიდით, აუყევი მარჯანიშვილის მოედნისკენ და კარგარეთელის ქუჩაზე შეუხვიე
    — სულ 3–4 კმ, საცობის გარეშე 10–15 წუთი. პარკინგი კარგარეთელისა და მიმდებარე ქუჩების ფასიან ზონაშია
    (Tbilisi Parking-ის აპი), მოედანთან უფრო რთულია. ეკონომ-კლასის მანქანა სრულიად საკმარისია; ალტერნატივაა
    მეტრო „მარჯანიშვილი" — იქიდან ხუთი წუთი ფეხით.
en:
  name: Art Palace (Museum of Cultural History)
  short: >-
    A prince's eccentric Gothic-Moorish palace in Chughureti, holding 300,000 items of Georgian theatre
    and cinema history.
  body: >-
    **A German prince built this palace for the love of a married Georgian woman** — and the story is
    as cinematic as the building. At a ball in Kutaisi in 1882, Duke Constantine of Oldenburg, a relative
    of the Russian emperor, met Agrippina Japaridze, wife of Prince Dadiani; the scandalous romance ended
    with the couple settling in Tbilisi. In the 1880s–90s architect Paul Stern raised a residence for
    them unlike anything else in the city: pointed Gothic windows, Moorish arches, and lavish interiors
    by Aleksander Rogojski.


    Since 1927 it has housed the State Museum of Theatre, Music, Film and Choreography — the "Art Palace"
    — founded by David Arsenishvili. The collection runs past 300,000 items:


    - Set sketches, costumes and posters from Georgian theatre and early cinema

    - Persian miniatures and portraits of the Qajar era

    - Works by Léon Bakst and Konstantin Korovin, and an antique theatrical mask excavated at Vani


    The building itself is the star exhibit — the state rooms survive almost untouched. The garden is
    quiet and shaded, and tourists are few, so you often get the whole museum to yourself.
  tip: >-
    Open Tuesday–Sunday 10:30–17:30, closed Mondays. Entry is 12 GEL, and the guided tour is worth taking
    — the stories behind the interiors are not written on labels. The address is 6 Ia Kargareteli Street,
    five minutes' walk from Marjanishvili Square. Street parking is a paid zone with space almost always
    available. If coming with a group, call ahead — some halls are occasionally booked for events.
  route: >-
    The palace sits on the left bank of the river in Chughureti. From the centre (Rustaveli, Freedom Square)
    cross the Dry Bridge or Saarbrücken Bridge, head up toward Marjanishvili Square and turn onto Kargareteli
    Street — 3–4 km in all, 10–15 minutes without traffic. Park in the paid zone on Kargareteli and adjacent
    streets via the Tbilisi Parking app; spaces right by the square are harder. An economy car is all
    you need; alternatively Marjanishvili metro station is a five-minute walk away.
ru:
  name: Дворец искусств (Музей истории культуры)
  short: >-
    Эксцентричный готическо-мавританский дворец принца Ольденбургского в Чугурети — 300 000 экспонатов
    истории грузинского театра и кино.
  body: >-
    **Немецкий принц построил этот дворец ради любви к замужней грузинке** — и история не уступает самому
    зданию. На балу в Кутаиси в 1882 году герцог Константин Ольденбургский, родственник российского императора,
    встретил Агриппину Джапаридзе, жену князя Дадиани; скандальный роман закончился тем, что пара осела
    в Тбилиси. В 1880–90-х архитектор Пауль Штерн возвёл для них резиденцию, не похожую ни на что в городе:
    стрельчатые готические окна, мавританские арки, роскошные интерьеры Александра Рогойского.


    С 1927 года здесь работает Государственный музей театра, музыки, кино и хореографии — «Дворец искусств»,
    основанный Давидом Арсенишвили. В фондах больше 300 000 предметов:


    - эскизы декораций, костюмы и афиши грузинского театра и раннего кино

    - персидские миниатюры и портреты каджарской эпохи

    - работы Льва Бакста и Константина Коровина, античная театральная маска из Вани


    Главный экспонат — само здание: парадные залы сохранились почти нетронутыми. Сад тихий и тенистый,
    туристов мало, так что музей нередко достаётся вам целиком.
  tip: >-
    Открыт со вторника по воскресенье 10:30–17:30, понедельник — выходной. Билет 12 лари; экскурсию стоит
    взять — истории интерьеров на этикетках не написаны. Адрес: улица Иа Каргаретели, 6, пять минут пешком
    от площади Марджанишвили. Парковка на улице — платная зона, место почти всегда находится. Если едете
    группой, позвоните заранее: часть залов иногда занята под мероприятия.
  route: >-
    Дворец стоит на левом берегу реки, в районе Чугурети. Из центра (Руставели, площадь Свободы) переезжайте
    Сухой мост или Саарбрюккенский мост, поднимайтесь к площади Марджанишвили и сворачивайте на улицу
    Каргаретели — всего 3–4 км, без пробок 10–15 минут. Парковка — платная зона на Каргаретели и соседних
    улицах (приложение Tbilisi Parking); у самой площади сложнее. Машины эконом-класса более чем достаточно;
    альтернатива — метро «Марджанишвили», оттуда пять минут пешком.
fa:
  name: کاخ هنر (موزهٔ تاریخ فرهنگ)
  short: کاخ عجیب گوتیک-مغربی شاهزادهٔ اولدنبورگ در چوغورتی — با ۳۰۰ هزار شیء از تاریخ تئاتر و سینمای
    گرجستان.
  body: >-
    **شاهزاده‌ای آلمانی این کاخ را به عشق زنی شوهردار گرجی ساخت** — و ماجرا به اندازهٔ خود بنا سینمایی
    است. در مجلس رقصی در کوتایسی به سال ۱۸۸۲، دوک کنستانتین اولدنبورگ، از خویشان امپراتور روسیه، آگریپینا
    جاپاریدزه، همسر شاهزاده دادیانی، را دید؛ آن عشق جنجالی به اقامت این زوج در تفلیس انجامید. در دهه‌های
    ۱۸۸۰ و ۹۰ معمار پاول اشترن برایشان اقامتگاهی ساخت که در شهر همتایی نداشت: پنجره‌های نوک‌تیز گوتیک،
    طاق‌های مغربی و درون‌آرایی پرتجمل الکساندر روگویسکی.


    از ۱۹۲۷ اینجا موزهٔ دولتی تئاتر، موسیقی، سینما و رقص — «کاخ هنر» — مستقر است که داویت آرسنیشویلی بنیادش
    گذاشت. مجموعه از ۳۰۰ هزار شیء می‌گذرد:


    - طرح‌های صحنه، لباس‌ها و پوسترهای تئاتر گرجی و سینمای آغازین

    - مینیاتورها و چهره‌نگاری‌های ایرانی دورهٔ قاجار

    - آثاری از لئون باکست و کنستانتین کوروین، و نقاب نمایشی باستانی یافته‌شده در وانی


    ستارهٔ اصلی خود بناست — تالارهای تشریفاتی تقریباً دست‌نخورده مانده‌اند. باغ آرام و سایه‌دار است و
    گردشگر کم می‌آید؛ اغلب کل موزه در اختیار شماست.
  tip: >-
    سه‌شنبه تا یکشنبه ۱۰:۳۰ تا ۱۷:۳۰ باز است و دوشنبه‌ها تعطیل. ورودی ۱۲ لاری است؛ تور با راهنما می‌ارزد
    — قصه‌های پشت درون‌آرایی‌ها روی برچسب‌ها نوشته نشده. نشانی: خیابان یا کارگارتلی شمارهٔ ۶، پنج دقیقه
    پیاده از میدان مارجانیشویلی. پارک خیابانی محدودهٔ پولی است و تقریباً همیشه جا پیدا می‌شود. اگر گروهی
    می‌روید از پیش تماس بگیرید — گاهی بخشی از تالارها برای مراسم رزرو است.
  route: >-
    کاخ در ساحل چپ رود، در محلهٔ چوغورتی است. از مرکز شهر (روستاولی، میدان آزادی) از پل خشک یا پل زاربروکن
    بگذرید، به سمت میدان مارجانیشویلی بالا بروید و به خیابان کارگارتلی بپیچید — روی‌هم ۳ تا ۴ کیلومتر،
    بی‌ترافیک ۱۰ تا ۱۵ دقیقه. پارک در محدودهٔ پولی کارگارتلی و خیابان‌های مجاور با اپلیکیشن Tbilisi Parking؛
    کنار خود میدان سخت‌تر است. خودروی اقتصادی کاملاً بس است؛ راه دیگر ایستگاه متروی مارجانیشویلی است،
    پنج دقیقه پیاده تا موزه.
he:
  name: ארמון האמנות (מוזיאון תולדות התרבות)
  short: ארמון גותי-מורי אקסצנטרי של נסיך אולדנבורג בצ'וגורתי — 300,000 פריטים מתולדות התיאטרון והקולנוע
    הגאורגיים.
  body: >-
    **נסיך גרמני בנה את הארמון הזה מאהבה לאישה גאורגית נשואה** — והסיפור קולנועי לא פחות מהבניין. בנשף
    בקוטאיסי ב-1882 פגש הדוכס קונסטנטין מאולדנבורג, קרוב משפחה של הקיסר הרוסי, את אגריפינה ג'פרידזה, אשתו
    של הנסיך דדיאני; הרומן שערורייתי הסתיים בכך שהזוג השתקע בטביליסי. בשנות ה-80 וה-90 של המאה ה-19 הקים
    עבורם האדריכל פאול שטרן בית שאין דומה לו בעיר: חלונות גותיים מחודדים, קשתות מוריות ופנים מפואר בעיצובו
    של אלכסנדר רוגויסקי.


    מאז 1927 שוכן כאן המוזיאון הממלכתי לתיאטרון, מוזיקה, קולנוע וכוריאוגרפיה — "ארמון האמנות" — שייסד
    דוד ארסנישווילי. האוסף מונה יותר מ-300,000 פריטים:


    - סקיצות תפאורה, תלבושות וכרזות מהתיאטרון הגאורגי ומהקולנוע המוקדם

    - מיניאטורות ודיוקנאות פרסיים מתקופת הקאג'ארים

    - עבודות של לאון בקסט וקונסטנטין קורובין, ומסכת תיאטרון עתיקה שנחפרה בוואני


    המוצג הראשי הוא הבניין עצמו — אולמות הפאר שרדו כמעט ללא שינוי. הגן שקט ומוצל, התיירים מעטים, ולעיתים
    קרובות המוזיאון כולו שלכם.
  tip: >-
    פתוח שלישי–ראשון 10:30–17:30, סגור בימי שני. הכניסה 12 לארי, וכדאי לקחת סיור מודרך — הסיפורים שמאחורי
    חדרי הארמון אינם כתובים על השלטים. הכתובת: רחוב איה קרגרתלי 6, חמש דקות הליכה מכיכר מרג'נישווילי.
    חניה ברחוב באזור בתשלום, ומקום נמצא כמעט תמיד. אם מגיעים בקבוצה, התקשרו מראש — חלק מהאולמות תפוס לפעמים
    לאירועים.
  route: >-
    הארמון עומד על הגדה השמאלית של הנהר, בשכונת צ'וגורתי. מהמרכז (רוסתוולי, כיכר החירות) חצו את הגשר היבש
    או את גשר סארבריקן, עלו לכיוון כיכר מרג'נישווילי ופנו לרחוב קרגרתלי — 3–4 ק"מ בסך הכול, 10–15 דקות
    בלי פקקים. חניה באזור בתשלום בקרגרתלי וברחובות הסמוכים דרך אפליקציית Tbilisi Parking; ליד הכיכר עצמה
    קשה יותר. רכב חסכוני מספיק בהחלט; לחלופין תחנת המטרו מרג'נישווילי במרחק חמש דקות הליכה.
ar:
  name: قصر الفنون (متحف تاريخ الثقافة)
  short: قصر قوطي-مغربي غريب بناه أمير أولدنبورغ في تشوغوريتي — يضم 300 ألف قطعة من تاريخ المسرح والسينما
    الجورجيين.
  body: >-
    **أمير ألماني بنى هذا القصر حباً بامرأة جورجية متزوجة** — والقصة سينمائية كالمبنى نفسه. في حفل راقص
    بكوتايسي عام 1882 التقى الدوق قسطنطين أولدنبورغ، قريب الإمبراطور الروسي، بأغريبينا جاباريدزه زوجة
    الأمير دادياني؛ وانتهى ذلك الغرام المثير للفضيحة باستقرار الاثنين في تبليسي. وفي ثمانينيات القرن التاسع
    عشر وتسعينياته شيّد لهما المعماري باول شتيرن داراً لا شبيه لها في المدينة: نوافذ قوطية مدببة وعقود
    مغربية وديكورات داخلية فاخرة صممها ألكسندر روغويسكي.


    ومنذ 1927 يشغل المبنى متحف الدولة للمسرح والموسيقى والسينما والرقص — «قصر الفنون» — الذي أسسه دافيت
    أرسينيشفيلي. تتجاوز المجموعة 300 ألف قطعة:


    - رسوم مشاهد المسرح والأزياء والملصقات من تاريخ المسرح الجورجي والسينما المبكرة

    - منمنمات وصور فارسية من العصر القاجاري

    - أعمال ليون باكست وقسطنطين كوروفين، وقناع مسرحي أثري عُثر عليه في فاني


    والمعروضة الرئيسية هي المبنى ذاته — فقاعات الاستقبال باقية شبه سليمة. الحديقة هادئة ظليلة، والسياح
    قليلون، فكثيراً ما يكون المتحف كله لك وحدك.
  tip: >-
    مفتوح من الثلاثاء إلى الأحد 10:30–17:30، ومغلق الاثنين. الدخول 12 لاري، والجولة المصحوبة بمرشد تستحق
    — فقصص الديكورات الداخلية غير مكتوبة على اللوحات. العنوان: شارع يا كارغاريتيلي رقم 6، خمس دقائق مشياً
    من ساحة مارجانيشفيلي. موقف الشارع منطقة مدفوعة ويتوفر مكان في الغالب. إن كنتم مجموعة فاتصلوا مسبقاً
    — بعض القاعات تُحجز أحياناً للفعاليات.
  route: >-
    يقع القصر على الضفة اليسرى للنهر في حي تشوغوريتي. من وسط المدينة (روستافيلي، ساحة الحرية) اعبر الجسر
    الجاف أو جسر ساربروكن، واصعد نحو ساحة مارجانيشفيلي ثم انعطف إلى شارع كارغاريتيلي — 3 إلى 4 كم في المجموع،
    و10 إلى 15 دقيقة من دون زحام. الوقوف في المنطقة المدفوعة على كارغاريتيلي والشوارع المجاورة عبر تطبيق
    Tbilisi Parking؛ وقرب الساحة نفسها أصعب. سيارة اقتصادية تكفي تماماً؛ والبديل محطة مترو مارجانيشفيلي
    على بعد خمس دقائق سيراً.
