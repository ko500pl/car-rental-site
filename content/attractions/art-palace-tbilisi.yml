ka:
  name: ხელოვნების სასახლე (კულტურის ისტორიის მუზეუმი)
  short: >-
    სკანდალური სიყვარულისთვის აგებული გოთურ-მავრიტანული სასახლე — დღეს ქართული თეატრის, კინოს, ოპერისა
    და ცეკვის 300 000 ნივთის სახლი.
  body: >-
    **1882 წელს, ქუთაისში, რომანოვების ნათესავს გათხოვილი ქართველი თავადის ქალი შეუყვარდა — ჩუღურეთის
    ეს კოშკურიანი სასახლე სწორედ იმ სკანდალის ნაყოფია.**


    ის ჰერცოგი კონსტანტინე პეტრეს ძე ოლდენბურგელი (1850–1906) იყო, ოლდენბურგების სახლის რუსული შტოდან;
    ქალი — აგრიპინა ჯაფარიძე, თავად ტარიელ დადიანის მეუღლე. ჰერცოგმა სიყვარული აუხსნა, ორივემ ქუთაისი
    დატოვა და ტფილისში დასახლდა. აგრიპინამ ამაში მძიმე საფასური გადაიხადა: პირველი ქორწინებიდან ოთხი შვილი
    დადიანების ოჯახს დარჩა. ჰერცოგმა მისთვის რეზიდენცია არქიტექტორ პაულ შტერნს შეუკვეთა — ისტორიციზმის
    ნიმუში, სადაც გოთიკა ისლამურ არქიტექტურას ხვდება: ისრული სარკმლები, მავრიტანული თაღები, კოშკურა და
    ნაჭედი ღობე. ინტერიერების ნაწილი პოლონელ არქიტექტორ ალექსანდერ როგოისკის ეკუთვნის.


    1927 წელს დავით არსენიშვილმა (1905–1963), მოგვიანებით მოსკოვის ანდრეი რუბლიოვის მუზეუმის პირველმა
    დირექტორმა, სულ ოცდაერთი წლისამ თავისი თეატრალური მუზეუმი აქ გადმოიტანა. მას შემდეგ კოლექციამ 300
    000 ნივთს გადააჭარბა — ქართული თეატრი, კინო, ცირკი, ფოლკლორი, ოპერა და ბალეტი; 2020 წლიდან მუზეუმს
    საქართველოს ხელოვნების სასახლე ჰქვია. განსაკუთრებით სამი რამ მოძებნეთ:


    - სცენოგრაფიისა და კოსტიუმების ესკიზები — 300-ზე მეტი ქართველი მხატვრის დაახლოებით 10 000 ნამუშევარი,
    მათ შორის პეტრე ოცხელისაც

    - ვანში აღმოჩენილი ანტიკური თეატრალური ნიღაბი

    - ყაჯართა ხანის სპარსული მინიატურები, ლეონ ბაქსტის, კონსტანტინე კოროვინისა და ალექსანდრე ბენუას ნამუშევრები


    სიყვარულის ამბავმა, რომელმაც ერთ დროს ქუთაისი ააფორიაქა, საბოლოოდ მთელი ქართული სცენის მეხსიერებას
    მისცა თავშესაფარი. სახლისთვის ამაზე თეატრალურ მეორე სიცოცხლეს ძნელად წარმოიდგენთ.
  tip: >-
    ღიაა სამშაბათიდან კვირამდე, 10:30–17:30; ორშაბათს დაკეტილია. ბილეთი 12 ლარია. იკითხეთ, ხომ არ არის
    ხელმისაწვდომი გიდი — საუკეთესო ამბები ჰერცოგზე, აგრიპინასა და თავად დარბაზებზე ეტიკეტებზე არ წერია.
    დროებითი გამოფენები ხშირად იცვლება, ამიტომ წინასწარ artpalace.ge ნახეთ. ეზო ჩრდილიანი და მშვიდია,
    ხალხმრავლობა იშვიათია. აბრეშუმის სახელმწიფო მუზეუმი აქედან კილომეტრზე ნაკლებ მანძილზეა და ბუნებრივი
    წყვილია ამ ვიზიტისთვის — ოღონდ მისი სამუშაო საათები წინასწარ გადაამოწმეთ: ისინი ხელოვნების სასახლისას
    არ ემთხვევა.
  route: >-
    სასახლე ია კარგარეთელის ქუჩის №6-შია, ჩუღურეთში, მტკვრის მარცხენა სანაპიროზე. თავისუფლების მოედნიდან
    მდინარე მშრალი ხიდით ან საარბრიუკენის ხიდით გადაკვეთეთ, მარჯანიშვილის მოედნამდე აუყევით და ჩუღურეთის
    გავლით ჩრდილოეთით, კარგარეთელის ქუჩამდე გააგრძელეთ — გზით დაახლოებით 5 კილომეტრი, საცობის გარეშე 10–15
    წუთი. მანქანა კარგარეთელისა და მიმდებარე ქუჩების ფასიან ზონაში დატოვეთ (Tbilisi Parking-ის აპლიკაცია);
    მარჯანიშვილის მოედანთან ადგილის პოვნა უფრო რთულია. ეკონომკლასი სავსებით საკმარისია. მანქანის გარეშე
    — მეტროსადგური „მარჯანიშვილი“ დაახლოებით ათი წუთის სავალზეა.
en:
  name: Art Palace (Museum of Cultural History)
  short: >-
    A Gothic-Moorish palace built for a scandalous love affair, now home to 300,000 objects from Georgian
    theatre, film, opera and dance.
  body: >-
    **In 1882, in Kutaisi, a relative of the Romanovs fell in love with a married Georgian noblewoman,
    and this turreted palace in Chughureti is what the scandal built.**


    He was Duke Constantine Petrovich of Oldenburg (1850–1906), of the Russian branch of the House of
    Oldenburg; she was Agrippina Japaridze, wife of Prince Tariel Dadiani. The duke declared his love,
    the two left Kutaisi together and settled in Tiflis, and Agrippina paid a real price: her four children
    by Dadiani remained with his family. For her the duke commissioned a residence from the architect
    Paul Stern, a piece of historicism where Gothic meets Islamic architecture: pointed windows, Moorish
    arches, a turret and an ironwork fence. The Polish architect Aleksander Rogojski designed part of
    the interiors.


    In 1927 David Arsenishvili (1905–1963), later the first director of the Andrei Rublev Museum in Moscow,
    moved his Theatre Museum into the house at just twenty-one. The collection has since passed 300,000
    objects on Georgian theatre, cinema, circus, folklore, opera and ballet, and since 2020 the museum
    has been called the Art Palace of Georgia. Three things to seek out:


    - set and costume designs, some 10,000 works by more than 300 Georgian artists, Petre Otskheli among
    them

    - a theatrical mask from antiquity, excavated at Vani

    - Qajar-era Persian miniatures, and works by Léon Bakst, Konstantin Korovin and Alexandre Benois


    A love affair that scandalised Kutaisi ended up sheltering the memory of the whole Georgian stage.
    It is hard to imagine a more theatrical afterlife for a house.
  tip: >-
    Open Tuesday to Sunday, 10:30–17:30; closed on Mondays. Entry is 12 GEL. Ask whether a guide is available:
    the best stories, about the duke, Agrippina and the rooms themselves, are not written on the labels.
    Temporary exhibitions change often, so check artpalace.ge before you go. The garden is shaded and
    quiet, and crowds are rare. The State Silk Museum is under a kilometre away and makes a natural pairing,
    but check its hours before you go: they differ from the Art Palace's.
  route: >-
    The palace stands at 6 Ia Kargareteli Street in Chughureti, on the left bank of the Mtkvari. From
    Freedom Square cross the river by the Dry Bridge or the Saarbrücken Bridge, climb to Marjanishvili
    Square and carry on north through Chughureti to Kargareteli Street: about 5 km by road, 10–15 minutes
    without traffic. Park in the paid zone along Kargareteli and the neighbouring streets (Tbilisi Parking
    app); spaces near Marjanishvili Square are harder to find. An economy car is all you need. Without
    one, Marjanishvili metro station is about a ten-minute walk away.
ru:
  name: Дворец искусств (Музей истории культуры)
  short: >-
    Готическо-мавританский дворец, построенный ради скандального романа, а ныне — дом для 300 000 предметов
    из истории грузинского театра, кино, оперы и танца.
  body: >-
    **В 1882 году в Кутаиси родственник Романовых влюбился в замужнюю грузинскую дворянку, и этот дворец
    с башенкой в Чугурети — то, что выстроил скандал.**


    Он — герцог Константин Петрович Ольденбургский (1850–1906), из русской ветви Ольденбургского дома;
    она — Агриппина Джапаридзе, жена князя Тариэла Дадиани. Герцог признался ей в любви, они вместе уехали
    из Кутаиси и поселились в Тифлисе, а Агриппина заплатила настоящую цену: четверо её детей от Дадиани
    остались в его семье. Для неё герцог заказал резиденцию архитектору Паулю Штерну — образец историзма,
    где готика встречается с исламской архитектурой: стрельчатые окна, мавританские арки, башенка и кованая
    ограда. Часть интерьеров спроектировал польский архитектор Александр Рогойский.


    В 1927 году двадцатиоднолетний Давид Арсенишвили (1905–1963), впоследствии первый директор Музея Андрея
    Рублёва в Москве, перевёз в этот дом свой Театральный музей. С тех пор коллекция перевалила за 300
    000 предметов, связанных с грузинским театром, кино, цирком, фольклором, оперой и балетом, а с 2020
    года музей называется Дворцом искусств Грузии. Три вещи, которые стоит отыскать:


    - эскизы декораций и костюмов — около 10 000 работ более чем 300 грузинских художников, среди них
    Петре Оцхели

    - античная театральная маска из раскопок в Вани

    - персидские миниатюры каджарской эпохи и работы Льва Бакста, Константина Коровина и Александра Бенуа


    Роман, взбудораживший Кутаиси, в итоге приютил память всей грузинской сцены. Трудно представить для
    дома более театральную посмертную судьбу.
  tip: >-
    Открыт со вторника по воскресенье, 10:30–17:30; понедельник — выходной. Вход — 12 лари. Спросите,
    есть ли экскурсовод: лучшие истории — о герцоге, Агриппине и самих залах — на этикетках не написаны.
    Временные выставки меняются часто, так что перед визитом загляните на artpalace.ge. Сад тенистый и
    тихий, толп почти не бывает. Государственный музей шёлка — меньше чем в километре отсюда и естественно
    дополняет визит, но заранее уточните часы его работы: они не совпадают с расписанием Дворца искусств.
  route: >-
    Дворец стоит на улице Иа Каргаретели, 6, в Чугурети, на левом берегу Мтквари. От площади Свободы переезжайте
    реку по Сухому мосту или Саарбрюккенскому мосту, поднимайтесь к площади Марджанишвили и продолжайте
    на север через Чугурети до улицы Каргаретели: около 5 км по дороге, 10–15 минут без пробок. Паркуйтесь
    в платной зоне вдоль Каргаретели и соседних улиц (приложение Tbilisi Parking); у площади Марджанишвили
    место найти труднее. Хватит машины эконом-класса. Без машины: станция метро «Марджанишвили» примерно
    в десяти минутах ходьбы.
fa:
  name: کاخ هنر (موزهٔ تاریخ فرهنگ)
  short: >-
    کاخی گوتیک-موری که به پای عشقی رسوایی‌برانگیز ساخته شد و اکنون خانهٔ ۳۰۰,۰۰۰ شیء از تاریخ تئاتر، سینما،
    اپرا و رقص گرجستان است.
  body: >-
    **در ۱۸۸۲ در کوتایسی، یکی از خویشان خاندان رومانوف دل به بانویی اشراف‌زادهٔ گرجی باخت که شوهر داشت،
    و این کاخ برج‌دار در چوغورتی همان چیزی است که آن رسوایی بنا کرد.**


    مرد، دوک کنستانتین پتروویچ اولدنبورگ (۱۸۵۰–۱۹۰۶) بود، از شاخهٔ روسی خاندان اولدنبورگ؛ و زن، آگریپینا
    جاپاریدزه، همسر شاهزاده تاریل دادیانی. دوک عشقش را آشکار کرد، آن دو با هم کوتایسی را ترک کردند و در
    تفلیس ساکن شدند، و آگریپینا بهایی واقعی پرداخت: چهار فرزندش از دادیانی نزد خانوادهٔ او ماندند. دوک
    برای او اقامتگاهی به معمار پاول اشترن سفارش داد، نمونه‌ای از تاریخ‌گرایی که در آن گوتیک با معماری
    اسلامی درمی‌آمیزد: پنجره‌های تیزه‌دار، طاق‌های موری، یک برجک و نرده‌ای فرفورژه. بخشی از فضاهای درونی
    را معمار لهستانی، آلکساندر روگویسکی، طراحی کرد.


    در ۱۹۲۷ داوید آرسنیشویلی (۱۹۰۵–۱۹۶۳)، که بعدها نخستین مدیر موزهٔ آندری روبلیوف در مسکو شد، در بیست‌ویک‌سالگی
    موزهٔ تئاتر خود را به این خانه آورد. مجموعه از آن زمان از ۳۰۰,۰۰۰ شیء دربارهٔ تئاتر، سینما، سیرک،
    فولکلور، اپرا و باله در گرجستان فراتر رفته است، و از ۲۰۲۰ موزه «کاخ هنر گرجستان» نام دارد. سه چیز
    که باید سراغشان بروید:


    - طرح‌های صحنه و لباس، حدود ۱۰,۰۰۰ اثر از بیش از ۳۰۰ هنرمند گرجی، از جمله پتره اوتسخلی

    - نقابی نمایشی از دوران باستان که در کاوش‌های وانی از خاک بیرون آمد

    - نگارگری‌های ایرانی دورهٔ قاجار، و آثاری از لئون باکست، کنستانتین کوروین و آلکساندر بنوا


    عشقی که کوتایسی را به هیاهو انداخت، سرانجام پناهگاه خاطرهٔ سراسر تئاتر گرجستان شد. برای یک خانه، زندگی
    پس از مرگی نمایشی‌تر از این به دشواری می‌توان تصور کرد.
  tip: >-
    سه‌شنبه تا یکشنبه، ۱۰:۳۰ تا ۱۷:۳۰ باز است؛ دوشنبه‌ها تعطیل. بلیت ۱۲ لاری است. بپرسید آیا راهنما هست:
    بهترین داستان‌ها، دربارهٔ دوک، آگریپینا و خود اتاق‌ها، روی برچسب‌ها نوشته نشده‌اند. نمایشگاه‌های موقت
    اغلب عوض می‌شوند، پس پیش از رفتن سری به artpalace.ge بزنید. باغ سایه‌دار و آرام است و ازدحام به‌ندرت
    پیش می‌آید. موزهٔ دولتی ابریشم کمتر از یک کیلومتر فاصله دارد و همراه طبیعی این بازدید است، اما ساعات
    کارش را از پیش بررسی کنید؛ با ساعات کاخ هنر یکی نیست.
  route: >-
    کاخ در شمارهٔ ۶ خیابان ایا کارگارتلی در چوغورتی، در کرانهٔ چپ متکواری است. از میدان آزادی از پل خشک
    یا پل زاربروکن از رود بگذرید، تا میدان مارجانیشویلی بالا بروید و از میان چوغورتی به شمال ادامه دهید
    تا خیابان کارگارتلی: حدود ۵ کیلومتر راه، ۱۰ تا ۱۵ دقیقه بدون ترافیک. در منطقهٔ پارک پولی در امتداد
    کارگارتلی و خیابان‌های مجاور پارک کنید (اپلیکیشن Tbilisi Parking)؛ نزدیک میدان مارجانیشویلی جای پارک
    سخت‌تر پیدا می‌شود. خودروی اقتصادی کافی است. بدون خودرو، ایستگاه متروی مارجانیشویلی حدود ده دقیقه
    پیاده فاصله دارد.
he:
  name: ארמון האמנות (המוזיאון לתולדות התרבות)
  short: >-
    ארמון גותי-מורי שנבנה בעקבות רומן שערורייתי, וכיום ביתם של 300,000 פריטים מעולם התיאטרון, הקולנוע,
    האופרה והמחול בגאורגיה.
  body: >-
    **ב-1882, בקוטאיסי, התאהב קרוב משפחה של בית רומנוב באצילה גאורגית נשואה, והארמון בעל הצריח שבצ'וגורתי
    הוא מה שבנתה השערורייה הזאת.**


    הוא היה הדוכס קונסטנטין פטרוביץ' מאולדנבורג (1850–1906), מהענף הרוסי של בית אולדנבורג; היא הייתה אגריפינה
    ג'פרידזה, אשתו של הנסיך טריאל דדיאני. הדוכס הצהיר על אהבתו, השניים עזבו יחד את קוטאיסי והשתקעו בטיפליס,
    ואגריפינה שילמה מחיר של ממש: ארבעת ילדיה מדדיאני נשארו אצל משפחתו. עבורה הזמין הדוכס בית מגורים מהאדריכל
    פאול שטרן – יצירה בסגנון ההיסטוריציזם שבה הגותיקה פוגשת את האדריכלות האסלאמית: חלונות מחודדים, קשתות
    מוריות, צריח וגדר ברזל מחושל. האדריכל הפולני אלכסנדר רוגויסקי תכנן חלק מחללי הפנים.


    ב-1927 העביר דוד ארסנישווילי (1905–1963), לימים המנהל הראשון של מוזיאון אנדריי רובליוב במוסקבה, את
    מוזיאון התיאטרון שלו אל הבית הזה, כשהיה בן עשרים ואחת בלבד. מאז עבר האוסף את רף 300,000 הפריטים הנוגעים
    לתיאטרון, לקולנוע, לקרקס, לפולקלור, לאופרה ולבלט בגאורגיה, ומאז 2020 נקרא המוזיאון ארמון האמנות של
    גאורגיה. שלושה דברים שכדאי לחפש:


    - סקיצות של תפאורות ותלבושות, כ-10,000 עבודות של יותר מ-300 אמנים גאורגים, ובהם פטרה אוצחלי

    - מסכת תיאטרון מימי קדם, שנחשפה בחפירות בוואני

    - מיניאטורות פרסיות מתקופת הקאג'ארים, ועבודות של לאון בקסט, קונסטנטין קורובין ואלכסנדר בנואה


    פרשת אהבה שהסעירה את קוטאיסי הפכה בסופו של דבר למחסה לזיכרון של הבמה הגאורגית כולה. קשה לדמיין לבית
    חיים שלאחר המוות תיאטרליים יותר.
  tip: >-
    פתוח שלישי עד ראשון, 10:30–17:30; סגור בימי שני. הכניסה 12 לארי. שאלו אם יש מדריך: הסיפורים הטובים
    ביותר – על הדוכס, על אגריפינה ועל החדרים עצמם – אינם כתובים על השלטים. התערוכות המתחלפות משתנות לעיתים
    קרובות, לכן בדקו את artpalace.ge לפני הביקור. הגן מוצל ושקט, ועומס מבקרים נדיר. מוזיאון המשי הממלכתי
    נמצא במרחק של פחות מקילומטר ומשתלב באופן טבעי בביקור, אבל בדקו מראש את שעות הפתיחה שלו: הן שונות מאלה
    של ארמון האמנות.
  route: >-
    הארמון נמצא ברחוב איה קרגרתלי 6 בצ'וגורתי, על הגדה השמאלית של המטקוורי. מכיכר החירות חצו את הנהר בגשר
    היבש או בגשר זארבריקן, עלו לכיכר מרג'נישווילי והמשיכו צפונה דרך צ'וגורתי עד רחוב קרגרתלי: כ-5 ק"מ
    בכביש, 10–15 דקות בלי פקקים. חנו באזור החניה בתשלום לאורך קרגרתלי והרחובות הסמוכים (אפליקציית Tbilisi
    Parking); ליד כיכר מרג'נישווילי קשה יותר למצוא מקום. רכב חסכוני מספיק בהחלט. בלי רכב – תחנת המטרו
    מרג'נישווילי נמצאת כעשר דקות הליכה משם.
ar:
  name: قصر الفنون (متحف التاريخ الثقافي)
  short: >-
    قصر قوطي مغاربي الطراز شُيّد لأجل قصة حب أثارت فضيحة، وهو اليوم موطن 300,000 قطعة من تاريخ المسرح
    والسينما والأوبرا والرقص في جورجيا.
  body: >-
    **في عام 1882، في كوتايسي، وقع أحد أقارب آل رومانوف في حب نبيلة جورجية متزوجة، وهذا القصر ذو البرج
    الصغير في تشوغوريتي هو ما بنته تلك الفضيحة.**


    كان هو الدوق كونستانتين بتروفيتش أولدنبورغ (1850–1906)، من الفرع الروسي لآل أولدنبورغ؛ وكانت هي أغريبينا
    جاباريدزه، زوجة الأمير تارييل دادياني. صارحها الدوق بحبه، فغادرا كوتايسي معاً واستقرّا في تفليس، ودفعت
    أغريبينا ثمناً حقيقياً: فقد بقي أطفالها الأربعة من دادياني في كنف عائلته. ومن أجلها كلّف الدوق المعماري
    باول شتيرن بتشييد مقرّ إقامة، هو نموذج للنزعة التاريخانية تلتقي فيه القوطية بالعمارة الإسلامية: نوافذ
    مدبّبة، وأقواس مغاربية، وبرج صغير، وسياج من الحديد المشغول. وصمّم المعماري البولندي ألكسندر روغويسكي
    جانباً من التصميمات الداخلية.


    وفي عام 1927 نقل دافيد أرسينيشفيلي (1905–1963)، الذي صار لاحقاً أول مدير لمتحف أندريه روبليوف في موسكو،
    متحفَه المسرحي إلى هذا البيت، وهو في الحادية والعشرين من عمره. ومنذ ذلك الحين تجاوزت المجموعة 300,000
    قطعة تتصل بالمسرح والسينما والسيرك والفولكلور والأوبرا والباليه في جورجيا، ومنذ عام 2020 يحمل المتحف
    اسم «قصر الفنون في جورجيا». ثلاثة أشياء تستحق البحث عنها:


    - تصاميم الديكور والأزياء، نحو 10,000 عمل لأكثر من 300 فنان جورجي، من بينهم بيتري أوتسخيلي

    - قناع مسرحي من العصور القديمة، عُثر عليه في حفريات فاني

    - منمنمات فارسية من العهد القاجاري، وأعمال لليون باكست وكونستانتين كوروفين وألكسندر بينوا


    قصة حب أثارت فضيحة في كوتايسي انتهت بأن آوت ذاكرة المسرح الجورجي بأكمله. ويصعب أن تتخيّل لبيتٍ حياةً
    بعد الموت أكثر مسرحية من هذه.
  tip: >-
    مفتوح من الثلاثاء إلى الأحد، 10:30–17:30، ومغلق أيام الاثنين. رسم الدخول 12 لاري. اسأل إن كان هناك
    مرشد: فأجمل الحكايات، عن الدوق وأغريبينا والقاعات نفسها، غير مكتوبة على البطاقات التعريفية. المعارض
    المؤقتة تتغيّر كثيراً، فراجع موقع artpalace.ge قبل الذهاب. الحديقة ظليلة هادئة، ونادراً ما تزدحم.
    ويقع متحف الحرير الحكومي على بعد أقل من كيلومتر، وهو مكمّل طبيعي للزيارة، لكن تحقّق من مواعيد عمله
    مسبقاً، فهي تختلف عن مواعيد قصر الفنون.
  route: >-
    يقع القصر في الرقم 6 من شارع إيا كارغاريتيلي في تشوغوريتي، على الضفة اليسرى لنهر متكفاري. من ساحة
    الحرية اعبر النهر على الجسر الجاف أو جسر زاربروكن، واصعد إلى ساحة مارجانيشفيلي، ثم تابع شمالاً عبر
    تشوغوريتي حتى شارع كارغاريتيلي: نحو 5 كم بالطريق، و10–15 دقيقة من دون زحام. اركن في المنطقة المدفوعة
    على طول كارغاريتيلي والشوارع المجاورة (تطبيق Tbilisi Parking)؛ أما قرب ساحة مارجانيشفيلي فالعثور على
    مكان أصعب. السيارة الاقتصادية تكفي تماماً. ومن دون سيارة، تقع محطة مترو مارجانيشفيلي على بعد نحو عشر
    دقائق سيراً.
