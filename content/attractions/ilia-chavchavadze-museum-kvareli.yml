ka:
  name: ილია ჭავჭავაძის სახლ-მუზეუმი
  short: >-
    ყვარელი, სადაც ილია ჭავჭავაძე დაიბადა: XVII საუკუნის კოშკი, ხუთასწლოვანი კაკალი, 37 ქვევრიანი მარანი
    და დურუჯზე დღემდე მომუშავე წისქვილი.
  body: >-
    **ოჯახური გადმოცემით, ილია ჭავჭავაძე განთიადისას, კოშკის მეორე სართულზე დაიბადა — იმ დილით სოფელს
    მტერი შემოესია და ოჯახი კოშკში იმალებოდა.**


    ეს იყო 1837 წლის 8 ნოემბერი (ძველი სტილით 27 ოქტომბერი). XVII საუკუნის სამსართულიანი კოშკი, სადაც
    შემოსევების დროს ქალები და ბავშვები იმალებოდნენ, აღდგენილი სახით დღესაც ეზოში დგას. მის გვერდით პატარა,
    სამოთახიანი სახლია მოჩუქურთმებული ხის აივნით — აქ გაიზარდა ბავშვი, რომელსაც შემდეგ ერი „საქართველოს
    უგვირგვინო მეფეს“ უწოდებდა.


    ილია მწერალი, პუბლიცისტი, რედაქტორი, ბანკირი და პოლიტიკოსი იყო; დააარსა „საქართველოს მოამბე“ და „ივერია“,
    მისივეა ფორმულა „ენა, მამული, სარწმუნოება“. 1907 წლის 30 აგვისტოს (ახალი სტილით 12 სექტემბერს) წიწამურთან,
    მცხეთის მახლობლად, ჩასაფრებულმა მკვლელებმა მოკლეს. 1987 წელს საქართველოს მართლმადიდებელმა ეკლესიამ
    იგი წმინდანად შერაცხა — წმინდა ილია მართალი.


    ეზოში სამი რამ შეგაჩერებთ:


    - ხუთასი წლის კაკალი — გადმოცემით, მის ჩრდილში ილია გლეხებს ესაუბრებოდა და მათგან მოსმენილ ზღაპრებს
    იწერდა;

    - ოჯახის მარანი 37 ქვევრით, სადაც ღვინოს საუკუნეების განმავლობაში აყენებდნენ;

    - წისქვილი მდინარე დურუჯზე, რომელიც დღესაც ფქვავს.


    ყოველი წლის 8 ნოემბერს, ილიაობას, ამ მარანში რქაწითელსა და საფერავს ძველი წესით ქვევრში აყენებენ —
    ზეიმზე დასწრება ნებისმიერ მსურველს შეუძლია. ეს მუზეუმი წინანდალს ნუ აგერევათ: იქაური მამული ილიას
    ნათესავს, ალექსანდრე ჭავჭავაძეს ეკუთვნოდა.


    თბილისის ერთ-ერთი უმთავრესი გამზირი და უნივერსიტეტი ილიას სახელს ატარებს. აქ, ყვარელში, მისი სახელი
    უფრო მოკრძალებულ რამეებს შემორჩა: კაკლის ხეს, წისქვილის ბორბალს და მარანს, სადაც მისი დაბადების დღეს
    ახლაც ღვინო დგება.
  tip: >-
    ბილეთი, სტუმრების ცნობით, დაახლოებით 5 ლარი ღირს — ოფიციალური ფასი არ ქვეყნდება, ამიტომ მცირე ცვლილებას
    ნუ გაიკვირვებთ. დათვალიერებას ერთი საათი ეყოფა: კოშკი, სახლი, მარანი, წისქვილი და საგამოფენო დარბაზი.
    მანქანა ჭიშკართან დააყენეთ, ეზო სწორია. თუ ნოემბერში საქართველოში ხართ, 8 ნოემბერს, ილიაობაზე ჩამოდით
    — მაშინ მარანი ცოცხლდება. სადილი ყვარელში გადადეთ; ხარებას ღვინის გვირაბი ორიოდე კილომეტრშია, ყვარლის
    ტბა — ექვსში.
  route: >-
    თბილისიდან ყვარლამდე დაახლოებით 143 კმ-ია — 2 სთ 10 წთ, მთელი გზა ასფალტზე. ყველაზე საიმედოა კახეთის
    გზატკეცილი (ს5): საგარეჯოს გავლით ბაკურციხემდე, იქიდან ჩრდილოეთით გურჯაანისკენ და შემდეგ მუკუზანი–ყვარლის
    გზით (შ69) ქალაქამდე. მოკლე ალტერნატივა გომბორის უღელტეხილია თელავის გავლით, თუმცა ზამთარში, თოვლის
    შემდეგ, ის შეიძლება დროებით ჩაიკეტოს — მაშინ ს5-ს ამჯობინეთ. მუზეუმი ქალაქის პირასაა, ჭიშკართან პარკინგით.
    ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Ilia Chavchavadze House Museum, Kvareli
  short: >-
    Ilia Chavchavadze's birthplace in Kvareli: a 17th-century tower, a 500-year-old walnut, a cellar of
    37 qvevri and a mill still turning on the Duruji.
  body: >-
    **Family tradition says Ilia Chavchavadze was born at dawn on the second floor of a defence tower,
    while raiders fell on the village and his family sheltered inside.**


    That was 8 November 1837 (27 October, Old Style). The three-storey 17th-century tower, where women
    and children hid during invasions, still stands in the yard, reconstructed. Beside it is the small
    three-room house with a carved wooden balcony where the boy grew up — the boy the nation would later
    call "the uncrowned king of Georgia".


    He became a writer, journalist, editor, banker and politician; he founded the newspapers Sakartvelos
    Moambe and Iveria and gave Georgia its motto "Language, Homeland, Faith". On 30 August 1907 (12 September,
    New Style) he was ambushed and shot dead at Tsitsamuri, near Mtskheta. In 1987 the Georgian Orthodox
    Church canonised him as Saint Ilia the Righteous.


    Three things in the grounds are worth slowing down for:


    - a 500-year-old walnut tree, in whose shade, tradition says, Ilia talked with peasants and wrote
    down the folk tales they told him;

    - the family wine cellar with 37 qvevri, used for wine over centuries;

    - a watermill on the Duruji River that still grinds today.


    Every 8 November, on Iliaoba, Rkatsiteli and Saperavi grapes are made into wine in this cellar the
    old way, and visitors are welcome. Do not confuse the place with Tsinandali: that estate belonged
    to Ilia's kinsman Alexander Chavchavadze.


    A major Tbilisi avenue and a university carry Ilia's name. Here in Kvareli it has attached itself
    to humbler things: a walnut tree, a mill wheel and a cellar that still makes wine on his birthday.
  tip: >-
    Visitors report a ticket of about 5 GEL; no official price is published, so expect small changes.
    An hour covers the tower, house, cellar, mill and exhibition hall. Park at the gate; the grounds are
    flat and easy. If you are in Georgia in November, come on the 8th for Iliaoba, when the cellar comes
    back to life. Save lunch for Kvareli town. The Khareba Wine Tunnel is about 2 km away and Kvareli
    Lake about 6 km, so both slot neatly into the same afternoon.
  route: >-
    Kvareli is about 143 km from Tbilisi — roughly 2 hours 10 minutes, asphalt the whole way. The most
    reliable route is the Kakheti Highway (S5) through Sagarejo to Bakurtsikhe, then north through Gurjaani
    and along the Mukuzani–Kvareli road (Sh69) into town. The shorter alternative crosses the Gombori
    Pass via Telavi, but it can close for a while after heavy winter snow, when the S5 is the safer choice.
    The museum is on the edge of town with parking at the gate. An economy car is entirely adequate.
ru:
  name: Дом-музей Ильи Чавчавадзе в Кварели
  short: >-
    Родина Ильи Чавчавадзе в Кварели: башня XVII века, 500-летний орех, марани с 37 квеври и мельница,
    которая до сих пор вертится на Дуруджи.
  body: >-
    **Семейное предание гласит, что Илья Чавчавадзе родился на рассвете, на втором этаже оборонительной
    башни, — в тот час, когда на село напали налётчики, а семья укрылась внутри.**


    Было это 8 ноября 1837 года (27 октября по старому стилю). Трёхэтажная башня XVII века, где во время
    нашествий прятались женщины и дети, и сегодня стоит во дворе — в восстановленном виде. Рядом — небольшой
    дом в три комнаты с резным деревянным балконом, где рос мальчик, которого народ позже назовёт «некоронованным
    царём Грузии».


    Он стал писателем, журналистом, редактором, банкиром и политиком; основал газеты «Сакартвелос моамбе»
    и «Иверия» и дал Грузии девиз «Язык, Отечество, Вера». 30 августа 1907 года (12 сентября по новому
    стилю) его подстерегли в засаде и застрелили у Цицамури, неподалёку от Мцхеты. В 1987 году Грузинская
    православная церковь причислила его к лику святых как святого Илию Праведного.


    В усадьбе стоит задержаться у трёх вещей:


    - у 500-летнего ореха, в тени которого, по преданию, Илья беседовал с крестьянами и записывал рассказанные
    ими народные сказки;

    - у семейного винного погреба с 37 квеври, где вино делали веками;

    - у водяной мельницы на реке Дуруджи, которая мелет и сегодня.


    Каждый год 8 ноября, в Илиаобу, в этом погребе по старинке делают вино из винограда ркацители и саперави,
    и гостям здесь рады. Не путайте это место с Цинандали: та усадьба принадлежала родственнику Ильи,
    Александру Чавчавадзе.


    Имя Ильи носят один из главных проспектов Тбилиси и университет. А здесь, в Кварели, оно пристало
    к вещам попроще: к ореху, мельничному колесу и погребу, где в его день рождения всё ещё делают вино.
  tip: >-
    По отзывам посетителей, билет стоит около 5 лари; официальная цена нигде не опубликована, так что
    возможны небольшие расхождения. Часа хватит на башню, дом, погреб, мельницу и выставочный зал. Парковка
    у ворот; территория ровная, ходить легко. Если вы в Грузии в ноябре, приезжайте 8-го, на Илиаобу,
    когда погреб снова оживает. Обед оставьте на город Кварели. Винный тоннель Хареба — примерно в 2 км,
    озеро Кварели — около 6 км, так что оба легко вписываются в тот же день.
  route: >-
    Кварели — примерно в 143 км от Тбилиси, около 2 часов 10 минут, асфальт на всём пути. Надёжнее всего
    ехать по Кахетинскому шоссе (S5) через Сагареджо до Бакурцихе, затем на север через Гурджаани и по
    дороге Мукузани — Кварели (Sh69) в город. Более короткий вариант идёт через Гомборский перевал и Телави,
    но после сильных зимних снегопадов перевал бывает на время закрыт, и тогда безопаснее S5. Музей на
    окраине города, парковка у ворот. Автомобиля эконом-класса вполне достаточно.
fa:
  name: خانه‌موزهٔ ایلیا چاوچاوادزه، کوارلی
  short: >-
    زادگاه ایلیا چاوچاوادزه در کوارلی: برجی از سدهٔ ۱۷، درخت گردویی ۵۰۰ ساله، سردابی با ۳۷ کووری و آسیابی
    که هنوز بر رود دوروجی می‌چرخد.
  body: >-
    **به روایت خانوادگی، ایلیا چاوچاوادزه سپیده‌دم در طبقهٔ دوم برجی دفاعی به دنیا آمد، در همان هنگام
    که مهاجمان بر روستا تاختند و خانواده‌اش درون برج پناه گرفته بود.**


    آن روز ۸ نوامبر ۱۸۳۷ بود (۲۷ اکتبر به گاه‌شماری کهنه). برج سه‌طبقهٔ سدهٔ ۱۷، که زنان و کودکان هنگام
    یورش‌ها در آن پنهان می‌شدند، هنوز در حیاط پابرجاست، البته بازسازی‌شده. کنارش خانهٔ کوچک سه‌اتاقه‌ای
    با ایوان چوبی کنده‌کاری‌شده است که پسرک در آن بزرگ شد؛ پسری که ملت بعدها او را «پادشاه بی‌تاج گرجستان»
    خواند.


    او نویسنده، روزنامه‌نگار، سردبیر، بانکدار و سیاستمدار شد؛ روزنامه‌های «ساکارتولوس موامبه» و «ایوریا»
    را بنیان نهاد و شعار «زبان، میهن، ایمان» را به گرجستان داد. در ۳۰ اوت ۱۹۰۷ (۱۲ سپتامبر به گاه‌شماری
    نو)، در تسیتساموری نزدیک متسختا، در کمین گرفتار شد و با گلوله کشته شد. در سال ۱۹۸۷ کلیسای ارتدکس گرجستان
    او را با نام «ایلیای قدیسِ پارسا» در شمار قدیسان آورد.


    در این محوطه سه چیز ارزش درنگ دارد:


    - درخت گردویی ۵۰۰ ساله که به روایت سنت، ایلیا در سایه‌اش با دهقانان گفت‌وگو می‌کرد و قصه‌های عامیانه‌ای
    را که برایش می‌گفتند می‌نوشت؛

    - سرداب شراب خانوادگی با ۳۷ کووری، که سده‌ها در آن شراب ساخته‌اند؛

    - آسیاب آبی بر رود دوروجی که امروز هم آرد می‌کند.


    هر سال در ۸ نوامبر، روز ایلیائوبا، در همین سرداب از انگورهای رکاتسیتلی و ساپراوی به شیوهٔ کهن شراب
    می‌سازند و درِ آن به روی بازدیدکنندگان باز است. این مکان را با تسیناندالی اشتباه نگیرید: آن ملک از
    آنِ الکساندر چاوچاوادزه، خویشاوند ایلیا، بود.


    یکی از خیابان‌های اصلی تفلیس و یک دانشگاه نام ایلیا را بر خود دارند. اما اینجا در کوارلی، این نام
    به چیزهایی فروتن‌تر پیوسته است: یک درخت گردو، یک چرخ آسیاب و سردابی که هنوز در روز تولد او شراب می‌سازد.
  tip: >-
    به گفتهٔ بازدیدکنندگان، بلیت حدود ۵ لاری است؛ قیمت رسمی‌ای منتشر نشده، پس انتظار تغییرات جزئی را داشته
    باشید. یک ساعت برای برج، خانه، سرداب، آسیاب و تالار نمایشگاه کافی است. کنار دروازه پارک کنید؛ محوطه
    هموار و راه رفتن در آن آسان است. اگر در نوامبر در گرجستان هستید، روز هشتم برای ایلیائوبا بیایید، وقتی
    سرداب دوباره جان می‌گیرد. ناهار را برای شهر کوارلی نگه دارید. تونل شراب خارِبا حدود ۲ کیلومتر و دریاچهٔ
    کوارلی حدود ۶ کیلومتر دورتر است، پس هر دو به‌خوبی در همان بعدازظهر جا می‌گیرند.
  route: >-
    کوارلی حدود ۱۴۳ کیلومتر با تفلیس فاصله دارد؛ نزدیک به ۲ ساعت و ۱۰ دقیقه، و سراسر راه آسفالت است. مطمئن‌ترین
    مسیر، بزرگراه کاختی (S5) از میان ساگارجو تا باکورتسیخه است؛ سپس به سوی شمال از گورجانی می‌گذرید و
    از جادهٔ موکوزانی–کوارلی (Sh69) به شهر می‌رسید. راه کوتاه‌تر از گذرگاه گومبوری و تلاوی می‌گذرد، اما
    پس از برف سنگین زمستانی ممکن است مدتی بسته شود و آن‌گاه S5 انتخاب امن‌تری است. موزه در حاشیهٔ شهر
    است و کنار دروازه‌اش جای پارک هست. خودروی اقتصادی کاملاً کافی است.
he:
  name: בית־מוזיאון איליה צ'בצ'בדזה בקוורלי
  short: >-
    בית הולדתו של איליה צ'בצ'בדזה בקוורלי: מגדל מהמאה ה-17, עץ אגוז בן 500 שנה, מרתף עם 37 קווברי וטחנה
    שעדיין מסתובבת על נהר הדורוג'י.
  body: >-
    **לפי מסורת המשפחה, איליה צ'בצ'בדזה נולד עם שחר בקומה השנייה של מגדל הגנה, בשעה שפושטים התנפלו על
    הכפר ובני המשפחה מצאו בו מחסה.**


    היה זה ב-8 בנובמבר 1837 (27 באוקטובר לפי הלוח הישן). המגדל בן שלוש הקומות מהמאה ה-17, שבו הסתתרו נשים
    וילדים בעת פלישות, עדיין עומד בחצר, משוחזר. לצדו הבית הקטן בן שלושת החדרים, עם מרפסת עץ מגולפת, שבו
    גדל הילד – הילד שהאומה תכנה לימים "המלך הלא-מוכתר של גאורגיה".


    הוא היה לסופר, עיתונאי, עורך, בנקאי ופוליטיקאי; ייסד את העיתונים "סקרטוולוס מואמבה" ו"איבריה" והעניק
    לגאורגיה את הסיסמה "שפה, מולדת, אמונה". ב-30 באוגוסט 1907 (12 בספטמבר לפי הלוח החדש) נפל למארב ונורה
    למוות בציצאמורי, סמוך למצחתה. ב-1987 הכריזה עליו הכנסייה האורתודוקסית הגאורגית כקדוש, "איליה הצדיק
    הקדוש".


    בחצר כדאי להאט ליד שלושה דברים:


    - עץ אגוז בן 500 שנה, שבצלו, לפי המסורת, שוחח איליה עם האיכרים ורשם את מעשיות העם שסיפרו לו;

    - מרתף היין של המשפחה ובו 37 קווברי, ששימשו ליין במשך מאות שנים;

    - טחנת מים על נהר הדורוג'י, שטוחנת עד היום.


    מדי 8 בנובמבר, בחג איליאובה, מכינים במרתף הזה יין מענבי רקציטלי וספרווי בדרך המסורתית, והמבקרים מוזמנים.
    אל תבלבלו בין המקום הזה לצינאנדלי: האחוזה ההיא הייתה שייכת לקרוב משפחתו של איליה, אלכסנדר צ'בצ'בדזה.


    אחת השדרות המרכזיות של טביליסי ואוניברסיטה נושאות את שמו של איליה. כאן, בקוורלי, השם דבק בדברים צנועים
    יותר: עץ אגוז, גלגל טחנה ומרתף שעדיין מכין יין ביום הולדתו.
  tip: >-
    לפי דיווחי מבקרים, הכרטיס עולה כ-5 לארי; מחיר רשמי לא פורסם, אז ייתכנו שינויים קטנים. שעה מספיקה למגדל,
    לבית, למרתף, לטחנה ולאולם התצוגה. חונים ליד השער; השטח מישורי ונוח להליכה. אם אתם בגאורגיה בנובמבר,
    בואו ב-8 בחודש, לאיליאובה, כשהמרתף שב לחיים. את ארוחת הצהריים שמרו לעיר קוורלי. מנהרת היין חארבה נמצאת
    כ-2 ק"מ מכאן ואגם קוורלי כ-6 ק"מ, כך ששניהם משתלבים בקלות באותו אחר צהריים.
  route: >-
    קוורלי נמצאת כ-143 ק"מ מטביליסי – כשעתיים ו-10 דקות נסיעה, על אספלט לכל אורכה. הדרך האמינה ביותר היא
    כביש קאחטי (S5) דרך סאגארג'ו עד בקורציחה, ומשם צפונה דרך גורג'אני ובכביש מוקוזאני–קוורלי (Sh69) אל
    העיר. החלופה הקצרה יותר חוצה את מעבר גומבורי דרך טלאווי, אבל אחרי שלג כבד בחורף המעבר עלול להיסגר
    לזמן מה, ואז כביש S5 בטוח יותר. המוזיאון נמצא בשולי העיר, עם חניה ליד השער. רכב חסכוני מספיק בהחלט.
ar:
  name: متحف بيت إيليا تشافتشافادزه، كفاريلي
  short: >-
    مسقط رأس إيليا تشافتشافادزه في كفاريلي: برج من القرن السابع عشر، وشجرة جوز عمرها 500 عام، وقبو فيه
    37 كفيفري، وطاحونة ما زالت تدور على نهر دوروجي.
  body: >-
    **يروي تقليد العائلة أن إيليا تشافتشافادزه وُلد عند الفجر في الطابق الثاني من برج دفاعي، بينما كان
    المغيرون ينقضّون على القرية وقد احتمت أسرته في داخله.**


    كان ذلك في 8 نوفمبر 1837 (27 أكتوبر بالتقويم القديم). وما زال البرج ذو الطوابق الثلاثة، العائد إلى
    القرن السابع عشر، والذي كانت النساء والأطفال يختبئون فيه أيام الغزوات، قائماً في الفناء بعد إعادة
    بنائه. وإلى جانبه البيت الصغير ذو الغرف الثلاث وشرفته الخشبية المنحوتة، حيث نشأ الصبي الذي ستسمّيه
    الأمة لاحقاً «ملك جورجيا غير المتوَّج».


    صار كاتباً وصحفياً ومحرراً ومصرفياً وسياسياً؛ وأسّس صحيفتي «ساكارتفيلوس موامبي» و«إيفيريا»، ومنح جورجيا
    شعارها «اللغة، الوطن، الإيمان». وفي 30 أغسطس 1907 (12 سبتمبر بالتقويم الجديد) نُصب له كمين وقُتل رمياً
    بالرصاص في تسيتساموري قرب متسخيتا. وفي عام 1987 أعلنت الكنيسة الأرثوذكسية الجورجية قداسته باسم القديس
    إيليا البار.


    في أرجاء الفناء ثلاثة أشياء تستحق أن تتمهّل عندها:


    - شجرة جوز عمرها 500 عام، يُروى أن إيليا كان يجلس في ظلها يحادث الفلاحين ويدوّن الحكايات الشعبية التي
    يروونها له؛

    - قبو النبيذ العائلي وفيه 37 كفيفري، استُخدمت للنبيذ على مدى قرون؛

    - طاحونة مائية على نهر دوروجي ما زالت تطحن حتى اليوم.


    وفي 8 نوفمبر من كل عام، يوم عيد إيلياوبا، يُصنع في هذا القبو نبيذ من عنبي ركاتسيتيلي وسابيرافي على
    الطريقة القديمة، والزوار مرحَّب بهم. ولا تخلط بين هذا المكان وتسيناندالي: فتلك الضيعة كانت لقريب إيليا،
    ألكسندر تشافتشافادزه.


    يحمل اسمَ إيليا أحدُ أهم شوارع تبليسي وجامعةٌ أيضاً. أما هنا في كفاريلي، فقد تعلّق الاسم بأشياء أكثر
    تواضعاً: شجرة جوز، وعجلة طاحونة، وقبو ما زال يصنع النبيذ في يوم مولده.
  tip: >-
    يذكر الزوار أن سعر التذكرة نحو 5 لاري؛ ولا يوجد سعر رسمي منشور، فتوقّع تغيّرات طفيفة. ساعة واحدة تكفي
    للبرج والبيت والقبو والطاحونة وقاعة العرض. اركن عند البوابة؛ والأرض مستوية وسهلة المشي. إن كنت في
    جورجيا في نوفمبر فتعالَ يوم 8 منه، في عيد إيلياوبا، حين يعود القبو إلى الحياة. وأجّل الغداء إلى بلدة
    كفاريلي. يقع نفق خاريبا للنبيذ على بُعد نحو 2 كم وبحيرة كفاريلي على بُعد نحو 6 كم، فيسهل ضمّهما إلى
    العصر نفسه.
  route: >-
    تبعد كفاريلي نحو 143 كم عن تبليسي، أي قرابة ساعتين و10 دقائق، والطريق معبّد بالكامل. أوثق الطرق هو
    طريق كاخيتي السريع (S5) عبر ساغاريجو حتى باكورتسيخه، ثم شمالاً عبر غورجاني، فطريق موكوزاني–كفاريلي
    (Sh69) إلى البلدة. أما البديل الأقصر فيعبر ممر غومبوري عبر تيلافي، لكنه قد يُغلق لبعض الوقت بعد تساقط
    الثلوج الكثيفة في الشتاء، وعندها يكون S5 الخيار الأكثر أماناً. يقع المتحف على طرف البلدة، وفيه موقف
    عند البوابة. تكفي تماماً سيارة من الفئة الاقتصادية.
