ka:
  name: ქინტრიშის დაცული ტერიტორიები
  short: ქობულეთის ზემოთ არსებული ხეობა რელიქტური ტყით, შუასაუკუნეების ეკლესიითა და მაღალმთიანი ტბით.
  body: >-
    **ქინტრიშის ნაკრძალი 1959 წელს დაარსდა და საქართველოს ერთ-ერთი უძველესი დაცული ტერიტორიაა.** ის ქობულეთიდან
    აღმოსავლეთით იწყება, მდინარე ქინტრიშის ხეობას მიჰყვება და დაახლოებით ცამეტ ათას ჰექტარს მოიცავს —
    ზღვის დონიდან ორასი მეტრიდან თითქმის ორ ათას ხუთასამდე.

    ღირებულება ბოტანიკურია. ქინტრიშის ტყე კოლხური რელიქტური ტიპისაა: ის მესამეული პერიოდის მცენარეულობის
    ნაშთია, რომელიც კავკასიონის ქედმა გამყინვარებისგან დაიცვა. სწორედ ამიტომ აქ ერთ ფერდობზე ხვდები წაბლს,
    წიფელს, უთხოვარს, შქერსა და კოლხურ სურო — შეხამებას, რომელიც ევროპაში სხვაგან აღარსად გვხვდება.

    ხეობაში სამი რამ იმსახურებს ცალკე გაჩერებას:

    - **ხინოს ეკლესია** — შუა საუკუნეების პატარა ბაზილიკა სოფელ ხინოში, აჭარაში შემორჩენილ მცირერიცხოვან
    ქრისტიანულ ძეგლთაგან

    - **თბიკელის ტბა** — მყინვარული ტბა დაახლოებით ორი ათასი მეტრის სიმაღლეზე, სადაც ხინოდან ფეხით ან
    ცხენით ადიან; ერთი მიმართულებით სამიდან ოთხ საათამდე

    - **თაღოვანი ხიდები** ხეობის ქვედა ნაწილში, იმავე ტიპისა, რაც აჭარისწყალზეა

    ინფრასტრუქტურა მინიმალურია: მარკირება ადგილ-ადგილაა, ბილიკები ზოგან გარეცხილი, ვიზიტორთა სერვისი სუსტი.
    ეს არაა პარკი, სადაც უბრალოდ ჩამოხვალ და ორსაათიან სეირნობას გააკეთებ — აქ ან ერთი დღე უნდა დაუთმო,
    ან საერთოდ არ ღირს. სამაგიეროდ, აჭარის სხვა დაცულ ტერიტორიებთან შედარებით აქ თითქმის არავინაა.
  tip: >-
    ერთი სრული დღე. ტბიკელამდე ასვლა სერიოზული ლაშქრობაა — ადგილობრივი გიდის გარეშე არ ღირს, ბილიკი ცუდადაა
    მონიშნული. ხეობის ქვედა ნაწილი ნახევარ დღეშიც ეტევა. ტკიპა და ჭინჭარი ჩვეულებრივია, გრძელი შარვალი
    აუცილებელია. წვიმა ხშირია — წყალგაუმტარი ქურთუკი ზაფხულშიც. სასტუმრო და კვება მხოლოდ ქობულეთშია; ხეობაში
    მაღაზია არაა.
  route: >-
    ქობულეთიდან აღმოსავლეთით ქინტრიშის ხეობაში, ციხისძირისა და ხუცუბნის გავლით — თბილისიდან ჯამში 375
    კმ, დაახლოებით ხუთი საათი ორმოცდაათი წუთი. E60 სამტრედიამდე, შემდეგ ზღვის გზა ქობულეთამდე, მერე ოცდაათიოდე
    კილომეტრი ხეობაში. პირველი ნახევარი ასფალტია, შემდეგ ხრეშია, ღრმა ორმოებით და რამდენიმე ბროდით. მაღალი
    კლირენსი აუცილებელია, წვიმის შემდეგ — ოთხბორბლიანი წევა. საწვავი ქობულეთშია, ხეობაში — არა.
en:
  name: Kintrishi Protected Areas
  short: A valley of relict forest above Kobuleti, with a medieval church and a glacial lake high above
    it.
  body: >-
    **Kintrishi was designated in 1959 and is one of Georgia's oldest protected areas.** It begins east
    of Kobuleti, follows the Kintrishi river valley, and covers roughly thirteen thousand hectares, from
    around two hundred metres above sea level to nearly two and a half thousand.

    The value here is botanical. The Kintrishi forest is Colchic relict woodland: a surviving fragment
    of Tertiary vegetation that the Caucasus range sheltered through the glaciations. That is why a single
    slope can carry chestnut, beech, yew, rhododendron and Colchic ivy together — a combination that exists
    nowhere else in Europe.

    Three things in the valley deserve a stop of their own:

    - **Khino church**, a small medieval basilica in the village of Khino, one of the few surviving Christian
    monuments in Adjara

    - **Lake Tbikeli**, a glacial lake at about two thousand metres, reached on foot or on horseback from
    Khino — three to four hours each way

    - **Arched bridges** in the lower valley, of the same type as those on the Adjaristsqali

    Infrastructure is minimal: waymarking is patchy, some paths are washed out, and visitor services are
    thin. This is not a park you drop into for a two-hour stroll. Either give it a full day or leave it
    for another trip. In exchange, compared with the other protected areas in Adjara, there is almost
    nobody here.
  tip: >-
    Allow a full day. The climb to Tbikeli is a serious hike and not worth attempting without a local
    guide, as the path is poorly marked. The lower valley alone fits into half a day. Ticks and nettles
    are common, so long trousers matter. Rain is frequent — carry a waterproof even in summer. Accommodation
    and food are in Kobuleti only; there are no shops in the valley.
  route: >-
    From Kobuleti head east into the Kintrishi valley through Tsikhisdziri and Khutsubani — 375 km from
    Tbilisi in total, about five hours fifty. Take the E60 to Samtredia, the coast road to Kobuleti, then
    some thirty kilometres inland. The first half is asphalt, after which it becomes gravel with deep
    potholes and a few fords. Good clearance is necessary and four-wheel drive is advisable after rain.
    Fuel is available in Kobuleti and nowhere in the valley.
ru:
  name: Заповедник Кинтриши
  short: Ущелье реликтового леса выше Кобулети, со средневековой церковью и ледниковым озером над ним.
  body: >-
    **Кинтриши получил статус заповедника в 1959 году и остаётся одной из старейших охраняемых территорий
    Грузии.** Он начинается к востоку от Кобулети, идёт по долине реки Кинтриши и охватывает около тринадцати
    тысяч гектаров — от двухсот метров над уровнем моря почти до двух с половиной тысяч.

    Главная ценность здесь ботаническая. Лес Кинтриши — колхидский реликтовый: уцелевший фрагмент третичной
    растительности, которую Кавказский хребет укрыл от оледенений. Поэтому на одном склоне соседствуют
    каштан, бук, тис, рододендрон и колхидский плющ — сочетание, которого больше нигде в Европе нет.

    Три вещи в ущелье заслуживают отдельной остановки:

    - **Церковь Хино**, небольшая средневековая базилика в селе Хино, один из немногих уцелевших христианских
    памятников Аджарии

    - **Озеро Тбикели**, ледниковое, примерно на двух тысячах метров; поднимаются к нему пешком или верхом
    из Хино — три-четыре часа в одну сторону

    - **Арочные мосты** в нижней части долины, того же типа, что и на Аджарисцкали

    Инфраструктура минимальна: маркировка местами, часть троп размыта, сервис для посетителей слабый.
    Сюда не заезжают на двухчасовую прогулку. Либо отдавайте этому целый день, либо оставьте на другой
    раз. Взамен здесь, в отличие от остальных охраняемых территорий Аджарии, почти никого нет.
  tip: >-
    Закладывайте полный день. Подъём к Тбикели — серьёзный поход, без местного проводника лучше не идти:
    тропа размечена плохо. Нижняя часть долины укладывается и в полдня. Клещи и крапива обычны, длинные
    брюки нужны. Дождь частый — дождевик и летом. Ночлег и еда только в Кобулети, магазинов в ущелье нет.
  route: >-
    Из Кобулети на восток в ущелье Кинтриши через Цихисдзири и Хуцубани — от Тбилиси всего 375 км, около
    пяти часов пятидесяти минут. По E60 до Самтредиа, дальше приморской дорогой до Кобулети и примерно
    тридцать километров вглубь. Первая половина асфальт, потом гравий с глубокими ямами и несколькими
    бродами. Высокий клиренс необходим, после дождя желателен полный привод. Заправка есть в Кобулети,
    в ущелье — нет.
fa:
  name: مناطق حفاظت‌شدهٔ کینتریشی
  short: دره‌ای از جنگل بازمانده بالای کوبولتی، با کلیسایی از سده‌های میانه و دریاچه‌ای یخچالی در بالای
    آن.
  body: >-
    **کینتریشی در ۱۹۵۹ حفاظت‌شده اعلام شد و از کهن‌ترین مناطق حفاظت‌شدهٔ گرجستان است.** از شرق کوبولتی
    آغاز می‌شود، درهٔ رود کینتریشی را دنبال می‌کند و حدود سیزده هزار هکتار را در بر می‌گیرد؛ از دویست
    متری بالای دریا تا نزدیک دو هزار و پانصد متر.

    ارزش اینجا گیاه‌شناختی است. جنگل کینتریشی از نوع بازماندهٔ کلخیدی است: تکه‌ای از پوشش گیاهی دوران
    سوم که رشته‌کوه قفقاز آن را از یخبندان‌ها پناه داد. به همین سبب یک دامنه می‌تواند شاه‌بلوط، راش، سرخدار،
    خرزهره‌کوهی و پیچک کلخیدی را کنار هم داشته باشد؛ ترکیبی که جای دیگری در اروپا نیست.

    سه چیز در دره ارزش توقف جداگانه دارد:

    - **کلیسای خینو**، بازیلیکایی کوچک از سده‌های میانه در روستای خینو، از معدود بناهای مسیحی بازمانده
    در آجارا

    - **دریاچهٔ تبیکلی**، دریاچه‌ای یخچالی در حدود دو هزار متری، که پیاده یا با اسب از خینو به آن می‌روند؛
    سه تا چهار ساعت در هر جهت

    - **پل‌های طاقی** در بخش پایینی دره، از همان گونه‌ای که بر آجاریسْتسقالی هست

    زیرساخت‌ها کمینه‌اند: نشانه‌گذاری پراکنده است، برخی مسیرها شسته شده و خدمات بازدید ناچیز است. اینجا
    پارکی نیست که برای گشتی دوساعته سر بزنید. یا یک روز کامل به آن بدهید یا برای سفری دیگر بگذارید. در
    عوض، در قیاس با دیگر مناطق حفاظت‌شدهٔ آجارا، اینجا تقریباً کسی نیست.
  tip: >-
    یک روز کامل در نظر بگیرید. صعود به تبیکلی پیاده‌روی جدی است و بی راهنمای محلی نمی‌ارزد، چون مسیر بد
    نشانه‌گذاری شده. بخش پایینی دره در نیم روز جا می‌شود. کنه و گزنه معمول است و شلوار بلند لازم. باران
    زیاد می‌بارد؛ بارانی را حتی تابستان همراه ببرید. اقامت و خوراک تنها در کوبولتی است و در دره مغازه‌ای
    نیست.
  route: >-
    از کوبولتی به شرق در درهٔ کینتریشی از تسیخیسدزیری و خوتسوبانی — از تفلیس روی‌هم ۳۷۵ کیلومتر، حدود
    پنج ساعت و پنجاه دقیقه. با E60 تا سامترِدیا، سپس جادهٔ ساحلی تا کوبولتی و حدود سی کیلومتر به داخل.
    نیمهٔ نخست آسفالت است و پس از آن شنی با چاله‌های عمیق و چند گدار. ارتفاع مناسب از زمین لازم است و
    پس از باران دیفرانسیل چهار چرخ مطلوب. سوخت در کوبولتی هست و در دره نیست.
he:
  name: שמורות קינטרישי
  short: עמק של יער שריד מעל קובולטי, ובו כנסייה מימי הביניים ואגם קרחוני הרבה מעליו.
  body: >-
    **קינטרישי הוכרזה ב-1959 והיא מן השמורות הוותיקות בגאורגיה.** היא מתחילה ממזרח לקובולטי, עוקבת אחר
    עמק נהר קינטרישי ומשתרעת על כשלושה עשר אלף הקטרים — מגובה מאתיים מטר מעל פני הים ועד קרוב לאלפיים
    וחמש מאות.

    הערך כאן בוטני. יער קינטרישי הוא יער קולכי שריד: שריד של צמחיית העידן השלישוני שרכס הקווקז הגן עליה
    מפני תקופות הקרח. משום כך מדרון אחד יכול לשאת ערמון, אשור, טקסוס, רודודנדרון וקיסוס קולכי יחד — צירוף
    שאינו קיים בשום מקום אחר באירופה.

    שלושה דברים בעמק ראויים לעצירה נפרדת:

    - **כנסיית חינו**, בזיליקה קטנה מימי הביניים בכפר חינו, אחד המונומנטים הנוצריים המעטים ששרדו באג׳ריה

    - **אגם טביקלי**, אגם קרחוני בגובה כאלפיים מטר, שמגיעים אליו ברגל או על סוס מחינו — שלוש עד ארבע שעות
    לכל כיוון

    - **גשרי קשת** בחלק התחתון של העמק, מאותו טיפוס שעל אג׳ריסצקאלי

    התשתית מינימלית: הסימון חלקי, חלק מן השבילים נשטפו והשירות למבקרים דל. זה אינו פארק שקופצים אליו לטיול
    של שעתיים. או שמקדישים לו יום שלם או שמשאירים אותו לפעם אחרת. בתמורה, בהשוואה לשאר השמורות באג׳ריה,
    אין כאן כמעט איש.
  tip: >-
    הקצו יום שלם. הטיפוס לטביקלי הוא מסע רציני ולא כדאי בלי מדריך מקומי, כי השביל מסומן גרוע. החלק התחתון
    של העמק נכנס לחצי יום. קרציות וסרפדים שכיחים, ומכנסיים ארוכים חשובים. הגשם תכוף — קחו מעיל אטים גם
    בקיץ. לינה ואוכל רק בקובולטי; בעמק אין חנויות.
  route: >-
    מקובולטי מזרחה אל עמק קינטרישי דרך ציחיסדזירי וחוצובאני — 375 ק״מ מטביליסי בסך הכול, כחמש שעות וחמישים.
    בכביש E60 עד סמטרדיה, בכביש החוף עד קובולטי, ואז כשלושים קילומטרים פנימה. המחצית הראשונה סלולה, ואחריה
    חצץ עם בורות עמוקים וכמה מעברי מים. מרווח גחון גבוה הכרחי, ואחרי גשם רצוי הנעה כפולה. תדלוק בקובולטי,
    ובעמק אין.
ar:
  name: محميات كينتريشي
  short: وادٍ من الغابة المتبقية فوق كوبوليتي، بكنيسة من العصور الوسطى وبحيرة جليدية عالية فوقه.
  body: >-
    **أُعلنت كينتريشي محمية عام 1959 وهي من أقدم المناطق المحمية في جورجيا.** تبدأ شرق كوبوليتي وتتبع
    وادي نهر كينتريشي وتغطي نحو ثلاثة عشر ألف هكتار، من مئتي متر فوق سطح البحر إلى قرابة ألفين وخمسمئة.

    والقيمة هنا نباتية. غابة كينتريشي من النوع الكولخيدي المتبقي: شذرة باقية من نبات العصر الثلاثي حماها
    جبل القوقاز من العصور الجليدية. ولهذا قد يحمل منحدر واحد الكستناء والزان والطقسوس والرودودندرون واللبلاب
    الكولخيدي معاً؛ تركيبة لا وجود لها في أي مكان آخر في أوروبا.

    وثلاثة أشياء في الوادي تستحق وقفة خاصة:

    - **كنيسة خينو**، بازيليكا صغيرة من العصور الوسطى في قرية خينو، وهي من المعالم المسيحية القليلة الباقية
    في أجاريا

    - **بحيرة تبيكيلي**، بحيرة جليدية على نحو ألفي متر، يُصعد إليها سيراً أو على ظهر حصان من خينو؛ ثلاث
    إلى أربع ساعات في كل اتجاه

    - **جسور مقوسة** في أسفل الوادي، من النمط نفسه الموجود على أجاريستسقالي

    البنية التحتية في حدها الأدنى: التعليم متقطع وبعض الدروب جرفتها المياه وخدمات الزوار ضعيفة. هذا ليس
    منتزهاً تمر به لنزهة ساعتين. إما أن تمنحه يوماً كاملاً أو تتركه لرحلة أخرى. وفي المقابل، مقارنة ببقية
    محميات أجاريا، لا أحد هنا تقريباً.
  tip: >-
    احسب يوماً كاملاً. الصعود إلى تبيكيلي مسير جاد ولا يُنصح به دون مرشد محلي، فالدرب سيئ التعليم. أما
    أسفل الوادي فيتسع لنصف يوم. القراد والقُرّاص شائعان، والبنطال الطويل مهم. المطر متواتر، فاحمل معطفاً
    واقياً حتى في الصيف. الإقامة والطعام في كوبوليتي فقط، ولا متاجر في الوادي.
  route: >-
    من كوبوليتي شرقاً إلى وادي كينتريشي عبر تسيخيسدزيري وخوتسوباني — 375 كم من تبليسي إجمالاً، نحو خمس
    ساعات وخمسين دقيقة. خذ E60 حتى سامتريديا، ثم طريق الساحل إلى كوبوليتي، ثم نحو ثلاثين كيلومتراً إلى
    الداخل. النصف الأول معبّد، وبعده حصى بحفر عميقة وبضعة مخاضات. ارتفاع الهيكل ضروري، والدفع الرباعي
    مستحسن بعد المطر. الوقود في كوبوليتي ولا شيء في الوادي.
