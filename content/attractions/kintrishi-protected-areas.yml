ka:
  name: კინტრიშის დაცული ტერიტორიები
  short: >-
    იუნესკოს მსოფლიო მემკვიდრეობაში შესული კოლხური ტყე ქობულეთის ზემოთ: საეპისკოპოსო ტაძრის ნანგრევები,
    „თამარის ხიდი“ და ტბა თითქმის 2000 მეტრზე.
  body: >-
    **კინტრიშის ხეობა ინახავს ტყეს, რომელსაც გამყინვარებამ ვერ მიაღწია: მესამეული პერიოდიდან შემორჩენილ
    კოლხურ ტყეს, რომელიც 2021 წლიდან იუნესკოს მსოფლიო მემკვიდრეობის ნაწილია.**


    ნაკრძალი 1959 წელს დაარსდა, მის გარშემო დაცული ლანდშაფტი კი 2007 წელს დაემატა; ერთად ისინი დაახლოებით
    13 900 ჰექტარს მოიცავს, ზღვის დონიდან 300 მეტრიდან 2500 მეტრამდე. აქ წელიწადში დაახლოებით 3000 მილიმეტრი
    ნალექი მოდის, ფერდობებზე კი 900-ზე მეტი სახეობის მცენარე ხარობს, რომელთაგან 65 მხოლოდ კავკასიაში გვხვდება.
    ბზა და წაბლი, უთხოვარი და შქერი ერთსა და იმავე ნამიან ფერდობს იყოფენ. თავად ნაკრძალში მხოლოდ სამეცნიერო
    მიზნით შედიან; სტუმარი მის გარშემო, დაცულ ლანდშაფტში, მონიშნული ბილიკებით დადის.


    ცხემვანთან ქვის ხიდი პირდაპირ კლდიდან ამოდის. გადმოცემით, თამარ მეფე ადიდებულ მდინარეზე მსახურებს
    ოქროს ტახტით გადაჰყავდათ შოთა რუსთაველთან შესახვედრად; მდინარემ მეფეს ფეხსაცმელი წაართვა, მანაც ბრძანა,
    აქ ისეთი ხიდი აეგოთ, რომელსაც ვერც მდინარე მოერეოდა და ვერც ჟამი. ეს ლეგენდაა, ხიდი კი ნამდვილია.


    უფრო მაღლა, 1040 მეტრზე, სოფელ ხინოსთან, ხინოწმინდის ნანგრევებია, ოდესღაც მთის საეპისკოპოსოს საკათედრო
    ტაძარი. მისი გეგმა საქართველოში იშვიათია: ბაზილიკა, რომლის გვერდითი ნავები შუა ნავისგან კედლით იყო
    გამოყოფილი. ისტორიკოსი სიმონ ჯანაშია ვარაუდობდა, რომ IX საუკუნეში საეპისკოპოსო კათედრა ზღვისპირა პეტრიდან
    აქ ამოინაცვლა, თუმცა ამას არცერთი საბუთი არ ადასტურებს. XVIII საუკუნეში ოსმალთა შემოტევამ საეპისკოპოსოს
    ბოლო მოუღო, 1870-იანი წლების მიწისძვრამ ტაძარი კიდევ უფრო დაანგრია, XX საუკუნეში კი ერთმა სოფლელმა
    მისი ქვები სახლის ასაშენებლად წაიღო. რესტავრაცია 2017 წელს დაიწყო.


    ნანგრევებს იქით, კიდევ თორმეტ კილომეტრში, ტბიყელის ტბაა: 1900–2000 მეტრზე ჩაწოლილი ოვალური ტბა, 7–8
    მეტრის სიღრმისა, სადაც „წითელ ნუსხაში“ შეტანილი კავკასიური ტრიტონი ბინადრობს. ზამთარში მას თოვლი ფარავს.


    გზა გრძელი და სველია. სამაგიეროდ ნახავთ ტყეს, რომელმაც გამყინვარებას, ეპისკოპოსებსა და იმპერიებს გაუძლო,
    და დღესაც ჩუმად წვეთავს ზღვისპირა კურორტების თავზე.
  tip: >-
    დაიწყეთ ქობულეთიდან, დაცული ტერიტორიების ვიზიტორთა ცენტრიდან (ლესელიძის ქ. 4, 10:00–18:00): აქ რუკას
    მოგცემენ, გიდსა და ცხენსაც დაგიქირავებენ. „თამარის ხიდის“ ბილიკი ერთ დღეში ეტევა; „უთხოვრისა და ტბიყელის“
    მარშრუტს ორი დღე სჭირდება, ფეხით ან ცხენით, ცხემვანში კი ვიზიტორთა თავშესაფარი და საპიკნიკე ადგილებია.
    საოჯახო სასტუმროში ღამე საუზმით დაახლოებით 50–60 ლარი ღირს. აქ წვიმას მეტრებით ითვლიან: წყალგაუმტარი
    ტანსაცმელი ივლისშიც წაიღეთ, ტკიპების გამო კი გრძელი შარვალი ჩაიცვით. ზამთარში ტბა თოვლშია, ამიტომ
    ჩამოდით მაისიდან ოქტომბრამდე.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, ს12-ით ლანჩხუთის გავლით გრიგოლეთამდე, შემდეგ კი
    ს2-ით სამხრეთით, ზღვის გაყოლებით, ქობულეთამდე. ქობულეთიდან ხეობის გზა აღმოსავლეთით, ხუცუბნის გავლით
    მიდის: 12 კმ კარგი ასფალტი ჭახათამდე, შემდეგ მტკიცე გრუნტის გზა ცხემვანამდე. ბოლო მონაკვეთი ხინომდე,
    ქობულეთიდან 27 კმ-ში, ნამდვილ ჯიპს მოითხოვს. თბილისიდან ხეობამდე დაახლოებით 375 კმ და ხუთი საათი და
    ორმოცდაათი წუთია. მშრალ ამინდში ცხემვანამდე ნებისმიერი მანქანა ავა; იქიდან ხინომდე ადგილობრივი ჯიპი
    დაიქირავეთ ან ფეხით იარეთ. საწვავი ქობულეთში ჩაასხით: ხეობაში ბენზინგასამართი სადგური არ არის.
en:
  name: Kintrishi Protected Areas
  short: >-
    A UNESCO-listed Colchic rainforest above Kobuleti, with a ruined bishop's cathedral, a legendary ‘Tamar
    bridge’ and a lake near 2,000 metres.
  body: >-
    **Kintrishi keeps a forest the Ice Age missed: Colchic woodland with roots in the Tertiary, part of
    a UNESCO World Heritage Site since 2021.**


    The strict reserve dates from 1959, the protected landscape around it from 2007; together they cover
    some 13,900 hectares, from 300 to 2,500 metres. Some 3,000 millimetres of rain fall each year, and
    more than 900 plant species grow on the slopes, 65 of them found only in the Caucasus. Box and chestnut,
    yew and rhododendron share the same dripping hillsides. The reserve itself admits only scientists;
    visitors keep to marked trails around it.


    At Tskhemvani a stone bridge springs straight out of the rock. Tradition says Queen Tamar, carried
    over the flooded river on a golden throne to meet Shota Rustaveli, lost a shoe to the current and
    ordered a bridge ‘that neither the river nor time could block’. The story is a legend; the bridge
    is real.


    Higher up, at 1,040 metres near the village of Khino, stand the ruins of Khinotsminda, once a mountain
    bishop's cathedral. Its plan is rare in Georgia: a basilica whose side aisles were walled off from
    the nave. The historian Simon Janashia suggested the see climbed here from coastal Petra in the 9th
    century, though no document proves it. The Ottoman advance ended the bishopric in the 18th century,
    an earthquake in the 1870s brought down more, and a 20th-century villager carted off stones for his
    house. Restoration began in 2017.


    Twelve kilometres beyond the ruins lies Lake Tbikeli, an oval 7–8 metres deep at 1,900–2,000 metres,
    home to the Red-Listed Caucasian newt and sealed under snow all winter.


    The walk is long and wet. What it gives back is a forest that has outlasted glaciers, bishops and
    empires, still dripping quietly above the resorts of the coast.
  tip: >-
    Start at the protected-areas visitor centre in Kobuleti (4 Leselidze Street, 10:00–18:00) for maps,
    and to book guides and horses. The Tamar-bridge walk fits into a day; the Yew and Lake Tbikeli route
    takes two days on foot or on horseback, with a visitor shelter and picnic sites at Tskhemvani. Family
    guesthouses charge about 50–60 GEL a night with breakfast. Rain here is counted in metres, so pack
    waterproofs even in July, and wear long trousers against ticks. The lake is snowbound in winter; come
    between May and October.
  route: >-
    From Tbilisi take the S1 (E60) to Samtredia, the S12 through Lanchkhuti to Grigoleti and the S2 south
    along the coast to Kobuleti. From Kobuleti the valley road runs east through Khutsubani: 12 km of
    good asphalt to Chakhati, then a firm dirt road to Tskhemvani. The last stretch to Khino, 27 km from
    Kobuleti, needs a proper off-roader. Allow about 375 km and five hours fifty from Tbilisi to the valley.
    Any car reaches Tskhemvani in dry weather; beyond it, to Khino, hire a local 4x4 or walk. Fill up
    in Kobuleti, as there is no fuel in the valley.
ru:
  name: Охраняемые территории Кинтриши
  short: >-
    Внесённый в список ЮНЕСКО колхидский дождевой лес над Кобулети, с развалинами епископского собора,
    легендарным «мостом Тамары» и озером у отметки 2000 метров.
  body: >-
    **Кинтриши хранит лес, который ледниковый период обошёл стороной: колхидскую чащу с корнями в третичном
    периоде, часть объекта ЮНЕСКО с 2021 года.**


    Строгий заповедник существует с 1959 года, охраняемый ландшафт вокруг него — с 2007-го; вместе они
    занимают около 13 900 гектаров, от 300 до 2500 метров. Ежегодно здесь выпадает около 3000 миллиметров
    осадков, а на склонах растёт больше 900 видов растений, 65 из них — только на Кавказе. Самшит и каштан,
    тис и рододендрон делят одни и те же сырые склоны. В сам заповедник допускают только учёных; посетители
    ходят по маркированным тропам вокруг него.


    У Цхемвани каменный мост вырастает прямо из скалы. Предание рассказывает, что царица Тамара, которую
    несли на золотом троне через разлившуюся реку навстречу Шота Руставели, потеряла в потоке туфлю и
    повелела построить мост, «которого ни река, ни время не смогут перекрыть». История — легенда; мост
    — настоящий.


    Выше, на высоте 1040 метров у села Хино, стоят развалины Хиноцминды, некогда горного епископского
    собора. Его план редок для Грузии: базилика, боковые нефы которой были отгорожены от центрального
    стенами. Историк Симон Джанашиа предполагал, что кафедра переместилась сюда с прибрежной Петры в IX
    веке, хотя ни один документ этого не подтверждает. Османское наступление положило конец епархии в
    XVIII веке, землетрясение 1870-х разрушило собор ещё больше, а в XX веке один из сельчан вывез его
    камни на постройку дома. Реставрация началась в 2017 году.


    В двенадцати километрах за развалинами лежит Тбикели — овальное озеро глубиной 7–8 метров на высоте
    1900–2000 метров; здесь живёт краснокнижный кавказский тритон, а зимой озеро скрыто под снегом.


    Дорога долгая и мокрая. Взамен она дарит лес, переживший ледники, епископов и империи — до сих пор
    тихо капающий над курортами побережья.
  tip: >-
    Начните с визит-центра охраняемых территорий в Кобулети (улица Леселидзе, 4, 10:00–18:00): здесь дадут
    карты и помогут забронировать гидов и лошадей. Прогулка к «мосту Тамары» укладывается в один день;
    маршрут «Тис и озеро Тбикели» занимает два дня пешком или верхом, с приютом для посетителей и местами
    для пикника у Цхемвани. Семейные гостевые дома берут около 50–60 лари за ночь с завтраком. Дождь здесь
    считают метрами, так что берите непромокаемую одежду даже в июле, а от клещей наденьте длинные брюки.
    Зимой озеро под снегом; приезжайте с мая по октябрь.
  route: >-
    Из Тбилиси по С1 (E60) до Самтредиа, по С12 через Ланчхути до Григолети, затем по С2 на юг вдоль побережья
    до Кобулети. От Кобулети дорога долины идёт на восток через Хуцубани: 12 км хорошего асфальта до Чахати,
    затем крепкая грунтовка до Цхемвани. Последний отрезок до Хино, в 27 км от Кобулети, требует настоящего
    внедорожника. От Тбилиси до долины около 375 км, или примерно пять часов пятьдесят минут пути. В сухую
    погоду до Цхемвани доедет любая машина; дальше, до Хино, наймите местный джип или идите пешком. Заправьтесь
    в Кобулети — в долине заправок нет.
fa:
  name: مناطق حفاظت‌شده‌ی کینتریشی
  short: >-
    جنگل بارانی کلخیسی ثبت‌شده در فهرست یونسکو بر فراز کوبولتی، با ویرانه‌های کلیسای جامع اسقفی، «پل تامار»
    افسانه‌ای و دریاچه‌ای نزدیک به ۲۰۰۰ متر.
  body: >-
    **کینتریشی جنگلی را نگه می‌دارد که عصر یخبندان به آن نرسید: بیشه‌ی کلخیسی با ریشه در دوران سوم زمین‌شناسی،
    بخشی از میراث جهانی یونسکو از سال ۲۰۲۱.**


    ذخیره‌گاه با حفاظت کامل به سال ۱۹۵۹ بازمی‌گردد، و منظر حفاظت‌شده‌ی گرداگردش از ۲۰۰۷ افزوده شد؛ این
    دو با هم نزدیک به ۱۳٬۹۰۰ هکتار را در بر می‌گیرند، از ۳۰۰ تا ۲٬۵۰۰ متر. هرسال نزدیک به ۳٬۰۰۰ میلی‌متر
    باران در این‌جا می‌بارد، و بیش از ۹۰۰ گونه‌ی گیاهی بر دامنه‌ها می‌روید، که ۶۵ گونه از آن‌ها تنها در
    قفقاز دیده می‌شوند. شمشاد و شاه‌بلوط، سرخدار و رودودندرون همان دامنه‌های نمناک را با هم قسمت می‌کنند.
    به خود ذخیره‌گاه تنها پژوهشگران راه دارند؛ بازدیدکنندگان در منظر حفاظت‌شده‌ی گرداگرد آن، بر مسیرهای
    نشانه‌گذاری‌شده، راه می‌روند.


    نزدیک تسخموانی، پلی از سنگ راست از دل صخره بیرون می‌زند. روایت می‌گوید ملکه تامار، که خدمتکارانش او
    را بر تختی زرین از رودخانه‌ی طغیانی می‌گذراندند تا با شوتا روستاولی دیدار کند، کفشی در آب گم کرد و
    فرمان داد پلی بسازند که «نه رود بتواند سدّش شود، نه زمان». این افسانه است؛ پل واقعی است.


    بالاتر، در ۱٬۰۴۰ متری، کنار روستای خینو، ویرانه‌های خینوتسمیندا برجاست، که زمانی کلیسای جامع اسقفی
    کوهستانی بود. طرحش در گرجستان کمیاب است: بازیلیکایی که راهروهای کناری‌اش با دیوار از شبستان میانی
    جدا شده‌اند. تاریخ‌نگار سیمون جاناشیا گمان می‌برد که کرسی اسقفی در سده‌ی نهم از پترای ساحلی به این‌جا
    کوچ کرده، هرچند هیچ سندی این را تأیید نمی‌کند. تهاجم عثمانی در سده‌ی هجدهم به اسقف‌نشین پایان داد،
    زمین‌لرزه‌ی دهه‌ی ۱۸۷۰ ویرانی بیشتری بر آن نشاند، و در سده‌ی بیستم یکی از روستاییان سنگ‌هایش را برای
    ساخت خانه‌ی خود برد. بازسازی در سال ۲۰۱۷ آغاز شد.


    دوازده کیلومتر فراسوی ویرانه‌ها، دریاچه‌ی تبیکلی است: بیضی‌شکل، به ژرفای ۷ تا ۸ متر، در ۱٬۹۰۰ تا ۲٬۰۰۰
    متری، خانه‌ی سمندر آبی قفقازی که در فهرست سرخ جای دارد، و زمستان‌ها زیر برف خفته.


    راه دراز و نمناک است. آن‌چه به شما پس می‌دهد جنگلی است که از یخبندان، اسقفان و امپراتوری‌ها گذر کرده،
    و هنوز آرام بر فراز استراحتگاه‌های ساحل می‌چکد.
  tip: >-
    از مرکز بازدیدکنندگان مناطق حفاظت‌شده در کوبولتی آغاز کنید (خیابان لسلیدزه شماره‌ی ۴، ۱۰:۰۰ تا ۱۸:۰۰):
    این‌جا نقشه می‌دهند و راهنما و اسب هم رزرو می‌کنند. پیاده‌روی تا «پل تامار» در یک روز جا می‌گیرد؛
    مسیر «سرخدار و دریاچه‌ی تبیکلی» دو روز، پیاده یا سواره، می‌خواهد، با پناهگاهی برای بازدیدکنندگان و
    جای پیک‌نیک نزدیک تسخموانی. خانه‌های میهمان خانوادگی شبی نزدیک ۵۰ تا ۶۰ لاری با صبحانه می‌گیرند. این‌جا
    باران را با متر می‌شمارند: حتی در ژوئیه لباس ضدآب بردارید، و برای در امان ماندن از کنه‌ها شلوار بلند
    بپوشید. دریاچه زمستان‌ها زیر برف است؛ از مه تا اکتبر بیایید.
  route: >-
    از تفلیس مسیر S1 (E60) را تا سامتردیا بروید، سپس S12 را از میان لانچخوتی تا گریگولتی، و آن‌گاه S2
    را به سوی جنوب، در طول ساحل، تا کوبولتی. از کوبولتی راه دره به سوی شرق، از میان خوتسوبانی، می‌رود:
    ۱۲ کیلومتر آسفالت خوب تا چاخاتی، سپس راهی خاکیِ محکم تا تسخموانی. بخش پایانی تا خینو، ۲۷ کیلومتری
    کوبولتی، خودرویی ۴×۴ راستین می‌خواهد. برای مسیر از تفلیس تا دره نزدیک ۳۷۵ کیلومتر و پنج ساعت و پنجاه
    دقیقه بگذارید. در هوای خشک هر خودرویی به تسخموانی می‌رسد؛ از آن‌جا تا خینو، جیپ محلی کرایه کنید یا
    پیاده بروید. در کوبولتی سوخت‌گیری کنید؛ در دره پمپ بنزینی نیست.
he:
  name: אזורי הטבע המוגנים של קינטרישי
  short: >-
    יער גשם קולכי הרשום ברשימת אונסק"ו מעל קובולטי, עם חורבות קתדרלה של בישוף, "גשר תמר" האגדי ואגם בגובה
    של כ-2,000 מטרים.
  body: >-
    **קינטרישי שומר על יער שעידן הקרח פסח עליו: חורש קולכי עם שורשים בתקופה השלישונית, חלק מאתר מורשת
    עולמית של אונסק"ו מאז 2021.**


    שמורת הטבע הסגורה קיימת מ-1959, והנוף המוגן שסביבה נוסף ב-2007; יחד הם משתרעים על כ-13,900 הקטרים,
    מ-300 עד 2,500 מטרים. כ-3,000 מ"מ גשם יורדים כאן בשנה, ויותר מ-900 מיני צמחים גדלים על המדרונות, 65
    מהם נמצאים רק בקווקז. תאשור וערמון, טקסוס ורודודנדרון חולקים את אותם המדרונות הנוטפים. לשמורה עצמה
    נכנסים רק מדענים; המבקרים נשארים בנוף המוגן שסביבה, על שבילים מסומנים.


    בצחמוואני צומח גשר אבן היישר מן הסלע. האגדה מספרת שהמלכה תמר, שנישאה על כס זהב מעל הנהר הגואה לפגישה
    עם שוטה רוסתוולי, הפילה נעל בזרם, וציוותה לבנות גשר "שלא הנהר ולא הזמן יוכלו לחסום". הסיפור אגדה;
    הגשר אמיתי.


    גבוה יותר, בגובה 1,040 מטרים לצד הכפר חינו, עומדות חורבות חינוצמינדה, שהייתה פעם קתדרלת בישופות הררית.
    תוכניתה נדירה בגאורגיה: בזיליקה שבה הספינות הצדדיות הופרדו בקיר מהספינה המרכזית. ההיסטוריון סימון
    ג'נאשיה העלה השערה שכס הבישוף עבר לכאן מפטרה שעל החוף במאה ה-9, אף שאין מסמך המאשר זאת. ההתקדמות העות'מאנית
    סיימה את הבישופות במאה ה-18, רעידת אדמה בשנות ה-1870 הפילה עוד ממנה, ובמאה ה-20 כפרי אחד נטל את אבניה
    לבניית ביתו. השיקום החל ב-2017.


    שנים-עשר קילומטרים מעבר לחורבות שוכן אגם טביקלי, אגם סגלגל שעומקו 7–8 מטרים, בגובה 1,900–2,000 מטרים;
    חי בו הטריטון הקווקזי הרשום ברשימה האדומה, ובחורף כולו הוא מכוסה שלג.


    הדרך ארוכה ולחה. מה שהיא מחזירה הוא יער ששרד קרחונים, בישופים ואימפריות, ועדיין נוטף בשקט מעל אתרי
    הנופש של החוף.
  tip: >-
    התחילו ממרכז המבקרים לאזורים המוגנים בקובולטי (רחוב לסלידזה 4, 10:00–18:00) למפות, ולהזמנת מדריכים
    וסוסים. הטיול לגשר תמר מתאים ליום אחד; מסלול "הטקסוס ואגם טביקלי" לוקח יומיים ברגל או על סוס, עם מחסה
    למבקרים ואזורי פיקניק בצחמוואני. בתי אירוח משפחתיים גובים כ-50–60 לארי ללילה עם ארוחת בוקר. גשם כאן
    נמדד במטרים, אז קחו ביגוד עמיד למים אפילו ביולי, ומכנסיים ארוכים מפני קרציות. האגם מכוסה שלג בחורף;
    בואו בין מאי לאוקטובר.
  route: >-
    מטביליסי סעו ב-S1 (E60) עד סמטרדיה, אחר כך ב-S12 דרך לנצ'חוטי לגריגולטי, ומשם ב-S2 דרומה לאורך החוף
    עד קובולטי. מקובולטי דרך העמק פונה מזרחה, דרך חוצובני: 12 ק"מ אספלט טוב עד צ'חאתי, ואז דרך עפר מוצקה
    עד צחמוואני. הקטע האחרון לחינו, 27 ק"מ מקובולטי, מחייב רכב שטח של ממש. מטביליסי לעמק כ-375 ק"מ, כחמש
    שעות וחמישים דקות נסיעה. במזג אוויר יבש כל רכב מגיע לצחמוואני; משם לחינו, שכרו ג'יפ מקומי או לכו ברגל.
    תדלקו בקובולטי — אין דלק בעמק.
ar:
  name: المناطق المحمية في كينتريشي
  short: >-
    غابة مطيرة كولخية مسجّلة في قائمة اليونسكو فوق كوبوليتي، فيها أنقاض كاتدرائية أسقفية، و"جسر تامار"
    الأسطوري، وبحيرة قرب 2,000 متر.
  body: >-
    **تحفظ كينتريشي غابة فاتها العصر الجليدي: غابة كولخية جذورها من العصر الثلاثي، جزء من موقع تراث عالمي
    لليونسكو منذ 2021.**


    يعود تاريخ المحمية الصارمة إلى عام 1959، والمشهد المحمي المحيط بها إلى 2007؛ يغطيان معًا نحو 13,900
    هكتار، من 300 إلى 2,500 متر. يسقط هنا نحو 3,000 ملم من الأمطار سنويًا، وتنمو على المنحدرات أكثر من
    900 نوع نباتي، 65 منها لا توجد إلا في القوقاز. البقس والكستناء، والطقسوس والرودودندرون، تتقاسم المنحدرات
    الرطبة نفسها. لا يدخل المحمية نفسها إلا الباحثون؛ ويبقى الزوار في المشهد المحمي المحيط بها، على مسارات
    معلّمة.


    عند تسخموفاني، يخرج جسر حجري مباشرة من الصخر. تقول الرواية إن الملكة تامار، وهي تُحمَل على عرش من
    الذهب عبر النهر الفائض للقاء شوتا روستافيلي، أضاعت حذاءها في التيار، فأمرت ببناء جسر "لا يستطيع النهر
    ولا الزمن أن يسدّه". القصة أسطورة؛ والجسر حقيقي.


    أعلى من ذلك، على ارتفاع 1,040 مترًا قرب قرية خينو، تقوم أنقاض خينوتسميندا، التي كانت يومًا كاتدرائية
    أسقفية جبلية. تصميمها نادر في جورجيا: كنيسة بازيليكية فُصلت أجنحتها الجانبية عن الصحن الأوسط بجدار.
    رأى المؤرخ سيمون جاناشيا أن الكرسي الأسقفي انتقل إلى هنا من بيترا الساحلية في القرن التاسع، لكن لا
    وثيقة تؤكد ذلك. أنهى التقدم العثماني الأسقفية في القرن الثامن عشر، وزلزال سبعينيات القرن التاسع عشر
    هدم منها أكثر، وفي القرن العشرين حمل أحد القرويين حجارتها لبناء بيته. بدأ الترميم في عام 2017.


    على بعد اثني عشر كيلومترًا خلف الأنقاض تقع بحيرة تبيكيلي، بيضوية الشكل بعمق 7 إلى 8 أمتار على ارتفاع
    1,900 إلى 2,000 متر، موطن سمندل الماء القوقازي المدرج في القائمة الحمراء، ويغمرها الثلج طوال الشتاء.


    الطريق طويل ورطب. وما يمنحه لكم غابة نجت من الجليديات والأساقفة والإمبراطوريات، ولا تزال تقطر بهدوء
    فوق منتجعات الساحل.
  tip: >-
    ابدؤوا من مركز زوار المناطق المحمية في كوبوليتي (شارع ليسيليدزه 4، من 10:00 إلى 18:00): هناك تجدون
    الخرائط، ويمكنكم حجز مرشدين وخيول. نزهة "جسر تامار" تناسب يومًا واحدًا؛ ومسار "الطقسوس وبحيرة تبيكيلي"
    يحتاج إلى يومين سيرًا أو على ظهور الخيل، مع ملجأ للزوار وأماكن للنزهات قرب تسخموفاني. تتقاضى بيوت
    الضيافة العائلية نحو 50 إلى 60 لاري لليلة مع الإفطار. يُحسب المطر هنا بالأمتار، فاحملوا ملابس مضادة
    للماء حتى في يوليو، وسراويل طويلة بسبب القُراد. البحيرة مغطاة بالثلج شتاءً؛ تعالوا بين مايو وأكتوبر.
  route: >-
    من تبليسي خذوا S1 (E60) إلى سامتريديا، ثم S12 عبر لانتشخوتي إلى غريغوليتي، ثم S2 جنوبًا بمحاذاة الساحل
    إلى كوبوليتي. من كوبوليتي يمضي طريق الوادي شرقًا عبر خوتسوباني: 12 كم من الأسفلت الجيد إلى تشاخاتي،
    ثم طريق ترابي متين إلى تسخموفاني. المقطع الأخير إلى خينو، على بعد 27 كم من كوبوليتي، يحتاج سيارة دفع
    رباعي حقيقية. المسافة من تبليسي إلى الوادي نحو 375 كم، أي قرابة خمس ساعات وخمسين دقيقة. في الطقس الجاف
    تصل أي سيارة إلى تسخموفاني؛ أما بعدها إلى خينو، فاستأجروا سيارة دفع رباعي محلية أو سيروا على الأقدام.
    عبّئوا الوقود في كوبوليتي؛ لا وقود في الوادي.
