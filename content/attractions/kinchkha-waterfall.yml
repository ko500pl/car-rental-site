ka:
  name: კინჩხის ჩანჩქერი
  short: სამსაფეხურიანი, ასიოდე მეტრის კასკადი, რომელიც ასხის კირქვის ქარაფიდან ოკაცეს ხეობაში ეშვება,
    გორდის ზემოთ.
  body: >-
    **კინჩხის ჩანჩქერი მთიდან სამი ნაბიჯით ჩამოდის.**


    ხონის მუნიციპალიტეტში, სოფელ კინჩხაფერდის მიდამოებში, ზღვის დონიდან 843 მეტრზე, ნაკადი ასხის კირქვიანი
    მასივის აღმოსავლეთ ქარაფიდან ოკაცეს — იგივე საწისქვილოს — ხეობაში ეშვება. პირველი საფეხური დაახლოებით
    25 მეტრია, მეორე, მთავარი, 70 მეტრამდე; მესამე, უფრო დაბალი, მაშინ იწყება, როცა ნაკადი ოკაცეს შეუერთდება.
    ერთად ეს საქართველოს ერთ-ერთი უდიდესი ჩანჩქერია — 2007 წლიდან ბუნების ძეგლი, ოკაცეს კანიონთან ერთად
    ერთსა და იმავე დაცულ კომპლექსში, აქედან რამდენიმე კილომეტრში.


    ყველაფერს წყალი წყვეტს. მაისსა და ივნისში, თოვლის დნობისა და გაზაფხულის წვიმების შემდეგ, მთავარი ჩანჩქერი
    თეთრი სვეტია, რომლის გრიალიც დიდი ხნით ადრე გესმით, სანამ თვითონ დაინახავთ; ძირში წყალი ზურმუხტისფერ
    ტბორად გროვდება, გარშემო კი მწვანე ტყე შრიალებს. აგვისტოს ბოლოსთვის კი შეიძლება ნაცრისფერ კლდეზე რამდენიმე
    ვერცხლის ძაფადღა იქცეს — ესეც ლამაზია, ოღონდ სულ სხვა სურათი.


    ჩანჩქერის გარშემო ბილიკები და სადამკვირვებლო მოედნებია მოწყობილი, მარკირებული ბილიკი კი ახლომახლო,
    უფრო პატარა ლომინას ჩანჩქერამდე მიდის — მათთვის, ვისაც ტყეში მარტო ყოფნა სურს. სტუმრების უმეტესობა
    კინჩხასა და ოკაცეს კანიონს ერთ დღეში ათავსებს; ეს შესაძლებელია, ოღონდ თბილისიდან გამთენიისას უნდა
    გამოხვიდეთ, ან ღამე ქუთაისში გაათიოთ.


    მაისში ჩანჩქერს ჯერ გაიგონებთ, მერე დაინახავთ. სექტემბერში შეიძლება მოძებნაც მოგიწიოთ.
  tip: >-
    ვიზიტი წყალს მოარგეთ: მაისი და ივნისი, ან ძლიერი წვიმიდან ერთი-ორი დღის შემდეგ. შესასვლელი ფასიანია,
    ბოლო ხრეშიან მონაკვეთზე კი სეზონზე, როგორც წესი, ტრანსფერი დადის; ფასი და განრიგი იცვლება, ამიტომ
    სანამ გზას დაადგებით, გორდში, ოკაცეს კანიონის ვიზიტორთა ცენტრში გადაამოწმეთ და იკითხეთ, როდის ბრუნდება
    ბოლო ტრანსფერი. კიბეები და მოედნები წყლის შხეფისგან სრიალებს — კარგად მოჭიდებული ძირის მქონე ფეხსაცმელი
    ჩაიცვით. წყალი და საჭმელი თან იქონიეთ: ჩანჩქერთან საყიდელი არაფერია. ადგილზე ორი საათი დაითვალეთ,
    ლომინამდე თუ გაივლით — მეტი.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, იქიდან შ15-ით ჩრდილო-დასავლეთით, წყალტუბოს გავლით და ყუმისთავთან,
    პრომეთეს მღვიმის გვერდით, შემდეგ სოფლის გზებით (შ118, შ116) ნოღის გავლით გორდამდე — სულ დაახლოებით
    270 კმ და 4 სთ 20 წთ. გორდის შემდეგ კინჩხამდე ბოლო ხუთი-ექვსი კილომეტრი ხრეშიანია, ციცაბო აღმართებითა
    და ღრმა ნაკვალევით, რომელსაც წვიმა რეცხავს. ეს მონაკვეთი მაღალი გამავლობის ავტომობილისთვისაა; სედანით
    თუ ხართ, მანქანა გორდში დატოვეთ და ტრანსფერით ადით. ზამთარში გზა ხშირად გაუვალია. საწვავი ქუთაისში
    ან წყალტუბოში ჩაასხით და ოფლაინ რუკა წინასწარ ჩამოტვირთეთ — გორდის შემდეგ მაჩვენებლები მწირია.
en:
  name: Kinchkha Waterfall
  short: >-
    A three-step cascade, roughly a hundred metres tall, spilling off the Askhi limestone into the Okatse
    gorge above Gordi.
  body: >-
    **Kinchkha comes down the mountain in three strides.**


    Near the village of Kinchkhaperdi in Khoni municipality, 843 metres above sea level, a stream tips
    over the eastern escarpment of the Askhi limestone massif into the gorge of the Okatse, which is also
    known as the Satsiskvilo. The first step drops about 25 metres, the second, the main fall, around
    70; a third, shorter step follows once the water has joined the Okatse. Together they make one of
    the biggest waterfalls in Georgia, protected as a natural monument since 2007 and part of the same
    protected complex as Okatse Canyon, a few kilometres away.


    The water decides everything. In May and June, with snowmelt and spring rain, the main fall is a white
    column you hear long before you see it, and at its foot the water gathers in an emerald pool under
    rustling green forest. By late August it can thin to a few silver threads down the grey rock: still
    beautiful, but a different picture altogether.


    Paths and viewing platforms have been laid out around the falls, and a marked trail continues to the
    smaller Lomina waterfall nearby, for anyone who wants the forest to themselves. Most visitors pair
    Kinchkha with Okatse Canyon in a single day. It works, but only with a dawn start from Tbilisi or
    a night in Kutaisi.


    Come in May and you will hear Kinchkha before you see it. Come in September and you may have to go
    looking for it.
  tip: >-
    Time your visit to the water: May and June, or a day or two after heavy rain. There is an entry ticket,
    and in season transfers usually run up the last gravel stretch; prices and times change, so check
    at the Okatse Canyon visitor centre in Gordi before you set off and ask when the last transfer comes
    back down. Stairs and decks get slippery with spray, so wear shoes with real grip. Bring water and
    food, as there is nothing to buy at the falls. Allow two hours on site, more if you walk on to Lomina.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh15 north-west through Tskaltubo and past
    the Prometheus Cave at Kumistavi, and village roads (Sh118, Sh116) through the Nogha villages to Gordi:
    about 270 km and 4 h 20 min. Beyond Gordi the last five or six kilometres to Kinchkha are gravel,
    with steep pitches and ruts that wash out after rain. That stretch is SUV country; in a saloon, leave
    the car at Gordi and take the transfer. In winter the track is often impassable. Fill up in Kutaisi
    or Tskaltubo and download an offline map, because signs thin out after Gordi.
ru:
  name: Водопад Кинчха
  short: >-
    Трёхступенчатый каскад высотой около ста метров, срывающийся с известнякового массива Асхи в ущелье
    Окаце над Горди.
  body: >-
    **Кинчха спускается с горы за три шага.**


    Близ села Кинчхаперди в муниципалитете Хони, на высоте 843 метра над уровнем моря, поток срывается
    с восточного обрыва известнякового массива Асхи в ущелье реки Окаце, также известное как Сацисквило.
    Первая ступень падает около 25 метров, вторая, основная, — около 70; третья, более короткая, начинается
    уже после того, как вода соединяется с Окаце. Вместе они образуют один из крупнейших водопадов Грузии,
    охраняемый как природный памятник с 2007 года и входящий в тот же охраняемый комплекс, что и каньон
    Окаце, в нескольких километрах отсюда.


    Всё решает вода. В мае и июне, когда тает снег и идут весенние дожди, основной водопад — белая колонна,
    которую слышишь задолго до того, как увидишь; у его подножия вода собирается в изумрудный омут под
    шелестящим зелёным лесом. К концу августа он может истончиться до нескольких серебряных нитей на серой
    скале — тоже красиво, но совсем другая картина.


    Вокруг водопада устроены тропы и смотровые площадки, а маркированная тропа ведёт дальше, к меньшему
    водопаду Ломина — для тех, кто хочет остаться в лесу один. Большинство посетителей объединяют Кинчху
    с каньоном Окаце в один день. Это возможно, но только при выезде из Тбилиси на рассвете или с ночёвкой
    в Кутаиси.


    Приезжайте в мае — и сначала услышите Кинчху, а потом увидите. Приезжайте в сентябре — и, возможно,
    придётся его поискать.
  tip: >-
    Подгадайте визит под воду: май и июнь, либо день-два после сильного дождя. Вход платный, а в сезон
    на последнем гравийном участке обычно ходит трансфер; цены и расписание меняются, так что уточните
    в визит-центре каньона Окаце в Горди перед выездом и спросите, когда возвращается последняя машина.
    Лестницы и площадки становятся скользкими от брызг, так что наденьте обувь с нескользкой подошвой.
    Возьмите воду и еду — у водопада ничего не купить. Отведите на месте два часа, а если пойдёте дальше
    к Ломине — больше.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад до Кутаиси, затем по трассе Ш15 на северо-запад через Цхалтубо
    и мимо пещеры Прометея у Кумистави, и деревенскими дорогами (Ш118, Ш116) через сёла Ногха до Горди:
    около 270 км и 4 ч 20 мин. За Горди последние пять-шесть километров до Кинчхи — гравий, с крутыми
    участками и колеями, которые размывает после дождя. Этот отрезок — для внедорожников; на седане оставьте
    машину в Горди и возьмите трансфер. Зимой дорога часто непроходима. Заправляйтесь в Кутаиси или Цхалтубо
    и скачайте офлайн-карту, потому что указатели редеют после Горди.
fa:
  name: آبشار کینچخا
  short: >-
    آبشاری پلکانی و سه‌مرحله‌ای، به بلندای نزدیک صد متر، که از سنگ آهک آسخی به تنگهٔ اوکاتسه بر فراز گوردی
    می‌ریزد.
  body: >-
    **کینچخا از کوه سه گام پایین می‌آید.**


    نزدیک روستای کینچخاپردی در بخش خونی، در ارتفاع ۸۴۳ متری از سطح دریا، نهری از دیوارهٔ شرقی توده‌ی آهکی
    آسخی به تنگهٔ رود اوکاتسه، که ساتسیسکویلو نیز نامیده می‌شود، فرو می‌ریزد. مرحلهٔ نخست حدود ۲۵ متر
    سقوط دارد، مرحلهٔ دوم و اصلی نزدیک به ۷۰ متر؛ مرحلهٔ سوم، کوتاه‌تر، پس از آن آغاز می‌شود که آب به
    اوکاتسه می‌پیوندد. این‌ها با هم یکی از بزرگ‌ترین آبشارهای گرجستان را می‌سازند - از سال ۲۰۰۷ یادمانی
    طبیعی حفاظت‌شده، و بخشی از همان مجموعهٔ حفاظتی کانیون اوکاتسه، چند کیلومتر آن‌سوتر.


    همه‌چیز را آب تعیین می‌کند. در ماه‌های مه و ژوئن، با آب‌شدن برف‌ها و باران‌های بهاری، آبشار اصلی ستونی
    سپید است که صدایش را مدت‌ها پیش از دیدنش می‌شنوید؛ در پایینش آب در برکه‌ای زمردین زیر جنگلی سبز که
    برگ‌هایش خش‌خش می‌کنند گرد می‌آید. تا اواخر اوت ممکن است به چند رشتهٔ نقره‌ای بر سنگ خاکستری کاهش
    یابد - همچنان زیبا، اما تصویری کاملاً دیگر.


    پیرامون آبشار مسیرها و سکوهای دیدبانی ساخته شده، و مسیری نشانه‌گذاری‌شده تا آبشار کوچک‌تر لومینا در
    همان نزدیکی می‌رود - برای کسانی که می‌خواهند جنگل را برای خود تنها داشته باشند. بیشتر بازدیدکنندگان
    کینچخا و کانیون اوکاتسه را در یک روز با هم می‌بینند. این ممکن است، اما تنها اگر سپیده‌دم از تفلیس
    راه بیفتید یا شب را در کوتایسی بمانید.


    در ماه مه بیایید تا پیش از دیدنش صدایش را بشنوید. در سپتامبر بیایید، شاید ناچار شوید دنبالش بگردید.
  tip: >-
    بازدید را با آب هماهنگ کنید: ماه‌های مه و ژوئن، یا یک تا دو روز پس از بارانی شدید. ورودی بلیت دارد،
    و در فصل معمولاً در آخرین بخش شنی سرویس رفت‌وآمد هست؛ قیمت‌ها و ساعت‌ها تغییر می‌کنند، پس پیش از حرکت
    در مرکز بازدیدکنندگان کانیون اوکاتسه در گوردی بپرسید و ساعت برگشت آخرین سرویس را هم جویا شوید. پله‌ها
    و سکوها از پاشش آب لیز می‌شوند، پس کفشی با زیرهٔ ضدلغزش بپوشید. آب و غذا همراه داشته باشید، چون کنار
    آبشار چیزی برای خریدن نیست. دو ساعت در محل در نظر بگیرید، و اگر تا لومینا هم می‌روید بیشتر.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب تا کوتایسی بروید، سپس از راه Sh15 به سوی شمال غربی از میان
    تسکالتوبو و از کنار غار پرومتئوس در کومیستاوی، و بعد از راه‌های روستایی (Sh118، Sh116) از میان روستاهای
    نوغا تا گوردی ادامه دهید: نزدیک به ۲۷۰ کیلومتر و ۴ ساعت و ۲۰ دقیقه. پس از گوردی، پنج تا شش کیلومتر
    آخر تا کینچخا شنی است، با شیب‌های تند و شیارهایی که باران آن‌ها را می‌شوید. این بخش برای خودروهای
    شاسی‌بلند است؛ اگر با سدان آمده‌اید، ماشین را در گوردی بگذارید و با سرویس رفت‌وآمد بالا بروید. در
    زمستان راه اغلب غیرقابل عبور است. در کوتایسی یا تسکالتوبو سوخت‌گیری کنید و نقشهٔ آفلاین را از پیش
    دانلود کنید، چون پس از گوردی تابلوها کم می‌شوند.
he:
  name: מפל קינצ'חה
  short: מפל מדורג בשלושה שלבים, בגובה של כמאה מטרים, הנשפך מגיר אסחי לערוץ אוקצה מעל גורדי.
  body: >-
    **קינצ'חה יורד מההר בשלוש פסיעות.**


    סמוך לכפר קינצ'חפרדי במחוז חוני, 843 מטרים מעל פני הים, נחל נשפך מהמתלול המזרחי של מסיף הגיר אסחי
    לערוץ נהר אוקצה, המוכר גם כסציסקוילו. השלב הראשון יורד כ-25 מטרים, השני, העיקרי, כ-70; שלב שלישי,
    קצר יותר, מתחיל אחרי שהמים מתאחדים עם אוקצה. יחד הם יוצרים אחד המפלים הגדולים בגאורגיה, מוגן כאתר
    טבע מ-2007 וחלק מאותו מתחם מוגן כמו קניון אוקצה, במרחק כמה קילומטרים.


    המים קובעים הכול. במאי וביוני, עם המסת השלגים וגשמי האביב, המפל הראשי הוא עמוד לבן שנשמע הרבה לפני
    שהוא נראה, ולמרגלותיו נאספים המים לבריכה אזמרגדית תחת יער ירוק מרשרש. עד סוף אוגוסט הוא יכול להצטמצם
    לכמה חוטי כסף על הסלע האפור - עדיין יפה, אך תמונה שונה כליל.


    שבילים ומרפסות תצפית נבנו סביב המפל, ושביל מסומן ממשיך למפל הקטן יותר, לומינה, הקרוב, למי שרוצה את
    היער כולו לעצמו. רוב המבקרים משלבים את קינצ'חה עם קניון אוקצה ביום אחד. זה אפשרי, אך רק ביציאה עם
    שחר מטביליסי או בלינה בקוטאיסי.


    הגיעו במאי ותשמעו את קינצ'חה לפני שתראו אותו. הגיעו בספטמבר ואולי תצטרכו לחפש אותו.
  tip: >-
    התאימו את הביקור למים: מאי ויוני, או יום-יומיים אחרי גשם חזק. הכניסה בתשלום, ובעונה פועלת בדרך כלל
    הסעה במקטע החצץ האחרון; המחירים והלוחות משתנים, כך שבדקו במרכז המבקרים של קניון אוקצה בגורדי לפני
    הנסיעה ושאלו מתי חוזרת ההסעה האחרונה. המדרגות והמרפסות הופכות חלקלקות מהתרסיס, כך שנעלו נעליים עם
    אחיזה טובה. הביאו מים ואוכל, כי אין מה לקנות במפל. הקדישו שעתיים באתר, יותר אם תמשיכו ללומינה.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה עד קוטאיסי, ואז בדרך Sh15 צפונית-מערבית דרך צקלטובו וליד מערת פרומתאוס
    בקומיסטאווי, ובדרכי כפר (Sh118, Sh116) דרך כפרי נוגה עד גורדי: כ-270 ק"מ ו-4 שעות ו-20 דקות. מעבר
    לגורדי, חמשת-ששת הקילומטרים האחרונים לקינצ'חה הם חצץ, עם מדרונות תלולים ותלמים שנשטפים אחרי גשם. המקטע
    הזה מתאים לרכבי שטח; ברכב סדאן, השאירו את הרכב בגורדי וקחו הסעה. בחורף הדרך לרוב בלתי עבירה. תדלקו
    בקוטאיסי או בצקלטובו והורידו מפה לא מקוונת מראש, כי השילוט מתמעט אחרי גורדי.
ar:
  name: شلال كينتشخا
  short: شلال متدرّج على ثلاث مراحل، يبلغ ارتفاعه نحو مئة متر، ينحدر من حجر أسخي الكلسي إلى وادي أوكاتسه
    فوق غوردي.
  body: >-
    **ينحدر كينتشخا من الجبل في ثلاث خطوات.**


    قرب قرية كينتشخابيردي في بلدية خوني، على ارتفاع 843 متراً فوق سطح البحر، ينحدر جدول من الجرف الشرقي
    لكتلة أسخي الكلسية إلى وادي نهر أوكاتسه، المعروف أيضاً باسم ساتسيسكفيلو. تسقط المرحلة الأولى نحو 25
    متراً، والثانية، وهي الرئيسية، نحو 70 متراً؛ وتبدأ المرحلة الثالثة، الأقصر، بعد أن يلتحق الماء بنهر
    أوكاتسه. تشكّل هذه المراحل معاً واحداً من أكبر الشلالات في جورجيا، وهو محمي كنصب طبيعي منذ عام 2007،
    وجزء من المجمّع المحمي نفسه الذي يضم كانيون أوكاتسه على بعد كيلومترات قليلة.


    الماء هو الذي يقرر كل شيء. في مايو ويونيو، مع ذوبان الثلوج وأمطار الربيع، يكون الشلال الرئيسي عموداً
    أبيض تسمعه قبل أن تراه بوقت طويل، وعند قدمه يتجمّع الماء في بركة زمردية تحت غابة خضراء يحفّ ورقها.
    وبحلول أواخر أغسطس قد يتضاءل إلى خيوط فضية قليلة على الصخر الرمادي - جميل أيضاً، لكنه مشهد آخر تماماً.


    أُنشئت مسارات وشرفات مراقبة حول الشلال، ويمتد مسار موسوم إلى شلال لومينا الأصغر القريب، لمن يريد الغابة
    لنفسه وحده. يجمع معظم الزوار بين كينتشخا وكانيون أوكاتسه في يوم واحد. هذا ممكن، ولكن فقط بانطلاق فجري
    من تبليسي أو مبيت في كوتايسي.


    تعال في مايو وستسمع كينتشخا قبل أن تراه. تعال في سبتمبر، وقد يتوجّب عليك البحث عنه.
  tip: >-
    وقّت زيارتك مع الماء: مايو ويونيو، أو يوم أو يومين بعد مطر غزير. الدخول برسوم، وفي الموسم تعمل عادة
    حافلة نقل على المقطع الحصوي الأخير؛ الأسعار والمواعيد تتغيّر، فتحقّق في مركز زوار كانيون أوكاتسه في
    غوردي قبل الانطلاق واسأل عن موعد آخر رحلة عائدة. تصبح الأدراج والشرفات زلقة من الرذاذ، فارتدِ حذاءً
    بنعل غير زلق. احمل الماء والطعام، فلا يوجد ما تشتريه عند الشلال. خصص ساعتين في الموقع، وأكثر إن أكملت
    المسير إلى لومينا.
  route: >-
    من تبليسي على الطريق السريع S1 (E60) غرباً إلى كوتايسي، ثم على طريق Sh15 شمال غربي عبر تسكالتوبو وقرب
    كهف بروميثيوس في كوميستافي، وطرق قروية (Sh118، Sh116) عبر قرى نوغا إلى غوردي: نحو 270 كم و4 ساعات
    و20 دقيقة. بعد غوردي، آخر خمسة إلى ستة كيلومترات إلى كينتشخا حصوية، بمنحدرات شديدة وأخاديد تجرفها
    الأمطار. هذا المقطع مناسب لسيارات الدفع الرباعي؛ وإن كنت بسيارة صالون، اترك السيارة في غوردي وخذ حافلة
    النقل. في الشتاء يكون الطريق غير سالك غالباً. عبّئ الوقود في كوتايسي أو تسكالتوبو وحمّل خريطة دون
    اتصال مسبقاً، فاللافتات تقلّ بعد غوردي.
