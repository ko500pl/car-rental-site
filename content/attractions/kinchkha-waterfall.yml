ka:
  name: კინჩხის ჩანჩქერი
  short: ასიოდე მეტრის სიმაღლის კასკადური ჩანჩქერი ოკაცეს ზემოთ, ხრეშოვანი გზის ბოლოს.
  body: >
    კინჩხის ჩანჩქერი ოკაცეს კანიონის ზემოთ, ხონის მუნიციპალიტეტში მდებარეობს და ორივე ობიექტი ერთი დაცული
    ტერიტორიის ნაწილია. წყალი კირქვის კედლიდან რამდენიმე საფეხურად ეშვება; საერთო სიმაღლე ასიოდე მეტრს
    აღწევს, თუმცა ერთი გადმონაქცევი კი არა, კასკადია.


    მთავარი, რაც ვიზიტს განსაზღვრავს, სეზონურობაა. **გაზაფხულზე და დიდი წვიმების შემდეგ ჩანჩქერი ძლიერია
    და ხმაურიანი, აგვისტოს ბოლოს კი ხშირად თხელ ნაკადამდე იკლებს.** თუ შთამბეჭდავი კადრი გინდა, მაისი
    და ივნისი საუკეთესო დროა.


    ჩანჩქერამდე მისვლა ცალკე ამბავია: ბოლო მონაკვეთი ხრეშოვანი, ღრმა თხრილებიანი გზაა და წვიმის შემდეგ
    საგრძნობლად რთულდება. სწორედ ამიტომ **ხშირად სთავაზობენ სტუმრებს შატლს ვიზიტორთა ცენტრიდან** და საკუთარი
    მანქანით ბოლომდე ასვლას ყოველთვის არ გირჩევენ. პარკინგიდან ხედვის მოედნებამდე კიდევ ხის კიბეები და
    ბილიკია.


    რას მიიღებ:


    - ხედი ჩანჩქერზე ორი დონიდან

    - კოლხური ტყის ხეობა და კირქვის კედლები

    - ოკაცეს კანიონთან ერთი დღეში გაერთიანების შესაძლებლობა


    ორივე ობიექტი ერთ დღეში ეტევა, მაგრამ დილით ადრე უნდა გამოხვიდე თბილისიდან.


    კინჩხასთან ერთად ხშირად ახსენებენ ხედვის მოედნებს, საიდანაც ხეობა და მოპირდაპირე კირქვის კედლები ჩანს.
    ეს მოედნები ჩანჩქერისგან მოშორებითაა და მათ შორის გადაადგილება ისევ ფეხითაა. სულ ორ საათს დაითვალე,
    თუ ორივე წერტილს ნახავ.
  tip: >
    ჩანჩქერი მაისსა და ივნისში ყველაზე სავსეა; ზაფხულის ბოლოს შესაძლოა ძალიან შემცირდეს. ბოლო გზა ხრეშოვანია
    — თუ სედანით მიდიხარ, ვიზიტორთა ცენტრში დატოვე მანქანა და შატლით ადი. კიბეები ხისაა და წვიმაში პრიალა,
    ამიტომ მაგარლანჩხიანი ფეხსაცმელი აუცილებელია. წყალი და საჭმელი თან წაიღე, ზემოთ მაღაზია არაა. ტუალეტი
    მხოლოდ ვიზიტორთა ცენტრშია, ბანკომატი — ხონში. ვიზიტორთა ცენტრში წინასწარ იკითხე შატლის ბოლო რეისის
    დრო — ეს ინფორმაცია სეზონის მიხედვით იცვლება.
  route: >
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ ხონისა და გორდის მიმართულებით — ორას სამოცდათხუთმეტი კილომეტრი,
    დაახლოებით ოთხი საათი თხუთმეტი წუთი. გორდის შემდეგ გზა კინჩხისკენ ვიწროვდება და უკანასკნელი ხუთი-ექვსი
    კილომეტრი ხრეშოვანია, ციცაბო აღმართებით და წვიმის შემდეგ ჩარეცხილი ადგილებით. სედანით ეს მონაკვეთი
    არასასურველია — კროსოვერი ან შატლი გირჩევნია. ზამთარში გზა ხშირად გაუვალია. საწვავი ქუთაისში ან ხონში
    აავსე. მანქანის კატეგორიების შედარება იხილე გვერდზე /fleet/. გორდის შემდეგ მიმართულების ნიშნები მწირია,
    ამიტომ ოფლაინ რუკა წინასწარ ჩამოტვირთე.
en:
  name: Kinchkha Waterfall
  short: A cascade waterfall roughly a hundred metres high above Okatse, at the end of a gravel road.
  body: >-
    Kinchkha Waterfall lies above Okatse Canyon in Khoni municipality, and both belong to the same protected
    area. The water drops down a limestone wall in several stages; the total height reaches around a hundred
    metres, but it is a cascade rather than a single fall.


    Seasonality defines the visit more than anything else. **In spring and after heavy rain the waterfall
    is loud and powerful; by late August it often shrinks to a thin ribbon.** If you want the dramatic
    version, May and June are the right months.


    Getting there is its own story. The final stretch is gravel with deep ruts and becomes considerably
    harder after rain. For that reason **a shuttle from the visitor centre is usually offered**, and driving
    your own car all the way up is not always recommended. From the parking area, wooden stairs and a
    path lead down to the viewing decks.


    What you get:


    - views of the falls from two levels

    - Colchic forest gorge and limestone walls

    - the option of combining it with Okatse Canyon in one day


    Both sites fit into a single day, but only if you leave Tbilisi early. Attempting Kinchkha as an afternoon
    add-on after a late start regularly ends with people arriving as the last shuttle leaves.
  tip: >-
    The falls are fullest in May and June and can shrink dramatically by the end of summer. The last section
    of road is gravel — if you are in a sedan, leave it at the visitor centre and take the shuttle up.
    The wooden stairs are slippery in rain, so shoes with grip are essential. Bring water and food, as
    there is no shop above. Toilets are only at the visitor centre, and the nearest ATM is in Khoni.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head towards Khoni and Gordi — 275 km and roughly four
    hours fifteen. Beyond Gordi the road towards Kinchkha narrows, and the final five or six kilometres
    are gravel with steep pitches and washouts after rain. A sedan is a poor choice on that section; a
    crossover or the shuttle is much better. In winter the track is often impassable. Fill up in Kutaisi
    or Khoni. You can compare car categories on the /fleet/ page.
ru:
  name: Водопад Кинчха
  short: Каскадный водопад около ста метров высотой над Окаце, в конце гравийной дороги.
  body: >
    Водопад Кинчха расположен выше каньона Окаце, в Хонском муниципалитете, и оба объекта входят в одну
    охраняемую территорию. Вода спускается по известняковой стене несколькими ступенями; общая высота
    достигает примерно ста метров, но это каскад, а не единый отвес.


    Сезонность здесь важнее всего остального. **Весной и после сильных дождей водопад мощный и шумный,
    а к концу августа нередко превращается в тонкую струю.** Если нужен эффектный вид, ехать стоит в мае
    или июне.


    Дорога — отдельная история. Последний участок гравийный, с глубокой колеёй, и после дождя заметно
    усложняется. Именно поэтому **от визит-центра обычно предлагают шаттл**, а подниматься на своей машине
    до самого верха советуют не всегда. От парковки к смотровым площадкам ведут деревянные лестницы и
    тропа.


    Что вы получите:


    - вид на водопад с двух уровней

    - ущелье колхидского леса и известняковые стены

    - возможность объединить визит с каньоном Окаце в один день


    Оба объекта укладываются в один день, но только при раннем выезде из Тбилиси. Попытка добавить Кинчху
    во второй половине дня обычно заканчивается приездом к последнему шаттлу.


    Вместе с Кинчхой обычно упоминают смотровые площадки, с которых видно ущелье и противоположные известняковые
    стены. Площадки расположены поодаль от самого водопада, и переход между ними опять же пеший. Закладывайте
    два часа, если планируете увидеть обе точки.
  tip: >-
    Полнее всего водопад в мае и июне, к концу лета он может сильно обмелеть. Последний отрезок дороги
    гравийный: если вы на седане, оставьте машину у визит-центра и поднимайтесь на шаттле. Деревянные
    лестницы в дождь скользкие, обувь с рифлёной подошвой обязательна. Возьмите воду и еду, наверху магазинов
    нет. Туалеты только в визит-центре, ближайший банкомат — в Хони.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем в сторону Хони и Горди — 275 км и около четырёх часов пятнадцати
    минут. За Горди дорога к Кинчхе сужается, а последние пять-шесть километров гравийные, с крутыми подъёмами
    и размывами после дождя. Седан на этом участке — плохой выбор, лучше кроссовер или шаттл. Зимой дорога
    часто непроходима. Заправляйтесь в Кутаиси или Хони, выше заправок нет.
fa:
  name: آبشار کینچخا
  short: آبشاری پلکانی به بلندی تقریبی صد متر بالای اوکاتسه، در انتهای جاده‌ای شنی.
  body: >-
    آبشار کینچخا بالای درهٔ اوکاتسه در شهرستان خونی قرار دارد و هر دو به یک منطقهٔ حفاظت‌شده تعلق دارند.
    آب در چند مرحله از دیواره‌ای آهکی فرو می‌ریزد؛ بلندی کل به حدود صد متر می‌رسد، اما این آبشاری پلکانی
    است نه یک ریزش یکپارچه.


    بیش از هر چیز، فصل تعیین می‌کند بازدید چطور از آب درمی‌آید. **در بهار و پس از باران‌های سنگین آبشار
    پرصدا و پرتوان است؛ تا اواخر اوت اغلب به نواری باریک آب می‌شود.** اگر نسخهٔ چشمگیرش را می‌خواهید،
    ماه‌های مه و ژوئن درست‌اند.


    رسیدن به آنجا خودش داستانی جداگانه است. بخش پایانی شنی است با شیارهای عمیق و پس از باران به‌مراتب
    سخت‌تر می‌شود. به همین دلیل **معمولاً شاتلی از مرکز بازدیدکنندگان پیشنهاد می‌شود** و بالا بردن ماشین
    شخصی تا انتها همیشه توصیه نمی‌شود. از پارکینگ، پله‌های چوبی و مسیری پیاده به سکوهای دید پایین می‌روند.


    آنچه به دست می‌آورید:


    - نمای آبشار از دو تراز

    - تنگهٔ جنگل کلخی و دیواره‌های آهکی

    - امکان ترکیب آن با درهٔ اوکاتسه در یک روز


    هر دو محل در یک روز جا می‌شوند، اما تنها اگر صبح زود از تفلیس بیرون بزنید. تلاش برای افزودن کینچخا
    به بعدازظهر پس از حرکتی دیرهنگام مرتب به این ختم می‌شود که آدم‌ها درست وقتی می‌رسند که آخرین شاتل
    دارد می‌رود.
  tip: >-
    آبشار در مه و ژوئن پرآب‌ترین حالت را دارد و تا پایان تابستان ممکن است به‌شدت کوچک شود. بخش پایانی
    جاده شنی است — اگر سدان دارید، آن را در مرکز بازدیدکنندگان بگذارید و با شاتل بالا بروید. پله‌های چوبی
    در باران لغزنده‌اند، پس کفش با چنگ خوب ضروری است. آب و خوراکی همراه بیاورید، چون بالا هیچ مغازه‌ای
    نیست. سرویس بهداشتی تنها در مرکز بازدیدکنندگان است و نزدیک‌ترین خودپرداز در خونی.
  route: >-
    از تفلیس E60 را تا کوتایسی بگیرید، سپس به سوی خونی و گوردی بروید — 275 کیلومتر و تقریباً چهار ساعت
    و پانزده دقیقه. آن‌سوی گوردی جاده به سمت کینچخا باریک می‌شود و پنج‌شش کیلومتر پایانی شنی است، با شیب‌های
    تند و آبشستگی پس از باران. سدان در آن بخش انتخاب بدی است؛ کراس‌اوور یا شاتل به‌مراتب بهتر است. زمستان‌ها
    این مسیر اغلب غیرقابل عبور است. در کوتایسی یا خونی سوخت‌گیری کنید. ردهٔ خودروها را می‌توانید در صفحهٔ
    /fleet/ مقایسه کنید.
he:
  name: מפל קינצחה
  short: מפל מדורג בגובה של כמאה מטרים מעל אוקאצה, בסופה של דרך חצץ.
  body: >-
    מפל קינצחה שוכן מעל קניון אוקאצה בנפת חוני, ושניהם שייכים לאותו שטח מוגן. המים יורדים במורד קיר גיר
    בכמה שלבים; הגובה הכולל מגיע לכמאה מטרים, אך זהו מפל מדורג ולא נפילה אחת רציפה.


    העונתיות מגדירה את הביקור יותר מכל דבר אחר. **באביב ואחרי גשמים כבדים המפל רועש ועוצמתי; לקראת סוף
    אוגוסט הוא מצטמצם לא פעם לסרט דק.** מי שרוצה את הגרסה הדרמטית שלו, מאי ויוני הם החודשים הנכונים.


    הדרך לשם היא סיפור בפני עצמו. הקטע האחרון הוא חצץ עם תלמים עמוקים ונעשה קשה בהרבה אחרי גשם. משום כך
    **מוצעת בדרך כלל הסעה ממרכז המבקרים**, ולא תמיד מומלץ לעלות עד למעלה ברכב פרטי. מן החניון יורדים מדרגות
    עץ ושביל אל מרפסות התצפית.


    מה מקבלים:


    - נוף אל המפל משני מפלסים

    - ערוץ יער קולכי וקירות גיר

    - אפשרות לשלב אותו עם קניון אוקאצה באותו יום


    שני האתרים נכנסים ליום אחד, אך רק אם יוצאים מטביליסי מוקדם. ניסיון להוסיף את קינצחה אחר הצהריים אחרי
    יציאה מאוחרת מסתיים באופן קבוע בכך שאנשים מגיעים בדיוק כשההסעה האחרונה יוצאת.
  tip: >-
    המפל מלא במיוחד במאי וביוני ועשוי להצטמצם דרמטית עד סוף הקיץ. הקטע האחרון של הדרך הוא חצץ — אם אתם
    בסדאן, השאירו אותה במרכז המבקרים וסעו למעלה בהסעה. מדרגות העץ חלקלקות בגשם, ולכן נעליים עם אחיזה טובה
    הן הכרח. הביאו איתכם מים ואוכל, שכן אין שום חנות למעלה. שירותים יש רק במרכז המבקרים, והכספומט הקרוב
    ביותר נמצא בחוני.
  route: >-
    מטביליסי סעו בכביש E60 עד קוטאיסי, ומשם לכיוון חוני וגורדי — 275 ק״מ וכארבע שעות וחמש עשרה דקות. מעבר
    לגורדי הכביש לכיוון קינצחה מצטמצם, וחמשת או ששת הקילומטרים האחרונים הם חצץ עם מדרונות תלולים ושטיפות
    אחרי גשם. סדאן היא בחירה גרועה בקטע הזה; קרוסאובר או ההסעה עדיפים בהרבה. בחורף הדרך לרוב אינה עבירה.
    מלאו דלק בקוטאיסי או בחוני. אפשר להשוות קטגוריות רכב בעמוד /fleet/.
ar:
  name: شلال كينتشخا
  short: شلال متدرج بارتفاع نحو مئة متر فوق أوكاتسي، في نهاية طريق حصوي.
  body: >-
    يقع شلال كينتشخا فوق وادي أوكاتسي في بلدية خوني، وكلاهما ينتمي إلى المحمية نفسها. تنزل المياه على
    جدار كلسي في عدة مراحل؛ ويبلغ الارتفاع الكلي نحو مئة متر، لكنه شلال متدرج لا سقطة واحدة متصلة.


    والموسمية تحدد طبيعة الزيارة أكثر من أي شيء آخر. **ففي الربيع وبعد الأمطار الغزيرة يكون الشلال صاخباً
    قوياً؛ ومع أواخر أغسطس كثيراً ما ينكمش إلى شريط رفيع.** ومن أراد نسخته المهيبة فمايو ويونيو هما الشهران
    المناسبان.


    والوصول إليه قصة قائمة بذاتها. فالمقطع الأخير حصوي بأخاديد عميقة ويزداد صعوبة كثيراً بعد المطر. ولهذا
    **تُعرض عادة حافلة نقل من مركز الزوار**، ولا يُنصح دائماً بصعود الطريق كاملاً بسيارتك. ومن الموقف
    تهبط درجات خشبية وممر إلى منصات الإطلالة.


    وما تحصل عليه:


    - إطلالات على الشلال من مستويين

    - مضيق غابة كولخية وجدران كلسية

    - إمكان ضمه إلى وادي أوكاتسي في يوم واحد


    ويتسع اليوم الواحد للموقعين معاً، لكن بشرط مغادرة تبليسي مبكراً. أما محاولة إضافة كينتشخا بعد الظهر
    عقب انطلاق متأخر فتنتهي مراراً بوصول الناس في اللحظة التي تغادر فيها آخر حافلة.
  tip: >-
    يكون الشلال في أوج امتلائه في مايو ويونيو وقد ينكمش بشدة مع نهاية الصيف. والمقطع الأخير من الطريق
    حصوي — فإن كنت في سيارة سيدان فاتركها في مركز الزوار واصعد بحافلة النقل. والدرجات الخشبية زلقة في
    المطر، فالحذاء ذو القبضة الجيدة ضرورة. واحمل معك ماءً وطعاماً، إذ لا متجر في الأعلى. ودورات المياه
    في مركز الزوار فقط، وأقرب صراف آلي في خوني.
  route: >-
    من تبليسي اسلك الطريق E60 إلى كوتايسي، ثم اتجه نحو خوني وغوردي — 275 كم ونحو أربع ساعات وخمس عشرة
    دقيقة. وخلف غوردي يضيق الطريق نحو كينتشخا، والكيلومترات الخمسة أو الستة الأخيرة حصوية بمنحدرات حادة
    وانجرافات بعد المطر. والسيدان خيار سيئ في ذلك المقطع؛ وسيارة كروس أوفر أو حافلة النقل أفضل بكثير.
    وفي الشتاء يتعذر سلوك الطريق غالباً. املأ الخزان في كوتايسي أو خوني. ويمكنك مقارنة فئات السيارات في
    صفحة /fleet/.
