ka:
  name: ალი და ნინო
  short: >-
    თამარა კვესიტაძის რვამეტრიანი ფოლადის შეყვარებულები ბათუმის სანაპიროზე: ყოველ საღამოს ერთმანეთს უახლოვდებიან,
    ერთმანეთში გადიან და შორდებიან.
  body: >-
    **ყოველ საღამოს, დაახლოებით შვიდ საათზე, ბათუმის სანაპიროზე ორი ფოლადის შეყვარებული ერთმანეთისკენ
    იძვრის — და ყოველ საღამოს ერთმანეთს ასცდება.** ფიგურები თამარა კვესიტაძემ 2007 წელს ჩაიფიქრა, სანაპიროზე
    კი 2010 წელს დაიდგა. თითოეული რვა მეტრია და ერთმანეთზე დალაგებული ფოლადის სეგმენტებისგან შედგება:
    მოძრაობისას სეგმენტები ერთმანეთს შორის სრიალებს, რამდენიმე წამით მამაკაცი და ქალი ერთ სილუეტად იქცევიან,
    მერე ერთმანეთში გაივლიან და დაშორდებიან. ციკლი დაახლოებით ათ წუთს გრძელდება, სიბნელეში კი ფიგურებს
    ფერადი ნეონი ანათებს.


    ნამუშევარს თავდაპირველად უბრალოდ „მამაკაცი და ქალი“ ერქვა. მოგვიანებით მას „ალი და ნინოს“ გმირების
    სახელი დაერქვა — რომანისა, რომელიც 1937 წელს ვენაში, გერმანულ ენაზე, ყურბან საიდის ფსევდონიმით გამოიცა.
    ბაქოელი მუსლიმი ალი-ხან შირვანშირისა და ქართველი ქრისტიანი თავადის ქალის, ნინო ყიფიანის სიყვარულს
    პირველი მსოფლიო ომი ეღობება და ამბავი მწუხარებით მთავრდება. თავად კვესიტაძე თავის ნამუშევარს უფრო
    მშვიდად კითხულობს: მისი თქმით, ერთად ყოფნა მხოლოდ ცოტა ხნით არის შესაძლებელი, მაგრამ ეს მოკლე დრო
    ზოგისთვის მთელი საუკუნე შეიძლება იყოს.


    ქანდაკებას საკუთარი დრამაც აქვს. 2015 წელს შტორმმა მისი საძირკველი დააზიანა და ფიგურები ხმელეთისკენ
    დაახლოებით 50 მეტრით გადაიტანეს, დაახლოებით 185 550 ლარად. გადატანისას ნინო ჩამოვარდა და მის შეკეთებას
    ერთი კვირა დასჭირდა. ახლა მისი მეზობლები ანბანის კოშკი და ეშმაკის ბორბალია. ავტორისთვის ეს სიახლოვე
    გაუგებარია — ძნელი გასარჩევია, ხელოვნებაა თუ გართობა — და იმედი აქვს, რომ ოდესმე ან ბორბალს გადაიტანენ,
    ან ქანდაკებას.


    2016 წელს „ალი და ნინო“ მსოფლიოს ათ ყველაზე რომანტიკულ ქანდაკებას შორის დაასახელეს, ტურისტები კი მას
    უბრალოდ „სიყვარულის ქანდაკებას“ ეძახიან.


    ერთ ციკლს ნუ დასჯერდებით. პირველად შეხვედრას უყურებთ, მეორედ — განშორებას.
  tip: >-
    მოძრაობა, ჩვეულებრივ, საღამოს შვიდ საათზე იწყება, ზაფხულში კი მთელი საღამო მეორდება; განრიგი შეიძლება
    შეიცვალოს, ამიტომ ადგილზე გადაამოწმეთ. ერთი ციკლი დაახლოებით ათ წუთს გრძელდება, ასე რომ, წინასწარ
    ადგილის დაკავება საჭირო არ არის. დაბინდებისას მოდით — ფიგურები უკვე ანთია, ცაზე კი დღის ბოლო სინათლეა.
    საუკეთესო კუთხე გვერდიდანაა, ზღვის ფონზე. ბულვარზე ხართ, ამიტომ ველოსიპედებსა და ელექტროსკუტერებს
    მიხედეთ. სანახავად უფასოა, კაფეები და ტუალეტები ბულვარზეა. ნახევარი საათი საკმარისია, ანბანის კოშკი
    კი გვერდითაა.
  route: >-
    თბილისიდან დაახლოებით 375 კილომეტრი და ხუთნახევარი საათია, ბოლომდე ასფალტით. ს1 (E60) მაგისტრალით
    დასავლეთისკენ, რიკოთის უღელტეხილზე გადასვლით და ქუთაისის გვერდის ავლით სამტრედიამდე იარეთ, ს12-ით
    (E692) ლანჩხუთის გავლით გრიგოლეთამდე, ზღვამდე ჩადით, შემდეგ კი ს2-ით (E70) სამხრეთისკენ ქობულეთის
    გავლით ბათუმში შედით. საწვავი მთელ გზაზეა. ქალაქში სანაპიროს ჩრდილოეთ ბოლოსკენ წადით, იქ, სადაც ბულვარი
    ნავსადგურს ხვდება, სასწაულების პარკში; ორიენტირად ანბანის კოშკი გამოიყენეთ, მას ვერ გამოტოვებთ. მანქანა
    პარკის ირგვლივ ფასიან ავტოსადგომზე ან ახლომახლო ქუჩაზე დატოვეთ და საღამოს ადგილის საძებნელად დრო გაითვალისწინეთ.
    ეკონომკლასის ავტომობილიც სავსებით საკმარისია.
en:
  name: Ali and Nino
  short: >-
    Tamara Kvesitadze's eight-metre steel lovers on Batumi's waterfront: each evening they glide together,
    pass through each other and part.
  body: >-
    **Every evening at about seven, on Batumi's waterfront, two steel lovers start walking towards each
    other — and every evening they miss.** Tamara Kvesitadze designed the figures in 2007, and they were
    installed on the shore in 2010. Each stands eight metres tall and is built of stacked steel segments;
    as they move, the segments slide past one another, so that for a few seconds the man and the woman
    become a single silhouette before passing through and drifting apart. The cycle lasts about ten minutes,
    and after dark the figures glow in shifting neon.


    The piece was first called Man and Woman. It was later renamed after the lovers of Ali and Nino, a
    novel published in German in Vienna in 1937 under the pseudonym Kurban Said: Ali Khan Shirvanshir,
    a Muslim from Baku, and Nino Kipiani, a Christian Georgian princess, whose love is caught up in the
    First World War and ends in grief. Kvesitadze reads her own work more quietly: "being together is
    possible for only a little time. This short period for someone might mean a whole century."


    The statue has had its own drama. In 2015 a storm damaged its base, and it was moved about 50 metres
    inland at a cost of some 185,550 lari; during the move Nino was dropped and needed a week of repairs.
    Its new neighbours are the Alphabetic Tower and a Ferris wheel, a pairing the sculptor admitted makes
    it hard to tell whether this is art or amusement; she hopes that one day one of the two will be moved.


    In 2016 it was listed among the world's ten most romantic statues, and visitors call it the Statue
    of Love.


    Stay for a second cycle. The first time you watch the meeting; the second time, the parting.
  tip: >-
    The movement traditionally begins at about 7 pm, and in summer it repeats through the evening; times
    can change, so check locally. One cycle takes about ten minutes, so there is no need to camp out early.
    Arrive at dusk to catch the figures lit against the last of the light. The best angle is from the
    side, with the sea behind them. You are on the Boulevard, so watch for bikes and e-scooters. It is
    free; cafés and toilets are along the Boulevard. Half an hour is plenty, and the Alphabetic Tower
    is next door.
  route: >-
    From Tbilisi it is about 375 km and five and a half hours on asphalt. Follow the S1 (E60) west over
    the Rikoti Pass and past Kutaisi to Samtredia, take the S12 (E692) through Lanchkhuti to the coast
    at Grigoleti, then the S2 (E70) south through Kobuleti into Batumi. Fuel is available all the way.
    In the city, head for the northern end of the seafront, where the Boulevard meets the harbour at Miracle
    Park; the Alphabetic Tower is the landmark you cannot miss. Use the paid parking around the park or
    nearby streets, and allow extra time to find a space in the evening. An economy car is entirely sufficient.
ru:
  name: Али и Нино
  short: >-
    Восьмиметровые стальные влюблённые Тамары Квеситадзе на батумской набережной: каждый вечер они скользят
    друг к другу, проходят сквозь друг друга — и расходятся.
  body: >-
    **Каждый вечер, около семи часов, на набережной Батуми два стальных силуэта начинают идти друг к другу
    — и каждый вечер расходятся, так и не коснувшись друг друга.** Тамара Квеситадзе задумала эти фигуры
    в 2007 году, а на берегу их установили в 2010-м. Каждая высотой восемь метров и собрана из наложенных
    друг на друга стальных сегментов; когда фигуры движутся, сегменты скользят друг мимо друга, и на несколько
    секунд мужчина и женщина сливаются в единый силуэт, прежде чем пройти друг через друга и снова разойтись.
    Цикл длится около десяти минут, а с наступлением темноты фигуры светятся переливающимся неоном.


    Первоначально памятник назывался «Мужчина и женщина». Позже его переименовали в честь влюблённых из
    романа «Али и Нино», изданного на немецком языке в Вене в 1937 году под псевдонимом Курбан Саид: мусульманина
    из Баку Али-хана Ширваншира и грузинской княжны-христианки Нино Кипиани, чья любовь оказывается втянута
    в Первую мировую войну и завершается горем. Сама Квеситадзе говорит о своей работе тише: «быть вместе
    возможно лишь на короткое время. Для кого-то это короткое время может значить целый век».


    У самого памятника была своя драма. В 2015 году шторм повредил его основание, и фигуры перенесли примерно
    на 50 метров вглубь берега, что обошлось около 185 550 лари; при переносе Нино упала, и потребовалась
    неделя, чтобы её восстановить. Теперь соседями памятника стали Алфавитная башня и колесо обозрения
    — сочетание, из-за которого, как призналась сама скульптор, трудно понять, искусство это или аттракцион;
    она надеется, что когда-нибудь один из двух объектов перенесут.


    В 2016 году памятник вошёл в десятку самых романтичных статуй мира, а туристы попросту называют его
    Памятником любви.


    Останьтесь на второй цикл. В первый раз вы увидите встречу; во второй — расставание.
  tip: >-
    По традиции движение начинается около семи вечера, летом повторяется несколько раз за вечер; время
    может меняться, так что уточняйте на месте. Один цикл длится около десяти минут, поэтому занимать
    место заранее не нужно. Приходите в сумерках, чтобы застать фигуры освещёнными на фоне угасающего
    неба. Лучший ракурс — сбоку, с морем за спиной статуй. Вы находитесь на Бульваре, так что будьте внимательны
    к велосипедистам и электросамокатам. Вход бесплатный; кафе и туалеты — вдоль Бульвара. Получаса вполне
    достаточно, а Алфавитная башня — тут же, рядом.
  route: >-
    От Тбилиси около 375 км и пять с половиной часов, всё время по асфальту. Следуйте по трассе S1 (E60)
    на запад, через перевал Рикоти и Кутаиси до Самтредиа, затем по S12 (E692) через Ланчхути до побережья
    у Григолети, а далее по S2 (E70) на юг через Кобулети в Батуми. Заправки есть на всём протяжении пути.
    В городе двигайтесь к северной части набережной, где Бульвар встречается с портом в Парке чудес; ориентир,
    который невозможно пропустить, — Алфавитная башня. Воспользуйтесь платной парковкой у парка или на
    соседних улицах и оставьте запас времени на поиск места вечером. Автомобиля экономкласса вполне достаточно.
fa:
  name: علی و نینو
  short: >-
    دلدادگان فولادی هشت‌متری تامارا کوسیتادزه بر ساحل باتومی: هر شامگاه به‌سوی هم می‌لغزند، از میان یکدیگر
    می‌گذرند و از هم جدا می‌شوند.
  body: >-
    **هر شامگاه، حدود ساعت هفت، بر ساحل باتومی دو پیکرهٔ فولادی به‌سوی هم گام برمی‌دارند — و هر شامگاه
    به هم نمی‌رسند.** تامارا کوسیتادزه این پیکره‌ها را در سال ۲۰۰۷ طراحی کرد و در سال ۲۰۱۰ بر ساحل نصب
    شدند. هر پیکره هشت متر بلندی دارد و از قطعات فولادی روی‌هم‌چیده ساخته شده است؛ هنگام حرکت، این قطعات
    از میان هم می‌گذرند، چنان‌که برای چند ثانیه مرد و زن به سایه‌نمایی یگانه بدل می‌شوند، پیش از آن‌که
    از میان یکدیگر بگذرند و باز از هم دور شوند. هر چرخه حدود ده دقیقه به طول می‌انجامد و پس از غروب، پیکره‌ها
    با نورهای نئون رنگارنگ می‌درخشند.


    این اثر در ابتدا «مرد و زن» نام داشت. بعدها نامش به نام دلدادگان رمان «علی و نینو» تغییر یافت؛ رمانی
    که به زبان آلمانی، در وین، در سال ۱۹۳۷ و با نام مستعار قربان سعید منتشر شد: علی‌خان شیروان‌شیر، مسلمانی
    از باکو، و نینو کیپیانی، بانویی گرجی و مسیحی از تبار اشرافی، که عشقشان در گیرودار جنگ جهانی اول گرفتار
    می‌ماند و به اندوه می‌انجامد. کوسیتادزه خود، آرام‌تر از این، اثرش را چنین می‌خواند: «با هم بودن تنها
    برای مدتی کوتاه ممکن است. همین زمان کوتاه، برای برخی می‌تواند یک قرن کامل باشد.»


    این مجسمه ماجراهای خودش را هم داشته است. در سال ۲۰۱۵ طوفانی به پایهٔ آن آسیب زد، و مجسمه‌ها را حدود
    پنجاه متر به سوی خشکی منتقل کردند؛ هزینه‌ای در حدود ۱۸۵٬۵۵۰ لاری. در جریان انتقال، نینو به زمین افتاد
    و تعمیرش یک هفته به طول انجامید. اکنون همسایگان تازهٔ او برج الفبا و چرخ‌وفلک هستند؛ همنشینی‌ای که
    به گفتهٔ خود مجسمه‌ساز، تشخیص هنر از تفریح را دشوار می‌کند؛ او امید دارد که روزی یکی از این دو جابه‌جا
    شود.


    در سال ۲۰۱۶ این مجسمه در فهرست ده مجسمهٔ عاشقانهٔ برتر جهان جای گرفت، و گردشگران آن را «مجسمهٔ عشق»
    می‌نامند.


    برای چرخهٔ دوم بمانید. بار نخست دیدار را می‌بینید؛ بار دوم، جدایی را.
  tip: >-
    به‌طور معمول حرکت پیکره‌ها حدود ساعت هفت شب آغاز می‌شود و در تابستان چند بار در طول شب تکرار می‌شود؛
    زمان‌بندی ممکن است تغییر کند، پس بهتر است در محل بررسی کنید. هر چرخه حدود ده دقیقه طول می‌کشد، بنابراین
    نیازی نیست زودتر جای بگیرید. در گرگ‌ومیش بیایید تا پیکره‌ها را در نور آخرین لحظات روز روشن ببینید.
    بهترین زاویه از پهلو است، با دریا در پس‌زمینه. شما در بلوار هستید، پس مراقب دوچرخه‌ها و اسکوترهای
    برقی باشید. ورود رایگان است؛ کافه‌ها و سرویس‌های بهداشتی در طول بلوار قرار دارند. نیم ساعت کافی است،
    و برج الفبا هم همان نزدیکی است.
  route: >-
    از تفلیس حدود ۳۷۵ کیلومتر و پنج ساعت و نیم راه است، همه بر آسفالت. از بزرگراه S1 (E60) به سوی غرب
    بروید، از گذرگاه ریکوتی و کنار کوتایسی تا سامتردیا؛ سپس از S12 (E692) از میان لانچخوتی تا ساحل در
    گریگولتی؛ و از آنجا از S2 (E70) به سوی جنوب، از میان کوبولتی تا باتومی. در سراسر مسیر پمپ بنزین هست.
    در شهر، به سوی انتهای شمالی ساحل بروید، جایی که بلوار به بندر در پارک شگفتی‌ها می‌رسد؛ برج الفبا نشانه‌ای
    است که نمی‌شود نادیده‌اش گرفت. از پارکینگ‌های پولی اطراف پارک یا خیابان‌های نزدیک استفاده کنید و برای
    یافتن جا در شب زمان بیشتری در نظر بگیرید. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: עלי ונינו
  short: >-
    הנאהבים מפלדה בני שמונת המטרים של תמרה קווסיטדזה על הטיילת של בטומי: בכל ערב הם גולשים זה אל זה, חולפים
    זה בזה — ונפרדים.
  body: >-
    **בכל ערב, בסביבות השעה שבע, על הטיילת של בטומי, שתי דמויות פלדה מתחילות ללכת זו לעבר זו — ובכל ערב
    הן מפספסות.** תמרה קווסיטדזה תכננה את הדמויות ב-2007, והן הוצבו על החוף ב-2010. כל דמות בגובה שמונה
    מטרים, ובנויה משכבות של מקטעי פלדה מוערמים; כשהן נעות, המקטעים גולשים זה על פני זה, כך שלכמה שניות
    הגבר והאישה מתמזגים לצללית אחת לפני שהם חולפים זה בזה ומתרחקים. המחזור נמשך כעשר דקות, ולאחר רדת החשכה
    הדמויות זוהרות בניאון משתנה.


    בתחילה נקראה היצירה "גבר ואישה". מאוחר יותר היא נקראה על שם הנאהבים ב"עלי ונינו", רומן שיצא לאור בגרמנית
    בווינה ב-1937 בשם העט קורבן סעיד: עלי חאן שירוואנשיר, מוסלמי מבאקו, ונינו קיפיאני, נסיכה גאורגית נוצרייה,
    שאהבתם נסחפת למלחמת העולם הראשונה ומסתיימת ביגון. קווסיטדזה עצמה מפרשת את יצירתה בנימה שקטה יותר:
    "להיות יחד אפשר רק לזמן קצר. הזמן הקצר הזה יכול להיות, למישהו, מאה שלמה."


    גם לפסל הייתה דרמה משלו. ב-2015 סופה פגעה בבסיסו, והוא הועבר כ-50 מטרים לתוך היבשה, בעלות של כ-185,550
    לארי; בזמן ההעברה נינו נפלה ונדרש שבוע לתיקונה. השכנים החדשים של הפסל הם מגדל האלף-בית וגלגל ענק —
    צמד שהפסלת עצמה הודתה כי מקשה לקבוע אם זו אמנות או שעשועים; היא מקווה שיום אחד אחד מהשניים יועבר.


    ב-2016 הוא נכלל ברשימת עשרת הפסלים הרומנטיים ביותר בעולם, והמבקרים קוראים לו פסל האהבה.


    הישארו למחזור שני. בפעם הראשונה תצפו במפגש; בשנייה — בפרֵדה.
  tip: >-
    בדרך כלל התנועה מתחילה בסביבות שבע בערב, ובקיץ חוזרת על עצמה כמה פעמים במהלך הערב; השעות עשויות להשתנות,
    כך שכדאי לבדוק במקום. מחזור אחד נמשך כעשר דקות, כך שאין צורך להגיע מוקדם ולתפוס מקום. הגיעו בשעת בין-הערביים
    כדי לראות את הדמויות מוארות על רקע שארית האור. הזווית הטובה ביותר היא מהצד, עם הים מאחוריהן. אתם נמצאים
    על הטיילת, אז שימו עין על אופניים וקורקינטים חשמליים. הכניסה חופשית; בתי קפה ושירותים נמצאים לאורך
    הטיילת. חצי שעה מספיקה בהחלט, ומגדל האלף-בית ממש בסמוך.
  route: >-
    מטביליסי המרחק הוא כ-375 ק"מ וחמש שעות וחצי, כולן על אספלט. סעו מערבה בכביש S1 (E60), דרך מעבר ריקוטי
    ולצד קוטאיסי עד סמטרדיה, אחר כך S12 (E692) דרך לנצ'חוטי עד לחוף בגריגולטי, ומשם S2 (E70) דרומה דרך
    קובולטי לבטומי. תדלוק זמין בכל אורך הדרך. בעיר, פנו לקצה הצפוני של החוף, שם הטיילת פוגשת את הנמל בפארק
    הפלאים; מגדל האלף-בית הוא הסמן שלא ניתן להחמיץ. השתמשו בחניון בתשלום סביב הפארק או ברחובות הקרובים,
    והקצו זמן נוסף למציאת מקום בערב. רכב אקונומי רגיל מספיק בהחלט.
ar:
  name: علي ونينو
  short: >-
    عاشقا الفولاذ اللذان صمّمتهما تامارا كفيسيتادزه، بارتفاع ثمانية أمتار، على كورنيش باتومي: كل مساء
    يتقاربان في انسياب، يعبر أحدهما الآخر، ثم يفترقان.
  body: >-
    **كل مساء، في نحو الساعة السابعة، على كورنيش باتومي، يبدأ عاشقان من الفولاذ بالمشي أحدهما نحو الآخر
    — وفي كل مساء يفوّتان اللقاء.** صمّمت تامارا كفيسيتادزه هذين التمثالين في عام 2007، ونُصبا على الشاطئ
    في عام 2010. يبلغ ارتفاع كل منهما ثمانية أمتار، وهما مبنيان من شرائح فولاذية متراصّة؛ وحين يتحركان،
    تتزحلق الشرائح بعضها فوق بعض، فيتحد الرجل والمرأة للحظات في ظلّ واحد قبل أن يعبر أحدهما الآخر ويفترقا
    من جديد. تدوم الدورة نحو عشر دقائق، وبعد حلول الظلام يتوهّج التمثالان بأضواء نيون متغيّرة.


    حمل العمل في البداية اسم «رجل وامرأة». ثم أُعيدت تسميته على اسم عاشقي رواية «علي ونينو»، التي نُشرت
    بالألمانية في فيينا عام 1937 تحت اسم مستعار هو قربان سعيد: علي خان شيرفانشير، مسلم من باكو، ونينو
    كيبياني، أميرة جورجية مسيحية، تنجرف قصة حبهما في غمار الحرب العالمية الأولى وتنتهي بالحزن. أما كفيسيتادزه
    نفسها فتقرأ عملها بنبرة أهدأ: «العيش معًا ممكن فقط لفترة قصيرة. وهذه الفترة القصيرة قد تعني لأحدهم
    قرنًا كاملاً.»


    كان للتمثال دراما خاصة به أيضًا. في عام 2015 أضرت عاصفة بقاعدته، فنُقل نحو خمسين مترًا نحو الداخل
    بتكلفة بلغت زهاء 185,550 لاري؛ وخلال النقل سقطت نينو واحتاج إصلاحها إلى أسبوع كامل. أما جيرانه الجدد
    فهما برج الأبجدية ودولاب الملاهي (العجلة الدوّارة)، وهو تجاور اعترفت النحّاتة نفسها بأنه يصعّب التمييز
    بين الفن والتسلية؛ وهي تأمل أن يُنقل أحدهما يومًا ما.


    في عام 2016 أُدرج التمثال ضمن أكثر عشرة تماثيل رومانسية في العالم، ويسمّيه الزوار «تمثال الحب».


    ابقَ لدورة ثانية. في المرة الأولى ترى اللقاء؛ وفي الثانية، الفراق.
  tip: >-
    تبدأ الحركة عادةً نحو الساعة السابعة مساءً، وتتكرر في المساء عدة مرات في الصيف؛ وقد تتغير الأوقات،
    فمن الأفضل التحقق محليًا. تستغرق الدورة الواحدة نحو عشر دقائق، فلا حاجة للحضور مبكرًا وحجز مكان. تعال
    عند الغسق لترى التمثالين مضيئين على خلفية آخر ضوء النهار. أفضل زاوية للمشاهدة من الجانب، والبحر خلف
    التمثالين. أنت على الكورنيش، فاحترس من الدراجات الهوائية والسكوترات الكهربائية. الدخول مجاني؛ والمقاهي
    والمرافق الصحية منتشرة على طول الكورنيش. نصف ساعة كافية تمامًا، وبرج الأبجدية على مقربة مباشرة.
  route: >-
    من تبليسي نحو 375 كم وخمس ساعات ونصف، كلها على أسفلت. اتبع الطريق S1 (E60) غربًا عبر ممر ريكوتي وبمحاذاة
    كوتايسي حتى سامتريديا، ثم S12 (E692) عبر لانتشخوتي إلى الساحل عند غريغوليتي، ثم S2 (E70) جنوبًا عبر
    كوبوليتي إلى باتومي. الوقود متوفر طوال الطريق. في المدينة، توجّه إلى الطرف الشمالي من الواجهة البحرية،
    حيث يلتقي الكورنيش بالميناء عند حديقة العجائب؛ وبرج الأبجدية هو المعلم الذي لا يمكن تفويته. استخدم
    مواقف السيارات المدفوعة حول الحديقة أو في الشوارع القريبة، وخصّص وقتًا إضافيًا لإيجاد مكان في المساء.
    سيارة اقتصادية عادية كافية تمامًا.
