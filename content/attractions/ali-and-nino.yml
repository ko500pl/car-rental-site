ka:
  name: ალი და ნინო
  short: >-
    თამარა კვესიტაძის 8-მეტრიანი მოძრავი ფოლადის ქანდაკება ბათუმის სანაპიროზე — ყოველ საღამოს ფიგურები
    ერთმანეთს გაივლიან.
  body: >-
    **ეს ალბათ ერთადერთი ქანდაკებაა საქართველოში, რომელსაც ხალხი განრიგით ელოდება.** თამარა კვესიტაძის
    8-მეტრიანი კინეტიკური სკულპტურა ბათუმის სანაპიროზე, სასწაულების პარკის მახლობლად დგას. ორი ლითონის
    ფიგურა — მამაკაცი და ქალი — ნელა მოძრაობს ერთმანეთისკენ, ერთ მთლიანობად ერწყმის და შემდეგ ისე გაივლის
    ერთმანეთში, რომ არასდროს ეხება. მთელი ციკლი დაახლოებით 8-10 წუთი გრძელდება.


    ქანდაკება 2010 წელს დაიდგა და თავდაპირველად „მამაკაცი და ქალი" ერქვა; მოგვიანებით მას ყურბან საიდის
    1937 წლის რომანის გმირების — აზერბაიჯანელი მუსლიმი ალისა და ქართველი ქრისტიანი ნინოს — სახელები დაერქვა.
    რომანში სიყვარული ომმა დააშორა, ქანდაკებაში კი ფიგურები მარადიულად ხვდებიან და შორდებიან.


    მოძრაობა ყოველ საღამოს 19:00 საათზე იწყება, სეზონზე ხშირად გვიანაც მეორდება. სიბნელეში ფიგურები ფერად
    განათებას იძენს და შერწყმის მომენტი ყველაზე ეფექტურია — ამიტომ საუკეთესო დროა დაბინდებიდან ღამემდე.
    გვერდით ანბანის კოშკი და შქერიანი სანაპიროა: ალი და ნინო ბულვარის საღამოს გასეირნების ბუნებრივი ფინალია.
  tip: >-
    ზუსტი დრო გადაამოწმე ადგილზე — მოძრაობა სტანდარტულად 19:00-ზე იწყება, ზაფხულში ციკლები ღამემდე მეორდება.
    ერთი სრული ციკლი 10 წუთამდე გრძელდება, ამიტომ ადრე მისვლა არ დაგჭირდება. საუკეთესო კადრი გვერდიდან
    გამოდის, ზღვის ფონზე. ირგვლივ ბულვარია — ველოსიპედების და სკუტერების ნაკადს მიხედე. შესვლა უფასოა,
    ტუალეტები და კაფეები ბულვარზეა.
  route: >-
    თბილისიდან ბათუმამდე E60/S1 მაგისტრალით მიდიხარ რიკოთის, ქუთაისის შემოვლითის და ქობულეთის გავლით —
    დაახლოებით 375 კმ, 5:30 სთ, ბოლომდე ასფალტი. საწვავი მთელ გზაზეა. ბათუმში ქანდაკება ახალი ბულვარის
    ბოლოშია, სასწაულების პარკთან, ანბანის კოშკის მახლობლად — ორიენტირად ის გამოიყენე. მანქანა პარკის მიმდებარე
    ფასიან პარკინგზე ან შერიფის ქუჩებზე დგება; საღამოს ადგილის პოვნას ცოტა დრო დაუთმე. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია.
en:
  name: Ali and Nino
  short: >-
    Tamara Kvesitadze's 8-metre moving steel statue on Batumi's seafront — every evening the two figures
    merge and pass through each other.
  body: >-
    **This may be the only statue in Georgia that people wait for on a schedule.** Tamara Kvesitadze's
    8-metre kinetic sculpture stands on Batumi's seafront near Miracle Park: two segmented steel figures,
    a man and a woman, glide slowly towards each other, merge into one silhouette and then pass through
    one another without ever touching. A full cycle takes about 8-10 minutes.


    Installed in 2010 and originally titled "Man and Woman", the piece was later renamed after the heroes
    of Kurban Said's 1937 novel — Ali, an Azerbaijani Muslim, and Nino, a Georgian Christian, lovers separated
    by war. In the novel the love story ends in tragedy; in the sculpture the figures are condemned to
    meet and part forever.


    The movement starts every evening at 19:00, and in season the cycle often repeats later into the night.
    After dark the figures glow with shifting coloured light, and the moment of merging is at its most
    dramatic — so aim for dusk or later. The Alphabetic Tower stands next door, which makes Ali and Nino
    the natural finale of an evening walk along the Boulevard.
  tip: >-
    Check the timing locally — the movement traditionally starts at 19:00, with repeat cycles through
    summer evenings. One full cycle takes up to 10 minutes, so there is no need to arrive early. The best
    photo angle is from the side, with the sea behind the figures. You are on the Boulevard, so watch
    for bikes and scooters streaming past. Free to see; toilets and cafes are along the Boulevard.
  route: >-
    From Tbilisi follow the E60/S1 highway west through the Rikoti tunnels, past the Kutaisi bypass and
    down the coast through Kobuleti — about 375 km and 5:30 of driving, asphalt all the way, with fuel
    available throughout. In Batumi the statue stands at the northern end of the seafront near Miracle
    Park; use the Alphabetic Tower as your landmark. Park in the paid lots around the park or on nearby
    streets — allow a few extra minutes in the evening rush. An economy car is entirely sufficient.
ru:
  name: Али и Нино
  short: >-
    Восьмиметровая движущаяся стальная скульптура Тамары Квеситадзе на набережной Батуми — каждый вечер
    фигуры сливаются и проходят друг сквозь друга.
  body: >-
    **Это, пожалуй, единственная статуя в Грузии, к которой приходят по расписанию.** Восьмиметровая кинетическая
    скульптура Тамары Квеситадзе стоит на батумской набережной у парка Чудес: две составленные из стальных
    сегментов фигуры — мужчина и женщина — медленно движутся навстречу, сливаются в один силуэт и проходят
    друг сквозь друга, так и не соприкоснувшись. Полный цикл занимает 8-10 минут.


    Скульптуру установили в 2010 году под названием «Мужчина и женщина»; позже её переименовали в честь
    героев романа Курбана Саида 1937 года — азербайджанца-мусульманина Али и грузинки-христианки Нино,
    влюблённых, которых разлучила война. В романе история кончается трагедией; в скульптуре фигуры обречены
    вечно встречаться и расставаться.


    Движение начинается каждый вечер в 19:00, в сезон циклы часто повторяются до поздней ночи. В темноте
    фигуры подсвечиваются меняющимся цветным светом, и момент слияния выглядит эффектнее всего — приходите
    в сумерки или позже. Рядом стоит Башня алфавита, так что Али и Нино — естественный финал вечерней
    прогулки по Бульвару.
  tip: >-
    Уточните время на месте: традиционно движение стартует в 19:00, летом циклы повторяются весь вечер.
    Полный цикл длится до 10 минут, приходить сильно заранее не нужно. Лучший ракурс — сбоку, чтобы за
    фигурами было море. Вы на Бульваре: следите за потоком велосипедов и самокатов. Смотреть бесплатно;
    туалеты и кафе — вдоль Бульвара.
  route: >-
    Из Тбилиси — по трассе E60/S1 на запад: Рикотские тоннели, объезд Кутаиси, затем побережье через Кобулети
    — около 375 км и 5:30 езды, асфальт на всём пути, заправки повсюду. В Батуми скульптура стоит в северном
    конце набережной у парка Чудес; ориентир — Башня алфавита. Парковка — на платных стоянках у парка
    или на соседних улицах; вечером на поиск места закладывайте лишние минуты. Машины эконом-класса вполне
    достаточно.
fa:
  name: علی و نینو
  short: >-
    مجسمهٔ فولادی متحرک 8 متری اثر تامارا کوِسیتادزه در ساحل باتومی — هر شب دو پیکر در هم می‌آمیزند و
    از میان هم می‌گذرند.
  body: >-
    **این شاید تنها مجسمهٔ گرجستان باشد که مردم طبق برنامه منتظرش می‌مانند.** مجسمهٔ جنبشی 8 متری تامارا
    کوسیتادزه در ساحل باتومی نزدیک پارک معجزه‌ها ایستاده است: دو پیکر فولادیِ قطعه‌قطعه — مرد و زن — آرام
    به سوی هم می‌لغزند، در یک سیلوئت یکی می‌شوند و سپس بی‌آنکه هرگز به هم برسند از میان هم می‌گذرند. یک
    چرخهٔ کامل حدود 8 تا 10 دقیقه طول می‌کشد.


    مجسمه در سال 2010 با نام «مرد و زن» نصب شد و بعدها به نام قهرمانان رمان 1937 قربان سعید تغییر نام
    یافت — علی، مسلمان آذربایجانی، و نینو، مسیحی گرجی؛ دلدادگانی که جنگ از هم جدایشان کرد. در رمان، عشق
    به تراژدی می‌انجامد؛ در مجسمه، دو پیکر محکوم‌اند تا ابد به هم برسند و از هم جدا شوند.


    حرکت هر شب ساعت 19:00 آغاز می‌شود و در فصل گردشگری چرخه‌ها تا پاسی از شب تکرار می‌شوند. در تاریکی،
    پیکرها با نورهای رنگی متغیر روشن می‌شوند و لحظهٔ آمیختن دراماتیک‌ترین حالت را دارد — پس بهترین زمان،
    گرگ‌ومیش به بعد است. برج الفبا همان کنار است و همین، علی و نینو را به پایان طبیعی پیاده‌روی شبانه
    در بلوار تبدیل می‌کند.
  tip: >-
    زمان دقیق را در محل بپرسید — حرکت طبق سنت ساعت 19:00 شروع می‌شود و در تابستان تا شب تکرار می‌شود.
    یک چرخهٔ کامل تا 10 دقیقه است، پس لازم نیست خیلی زود برسید. بهترین زاویهٔ عکس از پهلو است، با دریا
    در پس‌زمینه. روی بلوار هستید؛ مراقب جریان دوچرخه‌ها و اسکوترها باشید. تماشا رایگان است؛ سرویس بهداشتی
    و کافه‌ها در طول بلوار هستند.
  route: >-
    از تفلیس با بزرگراه E60/S1 به غرب بروید: تونل‌های ریکوتی، کمربندی کوتایسی و سپس ساحل از کوبولتی —
    حدود 375 کیلومتر و 5:30 ساعت رانندگی، سراسر آسفالت و پمپ‌بنزین در تمام مسیر. در باتومی مجسمه در انتهای
    شمالی ساحل نزدیک پارک معجزه‌ها قرار دارد؛ برج الفبا را نشانه بگیرید. خودرو را در پارکینگ‌های پولی
    اطراف پارک یا خیابان‌های نزدیک بگذارید و برای شلوغی عصر چند دقیقه‌ای وقت اضافه در نظر بگیرید. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: עלי ונינו
  short: פסל פלדה נע בגובה 8 מטרים מאת תמרה קווסיטדזה על חוף בתומי — מדי ערב שתי הדמויות מתמזגות ועוברות
    זו דרך זו.
  body: >-
    **זה כנראה הפסל היחיד בגאורגיה שמחכים לו לפי לוח זמנים.** הפסל הקינטי בגובה 8 מטרים של תמרה קווסיטדזה
    ניצב על טיילת החוף של בתומי, ליד פארק הנסים: שתי דמויות פלדה עשויות טבעות — גבר ואישה — גולשות לאט
    זו אל זו, מתמזגות לצללית אחת ואז עוברות זו דרך זו בלי לגעת לעולם. מחזור מלא נמשך כ-8 עד 10 דקות.


    הפסל הוצב ב-2010 תחת השם "גבר ואישה", ומאוחר יותר נקרא על שם גיבורי הרומן של קורבן סעיד מ-1937 — עלי,
    מוסלמי אזרבייג'ני, ונינו, נוצרייה גאורגית, אוהבים שהמלחמה הפרידה ביניהם. ברומן הסיפור נגמר בטרגדיה;
    בפסל נגזר על הדמויות להיפגש ולהיפרד לנצח.


    התנועה מתחילה מדי ערב ב-19:00, ובעונה המחזורים חוזרים לא פעם עד השעות הקטנות. בחשכה הדמויות מוארות
    באור צבעוני משתנה, ורגע ההתמזגות דרמטי במיוחד — לכן כדאי לכוון לדמדומים ואילך. מגדל האלפבית ניצב ממש
    ליד, מה שהופך את עלי ונינו לסיום הטבעי של טיול ערב לאורך הטיילת.
  tip: >-
    בדקו את השעה במקום — התנועה מתחילה באופן מסורתי ב-19:00, ובקיץ המחזורים חוזרים לאורך הערב. מחזור מלא
    נמשך עד 10 דקות, אז אין צורך להקדים. זווית הצילום הטובה ביותר היא מהצד, עם הים מאחורי הדמויות. אתם
    על הטיילת — היזהרו מזרם האופניים והקורקינטים. הצפייה חינם; שירותים ובתי קפה לאורך הטיילת.
  route: >-
    מטביליסי נוסעים מערבה בכביש E60/S1: מנהרות ריקוטי, עוקף כותאיסי, ואז החוף דרך קובולטי — כ-375 ק"מ
    ו-5:30 שעות נהיגה, אספלט לכל האורך ותחנות דלק בשפע. בבתומי הפסל ניצב בקצה הצפוני של הטיילת ליד פארק
    הנסים; מגדל האלפבית הוא נקודת הציון. חנו בחניונים בתשלום סביב הפארק או ברחובות סמוכים — בערב הוסיפו
    כמה דקות לחיפוש מקום. רכב חסכוני מספיק לגמרי.
ar:
  name: علي ونينو
  short: >-
    تمثال فولاذي متحرك بارتفاع 8 أمتار للفنانة تامارا كفيسيتادزه على كورنيش باتومي — كل مساء يندمج الجسدان
    ويعبر أحدهما الآخر.
  body: >-
    **قد يكون هذا التمثال الوحيد في جورجيا الذي ينتظره الناس وفق جدول زمني.** يقف العمل الحركي البالغ
    ارتفاعه 8 أمتار للفنانة تامارا كفيسيتادزه على كورنيش باتومي قرب حديقة العجائب: جسدان فولاذيان من شرائح
    متراكبة — رجل وامرأة — ينزلقان ببطء أحدهما نحو الآخر، فيندمجان في ظل واحد ثم يعبر كل منهما الآخر دون
    أن يتلامسا أبداً. تستغرق الدورة الكاملة نحو 8 إلى 10 دقائق.


    نُصب التمثال عام 2010 باسم «رجل وامرأة»، ثم سُمي لاحقاً على اسم بطلي رواية قربان سعيد الصادرة عام
    1937 — علي المسلم الأذربيجاني ونينو المسيحية الجورجية، حبيبان فرّقت بينهما الحرب. في الرواية تنتهي
    القصة بمأساة؛ وفي التمثال كُتب على الجسدين أن يلتقيا ويفترقا إلى الأبد.


    تبدأ الحركة كل مساء في السابعة (19:00)، وفي الموسم كثيراً ما تتكرر الدورات حتى وقت متأخر. في الظلام
    يُضاء الجسدان بألوان متغيرة، وتبلغ لحظة الاندماج ذروة تأثيرها — فاقصد المكان عند الغسق أو بعده. برج
    الأبجدية يقوم بجواره، ما يجعل علي ونينو الخاتمة الطبيعية لنزهة المساء على الكورنيش.
  tip: >-
    تحقق من التوقيت في المكان — تبدأ الحركة عادة في 19:00 وتتكرر الدورات في أمسيات الصيف. الدورة الكاملة
    تستغرق حتى 10 دقائق فلا حاجة للوصول مبكراً كثيراً. أفضل زاوية للتصوير من الجانب والبحر خلف التمثال.
    أنت على الكورنيش، فانتبه لتيار الدراجات والسكوترات. المشاهدة مجانية؛ ودورات المياه والمقاهي على طول
    الكورنيش.
  route: >-
    من تبليسي اسلك الطريق السريع E60/S1 غرباً: أنفاق ريكوتي، ثم التفافية كوتايسي، فالساحل عبر كوبوليتي
    — نحو 375 كم و5:30 ساعة قيادة، أسفلت على طول الطريق ومحطات وقود في كل مكان. في باتومي يقع التمثال
    عند الطرف الشمالي للكورنيش قرب حديقة العجائب؛ اجعل برج الأبجدية دليلك. اركن في المواقف المدفوعة حول
    الحديقة أو في الشوارع القريبة، واحسب دقائق إضافية في زحمة المساء. سيارة اقتصادية تكفي تماماً.
