ka:
  name: ბეთლემის უბანი და კიბეები
  short: >-
    ქუჩა, რომელიც ნარიყალას ძირში ქვის კიბედ იქცევა: ორი ბეთლემის ეკლესია, სასანიანთა ხანის ცეცხლის ტაძარი
    და ძველ თბილისზე გაფენილი თეთრეული.
  body: >-
    **ბეთლემში ქუჩა ნებდება და კიბედ იქცევა.** უბანი ნარიყალას ქვემოთ, სოლოლაკის ქედის ფერდზეა შეფენილი
    — ადგილი ისე კლდოვანია, რომ მას კლდისუბანსაც ეძახიან, — მისი ხერხემალი კი ბეთლემის აღმართია: ქვის
    კიბე, რომელსაც ძველი თბილისელები დღემდე ფეთხაინის კიბეს უწოდებენ. მისი პროექტი 1850 წელს შედგა; მანამდე
    აქ მხოლოდ ბილიკი იყო.


    ლადო ასათიანის ქუჩიდან ადიხართ და ქალაქი თანდათან უკან რჩება: ჯერ მანქანების ხმა ქრება, მერე კაფეებისა,
    ბოლოს კი მხოლოდ ხის აივნები, თოკზე გაფენილი თეთრეული, თბილ საფეხურებზე მიწოლილი კატები და პირდაპირ
    კიბეზე გამავალი კარებია. ზოგი სახლი ახლახან აღადგინეს, ზოგი ჯერ ისევ ხის საყრდენებს ეყრდნობა. აქ ხალხი
    ცხოვრობს და ეს ყველაფერში ეტყობა.


    კიბის შუაწელზე ქვემო ბეთლემი დგას — 1725–1727 წლებში ირანიდან გადმოსახლებულმა სომხებმა წმინდა სტეფანეს
    სახელზე ააგეს, 1868 წელს კი გუმბათიან ტაძრად გადააკეთეს. კიბის თავში, აგურის ბაქანზე, ზემო ბეთლემი
    აღმართულია: სომხური ღვთისმშობლის ეკლესია, 1884 წელს ახალი გუმბათით დაგვირგვინებული. გადმოცემით, ამ
    ადგილას პირველი ეკლესია ვახტანგ გორგასალმა ააგო; ამბობენ, აქვე განისვენებენ მისი დედა და და. 1795
    წელს აღა-მაჰმად-ხანმა მოაკვლევინა დეკანოზი მხითარი, რომელმაც ეკლესიის განძის სამალავი არ გასცა. ორივე
    ტაძარი საქართველოს მართლმადიდებელ ეკლესიას გადაეცა — ქვემო 1988 წელს, ზემო 1994 წელს, — 1990-იანი
    წლების დასაწყისში კი მათი სომხური წარწერები, ჯვრები და ხაჩქარები მოხსნეს ან გაანადგურეს.


    ასიოდე მეტრით აღმოსავლეთით, მრუდე გამჭვირვალე სახურავის ქვეშ, ათეშგა დგას — აგურის ცეცხლის ტაძარი,
    რომელსაც, როგორც წესი, სასანიანთა ხანით ათარიღებენ და მსოფლიოში ყველაზე ჩრდილოეთით მდებარე ზოროასტრულ
    ტაძრად მოიხსენიებენ.


    ყველაფერს ზემოდან ქართლის დედა გადმოჰყურებს. მის ფერხთით ბეთლემი თუნუქის სახურავების ქაოსად იქცევა,
    თქვენ მიერ გავლილი კიბე კი მათ შორის უკვალოდ ქრება.
  tip: >-
    გაჩერებებით საათნახევარი გაითვალისწინეთ. ეს ნამდვილი აღმართია: საფეხურები გრძელი და უსწორმასწოროა,
    მოაჯირი ხან არის, ხან — არა, ჩრდილი კი ცოტაა; ზაფხულში დილით ადრე ან საღამოს ადით და წყალი თან იქონიეთ.
    ინვალიდის ეტლით შეუძლებელია, ბავშვის ეტლით — ტანჯვა. ყოველი კარის მიღმა ხალხი ცხოვრობს: ეზოებში ნუ
    შეხვალთ და ფანჯრებში ნუ გადაიღებთ. ათეშგა, როგორც წესი, დაკეტილია და ქუჩიდან ათვალიერებენ. ტუალეტი
    და კაფეები მხოლოდ ქვემოთ, აბანოთუბანსა და ასათიანის ქუჩაზეა. ზემო ბეთლემის წინ ტერასა უფასო სადამკვირვებლო
    წერტილია — ძველი ქალაქის სახურავებით, მეტეხითა და სამებით.
  route: >-
    ბეთლემში მანქანით ასვლას ნუ ეცდებით: ქუჩის ნაწილი კიბეა, დანარჩენზე კი ორი მანქანა ვერ ცილდება. თავისუფლების
    მოედნიდან კიბის ძირამდე დაახლოებით 3 კილომეტრი და თხუთმეტი წუთია. მანქანა გორგასლის მოედნის ფასიან
    ავტოსადგომზე დატოვეთ, ან რიყის პარკში, მდინარის გაღმა — იქიდან ხიდით თორმეტი-თხუთმეტი წუთის სავალია.
    ლადო ასათიანის ქუჩაზე ფასიანი ადგილებია, მაგრამ დღისით თითქმის ყოველთვის დაკავებულია. ყველაზე ჭკვიანური
    გზა: მანქანა რიყის პარკში დააყენეთ, საბაგიროთი ნარიყალამდე ადით, ქედს ქართლის დედამდე გაუყევით და
    ბეთლემის კიბით ჩამოდით — აღმართი ასე საერთოდ აღარ შეგხვდებათ. ნებისმიერი ეკონომკლასის მანქანა გამოდგება.
en:
  name: Betlemi Quarter and the Stairs
  short: >-
    A street that turns into a stone stair below Narikala: two Bethlehem churches, a Sasanian-era fire
    temple and washing lines over old Tbilisi.
  body: >-
    **In Betlemi the street gives up and becomes a staircase.** The quarter clings to the Sololaki ridge
    below Narikala, on ground so rocky that it is also called Kldisubani, the Rock District, and its spine
    is the Betlemi Rise: a stone stair that old Tbilisians still call the Petkhaini stairs. It was designed
    in 1850; before that there was only a path.


    Climb from Lado Asatiani Street and the city falls away behind you: first the traffic, then the cafés,
    until there are only wooden balconies, washing lines, cats on warm steps and doors opening straight
    onto the stairs. Some houses are freshly restored; others still lean on timber props. People live
    here, and it shows.


    Halfway up stands Lower Betlemi, built in 1725–1727 by Armenians resettled from Iran as the church
    of St Stephen and rebuilt with a dome in 1868. At the head of the stair, Upper Betlemi rises on its
    brick platform: an Armenian church of the Virgin, crowned with its present dome in 1884. Tradition
    says Vakhtang Gorgasali raised the first church on this spot and buried his mother and sister here.
    In 1795 Agha Mohammad Khan had the archpriest Mkhitar killed for refusing to reveal where the church
    treasures were hidden. Both churches passed to the Georgian Orthodox Church, the lower in 1988 and
    the upper in 1994, and in the early 1990s their Armenian inscriptions, crosses and khachkars were
    stripped out or destroyed.


    A hundred metres east, under a curved perspex roof, stands the Ateshgah: a brick fire temple generally
    dated to the Sasanian era and described as the northernmost Zoroastrian temple in the world.


    Above it all stands Kartlis Deda, the Mother of Georgia. From her feet Betlemi is a tumble of tin
    roofs, and the stair you climbed vanishes into them.
  tip: >-
    Allow an hour and a half with stops. This is a real climb: the steps are long and uneven, handrails
    come and go, and there is little shade — in summer go early or late and carry water. It is impossible
    with a wheelchair and miserable with a pushchair. People live behind every door: do not wander into
    courtyards or photograph through windows. The Ateshgah is normally locked and seen from the lane.
    Toilets and cafés are only down in Abanotubani and along Asatiani. The terrace in front of Upper Betlemi
    is a free viewpoint over the old town towards Metekhi and Sameba.
  route: >-
    Do not try to drive into Betlemi: part of the street is stairs and the rest is too narrow for two
    cars. It is about 3 km and fifteen minutes from Freedom Square to the bottom of the stair. Leave the
    car at the paid car park on Gorgasali Square, or at Rike Park across the river, twelve to fifteen
    minutes' walk over the bridge. Lado Asatiani Street has metered bays, but they are almost always full
    by day. The cleverest option: park at Rike Park, take the cable car up to Narikala, walk along the
    ridge to Kartlis Deda and come down the Betlemi stairs, so the climb never happens. Any economy car
    will do.
ru:
  name: Квартал Бетлеми и лестница
  short: >-
    Улица, которая под Нарикалой становится каменной лестницей: две Вифлеемские церкви, храм огня сасанидской
    эпохи и бельё над старым Тбилиси.
  body: >-
    **В Бетлеми улица сдаётся и превращается в лестницу.** Квартал цепляется за хребет Сололаки под Нарикалой,
    на такой каменистой земле, что его называют ещё Клдисубани — Скальным кварталом. Его главная ось —
    Бетлемский подъём, каменная лестница, которую старые тбилисцы до сих пор зовут Петхаинской. Её спроектировали
    в 1850 году; до того здесь была только тропа.


    Поднимайтесь от улицы Ладо Асатиани, и город отступает у вас за спиной: сначала машины, потом кафе,
    пока не останутся лишь деревянные балконы, бельё на верёвках, кошки на тёплых ступенях и двери, открывающиеся
    прямо на лестницу. Одни дома недавно отреставрированы, другие всё ещё держатся на деревянных подпорках.
    Здесь живут люди, и это видно.


    На полпути стоит Нижний Бетлеми: его построили в 1725–1727 годах армяне, переселённые из Ирана, как
    церковь Святого Стефана, а в 1868 году перестроили и увенчали куполом. Наверху лестницы на кирпичной
    платформе поднимается Верхний Бетлеми — армянская церковь Богородицы, получившая свой нынешний купол
    в 1884 году. Предание гласит, что первую церковь на этом месте возвёл Вахтанг Горгасали и что здесь
    он похоронил мать и сестру. В 1795 году Ага-Мохаммед-хан велел убить протоиерея Мхитара, отказавшегося
    открыть, где спрятаны церковные сокровища. Обе церкви перешли к Грузинской православной церкви — нижняя
    в 1988-м, верхняя в 1994 году, — и в начале 1990-х их армянские надписи, кресты и хачкары были сбиты
    или уничтожены.


    В сотне метров к востоку, под изогнутой крышей из оргстекла, стоит Атешга — кирпичный храм огня, который
    обычно относят к сасанидской эпохе и называют самым северным зороастрийским храмом в мире.


    Надо всем этим стоит Картлис Деда, Мать Грузии. От её ног Бетлеми — россыпь жестяных крыш, и лестница,
    по которой вы поднялись, тонет в них.
  tip: >-
    С остановками закладывайте полтора часа. Это настоящий подъём: ступени длинные и неровные, перила
    то есть, то нет, тени мало — летом идите рано утром или ближе к вечеру и берите воду. С инвалидной
    коляской пройти невозможно, с детской — мучительно. За каждой дверью живут люди: не заходите во дворы
    и не фотографируйте через окна. Атешга обычно заперта, её осматривают с переулка. Туалеты и кафе —
    только внизу, в Абанотубани и на Асатиани. Терраса перед Верхним Бетлеми — бесплатная смотровая площадка
    над старым городом с видом на Метехи и Самебу.
  route: >-
    Не пытайтесь въехать в Бетлеми на машине: часть улицы — лестница, а остальное слишком узко для двух
    автомобилей. От площади Свободы до подножия лестницы около 3 км и пятнадцать минут. Оставьте машину
    на платной стоянке на площади Горгасали или в парке Рике на другом берегу — оттуда двенадцать-пятнадцать
    минут пешком через мост. На улице Ладо Асатиани есть платные места, но днём они почти всегда заняты.
    Самый хитрый вариант: припаркуйтесь у парка Рике, поднимитесь канатной дорогой к Нарикале, пройдите
    по хребту к Картлис Деда и спуститесь по лестнице Бетлеми — тогда подниматься не придётся вовсе. Подойдёт
    любая машина экономкласса.
fa:
  name: محلهٔ بتلمی و پلکان آن
  short: >-
    خیابانی که زیر ناریکالا به پلکانی سنگی بدل می‌شود: دو کلیسای بیت‌لحم، آتشکده‌ای از دوران ساسانی و
    بندهای رخت بر فراز تفلیس قدیم.
  body: >-
    **در بتلمی خیابان کوتاه می‌آید و به پلکان بدل می‌شود.** این محله به یال سولولاکی زیر ناریکالا چسبیده
    است، بر زمینی چنان سنگلاخ که آن را کلدیسوبانی، یعنی محلهٔ صخره، هم می‌نامند. ستون فقراتش سربالایی
    بتلمی است: پلکانی سنگی که تفلیسی‌های قدیمی هنوز آن را پلکان پتخاینی می‌خوانند. در ۱۸۵۰ طراحی شد؛ پیش
    از آن تنها یک کوره‌راه بود.


    از خیابان لادو آساتیانی بالا بروید تا شهر پشت سرتان کنار برود: نخست رفت‌وآمد خودروها، سپس کافه‌ها،
    تا جایی که فقط بالکن‌های چوبی می‌ماند، بندهای رخت، گربه‌هایی روی پله‌های گرم و درهایی که یکراست رو
    به پلکان باز می‌شوند. برخی خانه‌ها تازه مرمت شده‌اند؛ برخی دیگر هنوز به شمع‌های چوبی تکیه داده‌اند.
    اینجا مردم زندگی می‌کنند و این پیداست.


    در میانهٔ راه بتلمی پایین ایستاده است، که ارمنیان کوچانده‌شده از ایران آن را در ۱۷۲۵–۱۷۲۷ به نام کلیسای
    استپانوس قدیس ساختند و در ۱۸۶۸ با گنبدی بازسازی شد. در سرِ پلکان، بتلمی بالا بر سکوی آجری‌اش برمی‌خیزد:
    کلیسایی ارمنی به نام مریم مقدس، که گنبد کنونی‌اش را در ۱۸۸۴ بر سر گذاشت. روایت است که واختانگ گورگاسالی
    نخستین کلیسا را در همین نقطه برپا کرد و مادر و خواهرش را اینجا به خاک سپرد. در ۱۷۹۵ آقامحمدخان سرکشیش
    مخیتار را، که از فاش کردن جای گنجینه‌های کلیسا سر باز زد، به قتل رساند. هر دو کلیسا به کلیسای ارتدوکس
    گرجستان رسیدند، پایینی در ۱۹۸۸ و بالایی در ۱۹۹۴، و در اوایل دههٔ ۱۹۹۰ کتیبه‌ها، صلیب‌ها و خاچکارهای
    ارمنی‌شان کنده یا نابود شد.


    صد متر آن‌سوتر به سوی شرق، زیر سقفی خمیده از پِرسپِکس، آتشگاه ایستاده است: آتشکده‌ای آجری که معمولاً
    آن را از دوران ساسانی می‌دانند و شمالی‌ترین آتشکدهٔ زرتشتی جهان توصیفش می‌کنند.


    بالای همهٔ این‌ها کارتلیس دِدا، مادر گرجستان، ایستاده است. از پای او بتلمی توده‌ای درهم از بام‌های
    حلبی است و پلکانی که از آن بالا آمدید در میانشان گم می‌شود.
  tip: >-
    با توقف‌ها یک ساعت و نیم وقت بگذارید. این صعودی واقعی است: پله‌ها بلند و ناهموارند، نرده‌ها گاه هستند
    و گاه نیستند، و سایه اندک است؛ تابستان صبح زود یا عصر بروید و آب همراه داشته باشید. با ویلچر ناممکن
    و با کالسکه عذاب‌آور است. پشت هر دری کسی زندگی می‌کند: به حیاط‌ها سرک نکشید و از پنجره‌ها عکس نگیرید.
    آتشگاه معمولاً قفل است و از کوچه دیده می‌شود. سرویس بهداشتی و کافه فقط پایین‌تر، در آبانوتوبانی و
    خیابان آساتیانی، هست. مهتابیِ جلوی بتلمی بالا دیدگاهی رایگان بر شهر قدیم است، رو به متخی و کلیسای
    جامع سامه‌با (تثلیث مقدس).
  route: >-
    سعی نکنید با خودرو وارد بتلمی شوید: بخشی از خیابان پله است و باقی آن برای دو خودرو بیش از حد تنگ.
    از میدان آزادی تا پای پلکان حدود ۳ کیلومتر و پانزده دقیقه راه است. خودرو را در پارکینگ پولی میدان
    گورگاسالی بگذارید، یا در پارک ریکه آن سوی رود، که از آنجا تا پلکان دوازده تا پانزده دقیقه پیاده‌روی
    از روی پل است. خیابان لادو آساتیانی جای پارک پولی دارد، اما روزها تقریباً همیشه پر است. زیرکانه‌ترین
    راه: در پارک ریکه پارک کنید، با تله‌کابین تا ناریکالا بالا بروید، از روی یال تا کارتلیس دِدا قدم بزنید
    و از پلکان بتلمی پایین بیایید؛ این‌طور هرگز سربالایی نمی‌روید. هر خودروی اقتصادی کار را راه می‌اندازد.
he:
  name: רובע בטלמי והמדרגות
  short: >-
    רחוב שהופך לגרם מדרגות אבן מתחת לנריקאלה: שתי כנסיות בית לחם, מקדש אש מן התקופה הסאסאנית וחבלי כביסה
    מעל טביליסי העתיקה.
  body: >-
    **בבטלמי הרחוב מתייאש והופך לגרם מדרגות.** הרובע נאחז ברכס סולולאקי מתחת לנריקאלה, על קרקע סלעית כל
    כך שהוא נקרא גם קלדיסובאני, רובע הסלע. עמוד השדרה שלו הוא מעלה בטלמי: גרם מדרגות אבן שוותיקי טביליסי
    עדיין קוראים לו מדרגות פטחאיני. הוא תוכנן ב-1850; לפני כן היה כאן רק שביל.


    טפסו מרחוב לאדו אסאטיאני, והעיר נסוגה מאחוריכם: קודם התנועה, אחר כך בתי הקפה, עד שנשארים רק מרפסות
    עץ, חבלי כביסה, חתולים על מדרגות חמימות ודלתות שנפתחות היישר אל המדרגות. חלק מן הבתים שוחזרו זה עתה;
    אחרים עדיין נשענים על תמוכות עץ. אנשים גרים כאן, וזה ניכר.


    באמצע העלייה עומדת בטלמי התחתונה, שנבנתה ב-1725–1727 בידי ארמנים שיושבו מחדש מאיראן, ככנסיית סטפנוס
    הקדוש, ונבנתה מחדש עם כיפה ב-1868. בראש המדרגות מתנשאת בטלמי העליונה על במת הלבנים שלה: כנסייה ארמנית
    על שם מרים הבתולה, שכיפתה הנוכחית הוצבה ב-1884. לפי המסורת, וחטנג גורגסאלי הקים את הכנסייה הראשונה
    במקום הזה וקבר כאן את אמו ואת אחותו. ב-1795 הורה אגא מוחמד חאן להרוג את הכומר הראשי מחיתר, שסירב לגלות
    היכן הוסתרו אוצרות הכנסייה. שתי הכנסיות עברו לכנסייה האורתודוקסית הגאורגית, התחתונה ב-1988 והעליונה
    ב-1994, ובתחילת שנות ה-90 הוסרו או הושמדו הכתובות, הצלבים והחצ'קרים הארמניים שלהן.


    כמאה מטר מזרחה, מתחת לגג מקומר מפרספקס, עומד האטשגה: מקדש אש מלבנים, המתוארך בדרך כלל לתקופה הסאסאנית
    ומתואר כמקדש הזורואסטרי הצפוני ביותר בעולם.


    מעל הכול עומדת קרתליס דדה, אם גאורגיה. ממרגלותיה נראית בטלמי כערימה של גגות פח, והמדרגות שטיפסתם בהן
    נבלעות בתוכם.
  tip: >-
    הקציבו שעה וחצי עם עצירות. זו עלייה של ממש: המדרגות ארוכות ולא אחידות, מעקות מופיעים ונעלמים, ויש
    מעט צל — בקיץ לכו מוקדם או מאוחר והביאו מים. עם כיסא גלגלים זה בלתי אפשרי, ועם עגלת תינוק זה סיוט.
    מאחורי כל דלת גרים אנשים: אל תיכנסו לחצרות ואל תצלמו דרך חלונות. האטשגה נעול בדרך כלל ורואים אותו
    מן הסמטה. שירותים ובתי קפה יש רק למטה, באבנותובאני ולאורך אסאטיאני. המרפסת שמול בטלמי העליונה היא
    נקודת תצפית חינמית על העיר העתיקה, לעבר מטחי וקתדרלת השילוש הקדוש (סמבה).
  route: >-
    אל תנסו להיכנס לבטלמי ברכב: חלק מן הרחוב הוא מדרגות, והשאר צר מדי לשתי מכוניות. מכיכר החירות עד תחתית
    המדרגות כ-3 ק״מ ורבע שעה. השאירו את הרכב בחניון בתשלום בכיכר גורגסאלי, או בפארק ריקה שמעבר לנהר, שתים-עשרה
    עד חמש-עשרה דקות הליכה על הגשר. ברחוב לאדו אסאטיאני יש חניות בתשלום, אבל ביום הן כמעט תמיד מלאות.
    האפשרות החכמה ביותר: חנו בפארק ריקה, עלו ברכבל לנריקאלה, לכו לאורך הרכס עד קרתליס דדה ורדו במדרגות
    בטלמי, וכך לא תצטרכו לטפס כלל. כל רכב חסכוני יתאים.
ar:
  name: حي بتليمي ودرجه
  short: >-
    شارع يتحول تحت ناريكالا إلى درج حجري: كنيستا بيت لحم، ومعبد نار من العصر الساساني، وحبال غسيل فوق
    تبليسي القديمة.
  body: >-
    **في بتليمي يستسلم الشارع ويصير درجاً.** يتشبث الحي بسلسلة سولولاكي تحت ناريكالا، على أرض صخرية إلى
    حد أنه يُسمّى أيضاً كلديسوباني، أي حي الصخر. وعموده الفقري مطلع بتليمي: درج حجري ما زال أهل تبليسي
    القدامى يسمّونه درج بيتخايني. صُمّم عام 1850، ولم يكن قبله سوى ممر ترابي.


    اصعد من شارع لادو أساتياني، فتنحسر المدينة خلفك: السيارات أولاً، ثم المقاهي، حتى لا يبقى سوى الشرفات
    الخشبية وحبال الغسيل والقطط على الدرجات الدافئة وأبواب تنفتح مباشرة على الدرج. بعض البيوت رُمّم حديثاً،
    وبعضها ما زال مستنداً إلى دعائم خشبية. هنا يعيش الناس، وذلك واضح.


    في منتصف الصعود تقوم بتليمي السفلى، التي بناها بين 1725 و1727 أرمن أُعيد توطينهم من إيران كنيسةً للقديس
    إسطفانوس، ثم أُعيد بناؤها بقبة عام 1868. وفي أعلى الدرج ترتفع بتليمي العليا على منصتها الآجرّية: كنيسة
    أرمنية للسيدة العذراء، تُوّجت بقبتها الحالية عام 1884. ويُروى أن فاختانغ غورغاسالي أقام أول كنيسة
    في هذا الموضع ودفن فيه أمه وأخته. وفي عام 1795 أمر آغا محمد خان بقتل كبير الكهنة مخيتار لأنه رفض أن
    يكشف مخبأ كنوز الكنيسة. وانتقلت الكنيستان كلتاهما إلى الكنيسة الأرثوذكسية الجورجية، السفلى عام 1988
    والعليا عام 1994، وفي مطلع التسعينيات نُزعت نقوشهما الأرمنية وصلبانهما وأحجار الخاتشكار أو دُمّرت.


    وعلى بعد مئة متر إلى الشرق، تحت سقف مقوّس من البرسبكس، يقوم آتشكاه: معبد نار من الآجر يُؤرَّخ عموماً
    بالعصر الساساني ويوصف بأنه أقصى معبد زرادشتي شمالاً في العالم.


    وفوق ذلك كله تقف كارتليس ديدا، أم جورجيا. من عند قدميها تبدو بتليمي ركاماً من أسطح الصفيح، ويختفي
    بينها الدرج الذي صعدته.
  tip: >-
    خصص ساعة ونصفاً مع التوقفات. إنه صعود حقيقي: الدرجات طويلة وغير منتظمة، والدرابزين يظهر ويختفي، والظل
    قليل؛ ففي الصيف اذهب باكراً أو في آخر النهار واحمل الماء. الصعود مستحيل بالكرسي المتحرك، ومرهق جداً
    بعربة الأطفال. خلف كل باب يعيش أناس: لا تدخل الأفنية ولا تصوّر عبر النوافذ. آتشكاه مغلق عادة ويُشاهَد
    من الزقاق. دورات المياه والمقاهي في الأسفل فقط، في أبانوتوباني وعلى امتداد شارع أساتياني. والمصطبة
    أمام بتليمي العليا مطل مجاني على المدينة القديمة نحو ميتيخي وكاتدرائية ساميبا (الثالوث المقدس).
  route: >-
    لا تحاول دخول بتليمي بالسيارة: جزء من الشارع درج، والباقي أضيق من أن تمر فيه سيارتان. من ساحة الحرية
    إلى أسفل الدرج نحو 3 كم وخمس عشرة دقيقة. اترك السيارة في الموقف المدفوع في ساحة غورغاسالي، أو في حديقة
    ريكي على الضفة الأخرى من النهر، على بعد اثنتي عشرة إلى خمس عشرة دقيقة سيراً عبر الجسر. في شارع لادو
    أساتياني مواقف بعدّادات، لكنها ممتلئة نهاراً في أغلب الأحيان. والخيار الأذكى: اركن في حديقة ريكي،
    واصعد بالتلفريك إلى ناريكالا، وامشِ على امتداد السلسلة حتى كارتليس ديدا، ثم انزل درج بتليمي، فلا تصعده
    أبداً. أي سيارة اقتصادية تفي بالغرض.
