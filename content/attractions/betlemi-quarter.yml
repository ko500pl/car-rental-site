ka:
  name: ბეთლემის უბანი და კიბეები
  short: სოლოლაკის ქედის კალთაზე ასული საფეხმავლო უბანი კიბეებით, ორი ეკლესიით და ძველი ცეცხლთაყვანისმცემლების
    ტაძრით.
  body: >-
    **ბეთლემი ის ნაწილია ძველი თბილისისა, სადაც მანქანა ვერ ადის.** უბანი — მას კლდისუბანსაც უწოდებენ
    — ნარიყალას ქვემოთ, ციცაბო კალთაზეა გაშენებული, და მისი მთავარი „ქუჩა" სინამდვილეში გრძელი ქვის კიბეა,
    რომელიც ასათიანის ქუჩიდან ზემოთ ადის.


    კიბეზე ასვლისას თანდათან იცვლება ქალაქის ხმა: ჯერ ქრება ავტომობილები, შემდეგ ტურისტული კაფეები, და
    რჩება მხოლოდ აივნები, თოკზე გაფენილი თეთრეული და კატები. სახლების ნაწილი აღდგენილია, ნაწილი ჯერ კიდევ
    ბოძებით არის შეკავებული — ეს ცოცხალი, საცხოვრებელი უბანია და არა მუზეუმი.


    კიბის თავში ორი ეკლესიაა: ზემო და ქვემო ბეთლემი. ორივე თავდაპირველად სომხური ტაძარი იყო და ორივე 1990-იან
    წლებში ქართულ მართლმადიდებლურ ეკლესიას გადაეცა. ზემო ბეთლემის წინ პატარა ტერასაა — ალბათ საუკეთესო
    უფასო ხედი ძველი ქალაქის სახურავებზე, მეტეხზე და სამებაზე.


    იქვე, გომის ქუჩაზე, დგას ათეშგა — აგურის ნაგებობა, რომელიც ცეცხლთაყვანისმცემელთა ტაძრად ითვლება. მისი
    თარიღი სადავოა: ბირთვი შესაძლოა გვიან ანტიკურ ხანას უკავშირდებოდეს, დღევანდელი კონსტრუქცია კი ბევრად
    გვიანდელია. ის რეგიონში შემორჩენილ ერთეულ ასეთ ნაგებობათა შორისაა. შენობა ჩვეულებრივ დაკეტილია და
    გარედან, ეზოდან ათვალიერებენ.


    ბეთლემიდან ბილიკი პირდაპირ ნარიყალას კედლებამდე და ბოტანიკური ბაღის ზედა შესასვლელამდე მიდის.


    ბეთლემის ზემოთ, სოლოლაკის ქედის თხემზე, დგას „ქართლის დედა" — ოცმეტრიანი ალუმინის ქანდაკება, რომელიც
    1958 წელს ქალაქის ათასხუთასი წლისთავზე დაიდგა და რომლის ავტორიც ელგუჯა ამაშუკელია. ქალი ერთ ხელში
    ღვინის თასს უჭირავს, მეორეში ხმალს: სტუმრისთვის ღვინო, მტრისთვის იარაღი. ბეთლემიდან მასთან ბილიკი
    ოცი წუთის სავალია და გზა ნარიყალას კედლებზე გადის.
  tip: >-
    დაახლოებით საათნახევარი, ხედებით და გაჩერებებით. ეს რეალური აღმართია: კიბე გრძელია, საფეხურები არათანაბარი
    და მოაჯირი ყველგან არ არის — გულის ან მუხლის პრობლემის შემთხვევაში კარგად აწონე. ზაფხულში შუადღისას
    ავიდე მხოლოდ იმ შემთხვევაში, თუ წყალი გაქვს; ჩრდილი მცირეა. ეტლით შეუძლებელია. აქ ხალხი ცხოვრობს —
    ეზოებში შესვლა და ფანჯრებში ფოტოს გადაღება უხერხულია. ტუალეტი და კაფეები მხოლოდ ქვემოთ, აბანოთუბანშია.
  route: >-
    მანქანით ბეთლემში ასვლა არ გამოვა — ქუჩების ნაწილი კიბეა და დანარჩენში ორი მანქანა ვერ ცილდება. დატოვე
    ავტომობილი ქვემოთ: ყველაზე მოსახერხებელია გორგასლის მოედნის ანაზღაურებადი პარკინგი ან რიყის პარკის
    სადგომი მდინარის მეორე მხარეს, საიდანაც ხიდის გავლით 12-15 წუთია. სოლოლაკის მხრიდან ასვლის შემთხვევაში
    ლადო ასათიანის ქუჩაზე ზონალური ადგილებია, თუმცა დღისით თითქმის ყოველთვის დაკავებული. ალტერნატივა:
    ავიდე საბაგიროთი ნარიყალამდე და ჩამოდი ბეთლემის კიბეებით — ასე აღმართი საერთოდ აღარ გჭირდება.
en:
  name: Betlemi Quarter and the Stairs
  short: >-
    A pedestrian quarter climbing the ridge below Narikala, with stone stairs, two churches and an old
    fire temple.
  body: >-
    **Betlemi is the part of old Tbilisi that cars cannot reach.** The quarter — also called Kldisubani,
    the cliff district — is built on the steep slope below Narikala, and its main thoroughfare is in fact
    a long flight of stone steps climbing from Asatiani Street.


    As you climb, the sound of the city changes in stages: first the traffic disappears, then the tourist
    cafes, and what is left is balconies, washing lines and cats. Some houses have been restored; others
    are still held up by timber props. This is a lived-in neighbourhood, not an open-air museum, and it
    has the untidiness that goes with that.


    At the top of the steps stand two churches, Upper and Lower Betlemi. Both were originally Armenian
    churches and both were transferred to the Georgian Orthodox Church in the 1990s. In front of Upper
    Betlemi is a small terrace — probably the best free view in the city over the roofs of the old town
    towards Metekhi and Sameba.


    Nearby, on Gomi Street, stands the Ateshgah, a brick structure understood to be a Zoroastrian fire
    temple. Its date is disputed: the core may go back to late antiquity, while what you see is considerably
    later rebuilding. It is one of very few such buildings left anywhere in the region. It is normally
    locked, and visitors look at it from the yard outside.


    From Betlemi a path continues straight up to the walls of Narikala and to the upper gate of the Botanical
    Garden.


    Above Betlemi, on the crest of the Sololaki ridge, stands Kartlis Deda, the Mother of Georgia: a twenty-metre
    aluminium figure put up in 1958 for the city's fifteen-hundredth anniversary, by the sculptor Elguja
    Amashukeli. She holds a bowl of wine in one hand and a sword in the other — wine for a guest, steel
    for an enemy. From Betlemi the path to her takes about twenty minutes and runs along the walls of
    Narikala, which makes the obvious way to finish the climb.
  tip: >-
    Allow about an hour and a half with stops. This is a genuine climb: the stairs are long, the treads
    uneven and handrails intermittent, so weigh it up if knees or heart are an issue. In summer do the
    ascent early or late and carry water; there is very little shade. It is impossible with a wheelchair
    and awkward with a pushchair. People live here — walking into courtyards or photographing through
    windows is not welcome. Toilets and cafes are only down in Abanotubani.
  route: >-
    You cannot drive up into Betlemi: parts of the street are stairs and the rest is too narrow for two
    cars to pass. Leave the car below. The easiest options are the paid parking at Gorgasali Square or
    the car park in Rike Park across the river, twelve to fifteen minutes' walk away over the bridge.
    Coming from the Sololaki side there are metered bays on Lado Asatiani Street, though they are almost
    always taken during the day. A good alternative: take the cable car up to Narikala and walk down the
    Betlemi stairs, which removes the climb entirely.
ru:
  name: Квартал Бетлеми и лестницы
  short: 'Пешеходный квартал на склоне под Нарикалой: каменные лестницы, две церкви и старый храм огнепоклонников.'
  body: >-
    **Бетлеми — та часть старого Тбилиси, куда не заезжает машина.** Квартал, который называют ещё Клдисубани,
    «скальным», выстроен на крутом склоне под Нарикалой, и его главная «улица» на самом деле длинная каменная
    лестница, поднимающаяся от улицы Асатиани.


    По мере подъёма звук города меняется ступенями: сначала пропадает транспорт, потом туристические кафе,
    и остаются балконы, верёвки с бельём и кошки. Часть домов отреставрирована, часть до сих пор держится
    на деревянных подпорках. Это обжитой район, а не музей под открытым небом, со всей сопутствующей неопрятностью.


    Наверху лестницы стоят две церкви — Верхняя и Нижняя Бетлеми. Обе изначально были армянскими и обе
    в 1990-х перешли Грузинской православной церкви. Перед Верхней Бетлеми небольшая терраса: пожалуй,
    лучший бесплатный вид в городе на крыши старого Тбилиси в сторону Метехи и Самеба.


    Рядом, на улице Гоми, стоит Атешга — кирпичное сооружение, которое считают зороастрийским храмом огня.
    Датировка спорна: ядро может восходить к поздней античности, а видимая конструкция заметно позднее.
    Это одна из очень немногих подобных построек, сохранившихся в регионе. Обычно она заперта, и её осматривают
    со двора.


    От Бетлеми тропа выводит прямо к стенам Нарикалы и к верхнему входу в Ботанический сад.


    Выше Бетлеми, на гребне Сололакского хребта, стоит «Мать Картли» — двадцатиметровая алюминиевая фигура,
    установленная в 1958 году к полуторатысячелетию города скульптором Элгуджей Амашукели. В одной руке
    у неё чаша вина, в другой меч: вино гостю, сталь врагу. От Бетлеми к ней двадцать минут по тропе вдоль
    стен Нарикалы, и это очевидное продолжение подъёма.
  tip: >-
    Закладывайте примерно полтора часа с остановками. Это настоящий подъём: лестница длинная, ступени
    неровные, перила есть не везде — взвесьте, если беспокоят колени или сердце. Летом поднимайтесь рано
    или под вечер и берите воду, тени почти нет. В кресле-коляске невозможно, с детской коляской неудобно.
    Здесь живут люди: заходить во дворы и снимать в окна не стоит. Туалеты и кафе только внизу, в Абанотубани.
  route: >-
    Заехать в Бетлеми нельзя: часть улицы — лестница, остальное слишком узко для разъезда. Оставляйте
    машину внизу. Проще всего платная парковка у площади Горгасали или стоянка в парке Рике на другом
    берегу, откуда через мост двенадцать-пятнадцать минут пешком. Со стороны Сололаки есть размеченные
    места на улице Ладо Асатиани, но днём они почти всегда заняты. Хороший вариант: подняться канатной
    дорогой на Нарикалу и спуститься по лестницам Бетлеми — тогда подъём не нужен вовсе.
fa:
  name: محلهٔ بتلمی و پلکان‌های آن
  short: محله‌ای پیاده بر شیب زیر ناریکالا، با پلکان سنگی، دو کلیسا و آتشکده‌ای کهن.
  body: >-
    **بتلمی آن بخش از تفلیس قدیم است که خودرو به آن نمی‌رسد.** این محله که کلدیسوبانی یا محلهٔ صخره هم
    نامیده می‌شود بر شیب تند زیر ناریکالا ساخته شده، و خیابان اصلی‌اش در واقع پلکانی بلند از سنگ است که
    از خیابان آساتیانی بالا می‌رود.


    هرچه بالاتر می‌روید، صدای شهر مرحله‌به‌مرحله عوض می‌شود: نخست خودروها محو می‌شوند، بعد کافه‌های گردشگری،
    و آنچه می‌ماند بالکن‌ها و بندهای رخت و گربه‌هاست. برخی خانه‌ها مرمت شده‌اند و برخی هنوز با شمع‌های
    چوبی سرپا نگه داشته می‌شوند. اینجا محله‌ای است که در آن زندگی می‌کنند، نه موزه‌ای روباز.


    در بالای پلکان دو کلیسا ایستاده‌اند: بتلمی بالا و بتلمی پایین. هر دو در اصل کلیسای ارمنی بودند و هر
    دو در دههٔ ۱۹۹۰ به کلیسای ارتدکس گرجی واگذار شدند. جلوی بتلمی بالا مهتابی کوچکی هست؛ شاید بهترین منظرهٔ
    رایگان شهر بر بام‌های شهر قدیم به سوی متخی و سامبا.


    نزدیک آن، در کوچهٔ گومی، آتشگاه ایستاده است؛ بنایی آجری که آن را آتشکدهٔ زرتشتی می‌دانند. تاریخش محل
    بحث است: هستهٔ آن شاید به اواخر دوران باستان برسد، اما آنچه می‌بینید بازسازی بسیار متأخرتری است. از
    معدود بناهای بازمانده از این دست در سراسر منطقه است. معمولاً قفل است و بازدیدکنندگان از حیاط بیرون
    به آن نگاه می‌کنند.


    از بتلمی راهی مستقیم به دیوارهای ناریکالا و دروازهٔ بالایی باغ گیاه‌شناسی می‌رود.


    بالای بتلمی، بر ستیغ سولولاکی، مجسمهٔ «مادر کارتلی» ایستاده است؛ پیکره‌ای آلومینیومی به بلندی بیست
    متر که در ۱۹۵۸ به مناسبت هزاروپانصدمین سال شهر و به دست الگوجا آماشوکلی برپا شد. در یک دست جام شراب
    دارد و در دست دیگر شمشیر: شراب برای مهمان و فولاد برای دشمن. از بتلمی راه رسیدن به آن حدود بیست دقیقه
    است و در امتداد دیوارهای ناریکالا می‌گذرد؛ پایان طبیعی این بالا رفتن.
  tip: >-
    حدود یک ساعت و نیم با توقف‌ها در نظر بگیرید. این یک بالا رفتن واقعی است: پلکان بلند است، پله‌ها ناهموارند
    و نرده همه‌جا نیست، پس اگر زانو یا قلبتان مشکل دارد بسنجید. تابستان صبح زود یا عصر بالا بروید و آب
    همراه ببرید؛ سایه بسیار کم است. با ویلچر ناممکن و با کالسکه دشوار است. اینجا مردم زندگی می‌کنند؛ وارد
    شدن به حیاط‌ها و عکس گرفتن از پنجره‌ها پسندیده نیست. سرویس بهداشتی و کافه فقط پایین در آبانوتوبانی
    است.
  route: >-
    با خودرو نمی‌توان به بتلمی بالا رفت: بخشی از کوچه پله است و بقیه برای عبور دو خودرو تنگ است. خودرو
    را پایین بگذارید. آسان‌ترین گزینه‌ها پارکینگ پولی میدان گورگاسالی است یا پارکینگ پارک ریکه آن‌سوی
    رودخانه که با عبور از پل دوازده تا پانزده دقیقه پیاده فاصله دارد. اگر از سمت سولولاکی می‌آیید، در
    خیابان لادو آساتیانی جای‌های خط‌کشی‌شده هست که روزها تقریباً همیشه پر است. گزینهٔ خوب دیگر: با تله‌کابین
    به ناریکالا بروید و از پلکان بتلمی پایین بیایید تا اصلاً سربالایی نداشته باشید.
he:
  name: רובע בטלמי והמדרגות
  short: רובע להולכי רגל המטפס במדרון שמתחת לנריקאלה, עם מדרגות אבן, שתי כנסיות ומקדש אש עתיק.
  body: >-
    **בטלמי הוא החלק של טביליסי העתיקה שמכוניות אינן מגיעות אליו.** הרובע, הנקרא גם קלדיסובאני, רובע הצוק,
    בנוי במדרון התלול שמתחת לנריקאלה, ורחובו הראשי הוא למעשה גרם מדרגות אבן ארוך העולה מרחוב אסאטיאני.


    ככל שמטפסים, קול העיר משתנה בשלבים: תחילה נעלמת התנועה, אחר כך בתי הקפה לתיירים, ומה שנשאר הוא מרפסות,
    חבלי כביסה וחתולים. חלק מן הבתים שוחזרו, אחרים עדיין נתמכים בקורות עץ. זו שכונה שגרים בה, לא מוזיאון
    פתוח.


    בראש המדרגות עומדות שתי כנסיות, בטלמי העליונה והתחתונה. שתיהן היו במקור כנסיות ארמניות ושתיהן הועברו
    לכנסייה האורתודוקסית הגאורגית בשנות ה-90. לפני בטלמי העליונה יש מרפסת קטנה — כנראה הנוף החינמי הטוב
    ביותר בעיר על גגות העיר העתיקה לעבר מטחי וסמבה.


    בקרבת מקום, ברחוב גומי, עומד האתשגה, מבנה לבנים הנחשב למקדש אש זורואסטרי. תיארוכו שנוי במחלוקת: הגרעין
    אולי מגיע לשלהי העת העתיקה, ואילו מה שרואים הוא בנייה מאוחרת בהרבה. זהו אחד המבנים הבודדים מסוגו ששרדו
    באזור. בדרך כלל הוא נעול, והמבקרים מתבוננים בו מן החצר.


    מבטלמי ממשיך שביל היישר אל חומות נריקאלה ואל השער העליון של הגן הבוטני.


    מעל בטלמי, על רכס סולולאקי, ניצבת קרתליס דדה, אם גאורגיה: דמות אלומיניום בת עשרים מטרים שהוצבה ב-1958
    לרגל אלף וחמש מאות שנה לעיר, מעשה ידי אלגוג'ה אמאשוקלי. בידה האחת קערת יין ובשנייה חרב — יין לאורח,
    פלדה לאויב. מבטלמי ההליכה אליה אורכת כעשרים דקות ועוברת לאורך חומות נריקאלה, וזהו הסיום המתבקש לטיפוס.
  tip: >-
    הקצו כשעה וחצי עם עצירות. זהו טיפוס ממשי: המדרגות ארוכות, השלחים לא אחידים ומאחז יד אינו רציף, אז
    שקלו זאת אם יש בעיות ברכיים או בלב. בקיץ עלו מוקדם או לקראת ערב וקחו מים; הצל מועט מאוד. עם כיסא גלגלים
    בלתי אפשרי ועם עגלה מסורבל. גרים כאן אנשים — כניסה לחצרות וצילום דרך חלונות אינם רצויים. שירותים ובתי
    קפה רק למטה, באבנוטובאני.
  route: >-
    אי אפשר לנסוע אל תוך בטלמי: חלק מן הרחוב הוא מדרגות והשאר צר מכדי שיעברו בו שני רכבים. השאירו את הרכב
    למטה. הפשוט ביותר הוא החניון בתשלום בכיכר גורגסאלי או החניון בפארק ריקה שמעבר לנהר, שתים-עשרה עד חמש-עשרה
    דקות הליכה דרך הגשר. מכיוון סולולאקי יש מקומות מסומנים ברחוב לאדו אסאטיאני, אך ביום הם תפוסים כמעט
    תמיד. חלופה טובה: לעלות ברכבל לנריקאלה ולרדת במדרגות בטלמי, וכך לוותר על הטיפוס לגמרי.
ar:
  name: حي بتليمي ودرجه
  short: حي للمشاة يتسلق المنحدر تحت ناريكالا، بدرج حجري وكنيستين ومعبد نار قديم.
  body: >-
    **بتليمي هو الجزء من تبليسي القديمة الذي لا تصله السيارات.** والحي، ويُسمى أيضاً كلديسوباني أي حي
    الصخر، مبني على المنحدر شديد الانحدار تحت ناريكالا، وشارعه الرئيسي في الحقيقة درج حجري طويل يصعد من
    شارع أساتياني.


    وكلما صعدت تغيّر صوت المدينة على مراحل: تختفي السيارات أولاً، ثم المقاهي السياحية، ويبقى الشرفات وحبال
    الغسيل والقطط. بعض البيوت مرمم وبعضها ما زال مسنوداً بدعائم خشبية. هذا حي مسكون لا متحف مفتوح، وله
    ما يصاحب ذلك من فوضى.


    وفي أعلى الدرج تقوم كنيستان، بتليمي العليا والسفلى. وكلتاهما كانتا في الأصل كنيستين أرمنيتين، وسُلمتا
    في التسعينيات إلى الكنيسة الأرثوذكسية الجورجية. وأمام بتليمي العليا شرفة صغيرة، ولعلها أفضل إطلالة
    مجانية في المدينة على سطوح المدينة القديمة نحو ميتيخي وساميبا.


    وقريباً منها، في شارع غومي، يقوم الأتشغاه، بناء من الآجر يُعدّ معبد نار زرادشتياً. وتاريخه موضع خلاف:
    فنواته قد ترجع إلى أواخر العصور القديمة، أما ما تراه فبناء لاحق بكثير. وهو من أندر ما بقي من هذا النوع
    في المنطقة كلها. وهو مغلق عادة، وينظر إليه الزوار من الفناء الخارجي.


    ومن بتليمي يتابع درب صاعد مباشرة إلى أسوار ناريكالا وإلى البوابة العليا للحديقة النباتية.


    وفوق بتليمي، على قمة حافة سولولاكي، يقوم تمثال «أم كارتلي»: هيئة من الألمنيوم بارتفاع عشرين متراً
    نُصبت عام 1958 في الذكرى الألف والخمسمئة للمدينة، من عمل إلغوجا أماشوكيلي. تحمل في يد كأس نبيذ وفي
    الأخرى سيفاً: نبيذ للضيف وفولاذ للعدو. ومن بتليمي يستغرق الطريق إليه نحو عشرين دقيقة ويمر بمحاذاة
    أسوار ناريكالا، وهو الختام البديهي لهذا الصعود.
  tip: >-
    احسب نحو ساعة ونصف مع التوقف. هذا صعود حقيقي: الدرج طويل ودرجاته غير منتظمة والدرابزين متقطع، ففكّر
    جيداً إن كانت الركبتان أو القلب مصدر قلق. وفي الصيف اصعد باكراً أو قبيل المساء واحمل ماء، فالظل قليل
    جداً. ويستحيل بالكرسي المتحرك ويصعب بعربة الطفل. وهنا يسكن الناس، فدخول الأفنية والتصوير عبر النوافذ
    غير مرحب به. ودورات المياه والمقاهي في الأسفل فقط، في أبانوتوباني.
  route: >-
    لا يمكن الصعود بالسيارة إلى بتليمي: فجزء من الشارع درج، وما تبقى أضيق من أن تتجاوز فيه سيارتان. اترك
    السيارة في الأسفل. وأيسر الخيارات موقف ميدان غورغاسالي المدفوع أو موقف حديقة ريكه عبر النهر، وهو على
    اثنتي عشرة إلى خمس عشرة دقيقة سيراً عبر الجسر. وإن جئت من جهة سولولاكي فهناك أماكن مخططة في شارع لادو
    أساتياني، لكنها مشغولة نهاراً دائماً تقريباً. وبديل جيد: اصعد بالتلفريك إلى ناريكالا وانزل على درج
    بتليمي، فتلغي الصعود كله.
