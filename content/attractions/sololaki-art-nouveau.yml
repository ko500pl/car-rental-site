ka:
  name: სოლოლაკი და მისი მოდერნის სადარბაზოები
  short: >-
    ვაჭრების უბანი სოლოლაკის ქედის ძირას, სადაც მთავარი სანახავი შიგნითაა: მოხატული სადარბაზოები, ფერადი
    მინა და მწერალთა სახლი მაჩაბლის ქუჩაზე.
  body: >-
    **სოლოლაკში ქუჩა მხოლოდ ყდაა; წიგნი მაშინ იხსნება, როცა სადარბაზოს კარს შეაღებთ.** XIX–XX საუკუნეების
    მიჯნაზე ვაჭართა ოჯახებისთვის აშენებული სახლების მძიმე კარის მიღმა სასტუმრო ოთახივით მოხატული კიბის
    უჯრედებია: ჭერზე გირლანდები და ყვავილები, კედლებზე გახუნებული სცენები, მარშებს აყოლებული თუჯის ხვეული
    მოაჯირები და ფერადი მინა, რომელიც გაცვეთილ საფეხურებს სინათლის ლაქებით აჭრელებს.


    სახელი სახლებზე ძველია. ქართული წყაროები მას სარწყავ არხს, „სულუ-ლაჰს“, უკავშირებენ, რომელიც არაბთა
    ბატონობისას ციხის ბაღის მოსარწყავად აღადგინეს; სახელი მერე მთის კალთას გადაეცა, XIX საუკუნეში კი —
    უბანს. მანამდე ამ ადგილს ავანაანთხევი ერქვა და აქ ქართველ დიდებულთა ბაღები იყო. 1840-იან წლებში ხევის
    ნაკადი აგურის თაღით გადახურეს და ახალმა ქალაქმა ფერდობზე ქუჩა-ქუჩა აიწია.


    ყველაზე ლამაზი სახლი მაჩაბლის ქუჩის №13-ში დგას. დავით სარაჯიშვილმა, ქიმიკოსმა, რომელმაც რუსეთის იმპერიაში
    პირველმა დაიწყო კონიაკის დავარგება კავკასიური მუხის კასრებში, მშობლების სახლი დაანგრია და 1903–1905
    წლებში კარლ ცაარის პროექტით სასახლე ააშენა — მოდერნისა და ნეობაროკოს ნაზავი, ტერასაზე „ვილეროი და
    ბოხის“ ფილებით. დღეს ეს მწერალთა სახლია. 1920-იანი წლების დასაწყისში აქ ცისფერყანწელები იკრიბებოდნენ,
    ხოლო 1937 წლის 22 ივლისს, ტერორის მწვერვალზე, სწორედ აქ მოიკლა თავი მათმა ლიდერმა პაოლო იაშვილმა.
    ორ ოთახში დღეს რეპრესირებულ მწერალთა მუზეუმია.


    რატომ ჩანს ამდენი სადარბაზო მიტოვებულად? გასაბჭოების შემდეგ დიდი ბინები რამდენიმე ოჯახზე გაიყო, საერთო
    სადარბაზო კი ყველასი გახდა და არავისი. ზოგი აღადგინეს, ბევრი ჯერ კიდევ ელოდება. ნელა გაიარეთ ასათიანის,
    ამაღლების, მაჩაბლისა და გერონტი ქიქოძის ქუჩები. ეს საცხოვრებელი სახლებია და არა მუზეუმები: თუ კარი
    ღიაა, წყნარად შედით და ზემოთ აიხედეთ.
  tip: >-
    დაუჩქარებელი სეირნობისთვის საათნახევარი გამოყავით. მოემზადეთ, რომ კარების ნახევარი დაკეტილი დაგხვდებათ
    — ეს ჩვეულებრივი ამბავია და არა წარუმატებლობა; მაცხოვრებლებს ზარს ნუ დაურეკავთ და სადარბაზოში ვიდეოს
    ნუ გადაიღებთ. ფერადი მინა ყველაზე კარგად შუადღისწინ და შუადღის პირველ საათებში ანათებს. ტროტუარები
    ვიწრო და დაქანებულია, ხშირად მანქანებით გადაკეტილი, ამიტომ ბრტყელძირიანი ფეხსაცმელი ჩაიცვით. მწერალთა
    სახლში კითხვები და გამოფენები იმართება, ზაფხულში კი ბაღში რესტორანი იხსნება — წასვლამდე პროგრამა გადაამოწმეთ.
    ყავასა და ტუალეტს ლადო ასათიანის ქუჩაზე ადვილად იპოვით; საღამოობით ის ბარებით ივსება.
  route: >-
    სოლოლაკი თავისუფლების მოედნის ზურგს უკანაა, ცენტრალური სასტუმროების უმეტესობიდან დაახლოებით 2 კილომეტრსა
    და ათ წუთში — და თბილისში პარკირებისთვის ერთ-ერთი ყველაზე რთული უბანია. ქუჩები ვიწრო და უმეტესად ცალმხრივია,
    ორივე მხარეს მანქანებით გაჭედილი; ადგილობრივებიც კი ძლივს ჩერდებიან საკუთარ კართან. გონივრული გეგმაა,
    მანქანა თავისუფლების მოედნის მიწისქვეშა ფასიან სადგომზე დატოვოთ და ფეხით ახვიდეთ — უბანი ისედაც მხოლოდ
    ფეხით ინახება. თუ ქუჩაში გაჩერება აუცილებელია, ლადო ასათიანის ქუჩის ფასიანი ადგილებით ისარგებლეთ და
    ნიშნებს დააკვირდით. აქ ერთადერთი გონივრული არჩევანი პატარა ეკონომკლასის მანქანაა.
en:
  name: Sololaki and its Art Nouveau Entrances
  short: >-
    A merchants' quarter under the Sololaki ridge where the real show is indoors: painted stairwells,
    coloured glass and the Writers' House on Machabeli Street.
  body: >-
    **In Sololaki the street is only the cover; the story begins when you push open a front door.** Behind
    the heavy doors of houses built for merchant families at the turn of the twentieth century lie stairwells
    painted like drawing rooms: garlands and flowers on the ceilings, faded scenes on the walls, cast-iron
    balustrades curling up the flights and coloured glass scattering light over worn steps.


    The name is older than the houses. Georgian sources trace it to an irrigation channel, *sulu-lah*,
    restored under Arab rule to water the citadel garden; the word later passed to the slope and, in the
    nineteenth century, to the district. Before that the valley was Avanaantkhevi, a gorge of noblemen's
    gardens. In the 1840s its stream was vaulted over in brick, and the new town climbed the hillside
    street by street.


    The finest single house stands at 13 Machabeli Street. David Sarajishvili, the chemist who was the
    first in the Russian Empire to age brandy in Caucasian oak, pulled down his parents' home here and
    in 1903–05 built a mansion designed by Karl Zaar, Art Nouveau blended with neo-baroque, its terrace
    laid with Villeroy & Boch tiles. Today it is the Writers' House of Georgia. The Blue Horns poets met
    here in the early 1920s, and here, on 22 July 1937, at the height of the Terror, their leader Paolo
    Iashvili took his own life. Two rooms now hold a Museum of Repressed Writers.


    Why do so many stairwells look forgotten? After Sovietisation the large flats were split between families,
    and the shared hall became everyone's and no one's. Some entrances have been restored; many still
    wait. Walk Asatiani, Amaghleba, Machabeli and Geronti Kikodze streets slowly. These are homes, not
    museums: if a door stands open, step in quietly and look up.
  tip: >-
    Allow an hour and a half for an unhurried walk. Expect half the doors to be locked — that is normal,
    not bad luck; never ring residents' bells or film in stairwells. The stained glass glows best from
    late morning to early afternoon. Pavements are narrow and slightly sloped, often blocked by parked
    cars, so wear flat shoes. The Writers' House hosts readings and exhibitions, and in summer a restaurant
    opens in its garden; check its programme before you go. Coffee and toilets are easy to find along
    Lado Asatiani Street, which fills with bars in the evening.
  route: >-
    Sololaki sits directly behind Freedom Square, about 2 km and ten minutes' drive from most central
    hotels — and it is one of the hardest districts in Tbilisi to park in. The streets are narrow, mostly
    one-way and lined with cars on both sides; residents struggle to stop at their own doors. The sensible
    plan is to leave the car in the paid underground car park at Freedom Square and walk up, since the
    quarter has to be seen on foot anyway. If you must park on the street, use the paid bays on Lado Asatiani
    Street and read the signs. A small economy car is the only reasonable choice here.
ru:
  name: Сололаки и его парадные в стиле модерн
  short: >-
    Купеческий квартал под хребтом Сололаки, где главное скрыто внутри: расписные подъезды, цветное стекло
    и Дом писателей на улице Мачабели.
  body: >-
    **В Сололаки улица — лишь обложка; история начинается, когда вы толкаете входную дверь.** За тяжёлыми
    дверями домов, построенных для купеческих семей на рубеже XIX–XX веков, открываются лестничные клетки,
    расписанные, как гостиные: гирлянды и цветы на потолках, выцветшие сюжеты на стенах, чугунные перила,
    завивающиеся вверх по пролётам, и цветное стекло, рассыпающее свет по стёртым ступеням.


    Название старше домов. Грузинские источники возводят его к оросительному каналу *сулу-лах*, восстановленному
    при арабском владычестве, чтобы поливать сад цитадели; позднее слово перешло на склон, а в XIX веке
    — на весь район. Прежде долина звалась Аванаантхеви — ущелье дворянских садов. В 1840-х годах её ручей
    заключили в кирпичный свод, и новый город улица за улицей стал взбираться по склону.


    Лучший особняк квартала стоит на улице Мачабели, 13. Давид Сараджишвили, химик, первым в Российской
    империи начавший выдерживать коньяк в кавказском дубе, снёс здесь родительский дом и в 1903–1905 годах
    построил особняк по проекту Карла Заара — модерн, смешанный с необарокко, с террасой, выложенной плиткой
    «Виллерой и Бох». Сегодня это Дом писателей Грузии. В начале 1920-х здесь собирались поэты «Голубых
    рогов», и здесь же 22 июля 1937 года, в разгар Большого террора, покончил с собой их лидер Паоло Яшвили.
    Теперь в двух комнатах работает Музей репрессированных писателей.


    Почему столько подъездов выглядят забытыми? После советизации большие квартиры поделили между семьями,
    и общая парадная стала всеобщей — то есть ничьей. Некоторые подъезды отреставрированы; многие всё
    ещё ждут. Пройдите не спеша по улицам Асатиани, Амаглеба, Мачабели и Геронти Кикодзе. Это жилые дома,
    а не музеи: если дверь открыта, войдите тихо и поднимите глаза.
  tip: >-
    Отведите на неспешную прогулку полтора часа. Будьте готовы, что половина дверей заперта, — это норма,
    а не невезение; никогда не звоните жильцам и не снимайте видео в подъездах. Витражи ярче всего горят
    с позднего утра до начала второй половины дня. Тротуары узкие и слегка покатые, их часто перегораживают
    припаркованные машины, так что обувь нужна без каблука. В Доме писателей проходят чтения и выставки,
    а летом в его саду открывается ресторан — сверьтесь с программой заранее. Кофе и туалет легко найти
    на улице Ладо Асатиани, которая по вечерам наполняется барами.
  route: >-
    Сололаки начинается прямо за площадью Свободы — около 2 км и десять минут езды от большинства центральных
    отелей, — и это один из самых трудных для парковки районов Тбилиси. Улицы узкие, в основном односторонние,
    машины стоят по обе стороны; жильцам и то непросто остановиться у собственного подъезда. Разумнее
    всего оставить машину на платной подземной парковке на площади Свободы и подняться пешком — квартал
    всё равно нужно смотреть ногами. Если без уличной парковки не обойтись, пользуйтесь платными местами
    на улице Ладо Асатиани и внимательно читайте знаки. Здесь разумен только маленький автомобиль эконом-класса.
fa:
  name: سولولاکی و ورودی‌های آر نوو
  short: >-
    محلهٔ بازرگانان در دامنهٔ ستیغ سولولاکی که نمایش اصلی‌اش درون خانه‌هاست: راه‌پله‌های نقاشی‌شده، شیشه‌های
    رنگی و خانهٔ نویسندگان در خیابان ماچابلی.
  body: >-
    **در سولولاکی خیابان فقط جلد کتاب است؛ داستان از لحظه‌ای آغاز می‌شود که درِ ورودی را هل می‌دهید.**
    پشت درهای سنگین خانه‌هایی که در آستانهٔ سدهٔ بیستم برای خانواده‌های بازرگان ساخته شدند، راه‌پله‌هایی
    پنهان است که مانند تالار پذیرایی نقاشی شده‌اند: حلقه‌های گل و شکوفه بر سقف‌ها، صحنه‌های رنگ‌باخته
    بر دیوارها، نرده‌های چدنی که پیچ‌وتاب‌خوران از طبقه‌ها بالا می‌روند، و شیشه‌های رنگی که نور را بر
    پله‌های ساییده می‌پاشند.


    نام این محله از خانه‌هایش کهن‌تر است. منابع گرجی آن را به آبراهه‌ای به نام *سولو-لاخ* بازمی‌گردانند
    که در دوران فرمانروایی اعراب برای آبیاری باغ ارگ بازسازی شد؛ این واژه بعدها به دامنه و در سدهٔ نوزدهم
    به کل محله رسید. پیش از آن، این دره آواناآنتخوی نام داشت، دره‌ای از باغ‌های اشراف. در دههٔ ۱۸۴۰ جویبارش
    را زیر طاقی آجری پوشاندند و شهر نو، خیابان به خیابان، از دامنه بالا رفت.


    زیباترین خانهٔ محله در شمارهٔ ۱۳ خیابان ماچابلی است. داوید سراجیشویلی، شیمی‌دانی که نخستین بار در
    امپراتوری روسیه براندی را در چلیک‌های بلوط قفقازی کهنه کرد، خانهٔ پدری‌اش را در این‌جا ویران کرد و
    در سال‌های ۱۹۰۳ تا ۱۹۰۵ عمارتی به طراحی کارل زار ساخت: آر نوو آمیخته با نئوباروک، با ایوانی فرش‌شده
    با کاشی‌های ویلروی و بوخ. امروز این‌جا خانهٔ نویسندگان گرجستان است. شاعران گروه «شاخ‌های آبی» در آغاز
    دههٔ ۱۹۲۰ این‌جا گرد هم می‌آمدند، و همین‌جا در ۲۲ ژوئیهٔ ۱۹۳۷، در اوج ترور بزرگ استالینی، رهبرشان
    پائولو یاشویلی به زندگی خود پایان داد. اکنون دو اتاق آن موزهٔ نویسندگان سرکوب‌شده است.


    چرا این‌همه راه‌پله فراموش‌شده به نظر می‌رسند؟ پس از شوروی‌سازی، آپارتمان‌های بزرگ میان چند خانواده
    تقسیم شد و سرسرای مشترک از آنِ همه شد و از آنِ هیچ‌کس. برخی ورودی‌ها مرمت شده‌اند؛ بسیاری هنوز چشم‌به‌راه‌اند.
    خیابان‌های آساتیانی، آماغلبا، ماچابلی و گرونتی کیکودزه را آهسته قدم بزنید. این‌ها خانه‌های مسکونی‌اند،
    نه موزه: اگر دری باز است، آرام وارد شوید و سر بالا کنید.
  tip: >-
    برای گردشی بی‌شتاب یک ساعت و نیم در نظر بگیرید. انتظار داشته باشید نیمی از درها قفل باشد — این عادی
    است، نه بدشانسی؛ هرگز زنگ ساکنان را نزنید و در راه‌پله‌ها فیلم نگیرید. شیشه‌های رنگی از اواخر صبح
    تا اوایل بعدازظهر از همه درخشان‌ترند. پیاده‌روها باریک و کمی شیب‌دارند و اغلب خودروهای پارک‌شده راه
    را بسته‌اند، پس کفش تخت بپوشید. خانهٔ نویسندگان میزبان شب‌های شعرخوانی و نمایشگاه است و در تابستان
    رستورانی در باغش باز می‌شود؛ پیش از رفتن برنامه‌اش را ببینید. قهوه و سرویس بهداشتی در خیابان لادو
    آساتیانی به‌آسانی پیدا می‌شود؛ این خیابان شب‌ها پر از بار و میخانه است.
  route: >-
    سولولاکی درست پشت میدان آزادی است، حدود ۲ کیلومتر و ده دقیقه رانندگی از بیشتر هتل‌های مرکز شهر — و
    یکی از دشوارترین محله‌های تفلیس برای پارک کردن. خیابان‌ها باریک‌اند، بیشترشان یک‌طرفه، و دو سویشان
    پر از خودرو؛ ساکنان هم به‌زحمت جلوی در خانهٔ خود جا پیدا می‌کنند. عاقلانه‌ترین کار این است که خودرو
    را در پارکینگ زیرزمینی پولی میدان آزادی بگذارید و پیاده بالا بروید، چون این محله را به هر حال باید
    پیاده دید. اگر ناچار به پارک در خیابان هستید، از جاپارک‌های پولی خیابان لادو آساتیانی استفاده کنید
    و تابلوها را بخوانید. این‌جا تنها انتخاب معقول، خودرویی کوچک از رده اقتصادی است.
he:
  name: סולולאקי וחדרי המדרגות בסגנון אר-נובו
  short: >-
    רובע סוחרים למרגלות רכס סולולאקי שעיקר ההצגה בו מתרחש בפנים: חדרי מדרגות מצוירים, זכוכית צבעונית ובית
    הסופרים ברחוב מצ'בלי.
  body: >-
    **בסולולאקי הרחוב הוא רק הכריכה; הסיפור מתחיל כשדוחפים את דלת הכניסה.** מאחורי הדלתות הכבדות של בתים
    שנבנו למשפחות סוחרים בפתח המאה ה-20 מסתתרים חדרי מדרגות מצוירים כמו טרקלינים: זרים ופרחים על התקרות,
    סצנות דהויות על הקירות, מעקות ברזל יצוק המתפתלים במעלה הקומות, וזכוכית צבעונית שמפזרת אור על מדרגות
    שחוקות.


    השם עתיק מן הבתים. מקורות גאורגיים מייחסים אותו לתעלת השקיה, *סולו-לאח*, ששוקמה בתקופת השלטון הערבי
    כדי להשקות את גן המצודה; המילה עברה מאוחר יותר אל המדרון, ובמאה ה-19 אל הרובע כולו. קודם לכן נקרא
    העמק אוואנאאנתחווי, ערוץ של גני אצילים. בשנות ה-40 של המאה ה-19 כוסה הנחל שלו בקמרון לבנים, והעיר
    החדשה טיפסה במעלה הגבעה רחוב אחר רחוב.


    הבית המרשים מכולם עומד ברחוב מצ'בלי 13. דוד סרג'ישווילי, הכימאי שהיה הראשון באימפריה הרוסית שיישן
    ברנדי בחביות מעץ אלון קווקזי, הרס כאן את בית הוריו ובנה בשנים 1903–1905 אחוזה שתכנן קרל זאר – אר-נובו
    משולב בניאו-בארוק, עם מרפסת מרוצפת באריחי וילרוי אנד בוך. כיום זהו בית הסופרים של גאורגיה. משוררי
    קבוצת "הקרניים הכחולות" נפגשו כאן בראשית שנות ה-20, וכאן, ב-22 ביולי 1937, בשיא הטרור הגדול, שם קץ
    לחייו מנהיגם, פאולו יאשווילי. בשני חדרים פועל כיום מוזיאון הסופרים שנפלו קורבן לדיכוי.


    מדוע כל כך הרבה חדרי מדרגות נראים נשכחים? אחרי הסובייטיזציה חולקו הדירות הגדולות בין כמה משפחות, והמבואה
    המשותפת הפכה לשל כולם – כלומר של אף אחד. חלק מן הכניסות שוקמו; רבות עדיין מחכות. הלכו לאט ברחובות
    אסטיאני, אמגלבה, מצ'בלי וגרונטי קיקודזה. אלה בתי מגורים, לא מוזיאונים: אם דלת פתוחה, היכנסו בשקט והרימו
    את המבט.
  tip: >-
    הקדישו שעה וחצי לטיול נינוח. צפו שחצי מן הדלתות יהיו נעולות – זה רגיל, לא חוסר מזל; לעולם אל תצלצלו
    בפעמוני הדיירים ואל תצלמו וידאו בחדרי המדרגות. הוויטראז'ים זוהרים במיטבם משעות הבוקר המאוחרות ועד
    תחילת אחר הצהריים. המדרכות צרות ומשופעות מעט, ולעיתים קרובות חוסמות אותן מכוניות חונות, לכן נעלו נעליים
    שטוחות. בבית הסופרים מתקיימים ערבי קריאה ותערוכות, ובקיץ נפתחת מסעדה בגן; בדקו את התוכנייה לפני שאתם
    יוצאים. קפה ושירותים קל למצוא ברחוב לאדו אסטיאני, שמתמלא בערבים בברים.
  route: >-
    סולולאקי שוכנת ממש מאחורי כיכר החירות, כ-2 ק״מ ועשר דקות נסיעה מרוב המלונות המרכזיים – וזו אחת השכונות
    הקשות ביותר לחניה בטביליסי. הרחובות צרים, רובם חד-סטריים, ומכוניות חונות משני צדיהם; גם הדיירים מתקשים
    לעצור ליד הבית שלהם. התוכנית הנבונה היא להשאיר את הרכב בחניון התת-קרקעי בתשלום בכיכר החירות ולעלות
    ברגל, שהרי את הרובע ממילא צריך לראות ברגל. אם אין ברירה אלא לחנות ברחוב, השתמשו במקומות החניה בתשלום
    ברחוב לאדו אסטיאני וקראו את השלטים. רכב אקונומי קטן הוא הבחירה הסבירה היחידה כאן.
ar:
  name: سولولاكي ومداخلها بطراز الآرت نوفو
  short: >-
    حيّ تجّار عند سفح سلسلة سولولاكي، عرضه الحقيقي في الداخل: بيوت درج مرسومة، وزجاج ملوّن، وبيت الكتّاب
    في شارع ماتشابيلي.
  body: >-
    **في سولولاكي ليس الشارع سوى الغلاف؛ أما الحكاية فتبدأ حين تدفع الباب الأمامي.** خلف الأبواب الثقيلة
    لبيوت شُيّدت لأسر التجّار عند مطلع القرن العشرين تنفتح بيوت درج مرسومة كأنها صالونات: أكاليل وأزهار
    على الأسقف، ومشاهد باهتة على الجدران، ودرابزينات من الحديد الزهر تلتفّ صاعدةً مع الطوابق، وزجاج ملوّن
    ينثر الضوء على درجات بالية.


    الاسم أقدم من البيوت. تردّه المصادر الجورجية إلى قناة ري تُدعى *سولو-لاخ* رُمّمت في عهد الحكم العربي
    لسقي حديقة القلعة؛ ثم انتقلت الكلمة لاحقاً إلى المنحدر، وفي القرن التاسع عشر إلى الحي كله. وقبل ذلك
    كان الوادي يُعرف باسم أفاناأنتخيفي، وهو وادٍ تكسوه بساتين النبلاء. وفي أربعينيات القرن التاسع عشر
    غُطّي جدوله بقبو من الطوب، وأخذت المدينة الجديدة تتسلّق السفح شارعاً بعد شارع.


    أجمل بيوت الحي يقوم في الرقم 13 من شارع ماتشابيلي. فهنا هدم دافيت ساراجيشفيلي، الكيميائي الذي كان
    أول من عتّق البراندي في براميل البلوط القوقازي في الإمبراطورية الروسية، بيت والديه، وشيّد بين عامي
    1903 و1905 قصراً صمّمه كارل زار، يمزج الآرت نوفو بالباروك الجديد، وشرفته مكسوّة ببلاط فيليروي آند
    بوخ. واليوم هو بيت كتّاب جورجيا. هنا كان يلتقي شعراء جماعة «القرون الزرقاء» في مطلع العشرينيات، وهنا،
    في 22 يوليو 1937، في ذروة التطهير الكبير، أنهى زعيمهم باولو ياشفيلي حياته. وتضم غرفتان منه اليوم متحف
    الكتّاب المقموعين.


    لماذا تبدو بيوت درج كثيرة منسية؟ بعد إقامة الحكم السوفييتي قُسّمت الشقق الكبيرة بين عدة أسر، فصار
    المدخل المشترك ملكاً للجميع ولا لأحد. رُمّم بعض المداخل، وما زال كثير منها ينتظر. تمهّل في شوارع أساتياني
    وأماغليبا وماتشابيلي وغيرونتي كيكودزه. هذه بيوت لا متاحف: إن وجدت باباً مفتوحاً فادخل بهدوء وارفع
    بصرك.
  tip: >-
    خصّص ساعة ونصفاً لجولة متأنية. توقّع أن يكون نصف الأبواب مقفلاً — هذا أمر عادي لا سوء حظ؛ ولا تقرع
    أجراس السكان أبداً ولا تصوّر فيديو في بيوت الدرج. يتوهّج الزجاج الملوّن في أبهى حالاته من أواخر الصباح
    حتى أول العصر. الأرصفة ضيقة ومائلة قليلاً، وكثيراً ما تسدّها السيارات المركونة، فانتعل حذاءً مسطّحاً.
    يستضيف بيت الكتّاب أمسيات قراءة ومعارض، ويُفتح مطعم في حديقته صيفاً؛ اطّلع على برنامجه قبل الذهاب.
    القهوة ودورات المياه متاحة بسهولة في شارع لادو أساتياني الذي يمتلئ بالحانات مساءً.
  route: >-
    تقع سولولاكي خلف ساحة الحرية مباشرة، على بعد نحو 2 كم وعشر دقائق بالسيارة من معظم فنادق الوسط — وهي
    من أصعب أحياء تبليسي في إيجاد موقف. الشوارع ضيقة، ومعظمها باتجاه واحد، والسيارات مصطفّة على جانبيها؛
    حتى السكان يجدون عناءً في التوقف عند أبوابهم. والخطة الحكيمة أن تترك السيارة في المرأب المدفوع تحت
    ساحة الحرية وتصعد مشياً، فالحي لا يُرى إلا على الأقدام على أي حال. وإن اضطررت إلى الوقوف في الشارع
    فاستخدم المواقف المدفوعة في شارع لادو أساتياني واقرأ اللافتات. السيارة الاقتصادية الصغيرة هي الخيار
    المعقول الوحيد هنا.
