ka:
  name: სოლოლაკი და მისი პარადნი კიბეები
  short: XIX საუკუნის ვაჭრების უბანი ქედის ქვეშ, სადაც მთავარი სანახავი სახლების შიგნით, კიბის უჯრედებშია.
  body: >-
    **სოლოლაკში ფასადები არ არის მთავარი — მთავარი კარის მიღმაა.** უბანი თავისუფლების მოედნის სამხრეთით,
    სოლოლაკის ქედის ძირშია და ხანის ბაღების ადგილას გაშენდა; თავად სახელი იმ წყლის არხებს უკავშირდება,
    რომლებიც ამ ბაღებს რწყავდა.


    XIX საუკუნის ბოლოს, როცა ბაქოს ნავთობმა და კავკასიურმა ვაჭრობამ თბილისში ფული შემოიტანა, აქ ააშენეს
    თავიანთი სახლები ქალაქის მდიდარმა ოჯახებმა — მანთაშოვმა, არამიანცმა, სარაჯიშვილმა, მელიქ-აზარიანცმა.
    ისინი ევროპულ მოდას მისდევდნენ: ეკლექტიკა, შემდეგ კი მოდერნი, ანუ ის, რასაც აქ „არ ნუვოს" ეძახიან.


    ჩვეულებრივი ტურისტული მარშრუტი ლადო ასათიანის, ამაღლების, მაჩაბლისა და გერონტი ქიქოძის ქუჩებს მოიცავს.
    კიბის უჯრედებში ნახავ:


    - მოხატულ კედლებსა და ჭერს, ხშირად გახუნებულს და ნაწილობრივ ჩამოცვენილს


    - ფერადი მინის ვიტრაჟებს სახურავის სინათლის ჭაბურღილში


    - თუჯის მოაჯირებს და კაფელის იატაკებს, რომლებზეც ჯერ კიდევ ჩანს ქარხნის დამღა


    მაჩაბლის ქუჩაზე დგას დავით სარაჯიშვილის სასახლე — 1900-იანი წლების დასაწყისის შენობა, დღეს მწერლის
    სახლი, სოლოლაკის ყველაზე კარგად შემონახული ინტერიერით.


    ერთი გაფრთხილება. ეს კერძო საცხოვრებელი სახლებია და არა მუზეუმები. ბოლო წლებში ბევრმა სადარბაზომ კოდიანი
    კარი დაიყენა, სწორედ ტურისტების ნაკადის გამო. თუ კარი ღიაა — შედი წყნარად, ნუ დარეკავ ბინის ზარებს
    და ნუ იღებ ვიდეოს დერეფნებში.


    იმის ახსნა, თუ რატომ არის ეს სადარბაზოები ასეთ მდგომარეობაში, მარტივია. 1920-იან წლებში საბჭოთა ხელისუფლებამ
    დიდი ბინები ნაციონალიზაცია და გაყო: ერთ ბინაში რამდენიმე ოჯახი, ოთახზე ერთი. საერთო სივრცე — ანუ სწორედ
    კიბე, ვესტიბიული და ვიტრაჟი — არავის კუთვნილება აღარ იყო და, შესაბამისად, არავინ უვლიდა. ასე გაგრძელდა
    ოთხმოცი წელი. ბოლო წლებში ნაწილი აღდგა კერძო ინიციატივით და ქალაქის პროგრამებით, თუმცა უმეტესობა ჯერ
    კიდევ ელოდება.
  tip: >-
    საათნახევარი საკმარისია მშვიდი სეირნობისთვის. მოემზადე იმისთვის, რომ სადარბაზოების ნახევარი დაკეტილი
    იქნება — ეს ნორმაა და არა წარუმატებლობა. საუკეთესო შუქი ვიტრაჟებისთვის დილის 10-დან 13 საათამდეა.
    ქუჩები ქვაფენილიანია და ოდნავ დახრილი, ტროტუარები ვიწრო და მანქანებით დაკავებული. ტუალეტი და ყავა
    უხვად ლადო ასათიანზე. საღამოს უბანი ცოცხლდება ბარებით, თუმცა შიგნით შესვლა უკვე ძნელია.
  route: >-
    სოლოლაკი თავისუფლების მოედნის უკანაა, ანუ ცენტრიდან 10 წუთია — მაგრამ ეს თბილისის ერთ-ერთი ყველაზე
    რთული უბანია პარკინგისთვის. ქუჩები ვიწროა, ცალმხრივი და ორივე მხრიდან მანქანებით სავსე; ადგილობრივები
    საკუთარ სახლთანაც ძლივს ჩერდებიან. ყველაზე გონივრულია მიწისქვეშა ანაზღაურებადი პარკინგი თავისუფლების
    მოედანთან და შემდეგ ფეხით ასვლა — უბანი ისედაც ფეხით სანახავია. თუ მაინც ქუჩაში აყენებ, გამოიყენე
    ლადო ასათიანის ზონალური ადგილები და შეამოწმე ნიშნები. ეკონომკლასის მცირე მანქანა აქ ერთადერთი გონივრული
    არჩევანია.
en:
  name: Sololaki and its Art Nouveau Entrances
  short: A nineteenth-century merchants' district under the ridge, where the best of it is inside the
    stairwells.
  body: >-
    **In Sololaki the facades are not the point; what matters is behind the doors.** The district lies
    south of Freedom Square at the foot of the Sololaki ridge, on ground that was once the khan's gardens
    — the name itself comes from the water channels that irrigated them.


    In the late nineteenth century, when Baku oil and Caucasian trade brought money into Tbilisi, the
    city's wealthy families built their houses here: Mantashev, Aramiants, Sarajishvili, Melik-Azarian.
    They followed European fashion, first eclectic historicism and then Art Nouveau, and they spent most
    of the budget where guests would see it — on the entrance hall and the stairs.


    The usual walking route covers Lado Asatiani, Amaghleba, Machabeli and Geronti Kikodze streets. Inside
    the stairwells you will find:


    - painted walls and ceilings, usually faded and partly fallen away


    - coloured glass in the roof lantern above the stairwell, throwing patterns down the steps


    - cast-iron balustrades and tiled floors that still carry the maker's stamp


    On Machabeli Street stands David Sarajishvili's mansion, built in the early 1900s and now the Writers'
    House, with the best-preserved interior in the district.


    One warning. These are private homes, not museums. Over the last decade many entrances have had keypad
    locks fitted, precisely because of the flow of visitors. If a door is open, go in quietly, do not
    ring apartment bells, and do not film in the corridors. Some residents are welcoming, some are tired
    of it, and both reactions are fair.


    The reason these stairwells are in the state they are in is straightforward. In the 1920s the Soviet
    authorities nationalised the large apartments and divided them: several families to a flat, one room
    each. The shared space — which is exactly the staircase, the entrance hall and the glass above it
    — belonged to nobody, and so nobody maintained it. That went on for eighty years. Some entrances have
    been restored recently through private effort and small city grants, but most are still waiting, and
    a few have simply lost their glass.
  tip: >-
    An hour and a half is enough for an unhurried walk. Expect half the doors to be locked; that is normal,
    not a failure. The best light for the stained glass is between about ten and one. The streets are
    cobbled and slightly sloped, and the pavements are narrow and lined with parked cars. Coffee and toilets
    are easy to find along Lado Asatiani. The district comes alive with bars in the evening, but by then
    getting inside a stairwell is much harder.
  route: >-
    Sololaki sits directly behind Freedom Square, ten minutes from the centre — and it is one of the hardest
    districts in Tbilisi to park in. The streets are narrow, mostly one-way and parked solid on both sides;
    residents struggle to stop outside their own front doors. The sensible approach is the paid underground
    car park at Freedom Square and then walking up, since the district has to be seen on foot anyway.
    If you do park on the street, use the metered bays on Lado Asatiani and read the signs. A small economy
    car is the only reasonable choice here.
ru:
  name: Сололаки и его парадные в стиле модерн
  short: Купеческий район XIX века под хребтом, где всё самое интересное находится внутри парадных.
  body: >-
    **В Сололаки дело не в фасадах, а в том, что за дверями.** Район лежит южнее площади Свободы, у подножия
    Сололакского хребта, на земле бывших ханских садов; само название связано с водоводами, которые эти
    сады орошали.


    В конце XIX века, когда бакинская нефть и кавказская торговля принесли в Тбилиси деньги, здесь построили
    дома богатые семьи города — Манташев, Арамянц, Сараджишвили, Мелик-Азарянц. Они следовали европейской
    моде, сначала эклектике, потом модерну, и тратили основную часть бюджета там, где это увидят гости:
    на вестибюль и лестницу.


    Обычный маршрут охватывает улицы Ладо Асатиани, Амаглеба, Мачабели и Геронти Кикодзе. В парадных вы
    найдёте:


    - расписные стены и потолки, чаще всего выцветшие и местами осыпавшиеся


    - цветное стекло в световом фонаре над лестницей, бросающее узоры на ступени


    - чугунные перила и плиточные полы с сохранившимся клеймом завода


    На улице Мачабели стоит особняк Давида Сараджишвили начала 1900-х, сегодня Дом писателей, с лучше
    всего сохранившимся интерьером в районе.


    Одно предупреждение. Это жилые дома, а не музеи. За последнее десятилетие на многих подъездах появились
    кодовые замки — именно из-за потока посетителей. Если дверь открыта, входите тихо, не звоните в квартиры
    и не снимайте видео в коридорах. Кто-то из жильцов приветлив, кто-то устал, и обе реакции законны.


    Объяснение тому, в каком состоянии эти парадные, простое. В 1920-х советская власть национализировала
    большие квартиры и разделила их: по нескольку семей на квартиру, по комнате на семью. Общее пространство
    — а это как раз лестница, вестибюль и стекло над ним — не принадлежало никому, и потому никто его
    не содержал. Так продолжалось восемьдесят лет. Часть подъездов в последние годы восстановили частными
    силами и небольшими городскими грантами, но большинство ещё ждёт, а кое-где стекло просто утрачено.
  tip: >-
    Полутора часов достаточно на неспешную прогулку. Рассчитывайте, что половина дверей будет закрыта:
    это норма, а не неудача. Лучший свет для витражей примерно с десяти до часа. Улицы мощёные и слегка
    наклонные, тротуары узкие и заставлены машинами. Кофе и туалеты легко найти вдоль Ладо Асатиани. Вечером
    район оживает барами, но попасть в парадную становится заметно труднее.
  route: >-
    Сололаки лежит прямо за площадью Свободы, в десяти минутах от центра, — и это один из самых трудных
    для парковки районов Тбилиси. Улицы узкие, в основном односторонние и плотно заставленные с обеих
    сторон; жители с трудом останавливаются у собственных подъездов. Разумнее оставить машину на платной
    подземной парковке у площади Свободы и подняться пешком, тем более что район всё равно смотрят пешком.
    Если паркуетесь на улице, используйте размеченные места на Ладо Асатиани и читайте знаки. Маленькая
    машина эконом-класса здесь единственный разумный выбор.
fa:
  name: سولولاکی و سردرهای آر نوو
  short: محلهٔ بازرگانان سدهٔ نوزدهم زیر ستیغ، که بهترین بخشش درون راه‌پله‌های ساختمان‌هاست.
  body: >-
    **در سولولاکی نما اهمیت ندارد؛ آنچه مهم است پشت درهاست.** محله جنوب میدان آزادی و در دامنهٔ ستیغ سولولاکی
    است، بر زمینی که روزی باغ‌های خان بود؛ خود نام از آبراهه‌هایی می‌آید که آن باغ‌ها را آبیاری می‌کرد.


    در اواخر سدهٔ نوزدهم، وقتی نفت باکو و بازرگانی قفقاز پول را به تفلیس آورد، خانواده‌های ثروتمند شهر
    خانه‌هایشان را اینجا ساختند: مانتاشف، آرامیانتس، سارجیشویلی، ملیک آزاریانتس. آنان از مد اروپایی پیروی
    می‌کردند، نخست التقاط تاریخ‌گرا و سپس آر نوو، و بیشتر بودجه را جایی خرج می‌کردند که مهمان می‌بیند:
    سرسرا و پلکان.


    مسیر معمول پیاده‌روی خیابان‌های لادو آساتیانی، آماغلبا، ماچابلی و گرونتی کیکودزه را دربر می‌گیرد.
    درون راه‌پله‌ها می‌بینید:


    - دیوارها و سقف‌های نقاشی‌شده که معمولاً رنگ‌باخته و بخشی ریخته‌اند


    - شیشه‌های رنگی در نورگیر بالای پلکان که نقش بر پله‌ها می‌اندازد


    - نرده‌های چدنی و کف‌های کاشی که هنوز مهر کارخانه‌شان پیداست


    در خیابان ماچابلی عمارت داوید سارجیشویلی از اوایل دههٔ ۱۹۰۰ ایستاده که امروز خانهٔ نویسندگان است و
    سالم‌ترین فضای داخلی محله را دارد.


    یک هشدار. اینها خانه‌های خصوصی‌اند نه موزه. در دههٔ گذشته بر بسیاری از درها قفل رمزی گذاشته‌اند، درست
    به سبب جریان بازدیدکنندگان. اگر دری باز بود بی‌سروصدا وارد شوید، زنگ آپارتمان‌ها را نزنید و در راهروها
    فیلم نگیرید. برخی ساکنان خوش‌آمد می‌گویند و برخی خسته‌اند، و هر دو واکنش بجاست.


    توضیح اینکه چرا این راه‌پله‌ها به این حال افتاده‌اند ساده است. در دههٔ ۱۹۲۰ حکومت شوروی آپارتمان‌های
    بزرگ را ملی و تقسیم کرد: چند خانواده در یک واحد و هر خانواده یک اتاق. فضای مشترک، یعنی دقیقاً همان
    پلکان و سرسرا و شیشهٔ بالای آن، به هیچ‌کس تعلق نداشت و در نتیجه کسی از آن نگهداری نکرد. این وضع هشتاد
    سال ادامه یافت. در سال‌های اخیر بخشی با همت خصوصی و کمک‌های کوچک شهرداری مرمت شده، اما بیشترشان هنوز
    در انتظارند و در چند مورد شیشه‌ها یکسره از میان رفته‌اند.
  tip: >-
    یک ساعت و نیم برای گردشی آرام کافی است. انتظار داشته باشید نیمی از درها بسته باشد؛ این عادی است نه
    شکست. بهترین نور برای شیشه‌های رنگی میان ساعت ده تا یک است. کوچه‌ها سنگفرش و کمی شیب‌دارند و پیاده‌روها
    باریک و پر از خودروی پارک‌شده. قهوه و سرویس بهداشتی در امتداد لادو آساتیانی فراوان است. عصرها محله
    با بارها جان می‌گیرد، اما آن وقت ورود به راه‌پله‌ها بسیار دشوارتر است.
  route: >-
    سولولاکی درست پشت میدان آزادی و ده دقیقه از مرکز شهر است، و یکی از سخت‌ترین محله‌های تفلیس برای پارک
    کردن. کوچه‌ها باریک و بیشتر یک‌طرفه‌اند و از دو سو پر از خودرو؛ ساکنان هم به‌زحمت جلوی خانهٔ خود می‌ایستند.
    کار عاقلانه استفاده از پارکینگ زیرزمینی پولی میدان آزادی و بالا رفتن پیاده است، چون محله به‌هرحال
    پیاده دیده می‌شود. اگر در خیابان پارک می‌کنید از جای‌های خط‌کشی‌شدهٔ لادو آساتیانی استفاده و تابلوها
    را بخوانید. خودروی اقتصادی کوچک اینجا تنها انتخاب معقول است.
he:
  name: סולולאקי וחדרי המדרגות בסגנון אר-נובו
  short: רובע סוחרים מן המאה ה-19 מתחת לרכס, שהמיטב שבו נמצא בתוך חדרי המדרגות.
  body: >-
    **בסולולאקי החזיתות אינן העיקר; מה שחשוב נמצא מאחורי הדלתות.** הרובע שוכן מדרום לכיכר החירות למרגלות
    רכס סולולאקי, על קרקע שהייתה פעם גני הח'אן; השם עצמו בא מתעלות המים שהשקו אותם.


    בשלהי המאה ה-19, כשנפט באקו והמסחר הקווקזי הביאו כסף לטביליסי, בנו כאן משפחות העשירים של העיר את בתיהן:
    מנתשב, ארמיאנץ, סרג'ישווילי, מליק-אזריאנץ. הם הלכו אחרי האופנה האירופית, תחילה אקלקטיקה ואחר כך אר-נובו,
    והוציאו את רוב התקציב במקום שהאורחים יראו: על הכניסה ועל המדרגות.


    מסלול ההליכה הרגיל כולל את הרחובות לאדו אסאטיאני, אמאגלבה, מאצ'אבלי וגרונטי קיקודזה. בתוך חדרי המדרגות
    תמצאו:


    - קירות ותקרות מצוירים, בדרך כלל דהויים וחלקם נשרו


    - זכוכית צבעונית בפנס הגג מעל המדרגות, המטילה דוגמאות על השלחים


    - מעקות יצוקים ורצפות אריחים שעליהן עדיין חותמת היצרן


    ברחוב מאצ'אבלי עומדת אחוזת דוד סרג'ישווילי מראשית שנות ה-1900, כיום בית הסופרים, ובה הפנים השמור ביותר
    ברובע.


    אזהרה אחת. אלה בתים פרטיים ולא מוזיאונים. בעשור האחרון הותקנו בכניסות רבות מנעולי קוד, בדיוק בגלל
    זרם המבקרים. אם דלת פתוחה, היכנסו בשקט, אל תצלצלו בפעמונים של הדירות ואל תצלמו וידאו במסדרונות. חלק
    מן הדיירים מסבירי פנים וחלק עייפו מזה, ושתי התגובות מוצדקות.


    ההסבר למצבם של חדרי המדרגות האלה פשוט. בשנות ה-20 הלאימו השלטונות הסובייטיים את הדירות הגדולות וחילקו
    אותן: כמה משפחות בדירה, חדר לכל אחת. השטח המשותף — כלומר בדיוק גרם המדרגות, חדר הכניסה והזכוכית שמעליו
    — לא היה שייך לאיש, ולכן איש לא תחזק אותו. כך נמשך הדבר שמונים שנה. חלק מן הכניסות שוחזרו לאחרונה
    במאמץ פרטי ובמענקים עירוניים קטנים, אך רובן עדיין ממתינות ובאחדות הזכוכית פשוט אבדה.
  tip: >-
    שעה וחצי מספיקה להליכה נינוחה. צפו שחצי מן הדלתות תהיינה נעולות; זה המצב הרגיל ולא כישלון. האור הטוב
    ביותר לוויטראז'ים הוא בין עשר לאחת בערך. הרחובות מרוצפי אבן ומעט משופעים, והמדרכות צרות ומלאות מכוניות
    חונות. קפה ושירותים נמצאים בקלות לאורך לאדו אסאטיאני. בערב הרובע מתעורר עם ברים, אך אז קשה בהרבה להיכנס
    לחדר מדרגות.
  route: >-
    סולולאקי ממש מאחורי כיכר החירות, עשר דקות מן המרכז — והוא אחד הרבעים הקשים ביותר לחניה בטביליסי. הרחובות
    צרים, ברובם חד-סטריים ותפוסים לחלוטין משני הצדדים; גם התושבים מתקשים לעצור מול ביתם. ההיגיון אומר
    להשאיר את הרכב בחניון התת-קרקעי בתשלום בכיכר החירות ולעלות ברגל, שכן את הרובע רואים ברגל בכל מקרה.
    אם אתם חונים ברחוב, השתמשו במקומות המסומנים בלאדו אסאטיאני וקראו את השילוט. רכב חסכוני קטן הוא הבחירה
    הסבירה היחידה כאן.
ar:
  name: سولولاكي ومداخلها بطراز الآرت نوفو
  short: حي تجّار من القرن التاسع عشر تحت الحافة، وأجمل ما فيه داخل بيوت الدرج.
  body: >-
    **في سولولاكي ليست الواجهات هي المقصد؛ المهم ما خلف الأبواب.** يقع الحي جنوب ميدان الحرية عند سفح
    حافة سولولاكي، على أرض كانت يوماً حدائق الخان؛ والاسم نفسه يعود إلى قنوات الماء التي كانت تسقيها.


    وفي أواخر القرن التاسع عشر، حين جلب نفط باكو وتجارة القوقاز المال إلى تبليسي، بنت أثرى عائلات المدينة
    بيوتها هنا: مانتاشيف وأرامیانتس وسارجيشفيلي وميليك أزاريانتس. وقد ساروا على الموضة الأوروبية، الانتقائية
    التاريخية أولاً ثم الآرت نوفو، وأنفقوا معظم الميزانية حيث يراها الضيف: على المدخل والدرج.


    ويشمل مسار المشي المعتاد شوارع لادو أساتياني وأماغليبا وماتشابيلي وغيرونتي كيكودزه. وداخل بيوت الدرج
    تجد:


    - جدراناً وأسقفاً مرسومة، باهتة غالباً وقد تساقط بعضها


    - زجاجاً ملوناً في فانوس السقف فوق الدرج يلقي نقوشه على الدرجات


    - درابزينات من الحديد الزهر وأرضيات بلاط ما زالت تحمل ختم المصنع


    وفي شارع ماتشابيلي يقوم قصر داويد سارجيشفيلي من مطلع القرن العشرين، وهو اليوم بيت الكتّاب، وفيه أفضل
    داخل محفوظ في الحي.


    وثمة تحذير واحد. هذه بيوت خاصة لا متاحف. وقد رُكّبت في العقد الأخير أقفال رقمية على مداخل كثيرة، وذلك
    تحديداً بسبب تدفق الزوار. فإن وجدت باباً مفتوحاً فادخل بهدوء، ولا تضغط أجراس الشقق ولا تصوّر فيديو
    في الممرات. بعض السكان مرحبون وبعضهم سئم، وكلا الموقفين مفهوم.


    وتفسير الحال التي آلت إليها بيوت الدرج هذه بسيط. ففي عشرينيات القرن الماضي أمّمت السلطات السوفييتية
    الشقق الكبيرة وقسّمتها: عدة عائلات في الشقة الواحدة، لكل منها غرفة. أما المساحة المشتركة، وهي بالضبط
    الدرج والردهة والزجاج فوقها، فلم تعد ملكاً لأحد، ومن ثمّ لم يعتنِ بها أحد. واستمر ذلك ثمانين عاماً.
    ورُمّم بعض المداخل في السنوات الأخيرة بجهد خاص ومنح بلدية صغيرة، لكن معظمها ما زال ينتظر، وبعضها فقد
    زجاجه تماماً.
  tip: >-
    ساعة ونصف تكفي لتجوّل متمهل. توقّع أن يكون نصف الأبواب مغلقاً؛ فهذا هو الوضع الطبيعي لا فشلاً. وأفضل
    ضوء للزجاج الملون بين العاشرة والواحدة تقريباً. والشوارع مرصوفة ومائلة قليلاً، والأرصفة ضيقة تصطف
    عليها السيارات. والقهوة ودورات المياه تُوجد بسهولة على امتداد لادو أساتياني. وفي المساء يستيقظ الحي
    بحاناته، لكن دخول بيوت الدرج يصير أصعب بكثير.
  route: >-
    تقع سولولاكي خلف ميدان الحرية مباشرة، على عشر دقائق من المركز، وهي من أصعب أحياء تبليسي في الوقوف.
    فالشوارع ضيقة، ومعظمها باتجاه واحد، ومصطفة بالسيارات على الجانبين؛ وحتى السكان يجدون صعوبة في التوقف
    أمام أبوابهم. والأعقل ترك السيارة في المرآب الأرضي المدفوع بميدان الحرية والصعود سيراً، فالحي يُرى
    مشياً على أي حال. وإن أوقفت في الشارع فاستخدم الأماكن المخططة في لادو أساتياني واقرأ اللافتات. وسيارة
    اقتصادية صغيرة هي الخيار المعقول الوحيد هنا.
