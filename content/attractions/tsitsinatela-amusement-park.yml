ka:
  name: ციცინათელას საოჯახო პარკი
  short: შეკვეთილის ატრაქციონების პარკი — გურიის სანაპიროზე ბავშვებთან ერთად საღამოს გატარების მთავარი
    ადგილი.
  body: >-
    **ციცინათელა შავი ზღვის ქართული სანაპიროს ყველაზე დიდი ატრაქციონების პარკია.** ის შეკვეთილში, ურეკიდან
    სულ რამდენიმე კილომეტრში, ფიჭვნარსა და მთავარ გზას შორისაა და ზაფხულის საღამოს ორივე კურორტის ბავშვიანი
    ოჯახები აქეთ მოდიან.

    სახელი — "ციცინათელა" — ქართულად ნათურა-მწერს ნიშნავს და პარკის ღამის განათებაზეა მინიშნება. სწორედ
    ეს არის მისი ლოგიკა: დღისით პარკი ცარიელი და ჩვეულებრივია, საღამოს შვიდის შემდეგ კი მთელი ტერიტორია
    ინთება და ივსება.

    რა არის შიგნით:

    - **მიმოხილვის ბორბალი** — ზემოდან ურეკის სანაპირო და ფიჭვნარი ჩანს

    - საბავშვო ატრაქციონები სამი წლიდან, ცალკე ზონა უფროსებისთვის

    - **სათამაშო ავტომატები** დახურულ პავილიონში, წვიმის დროს გამოსადეგი

    - საკვების ჯიხურები, ღია სცენა და ხშირად ცოცხალი მუსიკა შაბათ-კვირას

    ერთი რამ პირდაპირ უნდა ითქვას: ეს არ არის ევროპული დონის თემატური პარკი. ატრაქციონები საშუალო ზომისაა,
    ნაწილი ხანდაზმული და შესვლა თითოეულზე ცალკე იხდება. მოზარდისთვის, რომელიც დიდ ამერიკულ პარკებს ელოდება,
    ეს იმედგაცრუებაა. ხუთიდან თორმეტ წლამდე ბავშვისთვის კი — ზუსტად ის, რაც სჭირდება, და ბევრად უკეთესი,
    ვიდრე კიდევ ერთი საღამო პლაჟზე.

    სეზონი ივნისის დასაწყისიდან სექტემბრის შუამდეა. მის გარეთ პარკი დაკეტილია და მისვლას აზრი არ აქვს.
  tip: >-
    სამი საათი საღამოს. სეზონი ივნისიდან სექტემბრის შუამდეა — მის მიღმა ყველაფერი დაკეტილია. შესვლა უფასოა,
    თითოეულ ატრაქციონზე ცალკე იხდი; ბარათი შესასვლელთან ივსება. საუკეთესო დროა შვიდის შემდეგ, როცა ცხელა
    აღარ და განათება ინთება. ტუალეტი და კაფეები ტერიტორიაზეა. პარკინგი დიდი და უფასოა, მაგრამ შაბათს ივსება.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთისა და გრიგოლეთის გავლით ურეკამდე და კიდევ
    ოთხი კილომეტრი შეკვეთილისკენ — 324 კმ, დაახლოებით ოთხი საათი ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია.
    პარკი მთავარი გზის პირასაა და ღამით შორიდან ჩანს. საწვავი ლანჩხუთსა და ურეკშია. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია.
en:
  name: Tsitsinatela Family Park
  short: Shekvetili's amusement park — the main evening destination on the Gurian coast if you have children.
  body: >-
    **Tsitsinatela is the largest amusement park on Georgia's Black Sea coast.** It stands in Shekvetili,
    a few kilometres from Ureki, between the pine woods and the main road, and on summer evenings families
    from both resorts converge on it.

    The name means firefly in Georgian, a reference to how the place looks after dark. That is also its
    logic: by day the park is half-empty and unremarkable, but after seven the whole site lights up and
    fills.

    What is inside:

    - A **Ferris wheel** with a view over the Ureki shoreline and the pine belt

    - Rides for children from about three years old, and a separate zone for older ones

    - **Arcade machines** in a covered pavilion, useful when it rains

    - Food stalls, an open stage and often live music at weekends

    One thing should be said plainly: this is not a European-standard theme park. The rides are mid-sized,
    some are elderly, and each one is paid for separately. A teenager expecting a large American park
    will be disappointed. For a child between five and twelve it is exactly right, and a considerable
    improvement on another evening spent on the beach.

    The season runs from early June to mid-September. Outside those dates the park is shut and there is
    no point in driving over.
  tip: >-
    Three hours in the evening. The season is June to mid-September and everything is closed outside it.
    Entry is free and you pay per ride; cards are topped up at the gate. The best time is after seven,
    when the heat drops and the lights come on. Toilets and cafes are on site. The car park is large and
    free but fills on Saturdays.
  route: >-
    From Tbilisi take the E60 to Samtredia, then south through Lanchkhuti and Grigoleti to Ureki and four
    kilometres further towards Shekvetili — 324 km, about four hours forty-five. The road is asphalt throughout.
    The park sits directly on the main road and is visible from a distance after dark. Fuel is available
    at Lanchkhuti and Ureki. An economy car is entirely sufficient.
ru:
  name: Семейный парк «Цицинатела»
  short: Парк аттракционов в Шекветили — главное вечернее место на гурийском побережье, если вы с детьми.
  body: >-
    **«Цицинатела» — крупнейший парк аттракционов на грузинском побережье Чёрного моря.** Он стоит в Шекветили,
    в нескольких километрах от Уреки, между сосновым лесом и главной дорогой, и летними вечерами сюда
    стягиваются семьи с обоих курортов.

    Название по-грузински означает «светлячок» и намекает на то, как это место выглядит в темноте. В этом
    и вся логика: днём парк полупустой и ничем не примечательный, а после семи вся территория загорается
    и заполняется.

    Что внутри:

    - **Колесо обозрения** с видом на береговую линию Уреки и сосновую полосу

    - Аттракционы для детей примерно с трёх лет и отдельная зона для старших

    - **Игровые автоматы** в крытом павильоне, полезные в дождь

    - Киоски с едой, открытая сцена и по выходным нередко живая музыка

    Об одном стоит сказать прямо: это не тематический парк европейского уровня. Аттракционы среднего размера,
    часть из них немолода, и за каждый платят отдельно. Подросток, ожидающий большого американского парка,
    будет разочарован. Ребёнку от пяти до двенадцати — ровно то, что нужно, и заметно лучше, чем ещё один
    вечер на пляже.

    Сезон длится с начала июня до середины сентября. Вне этих дат парк закрыт и ехать сюда незачем.
  tip: >-
    Три часа вечером. Сезон с июня до середины сентября, вне его всё закрыто. Вход бесплатный, платят
    за каждый аттракцион; карту пополняют у входа. Лучшее время после семи, когда спадает жара и включается
    подсветка. Туалеты и кафе на территории. Парковка большая и бесплатная, но по субботам заполняется.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути и Григолети до Уреки и ещё четыре километра
    в сторону Шекветили — 324 км, около четырёх часов сорока пяти минут. Дорога асфальтированная всю дорогу.
    Парк стоит прямо у главной дороги и в темноте виден издалека. Заправки в Ланчхути и Уреки. Машины
    эконом-класса вполне достаточно.
fa:
  name: پارک خانوادگی تسیتسیناتلا
  short: شهربازی شکوتیلی — مقصد اصلی غروب‌های ساحل گوریا اگر کودک همراه دارید.
  body: >-
    **تسیتسیناتلا بزرگ‌ترین شهربازی ساحل دریای سیاه گرجستان است.** در شکوتیلی، چند کیلومتر با اورکی فاصله
    دارد و میان جنگل کاج و جادهٔ اصلی نشسته، و غروب‌های تابستان خانواده‌های هر دو تفرجگاه به آن سرازیر
    می‌شوند.

    نام آن در گرجی یعنی کرم شب‌تاب، اشاره‌ای به شکل این جا پس از تاریکی. منطق کار هم همین است: روزها پارک
    نیمه‌خالی و معمولی است و پس از ساعت هفت کل محوطه روشن و پر می‌شود.

    آنچه درون آن است:

    - **چرخ‌وفلک** با چشم‌اندازی به خط ساحلی اورکی و نوار کاج

    - وسایل بازی برای کودکان از حدود سه سال و بخشی جدا برای بزرگ‌ترها

    - **دستگاه‌های بازی** در سالنی سرپوشیده، که در باران به کار می‌آید

    - دکه‌های خوراک، صحنه‌ای روباز و اغلب موسیقی زنده در آخر هفته

    یک نکته را باید صریح گفت: این پارک موضوعی در سطح اروپا نیست. وسایل اندازهٔ متوسط دارند، بعضی کهنه‌اند
    و بهای هر یک جدا پرداخت می‌شود. نوجوانی که انتظار پارک بزرگ آمریکایی دارد سرخورده می‌شود. برای کودک
    پنج تا دوازده ساله دقیقاً همان چیز درست است، و بسیار بهتر از یک غروب دیگر روی ساحل.

    فصل از آغاز خرداد تا نیمهٔ شهریور است. بیرون از این تاریخ‌ها پارک بسته است و رفتن به آن بی‌معناست.
  tip: >-
    سه ساعت در غروب. فصل از خرداد تا نیمهٔ شهریور است و بیرون از آن همه‌چیز بسته. ورود رایگان است و بهای
    هر وسیله جدا؛ کارت را کنار ورودی شارژ می‌کنند. بهترین زمان پس از هفت است، وقتی گرما می‌شکند و چراغ‌ها
    روشن می‌شوند. سرویس بهداشتی و کافه در محوطه هست. پارکینگ بزرگ و رایگان است اما شنبه‌ها پر می‌شود.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی و گریگولتی تا اورکی و چهار کیلومتر بیشتر به
    سوی شکوتیلی — ۳۲۴ کیلومتر، حدود چهار ساعت و چهل‌وپنج دقیقه. جاده سرتاسر آسفالت است. پارک درست کنار
    جادهٔ اصلی است و شب‌ها از دور دیده می‌شود. سوخت در لانچخوتی و اورکی. خودروی اقتصادی کاملاً کافی است.
he:
  name: פארק המשפחות ציצינאטלה
  short: פארק השעשועים של שקווטילי — יעד הערב המרכזי בחוף גוריה אם יש אתכם ילדים.
  body: >-
    **ציצינאטלה הוא פארק השעשועים הגדול ביותר בחוף הים השחור של גאורגיה.** הוא עומד בשקווטילי, כמה קילומטרים
    מאורקי, בין יער האורנים לכביש הראשי, ובערבי קיץ נוהרות אליו משפחות משני אתרי הנופש.

    השם פירושו גחלילית בגאורגית, רמז לאיך שהמקום נראה אחרי רדת החשכה. זו גם ההיגיון שלו: ביום הפארק חצי
    ריק ולא מרשים, ואחרי שבע כל השטח נדלק ומתמלא.

    מה יש בפנים:

    - **גלגל ענק** עם נוף אל קו החוף של אורקי ואל חגורת האורנים

    - מתקנים לילדים מגיל שלוש בערך, ואזור נפרד לגדולים יותר

    - **מכונות משחק** בביתן מקורה, שימושיות בגשם

    - דוכני אוכל, במה פתוחה ולעתים קרובות מוזיקה חיה בסופי שבוע

    דבר אחד ראוי להיאמר בפשטות: זה אינו פארק שעשועים ברמה אירופית. המתקנים בינוניים בגודלם, חלקם ותיקים,
    ועל כל אחד משלמים בנפרד. נער שמצפה לפארק אמריקאי גדול יתאכזב. לילד בין חמש לשתים עשרה זה בדיוק מה
    שצריך, ושיפור ניכר על פני עוד ערב בחוף.

    העונה נמשכת מתחילת יוני עד אמצע ספטמבר. מחוץ לתאריכים האלה הפארק סגור ואין טעם לנסוע.
  tip: >-
    שלוש שעות בערב. העונה מיוני עד אמצע ספטמבר ומחוצה לה הכול סגור. הכניסה חינם ומשלמים לפי מתקן; את הכרטיס
    טוענים בשער. הזמן הטוב ביותר אחרי שבע, כשהחום יורד והתאורה נדלקת. שירותים ובתי קפה בשטח. החניון גדול
    וחינם אך מתמלא בשבתות.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי וגריגולטי עד אורקי ועוד ארבעה קילומטרים לכיוון
    שקווטילי — 324 ק״מ, כארבע שעות וארבעים וחמש. הכביש סלול לכל האורך. הפארק ניצב ממש על הכביש הראשי ונראה
    מרחוק אחרי החשכה. תדלוק בלנצ׳חותי ובאורקי. רכב חסכוני מספיק לחלוטין.
ar:
  name: حديقة تسيتسيناتيلا العائلية
  short: مدينة ملاهي شيكفيتيلي — الوجهة المسائية الأولى على ساحل غوريا إن كان معك أطفال.
  body: >-
    **تسيتسيناتيلا أكبر مدينة ملاهٍ على ساحل جورجيا على البحر الأسود.** تقوم في شيكفيتيلي على بعد كيلومترات
    من أوريكي، بين غابة الصنوبر والطريق الرئيسي، وفي أمسيات الصيف تتقاطر عليها العائلات من المنتجعين.

    والاسم يعني اليراعة بالجورجية، إشارة إلى هيئة المكان بعد المغيب. وهذا منطقه أيضاً: نهاراً تكون الحديقة
    نصف خالية وعادية، وبعد السابعة يضيء الموقع كله ويمتلئ.

    ما في الداخل:

    - **عجلة دوارة** تطل على خط ساحل أوريكي وحزام الصنوبر

    - ألعاب للأطفال من نحو الثالثة، ومنطقة منفصلة للأكبر سناً

    - **أجهزة ألعاب** في جناح مسقوف، تنفع عند المطر

    - أكشاك طعام ومسرح مكشوف وموسيقى حية في العطلات غالباً

    وينبغي قول أمر بصراحة: هذه ليست مدينة ألعاب بمعايير أوروبية. الألعاب متوسطة الحجم وبعضها قديم، ويُدفع
    عن كل واحدة على حدة. والمراهق الذي ينتظر مدينة أمريكية كبيرة سيخيب. أما للطفل بين الخامسة والثانية
    عشرة فهي المكان الصحيح تماماً، وأفضل بكثير من أمسية أخرى على الشاطئ.

    الموسم من مطلع يونيو إلى منتصف سبتمبر. وخارج هذه المواعيد تكون مغلقة ولا معنى للقيادة إليها.
  tip: >-
    ثلاث ساعات مساءً. الموسم من يونيو إلى منتصف سبتمبر وكل شيء مغلق خارجه. الدخول مجاني وتدفع عن كل لعبة؛
    وتُشحن البطاقة عند البوابة. أفضل وقت بعد السابعة حين تنكسر الحرارة وتضاء الأنوار. دورات المياه والمقاهي
    داخل الموقع. الموقف كبير ومجاني لكنه يمتلئ أيام السبت.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي وغريغوليتي إلى أوريكي وأربعة كيلومترات نحو
    شيكفيتيلي — 324 كم، نحو أربع ساعات وخمس وأربعين دقيقة. الطريق معبّد كله. والحديقة على الطريق الرئيسي
    مباشرة وتُرى من بعيد بعد المغيب. الوقود في لانتشخوتي وأوريكي. وسيارة اقتصادية تكفي تماماً.
