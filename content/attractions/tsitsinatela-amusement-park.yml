ka:
  name: ციცინათელას საოჯახო პარკი
  short: >-
    საღამოს ატრაქციონები შეკვეთილის ფიჭვნარში: თეთრი ეშმაკის ბორბალი წითელი კაბინებით, ბავშვების გართობა
    და შუქი, რომელიც მზის ჩასვლისას ინთება.
  body: >-
    **„ციცინათელა“ ღამის პარკია — დღისით სახელიც არ შეეფერება.** მზიან შუადღეს შეკვეთილის ფიჭვნარსა და
    სანაპირო გზას შორის მხოლოდ გაჩერებული ატრაქციონები და დაცარიელებული ბილიკები დაგხვდებათ. საღამოს შვიდის
    შემდეგ კი ნათურები ინთება, მუსიკა ჩაირთვება, ურეკიდან და შეკვეთილიდან ბავშვიანი ოჯახები ნელ-ნელა იყრიან
    თავს და მთელი პარკი ზუზუნს იწყებს.


    ფიჭვნარი პარკზე ბევრად ხნიერია. 1949 წელს გადაწყდა, რომ გურიის ზღვისპირეთი საკურორტო ზოლად უნდა ქცეულიყო,
    და ქობულეთიდან ფოთამდე, ორმოცდაათიოდე კილომეტრზე, ბიჭვინთის ფიჭვი გააშენეს. დღეს სწორედ მისი ფისის
    სურნელით გაჟღენთილი ჩრდილი აკრავს პარკს და უქარო საღამოს წიწვისა და შაქრის ბამბის სუნი ერთმანეთში
    ირევა.


    რას ნახავთ:

    - **ეშმაკის ბორბალს** — თეთრს, წითელი კაბინებით; გზიდან პირველად სწორედ ის მოჩანს, ზემოდან კი ფიჭვნარი
    და ზღვის ზოლი იშლება

    - პატარა საოჯახო ამერიკულ გორაკს (პარკის დიდი, ინვერსიული ამერიკული გორაკი ამჟამად არ მუშაობს)

    - ატრაქციონებს სამი წლის ბავშვებიდან და ცალკე ზონას უფროსებისთვის

    - დახურულ **სათამაშო პავილიონს** მოულოდნელი წვიმისთვის, საჭმლის ჯიხურებსა და პატარა ღია სცენას


    პირდაპირ ვთქვათ: ეს პროვინციული გასართობი პარკია და არა ევროპული თემატური. ატრაქციონები საშუალო ზომისაა,
    თითოეულში ცალკე იხდით, და დიდ პარკებს ნაჩვევი მოზარდი მხრებს აიჩეჩავს. ხუთიდან თორმეტ წლამდე ბავშვისთვის
    კი ეს ამ სანაპიროს საუკეთესო საღამოა.


    შეკვეთილის სამხრეთ კიდეზე, სადაც ნატანები და ჩოლოქი ზღვას ერთვის, ოდესღაც წმინდა ნიკოლოზის სიმაგრე
    იდგა. 1853 წლის 15 ოქტომბერს სასიკვდილოდ დაჭრილმა გიორგი გურიელმა აქ გურულთა ლაშქრის სარდლობა თექვსმეტი
    წლის შვილს, ესეს, გადაულოცა. სიმაგრისგან აღარაფერი დარჩა — 1920-იან წლებში მისი ქვებით ქვემო ნატანებში
    ფაბრიკა ააშენეს — და ღამით ამ ნაპირზე ყველაზე კაშკაშა შუქი ახლა „ციცინათელასია“.
  tip: >-
    მოდით შვიდის შემდეგ, როცა სიცხე იკლებს და შუქი ინთება, და ორი-სამი საათი დაუთმეთ. პარკი საზაფხულოა
    და, როგორც წესი, დაახლოებით ივნისიდან სექტემბრის შუა რიცხვებამდე მუშაობს; სეზონის გარეთ დაკეტილია,
    ამიტომ სპეციალურად ჩამოსვლამდე გადაამოწმეთ. თითოეულ ატრაქციონში ცალკე იხდით; როგორ ხდება გადახდა მიმდინარე
    სეზონში, შესასვლელთან იკითხეთ. ტუალეტი და კაფეები ტერიტორიაზეა. ივლის-აგვისტოს შაბათ საღამოს ავტოსადგომი
    ივსება, ამიტომ რვამდე მოსვლა სჯობს. ბორბლისთვის თხელი ქურთუკი წამოიღეთ: ზემოთ ზღვის ნიავი მოსალოდნელზე
    გრილია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთ-დასავლეთით,
    ლანჩხუთის გავლით, ზღვისპირა გრიგოლეთამდე. იქ მარცხნივ, ს2 (E70) გზაზე გადაუხვიეთ და ნაპირს სამხრეთისკენ,
    ურეკის გავლით მიჰყევით შეკვეთილამდე — 312 კმ, დაახლოებით ოთხი საათი და თხუთმეტი წუთი. გზა ბოლომდე
    ასფალტიანია: სამტრედიამდე სწრაფი, უმეტესად ოთხზოლიანი, შემდეგ ჩვეულებრივი ორზოლიანი, სოფლებში გამავალი,
    სადაც გზაზე ძროხაც მოძრაობის სრულუფლებიანი მონაწილეა. საწვავი ლანჩხუთსა და ურეკშია. პარკი გზის პირასაა,
    ბორბალი კი ღამით შორიდანვე მოჩანს. ეკონომ-კლასის მანქანა სრულიად საკმარისია.
en:
  name: Tsitsinatela Family Park
  short: >-
    An evening funfair in the Shekvetili pines: a white Ferris wheel with red cabins, rides for small
    children and lights that come on at dusk.
  body: >-
    **Tsitsinatela means "firefly" in Georgian, and the park only makes sense after dark.** By day it
    is a quiet yard of painted rides between the coast road and the pines of Shekvetili. Around seven
    the bulbs come on, the music starts, and families from Ureki and Shekvetili drift in until the whole
    place hums.


    The pines are older than the fun. In 1949 the Soviet authorities decided to turn the Gurian shore
    into a resort strip, and Pitsunda pine was planted along some fifty kilometres of coast between Kobuleti
    and Poti. That resinous shade now frames the park, and on a still evening pine needles and candyfloss
    share the same air.


    What to expect:

    - the **Ferris wheel**, white with red cabins, the landmark you see from the road; from the top, the
    pine belt and the line of the sea

    - a small family roller coaster (the park's big inverted coaster stands idle)

    - rides for children from about three, and a separate zone for older ones

    - a covered **arcade pavilion** for the inevitable shower, food stalls and a small open stage


    Be clear-eyed: this is a provincial funfair, not a European theme park. The rides are mid-sized, each
    is paid for separately, and a teenager who knows the big parks will shrug. For a child between five
    and twelve, it is the best evening on this stretch of coast.


    At the southern edge of Shekvetili, where the Natanebi and Choloki meet the sea, stood the fort of
    St Nicholas. There, on 15 October 1853, the mortally wounded Giorgi Gurieli handed command of the
    Gurian militia to his sixteen-year-old son, Ese. Nothing of the fort survives — in the 1920s its stones
    were carted off to build a factory in Kvemo Natanebi — and at night the brightest lights on this shore
    are the park's.
  tip: >-
    Come after seven, when the heat breaks and the lights come on, and allow two to three hours. The park
    is a summer operation, usually open from about June to mid-September; outside the season it is shut,
    so check before making a special trip. Each ride is paid for separately; ask at the gate how payment
    works this season. Toilets and cafés are on site. The car park fills on Saturday evenings in July
    and August, so arrive before eight. Bring a light jacket for the wheel: the sea breeze at the top
    is cooler than you expect.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then the S12 south-west through Lanchkhuti
    to Grigoleti on the coast. There turn left onto the S2 (E70) and follow the shore south past Ureki
    to Shekvetili — 312 km, about four hours fifteen. It is asphalt all the way: fast, largely dual carriageway
    to Samtredia, then an ordinary two-lane road through villages, where cattle on the tarmac are part
    of the traffic. Fuel in Lanchkhuti and Ureki. The park sits right by the road and its wheel is visible
    from afar after dark. An economy car is all you need.
ru:
  name: Семейный парк «Цицинатела»
  short: >-
    Вечерний парк развлечений в соснах Шекветили: белое колесо обозрения с красными кабинками, аттракционы
    для малышей и огни, что зажигаются в сумерках.
  body: >-
    **«Цицинатела» по-грузински означает «светлячок», и парк обретает смысл только после наступления темноты.**
    Днём это тихий двор с раскрашенными аттракционами между приморской дорогой и соснами Шекветили. Около
    семи вечера загораются лампочки, начинает играть музыка, и семьи из Уреки и Шекветили стягиваются
    сюда, пока всё вокруг не начинает гудеть.


    Сосны старше всех этих развлечений. В 1949 году советские власти решили превратить гурийский берег
    в курортную полосу, и на пятидесяти километрах побережья между Кобулети и Поти высадили пицундскую
    сосну. Эта смолистая тень теперь обрамляет парк, и в тихий вечер хвоя и сахарная вата делят один и
    тот же воздух.


    Что вас ждёт:

    - **колесо обозрения** — белое, с красными кабинками, ориентир, который виден с дороги; сверху — сосновая
    полоса и линия моря

    - небольшие семейные американские горки (большие инвертированные горки парка не работают)

    - аттракционы для детей примерно от трёх лет и отдельная зона для более старших

    - крытый **игровой павильон** на случай неизбежного дождя, продуктовые палатки и небольшая открытая
    сцена


    Будьте честны с собой: это провинциальный луна-парк, а не европейский тематический парк. Аттракционы
    среднего размера, за каждый платят отдельно, и подросток, знающий большие парки, лишь пожмёт плечами.
    А вот для ребёнка от пяти до двенадцати лет это лучший вечер на этом участке побережья.


    На южной окраине Шекветили, где Натанеби и Чолоки встречаются с морем, стояла крепость Святого Николая.
    Там, 15 октября 1853 года, смертельно раненый Гиорги Гуриели передал командование гурийским ополчением
    своему шестнадцатилетнему сыну Есе. От крепости ничего не осталось — в 1920-х годах её камни увезли
    на строительство завода в Квемо-Натанеби, — и по ночам самые яркие огни на этом берегу — огни парка.
  tip: >-
    Приходите после семи, когда спадает жара и загораются огни, и рассчитывайте на два-три часа. Парк
    работает летом, обычно примерно с июня до середины сентября; вне сезона он закрыт, так что перед специальной
    поездкой уточните. За каждый аттракцион платят отдельно; как устроена оплата в этом сезоне, спросите
    у входа. Туалеты и кафе есть на территории. Стоянка заполняется по субботним вечерам в июле и августе,
    так что приезжайте до восьми. Возьмите лёгкую куртку для колеса обозрения: морской ветер наверху прохладнее,
    чем можно ожидать.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юго-запад через
    Ланчхути до Григолети на побережье. Там поверните налево, на S2 (E70), и следуйте вдоль берега на
    юг через Уреки до Шекветили — 312 км, около четырёх часов пятнадцати минут. Дорога асфальтирована
    на всём протяжении: быстрая, в основном двухполосная в каждую сторону до Самтредиа, затем обычная
    двухполосная дорога через деревни, где скот на асфальте — часть движения. Заправка в Ланчхути и Уреки.
    Парк стоит прямо у дороги, и его колесо видно издалека в темноте. Машины эконом-класса вполне достаточно.
fa:
  name: پارک خانوادگی تسیتسیناتلا
  short: >-
    شهربازی شامگاهی در کاج‌های شکوتیلی: چرخ‌وفلکی سفید با کابین‌های سرخ، بازی‌هایی برای کودکان خرد، و
    چراغ‌هایی که در گرگ‌ومیش روشن می‌شوند.
  body: >-
    **«تسیتسیناتلا» به گرجی «کرم شب‌تاب» معنا می‌دهد، و پارک تنها پس از تاریکی معنایی می‌یابد.** روزها
    اینجا حیاطی آرام از بازی‌های رنگ‌شده میان راه ساحلی و کاج‌های شکوتیلی است. نزدیک ساعت هفت لامپ‌ها
    روشن می‌شوند، موسیقی آغاز می‌شود، و خانواده‌هایی از اورکی و شکوتیلی رفته‌رفته می‌آیند تا همه‌جا به
    همهمه بیفتد.


    کاج‌ها از این تفریح کهن‌ترند. در ۱۹۴۹ مقامات شوروی تصمیم گرفتند ساحل گوریا را به نواری تفریحی بدل
    کنند، و کاج پیتسوندا بر حدود پنجاه کیلومتر از ساحل میان کوبولتی و پوتی کاشته شد. آن سایهٔ رزین‌آلود
    اکنون پارک را در بر می‌گیرد، و در شامگاهی آرام، سوزن‌های کاج و پنبهٔ قندی در یک هوا درهم می‌آمیزند.


    چه انتظاری داشته باشید:

    - **چرخ‌وفلک**، سفید با کابین‌های سرخ، نشانه‌ای که از راه دیده می‌شود؛ از بالا، کمربند کاج و خط دریا

    - ترن هوایی کوچکی برای خانواده‌ها (ترن هوایی بزرگ و وارونهٔ پارک فعلاً کار نمی‌کند)

    - بازی‌هایی برای کودکان از حدود سه‌سالگی، و ناحیه‌ای جدا برای بزرگ‌ترها

    - **غرفهٔ بازی سرپوشیده‌ای** برای بارانی که ناگزیر می‌آید، غرفه‌های غذا و صحنه‌ای کوچک و باز


    روشن‌بین باشید: این شهربازی‌ای استانی است، نه پارک موضوعی اروپایی. بازی‌ها اندازه‌ای میانه دارند،
    برای هر یک جدا پرداخت می‌شود، و نوجوانی که پارک‌های بزرگ را می‌شناسد شانه بالا می‌اندازد. اما برای
    کودکی میان پنج تا دوازده سال، این بهترین شامگاه در این بخش از ساحل است.


    در منتهی‌الیه جنوبی شکوتیلی، جایی که ناتانبی و چولوکی به دریا می‌رسند، قلعهٔ نیکلای قدیس ایستاده بود.
    آن‌جا، در ۱۵ اکتبر ۱۸۵۳، گیورگی گوریِلی، که زخمی مرگبار برداشته بود، فرماندهی نیروهای گوریایی را به
    پسر شانزده‌ساله‌اش، اسه، سپرد. از قلعه چیزی باقی نمانده — در دههٔ ۱۹۲۰ سنگ‌هایش را برای ساخت کارخانه‌ای
    در کوئمو-ناتانبی بردند — و شب‌ها روشن‌ترین نورهای این ساحل، نورهای پارک است.
  tip: >-
    پس از هفت بیایید، آنگاه که گرما فرومی‌نشیند و چراغ‌ها روشن می‌شوند، و دو تا سه ساعت در نظر بگیرید.
    پارک تابستانی است و معمولاً از حدود ژوئن تا نیمهٔ سپتامبر باز است؛ بیرون از فصل بسته است، پس پیش از
    سفر ویژه از باز بودنش مطمئن شوید. برای هر بازی جداگانه پرداخت می‌شود؛ شیوهٔ پرداخت در این فصل را دم
    ورودی بپرسید. سرویس‌های بهداشتی و کافه‌ها در محل‌اند. پارکینگ در عصرهای شنبه در ژوئیه و اوت پر می‌شود،
    پس پیش از هشت برسید. برای چرخ‌وفلک ژاکتی سبک بیاورید: نسیم دریا در بالا خنک‌تر از انتظار است.
  route: >-
    از تبیلیسی از راه S1 (E60) به سوی غرب، از کوتایسی گذشته، تا سامتردیا برانید، سپس از S12 به سوی جنوب‌غرب،
    از لانچخوتی گذشته، تا گریگولتی بر ساحل. آن‌جا به‌سوی چپ، به S2 (E70) بپیچید و ساحل را به‌سوی جنوب،
    از اورکی گذشته، تا شکوتیلی دنبال کنید — ۳۱۲ کیلومتر، حدود چهار ساعت و پانزده دقیقه. تمام راه آسفالت
    است: سریع، بیشتر دوخطه در هر سو تا سامتردیا، سپس راهی دوخطهٔ معمولی از میان روستاها، جایی که دام‌ها
    بر آسفالت بخشی از ترافیک‌اند. سوخت در لانچخوتی و اورکی. پارک درست کنار راه است و چرخ‌وفلکش شب‌ها از
    دور دیده می‌شود. خودرویی اقتصادی کافی است.
he:
  name: פארק המשפחות ציצינאטלה
  short: >-
    פארק שעשועים ערבי בין האורנים של שקווטילי: גלגל ענק לבן עם תאים אדומים, מתקנים לילדים קטנים, ואורות
    שנדלקים בדמדומים.
  body: >-
    **"ציצינאטלה" פירושו "גחלילית" בגאורגית, והפארק מתחיל להיות הגיוני רק לאחר החשכה.** ביום זוהי חצר
    שקטה של מתקנים צבועים בין כביש החוף לאורנים של שקווטילי. בסביבות שבע נדלקות הנורות, המוזיקה מתחילה,
    ומשפחות מאורקי ומשקווטילי נודדות לשם עד שכל המקום הומה.


    האורנים ותיקים יותר מהשעשועים. ב־1949 החליטו השלטונות הסובייטים להפוך את חוף גוריה לרצועת אתרי נופש,
    ואורן פיצונדה ניטע על פני כחמישים קילומטרים של חוף בין קובולטי לפוטי. הצל השרפי הזה ממסגר כעת את הפארק,
    ובערב שקט מחטי האורן וצמר הגפן המתוק חולקים את אותו האוויר.


    למה לצפות:

    - **הגלגל הענק**, לבן עם תאים אדומים, ציון הדרך שנראה מהכביש; מלמעלה, רצועת האורנים וקו הים

    - רכבת הרים משפחתית קטנה (רכבת ההרים ההפוכה הגדולה של הפארק אינה פועלת)

    - מתקנים לילדים מגיל שלוש בערך, ואזור נפרד לילדים גדולים יותר

    - **ביתן ארקייד** מקורה למקרה הגשם הבלתי נמנע, דוכני אוכל ובימת הופעות קטנה ופתוחה


    היו כנים עם עצמכם: זהו פארק שעשועים פרובינציאלי, לא פארק נושא אירופי. המתקנים בגודל בינוני, משלמים
    על כל אחד בנפרד, ומתבגר שמכיר את הפארקים הגדולים ימשוך בכתפיים. אבל לילד בין חמש לשתים־עשרה, זהו הערב
    הטוב ביותר בקטע החוף הזה.


    בקצה הדרומי של שקווטילי, במקום שבו נטנבי וצ׳ולוקי נפגשים עם הים, עמד מבצר ניקולאי הקדוש. שם, ב-15
    באוקטובר 1853, מסר גיורגי גוריאלי, שנפצע אנושות, את הפיקוד על המיליציה הגוריאנית לבנו בן השש־עשרה,
    אסה. לא נותר דבר מהמבצר — בשנות ה־1920 נלקחו אבניו לבניית מפעל בקוומו נטנבי — ובלילה האורות הבוהקים
    ביותר על החוף הזה הם אלה של הפארק.
  tip: >-
    בואו אחרי שבע, כשהחום שוכך והאורות נדלקים, והקצו שעתיים עד שלוש. הפארק פועל בקיץ, בדרך כלל בערך מיוני
    עד אמצע ספטמבר; מחוץ לעונה הוא סגור, לכן בדקו לפני שאתם נוסעים במיוחד. משלמים על כל מתקן בנפרד; שאלו
    בשער איך מתבצע התשלום העונה. שירותים ובתי קפה נמצאים במקום. מגרש החנייה מתמלא בשבתות בערב ביולי ובאוגוסט,
    אז הגיעו לפני שמונה. הביאו מעיל קל לגלגל הענק: בריזת הים בראש הגלגל קרירה יותר מהמצופה.
  route: >-
    מטביליסי סעו ב-S1 (E60) מערבה, דרך קוטאיסי, עד סמטרדיה, ואז ב-S12 דרומית-מערבית, דרך לנצ׳חוטי, עד
    גריגולטי על החוף. שם פנו שמאלה ל-S2 (E70) והמשיכו לאורך החוף דרומה, דרך אורקי, עד שקווטילי — 312 ק״מ,
    כארבע שעות ורבע. כל הדרך אספלט: מהיר, ברובו כביש דו-מסלולי עד סמטרדיה, ואז כביש דו-נתיבי רגיל שחוצה
    כפרים, שבו בקר על הכביש הוא חלק מהתנועה. תדלוק בלנצ׳חוטי ובאורקי. הפארק ממוקם ממש לצד הכביש והגלגל
    שלו נראה מרחוק בחושך. רכב אקונומי מספיק.
ar:
  name: منتزه تسيتسيناتيلا العائلي
  short: >-
    مدينة ملاهٍ مسائية بين أشجار صنوبر شكفيتيلي: عجلة فيريس بيضاء بمقصورات حمراء، وألعاب للأطفال الصغار،
    وأنوار تُضاء عند الغسق.
  body: >-
    **تعني «تسيتسيناتيلا» «يراعة» بالجورجية، ولا معنى للمتنزه إلا بعد حلول الظلام.** نهارًا هو ساحة هادئة
    من الألعاب الملونة بين طريق الساحل وصنوبر شكفيتيلي. ونحو الساعة السابعة تُضاء المصابيح، وتبدأ الموسيقى،
    وتتقاطر عائلات من أوريكي وشكفيتيلي حتى يعمّ المكان كله دويّ.


    أشجار الصنوبر أقدم من هذا المرح. في عام 1949 قررت السلطات السوفيتية تحويل ساحل غوريا إلى شريط منتجعات،
    فزُرع صنوبر بيتسوندا على نحو خمسين كيلومترًا من الساحل بين كوبوليتي وبوتي. وذلك الظل العبق بالراتنج
    يؤطر الآن المتنزه، وفي مساء ساكن يتشارك عبير الصنوبر وغزل البنات نفس الهواء.


    ما يمكن أن تتوقعه:

    - **عجلة فيريس**، بيضاء بمقصورات حمراء، المعلَم الذي تراه من الطريق؛ ومن أعلاها، حزام الصنوبر وخط
    البحر

    - قطار أفعوانيّ عائلي صغير (أما الأفعوانية المقلوبة الكبيرة في المتنزه فمتوقفة عن العمل)

    - ألعاب للأطفال من عمر ثلاث سنوات تقريبًا، ومنطقة منفصلة للأكبر سنًّا

    - **جناح ألعاب مغطّى** للمطر المحتوم، وأكشاك طعام، ومسرح صغير مكشوف


    كن واضح النظر: هذه مدينة ملاهٍ إقليمية، لا مدينة ملاهٍ أوروبية ذات طابع موضوعي. الألعاب متوسطة الحجم،
    ويُدفع لكل واحدة على حدة، وأي فتى يعرف المتنزهات الكبيرة سيهزّ كتفيه. لكن لطفل بين خمس واثنتي عشرة
    سنة، هذا أفضل مساء في هذا الجزء من الساحل.


    على الحافة الجنوبية لشكفيتيلي، حيث يلتقي ناتانيبي وتشولوكي بالبحر، كانت تقف قلعة القديس نيقولاوس.
    هناك، في 15 أكتوبر 1853، سلّم غيورغي غورييلي، المصاب إصابة قاتلة، قيادة ميليشيا غوريا إلى ابنه إيسه
    البالغ من العمر ستة عشر عامًا. لم يبقَ من القلعة شيء — في عشرينيات القرن العشرين حُمِلت حجارتها لبناء
    مصنع في كفيمو ناتانيبي — وفي الليل تبقى أسطع الأنوار على هذا الساحل أنوار المتنزه.
  tip: >-
    تعال بعد الساعة السابعة، حين يخفّ الحر وتُضاء الأنوار، وخصص من ساعتين إلى ثلاث. المتنزه صيفي، ويعمل
    عادةً من نحو يونيو إلى منتصف سبتمبر؛ وهو مغلق خارج الموسم، فتحقّق من ذلك قبل القيام برحلة خاصة. ويُدفع
    لكل لعبة على حدة؛ واسأل عند البوابة عن طريقة الدفع في الموسم الحالي. المراحيض والمقاهي في الموقع.
    يمتلئ موقف السيارات مساءات السبت في يوليو وأغسطس، فتعال قبل الثامنة. احمل سترة خفيفة من أجل العجلة:
    نسيم البحر في أعلى العجلة أبرد مما تتوقع.
  route: >-
    من تبليسي اتخذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم الطريق S12 جنوب غربًا عبر لانتشخوتي
    حتى غريغوليتي على الساحل. هناك انعطف يسارًا إلى S2 (E70) واتبع الساحل جنوبًا مرورًا بأوريكي حتى شكفيتيلي
    — 312 كم، أي نحو أربع ساعات وربع. الطريق مُعبَّد بالكامل: سريع، وذو مسارين مزدوجين في معظمه حتى سامتريديا،
    ثم طريق عادي بمسارين يعبر القرى، حيث تكون الأبقار على الإسفلت جزءًا من حركة السير. الوقود في لانتشخوتي
    وأوريكي. يقع المتنزه مباشرة قرب الطريق وتُرى عجلته من بعيد ليلًا. تكفي سيارة اقتصادية.
