ka:
  name: ნარიყალას ციხე
  short: >-
    სოლოლაკის ქედზე გადაჭიმული თექვსმეტსაუკუნოვანი გალავანი ძველი ქალაქის თავზე — თბილისის ციტადელი, მისი
    უძველესი სილუეტი და ყველაზე ფართო ხედი.
  body: >-
    **თექვსმეტი საუკუნის მანძილზე ვინც ამ ქედს ფლობდა, თბილისსაც ის ფლობდა.**


    პირველი ციხე ამ კლდეზე IV საუკუნის მეორე ნახევარში აიგო. ძველი ქართული წყაროები მის აშენებას სპარსელ
    ერისთავს მიაწერენ, რომელსაც აქედან მცხეთაში მჯდომი ქართლის მეფისთვის უნდა ეთვალთვალა; ერთ-ერთი ნუსხა
    ციხეს „შურისციხედ“ იხსენიებს. გვიანდელმა გადმოცემამ ეს პატივი ვახტანგ გორგასალს მიაკუთვნა. არაბებმა
    ციხე გააფართოვეს, დავით აღმაშენებელმა გაამაგრა, დღეს შემორჩენილი სიმაგრეების უმეტესობა კი XVI–XVII
    საუკუნეებისაა. სახელი „ნარიყალა“ მხოლოდ XVII საუკუნეში ჩნდება — სპარსული „ნარინ ყალადან“, რაც შიდაციხეს,
    ციტადელს ნიშნავს. იმავე საუკუნეში ოსმალო მოგზაურმა ევლია ჩელებიმ ციხეს სამოცდაათი ბურჯი მიაწერა —
    გადაჭარბებით, მაგრამ ზუსტად იმ შთაბეჭდილების ზომით, რომელიც მასზე ციხემ მოახდინა.


    ციხე ორმა დარტყმამ დაანგრია. 1827 წლის მიწისძვრამ კედლები, ბურჯები და სტამბოლის გოდოლის დიდი ნაწილი
    ჩამოაქცია, 1847 წელს კი რუსული ჯარის დენთის საწყობი აფეთქდა და ციხის შიგნით თითქმის ყველაფერი, წმინდა
    ნიკოლოზის ეკლესიაც, მიწასთან გაასწორა. გზამკვლევები ორივე ამბავს ხშირად ერთ მეხის დაცემაში აერთიანებენ.
    სინამდვილე ნაკლებად მოწესრიგებულია.


    რას დაინახავთ:


    - ორ ერთმანეთთან დაკავშირებულ ეზოს — კვადრატულ აღმოსავლეთისას და წაგრძელებულ დასავლეთისას, აგურითა
    და ნატეხი ქვით ნაგებ გალავანში

    - სტამბოლის გოდოლს დასავლეთი ნაწილის უმაღლეს წერტილზე — ციხის ყველაზე კარგად შემონახულ ნაწილს

    - წმინდა ნიკოლოზის ეკლესიას, 1990-იან წლებში შუა საუკუნეების საძირკველზე აღდგენილსა და ბიბლიური და
    ქართული ისტორიული სცენებით მოხატულს

    - ხედს: გოგირდის აბანოების აგურის გუმბათებს, მტკვრის ხიდებს, მეტეხსა და სამებას

    - „ქართლის დედას“ — ელგუჯა ამაშუკელის 20-მეტრიან ქანდაკებას, პირველად 1958 წელს აღმართულს, ქედზე დასავლეთით,
    სულ რამდენიმე წუთის სავალზე


    ბილეთი არ იყიდება და კარი არასდროს იკეტება. შებინდებისას მოდით, დღის მზით ჯერ კიდევ გამთბარ ქვაზე
    ჩამოჯექით და უყურეთ, როგორ ინთება ქალაქი თქვენს ფეხქვეშ.
  tip: >-
    მოდით დილის ცხრა საათამდე ან მზის ჩასვლამდე ბოლო საათში: შუადღისას ქვა სიცხეს უკან აბრუნებს, ჩრდილი
    კი თითქმის არსად არის. საუკეთესო გეგმაა ასე: ასვლა საბაგიროთი რიყის პარკიდან და ჩამოსვლა ფეხით, ვიწრო
    ქუჩებით აბანოთუბნისკენ — ერთ საათში ორ სხვადასხვა ქალაქს ნახავთ. ჩაიცვით მოუცურავძირიანი ფეხსაცმელი:
    გაცვეთილი საფეხურები და კედლების თავები სველ ამინდში სრიალებს, მოაჯირები კი ზოგან არ არის — ბავშვებს
    ახლოს ამყოფეთ. შესვლა უფასოა და ტერიტორია დღე-ღამის ნებისმიერ დროს ღიაა. ტუალეტი და კაფეები ქვემოთ,
    აბანოთუბანშია.
  route: >-
    ცენტრიდან ნარიყალამდე მანქანით 10–15 წუთია, მაგრამ თავად გალავანთან პარკინგი პრაქტიკულად არ არსებობს.
    ორი გონივრული ვარიანტი გაქვთ: მანქანა გორგასლის მოედანთან ან აბანოთუბნის ფასიან ავტოსადგომზე დატოვეთ
    და ქვაფენილიან აღმართს ფეხით აუყევით, ან მტკვრის მარცხენა ნაპირზე, რიყის პარკთან გააჩერეთ და მდინარე
    საბაგიროთი გადაკვეთეთ. მესამე გზა — ვიწრო გზა სოლოლაკის ქედზე, ბოტანიკური ბაღის ზემოთ — ციცაბოა და
    ზაფხულში ტურისტული ავტობუსებითაა გაჭედილი. ნებისმიერი მანქანა გამოდგება: ქალაქში ხართ და არც საწვავზე,
    არც გზის საფარზე ფიქრი არ გჭირდებათ.
en:
  name: Narikala Fortress
  short: >-
    Sixteen centuries of wall on the Sololaki ridge above the Old Town: Tbilisi's citadel, its oldest
    silhouette and its widest view.
  body: >-
    **For sixteen centuries, whoever held this ridge held Tbilisi.**


    The first fortress on the rock went up in the second half of the 4th century. Georgian chronicles
    credit it to a Persian governor, placed here to watch the king of Kartli in Mtskheta, and one manuscript
    calls it Shuristsikhe, the "Fortress of Envy"; later legend gave the honour to Vakhtang Gorgasali.
    The Arabs enlarged it, David the Builder strengthened it, and most of what survives is 16th- and 17th-century
    work. The name Narikala appears only in the 17th century, from the Persian *narin qala*, "inner citadel".
    In that century the Ottoman traveller Evliya Çelebi credited it with seventy bastions: an exaggeration,
    but an honest measure of the impression it made.


    Its ruin came in two blows. In 1827 an earthquake brought down walls, bastions and much of the Istanbul
    Tower; in 1847 a powder store kept here by the Russian army exploded and flattened almost everything
    inside, St Nicholas church included. Guidebooks often fold both into a single bolt of lightning. The
    record is less tidy.


    What to look for:


    - Two linked enclosures, a square eastern court and a long western one, walled in brick and rough
    stone

    - The Istanbul Tower on the highest point of the western section, the best-preserved fragment

    - St Nicholas church, rebuilt in the 1990s over medieval foundations and painted with scenes from
    the Bible and Georgian history

    - The view: the brick domes of the sulphur baths, the Mtkvari bridges, Metekhi and Sameba

    - Kartlis Deda, Elguja Amashukeli's 20-metre Mother of Georgia, first raised in 1958, a short walk
    west along the ridge


    There is no ticket and no closing time. Come at dusk, sit on stone still warm from the day, and watch
    the city switch itself on below you.
  tip: >-
    Come before nine in the morning or in the last hour before sunset: at midday the stone throws back
    the heat and there is almost no shade. The best plan is up by cable car from Rike Park and down on
    foot through the lanes to Abanotubani, two different cities in a single hour. Wear shoes with grip,
    because worn steps and wall tops are slippery when wet, and railings are missing in places, so keep
    children close. Entry is free and the site never closes. Toilets and cafés are below, in Abanotubani.
  route: >-
    Narikala is 10–15 minutes by car from the centre, but there is effectively no parking at the walls.
    You have two sensible options: leave the car near Gorgasali Square or in a paid car park in Abanotubani
    and climb the cobbled lanes on foot, or park by Rike Park on the left bank and ride the cable car
    across the Mtkvari. The third approach, the narrow road along the Sololaki ridge above the Botanical
    Garden, is steep and in summer choked with tour buses. Any car will do; in the city, fuel and road
    surface are not a concern.
ru:
  name: Крепость Нарикала
  short: >-
    Шестнадцать веков стен на хребте Сололаки над Старым городом: цитадель Тбилиси, его древнейший силуэт
    и самый широкий вид.
  body: >-
    **Шестнадцать веков подряд тот, кто владел этим хребтом, владел Тбилиси.**


    Первая крепость на скале появилась во второй половине IV века. Грузинские летописи приписывают её
    персидскому наместнику, посаженному здесь следить за царём Картли в Мцхете, а одна рукопись называет
    её Шурисцихе — «крепостью зависти»; позднейшая легенда отдала эту честь Вахтангу Горгасали. Арабы
    крепость расширили, Давид Строитель укрепил, а бо́льшая часть уцелевшего — работа XVI–XVII веков.
    Имя Нарикала появляется лишь в XVII веке, от персидского *нарин кала* — «внутренняя цитадель». В том
    же столетии османский путешественник Эвлия Челеби насчитал у неё семьдесят бастионов: преувеличение,
    но честная мера того впечатления, которое она производила.


    Разрушили её два удара. В 1827 году землетрясение обрушило стены, бастионы и бо́льшую часть Стамбульской
    башни; в 1847-м взорвался пороховой склад, устроенный здесь русской армией, и сровнял с землёй почти
    всё внутри, включая церковь Святого Николая. Путеводители часто сводят обе беды к одному удару молнии.
    Документы рассказывают историю не столь стройную.


    На что смотреть:


    - Два сообщающихся двора — квадратный восточный и вытянутый западный, обнесённые стенами из кирпича
    и бутового камня

    - Стамбульская башня на самой высокой точке западной части — лучше всего сохранившийся фрагмент

    - Церковь Святого Николая, отстроенная в 1990-х на средневековом фундаменте и расписанная сценами
    из Библии и истории Грузии

    - Вид: кирпичные купола серных бань, мосты через Куру, Метехи и Самеба

    - Картлис Деда, двадцатиметровая «Мать Грузии» Элгуджи Амашукели, впервые установленная в 1958 году,
    — в нескольких минутах ходьбы к западу по хребту


    Билетов здесь нет, и крепость никогда не закрывается. Приходите в сумерках, сядьте на камень, ещё
    тёплый от дневного солнца, и смотрите, как внизу загорается город.
  tip: >-
    Приходите до девяти утра или за час до заката: в полдень камень отдаёт жар, а тени почти нет. Лучший
    план — подняться по канатной дороге из парка Рике, а спуститься пешком переулками к Абанотубани: за
    один час два разных города. Наденьте обувь с цепкой подошвой — стёртые ступени и гребни стен после
    дождя скользкие, а перил местами нет, так что детей держите рядом. Вход свободный, и крепость открыта
    всегда. Туалеты и кафе внизу, в Абанотубани.
  route: >-
    До Нарикалы 10–15 минут на машине от центра, но парковки у стен фактически нет. Разумных вариантов
    два: оставить машину у площади Горгасали или на платной стоянке в Абанотубани и подняться пешком по
    мощёным переулкам — либо припарковаться у парка Рике на левом берегу и перелететь через Куру на канатной
    дороге. Третий путь, узкая дорога по хребту Сололаки над Ботаническим садом, крутой, а летом забит
    туристическими автобусами. Подойдёт любая машина: в городе ни топливо, ни покрытие дороги не проблема.
fa:
  name: دژ ناریقلعه
  short: 'شانزده سده دیوار بر یال سولولاکی بالای شهر کهن: ارگ تفلیس، کهن‌ترین نیم‌رخ آن و گسترده‌ترین
    چشم‌اندازش.'
  body: >-
    **شانزده سده هر که این یال را در دست داشت، تفلیس را در دست داشت.**


    نخستین دژ بر این صخره در نیمهٔ دوم سدهٔ چهارم برپا شد. وقایع‌نامه‌های گرجی آن را به فرمانداری ایرانی
    نسبت می‌دهند که این‌جا گمارده شده بود تا پادشاه کارتلی را در متسختا زیر نظر داشته باشد، و یکی از دست‌نوشته‌ها
    آن را شوریس‌تسیخه، یعنی «دژ رشک»، می‌نامد؛ افسانه‌های بعدی این افتخار را به وختانگ گورگاسالی دادند.
    عرب‌ها دژ را گسترش دادند، داوید سازنده استوارش کرد، و بیشتر آنچه برجا مانده کار سده‌های شانزدهم و
    هفدهم است. نام ناریقلعه تنها در سدهٔ هفدهم پدیدار می‌شود، از «نارین قلعه»ی فارسی به معنای «ارگ درونی».
    در همان سده اولیا چلبی، جهانگرد عثمانی، هفتاد بارو برای آن برشمرد: گزافه‌ای آشکار، اما سنجه‌ای صادقانه
    از تأثیری که بر بیننده می‌گذاشت.


    ویرانی‌اش در دو ضربه رسید. در ۱۸۲۷ زمین‌لرزه‌ای دیوارها، باروها و بخش بزرگی از برج استانبول را فرو
    ریخت؛ در ۱۸۴۷ انبار باروتی که ارتش روسیه این‌جا نگه می‌داشت منفجر شد و تقریباً همهٔ آنچه درون دژ بود،
    از جمله کلیسای نیکلای مقدس، را با خاک یکسان کرد. راهنماهای سفر اغلب هر دو را در یک صاعقه خلاصه می‌کنند.
    اسناد، روایتی به این سرراستی ندارند.


    آنچه باید دید:


    - دو محوطهٔ به‌هم‌پیوسته، حیاطی چهارگوش در شرق و حیاطی دراز در غرب، با دیوارهایی از آجر و سنگ لاشه

    - برج استانبول بر بلندترین نقطهٔ بخش غربی، سالم‌ترین پارهٔ برجامانده

    - کلیسای نیکلای مقدس، بازسازی‌شده در دههٔ ۱۹۹۰ بر پی‌های سده‌های میانه، با نقاشی‌هایی از صحنه‌های
    کتاب مقدس و تاریخ گرجستان

    - چشم‌انداز: گنبدهای آجری حمام‌های گوگردی، پل‌های رود کورا، متخی و سامه‌با

    - کارتلیس دِدا، «مادر گرجستان» بیست‌متری اثر الگوجا آماشوکلی که نخستین بار در ۱۹۵۸ برپا شد، چند دقیقه
    پیاده‌روی به سوی غرب در امتداد یال


    نه بلیتی در کار است و نه ساعت تعطیلی. هنگام غروب بیایید، بر سنگی بنشینید که هنوز از گرمای روز گرم
    است و روشن شدن شهر را در پایین تماشا کنید.
  tip: >-
    پیش از ساعت نه صبح یا در واپسین ساعت پیش از غروب بیایید: نیمروز سنگ‌ها گرما را پس می‌دهند و سایه تقریباً
    نیست. بهترین برنامه این است که با تله‌کابین از پارک ریکه بالا بروید و پیاده از کوچه‌ها به آبانوتوبانی
    پایین بیایید: دو شهر متفاوت در یک ساعت. کفش با کف چسبنده بپوشید، چون پله‌های ساییده و سر دیوارها در
    هوای خیس لغزنده‌اند و در برخی جاها نرده‌ای نیست؛ کودکان را نزدیک خود نگه دارید. ورود رایگان است و
    دژ هرگز بسته نمی‌شود. سرویس بهداشتی و کافه‌ها پایین، در آبانوتوبانی‌اند.
  route: >-
    ناریقلعه با خودرو ۱۰ تا ۱۵ دقیقه از مرکز شهر فاصله دارد، اما کنار دیوارهایش عملاً جای پارکی نیست.
    دو گزینهٔ معقول دارید: خودرو را نزدیک میدان گورگاسالی یا در پارکینگی پولی در آبانوتوبانی بگذارید و
    از کوچه‌های سنگ‌فرش پیاده بالا بروید، یا کنار پارک ریکه در ساحل چپ پارک کنید و با تله‌کابین از روی
    رود کورا بگذرید. راه سوم، جادهٔ باریکی که در امتداد یال سولولاکی از بالای باغ گیاه‌شناسی می‌گذرد،
    شیب تندی دارد و تابستان‌ها از اتوبوس‌های گردشگری انباشته است. هر خودرویی کار را راه می‌اندازد؛ در
    شهر نه سوخت دغدغه است و نه رویهٔ جاده.
he:
  name: מבצר נריקלה
  short: >-
    שש עשרה מאות שנים של חומות על רכס סולולקי שמעל העיר העתיקה: המצודה של טביליסי, קו המתאר העתיק ביותר
    שלה והתצפית הרחבה ביותר.
  body: >-
    **במשך שש עשרה מאות שנים, מי שהחזיק ברכס הזה החזיק בטביליסי.**


    המבצר הראשון על הסלע הוקם במחצית השנייה של המאה הרביעית. הכרוניקות הגאורגיות מייחסות אותו למושל פרסי
    שהוצב כאן כדי לפקח על מלך קרתלי שישב במצחתה, וכתב יד אחד מכנה אותו שוריסציחה, "מבצר הקנאה"; אגדה מאוחרת
    יותר ייחסה את הכבוד לווחטנג גורגסלי. הערבים הרחיבו אותו, דוד הבונה ביצר אותו, ורוב מה ששרד הוא עבודה
    מהמאות ה־16 וה־17. השם נריקלה מופיע רק במאה ה־17, מן הביטוי הפרסי *נארין קלעה*, "המצודה הפנימית".
    באותה מאה ייחס לו הנוסע העות'מאני אוליה צ'לבי שבעים מעוזים: הגזמה, אבל מדד כן לרושם שהמבצר עשה.


    חורבנו בא בשתי מכות. ב־1827 הפילה רעידת אדמה חומות, מעוזים וחלק גדול ממגדל איסטנבול; ב־1847 התפוצץ
    מחסן אבק שריפה שהחזיק כאן הצבא הרוסי, והחריב כמעט את כל מה שבתוך המבצר, כולל כנסיית ניקולאוס הקדוש.
    מדריכי טיולים נוטים לכרוך את שני האסונות בברק אחד. התיעוד מסודר הרבה פחות.


    מה לראות:


    - שני מתחמים מחוברים, חצר מרובעת במזרח וחצר מוארכת במערב, מוקפים חומות מלבנים ומאבן גסה

    - מגדל איסטנבול בנקודה הגבוהה ביותר של החלק המערבי, השריד השמור ביותר

    - כנסיית ניקולאוס הקדוש, שנבנתה מחדש בשנות ה־90 על יסודות מימי הביניים ומעוטרת בציורים מכתבי הקודש
    ומתולדות גאורגיה

    - התצפית: כיפות הלבנים של מרחצאות הגופרית, הגשרים על המטקווארי, מטחי וסמבה

    - קרתליס דדה, "אם גאורגיה" בגובה 20 מטר של אלגוג'ה אמשוקלי, שהוצבה לראשונה ב־1958, מרחק הליכה קצר
    מערבה לאורך הרכס


    אין כרטיס ואין שעת סגירה. בואו בשעת בין ערביים, שבו על אבן שעוד חמה מן היום, והביטו בעיר שנדלקת מתחתיכם.
  tip: >-
    הגיעו לפני תשע בבוקר או בשעה האחרונה לפני השקיעה: בצהריים האבן מחזירה את החום וכמעט אין צל. התוכנית
    הטובה ביותר היא לעלות ברכבל מפארק ריקה ולרדת ברגל דרך הסמטאות לאבנוטובאני – שתי ערים שונות בשעה אחת.
    נעלו נעליים עם אחיזה טובה, כי מדרגות שחוקות וראשי חומות חלקים כשהם רטובים, ובמקומות מסוימים אין מעקות,
    אז שמרו את הילדים קרוב. הכניסה חינם והאתר לעולם אינו נסגר. שירותים ובתי קפה יש למטה, באבנוטובאני.
  route: >-
    נריקלה נמצאת 10–15 דקות נסיעה מהמרכז, אבל ליד החומות אין למעשה חנייה. יש שתי אפשרויות סבירות: להשאיר
    את הרכב ליד כיכר גורגסלי או בחניון בתשלום באבנוטובאני ולטפס ברגל בסמטאות המרוצפות, או לחנות ליד פארק
    ריקה בגדה השמאלית ולחצות את המטקווארי ברכבל. הדרך השלישית, הכביש הצר לאורך רכס סולולקי מעל הגן הבוטני,
    תלולה ובקיץ פקוקה באוטובוסי תיירים. כל רכב יתאים; בתוך העיר לא הדלק ולא פני הכביש הם בעיה.
ar:
  name: قلعة ناريكالا
  short: 'ستة عشر قرنًا من الأسوار على سلسلة سولولاكي فوق المدينة القديمة: قلعة تبليسي، وأقدم ملامحها،
    وأوسع إطلالاتها.'
  body: >-
    **طوال ستة عشر قرنًا، كان من يملك هذا المرتفع يملك تبليسي.**


    شُيّد أول حصن على الصخرة في النصف الثاني من القرن الرابع. وتنسبه الحوليات الجورجية إلى والٍ فارسي
    أُقيم هنا ليراقب ملك كارتلي في متسخيتا، وتسمّيه إحدى المخطوطات «شوريستسيخه»، أي «قلعة الحسد»؛ ثم منحت
    أسطورةٌ لاحقة هذا الشرف لفاختانغ غورغاسالي. وسّعها العرب، وحصّنها داود البنّاء، ومعظم ما بقي منها
    يعود إلى القرنين السادس عشر والسابع عشر. ولا يظهر اسم ناريكالا إلا في القرن السابع عشر، من الفارسية
    *نارين قلعه*، أي «القلعة الداخلية». وفي ذلك القرن نسب إليها الرحالة العثماني أوليا جلبي سبعين برجًا
    دفاعيًا: مبالغة، لكنها مقياس صادق للأثر الذي تركته في النفوس.


    جاء خرابها على ضربتين. ففي عام 1827 أسقط زلزالٌ أسوارًا وأبراجًا وجزءًا كبيرًا من برج إسطنبول؛ وفي
    عام 1847 انفجر مخزن للبارود كان الجيش الروسي يحتفظ به هنا، فسوّى بالأرض كل ما في الداخل تقريبًا، ومنه
    كنيسة القديس نيقولاوس. وكثيرًا ما تختصر كتب الأدلة السياحية الكارثتين في صاعقة واحدة. أما السجلات
    فأقل ترتيبًا من ذلك.


    ما يستحق النظر:


    - باحتان متصلتان: فناء شرقي مربع وآخر غربي مستطيل، تحيط بهما أسوار من الآجرّ والحجر الخشن

    - برج إسطنبول على أعلى نقطة في القسم الغربي، وهو أفضل الأجزاء حفظًا

    - كنيسة القديس نيقولاوس، التي أُعيد بناؤها في التسعينيات على أسس من العصور الوسطى وزُيّنت برسوم من
    الكتاب المقدس ومن تاريخ جورجيا

    - الإطلالة: قباب الحمّامات الكبريتية المبنية بالآجرّ، وجسور نهر كورا، وميتيخي وساميبا

    - كارتليس ديدا، تمثال «أم جورجيا» لإلغوجا أماشوكيلي بارتفاع 20 مترًا، الذي نُصب أول مرة عام 1958،
    على مسافة قصيرة سيرًا نحو الغرب على طول السلسلة


    لا تذاكر هنا ولا موعد إغلاق. تعالوا عند الغسق، واجلسوا على حجر ما زال دافئًا من حرّ النهار، وتأمّلوا
    المدينة وهي تضيء تحتكم.
  tip: >-
    تعالوا قبل التاسعة صباحًا أو في الساعة الأخيرة قبل الغروب: فعند الظهيرة يردّ الحجر الحرارة ولا يكاد
    يوجد ظل. أفضل خطة أن تصعدوا بالتلفريك من حديقة ريكه وتنزلوا مشيًا عبر الأزقة إلى أبانوتوباني: مدينتان
    مختلفتان في ساعة واحدة. انتعلوا أحذية مانعة للانزلاق، فالدرجات البالية وأعالي الأسوار زلقة حين تبتل،
    والدرابزين غائب في بعض المواضع، فأبقوا الأطفال قريبين منكم. الدخول مجاني والموقع لا يُغلق أبدًا. دورات
    المياه والمقاهي في الأسفل، في أبانوتوباني.
  route: >-
    تبعد ناريكالا 10–15 دقيقة بالسيارة عن المركز، لكن لا مواقف فعلية عند الأسوار. أمامكم خياران معقولان:
    أن تتركوا السيارة قرب ساحة غورغاسالي أو في موقف مدفوع في أبانوتوباني وتصعدوا مشيًا في الأزقة المرصوفة
    بالحجارة، أو أن تركنوا قرب حديقة ريكه على الضفة اليسرى وتعبروا نهر كورا بالتلفريك. أما الطريق الثالث،
    وهو الطريق الضيق على طول سلسلة سولولاكي فوق الحديقة النباتية، فشديد الانحدار ومزدحم صيفًا بحافلات
    السياح. أي سيارة تفي بالغرض؛ ففي المدينة لا الوقود ولا حالة الطريق مصدر قلق.
