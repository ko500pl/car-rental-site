ka:
  name: ნარიყალას ციხე
  short: ქალაქის თავზე აღმართული IV საუკუნის ციხესიმაგრე — თბილისის მთავარი სიმბოლო და საუკეთესო ხედი
    ძველ ქალაქზე.
  body: >-
    **ნარიყალა თბილისის ვიზუალური ღერძია.** სოლოლაკის ქედზე აღმართული ქვის კედლები ქალაქის ყველა კუთხიდან
    ჩანს და ღამით განათებული განსაკუთრებით შთამბეჭდავია. ციხის პირველი ბირთვი IV საუკუნით თარიღდება, როცა
    აქ სპარსული ციტადელი იდგა; შემდეგ მას არაბებმა, თურქ-სელჩუკებმა, მონღოლებმა და სპარსელებმა თავიანთი
    ფენა დაამატეს. დღევანდელი მოხაზულობა ძირითადად XVI–XVII საუკუნეებისაა.


    1827 წელს დენთის საწყობში მეხმა დაარტყა და აფეთქებამ ციხის დიდი ნაწილი დაანგრია. სწორედ ამიტომ ნარიყალა
    ნახევრად ნანგრევია — და სწორედ ეს აძლევს მას იმ სახეს, რომელსაც ტურისტები ეძებენ.


    რას ნახავს სტუმარი:


    - გალავნის ორი იარუსი, კოშკები და გასასვლელი ბილიკები, საიდანაც პანორამა 360 გრადუსით იშლება

    - წმინდა ნიკოლოზის ეკლესია ციხის ეზოში, აღდგენილი 1990-იან წლებში ძველი საძირკველზე

    - ხედი აბანოთუბანზე, მტკვრის ხიდებზე, სამებაზე და მეტეხზე ერთდროულად

    - ბოტანიკური ბაღის შესასვლელი ციხის უკანა კალთაზე, ჩანჩქერამდე მისასვლელი ბილიკით

    - „ქართლის დედის" ალუმინის ქანდაკება ქედის გასწვრივ, 20 წუთის სასეირნო მანძილზე


    ნარიყალა არ არის მუზეუმი — აქ ბილეთი არ იყიდება და კარი არ იკეტება. ეს ღია სივრცეა, სადაც ქვაზე ჯდომა
    და ქალაქის ყურება ისეთივე ლეგიტიმური პროგრამაა, როგორც კედლების შემოვლა.
  tip: >-
    საუკეთესო დროა დილის 9-მდე ან მზის ჩასვლამდე ერთი საათით ადრე — შუადღისას ქვა ცხელდება და აჩრდილი
    თითქმის არ არის. ავიდე საბაგიროთი რიყის პარკიდან, ჩამოდი ფეხით აბანოთუბანში — ასე ორჯერ ნახავ სხვადასხვა
    რაკურსს. ჩაიცვი მყარძირიანი ფეხსაცმელი: კედლებზე ასასვლელი ქვები სველ ამინდში საშინლად სრიალებს. მოაჯირები
    ყველგან არ არის, ბავშვს ხელი მაგრად დაუჭირე. ტუალეტი და კაფეები ქვემოთ, აბანოთუბანშია.
  route: >-
    ცენტრიდან ნარიყალამდე მანქანით 10–15 წუთია, მაგრამ თვით ციხესთან პარკინგი პრაქტიკულად არ არსებობს.
    ორი გონივრული ვარიანტია: დატოვე ავტომობილი გორგასლის მოედანთან ან აბანოთუბნის ფასიან პარკინგზე და
    ავედი ფეხით ვიწრო ქვაფენილით, ან გააჩერე რიყის პარკთან და ისარგებლე საბაგიროთი. მესამე გზა — სოლოლაკის
    ქედის გზა ბოტანიკური ბაღის ზემოდან — ვიწროა, ციცაბო და ზაფხულში ტურისტული ავტობუსებით გადატვირთული.
    ნებისმიერი კლასის ავტომობილი გამოდგება; ქალაქშივე ხარ, საწვავზე ფიქრი არ გჭირდება.
en:
  name: Narikala Fortress
  short: >-
    A 4th-century citadel on the ridge above the Old Town — the defining silhouette of Tbilisi and its
    best viewpoint.
  body: >-
    **Narikala is the visual anchor of Tbilisi.** Its stone walls run along the Sololaki ridge, visible
    from almost every corner of the city and floodlit after dark. The first citadel here dates to the
    4th century, when a Persian stronghold guarded the crossing of the Mtkvari. Arabs, Seljuks, Mongols
    and Persians each added a layer; what stands today is largely 16th and 17th century masonry on much
    older foundations.


    In 1827 lightning struck a powder magazine inside the walls and the explosion destroyed a large part
    of the fortress. That is why Narikala is a half-ruin rather than a restored castle — and that unfinished,
    weathered quality is exactly what makes it photogenic.


    What you actually see up there:


    - Two tiers of curtain wall with towers and walkable ledges, opening a full panorama over the city

    - St Nicholas Church in the inner courtyard, rebuilt in the 1990s on medieval foundations

    - A single sweeping view that takes in Abanotubani, the river bridges, Metekhi and the Sameba cathedral

    - The upper gate of the Botanical Garden on the far slope, with a path down to its waterfall

    - The aluminium **Kartlis Deda** (Mother of Georgia) statue, a twenty-minute ridge walk away


    There is no ticket office and no closing time. Narikala is an open hillside where sitting on a warm
    stone and watching the roofs below counts as a full programme.
  tip: >-
    Come before 9 in the morning or in the hour before sunset — at midday the stone radiates heat and
    there is almost no shade. A good pattern is up by cable car from Rike Park and down on foot into Abanotubani,
    which gives you two completely different perspectives. Wear shoes with grip: the worn steps and wall
    tops are genuinely slippery when wet. Railings are missing in places, so keep small children close.
    Toilets and cafés are down in Abanotubani.
  route: >-
    The fortress is ten to fifteen minutes from the city centre by car, but there is effectively no parking
    at the walls themselves. Two sensible options: leave the car near Gorgasali Square or in the paid
    lot in Abanotubani and walk up the cobbled lanes, or park at Rike Park and take the cable car across
    the river. The third approach, the narrow road over the Sololaki ridge above the Botanical Garden,
    is steep and clogged with tour buses in summer. Any car will do — you are inside the city, so fuel
    and road surface are non-issues.
ru:
  name: Крепость Нарикала
  short: Цитадель IV века на хребте над Старым городом — главный силуэт Тбилиси и лучшая смотровая площадка.
  body: >-
    **Нарикала — визуальная ось Тбилиси.** Каменные стены тянутся по Сололакскому хребту, их видно почти
    из любой точки города, а вечером они подсвечены. Первая крепость появилась здесь в IV веке, когда
    персидский гарнизон охранял переправу через Куру. Арабы, сельджуки, монголы и персы добавляли свои
    слои; то, что стоит сегодня, — в основном кладка XVI–XVII веков на гораздо более древнем основании.


    В 1827 году молния попала в пороховой погреб, и взрыв разрушил значительную часть укреплений. Именно
    поэтому Нарикала — полуруина, а не отреставрированный замок, и именно эта необработанность делает
    её такой фотогеничной.


    Что вы увидите наверху:


    - Два яруса стен с башнями и проходами, откуда открывается круговая панорама города

    - Церковь святого Николая во внутреннем дворе, восстановленная в 1990-х на средневековом фундаменте

    - Один общий вид, в который попадают Абанотубани, мосты через Куру, Метехи и собор Самеба

    - Верхние ворота Ботанического сада на дальнем склоне и тропу к водопаду

    - Алюминиевую **Картлис Деда** (Мать Грузия) — двадцать минут пешком по хребту


    Билетов здесь не продают и ворот не закрывают. Нарикала — открытый склон, где посидеть на тёплом камне
    и разглядывать крыши внизу считается полноценной программой.
  tip: >-
    Приходите до девяти утра или за час до заката — днём камень раскаляется, а тени почти нет. Удобная
    схема: подняться по канатной дороге из парка Рике, а спуститься пешком в Абанотубани, тогда получите
    два разных ракурса. Обувь нужна с цепким подошвой: стёртые ступени и верх стен в дождь скользят по-настоящему.
    Перил местами нет, детей держите за руку. Туалеты и кафе — внизу, в Абанотубани.
  route: >-
    От центра до крепости десять-пятнадцать минут на машине, но у самих стен парковки фактически нет.
    Разумных варианта два: оставить автомобиль у площади Горгасали или на платной стоянке в Абанотубани
    и подняться пешком по брусчатке, либо припарковаться у парка Рике и воспользоваться канатной дорогой.
    Третий подъезд — узкая дорога по Сололакскому хребту над Ботаническим садом — крутой и летом забит
    туристическими автобусами. Подойдёт любая машина: вы в черте города, о топливе и покрытии думать не
    приходится.
fa:
  name: قلعهٔ ناریکالا
  short: ارگی از سدهٔ چهارم بر ستیغ بالای شهر قدیم — نمای شاخص تفلیس و بهترین نقطهٔ دید آن.
  body: >-
    **ناریکالا لنگر بصری تفلیس است.** دیوارهای سنگی‌اش در امتداد ستیغ سولولاکی کشیده شده‌اند، از تقریباً
    هر گوشهٔ شهر دیده می‌شوند و پس از تاریکی نورافکن دارند. نخستین ارگ در این محل به سدهٔ چهارم می‌رسد،
    زمانی که دژی ایرانی گذرگاه متکواری را پاس می‌داشت. عرب‌ها، سلجوقیان، مغول‌ها و ایرانیان هر یک لایه‌ای
    افزودند؛ آنچه امروز ایستاده بیشتر بنایی از سدهٔ شانزدهم و هفدهم روی پی‌های بسیار کهن‌تر است.


    در 1827 صاعقه به انبار باروت درون دیوارها خورد و انفجار بخش بزرگی از قلعه را ویران کرد. برای همین
    ناریکالا نیمه‌ویرانه است نه قلعه‌ای مرمت‌شده — و همین کیفیت ناتمام و فرسوده دقیقاً آن چیزی است که
    عکاسی‌اش را جذاب می‌کند.


    آنچه بالا واقعاً می‌بینید: دو رده دیوار پرده‌ای با برج‌ها و طاقچه‌های قابل‌پیمایش که نمای کامل شهر
    را باز می‌کنند؛ کلیسای سنت نیکلاس در حیاط درونی که در دههٔ 1990 روی پی‌های سده‌های میانه بازسازی شد؛
    منظره‌ای یکپارچه که آبانوتوبانی، پل‌های رودخانه، متخی و کلیسای جامع تثلیث مقدس را در بر می‌گیرد؛ دروازهٔ
    بالایی باغ گیاه‌شناسی در دامنهٔ روبه‌رو با بیلیکی به سوی آبشارش؛ و مجسمهٔ آلومینیومی **کارتلیس ددا**
    (مادر گرجستان)، بیست دقیقه پیاده‌روی روی ستیغ. اینجا نه گیشه‌ای هست و نه ساعت بسته‌شدن.
  tip: >-
    پیش از ساعت 9 صبح یا در ساعت پیش از غروب بیایید — ظهر سنگ گرما پس می‌دهد و سایه‌ای در کار نیست. الگوی
    خوب این است: با تله‌کابین از پارک ریکه بالا بروید و پیاده به آبانوتوبانی پایین بیایید، که دو چشم‌انداز
    کاملاً متفاوت به شما می‌دهد. کفشی با ته‌گیر خوب بپوشید: پله‌های سائیده و بالای دیوارها در خیسی واقعاً
    لغزنده‌اند. نرده در جاهایی نیست، پس بچه‌های کوچک را نزدیک نگه دارید. سرویس بهداشتی و کافه‌ها پایین
    در آبانوتوبانی‌اند.
  route: >-
    قلعه با خودرو ده تا پانزده دقیقه از مرکز شهر فاصله دارد، اما عملاً کنار خود دیوارها پارکینگی نیست.
    دو گزینهٔ معقول: خودرو را نزدیک میدان گورگاسالی یا در پارکینگ پولی آبانوتوبانی بگذارید و از کوچه‌های
    سنگ‌فرش بالا بروید، یا در پارک ریکه پارک کنید و با تله‌کابین از رودخانه بگذرید. راه سوم، جادهٔ باریک
    روی ستیغ سولولاکی بالای باغ گیاه‌شناسی، تند است و در تابستان پر از اتوبوس‌های تور. هر خودرویی کافی
    است — درون شهر هستید، پس سوخت و کیفیت جاده مسئله نیست.
he:
  name: מבצר נריקלה
  short: מצודה מן המאה הרביעית על הרכס מעל העיר העתיקה — הצללית המזוהה של טביליסי ונקודת התצפית הטובה
    בה.
  body: >-
    **נריקלה היא העוגן החזותי של טביליסי.** חומות האבן שלה נמתחות לאורך רכס סולולאקי, נראות כמעט מכל פינה
    בעיר ומוארות בזרקורים אחרי רדת החשכה. המצודה הראשונה כאן מתוארכת למאה הרביעית, כאשר מעוז פרסי שמר
    על המעבר בנהר המטקווארי. ערבים, סלג'וקים, מונגולים ופרסים הוסיפו כל אחד שכבה משלו; מה שעומד היום הוא
    בעיקר בנייה מן המאות ה-16 וה-17 על יסודות עתיקים בהרבה.


    ב-1827 פגע ברק במחסן אבק שרפה בתוך החומות, והפיצוץ הרס חלק גדול מהמבצר. לכן נריקלה היא חורבה למחצה
    ולא טירה משוחזרת — ודווקא האיכות הלא-גמורה והבלויה הזאת היא שהופכת אותה לצילומית כל כך.


    מה שרואים שם למעלה: שתי שורות של חומת מגן עם מגדלים ומדפים שאפשר ללכת עליהם, הפותחים פנורמה מלאה על
    העיר; כנסיית ניקולאס הקדוש בחצר הפנימית, שנבנתה מחדש בשנות ה-1990 על יסודות מימי הביניים; מבט רחב
    אחד הכולל את אבאנוטובני, את גשרי הנהר, את מטחי ואת קתדרלת השילוש הקדוש; השער העליון של הגן הבוטני
    במדרון ממול, ומשם שביל יורד אל המפל שבתוכו; ופסל האלומיניום **קרתליס דדה** (אם גאורגיה), עשרים דקות
    הליכה על הרכס. אין כאן קופה ואין שעת סגירה.
  tip: >-
    בואו לפני 9 בבוקר או בשעה שלפני השקיעה — בצהריים האבן קורנת חום וכמעט אין צל. דפוס טוב הוא לעלות ברכבל
    מפארק ריקה ולרדת ברגל אל אבאנוטובני, מה שנותן שתי נקודות מבט שונות לגמרי. נעלו נעליים עם אחיזה: המדרגות
    השחוקות וראשי החומות חלקלקים באמת כשהם רטובים. מעקות חסרים במקומות אחדים, לכן החזיקו ילדים קטנים קרוב.
    שירותים ובתי קפה נמצאים למטה באבאנוטובני.
  route: >-
    המבצר נמצא עשר עד חמש-עשרה דקות נסיעה ממרכז העיר, אך למעשה אין חניה ליד החומות עצמן. שתי אפשרויות
    הגיוניות: להשאיר את הרכב ליד כיכר גורגסאלי או בחניון בתשלום באבאנוטובני ולעלות ברגל בסמטאות המרוצפות,
    או לחנות בפארק ריקה ולעבור ברכבל מעל הנהר. הגישה השלישית, הכביש הצר על רכס סולולאקי מעל הגן הבוטני,
    תלולה וחסומה באוטובוסי תיירים בקיץ. כל רכב יתאים — אתם בתוך העיר, ולכן דלק ומצב הכביש אינם שאלה.
ar:
  name: قلعة ناريكالا
  short: قلعة من القرن الرابع على الحافة فوق البلدة القديمة — الصورة الظلية المميزة لتبليسي وأفضل مطل
    فيها.
  body: >-
    **ناريكالا هي المرتكز البصري لتبليسي.** تمتد أسوارها الحجرية على طول حافة سولولاكي، وتُرى من كل ركن
    في المدينة تقريباً وتُضاء بالكشافات بعد حلول الظلام. وتعود أول قلعة هنا إلى القرن الرابع، حين كان
    حصن فارسي يحرس معبر نهر متكفاري. وأضاف العرب والسلاجقة والمغول والفرس كل منهم طبقته؛ وما يقوم اليوم
    في معظمه بناء من القرنين السادس عشر والسابع عشر على أسس أقدم بكثير.


    وفي عام 1827 ضربت صاعقة مخزن بارود داخل الأسوار، فدمر الانفجار جزءاً كبيراً من القلعة. ولهذا فناريكالا
    خراب نصفي لا قلعة مرممة — وهذا الطابع غير المكتمل الذي أبلته العوامل هو تحديداً ما يجعلها بديعة في
    الصور.


    وما تراه هناك في الأعلى: صفان من السور الستاري بأبراج وحواف يمكن السير عليها، تفتح بانوراما كاملة
    على المدينة؛ وكنيسة القديس نيقولاوس في الفناء الداخلي، أُعيد بناؤها في التسعينيات على أسس من العصور
    الوسطى؛ ومشهد واحد ممتد يضم أبانوتوباني وجسور النهر وميتيخي وكاتدرائية الثالوث المقدس؛ والبوابة العليا
    للحديقة النباتية على المنحدر المقابل، ومنها درب ينزل إلى شلالها؛ وتمثال **كارتليس ديدا** الألمنيومي
    (أم جورجيا)، على بعد عشرين دقيقة مشياً على الحافة. ولا شباك تذاكر هنا ولا موعد إغلاق.
  tip: >-
    تعال قبل التاسعة صباحاً أو في الساعة التي تسبق الغروب — ففي الظهيرة يشع الحجر حرارة ولا ظل يُذكر تقريباً.
    والنمط الجيد هو الصعود بالتلفريك من حديقة ريكي والنزول سيراً إلى أبانوتوباني، وهو ما يمنحك منظورين
    مختلفين تماماً. البس حذاءً جيد التشبث: فالدرجات المهترئة وأعالي الأسوار زلقة فعلاً عند البلل. والحواجز
    مفقودة في مواضع، فأبقِ الأطفال الصغار قريبين. دورات المياه والمقاهي في الأسفل في أبانوتوباني.
  route: >-
    تبعد القلعة عشر إلى خمس عشرة دقيقة بالسيارة عن وسط المدينة، لكن لا يوجد عملياً موقف عند الأسوار نفسها.
    وأمامك خياران معقولان: اترك السيارة قرب ساحة غورغاسالي أو في الموقف المدفوع في أبانوتوباني واصعد سيراً
    في الأزقة المرصوفة، أو اركن في حديقة ريكي واعبر النهر بالتلفريك. أما المدخل الثالث، وهو الطريق الضيق
    فوق حافة سولولاكي أعلى الحديقة النباتية، فشديد الانحدار ومزدحم بحافلات الرحلات صيفاً. وأي سيارة تفي
    بالغرض — فأنت داخل المدينة، والوقود وحالة الطريق ليسا مسألة.
