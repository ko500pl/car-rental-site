ka:
  name: ხერთვისის ციხე
  short: >-
    ციხე კლდოვან კონცხზე, სადაც ფარავანი მტკვარს ერთვის; მისი კოშკი და გალავანი წარწერით 1354–1356 წლებით
    თარიღდება. ვარძიის გზაზე.
  body: >-
    **ხერთვისი იქ დგას, სადაც ერთი მდინარე მეორეს ერთვის, და სახელიც სწორედ ამას ამბობს: ძველი, ხანმეტი
    ქართულის „ხ-ერთვის“.**


    ციხე ვიწრო კლდოვან კონცხზეა აღმართული ფარავნისა და მტკვრის შესართავთან და ერთდროულად ორივე ხეობას
    დაჰყურებს. მისი აგების პირველი თარიღი უცნობია: კედლებში სამშენებლო ფენები ადრეული შუა საუკუნეებიდან
    XIX საუკუნემდე ერთმანეთს ეფინება. ლეონტი მროველი წერს, რომ ხერთვისი ალექსანდრე მაკედონელსაც უნახავს
    აღმოსავლეთში ლაშქრობისას. ისტორიული მეცნიერება ამ ამბავს არ იზიარებს, მაგრამ ის კარგად აჩვენებს, რამდენად
    ძველად ეჩვენებოდა ეს კლდე შუა საუკუნეების მემატიანესაც. ადგილობრივი თქმულება კიდევ უფრო შორს მიდის:
    თითქოს ალექსანდრემ ციხე დაანგრია.


    ყველაზე მყარი თარიღი კედელზევე წერია. 1832 წელს შვეიცარიელმა მოგზაურმა დიუბუა დე მონპერემ შესასვლელის
    თავზე ვრცელ ასომთავრულ წარწერას მიაკვლია: „მეფეთ-მეფის მოლარეთუხუცესმა“ ზაქარიამ, ქამქამისშვილის ძემ,
    „კოშკი და გალავანი ესე“ 1354 წელს დაიწყო და 1356 წელს დაასრულა. ციტადელის დასავლეთ ნაწილში, ძველი
    ეკლესიის ადგილზე, გათლილი ტუფის პაწია დარბაზული ეკლესია დგას, სულ 2,7 × 4,3 მეტრი; მისი საკურთხევლის
    იატაკი პირდაპირ კლდეშია ამოკვეთილი. XIX საუკუნეში გამოქვეყნებული, დღეს დაკარგული წარწერა ძველ ეკლესიას
    985 წლით ათარიღებდა.


    შემდეგ მძიმე საუკუნეები დადგა: XIII საუკუნეში მონღოლები, მერე სამცხის მფლობელი ჯაყელები, 1578 წელს
    ციხის ოსმალთათვის ჩაბარება, 1771 წელს ერეკლე II-ის ხანმოკლე დაბრუნება და, ბოლოს, 1828 წლის 22 სექტემბერს
    რუსეთის ჯარი. მდინარისკენ ჩაჭრილი გვირაბები მეციხოვნეებს წყალს ალყის დროსაც აწვდიდა. 2007 წლიდან ხერთვისი,
    ვარძიასთან ერთად, იუნესკოს მსოფლიო მემკვიდრეობის წინასწარ სიაშია.


    ციტადელის თავზე ადით და ქვემოთ ჩაიხედეთ: ორი მდინარე ერთ კალაპოტად იწნება, ვარძიის გზა კი მტკვარს
    აყოლებული ხეობაში იკარგება.
  tip: >-
    ოცდაათი-ორმოცი წუთი საკმარისია და გზიდანაც თითქმის არ გადაუხვევთ — ვარძიის გზა ციხის ძირში გადის.
    მანქანა ხიდთან, კლდის ძირში დატოვეთ. ასასვლელი ციცაბო ქვის ბილიკია, მშრალ ამინდშიც სრიალა, ამიტომ
    მყარი ფეხსაცმელი ჩაიცვით. კედლებსა და შვერილებზე მოაჯირი არსად არის — ბავშვებს ხელი არ გაუშვათ. შესვლა
    უფასოა, ჭიშკარი ჩვეულებრივ ღიაა. ტუალეტი, კაფე და ბანკომატი აქ არ არის; უახლოესი ასპინძაშია, დაახლოებით
    15 კილომეტრით უკან. ტურისტული ავტობუსები შუადღისას იყრის თავს — ადრე მოდით ან საღამოს შუქზე.
  route: >-
    გზა იგივეა, რაც ვარძიისკენ: თბილისიდან E60/ს1-ით დასავლეთით ხაშურამდე, ს8-ით სამხრეთით ბორჯომის გავლით
    ახალციხემდე, შემდეგ ს11-ით ასპინძის გავლით მტკვრის ხეობაში. ხერთვისი იქ აღმართულა, სადაც გზა იყოფა:
    ს11 ფარავანს მიჰყვება ახალქალაქისკენ, ვარძიის გზა კი მტკვარს აყოლებული კიდევ 16 კილომეტრს გადის. სულ
    დაახლოებით 250 კილომეტრი და ოთხი საათი. ასფალტი ბოლომდეა, ბოლო მონაკვეთი ვიწრო და მოხვეული. საწვავი
    ახალციხეში ან ასპინძაში შეავსეთ. ეკონომ-კლასი სავსებით საკმარისია. უფრო მოკლე, დაახლოებით 210-კილომეტრიანი
    გზა ჯავახეთის ზეგანს კვეთს წალკისა და ახალქალაქის გავლით — ზაფხულში ლამაზი, ზამთარში მკაცრი.
en:
  name: Khertvisi Fortress
  short: >-
    A fortress on a rock spur where the Paravani flows into the Mtkvari, its tower and walls dated by
    inscription to 1354–1356. On the road to Vardzia.
  body: >-
    **Khertvisi stands where one river runs into another, and the name says so: in archaic Khanmeti Georgian,
    kh-ertvis means 'it joins'.**


    The fortress rises on a narrow rock spur at the confluence of the Paravani and the Mtkvari, watching
    both gorges at once. The date of its first building is unknown; its walls hold layers from the early
    Middle Ages to the 19th century. The chronicler Leonti Mroveli writes that Alexander the Great saw
    Khertvisi on his eastern campaign. Historians do not accept the story, but it shows how old this rock
    seemed even to a medieval writer. Local legend goes further and says Alexander destroyed the fortress.


    The firmest date is on the wall itself. In 1832 the Swiss traveller Frédéric Dubois de Montpéreux
    found a long asomtavruli inscription over the entrance: Zakaria, son of Kamkamishvili, treasurer to
    the king of kings, began 'this tower and wall' in 1354 and finished it in 1356. In the west of the
    citadel, on the site of an older church, stands a tiny hall chapel of dressed tuff, just 2.7 by 4.3
    metres, its altar floor cut straight into the rock. A now-lost inscription, published in the 19th
    century, dated the old church to 985.


    Then came the hard centuries: the Mongols in the 13th, the Jaqeli lords of Samtskhe, surrender to
    the Ottomans in 1578, a brief recapture by King Erekle II in 1771 and, on 22 September 1828, Russian
    troops. Tunnels cut down to the river kept the garrison supplied with water under siege. Since 2007
    Khertvisi has been on UNESCO's tentative World Heritage list together with Vardzia.


    Climb to the top of the citadel and look down: two rivers braid into one, and the road to Vardzia
    slips away upstream beside the Mtkvari.
  tip: >-
    Thirty to forty minutes is enough, and it costs almost nothing in driving time, since the Vardzia
    road runs beneath the walls. Leave the car by the bridge at the foot of the rock. The path up is steep
    stone and slippery even when dry, so wear proper shoes. There are no railings on the walls or ledges;
    keep hold of children. Entry is free and the gate is usually open. There is no toilet, café or ATM;
    the nearest are in Aspindza, about 15 km back. Tour buses bunch up around midday, so come early or
    in the late-afternoon light.
  route: >-
    The way is the same as to Vardzia: from Tbilisi take the E60/S1 west to Khashuri, the S8 south through
    Borjomi to Akhaltsikhe, then the S11 via Aspindza along the Mtkvari gorge. Khertvisi rises where the
    road divides: the S11 follows the Paravani up to Akhalkalaki, while the Vardzia road keeps to the
    Mtkvari for another 16 km. About 250 km and four hours in all, asphalt throughout, narrow and winding
    at the end. Fill up in Akhaltsikhe or Aspindza. An economy car is all you need. A shorter route of
    about 210 km crosses the Javakheti plateau via Tsalka and Akhalkalaki: fine in summer, harsh in winter.
ru:
  name: Крепость Хертвиси
  short: >-
    Крепость на скальном отроге при впадении Паравани в Мтквари; её башню и стены надпись датирует 1354–1356
    годами. По дороге в Вардзию.
  body: >-
    **Хертвиси стоит там, где одна река впадает в другую, и имя говорит об этом прямо: на архаичном ханметском
    грузинском «х-ертвис» значит «соединяется».**


    Крепость поднимается на узком скальном отроге у слияния Паравани и Мтквари и следит сразу за обоими
    ущельями. Когда её построили впервые, неизвестно; в её стенах слои от раннего Средневековья до XIX
    века. Летописец Леонти Мровели пишет, что Хертвиси видел Александр Македонский во время своего восточного
    похода. Историки этот рассказ не принимают, но он показывает, какой древней эта скала казалась даже
    средневековому автору. Местная легенда идёт дальше и утверждает, что Александр крепость разрушил.


    Самая надёжная дата — на самой стене. В 1832 году швейцарский путешественник Фредерик Дюбуа де Монпере
    обнаружил над входом длинную надпись асомтаврули: Закария, сын Камкамишвили, казначей царя царей,
    начал «эту башню и стену» в 1354 году и завершил в 1356-м. В западной части цитадели, на месте более
    древней церкви, стоит крошечная зальная часовня из тёсаного туфа, всего 2,7 на 4,3 метра, с алтарным
    полом, вырубленным прямо в скале. Ныне утраченная надпись, опубликованная в XIX веке, датировала старую
    церковь 985 годом.


    Потом пришли тяжёлые века: монголы в XIII веке, владетели Самцхе из рода Джакели, сдача османам в
    1578 году, недолгое возвращение крепости царём Ираклием II в 1771-м и, 22 сентября 1828 года, русские
    войска. Туннели, прорубленные к реке, снабжали гарнизон водой во время осад. С 2007 года Хертвиси
    вместе с Вардзией входит в предварительный список Всемирного наследия ЮНЕСКО.


    Поднимитесь на вершину цитадели и посмотрите вниз: две реки сплетаются в одну, а дорога на Вардзию
    ускользает вверх по течению вдоль Мтквари.
  tip: >-
    Тридцати-сорока минут достаточно, и времени в пути это почти не отнимет: дорога на Вардзию проходит
    прямо под стенами. Оставьте машину у моста у подножия скалы. Тропа наверх — крутой камень, скользкий
    даже в сухую погоду, так что нужна нормальная обувь. На стенах и уступах нет перил; держите детей
    за руку. Вход бесплатный, ворота обычно открыты. Туалета, кафе и банкомата нет; ближайшие — в Аспиндзе,
    примерно в 15 км назад. Туристические автобусы скапливаются к полудню, поэтому приезжайте рано или
    ближе к вечеру, в мягком свете.
  route: >-
    Путь тот же, что и в Вардзию: из Тбилиси по E60/S1 на запад до Хашури, по S8 на юг через Боржоми до
    Ахалцихе, затем по S11 через Аспиндзу ущельем Мтквари. Хертвиси поднимается там, где дорога разделяется:
    S11 уходит вдоль Паравани вверх к Ахалкалаки, а дорога на Вардзию ещё 16 км держится Мтквари. Всего
    около 250 км и четыре часа, всюду асфальт, в конце узкий и извилистый. Заправьтесь в Ахалцихе или
    Аспиндзе. Машины эконом-класса вполне достаточно. Более короткий путь, около 210 км, идёт через Джавахетское
    плато, Цалку и Ахалкалаки: летом хорош, зимой суров.
fa:
  name: دژ خرتویسی
  short: >-
    دژی بر زبانه‌ای صخره‌ای، جایی که پاراوانی به متکواری می‌ریزد؛ کتیبه‌ای برج و باروی آن را به ۱۳۵۴–۱۳۵۶
    تاریخ‌گذاری می‌کند. بر سر راه واردزیا.
  body: >-
    **خرتویسی جایی ایستاده است که رودی به رود دیگر می‌ریزد، و نامش همین را می‌گوید: در گرجی کهنِ دورهٔ
    خانمتی، «خ-اِرتویس» یعنی «به هم می‌پیوندد».**


    دژ بر زبانهٔ صخره‌ای باریکی در محل پیوستن پاراوانی و متکواری برمی‌خیزد و هم‌زمان هر دو دره را زیر
    نظر دارد. تاریخ نخستین ساخت آن دانسته نیست؛ دیوارهایش لایه‌هایی از اوایل سده‌های میانه تا سدهٔ نوزدهم
    را در خود دارند. وقایع‌نگار، لئونتی مروولی، می‌نویسد اسکندر مقدونی در لشکرکشی‌اش به شرق خرتویسی را
    دید. تاریخ‌دانان این روایت را نمی‌پذیرند، اما نشان می‌دهد این صخره حتی به چشم نویسنده‌ای از سده‌های
    میانه چه کهن می‌نمود. افسانهٔ محلی از این هم فراتر می‌رود و می‌گوید اسکندر دژ را ویران کرد.


    استوارترین تاریخ بر خود دیوار نقش بسته است. در ۱۸۳۲ جهانگرد سوئیسی، فردریک دوبوا دو مونپرو، بالای
    درگاه کتیبه‌ای بلند به خط آسومتاورولی یافت: زاکاریا، پسر کامکامیشویلی، خزانه‌دار شاهنشاه، «این برج
    و بارو» را در ۱۳۵۴ آغاز کرد و در ۱۳۵۶ به پایان رساند. در بخش غربی ارگ، بر جای کلیسایی کهن‌تر، نمازخانه‌ای
    تک‌تالاری و کوچک از توف تراش‌خورده ایستاده است، تنها ۲٫۷ در ۴٫۳ متر، که کف محرابش مستقیم در دل صخره
    کنده شده است. کتیبه‌ای که اکنون از میان رفته و در سدهٔ نوزدهم منتشر شده بود، کلیسای کهن را به سال
    ۹۸۵ نسبت می‌داد.


    سپس سده‌های سخت فرا رسید: مغولان در سدهٔ سیزدهم، فرمانروایان سامتسخه از خاندان جاقلی، تسلیم به عثمانیان
    در ۱۵۷۸، بازپس‌گیری کوتاهی به دست پادشاه ارکله دوم در ۱۷۷۱ و سرانجام، در ۲۲ سپتامبر ۱۸۲۸، سپاهیان
    روس. تونل‌هایی که تا رود کنده شده بودند، در روزهای محاصره آب پادگان را تأمین می‌کردند. از ۲۰۰۷ خرتویسی
    همراه با واردزیا در فهرست موقت میراث جهانی یونسکو قرار دارد.


    به بالای ارگ بروید و پایین را بنگرید: دو رود در هم می‌تابند و یکی می‌شوند، و جادهٔ واردزیا کنار متکواری
    به سوی بالادست دور می‌شود.
  tip: >-
    سی تا چهل دقیقه کافی است و تقریباً هیچ وقتی از رانندگی‌تان نمی‌گیرد، چون جادهٔ واردزیا درست از پای
    دیوارها می‌گذرد. خودرو را کنار پل، پای صخره، بگذارید. راه بالا سنگی و پرشیب است و حتی در هوای خشک
    لیز، پس کفش مناسب بپوشید. بر دیوارها و لبه‌های صخره نرده‌ای نیست؛ دست کودکان را رها نکنید. ورود رایگان
    است و دروازه معمولاً باز. سرویس بهداشتی، کافه و خودپرداز نیست؛ نزدیک‌ترین‌ها در آسپیندزا، حدود ۱۵
    کیلومتر عقب‌تر، است. اتوبوس‌های گردشگری نزدیک ظهر ازدحام می‌کنند، پس زود بیایید یا در نور اواخر بعدازظهر.
  route: >-
    راه همان راه واردزیا است: از تفلیس جادهٔ E60/S1 را به سمت غرب تا خاشوری بگیرید، جادهٔ S8 را به سمت
    جنوب از بورجومی تا آخالتسیخه، و سپس جادهٔ S11 را از راه آسپیندزا در امتداد درهٔ متکواری. خرتویسی همان‌جا
    سر برمی‌آورد که جاده دوشاخه می‌شود: S11 در امتداد پاراوانی تا آخالکالاکی بالا می‌رود، و جادهٔ واردزیا
    ۱۶ کیلومتر دیگر کنار متکواری می‌ماند. روی هم حدود ۲۵۰ کیلومتر و چهار ساعت، سراسر آسفالت، و در پایان
    باریک و پرپیچ‌وخم. در آخالتسیخه یا آسپیندزا سوخت بزنید. خودروی کلاس اقتصادی کاملاً کافی است. راه کوتاه‌تری
    به طول حدود ۲۱۰ کیلومتر از فلات جاواختی و از راه تسالکا و آخالکالاکی می‌گذرد: در تابستان خوب، در زمستان
    سخت.
he:
  name: מבצר חרטוויסי
  short: >-
    מבצר על שלוחת סלע במקום שבו הפרוואני נשפך אל המטקוורי; כתובת מתארכת את מגדלו וחומותיו ל-1354–1356.
    על הדרך לוורדזיה.
  body: >-
    **חרטוויסי עומד במקום שבו נהר אחד נשפך אל נהר אחר, והשם אומר זאת במפורש: בשלב החאנמטי הארכאי של השפה
    הגאורגית, "ח-ארטוויס" פירושו "מתחבר".**


    המבצר מתנשא על שלוחת סלע צרה במפגש הפרוואני והמטקוורי, וצופה על שני הערוצים בבת אחת. מועד בנייתו הראשונה
    אינו ידוע; בחומותיו יש שכבות מימי הביניים המוקדמים ועד המאה ה-19. הכרוניקן לאונטי מרוולי כותב שאלכסנדר
    מוקדון ראה את חרטוויסי במסעו מזרחה. ההיסטוריונים אינם מקבלים את הסיפור, אבל הוא מלמד עד כמה עתיק נראה
    הסלע הזה אפילו לכותב מימי הביניים. האגדה המקומית הולכת רחוק יותר וטוענת שאלכסנדר החריב את המבצר.


    התאריך המוצק ביותר חקוק על החומה עצמה. ב-1832 מצא הנוסע השווייצרי פרדריק דובואה דה מונפרה מעל הכניסה
    כתובת ארוכה בכתב אסומטוורולי: זכריה, בנו של קמקמישווילי, גזבר מלך המלכים, החל את "המגדל הזה והחומה
    הזאת" ב-1354 וסיים אותם ב-1356. במערב המצודה, במקומה של כנסייה עתיקה יותר, ניצבת קפלה זעירה בת אולם
    אחד מאבן טוף מסותתת, 2.7 על 4.3 מטרים בלבד, ורצפת המזבח שלה חצובה היישר בסלע. כתובת שאבדה מאז, ופורסמה
    במאה ה-19, תיארכה את הכנסייה הישנה לשנת 985.


    אחר כך באו המאות הקשות: המונגולים במאה ה-13, שליטי סמצחה מבית ג'אקלי, הכניעה לעות'מאנים ב-1578, כיבוש
    מחדש קצר בידי המלך ארקלה השני ב-1771, וב-22 בספטמבר 1828 — הצבא הרוסי. מנהרות שנחצבו עד הנהר סיפקו
    לחיל המצב מים בימי מצור. מאז 2007 חרטוויסי נמצא, יחד עם ורדזיה, ברשימה הזמנית של אתרי המורשת העולמית
    של אונסק״ו.


    טפסו לראש המצודה והביטו למטה: שני נהרות נשזרים לאחד, והדרך לוורדזיה מתחמקת במעלה הזרם לצד המטקוורי.
  tip: >-
    שלושים עד ארבעים דקות מספיקות, וזה כמעט לא עולה לכם בזמן נסיעה, כי הדרך לוורדזיה עוברת ממש מתחת לחומות.
    השאירו את הרכב ליד הגשר שלמרגלות הסלע. השביל למעלה הוא אבן תלולה, חלקלקה גם כשיבש, אז נעלו נעליים
    ראויות. אין מעקות על החומות ועל שפות הסלע; החזיקו את הילדים ביד. הכניסה חינם והשער בדרך כלל פתוח.
    אין שירותים, בית קפה או כספומט; הקרובים ביותר נמצאים באספינדזה, כ-15 ק״מ אחורה. אוטובוסי תיירים מצטופפים
    סביב הצהריים, אז בואו מוקדם או באור של שעות אחר הצהריים המאוחרות.
  route: >-
    הדרך זהה לדרך לוורדזיה: מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, בכביש S8 דרומה דרך בורג'ומי עד אחלציחה,
    ואז בכביש S11 דרך אספינדזה לאורך ערוץ המטקוורי. חרטוויסי מתנשא במקום שבו הדרך מתפצלת: כביש S11 עולה
    לאורך הפרוואני לאחלקלקי, ואילו הדרך לוורדזיה נצמדת למטקוורי עוד 16 ק״מ. בסך הכול כ-250 ק״מ וארבע שעות,
    אספלט לכל אורך הדרך, צר ומפותל בסופה. תדלקו באחלציחה או באספינדזה. רכב מקטגוריית אקונומי הוא כל מה
    שצריך. דרך קצרה יותר, של כ-210 ק״מ, חוצה את רמת ג'אווחטי דרך צלקה ואחלקלקי: טובה בקיץ, קשה בחורף.
ar:
  name: قلعة خيرتفيسي
  short: >-
    قلعة على لسان صخري حيث يصب نهر بارافاني في متكفاري، يؤرّخ نقشٌ برجها وأسوارها بعامي 1354–1356. على
    الطريق إلى فاردزيا.
  body: >-
    **تقوم خيرتفيسي حيث يصب نهر في نهر آخر، والاسم يقول ذلك صراحة: ففي الجورجية القديمة من طور «الخانميتي»،
    تعني «خ-إرتفيس» «يلتقي».**


    ترتفع القلعة على لسان صخري ضيق عند ملتقى بارافاني ومتكفاري، فتشرف على الواديين معاً. تاريخ بنائها
    الأول مجهول، وتحمل أسوارها طبقات من أوائل العصور الوسطى حتى القرن التاسع عشر. ويكتب المؤرخ ليونتي
    مروفيلي أن الإسكندر الأكبر رأى خيرتفيسي في حملته نحو الشرق. لا يقبل المؤرخون هذه الرواية، لكنها تبيّن
    كم بدت هذه الصخرة قديمة حتى لكاتب من العصور الوسطى. وتذهب الأسطورة المحلية أبعد من ذلك فتقول إن الإسكندر
    دمّر القلعة.


    وأوثقُ تاريخٍ هو المنقوش على السور نفسه. ففي عام 1832 عثر الرحالة السويسري فريدريك دوبوا دو مونبيرو
    فوق المدخل على نقش طويل بخط الأسومتافرولي: بدأ زكريا بن كامكاميشفيلي، خازن ملك الملوك، «هذا البرج
    والسور» عام 1354 وأتمّه عام 1356. وفي غرب القلعة الداخلية، في موضع كنيسة أقدم، يقوم مصلى صغير جداً
    ذو قاعة واحدة من حجر الطُّف المشذّب، لا تتجاوز أبعاده 2.7 في 4.3 أمتار، وأرضية مذبحه منحوتة مباشرة
    في الصخر. وقد أرّخ نقش مفقود اليوم، نُشر في القرن التاسع عشر، الكنيسةَ القديمة بعام 985.


    ثم جاءت القرون الصعبة: المغول في القرن الثالث عشر، وحكام سامتسخه من آل جاقيلي، والاستسلام للعثمانيين
    عام 1578، واستعادة قصيرة على يد الملك إريكلي الثاني عام 1771، ثم القوات الروسية في 22 سبتمبر 1828.
    وكانت أنفاق محفورة نزولاً إلى النهر تمدّ الحامية بالماء في أثناء الحصار. ومنذ عام 2007 أُدرجت خيرتفيسي
    مع فاردزيا في القائمة المؤقتة للتراث العالمي لليونسكو.


    اصعد إلى قمة القلعة وانظر إلى الأسفل: نهران يتضافران في نهر واحد، وطريق فاردزيا ينسلّ صعوداً مع أعالي
    متكفاري.
  tip: >-
    تكفي ثلاثون إلى أربعين دقيقة، ولا تكاد تكلّفك شيئاً من وقت القيادة، فطريق فاردزيا يمر تحت الأسوار
    مباشرة. اترك السيارة عند الجسر أسفل الصخرة. الدرب إلى الأعلى حجري شديد الانحدار وزلق حتى في الجفاف،
    فالبس حذاءً مناسباً. لا درابزين على الأسوار أو الحواف الصخرية، فأمسك بأيدي الأطفال. الدخول مجاني والبوابة
    مفتوحة عادةً. لا دورة مياه ولا مقهى ولا صراف آلي؛ أقربها في أسبيندزا على بعد نحو 15 كم إلى الخلف.
    تتكدس حافلات السياح حول الظهيرة، فتعال باكراً أو في ضوء آخر العصر.
  route: >-
    الطريق هو نفسه إلى فاردزيا: من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، ثم الطريق S8 جنوباً عبر
    بورجومي حتى أخالتسيخه، ثم الطريق S11 مروراً بأسبيندزا على امتداد وادي متكفاري. ترتفع خيرتفيسي حيث
    يتفرع الطريق: يصعد S11 مع نهر بارافاني إلى أخالكالاكي، بينما يلازم طريق فاردزيا نهر متكفاري 16 كم
    أخرى. المجموع نحو 250 كم وأربع ساعات، والطريق معبّد كله، ضيق ومتعرج في آخره. تزوّد بالوقود في أخالتسيخه
    أو أسبيندزا. والسيارة الاقتصادية تكفي تماماً. وثمة طريق أقصر، نحو 210 كم، يعبر هضبة جافاخيتي عبر تسالكا
    وأخالكالاكي: جيد في الصيف، قاسٍ في الشتاء.
