ka:
  name: ხერთვისის ციხე
  short: ორი მდინარის შესართავთან აღმართული ერთ-ერთი უძველესი ქართული ციხე, ვარძიის გზაზე.
  body: >
    ხერთვისი მტკვრისა და ფარავნის შესართავთან, ვიწრო კლდოვან კონცხზე დგას — ზუსტად იქ, სადაც ორი ხეობა
    ერთმანეთს ხვდება. სახელიც სწორედ ამას ნიშნავს: ადგილი მდინარეთა შესაყარზე. სტრატეგიულად უკეთეს პოზიციას
    ამ მხარეში ვერ იპოვი, და სწორედ ამიტომ იდგა აქ სიმაგრე ანტიკური ხანიდან.


    ხალხური თქმულება ციხის დანგრევას ალექსანდრე მაკედონელს მიაწერს. ეს, რა თქმა უნდა, ლეგენდაა, მაგრამ
    იმაზე მიუთითებს, თუ რამდენად ძველად ითვლებოდა ეს ადგილი უკვე შუა საუკუნეებში. დღეს შემორჩენილი გალავანი
    და კოშკები ძირითადად XIV–XVI საუკუნეებისაა, ეკლესია კი გაცილებით ადრეული.


    რას ნახავს სტუმარი:


    - მაღალი გალავანი და კოშკები, რომლებიც კლდის ფორმას მიჰყვება

    - ციტადელი ზედა დონეზე

    - ხედი ორი მდინარის შესართავზე და ვარძიისკენ მიმავალ ხეობაზე


    ციხე თითქმის ყოველთვის ღიაა და უფასო. მასში ასვლა თავისუფალია, თუმცა კიბეები, აივნები და კედლების
    ნაწილი დაუცველია — მოაჯირები არსად არაა და ბავშვს თვალი უნდა ადევნო.


    ვარძიისკენ მიმავალი გზა პირდაპირ ციხის ძირში გადის, ამიტომ ეს ოცდაათწუთიანი გაჩერება მარშრუტიდან პრაქტიკულად
    არაფერს ჭამს.


    ხერთვისიდან რამდენიმე კილომეტრში კიდევ ორი ობიექტია, რომელიც ხშირად რჩება გამორჩენილი: თმოგვის ციხე
    მტკვრის მეორე ნაპირზე და ვანის ქვაბები — კლდეში ნაკვეთი სამონასტრო კომპლექსი ვარძიის მოპირდაპირე მხარეს.
    თუ ვარძიაზე დრო გრჩება, ეს ორი დამატება მარშრუტს კარგად ავსებს.
  tip: >-
    ხერთვისი ვარძიისკენ მიმავალი გზის ბუნებრივი გაჩერებაა და ოცდაათი-ორმოცი წუთი სავსებით საკმარისია.
    მანქანა ხიდთან, ციხის ძირში დატოვე. ასვლა ქვის ციცაბო ბილიკითაა და მშრალ ამინდშიც პრიალაა — მაგარლანჩხიანი
    ფეხსაცმელი აუცილებელია, სანდლებით არ ღირს. მოაჯირები არსად არაა, ამიტომ ბავშვები ხელით უნდა გეჭიროს.
    ტუალეტი, კაფე და ბანკომატი აქ არაა — უახლოესი ასპინძაშია, დაახლოებით თხუთმეტ კილომეტრში.
  route: >
    მარშრუტი იგივეა, რაც ვარძიისკენ: თბილისიდან E60-ით ხაშურამდე, სამხრეთით ბორჯომსა და ახალციხეზე, შემდეგ
    ასპინძის მიმართულებით მტკვრის ხეობაში. ხერთვისი გზის პირას, ვარძიამდე დაახლოებით თხუთმეტი კილომეტრით
    ადრეა და შორიდანვე ჩანს. სულ ორასორმოცდაათი კილომეტრი, ოთხი საათი. ასფალტი ბოლომდე კარგია, ბოლო მონაკვეთი
    ვიწრო და მოხვევებიანი. საწვავი ახალციხეში აავსე. ეკონომ კლასი სავსებით საკმარისია, ცალკე გამავლობა
    არსად სჭირდება. ავტობუსები ხშირად ჩერდებიან ხიდთან, ამიტომ პარკინგის ადგილი შუადღისას შეიძლება არ
    დაგხვდეს — ცოტა ადრე ან გვიან მისვლა სჯობს.
en:
  name: Khertvisi Fortress
  short: One of the oldest fortresses in Georgia, standing where two rivers meet on the road to Vardzia.
  body: >-
    Khertvisi sits on a narrow rock spur at the confluence of the Mtkvari and the Paravani, exactly where
    two gorges meet. The name says as much: a place at the junction of rivers. There is no better defensive
    position in this part of Meskheti, which is why a stronghold has stood here since antiquity.


    Folk tradition credits Alexander the Great with destroying the fortress. That is legend rather than
    history, but it shows how ancient the site was already considered in the Middle Ages. The walls and
    towers you see today are mostly 14th to 16th century, while the small church on the site is considerably
    older.


    What there is to see:


    - high curtain walls and towers that follow the shape of the rock

    - the citadel on the upper level

    - views over the river confluence and the gorge running on towards Vardzia


    The fortress is essentially always open and free to enter. You can climb through it freely, but stairs,
    ledges and sections of wall are unprotected — there are no railings anywhere, and children need to
    be held.


    Because the Vardzia road passes directly beneath the walls, this stop costs almost nothing in driving
    time.
  tip: >-
    Khertvisi is the natural pause on the drive to Vardzia, and thirty to forty minutes is enough. Leave
    the car by the bridge at the foot of the rock. The climb goes up a steep stone path that is slippery
    even in dry weather, so proper shoes matter and sandals are a bad idea. There are no railings, so
    keep hold of children on the upper walls. No toilets, cafe or ATM here — the nearest are in Aspindza,
    about fifteen kilometres away.
  route: >-
    The route is the same as for Vardzia: E60 from Tbilisi to Khashuri, south through Borjomi and Akhaltsikhe,
    then towards Aspindza along the Mtkvari gorge. Khertvisi stands right at the roadside about fifteen
    kilometres before Vardzia and is visible long before you reach it. Around 250 km and four hours in
    total. The asphalt is good the whole way, with the last stretch narrow and winding. Fill up in Akhaltsikhe.
    An economy car is entirely sufficient; nothing here requires clearance.
ru:
  name: Крепость Хертвиси
  short: Одна из древнейших крепостей Грузии — на слиянии двух рек, прямо по дороге к Вардзии.
  body: >
    Хертвиси стоит на узком скальном выступе при слиянии Куры и Паравани, ровно там, где сходятся два
    ущелья. Название об этом и говорит: место на стрелке рек. Лучшей оборонительной позиции в этой части
    Месхети нет, поэтому укрепление здесь существовало ещё в античности.


    Народное предание приписывает разрушение крепости Александру Македонскому. Это, разумеется, легенда,
    но она показывает, насколько древним место считалось уже в Средневековье. Сохранившиеся стены и башни
    относятся в основном к XIV-XVI векам, а небольшая церковь на территории заметно старше.


    Что можно увидеть:


    - высокие стены и башни, повторяющие форму скалы

    - цитадель на верхнем уровне

    - вид на слияние рек и на ущелье, уходящее к Вардзии


    Крепость практически всегда открыта, вход свободный и бесплатный. Лазить по ней можно где угодно,
    но лестницы, карнизы и часть стен ничем не ограждены: перил нет нигде, детей нужно держать за руку.


    Дорога на Вардзию проходит прямо под стенами, поэтому получасовая остановка почти не удлиняет маршрут.


    В нескольких километрах от Хертвиси есть ещё два объекта, которые часто пропускают: крепость Тмогви
    на другом берегу Куры и Ванские пещеры — вырубленный в скале монастырский комплекс напротив Вардзии.
    Если после Вардзии остаётся время, эти две точки хорошо дополняют маршрут.
  tip: >-
    Хертвиси — естественная пауза по дороге в Вардзию, тридцати-сорока минут достаточно. Машину оставляйте
    у моста, под скалой. Подъём идёт по крутой каменной тропе, скользкой даже в сухую погоду, так что
    нужна обувь с рифлёной подошвой, сандалии — плохая идея. Перил нет, детей на верхних стенах держите
    за руку. Туалета, кафе и банкомата здесь нет, ближайшие — в Аспиндзе, примерно в пятнадцати километрах.
  route: >-
    Маршрут тот же, что и к Вардзии: из Тбилиси по E60 до Хашури, затем на юг через Боржоми и Ахалцихе,
    дальше в сторону Аспиндзы вдоль ущелья Куры. Хертвиси стоит прямо у дороги, километров за пятнадцать
    до Вардзии, и виден издалека. Всего около 250 км и четыре часа. Асфальт хороший на всём протяжении,
    последний участок узкий и извилистый. Заправляйтесь в Ахалцихе. Достаточно машины эконом-класса, повышенный
    клиренс нигде не нужен.
fa:
  name: دژ خرتویسی
  short: از کهن‌ترین دژهای گرجستان، ایستاده در محل تلاقی دو رود، بر سر راه واردزیا.
  body: >-
    خرتویسی روی زبانه‌ای باریک از صخره در محل به‌هم‌پیوستن متکواری و پاراوانی نشسته است، درست جایی که
    دو تنگه به هم می‌رسند. نام هم همین را می‌گوید: جایی در محل پیوستن رودها. در این بخش از مسختی موقعیت
    دفاعی بهتری وجود ندارد و به همین دلیل از دوران باستان اینجا استحکاماتی برپا بوده است.


    سنت مردمی ویرانی دژ را به اسکندر مقدونی نسبت می‌دهد. این افسانه است نه تاریخ، اما نشان می‌دهد که این
    محل در سده‌های میانه هم چقدر کهن شمرده می‌شد. دیوارها و برج‌هایی که امروز می‌بینید بیشتر از سدهٔ چهاردهم
    تا شانزدهم‌اند، در حالی که کلیسای کوچک محوطه به‌مراتب کهن‌تر است.


    آنچه می‌توان دید:


    - دیوارهای پردهٔ بلند و برج‌هایی که شکل صخره را دنبال می‌کنند

    - ارگ در تراز بالایی

    - نمای محل به‌هم‌پیوستن رودها و تنگه‌ای که به سوی واردزیا ادامه می‌یابد


    دژ عملاً همیشه باز است و ورود به آن رایگان. می‌توانید آزادانه در آن بالا و پایین بروید، اما پله‌ها،
    لبه‌ها و بخش‌هایی از دیوار هیچ حفاظی ندارند — هیچ‌جا نرده نیست و باید دست بچه‌ها را گرفت.


    چون جادهٔ واردزیا درست از زیر دیوارها می‌گذرد، این توقف تقریباً هیچ زمانی از رانندگی نمی‌گیرد.
  tip: >-
    خرتویسی توقف طبیعی مسیر واردزیا است و سی تا چهل دقیقه کافی است. ماشین را کنار پل، پای صخره بگذارید.
    بالا رفتن از راه‌پله‌ای سنگی و تند است که حتی در هوای خشک لغزنده است، پس کفش مناسب مهم است و صندل
    انتخاب بدی است. نرده وجود ندارد، پس روی دیوارهای بالایی دست بچه‌ها را رها نکنید. اینجا سرویس بهداشتی،
    کافه یا خودپرداز نیست — نزدیک‌ترین‌ها در اسپیندزا، حدود پانزده کیلومتر آن‌طرف‌ترند.
  route: >-
    مسیر همان مسیر واردزیا است: E60 از تفلیس تا خاشوری، سپس به سوی جنوب از بورجومی و آخالتسیخه، و بعد
    به سمت اسپیندزا در امتداد تنگهٔ متکواری. خرتویسی درست کنار جاده، حدود پانزده کیلومتر پیش از واردزیا
    ایستاده و از فاصلهٔ دور دیده می‌شود. روی‌هم نزدیک 250 کیلومتر و چهار ساعت. آسفالت در تمام مسیر خوب
    است و بخش پایانی باریک و پرپیچ. در آخالتسیخه سوخت‌گیری کنید. ماشین اقتصادی کاملاً کافی است؛ اینجا
    هیچ چیز به ارتفاع کف نیاز ندارد.
he:
  name: מבצר חרתוויסי
  short: אחד המבצרים העתיקים בגאורגיה, הניצב במפגש שני נהרות בדרך לורדזיה.
  body: >-
    חרתוויסי יושב על לשון סלע צרה במפגש המטקווארי והפאראווני, בדיוק במקום שבו נפגשים שני ערוצים. השם אומר
    בדיוק את זה: מקום בצומת הנהרות. אין עמדת הגנה טובה מזו בחלק הזה של מסחתי, ולכן עומד כאן מעוז מבוצר
    עוד מן העת העתיקה.


    המסורת העממית מייחסת לאלכסנדר מוקדון את חורבן המבצר. זו אגדה ולא היסטוריה, אבל היא מלמדת עד כמה נחשב
    האתר עתיק כבר בימי הביניים. החומות והמגדלים שרואים היום הם ברובם מן המאה ה-14 עד ה-16, ואילו הכנסייה
    הקטנה שבשטח עתיקה בהרבה.


    מה יש לראות:


    - חומות גבוהות ומגדלים העוקבים אחרי צורת הסלע

    - המצודה במפלס העליון

    - נוף אל מפגש שני הנהרות ואל הערוץ הממשיך הלאה לכיוון ורדזיה


    המבצר פתוח למעשה תמיד והכניסה אליו חינם. אפשר לטפס ולהסתובב בו בחופשיות, אך המדרגות, המדפים וקטעי
    החומה חשופים לגמרי — אין מעקות בשום מקום, וצריך להחזיק ילדים ביד.


    מכיוון שהכביש לורדזיה עובר ממש מתחת לחומות, העצירה הזאת כמעט אינה עולה לכם זמן נסיעה כלל.
  tip: >-
    חרתוויסי הוא ההפסקה הטבעית בדרך לורדזיה, ושלושים עד ארבעים דקות מספיקות. השאירו את הרכב ליד הגשר למרגלות
    הסלע. הטיפוס עולה בשביל אבן תלול שחלקלק גם במזג אוויר יבש, ולכן נעליים מתאימות חשובות וסנדלים הם רעיון
    גרוע. אין מעקות, לכן החזיקו ילדים ביד על החומות העליונות. אין כאן שירותים, בית קפה או כספומט — הקרובים
    ביותר נמצאים באספינדזה, כחמישה עשר קילומטרים משם.
  route: >-
    המסלול זהה לזה של ורדזיה: כביש E60 מטביליסי לחשורי, דרומה דרך בורג'ומי ואחאלציחה, ואז לכיוון אספינדזה
    לאורך ערוץ המטקווארי. חרתוויסי ניצב ממש בצד הדרך כחמישה עשר קילומטרים לפני ורדזיה, ורואים אותו הרבה
    לפני שמגיעים אליו. בסך הכול כ-250 ק״מ וארבע שעות. האספלט טוב לכל האורך, והקטע האחרון צר ומפותל. מלאו
    דלק באחאלציחה. רכב אקונומי מספיק לחלוטין; שום דבר כאן אינו דורש גובה גחון.
ar:
  name: حصن خيرتفيسي
  short: أحد أقدم الحصون في جورجيا، يقوم عند ملتقى نهرين على الطريق إلى فاردزيا.
  body: >-
    يجلس خيرتفيسي على نتوء صخري ضيق عند ملتقى نهري متكفاري وبارافاني، في الموضع الذي يلتقي فيه مضيقان
    تماماً. والاسم يقول ذلك بنفسه: مكان عند مفترق الأنهار. ولا موقع دفاعي أفضل منه في هذا الجزء من ميسخيتي،
    ولهذا قام هنا حصن منذ العصور القديمة.


    وينسب التقليد الشعبي إلى الإسكندر الأكبر تدمير الحصن. وذلك أسطورة لا تاريخ، لكنه يبيّن كم كان الموقع
    يُعدّ قديماً بالفعل في العصور الوسطى. أما الأسوار والأبراج التي تراها اليوم فمعظمها من القرن الرابع
    عشر إلى السادس عشر، في حين أن الكنيسة الصغيرة في الموقع أقدم بكثير.


    ما يمكن رؤيته:


    - أسوار ستارية عالية وأبراج تتبع شكل الصخرة

    - القلعة الداخلية في المستوى العلوي

    - إطلالات على ملتقى النهرين وعلى المضيق الممتد نحو فاردزيا


    والحصن مفتوح دائماً عملياً والدخول إليه مجاني. يمكنك التسلق فيه بحرية، لكن الدرجات والحواف وأجزاءً
    من السور بلا حماية — فلا سياج في أي مكان، ويجب الإمساك بالأطفال.


    ولأن طريق فاردزيا يمر مباشرة تحت الأسوار، فإن هذه الوقفة لا تكلفك شيئاً يُذكر من زمن القيادة.
  tip: >-
    خيرتفيسي هو الاستراحة الطبيعية في الطريق إلى فاردزيا، وثلاثون إلى أربعون دقيقة تكفي. اترك السيارة
    عند الجسر عند سفح الصخرة. ويصعد الطريق في درب حجري حاد يبقى زلقاً حتى في الطقس الجاف، فالحذاء المناسب
    مهم والصنادل فكرة سيئة. ولا توجد أسيجة، فأمسك بالأطفال على الأسوار العليا. ولا دورات مياه ولا مقهى
    ولا صراف آلي هنا — وأقربها في أسبيندزا على بعد نحو خمسة عشر كيلومتراً.
  route: >-
    المسار هو نفسه المؤدي إلى فاردزيا: الطريق E60 من تبليسي إلى خاشوري، ثم جنوباً عبر بورجومي وأخالتسيخي،
    ثم نحو أسبيندزا على طول مضيق متكفاري. ويقوم خيرتفيسي عند حافة الطريق مباشرة على بعد خمسة عشر كيلومتراً
    تقريباً قبل فاردزيا، ويُرى من مسافة بعيدة قبل الوصول إليه. نحو 250 كم وأربع ساعات إجمالاً. والإسفلت
    جيد طوال الطريق، والمقطع الأخير ضيق وكثير التعرج. املأ الخزان في أخالتسيخي. وسيارة اقتصادية كافية
    تماماً؛ ولا شيء هنا يتطلب خلوصاً أرضياً.
