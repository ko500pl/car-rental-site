ka:
  name: სხალთის ტაძარი
  short: >-
    XIII საუკუნის დარბაზული ტაძარი ზემო აჭარის ტყიან ხეობაში: ოსმალობისას მიტოვებული, 1874 წელს ჩახატული,
    1990 წლიდან კვლავ მოქმედი.
  body: >-
    **აჭარის შუა საუკუნეების ეკლესიებიდან მხოლოდ სხალთამ გადაიტანა ოსმალური და საბჭოთა საუკუნეები და კვლავ
    წირვა-ლოცვას დაუბრუნდა.**


    ის სოფელ ყინჩაურში, სხალთის ხეობაში, დაბალ გორაკზე დგას, იმ გზის პირას, რომელიც შუა საუკუნეებში აჭარას
    არტაანთან (დღევანდელ არდაჰანთან თურქეთში) აკავშირებდა. გადმოცემა ტაძრის აშენებას თამარ მეფეს მიაწერს,
    მკვლევრები კი მას XIII საუკუნის შუა ხანებით ათარიღებენ, ანუ თამარის გარდაცვალების შემდგომი დროით,
    როცა ხეობა აბუსერისძეებს ეკავათ. ალექსანდრე I-ის მეფობის (1412–1442) ერთი საბუთი სხალთას მცხეთის საპატრიარქო
    საყდრის კუთვნილებად იხსენიებს.


    XVI საუკუნის ოსმალური დაპყრობის შემდეგ ტაძარი მიატოვეს. 1874 წელს იგი ჩახატა გიორგი ყაზბეგმა, რუსეთის
    სამსახურში მყოფმა ქართველმა ოფიცერმა, რომელიც ოსმალეთის საქართველოში სადაზვერვო მისიით მოგზაურობდა.
    1878 წლის შემდეგ მის აღსაწერად დიმიტრი ბაქრაძე და გრაფინია პრასკოვია უვაროვა ჩამოვიდნენ; მაშინ ტაძარი
    მუსლიმი ქართველი ბეგის, შერიფ-ბეგის მამულში იდგა. აღდგენითი სამუშაოების დაწყებამდე მას სახურავი არ
    ჰქონდა.


    აღორძინება საბჭოთა ეპოქის მიწურულს დადგა. 1989 წლის ივნისში კათოლიკოს-პატრიარქმა ილია II-მ აქ იმავე
    წლის მეწყრებისა და წყალდიდობების მსხვერპლთათვის პანაშვიდი გადაიხადა, 1990 წელს კი სხალთა ღვთისმშობლის
    შობის სახელობის მამათა მონასტრად აკურთხეს. დღეს ის სხალთის ეპისკოპოსის კათედრაა.


    ნელა დაათვალიერეთ:

    - შვიდწახნაგა აფსიდი, აღმოსავლეთ ფასადზე კი ჯვრის ფორმის სამი ჩუქურთმა

    - ფართო დარბაზი, რომელსაც ძლიერ პილასტრებზე დაყრდნობილი გრძელი ცილინდრული კამარა ხურავს

    - XIV–XV საუკუნეების პალეოლოგოსური სტილის მოხატულობის ფრაგმენტები: ახალი აღთქმის სცენები, 1997 წელს
    გამოვლენილი


    სადაც თლილი საპირე ქვა შემორჩა, XIII საუკუნეს უყურებთ; სადაც ის ამოგლიჯეს, მომდევნო საუკუნეებს.
  tip: >-
    დაუთმეთ ერთი საათი, მეტიც, თუ ბერს სალაპარაკოდ სცალია. ეს მოქმედი მონასტერია: მხრები და მუხლები დაფარული
    უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ. თუ კარი დაკეტილია, მასზე მიწერილი ტელეფონის ნომერი მოძებნეთ.
    კაფე და მაღაზია აქ არ არის, ამიტომ ხულოში ისადილეთ. ხეობაში უფრო ღრმად, ბაკოსთან, ხიხანის ციხისკენ
    მიმავალი ბილიკი იწყება; ის საზღვარს მიუყვება, ამიტომ მესაზღვრეებთან რეგისტრაციისთვის პასპორტი წაიღეთ.
    ზამთარში ხეობას თოვლი კეტავს: ჩამოდით მაისიდან ოქტომბრამდე.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, ს12-ით გრიგოლეთამდე და ს2-ით ბათუმამდე, შემდეგ
    კი ბათუმი-ახალციხის გზით აჭარისწყლის ხეობას აუყევით, ქედისა და შუახევის გავლით. ხულომდე ცოტა ადრე,
    ფურტიოსთან, გვერდითი გზა სამხრეთით, სხალთის ხეობაში უხვევს; ეს გადახვევა დაახლოებით 40 წუთს მოითხოვს.
    თბილისიდან სულ დაახლოებით 470 კმ და შვიდნახევარი საათია. გზა მოასფალტებულია, მაგრამ ვიწრო, კლაკნილი
    და ხშირად სველი, ამიტომ მაღალი გამავლობის ავტომობილი ყველაზე კომფორტული არჩევანია. საწვავი ქედასა
    და ხულოშია. ზაფხულში ახალციხისა და გოდერძის უღელტეხილის გავლით დაახლოებით 300 კმ-ია, თუ ქირავნობის
    ხელშეკრულება უღელტეხილზე გადასვლის უფლებას გაძლევთ. ნებისმიერ შემთხვევაში ღამე ხულოში გაათიეთ.
en:
  name: Skhalta Cathedral
  short: >-
    A 13th-century hall church in a forested valley of Upper Adjara: abandoned under the Ottomans, sketched
    by a scout in 1874, alive again since 1990.
  body: >-
    **Of all Adjara's medieval churches, only Skhalta outlived the Ottoman and Soviet centuries to hold
    services again.**


    It stands on a low hill at Kinchauri, in the valley of the Skhalta river, beside what was once a strategic
    road from Adjara to Artani, today's Ardahan in Turkey. Tradition credits Queen Tamar with building
    it; scholars date it to the middle of the 13th century, after her death, when the valley belonged
    to the noble Abuserisdze family. A document from the reign of Alexander I (1412–1442) lists Skhalta
    among the possessions of the patriarchal see of Mtskheta.


    After the Ottoman conquest of the 16th century the church was abandoned. In 1874 Giorgi Kazbegi, a
    Georgian officer scouting Ottoman Georgia for Russia, sketched it; after 1878 the scholars Dimitri
    Bakradze and Countess Praskovya Uvarova came to describe it, on land then owned by a Muslim Georgian
    chief, Sherif-Bey. Until restoration began, it stood roofless.


    Its revival came at the very end of the Soviet era. In June 1989 Catholicos-Patriarch Ilia II held
    a requiem here for the victims of that year's landslides and floods; in 1990 Skhalta was consecrated
    as a monastery of the Nativity of the Virgin. It is now the seat of the bishop of Skhalta.


    Take the building slowly:

    - the seven-faceted apse and, on the east front, three carved crosses

    - one wide hall under a long barrel vault carried on strong pilasters

    - fragments of 14th–15th-century wall painting in the Palaiologan manner, New Testament scenes uncovered
    in 1997


    Where the dressed facing stone survives, you are looking at the 13th century; where it was prised
    away, at the centuries that came after.
  tip: >-
    Allow an hour, more if a monk has time to talk. This is a working monastery, so cover shoulders and
    knees; women should bring a headscarf. If the doors are locked, look for the phone number posted on
    them. There is no café or shop, so eat in Khulo. Further up the valley, near Bako, starts the hike
    to Khikhani fortress; it runs along the border, so carry your passport to register with the border
    police. Snow shuts the valley in winter; come between May and October.
  route: >-
    From Tbilisi take the S1 (E60) to Samtredia, the S12 to Grigoleti and the S2 to Batumi, then turn
    inland on the Batumi–Akhaltsikhe road up the Adjaristsqali through Keda and Shuakhevi. Shortly before
    Khulo, near Purtio, a side road turns south up the Skhalta valley, a detour of about 40 minutes. In
    all it is some 470 km and seven and a half hours from Tbilisi. The road is sealed but narrow, twisting
    and often wet, and an SUV is the comfortable choice. Fuel in Keda and Khulo. In summer the route via
    Akhaltsikhe and the Goderdzi Pass is about 300 km, if your rental contract allows the pass. Either
    way, sleep in Khulo.
ru:
  name: Схалтский собор
  short: >-
    Зальный храм XIII века в лесистой долине Верхней Аджарии: заброшенный при османах, зарисованный разведчиком
    в 1874 году, вновь живой с 1990-го.
  body: >-
    **Из всех средневековых храмов Аджарии лишь Схалта пережила османские и советские века и вновь стала
    местом богослужения.**


    Храм стоит на невысоком холме у Кинчаури, в долине реки Схалта, у дороги, которая некогда вела из
    Аджарии в Артани — нынешний турецкий Ардаган. Предание приписывает его постройку царице Тамар; учёные
    же датируют храм серединой XIII века, временем уже после её смерти, когда долиной владел знатный род
    Абусеридзе. Документ эпохи Александра I (1412–1442) упоминает Схалту среди владений мцхетского патриаршего
    престола.


    После османского завоевания XVI века храм был оставлен. В 1874 году его зарисовал Георгий Казбеги,
    грузинский офицер, разведывавший османскую Грузию для России; после 1878 года сюда приезжали описывать
    храм учёные Димитрий Бакрадзе и графиня Прасковья Уварова — земля тогда принадлежала мусульманскому
    грузинскому феодалу Шериф-бею. До самой реставрации храм стоял без крыши.


    Возрождение пришло на самом исходе советской эпохи. В июне 1989 года католикос-патриарх Илия II отслужил
    здесь панихиду по жертвам оползней и наводнений того года; в 1990 году Схалта была освящена как монастырь
    Рождества Богородицы. Ныне здесь кафедра епископа Схалтского.


    Рассматривайте здание не спеша:

    - семигранная апсида и три резных креста на восточном фасаде

    - единый широкий зал под протяжённым цилиндрическим сводом на мощных пилястрах

    - фрагменты стенной живописи XIV–XV веков в палеологовской манере, новозаветные сцены, раскрытые в
    1997 году


    Где сохранилась тёсаная облицовка — перед вами XIII век; где её сорвали — века, что пришли позже.
  tip: >-
    На посещение хватит часа, больше — если найдётся время поговорить с монахом. Это действующий монастырь,
    поэтому плечи и колени должны быть закрыты; женщинам стоит взять с собой платок. Если двери заперты,
    ищите номер телефона на них. Ни кафе, ни магазина здесь нет — поесть можно в Хуло. Выше по долине,
    у Бако, начинается тропа к крепости Хихани; она идёт вдоль границы, так что берите паспорт для регистрации
    у пограничников. Зимой долину закрывает снег; приезжайте с мая по октябрь.
  route: >-
    Из Тбилиси — по трассе S1 (E60) до Самтредиа, по S12 до Григолети и по S2 до Батуми, затем в глубь
    страны по дороге Батуми–Ахалцихе вдоль Аджарисцкали через Кеду и Шуахеви. Незадолго до Хуло, у Пуртио,
    боковая дорога уходит на юг, в долину Схалты — крюк примерно на 40 минут. Всего от Тбилиси около 470
    км и семь с половиной часов. Дорога с твёрдым покрытием, но узкая, извилистая и часто мокрая; удобнее
    всего ехать на внедорожнике. Заправки — в Кеде и Хуло. Летом маршрут через Ахалцихе и Годердзский
    перевал короче — около 300 км, если договор аренды разрешает проезд через перевал. В любом случае
    ночевать лучше в Хуло.
fa:
  name: کلیسای جامع سخالتا
  short: >-
    کلیسایی تک‌سالنی از سدهٔ سیزدهم در دره‌ای پرجنگل در آجارای بالا: در دوران عثمانی متروک شد، در ۱۸۷۴
    به دست یک افسر شناسایی ترسیم شد و از ۱۹۹۰ دوباره زنده است.
  body: >-
    **از میان همهٔ کلیساهای قرون‌وسطایی آجارا، تنها سخالتا سده‌های عثمانی و دوران شوروی را از سر گذراند
    تا بار دیگر در آن نیایش برگزار شود.**


    این کلیسا بر تپه‌ای کوتاه در کینچائوری ایستاده، در دره‌ی رود سخالتا، در کنار راهی که زمانی از آجارا
    به آرتانی می‌رفت، همان اردهان امروزی در ترکیه. روایت‌های محلی بنای آن را به ملکه تامار نسبت می‌دهند؛
    اما پژوهشگران آن را به میانهٔ سدهٔ سیزدهم، پس از مرگ او، بازمی‌گردانند، زمانی که این دره در اختیار
    خاندان اشرافی آبوسریدزه بود. سندی از دوران الکساندر یکم (۱۴۱۲–۱۴۴۲) سخالتا را در شمار املاک کرسی پاتریارکی
    متسختا برمی‌شمرد.


    پس از فتح عثمانی در سدهٔ شانزدهم، کلیسا متروک ماند. در سال ۱۸۷۴ گیورگی کازبگی، افسر گرجی که در مأموریتی
    شناسایی برای روسیه در گرجستان عثمانی بود، از آن طرحی کشید؛ پس از ۱۸۷۸ پژوهشگرانی چون دیمیتری باکرادزه
    و کنتس پراسکوویا اوواروا برای توصیف آن آمدند، در زمینی که آن‌گاه در تصرف شریف‌بیگ، از بزرگان گرجی
    مسلمان، بود. تا آغاز بازسازی، کلیسا بدون سقف ایستاده بود.


    احیای آن در واپسین سال‌های دوران شوروی رخ داد. در ژوئن ۱۹۸۹ کاتولیکوس-پاتریارک ایلیا دوم در همین‌جا
    مراسم یادبودی برای قربانیان رانش زمین و سیل‌های آن سال برگزار کرد؛ در سال ۱۹۹۰ سخالتا به‌عنوان صومعهٔ
    میلاد مریم باکره تقدیس شد. اکنون این‌جا مقر اسقف سخالتاست.


    بنا را با آرامش ببینید:

    - آپسیس هفت‌ضلعی و سه صلیب حجاری‌شده بر نمای شرقی

    - سالنی واحد و پهن زیر طاقی استوانه‌ای بلند که بر ستون‌نماهای ستبر تکیه دارد

    - بازمانده‌های نگارگری دیواری سده‌های چهاردهم و پانزدهم به سبک پالئولوگوس، صحنه‌هایی از عهد جدید که
    در سال ۱۹۹۷ آشکار شدند


    هر جا که سنگ تراش‌خوردهٔ نما برجاست، شما به سدهٔ سیزدهم می‌نگرید؛ هر جا که کنده شده، به سده‌هایی که
    از پی آن آمدند.
  tip: >-
    یک ساعت کافی است، بیشتر اگر راهبی فرصت گفت‌وگو داشته باشد. این صومعه‌ای فعال است، پس شانه‌ها و زانوها
    را بپوشانید؛ زنان بهتر است روسری همراه داشته باشند. اگر درها بسته بود، شماره‌تلفنی را که روی آن‌ها
    نوشته شده بجویید. اینجا کافه یا مغازه‌ای نیست، غذا را در خولو بخورید. بالاتر در دره، نزدیک باکو، مسیر
    پیاده‌روی به قلعهٔ خیخانی آغاز می‌شود؛ این مسیر در کنار مرز است، پس گذرنامه‌تان را برای ثبت نزد پلیس
    مرزی همراه داشته باشید. برف در زمستان دره را می‌بندد؛ بین ماه مه و اکتبر بیایید.
  route: >-
    از تفلیس مسیر S1 (E60) را تا سامتردیا بروید، S12 را تا گریگولتی و S2 را تا باتومی، سپس در جادهٔ باتومی–آخالتسیخه
    به‌سوی داخل کشور بپیچید و در امتداد آجاریستسکالی از کدا و شوآخوی بگذرید. کمی پیش از خولو، نزدیک پورتیو،
    راهی فرعی رو به جنوب به دره‌ی سخالتا می‌رود، انحرافی حدود ۴۰ دقیقه‌ای. در مجموع حدود ۴۷۰ کیلومتر و
    هفت‌ونیم ساعت از تفلیس. راه آسفالت اما باریک و پرپیچ‌وخم و اغلب خیس است؛ خودروی شاسی‌بلند گزینهٔ راحت‌تری
    است. سوخت را در کدا و خولو بزنید. در تابستان مسیر از راه آخالتسیخه و گذرگاه گودردزی حدود ۳۰۰ کیلومتر
    است، اگر قرارداد اجارهٔ خودرو عبور از گذرگاه را اجازه دهد. در هر صورت، شب را در خولو بمانید.
he:
  name: קתדרלת סחלטה
  short: >-
    כנסיית אולם מהמאה ה-13 בעמק מיוער באג'אריה העילית: ננטשה בתקופה העות'מאנית, צוירה בידי סייר ב-1874,
    וחזרה לחיים ב-1990.
  body: >-
    **מכל הכנסיות של אג'אריה מימי הביניים, רק סחלטה שרדה גם את המאות העות'מאניות וגם את התקופה הסובייטית,
    וחזרה לשמש לתפילה.**


    היא עומדת על גבעה נמוכה בקינצ'אורי, בעמק נהר סחלטה, לצד מה שהיה בזמנו דרך אסטרטגית מאג'אריה לארטני
    — כיום ארדהאן שבטורקיה. המסורת מייחסת את בנייתה למלכה תמר; החוקרים מתארכים אותה לאמצע המאה ה-13, אחרי
    מותה, כשהעמק היה בבעלות בית האצולה אבוסרידזה. מסמך מתקופת אלכסנדר הראשון (1412–1442) מונה את סחלטה
    בין נכסי הכס הפטריארכלי של מצחתה.


    לאחר הכיבוש העות'מאני במאה ה-16 ננטשה הכנסייה. ב-1874 שרטט אותה גיאורגי קזבגי, קצין גאורגי שסייר בגאורגיה
    העות'מאנית בשליחות רוסיה; לאחר 1878 הגיעו החוקרים דימיטרי בקראדזה והרוזנת פרסקוביה אובארובה לתאר אותה,
    בקרקע שהייתה אז בידי הנכבד הגאורגי המוסלמי שריף-ביי. עד תחילת השיקום עמדה הכנסייה בלי גג.


    תחייתה הגיעה בשלהי התקופה הסובייטית. ביוני 1989 ניהל הקתוליקוס-פטריארך איליה השני כאן טקס אזכרה לקורבנות
    מפולות האדמה והשיטפונות של אותה שנה; ב-1990 הוקדשה סחלטה כמנזר לידת מרים הבתולה. כיום היא מקום מושבו
    של הבישוף של סחלטה.


    התבוננו בבניין באיטיות:

    - האפסיס בעל שבע הפאות, ובחזית המזרחית שלושה צלבים מגולפים

    - אולם רחב אחד תחת קמרון חבית מוארך הנשען על עמודי דופן חזקים

    - שרידי ציורי קיר מהמאות ה-14 וה-15 בסגנון פלאיולוגי, סצנות מהברית החדשה שנחשפו ב-1997


    במקום שנשתמרה בו האבן המסותתת, אתם צופים במאה ה-13; ובמקום שבו נתלשה, במאות שבאו אחריה.
  tip: >-
    הקדישו שעה, ויותר אם לאחד הנזירים יש זמן לדבר. זהו מנזר פעיל, לכן כסו כתפיים וברכיים; נשים כדאי שיביאו
    כיסוי ראש. אם הדלתות נעולות, חפשו את מספר הטלפון המודבק עליהן. אין כאן בית קפה או חנות, אכלו בחולו.
    גבוה יותר בעמק, סמוך לבאקו, מתחיל מסלול ההליכה למצודת חיחני; הוא עובר צמוד לגבול, לכן קחו דרכון כדי
    להירשם אצל משטרת הגבולות. שלג סוגר את העמק בחורף; באו בין מאי לאוקטובר.
  route: >-
    מטביליסי סעו בכביש S1 (E60) עד סמטרדיה, ב-S12 עד גריגולטי וב-S2 עד בטומי, ואז פנו פנימה בכביש בטומי–אחלציחה
    במעלה נהר אג'אריסצקאלי דרך קדה ושואחווי. קצת לפני חולו, סמוך לפורטיו, כביש צד פונה דרומה לעמק סחלטה,
    סטייה של כ-40 דקות. בסך הכול כ-470 ק"מ ושבע וחצי שעות מטביליסי. הכביש סלול אך צר, מתפתל ולעיתים קרובות
    רטוב, ורכב שטח הוא הבחירה הנוחה. תדלקו בקדה ובחולו. בקיץ המסלול דרך אחלציחה ומעבר גודרדזי קצר יותר,
    כ-300 ק"מ, אם חוזה השכירות מתיר לחצות את המעבר. בכל מקרה, כדאי ללון בחולו.
ar:
  name: كاتدرائية سخالطا
  short: >-
    كنيسة ذات قاعة واحدة من القرن الثالث عشر في وادٍ مكسوّ بالغابات في أعالي أدجاريا: هُجرت في العهد العثماني،
    رسمها مستطلع عام 1874، وعادت إلى الحياة منذ 1990.
  body: >-
    **من بين كنائس أدجاريا كلها من العصور الوسطى، وحدها سخالطا نجت من القرون العثمانية والحقبة السوفيتية
    لتعود إليها الصلاة من جديد.**


    تقف على تلة منخفضة عند كينتشاوري، في وادي نهر سخالطا، إلى جانب ما كان طريقًا استراتيجيًا من أدجاريا
    إلى أرتاني، أردهان التركية اليوم. تنسب التقاليد الشعبية بناءها إلى الملكة تامار، أما الباحثون فيؤرّخونها
    إلى منتصف القرن الثالث عشر، بعد وفاتها، حين كان الوادي في حوزة أسرة أبوسريدزه النبيلة. وثيقة من عهد
    ألكسندر الأول (1412–1442) تُدرج سخالطا بين ممتلكات الكرسي البطريركي في متسخيتا.


    بعد الفتح العثماني في القرن السادس عشر، هُجرت الكنيسة. في عام 1874 رسمها غيورغي كازبيغي، الضابط الجورجي
    الذي كان يستطلع جورجيا العثمانية لروسيا؛ وبعد عام 1878 جاء الباحثان ديميتري باكرادزه والكونتيسة براسكوفيا
    أوفاروفا لوصفها، في أرض كانت في ملك الزعيم الجورجي المسلم شريف بيه. ظلت الكنيسة بلا سقف حتى بدأ ترميمها.


    جاءت نهضتها في الأيام الأخيرة من العهد السوفيتي. في يونيو 1989 أقام الكاثوليكوس البطريرك إيليا الثاني
    هنا صلاة تأبين لضحايا الانهيارات الأرضية والفيضانات في تلك السنة؛ وفي عام 1990 كُرّست سخالطا ديرًا
    لميلاد السيدة العذراء. وهي اليوم مقرّ أسقف سخالطا.


    تأمّل المبنى دون عجلة:

    - حنية سباعية الأضلاع، وعلى الجبهة الشرقية ثلاثة صلبان محفورة

    - قاعة واحدة عريضة تحت قبو نصف دائري طويل يرتكز على أكتاف جدارية متينة

    - بقايا رسوم جدارية من القرنين الرابع عشر والخامس عشر بالطراز البالايولوجي، مشاهد من العهد الجديد
    كُشف عنها عام 1997


    حيث بقي الحجر المصقول في واجهته، فأنت أمام القرن الثالث عشر؛ وحيث اقتُلع، فأمام القرون التي تلته.
  tip: >-
    خصص ساعة، وأكثر إن وجد أحد الرهبان وقتًا للحديث. هذا دير عامل، فغطِّ الكتفين والركبتين؛ وعلى النساء
    إحضار غطاء رأس. إن كانت الأبواب مقفلة، فابحث عن رقم الهاتف الملصق عليها. لا مقهى ولا متجر هنا، فتناول
    طعامك في خولو. أعلى الوادي، قرب باكو، يبدأ مسار المشي إلى قلعة خيخاني؛ وهو يسير محاذيًا للحدود، فاحمل
    جواز سفرك للتسجيل لدى شرطة الحدود. الثلج يقفل الوادي شتاءً؛ فتعال بين مايو وأكتوبر.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) إلى سامتريديا، ثم S12 إلى غريغوليتي، ثم S2 إلى باتومي، ثم انحرف إلى
    الداخل على طريق باتومي–أخالتسيخه صعودًا في وادي أدجاريستسكالي عبر كِدا وشوآخيفي. قبل خولو بقليل، قرب
    بورتيو، ينحرف طريق جانبي جنوبًا إلى وادي سخالطا، وهو التفاف يستغرق نحو 40 دقيقة. المسافة الإجمالية
    من تبليسي نحو 470 كم وسبع ساعات ونصف. الطريق مُعبّد لكنه ضيق ومتعرّج وكثيرًا ما يكون مبتلًا، والسيارة
    الرباعية الدفع هي الخيار المريح. عبّئ الوقود في كدا أو خولو. في الصيف يكون المسار عبر أخالتسيخه وممر
    غودردزي أقصر، نحو 300 كم، إن كان عقد استئجار السيارة يسمح بعبور الممر. وفي كل الأحوال، فلتكن ليلتك
    في خولو.
