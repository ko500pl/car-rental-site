ka:
  name: სხალთის ტაძარი
  short: >-
    XIII საუკუნის ეკლესია მთის ხეობაში — ერთადერთი შუასაუკუნეების ტაძარი, რომელიც აჭარაში მთლიანად შემორჩა.
  body: >-
    **სხალთა აჭარაში ერთადერთი შუასაუკუნეების ეკლესიაა, რომელიც სრულად დგას.** ის XIII საუკუნის დასაწყისით
    თარიღდება, ხულოს მუნიციპალიტეტში, სხალთის ვიწრო ხეობაში, ბოლო რამდენიმე კილომეტრი კი ტყეში მიდის.
    ეს გეოგრაფია შემთხვევითი არაა: სწორედ სიშორემ იხსნა.

    XVI საუკუნიდან აჭარა ოსმალეთის შემადგენლობაში იყო და მოსახლეობა თანდათან ისლამზე გადავიდა. ეკლესიების
    უმეტესობა დაინგრა ან სამეურნეო ნაგებობად იქცა. სხალთამ გადაიტანა — ნაწილობრივ იმიტომ, რომ ხეობა
    ღრმაა და გზა არ იყო.

    ტაძარი დარბაზული ტიპისაა, თლილი ქვისგან. გარეთ ყურადღებას იპყრობს:

    - **დასავლეთ ფასადის რელიეფი** — მარტივი, ღრმად ჩაჭრილი ჯვარი, ტიპური ქართული გვიანი შუასაუკუნეების
    კვეთა

    - **ფანჯრების ჩარჩოები** ორნამენტული ლენტით, ნაწილობრივ დაზიანებული

    - სამრეკლო, რომელიც XIX საუკუნეშია მიშენებული

    შიგნით ფრესკების ფრაგმენტებია — ღვთისმშობელი და რამდენიმე წმინდანი, ფერი დაკარგული, კონტური კი ჩანს.
    ეს XIV-XV საუკუნეების ნამუშევრად ითვლება. ტაძარი 2000-იან წლებში აღდგა და დღეს მოქმედია; მას მცირე
    სამონასტრო თემი ემსახურება.

    სხალთა ბოლო წერტილი არაა, საიდანაც ხედი გადაშლილა. პირიქით: ის ხეობის ბოლოშია, თითქმის ჩაძირული.
    ღირს იმიტომ, რომ ეს ერთადერთი ადგილია, სადაც აჭარის ქრისტიანულ წარსულს პირდაპირ, ხელშესახებად ხედავ.
  tip: >-
    ერთი საათი. ეკლესია მოქმედია — ჩაცმის წესები მოქმედებს, ქალებისთვის თავსაფარი და გრძელი კაბა კართან
    დევს. მისასვლელი ბოლო ორი კილომეტრი ხრეშიანია და წვიმის შემდეგ თიხიანი. ტუალეტი და კაფე ადგილზე
    არაა, უახლოესი ხულოშია. ზამთარში ხეობა თოვლში იკეტება და გზა შეიძლება გაუვალი გახდეს — მაისიდან
    ოქტომბრამდე დაგეგმე.
  route: >-
    ბათუმიდან აჭარისწყლის ხეობით აღმოსავლეთით ქედასა და შუახევზე გავლით ხულომდე, შემდეგ სამხრეთით სხალთის
    ხეობაში — თბილისიდან ჯამში 470 კმ, დაახლოებით შვიდნახევარი საათი. მთავარი ხეობის გზა ასფალტია, თუმცა
    ვიწრო, სერპანტინიანი და ხშირად სველი; ბოლო მონაკვეთი ხრეშია. მაღალი კლირენსი სასურველია. საწვავი
    ქედასა და ხულოშია. ერთ დღეში თბილისიდან ჩამოსვლა და დაბრუნება რეალური არაა — ღამე ხულოში ან ქედაში
    გაათიე.
en:
  name: Skhalta Cathedral
  short: >-
    A 13th-century church in a mountain valley — the only medieval cathedral in Adjara to survive intact.
  body: >-
    **Skhalta is the only medieval church in Adjara still standing complete.** It dates from the early
    13th century and sits in Khulo municipality, in the narrow Skhalta valley, with the last few kilometres
    of the approach running through forest. That geography is not incidental: remoteness is what saved
    it.

    From the 16th century Adjara lay inside the Ottoman Empire and the population gradually converted to
    Islam. Most churches were dismantled, or turned into barns and stores. Skhalta came through — in part
    because the valley is deep and there was no road.

    The building is a hall church of dressed stone. Outside, the things worth looking at are:

    - The **relief on the west facade** — a plain, deeply cut cross, typical of late medieval Georgian
    carving

    - **Window surrounds** framed with an ornamental band, partly damaged

    - A bell tower added in the 19th century

    Inside there are fragments of fresco: the Virgin and several saints, the colour largely gone but the
    drawing still readable. They are generally dated to the 14th or 15th century. The church was restored
    in the 2000s and is active again, served by a small monastic community.

    Skhalta is not a viewpoint. It is the opposite — sunk at the bottom of a valley, hemmed in by wooded
    slopes. It is worth the drive because it is the one place where the Christian past of Adjara is directly,
    physically in front of you rather than a matter of record.
  tip: >-
    An hour. The church is in use, so dress rules apply; headscarves and wrap skirts for women are left
    by the door. The last two kilometres of the approach are gravel and turn to clay after rain. There
    are no toilets or cafe on site — the nearest are in Khulo. In winter the valley fills with snow and
    the road can become impassable, so plan this between May and October.
  route: >-
    From Batumi drive east up the Adjaristsqali valley through Keda and Shuakhevi to Khulo, then turn south
    into the Skhalta valley — 470 km from Tbilisi in total, about seven and a half hours. The main valley
    road is asphalt but narrow, endlessly winding and often wet; the final section is gravel. Good clearance
    is advisable. Fuel is available in Keda and Khulo. Driving from Tbilisi and back in one day is not
    realistic — stay overnight in Khulo or Keda.
ru:
  name: Храм Схалта
  short: >-
    Церковь XIII века в горном ущелье — единственный средневековый храм Аджарии, уцелевший целиком.
  body: >-
    **Схалта — единственная средневековая церковь Аджарии, сохранившаяся полностью.** Она датируется началом
    XIII века и стоит в Хулойском муниципалитете, в узком Схалтском ущелье, причём последние несколько
    километров подъезда идут через лес. Эта география не случайна: спасла её именно удалённость.

    С XVI века Аджария входила в Османскую империю, и население постепенно перешло в ислам. Большинство
    церквей разобрали или превратили в хозяйственные постройки. Схалта уцелела — отчасти потому, что ущелье
    глубокое и дороги не было.

    Здание — зальная церковь из тёсаного камня. Снаружи стоит рассмотреть:

    - **Рельеф западного фасада** — простой, глубоко врезанный крест, типичная грузинская резьба позднего
    Средневековья

    - **Обрамления окон** орнаментальной лентой, частично повреждённые

    - Колокольню, пристроенную в XIX веке

    Внутри есть фрагменты фресок: Богородица и несколько святых, цвет почти ушёл, но рисунок читается.
    Их обычно относят к XIV-XV векам. Храм отреставрировали в 2000-х, сегодня он действующий, при нём
    небольшая монашеская община.

    Схалта — не смотровая площадка. Наоборот: она утоплена на дне ущелья, зажата лесистыми склонами.
    Ехать сюда стоит потому, что это единственное место, где христианское прошлое Аджарии стоит перед
    вами физически, а не остаётся строкой в справочнике.
  tip: >-
    Час. Церковь действующая, правила одежды соблюдаются; платки и юбки для женщин лежат у входа. Последние
    два километра подъезда — гравий, после дождя глина. Ни туалета, ни кафе на месте нет, ближайшие в
    Хуло. Зимой ущелье заносит снегом и дорога может стать непроезжей, так что планируйте с мая по октябрь.
  route: >-
    Из Батуми на восток по ущелью Аджарисцкали через Кеду и Шуахеви до Хуло, затем на юг в Схалтское
    ущелье — от Тбилиси всего 470 км, около семи с половиной часов. Главная дорога по ущелью асфальтированная,
    но узкая, бесконечно извилистая и часто мокрая; последний участок гравийный. Высокий клиренс желателен.
    Заправки в Кеде и Хуло. Съездить из Тбилиси и обратно за день нереально — ночуйте в Хуло или Кеде.
fa:
  name: کلیسای جامع سخالتا
  short: >-
    کلیسایی از سدهٔ سیزدهم در دره‌ای کوهستانی — تنها کلیسای جامع سده‌های میانه که در آجارا سالم مانده
    است.
  body: >-
    **سخالتا تنها کلیسای سده‌های میانهٔ آجاراست که هنوز کامل برپاست.** به آغاز سدهٔ سیزدهم بازمی‌گردد
    و در شهرستان خولو، در درهٔ باریک سخالتا نشسته است، و چند کیلومتر آخر راه از میان جنگل می‌گذرد. این
    جغرافیا اتفاقی نیست: همین دورافتادگی نجاتش داد.

    از سدهٔ شانزدهم آجارا در قلمرو عثمانی بود و مردم رفته‌رفته به اسلام گرویدند. بیشتر کلیساها ویران شدند
    یا به انبار و طویله بدل گشتند. سخالتا از این دوره گذشت، تا حدی به این سبب که دره ژرف بود و راهی وجود
    نداشت.

    بنا کلیسایی تالاری از سنگ تراشیده است. در بیرون، آنچه ارزش دیدن دارد:

    - **نقش برجستهٔ نمای غربی** — صلیبی ساده و ژرف‌کنده، نمونه‌وار برای کنده‌کاری گرجی اواخر سده‌های
    میانه

    - **قاب پنجره‌ها** با نواری تزیینی، که بخشی از آن آسیب دیده است

    - ناقوس‌خانه‌ای که در سدهٔ نوزدهم افزوده شده

    درون بنا پاره‌هایی از فرسک هست: مریم و چند قدیس، رنگ تا حد زیادی رفته اما طرح هنوز خواناست. آن‌ها
    را معمولاً به سدهٔ چهاردهم یا پانزدهم می‌رسانند. کلیسا در دههٔ ۲۰۰۰ مرمت شد و اکنون فعال است و جماعتی
    کوچک از راهبان در آن خدمت می‌کنند.

    سخالتا چشم‌انداز نیست. برعکس، در ته دره فرو رفته و دامنه‌های جنگلی محاصره‌اش کرده‌اند. ارزش این راه
    را دارد چون تنها جایی است که گذشتهٔ مسیحی آجارا را مستقیم و ملموس پیش رو می‌بینید.
  tip: >-
    یک ساعت. کلیسا فعال است و قواعد پوشش برقرار؛ روسری و دامن بلند برای زنان کنار در گذاشته شده. دو کیلومتر
    آخر راه شنی است و پس از باران گِلی می‌شود. سرویس بهداشتی و کافه در محل نیست و نزدیک‌ترین‌ها در خولوست.
    زمستان دره پر از برف می‌شود و جاده ممکن است بسته شود، پس این سفر را میان اردیبهشت و مهر بگذارید.
  route: >-
    از باتومی به شرق در درهٔ آجاریسْتسقالی از کدا و شواخوی تا خولو، سپس به جنوب در درهٔ سخالتا — از تفلیس
    روی‌هم ۴۷۰ کیلومتر، حدود هفت ساعت و نیم. جادهٔ درهٔ اصلی آسفالت است اما باریک و بی‌وقفه پرپیچ و اغلب
    خیس؛ بخش پایانی شنی است. ارتفاع مناسب از زمین مطلوب است. سوخت در کدا و خولو. رفت‌وبرگشت یک‌روزه از
    تفلیس واقع‌بینانه نیست؛ شب را در خولو یا کدا بمانید.
he:
  name: קתדרלת סחאלטה
  short: >-
    כנסייה מן המאה ה-13 בעמק הררי — הקתדרלה היחידה מימי הביניים שנשתמרה שלמה באג׳ריה.
  body: >-
    **סחאלטה היא הכנסייה היחידה מימי הביניים באג׳ריה שעדיין עומדת בשלמותה.** היא מתוארכת לראשית המאה
    ה-13 ויושבת במחוז חולו, בעמק סחאלטה הצר, כשהקילומטרים האחרונים של הדרך עוברים ביער. הגיאוגרפיה הזאת
    אינה מקרית: הריחוק הוא שהציל אותה.

    מן המאה ה-16 הייתה אג׳ריה בתוך האימפריה העות׳מאנית והאוכלוסייה עברה בהדרגה לאסלאם. רוב הכנסיות פורקו
    או הוסבו למחסנים ולרפתות. סחאלטה שרדה — בין השאר משום שהעמק עמוק ולא הייתה דרך.

    המבנה הוא כנסיית אולם מאבן מסותתת. מבחוץ ראוי להתבונן ב:

    - **התבליט בחזית המערבית** — צלב פשוט וחרוט עמוק, אופייני לגילוף גאורגי מסוף ימי הביניים

    - **מסגרות החלונות** בסרט מעוטר, פגומות חלקית

    - מגדל פעמונים שנוסף במאה ה-19

    בפנים יש שברי ציורי קיר: הבתולה וכמה קדושים, הצבע ברובו נעלם אך הרישום עדיין קריא. הם מתוארכים בדרך
    כלל למאה ה-14 או ה-15. הכנסייה שוקמה בשנות האלפיים והיא פעילה שוב, ובה קהילת נזירים קטנה.

    סחאלטה אינה נקודת תצפית. להפך — היא שקועה בתחתית העמק, מוקפת מדרונות מיוערים. שווה לנסוע אליה משום
    שזה המקום היחיד שבו העבר הנוצרי של אג׳ריה עומד לפניך פיזית ולא רק בכתובים.
  tip: >-
    שעה. הכנסייה פעילה, ולכן חלים כללי לבוש; מטפחות וחצאיות לנשים מונחות ליד הדלת. שני הקילומטרים האחרונים
    בדרך הם חצץ ההופך לחימר אחרי גשם. אין שירותים ואין בית קפה במקום — הקרובים ביותר בחולו. בחורף העמק
    מתמלא שלג והכביש עלול להיחסם, אז תכננו בין מאי לאוקטובר.
  route: >-
    מבאטומי מזרחה בעמק אג׳ריסצקאלי דרך קדה ושואחווי עד חולו, ואז דרומה אל עמק סחאלטה — 470 ק״מ מטביליסי
    בסך הכול, כשבע וחצי שעות. כביש העמק הראשי סלול אך צר, מתפתל בלי הרף ולעתים קרובות רטוב; הקטע האחרון
    חצץ. מרווח גחון טוב רצוי. תדלוק בקדה ובחולו. נסיעה מטביליסי וחזרה ביום אחד אינה מציאותית — לינו בחולו
    או בקדה.
ar:
  name: كاتدرائية سخالتا
  short: >-
    كنيسة من القرن الثالث عشر في وادٍ جبلي — الكاتدرائية الوحيدة من العصور الوسطى التي بقيت سليمة في أجاريا.
  body: >-
    **سخالتا هي الكنيسة الوحيدة من العصور الوسطى في أجاريا التي ما زالت قائمة كاملة.** تعود إلى مطلع
    القرن الثالث عشر وتقع في بلدية خولو، في وادي سخالتا الضيق، وآخر بضعة كيلومترات من الطريق تمر في الغابة.
    وهذه الجغرافيا ليست عرضية: العزلة هي التي أنقذتها.

    منذ القرن السادس عشر كانت أجاريا داخل الدولة العثمانية واعتنق أهلها الإسلام تدريجاً. وفُككت معظم
    الكنائس أو حُوّلت إلى مخازن وحظائر. أما سخالتا فنجت، ويعود ذلك جزئياً إلى عمق الوادي وانعدام الطريق.

    البناء كنيسة قاعية من حجر منحوت. وفي الخارج يستحق النظر:

    - **النقش البارز في الواجهة الغربية** — صليب بسيط عميق الحفر، نموذجي للنحت الجورجي في أواخر العصور
    الوسطى

    - **أطر النوافذ** بشريط زخرفي، تضرر بعضها

    - برج أجراس أُضيف في القرن التاسع عشر

    في الداخل بقايا رسوم جدارية: العذراء وعدد من القديسين، ذهب اللون في معظمه لكن الرسم ما زال مقروءاً.
    وتُؤرخ عادة بالقرن الرابع عشر أو الخامس عشر. رُمّمت الكنيسة في العقد الأول من الألفية وهي عاملة اليوم،
    تخدمها جماعة رهبانية صغيرة.

    سخالتا ليست مطلاً. بل العكس: غائرة في قاع الوادي، تحيط بها منحدرات مشجرة. وتستحق الطريق لأنها المكان
    الوحيد الذي يقف فيه الماضي المسيحي لأجاريا أمامك مادياً لا في السجلات.
  tip: >-
    ساعة واحدة. الكنيسة عاملة وتُطبق قواعد اللباس؛ والأغطية والتنانير للنساء موضوعة عند الباب. آخر كيلومترين
    من الطريق حصى تتحول طيناً بعد المطر. لا دورات مياه ولا مقهى في الموقع، وأقربها في خولو. وفي الشتاء
    يمتلئ الوادي ثلجاً وقد يصير الطريق غير سالك، فخطط لهذه الزيارة بين مايو وأكتوبر.
  route: >-
    من باتومي شرقاً في وادي أجاريستسقالي عبر كيدا وشواخيفي حتى خولو، ثم جنوباً إلى وادي سخالتا — 470 كم
    من تبليسي إجمالاً، نحو سبع ساعات ونصف. طريق الوادي الرئيسي معبّد لكنه ضيق دائم الالتواء ورطب غالباً؛
    والمقطع الأخير حصوي. ويستحسن ارتفاع الهيكل. الوقود في كيدا وخولو. والذهاب من تبليسي والعودة في يوم
    واحد غير واقعي — بت ليلتك في خولو أو كيدا.
