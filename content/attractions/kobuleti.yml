ka:
  name: ქობულეთის პლაჟი და დაცული ტერიტორიები
  short: მშვიდი საკურორტო ქალაქი ბათუმის ჩრდილოეთით — გრძელი კენჭოვანი პლაჟი და იშვიათი ჭაობის ნაკრძალი.
  body: >-
    ქობულეთი აჭარის მეორე საკურორტო ქალაქია, ბათუმიდან ჩრდილოეთით დაახლოებით 25 კილომეტრში. ის ბათუმისგან
    თვისობრივად განსხვავდება: აქ არ არის მაღლივი შენობები, ღამის ცხოვრება და დატვირთული ცენტრი — სამაგიეროდ
    არის მრავალკილომეტრიანი პლაჟი, ფიჭვნარი და უფრო მშვიდი, საოჯახო რიტმი.


    პლაჟი წვრილკენჭოვანია და ბათუმისაზე უფრო გრძელი; სანაპირო ზოლის გასწვრივ გადის საკურორტო გამზირი კაფეებით,
    პანსიონატებითა და საოჯახო სასტუმროებით. სეზონი ივნისიდან სექტემბრის შუა რიცხვებამდე გრძელდება.


    ცალკე ღირსშესანიშნაობაა ქობულეთის დაცული ტერიტორიები — სფაგნუმის ტორფნარი ჭაობი, რომელიც ევროპაში
    იშვიათია და საერთაშორისო მნიშვნელობის წყალჭარბ ტერიტორიად არის აღიარებული. მასზე გაყვანილია ხის ბილიკი,
    რომელიც სპეციფიკური მცენარეულობის ნახვის საშუალებას იძლევა — ეს არის ის, რაც ქობულეთს პლაჟზე მეტს
    მატებს.


    მნიშვნელოვანი გაფრთხილება: **სანაპირო ნოტიოა.** ქობულეთშიც, ისევე როგორც მთელ აჭარაში, წვიმა ზაფხულში
    ჩვეულებრივი მოვლენაა და მზიანი კვირა გარანტირებული არაა — ეს რეალობა მარშრუტის დაგეგმვისას წინასწარ
    უნდა გაითვალისწინოთ. სამაგიეროდ, სწორედ ტენიანობის წყალობით არის სანაპირო ასე მწვანე, ხოლო ცუდი ამინდის
    დღეს ბათუმის მუზეუმები, ბოტანიკური ბაღი ან მთირალას ტყე ლოგიკური ალტერნატივაა.
  tip: >-
    ივნისი და სექტემბერი აქ საუკეთესო თვეებია: ზღვა თბილია, ხალხი კი ნაკლები, ვიდრე აგვისტოში. კენჭოვან
    პლაჟზე საბანაო ფლოსტები კომფორტს მკვეთრად ზრდის. მზისგან დაცვა საჭიროა მაშინაც, როცა მოღრუბლულია —
    ტენიან ჰაერში დამწვრობა ადვილად ხდება. მანქანა გამზირის პარალელურ ქუჩებზე ტოვებთ, ცენტრში ზაფხულში
    ადგილი ცოტაა. ბანკომატები, აფთიაქები და მაღაზიები ცენტრშია; ნაკრძალის ბილიკზე კი ნაღდი ფული და მწერსაწინააღმდეგო
    საშუალება წაიღეთ.
  route: >-
    თბილისიდან ქობულეთამდე დაახლოებით 345 კმ და ხუთი საათი და 10 წუთია. მთელი მარშრუტი E60-ზე გადის: გორი,
    ხაშური, რიკოთის ახალი მაგისტრალი, ქუთაისი, სამტრედია და შემდეგ სანაპიროსკენ. ქობულეთი პირდაპირ ბათუმის
    ტრასაზეა და მისასვლელი ბოლომდე ასფალტია — ეკონომ კლასის ავტომობილი სავსებით საკმარისია. საწვავი ყველგან
    ხელმისაწვდომია. ზაფხულის შაბათ-კვირას ტრასაზე დატვირთვა იზრდება, ამიტომ დილით ადრე გამგზავრება ჯობია.
en:
  name: Kobuleti Beach and Protected Areas
  short: A quieter resort town north of Batumi — a long pebble beach and a rare peat bog reserve.
  body: >-
    Kobuleti is Adjara's second resort town, roughly 25 kilometres north of Batumi. It differs from Batumi
    in kind rather than degree: there are no high-rises, no nightlife district and no busy centre. What
    there is instead is a beach several kilometres long, pine woods and a calmer, family-oriented rhythm.


    The beach is fine pebble and longer than Batumi's, and a resort avenue runs the length of the shore,
    lined with cafes, sanatoria and family guesthouses. The season runs from June to mid-September.


    A separate attraction is the Kobuleti Protected Areas — a sphagnum peat bog that is rare in Europe
    and recognised as a wetland of international importance. A wooden boardwalk crosses it, allowing you
    to see the specialised vegetation up close. This is what gives Kobuleti something beyond the beach,
    and it takes about an hour.


    One important caveat: **this coast is wet.** In Kobuleti, as everywhere in Adjara, summer rain is
    a normal occurrence rather than an anomaly, and a week of guaranteed sunshine is not something anyone
    can promise you here.
  tip: >-
    June and September are the best months: the sea is warm and there are fewer people than in August.
    On a pebble beach, swimming shoes make a large difference to comfort. Sun protection matters even
    on overcast days, since humid air makes burning easy to underestimate. Park on the streets parallel
    to the main avenue, as central spaces are scarce in summer. ATMs, pharmacies and shops are in the
    centre; for the bog boardwalk bring cash and insect repellent.
  route: >-
    Kobuleti is about 345 km and five hours ten from Tbilisi. The whole route runs on the E60: Gori, Khashuri,
    the new Rikoti section, Kutaisi, Samtredia and then down to the coast. Kobuleti sits directly on the
    Batumi highway and the access is paved throughout, so an economy car is entirely sufficient. Fuel
    is available everywhere along the way. On summer weekends traffic on the coastal stretch builds up
    considerably, so an early morning departure saves real time.
ru:
  name: Пляж Кобулети и охраняемые территории
  short: Более спокойный курортный город к северу от Батуми — длинный галечный пляж и редкий торфяной
    заповедник.
  body: >-
    Кобулети — второй курортный город Аджарии, примерно в 25 километрах к северу от Батуми. От Батуми
    он отличается качественно, а не количественно: здесь нет высоток, ночного квартала и загруженного
    центра. Есть многокилометровый пляж, сосновые посадки и более спокойный, семейный ритм.


    Пляж мелкогалечный и длиннее батумского, вдоль берега тянется курортный проспект с кафе, санаториями
    и семейными гостевыми домами. Сезон длится с июня до середины сентября.


    Отдельная достопримечательность — охраняемые территории Кобулети: сфагновое торфяное болото, редкое
    для Европы и признанное водно-болотным угодьем международного значения. Через него проложен деревянный
    настил, позволяющий вблизи рассмотреть специфическую растительность. Именно это добавляет Кобулети
    смысл помимо пляжа, а занимает около часа.


    Важная оговорка: **побережье здесь влажное.** В Кобулети, как и во всей Аджарии, летний дождь — обычное
    явление, а не аномалия, и неделю гарантированного солнца вам здесь никто не пообещает; это стоит закладывать
    в план поездки заранее. Зато именно влажности побережье обязано своей зеленью, а в дождливый день
    логичной заменой пляжу становятся музеи Батуми, ботанический сад или лес Мтиралы в получасе езды.
  tip: >-
    Июнь и сентябрь тут лучшие месяцы: море тёплое, людей меньше, чем в августе. На галечном пляже коралловые
    тапки заметно повышают комфорт. Защита от солнца важна и в пасмурный день: во влажном воздухе легко
    недооценить ожог. Машину оставляйте на улицах, параллельных главному проспекту, — в центре летом мест
    мало. Банкоматы, аптеки и магазины есть в центре; на настил по болоту берите наличные и репеллент.
  route: >-
    От Тбилиси до Кобулети около 345 км и пять часов десять минут. Весь маршрут идёт по трассе E60: Гори,
    Хашури, новый Рикотский участок, Кутаиси, Самтредиа и далее вниз к побережью. Кобулети стоит прямо
    на батумской трассе, подъезд асфальтирован до конца, машины эконом-класса вполне достаточно. Заправки
    доступны на всём пути. В летние выходные загрузка прибрежного участка заметно растёт, поэтому ранний
    выезд экономит реальное время.
fa:
  name: ساحل کوبولتی و مناطق حفاظت‌شده
  short: شهر ساحلی آرام‌تری شمال باتومی — ساحلی سنگریزه‌ای و بلند و ذخیره‌گاهی کمیاب از تالاب تورب.
  body: >-
    کوبولتی دومین شهر ساحلی آجارا است، تقریباً 25 کیلومتر شمال باتومی. تفاوتش با باتومی در جنس است نه
    در درجه: نه برج بلندی هست، نه محلهٔ زندگی شبانه، نه مرکزی شلوغ. در عوض ساحلی چندکیلومتری، جنگل کاج
    و ریتمی آرام‌تر و خانوادگی دارد.


    ساحل از سنگریزهٔ ریز است و از ساحل باتومی بلندتر، و خیابانی ساحلی در تمام طول کرانه کشیده شده که کافه‌ها،
    آسایشگاه‌ها و مهمان‌خانه‌های خانوادگی در دو سویش صف کشیده‌اند. فصل از ژوئن تا نیمهٔ سپتامبر ادامه
    دارد.


    جاذبهٔ جداگانه، مناطق حفاظت‌شدهٔ کوبولتی است — تالابی از تورب اسفاگنوم که در اروپا کمیاب است و به‌عنوان
    تالابی با اهمیت بین‌المللی شناخته می‌شود. گذرگاهی چوبی از میان آن می‌گذرد و امکان می‌دهد گیاهان ویژه‌اش
    را از نزدیک ببینید. همین است که به کوبولتی چیزی فراتر از ساحل می‌دهد و حدود یک ساعت وقت می‌گیرد.


    یک نکتهٔ مهم: **این ساحل مرطوب است.** در کوبولتی، مثل همه‌جای آجارا، باران تابستانی رویدادی عادی است
    نه استثنا، و هیچ‌کس نمی‌تواند اینجا یک هفته آفتاب تضمینی به شما قول بدهد.
  tip: >-
    ژوئن و سپتامبر بهترین ماه‌ها هستند: دریا گرم است و آدم‌ها از اوت کمترند. روی ساحل سنگریزه‌ای، کفش
    شنا تفاوت بزرگی در راحتی می‌سازد. محافظت از آفتاب حتی در روزهای ابری اهمیت دارد، چون هوای مرطوب باعث
    می‌شود خطر آفتاب‌سوختگی را دست‌کم بگیرید. در کوچه‌های موازی خیابان اصلی پارک کنید، چون جای پارک مرکز
    تابستان‌ها کم است. خودپرداز، داروخانه و مغازه در مرکز شهرند؛ برای گذرگاه تالاب پول نقد و دافع حشره
    بیاورید.
  route: >-
    کوبولتی حدود 345 کیلومتر و پنج ساعت و ده دقیقه از تفلیس فاصله دارد. تمام مسیر روی E60 است: گوری، خاشوری،
    بخش تازهٔ ریکوتی، کوتایسی، سامتردیا و بعد پایین به سوی ساحل. کوبولتی درست کنار بزرگراه باتومی است
    و دسترسی سرتاسر آسفالت، پس ماشین اقتصادی کاملاً کافی است. سوخت در سراسر راه پیدا می‌شود. آخر هفته‌های
    تابستان ترافیک بخش ساحلی به‌شدت سنگین می‌شود، پس حرکت در ساعات اول صبح واقعاً وقت صرفه‌جویی می‌کند.
he:
  name: חוף קובולטי והשטחים המוגנים
  short: עיירת נופש שקטה יותר מצפון לבטומי — חוף חלוקים ארוך ושמורת ביצת כבול נדירה.
  body: >-
    קובולטי היא עיירת הנופש השנייה בגודלה של אג'ריה, במרחק של כ-25 קילומטרים מצפון לבטומי. היא נבדלת מבטומי
    בסוג ולא במידה: אין בה מגדלי מגורים גבוהים, אין רובע של חיי לילה ואין מרכז עיר שוקק. מה שיש בה במקום
    זה חוף באורך כמה קילומטרים, חורשות אורנים וקצב רגוע ומשפחתי יותר.


    החוף עשוי חלוקים דקים והוא ארוך יותר מזה של בטומי, ולאורך כל קו המים נמתחת שדרת נופש ובה בתי קפה,
    בתי הבראה ואכסניות משפחתיות. עונת הרחצה נמשכת מיוני ועד אמצע ספטמבר.


    אטרקציה נפרדת היא השטחים המוגנים של קובולטי — ביצת כבול ספגנום שנדירה באירופה ומוכרת כאזור לח בעל
    חשיבות בין-לאומית. שביל עץ חוצה אותה ומאפשר לראות מקרוב את הצמחייה המיוחדת שגדלה בה. זה מה שנותן לקובולטי
    משהו מעבר לחוף עצמו, והביקור בו אורך כשעה.


    הסתייגות אחת חשובה: **החוף הזה רטוב.** בקובולטי, כמו בכל אג'ריה, גשם קיץ הוא תופעה רגילה ולא חריגה,
    ושבוע של שמש מובטחת אינו דבר שמישהו יכול להבטיח לכם כאן.
  tip: >-
    יוני וספטמבר הם החודשים הטובים ביותר: הים חם ויש פחות אנשים מאשר באוגוסט. על חוף חלוקים, נעלי ים משנות
    מאוד את הנוחות. הגנה מן השמש חשובה גם בימים מעוננים, מפני שהאוויר הלח גורם לזלזל בסכנת הכוויה. החנו
    ברחובות המקבילים לשדרה הראשית, שכן מקומות החניה במרכז מעטים בקיץ. כספומטים, בתי מרקחת וחנויות נמצאים
    במרכז; לשביל הביצה הביאו מזומן ודוחה יתושים.
  route: >-
    קובולטי נמצאת כ-345 ק״מ וחמש שעות ועשר דקות מטביליסי. כל המסלול עובר בכביש E60: גורי, חשורי, קטע ריקוטי
    החדש, קוטאיסי, סמטרדיה ואז ירידה אל החוף. קובולטי יושבת ממש על הכביש המהיר לבטומי והגישה אליה סלולה
    לכל אורכה, ולכן רכב אקונומי מספיק לחלוטין. דלק זמין בכל מקום לאורך הדרך. בסופי שבוע של קיץ התנועה
    בקטע החוף מתעצמת מאוד, ולכן יציאה מוקדמת בבוקר חוסכת זמן אמיתי.
ar:
  name: شاطئ كوبوليتي والمناطق المحمية
  short: بلدة مصيف أهدأ شمال باتومي — شاطئ حصى طويل ومحمية مستنقع خث نادرة.
  body: >-
    كوبوليتي هي ثاني بلدات المصيف في أدجارا، على بعد نحو 25 كيلومتراً شمال باتومي. وهي تختلف عن باتومي
    في النوع لا في الدرجة: فلا أبراج شاهقة ولا حي للحياة الليلية ولا مركز مزدحم. وما فيها بدلاً من ذلك
    شاطئ يمتد عدة كيلومترات وغابات صنوبر وإيقاع أهدأ يناسب العائلات.


    والشاطئ من الحصى الناعم وهو أطول من شاطئ باتومي، ويمتد على طوله شارع مصيف تصطف على جانبيه المقاهي
    والمصحات ونُزل العائلات. ويمتد الموسم من يونيو إلى منتصف سبتمبر.


    وثمة معلم منفصل هو المناطق المحمية في كوبوليتي — مستنقع خث من طحلب السفاغنوم نادر في أوروبا ومعترف
    به أرضاً رطبة ذات أهمية دولية. ويعبره ممشى خشبي يتيح لك رؤية نباتاته المتخصصة عن قرب. وهذا ما يمنح
    كوبوليتي شيئاً يتجاوز الشاطئ، ويستغرق نحو ساعة.


    وثمة تحفظ مهم واحد: **هذا الساحل رطب.** ففي كوبوليتي، كما في كل أدجارا، مطر الصيف حدث طبيعي لا شذوذ،
    وأسبوع من الشمس المضمونة ليس شيئاً يستطيع أحد أن يعدك به هنا.
  tip: >-
    يونيو وسبتمبر أفضل الشهور: البحر دافئ والناس أقل مما في أغسطس. وعلى شاطئ حصوي يصنع حذاء السباحة فارقاً
    كبيراً في الراحة. والحماية من الشمس مهمة حتى في الأيام الغائمة، إذ يجعل الهواء الرطب حروق الشمس أسهل
    مما تتوقع. اركن في الشوارع الموازية للشارع الرئيسي، فالأماكن المركزية شحيحة في الصيف. أجهزة الصراف
    الآلي والصيدليات والمتاجر في المركز؛ ولممشى المستنقع احمل نقداً وطارداً للحشرات.
  route: >-
    تبعد كوبوليتي نحو 345 كم وخمس ساعات وعشر دقائق عن تبليسي. ويجري المسار كله على الطريق E60: غوري، خاشوري،
    مقطع ريكوتي الجديد، كوتايسي، سامتريديا، ثم النزول إلى الساحل. وتقع كوبوليتي مباشرة على الطريق السريع
    نحو باتومي والوصول إليها معبّد طوال المسافة، فسيارة اقتصادية كافية تماماً. والوقود متوفر في كل مكان
    على الطريق. وفي عطلات نهاية الأسبوع الصيفية تتكدس الحركة على المقطع الساحلي كثيراً، فالانطلاق في الصباح
    الباكر يوفر وقتاً حقيقياً.
