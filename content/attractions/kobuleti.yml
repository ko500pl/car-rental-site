ka:
  name: ქობულეთის პლაჟი და დაცული ტერიტორიები
  short: >-
    გრძელი, აუჩქარებელი საკურორტო ქალაქი ბათუმის ჩრდილოეთით, ზურგს უკან წვიმით ნასაზრდოები ტორფნარით,
    სადაც დროზერა ხავსზე მწერებს იჭერს.
  body: >-
    **ქობულეთის პლაჟს ზურგს უკან წვიმით ნასაზრდოები ჭაობი უდევს — ცხრა მეტრამდე სისქის ტორფი, რომელზეც,
    მზის ქოლგებიდან სულ რამდენიმე კილომეტრში, მწერიჭამია მცენარე ხარობს.**


    ქალაქი ბათუმიდან ჩრდილოეთით, დაახლოებით ოცდაათ კილომეტრშია და სახელი, როგორც ფიქრობენ, ქობულიძეების
    საგვარეულოსგან მიიღო, რომელიც მას XIII საუკუნემდე ფლობდა. შემდგომი ისტორია ბნელია: გვიან შუა საუკუნეებში
    აქ გურიის სამთავროს ტყვეთა უდიდესი ბაზარი იმართებოდა და ტყვეთა შესასყიდად რიზედან, გონიოდან და ტრაპიზონიდან
    ვაჭრები ჩამოდიოდნენ. 1877–1878 წლების ომის შემდეგ ალექსანდრე II-მ ზღვისპირა ზოლი ომში გამორჩეულ გენერლებს
    უბოძა, მათ აქ აგარაკები ააშენეს და ქობულეთი კურორტად იქცა. მერე საბჭოთა სანატორიუმები მოვიდა, 1990-იან
    წლებში კი ბევრი მათგანი გაძარცვული და მიტოვებული იდგა.


    დღეს სანაპირო გრძელია, დაბალი და აუჩქარებელი: ქვიშანარევი წვრილი კენჭი, ზღვისპირა გამზირი კაფეებითა
    და საოჯახო სასტუმროებით, უკან ფიჭვნარი, ცის ხაზი კი ბათუმისაზე გაცილებით დაბალი.


    ცენტრიდან დაახლოებით ოთხი კილომეტრით ჩრდილოეთით ქობულეთის დაცული ტერიტორიებია, 1998 წელს შექმნილი
    და რამსარის კონვენციით აღიარებული. მდინარე შავი ღელის ორივე ნაპირზე ორი სფაგნუმიანი ტორფნარი, ისპანი
    1 და ისპანი 2, გადაჭიმულა. ტორფის ფენა ხუთიდან ცხრა მეტრამდეა და დაბალ გუმბათებად იბერება; ხავსზე
    მრგვალფოთოლა დროზერა მწერებს იჭერს, მანანა კი მხოლოდ ისპანის ტორფნარებზე იზრდება. ნაკრძალის სამხრეთით
    სადრენაჟე არხის გაჭრისას ორი მეტრი სისქის ტორფის ქვეშ ადრე ბრინჯაოს ხანის ნამოსახლარს წააწყდნენ; 1974–75
    წლების სადაზვერვო თხრილებმა ხის ნაგებობები, თიხის ჭურჭელი და ტიგელები გამოაჩინა. დღეს ეს კოლხეთში
    უძველეს სამიწათმოქმედო ძეგლად ითვლება.


    ქობულეთში წელიწადში დაახლოებით 2 500 მილიმეტრი ნალექი მოდის და ივლისის წვიმიანი დღე აქ ანომალია არ
    არის. მაგრამ სწორედ ეს წვიმა ინახავს ჭაობს ცოცხლად: როცა პლაჟის დღე ჩაგეშლებათ, ქურთუკი ჩაიცვით და
    ერთი საათი ტორფნარს დაუთმეთ.
  tip: >-
    ივნისი და სექტემბერი საუკეთესო დროა: ზღვა თბილია, ხალხი კი აგვისტოზე ნაკლები. კენჭზე წყლის ფეხსაცმელი
    გამოგადგებათ, მზისგან დამცავი კრემი კი მოღრუბლულ ამინდშიც აუცილებელია. მანქანა ზღვისპირა გამზირის
    პარალელურ ქუჩებზე გააჩერეთ — ზაფხულში ცენტრში ადგილს ვერ იპოვით. ტორფნარი ცალკე გაჩერებაა, ცენტრიდან
    დაახლოებით 4 კილომეტრით ჩრდილოეთით, და პლაჟიდან ფეხით ვერ გაისეირნებთ — მანქანით წადით. მონიშნულ ბილიკებს
    ნუ გადაუხვევთ: სფაგნუმი ნაზია და იმაზე სველი, ვიდრე ჩანს. მწერების საწინააღმდეგო საშუალებაც წაიღეთ.
    ამბობენ, რომ ხავსზე სასიარულოდ სპეციალურ „თხილამურებსაც“ აქირავებენ: მათზე და ბილიკზე დაცული ტერიტორიების
    ვიზიტორთა ცენტრში, ლესელიძის ქუჩაზე, იკითხეთ.
  route: >-
    თბილისიდან ქობულეთამდე დაახლოებით 345 კილომეტრი და ხუთი საათი და ათი წუთია. ს1 (E60) მაგისტრალით გორისა
    და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით და ქუთაისის გვერდის ავლით სამტრედიამდე იარეთ; იქ
    ს12-ზე (E692) გადადით, ლანჩხუთის გავლით გრიგოლეთამდე ჩადით და ზღვისპირა ს2-ით (E70) სამხრეთისკენ ქობულეთში
    შედით. გზა ბოლომდე ასფალტია, დიდწილად ოთხზოლიანი, ეკონომკლასის ავტომობილი სავსებით საკმარისია. საწვავი
    ყველგან იშოვება. დაცული ტერიტორიები ქალაქის ჩრდილოეთ კიდეზეა, ასე რომ, მათ პირველად ჩაუვლით — კარგი
    მიზეზია, გზაშივე გაჩერდეთ. ზაფხულის შაბათ-კვირას ზღვისპირა მონაკვეთი იჭედება, ამიტომ თბილისიდან ადრე
    გამოდით.
en:
  name: Kobuleti Beach and Protected Areas
  short: >-
    A long, unhurried beach town north of Batumi, with a rain-fed Ramsar peat bog behind it where sundew
    traps insects on the moss.
  body: >-
    **Behind Kobuleti's beach lies a bog fed by rain — peat up to nine metres deep, where an insect-eating
    plant grows a few kilometres from the sunbeds.**


    The town stands some thirty kilometres north of Batumi and probably takes its name from the Kobulidze
    family, who held it until the 13th century. Its later past is darker: in the late Middle Ages it was
    the largest captive market of the Principality of Guria, where merchants from Rize, Gonio and Trabzon
    came to buy people. After the war of 1877–78 Alexander II granted the seafront to distinguished generals,
    who lined it with dachas, and Kobuleti became a resort; Soviet sanatoria followed, and many lay plundered
    through the 1990s.


    The shore is long, low and unhurried: fine pebble and sand, a seafront avenue of cafés and family
    guesthouses, pine woods behind, and a skyline that stays well below Batumi's.


    About four kilometres north of the centre lie the Kobuleti Protected Areas, created in 1998 and recognised
    under the Ramsar Convention. Two sphagnum bogs, Ispani 1 and Ispani 2, spread on either bank of the
    Shavi Ghele. The peat is five to nine metres thick and swells into low domes; round-leaved sundew
    catches insects on the moss, and heather grows here on the Ispani bogs alone. A drainage ditch dug
    south of the reserve struck an Early Bronze Age settlement under two metres of peat; trenches in 1974–75
    found timber houses, pottery and crucibles, and it now counts as the oldest farming site in Colchis.


    Kobuleti gets around 2,500 millimetres of rain a year, and a wet day in July is no anomaly. But it
    is the same rain that keeps the bog alive: when the beach is washed out, put on a jacket and give
    the peat an hour.
  tip: >-
    June and September are the sweet spots: the sea is warm and the crowds thinner than in August. Water
    shoes help on the pebbles, and sun cream matters even under cloud. Park on the streets parallel to
    the seafront avenue; central spaces vanish in summer. The bog is a separate stop about 4 km north
    of the centre, not a stroll from the beach, so drive there. Stay on the marked trails — the sphagnum
    is fragile and wetter than it looks — and bring insect repellent. Visitors can reportedly hire bog
    'skis' to walk out onto the moss: ask about them, and about the trail, at the protected-areas visitor
    centre on Leselidze Street.
  route: >-
    Kobuleti is about 345 km and 5 hours 10 minutes from Tbilisi. Take the S1 (E60) through Gori and Khashuri,
    over the Rikoti Pass and past Kutaisi to Samtredia; switch to the S12 (E692) through Lanchkhuti to
    Grigoleti, then turn south on the coastal S2 (E70) into Kobuleti. It is asphalt all the way, much
    of it four-lane, and an economy car is entirely sufficient. Fuel is never far away. The protected
    areas lie on the northern edge of town, so you pass them first: a good reason to stop on the way in.
    On summer weekends the coastal stretch clogs up, so leave Tbilisi early.
ru:
  name: Пляж Кобулети и охраняемые территории
  short: >-
    Неспешный курортный городок к северу от Батуми с длинным пляжем, за которым лежит дождевое рамсарское
    торфяное болото, где росянка ловит насекомых на мху.
  body: >-
    **За пляжем Кобулети лежит болото, питаемое только дождём, — торф глубиной до девяти метров, где насекомоядное
    растение растёт в нескольких километрах от шезлонгов.**


    Город стоит примерно в тридцати километрах севернее Батуми и, вероятно, получил имя от рода Кобулидзе,
    владевшего им до XIII века. Его более позднее прошлое темнее: в позднем средневековье здесь находился
    крупнейший рынок невольников Гурийского княжества, куда за людьми приезжали купцы из Ризе, Гонио и
    Трабзона. После войны 1877–1878 годов Александр II подарил побережье отличившимся генералам, которые
    застроили его дачами, и Кобулети стал курортом; следом пришли советские санатории, многие из которых
    в 1990-е годы были разграблены.


    Берег здесь длинный, низкий и неспешный: мелкая галька и песок, набережная с кафе и семейными гостевыми
    домами, за ней сосновый лес, а силуэт города остаётся заметно ниже батумского.


    Примерно в четырёх километрах севернее центра лежат Кобулетские охраняемые территории, созданные в
    1998 году и признанные по Рамсарской конвенции. Два сфагновых болота, Испани-1 и Испани-2, раскинулись
    по обоим берегам речки Шави Геле. Торф толщиной пять–девять метров вспучивается низкими куполами;
    круглолистная росянка ловит насекомых на мху, а вереск растёт только здесь, на болотах Испани. Дренажная
    канава, прокопанная южнее заповедника, наткнулась на поселение раннего бронзового века под двухметровым
    слоем торфа; раскопки 1974–1975 годов обнаружили деревянные дома, керамику и тигли, и сегодня это
    считается древнейшим земледельческим поселением Колхиды.


    В Кобулети выпадает около 2500 миллиметров осадков в год, и дождливый июльский день здесь — не аномалия.
    Но именно этот дождь и держит болото живым: когда дождь отменяет пляж, наденьте куртку и подарите
    торфянику час своего времени.
  tip: >-
    Июнь и сентябрь — лучшее время: море тёплое, а толп меньше, чем в августе. Обувь для воды пригодится
    на гальке, а крем от солнца важен даже в облачную погоду. Парковаться лучше на улицах, параллельных
    набережной; в центре летом мест не остаётся. Болото — отдельная остановка, примерно в 4 км севернее
    центра, а не прогулка от пляжа, так что туда стоит проехать. Держитесь маркированных троп — сфагнум
    хрупкий и мокрее, чем кажется, — и возьмите средство от насекомых. Говорят, посетителям можно взять
    напрокат болотные «лыжи», чтобы выйти на мох: о них и о тропе спросите в визит-центре охраняемых территорий
    на улице Леселидзе.
  route: >-
    Кобулети — около 345 км и 5 часов 10 минут от Тбилиси. По трассе S1 (E60) через Гори и Хашури, через
    Рикотский перевал и Кутаиси до Самтредиа; переходите на S12 (E692) через Ланчхути до Григолети, затем
    поворачивайте на юг по прибрежной S2 (E70) в Кобулети. Дорога асфальтирована на всём протяжении, по
    большей части четырёхполосная, и автомобиля экономкласса вполне достаточно. Заправки всегда рядом.
    Охраняемые территории лежат на северной окраине города, так что вы проедете их первыми — хороший повод
    остановиться на въезде. По летним выходным прибрежный участок дороги забивается, так что выезжайте
    из Тбилиси пораньше.
fa:
  name: ساحل کوبولتی و مناطق حفاظت‌شده
  short: >-
    شهری ساحلی و آرام در شمال باتومی، با تالاب توربی باران‌زاد (ثبت‌شده در رامسر) در پشتش، جایی که گیاه
    حشره‌خوار دروسرا روی خزه شکار می‌کند.
  body: >-
    **پشت ساحل کوبولتی تالابی است که تنها با باران تغذیه می‌شود — تورب تا نه متر عمق، جایی که گیاهی حشره‌خوار
    تنها چند کیلومتر دورتر از صندلی‌های ساحلی می‌روید.**


    این شهر حدود سی کیلومتر شمال باتومی قرار دارد و احتمالاً نامش را از خانوادهٔ کوبولیدزه گرفته که تا
    سدهٔ سیزدهم بر آن فرمان می‌راندند. گذشتهٔ متأخرترش تاریک‌تر است: در اواخر قرون‌وسطا، اینجا بزرگ‌ترین
    بازار بردگان امیرنشین گوریا بود، جایی که بازرگانانی از ریزه، گونیو و طرابزون برای خریدن انسان می‌آمدند.
    پس از جنگ ۱۸۷۷–۱۸۷۸، الکساندر دوم کنار ساحل را به ژنرال‌های برجسته بخشید، که آن را با ویلاهایشان پوشاندند،
    و کوبولتی به استراحتگاه بدل شد؛ سپس آسایشگاه‌های شوروی از راه رسیدند و بسیاری از آن‌ها در دههٔ ۱۹۹۰
    به تاراج رفتند.


    ساحل اینجا طولانی، کم‌ارتفاع و بی‌شتاب است: سنگ‌ریزه و شن ریز، خیابانی ساحلی از کافه‌ها و اقامتگاه‌های
    خانوادگی، جنگل کاج پشت آن، و خط آسمانی که همیشه بسیار پایین‌تر از باتومی می‌ماند.


    حدود چهار کیلومتر شمال مرکز، منطقه‌های حفاظت‌شدهٔ کوبولتی قرار دارند که در سال ۱۹۹۸ ایجاد شدند و در
    پیمان رامسر به ثبت رسیده‌اند. دو تالاب اسفاگنومی، ایسپانی-۱ و ایسپانی-۲، بر دو کناره رودخانهٔ شاوی
    گله پهن شده‌اند. تورب پنج تا نه متر عمق دارد و به‌شکل گنبدهایی کم‌ارتفاع بالا می‌آید؛ دروسرای گردبرگ
    حشرات را روی خزه به دام می‌اندازد، و خلنگ تنها در همین تالاب‌های ایسپانی می‌روید. خندقی زهکشی که در
    جنوب منطقهٔ حفاظت‌شده کنده شده بود به سکونتگاهی از عصر مفرغ آغازین برخورد، زیر دو متر تورب؛ کاوش‌های
    ۱۹۷۴–۱۹۷۵ خانه‌های چوبی، سفال و بوته‌های ذوب یافتند، و اکنون این‌جا کهن‌ترین سکونتگاه کشاورزی کولخیس
    شمرده می‌شود.


    کوبولتی سالانه نزدیک به ۲۵۰۰ میلی‌متر باران می‌گیرد، و روزی بارانی در ژوئیه اینجا چیز غریبی نیست.
    اما همین باران است که تالاب را زنده نگه می‌دارد: وقتی باران روز ساحل را خراب می‌کند، کاپشنی بپوشید
    و ساعتی به تورب هدیه دهید.
  tip: >-
    ژوئن و سپتامبر بهترین زمان‌ها هستند: دریا گرم است و ازدحام کمتر از اوت. کفش مخصوص آب روی سنگ‌ریزه‌ها
    به کار می‌آید، و کرم ضدآفتاب حتی زیر ابر هم اهمیت دارد. در خیابان‌های موازی با خیابان ساحلی پارک کنید؛
    در تابستان در مرکز جای پارک پیدا نمی‌شود. تالاب توقفی جداست، حدود ۴ کیلومتر شمال مرکز، و پیاده از
    ساحل به آن نمی‌رسید؛ پس با ماشین بروید. در مسیرهای علامت‌گذاری‌شده بمانید — اسفاگنوم شکننده و مرطوب‌تر
    از ظاهرش است — و دافع حشرات همراه بیاورید. گویا بازدیدکنندگان می‌توانند «اسکی» تالابی کرایه کنند تا
    روی خزه راه بروند؛ دربارهٔ آن و دربارهٔ مسیر، از مرکز بازدیدکنندگان مناطق حفاظت‌شده در خیابان لسلیدزه
    بپرسید.
  route: >-
    کوبولتی حدود ۳۴۵ کیلومتر و ۵ ساعت و ۱۰ دقیقه از تفلیس فاصله دارد. مسیر S1 (E60) را از میان گوری و
    خاشوری، از گذرگاه ریکوتی و کنار کوتایسی تا سامتردیا بروید؛ سپس با S12 (E692) از میان لانچخوتی تا گریگولتی
    بروید، و آن‌گاه رو به جنوب در S2 (E70) ساحلی به کوبولتی بپیچید. تمام راه آسفالت و بخش بزرگی از آن
    چهارخطه است، و خودروی اقتصادی کاملاً کافی است. سوخت هرگز دور نیست. منطقه‌های حفاظت‌شده در حاشیهٔ شمالی
    شهرند، پس نخست از کنار آن‌ها می‌گذرید — بهانهٔ خوبی برای توقف در راه ورود. در آخر هفته‌های تابستان
    بخش ساحلی راه شلوغ می‌شود، پس زود از تفلیس حرکت کنید.
he:
  name: חוף קובולטי ושטחים מוגנים
  short: עיירת חוף שלווה ומתונה מצפון לבטומי, עם ביצת כבול רמסארית המוזנת בגשם מאחוריה, שבה טללית תופסת
    חרקים על הטחב.
  body: >-
    **מאחורי חוף קובולטי שוכנת ביצה המוזנת בגשם — כבול בעומק של עד תשעה מטרים, שבו צומח צמח אוכל-חרקים
    במרחק של קילומטרים ספורים מכיסאות החוף.**


    העיר שוכנת כשלושים קילומטרים מצפון לבטומי, וסביר שקיבלה את שמה ממשפחת קובולידזה, שהחזיקה בה עד המאה
    ה-13. עברה המאוחר יותר אפלולי יותר: בשלהי ימי הביניים היה זה שוק השבויים הגדול ביותר של נסיכות גוריה,
    שאליו הגיעו סוחרים מריזה, מגוניו ומטרבזון לקנות אנשים. אחרי מלחמת 1877–1878 העניק אלכסנדר השני את
    חוף הים לגנרלים מצטיינים, שהקימו עליו וילות קיץ, וקובולטי הפכה לאתר נופש; אחריהם הגיעו בתי הבראה סובייטיים,
    ורבים מהם נשדדו במהלך שנות ה-90.


    החוף כאן ארוך, נמוך ומתון: חלוקים דקים וחול, שדרת חוף של בתי קפה ואכסניות משפחתיות, יער אורנים מאחור,
    וקו רקיע שנשאר הרבה מתחת לזה של בטומי.


    כארבעה קילומטרים מצפון למרכז שוכנים השטחים המוגנים של קובולטי, שנוסדו ב-1998 והוכרו לפי אמנת רמסאר.
    שתי ביצות ספגנום, איספני 1 ואיספני 2, משתרעות משני עברי נהר שאווי גלה. הכבול בעומק של חמישה עד תשעה
    מטרים ומתנפח לכיפות נמוכות; טללית עגולת-עלים תופסת חרקים על הטחב, ואברש צומח רק כאן, בביצות איספני.
    תעלת ניקוז שנחפרה מדרום לשמורה נתקלה בישוב מתקופת הברונזה הקדומה, מתחת לשני מטרים של כבול; חפירות
    ב-1974–1975 מצאו בתי עץ, כלי חרס וכורי התכה, וכיום זה נחשב לאתר החקלאי העתיק ביותר בקולכיס.


    בקובולטי יורדים כ-2,500 מ"מ גשם בשנה, ויום גשום ביולי אינו חריג כאן. אבל אותו הגשם הוא זה שמקיים את
    הביצה: כשהגשם מקלקל את יום החוף, לבשו מעיל והקדישו לכבול שעה אחת.
  tip: >-
    יוני וספטמבר הם הזמנים הטובים ביותר: הים חם וההמונים דלילים יותר מבאוגוסט. נעלי מים עוזרות על החלוקים,
    וקרם הגנה חשוב אפילו מתחת לעננים. חנו ברחובות המקבילים לשדרת החוף; בקיץ אין מקום חניה במרכז. הביצה
    היא תחנה נפרדת, כ-4 ק"מ מצפון למרכז, ולא מגיעים אליה ברגל מהחוף, אז נסעו לשם. הישארו על השבילים המסומנים
    — הספגנום שביר ורטוב יותר משנראה — והביאו דוחה חרקים. לפי הדיווחים, מבקרים יכולים לשכור 'סקי' ביצה
    כדי לצעוד על הטחב: שאלו עליהם, ועל השביל, במרכז המבקרים של השטחים המוגנים ברחוב לסלידזה.
  route: >-
    קובולטי במרחק כ-345 ק"מ ו-5 שעות ו-10 דקות מטביליסי. סעו בכביש S1 (E60) דרך גורי וחשורי, דרך מעבר
    ריקוטי ולצד קוטאיסי עד סמטרדיה; עברו ל-S12 (E692) דרך לנצ'חוטי עד גריגולטי, ואז פנו דרומה ב-S2 (E70)
    החופי לקובולטי. הכביש אספלט לכל אורכו, חלק גדול ממנו בעל ארבעה נתיבים, ורכב אקונומי מספיק בהחלט. תחנות
    דלק יש לאורך כל הדרך. השטחים המוגנים שוכנים בקצה הצפוני של העיר, כך שתעברו לצידם ראשונים — סיבה טובה
    לעצור בדרך לעיר. בסופי שבוע בקיץ הקטע החופי נסתם, אז צאו מטביליסי מוקדם.
ar:
  name: شاطئ كوبوليتي والمحميات الطبيعية
  short: >-
    بلدة شاطئية هادئة شمال باتومي، يكمن خلفها مستنقع خث يتغذّى بماء المطر ومدرج في اتفاقية رامسار، حيث
    يصطاد نبات الدروسيرا الحشرات على الطحلب.
  body: >-
    **خلف شاطئ كوبوليتي يكمن مستنقع يتغذى بماء المطر — خث يبلغ عمقه حتى تسعة أمتار، حيث تنمو نبتة تصطاد
    الحشرات على مسافة كيلومترات قليلة من كراسي الشاطئ.**


    تقع البلدة على مسافة نحو ثلاثين كيلومترًا شمال باتومي، ويُرجَّح أنها اكتسبت اسمها من أسرة كوبوليدزه
    التي امتلكتها حتى القرن الثالث عشر. أما ماضيها الأحدث فأكثر قسوة: في أواخر العصور الوسطى كانت أكبر
    سوق للرقيق في إمارة غوريا، يأتي إليها تجار من ريزة وغونيو وطرابزون لشراء البشر. وبعد حرب 1877–1878،
    منح ألكسندر الثاني الواجهة البحرية لجنرالات بارزين، فأقاموا عليها بيوتهم الصيفية، وتحولت كوبوليتي
    إلى منتجع؛ ثم تبعتها مصحّات سوفيتية، وتعرّض كثير منها للنهب في التسعينيات.


    الساحل هنا طويل ومنخفض وهادئ: حصى ناعم ورمل، وطريق ساحلي حافل بالمقاهي والنُّزل العائلية، وغابة صنوبر
    خلفه، وأفق عمراني يبقى دون أفق باتومي بكثير.


    على مسافة نحو أربعة كيلومترات شمال المركز تقع محميات كوبوليتي الطبيعية، التي أُنشئت عام 1998 وحصلت
    على اعتراف اتفاقية رامسار. ينتشر مستنقعان من السفانغوم، إيسباني 1 وإيسباني 2، على ضفتي نهر شافي غيله.
    يبلغ عمق الخث بين خمسة وتسعة أمتار وينتفخ في قباب منخفضة؛ ويصطاد نبات الدروسيرا مستدير الأوراق الحشرات
    على الطحلب، ولا ينمو الخلنج إلا في مستنقعات إيسباني هذه. وعثر عمّال على مستوطنة من العصر البرونزي
    المبكر تحت مترين من الخث أثناء حفر قناة صرف جنوب المحمية؛ وعثرت الحفريات في 1974–1975 على بيوت خشبية
    وفخار وبوتقات صهر، وتُعدّ اليوم أقدم موقع زراعي في كولخيس.


    تتلقى كوبوليتي نحو 2500 ملم من الأمطار سنويًا، ويوم ممطر في يوليو ليس أمرًا شاذًا هنا. لكن ذلك المطر
    نفسه هو ما يحفظ المستنقع على قيد الحياة: فحين يُفسد المطر يوم الشاطئ، ارتدِ سترة وأهدِ الخث ساعة من
    وقتك.
  tip: >-
    يونيو وسبتمبر هما الوقتان الأمثلان: البحر دافئ والحشود أقل من أغسطس. الحذاء المائي مفيد على الحصى،
    وكريم الحماية من الشمس مهم حتى تحت الغيوم. اركن سيارتك في الشوارع الموازية للطريق الساحلي؛ ففي الصيف
    لا تجد مكانًا في المركز. المستنقع محطة منفصلة على مسافة نحو 4 كم شمال المركز، ولا يُبلغ سيرًا من الشاطئ،
    فاذهب إليه بالسيارة. التزم بالمسارات المُعلَّمة — فالسفانغوم هش وأكثر رطوبة مما يبدو — واحمل طارد
    حشرات. يُقال إن بإمكان الزوار استئجار «مزلاجات» المستنقع للسير على الطحلب؛ اسأل عنها وعن المسار في
    مركز زوار المناطق المحمية في شارع ليسيليدزه.
  route: >-
    تبعد كوبوليتي نحو 345 كم و5 ساعات و10 دقائق عن تبليسي. خذ الطريق S1 (E60) عبر غوري وخاشوري، فوق ممر
    ريكوتي وقرب كوتايسي إلى سامتريديا؛ انتقل إلى S12 (E692) عبر لانتشخوتي إلى غريغوليتي، ثم انحرف جنوبًا
    على الطريق الساحلي S2 (E70) إلى كوبوليتي. الطريق مُعبّد بالكامل، وجزء كبير منه بأربعة مسارات، وسيارة
    اقتصادية كافية تمامًا. محطات الوقود منتشرة على طول الطريق. تقع المحميات الطبيعية على الحافة الشمالية
    للبلدة، فتمر بها أولًا — وهذا سبب وجيه للتوقف قبل دخول البلدة. في عطلات نهاية الأسبوع الصيفية يزدحم
    الامتداد الساحلي، فانطلق من تبليسي باكرًا.
