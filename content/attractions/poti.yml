ka:
  name: ფოთი
  short: >-
    საქართველოს მთავარი საზღვაო პორტი რიონის შესართავთან, უჩვეულო წრიული გეგმითა და აია სოფიას მიხედვით
    აშენებული ტაძრით.
  body: >-
    **ფოთი სამუშაო ქალაქია და არა კურორტი** — ამის გაგება ვიზიტამდე ღირს. აქ ამწეები, კონტეინერები, სარკინიგზო
    ჩიხები და ნაცრისფერქვიშიანი, ქარიანი სანაპიროა. სამაგიეროდ, ქალაქს ისეთი ისტორია და ისეთი გეგმა აქვს,
    რომელსაც საქართველოში ვერსად ნახავ.


    ძველი ბერძნული ფასისი სადღაც აქვე იდგა — მილეთელთა კოლონია, დაარსებული ჩვენს წელთაღრიცხვამდე VI საუკუნეში,
    საიდანაც არგონავტების ამბავი იწყება. ქალაქი დიდი ხანია გამქრალია: ალბათ ზღვამ და ლაგუნამ ჩაყლაპა და
    მისი ზუსტი ადგილი დღემდე კამათის საგანია. დღევანდელი ფოთი გაცილებით ახალგაზრდაა — რუსეთის იმპერიამ
    1858 წელს დააარსა პორტად ჭაობის კიდეზე.


    ქალაქმა სახე ნიკო ნიკოლაძესთან ერთად შეიცვალა, რომელიც მერად 1894 წლიდან თითქმის ოცი წელი მუშაობდა.
    მან ჭაობი დააშრო, პორტი გააფართოვა, ელექტროგანათება და ტრამვაი შემოიღო და ქალაქი წრიული მოედნის გარშემო
    დაგეგმა, საიდანაც ქუჩები რადიუსებივით გამოდის. ეს გეგმა დღესაც იკითხება რუკაზე და ქუჩაში სიარულისასაც.


    მოედნის შუაგულში დგას ღვთისმშობლის შობის ტაძარი, აშენებული 1906-1907 წლებში ნიკოლაძის დაკვეთით. მისი
    ნიმუში კონსტანტინოპოლის აია სოფიაა: დაბალი, ფართო გუმბათი ნახევარგუმბათებზე დაყრდნობილი. ტაძარი რკინაბეტონითაა
    ნაგები — იმ დროისთვის იშვიათი და თამამი გადაწყვეტა. საბჭოთა პერიოდში აქ თეატრი იყო; ეკლესიას მხოლოდ
    2005 წელს დაუბრუნდა.


    მეორე ნამდვილი ღირსშესანიშნაობა შესართავთან დგას: 1862 წელს ინგლისში ჩამოსხმული თუჯის შუქურა, ნაწილ-ნაწილ
    ჩამოტანილი და ადგილზე აწყობილი. ის დღემდე მუშაობს.


    პორტი ასწლენახევარია ამ ადგილის აზრია. დღეს ის საქართველოს ყველაზე დატვირთული ნავსადგურია და თავისუფალი
    ინდუსტრიული ზონაც აქვე მოქმედებს. ამავე დროს ის სამიზნეც იყო: 2008 წლის აგვისტოში რუსული ჯარი ქალაქში
    შემოვიდა და ნავმისადგომზე მდგარი ქართული სამხედრო ხომალდები ჩაძირა. ნამსხვრევები გაიწმინდა, მაგრამ
    ის კვირეები ფოთში დღემდე ცოცხლად ახსოვთ.


    მთელი ქალაქი ზღვის დონეზე დგას და სადრენაჟო არხებით არის დაქსელილი; წყალს დღემდე ტუმბოებით აცლიან.
    როცა შტორმი და რიონზე წყალმოვარდნა ერთდროულად ხვდება, ქუჩები იტბორება. ევკალიპტის ხეივნები, რომლებიც
    ჯერ კიდევ საბჭოთა დროს დარგეს, სწორედ ამ ბრძოლის კვალია.


    ერთი-ორი საათი ყველაფერს ფარავს: მოედანი, ტაძარი, შუქურა, პორტის ხედი და ბაზარი, სადაც ზღვის ნადავლი
    იყიდება. ზამთარში ქარი და ნესტი გამძვინვარებულია; ზაფხულში ჰაერი მძიმეა. სამაგიეროდ, საღამოს რიონის
    შესართავზე ჩამავალი მზე ქალაქს იმაზე უკეთეს სახეს აძლევს, ვიდრე დღისით აქვს.
  tip: >-
    ორი საათი საკმარისია, თუ პალიასტომზეც არ მიდიხარ. ტაძარი ღიაა და შესვლა უფასოა, თუმცა ჩაცმის წესი
    მოქმედებს და შიგნით ფოტოს გადაღება ყოველთვის არ შეიძლება — ჯობია ჰკითხო. მოედანზე პარკირება უფასოა
    და თავისუფალი. პორტის ტერიტორია დახურულია, ღობესთან ფოტოს გადაღება არ ღირს. ჭამა ცენტრში ან ბაზართან
    სჯობს, სადაც ახალი თევზი და ხაჭაპურია. სანაპირო ქარიანი და ნაცრისფერია — საბანაოდ ურეკი ან ანაკლია
    აჯობებს. სასტუმროები ცენტრში მეტია, ვიდრე ზღვის პირას, და ზამთარშიც მუშაობს.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ გორზე, ქუთაისსა და სამტრედიაზე გავლით, სენაკამდე, სადაც ფოთის შესახვევს
    აიღებ — დაახლოებით 320 კმ და ოთხი საათი ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია, დიდი ნაწილი ავტობანია
    და მდგომარეობა კარგია. ქალაქში შესვლისას მიჰყევი წრიული მოედნის მიმართულებას — ყველა მთავარი ქუჩა
    იქიდან გამოდის. საწვავი სამტრედიასა და სენაკში აიღე, თუმცა ფოთშიც არის რამდენიმე სადგური. შუქურამდე
    მისასვლელი ბოლო ქუჩა ვიწროა და ორმოებიანი, მაგრამ დაბალი მანქანაც გაივლის. მთელი მარშრუტისთვის ეკონომ-კლასის
    ავტომობილი სავსებით საკმარისია.
en:
  name: Poti
  short: >-
    Georgia’s main sea port at the mouth of the Rioni, with an unusual circular street plan and a cathedral
    modelled on Hagia Sophia.
  body: >-
    **Poti is a working town, not a resort,** and it is worth knowing that before you go. There are cranes,
    container stacks, railway sidings and a grey, windy shore. What it also has is a history and a street
    plan you will find nowhere else in Georgia.


    The Greek city of Phasis stood somewhere very close by: a Milesian colony of the sixth century BC,
    the port from which the Argonaut story begins. The city is long gone, probably swallowed by sea and
    lagoon, and its exact site is still argued over. Modern Poti is far younger. The Russian empire founded
    it as a port on the edge of the marsh in 1858.


    The town took its present shape under Niko Nikoladze, mayor for almost twenty years from 1894. He
    drained the swamp, enlarged the harbour, brought in electric light and a tramway, and laid the streets
    around a circular central square from which the avenues radiate like spokes. The plan is still legible
    on the ground.


    In the middle of that square stands the Cathedral of the Nativity of the Virgin, built in 1906–07
    at Nikoladze's instigation. Its model is Hagia Sophia in Constantinople: a low, wide dome carried
    on half-domes. It was built in reinforced concrete, a bold choice for the time. Under Soviet rule
    it was a theatre, returned to the church only in 2005.


    The second real sight is at the river mouth: a cast-iron lighthouse made in England in 1862, shipped
    out in sections and bolted together here, and still in service.


    The port has been the point of the place for a century and a half. It handles more cargo than any
    other Georgian harbour and has a free industrial zone attached to it. It has also been a target: in
    August 2008 Russian forces entered the town and sank several Georgian naval vessels at their moorings.
    The wrecks were cleared, but those weeks are remembered here.


    The whole town sits at sea level, threaded with drainage canals that still have to be pumped; when
    a sea storm meets high water on the Rioni, the streets flood.


    An hour or two covers everything — the square, the cathedral, the lighthouse, a view of the port and
    a market selling whatever the boats brought in. Winter here is wet and fiercely windy, summer heavy
    and humid. But the sun going down over the Rioni mouth gives the town a better face in the evening
    than it has at midday.
  tip: >-
    Two hours is enough unless you are also going out onto Paliastomi. The cathedral is open and free,
    but dress rules apply and photography inside is not always allowed, so ask first. Parking on the square
    is free and easy. The port itself is closed to visitors and photographing the fence is not a good
    idea. Eat in the centre or by the market, where the fish is fresh and the bakeries are decent. The
    town beach is grey and wind-blown; for swimming, Ureki or Anaklia are better.
  route: >-
    From Tbilisi take the E60 west through Gori, Kutaisi and Samtredia to Senaki, then the signposted
    turn for Poti — about 320 km and four hours forty-five. The road is asphalt throughout, much of it
    dual carriageway and in good condition. Coming into town, aim for the circular square: every main
    street leads off it, so it is the easiest thing to navigate by. Refuel in Samtredia or Senaki, though
    there are stations in Poti as well. An economy car is entirely sufficient for the whole route, in
    any season.
ru:
  name: Поти
  short: Главный морской порт Грузии в устье Риони, с необычной круговой планировкой и собором по образцу
    Святой Софии.
  body: >-
    **Поти — рабочий город, а не курорт,** и об этом стоит знать заранее. Здесь краны, штабеля контейнеров,
    железнодорожные тупики и серый ветреный берег. Зато у города есть история и планировка, каких в Грузии
    больше нигде не найти.


    Греческий Фасис стоял где-то совсем рядом: милетская колония VI века до нашей эры, порт, с которого
    начинается история аргонавтов. Сам город давно исчез — вероятно, его поглотили море и лагуна, — и
    о точном месте до сих пор спорят. Нынешний Поти намного моложе: Российская империя основала его как
    порт на краю болота в 1858 году.


    Нынешний облик город получил при Нико Николадзе, который был мэром почти двадцать лет начиная с 1894
    года. Он осушил топь, расширил гавань, провёл электрическое освещение и пустил трамвай, а улицы разбил
    вокруг круглой центральной площади, от которой проспекты расходятся, как спицы. Эта схема читается
    и на карте, и на местности.


    В середине площади стоит собор Рождества Богородицы, построенный в 1906–1907 годах по замыслу Николадзе.
    Образцом послужила константинопольская София: низкий широкий купол на полукуполах. Здание возведено
    из железобетона — смелое и редкое для того времени решение. При советской власти здесь был театр,
    церкви собор вернули только в 2005 году.


    Вторая настоящая достопримечательность — в устье реки: чугунный маяк, отлитый в Англии в 1862 году,
    привезённый по частям и собранный на месте. Он работает до сих пор.


    Полтора века смысл этого места — порт. Сегодня он принимает больше грузов, чем любая другая гавань
    Грузии, и рядом действует свободная индустриальная зона. Он же бывал и мишенью: в августе 2008 года
    российские войска вошли в город и потопили у причалов несколько грузинских военных судов. Обломки
    убрали, но те недели здесь помнят.


    Весь город стоит на уровне моря и пронизан дренажными каналами, воду из которых до сих пор откачивают
    насосами. Когда шторм совпадает с высокой водой на Риони, улицы затапливает. Эвкалиптовые аллеи, высаженные
    ещё в советское время, — часть того же долгого спора с водой.


    Часа-двух хватит на всё: площадь, собор, маяк, вид на порт и рынок, где продают сегодняшний улов.
    Зима здесь сырая и очень ветреная, лето душное и тяжёлое. Но закат над устьем Риони показывает город
    с куда более выигрышной стороны, чем полдень.
  tip: >-
    Двух часов достаточно, если вы не собираетесь ещё и на Палиастоми. Собор открыт, вход свободный, но
    действуют правила одежды, а снимать внутри разрешают не всегда — лучше спросить. Парковка на площади
    бесплатная и свободная. Территория порта закрыта, фотографировать у ограды не стоит. Есть лучше в
    центре или у рынка, где свежая рыба и приличные пекарни. Городской пляж серый и продуваемый: для купания
    лучше Уреки или Анаклия.
  route: >-
    Из Тбилиси на запад по E60 через Гори, Кутаиси и Самтредиа до Сенаки, затем по указателю поворот на
    Поти — около 320 км и четыре часа сорок пять минут. Дорога асфальтированная на всём протяжении, значительная
    часть — скоростная, состояние хорошее. Въезжая в город, ориентируйтесь на круглую площадь: от неё
    расходятся все главные улицы, и это самый простой ориентир. Заправиться удобно в Самтредиа или Сенаки,
    хотя станции есть и в самом Поти. Машины эконом-класса хватает на весь маршрут в любой сезон.
fa:
  name: پوتی
  short: بندر اصلی دریایی گرجستان در مصب رود ریونی، با طرح شهری دایره‌ای غیرعادی و کلیسایی به الگوی ایاصوفیه.
  body: >-
    **پوتی شهری کارگری و بندری است، نه تفرجگاه،** و بهتر است این را پیش از رفتن بدانید. اینجا جرثقیل و
    انبوه کانتینر و خط‌های فرعی راه‌آهن است و ساحلی خاکستری و بادخیز. در عوض تاریخی دارد و نقشهٔ خیابانی‌اش
    در هیچ جای دیگر گرجستان یافت نمی‌شود.


    شهر یونانی فاسیس جایی همین نزدیکی بود: مستعمره‌ای از مردم میلتوس در سدهٔ ششم پیش از میلاد، بندری که
    داستان آرگونات‌ها از آن آغاز می‌شود. آن شهر دیرزمانی است ناپدید شده، احتمالاً دریا و مرداب بلعیده‌اندش،
    و هنوز بر سر جای دقیقش بحث است. پوتیِ امروز بسیار جوان‌تر است: امپراتوری روسیه آن را در ۱۸۵۸ به عنوان
    بندری در لبهٔ مرداب بنیاد نهاد.


    شهر چهرهٔ کنونی‌اش را در دورهٔ نیکو نیکولادزه گرفت که از ۱۸۹۴ نزدیک بیست سال شهردار بود. او باتلاق
    را زهکشی کرد، بندر را گسترش داد، روشنایی برق و تراموا آورد و خیابان‌ها را گرد یک میدان دایره‌ای مرکزی
    چید که راه‌ها از آن مانند پره بیرون می‌زنند. این طرح هنوز هم روی نقشه و در خیابان خوانده می‌شود.


    در میان همان میدان کلیسای زایش مریم ایستاده است که در ۱۹۰۶ و ۱۹۰۷ به ابتکار نیکولادزه ساخته شد. الگویش
    ایاصوفیهٔ قسطنطنیه است: گنبدی کوتاه و پهن بر نیم‌گنبدها. بنا از بتن مسلح ساخته شده که برای آن روزگار
    انتخابی جسورانه و کمیاب بود. در دورهٔ شوروی تالار تئاتر بود و تنها در ۲۰۰۵ به کلیسا بازگردانده شد.


    دیدنی واقعی دوم در مصب رود است: فانوس دریایی چدنی ساخت انگلستان در ۱۸۶۲ که قطعه‌قطعه آورده و همین‌جا
    سوار شده است. هنوز کار می‌کند.


    یک قرن و نیم است که معنای این شهر بندر آن است. امروز بیش از هر لنگرگاه دیگر گرجستان بار جابه‌جا می‌کند
    و منطقهٔ آزاد صنعتی هم به آن چسبیده است. در عین حال هدف هم بوده است: در اوت ۲۰۰۸ نیروهای روس وارد
    شهر شدند و چند شناور نظامی گرجی را در پهلوگاه غرق کردند. لاشه‌ها را برداشتند، اما آن هفته‌ها هنوز
    در یاد مردم است.


    تمام شهر در تراز دریاست و شبکه‌ای از کانال‌های زهکشی آن را می‌شکافد که آبشان هنوز پمپاژ می‌شود. وقتی
    توفان دریا با بالا آمدن آب ریونی هم‌زمان شود، خیابان‌ها زیر آب می‌روند. خیابان‌های اکالیپتوس که در
    دورهٔ شوروی کاشته شدند بخشی از همین کشمکش دیرپا با آب‌اند.


    یکی دو ساعت همه چیز را پوشش می‌دهد: میدان، کلیسا، فانوس، منظرهٔ بندر و بازاری که صید امروز را می‌فروشد.
    زمستان اینجا نمناک و سخت بادخیز است و تابستان سنگین و شرجی. اما غروب آفتاب بر مصب ریونی چهره‌ای بهتر
    از ظهر به شهر می‌دهد.
  tip: >-
    دو ساعت کافی است، مگر آنکه به پالیاستومی هم بروید. کلیسا باز است و ورود رایگان، اما قواعد پوشش برقرار
    است و عکاسی در داخل همیشه مجاز نیست، پس نخست بپرسید. پارک کردن در میدان رایگان و آسان است. محوطهٔ
    بندر بسته است و عکس گرفتن از حصار کار درستی نیست. غذا را در مرکز یا کنار بازار بخورید که ماهی تازه
    و نانوایی‌های خوب دارد. ساحل شهر خاکستری و بادخیز است؛ برای شنا اورکی یا آناکلیا بهتر است.
  route: >-
    از تفلیس با بزرگراه E60 به غرب، از گوری و کوتایسی و سامترِدیا تا سناکی و سپس انشعاب تابلودار پوتی
    — حدود ۳۲۰ کیلومتر و چهار ساعت و چهل و پنج دقیقه. جاده تا انتها آسفالت است، بخش بزرگی از آن دوبانده
    و در وضعیت خوب. هنگام ورود به شهر میدان دایره‌ای را هدف بگیرید؛ همهٔ خیابان‌های اصلی از آن جدا می‌شوند
    و آسان‌ترین نشانه است. سوخت را در سامترِدیا یا سناکی بگیرید، هرچند در خود پوتی هم پمپ بنزین هست. خودروی
    اقتصادی برای کل مسیر و در هر فصل کافی است.
he:
  name: פוטי
  short: נמל הים המרכזי של גאורגיה בשפך הריוני, עם תוכנית רחובות מעגלית יוצאת דופן וקתדרלה בדגם איה סופיה.
  body: >-
    **פוטי היא עיר עובדת ולא עיר נופש,** וכדאי לדעת זאת מראש. יש בה מנופים, ערימות מכולות, מסילות צדדיות
    וחוף אפור וסחוף רוח. מה שיש בה גם הוא היסטוריה ותוכנית רחובות שלא תמצאו כמותן בשום מקום אחר בגאורגיה.


    העיר היוונית פאסיס עמדה איפשהו ממש בקרבת מקום: מושבה של אנשי מילטוס מן המאה השישית לפני הספירה, הנמל
    שממנו מתחיל סיפור הארגונאוטים. העיר עצמה נעלמה מזמן, ככל הנראה נבלעה בים ובלגונה, ועל מיקומה המדויק
    עדיין מתווכחים. פוטי של היום צעירה בהרבה: האימפריה הרוסית ייסדה אותה כנמל בשולי הביצה ב-1858.


    את פניה הנוכחיות קיבלה העיר בימי ניקו ניקולאדזה, שכיהן כראש עיר כמעט עשרים שנה החל מ-1894. הוא ייבש
    את הביצה, הרחיב את הנמל, הביא תאורת חשמל וחשמלית, ותכנן את הרחובות סביב כיכר מרכזית עגולה שממנה יוצאות
    השדרות כחישורים. התוכנית הזאת עדיין ניתנת לקריאה במפה וגם ברחוב.


    במרכז אותה כיכר עומדת קתדרלת הולדת הבתולה, שנבנתה ב-1906–1907 ביוזמת ניקולאדזה. הדגם שלה הוא איה סופיה
    שבקונסטנטינופול: כיפה נמוכה ורחבה הנישאת על חצאי כיפות. היא נבנתה מבטון מזוין, בחירה נועזת ונדירה
    לתקופתה. בימי השלטון הסובייטי שימשה תיאטרון, ורק ב-2005 הוחזרה לכנסייה.


    האתר האמיתי השני נמצא בשפך הנהר: מגדלור יצוק ברזל שנעשה באנגליה ב-1862, הובא בחלקים והורכב כאן. הוא
    פועל עד היום.


    מזה מאה וחמישים שנה הנמל הוא כל עניינה של העיר. הוא מטפל במטענים רבים יותר מכל נמל גאורגי אחר, ולצדו
    פועל אזור תעשייה חופשי. הוא גם היה מטרה: באוגוסט 2008 נכנסו כוחות רוסיים לעיר והטביעו כמה כלי שיט
    צבאיים גאורגיים ליד הרציפים. השברים פונו, אך את אותם שבועות זוכרים כאן היטב.


    כל העיר יושבת בגובה פני הים ומפולשת בתעלות ניקוז שאת מימיהן עדיין שואבים במשאבות. כשסערה בים נפגשת
    עם מים גבוהים בריוני, הרחובות מוצפים. שדרות האקליפטוס שניטעו בתקופה הסובייטית הן חלק מאותו ויכוח ארוך
    עם המים.


    שעה או שעתיים מכסות הכול — הכיכר, הקתדרלה, המגדלור, מבט אל הנמל ושוק שמוכר את מה שהסירות הביאו. החורף
    כאן לח וסוער מאוד, הקיץ כבד ולוהט בלחות. אבל השקיעה מעל שפך הריוני מעניקה לעיר פנים טובות בהרבה מאלה
    שיש לה בצהריים.
  tip: >-
    שעתיים מספיקות, אלא אם אתם יוצאים גם אל פליאסטומי. הקתדרלה פתוחה והכניסה חינם, אך חלים כללי לבוש והצילום
    בפנים אינו תמיד מותר, לכן שאלו קודם. החניה בכיכר חינם ופנויה. שטח הנמל סגור למבקרים, ולא כדאי לצלם
    ליד הגדר. אכלו במרכז או ליד השוק, שם הדגים טריים והמאפיות סבירות. חוף העיר אפור וסחוף רוח; לרחצה עדיפות
    אורקי או אנאקליה. בתי המלון מרוכזים במרכז ולא על הים, והם פתוחים גם בחורף.
  route: >-
    מטביליסי מערבה בכביש E60 דרך גורי, קוטאיסי וסמטרדיה עד סנאקי, ומשם בפנייה המשולטת לפוטי — כ-320 ק״מ
    וארבע שעות וארבעים וחמש. הכביש סלול לכל אורכו, חלק ניכר ממנו דו-מסלולי ובמצב טוב. בכניסה לעיר כוונו
    אל הכיכר העגולה: כל הרחובות הראשיים יוצאים ממנה, וזה סימן הדרך הנוח ביותר. תדלקו בסמטרדיה או בסנאקי,
    אף שיש תחנות גם בפוטי עצמה. רכב חסכוני מספיק לחלוטין לכל המסלול ובכל עונה.
ar:
  name: بوتي
  short: ميناء جورجيا البحري الرئيسي عند مصب نهر ريوني، بمخطط شوارع دائري غير مألوف وكاتدرائية على نمط
    آيا صوفيا.
  body: >-
    **بوتي مدينة عمل لا مصيف،** ومن الأفضل معرفة ذلك قبل الذهاب. فيها رافعات وأكوام حاويات وخطوط سكك جانبية
    وشاطئ رمادي تعصف به الريح. لكن لها في المقابل تاريخاً ومخططاً للشوارع لا تجد مثله في أي مكان آخر في
    جورجيا.


    كانت مدينة فاسيس اليونانية قائمة في مكان قريب جداً: مستعمرة ميليتية من القرن السادس قبل الميلاد، والميناء
    الذي تبدأ منه حكاية الأرغونوت. أما المدينة نفسها فاختفت منذ زمن طويل، ابتلعها البحر والبحيرة الشاطئية
    على الأرجح، وما زال موقعها الدقيق موضع جدل. وبوتي اليوم أحدث بكثير: أسستها الإمبراطورية الروسية ميناءً
    على حافة المستنقع عام 1858.


    اتخذت المدينة شكلها الحالي في عهد نيكو نيكولادزه الذي تولى رئاسة البلدية نحو عشرين عاماً ابتداءً من
    1894. جفف المستنقع ووسّع المرفأ وأدخل الإنارة الكهربائية والترام، ورسم الشوارع حول ميدان مركزي دائري
    تتفرع منه الجادات كأسلاك العجلة. وما زال هذا المخطط مقروءاً على الخريطة وفي الشارع معاً.


    في وسط ذلك الميدان تقوم كاتدرائية ميلاد العذراء، التي بُنيت بين 1906 و1907 بمبادرة من نيكولادزه. نموذجها
    آيا صوفيا في القسطنطينية: قبة واطئة عريضة محمولة على أنصاف قباب. وقد بُنيت بالخرسانة المسلحة، وهو
    خيار جريء ونادر في ذلك الزمن. وفي العهد السوفييتي استُعملت مسرحاً، ولم تُعَد إلى الكنيسة إلا عام 2005.


    المعلم الحقيقي الثاني عند مصب النهر: منارة من الحديد الزهر صُنعت في إنجلترا عام 1862، شُحنت مقطّعة
    ورُكّبت هنا. وما زالت عاملة إلى اليوم.


    منذ قرن ونصف والميناء هو معنى هذا المكان. وهو اليوم يناول من البضائع أكثر من أي مرفأ جورجي آخر، وإلى
    جانبه منطقة صناعية حرة. وكان أيضاً هدفاً: ففي آب 2008 دخلت القوات الروسية المدينة وأغرقت عدداً من
    السفن الحربية الجورجية عند أرصفتها. رُفعت الحطام لاحقاً، لكن تلك الأسابيع ما زالت حاضرة في الذاكرة
    هنا.


    المدينة كلها قائمة على مستوى سطح البحر، تخترقها قنوات صرف ما زال ماؤها يُضخ بالمضخات. وحين تتزامن
    عاصفة البحر مع ارتفاع منسوب ريوني تغرق الشوارع. وجادات الكافور التي غُرست في العهد السوفييتي جزء من
    هذا الجدال الطويل مع الماء.


    ساعة أو ساعتان تغطيان كل شيء: الميدان والكاتدرائية والمنارة وإطلالة على الميناء وسوق يبيع ما جاءت
    به القوارب. الشتاء هنا رطب وشديد الريح، والصيف ثقيل خانق. غير أن غروب الشمس فوق مصب ريوني يمنح المدينة
    وجهاً أفضل بكثير مما لها عند الظهيرة.
  tip: >-
    ساعتان تكفيان ما لم تخرج أيضاً إلى بالياستومي. الكاتدرائية مفتوحة والدخول مجاني، لكن قواعد اللباس
    مطبقة والتصوير في الداخل غير مسموح دائماً، فاسأل أولاً. الوقوف في الميدان مجاني ومتاح. أما ساحة الميناء
    فمغلقة أمام الزوار، ولا يُستحسن التصوير قرب سياجها. تناول الطعام في الوسط أو قرب السوق حيث السمك طازج
    والمخابز جيدة. شاطئ المدينة رمادي تعصف به الريح؛ وللسباحة أوريكي أو أناكليا أفضل.
  route: >-
    من تبليسي غرباً على الطريق E60 عبر غوري وكوتايسي وسامتريديا حتى سيناكي، ثم المنعطف المُعلَّم نحو بوتي
    — نحو 320 كم وأربع ساعات وخمس وأربعين دقيقة. الطريق معبّد بكامله، وجزء كبير منه مزدوج وبحالة جيدة.
    عند دخول المدينة اقصد الميدان الدائري: كل الشوارع الرئيسية تتفرع منه، وهو أسهل معلم للاهتداء. تزوّد
    بالوقود في سامتريديا أو سيناكي، وإن كانت في بوتي نفسها محطات. والسيارة الاقتصادية كافية تماماً للطريق
    كله في أي فصل.
