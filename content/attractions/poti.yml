ka:
  name: ფოთი
  short: >-
    საქართველოს მუშა ნავსადგური რიონის შესართავთან: მრგვალი მოედნის ირგვლივ გაშლილი ქალაქი, აია სოფიას
    ბეტონის ანარეკლი და ინგლისური თუჯის შუქურა.
  body: >-
    **ფოთს დიზელის, ზღვის მარილისა და მდინარის ლამის სუნი ასდის — და კურორტობას არასოდეს იჩემებდა.** საკონტეინერო
    ნავმისადგომზე ამწეები ტრიალებენ, ჩიხებში სატვირთო მატარებლები ელოდებიან, რიონი კი თავის მღვრიე წყალს
    ზღვაში ნაცრისფერი, ქარნაცემი სანაპიროს გვერდით უშვებს.


    სახელი ყველაფერზე ძველია, რასაც აქ ნახავთ. სადღაც პალიასტომის ტბის ქვეშ ან რიონის მოხეტიალე შესართავში
    ფასისი ძევს — ქალაქი, რომელიც ჩვენს წელთაღრიცხვამდე VII-VI საუკუნეების მიჯნაზე მილეთელმა ბერძნებმა
    თემისტაგორას წინამძღოლობით დააარსეს. თქმულებით, სწორედ აქედან აუყვნენ არგონავტები მდინარეს ოქროს საწმისის
    საძებნელად. მოგვიანებით ოსმალებმა აქ ციხე-სიმაგრე აიგეს; 1828 წელს ფოთი რუსეთმა აიღო, 1858 წელს კი
    საპორტო ქალაქის სტატუსი მიანიჭა.


    ის ფოთი, რომელშიც დღეს დადიხართ, ერთი კაცის ნაფიქრია. ნიკო ნიკოლაძემ, ქალაქის თავმა 1894-1912 წლებში,
    ჭაობი დააშრო, ელექტროსადგური, გიმნაზიები და თეატრი ააშენა, ქალაქი კი მრგვალი მოედნის ირგვლივ დაგეგმა,
    საიდანაც ქუჩები სხივებივით იშლება. შუაგულში ღვთისმშობლის შობის ტაძარი დადგა (1906-1907) — აია სოფიას
    ნეობიზანტიური ანარეკლი, არქიტექტორები ალექსანდრე ზელენკო და რობერტ მარფელდი. ჭაობიანი ნიადაგი ქვის
    ნაგებობას ვერ გაუძლებდა, ამიტომ ტაძარი, გუმბათების ჩათვლით, მთლიანად რკინაბეტონისგან ააგეს ფრანგული
    ჰენებიკის სისტემით — ეს მსოფლიოში ერთ-ერთი პირველი რკინაბეტონის ეკლესიაა. 1923 წელს საბჭოთა ხელისუფლებამ
    ტაძარი თეატრად აქცია, ზარები კი ინდუსტრიალიზაციის ფონდს გადასცა; ეკლესიას ის მხოლოდ 2005 წელს დაუბრუნდა.


    შესართავთან თუჯის შუქურა დგას — XIX საუკუნის 60-იან წლებში ინგლისიდან ნაწილ-ნაწილ ჩამოტანილი და აქვე,
    ქვიშაზე აწყობილი. ნავსადგურს უფრო ახალი ჭრილობაც ატყვია: 2008 წლის აგვისტოში რუსულმა ჯარმა აქ, ნავმისადგომებზე,
    ქართული სამხედრო ხომალდები ჩაძირა.


    მოდით საღამოს, როცა მზე შუქურის მიღმა ზღვაში ჩადის და მოედნიდან გამავალ ქუჩებს შინ მიმავალი ხალხი
    ავსებს. ფოთი მაშინ ლამაზდება, როცა მუშაობას ამთავრებს.
  tip: >-
    ორი საათი მოედანს, ტაძარსა და შუქურას ეყოფა; თუ კოლხეთის ეროვნულ პარკში, პალიასტომის ტბაზე ნავით გასეირნებაც
    გინდათ, დილა დაუმატეთ. ტაძარში შესვლა უფასოა — მხრები დაფარული, ქალებს თავსაფარი; შიგნით ფოტოს გადაღებაზე
    ჯერ მღვდელს ჰკითხეთ. მრგვალი მოედნის გარშემო მანქანის დაყენება ადვილია. პორტი და სამხედრო-საზღვაო
    ბაზა დახურულია — ჭიშკრებსა და დაცვას ნუ გადაუღებთ. ახალი შავი ზღვის თევზი ბაზართან მიირთვით. საბანაოდ
    სამხრეთით, ურეკისკენ წადით: ქალაქის პლაჟი ნაცრისფერი და ქარიანია. ზამთარი აქ ნესტიანი და ქარიშხლიანია,
    ზაფხული — მძიმე და ნოტიო.
  route: >-
    თბილისიდან დაახლოებით 320 კმ და 4 საათი და 45 წუთია. E60 მაგისტრალით დასავლეთისკენ წახვალთ: გორის
    გვერდით, რიკოთის უღელტეხილის გავლით, ქუთაისის შემოვლით და სამტრედიის გავლით სენაკამდე, იქ კი ფოთის
    მიმართულების ნიშანს გაჰყვებით. გზა ბოლომდე ასფალტია, დიდწილად ოთხზოლიანი ავტობანი; რიკოთის გარდა სერიოზულ
    აღმართს არსად შეხვდებით. საწვავი სამტრედიაში ან სენაკში ჩაასხით, თუმცა ფოთშიც ბევრი სადგურია. ქალაქში
    მრგვალ მოედანს დაუმიზნეთ — ყველა მთავარი ქუჩა იქ იყრის თავს, ტაძრის გუმბათი კი შუქურასავით გიჩვენებთ
    გზას. ეკონომ-კლასის ავტომობილი ნებისმიერ სეზონზე სავსებით საკმარისია.
en:
  name: Poti
  short: >-
    Georgia's working port at the mouth of the Rioni: a radial town built around a concrete echo of Hagia
    Sophia, with an English cast-iron lighthouse.
  body: >-
    **Poti smells of diesel, salt and river mud, and it has never pretended to be a resort.** Cranes swing
    over the container quay and the Rioni pushes its brown water into the Black Sea past a grey, wind-scoured
    beach.


    Somewhere under Lake Paliastomi or the wandering river mouth lies Phasis, founded at the turn of the
    7th and 6th centuries BC by Greeks from Miletus under Themistagoras — the harbour where, in the story,
    the Argonauts turned upriver in search of the Golden Fleece. Later the Ottomans fortified the site;
    Russia took it in 1828 and made it a port town in 1858.


    The Poti you walk through was imagined by one man. Niko Nikoladze, mayor from 1894 to 1912, drained
    marsh, built a power station, schools and a theatre, and laid the town around a round central square
    with streets running out like rays. At the hub he placed the Cathedral of the Nativity of the Virgin
    (1906–07), a Neo-Byzantine echo of Hagia Sophia by Alexander Zelenko and Robert Marfeld. The swampy
    ground would not carry masonry, so the whole church, domes included, was built in reinforced concrete
    on the French Hennebique system — one of the earliest churches made that way anywhere. In 1923 the
    Soviets turned it into a theatre and gave its bells to the industrialisation fund; it returned to
    the Church only in 2005.


    At the river mouth stands a cast-iron lighthouse shipped in sections from England in the 1860s and
    bolted together on the sand. The harbour has a newer scar: in August 2008 Russian troops sank Georgian
    naval vessels at their moorings here.


    Come at dusk, when the sun drops behind the lighthouse and the streets off the square fill with people
    walking home. Poti looks its best when it stops working.
  tip: >-
    Two hours cover the square, the cathedral and the lighthouse; add a morning if you want a boat trip
    on Lake Paliastomi in Kolkheti National Park. The cathedral is free — shoulders covered, headscarf
    for women — and ask a priest before photographing inside. Parking around the circular square is easy.
    The port and naval base are closed: do not photograph gates or guards. Eat fresh Black Sea fish near
    the market. For swimming head south to Ureki; the town beach is grey and windswept. Winters are wet
    and gusty, summers heavy and humid.
  route: >-
    About 320 km and 4 hours 45 minutes from Tbilisi. Take the E60 motorway west past Gori, through the
    Rikoti Pass, round Kutaisi and through Samtredia to Senaki, then follow the signs for Poti. It is
    asphalt all the way, much of it dual carriageway, with no serious climb beyond Rikoti. Refuel in Samtredia
    or Senaki, though Poti has plenty of stations. In town, steer for the round central square: every
    main street leads there, and the cathedral dome guides you in like a lighthouse. An economy car is
    all you need, in any season.
ru:
  name: Поти
  short: >-
    Рабочий порт Грузии в устье Риони: город с радиальной планировкой вокруг бетонного отзвука Святой
    Софии и чугунный маяк, привезённый из Англии.
  body: >-
    **Поти пахнет соляркой, солью и речным илом — и никогда не притворялся курортом.** Над контейнерным
    причалом ходят краны, а Риони выталкивает бурую воду в Чёрное море мимо серого, исхлёстанного ветром
    пляжа.


    Где-то под озером Палиастоми или под блуждающим устьем реки лежит Фасис, основанный на рубеже VII
    и VI веков до н. э. греками из Милета во главе с Фемистагором, — та самая гавань, откуда, по преданию,
    аргонавты двинулись вверх по реке за золотым руном. Позже османы укрепили это место; Россия взяла
    его в 1828 году, а в 1858-м сделала портовым городом.


    Тот Поти, по которому вы идёте, придумал один человек. Нико Николадзе, городской голова с 1894 по
    1912 год, осушил болота, построил электростанцию, школы и театр и разбил город вокруг круглой центральной
    площади, от которой лучами расходятся улицы. В самом центре он поставил собор Рождества Богородицы
    (1906–07) — неовизантийский отзвук Святой Софии работы Александра Зеленко и Роберта Марфельда. Болотистый
    грунт не выдержал бы каменной кладки, поэтому весь храм, вместе с куполами, возвели из железобетона
    по французской системе Эннебика — это одна из самых ранних церквей в мире, построенных таким способом.
    В 1923 году советская власть превратила его в театр, а колокола отдала в фонд индустриализации; церкви
    собор вернули лишь в 2005 году.


    У устья реки стоит чугунный маяк: в 1860-х его по частям привезли морем из Англии и собрали на болтах
    прямо на песке. Есть у гавани и шрам посвежее: в августе 2008 года российские войска потопили здесь,
    прямо у причалов, корабли грузинского флота.


    Приезжайте в сумерках, когда солнце садится за маяк, а улицы вокруг площади заполняются людьми, идущими
    домой. Поти красивее всего тогда, когда перестаёт работать.
  tip: >-
    Площадь, собор и маяк можно обойти за два часа; добавьте утро, если хотите прокатиться на лодке по
    озеру Палиастоми в Колхетском национальном парке. Вход в собор свободный — плечи должны быть закрыты,
    женщинам нужен платок; прежде чем снимать внутри, спросите разрешения у священника. Припарковаться
    у круглой площади легко. Порт и военно-морская база закрыты: не фотографируйте ворота и охрану. Свежую
    черноморскую рыбу ешьте возле рынка. Купаться лучше ехать на юг, в Уреки: городской пляж серый и продуваемый.
    Зимы здесь сырые и ветреные, лето — тяжёлое и влажное.
  route: >-
    Около 320 км и 4 часа 45 минут от Тбилиси. Езжайте на запад по автомагистрали E60 мимо Гори, через
    Рикотский перевал, в объезд Кутаиси и через Самтредиа до Сенаки, а там — по указателям на Поти. Асфальт
    на всём протяжении, значительная часть пути — с разделительной полосой, и кроме Рикоти серьёзных подъёмов
    нет. Заправиться можно в Самтредиа или Сенаки, хотя и в Поти заправок хватает. В городе держите курс
    на круглую центральную площадь: к ней ведут все главные улицы, а купол собора выводит к цели, как
    маяк. В любое время года достаточно машины эконом-класса.
fa:
  name: پوتی
  short: >-
    بندر پرکار گرجستان در دهانهٔ رود ریونی: شهری با خیابان‌های شعاعی گرداگرد پژواکی بتنی از ایاصوفیه و
    فانوس دریایی چدنی ساخت انگلستان.
  body: >-
    **پوتی بوی گازوئیل، نمک و گل‌ولای رود می‌دهد و هرگز وانمود نکرده که شهری تفریحی است.** جرثقیل‌ها بر
    فراز اسکلهٔ کانتینری می‌چرخند و ریونی آب قهوه‌ای‌اش را از کنار ساحلی خاکستری و بادخورده به دریای سیاه
    می‌راند.


    جایی زیر دریاچهٔ پالیاستومی یا دهانهٔ سرگردان رود، فاسیس خفته است؛ شهری که یونانیانی از میلتوس به
    رهبری تمیستاگوراس در گذار سدهٔ هفتم به ششم پیش از میلاد بنیان نهادند — همان بندری که به روایت اسطوره،
    آرگوناوت‌ها از آنجا در جست‌وجوی پشم زرین رو به بالادست رود نهادند. بعدها عثمانی‌ها این مکان را مستحکم
    کردند؛ روسیه در ۱۸۲۸ آن را گرفت و در ۱۸۵۸ به آن جایگاه شهر بندری داد.


    پوتی‌ای که امروز در آن قدم می‌زنید زادهٔ خیال یک مرد است. نیکو نیکولادزه، شهردار از ۱۸۹۴ تا ۱۹۱۲،
    باتلاق‌ها را خشکاند، نیروگاه برق، مدرسه‌ها و تئاتر ساخت و شهر را گرداگرد میدانی مدور طرح انداخت که
    خیابان‌ها چون پرتو از آن می‌گسترند. در کانون آن، کلیسای جامع زادروز مریم مقدس (۱۹۰۶–۰۷) را نشاند:
    پژواکی نوبیزانسی از ایاصوفیه، کار الکساندر زلنکو و روبرت مارفلد. زمین باتلاقی تاب بنای سنگی را نداشت،
    از این رو تمام کلیسا، حتی گنبدهایش، از بتن مسلح و به روش فرانسوی آنبیک ساخته شد — یکی از نخستین کلیساهای
    جهان که این‌گونه بنا شد. در ۱۹۲۳ شوروی آن را به تئاتر بدل کرد و ناقوس‌هایش را به صندوق صنعتی‌سازی
    سپرد؛ بنا تنها در ۲۰۰۵ به کلیسا بازگردانده شد.


    کنار دهانهٔ رود فانوس دریایی چدنی‌ای ایستاده که در دههٔ ۱۸۶۰ تکه‌تکه از انگلستان با کشتی آوردند و
    روی ماسه‌ها با پیچ‌ومهره سرهم کردند. بندر زخمی تازه‌تر هم دارد: در اوت ۲۰۰۸ نیروهای روسی کشتی‌های
    نیروی دریایی گرجستان را همین‌جا، در لنگرگاهشان، غرق کردند.


    هنگام غروب بیایید، وقتی خورشید پشت فانوس فرو می‌رود و خیابان‌های اطراف میدان از مردمی پر می‌شود که
    به خانه بازمی‌گردند. پوتی زیباترین چهره‌اش را وقتی نشان می‌دهد که دست از کار می‌کشد.
  tip: >-
    دو ساعت برای میدان، کلیسای جامع و فانوس دریایی بس است؛ اگر قایق‌سواری در دریاچهٔ پالیاستومی در پارک
    ملی کولختی را می‌خواهید، یک صبح هم بیفزایید. ورود به کلیسای جامع رایگان است — شانه‌ها پوشیده و برای
    بانوان روسری — و پیش از عکاسی در داخل از کشیش اجازه بگیرید. پارک خودرو گرداگرد میدان مدور آسان است.
    بندر و پایگاه دریایی بسته‌اند: از دروازه‌ها و نگهبانان عکس نگیرید. ماهی تازهٔ دریای سیاه را نزدیک
    بازار بخورید. برای شنا به جنوب، به اورکی بروید؛ ساحل شهر خاکستری و بادخیز است. زمستان‌ها مرطوب و پرباد
    است و تابستان‌ها سنگین و شرجی.
  route: >-
    از تفلیس حدود ۳۲۰ کیلومتر و ۴ ساعت و ۴۵ دقیقه راه است. بزرگراه E60 را به سوی غرب بگیرید، از کنار گوری
    بگذرید، از گردنهٔ ریکوتی عبور کنید، کوتائیسی را دور بزنید و از سامتردیا تا سناکی بروید، سپس تابلوهای
    پوتی را دنبال کنید. سراسر راه آسفالت است و بخش بزرگی از آن جاده‌ای دوطرفه با جداکنندهٔ میانی؛ جز ریکوتی
    سربالایی جدی‌ای در کار نیست. در سامتردیا یا سناکی سوخت بزنید، هرچند پوتی هم پمپ‌بنزین فراوان دارد.
    در شهر رو به میدان مدور مرکزی برانید: همهٔ خیابان‌های اصلی به آن می‌رسند و گنبد کلیسای جامع چون فانوس
    دریایی راهنمایتان می‌شود. در هر فصلی خودروی اکونومی کافی است.
he:
  name: פוטי
  short: >-
    עיר הנמל העובדת של גאורגיה בשפך הריוני: עיר רדיאלית שנבנתה סביב הד בטון של איה סופיה, ולצדה מגדלור
    מברזל יצוק שהובא מאנגליה.
  body: >-
    **פוטי מדיפה ריח של סולר, מלח ובוץ נהר, ומעולם לא העמידה פנים שהיא עיר נופש.** עגורנים מסתובבים מעל
    רציף המכולות, והריוני דוחף את מימיו החומים אל הים השחור, על פני חוף אפור שהרוח מצליפה בו.


    אי שם מתחת לאגם פליאסטומי או לשפך הנודד של הנהר שוכנת פאסיס, שנוסדה בתפר שבין המאה ה-7 למאה ה-6 לפני
    הספירה בידי יוונים ממילטוס בהנהגת תמיסטגורס – הנמל שממנו, לפי הסיפור, פנו הארגונאוטים במעלה הנהר בחיפוש
    אחר גיזת הזהב. מאוחר יותר ביצרו העות'מאנים את המקום; רוסיה כבשה אותו ב-1828 והעניקה לו מעמד של עיר
    נמל ב-1858.


    פוטי שבה אתם מטיילים היא פרי דמיונו של אדם אחד. ניקו ניקולדזה, ראש העיר מ-1894 עד 1912, ייבש ביצות,
    בנה תחנת כוח, בתי ספר ותיאטרון, ותכנן את העיר סביב כיכר מרכזית עגולה שממנה יוצאים הרחובות כקרני אור.
    במרכזה הציב את קתדרלת הולדתה של מרים הבתולה (1906–07), הד נאו-ביזנטי לאיה סופיה, מעשה ידיהם של אלכסנדר
    זלנקו ורוברט מרפלד. הקרקע הביצתית לא הייתה מסוגלת לשאת בנייה באבן, ולכן הכנסייה כולה, כולל הכיפות,
    נבנתה מבטון מזוין בשיטת אנביק הצרפתית – אחת הכנסיות הראשונות בעולם שנבנו כך. ב-1923 הפכו אותה הסובייטים
    לתיאטרון ומסרו את פעמוניה לקרן התיעוש; היא הוחזרה לכנסייה רק ב-2005.


    בשפך הנהר ניצב מגדלור מברזל יצוק, שנשלח בחלקים מאנגליה בשנות ה-60 של המאה ה-19 והורכב בברגים על החול.
    לנמל יש גם צלקת טרייה יותר: באוגוסט 2008 הטביעו כאן כוחות רוסיים ספינות של חיל הים הגאורגי כשהן קשורות
    לרציף.


    בואו בשעת בין ערביים, כשהשמש שוקעת מאחורי המגדלור והרחובות שסביב הכיכר מתמלאים באנשים בדרכם הביתה.
    פוטי במיטבה כשהיא מפסיקה לעבוד.
  tip: >-
    שעתיים מספיקות לכיכר, לקתדרלה ולמגדלור; הוסיפו בוקר אם תרצו שיט בסירה באגם פליאסטומי שבפארק הלאומי
    קולחתי. הכניסה לקתדרלה חינם – כתפיים מכוסות, ולנשים כיסוי ראש – ובקשו רשות מכומר לפני שאתם מצלמים
    בפנים. קל לחנות סביב הכיכר העגולה. הנמל ובסיס חיל הים סגורים: אל תצלמו שערים או שומרים. אכלו דגי ים
    שחור טריים ליד השוק. לרחצה סעו דרומה לאורקי; החוף העירוני אפור וחשוף לרוח. החורפים גשומים וסוערים,
    הקיצים כבדים ולחים.
  route: >-
    כ-320 ק"מ ו-4 שעות ו-45 דקות מטביליסי. סעו מערבה בכביש המהיר E60, על פני גורי ודרך מעבר ריקוטי, עקפו
    את קוטאיסי והמשיכו דרך סמטרדיה עד סנאקי, ומשם לפי השילוט לפוטי. כל הדרך סלולה, חלק ניכר ממנה כביש
    דו-מסלולי, ומלבד ריקוטי אין עליות של ממש. תדלקו בסמטרדיה או בסנאקי, אם כי בפוטי יש תחנות דלק בשפע.
    בעיר כוונו אל הכיכר המרכזית העגולה: כל הרחובות הראשיים מובילים אליה, וכיפת הקתדרלה מנחה אתכם פנימה
    כמו מגדלור. רכב מקטגוריית אקונומי מספיק בכל עונה.
ar:
  name: بوتي
  short: >-
    ميناء جورجيا العامل عند مصب نهر ريوني: مدينة شعاعية التخطيط حول صدى خرساني لآيا صوفيا، ومنارة من الحديد
    الزهر جُلبت من إنجلترا.
  body: >-
    **تفوح من بوتي رائحة الديزل والملح وطمي النهر، ولم تدّعِ يومًا أنها منتجع.** تدور الرافعات فوق رصيف
    الحاويات، ويدفع نهر ريوني مياهه البنية إلى البحر الأسود مارًّا بشاطئ رمادي تجلده الرياح.


    في مكانٍ ما تحت بحيرة بالياستومي أو تحت مصب النهر المتنقّل ترقد فاسيس، التي أسسها عند منقلب القرنين
    السابع والسادس قبل الميلاد إغريقٌ من ميليتوس بقيادة ثيميستاغوراس — وهي الميناء الذي انعطف منه الأرغونوتيون،
    بحسب الحكاية، صعودًا في النهر بحثًا عن الجزة الذهبية. لاحقًا حصّن العثمانيون الموقع، ثم استولت عليه
    روسيا عام 1828 وجعلته مدينة مرفئية عام 1858.


    أما بوتي التي تتجول فيها اليوم فقد تخيّلها رجل واحد. نيكو نيكولادزه، رئيس البلدية من 1894 إلى 1912،
    جفّف المستنقعات، وبنى محطة كهرباء ومدارس ومسرحًا، وخطّط المدينة حول ساحة مركزية مستديرة تنطلق منها
    الشوارع كالأشعة. وفي قلبها أقام كاتدرائية ميلاد السيدة العذراء (1906–07)، صدى بيزنطيًّا جديدًا لآيا
    صوفيا من تصميم ألكسندر زيلينكو وروبرت مارفلد. لم تكن الأرض المستنقعية لتحتمل البناء بالحجر، فشُيّدت
    الكنيسة كلها، بقبابها، من الخرسانة المسلحة وفق نظام إنبيك الفرنسي، فكانت من أوائل الكنائس في العالم
    التي بُنيت بهذه الطريقة. وفي عام 1923 حوّلها السوفييت إلى مسرح، وسلّموا أجراسها إلى صندوق التصنيع،
    ولم تعد إلى الكنيسة إلا في عام 2005.


    عند مصب النهر تنتصب منارة من الحديد الزهر، شُحنت أجزاءً من إنجلترا في ستينيات القرن التاسع عشر وجُمعت
    بالبراغي على الرمل. وللميناء ندبة أحدث عهدًا: في آب/أغسطس 2008 أغرقت القوات الروسية هنا سفنًا للبحرية
    الجورجية وهي راسية عند أرصفتها.


    تعالَ عند الغسق، حين تغيب الشمس خلف المنارة وتمتلئ الشوارع المتفرعة من الساحة بأناس عائدين إلى بيوتهم.
    تبدو بوتي في أجمل حالاتها حين تكفّ عن العمل.
  tip: >-
    تكفي ساعتان للساحة والكاتدرائية والمنارة، وأضف صباحًا إن أردت جولة بالقارب في بحيرة بالياستومي ضمن
    منتزه كولخيتي الوطني. الدخول إلى الكاتدرائية مجاني — مع تغطية الكتفين وغطاء رأس للنساء — واستأذن كاهنًا
    قبل التصوير في الداخل. الوقوف حول الساحة المستديرة سهل. الميناء والقاعدة البحرية مغلقان: لا تصوّر
    البوابات أو الحراس. تناول سمك البحر الأسود الطازج قرب السوق. وللسباحة اتجه جنوبًا إلى أوريكي، فشاطئ
    المدينة رمادي تعصف به الرياح. الشتاء ماطر عاصف، والصيف ثقيل شديد الرطوبة.
  route: >-
    نحو 320 كم و4 ساعات و45 دقيقة من تبليسي. اسلك الطريق السريع E60 غربًا مرورًا بغوري وعبر ممر ريكوتي،
    ثم التفّ حول كوتايسي وتابع عبر سامتريديا حتى سيناكي، ومنها اتبع اللافتات إلى بوتي. الطريق معبّد بالكامل،
    وجزء كبير منه مزدوج المسارات، ولا صعود يُذكر سوى ريكوتي. تزوّد بالوقود في سامتريديا أو سيناكي، وإن
    كانت في بوتي محطات كثيرة. في المدينة توجّه إلى الساحة المركزية المستديرة: كل الشوارع الرئيسية تؤدي
    إليها، وقبة الكاتدرائية تهديك إليها كما تهدي المنارة. تكفيك سيارة اقتصادية في أي فصل.
