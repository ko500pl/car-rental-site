ka:
  name: შუხუთი და ლელო ბურთი
  short: >-
    აღდგომა დღეს ზემო და ქვემო შუხუთი ფუთიან ტყავის ბურთს ეჭიდება, მოგებული ბურთი კი მერე სოფლის გარდაცვლილის
    საფლავზე დაიდება.
  body: >-
    **აღდგომა დღეს მღვდელი შუხუთზე გამავალ გზაზე ტყავის ბურთს დააგდებს და სოფელი შუაზე გაიყოფა.**


    ზემო შუხუთი ერთ მხარეს აწვება, ქვემო შუხუთი მეორეს. არც მსაჯია, არც მოედანი, არც საათი. თამაშობს ყველა,
    ვისაც ფეხზე დგომა და მხრის მიბჯენა შეუძლია, მიზანი კი ერთია: ბურთი საკუთარ ნაპირამდე, ორასიოდე მეტრის
    იქით, უნდა მიათრიონ. ბურთი ერთ ფუთს, დაახლოებით თექვსმეტ კილოგრამს იწონის და ქვიშით, მიწითა და ნახერხით
    მაგრად არის გატენილი.


    ბურთის კეთებაც რიტუალია. ძველი წესით მას სოფლის მეწაღე კერავს. მეზობლები სუფრას შლიან, მიცვალებულებს
    სადღეგრძელოს უძღვნიან და ბოლო ნაკერამდე ბურთში ღვინოს ასხამენ. ძველად აგუნას ასხამდნენ, შავი ღვინის,
    თაფლისა და ბროწეულის წვენის ნაზავს. მერე მღვდელი ბურთს ეკლესიაში აკურთხებს. როგორც კი ბურთი ძირს დაეცემა,
    ხალხის გროვა ეზოებსა და ღობეებზე გადაიგორებს და ხშირად ორ საათზე მეტხანს არ იშლება.


    ყოველი წლის თამაში სოფლის რომელიმე გარდაცვლილის ხსოვნას ეძღვნება. გამარჯვებულებს ბურთი მისი ოჯახის
    კარზე მიაქვთ, მოგვიანებით კი იგი საფლავზე დაიდება. შუხუთის სასაფლაოზე ძველი ბურთები დღესაც დევს საფლავის
    ქვებს შორის: დაბალი, ნაცრისფერი, ნაკერებად დაყოფილი, ზედ საღებავით დაწერილი წლით.


    ლელო ძველი თამაშია. „ვეფხისტყაოსნის“ გმირებიც ლელოს თამაშობენ, ხალხის რწმენით კი გამარჯვებულ სოფელს
    მეტი მოსავალი ელოდა. შუხუთელები თავიანთ სააღდგომო ლელოს ყირიმის ომის დროს, 1855 წელს, აქვე გამართულ
    ბრძოლას უკავშირებენ. თამაშმა საბჭოთა აკრძალვებსაც გაუძლო: 1980-იან წლებში მილიციას რომ გამოჰპარვოდნენ,
    სოფელმა ლელო 1 მაისზე გადაიტანა. ერთადერთი წელი, როცა ბურთს ხელი არავინ ახლო, 1989 იყო, 9 აპრილის
    ტრაგედიის შემდეგ. 2014 წელს ლელო ბურთი არამატერიალური კულტურული მემკვიდრეობის ძეგლად გამოცხადდა, საქართველოს
    სარაგბო ნაკრებს კი დღემდე „ლელოებს“ ეძახიან.


    წლის დანარჩენ დღეებში ღელე უბრალოდ ღელეა.
  tip: >-
    მართლმადიდებლური აღდგომა აპრილსა და მაისის დასაწყისს შორის მოძრაობს, ამიტომ თარიღი წინასწარ გადაამოწმეთ,
    სოფელში შუადღემდე ჩადით და ადგილობრივებს ჰკითხეთ, როდის დააგდებენ ბურთს. ეს ნამდვილი კონტაქტური ჭიდილია
    და გროვა სწრაფად მოძრაობს: უყურეთ ღობიდან, აივნიდან ან ფერდობიდან და არასოდეს ჩადგეთ გროვასა და წყალს
    შორის. ისეთი ფეხსაცმელი ჩაიცვით, რომლის დაზიანებაც არ დაგენანებათ. სოფლის გზა თავად იქცევა სათამაშო
    მოედნად, ამიტომ მანქანა განაპირას დატოვეთ და ფეხით შედით. მაღაზიები და კაფეები სამ კილომეტრში, ლანჩხუთშია.
    სასაფლაოზე ბურთებს მხოლოდ უყურეთ და ხელს ნუ ახლებთ: თითოეული რომელიმე ოჯახის მიცვალებულს ეკუთვნის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის უღელტეხილისა და ქუთაისის გავლით სამტრედიამდე
    იარეთ, იქიდან კი ს12-ით სამხრეთ-დასავლეთით ლანჩხუთამდე. შუხუთი ქალაქის ცენტრიდან დაახლოებით სამ კილომეტრშია,
    ჯაპანისკენ მიმავალ ადგილობრივ გზაზე (შ208), ლანჩხუთის აღმოსავლეთითა და სამხრეთ-აღმოსავლეთით. ძველ
    მითითებებს, რომლებიც ზღვისკენ, დასავლეთით გაგზავნიან, ნუ მიჰყვებით. სულ დაახლოებით 278 კმ-ია და ოთხ
    საათზე ცოტა ნაკლები, მთელი გზა ასფალტიანია და ეკონომ-კლასის მანქანაც საკმარისია. საწვავი სამტრედიაში
    ან ლანჩხუთში ჩაასხით. აღდგომა დღეს მანქანა ლანჩხუთში ან სოფლის განაპირას დატოვეთ და ბოლო მონაკვეთი
    ფეხით გაიარეთ.
en:
  name: Shukhuti and Lelo Burti
  short: >-
    Every Orthodox Easter the two halves of a Gurian village fight over a 16-kilo leather ball, and the
    winning ball ends up on a grave.
  body: >-
    **On Orthodox Easter Sunday a priest drops a leather ball on the road through Shukhuti, and the village
    splits in two.**


    Upper Shukhuti heaves one way, Lower Shukhuti the other. No referee, no pitch, no clock. Any man who
    can stand and shove may play; the only aim is your own side's riverbank, a couple of hundred metres
    off. The ball weighs about sixteen kilograms — one *pood*, an old Russian measure of weight — and
    is packed hard with sand, earth and sawdust.


    Making it is part of the rite. By custom a village shoemaker sews it. Neighbours gather round food
    and wine, drink toasts to the dead, and pour wine into the ball before the last stitches close. Once
    it was aguna: red wine with honey and pomegranate juice. The priest blesses it in church. Then the
    scrum rolls through gardens and over fences, for two hours or more.


    Each year's game is dedicated to a villager who has died. The winners carry the ball to that family's
    house, and later it is laid on the grave. In Shukhuti cemetery old balls still rest among the headstones:
    squat, grey, stitched in panels, a year painted on the leather.


    The game is old. The heroes of Rustaveli's twelfth-century *Knight in the Panther's Skin* play it,
    and folk belief held that the winning village would reap the better harvest. Shukhuti ties its Easter
    game to a Crimean War battle fought nearby in 1855. It outlived Soviet disapproval: in the 1980s villagers
    dodged the police by moving it to 1 May, and the one year nobody touched the ball was 1989, after
    the 9 April killings in Tbilisi. In 2014 lelo burti was listed as intangible cultural heritage, and
    Georgia's rugby team is still called the Lelos.


    The rest of the year the stream is just a stream.
  tip: >-
    Orthodox Easter moves between April and early May, so check the date, arrive by late morning and ask
    locals when the ball goes in. This is full contact and the crowd moves fast: watch from a fence, a
    porch or a slope, and never stand between the scrum and the water. Wear shoes you can sacrifice. The
    road through the village becomes the playing field, so park on the edge and walk in. Lanchkhuti, three
    kilometres away, has shops and cafés. In the cemetery, look but do not touch the balls: each belongs
    to a family's dead.
  route: >-
    From Tbilisi take the S1 (E60) west over the Rikoti Pass and past Kutaisi to Samtredia, then the S12
    south-west to Lanchkhuti. Shukhuti lies about three kilometres from the town centre on the local road
    towards Japana (Sh208), to the east and south-east of Lanchkhuti. Do not follow older directions that
    send you west towards the coast. In all it is about 278 km and just under four hours, asphalt the
    whole way, and an economy car is fine. Fill up in Samtredia or Lanchkhuti. On Easter Sunday leave
    the car in Lanchkhuti or at the village edge and walk the last stretch.
ru:
  name: Шухути и лело бурти
  short: >-
    Каждую Пасху две половины гурийской деревни бьются за 16-килограммовый кожаный мяч, а мяч победителей
    ложится на могилу.
  body: >-
    **В православное пасхальное воскресенье священник бросает кожаный мяч на дорогу через Шухути, и деревня
    раскалывается на две части.**


    Верхнее Шухути напирает в одну сторону, Нижнее — в другую. Ни судьи, ни поля, ни времени игры. Играть
    может любой мужчина, способный стоять и толкаться; единственная цель — берег реки на своей стороне,
    в паре сотен метров отсюда. Мяч весит около шестнадцати килограммов — один пуд, старая русская мера
    веса, — и туго набит песком, землёй и опилками.


    Изготовление мяча — часть обряда. По обычаю его шьёт деревенский сапожник. Соседи собираются за едой
    и вином, поднимают тосты за умерших и вливают вино в мяч перед тем, как закрыть последние швы. Когда-то
    это было агуна — красное вино с мёдом и гранатовым соком. Священник благословляет мяч в церкви. Затем
    схватка катится через сады и через заборы, два часа и больше.


    Игру каждого года посвящают памяти одного из умерших жителей деревни. Победители несут мяч к дому
    этой семьи, а позже его кладут на могилу. На кладбище Шухути старые мячи до сих пор лежат среди надгробий:
    приплюснутые, серые, сшитые из клиньев, с годом, написанным на коже.


    Игра стара. Герои поэмы Руставели XII века «Витязь в тигровой шкуре» играют в неё, а народное поверье
    гласило, что победившая деревня соберёт лучший урожай. Шухути связывает свою пасхальную игру с битвой
    Крымской войны, произошедшей рядом в 1855 году. Она пережила советское неодобрение: в 1980-х годах
    жители обходили милицию, перенося игру на 1 мая, а единственным годом, когда никто не тронул мяч,
    был 1989-й — после расстрела 9 апреля в Тбилиси. В 2014 году лело бурти было включено в список нематериального
    культурного наследия, а сборная Грузии по рэгби до сих пор называется «Лело».


    В остальное время года река — просто река.
  tip: >-
    Православная Пасха выпадает то на апрель, то на начало мая, так что проверьте дату, приезжайте к позднему
    утру и спросите местных, когда бросают мяч. Это игра с полным контактом, и толпа движется быстро:
    смотрите с забора, крыльца или склона и никогда не стойте между схваткой и водой. Наденьте обувь,
    которой не жалко. Дорога через деревню превращается в игровое поле, так что парковаться нужно на окраине
    и идти пешком. В Ланчхути, в трёх километрах, есть магазины и кафе. На кладбище смотрите, но не трогайте
    мячи: каждый принадлежит умершему из чьей-то семьи.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Рикотский перевал и Кутаиси до Самтредиа, затем по S12
    на юго-запад до Ланчхути. Шухути лежит примерно в трёх километрах от центра города по местной дороге
    в сторону Джапаны (Sh208), к востоку и юго-востоку от Ланчхути. Не следуйте старым указаниям, которые
    направляют на запад, к побережью. Всего это около 278 км и чуть менее четырёх часов, асфальт на всём
    протяжении, обычной легковой машины хватит. Заправиться можно в Самтредиа или Ланчхути. В пасхальное
    воскресенье оставьте машину в Ланчхути или на окраине деревни и пройдите последний отрезок пешком.
fa:
  name: شوخوتی و لِلو بورتی
  short: >-
    هر یکشنبهٔ عید پاک ارتدوکس، دو نیمهٔ یک روستای گوریایی بر سر توپی چرمی به وزن شانزده کیلوگرم می‌جنگند،
    و توپِ برنده سرانجام بر گوری نهاده می‌شود.
  body: >-
    **در یکشنبهٔ عید پاک ارتدوکس، کشیشی توپی چرمی را بر جادهٔ میان شوخوتی می‌افکند، و روستا به دو نیم
    می‌شود.**


    شوخوتی بالا به یک سو هجوم می‌برد، شوخوتی پایین به سوی دیگر. نه داوری، نه زمینی، نه ساعتی. هر مردی
    که بتواند بایستد و هُل بدهد می‌تواند بازی کند؛ تنها هدف رساندن توپ به کنارهٔ رود سمت خودی است، چند
    صد متر دورتر. توپ حدود شانزده کیلوگرم — یک «پود»، واحد وزن کهن روسی — وزن دارد و با شن، خاک و خاک‌اره
    سخت پُر شده است.


    ساختن توپ بخشی از این آیین است. به رسم، کفاش روستا آن را می‌دوزد. همسایه‌ها گرد غذا و شراب می‌آیند،
    به یاد مردگان جام بلند می‌کنند و پیش از بستن آخرین بخیه‌ها، شراب در توپ می‌ریزند. زمانی این شراب «آگونا»
    بود: شراب سرخ با عسل و آب انار. کشیش آن را در کلیسا برکت می‌دهد. سپس ازدحام بازیکنان از میان باغ‌ها
    و روی نرده‌ها می‌غلتد، دو ساعت یا بیشتر.


    بازی هر سال به یاد یکی از روستاییان درگذشته برگزار می‌شود. برندگان توپ را به خانهٔ آن خانواده می‌برند،
    و بعدها آن را بر گور می‌نهند. در گورستان شوخوتی، توپ‌های کهن هنوز میان سنگ‌های گور آرام گرفته‌اند:
    کوتاه و پهن، خاکستری، با تکه‌های دوخته‌شده، با سالی نگاشته‌شده بر چرم.


    این بازی کهن است. قهرمانان منظومهٔ سدهٔ دوازدهمِ روستاولی، «پهلوان پلنگینه‌پوش»، این بازی را می‌کنند،
    و باور مردمی می‌گفت روستای برنده محصول بهتری خواهد داشت. شوخوتی بازی عید پاک خود را به نبردی از جنگ
    کریمه، که در سال ۱۸۵۵ در همان نزدیکی درگرفت، پیوند می‌دهد. این بازی از نارضایتی شوروی هم جان به در
    برد: در دههٔ ۱۹۸۰ روستاییان با انتقال بازی به یکم مه پلیس را دور زدند، و تنها سالی که کسی به توپ دست
    نزد سال ۱۹۸۹ بود، پس از کشتار نهم آوریل در تفلیس. در سال ۲۰۱۴ لِلو بورتی به‌عنوان میراث فرهنگی ناملموس
    ثبت شد، و تیم راگبی گرجستان هنوز «لِلوها» نامیده می‌شود.


    در باقی سال، رودخانه فقط یک رودخانه است.
  tip: >-
    یکشنبهٔ عید پاک ارتدوکس میان آوریل و اوایل مه در نوسان است، پس تاریخ را بررسی کنید، تا اواخر صبح برسید
    و از مردم محل بپرسید توپ چه زمانی رها می‌شود. این بازی کاملاً تماسی است و جمعیت به‌سرعت حرکت می‌کند:
    از نرده، ایوان یا شیب تماشا کنید و هرگز میان ازدحام و آب نایستید. کفشی بپوشید که خراب شدنش برایتان
    مهم نباشد. جادهٔ میان روستا خودِ زمین بازی می‌شود، پس در حاشیه پارک کنید و پیاده بروید. لانچخوتی،
    در سه کیلومتری، مغازه و کافه دارد. در گورستان، نگاه کنید اما توپ‌ها را لمس نکنید: هرکدام از آنِ یکی
    از مردگان یک خانواده است.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب، از گذرگاه ریکوتی و کوتایسی، تا سامتردیا برانید، سپس در مسیر
    S12 به سوی جنوب‌غرب تا لانچخوتی. شوخوتی حدود سه کیلومتر از مرکز شهر، بر جادهٔ محلی به سوی جاپانا (Sh208)،
    در شرق و جنوب‌شرق لانچخوتی قرار دارد. از راهنمایی‌های قدیمی که شما را به سوی غرب و ساحل می‌فرستند
    پیروی نکنید. در کل حدود ۲۷۸ کیلومتر و کمی کمتر از چهار ساعت است، تمام مسیر آسفالت، و یک خودروی معمولی
    کافی است. سوخت‌گیری در سامتردیا یا لانچخوتی. در یکشنبهٔ عید پاک، خودرو را در لانچخوتی یا حاشیهٔ روستا
    بگذارید و آخرین بخش راه را پیاده بروید.
he:
  name: שוחוטי ולֶלוֹ בּוּרְטִי
  short: >-
    בכל חג הפסחא הנוצרי-אורתודוקסי נלחמים שני חצאיו של כפר גוריאני על כדור עור במשקל 16 קילו, והכדור המנצח
    מגיע בסופו של דבר לקבר.
  body: >-
    **ביום ראשון של חג הפסחא האורתודוקסי מטיל כומר כדור עור על הדרך העוברת בשוחוטי, והכפר מתפצל לשניים.**


    שוחוטי העליונה נדחקת לכיוון אחד, שוחוטי התחתונה לכיוון השני. אין שופט, אין מגרש, אין שעון. כל גבר
    שיכול לעמוד ולדחוף רשאי לשחק; המטרה היחידה היא גדת הנהר של הצד שלו, כמה מאות מטרים משם. הכדור שוקל
    כשישה־עשר קילוגרם — "פוד" אחד, יחידת משקל רוסית עתיקה — ומהודק בחוזקה בחול, עפר ונסורת.


    הכנתו היא חלק מהטקס. לפי המסורת תופר אותו הסנדלר של הכפר. שכנים מתאספים סביב אוכל ויין, מרימים כוסית
    לזכר המתים ושופכים יין לתוך הכדור לפני שהתפרים האחרונים נסגרים. פעם היה זה אגונה: יין אדום עם דבש
    ומיץ רימונים. הכומר מברך אותו בכנסייה. ואז נגררת התגרה בין הגנים ומעל הגדרות, שעתיים ומעלה.


    המשחק של כל שנה מוקדש לזכרו של אחד מתושבי הכפר שנפטר. המנצחים נושאים את הכדור לבית המשפחה, ובהמשך
    הוא מונח על הקבר. בבית הקברות של שוחוטי כדורים ישנים עדיין שוכבים בין המצבות: גוצים, אפורים, תפורים
    מפיסות, עם שנה צבועה על העור.


    המשחק עתיק. גיבורי היצירה מהמאה ה-12 של רוסתאוולי, "עוטה עור הנמר", משחקים בו, ואמונה עממית קבעה שהכפר
    המנצח יזכה בקציר טוב יותר. שוחוטי מקשרת את משחק הפסחא שלה לקרב ממלחמת קרים שהתחולל בסמוך ב-1855. הוא
    שרד את הסתייגות השלטון הסובייטי: בשנות ה-80 התחמקו הכפריים מהמיליציה בהעברת המשחק ל-1 במאי, והשנה
    היחידה שבה איש לא נגע בכדור הייתה 1989, אחרי הטבח של 9 באפריל בטביליסי. ב-2014 נרשם לֶלוֹ בּוּרְטִי
    כמורשת תרבותית בלתי-מוחשית, ונבחרת הרוגבי של גאורגיה עדיין נקראת "הלֶלוֹ".


    בשאר השנה הנחל הוא רק נחל.
  tip: >-
    חג הפסחא האורתודוקסי נע בין אפריל לתחילת מאי, לכן בדקו את התאריך, הגיעו עד סוף הבוקר ושאלו את המקומיים
    מתי מטילים את הכדור. זהו משחק של מגע מלא וההמון נע במהירות: התבוננו מגדר, מרפסת או מדרון, ולעולם אל
    תעמדו בין התגרה למים. נעלו נעליים שלא חבל לכם עליהן. הדרך העוברת בכפר הופכת למגרש המשחקים, לכן חנו
    בקצה והמשיכו ברגל. בלנצ'חוטי, שלושה קילומטרים משם, יש חנויות ובתי קפה. בבית הקברות, הביטו אך אל תיגעו
    בכדורים: כל כדור שייך לנפטר של משפחה כלשהי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה מעל מעבר ריקותי וחלפו על פני קוטאיסי עד סמטרדיה, ואז ב-S12 דרום-מערבה
    עד לנצ'חוטי. שוחוטי שוכנת כשלושה קילומטרים ממרכז העיר בדרך המקומית לעבר ג'אפנה (Sh208), ממזרח ומדרום-מזרח
    ללנצ'חוטי. אל תלכו לפי הוראות ישנות שמכוונות מערבה לעבר החוף. בסך הכול זה כ-278 ק"מ ומעט מתחת לארבע
    שעות, אספלט כל הדרך, ורכב פשוט מספיק. תדלוק בסמטרדיה או בלנצ'חוטי. ביום ראשון של הפסחא השאירו את הרכב
    בלנצ'חוטי או בקצה הכפר והמשיכו ברגל בקטע האחרון.
ar:
  name: شوخوتي وليلو بورتي
  short: في كل عيد فصح أرثوذكسي، يتنازع نصفا قرية غورية على كرة جلدية تزن 16 كيلوغرامًا، وتنتهي الكرة
    الفائزة على قبر.
  body: >-
    **في أحد الفصح الأرثوذكسي، يرمي كاهن كرة جلدية على الطريق العابر لشوخوتي، فتنقسم القرية إلى نصفين.**


    تدفع شوخوتي العليا في اتجاه، وشوخوتي السفلى في الاتجاه الآخر. لا حكم، ولا ملعب، ولا ساعة. يستطيع اللعب
    أي رجل قادر على الوقوف والدفع؛ والهدف الوحيد هو ضفة النهر في جانبه، على بُعد مئتي متر تقريبًا. تزن
    الكرة نحو ستة عشر كيلوغرامًا، أي «بود» واحد (وحدة وزن روسية قديمة)، وتُحشى بقوة بالرمل والتراب ونشارة
    الخشب.


    صناعتها جزء من الشعيرة. جرت العادة أن يخيطها إسكافي القرية. يتجمّع الجيران حول الطعام والنبيذ، يشربون
    نخبًا للموتى، ويسكبون النبيذ في الكرة قبل إغلاق آخر الغرز. كان هذا النبيذ يُدعى «أغونا»: نبيذ أحمر
    بالعسل وعصير الرمان. يبارك الكاهن الكرة في الكنيسة. ثم تتدحرج المعمعة عبر الحدائق وفوق الأسوار، لساعتين
    أو أكثر.


    تُخصَّص لعبة كل عام لأحد أبناء القرية الذين رحلوا. يحمل الفائزون الكرة إلى بيت تلك العائلة، وتوضع
    بعد ذلك على القبر. في مقبرة شوخوتي لا تزال كرات قديمة ترقد بين شواهد القبور: قصيرة عريضة، رمادية،
    مخيطة من رقع، وعليها سنة مطلية على الجلد.


    اللعبة قديمة. يلعبها أبطال منظومة روستافيلي من القرن الثاني عشر «الفارس في جلد النمر»، وكان الاعتقاد
    الشعبي يقول إن القرية الفائزة ستحصد محصولًا أوفر. تربط شوخوتي لعبة الفصح فيها بمعركة من حرب القرم
    دارت قريبًا منها عام 1855. ونجت اللعبة من استنكار السوفييت: في الثمانينيات تحايل القرويون على الشرطة
    بنقل اللعبة إلى الأول من مايو، والسنة الوحيدة التي لم يلمس فيها أحد الكرة كانت 1989، بعد مجزرة التاسع
    من أبريل في تبليسي. وفي عام 2014 أُدرجت ليلو بورتي في قائمة التراث الثقافي غير المادي، وما زال فريق
    جورجيا للرغبي يُدعى «الليلوز».


    وفي بقية العام، يبقى النهر مجرد نهر.
  tip: >-
    يتحرك عيد الفصح الأرثوذكسي بين أبريل وأوائل مايو، فتحقق من التاريخ، واحضر قبل الظهر واسأل السكان المحليين
    عن موعد رمي الكرة. هذه لعبة احتكاك جسدي كامل والحشد يتحرك بسرعة: راقب من سياج أو شرفة أو منحدر، ولا
    تقف أبدًا بين المعمعة والماء. ارتدِ حذاءً لا تمانع أن يتلف. يتحول الطريق العابر للقرية إلى ملعب، فاركن
    سيارتك على الطرف وتابع سيرًا على الأقدام. تضم لانتشخوتي، على مسافة ثلاثة كيلومترات، متاجر ومقاهٍ.
    وفي المقبرة، انظر لكن لا تلمس الكرات: فكل واحدة منها تخص فقيدًا من إحدى العائلات.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر ممر ريكوتي ومرورًا بكوتايسي حتى سامتريديا، ثم S12 جنوب غربًا
    حتى لانتشخوتي. تقع شوخوتي على نحو ثلاثة كيلومترات من وسط البلدة على الطريق المحلي نحو جابانا (Sh208)،
    شرق وجنوب شرق لانتشخوتي. لا تتبع الاتجاهات القديمة التي تأخذك غربًا نحو الساحل. المسافة الإجمالية
    نحو 278 كم وأقل قليلًا من أربع ساعات، والطريق معبّد بالكامل، وسيارة اقتصادية تكفي. التزود بالوقود
    في سامتريديا أو لانتشخوتي. في أحد الفصح، اترك السيارة في لانتشخوتي أو عند حافة القرية وتابع المسافة
    الأخيرة سيرًا على الأقدام.
