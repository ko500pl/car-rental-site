ka:
  name: შუხუთი და ლელო ბურთი
  short: ორი მეზობელი გურული სოფელი, რომლებიც აღდგომა დღეს ერთმანეთს ორმოცდაათკილოგრამიან ტყავის ბურთზე
    ეჭიდავებიან.
  body: >-
    **წელიწადში ერთხელ, აღდგომა დღეს, ორი გურული სოფელი ბურთისთვის ერკინება — და ეს არაა თამაში ტურისტებისთვის.**
    ზემო და ქვემო შუხუთი ლანჩხუთის მუნიციპალიტეტშია, ერთმანეთის გვერდით, გაყოფილი პატარა მდინარით. სწორედ
    ეს მდინარეა თამაშის ორივე მიზანი.

    ლელო ბურთი უწესო, უპოზიციო და თითქმის უწესებო ჭიდილია. ბურთს ხელით კერავენ ტყავისგან, ავსებენ ნახერხითა
    და მიწით, და ის ორმოცდაათ კილოგრამამდე იწონის. სოფლის მღვდელი მას აკურთხებს და მოედნის შუაში ისვრის.
    ამის შემდეგ ორი გუნდი — თითოეული სოფლის ყველა მამაკაცი, ვინც კი დგას — ცდილობს ბურთი „თავის" მდინარემდე
    მიიტანოს. სხვა წესი არ არსებობს: არც დროის ლიმიტი, არც მოთამაშეთა რაოდენობა, არც მოედნის საზღვრები.

    თამაში სამიდან ხუთ საათამდე გრძელდება, ხშირად ქუჩებში, ღობეებზე და ბაღებში. მოგებული ბურთი წლის განმავლობაში
    სოფელში, გარდაცვლილი თანასოფლელის საფლავზე დაიდება — ეს თამაშის ყველაზე მნიშვნელოვანი ნაწილია და ის,
    რაც მას სპორტიდან რიტუალში გადაჰყავს.

    ტრადიციის ასაკი ზუსტად არაა ცნობილი; ჩვეულებრივ მას შუა საუკუნეების სამხედრო წვრთნას უკავშირებენ.
    2014 წლიდან ლელო ბურთი საქართველოს არამატერიალური კულტურული მემკვიდრეობის ძეგლია.

    დანარჩენ 364 დღეს შუხუთი ჩვეულებრივი გურული სოფელია: ჩაის ბუჩქები, თხილის ბაღები, ხის აივნები. ღირს
    გავლა, თუ გზაზე ხარ — მაგრამ თუ თამაში გინდა, თარიღი ერთია და ის მართლმადიდებლური აღდგომაა.
  tip: >-
    თამაშის დღეს — მთელი შუადღე. ბურთი ქუჩებში მოძრაობს და უსაფრთხო მანძილი აუცილებელია: ეს კონტაქტური
    ჭიდილია და დამსწრეც ხვდება ხოლმე. მანქანა სოფლის გარეთ დატოვე, შიგნით გზები იკეტება. ტუალეტი და კაფე
    პრაქტიკულად არაა — წყალი და საკვები თან წაიღე. სხვა დღეს სოფელი მშვიდია და ღირს მხოლოდ გავლისას.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთამდე და დასავლეთით სოფლის გზით — 305 კმ, დაახლოებით
    ოთხი საათი ოცდათხუთმეტი წუთი. მთავარი გზა ბოლომდე ასფალტია; ბოლო ათი კილომეტრი ვიწრო სოფლის გზაა,
    ასფალტი, მაგრამ ორმოებით. საწვავი ლანჩხუთშია. აღდგომა დღეს პარკინგი პრობლემაა — ჩამოდი ადრე და მანქანა
    მთავარ გზაზე დატოვე. ეკონომ-კლასი საკმარისია.
en:
  name: Shukhuti and Lelo Burti
  short: Two villages that fight each other over a fifty-kilogram ball once a year, on Easter Sunday.
  body: >-
    **Once a year, on Orthodox Easter, two Gurian villages fight for a ball — and this is not a performance
    for visitors.** Zemo and Kvemo Shukhuti sit side by side in Lanchkhuti municipality, separated by
    a small river. That river is the goal at both ends.

    Lelo burti is a mass wrestle with no positions, no pitch and almost no rules. The ball is sewn by
    hand from leather, packed with sawdust and earth, and weighs up to fifty kilograms. The village priest
    blesses it and throws it into the middle. After that two teams — every man of each village who is
    standing — try to carry it to their own river. There is nothing else: no time limit, no fixed number
    of players, no boundaries.

    The game runs three to five hours and moves through streets, over fences and through gardens. The
    winning ball is then laid for the year on the grave of a villager who died recently. That is the most
    important part of the whole thing, and what moves it out of sport and into ritual.

    Nobody knows exactly how old the tradition is; it is usually connected to medieval military training.
    Since 2014 lelo burti has been listed as intangible cultural heritage of Georgia.

    On the other 364 days Shukhuti is an ordinary Gurian village: tea bushes, hazelnut orchards, wooden
    balconies. Worth passing through if you are on the road — but if you want the game, there is one date,
    and it is Orthodox Easter.
  tip: >-
    On match day, allow the whole afternoon. The ball moves through the streets and a safe distance matters
    — this is full-contact and spectators do get caught in it. Leave the car outside the village, as roads
    inside are blocked. There are effectively no toilets or cafes, so bring water and food. On any other
    day the village is quiet and worth only a drive-through.
  route: >-
    From Tbilisi take the E60 to Samtredia, then south to Lanchkhuti and west on the village road — 305
    km, about four hours thirty-five. The main road is asphalt throughout; the last ten kilometres are
    a narrow village road, surfaced but potholed. Fuel is available in Lanchkhuti. On Easter Sunday parking
    is a genuine problem, so arrive early and leave the car on the main road. An economy car is sufficient.
ru:
  name: Шухути и лело бурти
  short: Две деревни, которые раз в год, на Пасху, сражаются друг с другом за пятидесятикилограммовый
    мяч.
  body: >-
    **Раз в год, на православную Пасху, две гурийские деревни дерутся за мяч — и это не представление
    для приезжих.** Земо и Квемо Шухути стоят рядом в Ланчхутском муниципалитете, разделённые небольшой
    рекой. Эта река и есть цель с обеих сторон.

    Лело бурти — массовая борьба без позиций, без поля и почти без правил. Мяч шьют вручную из кожи, набивают
    опилками и землёй, и весит он до пятидесяти килограммов. Сельский священник благословляет его и бросает
    в середину. Дальше две команды — все мужчины каждой деревни, кто держится на ногах, — тащат его к
    своей реке. Больше нет ничего: ни лимита времени, ни числа игроков, ни границ.

    Игра длится от трёх до пяти часов и идёт по улицам, через заборы и огороды. Выигранный мяч потом на
    год кладут на могилу односельчанина, умершего недавно. Это самая важная часть всего действия и то,
    что переводит его из спорта в ритуал.

    Точный возраст традиции неизвестен; обычно её связывают со средневековыми военными упражнениями. С
    2014 года лело бурти внесено в список нематериального культурного наследия Грузии.

    В остальные 364 дня Шухути — обычное гурийское село: чайные кусты, фундучные сады, деревянные балконы.
    Стоит проехать, если вы всё равно рядом, — но если вам нужна игра, дата одна, и это православная Пасха.
  tip: >-
    В день игры закладывайте весь день. Мяч движется по улицам, безопасная дистанция обязательна: это
    полный контакт, и зрителям тоже достаётся. Машину оставляйте за селом, внутри дороги перекрыты. Туалетов
    и кафе фактически нет, воду и еду везите с собой. В любой другой день село тихое и годится только
    для проезда.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг до Ланчхути и на запад по сельской дороге — 305 км, около
    четырёх часов тридцати пяти минут. Главная дорога асфальтированная; последние десять километров —
    узкая сельская, с покрытием, но в ямах. Заправка в Ланчхути. На Пасху парковка — настоящая проблема,
    приезжайте заранее и оставляйте машину на главной дороге. Машины эконом-класса достаточно.
fa:
  name: شوخوتی و للو بورتی
  short: دو روستا که سالی یک بار، در یکشنبهٔ عید پاک، بر سر توپی پنجاه کیلویی با هم می‌جنگند.
  body: >-
    **سالی یک بار، در عید پاک ارتدکس، دو روستای گوریایی بر سر توپی می‌جنگند — و این نمایشی برای گردشگر
    نیست.** زمو و کومو شوخوتی کنار هم در شهرستان لانچخوتی نشسته‌اند و رودی کوچک آن‌ها را جدا می‌کند. همان
    رود در دو سو هدف بازی است.

    للو بورتی کشتی‌ای گروهی است بی‌پست، بی‌زمین و تقریباً بی‌قاعده. توپ را با دست از چرم می‌دوزند و از
    خاک‌اره و خاک پر می‌کنند و تا پنجاه کیلوگرم وزن دارد. کشیش روستا آن را برکت می‌دهد و به میان می‌اندازد.
    از آن پس دو تیم — هر مردی از هر روستا که سرپاست — می‌کوشند آن را تا رود خودشان ببرند. چیز دیگری در
    کار نیست: نه محدودیت زمان، نه شمار بازیکن، نه مرز زمین.

    بازی سه تا پنج ساعت طول می‌کشد و در خیابان‌ها و روی پرچین‌ها و میان باغ‌ها پیش می‌رود. توپ برنده سپس
    یک سال بر گور هم‌روستایی‌ای که تازه درگذشته گذاشته می‌شود. این مهم‌ترین بخش کل ماجراست و همان است
    که آن را از ورزش به آیین می‌برد.

    قدمت دقیق این سنت روشن نیست؛ معمولاً آن را به تمرین‌های نظامی سده‌های میانه می‌بندند. از ۲۰۱۴ للو
    بورتی در فهرست میراث فرهنگی ناملموس گرجستان ثبت شده است.

    در ۳۶۴ روز دیگر شوخوتی روستایی معمولی در گوریاست: بوته‌های چای، باغ‌های فندق، ایوان‌های چوبی. اگر
    سر راهید ارزش گذر دارد، اما اگر بازی را می‌خواهید تاریخ یکی است و آن عید پاک ارتدکس است.
  tip: >-
    روز بازی، تمام بعدازظهر را کنار بگذارید. توپ در خیابان‌ها می‌چرخد و فاصلهٔ ایمن مهم است؛ این کشتی
    تماسی است و تماشاگر هم گرفتار می‌شود. خودرو را بیرون روستا بگذارید، چون راه‌های داخل بسته می‌شود.
    عملاً سرویس بهداشتی و کافه نیست، پس آب و خوراک همراه ببرید. روزهای دیگر روستا آرام است و تنها ارزش
    گذر دارد.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب تا لانچخوتی و به غرب در جادهٔ روستایی — ۳۰۵ کیلومتر، حدود
    چهار ساعت و سی‌وپنج دقیقه. جادهٔ اصلی سرتاسر آسفالت است؛ ده کیلومتر آخر جادهٔ باریک روستایی است، آسفالت
    اما پرچاله. سوخت در لانچخوتی. روز عید پاک پارک کردن مشکل واقعی است، پس زود بیایید و خودرو را روی جادهٔ
    اصلی بگذارید. خودروی اقتصادی کافی است.
he:
  name: שוחותי ולֶלוֹ בּוּרְטִי
  short: שני כפרים הנאבקים זה בזה על כדור במשקל חמישים קילוגרם פעם בשנה, ביום ראשון של הפסחא.
  body: >-
    **פעם בשנה, בפסחא האורתודוקסי, שני כפרים גוריאניים נאבקים על כדור — וזה אינו מופע למבקרים.** זמו וקומו
    שוחותי יושבים זה לצד זה במחוז לנצ׳חותי, ונהר קטן מפריד ביניהם. הנהר הזה הוא השער בשני הקצוות.

    לֶלוֹ בּוּרְטִי הוא מאבק המונים בלי עמדות, בלי מגרש וכמעט בלי חוקים. הכדור נתפר ביד מעור, נדחס בנסורת
    ובאדמה, ומשקלו מגיע לחמישים קילוגרם. כומר הכפר מברך אותו ומשליך אותו למרכז. מכאן שתי קבוצות — כל גבר
    בכפר שעומד על רגליו — מנסות לשאת אותו אל הנהר שלהן. אין דבר מלבד זה: אין הגבלת זמן, אין מספר שחקנים,
    אין גבולות.

    המשחק נמשך שלוש עד חמש שעות ועובר ברחובות, מעל גדרות ודרך גינות. הכדור המנצח מונח אחר כך לשנה שלמה
    על קברו של בן כפר שנפטר לאחרונה. זה החלק החשוב ביותר בכל העניין, וזה מה שמוציא אותו מספורט אל טקס.

    איש אינו יודע בדיוק בת כמה המסורת; בדרך כלל קושרים אותה לאימונים צבאיים מימי הביניים. מאז 2014 רשום
    לֶלוֹ בּוּרְטִי כמורשת תרבות בלתי מוחשית של גאורגיה.

    ב-364 הימים האחרים שוחותי היא כפר גוריאני רגיל: שיחי תה, מטעי אגוזי לוז, מרפסות עץ. שווה לעבור בו
    אם אתם ממילא בדרך — אבל אם אתם רוצים את המשחק, יש תאריך אחד, והוא פסחא אורתודוקסי.
  tip: >-
    ביום המשחק הקצו את כל אחר הצהריים. הכדור נע ברחובות ומרחק בטוח חשוב — זהו מגע מלא והצופים נסחפים גם
    הם. השאירו את הרכב מחוץ לכפר, כי הדרכים בפנים חסומות. אין למעשה שירותים או בתי קפה, אז הביאו מים ואוכל.
    בכל יום אחר הכפר שקט ושווה רק מעבר חולף.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה ללנצ׳חותי ומערבה בדרך הכפר — 305 ק״מ, כארבע שעות ושלושים
    וחמש. הכביש הראשי סלול לכל אורכו; עשרת הקילומטרים האחרונים הם דרך כפרית צרה, מרוצפת אך מלאת בורות.
    תדלוק בלנצ׳חותי. בפסחא החניה היא בעיה אמיתית, אז הגיעו מוקדם והשאירו את הרכב על הכביש הראשי. רכב חסכוני
    מספיק.
ar:
  name: شوخوتي ولعبة ليلو بورتي
  short: قريتان تتصارعان على كرة تزن خمسين كيلوغراماً مرة في السنة، يوم أحد الفصح.
  body: >-
    **مرة في السنة، في فصح الأرثوذكس، تتقاتل قريتان غوريتان على كرة — وهذا ليس عرضاً للزوار.** تقع زيمو
    وكفيمو شوخوتي جنباً إلى جنب في بلدية لانتشخوتي، يفصل بينهما نهر صغير. وهذا النهر هو المرمى عند الطرفين.

    وليلو بورتي مصارعة جماعية بلا مراكز ولا ملعب وبلا قواعد تقريباً. تُخاط الكرة يدوياً من الجلد وتُحشى
    بنشارة الخشب والتراب، ويبلغ وزنها خمسين كيلوغراماً. يباركها كاهن القرية ويلقيها في الوسط. بعدها يحاول
    فريقان — كل رجل واقف من كل قرية — حملها إلى نهرهم. ولا شيء غير ذلك: لا وقت محدد ولا عدد لاعبين ولا
    حدود.

    تدوم المباراة ثلاث إلى خمس ساعات وتنتقل في الشوارع وفوق الأسيجة وعبر الحدائق. ثم تُوضع الكرة الفائزة
    سنة كاملة على قبر أحد أبناء القرية ممن توفوا حديثاً. وهذا أهم ما في الأمر كله، وهو ما ينقله من رياضة
    إلى طقس.

    ولا أحد يعرف بالضبط عمر هذا التقليد؛ ويُربط عادة بتدريبات عسكرية من العصور الوسطى. ومنذ 2014 أُدرجت
    ليلو بورتي ضمن التراث الثقافي غير المادي لجورجيا.

    وفي الأيام الأربعة والستين والثلاثمئة الباقية، شوخوتي قرية غورية عادية: شجيرات شاي وبساتين بندق وشرفات
    خشبية. تستحق المرور إن كنت في الطريق، أما إن أردت المباراة فالتاريخ واحد وهو فصح الأرثوذكس.
  tip: >-
    يوم المباراة، احسب فترة بعد الظهر كلها. تتحرك الكرة في الشوارع ومسافة الأمان مهمة؛ فهذا احتكاك كامل
    والمتفرجون ينجرفون فيه أيضاً. اترك السيارة خارج القرية، فالطرق في الداخل مغلقة. ولا توجد عملياً دورات
    مياه أو مقاهٍ، فاحمل الماء والطعام. وفي أي يوم آخر تكون القرية هادئة ولا تستحق أكثر من مرور عابر.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً إلى لانتشخوتي وغرباً على طريق القرية — 305 كم، نحو أربع
    ساعات وخمس وثلاثين دقيقة. الطريق الرئيسي معبّد كله؛ وآخر عشرة كيلومترات طريق قروي ضيق، معبّد لكنه
    كثير الحفر. الوقود في لانتشخوتي. ويوم الفصح يكون الوقوف مشكلة حقيقية، فاحضر مبكراً واترك السيارة على
    الطريق الرئيسي. وسيارة اقتصادية تكفي.
