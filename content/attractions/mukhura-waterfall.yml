ka:
  name: მუხურას ჩანჩქერი
  short: >-
    მოხდენილი, ორსაფეხურიანი ჩანჩქერი ღია ფერის კირქვის კლდეზე, სამთო ქალაქ ტყიბულის ზემოთ, ოკრიბის მთებში,
    თითქმის ათას მეტრზე.
  body: >-
    **ნახშირის ქალაქ ტყიბულის ზემოთ ტყიდან ღია ფერის კირქვის კედელი აღმართულა და მასზე, ორ გრძელ თეთრ
    საფეხურად, მუხურას ჩანჩქერი ეშვება.**


    გზა ტყიბულიდან სოფელ მუხურისკენ ოკრიბის მთებში ადის; ჩანჩქერი ქალაქიდან დაახლოებით ხუთ-ექვს კილომეტრზე,
    ზღვის დონიდან დაახლოებით 975 მეტრზე მდებარეობს. მისი სიმაღლე არსად გამოქვეყნებულა — გზას ადგილობრივებს
    ჰკითხეთ. იქ წყლის ვიწრო, ორსაფეხურიანი ზოლი დაგხვდებათ: ზედა ნაკადი მაღლა, ხეებს შორის ჩანს, ქვედა
    კი ნაცრისფერ კირქვაში ჩაჭრილ, ჟანგისფრად შეღებილ ღარში სრიალებს; ორივე მხრიდან ტყე აწვება.


    მგზავრობას წონას ქალაქი სძენს, რომელსაც გზად გაივლით. ტყიბულში ქვანახშირს 1846 წლიდან მოიპოვებენ,
    ქალაქის სტატუსი 1939 წელს მიიღო, საბჭოთა აღმავლობის ხანაში კი აქ 20 ათასზე მეტი ადამიანი ცხოვრობდა.
    1990-იან წლებში მაღაროები თითქმის გაჩერდა, 2008 წელს მოპოვება განახლდა, 2018 წლის სასიკვდილო უბედური
    შემთხვევების შემდეგ კი სამუშაოები დროებით შეაჩერეს. ქალაქის ახლოს ტყიბულის წყალსაცავია — ამ დღის ბუნებრივი
    მეწყვილე.


    კლდის ძირას ციფრი არც დაგჭირდებათ: ნახშირის ქალაქიდან ტყიან მთებში ამავალი გზა ნაცრისფერ ქვაზე ჩამომავალ
    თეთრ წყალთან მიგიყვანთ.
  tip: >-
    მანიშნებლები შეიძლება არ დაგხვდეთ, ამიტომ გზა ტყიბულში ან მუხურაში იკითხეთ. შესვლა უფასოა, ინფრასტრუქტურა
    არ არის. ტყიბულის შემდეგ არც საწვავია და არც მომსახურება — ავზი, წყალი და საჭმელი ქალაქშივე შეავსეთ.
    ფეხით მცირე მონაკვეთის გავლა მოგიწევთ: ლანჩიანი ფეხსაცმელი ჩაიცვით, წვიმის შემდეგ ფერდობი მოლიპულია.
    საუკეთესო პერიოდი მაისიდან ოქტომბრამდეა; წყალი ჩვეულებრივ გაზაფხულზე უხვია. დღე ტყიბულის წყალსაცავთან
    ერთად დაგეგმეთ; თუ ქუთაისის გავლით დაბრუნდებით, იმ გზაზე მოწამეთა და გელათიც გხვდებათ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით გორის, ხაშურისა და ზესტაფონის გავლით დაახლოებით 190 კილომეტრი იარეთ
    თერჯოლის გადასახვევამდე, იქიდან შ19 გზით ჩრდილოეთით, თერჯოლის გავლით, დაახლოებით 30 კილომეტრი ტყიბულამდე.
    ტყიბულიდან მუხურისკენ მიმავალ გზას დაახლოებით 6 კილომეტრი გაჰყევით. სულ დაახლოებით 232 კილომეტრი და
    3 საათი და 35 წუთი. ტყიბულამდე ასფალტია, შემდგომი მეორეხარისხოვანი მთის გზის საფარი კი დადასტურებული
    არ არის და შეიძლება ხრეშიანი ან დაზიანებული იყოს — ამიტომ რეკომენდებულია მაღალი გამავლობის მანქანა.
en:
  name: Mukhura Waterfall
  short: >-
    A slender two-tier waterfall on a pale limestone cliff above the mining town of Tkibuli, in the Okriba
    hills at almost 1,000 metres.
  body: >-
    **Above the coal town of Tkibuli a pale limestone wall rises out of the forest, and down it, in two
    long white drops, falls Mukhura Waterfall.**


    The road climbs from Tkibuli towards the village of Mukhura into the Okriba hills; the fall lies some
    five or six kilometres out of town, at around 975 metres. Its height has never been published; ask
    the way locally. What waits there is a slender ribbon of water in two tiers: the upper one high among
    the trees, the lower sliding down a rust-stained notch in grey limestone, with forest pressing in
    on both sides.


    The town you pass through gives the trip its weight. Coal has been mined at Tkibuli since 1846; it
    became a city in 1939 and at its Soviet peak was home to more than 20,000 people. In the 1990s the
    mines almost stopped; production resumed in 2008, and a series of fatal accidents in 2018 halted work
    for a time. The Tkibuli Reservoir, close to town, makes the natural partner for the day.


    At the foot of the cliff you will not need a number: the road from a coal town into wooded hills leads
    to white water on grey stone.
  tip: >-
    There may be no signposts, so ask the way in Tkibuli or Mukhura. Entry is free and there are no facilities.
    There is no fuel or service beyond Tkibuli — fill the tank and stock up on water and food in town.
    Expect a short walk: wear shoes with grip, as the slope is slippery after rain. May to October is
    the best window, and the flow is usually strongest in spring. Pair it with the Tkibuli Reservoir;
    if you return via Kutaisi, Motsameta and Gelati lie on that road.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori, Khashuri and Zestaponi for about 190 km to the Terjola
    turn, then the Sh19 north through Terjola to Tkibuli, about 30 km. From Tkibuli follow the road towards
    Mukhura for about 6 km. In all, about 232 km and 3 hours 35 minutes. It is paved as far as Tkibuli;
    the surface of the secondary mountain road beyond is unconfirmed and may be gravel or broken, so an
    SUV is recommended.
ru:
  name: Водопад Мухура
  short: >-
    Тонкий двухступенчатый водопад на светлом известняковом обрыве над шахтёрским Ткибули, в холмах Окрибы,
    почти на 1000 метрах над морем.
  body: >-
    **Над угольным Ткибули из леса поднимается светлая известняковая стена, и по ней двумя длинными белыми
    ступенями падает водопад Мухура.**


    Дорога поднимается из Ткибули к селу Мухура, в холмы Окрибы; водопад находится километрах в пяти-шести
    от города, на высоте около 975 метров над уровнем моря. Высота водопада нигде не опубликована, а дорогу
    лучше спросить у местных. Там вас ждёт узкая лента воды в две ступени: верхняя — высоко среди деревьев,
    нижняя скользит по ржавому желобу в сером известняке, и с обеих сторон вплотную подступает лес.


    Вес поездке придаёт город, через который вы проезжаете. Уголь в Ткибули добывают с 1846 года; статус
    города он получил в 1939-м, а на советском пике здесь жили более 20 000 человек. В 1990-е шахты почти
    остановились; добыча возобновилась в 2008 году, а после серии смертельных аварий в 2018-м работы на
    время прекратили. Ткибульское водохранилище рядом с городом — естественная пара для этого дня.


    Цифра у подножия обрыва вам не понадобится: дорога из угольного города в лесистые холмы приводит к
    белой воде на сером камне.
  tip: >-
    Указателей может не быть, поэтому спрашивайте дорогу в Ткибули или Мухуре. Вход свободный, инфраструктуры
    нет. За Ткибули нет ни заправок, ни какого-либо сервиса — залейте полный бак и запаситесь водой и
    едой в городе. Рассчитывайте на короткую прогулку: наденьте обувь с цепкой подошвой, после дождя склон
    скользкий. Лучшее время — с мая по октябрь, а полноводнее всего водопад обычно весной. Совместите
    поездку с Ткибульским водохранилищем; если возвращаться через Кутаиси, по этой дороге будут Моцамета
    и Гелати.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Гори, Хашури и Зестафони около 190 км до поворота
    на Терджолу, затем по Sh19 на север через Терджолу до Ткибули — ещё около 30 км. От Ткибули около
    6 км по дороге в сторону Мухуры. Всего около 232 км и 3 часа 35 минут. До Ткибули асфальт; покрытие
    второстепенной горной дороги дальше не подтверждено — возможен гравий или разбитый асфальт, поэтому
    рекомендуется кроссовер или внедорожник.
fa:
  name: آبشار موخورا
  short: >-
    آبشاری باریک و دوطبقه بر صخرهٔ آهکیِ روشن، بالای شهر معدنی تکیبولی، در تپه‌های اوکریبا و در ارتفاع
    نزدیک به ۱۰۰۰ متر.
  body: >-
    **بالای شهر زغال‌سنگیِ تکیبولی دیواری آهکی و روشن از دل جنگل سر برمی‌آورد، و آبشار موخورا در دو ریزش
    بلند و سپید از آن فرو می‌ریزد.**


    جاده از تکیبولی به سوی روستای موخورا در تپه‌های اوکریبا بالا می‌رود؛ آبشار حدود پنج یا شش کیلومتر
    بیرون از شهر، در ارتفاع حدود ۹۷۵ متری از سطح دریا قرار دارد. بلندی آبشار هیچ‌جا منتشر نشده است؛ راه
    را از اهالی بپرسید. آنجا نواری باریک از آب در دو طبقه در انتظار شماست: طبقهٔ بالا در میان درختان،
    و طبقهٔ پایین که در شیاری زنگ‌گرفته در دل سنگ آهک خاکستری فرو می‌لغزد، و جنگل از دو سو تنگ در برش
    گرفته است.


    شهری که از آن می‌گذرید به این سفر وزن می‌دهد. در تکیبولی از سال ۱۸۴۶ زغال‌سنگ استخراج می‌شود؛ این
    شهر در سال ۱۹۳۹ عنوان شهر گرفت و در اوج دوران شوروی بیش از ۲۰٬۰۰۰ نفر در آن می‌زیستند. در دههٔ ۱۹۹۰
    معادن تقریباً از کار افتادند؛ استخراج در سال ۲۰۰۸ از سر گرفته شد و در پی رشته‌ای از حوادث مرگبار در
    سال ۲۰۱۸، کار برای مدتی متوقف شد. مخزن سد تکیبولی، نزدیک شهر، همراه طبیعی این روز است.


    پای صخره به هیچ عددی نیاز نخواهید داشت: راهی که از شهری زغالی به دل تپه‌های جنگلی می‌رود، به آبی سپید
    بر سنگی خاکستری می‌رسد.
  tip: >-
    ممکن است تابلوی راهنمایی در کار نباشد، پس راه را در تکیبولی یا موخورا بپرسید. ورود رایگان است و هیچ
    امکاناتی وجود ندارد. پس از تکیبولی نه پمپ‌بنزینی هست و نه خدماتی — در شهر باک را پر کنید و آب و غذا
    بردارید. منتظر پیاده‌روی کوتاهی باشید: کفشی با کف چسبنده بپوشید، چون شیب پس از باران لغزنده است. بهترین
    زمان از ماه مه تا اکتبر است و آب آبشار معمولاً در بهار از همیشه پرتر است. دیدار را با مخزن سد تکیبولی
    همراه کنید؛ اگر از راه کوتایسی برگردید، موتسامتا و گلاتی سر همان راه‌اند.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب و از کنار گوری، خاشوری و زستافونی حدود ۱۹۰ کیلومتر تا دوراهی ترجولا
    بروید، سپس از جادهٔ Sh19 به سمت شمال و از راه ترجولا تا تکیبولی، حدود ۳۰ کیلومتر. از تکیبولی جاده‌ای
    را که به سوی موخورا می‌رود حدود ۶ کیلومتر دنبال کنید. روی‌هم حدود ۲۳۲ کیلومتر و ۳ ساعت و ۳۵ دقیقه.
    تا تکیبولی آسفالت است؛ وضعیت رویهٔ جادهٔ فرعی کوهستانی پس از آن تأیید نشده و ممکن است شنی یا خراب
    باشد، از این رو خودروی شاسی‌بلند توصیه می‌شود.
he:
  name: מפל מוחורה
  short: מפל דק בן שתי מדרגות על מצוק גיר בהיר, מעל עיירת הכרייה טקיבולי, בגבעות אוקריבה, בגובה של כמעט
    1,000 מטר.
  body: >-
    **מעל עיירת הפחם טקיבולי מתרומם מן היער קיר גיר בהיר, ובמורדו, בשתי צניחות ארוכות ולבנות, נופל מפל
    מוחורה.**


    הכביש מטפס מטקיבולי לכיוון הכפר מוחורה, אל גבעות אוקריבה; המפל נמצא כחמישה-שישה קילומטרים מחוץ לעיר,
    בגובה של כ-975 מטר מעל פני הים. גובה המפל לא פורסם בשום מקום; את הדרך כדאי לשאול אצל המקומיים. שם
    מחכה לכם סרט מים צר בשתי מדרגות: העליונה גבוה בין העצים, והתחתונה מחליקה בתעלה חלודת-גוון החצובה בגיר
    האפור, והיער צמוד אליו משני הצדדים.


    העיר שאתם עוברים בה היא שמעניקה לטיול את משקלו. בטקיבולי כורים פחם מאז 1846; היא קיבלה מעמד של עיר
    ב-1939, ובשיאה בתקופה הסובייטית חיו בה יותר מ-20,000 איש. בשנות ה-1990 כמעט נעצרו המכרות; הכרייה חודשה
    ב-2008, וסדרת תאונות קטלניות ב-2018 השביתה את העבודה לזמן מה. מאגר טקיבולי, הסמוך לעיר, הוא השותף
    הטבעי ליום הזה.


    למרגלות המצוק לא תזדקקו למספר: הדרך מעיר פחם אל גבעות מיוערות מובילה אל מים לבנים על אבן אפורה.
  tip: >-
    ייתכן שאין שילוט, לכן שאלו את הדרך בטקיבולי או במוחורה. הכניסה חופשית ואין מתקנים. אחרי טקיבולי אין
    דלק ואין שום שירות — מלאו את המיכל והצטיידו במים ובאוכל בעיר. צפו להליכה קצרה: נעלו נעליים עם אחיזה
    טובה, כי המדרון חלקלק אחרי גשם. החלון הטוב ביותר הוא מאי עד אוקטובר, והזרימה חזקה בדרך כלל באביב.
    שלבו את הביקור עם מאגר טקיבולי; אם תחזרו דרך קותאיסי, מוצמטה וגלאתי נמצאים על אותה דרך.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי, חשורי וזסטפוני כ-190 ק"מ עד הפנייה לטרג'ולה, ואז בכביש
    Sh19 צפונה דרך טרג'ולה עד טקיבולי, כ-30 ק"מ. מטקיבולי סעו כ-6 ק"מ בדרך לכיוון מוחורה. בסך הכול כ-232
    ק"מ ו-3 שעות ו-35 דקות. הכביש סלול עד טקיבולי; מצב הדרך ההררית המשנית שאחריה לא אושר, וייתכן שהיא
    דרך חצץ או כביש משובש, לכן מומלץ רכב שטח.
ar:
  name: شلال موخورا
  short: شلال رشيق من طبقتين على جرف كلسي فاتح فوق بلدة تكيبولي المنجمية، في تلال أوكريبا على ارتفاع يقارب
    1000 متر.
  body: >-
    **فوق بلدة الفحم تكيبولي يرتفع من الغابة جدار كلسي فاتح، وعليه ينحدر شلال موخورا في دفقتين بيضاوين
    طويلتين.**


    يصعد الطريق من تكيبولي نحو قرية موخورا في تلال أوكريبا؛ ويقع الشلال على بعد خمسة أو ستة كيلومترات
    من البلدة، على ارتفاع نحو 975 مترًا فوق سطح البحر. لم يُنشر ارتفاع الشلال في أي مكان، فاسأل السكان
    عن الطريق. وهناك ينتظرك شريط رفيع من الماء على طبقتين: العليا عاليًا بين الأشجار، والسفلى تنزلق في
    مجرى صدئ اللون محفور في الحجر الكلسي الرمادي، والغابة تحفّ به من الجانبين.


    البلدة التي تمرّ بها هي ما يمنح الرحلة ثقلها. يُستخرج الفحم في تكيبولي منذ عام 1846، ونالت صفة المدينة
    عام 1939، وفي ذروتها السوفيتية كان يسكنها أكثر من 20,000 نسمة. وفي تسعينيات القرن العشرين كادت المناجم
    تتوقف؛ ثم استؤنف الإنتاج عام 2008، وأوقفت سلسلة من الحوادث المميتة عام 2018 العمل لفترة. ويُعدّ خزان
    تكيبولي القريب من البلدة الرفيق الطبيعي لهذا اليوم.


    لن تحتاج عند سفح الجرف إلى أي رقم: فالطريق من مدينة الفحم إلى التلال المكسوّة بالغابات يقودك إلى ماء
    أبيض على حجر رمادي.
  tip: >-
    قد لا تجد لافتات، فاسأل عن الطريق في تكيبولي أو موخورا. الدخول مجاني ولا توجد أي مرافق. لا وقود ولا
    خدمات بعد تكيبولي، فاملأ الخزان وتزوّد بالماء والطعام في البلدة. توقّع مشيًا قصيرًا: ارتدِ حذاءً مانعًا
    للانزلاق، فالمنحدر زلق بعد المطر. أفضل فترة من مايو إلى أكتوبر، وعادة ما يبلغ التدفق ذروته في الربيع.
    اجمع الزيارة مع خزان تكيبولي؛ وإن عدت عبر كوتايسي فستجد موتسامتا وغيلاتي على ذلك الطريق.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وخاشوري وزيستافوني لمسافة 190 كم تقريبًا حتى منعطف
    تيرجولا، ثم الطريق Sh19 شمالًا عبر تيرجولا إلى تكيبولي، نحو 30 كم. ومن تكيبولي اتبع الطريق المتجه
    إلى موخورا نحو 6 كم. المسافة الإجمالية نحو 232 كم و3 ساعات و35 دقيقة. الطريق معبّد حتى تكيبولي؛ أما
    حالة الطريق الجبلي الثانوي بعدها فغير مؤكدة، وقد يكون حصويًا أو متهالكًا، لذا يُنصح بسيارة دفع رباعي.
