ka:
  name: გორიჯვარი
  short: >-
    წმინდა გიორგის აღდგენილი ეკლესია გორის თავზე, ძველი გალავნის ნაშთებით და გორისა და მტკვრის ყველაზე
    ცნობილი ხედით.
  body: >-
    **ყოველ ქალაქს აქვს ბორცვი, საიდანაც ის ბოლოს და ბოლოს გასაგები ხდება; გორისთვის ეს ბორცვი გორიჯვარია.**


    მწვერვალიდან ქალაქი ჩრდილოეთით ხელისგულივით იშლება: ციხე თავის გორაზე, ირგვლივ სახურავები, ფერდობის
    ძირას კი, თითქმის ფეხქვეშ, მტკვარი მიედინება. ზურგს უკან, სამხრეთით, ცას თრიალეთის ტყიანი ქედები ავსებს.


    ეკლესია სიძველეს არ იჩემებს. წმინდა გიორგის სახელობის უბრალო ნაგებობა XX საუკუნეშია აგებული ადრეული
    შუა საუკუნეების დარბაზული ეკლესიის ადგილზე: თაღოვანი კარი და სარკმლები, გვერდით კი სამრეკლო, რომლის
    მეორე სართული ოთხივე მხრიდან თაღებითაა გახსნილი. თარიღზე წყაროები ერთმანეთს არ ეთანხმება — ერთი აღდგენას
    1920 წლის გორის მიწისძვრის შემდგომ ხანას მიაკუთვნებს, მეორე 1980-იან წლებს. ერთი ცნობით, მანამდეც
    ეკლესია ოსმალ დამპყრობლებს დაუწვავთ, ხელახლა აუგიათ, მიწისძვრამ კი ისევ დაანგრია.


    ბორცვზე ყველაზე ხნიერი თავად ეკლესია კი არა, მისი გარემოცვაა: ორმაგი გალავანი, რომელსაც VII საუკუნით
    ათარიღებენ. კედელი ფერდობის რელიეფს მიუყვება და კონტრფორსებითაა გამაგრებული. დღეს ძლიერ დაზიანებულია,
    მაგრამ მის ხაზს თუ გაუყვებით, მიხვდებით: ეს მწვერვალი ხალხმა თავდაცვისთვის აირჩია ბევრად ადრე, ვიდრე
    ვინმე აქ ხედის საყურებლად ამოვიდოდა.


    ამოდით მზის ჩასვლის წინ, როცა დაბალი სხივი მდინარის გაღმა ციხის კედლებს ეფინება, ქვემოთ კი ქალაქი
    ქუჩა-ქუჩა ინთება.
  tip: >-
    შესვლა უფასოა, ბორცვზე ამოსვლა ნებისმიერ დროს შეიძლება, თავად ეკლესია კი წირვის გარეშე შესაძლოა დაკეტილი
    დაგხვდეთ. ტაძარში შესვლისას მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი გამოადგებათ.
    მწვერვალზე არაფერია — არც კაფე, არც საპირფარეშო, არც ჩრდილი, — ამიტომ წყალი თან იქონიეთ, საჭმელი კი
    ოთხი კილომეტრით დაშორებულ გორში იყიდეთ. ნახევარი საათი საკმარისია; ზამთარში ქარი აქ ცივი და მძაფრია.
    გორის ციხესა და ისტორიულ-ეთნოგრაფიულ მუზეუმთან ერთად აუჩქარებელი ნახევარი დღე გამოვა — გორიჯვარი კი
    დღის ბოლო საათისთვის შემოინახეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთისკენ გაჰყევით და დაახლოებით ერთ საათში გორის გასასვლელზე გადაუხვიეთ.
    მისასვლელი გზით ქალაქის ცენტრში შედით და მტკვარზე სადგურის დასახლებაში, მდინარის მარჯვენა ნაპირზე
    გადადით. იქიდან გორიჯვრის ქუჩა (ადგილობრივი შ29) დასავლეთით, სოფელ დიდი გორიჯვრისკენ მიდის, მოკლე
    აღმართი კი პირდაპირ ეკლესიამდე ადის — ქალაქის ცენტრიდან დაახლოებით 4 კილომეტრში. სულ დაახლოებით 90
    კმ და 1 საათი და 15 წუთია. გზა თითქმის ბოლომდე მოასფალტებულია; ბოლო აღმართი ვიწროვდება და შესაძლოა
    ნაწილობრივ გრუნტიანი იყოს, თუმცა მშრალ ამინდში ეკონომკლასის მანქანაც უპრობლემოდ ამოდის. საწვავი და
    საჭმელი — გორში.
en:
  name: Gorijvari Church
  short: >-
    A rebuilt church of St George on the hill above Gori, ringed by a broken ancient wall, with Gori's
    best-known view over the town and the Mtkvari.
  body: >-
    **Every town has a hill from which it finally makes sense; for Gori, that hill is Gorijvari.**


    From the top the town spreads out to the north: the fortress on its knoll, the roofs around it and,
    almost directly below, the Mtkvari sliding past. Behind you, to the south, the wooded ridges of the
    Trialeti range fill the horizon.


    The church does not pretend to be old. It is a plain church dedicated to St George, raised in the
    20th century on the footprint of an early medieval hall church, with arched doors and windows and
    a bell tower whose upper storey opens in arches on all four sides. Accounts disagree on the date:
    one places the rebuilding soon after the Gori earthquake of 1920, which ruined the earlier church,
    another as late as the 1980s. One account adds an older chapter, in which Ottoman invaders burned
    the church, it was rebuilt, and the earthquake brought it down again.


    The oldest thing on the hill is not the church but what surrounds it: a double defensive wall, attributed
    to the 7th century, stepping down with the slope and propped by buttresses. It is badly broken now,
    yet walk its line and you understand that people chose this summit for safety long before anyone climbed
    it for the view.


    Come up shortly before sunset, when the low light catches the fortress walls across the river and
    the town below switches on, street by street.
  tip: >-
    Entry is free and the hilltop is open at any hour, though the church itself may be locked outside
    services. If you go inside, cover shoulders and knees; women will want a headscarf. There is nothing
    at the top — no café, toilets or shade — so bring water and buy food in Gori, four kilometres away.
    Half an hour is enough, and in winter the wind up here is sharp and cold. With Gori Fortress and the
    Historical and Ethnographic Museum it makes an unhurried half-day in town; save Gorijvari for the
    last hour of daylight.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi and leave at the Gori exit, about an hour out. Follow
    the access road into the centre, then cross the Mtkvari to the railway-station district on the river's
    south bank. From there Gorijvari Street (the local Sh29) runs west towards Didi Gorijvari village,
    and a short climb brings you to the church, about 4 km from the town centre. Total: roughly 90 km
    and 1 hour 15 minutes. The road is paved almost all the way; the final climb narrows and may be partly
    unpaved, but an economy car manages easily in dry weather. Fuel and food in Gori.
ru:
  name: Церковь Гориджвари
  short: >-
    Отстроенная церковь Святого Георгия на холме над Гори, в кольце разрушенной древней стены, — самая
    известная в Гори панорама города и Мтквари.
  body: >-
    **У каждого города есть холм, с которого он наконец становится понятен; для Гори это Гориджвари.**


    С вершины город раскрывается на север: крепость на своём холме, крыши вокруг неё и почти прямо внизу
    — неторопливо скользящая Мтквари (Кура). За спиной, на юге, горизонт заполняют лесистые гряды Триалетского
    хребта.


    Церковь не притворяется древней. Это простая церковь во имя Святого Георгия, возведённая в XX веке
    на месте раннесредневековой зальной церкви, с арочными дверями и окнами и колокольней, верхний ярус
    которой открыт арками на все четыре стороны. О дате источники спорят: по одной версии, церковь отстроили
    вскоре после горийского землетрясения 1920 года, разрушившего прежний храм, по другой — лишь в 1980-х.
    Ещё один рассказ добавляет более раннюю главу: османские захватчики сожгли церковь, её восстановили,
    а землетрясение снова её обрушило.


    Самое старое на холме — не церковь, а то, что её окружает: двойная оборонительная стена, которую относят
    к VII веку; она уступами спускается по склону и опирается на контрфорсы. Сейчас она сильно разрушена,
    но пройдите вдоль её линии — и станет ясно: люди выбрали эту вершину ради безопасности задолго до
    того, как кто-то стал подниматься сюда ради вида.


    Приходите незадолго до заката, когда низкое солнце ловит стены крепости за рекой, а город внизу зажигает
    огни, улица за улицей.
  tip: >-
    Вход свободный, на вершину можно подняться в любое время, хотя сама церковь вне служб бывает заперта.
    Если заходите внутрь, прикройте плечи и колени; женщинам пригодится платок. Наверху ничего нет — ни
    кафе, ни туалетов, ни тени, — так что возьмите воду, а еду купите в Гори, в четырёх километрах отсюда.
    Получаса хватит; зимой ветер здесь резкий и холодный. Вместе с Горийской крепостью и Историко-этнографическим
    музеем получаются неспешные полдня в городе; Гориджвари оставьте на последний час светового дня.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад до съезда на Гори — около часа пути. По подъездной
    дороге доезжайте до центра, затем переезжайте Мтквари в привокзальный район на южном берегу. Оттуда
    улица Гориджвари (местная дорога Sh29) идёт на запад к селу Диди-Гориджвари, и короткий подъём приводит
    к церкви, примерно в 4 км от центра города. Всего около 90 км и 1 час 15 минут. Дорога почти везде
    асфальтирована; последний подъём сужается и местами может быть грунтовым, но в сухую погоду машина
    эконом-класса справляется легко. Топливо и еда — в Гори.
fa:
  name: کلیسای گوریجواری
  short: >-
    کلیسای بازسازی‌شدهٔ گئورگیِ قدیس بر تپهٔ بالای گوری، در حلقهٔ دیواری کهن و فروریخته، با شناخته‌شده‌ترین
    چشم‌انداز گوری بر شهر و رود متکواری.
  body: >-
    **هر شهری تپه‌ای دارد که شهر از فرازش سرانجام معنا پیدا می‌کند؛ برای گوری، آن تپه گوریجواری است.**


    از بالا شهر به سوی شمال گسترده می‌شود: دژ بر پشته‌اش، بام‌های پیرامون آن و، تقریباً درست زیر پا، رود
    متکواری که آرام می‌لغزد و می‌گذرد. پشت سر، در جنوب، رشته‌های جنگلیِ کوه‌های تریالتی افق را پر کرده‌اند.


    کلیسا ادعای کهن بودن ندارد. بنایی ساده است به نام گئورگیِ قدیس، که در سدهٔ بیستم بر جای کلیسایی تالاری
    از آغاز سده‌های میانه برپا شده؛ با درها و پنجره‌های طاق‌دار و برج ناقوسی که طبقهٔ بالایش از هر چهار
    سو با طاق‌نماها گشوده است. روایت‌ها دربارهٔ تاریخ آن هم‌داستان نیستند: یکی بازسازی را کمی پس از زمین‌لرزهٔ
    ۱۹۲۰ گوری می‌داند که کلیسای پیشین را ویران کرد، دیگری آن را تا دههٔ ۱۹۸۰ عقب می‌برد. روایتی دیگر فصلی
    کهن‌تر می‌افزاید: مهاجمان عثمانی کلیسا را سوزاندند، از نو ساخته شد و زمین‌لرزه دوباره فرویش ریخت.


    کهن‌ترین چیز روی تپه نه کلیسا، که آن چیزی است که گرداگردش را گرفته: دیواری دفاعی و دولایه که آن را
    به سدهٔ هفتم نسبت می‌دهند، پله‌پله با شیب پایین می‌رود و پشت‌بندها نگهش داشته‌اند. اکنون سخت فروریخته
    است، اما اگر در امتداد آن قدم بزنید، درمی‌یابید که مردم این قله را برای امنیت برگزیدند، بسیار پیش
    از آن‌که کسی برای تماشا از آن بالا برود.


    کمی پیش از غروب بیایید، وقتی نور کم‌ارتفاع بر دیوارهای دژ آن سوی رود می‌افتد و شهرِ پایین، خیابان
    به خیابان، چراغ‌هایش را روشن می‌کند.
  tip: >-
    ورود رایگان است و بالای تپه در هر ساعتی باز است، هرچند خود کلیسا بیرون از زمان مراسم ممکن است بسته
    باشد. اگر به درون می‌روید، شانه‌ها و زانوها را بپوشانید؛ بانوان بهتر است روسری همراه داشته باشند.
    آن بالا هیچ نیست — نه کافه، نه سرویس بهداشتی، نه سایه — پس آب بیاورید و خوراک را از گوری، در چهار
    کیلومتری، بخرید. نیم ساعت کافی است و در زمستان باد این بالا تند و سرد است. همراه با دژ گوری و موزهٔ
    تاریخ و مردم‌شناسی، نیم‌روزی بی‌شتاب در شهر می‌سازد؛ گوریجواری را برای آخرین ساعت روشنایی روز نگه
    دارید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی غرب بروید و حدود یک ساعت بعد از خروجی گوری بیرون بیایید. جادهٔ
    دسترسی را تا مرکز شهر بروید، سپس از رود متکواری بگذرید و به محلهٔ ایستگاه راه‌آهن در کرانهٔ جنوبی
    رود برسید. از آن‌جا خیابان گوریجواری (جادهٔ محلی Sh29) به سوی غرب و روستای دیدی گوریجواری می‌رود و
    سربالایی کوتاهی شما را به کلیسا می‌رساند، حدود ۴ کیلومتر از مرکز شهر. روی‌هم حدود ۹۰ کیلومتر و یک
    ساعت و ۱۵ دقیقه. جاده تقریباً سراسر آسفالت است؛ سربالایی پایانی باریک‌تر می‌شود و شاید بخشی از آن
    خاکی باشد، اما در هوای خشک خودروی اقتصادی به‌آسانی از پسش برمی‌آید. سوخت و غذا در گوری.
he:
  name: כנסיית גוריג'וורי
  short: >-
    כנסייה משוחזרת של גאורגיוס הקדוש על הגבעה שמעל גורי, מוקפת חומה עתיקה ושבורה — התצפית המוכרת ביותר
    של גורי על העיר ועל נהר המטקווארי.
  body: >-
    **לכל עיר יש גבעה שממנה היא סוף-סוף מתבהרת; לגורי, הגבעה הזו היא גוריג'וורי.**


    מן הפסגה נפרשת העיר צפונה: המבצר על גבעתו, הגגות סביבו, וכמעט ישירות למטה — המטקווארי הזורם לאטו.
    מאחוריכם, בדרום, ממלאות את האופק השלוחות המיוערות של רכס טריאלטי.


    הכנסייה אינה מתיימרת להיות עתיקה. זהו מבנה פשוט המוקדש לגאורגיוס הקדוש, שהוקם במאה ה-20 במקומה של
    כנסיית אולם מימי הביניים המוקדמים, עם דלתות וחלונות מקושתים ומגדל פעמונים שקומתו העליונה נפתחת בקשתות
    לכל ארבעת הכיוונים. המקורות חלוקים בשאלת התאריך: לפי אחד, הכנסייה נבנתה מחדש זמן קצר אחרי רעידת האדמה
    של גורי ב-1920, שהרסה את הכנסייה הקודמת; לפי אחר, רק בשנות ה-80. מקור נוסף מוסיף פרק קדום יותר: פולשים
    עות'מאנים שרפו את הכנסייה, היא נבנתה מחדש, ורעידת האדמה הפילה אותה שוב.


    הדבר העתיק ביותר על הגבעה אינו הכנסייה אלא מה שמקיף אותה: חומת מגן כפולה, המיוחסת למאה ה-7, היורדת
    במדרגות עם המדרון ונשענת על תמוכות. היא הרוסה מאוד היום, אבל לכו לאורך קווה ותבינו שאנשים בחרו בפסגה
    הזו לשם ביטחון הרבה לפני שמישהו טיפס אליה בשביל הנוף.


    בואו מעט לפני השקיעה, כשהאור הנמוך נתפס בחומות המבצר שמעבר לנהר, והעיר שלמטה נדלקת, רחוב אחר רחוב.
  tip: >-
    הכניסה חופשית ופסגת הגבעה פתוחה בכל שעה, אף שהכנסייה עצמה עשויה להיות נעולה מחוץ לשעות התפילה. אם
    אתם נכנסים, כסו כתפיים וברכיים; נשים יזדקקו למטפחת ראש. למעלה אין דבר — לא בית קפה, לא שירותים ולא
    צל — אז הביאו מים וקנו אוכל בגורי, ארבעה קילומטרים משם. חצי שעה מספיקה, ובחורף הרוח כאן חדה וקרה.
    יחד עם מבצר גורי והמוזיאון ההיסטורי-אתנוגרפי זה מצטרף לחצי יום נינוח בעיר; שמרו את גוריג'וורי לשעת
    האור האחרונה.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) וצאו במחלף גורי, כשעה נסיעה. המשיכו בכביש הגישה אל המרכז,
    ואז חצו את המטקווארי אל שכונת תחנת הרכבת, על הגדה הדרומית של הנהר. משם רחוב גוריג'וורי (הכביש המקומי
    Sh29) מוביל מערבה לכיוון הכפר דידי גוריג'וורי, ועלייה קצרה מביאה אתכם אל הכנסייה, כ-4 ק״מ ממרכז העיר.
    בסך הכול כ-90 ק״מ ושעה ורבע. הכביש סלול כמעט לכל אורכו; העלייה האחרונה נעשית צרה ועשויה להיות בחלקה
    לא סלולה, אבל במזג אוויר יבש רכב אקונומי עובר בקלות. דלק ואוכל בגורי.
ar:
  name: كنيسة غوريجفاري
  short: >-
    كنيسة للقديس جاورجيوس أعيد بناؤها على التلة المطلة على غوري، يطوّقها سور قديم متهدّم، ومنها أشهر إطلالة
    في غوري على المدينة ونهر متكفاري.
  body: >-
    **لكل مدينة تلّة تتّضح منها أخيراً؛ وتلّة غوري هي غوريجفاري.**


    من القمة تنبسط المدينة شمالاً: القلعة على ربوتها، والسطوح من حولها، وتحتك مباشرةً تقريباً نهر متكفاري
    ينساب على مهل. وخلفك، إلى الجنوب، تملأ الأفقَ الحيودُ المكسوّة بالغابات من سلسلة تريالتي.


    لا تدّعي الكنيسة القِدم. إنها مبنى بسيط مكرّس للقديس جاورجيوس، شُيّد في القرن العشرين في موضع كنيسة
    ذات قاعة واحدة من أوائل العصور الوسطى، بأبواب ونوافذ مقوّسة وبرج أجراس تنفتح طبقته العليا بأقواس على
    جهاته الأربع. وتختلف الروايات في التاريخ: إحداها تجعل إعادة البناء بُعيد زلزال غوري عام 1920 الذي
    دمّر الكنيسة السابقة، وأخرى تؤخّرها إلى ثمانينيات القرن العشرين. وتضيف رواية ثالثة فصلاً أقدم: أحرق
    الغزاة العثمانيون الكنيسة، فأعيد بناؤها، ثم أسقطها الزلزال من جديد.


    وأقدم ما على التلة ليس الكنيسة بل ما يحيط بها: سور دفاعي مزدوج يُنسب إلى القرن السابع، ينحدر مدرّجاً
    مع السفح وتسنده دعامات. هو اليوم متهدّم بشدة، لكن امشِ على امتداده وستفهم أن الناس اختاروا هذه القمة
    طلباً للأمان قبل أن يصعدها أحد من أجل المنظر بزمن طويل.


    تعالَ قبيل الغروب، حين يلامس الضوء المنخفض أسوار القلعة على الضفة الأخرى، وتضاء المدينة في الأسفل
    شارعاً بعد شارع.
  tip: >-
    الدخول مجاني وقمة التلة مفتوحة في كل ساعة، وإن كانت الكنيسة نفسها قد تُغلق خارج أوقات الصلوات. إن
    دخلت فاستر كتفيك وركبتيك؛ وستحتاج النساء إلى غطاء للرأس. لا شيء في الأعلى — لا مقهى ولا دورات مياه
    ولا ظل — فاحمل ماءً واشترِ طعامك في غوري على بعد أربعة كيلومترات. تكفي نصف ساعة، والريح هنا في الشتاء
    حادّة باردة. ومع قلعة غوري والمتحف التاريخي والإثنوغرافي تصبح الزيارة نصف يوم هادئاً في المدينة؛ واترك
    غوريجفاري للساعة الأخيرة من ضوء النهار.
  route: >-
    من تبليسي اسلك الطريق السريع S1 (E60) غرباً واخرج عند مخرج غوري، بعد نحو ساعة. اتبع طريق الدخول إلى
    الوسط، ثم اعبر نهر متكفاري إلى حيّ محطة القطار على الضفة الجنوبية. من هناك يمتد شارع غوريجفاري (الطريق
    المحلي Sh29) غرباً نحو قرية ديدي غوريجفاري، ويوصلك صعود قصير إلى الكنيسة، على بعد نحو 4 كم من وسط
    المدينة. المجموع نحو 90 كم وساعة وربع. الطريق معبّد على امتداده كله تقريباً؛ يضيق الصعود الأخير وقد
    يكون جزء منه غير معبّد، لكن السيارة الاقتصادية تجتازه بسهولة في الطقس الجاف. الوقود والطعام في غوري.
