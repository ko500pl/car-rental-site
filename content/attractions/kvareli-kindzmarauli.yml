ka:
  name: ყვარელი და ყინძმარაულის ზონა
  short: წითელი ღვინის მთავარი მიკროზონა კახეთში — გვირაბის მარნები, ყვარლის ტბა და საფუძველი რთველის
    მარშრუტისთვის.
  body: >-
    ყვარელი ალაზნის ველის ჩრდილოეთ კიდეზე, უშუალოდ კავკასიონის ფერდობებთანაა და სწორედ ეს განლაგება განსაზღვრავს
    მის ღვინოს. **ყინძმარაულის** დაცული მიკროზონა ქალაქის ირგვლივ ვრცელდება: აქ საფერავს კენჭნარიან, კარგად
    დრენირებულ ნიადაგზე ზრდიან და მისგან ნახევრადტკბილ წითელ ღვინოს აყენებენ, რომელიც საქართველოს ყველაზე
    ცნობილი ეტიკეტია. იმავე ზონაში იწარმოება მშრალი საფერავიც, რომელიც ბევრს უფრო საინტერესოდ მიაჩნია.


    ქალაქის მთავარი ატრაქციაა გვირაბის მარნები. საბჭოთა პერიოდში კლდეში გაჭრილი კილომეტრობით ტონელები
    დღეს ღვინის საცავად გამოიყენება: მუდმივი ტემპერატურა, ორივე მხარეს კედლებში ჩალაგებული ბოთლები და
    დეგუსტაციის დარბაზები. ექსკურსია ჩვეულებრივ საათნახევარს გრძელდება და დეგუსტაციასაც მოიცავს. გარდა
    დიდი საწარმოებისა, შემოგარენში ათობით საოჯახო მარანია, სადაც ქვევრის ღვინოს პირდაპირ მეპატრონე ასხამს.


    ღვინის გარდა ყვარელს ორი ტბა აქვს. ყვარლის ტბა ქალაქიდან ხუთ კილომეტრშია, ფერდობზე, სასტუმროთი, პლაჟითა
    და ხედით ალაზნის ველზე; მეორე, უფრო პატარა ილიას ტბა ცენტრთან ახლოსაა. ზაფხულში ორივე სავსეა, თუმცა
    შუადღის სიცხეში წყალთან ყოფნა ალბათ ყველაზე გონივრული გეგმაა. რთველი ჩვეულებრივ სექტემბრის მეორე ნახევრიდან
    ოქტომბრის შუა რიცხვებამდე გრძელდება და სწორედ მაშინაა ყვარელი ყველაზე ცოცხალი: სოფლებში ყურძენს ზიდავენ,
    მარნები ღიაა და თითქმის ყველგან შემოგთავაზებენ ჩართვას ხელით კრეფაში.
  tip: >-
    ყვარელი მარშრუტის ბოლო წერტილად და ღამის გასათევად ჯობია, ვიდრე გამვლელ გაჩერებად — დეგუსტაციის შემდეგ
    საჭესთან დაბრუნება არ ღირს. საქართველოში ალკოჰოლის ზღვარი ძალიან მკაცრია და პატრული ხშირად ამოწმებს;
    ან ღამე დარჩით, ან წინასწარ შეათანხმეთ, ვინ ატარებს. მარნებში ექსკურსია წინასწარი ჯავშნით სჯობს, განსაკუთრებით
    სექტემბერ-ოქტომბერში. ბანკომატი და მაღაზიები ცენტრშია, ტბასთან — მხოლოდ კაფეები.
  route: >-
    ორი ვარიანტია. გომბორის უღელტეხილით თელავზე და გრემზე — დაახლოებით 145 კმ და ორ საათ ნახევარზე ცოტა
    მეტი; ან კახეთის გზატკეცილით საგარეჯოს, გურჯაანისა და ახალსოფლის გავლით — მსგავსი მანძილი, ბრტყელი
    და ზამთარშიც საიმედო. ორივე მარშრუტი ბოლომდე ასფალტიანია და ეკონომ კლასის მანქანა სავსებით საკმარისია.
    საწვავს ავსებთ თელავში, გურჯაანში ან თავად ყვარელში. ტბამდე ბოლო ხუთი კილომეტრი მოასფალტებული აღმართია.
en:
  name: Kvareli and the Kindzmarauli zone
  short: >-
    Kakheti's main red-wine microzone — tunnel cellars cut into rock, two lakes and a natural base for
    a harvest trip.
  body: >-
    Kvareli sits at the northern edge of the Alazani Valley, right against the slopes of the Caucasus,
    and that position defines its wine. The protected **Kindzmarauli** microzone spreads around the town:
    Saperavi grown here on stony, well-drained soil goes into the semi-sweet red that is Georgia's single
    most recognised label abroad. The same zone also produces dry Saperavi, which many visitors end up
    finding more interesting than the sweet version.


    The town's headline attraction is its tunnel cellars. Kilometres of galleries cut into the rock in
    the Soviet period now serve as wine storage: a constant temperature year-round, bottles racked into
    the walls on both sides, and tasting halls at the far end. A tour usually runs about an hour and a
    half and includes tasting. Beyond the large producers, the surrounding villages hold dozens of family
    cellars where the owner pours qvevri wine straight from his own vessels.


    Kvareli also has two lakes. Kvareli Lake lies five kilometres above the town on the slope, with a
    hotel, a beach and a view across the whole valley; the smaller Ilia Lake is close to the centre. Both
    fill up in summer, though on a hot Kakhetian afternoon spending time beside water is probably the
    most sensible plan available.
  tip: >-
    Treat Kvareli as an overnight stop rather than a drive-through — getting back behind the wheel after
    a tasting is not worth it. Georgia's drink-driving limit is very strict and roadside checks are common,
    so either stay the night or agree on a designated driver in advance. Book cellar tours ahead, especially
    in September and October during the harvest. ATMs and shops are in the centre; at the lake there are
    only cafés and hotel restaurants.
  route: >-
    Two options. Over the Gombori Pass via Telavi and Gremi is about 145 km and a little over two and
    a half hours. Alternatively take the Kakheti Highway through Sagarejo, Gurjaani and Akhalsopeli —
    a similar distance, flat and reliable in winter when the pass may close. Both are asphalt end to end
    and an economy car is entirely sufficient. Fuel is available in Telavi, Gurjaani and Kvareli itself.
    The final five kilometres up to the lake are a paved but steady climb.
ru:
  name: Кварели и зона Киндзмараули
  short: 'Главная красная микрозона Кахетии: тоннельные винные погреба, два озера и удобная база для поездки
    на ртвели.'
  body: >-
    Кварели стоит у северного края Алазанской долины, вплотную к склонам Кавказа, и именно это положение
    определяет его вино. Защищённая микрозона **Киндзмараули** охватывает окрестности города: саперави,
    выращенный здесь на каменистых, хорошо дренированных почвах, идёт на полусладкое красное — самую узнаваемую
    грузинскую этикетку за рубежом. В той же зоне делают и сухое саперави, которое многим в итоге кажется
    интереснее сладкой версии.


    Главная достопримечательность города — тоннельные погреба. Километры галерей, прорубленных в скале
    в советское время, сегодня служат винохранилищем: постоянная температура круглый год, бутылки в стенных
    нишах по обе стороны и дегустационные залы в глубине. Экскурсия обычно занимает около полутора часов
    и включает дегустацию. Помимо крупных производств, в окрестных сёлах работают десятки семейных марани,
    где квеври-вино наливает сам хозяин.


    Есть в Кварели и два озера. Кваральское озеро лежит в пяти километрах выше города на склоне: отель,
    пляж и вид на всю долину. Меньшее озеро Илии находится почти в центре. Летом оба заполнены людьми,
    но в жаркий кахетинский день провести время у воды — пожалуй, самый разумный из возможных планов.
  tip: >-
    Кварели лучше рассматривать как место ночёвки, а не как проездную остановку: садиться за руль после
    дегустации не стоит. Допустимый уровень алкоголя в Грузии очень строгий, проверки на дорогах частые
    — либо оставайтесь на ночь, либо заранее договоритесь, кто ведёт. Экскурсии в погреба лучше бронировать
    заранее, особенно в сентябре и октябре. Банкоматы и магазины — в центре, у озера только кафе и ресторан
    отеля.
  route: >-
    Есть два варианта. Через Гомборский перевал с заездом в Телави и Греми — около 145 км и чуть больше
    двух с половиной часов. Либо по Кахетинскому шоссе через Сагареджо, Гурджаани и Ахалсопели — расстояние
    примерно то же, дорога ровная и надёжная зимой, когда перевал может быть закрыт. Оба маршрута асфальтовые
    целиком, машины эконом-класса вполне достаточно. Заправиться можно в Телави, Гурджаани и самом Кварели.
    Последние пять километров к озеру — асфальтированный подъём.
fa:
  name: کوارلی و منطقهٔ کیندزماراولی
  short: >-
    اصلی‌ترین ریزمنطقهٔ شراب سرخ کاختی — سردابه‌های تونلی کنده‌شده در صخره، دو دریاچه و پایگاهی طبیعی
    برای سفر برداشت انگور.
  body: >-
    کوارلی در لبهٔ شمالی درهٔ آلازانی، درست چسبیده به دامنه‌های قفقاز نشسته است و همین موقعیت شراب آن
    را تعریف می‌کند. ریزمنطقهٔ حفاظت‌شدهٔ **کیندزماراولی** پیرامون شهر گسترده است: ساپراوی که اینجا روی
    خاک سنگلاخی و زهکش‌دار می‌روید، به سرخ نیمه‌شیرینی بدل می‌شود که شناخته‌شده‌ترین برچسب گرجستان در
    بیرون از کشور است. همین منطقه ساپراوی خشک هم می‌دهد که بسیاری از بازدیدکنندگان در پایان آن را جالب‌تر
    از نسخهٔ شیرین می‌یابند.


    جاذبهٔ اصلی شهر سردابه‌های تونلی‌اش هستند. کیلومترها دالان که در دوران شوروی در صخره کنده شد، امروز
    انبار شراب‌اند: دمای ثابت در تمام سال، بطری‌هایی که در دو سوی دیوارها چیده شده‌اند، و سالن‌های چشیدن
    در انتها. تور معمولاً حدود یک ساعت و نیم طول می‌کشد و چشیدن را هم در بر می‌گیرد. جدا از تولیدکنندگان
    بزرگ، در روستاهای اطراف ده‌ها سردابهٔ خانوادگی هست که صاحبش شراب کوِوری را مستقیم از خمره‌های خودش
    می‌ریزد.


    کوارلی دو دریاچه هم دارد. دریاچهٔ کوارلی پنج کیلومتر بالاتر از شهر روی دامنه است، با هتل، ساحل و نمایی
    بر تمام دره؛ دریاچهٔ کوچک‌تر ایلیا نزدیک مرکز است. هر دو تابستان‌ها پر می‌شوند، هرچند در بعدازظهر
    گرم کاختی، وقت گذراندن کنار آب احتمالاً معقول‌ترین برنامهٔ ممکن است.
  tip: >-
    کوارلی را به‌جای توقفی گذری، اقامتی شبانه در نظر بگیرید — نشستن پشت فرمان پس از چشیدن شراب ارزشش را
    ندارد. حد مجاز الکل برای رانندگی در گرجستان بسیار سخت‌گیرانه است و کنترل‌های کنار جاده رایج، پس یا
    شب را بمانید یا از پیش رانندهٔ مشخصی تعیین کنید. تور سردابه‌ها را از قبل رزرو کنید، به‌ویژه در سپتامبر
    و اکتبر در فصل برداشت. خودپرداز و مغازه در مرکز شهرند؛ کنار دریاچه تنها کافه و رستوران هتل هست.
  route: >-
    دو گزینه دارید. از گردنهٔ گومبوری و از راه تلاوی و گرمی حدود 145 کیلومتر و کمی بیش از دو ساعت و نیم
    است. گزینهٔ دیگر بزرگراه کاختی از ساگارجو، گورجاانی و آخالسوپلی است — فاصله‌ای مشابه، هموار و در زمستان
    که گردنه ممکن است بسته باشد قابل اتکا. هر دو سرتاسر آسفالت‌اند و ماشین اقتصادی کاملاً کافی است. سوخت
    در تلاوی، گورجاانی و خود کوارلی موجود است. پنج کیلومتر پایانی تا دریاچه آسفالت است اما صعودی پیوسته
    دارد.
he:
  name: קווארלי ואזור קינדזמראולי
  short: מיקרו-אזור היין האדום המרכזי של קחתי — מרתפי מנהרות חצובים בסלע, שני אגמים ובסיס טבעי לנסיעת
    בציר.
  body: >-
    קווארלי יושבת בקצה הצפוני של עמק אלאזני, ממש למרגלות מדרונות הקווקז, והמיקום הזה מגדיר את היין שלה.
    המיקרו-אזור המוגן **קינדזמראולי** משתרע סביב העיירה: ענבי סאפראווי הגדלים כאן על קרקע אבנית ומנקזת
    היטב הופכים ליין האדום החצי-מתוק שהוא התווית הגאורגית המוכרת ביותר בחוץ לארץ. אותו אזור מייצר גם סאפראווי
    יבש, שמבקרים רבים מגלים בסופו של דבר שהוא מעניין יותר מן הגרסה המתוקה.


    אטרקציית הדגל של העיירה היא מרתפי המנהרות שלה. קילומטרים של גלריות שנחצבו בסלע בתקופה הסובייטית משמשים
    היום אחסון יין: טמפרטורה קבועה כל השנה, בקבוקים מסודרים בקירות משני הצדדים ואולמות טעימות בקצה. סיור
    אורך בדרך כלל כשעה וחצי וכולל טעימה. מלבד היצרנים הגדולים, בכפרים שמסביב יש עשרות מרתפים משפחתיים
    שבהם המארח מוזג יין קווברי היישר מן הכדים שלו.


    לקווארלי יש גם שני אגמים. אגם קווארלי שוכן חמישה קילומטרים מעל העיירה על המדרון, ובו מלון, חוף ונוף
    אל כל העמק; אגם איליה הקטן יותר נמצא סמוך למרכז. שניהם מתמלאים בקיץ, אם כי בשעת אחר צהריים חמה בקחתי,
    לשהות ליד מים היא כנראה התוכנית ההגיונית ביותר שיש.
  tip: >-
    התייחסו לקווארלי כאל לינת לילה ולא כאל עצירה בדרך — לחזור אל ההגה אחרי טעימה פשוט לא שווה את זה. מגבלת
    השתייה בנהיגה בגאורגיה מחמירה מאוד ובדיקות בצד הדרך נפוצות, לכן או שתישארו ללון או שתסכמו מראש על
    נהג תורן. הזמינו סיורי מרתף מראש, במיוחד בספטמבר ובאוקטובר בעונת הבציר. כספומטים וחנויות נמצאים במרכז;
    ליד האגם יש רק בתי קפה ומסעדות מלון.
  route: >-
    יש שתי אפשרויות. דרך מעבר גומבורי, טלאווי וגרמי זה כ-145 ק״מ ומעט יותר משעתיים וחצי. לחלופין אפשר
    לנסוע בכביש קחתי המהיר דרך סאגארג'ו, גורג'אני ואחלסופלי — מרחק דומה, שטוח ואמין בחורף כשהמעבר עלול
    להיסגר. שני המסלולים סלולים מקצה לקצה ורכב אקונומי מספיק לחלוטין. דלק זמין בטלאווי, בגורג'אני ובקווארלי
    עצמה. חמשת הקילומטרים האחרונים אל האגם סלולים אך עולים בטיפוס מתמיד.
ar:
  name: كفاريلي ومنطقة كيندزماراولي
  short: أهم منطقة صغرى للنبيذ الأحمر في كاخيتي — أقبية أنفاق منحوتة في الصخر، وبحيرتان، وقاعدة طبيعية
    لرحلة قطاف.
  body: >-
    تجلس كفاريلي عند الطرف الشمالي لوادي ألازاني، ملاصقة تماماً لمنحدرات القوقاز، وهذا الموقع هو ما يحدد
    نبيذها. وتمتد منطقة **كيندزماراولي** الصغرى المحمية حول البلدة: فعنب السابيرافي الذي ينمو هنا في تربة
    حصوية جيدة الصرف يتحول إلى النبيذ الأحمر نصف الحلو الذي يمثل أشهر علامة جورجية في الخارج. وتنتج المنطقة
    نفسها أيضاً سابيرافي جافاً يجده كثير من الزوار في النهاية أطرف من النسخة الحلوة.


    وأبرز معالم البلدة أقبيتها النفقية. فكيلومترات من الممرات المنحوتة في الصخر في الحقبة السوفييتية تُستخدم
    اليوم لتخزين النبيذ: حرارة ثابتة طوال العام، وزجاجات مرصوفة في الجدران على الجانبين، وقاعات تذوق في
    آخر النفق. وتستغرق الجولة عادة نحو ساعة ونصف وتشمل التذوق. وإلى جانب المنتجين الكبار، تضم القرى المحيطة
    عشرات الأقبية العائلية حيث يصب صاحب البيت نبيذ الكفيفري مباشرة من جراره.


    ولكفاريلي بحيرتان أيضاً. تقع بحيرة كفاريلي على بعد خمسة كيلومترات فوق البلدة على المنحدر، وفيها فندق
    وشاطئ وإطلالة على الوادي كله؛ أما بحيرة إيليا الأصغر فقريبة من المركز. وتمتلئ الاثنتان في الصيف، وإن
    كان قضاء الوقت بجوار الماء في أصيل كاخيتي الحار هو على الأرجح أعقل خطة متاحة.
  tip: >-
    تعامل مع كفاريلي على أنها مبيت لا محطة عبور — فالعودة إلى المقود بعد جلسة تذوق لا تستحق العناء. والحد
    المسموح به للكحول أثناء القيادة في جورجيا صارم جداً ونقاط التفتيش على الطرق شائعة، فإما أن تبيت ليلتك
    وإما أن تتفق مسبقاً على سائق لا يشرب. واحجز جولات الأقبية مسبقاً، خصوصاً في سبتمبر وأكتوبر في موسم
    القطاف. أجهزة الصراف الآلي والمتاجر في المركز؛ وعند البحيرة لا توجد سوى المقاهي ومطاعم الفنادق.
  route: >-
    أمامك خياران. فعبر ممر غومبوري مروراً بتيلافي وغريمي تقطع نحو 145 كم وأكثر قليلاً من ساعتين ونصف.
    أو اسلك طريق كاخيتي السريع عبر ساغاريجو وغورجاني وأخالسوبيلي — مسافة مماثلة، مستوية ويُعتمد عليها
    في الشتاء حين قد يُغلق الممر. والمساران معبّدان من طرف إلى طرف وسيارة اقتصادية كافية تماماً. والوقود
    متوفر في تيلافي وغورجاني وكفاريلي نفسها. أما الكيلومترات الخمسة الأخيرة صعوداً إلى البحيرة فمعبّدة
    لكنها صعود متواصل.
