ka:
  name: ყვარელი და ქინძმარაულის ზონა
  short: ქინძმარაულის საფერავი კავკასიონის ძირას, XVII საუკუნის რიყის ქვის ციხე და სახლი, სადაც ილია ჭავჭავაძე
    დაიბადა.
  body: >-
    **მსოფლიო ყვარელს ნახევრადტკბილი წითელი ღვინით იცნობს, თავად ქალაქი კი უფრო მკაცრი მასალისგანაა ნაგები
    — რიყის ქვისგან, დიდი მწერლის ხსოვნისა და მთისგან, რომელიც ზურგს უმაგრებს.**


    ყვარელი ალაზნის ველის ჩრდილოეთ კიდეზე, მდინარის მარცხენა ნაპირზე — გაღმამხარში დგას. ირგვლივ ქინძმარაულის
    მიკროზონა იშლება, რომლის სახელიც 2010 წლიდან კანონითაა დაცული: ვენახები ზღვის დონიდან 250–550 მეტრზე,
    სადაც საფერავს ვაზზე იმდენ ხანს ტოვებენ, რომ ღვინოში 3–5 პროცენტი შაქარი თავისით რჩება, ყოველგვარი
    დამატების გარეშე. ამავე ფერდობების მშრალ საფერავს კი ბევრი ბოლოს მაინც ამჯობინებს.


    ქალაქის შუაგულში რიყის ქვით ნაგები ოთხკუთხა გალავანი დგას, კუთხეებში ცილინდრული კოშკებით, — ყვარლის
    ციხე, XVII საუკუნის პირველ ნახევარში აგებული და კახეთის გვიანი შუა საუკუნეების ციხეთაგან უდიდესი.
    1755 წლის სექტემბერში მას დაღესტნელთა ლაშქრით ნურსალ-ბეგი შემოადგა და მეციხოვნეებს თოფის წამალი გამოელიათ.
    ქართლის მეფემ თეიმურაზ II-მ და მისმა ძემ, კახეთის მეფე ერეკლე II-მ, 206 მოხალისე შეკრიბეს და აღუთქვეს:
    ვინც ალყას გაარღვევს, ყმობისგან გათავისუფლდება. მოხალისეები ციხეში შეიჭრნენ და წამალი შეიტანეს; 28
    სექტემბერს მტერმა ალყა მოხსნა, მეფეებმა კი სიტყვა შეასრულეს.


    ახლოს ჭავჭავაძეების საგვარეულო კოშკი აღმართულა, მის გვერდით კი მოკრძალებული ერთსართულიანი სახლია,
    სადაც 1837 წელს ილია ჭავჭავაძე დაიბადა — პოეტი, პუბლიცისტი და ეროვნული აღორძინების სინდისი. 1938 წელს
    გახსნილ მუზეუმში მისი ხელნაწერები ინახება, ეზოში კი მარანი, თონე, ბეღელი და წყლის წისქვილი დგას.


    ცენტრს იქით, ქალაქის ჩრდილოეთით, მთის კალთაში გაჭრილ და 1962 წელს გახსნილ „ხარების“ გვირაბებში ღვინო
    მუდმივ სიგრილეში წევს, ორი ტბა კი — ილიას ტბა ქალაქის დასავლეთ კიდეზე და ყვარლის ტბა, კურორტიანი წყალსაცავი
    რამდენიმე კილომეტრით აღმოსავლეთით — კახური აგვისტოს შუადღეს გადაგარჩენთ. საღამომდე მაინც დარჩით: როცა
    ქედი ვენახების თავზე მუქდება, მთელი ქალაქი თითქოს მას მიყრდნობია.
  tip: >-
    ყვარელი ღამის გასათევად დაგეგმეთ და არა გზად გასავლელად: საქართველოში ნასვამ მდგომარეობაში ტარების
    ზღვარი ძალიან მკაცრია, პატრული ხშირად ამოწმებს, კახური დეგუსტაცია კი ერთი ყლუპით არასოდეს მთავრდება.
    გვირაბის ექსკურსია დეგუსტაციით დაახლოებით 25–30 ლარი ღირს და სექტემბერ-ოქტომბერში, რთველის დროს, სწრაფად
    ივსება — წინასწარ დაჯავშნეთ. ჭავჭავაძეების მუზეუმს აუჩქარებლად ერთი საათი დაუთმეთ, ციხის გალავანს
    — ოციოდე წუთი, სჯობს შუადღის მერე, როცა დაბალი მზე თითოეულ რიყის ქვას გამოკვეთს. მიმდებარე სოფლების
    საოჯახო მარნებში ქვევრის ღვინოს პირდაპირ ქვევრიდან ასხამენ; მასპინძელს სთხოვეთ, გაგაცნოთ. ბანკომატები
    და მაღაზიები ცენტრშია, ტბებთან მხოლოდ კაფეები და სასტუმროს რესტორნებია.
  route: >-
    აქ ორი კარგი გზა მოდის, ორივე ბოლომდე ასფალტიანი, და ეკონომკლასის მანქანა სავსებით საკმარისია. ლამაზი
    გზა გომბორის უღელტეხილზე (შ38) თელავამდე ადის, იქიდან კი კავკასიონის ძირს აღმოსავლეთით, გრემის გავლით
    მიუყვება: დაახლოებით 145 კმ და ორსაათნახევარი. მეორე ბარის გზაა — კახეთის გზატკეცილი (ს5) საგარეჯოსა
    და გურჯაანის გავლით, საიდანაც ჩრდილოეთით უხვევთ, ალაზანს ახალსოფელთან გადაკვეთთ და ყვარელში ადიხართ.
    მანძილი თითქმის იგივეა, ზამთარში კი, როცა თოვლმა შეიძლება უღელტეხილი ჩაკეტოს, სწორედ ეს გზა ჯობია.
    საწვავი თელავში, გურჯაანში ან თავად ყვარელში ჩაასხით.
en:
  name: Kvareli and the Kindzmarauli zone
  short: >-
    Semi-sweet Saperavi under the Caucasus, a 17th-century river-stone fortress and the house where Ilia
    Chavchavadze was born.
  body: >-
    **The world knows Kvareli by its semi-sweet red, but the town itself is made of harder stuff: river
    stone, a writer's memory and a mountain wall that stands right behind it.**


    Kvareli sits on the northern rim of the Alazani Valley, on the left bank that Kakhetians call Gaghma
    Mkhari, the far side. Around it spreads the Kindzmarauli appellation, protected by law since 2010:
    vineyards between 250 and 550 metres, where Saperavi is left on the vine until it is so ripe that
    the wine keeps 3–5 per cent sugar on its own, with nothing added. Many drinkers end up preferring
    the dry Saperavi from the same slopes.


    In the middle of town rises a square of rounded river cobbles with a cylindrical tower at each corner:
    Kvareli Fortress, built in the first half of the 17th century and the largest late-medieval castle
    in Kakheti. In September 1755 a Dagestani army under Nursal-beg besieged it, and the garrison ran
    out of gunpowder. King Teimuraz II of Kartli and his son Erekle II of Kakheti gathered 206 volunteers
    and promised freedom from serfdom to every man who broke through. They carried the powder in; on 28
    September the besiegers withdrew, and the kings kept their word.


    Not far away, the Chavchavadze family tower stands over the modest one-storey house where Ilia Chavchavadze
    was born in 1837 — poet, publisher and the conscience of Georgia's national revival. The museum, opened
    in 1938, keeps his manuscripts; in the yard are a marani, a tone oven, a granary and a water mill.


    Beyond the centre, just north of town, the tunnels of Winery Khareba, cut into the mountainside and
    opened in 1962, hold wine at a steady cellar chill, and two lakes, Ilia Lake on the western edge and
    Kvareli Lake, a resort reservoir a few kilometres east, rescue the Kakhetian August afternoon. Stay
    for the evening, though, when the ridge darkens above the vines and the whole town seems to lean against
    it.
  tip: >-
    Make Kvareli a night's stop, not a drive-through: Georgia's drink-driving limit is very strict, police
    checks are frequent and a Kakhetian tasting is never a thimbleful. Tunnel tours with tasting cost
    roughly 25–30 ₾ and fill up in September and October, the rtveli season, so book ahead. Give the Chavchavadze
    museum an unhurried hour and the fortress walls twenty minutes, ideally late in the afternoon, when
    low sun picks out every cobble. Family cellars in the surrounding villages pour qvevri wine straight
    from the jar; ask your guesthouse host for an introduction. ATMs and shops are in the centre; the
    lakes have only cafés and hotel restaurants.
  route: >-
    Two good roads lead here, both asphalt all the way, and an economy car is all you need. The scenic
    one climbs the Gombori Pass (Sh38) to Telavi, then runs east along the foot of the Caucasus past Gremi:
    about 145 km and two and a half hours. The other follows the flat Kakheti Highway (S5) through Sagarejo
    and Gurjaani, then turns north across the Alazani via Akhalsopeli. The distance is similar, and in
    winter, when snow can close the pass, it is the one to take. Fuel up in Telavi, Gurjaani or Kvareli
    itself.
ru:
  name: Кварели и зона Киндзмараули
  short: Полусладкое Саперави под Кавказом, крепость XVII века из речного камня и дом, где родился Илья
    Чавчавадзе.
  body: >-
    **Мир знает Кварели по его полусладкому красному, но сам город сложен из более твёрдого материала:
    речной камень, память писателя и горная стена, что стоит прямо за спиной.**


    Кварели лежит на северном краю Алазанской долины, на левом берегу, который кахетинцы называют Гагма-Мхари,
    «тот берег», «дальняя сторона». Вокруг раскинулась зона наименования по происхождению «Киндзмараули»,
    защищённая законом с 2010 года: виноградники на высоте от 250 до 550 метров, где Саперави оставляют
    на лозе до такой зрелости, что вино само сохраняет 3–5% сахара, без всяких добавок. Многие ценители
    в итоге предпочитают сухое Саперави с тех же склонов.


    В центре города возвышается квадрат из округлых речных валунов с цилиндрической башней на каждом углу:
    крепость Кварели, построенная в первой половине XVII века — самый крупный позднесредневековый замок
    Кахетии. В сентябре 1755 года дагестанское войско под командованием Нурсал-бека осадило её, и у гарнизона
    иссяк порох. Картлийский царь Теймураз II и его сын, кахетинский царь Ираклий II, собрали 206 добровольцев
    и пообещали свободу от крепостной зависимости каждому, кто прорвётся. Добровольцы пронесли порох в
    крепость; 28 сентября осаждающие отступили, и цари сдержали слово.


    Неподалёку стоит башня рода Чавчавадзе над скромным одноэтажным домом, где в 1837 году родился Илья
    Чавчавадзе — поэт, издатель и совесть грузинского национального возрождения. Музей, открытый в 1938
    году, хранит его рукописи; во дворе — марани, тонэ, зернохранилище и водяная мельница.


    За центром, чуть севернее города, в тоннелях винодельни «Хареба», прорубленных в горе и открытых в
    1962 году, вино хранится при постоянном погребном холоде, а два озера — озеро Ильи на западной окраине
    и Кварельское озеро, водохранилище с курортом в нескольких километрах к востоку, — спасают кахетинский
    августовский полдень. Но останьтесь на вечер, когда хребет темнеет над виноградниками, а весь город
    будто прислоняется к нему.
  tip: >-
    Сделайте Кварели остановкой на ночь, а не проездом: допустимый уровень алкоголя для водителей в Грузии
    очень строгий, полицейские проверки часты, а кахетинская дегустация никогда не ограничивается напёрстком.
    Экскурсии по тоннелям с дегустацией стоят примерно 25–30 лари и заполняются в сентябре-октябре, сезон
    ртвели (грузинский сбор винограда), так что бронируйте заранее. Дайте музею Чавчавадзе спокойный час
    и двадцать минут стенам крепости, лучше под конец дня, когда низкое солнце подсвечивает каждый камень.
    Семейные погреба в окрестных сёлах наливают вино прямо из квеври; попросите хозяина гостевого дома
    представить вас. Банкоматы и магазины — в центре; у озёр — только кафе и рестораны при отелях.
  route: >-
    Сюда ведут две хорошие дороги, обе полностью асфальтированные, и машины эконом-класса вполне достаточно.
    Живописная поднимается через Гомборский перевал (Sh38) до Телави, затем идёт на восток у подножия
    Кавказа мимо Греми: около 145 км и два с половиной часа. Другая следует по равнинному Кахетинскому
    шоссе (S5) через Сагареджо и Гурджаани, затем поворачивает на север и пересекает Алазани у Ахалсопели.
    Расстояние похожее, а зимой, когда снег может закрыть перевал, выбирайте именно её. Заправляйтесь
    в Телави, Гурджаани или самом Кварели.
fa:
  name: کوارلی و منطقهٔ کیندزماراولی
  short: >-
    ساپراوی نیمه‌شیرین زیر کوه‌های قفقاز، دژی از قلوه‌سنگ رودخانه‌ای از سدهٔ هفدهم و خانه‌ای که ایلیا
    چاوچاوادزه در آن زاده شد.
  body: >-
    **جهان کوارلی را با شراب سرخ نیمه‌شیرینش می‌شناسد، اما خود شهر از ماده‌ای سخت‌تر ساخته شده: سنگ رودخانه،
    خاطرهٔ نویسنده‌ای، و دیواره‌ای کوهستانی که درست پشت آن ایستاده است.**


    کوارلی بر لبهٔ شمالی درهٔ آلازانی نشسته، بر کناره‌ای که کاختی‌ها آن را «گاغما مخاری»، یعنی «سوی دور»،
    می‌نامند. پیرامونش منطقهٔ کیندزماراولی گسترده است، که نامش از سال ۲۰۱۰ به‌موجب قانون حمایت می‌شود:
    تاکستان‌هایی میان ۲۵۰ تا ۵۵۰ متری، جایی که ساپراوی آن‌قدر بر تاک می‌ماند تا چنان برسد که شراب به‌خودی‌خود
    ۳ تا ۵ درصد قند نگه می‌دارد، بدون هیچ افزودنی. بسیاری از نوشندگان سرانجام ساپراویِ خشکِ همان دامنه‌ها
    را ترجیح می‌دهند.


    در میان شهر مربعی از قلوه‌سنگ‌های گردِ رودخانه‌ای با برجی استوانه‌ای در هر گوشه سر برمی‌کشد: دژ کوارلی،
    که در نیمهٔ نخست سدهٔ هفدهم بنا شد و بزرگ‌ترین قلعهٔ متأخرِ سده‌های میانه در کاختی است. در سپتامبر
    ۱۷۵۵ سپاهی داغستانی به فرماندهی نورسال-بیگ آن را محاصره کرد، و پادگان از باروت تهی شد. تیموراز دوم،
    پادشاه کارتلی، و پسرش ایرکله دوم، پادشاه کاختی، ۲۰۶ داوطلب گرد آوردند و به هر مردی که راه بگشاید،
    آزادی از رعیتی وعده دادند. آنها باروت را به‌درون بردند؛ در ۲۸ سپتامبر محاصره‌کنندگان عقب نشستند، و
    پادشاهان به وعدهٔ خود وفا کردند.


    نه‌چندان دور، برج خانوادهٔ چاوچاوادزه بر فراز خانهٔ یک‌طبقه و بی‌آلایشی ایستاده که ایلیا چاوچاوادزه
    در سال ۱۸۳۷ در آن زاده شد — شاعر، ناشر و وجدان نوزایی ملی گرجستان. موزه‌ای که در سال ۱۹۳۸ گشوده شد
    دست‌نویس‌های او را نگه می‌دارد؛ در حیاط آن مارانی، تنوری، انبار غله و آسیاب آبی است.


    آن‌سوی مرکز شهر، کمی به سوی شمال، تونل‌های شراب‌سازی «خارِبا» که در دل کوه کنده شده و در سال ۱۹۶۲
    گشوده شدند، شراب را در خنکای پیوستهٔ زیرزمینی نگه می‌دارند، و دو دریاچه - دریاچهٔ ایلیا در لبهٔ غربی
    شهر و دریاچهٔ کوارلی، آب‌بندی با تفرجگاهی بر کرانه‌اش، چند کیلومتر به سوی شرق - بعدازظهر تابستانی
    کاختی را نجات می‌دهند. اما برای شامگاه بمانید، زمانی که رشته‌کوه بر فراز تاکستان‌ها تیره می‌شود و
    گویی همهٔ شهر به آن تکیه داده است.
  tip: >-
    کوارلی را توقفی شبانه کنید، نه صرفاً گذرگاهی: حد مجاز رانندگی پس از نوشیدن در گرجستان بسیار سخت‌گیرانه
    است، بازرسی‌های پلیس پرشمارند، و شراب‌چشی در کاختی هرگز به یک جرعه ختم نمی‌شود. تور تونل با چشیدن
    نزدیک به ۲۵ تا ۳۰ لاری هزینه دارد و در سپتامبر و اکتبر، فصل رتوِلی، پر می‌شود، پس پیشاپیش رزرو کنید.
    به موزهٔ چاوچاوادزه ساعتی آرام و به دیوارهای دژ بیست دقیقه بدهید، ترجیحاً اواخر بعدازظهر، وقتی نور
    کم‌ارتفاع هر سنگ را برجسته می‌کند. سرداب‌های خانوادگی در روستاهای اطراف شراب کوِوری را مستقیم از خُم
    می‌ریزند؛ از میزبان مهمان‌خانهٔ خود معرفی بخواهید. دستگاه خودپرداز و مغازه در مرکز است؛ کنار دریاچه‌ها
    تنها کافه و رستوران‌های هتل‌هاست.
  route: >-
    دو راه خوب به اینجا می‌رسد، هر دو تا انتها آسفالته، و خودرویی معمولی کاملاً کافی است. راه زیبا از
    گذرگاه گومبوری (Sh38) به تلاوی بالا می‌رود، سپس به سوی شرق در پای قفقاز از کنار گرمی می‌گذرد: نزدیک
    به ۱۴۵ کیلومتر و دو ساعت‌ونیم. راه دیگر از بزرگراه هموار کاختی (S5) از میان ساگارجو و گورجانی می‌گذرد،
    سپس به‌سوی شمال می‌پیچد و در آخالسوپلی از آلازانی عبور می‌کند. مسافت مشابه است، و در زمستان، وقتی
    برف می‌تواند گذرگاه را ببندد، این همان راهی است که باید برگزید. در تلاوی، گورجانی یا خود کوارلی باک
    را پر کنید.
he:
  name: קוארלי ואזור קינדזמראולי
  short: סאפרווי חצי-מתוק תחת הקווקז, מצודת אבן-נהר מהמאה ה-17 והבית שבו נולד איליה צ'בצ'בדזה.
  body: >-
    **העולם מכיר את קוארלי לפי היין האדום חצי-המתוק שלה, אך העיירה עצמה עשויה מחומר קשה יותר: אבן נהר,
    זכרו של סופר, וחומת הרים העומדת ממש מאחוריה.**


    קוארלי שוכנת על השוליים הצפוניים של עמק האלאזני, על הגדה השמאלית שהקאחתים קוראים לה גגמה מחארי, "הצד
    הרחוק". מסביבה משתרע אזור הכינוי קינדזמראולי, המוגן בחוק מאז 2010: כרמים בגובה של 250 עד 550 מטר,
    שם משאירים את הסאפרווי על הגפן עד שהוא בשל כל-כך שהיין שומר 3-5 אחוזי סוכר בעצמו, בלי כל תוספת. רבים
    מן השותים מגלים בסוף שהם מעדיפים את הסאפרווי היבש מאותם המדרונות.


    באמצע העיירה מתנשא ריבוע של חלוקי נהר עגולים עם מגדל גלילי בכל פינה: מצודת קוארלי, שנבנתה במחצית הראשונה
    של המאה ה-17 והיא הטירה הגדולה ביותר מסוף ימי הביניים בקאחתי. בספטמבר 1755 צר עליה צבא דגסטני בפיקוד
    נורסל-בק, והחיל נותר בלי אבק שריפה. טימוראז השני, מלך קרטלי, ובנו אירקלה השני, מלך קאחתי, אספו 206
    מתנדבים והבטיחו חופש מצמיתות לכל אדם שיפרוץ. הם נשאו את אבק השריפה פנימה; ב-28 בספטמבר נסוגו הצרים,
    והמלכים קיימו את דברם.


    לא רחוק משם עומד מגדל משפחת צ'בצ'בדזה מעל הבית הקטן והצנוע בן קומה אחת שבו נולד איליה צ'בצ'בדזה ב-1837
    — משורר, מוציא לאור ומצפונה של התחייה הלאומית הגאורגית. המוזיאון, שנפתח ב-1938, שומר את כתבי היד שלו;
    בחצר נמצאים מראני, תנור תונה, מגורה וטחנת מים.


    מעבר למרכז, ממש צפונית לעיירה, מנהרות היקב "חארבה", שנחצבו בהר ונפתחו ב-1962, שומרות יין בקור מרתף
    קבוע, ושני אגמים - אגם איליה בקצה המערבי של העיירה ואגם קוארלי, מאגר ולחופו אתר נופש, כמה קילומטרים
    מזרחה - מצילים את אחר הצהריים הקאחתי של אוגוסט. אבל הישארו לערב, כשהרכס מחשיך מעל הכרמים והעיירה כולה
    נראית כאילו נשענת עליו.
  tip: >-
    הפכו את קוארלי לתחנת לילה, לא לנקודת מעבר: מגבלת האלכוהול לנהגים בגאורגיה מחמירה מאוד, בדיקות משטרה
    תדירות, וטעימה קאחתית לעולם אינה מסתכמת בלגימה. סיורי מנהרות עם טעימה עולים כ-25-30 לארי ומתמלאים
    בספטמבר ואוקטובר, עונת הרטוולי (בציר הענבים), כך שכדאי להזמין מראש. הקדישו למוזיאון צ'בצ'בדזה שעה
    שלווה ולחומות המצודה עשרים דקות, רצוי בשעות אחר הצהריים המאוחרות, כשהשמש הנמוכה מדגישה כל חלוק. מרתפים
    משפחתיים בכפרים הסמוכים מוזגים יין קוורי ישר מהכד; בקשו מבעל בית ההארחה שלכם היכרות. כספומטים וחנויות
    נמצאים במרכז; באגמים יש רק בתי קפה ומסעדות מלונות.
  route: >-
    שתי דרכים טובות מובילות לכאן, שתיהן סלולות מקצה לקצה, ורכב רגיל מספיק בהחלט. הדרך הנופית מטפסת במעבר
    גומבורי (Sh38) לטלאווי, ואז ממשיכה מזרחה לאורך רגלי הקווקז ליד גרמי: כ-145 ק"מ ושעתיים וחצי. הדרך
    השנייה עוקבת אחר כביש קאחתי השטוח (S5) דרך סאגארג'ו וגורג'אני, ואז פונה צפונה וחוצה את האלאזני ליד
    אחלסופלי. המרחק דומה, ובחורף, כשהשלג יכול לסגור את המעבר, זו הדרך שיש לבחור. תדלקו בטלאווי, גורג'אני
    או בקוארלי עצמה.
ar:
  name: كفاريلي ومنطقة كيندزماراولي
  short: >-
    نبيذ سابرافي شبه الحلو تحت جبال القوقاز، وقلعة من حجر النهر من القرن السابع عشر، والبيت الذي وُلد
    فيه إيليا تشافتشافادزه.
  body: >-
    **يعرف العالم كفاريلي بنبيذها الأحمر شبه الحلو، لكن البلدة نفسها مصنوعة من مادة أصلب: حجر النهر، وذكرى
    كاتب، وجدار جبلي يقف خلفها مباشرة.**


    تقع كفاريلي على الحافة الشمالية لوادي ألازاني، على الضفة اليسرى التي يسمّيها أهل كاختي "غاغما مخاري"،
    أي "الجانب البعيد". وحولها تمتد منطقة كيندزماراولي المحمية بالقانون منذ عام 2010: كروم بين 250 و550
    مترًا، حيث يُترك عنب السابرافي على الكرمة حتى ينضج لدرجة أن النبيذ يحتفظ بنسبة 3-5 بالمئة من السكر
    من تلقاء نفسه، دون أي إضافة. وينتهي كثير من الشاربين بتفضيل السابرافي الجاف من المنحدرات نفسها.


    وفي وسط البلدة يعلو مربع من حصى النهر المدوّر، عند كل زاوية من زواياه برج أسطواني: قلعة كفاريلي، التي
    بُنيت في النصف الأول من القرن السابع عشر، وهي أكبر قلعة من أواخر العصور الوسطى في كاختي. وفي سبتمبر
    1755 حاصرها جيش داغستاني بقيادة نورسال بيك، ونفد البارود من الحامية. فجمع تيموراز الثاني ملك كارتلي
    وابنه إريكلي الثاني (هرقل الثاني) ملك كاختي 206 متطوعين، ووعدا كل من يشق طريقه بالتحرر من القنانة.
    حملوا البارود إلى الداخل؛ وفي 28 سبتمبر تراجع المحاصرون، ووفى الملكان بوعدهما.


    وعلى مقربة، يقف برج عائلة تشافتشافادزه فوق البيت المتواضع ذي الطابق الواحد الذي وُلد فيه إيليا تشافتشافادزه
    عام 1837 — الشاعر والناشر وضمير النهضة القومية الجورجية. والمتحف، الذي افتُتح عام 1938، يحفظ مخطوطاته؛
    وفي الساحة ماراني وفرن تونه ومخزن حبوب وطاحونة مائية.


    وخلف المركز، شمال البلدة مباشرة، تحفظ أنفاق شركة "خاريبا"، المحفورة في جانب الجبل والمفتتحة عام 1962،
    النبيذ في برودة قبو ثابتة، وتنقذ بحيرتان — بحيرة إيليا على الطرف الغربي للبلدة، وبحيرة كفاريلي، وهي
    خزان مائي على ضفته منتجع، على بُعد بضعة كيلومترات شرقًا — بعد ظهر أغسطس الكاختي. لكن ابقَ للمساء،
    حين تُعتم سلسلة الجبال فوق الكروم وتبدو البلدة بأكملها وكأنها تستند إليها.
  tip: >-
    اجعل كفاريلي محطة ليلة، لا مجرد عبور: حدّ قيادة السيارة تحت تأثير الكحول في جورجيا صارم جدًا، وتفتيش
    الشرطة متكرر، والتذوق الكاختي لا يقتصر أبدًا على رشفة. تكلف جولات الأنفاق مع التذوق نحو 25-30 لاري
    وتُحجز بالكامل في سبتمبر وأكتوبر، موسم "رتفيلي"، فاحجز مسبقًا. أعطِ متحف تشافتشافادزه ساعة هادئة وأسوار
    القلعة عشرين دقيقة، ويُفضَّل ذلك في وقت متأخر من بعد الظهر حين تُبرز الشمس المنخفضة كل حصاة. تصبّ
    الأقبية العائلية في القرى المحيطة نبيذ الكفيفري مباشرة من الجرة؛ فاطلب من مضيّف بيت الضيافة تعريفك
    بأحدهم. الصرافات الآلية والمتاجر في الوسط؛ ولا تجد عند البحيرتين إلا المقاهي ومطاعم الفنادق.
  route: >-
    يؤدي إلى هنا طريقان جيدان، كلاهما مُعبَّد بأكمله، وتكفي سيارة اقتصادية. يصعد الطريق الأكثر جمالًا
    عبر ممر غومبوري (Sh38) إلى تيلافي، ثم يمتد شرقًا عند سفح القوقاز قرب غريمي: نحو 145 كم وساعتان ونصف.
    ويتبع الطريق الآخر طريق كاختي السريع المستوي (S5) عبر ساغاريجو وغورجاني، ثم ينحرف شمالًا ويعبر نهر
    ألازاني عند أخالسوبيلي. والمسافة مشابهة، وفي الشتاء، حين قد يُغلق الثلج الممر، فهو الطريق الأنسب.
    عبّئ الوقود في تيلافي أو غورجاني أو كفاريلي نفسها.
