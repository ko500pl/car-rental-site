ka:
  name: ქვათახევის მონასტერი
  short: >-
    ოქროს ხანის თეთრქვიანი გუმბათოვანი ტაძარი ტრიალეთის ტყიანი ხეობის ჩიხში — ოდესღაც სამწიგნობრო კერა,
    რომლის განძის ნაწილი დღეს მოსკოვშია.
  body: >-
    **ქვათახევი საკუთარი ხეობის ბოლოს იმალება — სამი მხრიდან ტრიალეთის ქედის ციცაბო ფერდობები აკრავს და
    ვერაფერს დაინახავთ, სანამ გზა პირდაპირ მონასტრის კართან არ დასრულდება.**


    ტაძარი XII–XIII საუკუნეებშია აგებული და ბეთანიის, ფიტარეთისა და ტიმოთესუბნის ერთი ოჯახის წევრია. ჯვარგუმბათოვანი
    ნაგებობა გეგმით თითქმის კვადრატულია: გუმბათი ორ თავისუფლად მდგარ ბურჯს და საკურთხევლის კედლებთან შერწყმულ
    ორ ბურჯს ეყრდნობა. შესასვლელი ორია — სამხრეთით და დასავლეთით. ფასადები სუფთად გათლილი თეთრი ქვითაა
    მოპირკეთებული; ჩუქურთმა სარკმლებთან და გუმბათის ყელის ძირში ხშირდება, აღმოსავლეთ ფასადზე კი დიდი მოჩუქურთმებული
    ჯვარი მეფობს.


    ქვათახევი მხოლოდ სალოცავი არასოდეს ყოფილა. აქ ხელნაწერებს გადაწერდნენ, მონასტრის განძეულში კი შუა
    საუკუნეების ქართული საიუველირო ნაკეთობები ინახებოდა — მათი დიდი ნაწილი მოსკოვის სახელმწიფო ისტორიულ
    მუზეუმში აღმოჩნდა და დღესაც იქ არის გამოფენილი. საეკლესიო გადმოცემით, მონასტერში ღვთისმშობლის მიძინების
    სასწაულთმოქმედი ხატი და ღვთისმშობლის სამოსის ნაწილი ინახება.


    XIV საუკუნეში თემურ-ლენგის ლაშქრობებმა მონასტერი მძიმედ დააზიანა. შემდეგ იგი არაერთხელ შეაკეთეს, ყველაზე
    საფუძვლიანად — 1854 წელს, თავად ივანე თარხან-მოურავის მფარველობით; გალავნის შიგნით მდგარი სამრეკლო
    1872 წელს დაემატა.


    დღეს ქვათახევი კვლავ მოქმედი მონასტერია და სიჩუმე აქ დაცულია, არა დადგმული; გზა, რომელმაც აქ მოგიყვანათ,
    უბრალოდ მთავრდება — და ერთი საათით მასთან ერთად დანარჩენი სამყაროც.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი მონასტერია: ქალებს თავსაფარი და ქვედაბოლო სჭირდებათ, მამაკაცებს გრძელი შარვალი;
    მოსასხამები ჩვეულებრივ ჭიშკართან დევს. შიგნით გადაღებამდე ნებართვა ითხოვეთ და გაითვალისწინეთ, რომ
    მსახურების დროს ტაძარი შეიძლება დაკეტილი იყოს. კაფე არ არის — წყალი და საჭმელი კავთისხევში იყიდეთ.
    ხეობაში მტკვრის ველთან შედარებით საგრძნობლად გრილა, ამიტომ ზაფხულშიც თბილი რამ წამოიღეთ. მონასტერს
    საათი ეყოფა, ხეობის გზასთან ერთად კი საათნახევარი დაგეგმეთ.
  route: >-
    თბილისიდან ს1 (E60) გზით მცხეთის მიმართულებით გადით, შემდეგ გორის ძველ გზაზე (შ29) გადადით, რომელიც
    მტკვრის მარჯვენა ნაპირს დასავლეთისკენ მიუყვება კავთისხევამდე — ქალაქის ცენტრიდან დაახლოებით 45 კმ.
    სოფლის გავლისთანავე სამხრეთით, წინარეხი–ქვათახევის გზაზე (შ131) გადაუხვიეთ და დაახლოებით 10 კმ იარეთ
    ხეობაში, სანამ გზა მონასტერთან არ ამოიწურება. სულ დაახლოებით 58 კმ და საათი და თხუთმეტი წუთი. ბოლო
    მონაკვეთი ვიწროა, ჩამოშლილი კიდეებითა და პატარა ხიდებით, მაგრამ მშრალ ამინდში ეკონომკლასის მანქანა
    ადვილად გაივლის. საწვავი თბილისში ან მცხეთაში ჩაასხით; მანქანა ჭიშკრის წინ, სწორ მოედანზე დატოვეთ.
en:
  name: Kvatakhevi Monastery
  short: >-
    A Golden Age domed church in white dressed stone at the dead end of a wooded Trialeti gorge, once
    a scriptorium, part of whose treasury is now in Moscow.
  body: >-
    **Kvatakhevi hides at the end of its own gorge, walled in on three sides by the steep northern slopes
    of the Trialeti range, and you see nothing of it until the road simply stops at the gate.**


    The church was built in the 12th–13th centuries and belongs to the same family as Betania, Pitareti
    and Timotesubani. It is a domed cross-in-square, almost square in plan, its dome carried on two free-standing
    piers and two more merged into the walls of the sanctuary. There are two doors, south and west. The
    walls are faced with finely dressed white stone; the carving thickens around the windows and at the
    foot of the dome, and a large ornate cross commands the east front.


    This was never only a place of prayer. Monks copied manuscripts here, and the treasury held medieval
    Georgian jewellery, much of which ended up in the State Historical Museum in Moscow, where it is displayed
    to this day. Church tradition holds that the monastery keeps a wonder-working icon of the Dormition
    and a fragment of the Virgin's robe.


    Timur's armies left the monastery badly damaged in the 14th century. It was repaired more than once,
    most thoroughly in 1854 under Prince Ivane Tarkhan-Mouravi, and the belfry inside the walls was added
    in 1872.


    Today it is a working monastery again, and the quiet here is kept rather than staged; the road that
    brought you simply ends, and so, for an hour, does the rest of the world.
  tip: >-
    Entry is free. This is an active monastery: women need a headscarf and a skirt, men long trousers,
    and wraps are usually left at the gate. Ask before photographing inside, and expect the church to
    be closed now and then during services. There is no café, so buy water and food in Kavtiskhevi. The
    gorge is noticeably cooler than the Mtkvari plain, so bring a layer even in summer. An hour at the
    monastery is enough; with the gorge drive, allow an hour and a half.
  route: >-
    Leave Tbilisi on the S1 (E60) towards Mtskheta, then switch to the old Gori road (Sh29), which runs
    west along the south bank of the Mtkvari to Kavtiskhevi, about 45 km from the city centre. Just beyond
    the village, turn south onto the Tsinarekhi–Kvatakhevi road (Sh131) and follow it roughly 10 km into
    the gorge until it ends at the monastery. In all about 58 km and an hour and a quarter. The last stretch
    is narrow, with crumbling edges and small bridges, but in dry weather an economy car copes. Fill up
    in Tbilisi or Mtskheta; park on the level ground before the gate.
ru:
  name: Монастырь Кватахеви
  short: >-
    Купольный храм золотого века из белого тёсаного камня в тупике лесистого ущелья Триалети; здесь был
    скрипторий, а часть сокровищницы теперь в Москве.
  body: >-
    **Кватахеви прячется в конце собственного ущелья, с трёх сторон зажатый крутыми северными склонами
    Триалетского хребта, и вы не видите ничего, пока дорога попросту не упрётся в ворота.**


    Церковь построена в XII–XIII веках и принадлежит к той же семье, что Бетания, Питарети и Тимотесубани.
    Это крестово-купольный храм почти квадратного плана; купол опирается на два свободно стоящих столба
    и ещё на два, слитых со стенами алтаря. Входов два — с юга и с запада. Стены облицованы тщательно
    отёсанным белым камнем; резьба сгущается вокруг окон и у основания купола, а восточный фасад венчает
    большой узорчатый крест.


    Монастырь никогда не был только местом молитвы. Монахи переписывали здесь рукописи, а в сокровищнице
    хранились средневековые грузинские драгоценности; многие из них оказались в Государственном историческом
    музее в Москве, где выставлены и сегодня. По церковному преданию, в монастыре хранятся чудотворная
    икона Успения и частица ризы Богородицы.


    В XIV веке войска Тимура тяжело разорили монастырь. Его восстанавливали не раз, основательнее всего
    в 1854 году при князе Иване Тархан-Моурави, а колокольню внутри ограды поставили в 1872 году.


    Сегодня монастырь снова действующий, и тишину здесь хранят, а не изображают; дорога, которая привела
    вас сюда, просто кончается — а вместе с ней, на час, и весь остальной мир.
  tip: >-
    Вход свободный. Монастырь действующий: женщинам нужны платок и юбка, мужчинам — длинные брюки; накидки
    обычно лежат у ворот. Прежде чем фотографировать внутри, спросите разрешения, и будьте готовы, что
    во время служб церковь иногда закрыта. Кафе нет, поэтому воду и еду купите в Кавтисхеви. В ущелье
    заметно прохладнее, чем на равнине Мтквари, так что даже летом возьмите что-нибудь тёплое. На сам
    монастырь хватит часа, вместе с дорогой по ущелью — полутора.
  route: >-
    Выезжайте из Тбилиси по S1 (E60) в сторону Мцхеты, затем перейдите на старую Горийскую дорогу (Sh29):
    она идёт на запад по южному берегу Мтквари до Кавтисхеви, примерно в 45 км от центра города. Сразу
    за селом сверните на юг, на дорогу Цинарехи — Кватахеви (Sh131), и следуйте по ней около 10 км вглубь
    ущелья, пока она не закончится у монастыря. Всего около 58 км и час с четвертью. Последний участок
    узкий, с осыпающимися краями и мостиками, но в сухую погоду справится и машина эконом-класса. Заправьтесь
    в Тбилиси или Мцхете; машину оставьте на ровной площадке перед воротами.
fa:
  name: صومعهٔ کواتاخوی
  short: >-
    کلیسایی گنبددار از عصر طلایی، از سنگ سفید تراشیده، در انتهای بن‌بستِ دره‌ای جنگلی در تریالتی؛ زمانی
    کارگاه نسخه‌نویسی، که بخشی از گنجینه‌اش امروز در مسکو است.
  body: >-
    **کواتاخوی در انتهای درهٔ خودش پنهان است، از سه سو در میان دامنه‌های پرشیب شمالی رشته‌کوه تریالتی
    محصور، و تا وقتی جاده ناگهان به دروازه ختم نشود، چیزی از آن نمی‌بینید.**


    کلیسا در سده‌های دوازدهم و سیزدهم ساخته شده و از همان خانوادهٔ بتانیا، پیتارتی و تیموتسوبانی است.
    بنایی است گنبددار به شیوهٔ «صلیب محاط در مربع»، با نقشه‌ای کمابیش مربع؛ گنبدش بر دو پایهٔ آزاد و دو
    پایهٔ دیگر که در دیوارهای محراب ادغام شده‌اند استوار است. دو در دارد، در جنوب و غرب. دیوارها با سنگ
    سفیدِ ظریف‌تراش روکش شده‌اند؛ کنده‌کاری‌ها گرد پنجره‌ها و در پای گنبد انبوه‌تر می‌شوند و صلیبی بزرگ
    و پرنقش بر نمای شرقی فرمان می‌راند.


    اینجا هرگز تنها جای نیایش نبود. راهبان در این صومعه دست‌نوشته‌ها را رونویسی می‌کردند و گنجینه‌اش جواهرات
    گرجی سده‌های میانه را در خود داشت، که بخش بزرگی از آن‌ها سرانجام به موزهٔ دولتی تاریخ در مسکو رسید
    و هنوز همان‌جا به نمایش گذاشته می‌شود. به روایت سنت کلیسایی، صومعه شمایلی معجزه‌گر از «آرمیدن مریم
    مقدس» و پاره‌ای از ردای مریم را نگه می‌دارد.


    سپاهیان تیمور در سدهٔ چهاردهم صومعه را سخت ویران کردند. بارها مرمت شد، کامل‌تر از همه در ۱۸۵۴ به دست
    شاهزاده ایوانه تارخان-موراوی، و ناقوس‌خانهٔ درون حصار در ۱۸۷۲ افزوده شد.


    امروز صومعه باز هم زنده و فعال است، و آرامش اینجا پاس داشته می‌شود، نه به نمایش گذاشته؛ جاده‌ای که
    شما را به اینجا آورد همین‌جا تمام می‌شود، و برای یک ساعت، باقی دنیا هم.
  tip: >-
    ورود رایگان است. این صومعه فعال است: بانوان به روسری و دامن نیاز دارند و آقایان به شلوار بلند؛ معمولاً
    پوشش‌هایی کنار دروازه گذاشته‌اند. پیش از عکاسی در درون اجازه بگیرید، و انتظار داشته باشید که گاه هنگام
    آیین‌ها کلیسا بسته باشد. کافه‌ای نیست، پس آب و خوراک را در کاوتیسخوی بخرید. دره آشکارا خنک‌تر از دشت
    مِتکواری است، پس حتی در تابستان یک لایه لباس اضافه بیاورید. یک ساعت برای خود صومعه بس است؛ با رانندگی
    در دره، یک ساعت و نیم در نظر بگیرید.
  route: >-
    از تفلیس با S1 (E60) به سوی متسختا بیرون بروید، سپس به جادهٔ قدیمی گوری (Sh29) بپیچید که در کرانهٔ
    جنوبی مِتکواری به سمت غرب تا کاوتیسخوی می‌رود، حدود ۴۵ کیلومتر از مرکز شهر. کمی پس از روستا، به سمت
    جنوب وارد جادهٔ تسینارخی–کواتاخوی (Sh131) شوید و حدود ۱۰ کیلومتر در دل دره پیش بروید تا جاده کنار
    صومعه به پایان برسد. روی‌هم حدود ۵۸ کیلومتر و یک ساعت و ربع. تکهٔ پایانی باریک است، با لبه‌های فرسوده
    و پل‌های کوچک، اما در هوای خشک یک خودروی اقتصادی هم از پسش برمی‌آید. در تفلیس یا متسختا سوخت بگیرید؛
    روی زمین هموار جلوی دروازه پارک کنید.
he:
  name: מנזר קוואטאחווי
  short: >-
    כנסיית כיפה מתור הזהב, מאבן לבנה מסותתת, בקצה ללא מוצא של ערוץ מיוער בטריאלטי; פעם בית העתקה לכתבי
    יד, וחלק מאוצרו נמצא היום במוסקבה.
  body: >-
    **קוואטאחווי מסתתר בקצה הערוץ שלו, סגור משלושה צדדים במדרונות הצפוניים התלולים של רכס טריאלטי, ואינכם
    רואים ממנו דבר עד שהדרך פשוט נגמרת בשער.**


    הכנסייה נבנתה במאות ה-12 וה-13 והיא שייכת לאותה משפחה כמו בטאניה, פיטארטי וטימוטסובאני. זוהי כנסיית
    כיפה בתוכנית צלב חסום בריבוע, כמעט רבועה; הכיפה נישאת על שני עמודים עצמאיים ועל שניים נוספים המשולבים
    בקירות המזבח. יש לה שני פתחים, בדרום ובמערב. הקירות מחופים אבן לבנה מסותתת בקפידה; הגילוף מתעבה סביב
    החלונות ובבסיס הכיפה, וצלב גדול ומעוטר שולט בחזית המזרחית.


    המקום הזה מעולם לא היה רק מקום תפילה. נזירים העתיקו כאן כתבי יד, ובאוצר נשמרו תכשיטים גאורגיים מימי
    הביניים, שרבים מהם הגיעו בסופו של דבר למוזיאון ההיסטורי הממלכתי במוסקבה, ושם הם מוצגים עד היום. לפי
    מסורת הכנסייה, שמורות במנזר איקונה מחוללת נסים של הירדמות מרים הבתולה ופיסה מגלימתה.


    צבאות טימור פגעו במנזר קשות במאה ה-14. הוא שוקם יותר מפעם אחת, ביסודיות הרבה ביותר ב-1854 בידי הנסיך
    איוואנה טרחאן-מוראווי, ומגדל הפעמונים שבתוך החומות נוסף ב-1872.


    היום זהו שוב מנזר פעיל, והשקט כאן נשמר ואינו מבוים; הדרך שהביאה אתכם לכאן פשוט נגמרת, ולשעה אחת נגמר
    איתה גם כל שאר העולם.
  tip: >-
    הכניסה חופשית. זהו מנזר פעיל: נשים צריכות כיסוי ראש וחצאית, גברים מכנסיים ארוכים, ובדרך כלל משאירים
    ליד השער בדים להתעטף בהם. בקשו רשות לפני צילום בפנים, והיו מוכנים לכך שלעיתים הכנסייה סגורה בזמן תפילות.
    אין בית קפה, לכן קנו מים ואוכל בקאווטיסחווי. הערוץ קריר בהרבה ממישור המטקוורי, אז הביאו שכבה נוספת
    גם בקיץ. שעה במנזר מספיקה; עם הנסיעה בערוץ הקדישו שעה וחצי.
  route: >-
    צאו מטביליסי בכביש S1 (E60) לכיוון מצחתה, ומשם עברו לדרך גורי הישנה (Sh29), שעוברת מערבה לאורך הגדה
    הדרומית של המטקוורי עד קאווטיסחווי, כ-45 ק"מ ממרכז העיר. מעט אחרי הכפר פנו דרומה לכביש צינארחי–קוואטאחווי
    (Sh131) והמשיכו בו כ-10 ק"מ לתוך הערוץ, עד שהוא מסתיים במנזר. בסך הכול כ-58 ק"מ ושעה ורבע. הקטע האחרון
    צר, עם שוליים מתפוררים וגשרונים, אבל במזג אוויר יבש גם רכב חסכוני מסתדר. תדלקו בטביליסי או במצחתה;
    חנו על השטח המישורי שלפני השער.
ar:
  name: دير كفاتاخيفي
  short: >-
    كنيسة مقبّبة من العصر الذهبي من الحجر الأبيض المنحوت، في نهاية مسدودة لوادٍ مشجّر في تريالتي؛ كانت
    مَنسخاً للمخطوطات، وجزء من كنزها اليوم في موسكو.
  body: >-
    **يختبئ كفاتاخيفي في نهاية واديه الخاص، تحاصره من ثلاث جهات المنحدرات الشمالية الشديدة لسلسلة تريالتي،
    فلا ترون منه شيئاً حتى ينتهي الطريق ببساطة عند البوابة.**


    بُنيت الكنيسة في القرنين الثاني عشر والثالث عشر، وتنتمي إلى العائلة نفسها التي تضم بيتانيا وبيتاريتي
    وتيموتيسوباني. إنها كنيسة مقبّبة على مخطط الصليب المدرج في مربع، يكاد مسقطها يكون مربعاً؛ وتقوم القبة
    على دعامتين قائمتين بذاتهما واثنتين أخريين مندمجتين في جدران الهيكل. ولها بابان، في الجنوب والغرب.
    كُسيت الجدران بحجر أبيض منحوت بإتقان، ويتكاثف النحت حول النوافذ وعند قاعدة القبة، فيما يتصدر الواجهة
    الشرقية صليب كبير مزخرف.


    لم يكن هذا المكان يوماً للصلاة وحدها. فقد نسخ الرهبان المخطوطات هنا، وضمّت خزانته حُلياً جورجية من
    العصور الوسطى انتهى كثير منها إلى متحف الدولة التاريخي في موسكو، حيث تُعرض حتى اليوم. وتقول التقاليد
    الكنسية إن الدير يحفظ أيقونة عجائبية لرقاد السيدة العذراء وقطعة من ثوبها.


    ألحقت جيوش تيمور بالدير أضراراً جسيمة في القرن الرابع عشر. ورُمّم أكثر من مرة، وأشمل ذلك في عام 1854
    على يد الأمير إيفانه ترخان-موراوي، وأُضيف برج الأجراس داخل الأسوار عام 1872.


    اليوم عاد الدير عامراً بالرهبان، والسكينة هنا مصونة لا مصطنعة؛ فالطريق الذي جاء بكم ينتهي هنا ببساطة،
    وينتهي معه، لساعة من الزمن، سائر العالم.
  tip: >-
    الدخول مجاني. هذا دير عامر: تحتاج النساء إلى غطاء رأس وتنورة، والرجال إلى سراويل طويلة، وعادةً تُترك
    أردية عند البوابة. استأذنوا قبل التصوير في الداخل، وتوقعوا أن تُغلق الكنيسة أحياناً أثناء الصلوات.
    لا مقهى هنا، فاشتروا الماء والطعام من كافتيسخيفي. الوادي أبرد بوضوح من سهل متكفاري، فاحملوا طبقة إضافية
    من الثياب حتى في الصيف. تكفي ساعة في الدير نفسه؛ ومع القيادة عبر الوادي خصّصوا ساعة ونصفاً.
  route: >-
    غادروا تبليسي على الطريق S1 (E60) باتجاه متسخيتا، ثم انتقلوا إلى طريق غوري القديم (Sh29) الذي يمتد
    غرباً على الضفة الجنوبية لنهر متكفاري حتى كافتيسخيفي، على بعد نحو 45 كم من وسط المدينة. بعد القرية
    مباشرة انعطفوا جنوباً إلى طريق تسيناريخي–كفاتاخيفي (Sh131) وتابعوه نحو 10 كم داخل الوادي حتى ينتهي
    عند الدير. المسافة كلها نحو 58 كم وساعة وربع. المقطع الأخير ضيق، حوافه متآكلة وفيه جسور صغيرة، لكن
    سيارة اقتصادية تتدبّر أمرها في الطقس الجاف. تزوّدوا بالوقود في تبليسي أو متسخيتا، واركنوا على الأرض
    المستوية أمام البوابة.
