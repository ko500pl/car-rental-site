ka:
  name: ქვათახევის მონასტერი
  short: >-
    XII-XIII საუკუნეების გუმბათოვანი ტაძარი ტყიან ხეობაში კავთისხევის ზემოთ, თემურ-ლენგის შემოსევის მძიმე
    მეხსიერებით.
  body: >-
    **ქვათახევს იმ ადგილას აშენებდნენ, სადაც ვერავინ შემთხვევით მოხვდებოდა.** სოფელ კავთისხევიდან ვიწრო
    ხეობა შვიდიოდე კილომეტრს მიიკლაკნება ტრიალეთის ქედის ფერდობებში და მხოლოდ ბოლო მოსახვევში იშლება მონასტრის
    გალავანი და გუმბათი.


    მთავარი ტაძარი XII საუკუნის ბოლოსა და XIII საუკუნის დასაწყისს განეკუთვნება — ქართული ხუროთმოძღვრების
    ოქროს ხანას. ჯვარგუმბათოვანი ნაგებობაა კარგად გათლილი ქვის მოპირკეთებით; გუმბათის ყელი ბრმა თაღებით
    და ორნამენტული სარკმლის ჩარჩოებით არის დამუშავებული. დეკორი თავშეკავებულია სამთავისთან შედარებით,
    სამაგიეროდ პროპორციები უფრო მკაცრი და კრებულია.


    1400 წელს თემურ-ლენგის ლაშქარმა მონასტერი აიღო. ქართული ტრადიცია ამბობს, რომ ბერები და შეხიზნული გლეხები
    ტაძარში ჩაკეტეს და ცეცხლი წაუკიდეს; შიდა კედლების ჭვარტლს დღემდე ამ ამბავს უკავშირებენ. თუ ეს რომელიმე
    კონკრეტულ ხანძარს ასახავს თუ არა, ისტორიკოსები კამათობენ, მაგრამ ნგრევის კვალი რეალურია და ტაძარი
    მოგვიანებით რამდენჯერმე შეაკეთეს.


    შიგნით შემორჩენილია XVI საუკუნის მოხატულობის ფრაგმენტები — მუქი, დაზიანებული, მაგრამ ადგილ-ადგილ სახეები
    ჯერ კიდევ იკითხება. გალავანში ასევე დგას სამრეკლო და საცხოვრებელი კორპუსები. ეს მოქმედი მამათა მონასტერია:
    ბერები ხილის ბაღს და ფუტკარს უვლიან, ეზო მოვლილია, სიჩუმე კი ნამდვილი. გაზაფხულზე ხეობა ყვავილობს,
    შემოდგომაზე ფოთოლი წითლდება და მონასტერი მაშინ ყველაზე ლამაზია.
  tip: >-
    დაათვალიერეთ დაუჩქარებლად — ერთნახევარი საათი გზასთან ერთად რეალურია. ეს მოქმედი მონასტერია: ქალებს
    სჭირდებათ თავსაფარი და გრძელი კაბა, მამაკაცებს გრძელი შარვალი; მოსასხამები კართან დევს. შიგნით ფოტოს
    გადაღება არ არის მისაღები. ტუალეტი მარტივია, კაფე არ არის — წყალი და საჭმელი კავთისხევში იყიდეთ. ხეობაში
    ზაფხულშიც გრილა, თხელი ქურთუკი გამოგადგებათ. ბერების საქმიანობის დროს ტაძარი ხანდახან დაკეტილია.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით, კავთისხევის გასასვლელამდე — დაახლოებით 45 კმ. იქიდან სამხრეთით
    გაუხვევთ და ხეობის გზას გაჰყვებით 13 კმ-ს მონასტრამდე. სულ 58 კმ, დაახლოებით საათი და თხუთმეტი წუთი.
    სოფლამდე ასფალტია, ხეობის მონაკვეთი ვიწროა, ადგილ-ადგილ ჩამონგრეული კიდეებით და მცირე ხიდებით, თუმცა
    მშრალ ამინდში ეკონომ-კლასის მანქანა ადვილად გაივლის. საწვავი კასპში აიღეთ. პარკინგი გალავნის წინ,
    უფასოა.
en:
  name: Kvatakhevi Monastery
  short: >-
    A domed church of the 12th and 13th centuries in a wooded gorge above Kavtiskhevi, carrying a hard
    memory of Timur's invasion.
  body: >-
    **Kvatakhevi was built where nobody would arrive by accident.** From the village of Kavtiskhevi a
    narrow gorge winds seven kilometres into the flanks of the Trialeti range, and only at the last bend
    does the enclosure wall and its dome come into view.


    The main church belongs to the late 12th and early 13th centuries, the Georgian Golden Age. It is
    a cross-in-square building faced in well-cut ashlar; the drum carries blind arcading and carved window
    surrounds. The decoration is restrained next to Samtavisi, but the proportions are tighter and more
    controlled, and the interior space feels considerably larger than the exterior suggests.


    In 1400 Timur's army took the monastery. Georgian tradition holds that the monks and the peasants
    sheltering with them were shut inside the church and burned; the soot on the inner walls has been
    read that way ever since. Historians argue about whether it records one specific fire, but the evidence
    of destruction is real, and the church was patched up repeatedly afterwards.


    Inside, fragments of 16th-century wall painting survive — dark, damaged, but with faces still legible
    in places. A bell tower and monastic quarters stand within the same wall. This is a working male monastery:
    the brothers keep an orchard and beehives, the courtyard is tended, and the quiet is genuine rather
    than staged. The gorge is at its best in spring, when the fruit trees flower, and in late October,
    when the oak and hornbeam turn.
  tip: >-
    Give it an unhurried hour and a half including the drive in. This is an active monastery: women need
    a headscarf and a long skirt, men long trousers, and wraps are left by the gate. Photography inside
    the church is not welcome. Toilets are basic and there is no cafe, so buy water and food in Kavtiskhevi.
    The gorge stays cool even in July, so bring a light jacket. The church is occasionally locked during
    services or work hours.
  route: >-
    Take the E60 from Tbilisi towards Gori and leave it at the Kavtiskhevi exit, about 45 km out. Turn
    south and follow the gorge road 13 km to the monastery — 58 km in all, roughly an hour and a quarter.
    Asphalt runs as far as the village; the gorge section is narrow, with crumbling edges and small bridges,
    but in dry weather an economy car handles it without trouble. Refuel in Kaspi. Parking is free on
    the flat ground in front of the gate.
ru:
  name: Монастырь Кватахеви
  short: Купольный храм XII-XIII веков в лесистом ущелье над Кавтисхеви, хранящий тяжёлую память о нашествии
    Тимура.
  body: >-
    **Кватахеви построили там, куда случайно не попадёшь.** От села Кавтисхеви узкое ущелье вьётся семь
    километров вглубь отрогов Триалетского хребта, и только на последнем повороте открываются ограда и
    купол.


    Главный храм относится к концу XII — началу XIII века, к грузинскому золотому веку. Это крестово-купольное
    здание, облицованное хорошо тёсаным камнем; барабан обработан глухими арками и резными обрамлениями
    окон. Декор сдержаннее, чем в Самтависи, зато пропорции строже и собраннее, а внутреннее пространство
    ощущается заметно больше, чем обещает фасад.


    В 1400 году монастырь взяло войско Тимура. Грузинское предание говорит, что монахов и укрывшихся у
    них крестьян заперли в храме и сожгли; копоть на внутренних стенах с тех пор читают именно так. Историки
    спорят, отражает ли она один конкретный пожар, но следы разрушения реальны, и храм потом не раз чинили.


    Внутри сохранились фрагменты росписи XVI века — тёмные, повреждённые, но местами лица ещё читаются.
    В той же ограде стоят колокольня и жилые корпуса. Это действующий мужской монастырь: братия держит
    фруктовый сад и пасеку, двор ухожен, тишина настоящая, а не поставленная. Ущелье лучше всего весной,
    когда цветут плодовые деревья, и в конце октября, когда желтеет дуб и граб.
  tip: >-
    Заложите неспешные полтора часа вместе с дорогой. Монастырь действующий: женщинам нужны платок и длинная
    юбка, мужчинам — длинные брюки; накидки лежат у ворот. Съёмка внутри храма нежелательна. Туалет простой,
    кафе нет — воду и еду купите в Кавтисхеви. В ущелье прохладно даже в июле, пригодится лёгкая куртка.
    Иногда храм закрыт во время службы или работ.
  route: >-
    По E60 из Тбилиси в сторону Гори, съезд на Кавтисхеви примерно на 45-м километре. Дальше поворот на
    юг и 13 км по дороге вдоль ущелья до монастыря — всего 58 км, около часа с четвертью. До села асфальт;
    участок в ущелье узкий, с осыпающимися кромками и небольшими мостами, но в сухую погоду машина эконом-класса
    проходит его без проблем. Заправляйтесь в Каспи. Парковка бесплатная, на ровной площадке перед воротами.
fa:
  name: صومعهٔ کواتاخوی
  short: >-
    کلیسایی گنبددار از سده‌های دوازدهم و سیزدهم در درّه‌ای جنگلی بالای کاوتیسخوی، با خاطره‌ای سنگین از
    حملهٔ تیمور.
  body: >-
    **کواتاخوی جایی ساخته شد که کسی تصادفی به آن نمی‌رسد.** از روستای کاوتیسخوی درّه‌ای باریک هفت کیلومتر
    در دامنه‌های رشتهٔ تریالتی می‌پیچد و تنها در آخرین پیچ است که دیوار محوطه و گنبد پدیدار می‌شوند.


    کلیسای اصلی به اواخر سدهٔ دوازدهم و آغاز سدهٔ سیزدهم، یعنی عصر زرین گرجستان، تعلق دارد. بنایی است
    چلیپایی با پوشش سنگ تراشیدهٔ دقیق؛ گردن گنبد با طاق‌نماهای کور و قاب‌های کنده‌کاری‌شدهٔ پنجره پرداخت
    شده است. تزیین در سنجش با سامتاویسی خویشتن‌دارتر است، اما تناسبات فشرده‌تر و سنجیده‌ترند و فضای درونی
    به‌مراتب بزرگ‌تر از آن می‌نماید که نما وعده می‌دهد.


    در سال ۱۴۰۰ سپاه تیمور صومعه را گرفت. روایت گرجی می‌گوید راهبان و روستاییانی که به آنان پناه برده
    بودند در کلیسا محبوس و سوزانده شدند؛ دوده‌ای که بر دیوارهای درونی مانده از آن زمان چنین خوانده می‌شود.
    تاریخ‌نگاران بر سر اینکه این نشان یک آتش‌سوزی معین باشد اختلاف دارند، اما نشانه‌های ویرانی واقعی‌اند
    و کلیسا بارها پس از آن مرمت شده است.


    در درون، پاره‌هایی از نقاشی دیواری سدهٔ شانزدهم مانده است؛ تیره و آسیب‌دیده، اما جای‌جای چهره‌ها هنوز
    خوانده می‌شوند. برج ناقوس و ساختمان‌های راهبان در همان محوطه‌اند. اینجا صومعه‌ای فعال و مردانه است:
    برادران باغ میوه و کندوی زنبور دارند، حیاط رسیدگی‌شده است و سکوت واقعی است نه نمایشی. درّه در بهار،
    هنگام شکوفهٔ درختان میوه، و در اواخر مهر، هنگام زردی بلوط، بهترین حال خود را دارد.
  tip: >-
    یک ساعت‌ونیم بی‌شتاب همراه با راه رفت کافی است. اینجا صومعه‌ای فعال است: زنان به روسری و دامن بلند
    و مردان به شلوار بلند نیاز دارند؛ پوشش‌ها کنار دروازه گذاشته شده‌اند. عکاسی درون کلیسا پسندیده نیست.
    سرویس بهداشتی ساده است و کافه‌ای نیست، پس آب و خوراک را در کاوتیسخوی بخرید. درّه حتی در تیر خنک است
    و کاپشن نازک به کار می‌آید. گاهی کلیسا هنگام مراسم یا کار بسته است.
  route: >-
    از تفلیس روی E60 به سوی گوری بروید و در خروجی کاوتیسخوی، حدود کیلومتر ۴۵، از آن جدا شوید. سپس به جنوب
    بپیچید و ۱۳ کیلومتر جادهٔ درّه را تا صومعه دنبال کنید — روی‌هم ۵۸ کیلومتر، نزدیک یک ساعت و ربع. تا
    روستا آسفالت است؛ بخش درّه باریک است، با لبه‌های ریزشی و پل‌های کوچک، اما در هوای خشک خودروی اقتصادی
    به‌راحتی از آن می‌گذرد. سوخت را در کاسپی بگیرید. پارکینگ رایگان است، روی زمین همواری پیش از دروازه.
he:
  name: מנזר קוואטאחווי
  short: כנסייה מכופפת מן המאות ה-12 וה-13 בערוץ מיוער מעל קאווטיסחווי, הנושאת זיכרון קשה מפלישת תימור.
  body: >-
    **קוואטאחווי נבנה במקום שאליו איש אינו מגיע במקרה.** מן הכפר קאווטיסחווי מתפתל ערוץ צר שבעה קילומטרים
    אל תוך מדרונות רכס טריאלטי, ורק בעיקול האחרון נגלים חומת המתחם והכיפה.


    הכנסייה המרכזית שייכת לשלהי המאה ה-12 ולראשית המאה ה-13, תור הזהב הגאורגי. זהו מבנה צלב-בריבוע מחופה
    אבן גזית מהוקצעת היטב; התוף נושא קשתות עיוורות ומסגרות חלון מגולפות. העיטור מאופק לעומת סמטאוויסי,
    אך היחסים הדוקים ומדודים יותר, והחלל הפנימי נדמה גדול בהרבה ממה שהחזית מבטיחה.


    בשנת 1400 כבש צבא תימור את המנזר. המסורת הגאורגית מספרת שהנזירים והאיכרים שחסו עימם ננעלו בכנסייה
    ונשרפו; הפיח על הקירות הפנימיים נקרא כך מאז. היסטוריונים חלוקים אם הוא מתעד שריפה מסוימת אחת, אך עדויות
    ההרס אמיתיות, והכנסייה תוקנה שוב ושוב לאחר מכן.


    בפנים שרדו שברי ציורי קיר מן המאה ה-16 — כהים, פגועים, אך במקומות אחדים עדיין אפשר לקרוא פנים. באותה
    חומה עומדים גם מגדל פעמונים ומגורי הנזירים. זהו מנזר גברים פעיל: האחים מטפחים מטע ומכוורת, החצר מטופחת,
    והשקט אמיתי ולא מבוים. הערוץ יפה במיוחד באביב, כשעצי הפרי פורחים, ובסוף אוקטובר, כשהאלון מצהיב.
  tip: >-
    הקצו שעה וחצי נינוחה, כולל הנסיעה פנימה. זהו מנזר פעיל: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים
    למכנסיים ארוכים; כיסויים מונחים ליד השער. צילום בתוך הכנסייה אינו רצוי. השירותים בסיסיים ואין בית
    קפה, לכן קנו מים ואוכל בקאווטיסחווי. בערוץ קריר גם ביולי, וכדאי מעיל קל. לעיתים הכנסייה נעולה בשעת
    תפילה או עבודה.
  route: >-
    סעו מטביליסי בכביש E60 לכיוון גורי וצאו ביציאת קאווטיסחווי, בערך בקילומטר 45. פנו דרומה ועקבו אחרי
    דרך הערוץ 13 ק״מ עד המנזר — 58 ק״מ בסך הכול, כשעה ורבע. האספלט מגיע עד הכפר; קטע הערוץ צר, עם שוליים
    מתפוררים וגשרים קטנים, אך במזג אוויר יבש רכב חסכוני עובר אותו בלי קושי. תדלקו בקאספי. החניה חינם,
    על משטח מיושר לפני השער.
ar:
  name: دير كفاتاخيفي
  short: كنيسة ذات قبة من القرنين الثاني عشر والثالث عشر في وادٍ حرجي فوق كافتيسخيفي، تحمل ذكرى قاسية
    لغزو تيمور.
  body: >-
    **بُني كفاتاخيفي حيث لا يصل أحد مصادفة.** من قرية كافتيسخيفي يتلوى وادٍ ضيق سبعة كيلومترات في سفوح
    سلسلة تريالتي، وعند المنعطف الأخير وحده يظهر السور والقبة.


    تعود الكنيسة الرئيسية إلى أواخر القرن الثاني عشر ومطلع الثالث عشر، أي العصر الذهبي الجورجي. وهي بناء
    صليبي داخل مربع مكسو بحجر منحوت بدقة؛ وتحمل رقبة القبة عقوداً صمّاء وأطر نوافذ منقوشة. والزخرفة هنا
    أكثر تحفظاً مما في سامتافيسي، لكن النسب أشد إحكاماً، ويبدو الفراغ الداخلي أوسع بكثير مما توحي به الواجهة.


    في عام 1400 استولى جيش تيمور على الدير. وتقول الرواية الجورجية إن الرهبان والفلاحين الذين لجأوا إليهم
    أُغلق عليهم داخل الكنيسة وأُحرقوا؛ ومنذ ذلك الحين يُقرأ السخام على الجدران الداخلية على هذا النحو.
    ويختلف المؤرخون في ما إذا كان يوثق حريقاً بعينه، غير أن آثار الدمار حقيقية، وقد رُمّمت الكنيسة مراراً
    بعد ذلك.


    وفي الداخل بقيت شذرات من تصوير جداري يعود إلى القرن السادس عشر: داكنة ومتضررة، لكن الوجوه ما زالت
    تُقرأ في مواضع منها. ويقوم داخل السور نفسه برج أجراس ومساكن الرهبان. وهذا دير عامل للرجال: يعتني الإخوة
    ببستان فاكهة وخلايا نحل، والفناء معتنى به، والسكون حقيقي لا مصطنع. والوادي في أبهى حالاته في الربيع
    حين تزهر أشجار الفاكهة، وفي أواخر تشرين الأول حين يصفرّ البلوط.
  tip: >-
    خصص ساعة ونصفاً بلا عجلة، مع طريق الدخول. هذا دير عامل: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال
    إلى بنطال طويل؛ والأغطية موضوعة عند البوابة. والتصوير داخل الكنيسة غير مستحب. دورات المياه بسيطة ولا
    مقهى، فاشترِ الماء والطعام في كافتيسخيفي. والوادي بارد حتى في تموز، فخذ سترة خفيفة. وقد تُغلق الكنيسة
    أحياناً أثناء القداس أو العمل.
  route: >-
    خذ الطريق E60 من تبليسي نحو غوري واخرج عند مخرج كافتيسخيفي على بعد نحو 45 كم. ثم اتجه جنوباً واتبع
    طريق الوادي 13 كم حتى الدير — 58 كم إجمالاً، نحو ساعة وربع. الإسفلت يمتد حتى القرية؛ ومقطع الوادي
    ضيق بحواف متآكلة وجسور صغيرة، لكن سيارة اقتصادية تجتازه بلا عناء في الطقس الجاف. تزوّد بالوقود في
    كاسبي. والوقوف مجاني على أرض مستوية أمام البوابة.
