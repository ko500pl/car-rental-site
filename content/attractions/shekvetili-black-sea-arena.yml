ka:
  name: შეკვეთილი და შავი ზღვის არენა
  short: ფიჭვნარით შემოსილი კურორტი ურეკის გვერდით და საქართველოს ყველაზე დიდი საკონცერტო დარბაზი.
  body: >-
    **შეკვეთილი ურეკის უფრო მშვიდი მეზობელია.** ის იმავე მაგნიტური ქვიშის ზოლზეა, სულ რამდენიმე კილომეტრით
    სამხრეთით, მაგრამ ნაპირსა და გზას შორის ფიჭვნარია — საბჭოთა დროს დარგული, დღეს კი უკვე მაღალი და სქელი.
    სწორედ ეს განასხვავებს: ურეკში სასტუმროები პირდაპირ ქვიშაზეა, შეკვეთილში კი ტყე ჯერ ჩრდილს იძლევა.

    ქვიშა აქაც შავია და მაგნიტიტს შეიცავს, ისევე როგორც ურეკში. მაისსა და ივნისში ჰაერი ფიჭვის სუნით ივსება
    და ტემპერატურა ტყეში ორი-სამი გრადუსით დაბალია, ვიდრე ღია პლაჟზე — ეს იმ ოჯახებისთვის მნიშვნელოვანია,
    ვისთვისაც შუადღის მზე პრობლემაა.

    შეკვეთილის მეორე მიზეზი **შავი ზღვის არენაა** — ღია საკონცერტო კომპლექსი, რომელიც 2016 წელს გაიხსნა
    და ათი ათასზე მეტ მაყურებელს იტევს. აქუსტიკა სერიოზულადაა გათვლილი, სცენა კი ტყისა და ზღვის ფონზეა.
    კონცერტების განრიგი ზაფხულის თვეებზეა კონცენტრირებული და წელიწადში რამდენიმე დიდი სახელი მაინც ჩამოდის.
    დანარჩენ დროს კომპლექსი ცარიელია და დათვალიერების საგანი არაა.

    პრაქტიკული სურათი:

    - **სასტუმროები და კოტეჯები** ტყეში, ურეკზე იაფი და მშვიდი

    - **პლაჟი** განიერი, ჩაშვება მშვიდი, ბავშვისთვის ურეკზე უკეთესი

    - **კაფეები** სეზონურია — ოქტომბრიდან მაისამდე ნახევარი დახურულია

    კონცერტის ღამეს გზა ურეკსა და შეკვეთილს შორის იკეტება და პარკინგი პრობლემად იქცევა; ბილეთით მოსულს
    ჯობია ორი საათით ადრე ჩამოვიდეს.
  tip: >-
    ნახევარი დღე პლაჟისთვის. კონცერტის ღამეს გზა და პარკინგი გადატვირთულია — ორი საათით ადრე ჩამოდი და
    მანქანა ტყის მხარეს დატოვე. ტყეში ჩრდილია, პლაჟზე კი თითქმის არა: ქოლგა წაიღე. ტუალეტი და შხაპი ძირითადად
    კაფეებთანაა. სექტემბერი საუკეთესო თვეა — წყალი თბილია, ხალხი აღარაა და ფასებიც ეცემა.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთისა და გრიგოლეთის გავლით ურეკამდე და კიდევ
    ხუთი კილომეტრი — 325 კმ, დაახლოებით ოთხი საათი ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია. ზაფხულის შაბათ-კვირას
    სამტრედიის შემდეგ მოძრაობა ნელია. საწვავი ლანჩხუთსა და ურეკშია. კურორტში პარკინგი სასტუმროებთანაა,
    სეზონზე ფასიანი. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Shekvetili and the Black Sea Arena
  short: A pine-shaded resort next to Ureki, and Georgia's largest open-air concert venue.
  body: >-
    **Shekvetili is Ureki's quieter neighbour.** It sits on the same belt of magnetic sand a few kilometres
    south, but between the road and the shore there is pine forest, planted in Soviet times and now tall
    and dense. That is the difference: in Ureki the guesthouses stand directly on the sand, while in Shekvetili
    the forest comes first.

    The sand here is black and magnetite-bearing, exactly as at Ureki. In May and June the air fills with
    resin and the temperature under the pines runs two or three degrees below the open beach — which matters
    if midday sun is a problem for your family.

    The second reason to come is the **Black Sea Arena**, an open-air concert complex opened in 2016 with
    capacity for more than ten thousand. The acoustics were designed seriously and the stage sits against
    forest and sea. The programme is concentrated in the summer months and each year brings at least a
    few large names. Outside those dates the complex is empty and there is nothing to look at.

    The practical picture:

    - **Hotels and cottages** in the pine woods, cheaper and quieter than Ureki

    - A **wide beach** with a gentle shelf, better for small children than Ureki

    - **Seasonal cafes** — half of them are shut from October to May

    On concert nights the road between Ureki and Shekvetili backs up and parking becomes a real problem;
    if you have tickets, arrive two hours early.
  tip: >-
    Half a day for the beach. On concert nights the road and the car parks are overwhelmed, so come two
    hours early and leave the car on the forest side. There is shade among the pines but almost none on
    the sand, so bring an umbrella. Toilets and showers are mostly attached to the cafes. September is
    the best month — the water is warm, the crowds have gone and prices drop.
  route: >-
    From Tbilisi take the E60 to Samtredia, then head south through Lanchkhuti and Grigoleti to Ureki
    and five kilometres further — 325 km, about four hours forty-five. The road is asphalt the whole way.
    On summer weekends traffic after Samtredia is slow. Fuel is available at Lanchkhuti and Ureki. Parking
    in the resort is at the hotels and charged in season. An economy car is entirely sufficient.
ru:
  name: Шекветили и Black Sea Arena
  short: Курорт в сосновом лесу рядом с Уреки и крупнейшая открытая концертная площадка Грузии.
  body: >-
    **Шекветили — более тихий сосед Уреки.** Он лежит на той же полосе магнитного песка, всего в нескольких
    километрах южнее, но между дорогой и берегом здесь сосновый лес, посаженный в советское время и уже
    высокий и густой. В этом и разница: в Уреки гостевые дома стоят прямо на песке, а в Шекветили сначала
    идёт лес.

    Песок тут тоже чёрный, с магнетитом, как и в Уреки. В мае и июне воздух наполняется смолой, а температура
    под соснами на два-три градуса ниже, чем на открытом пляже, — это важно, если полуденное солнце для
    вашей семьи проблема.

    Вторая причина приехать — **Black Sea Arena**, открытый концертный комплекс, запущенный в 2016 году
    и вмещающий больше десяти тысяч человек. Акустику рассчитывали всерьёз, а сцена стоит на фоне леса
    и моря. Программа сосредоточена в летних месяцах, и каждый год сюда приезжает хотя бы несколько крупных
    имён. В остальное время комплекс пуст и смотреть там нечего.

    Практическая картина:

    - **Гостиницы и коттеджи** в сосняке, дешевле и тише, чем в Уреки

    - **Широкий пляж** с плавным входом, для маленьких детей лучше, чем в Уреки

    - **Сезонные кафе** — половина закрыта с октября по май

    В концертные вечера дорога между Уреки и Шекветили встаёт, а парковка превращается в настоящую проблему;
    с билетами лучше приезжать за два часа.
  tip: >-
    Полдня на пляж. В концертные вечера дорога и парковки перегружены, приезжайте за два часа и оставляйте
    машину со стороны леса. В сосняке тень есть, на песке почти нет — берите зонт. Туалеты и души в основном
    при кафе. Сентябрь — лучший месяц: вода тёплая, толпы нет, цены падают.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути и Григолети до Уреки и ещё пять километров
    — 325 км, около четырёх часов сорока пяти минут. Дорога асфальтированная всю дорогу. По летним выходным
    после Самтредиа движение медленное. Заправки в Ланчхути и Уреки. Парковка на курорте при гостиницах,
    в сезон платная. Машины эконом-класса вполне достаточно.
fa:
  name: شکوتیلی و آرنای دریای سیاه
  short: تفرجگاهی در سایهٔ کاج‌ها کنار اورکی، و بزرگ‌ترین سالن روباز کنسرت گرجستان.
  body: >-
    **شکوتیلی همسایهٔ آرام‌تر اورکی است.** روی همان نوار ماسهٔ مغناطیسی نشسته، چند کیلومتر جنوب‌تر، اما
    میان جاده و ساحل جنگل کاج هست؛ کاج‌هایی که در دوران شوروی کاشته شدند و اکنون بلند و انبوه‌اند. تفاوت
    همین است: در اورکی مهمان‌پذیرها مستقیم روی ماسه‌اند و در شکوتیلی نخست جنگل می‌آید.

    ماسه اینجا هم سیاه و مگنتیت‌دار است، درست مانند اورکی. در اردیبهشت و خرداد هوا از بوی صمغ پر می‌شود
    و دما زیر کاج‌ها دو سه درجه پایین‌تر از ساحل باز است — و این برای خانواده‌هایی که آفتاب ظهر برایشان
    دردسر است اهمیت دارد.

    دلیل دوم آمدن **آرنای دریای سیاه** است، مجموعهٔ کنسرت روبازی که در ۲۰۱۶ گشوده شد و بیش از ده هزار
    تماشاگر می‌گیرد. آکوستیک آن جدی طراحی شده و صحنه پشت‌زمینه‌ای از جنگل و دریا دارد. برنامه‌ها در ماه‌های
    تابستان متمرکز است و هر سال دست‌کم چند نام بزرگ می‌آیند. بیرون از آن تاریخ‌ها مجموعه خالی است و دیدنی
    ندارد.

    تصویر عملی:

    - **هتل‌ها و کلبه‌ها** در جنگل کاج، ارزان‌تر و آرام‌تر از اورکی

    - **ساحلی پهن** با شیب ملایم، برای کودکان خردسال بهتر از اورکی

    - **کافه‌های فصلی** — نیمی از آن‌ها از مهر تا اردیبهشت بسته‌اند

    شب‌های کنسرت جادهٔ میان اورکی و شکوتیلی می‌بندد و پارک کردن دردسر واقعی می‌شود؛ اگر بلیت دارید دو
    ساعت زودتر برسید.
  tip: >-
    نیم روز برای ساحل. شب‌های کنسرت جاده و پارکینگ‌ها پرند، پس دو ساعت زودتر بیایید و خودرو را سمت جنگل
    بگذارید. زیر کاج‌ها سایه هست و روی ماسه تقریباً نه؛ چتر بردارید. سرویس بهداشتی و دوش بیشتر کنار کافه‌هاست.
    شهریور بهترین ماه است؛ آب گرم است، ازدحام رفته و قیمت‌ها پایین آمده.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی و گریگولتی تا اورکی و پنج کیلومتر بیشتر — ۳۲۵
    کیلومتر، حدود چهار ساعت و چهل‌وپنج دقیقه. جاده سرتاسر آسفالت است. آخر هفته‌های تابستان پس از سامترِدیا
    ترافیک کند است. سوخت در لانچخوتی و اورکی. پارکینگ در تفرجگاه کنار هتل‌هاست و در فصل پولی. خودروی اقتصادی
    کاملاً کافی است.
he:
  name: שקווטילי וארנת הים השחור
  short: אתר נופש בצל אורנים ליד אורקי, ואולם הקונצרטים הפתוח הגדול ביותר בגאורגיה.
  body: >-
    **שקווטילי היא השכנה השקטה של אורקי.** היא יושבת על אותה רצועת חול מגנטי, כמה קילומטרים דרומה, אבל
    בין הכביש לחוף יש יער אורנים שניטע בתקופה הסובייטית וכיום הוא גבוה וצפוף. זה ההבדל: באורקי בתי ההארחה
    עומדים ישר על החול, ובשקווטילי היער בא ראשון.

    החול כאן שחור ומכיל מגנטיט, בדיוק כמו באורקי. במאי וביוני האוויר מתמלא שרף והטמפרטורה תחת האורנים
    נמוכה בשתיים-שלוש מעלות מזו של החוף הפתוח — וזה משנה אם שמש הצהריים היא בעיה למשפחה שלכם.

    הסיבה השנייה להגיע היא **ארנת הים השחור**, מתחם קונצרטים פתוח שנחנך ב-2016 ומכיל יותר מעשרת אלפים
    איש. האקוסטיקה תוכננה ברצינות והבמה ניצבת על רקע יער וים. התוכנייה מרוכזת בחודשי הקיץ, ומדי שנה מגיעים
    לפחות כמה שמות גדולים. מחוץ לתאריכים האלה המתחם ריק ואין מה לראות בו.

    התמונה המעשית:

    - **מלונות וצימרים** ביער האורנים, זולים ושקטים יותר מאורקי

    - **חוף רחב** עם כניסה מתונה, טוב לילדים קטנים יותר מאורקי

    - **בתי קפה עונתיים** — מחציתם סגורים מאוקטובר עד מאי

    בערבי קונצרט הכביש בין אורקי לשקווטילי נחסם והחניה הופכת לבעיה אמיתית; אם יש לכם כרטיסים, הגיעו שעתיים
    מראש.
  tip: >-
    חצי יום לחוף. בערבי קונצרט הכביש והחניונים עמוסים, אז בואו שעתיים מוקדם והחנו בצד היער. בין האורנים
    יש צל ועל החול כמעט לא, אז הביאו שמשייה. שירותים ומקלחות בעיקר ליד בתי הקפה. ספטמבר הוא החודש הטוב
    ביותר — המים חמים, הקהל הלך והמחירים יורדים.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי וגריגולטי עד אורקי ועוד חמישה קילומטרים — 325
    ק״מ, כארבע שעות וארבעים וחמש. הכביש סלול לכל האורך. בסופי שבוע בקיץ התנועה אחרי סמטרדיה איטית. תדלוק
    בלנצ׳חותי ובאורקי. החניה באתר ליד המלונות ובתשלום בעונה. רכב חסכוני מספיק לחלוטין.
ar:
  name: شيكفيتيلي وساحة البحر الأسود
  short: منتجع في ظل الصنوبر بجوار أوريكي، وأكبر ساحة حفلات مكشوفة في جورجيا.
  body: >-
    **شيكفيتيلي هي جارة أوريكي الأهدأ.** تقع على شريط الرمل المغناطيسي نفسه على بعد بضعة كيلومترات جنوباً،
    لكن بين الطريق والشاطئ غابة صنوبر غُرست في العهد السوفيتي وصارت اليوم عالية كثيفة. وهذا هو الفرق:
    في أوريكي تقف بيوت الضيافة على الرمل مباشرة، وفي شيكفيتيلي تأتي الغابة أولاً.

    الرمل هنا أسود يحوي المغنتيت تماماً كما في أوريكي. وفي مايو ويونيو يمتلئ الهواء برائحة الراتنج، وتنخفض
    الحرارة تحت الصنوبر درجتين أو ثلاثاً عن الشاطئ المكشوف — وهذا يهم إن كانت شمس الظهيرة مشكلة لعائلتك.

    والسبب الثاني للمجيء هو **ساحة البحر الأسود**، مجمع حفلات مكشوف افتُتح عام 2016 ويتسع لأكثر من عشرة
    آلاف. صُممت صوتياته بجدية، والمسرح على خلفية من الغابة والبحر. والبرنامج مركز في أشهر الصيف، ويأتي
    كل عام بضعة أسماء كبيرة على الأقل. وخارج تلك المواعيد يكون المجمع خالياً ولا شيء فيه يُرى.

    الصورة العملية:

    - **فنادق وأكواخ** في غابة الصنوبر، أرخص وأهدأ من أوريكي

    - **شاطئ عريض** بانحدار لطيف، أفضل للأطفال الصغار من أوريكي

    - **مقاهٍ موسمية** — نصفها مغلق من أكتوبر إلى مايو

    وفي ليالي الحفلات يتكدس الطريق بين أوريكي وشيكفيتيلي ويصير الوقوف مشكلة حقيقية؛ فإن كنت تحمل تذاكر
    فاحضر قبل ساعتين.
  tip: >-
    نصف يوم للشاطئ. في ليالي الحفلات يزدحم الطريق والمواقف، فاحضر قبل ساعتين واترك السيارة في جهة الغابة.
    بين الصنوبر ظل وعلى الرمل لا يكاد يوجد، فأحضر مظلة. دورات المياه والدشات ملحقة بالمقاهي غالباً. وسبتمبر
    أفضل الشهور — الماء دافئ والزحام انصرف والأسعار تنخفض.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي وغريغوليتي إلى أوريكي وخمسة كيلومترات أخرى
    — 325 كم، نحو أربع ساعات وخمس وأربعين دقيقة. الطريق معبّد كله. وفي عطلات الصيف تبطئ الحركة بعد سامتريديا.
    الوقود في لانتشخوتي وأوريكي. الوقوف في المنتجع عند الفنادق وبأجر في الموسم. وسيارة اقتصادية تكفي تماماً.
