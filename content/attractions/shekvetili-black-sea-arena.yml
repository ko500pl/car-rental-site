ka:
  name: შეკვეთილი და შავი ზღვის არენა
  short: >-
    ფიჭვნარიანი ზღვისპირა სოფელი ურეკსა და ქობულეთს შორის და შავი ზღვის არენა — 9 000 ადგილი სახურავქვეშ,
    რომელიც ცისკენ იხსნება.
  body: >-
    **1853 წლის ოქტომბერში ყირიმის ომის კავკასიური ფრონტი შეკვეთილზე ღამის იერიშით გაიხსნა; დღეს აქ ყველაზე
    ხმამაღლა ფიჭვნარში გაპარული ბასის რიტმი ისმის.**


    შეკვეთილი შავი ზღვის პირას გადაჭიმული ხუთკილომეტრიანი ფიჭვნარია, მდინარე ნატანების შესართავთან, ურეკსა
    და ქობულეთს შუა. ტყე გზასა და ნაპირს შორის დგას, ამიტომ ზღვამდე ფისის სურნელიან ჩრდილში მიდიხართ და
    იმავე მუქ ქვიშაზე გადიხართ, რომელმაც რამდენიმე კილომეტრით ჩრდილოეთით მდებარე ურეკს სახელი გაუთქვა.
    XVIII საუკუნეში აქ ხმაურიანი სავაჭრო ადგილი იყო ოსმალთა გარნიზონით: თურქები მას შეფქეთილს ეძახდნენ,
    რუსები მოგვიანებით — წმინდა ნიკოლოზის სიმაგრეს.


    შავი ზღვის არენა ტყის მიღმა, ნაპირიდან მოშორებით დგას. იგი გერმანულმა ბიურომ Drei Architekten-მა დააპროექტა
    და 2016 წლის ზაფხულში კრისტინა აგილერას კონცერტით გაიხსნა. ეს კავკასიის უდიდესი საკონცერტო არენაა:
    ოვალური აუდიტორია 9 000 ადგილით, წრიულ ტრიბუნებად განლაგებული, ირგვლივ მბრუნავი ფასადის პანელები,
    თავზე კი გასაშლელი სახურავი. თბილ ღამეს სახურავი იხსნება და მუსიკა პირდაპირ ცაში ადის. აქ უმღერიათ
    ელტონ ჯონს, ჯგუფებს Aerosmith, Scorpions და The Killers, ორკესტრი უდირიჟორებია ენიო მორიკონეს. კონცერტები
    ძირითადად ზაფხულის თვეებზე მოდის; დანარჩენ დროს არენა უბრალოდ ნაცრისფერი ფოლადის ოვალია ავტოსადგომებსა
    და ფიჭვებს შორის.


    არენის ირგვლივ შეკვეთილი პატარა პარკების უბნად იქცა: აქაა გასართობი პარკი „ციცინათელა“, მინიატურების
    პარკი საქართველოს ღირსშესანიშნაობების შემცირებული მაკეტებით, რომელიც სახელმწიფოს 2016 წელს გადაეცა,
    და გვერდით — გადმორგული ხეების დენდროლოგიური პარკი.


    დღისით ეს ოჯახური პლაჟია, სადაც ჩრდილი არ მოგაკლდებათ. კონცერტის ღამით კი მთელი ტყე არენის ფოიედ იქცევა
    — ათასობით ადამიანი ფიჭვებქვეშ შუქისკენ მიემართება.
  tip: >-
    პლაჟისთვის ნახევარი დღე საკმარისია, კონცერტი კი ცალკე ღამეა. ბილეთი წინასწარ იყიდეთ და სულ ცოტა ორი
    საათით ადრე ჩამოდით: კონცერტის ღამით ურეკსა და შეკვეთილს შორის გზა იჭედება, ავტოსადგომები სწრაფად
    ივსება, უკან გამოსვლა კი კიდევ უფრო დიდხანს გრძელდება. ფიჭვნარში ჩრდილია, ქვიშაზე — არა, ამიტომ ქოლგა
    წაიღეთ. ბევრი კაფე და სასტუმრო მხოლოდ ზაფხულში მუშაობს. გურია საქართველოს ერთ-ერთი ყველაზე წვიმიანი
    კუთხეა — საღამოსთვის მსუბუქი ქურთუკი არ დაგამძიმებთ. საუკეთესო თვე სექტემბერია: წყალი თბილია, ხალხი
    ნაკლები, ფასებიც დაბალი.
  route: >-
    თბილისიდან დაახლოებით 325 კმ-ია, გზაში დაახლოებით ოთხ საათსა და ორმოცდახუთ წუთს გაატარებთ. ს1 (E60)
    მაგისტრალით ქუთაისის გავლით სამტრედიამდე მიდიხართ, იქიდან ს12-ით ლანჩხუთის გავლით ზღვისპირა გრიგოლეთამდე.
    გრიგოლეთში ს2 სანაპირო გზაზე სამხრეთისკენ უხვევთ, ურეკს გაივლით და დაახლოებით ხუთ კილომეტრში შეკვეთილში
    შეუხვევთ; არენა ტყის მიღმა, პლაჟიდან ცოტა მოშორებით დგას. გზა ბოლომდე ასფალტია, ეკონომ კლასის ავტომობილი
    სრულიად საკმარისია. საწვავს ლანჩხუთსა და ურეკში შეავსებთ. ზაფხულის შაბათ-კვირას სამტრედიის შემდეგ
    მოძრაობა ნელია, კონცერტის ღამით კი მთავარი თავსატეხი პარკირებაა.
en:
  name: Shekvetili and the Black Sea Arena
  short: >-
    A pine-shaded beach village between Ureki and Kobuleti, home of the Black Sea Arena: 9,000 seats under
    a roof that opens to the sky.
  body: >-
    **In October 1853 the Caucasus front of the Crimean War opened with a night assault on Shekvetili;
    today the loudest thing in the village is a bass line drifting through the pines.**


    Shekvetili is a five-kilometre strip of pine forest on the Black Sea, at the mouth of the Natanebi,
    midway between Ureki and Kobuleti. The trees stand between the road and the shore, so you reach the
    water through resinous shade and step out onto the same dark sand that made Ureki famous a few kilometres
    to the north. In the eighteenth century this was a busy trading post with an Ottoman garrison: the
    Turks called it Shefketil, the Russians later Fort St Nicholas.


    The Black Sea Arena stands inland, behind the forest. Designed by the German practice Drei Architekten
    and opened by Christina Aguilera in the summer of 2016, it is the largest concert arena in the Caucasus:
    an oval auditorium of 9,000 seats in circular tiers, wrapped in rotatable façade panels beneath a
    retractable roof. On a warm night the roof slides back and the music rises straight into the sky.
    Elton John, Aerosmith, Scorpions, Ennio Morricone and the Killers have all played here. The programme
    clusters in the summer months; outside concert dates the arena is simply a grey steel oval among car
    parks and pines.


    Around it Shekvetili has grown into a small district of parks: the Tsitsinatela amusement park, a
    Miniature Park of scale models of Georgia's landmarks, handed to the state in 2016, and, next door,
    the dendrological park of transplanted trees.


    By day this is a family beach with shade to spare. On concert nights the whole forest becomes the
    arena's foyer, thousands of people walking under the pines towards the lights.
  tip: >-
    Half a day is plenty for the beach; a concert is a night of its own. Buy tickets in advance and arrive
    at least two hours early — on concert nights the road between Ureki and Shekvetili backs up, the car
    parks fill fast and leaving afterwards is slower still. The pines give shade, the sand gives none,
    so bring an umbrella. Many cafés and guesthouses open only for the summer. Guria is one of Georgia's
    wettest corners, so pack a light jacket for the evening. September is the sweet spot: warm water,
    thinner crowds, lower prices.
  route: >-
    From Tbilisi it is about 325 km, roughly four hours and forty-five minutes. Take the S1 (E60) west
    past Kutaisi to Samtredia, then the S12 south-west through Lanchkhuti to Grigoleti on the coast. There
    turn south onto the S2 coast road, pass through Ureki and, after about five kilometres, turn off into
    Shekvetili; the arena stands behind the forest, a short way inland from the beach. It is asphalt all
    the way, and an economy car is all you need. Fuel is available in Lanchkhuti and Ureki. On summer
    weekends expect slow traffic after Samtredia; on concert nights parking is the real bottleneck.
ru:
  name: Шекветили и Черноморская арена
  short: >-
    Пляжное село в тени сосен между Уреки и Кобулети, дом Черноморской арены: 9000 мест под раздвижной
    крышей, открывающейся в небо.
  body: >-
    **В октябре 1853 года кавказский фронт Крымской войны открылся ночным штурмом Шекветили; сегодня самое
    громкое, что здесь слышно, — басовая линия, плывущая среди сосен.**


    Шекветили — это пятикилометровая полоса соснового леса на Чёрном море, у устья Натанеби, посередине
    между Уреки и Кобулети. Деревья стоят между дорогой и берегом, так что к воде вы идёте через смолистую
    тень и выходите на тот же тёмный песок, что несколькими километрами севернее сделал знаменитым Уреки.
    В XVIII веке это было оживлённое торговое поселение с османским гарнизоном: турки называли его Шефкетиль,
    русские позднее — форт Святого Николая.


    Черноморская арена стоит в глубине, за лесом. Её спроектировало немецкое бюро Drei Architekten, а
    открыла летом 2016 года Кристина Агилера; это крупнейшая концертная арена Кавказа: овальный амфитеатр
    на 9000 мест круговыми ярусами, обёрнутый поворотными фасадными панелями под раздвижной крышей. В
    тёплую ночь крыша отходит в стороны, и музыка уходит прямо в небо. Здесь играли Элтон Джон, Aerosmith,
    Scorpions, Эннио Морриконе и The Killers. Программа концентрируется в летние месяцы; вне дат концертов
    арена — просто серый стальной овал среди автостоянок и сосен.


    Вокруг неё Шекветили выросло в небольшой квартал парков: парк развлечений «Цицинатела», Парк миниатюр
    с уменьшенными макетами достопримечательностей Грузии, переданный государству в 2016 году, и рядом
    — дендрологический парк пересаженных деревьев.


    Днём это семейный пляж с избытком тени. В концертные ночи весь лес превращается в фойе арены — тысячи
    людей идут под соснами к огням.
  tip: >-
    Для пляжа хватит и половины дня; концерт — отдельный вечер. Покупайте билеты заранее и приезжайте
    минимум за два часа: в концертные ночи дорога между Уреки и Шекветили встаёт, стоянки быстро заполняются,
    а разъезд после концерта идёт ещё медленнее. Сосны дают тень, песок — нет, так что берите зонт. Многие
    кафе и гостевые дома открыты только летом. Гурия — один из самых дождливых уголков Грузии, так что
    возьмите лёгкую куртку на вечер. Сентябрь — идеальное время: тёплая вода, меньше людей, ниже цены.
  route: >-
    Из Тбилиси около 325 км, примерно четыре часа сорок пять минут. Двигайтесь по S1 (E60) на запад через
    Кутаиси до Самтредиа, затем по S12 на юго-запад через Ланчхути до Григолети на побережье. Там сверните
    на юг, на прибрежную S2, проедьте через Уреки и, примерно через пять километров, поверните в Шекветили;
    арена стоит за лесом, немного вглубь от пляжа. Дорога асфальтирована на всём протяжении, хватит машины
    эконом-класса. Заправиться можно в Ланчхути и Уреки. В летние выходные ждите заторов после Самтредиа;
    в концертные ночи главная проблема — парковка.
fa:
  name: شکوتیلی و آرنای دریای سیاه
  short: >-
    روستایی ساحلی در سایهٔ کاج‌ها میان اورکی و کوبولتی، جایگاه آرنای دریای سیاه: ۹۰۰۰ صندلی زیر سقفی که
    به آسمان باز می‌شود.
  body: >-
    **در اکتبر ۱۸۵۳ جبههٔ قفقاز جنگ کریمه با یورشی شبانه بر شکوتیلی گشوده شد؛ امروز بلندترین صدای این
    روستا آوای بم گیتار باسی است که میان کاج‌ها می‌پیچد.**


    شکوتیلی نواری پنج‌کیلومتری از جنگل کاج بر ساحل دریای سیاه است، در دهانهٔ ناتانبی، در نیمهٔ راه میان
    اورکی و کوبولتی. درختان میان راه و ساحل ایستاده‌اند، پس از میان سایه‌ای آکنده از بوی صمغ کاج به آب
    می‌رسید و بر همان شن تیره‌ای پا می‌گذارید که اورکی را چند کیلومتر شمالی‌تر مشهور کرده است. در سدهٔ
    هجدهم اینجا پایگاهی بازرگانی پرجنب‌وجوش بود با پادگانی عثمانی: ترک‌ها آن را شفکتیل می‌نامیدند، و روس‌ها
    بعدها قلعهٔ نیکلای قدیس.


    آرنای دریای سیاه در پس جنگل، دورتر از ساحل، ایستاده است. طراحی‌شده به‌دست دفتر آلمانی «درای آرشیتکتن»
    و گشوده‌شده با کنسرت کریستینا آگیلرا در تابستان ۲۰۱۶، این بزرگ‌ترین آرنای کنسرت قفقاز است: سالنی بیضی‌شکل
    با ۹۰۰۰ صندلی در ردیف‌های دایره‌ای، پوشیده در پانل‌های نمای چرخان زیر سقفی جمع‌شونده. در شبی گرم سقف
    به‌کنار می‌رود و موسیقی راست به آسمان بالا می‌رود. التون جان، اروسمیت، اسکورپیونز، انیو موریکونه و
    د کیلرز همه اینجا نواخته‌اند. برنامه بیشتر در ماه‌های تابستان است؛ بیرون از روزهای کنسرت، آرنا فقط
    بیضی‌ای خاکستری از فولاد میان پارکینگ‌ها و کاج‌هاست.


    پیرامون آن، شکوتیلی به محله‌ای کوچک از پارک‌ها تبدیل شده است: پارک تفریحی تسیتسیناتلا، پارک مینیاتوری
    با مدل‌های کوچک‌شدهٔ نشانه‌های گرجستان که در ۲۰۱۶ به دولت سپرده شد، و در کنارش، پارک درخت‌شناسیِ درختانِ
    جابه‌جاشده.


    روزها اینجا ساحلی خانوادگی است با سایهٔ فراوان. در شب‌های کنسرت، تمام جنگل به سرسرای آرنا بدل می‌شود،
    و هزاران نفر زیر کاج‌ها به‌سوی نورها می‌روند.
  tip: >-
    نیمی از روز برای ساحل کافی است؛ کنسرت شبی مستقل است. بلیت را پیشاپیش بخرید و دست‌کم دو ساعت زودتر
    برسید — در شب‌های کنسرت راه میان اورکی و شکوتیلی بند می‌آید، پارکینگ‌ها سریع پر می‌شوند و بازگشت پس
    از آن حتی کندتر است. کاج‌ها سایه می‌دهند، شن هیچ سایه‌ای ندارد، پس چتری همراه ببرید. بسیاری از کافه‌ها
    و اقامتگاه‌ها فقط در تابستان بازند. گوریا یکی از پرباران‌ترین گوشه‌های گرجستان است، پس ژاکتی سبک برای
    عصر همراه بیاورید. سپتامبر بهترین زمان است: آب گرم، جمعیت کمتر، قیمت‌های پایین‌تر.
  route: >-
    از تفلیس نزدیک به ۳۲۵ کیلومتر است، حدود چهار ساعت و چهل‌وپنج دقیقه. از S1 (E60) به سوی غرب، از کوتایسی
    گذشته، تا سامتردیا برانید، سپس از S12 به سوی جنوب‌غرب، از لانچخوتی گذشته، تا گریگولتی بر ساحل. آن‌جا
    به‌سوی جنوب، به راه ساحلی S2 بپیچید، از اورکی بگذرید و پس از نزدیک به پنج کیلومتر، به شکوتیلی بپیچید؛
    آرنا در پس جنگل، اندکی دورتر از ساحل، ایستاده است. تمام راه آسفالت است، و خودرویی اقتصادی کافی است.
    سوخت‌گیری در لانچخوتی و اورکی ممکن است. در تعطیلات آخر هفتهٔ تابستان، پس از سامتردیا ترافیک کند را
    انتظار داشته باشید؛ در شب‌های کنسرت، مشکل اصلی پارکینگ است.
he:
  name: שקווטילי וזירת הים השחור
  short: 'כפר חוף מוצל באורנים בין אורקי לקובולטי, מקום ביתה של זירת הים השחור: 9,000 מקומות תחת גג הנפתח
    לשמיים.'
  body: >-
    **באוקטובר 1853 נפתחה חזית הקווקז של מלחמת קרים בהתקפת לילה על שקווטילי; היום הדבר הרועש ביותר בכפר
    הוא קו בס הנישא בין האורנים.**


    שקווטילי הוא רצועה של יער אורנים בת חמישה קילומטרים על שפת הים השחור, בשפך נהר נטנבי, באמצע הדרך בין
    אורקי לקובולטי. העצים עומדים בין הכביש לחוף, כך שאל המים מגיעים בצל שרפי, ויוצאים על אותו החול הכהה
    שהפך את אורקי למפורסמת כמה קילומטרים צפונה. במאה השמונה־עשרה היה זה מרכז מסחר עמוס עם חיל מצב עות'מאני:
    הטורקים קראו לו שפקטיל, והרוסים לימים מבצר ניקולאי הקדוש.


    זירת הים השחור עומדת הרחק מהחוף, מעבר ליער. היא תוכננה בידי המשרד הגרמני "דריי ארכיטקטן" ונפתחה בהופעה
    של כריסטינה אגילרה בקיץ 2016, וזוהי זירת הקונצרטים הגדולה ביותר בקווקז: אודיטוריום סגלגל בן 9,000
    מקומות במדרגות עגולות, עטוף בפאנלי חזית מסתובבים תחת גג נשלף. בלילה חמים הגג נסוג לאחור והמוזיקה עולה
    היישר לשמיים. אלטון ג'ון, אירוסמית, סקורפיונס, אניו מוריקונה והקילרז כולם הופיעו כאן. התוכנייה מתרכזת
    בחודשי הקיץ; מחוץ לתאריכי הופעות הזירה היא סתם סגלגל פלדה אפור בין מגרשי חנייה ואורנים.


    מסביבה הפכה שקווטילי לרובע קטן של פארקים: פארק השעשועים ציצינאטלה, פארק המיניאטורות עם דגמים מוקטנים
    של אתרי גאורגיה, שנמסר למדינה ב־2016, ולידו הפארק הדנדרולוגי של עצים שהועתקו ממקומם.


    ביום זהו חוף משפחתי עם צל למכביר. בלילות הופעה כל היער הופך למבואת הזירה, אלפי אנשים הולכים מתחת לאורנים
    לעבר האורות.
  tip: >-
    חצי יום מספיק בהחלט לחוף; הופעה היא לילה בפני עצמו. קנו כרטיסים מראש והגיעו לפחות שעתיים מוקדם — בלילות
    הופעה הכביש בין אורקי לשקווטילי נפקק, מגרשי החנייה מתמלאים במהירות, והנסיעה בחזרה אחר כך אף איטית
    יותר. האורנים מספקים צל, החול לא, אז הביאו מטריה. הרבה בתי קפה ואכסניות פתוחים רק בקיץ. גוריה היא
    אחת הפינות הגשומות ביותר בגאורגיה, אז קחו מעיל קל לערב. ספטמבר הוא הזמן המושלם: מים חמים, פחות קהל,
    מחירים נמוכים יותר.
  route: >-
    מטביליסי כ-325 ק"מ, בערך ארבע שעות וארבעים וחמש דקות. סעו ב-S1 (E60) מערבה, ליד קוטאיסי, עד סמטרדיה,
    ואז ב-S12 דרומית-מערבית, דרך לנצ'חוטי, עד גריגולטי על החוף. שם פנו דרומה לכביש החוף S2, עברו את אורקי,
    ואחרי כחמישה קילומטרים פנו לשקווטילי; הזירה עומדת מעבר ליער, קצת פנימה מהחוף. כל הדרך אספלט, ורכב
    חסכוני יספיק. תדלוק אפשרי בלנצ'חוטי ובאורקי. בסופי שבוע בקיץ צפו לתנועה איטית אחרי סמטרדיה; בלילות
    הופעה החניה היא הבעיה האמיתית.
ar:
  name: شكفيتيلي وأرينا البحر الأسود
  short: >-
    قرية ساحلية تظللها أشجار الصنوبر بين أوريكي وكوبوليتي، موطن أرينا البحر الأسود: 9000 مقعد تحت سقف
    ينفتح على السماء.
  body: >-
    **في أكتوبر 1853 افتُتحت جبهة القوقاز من حرب القرم بهجوم ليلي على شكفيتيلي؛ واليوم أعلى صوت في القرية
    هو خط باس يتسرّب بين أشجار الصنوبر.**


    شكفيتيلي شريط من غابة الصنوبر يمتد خمسة كيلومترات على البحر الأسود، عند مصب نهر ناتانيبي، في منتصف
    المسافة بين أوريكي وكوبوليتي. تقف الأشجار بين الطريق والشاطئ، فتصل إلى الماء عبر ظل عبق بالراتنج،
    وتخرج إلى الرمال الداكنة نفسها التي جعلت أوريكي مشهورة على بعد كيلومترات شمالًا. في القرن الثامن عشر
    كان هذا مركز تجارة نشطًا فيه حامية عثمانية: أطلق عليه الترك اسم شفكتيل، وأطلق عليه الروس فيما بعد
    حصن القديس نيقولاوس.


    تقف أرينا البحر الأسود في الداخل، خلف الغابة. صممها المكتب الألماني «دراي أركيتكتن»، وافتُتحت بحفل
    لكريستينا أغويليرا في صيف 2016، وهي أكبر أرينا للحفلات في القوقاز: مدرج بيضاوي بـ9000 مقعد في طبقات
    دائرية، تحيط به لوحات واجهة دوّارة تحت سقف قابل للسحب. في ليلة دافئة ينزلق السقف جانبًا وترتفع الموسيقى
    مباشرة إلى السماء. عزف هنا إلتون جون وإيروسميث وسكوربيونز وإنيو موريكونه وذا كيلرز. يتركّز البرنامج
    في أشهر الصيف؛ وخارج أيام الحفلات، الأرينا ليست أكثر من بيضاوي فولاذي رمادي بين المواقف وأشجار الصنوبر.


    حولها نمت شكفيتيلي إلى حيّ صغير من المتنزهات: مدينة الملاهي تسيتسيناتيلا، وحديقة المصغّرات بنماذج
    مصغّرة لمعالم جورجيا، التي سُلّمت للدولة عام 2016، وإلى جانبها الحديقة الدندرولوجية ذات الأشجار المنقولة.


    نهارًا هذا شاطئ عائلي بظلٍّ وافر. وفي ليالي الحفلات تتحول الغابة كلها إلى ردهة الأرينا، حيث يسير آلاف
    الناس تحت الصنوبر نحو الأنوار.
  tip: >-
    يكفي نصف يوم للشاطئ؛ أما الحفل فليلة بذاتها. اشترِ التذاكر مسبقًا وتعال قبل ساعتين على الأقل — في
    ليالي الحفلات يزدحم الطريق بين أوريكي وشكفيتيلي، وتمتلئ المواقف بسرعة، والخروج بعد الحفل أبطأ من ذلك.
    الصنوبر يمنح ظلًا، والرمل لا يمنح شيئًا، فاحمل شمسية. كثير من المقاهي والنُّزل تفتح في الصيف فقط.
    غوريا من أكثر بقاع جورجيا مطرًا، فخذ سترة خفيفة للمساء. سبتمبر هو الوقت الأمثل: ماء دافئ، وحشد أقل،
    وأسعار أدنى.
  route: >-
    من تبليسي نحو 325 كم، أي نحو أربع ساعات وخمس وأربعين دقيقة. اتخذ الطريق S1 (E60) غربًا، مرورًا بكوتايسي،
    حتى سامتريديا، ثم الطريق S12 جنوب غربًا عبر لانتشخوتي حتى غريغوليتي على الساحل. هناك انعطف جنوبًا
    إلى طريق الساحل S2، مرورًا بأوريكي، وبعد نحو خمسة كيلومترات انعطف إلى شكفيتيلي؛ تقف الأرينا خلف الغابة،
    على مسافة قصيرة من الشاطئ. الطريق مُعبَّد بالكامل، وتكفي سيارة اقتصادية. الوقود متوفر في لانتشخوتي
    وأوريكي. في عطلات نهاية الأسبوع صيفًا توقّع حركة بطيئة بعد سامتريديا؛ وفي ليالي الحفلات يكون ركن السيارة
    هو عنق الزجاجة الحقيقي.
