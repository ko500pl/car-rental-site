ka:
  name: რაბათის ციხე (ახალციხე)
  short: ახალციხის გულში აღდგენილი ციხე-ქალაქი, სადაც ერთ ეზოში დგას მეჩეთი, ეკლესია, სინაგოგა და ციხე.
  body: >
    რაბათი ახალციხის ისტორიული ბირთვია — ბორცვზე აღმართული ციხე-ქალაქი, რომელიც საუკუნეების განმავლობაში
    ჯაყელთა სამთავროს, შემდეგ კი ოსმალური ადმინისტრაციის ცენტრი იყო. სახელი არაბული სიტყვიდან მოდის და
    „გამაგრებულ უბანს“ ნიშნავს. ახალციხე სამცხის მთავარი ქალაქია და მისი ისტორია ზუსტად ამ ბორცვზე იკითხება:
    ქრისტიანული სამთავრო, ოსმალური საფაშო, რუსული გარნიზონი და საბჭოთა პერიოდი ერთმანეთს ფენებად ედება.


    2011–2012 წლებში კომპლექსი ფართოდ აღადგინეს. ეს აღდგენა დღემდე კამათის საგანია: ნაწილი ისტორიულია,
    ნაწილი კი თანამედროვე რეკონსტრუქციაა თეთრი ქვით, ახალი ბაღებითა და ტერასებით. მიუხედავად ამისა, რაბათი
    საქართველოში იშვიათი ადგილია, სადაც სამცხის რელიგიური სიჭრელე ერთ სივრცეშია თავმოყრილი — **მეჩეთი
    მედრესეთი, მართლმადიდებლური ეკლესია, სინაგოგის შენობა და სასახლის ნაწილი**.


    კომპლექსი ორ ნაწილადაა გაყოფილი:


    - ქვედა, უფასო ზონა — ქუჩები, კაფეები, სუვენირები, საინფორმაციო ცენტრი

    - ზედა, ბილეთიანი ზონა — ციტადელი, მეჩეთი, ისტორიული მუზეუმი და გალავანზე გასასვლელი


    ზედა გალავნიდან მთელი ახალციხე და მესხეთის ქედები იშლება, კარგ ამინდში კი შორეული მთებიც ჩანს. მუზეუმში
    სამცხე-ჯავახეთის არქეოლოგიური მასალა და ჯაყელთა ეპოქის ექსპონატებია — მასზე ოცი წუთი ცალკე ჩადე.


    ციხის ტერიტორიაზე დღეს სასტუმროც მუშაობს და ღვინის სარდაფიც, ხოლო ზაფხულში ეზოში კონცერტები და ფესტივალები
    იმართება. სწორედ ამიტომ ღირს რაბათში საღამოს შესვლა: სიცხე იკლებს, განათება ირთვება და ადგილი ტურისტული
    ობიექტიდან ცოცხალ საქალაქო სივრცედ იქცევა.
  tip: >-
    რაბათი ვარძიის მარშრუტის ბუნებრივი შესვენებაა — ჯობია ჩამოსვლისას აქ არ გაჩერდე, არამედ უკან დაბრუნებისას
    შემოიარო, როცა დრო აღარ გაწუხებს. ორი საათი სავსებით საკმარისია. მანქანა ციხის ქვედა შესასვლელთან
    პარკინგზე დატოვე. ზაფხულში ქვის ეზოები ძალიან ცხელია, ჩრდილი მცირეა; საღამოს განათება ლამაზია ფოტოსთვის.
    ქვედა ზონაში კაფეები, ტუალეტი და ბანკომატებია, ქალაქშივე — მაღაზიები და საწვავი.
  route: >-
    თბილისიდან E60-ით ხაშურამდე მიდიხარ, შემდეგ სამხრეთით უხვევ ბორჯომზე და მტკვრის ვიწრო, კლდოვან მონაკვეთზე
    აგრძელებ ახალციხემდე. სულ დაახლოებით ორასხუთი კილომეტრი და სამი საათი ოცი წუთი. გზა ბოლომდე ასფალტიანია
    და კარგ მდგომარეობაშია, თუმცა ბორჯომსა და ახალციხეს შორის მონაკვეთი ვიწროა და მოხვევებიანი — ზამთარში
    აქ ყინული და ნისლი ხშირია. საწვავი და ბანკომატები ბორჯომსა და ახალციხეშია, სხვაგან არ დაეყრდნო. ეკონომ
    კლასი სავსებით საკმარისია, ზამთარში კროსოვერი უფრო კომფორტულია.
en:
  name: Rabati Castle (Akhaltsikhe)
  short: >-
    A restored fortress-town in the heart of Akhaltsikhe where a mosque, a church and a synagogue share
    one courtyard.
  body: >-
    Rabati is the historic core of Akhaltsikhe: a walled town on a hill that served for centuries as the
    seat of the Jaqeli princes and later as the centre of Ottoman administration in the region. The name
    comes from an Arabic word for a fortified quarter.


    The complex was extensively rebuilt in 2011-2012, and that restoration is still argued about. Some
    of what you walk past is genuinely old, some is modern reconstruction in pale stone with new gardens
    and terraces. Either way, Rabati remains a rare place in Georgia where the religious layering of Meskheti
    sits in one enclosure — **a mosque with its madrasa, an Orthodox church, a synagogue building and
    part of the princely palace**.


    The site splits into two zones:


    - the lower free zone — lanes, cafes, souvenir shops, tourist information

    - the upper ticketed zone — the citadel, the mosque, the history museum and access to the ramparts


    From the upper walls you see the whole town and the ridges of Meskheti. The museum inside covers regional
    archaeology and the Jaqeli period, and is worth the extra twenty minutes.
  tip: >-
    Rabati is the natural break on a Vardzia trip, and it works better on the way back, when you are no
    longer racing the clock at the cave city. Two hours covers it comfortably. Park at the lot by the
    lower entrance. In summer the stone courtyards get genuinely hot and shade is scarce; in the evening
    the lighting makes for good photographs. Cafes, toilets and ATMs are in the lower zone, with shops
    and fuel in the town itself.
  route: >-
    From Tbilisi take the E60 to Khashuri, then head south to Borjomi and continue through the narrow
    rocky stretch of the Mtkvari valley to Akhaltsikhe — roughly three and a half hours in total. The
    road is paved and in good condition throughout, though the Borjomi-Akhaltsikhe section is narrow and
    winding, and ices over in winter. Fuel and ATMs are available in both Borjomi and Akhaltsikhe. An
    economy car is entirely sufficient; a crossover simply rides the winter road more comfortably.
ru:
  name: Крепость Рабат (Ахалцихе)
  short: Восстановленный крепостной город в центре Ахалцихе, где во дворе соседствуют мечеть, церковь
    и синагога.
  body: >
    Рабат — историческое ядро Ахалцихе: обнесённый стенами город на холме, веками служивший резиденцией
    князей Джакели, а затем центром османской администрации в регионе. Название происходит от арабского
    слова, означающего укреплённый квартал. Ахалцихе — главный город Месхети, и его история читается прямо
    на этом холме: христианское княжество, османский пашалык, русский гарнизон и советский период ложатся
    здесь слоями.


    В 2011-2012 годах комплекс масштабно восстановили, и об этой реставрации до сих пор спорят. Часть
    построек действительно старая, часть — современная реконструкция из светлого камня с новыми садами
    и террасами. Тем не менее Рабат остаётся редким для Грузии местом, где религиозная многослойность
    Месхети собрана в одной ограде: **мечеть с медресе, православная церковь, здание синагоги и часть
    княжеского дворца**.


    Территория делится на две зоны:


    - нижняя, бесплатная — улочки, кафе, сувенирные лавки, туристический центр

    - верхняя, по билету — цитадель, мечеть, исторический музей и выход на стены


    С верхних стен виден весь город и хребты Месхети, а в ясную погоду и дальние горы. В музее собраны
    археология Самцхе-Джавахети и экспонаты эпохи Джакели, на них стоит заложить лишних двадцать минут.


    На территории крепости сегодня работают гостиница и винный погреб, а летом во дворе проходят концерты
    и фестивали. Именно поэтому в Рабат стоит заходить вечером: жара спадает, включается подсветка, и
    место превращается из музейного объекта в живое городское пространство.
  tip: >-
    Рабат — естественная пауза на маршруте к Вардзии, и удобнее заезжать сюда на обратном пути, когда
    уже не нужно спешить к пещерному городу. Двух часов вполне достаточно. Машину оставьте на парковке
    у нижнего входа. Летом каменные дворы сильно нагреваются, тени мало; вечером включают подсветку, и
    снимки получаются лучше. Кафе, туалеты и банкоматы — в нижней зоне, магазины и заправки — в самом
    городе.
  route: >-
    Из Тбилиси по трассе E60 до Хашури, затем на юг через Боржоми и дальше узким скальным участком долины
    Куры до Ахалцихе — примерно три с половиной часа. Дорога асфальтированная и в хорошем состоянии, но
    отрезок Боржоми-Ахалцихе узкий и извилистый, зимой на нём часто гололёд. Заправки и банкоматы есть
    и в Боржоми, и в Ахалцихе. Хватит машины эконом-класса; кроссовер просто мягче идёт по зимней дороге.
fa:
  name: قلعهٔ راباتی (آخالتسیخه)
  short: شهر-دژی بازسازی‌شده در قلب آخالتسیخه، جایی که مسجد و کلیسا و کنیسه یک حیاط را با هم قسمت می‌کنند.
  body: >-
    راباتی هستهٔ تاریخی آخالتسیخه است: شهری حصاردار روی تپه که قرن‌ها مقر شاهزادگان جاقلی و سپس مرکز اداری
    عثمانی در این منطقه بود. نام آن از واژه‌ای عربی به معنای محلهٔ مستحکم می‌آید.


    مجموعه در 2011-2012 به‌گستردگی بازسازی شد و هنوز دربارهٔ همان بازسازی بحث است. بخشی از آنچه از کنارش
    می‌گذرید واقعاً کهن است و بخشی بازسازی امروزی با سنگ روشن، باغ‌های تازه و مصطبه‌ها. با این حال راباتی
    همچنان جایی نادر در گرجستان است که لایه‌های مذهبی مسختی را در یک حصار جمع کرده است — **یک مسجد با
    مدرسه‌اش، یک کلیسای ارتدکس، ساختمان یک کنیسه و بخشی از کاخ شاهزادگان**.


    محوطه به دو بخش تقسیم می‌شود: بخش پایینی و رایگان با کوچه‌ها، کافه‌ها، مغازه‌های سوغات و مرکز اطلاعات
    گردشگری؛ و بخش بالایی و بلیتی که ارگ، مسجد، موزهٔ تاریخ و راه رفتن روی باروها را در بر می‌گیرد. از
    دیوارهای بالایی تمام شهر و ستیغ‌های مسختی پیدا است. موزهٔ درون مجموعه به باستان‌شناسی منطقه و دوران
    جاقلی می‌پردازد و بیست دقیقهٔ اضافه‌ای که می‌گیرد کاملاً می‌ارزد.
  tip: >-
    راباتی توقف طبیعی سفر به واردزیا است و در راه بازگشت بهتر جواب می‌دهد، وقتی دیگر برای رسیدن به شهر
    غاری با ساعت مسابقه نمی‌دهید. دو ساعت به‌راحتی کافی است. خودرو را در پارکینگ کنار ورودی پایینی بگذارید.
    در تابستان حیاط‌های سنگی واقعاً داغ می‌شوند و سایه کم است؛ عصرها نورپردازی برای عکاسی خوب است. کافه‌ها،
    سرویس بهداشتی و خودپردازها در بخش پایینی‌اند و مغازه‌ها و پمپ‌بنزین در خود شهر.
  route: >-
    از تفلیس با E60 تا خاشوری بروید، بعد رو به جنوب به بورجومی و از آنجا از مقطع باریک و صخره‌ای درهٔ
    متکواری تا آخالتسیخه — روی هم تقریباً سه ساعت و نیم. جاده در تمام طول مسیر آسفالت و در وضعیت خوبی
    است، هرچند مقطع بورجومی-آخالتسیخه باریک و پرپیچ است و زمستان‌ها یخ می‌زند. سوخت و خودپرداز هم در بورجومی
    هست و هم در آخالتسیخه. خودروی اقتصادی کاملاً کافی است؛ کراس‌اوور فقط جادهٔ زمستانی را راحت‌تر می‌کند.
he:
  name: מבצר רבאטי (אחאלציחה)
  short: עיר-מבצר משוחזרת בלב אחאלציחה, שבה מסגד, כנסייה ובית כנסת חולקים חצר אחת.
  body: >-
    רבאטי הוא הגרעין ההיסטורי של אחאלציחה: עיר מוקפת חומה על גבעה, ששימשה במשך מאות שנים מושב לנסיכי ג'קלי
    ולאחר מכן מרכז המנהל העות'מאני באזור. השם עצמו בא ממילה ערבית שמשמעה רובע מבוצר.


    המתחם שוחזר בהיקף רחב בשנים 2011-2012, ועל השחזור הזה עדיין מתווכחים. חלק ממה שאתם חולפים על פניו
    עתיק באמת, וחלק הוא שחזור מודרני באבן בהירה עם גנים ומרפסות חדשים. כך או כך, רבאטי נותר מקום נדיר
    בגאורגיה שבו הריבוד הדתי של מסחתי יושב בתוך מכלול אחד — **מסגד עם המדרסה שלו, כנסייה אורתודוקסית,
    מבנה בית כנסת וחלק מארמון הנסיכים**.


    האתר מתחלק לשני אזורים. האזור התחתון פתוח לכניסה חופשית, ובו סמטאות, בתי קפה, חנויות מזכרות ומרכז
    מידע לתיירים. האזור העליון הוא זה שדורש כרטיס, והוא כולל את המצודה, את המסגד, את מוזיאון ההיסטוריה
    ואת היציאה אל החומות. מן החומות העליונות נשקפת העיר כולה, ורכסי מסחתי משתרעים מעבר לה. המוזיאון שבפנים
    עוסק בארכיאולוגיה של האזור ובתקופת ג'קלי, והוא שווה את עשרים הדקות הנוספות.
  tip: >-
    רבאטי הוא ההפסקה הטבעית בנסיעה לוורדזיה, והוא עובד טוב יותר בדרך חזרה, כשכבר אינכם מרוצים מול השעון
    אל עיר המערות. שעתיים מכסות אותו בנחת. החנו במגרש שליד הכניסה התחתונה. בקיץ החצרות המרוצפות מתחממות
    באמת והצל מועט; בערב התאורה נדלקת והתמונות יוצאות טוב יותר. בתי קפה, שירותים וכספומטים נמצאים באזור
    התחתון, וחנויות ותחנות דלק בעיר עצמה.
  route: >-
    מטביליסי סעו על E60 עד חשורי, משם דרומה לבורג'ומי והלאה בקטע הצר והסלעי של עמק המטקווארי עד אחאלציחה
    — כשלוש שעות וחצי בסך הכול. הכביש סלול ובמצב טוב לכל אורכו, אף שהקטע בורג'ומי-אחאלציחה צר ומפותל ומקרח
    בחורף. דלק וכספומטים יש גם בבורג'ומי וגם באחאלציחה. רכב חסכוני מספיק לחלוטין; קרוסאובר פשוט עובר את
    כביש החורף בנוחות רבה יותר.
ar:
  name: قلعة راباتي (أخالتسيخي)
  short: مدينة-حصن مرمّمة في قلب أخالتسيخي، يتقاسم فيها مسجد وكنيسة وكنيس فناءً واحداً.
  body: >-
    راباتي هي النواة التاريخية لأخالتسيخي: مدينة مسوّرة على تل خدمت قروناً مقراً لأمراء جاكيلي ثم مركزاً
    للإدارة العثمانية في الإقليم. والاسم نفسه مأخوذ من كلمة عربية تعني الحي المحصّن، وهي تصف تماماً ما
    تراه اليوم.


    أُعيد بناء المجمع على نطاق واسع في 2011-2012، وما زال ذلك الترميم موضع جدل. فبعض ما تمر بجانبه قديم
    فعلاً، وبعضه إعادة بناء حديثة بحجر فاتح مع حدائق ومصاطب جديدة. ومهما يكن الرأي، يبقى راباتي مكاناً
    نادراً في جورجيا يجتمع فيه التعدد الديني لإقليم ميسخيتي كله داخل سور واحد — **مسجد بمدرسته، وكنيسة
    أرثوذكسية، ومبنى كنيس، وجزء من قصر الأمراء**.


    ينقسم الموقع إلى منطقتين. المنطقة السفلية مفتوحة بلا رسوم، وفيها الأزقة والمقاهي ومحال الهدايا ومركز
    المعلومات السياحية. أما المنطقة العليا فهي التي تحتاج تذكرة، وتشمل القلعة الداخلية والمسجد ومتحف التاريخ
    والصعود إلى الأسوار. ومن أعلى الأسوار تشاهد المدينة كلها، وتمتد خلفها سلاسل ميسخيتي. أما المتحف في
    الداخل فيغطي آثار الإقليم وحقبة جاكيلي، وهو يستحق فعلاً العشرين دقيقة الإضافية التي يأخذها منك.
  tip: >-
    راباتي هو الاستراحة الطبيعية في رحلة فاردزيا، وهو أنسب في طريق العودة، حين لا تعود تسابق الوقت للوصول
    إلى مدينة الكهوف. ساعتان تغطيانه براحة. أوقف السيارة في الموقف عند المدخل السفلي. في الصيف تسخن الأفنية
    الحجرية فعلاً والظل شحيح؛ وفي المساء تجعل الإضاءة الصور أفضل. المقاهي ودورات المياه والصرافات في المنطقة
    السفلية، والمتاجر والوقود في المدينة نفسها.
  route: >-
    من تبليسي اسلك E60 حتى خاشوري، ثم اتجه جنوباً إلى بورجومي وواصل عبر المقطع الضيق الصخري من وادي متكفاري
    حتى أخالتسيخي — نحو ثلاث ساعات ونصف إجمالاً. الطريق معبّد وبحال جيدة على امتداده، وإن كان مقطع بورجومي-أخالتسيخي
    ضيقاً ومتعرجاً ويتجمد في الشتاء. الوقود والصرافات متوفرة في بورجومي وأخالتسيخي معاً. وسيارة اقتصادية
    تكفي تماماً؛ أما الكروس أوفر فيمر على طريق الشتاء براحة أكبر فحسب.
