ka:
  name: რაბათის ციხე (ახალციხე)
  short: >-
    ახალციხის გალავნიანი გორა, სადაც ერთ ზღუდეში დგას ჯაყელთა სასახლე, XVIII საუკუნის მეჩეთი და მართლმადიდებლური
    ეკლესია.
  body: >-
    **საქართველოში ცოტა ციხეს ჰყოლია იმდენი პატრონი, რამდენიც რაბათს: ქართველი მთავრები, ოსმალო ფაშები,
    რუსი გენერლები და, ბოლოს, რესტავრატორები.**


    „ქართლის ცხოვრების“ მიხედვით, აქ ციხე IX საუკუნეში ტაოს მეფის ძემ, გუარამ მამფალმა, ააგო — მაშინ ადგილს
    ლომსია ერქვა. XII საუკუნის ბოლოს ქალაქმა ახალი სახელი, ახალციხე, მიიღო, XIII საუკუნიდან კი აქ სამცხის
    მთავრები, ჯაყელები, ისხდნენ. ციხემ 1393 წელს თემურ-ლენგის ლაშქარს გაუძლო, 1579 წელს ოსმალებმა აიღეს
    და ფაშის სატახტოდ აქციეს, 1828 წელს კი გენერალ პასკევიჩის ჯარმა შტურმით დაიკავა.


    ამ ისტორიას ყველაზე კარგად აჰმედიეს მეჩეთი ჰყვება. ის 1752 წელს ააგო ჰაჯი აჰმედ-ფაშა ჯაყელმა — ქრისტიანი
    მთავრების შთამომავალმა, რომელიც ოსმალეთის ფაშა გახდა. გუმბათი კონსტანტინოპოლის აია-სოფიას იგონებს,
    გეგმა კი ქართული ეკლესიის ნაცნობ სქემას მიჰყვება. მეჩეთად ის 1828 წლამდე იდგა, 1850–1920 წლებში კი
    ღვთისმშობლის სახელობის ეკლესია იყო. გარშემო მედრესე და მინარეთი, ჯაყელთა სასახლე, აბანოები, ციტადელი
    და მართლმადიდებლური ეკლესიაა.


    2011–2012 წლებში სახელმწიფომ კომპლექსის აღდგენას 34 მილიონი ლარი მოახმარა და შედეგზე კამათი დღემდე
    არ წყდება: ღია ფერის ახალი წყობა ძველზე მეტია, ამიტომ რაბათი ნანგრევად კი არა, ძველ ჩონჩხზე აღმართულ
    რეკონსტრუქციად უნდა წაიკითხოთ. სინაგოგა, რომელსაც ხშირად ამავე სიაში ასახელებენ, გალავნის გარეთ, ძველ
    რაბათის უბანში დგას; წარწერის მიხედვით ის 1862 წელსაა აგებული, როცა ახალციხეში საქართველოს ერთ-ერთი
    დიდი ებრაული თემი ცხოვრობდა.


    XVII საუკუნის ბოლოს ახალციხეში თურქები, სომხები, ქართველები, ბერძნები და ებრაელები ცხოვრობდნენ — აქ
    დაიბადა შარლ აზნავურის მამაც. ასეთ კედლებს უცხოს შემოსაშვებად არ აგებდნენ, დღეს კი სწორედ მათი თავიდან
    ჩანს ყველაზე კარგად, რამდენ სხვადასხვა ხალხს იტევდა ოდესღაც ეს ქალაქი.
  tip: >-
    ქვედა ქუჩები თავისუფლად დასათვალიერებელია; ზედა ზონაში — ციტადელში, მეჩეთსა და მხარის ისტორიულ მუზეუმში
    — შესასვლელად ბილეთი ჭიშკართან იყიდება. ორი საათი საკმარისია და ყველაზე მოსახერხებელია, რაბათი ვარძიიდან
    დაბრუნებისას ნახოთ, როცა დრო აღარ გერეკებათ. მანქანა ქვედა შესასვლელთან დატოვეთ — იქვეა კაფეები და
    ტუალეტები. ივლისსა და აგვისტოში მოკირწყლული ეზოები სიცხეს უკან გიბრუნებთ, ჩრდილი კი ცოტაა: მოდით დილით
    ან ხუთი საათის შემდეგ, როცა ქვა თაფლისფერს იღებს და განათება ირთვება. სინაგოგა მხოლოდ მაშინაა ღია,
    როცა მისი მომვლელი ადგილზეა.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია; იქიდან სამხრეთით,
    S8-ზე გადაუხვიეთ და ბორჯომის გავლით, მტკვრის ხეობას აჰყევით ახალციხემდე — სულ 205 კილომეტრი, დაახლოებით
    3 საათი და 20 წუთი. გზა ბოლომდე ასფალტიანია. ბორჯომსა და ახალციხეს შორის 45 კილომეტრი ვიწრო და მოსახვევებიანია,
    დეკემბრიდან მარტამდე კი აქ ყინული და ნისლია მოსალოდნელი, ამიტომ ზამთრის საბურავები აუცილებელია. საწვავი
    ხაშურში, ბორჯომში ან ახალციხეში ჩაასხით. რაბათი ძველ ქალაქში, ფოცხოვის ჩრდილოეთ ნაპირზე დგას. ეკონომკლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Rabati Castle (Akhaltsikhe)
  short: >-
    Akhaltsikhe's walled hill, where a Jaqeli palace, an 18th-century mosque and an Orthodox church share
    one enclosure above the old town.
  body: >-
    **Few fortresses in Georgia have answered to as many masters as Rabati: Georgian princes, Ottoman
    pashas, Russian generals and, most recently, the restorers.**


    The Georgian Chronicles credit Guaram Mampali, son of the king of Tao, with founding a stronghold
    here in the 9th century, when the place was still called Lomsia. By the end of the 12th century it
    had a new name, Akhaltsikhe, the "new fortress", and from the 13th century it was the seat of the
    Jaqeli, princes of Samtskhe. It withstood Tamerlane's army in 1393, fell to the Ottomans in 1579 and
    became a pasha's capital, and was stormed by General Paskevich's troops in 1828.


    The building that tells the story best is the Akhmediye Mosque. It was raised in 1752 by Haji Ahmed-Pasha
    Jaqeli, a descendant of the Christian princes who had become an Ottoman pasha, and its dome echoes
    Hagia Sophia in Constantinople over the plan of a Georgian church. It served as a mosque until 1828
    and, from 1850 to 1920, as a church of the Virgin. Around it stand the madrasa and minaret, the Jaqeli
    palace, the baths, the citadel and an Orthodox church.


    In 2011–2012 the state spent 34 million lari rebuilding almost all of it, and the result still divides
    opinion: much of the crisp, pale masonry is new, so read Rabati as a reconstruction over old bones
    rather than a ruin. The synagogue often listed alongside it stands outside the walls, in the old Rabati
    quarter; an inscription dates it to 1862, when this was home to one of Georgia's great Jewish communities.


    By the late 17th century Akhaltsikhe was a town of Turks, Armenians, Georgians, Greeks and Jews, and
    Charles Aznavour's father was born here. Walls like these were built to keep strangers out; today
    they are the best place to see how many different peoples the town once held.
  tip: >-
    The lower lanes are free to wander; the citadel, the mosque and the regional history museum in the
    upper zone take a ticket bought at the gate. Two hours is enough, and the visit sits most comfortably
    on the way back from Vardzia, when the clock is no longer pressing. Park by the lower entrance, where
    you will also find cafés and toilets. In July and August the paved courtyards throw the heat back
    at you and shade is scarce: come in the morning, or after five, when the stone turns honey-coloured
    and the lights come on. The synagogue opens only when its keeper is there.
  route: >-
    From Tbilisi take the E60/S1 west past Gori to Khashuri, about 130 km, then turn south onto the S8
    through Borjomi and up the Mtkvari gorge to Akhaltsikhe: 205 km and roughly 3 hours 20 minutes in
    all. It is asphalt the whole way. The 45 km between Borjomi and Akhaltsikhe are narrow and full of
    bends, and from December to March they can carry ice and fog, so fit winter tyres. Fuel up in Khashuri,
    Borjomi or Akhaltsikhe. Rabati rises in the old town on the north bank of the Potskhovi. An economy
    car is entirely adequate.
ru:
  name: Крепость Рабат (Ахалцихе)
  short: >-
    Обнесённый стенами холм Ахалцихе: дворец Джакели, мечеть XVIII века и православная церковь делят здесь
    одну ограду над старым городом.
  body: >-
    **Мало какая крепость в Грузии сменила столько хозяев, сколько Рабат: грузинские князья, османские
    паши, русские генералы и, совсем недавно, реставраторы.**


    Грузинские летописи приписывают основание здешней твердыни в IX веке Гуараму Мампали, сыну царя Тао;
    тогда место ещё называлось Ломсиа. К концу XII века у него появилось новое имя — Ахалцихе, «новая
    крепость», а с XIII века здесь была резиденция Джакели, князей Самцхе. Крепость выстояла перед войском
    Тамерлана в 1393 году, в 1579-м пала перед османами и стала столицей паши, а в 1828 году её взяли
    штурмом войска генерала Паскевича.


    Лучше всего эту историю рассказывает мечеть Ахмедие. Её возвёл в 1752 году Хаджи Ахмед-паша Джакели
    — потомок христианских князей, ставший османским пашой, — и её купол, перекликающийся со Святой Софией
    Константинопольской, поднят над планом грузинского храма. До 1828 года здание служило мечетью, а с
    1850 по 1920 год — церковью Богородицы. Вокруг стоят медресе и минарет, дворец Джакели, бани, цитадель
    и православная церковь.


    В 2011–2012 годах государство потратило 34 миллиона лари, отстроив почти всё заново, и результат до
    сих пор вызывает споры: большая часть чёткой светлой кладки новая, так что смотрите на Рабат как на
    реконструкцию поверх старого остова, а не как на руину. Синагога, которую часто упоминают рядом с
    крепостью, стоит за стенами, в старом квартале Рабат; надпись датирует её 1862 годом, когда здесь
    жила одна из крупнейших еврейских общин Грузии.


    К концу XVII века в Ахалцихе жили турки, армяне, грузины, греки и евреи; здесь же родился отец Шарля
    Азнавура. Такие стены строили, чтобы не пускать чужих; сегодня с них лучше всего видно, сколько разных
    народов когда-то уживалось в этом городе.
  tip: >-
    Нижние улочки открыты для свободной прогулки; в цитадель, мечеть и краеведческий музей верхней зоны
    нужен билет, его продают у ворот. Двух часов хватит, и удобнее всего заехать сюда на обратном пути
    из Вардзии, когда уже никуда не спешишь. Машину оставьте у нижнего входа — там же кафе и туалеты.
    В июле и августе мощёные дворы пышут жаром, а тени мало: приезжайте утром или после пяти, когда камень
    становится медовым и зажигается подсветка. Синагога открыта, только когда на месте её смотритель.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори до Хашури — около 130 км, затем на юг по S8 через Боржоми
    и вверх по ущелью Куры (Мтквари) до Ахалцихе: всего 205 км, примерно 3 часа 20 минут. Асфальт на всём
    пути. 45 км между Боржоми и Ахалцихе узкие и извилистые, а с декабря по март там бывают гололёд и
    туман, так что ставьте зимнюю резину. Заправиться можно в Хашури, Боржоми или Ахалцихе. Рабат возвышается
    в старом городе, на северном берегу реки Поцхови. Машины эконом-класса вполне достаточно.
fa:
  name: قلعهٔ راباتی (آخالتسیخه)
  short: >-
    تپهٔ حصاردار آخالتسیخه، جایی که کاخ جاقلی‌ها، مسجدی از قرن هجدهم و کلیسایی ارتدکس در یک حصار، بالای
    شهر قدیم، کنار هم نشسته‌اند.
  body: >-
    **کمتر دژی در گرجستان به اندازهٔ راباتی ارباب عوض کرده است: شاهزادگان گرجی، پاشاهای عثمانی، ژنرال‌های
    روس و، از همه تازه‌تر، مرمت‌گران.**


    تاریخ‌نامه‌های گرجی بنیاد دژی در اینجا را در قرن نهم به گوارام مامپالی، پسر پادشاه تائو، نسبت می‌دهند؛
    آن روزها این مکان هنوز لومسیا نام داشت. تا پایان قرن دوازدهم نامی تازه گرفته بود، آخالتسیخه، یعنی
    «دژ نو»، و از قرن سیزدهم مقر جاقلی‌ها، شاهزادگان سامتسخه، بود. در ۱۳۹۳ در برابر سپاه تیمور لنگ ایستادگی
    کرد، در ۱۵۷۹ به دست عثمانی‌ها افتاد و پایتخت یک پاشا شد، و در ۱۸۲۸ سپاهیان ژنرال پاسکویچ با یورش آن
    را گرفتند.


    بنایی که این داستان را از همه بهتر روایت می‌کند مسجد احمدیه است. آن را در ۱۷۵۲ حاجی احمد پاشا جاقلی
    ساخت؛ او از نوادگان شاهزادگان مسیحی بود و خود پاشای عثمانی شده بود. گنبدش که یادآور ایاصوفیهٔ قسطنطنیه
    است بر نقشهٔ یک کلیسای گرجی نشسته است. تا ۱۸۲۸ مسجد بود و از ۱۸۵۰ تا ۱۹۲۰ کلیسای مریم مقدس. گرداگردش
    مدرسه و مناره، کاخ جاقلی‌ها، حمام، ارگ و یک کلیسای ارتدکس ایستاده‌اند.


    در سال‌های ۲۰۱۱ تا ۲۰۱۲ دولت ۳۴ میلیون لاری خرج کرد و تقریباً همه‌چیز را از نو ساخت، و نتیجه هنوز
    محل اختلاف است: بخش بزرگی از سنگ‌کاری تمیز و روشن تازه است، پس راباتی را بازسازی‌ای بر استخوان‌بندی
    کهن ببینید، نه ویرانه‌ای تاریخی. کنیسه‌ای که اغلب در کنار آن نام برده می‌شود بیرون از باروها، در محلهٔ
    قدیمی راباتی، قرار دارد؛ کتیبه‌ای تاریخ آن را ۱۸۶۲ نشان می‌دهد، روزگاری که یکی از جامعه‌های بزرگ یهودی
    گرجستان در اینجا زندگی می‌کرد.


    در پایان قرن هفدهم، ترک‌ها، ارمنی‌ها، گرجی‌ها، یونانی‌ها و یهودیان در آخالتسیخه می‌زیستند و پدر شارل
    آزناوور هم در همین شهر به دنیا آمد. چنین باروهایی را برای بیرون نگه داشتن بیگانگان ساختند؛ امروز از
    فراز آن‌ها بهتر از هر جای دیگر می‌توان دید که این شهر روزگاری چه مردمان گوناگونی را در خود جای داده
    بود.
  tip: >-
    کوچه‌های پایینی را آزادانه می‌توان گشت؛ ارگ، مسجد و موزهٔ تاریخ منطقه در بخش بالایی بلیت می‌خواهند
    که دمِ دروازه فروخته می‌شود. دو ساعت کافی است، و این دیدار بهتر از همه در راه بازگشت از واردزیا جا
    می‌افتد، وقتی دیگر عجله‌ای ندارید. کنار ورودی پایینی پارک کنید؛ کافه‌ها و سرویس بهداشتی هم همان‌جاست.
    در ژوئیه و اوت حیاط‌های سنگ‌فرش گرما را به صورتتان پس می‌زنند و سایه کم است: صبح بیایید، یا بعد از
    ساعت پنج، وقتی سنگ رنگ عسل می‌گیرد و چراغ‌ها روشن می‌شوند. کنیسه فقط وقتی باز است که نگهبانش آنجا
    باشد.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب بگیرید و از کنار گوری تا خاشوری بروید، حدود ۱۳۰ کیلومتر؛ سپس به
    جنوب بپیچید و با جادهٔ S8 از بورجومی و بالای درهٔ متکواری تا آخالتسیخه ادامه دهید: روی هم ۲۰۵ کیلومتر
    و حدود ۳ ساعت و ۲۰ دقیقه. تمام مسیر آسفالت است. ۴۵ کیلومترِ میان بورجومی و آخالتسیخه باریک و پرپیچ‌وخم
    است و از دسامبر تا مارس ممکن است یخ‌زده و مه‌آلود باشد، پس لاستیک زمستانی نصب کنید. در خاشوری، بورجومی
    یا آخالتسیخه سوخت‌گیری کنید. راباتی در شهر قدیم، بر کرانهٔ شمالی رود پوتسخووی، سر برافراشته است. خودروی
    کلاس اکونومی کاملاً کافی است.
he:
  name: מבצר רבאטי (אחאלציחה)
  short: >-
    הגבעה המוקפת חומה של אחאלציחה, שבה ארמון בני ג'קלי, מסגד מהמאה ה-18 וכנסייה אורתודוקסית חולקים מתחם
    אחד מעל העיר העתיקה.
  body: >-
    **מעטים המבצרים בגאורגיה שהחליפו כל כך הרבה אדונים כמו רבאטי: נסיכים גאורגים, פאשות עות'מאנים, גנרלים
    רוסים, ולאחרונה – המשחזרים.**


    הכרוניקות הגאורגיות מייחסות את הקמת המצודה כאן, במאה ה-9, לגוארם מאמפאלי, בנו של מלך טאו, בימים שבהם
    המקום עוד נקרא לומסיה. בסוף המאה ה-12 כבר נשא שם חדש, אחאלציחה – "המבצר החדש" – ומן המאה ה-13 היה
    מושבם של בני ג'קלי, נסיכי סמצחה. המבצר עמד בפני צבאו של טימור לנג ב-1393, נפל בידי העות'מאנים ב-1579
    והיה לבירתו של פאשה, וב-1828 נכבש בהסתערות בידי חייליו של הגנרל פסקביץ'.


    המבנה שמספר את הסיפור הזה טוב מכולם הוא מסגד אחמדיה. הוא הוקם ב-1752 בידי חאג'י אחמד פאשה ג'קלי, צאצא
    לנסיכים הנוצרים שבעצמו הפך לפאשה עות'מאני, וכיפתו, המהדהדת את איה סופיה שבקונסטנטינופול, מתנשאת מעל
    תוכנית של כנסייה גאורגית. עד 1828 שימש המבנה מסגד, ומ-1850 עד 1920 – כנסייה על שם מרים הבתולה. סביבו
    עומדים המדרסה והמינרט, ארמון בני ג'קלי, בית המרחץ, המצודה וכנסייה אורתודוקסית.


    ב-2011–2012 הוציאה המדינה 34 מיליון לארי ובנתה מחדש כמעט את הכול, והתוצאה עדיין שנויה במחלוקת: חלק
    גדול מן הבנייה, באבן בהירה ומסותתת בחדות, הוא חדש, ולכן כדאי לראות ברבאטי שחזור על גבי שלד עתיק ולא
    חורבה. בית הכנסת שנזכר לעיתים קרובות לצד המבצר עומד מחוץ לחומות, ברובע רבאטי הישן; כתובת מתארכת אותו
    לשנת 1862, כאשר חיה כאן אחת הקהילות היהודיות הגדולות של גאורגיה.


    בסוף המאה ה-17 חיו באחאלציחה טורקים, ארמנים, גאורגים, יוונים ויהודים, וכאן נולד גם אביו של שארל אזנבור.
    חומות כאלה נבנו כדי להשאיר זרים בחוץ; היום, מעליהן, רואים טוב מכל מקום אחר כמה עמים שונים חיו פעם
    בעיר הזאת.
  tip: >-
    בסמטאות התחתונות אפשר לשוטט בחופשיות; למצודה, למסגד ולמוזיאון ההיסטוריה האזורי שבאזור העליון נכנסים
    בכרטיס שנמכר בשער. שעתיים מספיקות, והביקור משתלב בנוחות רבה ביותר בדרך חזרה מוורדזיה, כשהשעון כבר
    אינו לוחץ. החנו ליד הכניסה התחתונה, ושם תמצאו גם בתי קפה ושירותים. ביולי ובאוגוסט החצרות המרוצפות
    מחזירות את החום היישר אליכם והצל מועט: בואו בבוקר, או אחרי חמש, כשהאבן מקבלת גוון של דבש והאורות נדלקים.
    בית הכנסת פתוח רק כשהשומר שלו נמצא במקום.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי, עד חשורי – כ-130 ק"מ – ומשם פנו דרומה לכביש S8, דרך
    בורג'ומי ובמעלה ערוץ המטקוורי עד אחאלציחה: 205 ק"מ בסך הכול, כ-3 שעות ו-20 דקות. הכביש סלול לכל אורכו.
    45 הקילומטרים שבין בורג'ומי לאחאלציחה צרים ומפותלים, ומדצמבר עד מרץ עלולים להיות בהם קרח וערפל, ולכן
    התקינו צמיגי חורף. תדלקו בחשורי, בבורג'ומי או באחאלציחה. רבאטי מתנשא בעיר העתיקה, על הגדה הצפונית
    של נהר פוצחובי. רכב מקטגוריית אקונומי מספיק לגמרי.
ar:
  name: قلعة راباتي (أخالتسيخي)
  short: >-
    تلّة أخالتسيخي المسوّرة، حيث يتقاسم قصر آل جاقيلي وجامع من القرن الثامن عشر وكنيسة أرثوذكسية سورًا
    واحدًا فوق البلدة القديمة.
  body: >-
    **قليلة هي القلاع في جورجيا التي تعاقب عليها من الأسياد بقدر ما تعاقب على راباتي: أمراء جورجيون، وباشوات
    عثمانيون، وجنرالات روس، وأخيرًا المرمّمون.**


    تنسب الحوليات الجورجية تأسيس حصن هنا في القرن التاسع إلى غوارام مامبالي، ابن ملك تاو، حين كان المكان
    لا يزال يُدعى لومسيا. وبحلول أواخر القرن الثاني عشر صار له اسم جديد، أخالتسيخي، أي «القلعة الجديدة»،
    ومنذ القرن الثالث عشر غدا مقرّ آل جاقيلي، أمراء سامتسخي. صمد أمام جيش تيمورلنك عام 1393، وسقط في يد
    العثمانيين عام 1579 فصار عاصمةً لباشا، ثم اقتحمته قوات الجنرال باسكيفيتش عام 1828.


    وخير ما يروي هذه الحكاية جامع أحمدية. شيّده عام 1752 الحاج أحمد باشا جاقيلي، سليل الأمراء المسيحيين
    الذي صار باشا عثمانيًا، وتقوم قبّته، التي تستحضر آيا صوفيا في القسطنطينية، فوق مخطط كنيسة جورجية.
    ظلّ جامعًا حتى عام 1828، ثم صار من 1850 إلى 1920 كنيسةً للسيدة العذراء. ومن حوله تقوم المدرسة والمئذنة،
    وقصر آل جاقيلي، والحمّام، والقلعة الداخلية، وكنيسة أرثوذكسية.


    في 2011–2012 أنفقت الدولة 34 مليون لاري لإعادة بناء كل شيء تقريبًا، ولا تزال النتيجة موضع خلاف: فمعظم
    البناء الحجري الفاتح الحادّ الحواف جديد، لذا انظروا إلى راباتي بوصفها إعادة بناء فوق عظام قديمة لا
    أطلالًا. أما الكنيس الذي يُذكر غالبًا إلى جانبها فيقف خارج الأسوار، في حيّ راباتي القديم؛ ويؤرّخه
    نقش بعام 1862، يوم كانت هنا واحدة من كبرى الجاليات اليهودية في جورجيا.


    في أواخر القرن السابع عشر كان يسكن أخالتسيخي أتراك وأرمن وجورجيون ويونانيون ويهود، وفيها وُلد أيضًا
    والد شارل أزنافور. بُنيت أسوار كهذه لإبقاء الغرباء خارجها؛ أما اليوم فمن فوقها ترون، خيرًا من أي مكان
    آخر، كم من الشعوب المختلفة احتضنت هذه البلدة يومًا.
  tip: >-
    الأزقّة السفلى مفتوحة للتجوال بحرية؛ أما القلعة الداخلية والجامع ومتحف التاريخ الإقليمي في المنطقة
    العليا فتحتاج إلى تذكرة تُشترى عند البوابة. تكفي ساعتان، والزيارة أنسب ما تكون في طريق العودة من فاردزيا،
    حين لا يعود الوقت ضاغطًا. اركنوا السيارة عند المدخل السفلي، وهناك أيضًا المقاهي ودورات المياه. في
    يوليو وأغسطس تردّ الساحات المرصوفة الحرّ إليكم والظلّ شحيح: تعالوا صباحًا، أو بعد الخامسة، حين يكتسي
    الحجر لون العسل وتُضاء الأنوار. لا يُفتح الكنيس إلا حين يكون حارسه موجودًا.
  route: >-
    من تبليسي خذوا الطريق E60/S1 غربًا مرورًا بغوري حتى خاشوري، نحو 130 كم، ثم انعطفوا جنوبًا إلى الطريق
    S8 عبر بورجومي صعودًا في وادي متكفاري حتى أخالتسيخي: 205 كم في المجمل، ونحو 3 ساعات و20 دقيقة. الطريق
    معبّد على امتداده. والكيلومترات الـ45 بين بورجومي وأخالتسيخي ضيقة وكثيرة المنعطفات، وقد يغطيها الجليد
    والضباب من ديسمبر إلى مارس، فركّبوا إطارات شتوية. تزوّدوا بالوقود في خاشوري أو بورجومي أو أخالتسيخي.
    ترتفع راباتي في البلدة القديمة على الضفة الشمالية لنهر بوتسخوفي. السيارة الاقتصادية تفي بالغرض تمامًا.
