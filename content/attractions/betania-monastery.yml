ka:
  name: ბეთანიის მონასტერი
  short: ოქროს ხანის მონასტერი ვერეს ტყიან ხეობაში, სადაც თამარ მეფე მისსავე სიცოცხლეში დახატული ფრესკიდან
    გიყურებთ.
  body: >-
    **თბილისიდან პირდაპირ ხაზზე სულ თექვსმეტი კილომეტრია, ბეთანიაში კი ისეთი განცდაა, თითქოს ყველაფრისგან
    ერთი დღის სავალზე ხართ.** მონასტერი ვერეს ტყიან ხეობაშია მიმალული, სახელი კი სახარებისეული ბეთანიიდან
    აქვს — ლაზარეს, მარიამისა და მართას სოფლიდან. ის ორბელთა საგვარეულო მონასტერი იყო: სამხრეთ მკლავზე
    სუმბატ და ლიპარიტ ორბელები დღესაც ღვთისმშობლის წინაშე დგანან. ღვთისმშობლის შობის გუმბათოვანი ტაძარი
    XII–XIII საუკუნეების მიჯნაზე აშენდა, სავარაუდოდ, უფრო ძველი ბაზილიკის ადგილას; გვერდით წმინდა გიორგის
    პატარა დარბაზული ეკლესიაა, 1196 წლისა, და დანგრეული კოშკი.


    აქ მოსვლის მთავარი მიზეზი ჩრდილოეთ მკლავშია. დაახლოებით 1207 წელს იქ გვერდიგვერდ სამი გვირგვინოსანი
    გამოსახეს: გიორგი III, მისი ასული თამარ მეფე და თამარის ძე, გიორგი IV ლაშა — უწვერული ჭაბუკი, გვირგვინითა
    და ხმლით. ეს თამარის იმ იშვიათ გამოსახულებათაგანია, რომლებიც მის სიცოცხლეშივე შეიქმნა; 1851 წელს რუსმა
    თავადმა გრიგორი გაგარინმა პორტრეტი გაწმინდა და გამოაქვეყნა. დააკვირდით იმასაც, რაც აკლია: არცერთ სამეფო
    ფიგურას შარავანდედი არ ადგას, ქართულ მხატვრობაში კი სწორედ ის გამოარჩევდა ხოლმე მეფეს. ირგვლივ ქრისტეს
    ვნებანი, ძველი აღთქმის სცენები და განკითხვის დღე მძიმედაა დაზიანებული, მაგრამ ბინდბუნდში ფერები ბათქაშიდან
    მაინც ამოდის.


    ბეთანიის ახალი ისტორიაც ასეთივე ჯიუტია. XIX საუკუნის მეორე ნახევარში მონასტერი მღვდელმონაზონმა სპირიდონ
    ქეთილაძემ აღადგინა; ისიც და მისი მემკვიდრე ილია ფანცულაიაც საბჭოთა რეპრესიებს ემსხვერპლნენ — ორივე
    დახვრიტეს. მიუხედავად ამისა, ბეთანია 1963 წლამდე, არაოფიციალურად, საქართველოს ერთადერთ მოქმედ მონასტრად
    რჩებოდა. თხუთმეტწლიანი დუმილის შემდეგ, 1978 წელს, პატრიარქმა ილია II-მ საბჭოთა ხელისუფლებისგან მისი
    ხელახლა გახსნის ნებართვა მიიღო. ბერები ისევ აქ არიან, ტყე კი გზას დღესაც მშვიდად ინახავს.
  tip: >-
    ბეთანია მოქმედი მამათა მონასტერია. მხრები და მუხლები დაფარული გქონდეთ; ქალებმა თავსაფარი იქონიონ,
    გრძელი ქვედაბოლო კი პატივისცემის ნიშანია. ფრესკების გადაღებამდე ნებართვა იკითხეთ. ტაძარში ბნელა —
    ერთი წუთი აცალეთ თვალებს, რომ შეეჩვიონ. სამეფო პორტრეტები ჩრდილოეთ მკლავშია: საკურთხევლისკენ პირით
    თუ დადგებით, მარცხნივ. მონასტერთან არც მაღაზიაა და არც კაფე — წყალი და საჭმელი გზად, წყნეთში იყიდეთ.
    ყველაზე წყნარი სამუშაო დღის დილაა; ხმადაბლა ილაპარაკეთ — ეს ჯერ სალოცავია და მერე ძეგლი.
  route: >-
    თბილისიდან ვაკის გავლით წყნეთის გზატკეცილს აჰყევით, გაიარეთ წყნეთი და გზას გორაკებზე გადაღმა გაჰყევით,
    სანამ თბილისი–მანგლისის გზას (შ36) არ შეუერთდება. შესაყართან მარჯვნივ, ბეთანიის ნიშნით, შ159-ზე გადაუხვიეთ.
    სულ დაახლოებით 35 კმ-ია და საათი და ხუთი წუთი. ბოლო 7 კმ ვერეს ხეობაში ეშვება: ვიწრო, ციცაბო გზაა,
    მჭიდრო მოსახვევებით. დღეს მას ბეტონის საფარი აქვს, მაგრამ ნელა იარეთ და ბრმა მოსახვევებში შემხვედრ
    მანქანას ელოდეთ. მშრალ ამინდში ფრთხილი მძღოლი ჩვეულებრივი მანქანითაც ჩავა; გვიანი შემოდგომიდან ადრე
    გაზაფხულამდე, როცა ჩრდილიან მოსახვევებში ყინული დგება, კროსოვერი ან ჯიპი აირჩიეთ. საწვავი თბილისში
    ჩაასხით. უკან წრიულად დაბრუნდით — შ36-ით აღმოსავლეთისკენ, კოჯრის გავლით.
en:
  name: Betania Monastery
  short: >-
    A Golden Age monastery deep in the wooded Vere gorge, where Queen Tamar looks out from a fresco painted
    in her own lifetime.
  body: >-
    **Betania is only sixteen kilometres from Tbilisi as the crow flies, yet it feels a day's ride from
    anywhere.** The monastery hides in the wooded valley of the Vere and takes its name from Bethany,
    the Gospel village of Lazarus, Mary and Martha. It was the family abbey of the Orbeli princes, and
    on the south transept Sumbat and Liparit Orbeli still stand before the Mother of God. The domed church
    of the Nativity of the Mother of God rose at the turn of the 12th and 13th centuries, probably over
    an older basilica; beside it are the small hall church of St George, dated 1196, and a ruined tower.


    The reason to come is in the north transept. There, around 1207, three crowned rulers were painted
    side by side: George III, his daughter Queen Tamar, and her son George IV Lasha, a beardless young
    king with crown and sword. It is one of the very few images of Tamar made in her lifetime; the Russian
    prince Grigory Gagarin cleaned and published it in 1851. Notice what is missing, too: none of the
    royal figures has a halo, the mark that usually set a monarch apart in Georgian painting. Around them
    the Passion, Old Testament scenes and the Last Judgement are badly damaged, yet in the dim light their
    colours still surface from the plaster.


    The monastery's modern story is just as stubborn. The hieromonk Spiridon Ketiladze restored it in
    the later 19th century; he and his successor, Ilia Pantsulaia, were both shot in the Soviet purges.
    Even so, Betania stayed, unofficially, the only working monastery in Georgia until 1963. After fifteen
    silent years, Patriarch Ilia II won permission to reopen it in 1978. The monks are back, and the forest
    still keeps the road quiet.
  tip: >-
    Betania is a working men's monastery. Cover shoulders and knees; women should bring a headscarf, and
    a long skirt is the respectful choice. Ask before photographing the frescoes. The church is dim, so
    give your eyes a minute to adjust. The royal portraits are in the north transept, on your left as
    you face the altar. There is no shop or café at the monastery: bring water, and buy food in Tskneti
    on the way. Weekday mornings are the quietest; keep voices low, as this is a place of prayer first
    and a monument second.
  route: >-
    Leave Tbilisi through Vake, climb the Tskneti highway through leafy Tskneti and follow the road across
    the hills to the Tbilisi–Manglisi road (Sh36); right at the junction, take the signposted Betania
    road (Sh159). In all it is about 35 km and 1 hour 5 minutes. The last 7 km drop into the Vere gorge
    as a narrow lane of steep hairpins. It now has a concrete surface, but drive slowly and expect oncoming
    cars on blind bends. In dry weather a careful driver manages in an ordinary car; from late autumn
    to early spring, when ice lingers on shaded curves, choose a crossover or SUV. For a loop home, return
    east along the Sh36 through Kojori.
ru:
  name: Монастырь Бетания
  short: >-
    Монастырь Золотого века в глубине лесистого ущелья Вере, где царица Тамар смотрит с фрески, написанной
    ещё при её жизни.
  body: >-
    **По прямой Бетания всего в шестнадцати километрах от Тбилиси, а ощущение такое, будто до неё день
    пути откуда угодно.** Монастырь прячется в лесистой долине Вере и назван в честь Вифании — евангельского
    селения Лазаря, Марии и Марфы. Это была родовая обитель князей Орбели, и в южном рукаве креста Сумбат
    и Липарит Орбели до сих пор стоят перед Богородицей. Купольная церковь Рождества Богородицы поднялась
    на рубеже XII и XIII веков, вероятно, на месте более древней базилики; рядом — маленькая однонефная
    церковь Святого Георгия, датированная 1196 годом, и руины башни.


    Приезжать стоит ради северного рукава. Там около 1207 года бок о бок написали трёх венценосцев: Георгия
    III, его дочь царицу Тамар и её сына Георгия IV Лашу — безбородого юного царя с короной и мечом. Это
    одно из совсем немногих изображений Тамар, созданных при её жизни; в 1851 году русский князь Григорий
    Гагарин расчистил и опубликовал его. Заметьте и то, чего здесь нет: ни у одной из царских фигур нет
    нимба — знака, которым в грузинской живописи обычно выделяли монарха. Вокруг них Страсти, ветхозаветные
    сцены и Страшный суд сильно повреждены, но в полумраке их краски всё ещё проступают сквозь штукатурку.


    Новейшая история монастыря не менее упряма. Иеромонах Спиридон Кетиладзе восстановил его во второй
    половине XIX века; и он, и его преемник Илья Панцулая были расстреляны в годы советских репрессий.
    И всё же Бетания неофициально оставалась единственным действующим монастырём Грузии до 1963 года.
    После пятнадцати лет молчания, в 1978 году, Патриарх Илия II добился разрешения вновь открыть его.
    Монахи вернулись, а лес по-прежнему хранит тишину дороги.
  tip: >-
    Бетания — действующий мужской монастырь. Плечи и колени должны быть закрыты; женщинам нужен платок,
    а длинная юбка — уважительный выбор. Прежде чем фотографировать фрески, спросите разрешения. В церкви
    темно, дайте глазам минуту привыкнуть. Царские портреты — в северном рукаве, слева, если стоять лицом
    к алтарю. Ни лавки, ни кафе при монастыре нет: возьмите воду, а еду купите по дороге, в Цхнети. Тише
    всего в будни по утрам; говорите вполголоса — это прежде всего место молитвы и лишь потом памятник.
  route: >-
    Выезжайте из Тбилиси через Ваке, поднимайтесь по Цхнетскому шоссе через зелёный Цхнети и по дороге
    через холмы выезжайте на трассу Тбилиси — Манглиси (Sh36); на развилке направо, на Бетанийскую дорогу
    с указателем (Sh159). Всего около 35 км и 1 час 5 минут. Последние 7 км спускаются в ущелье Вере узкой
    дорогой с крутыми серпантинами. Сейчас покрытие бетонное, но поезжайте медленно и ждите встречных
    машин за слепыми поворотами. В сухую погоду аккуратный водитель справится на обычной легковушке; с
    поздней осени до ранней весны, когда в тени поворотов держится лёд, берите кроссовер или внедорожник.
    Чтобы вернуться по кольцу, поезжайте домой на восток по Sh36 через Коджори.
fa:
  name: صومعهٔ بتانیا
  short: >-
    صومعه‌ای از عصر طلایی در ژرفای درهٔ جنگلی وره، جایی که ملکه تامار از دیوارنگاره‌ای می‌نگرد که در زمان
    حیات خودش کشیده شد.
  body: >-
    **بتانیا در خط مستقیم تنها شانزده کیلومتر با تفلیس فاصله دارد، اما حس می‌کنید از هر جایی یک روز راه
    دور است.** صومعه در درهٔ جنگلی وره پنهان شده و نامش را از بیت‌عنیا گرفته است، روستای انجیلیِ ایلعازر
    و مریم و مرتا. این صومعهٔ خانوادگی شاهزادگان اوربلی بود، و در بازوی جنوبی کلیسا هنوز سومبات و لیپاریت
    اوربلی در برابر مادر خدا ایستاده‌اند. کلیسای گنبددار میلاد مادر خدا در گذار سده‌های دوازدهم و سیزدهم
    برپا شد، احتمالاً بر جای باسیلیکایی کهن‌تر؛ کنار آن کلیسای کوچک تک‌شبستانی گئورگی قدیس، با تاریخ ۱۱۹۶،
    و ویرانهٔ یک برج قرار دارد.


    دلیل آمدن در بازوی شمالی است. آنجا، حدود سال ۱۲۰۷، سه فرمانروای تاج‌بر سر را کنار هم نقش کردند: گئورگی
    سوم، دخترش ملکه تامار، و پسر تامار، گئورگی چهارم لاشا، پادشاهی جوان و بی‌ریش با تاج و شمشیر. این یکی
    از معدود تصویرهای تامار است که در زمان حیاتش ساخته شده؛ شاهزادهٔ روس گریگوری گاگارین در ۱۸۵۱ آن را
    پاک‌سازی و منتشر کرد. به آنچه غایب است هم دقت کنید: هیچ‌یک از پیکره‌های شاهانه هاله ندارد، نشانه‌ای
    که در نقاشی گرجی معمولاً پادشاه را از دیگران جدا می‌کرد. پیرامون آن‌ها صحنه‌های مصائب مسیح، صحنه‌های
    عهد عتیق و داوری واپسین سخت آسیب دیده‌اند، اما در نور کم هنوز رنگ‌هایشان از دل گچ بیرون می‌زند.


    داستان امروزیِ صومعه نیز به همان اندازه سرسختانه است. هیرومونک (راهب‌کشیش) اسپیریدون کتیلادزه آن را
    در نیمهٔ دوم سدهٔ نوزدهم مرمت کرد؛ او و جانشینش، ایلیا پانتسولایا، هر دو در تصفیه‌های شوروی تیرباران
    شدند. با این همه، بتانیا به‌طور غیررسمی تا ۱۹۶۳ تنها صومعهٔ فعال گرجستان ماند. پس از پانزده سال سکوت،
    پاتریارک ایلیای دوم در ۱۹۷۸ اجازهٔ بازگشایی آن را گرفت. راهبان بازگشته‌اند و جنگل هنوز جاده را آرام
    نگه می‌دارد.
  tip: >-
    بتانیا صومعه‌ای فعال برای راهبان مرد است. شانه‌ها و زانوها را بپوشانید؛ بانوان روسری بیاورند و دامن
    بلند انتخابی محترمانه است. پیش از عکاسی از دیوارنگاره‌ها اجازه بگیرید. کلیسا کم‌نور است؛ یک دقیقه
    به چشم‌هایتان فرصت دهید. پرتره‌های شاهانه در بازوی شمالی‌اند، وقتی رو به محراب بایستید، در سمت چپ.
    صومعه فروشگاه یا کافه ندارد: آب همراه بیاورید و خوراکی را سر راه در تسخنتی بخرید. صبح‌های روزهای کاری
    از همه آرام‌تر است؛ آهسته سخن بگویید، چون اینجا پیش از هر چیز جای نیایش است و پس از آن یک بنای تاریخی.
  route: >-
    از راه واکه از تفلیس بیرون بروید، از بزرگراه تسخنتی و از میان تسخنتیِ پردرخت بالا بروید و جاده را
    در میان تپه‌ها تا جادهٔ تفلیس–مانگلیسی (Sh36) دنبال کنید؛ سر دوراهی به راست، وارد جادهٔ بتانیا (Sh159)
    شوید که تابلو دارد. روی‌هم حدود ۳۵ کیلومتر و ۱ ساعت و ۵ دقیقه. ۷ کیلومتر آخر به شکل جاده‌ای باریک
    با پیچ‌های تند سنجاق‌سری به درهٔ وره پایین می‌رود. اکنون رویهٔ آن بتنی است، اما آهسته برانید و در
    پیچ‌های کور منتظر خودروی روبه‌رو باشید. در هوای خشک رانندهٔ محتاط با خودروی معمولی از پس آن برمی‌آید؛
    از اواخر پاییز تا اوایل بهار، که یخ در پیچ‌های سایه‌گیر می‌ماند، کراس‌اوور یا شاسی‌بلند بگیرید. برای
    بازگشت از مسیری دیگر، از Sh36 به سوی شرق و از راه کوجوری برگردید.
he:
  name: מנזר בטניה
  short: מנזר מתור הזהב בלב ערוץ הוורה המיוער, שבו המלכה תמר משקיפה מציור קיר שצויר עוד בימי חייה.
  body: >-
    **בקו אווירי בטניה רחוקה מטביליסי שישה-עשר קילומטרים בלבד, ובכל זאת נדמה שהיא רחוקה יום נסיעה מכל
    מקום.** המנזר מסתתר בעמק המיוער של הוורה, ושמו לקוח מבית עניה, הכפר מן הבשורות של אלעזר, מרים ומרתה.
    זה היה מנזר המשפחה של נסיכי אורבלי, ובזרוע הדרומית של הכנסייה עומדים עד היום סומבאט וליפאריט אורבלי
    לפני אם האלוהים. כנסיית הכיפה של הולדת אם האלוהים קמה במפנה המאות ה-12 וה-13, כנראה על מקומה של בזיליקה
    קדומה יותר; לצידה ניצבות כנסיית האולם הקטנה של גאורגיוס הקדוש, המתוארכת ל-1196, וחורבות של מגדל.


    הסיבה לבוא נמצאת בזרוע הצפונית. שם, בסביבות 1207, צוירו זה לצד זה שלושה שליטים עטורי כתר: גיאורגי
    השלישי, בתו המלכה תמר, ובנה גיאורגי הרביעי לשה, מלך צעיר חסר זקן, עם כתר וחרב. זהו אחד הדימויים המעטים
    מאוד של תמר שנעשו בימי חייה; הנסיך הרוסי גריגורי גגרין ניקה אותו ופרסם אותו ב-1851. שימו לב גם למה
    שחסר: לאף אחת מן הדמויות המלכותיות אין הילה, הסימן שבדרך כלל ייחד את המלך בציור הגאורגי. סביבן, סצנות
    הפסיון (ייסורי ישו), תמונות מן הברית הישנה ויום הדין האחרון ניזוקו קשות, אך באור העמום צבעיהן עדיין
    עולים מתוך הטיח.


    גם סיפורו המודרני של המנזר עיקש לא פחות. ההירומונך (נזיר-כומר) ספירידון קטילאדזה שיקם אותו במחצית
    השנייה של המאה ה-19; הוא ויורשו, איליה פנצולאיה, נורו שניהם בטיהורים הסובייטיים. ובכל זאת נותרה בטניה,
    באופן לא רשמי, המנזר הפעיל היחיד בגאורגיה עד 1963. אחרי חמש-עשרה שנות שתיקה, השיג הפטריארך איליה השני
    ב-1978 היתר לפתוח אותו מחדש. הנזירים חזרו, והיער עדיין שומר על שקט הדרך.
  tip: >-
    בטניה היא מנזר גברים פעיל. כסו כתפיים וברכיים; נשים מתבקשות להביא כיסוי ראש, וחצאית ארוכה היא הבחירה
    המכבדת. בקשו רשות לפני שמצלמים את ציורי הקיר. הכנסייה אפלולית, אז תנו לעיניים דקה להסתגל. הדיוקנאות
    המלכותיים נמצאים בזרוע הצפונית, משמאלכם כשאתם פונים אל המזבח. במנזר אין חנות ואין בית קפה: הביאו מים,
    וקנו אוכל בדרך, בצחנטי. בבקרים של ימי חול הכי שקט; דברו בקול נמוך, כי זהו קודם כול מקום תפילה ורק
    אחר כך אתר היסטורי.
  route: >-
    צאו מטביליסי דרך ואקה, טפסו בכביש צחנטי דרך צחנטי הירוקה, והמשיכו בדרך שחוצה את הגבעות עד כביש טביליסי–מנגליסי
    (Sh36); בצומת פנו ימינה לכביש בטניה המשולט (Sh159). בסך הכול כ-35 ק״מ ושעה וחמש דקות. 7 הק״מ האחרונים
    יורדים אל ערוץ הוורה בדרך צרה עם עיקולי סרפנטינה תלולים. היום הדרך מצופה בבטון, אבל סעו לאט וצפו לרכבים
    מולכם בעיקולים עיוורים. במזג אוויר יבש נהג זהיר יסתדר ברכב רגיל; מסוף הסתיו עד תחילת האביב, כשהקרח
    נשאר בעיקולים המוצלים, בחרו קרוסאובר או רכב שטח. כדי לחזור במסלול מעגלי, סעו מזרחה בכביש Sh36 דרך
    קוג'ורי.
ar:
  name: دير بيتانيا
  short: دير من العصر الذهبي في عمق وادي فيري المشجَّر، تطلّ فيه الملكة تامار من رسم جداري نُفّذ في حياتها.
  body: >-
    **لا تبعد بيتانيا عن تبليسي في خط مستقيم سوى ستة عشر كيلومتراً، ومع ذلك تشعر أنها على مسيرة يوم من
    أي مكان.** يختبئ الدير في وادي فيري المشجَّر، ويأخذ اسمه من بيت عنيا، قرية لعازر ومريم ومرثا في الإنجيل.
    كان ديراً عائلياً لأمراء أوربيلي، وفي الجناح الجنوبي ما زال سومبات وليباريت أوربيلي واقفَين أمام والدة
    الإله. ارتفعت كنيسة ميلاد والدة الإله ذات القبة عند منعطف القرنين الثاني عشر والثالث عشر، على الأرجح
    فوق بازيليكا أقدم؛ وإلى جانبها كنيسة القديس جاورجيوس الصغيرة ذات الصحن الواحد، المؤرخة بعام 1196،
    وبرج متهدم.


    أما سبب المجيء ففي الجناح الشمالي. هناك، نحو عام 1207، رُسم ثلاثة حكّام متوّجون جنباً إلى جنب: جيورجي
    الثالث، وابنته الملكة تامار، وابنها جيورجي الرابع لاشا، ملكاً شاباً أمرد يحمل التاج والسيف. وهي من
    الصور القليلة جداً لتامار التي صُنعت في حياتها؛ وقد نظّفها الأمير الروسي غريغوري غاغارين ونشرها عام
    1851. ولاحظ أيضاً ما هو غائب: لا هالة حول أي من الشخصيات الملكية، وهي العلامة التي كانت تميّز الملك
    عادة في الرسم الجورجي. ومن حولها تضررت كثيراً مشاهد آلام المسيح ومشاهد العهد القديم والدينونة الأخيرة،
    لكن ألوانها ما زالت تطفو من الجص في الضوء الخافت.


    وقصة الدير الحديثة لا تقل عناداً. رمّمه الراهب الكاهن سبيريدون كيتيلادزه في النصف الثاني من القرن
    التاسع عشر؛ وقُتل رمياً بالرصاص هو وخليفته إيليا بانتسولايا في حملات التطهير السوفيتية. ومع ذلك بقيت
    بيتانيا، بصورة غير رسمية، الدير العامل الوحيد في جورجيا حتى عام 1963. وبعد خمسة عشر عاماً من الصمت،
    انتزع البطريرك إيليا الثاني عام 1978 إذناً بإعادة فتحه. عاد الرهبان، وما زالت الغابة تحفظ للطريق هدوءه.
  tip: >-
    بيتانيا دير رجالي عامل. غطِّ الكتفين والركبتين؛ وعلى النساء إحضار غطاء للرأس، والتنورة الطويلة هي
    الخيار اللائق. استأذن قبل تصوير الرسوم الجدارية. الكنيسة معتمة، فامنح عينيك دقيقة لتعتادا الضوء. الصور
    الملكية في الجناح الشمالي، على يسارك وأنت تواجه المذبح. لا متجر ولا مقهى في الدير: احمل الماء، واشترِ
    الطعام في الطريق من تسخنيتي. صباحات أيام العمل هي الأهدأ؛ اخفض صوتك، فهذا مكان صلاة أولاً، ثم أثر
    تاريخي.
  route: >-
    غادر تبليسي عبر حي فاكي، واصعد طريق تسخنيتي السريع عبر تسخنيتي الوارفة الأشجار، وتابع الطريق عبر التلال
    حتى طريق تبليسي–مانغليسي (Sh36)؛ وعند التقاطع انعطف يميناً إلى طريق بيتانيا المزوّد باللافتات (Sh159).
    المسافة كلها نحو 35 كم، وتستغرق قرابة ساعة وخمس دقائق. تنحدر الكيلومترات السبعة الأخيرة إلى وادي فيري
    في طريق ضيق كثير المنعطفات الحادة. وهو اليوم مكسوّ بالخرسانة، لكن قُد ببطء وتوقّع سيارات قادمة عند
    المنعطفات العمياء. في الطقس الجاف يتدبّر السائق الحذر أمره بسيارة عادية؛ ومن أواخر الخريف حتى مطلع
    الربيع، حين يبقى الجليد في المنعطفات الظليلة، اختر سيارة كروس أوفر أو دفع رباعي. وللعودة من طريق آخر،
    اتجه شرقاً على Sh36 عبر كوجوري.
