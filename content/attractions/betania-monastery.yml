ka:
  name: ბეთანიის მონასტერი
  short: ოქროს ხანის არქიტექტურის შედევრი ვერეს ტყიან ხეობაში, თამარ მეფის იშვიათი თანადროული ფრესკული
    პორტრეტით.
  body: >-
    **ბეთანია ქართული ოქროს ხანის ხუროთმოძღვრების შედევრია, თბილისის გვერდით ჩამალული.** XII–XIII საუკუნეების
    მიჯნაზე აგებული მონასტერი ორბელთა სამთავრო სახლის სამფლობელო იყო და ვერეს ხეობის ტყიან კალთებში დგას,
    ცენტრიდან სულ 16 კილომეტრში სამხრეთ-დასავლეთით — მაინც ისეთი განცდაა, თითქოს ღრმა მთაში მოხვდი.


    ღვთისმშობლის შობის მთავარი ტაძარი დაახლოებით 1207 წლის სახელგანთქმულ ფრესკულ ჯგუფს ინახავს: სამი მონარქი
    — გიორგი III, თამარ მეფე და გიორგი IV ლაშა — ერთ კედელზეა გამოსახული. თამარის ეს პორტრეტი მისი იმ იშვიათ
    თანადროულ გამოსახულებათაგანია, რაც საერთოდ შემორჩა; ტაძარი მდიდარი ბიბლიური მოხატულობითაცაა შემკული.
    გვერდით პატარა წმინდა გიორგის ეკლესია დგას, 1196 წლისა.


    ბეთანიას საბჭოთა პერიოდის განსაკუთრებული ისტორიაც აქვს: 1978 წელს კვლავ გაიხსნა და საბჭოთა საქართველოში
    ნებადართული ერთადერთი მოქმედი მონასტრებიდან იყო. დღეს აქ მამათა მონასტერი მოქმედებს — მოკრძალებულად
    ჩაცმა აუცილებელია. ვიზიტი ჩინებულად ერწყმის კოჯორს ნახევარდღიან მარშრუტად.
  tip: >-
    ეს მოქმედი მამათა მონასტერია: მხრები და მუხლები დაფარული გქონდეს, ქალებს თავსაფარი ურჩევნიათ; ფრესკების
    ფოტოგრაფირებამდე ნებართვა იკითხე. თამარის პორტრეტი ჩრდილოეთ კედელზეა — თან პატარა ფანარი ან ტელეფონის
    შუქი წაიღე, ინტერიერი ბუნდოვანია. მონასტერთან მაღაზია არ არის, წყალი წინასწარ აიღე. კოჯორთან დააწყვილე
    — ერთად იდეალური ნახევარი დღეა.
  route: >-
    თბილისიდან კოჯრის გზით სამხრეთ-დასავლეთისკენ, შემდეგ ბეთანიის მაჩვენებელთან ჩაუხვიე — სულ 28 კმ და
    დაახლოებით 55 წუთი. გზის უმეტესობა ასფალტიანია, მაგრამ ბოლო დაშვება ვერეს ხეობაში დახვეული გრუნტია,
    რომელიც წვიმის შემდეგ რბილდება — ამიტომ მაღალი კლირენსის კროსოვერი ან ჯიპი ურჩევნია სედანს. ხეობა მთელი
    წელი მისადგომია, დიდთოვლობის დღეების გარდა.
en:
  name: Betania Monastery
  short: A Golden Age masterpiece hidden in the forested Vere gorge beside Tbilisi, keeping one of the
    only contemporary fresco portraits of Queen Tamar.
  body: >-
    **Betania is a masterpiece of Georgia's Golden Age architecture hiding on Tbilisi's doorstep.** Built
    at the turn of the 12th–13th centuries as a domain of the Orbeli princely house, the monastery stands
    on the forested slopes of the Vere gorge only 16 km south-west of the city centre — yet the setting
    feels like deep mountain country.


    The main Church of the Nativity of the Mother of God preserves the famous fresco group of about 1207:
    three monarchs — George III, Queen Tamar and George IV Lasha — painted side by side on one wall. Tamar's
    portrait here is one of the very few contemporary images of her that survive anywhere, and the church
    is covered besides in rich biblical murals. Next to it stands the smaller Church of St George, dated
    1196.


    Betania also carries a remarkable Soviet-era story: reopened in 1978, it was one of the only working
    monasteries permitted in Soviet Georgia. Today it is an active male monastery — dress modestly. The
    visit pairs naturally with Kojori as a popular half-day trip from Tbilisi.
  tip: >-
    This is a working male monastery: keep shoulders and knees covered, a headscarf is appreciated for
    women, and ask before photographing the frescoes. The royal portraits are on the north wall — bring
    a small torch or use your phone light, as the interior is dim. There is no shop at the monastery, so
    carry water. Combine it with Kojori for an ideal half day out of the city.
  route: >-
    Leave Tbilisi south-west on the Kojori road, then turn off at the Betania sign — 28 km and about 55
    minutes in total. Most of the way is paved, but the final descent into the Vere valley is a winding
    gravel stretch that softens after rain, so a high-clearance crossover or SUV is a better choice than
    a sedan. The valley is reachable year-round apart from days of heavy snow.
ru:
  name: Монастырь Бетания
  short: Шедевр Золотого века, спрятанный в лесистом Верейском ущелье рядом с Тбилиси, с одним из немногих
    прижизненных фресковых портретов царицы Тамары.
  body: >-
    **Бетания — шедевр архитектуры грузинского Золотого века, скрывающийся у самого порога Тбилиси.** Монастырь,
    построенный на рубеже XII–XIII веков как владение княжеского дома Орбели, стоит на лесистых склонах
    ущелья Вере всего в 16 км к юго-западу от центра города — а ощущение такое, будто вы в глухих горах.


    Главный храм Рождества Богородицы хранит знаменитую фресковую группу около 1207 года: три монарха —
    Георгий III, царица Тамара и Георгий IV Лаша — написаны рядом на одной стене. Здешний портрет Тамары
    — один из очень немногих её прижизненных образов, сохранившихся вообще, а храм к тому же покрыт богатой
    библейской росписью. Рядом стоит меньшая церковь Святого Георгия 1196 года.


    У Бетании есть и примечательная советская история: вновь открытая в 1978 году, она была одним из немногих
    действующих монастырей, разрешённых в советской Грузии. Сегодня это действующий мужской монастырь —
    одевайтесь скромно. Визит естественно объединяется с Коджори в популярную поездку на полдня.
  tip: >-
    Это действующий мужской монастырь: плечи и колени должны быть закрыты, женщинам желателен платок, а
    перед съёмкой фресок спросите разрешения. Царские портреты — на северной стене; возьмите фонарик или
    подсветите телефоном, внутри полумрак. Магазина при монастыре нет, воду везите с собой. Объедините
    с Коджори — вместе выходит идеальные полдня вне города.
  route: >-
    Из Тбилиси на юго-запад по коджорской дороге, затем поворот у указателя на Бетанию — всего 28 км и
    около 55 минут. Большая часть пути асфальтирована, но финальный спуск в долину Вере — извилистый гравий,
    раскисающий после дождя, поэтому кроссовер с высоким клиренсом или внедорожник предпочтительнее седана.
    Долина доступна круглый год, кроме дней сильного снегопада.
fa:
  name: صومعهٔ بتانیا
  short: شاهکار عصر طلایی پنهان در درهٔ جنگلی وره در کنار تفلیس، با یکی از معدود چهره‌نگاری‌های هم‌زمان
    ملکه تامار.
  body: >-
    **بتانیا شاهکار معماری عصر طلایی گرجستان است که درست در آستانهٔ تفلیس پنهان شده.** این صومعه که در
    گذار سده‌های دوازدهم و سیزدهم به‌عنوان قلمرو خاندان شاهزادگی اوربلی ساخته شد، بر دامنه‌های جنگلی درهٔ
    وره ایستاده است، تنها 16 کیلومتری جنوب غربی مرکز شهر — با این حال حال‌وهوایش مانند کوهستانی دورافتاده
    است.


    کلیسای اصلیِ میلاد مادر خدا گروه دیوارنگارهٔ نامدار حدود سال 1207 را نگه می‌دارد: سه پادشاه — گئورگی
    سوم، ملکه تامار و گئورگی چهارم لاشا — کنار هم بر یک دیوار نقش شده‌اند. چهرهٔ تامار در اینجا یکی از
    بسیار معدود تصویرهای هم‌زمان اوست که در جهان بازمانده، و کلیسا افزون بر آن پوشیده از دیوارنگاره‌های
    غنی انجیلی است. در کنارش کلیسای کوچک‌تر سنت گئورگی به تاریخ 1196 ایستاده است.


    بتانیا داستان چشمگیری از دوران شوروی هم دارد: در 1978 دوباره گشوده شد و یکی از تنها صومعه‌های فعال
    مجاز در گرجستان شوروی بود. امروز صومعهٔ فعال مردانه است — پوشش محجوب لازم است. بازدید آن به‌طور طبیعی
    با کوجوری در یک سفر نیم‌روزهٔ محبوب از تفلیس جفت می‌شود.
  tip: >-
    اینجا صومعهٔ فعال مردانه است: شانه‌ها و زانوها را بپوشانید، روسری برای زنان پسندیده است و پیش از عکاسی
    از دیوارنگاره‌ها اجازه بگیرید. چهره‌های شاهانه بر دیوار شمالی است — چراغ‌قوهٔ کوچک بیاورید یا از نور
    گوشی استفاده کنید، چون درون کلیسا کم‌نور است. در صومعه فروشگاهی نیست، آب همراه داشته باشید. آن را با
    کوجوری ترکیب کنید — با هم نیم‌روزی دلپذیر بیرون از شهر می‌سازند.
  route: >-
    از تفلیس به جنوب غربی با جادهٔ کوجوری بروید و سپس کنار تابلوی بتانیا بپیچید — روی هم 28 کیلومتر و حدود
    55 دقیقه. بیشتر راه آسفالت است، اما سرازیری پایانی به درهٔ وره تکه‌ای شنی و پیچ‌درپیچ است که پس از
    باران نرم می‌شود؛ پس کراس‌اوور شاسی‌بلند یا شاسی‌بلند از سواری بهتر است. دره تمام سال جز روزهای برف
    سنگین در دسترس است.
he:
  name: מנזר בטניה
  short: יצירת מופת של תור הזהב החבויה בערוץ המיוער של הוורה ליד טביליסי, ובה אחד מדיוקנאות הפרסקו בני-הזמן
    היחידים של המלכה תמר.
  body: >-
    **בטניה היא יצירת מופת של אדריכלות תור הזהב הגאורגי, מסתתרת ממש על מפתן טביליסי.** המנזר, שנבנה במפנה
    המאות ה-12 וה-13 כנחלת בית הנסיכים אורבלי, עומד על מדרונותיו המיוערים של ערוץ הוורה, 16 ק״מ בלבד דרומית-מערבית
    למרכז העיר — ובכל זאת התחושה היא של הרים עמוקים.


    כנסיית הולדת אם האלוהים הראשית משמרת את קבוצת הפרסקו המפורסמת משנת 1207 לערך: שלושה מלכים — גיאורגי
    השלישי, המלכה תמר וגיאורגי הרביעי לאשה — מצוירים זה לצד זה על קיר אחד. דיוקן תמר כאן הוא אחד מהדיוקנאות
    בני-זמנה המעטים מאוד ששרדו בכלל, והכנסייה מכוסה בנוסף בציורי קיר תנ"כיים עשירים. לצדה עומדת כנסיית
    גיאורגיוס הקדוש הקטנה משנת 1196.


    לבטניה גם סיפור סובייטי יוצא דופן: היא נפתחה מחדש ב-1978 והייתה מהמנזרים הפעילים היחידים שהותרו בגאורגיה
    הסובייטית. כיום זהו מנזר גברים פעיל — התלבשו בצניעות. הביקור משתלב באופן טבעי עם קוג'ורי לטיול חצי
    יום פופולרי מטביליסי.
  tip: >-
    זהו מנזר גברים פעיל: כסו כתפיים וברכיים, מטפחת ראש רצויה לנשים, ובקשו רשות לפני צילום הפרסקאות. דיוקנאות
    המלוכה נמצאים על הקיר הצפוני — הביאו פנס קטן או השתמשו באור הטלפון, שכן הפנים חשוך למדי. אין חנות במנזר,
    אז קחו מים. שלבו עם קוג'ורי — יחד יוצא חצי יום מושלם מחוץ לעיר.
  route: >-
    יוצאים מטביליסי דרומה-מערבה בכביש קוג'ורי ופונים בשלט לבטניה — 28 ק״מ וכ-55 דקות בסך הכול. רוב הדרך
    סלולה, אבל הירידה האחרונה אל עמק הוורה היא קטע כורכר מתפתל שמתרכך אחרי גשם, ולכן קרוסאובר גבוה או ג'יפ
    עדיפים על סדאן. העמק נגיש כל השנה, מלבד ימי שלג כבד.
ar:
  name: دير بيتانيا
  short: تحفة العصر الذهبي المختبئة في وادي فيري الحرجي بجوار تبليسي، وفيها واحدة من أندر صور الملكة تامار
    الجدارية المعاصرة لها.
  body: >-
    **بيتانيا تحفة من عمارة العصر الذهبي الجورجي تختبئ على عتبة تبليسي.** بُني الدير في مطلع القرن الثالث
    عشر عند منعطف القرنين الثاني عشر والثالث عشر ضمن أملاك بيت أوربيلي الأميري، ويقف على السفوح الحرجية
    لوادي فيري على بعد 16 كم فقط جنوب غربي وسط المدينة — ومع ذلك يوحي المكان بأنك في أعماق الجبال.


    تحفظ كنيسة ميلاد والدة الإله الرئيسية المجموعة الجدارية الشهيرة من نحو عام 1207: ثلاثة ملوك — جيورجي
    الثالث والملكة تامار وجيورجي الرابع لاشا — مرسومون جنباً إلى جنب على جدار واحد. وصورة تامار هنا من
    أندر صورها المعاصرة لها الباقية في العالم، والكنيسة فوق ذلك مكسوة بجداريات إنجيلية غنية. وإلى جانبها
    تقوم كنيسة القديس جيورجي الأصغر من عام 1196.


    ولبيتانيا قصة سوفييتية لافتة أيضاً: فقد أُعيد فتحها عام 1978 وكانت من الأديرة العاملة القليلة المسموح
    بها في جورجيا السوفييتية. وهي اليوم دير رجالي عامل — فالتزم باللباس المحتشم. وتقترن الزيارة بطبيعتها
    مع كوجوري في رحلة نصف يوم شعبية من تبليسي.
  tip: >-
    هذا دير رجالي عامل: غطِّ الكتفين والركبتين، ويُستحسن غطاء رأس للنساء، واستأذن قبل تصوير الجداريات.
    الصور الملكية على الجدار الشمالي — أحضر مصباحاً صغيراً أو استخدم ضوء هاتفك، فالداخل معتم. لا متجر في
    الدير، فاحمل الماء معك. اجمعها مع كوجوري — فمعاً تصنعان نصف يوم مثالي خارج المدينة.
  route: >-
    اخرج من تبليسي جنوباً غربياً على طريق كوجوري ثم انعطف عند لافتة بيتانيا — 28 كم ونحو 55 دقيقة إجمالاً.
    معظم الطريق معبّد، لكن النزول الأخير إلى وادي فيري مقطع حصوي متعرج يلين بعد المطر، لذا فإن كروس أوفر
    مرتفعاً أو سيارة دفع رباعي خير من السيدان. الوادي متاح طوال العام عدا أيام الثلوج الكثيفة.
