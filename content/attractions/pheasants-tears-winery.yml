ka:
  name: მარანი „ხოხბის ცრემლი“ (Pheasant's Tears)
  short: >-
    სიღნაღის გალავანში მდებარე მარანი და სამზარეულო, რომელმაც ქვევრის ქარვისფერი ღვინო მსოფლიოს ღვინის
    მოყვარულებს დაანახა.
  body: >-
    **ქართული თქმით, ნამდვილად კარგი ღვინო ხოხობსაც კი აატირებს — ამ თქმიდან მოდის სახელი „Pheasant's
    Tears“, „ხოხბის ცრემლი“.**


    მარანი 2007 წელს სიღნაღში ორმა კაცმა დააარსა. ერთი ამერიკელი მხატვარი ჯონ ვურდემანია, რომელიც საქართველოში
    პირველად 1996 წელს ჩამოვიდა, 1998 წლიდან კი სიღნაღში ცხოვრობს. მეორე — მევენახე გელა პატალიშვილი,
    რომლის ოჯახიც ამ მხარეში ღვინოს უკვე რვა თაობის განმავლობაში აყენებს. ისინი 2005 წელს შეხვდნენ ერთმანეთს,
    როცა ვურდემანი ვენახში ხატავდა.


    ღვინო აქ ქვევრში დგება — შიგნიდან ცვილით ამოლესილ თიხის ჭურჭელში, რომელიც მიწაშია ჩაფლული. დუღილი
    ადგილობრივი საფუვრით მიმდინარეობს, თეთრი ღვინო კი ჭაჭაზე სამი კვირიდან ექვს თვემდე რჩება; ჭაჭიდან
    როდის მოიხსნას, ამას კალენდარი კი არა, გემო წყვეტს. „ხოხბის ცრემლი“ იმ მარნებს შორისაა, რომლებმაც
    2000-იან და 2010-იან წლებში ქართული ქარვისფერი ქვევრის ღვინო დასავლეთის ბუნებრივი ღვინის მოყვარულებს
    გააცნო.


    ჯიშების ჩამონათვალი თითქმის საქართველოს პატარა რუკაა: რქაწითელი, კისი, მწვანე, ჩინური, ცოლიკოური,
    საფერავი, შავკაპიტო და იშვიათად ნახსენები თავკვერი. დეგუსტაციისას თეთრები გვერდიგვერდ დაიდგით და ჯერ
    ფერს შეხედეთ, მერე კი დაყნოსეთ.


    მარნის რესტორანი ბარათაშვილის ქუჩაზეა, ძველი ქალაქის გალავნის შიგნით. სამზარეულო ყოველდღე ადგილობრივ
    ბაზარზე ყიდულობს პროდუქტს, ამიტომ სუფრა სეზონთან ერთად იცვლება.


    სთხოვეთ ღვინო, რომელმაც ჭაჭაზე თვეები გაატარა, და ჭიქას სინათლეზე შეხედეთ: არც ყვითელია, არც ნარინჯისფერი
    — ის ფერი, რომელსაც ქართველები უბრალოდ ქარვისფერს ეძახიან.
  tip: >-
    შესვლა თავისუფალია; დეგუსტაცია და სადილი ცალკე, მენიუს მიხედვით იხდება. სეზონზე, განსაკუთრებით შაბათ-კვირას,
    მაგიდა წინასწარ დაჯავშნეთ. სიღნაღის ძველ უბანში ქუჩები ვიწროა — მანქანა მთავარ მოედანთან დატოვეთ და
    ბოლო მონაკვეთი ფეხით გაიარეთ. ვინც საჭესთან ზის, ღვინით მხოლოდ სუნით დატკბეს, ან ღამე სიღნაღში გაათიეთ
    — ეს ქალაქი ამას იმსახურებს. ბოდბის მონასტერი ორ კილომეტრშია, მირზაანში, ფიროსმანის სახლ-მუზეუმამდე
    კი დაღმართით დაახლოებით 13 კილომეტრია — ოციოდე წუთის სავალი.
  route: >-
    თბილისიდან სიღნაღამდე დაახლოებით 109 კმ-ია — 1 სთ 40 წთ, მთელი გზა ასფალტზე. გადით კახეთის გზატკეცილზე
    (ს5), გაიარეთ საგარეჯო და ბადიაური, შემდეგ გადაუხვიეთ სიღნაღის გზაზე (შ40). ბოლო მონაკვეთი ქალაქამდე
    მოკლე, მკვეთრი მოსახვევებით ადის. მარანი ბარათაშვილის ქუჩაზეა, გალავნის შიგნით; ძველი უბნის შესახვევები
    ვიწროა, ამიტომ მანქანა მთავარ მოედანთან ან ქუჩაზე დააყენეთ და ფეხით ჩაიარეთ. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია.
en:
  name: Pheasant's Tears Winery
  short: >-
    A qvevri cellar and kitchen inside Sighnaghi's walls that helped carry Georgian amber wine to the
    world's natural-wine lovers.
  body: >-
    **A Georgian saying holds that only a truly great wine can make a pheasant weep — and that is where
    Pheasant's Tears takes its name.**


    The winery was founded in Sighnaghi in 2007 by two men. John Wurdeman is an American painter who first
    came to Georgia in 1996 and settled in Sighnaghi in 1998. Gela Patalishvili is a Kakhetian winegrower
    whose family has made wine in the area for eight generations. They met in 2005, when Wurdeman was
    painting in a vineyard.


    The wine is made in qvevri — beeswax-lined clay vessels buried in the ground. Fermentation runs on
    native yeasts, and the white grapes stay on their skins for anything from three weeks to six months;
    when to press is decided by taste, not by the calendar. Pheasant's Tears is among the producers credited
    with bringing Georgian amber qvevri wine to Western natural-wine drinkers in the 2000s and 2010s.


    The list of grapes reads like a small map of the country: Rkatsiteli, Kisi, Mtsvane, Chinuri, Tsolikauri,
    Saperavi, Shavkapito and the rarely seen Tavkveri. At a tasting, set the whites side by side and look
    before you smell.


    The winery's restaurant is on Baratashvili Street, inside the old town walls. The kitchen buys at
    the local market every day, so the table changes with the season.


    Ask for a white that has spent months on its skins and hold the glass to the light: not yellow, not
    quite orange — the colour Georgians simply call amber.
  tip: >-
    Walking in is free; tastings and meals are paid separately, at menu prices. In season, and especially
    at weekends, book a table ahead. Sighnaghi's old-town lanes are narrow, so leave the car near the
    main square and walk the last stretch. Whoever is driving should enjoy the tasting by nose alone —
    or stay the night in Sighnaghi, which rewards an evening anyway. Bodbe Monastery is 2 km away, and
    the Pirosmani House Museum in Mirzaani is about 13 km, some 20 minutes' drive, down the hill.
  route: >-
    Sighnaghi is about 109 km from Tbilisi — roughly 1 hour 40 minutes, asphalt all the way. Take the
    Kakheti Highway (S5) through Sagarejo and Badiauri, then turn onto the Sighnaghi road (Sh40); the
    final climb into town is a run of short, sharp switchbacks. The winery is on Baratashvili Street,
    inside the walls, where the lanes are narrow: park on the main square or a nearby street and walk
    down. An economy car is entirely adequate.
ru:
  name: Винодельня «Слёзы фазана» (Pheasant's Tears)
  short: >-
    Марани с квеври и кухня в стенах Сигнахи — место, которое помогло грузинскому янтарному вину найти
    дорогу к ценителям натуральных вин по всему миру.
  body: >-
    **Грузинская поговорка утверждает, что заплакать фазана может заставить лишь по-настоящему великое
    вино, — отсюда и название Pheasant's Tears, «Слёзы фазана».**


    Винодельню основали в Сигнахи в 2007 году двое. Джон Вурдеман — американский художник, впервые приехавший
    в Грузию в 1996 году и осевший в Сигнахи в 1998-м. Гела Паталишвили — кахетинский виноградарь, чья
    семья делает вино в этих местах уже восемь поколений. Познакомились они в 2005 году, когда Вурдеман
    писал этюд в винограднике.


    Вино здесь делают в квеври — глиняных сосудах, выстланных изнутри пчелиным воском и зарытых в землю.
    Брожение идёт на местных дрожжах, а белый виноград остаётся на кожице от трёх недель до шести месяцев;
    когда отжимать, решает вкус, а не календарь. «Слёзы фазана» называют среди тех производителей, кто
    в 2000-е и 2010-е годы открыл грузинское янтарное вино из квеври западным любителям натуральных вин.


    Список сортов читается как маленькая карта страны: ркацители, киси, мцване, чинури, цоликоури, саперави,
    шавкапито и редко встречающийся тавквери. На дегустации поставьте белые рядом и сначала посмотрите
    на них, а уже потом нюхайте.


    Ресторан винодельни — на улице Бараташвили, в стенах старого города. Продукты кухня каждый день закупает
    на местном рынке, так что стол меняется вместе с сезоном.


    Попросите белое, которое провело на кожице несколько месяцев, и поднимите бокал к свету: не жёлтое
    и не совсем оранжевое — цвет, который грузины называют просто янтарным.
  tip: >-
    Зайти можно бесплатно; дегустации и еда оплачиваются отдельно, по меню. В сезон, особенно в выходные,
    столик лучше бронировать заранее. Улочки старого Сигнахи узкие, поэтому оставьте машину у главной
    площади и последний отрезок пройдите пешком. Тому, кто за рулём, стоит дегустировать только носом
    — или остаться в Сигнахи на ночь: вечер здесь того стоит. Монастырь Бодбе — в 2 км, а до Дома-музея
    Пиросмани в Мирзаани — около 13 км, минут двадцать езды вниз с холма.
  route: >-
    Сигнахи — примерно в 109 км от Тбилиси, около 1 часа 40 минут, асфальт на всём пути. Езжайте по Кахетинскому
    шоссе (S5) через Сагареджо и Бадиаури, затем сверните на дорогу на Сигнахи (Sh40); последний подъём
    к городу — череда коротких крутых серпантинов. Винодельня на улице Бараташвили, в стенах старого города,
    где улочки узкие: оставьте машину на главной площади или на соседней улице и спуститесь пешком. Автомобиля
    эконом-класса вполне достаточно.
fa:
  name: شراب‌سازی اشک قرقاول (Pheasant's Tears)
  short: >-
    سردابی با خمره‌های کووری و آشپزخانه‌ای درون باروی سیغناغی، که به رساندن شراب کهربایی گرجستان به دوستداران
    شراب طبیعی در سراسر جهان یاری رساند.
  body: >-
    **مَثَلی گرجی می‌گوید تنها شرابی به‌راستی بزرگ می‌تواند قرقاول را به گریه بیندازد؛ و نام «اشک قرقاول»
    (Pheasant's Tears) از همین‌جا آمده است.**


    این شراب‌سازی را در سال ۲۰۰۷ دو مرد در سیغناغی بنیان نهادند. جان وردمن نقاشی آمریکایی است که نخستین
    بار در ۱۹۹۶ به گرجستان آمد و در ۱۹۹۸ در سیغناغی ماندگار شد. گلا پاتالیشویلی تاکداری کاختی است که خانواده‌اش
    هشت نسل است در این ناحیه شراب می‌سازد. آن دو در سال ۲۰۰۵ با هم آشنا شدند، هنگامی که وردمن در تاکستانی
    نقاشی می‌کرد.


    شراب اینجا در کووری ساخته می‌شود: خمره‌های سفالی که درونشان را با موم زنبور عسل اندود کرده‌اند و در
    خاک مدفون‌اند. تخمیر با مخمرهای بومی انجام می‌شود و انگورهای سفید از سه هفته تا شش ماه با پوستشان
    می‌مانند؛ زمان فشردن را مزه تعیین می‌کند، نه تقویم. «اشک قرقاول» از تولیدکنندگانی به شمار می‌آید که
    در دهه‌های ۲۰۰۰ و ۲۰۱۰ شراب کهربایی کووری گرجستان را به دوستداران غربی شراب طبیعی شناساندند.


    فهرست انگورها همچون نقشهٔ کوچکی از این سرزمین است: رکاتسیتلی، کیسی، متسوانه، چینوری، تسولیکائوری،
    ساپراوی، شاوکاپیتو و تاوکوریِ کمیاب. در مزه‌چشی، شراب‌های سفید را کنار هم بگذارید و پیش از بوییدن،
    نخست نگاهشان کنید.


    رستوران این شراب‌سازی در خیابان باراتاشویلی، درون باروی شهر کهنه است. آشپزخانه هر روز از بازار محلی
    خرید می‌کند، از این رو سفره با فصل‌ها دگرگون می‌شود.


    شرابی سفید بخواهید که ماه‌ها با پوستش مانده است و جام را رو به نور بگیرید: نه زرد است و نه چندان نارنجی؛
    رنگی که گرجی‌ها آن را به سادگی کهربایی می‌نامند.
  tip: >-
    ورود رایگان است؛ مزه‌چشی و غذا جداگانه و به نرخ منو حساب می‌شوند. در فصل گردشگری، به‌ویژه آخر هفته‌ها،
    میز را از پیش رزرو کنید. کوچه‌های شهر کهنهٔ سیغناغی باریک‌اند، پس خودرو را نزدیک میدان اصلی بگذارید
    و تکهٔ آخر را پیاده بروید. کسی که رانندگی می‌کند بهتر است تنها با بینی از مزه‌چشی لذت ببرد، یا شب
    را در سیغناغی بماند؛ شب‌های این شهر به هر حال ارزشش را دارد. صومعهٔ بودبه ۲ کیلومتر دورتر است و خانه‌موزهٔ
    پیروسمانی در میرزاانی حدود ۱۳ کیلومتر، یعنی نزدیک به ۲۰ دقیقه رانندگی در سرازیری تپه، فاصله دارد.
  route: >-
    سیغناغی حدود ۱۰۹ کیلومتر با تفلیس فاصله دارد؛ نزدیک به ۱ ساعت و ۴۰ دقیقه، و سراسر راه آسفالت است.
    از بزرگراه کاختی (S5) از میان ساگارجو و بادیائوری بگذرید و سپس به جادهٔ سیغناغی (Sh40) بپیچید؛ سربالایی
    پایانی تا شهر رشته‌ای از پیچ‌های کوتاه و تند است. شراب‌سازی در خیابان باراتاشویلی، درون باروی شهر
    است، جایی که کوچه‌ها باریک‌اند: در میدان اصلی یا خیابانی نزدیک پارک کنید و پیاده پایین بروید. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: יקב דמעות הפסיון (Pheasant's Tears)
  short: מרתף קווברי ומטבח בין חומות סיגנאגי, שעזרו להביא את יין הענבר הגאורגי אל חובבי היין הטבעי בעולם.
  body: >-
    **פתגם גאורגי אומר שרק יין גדול באמת יכול להביא פסיון לידי בכי – ומכאן שמו של היקב, Pheasant's Tears,
    "דמעות הפסיון".**


    את היקב ייסדו בסיגנאגי ב-2007 שני אנשים. ג'ון וורדמן הוא צייר אמריקאי שהגיע לגאורגיה לראשונה ב-1996
    והשתקע בסיגנאגי ב-1998. גלה פטלישווילי הוא כורם מקאחטי שמשפחתו מייצרת יין באזור כבר שמונה דורות. הם
    נפגשו ב-2005, כשוורדמן צייר בכרם.


    היין נעשה בקווברי – כדי חרס מצופים מבפנים בשעוות דבורים וקבורים באדמה. התסיסה נעשית בשמרים מקומיים,
    והענבים הלבנים נשארים עם קליפותיהם בין שלושה שבועות לשישה חודשים; מתי לסחוט מחליט הטעם, לא לוח השנה.
    דמעות הפסיון נמנה עם היצרנים שזוקפים לזכותם את הבאת יין הענבר הגאורגי מן הקווברי אל חובבי היין הטבעי
    במערב בשנות ה-2000 וה-2010.


    רשימת הזנים נקראת כמו מפה קטנה של הארץ: רקציטלי, קיסי, מצוואנה, צ'ינורי, צוליקאורי, ספרווי, שבקפיטו
    והטבקוורי הנדיר. בטעימה, העמידו את היינות הלבנים זה לצד זה, והביטו בהם לפני שאתם מריחים.


    המסעדה של היקב נמצאת ברחוב ברטשווילי, בין חומות העיר העתיקה. המטבח קונה מדי יום בשוק המקומי, כך שהשולחן
    משתנה עם העונה.


    בקשו יין לבן ששהה חודשים עם הקליפות והרימו את הכוס אל האור: לא צהוב, וגם לא ממש כתום – הצבע שהגאורגים
    קוראים לו פשוט ענבר.
  tip: >-
    הכניסה חופשית; טעימות וארוחות משולמות בנפרד, לפי מחירי התפריט. בעונה, ובמיוחד בסופי שבוע, הזמינו שולחן
    מראש. הסמטאות של העיר העתיקה בסיגנאגי צרות, לכן השאירו את הרכב ליד הכיכר המרכזית והשלימו את הקטע האחרון
    ברגל. מי שנוהג – שייהנה מהטעימה באף בלבד, או שיישאר ללון בסיגנאגי, שהערבים בה שווים את זה ממילא. מנזר
    בודבה נמצא 2 ק"מ מכאן, ובית־מוזיאון פירוסמני במירזאני נמצא כ-13 ק"מ, כעשרים דקות נסיעה במורד הגבעה.
  route: >-
    סיגנאגי נמצאת כ-109 ק"מ מטביליסי – כשעה ו-40 דקות נסיעה, על אספלט לכל אורכה. סעו בכביש קאחטי (S5)
    דרך סאגארג'ו ובאדיאורי, ואז פנו לכביש סיגנאגי (Sh40); הטיפוס האחרון אל העיר הוא רצף של סיבובי פרסה
    קצרים וחדים. היקב נמצא ברחוב ברטשווילי, בין החומות, במקום שבו הסמטאות צרות: חנו בכיכר המרכזית או ברחוב
    סמוך ורדו ברגל. רכב חסכוני מספיק בהחלט.
ar:
  name: دار نبيذ دموع التدرّج (Pheasant's Tears)
  short: >-
    قبو كفيفري ومطبخ داخل أسوار سيغناغي، أسهما في إيصال النبيذ الكهرماني الجورجي إلى عشّاق النبيذ الطبيعي
    حول العالم.
  body: >-
    **يقول مثل جورجي إن نبيذاً عظيماً حقاً وحده يستطيع أن يُبكي طائر التدرّج، ومن هنا أخذت دار «دموع التدرّج»
    (Pheasant's Tears) اسمها.**


    أسّس الدار في سيغناغي عام 2007 رجلان. جون وردمان رسام أمريكي جاء إلى جورجيا أول مرة عام 1996 واستقر
    في سيغناغي عام 1998. وغيلا باتاليشفيلي مزارع كروم من كاخيتي تصنع عائلته النبيذ في هذه الناحية منذ
    ثمانية أجيال. التقيا عام 2005، حين كان وردمان يرسم في أحد الكروم.


    يُصنع النبيذ هنا في الكفيفري، وهي جرار فخارية مبطّنة بشمع النحل ومدفونة في الأرض. ويجري التخمير بخمائر
    محلية، ويبقى العنب الأبيض مع قشوره من ثلاثة أسابيع إلى ستة أشهر؛ والمذاق، لا التقويم، هو ما يحدد موعد
    العصر. وتُعدّ «دموع التدرّج» من المنتجين الذين يُنسب إليهم الفضل في تعريف عشّاق النبيذ الطبيعي في
    الغرب بنبيذ الكفيفري الكهرماني الجورجي في العقدين الأولين من القرن الحادي والعشرين.


    وقائمة الأصناف تُقرأ كخريطة صغيرة للبلاد: ركاتسيتيلي، وكيسي، ومتسفاني، وتشينوري، وتسوليكاوري، وسابيرافي،
    وشافكابيتو، والتافكفيري النادر. في جلسة التذوق ضع أنواع النبيذ الأبيض جنباً إلى جنب، وانظر إليها قبل
    أن تشمّها.


    يقع مطعم الدار في شارع باراتاشفيلي، داخل أسوار البلدة القديمة. ويتسوّق المطبخ يومياً من السوق المحلية،
    فتتبدّل المائدة مع الفصول.


    اطلب نبيذاً أبيض أمضى شهوراً مع قشوره، وارفع الكأس نحو الضوء: ليس أصفر، ولا برتقالياً تماماً، بل اللون
    الذي يسمّيه الجورجيون ببساطة كهرمانياً.
  tip: >-
    الدخول مجاني؛ أما التذوق والوجبات فمدفوعة على حدة بأسعار القائمة. في الموسم، ولا سيما في عطلات نهاية
    الأسبوع، احجز طاولة مسبقاً. أزقة البلدة القديمة في سيغناغي ضيقة، فاترك السيارة قرب الساحة الرئيسية
    وامشِ المسافة الأخيرة. ومن يقود السيارة فليكتفِ بتذوق النبيذ بأنفه، أو ليبِت ليلته في سيغناغي، فأمسياتها
    تستحق ذلك على أي حال. يقع دير بودبي على بُعد 2 كم، ومتحف بيت بيروسماني في ميرزاني على بُعد نحو 13
    كم، أي قرابة 20 دقيقة بالسيارة نزولاً من التل.
  route: >-
    تبعد سيغناغي نحو 109 كم عن تبليسي، أي قرابة ساعة و40 دقيقة، والطريق معبّد بالكامل. اسلك طريق كاخيتي
    السريع (S5) مروراً بساغاريجو وبادياوري، ثم انعطف إلى طريق سيغناغي (Sh40)؛ والصعود الأخير إلى البلدة
    سلسلة من المنعطفات القصيرة الحادة. تقع الدار في شارع باراتاشفيلي داخل الأسوار، حيث الأزقة ضيقة: اركن
    في الساحة الرئيسية أو في شارع قريب وانزل مشياً. تكفي تماماً سيارة من الفئة الاقتصادية.
