ka:
  name: მყინვარწვერი (ყაზბეგი)
  short: >-
    5054-მეტრიანი მიძინებული ვულკანი სტეფანწმინდის თავზე: ამირანის საპყრობილე მითში, ბერების გამოქვაბული
    4000 მეტრზე და მყინვარები, რომლებიც ხეობას დღესაც ცვლის.
  body: >-
    **მყინვარწვერი ბოლოს ჩვენს წელთაღრიცხვამდე დაახლოებით 750 წელს ამოიფრქვა. მასზე მოთხრობილი ამბები
    კი უფრო ძველია.**


    მთა მიძინებული სტრატოვულკანია — ტრაქიტის ორმაგი კონუსი, რომელიც სტეფანწმინდის პირდაპირ დასავლეთით
    5054 მეტრამდე აზიდულა. ეს აღმოსავლეთ საქართველოს უმაღლესი მწვერვალია და ქვეყანაში მესამე, შხარისა
    და ჯანღის შემდეგ. სახელი თავისთავად მეტყველებს: მწვერვალს მართლაც მყინვარი ხურავს, და ეს ყინული მოსვენებული
    არ არის. მის კალთებზე გერგეთის, აბანოს, მნისა და სხვა მყინვარები ჰკიდია, დევდორაკი კი ჩრდილო-აღმოსავლეთის
    ფერდობზე ნელა მიცურავს ქვემოთ. 2014 წელს მისმა ჩამოქცევებმა რამდენიმე ადამიანის სიცოცხლე შეიწირა,
    დარიალის ხეობაში კი თერგი გადაკეტა.


    ქართულ მითში სწორედ აქ არის მიჯაჭვული ამირანი, ქართველი პრომეთე, ღმერთთან შეჭიდებისთვის; მყინვარწვერთან
    დაკავშირებულ ვერსიაში — ცეცხლის მოტაცებისთვის. მისი ფრთოსანი ძაღლი, ყურშა, მთელი წელი ლოკავს ჯაჭვს
    და ათხელებს, მაგრამ როცა ჯაჭვი გაწყვეტაზეა, კავკასიონს გაღმა მჭედლები გრდემლზე ჩაქუჩს დაჰკრავენ და
    რკინა ისევ მთელდება. დაახლოებით 4000 მეტრზე, იქ, სადაც გადმოცემა ამირანის საპყრობილეს ათავსებს, შუა
    საუკუნეების ბერებმა გამოქვაბულში სავანე მოაწყვეს — ბეთლემი. თქმულებით, აქ ოდესღაც აბრაამის კარავი
    და ყრმა იესოს ბაგა ინახებოდა.


    მწვერვალზე პირველი, შესაძლოა, ინგუშური წარმოშობის მთიელი ავიდა. იოანე ბატონიშვილის ცნობით, XVIII საუკუნის
    ბოლოს წვერს იოსებ ბუზურთანოვმა, „იოსებ მოხევედ“ წოდებულმა, მიაღწია. ალპინიზმის ისტორიაში შესული ასვლა
    კი 1868 წელს შედგა: დუგლას ფრეშფილდი, ა. უ. მური და ჩ. ტაკერი მეგზურ ფრანსუა დევუასუსთან ერთად — გველეთელი
    მთიელების წინამძღოლობით, რომელთა შორის იოსების ვაჟი, ცოგოლიც იყო.


    მისი სიმძიმის შესაგრძნობად ასვლა არ არის აუცილებელი. უყურეთ სტეფანწმინდიდან ან გერგეთის სამებიდან,
    ან ალტიჰათამდე (3014 მ) აიარეთ. ოღონდ გამთენიისას: შუადღისთვის მწვერვალი, როგორც წესი, ღრუბელს აიფარებს.
  tip: >-
    მწვერვალის დანახვის საუკეთესო შანსი გამთენიისაა — ღამე სტეფანწმინდაში გაათიეთ და დილით პირველ რიგში
    ფანჯარაში გაიხედეთ. გერგეთის სამებიდან ალტიჰათამდე (3014 მ, დაახლოებით 7 კილომეტრი და სამი საათი აღმართი)
    ბილიკზე საჭიროა კარგი სალაშქრო ფეხსაცმელი, წყალი და ქარგაუმტარი ქურთუკი: ამინდი რამდენიმე საათში ფუჭდება.
    ბეთლემის ქოხი და ძველი მეტეოსადგური (3650 მ) გამოცდილი მოლაშქრეებისთვისაა, სასურველია მეგზურით. მყინვარზე
    მეგზურის, თოკისა და კრამპონების გარეშე ნუ გახვალთ: ნაპრალებს თოვლი მალავს. აგვისტოშიც კი 3000 მეტრზე
    მაღლა ღამით ყინავს. ეკლესიაში მხრები და მუხლები დაფარული უნდა გქონდეთ.
  route: >-
    საქართველოს სამხედრო გზით (E117) ჯვრის უღელტეხილის (2379 მ) გავლით სტეფანწმინდამდე იარეთ (157 კილომეტრი,
    დაახლოებით სამი საათი), შემდეგ კი 6-კილომეტრიანი ციცაბო, ასფალტიანი სერპანტინით გერგეთის სამების ავტოსადგომამდე
    ადით — ეს საუკეთესო ხედია, სადამდეც მანქანით მიხვალთ: ჯამში 163 კილომეტრი და დაახლოებით 3 საათი და
    25 წუთი. საწვავი ფასანაურში ან გუდაურში ჩაასხით. გვიანი გაზაფხულიდან შემოდგომამდე ეკონომ-კლასის ავტომობილი
    ბოლომდე ადის. ზამთარში უღელტეხილისთვის ზამთრის საბურავები და ჯაჭვები გჭირდებათ, გერგეთის გზა კი თოვლის
    შემდეგ იყინება — ბოლო მონაკვეთისთვის მაღალი კლირენსის მანქანა ან ადგილობრივი ჯიპ-ტაქსი აჯობებს. ალტიჰათის
    ბილიკი ეკლესიასთან იწყება.
en:
  name: Mount Kazbek (Mkinvartsveri)
  short: >-
    A 5,054 m sleeping volcano above Stepantsminda: Amirani's prison in myth, a hermits' cave at 4,000
    m, and glaciers that still reshape the valley below.
  body: >-
    **Kazbek last erupted around 750 BC. The stories told about it are older still.**


    The mountain is a dormant stratovolcano, a double cone of trachyte rising to 5,054 m directly west
    of Stepantsminda: the highest peak in eastern Georgia and the third highest in the country, after
    Shkhara and Janga. Its Georgian name, Mkinvartsveri, means roughly "glacier peak", and the ice is
    real and restless. The Gergeti, Abano, Mna and other glaciers hang on its flanks; the Devdoraki creeps
    down the north-east face, and in 2014 collapses of its ice killed several people and dammed the Terek
    in the Dariali gorge.


    In Georgian myth this is where Amirani, Georgia's Prometheus, is chained for defying God; in the version
    tied to Kazbek, for stealing fire. His winged dog, Q'ursha, licks the chains thin through the year,
    but just as they are about to break, blacksmiths beyond the Caucasus strike their anvils and the iron
    grows whole again. Near 4,000 m, in the place tradition names as his prison, medieval monks made a
    hermitage in a cave called Betlemi, Bethlehem; legend says it once kept Abraham's tent and the manger
    of the infant Jesus.


    The first climber may have been a highlander of Ingush origin. Prince Ioane records that Yosif Buzurtanov,
    known as "Yosif the Mokhevian", reached the top in the late 18th century. The ascent in the mountaineering
    books came in 1868: Douglas Freshfield, A. W. Moore and C. Tucker with the guide François Devouassoud,
    led by men from Gveleti, among them Yosif's son Tsogol.


    You do not have to climb it to feel its weight. Watch it from Stepantsminda or the Gergeti church,
    or walk to Altihut at 3,014 m. Go at dawn: by midday the summit has usually drawn a cloud across its
    face.
  tip: >-
    Your best chance of a clear summit is first light, so sleep in Stepantsminda and look out of the window
    at dawn. The trail from Gergeti church to Altihut (3,014 m, about 7 km and three hours up) needs proper
    boots, water and a windproof layer; the weather can close in within hours. Betlemi hut and the old
    meteo station at 3,650 m are for experienced hikers, ideally with a guide. Never step onto the glacier
    without a guide, rope and crampons: its crevasses are hidden under snow. Even in August, nights above
    3,000 m drop below freezing. Cover shoulders and knees at the church.
  route: >-
    Take the Georgian Military Highway (E117) to Stepantsminda (157 km, about three hours) over the Jvari
    Pass at 2,379 m, then climb 6 km of steep paved switchbacks to the Gergeti church car park, the best
    viewpoint you can drive to: 163 km and about 3 hours 25 minutes in all. Fill up in Pasanauri or Gudauri.
    From late spring to autumn an economy car manages the whole way. In winter you need winter tyres and
    chains for the pass, and the Gergeti road ices after snow; take a high-clearance car or a local 4x4
    taxi for the last stretch. Trailheads for Altihut start at the church.
ru:
  name: Казбек (Мкинварцвери)
  short: >-
    Спящий вулкан высотой 5054 м над Степанцминдой: темница Амирани в мифе, пещера отшельников на 4000
    м и ледники, которые до сих пор перекраивают долину внизу.
  body: >-
    **Казбек в последний раз извергался около 750 года до н. э. Истории, которые о нём рассказывают, ещё
    старше.**


    Гора — спящий стратовулкан, двойной трахитовый конус высотой 5054 м, встающий прямо к западу от Степанцминды:
    высочайшая вершина Восточной Грузии и третья в стране после Шхары и Джанги. Грузинское имя Мкинварцвери
    означает примерно «ледниковая вершина», и лёд здесь настоящий и беспокойный. На склонах висят ледники
    Гергети, Абано, Мна и другие; Девдораки сползает по северо-восточному склону, и в 2014 году его обвалы
    унесли жизни нескольких человек и запрудили Терек в Дарьяльском ущелье.


    В грузинском мифе здесь прикован Амирани, грузинский Прометей, — за то, что бросил вызов Богу; в версии,
    связанной с Казбеком, — за похищение огня. Его крылатый пёс Курша весь год вылизывает цепи, истончая
    их, но едва они готовы лопнуть, кузнецы по ту сторону Кавказа ударяют по наковальням — и железо снова
    срастается. Около 4000 м, там, где предание помещает темницу героя, средневековые монахи устроили
    скит в пещере Бетлеми — «Вифлеем»; легенда гласит, что когда-то в ней хранились шатёр Авраама и ясли
    младенца Иисуса.


    Первым восходителем, возможно, был горец ингушского происхождения. Царевич Иоанн записал, что Иосиф
    Бузуртанов, прозванный «Иосифом Мохевцем», поднялся на вершину в конце XVIII века. Восхождение, вошедшее
    в альпинистские книги, состоялось в 1868 году: Дуглас Фрешфилд, А. У. Мур и Ч. Таккер с гидом Франсуа
    Девуассу, а путь им прокладывали люди из Гвелети, среди них сын Иосифа Цогол.


    Чтобы ощутить тяжесть этой горы, подниматься на неё не обязательно. Смотрите на неё из Степанцминды
    или от церкви Гергети, дойдите до приюта Альтихат на высоте 3014 м. Приходите на рассвете: к полудню
    вершина обычно задёргивает лицо облаком.
  tip: >-
    Больше всего шансов увидеть вершину открытой — с первым светом, поэтому ночуйте в Степанцминде и на
    рассвете выгляните в окно. Тропа от церкви Гергети до приюта Альтихат (3014 м, около 7 км и трёх часов
    подъёма) требует настоящих ботинок, воды и ветрозащитного слоя: погода может испортиться за считанные
    часы. Приют Бетлеми и старая метеостанция на 3650 м — для опытных туристов, лучше с гидом. Никогда
    не выходите на ледник без гида, верёвки и кошек: трещины прячутся под снегом. Даже в августе ночью
    выше 3000 м бывает мороз. В церкви плечи и колени должны быть закрыты.
  route: >-
    Поезжайте по Военно-Грузинской дороге (E117) через Крестовый перевал (Джвари, 2379 м) до Степанцминды
    — 157 км, около трёх часов, — затем поднимитесь по 6 км крутого асфальтового серпантина к парковке
    у церкви Гергети, лучшей смотровой точке, куда можно доехать на машине: всего 163 км и примерно 3
    часа 25 минут. Заправьтесь в Пасанаури или Гудаури. С поздней весны до осени весь путь осилит машина
    эконом-класса. Зимой на перевале нужны зимняя резина и цепи, а дорога к Гергети после снегопада обледеневает:
    на последний отрезок берите машину с высоким клиренсом или местное такси-внедорожник. Тропы к Альтихату
    начинаются у церкви.
fa:
  name: کوه کازبک (مکینوارتسوری)
  short: >-
    آتشفشانی خفته به بلندی ۵۰۵۴ متر بر فراز استپانتسمیندا: زندان امیرانی در اسطوره، غار زاهدان در ۴۰۰۰
    متری و یخچال‌هایی که هنوز درهٔ پایین را از نو شکل می‌دهند.
  body: >-
    **کازبک آخرین بار حدود ۷۵۰ پیش از میلاد فوران کرد. داستان‌هایی که دربارهٔ آن می‌گویند از این هم کهن‌ترند.**


    این کوه آتشفشانی چینه‌ایِ خفته است، مخروطی دوگانه از تراکیت که درست در غرب استپانتسمیندا تا ۵۰۵۴ متر
    قد برافراشته: بلندترین قلهٔ شرق گرجستان و سومین قلهٔ کشور پس از شخارا و جانگا. نام گرجی‌اش، مکینوارتسوری،
    کمابیش به معنای «قلهٔ یخچال» است، و یخِ آن واقعی و ناآرام است. یخچال‌های گرگتی، آبانو، منا و دیگران
    بر دامنه‌هایش آویخته‌اند؛ یخچال دودوراکی از دامنهٔ شمال‌شرقی پایین می‌خزد و در ۲۰۱۴ ریزش‌های آن جان
    چند نفر را گرفت و رود ترک را در تنگهٔ داریالی سد کرد.


    در اسطورهٔ گرجی، امیرانی، پرومتهٔ گرجستان، به کیفر سرکشی در برابر خدا در همین‌جا به زنجیر کشیده شده
    است؛ و در روایتی که به کازبک پیوند خورده، به کیفر دزدیدن آتش. سگ بالدارش، قورشا، سراسر سال زنجیرها
    را می‌لیسد تا نازک شوند، اما درست هنگامی که نزدیک است بگسلند، آهنگرانِ آن سوی قفقاز پتک بر سندان می‌کوبند
    و آهن دوباره یکپارچه می‌شود. نزدیک ۴۰۰۰ متری، در جایی که سنت آن را زندان او می‌داند، راهبان سده‌های
    میانه در غاری به نام بتلمی، یعنی بیت‌لحم، صومعه‌ای برای عزلت ساختند؛ افسانه می‌گوید روزگاری خیمهٔ
    ابراهیم و آخور عیسای نوزاد در آن نگهداری می‌شد.


    نخستین کسی که به قله رسید شاید کوه‌نشینی اینگوش‌تبار بوده است. شاهزاده یوانه نوشته است که یوسیف بوزورتانوف،
    معروف به «یوسیفِ مُخِوی»، در اواخر سدهٔ هجدهم به قله رسید. صعودی که در کتاب‌های کوهنوردی ثبت شده در
    ۱۸۶۸ انجام شد: داگلاس فرشفیلد، ای. دبلیو. مور و سی. تاکر همراه راهنمایشان فرانسوا دووآسو، و پیشاپیش
    آنان مردانی از گولتی که تسوگول، پسر یوسیف، نیز در میانشان بود.


    لازم نیست از آن بالا بروید تا سنگینی‌اش را حس کنید. از استپانتسمیندا یا کلیسای گرگتی تماشایش کنید،
    یا تا پناهگاه آلتی‌هات در ۳۰۱۴ متری پیاده بروید. سپیده‌دم بروید: تا نیمروز قله معمولاً پرده‌ای از
    ابر بر چهره‌اش کشیده است.
  tip: >-
    بهترین بخت برای دیدن قلهٔ بی‌ابر، نخستین روشنایی صبح است؛ پس شب را در استپانتسمیندا بمانید و سپیده‌دم
    از پنجره بیرون را نگاه کنید. مسیر کلیسای گرگتی تا آلتی‌هات (۳۰۱۴ متر، حدود ۷ کیلومتر و سه ساعت سربالایی)
    کفش کوه درست‌وحسابی، آب و لایه‌ای بادگیر می‌خواهد؛ هوا ممکن است ظرف چند ساعت بگیرد. پناهگاه بتلمی
    و ایستگاه هواشناسی قدیم در ۳۶۵۰ متری ویژهٔ کوه‌پیمایان باتجربه است، ترجیحاً همراه راهنما. هرگز بدون
    راهنما، طناب و کرامپون پا روی یخچال نگذارید: شکاف‌هایش زیر برف پنهان‌اند. حتی در اوت، شب‌های بالای
    ۳۰۰۰ متر دما به زیر صفر می‌رسد. در کلیسا شانه‌ها و زانوها را بپوشانید.
  route: >-
    از جادهٔ نظامی گرجستان (E117) و از راه گردنهٔ جواری در ۲۳۷۹ متری تا استپانتسمیندا بروید (۱۵۷ کیلومتر،
    حدود سه ساعت)، سپس ۶ کیلومتر پیچ‌های تند و آسفالته را تا پارکینگ کلیسای گرگتی بالا بروید؛ بهترین منظره‌ای
    که با خودرو به آن می‌رسید: روی هم ۱۶۳ کیلومتر و حدود ۳ ساعت و ۲۵ دقیقه. در پاسانائوری یا گودائوری
    باک را پر کنید. از اواخر بهار تا پاییز خودروی اقتصادی تمام راه را می‌رود. در زمستان برای گردنه لاستیک
    زمستانی و زنجیر لازم است و جادهٔ گرگتی پس از برف یخ می‌بندد؛ برای تکهٔ آخر خودروی شاسی‌بلند یا تاکسی
    محلی چهارچرخ‌محرک بگیرید. مسیرهای پیاده به آلتی‌هات از کنار کلیسا آغاز می‌شوند.
he:
  name: הר קזבק (מקינוורצוורי)
  short: >-
    הר געש רדום בגובה 5,054 מ' מעל סטפנצמינדה: כלאו של אמיראני במיתוס, מערת נזירים בגובה 4,000 מ' וקרחונים
    שעדיין מעצבים מחדש את העמק שלמטה.
  body: >-
    **קזבק התפרץ לאחרונה בסביבות 750 לפני הספירה. הסיפורים שמספרים עליו עתיקים עוד יותר.**


    ההר הוא הר געש שכבתי רדום, חרוט כפול של טרכיט המתנשא לגובה 5,054 מ' ממש ממערב לסטפנצמינדה: הפסגה הגבוהה
    ביותר במזרח גאורגיה והשלישית בגובהה במדינה, אחרי שחרה וג'נגה. שמו הגאורגי, מקינוורצוורי, פירושו בקירוב
    "פסגת הקרחון", והקרח כאן אמיתי ואינו שוקט. קרחוני גרגטי, אבאנו, מנה ואחרים תלויים על מדרונותיו; קרחון
    דבדוראקי זוחל במורד הפן הצפון־מזרחי, וב־2014 גבו קריסות שלו את חייהם של כמה אנשים וחסמו את נהר הטרק
    בערוץ דריאלי.


    במיתוס הגאורגי כאן כבול אמיראני, הפרומתאוס של גאורגיה, על שהמרה את פי האל; ובגרסה הקשורה לקזבק – על
    שגנב את האש. כלבו המכונף, קורשה, מלקק את השלשלאות כל השנה עד שהן נעשות דקות, אבל בדיוק כשהן עומדות
    להינתק, נפחים שמעבר לקווקז מכים בסדנים שלהם והברזל שב ומתאחה. בגובה של כ־4,000 מ', במקום שהמסורת מזהה
    ככלאו, הקימו נזירים בימי הביניים מקום התבודדות במערה ששמה בתלמי – בית לחם; האגדה מספרת שפעם נשמרו
    בה אוהל אברהם והאבוס של ישו התינוק.


    ייתכן שהראשון שעלה לפסגה היה בן הרים ממוצא אינגושי. הנסיך יואנה מתעד כי יוסיף בוזורטנוב, המכונה "יוסיף
    המוחווי", הגיע לפסגה בסוף המאה ה־18. העלייה שנרשמה בספרי הטיפוס נעשתה ב־1868: דאגלס פרשפילד, א"ו מור
    וצ' טאקר עם המדריך פרנסואה דבואסו, בהובלת אנשים מגוולטי, ביניהם צוגול, בנו של יוסיף.


    לא צריך לטפס עליו כדי לחוש את כובדו. צפו בו מסטפנצמינדה או מכנסיית גרגטי, או צעדו עד בקתת אלטיהאט
    בגובה 3,014 מ'. בואו עם שחר: עד הצהריים הפסגה בדרך כלל כבר מסיטה ענן על פניה.
  tip: >-
    הסיכוי הטוב ביותר לפסגה נקייה מעננים הוא באור הראשון, אז לינו בסטפנצמינדה והציצו מהחלון עם שחר. השביל
    מכנסיית גרגטי לבקתת אלטיהאט (3,014 מ', כ־7 ק"מ וכשלוש שעות עלייה) דורש נעלי הליכה ראויות, מים ושכבה
    חוסמת רוח; מזג האוויר יכול להתקדר תוך שעות. בקתת בתלמי ותחנת המטאורולוגיה הישנה בגובה 3,650 מ' מיועדות
    למטיילים מנוסים, רצוי עם מדריך. לעולם אל תעלו על הקרחון בלי מדריך, חבל וקרמפונים: הבקעים שלו מוסתרים
    מתחת לשלג. גם באוגוסט הלילות מעל 3,000 מ' יורדים מתחת לאפס. בכנסייה יש לכסות כתפיים וברכיים.
  route: >-
    סעו בכביש הצבאי הגאורגי (E117) עד סטפנצמינדה (157 ק"מ, כשלוש שעות) דרך מעבר ג'ווארי בגובה 2,379 מ',
    ואז טפסו 6 ק"מ של עיקולים סלולים ותלולים עד חניון כנסיית גרגטי – נקודת התצפית הטובה ביותר שאפשר להגיע
    אליה ברכב: בסך הכול 163 ק"מ וכ־3 שעות ו־25 דקות. תדלקו בפסנאורי או בגודאורי. מסוף האביב ועד הסתיו
    רכב חסכוני עושה את כל הדרך. בחורף צריך צמיגי חורף ושרשראות למעבר, ודרך גרגטי מתכסה קרח אחרי שלג; לקטע
    האחרון קחו רכב גבוה או מונית ג'יפ מקומית. השבילים לאלטיהאט יוצאים מהכנסייה.
ar:
  name: جبل كازبيك (مكينفارتسفيري)
  short: >-
    بركان خامد بارتفاع 5054 متراً فوق ستيبانتسميندا: سجن أميراني في الأسطورة، ومغارة نسّاك على ارتفاع
    4000 متر، وأنهار جليدية ما زالت تعيد تشكيل الوادي تحته.
  body: >-
    **ثار كازبيك آخر مرة نحو عام 750 قبل الميلاد. أما الحكايات التي تُروى عنه فأقدم من ذلك.**


    الجبل بركان طبقي خامد، مخروط مزدوج من صخر التراكيت يرتفع إلى 5054 متراً غربي ستيبانتسميندا مباشرة:
    أعلى قمة في شرق جورجيا وثالث أعلى قمة في البلاد بعد شخارا وجانغا. واسمه الجورجي، مكينفارتسفيري، يعني
    تقريباً «قمة الجليد»، والجليد هنا حقيقي لا يهدأ. تتدلى على سفوحه أنهار غيرغيتي وأبانو ومنا الجليدية
    وغيرها؛ ويزحف نهر ديفدوراكي الجليدي على الوجه الشمالي الشرقي، وفي عام 2014 أودت انهياراته بحياة عدد
    من الأشخاص وسدّت نهر تيريك في مضيق داريالي.


    في الأسطورة الجورجية، هنا قُيّد أميراني، بروميثيوس جورجيا، عقاباً له على تحدّيه الربّ؛ وفي الرواية
    المرتبطة بكازبيك، لأنه سرق النار. كلبه المجنّح قورشا يلعق السلاسل طوال العام حتى ترقّ، ولكن ما إن
    توشك على الانقطاع حتى يطرق الحدّادون فيما وراء القوقاز سنادينهم، فيلتئم الحديد من جديد. وعلى ارتفاع
    نحو 4000 متر، في الموضع الذي يعدّه التقليد سجنه، اتخذ رهبان العصور الوسطى صومعة في مغارة تُدعى بيتليمي،
    أي بيت لحم؛ وتقول الأسطورة إنها حفظت يوماً خيمة إبراهيم ومذود الطفل يسوع.


    ربما كان أول من بلغ القمة رجلاً جبلياً من أصل إنغوشي. فقد دوّن الأمير يوانه أن يوسف بوزورتانوف، المعروف
    بـ«يوسف الموخيفي»، وصل إلى القمة في أواخر القرن الثامن عشر. أما الصعود المسجّل في كتب تسلّق الجبال
    فكان عام 1868: دوغلاس فريشفيلد وأ. و. مور وس. تاكر مع الدليل فرانسوا ديفواسو، يتقدّمهم رجال من غفيليتي،
    بينهم تسوغول ابن يوسف.


    لا حاجة إلى تسلّقه كي تشعر بثقله. تأمّله من ستيبانتسميندا أو من كنيسة غيرغيتي، أو امشِ إلى كوخ ألتي
    هات على ارتفاع 3014 متراً. تعالَ عند الفجر: فبحلول الظهيرة تكون القمة في الغالب قد أسدلت غيمة على
    وجهها.
  tip: >-
    أفضل فرصة لرؤية القمة صافية هي مع أول الضوء، فبِتْ في ستيبانتسميندا وانظر من النافذة عند الفجر. يحتاج
    الدرب من كنيسة غيرغيتي إلى كوخ ألتي هات (3014 متراً، نحو 7 كم وثلاث ساعات صعوداً) إلى حذاء جبلي مناسب
    وماء وطبقة واقية من الريح؛ فقد ينقلب الطقس في غضون ساعات. أما كوخ بيتليمي ومحطة الأرصاد القديمة على
    ارتفاع 3650 متراً فللمتنزهين المتمرّسين، ويُفضَّل مع دليل. لا تطأ النهر الجليدي أبداً دون دليل وحبل
    ومسامير الجليد: فشقوقه مخفية تحت الثلج. وحتى في أغسطس تهبط الحرارة ليلاً فوق 3000 متر إلى ما دون الصفر.
    غطِّ كتفيك وركبتيك في الكنيسة.
  route: >-
    اسلك الطريق العسكري الجورجي (E117) إلى ستيبانتسميندا (157 كم، نحو ثلاث ساعات) عبر ممر جفاري على ارتفاع
    2379 متراً، ثم اصعد 6 كم من المنعطفات المعبّدة الشديدة الانحدار إلى موقف سيارات كنيسة غيرغيتي، وهو
    أفضل مطلّ يمكن بلوغه بالسيارة: 163 كم ونحو 3 ساعات و25 دقيقة في المجمل. املأ خزانك في باسانوري أو
    غودوري. من أواخر الربيع حتى الخريف تقطع السيارة الاقتصادية الطريق كله. أما في الشتاء فتحتاج إلى إطارات
    شتوية وسلاسل لعبور الممر، ويتجمّد طريق غيرغيتي بعد تساقط الثلج؛ فخذ سيارة مرتفعة عن الأرض أو سيارة
    أجرة محلية رباعية الدفع للمقطع الأخير. تنطلق دروب ألتي هات من عند الكنيسة.
