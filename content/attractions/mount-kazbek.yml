ka:
  name: მყინვარწვერი (ყაზბეგი)
  short: >-
    5054-მეტრიანი მიძინებული ვულკანი — ამირანის მითის მთა, რომლის ხედი გერგეთის სამებასთან საქართველოს
    სავიზიტო ბარათია.
  body: >-
    **მყინვარწვერი ის მთაა, რომლის გამოც ხალხი საქართველოში ჩამოდის.** 5054-მეტრიანი მიძინებული სტრატოვულკანი
    სტეფანწმინდის დასავლეთით აღიმართება და მოწმენდილ დილას მისი თეთრი გუმბათი მთელ ხევს ეფარება — წინ
    კი, კლდის ქიმზე, გერგეთის სამების ეკლესია დგას, ალბათ ყველაზე ხშირად გადაღებული კადრი ქვეყანაში.


    გეოლოგებისთვის ეს ტრაქიტის ორმაგი კონუსია, რომელიც ბოლოს ჩვ. წ.-მდე დაახლოებით 750 წელს ამოიფრქვა;
    ფერდობებზე გერგეთის, დევდორაკისა და სხვა მყინვარები ეშვება. ქართულ მითოლოგიაში კი ეს ამირანის მთაა
    — ღმერთებისგან ცეცხლის მოტაცებისთვის კლდეზე მიჯაჭვული გმირისა, ბერძნული პრომეთეს ქართველი ძმისა. დაახლოებით
    4000 მეტრზე ბეთლემის გამოქვაბული-სენაკია, შუა საუკუნეების ბერების თავშესაფარი.


    ბარათი ნახვასა და მიახლოებაზეა და არა მწვერვალზე:


    - **ხედი სტეფანწმინდიდან და გერგეთის ეკლესიიდან** — გზა ეკლესიამდე უკვე ასფალტირებულია

    - **ლაშქრობა ალტიჰათამდე (3014 მ)** — გერგეთიდან 3 საათი, 7 კმ

    - **ბეთლემის ქოხ-მეტეოსადგური (3650 მ)** — გამოცდილი მოლაშქრეებისთვის, გამყოლით


    მთა დილაობით ჩანს ყველაზე ხშირად; შუადღისთვის წვერს თითქმის ყოველთვის ღრუბელი ახურავს. ოქტომბრიდან
    მაისამდე მაღალი ბილიკები თოვლშია.
  tip: >-
    მწვერვალის დანახვის შანსი დილით ყველაზე მაღალია — ღამე სტეფანწმინდაში გაათიე და გათენებისას გახედე.
    გერგეთის ეკლესიამდე მანქანით ახვალ, მაგრამ ალტიჰათისკენ ბილიკზე სამთო ფეხსაცმელი, წყალი და ქარის ქურთუკი
    აუცილებელია — ამინდი საათებში ფუჭდება. მყინვარზე გამყოლის გარეშე ნუ გახვალ. აგვისტოშიც კი 3000 მეტრზე
    ღამით მინუსია. ეკლესიასთან ჩაცმის წესი მოქმედებს.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) სტეფანწმინდამდე — 157 კმ, დაახლოებით სამი საათი, შემდეგ
    დაბიდან სერპანტინით გერგეთის ეკლესიის პარკინგამდე კიდევ 6 კმ ასფალტი. საწვავი ფასანაურში ან გუდაურში
    აიღე. ზაფხულში ეკონომ-კლასის ავტომობილი ბოლომდე მიდის; ზამთარში ჯვრის უღელტეხილზე ჯაჭვები გჭირდება,
    გერგეთის გზა კი თოვლის შემდეგ მოყინულია და მაღალი განივლობის მანქანა ან ადგილობრივი ტაქსი ჯობია. ხედისთვის
    საუკეთესო გაჩერებები თავად დაბაშია.
en:
  name: Mount Kazbek (Mkinvartsveri)
  short: >-
    A 5,054 m dormant volcano — the mountain of the Amirani myth, whose view above Gergeti Trinity Church
    is Georgia's calling card.
  body: >-
    **Kazbek is the mountain people come to Georgia for.** The 5,054 m dormant stratovolcano rears up
    directly west of Stepantsminda, and on a clear morning its white dome fills the whole sky over Khevi
    — with Gergeti Trinity Church on its rocky spur in front, probably the most photographed frame in
    the country.


    To geologists it is a double trachyte cone that last erupted around 750 BC, its slopes draped with
    the Gergeti, Devdaraki and other glaciers. In Georgian mythology it is the mountain of Amirani, the
    hero chained to the rock for stealing fire from the gods — Georgia's own Prometheus. At about 4,000
    m sits the Betlemi cave, a medieval monks' hermitage carved into the cliff.


    This card is about seeing and approaching the mountain, not summiting it:


    - **The view from Stepantsminda and Gergeti church** — the road up to the church is now fully paved

    - **The hike to Altihut (3,014 m)** — about 3 hours and 7 km up from Gergeti

    - **Betlemi Hut / the old Meteo Station (3,650 m)** — for experienced hikers, ideally with a guide


    The summit shows itself most reliably at dawn; by midday it almost always wears a cloud cap. From
    October to May the upper trails are under snow.
  tip: >-
    Your best odds of seeing the summit are at first light — sleep in Stepantsminda and check the sky
    at dawn. You can drive to Gergeti church, but the trail toward Altihut needs proper boots, water and
    a windproof layer; weather deteriorates within hours. Never walk onto the glacier without a guide
    and gear. Even in August, nights above 3,000 m drop below freezing. Dress rules apply at the church.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117) to Stepantsminda — 157 km, about three hours
    — then a further 6 km of paved switchbacks from town up to the Gergeti church car park. Refuel in
    Pasanauri or Gudauri. In summer an economy car makes it all the way; in winter you need chains over
    the Jvari Pass, and the Gergeti road ices over after snowfall, so a high-clearance car or a local
    taxi is the smarter choice. The best roadside viewpoints are in the town itself.
ru:
  name: Казбек (Мкинварцвери)
  short: >-
    Спящий вулкан высотой 5054 м — гора из мифа об Амирани, чей вид над церковью Гергети стал визитной
    карточкой Грузии.
  body: >-
    **Казбек — та гора, ради которой едут в Грузию.** Спящий стратовулкан высотой 5054 м поднимается прямо
    к западу от Степанцминды, и ясным утром его белый купол заполняет всё небо над Хеви — а впереди, на
    скалистом отроге, стоит церковь Гергети Самеба: пожалуй, самый снимаемый кадр страны.


    Для геологов это двойной трахитовый конус, извергавшийся в последний раз около 750 года до н. э.;
    по склонам сползают ледники Гергети, Девдараки и другие. В грузинской мифологии это гора Амирани —
    героя, прикованного к скале за похищение огня у богов, грузинского Прометея. На высоте около 4000
    м находится пещера Бетлеми, средневековый скит монахов, вырубленный в скале.


    Эта карточка — про то, как увидеть гору и подойти к ней, а не про восхождение:


    - **Вид из Степанцминды и от церкви Гергети** — дорога к церкви теперь полностью асфальтирована

    - **Трек до приюта Altihut (3014 м)** — около 3 часов и 7 км подъёма от Гергети

    - **Приют Бетлеми / старая метеостанция (3650 м)** — для опытных, лучше с гидом


    Вершина надёжнее всего открывается на рассвете; к полудню она почти всегда в облачной шапке. С октября
    по май верхние тропы под снегом.
  tip: >-
    Лучшие шансы увидеть вершину — на рассвете: ночуйте в Степанцминде и проверяйте небо с утра. До церкви
    Гергети можно доехать, но на тропу к Altihut нужны треккинговые ботинки, вода и ветрозащита — погода
    портится за считанные часы. На ледник без гида и снаряжения не выходите. Даже в августе ночью выше
    3000 м минус. У церкви действует дресс-код.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге (E117) до Степанцминды — 157 км, около трёх часов, затем ещё
    6 км асфальтового серпантина от посёлка до парковки у церкви Гергети. Заправка — в Пасанаури или Гудаури.
    Летом эконом-класс доезжает до самого верха; зимой на Крестовом перевале нужны цепи, а дорога к Гергети
    обледеневает после снегопадов — разумнее машина с высоким клиренсом или местное такси. Лучшие видовые
    точки у дороги — в самом посёлке.
fa:
  name: کوه کازبک (مکینوارتسوری)
  short: آتشفشان خفتهٔ 5054 متری — کوهِ اسطورهٔ امیرانی، که منظره‌اش بر فراز کلیسای گرگتی نماد گرجستان
    است.
  body: >-
    **کازبک همان کوهی است که مردم برایش به گرجستان می‌آیند.** این آتشفشان خفتهٔ 5054 متری درست در غرب
    استپانتسمیندا قد می‌کشد و در صبحی صاف گنبد سفیدش تمام آسمان خِوی را پر می‌کند — و جلوتر، بر ستیغ صخره‌ای،
    کلیسای ترینیتی گرگتی ایستاده: شاید پرعکس‌ترین قاب کشور.


    از نگاه زمین‌شناسان این مخروطی دوقلو از تراکیت است که آخرین بار حدود 750 پیش از میلاد فوران کرده؛
    بر دامنه‌هایش یخچال‌های گرگتی، دِودوراکی و دیگران فرومی‌لغزند. در اسطوره‌های گرجی این کوهِ امیرانی
    است — پهلوانی که برای دزدیدن آتش از خدایان به صخره زنجیر شد؛ پرومتهٔ گرجی. در حدود 4000 متری، غار
    بتلمی قرار دارد؛ خلوتگاه راهبان سده‌های میانه که در دل صخره کنده شده است.


    این کارت دربارهٔ دیدن و نزدیک‌شدن به کوه است، نه صعود:


    - **منظره از استپانتسمیندا و کلیسای گرگتی** — جادهٔ کلیسا اکنون سراسر آسفالت است

    - **پیاده‌روی تا آلتی‌هات (3014 متر)** — حدود 3 ساعت و 7 کیلومتر از گرگتی

    - **پناهگاه بتلمی / ایستگاه هواشناسی قدیم (3650 متر)** — برای کوهنوردان باتجربه، ترجیحاً با راهنما


    قله بیش از همه سپیده‌دم خود را نشان می‌دهد؛ تا ظهر تقریباً همیشه کلاهکی از ابر دارد. از اکتبر تا مه
    مسیرهای بالایی زیر برف‌اند.
  tip: >-
    بهترین شانس دیدن قله سپیده‌دم است — شب را در استپانتسمیندا بمانید و بامداد آسمان را بسنجید. تا کلیسای
    گرگتی می‌توان راند، اما مسیر آلتی‌هات کفش کوه، آب و بادگیر می‌خواهد؛ هوا ظرف چند ساعت خراب می‌شود.
    بدون راهنما و تجهیزات پا روی یخچال نگذارید. حتی در اوت، شب‌های بالای 3000 متر زیر صفر است. در کلیسا
    قواعد پوشش برقرار است.
  route: >-
    از تفلیس با بزرگراه نظامی گرجستان (E117) تا استپانتسمیندا — 157 کیلومتر، حدود سه ساعت — سپس 6 کیلومتر
    پیچ‌درپیچ آسفالته از شهرک تا پارکینگ کلیسای گرگتی. سوخت را در پاسانائوری یا گودائوری بزنید. تابستان
    خودروی اقتصادی تا انتها می‌رسد؛ زمستان گردنهٔ جواری زنجیر چرخ می‌خواهد و جادهٔ گرگتی پس از برف یخ
    می‌زند — خودروی شاسی‌بلند یا تاکسی محلی عاقلانه‌تر است. بهترین دیدگاه‌های کنارجاده‌ای در خود شهرک‌اند.
he:
  name: הר קזבק (מקינוורצוורי)
  short: הר געש רדום בגובה 5,054 מ' — ההר של מיתוס אמיראני, שהנוף שלו מעל כנסיית גרגטי הוא כרטיס הביקור
    של גאורגיה.
  body: >-
    **קזבק הוא ההר שבגללו באים לגאורגיה.** הר הגעש הרדום, 5,054 מ' גובהו, מתרומם ממש ממערב לסטפנצמינדה,
    ובבוקר בהיר כיפתו הלבנה ממלאת את כל השמיים מעל חבל חווי — ולפניה, על שן סלע, עומדת כנסיית גרגטי סמבה:
    כנראה הפריים המצולם ביותר במדינה.


    לגאולוגים זהו חרוט טרכיט כפול שהתפרץ לאחרונה בסביבות שנת 750 לפנה"ס; במורדותיו זוחלים קרחוני גרגטי,
    דבדוראקי ואחרים. במיתולוגיה הגאורגית זהו הר אמיראני — הגיבור שנכבל לסלע על שגנב אש מהאלים, הפרומתאוס
    הגאורגי. בגובה כ-4,000 מ' נמצאת מערת בתלמי, מנזר נזירים מימי הביניים החצוב בצוק.


    הכרטיס הזה עוסק בצפייה בהר ובהתקרבות אליו, לא בפסגה:


    - **הנוף מסטפנצמינדה ומכנסיית גרגטי** — הדרך אל הכנסייה סלולה כיום במלואה

    - **המסלול לבקתת אלטיהאט (3,014 מ')** — כ-3 שעות ו-7 ק"מ עלייה מגרגטי

    - **בקתת בתלמי / תחנת המטאו הישנה (3,650 מ')** — למנוסים, רצוי עם מדריך


    הפסגה נחשפת באופן האמין ביותר עם שחר; עד הצהריים היא כמעט תמיד עוטה כובע עננים. מאוקטובר עד מאי השבילים
    העליונים מכוסים שלג.
  tip: >-
    הסיכוי הטוב ביותר לראות את הפסגה הוא עם אור ראשון — לונו בסטפנצמינדה ובדקו את השמיים עם שחר. אפשר
    לנסוע עד כנסיית גרגטי, אבל השביל לאלטיהאט דורש נעלי הליכה, מים ושכבת רוח; מזג האוויר מתדרדר תוך שעות.
    אל תעלו על הקרחון בלי מדריך וציוד. גם באוגוסט הלילות מעל 3,000 מ' מתחת לאפס. בכנסייה חלים כללי לבוש.
  route: >-
    מטביליסי בכביש הצבא הגאורגי (E117) עד סטפנצמינדה — 157 ק"מ, כשלוש שעות — ואז עוד 6 ק"מ של פיתולים
    סלולים מהעיירה עד חניון כנסיית גרגטי. תדלקו בפסנאורי או בגודאורי. בקיץ רכב חסכוני מגיע עד הסוף; בחורף
    צריך שרשראות במעבר ג'ווארי, ודרך גרגטי מתכסה קרח אחרי שלג — רכב גבוה או מונית מקומית הם הבחירה החכמה.
    נקודות התצפית הטובות ביותר מהכביש נמצאות בעיירה עצמה.
ar:
  name: جبل كازبيك (مكينفارتسفيري)
  short: بركان خامد بارتفاع 5054 متراً — جبل أسطورة أميراني، الذي صار مشهده فوق كنيسة غيرغيتي بطاقة تعريف
    جورجيا.
  body: >-
    **كازبيك هو الجبل الذي يأتي الناس إلى جورجيا من أجله.** يرتفع هذا البركان الخامد البالغ 5054 متراً
    غربي ستيبانتسميندا مباشرة، وفي صباح صافٍ تملأ قبته البيضاء سماء خيفي كلها — وأمامه، على نتوء صخري،
    تقف كنيسة غيرغيتي للثالوث: لعلها اللقطة الأكثر تصويراً في البلاد.


    عند الجيولوجيين هو مخروط مزدوج من التراكيت ثار آخر مرة نحو عام 750 قبل الميلاد؛ وتنحدر على سفوحه أنهار
    غيرغيتي وديفدوراكي الجليدية وغيرها. وفي الأساطير الجورجية هو جبل أميراني — البطل الذي قُيّد إلى الصخر
    لأنه سرق النار من الآلهة؛ بروميثيوس الجورجي. وعلى ارتفاع نحو 4000 متر يقع كهف بيت لحم (بتلمي)، وهو
    ناسكية رهبان من العصور الوسطى منحوتة في الجرف.


    هذه البطاقة عن رؤية الجبل والاقتراب منه، لا عن تسلق قمته:


    - **المشهد من ستيبانتسميندا ومن كنيسة غيرغيتي** — الطريق إلى الكنيسة معبّد اليوم بالكامل

    - **المسير إلى كوخ ألتيهوت (3014 م)** — نحو 3 ساعات و7 كم صعوداً من غيرغيتي

    - **كوخ بتلمي / محطة الأرصاد القديمة (3650 م)** — للمتمرسين، ويُفضل مع مرشد


    تكشف القمة عن نفسها غالباً عند الفجر؛ وبحلول الظهيرة تعتمر دائماً تقريباً قبعة من الغيوم. ومن أكتوبر
    إلى مايو تغطي الثلوج المسارات العليا.
  tip: >-
    أفضل فرصك لرؤية القمة مع أول الضوء — بِت في ستيبانتسميندا وتفقد السماء فجراً. يمكنك القيادة حتى كنيسة
    غيرغيتي، لكن مسار ألتيهوت يحتاج حذاء جبل وماء وسترة ريح؛ فالطقس يتدهور خلال ساعات. لا تخطُ على النهر
    الجليدي بلا مرشد وعتاد. حتى في أغسطس تهبط الليالي فوق 3000 متر تحت الصفر. وتسري قواعد اللباس عند الكنيسة.
  route: >-
    من تبليسي على الطريق العسكري الجورجي (E117) حتى ستيبانتسميندا — 157 كم، نحو ثلاث ساعات — ثم 6 كم إضافية
    من المنعطفات المعبّدة من البلدة إلى موقف كنيسة غيرغيتي. تزوّد بالوقود في باسانوري أو غودوري. في الصيف
    تصل سيارة اقتصادية حتى الأعلى؛ وفي الشتاء يحتاج ممر جفاري إلى سلاسل، ويتجمد طريق غيرغيتي بعد الثلج،
    فسيارة مرتفعة أو تاكسي محلي خيار أذكى. أفضل نقاط المشاهدة على الطريق في البلدة نفسها.
