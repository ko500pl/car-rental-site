ka:
  name: ლაჯანურის წყალსაცავი და ლაილაშის აუზი
  short: >-
    საბჭოთა კაშხლის გრძელი, მომწვანო-ცისფერი ტბა ლეჩხუმის მთებში, რომელიც ყველაზე კარგად ფერდობზე მოწყობილი
    წყაროს აუზიდან მოჩანს.
  body: >-
    **ეს ტბა ინჟინრების ნახელავია — მას მთის მდინარეზე აღმართული 69-მეტრიანი ბეტონის კედელი აკავებს —
    მაგრამ ლაილაშის მთებიდან ისე გამოიყურება, თითქოს ხეობა მას საუკუნეობით ელოდა.**


    ლაჯანურის კაშხლის მშენებლობა 1953 წელს დაიწყო და 1960 წელს დასრულდა. კედლის სიმაღლე 69 მეტრია, სიგრძე
    — 127 მეტრი; მის უკან ლაჯანურა, რომელსაც ცხენისწყლის წყალიც ემატება, დაახლოებით 0,25 კუბური კილომეტრი
    მოცულობის წყალსაცავს ავსებს. სამი 37,6-მეგავატიანი ტურბინა, ჯამში 113 მეგავატი, დღესაც მუშაობს „საქმთავარენერგოსთვის“.
    თავის დროზე ეს საქართველოს ერთ-ერთი უდიდესი კაშხალი იყო და მისმა წარმატებამ საბჭოთა კავშირი რესპუბლიკებში
    ახალი მაღალი კაშხლების აშენებისკენ უბიძგა.


    გზაზე მანქანებს ფერი აჩერებს: მომწვანო-ცისფერი, ღრუბელთან და დღის საათთან ერთად ცვალებადი, ტყიან ქედებს
    შორის გრძელ რკალად გაწოლილი.


    უფრო მაღლა, სოფელ ლაილაშთან, ოქრონიშის წყაროსთან, ის პატარა აუზია, რომელიც მოგზაურთა ფოტოებმა განთქვა;
    ზოგი ბლოგერი მას „საიდუმლო აუზს“ უწოდებს. მისი წარმომავლობის შესახებ ცნობები ერთმანეთს არ ემთხვევა:
    ერთი ტურისტული საიტი საბჭოთა პერიოდით ათარიღებს, ადგილობრივ მემკვიდრეობაზე დაწერილი სტატია კი ლაილაშის
    ებრაულ თემს მიაწერს; ბოლო წლებში აუზი აღადგინეს. ზაფხულში ის წყაროს წყლით ივსება. პატარა და უბრალოა.
    სახელი ხედმა გაუთქვა: წყლის კიდე თითქოს პირდაპირ ხეობაში და ქვემოთ გაშლილ წყალსაცავში გადადის.


    კაშხალი ტურბინების სატრიალებლად ააშენეს. ხედი არავის დაუგეგმავს — და ალბათ ამიტომაც აღიქმება საჩუქრად.
  tip: >-
    წყალსაცავიც და აუზიც უფასოა და არავინ ემსახურება: აქ არც საპირფარეშოა, არც ჯიხური და არც მაშველი,
    ამიტომ წყალი და საჭმელი ცაგერიდან წამოიღეთ. თავად წყალსაცავში ნუ იბანავებთ: ეს მოქმედი ჰესის ტბაა
    ციცაბო ნაპირებით, ცივი წყლითა და ცვალებადი დონით. აუზი ზაფხულში წყაროს წყლით ივსება, მაგრამ ბანაობის
    იმედი ნუ გექნებათ: ივნისი–სექტემბრის გარდა სხვა დროს აუზი შეიძლება ნახევრად ან სულაც ცარიელი დაგხვდეთ,
    ასვლის მთავარი მიზეზი კი მაინც ხედია. ბოლო კილომეტრები ციცაბო და მოუასფალტებელია, ამიტომ ძლიერი წვიმის
    შემდეგ მათ მოერიდეთ. ვიზიტს დაახლოებით ორი საათი დაუთმეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთით ქუთაისამდე იარეთ, შემდეგ Sh16-ით ჩრდილოეთით, ალპანისკენ. სოფელ ალპანის
    გავლის შემდეგ დაახლოებით 4 კილომეტრში მარცხნივ, Sh18-ზე — ალპანა–ცაგერის გზაზე — გადაუხვიეთ: რამდენიმე
    კილომეტრში წყალსაცავი გზის პირას გრძელ, მომწვანო რკალად გამოჩნდება. აუზისკენ მარჯვნივ, ლაილაშისკენ
    მკვეთრად აღმავალ გვერდით გზას გაჰყევით — დაახლოებით 4 კილომეტრი სერპენტინი. თბილისიდან წყალსაცავამდე
    დაახლოებით 309 კილომეტრი და 4 საათი და 45 წუთია; ლაილაშამდე ასვლას კიდევ თხუთმეტიოდე წუთი ემატება.
    მთავარი გზები მოასფალტებულია, მაგრამ სოფლისკენ აღმართზე ასფალტი ადგილ-ადგილ დაზიანებულია, აუზთან ბოლო
    მისასვლელი კი ციცაბო და მოუასფალტებელია და კლირენსი აქ მნიშვნელოვანია: რეკომენდებულია მაღალი გამავლობის
    მანქანა, პატარა მანქანა კი ჯობს ქვემოთ დატოვოთ და ფეხით ახვიდეთ. საწვავი ქუთაისში ან ცაგერში ჩაასხით,
    საჭმელი კი ცაგერში ან ალპანაში იყიდეთ. ღვირიშის ჩანჩქერი და დეხვირის ციხე სულ რამდენიმე კილომეტრშია.
en:
  name: Lajanuri Reservoir and the Lailashi Pool
  short: >-
    A Soviet dam's long green-blue lake in the Lechkhumi hills, best seen from a small spring-fed pool
    on the slope above.
  body: >-
    **The lake is a piece of engineering, held back by a 69-metre concrete wall across a mountain river,
    yet from the hills of Lailashi it looks as if the valley had always been waiting to hold it.**


    Work on the Lajanuri dam began in 1953 and ended in 1960. The wall rises 69 metres and runs 127 metres
    across; behind it the Lajanura, joined by water from the Tskhenistskali, fills a reservoir of about
    0.25 km³. Three 37.6 MW turbines, 113 MW in all, still turn for the operator Sakmtavarenergo. In its
    day it was one of the great dams of Georgia, and its success encouraged the Soviet Union to build
    more tall dams across its republics.


    What stops cars on the road is the colour: a green-blue that shifts with cloud and hour, laid in a
    long curve between wooded ridges.


    Higher up, by the Okronishi spring near the village of Lailashi, is the small pool that travellers'
    photographs have made famous; some bloggers call it the "secret pool". Accounts of its origin differ:
    one travel site dates it to Soviet times, while an article on local heritage credits Lailashi's Jewish
    community, and it has recently been restored. In summer it fills with spring water. It is small and
    plain. Its fame comes from the view, where the edge of the water seems to run straight out into the
    valley and the reservoir below.


    The dam was built to turn turbines. Nobody planned the view, which may be why it feels like a gift.
  tip: >-
    Both the reservoir and the pool are free and unmanaged, with no toilets, kiosks or lifeguards; bring
    water and snacks from Tsageri. Do not swim in the reservoir itself: it is a working hydro lake with
    steep banks, cold water and levels that can change. The pool fills with spring water in summer, but
    do not count on a swim; outside June to September it may be low or empty, and the view is the real
    reason to climb. The last kilometres are steep and unpaved, so avoid them after heavy rain. Allow
    about two hours.
  route: >-
    From Tbilisi take the E60/S1 west to Kutaisi, then the Sh16 north towards Alpana. About 4 km past
    the village of Alpana, turn left onto the Sh18, the Alpana–Tsageri road: within a few kilometres the
    reservoir appears beside it in its long green curve. For the pool, take the side road that climbs
    sharply to the right up to Lailashi, about 4 km of hairpins. The reservoir is about 309 km and roughly
    4 hours 45 minutes from Tbilisi; the climb to Lailashi adds another quarter of an hour. The main roads
    are paved, but the asphalt on the climb to the village is broken in places and the final approach
    to the pool is steep and unpaved, so clearance matters: an SUV is the recommended class, and a small
    car should stop below and walk. Refuel in Kutaisi or Tsageri and buy food in Tsageri or Alpana. Ghvirishi
    Waterfall and Dekhviri Fortress are both within a few kilometres.
ru:
  name: Ладжанурское водохранилище и бассейн Лайлаши
  short: >-
    Длинное зелёно-голубое озеро за советской плотиной среди холмов Лечхуми; лучше всего оно видно из
    маленького бассейна с родниковой водой на склоне выше.
  body: >-
    **Это озеро — творение инженеров, его держит 69-метровая бетонная стена поперёк горной реки, и всё
    же с холмов Лайлаши кажется, будто долина испокон веков ждала, чтобы его принять.**


    Строительство Ладжанурской плотины началось в 1953 году и завершилось в 1960-м. Стена поднимается
    на 69 метров и тянется на 127 метров в длину; за ней река Ладжанура, к которой добавляется вода Цхенисцкали,
    наполняет водохранилище объёмом около 0,25 км³. Три турбины по 37,6 МВт, всего 113 МВт, по-прежнему
    работают на компанию-оператора «Сакмтаварэнерго». В своё время это была одна из крупнейших плотин
    Грузии, и её успех подтолкнул Советский Союз строить новые высокие плотины в союзных республиках.


    Машины на дороге останавливает цвет: зелёно-голубой, меняющийся вместе с облаками и временем суток,
    он лежит длинной дугой между лесистыми хребтами.


    Выше, у родника Окрониши возле села Лайлаши, лежит маленький бассейн, который прославили фотографии
    путешественников; некоторые блогеры называют его «секретным бассейном». Сведения о его происхождении
    расходятся: один туристический сайт относит его к советским временам, а статья о местном наследии
    приписывает его еврейской общине Лайлаши; недавно бассейн отреставрировали. Летом его наполняет родниковая
    вода. Бассейн маленький и скромный. Славу ему принёс вид: кажется, что край воды уходит прямо в долину,
    к водохранилищу внизу.


    Плотину строили, чтобы вращать турбины. Вид никто не планировал — может быть, поэтому он и кажется
    подарком.
  tip: >-
    И водохранилище, и бассейн бесплатны и никем не обслуживаются: ни туалетов, ни киосков, ни спасателей;
    воду и перекус везите из Цагери. Не купайтесь в самом водохранилище: это действующий водоём ГЭС с
    крутыми берегами, холодной водой и уровнем, который может меняться. Бассейн летом наполняется родниковой
    водой, но на купание не рассчитывайте: вне периода с июня по сентябрь он может обмелеть или стоять
    пустым, а главная причина подняться — всё-таки вид. Последние километры крутые и без покрытия, так
    что после сильного дождя от них лучше отказаться. Заложите около двух часов.
  route: >-
    Из Тбилиси по E60/S1 на запад до Кутаиси, затем по Sh16 на север в сторону Алпаны. Примерно в 4 км
    за селом Алпана сверните налево на Sh18 — дорогу Алпана–Цагери: через несколько километров водохранилище
    появится у дороги своей длинной зелёной дугой. К бассейну ведёт боковая дорога, круто уходящая направо
    вверх к Лайлаши, — около 4 км серпантина. До водохранилища от Тбилиси около 309 км, примерно 4 часа
    45 минут; подъём к Лайлаши добавит ещё с четверть часа. Основные дороги асфальтированы, но на подъёме
    к селу асфальт местами разбит, а последний подъезд к бассейну крутой и грунтовый, здесь важен клиренс:
    рекомендуемый класс — внедорожник, а на маленькой машине лучше остановиться ниже и дойти пешком. Заправляйтесь
    в Кутаиси или Цагери, еду покупайте в Цагери или Алпане. Водопад Гвириши и крепость Дехвири — в нескольких
    километрах.
fa:
  name: دریاچهٔ سد لاجانوری و استخر لایلاشی
  short: >-
    دریاچهٔ دراز و سبزآبیِ پشت سدی شوروی در میان تپه‌های لچخومی، که زیباترین منظره‌اش از استخری کوچک با
    آب چشمه بر شیب بالادست دیده می‌شود.
  body: >-
    **این دریاچه ساختهٔ مهندسی است و دیواری بتنی به بلندی ۶۹ متر در عرض رودی کوهستانی آن را نگه داشته
    است؛ با این حال از تپه‌های لایلاشی چنان می‌نماید که گویی دره از ازل چشم‌انتظار در آغوش گرفتنش بوده
    است.**


    ساخت سد لاجانوری در ۱۹۵۳ آغاز شد و در ۱۹۶۰ به پایان رسید. دیوارهٔ سد ۶۹ متر ارتفاع و ۱۲۷ متر طول دارد؛
    پشت آن، رود لاجانورا، همراه با آبی که از رود تسخنیستسقالی به آن افزوده می‌شود، مخزنی به حجم حدود ۰٫۲۵
    کیلومتر مکعب را پر می‌کند. سه توربین ۳۷٫۶ مگاواتی، روی‌هم ۱۱۳ مگاوات، هنوز برای شرکت بهره‌بردار، ساکمتاوارانرگو،
    می‌چرخند. این سد در روزگار خود از سدهای بزرگ گرجستان بود و موفقیتش اتحاد شوروی را به ساختن سدهای بلند
    بیشتری در جمهوری‌هایش ترغیب کرد.


    آنچه خودروها را در جاده نگه می‌دارد رنگ است: سبزآبی‌ای که با ابرها و ساعت‌های روز دگرگون می‌شود و
    در قوسی بلند میان ستیغ‌های جنگلی گسترده است.


    بالاتر، کنار چشمهٔ اوکرونیشی در نزدیکی روستای لایلاشی، استخر کوچکی است که عکس‌های مسافران آوازه‌اش
    را پراکنده است؛ برخی وبلاگ‌نویسان آن را «استخر مخفی» می‌نامند. روایت‌ها دربارهٔ پیدایش آن یکسان نیست:
    یک وب‌سایت گردشگری آن را از دوران شوروی می‌داند و مقاله‌ای دربارهٔ میراث محلی ساختش را به جامعهٔ یهودی
    لایلاشی نسبت می‌دهد؛ چندی پیش نیز مرمت شده است. تابستان‌ها با آب چشمه پر می‌شود. کوچک است و بی‌پیرایه.
    آوازه‌اش از چشم‌انداز است: لبهٔ آب گویی یکراست به درون دره و دریاچهٔ سد در پایین امتداد می‌یابد.


    سد را برای چرخاندن توربین‌ها ساختند. کسی این منظره را برنامه‌ریزی نکرده بود، و شاید برای همین است
    که به هدیه‌ای می‌ماند.
  tip: >-
    دریاچهٔ سد و استخر هر دو رایگان‌اند و بی‌متصدی؛ نه سرویس بهداشتی دارند، نه دکه، نه نجات‌غریق. آب و
    خوراکی را از تساگری همراه بیاورید. در خود دریاچهٔ سد شنا نکنید: این دریاچهٔ فعال یک نیروگاه برق‌آبی
    است، با کرانه‌های پرشیب، آب سرد و سطحی که ممکن است تغییر کند. استخر در تابستان با آب چشمه پر می‌شود،
    اما روی شنا حساب نکنید؛ بیرون از ژوئن تا سپتامبر ممکن است کم‌آب یا خالی باشد، و دلیل اصلی بالا رفتن
    همان منظره است. چند کیلومتر آخر پرشیب و خاکی است، پس پس از باران شدید از آن پرهیز کنید. حدود دو ساعت
    وقت بگذارید.
  route: >-
    از تفلیس با E60/S1 به سمت غرب تا کوتائیسی بروید، سپس از Sh16 به شمال، به سوی آلپانا. حدود ۴ کیلومتر
    پس از روستای آلپانا، به چپ و به Sh18، جادهٔ آلپانا–تساگری، بپیچید: چند کیلومتر بعد دریاچهٔ سد با قوس
    بلند و سبزش کنار جاده پدیدار می‌شود. برای رسیدن به استخر، راه فرعی‌ای را بگیرید که با شیبی تند به
    راست و به سوی لایلاشی بالا می‌رود — حدود ۴ کیلومتر جادهٔ پرپیچ‌وخم. از تفلیس تا دریاچهٔ سد حدود ۳۰۹
    کیلومتر و تقریباً ۴ ساعت و ۴۵ دقیقه راه است؛ بالا رفتن تا لایلاشی ربع ساعتی دیگر می‌افزاید. جاده‌های
    اصلی آسفالت‌اند، اما در سربالایی روستا آسفالت جابه‌جا خراب است و راه پایانی تا استخر خاکی و پرشیب
    است و فاصلهٔ کف خودرو از زمین اهمیت دارد: ردهٔ پیشنهادی شاسی‌بلند است و با خودروی کوچک بهتر است پایین‌تر
    بایستید و پیاده بالا بروید. سوخت را در کوتائیسی یا تساگری بزنید و غذا را از تساگری یا آلپانا بخرید.
    آبشار غویریشی و دژ دخویری هر دو در چند کیلومتری‌اند.
he:
  name: מאגר לג'אנורי ובריכת לאילאשי
  short: >-
    אגם ארוך בגוון ירוק-כחול מאחורי סכר סובייטי בגבעות לצ'חומי, שנשקף במיטבו מבריכה קטנה של מי מעיין על
    המדרון שמעליו.
  body: >-
    **האגם הזה הוא מפעל הנדסי — קיר בטון בגובה 69 מטר, החוסם נהר הררי, עוצר את מימיו — ובכל זאת מגבעות
    לאילאשי נראה כאילו העמק חיכה מאז ומעולם להכיל אותו.**


    העבודות על סכר לג'אנורי החלו ב-1953 והסתיימו ב-1960. הקיר מתנשא לגובה 69 מטר ונמתח לרוחב 127 מטר;
    מאחוריו ממלא נהר הלג'אנורה, שאליו מצטרפים מים מנהר הצחניסצקאלי, מאגר של כ-0.25 קילומטר מעוקב. שלוש
    טורבינות של 37.6 מגה-ואט כל אחת, 113 מגה-ואט בסך הכול, עדיין מסתובבות עבור החברה המפעילה, סקמטבארנרגו.
    בזמנו היה זה אחד הסכרים הגדולים של גאורגיה, והצלחתו עודדה את ברית המועצות לבנות עוד סכרים גבוהים ברחבי
    הרפובליקות שלה.


    מה שעוצר מכוניות בדרך הוא הצבע: ירוק-כחול שמשתנה עם העננים ועם שעות היום, פרוש בקשת ארוכה בין רכסים
    מיוערים.


    גבוה יותר, ליד מעיין אוקרונישי שבקרבת הכפר לאילאשי, נמצאת הבריכה הקטנה שתצלומי מטיילים הפכו למפורסמת;
    יש בלוגרים שמכנים אותה "הבריכה הסודית". הדיווחים על מוצאה חלוקים: אתר תיירות אחד מייחס אותה לימי ברית
    המועצות, ומאמר על המורשת המקומית מייחס את בנייתה לקהילה היהודית של לאילאשי; לאחרונה היא שוקמה. בקיץ
    היא מתמלאת במי מעיין. היא קטנה ופשוטה. את פרסומה היא חבה לנוף: שפת המים נראית כאילו היא נמשכת ישר
    אל העמק ואל המאגר שלמטה.


    הסכר נבנה כדי לסובב טורבינות. איש לא תכנן את הנוף, ואולי משום כך הוא מרגיש כמו מתנה.
  tip: >-
    הכניסה למאגר ולבריכה חינם, ואין במקום שום צוות: אין בתי שימוש, אין קיוסקים ואין מצילים; הביאו מים
    וחטיפים מצאגרי. אל תשחו במאגר עצמו: זהו אגם פעיל של תחנת כוח הידרואלקטרית, עם גדות תלולות, מים קרים
    ומפלס שעלול להשתנות. הבריכה מתמלאת במי מעיין בקיץ, אבל אל תסמכו על שחייה; מחוץ לחודשים יוני עד ספטמבר
    היא עשויה להיות רדודה או ריקה, והסיבה האמיתית לטפס היא הנוף. הקילומטרים האחרונים תלולים ולא סלולים,
    לכן הימנעו מהם אחרי גשם כבד. הקצו כשעתיים.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד קוטאיסי, ומשם צפונה בכביש Sh16 לכיוון אלפנה. כ-4 ק"מ אחרי הכפר
    אלפנה פנו שמאלה לכביש Sh18, דרך אלפנה–צאגרי: כעבור קילומטרים ספורים המאגר מופיע לצד הדרך בקשת ירוקה
    ארוכה. אל הבריכה מובילה דרך צדדית המטפסת בתלילות ימינה אל לאילאשי — כ-4 ק"מ של פיתולים. מטביליסי עד
    המאגר כ-309 ק"מ וכ-4 שעות ו-45 דקות; העלייה ללאילאשי מוסיפה עוד כרבע שעה. הכבישים הראשיים סלולים,
    אבל בעלייה לכפר האספלט שבור פה ושם, והגישה האחרונה לבריכה תלולה ולא סלולה, ומרווח הגחון חשוב בה: הסוג
    המומלץ הוא רכב שטח, ועם רכב קטן עדיף לעצור למטה ולעלות ברגל. תדלקו בקוטאיסי או בצאגרי, וקנו אוכל בצאגרי
    או באלפנה. מפל גווירישי ומבצר דחווירי נמצאים שניהם במרחק קילומטרים ספורים.
ar:
  name: خزان لاجانوري وحوض لايلاشي
  short: >-
    بحيرة طويلة خضراء مزرقّة خلف سدّ سوفييتي بين تلال ليتشخومي، وأجمل ما تُرى من حوض صغير بماء الينابيع
    على المنحدر فوقها.
  body: >-
    **هذه البحيرة صنيعة هندسية، يحبسها جدار خرساني بارتفاع 69 متراً يعترض نهراً جبلياً، ومع ذلك تبدو من
    تلال لايلاشي كأن الوادي كان ينتظر منذ الأزل أن يحتضنها.**


    بدأ العمل في سد لاجانوري عام 1953 وانتهى عام 1960. يرتفع الجدار 69 متراً ويمتد 127 متراً عرضاً؛ وخلفه
    يملأ نهر لاجانورا، مع مياه تُضاف إليه من نهر تسخينيستسقالي، خزاناً سعته نحو 0.25 كم³. ولا تزال ثلاثة
    توربينات قدرة كلٍّ منها 37.6 ميغاواط، أي 113 ميغاواط إجمالاً، تدور لحساب الشركة المشغّلة ساكمتافارينيرغو.
    كان في زمنه من كبرى سدود جورجيا، وشجّع نجاحه الاتحادَ السوفييتي على بناء مزيد من السدود العالية في
    جمهورياته.


    ما يوقف السيارات على الطريق هو اللون: أخضر مزرقّ يتبدّل مع الغيوم وساعات النهار، ممدود في قوس طويل
    بين حيود جبلية مكسوّة بالغابات.


    وفي الأعلى، عند نبع أوكرونيشي قرب قرية لايلاشي، يقع الحوض الصغير الذي أشهرته صور المسافرين؛ ويسمّيه
    بعض المدوّنين «المسبح السري». وتختلف الروايات في أصله: فأحد مواقع السياحة ينسبه إلى الحقبة السوفييتية،
    في حين تنسب مقالة عن التراث المحلي بناءه إلى الجالية اليهودية في لايلاشي؛ وقد رُمّم مؤخراً. يمتلئ
    صيفاً بماء الينابيع. إنه صغير وبسيط، وشهرته آتية من المنظر، إذ تبدو حافة الماء كأنها تمتد مباشرة نحو
    الوادي والخزان في الأسفل.


    بُني السد ليدير التوربينات. لم يخطط أحد للمنظر، وربما لهذا يبدو كأنه هدية.
  tip: >-
    الخزان والحوض كلاهما مجانيان وبلا أي إدارة: لا دورات مياه ولا أكشاك ولا منقذين؛ أحضر الماء والوجبات
    الخفيفة من تساغيري. لا تسبح في الخزان نفسه: إنه بحيرة كهرومائية عاملة ذات ضفاف شديدة الانحدار ومياه
    باردة ومنسوب قد يتغير. يمتلئ الحوض بماء الينابيع صيفاً، لكن لا تعوّل على السباحة؛ فخارج الفترة من
    يونيو إلى سبتمبر قد يكون ضحلاً أو فارغاً، والسبب الحقيقي للصعود هو المنظر. الكيلومترات الأخيرة شديدة
    الانحدار وغير معبّدة، فتجنّبها بعد الأمطار الغزيرة. خصّص نحو ساعتين.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى كوتايسي، ثم Sh16 شمالاً نحو ألبانا. وعلى بعد نحو 4 كم بعد قرية
    ألبانا انعطف يساراً إلى الطريق Sh18، طريق ألبانا–تساغيري: وبعد بضعة كيلومترات يظهر الخزان بجانب الطريق
    في قوسه الأخضر الطويل. أما إلى الحوض فخذ الطريق الجانبي الذي يصعد بحدّة يميناً نحو لايلاشي — نحو 4
    كم من المنعطفات. المسافة من تبليسي إلى الخزان نحو 309 كم وقرابة 4 ساعات و45 دقيقة، ويضيف الصعود إلى
    لايلاشي ربع ساعة أخرى تقريباً. الطرق الرئيسية معبّدة، لكن الأسفلت متكسّر في مواضع على صعود القرية،
    والمقطع الأخير إلى الحوض شديد الانحدار وغير معبّد ويهمّ فيه ارتفاع السيارة عن الأرض: الفئة الموصى
    بها سيارة دفع رباعي، أما السيارة الصغيرة فالأفضل أن تتوقف في الأسفل وتكمل مشياً. تزوّد بالوقود في
    كوتايسي أو تساغيري، واشترِ الطعام من تساغيري أو ألبانا. وشلال غفيريشي وقلعة ديخفيري كلاهما على بعد
    بضعة كيلومترات.
