ka:
  name: სიღნაღი
  short: >-
    ერეკლე მეფის გალავნიანი თავშესაფარი 790 მეტრზე: კოშკები, ქვაფენილიანი ქუჩები და ფეხქვეშ გაშლილი ალაზნის
    ველი კავკასიონის კედლამდე.
  body: >-
    **სიღნაღი თურქული სიტყვაა და „თავშესაფარს“ ნიშნავს — ქალაქიც სწორედ თავშესაფრად აშენდა.** 1762 წელს
    ერეკლე II-მ ძველი ციხის ნანგრევებზე ახალი ციხე-გალავანი ააგო და თითქმის ორმოცი ჰექტარი შემოზღუდა,
    რომ ქიზიყის სოფლებს ლეკიანობისას შიგნით შეხიზვნა მოესწროთ. გალავანი დაახლოებით ოთხ კილომეტრზეა გადაჭიმული;
    ქართული საბჭოთა ენციკლოპედიის ცნობით, მას ოცდასამი კოშკი და ხუთი ჭიშკარი ჰქონდა, გადმოცემით კი თითოეულ
    კოშკს იმ სოფლის სახელი ერქვა, რომელსაც იფარავდა.


    ერეკლეს დროს სიღნაღი სამეფო ქალაქი და ქიზიყის ცენტრი იყო, მას ქიზიყის მოურავი განაგებდა. 1770 წლის
    აღწერით აქ ასი კომლი ცხოვრობდა, თითქმის სულ ვაჭრები და ხელოსნები, და ვაჭრობამ ქალაქის სახე დიდხანს
    განსაზღვრა: 1834 წელს მოგზაურმა დიუბუა დე მონპერემ სიღნაღში 3200 მცხოვრები აღრიცხა, აქედან 2851 სომეხი.
    1793 წელს სომხურ ეკლესიად აგებული წმინდა გიორგის ტაძარი დღეს ქართულ მართლმადიდებლურ ეკლესიას ემსახურება.


    ქალაქი გომბორის ქედის სამხრეთ-აღმოსავლეთ კალთებზე, ზღვის დონიდან დაახლოებით 790 მეტრზეა გაშენებული.
    აღმოსავლეთის კიდიდან მიწა ალაზნის ველისკენ ეშვება — ვენახებისა და ყანების ბრტყელი, მწვანე ფსკერისკენ,
    რომლის იქით კავკასიონი ერთიან კედლად აღმართულა. 2007 წლის რესტავრაციამ ცენტრს პასტელური ფასადები,
    ჩუქურთმიანი ხის აივნები და ქვაფენილი დაუბრუნა; ზოგს ეს მეტისმეტად გაპრიალებული ეჩვენება, მაგრამ ხედს
    აღდგენა არასდროს დასჭირვებია.


    მოედანზე სიღნაღის მუზეუმი იმავე წელს განახლდა; მის დარბაზებში ნიკო ფიროსმანის თექვსმეტი სურათი კიდია
    — მხატვარი ახლომახლო, მირზაანში დაიბადა. წყვილები აქ ხშირად მხოლოდ დასაქორწინებლად ჩამოდიან — ამიტომაც
    ჰქვია სიღნაღს „სიყვარულის ქალაქი“. ორ კილომეტრში ბოდბეა, წმინდა ნინოს მონასტერი.


    გალავანზე დღის ბოლოს გაისეირნეთ, როცა ველი უკვე გალურჯებულია და მზე მხოლოდ კავკასიონის თოვლს შერჩენია.
  tip: >-
    სადილის შემდეგ ჩამოდით და მზის ჩასვლას დაელოდეთ, უკეთესია კი ღამე აქ გაათიოთ და დილით ნისლით ავსებული
    ველი ნახოთ. მანქანა ძველი ცენტრის კიდეზე დატოვეთ და ვიწრო ქუჩებში ნუ შეიყვანთ — ცენტრი იმდენად პატარაა,
    რომ ფეხით რამდენიმე წუთში გადაკვეთთ. მოედნის, მუზეუმისა და გალავნის ერთი მონაკვეთისთვის სამი საათი
    გამოყავით; კოშკების კიბეები ციცაბო და არათანაბარია, ამიტომ მოხერხებული ფეხსაცმელი ჩაიცვით. შაბათ-კვირას
    თბილისიდან ბევრი ჩამოდის, სამუშაო დღეებში უფრო წყნარია. თუ მარნებში ქვევრის ღვინის დაგემოვნებას აპირებთ,
    საჭესთან ნუ დაჯდებით — ღამე დარჩით.
  route: >-
    თბილისიდან ს5-ით, კახეთის გზატკეცილით, აღმოსავლეთისკენ გადით და საგარეჯოსა და ბადიაურის გავლით იარეთ.
    დაახლოებით 96 კილომეტრის შემდეგ, ჭალაუბანთან, მარჯვნივ შ40-ზე გადაუხვიეთ და ბოლო თხუთმეტი კილომეტრი
    ნუკრიანის გავლით სიღნაღამდე აიარეთ — სულ დაახლოებით 110 კმ და საათი და ორმოცდაათი წუთი. გზა ბოლომდე
    ასფალტიანია და ეკონომ-კლასის მანქანა სავსებით საკმარისია, თუმცა ბოლო აღმართზე გზა ვიწროვდება და მკვეთრი
    მოსახვევებით მიიკლაკნება, ქალაქის ქუჩები კი ციცაბოა. საწვავს საგარეჯოში და გზატკეცილის გასწვრივ ადვილად
    იპოვით. ბოდბის მონასტერი ქალაქიდან სულ ორ კილომეტრშია — იმავე მოგზაურობაში შეიტანეთ.
en:
  name: Sighnaghi
  short: >-
    King Erekle's walled refuge on a ridge at 790 metres: towers, cobbled lanes and the whole Alazani
    Valley laid out below the Caucasus.
  body: >-
    **Sighnaghi takes its name from a Turkic word for shelter, and a shelter is exactly what it was built
    to be.** In 1762 King Erekle II raised a new fortress on the ruins of an older one, enclosing almost
    forty hectares of ridge so that the villages of Kiziqi could run inside when raiders came down from
    Dagestan. The wall runs for some four kilometres; the Georgian encyclopaedic count gives it twenty-three
    towers and five gates, and tradition says each tower bore the name of the village it sheltered.


    Under Erekle this was a royal town and the seat of Kiziqi, governed by his mouravi. The census of
    1770 found a hundred households here, nearly all merchants and craftsmen, and trade long shaped the
    town: in 1834 the traveller Dubois de Montpéreux recorded 3,200 inhabitants, 2,851 of them Armenian.
    The church of St George, built as an Armenian church in 1793, now serves the Georgian Orthodox faithful.


    The town sits at about 790 metres on the south-eastern slopes of the Gombori range. From its eastern
    edge the ground falls away to the Alazani Valley, a flat green floor of vineyards and fields, and
    beyond it the Greater Caucasus rises in a single wall. The 2007 restoration gave the centre its pastel
    façades, carved wooden balconies and cobbled lanes; some find it too tidy, but the view has never
    needed restoring.


    On the square, the Sighnaghi Museum reopened the same year; inside hang sixteen paintings by Niko
    Pirosmani, born in nearby Mirzaani. Couples come here simply to get married, which is why Georgians
    call it the City of Love. Two kilometres away stands Bodbe, the monastery of St Nino.


    Walk the rampart at the end of the day, when the valley has gone blue and only the snow on the Caucasus
    still holds the sun.
  tip: >-
    Arrive after lunch and stay for sunset; better still, sleep here and see the valley fill with morning
    mist. Park at the edge of the old centre rather than in its lanes — the core is small enough to cross
    on foot in minutes. Allow three hours for the square, the museum and a stretch of the wall; the tower
    stairs are steep and uneven, so wear proper shoes. Weekends bring day-trippers from Tbilisi, so weekdays
    are calmer. If you plan to taste qvevri wine in the cellars, stay the night rather than drive.
  route: >-
    Leave Tbilisi on the S5, the Kakheti highway, and follow it east through Sagarejo and Badiauri. After
    about 96 km, at Chalaubani, turn right onto the Sh40 and climb the last fifteen kilometres through
    Nukriani to Sighnaghi — around 110 km and an hour and fifty minutes in all. The road is asphalt throughout
    and an economy car is entirely adequate, though the final ascent narrows into tight bends and the
    lanes in town are steep. Fuel is easy in Sagarejo and along the highway. Bodbe monastery is a two-kilometre
    detour from town, so fold it into the same trip.
ru:
  name: Сигнахи
  short: >-
    Обнесённое стеной убежище царя Ираклия на хребте высотой 790 метров: башни, булыжные улочки и вся
    Алазанская долина, раскинувшаяся у подножия Кавказа.
  body: >-
    **Название Сигнахи восходит к тюркскому слову «укрытие», и укрытием он и был задуман.** В 1762 году
    царь Ираклий II возвёл на развалинах старой крепости новую, обнеся стеной почти сорок гектаров хребта,
    чтобы сёла Кизики могли укрыться внутри, когда из Дагестана приходили набеги. Стена тянется примерно
    на четыре километра; по данным грузинской энциклопедии, у неё двадцать три башни и пять ворот, а предание
    говорит, что каждая башня носила имя того села, которое она укрывала.


    При Ираклии это был царский город и центр Кизики, которым управлял его моурав. Перепись 1770 года
    зафиксировала здесь сто дворов, почти все — купцы и ремесленники, и торговля долго определяла облик
    города: в 1834 году путешественник Дюбуа де Монпере насчитал в Сигнахи 3200 жителей, из них 2851 армянина.
    Церковь Святого Георгия, построенная в 1793 году как армянская, сегодня служит грузинским православным
    верующим.


    Город стоит на высоте около 790 метров, на юго-восточных склонах Гомборского хребта. От его восточного
    края земля обрывается к Алазанской долине — плоскому зелёному дну из виноградников и полей, а за ней
    единой стеной поднимается Большой Кавказ. Реставрация 2007 года вернула центру пастельные фасады,
    резные деревянные балконы и булыжные улочки; кому-то это кажется чересчур опрятным, но виду никогда
    не требовалась реставрация.


    На площади в том же году вновь открылся музей Сигнахи; в его залах висят шестнадцать картин Нико Пиросмани,
    родившегося в соседнем Мирзаани. Пары приезжают сюда просто для того, чтобы пожениться — за это грузины
    и называют Сигнахи Городом любви. В двух километрах отсюда стоит Бодбе, монастырь Святой Нино.


    Пройдитесь по крепостной стене в конце дня, когда долина уже посинела, а солнце всё ещё держится только
    на снегах Кавказа.
  tip: >-
    Приезжайте после обеда и оставайтесь до заката; ещё лучше — переночуйте здесь и посмотрите, как долину
    заполняет утренний туман. Оставьте машину на краю старого центра, а не в его переулках — он настолько
    мал, что пересечь его пешком можно за несколько минут. На площадь, музей и участок стены отведите
    три часа; лестницы башен крутые и неровные, так что нужна удобная обувь. По выходным сюда приезжает
    много туристов из Тбилиси, в будни спокойнее. Если планируете дегустацию квеврийного вина в погребах,
    останьтесь на ночь, а не садитесь за руль.
  route: >-
    Из Тбилиси по S5, Кахетинской трассе, на восток, через Сагареджо и Бадиаури. Примерно через 96 км,
    у Чалаубани, поверните направо на Sh40 и поднимитесь последние пятнадцать километров через Нукриани
    до Сигнахи — всего около 110 км и час пятьдесят минут. Дорога полностью асфальтирована, и машины эконом-класса
    вполне достаточно, хотя на финальном подъёме дорога сужается и идёт крутыми виражами, а улочки в городе
    крутые. Заправиться легко в Сагареджо и по трассе. Монастырь Бодбе — двухкилометровый крюк от города,
    так что включите его в ту же поездку.
fa:
  name: سیغناغی
  short: >-
    پناهگاه دیوارکشیده‌ی ارکله‌شاه بر تیغه‌ای در ارتفاع ۷۹۰ متری: برج‌ها، کوچه‌های سنگ‌فرش‌شده و تمام
    دشت آلازانی که در زیر قفقاز گشوده شده است.
  body: >-
    **سیغناغی نامش را از واژه‌ای ترکی به‌معنای «پناهگاه» گرفته، و درست به همین منظور نیز بنا شد.** در
    سال ۱۷۶۲، ارکله دوم بر ویرانه‌های قلعه‌ای کهن‌تر، قلعه‌ای نو برافراشت و نزدیک به چهل هکتار از تیغه
    را با دیواری در بر گرفت تا روستاهای کیزیقی هنگام یورش از داغستان بتوانند درون آن پناه گیرند. دیوار
    نزدیک به چهار کیلومتر امتداد دارد؛ به گفته‌ی دایره‌المعارف گرجی، بیست‌وسه برج و پنج دروازه دارد، و
    روایت است که هر برج نام روستایی را داشت که پناه می‌داد.


    در دوران ارکله، سیغناغی شهری سلطنتی و مرکز کیزیقی بود که موراوی او آن را می‌گرداند. سرشماری ۱۷۷۰ در
    اینجا صد خانوار یافت، تقریباً همه بازرگان و پیشه‌ور، و بازرگانی دیرزمانی سیمای شهر را شکل داد: در
    سال ۱۸۳۴، سیاح دوبوا دو مونپرو در سیغناغی ۳۲۰۰ ساکن شمرد، که ۲۸۵۱ تن از آنان ارمنی بودند. کلیسای گئورگیوس
    قدیس، که در سال ۱۷۹۳ به‌عنوان کلیسایی ارمنی بنا شد، امروز به مؤمنان ارتدوکس گرجی خدمت می‌کند.


    شهر بر ارتفاع نزدیک به ۷۹۰ متری، بر دامنه‌های جنوب‌شرقی رشته‌کوه گومبوری برپاست. از کناره‌ی شرقی آن
    زمین به‌سوی دشت آلازانی سرازیر می‌شود — بستری مسطح و سبز از تاکستان‌ها و کشتزارها — و پس از آن، قفقاز
    بزرگ چون دیواری یکپارچه برمی‌خیزد. بازسازی سال ۲۰۰۷ نماهای پاستل‌رنگ، ایوان‌های چوبی منبت‌کاری‌شده
    و کوچه‌های سنگ‌فرش را به مرکز شهر بازگرداند؛ برخی آن را بیش‌ازحد آرایش‌یافته می‌یابند، اما منظره هرگز
    به بازسازی نیاز نداشته.


    در میدان، موزه‌ی سیغناغی همان سال دوباره گشوده شد؛ در تالارهایش شانزده تابلوی نیکو پیروسمانی آویزان
    است، نقاشی که در میرزاآنی نزدیک زاده شد. زوج‌ها گاه فقط برای ازدواج به اینجا می‌آیند — و از همین‌رو
    گرجی‌ها سیغناغی را «شهر عشق» می‌نامند. در دو کیلومتری، بودبه، صومعه‌ی نینوی قدیسه، برپاست.


    در پایان روز بر دیوار قلعه گام بزنید، آنگاه که دشت پیشاپیش کبود شده و خورشید تنها بر برف قفقاز باقی
    مانده است.
  tip: >-
    پس از ناهار بیایید و تا غروب بمانید؛ بهتر است شب را همین‌جا بگذرانید و ببینید که دشت با مه بامدادی
    پر می‌شود. خودرو را در کناره‌ی مرکز کهن پارک کنید، نه در کوچه‌هایش — هسته‌ی شهر آن‌قدر کوچک است که
    در چند دقیقه پیاده عبورش می‌کنید. برای میدان، موزه و بخشی از دیوار سه ساعت در نظر بگیرید؛ پلکان برج‌ها
    پرشیب و ناهموار است، پس کفشی مناسب بپوشید. آخر هفته‌ها گردشگران روزانه از تفلیس می‌آیند، پس روزهای
    هفته آرام‌تر است. اگر قصد چشیدن شراب کوِوری (شراب کوزه‌ای گرجی) در انبارها را دارید، شب را بمانید
    و پشت فرمان ننشینید.
  route: >-
    از تفلیس از S5، بزرگراه کاختی، به سوی شرق حرکت کنید و از ساگارجو و بادیائوری بگذرید. پس از حدود ۹۶
    کیلومتر، در چالائوبانی، به راست، به Sh40 بپیچید و پانزده کیلومتر پایانی را از میان نوکریانی تا سیغناغی
    بالا بروید — در مجموع نزدیک به ۱۱۰ کیلومتر و یک ساعت و پنجاه دقیقه. جاده تمام مسیر آسفالته است و خودرویی
    معمولی کاملاً کافی است، هرچند جاده در سربالایی پایانی باریک و پرپیچ‌وخم می‌شود و کوچه‌های شهر پرشیب‌اند.
    سوخت‌گیری در ساگارجو و در طول بزرگراه آسان است. صومعه‌ی بودبه تنها دو کیلومتر از شهر فاصله دارد، پس
    آن را هم در همین سفر بگنجانید.
he:
  name: סיגנאגי
  short: >-
    מקום המבטחים המוקף חומה של המלך ארקלה, על רכס בגובה 790 מטרים: מגדלים, סמטאות מרוצפות ועמק אלזני כולו
    נשקף מתחת לקווקז.
  body: >-
    **סיגנאגי שואבת את שמה ממילה טורקית שמשמעה מחסה — ומחסה בדיוק נועדה להיות.** ב-1762 הקים המלך ארקלה
    השני מצודה חדשה על חורבות מצודה ישנה יותר, והקיף בחומה כארבעים הקטרים של הרכס, כך שכפרי קיזיקי יוכלו
    למצוא בה מחסה כשפושטים ירדו מדאגסטן. החומה נמשכת כארבעה קילומטרים; לפי האנציקלופדיה הגאורגית יש לה
    עשרים ושלושה מגדלים וחמישה שערים, והמסורת מספרת שכל מגדל נשא את שם הכפר שהגן עליו.


    בתקופת ארקלה זו הייתה עיר מלכותית ומרכז קיזיקי, שנשלטה בידי המוראבי שלו. מפקד 1770 מצא כאן מאה בתי
    אב, כמעט כולם סוחרים ובעלי מלאכה, והמסחר עיצב את פני העיר לאורך זמן: ב-1834 מנה המטייל דובואה דה מונפרה
    בסיגנאגי 3,200 תושבים, מהם 2,851 ארמנים. כנסיית גאורגיוס הקדוש, שנבנתה ב-1793 ככנסייה ארמנית, משרתת
    כיום את המאמינים האורתודוקסים הגאורגים.


    העיר שוכנת בגובה של כ-790 מטרים, על המדרונות הדרום-מזרחיים של רכס גומבורי. מקצהּ המזרחי יורדת הקרקע
    לעמק אלזני, קרקעית ירוקה ושטוחה של כרמים ושדות, ומעברו מתנשא הקווקז הגדול כקיר אחד. השיפוץ של 2007
    החזיר למרכז את החזיתות הפסטליות, מרפסות העץ המגולפות והסמטאות המרוצפות; יש הרואים בכך יתר-טיפוח, אך
    הנוף מעולם לא הצריך שיפוץ.


    בכיכר נפתח מוזיאון סיגנאגי מחדש באותה שנה; בחדריו תלויים שישה-עשר ציורים של ניקו פירוסמני, שנולד בקרבת
    מקום, במירזאני. זוגות מגיעים לכאן רק כדי להתחתן, ומכאן הכינוי שהגאורגים נותנים לה: עיר האהבה. במרחק
    שני קילומטרים עומד בודבה, מנזר נינו הקדושה.


    טיילו על החומה בסוף היום, כשהעמק כבר הכחיל ורק השלג על הקווקז עדיין אוחז באור השמש.
  tip: >-
    הגיעו אחרי הצהריים והישארו עד השקיעה; טוב עוד יותר, לינו כאן וראו את העמק מתמלא בערפילי בוקר. השאירו
    את הרכב בקצה המרכז העתיק ולא בסמטאותיו — הגרעין הישן קטן דיו כדי לחצותו ברגל בתוך דקות. הקציבו שלוש
    שעות לכיכר, למוזיאון ולקטע מהחומה; מדרגות המגדלים תלולות ולא אחידות, לכן נעלו נעליים נוחות. בסופי
    שבוע מגיעים מטיילי יום מטביליסי, ובימי חול שקט יותר. אם אתם מתכננים לטעום יין קוורי במרתפים, לינו
    כאן ולא תנהגו.
  route: >-
    מטביליסי צאו על S5, כביש קאחתי, מזרחה, דרך סאגארג'ו ובדיאאורי. אחרי כ-96 ק"מ, בצ'לאובני, פנו ימינה
    ל-Sh40 וטפסו את חמישה-עשר הקילומטרים האחרונים דרך נוקריאני עד סיגנאגי — כ-110 ק"מ בסך הכול ושעה וחמישים
    דקות. הכביש אספלט כל הדרך ורכב חסכוני קטן מספיק בהחלט, אף שבעלייה האחרונה הכביש נעשה צר ומתפתל בעיקולים
    חדים והסמטאות בעיר תלולות. תדלוק קל בסאגארג'ו ולאורך הכביש הראשי. מנזר בודבה הוא סטייה של שני קילומטרים
    מהעיר, לכן שלבו אותו באותה נסיעה.
ar:
  name: سيغناغي
  short: >-
    ملجأ الملك إيريكله المحاط بسور على تلة بارتفاع 790 مترًا: أبراج، أزقة مرصوفة بالحصى، ووادي ألازاني
    كله يتكشّف تحت القوقاز.
  body: >-
    **يستمد سيغناغي اسمه من كلمة تركية تعني «الملجأ»، وهذا بالضبط ما بُني لأجله.** في عام 1762 شيّد الملك
    إيريكله الثاني قلعة جديدة على أنقاض قلعة أقدم، فأحاط بسورٍ نحو أربعين هكتارًا من التلة حتى تستطيع
    قرى كيزيقي الالتجاء إليه عندما ينحدر الغزاة من داغستان. يمتد السور نحو أربعة كيلومترات؛ ووفق الموسوعة
    الجورجية له ثلاثة وعشرون برجًا وخمس بوابات، وتقول الروايات المتوارثة إن كل برج كان يحمل اسم القرية
    التي يحميها.


    في عهد إيريكله كانت هذه مدينة ملكية ومركز كيزيقي، يحكمها مورافي الملك. وجد تعداد عام 1770 هنا مئة
    أسرة، جميعها تقريبًا تجار وحرفيون، وشكّلت التجارة وجه المدينة لزمن طويل: في عام 1834 سجّل الرحالة
    دوبوا دي مونبيريه في سيغناغي 3200 نسمة، منهم 2851 أرمنيًا. وكنيسة القديس جورج، التي بُنيت عام 1793
    كنيسةً أرمنية، تخدم اليوم المؤمنين الأرثوذكس الجورجيين.


    تقع المدينة على ارتفاع نحو 790 مترًا، على المنحدرات الجنوبية الشرقية لسلسلة غومبوري. من حافتها الشرقية
    تنحدر الأرض إلى وادي ألازاني، أرضية مسطحة وخضراء من الكروم والحقول، ووراءها ينتصب القوقاز الكبير كجدار
    واحد. أعادت ترميمات عام 2007 إلى المركز واجهاته الباستيلية، وشرفاته الخشبية المنقوشة، وأزقته المرصوفة؛
    يجد بعضهم ذلك مُرتَّبًا أكثر من اللازم، لكن المشهد لم يحتج قط إلى ترميم.


    وفي الساحة، أعاد متحف سيغناغي فتح أبوابه في العام نفسه؛ وتُعلَّق في قاعاته ست عشرة لوحة لنيكو بيروسماني،
    الذي وُلد في ميرزاآني القريبة. يأتي كثير من الأزواج إلى هنا لمجرد عقد قرانهم، ولهذا يسمّي الجورجيون
    سيغناغي «مدينة الحب». وعلى مسافة كيلومترين يقف بودبي، دير القديسة نينو.


    تمشَّ على السور في نهاية اليوم، حين يكون الوادي قد اكتسى بالأزرق ولا تزال ثلوج القوقاز وحدها تحتفظ
    بضوء الشمس.
  tip: >-
    تعالَ بعد الغداء وابقَ حتى الغروب؛ والأفضل أن تبيت هنا وترى الوادي يمتلئ بضباب الصباح. اترك السيارة
    عند حافة المركز القديم لا في أزقته — فالنواة القديمة صغيرة بما يكفي لعبورها سيرًا في دقائق. خصّص ثلاث
    ساعات للساحة والمتحف وجزء من السور؛ ودرجات الأبراج شديدة الانحدار وغير منتظمة، فارتدِ حذاءً مناسبًا.
    يكثر في عطلات نهاية الأسبوع زوّار الرحلات اليومية من تبليسي، وأيام الأسبوع أهدأ. إن كنت تنوي تذوّق
    نبيذ الكفيفري في الأقبية، فابقَ ليلًا ولا تقُد السيارة.
  route: >-
    من تبليسي اسلك S5، طريق كاخيتي السريع، شرقًا عبر ساغاريجو وباديائوري. بعد نحو 96 كم، عند تشالاوباني،
    انعطف يمينًا إلى Sh40 وتسلّق الكيلومترات الخمسة عشر الأخيرة عبر نوكرياني إلى سيغناغي — نحو 110 كم
    إجمالًا وساعةٍ وخمسين دقيقة. الطريق مُعبّد بالكامل وسيارة اقتصادية كافية تمامًا، مع أن الطريق يضيق
    في الصعود الأخير وتكثر منعطفاته الحادة وأزقة المدينة شديدة الانحدار. الوقود متوفر بسهولة في ساغاريجو
    وعلى طول الطريق السريع. ولا يبعد دير بودبي عن المدينة سوى كيلومترين، فأدرجه في الرحلة نفسها.
