ka:
  name: სიღნაღი
  short: ალაზნის ველზე გადმომდგარი პატარა ქალაქი XVIII საუკუნის გალავნით და კახეთის ყველაზე ცნობილი ხედით.
  body: >-
    სიღნაღი ქედზეა გაშენებული, ალაზნის ველიდან დაახლოებით ოთხასი მეტრით მაღლა. სწორედ ამ განლაგებამ გადააქცია
    იგი კახეთის მთავარ საოთახე ბარათად: ქალაქის ნებისმიერი აღმოსავლეთის კიდიდან თვალწინ იშლება ბრტყელი,
    მწვანე ვაკე და მის იქით კავკასიონის კედელი. ქალაქი პატარაა — მოსახლეობა ორ ათასსაც არ აღწევს — და
    2000-იან წლებში მთლიანად გარემონტდა: კრამიტის სახურავები, მოჩუქურთმებული აივნები, ქვაფენილი ქუჩები.


    ქალაქის მთავარი ისტორიული ძეგლი გალავანია. ერეკლე მეორემ იგი 1770-იან წლებში ააშენა, რათა შემოგარენის
    სოფლების მოსახლეობას ლეკიანობის დროს თავშესაფარი ჰქონოდა. კედლის სიგრძე ოთხ კილომეტრს აღწევს, შემორჩენილია
    ოცდასამი კოშკი — ეს საქართველოში იშვიათი მთლიანობაა. ორი მონაკვეთი ხელმისაწვდომია: კიბეები ზემოთ,
    თავად გალავანზე გაგიყვანთ და კოშკებიდან პანორამა ბევრად უკეთესია, ვიდრე ქუჩის დონიდან.


    მოედანთან მდებარეობს სიღნაღის მუზეუმი — რეგიონის არქეოლოგია ქვედა სართულზე და ნიკო ფიროსმანის ტილოების
    დარბაზი ზემოთ; მხატვარი აქვე, მირზაანში დაიბადა. ცენტრში მჭიდროდაა ღვინის ბარები და საოჯახო მარნები,
    სადაც ქვევრის ღვინოს ჭიქებით ასხამენ. აქვეა ის პატარა ქორწინების სახლი, რომელმაც ქალაქს „სიყვარულის
    ქალაქის“ სახელი მოუტანა.
  tip: >-
    საუკეთესო დროა შუადღის შემდეგ ჩასვლა და მზის ჩასვლის დახვედრა — ალაზნის ხედი მაშინ ყველაზე ლამაზია,
    როცა კავკასიონს ბოლო სინათლე ეცემა. მანქანა დატოვეთ მოედნის ქვემოთ ან ჭავჭავაძის ქუჩაზე; ცენტრი ფეხით
    სამი წუთია. სამი საათი ეყოფა მოედანს, მუზეუმს და გალავნის ერთ მონაკვეთს, კოშკებზე ასვლა კი მეტ დროს
    წაიღებს — საფეხურები არათანაბარია, ფეხსაცმელი მოხერხებული გეცვათ. კაფე, ბანკომატი და ტუალეტი მოედანზევეა.
  route: >-
    თბილისიდან კახეთის გზატკეცილით გადით საგარეჯოსა და ბადიაურის გავლით, შემდეგ განაგრძეთ წნორამდე და
    მარცხნივ, მითითებული მოსახვევით ასვლა დაიწყეთ — სულ 110 კმ, დაახლოებით საათნახევარი და ოცი წუთი. ასფალტი
    ბოლომდე კარგია, ეკონომ კლასის მანქანა სავსებით საკმარისია, თუმცა ბოლო ასვლაზე სერპანტინი ვიწროა. საწვავი
    უპრობლემოდ ავსებთ საგარეჯოში, გურჯაანსა და წნორში. დაბრუნება შეიძლება თელავითა და გომბორის უღელტეხილით
    — უფრო ლამაზია, მაგრამ ნახევარი საათით მეტი და ზამთარში თოვლის დროს ხურავენ.
en:
  name: Sighnaghi
  short: A small walled town on a ridge above the Alazani Valley, with the most photographed view in Kakheti.
  body: >-
    Sighnaghi stands on a ridge some four hundred metres above the floor of the Alazani Valley, and that
    position is the whole point of the place. From any eastern edge of town the ground drops away and
    a flat green plain runs out to the wall of the Greater Caucasus — on a clear day the snow line is
    sharp enough to trace with a finger. The town itself is tiny, well under two thousand residents, and
    was rebuilt in the mid-2000s with red-tiled roofs, carved wooden balconies and cobbled lanes. Some
    travellers find the restoration a little too tidy; most simply enjoy it.


    The serious monument here is the fortress wall. King Erekle II had it built in the 1770s as a refuge
    for the surrounding villages during raids from the north-east. Roughly four kilometres of curtain
    wall survive along with twenty-three towers, which makes it one of the most complete defensive circuits
    in Georgia. Two sections are open: stairways lead up onto the rampart, and the tower walks give a
    far better panorama than street level does.


    On the main square, the Sighnaghi Museum holds regional archaeology downstairs and a room of **Niko
    Pirosmani** canvases upstairs — the painter was born nearby at Mirzaani. Around the square are wine
    bars and family cellars pouring qvevri wine by the glass, plus the small marriage house that earned
    the town its "city of love" nickname.
  tip: >-
    Arrive in the afternoon and stay for sunset — the Alazani view is at its best when the last light
    hits the Caucasus. Park below the main square or along Chavchavadze Street; the centre is small enough
    to cross on foot in minutes. Three hours covers the square, the museum and one stretch of wall, but
    climbing the towers takes longer and the steps are uneven, so wear proper shoes. Cafés, ATMs and toilets
    are all on or beside the square.
  route: >-
    Leave Tbilisi on the Kakheti Highway through Sagarejo and Badiauri, carry on past Tsnori, then take
    the signed left turn and climb — about 110 km and one hour fifty in total. The surface is asphalt
    the whole way and an economy car is entirely adequate, though the final ascent is a narrow series
    of switchbacks. Fuel is easy in Sagarejo, Gurjaani and Tsnori. You can return over the Gombori Pass
    via Telavi for a more scenic drive; it costs roughly half an hour more and closes in heavy snow.
ru:
  name: Сигнахи
  short: Небольшой городок на гребне над Алазанской долиной с крепостной стеной XVIII века и лучшим видом
    Кахетии.
  body: >-
    Сигнахи стоит на гребне примерно в четырёхстах метрах над дном Алазанской долины, и именно в этом
    весь его смысл. С любого восточного края городка земля обрывается вниз, а дальше до самого Кавказского
    хребта тянется плоская зелёная равнина — в ясный день линию снегов видно совершенно отчётливо. Сам
    город крошечный, жителей меньше двух тысяч, и в середине 2000-х его целиком отреставрировали: черепичные
    крыши, резные деревянные балконы, мощёные улочки. Кому-то реставрация кажется чересчур аккуратной,
    большинству она просто нравится.


    Главный исторический памятник здесь — крепостная стена. Ираклий II построил её в 1770-х годах как
    убежище для жителей окрестных сёл во время набегов. Сохранилось около четырёх километров стены и двадцать
    три башни, что для Грузии редкая полнота. Два участка открыты для подъёма: лестницы выводят прямо
    на боевой ход, и панорама с башен несравнимо лучше, чем с уровня улицы.


    На главной площади работает музей Сигнахи: внизу археология региона, наверху зал полотен **Нико Пиросмани**
    — художник родился неподалёку, в Мирзаани. Вокруг площади плотно стоят винные бары и семейные марани,
    где квеври-вино наливают бокалами, а рядом тот самый маленький дом бракосочетаний, из-за которого
    город прозвали «городом любви».
  tip: >-
    Приезжайте во второй половине дня и оставайтесь до заката — вид на Алазани лучше всего, когда последний
    свет ложится на Кавказский хребет. Машину оставьте ниже главной площади или на улице Чавчавадзе, центр
    пересекается пешком за несколько минут. Трёх часов хватит на площадь, музей и один участок стены;
    подъём на башни займёт больше, ступени неровные, обувь нужна нормальная. Кафе, банкоматы и туалеты
    — прямо у площади.
  route: >-
    Из Тбилиси выезжайте по Кахетинскому шоссе через Сагареджо и Бадиаури, минуйте Цнори и сверните налево
    по указателю на подъём — всего около 110 км и час пятьдесят. Асфальт хороший на всём протяжении, машины
    эконом-класса вполне достаточно, хотя финальный подъём идёт узким серпантином. Заправиться просто
    в Сагареджо, Гурджаани и Цнори. Возвращаться можно через Телави и Гомборский перевал: красивее, но
    примерно на полчаса дольше, а в сильный снегопад перевал закрывают.
fa:
  name: سیغناغی
  short: شهرک کوچک حصارداری روی ستیغی بالای درهٔ آلازانی، با پرعکس‌ترین منظرهٔ کاختی.
  body: >-
    سیغناغی روی ستیغی نشسته است، چهارصد متری بالاتر از کف درهٔ آلازانی، و تمام معنای این جا در همین موقعیت
    است. از هر لبهٔ شرقی شهرک، زمین ناگهان فرو می‌ریزد و دشتی سبز و مسطح تا دیوارهٔ قفقاز بزرگ کشیده می‌شود
    — در روز صاف خط برف چنان تیز است که می‌شود با انگشت دنبالش کرد. خود شهرک بسیار کوچک است، به‌روشنی
    کمتر از دو هزار نفر جمعیت دارد، و در میانهٔ دههٔ 2000 با بام‌های سفالی سرخ، بالکن‌های چوبی کنده‌کاری‌شده
    و کوچه‌های سنگفرش بازسازی شد. بعضی مسافران این بازسازی را کمی زیادی مرتب می‌دانند؛ بیشترشان فقط از
    آن لذت می‌برند.


    بنای جدی اینجا دیوار دژ است. ارکله دوم آن را در دههٔ 1770 ساخت تا در زمان تاخت‌وتاز از شمال‌شرق پناهگاه
    روستاهای اطراف باشد. نزدیک چهار کیلومتر از حصار همراه با بیست‌وسه برج باقی مانده است، و همین آن را
    به یکی از کامل‌ترین حلقه‌های دفاعی گرجستان بدل می‌کند. دو بخش آن باز است: پلکان‌ها شما را روی بارو
    می‌برند و راه رفتن روی برج‌ها منظره‌ای به‌مراتب بهتر از سطح خیابان می‌دهد.


    در میدان اصلی، موزهٔ سیغناغی در طبقهٔ پایین باستان‌شناسی منطقه را نگه داشته و در طبقهٔ بالا اتاقی
    از بوم‌های **نیکو پیروسمانی** — نقاشی که همین نزدیکی، در میرزاانی، به دنیا آمد. گرد میدان بارهای شراب
    و سردابه‌های خانوادگی‌اند که شراب کوِوری را لیوانی می‌ریزند، و نیز آن دفتر ازدواج کوچک که لقب «شهر
    عشق» را برای این شهرک ساخت.
  tip: >-
    بعدازظهر برسید و تا غروب بمانید — منظرهٔ آلازانی وقتی بهترین حالت را دارد که آخرین نور روی قفقاز بنشیند.
    خودرو را پایین‌تر از میدان اصلی یا در امتداد خیابان چاوچاوادزه پارک کنید؛ مرکز آن‌قدر کوچک است که
    در چند دقیقه پیاده از این سر به آن سر می‌رسید. سه ساعت میدان، موزه و یک بخش از حصار را پوشش می‌دهد،
    اما بالا رفتن از برج‌ها بیشتر طول می‌کشد و پله‌ها ناهموارند، پس کفش مناسب بپوشید. کافه‌ها، خودپردازها
    و سرویس‌های بهداشتی همه روی میدان یا کنار آن‌اند.
  route: >-
    از تفلیس با بزرگراه کاختی از ساگارجو و بادیااوری بیرون بروید، از تسنوری هم بگذرید و بعد سر تابلو به
    چپ بپیچید و بالا بروید — روی هم حدود 110 کیلومتر و یک ساعت و پنجاه دقیقه. سطح جاده در تمام مسیر آسفالت
    است و خودروی اقتصادی کاملاً کافی، هرچند سربالایی پایانی رشته‌ای از پیچ‌های تند و باریک است. سوخت در
    ساگارجو، گورجاانی و تسنوری به‌راحتی پیدا می‌شود. می‌توانید برای مسیری زیباتر از راه گردنهٔ گومبوری
    و تلاوی برگردید؛ این راه تقریباً نیم ساعت بیشتر وقت می‌گیرد و در برف سنگین بسته می‌شود.
he:
  name: סיגנאגי
  short: עיירה קטנה מוקפת חומה על רכס מעל עמק אלאזני, עם הנוף המצולם ביותר בקחתי.
  body: >-
    סיגנאגי יושבת על רכס כארבע מאות מטרים מעל קרקעית עמק אלאזני, וכל העניין במקום הזה נעוץ במיקום. מכל
    קצה מזרחי של העיירה הקרקע צונחת ומישור ירוק ושטוח נמתח עד לחומת הקווקז הגדול — ביום בהיר קו השלג חד
    דיו כדי לעקוב אחריו באצבע. העיירה עצמה זעירה, פחות מאלפיים תושבים בבירור, והיא נבנתה מחדש באמצע שנות
    ה-2000 עם גגות רעפים אדומים, מרפסות עץ מגולפות וסמטאות מרוצפות אבן. יש נוסעים שמוצאים את השחזור מסודר
    מדי; רובם פשוט נהנים ממנו.


    המונומנט הרציני כאן הוא חומת המבצר. המלך ארקלה השני הקים אותה בשנות ה-1770 כמקלט לכפרי הסביבה בעת
    פשיטות מצפון-מזרח. כארבעה קילומטרים של חומה שרדו יחד עם עשרים ושלושה מגדלים, וזה הופך אותה לאחת ממערכות
    ההגנה השלמות ביותר בגאורגיה. שני קטעים פתוחים למבקרים: מדרגות מעלות אל החומה, וההליכה על המגדלים נותנת
    פנורמה טובה בהרבה מזו שנשקפת מגובה הרחוב.


    בכיכר המרכזית שוכן מוזיאון סיגנאגי, ובו ארכיאולוגיה אזורית בקומה התחתונה וחדר של ציורי **ניקו פירוסמני**
    בקומה העליונה — הצייר נולד בקרבת מקום, במירזאני. סביב הכיכר יש ברי יין ומרתפים משפחתיים שמוזגים יין
    קווברי בכוסות, ולצידם בית הנישואין הקטן שהעניק לעיירה את הכינוי "עיר האהבה".
  tip: >-
    הגיעו אחר הצהריים והישארו לשקיעה — הנוף אל אלאזני במיטבו כשהאור האחרון נוגע בקווקז. החנו מתחת לכיכר
    המרכזית או לאורך רחוב צ'אבצ'אוודזה; המרכז קטן דיו כדי לחצות אותו ברגל בתוך דקות. שלוש שעות מכסות את
    הכיכר, את המוזיאון וקטע חומה אחד, אבל הטיפוס על המגדלים לוקח יותר זמן והמדרגות אינן אחידות, לכן נעלו
    נעליים מתאימות. בתי קפה, כספומטים ושירותים נמצאים כולם על הכיכר או לצידה.
  route: >-
    צאו מטביליסי בכביש קחתי דרך סאגארג'ו ובאדיאורי, המשיכו מעבר לצנורי, ואז פנו שמאלה בשילוט וטפסו — כ-110
    ק״מ ושעה וחמישים דקות בסך הכול. הכביש סלול לכל אורכו ורכב חסכוני מספיק בהחלט, אף שהעלייה האחרונה היא
    סדרה של סיבובי פרסה צרים. דלק אפשר להשיג בקלות בסאגארג'ו, בגורג'אני ובצנורי. אפשר לחזור דרך מעבר גומבורי
    וטלאווי לנסיעה נופית יותר; זה עולה כחצי שעה נוספת והדרך נסגרת בשלג כבד.
ar:
  name: سيغناغي
  short: بلدة صغيرة مسوّرة على تل فوق وادي ألازاني، بأكثر إطلالة مصوَّرة في كاخيتي.
  body: >-
    تقوم سيغناغي على تل يرتفع نحو أربعمئة متر فوق قاع وادي ألازاني، وموقعها هذا هو جوهر المكان كله. فمن
    أي طرف شرقي من البلدة تهبط الأرض فجأة ويمتد سهل أخضر مستوٍ حتى جدار القوقاز الكبرى — وفي يوم صافٍ
    يكون خط الثلج حاداً إلى حد أنك تستطيع تتبعه بإصبعك. والبلدة نفسها صغيرة جداً، وسكانها دون الألفين
    بوضوح، وقد أُعيد بناؤها في منتصف عقد 2000 بأسقف قرميدية حمراء وشرفات خشبية منقوشة وأزقة مرصوفة بالحجر.
    بعض المسافرين يجدون الترميم مرتباً أكثر مما ينبغي؛ ومعظمهم يستمتعون به ببساطة.


    أما المعلم الجاد هنا فهو سور القلعة. بناه الملك إيريكلي الثاني في عقد 1770 ملجأً لقرى الجوار أثناء
    الغارات القادمة من الشمال الشرقي. وقد بقي نحو أربعة كيلومترات من السور مع ثلاثة وعشرين برجاً، وهو
    ما يجعله من أكمل الدارات الدفاعية في جورجيا. ومقطعان منه مفتوحان: تصعد الأدراج إلى أعلى السور، والمشي
    فوق الأبراج يمنح مشهداً بانورامياً أفضل بكثير مما يُرى من مستوى الشارع.


    وفي الساحة الرئيسية يضم متحف سيغناغي آثار الإقليم في الطابق الأسفل، وقاعة من لوحات **نيكو بيروسماني**
    في الطابق الأعلى — وقد وُلد الرسام قريباً من هنا في ميرزاني. وحول الساحة بارات نبيذ وأقبية عائلية
    تصب نبيذ كفيفري بالكأس، وإلى جانبها دار الزواج الصغيرة التي أكسبت البلدة لقب «مدينة الحب».
  tip: >-
    تعال بعد الظهر وابقَ حتى الغروب — فإطلالة ألازاني في أبهى حالاتها حين يلامس الضوء الأخير جبال القوقاز.
    أوقف السيارة أسفل الساحة الرئيسية أو على امتداد شارع تشافتشافادزي؛ فالمركز صغير بما يكفي لعبوره سيراً
    في دقائق. ثلاث ساعات تغطي الساحة والمتحف ومقطعاً واحداً من السور، لكن صعود الأبراج يستغرق وقتاً أطول
    ودرجاته غير متساوية، فالبس حذاءً مناسباً. المقاهي والصرافات ودورات المياه كلها على الساحة أو بجوارها.
  route: >-
    اخرج من تبليسي على طريق كاخيتي السريع عبر ساغاريجو وباديوري، وواصل بعد تسنوري، ثم انعطف يساراً عند
    اللافتة واصعد — نحو 110 كم وساعة وخمسين دقيقة إجمالاً. السطح إسفلت على امتداد الطريق وسيارة اقتصادية
    تكفي تماماً، وإن كان الصعود الأخير سلسلة من المنعطفات الضيقة. والوقود متاح بسهولة في ساغاريجو وغورجاني
    وتسنوري. ويمكنك العودة عبر ممر غومبوري ومروراً بتيلافي لقيادة أجمل منظراً؛ وهو يكلفك نحو نصف ساعة
    إضافية ويُغلق عند تساقط الثلوج الكثيفة.
