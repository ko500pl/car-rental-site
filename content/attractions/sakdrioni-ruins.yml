ka:
  name: საყდრიონის ქარვასლა და სასახლის ნანგრევები
  short: ქვის ქარვასლის ნანგრევი კედლები, თევზის ფხასავით დაწყობილი ქვით — წალკის ზეგნის ძველ სავაჭრო
    გზაზე.
  body: >-
    **საყდრიონის ქარვასლიდან მხოლოდ კედლების ნაშთებიღა დარჩა, მაგრამ ქვა დღესაც თევზის ფხასავით ალაგია
    — ისე, როგორც მშენებლებმა ქარავნით მომავალი მგზავრებისთვის დააწყვეს.**


    წალკის ზეგანი ოდესღაც სავაჭრო გზებზე იდო. განთიადის მახლობლად, თრიალეთის პეტროგლიფებზე ამოკვეთილ აქლემებს
    იმ ქარავნების მოგონებად მიიჩნევენ, საყდრიონის ქარვასლა კი იმავე ამბის მეორე ნახევარია: გზისპირა ქვის
    სასტუმრო, სადაც ვაჭრებსა და მათ პირუტყვს ღამის გათევა შეეძლოთ.


    რაც შემორჩა, ძნელად იკითხება. როგორც ჩანს, ნაგებობა სწორკუთხა იყო და ორ არათანაბარ დარბაზად იყოფოდა
    — პატარა დასავლეთით მდებარეობდა, — და დიდი ბუხარიც ჰქონდა. დღეს ის კერძო მიწაზე, ყოველგვარი კონსერვაციის
    გარეშე დგას და მისი გეგმის ამოცნობა ქვის ნამსხვრევი წყობებით თუ შეიძლება. საიმედო თარიღი გამოქვეყნებული
    არ არის — და ჯობს, ეს პირდაპირ ვთქვათ, ვიდრე ვივარაუდოთ.


    სოფლის სახელი სიტყვა „საყდარს“ უკავშირდება — ასე ეძახდნენ ძველად ეკლესიას; აქ ეკლესიისა და სასახლის
    ნანგრევებსაც ასახელებენ, თუმცა მათი გამოქვეყნებული აღწერილობა ჩვენამდე არ მოსულა.


    მოდით, თუ ზეგანზე უკვე ხართ: ათი წუთი ამ კედლებს შორის, განთიადის აქლემების შემდეგ, ორ უცნაურ ნანახს
    ერთ ამბად აკავშირებს.
  tip: >-
    აქ არც სალარო, არც ნიშანი და არც ბილიკია, ნანგრევები კი კერძო მიწაზე დგას: შესვლამდე სოფელში იკითხეთ,
    ჭიშკარი უკან მიხურეთ და კედლებზე ნუ ახვალთ — ისინი მყიფეა და დაუცველი. საფასური, თუ საერთოდ არსებობს,
    მესაკუთრის გადასაწყვეტია. ნახევარი საათი სავსებით საკმარისია. უსწორმასწორო მიწაზე მყარი ფეხსაცმელი
    გამოგადგებათ. აქ არანაირი ინფრასტრუქტურა არ არის, ამიტომ წალკაში ისადილეთ და საწვავიც იქ ჩაასხით.
    ვიზიტი დაახლოებით 5 კილომეტრში მდებარე ბერთის მონასტერსა და განთიადთან თრიალეთის აქლემიან პეტროგლიფებთან
    ერთად დაგეგმეთ.
  route: >-
    თბილისიდან წყნეთის გავლით შ36 გზაზე (თბილისი — მანგლისი) გადით, შემდეგ შ31-ით მანგლისზე გაიარეთ და
    თრიალეთის ზეგნით წალკამდე მიდით — დაახლოებით 90 კმ ასფალტია, გრძელი აღმართით. წალკიდან შ31-ით წყალსაცავის
    გასწვრივ დასავლეთით განაგრძეთ სოფელ საყდრიონამდე. საყდრიონი თავად შ31-ზე დგას; ნანგრევები სოფელში,
    კერძო მიწაზეა — ადგილობრივებს ჰკითხეთ, ბოლო მონაკვეთი კი რამდენიმე წუთის სავალია ფეხით ან საველე გზით.
    ეკონომ-კლასის მანქანაც საკმარისია. სულ 106 კმ-ია, დაახლოებით 2 საათი. ბოლო ბენზინგასამართი წალკაშია.
en:
  name: Sakdrioni Caravanserai and Palace Ruins
  short: >-
    Broken walls of a stone caravanserai, laid in a fishbone pattern, on the old trade road across the
    Tsalka plateau.
  body: >-
    **Only fragments of the caravanserai at Sakdrioni still stand, but the stones are still laid in the
    fishbone pattern its builders chose for travellers who came by caravan.**


    The Tsalka plateau once lay on trade routes. Rock carvings of camels in the Trialeti petroglyphs near
    Gantiadi are read as a memory of those caravans, and the caravanserai at Sakdrioni is the other half
    of the same story: a stone inn on the road, where merchants and their animals could stop for the night.


    What survives is hard to read. The building seems to have been a rectangle divided into two halls
    of unequal size, the smaller one to the west; somewhere inside was a large fireplace. Today it stands
    on private land with no conservation work, and the plan has to be pieced together from broken courses
    of stone. No reliable date has been published, and we would rather say so than guess.


    The village's name echoes saqdari, an old Georgian word for a church; the ruins of a church and a
    palace are also reported here, though no published description of them has reached us.


    Come if you are already on the plateau: ten minutes among these walls, after the camels at Gantiadi,
    turns two curiosities into one road.
  tip: >-
    There is no ticket office, sign or path, and the ruins stand on private land: ask in the village before
    walking in, close any gate behind you and do not climb the walls, which are fragile and unprotected.
    Fees, if any, are a matter for the owner. Half an hour is plenty. Sturdy shoes help on the uneven
    ground. There are no facilities at all, so eat and fill up in Tsalka. Pair the stop with Berta Monastery,
    about 5 km away, and with the Trialeti camel petroglyphs near Gantiadi.
  route: >-
    Leave Tbilisi through Tskneti on the Sh36 Tbilisi–Manglisi road and continue on the Sh31 through Manglisi
    and across the Trialeti highlands to Tsalka, about 90 km of asphalt with a long climb. From Tsalka
    keep west on the Sh31 along the reservoir to Sakdrioni village. Sakdrioni sits on the Sh31 itself.
    The ruins are on private land in the village, so ask locally, and expect at most a few minutes on
    foot or on a farm lane. An economy car is enough. Allow 106 km and about 2 hours. Last fuel is in
    Tsalka.
ru:
  name: Руины караван-сарая и дворца в Сакдриони
  short: Обломки стен каменного караван-сарая, сложенных ёлочкой, на старом торговом пути через Цалкское
    плато.
  body: >-
    **От караван-сарая в Сакдриони уцелели лишь фрагменты, но камни и сейчас лежат ёлочкой — так, как
    уложили их строители для путников, приходивших с караванами.**


    Когда-то Цалкское плато лежало на торговых путях. Высеченных на скалах верблюдов среди Триалетских
    петроглифов у Гантиади считают памятью о тех караванах, а караван-сарай в Сакдриони — вторая половина
    той же истории: каменный постоялый двор у дороги, где купцы и их животные могли остановиться на ночь.


    То, что сохранилось, читается с трудом. Судя по всему, здание было прямоугольным и делилось на два
    неравных зала — меньший на западе; где-то внутри был большой очаг. Сегодня оно стоит на частной земле,
    никакой консервации здесь не проводилось, и план приходится восстанавливать по разрушенным рядам кладки.
    Надёжной датировки не опубликовано, и мы предпочитаем сказать об этом прямо, чем гадать.


    Название села перекликается со словом «сакдари» — так в старину по-грузински называли церковь; сообщают,
    что здесь есть также руины церкви и дворца, хотя опубликованного их описания нам найти не удалось.


    Заезжайте, если вы уже на плато: десять минут среди этих стен после верблюдов Гантиади превращают
    две диковины в одну дорогу.
  tip: >-
    Здесь нет ни кассы, ни указателя, ни тропы, а руины стоят на частной земле: прежде чем идти, спросите
    в селе, закрывайте за собой калитки и не забирайтесь на стены — они хрупкие и ничем не защищены. Плата,
    если она и есть, — на усмотрение владельца. Получаса более чем достаточно. Пригодится крепкая обувь:
    земля неровная. Никаких удобств нет, так что поешьте и заправьтесь в Цалке. Совместите остановку с
    монастырём Берта, примерно в 5 км отсюда, и с триалетскими петроглифами-верблюдами у Гантиади.
  route: >-
    Выезжайте из Тбилиси через Цкнети по дороге Sh36 Тбилиси — Манглиси и продолжайте по Sh31 через Манглиси
    и Триалетское нагорье до Цалки — около 90 км по асфальту с долгим подъёмом. От Цалки держитесь Sh31
    на запад вдоль водохранилища до села Сакдриони. Сакдриони стоит прямо на Sh31. Руины — на частной
    земле в селе, так что спросите у местных; до них самое большее несколько минут пешком или по полевой
    дороге. Машины эконом-класса вполне достаточно. Закладывайте 106 км и около 2 часов. Последняя заправка
    — в Цалке.
fa:
  name: ویرانه‌های کاروانسرا و کاخ ساکدریونی
  short: دیوارهای شکستهٔ کاروانسرایی سنگی با چینشی جناغی، بر راه بازرگانی کهن در فلات تسالکا.
  body: >-
    **از کاروانسرای ساکدریونی تنها پاره‌هایی بر جا مانده است، اما سنگ‌ها هنوز به همان آرایش جناغی چیده
    شده‌اند که سازندگانش برای مسافرانِ همراه کاروان برگزیدند.**


    فلات تسالکا روزگاری بر سر راه‌های بازرگانی بود. نقش شترهایی را که در سنگ‌نگاره‌های تریالتی نزدیک گانتیادی
    بر صخره کنده شده‌اند یادگار همان کاروان‌ها می‌دانند، و کاروانسرای ساکدریونی نیمهٔ دیگر همین داستان
    است: مهمان‌سرایی سنگی کنار راه که بازرگانان و چارپایانشان می‌توانستند شب را در آن بگذرانند.


    آنچه مانده به‌دشواری خوانده می‌شود. چنین می‌نماید که بنا مستطیل بوده و به دو تالار نابرابر تقسیم می‌شده،
    تالار کوچک‌تر در غرب، و اجاقی بزرگ داشته است. امروز بر زمینی خصوصی و بی هیچ مرمتی ایستاده و نقشه‌اش
    را باید از رج‌های شکستهٔ سنگ بازسازی کرد. تاریخ‌گذاری معتبری منتشر نشده است و ترجیح می‌دهیم همین را
    بگوییم تا اینکه حدس بزنیم.


    نام روستا پژواک واژهٔ «ساقداری» است، واژه‌ای کهن در زبان گرجی به معنای کلیسا؛ گفته می‌شود ویرانه‌های
    یک کلیسا و یک کاخ نیز اینجا هست، هرچند هیچ توصیف منتشرشده‌ای از آن‌ها به دست ما نرسیده است.


    اگر به هر حال بر فلات هستید سری بزنید: ده دقیقه میان این دیوارها، پس از شترهای گانتیادی، دو چیز شگفت
    را به یک راه بدل می‌کند.
  tip: >-
    نه باجهٔ بلیت هست، نه تابلو، نه کوره‌راه، و ویرانه‌ها بر زمینی خصوصی‌اند: پیش از وارد شدن در روستا
    اجازه بگیرید، هر دروازه‌ای را پشت سرتان ببندید و از دیوارها بالا نروید، چون شکننده و بی‌حفاظ‌اند.
    ورودیه، اگر باشد، با مالک است. نیم ساعت بس است. کفش محکم روی زمین ناهموار به کار می‌آید. هیچ امکاناتی
    وجود ندارد، پس غذا و سوخت را در تسالکا تأمین کنید. این توقف را با صومعهٔ برتا، حدود ۵ کیلومتر آن‌سوتر،
    و سنگ‌نگاره‌های شتر تریالتی نزدیک گانتیادی همراه کنید.
  route: >-
    از راه تسکنتی و جادهٔ Sh36 تفلیس–مانگلیسی از تفلیس بیرون بروید و با Sh31 از مانگلیسی و ارتفاعات تریالتی
    تا تسالکا ادامه دهید؛ حدود ۹۰ کیلومتر آسفالت با سربالایی‌ای طولانی. از تسالکا در Sh31 به سوی غرب و
    در امتداد آبگیر تا روستای ساکدریونی بروید. ساکدریونی درست کنار خود Sh31 است. ویرانه‌ها در زمینی خصوصی
    درون روستا قرار دارند، پس از اهالی بپرسید؛ رسیدن به آن‌ها، پیاده یا از راهی کشاورزی، حداکثر چند دقیقه
    طول می‌کشد. خودروی اقتصادی کافی است. ۱۰۶ کیلومتر و حدود ۲ ساعت در نظر بگیرید. آخرین پمپ‌بنزین در تسالکا
    است.
he:
  name: חורבות הקרוונסראי והארמון בסקדריוני
  short: שרידי חומות של קרוונסראי מאבן, בבנייה בדוגמת אדרה (עצם דג), על דרך המסחר העתיקה שחוצה את רמת
    צאלקה.
  body: >-
    **מהקרוונסראי בסקדריוני נותרו רק שברים, אבל האבנים עדיין מונחות בדוגמת עצם הדג שבחרו הבונים בשביל
    נוסעים שהגיעו בשיירות.**


    רמת צאלקה שכנה פעם על נתיבי מסחר. גמלים החקוקים בסלע בין פטרוגליפי טריאלטי שליד גנטיאדי נחשבים לזכר
    של אותן שיירות, והקרוונסראי בסקדריוני הוא החצי השני של אותו סיפור: אכסניית אבן לצד הדרך, שבה יכלו
    סוחרים ובהמותיהם לעצור ללילה.


    מה ששרד קשה לפענוח. נראה שהמבנה היה מלבני ומחולק לשני אולמות שאינם שווים בגודלם, הקטן שבהם במערב,
    ובמבנה הייתה אח גדולה. כיום הוא עומד על קרקע פרטית ללא שום עבודות שימור, ואת תוכניתו יש להרכיב מנדבכי
    אבן שבורים. לא פורסם שום תיארוך אמין, ואנחנו מעדיפים לומר זאת מאשר לנחש.


    שם הכפר מהדהד את המילה "סקדארי", מילה גאורגית עתיקה שפירושה כנסייה; מדווחים שיש כאן גם חורבות של כנסייה
    ושל ארמון, אם כי שום תיאור שלהן שפורסם לא הגיע לידינו.


    בואו אם אתם כבר על הרמה: עשר דקות בין החומות האלה, אחרי הגמלים של גנטיאדי, הופכות שני פלאים קטנים
    לדרך אחת.
  tip: >-
    אין כאן קופה, שלט או שביל, והחורבות עומדות על קרקע פרטית: שאלו בכפר לפני שאתם נכנסים, סגרו כל שער
    אחריכם ואל תטפסו על החומות, שהן שבירות ואינן מוגנות. דמי כניסה, אם יש, נתונים לשיקול הבעלים. חצי שעה
    די והותר. נעליים יציבות יעזרו על הקרקע הלא אחידה. אין כאן שום מתקנים, אז אכלו ותדלקו בצאלקה. שלבו
    את העצירה עם מנזר ברטה, כ-5 ק״מ משם, ועם פטרוגליפי הגמלים של טריאלטי ליד גנטיאדי.
  route: >-
    צאו מטביליסי דרך צקנטי בכביש Sh36 טביליסי–מנגליסי, והמשיכו בכביש Sh31 דרך מנגליסי ורמות טריאלטי עד
    צאלקה – כ-90 ק״מ של אספלט עם עלייה ארוכה. מצאלקה המשיכו מערבה בכביש Sh31 לאורך המאגר עד הכפר סקדריוני.
    סקדריוני שוכן על כביש Sh31 עצמו. החורבות נמצאות על קרקע פרטית בכפר, אז שאלו את המקומיים; מדובר לכל
    היותר בכמה דקות ברגל או בדרך שדה. רכב מקטגוריית אקונומי מספיק. הקצו 106 ק״מ וכשעתיים. הדלק האחרון
    בצאלקה.
ar:
  name: أطلال خان القوافل والقصر في ساكدريوني
  short: جدران متهدّمة لخان قوافل حجري، رُصّت حجارته بنمط عظم السمكة، على طريق التجارة القديم عبر هضبة
    تسالكا.
  body: >-
    **لم يبقَ من خان القوافل في ساكدريوني إلا شذرات، لكن حجارته ما زالت مرصوفة بنمط عظم السمكة الذي اختاره
    بناته للمسافرين القادمين مع القوافل.**


    كانت هضبة تسالكا في الماضي على طرق التجارة. ويُقرأ نقش الجمال المحفور في الصخر ضمن نقوش تريالتي الصخرية
    قرب غانتيادي ذكرى لتلك القوافل، أما خان ساكدريوني فهو النصف الآخر من الحكاية نفسها: نُزُل حجري على
    الطريق يبيت فيه التجار ودوابهم ليلتهم.


    ما بقي عسير القراءة. يبدو أن المبنى كان مستطيلاً ينقسم إلى قاعتين غير متساويتين، أصغرهما في الغرب،
    وكان في المبنى موقد كبير. واليوم يقوم على أرض خاصة بلا أي أعمال صون، ولا يُستعاد مخططه إلا من صفوف
    حجارة متكسرة. لم يُنشر تأريخ موثوق، ونؤثر أن نقول ذلك صراحة على أن نخمّن.


    يتردد في اسم القرية صدى كلمة «ساقداري»، وهي كلمة جورجية قديمة تعني الكنيسة؛ ويُذكر أن هنا أيضاً أطلال
    كنيسة وقصر، وإن لم يصلنا أي وصف منشور لها.


    تعالَ إن كنت على الهضبة أصلاً: عشر دقائق بين هذه الجدران، بعد جمال غانتيادي، تجعل من أعجوبتين صغيرتين
    طريقاً واحداً.
  tip: >-
    لا شباك تذاكر ولا لافتة ولا درب، والأطلال على أرض خاصة: استأذن في القرية قبل الدخول، وأغلق كل بوابة
    خلفك، ولا تتسلق الجدران فهي هشة وغير محمية. أما الرسوم، إن وُجدت، فأمرها للمالك. نصف ساعة تكفي وتزيد.
    والحذاء المتين مفيد على الأرض الوعرة. لا مرافق على الإطلاق، فتناول طعامك وتزوّد بالوقود في تسالكا.
    واجمع هذه الوقفة مع دير بيرتا على بعد نحو 5 كم، ومع نقوش الجمال في تريالتي قرب غانتيادي.
  route: >-
    اخرج من تبليسي عبر تسكنيتي على الطريق Sh36 تبليسي–مانغليسي، وتابع على الطريق Sh31 عبر مانغليسي ومرتفعات
    تريالتي حتى تسالكا، نحو 90 كم من الإسفلت مع صعود طويل. ومن تسالكا ابقَ على الطريق Sh31 غرباً بمحاذاة
    الخزان حتى قرية ساكدريوني. تقع ساكدريوني على الطريق Sh31 نفسه. والأطلال على أرض خاصة داخل القرية،
    فاسأل أهلها؛ ولن يستغرق الوصول إليها أكثر من بضع دقائق سيراً أو عبر درب زراعي. وتكفي سيارة اقتصادية.
    احسب 106 كم ونحو ساعتين. آخر محطة وقود في تسالكا.
