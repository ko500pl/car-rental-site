ka:
  name: კუს ტბა და ვაკის პარკი
  short: >-
    მეწყრის ნაშიერი ტბა ვაკის თავზე, ფიჭვნარიან ფერდობზე: ექვსი წუთი საბაგიროთი და ქალაქის პაპანაქება
    ქვემოთ რჩება.
  body: >-
    **კუს ტბა მეწყერმა გააჩინა, თბილისმა კი დიდი ხანია საკუთარ ეზოდ აქცია.** პატარა, თავთხელი ტბა, რომელსაც
    ძველად ქორქის ტბას ეძახდნენ, მთაწმინდის ქედის ჩრდილო კალთაზე, მცირე ტაფობშია ჩაწოლილი, ზღვის დონიდან
    686 მეტრზე. მას ვარაზისხევის წყალი, წვიმა და მიწისქვეშა წყლები ასაზრდოებს. ყველაზე ღრმა ადგილასაც
    ორნახევარ მეტრს ოდნავ თუ აჭარბებს და უქარო დილით მთელ ფიჭვნარიან ფერდობს თავდაყირა ირეკლავს.


    ქვემოთ ვაკის პარკი იშლება, 1946 წელს გახსნილი: წითელქვიშიანი ხეივნები, შადრევნების კასკადი და ფართო
    კიბე, რომელიც ქედზე, მეორე მსოფლიო ომის მემორიალამდე ადის. ქალაქსა და ტბას ბაგირგზა ჯერ კიდევ XX საუკუნის
    მეორე ნახევარში დააკავშირა და 2009 წლამდე მუშაობდა. 2016 წელს ახალი საბაგირო გაიხსნა: ორი გონდოლა,
    თითოში ათი-თორმეტი მგზავრი. ჭავჭავაძის გამზირიდან ტბამდე დაახლოებით ექვსი წუთია და ამ ხნის განმავლობაში
    ვაკის სახურავები ფეხქვეშ ნელ-ნელა იძირება.


    ზემოთ ცხოვრება სტუმრის კი არა, თბილისელის რიტმს მიჰყვება. ნაპირის ბილიკზე, რომელიც ტბას კილომეტრზე
    ოდნავ ნაკლებ მანძილზე უვლის გარს, დარბიან; ოჯახები ნავებით სეირნობენ; სიგრილის მოახლოებასთან ერთად
    კაფეების ტერასები ივსება. იმავე ფერდობზე, ცოტა მოშორებით, ეთნოგრაფიული მუზეუმი ღია ცის ქვეშ მთელი
    ქვეყნის გლეხურ სახლებს ერთ ბორცვზე უყრის თავს.


    ერთი პატარა ამბავი კარგად აჩენს, როგორ უფრთხილდება ქალაქი ამ ადგილს. 2016 წელს, ზიკას ვირუსის გადამტანი
    კოღოების წინააღმდეგ, „საქართველოს მეთევზეთა კლუბის“ წევრებმა სამინისტროსთან გაფორმებული მემორანდუმით
    აბაშიდან გამბუზია, კოღოების მჭამელი პაწია თევზი, გადმოასახლეს და ტბაში გაუშვეს.


    მოდით დღის ბოლო საათში. წყალი სპილენძისფრად იფერება, ქალაქი ამოისუნთქავს და მიხვდებით, რატომ ინახავს
    თბილისი ამ ტბას საკუთარი თავისთვის.
  tip: >-
    ტბის გარშემო სეირნობა უფასოა, საბაგირო ფასიანია. ივლის-აგვისტოს საღამოობით, ხუთი საათიდან, ტერასები
    ივსება და პატარა სადგომი მანქანებს ვეღარ იტევს: ან ოთხ საათამდე ამოდით, ან მანქანა ქვემოთ დატოვეთ
    და გონდოლით ამოდით. ზაფხულში პატარა პლაჟი მუშაობს და ხალხი ბანაობს, მაგრამ ეს თავთხელი, ნაკადულით
    საზრდოებული ტბაა, ასე რომ, წყალი თავად შეაფასეთ. ქედზე ქვემოთა ქუჩებთან შედარებით შესამჩნევად გრილა
    და ქარიანია, ამიტომ საღამოსთვის თბილი რამ წამოიღეთ. ტუალეტი და საჭმელი კაფეებშია. გონდოლები და სადგურები
    ეტლით მოსარგებლეებისთვისაა მოწყობილი, ამიტომ ბავშვის ეტლითაც საბაგირო ყველაზე მოსახერხებელი გზაა.
  route: >-
    თავისუფლების მოედნიდან ჭავჭავაძის გამზირზე გადით და ვაკის გავლით დასავლეთისკენ, პარკამდე იარეთ. აქ
    არჩევანი თქვენზეა: ან მანქანა ქვედა სადგურის მახლობლად, ქუჩაზე დააყენეთ და გონდოლით ადით, ან გააგრძელეთ
    სვლა კლაკნილი ასფალტის გზით, რომელიც პირდაპირ ტბამდე ადის — ცენტრიდან დაახლოებით 11 კილომეტრი და სულ
    ოციოდე წუთი. გზა ვიწროა და ზაფხულის საღამოობით გზისპირას გაჩერებული მანქანები გზის დათმობას ართულებს.
    ასფალტი ბოლომდეა; მოყინულ ამინდში მოსახვევებზე ნელა იარეთ, თუმცა სრული ამძრავი საჭირო არ არის. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია, ბენზინგასამართი სადგურები კი ვაკეში ბევრია.
en:
  name: Turtle Lake and Vake Park
  short: >-
    A landslide pond on a pine ridge above Vake, six minutes up by gondola: the place Tbilisi goes when
    the streets below start to bake.
  body: >-
    **Turtle Lake was made by a landslide, and Tbilisi has treated it as its back garden ever since.**
    The small, shallow lake, known by the older name Korki, lies in a hollow on the northern slope of
    the Mtatsminda ridge, 686 metres above sea level, fed by the Varaziskhevi stream, by rain and by groundwater.
    Even at its deepest it is little more than two and a half metres, and on a windless morning it holds
    the whole pine-dark slope upside down.


    Below it spreads Vake Park, opened in 1946: red-sand alleys, a cascade of fountains and a broad staircase
    climbing to the Second World War memorial on the ridge. A cable car first linked the city to the lake
    in the second half of the twentieth century and ran until 2009. In 2016 a new ropeway opened: two
    gondolas of ten or twelve people each, rising from Chavchavadze Avenue in about six minutes while
    the roofs of Vake sink beneath your shoes.


    Up top the rhythm is local rather than touristic. Runners circle the shore path, a little under a
    kilometre round; families take out boats; the café terraces fill as the day cools. On the same slope,
    a short walk away, the Open Air Museum of Ethnography gathers the farmhouses of a whole country onto
    one hillside.


    One small story shows how the city tends this place. In 2016, to fight the mosquitoes that can carry
    the Zika virus, members of the Georgian Fishermen's Club brought gambusia, tiny mosquito-eating fish,
    from Abasha in western Georgia and released them into the lake under an agreement with the ministry.


    Come in the last hour of daylight. The water turns copper, the city breathes out, and you understand
    why Tbilisi keeps this lake for itself.
  tip: >-
    Walking round the lake is free; the gondola is a paid ride. On July and August evenings the terraces
    fill after five and the small car park overflows, so either arrive before four or leave the car below
    and ride up. There is a small beach and people do swim in summer, but this is a shallow, stream-fed
    lake: judge the water for yourself. The ridge is noticeably cooler and windier than the streets below,
    so bring a layer for the evening. Toilets and food are in the cafés. The gondolas and stations are
    adapted for wheelchairs, which also makes them the easy option with a pushchair.
  route: >-
    From Freedom Square cross town to Chavchavadze Avenue and follow it west through Vake to the park.
    Here you choose: park in the streets near the lower gondola station and ride up, or keep driving along
    the winding asphalt road that climbs to the lake itself, about 11 km from the centre and some twenty
    minutes in all. The road is narrow, and on summer evenings cars parked along the verge make passing
    awkward. It is asphalt all the way; in icy weather take the bends slowly, but no four-wheel drive
    is needed. An economy car is all you need, and you will pass plenty of fuel stations in Vake.
ru:
  name: Черепашье озеро и парк Ваке
  short: >-
    Оползневое озеро на сосновом гребне над Ваке, в шести минутах подъёма на гондоле: сюда Тбилиси уходит,
    когда улицы внизу начинают раскаляться.
  body: >-
    **Черепашье озеро создал оползень, и с тех пор Тбилиси относится к нему как к собственному саду.**
    Небольшое мелкое озеро, известное и под старым названием Корки, лежит в котловине на северном склоне
    хребта Мтацминда, на высоте 686 метров над уровнем моря; его питают ручей Варазисхеви, дожди и грунтовые
    воды. Даже в самом глубоком месте в нём немногим больше двух с половиной метров, и в безветренное
    утро оно держит в себе весь тёмный от сосен склон — вверх ногами.


    Ниже раскинулся парк Ваке, открытый в 1946 году: аллеи, посыпанные красным песком, каскад фонтанов
    и широкая лестница, поднимающаяся к мемориалу Второй мировой войны на гребне. Канатная дорога впервые
    связала город с озером во второй половине XX века и работала до 2009 года. В 2016 году открылась новая:
    две кабины на десять-двенадцать человек каждая поднимаются от проспекта Чавчавадзе примерно за шесть
    минут, а крыши Ваке опускаются всё ниже под вашими ногами.


    Наверху ритм местный, а не туристический. Бегуны наматывают круги по береговой тропе — чуть меньше
    километра за круг; семьи берут лодки; к вечерней прохладе заполняются террасы кафе. На том же склоне,
    в нескольких минутах ходьбы, Музей этнографии под открытым небом собрал на одном холме крестьянские
    дома со всей страны.


    Одна небольшая история показывает, как город заботится об этом месте. В 2016 году, чтобы бороться
    с комарами, способными переносить вирус Зика, члены Грузинского клуба рыболовов привезли из Абаши
    в Западной Грузии гамбузий — крошечных рыбок, поедающих комаров, — и выпустили их в озеро по соглашению
    с министерством.


    Приходите в последний час светлого дня. Вода становится медной, город выдыхает, и вы понимаете, почему
    Тбилиси бережёт это озеро для себя.
  tip: >-
    Прогулка вокруг озера бесплатна, подъём на гондоле платный. Июльскими и августовскими вечерами террасы
    заполняются после пяти, а маленькая парковка переполняется, так что либо приезжайте до четырёх, либо
    оставьте машину внизу и поднимитесь на канатке. Есть небольшой пляж, и летом здесь купаются, но это
    мелкое озеро, которое питает ручей: оценивайте воду сами. На гребне заметно прохладнее и ветренее,
    чем на улицах внизу, так что возьмите что-нибудь тёплое на вечер. Туалеты и еда — в кафе. Кабины и
    станции приспособлены для инвалидных колясок, а значит, это и самый удобный вариант с детской коляской.
  route: >-
    От площади Свободы проедьте через город к проспекту Чавчавадзе и двигайтесь по нему на запад через
    Ваке к парку. Здесь нужно выбрать: оставить машину на улицах возле нижней станции канатной дороги
    и подняться наверх или ехать дальше по извилистой асфальтовой дороге, которая взбирается к самому
    озеру, — около 11 км от центра, всего минут двадцать. Дорога узкая, и летними вечерами машины, припаркованные
    на обочине, мешают разъехаться. Асфальт на всём протяжении; в гололёд проходите повороты медленно,
    но полный привод не нужен. Хватит машины эконом-класса, а заправок в Ваке по пути предостаточно.
fa:
  name: دریاچهٔ لاک‌پشت و پارک واکه
  short: >-
    برکه‌ای زادهٔ رانش زمین بر ستیغی پوشیده از کاج بالای واکه، شش دقیقه راه با تله‌کابین: جایی که تفلیس
    وقتی خیابان‌های پایین داغ می‌شوند به آن پناه می‌برد.
  body: >-
    **دریاچهٔ لاک‌پشت زادهٔ یک رانش زمین است، و تفلیس از آن پس آن را باغچهٔ خانگی خود دانسته است.** این
    دریاچهٔ کوچک و کم‌ژرفا، که با نام کهن‌ترش «کورکی» نیز شناخته می‌شود، در گودالی بر دامنهٔ شمالی ستیغ
    متاتسمیندا، در ارتفاع ۶۸۶ متری از سطح دریا، آرمیده و آبش از نهر وارازیسخوی، باران و آب‌های زیرزمینی
    می‌آید. حتی ژرف‌ترین نقطه‌اش اندکی بیش از دو و نیم متر است و در صبحی بی‌باد، تمام دامنهٔ تیره از کاج
    را واژگونه در خود نگه می‌دارد.


    در پایین، پارک واکه گسترده است که در ۱۹۴۶ گشایش یافت: گذرگاه‌هایی با شن سرخ، آبشاری از فواره‌ها و
    پلکانی پهن که تا یادمان جنگ جهانی دوم بر فراز ستیغ بالا می‌رود. نخستین تله‌کابین در نیمهٔ دوم سدهٔ
    بیستم شهر را به دریاچه پیوند داد و تا ۲۰۰۹ کار می‌کرد. در ۲۰۱۶ تله‌کابینی تازه گشوده شد: دو کابین،
    هر یک برای ده تا دوازده نفر، که از خیابان چاوچاوادزه در حدود شش دقیقه بالا می‌روند و بام‌های واکه
    زیر کفش‌هایتان فرو می‌نشینند.


    آن بالا آهنگ زندگی محلی است، نه گردشگری. دوندگان مسیر کنار ساحل را، که دورش کمی کمتر از یک کیلومتر
    است، می‌پیمایند؛ خانواده‌ها قایق کرایه می‌کنند؛ و با خنک شدن هوا تراس کافه‌ها پر می‌شود. بر همان دامنه،
    چند قدم آن‌سوتر، موزهٔ مردم‌شناسی در فضای باز خانه‌های روستایی سراسر یک کشور را بر یک تپه گرد آورده
    است.


    یک ماجرای کوچک نشان می‌دهد شهر چگونه از این مکان نگهداری می‌کند. در ۲۰۱۶، برای مبارزه با پشه‌هایی
    که می‌توانند ویروس زیکا را منتقل کنند، اعضای باشگاه ماهیگیران گرجستان ماهی‌های ریز پشه‌خواری به نام
    گامبوزیا را از آباشا در غرب گرجستان آوردند و بر پایهٔ توافقی با وزارتخانه در دریاچه رها کردند.


    در آخرین ساعت روشنایی روز بیایید. آب مسی‌رنگ می‌شود، شهر نفسی آسوده می‌کشد و درمی‌یابید چرا تفلیس
    این دریاچه را برای خودش نگه داشته است.
  tip: >-
    گردش دور دریاچه رایگان است؛ تله‌کابین بلیت دارد. در غروب‌های ژوئیه و اوت تراس‌ها پس از ساعت پنج پر
    می‌شوند و پارکینگ کوچک لبریز می‌شود؛ پس یا پیش از ساعت چهار برسید یا خودرو را پایین بگذارید و با تله‌کابین
    بالا بروید. ساحلی کوچک هست و مردم تابستان‌ها شنا می‌کنند، اما این دریاچه‌ای کم‌ژرفاست که از نهر آب
    می‌گیرد: دربارهٔ آب خودتان داوری کنید. ستیغ آشکارا خنک‌تر و پرباد‌تر از خیابان‌های پایین است، پس برای
    شب لباسی اضافه همراه بیاورید. سرویس بهداشتی و غذا در کافه‌ها هست. کابین‌ها و ایستگاه‌ها برای ویلچر
    مناسب‌سازی شده‌اند و همین آن‌ها را با کالسکهٔ بچه هم ساده‌ترین گزینه می‌کند.
  route: >-
    از میدان آزادی شهر را تا خیابان چاوچاوادزه بپیمایید و آن را به سوی غرب، از میان واکه، تا پارک دنبال
    کنید. اینجا باید انتخاب کنید: یا در خیابان‌های نزدیک ایستگاه پایینی تله‌کابین پارک کنید و با کابین
    بالا بروید، یا در جادهٔ آسفالتهٔ پرپیچ‌وخمی که تا خودِ دریاچه بالا می‌رود ادامه دهید؛ حدود ۱۱ کیلومتر
    از مرکز و روی‌هم نزدیک بیست دقیقه. جاده باریک است و در غروب‌های تابستان خودروهای پارک‌شده در حاشیه،
    گذشتن از کنار هم را دشوار می‌کنند. تمام راه آسفالت است؛ هنگام یخبندان در پیچ‌ها آهسته برانید، اما
    به چهارچرخ‌محرک نیازی نیست. یک خودروی اقتصادی کافی است و در واکه از کنار پمپ‌بنزین‌های فراوانی می‌گذرید.
he:
  name: אגם הצבים ופארק ואקה
  short: >-
    אגם קטן שנוצר ממפולת, על רכס מיוער אורנים מעל ואקה, שש דקות עלייה ברכבל: לכאן בורחת טביליסי כשהרחובות
    למטה מתחילים ללהוט.
  body: >-
    **אגם הצבים נוצר בעקבות מפולת אדמה, ומאז טביליסי מתייחסת אליו כאל הגינה הפרטית שלה.** האגם הקטן והרדוד,
    הידוע גם בשמו הישן קורקי, שוכן בשקע במדרון הצפוני של רכס מטאצמינדה, בגובה 686 מטרים מעל פני הים, וניזון
    מנחל ורזיסחווי, מגשמים וממי תהום. גם בנקודה העמוקה ביותר עומקו מעט יותר משניים וחצי מטרים, ובבוקר
    נטול רוח משתקף בו כל המדרון הכהה מאורנים, הפוך.


    למטה משתרע פארק ואקה, שנפתח ב-1946: שדרות של חול אדום, מפל מזרקות מדורג וגרם מדרגות רחב שמטפס אל האנדרטה
    למלחמת העולם השנייה שעל הרכס. רכבל חיבר לראשונה את העיר לאגם במחצית השנייה של המאה ה-20 ופעל עד 2009.
    ב-2016 נפתח רכבל חדש: שני קרונות של עשרה או שנים-עשר נוסעים כל אחד, שעולים משדרות צ'בצ'בדזה בתוך כשש
    דקות, בזמן שגגות ואקה שוקעים מתחת לנעליים שלכם.


    למעלה הקצב מקומי ולא תיירותי. רצים מקיפים את השביל שלאורך החוף, קצת פחות מקילומטר להקפה; משפחות שוכרות
    סירות; מרפסות בתי הקפה מתמלאות כשהיום מתקרר. על אותו מדרון, במרחק הליכה קצר, אוסף מוזיאון האתנוגרפיה
    תחת כיפת השמיים את בתי האיכרים של ארץ שלמה על צלע גבעה אחת.


    סיפור קטן אחד מראה איך העיר דואגת למקום הזה. ב-2016, כדי להילחם ביתושים שעלולים להעביר את נגיף הזיקה,
    הביאו חברי מועדון הדייגים הגאורגי גמבוזיות – דגים זעירים שאוכלים יתושים – מאבשה שבמערב גאורגיה, ושחררו
    אותם לאגם במסגרת הסכם עם המשרד הממשלתי.


    בואו בשעה האחרונה של אור היום. המים מקבלים גוון של נחושת, העיר נושמת לרווחה, ואתם מבינים מדוע טביליסי
    שומרת את האגם הזה לעצמה.
  tip: >-
    ההליכה סביב האגם בחינם; הרכבל בתשלום. בערבי יולי ואוגוסט המרפסות מתמלאות אחרי חמש והחניון הקטן עולה
    על גדותיו, לכן הגיעו לפני ארבע או השאירו את הרכב למטה ועלו ברכבל. יש חוף קטן ואנשים אכן שוחים בקיץ,
    אבל זהו אגם רדוד שניזון מנחל: שפטו בעצמכם את המים. על הרכס קריר יותר ויש בו הרבה יותר רוח מאשר ברחובות
    למטה, אז הביאו שכבה נוספת לערב. שירותים ואוכל יש בבתי הקפה. הקרונות והתחנות מונגשים לכיסאות גלגלים,
    ולכן הם גם האפשרות הנוחה עם עגלת תינוק.
  route: >-
    מכיכר החירות חצו את העיר עד שדרות צ'בצ'בדזה והמשיכו בהן מערבה דרך ואקה עד הפארק. כאן צריך לבחור: לחנות
    ברחובות שליד תחנת הרכבל התחתונה ולעלות ברכבל, או להמשיך לנסוע בכביש האספלט המתפתל שמטפס עד האגם עצמו
    – כ-11 ק"מ מהמרכז וכעשרים דקות בסך הכול. הכביש צר, ובערבי קיץ מכוניות שחונות בשוליים מקשות על שני
    רכבים לעבור זה את זה. אספלט לכל אורך הדרך; כשהכביש קפוא האטו בעיקולים, אבל אין צורך בהנעה כפולה. רכב
    חסכוני מספיק לגמרי, ותחנות דלק יש בשפע בוואקה.
ar:
  name: بحيرة السلاحف وحديقة فاكي
  short: >-
    بركة خلّفها انهيار أرضي على تلة صنوبر فوق فاكي، على بعد ست دقائق بالتلفريك: إليها تلجأ تبليسي حين
    تلتهب الشوارع في الأسفل.
  body: >-
    **وُلدت بحيرة السلاحف من انهيار أرضي، ومنذ ذلك الحين تعاملها تبليسي كأنها حديقتها الخاصة.** تقع البحيرة
    الصغيرة الضحلة، المعروفة أيضًا باسمها الأقدم «كوركي»، في منخفض على السفح الشمالي لسلسلة متاتسميندا،
    على ارتفاع 686 مترًا فوق سطح البحر، ويغذّيها جدول فارازيسخيفي والأمطار والمياه الجوفية. ولا يزيد عمقها
    حتى في أعمق نقاطها إلا قليلًا على مترين ونصف، وفي صباح بلا ريح تحمل السفح كله، الداكن بالصنوبر، مقلوبًا
    على صفحتها.


    وفي الأسفل تمتدّ حديقة فاكي التي افتُتحت عام 1946: ممرّات من الرمل الأحمر، وسلسلة متدرّجة من النوافير،
    ودرج عريض يصعد إلى نصب الحرب العالمية الثانية على قمة السلسلة. ربط تلفريك المدينةَ بالبحيرة أول مرة
    في النصف الثاني من القرن العشرين، وظلّ يعمل حتى عام 2009. وفي عام 2016 افتُتح تلفريك جديد: عربتان
    تتّسع كلٌّ منهما لعشرة أشخاص أو اثني عشر، تصعدان من جادة تشافتشافادزه في نحو ست دقائق، فيما تغوص أسطح
    فاكي تحت قدميك.


    في الأعلى، الإيقاع محلّي لا سياحي. يدور العدّاؤون حول ممرّ الشاطئ الذي يقلّ طوله قليلًا عن كيلومتر؛
    وتستأجر العائلات القوارب؛ وتمتلئ شرفات المقاهي كلما برد النهار. وعلى السفح نفسه، على مسافة قصيرة سيرًا،
    يجمع متحف الإثنوغرافيا في الهواء الطلق بيوت الفلاحين من بلد بأكمله على تلة واحدة.


    قصة صغيرة تكشف كيف ترعى المدينة هذا المكان. ففي عام 2016، ولمكافحة البعوض الذي قد ينقل فيروس زيكا،
    جلب أعضاء نادي هواة صيد السمك الجورجي أسماك الغمبوزيا، وهي أسماك دقيقة تتغذّى على البعوض، من أباشا
    في غرب جورجيا، وأطلقوها في البحيرة بموجب اتفاق مع الوزارة.


    تعالَ في الساعة الأخيرة من النهار. يكتسي الماء لون النحاس، وتتنفّس المدينة الصعداء، وتفهم لماذا تحتفظ
    تبليسي بهذه البحيرة لنفسها.
  tip: >-
    التجوّل حول البحيرة مجاني، أما التلفريك فبأجر. في أمسيات يوليو وأغسطس تمتلئ الشرفات بعد الخامسة ويفيض
    الموقف الصغير بالسيارات، لذا إمّا أن تصل قبل الرابعة، وإمّا أن تترك السيارة في الأسفل وتصعد بالتلفريك.
    هناك شاطئ صغير ويسبح الناس فعلًا في الصيف، لكنها بحيرة ضحلة يغذّيها جدول، فاحكم على الماء بنفسك. القمة
    أبرد وأشدّ ريحًا بوضوح من الشوارع في الأسفل، فاحمل طبقة إضافية للمساء. دورات المياه والطعام في المقاهي.
    العربات والمحطات مهيّأة للكراسي المتحركة، ما يجعلها أيضًا الخيار الأسهل لمن معه عربة أطفال.
  route: >-
    من ساحة الحرية اعبر المدينة إلى جادة تشافتشافادزه، واتبعها غربًا عبر فاكي حتى الحديقة. هنا تختار:
    أن تركن في الشوارع القريبة من محطة التلفريك السفلى وتصعد بالعربة، أو أن تواصل القيادة على الطريق الإسفلتي
    المتعرّج الذي يصعد إلى البحيرة نفسها، نحو 11 كم من المركز وقرابة عشرين دقيقة في المجمل. الطريق ضيق،
    وفي أمسيات الصيف تجعل السيارات المركونة على جانبه مرور سيارتين متقابلتين أمرًا عسيرًا. الطريق معبّد
    بالكامل؛ وفي الطقس الجليدي خذ المنعطفات ببطء، لكنك لا تحتاج إلى دفع رباعي. تكفي سيارة اقتصادية، وستمرّ
    بمحطات وقود كثيرة في فاكي.
