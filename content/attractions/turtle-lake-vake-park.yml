ka:
  name: კუს ტბა და ვაკის პარკი
  short: ქალაქის მწვანე ღერძი — ვაკის პარკიდან საბაგიროთი კუს ტბამდე, სადაც თბილისელები ისვენებენ.
  body: >-
    **კუს ტბა თბილისელების საკუთარი ადგილია.** ის ტურისტული სიების პირველ ხაზზე არ დგას, სწორედ ამიტომ
    იძლევა იმას, რასაც ძველი ქალაქი ვერ იძლევა — ჩვეულებრივ, არაშოუბიზნეს თბილისს. პატარა ტბა 686 მეტრზეა,
    ვაკის ზემოთ, ფიჭვნარით შემოსილ ქედზე.


    ვაკის პარკი ქვევით 1946 წელს გაშენდა და საბჭოთა პარკის კლასიკური ნიმუშია: ფართო ალეები, ფონტანი, კიბეების
    კასკადი. მისი ზედა ბოლოდან საბაგირო გზა ადის კუს ტბამდე — ხუთწუთიანი ჰაერში მოგზაურობა, რომლის დროსაც
    მთელი ვაკე ფეხქვეშ რჩება.


    რას აკეთებენ კუს ტბაზე:


    - უვლიან ტბას გარშემო — ბრტყელი, დაახლოებით 1 კმ სიგრძის ბილიკი

    - ქირაობენ კატამარანს ან ნავს თბილ სეზონზე

    - სხედან ტბისპირა კაფეებში, სადაც ხედი წყალზე და მთაზეა

    - ადიან ან ჩამოდიან ფეხით ეთნოგრაფიულ მუზეუმამდე — 20 წუთის ბილიკი

    - ზამთარში უბრალოდ დადიან: ტბა ხშირად ნაწილობრივ იყინება და ტყე ჩუმდება


    ტბა თბილისის ერთ-ერთი ყველაზე გრილი წერტილია, ამიტომ ივლის-აგვისტოს სიცხეში აქ ხალხი მასობრივად ადის.
    თუ სიმშვიდე გინდა, კვირის შუა დღეს მოდი.
  tip: >-
    ზაფხულში საღამოს ხუთის შემდეგ ტბისპირა კაფეები ივსება და პარკინგი პრობლემად იქცევა — ან ადრე მოდი,
    ან საბაგიროთი ავედი ვაკის პარკიდან. საცურაოდ ტბა არ არის განკუთვნილი, თუმცა ხალხი ზოგჯერ ბანაობს;
    ოფიციალური სანაპირო არ არსებობს. ჩაიცვი ისე, რომ საღამოს გაგრილება გაითვალისწინო. ბანკომატი ჭავჭავაძეზეა,
    ტბაზე მხოლოდ ბარათით გადახდა მუშაობს ყველგან არა. ბავშვებთან ერთად ეს ერთ-ერთი საუკეთესო ვარიანტია
    ქალაქში.
  route: >-
    ჭავჭავაძის გამზირიდან ვაკის პარკამდე მიდიხარ, შემდეგ ან პარკთან ტოვებ მანქანას და საბაგიროთი ადიხარ,
    ან აგრძელებ სერპანტინით პირდაპირ ტბამდე — ორივე შემთხვევაში 20 წუთამდე. ზემოთ, ტბის მიმდებარედ, უფასო
    პარკინგია, თუმცა ზაფხულის საღამოს ის სავსეა და ვიწრო გზაზე ორმხრივი მოძრაობა რთულდება. გზა ბოლომდე
    ასფალტია. ზამთარში ეს აღმართი მოყინვისას მოითხოვს ფრთხილ მართვას, მაგრამ ჯიპი საჭირო არ არის — ეკონომ-კლასიც
    კმარა.
en:
  name: Turtle Lake and Vake Park
  short: The city's green axis — from Vake Park up by cable car to Turtle Lake, where Tbilisi actually
    relaxes.
  body: >-
    **Turtle Lake belongs to the locals.** It rarely tops a visitor's list, and that is precisely why
    it delivers something the Old Town cannot: ordinary, unperformed Tbilisi. The small lake sits at 686
    metres on a pine-covered ridge above Vake.


    Vake Park below was laid out in 1946 and is a textbook Soviet park — broad alleys, a fountain, a cascade
    of steps. From its upper end a cable car climbs to the lake in about five minutes, with the whole
    district dropping away beneath you.


    What people do at Turtle Lake:


    - Walk the flat lakeside loop, roughly a kilometre around

    - Rent a pedalo or rowing boat in the warm months

    - Sit in the terraced cafés looking out over the water towards the ridge

    - Walk down to the Open Air Museum of Ethnography, about twenty minutes on a woodland path

    - In winter, simply walk: the lake often freezes at the edges and the pine forest goes quiet


    Because the ridge is one of the coolest spots in Tbilisi, half the city comes up here during the July
    and August heat. Mid-week is when you get the place closer to how it feels the rest of the year, and
    the light on the water in late afternoon is worth the trip on its own.
  tip: >-
    In summer the lakeside cafés fill after five in the afternoon and parking becomes the main problem
    — either come early or take the cable car up from Vake Park instead. The lake is not an official swimming
    spot even though people do swim; there is no supervised beach. Dress for the evening drop in temperature
    up here. ATMs are down on Chavchavadze, and not every kiosk by the lake takes cards. With children
    this is one of the easiest days out in the city.
  route: >-
    Follow Chavchavadze Avenue to Vake Park, then either leave the car at the park and ride the cable
    car, or keep driving the switchbacks straight to the lake — both take up to twenty minutes from the
    centre. There is free parking around the lake, though on summer evenings it is full and the narrow
    road makes passing awkward. The surface is asphalt the whole way. In winter the climb needs careful
    driving when it ices over, but no four-wheel drive is required; an economy car is enough.
ru:
  name: Черепашье озеро и парк Ваке
  short: 'Зелёная ось города: из парка Ваке по канатной дороге к Черепашьему озеру, где отдыхают сами
    тбилисцы.'
  body: >-
    **Черепашье озеро принадлежит горожанам.** Оно редко попадает в первые строки туристических списков,
    и именно поэтому даёт то, чего не даёт Старый город, — обычный, неотрепетированный Тбилиси. Небольшое
    озеро лежит на высоте 686 метров на сосновом хребте над Ваке.


    Парк Ваке внизу разбит в 1946 году и представляет собой образцовый советский парк: широкие аллеи,
    фонтан, каскад лестниц. От его верхней части канатная дорога поднимает к озеру примерно за пять минут,
    и весь район уходит вниз под кабиной.


    Что делают на Черепашьем озере:


    - Обходят озеро по ровной тропе, примерно километр по кругу

    - Берут катамаран или лодку в тёплый сезон

    - Сидят в кафе на террасах с видом на воду и хребет

    - Спускаются пешком к Этнографическому музею — около двадцати минут по лесной тропе

    - Зимой просто гуляют: у берегов озеро подмерзает, а сосновый лес затихает


    Хребет — одно из самых прохладных мест Тбилиси, поэтому в июльскую и августовскую жару сюда поднимается
    полгорода. В будний день озеро ближе к своему обычному состоянию, а свет на воде под вечер стоит поездки
    сам по себе.
  tip: >-
    Летом после пяти вечера кафе у воды заполняются, и парковка становится главной проблемой — приезжайте
    раньше или поднимайтесь на канатной дороге из парка Ваке. Официально купаться здесь не предусмотрено,
    оборудованного пляжа нет, хотя люди заходят в воду. Одевайтесь с расчётом на вечернюю прохладу наверху.
    Банкоматы внизу на Чавчавадзе, а карты принимают не во всех киосках у озера. С детьми это один из
    самых удобных вариантов в городе.
  route: >-
    По проспекту Чавчавадзе доезжаете до парка Ваке, а дальше либо оставляете машину у парка и поднимаетесь
    по канатной дороге, либо едете серпантином прямо к озеру — в обоих случаях до двадцати минут от центра.
    У озера есть бесплатная парковка, но летними вечерами она забита, а на узкой дороге тяжело разъезжаться.
    Покрытие асфальтовое на всём протяжении. Зимой при гололёде подъём требует аккуратности, но полный
    привод не нужен: машины эконом-класса хватает.
fa:
  name: دریاچهٔ لاک‌پشت و پارک واکه
  short: محور سبز شهر — از پارک واکه با تله‌کابین تا دریاچهٔ لاک‌پشت، جایی که تفلیس واقعاً نفس می‌کشد.
  body: >-
    **دریاچهٔ لاک‌پشت مال خود تفلیسی‌هاست.** به‌ندرت در صدر فهرست بازدیدکنندگان می‌نشیند و دقیقاً به همین
    دلیل چیزی می‌دهد که شهر قدیم نمی‌تواند: تفلیسِ عادی و بی‌نمایش. دریاچهٔ کوچک در ارتفاع 686 متر روی
    ستیغی پوشیده از کاج بالای واکه قرار دارد.


    پارک واکه در پایین در 1946 طراحی شد و نمونه‌ای کتابی از پارک شوروی است — خیابان‌های پهن، فواره، آبشاری
    از پله. از انتهای بالایی آن تله‌کابین در حدود پنج دقیقه تا دریاچه بالا می‌رود و کل محله زیر پایتان
    فرو می‌افتد.


    مردم اینجا حلقهٔ هموار کنار دریاچه را می‌پیمایند، حدود یک کیلومتر؛ در ماه‌های گرم قایق پایی یا پارویی
    کرایه می‌کنند؛ در کافه‌های مصطبه‌ای رو به آب و ستیغ می‌نشینند؛ حدود بیست دقیقه از مسیر جنگلی به موزهٔ
    روباز مردم‌شناسی پایین می‌روند؛ و در زمستان فقط قدم می‌زنند، وقتی لبه‌های دریاچه یخ می‌بندد و جنگل
    کاج خاموش می‌شود. چون این ستیغ از خنک‌ترین نقاط تفلیس است، در گرمای ژوئیه و اوت نیمی از شهر به اینجا
    می‌آید. میان هفته جا را نزدیک‌تر به حال‌وهوای بقیهٔ سال می‌بینید، و نور روی آب در پایان بعدازظهر خودش
    ارزش آمدن دارد.
  tip: >-
    تابستان کافه‌های کنار دریاچه پس از ساعت پنج بعدازظهر پر می‌شوند و پارک خودرو مسئلهٔ اصلی می‌شود —
    یا زود بیایید یا از پارک واکه با تله‌کابین بالا بروید. دریاچه محل شنای رسمی نیست، هرچند مردم شنا می‌کنند؛
    ساحل تحت نظارت وجود ندارد. برای افت دمای عصرگاهی اینجا لباس مناسب بردارید. خودپردازها پایین در خیابان
    چاوچاوادزه هستند و هر کیوسک کنار دریاچه کارت نمی‌پذیرد. با بچه‌ها این یکی از آسان‌ترین برنامه‌های
    یک‌روزهٔ شهر است.
  route: >-
    خیابان چاوچاوادزه را تا پارک واکه دنبال کنید و سپس یا خودرو را در پارک بگذارید و با تله‌کابین بالا
    بروید، یا سرپیچ‌ها را مستقیم تا دریاچه رانندگی کنید — هر دو از مرکز تا بیست دقیقه طول می‌کشد. دور
    دریاچه پارک رایگان هست، هرچند عصرهای تابستان پر می‌شود و جادهٔ باریک عبور را دشوار می‌کند. سطح جاده
    تمام مسیر آسفالت است. در زمستان صعود هنگام یخ‌بندان رانندگی محتاطانه می‌خواهد، اما چهارچرخ‌محرک لازم
    نیست؛ خودروی اقتصادی کافی است.
he:
  name: אגם הצבים ופארק ואקה
  short: הציר הירוק של העיר — מפארק ואקה ברכבל אל אגם הצבים, המקום שבו טביליסי באמת נחה.
  body: >-
    **אגם הצבים שייך למקומיים.** הוא ממעט להופיע בראש רשימות המבקרים, ובדיוק לכן הוא מציע משהו שהעיר העתיקה
    אינה יכולה להציע: טביליסי רגילה, לא מוצגת לראווה. האגם הקטן שוכן בגובה 686 מטר על רכס מכוסה אורנים
    מעל שכונת ואקה.


    פארק ואקה שלמטה תוכנן ב-1946 והוא פארק סובייטי לספר הלימוד — שדרות רחבות, מזרקה ומפל של מדרגות. מקצהו
    העליון עולה רכבל אל האגם בכחמש דקות בלבד, כשכל הרובע צונח מתחתיכם.


    מה שעושים באגם הצבים: הולכים את הלולאה המישורית סביבו, כקילומטר; שוכרים בחודשים החמים פדלו או סירת
    משוטים; יושבים בבתי הקפה המדורגים אל מול המים והרכס; יורדים ברגל אל מוזיאון האתנוגרפיה הפתוח, כעשרים
    דקות בשביל יער; ובחורף פשוט הולכים, כשהאגם קופא בשוליו ויער האורנים נדם. מכיוון שהרכס הוא מן המקומות
    הקרירים ביותר בטביליסי, חצי מהעיר עולה לכאן בחום של יולי ואוגוסט. באמצע השבוע תפגשו את המקום קרוב
    יותר לאופיו בשאר ימות השנה, והאור על המים בשעות אחר הצהריים המאוחרות שווה את הנסיעה בפני עצמו.
  tip: >-
    בקיץ בתי הקפה שלחוף האגם מתמלאים אחרי חמש אחר הצהריים והחניה הופכת לבעיה המרכזית — או שמגיעים מוקדם
    או שעולים ברכבל מפארק ואקה. האגם אינו אתר רחצה מוכר אף שאנשים שוחים בו; אין חוף מפוקח. התלבשו לירידת
    הטמפרטורה בערב כאן למעלה. הכספומטים נמצאים למטה ברחוב צ'אבצ'אוודזה, ולא כל דוכן ליד האגם מקבל כרטיסים.
    עם ילדים זהו אחד הימים הקלים ביותר בעיר.
  route: >-
    סעו בשדרות צ'אבצ'אוודזה עד פארק ואקה, ואז או שתשאירו את הרכב בפארק ותעלו ברכבל, או שתמשיכו בסרפנטינות
    היישר אל האגם — שתי האפשרויות אורכות עד עשרים דקות מהמרכז. סביב האגם יש חניה חינם, אם כי בערבי הקיץ
    היא מלאה והכביש הצר מקשה על חצייה. המשטח אספלט לכל האורך. בחורף העלייה דורשת נהיגה זהירה כשהיא מתכסה
    בקרח, אך אין צורך בהנעה כפולה; רכב חסכוני מספיק.
ar:
  name: بحيرة السلاحف وحديقة فاكي
  short: المحور الأخضر للمدينة — من حديقة فاكي بالتلفريك إلى بحيرة السلاحف، حيث تسترخي تبليسي فعلاً.
  body: >-
    **بحيرة السلاحف ملك للسكان المحليين.** نادراً ما تتصدر قوائم الزوار، ولهذا بالضبط تمنحك ما لا تستطيع
    البلدة القديمة منحه: تبليسي العادية بلا استعراض. تقع البحيرة الصغيرة على ارتفاع 686 متراً فوق حافة
    مكسوة بالصنوبر تعلو فاكي.


    أما حديقة فاكي في الأسفل فقد صُممت عام 1946 وهي حديقة سوفياتية نموذجية — ممشى عريض ونافورة ومدرج من
    الدرجات. ومن طرفها العلوي يصعد تلفريك إلى البحيرة في نحو خمس دقائق، بينما يهبط الحي كله تحتك.


    وما يفعله الناس عند بحيرة السلاحف: يمشون الحلقة المستوية حول الشاطئ، نحو كيلومتر واحد؛ ويستأجرون في
    الأشهر الدافئة قارب دواسات أو قارب تجديف؛ ويجلسون في المقاهي المدرجة المطلة على الماء نحو الحافة؛
    وينزلون سيراً إلى متحف الإثنوغرافيا المفتوح، نحو عشرين دقيقة على درب حرجي؛ وفي الشتاء يمشون فحسب،
    إذ تتجمد أطراف البحيرة وتسكن غابة الصنوبر. ولأن هذه الحافة من أبرد بقاع تبليسي، يصعد إليها نصف المدينة
    في حر يوليو وأغسطس. وفي منتصف الأسبوع تجد المكان أقرب إلى طبيعته في بقية العام، والضوء على الماء في
    آخر العصر يستحق الرحلة وحده.
  tip: >-
    في الصيف تمتلئ مقاهي البحيرة بعد الخامسة عصراً ويصبح الوقوف هو المشكلة الأولى — فإما أن تأتي مبكراً
    وإما أن تصعد بالتلفريك من حديقة فاكي. البحيرة ليست موقع سباحة رسمياً وإن كان الناس يسبحون فيها؛ ولا
    يوجد شاطئ تحت الإشراف. البس ما يناسب انخفاض الحرارة مساءً هنا في الأعلى. أجهزة الصراف في الأسفل بشارع
    تشافتشافادزي، وليس كل كشك عند البحيرة يقبل البطاقات. ومع الأطفال هذا من أسهل أيام المدينة.
  route: >-
    اتبع شارع تشافتشافادزي حتى حديقة فاكي، ثم إما أن تترك السيارة عند الحديقة وتركب التلفريك، وإما أن
    تواصل القيادة في المنعطفات مباشرة إلى البحيرة — وكلا الخيارين يستغرق حتى عشرين دقيقة من المركز. حول
    البحيرة مواقف مجانية، وإن كانت تمتلئ في أمسيات الصيف ويجعل الطريق الضيق التجاوز عسيراً. السطح إسفلت
    طوال المسافة. وفي الشتاء يحتاج الصعود قيادة حذرة حين يتجمد، لكن لا حاجة إلى دفع رباعي؛ فالسيارة الاقتصادية
    تكفي.
