ka:
  name: ახალქალაქის ციხე
  short: >-
    XI საუკუნის ციტადელი ორი კანიონის შესაყარზე, ჯავახეთის ზეგნის მთავარ ქალაქში — 1700 მეტრზე, სომხურენოვანი
    და ქარებით გადაქროლილი.
  body: >-
    **ახალქალაქი „ახალ ქალაქს“ ნიშნავს — და ისტორიამ მას თავიდან დაწყება არაერთხელ აიძულა.**


    ქალაქი ზღვის დონიდან 1700 მეტრზე, ჯავახეთის ვულკანურ ზეგანზე დგას, იქ, სადაც ფარავანსა და მურჯახეთისწყალს
    ღრმა ხეობები ამოუჭრიათ. ორი მდინარის შესაყარზე, კლდოვან კონცხზე, ციტადელი აღმართულა. ქალაქის გამაგრება
    XI საუკუნეში ბაგრატ III-მ დაიწყო და ბაგრატ IV-მ დაასრულა. XI საუკუნის 60-იან წლებში ახალქალაქს სელჩუკთა
    სულთანი ალფ-არსლანი დაესხა თავს; მირაშხნის წარწერა მოგვითხრობს, როგორ იცავდნენ ქალაქს ფარსმან თმოგველი
    და მესხი აზნაურები, ფარსმანის სახელი კი ათონის ივერთა მონასტრის აღაპშიც შეიტანეს.


    XIII საუკუნეში ქალაქი მონღოლებმა გადაწვეს, XVI საუკუნის ბოლოს კი ის ოსმალეთის სანჯაყის ცენტრად, ახილქელექად,
    იქცა. 1828 წლის 22 სექტემბერს ახალქალაქი გენერალ პასკევიჩის რუსულ-ქართულმა ჯარმა აიღო, მომდევნო წელს
    კი ადრიანოპოლის ზავმა რუსეთს დაუმტკიცა. მაჰმადიანი მოსახლეობა ოსმალეთში გადასახლდა, მის ადგილას კი
    არზრუმიდან დაახლოებით 30 000 სომეხი დაასახლეს. სწორედ ამიტომ იყო 2014 წლის აღწერით ქალაქის მოსახლეობის
    93,8% სომეხი და ამიტომ ლაპარაკობენ ბაზარში დღესაც სომხურად.


    1900 წლის 4 იანვარს მიწისძვრამ ქალაქის დიდი ნაწილი დაანგრია და მიდამოებში ათასამდე ადამიანი იმსხვერპლა;
    გადარჩენილები 1920-იან წლებამდე მიწურებში ცხოვრობდნენ.


    ციხეზე ფარავნის კანიონის თავზე აღმართული სქელი ქვის კედლები და კოშკები დაგხვდებათ; ძველ ქალაქში ეკლესიისა
    და ქარვასლის ნანგრევებიც შემორჩა. მხარეთმცოდნეობის მუზეუმში კი მოძებნეთ ახ. წ. I საუკუნის ბრინჯაოს
    დისკო, დაახლოებით 40 სანტიმეტრის დიამეტრისა, რომელიც, სავარაუდოდ, ასტრონომიულ კალენდრად გამოიყენებოდა.


    იანვრის საშუალო ტემპერატურა აქ −7,3 °C-ია, აბსოლუტური მინიმუმი კი −38 °C. ზაფხულში ჩამოდით, როცა ზეგანი
    მწვანდება და ქარს ახლადათიბული თივის სუნი მოაქვს.
  tip: >-
    ციხე უფასო და ღიაა, მაგრამ ბილიკები უსწორმასწოროა, კანიონის კიდეები კი შემოუღობავი — ბავშვებს თვალი
    ადევნეთ. ახალქალაქი ზეგნის მთავარი მომარაგების პუნქტია: აქ იპოვით ბანკომატს, აფთიაქს, საწვავს და უბრალო
    სასადილოებს, ბაზარში კი ჯავახურ კარტოფილსა და ადგილობრივ ყველს. ზამთარი მკაცრია, გზები ყინულდება,
    ამიტომ ნოემბრიდან მარტამდე ზამთრის საბურავები აუცილებელია. სომხეთის საზღვრამდე დაახლოებით 29 კილომეტრია.
    X საუკუნის კუმურდოს ტაძარი ქალაქიდან დაახლოებით 12 კილომეტრშია — ნამდვილად ღირს, ფარავნის ტბა და ფოკა
    კი წალკის გზაზევე შეგხვდებათ.
  route: >-
    უმოკლესი გზა ზეგანზე გადის: თბილისიდან Sh36-ით, წყნეთის გავლით, მანგლისამდე, შემდეგ Sh31-ით წალკაზე
    და ფარავნის ტბის გვერდით ნინოწმინდისკენ, ბოლოს კი S11-ით დაახლოებით 15 კილომეტრი ჩრდილო-დასავლეთით.
    სულ დაახლოებით 200 კმ და სამი საათი და ნახევარი. გზა მთლიანად ასფალტია, მაგრამ წალკის ზემოთ შიშველ
    ზეგანზე გადის, სადაც ზამთარში ქარი თოვლს გზაზე ხვეტავს და ლიპყინული ხშირია. ალტერნატივა: E60-ით ხაშურამდე,
    S8-ით ბორჯომსა და ახალციხეზე, შემდეგ S11-ით ასპინძასა და ხერთვისზე — დაახლოებით 280 კმ და თითქმის
    ხუთი საათი, გზად ვარძიის შესახვევით. საწვავი წალკაში, ნინოწმინდაში ან ახალციხეში ჩაასხით. ეკონომ-კლასი
    საკმარისია; ზამთარში — მხოლოდ ზამთრის საბურავებით.
en:
  name: Akhalkalaki Fortress
  short: >-
    An 11th-century citadel on the spur between two canyons, in the Javakheti plateau's main town: 1,700
    metres up, Armenian-speaking and wind-scoured.
  body: >-
    **Akhalkalaki means "new town", and history has made it start again more than once.**


    The town stands at 1,700 metres on the volcanic Javakheti plateau, where the Paravani and the Murjakhetistskali
    have cut deep gorges. On the rocky spur where they meet rises the citadel. Its walls were begun in
    the 11th century under Bagrat III and finished under Bagrat IV. In the 1060s the Seljuk sultan Alp
    Arslan fell on the town; an inscription at Mirashkhani tells how Parsman Tmogveli and the Meskhian
    nobles defended it, and Parsman's name was entered in the memorial book of the Georgian Iviron monastery
    on Mount Athos.


    The Mongols burned Akhalkalaki in the 13th century. By the end of the 16th it was an Ottoman district
    town called Ahılkelek. On 22 September 1828 Russian and Georgian troops under General Paskevich stormed
    it, and the Treaty of Adrianople made it Russian a year later. The Muslim population left for the
    Ottoman Empire and some 30,000 Armenians from Erzurum were settled in their place, which is why 93.8
    per cent of the town was Armenian at the 2014 census, and why the market still talks in Armenian.
    On 4 January 1900 an earthquake levelled much of the town and killed about a thousand people in the
    district; survivors lived in dugouts into the 1920s.


    At the citadel, walk the thick stone walls and towers above the Paravani canyon; in the old town the
    ruins of a church and a caravanserai survive. In the local museum, look for a bronze disc about 40
    cm across from the 1st century AD, thought to have served as an astronomical calendar.


    January here averages −7.3 °C, and the record low is −38 °C. Come in summer, when the plateau turns
    green and the wind smells of cut hay.
  tip: >-
    The citadel is free and open, but paths are uneven and the canyon edges unfenced, so keep children
    close. Akhalkalaki is the plateau's supply town, with ATMs, pharmacies, fuel and simple restaurants;
    the market sells Javakheti potatoes and local cheese. Winters are hard and roads ice over, so winter
    tyres are essential from November to March. The Armenian border is about 29 km away. The 10th-century
    Kumurdo cathedral, about 12 km from town, is well worth adding, and Lake Paravani and Poka lie on
    the Tsalka road.
  route: >-
    The shortest way runs across the plateau: from Tbilisi take the Sh36 through Tskneti to Manglisi,
    then the Sh31 through Tsalka and past Lake Paravani towards Ninotsminda, and finally about 15 km north-west
    on the S11. That makes about 200 km and three and a half hours. It is asphalt throughout, but above
    Tsalka it crosses open upland where wind drifts snow across the road and black ice is common in winter.
    The alternative via Khashuri (E60), Borjomi and Akhaltsikhe (S8), then Aspindza and Khertvisi (S11),
    is about 280 km and nearly five hours, passing the Vardzia turn. Refuel in Tsalka, Ninotsminda or
    Akhaltsikhe. An economy car is enough; in winter, only on winter tyres.
ru:
  name: Крепость Ахалкалаки
  short: >-
    Цитадель XI века на мысу между двумя каньонами, в главном городе Джавахетского плато: 1700 метров
    над морем, армянская речь и ветер, продувающий насквозь.
  body: >-
    **Ахалкалаки значит «новый город», и история не раз заставляла его начинать заново.**


    Город стоит на высоте 1700 метров, на вулканическом Джавахетском плато, где Паравани и Мурджахетисцкали
    прорезали глубокие ущелья. На скалистом мысу, где они сходятся, поднимается цитадель. Её стены начали
    возводить в XI веке при Баграте III, а закончили при Баграте IV. В 1060-х годах на город обрушился
    сельджукский султан Алп-Арслан; надпись в Мирашхани рассказывает, как Парсман Тмогвели и месхетская
    знать обороняли его, а имя Парсмана внесли в поминальную книгу грузинского Иверского монастыря на
    Афоне.


    Монголы сожгли Ахалкалаки в XIII веке. К концу XVI века это был османский окружной город Ахылкелек.
    22 сентября 1828 года русские и грузинские войска под командованием генерала Паскевича взяли его штурмом,
    а через год Адрианопольский мир сделал его российским. Мусульманское население ушло в Османскую империю,
    а на его место поселили около 30 000 армян из Эрзурума — вот почему по переписи 2014 года армяне составляли
    93,8 процента жителей и почему на рынке до сих пор говорят по-армянски. 4 января 1900 года землетрясение
    разрушило значительную часть города и унесло в уезде около тысячи жизней; уцелевшие жили в землянках
    до 1920-х годов.


    В цитадели пройдитесь вдоль толстых каменных стен и башен над каньоном Паравани; в старом городе сохранились
    руины церкви и караван-сарая. В местном музее найдите бронзовый диск около 40 см в поперечнике, I
    века н. э.: считается, что он служил астрономическим календарём.


    Средняя температура января здесь −7,3 °C, абсолютный минимум — −38 °C. Приезжайте летом, когда плато
    зеленеет, а ветер пахнет скошенным сеном.
  tip: >-
    Вход в цитадель свободный, но тропы неровные, а края каньона не огорожены, так что держите детей рядом.
    Ахалкалаки — опорный город плато: здесь есть банкоматы, аптеки, заправки и простые рестораны, а на
    рынке продают джавахетский картофель и местный сыр. Зимы суровые, дороги обледеневают, поэтому с ноября
    по март зимняя резина обязательна. До армянской границы около 29 км. Очень стоит добавить к маршруту
    собор Кумурдо X века примерно в 12 км от города, а озеро Паравани и Пока лежат на дороге в Цалку.
  route: >-
    Самый короткий путь идёт через плато: из Тбилиси по Sh36 через Цхнети до Манглиси, затем по Sh31 через
    Цалку и мимо озера Паравани в сторону Ниноцминды и, наконец, около 15 км на северо-запад по S11. Всего
    около 200 км и три с половиной часа. Асфальт на всём протяжении, но выше Цалки дорога пересекает открытое
    нагорье, где ветер наметает снег на полотно, а зимой часто бывает гололёд. Альтернатива — через Хашури
    (E60), Боржоми и Ахалцихе (S8), затем Аспиндзу и Хертвиси (S11): около 280 км и почти пять часов,
    мимо поворота на Вардзию. Заправляйтесь в Цалке, Ниноцминде или Ахалцихе. Хватит машины эконом-класса;
    зимой — только на зимней резине.
fa:
  name: قلعهٔ آخال‌کالاکی
  short: >-
    ارگی از سدهٔ یازدهم بر دماغه‌ای میان دو درهٔ ژرف، در شهر اصلی فلات جاواختی: ۱,۷۰۰ متر بالاتر از دریا،
    ارمنی‌زبان و رُفته از باد.
  body: >-
    **آخال‌کالاکی یعنی «شهر نو»، و تاریخ بیش از یک بار ناچارش کرده است از نو آغاز کند.**


    شهر در ارتفاع ۱,۷۰۰ متری بر فلات آتشفشانی جاواختی ایستاده است، جایی که رودهای پاراوانی و مورجاختیستسقالی
    دره‌هایی ژرف بریده‌اند. ارگ بر دماغهٔ سنگی‌ای برمی‌خیزد که دو رود در آن به هم می‌رسند. ساخت باروهایش
    در سدهٔ یازدهم در روزگار باگرات سوم آغاز شد و در روزگار باگرات چهارم به پایان رسید. در دههٔ ۱۰۶۰ آلپ
    ارسلان، سلطان سلجوقی، بر شهر تاخت؛ کتیبه‌ای در میراشخانی شرح می‌دهد که پارسمان تموگولی و بزرگان مسختی
    چگونه از آن دفاع کردند، و نام پارسمان در دفتر یادبود صومعهٔ گرجی ایویرون در کوه آتوس ثبت شد.


    مغولان در سدهٔ سیزدهم آخال‌کالاکی را به آتش کشیدند. تا پایان سدهٔ شانزدهم این شهر مرکز ناحیه‌ای عثمانی
    به نام آخیل‌کلک بود. در ۲۲ سپتامبر ۱۸۲۸ سپاهیان روس و گرجی به فرماندهی ژنرال پاسکویچ آن را با یورش
    گرفتند و یک سال بعد پیمان ادرنه آن را از آنِ روسیه کرد. مسلمانان شهر به قلمرو عثمانی کوچیدند و حدود
    ۳۰,۰۰۰ ارمنی از ارزروم به جایشان اسکان یافتند؛ از همین روست که در سرشماری ۲۰۱۴، ۹۳٫۸ درصد ساکنان شهر
    ارمنی بودند و در بازار هنوز ارمنی سخن می‌گویند. در ۴ ژانویهٔ ۱۹۰۰ زمین‌لرزه‌ای بخش بزرگی از شهر را
    ویران کرد و در این ناحیه حدود هزار تن را کشت؛ بازماندگان تا دههٔ ۱۹۲۰ در خانه‌هایی کنده در دل زمین
    زندگی می‌کردند.


    در ارگ بر باروها و برج‌های ستبر سنگی بالای درهٔ پاراوانی قدم بزنید؛ در شهر قدیم ویرانه‌های یک کلیسا
    و یک کاروانسرا بر جا مانده است. در موزهٔ محلی سراغ صفحه‌ای مفرغی به قطر حدود ۴۰ سانتی‌متر از سدهٔ
    یکم میلادی را بگیرید که گمان می‌رود تقویمی نجومی بوده است.


    میانگین دمای ژانویه در اینجا ۷٫۳ درجه زیر صفر است و کمترین دمای ثبت‌شده ۳۸ درجه زیر صفر. تابستان بیایید،
    وقتی فلات سبز می‌شود و باد بوی علفِ تازه‌درو می‌دهد.
  tip: >-
    ورود به ارگ آزاد و رایگان است، اما مسیرها ناهموارند و لبه‌های دره نرده ندارند، پس کودکان را نزدیک
    خود نگه دارید. آخال‌کالاکی شهر تدارکات فلات است، با خودپرداز، داروخانه، پمپ‌بنزین و رستوران‌های ساده؛
    در بازار سیب‌زمینی جاواختی و پنیر محلی می‌فروشند. زمستان‌ها سخت‌اند و جاده‌ها یخ می‌بندند، پس از نوامبر
    تا مارس لاستیک زمستانی ضروری است. مرز ارمنستان حدود ۲۹ کیلومتر فاصله دارد. کلیسای جامع کوموردو از
    سدهٔ دهم، حدود ۱۲ کیلومتر دورتر از شهر، به‌راستی ارزش افزودن به برنامه را دارد، و دریاچهٔ پاراوانی
    و پوکا سر راه تسالکا قرار دارند.
  route: >-
    کوتاه‌ترین راه از روی فلات می‌گذرد: از تفلیس جادهٔ Sh36 را از راه تسخنتی تا مانگلیسی بروید، سپس Sh31
    را از تسالکا و از کنار دریاچهٔ پاراوانی به‌سوی نینوتسمیندا، و در پایان حدود ۱۵ کیلومتر به شمال‌غرب
    از S11. روی‌هم حدود ۲۰۰ کیلومتر و سه ساعت و نیم. سراسر راه آسفالت است، اما بالاتر از تسالکا از فلاتی
    باز می‌گذرد که باد برف را روی جاده می‌انبارد و در زمستان یخ‌زدگی نامرئی رایج است. راه دیگر از خاشوری
    (E60)، بورجومی و آخالتسیخه (S8)، سپس آسپیندزا و خرتویسی (S11) است: حدود ۲۸۰ کیلومتر و نزدیک به پنج
    ساعت، با گذر از کنار دوراهی واردزیا. در تسالکا، نینوتسمیندا یا آخالتسیخه سوخت‌گیری کنید. خودروی اقتصادی
    کافی است؛ در زمستان، فقط با لاستیک زمستانی.
he:
  name: מבצר אחלקלאקי
  short: >-
    מצודה מהמאה ה-11 על שלוחה בין שני קניונים, בעיר הראשית של רמת ג'ווחתי: 1,700 מטר מעל פני הים, דוברת
    ארמנית ומוכת רוחות.
  body: >-
    **אחלקלאקי פירושו "עיר חדשה", וההיסטוריה אילצה אותה להתחיל מחדש יותר מפעם אחת.**


    העיר שוכנת בגובה 1,700 מטר על רמת ג'ווחתי הוולקנית, שבה חצבו הנהרות פרוואני ומורג'חטיסצקלי ערוצים
    עמוקים. על השלוחה הסלעית שבה הם נפגשים מתנשאת המצודה. בניית חומותיה החלה במאה ה-11 בימי בגרט השלישי
    והושלמה בימי בגרט הרביעי. בשנות ה-60 של המאה ה-11 הסתער על העיר הסולטן הסלג'וקי אלפ ארסלאן; כתובת
    במירשחאני מספרת כיצד הגנו עליה פרסמן תמוגוולי ואצילי מסחתי, ושמו של פרסמן נרשם בספר הזיכרון של מנזר
    איבירון הגאורגי שבהר אתוס.


    המונגולים שרפו את אחלקלאקי במאה ה-13. בסוף המאה ה-16 הייתה זו עיר מחוז עות'מאנית בשם אהילקלק. ב-22
    בספטמבר 1828 הסתערו עליה כוחות רוסיים וגאורגיים בפיקודו של הגנרל פסקביץ' וכבשו אותה, ושנה לאחר מכן
    העביר אותה חוזה אדריאנופול לידי רוסיה. האוכלוסייה המוסלמית עזבה לאימפריה העות'מאנית, ובמקומה יושבו
    כ-30,000 ארמנים מארזורום – זו הסיבה שלפי מפקד 2014 היו 93.8 אחוז מתושבי העיר ארמנים, וזו הסיבה שבשוק
    מדברים ארמנית עד היום. ב-4 בינואר 1900 החריבה רעידת אדמה חלק גדול מהעיר והרגה כאלף בני אדם במחוז;
    הניצולים חיו במגורים חפורים באדמה עד שנות ה-20 של המאה העשרים.


    במצודה, הלכו לאורך חומות האבן העבות והמגדלים שמעל קניון הפרוואני; בעיר העתיקה שרדו חורבות של כנסייה
    ושל חאן שיירות. במוזיאון המקומי חפשו דיסקת ברונזה בקוטר של כ-40 ס"מ מהמאה ה-1 לספירה, שלפי ההשערה
    שימשה לוח שנה אסטרונומי.


    הטמפרטורה הממוצעת בינואר היא מינוס 7.3 מעלות צלזיוס, והנמוכה ביותר שנרשמה אי פעם – מינוס 38 מעלות.
    בואו בקיץ, כשהרמה מוריקה והרוח מריחה כמו חציר שזה עתה נקצר.
  tip: >-
    הכניסה למצודה חופשית והיא פתוחה תמיד, אבל השבילים משובשים ושולי הקניון אינם מגודרים, לכן החזיקו ילדים
    קרוב. אחלקלאקי היא עיר האספקה של הרמה, עם כספומטים, בתי מרקחת, תחנות דלק ומסעדות פשוטות; בשוק מוכרים
    תפוחי אדמה מג'ווחתי וגבינה מקומית. החורפים קשים והכבישים קופאים, ולכן מנובמבר עד מרץ צמיגי חורף הם
    הכרח. הגבול עם ארמניה נמצא כ-29 ק"מ משם. בהחלט כדאי להוסיף את קתדרלת קומורדו מהמאה ה-10, כ-12 ק"מ
    מהעיר, ואגם פרוואני ופוקה שוכנים על הדרך לצאלקה.
  route: >-
    הדרך הקצרה ביותר חוצה את הרמה: מטביליסי סעו בכביש Sh36 דרך צקנטי למנגליסי, אחר כך בכביש Sh31 דרך צאלקה
    ולצד אגם פרוואני לכיוון נינוצמינדה, ולבסוף כ-15 ק"מ צפון-מערבה בכביש S11. בסך הכול כ-200 ק"מ ושלוש
    וחצי שעות. אספלט לכל אורך הדרך, אבל מעל צאלקה היא חוצה רמה פתוחה שבה הרוח מערימה שלג על הכביש, ובחורף
    קרח שחור הוא דבר שכיח. החלופה, דרך חשורי (E60), בורג'ומי ואחלציחה (S8) ואחר כך אספינדזה וחרטביסי (S11),
    היא כ-280 ק"מ וכמעט חמש שעות, ועוברת ליד הפנייה לוורדזיה. תדלקו בצאלקה, בנינוצמינדה או באחלציחה. רכב
    מקטגוריית אקונומי מספיק; בחורף – רק עם צמיגי חורף.
ar:
  name: قلعة أخالكالاكي
  short: >-
    قلعة من القرن الحادي عشر على لسان صخري بين خانقين، في كبرى بلدات هضبة جافاخيتي: على ارتفاع 1,700 متر،
    تتكلم الأرمنية وتجلدها الرياح.
  body: >-
    **أخالكالاكي تعني «المدينة الجديدة»، وقد أرغمها التاريخ على أن تبدأ من جديد أكثر من مرة.**


    تقوم البلدة على ارتفاع 1,700 متر فوق هضبة جافاخيتي البركانية، حيث حفر نهرا بارافاني ومورجاخيتيستسكالي
    خانقين عميقين. وعلى اللسان الصخري حيث يلتقيان ترتفع القلعة. بدأ بناء أسوارها في القرن الحادي عشر في
    عهد باغرات الثالث واكتمل في عهد باغرات الرابع. وفي ستينيات القرن الحادي عشر انقضّ السلطان السلجوقي
    ألب أرسلان على البلدة؛ ويروي نقش في ميراشخاني كيف دافع عنها بارسمان تموغفيلي ونبلاء مسخيتي، وقد دُوّن
    اسم بارسمان في سجل الذكرى في دير إيفيرون الجورجي على جبل آثوس.


    أحرق المغول أخالكالاكي في القرن الثالث عشر. وبحلول أواخر القرن السادس عشر كانت مركز قضاء عثمانياً
    يُدعى أخلكلك. وفي 22 سبتمبر 1828 اقتحمتها قوات روسية وجورجية بقيادة الجنرال باسكيفيتش، وبعد عام جعلتها
    معاهدة أدرنة روسية. فرحل السكان المسلمون إلى الدولة العثمانية، وأُسكن مكانهم نحو 30,000 أرمني من أرضروم،
    ولهذا كان الأرمن 93.8 في المئة من سكان البلدة في إحصاء 2014، ولهذا ما زالت السوق تتكلم الأرمنية. وفي
    4 يناير 1900 دمّر زلزال جزءاً كبيراً من البلدة وأودى بحياة نحو ألف شخص في المقاطعة؛ وعاش الناجون في
    مساكن محفورة في الأرض حتى عشرينيات القرن العشرين.


    في القلعة، امشِ على الأسوار الحجرية السميكة والأبراج المطلة على خانق بارافاني؛ وفي البلدة القديمة
    بقيت أطلال كنيسة وخان للقوافل. وفي المتحف المحلي ابحث عن قرص برونزي قطره نحو 40 سم يعود إلى القرن
    الأول للميلاد، يُعتقد أنه استُخدم تقويماً فلكياً.


    يبلغ متوسط حرارة يناير هنا 7.3 درجة تحت الصفر، وأدنى درجة سُجّلت 38 درجة تحت الصفر. تعالَ صيفاً، حين
    تخضرّ الهضبة وتفوح من الريح رائحة الدريس المحصود.
  tip: >-
    الدخول إلى القلعة مجاني وهي مفتوحة دائماً، لكن الممرات وعرة وحوافّ الخانق بلا سياج، فأبقِ الأطفال
    قريبين منك. أخالكالاكي هي بلدة التموين في الهضبة، ففيها صرافات آلية وصيدليات ومحطات وقود ومطاعم بسيطة؛
    وفي السوق تُباع بطاطا جافاخيتي والجبن المحلي. الشتاء قاسٍ والطرق تتجمّد، لذا فإطارات الشتاء ضرورية
    من نوفمبر إلى مارس. الحدود الأرمنية على بعد نحو 29 كم. وتستحق كاتدرائية كوموردو من القرن العاشر، على
    بعد نحو 12 كم من البلدة، أن تضيفها إلى رحلتك، أما بحيرة بارافاني وبوكا فتقعان على طريق تسالكا.
  route: >-
    أقصر الطرق يعبر الهضبة: من تبليسي اسلك Sh36 عبر تسخنيتي إلى مانغليسي، ثم Sh31 عبر تسالكا مروراً ببحيرة
    بارافاني باتجاه نينوتسميندا، وأخيراً نحو 15 كم إلى الشمال الغربي على S11. المجموع نحو 200 كم وثلاث
    ساعات ونصف. الطريق معبّد بالكامل، لكنه فوق تسالكا يعبر نجداً مكشوفاً تكدّس فيه الريح الثلج على الطريق،
    ويكثر الجليد الأسود في الشتاء. والبديل عبر خاشوري (E60) وبورجومي وأخالتسيخه (S8)، ثم أسبيندزا وخيرتفيسي
    (S11)، نحو 280 كم وقرابة خمس ساعات، مروراً بمنعطف فاردزيا. تزوّد بالوقود في تسالكا أو نينوتسميندا
    أو أخالتسيخه. السيارة الاقتصادية تكفي؛ وفي الشتاء بإطارات شتوية فقط.
