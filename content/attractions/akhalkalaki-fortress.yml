ka:
  name: ახალქალაქის ციხე
  short: >-
    ჯავახეთის პლატოს მთავარი ქალაქი — XI საუკუნის ციხის ნანგრევები, რუსული გარნიზონის ეპოქის კვალი და
    სომხურ-ქართული მთის კულტურა.
  body: >-
    **ახალქალაქი ის ადგილია, სადაც საქართველო ყველაზე მაღალმთიან პლატოზე ცხოვრობს.** ქალაქი ზღვის დონიდან
    1700 მეტრზე დგას, ჯავახეთის ვულკანურ ზეგანზე — ზამთარში აქ საქართველოს ერთ-ერთი ყველაზე ცივი ადგილია,
    ზაფხულში კი გრილი და მწვანე.


    სახელი „ახალ ქალაქს" ნიშნავს: ის ბაგრატ IV-მ 1064 წელს დააარსა, თუმცა უკვე 1066 წელს სელჩუკებმა დაანგრიეს.
    ძველი ციხის ნანგრევები ორი მდინარის შესართავთან, კლდოვან კონცხზეა — შემორჩენილია კედლები და კოშკები,
    შიგნით კი თავისუფლად შეხვალ. 1829 წლის შემდეგ ქალაქი რუსეთის იმპერიის სასაზღვრო გარნიზონად იქცა, ციხის
    ტერიტორიაზე კი ამ ეპოქის ნაგებობებიც ჩანს.


    დღეს ახალქალაქი სომხურ-ქართული ქალაქია — მოსახლეობის დიდი უმრავლესობა სომეხია, და ეს ბაზარშივე იგრძნობა:
    ენა, პური, ყავა. რა ნახო:


    - ციხის ნანგრევები მდინარის კანიონის თავზე

    - ცოცხალი ბაზარი — ჯავახური კარტოფილი, ყველი და თაფლი

    - კუმურდოს X საუკუნის ტაძარი (12 კმ) — იდეალური დამატება


    ახალქალაქი ჯავახეთის ტბების, ფოკასა და ვარძიის მარშრუტების ბუნებრივი ჰაბია.
  tip: >-
    ციხეში შესვლა უფასოა და შეზღუდვების გარეშეა — მოაჯირები და აბრები არ არის, კიდეებთან ფრთხილად. საჭმელად
    ადგილობრივი სომხური სამზარეულო სცადე. ზამთარში ძალიან ცივა (-20°C ჩვეულებრივი ამბავია) და თოვლიანი
    ქუჩები ყინულდება; ზაფხულს ან შემოდგომას აირჩიე. ბანკომატი, აფთიაქი და საწვავი ქალაქშია — ჯავახეთის
    პლატოზე შემდეგი ინფრასტრუქტურა იშვიათია. საზღვრამდე (სომხეთი) აქედან 30 კმ-ზე ნაკლებია.
  route: >-
    ორი გზა გაქვს. უმოკლესი: თბილისიდან მანგლისისა და წალკის გავლით ნინოწმინდის მიმართულებით — დაახლოებით
    200 კმ, 3:30 სთ; გზა ბოლო წლებში მთლიანად გარემონტდა და ასფალტია, თუმცა ზამთარში წალკის ზეგანზე ქარბუქი
    და ლიპი გზაა შესაძლებელი. კლასიკური ვარიანტი: E60-ით ხაშურამდე, შემდეგ ბორჯომი-ახალციხე-ხერთვისი —
    დაახლოებით 250 კმ, 4:30 სთ, გზადაგზა ვარძიის შესახვევით. საწვავი წალკაში ან ახალციხეში აიღე. ეკონომ-კლასი
    საკმარისია, ზამთარში — მხოლოდ ზამთრის საბურავებით.
en:
  name: Akhalkalaki Fortress
  short: >-
    The hub town of the Javakheti plateau — 11th-century fortress ruins, traces of the Russian garrison
    era and Armenian-Georgian highland culture.
  body: >-
    **Akhalkalaki is where Georgia lives on its highest plateau.** The town sits at 1,700 metres on the
    volcanic upland of Javakheti — one of the coldest inhabited places in the country in winter, cool
    and green in summer.


    The name means "new town": Bagrat IV founded it in 1064, and the Seljuks destroyed it as early as
    1066. The old fortress ruins stand on a rocky spur above the confluence of two rivers — stretches
    of wall and towers survive, and you can wander in freely. After 1829 the town became a border garrison
    of the Russian Empire, and buildings from that era are still visible on the fortress grounds.


    Today Akhalkalaki is an Armenian-Georgian town — the large majority of residents are Armenian, which
    you feel immediately in the bazaar: the language, the bread, the coffee. What to see:


    - The fortress ruins above the river canyon

    - The lively bazaar — Javakheti potatoes, cheese and honey

    - The 10th-century Kumurdo cathedral 12 km away, the perfect add-on


    Akhalkalaki makes a natural hub for the Javakheti lakes, Poka nunnery and the Vardzia route.
  tip: >-
    The fortress is free and unfenced — no railings, no signs, so watch your step near the edges. For
    food, try the local Armenian kitchen. Winters are brutally cold (-20°C is routine) and streets ice
    over; aim for summer or autumn instead. ATMs, pharmacies and fuel are in town — infrastructure gets
    scarce farther out on the Javakheti plateau. The Armenian border is under 30 km away.
  route: >-
    You have two options. The shortest: from Tbilisi via Manglisi and Tsalka towards Ninotsminda — about
    200 km, 3:30; the road was fully rebuilt in recent years and is asphalt, though winter brings drifting
    snow and ice up on the Tsalka plateau. The classic option: E60 to Khashuri, then Borjomi-Akhaltsikhe-Khertvisi
    — about 250 km, 4:30, passing the Vardzia turnoff on the way. Refuel in Tsalka or Akhaltsikhe. An
    economy car suffices; in winter only with proper winter tyres.
ru:
  name: Крепость Ахалкалаки
  short: >-
    Главный город Джавахетского плато — руины крепости XI века, следы русской гарнизонной эпохи и армяно-грузинская
    горская культура.
  body: >-
    **Ахалкалаки — это место, где Грузия живёт на своём самом высоком плато.** Город стоит на высоте 1700
    метров на вулканическом нагорье Джавахети: зимой это одно из самых холодных обитаемых мест страны,
    летом — прохладное и зелёное.


    Название означает «новый город»: его основал Баграт IV в 1064 году, а уже в 1066-м город разрушили
    сельджуки. Руины старой крепости стоят на скалистом мысу над слиянием двух рек — сохранились участки
    стен и башни, внутрь можно зайти свободно. После 1829 года город стал пограничным гарнизоном Российской
    империи, и постройки той эпохи до сих пор видны на территории крепости.


    Сегодня Ахалкалаки — армяно-грузинский город: подавляющее большинство жителей армяне, и это чувствуется
    прямо на базаре — язык, хлеб, кофе. Что смотреть:


    - Руины крепости над речным каньоном

    - Живой базар — джавахетская картошка, сыр и мёд

    - Кафедральный собор Кумурдо X века в 12 км — идеальное дополнение


    Ахалкалаки — естественный хаб для джавахетских озёр, монастыря Пока и маршрута на Вардзию.
  tip: >-
    Вход в крепость свободный, ограждений нет — ни перил, ни табличек, у обрывов будьте внимательны. Из
    еды пробуйте местную армянскую кухню. Зимы здесь суровые (-20°C — обычное дело), улицы обледеневают;
    лучше ехать летом или осенью. Банкоматы, аптеки и заправки — в городе: дальше по плато инфраструктура
    редеет. До армянской границы отсюда меньше 30 км.
  route: >-
    Есть два варианта. Кратчайший: из Тбилиси через Манглиси и Цалку в сторону Ниноцминды — около 200
    км, 3:30; дорогу в последние годы полностью отремонтировали, асфальт, но зимой на Цалкском плато возможны
    перемёты и гололёд. Классический: по E60 до Хашури, затем Боржоми-Ахалцихе-Хертвиси — около 250 км,
    4:30, по пути поворот на Вардзию. Заправляйтесь в Цалке или Ахалцихе. Эконом-класса достаточно; зимой
    — только на зимней резине.
fa:
  name: قلعهٔ آخال‌کالاکی
  short: شهر مرکزی فلات جاواختی — ویرانه‌های قلعهٔ سدهٔ یازدهم، ردپای دوران پادگان روسی و فرهنگ کوهستانی
    ارمنی-گرجی.
  body: >-
    **آخال‌کالاکی جایی است که گرجستان بر بلندترین فلات خود زندگی می‌کند.** شهر در ارتفاع 1700 متری بر
    بلندی‌های آتشفشانی جاواختی نشسته است — در زمستان از سردترین نقاط مسکونی کشور و در تابستان خنک و سرسبز.


    نامش یعنی «شهر نو»: باگرات چهارم در سال 1064 آن را بنیاد نهاد و سلجوقیان همان 1066 ویرانش کردند. ویرانه‌های
    قلعهٔ کهن بر زبانه‌ای صخره‌ای بالای محل تلاقی دو رود ایستاده است — بخش‌هایی از دیوارها و برج‌ها مانده
    و ورود آزاد است. پس از 1829 شهر پادگان مرزی امپراتوری روسیه شد و بناهای آن دوران هنوز در محوطهٔ قلعه
    دیده می‌شوند.


    امروز آخال‌کالاکی شهری ارمنی-گرجی است — اکثریت بزرگ ساکنان ارمنی‌اند و این را همان اول در بازار حس
    می‌کنید: زبان، نان، قهوه. چه ببینید:


    - ویرانه‌های قلعه بر فراز درهٔ رود

    - بازار زنده — سیب‌زمینی، پنیر و عسل جاواختی

    - کلیسای جامع کوموردو از سدهٔ دهم در 12 کیلومتری — مکمل بی‌نقص


    آخال‌کالاکی پایگاه طبیعی سفر به دریاچه‌های جاواختی، صومعهٔ پوکا و مسیر واردزیاست.
  tip: >-
    ورود به قلعه رایگان و بی‌حصار است — نه نرده‌ای، نه تابلویی؛ نزدیک پرتگاه‌ها مراقب باشید. برای غذا
    آشپزی ارمنی محلی را امتحان کنید. زمستان‌ها بی‌رحم است (منفی 20 درجه عادی است) و خیابان‌ها یخ می‌زنند؛
    تابستان یا پاییز را انتخاب کنید. خودپرداز، داروخانه و بنزین در شهر هست — دورتر روی فلات جاواختی زیرساخت
    کمیاب می‌شود. مرز ارمنستان کمتر از 30 کیلومتر فاصله دارد.
  route: >-
    دو راه دارید. کوتاه‌ترین: از تفلیس از راه مانگلیسی و تسالکا به سوی نینوتسمیندا — حدود 200 کیلومتر،
    3:30 ساعت؛ جاده در سال‌های اخیر کاملاً بازسازی شده و آسفالت است، اما در زمستان روی فلات تسالکا کولاک
    و یخ‌زدگی ممکن است. مسیر کلاسیک: با E60 تا خاشوری، سپس بورجومی-آخالتسیخه-خرتویسی — حدود 250 کیلومتر،
    4:30 ساعت، با انشعاب واردزیا در راه. بنزین را در تسالکا یا آخالتسیخه بزنید. خودروی اقتصادی کافی است؛
    در زمستان فقط با لاستیک زمستانی.
he:
  name: מבצר אחלקלאקי
  short: עיר המרכז של רמת ג'ווחתי — חורבות מבצר מהמאה ה-11, עקבות עידן חיל המצב הרוסי ותרבות הרים ארמנית-גאורגית.
  body: >-
    **אחלקלאקי היא המקום שבו גאורגיה חיה על הרמה הגבוהה ביותר שלה.** העיר יושבת בגובה 1,700 מטר על הרמה
    הוולקנית של ג'ווחתי — בחורף זהו מהמקומות המיושבים הקרים ביותר במדינה, ובקיץ קריר וירוק.


    פירוש השם "עיר חדשה": בגרט הרביעי ייסד אותה ב-1064, וכבר ב-1066 החריבו אותה הסלג'וקים. חורבות המבצר
    הישן ניצבות על לשון סלע מעל מפגש שני נהרות — שרדו קטעי חומה ומגדלים, והכניסה חופשית לגמרי. אחרי 1829
    הפכה העיר לחיל מצב גבולי של האימפריה הרוסית, ומבנים מאותה תקופה עדיין נראים בשטח המבצר.


    היום אחלקלאקי היא עיר ארמנית-גאורגית — רוב מכריע של התושבים ארמנים, וזה מורגש מיד בבזאר: השפה, הלחם,
    הקפה. מה רואים:


    - חורבות המבצר מעל קניון הנהר

    - הבזאר התוסס — תפוחי אדמה, גבינה ודבש של ג'ווחתי

    - קתדרלת קומורדו מהמאה ה-10, במרחק 12 ק"מ — התוספת המושלמת


    אחלקלאקי היא הבסיס הטבעי לאגמי ג'ווחתי, למנזר פוקה ולמסלול ורדזיה.
  tip: >-
    הכניסה למבצר חופשית והשטח פתוח — אין מעקות ואין שילוט, אז היזהרו ליד המצוקים. באוכל, לכו על המטבח
    הארמני המקומי. החורף אכזרי (מינוס 20 זה שגרה) והרחובות קופאים; עדיפים קיץ או סתיו. כספומטים, בתי מרקחת
    ודלק יש בעיר — הלאה על רמת ג'ווחתי התשתית מתדלדלת. הגבול הארמני במרחק פחות מ-30 ק"מ.
  route: >-
    יש שתי אפשרויות. הקצרה: מטביליסי דרך מנגליסי וצאלקה לכיוון נינוצמינדה — כ-200 ק"מ, 3:30; הכביש שופץ
    כולו בשנים האחרונות וסלול, אבל בחורף על רמת צאלקה ייתכנו סחף שלגים וקרח. הקלאסית: E60 עד חשורי, ואז
    בורג'ומי-אחלציחה-חרטוויסי — כ-250 ק"מ, 4:30, עם הפנייה לורדזיה בדרך. תדלקו בצאלקה או באחלציחה. רכב
    חסכוני מספיק; בחורף רק עם צמיגי חורף.
ar:
  name: قلعة أخالكالاكي
  short: >-
    مدينة هضبة جافاخيتي المحورية — أطلال قلعة من القرن الحادي عشر وآثار حقبة الحامية الروسية وثقافة جبلية
    أرمنية-جورجية.
  body: >-
    **أخالكالاكي هي المكان الذي تعيش فيه جورجيا على أعلى هضابها.** تقوم المدينة على ارتفاع 1700 متر فوق
    مرتفعات جافاخيتي البركانية — في الشتاء من أبرد الأماكن المأهولة في البلاد، وفي الصيف باردة الهواء
    خضراء.


    الاسم يعني «المدينة الجديدة»: أسسها باغرات الرابع عام 1064، ودمرها السلاجقة عام 1066. تقوم أطلال القلعة
    القديمة على نتوء صخري فوق ملتقى نهرين — بقيت أجزاء من الأسوار والأبراج والدخول إليها حر تماماً. وبعد
    1829 صارت المدينة حامية حدودية للإمبراطورية الروسية، وما زالت مبانٍ من تلك الحقبة ظاهرة في أرض القلعة.


    اليوم أخالكالاكي مدينة أرمنية-جورجية — الغالبية العظمى من سكانها أرمن، وهو ما تلمسه فوراً في البازار:
    اللغة والخبز والقهوة. ما الذي تراه:


    - أطلال القلعة فوق وادي النهر

    - البازار الحي — بطاطا جافاخيتي وجبنها وعسلها

    - كاتدرائية كوموردو من القرن العاشر على بعد 12 كم — الإضافة المثالية


    أخالكالاكي هي القاعدة الطبيعية لبحيرات جافاخيتي ودير بوكا وطريق فاردزيا.
  tip: >-
    دخول القلعة مجاني والموقع مفتوح — لا سياج ولا لافتات، فانتبه قرب الحواف. في الطعام جرّب المطبخ الأرمني
    المحلي. الشتاء قاسٍ (عشرون تحت الصفر أمر معتاد) والشوارع تتجمد؛ فاختر الصيف أو الخريف. الصرافات والصيدليات
    والوقود في المدينة — وأبعد من ذلك على هضبة جافاخيتي تشح المرافق. الحدود الأرمنية على أقل من 30 كم.
  route: >-
    أمامك طريقان. الأقصر: من تبليسي عبر مانغليسي وتسالكا باتجاه نينوتسميندا — نحو 200 كم و3:30 ساعة؛ أعيد
    تأهيل الطريق كاملاً في السنوات الأخيرة وهو أسفلت، لكن الشتاء قد يجلب انجراف الثلوج والجليد على هضبة
    تسالكا. والطريق الكلاسيكي: E60 حتى خاشوري ثم بورجومي-أخالتسيخه-خرتفيسي — نحو 250 كم و4:30 ساعة، ويمر
    بمفرق فاردزيا. تزود بالوقود في تسالكا أو أخالتسيخه. سيارة اقتصادية تكفي؛ وفي الشتاء لا تذهب إلا بإطارات
    شتوية.
