ka:
  name: დავით გარეჯის სამონასტრო კომპლექსი
  short: VI საუკუნის კლდეში ნაკვეთი მონასტრები ნახევრადუდაბნო ქედზე — საქართველოს ყველაზე უჩვეულო ლანდშაფტი.
  body: >-
    დავით გარეჯა თბილისიდან სამხრეთ-აღმოსავლეთით, გარეჯის ქედზეა და კახეთის დანარჩენ ნაწილს არაფრით ჰგავს:
    ვენახებისა და ტყის ნაცვლად აქ ნახევრადუდაბნოა — უხეო, ტალღოვანი, გაზაფხულზე მწვანე, ზაფხულში კი მოყვითალო-რუხი.
    კომპლექსი VI საუკუნეში დაარსა ასურელმა მამამ **დავით გარეჯელმა** და საუკუნეების განმავლობაში ათეულობით
    სამონასტრო ერთეულად გაიზარდა, რომლებიც ქედის მთელ სიგრძეზეა გაფანტული.


    მთავარი და ყველაზე ხელმისაწვდომია ლავრა — მოქმედი მონასტერი ტერასებად აწყობილი ეზოებით, კლდეში ნაკვეთი
    სენაკებით, სამრეკლოთი და დავითის სამარხით. ლავრიდან ბილიკი ქედის თხემზე ადის და მეორე მხარეს, უდაბნოს
    კომპლექსთან ჩადის, სადაც გამოქვაბულების კედლებზე XI–XIII საუკუნეების ფრესკებია შემორჩენილი. ასვლა-ჩასვლა
    დაახლოებით საათნახევარია და გზა ციცაბოა.


    ლანდშაფტი აქ თავად ატრაქციაა. ქედის თხემიდან თვალწინ იშლება უსასრულო სტეპი, გაზაფხულზე ყვავილებით
    დაფარული; გვხვდება კუები, გველები და მტაცებელი ფრინველები. საუკეთესო დროა აპრილი და მაისი, როცა ჯერ
    არ ცხელა და მცენარეულობა ცოცხალია. ზაფხულის შუადღე რთულია: ჩრდილი პრაქტიკულად არ არსებობს და ტემპერატურა
    ორმოც გრადუსსაც აღწევს. ისტორიულად გარეჯა უდიდესი სამონასტრო ცენტრი იყო და მისი ფრესკული მემკვიდრეობა
    ქართული შუასაუკუნეების ხელოვნების ერთ-ერთი მთავარი ძეგლია. ბევრი გამოქვაბული დღეს დაუცველია და მდგომარეობა
    თანდათან უარესდება, ამიტომ ფრესკებთან შეხება და მათი განათება აკრძალულია.
  tip: >-
    კომპლექსის ნაწილი სადავო სასაზღვრო მონაკვეთზე გადის და უდაბნოს გამოქვაბულებამდე ასვლა პერიოდულად იკეტება
    — ეს ჩვეულებრივი პრაქტიკაა და ადგილზე მისვლისას მარტივად შეიტყობთ ლავრის შესასვლელთან. ლავრა თითქმის
    ყოველთვის ღიაა. წაიღეთ წყალი, ქუდი და მზისგან დამცავი — ჩრდილი არსად არის; ჩაცმა მონასტერში მოკრძალებული.
    კაფე, ბანკომატი და ტუალეტი მხოლოდ უდაბნოს სოფელშია, სამოცდაათი წუთის სავალზე.
  route: >-
    თბილისიდან გადით რუსთავის ან საგარეჯოს გზით და შემდეგ სოფელ უდაბნოს მიმართულებით — სულ დაახლოებით
    75 კმ და საათნახევარი-ორი საათი. ძირითადი მონაკვეთი მოასფალტებულია, ბოლო კილომეტრები კი უხეშია და
    გამოზამთრების შემდეგ ორმოებით. მშრალ ამინდში ეკონომ კლასიც გაივლის, მაგრამ მაღალი კლირენსის კროსოვერი
    გაცილებით კომფორტულია და წვიმის შემდეგ სასურველიც. ბოლო საიმედო ბენზინგასამართი საგარეჯოშია — შემდეგ
    ორმოცდაათი კილომეტრი პრაქტიკულად უკაცრიელია, ამიტომ ავზი წინასწარ შეავსეთ.
en:
  name: David Gareja
  short: Sixth-century cave monasteries carved into a semi-desert ridge — the most unusual landscape in
    Georgia.
  body: >-
    David Gareja lies south-east of Tbilisi on the Gareja ridge and looks nothing like the rest of Kakheti.
    Instead of vineyards and forest there is semi-desert: treeless, rolling, green for a few weeks in
    spring and a bleached yellow-grey for the rest of the year. The complex was founded in the sixth century
    by **David Garejeli**, one of the Assyrian Fathers, and grew over the centuries into dozens of separate
    monastic units scattered along the ridge.


    The main and most accessible is the Lavra — a working monastery of terraced courtyards, cells cut
    into the rock face, a bell tower and David's tomb. From the Lavra a path climbs to the crest of the
    ridge and drops down the far side to the Udabno complex, where cave walls keep frescoes of the eleventh
    to thirteenth centuries. The round trip up and back takes roughly an hour and a half over steep, loose
    ground.


    The landscape here is the attraction in its own right. From the crest an apparently endless steppe
    opens out, covered in flowers in April and May; tortoises, snakes and birds of prey are common sights.
    Spring is by far the best season — mild and green. A summer midday is hard going: there is effectively
    no shade and temperatures reach the high thirties.
  tip: >-
    Part of the complex runs along a disputed section of the border, and the climb up to the Udabno caves
    is periodically closed. This is routine rather than dramatic — ask at the Lavra gate when you arrive
    and you will be told the current situation; the Lavra itself is almost always open. Bring water, a
    hat and sun protection, since there is no shade anywhere on the ridge, and dress modestly for the
    monastery. The nearest café, ATM and toilet are back in Udabno village.
  route: >-
    Leave Tbilisi either via Rustavi or via Sagarejo, then follow signs towards the village of Udabno
    — about 75 km and one hour fifty in total. Most of the route is paved, but the final stretch is rough
    and develops potholes after winter. In dry weather an economy car will get through; a crossover with
    higher ground clearance is far more comfortable and genuinely advisable after rain. The last dependable
    fuel is in Sagarejo — the following fifty kilometres are close to empty, so fill the tank before you
    turn off.
ru:
  name: Давид Гареджи
  short: Пещерные монастыри VI века, вырубленные в полупустынном хребте, — самый необычный ландшафт Грузии.
  body: >-
    Давид Гареджи лежит к юго-востоку от Тбилиси, на Гареджийском хребте, и совершенно не похож на остальную
    Кахетию. Вместо виноградников и леса здесь полупустыня: безлесная, холмистая, зелёная несколько недель
    весной и выгоревшая жёлто-серая всё остальное время. Комплекс основал в VI веке **Давид Гареджийский**,
    один из ассирийских отцов, и за столетия он разросся в десятки отдельных монашеских обителей, разбросанных
    вдоль хребта.


    Главная и самая доступная из них — Лавра: действующий монастырь с террасными дворами, кельями, вырубленными
    в скале, колокольней и гробницей самого Давида. От Лавры тропа поднимается на гребень и спускается
    по другую сторону к комплексу Удабно, где на стенах пещер сохранились фрески XI–XIII веков. Подъём
    и возвращение занимают около полутора часов по крутому и сыпучему склону.


    Сам ландшафт здесь не менее интересен, чем постройки. С гребня открывается кажущаяся бесконечной степь,
    в апреле и мае покрытая цветами; часто попадаются черепахи, змеи и хищные птицы. Весна — безусловно
    лучший сезон: прохладно и зелено. Летний полдень даётся тяжело: тени фактически нет, температура доходит
    до сорока градусов.
  tip: >-
    Часть комплекса проходит по спорному участку границы, и подъём к пещерам Удабно периодически закрывают.
    Это рабочая ситуация, а не повод отказываться от поездки: у ворот Лавры вам сразу скажут, как обстоят
    дела сегодня, а сама Лавра открыта почти всегда. Возьмите воду, головной убор и защиту от солнца —
    тени на хребте нет нигде; в монастыре нужна скромная одежда. Ближайшие кафе, банкомат и туалет — в
    селе Удабно.
  route: >-
    Из Тбилиси выезжайте через Рустави или через Сагареджо, затем следуйте указателям на село Удабно —
    всего около 75 км и примерно час пятьдесят. Большая часть маршрута асфальтирована, но последний отрезок
    разбитый и после зимы покрывается ямами. В сухую погоду проедет и машина эконом-класса, однако кроссовер
    с большим клиренсом заметно комфортнее и после дождя действительно предпочтителен. Последняя надёжная
    заправка — в Сагареджо: следующие пятьдесят километров практически безлюдны, так что бак заполняйте
    заранее.
fa:
  name: داوید گارجا
  short: صومعه‌های غاری سدهٔ ششم که در ستیغی نیمه‌بیابانی کنده شده‌اند — غریب‌ترین چشم‌انداز گرجستان.
  body: >-
    داوید گارجا در جنوب‌شرق تفلیس روی ستیغ گارجا قرار دارد و هیچ شباهتی به بقیهٔ کاختی ندارد. به جای تاکستان
    و جنگل، نیمه‌بیابان است: بی‌درخت و موج‌دار، چند هفته در بهار سبز و باقی سال زرد-خاکستری و رنگ‌پریده.
    مجموعه در سدهٔ ششم به دست **داوید گارجلی**، یکی از پدران آشوری، بنیاد گذاشته شد و در طول سده‌ها به
    ده‌ها واحد رهبانی جداگانه در امتداد ستیغ گسترش یافت.


    اصلی‌ترین و دسترس‌پذیرترین بخش لاورا است — صومعه‌ای فعال با حیاط‌های پلکانی، حجره‌هایی کنده‌شده در
    دیوارهٔ صخره، یک برج ناقوس و آرامگاه داوید. از لاورا کوره‌راهی تا خط‌الرأس بالا می‌رود و از سوی دیگر
    به مجموعهٔ اودابنو پایین می‌آید، جایی که دیوارهای غارها فرسکوهای سدهٔ یازدهم تا سیزدهم را نگه داشته‌اند.
    رفت و برگشت روی زمین تند و سست حدود یک ساعت و نیم طول می‌کشد.


    خود چشم‌انداز هم به‌تنهایی جاذبه است. از خط‌الرأس استپی ظاهراً بی‌پایان باز می‌شود که در آوریل و مه
    پوشیده از گل است؛ لاک‌پشت، مار و پرندگان شکاری منظرهٔ رایج‌اند. بهار بی‌گمان بهترین فصل است، ملایم
    و سبز. ظهر تابستان سخت می‌گذرد: عملاً هیچ سایه‌ای نیست و دما به اواخر دههٔ سی درجه می‌رسد.
  tip: >-
    بخشی از مجموعه در امتداد قطعه‌ای مورد اختلاف از مرز است و صعود به غارهای اودابنو هر از گاهی بسته می‌شود.
    این امری روزمره است نه دراماتیک — موقع رسیدن کنار دروازهٔ لاورا بپرسید و وضعیت روز را به شما می‌گویند؛
    خود لاورا تقریباً همیشه باز است. آب، کلاه و ضدآفتاب همراه ببرید، چون روی ستیغ هیچ‌جا سایه نیست، و
    برای صومعه پوشش محجوب داشته باشید. نزدیک‌ترین کافه، خودپرداز و سرویس بهداشتی در روستای اودابنو است.
  route: >-
    از تفلیس یا از راه روستاوی بیرون بروید یا از راه ساگارجو، و بعد تابلوهای روستای اودابنو را دنبال کنید
    — در مجموع حدود 75 کیلومتر و یک ساعت و پنجاه دقیقه. بیشتر مسیر آسفالت است، اما بخش پایانی ناهموار
    است و پس از زمستان چاله برمی‌دارد. در هوای خشک خودروی اقتصادی رد می‌شود؛ کراس‌اوور با ارتفاع کف بیشتر
    بسیار راحت‌تر و پس از باران واقعاً توصیه‌شدنی است. آخرین سوخت مطمئن در ساگارجو است — پنجاه کیلومتر
    بعدی تقریباً خالی است، پس پیش از پیچیدن باک را پر کنید.
he:
  name: דוד גארג'ה
  short: מנזרי מערות מן המאה השישית החצובים ברכס מדברי-למחצה — הנוף החריג ביותר בגאורגיה.
  body: >-
    דוד גארג'ה שוכן מדרום-מזרח לטביליסי על רכס גארג'ה ואינו דומה כלל לשאר קחתי. במקום כרמים ויער יש כאן
    מדבר-למחצה: נטול עצים, גלי, ירוק לכמה שבועות באביב ואפור-צהוב מולבן בשאר השנה. המתחם נוסד במאה השישית
    בידי **דוד גארג'לי**, אחד האבות האשורים, וגדל במרוצת המאות לעשרות יחידות נזירות נפרדות הפזורות לאורך
    הרכס.


    העיקרי והנגיש שבהם הוא הלאברה — מנזר פעיל של חצרות מדורגות, תאים חצובים בקיר הסלע, מגדל פעמונים וקברו
    של דוד. מהלאברה מטפס שביל אל רכס ההר ויורד בצדו האחר אל מתחם אודבנו, שם שומרים קירות המערות ציורי
    קיר מן המאות ה-11 עד ה-13. ההליכה הלוך ושוב אורכת כשעה וחצי על קרקע תלולה ומתפוררת.


    הנוף עצמו הוא אטרקציה בפני עצמה. מרכס ההר נפתחת ערבה שנראית אינסופית, מכוסה פרחים באפריל ובמאי; צבי
    יבשה, נחשים ועופות דורסים הם מראה שכיח. האביב הוא ללא ספק העונה הטובה ביותר — נעים וירוק. צהריים של
    קיץ קשים כאן: אין כמעט צל והטמפרטורות מגיעות לשלושים וכמה מעלות גבוהות.
  tip: >-
    חלק מהמתחם משתרע לאורך קטע גבול שנוי במחלוקת, והטיפוס אל מערות אודבנו נסגר מדי פעם. זהו עניין שגרתי
    ולא דרמטי — שאלו בשער הלאברה כשאתם מגיעים ותקבלו את המצב העדכני; הלאברה עצמה פתוחה כמעט תמיד. קחו
    מים, כובע והגנה מהשמש, כי אין צל בשום מקום על הרכס, והתלבשו בצניעות לביקור במנזר. בית הקפה, הכספומט
    והשירותים הקרובים ביותר נמצאים בכפר אודבנו.
  route: >-
    צאו מטביליסי דרך רוסתאווי או דרך סאגארג'ו, ואז עקבו אחרי השילוט לכפר אודבנו — כ-75 ק״מ ושעה וחמישים
    בסך הכול. רוב המסלול סלול, אבל הקטע האחרון משובש ומפתח בורות אחרי החורף. במזג אוויר יבש רכב רגיל יעבור;
    קרוסאובר עם גובה גחון גדול יותר נוח בהרבה ומומלץ באמת אחרי גשם. הדלק האמין האחרון נמצא בסאגארג'ו —
    חמישים הקילומטרים שאחריו ריקים כמעט לגמרי, אז מלאו את המכל לפני הפנייה.
ar:
  name: ديفيد غاريجا
  short: أديرة كهفية من القرن السادس منحوتة في سلسلة شبه صحراوية — أغرب مشهد طبيعي في جورجيا.
  body: >-
    يقع ديفيد غاريجا جنوب شرق تبليسي على سلسلة غاريجا، ولا يشبه بقية كاخيتي في شيء. فبدلاً من الكروم والغابات
    هناك شبه صحراء: بلا أشجار، متموجة، خضراء بضعة أسابيع في الربيع ثم صفراء رمادية باهتة بقية العام. أسس
    المجمعَ في القرن السادس **ديفيد غاريجيلي**، أحد الآباء الآشوريين، ونما على مر القرون إلى عشرات الوحدات
    الرهبانية المتفرقة على امتداد السلسلة.


    وأهمها وأيسرها وصولاً هو اللافرا — دير عامل بأفنية مدرّجة وقلالٍ منحوتة في وجه الصخر وبرج أجراس وضريح
    ديفيد. ومن اللافرا يصعد درب إلى قمة السلسلة وينزل من الجهة الأخرى إلى مجمع أودابنو، حيث تحتفظ جدران
    الكهوف برسوم جدارية من القرن الحادي عشر إلى الثالث عشر. وتستغرق الجولة ذهاباً وإياباً نحو ساعة ونصف
    على أرض حادة وسائبة.


    والمشهد الطبيعي نفسه جاذب قائم بذاته. فمن القمة ينفتح سهب يبدو بلا نهاية، تغطيه الأزهار في أبريل ومايو؛
    والسلاحف البرية والأفاعي والجوارح مشهد مألوف. والربيع أفضل المواسم بلا منازع — معتدل وأخضر. أما ظهيرة
    الصيف فشاقة: لا ظل عملياً، والحرارة تبلغ أواخر الثلاثينيات.
  tip: >-
    يمتد جزء من المجمع على مقطع حدودي متنازع عليه، والصعود إلى كهوف أودابنو يُغلق من حين لآخر. وهذا أمر
    روتيني لا دراماتيكي — اسأل عند بوابة اللافرا حين تصل وستُخبَر بالوضع الراهن؛ واللافرا نفسها مفتوحة
    دائماً تقريباً. احمل ماءً وقبعة وواقي شمس، فلا ظل في أي موضع على السلسلة، والبس لباساً محتشماً لزيارة
    الدير. وأقرب مقهى وصراف آلي ودورة مياه في قرية أودابنو.
  route: >-
    اخرج من تبليسي إما عبر روستافي أو عبر ساغاريجو، ثم اتبع اللافتات نحو قرية أودابنو — نحو 75 كم وساعة
    وخمسين دقيقة إجمالاً. معظم المسار معبّد، لكن المقطع الأخير وعر وتظهر فيه الحفر بعد الشتاء. وفي الطقس
    الجاف تمر سيارة عادية؛ أما الكروس أوفر بخلوصها الأرضي الأعلى فأريح بكثير ويُنصح بها فعلاً بعد المطر.
    وآخر وقود يُعتمد عليه في ساغاريجو — فالخمسون كيلومتراً التالية شبه خالية، فاملأ الخزان قبل الانعطاف.
