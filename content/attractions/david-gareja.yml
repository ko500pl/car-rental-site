ka:
  name: დავით გარეჯის სამონასტრო კომპლექსი
  short: >-
    შიშველი ქედი აზერბაიჯანის საზღვარზე, სადაც VI საუკუნიდან ბერები კლდეში ნაკვეთ სენაკებში ცხოვრობენ,
    ირგვლივ კი ნახევრადუდაბნო სტეპია.
  body: >-
    **დავით გარეჯში უკანასკნელი სიტყვა უდაბნოს ეკუთვნის: ივრის ზეგანის კიდეზე შიშველი ქედი, გაზაფხულზე
    მხოლოდ რამდენიმე კვირით რომ მწვანდება, და მის კალთებში ნაკვეთი სენაკები, რომლებსაც ბერები VI საუკუნიდან
    მოყოლებული კვეთდნენ.**


    დამაარსებელი, დავითი, ცამეტ ასურელ მამათაგანი იყო, რომლებიც იმავე საუკუნეში საქართველოში მოვიდნენ.
    ამ უწყლო მხარეში იგი თავის მოწაფე ლუკიანესთან ერთად დამკვიდრდა. გადმოცემით, მათ გამოქვაბულთან სამი
    ირემი მოდიოდა, ლუკიანე დავითის კურთხევით წველიდა და ბერები რძისგან ყველს ამზადებდნენ; ეს სცენა აქაურ
    კედლებზე არაერთხელ მეორდება. მოწაფეებმა ქედზე ახალი მონასტრები დააარსეს, XI საუკუნის ბოლოდან XIII
    საუკუნის დასაწყისამდე კი, მეფეთა მფარველობით, მათ უდაბნო, ბერთუბანი და ჩიჩხიტური შეემატა. აქ განმარტოვდა
    ტახტიდან გადამდგარი დემეტრე I, რომელსაც საგალობლის „შენ ხარ ვენახი“ ავტორად იხსენიებენ.


    სიწმინდე ქედს ძვირად დაუჯდა. 1265 წელს იგი მონღოლებმა ააოხრეს, 1615 წელს კი შაჰ-აბას I-ის ბრძანებით
    ბერები ამოხოცეს და ხელნაწერები გაანადგურეს. საბჭოთა ხელისუფლებამ მონასტერი 1921 წელს დახურა, მოგვიანებით
    კი ფერდობებს სასროლ პოლიგონად იყენებდა — სანამ 1987 წელს ახალგაზრდა მწერლის, დათო ტურაშვილის, გარშემო
    შემოკრებილმა სტუდენტებმა პროტესტი არ დაიწყეს და მონასტერში შიმშილობის შემდეგ ჯარი აქედან არ გავიდა.


    ლავრა მოქმედი მონასტერია: ტერასებად დაშვებული ეზოები, კლდეში ნაკვეთი სენაკები, დავითის საფლავი. აქედან
    ციცაბო ბილიკი ქედის თხემზე ადის და მეორე მხარეს, უდაბნოსკენ ეშვება, სადაც გამოქვაბულ ეკლესიებში X
    საუკუნის მეორე ნახევრიდან მოყოლებული მხატვრობაა შემორჩენილი, მათ შორის დავით გარეჯელის ცხოვრების უძველესი
    ფერწერული ციკლი. ქვემოთ აზერბაიჯანის ველი ჰორიზონტამდე გაწოლილა.


    ბერები აქ იმიტომ მოვიდნენ, რომ ეს ადგილი არაფერს სთავაზობდა. მზის ჩასვლისას თხემიდან კი ეს „არაფერი“
    უსაზღვროდ დიდი ჩანს.
  tip: >-
    ლავრა თითქმის ყოველთვის ღიაა და შესვლა უფასოა; უდაბნოსკენ მიმავალი ბილიკი საქართველო-აზერბაიჯანის
    საზღვრის არადემარკირებულ მონაკვეთზე გადის და ზოგჯერ იკეტება, ამიტომ ჭიშკართან იკითხეთ. ასვლა-ჩამოსვლას
    დაახლოებით საათნახევარი სჭირდება ციცაბო, ფხვიერ ფერდზე: ჩაიცვით კარგი ფეხსაცმელი, თბილ თვეებში კი
    გველებს გაუფრთხილდით. ქედზე ჩრდილი არ არის, ზაფხულის შუადღე 40 გრადუსს უახლოვდება — წყალი იმაზე მეტი
    წაიღეთ, ვიდრე საჭიროდ გეჩვენებათ, და ადრე გადით. მონასტრისთვის შესაფერისად ჩაიცვით: დაფარული მხრები
    და მუხლები, ქალებს თავსაფარი. საპირფარეშო, საჭმელი და კაფე სოფელ უდაბნოშია. საუკეთესო თვეებია აპრილი
    და მაისი, როცა სტეპი ყვავის.
  route: >-
    მანძილი დაახლოებით 98 კილომეტრია, გზას კი ორ საათზე ცოტა მეტი სჭირდება. კახეთის გზატკეცილით (ს5) საგარეჯომდე
    იარეთ და იქ აუცილებლად შეავსეთ ავზი: ეს ბოლო საიმედო ბენზინგასამართია. საგარეჯოდან სამხრეთით, უდაბნოს
    გზაზე გადაუხვიეთ, რომელიც უკაცრიელ, ტალღოვან სტეპს სოფელ უდაბნოს გავლით მონასტრამდე მიუყვება. გზა
    თითქმის ბოლომდე ასფალტიანია, მაგრამ ბოლო მონაკვეთი დაზიანებულია და ზამთრის მერე ორმოებით ივსება. მშრალ
    ამინდში ეკონომ-კლასის მანქანაც გაივლის, კროსოვერი ან ჯიპი კი უფრო კომფორტულია და წვიმის შემდეგ, როცა
    თიხა სრიალა ხდება, უფრო გონივრულიც. მობილური კავშირი წყვეტილია, ამიტომ რუკები თბილისშივე ჩამოტვირთეთ.
en:
  name: David Gareja
  short: >-
    A bare ridge on the Azerbaijani border where monks have lived in rock-cut cells since the 6th century,
    amid semi-desert steppe.
  body: >-
    **At David Gareja the desert has the last word: a bare ridge on the edge of the Iori plateau, green
    for a few weeks in spring, with cells that monks have cut into its flanks since the 6th century.**


    The founder, David, was one of the Thirteen Assyrian Fathers who came to Georgia in that century.
    He settled in this waterless country with his disciple Lukiane, and tradition says that three deer
    came to their cave, that Lukiane milked them with David's blessing and that the two hermits made cheese
    from the milk. The scene recurs on the walls here. Disciples founded new monasteries along the ridge,
    and between the late 11th and early 13th centuries, under royal patronage, Udabno, Bertubani and Chichkhituri
    joined them. King Demetre I, remembered as the author of the hymn "Thou Art a Vineyard", withdrew
    here after giving up his throne.


    The ridge has paid for its holiness. The Mongols sacked it in 1265, and in 1615, on the orders of
    Shah Abbas I, the monks were massacred and the manuscripts destroyed. The Soviets closed the monastery
    in 1921 and later shelled the slopes as a firing range, until protests begun in 1987 by students around
    the young writer Dato Turashvili, and a hunger strike at the monastery, drove the army out.


    The Lavra is a working monastery: terraced courtyards, cells in the cliff, David's tomb. A steep path
    climbs from it to the crest and over to Udabno, where cave churches keep murals from the late 10th
    century onwards, among them the earliest painted cycle of David's life. Below lie the plains of Azerbaijan,
    flat to the horizon.


    The monks came because the place offered nothing. From the crest at sunset, that nothing looks enormous.
  tip: >-
    The Lavra is almost always open and free to enter; the climb to Udabno crosses an undemarcated stretch
    of the Georgia–Azerbaijan border and is sometimes closed, so ask at the gate. The round trip takes
    about an hour and a half on steep, loose ground: wear proper shoes, and watch for snakes in warm months.
    There is no shade on the ridge, and summer middays approach 40°C; carry more water than seems reasonable
    and go early. Dress for a monastery: covered shoulders and knees, headscarves for women. Toilets,
    food and a café are back in Udabno village. April and May, when the steppe flowers, are the finest
    months.
  route: >-
    It is about 98 km and a little over two hours. Take the Kakheti Highway (S5) east to Sagarejo, where
    you should fill the tank: it is the last reliable fuel. Turn south onto the Udabno road, which crosses
    empty, rolling steppe past Udabno village to the monastery. It is paved nearly all the way, but the
    final stretch is broken and potholed after winter. An economy car manages in dry weather; a crossover
    or SUV is more comfortable and wiser after rain, when the clay turns slick. Mobile coverage is patchy,
    so download maps before you leave Tbilisi.
ru:
  name: Давид-Гареджи
  short: >-
    Голый хребет на границе с Азербайджаном, где с VI века монахи живут в высеченных в скале кельях, посреди
    полупустынной степи.
  body: >-
    **В Давид-Гареджи последнее слово за пустыней: голый хребет на краю Иорского плоскогорья, зелёный
    лишь несколько недель весной, с кельями, которые монахи высекают в его склонах с VI века.**


    Основатель обители, Давид, был одним из тринадцати ассирийских отцов, пришедших в Грузию в том столетии.
    Он поселился в этом безводном краю вместе с учеником Лукиане, и, по преданию, к их пещере приходили
    три лани: с благословения Давида Лукиане доил их, и отшельники делали из молока сыр. Этот сюжет не
    раз повторяется на здешних стенах. Ученики основывали вдоль хребта новые монастыри, а с конца XI до
    начала XIII века, под царским покровительством, к ним добавились Удабно, Бертубани и Чичхитури. Царь
    Деметре I, которого помнят как автора гимна «Ты — виноградник», удалился сюда, отрёкшись от престола.


    За свою святость хребет платил дорого. В 1265 году его разорили монголы, а в 1615-м по приказу шаха
    Аббаса I монахи были перебиты, рукописи уничтожены. В 1921 году советская власть закрыла монастырь,
    а позже склоны превратились в армейский полигон и попадали под обстрел — пока протесты, начатые в
    1987 году студентами вокруг молодого писателя Дато Турашвили, и голодовка у стен монастыря не заставили
    армию уйти.


    Лавра — действующий монастырь: дворы-террасы, кельи в скале, гробница Давида. От неё крутая тропа
    поднимается на гребень и переваливает к Удабно, где в пещерных церквях сохранились росписи начиная
    с конца X века, в том числе древнейший живописный цикл жития Давида. Внизу лежат равнины Азербайджана,
    плоские до самого горизонта.


    Монахи пришли сюда потому, что это место ничего не обещало. С гребня на закате это «ничего» кажется
    огромным.
  tip: >-
    Лавра открыта почти всегда, вход свободный; тропа к Удабно пересекает неделимитированный участок грузино-азербайджанской
    границы и иногда бывает закрыта — спросите у ворот. Путь туда и обратно занимает около полутора часов
    по крутому осыпающемуся склону: нужна крепкая обувь, а в тёплые месяцы остерегайтесь змей. На хребте
    нет тени, летом в полдень бывает под 40°C; берите воды больше, чем кажется разумным, и выходите рано.
    Одежда — как для монастыря: закрытые плечи и колени, женщинам платок. Туалеты, еда и кафе — в деревне
    Удабно. Лучшие месяцы — апрель и май, когда цветёт степь.
  route: >-
    Путь — около 98 км и чуть больше двух часов. По Кахетинскому шоссе (S5) поезжайте на восток до Сагареджо
    и там заправьтесь: это последняя надёжная заправка. Сверните на юг, на дорогу к Удабно; она пересекает
    пустую холмистую степь, минует деревню Удабно и выходит к монастырю. Асфальт почти на всём пути, но
    последний отрезок после зимы разбит и в выбоинах. Машина эконом-класса справится в сухую погоду; на
    кроссовере или внедорожнике удобнее, а после дождя, когда глина становится скользкой, и разумнее.
    Мобильная связь неустойчива, так что скачайте карты ещё в Тбилиси.
fa:
  name: داوید گارجا
  short: >-
    یالی برهنه بر مرز آذربایجان که راهبان از سدهٔ ششم در حجره‌های کنده در دل صخره‌اش زیسته‌اند، در میان
    استپی نیمه‌بیابانی.
  body: >-
    **در داوید گارجا حرف آخر را بیابان می‌زند: یالی برهنه بر لبهٔ فلات یوری، که تنها چند هفته در بهار
    سبز است و راهبان از سدهٔ ششم در دامنه‌هایش حجره کنده‌اند.**


    بنیان‌گذار آن، داوید، یکی از سیزده پدر آشوری بود که در همان سده به گرجستان آمدند. او با شاگردش لوکیانه
    در این سرزمین بی‌آب ساکن شد و، به روایت سنت، سه گوزن ماده به غارشان می‌آمدند؛ لوکیانه با دعای خیر
    داوید آن‌ها را می‌دوشید و دو زاهد از شیرشان پنیر می‌ساختند. این صحنه بارها بر دیوارهای این‌جا تکرار
    شده است. شاگردان در امتداد یال صومعه‌های تازه‌ای بنیاد نهادند و از اواخر سدهٔ یازدهم تا اوایل سدهٔ
    سیزدهم، با پشتیبانی شاهان، اودابنو، برتوبانی و چیچخیتوری نیز به آن‌ها پیوستند. شاه دمتره یکم، که او
    را سرایندهٔ سرود «تو تاکستانی» می‌دانند، پس از کناره‌گیری از تاج و تخت به این‌جا پناه آورد.


    این یال بهای قداستش را پرداخته است. مغولان در ۱۲۶۵ آن را غارت کردند و در ۱۶۱۵، به فرمان شاه عباس یکم،
    راهبان قتل‌عام شدند و نسخه‌های خطی از میان رفتند. شوروی در ۱۹۲۱ صومعه را بست و بعدها دامنه‌ها را میدان
    تیر ارتش کرد و زیر آتش گرفت، تا این‌که اعتراض‌هایی که از ۱۹۸۷ دانشجویانِ گرد آمده پیرامون نویسندهٔ
    جوان، داتو توراشویلی، آغاز کردند و اعتصاب غذایی در صومعه، ارتش را به رفتن واداشتند.


    لاورا صومعه‌ای فعال است: حیاط‌های پلکانی، حجره‌هایی در دل صخره، و آرامگاه داوید. از آن‌جا کوره‌راهی
    پرشیب به ستیغ بالا می‌رود و از آن سو به اودابنو سرازیر می‌شود؛ جایی که کلیساهای غاری نقاشی‌های دیواری
    از اواخر سدهٔ دهم به بعد را نگاه داشته‌اند، از جمله کهن‌ترین چرخهٔ نگارگری زندگی داوید. پایین پای
    شما دشت‌های آذربایجان تا افق هموار گسترده است.


    راهبان به این‌جا آمدند چون این مکان هیچ چیز نداشت. از ستیغ، هنگام غروب، آن «هیچ» بی‌کران می‌نماید.
  tip: >-
    لاورا تقریباً همیشه باز است و ورود رایگان؛ مسیر اودابنو از بخشی از مرز گرجستان و آذربایجان می‌گذرد
    که مرزبندی نشده و گاهی بسته است، پس دم در بپرسید. رفت و برگشت حدود یک ساعت و نیم روی زمینی پرشیب و
    لغزان طول می‌کشد: کفش مناسب بپوشید و در ماه‌های گرم مراقب مار باشید. روی یال سایه نیست و نیمروزهای
    تابستان به ۴۰ درجه نزدیک می‌شود؛ بیش از آن‌چه معقول به نظر می‌رسد آب بردارید و زود راه بیفتید. لباس
    درخور صومعه بپوشید: شانه‌ها و زانوهای پوشیده، و روسری برای بانوان. سرویس بهداشتی، غذا و کافه در روستای
    اودابنو است. آوریل و مه، که استپ گل می‌دهد، بهترین ماه‌هاست.
  route: >-
    مسافت حدود ۹۸ کیلومتر و کمی بیش از دو ساعت است. از بزرگراه کاختی (S5) به سوی شرق تا ساگارجو برانید
    و همان‌جا باک را پر کنید: آخرین جایگاه سوخت مطمئن است. به جنوب، به جادهٔ اودابنو بپیچید که از استپی
    خالی و موج‌دار می‌گذرد و پس از روستای اودابنو به صومعه می‌رسد. تقریباً سراسر آسفالت است، اما تکهٔ
    پایانی پس از زمستان شکسته و پر از چاله است. خودروی اکونومی در هوای خشک از پسش برمی‌آید؛ کراس‌اوور
    یا شاسی‌بلند راحت‌تر است و پس از باران، که خاک رس لغزنده می‌شود، عاقلانه‌تر. پوشش موبایل نامنظم است،
    پس نقشه‌ها را پیش از ترک تفلیس دانلود کنید.
he:
  name: דוד גרג'ה
  short: רכס חשוף על גבול אזרבייג'ן, שבו חיים נזירים בתאים חצובים בסלע מאז המאה השישית, בלב ערבה מדברית-למחצה.
  body: >-
    **בדוד גרג'ה המילה האחרונה שמורה למדבר: רכס חשוף בשולי רמת יורי, ירוק רק כמה שבועות באביב, ובמדרונותיו
    תאים שנזירים חוצבים מאז המאה השישית.**


    המייסד, דוד, היה אחד משלושה עשר האבות האשוריים שהגיעו לגאורגיה באותה מאה. הוא התיישב בארץ הצחיחה הזאת
    עם תלמידו לוקיאנה, והמסורת מספרת ששלוש איילות באו אל מערתם, שלוקיאנה חלב אותן בברכת דוד ושני הנזירים
    המתבודדים עשו מן החלב גבינה. הסצנה חוזרת על קירות המקום שוב ושוב. תלמידים ייסדו מנזרים חדשים לאורך
    הרכס, ובין סוף המאה ה-11 לתחילת המאה ה-13, בחסות המלוכה, הצטרפו אליהם אודבנו, ברטובאני וצ'יצ'חיטורי.
    המלך דמטרה הראשון, הזכור כמחבר המזמור "אַתְּ כרם", פרש לכאן לאחר שוויתר על כסאו.


    הרכס שילם מחיר על קדושתו. המונגולים בזזו אותו ב-1265, וב-1615, בפקודת השאה עבאס הראשון, נטבחו הנזירים
    וכתבי היד הושמדו. הסובייטים סגרו את המנזר ב-1921 ובהמשך הפגיזו את המדרונות כשטח אש, עד שמחאות שפתחו
    ב-1987 סטודנטים שהתקבצו סביב הסופר הצעיר דאטו טורשווילי, ושביתת רעב במנזר, גירשו את הצבא.


    הלאברה היא מנזר פעיל: חצרות מדורגות, תאים בצוק, קברו של דוד. ממנה מטפס שביל תלול אל הרכס ויורד מעברו
    השני לאודבנו, שבה שומרות כנסיות המערה ציורי קיר מסוף המאה העשירית ואילך, ובהם מחזור הציורים הקדום
    ביותר של חיי דוד. למטה משתרעים מישורי אזרבייג'ן, שטוחים עד האופק.


    הנזירים באו לכאן משום שהמקום לא הציע דבר. מן הרכס, בשקיעה, ה"כלום" הזה נראה עצום.
  tip: >-
    הלאברה פתוחה כמעט תמיד והכניסה חופשית; הטיפוס לאודבנו חוצה קטע גבול שטרם תוחם בין גאורגיה לאזרבייג'ן
    ולעתים נסגר, אז שאלו בשער. ההליכה הלוך ושוב אורכת כשעה וחצי על קרקע תלולה ומתפוררת: נעלו נעליים של
    ממש, ובחודשים החמים היזהרו מנחשים. אין צל על הרכס, ובצהרי הקיץ החום מתקרב ל-40 מעלות; קחו יותר מים
    ממה שנראה סביר וצאו מוקדם. התלבשו כנדרש במנזר: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש. שירותים, אוכל
    ובית קפה יש בכפר אודבנו. אפריל ומאי, כשהערבה פורחת, הם החודשים היפים ביותר.
  route: >-
    המרחק הוא כ-98 ק"מ, וקצת יותר משעתיים נסיעה. סעו מזרחה על כביש קאחתי (S5) עד סגרג'ו ותדלקו שם: זו
    תחנת הדלק האמינה האחרונה. פנו דרומה לכביש אודבנו, שחוצה ערבה ריקה וגלית, עובר את הכפר אודבנו ומגיע
    למנזר. הוא סלול כמעט לכל אורכו, אבל הקטע האחרון שבור ומלא בורות אחרי החורף. מכונית חסכונית תסתדר במזג
    אוויר יבש; קרוסאובר או רכב שטח נוחים יותר, ואחרי גשם, כשהחרסית נעשית חלקלקה, גם נבונים יותר. הקליטה
    הסלולרית מקוטעת, אז הורידו מפות לפני שאתם יוצאים מטביליסי.
ar:
  name: دافيد غاريجا
  short: حَيد أجرد على حدود أذربيجان، يسكن فيه الرهبان صوامع منحوتة في الصخر منذ القرن السادس، وسط سهوب
    شبه صحراوية.
  body: >-
    **في دافيد غاريجا الكلمة الأخيرة للصحراء: حَيد أجرد على طرف هضبة يوري، لا يخضرّ إلا بضعة أسابيع في
    الربيع، وفي سفوحه صوامع ينحتها الرهبان منذ القرن السادس.**


    كان المؤسس، دافيد، واحداً من الآباء الآشوريين الثلاثة عشر الذين قدموا إلى جورجيا في ذلك القرن. استقرّ
    في هذه الأرض العطشى مع تلميذه لوكيانه، وتقول الرواية إن ثلاث أيّلات كنّ يأتين إلى كهفهما، فيحلبهنّ
    لوكيانه بمباركة دافيد، ويصنع الناسكان من الحليب جبناً. وتتكرر هذه الصورة على الجدران هنا. وأسّس التلاميذ
    أديرة جديدة على امتداد الحَيد، وبين أواخر القرن الحادي عشر ومطلع القرن الثالث عشر، وبرعاية ملكية،
    انضمت إليها أديرة أودابنو وبيرتوباني وتشيتشخيتوري. أما الملك ديميتري الأول، الذي يُذكر بأنه مؤلف ترنيمة
    «أنتِ الكرمة»، فقد اعتزل هنا بعد تنازله عن العرش.


    دفع الحَيد ثمن قداسته. فقد نهبه المغول عام 1265، وفي عام 1615، بأمر من الشاه عباس الأول، ذُبح الرهبان
    وأُتلفت المخطوطات. وأغلق السوفييت الدير عام 1921، ثم قصفوا السفوح حين حوّلوها إلى ميدان رماية، إلى
    أن أخرجت الجيشَ احتجاجاتٌ أطلقها عام 1987 طلاب التفّوا حول الكاتب الشاب داتو توراشفيلي، وإضرابٌ عن
    الطعام في الدير.


    اللافرا دير عامر: أفنية متدرجة، وصوامع في الجرف، وقبر دافيد. ومنه يصعد درب شديد الانحدار إلى القمة
    ثم يهبط إلى أودابنو، حيث تحفظ الكنائس الكهفية رسوماً جدارية تعود إلى أواخر القرن العاشر وما بعده،
    ومنها أقدم دورة مصوَّرة لسيرة دافيد. وفي الأسفل تمتد سهول أذربيجان منبسطة حتى الأفق.


    جاء الرهبان لأن المكان لا يقدّم شيئاً. ومن القمة عند الغروب، يبدو هذا «اللاشيء» شاسعاً.
  tip: >-
    اللافرا مفتوحة في أغلب الأوقات والدخول مجاني؛ أما الصعود إلى أودابنو فيعبر مقطعاً غير مرسَّم من الحدود
    الجورجية الأذربيجانية ويُغلق أحياناً، فاسأل عند البوابة. تستغرق الرحلة ذهاباً وإياباً نحو ساعة ونصف
    على أرض شديدة الانحدار مفككة: ارتدِ حذاءً مناسباً، واحذر الأفاعي في الأشهر الدافئة. لا ظل على الحَيد،
    وتقترب الحرارة ظهراً في الصيف من 40°C؛ احمل من الماء أكثر مما يبدو معقولاً وانطلق باكراً. والبس ما
    يليق بدير: كتفان وركبتان مستورتان، وغطاء رأس للنساء. دورات المياه والطعام والمقهى في قرية أودابنو.
    أبريل ومايو، حين تزهر السهوب، أجمل الشهور.
  route: >-
    المسافة نحو 98 كم وما يزيد قليلاً على ساعتين. اسلك طريق كاخيتي السريع (S5) شرقاً حتى ساغاريجو وتزوّد
    هناك بالوقود: إنها آخر محطة يُعتمد عليها. انعطف جنوباً إلى طريق أودابنو، الذي يعبر سهوباً خالية متموجة
    ويمرّ بقرية أودابنو حتى الدير. الطريق معبّد في معظمه، لكن المقطع الأخير متصدع ومليء بالحفر بعد الشتاء.
    تكفي سيارة اقتصادية في الطقس الجاف؛ والكروس أوفر أو سيارة الدفع الرباعي أريح، وأحكم بعد المطر حين
    يصير الطين زلقاً. تغطية الهاتف متقطعة، فنزّل الخرائط قبل مغادرة تبليسي.
