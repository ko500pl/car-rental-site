ka:
  name: ოჩხომურის ჩანჩქერი
  short: >-
    100–120 მეტრი სიმაღლის სამსაფეხურიანი კასკადი მდინარე ოჩხომურის სათავეში, მარტვილის ჩრდილოეთით მთებში
    — სოფელ კურზუდან ნახევარი საათის სავალი.
  body: >-
    **შორიდან ოჩხომური ერთ თეთრ სვეტს ჰგავს; ახლოს კი სამ საფეხურად იშლება და თითოეული საფეხური თავის
    პატარა ტბორში მთავრდება.**


    ჩანჩქერი მდინარე ოჩხომურის სათავეში, მიგარიის კირქვიანი მასივის სამხრეთ ნაწილში, მარტვილის მუნიციპალიტეტში,
    სოფელ კურზუს ჩრდილოეთით მდებარეობს. მისი სიმაღლე 100–120 მეტრად არის მითითებული, წყალი კი მღვიმიდან
    გამოდის. ვარდნისას ნაკადი მიმართულებას იცვლის: ჯერ სამხრეთისკენაა მიქცეული, შემდეგ სამხრეთ-აღმოსავლეთისკენ,
    ბოლოს კი ისევ სამხრეთისკენ.


    წყლის ამხელა სვეტი გარემოს მუდმივად ნოტიოს ხდის და ამ სინოტივემ აქ საკუთარი პატარა სამყარო შექმნა.
    დაცული ტერიტორიების სააგენტოს ცნობით, აქ მრავლად გვხვდება იშვიათი, ენდემური და რელიქტური სახეობები,
    მათ შორის კი თვალსაჩინო ადგილი ბზის კორომებს უჭირავს.


    ამის მიღმა ცოტა რამ წერია: არც ლეგენდა, არც ისტორია. სამაგიეროდ, არის გზა: კურზუდან 3,2 კილომეტრი
    ბილიკი, სააგენტოს თქმით, დაახლოებით ნახევარი საათის სავალი.


    გაზაფხულზე მოდით, როცა მასივი წყლით არის სავსე.
  tip: >-
    დაახლოებით ორი საათი გამოყავით: სააგენტოს მონაცემით, კურზუდან ბილიკი 3,2 კილომეტრია და ცალ მხარეს
    ნახევარი საათი სჭირდება, ტბორებთანაც ხომ მოგინდებათ შეყოვნება. აქ არაფერია მოწყობილი — არც სანდო ნიშნები,
    არც ტუალეტი, არც წყალი, არც კაფე — ამიტომ მარაგი მარტვილიდან წაიღეთ და ოფლაინ რუკა წინასწარ ჩამოტვირთეთ.
    ბილიკის მდგომარეობა კურზუში იკითხეთ. ტბორების ირგვლივ ქვები მუდამ სველია — ჩანჩქერის საფეხურებზე ნუ
    ახვალთ. ყველაზე უხვი წყალი გაზაფხულსა და ზაფხულის დასაწყისშია. საფასური დადასტურებული არ არის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის მიმართულებით იარეთ, აბაშისკენ
    გააგრძელეთ და ჩრდილოეთით, მარტვილისკენ გადაუხვიეთ. მარტვილიდან ადგილობრივი გზა დაახლოებით 25 კილომეტრზე,
    ბოლო სოფლამდე, კურზუმდე მიდის — სააგენტოს შეფასებით, ნახევარი საათის გზაა. სულ დაახლოებით 309 კმ;
    ხუთნახევარი საათი გამოყავით. ბოლო კილომეტრების საფარი ვერ დავადასტურეთ, ამიტომ მაღალი გამავლობის მანქანა
    (კროსოვერი ან ჯიპი) აიღეთ და, განსაკუთრებით წვიმის შემდეგ, გზა ადგილობრივებს ჰკითხეთ. მანქანა კურზუში
    დატოვეთ და ბოლო 3,2 კილომეტრი ფეხით გაიარეთ. საწვავი სამტრედიაში ან მარტვილში ჩაასხით.
en:
  name: Ochkhomuri Waterfall
  short: >-
    A three-step cascade of 100–120 metres at the head of the Ochkhomuri river, half an hour's walk from
    Kurzu in the hills north of Martvili.
  body: >-
    **From a distance Ochkhomuri looks like a single white column; closer in, it breaks into three steps,
    each ending in a small pool of its own.**


    The waterfall stands at the head of the Ochkhomuri river, in the southern part of the Migaria limestone
    massif, in Martvili municipality north of the village of Kurzu. Its drop is given as 100 to 120 metres,
    and the water springs from a cave. On the way down it turns, facing south, then south-east, then south
    again.


    So much falling water keeps the air around it permanently damp, and the damp has made a small world
    of its own. The Agency of Protected Areas records many rare, endemic and relict species here, with
    groves of box prominent among them.


    Beyond that, little is written: no legend, no history. What there is, is the walk: 3.2 kilometres
    of footpath from Kurzu, about half an hour by the Agency's reckoning.


    Come in spring, when the massif is full of water.
  tip: >-
    Allow about two hours: the Agency of Protected Areas puts the footpath from Kurzu at 3.2 km and half
    an hour each way, and you will want time at the pools. Nothing is laid on — no reliable signs, no
    toilet, no water, no café — so bring supplies from Martvili and download an offline map. Ask in Kurzu
    about the current state of the path. The rocks around the pools are permanently wet; keep off the
    steps of the fall. Spring and early summer give the fullest flow. Any fee is unconfirmed.
  route: >-
    From Tbilisi take the S1 west towards Kutaisi and Samtredia, continue towards Abasha and turn north
    to Martvili. From Martvili a local road runs about 25 km to Kurzu, the last village, which the Agency
    of Protected Areas reckons at half an hour. In all about 309 km; allow five and a half hours. We could
    not confirm the surface of the final kilometres, so take an SUV and ask locally, especially after
    rain. Leave the car in Kurzu and walk the last 3.2 km. Refuel in Samtredia or Martvili.
ru:
  name: Водопад Очхомури
  short: >-
    Трёхступенчатый каскад высотой 100–120 метров в верховье реки Очхомури, в получасе ходьбы от Курзу,
    в холмах к северу от Мартвили.
  body: >-
    **Издалека Очхомури кажется единой белой колонной; вблизи он распадается на три ступени, и каждая
    заканчивается собственной маленькой чашей.**


    Водопад находится в верховье реки Очхомури, в южной части известнякового массива Мигариа, в Мартвильском
    муниципалитете, к северу от села Курзу. Его высоту указывают в 100–120 метров, а вода вырывается из
    пещеры. На пути вниз поток меняет направление: сначала он обращён на юг, затем на юго-восток и снова
    на юг.


    Столько падающей воды держит воздух вокруг постоянно влажным, и эта влага создала свой маленький мир.
    Агентство охраняемых территорий отмечает здесь множество редких, эндемичных и реликтовых видов, среди
    которых выделяются рощи самшита.


    Кроме этого, написано немного: ни легенды, ни истории. Зато есть прогулка: 3,2 километра пешеходной
    тропы от Курзу, около получаса по расчётам Агентства.


    Приезжайте весной, когда массив полон воды.
  tip: >-
    Заложите около двух часов: по данным Агентства охраняемых территорий, тропа от Курзу — 3,2 км и полчаса
    в одну сторону, а у чаш захочется задержаться. Ничего не обустроено — ни надёжных указателей, ни туалета,
    ни воды, ни кафе, — так что возьмите всё необходимое в Мартвили и скачайте офлайн-карту. Спросите
    в Курзу, в каком состоянии сейчас тропа. Камни вокруг чаш постоянно мокрые; не заходите на ступени
    водопада. Самый полноводный сезон — весна и начало лета. Есть ли плата, не подтверждено.
  route: >-
    Из Тбилиси поезжайте по S1 на запад, в сторону Кутаиси и Самтредиа, продолжайте в направлении Абаши
    и сверните на север к Мартвили. От Мартвили местная дорога ведёт примерно 25 км до Курзу, последнего
    села, — по оценке Агентства охраняемых территорий, это полчаса езды. Всего около 309 км; заложите
    пять с половиной часов. Покрытие последних километров нам подтвердить не удалось, поэтому берите внедорожник
    и уточняйте на месте, особенно после дождя. Оставьте машину в Курзу и пройдите последние 3,2 км пешком.
    Заправьтесь в Самтредиа или Мартвили.
fa:
  name: آبشار اوچخوموری
  short: >-
    آبشاری سه‌پله‌ای به بلندی ۱۰۰ تا ۱۲۰ متر در سرچشمهٔ رود اوچخوموری، نیم ساعت پیاده‌روی از کورزو، در
    تپه‌های شمال مارتویلی.
  body: >-
    **اوچخوموری از دور ستونی سپید و یکپارچه به نظر می‌رسد؛ از نزدیک به سه پله تقسیم می‌شود که هر یک به
    حوضچهٔ کوچکی از آنِ خود می‌انجامد.**


    آبشار در سرچشمهٔ رود اوچخوموری، در بخش جنوبی تودهٔ آهکی میگاریا، در شهرستان مارتویلی و در شمالِ روستای
    کورزو قرار دارد. ارتفاع ریزشش را ۱۰۰ تا ۱۲۰ متر ذکر کرده‌اند و آبش از دل غاری می‌جوشد. آب در مسیر
    فرود تغییر جهت می‌دهد: نخست رو به جنوب، سپس جنوب‌شرق و دوباره جنوب.


    این همه آبِ ریزان، هوای پیرامون را همیشه نمناک نگه می‌دارد و این نم، جهان کوچکی از آنِ خود ساخته است.
    آژانس مناطق حفاظت‌شده گونه‌های کمیاب، بومی‌زاد و بازماندهٔ (رلیکت) بسیاری را در اینجا ثبت کرده که
    بیشه‌های شمشاد در میانشان چشمگیرند.


    جز این، چیز زیادی نوشته نشده است: نه افسانه‌ای، نه تاریخی. آنچه هست، پیاده‌روی است: ۳٫۲ کیلومتر کوره‌راه
    از کورزو، که به حساب آژانس حدود نیم ساعت طول می‌کشد.


    در بهار بیایید، وقتی توده پر از آب است.
  tip: >-
    حدود دو ساعت وقت بگذارید: آژانس مناطق حفاظت‌شده طول کوره‌راه از کورزو را ۳٫۲ کیلومتر و زمانش را نیم
    ساعت در هر مسیر می‌داند، و دلتان می‌خواهد کنار حوضچه‌ها هم درنگ کنید. هیچ امکاناتی فراهم نیست — نه
    تابلوی قابل‌اعتماد، نه سرویس بهداشتی، نه آب، نه کافه — پس توشه را از مارتویلی بیاورید و نقشهٔ آفلاین
    بارگیری کنید. در کورزو از وضع کنونی مسیر بپرسید. سنگ‌های پیرامون حوضچه‌ها همیشه خیس‌اند؛ روی پله‌های
    آبشار نروید. بهار و اوایل تابستان پرآب‌ترین فصل است. دربارهٔ ورودیه اطلاعات تأییدشده‌ای نیست.
  route: >-
    از تفلیس جادهٔ S1 را به سمت غرب، به سوی کوتائیسی و سامتردیا، بگیرید، به سمت آباشا ادامه دهید و به
    سوی شمال به مارتویلی بپیچید. از مارتویلی جاده‌ای محلی حدود ۲۵ کیلومتر تا کورزو، آخرین روستا، پیش می‌رود
    که آژانس مناطق حفاظت‌شده زمانش را نیم ساعت برآورد می‌کند. روی هم حدود ۳۰۹ کیلومتر؛ پنج ساعت و نیم
    وقت بگذارید. نتوانستیم نوع رویهٔ کیلومترهای پایانی را تأیید کنیم، پس خودروی شاسی‌بلند بگیرید و به‌ویژه
    پس از باران از اهالی بپرسید. خودرو را در کورزو بگذارید و ۳٫۲ کیلومتر پایانی را پیاده بروید. در سامتردیا
    یا مارتویلی سوخت بگیرید.
he:
  name: מפל אוצ'חומורי
  short: מפל בן שלוש מדרגות בגובה 100–120 מטרים במקורות נהר אוצ'חומורי, חצי שעה הליכה מקורזו, בגבעות שמצפון
    למרטווילי.
  body: >-
    **מרחוק אוצ'חומורי נראה כעמוד לבן אחד; מקרוב הוא מתפצל לשלוש מדרגות, וכל אחת מסתיימת בבריכה קטנה משלה.**


    המפל נמצא במקורות נהר אוצ'חומורי, בחלקו הדרומי של מאסיב הגיר מיגריה, במוניציפליטת מרטווילי, מצפון
    לכפר קורזו. גובה נפילתו מוערך ב-100 עד 120 מטרים, והמים פורצים מתוך מערה. בדרכם מטה הם משנים כיוון:
    תחילה דרומה, אחר כך דרום-מזרחה, ושוב דרומה.


    כמות כזאת של מים נופלים שומרת על האוויר שסביב לח תמיד, והלחות יצרה עולם קטן משלה. הסוכנות לשטחים מוגנים
    מתעדת כאן מינים רבים נדירים, אנדמיים ושרידיים (רליקטיים), ובולטות ביניהם חורשות האשכרוע.


    מעבר לכך נכתב מעט: אין אגדה ואין היסטוריה. מה שיש הוא ההליכה: 3.2 קילומטרים של שביל רגלי מקורזו, כחצי
    שעה לפי חישוב הסוכנות.


    בואו באביב, כשהמאסיב מלא מים.
  tip: >-
    הקדישו כשעתיים: הסוכנות לשטחים מוגנים מעריכה את השביל מקורזו ב-3.2 ק"מ וחצי שעה לכל כיוון, ותרצו גם
    זמן ליד הבריכות. אין כאן שום תשתית — לא שלטים אמינים, לא שירותים, לא מים ולא בית קפה — אז הביאו ציוד
    ממרטווילי והורידו מפה לא מקוונת. שאלו בקורזו מה מצב השביל כעת. הסלעים סביב הבריכות רטובים תמיד; אל
    תעלו על מדרגות המפל. באביב ובתחילת הקיץ הזרימה במיטבה. לא אומת אם נגבים דמי כניסה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 לכיוון קוטאיסי וסמטרדיה, המשיכו לכיוון אבשה ופנו צפונה למרטווילי. ממרטווילי
    מובילה דרך מקומית כ-25 ק"מ עד קורזו, הכפר האחרון — חצי שעה נסיעה לפי הערכת הסוכנות לשטחים מוגנים.
    בסך הכול כ-309 ק"מ; הקדישו חמש שעות וחצי. לא הצלחנו לאמת את סוג הכביש בקילומטרים האחרונים, לכן קחו
    רכב פנאי-שטח ושאלו את המקומיים, במיוחד אחרי גשם. השאירו את הרכב בקורזו ולכו ברגל את 3.2 הק"מ האחרונים.
    תדלקו בסמטרדיה או במרטווילי.
ar:
  name: شلال أوتشخوموري
  short: >-
    شلال متدرّج من ثلاث درجات بارتفاع 100–120 مترًا عند منابع نهر أوتشخوموري، على بعد نصف ساعة سيرًا من
    كورزو في التلال شمال مارتفيلي.
  body: >-
    **يبدو أوتشخوموري من بعيد عمودًا أبيض واحدًا؛ لكنه عن قرب ينقسم إلى ثلاث درجات، تنتهي كل منها ببركة
    صغيرة خاصة بها.**


    يقع الشلال عند منابع نهر أوتشخوموري، في الجزء الجنوبي من كتلة ميغاريا الكلسية، ضمن بلدية مارتفيلي
    شمال قرية كورزو. ويُقدَّر ارتفاع سقوطه بما بين 100 و120 مترًا، ويتدفق ماؤه من كهف. وفي أثناء هبوطه
    يغيّر وجهته: متجهًا جنوبًا أولًا، ثم نحو الجنوب الشرقي، ثم جنوبًا من جديد.


    كل هذا الماء المتساقط يُبقي الهواء من حوله رطبًا على الدوام، وقد صنعت هذه الرطوبة عالمًا صغيرًا خاصًا
    بها. وتسجّل وكالة المناطق المحمية هنا أنواعًا كثيرة نادرة ومستوطنة ومتبقّية من عصور جيولوجية سابقة،
    تبرز بينها أجمات البقس.


    وما عدا ذلك فالمكتوب قليل: لا أسطورة ولا تاريخ. أما ما هو متاح فهو المسير: 3.2 كيلومتر من درب المشاة
    انطلاقًا من كورزو، نحو نصف ساعة بحساب الوكالة.


    تعالَ في الربيع، حين تمتلئ الكتلة الكلسية بالماء.
  tip: >-
    خصّص نحو ساعتين: تقدّر وكالة المناطق المحمية درب المشاة من كورزو بـ3.2 كم ونصف ساعة في كل اتجاه، وسترغب
    في قضاء بعض الوقت عند البرك. لا شيء مُعدّ هنا — لا لافتات موثوقة ولا دورة مياه ولا ماء ولا مقهى —
    فأحضر مؤونتك من مارتفيلي ونزّل خريطة للاستخدام دون اتصال. اسأل في كورزو عن حالة الدرب الحالية. الصخور
    حول البرك مبللة دائمًا؛ لا تصعد إلى درجات الشلال. يبلغ التدفق ذروته في الربيع وأوائل الصيف. لم نتحقق
    من وجود رسوم.
  route: >-
    من تبليسي اسلك الطريق S1 غربًا باتجاه كوتايسي وسامتريديا، وتابع نحو أباشا ثم انعطف شمالًا إلى مارتفيلي.
    من مارتفيلي يمتد طريق محلي نحو 25 كم حتى كورزو، آخر القرى، وتقدّر وكالة المناطق المحمية الرحلة بنصف
    ساعة. المجموع نحو 309 كم؛ خصّص خمس ساعات ونصفًا. لم نتمكن من التحقق من نوع سطح الكيلومترات الأخيرة،
    لذا خذ سيارة رياضية متعددة الاستخدامات واسأل السكان، خصوصًا بعد المطر. اترك السيارة في كورزو وامشِ
    آخر 3.2 كم. تزوّد بالوقود في سامتريديا أو مارتفيلي.
