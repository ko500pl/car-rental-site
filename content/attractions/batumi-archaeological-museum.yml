ka:
  name: ბათუმის არქეოლოგიური მუზეუმი
  short: კოლხური ოქრო, ბერძნული ამფორები და რომაული მონეტები ერთ პატარა, კარგად აწყობილ დარბაზში.
  body: >-
    **ეს პატარა მუზეუმია, რომელიც ერთ კითხვას პასუხობს: ვინ ცხოვრობდა აქ გონიოსა და პეტრას ციხეებამდე.**
    კოლექცია აჭარის ტერიტორიაზე ჩატარებული გათხრებიდან შედგება — პიჩვნარი, გონიო-აფსაროსი, ციხისძირი —
    და ჯამში ორ ათას ხუთასზე მეტ წელს ფარავს.

    ყველაზე მნიშვნელოვანი ნაწილი პიჩვნარიდანაა, ქობულეთთან ახლოს მდებარე ბერძნულ-კოლხური სამაროვნიდან.
    ძვ. წ. V-IV საუკუნეებში აქ ბერძენი ვაჭრები და ადგილობრივი კოლხები ერთმანეთის გვერდით ცხოვრობდნენ და
    ერთ ნეკროპოლში იმარხებოდნენ — ორივე დაკრძალვის წესით, ერთსა და იმავე მიწაზე. მუზეუმი სწორედ ამას გვიჩვენებს:
    ატიკური შავლაკიანი ჭურჭელი კოლხური თიხის ჭურჭლის გვერდით, ბერძნული ამფორები ღვინითა და ზეთით, ადგილობრივი
    ბრინჯაოს სამაჯურები.

    სხვა ვიტრინებში:

    - **კოლხური ოქრო** — წვრილი, ზუსტი საყურეები და მძივები, ნაწილი მარცვლოვანი ტექნიკით შესრულებული

    - **გონიო-აფსაროსის** რომაული ფენა: მონეტები, სამხედრო აღჭურვილობა, კრამიტი ლეგიონის დამღით

    - შუა საუკუნეების კერამიკა და ქრისტიანული ჯვრები ციხისძირიდან

    დარბაზი ერთია და დიდი არაა; ეტიკეტები ქართულად და ინგლისურადაა, ზოგან მოკლედ. სწორედ ამიტომ ჯობია
    აქ გონიოს ან პეტრას ნახვამდე მისვლა — ქვის კედლები ბევრად უფრო გასაგები ხდება, როცა უკვე გინახავს,
    რა იპოვეს მათ შიგნით. ერთი საათი სავსებით საკმარისია და თუ ბათუმში წვიმს — ეს ერთ-ერთი საუკეთესო ვარიანტია.
  tip: >-
    ერთი საათი სავსებით ჰყოფნის, ორმოცი წუთიც კი. მუზეუმი ცენტრშია, ფეხით ბულვარიდან თხუთმეტ წუთში. შენობა
    ერთსართულიანია, კიბე თითქმის არაა. ეტიკეტების ნაწილი მხოლოდ ქართულადაა — ინგლისურენოვანი ექსკურსია
    წინასწარ უნდა შეათანხმო რეგისტრატურაში. ფოტოზე ზოგჯერ შეზღუდვაა. ტუალეტი შენობაშია, კაფე — არა, მაგრამ
    ირგვლივ ბევრი ადგილია.
  route: >-
    თბილისიდან E60-ით ქუთაისსა და სამტრედიაზე, შემდეგ სამხრეთით ზღვის გზით ქობულეთის გავლით — 370 კმ,
    ხუთი საათი ნახევარი, ბოლომდე ასფალტი. მუზეუმი ბათუმის ცენტრში, ჭავჭავაძის გამზირზეა, ბულვარიდან ერთი
    კილომეტრით შიგნით. მიმდებარე ქუჩებზე პარკინგი ფასიანია, ადგილი დღისით ჩვეულებრივ მოიძებნება. საწვავი
    ქუთაისსა და ოზურგეთშია, ბათუმის შესასვლელშიც. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Batumi Archaeological Museum
  short: Colchian gold, Greek amphorae and Roman coins gathered in one small, well-arranged hall.
  body: >-
    **This is a small museum that answers one question: who lived here before Gonio and Petra were built.**
    The collection comes from excavations across Adjara — Pichvnari, Gonio-Apsaros, Tsikhisdziri — and
    covers something over two and a half thousand years.

    The most important material is from Pichvnari, a Greek and Colchian burial ground near Kobuleti. In
    the 5th and 4th centuries BC Greek traders and local Colchians lived side by side there and were buried
    in the same necropolis, each by their own rite, in the same ground. That is what the cases show: Attic
    black-glaze vessels next to Colchian pottery, Greek amphorae that carried wine and oil, local bronze
    bracelets.

    Elsewhere in the hall:

    - **Colchian goldwork** — fine, precise earrings and beads, some of it granulated

    - The Roman layer from **Gonio-Apsaros**: coins, military fittings, roof tiles stamped by the legion

    - Medieval ceramics and Christian crosses from Tsikhisdziri

    There is one room and it is not large; labels are in Georgian and English, occasionally terse. That
    is precisely why it works best before Gonio or Petra rather than after. Stone walls become far easier
    to read once you have seen what was dug out from inside them — the coin that dates a layer, the tile
    that names a garrison.

    An hour is plenty. If it is raining in Batumi, which it does generously between October and March,
    this is one of the better places in the city to spend that hour.
  tip: >-
    An hour is ample and forty minutes is often enough. The museum is central, a fifteen-minute walk in
    from the boulevard. The building is single-storey with almost no stairs. Some labels are Georgian
    only, so ask at the desk about an English-speaking guide if you want one; it is easier to arrange
    in advance. Photography is occasionally restricted. There are toilets inside but no cafe — plenty
    of them on the surrounding streets.
  route: >-
    From Tbilisi take the E60 through Kutaisi and Samtredia, then the coast road south past Kobuleti —
    370 km, five and a half hours, asphalt throughout. The museum stands in central Batumi on Chavchavadze
    Avenue, about a kilometre inland from the boulevard. Street parking nearby is paid but usually findable
    during the day. Fuel is available at Kutaisi, Ozurgeti and on the approach into Batumi. An economy
    car is entirely sufficient.
ru:
  name: Батумский археологический музей
  short: Колхидское золото, греческие амфоры и римские монеты, собранные в одном небольшом, толково устроенном
    зале.
  body: >-
    **Это маленький музей, отвечающий на один вопрос: кто жил здесь до того, как построили Гонио и Петру.**
    Собрание происходит из раскопок по всей Аджарии — Пичвнари, Гонио-Апсарос, Цихисдзири — и охватывает
    больше двух с половиной тысяч лет.

    Самый важный материал — из Пичвнари, греко-колхидского могильника близ Кобулети. В V-IV веках до н.
    э. греческие торговцы и местные колхи жили там бок о бок и хоронили своих в одном некрополе, каждый
    по собственному обряду, в одной земле. Именно это показывают витрины: аттическая чернолаковая керамика
    рядом с колхидской, греческие амфоры из-под вина и масла, местные бронзовые браслеты.

    В остальной части зала:

    - **Колхидское золото** — тонкие, точные серьги и бусины, часть в технике зерни

    - Римский слой **Гонио-Апсароса**: монеты, детали военного снаряжения, черепица с клеймом легиона

    - Средневековая керамика и христианские кресты из Цихисдзири

    Зал один и невелик, подписи на грузинском и английском, местами скупые. Именно поэтому музей работает
    лучше до Гонио или Петры, а не после. Каменные стены читаются гораздо легче, когда уже видел, что
    из-под них извлекли: монету, датирующую слой, черепицу с именем гарнизона.

    Часа хватает с запасом. Если в Батуми идёт дождь — а с октября по март он идёт щедро, — это одно из
    лучших мест, где провести этот час.
  tip: >-
    Часа более чем достаточно, часто хватает и сорока минут. Музей в центре, пятнадцать минут пешком от
    бульвара. Здание одноэтажное, лестниц почти нет. Часть подписей только по-грузински, так что об англоязычном
    гиде лучше спросить на входе заранее. Иногда действует ограничение на съёмку. Туалет внутри есть,
    кафе нет — зато их много на соседних улицах.
  route: >-
    Из Тбилиси по E60 через Кутаиси и Самтредиа, затем по приморской дороге на юг мимо Кобулети — 370
    км, пять с половиной часов, асфальт всю дорогу. Музей стоит в центре Батуми на проспекте Чавчавадзе,
    примерно в километре вглубь от бульвара. Парковка на соседних улицах платная, но днём место обычно
    находится. Заправки есть в Кутаиси, Озургети и на въезде в Батуми. Машины эконом-класса вполне достаточно.
fa:
  name: موزهٔ باستان‌شناسی باتومی
  short: طلای کلخیدی، خمره‌های یونانی و سکه‌های رومی، گردآمده در یک تالار کوچک و مرتب.
  body: >-
    **این موزهٔ کوچکی است که به یک پرسش پاسخ می‌دهد: پیش از ساخته‌شدن گونیو و پترا چه کسانی اینجا زندگی
    می‌کردند.** مجموعه از کاوش‌های سراسر آجارا می‌آید — پیچونری، گونیو-آپساروس، تسیخیسدزیری — و بیش از
    دو هزار و پانصد سال را در بر می‌گیرد.

    مهم‌ترین یافته‌ها از پیچونری است، گورستانی یونانی-کلخیدی نزدیک کوبولتی. در سده‌های پنجم و چهارم پیش
    از میلاد بازرگانان یونانی و کلخی‌های بومی آنجا کنار هم می‌زیستند و در یک گورستان، هر یک به آیین خود،
    در همان خاک به خاک سپرده می‌شدند. ویترین‌ها همین را نشان می‌دهند: ظروف لعاب‌سیاه آتنی کنار سفال کلخیدی،
    خمره‌های یونانی حامل شراب و روغن، و دستبندهای برنزی بومی.

    در بخش‌های دیگر تالار:

    - **زرگری کلخیدی** — گوشواره‌ها و مهره‌های ظریف و دقیق، بخشی با فن دانه‌نشانی

    - لایهٔ رومی **گونیو-آپساروس**: سکه، یراق نظامی، و سفال بام با مهر لژیون

    - سفالینه‌های سده‌های میانه و صلیب‌های مسیحی از تسیخیسدزیری

    تالار یکی است و بزرگ نیست؛ برچسب‌ها گرجی و انگلیسی‌اند و گاه بسیار کوتاه. درست به همین دلیل این موزه
    پیش از دیدن گونیو یا پترا بهتر جواب می‌دهد تا پس از آن. دیوارهای سنگی وقتی خواناتر می‌شوند که دیده
    باشید از دلشان چه بیرون آمده است: سکه‌ای که لایه را تاریخ‌گذاری می‌کند، سفالی که نام پادگان را می‌برد.

    یک ساعت کافی است. اگر باتومی باران می‌بارد — و از مهر تا اسفند سخاوتمندانه می‌بارد — این یکی از بهترین
    جاهاست برای گذراندن آن ساعت.
  tip: >-
    یک ساعت بیش از کافی است و چهل دقیقه هم اغلب بس است. موزه در مرکز شهر و پانزده دقیقه پیاده از بلوار
    است. ساختمان یک‌طبقه است و تقریباً پله ندارد. بخشی از برچسب‌ها تنها گرجی است، پس اگر راهنمای انگلیسی‌زبان
    می‌خواهید از پیش در پذیرش هماهنگ کنید. گاهی عکاسی محدود است. سرویس بهداشتی هست اما کافه نه؛ در خیابان‌های
    اطراف فراوان است.
  route: >-
    از تفلیس با E60 از کوتایسی و سامترِدیا، سپس جادهٔ ساحلی به جنوب از کنار کوبولتی — ۳۷۰ کیلومتر، پنج
    ساعت و نیم، سرتاسر آسفالت. موزه در مرکز باتومی روی خیابان چاوچاوادزه است، حدود یک کیلومتر داخل‌تر
    از بلوار. پارک خیابانی اطراف پولی است اما در روز معمولاً جا پیدا می‌شود. سوخت در کوتایسی، اوزورگتی
    و ورودی باتومی موجود است. خودروی اقتصادی کاملاً کافی است.
he:
  name: המוזיאון הארכיאולוגי של באטומי
  short: זהב קולכי, אמפורות יווניות ומטבעות רומיים שנאספו לאולם אחד קטן ומסודר היטב.
  body: >-
    **זהו מוזיאון קטן שעונה על שאלה אחת: מי חי כאן לפני שנבנו גוניו ופטרה.** האוסף מגיע מחפירות ברחבי
    אג׳ריה — פיצ׳ווארי, גוניו-אפסארוס, ציחיסדזירי — ומקיף למעלה מאלפיים וחמש מאות שנה.

    החומר החשוב ביותר בא מפיצ׳ווארי, בית קברות יווני וקולכי סמוך לקובולטי. במאות החמישית והרביעית לפני
    הספירה חיו שם סוחרים יוונים וקולכים מקומיים זה לצד זה ונקברו באותה נקרופוליס, כל אחד לפי מנהגו, באותה
    אדמה. זה בדיוק מה שהתצוגות מראות: כלים אתונאיים בזיגוג שחור לצד קדרות קולכית, אמפורות יווניות שנשאו
    יין ושמן, וצמידי ארד מקומיים.

    בשאר האולם:

    - **עבודות זהב קולכיות** — עגילים וחרוזים דקים ומדויקים, חלקם בטכניקת גרעון

    - השכבה הרומית מ**גוניו-אפסארוס**: מטבעות, אבזרי צבא ורעפים חתומים בשם הלגיון

    - קדרות מימי הביניים וצלבים נוצריים מציחיסדזירי

    יש חדר אחד והוא אינו גדול; השילוט בגאורגית ובאנגלית, לעתים תמציתי מדי. דווקא משום כך המוזיאון עובד
    טוב יותר לפני גוניו או פטרה מאשר אחריהם. חומות אבן נקראות בקלות רבה יותר אחרי שראית מה הוצא מתוכן:
    המטבע שמתארך שכבה, הרעף שנושא את שם חיל המצב.

    שעה מספיקה בהחלט. אם יורד גשם בבאטומי — ומאוקטובר עד מרץ הוא יורד בנדיבות — זה אחד המקומות הטובים
    בעיר לבלות בו את השעה הזאת.
  tip: >-
    שעה היא יותר ממספיקה, ולעתים די בארבעים דקות. המוזיאון מרכזי, חמש עשרה דקות הליכה מן השדרה. המבנה
    חד-קומתי וכמעט בלי מדרגות. חלק מן השילוט בגאורגית בלבד, אז אם רוצים מדריך דובר אנגלית עדיף לתאם מראש
    בדלפק. לעתים יש הגבלה על צילום. יש שירותים בפנים אך אין בית קפה — יש רבים ברחובות הסמוכים.
  route: >-
    מטביליסי בכביש E60 דרך קוטאיסי וסמטרדיה, ואז בכביש החוף דרומה על יד קובולטי — 370 ק״מ, חמש שעות וחצי,
    סלול לכל האורך. המוזיאון במרכז באטומי בשדרות צ׳אבצ׳אוואדזה, כקילומטר פנימה מן השדרה החופית. החניה
    ברחובות הסמוכים בתשלום אך בשעות היום בדרך כלל נמצאת. תדלוק בקוטאיסי, באוזורגטי ובכניסה לבאטומי. רכב
    חסכוני מספיק לחלוטין.
ar:
  name: متحف باتومي الأثري
  short: ذهب كولخيدي وجرار يونانية وعملات رومانية مجموعة في قاعة واحدة صغيرة حسنة الترتيب.
  body: >-
    **هذا متحف صغير يجيب عن سؤال واحد: من سكن هنا قبل أن تُبنى غونيو وبيترا.** تأتي المجموعة من تنقيبات
    في أنحاء أجاريا — بيتشفناري وغونيو-أبساروس وتسيخيسدزيري — وتغطي ما يزيد على ألفين وخمسمئة سنة.

    وأهم المواد من بيتشفناري، وهي مقبرة يونانية كولخيدية قرب كوبوليتي. ففي القرنين الخامس والرابع قبل
    الميلاد عاش هناك تجار يونانيون وكولخيديون محليون جنباً إلى جنب، ودُفنوا في المقبرة نفسها، كل بطقسه،
    في التربة ذاتها. وهذا ما تعرضه الواجهات: أوانٍ أتيكية سوداء الطلاء إلى جانب فخار كولخيدي، وجرار يونانية
    حملت الخمر والزيت، وأساور برونزية محلية.

    وفي بقية القاعة:

    - **مشغولات ذهبية كولخيدية** — أقراط وخرز دقيق متقن، بعضه بأسلوب التحبيب

    - الطبقة الرومانية من **غونيو-أبساروس**: عملات وقطع عتاد عسكري وقرميد يحمل ختم الفيلق

    - خزف من العصور الوسطى وصلبان مسيحية من تسيخيسدزيري

    القاعة واحدة وليست كبيرة، والبطاقات بالجورجية والإنجليزية ومقتضبة أحياناً. ولهذا السبب بالذات يعمل
    المتحف قبل غونيو أو بيترا لا بعدهما. فالأسوار الحجرية تُقرأ أسهل بكثير بعد أن ترى ما استُخرج من جوفها:
    العملة التي تؤرخ طبقة، والقرميدة التي تسمي حامية.

    ساعة تكفي بيسر. وإن كانت باتومي تمطر — وهي تمطر بسخاء بين أكتوبر ومارس — فهذا من أفضل ما تقضي فيه
    تلك الساعة.
  tip: >-
    ساعة أكثر من كافية، وأربعون دقيقة تكفي غالباً. المتحف في وسط المدينة، على بعد خمس عشرة دقيقة سيراً
    من الشارع البحري. المبنى من طابق واحد ويكاد يخلو من الدرج. بعض البطاقات بالجورجية فقط، فإن أردت مرشداً
    بالإنجليزية فرتب ذلك مسبقاً عند الاستقبال. وقد يُقيَّد التصوير أحياناً. توجد دورات مياه بالداخل لكن
    لا مقهى؛ والمقاهي كثيرة في الشوارع المجاورة.
  route: >-
    من تبليسي على E60 عبر كوتايسي وسامتريديا، ثم طريق الساحل جنوباً بمحاذاة كوبوليتي — 370 كم، خمس ساعات
    ونصف، معبّد كله. المتحف في وسط باتومي على جادة تشافتشافادزه، على نحو كيلومتر إلى الداخل من الشارع
    البحري. الوقوف في الشوارع القريبة مدفوع لكنه متاح عادة نهاراً. الوقود متوفر في كوتايسي وأوزورغيتي
    وعند مدخل باتومي. وسيارة اقتصادية تكفي تماماً.
