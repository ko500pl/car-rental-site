ka:
  name: სარფი და საზღვარი
  short: >-
    საქართველოს უკანასკნელი სოფელი შავ ზღვაზე — 1921 წელს შუაზე გაყოფილი ლაზური სარფი, ღრმა, გამჭვირვალე
    წყალი და ღია ზღვაში ჩამავალი მზე.
  body: >-
    **სარფში კენჭოვან ნაპირზე დგახართ და ხედავთ, როგორ მთავრდება ქვეყანა.** სოფელი გამშვებ პუნქტამდე ეშვება,
    ბარიერის იქით კი იგივე სოფელი სხვა დროშით გრძელდება და სახელიც თითქმის იგივე ჰქვია — სარპი. საზღვარი
    1921 წელს ყარსის ხელშეკრულებამ გაავლო და ყველაზე უმნიშვნელო რამეს გაჰყვა — პატარა მდინარე ტობაშს,
    ისეთ ვიწროს, რომ გაღმა ნაპირზე ხმის გადაწვდენა ძნელი არ არის.


    თექვსმეტ წელიწადს ორივე ნაპირის ლაზური ოჯახები ერთმანეთთან ჯერ კიდევ საშვით დადიოდნენ. 1937 წელს კარი
    ჩაიკეტა. ნაკადულის ორივე მხარეს ორნახევრიდან სამ მეტრამდე სიმაღლის მავთულხლართი აღმართეს, თითოეულ
    მხარეს სამ-სამი საგუშაგო კოშკი დადგეს, საბჭოთა მხარეს კი გაფხვიერებული მიწის ზოლი გაავლეს, რომ ყოველი
    ნაკვალევი შემჩნეულიყო. სოფლელებს ერთმანეთისკენ გახედვა და ხელის დაქნევაც კი ეკრძალებოდათ. ეს დუმილი
    1988 წლამდე გაგრძელდა, ერთი წლის შემდეგ კი გამშვები პუნქტი გაიხსნა. დღეს იქ, სადაც ნახევარ საუკუნეზე
    მეტ ხანს ნათესავები ერთმანეთს სიტყვას ვერ ეუბნებოდნენ, თურქეთისკენ მიმავალი მანქანები რიგში დგანან.


    ლაზები აქ დღესაც საკუთარ ენაზე ლაპარაკობენ. ლაზური ქართველური ენაა — ქართულის მონათესავე და არა მისი
    კილო — და დღეს გაქრობის საფრთხის წინაშე დგას. სახლები ფერდობზე საფეხურებად ადის და ერთმანეთს ვიწრო
    კიბეებით უკავშირდება.


    მერე კი ზღვაა. კენჭი მსხვილია, წყალი ნაპირთანვე ღრმა და გამჭვირვალე, სამხრეთ კიდეში კი კლდეები სასაზღვრო
    კედლის ძირას პირდაპირ ზღვაში ეშვება. სანაპირო დასავლეთს უყურებს და მზე ღია ზღვაში ჩადის — ხმელეთი
    შუაში აღარ ეღობება.


    აგვისტოს ბოლოს ან სექტემბრის დასაწყისში სარფის სანაპირო სცენად იქცევა: აქ „კოლხობა“ იმართება, ლაზური
    სახალხო დღესასწაული, რომელიც ამ სახელით 1979 წლიდან ტარდება. არგონავტების, აიეტ მეფისა და მედეას ამბავს
    იმ ზღვის პირას თამაშობენ, რომლითაც, მითის მიხედვით, „არგო“ კოლხეთში ჩამოცურდა.


    ჯერ იბანავეთ. მერე გზის ბოლომდე გაიარეთ და შეხედეთ იმ პატარა მდინარეს, რომელმაც მთელი ეს ამბავი დაიტია.
  tip: >-
    ორი-სამი საათი საკმარისია: ჯერ ბანაობა, მერე სოფლის კიბეებზე ასვლა. წყლის ფეხსაცმელი წაიღეთ — კენჭი
    მსხვილია, ფსკერი კი მაშინვე ღრმავდება. პასპორტი თან იქონიეთ: ეს სასაზღვრო ზონაა, მაშინაც, თუ საზღვრის
    გადაკვეთას არ აპირებთ. გამშვებ პუნქტს, მესაზღვრეებსა და ღობეებს ნუ გადაიღებთ — ობიექტივი ჩრდილოეთით,
    ზღვისკენ მიმართეთ. კაფეები გზისპირასაა და ტუალეტიც მხოლოდ მათშია. ზაფხულის შაბათ-კვირას საზღვრის რიგმა
    შეიძლება სოფლის გზაც ჩაკეტოს, ამიტომ დილით ჩამოდით, სჯობს ათ საათამდე. „კოლხობის“ თარიღი ყოველწლიურად
    იცვლება — თუ მასზე გეგმავთ მოგზაურობას, წინასწარ გადაამოწმეთ.
  route: >-
    თბილისიდან სარფამდე 392 კილომეტრია, დაახლოებით ექვსი საათი. ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის
    უღელტეხილზე გადასვლით და ქუთაისის გვერდის ავლით სამტრედიამდე იარეთ, იქიდან ს12-ით ლანჩხუთის გავლით
    გრიგოლეთამდე, ზღვამდე, შემდეგ კი ს2-ით (E70) სამხრეთისკენ — ქობულეთისა და ბათუმის გავლით. ქალაქის
    იქით გზა აეროპორტს ჩაუვლის, ჭოროხზე გადადის და გონიოსა და კვარიათს გაივლის; ბოლო კილომეტრები ვიწროა
    და კლდეშია გაჭრილი, ასე რომ, გასწრებას ნუ ეცდებით. ასფალტი ბოლომდეა, ეკონომკლასის ავტომობილი სავსებით
    საკმარისია. საწვავი ბათუმში ან გონიოში ჩაასხით. მანქანა გზისპირას, სჯობს სოფლის ჩრდილოეთ ბოლოში, გააჩერეთ
    და საზღვრისკენ მიმავალ რიგში შემთხვევით არ ჩადგეთ.
en:
  name: Sarpi and the Border
  short: >-
    Georgia's last village on the Black Sea: a Laz settlement cut in two in 1921, deep clear water, and
    a sunset straight into open sea.
  body: >-
    **In Sarpi you can stand on a pebble beach and watch a country end.** The village runs down to a checkpoint,
    and beyond the barrier the same village carries on under another flag and a clipped version of its
    name: Sarp. The Treaty of Kars drew the line in 1921, and it followed the smallest thing it could
    find — the Tobashi, a stream narrow enough to call across.


    For sixteen years Laz families on either bank still crossed with passes. In 1937 the door shut. Fences
    two and a half to three metres high went up on both banks, with three watchtowers on each side, and
    on the Soviet side a strip of raked earth to hold every footprint. Villagers were forbidden even to
    look across or wave. The silence lasted until 1988; a year later the crossing opened, and today traffic
    for Turkey queues where, for more than half a century, relatives could not exchange a word.


    The Laz still speak their own language here. It is Kartvelian, a sister of Georgian rather than a
    dialect, and now endangered. Houses climb the slope above the road in steps, stitched together by
    stairways.


    Then there is the sea. The pebbles are large, the water deep and clear within a few strides, and at
    the southern end the cliffs drop straight in beneath the border wall. The coast faces west, so the
    sun sets into open water.


    In late August or early September the beach becomes the stage for Kolkhoba, a Laz festival held here
    since 1979, which plays out the myth of the Argonauts, King Aeëtes and Medea beside the sea the Argo
    is said to have crossed.


    Swim first. Then walk to the end of the road and look at the stream that carries the whole story.
  tip: >-
    Two or three hours is enough: a swim, then a climb up the village stairways. Bring water shoes — the
    pebbles are large and the bottom shelves away quickly. Carry your passport; this is a border zone
    even if you are not crossing. Do not photograph the checkpoint, the guards or the fences — point the
    lens north, along the sea. Cafés line the road, and their toilets are the only ones. On summer weekends
    the border queue can block the village road, so arrive in the morning, ideally before ten. Kolkhoba's
    dates shift each year, so check before planning around it.
  route: >-
    Sarpi is 392 km from Tbilisi, about six hours. Take the S1 (E60) west over the Rikoti Pass and past
    Kutaisi to Samtredia, then the S12 through Lanchkhuti to Grigoleti on the coast, and the S2 (E70)
    south through Kobuleti and Batumi. Beyond the city the road passes the airport, crosses the Chorokhi
    and runs through Gonio and Kvariati; the last few kilometres are narrow and cut into the cliff, so
    do not overtake. It is asphalt all the way and an economy car is plenty. Fill up in Batumi or Gonio.
    Park at the roadside, preferably at the northern end of the village, and keep out of the lane queuing
    for the border.
ru:
  name: Сарпи и граница
  short: >-
    Последнее грузинское село на Чёрном море: лазское поселение, разделённое пополам в 1921 году, глубокая
    прозрачная вода и закат прямо в открытое море.
  body: >-
    **В Сарпи можно встать на галечный пляж и увидеть, как заканчивается страна.** Село спускается к контрольно-пропускному
    пункту, а за шлагбаумом то же самое село продолжается уже под другим флагом и с укороченным именем:
    Сарп. Карсский договор провёл линию в 1921 году, и она пошла по самому малому, что нашлось, — по Тобаши,
    ручью, через который можно перекликнуться.


    Шестнадцать лет лазские семьи на обоих берегах ещё ходили друг к другу по пропускам. В 1937 году дверь
    закрылась. На обоих берегах выросли заборы высотой два с половиной – три метра, с тремя сторожевыми
    вышками на каждой стороне, а на советской стороне — полоса вспаханной земли, на которой оставался
    бы каждый след. Жителям запрещалось даже смотреть друг на друга через границу или махать рукой. Молчание
    длилось до 1988 года; годом позже переход открыли, и сегодня там, где больше полувека родственники
    не могли перекинуться словом, стоит очередь машин на Турцию.


    Лазы до сих пор говорят здесь на своём языке. Это картвельский язык, родственный грузинскому, а не
    его диалект, и сегодня он под угрозой исчезновения. Дома уступами поднимаются по склону над дорогой,
    сшитые между собой лестницами.


    Есть здесь и море. Галька крупная, вода глубокая и прозрачная уже через несколько шагов, а на южном
    краю скалы обрываются прямо под пограничной стеной. Берег смотрит на запад, так что солнце садится
    в открытую воду.


    В конце августа или начале сентября пляж становится сценой Колхобы — лазского праздника, который проводят
    здесь с 1979 года и который разыгрывает миф об аргонавтах, царе Ээте и Медее у того самого моря, через
    которое, по преданию, прошёл «Арго».


    Сначала искупайтесь. Потом дойдите до конца дороги и посмотрите на ручей, который несёт всю эту историю.
  tip: >-
    Двух-трёх часов достаточно: купание, затем подъём по сельским лестницам. Возьмите обувь для воды —
    галька крупная, а дно быстро уходит вглубь. Имейте при себе паспорт — это пограничная зона, даже если
    вы не собираетесь пересекать границу. Не фотографируйте пропускной пункт, пограничников и заборы —
    направляйте объектив на север, вдоль моря. Кафе тянутся вдоль дороги, и их туалеты — единственные
    здесь. По летним выходным очередь на границу может перекрыть сельскую дорогу, поэтому приезжайте утром,
    желательно до десяти. Даты Колхобы каждый год меняются, так что уточняйте их заранее, если планируете
    подгадать визит.
  route: >-
    Сарпи находится в 392 км от Тбилиси, около шести часов езды. По трассе S1 (E60) на запад через Рикотский
    перевал и Кутаиси до Самтредиа, затем по S12 через Ланчхути до Григолети на побережье и по S2 (E70)
    на юг через Кобулети и Батуми. За городом дорога проходит мимо аэропорта, пересекает Чорохи и идёт
    через Гонио и Квариати; последние несколько километров узкие и вырублены в скале, поэтому не идите
    на обгон. Дорога асфальтирована на всём протяжении, автомобиля экономкласса вполне достаточно. Заправляйтесь
    в Батуми или Гонио. Оставляйте машину у дороги, лучше в северной части села, и не занимайте полосу,
    где стоит очередь на границу.
fa:
  name: سارپی و مرز
  short: >-
    آخرین روستای گرجستان بر دریای سیاه: سکونتگاهی لازی که در ۱۹۲۱ به دو نیم شد، آبی زلال و عمیق، و غروبی
    راست به دل دریای باز.
  body: >-
    **در سارپی می‌توانید بر ساحل سنگ‌ریزه بایستید و پایان یک کشور را تماشا کنید.** روستا تا ایستگاه مرزی
    پیش می‌رود، و آن سوی نرده همان روستا زیر پرچمی دیگر و با نامی کوتاه‌شده ادامه می‌یابد: سارپ. پیمان
    قارص در سال ۱۹۲۱ این خط را کشید، و آن را بر کوچک‌ترین چیزی که یافت کشید — توباشی، جویباری چنان باریک
    که می‌شود از این سو به آن سو صدا زد.


    شانزده سال خانواده‌های لاز در دو سوی رودخانه هنوز با مجوز عبور می‌کردند. در سال ۱۹۳۷ در بسته شد. حصارهایی
    به بلندای دو و نیم تا سه متر بر هر دو کناره کشیده شد، با سه برج دیده‌بانی در هر سو، و در سمت شوروی
    نواری از خاک شخم‌زده که هر جای پایی را نگه می‌داشت. حتی نگاه‌کردن یا دست‌تکان‌دادن به‌سوی آن‌سو برای
    روستاییان ممنوع بود. سکوت تا سال ۱۹۸۸ ادامه یافت؛ یک سال بعد گذرگاه گشوده شد، و امروز در همان جایی
    که بیش از نیم‌سده خویشاوندان نتوانستند کلامی رد و بدل کنند، صف خودروهای راهی ترکیه می‌ایستد.


    لازها هنوز این‌جا به زبان خودشان سخن می‌گویند. این زبانی کارتولی است، خواهر زبان گرجی و نه گویشی از
    آن، و اکنون در خطر نابودی است. خانه‌ها پله‌پله بر دامنه بالای راه بالا می‌روند، به‌هم‌دوخته با پلکان‌ها.


    و دریا هم هست. سنگ‌ریزه‌ها بزرگ‌اند، آب در چند گام عمیق و زلال می‌شود، و در انتهای جنوبی صخره‌ها راست
    زیر دیوار مرزی به آب می‌ریزند. ساحل رو به غرب است، پس خورشید در دل دریای باز فرو می‌رود.


    در پایان اوت یا آغاز سپتامبر، ساحل به صحنهٔ کولخوبا بدل می‌شود، جشنی لازی که از سال ۱۹۷۹ اینجا برگزار
    می‌شود و افسانهٔ آرگونوت‌ها، پادشاه ائتس و مدئا را کنار همان دریایی بازمی‌گوید که گویند «آرگو» از
    آن گذشته است.


    نخست شنا کنید. سپس تا انتهای راه بروید و به جویباری بنگرید که تمام این داستان را با خود می‌برد.
  tip: >-
    دو تا سه ساعت کافی است: یک شنا، سپس بالارفتن از پلکان‌های روستا. کفش مخصوص آب همراه ببرید — سنگ‌ریزه‌ها
    بزرگ‌اند و بستر به‌سرعت عمیق می‌شود. گذرنامه‌تان را همراه داشته باشید؛ این‌جا منطقهٔ مرزی است حتی
    اگر قصد عبور نداشته باشید. از ایستگاه مرزی، نگهبانان یا حصارها عکس نگیرید — دوربین را رو به شمال،
    در امتداد دریا بگیرید. کافه‌ها در امتداد راه‌اند، و سرویس‌های بهداشتی‌شان تنها گزینه‌اند. در آخر هفته‌های
    تابستان، صف مرز می‌تواند راه روستا را ببندد، پس صبح زود بیایید، ترجیحاً پیش از ساعت ده. تاریخ کولخوبا
    هر سال تغییر می‌کند، پس اگر می‌خواهید سفرتان را با آن هماهنگ کنید، پیش از آن بررسی کنید.
  route: >-
    سارپی ۳۹۲ کیلومتر از تفلیس فاصله دارد، حدود شش ساعت. مسیر S1 (E60) را رو به غرب از گذرگاه ریکوتی و
    کنار کوتایسی تا سامتردیا بروید، سپس S12 را از لانچخوتی تا گریگولتی بر ساحل، و S2 (E70) را رو به جنوب
    از کوبولتی و باتومی. پس از شهر، راه از کنار فرودگاه می‌گذرد، از چوروخی عبور می‌کند و از گونیو و کواریاتی
    می‌رود؛ چند کیلومتر آخر باریک و درون صخره کنده شده‌اند، پس سبقت نگیرید. تمام راه آسفالت است و خودروی
    اقتصادی کافی است. باک را در باتومی یا گونیو پر کنید. ماشین را کنار راه پارک کنید، ترجیحاً در بخش شمالی
    روستا، و از خطی که صف مرز در آن می‌ایستد دور بمانید.
he:
  name: סארפי והגבול
  short: >-
    הכפר האחרון של גאורגיה על הים השחור: יישוב לאזי שנחצה לשניים ב-1921, מים צלולים ועמוקים, ושקיעה היישר
    לתוך הים הפתוח.
  body: >-
    **בסארפי אפשר לעמוד על חוף חלוקים ולראות מדינה מסתיימת.** הכפר יורד עד מחסום, ומעבר לגדר ממשיך אותו
    כפר עצמו תחת דגל אחר ובשם מקוצר: סארפ. אמנת קארס משכה את הקו ב-1921, ובחרה בדבר הקטן ביותר שמצאה —
    טובאשי, נחל צר מספיק כדי לקרוא ממנו לצד השני.


    במשך שש-עשרה שנה עדיין חצו משפחות לאזיות משתי הגדות בהיתרי מעבר. ב-1937 נסגרה הדלת. גדרות בגובה שניים
    וחצי עד שלושה מטרים הוקמו בשתי הגדות, עם שלושה מגדלי שמירה בכל צד, ובצד הסובייטי רצועת עפר חרושה שנועדה
    לשמור כל עקבה. לתושבים אף נאסר להביט אל הצד השני או לנופף. הדממה נמשכה עד 1988; שנה לאחר מכן נפתח
    המעבר, וכיום עומד תור המכוניות לטורקיה במקום שבו, למשך יותר מחצי מאה, לא יכלו קרובי משפחה להחליף מילה.


    הלאזים עדיין מדברים כאן בשפתם. זו שפה קרתוולית, אחות של הגאורגית ולא ניב שלה, וכיום היא בסכנת הכחדה.
    הבתים מטפסים במדרון שמעל הכביש בטרסות, תפורים זה לזה בגרמי מדרגות.


    ויש גם הים. החלוקים גדולים, המים עמוקים וצלולים כבר לאחר כמה פסיעות, ובקצה הדרומי צונחים המצוקים היישר
    מתחת לחומת הגבול. החוף פונה מערבה, כך שהשמש שוקעת לתוך מים פתוחים.


    בסוף אוגוסט או תחילת ספטמבר הופך החוף לבמה של קולחובה, פסטיבל לאזי שנערך כאן מאז 1979 ומעלה על הבמה
    את המיתוס על הארגונאוטים, המלך איטס ומדיאה, לצד אותו הים שלפי האגדה חצתה אותו הספינה ארגו.


    שחו קודם. אחר כך צעדו לקצה הכביש והביטו בנחל שנושא את כל הסיפור הזה.
  tip: >-
    שעתיים או שלוש מספיקות: שחייה, ואז טיפוס בגרמי המדרגות של הכפר. הביאו נעלי מים — החלוקים גדולים והקרקעית
    משתפלת מהר לעומק. קחו דרכון; זה אזור גבול גם אם אינכם מתכוונים לחצות. אל תצלמו את המחסום, השומרים
    או הגדרות — כוונו את העדשה צפונה, לאורך הים. בתי קפה פזורים לאורך הכביש, והשירותים שלהם הם היחידים
    כאן. בסופי שבוע בקיץ תור הגבול יכול לחסום את כביש הכפר, אז הגיעו בבוקר, רצוי לפני השעה עשר. תאריכי
    קולחובה משתנים משנה לשנה, אז בדקו מראש אם אתם מתכננים לפיהם.
  route: >-
    סארפי במרחק 392 ק"מ מטביליסי, כשש שעות נסיעה. סעו בכביש S1 (E60) מערבה דרך מעבר ריקוטי ולצד קוטאיסי
    עד סמטרדיה, ואז ב-S12 דרך לנצ'חוטי עד גריגולטי על החוף, וב-S2 (E70) דרומה דרך קובולטי ובטומי. אחרי
    העיר עובר הכביש סמוך לשדה התעופה, חוצה את צ'ורוחי ועובר בגוניו ובקווריאטי; הקילומטרים האחרונים צרים
    וחצובים בסלע, אז אל תעקפו. הכביש אספלט לכל אורכו, ורכב אקונומי מספיק בהחלט. תדלקו בבטומי או בגוניו.
    חנו בצד הדרך, רצוי בקצה הצפוני של הכפר, והישארו הרחק מהנתיב שבו עומד תור הגבול.
ar:
  name: ساربي والحدود
  short: >-
    آخر قرية جورجية على البحر الأسود: قرية لازية شُطرت إلى نصفين عام 1921، بمياه عميقة صافية وغروب يتّجه
    مباشرة إلى عرض البحر.
  body: >-
    **في ساربي يمكنك أن تقف على شاطئ حصوي وتشاهد بلدًا ينتهي.** تنحدر القرية نزولًا إلى نقطة تفتيش، وخلف
    الحاجز تستمر تلك القرية نفسها تحت راية أخرى وباسم مختصر: سارب. رسمت معاهدة قارص هذا الخط عام 1921،
    وسارت على أصغر ما وجدته — توباشي، جدول ضيق يكفي للنداء عبره من ضفة إلى أخرى.


    لستة عشر عامًا ظلت العائلات اللازية على الضفتين تتزاور بتصاريح عبور. في عام 1937 أُغلق الباب. أُقيمت
    أسوار بارتفاع مترين ونصف إلى ثلاثة أمتار على الضفتين، مع ثلاثة أبراج مراقبة على كل جانب، وعلى الجانب
    السوفيتي شريط من التراب المحروث ليحفظ كل أثر قدم. حتى النظر إلى الجانب الآخر أو التلويح كان محظورًا
    على القرويين. دام الصمت حتى عام 1988؛ وبعد عام فُتح المعبر، واليوم يقف طابور السيارات نحو تركيا في
    المكان الذي لم يستطع فيه الأقرباء تبادل كلمة واحدة لأكثر من نصف قرن.


    لا يزال اللاز يتحدثون لغتهم هنا. وهي لغة كارتفيلية، أخت للجورجية لا لهجة منها، وهي اليوم في خطر الانقراض.
    تتسلق البيوت المنحدر فوق الطريق على شكل درجات، تربطها سلالم.


    وهناك البحر أيضًا. الحصى كبير، والماء يصبح عميقًا وصافيًا بعد خطوات قليلة، وعند الطرف الجنوبي تنحدر
    الجروف مباشرة تحت جدار الحدود. يواجه الساحل الغرب، فتغرب الشمس في عرض البحر المفتوح.


    في أواخر أغسطس أو أوائل سبتمبر، يتحوّل الشاطئ إلى مسرح لمهرجان كولخوبا، احتفال لازي يُقام هنا منذ
    عام 1979 ويُعيد تمثيل أسطورة الأرغونوتيين والملك إيتيس وميديا قرب البحر نفسه الذي يُقال إن سفينة أرغو
    عبرته.


    اسبح أولًا. ثم اذهب إلى نهاية الطريق وتأمّل الجدول الذي يحمل كل هذه القصة.
  tip: >-
    تكفي ساعتان أو ثلاث: سباحة، ثم تسلّق سلالم القرية. احمل حذاءً مائيًا — الحصى كبير والقاع ينحدر بسرعة
    نحو العمق. احمل جواز سفرك؛ فهذه منطقة حدودية حتى إن لم تكن تنوي العبور. لا تصوّر نقطة التفتيش أو الحرس
    أو الأسوار — وجّه العدسة شمالًا، على امتداد البحر. تنتشر المقاهي على الطريق، ومراحيضها هي الوحيدة
    هنا. في عطلات نهاية الأسبوع الصيفية قد يسدّ طابور الحدود طريق القرية، فتعال في الصباح، ويُفضَّل قبل
    العاشرة. تتغيّر مواعيد كولخوبا كل عام، فتحقّق منها مسبقًا إن كنت تخطط بحسبها.
  route: >-
    تبعد ساربي 392 كم عن تبليسي، نحو ست ساعات. خذ الطريق S1 (E60) غربًا فوق ممر ريكوتي وقرب كوتايسي إلى
    سامتريديا، ثم S12 عبر لانتشخوتي إلى غريغوليتي على الساحل، ثم S2 (E70) جنوبًا عبر كوبوليتي وباتومي.
    بعد المدينة يمر الطريق قرب المطار، ويعبر نهر تشوروخي، ويمرّ بغونيو وكفارياتي؛ الكيلومترات الأخيرة
    ضيقة ومحفورة في الصخر، فلا تتجاوز. الطريق مُعبّد بالكامل، وسيارة اقتصادية كافية تمامًا. عبّئ الوقود
    في باتومي أو غونيو. اترك السيارة على جانب الطريق، ويُفضَّل في الطرف الشمالي للقرية، وابقَ بعيدًا عن
    الحارة التي يقف فيها طابور الحدود.
