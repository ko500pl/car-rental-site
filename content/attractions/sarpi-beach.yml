ka:
  name: სარფი და საზღვარი
  short: საქართველოს ბოლო სოფელი შავ ზღვაზე — ციცაბო კლდეები, ღრმა წყალი და თურქეთის სასაზღვრო გამშვები.
  body: >-
    **სარფი საქართველოს დასასრულია — ბუკვალურად.** სოფლის სამხრეთ ბოლოში სასაზღვრო გამშვები პუნქტია და
    მის მიღმა იმავე სახელის თურქული სოფელი გრძელდება. საზღვარი 1921 წელს გაივლო და სოფელი შუაზე გაჰყო;
    ორივე მხარეს ერთი და იმავე გვარის ლაზური ოჯახები დარჩნენ, რომლებიც ათწლეულების განმავლობაში ერთმანეთს
    ვერ ხედავდნენ.

    ეს ისტორია სარფს იმაზე მეტ სიმძიმეს ანიჭებს, ვიდრე ჩვეულებრივ პლაჟს. ლაზური ენა აქ დღემდე ისმის —
    ქართველურ ენათა ოჯახის წევრი, ქართულისგან განსხვავებული და თანდათან იშვიათი. სოფლის სახლები კლდის
    ფერდობზეა აშენებული, ერთი მეორის თავზე, ვიწრო კიბეებით.

    სანაპირო აჭარაში ერთ-ერთი საუკეთესოა. კენჭი მსხვილია, წყალი ღრმა და ძალიან სუფთა — ეს კონტინენტური
    შელფის ბოლო წერტილია სანამ ფსკერი ჩავარდება. სამხრეთის ბოლოში, საზღვრის კედლის ქვეშ, კლდეები პირდაპირ
    წყალში ეშვება.

    რამდენიმე რამ, რაც უნდა იცოდე:

    - საზღვართან **ფოტოგადაღება აკრძალულია** — გამშვები პუნქტისა და მისი პერიმეტრის სურათი არ გადაიღო

    - ზაფხულის შაბათ-კვირას გამშვებთან **მანქანების რიგია**, რაც სოფლის გზას ხშირად კეტავს

    - პასპორტი თან იქონიე; საზღვრის გადაკვეთის გარეშეც ეს სასაზღვრო ზონაა

    - მზის ჩასვლა აქ განსაკუთრებულია: მზე პირდაპირ ღია ზღვაში ეშვება, ხმელეთი აღარსად ერევა

    ბათუმიდან ოცდაათი წუთია. ერთ დღეში სარფი, კვარიათი და გონიოს ციხე მშვიდად ეტევა.
  tip: >-
    სამი საათი — ბანაობა და სოფლის შემოვლა. ჩუსტი აუცილებელია, კენჭი მსხვილია და ფსკერი მალე ღრმავდება.
    გამშვები პუნქტისა და სასაზღვრო ინფრასტრუქტურის ფოტოგადაღება აკრძალულია. პასპორტი თან იქონიე. კაფეები
    გზის პირასაა, ტუალეტი მათშივე. ზაფხულის შაბათ-კვირას საზღვართან მანქანების რიგი გზას ხურავს — მოდი
    დილით.
  route: >-
    ბათუმიდან სამხრეთით ზღვისპირა გზით ჭოროხის ხიდზე, ადლიაზე, გონიოსა და კვარიათზე გავლით — თბილისიდან
    ჯამში 392 კმ, დაახლოებით ექვსი საათი. გზა ბოლომდე ასფალტია და კარგია, ბოლო ათი კილომეტრი კი ვიწრო
    და კლდეში ჩაჭრილი — ფრთხილად გამოსწრებისას. სოფელში პარკინგი გზის პირასაა და ზაფხულში სავსე; ჯობია
    სოფლის ჩრდილო ბოლოში დააყენო. საწვავი ბათუმსა და გონიოშია. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Sarpi and the Border
  short: Georgia's last village on the Black Sea — steep cliffs, deep water and the Turkish frontier crossing.
  body: >-
    **Sarpi is where Georgia ends, literally.** The border post stands at the southern end of the village
    and the Turkish village of the same name continues beyond it. The line was drawn in 1921 and cut the
    settlement in half; Laz families with the same surnames were left on both sides and for decades could
    not see one another.

    That history gives Sarpi more weight than an ordinary beach. Laz is still spoken here — a Kartvelian
    language, distinct from Georgian and slowly becoming rare. The houses climb the cliff slope one above
    another, linked by narrow flights of steps.

    The beach is among the best in Adjara. The pebbles are large, the water deep and unusually clean;
    this is the last of the shelf before the bottom falls away. At the southern end, under the border
    wall, rock faces drop straight into the sea.

    A few things to know:

    - **Photography is prohibited** at the crossing — do not photograph the border post or its perimeter

    - On summer weekends a **queue of cars** builds at the checkpoint and frequently blocks the village
    road

    - Carry your passport; this is a border zone even if you are not crossing

    - Sunset here is unlike anywhere else on the coast: the sun goes down into open sea with no land in
    the way

    It is half an hour from Batumi. Sarpi, Kvariati and Gonio fortress fit comfortably into one unhurried
    day, and the border itself is worth ten minutes of standing and looking, even if you have no intention
    of crossing.
  tip: >-
    Three hours covers a swim and a walk through the village. Water shoes matter here — the pebbles are
    large and the bottom drops quickly. Photographing the checkpoint and border infrastructure is forbidden.
    Carry your passport. Cafes line the road and the toilets are inside them. On summer weekends the queue
    for the crossing can block the through road, so come in the morning.
  route: >-
    From Batumi drive south on the coast road over the Chorokhi bridge and through Adlia, Gonio and Kvariati
    — 392 km from Tbilisi in total, about six hours. The road is asphalt and in good condition, though
    the final ten kilometres are narrow and cut into the cliff, so overtake carefully. Parking in the
    village is roadside and full in summer; it is easier at the northern end. Fuel is available in Batumi
    and Gonio. An economy car is entirely sufficient.
ru:
  name: Сарпи и граница
  short: Последнее село Грузии на Чёрном море — обрывы, глубокая вода и турецкий пограничный переход.
  body: >-
    **Сарпи — то место, где Грузия заканчивается буквально.** Пограничный пункт стоит у южного края села,
    а за ним продолжается турецкое село с тем же названием. Линию провели в 1921 году, и она разрезала
    посёлок пополам; лазские семьи с одинаковыми фамилиями остались по обе стороны и десятилетиями не
    могли видеться.

    Эта история придаёт Сарпи вес, которого у обычного пляжа нет. Лазский язык здесь ещё звучит — картвельский
    язык, отличный от грузинского и постепенно редеющий. Дома лепятся по склону обрыва один над другим,
    соединённые узкими лестницами.

    Пляж — из лучших в Аджарии. Галька крупная, вода глубокая и на редкость чистая: это последний участок
    шельфа перед тем, как дно уходит вниз. У южного края, под пограничной стеной, скалы обрываются прямо
    в море.

    Что нужно знать:

    - У перехода **съёмка запрещена** — не фотографируйте пограничный пункт и его периметр

    - По летним выходным у пункта скапливается **очередь машин**, часто перекрывающая сельскую дорогу

    - Держите при себе паспорт: это пограничная зона, даже если вы никуда не едете

    - Закат здесь не такой, как на остальном побережье: солнце садится прямо в открытое море, без суши
    на пути

    От Батуми — полчаса. Сарпи, Квариати и крепость Гонио спокойно укладываются в один неторопливый день,
    а сама граница стоит десяти минут созерцания, даже если пересекать её вы не собираетесь.
  tip: >-
    Три часа — купание и прогулка по селу. Тапки для воды здесь важны: галька крупная, дно быстро уходит
    вниз. Снимать пограничный пункт и его инфраструктуру запрещено. Паспорт держите при себе. Кафе стоят
    вдоль дороги, туалеты при них. По летним выходным очередь на переход перекрывает сквозной проезд,
    так что приезжайте утром.
  route: >-
    Из Батуми на юг по приморской дороге через мост над Чорохи, мимо Адлии, Гонио и Квариати — от Тбилиси
    всего 392 км, около шести часов. Дорога асфальтированная и в хорошем состоянии, но последние десять
    километров узкие и врезаны в скалу, обгонять надо аккуратно. Парковка в селе вдоль дороги и летом
    забита; проще встать у северного края. Заправки в Батуми и Гонио. Машины эконом-класса вполне достаточно.
fa:
  name: سارپی و مرز
  short: آخرین روستای گرجستان بر دریای سیاه — صخره‌های تند، آب ژرف و گذرگاه مرزی ترکیه.
  body: >-
    **سارپی جایی است که گرجستان به‌معنای واقعی پایان می‌یابد.** پاسگاه مرزی در انتهای جنوبی روستاست و
    آن‌سوی آن روستایی ترک با همین نام ادامه می‌یابد. خط مرزی در ۱۹۲۱ کشیده شد و آبادی را دو نیم کرد؛ خانواده‌های
    لاز با نام‌های خانوادگی یکسان در دو سو ماندند و دهه‌ها نتوانستند یکدیگر را ببینند.

    همین تاریخ به سارپی وزنی می‌دهد که یک ساحل معمولی ندارد. زبان لازی هنوز اینجا شنیده می‌شود؛ زبانی
    از خانوادهٔ کارتولی، جدا از گرجی و رفته‌رفته کمیاب. خانه‌ها روی دامنهٔ صخره یکی بالای دیگری چیده شده‌اند
    و پلکان‌های باریک آن‌ها را به هم می‌بندد.

    ساحل از بهترین‌های آجاراست. سنگ‌ریزه‌ها درشت‌اند و آب ژرف و به‌طرز نامعمولی پاکیزه؛ اینجا آخرین بخش
    فلات قاره پیش از فروافتادن کف است. در انتهای جنوبی، زیر دیوار مرزی، دیوارهٔ سنگ مستقیم در دریا فرو
    می‌رود.

    چند نکته:

    - **عکاسی ممنوع است** نزد گذرگاه — از پاسگاه مرزی و محوطهٔ آن عکس نگیرید

    - آخر هفته‌های تابستان **صف خودروها** نزد گذرگاه شکل می‌گیرد و اغلب جادهٔ روستا را می‌بندد

    - گذرنامه همراه داشته باشید؛ اینجا منطقهٔ مرزی است حتی اگر قصد عبور ندارید

    - غروب اینجا با هیچ‌جای دیگر ساحل یکی نیست: خورشید مستقیم در دریای باز فرو می‌رود، بی‌آنکه خشکی سر
    راه باشد

    نیم ساعت با باتومی فاصله دارد. سارپی، کواریاتی و قلعهٔ گونیو به‌راحتی در یک روز بی‌شتاب جا می‌شوند.
  tip: >-
    سه ساعت برای شنا و گشتی در روستا کافی است. کفش دریایی اینجا مهم است؛ سنگ‌ریزه درشت است و کف زود گود
    می‌شود. عکاسی از پاسگاه و تأسیسات مرزی ممنوع است. گذرنامه همراه بردارید. کافه‌ها کنار جاده‌اند و سرویس
    بهداشتی داخل آن‌ها. آخر هفته‌های تابستان صف گذرگاه راه عبور را می‌بندد، پس صبح بیایید.
  route: >-
    از باتومی به جنوب در جادهٔ ساحلی از پل چوروخی و از کنار آدلیا، گونیو و کواریاتی — از تفلیس روی‌هم
    ۳۹۲ کیلومتر، حدود شش ساعت. جاده آسفالت و در وضعیت خوب است، اما ده کیلومتر آخر باریک و در دل صخره بریده
    شده، پس با احتیاط سبقت بگیرید. پارک در روستا کنار جاده است و تابستان پر؛ در انتهای شمالی آسان‌تر است.
    سوخت در باتومی و گونیو. خودروی اقتصادی کاملاً کافی است.
he:
  name: סארפי והגבול
  short: הכפר האחרון של גאורגיה על הים השחור — מצוקים תלולים, מים עמוקים ומעבר הגבול לטורקיה.
  body: >-
    **סארפי היא המקום שבו גאורגיה נגמרת, פשוטו כמשמעו.** תחנת הגבול עומדת בקצה הדרומי של הכפר, ומעברה
    ממשיך כפר טורקי באותו שם. הקו נמתח ב-1921 וחצה את היישוב לשניים; משפחות לאזיות בעלות אותם שמות משפחה
    נותרו משני הצדדים ולא יכלו להיפגש במשך עשורים.

    ההיסטוריה הזאת נותנת לסארפי משקל שאין לחוף רגיל. הלאזית עדיין נשמעת כאן — שפה קרטווליתית, נבדלת מגאורגית
    והולכת ומתמעטת. הבתים מטפסים על מדרון המצוק זה מעל זה, מחוברים במדרגות צרות.

    החוף הוא מן הטובים באג׳ריה. החלוקים גדולים, המים עמוקים ונקיים באופן חריג; זהו קצה המדף לפני שהקרקעית
    צונחת. בקצה הדרומי, מתחת לחומת הגבול, קירות סלע יורדים היישר אל הים.

    כמה דברים שכדאי לדעת:

    - **הצילום אסור** במעבר — אל תצלמו את תחנת הגבול או את שטחה

    - בסופי שבוע בקיץ נבנה **תור מכוניות** במעבר וחוסם לעתים קרובות את דרך הכפר

    - שאו דרכון; זהו אזור גבול גם אם אינכם חוצים

    - השקיעה כאן שונה מכל מקום אחר בחוף: השמש שוקעת אל ים פתוח בלי יבשה בדרך

    חצי שעה מבאטומי. סארפי, קווריאתי ומבצר גוניו נכנסים בנוחות ליום אחד לא דחוס.
  tip: >-
    שלוש שעות מספיקות לשחייה ולסיבוב בכפר. נעלי ים חשובות כאן — החלוקים גדולים והקרקעית יורדת מהר. אסור
    לצלם את תחנת הגבול ומתקניה. שאו דרכון. בתי הקפה לאורך הכביש והשירותים בתוכם. בסופי שבוע בקיץ התור
    למעבר חוסם את הכביש, אז הגיעו בבוקר.
  route: >-
    מבאטומי דרומה בכביש החוף מעל גשר צ׳ורוחי ודרך אדליה, גוניו וקווריאתי — 392 ק״מ מטביליסי בסך הכול,
    כשש שעות. הכביש סלול ובמצב טוב, אך עשרת הקילומטרים האחרונים צרים וחצובים במצוק, לכן עקפו בזהירות.
    החניה בכפר לצד הכביש ומלאה בקיץ; קל יותר בקצה הצפוני. תדלוק בבאטומי ובגוניו. רכב חסכוני מספיק לחלוטין.
ar:
  name: سارپي والحدود
  short: آخر قرى جورجيا على البحر الأسود — جروف حادة ومياه عميقة ومعبر الحدود مع تركيا.
  body: >-
    **سارپي هي حيث تنتهي جورجيا، حرفياً.** يقوم المركز الحدودي عند الطرف الجنوبي للقرية، وخلفه تستمر قرية
    تركية بالاسم نفسه. رُسم الخط عام 1921 فشطر البلدة نصفين؛ وبقيت عائلات لازية تحمل الألقاب ذاتها على
    الجانبين ولم تستطع أن ترى بعضها عقوداً.

    هذا التاريخ يمنح سارپي ثقلاً لا يملكه شاطئ عادي. ما زالت اللغة اللازية تُسمع هنا؛ لغة كارتفيلية متميزة
    عن الجورجية وتزداد ندرة. والبيوت تتسلق منحدر الجرف واحداً فوق الآخر، تربطها سلالم ضيقة.

    والشاطئ من أفضل شواطئ أجاريا. الحصى كبيرة والماء عميق ونظيف على نحو غير معتاد؛ فهذا آخر الرف قبل أن
    يهوي القاع. وعند الطرف الجنوبي، تحت جدار الحدود، تهبط جدران الصخر مباشرة في البحر.

    أمور ينبغي معرفتها:

    - **التصوير ممنوع** عند المعبر — لا تصور المركز الحدودي ولا محيطه

    - في عطلات الصيف يتكون **طابور سيارات** عند المعبر ويسد طريق القرية مراراً

    - احمل جواز سفرك؛ فهذه منطقة حدودية حتى إن لم تكن عابراً

    - الغروب هنا مختلف عن كل الساحل: الشمس تنزل في بحر مفتوح دون يابسة في الطريق

    نصف ساعة من باتومي. وتتسع سارپي وكفارياتي وقلعة غونيو ليوم واحد غير متعجل.
  tip: >-
    ثلاث ساعات تكفي للسباحة وجولة في القرية. حذاء الماء مهم هنا؛ فالحصى كبيرة والقاع ينحدر سريعاً. يُمنع
    تصوير المركز الحدودي ومنشآته. احمل جواز سفرك. المقاهي على جانب الطريق ودورات المياه داخلها. وفي عطلات
    الصيف يسد طابور المعبر الطريق العابر، فتعال صباحاً.
  route: >-
    من باتومي جنوباً على طريق الساحل فوق جسر تشوروخي ثم عبر أدليا وغونيو وكفارياتي — 392 كم من تبليسي
    إجمالاً، نحو ست ساعات. الطريق معبّد وبحالة جيدة، غير أن العشرة كيلومترات الأخيرة ضيقة ومحفورة في الجرف،
    فتجاوز بحذر. الوقوف في القرية على جانب الطريق وممتلئ صيفاً؛ وهو أسهل عند الطرف الشمالي. الوقود في
    باتومي وغونيو. وسيارة اقتصادية تكفي تماماً.
