ka:
  name: ზეკარის უღელტეხილი
  short: >-
    2182-მეტრიანი, მხოლოდ ზაფხულობით გასავალი უღელტეხილი მესხეთის ქედზე, სადაც ჯიპის ტრასა კოლხური ტყიდან
    აბასთუმნის თავზე აყვავებულ მდელოებზე ადის.
  body: >-
    **ზეკარზე ერთი დილის სავალი გზა კოლხური ტყიდან ამოგიყვანთ და მესხეთის ქედის სახურავზე დაგსვამთ.**
    2182 მეტრზე, იმერეთისა და სამცხე-ჯავახეთის საზღვარზე მდებარე ამ უღელტეხილზე საუკუნეების განმავლობაში
    ორ მხარეს შორის საქარავნო გზა გადიოდა. 1893 წლის აგვისტოში აქ ბრიტანელმა მოგზაურმა ჰენრი ლინჩმა, შემდგომში
    პარლამენტის წევრმა, გადაიარა და დაწერა, რომ ახლო აზიაში ძნელად თუ მოიძებნება ადგილი, საიდანაც ზეკარის
    თხემზე გადაშლილის მსგავსი, „ერთდროულად ასეთი დიდებული და ასეთი შემეცნებითი“ ხედი იხსნება.


    დღეს აქ მოუასფალტებელი შ14 გადის — დაახლოებით 40 კილომეტრი ქვის, ღრმა ნაკვალევისა და წვიმის შემდეგ
    ტალახისა, იმერეთის მხარეს საირმის განშტოებიდან მეორე მხარეს აბასთუმნამდე. ჩრდილოეთიდან გზა ხშირ, ნოტიო
    ტყეში იწყება, მერე კი ღია საძოვრებზე ამოდის, სადაც მწყემსები საზაფხულო ბანაკებს შლიან, მათი ძაღლები
    კი ყოველ გამვლელ მანქანას თავად ამოწმებენ. ივლის-აგვისტოში უღელტეხილის ორივე კალთა ყვავილობს, მოწმენდილ
    დღეს კი ხედი ქედების უსასრულო ტალღებზე იშლება.


    გადაღმა ტრასა ბორჯომ-ხარაგაულის ეროვნული პარკის განაპირას ფიჭვის სურნელით სავსე აბასთუმნის ხეობაში
    ეშვება. აქ, ყანობილის მთაზე, 1650–1700 მეტრზე, ასტრონომმა ევგენი ხარაძემ 1932 წელს აბასთუმნის ასტროფიზიკური
    ობსერვატორია დააარსა — საუკეთესო მეზობელი გზისთვის, სადაც ცა უცებ ხედის უდიდეს ნაწილს იკავებს.


    თოვლი ზეკარს ოქტომბრიდან ივნისამდე კეტავს, ამიტომ სეზონი მოკლეა და წესებს ამინდი წერს. მშრალი კვირა
    შეარჩიეთ, ადრე გამოდით და მანქანა დაბალ გადაცემაზე ნელა აიყვანეთ: ეს უღელტეხილი მოთმინებას გაცილებით
    უფრო აფასებს, ვიდრე ცხენის ძალებს.
  tip: >-
    მხოლოდ ნამდვილი 4x4 და თავდაჯერებული მძღოლი — წვიმის შემდეგ ტრასა კროსოვერებს აჩერებს და ნამდვილ ჯიპებსაც
    სცდის. გამგზავრებამდე საირმეში ან ბაღდათში იკითხეთ, გადიოდნენ თუ არა ამ კვირაში მანქანები, და თუ შესაძლებელია,
    მეორე მანქანასთან ერთად იმოგზაურეთ. სავსე ავზი, წყალი, საგზალი და თბილი ტანსაცმელი წაიღეთ: 2000 მეტრზე
    აგვისტოს შუადღე ერთ საათში შეიძლება ცივ და წვიმიან ამინდად იქცეს, თავად უღელტეხილზე კი არაფერია. მწყემსის
    ძაღლები აგრესიულები არიან — მანქანიდან მანამდე ნუ გადმოხვალთ, სანამ პატრონი არ მოუხმობს. დიდ მონაკვეთებზე
    მობილური კავშირი არ არის.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ ზესტაფონამდე იარეთ, შემდეგ შ54-ით ბაღდათამდე, იქიდან
    კი შ14-ით სამხრეთისკენ საირმის განშტოებამდე — დაახლოებით 235 კილომეტრი, ბოლომდე ასფალტი. შემდეგ შ14
    უღელტეხილამდე დაახლოებით 25-კილომეტრიან მკვრივ გრუნტად და ქვიან გზად იქცევა, რასაც საათნახევრიდან
    ორ საათამდე უნდება. სულ დაახლოებით 260 კილომეტრია; სულ მცირე ხუთნახევარი საათი გაითვალისწინეთ. აბასთუმანი
    სამხრეთ კალთაზე კიდევ 15-იოდე კილომეტრის ქვემოთაა. გზა მხოლოდ ზაფხულში იხსნება და მხოლოდ ოფროუდ-კატეგორიის
    მანქანისთვის. საწვავი ბაღდათში ჩაასხით: მის იქით გასამართი აღარ არის.
en:
  name: Zekari Pass
  short: >-
    A 2,182 m summer-only pass over the Meskheti Range, where a rough jeep track climbs out of Colchic
    forest into flowering meadows above Abastumani.
  body: >-
    **On Zekari, a single morning's drive lifts you out of the Colchic forest and sets you down on the
    roof of the Meskheti Range.** The pass, at 2,182 metres on the border of Imereti and Samtskhe-Javakheti,
    carried a caravan road between the two regions for centuries. In August 1893 the British traveller
    H. F. B. Lynch, later a Member of Parliament, crossed it and wrote that he doubted “whether there
    exists in the nearer Asia a standpoint which commands a prospect at once so grand and so instructive.”


    The road that remains is the unpaved Sh14, roughly 40 km of rock, ruts and, after rain, mud between
    the Sairme turn-off on the Imereti side and Abastumani on the other. From the north it starts in dense,
    dripping forest, then breaks out onto open grassland where shepherds pitch their summer camps and
    their dogs come out to inspect every passing car. In July and August both flanks of the pass are in
    flower, and on a clear day the view opens across a sea of ridges.


    Over the top, the track drops through the edge of Borjomi-Kharagauli National Park into the pine-scented
    valley of Abastumani. There, on Mount Kanobili at 1,650–1,700 metres, the astronomer Evgeni Kharadze
    founded the Abastumani Astrophysical Observatory in 1932 — a fitting neighbour for a road where the
    sky suddenly takes up most of the view.


    Snow shuts Zekari from October until June, so the season is short and the weather sets the rules.
    Choose a dry week, start early and let the car climb in low gear: this pass rewards patience far more
    than horsepower.
  tip: >-
    A genuine 4x4 and a confident driver only — after rain the track stops soft-roaders and even tests
    proper off-roaders. Before setting out, ask in Sairme or Baghdati whether vehicles have been getting
    through that week, and if you can, travel with a second car. Carry a full tank, water, food and warm
    layers: at 2,000 metres an August afternoon can turn cold and wet within an hour, and there is nothing
    on the pass itself. Shepherd dogs are assertive; stay in the car until the shepherd calls them off.
    Expect no mobile signal for long stretches.
  route: >-
    From Tbilisi follow the S1 (E60) west to Zestafoni, then the Sh54 to Baghdati and the Sh14 south towards
    the Sairme turn-off — roughly 235 km, asphalt all the way. Beyond it the Sh14 becomes about 25 km
    of hard dirt and rock to the pass, a good hour and a half to two hours of driving. In all, around
    260 km; allow at least five and a half hours. Abastumani lies roughly 15 km further down the southern
    side. The road is open only in summer and only for off-road-category vehicles. Fill up in Baghdati:
    there is no fuel beyond it.
ru:
  name: Перевал Зекари
  short: >-
    Летний перевал высотой 2182 м через Месхетский хребет, где грунтовая колея для внедорожников поднимается
    из колхидского леса в цветущие луга над Абастумани.
  body: >-
    **На Зекари одно-единственное утро за рулём поднимает вас из колхидского леса и опускает на крышу
    Месхетского хребта.** Перевал высотой 2182 метра на границе Имерети и Самцхе-Джавахети веками служил
    караванной дорогой между двумя регионами. В августе 1893 года британский путешественник Х. Ф. Б. Линч,
    впоследствии член парламента, пересёк его и написал, что сомневается, «есть ли в ближней Азии точка
    обзора, которая открывала бы столь же величественную и столь же поучительную панораму».


    Дорога, что осталась, — это грунтовая Ш14, около 40 км камней, колдобин и, после дождя, грязи между
    поворотом на Саирме с имеретинской стороны и Абастумани с другой. С севера она начинается в густом,
    сыром от влаги лесу, затем выходит на открытые луга, где пастухи ставят летние стоянки, а их собаки
    выходят проверить каждую проезжающую машину. В июле и августе оба склона перевала в цвету, и в ясный
    день вид открывается на целое море хребтов.


    За перегибом дорога спускается через край Боржоми-Харагаульского национального парка в благоухающую
    соснами долину Абастумани. Там, на горе Канобили, на высоте 1650–1700 метров, астроном Евгений Харадзе
    основал в 1932 году Абастуманскую астрофизическую обсерваторию — подходящий сосед для дороги, где
    небо вдруг занимает большую часть обзора.


    Снег закрывает Зекари с октября по июнь, так что сезон короток, и погода здесь диктует правила. Выбирайте
    сухую неделю, выезжайте пораньше и дайте машине подниматься на пониженной передаче: этот перевал ценит
    терпение куда больше, чем лошадиные силы.
  tip: >-
    Только настоящий внедорожник и уверенный водитель — после дождя дорога останавливает даже кроссоверы
    и порой испытывает на прочность полноценные джипы. Перед выездом спросите в Саирме или Багдати, проходили
    ли машины на этой неделе, и по возможности езжайте в паре с другой машиной. Возьмите полный бак, воду,
    еду и тёплые вещи: на высоте 2000 метров августовский день может за час стать холодным и мокрым, а
    на самом перевале ничего нет. Пастушьи собаки настойчивы; оставайтесь в машине, пока пастух не отозвёт
    их. Мобильной связи на долгих участках ожидать не стоит.
  route: >-
    Из Тбилиси следуйте по трассе S1 (E60) на запад до Зестафони, затем по Ш54 до Багдати и по Ш14 на
    юг к повороту на Саирме — около 235 км, всё асфальтировано. Дальше, на протяжении примерно 25 км до
    перевала, Ш14 — это твёрдая грунтовка и камень: полтора-два часа пути. В общей сложности около 260
    км; закладывайте не менее пяти с половиной часов. Абастумани лежит примерно в 15 км дальше по южному
    склону. Дорога открыта только летом и только для автомобилей внедорожного класса. Заправляйтесь в
    Багдати: дальше топлива нет.
fa:
  name: گذرگاه زکاری
  short: >-
    گذرگاهی تابستانی به ارتفاع ۲٬۱۸۲ متر بر رشته‌کوه مسختی؛ جاده‌ای ناهموار برای جیپ از جنگل کولخیسی تا
    چمنزارهای پرگل بالای آباستومانی.
  body: >-
    **در زکاری، یک صبح رانندگی کافی است تا از جنگل کولخیسی بیرون بیایید و بر بام رشته‌کوه مسختی فرود آیید.**
    این گذرگاه، در ارتفاع ۲٬۱۸۲ متری، بر مرز ایمرتی و سامتسخه-جاواختی، سده‌ها راه کاروانی میان این دو
    منطقه بوده است. در اوت ۱۸۹۳، جهانگرد بریتانیایی اچ. اف. بی. لینچ، که بعدها نماینده‌ی پارلمان شد، از
    آن گذشت و نوشت که شک دارد «آیا در آسیای نزدیک نقطه‌ی دیدی وجود دارد که چشم‌اندازی این‌چنین شکوهمند
    و در همان حال این‌چنین آموزنده را در برابر دیده بگذارد».


    راهی که باقی مانده، همان Sh14 خاکی است، نزدیک به ۴۰ کیلومتر سنگ و چاله‌چوله، و پس از باران، گِل، میان
    انشعاب سایرمه در سوی ایمرتی و آباستومانی در سوی دیگر. از شمال، در جنگلی انبوه و نم‌دار آغاز می‌شود،
    سپس به چمنزارهای باز می‌رسد، جایی که چوپانان اردوگاه‌های تابستانی خود را برپا می‌کنند و سگ‌هایشان
    بیرون می‌آیند تا هر خودروی گذری را بازرسی کنند. در ژوئیه و اوت هر دو دامنه‌ی گذرگاه پرگل‌اند، و در
    روزی صاف، چشم‌انداز دریایی از رشته‌کوه‌ها می‌گشاید.


    پس از قله، مسیر از کنار پارک ملی بورجومی-خاراگائولی به دره‌ی خوش‌بوی کاجِ آباستومانی سرازیر می‌شود.
    آنجا، بر کوه کانوبیلی، در ارتفاع ۱٬۶۵۰ تا ۱٬۷۰۰ متر، ستاره‌شناس اوگنی خارادزه در سال ۱۹۳۲ رصدخانه‌ی
    اخترفیزیک آباستومانی را بنیاد گذاشت — همسایه‌ای شایسته برای راهی که در آن آسمان ناگهان بیشتر میدان
    دید را از آن خود می‌کند.


    برف زکاری را از اکتبر تا ژوئن می‌بندد، پس فصل کوتاه است و قانون را آب‌وهوا تعیین می‌کند. هفته‌ای خشک
    برگزینید، زود راه بیفتید و بگذارید خودرو با دنده‌ی سنگین بالا برود: این گذرگاه به صبر بسیار بیش از
    قدرت موتور پاداش می‌دهد.
  tip: >-
    تنها یک ۴×۴ راستین و راننده‌ای مطمئن — پس از باران، این راه حتی خودروهای کراس‌آور را متوقف می‌کند
    و گاه خودروهای آفرودی واقعی را نیز به آزمون می‌گذارد. پیش از حرکت، در سایرمه یا باغداتی بپرسید که
    آیا خودروها در آن هفته توانسته‌اند بگذرند، و اگر ممکن است، با خودرویی دوم همراه سفر کنید. باک پُر،
    آب، غذا و لباس گرم همراه داشته باشید: در ارتفاع ۲٬۰۰۰ متری، بعدازظهر اوت می‌تواند در کمتر از یک ساعت
    سرد و نم‌دار شود، و در خودِ گذرگاه هیچ چیز یافت نمی‌شود. سگ‌های چوپان جسورند؛ تا زمانی که چوپان آن‌ها
    را باز نخوانده، در خودرو بمانید. در بخش‌های طولانی از مسیر انتظار آنتن تلفن همراه را نداشته باشید.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب تا زستافونی بگیرید، سپس Sh54 تا باغداتی و Sh14 به سوی جنوب تا
    انشعاب سایرمه — نزدیک به ۲۳۵ کیلومتر، همه آسفالت. پس از آن، Sh14 به نزدیک ۲۵ کیلومتر خاک و سنگ سخت
    تا گذرگاه بدل می‌شود، نزدیک به یک ساعت و نیم تا دو ساعت رانندگی. در مجموع، نزدیک به ۲۶۰ کیلومتر؛ دست‌کم
    پنج ساعت و نیم در نظر بگیرید. آباستومانی نزدیک به ۱۵ کیلومتر پایین‌تر در سوی جنوبی قرار دارد. این
    راه تنها در تابستان و تنها برای خودروهای رده‌ی آفرود باز است. در باغداتی سوخت‌گیری کنید: پس از آن
    سوختی نیست.
he:
  name: מעבר זקארי
  short: >-
    מעבר בגובה 2,182 מטר, פתוח רק בקיץ, על רכס מסחתי, שבו מסלול שטח משובש מטפס מיער קולכי אל אחו פורח
    מעל אבסטומני.
  body: >-
    **בזקארי, נסיעה של בוקר אחד בלבד מעלה אתכם מיער קולכי ומניחה אתכם על גג רכס מסחתי.** המעבר, בגובה
    2,182 מטר, על הגבול שבין אימרתי לסמצחה-ג'אווחתי, שימש מאות שנים כדרך שיירות בין שני האזורים. באוגוסט
    1893 חצה אותו הנוסע הבריטי ה.פ.ב. לינץ', שנעשה בהמשך חבר פרלמנט, וכתב שהוא מטיל ספק "אם קיימת באסיה
    הקרובה נקודת תצפית שמעניקה מבט מפואר ומאלף בבת אחת כמו זה".


    הדרך שנותרה היא כביש העפר Sh14, כ-40 ק"מ של סלעים, תלמי גלגלים ובוץ אחרי גשם, בין הפניה לסאירמה בצד
    אימרתי לאבסטומני בצד השני. מצפון היא נפתחת ביער סבוך וספוג לחות, ואז פורצת לכרי מרעה פתוחים, שבהם
    רועים פורשים את מחנות הקיץ שלהם וכלביהם יוצאים לבדוק כל רכב חולף. ביולי ובאוגוסט שני מדרוני המעבר
    פורחים, וביום צלול הנוף נפתח על ים של רכסים.


    אחרי הפסגה, הדרך יורדת בשולי הפארק הלאומי בורז'ומי-חרגאולי לתוך העמק המבושם באורנים של אבסטומני. שם,
    על הר קנובילי, בגובה 1,650–1,700 מטר, הקים האסטרונום יבגני חרדזה ב-1932 את מצפה הכוכבים האסטרופיזיקלי
    של אבסטומני — שכן מתאים לדרך שבה השמיים תופסים לפתע את רוב שדה הראייה.


    השלג סוגר את זקארי מאוקטובר עד יוני, כך שהעונה קצרה ומזג האוויר קובע את החוקים. בחרו שבוע יבש, צאו
    מוקדם ותנו לרכב לטפס בהילוך נמוך: המעבר הזה מעניק גמול לסבלנות הרבה יותר מלכוח מנוע.
  tip: >-
    רק רכב 4x4 אמיתי ונהג בטוח בעצמו — לאחר גשם הדרך עוצרת אפילו קרוסאוברים, ואף מציבה מבחן לרכבי שטח
    ממש. לפני היציאה, שאלו בסאירמה או בבאגדאתי אם רכבים הצליחו לעבור באותו שבוע, ואם אפשר, צאו עם רכב
    שני. צאו עם מיכל דלק מלא והביאו מים, מזון ובגדים חמים: בגובה 2,000 מטר, אחר צהריים באוגוסט יכול להפוך
    קר וגשום בתוך שעה, ואין שום דבר על המעבר עצמו. כלבי הרועים תוקפניים; הישארו ברכב עד שהרועה יקרא להם.
    אין לצפות לקליטה סלולרית לאורך מקטעים ארוכים.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד זסטפוני, ואז Sh54 עד באגדאתי ו-Sh14 דרומה לכיוון הפניה לסאירמה
    — כ-235 ק"מ, אספלט לכל הדרך. משם, Sh14 הופך לכ-25 ק"מ של אדמה קשה וסלעים עד המעבר, כשעה וחצי עד שעתיים
    נסיעה. בסך הכול, כ-260 ק"מ; הקדישו לפחות חמש שעות וחצי. אבסטומני נמצאת כ-15 ק"מ נוספים במורד הצד הדרומי.
    הדרך פתוחה רק בקיץ ורק לרכבי שטח. תדלקו בבאגדאתי: אחריה אין דלק.
ar:
  name: ممر زكاري
  short: >-
    ممر لا يُفتح إلا في الصيف على ارتفاع 2,182 مترًا عبر جبال مسختي، حيث يصعد مسار وعر للسيارات الرباعية
    من غابة كولخيدية إلى مروج مزهرة فوق أباستوماني.
  body: >-
    **في زكاري، تكفي رحلة صباح واحد لترفعك من غابة كولخيدية وتُنزلك على سطح جبال مسختي.** الممر، على ارتفاع
    2,182 مترًا، على الحدود بين إيميريتي وسامتسخه-جافاخيتي، مرّ عبره لقرون طريق للقوافل بين المنطقتين.
    في أغسطس 1893، عبره الرحّالة البريطاني إتش. إف. بي. لينش، الذي أصبح لاحقًا عضوًا في البرلمان، وكتب
    أنه يشكّ «في وجود نقطة رصد في آسيا القريبة تقدّم مشهدًا مهيبًا ومُعلِّمًا في آنٍ معًا كهذا».


    الطريق المتبقي هو طريق Sh14 غير المُعبّد، نحو 40 كم من الصخور والأخاديد، والطين بعد المطر، بين مفرق
    سايرمه في جهة إيميريتي وأباستوماني في الجهة الأخرى. من الشمال يبدأ في غابة كثيفة ورطبة، ثم يخرج إلى
    مروج مفتوحة يقيم فيها الرعاة مخيمات صيفهم وتخرج كلابهم لتفحّص كل سيارة عابرة. في يوليو وأغسطس يزهر
    جانبا الممر كلاهما، وفي يوم صافٍ ينفتح المشهد على بحر من السلاسل الجبلية.


    بعد القمة، ينزل المسار عبر حافة حديقة بورجومي-خاراغاولي الوطنية إلى وادي أباستوماني المعطّر بالصنوبر.
    هناك، على جبل كانوبيلي بين 1,650 و1,700 متر، أسّس الفلكي يفغيني خارادزه عام 1932 مرصد أباستوماني للفيزياء
    الفلكية — جار مناسب لطريق تستأثر فيه السماء فجأة بمعظم المشهد.


    يُغلق الثلج زكاري من أكتوبر حتى يونيو، فالموسم قصير والطقس هو من يضع القواعد. اختر أسبوعًا جافًا،
    وانطلق باكرًا، واترك السيارة تصعد على ناقل حركة منخفض (السرعة الأولى): هذا الممر يجازي الصبر أكثر
    بكثير من قوة المحرك.
  tip: >-
    سيارة دفع رباعي حقيقية وسائق واثق فقط — بعد المطر يوقف الطريق حتى سيارات الكروس أوفر، بل يمتحن سيارات
    الدفع الرباعي الحقيقية أيضًا. قبل الانطلاق، اسأل في سايرمه أو باغداتي إن كانت السيارات قد تمكنت من
    العبور ذلك الأسبوع، وإن أمكن، سافر مع سيارة ثانية. احمل خزانًا ممتلئًا، وماءً وطعامًا وملابس دافئة:
    على ارتفاع 2,000 متر، يمكن أن يتحوّل طقس بعد ظهر أغسطس إلى بارد ماطر في غضون ساعة، ولا يوجد شيء على
    الممر نفسه. كلاب الرعاة عدائية؛ ابقَ في السيارة حتى يستدعيها الراعي. لا تتوقع تغطية للهاتف المحمول
    على امتدادات طويلة.
  route: >-
    من تبليسي، اتبع الطريق S1 (E60) غربًا حتى زيستافوني، ثم طريق Sh54 إلى باغداتي، ثم طريق Sh14 جنوبًا
    نحو مفرق سايرمه — نحو 235 كم، معبّد بالكامل. بعد ذلك يتحول Sh14 إلى نحو 25 كم من التراب الصلب والصخور
    حتى الممر، أي نحو ساعة ونصف إلى ساعتين من القيادة. المسافة الإجمالية نحو 260 كم؛ خصص خمس ساعات ونصف
    على الأقل. تقع أباستوماني على نحو 15 كم أبعد على السفح الجنوبي. الطريق مفتوح فقط في الصيف وفقط لسيارات
    فئة الدفع الرباعي. تزوّد بالوقود في باغداتي: فلا وقود بعده.
