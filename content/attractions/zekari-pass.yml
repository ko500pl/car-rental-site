ka:
  name: ზეკარის უღელტეხილი
  short: >-
    2182-მეტრიანი უღელტეხილი მესხეთის ქედზე — ძველი საქარავნო გზა, რომელიც საირმეს კურორტს აბასთუმანს
    ჯიპ-ტრეკით აბამს.
  body: >-
    **ზეკარი ის გზაა, სადაც კოლხური ტყე ალპურ მდელოებში ერთ დღეში გადადის.** მესხეთის ქედის ამ უღელტეხილს
    (2182 მ) იმერეთი და სამცხე-ჯავახეთი ერთმანეთს საუკუნეების განმავლობაში ჰქონდათ გადაბმული — ქუთაისსა
    და ახალციხეს შორის საქარავნო გზა სწორედ აქ გადიოდა. 1893 წელს ბრიტანელი პარლამენტარი და მოგზაური ჰენრი
    ლინჩი აქაურ ხედს ისე აღწერდა, როგორც "ერთდროულად დიდებულსა და დამრიგებელს".


    დღეს ეს დაახლოებით 39-კილომეტრიანი მოუსფალტებელი მონაკვეთია (SH14) საირმესა და აბასთუმანს შორის —
    ერთ-ერთი ყველაზე ცნობილი ოფროუდ-მარშრუტი დასავლეთ საქართველოში. საირმის მხრიდან გზა ჯერ უღრან ტყეში
    მიიკლაკნება, შემდეგ მწყემსების საზაფხულო ბანაკებით მოფენილ მდელოებზე ადის; გადაღმა კი ბორჯომ-ხარაგაულის
    ეროვნული პარკის განაპირა ფერდობებით აბასთუმანში ეშვება — იქ, სადაც 1932 წელს სსრკ-ის პირველი მაღალმთიანი
    ობსერვატორია გაიხსნა.


    გზა მძიმეა: ქვები, ღრმა კვალი, წვიმის შემდეგ — ტალახი. სამაგიეროდ, ივლის-აგვისტოში უღელტეხილის ორივე
    მხარე ყვავილობს და ხედი კავკასიონიდან მესხეთის მთებამდე იშლება. თოვლი გზას წელიწადის დიდ ნაწილს კეტავს
    — რეალური ფანჯარა ივნისის ბოლოდან სექტემბრამდეა.
  tip: >-
    მხოლოდ ნამდვილი 4x4 და გამოცდილი მძღოლი — წვიმის შემდეგ გზა ეკონომ-ჯიპებსაც კი აჩერებს. გამგზავრებამდე
    საირმეში ან ბაღდათში ჰკითხე, გადის თუ არა ამ კვირას მანქანები. სავსე ავზი, საგზალი და თბილი ტანსაცმელი
    წამოიღე — უღელტეხილზე არაფერია. მწყემსების ძაღლები აქტიურები არიან, მანქანიდან ფრთხილად გადმოდი. მობილური
    კავშირი დიდ მონაკვეთზე არ არის.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ბაღდათისა და საირმის გზით — საირმემდე დაახლოებით 280 კმ, ასფალტი
    ბოლომდე. საირმედან უღელტეხილამდე ~25 კმ მკაცრი გრუნტი და ქვაა, რომელსაც 1.5-2 საათი უნდა; ჯამში დაახლოებით
    305 კმ და 5:30. აბასთუმანში ჩასვლა კიდევ ~15 კმ-ია. მარშრუტი მხოლოდ ზაფხულობით გადის და მხოლოდ ოფროუდ-კატეგორიის
    მანქანით. საწვავი ბაღდათში ჩაასხი — საირმის შემდეგ გასამართი აღარ არის.
en:
  name: Zekari Pass
  short: >-
    A 2,182 m pass over the Meskheti Range — an old caravan road linking Sairme resort with Abastumani
    by one glorious jeep track.
  body: >-
    **Zekari is the road where Colchic forest turns into alpine meadow in a single day.** This pass over
    the Meskheti Range (2,182 m) tied Imereti and Samtskhe-Javakheti together for centuries — the caravan
    road between Kutaisi and Akhaltsikhe ran right here. In 1893 the British parliamentarian and traveller
    H. F. B. Lynch described the view as "a prospect at once so grand and so instructive".


    Today it is a roughly 39 km unpaved stretch (SH14) between Sairme and Abastumani — one of the best-known
    off-road routes in western Georgia. From the Sairme side the track winds through deep forest, then
    climbs onto meadows dotted with shepherds' summer camps; over the top it drops along the fringes of
    Borjomi-Kharagauli National Park into Abastumani, where the USSR's first high-mountain observatory
    opened in 1932.


    The driving is rough: rocks, deep ruts, and mud after rain. In exchange, both flanks of the pass are
    in full flower in July and August, and the view runs from the Greater Caucasus to the Meskheti summits.
    Snow blocks the road for most of the year — the realistic window is late June to September.
  tip: >-
    A genuine 4x4 and a confident driver only — after rain the track stops even soft-roaders. Before setting
    out, ask in Sairme or Baghdati whether vehicles have been getting through that week. Carry a full
    tank, food and warm layers; there is nothing on the pass itself. Shepherd dogs are assertive, so step
    out of the car carefully. Expect no mobile signal for long stretches.
  route: >-
    From Tbilisi take the E60 to Zestafoni, then the Baghdati–Sairme road — about 280 km to Sairme, asphalt
    all the way. From Sairme it is ~25 km of hard dirt and rock to the pass, worth 1.5–2 hours; around
    305 km and 5:30 in total, with another ~15 km down to Abastumani. The route runs in summer only and
    only with an offroad-category vehicle. Fill up in Baghdati — there is no fuel after Sairme.
ru:
  name: Перевал Зекари
  short: >-
    Перевал высотой 2182 м через Месхетский хребет — старая караванная дорога, связывающая курорт Саирме
    с Абастумани отличным джип-треком.
  body: >-
    **Зекари — дорога, на которой колхидский лес за один день сменяется альпийскими лугами.** Этот перевал
    через Месхетский хребет (2182 м) веками связывал Имерети и Самцхе-Джавахети: караванный путь между
    Кутаиси и Ахалцихе проходил именно здесь. В 1893 году британский парламентарий и путешественник Генри
    Линч описал здешний вид как «зрелище столь же величественное, сколь и поучительное».


    Сегодня это примерно 39 км грунтовки (SH14) между Саирме и Абастумани — один из самых известных офроуд-маршрутов
    Западной Грузии. Со стороны Саирме дорога петляет по густому лесу, затем выбирается на луга с летними
    лагерями пастухов, а за перевалом спускается по окраинам национального парка Боржоми-Харагаули в Абастумани
    — туда, где в 1932 году открылась первая высокогорная обсерватория СССР.


    Ехать тяжело: камни, глубокая колея, после дождя — грязь. Зато в июле-августе оба склона перевала
    цветут, а вид тянется от Большого Кавказа до месхетских вершин. Снег запирает дорогу большую часть
    года — реальное окно с конца июня по сентябрь.
  tip: >-
    Только настоящий 4x4 и уверенный водитель — после дождя дорога останавливает даже кроссоверы. Перед
    выездом спросите в Саирме или Багдати, проходят ли машины на этой неделе. Полный бак, еда и тёплая
    одежда обязательны: на самом перевале нет ничего. Пастушьи собаки настроены серьёзно — выходите из
    машины осторожно. На длинных участках связи нет.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем по дороге Багдати–Саирме — до Саирме около 280 км, асфальт до
    конца. От Саирме до перевала ~25 км жёсткого грунта и камня, на которые нужно 1,5–2 часа; всего около
    305 км и 5:30. До Абастумани дальше ещё ~15 км спуска. Маршрут проходим только летом и только на машине
    офроуд-категории. Заправьтесь в Багдати — после Саирме заправок нет.
fa:
  name: گردنهٔ زکاری
  short: >-
    گردنه‌ای در ارتفاع ۲۱۸۲ متر بر رشته‌کوه مسختی — راه کاروان‌روی کهن که تفرجگاه سائیرمه را با آباستومانی
    با یک جیپ‌راه باشکوه پیوند می‌دهد.
  body: >-
    **زکاری جاده‌ای است که در آن جنگل کلخیسی در یک روز به مرغزار آلپی بدل می‌شود.** این گردنهٔ رشته‌کوه
    مسختی (۲۱۸۲ متر) قرن‌ها ایمرتی و سامتسخه-جاواختی را به هم می‌بست — راه کاروان‌رو میان کوتائیسی و آخالتسیخه
    درست از همین‌جا می‌گذشت. در سال ۱۸۹۳ هنری لینچ، نمایندهٔ پارلمان بریتانیا و جهانگرد، چشم‌انداز اینجا
    را «منظره‌ای هم‌زمان باشکوه و آموزنده» توصیف کرد.


    امروز این مسیر قطعه‌ای خاکی به طول تقریبی ۳۹ کیلومتر (SH14) میان سائیرمه و آباستومانی است — یکی از
    شناخته‌شده‌ترین مسیرهای آفرود غرب گرجستان. از سمت سائیرمه جاده اول در جنگل انبوه پیچ می‌خورد، سپس
    به مرغزارهایی پر از اتراق‌گاه تابستانی چوپان‌ها بالا می‌رود؛ و آن‌سوی گردنه، از حاشیهٔ پارک ملی بورجومی-خاراگائولی
    به آباستومانی سرازیر می‌شود — جایی که در ۱۹۳۲ نخستین رصدخانهٔ کوهستانی اتحاد شوروی گشوده شد.


    رانندگی سخت است: سنگ، شیارهای عمیق و پس از باران گل. در عوض، در ژوئیه و اوت هر دو دامنهٔ گردنه غرق
    گُل است و دید از قفقاز بزرگ تا قله‌های مسختی می‌رسد. برف بیشتر سال راه را می‌بندد — پنجرهٔ واقعی از
    اواخر ژوئن تا سپتامبر است.
  tip: >-
    فقط شاسی‌بلند چهارچرخ‌محرک واقعی و راننده‌ای مطمئن — پس از باران جاده حتی کراس‌اوورها را هم متوقف
    می‌کند. پیش از حرکت در سائیرمه یا باغداتی بپرسید آیا این هفته خودروها عبور کرده‌اند. باک پر، خوراکی
    و لباس گرم همراه داشته باشید؛ روی خود گردنه هیچ‌چیز نیست. سگ‌های گله جدی‌اند؛ با احتیاط از خودرو پیاده
    شوید. در قطعه‌های طولانی آنتن موبایل نیست.
  route: >-
    از تفلیس با E60 تا زستافونی، سپس با جادهٔ باغداتی–سائیرمه — تا سائیرمه حدود ۲۸۰ کیلومتر، تماماً آسفالت.
    از سائیرمه تا گردنه حدود ۲۵ کیلومتر خاکی و سنگلاخ سخت است که ۱/۵ تا ۲ ساعت می‌برد؛ روی‌هم حدود ۳۰۵
    کیلومتر و پنج ساعت و نیم. تا آباستومانی هم حدود ۱۵ کیلومتر سرازیری دیگر است. مسیر فقط تابستان‌ها بازاست
    و فقط با خودروی ردهٔ آفرود. در باغداتی بنزین بزنید — پس از سائیرمه جایگاهی نیست.
he:
  name: מעבר זקארי
  short: >-
    מעבר בגובה 2,182 מ' מעל רכס מסחתי — דרך שיירות עתיקה שמחברת את אתר הנופש סאירמה עם אבסטומני במסלול
    ג'יפים מפואר.
  body: >-
    **זקארי היא הדרך שבה יער קולכי הופך לאחו אלפיני ביום אחד.** המעבר הזה מעל רכס מסחתי (2,182 מ') חיבר
    במשך מאות שנים את אימרתי עם סמצחה-ג'וואחתי — דרך השיירות בין קוטאיסי לאחלציחה עברה בדיוק כאן. ב-1893
    תיאר חבר הפרלמנט הבריטי והנוסע הנרי לינץ' את הנוף כ"מראה מפואר ומאלף בעת ובעונה אחת".


    היום זהו קטע לא סלול של כ-39 ק"מ (SH14) בין סאירמה לאבסטומני — אחד ממסלולי השטח המוכרים ביותר במערב
    גאורגיה. מצד סאירמה הדרך מתפתלת ביער סבוך, מטפסת אל כרי דשא זרועים מחנות קיץ של רועים, ומעבר לפסגה
    יורדת בשולי הפארק הלאומי בורג'ומי-חראגאולי אל אבסטומני — שם נפתח ב-1932 מצפה הכוכבים ההררי הראשון
    של ברית המועצות.


    הנהיגה קשוחה: סלעים, תלמים עמוקים, ובוץ אחרי גשם. בתמורה, ביולי-אוגוסט שני צדי המעבר פורחים במלואם,
    והמבט נמתח מהקווקז הגדול ועד פסגות מסחתי. השלג נועל את הדרך ברוב חודשי השנה — החלון המציאותי הוא מסוף
    יוני עד ספטמבר.
  tip: >-
    רק 4x4 אמיתי ונהג בטוח בעצמו — אחרי גשם הדרך עוצרת אפילו רכבי פנאי. לפני היציאה שאלו בסאירמה או בבאגדתי
    אם רכבים עברו השבוע. קחו מכל מלא, אוכל ושכבות חמות; על המעבר עצמו אין דבר. כלבי הרועים תקיפים — צאו
    מהרכב בזהירות. בקטעים ארוכים אין קליטה סלולרית.
  route: >-
    מטביליסי ב-E60 עד זסטאפוני, ואז בדרך באגדתי–סאירמה — כ-280 ק"מ עד סאירמה, אספלט לכל האורך. מסאירמה
    אל המעבר כ-25 ק"מ של עפר וסלע קשים, שדורשים שעה וחצי עד שעתיים; בסך הכול כ-305 ק"מ ו-5:30 שעות. הירידה
    לאבסטומני היא עוד כ-15 ק"מ. המסלול עביר בקיץ בלבד ורק ברכב מקטגוריית שטח. תדלקו בבאגדתי — אחרי סאירמה
    אין דלק.
ar:
  name: ممر زيكاري
  short: ممر على ارتفاع 2182 متراً فوق سلسلة مسخيتي — طريق قوافل قديم يربط منتجع سايرمه بأباستوماني عبر
    مسار جيب مهيب.
  body: >-
    **زيكاري هو الطريق الذي تتحول فيه غابة كولخيس إلى مروج ألبية في يوم واحد.** ربط هذا الممر فوق سلسلة
    مسخيتي (2182 متراً) إيميريتي بسامتسخه-جواخيتي قروناً طويلة — فطريق القوافل بين كوتايسي وأخالتسيخه
    كان يمر من هنا بالضبط. وفي عام 1893 وصف البرلماني والرحالة البريطاني هنري لينش المشهد بأنه «منظر جليل
    ومفيد في آن واحد».


    اليوم هو مقطع غير معبّد طوله نحو 39 كيلومتراً (SH14) بين سايرمه وأباستوماني — من أشهر مسارات الطرق
    الوعرة في غرب جورجيا. من جهة سايرمه يتلوى المسار في غابة كثيفة، ثم يصعد إلى مروج تنتشر فيها مخيمات
    الرعاة الصيفية؛ وبعد القمة يهبط على أطراف حديقة بورجومي-خاراغاولي الوطنية إلى أباستوماني — حيث افتُتح
    عام 1932 أول مرصد جبلي في الاتحاد السوفييتي.


    القيادة قاسية: صخور وأخاديد عميقة، ووحل بعد المطر. وفي المقابل، يزهر جانبا الممر كلاهما في يوليو وأغسطس،
    ويمتد البصر من القوقاز الكبير إلى قمم مسخيتي. يغلق الثلج الطريق معظم السنة — والنافذة الواقعية من
    أواخر يونيو إلى سبتمبر.
  tip: >-
    سيارة دفع رباعي حقيقية وسائق واثق فقط — بعد المطر يوقف الطريق حتى سيارات الكروس أوفر. قبل الانطلاق
    اسأل في سايرمه أو باغداتي إن كانت السيارات تعبر هذا الأسبوع. خذ خزاناً ممتلئاً وطعاماً وملابس دافئة؛
    فلا شيء على الممر نفسه. كلاب الرعاة شرسة، فانزل من السيارة بحذر. ولا إشارة هاتف على مسافات طويلة.
  route: >-
    من تبليسي عبر E60 حتى زيستافوني، ثم بطريق باغداتي–سايرمه — نحو 280 كم حتى سايرمه، أسفلت حتى النهاية.
    من سايرمه إلى الممر نحو 25 كم من التراب والصخر القاسيين تستغرق ساعة ونصفاً إلى ساعتين؛ أي نحو 305
    كم و5 ساعات ونصف إجمالاً، ثم نحو 15 كم نزولاً إلى أباستوماني. الطريق سالك صيفاً فقط وبسيارة من فئة
    الطرق الوعرة حصراً. تزوّد بالوقود في باغداتي — فلا وقود بعد سايرمه.
