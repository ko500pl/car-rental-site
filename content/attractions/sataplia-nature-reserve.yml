ka:
  name: სათაფლიის ნაკრძალი
  short: დინოზავრების ნაფეხურები, კარსტული მღვიმე და შუშის ხედვის მოედანი ქუთაისთან.
  body: >
    სათაფლია ქუთაისიდან სულ ცხრა კილომეტრშია და საქართველოს უძველესი დაცული ტერიტორიაა — ნაკრძალის სტატუსი
    მან ჯერ კიდევ 1935 წელს მიიღო. სახელი „თაფლის ადგილს“ ნიშნავს: კლდის ნაპრალებში ველური ფუტკრის ბუდეები
    იყო და ადგილობრივები იქიდან თაფლს იღებდნენ.


    ნაკრძალის მთავარი აღმოჩენა 1933 წელს გააკეთა მკვლევარმა პეტრე ჭაბუკიანმა: მან კლდის ზედაპირზე **დინოზავრების
    ნაფეხურები** აღმოაჩინა. დღეს ორასამდე ანაბეჭდია დათვლილი და ისინი ცარცული პერიოდით, დაახლოებით ას
    ოცი მილიონი წლით თარიღდება. ანაბეჭდები ორივე ტიპისაა — ბალახისმჭამელი და მტაცებელი დინოზავრებისა —
    და დახურული პავილიონითაა დაცული.


    გარდა ამისა, ტერიტორიაზეა:


    - კარსტული მღვიმე სტალაქტიტებით, დაახლოებით სამასი მეტრი ღიაა დასათვალიერებლად

    - **შუშის იატაკიანი ხედვის მოედანი**, კლდიდან გამოშვერილი, საიდანაც ქუთაისი და კოლხური ტყე ჩანს

    - ჩამქრალი ვულკანის კრატერი და ტყის მოკლე ბილიკები

    - დინოზავრების ნატურალური ზომის მაკეტები, რაც ბავშვებს განსაკუთრებით მოსწონთ


    სათაფლია პრომეთეს მღვიმისგან სრულიად განსხვავებული მასშტაბისაა — უფრო მცირე და მოკრძალებული, სამაგიეროდ
    ბუნების, გეოლოგიისა და პალეონტოლოგიის ერთ ადგილზე შეყრით საინტერესო. ორივეს ერთ დღეში დათვალიერება
    მშვიდად ეტევა.


    ნაკრძალის ტერიტორია მცირეა და ბილიკები ერთმანეთთან დაკავშირებულია, ამიტომ მთელი მარშრუტი თანმიმდევრულად
    გადის: ჯერ ტყე და ვულკანის კრატერი, შემდეგ მღვიმე, ბოლოს კი ხედვის მოედანი. ეს თანმიმდევრობა გიდის
    გარეშეც ნათელია, რადგან ნიშნები კარგადაა დაყენებული.
  tip: >
    შუშის მოედანზე გასვლა სიმაღლის შიშის მქონე ადამიანებისთვის რთულია — იატაკი გამჭვირვალეა და ქვემოთ
    ხეობაა. ბილიკები ასფალტირებულია, მაგრამ აღმართიანი; საბავშვო ეტლით გავლა შესაძლებელია, თუმცა შრომატევადი.
    მღვიმეში ოციოდე გრადუსზე ცივაა, თხელი ჟაკეტი გამოგადგება. მოდი დილით: შუადღისას ჯგუფები ერთდროულად
    ჩამოდიან. კაფე, ტუალეტი და პარკინგი შესასვლელთანაა, ბანკომატი — ქუთაისში. ბილეთი შესასვლელთან იყიდება
    და ის ყველა ობიექტს მოიცავს — ცალკე გადახდა არსად გჭირდება.
  route: >
    თბილისიდან E60-ით ქუთაისამდე — ორას ოცდაათი კილომეტრი, სამი საათი ოცი წუთი. ქუთაისიდან ჩრდილო-დასავლეთით
    უხვევ და ცხრა კილომეტრში სათაფლიაშია; მიმართულების ნიშნები კარგადაა დაყენებული. მთელი გზა ასფალტიანია
    და ეკონომ კლასისთვისაც სრულიად კომფორტული. საწვავი და ბანკომატები ქუთაისში ბევრგანაა. პრომეთეს მღვიმე
    იმავე მხარეს, დაახლოებით თხუთმეტ კილომეტრშია, ამიტომ ერთი გასვლით ორივეს მოხვედრა ბუნებრივია. ქუთაისიდან
    სათაფლიამდე ქალაქის ავტობუსიც დადის, თუმცა მანქანით ორივე ობიექტის ერთ დღეში მოვლა ბევრად მოქნილია.
en:
  name: Sataplia Nature Reserve
  short: Dinosaur footprints, a karst cave and a glass viewing platform, nine kilometres from Kutaisi.
  body: >-
    Sataplia lies just nine kilometres from Kutaisi and is the oldest protected area in Georgia, granted
    reserve status back in 1935. The name means place of honey: wild bees nested in the cliff crevices
    and locals collected honey from them.


    The reserve's defining discovery was made in 1933 by the naturalist Petre Chabukiani, who found **dinosaur
    footprints** preserved in the rock surface. Around two hundred prints have now been counted, dating
    to the Cretaceous period roughly 120 million years ago. Both herbivore and predator tracks are present,
    and the site is now protected under a covered pavilion.


    Also on the territory:


    - a karst cave with stalactites, of which about three hundred metres are open to visitors

    - **a glass-floored viewing platform** cantilevered off the cliff, looking over Kutaisi and the Colchic
    forest

    - the crater of an extinct volcano and short forest trails

    - life-size dinosaur models, which children reliably enjoy more than the actual footprints


    Sataplia operates on a completely different scale from Prometheus Cave — smaller and more modest —
    but it is interesting precisely because geology, palaeontology and Colchic forest sit together in
    one compact site. Both fit comfortably into a single day.
  tip: >-
    The glass platform is difficult for anyone with a fear of heights: the floor is fully transparent
    with the gorge directly below. Paths are paved but climb steadily; a pushchair is possible, though
    hard work. The cave is cool, around twenty degrees below the outside temperature in summer, so bring
    a light jacket. Come in the morning, since groups arrive together around midday. Cafe, toilets and
    parking are at the entrance, with the nearest ATM in Kutaisi.
  route: >-
    Take the E60 from Tbilisi to Kutaisi — 230 km and about three hours twenty. From the city head northwest
    and cover the last nine kilometres to Sataplia; signposting is clear. The road is paved throughout
    and entirely comfortable for an economy car. Fuel and ATMs are plentiful in Kutaisi. Prometheus Cave
    lies in the same direction about fifteen kilometres further on, so combining both on one outing is
    the obvious plan.
ru:
  name: Заповедник Сатаплиа
  short: Следы динозавров, карстовая пещера и стеклянная смотровая площадка в девяти километрах от Кутаиси.
  body: >
    Сатаплиа находится всего в девяти километрах от Кутаиси и является старейшей охраняемой территорией
    Грузии: статус заповедника она получила ещё в 1935 году. Название означает «место мёда» — в трещинах
    скалы гнездились дикие пчёлы, и местные жители собирали оттуда мёд.


    Главное открытие сделал в 1933 году натуралист Петре Чабукиани: он обнаружил на поверхности скалы
    **следы динозавров**. Сегодня насчитано около двухсот отпечатков, датируемых меловым периодом, примерно
    120 миллионами лет. Здесь есть следы и травоядных, и хищных динозавров, а сам участок закрыт защитным
    павильоном.


    Кроме того, на территории:


    - карстовая пещера со сталактитами, около трёхсот метров открыто для осмотра

    - **смотровая площадка со стеклянным полом**, вынесенная над обрывом, с видом на Кутаиси и колхидский
    лес

    - кратер потухшего вулкана и короткие лесные тропы

    - макеты динозавров в натуральную величину, которые детям нравятся больше самих следов


    Сатаплиа совсем другого масштаба, чем пещера Прометея, — скромнее и компактнее, но интересна тем,
    что геология, палеонтология и колхидский лес собраны в одной точке. Обе достопримечательности спокойно
    укладываются в один день.


    Территория заповедника небольшая, и тропы связаны между собой, поэтому маршрут проходится последовательно:
    сначала лес и кратер вулкана, затем пещера, в конце смотровая площадка. Порядок понятен и без гида,
    указатели расставлены аккуратно.
  tip: >-
    Стеклянная площадка тяжело даётся тем, кто боится высоты: пол полностью прозрачный, под ним ущелье.
    Дорожки асфальтированы, но идут в подъём; с коляской пройти можно, хотя и трудоёмко. В пещере ощутимо
    холоднее, чем снаружи, лёгкая куртка пригодится. Приезжайте утром: к полудню группы прибывают одновременно.
    Кафе, туалеты и парковка — у входа, ближайший банкомат в Кутаиси.
  route: >-
    Из Тбилиси по E60 до Кутаиси — 230 км и около трёх часов двадцати минут. Из города поворот на северо-запад,
    последние девять километров до Сатаплиа; указатели расставлены хорошо. Дорога асфальтированная на
    всём протяжении и вполне комфортна для эконом-класса. Заправки и банкоматы в Кутаиси на каждом шагу.
    Пещера Прометея лежит в том же направлении, километров на пятнадцать дальше, поэтому объединить обе
    точки в одну поездку — очевидное решение.
fa:
  name: ذخیرهٔ طبیعی ساتاپلیا
  short: رد پای دایناسور، یک غار کارستی و سکوی دید شیشه‌ای، در نُه کیلومتری کوتایسی.
  body: >-
    ساتاپلیا تنها نُه کیلومتر با کوتایسی فاصله دارد و کهن‌ترین منطقهٔ حفاظت‌شدهٔ گرجستان است؛ همان اندازه
    قدیمی که در 1935 وضعیت ذخیرهٔ طبیعی گرفت. نام آن یعنی «جای عسل»: زنبورهای وحشی در شکاف‌های صخره لانه
    می‌کردند و اهالی از آن‌ها عسل جمع می‌کردند.


    کشفی که سرنوشت این ذخیره‌گاه را رقم زد در 1933 به دست پتره چابوکیانی طبیعی‌دان انجام شد، وقتی **رد
    پای دایناسورها** را روی سطح سنگ یافت. تا امروز نزدیک دویست رد شمرده شده که به دورهٔ کرتاسه، حدود 120
    میلیون سال پیش، بازمی‌گردد. هم رد پای گیاه‌خواران هست و هم رد پای شکارچیان، و امروز همه زیر سایبانی
    سرپوشیده حفاظت می‌شوند.


    روی همین محوطه چیزهای دیگری هم هست: غاری کارستی با استالاکتیت که حدود سیصد متر از آن به روی بازدیدکنندگان
    باز است؛ **سکوی دید با کف شیشه‌ای** که از صخره بیرون زده و به کوتایسی و جنگل کلخی مشرف است؛ دهانهٔ
    یک آتشفشان خاموش و مسیرهای کوتاه جنگلی؛ و ماکت‌های دایناسور در اندازهٔ واقعی که بچه‌ها همیشه بیشتر
    از رد پاهای واقعی دوستشان دارند. ساتاپلیا در مقیاسی کاملاً متفاوت از غار پرومتئوس کار می‌کند — کوچک‌تر
    و فروتن‌تر — اما دقیقاً به این دلیل جالب است که زمین‌شناسی، دیرینه‌شناسی و جنگل کلخی را در یک محوطهٔ
    جمع‌وجور کنار هم گذاشته است. هر دو به‌راحتی در یک روز جا می‌شوند.
  tip: >-
    سکوی شیشه‌ای برای کسی که از ارتفاع می‌ترسد سخت است: کف کاملاً شفاف است و دره درست زیر پا. مسیرها آسفالت‌اند
    اما پیوسته بالا می‌روند؛ کالسکه ممکن است، هرچند کار سختی است. غار خنک است، در تابستان حدود بیست درجه
    پایین‌تر از بیرون، پس کاپشن سبکی همراه بیاورید. صبح بیایید، چون گروه‌ها حوالی ظهر با هم می‌رسند. کافه،
    سرویس بهداشتی و پارکینگ کنار ورودی‌اند و نزدیک‌ترین خودپرداز در کوتایسی است.
  route: >-
    از تفلیس با E60 تا کوتایسی — 230 کیلومتر و حدود سه ساعت و بیست دقیقه. از شهر رو به شمال‌غرب بروید
    و نُه کیلومتر آخر را تا ساتاپلیا بپیمایید؛ تابلوها روشن‌اند. جاده در تمام مسیر آسفالت است و برای خودروی
    اقتصادی کاملاً راحت. سوخت و خودپرداز در کوتایسی فراوان است. غار پرومتئوس در همین جهت و حدود پانزده
    کیلومتر جلوتر است، پس ترکیب هر دو در یک گشت انتخاب بدیهی است.
he:
  name: שמורת הטבע סאטאפליה
  short: עקבות דינוזאורים, מערת קרסט ומרפסת תצפית מזכוכית, תשעה קילומטרים מקוטאיסי.
  body: >-
    סאטאפליה נמצאת תשעה קילומטרים בלבד מקוטאיסי והיא השטח המוגן העתיק ביותר בגאורגיה, שקיבל מעמד של שמורה
    כבר ב-1935. שמה פירושו "מקום הדבש": דבורי בר קיננו בנקיקי הצוק והמקומיים אספו מהן דבש.


    התגלית שקבעה את גורלה של השמורה נעשתה ב-1933 בידי חוקר הטבע פטרה צ'אבוקיאני, שמצא **עקבות דינוזאורים**
    משומרות על פני הסלע. עד היום נספרו כמאתיים טביעות, המתוארכות לתקופת הקרטיקון, לפני כ-120 מיליון שנה.
    יש כאן גם עקבות של אוכלי עשב וגם של טורפים, והאתר מוגן היום תחת ביתן מקורה.


    בשטח יש עוד כמה דברים: מערת קרסט עם נטיפים, שכשלוש מאות מטרים ממנה פתוחים למבקרים; **מרפסת תצפית עם
    רצפת זכוכית** הבולטת מן הצוק ומשקיפה על קוטאיסי ועל היער הקולכי; לוע של הר געש כבוי ושבילי יער קצרים;
    ודגמי דינוזאורים בגודל טבעי, שילדים נהנים מהם באופן עקבי יותר מאשר מן העקבות עצמן. סאטאפליה פועלת
    בקנה מידה שונה לגמרי ממערת פרומתאוס — קטנה וצנועה יותר — אבל היא מעניינת דווקא משום שגאולוגיה, פליאונטולוגיה
    ויער קולכי יושבים בה יחד באתר קומפקטי אחד. שני האתרים נכנסים בנוחות ליום אחד.
  tip: >-
    מרפסת הזכוכית קשה למי שסובל מפחד גבהים: הרצפה שקופה לחלוטין והערוץ נמצא ישירות מתחת. השבילים סלולים
    אך מטפסים בהתמדה; עגלת תינוק אפשרית, אם כי היא עבודה קשה. במערה קריר, בקיץ כעשרים מעלות פחות מאשר
    בחוץ, ולכן קחו מעיל קל. הגיעו בבוקר, כי הקבוצות מגיעות יחד סביב הצהריים. בית קפה, שירותים וחניה נמצאים
    בכניסה, והכספומט הקרוב ביותר בקוטאיסי.
  route: >-
    סעו מטביליסי על E60 עד קוטאיסי — 230 ק״מ וכשלוש שעות ועשרים דקות. מן העיר המשיכו צפונה-מערבה ועברו
    את תשעת הקילומטרים האחרונים אל סאטאפליה; השילוט ברור. הכביש סלול לכל אורכו ונוח לחלוטין לרכב חסכוני.
    דלק וכספומטים יש בשפע בקוטאיסי. מערת פרומתאוס נמצאת באותו כיוון, כחמישה עשר קילומטרים הלאה, ולכן שילוב
    של השתיים ביציאה אחת הוא המהלך המתבקש.
ar:
  name: محمية ساتابليا الطبيعية
  short: آثار أقدام ديناصورات وكهف كارستي ومنصة إطلالة زجاجية، على بعد تسعة كيلومترات من كوتايسي.
  body: >-
    تبعد ساتابليا تسعة كيلومترات فقط عن كوتايسي، وهي أقدم منطقة محمية في جورجيا، إذ نالت صفة المحمية منذ
    عام 1935. واسمها يعني «موضع العسل»: فقد كان النحل البري يعشش في شقوق الجرف وكان الأهالي يجمعون منه
    العسل.


    أما الاكتشاف الذي حدد مصير المحمية فقد تم عام 1933 على يد عالم الطبيعة بيتري تشابوكياني، الذي عثر
    على **آثار أقدام ديناصورات** محفوظة على سطح الصخر. وقد أُحصي حتى اليوم نحو مئتي أثر تعود إلى العصر
    الطباشيري، أي قبل نحو 120 مليون سنة. وفيها آثار حيوانات عاشبة وأخرى مفترسة، والموقع محمي اليوم تحت
    جناح مسقوف.


    وفي الأرض نفسها أشياء أخرى: كهف كارستي بهوابط، يُفتح منه نحو ثلاثمئة متر للزوار؛ و**منصة إطلالة بأرضية
    زجاجية** ناتئة من الجرف تطل على كوتايسي وعلى الغابة الكولخية؛ وفوهة بركان خامد ودروب غابة قصيرة؛ ومجسمات
    ديناصورات بالحجم الطبيعي يستمتع بها الأطفال أكثر من آثار الأقدام الحقيقية على الدوام. وتعمل ساتابليا
    على مقياس مختلف تماماً عن كهف بروميثيوس — أصغر وأكثر تواضعاً — لكنها مثيرة للاهتمام بالضبط لأن الجيولوجيا
    والحفريات والغابة الكولخية تجتمع فيها في موقع واحد مضغوط. والموقعان يدخلان بيسر في يوم واحد.
  tip: >-
    المنصة الزجاجية صعبة على من يخاف المرتفعات: الأرضية شفافة تماماً والوادي تحتها مباشرة. الدروب معبّدة
    لكنها تصعد باطراد؛ وعربة الطفل ممكنة وإن كانت متعبة. الكهف بارد، أدنى بنحو عشرين درجة من حرارة الخارج
    في الصيف، فاحمل سترة خفيفة. تعال في الصباح، فالمجموعات تصل معاً قرب الظهر. المقهى ودورات المياه والموقف
    عند المدخل، وأقرب صراف آلي في كوتايسي.
  route: >-
    اسلك E60 من تبليسي إلى كوتايسي — 230 كم ونحو ثلاث ساعات وعشرين دقيقة. ومن المدينة اتجه شمالاً غرباً
    واقطع الكيلومترات التسعة الأخيرة إلى ساتابليا؛ واللافتات واضحة. الطريق معبّد على امتداده ومريح تماماً
    لسيارة اقتصادية. والوقود والصرافات وفيرة في كوتايسي. ويقع كهف بروميثيوس في الاتجاه نفسه على بعد نحو
    خمسة عشر كيلومتراً أبعد، فالجمع بينهما في جولة واحدة هو الخطة البديهية.
