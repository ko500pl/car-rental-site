ka:
  name: სათაფლიის ნაკრძალი
  short: >-
    ორასამდე დინოზავრის ნაკვალევი კლდეზე, მოწვეთავე კარსტული მღვიმე და შუშის ბაქანი კოლხური ტყის თავზე,
    ქუთაისიდან ათიოდე კილომეტრში.
  body: >-
    **სათაფლიის კლდეზე ორასამდე ნაკვალევი მიუყვება — მტაცებელი და ბალახისმჭამელი დინოზავრების კვალი, რომელიც
    დღეს მერგელოვან კირქვაშია აღბეჭდილი.**


    ისინი ქუთაისელმა მასწავლებელმა და ბუნებისმეტყველმა პეტრე ჭაბუკიანმა იპოვა: აქ პირველყოფილი ადამიანის
    კვალს ეძებდა და გაცილებით უფრო ძველს წააწყდა. მისი აღმოჩენის შედეგად 1935 წელს აქ ბუნებრივი პარკი
    დაარსდა, რომელსაც ნაკვალევი, კარსტული მღვიმე და მათ გარშემო ტყე უნდა დაეცვა, ნაკვალევმა კი საკუთარი
    სამეცნიერო სახელიც მიიღო — სათაფლიაზავრი. დღეს ნაკვალევი გადახურულ ნაგებობაშია.


    სახელი ამ ყველაფერზე ძველია. სათაფლია „თაფლის ადგილს“ ნიშნავს: კლდის ხვრელებსა და ნაპრალებში ველური
    ფუტკარი ბუდობდა და ადგილობრივები თაფლს იქიდან იღებდნენ.


    ნაკრძალი ჩამქრალი ვულკანის, სათაფლიის მთის კალთებზეა გაშლილი — კრატერიც მის საზღვრებშია — და თითქმის
    მთლიანად რელიქტური კოლხური ტყით არის დაფარული: წიფელი, წაბლი, რცხილა, ბზა, ძელქვა; ქვეტყეში ტურა,
    კვერნა და მაჩვი ბინადრობს. აქ ქვის ხანის ადამიანის ნაშთებიც აღმოაჩინეს.


    მღვიმე 1925 წელს აღმოაჩინეს. ის ქვედაცარცულ კირქვაშია გამომუშავებული, დაახლოებით 900 მეტრზეა გადაჭიმული
    და მასში მუდამ 11–12 გრადუსია. შესასვლელთან, მარცხნივ, სიბნელიდან წყლის ჩხრიალი ისმის — სწორედ ამ
    ბუნებრივი ხვრელით შეძვრა მღვიმეში პირველად ჭაბუკიანი. უფრო შიგნით, დარბაზის შუაგულში, დიდი სოკოსებრი
    სტალაგმიტი აღმართულა, მის თავზე კი სტალაქტიტი დღესაც წვეთავს და იზრდება.


    ვიზიტორთა ცენტრი, პატარა მუზეუმი, დინოზავრების ნატურალური ზომის მაკეტები და კლდეზე გადმოკიდებული შუშის
    იატაკიანი ბაქანი 2010–2011 წლებში მოეწყო. ბავშვები მაკეტებისკენ გარბიან. ნამდვილი საოცრება კი ნაკვალევია.
  tip: >-
    ორი საათი გამოყავით და თბილი რამ წამოიღეთ: მღვიმეში მთელი წელი 11–12 გრადუსია, ივლისის სიცხის შემდეგ
    ეს კარგად იგრძნობა. ბილეთი დაახლოებით 20 ლარი ღირს. ბილიკები მოწყობილია, მაგრამ სულ აღმართ-დაღმართია;
    ბავშვის ეტლით გავლა შესაძლებელია, თუმცა დამღლელია. შუშის ბაქანი სრულიად გამჭვირვალეა, ქვემოთ კი პირდაპირ
    უფსკრულია, ამიტომ ყველა ვერ გაბედავს. ტურისტული ჯგუფები შუადღისას იყრიან თავს, ამიტომ დილით ჩადით.
    კაფე, ტუალეტი და პარკინგი შესასვლელთანაა, უახლოესი ბანკომატი — ქუთაისში. მაკეტებამდე ნაკვალევს დააკვირდით:
    მაკეტები მალე დაგავიწყდებათ, ნაკვალევი — არა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის უღელტეხილის გავლით ქუთაისამდე, დაახლოებით 220
    კმ. ქალაქიდან ჩრდილო-დასავლეთით, წყალტუბოს მიმართულებით გადით და სათაფლიის მანიშნებლებს მიჰყევით სოფელ
    ბანოჯის გავლით; ბოლო კილომეტრებზე გზა მთას აუყვება. სულ დაახლოებით 240 კმ-ია და სამსაათნახევრიანი
    სავალი, მთლიანად ასფალტზე, ეკონომ კლასის მანქანისთვისაც სრულიად კომფორტული. საწვავი და ბანკომატი ქუთაისში
    ბევრია. პრომეთეს მღვიმე წყალტუბოს იქით, ახლოსაა, ამიტომ ორივე ერთ დღეში თავისუფლად ეტევა, შუაში კი
    წყალტუბოს ძველი სანატორიუმებიც შეგიძლიათ ნახოთ.
en:
  name: Sataplia Nature Reserve
  short: >-
    Some 200 dinosaur footprints in the rock, a dripping karst cave and a glass deck over Colchic forest,
    about ten kilometres from Kutaisi.
  body: >-
    **Some 200 footprints cross the rock at Sataplia, left by predatory and plant-eating dinosaurs and
    now fixed in marly limestone.**


    They were found by Petre Chabukiani, a Kutaisi teacher and naturalist who came looking for traces
    of prehistoric people and met something vastly older. His discovery led to a nature park being founded
    here in 1935 to protect the tracks, a karst cave and the forest around them, and the prints gained
    a scientific name of their own: Satapliasaurus. Today they lie under cover.


    The name is older than any of this. Sataplia means 'place of honey': wild bees nested in the holes
    and crevices of the rock, and local people harvested their honey.


    The reserve spreads over the slopes of Mount Sataplia, an extinct volcano whose crater lies within
    it, and nearly all of it is relict Colchic forest of beech, chestnut, hornbeam, box and zelkova, with
    jackals, martens and badgers in the undergrowth. Remains of Stone Age people have been found here
    too.


    The cave, discovered in 1925, runs for about 900 metres through Lower Cretaceous limestone at a steady
    11–12 °C. Near the entrance, from the darkness on your left, comes the sound of water: that natural
    opening is the way Chabukiani first crawled in. Further on, a great mushroom-shaped stalagmite rises
    from the middle of a hall, and above it a stalactite is still dripping, still growing.


    The visitor centre, small museum, life-size dinosaur models and glass-floored deck over the cliff
    were built in 2010–2011. Children run for the models. The footprints are the real marvel.
  tip: >-
    Give it two hours and bring a layer: the cave holds 11–12 °C all year, a jolt on a July afternoon.
    Tickets are around 20 lari. Paths are laid out but climb and fall steadily; a pushchair is possible,
    but hard work. The glass deck is fully transparent with the drop straight beneath, so not everyone
    will manage it. Tour groups tend to bunch up around midday, so come early. Café, toilets and parking
    are at the entrance, and the nearest ATM is in Kutaisi. Look closely at the footprints before the
    models: the models are forgettable, the prints are not.
  route: >-
    From Tbilisi take the S1 (E60) west over the Rikoti Pass to Kutaisi, about 220 km. Leave the city
    north-west towards Tskaltubo and follow the signs for Sataplia through the village of Banoja; for
    the last few kilometres the road climbs the mountain. In all it is about 240 km and three and a half
    hours, asphalt throughout and easy in an economy car. Fuel and ATMs are plentiful in Kutaisi. Prometheus
    Cave lies a short drive beyond Tskaltubo, so the two fit comfortably into one day, with the town's
    old sanatoriums in between.
ru:
  name: Природный заповедник Сатаплия
  short: >-
    Около 200 следов динозавров в скале, капающая карстовая пещера и стеклянный настил над колхидским
    лесом, примерно в десяти километрах от Кутаиси.
  body: >-
    **Скалу Сатаплии пересекают около 200 следов: их оставили хищные и травоядные динозавры, и теперь
    они навеки застыли в мергелистом известняке.**


    Их нашёл Петре Чабукиани, кутаисский учитель и натуралист, искавший следы первобытного человека, а
    встретивший нечто намного древнее. Его открытие привело к основанию здесь в 1935 году природного парка,
    который должен был охранять следы, карстовую пещеру и окружающий их лес, а сами отпечатки получили
    собственное научное название: сатаплиазавр. Сегодня они находятся под навесом.


    Название старше всего этого. Сатаплия означает «место мёда»: дикие пчёлы гнездились в дырах и трещинах
    скалы, и местные жители собирали их мёд.


    Заповедник раскинулся по склонам горы Сатаплия, потухшего вулкана, кратер которого тоже входит в его
    границы, и почти вся его площадь — реликтовый колхидский лес из бука, каштана, граба, самшита и дзельквы,
    с шакалами, куницами и барсуками в подлеске. Здесь также найдены остатки людей каменного века.


    Пещера, открытая в 1925 году, тянется около 900 метров через нижнемеловые известняки при постоянной
    температуре 11–12 °C. У входа, из темноты слева, доносится шум воды: именно через это природное отверстие
    Чабукиани впервые пробрался внутрь. Дальше, посреди зала, поднимается огромный сталагмит в форме гриба,
    а над ним всё ещё капает — и всё ещё растёт — сталактит.


    Визит-центр, небольшой музей, модели динозавров в полный рост и стеклянный настил над обрывом были
    построены в 2010–2011 годах. Дети бегут к моделям. Настоящее чудо — следы.
  tip: >-
    Отведите на это два часа и возьмите тёплую вещь: пещера круглый год держит 11–12 °C, что ощутимо после
    июльского дня. Билеты стоят около 20 лари. Тропы обустроены, но постоянно то поднимаются, то спускаются;
    с детской коляской пройти можно, но тяжело. Стеклянный настил полностью прозрачен, обрыв прямо под
    ногами, так что не всем это по силам. Туристические группы обычно скапливаются к полудню, так что
    приезжайте пораньше. Кафе, туалеты и парковка у входа, а ближайший банкомат — в Кутаиси. Разглядите
    следы внимательно, прежде чем идти к моделям: модели забываются, следы — нет.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад через Рикотский перевал до Кутаиси — около 220 км. Выезжайте
    из города на северо-запад в сторону Цхалтубо и следуйте указателям на Сатаплию через село Баноджа;
    последние несколько километров дорога поднимается в гору. Всего около 240 км и три с половиной часа,
    весь путь асфальтирован, вполне по силам машине эконом-класса. Заправок и банкоматов в Кутаиси достаточно.
    Пещера Прометея лежит чуть дальше за Цхалтубо, так что оба места удобно совместить в один день, а
    по пути заглянуть в старые санатории Цхалтубо.
fa:
  name: منطقه‌ی حفاظت‌شده‌ی ساتاپلیا
  short: >-
    حدود ۲۰۰ ردپای دایناسور بر سنگ، غاری کارستی چکه‌کنان، و سکویی شیشه‌ای بر فراز جنگل کلخیسی، در حدود
    ده کیلومتری کوتایسی.
  body: >-
    **حدود ۲۰۰ ردپا بر سنگ ساتاپلیا کشیده شده، به‌جامانده از دایناسورهای گوشت‌خوار و گیاه‌خوار، و اکنون
    در سنگ‌آهک مارنی نقش بسته‌اند.**


    آن‌ها را پتره چابوکیانی، معلم و طبیعت‌شناسِ کوتایسی‌ای، یافت که به دنبال نشانه‌های انسان‌های نخستین
    آمده بود و با چیزی به‌مراتب کهن‌تر روبه‌رو شد. کشف او به بنیاد‌گذاری پارکی طبیعی در سال ۱۹۳۵ برای
    حفاظت از ردپاها، غاری کارستی و جنگل پیرامون آن‌ها انجامید، و ردپاها نامی علمی از آنِ خود گرفتند: ساتاپلیاسوروس.
    امروز آن‌ها زیر سرپناهی قرار دارند.


    نام از همه‌ی این‌ها کهن‌تر است. ساتاپلیا به معنای «جای عسل» است: زنبورهای وحشی در سوراخ‌ها و شکاف‌های
    سنگ آشیانه می‌ساختند، و مردم محلی عسل آن را برمی‌داشتند.


    منطقه‌ی حفاظت‌شده بر دامنه‌های کوه ساتاپلیا، آتشفشانی خاموش که دهانه‌اش درون آن قرار دارد، پهن می‌شود،
    و تقریباً همه‌ی آن جنگل کهن کلخیسی از راش، شاه‌بلوط، ممرز، شمشاد و درخت آزاد است، با شغال، سمور و
    گورکن در زیراشکوب. بقایای انسان‌های عصر سنگ نیز این‌جا یافت شده است.


    غار، کشف‌شده در سال ۱۹۲۵، حدود ۹۰۰ متر از میان سنگ‌آهک کرتاسه‌ی زیرین در دمای ثابت ۱۱ تا ۱۲ درجه ادامه
    می‌یابد. نزدیک ورودی، از تاریکی سمت چپ، صدای آب می‌آید: آن دهانه‌ی طبیعی همان راهی است که چابوکیانی
    نخستین بار از آن خزیده بود. جلوتر، استالاگمیتی بزرگ به شکل قارچ از میان تالاری برمی‌خیزد، و بالای
    آن استالاکتیتی هنوز چکه می‌کند و هنوز رشد می‌کند.


    مرکز بازدیدکنندگان، موزه‌ی کوچک، مدل‌های تمام‌اندازه‌ی دایناسور، و سکوی شیشه‌ای بر فراز صخره، در سال‌های
    ۲۰۱۰ تا ۲۰۱۱ ساخته شدند. کودکان به سوی مدل‌ها می‌دوند. ردپاها شگفتی راستین‌اند.
  tip: >-
    دو ساعت وقت بگذارید و لباس گرمی همراه ببرید: غار تمام سال ۱۱ تا ۱۲ درجه است، و پس از یک بعدازظهر داغ
    ژوئیه حسابی تکانتان می‌دهد. بلیت حدود ۲۰ لاری است. مسیرها ساخته و مرتب شده‌اند اما پیوسته بالا و پایین
    می‌روند؛ با کالسکه‌ی کودک هم می‌شود رفت، ولی دشوار است. سکوی شیشه‌ای کاملاً شفاف است و پرتگاه درست
    زیر پای شماست، پس این برای همه ممکن نیست. گروه‌های تور معمولاً حوالی ظهر جمع می‌شوند، پس زود بیایید.
    کافه، سرویس بهداشتی و پارکینگ در ورودی است، و نزدیک‌ترین دستگاه خودپرداز در کوتایسی است. پیش از مدل‌ها،
    ردپاها را با دقت بنگرید: مدل‌ها از یاد می‌روند، ردپاها نه.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب، از گذرگاه ریکوتی، تا کوتایسی در پیش بگیرید — حدود ۲۲۰ کیلومتر.
    از شهر به سوی شمال غرب، به سوی تسکالتوبو، خارج شوید و نشانه‌های ساتاپلیا را از میان روستای بانوجا
    دنبال کنید؛ در چند کیلومتر آخر، راه از کوه بالا می‌رود. در مجموع حدود ۲۴۰ کیلومتر و سه ساعت و نیم
    است، همه بر آسفالت و آسان با خودرویی معمولی. سوخت و دستگاه خودپرداز در کوتایسی به‌فراوانی یافت می‌شود.
    غار پرومتئوس اندکی آن‌سوتر از تسکالتوبو قرار دارد، پس این دو به‌راحتی در یک روز جای می‌گیرند، و در
    میانه‌ی راه می‌توانید آسایشگاه‌های قدیمی تسکالتوبو را هم ببینید.
he:
  name: שמורת הטבע סטפליה
  short: כ-200 עקבות דינוזאורים בסלע, מערת קארסט מטפטפת, ומצפה זכוכית מעל יער קולכי, כעשרה קילומטרים מקוטאיסי.
  body: >-
    **כ-200 עקבות חוצים את הסלע בסטפליה, שהותירו דינוזאורים טורפים ואוכלי עשב, ועתה הם חקוקים באבן גיר
    מרגלית.**


    מצא אותם פטרה צ'בוקיאני, מורה וטבען מקוטאיסי שחיפש עקבות של אנשים פרהיסטוריים ונתקל במשהו עתיק בהרבה.
    תגליתו הובילה להקמת פארק טבע כאן ב-1935 כדי להגן על העקבות, על מערת קארסט ועל היער שסביבם, והעקבות
    קיבלו שם מדעי משלהם: סטפליאזאורוס. כיום הם מוגנים תחת קירוי.


    השם קדום מכל אלה. סטפליה פירושו "מקום הדבש": דבורי בר קיננו בחורים ובסדקים של הסלע, והתושבים רדו את
    הדבש שלהן.


    השמורה מתפרשת על מדרונות הר סטפליה, הר געש כבוי שמכתשו נמצא בתוכה, ורובה המכריע יער קולכי שרידי של
    אשור, ערמון, קרפינוס, אשכרוע וזלקובה, עם תנים, דלקים וגיריות בסבך. שרידי אנשי תקופת האבן נמצאו כאן
    גם הם.


    המערה, שנתגלתה ב-1925, נמשכת כ-900 מטרים בתוך אבני גיר מתקופת הקרטיקון התחתון בטמפרטורה קבועה של 11–12°C.
    סמוך לכניסה, מהאפלה שמשמאל, נשמע קול מים: זהו הפתח הטבעי שממנו זחל צ'בוקיאני לראשונה. עוד קדימה, זקיף
    ענק דמוי פטרייה מתנשא במרכז אולם, ומעליו נטיף שעדיין מטפטף, עדיין גדל.


    מרכז המבקרים, המוזיאון הקטן, דגמי הדינוזאורים בגודל מלא, ומצפה הזכוכית מעל הצוק, נבנו ב-2010–2011.
    ילדים רצים לדגמים. העקבות הם הפלא האמיתי.
  tip: >-
    הקדישו לביקור שעתיים והביאו בגד חם: במערה 11–12°C כל השנה, הלם של ממש אחרי צהרי יולי. הכרטיס כ-20
    לארי. השבילים מסודרים אך עולים ויורדים ברציפות; אפשר לעבור עם עגלת תינוק, אבל זה מאמץ. מצפה הזכוכית
    שקוף כליל עם התהום ממש מתחת, אז לא כולם יתמודדו איתו. קבוצות תיירים נוטות להצטופף בצהריים, אז בואו
    מוקדם. בית קפה, שירותים וחניה בכניסה, והכספומט הקרוב ביותר בקוטאיסי. הביטו היטב בעקבות לפני הדגמים:
    הדגמים נשכחים, העקבות לא.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה דרך מעבר ריקוטי לקוטאיסי, כ-220 ק"מ. עזבו את העיר צפון-מערבה לכיוון
    צקלטובו ועקבו אחר השילוט לסטפליה דרך הכפר בנוג'ה; בקילומטרים האחרונים הכביש מטפס בהר. בסך הכל כ-240
    ק"מ ושלוש וחצי שעות, אספלט כל הדרך וקל גם ברכב אקונומי. דלק וכספומטים בשפע בקוטאיסי. מערת פרומתאוס
    נמצאת נסיעה קצרה מעבר לצקלטובו, כך ששני האתרים משתלבים בנוחות ביום אחד, ובדרך אפשר לראות את בתי ההבראה
    הישנים של צקלטובו.
ar:
  name: محمية ساتابليا الطبيعية
  short: >-
    نحو 200 أثر قدم لديناصورات محفورة في الصخر، وكهف كارستي يتقطر، وسطح زجاجي فوق غابة كولخيدية، على نحو
    عشرة كيلومترات من كوتايسي.
  body: >-
    **يعبر نحو 200 أثر قدم صخر ساتابليا، تركتها ديناصورات مفترسة وأخرى عاشبة، وهي الآن مثبّتة في الحجر
    الجيري الطفلي.**


    عثر عليها بيتري تشابوكياني، معلّم وعالم طبيعة من كوتايسي كان يبحث عن آثار بشر عصور ما قبل التاريخ
    فوجد شيئًا أقدم بكثير. أدى اكتشافه إلى تأسيس متنزه طبيعي هنا عام 1935 لحماية الآثار وكهف كارستي والغابة
    المحيطة بها، ونالت الآثار اسمًا علميًا خاصًا بها: ساتابلياصور. واليوم تقع تحت غطاء واقٍ.


    الاسم أقدم من كل ذلك. تعني ساتابليا "مكان العسل": كان النحل البري يعشّش في ثقوب الصخر وشقوقه، وكان
    السكان المحليون يجمعون عسله.


    تمتد المحمية على سفوح جبل ساتابليا، وهو بركان خامد تقع فوهته داخلها، وتكاد كلها غابة كولخيدية أثرية
    من الزان والكستناء والشرد والبقس والزلكوفا، تعيش بين شجيراتها بنات آوى والدلق والغرير. وقد وُجدت هنا
    أيضًا بقايا بشر من العصر الحجري.


    يمتد الكهف، المكتشف عام 1925، نحو 900 متر عبر حجر جيري من العصر الكريتاسي السفلي بحرارة ثابتة 11 إلى
    12 درجة مئوية. قرب المدخل، من العتمة على اليسار، يأتي صوت الماء: تلك الفتحة الطبيعية هي الطريق الذي
    زحف تشابوكياني منه لأول مرة إلى الداخل. وأبعد من ذلك، ترتفع صاعدة (ستالاغميت) ضخمة على شكل فطر من
    وسط قاعة، وفوقها هابطة (ستالاكتيت) لا تزال تقطر وتنمو.


    بُني مركز الزوار، والمتحف الصغير، ونماذج الديناصورات بحجمها الطبيعي، والسطح الزجاجي فوق الجرف، بين
    عامي 2010 و2011. يركض الأطفال إلى النماذج. لكن الآثار هي العجيبة الحقيقية.
  tip: >-
    خصص ساعتين واحمل ثيابًا دافئة: يحتفظ الكهف بحرارة 11 إلى 12 درجة طوال العام، وهي صدمة بعد ظهيرة يوليو.
    سعر التذكرة نحو 20 لاري. المسارات معدّة لكنها تصعد وتنحدر باستمرار؛ يمكن المرور بعربة أطفال لكن بمشقة.
    السطح الزجاجي شفاف تمامًا والهاوية مباشرة تحته، فلن يتحمّله الجميع. تميل مجموعات الجولات إلى التزاحم
    عند الظهيرة، فتعال باكرًا. المقهى والمراحيض والموقف عند المدخل، وأقرب جهاز صرف آلي في كوتايسي. انظر
    جيدًا إلى الآثار قبل النماذج: النماذج تُنسى، والآثار لا تُنسى.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر ممر ريكوتي إلى كوتايسي، نحو 220 كم. اخرج من المدينة باتجاه
    الشمال الغربي نحو تسكالتوبو واتبع اللافتات إلى ساتابليا عبر قرية بانوجا؛ وفي الكيلومترات الأخيرة يصعد
    الطريق الجبل. الإجمالي نحو 240 كم وثلاث ساعات ونصف، أسفلت طوال الطريق وسهل بسيارة اقتصادية. الوقود
    وأجهزة الصرف الآلي متوفرة بكثرة في كوتايسي. يقع كهف بروميثيوس على مسافة قصيرة بعد تسكالتوبو، فيسهل
    الجمع بين الموقعين في يوم واحد، ويمكنك في الطريق رؤية مصحات تسكالتوبو القديمة.
