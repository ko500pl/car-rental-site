ka:
  name: გრიგოლეთი
  short: ურეკის ჩრდილოეთით მდებარე მშვიდი ზღვისპირა სოფელი, სადაც ქვიშა კოლხეთის ჭაობებს ხვდება.
  body: >-
    **გრიგოლეთი ურეკის ჩრდილოეთით რვა კილომეტრშია და მისგან მთავარი განსხვავება ხალხის რაოდენობაა.** იგივე
    შავი, მაგნიტიტიანი ქვიშაა, იგივე ბრტყელი ჩაშვება ზღვაში, მაგრამ სასტუმროები ნაკლებია და მუსიკა საღამოს
    არ ისმის. ვისაც ურეკი ხმაურიანი ეჩვენება, ლოგიკურად აქ გადმოდის.

    სოფლის უჩვეულო მხარე დასავლეთით კი არა, აღმოსავლეთით არის. გრიგოლეთის უკან, გზის მეორე მხარეს, კოლხეთის
    დაბლობი იწყება — ჭაობები, ტორფიანი ველები და მდინარეების დელტები, რომლებიც კოლხეთის ეროვნული პარკის
    ნაწილია. ეს ევროპის ერთ-ერთი ყველაზე დიდი ტორფის მასივია და რამსარის კონვენციით დაცული ტერიტორია.

    რაც ამას პრაქტიკულად ნიშნავს:

    - **ფრინველი** — გაზაფხულსა და შემოდგომაზე გრიგოლეთის მიდამოები მიგრაციის დერეფანშია; მტაცებელი ფრინველი,
    წეროები და იხვები დიდი რაოდენობით გაივლიან

    - **კოღო** — ზაფხულის საღამოს სერიოზული პრობლემაა, რეპელენტის გარეშე არ ღირს გარეთ ჯდომა

    - **ტენიანობა** მაღალია, უფრო მაღალი, ვიდრე ბათუმში

    სუფსის შესართავი ჩრდილოეთით ორიოდე კილომეტრშია — იქ მდინარე ქვიშაში იკარგება და ნაპირი ველური რჩება.

    გრიგოლეთი ბოლო ათწლეულში აშენდა, მაგრამ მასშტაბი მცირეა: ორი ქუჩა, რამდენიმე ათეული სასტუმრო და ერთი
    მაღაზია. ვინც ატრაქციონებს, რესტორნებსა და ღამის ცხოვრებას ეძებს, აქ არაფერს იპოვის — და ეს ზუსტად
    ის არის, რისთვისაც აქ ჩამოდიან.
  tip: >-
    ნახევარი დღე ან რამდენიმე ღამე. კოღო ივლის-აგვისტოს საღამოს სერიოზულია: რეპელენტი და ბადე ფანჯარაზე
    აუცილებელია. მაღაზია ერთი-ორია, სერიოზული შესყიდვა ლანჩხუთში ან ურეკში გააკეთე. შხაპი და ტუალეტი სასტუმროებთანაა,
    პლაჟზე თითქმის არა. ქვიშა შუადღისას ძალიან ცხელდება — ჩუსტი ან ჩუქური მოგიწევს.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთის გავლით — 315 კმ, დაახლოებით ოთხნახევარი
    საათი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. ლანჩხუთიდან ზღვამდე ბოლო თხუთმეტი კილომეტრი ვიწროა
    და სოფლებში გადის — ნელა. საწვავი ლანჩხუთშია. სოფელში პარკინგი ქუჩაზე ან სასტუმროებთანაა, უფასო. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Grigoleti
  short: A quiet shore village north of Ureki, where the sand meets the Kolkheti wetlands.
  body: >-
    **Grigoleti lies eight kilometres north of Ureki, and the main difference between them is the number
    of people.** The same black magnetite sand, the same flat shelf into the sea, but fewer guesthouses
    and no music in the evening. Anyone who finds Ureki loud ends up here.

    The unusual side of the village faces east rather than west. Behind Grigoleti, across the road, the
    Kolkheti lowland begins: marshes, peat plains and river deltas that form part of Kolkheti National
    Park. This is one of the largest peat massifs in Europe and a wetland protected under the Ramsar convention.

    What that means in practice:

    - **Birds** — in spring and autumn Grigoleti sits under a migration corridor, and raptors, cranes
    and ducks pass in numbers

    - **Mosquitoes** — a serious matter on summer evenings; sitting outside without repellent is not realistic

    - **Humidity** is high, higher than in Batumi

    The mouth of the Supsa river is a couple of kilometres north, where the water loses itself in sand
    and the shoreline stays wild.

    Grigoleti was built out over the last decade, but the scale has stayed small: two streets, a few dozen
    guesthouses and one shop. Anyone looking for rides, restaurants and nightlife will find none of it
    here, which is precisely what the people who come are looking for.
  tip: >-
    Half a day, or several nights. Mosquitoes are serious on July and August evenings, so bring repellent
    and check the room has window screens. There are only one or two shops, so do any real buying in Lanchkhuti
    or Ureki. Showers and toilets belong to the guesthouses; there is almost nothing on the beach itself.
    The sand gets very hot by midday, so bring sandals or flip-flops.
  route: >-
    From Tbilisi take the E60 to Samtredia, then turn south through Lanchkhuti — 315 km, about four and
    a half hours. The road is asphalt throughout and in good condition. The last fifteen kilometres from
    Lanchkhuti to the sea are narrow and pass through villages, so allow for slow going. Fuel is available
    in Lanchkhuti. Parking in the village is on the street or at the guesthouses, and free. An economy
    car is entirely sufficient.
ru:
  name: Григолети
  short: Тихое приморское село севернее Уреки, где песок выходит к колхидским болотам.
  body: >-
    **Григолети лежит в восьми километрах севернее Уреки, и главное отличие между ними — количество людей.**
    Тот же чёрный магнетитовый песок, тот же пологий вход в море, но гостевых домов меньше, а вечерней
    музыки нет вовсе. Тот, кому Уреки кажется шумным, оказывается здесь.

    Необычная сторона села обращена не к западу, а к востоку. За Григолети, по другую сторону дороги,
    начинается Колхидская низменность: болота, торфяные равнины и дельты рек, входящие в Колхидский национальный
    парк. Это один из крупнейших торфяных массивов Европы и водно-болотное угодье, охраняемое Рамсарской
    конвенцией.

    Что это значит на практике:

    - **Птицы** — весной и осенью Григолети лежит под миграционным коридором, и хищные птицы, журавли
    и утки идут здесь массами

    - **Комары** — серьёзная тема летними вечерами; сидеть на улице без репеллента не выйдет

    - **Влажность** высокая, выше, чем в Батуми

    Устье реки Супса в паре километров севернее: там вода теряется в песке, а берег остаётся диким.

    Григолети застроилось за последнее десятилетие, но масштаб остался маленьким: две улицы, несколько
    десятков гостевых домов и один магазин. Тот, кто ищет аттракционы, рестораны и ночную жизнь, здесь
    не найдёт ничего — и ровно за этим сюда и едут.
  tip: >-
    Полдня или несколько ночей. Комары в июльские и августовские вечера серьёзны: везите репеллент и проверяйте
    сетки на окнах. Магазинов один-два, серьёзные закупки делайте в Ланчхути или Уреки. Души и туалеты
    при гостевых домах, на самом пляже почти ничего нет. Песок к полудню сильно раскаляется, нужны сандалии
    или шлёпанцы.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути — 315 км, около четырёх с половиной часов.
    Дорога асфальтированная и в хорошем состоянии. Последние пятнадцать километров от Ланчхути к морю
    узкие и идут через сёла, так что закладывайте медленный проезд. Заправка в Ланчхути. Парковка в селе
    на улице или у гостевых домов, бесплатная. Машины эконом-класса вполне достаточно.
fa:
  name: گریگولتی
  short: روستایی ساحلی و آرام در شمال اورکی، جایی که ماسه به تالاب‌های کلخیدا می‌رسد.
  body: >-
    **گریگولتی هشت کیلومتر شمال اورکی است و تفاوت اصلی این دو شمار آدم‌هاست.** همان ماسهٔ سیاه مگنتیت‌دار،
    همان شیب ملایم به دریا، اما مهمان‌پذیرها کمترند و شب‌ها موسیقی نیست. هرکس اورکی را پرصدا می‌یابد سر
    از اینجا درمی‌آورد.

    وجه نامعمول روستا رو به شرق است نه غرب. پشت گریگولتی و آن‌سوی جاده، جلگهٔ کلخیدا آغاز می‌شود: مرداب،
    دشت‌های تورب و دلتاهای رودخانه که بخشی از پارک ملی کلخیدا هستند. این یکی از بزرگ‌ترین تودهٔ تورب اروپاست
    و تالابی حفاظت‌شده زیر پیمان رامسر.

    این در عمل یعنی:

    - **پرندگان** — بهار و پاییز گریگولتی زیر دالان مهاجرت قرار می‌گیرد و پرندگان شکاری و درناها و مرغابی‌ها
    انبوه می‌گذرند

    - **پشه** — غروب‌های تابستان مسئلهٔ جدی است؛ نشستن بیرون بدون دورکنندهٔ حشرات شدنی نیست

    - **رطوبت** بالاست، بالاتر از باتومی

    مصب رود سوپسا دو کیلومتر شمال‌تر است؛ آنجا آب در ماسه گم می‌شود و ساحل وحشی می‌ماند.

    گریگولتی در دههٔ گذشته ساخته شد اما مقیاسش کوچک مانده: دو خیابان، چند ده مهمان‌پذیر و یک مغازه. هرکس
    دنبال شهربازی و رستوران و زندگی شبانه است اینجا هیچ نمی‌یابد، و دقیقاً برای همین به اینجا می‌آیند.
  tip: >-
    نیم روز، یا چند شب. پشه در غروب‌های تیر و مرداد جدی است؛ دورکننده ببرید و توری پنجرهٔ اتاق را بررسی
    کنید. مغازه یکی دو تاست، پس خرید اصلی را در لانچخوتی یا اورکی بکنید. دوش و سرویس بهداشتی متعلق به
    مهمان‌پذیرهاست و روی ساحل تقریباً چیزی نیست. ماسه تا ظهر بسیار داغ می‌شود، پس صندل یا دمپایی بیاورید.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی — ۳۱۵ کیلومتر، حدود چهار ساعت و نیم. جاده سرتاسر
    آسفالت و در وضعیت خوب است. پانزده کیلومتر آخر از لانچخوتی تا دریا باریک است و از میان روستاها می‌گذرد،
    پس آهسته بروید. سوخت در لانچخوتی. پارک در روستا کنار خیابان یا نزد مهمان‌پذیرها و رایگان است. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: גריגולטי
  short: כפר חוף שקט מצפון לאורקי, שבו החול פוגש את ביצות קולחתי.
  body: >-
    **גריגולטי שוכן שמונה קילומטרים מצפון לאורקי, וההבדל העיקרי ביניהם הוא מספר האנשים.** אותו חול שחור
    ומגנטיטי, אותה כניסה מתונה לים, אבל פחות בתי הארחה ובלי מוזיקה בערב. מי שאורקי רועשת בעיניו מגיע לכאן.

    הצד החריג של הכפר פונה מזרחה ולא מערבה. מאחורי גריגולטי, מעברו השני של הכביש, מתחיל השפל של קולחתי:
    ביצות, מישורי כבול ודלתות נהרות המהווים חלק מן הפארק הלאומי קולחתי. זהו אחד ממאגרי הכבול הגדולים באירופה
    ואזור לח מוגן באמנת רמסאר.

    מה זה אומר בפועל:

    - **ציפורים** — באביב ובסתיו גריגולטי יושב מתחת למסדרון נדידה, ודורסים, עגורים וברווזים חולפים בהמוניהם

    - **יתושים** — עניין רציני בערבי קיץ; לשבת בחוץ בלי דוחה חרקים אינו מעשי

    - **הלחות** גבוהה, גבוהה מזו של באטומי

    שפך נהר סופסה נמצא כשני קילומטרים צפונה, שם המים נבלעים בחול והחוף נשאר פראי.

    גריגולטי נבנה בעשור האחרון, אבל קנה המידה נשאר קטן: שני רחובות, כמה עשרות בתי הארחה וחנות אחת. מי
    שמחפש מתקנים, מסעדות וחיי לילה לא ימצא כאן דבר, וזה בדיוק מה שמחפשים אלה שמגיעים.
  tip: >-
    חצי יום, או כמה לילות. היתושים רציניים בערבי יולי ואוגוסט, אז הביאו דוחה ובדקו שיש רשתות בחלונות.
    יש חנות אחת או שתיים, אז קניות אמיתיות עשו בלנצ׳חותי או באורקי. מקלחות ושירותים שייכים לבתי ההארחה;
    על החוף עצמו כמעט אין דבר. החול מתחמם מאוד בצהריים, אז הביאו סנדלים או כפכפים.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי — 315 ק״מ, כארבע וחצי שעות. הכביש סלול לכל אורכו
    ובמצב טוב. חמישה עשר הקילומטרים האחרונים מלנצ׳חותי אל הים צרים ועוברים בכפרים, אז קחו בחשבון נסיעה
    איטית. תדלוק בלנצ׳חותי. החניה בכפר ברחוב או בבתי ההארחה, וחינם. רכב חסכוני מספיק לחלוטין.
ar:
  name: غريغوليتي
  short: قرية ساحلية هادئة شمال أوريكي، حيث يلتقي الرمل بأهوار كولخيتي.
  body: >-
    **تقع غريغوليتي على بعد ثمانية كيلومترات شمال أوريكي، والفارق الأساسي بينهما عدد الناس.** الرمل الأسود
    المغنتيتي نفسه، والانحدار المستوي نفسه إلى البحر، لكن بيوت الضيافة أقل ولا موسيقى في المساء. ومن يجد
    أوريكي صاخبة ينتهي به المطاف هنا.

    والوجه غير المعتاد للقرية يتجه شرقاً لا غرباً. فخلف غريغوليتي، على الجانب الآخر من الطريق، يبدأ منخفض
    كولخيتي: مستنقعات وسهول خث ودلتات أنهار تشكل جزءاً من منتزه كولخيتي الوطني. وهذه من أكبر كتل الخث
    في أوروبا وأرض رطبة محمية باتفاقية رامسار.

    وما يعنيه ذلك عملياً:

    - **الطيور** — في الربيع والخريف تقع غريغوليتي تحت ممر هجرة، فتمر الجوارح والكراكي والبط بأعداد كبيرة

    - **البعوض** — مسألة جدية في أمسيات الصيف؛ والجلوس في الخارج دون طارد غير واقعي

    - **الرطوبة** عالية، أعلى منها في باتومي

    ومصب نهر سوبسا على بعد كيلومترين شمالاً، حيث يضيع الماء في الرمل ويبقى الساحل برياً.

    بُنيت غريغوليتي خلال العقد الأخير لكن مقياسها ظل صغيراً: شارعان وبضع عشرات من بيوت الضيافة ومتجر واحد.
    ومن يبحث عن الملاهي والمطاعم وحياة الليل لن يجد شيئاً هنا، وهذا بالضبط ما يبحث عنه القادمون.
  tip: >-
    نصف يوم، أو عدة ليالٍ. البعوض جاد في أمسيات يوليو وأغسطس، فاحمل طارداً وتأكد من وجود شبك على النوافذ.
    المتاجر واحد أو اثنان، فاقضِ مشترياتك الحقيقية في لانتشخوتي أو أوريكي. الدشات ودورات المياه تابعة
    لبيوت الضيافة، ولا يكاد يوجد شيء على الشاطئ نفسه. ويسخن الرمل كثيراً عند الظهيرة، فأحضر صندلاً أو
    شبشباً.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي — 315 كم، نحو أربع ساعات ونصف. الطريق معبّد
    كله وبحالة جيدة. آخر خمسة عشر كيلومتراً من لانتشخوتي إلى البحر ضيقة وتمر بالقرى، فاحسب سيراً بطيئاً.
    الوقود في لانتشخوتي. الوقوف في القرية على الشارع أو عند بيوت الضيافة، وهو مجاني. وسيارة اقتصادية تكفي
    تماماً.
