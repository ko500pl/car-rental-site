ka:
  name: გრიგოლეთი
  short: მშვიდი ზღვისპირა სოფელი მუქი მაგნიტური ქვიშითა და ფიჭვნარით, რომლის ზურგსაც კოლხეთის ჭაობები
    ეკვრის.
  body: >-
    **გრიგოლეთს მაშინ ირჩევენ, როცა ექვსი კილომეტრით სამხრეთით მდებარე ურეკი მეტისმეტად ხმაურიანი ეჩვენებათ.**
    ქვიშა აქაც იგივეა — მუქი, მაგნიტიტით მდიდარი, შუადღისას ისე გავარვარებული, რომ ფეხშიშველა ხტუნვით
    გადიხარ, — ზღვაც ისევე ნელ-ნელა ღრმავდება, საღამოები კი ჭაობს ეკუთვნის და არა დინამიკებს.


    სოფელი იმაზე ძველია, ვიდრე ერთი შეხედვით ჩანს. 1614 წელს აქ ნაპირზე ორი იეზუიტი მისიონერი გადმოვიდა,
    მამია II გურიელთან მიმავალი; 1805 წელს კი რუსი ოფიცერი ლაშქარევი ზამთრის ნავსადგომს ეძებდა, ღია სანაპირო
    ფეხით დაიარა და გემებისთვის უვარგისად ცნო. ფიჭვნარი, რომელიც დღეს ამ ნაპირს არბილებს, გაცილებით გვიან
    გააშენეს — 1949 წლის გადაწყვეტილების შემდეგ, რომლითაც ზღვისპირეთი საკურორტო ზოლად უნდა ქცეულიყო.


    ზღვას ზურგი აქციეთ და მეორე გრიგოლეთს დაინახავთ. გზის გაღმა კოლხეთის ჭარბტენიანი ტერიტორიები იწყება
    — 1996 წლიდან რამსარის კონვენციით დაცული, 2021 წლიდან კი იუნესკოს მსოფლიო მემკვიდრეობის ძეგლის, „კოლხეთის
    ტყეებისა და ჭარბტენიანი ტერიტორიების“ ნაწილი. მათ სახელდებულ ტორფნარებს შორის ერთს სწორედ გრიგოლეთი
    ჰქვია; აქაური ტორფი ათასწლეულების განმავლობაში გროვდებოდა. პრაქტიკულად ეს ნიშნავს:

    - **ფრინველს**: გაზაფხულსა და შემოდგომაზე სანაპიროს გასწვრივ მტაცებლები, წეროები და იხვები მიფრინავენ

    - **კოღოს**: ზაფხულის საღამოს რეპელენტი აუცილებლობაა

    - **ჰაერს**: ნოტიოს და რბილს, ფისისა და ჭაობის სუნით


    სამხრეთით, ორნახევარიოდე კილომეტრში, სუფსა — პლინიუსის მოგრუსი — ზღვას უერთდება. გრიგოლეთში არც ატრაქციონებია
    და არც ღამის ცხოვრება. სამაგიეროდ, აქ მზის ჩასვლის შემდეგ ფეხქვეშ გაგრილებული მუქი ქვიშაა, ფისისა
    და ჭაობის სუნი და ისეთი სიწყნარე, რომ ყოველი ტალღის ხმა გესმის. სწორედ ამისთვის ჩამოდიან.
  tip: >-
    ნახევარი დღე საბანაოდ ან რამდენიმე ნელი ღამე. ივლის-აგვისტოში ძლიერი რეპელენტი წამოიღეთ და შეამოწმეთ,
    აქვს თუ არა ოთახს ფანჯარაზე ბადე. მაღაზია ცოტაა — მარაგი ლანჩხუთში ან ურეკში შეიძინეთ. შხაპი და ტუალეტი
    სასტუმროებთანაა; პლაჟზე თითქმის არაფერია, ჩრდილი მხოლოდ ფიჭვების ქვეშ იპოვება. შუადღისას ქვიშა ფეხს
    წვავს, ამიტომ სანდლები აუცილებელია. ფრინველებზე დასაკვირვებლად აპრილ-მაისში ან სექტემბერ-ოქტომბერში,
    დილით ადრე მოდით, ბინოკლით. ჭაობებში მარტო ნუ შეხვალთ: ბილიკები იქ არ არის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთ-დასავლეთით,
    ლანჩხუთის გავლით; გზა ზღვასთან, სწორედ გრიგოლეთში მთავრდება — 305 კმ, დაახლოებით ოთხი საათი. გზა ბოლომდე
    ასფალტიანია: სამტრედიამდე სწრაფი, უმეტესად ოთხზოლიანი, შემდეგ ორზოლიანი, სოფლებში გამავალი, სადაც
    ტემპს ძროხები და ნელი ტრაქტორები გიკარნახებენ. საწვავი ლანჩხუთშია, სანაპირო გზაზე კი — ურეკში. მანქანა
    სასტუმროსთან ან სოფლის ქუჩაზე დააყენეთ, უფასოდ. ეკონომ-კლასის მანქანა სრულიად საკმარისია.
en:
  name: Grigoleti
  short: >-
    A quiet shore village of dark magnetic sand and pines, with the Kolkheti wetlands pressing right up
    behind the beach.
  body: >-
    **Grigoleti is the beach you choose when Ureki, six kilometres south, is too loud.** The sand is the
    same — dark, rich in magnetite, hot enough by noon to make you hop — and the sea shelves just as gently,
    but the evenings belong to the marsh, not to loudspeakers.


    The village is older than it looks. In 1614 two Jesuit missionaries stepped ashore here on their way
    to Mamia II Gurieli; in 1805 a Russian officer, Lashkarev, came looking for a winter anchorage, walked
    the open shore and wrote it off as unfit for ships. The pines that soften it today came much later,
    planted after a 1949 decision to turn the coast into a resort strip.


    Turn your back on the sea and you face the other Grigoleti. Across the road begin the Kolkheti wetlands,
    Ramsar-listed since 1996 and, since 2021, part of the UNESCO World Heritage site Colchic Rainforests
    and Wetlands. One of their named peat bogs is called Grigoleti; the peat here has been building for
    thousands of years. In practice:

    - **birds**: in spring and autumn raptors, cranes and ducks pass along the coast

    - **mosquitoes**: on summer evenings repellent is not optional

    - **air**: humid and soft, smelling of resin and marsh


    About two and a half kilometres south, the Supsa — Pliny's river Mogrus — slides into the sea. Grigoleti
    offers no rides and no nightlife. What it has is dark sand cooling underfoot after sunset, the smell
    of resin and marsh, and a shore quiet enough to hear every wave. That is exactly why people come.
  tip: >-
    Half a day for a swim, or several slow nights. In July and August bring strong repellent and check
    that your room has window screens. Shops are few, so stock up in Lanchkhuti or Ureki. Showers and
    toilets belong to the guesthouses; the beach itself is almost bare, with shade only under the pines.
    The sand scorches by midday, so bring sandals. Birdwatchers should come in April–May or September–October,
    early in the morning, with binoculars. Do not wander into the marshes alone: there are no paths.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then the S12 south-west through Lanchkhuti;
    the road ends at the sea in Grigoleti — 305 km, about four hours. It is asphalt all the way: fast,
    largely dual carriageway to Samtredia, then two lanes through villages, where cattle and slow tractors
    set the pace. Fuel in Lanchkhuti, and on the coast road at Ureki. Park at your guesthouse or on the
    village streets, free of charge. An economy car is all you need.
ru:
  name: Григолети
  short: Тихая приморская деревня с тёмным магнетитовым песком и соснами, где болота Колхети подступают
    прямо к пляжу.
  body: >-
    **Григолети — тот пляж, который выбирают, когда Уреки, в шести километрах южнее, кажется слишком шумным.**
    Песок здесь тот же — тёмный, насыщенный магнетитом, к полудню такой горячий, что впору подпрыгивать,
    — и море так же мягко уходит вглубь, но вечера здесь принадлежат болоту, а не громкоговорителям.


    Деревня старше, чем кажется. В 1614 году здесь сошли на берег два миссионера-иезуита, направлявшиеся
    к Мамии II Гуриели; в 1805 году русский офицер Лашкарёв искал место для зимней стоянки кораблей, обошёл
    открытый берег и признал его непригодным. Сосны, которые смягчают его сегодня, посадили гораздо позже
    — после решения 1949 года превратить побережье в курортную полосу.


    Отвернитесь от моря — и перед вами другое Григолети. За дорогой начинаются болота Колхети, включённые
    в список Рамсарской конвенции с 1996 года и, с 2021 года, входящие в объект Всемирного наследия ЮНЕСКО
    «Колхидские дождевые леса и водно-болотные угодья». Один из здешних именованных торфяников называется
    Григолети; торф здесь накапливался тысячелетиями. На практике это значит:

    - **птицы**: весной и осенью вдоль побережья пролетают хищники, журавли и утки

    - **комары**: летними вечерами репеллент не роскошь, а необходимость

    - **воздух**: влажный и мягкий, пахнущий смолой и болотом


    Примерно в двух с половиной километрах южнее река Супса — тот самый Могрус, упомянутый Плинием, —
    впадает в море. Григолети не предлагает ни аттракционов, ни ночной жизни. Зато здесь есть тёмный песок,
    остывающий под ногами после заката, запах смолы и болота и такая тишина, что слышна каждая волна.
    Именно за этим сюда и приезжают.
  tip: >-
    Полдня — чтобы искупаться, или несколько неспешных ночей. В июле и августе берите сильный репеллент
    и проверьте, что в комнате есть сетки на окнах. Магазинов мало, так что запасайтесь в Ланчхути или
    Уреки. Душ и туалеты — только в гостевых домах; сам пляж почти без построек, тень есть лишь под соснами.
    К полудню песок обжигает, так что возьмите сандалии. Любителям птиц стоит приезжать в апреле–мае или
    сентябре–октябре, рано утром, с биноклем. Не бродите по болотам одни: там нет троп.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юго-запад через
    Ланчхути; дорога заканчивается у моря в Григолети — 305 км, около четырёх часов. Асфальт на всём протяжении:
    до Самтредиа — быстрая трасса, в основном четырёхполосная, затем двухполосная дорога через деревни,
    где темп задают коровы и медленные тракторы. Заправиться можно в Ланчхути и на прибрежной дороге в
    Уреки. Парковка — у гостевого дома или на деревенских улицах, бесплатно. Хватит обычной легковой машины.
fa:
  name: گریگولتی
  short: >-
    روستایی ساحلی و آرام با شن‌های تیره و مغناطیسی و درختان کاج، جایی که تالاب‌های کولخِتی درست پشت ساحل
    قرار گرفته‌اند.
  body: >-
    **گریگولتی همان ساحلی است که وقتی اورکی، در شش کیلومتری جنوب، بیش از حد پرهیاهو شود، انتخابش می‌کنید.**
    شن همان است — تیره، غنی از مگنتیت، تا ظهر آن‌قدر داغ که وادارتان می‌کند بجهید — و دریا هم به همان
    آرامی کم‌عمق می‌شود، اما شب‌ها اینجا از آنِ تالاب است، نه بلندگوها.


    این روستا از آنچه به نظر می‌رسد کهن‌تر است. در سال ۱۶۱۴ دو مبلغ یسوعی که رهسپار دیدار مامیا دوم گوریئلی
    بودند، در این‌جا پا به ساحل گذاشتند؛ و در سال ۱۸۰۵ افسری روس به نام لاشکارف، در جست‌وجوی لنگرگاهی
    زمستانی، این ساحل باز را پیمود و آن را برای کشتی‌ها نامناسب دانست. کاج‌هایی که امروز چهرهٔ این ساحل
    را نرم‌تر کرده‌اند، بسیار دیرتر کاشته شدند — پس از تصمیم سال ۱۹۴۹ برای تبدیل ساحل به نواری تفریحی.


    به دریا پشت کنید و گریگولتیِ دیگری پیش رویتان است. آن‌سوی جاده، تالاب‌های کولخِتی آغاز می‌شوند که
    از سال ۱۹۹۶ در فهرست کنوانسیون رامسر جای گرفته‌اند و از سال ۲۰۲۱ بخشی از میراث جهانی یونسکو با عنوان
    «جنگل‌های بارانی و تالاب‌های کولخیک» هستند. یکی از تورب‌زارهای این منطقه گریگولتی نام دارد؛ توربِ
    این‌جا هزاران سال است که انباشته می‌شود. در عمل این یعنی:

    - **پرندگان**: در بهار و پاییز پرندگان شکاری، درناها و اردک‌ها از کنار ساحل می‌گذرند

    - **پشه‌ها**: در شب‌های تابستان، دافع حشرات یک انتخاب نیست، ضرورت است

    - **هوا**: مرطوب و ملایم، با رایحهٔ صمغ و تالاب


    در حدود دو و نیم کیلومتری جنوب، رود سوپسا — همان رودی که پلینیوس آن را «موگروس» نامیده بود — به دریا
    می‌ریزد. گریگولتی نه وسایل بازی دارد و نه زندگی شبانه. در عوض، شن تیره‌ای دارد که پس از غروب زیر پا
    خنک می‌شود، بوی صمغ و تالاب، و سکوتی چنان که صدای هر موج را می‌شنوید. و درست به همین دلیل است که مردم
    به این‌جا می‌آیند.
  tip: >-
    نیم‌روز برای شنا کافی است، یا چند شب آرام و کشیده. در ماه‌های ژوئیه و اوت، دافع حشرات قوی همراه داشته
    باشید و مطمئن شوید که اتاقتان توری پنجره دارد. مغازه‌ها کم‌اند، پس در لانچخوتی یا اورکی خرید کنید.
    دوش و توالت تنها در خانه‌های مهمان‌پذیر هست؛ خودِ ساحل تقریباً خالی از سازه است و سایه تنها زیر درختان
    کاج پیدا می‌شود. شن تا ظهر داغ می‌شود، پس صندل همراه داشته باشید. پرنده‌نگرها بهتر است در آوریل–مه
    یا سپتامبر–اکتبر، صبح زود و با دوربین دوچشمی بیایند. تنها به تالاب‌ها نروید: راهی نشانه‌گذاری‌شده
    وجود ندارد.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 به سوی
    جنوب‌غرب از میان لانچخوتی بگذرید؛ جاده در گریگولتی به دریا می‌رسد — ۳۰۵ کیلومتر، حدود چهار ساعت. تمام
    مسیر آسفالت است: تا سامتردیا بزرگ‌راهی سریع و اغلب دوخطه در هر سو، و پس از آن جاده‌ای دوخطه از میان
    روستاها که گاوها و تراکتورهای آهسته سرعت را تعیین می‌کنند. سوخت‌گیری در لانچخوتی و در جادهٔ ساحلی
    نزدیک اورکی. پارک خودرو، رایگان، در محل اقامتگاه یا خیابان‌های روستا. یک خودروی معمولی کافی است.
he:
  name: גריגולטי
  short: כפר חוף שלֵו עם חול כהה מגנטי ועצי אורן, שבו אדמות הביצה של קולחתי צמודות ממש לחוף.
  body: >-
    **גריגולטי הוא החוף שבוחרים בו כשאורקי, שישה קילומטרים דרומה, רועש יותר מהנדרש.** החול זהה — כהה,
    עשיר במגנטיט, חם עד כדי כך בשעת הצהריים שמקפצים עליו — והים משתפל בעדינות דומה, אבל הערבים כאן שייכים
    לביצה, לא לרמקולים.


    הכפר עתיק יותר משנראה. ב-1614 ירדו כאן לחוף שני מיסיונרים ישועים שהיו בדרכם אל מאמיה השני גוריאלי;
    ב-1805 חיפש כאן קצין רוסי, לשקארייב, מעגן חורף לספינות, סייר בחוף הפתוח וקבע שאינו מתאים. עצי האורן,
    שמרככים היום את קו החוף, ניטעו מאוחר הרבה יותר — בעקבות החלטה מ-1949 להפוך את החוף לרצועת אתרי נופש.


    הפנו את גבכם לים ותעמדו בפני גריגולטי האחר. מעבר לכביש מתחילות אדמות הביצה של קולחתי, הרשומות באמנת
    רמסאר מ-1996 ומאז 2021 חלק מאתר המורשת העולמית של אונסק"ו "יערות הגשם וביצות קולכיס". אחת מביצות הכבול
    באזור נושאת את השם גריגולטי; הכבול כאן הצטבר במשך אלפי שנים. בפועל זה אומר:

    - **ציפורים**: באביב ובסתיו עוברים לאורך החוף דורסים, עגורים וברווזים

    - **יתושים**: בערבי קיץ דוחה יתושים אינו מותרות אלא הכרח

    - **אוויר**: לח ורך, מריח שרף וביצה


    כשני קילומטרים וחצי דרומה, נהר סופסה — נהר המוגרוס שהזכיר פליניוס — נשפך לים. בגריגולטי אין מתקני
    שעשועים ואין חיי לילה. יש בו חול כהה שמתקרר מתחת לרגליים אחרי השקיעה, ריח של שרף וביצה, ושקט כזה ששומעים
    בו כל גל. זו בדיוק הסיבה שאנשים מגיעים.
  tip: >-
    חצי יום מספיק לשחייה, או כמה לילות איטיים. ביולי ובאוגוסט הביאו דוחה יתושים חזק ובדקו שיש רשתות בחלונות
    החדר. יש מעט חנויות, אז הצטיידו בלנצ'חוטי או באורקי. מקלחות ושירותים שייכים לבתי ההארחה בלבד; החוף
    עצמו כמעט חשוף, וצל יש רק מתחת לעצי האורן. החול חם עד כדי צריבה בשעת הצהריים, אז הביאו סנדלים. צפרים
    כדאי שיבואו באפריל–מאי או בספטמבר–אוקטובר, בשעות הבוקר המוקדמות, עם משקפת. אל תשוטטו בביצות לבד: אין
    שם שבילים.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, ואז ב-S12 דרום-מערבה דרך לנצ'חוטי;
    הכביש מסתיים בים בגריגולטי — 305 ק"מ, כארבע שעות. אספלט כל הדרך: כביש מהיר, ברובו דו-מסלולי, עד סמטרדיה,
    ואז שני נתיבים בין הכפרים, שם בקר וטרקטורים אטיים קובעים את הקצב. תדלוק בלנצ'חוטי, ובכביש החוף באורקי.
    חנו בבית ההארחה או ברחובות הכפר, בחינם. רכב פשוט הוא כל מה שדרוש.
ar:
  name: غريغوليتي
  short: قرية ساحلية هادئة برمال داكنة مغناطيسية وأشجار صنوبر، تلاصق أراضي كولخيتي الرطبة شاطئها من الخلف.
  body: >-
    **غريغوليتي هو الشاطئ الذي تختاره حين يصبح شاطئ أوريكي، على ستة كيلومترات جنوبًا، أكثر ضجيجًا من اللازم.**
    الرمال هي نفسها — داكنة، غنية بالمغنتيت، وساخنة عند الظهيرة بما يكفي لتجعلك تقفز — والبحر ينحدر بلطف
    مماثل، لكن المساءات هنا للمستنقع، لا لمكبرات الصوت.


    القرية أقدم مما تبدو. ففي عام 1614 نزل إلى هذا الشاطئ مبشّران يسوعيان كانا في طريقهما إلى ماميا الثاني
    غورييلي؛ وفي عام 1805 جاء ضابط روسي يُدعى لاشكاريف يبحث عن مرسى شتوي للسفن، فجال في هذا الساحل المكشوف
    وحكم بأنه لا يصلح لها. أما أشجار الصنوبر التي تلطّف الشاطئ اليوم فقد زُرعت بعد ذلك بكثير، إثر قرار
    عام 1949 بتحويل الساحل إلى شريط منتجعات.


    أدر ظهرك للبحر وستجد نفسك أمام غريغوليتي الآخر. عبر الطريق تبدأ أراضي كولخيتي الرطبة، المسجلة في قائمة
    رامسار منذ عام 1996، والتي أصبحت منذ عام 2021 جزءًا من موقع التراث العالمي لليونسكو «غابات الأمطار
    والأراضي الرطبة الكولخية». ويحمل أحد مستنقعات الخُث في المنطقة اسم غريغوليتي؛ وقد تراكم الخُث هنا
    على مدى آلاف السنين. عمليًا هذا يعني:

    - **الطيور**: في الربيع والخريف تعبر طيور جارحة وكراكي وبط على طول الساحل

    - **البعوض**: في مساءات الصيف، طارد الحشرات ليس أمرًا اختياريًا

    - **الهواء**: رطب ولطيف، تعبق فيه رائحة الراتنج والمستنقع


    على مسافة نحو كيلومترين ونصف جنوبًا، ينسلّ نهر سوبسا — نهر موغروس الذي ذكره بلينيوس — إلى البحر. لا
    يقدّم غريغوليتي ملاهي ولا حياة ليلية. لكنه يمنحك رمالًا داكنة تبرد تحت قدميك بعد الغروب، ورائحة الراتنج
    والمستنقع، وهدوءًا تسمع فيه كل موجة. ولهذا بالضبط يأتي الناس إليه.
  tip: >-
    يكفي نصف يوم للسباحة، أو بضع ليالٍ هادئة. في يوليو وأغسطس، احمل طاردًا قويًا للحشرات وتحقق من وجود
    شبك على نوافذ غرفتك. المتاجر قليلة، فتزوّد من لانتشخوتي أو أوريكي. الدُّشّ والمراحيض توجد فقط في بيوت
    الضيافة؛ والشاطئ نفسه شبه عارٍ، ولا ظلّ إلا تحت أشجار الصنوبر. تصبح الرمال حارقة عند الظهيرة، فاحمل
    صندلًا. أما مراقبو الطيور فالأفضل أن يأتوا في أبريل–مايو أو سبتمبر–أكتوبر، في الصباح الباكر، مع منظار.
    لا تتجول في المستنقعات بمفردك: فلا مسارات هناك.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم S12 جنوب غربًا عبر لانتشخوتي؛
    ويصل الطريق إلى البحر عند غريغوليتي — 305 كم، نحو أربع ساعات. الطريق معبّد بالكامل: سريع، ومزدوج المسار
    غالبًا حتى سامتريديا، ثم طريق بمسارين عبر القرى حيث تحدد الأبقار والجرارات البطيئة الوتيرة. التزود
    بالوقود في لانتشخوتي، وعلى طريق الساحل في أوريكي. اركن سيارتك عند بيت الضيافة أو في شوارع القرية،
    مجانًا. سيارة اقتصادية عادية تكفي.
