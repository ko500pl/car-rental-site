ka:
  name: ახალი შუამთა
  short: >-
    XVI საუკუნის მოქმედი დედათა მონასტერი, აგებული დედოფალ თინათინის აღთქმით, ძველი შუამთიდან ორ კილომეტრში.
  body: >-
    **ახალი შუამთა XVI საუკუნის შუა წლებში დაარსდა და დღემდე მოქმედი დედათა მონასტერია.** მისი დამაარსებელი კახეთის მეფე ლევანის მეუღლე, დედოფალი თინათინია — გურიის მთავრის ასული, რომელიც ქმრის სახლში მოგზაურობდა, როცა ეს ადგილი დაინახა.


    გადმოცემა ამბობს, რომ ბავშვობაში მან სიზმარში ნახა მთის კალთა და მაყვლის ბუჩქი, სადაც ეკლესია უნდა აეშენებინა. ქორწილში მიმავალმა სწორედ ეს ადგილი იცნო და აღთქმა შეასრულა. ისტორიულ დოკუმენტში სიზმარი, ცხადია, არ წერია, მაგრამ თინათინის ქტიტორობა და მისი აქ დაკრძალვა დადასტურებულია.


    ეკლესია აგურითაა ნაგები — ეს კახეთისთვის უჩვეულოა, სადაც ქვა ჭარბობს — და ჯვარგუმბათოვანი გეგმა აქვს, სამხრეთით მაღალი, ვიწრო ბარაბანით. ინტერიერში XVI საუკუნის მოხატულობის ფრაგმენტებია, მათ შორის ქტიტორთა პორტრეტები. მთავარი ხატის წინ დედოფლის საფლავია.


    გალავანი, სატრაპეზო და საცხოვრებელი კორპუსები მოგვიანებით აშენდა და დღეს მოწესრიგებულია: ვარდები, კაკლის ხეები, ვენახის პატარა ნაკვეთი. მონაზვნები აქ ხატებს წერენ და ბაღს უვლიან; ჩვეულებრივ ისმის მხოლოდ ფრინველი და საკუთარი ნაბიჯი ხრეშზე.


    ძველ შუამთასთან შედარებით აქ ყველაფერი უფრო გვიანი, უფრო ნათელი და უფრო ცოცხალია. ორივეს ერთად ნახვა სწორედ ამიტომ ღირს — ორი კილომეტრით და ათი საუკუნით არიან დაშორებულნი.
  tip: >-
    ოცდაათი წუთი სავსებით საკმარისია. ეს მოქმედი მონასტერია და ჩაცმის წესები მკაცრად სრულდება: ქალებს გრძელი კაბა და თავსაფარი, მამაკაცებს გრძელი შარვალი. კართან ხშირად დევს გადასაფარებლები, მაგრამ არა ყოველთვის. შიგნით ფოტოს გადაღება ჩვეულებრივ არ შეიძლება — ჯერ იკითხე. პარკინგი გალავნის წინაა, უფასო. ტუალეტი არის, კაფე არა. მშვიდი ხმა და ტელეფონის გამორთვა აქ ნორმად ითვლება.
  route: >-
    იგივე გზაა, რაც ძველ შუამთაზე: თბილისიდან უჯარმისა და გომბორის უღელტეხილის გავლით თელავისკენ, 88 კმ, დაახლოებით საათი და ორმოცი წუთი. ასფალტი ბოლომდე კარგია. მონასტრის მიმანიშნებელი მარცხნივ დგას, ძველი შუამთის შესახვევიდან სამიოდე კილომეტრში, და ბოლო ორასი მეტრი ვიწრო, მაგრამ მოასფალტებული ჩასასვლელია. ეკონომ-კლასის მანქანა საკმარისია. ზამთარში უღელტეხილზე თოვლის შემდეგ ჯაჭვი ან ზამთრის საბურავი გამოგადგება.
en:
  name: Akhali Shuamta
  short: >-
    A working 16th-century nunnery founded on a queen's vow, two kilometres from the old churches of Dzveli Shuamta.
  body: >-
    **Akhali Shuamta was founded in the middle of the 16th century and is still a working convent.** Its founder was Queen Tinatin, wife of King Levan of Kakheti, a daughter of the ruling house of Guria who was travelling east to her wedding when she first saw this slope.


    The tradition told here is that as a child she dreamed of a hillside and a bramble bush, and vowed to build a church wherever she found them. On the road to her marriage she recognised the place and kept the promise. The dream is not in the documents, but Tinatin's patronage is, and so is her burial in the church she paid for.


    The building is brick, which is unusual in a region where stone dominates, and follows a cross-in-square plan with a tall, narrow drum. Inside there are fragments of 16th-century painting including donor portraits, darkened by candle smoke but legible. The queen's grave slab lies near the front of the nave.


    The enclosure wall, refectory and cells came later and are kept in good order today: roses, walnut trees and a small vineyard worked by the community. The nuns paint icons and tend the garden, and on an ordinary weekday the only sounds are birds and your own steps on gravel.


    Set against Dzveli Shuamta up the road, everything here is later, lighter and alive. That contrast is the reason to see both: two kilometres apart and about a thousand years, one abandoned to the forest and one still keeping its hours.


    The church was also a political statement. Levan ruled a kingdom squeezed between Safavid Persia and the Ottoman advance, and building in brick in the manner of the eastern courts, while dedicating the work firmly to the Georgian church, was a way of holding both positions at once.
  tip: >-
    Half an hour is enough. This is an active monastery and the dress code is enforced rather than suggested: long skirt and headscarf for women, long trousers for men. Wraps are often available at the gate, but not always. Photography inside the church is normally not allowed, so ask before raising a camera. Parking in front of the wall is free. There are toilets but no cafe. Quiet voices and silenced phones are the expectation, and visitors who ignore that are asked to leave.
  route: >-
    The approach is the same as for Dzveli Shuamta: east from Tbilisi past Ujarma and over the Gombori Pass towards Telavi, 88 km and about an hour and forty minutes. The asphalt is good throughout. The monastery turning is on the left about three kilometres beyond the Dzveli Shuamta junction, and the final two hundred metres is a narrow but surfaced drive. An economy car is fine. In winter, after snow on the pass, winter tyres or chains make the descent much easier.
ru:
  name: Ахали Шуамта
  short: >-
    Действующий женский монастырь XVI века, основанный по обету царицы, в двух километрах от древних церквей Дзвели Шуамта.
  body: >-
    **Ахали Шуамта основана в середине XVI века и остаётся действующим женским монастырём.** Основательница — царица Тинатин, супруга кахетинского царя Левана, дочь правящего дома Гурии, которая впервые увидела этот склон по пути на собственную свадьбу.


    Здешнее предание говорит, что в детстве ей приснились горный склон и куст ежевики, и она дала обет построить церковь там, где их найдёт. По дороге к венчанию она узнала место и обещание исполнила. Сна в документах, разумеется, нет, но ктиторство Тинатин засвидетельствовано, как и её погребение в церкви, которую она оплатила.


    Храм сложен из кирпича — редкость для края, где господствует камень, — и имеет крестово-купольный план с высоким узким барабаном. Внутри сохранились фрагменты росписи XVI века, включая ктиторские портреты, потемневшие от свечной копоти, но читаемые. Плита над могилой царицы лежит ближе к началу наоса.


    Ограда, трапезная и кельи появились позже и сегодня содержатся в порядке: розы, ореховые деревья и небольшой виноградник, за которым ухаживает община. Монахини пишут иконы и работают в саду, и в обычный будний день слышны только птицы и собственные шаги по гравию.


    По сравнению с Дзвели Шуамта выше по дороге здесь всё позднее, светлее и живое. Ради этого контраста и стоит посмотреть обе: их разделяют два километра и примерно тысяча лет — одна отдана лесу, другая по-прежнему держит распорядок.
  tip: >-
    Получаса достаточно. Это действующий монастырь, и правила одежды здесь именно требуют, а не рекомендуют: длинная юбка и платок для женщин, длинные брюки для мужчин. Накидки у ворот бывают, но не всегда. Съёмка внутри храма обычно запрещена, спросите прежде, чем поднимать камеру. Парковка перед оградой бесплатная. Туалет есть, кафе нет. Тихий голос и выключенный телефон здесь норма, и с теми, кто её нарушает, разговор короткий.
  route: >-
    Дорога та же, что и к Дзвели Шуамта: из Тбилиси на восток мимо Уджармы и через Гомборский перевал в сторону Телави, 88 км, около часа сорока. Асфальт на всём протяжении хороший. Поворот к монастырю слева, примерно через три километра после съезда на Дзвели Шуамта, последние двести метров — узкий, но покрытый асфальтом подъезд. Машины эконом-класса хватает. Зимой, после снегопада на перевале, зимняя резина или цепи заметно облегчают спуск.
fa:
  name: شوآمتای نو
  short: >-
    صومعهٔ فعال زنان از سدهٔ شانزدهم که بر پایهٔ نذر یک ملکه ساخته شد، دو کیلومتر دورتر از کلیساهای شوآمتای کهن.
  body: >-
    **شوآمتای نو در میانهٔ سدهٔ شانزدهم بنیاد شد و هنوز صومعه‌ای فعال برای زنان است.** بنیان‌گذارش ملکه تیناتین بود، همسر لوان پادشاه کاختی و دختر خاندان فرمانروای گوریا، که نخستین بار این دامنه را در راه رفتن به مراسم ازدواج خود دید.


    روایتی که اینجا نقل می‌شود می‌گوید در کودکی خواب دامنه‌ای کوهستانی و بوته‌ای از تمشک وحشی دید و نذر کرد هرجا آن دو را بیابد کلیسایی بسازد. در راه عروسی جای را شناخت و به نذر خود عمل کرد. خواب البته در اسناد نیست، اما بانی بودن تیناتین ثبت شده است و نیز دفن او در کلیسایی که هزینه‌اش را پرداخت.


    بنا از آجر است، که در سرزمینی با غلبهٔ سنگ کم‌نظیر است، و نقشهٔ صلیب در مربع با گریوی بلند و باریک دارد. در درون، پاره‌هایی از نقاشی سدهٔ شانزدهم مانده، از جمله تصویر بانیان، که دود شمع تیره‌شان کرده اما هنوز خواندنی‌اند. سنگ گور ملکه نزدیک ابتدای شبستان است.


    دیوار محوطه، غذاخوری و حجره‌ها بعدتر افزوده شدند و امروز مرتب نگه داشته می‌شوند: گل سرخ، درختان گردو و تاکستانی کوچک که خود جماعت آن را می‌کارد. راهبه‌ها شمایل می‌نگارند و در باغ کار می‌کنند، و در یک روز عادی هفته تنها صدای پرندگان و گام‌های خودتان روی شن شنیده می‌شود.


    در برابر شوآمتای کهن که کمی بالاتر است، اینجا همه‌چیز متأخرتر، روشن‌تر و زنده است. همین تضاد دلیل دیدن هر دو است: دو کیلومتر و حدود هزار سال فاصله؛ یکی به جنگل سپرده شده و دیگری هنوز اوقات خود را نگه می‌دارد.
  tip: >-
    نیم ساعت کافی است. اینجا صومعه‌ای فعال است و قواعد پوشش الزامی است نه توصیه: دامن بلند و روسری برای زنان و شلوار بلند برای مردان. گاه پوشش‌هایی کنار دروازه هست، اما نه همیشه. عکاسی درون کلیسا معمولاً ممنوع است، پس پیش از بالا بردن دوربین بپرسید. پارکینگ جلوی دیوار رایگان است. سرویس بهداشتی هست، کافه نه. صدای آهسته و تلفن خاموش اینجا انتظار پذیرفته‌شده‌ای است.
  route: >-
    مسیر همان راه شوآمتای کهن است: از تفلیس به شرق از کنار اوجارما و از گردنهٔ گومبوری به سوی تلاوی، 88 کیلومتر و حدود یک ساعت و چهل دقیقه. آسفالت در تمام طول راه خوب است. انحراف صومعه سمت چپ و حدود سه کیلومتر پس از دوراهی شوآمتای کهن قرار دارد و دویست متر آخر مسیری باریک اما آسفالت است. خودروی اقتصادی کافی است. در زمستان و پس از برف گردنه، لاستیک زمستانی یا زنجیر چرخ سرازیری را بسیار آسان‌تر می‌کند.
he:
  name: שואמטה החדשה
  short: >-
    מנזר נזירות פעיל מן המאה ה-16 שנוסד בעקבות נדר של מלכה, שני קילומטרים מכנסיות שואמטה העתיקה.
  body: >-
    **שואמטה החדשה נוסדה באמצע המאה ה-16 ועודנה מנזר נזירות פעיל.** מייסדת המקום היא המלכה טינטין, אשת לוואן מלך קחתי, בת בית השלטון של גוריה, שראתה את המדרון הזה לראשונה בדרכה מזרחה אל חתונתה.


    המסורת המסופרת כאן אומרת שבילדותה חלמה על מדרון הר ועל שיח פטל בר, ונדרה לבנות כנסייה במקום שבו תמצא אותם. בדרך לחופה זיהתה את המקום וקיימה את הנדר. החלום כמובן אינו במסמכים, אבל חסותה של טינטין מתועדת, וכך גם קבורתה בכנסייה שמימנה.


    המבנה בנוי לבנים, דבר חריג באזור שבו האבן שולטת, ותוכניתו צלב בתוך ריבוע עם תוף גבוה וצר. בפנים שרדו שברי ציור מן המאה ה-16 ובהם דיוקנאות התורמים, שהושחרו בפיח נרות אך עדיין קריאים. אבן הקבר של המלכה מונחת בקדמת האולם.


    חומת המתחם, חדר האוכל והתאים נוספו מאוחר יותר ומוחזקים היום היטב: ורדים, עצי אגוז וכרם קטן שהקהילה מעבדת. הנזירות מציירות איקונות ומטפלות בגן, וביום חול רגיל נשמעים רק ציפורים וצעדיכם על החצץ.


    לעומת שואמטה העתיקה במעלה הדרך, כאן הכול מאוחר יותר, בהיר יותר וחי. הניגוד הזה הוא הסיבה לראות את שתיהן: שני קילומטרים ואלף שנה מפרידים ביניהן, האחת נמסרה ליער והשנייה עדיין שומרת על סדר יומה.
  tip: >-
    חצי שעה מספיקה. זהו מנזר פעיל וכללי הלבוש נאכפים ולא רק מוצעים: חצאית ארוכה ומטפחת לנשים, מכנסיים ארוכים לגברים. לעתים יש כיסויים בשער, אך לא תמיד. צילום בתוך הכנסייה אסור בדרך כלל, אז שאלו לפני שאתם מרימים מצלמה. החניה מול החומה חינם. יש שירותים ואין בית קפה. קול שקט וטלפון מושתק הם הציפייה כאן.
  route: >-
    הגישה זהה לזו של שואמטה העתיקה: מזרחה מטביליסי דרך אוג'רמה ומעל מעבר גומבורי לכיוון טלאווי, 88 ק״מ וכשעה וארבעים. האספלט טוב לכל האורך. הפנייה למנזר משמאל, כשלושה קילומטרים אחרי הצומת לשואמטה העתיקה, ומאתיים המטרים האחרונים הם דרך צרה אך סלולה. רכב חסכוני מספיק. בחורף, אחרי שלג במעבר, צמיגי חורף או שרשראות מקלים מאוד על הירידה.
ar:
  name: شواماتا الجديدة
  short: >-
    دير راهبات عامل من القرن السادس عشر أُنشئ وفاءً بنذر ملكة، على بعد كيلومترين من كنائس شواماتا القديمة.
  body: >-
    **أُسست شواماتا الجديدة في منتصف القرن السادس عشر وما زالت ديراً عاملاً للراهبات.** مؤسسته الملكة تيناتين زوجة لِفان ملك كاخيتي، وهي من البيت الحاكم في غوريا، رأت هذا السفح أول مرة وهي في طريقها شرقاً إلى زفافها.


    والرواية المتداولة هنا أنها رأت في طفولتها منام سفحٍ جبلي وشجيرة عليق، فنذرت أن تبني كنيسة حيث تجدهما. وفي طريق العرس عرفت المكان وأوفت بالنذر. الحلم ليس في الوثائق بالطبع، أما رعايتها للبناء فمثبتة، وكذلك دفنها في الكنيسة التي أنفقت عليها.


    البناء من الآجر، وهو أمر غير مألوف في إقليم يغلب عليه الحجر، ومخططه صليب داخل مربع برقبة قبة عالية ضيقة. وفي الداخل بقايا تصوير من القرن السادس عشر منها صور الواقفين، سوّدها دخان الشموع لكنها ما تزال مقروءة. وشاهد قبر الملكة قريب من مقدمة الصحن.


    أما السور والمائدة والقلالي فجاءت لاحقاً وتُصان اليوم صيانة جيدة: ورد وأشجار جوز وكرم صغير تعمل فيه الجماعة. تكتب الراهبات الأيقونات ويعتنين بالحديقة، وفي يوم عادي لا يُسمع سوى الطير ووقع خطاك على الحصى.


    وبالمقارنة مع شواماتا القديمة أعلى الطريق، كل شيء هنا أحدث وأنور وحي. وهذا التباين هو سبب زيارة الموقعين معاً: يفصل بينهما كيلومتران وألف سنة تقريباً، إحداهما تُركت للغابة والأخرى ما زالت تحفظ مواقيتها.
  tip: >-
    نصف ساعة تكفي. هذا دير عامل وقواعد اللباس تُطبق لا تُقترح: تنورة طويلة وغطاء رأس للنساء، وسروال طويل للرجال. وقد تجد أغطية عند البوابة، لكن ليس دائماً. والتصوير داخل الكنيسة ممنوع عادة، فاسأل قبل أن ترفع الكاميرا. الوقوف أمام السور مجاني. توجد دورات مياه ولا يوجد مقهى. وخفض الصوت وإسكات الهاتف أمر متوقع هنا.
  route: >-
    الطريق نفسه المؤدي إلى شواماتا القديمة: شرقاً من تبليسي بمحاذاة أوجارما وعبر ممر غومبوري نحو تيلافي، 88 كم ونحو ساعة وأربعين دقيقة. الإسفلت جيد على امتداده. منعطف الدير على اليسار بعد نحو ثلاثة كيلومترات من مفرق شواماتا القديمة، وآخر مئتي متر ممر ضيق لكنه معبّد. سيارة اقتصادية تكفي. وفي الشتاء بعد تساقط الثلج على الممر، تسهّل إطارات الشتاء أو السلاسل النزول كثيراً.
