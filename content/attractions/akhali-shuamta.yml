ka:
  name: ახალი შუამთა
  short: >-
    მონასტერი, რომელიც დედოფალმა მეფესთან განშორების შემდეგ ააშენა: XVI საუკუნის აგურის ტაძარი და ბაგრატიონთა
    უძველესი გერბი მის საფლავის ქვაზე.
  body: >-
    **დედოფალმა, რომელმაც მეფე მიატოვა, ეს მონასტერი თავისთვის ააშენა და ანდერძად დატოვა, აქვე დაეკრძალათ
    — მისგან შორს.**


    თინათინი, გურიის მთავრის, მამია I გურიელის ასული, დაახლოებით 1520 წელს კახეთის მეფე ლევანს მიათხოვეს
    — ამ ქორწინებით სამხედრო კავშირი განამტკიცეს. XVIII საუკუნის ისტორიკოსი ვახუშტი ბატონიშვილი მის სიზმარს
    გადმოგვცემს: თინათინს დიდგვაროვანი ქმარი ელოდა, საქმროს სახლისკენ მიმავალს კი გორაზე თეთრი შინდი უნდა
    ენახა და იქ ღვთისმშობლის სახელზე მონასტერი აეშენებინა. გადმოცემით, შუამთასთან მან სწორედ ის ხე იცნო
    და აღთქმა დადო; ქორწილი კი გრემში გადაიხადეს.


    ქორწინებამ ვერ გაძლო. მემატიანეები ლევანის ქალთმოყვარეობას არ მალავენ, და 1529 წელს თინათინმა განქორწინება
    ითხოვა და მიიღო კიდეც. იგი თავისი ნებითა და მზითვით აგებულ მონასტერში დაემკვიდრა — „ახალ“ შუამთაში,
    ზემოთ, ტყეში მიტოვებული ძველი ეკლესიებისგან განსასხვავებლად — და აქვე აღესრულა 1591 წელს. ლევანმა
    მათი შვილები უარყო, ტახტზე მაინც თინათინის ვაჟი, ალექსანდრე II, ავიდა.


    ეკლესია აგურისაა, ჯვარგუმბათოვანი, შიგნით მოხატული, კედლებზე ქტიტორთა პორტრეტებით. მოძებნეთ დედოფლის
    საფლავის ქვა: მასზე ბაგრატიონთა გერბის უძველესი შემორჩენილი გამოსახულებაა ამოკვეთილი — ფარზე უფლის
    უნაკერო კვართი, ყალყზე შემდგარი ორი ლომი, გვირგვინი, ქნარი და შურდული კი დავით მეფეზე მიანიშნებს,
    რომლისგანაც ეს სახლი თავის წარმომავლობას ითვლიდა.


    საბჭოთა წლებში მონასტერი დადუმდა, შემდეგ კი ისევ გაცოცხლდა. მანამდე კი, 1842 წელს, აქ ანდრია მრევლიშვილი
    ჩამოვიდა და არქიმანდრიტ სოფრონისგან კახური გალობის ნიმუშები ნოტებზე ჩაიწერა.


    თინათინმა თავად აირჩია თავისი მიწაც და თავისი გარემოცვაც — და ხუთი საუკუნის შემდეგაც ეს არჩევანი ძალაშია.
  tip: >-
    ოცდაათიდან ორმოცდახუთ წუთამდე საკმარისია. ეს მოქმედი დედათა მონასტერია და ჩაცმის წესი მკაცრად მოწმდება:
    ქალებს — გრძელი კაბა და თავსაფარი, მამაკაცებს — გრძელი შარვალი. კართან გადასაფარებელი ზოგჯერ დევს,
    მაგრამ საკუთარი იქონიეთ. ეკლესიაში რამის გადაღებამდე ნებართვა ითხოვეთ და ხმადაბლა ილაპარაკეთ — წირვა-ლოცვა
    სტუმრებზე წინ დგას. თავაზიანად სთხოვეთ რომელიმე მონაზონს, თინათინის საფლავის ქვა გაჩვენოთ — ჩუქურთმა
    ადვილი შესამჩნევი არ არის. კაფე აქ არ არის, წყალი თელავიდან წამოიღეთ. ძველი შუამთა იმავე გზაზე, ორი
    წუთის სავალზეა ზემოთ, და ორივეს ერთად აუჩქარებლად ერთი საათი ეყოფა.
  route: >-
    თბილისიდან გადით კახეთის გზატკეცილზე (ს5) და დაახლოებით 20 კილომეტრში, ვაზიანთან, გადაუხვიეთ შ38-ზე
    — უჯარმის, გომბორის უღელტეხილისა და თელავის მიმართულებით. უღელტეხილის შემდეგ გზა ტყეში კლაკნილად ეშვება;
    თბილისიდან დაახლოებით 85-ე კილომეტრზე, თელავამდე რვაოდე კილომეტრით ადრე, შუამთის მაჩვენებლით მკვეთრად
    მარჯვნივ შ178 უხვევს, იქიდან მონასტრის კარიბჭემდე დაახლოებით 600 მეტრია. გზას საათნახევარს ან ცოტა
    მეტს მოანდომებთ. მთავარი გზა ასფალტიანია, შესახვევი ვიწროა, მაგრამ მოკლე. ეკონომ-კლასის მანქანა საკმარისია,
    თუმცა უღელტეხილზე თოვლის შემდეგ ზამთრის საბურავები დაღმართს ბევრად გაგიადვილებთ. საწვავი თბილისში
    ან თელავში ჩაასხით.
en:
  name: Akhali Shuamta
  short: >-
    The convent a queen built after leaving her king: a 16th-century brick church, and on her tombstone
    the oldest surviving Bagrationi coat of arms.
  body: >-
    **A queen who left her king built this convent, and asked to be buried here — far from him.**


    Tinatin, daughter of Mamia I Gurieli, prince of Guria, came east around 1520 to marry King Levan of
    Kakheti, a match that sealed a military alliance. The 18th-century historian Prince Vakhushti records
    her dream: a noble husband awaited her, and on the road to his house she would see a white dogwood
    on a hill, where she was to build a monastery to the Mother of God. At Shuamta, the story goes, she
    saw the tree and made her vow; the wedding followed at Gremi.


    The marriage did not hold. The chronicles call Levan "a lover of whoring and fornication", and in
    1529 Tinatin asked for a divorce and was granted it. She withdrew to the convent raised at her wish
    and on her dowry — the "new" Shuamta, as against the abandoned churches further up the hill — and
    lived there until her death in 1591. Levan disowned their children; her son took the throne all the
    same, as Alexander II.


    The church is brick and cross-domed, its walls painted, with portraits of its donors. Look for her
    gravestone: carved on it is the earliest surviving coat of arms of the Bagrationi dynasty — Christ's
    seamless robe on the shield, two rampant lions, a crown, and a harp and a sling for King David, from
    whom the family claimed descent.


    The convent fell silent under Soviet rule and has lived again since. Long before that, in 1842, Andria
    Mrevlishvili came here to write down in musical notation the Kakhetian chant sung by Archimandrite
    Sopron.


    Tinatin chose her own ground and her own company, and five centuries on the arrangement holds.
  tip: >-
    Thirty to forty-five minutes is enough. This is a working convent and the dress code is enforced:
    a long skirt and headscarf for women, long trousers for men. Wraps are sometimes available at the
    gate, but bring your own. Ask before photographing anything inside the church, and keep your voice
    low — services come before visitors. Ask one of the nuns, politely, to point out Tinatin's gravestone;
    the carving is easy to miss. There is no café, so bring water from Telavi. Dzveli Shuamta is two minutes
    further up the same lane, and the pair make one unhurried hour.
  route: >-
    Leave Tbilisi on the S5 Kakheti highway and, about 20 km out near Vaziani, branch onto the Sh38 for
    Ujarma, the Gombori Pass and Telavi. After the pass the road winds down through forest; some 85 km
    from Tbilisi, roughly 8 km short of Telavi, a sharp right onto the Sh178 is signed for Shuamta, and
    the convent gate comes after about 600 m. Allow an hour and a half or a little more. The main road
    is asphalt; the side lane is narrow but short. An economy car is fine, though after snow on the pass
    winter tyres make the descent far easier. Fill up in Tbilisi or Telavi.
ru:
  name: Ахали-Шуамта
  short: >-
    Монастырь, который царица построила, покинув своего царя: кирпичная церковь XVI века и на её надгробии
    — древнейший из сохранившихся гербов Багратионов.
  body: >-
    **Царица, оставившая своего царя, построила этот монастырь и попросила похоронить её здесь — далеко
    от него.**


    Тинатин, дочь Мамии I Гуриели, князя Гурии, приехала на восток около 1520 года, чтобы выйти замуж
    за царя Левана Кахетинского, — брак, скрепивший военный союз. Историк XVIII века князь Вахушти записал
    её сон: благородный супруг ждёт её, и на дороге к его дому она увидит белый кизил на холме, где ей
    надлежит построить монастырь Богородице. В Шуамте, по преданию, она увидела это дерево и дала обет;
    свадьбу сыграли в Греми.


    Брак не сложился. Летописи называют Левана «любителем распутства и блуда», и в 1529 году Тинатин попросила
    развод и получила его. Она удалилась в монастырь, возведённый по её воле и на её приданое, — «новую»
    Шуамту, в отличие от заброшенных храмов выше по склону, — и жила там до своей смерти в 1591 году.
    Леван отрёкся от их детей; её сын всё же занял престол под именем Александра II.


    Церковь кирпичная, крестово-купольная, стены расписаны, с портретами ктиторов. Найдите её надгробие:
    на нём вырезан древнейший из сохранившихся гербов династии Багратионов — нешвенный хитон Христа на
    щите, два вздыбленных льва, корона, а также арфа и праща царя Давида, от которого род вёл свою родословную.


    При советской власти монастырь умолк, а ныне снова живёт. Задолго до этого, в 1842 году, сюда приезжал
    Андриа Мревлишвили, чтобы записать нотами кахетинское песнопение, которое пел архимандрит Софрон.


    Тинатин сама выбрала и землю, и окружение — и спустя пять веков этот выбор всё ещё в силе.
  tip: >-
    Тридцати-сорока пяти минут достаточно. Это действующий монастырь, и дресс-код здесь строго соблюдается:
    длинная юбка и платок для женщин, длинные брюки для мужчин. У ворот иногда есть накидки, но лучше
    взять свою. Спрашивайте разрешения, прежде чем снимать что-либо внутри церкви, и говорите тише — служба
    важнее посетителей. Вежливо попросите одну из монахинь показать надгробие Тинатин — резьбу легко пропустить.
    Кафе здесь нет, так что запаситесь водой в Телави. Дзвели-Шуамта — в двух минутах выше по той же дороге;
    на оба монастыря без спешки уйдёт час.
  route: >-
    Выезжайте из Тбилиси по Кахетинскому шоссе S5 и примерно через 20 км, у Вазиани, сверните на Sh38
    — на Уджарму, Гомборский перевал и Телави. За перевалом дорога вьётся вниз через лес; примерно на
    85-м км от Тбилиси, за 8 км до Телави, указатель на Шуамту велит резко повернуть направо на Sh178;
    ворота монастыря — примерно через 600 м. На дорогу уйдёт полтора часа или немного больше. Главная
    дорога асфальтирована; боковая узкая, но короткая. Машина эконом-класса подойдёт, хотя после снега
    на перевале зимняя резина заметно облегчает спуск. Заправьтесь в Тбилиси или Телави.
fa:
  name: آخالی شوآمتا
  short: >-
    صومعه‌ای که ملکه‌ای پس از ترک شاهش بنا نهاد: کلیسایی آجری از سده‌ی شانزدهم، و بر سنگ گور ملکه کهن‌ترین
    نشان بازمانده‌ی خاندان باگراتیونی.
  body: >-
    **ملکه‌ای که شاه خود را ترک کرد این صومعه را بنا نهاد و خواست تا دور از او، در همین‌جا، به خاک سپرده
    شود.**


    تیناتین، دخترِ مامیا یکم گورییِلی، امیر گوریا، در حدود سال ۱۵۲۰ به خاور آمد تا با لوان، پادشاه کاختی،
    ازدواج کند — پیوندی که اتحادی نظامی را مهر می‌زد. شاهزاده واخوشتی، تاریخ‌نگار سده‌ی هجدهم، رؤیای او
    را چنین ثبت می‌کند: شوهری نجیب در انتظارش بود، و در راه به خانه‌ی او درخت زغال‌اخته‌ای سفید بر تپه‌ای
    می‌دید که می‌بایست در آن‌جا صومعه‌ای برای مادرِ خدا بنا کند. به‌گفته‌ی روایت، در شوآمتا آن درخت را
    دید و نذر خود را بست؛ عروسی در گرمی برگزار شد.


    اما این ازدواج پایدار نماند. وقایع‌نامه‌ها لوان را «دوستدارِ هرزگی و فحشا» می‌خوانند، و در سال ۱۵۲۹
    تیناتین طلاق خواست و خواسته‌اش پذیرفته شد. او در صومعه‌ای که به خواست خود و با جهیزیه‌اش برپا شده
    بود گوشه گزید — شوآمتای «نو»، در برابر کلیساهای متروکِ بالای تپه — و تا هنگام مرگش در سال ۱۵۹۱ همان‌جا
    زیست. لوان فرزندانشان را از خود راند؛ با این همه، پسرش با نام الکساندر دوم به تخت نشست.


    کلیسا آجری و صلیبی-گنبددار است، دیوارهایش نگاره‌پردازی شده و پرتره‌ی بانیانش را در خود دارد. سنگ گورش
    را بجویید: بر آن کهن‌ترین نشان بازمانده‌ی خاندان باگراتیونی تراشیده شده — ردای بی‌دوزِ مسیح بر سپر،
    دو شیرِ بر دو پا برخاسته، تاجی، و چنگ و فلاخنِ داوود پادشاه، که خاندان نسب خود را از او می‌دانست.


    صومعه در دوران شوروی خاموش شد و پس از آن دوباره جان گرفت. مدت‌ها پیش از آن، در سال ۱۸۴۲، آندریا مرِولی‌شویلی
    به این‌جا آمد تا سرودهای نیایشی کاختی را که آرشیماندریت سوپرون می‌خواند، به نت درآورد.


    تیناتین زمین خود و همنشینیِ خود را برگزید، و پس از پنج سده، آن گزینش هنوز پایدار است.
  tip: >-
    سی تا چهل‌وپنج دقیقه کافی است. این صومعه‌ای فعال است و آیین‌نامه‌ی پوشش در آن جدی گرفته می‌شود: دامنی
    بلند و روسری برای زنان، شلوار بلند برای مردان. گاهی روپوش کنارِ دروازه موجود است، اما بهتر است خودتان
    بیاورید. پیش از عکس‌گرفتن از هر چیز درون کلیسا اجازه بخواهید، و آهسته سخن بگویید — عبادت بر بازدید
    تقدم دارد. با ادب از یکی از راهبه‌ها بخواهید سنگ گور تیناتین را نشانتان دهد؛ نقشِ آن به‌آسانی از چشم
    دور می‌ماند. کافه‌ای این‌جا نیست، پس آب را از تلاوی بیاورید. دزولی شوآمتا دو دقیقه بالاتر در همان
    راه است، و این دو با هم یک ساعتِ بی‌شتاب می‌سازند.
  route: >-
    از تفلیس در بزرگراه کاختی S5 حرکت کنید و پس از حدود ۲۰ کیلومتر، نزدیک وازیانی، به Sh38 به‌سوی اوجارما،
    گذرگاه گومبوری و تلاوی بپیچید. پس از گذرگاه، راه از میان جنگل سرازیر می‌شود؛ در حدود کیلومتر ۸۵ از
    تفلیس، تقریباً ۸ کیلومتر پیش از تلاوی، تابلوی شوآمتا شما را به پیچی تند به راست، به جاده‌ی Sh178،
    می‌خواند و دروازه‌ی صومعه حدود ۶۰۰ متر جلوتر است. یک ساعت و نیم یا اندکی بیشتر زمان لازم است. راه
    اصلی آسفالته است؛ راه فرعی تنگ اما کوتاه است. خودروی اقتصادی کافی است، هرچند پس از برف بر گذرگاه،
    تایر زمستانی سرازیری را بسیار آسان‌تر می‌کند. در تفلیس یا تلاوی باک را پر کنید.
he:
  name: אחאלי שואמטה
  short: >-
    המנזר שבנתה מלכה לאחר שעזבה את בעלה המלך: כנסייה מלבנים מהמאה השש-עשרה, ועל מצבתה חרוט סמל השושלת
    הבגרטיונית העתיק ביותר ששרד.
  body: >-
    **מלכה שעזבה את בעלה המלך בנתה מנזר זה, וביקשה להיקבר בו — הרחק ממנו.**


    תינאטין, בתו של מאמיה הראשון גוריאלי, נסיך גוריה, הגיעה מזרחה בסביבות 1520 להינשא למלך לוואן מקאחתי,
    שידוך שחתם ברית צבאית. הנסיך וחושטי, ההיסטוריון מהמאה השמונה-עשרה, מתעד את חלומה: בעל נעלה ציפה לה,
    ובדרך לביתו תראה עץ קרנית לבן על גבעה, ושם עליה להקים מנזר לאם האלוהים. בשואמטה, כך מספרים, ראתה את
    העץ ונדרה את נדרה; החתונה נערכה בגרמי.


    הנישואים לא החזיקו מעמד. הכרוניקות מכנות את לוואן 'אוהב זנות ופריצות', וב-1529 תינאטין ביקשה גירושין
    וקיבלה אותם. היא פרשה למנזר שהוקם לפי רצונה ועל חשבון נדוניתה — שואמטה ה'חדשה', בניגוד לכנסיות הנטושות
    גבוה יותר במעלה הגבעה — וחייתה בו עד מותה ב-1591. לוואן התכחש לילדיהם; ובכל זאת בנה עלה לכס המלוכה,
    בשם אלכסנדר השני.


    הכנסייה בנויה לבנים בתכנית צלב-כיפה, קירותיה מצוירים ונושאים דיוקנאות מייסדיה. חפשו את מצבתה: עליה
    מגולף סמל השושלת הבגרטיונית העתיק ביותר ששרד — על המגן כותונתו חסרת התפרים של ישו, שני אריות זקופים,
    כתר, ונבל וקלע של דוד המלך, שהשושלת ייחסה את מוצאה אליו.


    המנזר השתתק בתקופה הסובייטית, ומאז שב לחיים. הרבה לפני כן, ב-1842, הגיע לכאן אנדריא מרבלישווילי כדי
    לרשום בתווים את הזמרה הליטורגית הקאחתית בביצוע הארכימנדריט סופרון.


    תינאטין בחרה בעצמה את אדמתה ואת חברתה, וחמש מאות שנה אחר כך הבחירה הזאת עדיין בתוקף.
  tip: >-
    שלושים עד ארבעים וחמש דקות מספיקות. זהו מנזר נשים פעיל, וקוד הלבוש נשמר בקפדנות: חצאית ארוכה וכיסוי
    ראש לנשים, מכנסיים ארוכים לגברים. לעיתים יש בגדי כיסוי בשער, אך מומלץ להביא משלכם. בקשו רשות לפני
    צילום כל דבר בפנים הכנסייה, ושמרו על קול נמוך — התפילות קודמות למבקרים. בקשו באדיבות מאחת הנזירות
    שתראה לכם את מצבת תינאטין; קל להחמיץ את החריטה. אין כאן בית קפה, אז הביאו מים מטלאווי. דזוולי שואמטה
    נמצאת שתי דקות במעלה אותה דרך, ושתיהן יחד ממלאות שעה נינוחה.
  route: >-
    צאו מטביליסי בכביש קאחתי S5, ואחרי כ-20 ק"מ, סמוך לוואזיאני, פנו לכביש Sh38 לכיוון אוג'רמה, מעבר גומבורי
    וטלאווי. אחרי המעבר הכביש מתפתל למטה בין העצים; בסביבות הקילומטר ה-85 מטביליסי, כ-8 ק"מ לפני טלאווי,
    פנייה חדה ימינה לכביש Sh178 מסומנת לשואמטה, ושער המנזר נמצא כ-600 מטר משם. הקצו שעה וחצי או קצת יותר.
    הכביש הראשי סלול; הדרך הצדדית צרה אך קצרה. רכב חסכוני מתאים, אף שאחרי שלג על המעבר צמיגי חורף מקלים
    מאוד על הירידה. תדלקו בטביליסי או בטלאווי.
ar:
  name: آخالي شوامتا
  short: >-
    الدير الذي بنته ملكة بعد ترك زوجها الملك: كنيسة من الآجر من القرن السادس عشر، وعلى شاهد قبرها أقدم
    شعار نبالة باقٍ لأسرة باغراتيوني.
  body: >-
    **بَنَت ملكةٌ تركت ملكها هذا الدير، وطلبت أن تُدفن فيه — بعيدًا عنه.**


    قدِمت تيناتين، ابنة ماميا الأول غورييلي، أمير غوريا، شرقًا نحو عام 1520 للزواج من الملك ليفان الكاختي،
    في زواجٍ ختم تحالفًا عسكريًا. يسجّل الأمير فاخوشتي، المؤرخ في القرن الثامن عشر، حلمها: زوجٌ نبيل كان
    يترقبها، وفي الطريق إلى بيته كانت سترى شجرة قرانيا بيضاء على تلة، وهناك عليها أن تبني ديرًا لأم الإله.
    وفي شوامتا، تقول الرواية، رأت الشجرة وقطعت نذرها؛ وأُقيم العرس في غريمي.


    لكن الزواج لم يدُم. تصف السجلات ليفان بأنه «محبّ للفجور والزنى»، وفي عام 1529 طلبت تيناتين الطلاق
    فمُنحته. فانسحبت إلى الدير المُشاد بمشيئتها ومن مهرها — شوامتا «الجديدة»، في مقابل الكنائس المتروكة
    أعلى التل — وعاشت فيه حتى وفاتها عام 1591. تبرّأ ليفان من أبنائهما؛ ومع ذلك تولّى ابنها العرش، باسم
    ألكسندر الثاني.


    الكنيسة من الآجر وذات مخطط صليبي مقبب، جدرانها مرسومة وتحمل صور واهبيها. ابحث عن شاهد قبرها: منقوش
    عليه أقدم شعار نبالة باقٍ لأسرة باغراتيوني — ثوب المسيح غير المُخاط على الترس، وأسدان قائمان، وتاج،
    وقيثارة ومقلاع الملك داود، الذي زعمت الأسرة أنها تنحدر منه.


    صمت الدير في العهد السوفييتي، ثم عاد إلى الحياة. وقبل ذلك بكثير، في عام 1842، أتى أندريا مريفليشفيلي
    إلى هنا ليدوّن بالنوتة الموسيقية الترانيم الكاختية التي كان يرتّلها الأرشمندريت سوفرون.


    اختارت تيناتين أرضها ورفقتها، وبعد خمسة قرون لا يزال هذا الاختيار قائمًا.
  tip: >-
    تكفي ثلاثون إلى خمسٍ وأربعين دقيقة. هذا دير راهبات عامر ويُطبَّق فيه قانون اللباس بصرامة: تنورة طويلة
    وغطاء رأس للنساء، وسروال طويل للرجال. تتوفر أحيانًا أوشحة عند البوابة، لكن يُفضَّل حمل وشاحك الخاص.
    اطلب الإذن قبل تصوير أي شيء داخل الكنيسة، وتحدّث بصوت خفيض — فالصلوات تُقدَّم على الزوار. اطلب بلطف
    من إحدى الراهبات أن تُشير إلى شاهد قبر تيناتين؛ فالنقش يسهل أن يفوتك. لا يوجد مقهى هنا، فاحمل الماء
    من تيلافي. تقع دزفيلي شوامتا على بُعد دقيقتين أعلى الطريق نفسه، وتملأ الزيارتان معًا ساعة واحدة على
    مهل.
  route: >-
    اخرج من تبليسي على طريق كاختي السريع S5، وبعد نحو 20 كم قرب فازياني، انحرف إلى Sh38 نحو أوجارما وممر
    غومبوري وتيلافي. بعد الممر ينحدر الطريق متعرجًا عبر الغابة؛ عند الكيلومتر 85 تقريبًا من تبليسي، وقبل
    تيلافي بنحو 8 كم، ستجد منعطفًا حادًا إلى اليمين على الطريق Sh178 تدلّ عليه لافتة شوامتا، وتبلغ بوابة
    الدير بعد نحو 600 متر. احسب ساعةً ونصفًا أو أكثر بقليل. الطريق الرئيسي معبّد؛ والطريق الفرعي ضيق لكنه
    قصير. تصلح سيارة اقتصادية، وإن كانت إطارات الشتاء تجعل النزول أسهل كثيرًا بعد الثلوج على الممر. عبّئ
    الوقود في تبليسي أو تيلافي.
