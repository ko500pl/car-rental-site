ka:
  name: საკაჟიას მღვიმე
  short: >-
    წყალწითელას ხეობის პატარა, მშრალი მღვიმე — ამიერკავკასიაში აღმოჩენილი პირველი პალეოლითური ძეგლი, სადაც
    ნეანდერტალელის ნაშთებიც იპოვეს.
  body: >-
    **1914 წელს მდინარე წყალწითელას თავზე, კირქვის კლდის მოკრძალებულ ღრმულში ამიერკავკასიის პირველი პალეოლითური
    ძეგლი აღმოაჩინეს.**


    საკაჟია სანახაობრივი მღვიმე არ არის. ეს მშრალი კარსტული ღრუა — დაახლოებით 35 მეტრი სიგრძისა და 20
    მეტრი სიღრმის, — წყალწითელას ხეობის მარცხენა კალთაზე, სოფელ გოდოგნიდან ჩრდილო-აღმოსავლეთით 1,5 კილომეტრზე;
    მოწამეთას მონასტერი კი დაახლოებით 1,5 კილომეტრშია. აქ არც სტალაქტიტებია და არც ფერადი განათება. მთავარი
    იატაკში იმალებოდა.


    პირველი მიგნებები რუდოლფ შმიდტსა და ლეონ კოზლოვსკის ეკუთვნის; გარკვეული ხნით მღვიმეს გერმანელი მეცნიერის,
    რუდოლფ ვირხოვის სახელიც კი ერქვა. 1936 წელს გათხრები განახლდა და ახალ აღმოჩენებთან ერთად ძველი, ქართული
    სახელიც დაბრუნდა. ყველაზე ნაყოფიერი 1973 წლის სეზონი გამოდგა: ზედაპალეოლითური ფენის ქვეშ, დაახლოებით
    1,5 მეტრის სიღრმეზე, მუსტიეური ფენები გამოჩნდა — ლევალუაზური ტექნიკით დამუშავებული ქვის ნუკლეუსები,
    წვეტანები, სახოკები და დანები, ნეანდერტალელის ზედა ყბის ნატეხი და კბილები. ზედა ფენებში კი კაჟისა
    და ობსიდიანის იარაღი, ძვლის სადგისები და შუბისპირები, ირმის რქისგან გამოთლილი თოხისმაგვარი საჩიჩქნი
    და კრომანიონელის თავის ქალის ფრაგმენტები იდო.


    ადამიანების გვერდით გამყინვარების ხანის მთელი ცხოველთა სამყარო აღმოჩნდა: მღვიმის დათვი და მღვიმის
    ლომი, მარტორქა, ბიზონი, ცხენი, კეთილშობილი ირემი, ფოცხვერი — ძვლებისა და კბილების ათეულ ათასობით ნატეხი.
    კოლექციები დღეს სანქტ-პეტერბურგსა და თბილისში, სიმონ ჯანაშიას სახელობის საქართველოს მუზეუმშია დაცული,
    მღვიმე კი 2007 წლიდან ბუნების ძეგლია.


    ამიტომ აქ სანახაობისთვის კი არ მოდიან — ადგილისთვის მოდიან. მღვიმის პირას დადექით და ქვემოთ მდინარეს
    გადახედეთ: წყალწითელა იმიტომ ჰქვია, რომ რკინით მდიდარ თიხებს რეცხავს და მოწითალო ფერს იღებს. ხეობის
    ამ მოსახვევს ადამიანები ათეულ ათასობით წლით ადრე უყურებდნენ, ვიდრე მოწამეთაში პირველ ქვას დადებდნენ.
  tip: >-
    საკაჟია დაცული ბუნების ძეგლია და არა მოწყობილი ტურისტული მღვიმე: განათება, ბილიკი და სალარო აქ დადასტურებული
    არ არის, ამიტომ შესაძლო საფასური და დათვალიერების წესი ადგილზე გაარკვიეთ. თან იქონიეთ ფანარი და მოხერხებული
    ფეხსაცმელი — მღვიმე მშრალია, მაგრამ იატაკი უსწორმასწორო. ნურაფერს ამოთხრით და ნურაფერს წაიღებთ: ეს
    არქეოლოგიური ძეგლია. თავად მღვიმეს ნახევარი საათი ეყოფა, ამიტომ დღე მოწამეთასა და გელათთან ერთად დაგეგმეთ;
    მონასტრებში მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ. საპირფარეშო და
    კვება ქუთაისშია. დაბალ სიმაღლეზე მდებარე მშრალ მღვიმეს ნებისმიერ სეზონში ესტუმრებით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ გორის, ხაშურისა და რიკოთის გადასასვლელის გავლით ქუთაისის
    აღმოსავლეთ გარეუბნამდე იარეთ — დაახლოებით 205 კილომეტრი ასფალტი. იქიდან მოწამეთასა და გოდოგნისკენ
    მიმავალ გზას გაჰყევით. მოწამეთამდე გზა მოასფალტებული და კარგია; ბოლო მონაკვეთი, ორ კილომეტრზე ნაკლები,
    მოუასფალტებელი სოფლის შარაა, მღვიმის პირამდე კი ფერდობზე ცოტა ფეხით უნდა აიაროთ. სულ დაახლოებით 224
    კილომეტრი და 3 საათი და 10 წუთი. საწვავი ქუთაისში ჩაასხით. ეკონომკლასის მანქანა სავსებით საკმარისია:
    ხრეშიანი მონაკვეთი მოკლეა და მაღალ კლირენსს არ მოითხოვს. მანქანა გოდოგანში ან მოწამეთასთან დატოვეთ.
en:
  name: Sakazhia Cave
  short: >-
    A small dry cave above the Tskaltsitela gorge: the first Palaeolithic site found in Transcaucasia,
    where Neanderthal remains came to light.
  body: >-
    **In 1914, in a modest hole in the limestone above the Tskaltsitela river, researchers found the first
    Palaeolithic site ever identified in Transcaucasia.**


    Sakazhia is not a show cave. It is a dry karst chamber, about 35 metres long and 20 metres deep, on
    the left slope of the gorge 1.5 km north-east of Godogani village; Motsameta Monastery stands about
    1.5 km away. There are no stalactites and no coloured lights. What mattered here lay in the floor.


    Rudolf Schmidt and Leon Kozlowski made the first finds, and for a time the cave even bore the name
    of the German scientist Rudolf Virchow. When digging resumed in 1936, the old Georgian name came back
    along with the new discoveries. The richest season was 1973. Beneath the Upper Palaeolithic layer,
    about 1.5 metres down, lay Mousterian levels: Levallois stone cores, points, scrapers and knives,
    and a fragment of a Neanderthal upper jaw with its teeth. Higher up were tools of flint and obsidian,
    bone awls and spear points, a hoe-like digging tool of red-deer antler, and fragments of a Cro-Magnon
    skull.


    Around the people lay a whole Ice Age bestiary: cave bear and cave lion, rhinoceros, bison, horse,
    red deer, lynx — tens of thousands of bone and tooth fragments in all. The collections are now in
    St Petersburg and at the Simon Janashia Museum of Georgia in Tbilisi, and the cave has been a protected
    Natural Monument since 2007.


    So you come here not for a spectacle but for a vantage point. Stand at the mouth and look down at
    the river: it is called Tskaltsitela, 'red water', because it washes iron-rich clays and runs faintly
    rust-coloured. People were watching this bend of the gorge tens of thousands of years before anyone
    laid the first stone at Motsameta.
  tip: >-
    Sakazhia is a protected Natural Monument, not a developed show cave: lighting, paths and a ticket
    office are not confirmed, so check any fee and access rules locally. Bring a torch and sensible shoes
    — the cave is dry but the floor is uneven. Dig nothing and take nothing; this is an archaeological
    site. The cave itself needs half an hour, so build the day around Motsameta and Gelati; at the monasteries,
    cover shoulders and knees, and women will need a headscarf. Toilets and food are in Kutaisi. Low and
    dry, the cave can be visited in any season.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri, over the Rikoti Pass, to the eastern outskirts
    of Kutaisi — about 205 km of highway. From there follow the road towards Motsameta and Godogani. It
    is paved and good as far as Motsameta; the last stretch, under 2 km, is an unpaved village lane, and
    a short walk up the slope brings you to the cave mouth. In all, about 224 km and 3 hours 10 minutes.
    Fill up in Kutaisi. An economy car is perfectly adequate: the gravel section is short and needs no
    extra clearance. Park in Godogani or near Motsameta.
ru:
  name: Пещера Сакажия
  short: >-
    Небольшая сухая пещера над ущельем Цкалцитела — первая палеолитическая стоянка, открытая в Закавказье;
    здесь нашли останки неандертальца.
  body: >-
    **В 1914 году в скромной расщелине в известняке над рекой Цкалцитела исследователи нашли первую палеолитическую
    стоянку, когда-либо обнаруженную в Закавказье.**


    Сакажия — не экскурсионная пещера. Это сухой карстовый грот длиной около 35 метров и глубиной около
    20 на левом склоне ущелья, в 1,5 км к северо-востоку от села Годогани; примерно в 1,5 км от неё стоит
    монастырь Моцамета. Здесь нет ни сталактитов, ни цветной подсветки. Главное таилось под ногами.


    Первые находки сделали Рудольф Шмидт и Леон Козловский, и какое-то время пещера даже носила имя немецкого
    учёного Рудольфа Вирхова. Когда в 1936 году раскопки возобновились, вместе с новыми открытиями вернулось
    и старое грузинское название. Самым богатым оказался сезон 1973 года. Под верхнепалеолитическим слоем,
    на глубине около 1,5 метра, залегали мустьерские горизонты: леваллуазские нуклеусы, остроконечники,
    скребла и ножи, а также фрагмент верхней челюсти неандертальца с зубами. Выше лежали орудия из кремня
    и обсидиана, костяные шилья и наконечники копий, мотыгообразное орудие из рога благородного оленя
    и фрагменты черепа кроманьонца.


    Людей окружал целый бестиарий ледниковой эпохи: пещерный медведь и пещерный лев, носорог, бизон, лошадь,
    благородный олень, рысь — всего десятки тысяч фрагментов костей и зубов. Коллекции хранятся сейчас
    в Санкт-Петербурге и в Музее Грузии имени Симона Джанашиа в Тбилиси, а с 2007 года пещера охраняется
    как памятник природы.


    Так что едут сюда не за зрелищем, а за точкой обзора. Встаньте у входа и посмотрите вниз, на реку:
    её зовут Цкалцитела, «красная вода», потому что она размывает богатые железом глины и течёт с едва
    заметным ржавым оттенком. Люди смотрели на этот изгиб ущелья за десятки тысяч лет до того, как кто-то
    заложил первый камень Моцаметы.
  tip: >-
    Сакажия — охраняемый памятник природы, а не обустроенная экскурсионная пещера: есть ли освещение,
    дорожки и касса, не подтверждено, так что о плате и правилах посещения узнавайте на месте. Возьмите
    фонарик и удобную обувь — в пещере сухо, но пол неровный. Ничего не копайте и ничего не уносите: это
    археологический памятник. На саму пещеру хватит получаса, так что стройте день вокруг Моцаметы и Гелати;
    в монастырях плечи и колени должны быть закрыты, женщинам понадобится платок. Туалеты и еда — в Кутаиси.
    Пещера невысоко и в ней сухо, так что приезжать можно в любое время года.
  route: >-
    Из Тбилиси по S1 (E60) на запад мимо Гори и Хашури, через Рикотский перевал, до восточной окраины
    Кутаиси — около 205 км по трассе. Оттуда следуйте по дороге на Моцамету и Годогани. До Моцаметы она
    асфальтирована и в хорошем состоянии; последний отрезок, меньше 2 км, — грунтовая сельская дорога,
    а короткий подъём пешком по склону приведёт к входу в пещеру. Всего около 224 км и 3 часа 10 минут.
    Заправьтесь в Кутаиси. Автомобиля эконом-класса вполне достаточно: гравийный участок короткий и не
    требует большого клиренса. Паркуйтесь в Годогани или у Моцаметы.
fa:
  name: غار ساکاژیا
  short: >-
    غاری کوچک و خشک بالای تنگهٔ تسکالتسیتلا: نخستین محوطهٔ پارینه‌سنگی کشف‌شده در ماورای قفقاز، که بقایای
    نئاندرتال در آن پیدا شد.
  body: >-
    **در سال ۱۹۱۴، در شکافی کوچک و بی‌ادعا در سنگ آهک بالای رود تسکالتسیتلا، پژوهشگران نخستین محوطهٔ پارینه‌سنگی
    را یافتند که تا آن زمان در ماورای قفقاز شناسایی شده بود.**


    ساکاژیا غاری تماشایی و گردشگری نیست. تالاری کارستی و خشک است به درازای حدود ۳۵ متر و عمق ۲۰ متر، بر
    دامنهٔ چپ تنگه، ۱٫۵ کیلومتر در شمال‌شرقی روستای گودوگانی؛ صومعهٔ موتسامتا در حدود ۱٫۵ کیلومتری آن
    ایستاده است. نه استالاکتیتی هست و نه نورپردازی رنگی. آنچه اهمیت داشت در کف غار نهفته بود.


    رودولف اشمیت و لئون کوزلوفسکی نخستین یافته‌ها را به دست آوردند، و مدتی غار حتی به نام دانشمند آلمانی،
    رودولف ویرشو، خوانده می‌شد. وقتی کاوش در سال ۱۹۳۶ از سر گرفته شد، نام کهن گرجی همراه با کشفیات تازه
    بازگشت. پربارترین فصل کاوش سال ۱۹۷۳ بود. زیر لایهٔ پارینه‌سنگی بالایی، در عمق حدود ۱٫۵ متر، لایه‌های
    موستری قرار داشت: هسته‌های سنگی لوالوا، سرنیزه‌های سنگی، خراشنده‌ها و کاردها، و تکه‌ای از فک بالای
    یک نئاندرتال همراه با دندان‌هایش. بالاتر، ابزارهایی از سنگ چخماق و ابسیدین، درفش‌ها و سرنیزه‌های استخوانی،
    ابزاری کج‌بیل‌مانند از شاخ گوزن سرخ، و تکه‌هایی از جمجمهٔ یک انسان کرومانیون پیدا شد.


    گرداگرد این آدمیان، جانوران عصر یخبندان از هر گونه گرد آمده بودند: خرس غار و شیر غار، کرگدن، گاومیش
    کوهان‌دار (بیزون)، اسب، گوزن سرخ و سیاه‌گوش — روی‌هم ده‌ها هزار تکه استخوان و دندان. این مجموعه‌ها
    اکنون در سن‌پترزبورگ و در موزهٔ گرجستان به نام سیمون جاناشیا در تفلیس نگهداری می‌شوند، و غار از سال
    ۲۰۰۷ «اثر طبیعی» حفاظت‌شده است.


    پس به اینجا نه برای تماشای نمایشی، که برای یک چشم‌انداز می‌آیید. در دهانهٔ غار بایستید و به رود پایین
    بنگرید: نامش تسکالتسیتلا، یعنی «آب سرخ»، است، چون رس‌های غنی از آهن را می‌شوید و آبش اندکی به رنگ
    زنگ آهن می‌زند. آدمیان ده‌ها هزار سال پیش از آنکه کسی نخستین سنگ موتسامتا را بگذارد، این پیچ تنگه
    را تماشا می‌کردند.
  tip: >-
    ساکاژیا اثر طبیعی حفاظت‌شده است، نه غاری آماده برای گردشگری: وجود نورپردازی، مسیرهای پیاده و باجهٔ
    بلیت تأیید نشده، پس دربارهٔ ورودیه و مقررات دسترسی در محل پرس‌وجو کنید. چراغ‌قوه و کفش مناسب همراه
    داشته باشید — غار خشک است، اما کف آن ناهموار است. چیزی نکاوید و چیزی برندارید؛ اینجا محوطه‌ای باستان‌شناختی
    است. خود غار نیم ساعت وقت می‌گیرد، پس برنامهٔ روز را حول موتسامتا و گلاتی بچینید؛ در صومعه‌ها شانه‌ها
    و زانوها باید پوشیده باشد و بانوان به روسری نیاز دارند. دست‌شویی و غذا در کوتایسی است. غار کم‌ارتفاع
    و خشک است و در هر فصلی می‌توان از آن دیدن کرد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب، از کنار گوری و خاشوری و از فراز گردنهٔ ریکوتی، تا حاشیهٔ شرقی
    کوتایسی بروید؛ حدود ۲۰۵ کیلومتر بزرگراه. از آنجا جاده‌ای را که به سوی موتسامتا و گودوگانی می‌رود دنبال
    کنید. این جاده تا موتسامتا آسفالت و خوب است؛ بخش پایانی، کمتر از ۲ کیلومتر، کوچه‌راهی روستایی و خاکی
    است، و سربالایی کوتاهی پیاده بر دامنه شما را به دهانهٔ غار می‌رساند. روی‌هم حدود ۲۲۴ کیلومتر و ۳ ساعت
    و ۱۰ دقیقه. در کوتایسی باک را پر کنید. خودروی اقتصادی کاملاً کافی است: بخش شنی کوتاه است و به ارتفاع
    بیشتر از زمین نیازی ندارد. در گودوگانی یا نزدیک موتسامتا پارک کنید.
he:
  name: מערת סקאז'יה
  short: 'מערה קטנה ויבשה מעל ערוץ הצקלציטלה: האתר הפלאוליתי הראשון שנמצא בעבר הקווקז, ובו התגלו שרידי
    אדם ניאנדרטלי.'
  body: >-
    **ב-1914, בחלל צנוע באבן הגיר מעל נהר הצקלציטלה, מצאו חוקרים את האתר הפלאוליתי הראשון שזוהה אי-פעם
    בעבר הקווקז.**


    סקאז'יה אינה מערה מתוירת. זהו אולם קרסטי יבש, שאורכו כ-35 מטרים ועומקו 20 מטרים, על המדרון השמאלי
    של הערוץ, 1.5 ק"מ צפון-מזרחית לכפר גודוגאני; מנזר מוצמטה ניצב במרחק של כ-1.5 ק"מ ממנה. אין כאן נטיפים
    ואין תאורה צבעונית. מה שחשוב כאן היה טמון ברצפה.


    רודולף שמידט ולאון קוזלובסקי גילו את הממצאים הראשונים, ולזמן מה אף נקראה המערה על שם המדען הגרמני
    רודולף וירכוב. כשהחפירות התחדשו ב-1936, חזר השם הגאורגי הישן יחד עם התגליות החדשות. העונה העשירה ביותר
    הייתה ב-1973. מתחת לשכבה של התקופה הפלאוליתית העליונה, בעומק של כ-1.5 מטרים, נחשפו שכבות מוסטריות:
    גרעיני אבן בטכניקת לבלואה, חודים, מגרדים וסכינים, ושבר של לסת עליונה של ניאנדרטלי ובה שיניים. גבוה
    יותר נמצאו כלים מצור ומאובסידיאן, מרצעים וחודי חניתות מעצם, כלי חפירה דמוי מעדר מקרן של אייל אדום,
    ושברי גולגולת של אדם מסוג קרו-מניון.


    סביב בני האדם נפרש עולם חי שלם של עידן הקרח: דוב מערות ואריה מערות, קרנף, ביזון, סוס, אייל אדום, שונר
    — עשרות אלפי שברי עצמות ושיניים בסך הכול. האוספים שמורים כיום בסנקט פטרבורג ובמוזיאון גאורגיה על שם
    סימון ג'נשיה בטביליסי, ומאז 2007 המערה מוגנת כאתר טבע (מונומנט טבע).


    כך שבאים לכאן לא בשביל מחזה, אלא בשביל נקודת תצפית. עמדו בפתח המערה והביטו מטה אל הנהר: שמו צקלציטלה,
    'מים אדומים', משום שהוא שוטף חרסיות עשירות בברזל וזורם בגוון חלוד קלוש. בני אדם צפו בעיקול הזה של
    הערוץ עשרות אלפי שנים לפני שמישהו הניח את האבן הראשונה של מוצמטה.
  tip: >-
    סקאז'יה היא אתר טבע מוגן ולא מערה מפותחת לתיירות: לא ידוע בוודאות אם יש בה תאורה, שבילים או קופה,
    לכן בררו במקום לגבי דמי כניסה וכללי גישה. הביאו פנס ונעליים נוחות — המערה יבשה, אבל הרצפה לא אחידה.
    אל תחפרו ואל תיקחו דבר; זהו אתר ארכאולוגי. המערה עצמה דורשת חצי שעה, לכן בנו את היום סביב מוצמטה וגלאתי;
    במנזרים יש לכסות כתפיים וברכיים, ונשים יזדקקו לכיסוי ראש. שירותים ואוכל תמצאו בקותאיסי. המערה נמוכה
    ויבשה, ואפשר לבקר בה בכל עונה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), על פני גורי וחשורי ודרך מעבר ריקוטי, עד הפאתים המזרחיים של קותאיסי
    — כ-205 ק"מ של כביש מהיר. משם המשיכו בכביש לכיוון מוצמטה וגודוגאני. עד מוצמטה הכביש סלול ובמצב טוב;
    הקטע האחרון, פחות מ-2 ק"מ, הוא דרך כפרית לא סלולה, והליכה קצרה במעלה המדרון מביאה אתכם אל פתח המערה.
    בסך הכול כ-224 ק"מ ו-3 שעות ו-10 דקות. תדלקו בקותאיסי. רכב אקונומי מספיק בהחלט: קטע החצץ קצר ואינו
    דורש מרווח גחון גבוה. חנו בגודוגאני או ליד מוצמטה.
ar:
  name: كهف ساكاجيا
  short: >-
    كهف صغير جاف فوق مضيق تسكالتسيتيلا: أول موقع من العصر الحجري القديم اكتُشف في ما وراء القوقاز، وفيه
    عُثر على بقايا إنسان نياندرتال.
  body: >-
    **في عام 1914، في تجويف متواضع في الحجر الجيري فوق نهر تسكالتسيتيلا، عثر الباحثون على أول موقع من
    العصر الحجري القديم يُكتشف على الإطلاق في ما وراء القوقاز.**


    ساكاجيا ليس كهفًا سياحيًا مُجهّزًا. إنه قاعة كارستية جافة، طولها نحو 35 مترًا وعمقها 20 مترًا، على
    السفح الأيسر للمضيق، على بُعد 1.5 كم شمال شرقي قرية غودوغاني؛ ويقوم دير موتسامتا على بُعد نحو 1.5
    كم منه. لا هوابط هنا ولا أضواء ملوّنة. فما كان مهمًّا هنا كان مدفونًا في الأرضية.


    قام رودولف شميت وليون كوزلوفسكي بأولى الاكتشافات، بل إن الكهف حمل لفترة اسم العالم الألماني رودولف
    فيرشو. وحين استُؤنف التنقيب عام 1936 عاد الاسم الجورجي القديم مع الاكتشافات الجديدة. وكان موسم 1973
    أغنى المواسم. فتحت طبقة العصر الحجري القديم الأعلى، على عمق نحو 1.5 متر، ظهرت طبقات موستيرية: نوى
    حجرية بتقنية لوفالوا، ورؤوس مدبّبة، ومكاشط، وسكاكين، وجزء من فك علوي لإنسان نياندرتال بأسنانه. وفي
    الأعلى وُجدت أدوات من الصوّان والزجاج البركاني (الأوبسيديان)، ومخارز ورؤوس رماح من العظم، وأداة حفر
    شبيهة بالمعزقة من قرن الأيل الأحمر، وشظايا من جمجمة إنسان كرومانيون.


    وكان يحيط بهؤلاء البشر معرض كامل لحيوانات العصر الجليدي: دب الكهوف وأسد الكهوف، ووحيد القرن، والبيسون،
    والحصان، والأيل الأحمر، والوشق — عشرات الآلاف من شظايا العظام والأسنان في المجموع. وتُحفظ المجموعات
    اليوم في سانت بطرسبرغ وفي متحف جورجيا باسم سيمون جاناشيا في تبليسي، والكهف محمي بوصفه «معلمًا طبيعيًا»
    منذ عام 2007.


    فأنت لا تأتي إلى هنا من أجل مشهد مبهر، بل من أجل موضع إطلالة. قف عند مدخل الكهف وانظر إلى النهر في
    الأسفل: اسمه تسكالتسيتيلا، أي «الماء الأحمر»، لأنه يجرف طينًا غنيًا بالحديد فيجري بلون صدئ خافت. لقد
    كان البشر يراقبون هذا المنعطف من المضيق قبل عشرات آلاف السنين من أن يضع أحد الحجر الأول في موتسامتا.
  tip: >-
    ساكاجيا معلم طبيعي محمي، لا كهف سياحي مُجهّز: فوجود الإضاءة والممرات وشبّاك التذاكر غير مؤكَّد، لذا
    استفسر محليًا عن أي رسوم وقواعد للدخول. احمل مصباحًا يدويًا وحذاءً مناسبًا — فالكهف جاف لكن أرضيته
    غير مستوية. لا تحفر شيئًا ولا تأخذ شيئًا؛ فهذا موقع أثري. يحتاج الكهف نفسه إلى نصف ساعة، فابنِ يومك
    حول موتسامتا وغيلاتي؛ وفي الأديرة غطِّ الكتفين والركبتين، وتحتاج النساء إلى غطاء للرأس. دورات المياه
    والطعام في كوتايسي. والكهف منخفض وجاف، فتمكن زيارته في أي فصل.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وخاشوري، وعبر ممر ريكوتي، حتى الأطراف الشرقية لكوتايسي
    — نحو 205 كم من الطريق السريع. ومن هناك اتبع الطريق المؤدي إلى موتسامتا وغودوغاني. وهو معبّد وجيّد
    حتى موتسامتا؛ أما المقطع الأخير، وهو أقل من 2 كم، فدرب قروي غير معبّد، ثم يوصلك صعود قصير سيرًا على
    السفح إلى مدخل الكهف. نحو 224 كم و3 ساعات و10 دقائق إجمالًا. تزوّد بالوقود في كوتايسي. السيارة الاقتصادية
    كافية تمامًا: فالمقطع الحصوي قصير ولا يحتاج إلى خلوص أرضي إضافي. اركن سيارتك في غودوغاني أو قرب موتسامتا.
