ka:
  name: ბალდის კანიონი
  short: >-
    ვიწრო კირქვის ხეობა მარტვილის ჩრდილო-აღმოსავლეთით, ჩანჩქერებით, ტრავერტინის საფეხურებით და ყოველგვარი
    ინფრასტრუქტურის გარეშე.
  body: >-
    **ბალდის კანიონი ის ადგილია, სადაც მარტვილის კანიონი ოცი წლის წინ იყო** — ბილიკის, ბილეთისა და ნავების
    გარეშე. ბუნების ძეგლი მარტვილიდან ათიოდე კილომეტრში ჩრდილო-აღმოსავლეთით, სოფლების პირველი და მეორე
    ბალდის მიდამოებშია.


    გეოლოგიურად ეს იმავე კარსტული სარტყლის ნაწილია, რომელსაც მარტვილის კანიონი, ოკაცე, კინჩხა და ასხის
    კირქვის მასივის მღვიმეები ეკუთვნის. წყალი კირქვას ხსნის, კალაპოტში კი ტრავერტინის საფეხურებს აწყობს:
    მოკლე ჩანჩქერების, ბაკებისა და ბუნებრივი აუზების ჯაჭვს.


    ხეობა ვიწროა და ჩრდილიანი. კედლები ხავსით, გვიმრითა და წყალწვეთით არის დაფარული, ზემოდან კი მურყანი
    და რცხილა იხრება. ზაფხულის შუადღეს აქ სიგრილეა მაშინაც, როცა დაბლობში ოცდაათი გრადუსია.


    ბალდა 2011 წელს ბუნების ძეგლად გამოცხადდა იმ ჯგუფთან ერთად, რომელშიც მოტენასა და ჯორცკუს მღვიმეები,
    ტობასა და ონიორეს ჩანჩქერები და აბაშის ჩანჩქერიც შედის. ეს საქართველოში ბუნების ძეგლების ერთ-ერთი
    ყველაზე მჭიდრო გროვაა და ერთ დღეში რამდენიმეს ნახვა შესაძლებელია.


    მთავარი განსხვავება მარტვილისგან ინფრასტრუქტურაა — უფრო სწორად, მისი არარსებობა. აქ არც სალარო დგას,
    არც ხის ბოგირი, არც მოაჯირი. კანიონში ჩასვლა კალაპოტში სიარულს ნიშნავს: ქვები სველი და მოლიპულია,
    ადგილ-ადგილ წყალში შეიარებ.


    სწორედ ამიტომ არის აქ ხალხი ცოტა. ზაფხულის შაბათსაც კი შეიძლება მთელი ხეობა შენთვის დარჩეს. ეს კარგიც
    არის და საშიშიც: დახმარება ახლოს არ არის და კავშირგაბმულობა სუსტია.


    წყლის დონე ყველაფერს განსაზღვრავს. გაზაფხულზე და ძლიერი წვიმის შემდეგ დინება მძლავრია და კალაპოტში
    ჩასვლა არ ღირს — კარსტულ ხეობებში წყალი მოულოდნელად და სწრაფად იმატებს. აგვისტოსა და სექტემბერში წყალი
    დაბალი, ცივი და გამჭვირვალეა; სწორედ მაშინ ჩანს ტრავერტინის ფერები საუკეთესოდ.


    ხეობის ბოტანიკაც აღსანიშნავია: კოლხური რელიქტური მცენარეულობა — შქერი, წყავი, ეკალღიჭი — ვიწრო, სველ
    კედლებზე ისე იზრდება, როგორც სათბურში. ეს ის მცენარეებია, რომლებმაც გამყინვარება სწორედ ასეთ თავშესაფრებში
    გადაიტანეს.


    ვიზიტი ორ საათს იკავებს: მისასვლელი ბილიკი მოკლეა, დანარჩენი დრო კი კალაპოტში ნელა სიარულს მიდის.
    ჩვეულებრივ მას მარტვილის კანიონსა და სალხინოს ამატებენ, სამივე ერთმანეთისგან ნახევარ საათშია.


    ბოლოს ერთი გულახდილი შენიშვნა: თუ ლამაზ ფოტოს და მოწესრიგებულ ბილიკს ეძებ, მარტვილის კანიონი აჯობებს.
    ბალდაზე იმისთვის მიდიან, რომ ხეობა ისე ნახონ, როგორც ის ტურიზმამდე იყო.
  tip: >-
    ორი საათი კმარა. ფეხსაცმელი ისეთი გჭირდება, რომელიც სველდება და არ სრიალებს — სანდლები და კროსოვკები
    არ გამოდგება. ჯოხი ან ტრეკინგის ჯოხი ძალიან გეხმარება კალაპოტში. მარტო ნუ ჩახვალ და ბავშვები მეთვალყურეობის
    გარეშე ნუ გაუშვებ. წვიმის დღეს ან წვიმის შემდეგ საერთოდ ნუ ჩახვალ. ტუალეტი, წყალი, კაფე — არაფერია;
    ყველაფერი მარტვილიდან წაიღე. სექტემბრიდან წყალი ცივია და ხანგრძლივი შესვლა არ ღირს. კავშირგაბმულობა
    სუსტია — მარშრუტი წინასწარ ჩამოტვირთე.
  route: >-
    თბილისიდან E60-ით სამტრედიისა და აბაშის გავლით მარტვილამდე, შემდეგ ჩრდილო-აღმოსავლეთით ბალდის სოფლებისკენ
    — სულ დაახლოებით 313 კმ და ხუთ საათამდე. მარტვილამდე გზა ასფალტია; შემდეგ იწყება ვიწრო, ღორღიანი და
    ღრმა ჭაობიანი კვალით დაღარული სასოფლო გზა. მშრალ ამინდში ჯიპი ან შემაღლებული ავტომობილი უპრობლემოდ
    გაივლის, დაბალი მანქანა კი გაძნელდება. წვიმის შემდეგ მხოლოდ ოთხთვალა. მანქანა სოფლის ბოლოს დატოვე
    და ბოლო მონაკვეთი ფეხით გაიარე. საწვავი აბაშაში ან მარტვილში აიღე — შემდეგ სადგური აღარ არის.
en:
  name: Balda Canyon
  short: >-
    A narrow limestone gorge north-east of Martvili with small waterfalls, travertine steps and no infrastructure
    at all.
  body: >-
    **Balda is what Martvili canyon was twenty years ago:** no walkway, no ticket desk, no boats. The
    natural monument lies about ten kilometres north-east of Martvili, near the villages of Pirveli and
    Meore Balda.


    Geologically it belongs to the same karst belt as Martvili canyon, Okatse, Kinchkha and the caves
    of the Askhi limestone massif. Water dissolves the limestone and rebuilds it as travertine in the
    bed, producing a chain of short falls, rimmed basins and natural pools.


    The gorge is narrow and shaded. The walls are furred with moss and ferns and constantly wet, and alder
    and hornbeam lean in from above. At midday in summer it is cool down here even when the lowland is
    at thirty degrees.


    Balda was designated a natural monument in 2011 along with a cluster of neighbours that includes Motena
    and Jortsku caves, the Toba and Oniore waterfalls and the Abasha waterfall. This is one of the densest
    concentrations of protected natural sites in Georgia, and several can be seen in a day.


    The real difference from Martvili is infrastructure, or rather the lack of it. There is no cash desk,
    no boardwalk, no handrail. Getting into the canyon means walking in the streambed: the stones are
    wet and slick and in places you wade.


    That is also why there are so few people. Even on a summer Saturday you may have the gorge to yourself.
    This is both the attraction and the risk, because help is not close and the phone signal is poor.


    Water level governs everything. In spring and after heavy rain the flow is strong and the bed should
    be left alone — in karst gorges the water rises suddenly and fast. In August and September it is low,
    cold and clear, and that is when the colours of the travertine show best.


    Two hours covers a visit: the approach path is short and the rest of the time goes on walking slowly
    upstream. Most people add it to Martvili canyon and Salkhino; all three are within half an hour of
    each other.


    One honest note to finish. If you want a good photograph and a tidy path, Martvili canyon is the better
    choice. People come to Balda to see a gorge as it was before tourism arrived.
  tip: >-
    Two hours is enough. You need shoes that can get wet and will not slip; sandals and running shoes
    are both wrong here. A stick or trekking pole makes a real difference in the bed. Do not go down alone,
    and do not let children out of reach. Do not go at all on a rainy day or straight after rain. There
    is no toilet, no water and no café — bring everything from Martvili. From September the water is cold
    enough that long wading is unpleasant.
  route: >-
    From Tbilisi take the E60 through Samtredia and Abasha to Martvili, then head north-east towards the
    Balda villages — about 313 km in all and just under five hours. The road is asphalt as far as Martvili;
    after that it becomes a narrow country track, gravelled and deeply rutted. In dry weather an SUV or
    any raised car does it without trouble, while a low car will struggle. After rain it is four-wheel
    drive only. Leave the car at the end of the village. Refuel in Abasha or Martvili.
ru:
  name: Каньон Балда
  short: >-
    Узкое известняковое ущелье к северо-востоку от Мартвили с водопадиками, травертиновыми ступенями и
    полным отсутствием инфраструктуры.
  body: >-
    **Балда — это то, чем Мартвильский каньон был двадцать лет назад:** без настилов, без кассы, без лодок.
    Памятник природы лежит километрах в десяти к северо-востоку от Мартвили, около сёл Пирвели и Меоре
    Балда.


    Геологически он принадлежит тому же карстовому поясу, что Мартвильский каньон, Окаце, Кинчха и пещеры
    известнякового массива Асхи. Вода растворяет известняк и тут же строит из него травертин в русле,
    создавая цепочку коротких водопадов, бортиков и естественных ванн.


    Ущелье узкое и тенистое. Стены покрыты мхом и папоротником и постоянно мокрые, сверху наклоняются
    ольха и граб. В летний полдень здесь прохладно даже тогда, когда на равнине тридцать градусов.


    Балду объявили памятником природы в 2011 году вместе с группой соседей: пещерами Мотена и Джорцку,
    водопадами Тоба и Ониоре и водопадом на Абаше. Это одно из самых плотных скоплений охраняемых природных
    объектов в Грузии, и несколько из них можно осмотреть за день.


    Настоящее отличие от Мартвили — инфраструктура, точнее её отсутствие. Ни кассы, ни деревянного настила,
    ни перил. Спуск в каньон означает ходьбу по руслу: камни мокрые и скользкие, местами придётся идти
    вброд.


    Поэтому здесь так мало людей. Даже в летнюю субботу ущелье может достаться вам одним. В этом и притягательность,
    и риск: помощь далеко, связь плохая.


    Всё решает уровень воды. Весной и после сильных дождей поток мощный, и в русло лучше не соваться:
    в карстовых ущельях вода прибывает внезапно и быстро. В августе и сентябре она низкая, холодная и
    прозрачная — именно тогда цвета травертина видны лучше всего.


    На посещение уходит два часа: подход короткий, остальное время идёт на медленное движение вверх по
    руслу. Обычно Балду добавляют к Мартвильскому каньону и Салхино — все три места в получасе друг от
    друга.


    И одно честное замечание напоследок. Если нужны удачный кадр и аккуратная тропа, лучше ехать в Мартвильский
    каньон. В Балду едут ради того, чтобы увидеть ущелье таким, каким оно было до туризма.
  tip: >-
    Двух часов достаточно. Нужна обувь, которую не жалко намочить и которая не скользит: сандалии и кроссовки
    одинаково не годятся. Палка или треккинговый шест сильно помогают в русле. Не спускайтесь в одиночку
    и не отпускайте детей далеко. В дождь и сразу после дождя не спускайтесь вовсе. Ни туалета, ни воды,
    ни кафе здесь нет — берите всё в Мартвили. С сентября вода такая холодная, что долго бродить неприятно.
  route: >-
    Из Тбилиси по E60 через Самтредиа и Абашу до Мартвили, затем на северо-восток к сёлам Балда — всего
    около 313 км и чуть меньше пяти часов. До Мартвили дорога асфальтированная; дальше начинается узкая
    просёлочная колея с гравием и глубокими колеями. В сухую погоду внедорожник или любая машина с клиренсом
    проходит спокойно, низкая — с трудом. После дождя только полный привод. Машину оставьте в конце села.
    Заправляйтесь в Абаше или Мартвили.
fa:
  name: درهٔ بالدا
  short: تنگه‌ای باریک از سنگ آهک در شمال شرقی مارتویلی، با آبشارهای کوچک، پله‌های تراورتن و بدون هیچ
    زیرساخت.
  body: >-
    **بالدا همان چیزی است که درهٔ مارتویلی بیست سال پیش بود:** بی‌گذرگاه چوبی، بی‌گیشه و بی‌قایق. این
    اثر طبیعی حدود ده کیلومتری شمال شرقی مارتویلی، نزدیک روستاهای پیرولی و مِئوره بالدا، قرار دارد.


    از نظر زمین‌شناسی به همان کمربند کارستی تعلق دارد که درهٔ مارتویلی و اوکاتسه و کینچخا و غارهای تودهٔ
    آهکی آسخی در آن‌اند. آب سنگ آهک را حل می‌کند و همان را در بستر به شکل تراورتن بازمی‌سازد و زنجیره‌ای
    از آبشارهای کوتاه و لبه‌ها و حوضچه‌های طبیعی پدید می‌آورد.


    تنگه باریک و سایه‌دار است. دیواره‌ها از خزه و سرخس پوشیده و همیشه خیس‌اند و از بالا توسکا و ممرز خم
    شده‌اند. ظهر تابستان اینجا خنک است، حتی وقتی جلگه سی درجه دارد.


    بالدا در ۲۰۱۱ همراه با گروهی از همسایگانش اثر طبیعی اعلام شد؛ در آن گروه غارهای موتنا و جورتسکو، آبشارهای
    توبا و اونیوره و آبشار آباشا هستند. این یکی از متراکم‌ترین تجمع‌های آثار طبیعی حفاظت‌شده در گرجستان
    است و می‌توان چند تای آن را در یک روز دید.


    تفاوت واقعی با مارتویلی زیرساخت است، یا بهتر بگوییم نبود آن. نه گیشه‌ای هست، نه گذرگاه چوبی و نه نرده‌ای.
    پایین رفتن به دره یعنی راه رفتن در بستر رودخانه: سنگ‌ها خیس و لغزنده‌اند و جاهایی باید از آب گذشت.


    به همین سبب آدم اینجا کم است. حتی شنبهٔ تابستان هم ممکن است تمام تنگه از آن شما باشد. این هم جاذبه
    است و هم خطر، چون کمک نزدیک نیست و آنتن‌دهی ضعیف است.


    سطح آب همه چیز را تعیین می‌کند. در بهار و پس از باران سنگین جریان نیرومند است و بهتر است پا در بستر
    نگذارید؛ در تنگه‌های کارستی آب ناگهانی و تند بالا می‌آید. در مرداد و شهریور آب کم و سرد و زلال است
    و درست همان وقت رنگ‌های تراورتن بهتر دیده می‌شود.


    بازدید دو ساعت می‌برد: مسیر دسترسی کوتاه است و باقی وقت صرف بالا رفتن آهسته در بستر می‌شود. بیشتر
    مردم آن را به درهٔ مارتویلی و سالخینو می‌افزایند؛ هر سه در نیم‌ساعتی یکدیگرند.


    و یک نکتهٔ صادقانه در پایان. اگر عکسی خوب و مسیری مرتب می‌خواهید، درهٔ مارتویلی گزینهٔ بهتری است.
    مردم به بالدا می‌آیند تا تنگه‌ای را ببینند چنان‌که پیش از آمدن گردشگری بود.
  tip: >-
    دو ساعت کافی است. کفشی لازم دارید که خیس شود و نلغزد؛ صندل و کفش دو هر دو نادرست‌اند. چوب‌دستی یا
    باتوم در بستر واقعاً فرق می‌کند. تنها پایین نروید و کودکان را از دسترس دور نکنید. در روز بارانی یا
    بلافاصله پس از باران اصلاً پایین نروید. سرویس بهداشتی و آب و کافه اینجا نیست؛ همه چیز را از مارتویلی
    بیاورید. از شهریور به بعد آب چنان سرد است که ماندن طولانی در آن ناخوشایند می‌شود.
  route: >-
    از تفلیس با E60 از سامترِدیا و آباشا تا مارتویلی، سپس به شمال شرقی به سوی روستاهای بالدا — رویهم حدود
    ۳۱۳ کیلومتر و کمی کمتر از پنج ساعت. تا مارتویلی جاده آسفالت است؛ پس از آن راهی روستایی و باریک با
    شن و شیارهای عمیق آغاز می‌شود. در هوای خشک شاسی‌بلند یا هر خودروی با ارتفاع مناسب بی‌دردسر می‌گذرد
    و خودروی کم‌ارتفاع به زحمت می‌افتد. پس از باران فقط چهارچرخ‌محرک. خودرو را در انتهای روستا بگذارید.
    سوخت را در آباشا یا مارتویلی بگیرید.
he:
  name: קניון בלדה
  short: ערוץ גיר צר מצפון-מזרח למרטווילי, עם מפלים קטנים, מדרגות טרוורטין ובלי שום תשתית.
  body: >-
    **בלדה הוא מה שהיה קניון מרטווילי לפני עשרים שנה:** בלי שביל עץ, בלי קופה ובלי סירות. אתר הטבע המוגן
    שוכן כעשרה קילומטרים מצפון-מזרח למרטווילי, ליד הכפרים פירוולי ומאורה בלדה.


    מבחינה גיאולוגית הוא שייך לאותה חגורת קרסט שאליה שייכים קניון מרטווילי, אוקצה, קינצ׳חה ומערות מסיב
    הגיר אסחי. המים ממיסים את הגיר ובונים אותו מחדש כטרוורטין באפיק, ויוצרים שרשרת של מפלים קצרים, מדפים
    ובריכות טבעיות.


    הערוץ צר ומוצל. הקירות מכוסים טחב ושרכים ולחים תמיד, ומלמעלה נוטים אלמון וגרביל. בצהרי הקיץ קריר כאן
    גם כשבמישור שלושים מעלות.


    בלדה הוכרז אתר טבע מוגן ב-2011 יחד עם קבוצת שכנים ובהם מערות מוטנה וג׳ורצקו, מפלי טובה ואוניורה ומפל
    האבאשה. זהו אחד הריכוזים הצפופים בגאורגיה של אתרי טבע מוגנים, ואפשר לראות כמה מהם ביום אחד.


    ההבדל האמיתי ממרטווילי הוא התשתית, או ליתר דיוק היעדרה. אין קופה, אין שביל עץ ואין מעקה. הירידה אל
    הקניון פירושה הליכה באפיק: האבנים רטובות וחלקלקות, ובמקומות מסוימים חוצים במים.


    לכן גם יש כאן כל כך מעט אנשים. גם בשבת של קיץ ייתכן שהערוץ כולו יהיה שלכם. זו המשיכה וזה גם הסיכון,
    כי עזרה אינה קרובה והקליטה גרועה.


    מפלס המים קובע הכול. באביב ואחרי גשם כבד הזרימה חזקה ועדיף לא לרדת לאפיק כלל — בערוצי קרסט המים עולים
    בפתאומיות ובמהירות. באוגוסט ובספטמבר המים נמוכים, קרים וצלולים, ואז נראים צבעי הטרוורטין במיטבם.


    גם הצומח כאן ראוי לציון: צמחייה קולכית שרידית — רודודנדרון, דפנה ואשחר קוצני — גדלה על הקירות הצרים
    והרטובים כמו בחממה. אלה מינים ששרדו את עידני הקרח דווקא במקלטים מסוג זה.


    הביקור אורך שעתיים: דרך הגישה קצרה, והשאר מוקדש להליכה איטית במעלה האפיק. רוב האנשים מוסיפים אותו
    לקניון מרטווילי ולסלחינו; שלושת המקומות במרחק חצי שעה זה מזה.


    הערה כנה לסיום. אם אתם רוצים תצלום טוב ושביל מסודר, קניון מרטווילי הוא הבחירה הנכונה. לבלדה באים כדי
    לראות ערוץ כפי שהיה לפני שהתיירות הגיעה.
  tip: >-
    שעתיים מספיקות. דרושות נעליים שיכולות להירטב ואינן מחליקות; סנדלים ונעלי ריצה שגויים כאן במידה שווה.
    מקל או מקל הליכה עושה הבדל של ממש באפיק. אל תרדו לבד ואל תניחו לילדים להתרחק. ביום גשום או מיד אחרי
    גשם אל תרדו כלל. אין כאן שירותים, מים או בית קפה — הביאו הכול ממרטווילי. מספטמבר המים קרים דיים כדי
    שהליכה ארוכה בהם תהיה לא נעימה.
  route: >-
    מטביליסי בכביש E60 דרך סמטרדיה ואבאשה עד מרטווילי, ומשם צפונה-מזרחה לכפרי בלדה — כ-313 ק״מ בסך הכול
    וקצת פחות מחמש שעות. עד מרטווילי הכביש סלול; אחר כך מתחילה דרך כפרית צרה, מחוצצת ומלאת תלמים עמוקים.
    במזג אוויר יבש רכב שטח או כל רכב מוגבה עובר בלי קושי, ורכב נמוך יתקשה. אחרי גשם רק הנעה כפולה. השאירו
    את הרכב בקצה הכפר. תדלקו באבאשה או במרטווילי.
ar:
  name: وادي بالدا
  short: ممر جيري ضيق شمال شرقي مارتفيلي، بشلالات صغيرة ودرجات ترافرتين وبلا أي بنية تحتية.
  body: >-
    **بالدا هي ما كان عليه وادي مارتفيلي قبل عشرين سنة:** بلا ممشى خشبي ولا شباك تذاكر ولا قوارب. يقع
    هذا النصب الطبيعي على نحو عشرة كيلومترات شمال شرقي مارتفيلي، قرب قريتي بيرفيلي ومِئوري بالدا.


    جيولوجياً ينتمي إلى حزام الكارست نفسه الذي يضم وادي مارتفيلي وأوكاتسه وكينتشخا وكهوف كتلة أسخي الجيرية.
    يذيب الماء الحجر الجيري ثم يعيد بناءه ترافرتيناً في المجرى، فينشئ سلسلة من الشلالات القصيرة والحواف
    والأحواض الطبيعية.


    الوادي ضيق مظلل. جدرانه مكسوة بالطحالب والسرخس ورطبة دائماً، ومن فوق ينحني الجار والزان الأبيض. وفي
    ظهيرة الصيف يبقى الجو هنا بارداً حتى حين يبلغ السهل ثلاثين درجة.


    أُعلنت بالدا نصباً طبيعياً عام 2011 مع مجموعة من جيرانها تضم كهفي موتينا ويورتسكو، وشلالي توبا وأونيوري،
    وشلال أباشا. وهذا من أكثف تجمعات المواقع الطبيعية المحمية في جورجيا، ويمكن رؤية عدة منها في يوم واحد.


    والفرق الحقيقي عن مارتفيلي هو البنية التحتية، أو بالأحرى غيابها. لا شباك ولا ممشى خشبي ولا درابزين.
    والنزول إلى الوادي يعني المشي في مجرى الماء: الحجارة مبللة زلقة وفي مواضع تخوض في الماء.


    ولهذا أيضاً يقل الناس هنا. حتى في سبت صيفي قد يكون الوادي كله لك وحدك. وهذه جاذبيته ومخاطرته معاً،
    فالنجدة ليست قريبة والتغطية ضعيفة.


    منسوب الماء يحكم كل شيء. في الربيع وبعد الأمطار الغزيرة يقوى التدفق ويحسن ترك المجرى وشأنه؛ ففي أودية
    الكارست يرتفع الماء فجأة وبسرعة. وفي آب وأيلول يكون منخفضاً بارداً صافياً، وحينها تظهر ألوان الترافرتين
    في أبهى صورها.


    تستغرق الزيارة ساعتين: درب الوصول قصير، وبقية الوقت تمضي في صعود بطيء داخل المجرى. ويضيفه أكثر الناس
    إلى وادي مارتفيلي وسالخينو؛ والمواضع الثلاثة على بعد نصف ساعة من بعضها.


    وملاحظة صريحة في الختام. إن أردت صورة جيدة وممراً مرتباً فوادي مارتفيلي أفضل. أما بالدا فيأتي إليها
    الناس ليروا وادياً كما كان قبل أن تصل السياحة.
  tip: >-
    ساعتان تكفيان. تحتاج حذاءً يتحمل البلل ولا ينزلق؛ فالصندل وحذاء الجري كلاهما خطأ هنا. والعصا أو عصا
    المشي تحدث فرقاً حقيقياً في المجرى. لا تنزل وحدك ولا تدع الأطفال يبتعدون. ولا تنزل إطلاقاً في يوم
    ممطر أو بعد المطر مباشرة. لا دورة مياه هنا ولا ماء ولا مقهى — احمل كل شيء من مارتفيلي. ومن أيلول يصير
    الماء بارداً بحيث يصعب البقاء فيه طويلاً.
  route: >-
    من تبليسي على الطريق E60 عبر سامتريديا وأباشا حتى مارتفيلي، ثم شمالاً شرقاً نحو قرى بالدا — نحو 313
    كم إجمالاً وأقل قليلاً من خمس ساعات. الطريق معبّد حتى مارتفيلي؛ وبعدها يبدأ درب ريفي ضيق مرصوف بالحصى
    وعميق الأخاديد. في الجو الجاف تجتازه سيارة دفع رباعي أو أي مركبة مرتفعة دون عناء، وتتعثر المنخفضة.
    وبعد المطر لا يصلح إلا الدفع الرباعي. اترك السيارة في آخر القرية. تزوّد بالوقود في أباشا أو مارتفيلي.
