ka:
  name: ბალდის კანიონი
  short: >-
    მდინარე აბაშის მიერ კირქვაში ჩაჭრილი 1,4-კილომეტრიანი კანიონი ბალდის მონასტრის მახლობლად — ვიწრო,
    მწვანეკედლიანი და მარტვილზე გაცილებით მშვიდი.
  body: >-
    **მარტვილის კანიონის ნავებიდან და ბილიკებიდან ექვსიოდე კილომეტრით ზემოთ იგივე მდინარე კირქვის ისეთ
    ვიწრო ნაპრალში მიიკვლევს გზას, რომელიც სოფლის შუკაზე ფართო ძლივს არის.**


    ბალდის კანიონი 2013 წლიდან ბუნების ძეგლია. ის მარტვილის მუნიციპალიტეტში, სოფელ მეორე ბალდასთან, ზღვის
    დონიდან 295 მეტრზე მდებარეობს — იქ, სადაც მდინარე აბაშა ასხის კირქვიანი მასივის სამხრეთ კიდეს ჭრის.
    მისი სიგრძე 1400 მეტრია, სიგანე 5–10, სიღრმე კი 25–30 მეტრი: ხეობა კი არა, კლდის ნაპრალია, რომლის
    სველ კედლებს ხავსი და გვიმრა ფარავს. ახლოს ბალდის ღვთისმშობლის მიძინების მონასტერი დგას.


    კიდეზე რომ დადგებით, ქვემოთ ღია ფერის ქვაზე გამჭვირვალე მწვანე წყალი მიედინება, ლოდებს შორის კი თეთრად
    ქაფდება. ხეობაში ჰაერი ზემოთ გადაშლილ მინდვრებზე გრილია და სველი კლდის სუნი ასდის.


    წლების განმავლობაში ბალდა ის იყო, რაც მარტვილი ხის ბილიკებამდე: ცოტა სტუმრით და თითქმის ყოველგვარი
    ნაგებობის გარეშე. შემდეგ მთავრობამ კანიონის განვითარებისა და მართვის უფლების კერძო კომპანიისთვის მიყიდვა
    გადაწყვიტა, რამაც ადგილობრივებისა და გარემოსდამცველების პროტესტი გამოიწვია; აქციები 2022 წლიდან 2024
    წლამდე გაგრძელდა და მონაწილეები თავდასხმებზეც საუბრობდნენ. რასაც დღეს დახვდებით — სალაროს, ახალ ბილიკებს
    თუ ძველ, დაუცველ ნაპირს — ყველა შემთხვევაში იმ ადგილას დგახართ, რომლის მომავალზეც ცხარე დავა იყო.


    კარსტული მდინარეები სწრაფად იმატებენ. ძლიერი წვიმის შემდეგ და გაზაფხულის თოვლის დნობისას აბაშა მღვრიე
    და მძლავრია — კალაპოტში ჩასვლა მაშინ არ შეიძლება; ზაფხულის ბოლოს დინება კლებულობს და წყალი იწმინდება.


    მარტვილი კანიონს გაჩვენებთ. ბალდა კი გეკითხებათ, რისთვის უნდა არსებობდეს კანიონი.
  tip: >-
    დაახლოებით ორი საათი გამოყავით. ჩაიცვით კარგად შეჭიდებული ფეხსაცმელი, რომლის დასველებაც არ დაგენანებათ
    — წყალთან ქვები მოლიპულია. წვიმიან დღეს და წვიმის შემდეგ კალაპოტში ნუ ჩახვალთ, ბავშვები კი ხელის გაწვდენაზე
    გყავდეთ. 2022–2024 წლების დავის შემდეგ ადგილზე წესრიგი იცვლებოდა, ამიტომ მარტვილში იკითხეთ, არის თუ
    არა ახლა შესასვლელი საფასური ან დადგენილი მარშრუტი, წყალი და საჭმელი კი თან იქონიეთ — შეიძლება ადგილზე
    არაფერი დაგხვდეთ. ხეობაში მობილური კავშირი სუსტი შეიძლება იყოს.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით ქუთაისის მიდამოებამდე იარეთ, შემდეგ ხონისკენ გადაუხვიეთ და ბანძის
    გავლით მარტვილამდე მიდით; ძველი გზა სამტრედიის, აბაშისა და შ4-ის გავლით ოდნავ გრძელია. მარტვილიდან
    პირველ და მეორე ბალდამდე ჩრდილოეთით 11,4 კილომეტრი, დაახლოებით 20 წუთია. სულ დაახლოებით 313 კმ და
    4 საათი და 50 წუთი. კანიონამდე ბოლო კილომეტრები ვიწრო და ნაწილობრივ ხრეშიანია, ძლიერი წვიმის შემდეგ
    კი ტალახიანი, ამიტომ მაღალი გამავლობის ავტომობილი უფრო საიმედოა. საწვავი მარტვილში შეავსეთ.
en:
  name: Balda Canyon
  short: >-
    A 1.4 km limestone slot cut by the Abasha river beside Balda monastery: narrow, green-walled and far
    quieter than Martvili Canyon.
  body: >-
    **About six kilometres upstream of Martvili Canyon's boats and walkways, the same river squeezes through
    a slot of limestone barely wider than a village lane.**


    Balda Canyon, a natural monument since 2013, lies beside the village of Second Balda in Martvili municipality,
    295 metres above sea level, where the Abasha river has cut into the southern edge of the Askhi limestone
    massif. It is 1.4 km long, five to ten metres wide and 25 to 30 metres deep: less a valley than a
    crack in the rock, its walls wet and furred with moss and fern. Close by stands the Balda monastery
    of the Dormition of the Mother of God.


    Stand at the rim and the water below is clear green over pale stone, turning white where it breaks
    between boulders. The air in the gorge is cooler than the fields above, and it smells of wet rock.


    For years Balda was what Martvili had been before its walkways: a gorge with few visitors and almost
    nothing built. Then the government decided to sell the rights to develop and manage it to a private
    company, and the decision set off protests by villagers and environmental activists that ran from
    2022 into 2024, with protesters reporting assaults. Whatever you find on arrival, a cash desk, new
    paths or the old unguarded bank, you are standing in a place whose future has been fought over.


    Karst rivers rise quickly. After heavy rain and during the spring melt the Abasha runs strong and
    brown, and the riverbed is no place to be; by late summer the flow drops and the water clears.


    Martvili shows you a canyon. Balda asks what a canyon should be for.
  tip: >-
    Allow about two hours. Wear shoes with real grip that you do not mind soaking; the rock by the water
    is slick. Stay out of the riverbed on rainy days and straight after rain, and keep children within
    arm's reach. Arrangements at the site have been in flux since the 2022–24 dispute over its management,
    so ask in Martvili whether there is now an entrance fee or a set route, and bring water and food in
    case there is nothing on site. The phone signal can be weak in the gorge.
  route: >-
    From Tbilisi follow the E60/S1 west to the Kutaisi area, turn off towards Khoni and continue through
    Bandza to Martvili; the older route via Samtredia, Abasha and the Sh4 is slightly longer. From Martvili
    it is 11.4 km, about 20 minutes, north to the villages of First and Second Balda. In all, about 313
    km and 4 h 50 min. The last kilometres to the canyon are narrow and partly gravel, muddy after heavy
    rain, which is why a raised car such as an SUV is the safer choice. Refuel in Martvili.
ru:
  name: Каньон Балда
  short: >-
    Известняковая щель длиной 1,4 км, прорезанная рекой Абаша рядом с Балдским монастырём: узкая, с зелёными
    стенами и куда тише Мартвильского каньона.
  body: >-
    **Километрах в шести выше по течению от лодок и настилов Мартвильского каньона та же река протискивается
    сквозь известняковую щель шириной едва ли с деревенский проулок.**


    Каньон Балда, памятник природы с 2013 года, лежит у села Вторая Балда в муниципалитете Мартвили, на
    высоте 295 метров над уровнем моря, там, где река Абаша врезалась в южный край известнякового массива
    Асхи. Его длина — 1,4 км, ширина — от пяти до десяти метров, глубина — 25–30 метров: это не столько
    долина, сколько трещина в скале, чьи мокрые стены обросли мхом и папоротником. Неподалёку стоит Балдский
    монастырь Успения Богородицы.


    Встаньте на краю: внизу прозрачная зелёная вода бежит над светлым камнем и белеет там, где разбивается
    о валуны. Воздух в ущелье прохладнее, чем на полях наверху, и пахнет мокрым камнем.


    Долгие годы Балда была тем, чем Мартвили был до своих настилов: ущельем, куда почти никто не заходил
    и где почти ничего не было построено. Затем правительство решило продать частной компании права на
    обустройство и управление каньоном, и это решение вызвало протесты сельчан и экоактивистов, продолжавшиеся
    с 2022 по 2024 год; протестующие сообщали о нападениях. Что бы вы ни застали по приезде — кассу, новые
    тропы или прежний неохраняемый берег, — вы стоите на месте, за будущее которого шла борьба.


    Карстовые реки поднимаются быстро. После сильных дождей и во время весеннего таяния Абаша несётся
    мощным мутно-бурым потоком, и в русле делать нечего; к концу лета поток спадает и вода светлеет.


    Мартвили показывает вам каньон. Балда спрашивает, для чего каньон вообще нужен.
  tip: >-
    Отведите около двух часов. Наденьте обувь с хорошим протектором, которую не жалко намочить: камни
    у воды скользкие. В дождливые дни и сразу после дождя не спускайтесь в русло, а детей держите на расстоянии
    вытянутой руки. Порядки на месте меняются с тех пор, как в 2022–2024 годах разгорелся спор об управлении
    каньоном, поэтому спросите в Мартвили, есть ли теперь плата за вход или обязательный маршрут, и возьмите
    с собой воду и еду на случай, если на месте ничего нет. Связь в ущелье бывает слабой.
  route: >-
    Из Тбилиси по E60/S1 на запад до района Кутаиси, затем поворот на Хони и дальше через Бандзу до Мартвили;
    старый путь через Самтредиа, Абашу и Sh4 чуть длиннее. От Мартвили 11,4 км, около 20 минут, на север
    до сёл Первая и Вторая Балда. Всего около 313 км и 4 ч 50 мин. Последние километры до каньона узкие,
    частью гравийные и после сильного дождя грязные, поэтому надёжнее машина с высоким клиренсом, например
    внедорожник. Заправьтесь в Мартвили.
fa:
  name: درهٔ بالدا
  short: >-
    شکافی آهکی به درازای ۱٫۴ کیلومتر که رود آباشا کنار صومعهٔ بالدا تراشیده است: باریک، با دیواره‌های
    سبز و بسیار آرام‌تر از درهٔ مارتویلی.
  body: >-
    **حدود شش کیلومتر بالاتر از قایق‌ها و راهروهای درهٔ مارتویلی، همان رود از شکافی آهکی می‌گذرد که پهنایش
    به زحمت به کوچه‌ای روستایی می‌رسد.**


    درهٔ بالدا که از ۲۰۱۳ اثر طبیعی ثبت‌شده است، کنار روستای بالدای دوم در شهرستان مارتویلی و در ارتفاع
    ۲۹۵ متری از سطح دریا قرار دارد؛ جایی که رود آباشا در لبهٔ جنوبی تودهٔ آهکی آسخی فرو رفته است. درازای
    آن ۱٫۴ کیلومتر، پهنایش پنج تا ده متر و ژرفایش ۲۵ تا ۳۰ متر است: بیش از آنکه دره باشد، شکافی است در
    صخره، با دیواره‌هایی خیس و پوشیده از خزه و سرخس. در همان نزدیکی صومعهٔ بالدا، به نام خفتنِ مادر خدا،
    ایستاده است.


    بر لبهٔ دره بایستید: آب در پایین، سبز و زلال، بر سنگی روشن می‌گذرد و آنجا که میان تخته‌سنگ‌ها می‌شکند
    سپید می‌شود. هوای دره از کشتزارهای بالا خنک‌تر است و بوی سنگ خیس می‌دهد.


    سال‌ها بالدا همان بود که مارتویلی پیش از راهروهایش بود: دره‌ای با بازدیدکنندگانی اندک و تقریباً بی‌هیچ
    ساخت‌وسازی. سپس دولت تصمیم گرفت حق توسعه و مدیریت آن را به شرکتی خصوصی بفروشد، و این تصمیم اعتراض
    روستاییان و فعالان محیط زیست را برانگیخت که از ۲۰۲۲ تا ۲۰۲۴ ادامه یافت و معترضان از ضرب‌وشتم خبر دادند.
    هرچه هنگام رسیدن ببینید — گیشهٔ بلیت، مسیرهای تازه یا همان کرانهٔ قدیمیِ بی‌نگهبان — در جایی ایستاده‌اید
    که بر سر آینده‌اش جنگیده‌اند.


    رودهای کارستی زود بالا می‌آیند. پس از باران‌های سنگین و در هنگام آب شدن برف‌های بهاری، آباشا پرزور
    و قهوه‌ای می‌خروشد و بستر رود جای ماندن نیست؛ تا اواخر تابستان جریان فروکش می‌کند و آب زلال می‌شود.


    مارتویلی دره‌ای را به شما نشان می‌دهد. بالدا می‌پرسد که یک دره اصلاً برای چیست.
  tip: >-
    حدود دو ساعت وقت بگذارید. کفشی با کف واقعاً چسبنده بپوشید که خیس شدنش برایتان مهم نباشد؛ سنگ‌های کنار
    آب لغزنده‌اند. در روزهای بارانی و بلافاصله پس از باران وارد بستر رود نشوید و کودکان را در فاصلهٔ یک
    دست از خود نگه دارید. از زمان کشمکش ۲۰۲۲–۲۰۲۴ بر سر مدیریت دره، ترتیبات محل مدام تغییر کرده است؛ پس
    در مارتویلی بپرسید که آیا اکنون ورودیه یا مسیر معینی هست، و آب و خوراک همراه داشته باشید، چون شاید
    آنجا چیزی نباشد. آنتن تلفن در دره ممکن است ضعیف باشد.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب تا حوالی کوتائیسی بروید، به سوی خونی بپیچید و از باندزا تا مارتویلی
    ادامه دهید؛ مسیر قدیمی‌تر از سامتردیا، آباشا و جادهٔ Sh4 اندکی طولانی‌تر است. از مارتویلی ۱۱٫۴ کیلومتر،
    حدود ۲۰ دقیقه، به شمال تا روستاهای بالدای یکم و بالدای دوم راه است. روی هم حدود ۳۱۳ کیلومتر و ۴ ساعت
    و ۵۰ دقیقه. کیلومترهای پایانی تا دره باریک و بخشی شنی‌اند و پس از باران سنگین گل‌آلود می‌شوند؛ برای
    همین خودرویی با ارتفاع بالا مانند شاسی‌بلند انتخاب امن‌تری است. در مارتویلی سوخت بگیرید.
he:
  name: קניון באלדה
  short: 'סדק גיר באורך 1.4 ק״מ שחצב נהר אבאשה ליד מנזר באלדה: צר, בעל קירות ירוקים ושקט בהרבה מקניון
    מרטווילי.'
  body: >-
    **כשישה קילומטרים במעלה הזרם מן הסירות והשבילים המוגבהים של קניון מרטווילי, אותו נהר נדחק בסדק של
    אבן גיר שרוחבו בקושי כשל סמטה כפרית.**


    קניון באלדה, אתר טבע מוגן (מונומנט טבע) מאז 2013, שוכן ליד הכפר באלדה השנייה שבמוניציפליטת מרטווילי,
    295 מטר מעל פני הים, במקום שבו חתר נהר אבאשה בשוליים הדרומיים של מסיב הגיר אסחי. אורכו 1.4 ק״מ, רוחבו
    חמישה עד עשרה מטרים ועומקו 25 עד 30 מטר: פחות עמק ויותר סדק בסלע, שקירותיו רטובים ומכוסים טחב ושרכים.
    בקרבת מקום עומד מנזר באלדה של הירדמות אם האלוהים.


    עמדו על השפה: המים למטה ירוקים וצלולים מעל אבן בהירה, ומלבינים במקום שבו הם נשברים בין הסלעים. האוויר
    בערוץ קריר יותר מאשר בשדות שמעליו, וריחו כריח סלע רטוב.


    במשך שנים הייתה באלדה מה שמרטווילי הייתה לפני השבילים המוגבהים שלה: ערוץ עם מעט מבקרים וכמעט בלי שום
    בנייה. ואז החליטה הממשלה למכור לחברה פרטית את הזכויות לפתח ולנהל אותו, וההחלטה עוררה מחאות של תושבי
    הכפר ושל פעילי סביבה שנמשכו מ-2022 ועד 2024, והמפגינים דיווחו על תקיפות. יהיה אשר יהיה מה שתמצאו כשתגיעו
    — קופה, שבילים חדשים או הגדה הישנה והבלתי שמורה — אתם עומדים במקום שעל עתידו נאבקו.


    נהרות קרסטיים עולים מהר. אחרי גשמים כבדים ובזמן הפשרת השלגים באביב זורם האבאשה בעוצמה ובצבע חום, וערוץ
    הנהר אינו מקום לשהות בו; לקראת סוף הקיץ הזרם יורד והמים מתבהרים.


    מרטווילי מראה לכם קניון. באלדה שואלת בשביל מה בכלל צריך קניון.
  tip: >-
    הקדישו כשעתיים. נעלו נעליים עם אחיזה של ממש, שלא אכפת לכם שיירטבו; הסלע ליד המים חלקלק. בימי גשם ומיד
    אחרי גשם אל תרדו אל ערוץ הנהר, והחזיקו ילדים במרחק הושטת יד. ההסדרים באתר משתנים מאז המחלוקת של 2022–2024
    על ניהולו, לכן שאלו במרטווילי אם יש עכשיו דמי כניסה או מסלול קבוע, והביאו מים ואוכל למקרה שאין דבר
    באתר. הקליטה הסלולרית בערוץ עלולה להיות חלשה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד אזור קותאיסי, פנו לכיוון חוני והמשיכו דרך בנדזה עד מרטווילי; הדרך
    הוותיקה דרך סמטרדיה, אבאשה וכביש Sh4 ארוכה מעט יותר. ממרטווילי 11.4 ק״מ, כ-20 דקות, צפונה אל הכפרים
    באלדה הראשונה ובאלדה השנייה. בסך הכול כ-313 ק״מ ו-4 שעות ו-50 דקות. הקילומטרים האחרונים עד הקניון
    צרים, בחלקם חצץ, ובוציים אחרי גשם כבד, ולכן רכב גבוה כמו רכב שטח הוא הבחירה הבטוחה יותר. תדלקו במרטווילי.
ar:
  name: وادي بالدا
  short: 'شقّ كلسي طوله 1.4 كم حفره نهر أباشا بجوار دير بالدا: ضيق، أخضر الجدران، وأهدأ بكثير من وادي
    مارتفيلي.'
  body: >-
    **على بعد نحو ستة كيلومترات أعلى النهر من قوارب وادي مارتفيلي وممرّاته، يشقّ النهر نفسه طريقه عبر
    صدع كلسي لا يكاد يزيد عرضه على زقاق قروي.**


    يقع وادي بالدا، المُعلَن معلمًا طبيعيًا منذ عام 2013، قرب قرية بالدا الثانية في بلدية مارتفيلي، على
    ارتفاع 295 مترًا فوق سطح البحر، حيث حفر نهر أباشا في الحافة الجنوبية لكتلة أسخي الكلسية. طوله 1.4
    كم، وعرضه بين خمسة وعشرة أمتار، وعمقه 25 إلى 30 مترًا: هو صدع في الصخر أكثر منه واديًا، جدرانه مبتلة
    يكسوها الطحلب والسرخس. وعلى مقربة منه يقوم دير بالدا لرقاد والدة الإله.


    قف على الحافة: الماء في الأسفل أخضر صافٍ فوق حجر فاتح، يبيضّ حيث يتكسّر بين الصخور. والهواء في الوادي
    أبرد منه في الحقول فوقه، وتفوح منه رائحة الصخر المبتل.


    ظلّت بالدا سنوات طويلة على ما كانت عليه مارتفيلي قبل ممرّاتها: وادٍ قليل الزوار يكاد يخلو من أي بناء.
    ثم قررت الحكومة بيع حقوق تطويره وإدارته لشركة خاصة، فأشعل القرار احتجاجات القرويين والناشطين البيئيين
    امتدت من 2022 إلى 2024، وأفاد المحتجون بتعرّضهم لاعتداءات. وأيًّا كان ما تجده عند وصولك — شبّاك تذاكر،
    أو ممرات جديدة، أو الضفة القديمة بلا حراسة — فأنت تقف في مكان دار صراع على مستقبله.


    الأنهار الكارستية ترتفع بسرعة. فبعد الأمطار الغزيرة وفي أثناء ذوبان الثلوج في الربيع يجري أباشا قويًّا
    بنيّ اللون، ولا مكان لأحد في مجرى النهر؛ ومع أواخر الصيف ينخفض التدفق ويصفو الماء.


    مارتفيلي يريك واديًا. أما بالدا فتسألك: لأي شيء وُجد الوادي أصلًا؟
  tip: >-
    خصّص نحو ساعتين. انتعل حذاءً بنعلٍ مانع للانزلاق لا يضيرك أن يبتل؛ فالصخر عند الماء زلق. ابتعد عن
    مجرى النهر في الأيام الماطرة وبعد المطر مباشرة، وأبقِ الأطفال على مسافة ذراع منك. ترتيبات الموقع تتبدل
    منذ النزاع على إدارته في 2022–2024، فاسأل في مارتفيلي إن كانت هناك الآن رسوم دخول أو مسار محدد، واحمل
    الماء والطعام تحسّبًا لعدم وجود شيء في الموقع. قد تكون إشارة الهاتف ضعيفة داخل الوادي.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا حتى منطقة كوتايسي، ثم انعطف نحو خوني وتابع عبر باندزا إلى مارتفيلي؛
    والطريق الأقدم عبر سامتريديا وأباشا والطريق Sh4 أطول قليلًا. ومن مارتفيلي 11.4 كم، نحو 20 دقيقة، شمالًا
    إلى قريتي بالدا الأولى وبالدا الثانية. المجموع نحو 313 كم و4 ساعات و50 دقيقة. الكيلومترات الأخيرة
    إلى الوادي ضيقة، وبعضها مفروش بالحصى، وموحلة بعد المطر الغزير، ولذلك فالسيارة المرتفعة كسيارات الدفع
    الرباعي هي الخيار الأسلم. تزوّد بالوقود في مارتفيلي.
