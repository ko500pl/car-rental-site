ka:
  name: ბერთის მონასტერი
  short: >-
    მონასტერი წალკის წყალსაცავის დასავლეთ ნაპირზე, რომლის მთავარი ტაძარი კარსტულ წყაროზე დგას — იატაკქვეშა
    აუზში კალმახი ცხოვრობს.
  body: >-
    **ბერთაში ტაძარი წყალზე დგას: მთავარი ეკლესიის ქვეშ კარსტული წყარო ამოდის და ქვის აუზში გროვდება,
    სადაც მლოცველთა ფეხქვეშ მდინარის კალმახი დაცურავს.**


    მონასტერი წალკის წყალსაცავის დასავლეთ ნაპირზე, თრიალეთის ზეგანზე, ზღვის დონიდან 1 500 მეტრზე მაღლა
    მდებარეობს; მისი პირველი ეკლესია VI–VII საუკუნეებით თარიღდება. შემდგომი ბედი მას ზეგნის ბედთან ერთად
    ერგო. XIX საუკუნეში წალკელმა პონტოელმა ბერძნებმა ეკლესია აღადგინეს და ბერძნული მართლმადიდებლური წესით
    აკურთხეს. თაობების განმავლობაში ბერძნები ამ მხარის გული იყვნენ; საქართველოს დამოუკიდებლობის შემდეგ
    უმეტესობა წავიდა და დღეს ისინი მუნიციპალიტეტის მოსახლეობის 7 პროცენტზე ნაკლებს შეადგენენ, მოსახლეობა
    კი 1959 წლის დაახლოებით 45 600-დან 20 ათასამდეც აღარ აღწევს. 2004 წელს ბერთაში სამი მღვდელმთავრის
    სახელობის ქართული მართლმადიდებლური მამათა მონასტერი აღდგა — სტავროპიგიული, ანუ უშუალოდ პატრიარქს დაქვემდებარებული.


    აქ წყაროს გამო მოდიან. წყალს ეზოდანაც დაინახავთ და ეკლესიის იატაკში დატოვებული ღიობიდანაც — როგორ
    გროვდება ქვის აუზში. აუზში კალმახი ცხოვრობს და მრავლდება, თუმცა წასვლას არაფერი უშლის. ადგილობრივი
    გადმოცემით, თევზზე შეხება ან წყაროს წყლის დალევა სნეულებას ამსუბუქებს — ეს რწმენაა და არა დაპირება.


    სხვაგან მლოცველები წყაროსკენ მიდიან. ბერთაში წყარო თავად შემოვიდა ეკლესიაში.
  tip: >-
    შესვლა უფასოა, მაგრამ ეს მოქმედი მამათა მონასტერია: კაცებს გრძელი შარვალი, ქალებს ქვედაბოლო და თავსაფარი,
    ხმადაბლა საუბარი; ბერების ან წყაროს გადაღებამდე ნებართვა ითხოვეთ. თუ კალმახზე შეხების ჩვეულების აღსრულება
    გსურთ, ჯერ ბერს ჰკითხეთ და წყალში ხელს თვითნებურად ნუ ჩაყოფთ. დაახლოებით ერთი საათი დაგჭირდებათ. 1
    500 მეტრზე მაღლა ზაფხულშიც გრილა — თბილი ტანსაცმელი წაიღეთ. წალკის შემდეგ ვერაფერს იყიდით: ჭამეთ და
    საწვავი ჩაასხით იქ (ქალაქში ხშირად რესტორან „პონტიას“ ურჩევენ). საყდრიონის ქარვასლის ნანგრევები, რომლებსაც
    გზად ჩაუვლით, ბუნებრივი მეორე გაჩერებაა.
  route: >-
    თბილისიდან წყნეთის გავლით შ36 გზაზე (თბილისი — მანგლისი) გადით, შემდეგ შ31-ით მანგლისზე გაიარეთ და
    თრიალეთის ზეგნით წალკამდე მიდით — დაახლოებით 85 კმ ასფალტია, გრძელი აღმართით. წალკიდან შ31-ზე დარჩით
    და წყალსაცავის გასწვრივ დასავლეთით დაახლოებით 16 კმ იარეთ, საყდრიონს ჩაუარეთ, შემდეგ კი სოფლის გზაზე
    გადაუხვიეთ — ბერთამდე ბოლო 5–6 კმ-ია. ეს მონაკვეთი მოუასფალტებელია და წვიმის შემდეგ ღრმად არის დაღარული.
    სულ 114 კმ, დაახლოებით 2 სთ 15 წთ. აიღეთ SUV: გრუნტზე კლირენსი მნიშვნელოვანია, მაისიდან ოქტომბრამდე
    პერიოდის გარეთ კი ტალახი და თოვლი ეკონომ-კლასის მანქანისთვის გზა შეიძლება სრულიად გაუვალი გახადოს.
    ბოლო ბენზინგასამართი წალკაშია.
en:
  name: Berta Monastery
  short: >-
    A monastery on the western shore of Tsalka Reservoir whose main church stands over a karst spring
    — with trout living in the pool beneath the floor.
  body: >-
    **At Berta the church stands on water: a karst spring rises beneath the main church and gathers in
    a stone basin where river trout swim below the feet of the faithful.**


    The monastery sits on the western shore of the Tsalka Reservoir, more than 1,500 metres up on the
    Trialeti plateau, and its first church is dated to the 6th–7th centuries. Its later life follows the
    fortunes of the plateau. In the 19th century the Pontic Greeks of Tsalka restored it and consecrated
    it as a Greek Orthodox church. For generations Greeks were the heart of this district; after Georgian
    independence most of them left, and today they are under 7 per cent of a municipality whose population
    has shrunk from about 45,600 in 1959 to under 20,000. In 2004 Berta was re-established as a Georgian
    Orthodox monastery for men, dedicated to the Three Holy Hierarchs and stauropegial — answering directly
    to the Patriarch.


    The spring is the reason to come. You can see the water from the courtyard, or through an opening
    in the church floor, collecting in its stone basin. Trout live and breed in the pool, though nothing
    stops them swimming away. Local tradition holds that touching the fish, or drinking the water, eases
    illness — a belief, not a promise.


    Elsewhere, pilgrims walk to the spring. At Berta, the spring came into the church.
  tip: >-
    Entry is free, but this is a working men's monastery: long trousers for men, a skirt and headscarf
    for women, quiet voices, and ask before photographing the monks or the spring. If you want to follow
    the custom of touching the trout, ask a monk first rather than reaching in. Allow about an hour. At
    over 1,500 metres the plateau is cool even in summer, so pack a warm layer. There is nothing to buy
    beyond Tsalka — eat and fill up there (the Pontia restaurant in town is a common tip). Sakdrioni's
    caravanserai ruins, which you pass on the way, make a natural second stop.
  route: >-
    Leave Tbilisi through Tskneti on the Sh36 Tbilisi–Manglisi road, then continue on the Sh31 through
    Manglisi, across the Trialeti highlands, to Tsalka — roughly 85 km of asphalt with a long climb. From
    Tsalka stay on the Sh31 west along the reservoir for about 16 km, passing Sakdrioni, then turn off
    onto the village road for the last 5–6 km to Berta; this final stretch is unpaved and deeply rutted
    after rain. In all, 114 km and about 2 h 15 min. Take an SUV: the clearance matters on the dirt, and
    outside May–October mud and snow can make it impassable for an economy car. Last fuel is in Tsalka.
ru:
  name: Монастырь Берта
  short: >-
    Монастырь на западном берегу Цалкского водохранилища: главный храм стоит над карстовым источником,
    а под его полом живёт форель.
  body: >-
    **В Берте церковь стоит на воде: под главным храмом бьёт карстовый источник и собирается в каменной
    чаше, где под ногами молящихся плавает речная форель.**


    Монастырь стоит на западном берегу Цалкского водохранилища, на высоте более 1500 метров, на Триалетском
    плато; его первую церковь относят к VI–VII векам. Дальнейшая его жизнь повторяет судьбу плато. В XIX
    веке понтийские греки Цалки восстановили его и освятили как греческую православную церковь. Поколениями
    греки были сердцем этого края; после обретения Грузией независимости большинство из них уехало, и
    сегодня они составляют меньше 7 процентов населения муниципалитета, которое сократилось примерно с
    45 600 человек в 1959 году до неполных 20 тысяч. В 2004 году Берта была вновь учреждена как мужской
    монастырь Грузинской православной церкви во имя Трёх Святителей — ставропигиальный, то есть подчинённый
    непосредственно Патриарху.


    Источник — вот ради чего стоит ехать. Воду видно со двора или через отверстие в полу церкви: она собирается
    в каменной чаше. Форель живёт и нерестится в этом водоёме, хотя ничто не мешает ей уплыть. Местное
    предание гласит, что прикосновение к рыбе или глоток воды облегчают болезнь, — это вера, а не обещание.


    В других местах паломники идут к источнику. В Берте источник сам пришёл в церковь.
  tip: >-
    Вход бесплатный, но это действующий мужской монастырь: мужчинам — длинные брюки, женщинам — юбка и
    платок, говорить тихо, а перед тем как фотографировать монахов или источник, спросить разрешения.
    Если хотите последовать обычаю и коснуться форели, сначала спросите монаха, а не опускайте руку в
    воду сами. Закладывайте около часа. На высоте более 1500 метров на плато прохладно даже летом, так
    что возьмите тёплую одежду. Дальше Цалки ничего не купить — поешьте и заправьтесь там (частый совет
    — ресторан «Понтия» в городе). Руины караван-сарая в Сакдриони, мимо которых вы проедете, — естественная
    вторая остановка.
  route: >-
    Выезжайте из Тбилиси через Цхнети по дороге Sh36 Тбилиси — Манглиси, затем продолжайте по Sh31 через
    Манглиси и Триалетское нагорье до Цалки — около 85 км асфальта с долгим подъёмом. От Цалки держитесь
    Sh31 на запад вдоль водохранилища около 16 км, мимо Сакдриони, затем сверните на сельскую дорогу и
    проедьте последние 5–6 км до Берты; этот отрезок без покрытия, после дождя он в глубоких колеях. Всего
    114 км и около 2 ч 15 мин. Берите внедорожник: на грунтовке важен клиренс, а за пределами сезона (май
    — октябрь) грязь и снег могут сделать дорогу непроходимой для машины эконом-класса. Последняя заправка
    — в Цалке.
fa:
  name: صومعه برتا
  short: >-
    صومعه‌ای بر کرانه غربی دریاچه سد تسالکا که کلیسای اصلی‌اش بر فراز چشمه‌ای کارستی ایستاده — و قزل‌آلاها
    در حوضچه زیر کف آن زندگی می‌کنند.
  body: >-
    **در برتا کلیسا بر آب ایستاده است: چشمه‌ای کارستی از زیر کلیسای اصلی می‌جوشد و در حوضی سنگی گرد می‌آید،
    جایی که قزل‌آلاهای رودخانه‌ای زیر پای مؤمنان شنا می‌کنند.**


    صومعه بر کرانه غربی دریاچه سد تسالکا، در ارتفاع بیش از ۱۵۰۰ متری فلات تریالتی قرار دارد و نخستین کلیسایش
    را به سده‌های ششم و هفتم نسبت می‌دهند. سرگذشت بعدی‌اش با سرنوشت فلات گره خورده است. در سده نوزدهم
    یونانیان پونتیِ تسالکا آن را بازسازی کردند و به‌عنوان کلیسای ارتدکس یونانی تقدیس کردند. نسل‌ها یونانیان
    قلب این ناحیه بودند؛ پس از استقلال گرجستان بیشترشان رفتند، و امروز کمتر از ۷ درصد جمعیت شهرستانی را
    تشکیل می‌دهند که شمار ساکنانش از حدود ۴۵٬۶۰۰ نفر در ۱۹۵۹ به کمتر از ۲۰ هزار نفر رسیده است. در سال
    ۲۰۰۴ برتا دوباره به‌عنوان صومعه‌ای مردانه از کلیسای ارتدکس گرجستان به نام سه اسقف مقدس (باسیل، گریگوری
    و یوحنای زرین‌دهان) بنیان گرفت، صومعه‌ای «استاوروپگیال» که مستقیماً زیر نظر پاتریارک است.


    چشمه دلیل آمدن است. آب را می‌توان از حیاط، یا از دریچه‌ای در کف کلیسا، دید که در حوض سنگی‌اش گرد می‌آید.
    قزل‌آلاها در این حوضچه زندگی و تخم‌ریزی می‌کنند، هرچند چیزی مانع رفتنشان نیست. بنا بر باوری محلی،
    لمس ماهی‌ها یا نوشیدن این آب بیماری را تسکین می‌دهد — این یک باور است، نه یک وعده.


    در جاهای دیگر، زائران به سوی چشمه می‌روند. در برتا، چشمه به درون کلیسا آمده است.
  tip: >-
    ورود رایگان است، اما این صومعه‌ای فعال و مردانه است: شلوار بلند برای آقایان، دامن و روسری برای بانوان؛
    آهسته سخن بگویید و پیش از عکاسی از راهبان یا چشمه اجازه بگیرید. اگر می‌خواهید از رسمِ لمس قزل‌آلاها
    پیروی کنید، به‌جای آن‌که خودتان دست در آب ببرید، نخست از یکی از راهبان بپرسید. حدود یک ساعت وقت بگذارید.
    در ارتفاع بیش از ۱۵۰۰ متر، فلات حتی در تابستان خنک است، پس یک لایه لباس گرم همراه داشته باشید. پس
    از تسالکا چیزی برای خرید نیست — همان‌جا غذا بخورید و سوخت‌گیری کنید (رستوران «پونتیا» در شهر پیشنهادی
    رایج است). ویرانه‌های کاروانسرای ساکدریونی، که در راه از کنارشان می‌گذرید، ایستگاه دوم طبیعی است.
  route: >-
    از تفلیس از راه تسکنتی و جاده Sh36 تفلیس–مانگلیسی بیرون بروید، سپس روی Sh31 از مانگلیسی و ارتفاعات
    تریالتی تا تسالکا ادامه دهید — حدود ۸۵ کیلومتر آسفالت با سربالایی‌ای طولانی. از تسالکا حدود ۱۶ کیلومتر
    روی Sh31 به سوی غرب و در امتداد دریاچه برانید، از ساکدریونی بگذرید، سپس به جاده روستایی بپیچید و ۵
    تا ۶ کیلومتر پایانی را تا برتا بروید؛ این بخش آسفالت ندارد و پس از باران شیارهای عمیق برمی‌دارد. روی‌هم‌رفته
    ۱۱۴ کیلومتر و حدود ۲ ساعت و ۱۵ دقیقه. خودروی شاسی‌بلند بگیرید: در جاده خاکی فاصله از زمین اهمیت دارد،
    و بیرون از بازه مه تا اکتبر، گل و برف می‌تواند راه را برای خودروی سواری معمولی ناگذر کند. آخرین جایگاه
    سوخت در تسالکاست.
he:
  name: מנזר ברטה
  short: >-
    מנזר על החוף המערבי של מאגר צאלקה, שהכנסייה הראשית שלו עומדת מעל מעיין קארסטי — ובבריכה שמתחת לרצפה
    חיים פורלים.
  body: >-
    **בברטה הכנסייה עומדת על מים: מעיין קארסטי נובע מתחת לכנסייה הראשית ונקווה באגן אבן, שבו שוחים פורלי
    נהר מתחת לרגלי המתפללים.**


    המנזר שוכן על החוף המערבי של מאגר צאלקה, בגובה של יותר מ-1,500 מטר ברמת טריאלטי, והכנסייה הראשונה
    שלו מתוארכת למאות ה-6–7. תולדותיו המאוחרות הולכות בעקבות גורל הרמה. במאה ה-19 שיקמו אותו היוונים הפונטיים
    של צאלקה והקדישו אותו ככנסייה יוונית-אורתודוקסית. במשך דורות היו היוונים לב המחוז הזה; אחרי עצמאות
    גאורגיה עזבו רובם, והיום הם פחות מ-7 אחוזים מאוכלוסיית המוניציפליה, שמספר תושביה ירד מכ-45,600 ב-1959
    לפחות מ-20,000. ב-2004 חודש ברטה כמנזר גברים של הכנסייה האורתודוקסית הגאורגית, על שם שלושת ההיררכים
    הקדושים, מנזר סטברופגי — כלומר כפוף ישירות לפטריארך.


    המעיין הוא הסיבה לבוא. אפשר לראות את המים מהחצר, או דרך פתח ברצפת הכנסייה, כשהם נאספים באגן האבן.
    פורלים חיים ומתרבים בבריכה, אף שדבר אינו מונע מהם לשחות משם. מסורת מקומית אומרת שנגיעה בדגים, או שתיית
    המים, מקלה על מחלות — אמונה, לא הבטחה.


    במקומות אחרים עולי הרגל הולכים אל המעיין. בברטה, המעיין בא אל הכנסייה.
  tip: >-
    הכניסה חופשית, אבל זהו מנזר גברים פעיל: מכנסיים ארוכים לגברים, חצאית וכיסוי ראש לנשים, דיבור שקט,
    ובקשו רשות לפני שמצלמים את הנזירים או את המעיין. אם תרצו לנהוג לפי המנהג ולגעת בפורלים, שאלו קודם
    נזיר ואל תכניסו יד למים על דעת עצמכם. הקדישו כשעה. בגובה של יותר מ-1,500 מטר הרמה קרירה גם בקיץ, אז
    קחו בגד חם. אחרי צאלקה אין מה לקנות — אכלו ותדלקו שם (מסעדת "פונטיה" בעיר היא המלצה נפוצה). חורבות
    הח'אן (הקרוונסראי) בסקדריוני, שעל פניהן תעברו בדרך, הן תחנה שנייה טבעית.
  route: >-
    צאו מטביליסי דרך צחנטי בכביש Sh36 טביליסי–מנגליסי, והמשיכו בכביש Sh31 דרך מנגליסי ורמות טריאלטי עד
    צאלקה — כ-85 ק"מ של אספלט עם עלייה ארוכה. מצאלקה הישארו על Sh31 מערבה לאורך המאגר כ-16 ק"מ, עברו את
    סקדריוני, ואז פנו לדרך הכפר ל-5–6 הק"מ האחרונים עד ברטה; הקטע הזה אינו סלול, ואחרי גשם הוא מתמלא חריצים
    עמוקים. בסך הכול 114 ק"מ וכשעתיים ורבע. קחו רכב שטח: בדרך העפר מרווח הגחון חשוב, ומחוץ לעונת מאי–אוקטובר
    בוץ ושלג עלולים להפוך את הדרך לבלתי עבירה לרכב פרטי רגיל. תחנת הדלק האחרונה בצאלקה.
ar:
  name: دير بيرتا
  short: >-
    دير على الضفة الغربية لخزان تسالكا، تقوم كنيسته الرئيسية فوق نبع كارستي، وتعيش أسماك التروتة في البركة
    تحت أرضيتها.
  body: >-
    **في بيرتا تقوم الكنيسة على الماء: ينبثق نبع كارستي تحت الكنيسة الرئيسية ويتجمع في حوض حجري تسبح فيه
    أسماك التروتة النهرية تحت أقدام المصلّين.**


    يقع الدير على الضفة الغربية لخزان تسالكا، على ارتفاع يزيد على 1,500 متر على هضبة تريالتي، وتعود كنيسته
    الأولى إلى القرنين السادس والسابع. أما حياته اللاحقة فتتبع مصائر الهضبة. ففي القرن التاسع عشر رمّمه
    اليونانيون البنطيون في تسالكا وكرّسوه كنيسةً أرثوذكسية يونانية. وظل اليونانيون أجيالًا قلبَ هذه المنطقة؛
    وبعد استقلال جورجيا غادر معظمهم، وهم اليوم أقل من 7 في المئة من سكان بلدية تراجع عدد سكانها من نحو
    45,600 عام 1959 إلى أقل من 20 ألفًا. وفي عام 2004 أُعيد تأسيس بيرتا ديرًا للرجال على اسم الأقمار الثلاثة،
    تابعًا للكنيسة الأرثوذكسية الجورجية، وهو دير ستافروبيجي، أي خاضع مباشرةً للبطريرك.


    النبع هو سبب المجيء. يمكنك أن ترى الماء من الفناء، أو من فتحة في أرضية الكنيسة، وهو يتجمع في حوضه
    الحجري. تعيش أسماك التروتة في البركة وتتكاثر فيها، مع أنه لا شيء يمنعها من السباحة بعيدًا. ويقول تقليد
    محلي إن لمس الأسماك أو شرب الماء يخفف المرض — وهذا معتقد، لا وعد.


    في أماكن أخرى يسير الحجاج إلى النبع. أما في بيرتا، فقد جاء النبع إلى الكنيسة.
  tip: >-
    الدخول مجاني، لكن هذا دير رجالي عامر بالرهبان: سراويل طويلة للرجال، وتنورة وغطاء رأس للنساء، وأصوات
    خافتة، واستأذن قبل تصوير الرهبان أو النبع. وإن أردت اتباع عادة لمس أسماك التروتة، فاسأل أحد الرهبان
    أولًا بدل أن تمد يدك إلى الماء. خصّص نحو ساعة. على ارتفاع يزيد على 1,500 متر تبقى الهضبة باردة حتى
    في الصيف، فاحمل طبقة ملابس دافئة. لا شيء يُشترى بعد تسالكا، فتناول طعامك واملأ خزان الوقود هناك (ومطعم
    «بونتيا» في البلدة توصية شائعة). وتشكّل أطلال خان القوافل في ساكدريوني، التي تمر بها في الطريق، محطة
    ثانية طبيعية.
  route: >-
    اخرج من تبليسي عبر تسخنيتي على طريق Sh36 تبليسي – مانغليسي، ثم تابع على Sh31 عبر مانغليسي ومرتفعات
    تريالتي حتى تسالكا — نحو 85 كم من الإسفلت مع صعود طويل. ومن تسالكا ابقَ على Sh31 غربًا بمحاذاة الخزان
    نحو 16 كم، مرورًا بساكدريوني، ثم انعطف إلى طريق القرية لتقطع آخر 5–6 كم حتى بيرتا؛ هذا المقطع غير
    معبّد وتحفر فيه الأمطار أخاديد عميقة. المجموع 114 كم ونحو ساعتين و15 دقيقة. خذ سيارة دفع رباعي: فالخلوص
    الأرضي مهم على الطريق الترابي، وخارج الفترة من مايو إلى أكتوبر قد يجعل الوحل والثلج الطريق غير سالك
    لسيارة ركاب عادية. آخر محطة وقود في تسالكا.
