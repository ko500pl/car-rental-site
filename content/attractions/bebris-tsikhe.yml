ka:
  name: ბებრისციხე
  short: >-
    უძველესი ციხე არაგვის თავზე, მცხეთის ჩრდილოეთ კარიბჭესთან, სადაც 1156 წელს მეფე დემეტრე I გარდაიცვალა
    — უფასო, ღობის გარეშე, ცის ქვეშ.
  body: >-
    **გადმოცემით, ბებრისციხეს სახელი ერთი თეთრწვერა მოხუცის გამო შეარქვეს — და ეს ამბავი და-ძმასა და მთელი
    სიცოცხლის მანძილზე შენახულ აღთქმას ეხება.**


    ციხე არაგვის მარჯვენა ნაპირზე, მცხეთის ჩრდილოეთ კიდეზე, შემაღლებულ კონცხზე დგას, იქ, სადაც ხეობა ვიწროვდება
    — ძველი დედაქალაქის ჩრდილოეთ კარის კლიტე. ძველად მას ბელტისციხესა და ნაციხვარს ეძახდნენ. XVIII საუკუნეში
    ვახუშტი ბატონიშვილმა მისი აშენება ქართლის ერისთავ არდამს მიაწერა, ლაშა-გიორგის დროინდელი მემატიანე
    კი გვამცნობს, რომ მეფე დემეტრე I, დავით აღმაშენებლის ძე, 1156 წელს ბელტისციხეში გარდაიცვალა და გელათში
    დაკრძალეს. 2006–2008 წლების არქეოლოგიურმა გათხრებმა აჩვენა, რომ ციხე IV საუკუნიდან XVIII საუკუნის
    ჩათვლით მოქმედებდა. ზოგი მკვლევარი აქ სტრაბონის მიერ მოხსენიებულ ქალაქ სევსამორასაც კი ხედავს.


    დღეს აქ თითქმის სამკუთხა ციტადელი დგას, სამხრეთით პატარა ეზოთი და სამივე კუთხეში კოშკებით. ყველაზე
    დიდი, სამხრეთ-აღმოსავლეთის კოშკი რამდენიმესართულიანი იყო და თავდაცვასთან ერთად საცხოვრებლადაც ემსახურებოდა.
    ორ-სამმეტრიან კედლებში საბრძოლო ხვრელები ღრმა ნიშებშია ჩაჭრილი — სხვაგვარად მშვილდოსანი ამ სისქის
    ქვაში ვერ ისროლებდა. დანგრეული აღმოსავლეთის კოშკის ადგილას მოგვიანებით მრგვალი საგუშაგო კოშკი აუგიათ.


    გადმოცემა ასეთია: თავად სიმონის ასულმა მაკრინემ გულქვა ძმას, მამუკას, ყმებისთვის დაკისრებული მძიმე
    ხარკის მოხსნა სთხოვა, განრისხებულმა მამუკამ კი და კოშკში გამოკეტა. როცა გლეხების ქვაბიდან გველები
    ამოცვივდნენ და მამუკას შემოეხვივნენ, მან ღმერთს ეკლესიის აშენება აღუთქვა; მერე და მონაზვნად აღიკვეცა,
    ძმა — ბერად. სამოცდაათი წლის მაკრინეს დაკრძალვაზე თეთრწვერა მოხუცი მივიდა, შუბლზე ეამბორა, თქვა: „დაო
    ჩემო, ჩვენ შევასრულეთ ჩვენი აღთქმა“ — და იქვე სული განუტევა.


    კედლებიდან არაგვის ვიწრო ხეობას დახედეთ: ციხე რატომ აქ დადგა, ამას ვერც ერთი დაფა ისე ვერ აგიხსნით,
    როგორც თავად ხეობა.
  tip: >-
    შესვლა უფასოა; ღობე, ჭიშკარი და სალარო არ არის, ამიტომ დღის ნებისმიერ საათს შეგიძლიათ მოხვიდეთ. ფრთხილად:
    ქვის წყობა ადგილ-ადგილ მორყეულია, მოაჯირები არ არის — პატარა ბავშვებს ხელი არ გაუშვათ. დახურული ფეხსაცმელი
    ჩაიცვით: ბილიკი მოკლეა, მაგრამ ციცაბო და მოსრიალე. საღამოს შუქი ქვასაც და ქვემოთ ხეობასაც ყველაზე
    ლამაზად ეფინება. ადგილზე არანაირი ინფრასტრუქტურა არ არის; კაფე და ტუალეტი მცხეთის ცენტრშია, დაახლოებით
    2 კილომეტრში. სვეტიცხოველთან და სამთავროსთან ერთად ნახევარდღიანი მარშრუტი მარტივად გამოდის.
  route: >-
    თბილისის ცენტრიდან S1 (E60) გზით მტკვრის აყოლებით მცხეთისკენ წადით და მცხეთის გასასვლელზე შ29 გზით
    ქალაქში შედით. ცენტრი გაიარეთ და ჩრდილოეთისკენ დავით აღმაშენებლის ქუჩას გაჰყევით — მცხეთიდან გამავალ
    ძველ გზას; ციხე ქალაქის ჩრდილოეთ კიდეზე, მარჯვნივ, კონცხზე აღიმართება. სულ დაახლოებით 27 კმ და 30–35
    წუთი, მთლიანად ასფალტი — ნებისმიერი მანქანა გამოდგება. მანქანა გორაკის ძირში, გზისპირას ისე გააჩერეთ,
    რომ მოძრაობას არ შეუშალოთ, ზემოთ კი მოკლე, ციცაბო ბილიკით ხუთ-ათ წუთში ახვალთ.
en:
  name: Bebris Tsikhe Fortress
  short: >-
    An ancient fortress on a spur above the Aragvi at Mtskheta's northern gate, where King Demetre I died
    in 1156 — free, unfenced and open to the sky.
  body: >-
    **Bebris Tsikhe means "the Old Man's Fortress", and the name comes with a story: a brother, a sister
    and a vow kept for a lifetime.**


    The fortress sits on a spur on the right bank of the Aragvi, at the northern edge of Mtskheta, where
    the valley narrows — the lock on the ancient capital's northern door. Its older names were Beltistsikhe
    and Natsikhvari. The 18th-century scholar Vakhushti Bagrationi credited it to Ardam, an early eristavi
    of Kartli, and a chronicler of Lasha-Giorgi's time records that King Demetre I, son of David the Builder,
    died at Beltistsikhe in 1156 and was carried to Gelati for burial. Excavations in 2006–2008 showed
    the stronghold in use from the 4th century to the 18th. Some scholars have even identified it with
    Seusamora, a fortified town named by Strabo.


    What stands today is a roughly triangular citadel with a small courtyard to the south and towers at
    the three corners. The south-eastern tower, the largest, rose several storeys and was lived in as
    well as defended. In walls two to three metres thick, the loopholes sit at the back of deep niches
    — the only way an archer could shoot through that much stone. A later round watchtower stands where
    the eastern tower fell.


    The legend: Prince Simon's daughter Makrine begged her hard-hearted brother Mamuka to lift a crushing
    tax, and he locked her in the tower. When snakes poured from a peasants' cauldron and coiled around
    him, Mamuka vowed to build a church; brother and sister took monastic vows. At Makrine's funeral,
    when she was seventy, a white-bearded old man kissed her brow, said "My sister, we have kept our vow"
    — and died on the spot.


    Look down from the walls: the narrow valley explains the fortress better than any plaque.
  tip: >-
    Entry is free, and there is no fence, gate or ticket office, so any daylight hour will do. Take care:
    some of the masonry is loose and there are no railings, so hold small children by the hand. Wear closed
    shoes — the path up is short but steep and slippery. Late-afternoon light is kindest to the stone
    and to the valley below. There are no facilities at all; cafés and toilets are in central Mtskheta,
    about 2 km south. Svetitskhoveli and Samtavro make it an easy half-day.
  route: >-
    From central Tbilisi take the S1 (E60) along the Mtkvari towards Mtskheta and leave it at the Mtskheta
    exit onto the Sh29 into town. Cross the centre and head north on Davit Aghmashenebeli Street, the
    old road out of Mtskheta; the fortress rises on the spur to your right at the northern edge of town.
    About 27 km and 30–35 minutes, asphalt all the way — any car will do. Park considerately on the roadside
    at the foot of the hill, then climb the short, steep path on foot in five to ten minutes.
ru:
  name: Крепость Бебрисцихе
  short: >-
    Древняя крепость на отроге над Арагви у северных ворот Мцхеты, где в 1156 году умер царь Деметре I,
    — бесплатная, без ограды, открытая небу.
  body: >-
    **Бебрисцихе значит «крепость старика», и у этого имени есть история: брат, сестра и обет, который
    они хранили всю жизнь.**


    Крепость стоит на отроге правого берега Арагви, на северной окраине Мцхеты, там, где долина сужается,
    — засов на северных воротах древней столицы. Прежде её называли Бельтисцихе и Нацихвари. Учёный XVIII
    века Вахушти Багратиони приписывал её постройку Ардаму, одному из ранних эриставов Картли, а летописец
    времён Лаши-Георгия сообщает, что царь Деметре I, сын Давида Строителя, умер в Бельтисцихе в 1156
    году и был отвезён для погребения в Гелати. Раскопки 2006–2008 годов показали, что крепостью пользовались
    с IV по XVIII век. Некоторые исследователи даже отождествляют её с Севсаморой — укреплённым городом,
    который упоминает Страбон.


    Сегодня здесь стоит цитадель почти треугольного плана с небольшим двором на юге и башнями по трём
    углам. Юго-восточная башня, самая крупная, поднималась на несколько этажей: в ней не только оборонялись,
    но и жили. В стенах толщиной два-три метра бойницы спрятаны в глубине ниш — иначе лучнику было бы
    не выстрелить сквозь такую толщу камня. Там, где обрушилась восточная башня, позже поставили круглую
    сторожевую.


    Легенда такова: Макрине, дочь князя Симона, умоляла жестокосердного брата Мамуку отменить непосильный
    налог, и он запер её в башне. Когда из крестьянского котла хлынули змеи и обвились вокруг него, Мамука
    дал обет построить церковь; брат и сестра приняли монашество. На похоронах семидесятилетней Макрине
    седобородый старик поцеловал её в лоб, сказал: «Сестра моя, мы сдержали обет», — и тут же умер.


    Посмотрите со стен вниз: узкая долина объясняет крепость лучше любой таблички.
  tip: >-
    Вход свободный: ни ограды, ни ворот, ни кассы, так что подойдёт любой светлый час. Будьте осторожны:
    часть кладки шатается, перил нет, маленьких детей держите за руку. Наденьте закрытую обувь — тропа
    наверх короткая, но крутая и скользкая. Предвечерний свет ласковее всего и к камню, и к долине внизу.
    Никаких удобств нет; кафе и туалеты — в центре Мцхеты, примерно в 2 км к югу. Вместе со Светицховели
    и Самтавро выходит лёгкая поездка на полдня.
  route: >-
    Из центра Тбилиси поезжайте по S1 (E60) вдоль Мтквари в сторону Мцхеты и на мцхетском съезде уходите
    на Sh29, в город. Пересеките центр и держите на север по улице Давида Агмашенебели — старой дороге
    из Мцхеты; крепость поднимается на отроге справа, на северной окраине города. Около 27 км и 30–35
    минут, всю дорогу асфальт — подойдёт любая машина. Аккуратно припаркуйтесь на обочине у подножия холма
    и поднимитесь пешком по короткой крутой тропе: пять-десять минут.
fa:
  name: دژ ببریس‌تسیخه
  short: >-
    دژی کهن بر پشته‌ای بالای رود آراگوی، بر دروازهٔ شمالی متسختا، جایی که شاه دیمتره یکم در ۱۱۵۶ درگذشت
    — رایگان، بی‌حصار و گشوده به آسمان.
  body: >-
    **ببریس‌تسیخه یعنی «دژ پیرمرد»، و این نام قصه‌ای با خود دارد: یک برادر، یک خواهر و پیمانی که یک عمر
    به آن وفادار ماندند.**


    دژ بر پشته‌ای در کرانهٔ راست آراگوی، در لبهٔ شمالی متسختا، آنجا که دره تنگ می‌شود، نشسته است — قفلی
    بر درِ شمالی پایتخت کهن. نام‌های قدیمی‌ترش بلتیس‌تسیخه و ناتسیخواری بود. واخوشتی باگراتیونی، دانشمند
    سدهٔ هجدهم، ساخت آن را به آردام، از نخستین اریستاوهای (فرمانروایان) کارتلی، نسبت می‌داد، و وقایع‌نگاری
    از روزگار لاشا-گیورگی ثبت کرده که شاه دیمتره یکم، پسر داوید سازنده، در سال ۱۱۵۶ در بلتیس‌تسیخه درگذشت
    و پیکرش را برای خاک‌سپاری به گلاتی بردند. کاوش‌های سال‌های ۲۰۰۶ تا ۲۰۰۸ نشان داد که این دژ از سدهٔ
    چهارم تا سدهٔ هجدهم به کار می‌رفته است. برخی پژوهشگران حتی آن را همان سئوسامورا می‌دانند، شهر باروداری
    که استرابون از آن نام برده است.


    آنچه امروز برجاست ارگی کمابیش سه‌گوش است با حیاطی کوچک در جنوب و برج‌هایی در سه گوشه. برج جنوب‌شرقی،
    که از همه بزرگ‌تر است، چند طبقه ارتفاع داشت و هم جای دفاع بود و هم جای زندگی. در دیوارهایی به ستبرای
    دو تا سه متر، تیرکش‌ها در ته طاقچه‌های ژرف جا گرفته‌اند — تنها راهی که کمانداری بتواند از میان این‌همه
    سنگ تیر بیندازد. جایی که برج شرقی فرو ریخت، اکنون برج دیده‌بانی گردی ایستاده که بعدها ساخته شد.


    افسانه چنین است: ماکرینه، دختر شاهزاده سیمون، به برادر سنگ‌دلش ماموکا التماس کرد که مالیاتی کمرشکن
    را بردارد، و او خواهر را در برج زندانی کرد. وقتی مارها از دیگ دهقانان بیرون ریختند و به دور او پیچیدند،
    ماموکا نذر کرد کلیسایی بسازد؛ خواهر و برادر هر دو ترک دنیا کردند و به رهبانیت درآمدند. در مراسم خاک‌سپاری
    ماکرینه، که در هفتادسالگی درگذشت، پیرمردی سپیدریش پیشانی‌اش را بوسید، گفت «خواهرم، ما به پیمانمان
    وفا کردیم» — و همان‌جا جان داد.


    از بالای دیوارها پایین را نگاه کنید: درهٔ تنگ دژ را بهتر از هر تابلویی توضیح می‌دهد.
  tip: >-
    ورود رایگان است و نه حصاری هست، نه دروازه‌ای و نه باجهٔ بلیتی، پس هر ساعتی از روز مناسب است. مراقب
    باشید: بخشی از سنگ‌چین لق است و نرده‌ای در کار نیست، پس دست کودکان خردسال را بگیرید. کفش بسته بپوشید
    — راه بالا کوتاه اما پرشیب و لغزنده است. نور پایان بعدازظهر با سنگ و درهٔ پایین از همه مهربان‌تر است.
    هیچ امکاناتی نیست؛ کافه و سرویس بهداشتی در مرکز متسختا است، حدود ۲ کیلومتر به سمت جنوب. همراه با سوتیتسخوولی
    و سامتاورو، گردشی آسان برای نیم روز می‌شود.
  route: >-
    از مرکز تفلیس جادهٔ S1 (E60) را در امتداد رود متکواری به سوی متسختا بگیرید و در خروجی متسختا وارد
    جادهٔ Sh29 شوید تا به شهر برسید. از مرکز شهر بگذرید و از خیابان داویت آغماشنبلی، راه قدیمی خروج از
    متسختا، به سمت شمال بروید؛ دژ بر پشته‌ای در سمت راستتان، در لبهٔ شمالی شهر، سر برمی‌آورد. حدود ۲۷
    کیلومتر و ۳۰ تا ۳۵ دقیقه، تمام راه آسفالت — هر خودرویی از پسش برمی‌آید. با ملاحظه کنار جاده در پای
    تپه پارک کنید و مسیر کوتاه و پرشیب را در پنج تا ده دقیقه پیاده بالا بروید.
he:
  name: מבצר בבריס ציחה
  short: >-
    מבצר עתיק על שלוחה מעל נהר האראגווי, בשער הצפוני של מצחתה, שבו מת המלך דמטרה הראשון ב-1156 — הכניסה
    חינם, בלי גדר, פתוח לשמיים.
  body: >-
    **בבריס ציחה פירושו "מבצר הזקן", והשם מגיע עם סיפור: אח, אחות ונדר שנשמר כל החיים.**


    המבצר יושב על שלוחה בגדה הימנית של האראגווי, בשוליה הצפוניים של מצחתה, במקום שבו העמק מצטמצם — המנעול
    שעל דלתה הצפונית של הבירה העתיקה. שמותיו הקדומים היו בלטיס ציחה ונאציחווארי. המלומד בן המאה ה-18 ואחושטי
    בגרטיוני ייחס את בנייתו לארדם, מן האריסטאווים (מושלי המחוזות) הראשונים של קרטלי, וכרוניקן מימי לשה-גיורגי
    מתעד שהמלך דמטרה הראשון, בנו של דוד הבונה, מת בבלטיס ציחה ב-1156 וגופתו הובאה לקבורה בגלאתי. חפירות
    בשנים 2006–2008 הראו שהמבצר היה בשימוש מן המאה ה-4 ועד המאה ה-18. יש חוקרים שאף מזהים אותו עם סאוסאמורה,
    עיר מבוצרת שסטרבון מזכיר.


    מה שעומד כיום הוא מצודה משולשת בקירוב, עם חצר קטנה בדרום ומגדלים בשלוש הפינות. המגדל הדרום-מזרחי,
    הגדול שבהם, התנשא לכמה קומות ושימש לא רק להגנה אלא גם למגורים. בקירות שעוביים שניים עד שלושה מטרים,
    חרכי הירי שקועים בעומק גומחות — רק כך יכול היה לוחם חמוש בקשת לירות דרך עובי אבן כזה. במקום שבו קרס
    המגדל המזרחי עומד היום מגדל תצפית עגול שנבנה מאוחר יותר.


    האגדה: מקרינה, בתו של הנסיך סימון, התחננה לפני אחיה קשה הלב ממוקה שיבטל מס כבד מנשוא, והוא כלא אותה
    במגדל. כשנחשים פרצו מקדירה של איכרים והתפתלו סביבו, נדר ממוקה לבנות כנסייה; האח והאחות קיבלו על עצמם
    נדרי נזירות. בהלוויה של מקרינה, שמתה בת שבעים, נשק ישיש לבן זקן למצחה, אמר "אחותי, שמרנו על נדרנו"
    — ומת במקום.


    הביטו למטה מן החומות: העמק הצר מסביר את המבצר טוב יותר מכל שלט.
  tip: >-
    הכניסה חינם, ואין גדר, שער או קופה, כך שכל שעה של אור יום מתאימה. היזהרו: חלק מן האבנים בחומות רופפות
    ואין מעקות, אז החזיקו ילדים קטנים ביד. נעלו נעליים סגורות — השביל למעלה קצר אבל תלול וחלקלק. אור אחר
    הצהריים המאוחרים הוא הרך ביותר לאבן ולעמק שמתחת. אין במקום שום מתקנים; בתי קפה ושירותים יש במרכז מצחתה,
    כ-2 ק״מ דרומה. יחד עם סבטיצחובלי וסמטאברו זה חצי יום נינוח.
  route: >-
    ממרכז טביליסי סעו בכביש S1 (E60) לאורך נהר המטקוורי לכיוון מצחתה, וצאו ביציאה למצחתה אל כביש Sh29
    הנכנס לעיר. חצו את המרכז והמשיכו צפונה ברחוב דוד אגמשנבלי, הדרך הישנה היוצאת ממצחתה; המבצר מתנשא על
    השלוחה מימינכם, בקצה הצפוני של העיר. כ-27 ק״מ ו-30–35 דקות, אספלט לכל אורך הדרך — כל רכב יתאים. חנו
    בהתחשבות בשולי הדרך למרגלות הגבעה, ועלו ברגל בשביל הקצר והתלול, חמש עד עשר דקות.
ar:
  name: قلعة بيبريس تسيخه
  short: >-
    قلعة عتيقة على نتوء فوق نهر أراغفي عند البوابة الشمالية لمتسخيتا، حيث توفي الملك ديميتري الأول سنة
    1156 — مجانية، بلا سياج، ومفتوحة على السماء.
  body: >-
    **بيبريس تسيخه تعني «قلعة الشيخ»، ويأتي الاسم ومعه حكاية: أخ وأخت ونذرٌ حُفظ العمر كله.**


    تجثم القلعة على نتوء في الضفة اليمنى لنهر أراغفي، عند الطرف الشمالي لمتسخيتا حيث يضيق الوادي — قفلٌ
    على الباب الشمالي للعاصمة القديمة. وكانت تُعرف قديماً باسمي بلتيس تسيخه وناتسيخفاري. نسبها العالِم
    فاخوشتي باغراتيوني في القرن الثامن عشر إلى أردام، أحد أوائل الإريستافيين (حكّام الأقاليم) في كارتلي،
    ويروي مؤرخ من عهد لاشا-غيورغي أن الملك ديميتري الأول، ابن داود البنّاء، توفي في بلتيس تسيخه سنة 1156
    ونُقل إلى جيلاتي ليُدفن فيها. وأظهرت حفريات 2006–2008 أن الحصن ظل مستخدماً من القرن الرابع حتى الثامن
    عشر. بل إن بعض الباحثين يطابقونه مع سيوسامورا، المدينة المحصّنة التي ذكرها سترابون.


    ما يقوم اليوم قلعةٌ مثلثة الشكل تقريباً، بفناء صغير في الجنوب وأبراج في زواياها الثلاث. أما البرج
    الجنوبي الشرقي، وهو أكبرها، فكان يرتفع عدة طوابق، يُسكن فيه كما يُدافَع منه. وفي جدران يبلغ سمكها
    مترين إلى ثلاثة، تقبع مرامي السهام في عمق كوّات غائرة — فلا سبيل غير ذلك لرامٍ أن يطلق سهمه عبر كل
    هذا الحجر. وفي موضع البرج الشرقي المنهار يقوم برج مراقبة مستدير أُقيم لاحقاً.


    أما الأسطورة فتقول: توسّلت ماكريني، ابنة الأمير سيمون، إلى أخيها القاسي ماموكا أن يرفع ضريبة ساحقة،
    فسجنها في البرج. وحين انهمرت الأفاعي من قِدر للفلاحين والتفّت حوله، نذر ماموكا أن يبني كنيسة، وترهّب
    الأخ والأخت كلاهما. وفي جنازة ماكريني، التي ماتت في السبعين، قبّل شيخ أبيض اللحية جبينها وقال: «يا
    أختي، لقد وفينا بنذرنا» — ومات في مكانه.


    انظر إلى الأسفل من فوق الأسوار: الوادي الضيق يشرح القلعة خيراً من أي لوحة تعريفية.
  tip: >-
    الدخول مجاني، ولا سياج ولا بوابة ولا شباك تذاكر، فأي ساعة من النهار تفي بالغرض. لكن احذر: بعض الحجارة
    مخلخل ولا درابزين، فأمسك بأيدي الصغار. انتعل حذاءً مغلقاً — فالدرب إلى الأعلى قصير لكنه شديد الانحدار
    وزلِق. ضوء آخر العصر هو الأرفق بالحجر وبالوادي في الأسفل. لا مرافق على الإطلاق؛ المقاهي ودورات المياه
    في وسط متسخيتا، على بعد نحو 2 كم جنوباً. ومع سفيتيتسخوفيلي وسامتافرو تصبح نزهة سهلة لنصف يوم.
  route: >-
    من وسط تبليسي خذ الطريق S1 (E60) بمحاذاة نهر متكفاري نحو متسخيتا، واتركه عند مخرج متسخيتا إلى الطريق
    Sh29 الداخل إلى المدينة. اعبر الوسط واتجه شمالاً في شارع دافيت أغماشنيبيلي، الطريق القديم الخارج من
    متسخيتا؛ ستجد القلعة على النتوء إلى يمينك عند الطرف الشمالي للمدينة. نحو 27 كم و30–35 دقيقة، إسفلت
    على طول الطريق — تكفي أي سيارة. اركن بلباقة على جانب الطريق عند سفح التل، ثم اصعد الدرب القصير الشديد
    الانحدار سيراً في خمس إلى عشر دقائق.
