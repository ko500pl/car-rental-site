ka:
  name: ბებრისციხე
  short: IX საუკუნის სამკუთხა ციხესიმაგრე მცხეთის ჩრდილოეთ შესასვლელთან, არაგვის მარჯვენა ნაპირზე — ხედით
    ჯვრისა და არაგვის ხეობისკენ, სვეტიცხოვლიდან ხუთ წუთში.
  body: >-
    **ბებრისციხე — „ბებრის ციხე" — მცხეთას და თბილისისკენ მიმავალ გზას ჩრდილოეთიდან იცავდა.** ციხე არაგვის
    მარჯვენა ნაპირზე, ქალაქის ჩრდილოეთ შესასვლელთან დგას. ეს ადგილი ჯერ კიდევ ძვ. წ. I საუკუნეში იყო
    გამაგრებული, დღეს შემორჩენილი ციხე კი IX საუკუნისაა: სამკუთხა ციტადელი, სამი კუთხის კოშკი და ორ მეტრზე
    სქელი კედლები.


    ციხე მატიანეშიც შესულა: ქართლის ცხოვრება მოგვითხრობს, რომ 1156 წელს აქ გარდაიცვალა მეფე დემეტრე I
    — დავით აღმაშენებლის ძე. მიუხედავად ამისა, ბებრისციხე მცხეთის ყველაზე შეუმჩნეველი ძეგლია: ის პირდაპირ
    თბილისი-სტეფანწმინდის გზატკეცილს დაჰყურებს, სვეტიცხოვლიდან ხუთ წუთშია, მაგრამ ტურისტული ჯგუფების
    უმეტესობა ისე ჩაუქროლებს, რომ არც შეანელებს.


    სწორედ ეს არის მისი ხიბლი: მოკლე, ციცაბო ბილიკი ნანგრევებამდე რამდენიმე წუთში აგიყვანს და ჯილდოდ
    არაგვის ხეობის ხედს მიიღებ — ჯვრის მონასტრისა და ზედაზენისკენ. ქვედა ქალაქის ხმაური აქ აღარ ისმის.
    მცხეთის მარშრუტს ბებრისციხე ერთ საათზე ნაკლებში ასრულებს და დღეს ლოგიკურ წერტილს უსვამს.
  tip: >-
    ქონგურებზე ფრთხილად იარე — ქვის წყობის ნაწილი მერყევია და მოაჯირები არ არის, პატარა ბავშვები ხელით
    გყავდეს. ფეხსაცმელი დახურული სჯობს: ბილიკი მოკლეა, მაგრამ ციცაბო და მშრალ ამინდშიც მოცურავს. შესვლა
    უფასოა და ღობე არ არსებობს — ანუ საათებზეც არავინ გზღუდავს. საუკეთესო შუქი საღამოსაა, როცა დაბალი
    მზე კედლებს ათბობს და არაგვის ხეობა ჩრდილებში იკითხება.
  route: >-
    თბილისიდან მცხეთისკენ ავტობანით და შემდეგ თბილისი-სტეფანწმინდის გზით ქალაქის ჩრდილოეთ შესასვლელამდე
    — 22 კმ და დაახლოებით ნახევარი საათი, მთლიანად ასფალტი, ნებისმიერი მანქანით. ციხე პირდაპირ გზის ზემოთ
    ჩანს; მანქანა ძირში, გვერდულაზე გააჩერე. ზემოთ მოკლე, ციცაბო ბილიკია — ხუთ-ათი წუთი ფეხით. სვეტიცხოველთან
    და სამთავროსთან ერთად ერთი ნახევარდღიანი მარშრუტი გამოდის.
en:
  name: Bebris Tsikhe Fortress
  short: A 9th-century triangular fortress at Mtskheta's northern entrance, above the Aragvi — views over
    the valley toward Jvari, five minutes from Svetitskhoveli.
  body: >-
    **Bebris Tsikhe — the "Fortress of the Elder" — guarded Mtskheta and the road to Tbilisi from the
    north.** It stands on the right bank of the Aragvi at the northern entrance to the city. The site
    was fortified as early as the 1st century BC; the castle you see today dates to the 9th century — a
    triangular citadel with three corner towers and walls more than two metres thick.


    The fortress made it into the chronicles too: the Georgian annals record that King Demetre I, son
    of David the Builder, died here in 1156. Yet Bebris Tsikhe remains Mtskheta's most overlooked monument.
    It sits directly above the Tbilisi–Stepantsminda highway, five minutes from Svetitskhoveli, and most
    tour groups drive straight past without slowing down.


    That is precisely its charm. A short, steep footpath brings you up to the ruins in a few minutes,
    and the reward is a wide view over the Aragvi valley toward the Jvari monastery and Zedazeni, with
    none of the crowds below. The scramble, the walls and the view together round out a Mtskheta itinerary
    in under an hour.
  tip: >-
    Take care on the walls — parts of the masonry are unstable and there are no railings, so keep small
    children by the hand. Closed shoes are better than sandals: the path is short but steep and slippery
    even in dry weather. Entry is free and there is no fence, which also means no opening hours to worry
    about. The best light is in the late afternoon, when the low sun warms the walls and the Aragvi valley
    reads in long shadows.
  route: >-
    From Tbilisi take the highway toward Mtskheta, then the Tbilisi–Stepantsminda road to the northern
    entrance of the town — 22 km and about half an hour, asphalt all the way, any car will do. The fortress
    is visible directly above the road; park on the verge at its foot. From there a short, steep footpath
    climbs to the ruins in five to ten minutes. Combined with Svetitskhoveli and Samtavro it makes a natural
    half-day loop.
ru:
  name: Крепость Бебрисцихе
  short: Треугольная крепость IX века у северного въезда в Мцхету, над Арагви — вид на долину в сторону
    Джвари, пять минут от Светицховели.
  body: >-
    **Бебрисцихе — «крепость старца» — прикрывала Мцхету и дорогу на Тбилиси с севера.** Она стоит на
    правом берегу Арагви у северного въезда в город. Место было укреплено ещё в I веке до н. э.; нынешний
    замок относится к IX веку — треугольная цитадель с тремя угловыми башнями и стенами толщиной более
    двух метров.


    Крепость попала и в летописи: грузинские хроники сообщают, что в 1156 году здесь умер царь Деметре
    I, сын Давида Строителя. И всё же Бебрисцихе остаётся самым незамеченным памятником Мцхеты: она возвышается
    прямо над трассой Тбилиси — Степанцминда, в пяти минутах от Светицховели, но большинство туристических
    групп проносится мимо, даже не сбавив скорость.


    В этом и есть её обаяние. Короткая крутая тропа за несколько минут выводит к руинам, а наградой служит
    широкий вид на долину Арагви в сторону монастыря Джвари и Зедазени — и никаких толп. Подъём, стены
    и вид вместе завершают мцхетский маршрут меньше чем за час.
  tip: >-
    На стенах будьте осторожны — часть кладки неустойчива, перил нет, маленьких детей держите за руку.
    Закрытая обувь лучше сандалий: тропа короткая, но крутая и скользкая даже в сухую погоду. Вход бесплатный,
    ограды нет — а значит, нет и часов работы. Лучший свет — ближе к вечеру, когда низкое солнце согревает
    стены, а долина Арагви прорисовывается длинными тенями.
  route: >-
    Из Тбилиси по автомагистрали в сторону Мцхеты, затем по трассе Тбилиси — Степанцминда до северного
    въезда в город — 22 км и около получаса, весь путь по асфальту, подойдёт любая машина. Крепость видна
    прямо над дорогой; машину оставьте на обочине у подножия. Дальше короткая крутая тропа — пять-десять
    минут пешком. Вместе со Светицховели и Самтавро получается естественный маршрут на полдня.
fa:
  name: دژ ببریس‌تسیخه
  short: دژی مثلثی از سدهٔ نهم در ورودی شمالی متسختا، بر فراز رود آراگوی — با چشم‌انداز دره به سوی جواری،
    پنج دقیقه از سوتیتسخوولی.
  body: >-
    **ببریس‌تسیخه — «دژ پیر» — از شمال نگهبان متسختا و راه تفلیس بود.** دژ بر کرانهٔ راست رود آراگوی در
    ورودی شمالی شهر ایستاده است. این مکان از همان سدهٔ یکم پیش از میلاد استحکامات داشت؛ قلعه‌ای که امروز
    می‌بینید از سدهٔ نهم است — ارگی مثلثی با سه برج گوشه و دیوارهایی به ستبرای بیش از دو متر.


    دژ به وقایع‌نامه‌ها هم راه یافته است: سالنامه‌های گرجی ثبت کرده‌اند که شاه دمتره یکم، پسر داوید سازنده،
    در سال 1156 همین‌جا درگذشت. با این همه ببریس‌تسیخه ناشناخته‌ترین یادگار متسختا مانده است: درست بالای
    بزرگراه تفلیس–استپانتسمیندا نشسته، پنج دقیقه از سوتیتسخوولی، اما بیشتر گروه‌های گردشگری بی‌آنکه سرعت
    کم کنند از کنارش می‌گذرند.


    جذابیتش هم درست در همین است. کوره‌راهی کوتاه و تند در چند دقیقه شما را به ویرانه‌ها می‌رساند و پاداشش
    چشم‌انداز گستردهٔ درهٔ آراگوی به سوی صومعهٔ جواری و زدازنی است — بی‌هیچ ازدحامی. بالا رفتن، دیوارها
    و منظره روی هم، برنامهٔ متسختا را در کمتر از یک ساعت کامل می‌کنند.
  tip: >-
    روی دیوارها مراقب باشید — بخشی از سنگ‌چین ناپایدار است و نرده‌ای وجود ندارد؛ دست کودکان را بگیرید.
    کفش بسته بهتر از صندل است: راه کوتاه اما تند است و حتی در هوای خشک لیز می‌خورد. ورود رایگان است و
    حصاری نیست — یعنی ساعت کاری هم ندارد. بهترین نور غروب است، وقتی آفتاب کم‌ارتفاع دیوارها را گرم می‌کند
    و درهٔ آراگوی با سایه‌های بلند خوانده می‌شود.
  route: >-
    از تفلیس با بزرگراه به سوی متسختا و سپس با جادهٔ تفلیس–استپانتسمیندا تا ورودی شمالی شهر — 22 کیلومتر
    و حدود نیم ساعت، سراسر آسفالت، با هر خودرویی. دژ درست بالای جاده دیده می‌شود؛ خودرو را در حاشیه پای
    دژ بگذارید. از آنجا کوره‌راهی کوتاه و تند در پنج تا ده دقیقه به ویرانه‌ها می‌رسد. همراه سوتیتسخوولی
    و سامتاورو، مسیری طبیعی برای نیم روز می‌سازد.
he:
  name: מבצר בבריס ציחה
  short: מבצר משולש מן המאה ה-9 בכניסה הצפונית למצחתה, מעל נהר האראגווי — נוף אל העמק לכיוון ג'ווארי,
    חמש דקות מסבטיצחובלי.
  body: >-
    **בבריס ציחה — "מבצר הזקן" — שמר על מצחתה ועל הדרך לטביליסי מצפון.** המבצר עומד על הגדה הימנית של
    האראגווי בכניסה הצפונית לעיר. האתר בוצר כבר במאה הראשונה לפנה״ס; המצודה שרואים היום היא מן המאה ה-9
    — ציטדלה משולשת עם שלושה מגדלי פינה וחומות שעוביין יותר משני מטרים.


    המבצר נכנס גם לכרוניקות: הרשומות הגאורגיות מספרות שהמלך דמטרה הראשון, בנו של דוד הבונה, מת כאן ב-1156.
    ובכל זאת בבריס ציחה נותר האתר המוזנח ביותר של מצחתה: הוא מתנשא ממש מעל כביש טביליסי–סטפנצמינדה, חמש
    דקות מסבטיצחובלי, ורוב קבוצות התיירים חולפות על פניו בלי להאט.


    בדיוק בזה קסמו. שביל קצר ותלול מעלה אל החורבות בתוך דקות ספורות, והפרס הוא נוף רחב על עמק האראגווי
    לכיוון מנזר ג'ווארי וזדזני — בלי ההמונים שלמטה. הטיפוס, החומות והנוף יחד סוגרים מסלול במצחתה בפחות
    משעה.
  tip: >-
    היזהרו על החומות — חלקים מהבנייה אינם יציבים ואין מעקות; החזיקו ילדים קטנים ביד. נעליים סגורות עדיפות
    על סנדלים: השביל קצר אך תלול ומחליק גם ביובש. הכניסה חופשית ואין גדר — כלומר גם אין שעות פתיחה. האור
    הטוב ביותר לפנות ערב, כשהשמש הנמוכה מחממת את החומות ועמק האראגווי נקרא בצללים ארוכים.
  route: >-
    מטביליסי בכביש המהיר לכיוון מצחתה, ואז בכביש טביליסי–סטפנצמינדה עד הכניסה הצפונית לעיירה — 22 ק״מ
    וכחצי שעה, אספלט לכל האורך, כל רכב מתאים. המבצר נראה ממש מעל הכביש; חנו בשול הדרך למרגלותיו. משם שביל
    קצר ותלול מטפס לחורבות בחמש עד עשר דקות. יחד עם סבטיצחובלי וסמטברו מתקבל מסלול טבעי של חצי יום.
ar:
  name: قلعة بيبريس تسيخه
  short: قلعة مثلثة من القرن التاسع عند المدخل الشمالي لمتسخيتا فوق نهر أراغفي — بإطلالة على الوادي نحو
    جفاري، خمس دقائق من سفيتيتسخوفيلي.
  body: >-
    **بيبريس تسيخه — «قلعة الشيخ» — كانت تحرس متسخيتا وطريق تبليسي من الشمال.** تقف القلعة على الضفة اليمنى
    لنهر أراغفي عند المدخل الشمالي للمدينة. حُصِّن الموقع منذ القرن الأول قبل الميلاد؛ أما القلعة القائمة
    اليوم فتعود إلى القرن التاسع — حصن مثلث بثلاثة أبراج ركنية وجدران يتجاوز سمكها المترين.


    ودخلت القلعة سجلات التاريخ أيضاً: تروي الحوليات الجورجية أن الملك ديمتري الأول، ابن داود الباني، توفي
    هنا عام 1156. ومع ذلك تبقى بيبريس تسيخه أكثر معالم متسخيتا إغفالاً: فهي تطل مباشرة على طريق تبليسي–ستيبانتسميندا
    السريع، على خمس دقائق من سفيتيتسخوفيلي، لكن معظم المجموعات السياحية تمرّ بها من دون أن تبطئ.


    وفي هذا بالضبط يكمن سحرها. درب قصير حاد يصعد بك إلى الأطلال في دقائق، والمكافأة إطلالة واسعة على وادي
    أراغفي نحو دير جفاري وزيدازيني — من دون زحام. الصعود والجدران والمنظر معاً تُكمل جولة متسخيتا في أقل
    من ساعة.
  tip: >-
    توخَّ الحذر على الجدران — بعض البناء الحجري غير ثابت ولا توجد حواجز، فأمسك بيد الأطفال الصغار. الحذاء
    المغلق أفضل من الصندل: الدرب قصير لكنه حاد وزلق حتى في الجفاف. الدخول مجاني ولا سياج — أي لا مواعيد
    عمل أيضاً. أفضل ضوء قبيل الغروب، حين تدفئ الشمس المنخفضة الجدران ويتجلى وادي أراغفي بظلال طويلة.
  route: >-
    من تبليسي عبر الطريق السريع نحو متسخيتا، ثم بطريق تبليسي–ستيبانتسميندا حتى المدخل الشمالي للبلدة —
    22 كم ونحو نصف ساعة، أسفلت طوال الطريق، وتكفي أي سيارة. تُرى القلعة مباشرة فوق الطريق؛ اركن السيارة
    على الكتف عند سفحها. من هناك يصعد درب قصير حاد إلى الأطلال في خمس إلى عشر دقائق. ومع سفيتيتسخوفيلي
    وسامتافرو تكتمل جولة طبيعية لنصف يوم.
