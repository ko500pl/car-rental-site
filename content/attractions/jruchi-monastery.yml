ka:
  name: ჯრუჭის მონასტერი
  short: >-
    ორი კვიპაროსი ბორცვზე და მიწისძვრისგან დარჩენილი კედლები — მონასტრისა, რომლის 936 წლის ოთხთავი ქართული
    ხელნაწერი წიგნის საგანძურია.
  body: >-
    **გზიდან ჯერ კვიპაროსები ჩანს — ორი მაღალი ხე ცხომარეთის თავზე, ბორცვზე, — და მხოლოდ მერე ხვდები,
    რომ ისინი თითქმის არაფერს დარაჯობენ.**


    ჯრუჭის წმინდა გიორგის მონასტერი მდინარე ჯრუჭულას სათავესთან, იმერეთისა და რაჭის ძველ საზღვარზე დგას.
    დაარსების ზუსტი თარიღი უცნობია: შემორჩენილი წარწერა და ჩუქურთმების სტილი IX–X ან XI საუკუნეზე მიუთითებს.
    სახელი მას ეტრატმა მოუტანა: ჯრუჭის ოთხთავები — ერთი 936 წელს გადაწერილი, მეორე XII საუკუნის ბოლოსი
    — ქართული მოხატული ხელნაწერების საუკეთესო ნიმუშთა შორისაა. საბჭოთა ხელისუფლებამ მონასტერი გააუქმა,
    განძი კი ქუთაისისა და თბილისის მუზეუმებში გადაიტანა. სწორედ ამიტომ გადარჩა.


    შენობას მშვიდი ცხოვრება არ ჰქონია. სამნავიანი ბაზილიკა გუმბათოვან ტაძრად გადაკეთდა; XVI–XVII საუკუნეებში
    იგი წერეთლებს ერგოთ, 1730-იან წლებში კი რაჭის ერისთავებმა ჩაიგდეს ხელში და ციხესიმაგრედ აქციეს. 1753–1763
    წლებს შორის იმერეთის მეფე სოლომონ I-მა მონასტერი აღადგინა, წერეთლებს დაუბრუნა და აქ დაკრძალვის ნებაც
    მისცა. 1804–1843 წლებში მიტროპოლიტმა დავით წერეთელმა ტაძარი საფუძვლიანად გადააკეთა და გააფართოვა.


    1991 წლის აპრილში რაჭის მიწისძვრამ ტაძარი მიწასთან გაასწორა. დღეს ორი დაზიანებული კედელი და ეზოს კარიბჭის
    კედლები დგას, ეზოში კი ჩუქურთმიანი ქვები და სვეტების ნატეხები ყრია. ქართული წყაროები ერთ-ერთ კედელზე
    უჩვეულო რელიეფს აღწერენ: ორი წმინდა გიორგი ერთმანეთისკენ მიბრუნებული — ერთი გველეშაპს ებრძვის, მეორე
    იმპერატორ დიოკლეტიანეს. მოძებნეთ, თუ ჯერ კიდევ ადგილზეა. 2018 წელს სრული რესტავრაციის პროექტი გამოცხადდა,
    ნანგრევებში კი დროდადრო დღესაც აღევლინება წირვა.


    ჯრუჭი იმის გაკვეთილია, თუ რა რჩება: ქვა ჩამოინგრა, წიგნი გადარჩა.
  tip: >-
    აქ არც სალაროა, არც მცველი და არც საპირფარეშო; შესვლა უფასოა. კედლები ავარიულ მდგომარეობაშია — ნუ
    აძვრებით და მათ ძირში ნუ დადგებით, განსაკუთრებით წვიმის შემდეგ. ეს კვლავ წმინდა ადგილია: მხრები და
    მუხლები დაფარეთ, ქალებს თავსაფარი ჰქონდეთ. ნანგრევს ნახევარი საათი ეყოფა, ამიტომ დღე საჩხერესთან (ჭამა,
    საწვავი, საპირფარეშო) და ჭიათურასთან ერთად დაგეგმეთ. ბოლო მოუასფალტებელი მონაკვეთი ძლიერი წვიმის შემდეგ
    ტალახიანი და მოლიპულია; საუკეთესო პერიოდი მაისიდან ოქტომბრამდეა. აღდგენითი სამუშაოების ამჟამინდელი
    მდგომარეობა გადაამოწმეთ ადგილზე.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით გორისა და ქარელის გავლით იარეთ, დაახლოებით 115-ე კილომეტრზე, აგარასთან,
    შ22-ზე გადაუხვიეთ და გომის გავლით, ლიხის ქედის ჩრდილოეთ განშტოებებზე გადავლით, საჩხერეში ჩადით. საჩხერიდან
    შ209 გზას ჩრდილო-დასავლეთისკენ, უზუნთისა და შქმერის მიმართულებით გაჰყევით დაახლოებით 10 კილომეტრი,
    შემდეგ სოფლის გზით ცხომარეთისკენ აუხვიეთ; ბოლო მონაკვეთი მოუასფალტებელია. სულ დაახლოებით 185 კილომეტრი
    და 3 საათი და 20 წუთი. რეკომენდებულია მაღალი გამავლობის მანქანა — მაღალი კლირენსი ხრეშსა და ორმოებზე
    გამოგადგებათ. საწვავი საჩხერეში ჩაასხით.
en:
  name: Jruchi Monastery
  short: >-
    Two cypresses on a hilltop and a few earthquake-torn walls: what remains of the monastery whose Gospels
    of 936 are a treasure of Georgian books.
  body: >-
    **From the road you see the cypresses first — two tall trees on a hilltop above Tskhomareti — and
    only then understand that they stand guard over almost nothing.**


    The Monastery of St George at Jruchi rises at the headwaters of the Jruchula, on the old frontier
    between Imereti and Racha. Its founding date is unknown: a surviving inscription and the style of
    the carved stonework point to the 9th/10th or 11th century. Its fame travelled on parchment. The Jruchi
    Gospels — one copied in 936, the other in the late 12th century — rank among the finest illuminated
    Georgian manuscripts. When the Soviet state closed the monastery, its treasures were taken to museums
    in Kutaisi and Tbilisi. That is why they survived.


    The building had a restless life. A three-nave basilica was remade as a domed church; in the 16th
    or 17th century it passed to the Tsereteli princes, and in the 1730s the dukes of Racha seized it
    and turned it into a fortress. Sometime between 1753 and 1763 King Solomon I of Imereti restored the
    monastery, returned it to the Tseretelis and granted them the right to be buried here. From 1804 to
    1843 Metropolitan David Tsereteli rebuilt and enlarged the church.


    In April 1991 the Racha earthquake brought it down. Today two damaged walls and the walls of the gateway
    still stand, and carved stones and broken columns lie scattered across the yard. Georgian sources
    describe an unusual relief on one wall: two figures of St George facing each other, one fighting a
    dragon, the other the emperor Diocletian. Look for it, if it survives. A full restoration was announced
    in 2018, and services are still held now and then among the stones.


    Jruchi is a lesson in what lasts: the stones fell; the books did not.
  tip: >-
    There is no ticket office, no guardian and no toilet; entry is free. The walls are unstable — do not
    climb them or linger at their foot, especially after rain. This is still a holy place: cover shoulders
    and knees, and women should bring a headscarf. The ruin needs half an hour, so pair it with Sachkhere
    (food, fuel, toilets) and Chiatura. The last unpaved stretch turns muddy and slick after heavy rain;
    May to October is the reliable season. Check on the spot how far the restoration work has progressed.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Kareli; at about 115 km, near Agara, turn onto the
    Sh22 and follow it through Gomi, over the northern spurs of the Likhi Range, to Sachkhere. From Sachkhere
    take the Sh209 north-west towards Uzunta and Shkmeri for about 10 km, then turn up the village road
    to Tskhomareti; the final stretch is unpaved. In all, about 185 km and 3 hours 20 minutes. An SUV
    is recommended: the extra clearance helps on gravel and potholes. Fill up in Sachkhere.
ru:
  name: Монастырь Джручи
  short: >-
    Два кипариса на холме и обломки стен после землетрясения — всё, что осталось от монастыря, чьё Евангелие
    936 года стало сокровищем грузинской книжности.
  body: >-
    **С дороги первыми видны кипарисы — два высоких дерева на холме над Цхомарети, — и лишь потом понимаешь,
    что стеречь им почти нечего.**


    Монастырь Святого Георгия в Джручи стоит в верховьях Джручулы, на старой границе Имеретии и Рачи.
    Дата основания неизвестна: сохранившаяся надпись и стиль каменной резьбы указывают на IX–X или XI
    век. Славу ему принёс пергамент. Джручские Евангелия — одно переписано в 936 году, другое в конце
    XII века — входят в число лучших иллюминированных грузинских рукописей. Когда советская власть закрыла
    монастырь, его сокровища вывезли в музеи Кутаиси и Тбилиси. Потому они и уцелели.


    Судьба у здания была беспокойной. Трёхнефную базилику перестроили в купольный храм; в XVI или XVII
    веке монастырь перешёл к князьям Церетели, а в 1730-х годах рачинские эриставы захватили его и превратили
    в крепость. Где-то между 1753 и 1763 годами имеретинский царь Соломон I восстановил монастырь, вернул
    его Церетели и даровал им право быть здесь похороненными. В 1804–1843 годах митрополит Давид Церетели
    перестроил и расширил храм.


    В апреле 1991 года Рачинское землетрясение обрушило его. Сегодня стоят две повреждённые стены и стены
    ворот, а по двору разбросаны резные камни и обломки колонн. Грузинские источники описывают необычный
    рельеф на одной из стен: две фигуры святого Георгия друг против друга — один сражается с драконом,
    другой с императором Диоклетианом. Поищите его, если он уцелел. Полную реставрацию объявили в 2018
    году, а среди камней до сих пор время от времени совершаются службы.


    Джручи — урок того, что остаётся: камни пали, книги — нет.
  tip: >-
    Здесь нет ни кассы, ни смотрителя, ни туалета; вход свободный. Стены неустойчивы — не забирайтесь
    на них и не задерживайтесь у их подножия, особенно после дождя. Это по-прежнему святое место: прикройте
    плечи и колени, женщинам стоит взять платок. На руины хватит получаса, поэтому совместите их с Сачхере
    (еда, топливо, туалеты) и Чиатурой. Последний грунтовый участок после сильного дождя раскисает и становится
    скользким; надёжный сезон — с мая по октябрь. На месте узнайте, как продвинулась реставрация.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Гори и Карели; примерно на 115-м километре, у
    Агары, сверните на Sh22 и по ней через Гоми и северные отроги Лихского хребта доезжайте до Сачхере.
    Из Сачхере около 10 км по Sh209 на северо-запад в сторону Узунты и Шкмери, затем сверните на сельскую
    дорогу, которая поднимается к Цхомарети; последний отрезок — грунтовый. Всего около 185 км и 3 часа
    20 минут. Рекомендуется кроссовер или внедорожник: увеличенный клиренс пригодится на гравии и ямах.
    Заправьтесь в Сачхере.
fa:
  name: صومعهٔ جروچی
  short: >-
    دو سرو بر نوک تپه و چند دیوار زلزله‌زده؛ این همهٔ چیزی است که از صومعه‌ای مانده که انجیل سال ۹۳۶ آن
    گنجی از گنجینهٔ کتاب گرجی است.
  body: >-
    **از جاده نخست سروها به چشم می‌آیند — دو درخت بلند بر تپه‌ای بالای تسخومارتی — و تنها پس از آن درمی‌یابی
    که تقریباً از هیچ نگهبانی می‌کنند.**


    صومعهٔ سنت جورج در جروچی نزدیک سرچشمه‌های رود جروچولا، بر مرز کهن ایمرتی و راچا، برپاست. تاریخ بنیادش
    روشن نیست: کتیبه‌ای بازمانده و سبک سنگ‌تراشی‌ها به سده‌های نهم/دهم یا یازدهم اشاره دارند. آوازه‌اش
    اما بر پوست‌نوشته سفر کرد. انجیل‌های جروچی — یکی رونویسی‌شده در سال ۹۳۶ و دیگری در اواخر سدهٔ دوازدهم
    — از زیباترین نسخه‌های مصور گرجی به شمار می‌روند. هنگامی که دولت شوروی صومعه را بست، گنجینه‌هایش به
    موزه‌هایی در کوتایسی و تفلیس برده شد. و درست به همین سبب برجا ماندند.


    بنا زندگی آرامی نداشت. بازیلیکایی سه‌شبستانی به کلیسایی گنبددار بدل شد؛ در سدهٔ شانزدهم یا هفدهم به
    شاهزادگان تسرتلی رسید و در دههٔ ۱۷۳۰ دوک‌های راچا آن را تصرف کردند و به دژ بدل ساختند. زمانی میان
    سال‌های ۱۷۵۳ و ۱۷۶۳ سولومون یکم، پادشاه ایمرتی، صومعه را مرمت کرد، آن را به تسرتلی‌ها بازگرداند و
    به آنان حق دفن در این مکان را بخشید. از ۱۸۰۴ تا ۱۸۴۳ متروپولیت داوید تسرتلی کلیسا را از نو ساخت و
    گسترش داد.


    در آوریل ۱۹۹۱ زمین‌لرزهٔ راچا آن را فرو ریخت. امروز دو دیوار آسیب‌دیده و دیوارهای دروازه هنوز سرپا
    هستند و سنگ‌های کنده‌کاری‌شده و ستون‌های شکسته در سراسر حیاط پراکنده‌اند. منابع گرجی از نقش‌برجسته‌ای
    غریب بر یکی از دیوارها سخن می‌گویند: دو پیکرهٔ سنت جورج رو در روی هم، یکی در نبرد با اژدها و دیگری
    در نبرد با امپراتور دیوکلتیان. اگر برجا مانده باشد، دنبالش بگردید. مرمت کامل در سال ۲۰۱۸ اعلام شد
    و هنوز گاه‌گاه در میان سنگ‌ها مراسم عبادت برگزار می‌شود.


    جروچی درسی است دربارهٔ آنچه می‌ماند: سنگ‌ها فرو ریختند؛ کتاب‌ها نه.
  tip: >-
    اینجا نه باجهٔ بلیت هست، نه نگهبان و نه سرویس بهداشتی؛ ورود رایگان است. دیوارها ناپایدارند — از آنها
    بالا نروید و پای‌شان درنگ نکنید، به‌ویژه پس از باران. اینجا هنوز مکانی مقدس است: شانه‌ها و زانوها
    را بپوشانید و بانوان روسری همراه داشته باشند. دیدن ویرانه نیم ساعت وقت می‌برد، پس آن را با ساچخره
    (غذا، سوخت، سرویس بهداشتی) و چیاتورا همراه کنید. آخرین تکهٔ خاکی راه پس از باران شدید گل‌آلود و لغزنده
    می‌شود؛ فصل مطمئن از ماه مه تا اکتبر است. در محل بپرسید که کار مرمت تا کجا پیش رفته است.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب و از کنار گوری و کارلی بروید؛ در حدود کیلومتر ۱۱۵، نزدیک آگارا،
    به جادهٔ Sh22 بپیچید و از راه گومی و از روی شاخه‌های شمالی رشته‌کوه لیخی تا ساچخره بروید. از ساچخره
    جادهٔ Sh209 را حدود ۱۰ کیلومتر به سمت شمال‌غرب، به سوی اوزونتا و شکمری، دنبال کنید، سپس به جادهٔ روستایی
    سربالایی که به تسخومارتی می‌رود بپیچید؛ آخرین بخش راه خاکی است. روی‌هم حدود ۱۸۵ کیلومتر و ۳ ساعت و
    ۲۰ دقیقه. خودروی شاسی‌بلند توصیه می‌شود: فاصلهٔ بیشتر از زمین روی شن و چاله‌ها به کار می‌آید. در ساچخره
    باک را پر کنید.
he:
  name: מנזר ג'רוצ'י
  short: >-
    שני ברושים על ראש גבעה וכמה קירות שקרעה רעידת האדמה: זה מה שנותר מהמנזר שספר הבשורות שלו משנת 936
    הוא אוצר מאוצרות הספר הגאורגי.
  body: >-
    **מן הכביש רואים קודם את הברושים — שני עצים גבוהים על גבעה מעל צחומרטי — ורק אחר כך מבינים שהם שומרים
    כמעט על כלום.**


    מנזר גאורגיוס הקדוש בג'רוצ'י מתנשא סמוך למקורות נהר הג'רוצ'ולה, על הגבול הישן בין אימרתי לראצ'ה. מועד
    הקמתו אינו ידוע: כתובת ששרדה וסגנון גילופי האבן מצביעים על המאה ה-9/10 או על המאה ה-11. תהילתו נדדה
    על גבי קלף. ספרי הבשורות של ג'רוצ'י — האחד הועתק ב-936, השני בסוף המאה ה-12 — נמנים עם כתבי היד הגאורגיים
    המאוירים המפוארים ביותר. כשהשלטון הסובייטי סגר את המנזר, הועברו אוצרותיו למוזיאונים בקותאיסי ובטביליסי.
    בזכות זה הם שרדו.


    לבניין היו חיים סוערים. בזיליקה בת שלוש ספינות הוסבה לכנסיית כיפה; במאה ה-16 או ה-17 עבר המנזר לידי
    נסיכי בית צרתלי, ובשנות ה-1730 השתלטו עליו דוכסי ראצ'ה והפכו אותו למבצר. מתישהו בין 1753 ל-1763 שיקם
    מלך אימרתי סולומון הראשון את המנזר, השיב אותו לבני צרתלי והעניק להם את הזכות להיקבר בו. בין 1804 ל-1843
    בנה המטרופוליט דוד צרתלי את הכנסייה מחדש והרחיב אותה.


    באפריל 1991 קרסה הכנסייה ברעידת האדמה של ראצ'ה. כיום עדיין עומדים שני קירות פגועים וקירות שער הכניסה,
    ואבנים מגולפות ועמודים שבורים פזורים ברחבי החצר. מקורות גאורגיים מתארים תבליט יוצא דופן על אחד הקירות:
    שתי דמויות של גאורגיוס הקדוש זו מול זו, האחת נאבקת בדרקון והשנייה בקיסר דיוקלטיאנוס. חפשו אותו, אם
    שרד. שיקום מלא הוכרז ב-2018, ומדי פעם עדיין נערכות תפילות בין האבנים.


    ג'רוצ'י הוא שיעור במה שנשאר: האבנים נפלו, הספרים לא.
  tip: >-
    אין כאן קופה, שומר או שירותים; הכניסה חופשית. הקירות אינם יציבים — אל תטפסו עליהם ואל תתעכבו לרגליהם,
    במיוחד אחרי גשם. זה עדיין מקום קדוש: כסו כתפיים וברכיים, ונשים כדאי שיביאו מטפחת ראש. לחורבה מספיקה
    חצי שעה, לכן שלבו אותה עם סאצ'חרה (אוכל, דלק, שירותים) ועם צ'יאטורה. הקטע הלא סלול האחרון הופך בוצי
    וחלקלק אחרי גשם כבד; העונה הבטוחה היא מאי עד אוקטובר. בררו במקום עד כמה התקדמו עבודות השיקום.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי וקארלי; בערך בק"מ ה-115, ליד אגארה, פנו לכביש Sh22 והמשיכו
    בו דרך גומי, מעל השלוחות הצפוניות של רכס ליחי, עד סאצ'חרה. מסאצ'חרה סעו כ-10 ק"מ בכביש Sh209 צפון-מערבה
    לכיוון אוזונטה ושקמרי, ואז פנו לדרך הכפר העולה אל צחומרטי; הקטע האחרון אינו סלול. בסך הכול כ-185 ק"מ
    ו-3 שעות ו-20 דקות. מומלץ רכב שטח: מרווח הגחון הגבוה עוזר על חצץ ובורות. תדלקו בסאצ'חרה.
ar:
  name: دير جروتشي
  short: >-
    سروتان على قمة تلّ وبضعة جدران مزّقها الزلزال: هذا ما تبقّى من الدير الذي يُعدّ إنجيله المنسوخ عام
    936 كنزًا من كنوز الكتاب الجورجي.
  body: >-
    **من الطريق ترى السروتين أولًا — شجرتين باسقتين على تلّة فوق تسخوماريتي — ولا تدرك إلا بعد ذلك أنهما
    تحرسان ما يكاد يكون لا شيء.**


    يقوم دير القديس جاورجيوس في جروتشي عند منابع نهر جروتشولا، على الحدود القديمة بين إيميريتي وراتشا.
    تاريخ تأسيسه مجهول: فالنقش الباقي وأسلوب الزخارف الحجرية يشيران إلى القرن التاسع/العاشر أو الحادي
    عشر. أما شهرته فقد سافرت على الرَّق. فإنجيلا جروتشي — أحدهما نُسخ عام 936، والآخر في أواخر القرن الثاني
    عشر — من أروع المخطوطات الجورجية المزخرفة. وحين أغلقت السلطة السوفيتية الدير، نُقلت كنوزه إلى متاحف
    كوتايسي وتبليسي. ولهذا نجت.


    عرف المبنى حياة مضطربة. فقد حُوّلت بازيليكا ثلاثية الأروقة إلى كنيسة ذات قبة؛ وفي القرن السادس عشر
    أو السابع عشر انتقل الدير إلى أمراء آل تسيريتيلي، وفي ثلاثينيات القرن الثامن عشر استولى عليه دوقات
    راتشا وحوّلوه إلى حصن. وفي وقت ما بين عامي 1753 و1763 رمّم ملك إيميريتي سولومون الأول الدير، وأعاده
    إلى آل تسيريتيلي، ومنحهم حق الدفن فيه. ومن 1804 إلى 1843 أعاد المتروبوليت داود تسيريتيلي بناء الكنيسة
    ووسّعها.


    وفي أبريل 1991 أسقطها زلزال راتشا. واليوم لا يزال قائمًا جداران متضرران وجدران البوابة، فيما تتناثر
    في الفناء حجارة منحوتة وأعمدة مكسورة. وتصف مصادر جورجية نقشًا بارزًا غير مألوف على أحد الجدران: صورتين
    متقابلتين للقديس جاورجيوس، إحداهما تصارع تنينًا والأخرى تصارع الإمبراطور ديوكلتيانوس. ابحث عنه إن
    كان قد نجا. وقد أُعلن عن ترميم شامل عام 2018، ولا تزال الصلوات تُقام بين الحجارة من حين لآخر.


    جروتشي درسٌ فيما يبقى: سقطت الحجارة، ولم تسقط الكتب.
  tip: >-
    لا شبّاك تذاكر هنا ولا حارس ولا دورة مياه، والدخول مجاني. الجدران غير مستقرة، فلا تتسلقها ولا تطل
    الوقوف عند أسفلها، خاصة بعد المطر. لا يزال المكان مقدسًا: غطِّ الكتفين والركبتين، ويُستحسن أن تحضر
    النساء غطاءً للرأس. تكفي الأطلالَ نصفُ ساعة، فاجمعها مع ساتشخيري (طعام ووقود ودورات مياه) وتشياتورا.
    يتحول المقطع الترابي الأخير إلى وحل زلق بعد الأمطار الغزيرة، والموسم الموثوق من مايو إلى أكتوبر. تحقّق
    في المكان من مدى تقدّم أعمال الترميم.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وكاريلي؛ وعند الكيلومتر 115 تقريبًا، قرب أغارا،
    انعطف إلى الطريق Sh22 وتابعه عبر غومي، فوق النتوءات الشمالية لسلسلة ليخي، حتى ساتشخيري. ومن ساتشخيري
    اسلك الطريق Sh209 باتجاه الشمال الغربي نحو أوزونتا وشكميري لمسافة 10 كم تقريبًا، ثم انعطف إلى طريق
    القرية الصاعد إلى تسخوماريتي؛ والمقطع الأخير غير معبّد. المسافة الإجمالية نحو 185 كم و3 ساعات و20
    دقيقة. يُنصح بسيارة دفع رباعي، فالخلوص الأرضي الأعلى يفيد على الحصى والحفر. املأ الخزان في ساتشخيري.
