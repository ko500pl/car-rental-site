ka:
  name: მახუნცეთის ჩანჩქერი და თაღოვანი ხიდი
  short: >-
    50-მეტრიანი ჩანჩქერი და მოაჯირის გარეშე გადებული ქვის თაღი აჭარისწყალზე — ორივე ერთმანეთისგან ნახევარ
    კილომეტრზე ნაკლებ მანძილზე.
  body: >-
    **მახუნცეთის ხიდს მოაჯირი არასოდეს ჰქონია — მხოლოდ ერთი თლილი ქვის თაღია, უშუალოდ კლდიდან ამოზრდილი,
    აჭარისწყლის თავზე ექვს მეტრზე.**


    აქ ორი სანახავია, ერთმანეთისგან დაახლოებით 460 მეტრში, ქედის მუნიციპალიტეტის სოფელ მახუნცეთში, ბათუმიდან
    ხეობის გზით 30-იოდე კილომეტრზე. ჯერ ჩანჩქერი: აჭარისწყლის მარჯვენა მხარეს პატარა შენაკადი ზღვის დონიდან
    335 მეტრზე, პორფირიტული ტუფებისა და ტუფბრექჩიების კლდიდან 50 მეტრის სიმაღლიდან ვარდება და ძირში მოზრდილი
    მორევი გამოუთხრია. გაზაფხულზე და წვიმების შემდეგ ღრიალებს, მშრალ აგვისტოში კი თხელ ფარდად იქცევა.


    მერე მდინარეზე ჩადით, ხიდთან. 24 მეტრი სიგრძისაა, შუაწელში კი სულ ორი მეტრის სიგანისა. ბურჯებად ბუნებრივი
    კლდე აქვს გამოყენებული, ალაგ-ალაგ ქვით ამოშენებული; ასეთი ფართო თაღის გადასაკვრელად მშენებლებს, ალბათ,
    მდინარეში დროებითი ხიმინჯები უნდა ჩაესოთ ხარაჩოებისთვის. მკვლევრები აღნიშნავენ, რომ მას დანდალოს ხიდის
    დახვეწილი ოსტატობა აკლია — ეს სამუშაო ხიდია და არა სადღესასწაულო. 2006 წელს მას ეროვნული მნიშვნელობის
    კულტურის უძრავი ძეგლის კატეგორია მიენიჭა.


    გადმოცემა ხიდს თამარ მეფის ეპოქას (1184–1213) უკავშირებს. ეს ლეგენდად მიიღეთ: წყაროები მის აშენების
    ზუსტ თარიღს არ ასახელებენ.


    ხიდზე ნელა გადადით: მოაჯირის გარეშე თქვენსა და მწვანე წყალს შორის მხოლოდ საკუთარი წონასწორობაა — ზუსტად
    ისე, როგორც ყველასთვის, ვინც აქ თქვენამდე გადავიდა.
  tip: >-
    დილით მოდით: შუადღისას ტურისტული ჯგუფები ჩამოდიან და ავტოსადგომი ივსება. ჩანჩქერთან ქვები სველი და
    სრიალაა, ამიტომ ღრმაპროტექტორიანი ფეხსაცმელი ჩაიცვით; წყალი ნებისმიერ სეზონზე ცივია. ხიდს მოაჯირი
    არ აქვს — ბავშვებს ხელი მაგრად მოკიდეთ, წვიმისას და ყინვაში კი სულაც ნაპირიდან დაათვალიერეთ. წვიმის
    ქურთუკი თან იქონიეთ: ხეობაში ავდარი ხშირია და უეცარი. ჩანჩქერთან რესტორნები და საპიკნიკე ადგილებია;
    რესტორნებში ბარათს, როგორც წესი, იღებენ, პატარა ჯიხურებში კი ნაღდი ფული დაგჭირდებათ. ორივე სანახავისთვის
    საათნახევრიდან ორ საათამდე გამოყავით, მერე კი, როგორც ბევრი აკეთებს, ხეობას ზემოთ, ქედისა და ხულოსკენ
    განაგრძეთ გზა.
  route: >-
    თბილისიდან დაახლოებით 395 კილომეტრი და ექვსი საათია. E60-ით სამტრედიამდე მიდიხართ, შემდეგ S12-ით ზღვაზე
    გადიხართ და ქობულეთის გავლით ბათუმამდე ჩადიხართ. ბათუმის გარეუბანში ბათუმი-ახალციხის გზაზე გადაუხვიეთ
    ქედისა და ხულოს მიმართულებით და აჭარისწყლის ხეობას აუყევით — მახუნცეთამდე 30-იოდე კილომეტრი, 40-45
    წუთია. გზა ასფალტიანი და კარგადაა მოვლილი, მაგრამ ვიწრო და მოსახვევიანია, ხილვადობა შეზღუდულია. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია. საწვავი ბათუმში აიღეთ — ხეობაში გასამართი სადგური იშვიათია. ჩანჩქერთან
    მისასვლელი მითითებულია, ავტოსადგომი უშუალოდ ადგილზეა, ხიდი კი იქიდან ნახევარ კილომეტრზე ნაკლებია.
en:
  name: Makhuntseti Waterfall and Arched Bridge
  short: >-
    A 50-metre waterfall and a parapet-less stone arch over the Adjaristsqali, less than half a kilometre
    apart, under an hour inland from Batumi.
  body: >-
    **Makhuntseti's bridge has no parapet and never had one: just a single arch of dressed stone, springing
    from the living rock six metres above the Adjaristsqali.**


    There are two sights here, about 460 metres apart, in the village of Makhuntseti in Keda municipality,
    some 30 km up the valley from Batumi. The waterfall first. On the right bank of the Adjaristsqali,
    at 335 metres above sea level, a small tributary drops about 50 metres over a cliff of porphyritic
    tuff and tuff-breccia and has scoured a sizeable pool at its foot. In spring and after rain it roars;
    in a dry August it thins to a veil.


    Then walk down to the river. The bridge is 24 metres long and barely two metres wide at its waist.
    Natural rock serves as its abutments, patched here and there with masonry, and an arch this wide suggests
    the builders drove temporary piles into the riverbed to carry their scaffolding. Scholars note that
    it lacks the refinement of the Dandalo bridge upstream: this is a working bridge, not a showpiece.
    In 2006 it was listed as a cultural monument of national importance.


    Tradition links it to the age of Queen Tamar (1184–1213). Take that as legend; the sources give no
    firm date.


    Cross the bridge slowly. With no parapet, nothing stands between you and the green water but your
    own balance, just as it was for everyone who crossed before you.
  tip: >-
    Come in the morning: tour groups arrive around midday and the car park fills. The rocks by the waterfall
    are wet and slippery, so wear shoes with real grip, and the water is cold in any season. The bridge
    has no parapet, so hold children firmly by the hand, and in rain or frost admire it from the bank.
    Carry a rain shell, as showers in the valley are frequent and sudden. Restaurants and picnic spots
    cluster by the waterfall; the restaurants usually take cards, but kiosks want cash. Allow an hour
    and a half to two hours for both sights, then do as many visitors do and carry on up the valley towards
    Keda and Khulo.
  route: >-
    From Tbilisi it is about 395 km, around six hours. Take the E60 to Samtredia, then the S12 to the
    coast and south through Kobuleti to Batumi. On the outskirts of Batumi turn inland onto the Batumi–Akhaltsikhe
    road, signposted for Keda and Khulo, and follow the Adjaristsqali valley: about 30 km, 40 to 45 minutes.
    The road is paved and well kept but narrow and winding, with limited visibility on the bends. An economy
    car is entirely sufficient. Fill up in Batumi, as fuel stations in the valley are few. The waterfall
    turn is signposted with parking on site; the bridge is under half a kilometre away.
ru:
  name: Водопад и арочный мост Махунцети
  short: >-
    50-метровый водопад и каменная арка без перил над Аджарисцкали — меньше чем в полукилометре друг от
    друга, меньше часа езды вглубь от Батуми.
  body: >-
    **У моста в Махунцети никогда не было перил — только одна тёсаная каменная арка, вырастающая прямо
    из живой скалы, в шести метрах над Аджарисцкали.**


    Здесь два объекта, примерно в 460 метрах друг от друга, в селе Махунцети муниципалитета Кеда, около
    30 км от Батуми по ущелью. Сначала водопад: небольшой правый приток Аджарисцкали на высоте 335 метров
    над уровнем моря падает с пятидесятиметровой высоты со скалы из порфиритовых туфов и туфобрекчий и
    выточил у подножия внушительный омут. Весной и после дождей он ревёт, а в сухом августе превращается
    в тонкую завесу.


    Затем спуститесь к реке, к мосту. Его длина — 24 метра, а ширина в средней части — всего два метра.
    Опорами служит естественная скала, кое-где подправленная кладкой; чтобы перекрыть такой широкий пролёт,
    строителям, вероятно, пришлось вбить в реку временные свайные опоры для подмостей. Исследователи отмечают,
    что мосту не хватает изящества моста Дандало — это рабочий мост, а не парадный. В 2006 году его включили
    в список памятников культуры национального значения.


    Предание связывает мост с эпохой царицы Тамар (1184–1213). Примите это как легенду: источники не называют
    точной даты постройки.


    Переходите мост медленно: без перил между вами и зелёной водой — только собственное равновесие, точно
    так же, как для всех, кто прошёл здесь до вас.
  tip: >-
    Приезжайте утром: к полудню съезжаются туристические группы, и парковка заполняется. У водопада камни
    мокрые и скользкие, так что наденьте обувь с глубоким протектором; вода холодна в любой сезон. У моста
    нет перил — крепко держите детей за руку, а в дождь и мороз лучше смотрите на него с берега. Возьмите
    дождевик: в ущелье часто и внезапно портится погода. У водопада есть рестораны и места для пикника;
    в ресторанах карту обычно принимают, а в маленьких киосках понадобятся наличные. На оба объекта хватит
    от полутора до двух часов, а потом можно, как многие, продолжить путь вверх по ущелью, к Кеде и Хуло.
  route: >-
    От Тбилиси около 395 км и шести часов. Двигайтесь по E60 до Самтредиа, затем по S12 к побережью и
    на юг через Кобулети до Батуми. На окраине Батуми сверните от побережья на дорогу Батуми–Ахалцихе,
    в сторону Кеды и Хуло, и следуйте вдоль ущелья Аджарисцкали — до Махунцети около 30 км, 40–45 минут.
    Дорога асфальтирована и в хорошем состоянии, но узкая и извилистая, с ограниченной видимостью. Машины
    экономкласса вполне достаточно. Заправляйтесь в Батуми — заправки в ущелье редки. Поворот к водопаду
    обозначен указателем, парковка прямо на месте, а мост — менее чем в полукилометре оттуда.
fa:
  name: آبشار و پل کمانی ماخونتسِتی
  short: >-
    آبشاری ۵۰ متری و طاقی سنگی بی‌نرده بر آجاریستسکالی، با فاصله‌ای کمتر از نیم کیلومتر از هم، کمتر از
    یک ساعت راه از باتومی به درون خشکی.
  body: >-
    **پل ماخونتسِتی هرگز نرده نداشته — تنها یک طاق سنگی تراش‌خورده که مستقیم از دل صخره‌ی زنده بیرون آمده،
    شش متر بالای آجاریستسکالی.**


    این‌جا دو دیدنی هست، نزدیک به ۴۶۰ متر از هم دور، در روستای ماخونتسِتی از شهرستان کدا، حدود ۳۰ کیلومتر
    از باتومی از راه دره. نخست آبشار: شاخابه‌ی کوچکی در کرانه‌ی راست آجاریستسکالی، در ارتفاع ۳۳۵ متری
    از سطح دریا، از صخره‌ای از توف و توف‌برشی پورفیریتی، از بلندی پنجاه متر سرازیر می‌شود و در پای خود
    گودالی بزرگ کنده است. در بهار و پس از باران خروشان است، و در اوتِ خشک به پرده‌ای نازک تبدیل می‌شود.


    سپس تا کنار رودخانه، نزدیک پل، پایین بروید. طول پل ۲۴ متر است و در میانه تنها دو متر پهنا دارد. صخره‌ی
    طبیعی به‌جای پایه به‌کار رفته، جای‌جای با سنگ تکمیل شده؛ برای پوشاندن چنین دهانه‌ی پهنی، سازندگان
    احتمالاً باید شمع‌های موقتی در بستر رودخانه برای داربست فرو می‌کردند. پژوهشگران می‌گویند این پل ظرافت
    پل داندالو را ندارد — این پلی کاربردی است، نه تشریفاتی. در سال ۲۰۰۶ به فهرست آثار فرهنگی با اهمیت
    ملی افزوده شد.


    روایتی این پل را به دوران ملکه تامار (۱۱۸۴–۱۲۱۳) نسبت می‌دهد. آن را چون افسانه بپذیرید: منابع تاریخ
    دقیقی برای ساختش نمی‌دهند.


    از پل به‌آرامی بگذرید: بی‌نرده، میان شما و آب سبز تنها تعادل خودتان است — همان‌گونه که برای همه‌ی
    کسانی بود که پیش از شما از آن گذشتند.
  tip: >-
    صبح بیایید: نزدیک ظهر گروه‌های توریستی می‌رسند و پارکینگ پر می‌شود. سنگ‌های کنار آبشار خیس و لیزند،
    پس کفشی با آج عمیق بپوشید؛ آب در هر فصلی سرد است. پل نرده ندارد — دست کودکان را محکم بگیرید، و در
    باران یا یخبندان بهتر است از کنار رودخانه تماشایش کنید. بارانی همراه ببرید: در دره رگبار زیاد و ناگهانی
    است. کنار آبشار رستوران و جای پیک‌نیک هست؛ رستوران‌ها معمولاً کارت می‌پذیرند، اما در دکه‌های کوچک
    به پول نقد نیاز دارید. برای هر دو دیدنی، یک‌ونیم تا دو ساعت کافی است؛ سپس می‌توانید مانند بسیاری از
    مسافران، راه را به‌سوی بالای دره، تا کدا و خولو، ادامه دهید.
  route: >-
    از تفلیس حدود ۳۹۵ کیلومتر و شش ساعت است. از E60 تا سامترِدیا بروید، سپس از S12 به ساحل بروید و از
    آن‌جا به‌سوی جنوب، از میان کوبولتی، تا باتومی برانید. در حومه‌ی باتومی، به‌سوی داخل خشکی، به جاده‌ی
    باتومی-آخالتسیخه بپیچید، به‌سوی کدا و خولو، و دره‌ی آجاریستسکالی را دنبال کنید — تا ماخونتسِتی حدود
    ۳۰ کیلومتر، ۴۰ تا ۴۵ دقیقه. جاده آسفالته و خوب نگه‌داری‌شده اما تنگ و پرپیچ است و دیدِ محدودی دارد.
    خودروی اقتصادی کاملاً کافی است. در باتومی سوخت‌گیری کنید — پمپ‌بنزین در دره کم‌یاب است. راه فرعی آبشار
    تابلو دارد، پارکینگ درست همان‌جاست، و پل کمتر از نیم کیلومتر دورتر است.
he:
  name: מפל וגשר הקשת של מאחונצטי
  short: >-
    מפל בגובה 50 מטרים וקשת אבן בלי מעקה מעל האדג'ריסצקלי, במרחק של פחות מחצי קילומטר זה מזה, פחות משעת
    נסיעה מבטומי אל תוך היבשה.
  body: >-
    **לגשר מאחונצטי לא היה מעקה מעולם — רק קשת אחת של אבן מסותתת, יוצאת מהסלע החי, שישה מטרים מעל האדג'ריסצקלי.**


    יש כאן שני אתרים, במרחק של כ-460 מטרים זה מזה, בכפר מאחונצטי שבמחוז קדה, כ-30 ק"מ מבטומי בדרך העמק.
    קודם המפל: יובל קטן בגדה הימנית של האדג'ריסצקלי, בגובה 335 מטרים מעל פני הים, נופל מגובה כחמישים מטר
    מצוק של טוף פורפיריטי וטוף-ברקציה, וחצב לו בריכה גדולה בתחתית. באביב ואחרי גשמים הוא שואג, ובאוגוסט
    היבש הוא מידלדל לווילון דק.


    לאחר מכן רדו לנהר, לגשר. אורכו 24 מטרים, ורוחבו במרכזו שני מטרים בלבד. סלע טבעי משמש כמשענות לקשת,
    ומקומות מסוימים הושלמו באבן; כדי לגשר על מפתח רחב כזה, ייתכן שהבנאים נעצו כלונסאות זמניים בנהר עבור
    הפיגומים. חוקרים מציינים שהוא נעדר את העידון של גשר דנדלו — זהו גשר עבודה, לא גשר ראווה. ב-2006 הוכר
    כאתר מורשת תרבותית בעל חשיבות לאומית.


    מסורת מקשרת את הגשר לתקופת המלכה תמר (1184-1213). קבלו זאת כאגדה: המקורות אינם נותנים תאריך מדויק
    לבנייתו.


    חצו את הגשר לאט: בלי מעקה, בינכם ובין המים הירוקים עומד רק שיווי המשקל שלכם — בדיוק כמו לכל מי שחצה
    כאן לפניכם.
  tip: >-
    הגיעו בבוקר: לקראת הצהריים מגיעות קבוצות תיירים והחנייה מתמלאת. האבנים סביב המפל רטובות וחלקלקות,
    אז לבשו נעליים עם סוליה מחורצת; המים קרים בכל עונה. לגשר אין מעקה — החזיקו ילדים חזק ביד, ובגשם או
    כפור צפו בו מהגדה. הביאו מעיל גשם, כי ממטרים בעמק תכופים ופתאומיים. לצד המפל יש מסעדות ופינות פיקניק;
    במסעדות בדרך כלל מקבלים כרטיס, אך בקיוסקים קטנים תצטרכו מזומן. לשני האתרים הקדישו שעה וחצי עד שעתיים,
    ואחר כך תוכלו, כמו רבים, להמשיך במעלה העמק לכיוון קדה וחולו.
  route: >-
    מטביליסי המרחק הוא כ-395 ק"מ וכשש שעות. סעו בכביש E60 עד סמטרדיה, ואז ב-S12 לחוף ומשם דרומה דרך קובולטי
    לבטומי. בפאתי בטומי פנו אל היבשה לכביש בטומי-אחלציחה, לכיוון קדה וחולו, ועקבו אחר עמק האדג'ריסצקלי
    — כ-30 ק"מ עד מאחונצטי, 40-45 דקות. הכביש סלול ומתוחזק היטב אך צר ומתפתל, עם שדה ראייה מוגבל. רכב
    אקונומי מספיק בהחלט. תדלקו בבטומי — תחנות דלק בעמק נדירות. פנייה למפל מסומנת בשילוט, החנייה במקום,
    והגשר במרחק של פחות מחצי קילומטר משם.
ar:
  name: شلال وجسر ماخونتسِتي المقنطر
  short: >-
    شلال ارتفاعه 50 مترًا وقنطرة حجرية بلا درابزين فوق نهر أدجاريستسكالي، تفصل بينهما مسافة أقل من نصف
    كيلومتر، على أقل من ساعة بالسيارة من باتومي نحو الداخل.
  body: >-
    **لم يكن لجسر ماخونتسِتي درابزين أبدًا — فقط قنطرة واحدة من حجر مشذّب، تنبثق من الصخر الحي، على ارتفاع
    ستة أمتار فوق نهر أدجاريستسكالي.**


    يوجد هنا معلمان، يفصل بينهما نحو 460 مترًا، في قرية ماخونتسِتي التابعة لبلدية كِدا، على نحو 30 كم
    من باتومي عبر طريق الوادي. أولًا الشلال: رافد صغير على الضفة اليمنى لنهر أدجاريستسكالي، على ارتفاع
    335 مترًا فوق سطح البحر، يسقط من ارتفاع نحو خمسين مترًا من فوق صخرة من التوف البورفيري والتوف الركامي،
    وقد نحت في قاعدته بركة كبيرة. في الربيع وبعد الأمطار يهدر، وفي أغسطس الجاف يترقّق إلى ستار رقيق.


    ثم انزل إلى النهر، عند الجسر. طوله 24 مترًا، وعرضه في الوسط متران فقط. تُستخدم الصخرة الطبيعية كدعامات،
    مع ترقيع بالحجارة في بعض المواضع؛ ولتغطية فتحة بهذا الاتساع، ربّما دقّ البناؤون ركائز خشبية مؤقتة
    في قعر النهر لحمل السقالات. يلاحظ الباحثون أنه يفتقر إلى دقة صنعة جسر داندالو — فهذا جسر عمل، لا جسر
    زينة. وفي عام 2006 أُدرج كمعلم ثقافي ذي أهمية وطنية.


    يربط التقليد هذا الجسر بعصر الملكة تامار (1184-1213). خذ ذلك على أنه أسطورة: فالمصادر لا تعطي تاريخًا
    مؤكدًا لبنائه.


    اعبر الجسر ببطء: من دون درابزين، لا يقف بينك وبين الماء الأخضر سوى توازنك — كما كان الحال لكل من عبره
    قبلك.
  tip: >-
    تعالَ صباحًا: قرب الظهر تصل المجموعات السياحية وتمتلئ المواقف. الحجارة حول الشلال مبتلّة وزلقة، فارتدِ
    حذاءً بنعل ذي نقشة عميقة؛ والماء بارد في كل فصل. الجسر بلا درابزين — أمسك يد الأطفال بقوة، وفي المطر
    أو الصقيع يُفضَّل مشاهدته من الضفة. احمل واقي مطر، فزخّات المطر في الوادي متكررة ومفاجئة. عند الشلال
    مطاعم وأماكن للنزهة، وتقبل المطاعم البطاقات عادةً، لكن الأكشاك الصغيرة لا تقبل إلا النقد. خصّص للمعلمين
    معًا من ساعة ونصف إلى ساعتين، ثم يمكنك، كما يفعل كثيرون، مواصلة الطريق صعودًا في الوادي نحو كِدا وخولو.
  route: >-
    من تبليسي نحو 395 كم وستّ ساعات. سِر على الطريق E60 حتى سامتريديا، ثم على S12 إلى الساحل، ثم جنوبًا
    عبر كوبوليتي إلى باتومي. عند ضواحي باتومي انعطف نحو الداخل إلى طريق باتومي-أخالتسيخه، نحو كِدا وخولو،
    واتبع وادي أدجاريستسكالي — نحو 30 كم إلى ماخونتسِتي، 40 إلى 45 دقيقة. الطريق معبّد ومُصان جيدًا لكنه
    ضيق ومتعرّج، برؤية محدودة. تكفي سيارة اقتصادية تمامًا. تزوّد بالوقود في باتومي، فمحطات الوقود قليلة
    في الوادي. المنعطف المؤدي إلى الشلال مُشار إليه بلافتة، والموقف في الموقع نفسه، والجسر على مسافة أقل
    من نصف كيلومتر منه.
