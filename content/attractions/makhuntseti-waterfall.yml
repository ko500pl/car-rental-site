ka:
  name: მახუნცეთის ჩანჩქერი და თაღოვანი ხიდი
  short: ოცდაათმეტრიანი ჩანჩქერი და შუა საუკუნეების ქვის თაღოვანი ხიდი აჭარისწყლის ხეობაში, ბათუმიდან
    საათში.
  body: >-
    მახუნცეთი აჭარისწყლის ხეობაში, ბათუმიდან დაახლოებით 30 კილომეტრში მდებარეობს და ორ ობიექტს აერთიანებს,
    რომლებიც ერთმანეთისგან სულ რამდენიმე ასეულ მეტრშია.


    პირველი ჩანჩქერია — დაახლოებით ოცდაათმეტრიანი წყლის ვარდნა კლდიდან, ბუნებრივ აუზში. ბოლო მონაკვეთი
    პარკინგიდან ხუთწუთიანი ფეხით სავალია. ჩანჩქერი მთელი წელი მუშაობს, თუმცა მისი სიმძლავრე მკვეთრად იცვლება:
    გაზაფხულზე და წვიმების შემდეგ ის შთამბეჭდავია, აგვისტოს მშრალ პერიოდში კი შესამჩნევად სუსტდება.


    მეორე თაღოვანი ხიდია, რომელიც ტრადიციულად თამარ მეფის ეპოქას მიეწერება და შუა საუკუნეებით თარიღდება.
    ეს ერთთაღიანი ქვის ხიდი აჭარისწყლის შენაკადს კვეთს და აჭარაში შემორჩენილი ათეულობით მსგავსი ხიდიდან
    ყველაზე ცნობილია. მასზე ფეხით გადასვლა შესაძლებელია.


    გარშემო ინფრასტრუქტურა განვითარებულია: რესტორნები აჭარული სამზარეულოთი, ღვინისა და ჭაჭის დეგუსტაციები,
    ზიპლაინი და მცირე მაღაზიები. ეს მარშრუტი ბათუმიდან ნახევარი დღის ყველაზე პოპულარული გასვლაა და ხშირად
    ხულოსა და ზემო აჭარის მიმართულებით გრძელდება, ამიტომ მახუნცეთი უფრო პირველი გაჩერებაა, ვიდრე საბოლოო
    მიზანი. ხეობა თავისთავადაც სანახავია — ციცაბო, ტყით დაფარული ფერდობები, ჩაისა და თხილის ნათესები და
    პატარა სოფლები, სადაც ხის ტრადიციული აჭარული სახლები ჯერ კიდევ დგას.
  tip: >-
    საუკეთესო დროა დილა — შუადღისას ორგანიზებული ჯგუფები ჩამოდიან და პარკინგი ივსება. ჩანჩქერთან ქვები
    სველი და სრიალაა, ამიტომ ფეხსაცმელი მოცურავე ძირით აირჩიეთ; წყალში შესვლა ცივია წლის ნებისმიერ დროს.
    წვიმის ქურთუკი თან იქონიეთ — ხეობაში ავდარი ხშირია და უეცარი. რესტორნებში ბარათით გადახდა ჩვეულებრივ
    შესაძლებელია, თუმცა მცირე ჯიხურებში ნაღდი დაგჭირდებათ. ტუალეტი პარკინგთან და რესტორნებშია.
  route: >-
    თბილისიდან დაახლოებით 395 კმ და ექვსი საათია. ჯერ E60-ით ბათუმამდე ჩადიხართ, შემდეგ აღმოსავლეთით უხვევთ
    აჭარისწყლის ხეობაში ხულოს მიმართულებით — ბათუმიდან მახუნცეთამდე 30 კმ-ია, დაახლოებით 45 წუთი. გზა
    ასფალტია და კარგ მდგომარეობაშია, თუმცა ვიწრო და მოხვევებიანი; ეკონომ კლასის ავტომობილი სავსებით საკმარისია.
    საწვავი ბათუმში აავსეთ — ხეობაში გასამართები იშვიათია. ჩანჩქერამდე მისასვლელი მითითებულია და პარკინგი
    უშუალოდ ობიექტთანაა.
en:
  name: Makhuntseti Waterfall and Arched Bridge
  short: A thirty-metre waterfall and a medieval stone arch bridge in the Adjaristsqali valley, an hour
    from Batumi.
  body: >-
    Makhuntseti lies in the Adjaristsqali valley about 30 kilometres from Batumi and combines two sights
    that stand only a few hundred metres apart.


    The first is the waterfall: a drop of roughly thirty metres from the cliff into a natural pool, reached
    by a five-minute walk from the parking area. It runs all year, but its volume varies sharply. In spring
    and after heavy rain it is genuinely impressive; during a dry spell in August it thins out noticeably.


    The second is the arched bridge, traditionally attributed to the era of Queen Tamar and dated to the
    medieval period. This single-span stone bridge crosses a tributary of the Adjaristsqali and is the
    best known of the several dozen similar bridges surviving across Adjara. You can walk across it.


    The surrounding infrastructure is well developed: restaurants serving Adjaran food, wine and chacha
    tastings, a zipline and small shops. This is the most popular half-day trip out of Batumi, and it
    often continues eastward toward Khulo and Upper Adjara, which makes it a natural first stop rather
    than a destination in itself.
  tip: >-
    Morning is the best time; organised groups arrive around midday and the car park fills. The rocks
    by the waterfall are wet and slippery, so choose shoes with grip, and note the water is cold in any
    season. Carry a rain shell — showers in the valley are frequent and arrive suddenly. Restaurants generally
    accept cards, but small kiosks will want cash. Toilets are at the parking area and in the restaurants.
    Allow about ninety minutes for both the waterfall and the bridge.
  route: >-
    It is about 395 km and six hours from Tbilisi. First drive the E60 down to Batumi, then turn east
    into the Adjaristsqali valley toward Khulo: Batumi to Makhuntseti is 30 km, roughly 45 minutes. The
    road is paved and in good condition but narrow and winding, with limited visibility on the bends;
    an economy car is entirely sufficient. Fill up in Batumi, as fuel stations in the valley are sparse.
    The turn to the waterfall is signposted and parking sits directly at the site.
ru:
  name: Водопад Махунцети и арочный мост
  short: Тридцатиметровый водопад и средневековый каменный арочный мост в ущелье Аджарисцкали, в часе
    от Батуми.
  body: >-
    Махунцети находится в ущелье Аджарисцкали примерно в 30 километрах от Батуми и объединяет два объекта,
    стоящих в паре сотен метров друг от друга.


    Первый — водопад: падение воды со скалы высотой около тридцати метров в естественную чашу, до которого
    от парковки идти пять минут. Он работает круглый год, но напор сильно меняется. Весной и после ливней
    зрелище действительно впечатляющее, а в сухой период августа поток заметно слабеет.


    Второй — арочный мост, традиционно приписываемый эпохе царицы Тамар и датируемый Средневековьем. Этот
    однопролётный каменный мост пересекает приток Аджарисцкали и остаётся самым известным из нескольких
    десятков подобных мостов, уцелевших по всей Аджарии. По нему можно пройти пешком.


    Инфраструктура вокруг развита: рестораны с аджарской кухней, дегустации вина и чачи, зиплайн и небольшие
    лавки. Это самая популярная поездка на полдня из Батуми, и её часто продолжают на восток в сторону
    Хуло и Верхней Аджарии, так что логичнее считать Махунцети первой остановкой, а не конечной целью.
  tip: >-
    Лучшее время — утро: к полудню подъезжают организованные группы и парковка заполняется. Камни у водопада
    мокрые и скользкие, обувь выбирайте с цепким протектором; вода холодная в любой сезон. Дождевик держите
    при себе — ливни в ущелье частые и внезапные. В ресторанах обычно принимают карты, но в маленьких
    киосках понадобятся наличные. Туалеты есть на парковке и в ресторанах. На водопад и мост закладывайте
    около полутора часов.
  route: >-
    От Тбилиси около 395 км и шесть часов. Сначала по трассе E60 вы спускаетесь к Батуми, затем поворачиваете
    на восток в ущелье Аджарисцкали в сторону Хуло: от Батуми до Махунцети 30 км, примерно 45 минут. Дорога
    асфальтированная и в хорошем состоянии, но узкая и извилистая, с плохой видимостью на поворотах; машины
    эконом-класса вполне достаточно. Заправляйтесь в Батуми, в ущелье станций мало. Поворот к водопаду
    обозначен, парковка находится прямо у объекта.
fa:
  name: آبشار و پل طاق‌دار ماخونتستی
  short: آبشاری سی‌متری و پلی سنگی و طاق‌دار از سده‌های میانه در درهٔ آجاریس‌تسکالی، یک ساعت با باتومی.
  body: >-
    ماخونتستی در درهٔ آجاریس‌تسکالی و در حدود 30 کیلومتری باتومی قرار دارد و دو دیدنی را کنار هم می‌آورد
    که تنها چند صد متر از یکدیگر فاصله دارند.


    نخستین آن‌ها آبشار است: ریزشی حدود سی متر از صخره درون آبگیری طبیعی، که با پنج دقیقه پیاده‌روی از
    محوطهٔ پارکینگ به آن می‌رسید. تمام سال جاری است، اما حجم آبش به‌شدت تغییر می‌کند. در بهار و پس از
    باران‌های سنگین واقعاً چشمگیر است؛ در دورهٔ خشک ماه اوت به‌روشنی باریک می‌شود. دومی پل طاق‌دار است
    که در سنت به روزگار ملکه تامار نسبت داده می‌شود و به سده‌های میانه تاریخ‌گذاری شده است. این پل سنگی
    تک‌دهانه از یکی از شاخه‌های آجاریس‌تسکالی می‌گذرد و شناخته‌شده‌ترین نمونه در میان چند ده پل مشابهی
    است که در سراسر آجارا برجا مانده‌اند. می‌توانید از روی آن رد شوید.


    زیرساخت پیرامون خوب توسعه یافته است: رستوران‌هایی با غذای آجارایی، مزهٔ شراب و چاچا، زیپ‌لاین و مغازه‌های
    کوچک. این محبوب‌ترین سفر نیم‌روزه از باتومی است و اغلب رو به شرق تا خولو و آجارای علیا ادامه می‌یابد،
    که آن را بیشتر به نخستین توقف طبیعی مسیر بدل می‌کند تا مقصدی مستقل.
  tip: >-
    صبح بهترین زمان است؛ گروه‌های سازمان‌یافته حوالی ظهر می‌رسند و پارکینگ پر می‌شود. صخره‌های کنار آبشار
    خیس و لغزنده‌اند، پس کفشی با ته‌گیر خوب انتخاب کنید و بدانید که آب در هر فصلی سرد است. بارانی همراه
    داشته باشید — رگبار در دره مکرر است و ناگهانی می‌آید. رستوران‌ها معمولاً کارت می‌پذیرند، اما دکه‌های
    کوچک پول نقد می‌خواهند. سرویس بهداشتی در پارکینگ و در رستوران‌ها هست. برای آبشار و پل روی هم حدود
    نود دقیقه وقت بگذارید.
  route: >-
    از تفلیس حدود 395 کیلومتر و شش ساعت راه است. نخست با E60 تا باتومی می‌روید و سپس رو به شرق به درهٔ
    آجاریس‌تسکالی در جهت خولو می‌پیچید: از باتومی تا ماخونتستی 30 کیلومتر است، تقریباً 45 دقیقه. جاده
    آسفالت و در وضعیت خوبی است اما باریک و پرپیچ، با دید محدود در قوس‌ها؛ خودروی اقتصادی کاملاً کافی است.
    باک را در باتومی پر کنید، چون جایگاه‌های سوخت در دره پراکنده‌اند. انشعاب به سوی آبشار علامت‌گذاری
    شده و پارکینگ درست کنار خود محوطه است.
he:
  name: מפל מאחונצטי והגשר המקומר
  short: מפל בגובה שלושים מטר וגשר אבן מקומר מימי הביניים בעמק אג'ריסצקאלי, שעה נסיעה מבטומי.
  body: >-
    מאחונצטי שוכן בעמק אג'ריסצקאלי, כ-30 קילומטרים מבטומי, ומחבר שני אתרים שעומדים במרחק כמה מאות מטרים
    בלבד זה מזה, כך שאפשר לראות את שניהם בביקור אחד ורגוע.


    הראשון הוא המפל: נפילה של כשלושים מטר מן הצוק אל בריכה טבעית, שאליה מגיעים בהליכה קלה של חמש דקות
    מאזור החניה. הוא זורם כל השנה, אבל כמות המים משתנה מאוד מעונה לעונה. באביב ואחרי גשמים כבדים הוא מרשים
    באמת ונשמע מרחוק; בתקופה יבשה באוגוסט הוא נעשה דק בהרבה. השני הוא הגשר המקומר, שהמסורת מייחסת אותו
    לתקופת המלכה תמר ומתארכת אותו לימי הביניים. גשר האבן הזה, בעל קשת אחת בלבד, חוצה יובל של האג'ריסצקאלי
    והוא המוכר מבין כמה עשרות גשרים דומים ששרדו ברחבי אג'ריה. אפשר לחצות אותו ברגל ולראות מקרוב את בנייתו.


    התשתית סביב מפותחת היטב: מסעדות עם אוכל אג'רי מסורתי, טעימות יין וצ'צ'ה, אומגה מעל הנחל וחנויות קטנות
    של מזכרות ודבש. זהו הטיול הפופולרי ביותר של חצי יום מבטומי, ולעיתים קרובות הוא נמשך מזרחה לעבר חולו
    ואג'ריה העילית, מה שהופך אותו לתחנה ראשונה טבעית יותר מאשר ליעד בפני עצמו.
  tip: >-
    הבוקר הוא הזמן הטוב ביותר; קבוצות מאורגנות מגיעות סביב הצהריים והחניון מתמלא. הסלעים ליד המפל רטובים
    וחלקלקים, לכן בחרו נעליים עם אחיזה טובה, וזכרו שהמים קרים בכל עונה. קחו מעיל גשם — ממטרים בעמק תכופים
    ומגיעים בפתאומיות. המסעדות מקבלות בדרך כלל כרטיסים, אבל הדוכנים הקטנים ירצו מזומן. שירותים יש באזור
    החניה ובתוך המסעדות. הקצו כתשעים דקות למפל ולגשר יחד.
  route: >-
    מטביליסי מדובר בכ-395 ק"מ ובשש שעות נסיעה. תחילה יורדים בכביש E60 עד בטומי, ואז פונים מזרחה אל עמק
    אג'ריסצקאלי לכיוון חולו: מבטומי למאחונצטי 30 ק"מ, כ-45 דקות. הכביש סלול ובמצב טוב אך צר ומתפתל, והראות
    בפניות מוגבלת; רכב חסכוני מספיק לחלוטין. תדלקו בבטומי, שכן תחנות הדלק בעמק מעטות ומפוזרות. הפנייה
    אל המפל מסומנת בשילוט והחניה נמצאת ממש בכניסה לאתר.
ar:
  name: شلال ماخونتسيتي والجسر المقوّس
  short: شلال بارتفاع ثلاثين متراً وجسر حجري مقوّس من العصور الوسطى في وادي أدجاريستسكالي، على بعد ساعة
    من باتومي.
  body: >-
    تقع ماخونتسيتي في وادي أدجاريستسكالي على بعد نحو 30 كيلومتراً من باتومي، وتجمع معلمين لا يفصل بينهما
    سوى بضع مئات من الأمتار، فيمكن رؤيتهما معاً في زيارة واحدة هادئة.


    أولهما الشلال: سقوط بنحو ثلاثين متراً من الجرف إلى بركة طبيعية، يُوصل إليه بمشي خمس دقائق من موقف
    السيارات. يجري طوال العام، لكن غزارته تتفاوت بحدة من موسم إلى آخر. ففي الربيع وبعد الأمطار الغزيرة
    يكون مبهراً فعلاً ويُسمع من بعيد؛ وفي فترة الجفاف في أغسطس يرق بوضوح. وثانيهما الجسر المقوّس، الذي
    تنسبه التقاليد إلى عهد الملكة تامار ويؤرَّخ إلى العصور الوسطى. يعبر هذا الجسر الحجري ذو القوس الواحد
    رافداً من روافد أدجاريستسكالي، وهو الأشهر بين عشرات الجسور المشابهة الباقية في أنحاء أدجارا. ويمكنك
    السير فوقه ومعاينة طريقة بنائه عن قرب.


    البنية المحيطة متطورة: مطاعم تقدم الطعام الأدجاري التقليدي، وتذوق النبيذ والتشاتشا، وخط انزلاق فوق
    النهر ومتاجر صغيرة للهدايا والعسل. وهذه أشهر رحلة نصف يوم انطلاقاً من باتومي، وكثيراً ما تمتد شرقاً
    نحو خولو وأدجارا العليا، ما يجعلها محطة أولى طبيعية أكثر من كونها وجهة قائمة بذاتها.
  tip: >-
    الصباح أفضل الأوقات؛ فالمجموعات المنظمة تصل قرابة الظهر ويمتلئ الموقف. الصخور قرب الشلال مبللة وزلقة،
    فاختر حذاءً جيد التشبث، وانتبه إلى أن الماء بارد في كل المواسم. احمل سترة واقية من المطر — فالزخات
    في الوادي متكررة وتأتي فجأة. المطاعم تقبل البطاقات عموماً، أما الأكشاك الصغيرة فتريد نقداً. دورات
    المياه في موقف السيارات وداخل المطاعم. خصّص نحو تسعين دقيقة للشلال والجسر معاً.
  route: >-
    المسافة من تبليسي نحو 395 كم وست ساعات. اسلك أولاً الطريق E60 نزولاً إلى باتومي، ثم انعطف شرقاً إلى
    وادي أدجاريستسكالي باتجاه خولو: من باتومي إلى ماخونتسيتي 30 كم، أي نحو 45 دقيقة. الطريق معبّد وبحالة
    جيدة لكنه ضيق وكثير المنعطفات، والرؤية محدودة عند المنحنيات؛ وسيارة اقتصادية كافية تماماً. املأ الخزان
    في باتومي، فمحطات الوقود في الوادي متباعدة. والمنعطف نحو الشلال مُشار إليه باللافتات، وموقف السيارات
    عند الموقع مباشرة.
