ka:
  name: ჯავახეთის ეროვნული პარკი
  short: ვულკანური ზეგნის ტბებისა და ჭაობების დაცული ქსელი ნინოწმინდასთან — საქართველოს მთავარი ფრინველსაცქერი
    ადგილი.
  body: >-
    **ჯავახეთის ეროვნული პარკი 2011 წელს შეიქმნა** და ის ერთი მთლიანი მასივი კი არა, ზეგანზე მიმოფანტული
    ტბებისა და ჭარბტენიანი ტერიტორიების ქსელია: ხანჩალი, ბუღდაშენი, მადათაფა, სულდა და ყარწახი. ყველა
    მათგანი ორი ათასი მეტრის ახლოსაა, უტყეო, ღია ვულკანურ პლატოზე.


    მთავარი აქ ფრინველია. ჯავახეთი აფრიკიდან და აზიიდან ჩრდილოეთისკენ მიმავალი გადამფრენების დერეფანზე
    ზის, და გაზაფხულზე თუ შემოდგომაზე ტბები ათასობით ფრინველს იღებს: წერო, ბატი, იხვის მრავალი სახეობა,
    ტოროლები, მეთევზეები. **ხანჩალსა და ბუღდაშენზე ქოჩორა ვარხვის კოლონიები ბუდობს** — ეს სახეობა ევროპაში
    იშვიათია და საქართველოში სწორედ აქ ინახება.


    ხანჩალის ისტორია ცალკე საკითხია: საბჭოთა პერიოდში ტბა სარწყავად დააშრეს და მისი დონე წლების განმავლობაში
    არასტაბილური იყო; ბოლო ათწლეულში წყლის რეჟიმის აღდგენაზე მუშაობდნენ და ფრინველიც დაბრუნდა. ეს იმ იშვიათ
    შემთხვევათაგანია, როცა აღდგენა შესამჩნევად მუშაობს.


    ლანდშაფტი თავისთავად საინტერესოა: ეს ახალგაზრდა ვულკანური ზეგანია, აბულისა და სამსარის ქედების კონუსებით
    შემოსაზღვრული, სადაც ტბები ლავის ნაკადებით შეკრულ ჩაღრმავებებში დევს. ზაფხულში ირგვლივ საზაფხულო საძოვრები
    და მეცხვარეთა ბანაკებია. ერთი შენიშვნა: ყარწახის ტბა თურქეთის საზღვარზეა და სასაზღვრო ზონაში მოხვედრა
    შეზღუდულია — იქ დამოუკიდებლად ნუ წახვალ.


    ინფრასტრუქტურა მოკრძალებულია: ვიზიტორთა ცენტრი ნინოწმინდაშია, ხანჩალსა და ბუღდაშენზე სათვალთვალო კოშკები
    დგას, რამდენიმე მოკლე ბილიკი და ველოსიპედის მარშრუტიც არსებობს. შესვლა უფასოა.


    ზამთარზე პირდაპირ უნდა ითქვას: ნოემბრიდან აპრილამდე ტბები ყინულშია, ფრინველი წასულია, ღამის ტემპერატურა
    მინუს ოცდაათამდე ეშვება და ეს საქართველოს ერთ-ერთი ყველაზე ცივი დასახლებული კუთხეა. ქარი მუდმივია,
    თოვლს გზაზე ანაწილებს და მეორეხარისხოვანი გზები ხშირად ჩაკეტილია. ზაფხულშიც კი ჩრდილი და თავშესაფარი
    აქ პრაქტიკულად არ არსებობს.
  tip: >-
    ფრინველისთვის საუკეთესო დროა აპრილი-მაისი და სექტემბერი-ოქტომბერი, დღის პირველი და ბოლო საათები. ბინოკლი
    აუცილებელია — კოშკებიდან წყლამდე მანძილი დიდია. ქარსაცავი ქურთუკი ივლისშიც წაიღე, 1930 მეტრზე საღამო
    ცივია. ჩამოსვლამდე ნინოწმინდაში ვიზიტორთა ცენტრში შეიარე: იქ ეტყვიან, რომელ ტბაზეა ამჟამად ფრინველი.
    წყალი და საჭმელი თან იქონიე, ტბებთან არაფერია. ტბის ნაპირები ჭაობიანია, წყალგაუმტარი ფეხსაცმელი გამოგადგება.
  route: >-
    თბილისიდან წალკის გავლით, ფარავნის ტბის გასწვრივ ნინოწმინდამდე — დაახლოებით 195 კმ, სამ საათსა და
    ნახევარში. გზა ძირითადად ასფალტია, თუმცა ზეგანზე ხარისხი ცვალებადია და საშუალო სიჩქარე დაბალი. ხანჩალის
    ტბა ნინოწმინდიდან ჩრდილო-დასავლეთით რამდენიმე კილომეტრშია, ბუღდაშენი და მადათაფა — ცალკე შესახვევებით,
    მოხრეშილი გზებით. საწვავი წალკასა და ნინოწმინდაში აიღე. კლირენსიანი ავტომობილი აქ რეალურად საჭიროა.
en:
  name: Javakheti National Park
  short: >-
    A protected network of volcanic plateau lakes and wetlands near Ninotsminda, and Georgia's best birdwatching
    ground.
  body: >-
    **Javakheti National Park was created in 2011,** and it is not a single block of land but a network
    of lakes and wetlands scattered across the plateau: Khanchali, Bugdasheni, Madatapa, Sulda and Kartsakhi.
    All of them sit near two thousand metres on open, treeless volcanic upland.


    Birds are the point. Javakheti lies on the migration corridor running north from Africa and Asia,
    and in spring and autumn the lakes take in thousands of birds: cranes, geese, many species of duck,
    waders and herons. **Dalmatian pelicans breed at Khanchali and Bugdasheni** — a species that has become
    rare across Europe and that holds on in Georgia essentially here.


    Khanchali has a story of its own. In the Soviet period the lake was drained for irrigation, and its
    level stayed unstable for years afterwards. Over the last decade work has gone into restoring the
    water regime, and the birds have returned. It is one of the less common cases where restoration is
    visibly working.


    The landscape itself is worth attention. This is a young volcanic plateau, ringed by the cones of
    the Abuli and Samsari ranges, and the lakes sit in hollows dammed by old lava flows. In summer the
    surrounding grassland is summer pasture, dotted with shepherds' camps. One practical note: Lake Kartsakhi
    lies on the Turkish border and the border zone has access restrictions, so do not head there on your
    own.


    Infrastructure is modest: a visitor centre in Ninotsminda, observation towers at Khanchali and Bugdasheni,
    a few short trails and a cycling route. Entry is free.


    Winter deserves plain speech. From November to April the lakes are frozen, the birds are gone, night
    temperatures drop towards minus thirty, and this is one of the coldest inhabited corners of Georgia.
    The wind never stops, it drifts snow across the roads, and secondary roads are frequently blocked.
    Even in summer there is effectively no shade and no shelter anywhere on the plateau.
  tip: >-
    For birds the best times are April to May and September to October, in the first and last hours of
    daylight. Binoculars are essential, since the towers stand well back from the water. Carry a windproof
    jacket even in July; at 1,930 metres the evenings are cold. Call at the visitor centre in Ninotsminda
    on the way in and ask which lake currently holds birds. Bring food and water, as there is nothing
    at the lakes themselves. The shores are boggy, so waterproof footwear helps.
  route: >-
    From Tbilisi drive via Tsalka and along Lake Paravani to Ninotsminda, roughly 195 km and about three
    and a half hours. The road is mostly asphalt, but quality varies once you are on the plateau and average
    speed is low. Khanchali lies a few kilometres north-west of Ninotsminda; Bugdasheni and Madatapa are
    reached by separate gravel turnings. Fill up in Tsalka and Ninotsminda. A vehicle with real ground
    clearance is genuinely useful here.
ru:
  name: Джавахетский национальный парк
  short: Охраняемая сеть озёр и болот вулканического плато у Ниноцминды — лучшее место для наблюдения
    птиц в Грузии.
  body: >-
    **Джавахетский национальный парк создан в 2011 году** и представляет собой не единый массив, а сеть
    озёр и водно-болотных угодий, разбросанных по плато: Ханчали, Бугдашени, Мадатапа, Сулда и Карцахи.
    Все они лежат около двух тысяч метров, на открытом безлесном вулканическом нагорье.


    Главное здесь — птицы. Джавахети находится на миграционном коридоре, ведущем на север из Африки и
    Азии, и весной и осенью озёра принимают тысячи птиц: журавли, гуси, множество видов уток, кулики и
    цапли. **На Ханчали и Бугдашени гнездятся кудрявые пеликаны** — вид, ставший редким по всей Европе
    и удерживающийся в Грузии по сути только здесь.


    У Ханчали своя история. В советское время озеро осушали под орошение, и его уровень многие годы оставался
    неустойчивым. Последнее десятилетие ушло на восстановление водного режима, и птицы вернулись. Это
    один из нечастых случаев, когда восстановление даёт видимый результат.


    Сам ландшафт заслуживает внимания. Это молодое вулканическое плато, окружённое конусами Абульского
    и Самсарского хребтов, а озёра лежат в котловинах, подпруженных старыми лавовыми потоками. Летом окрестные
    луга — это летние пастбища с чабанскими стоянками. Практическое замечание: озеро Карцахи лежит на
    границе с Турцией, в пограничной зоне действуют ограничения, так что самостоятельно туда ехать не
    стоит.


    Инфраструктура скромная: визит-центр в Ниноцминде, смотровые вышки на Ханчали и Бугдашени, несколько
    коротких троп и веломаршрут. Вход бесплатный.


    О зиме стоит сказать прямо. С ноября по апрель озёра подо льдом, птиц нет, ночью до минус тридцати,
    и это один из самых холодных обитаемых уголков Грузии. Ветер не прекращается, переносит снег на дороги,
    и второстепенные дороги нередко закрыты. Даже летом на плато практически нет ни тени, ни укрытия.
  tip: >-
    Для птиц лучшее время — апрель-май и сентябрь-октябрь, первые и последние часы светового дня. Бинокль
    обязателен: вышки стоят далеко от воды. Ветрозащитную куртку берите даже в июле, на 1930 метрах вечера
    холодные. По дороге зайдите в визит-центр в Ниноцминде и спросите, на каком озере сейчас держится
    птица. Еду и воду везите с собой, у озёр ничего нет. Берега топкие, пригодится непромокаемая обувь.
  route: >-
    Из Тбилиси через Цалку и вдоль озера Паравани до Ниноцминды, примерно 195 км и около трёх с половиной
    часов. Дорога в основном асфальтированная, но на плато качество меняется и средняя скорость невысока.
    Ханчали лежит в нескольких километрах к северо-западу от Ниноцминды; к Бугдашени и Мадатапе ведут
    отдельные гравийные съезды. Заправляйтесь в Цалке и Ниноцминде. Машина с реальным клиренсом здесь
    действительно нужна.
fa:
  name: پارک ملی جاواخِتی
  short: شبکه‌ای حفاظت‌شده از دریاچه‌ها و تالاب‌های فلات آتشفشانی نزدیک نینوتسمیندا، بهترین جای پرنده‌نگری
    در گرجستان.
  body: >-
    **پارک ملی جاواخِتی در سال ۲۰۱۱ پدید آمد،** و نه یک پهنهٔ یکپارچه بلکه شبکه‌ای از دریاچه‌ها و تالاب‌های
    پراکنده روی فلات است: خانچالی، بوغداشنی، ماداتاپا، سولدا و کارتساخی. همه نزدیک دو هزار متر و بر بلندی
    آتشفشانی باز و بی‌درخت‌اند.


    اصل ماجرا پرندگان‌اند. جاواخِتی بر دالان مهاجرتی شمال‌سو از آفریقا و آسیا نشسته و در بهار و پاییز
    دریاچه‌ها هزاران پرنده را می‌پذیرند: درنا، غاز، گونه‌های بسیار مرغابی، آبچلیک و حواصیل. **پلیکان پاکوتاه
    در خانچالی و بوغداشنی زادآوری می‌کند** — گونه‌ای که در سراسر اروپا کمیاب شده و در گرجستان عملاً همین‌جا
    مانده است.


    خانچالی داستان خود را دارد. در دورهٔ شوروی دریاچه را برای آبیاری خشکاندند و سال‌ها تراز آن ناپایدار
    ماند. در دههٔ گذشته برای بازگرداندن رژیم آبی کار شد و پرندگان بازگشتند. این از آن موارد کم‌شمار است
    که احیا نتیجهٔ دیدنی داده است.


    خود چشم‌انداز هم درخور توجه است. این فلاتی آتشفشانی و جوان است که مخروط‌های رشته‌های آبولی و سامساری
    آن را در میان گرفته‌اند، و دریاچه‌ها در گودال‌هایی نشسته‌اند که جریان‌های کهن گدازه آنها را بسته‌اند.
    تابستان، علفزارهای پیرامون چراگاه‌های ییلاقی‌اند و اردوگاه‌های چوپانان در آنها پراکنده است. یک نکتهٔ
    عملی: دریاچهٔ کارتساخی بر مرز ترکیه است و منطقهٔ مرزی محدودیت دسترسی دارد، پس خودسرانه به آن سو نروید.


    زیرساخت اندک است: مرکز بازدیدکنندگان در نینوتسمیندا، برج‌های دیدبانی در خانچالی و بوغداشنی، چند مسیر
    کوتاه و یک مسیر دوچرخه. ورود رایگان است.


    دربارهٔ زمستان باید صریح گفت. از نوامبر تا آوریل دریاچه‌ها یخ می‌بندند، پرنده‌ای نیست، دمای شب به
    سوی منفی سی می‌رود و این یکی از سردترین گوشه‌های مسکون گرجستان است. باد نمی‌ایستد، برف را روی جاده‌ها
    می‌ریزد و راه‌های فرعی بارها بسته می‌شوند. حتی در تابستان هم عملاً نه سایه‌ای هست و نه پناهی روی فلات.
  tip: >-
    برای پرندگان بهترین زمان آوریل تا مه و سپتامبر تا اکتبر است، در نخستین و واپسین ساعت‌های روشنایی.
    دوربین دوچشمی ضروری است چون برج‌ها از آب فاصله دارند. حتی در ژوئیه کاپشن بادگیر ببرید؛ در ۱۹۳۰ متری
    شب‌ها سرد است. سر راه به مرکز بازدیدکنندگان در نینوتسمیندا بروید و بپرسید اکنون کدام دریاچه پرنده
    دارد. خوراکی و آب همراه ببرید چون کنار دریاچه‌ها چیزی نیست. کرانه‌ها باتلاقی است و کفش ضدآب کمک می‌کند.
  route: >-
    از تفلیس از راه تسالکا و در امتداد دریاچهٔ پاراوانی تا نینوتسمیندا، حدود ۱۹۵ کیلومتر و نزدیک سه ساعت
    و نیم. جاده بیشتر آسفالت است اما کیفیتش روی فلات تغییر می‌کند و سرعت متوسط پایین است. خانچالی چند
    کیلومتر شمال‌غرب نینوتسمینداست؛ به بوغداشنی و ماداتاپا انحراف‌های شنی جداگانه می‌رسد. در تسالکا و
    نینوتسمیندا سوخت بگیرید. خودرویی با ارتفاع کف واقعی اینجا به‌راستی به کار می‌آید.
he:
  name: הפארק הלאומי ג'וואחתי
  short: רשת מוגנת של אגמים ובתי גידול לחים על הרמה הגעשית ליד נינוצמינדה, אתר צפרות הטוב בגאורגיה.
  body: >-
    **הפארק הלאומי ג'וואחתי הוקם ב-2011,** והוא אינו גוש אדמה אחד אלא רשת של אגמים ובתי גידול לחים הפזורים
    על פני הרמה: חנצ'לי, בוגדשני, מדטפה, סולדה וקרצחי. כולם שוכנים סמוך לגובה של אלפיים מטר, על רמה געשית
    פתוחה וחשופה מעצים.


    העיקר כאן הוא הציפורים. ג'וואחתי יושבת על מסדרון הנדידה העולה צפונה מאפריקה ומאסיה, ובאביב ובסתיו
    קולטים האגמים אלפי ציפורים: עגורים, אווזים, מיני ברווזים רבים, חופמאים ואנפות. **שקנאים מסולסלים מקננים
    בחנצ'לי ובבוגדשני** — מין שנעשה נדיר ברחבי אירופה ואשר בגאורגיה נאחז בעיקר כאן.


    לחנצ'לי סיפור משלה. בתקופה הסובייטית ייבשו את האגם לצורכי השקיה, ומפלסו נותר לא יציב שנים רבות. בעשור
    האחרון הושקעה עבודה בשיקום משטר המים, והציפורים חזרו. זה אחד המקרים הלא שכיחים שבהם השיקום עובד באופן
    נראה לעין.


    גם הנוף עצמו ראוי לתשומת לב. זוהי רמה געשית צעירה המוקפת בקונוסים של רכסי אבולי וסמסארי, והאגמים שוכנים
    בגומחות שנסכרו בזרמי לבה עתיקים. בקיץ משמשים כרי הדשא שמסביב מרעה קיץ, ומפוזרים בהם מחנות רועים. הערה
    מעשית אחת: אגם קרצחי שוכן על גבול טורקיה ובאזור הגבול חלות מגבלות גישה, ולכן אל תיסעו לשם על דעת עצמכם.


    התשתית צנועה: מרכז מבקרים בנינוצמינדה, מגדלי תצפית בחנצ'לי ובבוגדשני, כמה מסלולים קצרים ומסלול אופניים.
    הכניסה חינם.


    על החורף ראוי לדבר בפשטות. מנובמבר עד אפריל האגמים קפואים, הציפורים אינן, הטמפרטורה בלילה יורדת לכיוון
    מינוס שלושים, וזו אחת הפינות המיושבות הקרות ביותר בגאורגיה. הרוח אינה נחה, היא מסיטה שלג אל הכבישים,
    ודרכים משניות נחסמות תכופות. גם בקיץ אין על הרמה כמעט צל ולא מחסה.
  tip: >-
    לציפורים הזמנים הטובים הם אפריל עד מאי וספטמבר עד אוקטובר, בשעות הראשונות והאחרונות של האור. משקפת
    הכרחית, שכן המגדלים עומדים הרחק מן המים. קחו מעיל אוטם רוח גם ביולי; בגובה 1,930 מטר הערבים קרים.
    סורו למרכז המבקרים בנינוצמינדה בדרך פנימה ושאלו באיזה אגם יש ציפורים כרגע. הביאו אוכל ומים, כי באגמים
    עצמם אין דבר. הגדות בוציות, ונעליים אטומות למים עוזרות.
  route: >-
    מטביליסי דרך צלקה ולאורך אגם פרוואני עד נינוצמינדה, כ-195 ק״מ וכשלוש שעות וחצי. הכביש סלול ברובו,
    אך איכותו משתנה על הרמה והמהירות הממוצעת נמוכה. חנצ'לי נמצא כמה קילומטרים מצפון-מערב לנינוצמינדה;
    אל בוגדשני ומדטפה מגיעים בפניות חצץ נפרדות. תדלקו בצלקה ובנינוצמינדה. רכב עם מרווח גחון אמיתי באמת
    מועיל כאן.
ar:
  name: منتزه جاواخيتي الوطني
  short: شبكة محمية من بحيرات ومستنقعات الهضبة البركانية قرب نينوتسميندا، وأفضل مواقع مراقبة الطيور في
    جورجيا.
  body: >-
    **أُنشئ منتزه جاواخيتي الوطني عام 2011،** وهو ليس كتلة أرض واحدة بل شبكة من البحيرات والأراضي الرطبة
    المبعثرة على الهضبة: خانتشالي، وبوغداشيني، ومداتابا، وسولدا، وكارتساخي. وكلها قرب ألفي متر فوق نجد
    بركاني مكشوف بلا شجر.


    والطيور هي المقصد. تقع جاواخيتي على ممر الهجرة الصاعد شمالاً من أفريقيا وآسيا، وفي الربيع والخريف
    تستقبل البحيرات آلاف الطيور: الكراكي، والإوز، وأنواع كثيرة من البط، والخواضات، والبلشون. **ويعشش البجع
    الدلماسي في خانتشالي وبوغداشيني**، وهو نوع صار نادراً في أوروبا كلها ولا يصمد في جورجيا إلا هنا عملياً.


    ولخانتشالي حكايتها. ففي العهد السوفييتي جُففت البحيرة للري وبقي منسوبها غير مستقر سنوات. وفي العقد
    الأخير بُذل جهد لإعادة النظام المائي فعادت الطيور. وهي من الحالات غير الكثيرة التي يظهر فيها أثر الإحياء
    بالعين.


    ويستحق المشهد نفسه انتباهاً. فهذه هضبة بركانية فتية تطوقها مخاريط سلسلتي أبولي وسامساري، وتجلس البحيرات
    في منخفضات سدّتها تدفقات حمم قديمة. وفي الصيف تكون المروج حولها مراعي صيفية تتناثر فيها مخيمات الرعاة.
    وملاحظة عملية واحدة: بحيرة كارتساخي على الحدود التركية، وفي المنطقة الحدودية قيود على الدخول، فلا
    تقصدها من تلقاء نفسك.


    والبنية التحتية متواضعة: مركز زوار في نينوتسميندا، وبرجا مراقبة في خانتشالي وبوغداشيني، وبضعة مسارات
    قصيرة ومسار للدراجات. والدخول مجاني.


    والشتاء يستحق كلاماً صريحاً. من نوفمبر إلى أبريل تتجمد البحيرات وتغيب الطيور وتهبط حرارة الليل نحو
    ثلاثين تحت الصفر، وهذه من أبرد الأصقاع المأهولة في جورجيا. والريح لا تهدأ فتنقل الثلج إلى الطرق، وكثيراً
    ما تُغلق الطرق الفرعية. وحتى في الصيف لا يكاد يوجد على الهضبة ظل ولا مأوى.
  tip: >-
    أفضل أوقات الطيور أبريل ومايو وسبتمبر وأكتوبر، في الساعات الأولى والأخيرة من النهار. والمنظار ضروري
    لأن الأبراج بعيدة عن الماء. واحمل سترة صادّة للريح حتى في يوليو؛ فعلى 1930 متراً تبرد الأمسيات. وعرّج
    على مركز الزوار في نينوتسميندا في الطريق واسأل أي بحيرة تحتضن الطيور حالياً. واحمل الطعام والماء فليس
    عند البحيرات شيء. والضفاف موحلة، والحذاء العازل للماء يفيد.
  route: >-
    من تبليسي عبر تسالكا وبمحاذاة بحيرة بارافاني إلى نينوتسميندا، نحو 195 كم وقرابة ثلاث ساعات ونصف. الطريق
    معبّد في معظمه، لكن جودته تتفاوت فوق الهضبة والسرعة المتوسطة منخفضة. وتقع خانتشالي على بعد بضعة كيلومترات
    شمال غرب نينوتسميندا؛ أما بوغداشيني ومداتابا فيُوصل إليهما بمنعطفات حصوية منفصلة. تزوّد بالوقود في
    تسالكا ونينوتسميندا. ومركبة بارتفاع هيكل حقيقي مفيدة فعلاً هنا.
