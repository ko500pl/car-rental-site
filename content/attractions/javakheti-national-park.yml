ka:
  name: ჯავახეთის ეროვნული პარკი
  short: >-
    ვულკანური ტბები ჯავახეთის უტყეო ზეგანზე, ორი ათასი მეტრის სიახლოვეს: ვარხვების, ყარყატებისა და იხვების
    სავანე, რომელიც სომხეთში გრძელდება.
  body: >-
    **ჯავახეთის ზეგანზე ჰორიზონტი მხოლოდ ბალახი და ცაა, ტბები კი მასში ჩამოვარდნილი ცის ნატეხებივით დევს
    — თხელი, ქარისგან ათრთოლებული და ფრინველის ხმით სავსე.**


    ჯავახეთის დაცული ტერიტორიები 2011 წლის აპრილში შეიქმნა, საქართველოს მთავრობისა და ბუნების მსოფლიო
    ფონდის (WWF) თანამშრომლობით, გერმანიის მთავრობის დაფინანსებით. თავად ეროვნული პარკი სომხეთისა და თურქეთის
    საზღვრებთან გადაჭიმულ მთის მდელოებს იცავს, ტბებსა და ჭაობებზე კი აღკვეთილები შეიქმნა: ხანჩალი, ბუღდაშენი,
    მადათაფა, ყარწახი და სულდა. 2019 წელს მათ ფარავნის, საღამოსა და აბულის ტბების აღკვეთილები დაემატა.
    სომხეთის მხარეს პარკი არფის ტბის ეროვნულ პარკში გადადის — ფრინველისთვის საზღვარი არ არსებობს.


    ჭაობებსა და ტბებზე შეხვდებით წითელ იხვს, ვარხვებს, ყარყატებსა და თევზიყლაპიებს, ბალახიდან კი ღალღას
    ხრიალა ძახილი მოისმის — თავად ფრინველი იშვიათად გამოჩნდება. ყველაზე ხმაურიანი გაზაფხული და შემოდგომაა,
    როცა გადამფრენი გუნდები ზეგანზე ჩერდება.


    ხანჩალი, ნინოწმინდის მახლობლად, 1931 მეტრზე, კარგად აჩვენებს, რა გადაიტანა ამ მიწამ. საბჭოთა პერიოდში
    მისი ფორმა და დონე არაერთხელ შეცვალეს, 1968–1980 წლებში კი სოფლის მეურნეობისთვის ტბა სრულიად დააშრეს.
    წყალი 1997 წელს დაბრუნდა, მაგრამ ტბა, რომლის სიღრმე 1,4 მეტრს არ აღემატება, დღეს თავდაპირველი ფართობის
    დაახლოებით ნახევარს იკავებს: ჩრდილო-დასავლეთი ნაწილი ისევ მინდვრებს უჭირავს. ეს ტბა ერთხელ წაართვეს
    ზეგანს და ნახევრად დაუბრუნეს.


    ეს ვულკანური მხარეა: ტბები ტექტონიკურ-ვულკანურ ქვაბულებში დევს, ხე არსად ჩანს და ჩრდილი არსად არის.
    მოდით დილის ან საღამოს რბილ საათებში, როცა ქარი წყნარდება და წყალი ფოლადისფრიდან ტყვიისფერში გადადის.
  tip: >-
    ფრინველებზე დასაკვირვებლად საუკეთესოა გაზაფხულისა და შემოდგომის გადაფრენის პერიოდი, დღის პირველი და
    ბოლო საათები. ბინოკლი აუცილებელია, უკეთესი კი ჭოგრიტია — წყლამდე ხშირად შორია. ჯერ ნინოწმინდაში, დაცული
    ტერიტორიების ვიზიტორთა ცენტრში შეიარეთ: რეინჯერებმა იციან, რომელ ტბაზეა ამ კვირაში ფრინველი და რომელი
    მონაკვეთია დაკეტილი. ყარწახი თურქეთის საზღვარზეა, სასაზღვრო ზონაში — წინასწარი შემოწმების გარეშე იქ
    ნუ წახვალთ. შესვლა უფასოა. საჭმელი, წყალი და ქარგაუმტარი ქურთუკი ივლისშიც თან იქონიეთ; ნაპირები ჭაობიანია,
    ამიტომ წყალგაუმტარი ფეხსაცმელი გამოგადგებათ.
  route: >-
    თბილისიდან შ36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ შ31-ით ზეგანზე წალკამდე იარეთ, იქიდან კი სამხრეთით,
    ფარავნის ტბის გასწვრივ, ნინოწმინდამდე. მანგლისის გზით დაახლოებით 170 კილომეტრია, მარნეულისა და კოდის
    გავლით — ცოტა მეტი, 195 კილომეტრამდე; ორივე შემთხვევაში სამიდან სამნახევარ საათამდე. გზა ასფალტია,
    თუმცა ზეგანზე ხარისხი ცვალებადია და საშუალო სიჩქარე დაბალი. ხანჩალი ნინოწმინდიდან რამდენიმე კილომეტრშია
    ჩრდილო-დასავლეთით, ბუღდაშენსა და მადათაფას სამხრეთით, ხრეშიანი შესახვევებით მიადგებით. საწვავი წალკასა
    და ნინოწმინდაში შეავსეთ. აიღეთ ჯიპი: წვიმის შემდეგ ტბებისკენ მიმავალ გზებზე ღრმა ნაკვალევია, ნოემბრიდან
    აპრილამდე კი ზეგანზე თოვლს ქარი გზებზე ახვეტს.
en:
  name: Javakheti National Park
  short: >-
    Volcanic lakes near 2,000 m on the treeless Javakheti plateau, a haunt of pelicans, storks and ducks
    that carries on across the border into Armenia.
  body: >-
    **On the Javakheti plateau the horizon is nothing but grass and sky, and the lakes lie in it like
    fallen pieces of that sky — shallow, ruffled by wind and loud with birds.**


    The Javakheti protected areas were created in April 2011 by the Georgian government with WWF and funding
    from the German government. The national park itself protects mountain grassland along the borders
    with Armenia and Turkey; the lakes and marshes around it became managed reserves: Khanchali, Bugdasheni,
    Madatapa, Kartsakhi and Sulda. In 2019 Lakes Paravani, Saghamo and Abuli were added. Across the Armenian
    border the park runs on into Lake Arpi National Park — for the birds, the frontier does not exist.


    On the lakes and marshes look for ruddy shelduck, pelicans, storks and terns, and listen for the corncrake,
    which rasps from the grass and rarely shows itself. Spring and autumn are the loudest seasons, when
    migrating flocks stop on the plateau.


    Khanchali, near Ninotsminda at 1,931 m, shows what this land has lived through. In the Soviet period
    its shape and level were changed more than once, and between 1968 and 1980 it was drained completely
    for farmland. Water returned in 1997, but the lake, nowhere deeper than 1.4 m, now covers only about
    half its former area: its north-western part is still under fields. It is a lake that was taken from
    the plateau once and given half back.


    This is volcanic country. The lakes lie in tectonic-volcanic hollows, there is not a tree in sight
    and no shade anywhere. Come in the soft hours of morning or evening, when the wind drops and the water
    turns from steel to pewter.
  tip: >-
    Birds are best during the spring and autumn migrations, in the first and last hours of light. Binoculars
    are essential and a spotting scope is better, as the water is often far off. Call first at the protected-areas
    visitor centre in Ninotsminda: the rangers know which lake holds birds that week and which areas are
    closed. Kartsakhi lies on the Turkish border inside a restricted zone, so do not go there without
    checking. Entry is free. Carry food, water and a windproof jacket even in July; the shores are boggy,
    so waterproof boots help.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi, then the Sh31 across the plateau to Tsalka,
    and from there head south along Lake Paravani to Ninotsminda. Via Manglisi it is about 170 km; via
    Marneuli and Koda a little more, up to 195 km; either way allow three to three and a half hours. It
    is asphalt, but on the plateau the surface varies and average speeds stay low. Khanchali lies a few
    kilometres north-west of Ninotsminda; Bugdasheni and Madatapa, further south, are reached on gravel
    turnings. Fill up in Tsalka and Ninotsminda. Take an SUV: the lake tracks rut badly after rain, and
    from November to April the wind drifts snow across the roads.
ru:
  name: Национальный парк Джавахети
  short: >-
    Вулканические озёра на высоте около 2000 м посреди безлесного Джавахетского плато — приют пеликанов,
    аистов и уток; за границей парк продолжается уже в Армении.
  body: >-
    **На Джавахетском плато горизонт — это только трава и небо, а озёра лежат в нём, как упавшие куски
    этого неба: мелкие, взъерошенные ветром и полные птичьего гомона.**


    Охраняемые территории Джавахети созданы в апреле 2011 года правительством Грузии при участии Всемирного
    фонда природы (WWF) и на средства правительства Германии. Сам национальный парк охраняет горные луга
    вдоль границ с Арменией и Турцией, а озёра и болота вокруг него стали заказниками: Ханчали, Бугдашени,
    Мадатапа, Карцахи и Сулда. В 2019 году к ним добавились озёра Паравани, Сагамо и Абули. За армянской
    границей парк переходит в национальный парк «Озеро Арпи» — для птиц этой границы не существует.


    На озёрах и болотах высматривайте огарей, пеликанов, аистов и крачек и прислушивайтесь к коростелю:
    он скрипит из травы, но показывается редко. Громче всего здесь весной и осенью, когда на плато останавливаются
    пролётные стаи.


    Ханчали у Ниноцминды, на высоте 1931 м, показывает, что пришлось пережить этой земле. В советское
    время форму и уровень озера меняли не раз, а с 1968 по 1980 год его полностью осушили под пашню. Вода
    вернулась в 1997 году, но озеро, глубина которого нигде не превышает 1,4 м, занимает теперь лишь около
    половины прежней площади: его северо-западная часть до сих пор под полями. Это озеро, которое однажды
    отняли у плато и вернули лишь наполовину.


    Это вулканический край. Озёра лежат в тектонико-вулканических котловинах, вокруг ни деревца и нигде
    ни клочка тени. Приезжайте в мягкие часы утра или вечера, когда ветер стихает, а вода из стальной
    становится оловянной.
  tip: >-
    Птиц лучше всего смотреть во время весеннего и осеннего пролёта, в первые и последние часы светового
    дня. Бинокль обязателен, а подзорная труба ещё лучше: вода часто далеко. Сначала загляните в визит-центр
    охраняемых территорий в Ниноцминде: рейнджеры знают, на каком озере на этой неделе держатся птицы
    и какие участки закрыты. Карцахи лежит на турецкой границе, в режимной зоне, поэтому не отправляйтесь
    туда, не уточнив заранее. Вход бесплатный. Даже в июле берите еду, воду и ветровку; берега топкие,
    так что пригодятся непромокаемые ботинки.
  route: >-
    Из Тбилиси по Sh36 через Коджори и Манглиси, затем по Sh31 через плато до Цалки, а оттуда на юг вдоль
    озера Паравани до Ниноцминды. Через Манглиси около 170 км; через Марнеули и Коду чуть больше, до 195
    км; в любом случае закладывайте три — три с половиной часа. Дорога асфальтовая, но на плато покрытие
    неровное и средняя скорость остаётся низкой. Ханчали лежит в нескольких километрах к северо-западу
    от Ниноцминды; к Бугдашени и Мадатапе, южнее, ведут гравийные съезды. Заправляйтесь в Цалке и Ниноцминде.
    Берите внедорожник (SUV): после дождя грунтовки к озёрам разбивает в колеи, а с ноября по апрель ветер
    наметает снег на дороги.
fa:
  name: پارک ملی جاواختی
  short: >-
    دریاچه‌های آتشفشانی در ارتفاع نزدیک به ۲۰۰۰ متر بر فلات بی‌درخت جاواختی؛ زیستگاه پلیکان‌ها، لک‌لک‌ها
    و اردک‌ها که آن‌سوی مرز تا ارمنستان ادامه می‌یابد.
  body: >-
    **بر فلات جاواختی افق چیزی جز علف و آسمان نیست و دریاچه‌ها چون تکه‌هایی افتاده از همان آسمان در آن
    آرمیده‌اند: کم‌عمق، آشفته از باد و پر از بانگ پرندگان.**


    مناطق حفاظت‌شدهٔ جاواختی در آوریل ۲۰۱۱ به دست دولت گرجستان، با همکاری صندوق جهانی طبیعت (WWF) و با
    بودجهٔ دولت آلمان، ایجاد شد. خودِ پارک ملی از علفزارهای کوهستانی در امتداد مرز ارمنستان و ترکیه حفاظت
    می‌کند؛ دریاچه‌ها و تالاب‌های پیرامونش به ذخیره‌گاه‌های مدیریت‌شده بدل شدند: خانچالی، بوگداشنی، مداتاپا،
    کارتساخی و سولدا. در ۲۰۱۹ دریاچه‌های پاراوانی، ساغامو و آبولی نیز به آن‌ها افزوده شدند. آن‌سوی مرز
    ارمنستان، پارک در پارک ملی دریاچهٔ آرپی ادامه می‌یابد؛ برای پرندگان این مرز وجود ندارد.


    بر دریاچه‌ها و تالاب‌ها چشم بگردانید تا آنقوت، پلیکان، لک‌لک و پرستوی دریایی ببینید، و گوش به یلوهٔ
    حنایی بسپارید که از میان علف‌ها بانگ زبرش را سر می‌دهد و به‌ندرت خود را نشان می‌دهد. بهار و پاییز
    پرسروصداترین فصل‌هاست، هنگامی که دسته‌های پرندگان مهاجر بر فلات فرود می‌آیند.


    خانچالی، نزدیک نینوتسمیندا و در ارتفاع ۱۹۳۱ متری، نشان می‌دهد این سرزمین چه‌ها از سر گذرانده است.
    در دوران شوروی شکل و تراز آبش بیش از یک بار دگرگون شد و از ۱۹۶۸ تا ۱۹۸۰ برای کشاورزی به‌کلی خشکانده
    شد. آب در ۱۹۹۷ بازگشت، اما دریاچه، که هیچ‌جایش ژرف‌تر از ۱٫۴ متر نیست، اکنون تنها حدود نیمی از مساحت
    پیشینش را می‌پوشاند: بخش شمال‌غربی‌اش هنوز زیر کشتزار است. دریاچه‌ای است که یک بار از فلات گرفته شد
    و تنها نیمی از آن بازگردانده شد.


    اینجا سرزمینی آتشفشانی است. دریاچه‌ها در گودال‌های زمین‌ساختی-آتشفشانی آرمیده‌اند، درختی به چشم نمی‌آید
    و هیچ‌جا سایه‌ای نیست. در ساعت‌های نرم صبح یا عصر بیایید، وقتی باد فرو می‌نشیند و آب از رنگ فولاد
    به رنگ قلع می‌گراید.
  tip: >-
    بهترین زمان برای پرندگان کوچ بهاره و پاییزه است، در نخستین و واپسین ساعت‌های روشنایی روز. دوربین دوچشمی
    ضروری است و دوربین تک‌چشمی پرنده‌نگری از آن هم بهتر، چون آب اغلب دور است. نخست به مرکز بازدیدکنندگان
    مناطق حفاظت‌شده در نینوتسمیندا سر بزنید: محیط‌بانان می‌دانند این هفته پرندگان روی کدام دریاچه‌اند
    و کدام بخش‌ها بسته است. کارتساخی بر مرز ترکیه و در منطقه‌ای با تردد محدود قرار دارد، پس بی‌پرس‌وجو
    به آنجا نروید. ورود رایگان است. حتی در ژوئیه خوراک، آب و بادگیر همراه داشته باشید؛ کرانه‌ها باتلاقی‌اند
    و پوتین ضدآب به کار می‌آید.
  route: >-
    از تفلیس جادهٔ Sh36 را از راه کوجوری و مانگلیسی بگیرید، سپس جادهٔ Sh31 را از روی فلات تا تسالکا، و
    از آنجا در امتداد دریاچهٔ پاراوانی به سوی جنوب تا نینوتسمیندا بروید. از راه مانگلیسی حدود ۱۷۰ کیلومتر
    است؛ از راه مارنئولی و کودا کمی بیشتر، تا ۱۹۵ کیلومتر؛ در هر حال سه تا سه ساعت و نیم وقت بگذارید.
    راه آسفالت است، اما روی فلات کیفیت رویه یکسان نیست و سرعت میانگین پایین می‌ماند. خانچالی چند کیلومتر
    در شمال‌غربی نینوتسمیندا است؛ به بوگداشنی و مداتاپا، که جنوبی‌ترند، از انشعاب‌های شنی می‌رسید. در
    تسالکا و نینوتسمیندا باک را پر کنید. خودروی شاسی‌بلند (SUV) بگیرید: راه‌های خاکی دریاچه‌ها پس از باران
    سخت شیار می‌افتند و از نوامبر تا آوریل باد برف را روی جاده‌ها می‌انبارد.
he:
  name: הפארק הלאומי ג'אווחטי
  short: >-
    אגמים געשיים בגובה של כ-2,000 מ' על רמת ג'אווחטי החשופה מעצים — מקום מחיה של שקנאים, חסידות וברווזים,
    שנמשך מעבר לגבול אל ארמניה.
  body: >-
    **על רמת ג'אווחטי האופק אינו אלא עשב ושמיים, והאגמים שרועים בו כמו פיסות שנפלו מאותם שמיים — רדודים,
    מקומטים ברוח ורועשים מקולות ציפורים.**


    האזורים המוגנים של ג'אווחטי הוקמו באפריל 2011 בידי ממשלת גאורגיה, בשיתוף הקרן העולמית לשימור הטבע
    (WWF) ובמימון ממשלת גרמניה. הפארק הלאומי עצמו מגן על כרי עשב הרריים לאורך הגבולות עם ארמניה וטורקיה;
    האגמים והביצות שסביבו הפכו לשמורות מנוהלות: חנצ'אלי, בוגדשני, מדטאפה, קרצחי וסולדה. ב-2019 נוספו אליהן
    האגמים פרוואני, סגאמו ואבולי. מעבר לגבול הארמני הפארק ממשיך אל הפארק הלאומי אגם ארפי — בשביל הציפורים,
    הגבול אינו קיים.


    על האגמים והביצות חפשו קזרקה חלודית, שקנאים, חסידות ושחפיות, והטו אוזן למלכישליו החלודי, שקריאתו הצורמנית
    עולה מתוך העשב, אבל הוא עצמו נגלה לעין רק לעיתים רחוקות. האביב והסתיו הם העונות הרועשות ביותר, כשלהקות
    נודדות עוצרות על הרמה.


    חנצ'אלי, ליד נינוצמינדה ובגובה 1,931 מ', מראה מה עבר על האדמה הזאת. בתקופה הסובייטית שונו צורתו ומפלסו
    יותר מפעם אחת, ובין 1968 ל-1980 הוא יובש כליל לטובת שדות חקלאיים. המים חזרו ב-1997, אבל האגם, שעומקו
    אינו עולה בשום מקום על 1.4 מ', משתרע כיום על כמחצית בלבד משטחו הקודם: חלקו הצפון-מערבי עדיין מכוסה
    שדות. זה אגם שנלקח מן הרמה פעם אחת והוחזר לה רק למחצה.


    זהו חבל ארץ געשי. האגמים שוכנים בשקעים טקטוניים-געשיים, אין עץ באופק ואין צל בשום מקום. בואו בשעות
    הרכות של הבוקר או הערב, כשהרוח שוככת והמים מחליפים את גוון הפלדה בגוון של בדיל.
  tip: >-
    הזמן הטוב ביותר לציפורים הוא נדידת האביב והסתיו, בשעות האור הראשונות והאחרונות. משקפת היא חובה, וטלסקופ
    תצפית עדיף עוד יותר, כי המים לרוב רחוקים. עצרו קודם במרכז המבקרים של האזורים המוגנים בנינוצמינדה:
    הפקחים יודעים באיזה אגם יש ציפורים השבוע ואילו אזורים סגורים. קרצחי שוכן על גבול טורקיה, בתוך אזור
    שהגישה אליו מוגבלת, אז אל תיסעו לשם בלי לברר מראש. הכניסה חינם. קחו אוכל, מים ומעיל רוח גם ביולי;
    הגדות ביצתיות, כך שנעליים עמידות למים יעזרו.
  route: >-
    מטביליסי סעו בכביש Sh36 דרך קוג'ורי ומנגליסי, ואז בכביש Sh31 לרוחב הרמה עד צלקה, ומשם דרומה לאורך
    אגם פרוואני עד נינוצמינדה. דרך מנגליסי המרחק כ-170 ק״מ; דרך מרנאולי וקודה מעט יותר, עד 195 ק״מ; בכל
    מקרה הקדישו שלוש עד שלוש וחצי שעות. הכביש סלול, אבל על הרמה איכות פני הדרך משתנה והמהירות הממוצעת
    נשארת נמוכה. חנצ'אלי שוכן כמה קילומטרים צפון-מערבית לנינוצמינדה; לבוגדשני ולמדטאפה, דרומה יותר, מגיעים
    בפניות לדרכי חצץ. תדלקו בצלקה ובנינוצמינדה. קחו רכב שטח (SUV): דרכי העפר אל האגמים מתחרצות קשות אחרי
    גשם, ומנובמבר עד אפריל הרוח מערימה סחפי שלג על הכבישים.
ar:
  name: منتزه جافاخيتي الوطني
  short: >-
    بحيرات بركانية على ارتفاع نحو 2000 م فوق هضبة جافاخيتي الجرداء من الشجر، مأوى للبجع واللقالق والبط،
    يمتد عبر الحدود إلى أرمينيا.
  body: >-
    **على هضبة جافاخيتي لا يتألف الأفق إلا من العشب والسماء، والبحيرات مبسوطة فيه كقطع سقطت من تلك السماء:
    ضحلة، تجعّدها الريح، وصاخبة بأصوات الطيور.**


    أُنشئت المناطق المحمية في جافاخيتي في أبريل 2011 على يد الحكومة الجورجية، بالتعاون مع الصندوق العالمي
    للطبيعة (WWF) وبتمويل من الحكومة الألمانية. ويحمي المنتزه الوطني نفسه المراعي الجبلية على امتداد الحدود
    مع أرمينيا وتركيا، أما البحيرات والمستنقعات المحيطة به فصارت محميات مُدارة: خانتشالي وبوغداشيني ومداتابا
    وكارتساخي وسولدا. وفي عام 2019 أُضيفت إليها بحيرات بارافاني وساغامو وأبولي. وعبر الحدود الأرمنية يتواصل
    المنتزه مع منتزه بحيرة أربي الوطني، فلا وجود لهذه الحدود عند الطيور.


    على البحيرات والمستنقعات ابحث عن الشهرمان الأمغر والبجع واللقالق والخرشنات، وأصغِ إلى الصفرد الذي
    يطلق نداءه الأجش من بين العشب ونادراً ما يُظهر نفسه. الربيع والخريف أشد المواسم صخباً، حين تحط أسراب
    الطيور المهاجرة على الهضبة.


    وخانتشالي، قرب نينوتسميندا على ارتفاع 1931 م، تكشف ما عاشته هذه الأرض. ففي الحقبة السوفييتية غُيّر
    شكل البحيرة ومنسوب مياهها أكثر من مرة، وبين عامي 1968 و1980 جُففت تماماً لتصير أرضاً زراعية. عادت
    المياه عام 1997، لكن البحيرة، التي لا يتجاوز عمقها 1.4 م في أي موضع، لا تغطي اليوم سوى نحو نصف مساحتها
    السابقة، إذ لا يزال جزؤها الشمالي الغربي تحت الحقول. إنها بحيرة انتُزعت من الهضبة مرة، ثم أُعيد إليها
    نصفها فقط.


    هذه أرض بركانية. تقع البحيرات في منخفضات تكتونية بركانية، ولا شجرة على مدّ البصر ولا ظل في أي مكان.
    تعال في ساعات الصباح أو المساء الرخية، حين تهدأ الريح ويتحول لون الماء من الفولاذ إلى القصدير.
  tip: >-
    أفضل وقت لمشاهدة الطيور هو موسما الهجرة في الربيع والخريف، في الساعات الأولى والأخيرة من النهار. المنظار
    ضروري، والمقراب الميداني أفضل، فالماء بعيد في الغالب. توقف أولاً عند مركز زوار المناطق المحمية في
    نينوتسميندا: يعرف الحراس أي بحيرة تجتمع فيها الطيور هذا الأسبوع وأي المناطق مغلقة. تقع كارتساخي على
    الحدود التركية داخل منطقة مقيدة الدخول، فلا تذهب إليها قبل التحقق. الدخول مجاني. احمل الطعام والماء
    وسترة واقية من الريح حتى في يوليو؛ والضفاف موحلة سبخة، فالأحذية المقاومة للماء مفيدة.
  route: >-
    من تبليسي اسلك الطريق Sh36 عبر كوجوري ومانغليسي، ثم الطريق Sh31 عبر الهضبة إلى تسالكا، ومنها جنوباً
    بمحاذاة بحيرة بارافاني حتى نينوتسميندا. المسافة عبر مانغليسي نحو 170 كم، وعبر مارنيولي وكودا أكثر
    قليلاً، حتى 195 كم؛ وفي الحالتين احسب من ثلاث ساعات إلى ثلاث ساعات ونصف. الطريق معبّد، لكن سطحه على
    الهضبة متفاوت والسرعة المتوسطة تبقى منخفضة. تقع خانتشالي على بعد بضعة كيلومترات شمال غربي نينوتسميندا،
    ويُبلغ بوغداشيني ومداتابا جنوباً عبر تفرعات حصوية. تزوّد بالوقود في تسالكا ونينوتسميندا. واستأجر سيارة
    دفع رباعي (SUV): فمسالك البحيرات تتخدد بشدة بعد المطر، ومن نوفمبر إلى أبريل تكوّم الريح الثلج على
    الطرق.
