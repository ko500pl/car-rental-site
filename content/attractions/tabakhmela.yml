ka:
  name: ტაბახმელა
  short: >-
    ფიჭვნარიანი სოფელი თბილისის სამხრეთ კიდეზე, ზღვის დონიდან ათასიოდე მეტრზე: „მშრალი ტბის“ სახელი და
    1921 წლის თებერვლის მძიმე ბრძოლები.
  body: >-
    **თავისუფლების მოედნიდან კოჯრის გზით ნახევარი საათის სავალზე, ზღვის დონიდან ათასიოდე მეტრზე, ფიჭვნარში
    ტაბახმელა დგას — იმდენად მაღლა, რომ თბილისის ზაფხული ქვემოთ რჩება.**


    სახელი ორი სიტყვისგან შედგება: „ტბა“ და „ხმელი“. ქართული საენციკლოპედიო წყაროების თანახმად, სოფელი
    პირველად თამარის ისტორიკოსთან მოიხსენიება, როგორც დედოფლის ერთ-ერთი სააგარაკე ადგილი; მოგვიანებით
    ეს მამული სოლოღაშვილებს ეკუთვნოდა, XVIII საუკუნის მეორე ნახევრიდან კი — ორბელიანებს. სოფელი დღესაც
    ყოველ 14 მაისს თამარობას აღნიშნავს.


    1921 წლის თებერვალში ეს სიმაღლეები დედაქალაქის კარიბჭე იყო. 18-დან 20 თებერვლამდე, როცა საბჭოთა რუსეთის
    XI არმია თბილისს უახლოვდებოდა, ტაბახმელა და მეზობელი კოჯორი არაერთხელ გადავიდა ხელიდან ხელში. გენერალ
    გიორგი მაზნიაშვილის ნაწილებმა მოწინააღმდეგე ერთხელ უკუაგდეს კიდეც, მაგრამ 25 თებერვალს წითელი არმია
    თბილისში შევიდა. გზა, რომლითაც აქ ამოდიხართ, მარო მაყაშვილის აღმართზე გადის — ცხრამეტი წლის მოხალისე
    მოწყალების დის სახელზე, რომელიც იმ დღეებში კოჯორთან დაიღუპა.


    2007 წლამდე ტაბახმელა გარდაბნის მუნიციპალიტეტს ეკუთვნოდა, შემდეგ თბილისის ნაწილი გახდა, დღეს კი მთაწმინდის
    რაიონშია; 2014 წლის აღწერით აქ 2073 ადამიანი ცხოვრობდა. 2007 წელს რას-ელ-ხაიმადან ჩამოსულმა ინვესტორმა
    200 000 კვადრატული მეტრის ზეგანზე „თბილისის სიმაღლეების“ — ძვირადღირებული უბნის — საძირკვლის ჩაყრის
    ცერემონია გამართა. სარეკლამო ბროშურები დაიბეჭდა, მაგრამ არაფერი აშენებულა, 2010 წელს კი საამიროს უცხოური
    აქტივების გაყიდვა მოუწია.


    აქ იმისთვის ამოდით, რაც ნამდვილად არის: ფისის სურნელი, მშვიდი ქუჩები და გზა კოჯრისკენ.
  tip: >-
    აქ არც სანახაობათა სიაა და არც ტურისტული ინფრასტრუქტურა: საპირფარეშო, კაფე ან ბენზინგასამართი სადგური
    სოფელში ფაქტობრივად არ არის — წყალი თან იქონიეთ, საწვავი კი ქალაქშივე ჩაასხით. ტაბახმელა ცოცხალი სოფელია:
    მანქანა ისე გააჩერეთ, რომ ჭიშკარს არ გადაეღობოს, და სხვის ეზოებში ნუ შეხვალთ. სახლებს იქით ტყის ბილიკები
    მოუკირწყლავი და მოუნიშნავია — ერთსაათიანი გასეირნებისთვის კარგია, რუკის აპლიკაციის გარეშე ხანგრძლივი
    ლაშქრობისთვის კი — არა. ათასიოდე მეტრზე დეკემბრიდან თებერვლამდე აღმართზე თოვლი და ყინული ჩვეულებრივი
    ამბავია. 14 მაისს, თამარობაზე, სოფელი ერთად იკრიბება. საუკეთესოა ნახევარდღიან მარშრუტად, იმავე გზაზე
    მდებარე კოჯრის ციხესთან ერთად.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 13 კილომეტრი და 30 წუთია. სოლოლაკში ლეონიძისა და ამაღლების ქუჩებით
    აუყევით, მარო მაყაშვილის აღმართის სერპანტინი აიარეთ, შემდეგ კი თბილისი–კოჯრის გზატკეცილით სამხრეთისკენ,
    ფიჭვნარში, დაახლოებით 7 კილომეტრი იარეთ სოფლამდე. გზა ბოლომდე მოასფალტებულია, მაგრამ ვიწროა და მკვეთრი
    მოსახვევები აქვს — აუჩქარებლად იარეთ და სერპანტინზე ადგილი დაუთმეთ მოპირდაპირეს. ეკონომკლასის მანქანა
    ყველა სეზონში გაართმევს თავს, თუ ფრთხილად მართავთ; დეკემბრიდან თებერვლამდე ზამთრის საბურავები გამოგადგებათ.
    საწვავი ქალაქიდან გასვლამდე ჩაასხით. კოჯრამდე და მის ციხემდე კიდევ რამდენიმე კილომეტრია.
en:
  name: Tabakhmela
  short: >-
    A pine-wooded village some 1,000 m up on Tbilisi's southern rim, with a name meaning "dry lake" and
    a hard-fought February in 1921.
  body: >-
    **Half an hour up the Kojori road from Freedom Square, Tabakhmela sits among pines at about a thousand
    metres, high enough to leave Tbilisi's summer below.**


    The name joins two Georgian words: tba, "lake", and khmeli, "dry". Georgian encyclopaedic sources
    say the village first appears in the chronicle of Queen Tamar's reign as one of her summer retreats;
    later it was an estate of the Sologhashvili princes and, from the second half of the 18th century,
    of the Orbelianis. Every 14 May the village still keeps Tamaroba, Queen Tamar's feast.


    In February 1921 these heights were the gateway to the capital. From 18 to 20 February, as the Red
    Army's 11th Army closed on Tbilisi, Tabakhmela and neighbouring Kojori changed hands again and again.
    General Giorgi Mazniashvili's troops drove the attackers back once, but on 25 February the Red Army
    entered Tbilisi. The road you climb runs up the Maro Makashvili Rise, named after the 19-year-old
    volunteer nurse who was killed near Kojori in those days.


    Until 2007 Tabakhmela belonged to Gardabani municipality; it then became part of Tbilisi and today
    lies in the Mtatsminda district, with 2,073 residents at the 2014 census. In 2007 an investor from
    Ras Al Khaimah held a groundbreaking ceremony for "Tbilisi Heights", a luxury quarter on a 200,000-square-metre
    plateau here. The brochures were printed, nothing was built, and by 2010 the emirate was selling off
    its foreign assets.


    Come for what is actually here: resin-scented air, quiet lanes and the road on to Kojori.
  tip: >-
    There are no sights to tick off and no visitor infrastructure: no toilets, cafés or fuel worth counting
    on in the village, so bring water and fill up in town. Tabakhmela is a lived-in village — park without
    blocking gates and keep out of gardens. Beyond the houses the forest tracks are unpaved and unmarked:
    fine for an hour's stroll, not for a long hike without a map app. At about 1,000 m, snow and ice on
    the climb are normal from December to February. On 14 May, for Tamaroba, the village gathers. Best
    as a half-day loop with Kojori Fortress, further up the same road.
  route: >-
    About 13 km and 30 minutes from Freedom Square. Climb through Sololaki on Leonidze and Amaghleba streets,
    take the switchbacks of the Maro Makashvili Rise, then follow the Tbilisi–Kojori road south for about
    7 km through pine forest to the village. It is paved all the way but narrow, with tight bends: drive
    steadily and give way on the hairpins. An economy car copes in every season if driven with care; from
    December to February winter tyres are a real help. Fill up before you leave the city. Kojori and its
    fortress are only a few kilometres further on.
ru:
  name: Табахмела
  short: >-
    Село в соснах на южной кромке Тбилиси, на высоте около 1000 м: имя значит «сухое озеро», а в феврале
    1921 года здесь шли упорные бои.
  body: >-
    **Полчаса вверх по Коджорской дороге от площади Свободы — и среди сосен, на высоте около тысячи метров,
    открывается Табахмела: достаточно высоко, чтобы тбилисское лето осталось внизу.**


    Название складывается из двух грузинских слов: «тба» — «озеро» и «хмели» — «сухой». Грузинские энциклопедические
    источники сообщают, что впервые село упоминается в летописи царствования царицы Тамар как одна из
    её летних резиденций; позднее оно было владением князей Сологашвили, а со второй половины XVIII века
    — Орбелиани. Каждый год 14 мая здесь по-прежнему празднуют Тамаробу — праздник царицы Тамар.


    В феврале 1921 года эти высоты были воротами столицы. С 18 по 20 февраля, когда 11-я армия РККА подступала
    к Тбилиси, Табахмела и соседний Коджори не раз переходили из рук в руки. Войскам генерала Георгия
    Мазниашвили однажды удалось отбросить наступавших, но 25 февраля Красная армия вошла в Тбилиси. Дорога,
    по которой вы поднимаетесь, идёт по подъёму Маро Макашвили — он назван в честь девятнадцатилетней
    сестры милосердия, добровольно ушедшей на фронт и погибшей под Коджори в те самые дни.


    До 2007 года Табахмела входила в Гардабанский муниципалитет, затем стала частью Тбилиси и сегодня
    относится к Мтацминдскому району; перепись 2014 года насчитала здесь 2073 жителя. В 2007 году инвестор
    из Рас-эль-Хаймы устроил торжественную закладку «Тбилиси Хайтс» — элитного квартала на плато площадью
    200 000 квадратных метров. Буклеты напечатали, не построили ничего, а к 2010 году эмират уже распродавал
    свои зарубежные активы.


    Приезжайте за тем, что здесь действительно есть: за воздухом, пахнущим смолой, за тихими улочками
    и за дорогой, что ведёт дальше, к Коджори.
  tip: >-
    Достопримечательностей «для галочки» здесь нет, как нет и туристической инфраструктуры: на туалеты,
    кафе и заправку в селе не рассчитывайте, так что возьмите воду и заправьтесь в городе. Табахмела —
    живое село: паркуйтесь, не загораживая ворота, и не заходите в сады. За домами начинаются лесные дороги
    без покрытия и без маркировки — для часовой прогулки в самый раз, для долгого похода без картографического
    приложения — нет. На высоте около 1000 м снег и гололёд на подъёме с декабря по февраль — обычное
    дело. 14 мая, на Тамаробу, всё село собирается вместе. Лучше всего — полудневная петля вместе с Коджорской
    крепостью, чуть выше по той же дороге.
  route: >-
    Около 13 км и 30 минут от площади Свободы. Поднимитесь через Сололаки по улицам Леонидзе и Амаглеба,
    преодолейте серпантин подъёма Маро Макашвили, а затем около 7 км держитесь Тбилисско-Коджорской дороги
    на юг, через сосновый лес, до самого села. Асфальт на всём протяжении, но дорога узкая и с крутыми
    поворотами: ведите машину ровно и уступайте встречным на крутых виражах. Машина эконом-класса при
    аккуратной езде справится в любое время года; с декабря по февраль зимняя резина очень выручает. Заправьтесь
    до выезда из города. Коджори и его крепость — всего в нескольких километрах дальше.
fa:
  name: تاباخملا
  short: >-
    روستایی در میان کاج‌ها، در ارتفاع حدود ۱۰۰۰ متری بر لبهٔ جنوبی تفلیس، با نامی به معنای «دریاچهٔ خشک»
    و فوریه‌ای پرنبرد در سال ۱۹۲۱.
  body: >-
    **نیم ساعت که از میدان آزادی در جادهٔ کوجوری بالا بروید، تاباخملا را میان کاج‌ها در ارتفاع حدود هزار
    متری می‌یابید؛ آن‌قدر بالا که تابستانِ تفلیس پایین جا می‌ماند.**


    نام روستا از دو واژهٔ گرجی ساخته شده است: «تبا» به معنای دریاچه و «خمِلی» به معنای خشک. به گفتهٔ منابع
    دانشنامه‌ای گرجی، نخستین بار در وقایع‌نامهٔ دوران فرمانروایی ملکه تامار از این روستا یاد شده، به‌عنوان
    یکی از اقامتگاه‌های تابستانی او؛ بعدها ملک شاهزادگان سولوغاشویلی شد و از نیمهٔ دوم سدهٔ هجدهم به خاندان
    اوربلیانی رسید. روستا هنوز هر سال در ۱۴ مه «تاماروبا»، جشن ملکه تامار، را برپا می‌کند.


    در فوریهٔ ۱۹۲۱ این بلندی‌ها دروازهٔ پایتخت بودند. از ۱۸ تا ۲۰ فوریه، هنگامی که ارتش یازدهمِ ارتش سرخ
    حلقه را بر تفلیس تنگ می‌کرد، تاباخملا و کوجوریِ همسایه بارها دست‌به‌دست شدند. نیروهای ژنرال گیورگی
    مازنیاشویلی یک بار مهاجمان را عقب راندند، اما در ۲۵ فوریه ارتش سرخ وارد تفلیس شد. جاده‌ای که از آن
    بالا می‌آیید از سربالایی مارو ماکاشویلی می‌گذرد؛ نامی که از پرستار داوطلب نوزده‌ساله‌ای گرفته شده
    که در همان روزها نزدیک کوجوری کشته شد.


    تاباخملا تا سال ۲۰۰۷ جزو شهرداری گاردابانی بود؛ سپس به تفلیس پیوست و امروز در ناحیهٔ متاتسمیندا قرار
    دارد و بنا بر سرشماری ۲۰۱۴ جمعیتش ۲٬۰۷۳ نفر بود. در سال ۲۰۰۷ سرمایه‌گذاری از رأس‌الخیمه در اینجا مراسم
    کلنگ‌زنی «تفلیس هایتس» را برگزار کرد: محله‌ای مجلل بر فلاتی به مساحت ۲۰۰٬۰۰۰ متر مربع. بروشورها چاپ
    شد، هیچ‌چیز ساخته نشد، و تا سال ۲۰۱۰ امیرنشین داشت دارایی‌های خارجی‌اش را می‌فروخت.


    برای آنچه به‌راستی اینجاست بیایید: هوایی آغشته به بوی صمغ، کوچه‌های آرام، و جاده‌ای که تا کوجوری ادامه
    می‌یابد.
  tip: >-
    اینجا نه جاذبه‌ای هست که از فهرستتان خط بزنید و نه امکانات گردشگری: در روستا روی سرویس بهداشتی، کافه
    یا پمپ‌بنزین حساب نکنید؛ پس آب همراه بیاورید و باک را در شهر پر کنید. تاباخملا روستایی مسکونی و زنده
    است؛ طوری پارک کنید که جلوی دروازه‌ای را نگیرید و به باغ‌ها وارد نشوید. پشت خانه‌ها، راه‌های جنگلی
    خاکی و بی‌نشانه‌اند: برای یک ساعت قدم‌زدن خوب‌اند، نه برای پیاده‌روی طولانی بدون اپلیکیشن نقشه. در
    ارتفاع حدود ۱۰۰۰ متر، برف و یخ در سربالایی از دسامبر تا فوریه امری عادی است. در ۱۴ مه، روز تاماروبا،
    اهالی روستا گرد هم می‌آیند. بهترین کار، گشتی نیم‌روزه همراه با دژ کوجوری است که کمی بالاتر در همین
    جاده قرار دارد.
  route: >-
    حدود ۱۳ کیلومتر و ۳۰ دقیقه از میدان آزادی. از محلهٔ سولولاکی و خیابان‌های لئونیدزه و آماغلبا بالا
    بروید، پیچ‌های سربالایی مارو ماکاشویلی را پشت سر بگذارید و سپس حدود ۷ کیلومتر جادهٔ تفلیس–کوجوری را
    رو به جنوب، از میان جنگل کاج، تا روستا دنبال کنید. تمام راه آسفالت است اما باریک و پرپیچ: آرام و یکنواخت
    برانید و در پیچ‌های تند به خودروی روبه‌رو راه بدهید. خودروی اقتصادی با رانندگی محتاطانه در هر فصلی
    از پس راه برمی‌آید؛ از دسامبر تا فوریه لاستیک زمستانی کمک بزرگی است. پیش از ترک شهر سوخت بزنید. کوجوری
    و دژش تنها چند کیلومتر جلوتر قرار دارند.
he:
  name: טבחמלה
  short: >-
    כפר בין עצי אורן בגובה של כ-1,000 מ׳ בשוליה הדרומיים של טביליסי; שמו פירושו "אגם יבש", ובפברואר 1921
    התחוללו בו קרבות קשים.
  body: >-
    **חצי שעה של עלייה בדרך קוג'ורי מכיכר החירות, ושם, בין עצי האורן בגובה של כאלף מטר, שוכנת טבחמלה –
    גבוה מספיק כדי להשאיר את הקיץ של טביליסי למטה.**


    השם מחבר שתי מילים גאורגיות: "טבה", אגם, ו"חמלי", יבש. לפי מקורות אנציקלופדיים גאורגיים, הכפר מוזכר
    לראשונה בכרוניקה של ימי מלכותה של המלכה תמר, כאחד ממעונות הקיץ שלה; מאוחר יותר היה אחוזה של בית הנסיכים
    סולוגשווילי, ומהמחצית השנייה של המאה ה-18 – של בית אורבליאני. מדי שנה, ב-14 במאי, הכפר עדיין חוגג
    את תמרובה, חגה של המלכה תמר.


    בפברואר 1921 היו הגבהים האלה שער הכניסה לבירה. בין 18 ל-20 בפברואר, כשהארמייה ה-11 של הצבא האדום הידקה
    את הטבעת סביב טביליסי, עברו טבחמלה ושכנתה קוג'ורי מיד ליד שוב ושוב. כוחותיו של הגנרל גיורגי מזניאשווילי
    הדפו את התוקפים פעם אחת, אך ב-25 בפברואר נכנס הצבא האדום לטביליסי. הדרך שבה אתם עולים עוברת במעלה
    מארו מקשווילי, הקרוי על שם האחות המתנדבת בת ה-19 שנהרגה ליד קוג'ורי באותם ימים.


    עד 2007 השתייכה טבחמלה למוניציפליטת גרדבאני; אז צורפה לטביליסי, וכיום היא חלק מרובע מטצמינדה. במפקד
    2014 נמנו בה 2,073 תושבים. ב-2007 ערך כאן משקיע מראס אל-ח'ימה טקס הנחת אבן פינה ל"טביליסי הייטס",
    שכונת יוקרה על רמה בשטח 200,000 מ״ר. החוברות הודפסו, דבר לא נבנה, ועד 2010 כבר מכרה האמירות את נכסיה
    בחו"ל.


    בואו בשביל מה שבאמת יש כאן: אוויר שריח שרף האורנים עומד בו, סמטאות שקטות והדרך שממשיכה אל קוג'ורי.
  tip: >-
    אין כאן אתרים "לסמן" ואין תשתית למבקרים: אל תסמכו על שירותים, בתי קפה או תחנת דלק בכפר, אז הביאו מים
    ותדלקו בעיר. טבחמלה היא כפר חי שגרים בו – חנו בלי לחסום שערים ואל תיכנסו לגינות. מאחורי הבתים דרכי
    היער אינן סלולות ואינן מסומנות: מתאימות לטיול של שעה, לא להליכה ארוכה בלי אפליקציית מפות. בגובה של
    כ-1,000 מ׳ שלג וקרח בעלייה הם דבר שבשגרה מדצמבר עד פברואר. ב-14 במאי, בחג תמרובה, הכפר כולו מתכנס.
    הכי טוב לשלב אותה בסיבוב של חצי יום עם מבצר קוג'ורי, קצת גבוה יותר באותה דרך.
  route: >-
    כ-13 ק״מ ו-30 דקות מכיכר החירות. עלו דרך סולולאקי ברחובות לאונידזה ואמאגלבה, עברו את הסרפנטינות של
    מעלה מארו מקשווילי, ואז המשיכו דרומה בכביש טביליסי–קוג'ורי כ-7 ק״מ דרך יער אורנים עד הכפר. הדרך סלולה
    לכל אורכה, אבל צרה ומלאה עיקולים חדים: נהגו בקצב אחיד ותנו זכות קדימה בפניות הפרסה. רכב מקבוצת אקונומי
    יסתדר בכל עונה בנהיגה זהירה; מדצמבר עד פברואר צמיגי חורף עוזרים מאוד. תדלקו לפני היציאה מהעיר. קוג'ורי
    והמבצר שלה נמצאים רק כמה קילומטרים הלאה.
ar:
  name: تاباخميلا
  short: >-
    قرية بين الصنوبر على ارتفاع نحو 1,000 متر عند الحافة الجنوبية لتبليسي، يعني اسمها «البحيرة الجافة»،
    وشهدت معارك ضارية في شباط/فبراير 1921.
  body: >-
    **على بُعد نصف ساعة صعوداً في طريق كوجوري من ساحة الحرية، تقوم تاباخميلا بين أشجار الصنوبر على ارتفاع
    نحو ألف متر، وهو ارتفاع يكفي ليبقى صيف تبليسي في الأسفل.**


    يجمع الاسم كلمتين جورجيتين: «تبا» أي بحيرة، و«خميلي» أي جافة. وتذكر المصادر الموسوعية الجورجية أن
    القرية وردت أول مرة في حوليات عهد الملكة تمار بوصفها أحد مصايفها؛ ثم صارت لاحقاً ضيعة لأمراء سولوغاشفيلي،
    ومنذ النصف الثاني من القرن الثامن عشر لآل أوربلياني. وما زالت القرية تحتفل في 14 أيار/مايو من كل عام
    بعيد «تاماروبا»، عيد الملكة تمار.


    في شباط/فبراير 1921 كانت هذه المرتفعات بوابة العاصمة. فمن 18 إلى 20 شباط/فبراير، بينما كان الجيش الحادي
    عشر من الجيش الأحمر يُطبق على تبليسي، تناقلت الأيدي تاباخميلا وجارتها كوجوري مرة بعد مرة. وتمكّنت
    قوات الجنرال غيورغي مازنياشفيلي من صدّ المهاجمين مرة، لكن الجيش الأحمر دخل تبليسي في 25 شباط/فبراير.
    والطريق الذي تصعده يمرّ بمرتفع مارو ماكاشفيلي، المسمّى باسم الممرضة المتطوعة ذات التسعة عشر عاماً
    التي قُتلت قرب كوجوري في تلك الأيام.


    ظلت تاباخميلا حتى عام 2007 تابعة لبلدية غارداباني، ثم ضُمّت إلى تبليسي، وهي اليوم ضمن حي متاتسميندا،
    وقد أحصى تعداد 2014 فيها 2,073 نسمة. وفي عام 2007 أقام مستثمر من رأس الخيمة هنا حفل وضع حجر الأساس
    لمشروع «تبليسي هايتس»، وهو حي فاخر على هضبة مساحتها 200,000 متر مربع. طُبعت الكتيّبات، ولم يُبنَ شيء،
    وبحلول عام 2010 كانت الإمارة تبيع أصولها في الخارج.


    تعالَ من أجل ما هو موجود هنا فعلاً: هواء يعبق برائحة الراتنج، وأزقة هادئة، وطريق يمضي إلى كوجوري.
  tip: >-
    لا معالم هنا تُشطب من قائمة، ولا بنية سياحية: لا تعوّل في القرية على دورات مياه أو مقاهٍ أو محطة وقود،
    فاحمل ماءك واملأ خزانك في المدينة. تاباخميلا قرية مأهولة يعيش فيها أهلها، فاركن سيارتك دون أن تسدّ
    البوابات، ولا تدخل البساتين. خلف البيوت تمتد مسالك الغابة غير معبّدة ولا معلَّمة: تصلح لنزهة ساعة،
    لا لمسير طويل من دون تطبيق خرائط. على ارتفاع نحو 1,000 متر، الثلج والجليد على الصعود أمر عادي من كانون
    الأول/ديسمبر إلى شباط/فبراير. وفي 14 أيار/مايو، يوم تاماروبا، تجتمع القرية كلها. الأفضل أن تجعلها
    جولة نصف يوم مع قلعة كوجوري، الأعلى قليلاً على الطريق نفسه.
  route: >-
    نحو 13 كم و30 دقيقة من ساحة الحرية. اصعد عبر سولولاكي في شارعي ليونيدزه وأماغليبا، واجتز منعطفات مرتفع
    مارو ماكاشفيلي، ثم اتبع طريق تبليسي–كوجوري جنوباً نحو 7 كم عبر غابة الصنوبر حتى القرية. الطريق معبّد
    بالكامل لكنه ضيق وكثير المنعطفات الحادة: قُد بإيقاع ثابت وأفسح الطريق عند المنعطفات الضيقة. تكفي سيارة
    من الفئة الاقتصادية في كل الفصول إذا قُدتها بحذر؛ ومن كانون الأول/ديسمبر إلى شباط/فبراير تفيد الإطارات
    الشتوية كثيراً. املأ الخزان قبل مغادرة المدينة. كوجوري وقلعتها على بُعد بضعة كيلومترات فقط.
