ka:
  name: დიდაჭარის ჯამე
  short: >-
    კაკლის ხის ჯამე, რომელიც 1828 წელს ლაზმა ოსტატებმა ჩუქურთმით შეამკეს; 2002 წლამდე დიდაჭარაში იდგა,
    დღეს კი ხეობაში უფრო ზემოთ, საციხურშია.
  body: >-
    **ცოტა შენობას აქვს ასეთი მოუსვენარი ბიოგრაფია: ეს ჯამე დაწვეს, ხელახლა ააგეს, სამ სოფელს გაუნაწილეს
    და ბოლოს ხეობაში უფრო ზემოთ, ახალ ადგილას გადაიტანეს.**


    ამბავი დიდაჭარაში იწყება — ზემო აჭარის სოფელში, ხულოს მახლობლად. აქაური ჯამე XVIII საუკუნის ბოლოსა
    და XIX საუკუნის დასაწყისს მიეკუთვნება. რუსეთ-თურქეთის ერთ-ერთი ომის დროს ის რუსმა გენერალმა ოსტენ-საკენმა
    გადაწვა. 1814 წელს აჭარისწყლის ხეობის ზემო სოფლებისთვის ახალი შენობა აიგო, მაგრამ მალევე დაშალეს და
    სამ სოფელს — პაქსაძეებს, ბაღლეთსა და დიდაჭარას — გაუნაწილეს.


    1828 წელს დიდაჭარის ჯამე ლაზმა ოსტატებმა მდიდრულად შეამკეს. შენობა მასიური კაკლის ხისგანაა ნაგები,
    მისი სიამაყე კი კარია, წნულით დაფარული: ხის ზოლები ისეა ამოკვეთილი, თითქოს ოსტატებს მთლიანი ხისგან
    კალათის მოწვნა სდომებოდათ. ეს ლაზური ხეზე კვეთის ერთ-ერთი გამორჩეული ნიმუშია და მსგავსს საქართველოში
    იშვიათად შეხვდებით.


    ჯამე დიდაჭარაში 2002 წლამდე იდგა. როცა სოფელმა ახალი მეჩეთი ააშენა, ძველი იმავე ხეობის ზემო ნაწილში
    მდებარე საციხურს გადასცეს. აქ ის დღესაც დგას — საგრძნობლად განახლებული, მაგრამ ძველი იერსახით. 2006
    წელს მას ეროვნული მნიშვნელობის კულტურის უძრავი ძეგლის სტატუსი მიენიჭა, კულტურული მემკვიდრეობის რეესტრში
    კი, სავსებით ლოგიკურად, „საციხურის მეჩეთის“ სახელითაა შეტანილი.


    სოფელიც შეიცვალა და სახელიც. კაკალი იგივე დარჩა.
  tip: >-
    შესვლა უფასოა, განსაზღვრული საათები კი არ არსებობს: ეს სოფლის ჯამეა და არა მუზეუმი, ამიტომ თუ კარი
    დაკეტილია, მეზობლებს ჰკითხეთ. ჩაიცვით თავშეკავებულად — მხრები და მუხლები დაფარული უნდა იყოს; ქალებს
    თავსაფარი დასჭირდებათ, ზღურბლთან კი ფეხსაცმელს იხდიან. თუ შიგნით ლოცულობენ, გარეთ დაიცადეთ და ადამიანების
    გადაღებამდე ნებართვა ითხოვეთ. ნაჩუქურთმევი კარის გულდასმით დასათვალიერებლად ნახევარი საათი საკმარისია.
    კაფე და საპირფარეშო აქ არ არის — საჭმელს, საწვავსა და ღამის გასათევს ხულოში იპოვით. დაახლოებით 1150
    მეტრზე ზამთარში ნამდვილი თოვლი მოდის, ამიტომ ამ დროს ბოლო მონაკვეთზე მხოლოდ 4x4-ით ასვლა ღირს.
  route: >-
    ყველაზე მოკლე გზა 291 კილომეტრია, დაახლოებით ექვსი საათი და ორმოცდახუთი წუთი. თბილისიდან ს1-ით (E60)
    დასავლეთით ხაშურამდე იარეთ, შემდეგ ს8-ით ბორჯომის გავლით ახალციხემდე, იქიდან კი შ1-ით — ბათუმი–ახალციხის
    გზით — ადიგენის გავლით გოდერძის უღელტეხილზე (2025 მ) გადადით. ხულომდე ცოტა ადრე ჩრდილოეთით, ადგილობრივ
    გზაზე გადაუხვიეთ: ის დაახლოებით შვიდ კილომეტრზე თავად დიდაჭარის გავლით საციხურამდე ადის. ბოლო მონაკვეთი
    ხრეშიანად ჩათვალეთ და ჯიპი აიღეთ. უღელტეხილი საიმედოა მხოლოდ უთოვლო თვეებში, ზოგან ჯერაც მოუასფალტებელია
    და ბევრი გამქირავებელი მასზე მოძრაობას ხელშეკრულებით კრძალავს. მთელი წლის ალტერნატივა ბათუმზე გადის
    და აჭარისწყლის ხეობას ქედისა და შუახევის გავლით მიუყვება — დაახლოებით 455 კმ. საწვავი ახალციხესა და
    ხულოში ჩაასხით.
en:
  name: Didachara Mosque
  short: >-
    A walnut mosque carved by Laz craftsmen in 1828 that stood in Didachara until 2002 and now lives higher
    up the valley, in Satsikhuri.
  body: >-
    **Few buildings have a biography this restless: the mosque was burned, rebuilt, shared out among three
    villages and finally carried up the valley to a new home.**


    The story begins in Didachara, a village near Khulo in upper Adjara, whose mosque dates from the late
    18th or early 19th century. During one of the Russo-Turkish wars it was burned by the Russian general
    Osten-Sacken. In 1814 a new building went up to serve the villages of the upper Adjaristsqali valley,
    but it was soon taken apart and divided among three of them: Pakhsadzeebi, Baghleti and Didachara.


    In 1828 Laz master craftsmen dressed the Didachara mosque in rich carving. It is built of massive
    walnut, and its pride is the door, covered in plaited ornament: strips of wood carved so that they
    seem woven, as if the carvers had set out to make a basket from a whole tree. It is counted among
    the finest examples of Laz woodcarving, and you will not see much like it elsewhere in Georgia.


    The mosque stood in Didachara until 2002. When the village built a new one, the old building was handed
    over to Satsikhuri, higher up the same valley, where it stands today, heavily renovated but with its
    old face intact. In 2006 it was listed as an immovable cultural monument of national significance,
    and the heritage register, logically enough, calls it the Satsikhuri Mosque.


    The village changed, and so did the name. The walnut stayed.
  tip: >-
    Entry is free and there are no fixed hours: this is a village mosque, not a museum, so if the door
    is shut, ask a neighbour. Dress modestly, with shoulders and knees covered; women should bring a headscarf,
    and shoes come off at the threshold. If people are at prayer, wait outside, and ask before photographing
    anyone. Half an hour is enough to study the carved door properly. There is no café or toilet; Khulo
    has food, fuel and guesthouses. At about 1,150 metres the village gets real snow, so in winter treat
    the last road as a job for a 4x4.
  route: >-
    The shortest way is 291 km, about six hours forty-five minutes. Take the S1 (E60) west to Khashuri
    and the S8 through Borjomi to Akhaltsikhe, then the Sh1, the Batumi–Akhaltsikhe road, west past Adigeni
    and over the Goderdzi Pass (2,025 m). Just before Khulo turn north onto a local road that climbs about
    seven kilometres, through Didachara itself, to Satsikhuri; treat the final stretch as gravel and take
    an SUV. The pass is dependable only in the snow-free months, still has unpaved patches, and many rental
    contracts exclude it. The year-round alternative runs via Batumi and up the Adjaristsqali through
    Keda and Shuakhevi, about 455 km. Fuel in Akhaltsikhe and Khulo.
ru:
  name: Мечеть Дидачара
  short: >-
    Мечеть из массивного ореха, покрытая резьбой лазских мастеров в 1828 году; до 2002-го стояла в Дидачаре,
    а теперь — выше по долине, в Сацихури.
  body: >-
    **Мало у каких зданий такая беспокойная биография: мечеть сжигали, отстраивали заново, делили между
    тремя сёлами и в конце концов перенесли вверх по долине, на новое место.**


    История начинается в Дидачаре, селе близ Хуло в Верхней Аджарии, чья мечеть восходит к концу XVIII
    или началу XIX века. В одну из русско-турецких войн её сжёг русский генерал Остен-Сакен. В 1814 году
    для сёл верхней долины Аджарисцкали поставили новое здание, но вскоре его разобрали и поделили между
    тремя из них: Пахсадзееби, Баглети и Дидачарой.


    В 1828 году лазские мастера одели дидачарскую мечеть в богатую резьбу. Она сложена из массивного ореха,
    и её гордость — дверь, покрытая плетёным орнаментом: деревянные полосы вырезаны так, что кажутся сплетёнными,
    будто резчики задумали сделать корзину из целого дерева. Её причисляют к лучшим образцам лазской резьбы
    по дереву, и ничего подобного в Грузии почти не встретишь.


    Мечеть стояла в Дидачаре до 2002 года. Когда село построило новую, старое здание передали Сацихури,
    выше по той же долине, где оно стоит и сегодня — сильно обновлённое, но с прежним лицом. В 2006 году
    мечеть внесли в список недвижимых памятников культуры национального значения, и реестр наследия вполне
    логично называет её мечетью Сацихури.


    Село сменилось, а с ним и название. Орех остался.
  tip: >-
    Вход бесплатный, постоянных часов нет: это сельская мечеть, а не музей, так что если дверь заперта,
    спросите соседей. Одевайтесь скромно, плечи и колени должны быть закрыты; женщинам стоит взять платок,
    обувь снимают у порога. Если идёт молитва, подождите снаружи, и спрашивайте разрешения, прежде чем
    кого-то фотографировать. Получаса хватит, чтобы как следует рассмотреть резную дверь. Кафе и туалета
    нет; еда, топливо и гостевые дома — в Хуло. На высоте около 1150 метров зимой лежит настоящий снег,
    так что в это время последний участок дороги — работа для машины 4x4.
  route: >-
    Кратчайший путь — 291 км, около шести часов сорока пяти минут. По S1 (E60) на запад до Хашури, по
    S8 через Боржоми до Ахалцихе, затем по Sh1, дороге Батуми — Ахалцихе, на запад мимо Адигени и через
    перевал Годердзи (2025 м). Незадолго до Хуло сверните на север, на местную дорогу, которая поднимается
    примерно на семь километров — через саму Дидачару — к Сацихури; последний отрезок считайте гравийным
    и берите внедорожник. Перевал надёжен только в бесснежные месяцы, на нём до сих пор есть участки без
    покрытия, и многие договоры проката его исключают. Круглогодичный вариант идёт через Батуми и вверх
    по Аджарисцкали через Кеду и Шуахеви — около 455 км. Заправки — в Ахалцихе и Хуло.
fa:
  name: مسجد دیداچارا
  short: >-
    مسجدی از چوب گردو که استادکاران لاز در ۱۸۲۸ کنده‌کاری‌اش کردند؛ تا ۲۰۰۲ در دیداچارا بود و اکنون بالاتر
    در همان دره، در ساتسیخوری، جای گرفته است.
  body: >-
    **کمتر بنایی زندگی‌نامه‌ای چنین ناآرام دارد: این مسجد سوخت، از نو ساخته شد، میان سه روستا قسمت شد
    و سرانجام به بالای دره برده شد تا خانه‌ای تازه بیابد.**


    داستان از دیداچارا آغاز می‌شود، روستایی نزدیک خولو در آجارای علیا، که مسجدش به اواخر سدهٔ هجدهم یا
    اوایل سدهٔ نوزدهم بازمی‌گردد. در یکی از جنگ‌های روس و عثمانی، ژنرال روس اوستن-زاکن آن را به آتش کشید.
    در سال ۱۸۱۴ بنایی تازه برای روستاهای بخش بالایی درهٔ آجاریس‌تسکالی برپا شد، اما چندی نگذشت که آن را
    از هم گشودند و میان سه روستا قسمت کردند: پاخسادزه‌ابی، باغلتی و دیداچارا.


    در سال ۱۸۲۸ استادکاران لاز مسجد دیداچارا را جامه‌ای از کنده‌کاری‌های پرکار پوشاندند. مسجد از چوب ستبر
    گردو ساخته شده و مایهٔ افتخارش درِ آن است که سراسر با نقش‌های بافته پوشیده شده: نوارهای چوب را چنان
    کنده‌اند که گویی بافته شده‌اند، انگار کنده‌کاران خواسته‌اند از تنهٔ یک درخت درست سبدی بسازند. این
    مسجد از بهترین نمونه‌های کنده‌کاری چوبی لاز به شمار می‌رود و همانندش را در جای دیگری از گرجستان کمتر
    می‌بینید.


    مسجد تا سال ۲۰۰۲ در دیداچارا ایستاده بود. وقتی روستا مسجدی تازه ساخت، بنای کهنه به ساتسیخوری، بالاتر
    در همان دره، سپرده شد و امروز همان‌جا ایستاده است؛ بسیار نوسازی‌شده، اما با همان چهرهٔ دیرین. در سال
    ۲۰۰۶ در فهرست آثار فرهنگی غیرمنقولِ دارای اهمیت ملی ثبت شد و فهرست میراث، که منطقی هم هست، آن را مسجد
    ساتسیخوری می‌نامد.


    روستا عوض شد، نام هم. گردو ماند.
  tip: >-
    ورود رایگان است و ساعت مشخصی ندارد: این مسجدی روستایی است، نه موزه، پس اگر در بسته بود از همسایه‌ای
    بپرسید. پوشیده لباس بپوشید و شانه‌ها و زانوها را بپوشانید؛ بانوان روسری همراه بیاورند و کفش‌ها را
    دم در درمی‌آورند. اگر کسانی در حال نمازند، بیرون منتظر بمانید و پیش از عکس گرفتن از کسی اجازه بخواهید.
    نیم ساعت برای تماشای دقیق درِ کنده‌کاری‌شده بس است. کافه و سرویس بهداشتی نیست؛ در خولو غذا، سوخت و
    مهمان‌خانه پیدا می‌شود. روستا در ارتفاع حدود ۱۱۵۰ متری است و برف حسابی می‌گیرد، پس در زمستان تکهٔ
    آخر جاده را کارِ یک خودروی دیفرانسیل‌دار (4x4) بدانید.
  route: >-
    کوتاه‌ترین راه ۲۹۱ کیلومتر است، حدود شش ساعت و چهل‌وپنج دقیقه. با S1 (E60) رو به غرب تا خاشوری بروید
    و با S8 از راه بورجومی تا آخالتسیخه، سپس با Sh1، جادهٔ باتومی–آخالتسیخه، رو به غرب از کنار آدیگنی
    و از گردنهٔ گودردزی (۲۰۲۵ متر) بگذرید. کمی پیش از خولو به سمت شمال وارد جاده‌ای محلی شوید که حدود
    هفت کیلومتر، از میان خود دیداچارا، تا ساتسیخوری بالا می‌رود؛ تکهٔ پایانی را شنی فرض کنید و خودروی
    شاسی‌بلند بردارید. گردنه تنها در ماه‌های بی‌برف قابل اعتماد است، هنوز بخش‌های بی‌آسفالت دارد و بسیاری
    از قراردادهای اجاره آن را مستثنا می‌کنند. مسیر جایگزینِ تمام‌سال از راه باتومی و بالا رفتن در درهٔ
    آجاریس‌تسکالی از کدا و شواخوی می‌گذرد، حدود ۴۵۵ کیلومتر. سوخت در آخالتسیخه و خولو.
he:
  name: מסגד דידצ'ארה
  short: מסגד מעץ אגוז שאומנים לאזים גילפו ב-1828; עד 2002 עמד בדידצ'ארה, וכיום הוא שוכן גבוה יותר באותו
    עמק, בסציחורי.
  body: >-
    **למעט מבנים יש ביוגרפיה חסרת מנוחה כזאת: המסגד נשרף, נבנה מחדש, חולק בין שלושה כפרים ולבסוף הועבר
    במעלה העמק אל בית חדש.**


    הסיפור מתחיל בדידצ'ארה, כפר סמוך לחולו באג'ריה העילית, שהמסגד שלו מתוארך לסוף המאה ה-18 או לתחילת
    המאה ה-19. באחת המלחמות הרוסיות-טורקיות הוא הועלה באש בידי הגנרל הרוסי אוסטן-סאקן. ב-1814 הוקם מבנה
    חדש שישרת את כפרי עמק האג'ריסצקאלי העליון, אבל עד מהרה פורק וחולק בין שלושה מהם: פחסדזאבי, בגלטי ודידצ'ארה.


    ב-1828 הלבישו אומנים לאזים את מסגד דידצ'ארה בגילופים עשירים. הוא בנוי מעץ אגוז מסיבי, וגאוותו היא
    הדלת, המכוסה בעיטור קלוע: רצועות עץ מגולפות כך שהן נראות ארוגות, כאילו הגלפים ביקשו לעשות סל מעץ שלם.
    הוא נמנה עם הדוגמאות המשובחות ביותר של גילוף העץ הלאזי, ומעט מאוד דומה לו תמצאו במקומות אחרים בגאורגיה.


    המסגד עמד בדידצ'ארה עד 2002. כשהכפר בנה מסגד חדש, הועבר המבנה הישן לסציחורי, גבוה יותר באותו עמק,
    ושם הוא עומד היום, משופץ מאוד אבל עם פניו הישנים. ב-2006 הוא נרשם כנכס מורשת תרבותית בלתי מיטלטל בעל
    חשיבות לאומית, ומרשם המורשת, באופן די הגיוני, קורא לו מסגד סציחורי.


    הכפר השתנה, וגם השם. האגוז נשאר.
  tip: >-
    הכניסה חופשית ואין שעות קבועות: זהו מסגד כפרי, לא מוזיאון, ולכן אם הדלת סגורה שאלו את אחד השכנים.
    התלבשו בצניעות, עם כתפיים וברכיים מכוסות; נשים צריכות להביא מטפחת ראש, ואת הנעליים חולצים על הסף.
    אם מתפללים בפנים, המתינו בחוץ, ובקשו רשות לפני שאתם מצלמים מישהו. חצי שעה מספיקה כדי להתבונן היטב
    בדלת המגולפת. אין בית קפה ולא שירותים; בחולו יש אוכל, דלק ובתי הארחה. בגובה של כ-1150 מטרים יורד בכפר
    שלג של ממש, ולכן בחורף התייחסו לקטע האחרון של הדרך כמשימה לרכב 4x4.
  route: >-
    הדרך הקצרה ביותר היא 291 ק״מ, כשש שעות וארבעים וחמש דקות. סעו בכביש S1 (E60) מערבה עד חשורי ובכביש
    S8 דרך בורג'ומי לאחלציחה, ואז בכביש Sh1, כביש בטומי–אחלציחה, מערבה על פני אדיגני ומעל מעבר גודרדזי
    (2025 מטרים). ממש לפני חולו פנו צפונה לדרך מקומית שמטפסת כשבעה קילומטרים, דרך דידצ'ארה עצמה, עד סציחורי;
    התייחסו לקטע האחרון כדרך חצץ וקחו רכב שטח. על המעבר אפשר לסמוך רק בחודשים שאין בהם שלג, יש בו עדיין
    קטעים לא סלולים, וחוזי השכרה רבים אינם מתירים לנסוע בו. החלופה הפתוחה כל השנה עוברת דרך בטומי ובמעלה
    עמק האג'ריסצקאלי דרך קדה ושואחבי, כ-455 ק״מ. דלק באחלציחה ובחולו.
ar:
  name: مسجد ديداتشارا
  short: >-
    مسجد من خشب الجوز نقشه حرفيون من اللاز عام 1828، ظل قائماً في ديداتشارا حتى 2002، ويستقر اليوم أعلى
    الوادي في ساتسيخوري.
  body: >-
    **قليلة هي المباني التي عاشت سيرة مضطربة كهذه: فقد أُحرق المسجد، وأُعيد بناؤه، وقُسّم بين ثلاث قرى،
    ثم حُمل أخيراً صعوداً في الوادي إلى بيت جديد.**


    تبدأ الحكاية في ديداتشارا، القرية القريبة من خولو في أدجارا العليا، التي يعود مسجدها إلى أواخر القرن
    الثامن عشر أو أوائل القرن التاسع عشر. وفي إحدى الحروب الروسية التركية أحرقه الجنرال الروسي أوستن-ساكن.
    وفي عام 1814 شُيّد مبنى جديد ليخدم قرى أعالي وادي أدجاريستسكالي، لكنه سرعان ما فُكّك وقُسّم بين ثلاث
    منها: باخسادزيبي وباغليتي وديداتشارا.


    في عام 1828 كسا معلّمون حرفيون من اللاز مسجد ديداتشارا بنقوش غنية. وهو مبني من خشب الجوز المصمت، وفخره
    بابه المغطى بزخرفة مضفورة: شرائط من الخشب نُحتت بحيث تبدو منسوجة، كأن النحّاتين أرادوا أن يصنعوا سلّة
    من شجرة كاملة. ويُعدّ من أرقى نماذج النحت اللازي على الخشب، ولن ترى ما يشبهه كثيراً في مكان آخر من
    جورجيا.


    ظل المسجد قائماً في ديداتشارا حتى عام 2002. وحين بنت القرية مسجداً جديداً، سُلّم المبنى القديم إلى
    ساتسيخوري، الأعلى في الوادي نفسه، حيث يقوم اليوم، وقد جُدّد تجديداً كبيراً لكن وجهه القديم بقي كما
    هو. وفي عام 2006 سُجّل معلماً ثقافياً ثابتاً ذا أهمية وطنية، ويسميه سجل التراث، وهذا منطقي، مسجد ساتسيخوري.


    تغيّرت القرية، وتغيّر الاسم معها. أما الجوز فبقي.
  tip: >-
    الدخول مجاني ولا ساعات ثابتة: هذا مسجد قروي لا متحف، فإن وجدت الباب مغلقاً فاسأل أحد الجيران. البس
    ثياباً محتشمة تستر الكتفين والركبتين؛ وعلى النساء إحضار غطاء للرأس، وتُخلع الأحذية عند العتبة. إن
    كان الناس يصلّون فانتظر في الخارج، واستأذن قبل تصوير أي شخص. نصف ساعة تكفي لتتأمل الباب المنحوت كما
    ينبغي. لا مقهى ولا دورة مياه؛ وفي خولو تجد الطعام والوقود وبيوت الضيافة. على ارتفاع نحو 1150 متراً
    تتساقط على القرية ثلوج حقيقية، فاعتبر المقطع الأخير من الطريق في الشتاء مهمة لسيارة دفع رباعي (4x4).
  route: >-
    أقصر الطرق 291 كم، نحو ست ساعات وخمس وأربعين دقيقة. اسلك S1 (E60) غرباً حتى خاشوري، ثم S8 عبر بورجومي
    إلى أخالتسيخه، ثم Sh1، طريق باتومي–أخالتسيخه، غرباً مروراً بأديغيني وعبر ممر غودردزي (2025 م). قبيل
    خولو انعطف شمالاً إلى طريق محلي يصعد نحو سبعة كيلومترات، عبر ديداتشارا نفسها، حتى ساتسيخوري؛ واعتبر
    المقطع الأخير حصوياً وخذ سيارة دفع رباعي. لا يُعتمد على الممر إلا في الأشهر الخالية من الثلج، وما
    زالت فيه مقاطع غير معبّدة، وكثير من عقود الاستئجار تستثنيه. أما البديل المتاح طوال العام فيمر بباتومي
    ثم يصعد مع وادي أدجاريستسكالي عبر كيدا وشواخيفي، نحو 455 كم. الوقود في أخالتسيخه وخولو.
