ka:
  name: არწივის ხეობა
  short: კირქვის თეთრი კლდეებისა და სვეტების დაცული კანიონი დედოფლისწყაროსთან — კახეთის ერთ-ერთი საუკეთესო
    ადგილი ფრინველებზე დაკვირვებისთვის, ორბებითა და ყარყატებით.
  body: >-
    **არწივის ხეობა კახეთის სტეპის მოულოდნელი სანახაობაა.** დედოფლისწყაროდან სულ 4 კმ-ში ჩრდილოეთით მდებარე
    ეს დაცული ბუნების ძეგლი (დაცული ტერიტორიების სააგენტო) კირქვის დრამატული კანიონია — თეთრი სვეტები,
    კლდის კედლები და მათ გასწვრივ გადაჭიმული ტყე. ხეობა სახელს ამართლებს: აქ სამოცზე მეტი სახეობის ფრინველი
    ბინადრობს, მათ შორის კლდეებზე მობუდარი ორბები და შავი ყარყატები, რომლებიც კიდის ქვემოთ დაბლა მოფრინავენ.


    ხეობის გასწვრივ მონიშნული 1-კილომეტრიანი საფეხმავლო ბილიკია გადასახედებითა და ფანჩატურებით — მთლიანი
    წრე დაახლოებით ერთ საათს იკავებს და აღმართები მსუბუქია. ცალკე ნახევარკილომეტრიანი ბილიკი კანიონის
    აღმოსავლეთ კლდეზე აღმართულ V საუკუნის ხორნაბუჯის ციხემდე ადის — ციხეს საიტზე ცალკე გვერდი აქვს, აქ
    კი თავად ხეობა და ბილიკებია აღწერილი.


    შესვლა უფასოა და ხეობა მთელი წელი ღიაა. გაზაფხული და შემოდგომა ყველაზე კომფორტული დროა — ზაფხულში
    კახური სტეპი ცხელა. ეს ადგილი დედოფლისწყაროსა და ვაშლოვანისკენ მიმავალი ნებისმიერი მოგზაურობის ბუნებრივი
    პირველი გაჩერებაა.
  tip: >-
    ბინოკლი აუცილებლად წამოიღე — ორბები ყველაზე ხშირად დილით და ნაშუადღევს მოფრინავენ კიდის დონეზე. ზაფხულში
    წყალი, ქუდი და მზისგან დამცავი გჭირდება: ჩრდილი ბილიკზე ცოტაა. კიდესთან ფრთხილად იყავი — მოაჯირი
    ყველგან არ არის. თუ დრო გაქვს, ხორნაბუჯის ციხეზე ასვლა დაამატე — ხედი მთელ ალაზნის ველზე იშლება.
    გადაადგილება მშრალ ამინდში ჩვეულებრივი ფეხსაცმლითაც შეიძლება.
  route: >-
    თბილისიდან საგარეჯოს გავლით დედოფლისწყარომდე გზა ბოლომდე ასფალტიანია — დაახლოებით 120 კმ და ორი საათი.
    ქალაქიდან ხეობამდე ბოლო ±2 კმ ტყის გრუნტული გზაა, რომელიც მშრალ ამინდში ეკონომ-კლასის სედანითაც მშვიდად
    გაივლება; წვიმის შემდეგ ფრთხილად. სულ თბილისიდან დაახლოებით 125 კმ და 2:10 საათი. მარშრუტი იდეალურად
    ერწყმის სიღნაღსა და ვაშლოვანს.
en:
  name: Artsivi (Eagle) Gorge
  short: A protected limestone canyon of white pinnacles near Dedoplistskaro — one of Kakheti's premier
    birdwatching sites, with nesting griffon vultures and black storks.
  body: >-
    **Artsivi Gorge is the unexpected spectacle of the Kakhetian steppe.** Just 4 km north of Dedoplistskaro,
    this protected Natural Monument (under the Agency of Protected Areas) is a dramatic limestone canyon
    — white pinnacles, sheer cliff walls and a band of adjoining forest. The gorge earns its name: more
    than sixty bird species live here, including griffon vultures nesting on the cliffs and black storks
    wheeling below the rim.


    A marked 1 km walking trail runs along the gorge, with viewpoints and shelters — the full loop takes
    about an hour on easy grades. A separate half-kilometre path climbs to the 5th-century Khornabuji
    fortress crowning the canyon's eastern crag; the fortress has its own entry on this site, while this
    page covers the gorge and its trails.


    Entry is free and the gorge is open year-round. Spring and autumn are the most comfortable seasons
    — in summer the Kakhetian steppe is hot. It makes a natural first stop on any trip towards Dedoplistskaro
    and Vashlovani.
  tip: >-
    Bring binoculars — the vultures pass at rim level most often in the morning and late afternoon. In
    summer you need water, a hat and sun protection: there is little shade on the trail. Watch your footing
    near the rim — railings are not everywhere. If you have time, add the climb to Khornabuji fortress
    for a view over the whole Alazani valley. In dry weather ordinary shoes are perfectly adequate.
  route: >-
    From Tbilisi via Sagarejo to Dedoplistskaro the road is paved the whole way — about 120 km and two
    hours. From the town the final roughly 2 km to the gorge is a forest gravel track that an economy-class
    sedan handles easily in dry weather; take care after rain. In total about 125 km and 2 hours 10 minutes
    from Tbilisi. The route combines perfectly with Sighnaghi and Vashlovani.
ru:
  name: Орлиное ущелье (Арцивис хеоба)
  short: Охраняемый известняковый каньон с белыми скальными столбами у Дедоплисцкаро — одно из лучших
    мест Кахети для наблюдения за птицами, с гнездящимися белоголовыми сипами и чёрными аистами.
  body: >-
    **Орлиное ущелье — неожиданное зрелище кахетинской степи.** Всего в 4 км к северу от Дедоплисцкаро
    этот охраняемый памятник природы (Агентство охраняемых территорий) представляет собой драматичный
    известняковый каньон — белые столбы, отвесные скальные стены и примыкающий лес. Ущелье оправдывает
    своё имя: здесь обитает более шестидесяти видов птиц, включая гнездящихся на скалах белоголовых сипов
    и чёрных аистов, кружащих ниже кромки.


    Вдоль ущелья проложена размеченная пешеходная тропа длиной 1 км со смотровыми площадками и навесами
    — полный круг занимает около часа, подъёмы лёгкие. Отдельная полукилометровая тропинка поднимается
    к крепости Хорнабуджи V века, венчающей восточный утёс каньона; у крепости на сайте своя страница,
    а здесь описаны само ущелье и его тропы.


    Вход бесплатный, ущелье открыто круглый год. Весна и осень — самое комфортное время: летом кахетинская
    степь жаркая. Это естественная первая остановка любой поездки в сторону Дедоплисцкаро и Вашловани.
  tip: >-
    Возьмите бинокль — сипы чаще всего проходят на уровне кромки утром и ближе к вечеру. Летом нужны вода,
    головной убор и защита от солнца: тени на тропе мало. У кромки будьте осторожны — перила есть не везде.
    Если есть время, добавьте подъём к крепости Хорнабуджи — оттуда открывается вид на всю Алазанскую
    долину. В сухую погоду достаточно обычной обуви.
  route: >-
    Из Тбилиси через Сагареджо до Дедоплисцкаро дорога асфальтирована на всём протяжении — около 120 км
    и два часа. От города последние примерно 2 км до ущелья — лесная гравийка, которую в сухую погоду
    спокойно проходит седан эконом-класса; после дождя аккуратнее. Всего от Тбилиси около 125 км и 2 часа
    10 минут. Маршрут идеально сочетается с Сигнахи и Вашловани.
fa:
  name: درهٔ آرتسیوی (درهٔ عقاب)
  short: دره‌ای آهکی حفاظت‌شده با ستون‌های سنگی سفید نزدیک ددوپلیستسکارو — از بهترین جاهای کاختی برای
    پرنده‌نگری، با کرکس‌های گریفون آشیانه‌ساز و لک‌لک‌های سیاه.
  body: >-
    **درهٔ آرتسیوی تماشای غیرمنتظرهٔ استپ کاختی است.** این یادمان طبیعی حفاظت‌شده (زیر نظر سازمان مناطق
    حفاظت‌شده) فقط 4 کیلومتر در شمال ددوپلیستسکارو، دره‌ای آهکی و چشمگیر است — ستون‌های سفید، دیواره‌های
    پرتگاهی و نوار جنگلی چسبیده به آن. دره نام خود را به‌حق دارد: بیش از شصت گونه پرنده اینجا زندگی می‌کنند،
    از جمله کرکس‌های گریفون که روی صخره‌ها آشیانه دارند و لک‌لک‌های سیاهی که پایین‌تر از لبهٔ دره چرخ
    می‌زنند.


    راهی علامت‌گذاری‌شده به درازای 1 کیلومتر با دیدگاه‌ها و آلاچیق‌ها در امتداد دره کشیده شده — حلقهٔ
    کامل حدود یک ساعت می‌گیرد و شیب‌ها ملایم است. راهی جداگانه به درازای نیم کیلومتر به دژ خورنابوجی از
    سدهٔ پنجم بالا می‌رود که بر صخرهٔ شرقی دره نشسته است؛ دژ در این سایت صفحهٔ خود را دارد و این صفحه
    دره و راه‌هایش را می‌پوشاند.


    ورود رایگان است و دره تمام سال باز است. بهار و پاییز راحت‌ترین فصل‌هاست — تابستان استپ کاختی گرم است.
    این‌جا نخستین ایستگاه طبیعی هر سفری به سوی ددوپلیستسکارو و واشلووانی است.
  tip: >-
    دوربین دوچشمی بیاورید — کرکس‌ها بیش از همه صبح و اواخر بعدازظهر هم‌سطح لبهٔ دره می‌گذرند. در تابستان
    آب، کلاه و ضدآفتاب لازم دارید: سایه روی مسیر کم است. نزدیک لبه مراقب قدم‌هایتان باشید — نرده همه‌جا
    نیست. اگر وقت دارید، بالا رفتن تا دژ خورنابوجی را هم اضافه کنید تا تمام درهٔ آلازانی را ببینید. در
    هوای خشک کفش معمولی کاملاً کافی است.
  route: >-
    از تفلیس از راه ساگارجو تا ددوپلیستسکارو جاده سراسر آسفالت است — حدود 120 کیلومتر و دو ساعت. از شهر،
    حدود 2 کیلومتر پایانی تا دره راه شنی جنگلی است که سواری اکونومی در هوای خشک به‌راحتی از پس آن برمی‌آید؛
    پس از باران احتیاط کنید. روی هم از تفلیس حدود 125 کیلومتر و 2 ساعت و 10 دقیقه. این مسیر با سیغناغی
    و واشلووانی به‌خوبی ترکیب می‌شود.
he:
  name: ערוץ ארציבי (ערוץ הנשרים)
  short: קניון גיר מוגן של צריחים לבנים ליד דדופליסצקארו — מאתרי הצפרות המובילים בקאחתי, עם נשרים מקננים
    וחסידות שחורות.
  body: >-
    **ערוץ ארציבי הוא המחזה הבלתי צפוי של ערבות קאחתי.** רק 4 ק״מ מצפון לדדופליסצקארו, האנדרטה הטבעית
    המוגנת הזאת (בניהול הסוכנות לשטחים מוגנים) היא קניון גיר דרמטי — צריחים לבנים, קירות צוק תלולים ורצועת
    יער צמודה. הערוץ מצדיק את שמו: יותר משישים מיני ציפורים חיים כאן, ובהם נשרים מקננים על המצוקים וחסידות
    שחורות החגות מתחת לשפת הקניון.


    לאורך הערוץ עובר שביל הליכה מסומן באורך קילומטר אחד עם נקודות תצפית וסככות — ההקפה המלאה אורכת כשעה
    בשיפועים קלים. שביל נפרד של חצי קילומטר מטפס אל מבצר חורנבוג'י מן המאה החמישית, המעטר את הצוק המזרחי
    של הקניון; למבצר יש דף משלו באתר, והדף הזה מוקדש לערוץ ולשביליו.


    הכניסה חופשית והערוץ פתוח כל השנה. האביב והסתיו הן העונות הנוחות ביותר — בקיץ ערבות קאחתי לוהטות.
    זו תחנה ראשונה טבעית בכל נסיעה לכיוון דדופליסצקארו ווששלובאני.
  tip: >-
    הביאו משקפת — הנשרים חולפים בגובה השפה לרוב בבוקר ולפנות ערב. בקיץ נחוצים מים, כובע והגנה מהשמש: אין
    כמעט צל על השביל. היזהרו ליד השפה — מעקות אינם בכל מקום. אם יש לכם זמן, הוסיפו את הטיפוס למבצר חורנבוג'י
    לתצפית על כל עמק אלזאני. במזג אוויר יבש נעליים רגילות מספיקות בהחלט.
  route: >-
    מטביליסי דרך סגרג'ו עד דדופליסצקארו הכביש סלול לכל אורכו — כ-120 ק״מ ושעתיים. מהעיירה כ-2 הק״מ האחרונים
    לערוץ הם דרך כורכר ביער, שסדאן ממחלקת האקונומי עובר בקלות במזג אוויר יבש; אחרי גשם נהגו בזהירות. בסך
    הכול כ-125 ק״מ ו-2:10 שעות מטביליסי. המסלול משתלב מצוין עם סיגנאגי ווששלובאני.
ar:
  name: وادي أرتسيفي (وادي النسور)
  short: وادٍ كلسي محمي من الصخور البيضاء الشاهقة قرب ديدوبليستسكارو — من أفضل مواقع مراقبة الطيور في
    كاخيتي، بنسور غريفون معششة ولقالق سوداء.
  body: >-
    **وادي أرتسيفي هو المشهد غير المتوقع في سهوب كاخيتي.** على بعد 4 كم فقط شمال ديدوبليستسكارو، هذا المعلم
    الطبيعي المحمي (تديره وكالة المناطق المحمية) وادٍ كلسي مهيب — صخور بيضاء شاهقة وجدران جرفية ونطاق
    غابة متاخم. والوادي يستحق اسمه: يعيش هنا أكثر من ستين نوعاً من الطيور، منها نسور غريفون تعشش على الأجراف
    ولقالق سوداء تحوّم تحت حافة الوادي.


    يمتد على طول الوادي درب مشي معلَّم طوله كيلومتر واحد بمطلات ومظلات — الحلقة الكاملة تستغرق نحو ساعة
    بانحدارات سهلة. ويصعد درب منفصل طوله نصف كيلومتر إلى قلعة خورنابوجي من القرن الخامس المتوّجة للجرف
    الشرقي للوادي؛ وللقلعة صفحتها الخاصة في هذا الموقع، أما هذه الصفحة فتغطي الوادي ودروبه.


    الدخول مجاني والوادي مفتوح طوال السنة. الربيع والخريف أريح الفصول — ففي الصيف سهوب كاخيتي حارة. وهو
    محطة أولى طبيعية في أي رحلة نحو ديدوبليستسكارو وفاشلوفاني.
  tip: >-
    أحضر منظاراً — تمر النسور بمحاذاة الحافة غالباً في الصباح وآخر العصر. في الصيف تحتاج ماءً وقبعة وواقياً
    من الشمس: الظل قليل على الدرب. وانتبه لخطواتك قرب الحافة — الدرابزينات ليست في كل مكان. وإن كان لديك
    وقت فأضف الصعود إلى قلعة خورنابوجي لإطلالة على وادي ألازاني كله. وفي الطقس الجاف يكفي حذاء عادي تماماً.
  route: >-
    من تبليسي عبر ساغاريجو إلى ديدوبليستسكارو الطريق معبّد بكامله — نحو 120 كم وساعتان. من البلدة آخر
    كيلومترين تقريباً إلى الوادي طريق حصوي في الغابة تجتازه سيارة سيدان اقتصادية بسهولة في الطقس الجاف؛
    وتوخَّ الحذر بعد المطر. الإجمالي من تبليسي نحو 125 كم وساعتان و10 دقائق. ويتكامل المسار تماماً مع
    سيغناغي وفاشلوفاني.
