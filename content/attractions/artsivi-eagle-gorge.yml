ka:
  name: არწივის ხეობა
  short: >-
    პატარა კირქვის კანიონი დედოფლისწყაროსთან: კლდეებზე ორბი და შავი ყარყატი ბუდობს, ფერდზე კი მაჩიტა ხარობს,
    რომელიც სხვაგან არსად იზრდება.
  body: >-
    **ხეობას არწივის სახელი ჰქვია, მაგრამ აქ ორბები ბატონობენ — თეთრი კირქვის თავზე ტრიალებენ ფრთებით,
    რომელთა გაშლაც 2,8 მეტრს აღწევს.**


    კახეთში სამხრეთ-აღმოსავლეთისკენ რაც უფრო შორს მიდიხართ, ვენახები მით უფრო თხელდება და ველი სტეპად
    იქცევა; დედოფლისწყაროდან ორიოდე კილომეტრში კი ქედი უცებ გადაპობილა. არწივის ხეობა პატარაა — დაახლოებით
    ერთი კვადრატული კილომეტრის ბუნების ძეგლი, ვაშლოვანის დაცული ტერიტორიების ნაწილი, — მაგრამ ამ მცირე
    სივრცეში ბევრი რამ დაეტია: მკრთალი კლდის კედლები, დაშლილი სვეტები, კიდეს გაყოლებული ტყის ზოლი და მეზობელ
    კლდეზე ხორნაბუჯის ციხე.


    აქ სამოცამდე სახეობის ფრინველია აღრიცხული, შვერილებზე კი ორი იშვიათი სახეობა ბუდობს — ორბი და შავი
    ყარყატი. კლდე მცენარეების მხრივაც ჯიუტად თავისებურია: კახეთის მაჩიტა (*Campanula kachetica*), საქართველოს
    ენდემი, მხოლოდ ამ ხეობიდანაა ცნობილი, დასავლეთით 1,5 კილომეტრში კი, მუხნარ-რცხილნარში, უზარმაზარ კირქვის
    ლოდებზე აღმოსავლური ტუია იზრდება — წიწვოვანი მცენარე, რომელიც ველურად საქართველოს არც ერთ სხვა კუთხეში
    არ გვხვდება.


    მონიშნული, დაახლოებით კილომეტრიანი ბილიკი ხეობას გადასახედებისა და ფარდულების გავლით მიუყვება — მსუბუქი,
    ერთსაათიანი გასეირნებაა. უფრო მოკლე ბილიკი ხორნაბუჯზე ადის, რომელიც V საუკუნიდან კამბეჩოვანის ძველი
    მხარის მთავარ სიმაგრედ იხსენიება; ციხეს ჩვენს საიტზე ცალკე გვერდი აქვს.


    ქვემოთ გაშლილი ქალაქის სახელშიც ლეგენდა იმალება. გადმოცემით, თამარ მეფე აქაურ წყაროსთან შეჩერებულა
    და ადგილს მას შემდეგ დედოფლისწყარო ჰქვია. რუსეთის იმპერიამ მას ცარსკიე კოლოძცი უწოდა, საბჭოთა ხელისუფლებამ
    — წითელწყარო, ძველი სახელი კი მხოლოდ 1991 წელს დაუბრუნდა.


    შუადღისას კლდის კიდეზე ჩამოჯექით და დაელოდეთ. ადრე თუ გვიან თეთრ ქვაზე ჩრდილი გადაცურავს — ხმას კი
    ვერც გაიგებთ.
  tip: >-
    ბინოკლი და მოთმინება წამოიღეთ. ორბებს ამომავალი თბილი ჰაერი სჭირდებათ, ამიტომ ხეობა დილის მეორე ნახევრიდან
    ცოცხლდება, როცა მზე კლდეს გაათბობს; დილაადრიან უფრო წვრილი ფრინველები და რბილი შუქი დაგხვდებათ. შესვლა
    უფასოა, სალარო არ არის. ბილიკი მოკლე და მარტივია, მაგრამ ჩრდილი ცოტაა, შირაქის ზაფხულში კი სიცხე შეიძლება
    35 გრადუსსაც გასცდეს — წყალი და ქუდი არ დაგავიწყდეთ. მოაჯირი კიდეს მთელ სიგრძეზე არ გასდევს; ბავშვები
    ახლოს იყოლიეთ. გაზაფხულზე მაჩიტა ყვავის და ამინდიც საუკეთესოა, გვიანი შემოდგომა კი მშვიდი და ოქროსფერია.
    საპირფარეშო, საჭმელი და საწვავი დედოფლისწყაროშია.
  route: >-
    კახეთის გზატკეცილით (ს5) საგარეჯოს გავლით ბაკურციხემდე იარეთ, იქიდან წნორისკენ გადაუხვიეთ, მერე კი
    სამხრეთით, დედოფლისწყაროსკენ დაეშვით: მთელი გზა ასფალტიანია, გასაყარის შემდეგ კი საკმაოდ წყნარი. ქალაქიდან
    ხეობამდე დაახლოებით ბოლო 2 კილომეტრი ტყის ხრეშიანი გზაა, რომელსაც მშრალ ამინდში ჩვეულებრივი ეკონომ
    კლასის მანქანაც იოლად გადის; ძლიერი წვიმის შემდეგ ნელა იარეთ ან ბოლო მონაკვეთი ფეხით გაიარეთ. სულ
    დაახლოებით 125 კილომეტრი და ორ საათზე ცოტა მეტია. საწვავი წნორში ან დედოფლისწყაროში ჩაასხით. ხეობა
    ბუნებრივად უკავშირდება ხორნაბუჯს, სიღნაღს და — მაღალი გამავლობის ავტომობილითა და ნებართვით — ვაშლოვანს.
en:
  name: Artsivi (Eagle) Gorge
  short: >-
    A small limestone canyon above Dedoplistskaro where griffon vultures and black storks nest, and a
    bellflower grows that exists nowhere else.
  body: >-
    **Artsivi means eagle, but the birds that rule this gorge are griffon vultures, circling above white
    limestone on wings up to 2.8 metres across.**


    Drive south-east through Kakheti and the vineyards thin into steppe; then, a couple of kilometres
    from Dedoplistskaro, the ridge splits open. Artsivi Gorge is small — a protected natural monument
    of about one square kilometre, part of the Vashlovani protected areas — but it packs a great deal
    into that space: pale cliffs, crumbling pinnacles, a strip of forest along the rim and, on the neighbouring
    crag, the fortress of Khornabuji.


    Around sixty bird species have been recorded here, and two rare ones nest on the ledges: the griffon
    vulture and the black stork. The rock is just as particular about its plants. The Kakhetian bellflower,
    *Campanula kachetica*, a Georgian endemic, is known from this gorge alone, and about 1.5 km to the
    west, in oak and hornbeam woods on huge limestone blocks, grows oriental thuja, a conifer found wild
    in no other corner of Georgia.


    A marked trail of about a kilometre follows the gorge past viewpoints and shelters, an easy hour on
    foot. A shorter path climbs to Khornabuji, first mentioned in the 5th century as the stronghold of
    the ancient district of Kambechovani; it has its own page on this site.


    The town below carries a legend in its name. Tradition says Queen Tamar stopped at a spring here,
    and the place became Dedoplistskaro, the Queen's Spring. The Russian Empire called it Tsarskiye Kolodtsy,
    Soviet officials Tsiteltskaro, and the old name returned only in 1991.


    Sit on the rim at midday and wait. Sooner or later a shadow slides across the white stone before you
    hear a thing.
  tip: >-
    Bring binoculars and patience. Vultures need rising warm air, so the gorge wakes up from mid-morning,
    once the sun has heated the rock; early starts are better for smaller birds and softer light. Entry
    is free and there is no ticket office. The trail is short and easy, but shade is scarce and a Shiraki
    summer can pass 35°C, so carry water and a hat. Railings do not run the full length of the rim; keep
    children close. Spring brings the bellflowers and the best weather; late autumn is quiet and golden.
    Toilets, food and fuel are in Dedoplistskaro.
  route: >-
    Take the Kakheti Highway (S5) east through Sagarejo to Bakurtsikhe, turn towards Tsnori and then head
    south to Dedoplistskaro: asphalt all the way and a quiet road beyond the junction. From the town,
    the last 2 km or so to the gorge is a gravel forest track that an ordinary economy car handles easily
    when dry; after heavy rain, go slowly or walk the last stretch. In total it is about 125 km and a
    little over two hours. Fill up in Tsnori or Dedoplistskaro. The gorge pairs naturally with Khornabuji,
    Sighnaghi and, for those with a 4x4 and a permit, Vashlovani.
ru:
  name: Ущелье Арциви (Орлиное ущелье)
  short: >-
    Небольшой известняковый каньон над Дедоплисцкаро: здесь гнездятся белоголовые сипы и чёрные аисты
    и растёт колокольчик, которого больше нет нигде на свете.
  body: >-
    **«Арциви» по-грузински значит «орёл», но хозяева этого ущелья — белоголовые сипы: они кружат над
    белым известняком на крыльях размахом до 2,8 метра.**


    Дорога на юго-восток через Кахетию постепенно теряет виноградники и уходит в степь, а в паре километров
    от Дедоплисцкаро хребет вдруг раскалывается. Ущелье Арциви невелико — охраняемый памятник природы
    площадью около одного квадратного километра, часть Вашлованских охраняемых территорий, — но в этот
    клочок земли уместилось очень многое: бледные скалы, осыпающиеся столбы, полоса леса вдоль кромки
    и, на соседнем утёсе, крепость Хорнабуджи.


    Здесь отмечено около шестидесяти видов птиц, и на уступах гнездятся два редких — белоголовый сип и
    чёрный аист. Не менее своеобразна здесь и флора. Кахетинский колокольчик, *Campanula kachetica*, эндемик
    Грузии, известен только из этого ущелья, а примерно в 1,5 км к западу, в дубово-грабовом лесу на громадных
    известняковых глыбах, растёт туя восточная — хвойное дерево, которое в диком виде не встречается больше
    ни в одном другом уголке Грузии.


    Размеченная тропа длиной около километра ведёт вдоль ущелья мимо смотровых площадок и навесов — лёгкий
    час пешком. Тропинка покороче поднимается к Хорнабуджи; крепость впервые упоминается в V веке как
    оплот древней области Камбечовани, и у неё на нашем сайте своя страница.


    Городок внизу хранит легенду в самом своём имени. Предание гласит, что у здешнего родника остановилась
    царица Тамара, и место стали называть Дедоплисцкаро — «Родник царицы». В Российской империи город
    звался Царскими Колодцами, при советской власти — Цителцкаро, и старое имя вернулось к нему лишь в
    1991 году.


    Сядьте в полдень на краю обрыва и ждите. Рано или поздно по белому камню скользнёт тень — раньше,
    чем вы услышите хоть звук.
  tip: >-
    Возьмите бинокль и запаситесь терпением. Сипам нужны восходящие потоки тёплого воздуха, поэтому ущелье
    оживает к середине утра, когда солнце прогреет скалы; ранним утром лучше наблюдать мелких птиц, да
    и свет мягче. Вход свободный, кассы нет. Тропа короткая и лёгкая, но тени почти нет, а летом в Шираки
    бывает за 35°C, так что нужны вода и головной убор. Перила идут не по всей кромке — держите детей
    рядом. Весной цветут колокольчики и стоит лучшая погода; поздняя осень тиха и золотиста. Туалеты,
    еда и заправка — в Дедоплисцкаро.
  route: >-
    По Кахетинскому шоссе (S5) поезжайте на восток через Сагареджо до Бакурцихе, сверните на Цнори, а
    оттуда на юг, к Дедоплисцкаро: асфальт на всём пути, а после развязки — спокойная, пустая дорога.
    От города последние 2 км или около того до ущелья идёт гравийная лесная дорога, которую обычная машина
    эконом-класса в сухую погоду проходит без труда; после сильного дождя езжайте медленно или пройдите
    остаток пешком. Всего около 125 км и чуть больше двух часов. Заправьтесь в Цнори или Дедоплисцкаро.
    Ущелье удобно совместить с Хорнабуджи и Сигнахи, а тем, у кого есть полный привод и пропуск, — ещё
    и с Вашловани.
fa:
  name: درهٔ آرتسیوی (درهٔ عقاب)
  short: >-
    درهٔ آهکی کوچکی بالای ددوپلیستسکارو که دال‌ها و لک‌لک‌های سیاه در آن آشیانه دارند و گل استکانی‌ای
    در آن می‌روید که در هیچ جای دیگر جهان نیست.
  body: >-
    **آرتسیوی در گرجی یعنی عقاب، اما فرمانروایان این دره دال‌ها هستند که با بال‌هایی تا ۲٫۸ متر بر فراز
    آهک سفید چرخ می‌زنند.**


    هرچه از میان کاختی به سوی جنوب‌شرقی پیش‌تر برانید، تاکستان‌ها تُنُک‌تر می‌شوند و جای خود را به استپ
    می‌دهند؛ آن‌گاه، دو سه کیلومتر مانده به ددوپلیستسکارو، یال کوه ناگهان از هم می‌شکافد. درهٔ آرتسیوی
    کوچک است — یادمان طبیعی حفاظت‌شده‌ای به وسعت حدود یک کیلومتر مربع و بخشی از مناطق حفاظت‌شدهٔ واشلووانی
    — اما در همین پهنهٔ اندک چیزهای بسیاری جا گرفته است: صخره‌های رنگ‌پریده، ستون‌های سنگیِ فروریزان،
    نواری از جنگل در امتداد لبه و، بر صخرهٔ همسایه، دژ خورنابوجی.


    در این‌جا حدود شصت گونه پرنده ثبت شده و دو گونهٔ کمیاب بر لبه‌های صخره آشیانه دارند: دال و لک‌لک سیاه.
    گیاهان این دره نیز به همان اندازه خاص‌اند. گل استکانی کاختی، *Campanula kachetica*، گیاهی بومیِ گرجستان
    است که تنها از همین دره شناخته شده، و حدود ۱٫۵ کیلومتر به سوی غرب، در جنگل بلوط و ممرز بر تخته‌سنگ‌های
    آهکیِ عظیم، سرو خمره‌ای (توجای شرقی) می‌روید؛ درختی سوزنی‌برگ که در هیچ گوشهٔ دیگری از گرجستان به‌طور
    خودرو یافت نمی‌شود.


    مسیر نشانه‌گذاری‌شده‌ای به طول حدود یک کیلومتر از کنار دره، از میان دیدگاه‌ها و سایبان‌ها، می‌گذرد؛
    یک ساعت پیاده‌رویِ آسان. کوره‌راهی کوتاه‌تر به خورنابوجی بالا می‌رود؛ دژی که نخستین بار در سدهٔ پنجم
    به‌عنوان دژ اصلی ناحیهٔ کهن کامبچووانی از آن یاد شده و در این وب‌سایت صفحهٔ جداگانه‌ای دارد.


    شهرک پایین دره افسانه‌ای را در نام خود دارد. روایت است که ملکه تامار کنار چشمه‌ای در این‌جا درنگ کرد
    و آن‌جا را ددوپلیستسکارو، یعنی «چشمهٔ ملکه»، نامیدند. امپراتوری روسیه آن را تسارسکیه کولودتسی («چاه‌های
    تزار») خواند و مقام‌های شوروی تسیتلتسکارو، و نام کهن تنها در ۱۹۹۱ بازگشت.


    نیمروز بر لبهٔ دره بنشینید و منتظر بمانید. دیر یا زود سایه‌ای بر سنگ سفید می‌لغزد، پیش از آن‌که صدایی
    بشنوید.
  tip: >-
    دوربین دوچشمی و حوصله همراه بیاورید. دال‌ها به هوای گرمِ بالارونده نیاز دارند، پس دره از میانهٔ صبح،
    وقتی آفتاب صخره‌ها را گرم کرده، جان می‌گیرد؛ صبح زود برای پرندگان کوچک‌تر و نور نرم‌تر بهتر است. ورود
    رایگان است و گیشهٔ بلیتی در کار نیست. مسیر کوتاه و آسان است، اما سایه کمیاب است و تابستان شیراکی ممکن
    است از ۳۵ درجه بگذرد؛ آب و کلاه بردارید. نرده‌ها سراسر لبهٔ دره را نمی‌پوشانند؛ کودکان را نزدیک خود
    نگه دارید. بهار فصل گل‌های استکانی و بهترین هواست؛ اواخر پاییز آرام و زرین است. سرویس بهداشتی، غذا
    و سوخت در ددوپلیستسکارو است.
  route: >-
    از بزرگراه کاختی (S5) به سوی شرق، از ساگارجو تا باکورتسیخه برانید، به سمت تسنوری بپیچید و سپس به جنوب،
    به سوی ددوپلیستسکارو بروید: سراسر آسفالت، و پس از دوراهی جاده‌ای خلوت. از شهر، حدود ۲ کیلومتر پایانی
    تا دره راه جنگلیِ شنی است که خودروی اقتصادیِ معمولی در هوای خشک به‌آسانی از پسش برمی‌آید؛ پس از باران
    سنگین آهسته برانید یا تکهٔ آخر را پیاده بروید. روی هم حدود ۱۲۵ کیلومتر و کمی بیش از دو ساعت راه است.
    در تسنوری یا ددوپلیستسکارو باک را پر کنید. این دره را به‌سادگی می‌توان با خورنابوجی و سیغناغی در یک
    سفر گنجاند و، برای کسانی که خودروی ۴×۴ و مجوز دارند، با واشلووانی.
he:
  name: ערוץ ארציבי (ערוץ העיט)
  short: קניון גיר קטן מעל דדופליסצקארו, שבו מקננים נשרים וחסידות שחורות וגדלה פעמונית שאינה קיימת בשום
    מקום אחר בעולם.
  body: >-
    **"ארציבי" פירושו בגאורגית עיט, אבל מי ששולטים בערוץ הזה הם הנשרים, החגים מעל הגיר הלבן על כנפיים
    שמוטתן מגיעה ל-2.8 מטרים.**


    בנסיעה לדרום-מזרח דרך קאחתי הכרמים הולכים ומידלדלים עד שהם מפנים מקומם לערבה; ואז, כמה קילומטרים לפני
    דדופליסצקארו, הרכס נבקע לפתע. ערוץ ארציבי קטן — מונומנט טבע מוגן בשטח של כקמ"ר אחד, חלק מהשטחים המוגנים
    של ושלובאני — אבל הוא דוחס אל השטח הזה הרבה מאוד: מצוקים חיוורים, עמודי סלע מתפוררים, רצועת יער לאורך
    השפה, ועל הצוק השכן — מבצר חורנבוג'י.


    כשישים מיני ציפורים נרשמו כאן, ושני מינים נדירים מקננים על מדפי הסלע: הנשר והחסידה השחורה. גם הצומח
    כאן מיוחד לא פחות. הפעמונית הקאחתית, *Campanula kachetica*, צמח אנדמי לגאורגיה, ידועה מן הערוץ הזה
    בלבד, וכקילומטר וחצי מערבה, ביער של אלון וקרפינוס על גושי גיר עצומים, גדלה ביוטה מזרחית (תויה מזרחית)
    — עץ מחטני שאינו גדל בר בשום פינה אחרת של גאורגיה.


    שביל מסומן באורך של כקילומטר עובר לאורך הערוץ, על פני נקודות תצפית וסככות — שעה קלה ברגל. שביל קצר
    יותר מטפס לחורנבוג'י, שנזכר לראשונה במאה החמישית כמעוזו של המחוז הקדום קמבצ'ובאני; למבצר יש דף משלו
    באתר.


    העיירה שלמטה נושאת אגדה בשמה. המסורת מספרת שהמלכה תמר עצרה כאן ליד מעיין, והמקום נקרא דדופליסצקארו
    — "מעיין המלכה". האימפריה הרוסית קראה לו צרסקייה קולודצי ("בארות הצאר"), הפקידים הסובייטים — ציטלצקארו,
    והשם הישן חזר רק ב-1991.


    שבו בצהריים על שפת הצוק וחכו. במוקדם או במאוחר צל יחליק על האבן הלבנה, עוד לפני שתשמעו קול כלשהו.
  tip: >-
    הביאו משקפת וסבלנות. הנשרים זקוקים לאוויר חם עולה, ולכן הערוץ מתעורר מאמצע הבוקר, אחרי שהשמש חיממה
    את הסלע; יציאה מוקדמת עדיפה לציפורים קטנות יותר ולאור רך יותר. הכניסה חופשית ואין קופה. השביל קצר
    וקל, אבל צל כמעט אין, והקיץ בשיראקי עלול לעבור 35 מעלות, אז קחו מים וכובע. המעקות אינם לאורך כל השפה;
    השגיחו על הילדים מקרוב. האביב מביא את הפעמוניות ואת מזג האוויר הטוב ביותר; סוף הסתיו שקט ומוזהב. שירותים,
    אוכל ודלק יש בדדופליסצקארו.
  route: >-
    סעו על כביש קאחתי (S5) מזרחה דרך סגרג'ו עד בקורציחה, פנו לכיוון צנורי ומשם דרומה לדדופליסצקארו: אספלט
    לכל אורך הדרך, וכביש שקט אחרי הצומת. מהעיירה, כ-2 הקילומטרים האחרונים עד הערוץ הם דרך יער מכוסה חצץ,
    שמכונית אקונומי רגילה עוברת בקלות כשיבש; אחרי גשם כבד נסעו לאט או לכו את הקטע האחרון ברגל. בסך הכול
    כ-125 ק"מ וקצת יותר משעתיים. תדלקו בצנורי או בדדופליסצקארו. הערוץ משתלב באופן טבעי עם חורנבוג'י, עם
    סיגנאגי, ולמי שיש רכב 4x4 והיתר — עם ושלובאני.
ar:
  name: وادي أرتسيفي (وادي العُقاب)
  short: >-
    وادٍ كلسي صغير فوق ديدوبليستسكارو تعشّش فيه النسور السمراء واللقالق السوداء، وتنمو فيه زهرة جريسية
    لا وجود لها في أي مكان آخر.
  body: >-
    **«أرتسيفي» تعني بالجورجية «العُقاب»، لكن أسياد هذا الوادي هي النسور السمراء، تحوم فوق الكلس الأبيض
    بأجنحة يبلغ باعها 2.8 متر.**


    اتجه نحو الجنوب الشرقي عبر كاخيتي، فتتناقص الكروم شيئاً فشيئاً حتى تفسح المكان للسهوب؛ ثم، على بعد
    كيلومترين أو نحوهما من ديدوبليستسكارو، ينشقّ الحَيد فجأة. وادي أرتسيفي صغير — معلم طبيعي محمي مساحته
    نحو كيلومتر مربع واحد، وجزء من مناطق فاشلوفاني المحمية — لكنه يضمّ في هذه الرقعة الكثير: جروفاً شاحبة،
    وأعمدة صخرية متآكلة، وشريطاً من الغابة على امتداد الحافة، وعلى الجرف المجاور قلعة خورنابوجي.


    سُجّل هنا نحو ستين نوعاً من الطيور، ويعشّش على حواف الصخر نوعان نادران: النسر الأسمر واللقلق الأسود.
    ولا تقلّ نباتاته تفرّداً. فالجريسية الكاخيتية، *Campanula kachetica*، وهي نبتة مستوطنة في جورجيا،
    لا تُعرف إلا من هذا الوادي، وعلى بعد نحو 1.5 كم غرباً، في غابة من البلوط والشَّرد فوق كتل كلسية ضخمة،
    تنمو الثويا الشرقية، وهي شجرة مخروطية لا تنمو برّية في أي بقعة أخرى من جورجيا.


    يمتد درب معلَّم طوله نحو كيلومتر على طول الوادي مروراً بالمطلات والمظلات، في ساعة مشي سهلة. ويصعد
    درب أقصر إلى خورنابوجي، التي ورد ذكرها أول مرة في القرن الخامس معقلاً لإقليم كامبيتشوفاني القديم؛
    وللقلعة صفحتها الخاصة في هذا الموقع.


    والبلدة في الأسفل تحمل أسطورة في اسمها. تقول الرواية إن الملكة تامار توقفت عند نبع هنا، فصار المكان
    يُعرف بديدوبليستسكارو، أي «نبع الملكة». وسمّتها الإمبراطورية الروسية تسارسكيه كولودتسي («آبار القيصر»)،
    وسمّاها المسؤولون السوفييت تسيتيلتسكارو، ولم يعد إليها اسمها القديم إلا عام 1991.


    اجلس على الحافة عند الظهيرة وانتظر. عاجلاً أو آجلاً سينزلق ظلّ على الحجر الأبيض قبل أن تسمع أي صوت.
  tip: >-
    أحضر منظاراً وكثيراً من الصبر. تحتاج النسور إلى تيارات الهواء الدافئ الصاعدة، ولذلك يستيقظ الوادي
    منذ منتصف الصباح، بعد أن تكون الشمس قد أحمت الصخر؛ أما البكور فأفضل للطيور الأصغر وللضوء الأنعم. الدخول
    مجاني ولا يوجد شباك تذاكر. الدرب قصير وسهل، لكن الظل نادر وقد تتجاوز الحرارة في صيف شيراكي 35°C، فاحمل
    الماء وقبعة. الدرابزين لا يغطي الحافة كلها؛ أبقِ الأطفال قريبين منك. الربيع موسم الجريسيات وأجمل الطقس،
    وأواخر الخريف هادئة ذهبية. دورات المياه والطعام والوقود في ديدوبليستسكارو.
  route: >-
    اسلك طريق كاخيتي السريع (S5) شرقاً عبر ساغاريجو حتى باكورتسيخي، ثم انعطف نحو تسنوري ومنها جنوباً إلى
    ديدوبليستسكارو: الطريق معبّد بالكامل، وهادئ بعد المفترق. من البلدة، يمتد آخر كيلومترين تقريباً حتى
    الوادي على درب غابي من الحصى تجتازه سيارة اقتصادية عادية بسهولة في الطقس الجاف؛ وبعد المطر الغزير
    سِر ببطء أو امشِ المقطع الأخير. المسافة الإجمالية نحو 125 كم وما يزيد قليلاً على ساعتين. تزوّد بالوقود
    في تسنوري أو ديدوبليستسكارو. ويسهل الجمع في رحلة واحدة بين الوادي وخورنابوجي وسيغناغي، ومع فاشلوفاني
    أيضاً لمن لديه سيارة رباعية الدفع وتصريح.
