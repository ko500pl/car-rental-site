ka:
  name: მარნეულის იმამ ჰუსეინის მეჩეთი
  short: >-
    ფირუზისფერი გუმბათი, ისპაჰანის შაჰის მეჩეთით შთაგონებული ფასადი — 2016 წლიდან მარნეულის მთავარი შიიტური
    მეჩეთი და სათემო ცენტრი.
  body: >-
    **მარნეულის დაბალ ქუჩებს ზემოთ ფირუზისფერი გუმბათი ამოიზრდება, რომელიც ისპაჰანშიც არ იქნებოდა უცხო
    — და სწორედ ესაა ჩანაფიქრიც.**


    იმამ ჰუსეინის მეჩეთი 2016 წელს გაიხსნა, როგორც ქალაქის მეორე მეჩეთი. მანამდე მარნეულელი შიიტი მუსლიმები
    — უმეტესად აზერბაიჯანელები, საქართველოს უდიდესი რელიგიური უმცირესობა და ამ მუნიციპალიტეტის მოსახლეობის
    უმრავლესობა — XVIII საუკუნის პატარა იმამ ალის მეჩეთში ლოცულობდნენ, რომელიც 2000 წელს შეაკეთეს. ახალი
    მეჩეთის აშენება 2014 წელს ირანელ-ერაყელი სასულიერო პირის, ჯავად ალ-შაჰრისტანის, დახმარებით წამოიწყეს;
    ის დიდი აიათოლა ალი ალ-სისტანის წარმომადგენელია. გახსნას ქართველ და აზერბაიჯანელ პოლიტიკოსებთან ერთად
    ირანული დელეგაციაც დაესწრო.


    შენობა სეფიანური ხუროთმოძღვრების ყაიდაზეა აგებული, შთაგონების წყარო კი ისპაჰანის შაჰის მეჩეთი იყო.
    დააკვირდით დეტალებს: წვეტიან თაღოვან სარკმლებს ხის ცხაური ავსებს და თითოეულს ლურჯი კაფელის ჩარჩო აკრავს;
    კარნიზის ქვეშ და გუმბათის ყელზე მუქ ლურჯ ფონზე თეთრი კალიგრაფიული წარწერის სარტყელი გასდევს; ქვიშისფერი
    ფასადი ღია ფერის მარმარილოს ფუძეზე დგას. მეჩეთი სამსართულიანია: ქვედა სართულზე შიიტური საგანმანათლებლო
    და სათემო ცენტრია, სალოცავი დარბაზი კი ზემოთაა.


    მეჩეთს იმამ ჰუსეინის სახელი ჰქვია — წინასწარმეტყველ მუჰამადის შვილიშვილისა, რომელიც 680 წელს ქერბალასთან
    დაიღუპა და რომელსაც შიიტები მოწამედ და მესამე იმამად მიიჩნევენ. საბჭოთა კავშირის დაშლის შემდეგ საქართველოს
    აზერბაიჯანელები ყოველ წელს აღნიშნავენ აშურას — ჰუსეინის ორდღიან გლოვას მსვლელობებითა და სამგლოვიარო
    გალობით.


    2020 წლის რამადანში მეჩეთმა 60 გაჭირვებულ ოჯახს დახმარება დაურიგა — შეხსენება იმისა, რომ ეს, უპირველეს
    ყოვლისა, უბნის ცოცხალი დაწესებულებაა და მხოლოდ ამის შემდეგ — სანახაობა.
  tip: >-
    ეს მოქმედი მეჩეთია და არა მუზეუმი; შესვლა უფასოა. ჩაიცვით თავშეკავებულად — გრძელი შარვალი ან ქვედაბოლო,
    დაფარული მხრები; ქალებმა თავსაფარი იქონიონ. სალოცავ დარბაზში შესვლამდე ფეხსაცმელი გაიხადეთ. ლოცვის
    დროს, განსაკუთრებით პარასკევის შუადღეს, ნუ მიხვალთ, ან ჯერ კართან იკითხეთ. აშურა მთვარის კალენდარს
    მისდევს და ყოველ წელს დაახლოებით თერთმეტი დღით ადრე მოდის; თუ ამ დღეებში ჩამოხვალთ, ხალხმრავლობას
    ელოდეთ და გლოვას პატივი ეცით. ნახევარი საათი საკმარისია, ცენტრალური ბაზარი კი ფეხით რამდენიმე წუთის
    სავალზეა.
  route: >-
    თბილისიდან სამხრეთით, S6 გზით დაიძარით — მარნეულისკენ მიმავალი მაგისტრალით, ფონიჭალის გავლით. დაახლოებით
    42 კილომეტრი და 46 წუთი, ბოლომდე კარგი ასფალტი — ეკონომკლასის მანქანა იდეალურია. მარნეულში ცენტრისკენ
    აიღეთ გეზი და ნარიმანოვის ქუჩა მოძებნეთ, ცენტრალური ბაზრიდან ფეხით ახლოს; ფირუზისფერი გუმბათი კარგი
    ორიენტირია. მანქანა ქუჩაში გააჩერეთ და ჭიშკართან ნუ დააყენებთ, განსაკუთრებით პარასკევობით. საწვავი
    ქალაქში უხვადაა, ასე რომ, აქედან ბოლნისის ან დმანისის მიმართულებით გზის გაგრძელებაც მარტივია.
en:
  name: Marneuli Imam Hussein Mosque
  short: >-
    A turquoise dome and a façade modelled on Isfahan's Shah Mosque: since 2016, Marneuli's central Shia
    mosque and community centre.
  body: >-
    **Above the low streets of Marneuli rises a turquoise dome that would look at home in Isfahan — and
    that is exactly the idea.**


    The Imam Hussein Mosque opened in 2016 as the town's second mosque. Until then Marneuli's Shia Muslims
    — mostly Azerbaijanis, who form Georgia's largest religious minority and the majority in this municipality
    — prayed at the small 18th-century Imam Ali Mosque, repaired in 2000. The new building was commissioned
    in 2014 with the help of the Iranian-Iraqi cleric Jawad al-Shahristani, a representative of Grand
    Ayatollah Ali al-Sistani, and an Iranian delegation stood beside Georgian and Azerbaijani politicians
    at the opening.


    The design follows the Safavid tradition and takes the Shah Mosque of Isfahan as its model. Look at
    the details: pointed-arch windows filled with wooden lattice, each framed in blue tile; a band of
    white calligraphy on cobalt running beneath the cornice and again around the drum of the dome; a sand-coloured
    façade standing on a plinth of pale marble. The building has three floors. The lower one is a Shia
    educational and community centre; the prayer hall is upstairs.


    The mosque is named after Imam Hussein, grandson of the Prophet Muhammad, killed at Karbala in 680
    and revered by Shia Muslims as a martyr and the third Imam. Every year since the end of the Soviet
    Union, Georgia's Azerbaijanis have marked Ashura, the two-day mourning for Hussein, with processions
    and laments.


    In Ramadan 2020 the mosque handed out aid to 60 families in need — a reminder that this is a working
    neighbourhood institution first, and a sight second.
  tip: >-
    This is a working mosque, not a museum, and entry is free. Dress modestly — long trousers or skirts,
    covered shoulders — and women should bring a headscarf. Shoes come off before the prayer hall. Avoid
    prayer times, above all Friday midday, or ask at the door first. Ashura follows the lunar calendar
    and arrives about eleven days earlier each year; if your visit coincides with it, expect crowds and
    respect the mourning. Half an hour is enough, and the central bazaar is a few minutes' walk away.
  route: >-
    From Tbilisi head south on the S6, the highway to Marneuli, through Ponichala. It is about 42 km and
    46 minutes on good asphalt all the way, so an economy car is ideal. In Marneuli follow the signs for
    the centre and find Narimanov Street, a short walk from the central bazaar; the turquoise dome is
    an easy landmark. Park on the street and keep clear of the gate, especially on Fridays. Fuel is plentiful
    in town, which makes it easy to carry on towards Bolnisi or Dmanisi.
ru:
  name: Мечеть имама Хусейна в Марнеули
  short: >-
    Бирюзовый купол и фасад по образцу Шахской мечети Исфахана: с 2016 года — главная шиитская мечеть
    и общинный центр Марнеули.
  body: >-
    **Над низкими улицами Марнеули поднимается бирюзовый купол, который был бы вполне на своём месте в
    Исфахане, — в этом и состоит замысел.**


    Мечеть имама Хусейна открылась в 2016 году и стала второй мечетью города. До этого шииты Марнеули
    — в основном азербайджанцы, крупнейшее религиозное меньшинство Грузии и большинство населения этого
    муниципалитета, — молились в небольшой мечети имама Али XVIII века, отремонтированной в 2000 году.
    Новое здание заказали в 2014 году при содействии ирано-иракского богослова Джавада аш-Шахристани,
    представителя великого аятоллы Али ас-Систани, а на открытии рядом с грузинскими и азербайджанскими
    политиками стояла иранская делегация.


    Проект следует сефевидской традиции и берёт за образец Шахскую мечеть в Исфахане. Присмотритесь к
    деталям: стрельчатые окна, заполненные деревянными решётками, каждое в обрамлении синей плитки; полоса
    белой каллиграфии на кобальтовом фоне под карнизом и ещё раз — вокруг барабана купола; фасад песочного
    цвета на цоколе из светлого мрамора. В здании три этажа. На нижнем — шиитский образовательный и общинный
    центр; молитвенный зал наверху.


    Мечеть названа в честь имама Хусейна, внука пророка Мухаммеда, убитого при Кербеле в 680 году и почитаемого
    шиитами как мученик и третий имам. Каждый год со времени распада Советского Союза азербайджанцы Грузии
    отмечают Ашуру — двухдневный траур по Хусейну — шествиями и плачами.


    В Рамадан 2020 года мечеть раздала помощь 60 нуждающимся семьям — напоминание о том, что это прежде
    всего живое учреждение квартала и лишь потом достопримечательность.
  tip: >-
    Это действующая мечеть, а не музей, и вход бесплатный. Одевайтесь скромно — длинные брюки или юбки,
    закрытые плечи; женщинам стоит взять с собой платок. Перед молитвенным залом разуваются. Не приходите
    во время молитв, особенно в пятницу в полдень, или сначала спросите у входа. Ашура следует лунному
    календарю и каждый год наступает примерно на одиннадцать дней раньше; если ваш визит совпал с ней,
    будьте готовы к толпе и уважайте траур. Получаса достаточно, а центральный базар — в нескольких минутах
    ходьбы.
  route: >-
    Из Тбилиси на юг по S6, трассе на Марнеули, через Поничалу. Около 42 км и 46 минут по хорошему асфальту
    на всём пути, так что машина эконом-класса подойдёт идеально. В Марнеули следуйте указателям на центр
    и найдите улицу Нариманова, недалеко от центрального базара; бирюзовый купол — заметный ориентир.
    Паркуйтесь на улице и не загораживайте ворота, особенно по пятницам. Заправок в городе много, так
    что отсюда легко продолжить путь к Болниси или Дманиси.
fa:
  name: مسجد امام حسین مارنئولی
  short: 'گنبدی فیروزه‌ای و نمایی به الگوی مسجد شاه اصفهان: از سال ۲۰۱۶ مسجد اصلی شیعیان و مرکز اجتماعی
    مارنئولی.'
  body: >-
    **بر فراز خانه‌های کوتاه و کوچه‌های مارنئولی گنبدی فیروزه‌ای برمی‌خیزد که در اصفهان هم غریبه نمی‌نمود
    — و ایده دقیقاً همین است.**


    مسجد امام حسین در سال ۲۰۱۶ به‌عنوان دومین مسجد شهر گشایش یافت. تا پیش از آن، مسلمانان شیعهٔ مارنئولی
    — که بیشترشان آذربایجانی‌اند؛ آذربایجانی‌ها بزرگ‌ترین اقلیت دینی گرجستان‌اند و در این شهرستان اکثریت
    را دارند — در مسجد کوچک امام علی نماز می‌گزاردند؛ بنایی از سدهٔ هجدهم که در سال ۲۰۰۰ مرمت شده بود.
    سفارش ساخت بنای تازه در سال ۲۰۱۴ با یاری روحانی ایرانی-عراقی، جواد شهرستانی، نمایندهٔ آیت‌الله العظمی
    علی سیستانی، داده شد و در مراسم گشایش، هیئتی ایرانی در کنار سیاستمداران گرجی و آذربایجانی حضور داشت.


    طراحی بنا از سنت صفوی پیروی می‌کند و مسجد شاه اصفهان را الگو گرفته است. به جزئیات نگاه کنید: پنجره‌هایی
    با طاق جناغی که مشبک چوبی آن‌ها را پر کرده و هر یک در قابی از کاشی آبی نشسته است؛ کتیبه‌ای از خوشنویسی
    سفید بر زمینهٔ لاجوردی که زیر قرنیز و بار دیگر گرداگرد گریو گنبد می‌گردد؛ نمایی به رنگ شن بر پایه‌ای
    از مرمر روشن. بنا سه طبقه دارد. طبقهٔ پایین مرکز آموزشی و اجتماعی شیعیان است و شبستان نماز در طبقهٔ
    بالا قرار دارد.


    مسجد به نام امام حسین، نوهٔ پیامبر اسلام، محمد، نام‌گذاری شده است که در سال ۶۸۰ میلادی در کربلا کشته
    شد و شیعیان او را شهید و امام سوم خود می‌دانند. از پایان اتحاد شوروی، آذربایجانی‌های گرجستان هر سال
    عاشورا، سوگواری دوروزه برای حسین، را با دسته‌های عزاداری و نوحه برگزار می‌کنند.


    در ماه رمضان ۲۰۲۰، مسجد به ۶۰ خانوادهٔ نیازمند کمک رساند — یادآوری اینکه اینجا پیش از هر چیز نهادی
    زنده در دل محله است و تنها پس از آن جاذبه‌ای دیدنی.
  tip: >-
    اینجا مسجدی فعال است، نه موزه، و ورود رایگان است. لباس پوشیده بپوشید — شلوار یا دامن بلند و شانه‌های
    پوشیده — و بانوان روسری همراه داشته باشند. پیش از ورود به شبستان نماز کفش‌ها را درآورید. هنگام نماز،
    به‌ویژه ظهر جمعه، سر نزنید یا نخست دم در بپرسید. عاشورا تابع تقویم قمری است و هر سال حدود یازده روز
    زودتر فرا می‌رسد؛ اگر سفرتان با آن هم‌زمان شد، منتظر جمعیت باشید و حرمت سوگواری را نگه دارید. نیم
    ساعت کافی است و بازار مرکزی چند دقیقه پیاده فاصله دارد.
  route: >-
    از تفلیس از S6، بزرگراه مارنئولی، به سمت جنوب و از راه پونیچالا بروید. حدود ۴۲ کیلومتر و ۴۶ دقیقه
    راه است، سراسر روی آسفالت خوب، پس خودروی اقتصادی ایده‌آل است. در مارنئولی تابلوهای مرکز شهر را دنبال
    کنید و خیابان نریمانوف را بیابید که با بازار مرکزی فاصلهٔ کوتاهی دارد؛ گنبد فیروزه‌ای نشانه‌ای است
    که به‌آسانی دیده می‌شود. کنار خیابان پارک کنید و جلوی در ورودی را باز بگذارید، به‌ویژه روزهای جمعه.
    در شهر سوخت فراوان است و از این رو ادامهٔ راه به سوی بولنیسی یا دمانیسی آسان است.
he:
  name: מסגד האימאם חוסיין במרנאולי
  short: 'כיפה בצבע טורקיז וחזית בהשראת מסגד השאה באספהאן: מאז 2016, המסגד השיעי המרכזי ומרכז הקהילה של
    מרנאולי.'
  body: >-
    **מעל הרחובות הנמוכים של מרנאולי מתנשאת כיפה בצבע טורקיז שהייתה נראית טבעית לגמרי באספהאן — וזה בדיוק
    הרעיון.**


    מסגד האימאם חוסיין נפתח ב-2016 כמסגד השני של העיירה. עד אז התפללו המוסלמים השיעים של מרנאולי — רובם
    אזרבייג'נים, המיעוט הדתי הגדול ביותר בגאורגיה והרוב בנפה הזאת — במסגד האימאם עלי הקטן מהמאה ה-18,
    ששופץ ב-2000. הבניין החדש הוזמן ב-2014 בסיועו של איש הדת האיראני-עיראקי ג'ואד א-שהרסתאני, נציגו של
    האייתוללה הגדול עלי א-סיסתאני, ובטקס הפתיחה עמדה משלחת איראנית לצד פוליטיקאים גאורגים ואזרבייג'נים.


    העיצוב נאמן למסורת הספווית ומבוסס על מסגד השאה באספהאן. הביטו בפרטים: חלונות בקשתות מחודדות, ממולאים
    בסבכות עץ, כל אחד ממוסגר באריחים כחולים; רצועה של קליגרפיה לבנה על רקע כחול-קובלט שעוברת מתחת לכרכוב
    ושוב סביב תוף הכיפה; חזית בגוון חול הניצבת על בסיס של שיש בהיר. לבניין שלוש קומות. בתחתונה פועל מרכז
    חינוכי וקהילתי שיעי; אולם התפילה נמצא למעלה.


    המסגד קרוי על שם האימאם חוסיין, נכדו של הנביא מוחמד, שנהרג בכרבלא ב-680 ונערץ על ידי המוסלמים השיעים
    כקדוש מעונה וכאימאם השלישי. מדי שנה מאז קץ ברית המועצות מציינים האזרבייג'נים של גאורגיה את העאשורא,
    יומיים של אבל על חוסיין, בתהלוכות ובקינות.


    ברמדאן 2020 חילק המסגד סיוע ל-60 משפחות נזקקות — תזכורת לכך שזהו קודם כול מוסד שכונתי פעיל, ורק אחר
    כך אתר לתיירים.
  tip: >-
    זהו מסגד פעיל, לא מוזיאון, והכניסה חופשית. התלבשו בצניעות — מכנסיים או חצאיות ארוכים, כתפיים מכוסות
    — ונשים צריכות להביא מטפחת ראש. חולצים נעליים לפני אולם התפילה. הימנעו מזמני התפילה, ובעיקר מצהרי
    יום שישי, או שאלו קודם בכניסה. העאשורא נקבע לפי לוח השנה הירחי ומקדים בכאחד-עשר יום מדי שנה; אם הביקור
    שלכם חל בו, צפו להמונים וכבדו את האבל. חצי שעה מספיקה, והבזאר המרכזי נמצא במרחק כמה דקות הליכה.
  route: >-
    מטביליסי סעו דרומה בכביש S6, הכביש המהיר למרנאולי, דרך פוניצ'לה. זה כ-42 ק״מ ו-46 דקות על אספלט טוב
    לכל אורך הדרך, כך שרכב חסכוני הוא הבחירה האידיאלית. במרנאולי עקבו אחר השלטים למרכז ומצאו את רחוב נרימנוב,
    במרחק הליכה קצר מהבזאר המרכזי; הכיפה הטורקיזית היא ציון דרך שקל לזהות. חנו ברחוב ואל תחסמו את השער,
    במיוחד בימי שישי. יש בעיר דלק בשפע, כך שקל להמשיך משם לבולניסי או לדמניסי.
ar:
  name: مسجد الإمام الحسين في مارنيولي
  short: 'قبة فيروزية وواجهة على طراز مسجد الشاه في أصفهان: منذ 2016 المسجد الشيعي الرئيسي والمركز المجتمعي
    في مارنيولي.'
  body: >-
    **فوق شوارع مارنيولي الواطئة ترتفع قبة فيروزية لن تبدو غريبة في أصفهان — وهذا بالضبط هو المقصود.**


    افتُتح مسجد الإمام الحسين عام 2016 ليكون المسجد الثاني في البلدة. وحتى ذلك الحين كان المسلمون الشيعة
    في مارنيولي — ومعظمهم من الأذربيجانيين الذين يشكّلون أكبر أقلية دينية في جورجيا والأغلبية في هذه البلدية
    — يصلّون في مسجد الإمام علي الصغير العائد إلى القرن الثامن عشر، والذي رُمّم عام 2000. وقد تقرّر بناء
    المبنى الجديد عام 2014 بمساعدة رجل الدين الإيراني العراقي جواد الشهرستاني، ممثل آية الله العظمى علي
    السيستاني، ووقف وفد إيراني إلى جانب سياسيين جورجيين وأذربيجانيين في حفل الافتتاح.


    يتبع التصميم التقليد الصفوي ويتخذ من مسجد الشاه في أصفهان نموذجاً له. تأمّل التفاصيل: نوافذ ذات أقواس
    مدبّبة تملؤها شبكات خشبية مخرّمة، وكل منها محاط ببلاط أزرق؛ وشريط من الخط الأبيض على أرضية بلون الكوبالت
    يمتد تحت الإفريز ثم مرة أخرى حول رقبة القبة؛ وواجهة بلون الرمل تقوم على قاعدة من الرخام الفاتح. للمبنى
    ثلاثة طوابق: السفلي مركز تعليمي ومجتمعي شيعي، وقاعة الصلاة في الأعلى.


    سُمّي المسجد باسم الإمام الحسين، حفيد النبي محمد، الذي قُتل في كربلاء عام 680 للميلاد، ويجلّه المسلمون
    الشيعة شهيداً وإماماً ثالثاً. وفي كل عام منذ نهاية الاتحاد السوفييتي يُحيي أذربيجانيو جورجيا عاشوراء،
    وهي يومان من الحداد على الحسين، بالمواكب والمراثي.


    وفي رمضان 2020 وزّع المسجد مساعدات على 60 أسرة محتاجة — تذكيرٌ بأنه قبل كل شيء مؤسسة حيّة في قلب الحي،
    ثم معلم سياحي بعد ذلك.
  tip: >-
    هذا مسجد عامر بالمصلّين لا متحف، والدخول مجاني. ارتدِ ملابس محتشمة — سراويل أو تنانير طويلة وأكتافاً
    مغطاة — وعلى النساء إحضار غطاء للرأس. تُخلع الأحذية قبل قاعة الصلاة. تجنّب أوقات الصلاة، ولا سيما
    ظهر الجمعة، أو اسأل عند الباب أولاً. تتبع عاشوراء التقويم القمري فتحلّ كل عام قبل موعدها السابق بنحو
    أحد عشر يوماً؛ فإذا صادفت زيارتك موعدها فتوقّع الزحام واحترم الحداد. تكفي نصف ساعة، والسوق المركزي
    على بعد دقائق سيراً.
  route: >-
    من تبليسي اتجه جنوباً على الطريق S6، الطريق السريع إلى مارنيولي، مروراً ببونيتشالا. المسافة نحو 42
    كم و46 دقيقة على أسفلت جيد طوال الطريق، فالسيارة الاقتصادية مثالية. في مارنيولي اتبع اللافتات إلى
    المركز وابحث عن شارع ناريمانوف، على مسافة قصيرة سيراً من السوق المركزي؛ والقبة الفيروزية علامة يسهل
    الاهتداء بها. اركن في الشارع وابتعد عن البوابة، ولا سيما أيام الجمعة. الوقود متوفر بكثرة في البلدة،
    مما يسهّل مواصلة الطريق نحو بولنيسي أو دمانيسي.
