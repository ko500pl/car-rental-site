ka:
  name: უფლისციხე
  short: >-
    ქვიშაქვის ქედში ნაკვეთი ქალაქი მტკვრის პირას: კლდის დარბაზები, ქვის ქუჩა, საწნახლები და მდინარემდე
    ჩამავალი გვირაბი — სამი ათასწლეულის ნაკვალევი.
  body: >-
    **უფლისციხე არ აუშენებიათ — გამოკვეთეს: მისი დარბაზები, ქუჩები და საწნახლები ერთ ქვიშაქვის ქედშია
    ამოღებული.**


    ქალაქი მტკვრის მაღალ მარცხენა ნაპირზე, გორიდან დაახლოებით 10 კილომეტრით აღმოსავლეთით დგას. ადამიანის
    უძველესი კვალი აქ ძვ. წ. II ათასწლეულის ბოლოთი თარიღდება; კლდეში ნაკვეთი ქალაქი შემდგომ საუკუნეებში
    იზრდებოდა და ქართლის — კლასიკური ავტორების იბერიის — ერთ-ერთ მთავარ პოლიტიკურ და სარწმუნოებრივ ცენტრად
    იქცა. სახელი „უფლის ციხეს“ ნიშნავს: აქ იჯდა შიდა ქართლის ტომთა გაერთიანების მეთაური — უფალი. შუა საუკუნეების
    მემატიანეებმა ქალაქს თქმულებითი დამაარსებელიც მიუჩინეს — უფლოსი, მცხეთოსის ძე და ქართლოსის შვილიშვილი.


    IV საუკუნის დასაწყისში, ქრისტიანობის დამკვიდრებასთან ერთად, უფლისციხემ რელიგიური პირველობა მცხეთას
    დაუთმო, მაგრამ ქალაქად დარჩა: VI საუკუნეში აქ პირველი ბაზილიკა აიგო, VIII–X საუკუნეებში კი, როცა თბილისი
    არაბებს ეპყრათ, უფლისციხე კვლავ ქართველთა საყრდენ ციხედ იქცა. კომპლექსის თავზე მდგარი აგურის სამეკლესიიანი
    ბაზილიკაც ამ ხანისაა. მონღოლთა შემოსევებმა ციხე-ქალაქის ცხოვრება დაასრულა და ამის შემდეგ მას მხოლოდ
    სახიზრად იყენებდნენ. 1920 წლის მიწისძვრამ ყველაზე მყიფე ნაწილები დაანგრია. 2007 წლიდან უფლისციხე იუნესკოს
    მსოფლიო მემკვიდრეობის წინასწარ სიაშია.


    რას დააკვირდეთ:


    - მთავარ ქუჩას, რომელიც ქალაქის გულში მიიკლაკნება

    - ზედა ქალაქის დიდ დარბაზს, რომლის ნახევარწრიულ კამარაზე რვაკუთხა კესონებია ამოკვეთილი

    - ჭერებს, სადაც ქვა ხის კოჭებს იმეორებს

    - კლდეში ნაკვეთ საწნახლებსა და მარნებს

    - მდინარემდე ჩამავალ გვირაბს — ალყის დროს ქალაქის წყლის გზას


    გადმოცემით, ქალაქის მკვეთელ მონებს წერაქვი ეჭირათ, რომლის ერთი პირი რკინისა იყო, მეორე — ოქროსი: ვინც
    რკინის პირს გაცვეთდა, თავისუფლებასაც მიიღებდა და ოქროსაც.


    დღის ბოლო საათში ქვიშაქვა პურის ქერქის ფერს იღებს, ცარიელ ღიობებს კი ჩრდილი ავსებს.
  tip: >-
    ჩრდილი თითქმის არსადაა, ღია ფერის კლდე კი სიცხეს უკან გიბრუნებთ: ივლის-აგვისტოში გახსნისთანავე მოდით
    ან დახურვამდე ბოლო ორ საათში. ქვა ათასობით ფეხს გაუპრიალებია და წვიმაში სრიალებს — კარგძირიანი ფეხსაცმელი
    ჩაიცვით. კიბეები ციცაბოა, მოაჯირი ყველგან არ არის, ბავშვებს თვალი ადევნეთ. ბილეთის სალარო, ტუალეტი
    და პატარა კაფე ავტოსადგომთან, ვიზიტორთა ცენტრშია; მიმდინარე ფასი ადგილზე გადაამოწმეთ. შესასვლელთან
    ადგილობრივი გიდები გელოდებიან — მათი აყვანა ღირს, ოღონდ ფასზე წინასწარ შეთანხმდით. დათვალიერებას ორი
    საათი დაუთმეთ.
  route: >-
    თბილისიდან E60 ავტობანით (ს1) დასავლეთით გორამდე დაახლოებით 85 კილომეტრია. უფლისციხე ქალაქიდან დაახლოებით
    10 კილომეტრით აღმოსავლეთით, მტკვრის გაღმაა. გორში სტალინის გამზირს სამხრეთით გაჰყევით და მდინარე გადაკვეთეთ,
    შემდეგ მარცხნივ გადაუხვიეთ, აღმოსავლეთით, ხიდისთავის გავლით, სოფელ უფლისციხემდე იარეთ და ხიდით კლდის
    ძირში, ავტოსადგომზე გადადით. სულ დაახლოებით 100 კმ და დაახლოებით საათნახევარი. ბოლო მონაკვეთი ვიწრო
    სოფლის ასფალტია — ნებისმიერ სეზონზე ეკონომ-კლასის მანქანაც საკმარისია. საწვავი და საჭმელი გორში უხვად
    არის.
en:
  name: Uplistsikhe
  short: >-
    A town cut into a sandstone ridge above the Mtkvari: rock halls, a stone main street, wine presses
    and a tunnel to the river, lived in for three millennia.
  body: >-
    **Uplistsikhe was not built so much as carved: its halls, streets and wine presses were hollowed out
    of a single sandstone ridge.**


    It stands on the high left bank of the Mtkvari, about 10 km east of Gori. The first traces of people
    here date from the end of the 2nd millennium BC, and the rock town grew over the centuries that followed
    into one of the chief political and religious centres of Kartli, the kingdom classical writers called
    Iberia. The name means "the lord's fortress": the upali, head of the tribes of inner Kartli, had his
    seat here. Medieval chroniclers gave the town a founder from legend, Uplos, son of Mtskhetos and grandson
    of Kartlos.


    When Kartli turned Christian in the early 4th century, Uplistsikhe yielded its religious primacy to
    Mtskheta but lived on as a town. A first basilica was built in the 6th century, and while Arabs held
    Tbilisi in the 8th–10th centuries it became a Georgian stronghold again; the brick three-church basilica
    on the summit dates from then. The Mongol invasions ended its life as a fortress, and afterwards it
    served only as a refuge. An earthquake in 1920 destroyed its most fragile parts. Since 2007 it has
    been on UNESCO's Tentative List.


    What to look for:


    - the main street winding through the heart of the town

    - the great hall of the upper town, its semicircular vault carved with octagonal coffers

    - ceilings cut to imitate wooden beams

    - rock-cut wine presses and cellars

    - the tunnel down to the river, the town's water supply under siege


    Legend says the slaves who cut the town were given picks with one iron face and one of gold: whoever
    wore the iron away went free and kept the gold.


    In the last hour of light the sandstone turns the colour of bread crust, and the empty doorways fill
    with shadow.
  tip: >-
    There is almost no shade, and the pale rock throws the heat back at you, so in July and August come
    at opening time or in the last two hours before closing. The stone is polished by countless feet and
    slippery in rain; wear shoes with grip. Steps are steep and railings intermittent, so keep children
    close. Tickets, toilets and a small café are at the visitor centre by the car park; check the current
    fee there. Local guides wait at the entrance and are worth hiring, but agree the price first. Allow
    two hours.
  route: >-
    Take the E60 (S1) motorway west from Tbilisi to Gori, about 85 km. Uplistsikhe lies about 10 km east
    of the town on the far side of the Mtkvari. In Gori, follow Stalin Avenue south across the river,
    turn left and drive east through Khidistavi to Uplistsikhe village, then cross the bridge to the car
    park below the rock. In all it is about 100 km and roughly an hour and a half. The last stretch is
    narrow village asphalt, fine for an economy car in any season. Fuel and food are plentiful in Gori.
ru:
  name: Уплисцихе
  short: >-
    Город, вырубленный в песчаниковом хребте над Курой: скальные залы, каменная главная улица, давильни
    и тоннель к реке — и три тысячелетия жизни.
  body: >-
    **Уплисцихе не столько построили, сколько вырезали: его залы, улицы и давильни выдолблены в одном
    песчаниковом хребте.**


    Он стоит на высоком левом берегу Куры, примерно в 10 км к востоку от Гори. Первые следы людей здесь
    относятся к концу II тысячелетия до н. э., и в последующие века скальный город вырос в один из главных
    политических и религиозных центров Картли — царства, которое античные авторы называли Иберией. Название
    означает «крепость владыки»: здесь сидел упали, глава племён Внутренней Картли. Средневековые летописцы
    дали городу легендарного основателя — Уплоса, сына Мцхетоса и внука Картлоса.


    Когда в начале IV века Картли приняла христианство, Уплисцихе уступил религиозное первенство Мцхете,
    но продолжал жить как город. В VI веке здесь построили первую базилику, а когда в VIII–X веках Тбилиси
    держали арабы, Уплисцихе вновь стал грузинским оплотом; кирпичная трёхцерковная базилика на вершине
    относится к тому времени. Монгольские нашествия положили конец его жизни как крепости, и потом он
    служил лишь убежищем. Землетрясение 1920 года разрушило самые хрупкие его части. С 2007 года Уплисцихе
    включён в предварительный список ЮНЕСКО.


    На что смотреть:


    - главная улица, вьющаяся через сердце города

    - большой зал верхнего города с полуциркульным сводом, в котором вырезаны восьмиугольные кессоны

    - потолки, вырезанные в подражание деревянным балкам

    - высеченные в скале давильни и винные погреба

    - тоннель к реке, снабжавший город водой во время осады


    Легенда гласит, что рабам, вырубавшим город, давали кирки с одним бойком из железа, а другим из золота:
    тот, кто стачивал железо, получал свободу и оставлял золото себе.


    В последний час света песчаник принимает цвет хлебной корки, а пустые проёмы наполняются тенью.
  tip: >-
    Тени почти нет, а светлая скала отдаёт жар обратно, поэтому в июле и августе приезжайте к открытию
    или за два часа до закрытия. Камень отполирован бесчисленными ногами и скользок в дождь — нужна обувь
    с цепкой подошвой. Ступени крутые, перила есть не везде, так что держите детей рядом. Касса, туалеты
    и небольшое кафе — в визит-центре у парковки; актуальную цену билета уточняйте там. У входа ждут местные
    гиды: их стоит нанять, но о цене договоритесь заранее. Заложите два часа.
  route: >-
    Из Тбилиси по автомагистрали E60 (S1) на запад до Гори — около 85 км. Уплисцихе лежит примерно в 10
    км к востоку от города, на другом берегу Куры. В Гори поезжайте по проспекту Сталина на юг через реку,
    поверните налево и езжайте на восток через Хидистави до села Уплисцихе, затем по мосту к парковке
    под скалой. Всего около 100 км и примерно полтора часа. Последний отрезок — узкий сельский асфальт,
    машине эконом-класса он по силам в любое время года. Топлива и еды в Гори в избытке.
fa:
  name: اوپلیستسیخه
  short: >-
    شهری تراشیده در ستیغی ماسه‌سنگی بالای متکواری: تالارهای صخره‌ای، خیابانی سنگی، چرخشت‌ها و تونلی به
    سوی رود، که سه هزاره مسکون بوده است.
  body: >-
    **اوپلیستسیخه را نه چندان ساختند که تراشیدند: تالارها، کوچه‌ها و چرخشت‌هایش از دل یک ستیغ ماسه‌سنگی
    کنده شده‌اند.**


    شهر بر کرانهٔ بلند چپ متکواری، حدود ۱۰ کیلومتری شرق گوری، ایستاده است. نخستین نشانه‌های حضور انسان
    در اینجا به پایان هزارهٔ دوم پیش از میلاد بازمی‌گردد و این شهر صخره‌ای در سده‌های پس از آن به یکی
    از مهم‌ترین کانون‌های سیاسی و دینی کارتلی بالید؛ پادشاهی‌ای که نویسندگان کلاسیک ایبریا می‌خواندندش.
    نام آن یعنی «دژ خداوندگار»: اوپالی، سرکردهٔ قبایل کارتلی درونی، در اینجا می‌نشست. وقایع‌نگاران سده‌های
    میانه برای شهر بنیادگذاری افسانه‌ای برشمردند: اوپلوس، پسر متسختوس و نوهٔ کارتلوس.


    هنگامی که کارتلی در آغاز سدهٔ چهارم مسیحی شد، اوپلیستسیخه برتری دینی را به متسختا واگذاشت، اما همچنان
    شهری زنده ماند. نخستین بازیلیکا در سدهٔ ششم ساخته شد، و هنگامی که عرب‌ها در سده‌های هشتم تا دهم تفلیس
    را در دست داشتند، اوپلیستسیخه بار دیگر دژی گرجی شد؛ بازیلیکای آجری «سه‌کلیسایی» بر فراز صخره از همان
    روزگار است. یورش‌های مغول به زندگی آن به‌عنوان دژ پایان داد و پس از آن تنها پناهگاه بود. زمین‌لرزهٔ
    ۱۹۲۰ شکننده‌ترین بخش‌هایش را ویران کرد. از ۲۰۰۷ در فهرست موقت یونسکو جای دارد.


    آنچه باید دید:


    - خیابان اصلی که پیچان از دل شهر می‌گذرد

    - تالار بزرگ شهر بالا، با طاق نیم‌دایره‌ای که در آن قاب‌های فرورفتهٔ هشت‌ضلعی تراشیده‌اند

    - سقف‌هایی که به تقلید از تیرهای چوبی تراشیده شده‌اند

    - چرخشت‌ها و انبارهای شراب کنده‌شده در صخره

    - تونلی که به رود می‌رسد و در روزهای محاصره آب شهر را تأمین می‌کرد


    افسانه می‌گوید به بردگانی که شهر را می‌تراشیدند کلنگ‌هایی می‌دادند که یک سرش آهن بود و سر دیگرش طلا:
    هر که آهن را می‌سایید تا تمام شود، آزاد می‌شد و طلا را برای خود نگه می‌داشت.


    در آخرین ساعت روشنایی، ماسه‌سنگ به رنگ پوستهٔ نان درمی‌آید و درگاه‌های خالی از سایه پر می‌شوند.
  tip: >-
    تقریباً سایه‌ای نیست و صخرهٔ روشن گرما را به سوی شما بازمی‌تاباند، پس در ژوئیه و اوت هنگام گشایش یا
    در دو ساعت پایانی پیش از بسته شدن بیایید. سنگ زیر گام‌های بی‌شمار صیقل خورده و در باران لغزنده است؛
    کفشی با چسبندگی خوب بپوشید. پله‌ها تند و نرده‌ها پراکنده‌اند، پس کودکان را نزدیک خود نگه دارید. باجهٔ
    بلیت، سرویس بهداشتی و کافه‌ای کوچک در مرکز بازدیدکنندگان کنار پارکینگ است؛ بهای کنونی بلیت را همان‌جا
    بپرسید. راهنماهای محلی کنار ورودی منتظرند و گرفتنشان می‌ارزد، اما پیش از هر چیز بر سر قیمت توافق کنید.
    دو ساعت وقت بگذارید.
  route: >-
    از تفلیس آزادراه E60 (S1) را به سوی غرب تا گوری بروید، حدود ۸۵ کیلومتر. اوپلیستسیخه حدود ۱۰ کیلومتری
    شرق شهر، در آن سوی متکواری است. در گوری خیابان استالین را به سوی جنوب و از روی رود دنبال کنید، به
    چپ بپیچید و از راه خیدیستاوی به سوی شرق تا روستای اوپلیستسیخه برانید، سپس از پل بگذرید تا به پارکینگ
    پای صخره برسید. روی‌هم حدود ۱۰۰ کیلومتر و نزدیک یک ساعت و نیم. تکهٔ پایانی آسفالت باریک روستایی است
    و برای خودروی اقتصادی در هر فصلی مناسب است. سوخت و غذا در گوری فراوان است.
he:
  name: אופליסציחה
  short: 'עיר שנחצבה ברכס אבן חול מעל המטקווארי: אולמות סלע, רחוב ראשי מאבן, גתות ומנהרה אל הנהר, ושלושה
    אלפי שנות חיים.'
  body: >-
    **אופליסציחה לא נבנתה אלא נחצבה: אולמותיה, רחובותיה וגתותיה נחצבו כולם ברכס אחד של אבן חול.**


    היא עומדת על הגדה השמאלית הגבוהה של המטקווארי, כ-10 ק"מ מזרחית לגורי. העקבות הראשונים של בני אדם כאן
    מתוארכים לסוף האלף השני לפני הספירה, ובמאות שלאחר מכן גדלה עיר הסלע והפכה לאחד המרכזים הפוליטיים והדתיים
    החשובים של קרתלי, הממלכה שהסופרים הקלאסיים כינו איבריה. משמעות השם היא "מבצר האדון": כאן ישב האופלי,
    ראש שבטי קרתלי הפנימית. כותבי הכרוניקות בימי הביניים העניקו לעיר מייסד אגדי, אופלוס, בנו של מצחתוס
    ונכדו של קרתלוס.


    כשקרתלי התנצרה בראשית המאה ה-4, ויתרה אופליסציחה על הבכורה הדתית לטובת מצחתה, אך המשיכה לחיות כעיר.
    בזיליקה ראשונה נבנתה כאן במאה ה-6, וכשהערבים החזיקו בטביליסי במאות ה-8 עד ה-10, שבה העיר והייתה למעוז
    גאורגי; בזיליקת הלבנים "בת שלוש הכנסיות" שבראש הרכס מתוארכת לתקופה זו. פלישות המונגולים שמו קץ לחייה
    כמבצר, ומאז שימשה רק מקום מפלט. רעידת אדמה ב-1920 הרסה את חלקיה השבריריים ביותר. מאז 2007 היא נכללת
    ברשימה הזמנית של אונסק"ו.


    מה לחפש:


    - הרחוב הראשי המתפתל דרך לב העיר

    - האולם הגדול של העיר העליונה, שבקמרונו חצי-העגול נחצבו שקעים מתומנים (קסטות)

    - תקרות שנחצבו כך שיחקו קורות עץ

    - גתות ומרתפי יין חצובים בסלע

    - המנהרה היורדת אל הנהר, שסיפקה לעיר מים בזמן מצור


    האגדה מספרת שהעבדים שחצבו את העיר קיבלו מכושים שצדם האחד מברזל והאחר מזהב: מי ששחק את הברזל עד תומו
    יצא לחופשי ושמר את הזהב לעצמו.


    בשעה האחרונה של האור מקבלת אבן החול צבע של קרום לחם, והפתחים הריקים מתמלאים צל.
  tip: >-
    כמעט אין כאן צל, והסלע הבהיר מחזיר את החום אליכם, לכן ביולי ובאוגוסט הגיעו עם הפתיחה או בשעתיים האחרונות
    לפני הסגירה. האבן לוטשה תחת אינספור רגליים והיא חלקלקה בגשם; נעלו נעליים עם אחיזה טובה. המדרגות תלולות
    והמעקות קיימים רק לסירוגין, לכן השגיחו על הילדים מקרוב. קופה, שירותים ובית קפה קטן נמצאים במרכז המבקרים
    שליד החניון; בדקו שם את מחיר הכניסה העדכני. מדריכים מקומיים ממתינים בכניסה וכדאי לשכור אחד מהם, אבל
    סכמו על המחיר מראש. הקדישו שעתיים.
  route: >-
    צאו מטביליסי מערבה בכביש המהיר E60 (S1) עד גורי, כ-85 ק"מ. אופליסציחה נמצאת כ-10 ק"מ מזרחית לעיר,
    בצדו השני של המטקווארי. בגורי סעו דרומה בשדרות סטלין וחצו את הנהר, פנו שמאלה והמשיכו מזרחה דרך חידיסטאווי
    עד הכפר אופליסציחה, ואז חצו את הגשר אל החניון שלמרגלות הסלע. בסך הכול כ-100 ק"מ וכשעה וחצי. הקטע האחרון
    הוא כביש כפרי צר וסלול, מתאים לרכב חסכוני בכל עונה. דלק ואוכל יש בשפע בגורי.
ar:
  name: أوبليستسيخي
  short: >-
    مدينة منحوتة في سلسلة من الحجر الرملي فوق نهر متكفاري: قاعات صخرية، وشارع رئيسي من الحجر، ومعاصر نبيذ،
    ونفق إلى النهر، وثلاثة آلاف عام من الحياة.
  body: >-
    **لم تُبنَ أوبليستسيخي بقدر ما نُحتت: إذ إنّ قاعاتها وشوارعها ومعاصر نبيذها مجوّفة في سلسلة واحدة
    من الحجر الرملي.**


    تقوم المدينة على الضفة اليسرى العالية لنهر متكفاري، على بعد نحو 10 كم شرق غوري. تعود أولى آثار البشر
    هنا إلى أواخر الألف الثاني قبل الميلاد، ونمت مدينة الصخر في القرون التالية لتغدو أحد أهم المراكز السياسية
    والدينية في كارتلي، المملكة التي سمّاها الكتّاب الكلاسيكيون إيبيريا. ويعني الاسم «قلعة السيّد»: فهنا
    كان مقرّ «الأوبالي»، زعيم قبائل كارتلي الداخلية. وقد نسب مؤرخو العصور الوسطى تأسيس المدينة إلى مؤسّس
    أسطوري هو أوبلوس بن متسخيتوس، حفيد كارتلوس.


    وحين اعتنقت كارتلي المسيحية في مطلع القرن الرابع، تنازلت أوبليستسيخي عن صدارتها الدينية لمتسخيتا،
    لكنها بقيت مدينةً حيّة. شُيّدت فيها أول بازيليكا في القرن السادس، وحين كان العرب يسيطرون على تبليسي
    بين القرنين الثامن والعاشر عادت حصنًا جورجيًا؛ ومن تلك الحقبة بازيليكا «الكنائس الثلاث» الآجرية على
    القمة. وضعت الغزوات المغولية حدًّا لحياتها قلعةً، ولم تعد بعدها إلا ملاذًا. ودمّر زلزال عام 1920 أكثر
    أجزائها هشاشة. ومنذ عام 2007 أُدرجت في القائمة المؤقتة لليونسكو.


    ما يستحق المشاهدة:


    - الشارع الرئيسي المتعرّج في قلب المدينة

    - القاعة الكبرى في المدينة العليا، وقد نُحتت في قبوها نصف الدائري تجاويف سقفية مثمّنة

    - سقوف منحوتة تحاكي العوارض الخشبية

    - معاصر نبيذ وأقبية منحوتة في الصخر

    - النفق النازل إلى النهر، مورد ماء المدينة في أثناء الحصار


    وتقول الأسطورة إن العبيد الذين نحتوا المدينة أُعطوا معاول لكلٍّ منها وجه من حديد ووجه من ذهب: فمن
    أبلى الحديد نال حرّيته واحتفظ بالذهب.


    وفي الساعة الأخيرة من الضوء يتلوّن الحجر الرملي بلون قشرة الخبز، وتمتلئ المداخل الخالية بالظلال.
  tip: >-
    لا ظلّ تقريبًا، والصخر الفاتح يردّ الحرّ إليك، لذا تعالَ في يوليو وأغسطس عند الافتتاح أو في الساعتين
    الأخيرتين قبل الإغلاق. صقلت الأقدام التي لا تُحصى الحجر، فصار زلقًا في المطر؛ فارتدِ حذاءً جيّد التماسك.
    الدرجات شديدة الانحدار والدرابزين متقطّع، فأبقِ الأطفال قريبين منك. شبّاك التذاكر ودورات المياه ومقهى
    صغير في مركز الزوّار بجوار الموقف؛ تحقّق هناك من رسم الدخول الحالي. ينتظر مرشدون محليون عند المدخل،
    واستئجار أحدهم يستحق، لكن اتفق على السعر أولًا. خصّص ساعتين.
  route: >-
    اسلك الطريق السريع E60 (S1) غربًا من تبليسي إلى غوري، نحو 85 كم. تقع أوبليستسيخي على بعد نحو 10 كم
    شرق المدينة، على الضفة الأخرى من نهر متكفاري. في غوري اتبع جادة ستالين جنوبًا عابرًا النهر، ثم انعطف
    يسارًا وسِر شرقًا عبر خيديستافي حتى قرية أوبليستسيخي، ثم اعبر الجسر إلى الموقف أسفل الصخرة. المجموع
    نحو 100 كم وقرابة ساعة ونصف. المقطع الأخير طريق قروي إسفلتي ضيق، يناسب السيارة الاقتصادية في كل الفصول.
    الوقود والطعام متوفّران بكثرة في غوري.
