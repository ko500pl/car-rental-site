ka:
  name: უფლისციხე
  short: მტკვრის ნაპირზე კლდეში ნაკვეთი ქალაქი — საქართველოს უძველესი ურბანული ცენტრი, 3000 წელზე მეტი
    ისტორიით.
  body: >-
    **უფლისციხე კლდეშია ამოკვეთილი, არა აშენებული.** გორის აღმოსავლეთით, მტკვრის მარცხენა ნაპირზე, რბილ
    ქვიშაქვის მასივში ხელით არის გამოკვეთილი დარბაზები, ქუჩები, ტაძრები, საწნახლები და საკურთხევლები.
    ქალაქი ძვ. წ. I ათასწლეულში ჩამოყალიბდა და ადრეული რკინის ხანიდან შუა საუკუნეებამდე იყო დასახლებული
    — თითქმის სამი ათასწლეული უწყვეტი ცხოვრებისა.


    ქრისტიანობამდე უფლისციხე წარმართული კულტის მთავარი ცენტრი იყო. სახელი „უფლის ციხეს" ნიშნავს და ეს
    ორმაგი მნიშვნელობა — ღვთაებრივიცა და სამეფოც — ადგილის სტატუსზე მიუთითებს. ის აბრეშუმის გზის ერთ-ერთ
    განშტოებაზე იდგა და მისი სიმდიდრე სწორედ ვაჭრობას ეფუძნებოდა. XIII საუკუნეში მონღოლებმა ქალაქი გაანადგურეს
    და ის საბოლოოდ დაცარიელდა.


    დღეს გავლადია დაახლოებით 40 გამოქვაბული ორასზე მეტიდან:


    - **დედოფლის დარბაზი** — უდიდესი სივრცე, კესონებიანი კლდის ჭერით, წარმართული ტაძრის ნაშთი

    - **გვირაბი** მტკვრისკენ — საიდუმლო გასასვლელი ალყის დროს წყლის მოსატანად

    - **სამნავიანი ბაზილიკა** — IX–X საუკუნეების აგურის ეკლესია, კომპლექსის თავზე

    - **საწნახლები და ქვევრების ორმოები** — ღვინის წარმოების უძველესი კვალი


    ზემოდან მტკვრის ხეობა და გორის ველი იშლება; მზის ჩასვლისას კლდე ნარინჯისფრად ინთება.
  tip: >-
    ჩრდილი პრაქტიკულად არ არის და კლდე შუადღისას ღუმელივით ცხელდება — ივლის-აგვისტოში მოდი დილის 10-მდე
    ან 17:00-ის შემდეგ. ზედაპირი გლუვი, გაპრიალებული ქვაა და წვიმისას საშინლად სრიალებს; საჭიროა კარგძირიანი
    ფეხსაცმელი. კიბეები ციცაბოა, მოაჯირი ყველგან არა — ბავშვს თვალი ადევნე. წყალი აუცილებლად წაიღე. ბილეთის
    სალარო, ტუალეტი და პატარა კაფე შესასვლელთანაა; გიდი ადგილზე ქირავდება და ღირს.
  route: >-
    თბილისიდან გახვალ E60 ავტობანით დასავლეთისკენ გორის მიმართულებით — 85 კმ სწრაფი, კარგი გზა. გორამდე
    ცოტა ადრე გადაუხვევ უფლისციხის ნიშანზე და კვერნაქის ქედის გავლით კიდევ 14 კმ გაივლი ვიწრო, მაგრამ
    ასფალტირებულ გზაზე მდინარის ნაპირამდე. სულ დაახლოებით 100 კმ და საათი და ოცდახუთი წუთი. შესასვლელთან
    დიდი უფასო პარკინგია. საწვავი და მაღაზიები ავტობანზე და გორში ბევრია. ეკონომ-კლასის ავტომობილი სავსებით
    საკმარისია მთელი წლის განმავლობაში.
en:
  name: Uplistsikhe
  short: >-
    A city carved into the rock above the Mtkvari — Georgia's oldest urban centre, with over 3,000 years
    of history.
  body: >-
    **Uplistsikhe was cut out of the rock rather than built on it.** East of Gori, on the left bank of
    the Mtkvari, halls, streets, temples, wine presses and altars were hollowed by hand out of a soft
    sandstone massif. The town took shape in the first millennium BC and was inhabited from the early
    Iron Age into the Middle Ages — close to three thousand years of continuous life.


    Before Christianity it was a major pagan cult centre. The name means "the lord's fortress", and that
    double sense, divine and royal, says a good deal about its standing. It sat on a branch of the Silk
    Road and its wealth came from trade. In the 13th century the Mongols destroyed the town, and it was
    gradually abandoned.


    Around forty of the two hundred-odd caves are open today:


    - The **Hall of Queen Tamar**, the largest space, with a coffered ceiling carved directly into the
    rock, probably a pagan temple originally

    - A **secret tunnel** down to the river, used to fetch water during sieges

    - A three-nave **brick basilica** from the 9th or 10th century crowning the site

    - Wine presses and qvevri pits, some of the oldest winemaking traces in the country


    From the top the Mtkvari valley and the Gori plain open out, and at sunset the rock turns orange.
  tip: >-
    There is virtually no shade and the rock becomes an oven at midday, so in July and August come before
    ten in the morning or after five. The surfaces are smooth, polished stone that is dangerously slippery
    in rain, so wear shoes with grip. The stairs are steep and railings are intermittent, so keep an eye
    on children. Bring water. The ticket office, toilets and a small café are at the entrance, and hiring
    a guide on site is genuinely worth it here.
  route: >-
    Leave Tbilisi westwards on the E60 motorway towards Gori — 85 km of fast, good road. Shortly before
    Gori take the signed Uplistsikhe turning and follow a narrow but asphalted road for a further 14 km
    over the Kvernaki ridge down to the riverbank. In total about 100 km and an hour and twenty-five minutes.
    There is a large free car park at the entrance. Fuel and shops are plentiful along the motorway and
    in Gori. An economy car is entirely sufficient in any season.
ru:
  name: Уплисцихе
  short: Пещерный город, вырубленный в скале над Курой, — древнейший городской центр Грузии, старше трёх
    тысяч лет.
  body: >-
    **Уплисцихе не построен, а вырезан в скале.** К востоку от Гори, на левом берегу Куры, в мягком песчаниковом
    массиве вручную выдолблены залы, улицы, храмы, давильни и алтари. Город сложился в первом тысячелетии
    до нашей эры и был обитаем с раннего железного века до Средневековья — почти три тысячи лет непрерывной
    жизни.


    До принятия христианства здесь находился крупный языческий культовый центр. Название означает «крепость
    владыки», и эта двойственность — божественная и царская — многое говорит о статусе места. Город стоял
    на ответвлении Шёлкового пути, и богатство ему приносила торговля. В XIII веке монголы разрушили Уплисцихе,
    после чего он постепенно опустел.


    Сегодня доступно около сорока пещер из более чем двухсот:


    - **Зал царицы Тамар** — самое большое помещение с кессонным потолком, вырубленным прямо в породе,
    вероятно бывший языческий храм

    - **Потайной тоннель** к реке, по которому носили воду во время осады

    - Трёхнефная **кирпичная базилика** IX–X веков на вершине комплекса

    - Давильни и ямы под квеври — древнейшие следы виноделия в стране


    Сверху открывается долина Куры и Горийская равнина, а на закате скала загорается оранжевым.
  tip: >-
    Тени практически нет, и днём скала превращается в печь: в июле и августе приезжайте до десяти утра
    или после пяти вечера. Поверхности гладкие, отполированные, в дождь скользят опасно — нужна обувь
    с цепкой подошвой. Лестницы крутые, перила есть не везде, за детьми следите. Воду берите с собой.
    Касса, туалеты и небольшое кафе — у входа; гида здесь имеет смысл взять на месте, без пояснений многое
    просто не прочитывается.
  route: >-
    Из Тбилиси на запад по автомагистрали E60 в сторону Гори — 85 км быстрой хорошей дороги. Незадолго
    до Гори сворачиваете по указателю на Уплисцихе и едете ещё 14 км по узкой, но асфальтированной дороге
    через Квернакский хребет к берегу реки. Всего около 100 км и час двадцать пять. У входа большая бесплатная
    парковка. Заправок и магазинов достаточно и на трассе, и в Гори. Машины эконом-класса хватает в любое
    время года.
fa:
  name: اوپلیستسیخه
  short: شهری کنده‌شده در صخره بالای متکواری — کهن‌ترین مرکز شهری گرجستان با بیش از 3,000 سال تاریخ.
  body: >-
    **اوپلیستسیخه را از دل صخره بیرون کشیده‌اند، نه بر آن ساخته‌اند.** شرق گوری، بر کرانهٔ چپ متکواری،
    تالارها، خیابان‌ها، معابد، شراب‌فشارها و محراب‌ها با دست از تودهٔ ماسه‌سنگ نرم کنده شده‌اند. شهر در
    هزارهٔ نخست پیش از میلاد شکل گرفت و از آغاز عصر آهن تا سده‌های میانه مسکون بود — نزدیک سه هزار سال
    زندگی پیوسته.


    پیش از مسیحیت اینجا مرکز مهم آیین‌های بت‌پرستی بود. نام آن یعنی «دژ خداوند»، و همین معنای دوگانهٔ
    الهی و شاهی بسیار دربارهٔ جایگاهش می‌گوید. شهر بر شاخه‌ای از جادهٔ ابریشم نشسته بود و ثروتش از بازرگانی
    می‌آمد. در سدهٔ سیزدهم مغولان آن را ویران کردند و کم‌کم متروک شد.


    امروز حدود چهل غار از دویست‌واندی غار باز است: **تالار ملکه تامار**، بزرگ‌ترین فضا، با سقف کاست‌بندی‌شده
    که مستقیم در صخره کنده شده و احتمالاً در آغاز معبدی بت‌پرستانه بوده؛ **گذری پنهان** تا رود که هنگام
    محاصره برای آوردن آب به کار می‌رفت؛ **بازیلیکای آجری** سه‌شبستانی از سدهٔ نهم یا دهم که بر بلندای
    محوطه نشسته؛ و شراب‌فشارها و چاله‌های کوِوری، از کهن‌ترین نشانه‌های شراب‌سازی در کشور. از بالا درهٔ
    متکواری و دشت گوری باز می‌شود و هنگام غروب صخره نارنجی می‌شود.
  tip: >-
    اینجا تقریباً سایه‌ای نیست و صخره در نیمروز به تنور بدل می‌شود، پس در ژوئیه و اوت پیش از ساعت ده صبح
    یا پس از پنج بیایید. سطح‌ها سنگ صیقلی است و در باران خطرناک لغزنده می‌شود، پس کفشی با چنگ خوب بپوشید.
    پله‌ها تند و نرده‌ها بریده‌بریده است، پس مراقب بچه‌ها باشید. آب بردارید. باجهٔ بلیت، سرویس بهداشتی
    و کافه‌ای کوچک در ورودی است، و گرفتن راهنما در محل اینجا واقعاً می‌ارزد.
  route: >-
    از تفلیس رو به غرب بزرگراه E60 را به سوی گوری بگیرید — 85 کیلومتر جادهٔ خوب و تندرو. اندکی پیش از
    گوری از انشعاب تابلودار اوپلیستسیخه خارج شوید و 14 کیلومتر دیگر جاده‌ای باریک اما آسفالت را روی ستیغ
    کورناکی تا کرانهٔ رود دنبال کنید. روی‌هم حدود 100 کیلومتر و یک ساعت و بیست‌وپنج دقیقه. در ورودی پارکینگ
    بزرگ رایگان هست. سوخت و فروشگاه در امتداد بزرگراه و در گوری فراوان است. خودروی اقتصادی در هر فصل کاملاً
    کافی است.
he:
  name: אופליסציחה
  short: עיר שנחצבה בסלע מעל המטקווארי — המרכז העירוני העתיק ביותר בגאורגיה, עם יותר מ-3,000 שנות היסטוריה.
  body: >-
    **אופליסציחה נחצבה מתוך הסלע ולא נבנתה עליו.** ממזרח לגורי, על הגדה השמאלית של המטקווארי, נחצבו ביד
    אולמות, רחובות, מקדשים, בתי בד ליין ומזבחות מתוך גוש אבן חול רכה. העיר התגבשה באלף הראשון לפני הספירה
    והייתה מיושבת מראשית תקופת הברזל ועד ימי הביניים — קרוב לשלושת אלפים שנות חיים רצופים.


    לפני הנצרות היה זה מרכז פולחן אלילי גדול. משמעות השם היא "מבצר האדון", והמשמעות הכפולה הזאת, האלוהית
    והמלכותית, אומרת לא מעט על מעמדו. העיר ישבה על שלוחה של דרך המשי ועושרה בא מן המסחר. במאה ה-13 החריבו
    אותה המונגולים והיא ננטשה בהדרגה.


    כארבעים מתוך כמאתיים המערות פתוחות היום: **אולם המלכה תמר**, החלל הגדול ביותר, שתקרתו המשובצת חצובה
    היישר בסלע וכנראה שימש במקורו מקדש אלילי; **מנהרה סודית** היורדת אל הנהר, ששימשה לשאיבת מים בעת מצור;
    **בזיליקת לבנים** תלת-אולמית מן המאה ה-9 או ה-10 המכתירה את האתר; ובתי בד ובורות קווברי, מן העקבות
    העתיקים ביותר של ייצור יין במדינה. מלמעלה נפתחים עמק המטקווארי ומישור גורי, ובשקיעה הסלע נצבע כתום.
  tip: >-
    כמעט אין כאן צל והסלע הופך לתנור בצהריים, ולכן ביולי ובאוגוסט הגיעו לפני עשר בבוקר או אחרי חמש. המשטחים
    הם אבן חלקה ומלוטשת המחליקה באופן מסוכן בגשם, אז נעלו נעליים עם אחיזה. המדרגות תלולות והמעקות מקוטעים,
    אז השגיחו על ילדים. הביאו מים. הקופה, השירותים ובית קפה קטן נמצאים בכניסה, ולקיחת מדריך במקום באמת
    משתלמת כאן.
  route: >-
    צאו מטביליסי מערבה בכביש המהיר E60 לכיוון גורי — 85 ק"מ של כביש טוב ומהיר. מעט לפני גורי פנו בפנייה
    המסומנת לאופליסציחה וסעו עוד 14 ק"מ בכביש צר אך סלול מעל רכס קוורנאקי ומטה אל גדת הנהר. בסך הכול כ-100
    ק"מ ושעה ועשרים וחמש דקות. בכניסה יש חניון גדול וחינם. דלק וחנויות בשפע לאורך הכביש המהיר ובגורי.
    רכב חסכוני מספיק לחלוטין בכל עונה.
ar:
  name: أوبليستسيخي
  short: مدينة منحوتة في الصخر فوق متكفاري — أقدم مركز حضري في جورجيا، بتاريخ يتجاوز 3,000 سنة.
  body: >-
    **أوبليستسيخي نُحتت من الصخر ولم تُبنَ فوقه.** شرق غوري، على الضفة اليسرى لمتكفاري، حُفرت باليد قاعات
    وشوارع ومعابد ومعاصر نبيذ ومذابح في كتلة من الحجر الرملي اللين. تشكلت المدينة في الألف الأول قبل الميلاد
    وظلت مأهولة من مطلع العصر الحديدي حتى العصور الوسطى — قرابة ثلاثة آلاف سنة من الحياة المتصلة.


    وقبل المسيحية كانت مركز عبادة وثنية كبيراً. ويعني اسمها "حصن الرب"، وهذا المعنى المزدوج، الإلهي والملكي،
    يقول الكثير عن مكانتها. وقد قامت على فرع من طريق الحرير وجاء ثراؤها من التجارة. وفي القرن الثالث عشر
    دمّرها المغول فهُجرت تدريجياً.


    ويُفتح اليوم نحو أربعين من الكهوف التي تربو على مئتين: **قاعة الملكة تامار**، وهي أكبر الفراغات، بسقفها
    المقسّم المنحوت في الصخر مباشرة، وقد كانت على الأرجح معبداً وثنياً في الأصل؛ و**نفق سري** ينزل إلى
    النهر كان يُستخدم لجلب الماء أثناء الحصار؛ و**بازيليكا من الآجر** ثلاثية الأروقة من القرن التاسع أو
    العاشر تتوج الموقع؛ ومعاصر نبيذ وحُفر كفيفري، وهي من أقدم آثار صناعة النبيذ في البلاد. ومن الأعلى
    ينفتح وادي متكفاري وسهل غوري، وعند الغروب يتحول لون الصخر إلى البرتقالي.
  tip: >-
    لا ظل هنا تقريباً ويتحول الصخر إلى فرن عند الظهيرة، ففي يوليو وأغسطس تعال قبل العاشرة صباحاً أو بعد
    الخامسة. الأسطح حجر أملس مصقول يصير زلقاً بصورة خطرة عند المطر، فالبس حذاءً ذا قبضة جيدة. الدرجات
    حادة والدرابزين متقطع، فانتبه للأطفال. خذ ماءً. شباك التذاكر ودورات المياه ومقهى صغير عند المدخل،
    واستئجار مرشد في الموقع يستحق العناء هنا فعلاً.
  route: >-
    اخرج من تبليسي غرباً على الطريق السريع E60 نحو غوري — 85 كم من طريق جيد وسريع. وقبل غوري بقليل اسلك
    مخرج أوبليستسيخي المعلَّم واتبع طريقاً ضيقاً لكنه معبّد مسافة 14 كم فوق سلسلة كفيرناكي ونزولاً إلى
    ضفة النهر. في المجموع نحو 100 كم وساعة وخمس وعشرين دقيقة. عند المدخل موقف كبير مجاني. الوقود والمتاجر
    متوفرة بكثرة على الطريق السريع وفي غوري. والسيارة الاقتصادية كافية تماماً في أي فصل.
