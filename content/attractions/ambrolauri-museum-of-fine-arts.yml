ka:
  name: ამბროლაურის სახვითი ხელოვნების მუზეუმი
  short: >-
    პატარა გალერეა რაჭის დედაქალაქში: XX საუკუნის ქართველ მხატვართა 565 ნამუშევარი — ლადო გუდიაშვილიდან
    ელენე ახვლედიანამდე და დავით კაკაბაძემდე.
  body: >-
    **ამბროლაურის სახვითი ხელოვნების მუზეუმს წელიწადში რვაასზე ცოტა მეტი დამთვალიერებელი ჰყავს, ასე რომ,
    ჩვეულებრივ სამუშაო დღეს ლადო გუდიაშვილთან შესაძლოა სულ მარტო აღმოჩნდეთ.**


    მუზეუმი რაჭის დედაქალაქში 1965 წელს გაიხსნა და პატარადვე დარჩა: ქალაქის ცენტრში, თამარ მეფის ქუჩა
    №4-ში, მუდმივ ექსპოზიციას დაახლოებით 150 კვადრატული მეტრი უჭირავს, დროებით გამოფენებს — ერთი კუთხე.
    სამაგიეროდ, აქ დაცული კოლექცია თავის ზომას ბევრად აღემატება: 565 ნამუშევარი, ძირითადად ფერწერა და
    გრაფიკა, იმ ქართველი მხატვრებისა, რომლებმაც XX საუკუნის ქართული ხელოვნების სახე განსაზღვრეს.


    სახელები სახელმძღვანელოს თავივით იკითხება. აქაა გუდიაშვილიც და ელენე ახვლედიანიც, რომელიც ყველაზე
    მეტად ქართული ქალაქების ხედებითა და ილია ჭავჭავაძისა და ვაჟა-ფშაველას თხზულებების ილუსტრაციებით არის
    ცნობილი. აქაა დავით კაკაბაძეც — ავანგარდისტი, რომელმაც თავისი დროის ახალი ევროპული ხელოვნება ქართულ
    ტრადიციას შეაზავა. მათ გვერდით უჩა ჯაფარიძის, კობა გურულის, ავთო ვარაზის, ლევან ცუცქირიძისა და ნათელა
    იანქოშვილის ნამუშევრები კიდია.


    როგორ მოხვდა მთის პატარა ქალაქში ასეთი საზოგადოება, ჩვენ მიერ მოძიებული წყაროები არ ამბობენ. თანამშრომლებს
    ჰკითხეთ.


    წვიმიან შუადღეს მოდით, როცა მწვერვალებს ღრუბელი ფარავს და რიონი ხმამაღლა მოედინება: სწორედ მაშინ იმსახურებს
    სურათებით სავსე ოთახი რაჭაში თავის ადგილს.
  tip: >-
    ცნობების მიხედვით, მუზეუმი ორშაბათის გარდა ყოველდღე, 10:00-დან 17:00-მდე მუშაობს, მაგრამ პატარა რეგიონულ
    მუზეუმებში გრაფიკი ხშირად იცვლება, ამიტომ ადგილზე გადაამოწმეთ. შესვლა სიმბოლურია (გამოქვეყნებული ცნობებით,
    ზრდასრულისთვის 1 ლარი, სტუდენტისთვის 50 თეთრი), ასე რომ, ხურდა იქონიეთ. ერთი საათი სავსებით საკმარისია.
    ფოტოს გადაღებამდე ნებართვა ითხოვეთ. მანქანა ცენტრში დატოვეთ და ფეხით მოდით. მუზეუმი ამბროლაურის სხვა
    ღირსშესანიშნაობებთან ერთად მოინახულეთ: ბარაკონის ტაძარი, მინდა ციხე და ხვანჭკარის ვენახები სულ ახლოსაა.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით, ზესტაფონის გავლით ქუთაისამდე, შემდეგ შ17-ით ჩრდილოეთით,
    ტყიბულისა და ნაქერალას უღელტეხილის გავლით ამბროლაურამდე: დაახლოებით 313 კმ და ხუთი საათი და ოცდახუთი
    წუთი. თუ ქუთაისამდე შ19-ზე გადაუხვევთ და თერჯოლის გავლით პირდაპირ ტყიბულში ახვალთ, გზა 30-იოდე კილომეტრით
    მოკლდება. გზა ბოლომდე ასფალტიანია, მაგრამ ნაქერალაზე ვიწრო და მოსახვევებით სავსეა, წიფლნარის ჩრდილში
    ხშირად სველიცაა, ზამთარში კი თოვლი დიდხანს დევს. დაბალი ალტერნატივაა შ16 რიონის ხეობით, ალპანის გავლით.
    ეკონომკლასის მანქანა საკმარისია. საწვავი ზესტაფონში, ქუთაისში ან ტყიბულში ჩაასხით.
en:
  name: Ambrolauri Museum of Fine Arts
  short: >-
    A small gallery in Racha's capital holding 565 works by 20th-century Georgian artists, from Lado Gudiashvili
    to Elene Akhvlediani and David Kakabadze.
  body: >-
    **A little over eight hundred people a year visit the Ambrolauri Museum of Fine Arts, so on an ordinary
    weekday you may well have Lado Gudiashvili to yourself.**


    The museum opened in 1965 in the capital of Racha, and it has stayed small: about 150 square metres
    of permanent display at 4 Tamar Mepe Street in the town centre, with a corner for temporary shows.
    What it keeps is out of all proportion to its size: 565 works, mainly paintings and drawings, by the
    Georgian artists who defined the 20th century.


    The roll-call reads like a chapter from a textbook. Gudiashvili is here, and so is Elene Akhvlediani,
    best known for her Georgian townscapes and her illustrations to Ilia Chavchavadze and Vazha-Pshavela.
    So is David Kakabadze, the avant-gardist who fused the new European art of his day with Georgian tradition.
    Alongside them hang Ucha Japaridze, Koba Guruli, Avto Varazi, Levan Tsutskiridze and Natela Iankoshvili.


    How a small mountain town came by such company, the sources we could find do not say. Ask the staff.


    Come on a wet afternoon, when cloud hides the peaks and the Rioni runs loud: that is when a room full
    of paintings earns its place in Racha.
  tip: >-
    The museum has been listed as open daily except Monday, from 10:00 to 17:00, but hours at small regional
    museums change, so check locally before you plan around it. Admission is nominal (listed at 1 GEL
    for adults and 0.5 GEL for students), so bring small change. An hour is plenty. Ask before taking
    photographs. Leave the car in the centre and walk. Pair the visit with the rest of Ambrolauri: Barakoni
    church, Minda fortress and the Khvanchkara vineyards are all close by.
  route: >-
    From Tbilisi take the S1 (E60) west past Zestaponi to Kutaisi, then the Sh17 north through Tkibuli
    and over the Nakerala pass to Ambrolauri: about 313 km and five hours twenty-five minutes. Turning
    off before Kutaisi onto the Sh19 through Terjola to Tkibuli saves some 30 km. The road is asphalt
    throughout, but the Nakerala section is narrow, full of tight bends and often damp under the beeches,
    and snow lingers there in winter. The lower alternative is the Sh16 up the Rioni gorge via Alpana.
    An economy car is enough. Refuel at Zestaponi, Kutaisi or Tkibuli.
ru:
  name: Амбролаурский музей изобразительных искусств
  short: >-
    Небольшая галерея в столице Рачи: 565 работ грузинских художников XX века — от Ладо Гудиашвили до
    Елены Ахвледиани и Давида Какабадзе.
  body: >-
    **Амбролаурский музей изобразительных искусств посещают чуть больше восьмисот человек в год, так что
    в обычный будний день Ладо Гудиашвили вполне может достаться вам одному.**


    Музей открылся в 1965 году в столице Рачи и так и остался небольшим: около 150 квадратных метров постоянной
    экспозиции на улице Тамар Мепе, 4, в центре города, плюс уголок для временных выставок. Зато хранит
    он несоразмерно много: 565 работ, в основном живопись и графика, грузинских художников, определивших
    облик XX века.


    Перечень имён звучит как глава из учебника. Здесь Гудиашвили, здесь и Елена Ахвледиани, известная
    прежде всего грузинскими городскими пейзажами и иллюстрациями к Илье Чавчавадзе и Важа-Пшавеле. Здесь
    и Давид Какабадзе — авангардист, соединивший новое европейское искусство своего времени с грузинской
    традицией. Рядом с ними — Уча Джапаридзе, Коба Гурули, Авто Варази, Леван Цуцкиридзе и Натела Янкошвили.


    Как маленький горный город обзавёлся таким обществом, найденные нами источники не сообщают. Спросите
    у сотрудников.


    Приезжайте дождливым днём, когда облака прячут вершины, а Риони шумит в полный голос: именно тогда
    зал, полный картин, оправдывает своё место в Раче.
  tip: >-
    По имеющимся данным, музей открыт ежедневно, кроме понедельника, с 10:00 до 17:00, но часы работы
    небольших региональных музеев меняются, так что уточните на месте, прежде чем строить планы. Вход
    символический (по опубликованным данным, 1 лари для взрослых и 0,5 лари для студентов), поэтому возьмите
    мелочь. Часа хватит с избытком. Прежде чем фотографировать, спросите разрешения. Оставьте машину в
    центре и пройдитесь пешком. Совместите визит с остальным Амбролаури: церковь Баракони, крепость Минда
    и виноградники Хванчкары — совсем рядом.
  route: >-
    Из Тбилиси двигайтесь по S1 (E60) на запад мимо Зестафони до Кутаиси, затем по Sh17 на север через
    Ткибули и перевал Накерала до Амбролаури: около 313 км и пять часов двадцать пять минут. Если свернуть
    ещё до Кутаиси на Sh19 через Терджолу на Ткибули, можно сэкономить около 30 км. Дорога асфальтирована
    на всём протяжении, но участок Накерала узкий, полон крутых поворотов и часто сырой под буками, а
    зимой там подолгу лежит снег. Более низкая альтернатива — Sh16 вверх по ущелью Риони через Алпану.
    Автомобиля эконом-класса достаточно. Заправляйтесь в Зестафони, Кутаиси или Ткибули.
fa:
  name: موزهٔ هنرهای زیبای آمبرولائوری
  short: >-
    نگارخانه‌ای کوچک در مرکز راچا با ۵۶۵ اثر از هنرمندان گرجی سدهٔ بیستم، از لادو گودیاشویلی تا النه آخولدیانی
    و داوید کاکابادزه.
  body: >-
    **سالانه کمی بیش از هشتصد نفر از موزهٔ هنرهای زیبای آمبرولائوری دیدن می‌کنند؛ پس در یک روز عادی هفته
    شاید لادو گودیاشویلی را تنها برای خودتان داشته باشید.**


    موزه در ۱۹۶۵ در مرکز راچا گشایش یافت و کوچک ماند: حدود ۱۵۰ متر مربع نمایشگاه دائمی در شمارهٔ ۴ خیابان
    تامار مپه، در مرکز شهر، به‌اضافهٔ گوشه‌ای برای نمایشگاه‌های موقت. اما آنچه نگه می‌دارد با اندازه‌اش
    هیچ تناسبی ندارد: ۵۶۵ اثر، بیشتر نقاشی و طراحی، از هنرمندان گرجی‌ای که چهرهٔ سدهٔ بیستم را رقم زدند.


    فهرست نام‌ها به فصلی از یک کتاب درسی می‌ماند. گودیاشویلی اینجاست، و النه آخولدیانی نیز، که بیش از
    همه با منظره‌های شهری گرجی و تصویرگری‌هایش برای آثار ایلیا چاوچاوادزه و واژا پشاولا شناخته می‌شود.
    داوید کاکابادزه هم هست، هنرمند آوانگاردی که هنر نوین اروپای روزگارش را با سنت گرجی درآمیخت. در کنارشان
    آثار اوچا جاپاریدزه، کوبا گورولی، آوتو وارازی، لوان تسوتسکیریدزه و ناتلا یانکوشویلی آویخته است.


    اینکه شهری کوچک در کوهستان چگونه به چنین جمعی دست یافت، منابعی که ما یافتیم نمی‌گویند. از کارکنان
    بپرسید.


    در بعدازظهری بارانی بیایید، وقتی ابر قله‌ها را پوشانده و ریونی پرخروش می‌گذرد: درست در همین هنگام
    است که تالاری پر از نقاشی جایگاهش را در راچا به دست می‌آورد.
  tip: >-
    ساعات کار موزه هر روز به‌جز دوشنبه از ۱۰:۰۰ تا ۱۷:۰۰ اعلام شده است، اما ساعات موزه‌های کوچک منطقه‌ای
    تغییر می‌کند؛ پیش از برنامه‌ریزی در محل جویا شوید. ورودیه ناچیز است (طبق اطلاعات منتشرشده، ۱ لاری
    برای بزرگسالان و ۰٫۵ لاری برای دانشجویان)، پس پول خرد همراه داشته باشید. یک ساعت کاملاً کافی است.
    پیش از عکاسی اجازه بگیرید. خودرو را در مرکز بگذارید و پیاده بروید. بازدید را با دیگر دیدنی‌های آمبرولائوری
    همراه کنید: کلیسای باراکونی، قلعهٔ میندا و تاکستان‌های خوانچکارا همه نزدیک‌اند.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از کنار زستافونی، تا کوتایسی بروید، سپس از Sh17 به سمت شمال از راه
    تکیبولی و گردنهٔ ناکرالا به آمبرولائوری برسید: حدود ۳۱۳ کیلومتر و پنج ساعت و بیست‌وپنج دقیقه. اگر
    پیش از کوتایسی به Sh19 بپیچید و از ترجولا به تکیبولی بروید، حدود ۳۰ کیلومتر صرفه‌جویی می‌شود. جاده
    سراسر آسفالت است، اما بخش ناکرالا باریک و پر از پیچ‌های تند است، زیر درختان راش اغلب نمناک است و در
    زمستان برف مدتی طولانی در آن می‌ماند. مسیر جایگزینِ کم‌ارتفاع‌تر Sh16 است که از راه آلپانا در درهٔ
    ریونی بالا می‌رود. یک خودروی اقتصادی کافی است. در زستافونی، کوتایسی یا تکیبولی سوخت بگیرید.
he:
  name: המוזיאון לאמנויות יפות באמברולאורי
  short: >-
    גלריה קטנה בבירת רצ'ה ובה 565 יצירות של אמנים גאורגים מהמאה העשרים, מלאדו גודיאשווילי ועד אלנה אחוולדיאני
    ודוד קקבדזה.
  body: >-
    **קצת יותר משמונה מאות איש בשנה מבקרים במוזיאון לאמנויות יפות באמברולאורי, כך שביום חול רגיל ייתכן
    מאוד שלאדו גודיאשווילי יהיה כולו שלכם.**


    המוזיאון נפתח ב-1965 בבירת רצ'ה ונשאר קטן: כ-150 מטרים רבועים של תצוגת קבע ברחוב תמר מפה 4 שבמרכז
    העיר, ועוד פינה לתערוכות מתחלפות. אבל מה שהוא שומר אינו עומד בשום יחס לגודלו: 565 יצירות, בעיקר ציורים
    ורישומים, של האמנים הגאורגים שעיצבו את המאה העשרים.


    רשימת השמות נקראת כמו פרק מספר לימוד. גודיאשווילי כאן, וכך גם אלנה אחוולדיאני, הידועה בעיקר בנופי
    העיר הגאורגיים שציירה ובאיוריה ליצירות של איליה צ'בצ'בדזה ושל וז'ה פשבלה. וכך גם דוד קקבדזה, האוונגרדיסט
    שמיזג את האמנות האירופית החדשה של ימיו עם המסורת הגאורגית. לצדם תלויות יצירות של אוצ'ה ג'פרידזה, קובה
    גורולי, אבטו ורזי, לבאן צוצקירידזה ונטלה יאנקושווילי.


    איך זכתה עיירת הרים קטנה לחברה כזאת, המקורות שמצאנו אינם מספרים. שאלו את הצוות.


    בואו אחר צהריים גשום, כשהעננים מסתירים את הפסגות והריוני שוצף ברעש: דווקא אז אולם מלא ציורים מצדיק
    את מקומו ברצ'ה.
  tip: >-
    לפי הרישום, המוזיאון פתוח בכל יום מלבד יום שני, 10:00–17:00, אבל שעות הפתיחה של מוזיאונים אזוריים
    קטנים משתנות, לכן בדקו במקום לפני שאתם בונים עליהן. דמי הכניסה סמליים (לפי המידע שפורסם, 1 לארי למבוגרים
    ו-0.5 לארי לסטודנטים), אז הביאו כסף קטן. שעה אחת מספיקה בהחלט. בקשו רשות לפני שאתם מצלמים. השאירו
    את הרכב במרכז ולכו ברגל. שלבו את הביקור עם שאר אמברולאורי: כנסיית ברקוני, מבצר מינדה והכרמים של חבנצ'קרה
    נמצאים כולם בקרבת מקום.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), עברו את זסטפוני והמשיכו עד קוטאיסי, ומשם צפונה בכביש Sh17 דרך טקיבולי
    ומעבר נקרלה עד אמברולאורי: כ-313 ק״מ וחמש שעות ועשרים וחמש דקות. פנייה עוד לפני קוטאיסי לכביש Sh19
    דרך טרג'ולה לטקיבולי חוסכת כ-30 ק״מ. הדרך סלולה באספלט לכל אורכה, אבל קטע נקרלה צר, רצוף עיקולים חדים
    ולעתים קרובות לח בצל עצי האשור, ובחורף השלג מתעכב בו זמן רב. החלופה הנמוכה יותר היא כביש Sh16 במעלה
    ערוץ הריוני דרך אלפנה. רכב מקטגוריית אקונומי מספיק. תדלקו בזסטפוני, בקוטאיסי או בטקיבולי.
ar:
  name: متحف الفنون الجميلة في أمبرولاوري
  short: >-
    صالة عرض صغيرة في عاصمة راتشا تضم 565 عملًا لفنانين جورجيين من القرن العشرين، من لادو غودياشفيلي إلى
    إيلينه أخفليدياني وداويت كاكابادزه.
  body: >-
    **يزور متحف الفنون الجميلة في أمبرولاوري ما يزيد قليلًا على ثمانمئة شخص في السنة، فقد تحظى في يوم
    عادي من أيام الأسبوع بلادو غودياشفيلي لك وحدك.**


    افتُتح المتحف عام 1965 في عاصمة راتشا وبقي صغيرًا: نحو 150 مترًا مربعًا للعرض الدائم في شارع تامار
    ميبي رقم 4 وسط البلدة، إلى جانب ركن للمعارض المؤقتة. غير أن ما يحفظه لا يتناسب البتة مع حجمه: 565
    عملًا، معظمها لوحات ورسوم، لفنانين جورجيين صاغوا ملامح القرن العشرين.


    تبدو قائمة الأسماء كأنها فصل من كتاب مدرسي. غودياشفيلي هنا، وكذلك إيلينه أخفليدياني، المعروفة خصوصًا
    بمشاهدها للمدن الجورجية وبرسومها لأعمال إيليا تشافتشافادزه وفاجا بشافيلا. وهنا أيضًا داويت كاكابادزه،
    الفنان الطليعي الذي مزج الفن الأوروبي الجديد في عصره بالتقاليد الجورجية. وإلى جانبهم تُعلَّق أعمال
    أوتشا جاباريدزه وكوبا غورولي وأفتو فارازي وليفان تسوتسكيريدزه وناتيلا يانكوشفيلي.


    كيف ظفرت بلدة جبلية صغيرة بمثل هذه الصحبة؟ لا تقول ذلك المصادر التي عثرنا عليها. اسأل العاملين.


    تعالَ في عصر ماطر، حين يحجب الغيم القمم ويعلو هدير نهر ريوني: عندها بالذات تستحق قاعةٌ مليئة باللوحات
    مكانها في راتشا.
  tip: >-
    تشير البيانات المتاحة إلى أن المتحف يفتح يوميًا عدا الاثنين من 10:00 إلى 17:00، لكن مواعيد المتاحف
    الإقليمية الصغيرة تتغير، فتحقق محليًا قبل أن تبني خطتك عليها. رسم الدخول رمزي (بحسب المعلومات المنشورة،
    1 لاري للبالغين و0.5 لاري للطلاب)، فاحمل معك نقودًا صغيرة. تكفي ساعة واحدة. استأذن قبل التصوير. اترك
    السيارة في الوسط وتجوّل سيرًا. واجمع الزيارة مع بقية معالم أمبرولاوري: كنيسة باراكوني وقلعة ميندا
    وكروم خفانتشكارا كلها قريبة.
  route: >-
    من تبليسي اتبع الطريق S1 (E60) غربًا مرورًا بزستافوني حتى كوتايسي، ثم الطريق Sh17 شمالًا عبر تكيبولي
    وممر ناكيرالا إلى أمبرولاوري: نحو 313 كم وخمس ساعات وخمس وعشرين دقيقة. والانعطاف قبل كوتايسي إلى الطريق
    Sh19 عبر تيرجولا نحو تكيبولي يوفّر قرابة 30 كم. الطريق معبّد بالكامل، لكن مقطع ناكيرالا ضيق وكثير
    المنعطفات الحادة ورطب غالبًا تحت أشجار الزان، ويبقى فيه الثلج طويلًا في الشتاء. والبديل الأقل ارتفاعًا
    هو الطريق Sh16 صعودًا في وادي ريوني عبر ألبانا. تكفي سيارة اقتصادية. تزوّد بالوقود في زستافوني أو
    كوتايسي أو تكيبولي.
