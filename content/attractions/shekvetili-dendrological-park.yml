ka:
  name: შეკვეთილის დენდროლოგიური პარკი
  short: >-
    სამოცი ჰექტარი გადმორგული გიგანტებით ზღვის პირას: ძველი ხეები აქ გზითა და ბარჟით ჩამოიტანეს, ტბაში
    კი ფლამინგოები დგანან.
  body: >-
    **პარკებს, ჩვეულებრივ, რგავენ; ეს პარკი კი ჩამოიტანეს — ხე ხის მიყოლებით, ახლად გაყვანილი გზებით და
    ბარჟებით შავ ზღვაზე.**


    2016 წლიდან მილიარდერმა და ყოფილმა პრემიერ-მინისტრმა ბიძინა ივანიშვილმა დასავლეთ საქართველოს ტყეებსა
    და ბაღებში ზრდასრული ხეები შეისყიდა და შეკვეთილში, თავის მამულში გადმოატანინა. მათთვის გზები გაიყვანეს,
    მოძრაობასა და მატარებლებს აჩერებდნენ, ერთი მდინარეც კი გააფართოეს. სოფლელები ეზოებიდან ასწლოვან მაგნოლიებს
    ყიდდნენ; ასი წლის ჭადრები სოფელ ქარიათიდან ჩამოიტანეს. გარემოსდამცველები ნიადაგისა და ლანდშაფტის დაზიანებას
    აპროტესტებდნენ, ხოლო სალომე ჯაშის დოკუმენტურმა ფილმმა „ბაღის მოთვინიერება“, რომელიც 2021 წელს სანდენსის
    ფესტივალზე აჩვენეს, მთელი ეს ოპერაცია წყნარ და შემაშფოთებელ იგავად აქცია.


    პარკი 2020 წლის 15 ივლისს გაიხსნა, უფასოდ, და ცნობებით, პირველ ორ კვირაში აქ 250 000-მდე ადამიანი
    მოვიდა. დღეს იგი მთებსა და ზღვას შორის 60 ჰექტარზეა გადაჭიმული. აქ 29 სახეობის 200-ზე მეტი გადმორგული
    ხე დგას — ზოგი, როგორც ამბობენ, სამ საუკუნეზე ხნიერია; 18 ჰექტარი დასავლეთ საქართველოდან გადმოტანილ
    ენდემურ სახეობებს უჭირავს, მათ გარშემო კი ხუთი კონტინენტის ეგზოტიკა იზრდება: ევკალიპტი, სეკვოია, კვიპაროსი,
    კედარი, მაგნოლია, ტიტის ხე. ერთი ბილიკი ხშირ ბამბუკის გვირაბში გადის. შუაგულის ხელოვნურ ტბაზე ვარდისფერი
    ფლამინგოები დგანან ვარხვებს, ჩვიტებსა და აფრიკულ წეროებს შორის; ლემურები, თუთიყუშები და ირმები ვრცელ
    ვოლიერებში ცხოვრობენ — სულ 58 სახეობის ფრინველი და ცხოველი.


    ნელა გაიარეთ და ყველაზე უცნაურს შეამჩნევთ: აქ ყოველი გიგანტი დანარჩენებისგან ცოტა მოშორებით დგას,
    სუფთა გაზონზე, როგორც სტუმარი წვეულებაზე, რომელიც ჯერ არავისთვის გაუცნიათ.
  tip: >-
    ორი საათი გამოყავით, ბავშვებთან ერთად — მეტი: ფლამინგოებს ადვილად ვერ მოსწყდებიან. ბილიკები ბრტყელი
    და განიერია, ბავშვის ეტლითაც და სავარძელ-ეტლითაც თავისუფლად გაივლით. პარკის დიდი ნაწილი ღია გაზონია
    — შუადღისას ქუდი არ დაგავიწყდეთ. კაფე და ტუალეტი შესასვლელთანაა. 2020 წელს, გახსნისას, შესვლა უფასო
    იყო; მას შემდეგ პირობებზე სხვადასხვა ცნობა ვრცელდება, ამიტომ წასვლამდე გადაამოწმეთ. დილით უფრო წყნარია
    და ცხოველებიც უფრო მხნედ არიან; ზაფხულის ნაშუადღევს სიცხე და რიგებია. ცხოველებს ნუ აჭმევთ და გადმორგულ
    ხეებს ნუ შეაწუხებთ — ბევრი მათგანი ჯერ კიდევ ახალ მიწას ეჩვევა.
  route: >-
    თბილისიდან დაახლოებით 322 კმ-ია, გზას დაახლოებით ოთხ საათსა და ორმოცდახუთ წუთს მოანდომებთ. ს1 (E60)
    მაგისტრალით ქუთაისის გავლით სამტრედიამდე მიდიხართ, შემდეგ ს12-ით ლანჩხუთის გავლით ზღვისპირა გრიგოლეთამდე,
    იქ კი ს2-ზე სამხრეთისკენ უხვევთ. ურეკს გაივლით: პარკის შესასვლელი ურეკსა და შეკვეთილს შორისაა, მთავარ
    გზაზე მიმანიშნებელი დაგხვდებათ, მანქანას კი შესასვლელთან, ავტოსადგომზე დატოვებთ. გზა ბოლომდე ასფალტია,
    ეკონომ კლასის ავტომობილი სრულიად საკმარისია. საწვავს ლანჩხუთსა და ურეკში შეავსებთ. ზაფხულის შაბათ-კვირას
    სანაპირო გზაზე დამატებითი დრო გაითვალისწინეთ.
en:
  name: Shekvetili Dendrological Park
  short: >-
    Sixty hectares of relocated giants by the sea: old trees brought here by road and barge, with flamingos
    standing in the lake between them.
  body: >-
    **Most parks are planted; this one was delivered, tree by tree, along newly built roads and on barges
    across the Black Sea.**


    From 2016 the billionaire and former prime minister Bidzina Ivanishvili had mature trees bought from
    forests and gardens across western Georgia and moved to his estate at Shekvetili. Roads were laid
    for them, traffic and trains were held up, a river was widened. Villagers sold century-old magnolias
    out of their yards; hundred-year-old plane trees came from the village of Kariati. Environmentalists
    protested at the damage to topsoil and landscape, and Salomé Jashi's documentary Taming the Garden,
    shown at Sundance in 2021, turned the whole operation into a quiet, unsettling parable.


    The park opened on 15 July 2020, free of charge, and some 250,000 people reportedly came in its first
    two weeks. Today it spreads over 60 hectares between the hills and the sea. It holds more than 200
    transplanted trees of 29 species, some said to be over three hundred years old; 18 hectares are given
    to endemic species moved from western Georgia, and around them grow exotics from five continents —
    eucalyptus, sequoia, cypress, cedar, magnolia, tulip trees. One path runs through a dense tunnel of
    bamboo. On the artificial lake at the centre, pink flamingos stand among pelicans, cormorants and
    African cranes; lemurs, parrots and deer live in large enclosures, 58 species of birds and animals
    in all.


    Walk it slowly and you notice the strangest thing. Every giant here stands a little apart from the
    rest, on clean lawn, like a guest at a party who has not yet been introduced to anyone.
  tip: >-
    Give it two hours, longer with children who will not leave the flamingos. Paths are flat and wide,
    easy with a pushchair or wheelchair. Much of the park is open lawn, so bring a hat at midday. The
    café and toilets are by the entrance. Entry was free when the park opened in 2020; the terms have
    been reported differently since, so check before you go. Mornings are calmer and the animals livelier;
    summer afternoons bring heat and queues. Do not feed the animals, and give the transplanted trees
    their space — many are still settling into new ground.
  route: >-
    From Tbilisi it is about 322 km, roughly four hours and forty-five minutes. Take the S1 (E60) west
    past Kutaisi to Samtredia, then the S12 through Lanchkhuti to Grigoleti on the coast, and turn south
    onto the S2. Pass through Ureki: the park entrance lies between Ureki and Shekvetili, signposted from
    the main road, with a car park at the gate. It is asphalt all the way, and an economy car is all you
    need. Fuel is available in Lanchkhuti and Ureki. On summer weekends allow extra time for the coast
    road.
ru:
  name: Дендрологический парк Шекветили
  short: >-
    Шестьдесят гектаров переселённых гигантов у моря: старые деревья привезли сюда по дорогам и на баржах,
    а между ними в озере стоят фламинго.
  body: >-
    **Большинство парков сажают; этот же доставили — дерево за деревом, по новым дорогам и на баржах через
    Чёрное море.**


    С 2016 года миллиардер и бывший премьер-министр Бидзина Иванишвили скупал зрелые деревья в лесах и
    садах по всей Западной Грузии и перевозил их в своё имение в Шекветили. Для них прокладывали дороги,
    останавливали движение и поезда, расширяли реку. Сельчане продавали столетние магнолии прямо из своих
    дворов; вековые платаны привезли из села Кариати. Экологи протестовали против разрушения почвенного
    слоя и ландшафта, а документальный фильм Саломе Джаши «Укрощение сада», показанный на кинофестивале
    «Сандэнс» в 2021 году, превратил всю эту операцию в тихую, тревожную притчу.


    Парк открылся 15 июля 2020 года, бесплатно, и, по имеющимся данным, за первые две недели его посетили
    около 250 000 человек. Сегодня он раскинулся на 60 гектарах между холмами и морем. Здесь более 200
    пересаженных деревьев 29 видов, некоторым, как говорят, больше трёхсот лет; 18 гектаров отведены под
    эндемичные виды, перевезённые из Западной Грузии, а вокруг них растут экзоты с пяти континентов —
    эвкалипт, секвойя, кипарис, кедр, магнолия, тюльпанное дерево. Одна тропа проходит через густой бамбуковый
    тоннель. На искусственном озере в центре розовые фламинго стоят среди пеликанов, бакланов и африканских
    журавлей; лемуры, попугаи и олени живут в больших вольерах — всего 58 видов птиц и животных.


    Если идти неспешно, замечаешь самое странное. Каждый гигант здесь стоит немного в стороне от остальных,
    на чистой траве, как гость на вечеринке, которого пока никому не представили.
  tip: >-
    На парк уйдёт часа два, дольше — с детьми, которых не оторвать от фламинго. Дорожки плоские и широкие,
    легко пройти с коляской или инвалидным креслом. Большая часть парка — открытая лужайка, так что в
    полдень возьмите шляпу. Кафе и туалеты у входа. При открытии в 2020 году вход был бесплатным; позже
    условия сообщались по-разному, так что уточните перед поездкой. По утрам спокойнее, а животные бодрее;
    летними днями — жара и очереди. Не кормите животных и не мешайте пересаженным деревьям — многие из
    них ещё привыкают к новой земле.
  route: >-
    Из Тбилиси около 322 км, примерно четыре часа сорок пять минут. Двигайтесь по S1 (E60) на запад через
    Кутаиси до Самтредиа, затем по S12 через Ланчхути до Григолети на побережье и сверните на юг, на S2.
    Проедьте через Уреки: вход в парк расположен между Уреки и Шекветили, указатель есть на главной дороге,
    у ворот — стоянка. Дорога асфальтирована на всём протяжении, хватит машины эконом-класса. Заправиться
    можно в Ланчхути и Уреки. В летние выходные оставьте время в запасе на прибрежной дороге.
fa:
  name: پارک درخت‌شناسی شکوتیلی
  short: >-
    شصت هکتار از غول‌های جابه‌جاشده کنار دریا: درختان کهنی که با راه و کرجی بدین‌جا آورده‌اند، و میان‌شان
    فلامینگوها در دریاچه ایستاده‌اند.
  body: >-
    **بیشتر پارک‌ها کاشته می‌شوند؛ این یکی، درخت به درخت، از راه‌های تازه‌ساخت و کرجی‌هایی بر دریای سیاه،
    تحویل داده شد.**


    از ۲۰۱۶ بیدزینا ایوانیشویلی، میلیاردر و نخست‌وزیر پیشین، درختان بالغی را از جنگل‌ها و باغ‌های سراسر
    گرجستان غربی خرید و به ملک خود در شکوتیلی برد. برای آن‌ها راه ساختند، ترافیک و قطارها را نگه داشتند،
    رودی را گسترش دادند. روستاییان مگنولیاهای صدساله را از حیاط‌های خود فروختند؛ چنارهای صدساله از روستای
    کاریاتی آمدند. محیط‌زیست‌گرایان به آسیب خاک سطحی و منظره اعتراض کردند، و فیلم مستند سالومه جاشی، «رام‌کردن
    باغ»، که در ساندنس ۲۰۲۱ نمایش داده شد، تمام این عملیات را به تمثیلی آرام و ناراحت‌کننده بدل کرد.


    پارک در ۱۵ ژوئیهٔ ۲۰۲۰ به‌رایگان گشوده شد، و گفته می‌شود در دو هفتهٔ نخست نزدیک به ۲۵۰٬۰۰۰ نفر بازدید
    کردند. امروز بر شصت هکتار میان تپه‌ها و دریا گسترده است. بیش از ۲۰۰ درخت جابه‌جاشده از ۲۹ گونه در
    آن است که گفته می‌شود برخی‌شان بیش از سیصد سال عمر دارند؛ ۱۸ هکتار به گونه‌های بومیِ منتقل‌شده از
    گرجستان غربی سپرده شده، و پیرامون آن‌ها گونه‌های بیگانه‌ای از پنج قاره می‌رویند — اوکالیپتوس، سکویا،
    سرو، سدر، مگنولیا، درخت لاله. مسیری از میان تونلی متراکم از بامبو می‌گذرد. بر دریاچهٔ مصنوعی مرکزی،
    فلامینگوهای صورتی میان پلیکان‌ها، باکلان‌ها و درناهای آفریقایی ایستاده‌اند؛ لمورها، طوطی‌ها و گوزن‌ها
    در محوطه‌های بزرگ زندگی می‌کنند — در کل ۵۸ گونه پرنده و جانور.


    اگر آهسته قدم بزنید، غریب‌ترین چیز را می‌بینید. هر غول اینجا کمی جدا از دیگران، بر چمنی پاکیزه، ایستاده
    — چون میهمانی در جشنی که هنوز به کسی معرفی نشده است.
  tip: >-
    دو ساعت برای آن کافی است، بیشتر با بچه‌هایی که از فلامینگوها دل نمی‌کنند. مسیرها هموار و پهن‌اند،
    آسان با کالسکه یا ویلچر. بیشتر پارک چمن باز است، پس ظهرها کلاهی بیاورید. کافه و سرویس‌های بهداشتی
    نزدیک ورودی‌اند. هنگام گشایش در ۲۰۲۰ ورود رایگان بود؛ از آن پس شرایط به‌گونه‌های متفاوت گزارش شده،
    پس پیش از رفتن بررسی کنید. صبح‌ها آرام‌ترند و جانوران سرزنده‌ترند؛ بعدازظهرهای تابستان گرما و صف می‌آورند.
    به جانوران غذا ندهید، و به درختان جابه‌جاشده فضایشان را بدهید — بسیاری‌شان هنوز با زمین تازه خو می‌گیرند.
  route: >-
    از تفلیس نزدیک به ۳۲۲ کیلومتر است، حدود چهار ساعت و چهل‌وپنج دقیقه. از S1 (E60) به سوی غرب، از کوتایسی
    گذشته، تا سامتردیا برانید، سپس از S12، از میان لانچخوتی، تا گریگولتی بر ساحل، و به‌سوی جنوب به S2
    بپیچید. از اورکی بگذرید: ورودی پارک میان اورکی و شکوتیلی است، با تابلویی از راه اصلی، و پارکینگی کنار
    دروازه. تمام راه آسفالت است، و خودرویی اقتصادی کافی است. سوخت‌گیری در لانچخوتی و اورکی ممکن است. در
    تعطیلات آخر هفتهٔ تابستان، زمان بیشتری برای راه ساحلی در نظر بگیرید.
he:
  name: הגן הדנדרולוגי של שקווטילי
  short: >-
    שישים הקטרים של ענקים שהועתקו אל שפת הים: עצים עתיקים שהובאו הנה בדרכים ובדוברות, ופלמינגו עומדים
    בין העצים באגם.
  body: >-
    **רוב הפארקים נשתלים; זה הובא, עץ אחר עץ, בכבישים שנבנו במיוחד ובדוברות על פני הים השחור.**


    מ־2016 קנה המיליארדר וראש הממשלה לשעבר בידזינה איוונישווילי עצים בוגרים מיערות וגנים בכל מערב גאורגיה
    והעביר אותם לאחוזתו בשקווטילי. נסללו כבישים בשבילם, תנועה ורכבות נעצרו, נהר הורחב. כפריים מכרו מחצרותיהם
    מגנוליות בנות מאה; דולבים בני מאה שנה הגיעו מהכפר קריאטי. פעילי סביבה מיחו על הפגיעה בשכבת האדמה ובנוף,
    והסרט התיעודי של סלומה ג'אשי, "אילוף הגן", שהוצג בסאנדנס ב־2021, הפך את כל המהלך למשל שקט ומטריד.


    הפארק נפתח ב־15 ביולי 2020, בחינם, ולפי הדיווחים כ־250,000 איש הגיעו בשבועיים הראשונים. כיום הוא משתרע
    על 60 הקטרים בין הגבעות והים. בו יותר מ־200 עצים שהועתקו מ־29 מינים, אחדים נחשבים לבני יותר משלוש
    מאות שנה; 18 הקטרים מוקדשים למינים אנדמיים שהועברו ממערב גאורגיה, ומסביבם צומחים אקזוטיים מחמש יבשות
    — איקליפטוס, סקוויה, ברוש, ארז, מגנוליה, עצי טוליפן. שביל אחד חוצה מנהרה צפופה של במבוק. באגם המלאכותי
    במרכז עומדים פלמינגו ורודים בין שקנאים, קורמורנים ועגורים אפריקאים; לֶמוּרים, תוכים ואיילים חיים במכלאות
    גדולות, 58 מיני ציפורים ובעלי חיים בסך הכול.


    אם הולכים לאט, שמים לב לדבר המוזר ביותר. כל ענק כאן עומד קצת בנפרד מהאחרים, על מדשאה נקייה, כמו אורח
    במסיבה שעדיין לא הוצג לאף אחד.
  tip: >-
    הקצו לזה שעתיים, יותר עם ילדים שלא יתנתקו מהפלמינגו. השבילים שטוחים ורחבים, קלים לעגלת תינוק או לכיסא
    גלגלים. חלק גדול מהפארק הוא מדשאה פתוחה, אז הביאו כובע בשעות הצהריים. בית הקפה והשירותים נמצאים לצד
    הכניסה. הכניסה הייתה חינם כשהפארק נפתח ב־2020; מאז דווח על תנאים שונים, אז בדקו לפני שאתם הולכים.
    הבקרים שקטים יותר והחיות עירניות יותר; ושעות אחר הצהריים בקיץ מביאות חום ותורים. אל תזינו את החיות,
    ותנו לעצים שהועתקו את המרחב שלהם — רבים מהם עדיין מכים שורש באדמה החדשה.
  route: >-
    מטביליסי כ-322 ק"מ, בערך ארבע שעות וארבעים וחמש דקות. סעו ב-S1 (E60) מערבה, ליד קוטאיסי, עד סמטרדיה,
    ואז ב-S12 דרך לנצ'חוטי עד גריגולטי על החוף, ופנו דרומה ל-S2. עברו את אורקי: כניסת הפארק נמצאת בין
    אורקי לשקווטילי, עם שילוט מהכביש הראשי, וחניה בשער. כל הדרך אספלט, ורכב חסכוני יספיק. תדלוק אפשרי
    בלנצ'חוטי ובאורקי. בסופי שבוע בקיץ הקצו זמן נוסף לכביש החוף.
ar:
  name: حديقة شكفيتيلي الدندرولوجية
  short: >-
    ستون هكتارًا من العمالقة المنقولة قرب البحر: أشجار عتيقة أُتي بها عبر الطرق والصنادل، وطيور فلامنغو
    تقف في البحيرة بينها.
  body: >-
    **معظم الحدائق تُزرع؛ أما هذه فقد جُلبت، شجرةً بشجرة، على طرق أُنشئت خصيصًا وعلى صنادل عبر البحر الأسود.**


    منذ عام 2016، اشترى المليارديرُ ورئيس الوزراء السابق بيدزينا إيفانيشفيلي أشجارًا بالغة من غابات وحدائق
    في غرب جورجيا ونقلها إلى ضيعته في شكفيتيلي. مُدّت طرق من أجلها، وأُوقفت حركة السير والقطارات، ووُسِّع
    نهر. باع القرويون أشجار الماغنوليا المعمِّرة قرنًا من ساحات منازلهم؛ وجاءت أشجار الدلب المعمِّرة قرنًا
    من قرية كارياتي. احتجّ أنصار البيئة على الضرر الذي لحق بالتربة السطحية والمشهد الطبيعي، وحوّل الفيلم
    الوثائقي «ترويض الحديقة» لسالومي جاشي، الذي عُرض في مهرجان ساندانس عام 2021، العملية كلها إلى حكاية
    رمزية هادئة ومقلقة.


    افتُتحت الحديقة في 15 يوليو 2020، مجانًا، وذُكر أن نحو 250,000 شخص زاروها في أسبوعيها الأولين. تمتد
    اليوم على 60 هكتارًا بين التلال والبحر. تحتوي على أكثر من 200 شجرة منقولة من 29 نوعًا، يقال إن بعضها
    يزيد عمره على ثلاثمائة عام؛ وتُخصَّص 18 هكتارًا للأنواع المتوطنة المنقولة من غرب جورجيا، وحولها تنمو
    أنواع غريبة من خمس قارات — الأوكالبتوس، والسيكويا، والسرو، والأرز، والماغنوليا، وأشجار التوليب. يمر
    مسار واحد عبر نفق كثيف من الخيزران. وفي البحيرة الصناعية في الوسط تقف طيور فلامنغو وردية بين البجع
    وطيور الغاق والكركي الأفريقي؛ وتعيش الليمور والببغاوات والأيائل في حظائر كبيرة، بما مجموعه 58 نوعًا
    من الطيور والحيوانات.


    إن سرت ببطء، لاحظت أغرب شيء. كل عملاق هنا يقف قليلًا بمعزل عن سواه، على مرج نظيف، كضيفٍ في حفلة لم
    يُقدَّم بعدُ لأحد.
  tip: >-
    خصص ساعتين لها، وأكثر مع أطفال لن يبتعدوا عن طيور الفلامنغو. المسارات مستوية وعريضة، سهلة بعربة الطفل
    أو الكرسي المتحرك. جزء كبير من الحديقة مرج مفتوح، فاحمل قبعة في الظهيرة. المقهى والمراحيض عند المدخل.
    كان الدخول مجانيًا عند افتتاح الحديقة عام 2020؛ ووردت منذ ذلك الحين معلومات متضاربة عن شروط الدخول،
    فتحقق قبل الذهاب. الصباح أهدأ والحيوانات أكثر نشاطًا؛ وبعد ظهر الصيف يجلب حرًّا وطوابير. لا تُطعم
    الحيوانات، وأعطِ الأشجار المنقولة حيّزها — فكثير منها لا يزال يستقر في أرضه الجديدة.
  route: >-
    من تبليسي نحو 322 كم، أي نحو أربع ساعات وخمس وأربعين دقيقة. اتخذ الطريق S1 (E60) غربًا مرورًا بكوتايسي
    حتى سامتريديا، ثم الطريق S12 عبر لانتشخوتي حتى غريغوليتي على الساحل، وانعطف جنوبًا إلى S2. مرّ بأوريكي:
    يقع مدخل الحديقة بين أوريكي وشكفيتيلي، وتدلّ عليه لافتات من الطريق الرئيسي، وموقف سيارات عند البوابة.
    الطريق مُعبَّد بالكامل، وتكفي سيارة اقتصادية. الوقود متوفر في لانتشخوتي وأوريكي. في عطلات نهاية الأسبوع
    صيفًا، خصص وقتًا إضافيًا لطريق الساحل.
