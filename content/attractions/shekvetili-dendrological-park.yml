ka:
  name: შეკვეთილის დენდროლოგიური პარკი
  short: >-
    ზღვისპირა პარკი ურეკის გვერდით, სადაც ასწლოვანი ხეები საქართველოს სხვადასხვა კუთხიდან ამოთხარეს და
    აქ გადმორგეს.
  body: >-
    **ეს პარკი ერთი უჩვეულო იდეიდან დაიბადა: ხეები არა დარგეს, არამედ გადმოიყვანეს.** 2016-2020 წლებში
    საქართველოს სხვადასხვა კუთხიდან — აჭარიდან, სამეგრელოდან, გურიიდან — ასწლოვანი ხეები ამოთხარეს, ზღვით
    ან სპეციალური პლატფორმებით გადმოიტანეს და შეკვეთილთან, ურეკის სამხრეთით, ახალ ნიადაგში დარგეს.

    შედეგი უცნაურია და ამის თქმა პატიოსანია: ეს არაა ბუნებრივი ტყე და არც კლასიკური ბოტანიკური ბაღი. ეს
    კოლექციაა — თითოეული ხე ცალკე დგას, გამოკვეთილი, გაზონზე. ზოგი ეგზემპლარი მართლაც შთამბეჭდავია: დიდი
    მაგნოლიები, ევკალიპტები, ტულიპის ხე, ლიბანური კედარი, ხოლო ზოგიერთი ჭადარი ორ საუკუნეზე მეტისაა.

    რაც პარკს რეალურად კარგს ხდის:

    - **მასშტაბი** — ასამდე ჰექტარი, ბილიკები ფართო და თანაბარი, ველოსიპედით და ეტლით სავალი

    - **ზღვის ხედი** — პარკი პირდაპირ სანაპიროზე გამოდის და ბოლოს პლაჟია

    - **ტბები და არხები** ხიდებით, სადაც წყლის ფრინველია

    - **სიმშვიდე** — ურეკის ხმაურის შემდეგ განსხვავება მკვეთრია

    ბავშვისთვის აქ ორი საათი მოსაწყენი შეიძლება იყოს: ატრაქციონები არაა და თამაშის ადგილი მცირეა. ზრდასრულისთვის,
    განსაკუთრებით მცენარეებით დაინტერესებულისთვის, ეს გურიის სანაპიროს ყველაზე მოწესრიგებული სივრცეა.
    გაზაფხულზე მაგნოლიები ყვავის, შემოდგომაზე კი ფოთოლი ნელა იცვლება — ზღვისპირა კლიმატში ეს პროცესი დეკემბრამდე
    გრძელდება.
  tip: >-
    ორი საათი. ბილიკები ბრტყელი და განიერია — ეტლი და ეტლიანი ბავშვი ყველგან გადის, ველოსიპედის დაქირავებაც
    შესაძლებელია. ჩრდილი ჯერ არასაკმარისია, ახალგაზრდა ხეები პატარაა: შუადღისას ქუდი აუცილებელია. კაფე
    და ტუალეტი შესასვლელთანაა. ბილეთი ზაფხულში რიგში იყიდება — დილით მოსვლა უფრო მშვიდია.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთისა და გრიგოლეთის გავლით ურეკისკენ — 322 კმ,
    დაახლოებით ოთხი საათი ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია. პარკის შესასვლელი ურეკსა და შეკვეთილს
    შორისაა, ნიშანი მთავარ გზაზე მკაფიოა. დიდი უფასო პარკინგი შესასვლელთანაა. საწვავი ლანჩხუთსა და ურეკშია.
    ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Shekvetili Dendrological Park
  short: A coastal park where century-old trees were transplanted here from all over Georgia.
  body: >-
    **This park came out of one unusual idea: the trees were not planted, they were moved.** Between 2016
    and 2020 mature specimens were lifted from across Georgia — Adjara, Samegrelo, Guria — carried by
    sea or on special platforms, and replanted in new ground near Shekvetili, just south of Ureki.

    The result is strange, and it is honest to say so: this is neither a natural forest nor a classical
    botanical garden. It is a collection. Each tree stands separately, isolated on lawn. Some specimens
    genuinely impress — large magnolias, eucalyptus, a tulip tree, Lebanon cedar, and plane trees that
    are more than two centuries old.

    What actually makes the park good:

    - **Scale** — around a hundred hectares, with wide level paths passable by bicycle or wheelchair

    - **The sea** — the park runs down to the shoreline and ends at a beach

    - **Lakes and channels** crossed by bridges, with waterfowl on them

    - **Quiet** — after the noise of Ureki the contrast is sharp

    For children two hours here can drag: there are no rides and little to climb on. For adults, and especially
    for anyone interested in plants, it is the most carefully kept space on the Gurian coast. Magnolias
    flower in spring, and in autumn the leaf turn is slow — in this maritime climate the process runs
    into December.
  tip: >-
    Two hours. The paths are flat and wide, so wheelchairs and pushchairs go everywhere and bicycles can
    be hired. Shade is still limited because many trees are young, so a hat matters at midday. The cafe
    and toilets are at the entrance. In summer there is a queue at the ticket desk, so a morning visit
    is calmer.
  route: >-
    From Tbilisi take the E60 to Samtredia, then head south through Lanchkhuti and Grigoleti towards Ureki
    — 322 km, about four hours forty-five. The road is asphalt throughout. The park entrance lies between
    Ureki and Shekvetili and the sign on the main road is clear. There is a large free car park at the
    gate. Fuel is available at Lanchkhuti and Ureki. An economy car is entirely sufficient.
ru:
  name: Дендрологический парк Шекветили
  short: Приморский парк рядом с Уреки, куда со всей Грузии перевезли и пересадили взрослые столетние
    деревья.
  body: >-
    **Парк вырос из одной необычной идеи: деревья здесь не сажали, а перевозили.** С 2016 по 2020 год
    взрослые экземпляры выкапывали по всей Грузии — в Аджарии, Самегрело, Гурии, — везли морем или на
    специальных платформах и высаживали в новый грунт у Шекветили, южнее Уреки.

    Результат странный, и честно об этом сказать: это не природный лес и не классический ботанический
    сад. Это коллекция. Каждое дерево стоит отдельно, выделенное на газоне. Отдельные экземпляры действительно
    впечатляют: крупные магнолии, эвкалипты, тюльпанное дерево, ливанский кедр, а некоторым платанам больше
    двух веков.

    Что делает парк по-настоящему хорошим:

    - **Масштаб** — около ста гектаров, дорожки широкие и ровные, проходимы на велосипеде и в коляске

    - **Море** — парк выходит прямо к берегу и заканчивается пляжем

    - **Озёра и каналы** с мостиками, на них водоплавающие птицы

    - **Тишина** — после шума Уреки контраст резкий

    Ребёнку два часа здесь могут показаться долгими: аттракционов нет, лазать почти негде. Взрослому,
    особенно если растения ему интересны, это самое ухоженное пространство на гурийском побережье. Весной
    цветут магнолии, а осенью лист меняется медленно — в приморском климате процесс тянется до декабря.
  tip: >-
    Два часа. Дорожки ровные и широкие, коляска и кресло проходят везде, велосипед можно взять напрокат.
    Тени пока немного, многие деревья молодые, так что в полдень нужна шляпа. Кафе и туалеты у входа.
    Летом у кассы очередь, утренний визит спокойнее.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути и Григолети в сторону Уреки — 322 км, около
    четырёх часов сорока пяти минут. Дорога асфальтированная всю дорогу. Вход в парк находится между Уреки
    и Шекветили, указатель на главной дороге хорошо виден. У ворот большая бесплатная парковка. Заправки
    в Ланчхути и Уреки. Машины эконом-класса вполне достаточно.
fa:
  name: پارک درخت‌شناسی شکوتیلی
  short: پارکی ساحلی که درختان صدساله را از سراسر گرجستان به آن منتقل کرده‌اند.
  body: >-
    **این پارک از یک ایدهٔ نامعمول زاده شد: درختان را نکاشتند، جابه‌جا کردند.** میان ۲۰۱۶ و ۲۰۲۰ نمونه‌های
    بالغ را از سراسر گرجستان — آجارا، سامگرلو، گوریا — بیرون آوردند، با دریا یا سکوهای ویژه حمل کردند
    و در خاکی تازه نزدیک شکوتیلی، اندکی جنوب اورکی، نشاندند.

    نتیجه عجیب است و صادقانه باید گفت: این نه جنگل طبیعی است و نه باغ گیاه‌شناسی کلاسیک. یک مجموعه است.
    هر درخت جدا می‌ایستد، تنها بر چمن. برخی نمونه‌ها واقعاً چشمگیرند: ماگنولیاهای بزرگ، اکالیپتوس، درخت
    لاله، سرو آزاد لبنان، و چنارهایی که بیش از دو سده عمر دارند.

    آنچه پارک را واقعاً خوب می‌کند:

    - **مقیاس** — حدود صد هکتار، با مسیرهای پهن و هموار که با دوچرخه و ویلچر می‌توان پیمود

    - **دریا** — پارک تا خط ساحل پیش می‌رود و به ساحل ختم می‌شود

    - **دریاچه‌ها و آبراه‌ها** با پل‌هایی که پرندگان آبزی بر آن‌ها دیده می‌شوند

    - **سکوت** — پس از هیاهوی اورکی تضاد تند است

    برای کودکان دو ساعت اینجا ممکن است کش بیاید: سرگرمی و وسیلهٔ بازی چندانی نیست. برای بزرگ‌سالان، به‌ویژه
    کسانی که به گیاه علاقه دارند، این مرتب‌ترین فضای ساحل گوریاست. بهار ماگنولیاها گل می‌دهند و پاییز
    برگ‌گردانی کند است؛ در این آب‌وهوای دریایی تا آذر ادامه می‌یابد.
  tip: >-
    دو ساعت. مسیرها هموار و پهن‌اند، ویلچر و کالسکه همه‌جا می‌روند و دوچرخه هم کرایه می‌دهند. سایه هنوز
    کم است چون بسیاری از درختان جوان‌اند، پس ظهرها کلاه لازم است. کافه و سرویس بهداشتی کنار ورودی است.
    تابستان جلوی گیشه صف می‌بندد، پس بازدید صبحگاهی آرام‌تر است.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی و گریگولتی به سوی اورکی — ۳۲۲ کیلومتر، حدود
    چهار ساعت و چهل‌وپنج دقیقه. جاده سرتاسر آسفالت است. ورودی پارک میان اورکی و شکوتیلی است و تابلوی جادهٔ
    اصلی روشن است. کنار دروازه پارکینگ بزرگ رایگان هست. سوخت در لانچخوتی و اورکی. خودروی اقتصادی کاملاً
    کافی است.
he:
  name: הפארק הדנדרולוגי של שקווטילי
  short: פארק חופי שאליו הועתקו עצים בני מאה שנה מכל רחבי גאורגיה.
  body: >-
    **הפארק נולד מרעיון חריג אחד: את העצים לא נטעו כאן אלא הובילו לכאן.** בין 2016 ל-2020 נעקרו פרטים
    בוגרים מכל רחבי גאורגיה — מאג׳ריה, מסמגרלו, מגוריה — הועברו בים או על משטחים מיוחדים, ונשתלו באדמה
    חדשה ליד שקווטילי, מעט מדרום לאורקי.

    התוצאה מוזרה, וכדאי לומר זאת בכנות: זה אינו יער טבעי ואינו גן בוטני קלאסי. זהו אוסף. כל עץ עומד לעצמו,
    מבודד על מדשאה. חלק מן הפרטים באמת מרשימים — מגנוליות גדולות, אקליפטוסים, עץ טוליפ, ארז הלבנון, ודולבים
    בני יותר ממאתיים שנה.

    מה שהופך את הפארק לטוב באמת:

    - **קנה מידה** — כמאה הקטרים, שבילים רחבים ומישוריים שעוברים בהם באופניים ובכיסא גלגלים

    - **הים** — הפארק יורד עד קו החוף ומסתיים בחוף רחצה

    - **אגמים ותעלות** עם גשרים ועליהם עופות מים

    - **שקט** — אחרי הרעש של אורקי הניגוד חד

    לילדים שעתיים כאן עלולות להימשך: אין מתקנים ואין הרבה לטפס עליו. למבוגרים, ובמיוחד למי שמתעניין בצמחים,
    זהו החלל המטופח ביותר בחוף גוריה. באביב פורחות המגנוליות, ובסתיו החלפת העלווה איטית — באקלים הימי
    הזה התהליך נמשך עד דצמבר.
  tip: >-
    שעתיים. השבילים מישוריים ורחבים, כיסאות גלגלים ועגלות עוברים בכל מקום ואפשר לשכור אופניים. הצל עדיין
    מוגבל כי עצים רבים צעירים, ולכן כובע חשוב בצהריים. בית הקפה והשירותים בכניסה. בקיץ יש תור בקופה, אז
    ביקור בבוקר רגוע יותר.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי וגריגולטי לכיוון אורקי — 322 ק״מ, כארבע שעות
    וארבעים וחמש. הכביש סלול לכל האורך. הכניסה לפארק בין אורקי לשקווטילי והשילוט על הכביש הראשי ברור.
    ליד השער חניון גדול חינם. תדלוק בלנצ׳חותי ובאורקי. רכב חסכוני מספיק לחלוטין.
ar:
  name: حديقة شيكفيتيلي للأشجار
  short: حديقة ساحلية نُقلت إليها أشجار عمرها قرن من كل أنحاء جورجيا.
  body: >-
    **وُلدت هذه الحديقة من فكرة غير معتادة: الأشجار لم تُزرع هنا بل نُقلت.** بين 2016 و2020 اقتُلعت أشجار
    بالغة من أنحاء جورجيا — أجاريا وسامغريلو وغوريا — وحُملت بحراً أو على منصات خاصة، وأُعيد غرسها في
    تربة جديدة قرب شيكفيتيلي، جنوب أوريكي بقليل.

    والنتيجة غريبة، ومن الأمانة قول ذلك: هذه ليست غابة طبيعية ولا حديقة نباتية كلاسيكية. إنها مجموعة.
    كل شجرة تقف وحدها معزولة على العشب. وبعض القطع مبهر فعلاً: أشجار ماغنوليا كبيرة وكينا وشجرة التوليب
    وأرز لبنان، ودلب تجاوز عمره قرنين.

    وما يجعل الحديقة جيدة حقاً:

    - **الحجم** — نحو مئة هكتار، بممرات عريضة مستوية تصلح للدراجة ولكرسي متحرك

    - **البحر** — تنزل الحديقة حتى خط الساحل وتنتهي إلى شاطئ

    - **بحيرات وقنوات** تعبرها جسور وتحط عليها طيور مائية

    - **الهدوء** — بعد ضجيج أوريكي يكون التباين حاداً

    وللأطفال قد تطول ساعتان هنا: لا ألعاب ولا ما يُتسلق. أما للكبار، وخاصة المهتمين بالنبات، فهذا أكثر
    فضاء معتنى به على ساحل غوريا. تُزهر الماغنوليا ربيعاً، وفي الخريف يتبدل الورق ببطء؛ ففي هذا المناخ
    البحري تمتد العملية حتى ديسمبر.
  tip: >-
    ساعتان. الممرات مستوية عريضة، وكراسي المقعدين وعربات الأطفال تمر في كل مكان، وتتوفر دراجات للإيجار.
    الظل ما زال قليلاً لأن كثيراً من الأشجار فتية، فالقبعة مهمة ظهراً. المقهى ودورات المياه عند المدخل.
    وفي الصيف يوجد طابور عند شباك التذاكر، فالزيارة الصباحية أهدأ.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي وغريغوليتي نحو أوريكي — 322 كم، نحو أربع
    ساعات وخمس وأربعين دقيقة. الطريق معبّد كله. ومدخل الحديقة بين أوريكي وشيكفيتيلي واللافتة على الطريق
    الرئيسي واضحة. وعند البوابة موقف كبير مجاني. الوقود في لانتشخوتي وأوريكي. وسيارة اقتصادية تكفي تماماً.
