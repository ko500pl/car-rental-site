ka:
  name: საჩხერე
  short: >-
    ყვირილის ხეობის პატარა ქალაქი წერეთლების ციხით, 1907 წლის ქვის სადგურით, გაჩერებული საბაგიროთი და
    საბჭოური მოზაიკებით.
  body: >-
    **ძლივს ხუთიათასიანმა ქალაქმა ფაგოთერაპიის ერთ-ერთი ფუძემდებელი გიორგი ელიავა, ძალოსნობის ორი ოლიმპიური
    ჩემპიონი და ციხე მოგვცა, რომელიც, გადმოცემით, საცოლის მოსაპოვებლად აშენდა.**


    საჩხერე ყვირილის ხეობაში, ძველ გზაზე დგას, რომელიც ლიხის ქედს კვეთდა და ქართლს იმერეთთან აკავშირებდა.
    XV საუკუნის ბოლოდან მიწები წერეთლებს ეკუთვნოდა, XVII საუკუნის დასაწყისში კი შაჰ-აბასს გამოქცეულმა
    მეფეებმა, თეიმურაზ I-მა და ლუარსაბ II-მ, აქ, წერეთლებთან პოვეს თავშესაფარი.


    1880 წელს 1034 მცხოვრებიდან 628 ქართველი ებრაელი იყო. 1878 წელს ცხრა მათგანი „სისხლის ცილისწამების“
    საფუძველზე დააპატიმრეს — ბრალად მეზობელი სოფლის ქრისტიანი გოგონას მკვლელობა დასდეს. 1879 წლის მარტში
    ქუთაისის საოლქო სასამართლოში ადვოკატებმა, პეტრე ალექსანდროვმა, ლევ კუპერნიკმა და მოსე კიკოძემ, ცრუ
    ჩვენებები ამხილეს და ყველა ბრალდებული გამართლდა.


    ქალაქს ქედზე მოდინახეს ციხე დაჰყურებს. გადმოცემით, დავით აბაშიძემ ქალიშვილის მიცემაზე პაპუნა წერეთელს
    უარი უთხრა — ციხე არ გაქვსო. პაპუნამ XVIII საუკუნის 30-იან წლებში ციხე ააშენა და სასიმამროს შეუთვალა:
    „მოდი, ნახე“. ციხემ 1735 წელს ალექსანდრე V-ის ალყებს გაუძლო, 1766 წელს სოლომონ I შეიფარა და მხოლოდ
    ერთხელ, 1810 წელს, ჩავარდა რუსების ხელში, როცა მეციხოვნეებს სურსათი გამოელიათ. 1991 წლის მიწისძვრის
    შემდეგ ციხე აღადგინეს, სამუშაოები 2019 წელს დასრულდა.


    ქვემოთ, ქალაქში, ელისაბედ წერეთლის შემოწირულობით აგებული 1907 წლის სიმეტრიული ქვის სადგური დგას; ბრუტალისტური
    შენობა, საიდანაც საბაგირო ოდესღაც ციხისკენ ადიოდა, დიდი ხანია უმოქმედოა. ყოფილ ბენზინგასამართ სადგურზე
    მოზაიკაში ძველი ავტომობილები და ჩირაღდნიანი ხელია გამოსახული, ყვირილის გაღმა, ბამბის ძველ ფაბრიკაზე
    კი შვიდპანელიანი მოზაიკაა — ბამბის ბუჩქები და ეროვნულ სამოსში გამოწყობილი ადამიანები. ერთ ნაშუადღევს
    საჩხერე სამ საუკუნეს გაგატარებთ და არც ერთს არ აქცევს სავიტრინო ექსპონატად.
  tip: >-
    მანქანა ცენტრში დატოვეთ და ფეხით იარეთ: სადგური, საბაგიროს შენობა და ორივე მოზაიკა ქუჩიდან მოჩანს
    და უფასოა; ბამბის ფაბრიკა მდინარის გაღმაა. მოდინახე ციცაბო ქედზე დგას, ამიტომ მასზე ასასვლელად ცალკე
    დრო და კარგი ფეხსაცმელი გჭირდებათ — ბილიკის ამჟამინდელი მდგომარეობა ადგილზე იკითხეთ. საწვავი, კაფეები
    და მაღაზიები ქალაქშია. საჩხერე ჭიათურის (11 კმ) საბაგიროებთან და ჯრუჭის მონასტრის ნანგრევებთან (დაახლოებით
    13 კმ) ერთად დაგეგმეთ — სამივე ერთ დღეში ეტევა. ქალაქი მთელი წლის განმავლობაში მისაწვდომია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ იარეთ; გორისა და ქარელის შემდეგ, დაახლოებით 115 კილომეტრში,
    აგარასთან შ22 გზაზე გადაუხვიეთ, გომის გავლით ჩრდილო-დასავლეთისკენ. გზა ლიხის ქედის ჩრდილოეთ განშტოებებს
    კვეთს და ყვირილის ხეობაში ეშვება — დაახლოებით 55 კილომეტრი. სულ დაახლოებით 173 კილომეტრი და 2 საათი
    და 40 წუთი, ბოლომდე ასფალტით. ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავი ქარელში, ხაშურში ან
    თავად საჩხერეში ჩაასხით. დასავლეთიდან, ზესტაფონიდან და ჭიათურიდანაც იმავე შ22-ით მიხვალთ — ეს ვარიანტი
    ჭიათურასთან ერთად მოგზაურობისთვის მოსახერხებელია.
en:
  name: Sachkhere
  short: >-
    A small Kvirila-valley town with a Tsereteli castle, a 1907 stone railway station, an idle Soviet
    cable car and bold industrial mosaics.
  body: >-
    **For a town of barely five thousand people, Sachkhere has produced the phage-therapy pioneer George
    Eliava, two Olympic weightlifting champions and a castle built, so the story goes, to win a bride.**


    The town sits in the Kvirila valley on the old road that crossed the Likhi Range between Kartli and
    Imereti. From the end of the 15th century the land belonged to the Tsereteli princes, and early in
    the 17th century Kings Teimuraz I and Luarsab II, fleeing Shah Abbas, sheltered here with them.


    In 1880, 628 of the town's 1,034 people were Georgian Jews. In 1878 nine of them were arrested on
    a blood libel, accused of murdering a Christian girl from a nearby village. At the Kutaisi Circuit
    Court in March 1879, the defence lawyers Pyotr Aleksandrov, Lev Kupernik and Moisei Kikodze exposed
    the false testimony, and every defendant was acquitted.


    Modinakhe Castle watches from a ridge above town. Tradition says David Abashidze refused Papuna Tsereteli
    his daughter because he had no castle; Papuna built one in the 1730s and sent word: 'modi, nakhe'
    — come and see. It held out against King Alexander V's repeated attempts in 1735, sheltered Solomon
    I in 1766, and fell only once, to Russian troops in 1810, when its defenders ran out of food. Its
    restoration after the 1991 earthquake ended in 2019.


    Down in town stand a symmetrical cut-stone railway station of 1907, funded by Elisabeth Tsereteli,
    and the idle Brutalist station of a cable car that once climbed to the castle. A former petrol station
    wears a mosaic of vintage cars and a hand holding a torch; across the Kvirila, the old cotton factory
    carries seven panels of cotton plants and figures in traditional dress. In a single afternoon Sachkhere
    walks you through three centuries and makes a showpiece of none of them.
  tip: >-
    Park in the centre and walk: the station, the cable-car building and both mosaics are seen from the
    street, free of charge; the cotton factory is across the river. Modinakhe stands on a steep ridge,
    so allow separate time and wear proper shoes for it — ask locally about the current state of the path.
    Fuel, cafés and shops are in town. Pair Sachkhere with the Chiatura cable cars (11 km) and the ruins
    of Jruchi Monastery (about 13 km); all three fit comfortably into one day. The town is accessible
    all year.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Kareli; after about 115 km, near Agara, turn onto
    the Sh22 and head north-west through Gomi. The road crosses the northern spurs of the Likhi Range
    and drops into the Kvirila valley — about 55 km. In all, about 173 km and 2 hours 40 minutes, paved
    throughout, so an economy car is entirely adequate. Fuel is available in Kareli, Khashuri and Sachkhere
    itself. You can also arrive from the west on the same Sh22 via Zestaponi and Chiatura — the better
    choice if Chiatura is on your list.
ru:
  name: Сачхере
  short: >-
    Небольшой город в долине Квирилы: замок Церетели, каменный вокзал 1907 года, застывшая советская канатная
    дорога и смелые индустриальные мозаики.
  body: >-
    **Для городка, где живёт едва ли пять тысяч человек, Сачхере дал миру немало: пионера фаготерапии
    Георгия Элиаву, двух олимпийских чемпионов по тяжёлой атлетике и замок, построенный, как гласит предание,
    ради невесты.**


    Город лежит в долине Квирилы, на старой дороге, что вела через Лихский хребет из Картли в Имеретию.
    С конца XV века эти земли принадлежали князьям Церетели, а в начале XVII века у них укрывались цари
    Теймураз I и Луарсаб II, бежавшие от шаха Аббаса.


    В 1880 году из 1034 жителей города 628 были грузинскими евреями. В 1878 году девятерых из них арестовали
    по кровавому навету, обвинив в убийстве девочки-христианки из соседнего села. В марте 1879 года в
    Кутаисском окружном суде защитники Пётр Александров, Лев Куперник и Моисей Кикодзе разоблачили лжесвидетельства,
    и все подсудимые были оправданы.


    С гребня над городом за ним присматривает замок Модинахе. Предание гласит, что Давид Абашидзе отказал
    Папуне Церетели в руке дочери, потому что у того не было замка; в 1730-х годах Папуна построил замок
    и послал весть: «моди, нахе» — «приди и посмотри». Замок в 1735 году устоял перед неоднократными попытками
    царя Александра V взять его, приютил Соломона I в 1766-м и пал лишь однажды — в 1810 году, перед русскими
    войсками, когда у защитников кончилось продовольствие. Его реставрация после землетрясения 1991 года
    завершилась в 2019-м.


    Внизу, в городе, стоят симметричный вокзал 1907 года из тёсаного камня, построенный на средства Елизаветы
    Церетели, и заброшенная бруталистская станция канатной дороги, которая когда-то поднималась к замку.
    Бывшую автозаправку украшает мозаика со старинными автомобилями и рукой, сжимающей факел; за Квирилой
    на старой хлопчатобумажной фабрике — семь панно с хлопчатником и фигурами в национальных костюмах.
    За полдня Сачхере проведёт вас через три столетия и ни одно из них не выставит напоказ.
  tip: >-
    Оставьте машину в центре и гуляйте пешком: вокзал, здание канатной дороги и обе мозаики видны с улицы
    и бесплатно; хлопчатобумажная фабрика — на другом берегу реки. Модинахе стоит на крутом гребне, так
    что выделите на него отдельное время и наденьте хорошую обувь, а о нынешнем состоянии тропы спросите
    у местных. Топливо, кафе и магазины есть в городе. Совместите Сачхере с канатными дорогами Чиатуры
    (11 км) и руинами монастыря Джручи (около 13 км): все три места спокойно укладываются в один день.
    Город доступен круглый год.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Гори и Карели; примерно через 115 км, у Агары,
    сверните на Sh22 и держите на северо-запад через Гоми. Дорога пересекает северные отроги Лихского
    хребта и спускается в долину Квирилы — это около 55 км. Всего около 173 км и 2 часа 40 минут, асфальт
    на всём протяжении, так что автомобиля эконом-класса вполне достаточно. Заправиться можно в Карели,
    Хашури и в самом Сачхере. Можно приехать и с запада по той же Sh22 через Зестафони и Чиатуру — лучший
    вариант, если Чиатура есть в ваших планах.
fa:
  name: ساچخره
  short: >-
    شهرکی کوچک در درهٔ کویریلا با قلعهٔ خاندان تسرتلی، ایستگاه راه‌آهن سنگی ۱۹۰۷، تله‌کابین خاموش دوران
    شوروی و موزاییک‌های صنعتیِ جسورانه.
  body: >-
    **ساچخره، شهرکی با جمعیتی به‌زحمت پنج هزار نفر، به جهان گئورگی الیاوا، پیشگام فاژدرمانی، دو قهرمان
    المپیک وزنه‌برداری و قلعه‌ای داده است که به روایت داستان‌ها برای به دست آوردن یک عروس ساخته شد.**


    شهر در درهٔ کویریلا، بر سر راه کهنی است که از رشته‌کوه لیخی می‌گذشت و کارتلی را به ایمرتی می‌پیوست.
    از اواخر سدهٔ پانزدهم، این سرزمین از آنِ شاهزادگان تسرتلی بود و در آغاز سدهٔ هفدهم، شاهان تیموراز
    یکم و لوارساب دوم که از برابر شاه عباس می‌گریختند، نزد آنان پناه گرفتند.


    در سال ۱۸۸۰، از ۱۰۳۴ تن ساکنان شهر، ۶۲۸ نفر یهودیان گرجی بودند. در سال ۱۸۷۸ نُه تن از آنان در پی یک
    «افترای خون» دستگیر شدند و به قتل دختری مسیحی از روستایی در همان نزدیکی متهم گشتند. در مارس ۱۸۷۹،
    در دادگاه ناحیه‌ای کوتایسی، وکیلان مدافع — پیوتر الکساندروف، لف کوپرنیک و مویسی کیکودزه — شهادت‌های
    دروغ را برملا کردند و همهٔ متهمان تبرئه شدند.


    قلعهٔ مودیناخه از فراز یالی بر شهر نظاره می‌کند. روایت است که داوید آباشیدزه از دادن دخترش به پاپونا
    تسرتلی سر باز زد، چون پاپونا قلعه‌ای نداشت؛ پاپونا در دههٔ ۱۷۳۰ قلعه‌ای ساخت و پیغام فرستاد: «مودی،
    ناخه» — یعنی «بیا و ببین». قلعه در سال ۱۷۳۵ در برابر حمله‌های پیاپی شاه الکساندر پنجم ایستادگی کرد،
    در ۱۷۶۶ به سولومون یکم پناه داد و تنها یک بار سقوط کرد: در سال ۱۸۱۰ به دست سپاهیان روس، زمانی که آذوقهٔ
    مدافعانش ته کشید. مرمت آن پس از زمین‌لرزهٔ ۱۹۹۱، در سال ۲۰۱۹ به پایان رسید.


    پایین‌تر، در خود شهر، ایستگاه راه‌آهنی متقارن از سنگ تراش‌خورده به سال ۱۹۰۷ برپاست که هزینه‌اش را
    الیزابت تسرتلی پرداخت، و در کنارش ایستگاه بی‌کار و بروتالیستِ تله‌کابینی که روزگاری تا قلعه بالا می‌رفت.
    پمپ‌بنزینی قدیمی موزاییکی از خودروهای کلاسیک و دستی مشعل‌به‌دست بر تن دارد؛ آن سوی کویریلا، کارخانهٔ
    قدیمی پنبه هفت تابلو با نقش بوته‌های پنبه و پیکره‌هایی در جامهٔ سنتی بر دیوار دارد. ساچخره در یک بعدازظهر
    شما را از میان سه سده عبور می‌دهد و هیچ‌یک را به ویترین بدل نمی‌کند.
  tip: >-
    خودرو را در مرکز شهر پارک کنید و پیاده راه بیفتید: ایستگاه راه‌آهن، ساختمان تله‌کابین و هر دو موزاییک
    از خیابان و رایگان دیده می‌شوند؛ کارخانهٔ پنبه آن سوی رودخانه است. مودیناخه بر یالی پرشیب ایستاده
    است، پس برایش وقت جداگانه بگذارید و کفش مناسب بپوشید — دربارهٔ وضعیت کنونی مسیر از اهالی بپرسید. سوخت،
    کافه و فروشگاه در شهر هست. ساچخره را با تله‌کابین‌های چیاتورا (۱۱ کیلومتر) و ویرانه‌های صومعهٔ جروچی
    (حدود ۱۳ کیلومتر) همراه کنید؛ هر سه به‌راحتی در یک روز جا می‌شوند. شهر در تمام سال در دسترس است.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب و از کنار گوری و کارلی بروید؛ پس از حدود ۱۱۵ کیلومتر، نزدیک آگارا،
    به جادهٔ Sh22 بپیچید و از راه گومی به سمت شمال‌غرب ادامه دهید. جاده از شاخه‌های شمالی رشته‌کوه لیخی
    می‌گذرد و به درهٔ کویریلا فرود می‌آید — حدود ۵۵ کیلومتر. روی‌هم حدود ۱۷۳ کیلومتر و ۲ ساعت و ۴۰ دقیقه،
    سراسر آسفالت، پس خودروی اقتصادی کاملاً کافی است. سوخت در کارلی، خاشوری و خود ساچخره پیدا می‌شود. از
    غرب هم می‌توانید از همین Sh22 و از راه زستافونی و چیاتورا برسید — انتخابی بهتر اگر چیاتورا در برنامه‌تان
    است.
he:
  name: סאצ'חרה
  short: >-
    עיירה קטנה בעמק הקווירילה: טירה של בית צרתלי, תחנת רכבת מאבן משנת 1907, רכבל סובייטי מושבת ופסיפסים
    תעשייתיים נועזים.
  body: >-
    **סאצ'חרה, עיירה של בקושי חמשת אלפים תושבים, הוציאה מתוכה הרבה: את גיאורגי אליאבה, מחלוצי הטיפול בפאגים,
    שני אלופים אולימפיים בהרמת משקולות, וטירה שנבנתה — כך מספרים — כדי לזכות בכלה.**


    העיירה שוכנת בעמק הקווירילה, על הדרך העתיקה שחצתה את רכס ליחי בין קרטלי לאימרתי. מסוף המאה ה-15 הייתה
    האדמה בידי נסיכי בית צרתלי, ובראשית המאה ה-17 מצאו כאן מחסה אצלם המלכים טיימוראז הראשון ולוארסאב השני,
    שנמלטו מפני שאה עבאס.


    בשנת 1880 היו 628 מתוך 1,034 תושבי העיירה יהודים גאורגים. ב-1878 נעצרו תשעה מהם בעקבות עלילת דם: הם
    הואשמו ברצח ילדה נוצרייה מכפר סמוך. במרץ 1879, בבית המשפט המחוזי בקותאיסי, חשפו עורכי הדין של ההגנה
    — פיוטר אלכסנדרוב, לב קופרניק ומויסיי קיקודזה — את עדויות השקר, וכל הנאשמים זוכו.


    טירת מודינאחה משקיפה על העיירה מרכס שמעליה. המסורת מספרת שדוד אבשידזה סירב לתת לפאפונה צרתלי את בתו
    משום שלא הייתה לו טירה; בשנות ה-1730 בנה פאפונה טירה ושלח הודעה: "מודי, נאחה" — בוא וראה. הטירה עמדה
    ב-1735 בניסיונותיו החוזרים של המלך אלכסנדר החמישי לכבוש אותה, נתנה מחסה לסולומון הראשון ב-1766, ונפלה
    פעם אחת בלבד — בידי כוחות רוסיים ב-1810, כשאזל המזון למגיניה. שיקומה לאחר רעידת האדמה של 1991 הסתיים
    ב-2019.


    למטה, בעיירה עצמה, עומדות תחנת רכבת סימטרית מאבן מסותתת משנת 1907, שמימנה אליזבת צרתלי, ותחנה ברוטליסטית
    מושבתת של רכבל שטיפס פעם אל הטירה. תחנת דלק לשעבר עוטה פסיפס של מכוניות וינטג' ויד האוחזת לפיד; מעבר
    לקווירילה נושא מפעל הכותנה הישן שבעה לוחות של צמחי כותנה ודמויות בלבוש מסורתי. באחר צהריים אחד מוליכה
    אתכם סאצ'חרה דרך שלוש מאות שנה, ואינה הופכת אף אחת מהן לראווה.
  tip: >-
    חנו במרכז והמשיכו ברגל: התחנה, מבנה הרכבל ושני הפסיפסים נראים מהרחוב, ללא תשלום; מפעל הכותנה נמצא
    בגדה שמעבר לנהר. מודינאחה ניצבת על רכס תלול, לכן הקדישו לה זמן נפרד ונעלו נעליים מתאימות — ושאלו את
    המקומיים על מצבו הנוכחי של השביל. דלק, בתי קפה וחנויות יש בעיירה. שלבו את סאצ'חרה עם הרכבלים של צ'יאטורה
    (11 ק"מ) ועם חורבות מנזר ג'רוצ'י (כ-13 ק"מ); שלושתם נכנסים בנוחות ביום אחד. העיירה נגישה כל השנה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי וקארלי; אחרי כ-115 ק"מ, ליד אגארה, פנו לכביש Sh22 והמשיכו
    צפון-מערבה דרך גומי. הכביש חוצה את השלוחות הצפוניות של רכס ליחי ויורד אל עמק הקווירילה — כ-55 ק"מ.
    בסך הכול כ-173 ק"מ ו-2 שעות ו-40 דקות, סלול לכל אורכו, כך שרכב אקונומי מספיק בהחלט. דלק יש בקארלי,
    בחשורי ובסאצ'חרה עצמה. אפשר להגיע גם ממערב, באותו כביש Sh22 דרך זסטפוני וצ'יאטורה — הבחירה הטובה יותר
    אם צ'יאטורה ברשימה שלכם.
ar:
  name: ساتشخيري
  short: >-
    بلدة صغيرة في وادي كفيريلا: قلعة لآل تسيريتيلي، ومحطة قطار حجرية من عام 1907، وتلفريك سوفيتي متوقف،
    وفسيفساء صناعية جريئة.
  body: >-
    **على صِغرها — فلا يكاد سكانها يبلغون خمسة آلاف — أنجبت ساتشخيري الكثير: رائد العلاج بالعاثيات جورج
    إليافا، وبطلين أولمبيين في رفع الأثقال، وقلعة بُنيت، كما تقول الحكاية، للفوز بعروس.**


    تقع البلدة في وادي كفيريلا على الطريق القديم الذي كان يعبر سلسلة جبال ليخي بين كارتلي وإيميريتي. ومنذ
    أواخر القرن الخامس عشر كانت الأرض ملكًا لأمراء آل تسيريتيلي، وفي مطلع القرن السابع عشر لجأ إليهم هنا
    الملكان تيموراز الأول ولوارساب الثاني فرارًا من الشاه عباس.


    في عام 1880 كان 628 من سكان البلدة البالغ عددهم 1034 نسمة من اليهود الجورجيين. وفي عام 1878 اعتُقل
    تسعة منهم بـ«فرية الدم»، إذ اتُّهموا بقتل فتاة مسيحية من قرية مجاورة. وفي مارس 1879، أمام محكمة دائرة
    كوتايسي، كشف محامو الدفاع بيوتر ألكسندروف وليف كوبرنيك ومويسي كيكودزه زيف الشهادات، فبُرّئ جميع المتهمين.


    تطلّ قلعة موديناخي على البلدة من فوق حافة جبلية. تقول الرواية إن داود أباشيدزه رفض أن يزوّج ابنته
    من بابونا تسيريتيلي لأنه لا يملك قلعة؛ فبنى بابونا قلعة في ثلاثينيات القرن الثامن عشر وأرسل إليه:
    «مودي، ناخي»، أي «تعالَ وانظر». صمدت القلعة عام 1735 أمام محاولات الملك ألكسندر الخامس المتكرّرة للاستيلاء
    عليها، وآوت سولومون الأول عام 1766، ولم تسقط إلا مرة واحدة، على يد القوات الروسية عام 1810، حين نفد
    الطعام لدى المدافعين عنها. واكتمل ترميمها بعد زلزال 1991 في عام 2019.


    وفي البلدة نفسها تقوم محطة قطار متناظرة من الحجر المنحوت تعود إلى عام 1907، موّلتها إليزابيث تسيريتيلي،
    ومحطة متوقفة على الطراز الوحشي (البروتالي) لتلفريك كان يصعد يومًا إلى القلعة. وتكتسي محطة وقود سابقة
    بفسيفساء لسيارات عتيقة ويدٍ تحمل شعلة؛ وعلى الضفة الأخرى من كفيريلا يحمل مصنع القطن القديم سبع لوحات
    لنباتات القطن وشخصيات بالزي التقليدي. في نصف نهار تأخذك ساتشخيري عبر ثلاثة قرون، دون أن تجعل من أيٍّ
    منها عرضًا للتباهي.
  tip: >-
    اركن السيارة في الوسط وتجوّل سيرًا على الأقدام: المحطة ومبنى التلفريك ولوحتا الفسيفساء تُرى كلها من
    الشارع مجانًا؛ أما مصنع القطن فعلى الضفة المقابلة للنهر. تقف موديناخي على حافة شديدة الانحدار، فخصّص
    لها وقتًا مستقلًا وارتدِ حذاءً مناسبًا، واسأل السكان عن حالة الممر حاليًا. الوقود والمقاهي والمتاجر
    متوفرة في البلدة. اجمع ساتشخيري مع تلفريكات تشياتورا (11 كم) وأطلال دير جروتشي (نحو 13 كم)؛ فالثلاثة
    تتسع لها رحلة يوم واحد بسهولة. البلدة متاحة للزيارة طوال العام.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وكاريلي؛ وبعد نحو 115 كم، قرب أغارا، انعطف إلى الطريق
    Sh22 واتجه شمالًا غربًا عبر غومي. يعبر الطريق النتوءات الشمالية لسلسلة ليخي ثم ينحدر إلى وادي كفيريلا،
    في نحو 55 كم. المسافة الإجمالية نحو 173 كم وساعتين و40 دقيقة، والطريق معبّد بالكامل، لذا تكفي سيارة
    اقتصادية تمامًا. يتوفر الوقود في كاريلي وخاشوري وفي ساتشخيري نفسها. ويمكنك الوصول أيضًا من الغرب عبر
    الطريق Sh22 نفسه مرورًا بزيستافوني وتشياتورا، وهو الخيار الأفضل إن كانت تشياتورا ضمن خطتك.
