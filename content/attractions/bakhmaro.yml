ka:
  name: ბახმარო
  short: ხის აგარაკებიანი მთის კურორტი 1950 მეტრზე, სადაც მთის და ზღვის ჰაერი ერთმანეთს ხვდება — მხოლოდ
    ზაფხულში.
  body: >-
    ბახმარო გურიის მთიანეთში, დაახლოებით 1950 მეტრის სიმაღლეზე მდებარე კლიმატური კურორტია. მისი უჩვეულო
    რეპუტაცია ჰაერზეა აგებული: ბახმარო შავი ზღვიდან სულ რამდენიმე ათეულ კილომეტრშია და ამავე დროს მაღალმთიან
    ზონაშია, ამიტომ აქ ზღვის ნოტიო და მთის მშრალი ჰაერი ერთმანეთს ერევა. საბჭოთა პერიოდიდან მოყოლებული
    აქ სასუნთქი გზების პრობლემების მქონე ადამიანებს აგზავნიდნენ და ეს ტრადიცია დღემდე შემორჩა.


    კურორტს არქიტექტურაც განსხვავებული აქვს — ეს არ არის სასტუმროების ქალაქი, არამედ ხის, ხშირად ბოძებზე
    შემდგარი აგარაკების გაფანტული დასახლება ღია ფერდობებზე. ზამთარში ბახმარო პრაქტიკულად ცარიელია: აქ
    თოვლი მეტრობით დევს და გზა იკეტება. სიცოცხლე ივლისში იწყება და სექტემბრის დასაწყისში მთავრდება.


    რაზეც უნდა იცოდეთ:


    - **სეზონი მოკლეა** — რეალურად ივლისი და აგვისტო, ივნისის ბოლო და სექტემბრის დასაწყისი პირობითად

    - **გზა უხეშია** — ბოლო ათეულობით კილომეტრი გრუნტია, წვიმის შემდეგ კი მძიმდება

    - **სერვისი მოკრძალებულია** — რამდენიმე კაფე, საოჯახო სასტუმროები, ბანკომატის გარეშე


    აგვისტოში აქ ცხენების ტრადიციული დოღი იმართება, რომელიც რეგიონის ერთ-ერთი ყველაზე ცნობილი ღონისძიებაა
    და დასახლებას მკვეთრად ავსებს.
  tip: >-
    ჩამოსვლა მხოლოდ ზაფხულში დაგეგმეთ და ღამის გასათევი წინასწარ დაჯავშნეთ — აგვისტოში, განსაკუთრებით
    დოღის კვირას, თავისუფალი ადგილი პრაქტიკულად არ რჩება. ღამით აქ 1950 მეტრზე სიცივეა ზაფხულშიც, ამიტომ
    თბილი ტანსაცმელი აუცილებელია. ბანკომატი და აფთიაქი არ არის: ნაღდი ფული და საჭირო მედიკამენტები წინასწარ
    აიღეთ. საწვავი ბოლოს ჩოხატაურში ან ოზურგეთშია. მობილური კავშირი არასტაბილურია, ამიტომ მარშრუტი ოფლაინ
    რუკაზე ჩამოტვირთეთ.
  route: >-
    თბილისიდან ბახმარომდე დაახლოებით 355 კმ და ექვსნახევარი საათია. E60-ით მიდიხართ დასავლეთისკენ ხაშურის,
    რიკოთის მაგისტრალის, ქუთაისისა და სამტრედიის გავლით, შემდეგ ჩოხატაურზე უხვევთ. სწორედ ჩოხატაურიდან
    იწყება მთავარი მონაკვეთი — დაახლოებით 50 კმ მთის გრუნტოვანი გზა, რომელიც ციცაბოა, ვიწრო და ორმოებით
    სავსე; მას ორ-სამ საათს ითვლიან. აქ სედანი არ გამოდგება: საჭიროა მაღალი გამავლობის 4x4. წვიმიან დღეს
    გამგზავრება საერთოდ არ ღირს.
en:
  name: Bakhmaro
  short: A mountain resort of wooden chalets at 1,950 m where sea and alpine air meet — open only in summer.
  body: >-
    Bakhmaro is a climatic resort in the mountains of Guria, at roughly 1,950 metres. Its unusual reputation
    rests on the air: the Black Sea is only a few dozen kilometres away, yet the resort sits high in the
    alpine zone, so humid marine air mixes with dry mountain air. From the Soviet period onward people
    with respiratory problems were sent here to recover, and that tradition still shapes who comes.


    The architecture is unlike anywhere else in Georgia. This is not a town of hotels but a scattered
    settlement of wooden cottages, many raised on stilts, spread across open pasture. In winter Bakhmaro
    is effectively empty: snow lies metres deep and the road closes. Life starts in July and finishes
    in early September.


    Things to know:


    - **The season is short** — realistically July and August, with late June and early September marginal

    - **The road is rough** — the last few dozen kilometres are unsurfaced and get worse after rain

    - **Services are basic** — a few cafes, family guesthouses, no ATM


    In August the settlement hosts a traditional horse race, one of the best-known events in the region,
    which fills the place completely for several days. Outside that week, the appeal is quiet: meadows,
    mist rolling in from the sea below, and long evenings.
  tip: >-
    Plan a visit only in summer, and book accommodation in advance — in August, especially during the
    race week, there is essentially nothing free. Nights at 1,950 metres are cold even in midsummer, so
    warm clothing is genuinely necessary. There is no ATM and no pharmacy: bring cash and any medication
    you need. The last fuel is in Chokhatauri or Ozurgeti. Mobile coverage is patchy, so download the
    route for offline use before you leave the main road.
  route: >-
    Bakhmaro is about 355 km and six and a half hours from Tbilisi. Take the E60 west through Khashuri,
    the Rikoti section, Kutaisi and Samtredia, then turn off toward Chokhatauri. The serious part begins
    there: roughly 50 km of mountain dirt road, steep, narrow and heavily potholed, which takes two to
    three hours on its own. A sedan is not an option here — a high-clearance 4x4 is required, and even
    then the surface demands patience. Do not set out on a rainy day, as sections turn to deep mud quickly.
ru:
  name: Бахмаро
  short: Горный курорт из деревянных дач на 1950 м, где встречаются морской и альпийский воздух — только
    летом.
  body: >-
    Бахмаро — климатический курорт в горах Гурии, примерно на 1950 метрах. Его необычная репутация построена
    на воздухе: Чёрное море находится всего в нескольких десятках километров, но сам посёлок лежит высоко
    в альпийской зоне, так что влажный морской воздух смешивается с сухим горным. С советских времён сюда
    отправляли людей с заболеваниями дыхательных путей, и эта традиция во многом определяет публику до
    сих пор.


    Архитектура здесь не похожа ни на что другое в Грузии. Это не город гостиниц, а разбросанное по открытым
    склонам поселение деревянных дач, многие из которых стоят на сваях. Зимой Бахмаро практически пуст:
    снега наметает на метры, дорогу закрывают. Жизнь начинается в июле и заканчивается в начале сентября.


    Что нужно знать:


    - **Сезон короткий** — реально июль и август, конец июня и начало сентября условно

    - **Дорога тяжёлая** — последние десятки километров без покрытия, после дождя хуже

    - **Сервис простой** — несколько кафе, семейные гостевые дома, банкомата нет


    В августе здесь проводят традиционные конные скачки, одно из самых известных событий региона: на несколько
    дней посёлок заполняется полностью. В остальное время его ценят за тишину, луга и наползающий снизу
    туман.
  tip: >-
    Планируйте поездку только на лето и бронируйте ночлег заранее — в августе, особенно в неделю скачек,
    свободных мест практически не остаётся. Ночи на 1950 метрах холодные даже в разгар лета, тёплая одежда
    обязательна. Ни банкомата, ни аптеки здесь нет: наличные и нужные лекарства берите с собой. Последняя
    заправка — в Чохатаури или Озургети. Мобильная связь неустойчивая, поэтому маршрут скачайте для офлайн-навигации
    заранее.
  route: >-
    От Тбилиси до Бахмаро около 355 км и шесть с половиной часов. По трассе E60 на запад через Хашури,
    Рикотский участок, Кутаиси и Самтредиа, затем поворот на Чохатаури. Основная часть начинается именно
    оттуда: примерно 50 км горной грунтовой дороги — крутой, узкой и разбитой, на неё уходит два-три часа.
    Седан здесь не вариант: нужен внедорожник с высоким клиренсом, и даже с ним ехать придётся терпеливо.
    В дождливый день выезжать не стоит вовсе, отдельные участки быстро превращаются в грязь.
fa:
  name: باخمارو
  short: ییلاق کوهستانی خانه‌های چوبی در 1,950 متر، جایی که هوای دریا و کوهستان به هم می‌رسند — فقط در
    تابستان باز است.
  body: >-
    باخمارو آسایشگاهی اقلیمی در کوه‌های گوریا و در ارتفاع حدود 1,950 متر است. شهرت غیرعادی‌اش به هواست:
    دریای سیاه تنها چند ده کیلومتر فاصله دارد، در حالی که خود ییلاق بالا در پهنهٔ آلپی نشسته است، پس هوای
    مرطوب دریایی با هوای خشک کوهستان درمی‌آمیزد. از دوران شوروی به بعد بیماران تنفسی را برای بهبود به
    اینجا می‌فرستادند و همان سنت هنوز تعیین می‌کند چه کسانی می‌آیند.


    معماری آن مانند هیچ جای دیگر گرجستان نیست. اینجا شهری از هتل‌ها نیست، بلکه سکونتگاهی پراکنده از کلبه‌های
    چوبی است که بسیاری‌شان روی پایه بلند شده‌اند و در مرتع باز پخش‌اند. در زمستان باخمارو عملاً خالی است:
    برف متری می‌نشیند و جاده بسته می‌شود. زندگی در ژوئیه شروع می‌شود و اوایل سپتامبر تمام.


    آنچه باید بدانید:


    - **فصل کوتاه است** — واقع‌بینانه ژوئیه و اوت، با اواخر ژوئن و اوایل سپتامبر در مرز

    - **جاده ناهموار است** — چند ده کیلومتر آخر آسفالت ندارد و پس از باران بدتر می‌شود

    - **خدمات ابتدایی است** — چند کافه، مهمان‌خانه‌های خانوادگی، بدون خودپرداز


    در اوت اینجا مسابقهٔ سنتی اسب‌دوانی برگزار می‌شود، از شناخته‌شده‌ترین رویدادهای منطقه، که چند روز
    محل را کاملاً پر می‌کند. بیرون از آن هفته، جذابیت در سکوت است: چمنزار، مهی که از دریای پایین بالا
    می‌آید و عصرهای طولانی.
  tip: >-
    فقط در تابستان برنامه بریزید و اقامت را از پیش رزرو کنید — در اوت، به‌ویژه هفتهٔ مسابقه، عملاً هیچ
    جای خالی نیست. شب‌ها در 1,950 متر حتی در اوج تابستان سرد است، پس لباس گرم واقعاً لازم است. خودپرداز
    و داروخانه نیست: پول نقد و داروهای موردنیازتان را همراه ببرید. آخرین سوخت در چوخاتاوری یا اوزورگتی
    است. پوشش تلفن همراه ناپیوسته است، پس پیش از خارج شدن از جادهٔ اصلی مسیر را برای استفادهٔ آفلاین دانلود
    کنید.
  route: >-
    باخمارو حدود 355 کیلومتر و شش ساعت و نیم از تفلیس فاصله دارد. E60 را به غرب از خاشوری، مقطع ریکوتی،
    کوتایسی و سامتردیا بگیرید، سپس به سوی چوخاتاوری بپیچید. بخش جدی از همان‌جا شروع می‌شود: حدود 50 کیلومتر
    جادهٔ خاکی کوهستانی، تند، باریک و پرچاله، که خودش دو تا سه ساعت وقت می‌گیرد. سدان اینجا گزینه نیست
    — 4x4 با ارتفاع کف بالا لازم است و حتی با آن هم سطح جاده صبر می‌خواهد. در روز بارانی راه نیفتید، چون
    بخش‌هایی به‌سرعت به گِل عمیق بدل می‌شوند.
he:
  name: בחמארו
  short: אתר נופש הררי של בקתות עץ בגובה 1,950 מ' שבו נפגשים אוויר הים והאוויר האלפיני — פתוח בקיץ בלבד.
  body: >-
    בחמארו הוא אתר הבראה אקלימי בהרי גוריה, בגובה של כ-1,950 מטר. המוניטין החריג שלו נשען על האוויר: הים
    השחור מרוחק רק כמה עשרות קילומטרים, ואילו האתר עצמו יושב גבוה בחגורה האלפינית, כך שאוויר ימי לח מתערבב
    באוויר הרים יבש. מן התקופה הסובייטית ואילך נשלחו לכאן אנשים עם בעיות נשימה כדי להחלים, והמסורת הזאת
    עדיין קובעת מי מגיע.


    הארכיטקטורה אינה דומה לשום מקום אחר בגאורגיה. זו אינה עיירת מלונות אלא יישוב מפוזר של בקתות עץ, רבות
    מהן על עמודים, הפרושות על מרעה פתוח. בחורף בחמארו ריק למעשה: השלג מגיע לגובה מטרים והדרך נסגרת. החיים
    מתחילים ביולי ונגמרים בתחילת ספטמבר.


    מה שכדאי לדעת:


    - **העונה קצרה** — למעשה יולי ואוגוסט, כשסוף יוני ותחילת ספטמבר גבוליים

    - **הדרך משובשת** — עשרות הקילומטרים האחרונים אינם סלולים ומחמירים אחרי גשם

    - **השירותים בסיסיים** — כמה בתי קפה, אכסניות משפחתיות, בלי כספומט


    באוגוסט מתקיים ביישוב מרוץ סוסים מסורתי, אחד האירועים המוכרים באזור, שממלא את המקום לחלוטין לכמה ימים.
    מחוץ לאותו שבוע הקסם הוא בשקט: אחו, ערפל שעולה מן הים שלמטה וערבים ארוכים.
  tip: >-
    תכננו ביקור בקיץ בלבד, והזמינו לינה מראש — באוגוסט, ובעיקר בשבוע המרוץ, כמעט לא נשאר שום מקום פנוי.
    הלילות בגובה 1,950 מטר קרים גם באמצע הקיץ, ולכן ביגוד חם הוא באמת הכרחי. אין כספומט ואין בית מרקחת:
    קחו מזומן וכל תרופה שאתם צריכים. הדלק האחרון נמצא בצ'וחטאורי או באוזורגטי. הקליטה הסלולרית חלקית,
    אז הורידו את המסלול לשימוש לא מקוון לפני שאתם יורדים מהכביש הראשי.
  route: >-
    בחמארו נמצא כ-355 ק״מ ושש שעות וחצי מטביליסי. סעו מערבה בכביש E60 דרך חשורי, קטע ריקוטי, קוטאיסי וסמטרדיה,
    ואז פנו לכיוון צ'וחטאורי. משם מתחיל החלק הרציני: כ-50 ק״מ של דרך עפר הררית, תלולה, צרה ומלאת בורות,
    שלוקחת שעתיים עד שלוש בפני עצמה. סדאן אינו אופציה כאן — נדרש רכב 4x4 עם גובה גחון גבוה, וגם אז המשטח
    דורש סבלנות. אל תצאו לדרך ביום גשום, כי קטעים הופכים במהירות לבוץ עמוק.
ar:
  name: باخمارو
  short: مصيف جبلي من البيوت الخشبية على ارتفاع 1,950 م يلتقي فيه هواء البحر وهواء الجبال — ولا يفتح إلا
    صيفاً.
  body: >-
    باخمارو منتجع مناخي في جبال غوريا، على ارتفاع نحو 1,950 متراً. وتقوم شهرته غير المعتادة على الهواء:
    فالبحر الأسود لا يبعد سوى عشرات الكيلومترات، بينما يجلس المصيف عالياً في النطاق الألبي، فيمتزج هواء
    البحر الرطب بهواء الجبل الجاف. ومنذ العهد السوفييتي فصاعداً كان أصحاب المشكلات التنفسية يُرسلون إلى
    هنا للنقاهة، وما زال ذلك التقليد يحدد من يأتي إليه.


    والعمارة هنا لا تشبه أي مكان آخر في جورجيا. فهذه ليست بلدة فنادق بل تجمع متناثر من الأكواخ الخشبية،
    كثير منها مرفوع على أعمدة، منتشر على مراع مفتوحة. وفي الشتاء يخلو باخمارو عملياً: يتراكم الثلج بالأمتار
    ويُغلق الطريق. تبدأ الحياة في يوليو وتنتهي في أوائل سبتمبر.


    ما ينبغي معرفته:


    - **الموسم قصير** — يوليو وأغسطس واقعياً، مع أواخر يونيو وأوائل سبتمبر على الحد

    - **الطريق وعر** — عشرات الكيلومترات الأخيرة غير معبّدة وتسوء بعد المطر

    - **الخدمات بدائية** — بضعة مقاهٍ وبيوت ضيافة عائلية، ولا صراف آلي


    وفي أغسطس يستضيف التجمع سباق خيل تقليدياً، من أشهر فعاليات الإقليم، يملأ المكان تماماً لعدة أيام.
    وخارج ذلك الأسبوع تكمن جاذبيته في الهدوء: مروج وضباب يتصاعد من البحر في الأسفل وأمسيات طويلة.
  tip: >-
    خطط للزيارة صيفاً فقط، واحجز الإقامة مسبقاً — ففي أغسطس، وخاصة في أسبوع السباق، لا يكاد يبقى شيء شاغر.
    والليالي على ارتفاع 1,950 متراً باردة حتى في عز الصيف، فالملابس الدافئة ضرورية فعلاً. لا صراف آلي
    ولا صيدلية: احمل نقداً وأي دواء تحتاجه. وآخر محطة وقود في تشوخاتاوري أو أوزورغيتي. وتغطية الهاتف متقطعة،
    فحمّل المسار للاستخدام دون اتصال قبل مغادرة الطريق الرئيسي.
  route: >-
    يبعد باخمارو نحو 355 كم وست ساعات ونصف عن تبليسي. اسلك الطريق E60 غرباً عبر خاشوري ومقطع ريكوتي وكوتايسي
    وسامتريديا، ثم انعطف نحو تشوخاتاوري. ومن هناك يبدأ الجزء الجاد: نحو 50 كم من الطريق الترابي الجبلي،
    حاد وضيق وكثير الحفر، ويستغرق وحده ساعتين إلى ثلاث. السيارة السيدان ليست خياراً هنا — يلزم دفع رباعي
    بخلوص أرضي عالٍ، وحتى معه يتطلب سطح الطريق صبراً. ولا تنطلق في يوم ممطر، فبعض المقاطع تتحول سريعاً
    إلى وحل عميق.
