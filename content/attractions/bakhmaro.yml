ka:
  name: ბახმარო
  short: >-
    მხოლოდ ზაფხულში მოქმედი კურორტი ბოძებზე შემდგარი ხის სახლებით, გურიის მთებში, დაახლოებით 1950 მეტრზე,
    სადაც ზღვის ნიავი ნაძვნარს ხვდება.
  body: >-
    **ბახმარო თითქმის ორი ათასი მეტრის სიმაღლეზეა, ზაფხულის ნაშუადღევს კი აქ ნიავი ორმოცდაათი კილომეტრით
    დაშორებული ზღვიდან ამოდის.** კურორტი მესხეთის ქედზე, მდინარე ბახვისწყლის ხეობის ქვაბულშია, აღმოსავლური
    ნაძვის, კავკასიური სოჭისა და ფიჭვის ტყით გარშემორტყმული. დასავლეთიდან ქვაბული ღიაა, ამიტომ შავი ზღვის
    თბილი ჰაერი ხეობას აუყვება და მთის ცივ ჰაერს ერევა. ამ ნაზავის სამკურნალო ძალას 1890-იან წლებში ოზურგეთის
    მაზრის ექიმმა არტემ დავიდიანცმა მიაქცია ყურადღება: მწყემსებისგან გაიგო, რომ ზაფხულის საძოვრებზე ციება
    არ ეკარებოდათ, და 1892 წლიდან ციებიანი, შემდეგ კი ტუბერკულოზით დაავადებული პაციენტები მთაში გაგზავნა.
    1894 წლისთვის აქ პირველი სააგარაკო სახლები უკვე იდგა, 1923 წელს ბახმარომ კურორტის ოფიციალური სტატუსი
    მიიღო და ათწლეულების განმავლობაში სუსტფილტვიან ბავშვებს სწორედ აქ აგზავნიდნენ. ადგილობრივები დღემდე
    ამბობენ, რომ განკურნებას ოცდაერთი დღე სჭირდება.


    ბახმარო სულაც არ ჰგავს ჩვეულებრივ კურორტს. ეს მდელოებზე მიმოფანტული, მაღალ ბოძებზე შემდგარი ხის სახლების
    დასახლებაა. სახლები მაღლა იმიტომ დგას, რომ თოვლი აქ ოთხ-ხუთ მეტრსაც აღწევს და ნოემბრიდან მაისამდე
    წევს. ამ თვეებში კურორტი ცარიელია და გზა ჩაკეტილი. ბახმარო ივნისის ბოლოს იღვიძებს, ივლისსა და აგვისტოში
    ივსება, სექტემბერში კი ისევ იძინებს — სეზონი, ენციკლოპედიების თქმით, დღესაც თითქმის ისეთივე მოკლეა,
    როგორიც 150 წლის წინ იყო.


    სახელს ორი ამბავი ახლავს. მკვლევარ იური სიხარულიძის აზრით, სიტყვა სვანური წარმოშობისაა და „კაცის გადასასვლელს“
    ნიშნავს. გადმოცემა უფრო პირქუშ ამბავს ჰყვება: ლამაზი თავადის ქალი, მარო, თურქებმა მოიტაცეს, მდევარს
    ხანჯლით განგმირული დაუტოვეს და ახლომახლო ქვაზე მისივე სისხლით დააწერეს: „ბახ მარო“ — „ნახეთ თქვენი
    მარო“.


    ყოველი წლის 19 აგვისტოს სეზონი კულმინაციას აღწევს: ტრადიციული დოღი და დღესასწაული მთელი გურიიდან იზიდავს
    ხალხს. ერთი კვირა დარჩით და აქაურ საათსაც ისწავლით: დროს აქ ნისლის ტალღებით, შეშის კონებითა და მზის
    ნელი დაბრუნებით ითვლიან.
  tip: >-
    ჩამოდით მხოლოდ ივნისის ბოლოდან სექტემბრის შუა რიცხვებამდე და ღამის გასათევი წინასწარ დაჯავშნეთ: დოღის
    დღის, 19 აგვისტოს, ახლოს თავისუფალი ადგილი აღარ რჩება. ღამით შუა ზაფხულშიც ცივა — აგვისტოს საშუალო
    ტემპერატურა დაახლოებით 13 გრადუსია, — ამიტომ თბილი ფლისი და წვიმის ქურთუკი წაიღეთ; ნისლი წუთებში ჩამოწვება,
    წელიწადში კი აქ ასამდე ნისლიანი დღეა. ბანკომატი და აფთიაქი არ არის: ნაღდი ფული და საჭირო წამლები თან
    იქონიეთ. საწვავი ჩოხატაურში ჩაასხით. მობილური კავშირი არასტაბილურია, ამიტომ ხეობიდან ასვლამდე ოფლაინ
    რუკა ჩამოტვირთეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე იარეთ, რამდენიმე კილომეტრი
    ს12-ით (E692) ლანჩხუთის მიმართულებით გაჰყევით, შემდეგ სამხრეთით, შ2-ზე ჩოხატაურისკენ გადაუხვიეთ. ჩოხატაურიდან
    შ81 იწყება: ბახმარომდე დაახლოებით 50 კმ ციცაბო, ვიწრო მთის გზაა — ძველი, საბჭოთა დროის ასფალტი, დღეს
    ძლიერ დაზიანებული, ხრეშიანი მონაკვეთებითა და ჩამორეცხილი ადგილებით; მხოლოდ ამ მონაკვეთს ორ-სამ საათს
    დაუთმეთ. სულ დაახლოებით 355 კმ და 6 საათნახევარია. სედანი არ გამოდგება: იქირავეთ მაღალი გამავლობის
    4x4 (გზაგარეშე კლასი) და ძლიერი წვიმის შემდეგ გზას ნუ დაადგებით, როცა ზედა მონაკვეთები ტალახად იქცევა.
    საწვავი ჩოხატაურში ჩაასხით.
en:
  name: Bakhmaro
  short: >-
    A summer-only resort of stilted timber cottages at about 1,950 m in the Guria mountains, where a sea
    breeze climbs the valley to meet the spruce.
  body: >-
    **Bakhmaro sits at almost two thousand metres, yet the breeze that reaches it on a summer afternoon
    has come up from the sea, fifty kilometres away.** The resort lies in a basin of the Meskheti Range,
    in the valley of the Bakhvistsqali, ringed by oriental spruce, fir and Caucasian pine. The basin is
    open to the west, so warm Black Sea air climbs the valley and mixes with cold mountain air. Its healing
    effect was first noticed in the 1890s by Artem Davidiants, the district doctor of Ozurgeti: shepherds
    told him the summer pastures kept them free of fever, and from 1892 he sent patients with malaria,
    and soon tuberculosis, up into these mountains. By 1894 the first summer houses were standing; Bakhmaro
    became an official resort in 1923, and for decades children with weak lungs were sent up to breathe
    it. Local belief still holds that the cure takes twenty-one days.


    Nothing here looks like a spa. Bakhmaro is a scatter of wooden cottages on tall stilts across the
    meadows, raised high because snow can lie four or five metres deep and stays from November to May.
    For those months the resort is empty and the road is closed. It wakes in late June, fills in July
    and August, and falls asleep again in September — a season, as the encyclopedias note, hardly longer
    than it was 150 years ago.


    The name comes with two stories. The scholar Iuri Sikharulidze traced it to Svan words meaning roughly
    "the pass of men". Legend tells a darker tale: a beautiful noblewoman called Maro was carried off
    by Turkish raiders who, hard pressed by her pursuers, left her stabbed on the path and wrote on a
    stone in her own blood, "Bakh, Maro" — "Look, there is your Maro."


    Every 19 August the season peaks with a traditional horse race and festival that draws people from
    across Guria. Stay a week and you learn the local measure of time: fog banks, firewood, and the slow
    return of the sun.
  tip: >-
    Come only between late June and mid-September, and book ahead: around 19 August, the day of the horse
    race, beds vanish. Nights are cold even in high summer — the August average is about 13°C — so pack
    a fleece and a rain jacket; fog can close in within minutes, and the resort sees around a hundred
    foggy days a year. There is no ATM or pharmacy: bring cash and any medicines. Fill the tank in Chokhatauri.
    Mobile signal is patchy, so download offline maps before leaving the valley.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, join the S12 (E692) towards Lanchkhuti
    for a few kilometres, then turn south onto the Sh2 to Chokhatauri. There the Sh81 begins: about 50
    km of steep, narrow mountain road up to Bakhmaro — old Soviet-era asphalt, now badly broken, with
    gravel patches and washouts; allow two to three hours for this stretch alone. In total about 355 km
    and 6½ hours. A sedan will not do: hire a high-clearance 4x4 (off-road class), and do not set out
    after heavy rain, when the upper sections turn to mud. Fuel up in Chokhatauri.
ru:
  name: Бахмаро
  short: >-
    Летний курорт из деревянных домиков на высоких столбах на высоте около 1950 м в горах Гурии, куда
    морской ветер поднимается по долине навстречу ели.
  body: >-
    **Бахмаро лежит почти на двух тысячах метров, но бриз, что доходит сюда летним днём, поднялся с моря,
    лежащего в пятидесяти километрах.** Курорт занимает котловину Месхетского хребта, в долине реки Бахвисцкали,
    окружённую восточной елью, пихтой и кавказской сосной. Котловина открыта на запад, поэтому тёплый
    черноморский воздух поднимается по долине и смешивается с холодным горным. Целебные свойства этой
    смеси первым заметил в 1890-х годах озургетский уездный врач Артём Давидянц: пастухи рассказали ему,
    что на летних пастбищах их не берёт лихорадка, и с 1892 года он стал отправлять в горы больных малярией,
    а вскоре и туберкулёзом. К 1894 году здесь уже стояли первые дачи; официальным курортом Бахмаро стало
    в 1923 году, и десятилетиями сюда отправляли детей со слабыми лёгкими подышать этим воздухом. Местное
    поверье до сих пор гласит, что лечение занимает двадцать один день.


    Здесь ничто не похоже на курорт с водолечебницами. Бахмаро — это рассыпанные по лугам деревянные домики
    на высоких столбах, поднятые так высоко потому, что снег здесь лежит слоем в четыре-пять метров и
    держится с ноября по май. На эти месяцы курорт пустеет, а дорога закрывается. Он пробуждается в конце
    июня, наполняется в июле и августе и снова засыпает в сентябре — сезон, как отмечают энциклопедии,
    едва длиннее, чем 150 лет назад.


    С названием связаны две истории. Учёный Юрий Сихарулидзе выводил его из сванских слов, означающих
    приблизительно «перевал мужей». Легенда рассказывает историю темнее: прекрасную дворянку по имени
    Маро увезли турецкие налётчики, которые, настигнутые преследователями, оставили её на тропе, заколотую
    кинжалом, и написали на камне её собственной кровью: «Бах, Маро» — «Смотрите, вот ваша Маро».


    Ежегодно 19 августа сезон достигает пика: традиционные конные скачки и праздник собирают людей со
    всей Гурии. Останьтесь на неделю — и вы освоите здешнее счисление времени: полосы тумана, запас дров
    и медленное возвращение солнца.
  tip: >-
    Приезжайте только с конца июня по середину сентября и бронируйте заранее: к 19 августа, дню скачек,
    свободных мест не остаётся. Ночи холодные даже в разгар лета — средняя температура августа около 13
    °C, — так что возьмите флисовую куртку и дождевик; туман может опуститься за считанные минуты, а туманных
    дней здесь бывает около сотни в году. Здесь нет ни банкомата, ни аптеки: возьмите наличные и все нужные
    лекарства. Заправьтесь в Чохатаури. Мобильная связь неустойчива, поэтому загрузите офлайн-карты, прежде
    чем покинуть долину.
  route: >-
    От Тбилиси по S1 (E60) на запад мимо Кутаиси до Самтредиа, затем несколько километров по S12 (E692)
    в сторону Ланчхути, после чего на юг по Sh2 до Чохатаури. Там начинается Sh81: около 50 км крутой
    узкой горной дороги до Бахмаро — старый советский асфальт, ныне сильно разбитый, с гравийными участками
    и промоинами; отведите на этот участок два-три часа. Всего около 355 км и 6,5 часа. Седан не подойдёт:
    возьмите напрокат полноприводный автомобиль с высоким клиренсом (класс «внедорожник») и не выезжайте
    после сильного дождя, когда верхние участки превращаются в грязь. Заправьтесь в Чохатаури.
fa:
  name: باخمارو
  short: >-
    تفرجگاهی تنها در تابستان، با کلبه‌های چوبی روی پایه‌های بلند در حدود ۱٬۹۵۰ متری در کوه‌های گوریا،
    جایی که نسیم دریا از دره بالا می‌آید تا به نوئل‌ها برسد.
  body: >-
    **باخمارو در نزدیک دو هزار متری قرار دارد، اما نسیمی که در بعدازظهری تابستانی به آن می‌رسد، از دریایی
    که پنجاه کیلومتر دورتر است، بالا آمده.** این تفرجگاه در حوضچه‌ای از رشته‌کوه مسختی، در درهٔ رود باخویسکالی،
    محصور در نوئل شرقی، نراد و کاج قفقازی جای دارد. حوضچه به سوی غرب باز است، پس هوای گرم دریای سیاه از
    دره بالا می‌آید و با هوای سرد کوهستان می‌آمیزد. اثر شفابخش این ترکیب را نخستین بار در دههٔ ۱۸۹۰ آرتم
    داویدیانتس، پزشک ناحیهٔ اوزورگتی، دریافت: چوپانان به او گفته بودند که در چراگاه‌های تابستانی تب به
    سراغشان نمی‌آید، و او از ۱۸۹۲ بیماران مالاریایی و سپس مسلول را به این کوه‌ها فرستاد. تا ۱۸۹۴ نخستین
    خانه‌های ییلاقی برپا شده بود؛ باخمارو در سال ۱۹۲۳ رسماً تفرجگاه شد، و برای دهه‌ها کودکان با ریه‌های
    ضعیف را برای تنفس همین هوا به بالا می‌فرستادند. باور محلی هنوز می‌گوید که درمان بیست‌ویک روز طول می‌کشد.


    هیچ‌چیز اینجا شبیه به آبگرم یا درمانگاه نیست. باخمارو مجموعه‌ای پراکنده از کلبه‌های چوبی بر پایه‌های
    بلند در سراسر چمنزارهاست، بلندی‌شان از آن‌روست که برف می‌تواند تا چهار یا پنج متر عمق داشته باشد و
    از نوامبر تا مه باقی می‌ماند. در آن ماه‌ها تفرجگاه خالی است و راه بسته. باخمارو در اواخر ژوئن بیدار
    می‌شود، در ژوئیه و اوت پر می‌شود، و در سپتامبر باز به خواب می‌رود — فصلی که، به گفتهٔ دایره‌المعارف‌ها،
    هنوز چندان درازتر از ۱۵۰ سال پیش نیست.


    نام آن با دو داستان همراه است. پژوهشگر یوری سیخارولیدزه ریشه‌اش را به واژه‌های سوانی رساند، به‌معنای
    تقریبی «گذرگاه مردان». افسانه داستانی تیره‌تر می‌گوید: بانوی اشرافی زیبایی به‌نام مارو را راهزنان
    ترک ربودند، که چون تعقیب‌کنندگان سخت در پی‌شان بودند، او را خنجرخورده در راه رها کردند و با خون خودش
    بر سنگی نوشتند: «باخ، مارو» — «نگاه کنید، این مارو شماست».


    هر نوزدهم اوت، فصل به اوج می‌رسد: اسب‌دوانی سنتی و جشنی که مردم را از سراسر گوریا جمع می‌کند. یک هفته
    بمانید، و سنجش زمان محلی را می‌آموزید: توده‌های مه، هیزم، و بازگشت آرام آفتاب.
  tip: >-
    تنها از اواخر ژوئن تا نیمهٔ سپتامبر بیایید و پیش‌تر رزرو کنید: نزدیک نوزدهم اوت، روز اسب‌دوانی، جایی
    برای خواب باقی نمی‌ماند. شب‌ها حتی در اوج تابستان سرد است — میانگین اوت حدود ۱۳ درجه — پس لباس گرم
    و بارانی بیاورید؛ مه می‌تواند در چند دقیقه فروبیفتد، و تفرجگاه سالانه نزدیک به صد روز مه‌آلود دارد.
    نه دستگاه خودپرداز و نه داروخانه‌ای هست: پول نقد و هر دارویی که نیاز دارید بیاورید. در چوخاتائوری
    سوخت‌گیری کنید. سیگنال موبایل نامنظم است، پس پیش از ترک دره نقشه‌های آفلاین را بارگیری کنید.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب، از کنار کوتایسی تا سامتردیا بروید، سپس چند کیلومتر با S12 (E692)
    به سوی لانچخوتی، و آن‌گاه به سوی جنوب با Sh2 تا چوخاتائوری. از آنجا Sh81 آغاز می‌شود: حدود ۵۰ کیلومتر
    جادهٔ کوهستانی شیب‌دار و باریک تا باخمارو — آسفالت کهنهٔ دوران شوروی که اکنون به‌شدت فرسوده است، با
    تکه‌های شنی و بخش‌هایی که سیلاب شسته و برده؛ برای همین بخش تنها دو تا سه ساعت در نظر بگیرید. در مجموع
    حدود ۳۵۵ کیلومتر و شش ساعت و نیم. سدان به کار نمی‌آید: خودرویی شاسی‌بلند و دودیفرانسیل (کلاس آفرود)
    کرایه کنید، و پس از باران شدید حرکت نکنید، آن‌گاه که بخش‌های بالایی به گِل بدل می‌شوند. در چوخاتائوری
    سوخت‌گیری کنید.
he:
  name: בחמארו
  short: >-
    אתר נופש קיצי בלבד, עם בקתות עץ על עמודים גבוהים בגובה כ-1,950 מ' בהרי גוריה, שם רוח הים מטפסת בעמק
    לפגוש את האשוחיות.
  body: >-
    **בחמארו שוכן בגובה של כמעט אלפיים מטרים, ואילו הרוח שמגיעה אליו בשעת אחר-צהריים קיצית הגיעה מהים,
    המרוחק חמישים קילומטרים.** האתר שוכן באגן של רכס מסחטי, בעמק נהר בחוויסצקלי, מוקף באשוחית מזרחית,
    אשוח ואורן קווקזי. האגן פתוח למערב, כך שאוויר חם מהים השחור מטפס בעמק ומתערבב עם אוויר קר של ההרים.
    את סגולותיה המרפאות של תערובת זו גילה בשנות ה-1890 ארטיום דווידיאנץ, רופא המחוז של אוזורגטי: רועים
    סיפרו לו שבמרעי הקיץ הקדחת אינה פוגעת בהם, ומ-1892 החל לשלוח לכאן חולי מלריה ובהמשך גם חולי שחפת.
    עד 1894 כבר עמדו כאן בתי הקיץ הראשונים; בחמארו הפך לאתר נופש רשמי ב-1923, ולעשרות שנים נשלחו לשם ילדים
    עם ריאות חלשות לנשום את האוויר הזה. אמונה מקומית עדיין קובעת שהריפוי לוקח 21 יום.


    שום דבר כאן לא נראה כמו ספא. בחמארו הוא פיזור של בקתות עץ על עמודים גבוהים על פני האחו, והן מוגבהות
    כל כך משום שהשלג יכול להצטבר לעומק של ארבעה או חמישה מטרים ונשאר מנובמבר עד מאי. בחודשים אלה האתר
    ריק והדרך סגורה. הוא מתעורר בסוף יוני, מתמלא ביולי ובאוגוסט, ונרדם מחדש בספטמבר — עונה שכפי שהאנציקלופדיות
    מציינות, כמעט אינה ארוכה יותר משהייתה לפני 150 שנה.


    לשם המקום נלוות שתי גרסאות. החוקר יורי סיחארולידזה ייחס את מקורו למילים סוואניות שמשמעותן בקירוב "מעבר
    הגברים". האגדה מספרת סיפור אפל יותר: אישה אריסטוקרטית יפה בשם מארו נחטפה בידי פושטים טורקים, שכשנרדפו
    קשות, השאירוה על השביל דקורה בפגיון, וכתבו על אבן בדמה שלה: "בּח, מארו" — "הביטו, זו המארו שלכם".


    בכל 19 באוגוסט העונה מגיעה לשיאה: מירוץ סוסים מסורתי ופסטיבל שמושכים אנשים מכל רחבי גוריה. הישארו
    שבוע ותלמדו את מדידת הזמן המקומית: רצועות ערפל, עצי הסקה, והחזרה האיטית של השמש.
  tip: >-
    הגיעו רק בין סוף יוני לאמצע ספטמבר, והזמינו מקום מראש: סביב 19 באוגוסט, יום מירוץ הסוסים, המקומות
    נגמרים. הלילות קרים אפילו בשיא הקיץ — הממוצע באוגוסט הוא כ-13 מעלות — אז ארזו פליז ומעיל גשם; ערפל
    יכול לרדת בתוך דקות, ויש כאן כמאה ימי ערפל בשנה. אין כספומט ואין בית מרקחת: הביאו מזומן וכל תרופה
    שאתם צריכים. תדלקו בצ'וחאטאורי. הקליטה הסלולרית מקוטעת, אז הורידו מפות לא מקוונות לפני שאתם עוזבים
    את העמק.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה לצד קוטאיסי עד סמטרדיה, המשיכו כמה קילומטרים ב-S12 (E692) לעבר לנצ'חוטי,
    ואז דרומה ב-Sh2 עד צ'וחאטאורי. משם מתחיל Sh81: כ-50 ק"מ של דרך הררית תלולה וצרה עד בחמארו — אספלט
    ישן מהתקופה הסובייטית, כיום משובש מאוד, עם קטעי חצץ ומקטעים שנסחפו במים; הקצו שעתיים עד שלוש למקטע
    הזה בלבד. בסך הכל כ-355 ק"מ ו-6.5 שעות. סדאן לא יתאים: שכרו רכב שטח 4x4 בעל מרווח גחון גבוה, ואל תצאו
    לדרך אחרי גשם חזק, שאז הקטעים העליונים הופכים לבוץ. תדלקו בצ'וחאטאורי.
ar:
  name: باخمارو
  short: >-
    منتجع صيفي فقط، بأكواخ خشبية على ركائز عالية على ارتفاع نحو 1,950 مترًا في جبال غوريا، حيث تصعد نسمة
    البحر الوادي لتلاقي شجر التنّوب.
  body: >-
    **يقع باخمارو على ارتفاع يقارب الألفي متر، ومع ذلك فإن النسيم الذي يصله في عصر يوم صيفي قد صعد من
    البحر البعيد خمسين كيلومترًا.** يشغل المنتجع حوضًا في سلسلة مسخيتي، في وادي نهر باخفيستسكالي، تحيط
    به أشجار التنّوب الشرقي والشوح والصنوبر القوقازي. الحوض مفتوح نحو الغرب، فيصعد هواء البحر الأسود الدافئ
    في الوادي ويختلط بالهواء الجبلي البارد. كان أول من انتبه إلى الخصائص الشافية لهذا الخليط، في تسعينيات
    القرن التاسع عشر، أرتيم دافيديانتس، طبيب قضاء أوزورغيتي: فقد أخبره الرعاة أن الحمّى لا تصيبهم في المراعي
    الصيفية، فأخذ منذ عام 1892 يرسل إلى هذه الجبال مرضى الملاريا ثم مرضى السل. وبحلول عام 1894 كانت أولى
    البيوت الصيفية قائمة هنا؛ وأصبح باخمارو منتجعًا رسميًا في عام 1923، ولعقود كان يُرسَل إليه الأطفال
    ذوو الرئات الضعيفة لتنشّق هذا الهواء. لا يزال المعتقد المحلي يقول إن الشفاء يستغرق أحدًا وعشرين يومًا.


    لا شيء هنا يشبه المنتجع الصحي. باخمارو مجموعة متناثرة من الأكواخ الخشبية على ركائز عالية في المروج،
    رُفعت هكذا لأن الثلج يمكن أن يبلغ عمقه أربعة أو خمسة أمتار ويبقى من نوفمبر إلى مايو. في تلك الأشهر
    يكون المنتجع خاليًا والطريق مغلقًا. يستيقظ في أواخر يونيو، ويمتلئ في يوليو وأغسطس، ويعود إلى النوم
    في سبتمبر — موسم، كما تلاحظ الموسوعات، لا يكاد يزيد طولًا عمّا كان عليه قبل 150 عامًا.


    يحمل الاسم قصتين. تتبّع الباحث يوري سيخاروليدزه أصله إلى كلمات سفانية تعني تقريبًا «ممر الرجال». تروي
    الأسطورة حكاية أكثر قسوة: امرأة نبيلة جميلة تُدعى مارو خطفها غزاة أتراك، وحين اشتدّ عليهم المطاردون،
    تركوها على الدرب مطعونة بخنجر، وكتبوا على حجر بدمها: «باخ، مارو» — «انظروا، هذه ماروكم».


    في 19 أغسطس من كل عام يبلغ الموسم قمته: سباق خيل تقليدي ومهرجان يجذبان الناس من كل أرجاء غوريا. أقم
    أسبوعًا وستتعلم مقياس الزمن هنا: كتل الضباب، وحطب النار، وعودة الشمس البطيئة.
  tip: >-
    تعال فقط بين أواخر يونيو ومنتصف سبتمبر، واحجز مسبقًا: قرب 19 أغسطس، يوم سباق الخيل، لا يبقى مكان.
    الليالي باردة حتى في عز الصيف — يبلغ متوسط أغسطس نحو 13 درجة — فاحمل سترة صوفية دافئة ومعطف مطر؛ يمكن
    أن ينسدل الضباب في دقائق، ويشهد المنتجع نحو مئة يوم ضبابي في السنة. لا يوجد صراف آلي ولا صيدلية: احمل
    نقدًا وأي أدوية تحتاجها. عبّئ الوقود في تشوخاتاوري. تغطية الهاتف متقطعة، فنزّل خرائط دون اتصال قبل
    مغادرة الوادي.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا بمحاذاة كوتايسي حتى سامتريديا، ثم استمر بضعة كيلومترات على S12
    (E692) نحو لانتشخوتي، ثم جنوبًا على Sh2 حتى تشوخاتاوري. من هناك يبدأ Sh81: نحو 50 كم من طريق جبلي
    شديد الانحدار وضيق حتى باخمارو — أسفلت قديم من الحقبة السوفييتية بات متهالكًا بشدة، تتخلله مقاطع حصوية
    وأجزاء جرفتها السيول؛ خصّص ساعتين إلى ثلاث لهذا المقطع وحده. الإجمالي نحو 355 كم و6.5 ساعة. لا تكفي
    سيارة صالون: استأجر سيارة دفع رباعي ذات خلوص أرضي مرتفع (فئة الطرق الوعرة)، ولا تنطلق بعد مطر غزير
    حين تتحول المقاطع العليا إلى طين. عبّئ الوقود في تشوخاتاوري.
