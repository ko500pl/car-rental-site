ka:
  name: ონის სინაგოგა
  short: 1895 წლის სინაგოგა ონის ძველ ებრაულ უბანში — საქართველოს უდიდესებს შორის და დღემდე მოქმედი.
  body: >-
    **ონის სინაგოგა ის შენობაა, რომელიც ქალაქის სხვა ყველაფერზე დიდია.** ის 1895 წელს ააგეს, ონის ებრაული
    თემის ხარჯით, რომელიც მაშინ ქალაქის მოსახლეობის მნიშვნელოვან ნაწილს შეადგენდა და ვაჭრობის დიდ ნაწილს
    აკონტროლებდა. მასშტაბით ის თბილისისა და ქუთაისის სინაგოგებს მოსდევს.


    შენობა ადგილობრივი ქვისაა, ორი ოთხკუთხა კოშკით მთავარ ფასადზე და ღრმა თაღოვანი სარკმლებით. სტილი შერეულია
    — ბიზანტიური თაღები, აღმოსავლური დეტალები, პროვინციული კლასიციზმის ელემენტები. შიგნით მაღალი დარბაზია,
    ხის სვეტებზე დაყრდნობილი გალერეით ქალებისთვის და მოხატული ჭერით; ინტერიერი მოკრძალებულია, მაგრამ სივრცე
    მოულოდნელად დიდია პატარა მთის ქალაქისთვის.


    რაჭაში ებრაელები საუკუნეების განმავლობაში ცხოვრობდნენ; ონის თემი საქართველოს ერთ-ერთ უძველესად ითვლებოდა.
    XX საუკუნის მეორე ნახევარში, განსაკუთრებით 1970-იანი წლებიდან, თემის დიდი ნაწილი ისრაელში გადასახლდა,
    ხოლო 1991 წლის მიწისძვრამ, რომელმაც ონი მძიმედ დააზიანა, დარჩენილთა უმეტესობაც წაიყვანა. თავად სინაგოგამაც
    მიიღო ზიანი და მოგვიანებით, დიასპორის დახმარებით, აღადგინეს.


    დღეს ონში ებრაული თემი მხოლოდ რამდენიმე ოჯახია, მაგრამ სინაგოგა მოქმედია და პერიოდულად იმართება ლოცვა.
    გვერდით ძველი ებრაული უბანია — მაღაზიის ქვედა სართულებიანი სახლები, ხის აივნები, ვიწრო ქუჩები, რომლებიც
    რიონისკენ ეშვება. ქალაქის გარეთ, ფერდობზე, ძველი ებრაული სასაფლაოა, ქართულ და ებრაულ წარწერებიანი
    ქვებით.


    ეს არ არის დიდი მუზეუმი, არამედ ცოცხალი შენობა თითქმის გამქრალი თემისა — და სწორედ ეს აქცევს მას ონის
    ყველაზე მნიშვნელოვან ადგილად.
  tip: >-
    ერთი საათი საკმარისია სინაგოგისთვის და გარშემო ქუჩებისთვის. შენობა ყოველთვის ღია არ არის — გასაღები
    მეზობლებთანაა და ხშირად უბრალოდ კითხვა კმარა. მამაკაცებმა თავი უნდა დაიფარონ, ქუდი შესასვლელთან დევს.
    შესვლა უფასოა, თუმცა შემოწირულობის ყუთი დგას. ფოტოს გადაღებამდე ჰკითხე. ძველი სასაფლაო ქალაქიდან ფეხით
    ოციოდე წუთია, ბილიკი ციცაბო და უსახელოა. ტუალეტი და კაფე ონის ცენტრშია.
  route: >-
    სინაგოგა ონის ცენტრში, მოედნიდან რიონისკენ ჩამავალ უბანშია — ფეხით ხუთი წუთი. მანქანით თბილისიდან
    355 კმ ქუთაისისა და ნაქერალას გავლით, ამბროლაურზე და რიონის ხეობით ზემოთ, დაახლოებით ექვსი საათი.
    გზა ძირითადად ასფალტია, ბოლო მონაკვეთი დაზიანებული. მანქანა ცენტრალურ მოედანთან დატოვე — ძველი უბნის
    ქუჩები ვიწროა და ადგილ-ადგილ მოხრეშილი. საწვავი ამბროლაურში აიღე. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Oni Synagogue
  short: An 1895 synagogue in Oni's old Jewish quarter — among the largest in Georgia, and still in use.
  body: >-
    **The synagogue is the building that dwarfs everything else in Oni.** It was put up in 1895 at the
    expense of the town's Jewish community, which at that time made up a substantial share of the population
    and handled most of its trade. In scale it comes after the synagogues of Tbilisi and Kutaisi.


    It is built of local stone, with two square towers on the main facade and deep arched windows. The
    style is mixed — Byzantine arches, oriental detailing, elements of provincial classicism. Inside is
    a high hall with a women's gallery carried on wooden columns and a painted ceiling. The interior is
    modest, but the volume is startling for a small mountain town.


    Jews lived in Racha for centuries, and the Oni community was considered one of the oldest in Georgia.
    In the second half of the 20th century, and particularly from the 1970s, most of it emigrated to Israel;
    the earthquake of 1991, which hit Oni hard, took away most of those who remained. The synagogue itself
    was damaged and was later restored with help from the diaspora.


    Today the Jewish community of Oni amounts to a few families, but the building is not a museum piece:
    services are still held from time to time. Beside it lies the old Jewish quarter — houses with shopfronts
    on the ground floor, wooden balconies, narrow lanes dropping towards the Rioni. On the slope outside
    town is the old Jewish cemetery, its stones carrying inscriptions in both Georgian and Hebrew.


    What makes this the most significant thing to see in Oni is precisely that it is a working building
    belonging to a community that has almost gone.
  tip: >-
    An hour covers the synagogue and the streets around it. It is not always open — the key is with neighbours,
    and asking is usually enough. Men should cover their heads; caps are kept by the entrance. Entry is
    free, though there is a donation box. Ask before photographing the interior. The old cemetery is about
    twenty minutes on foot from the centre, up a steep and unmarked path. Toilets and cafes are in the
    centre of Oni.
  route: >-
    The synagogue is in the centre of Oni, in the quarter running down from the square towards the Rioni
    — five minutes on foot. Driving from Tbilisi it is 355 km via Kutaisi and the Nakerala pass, then
    Ambrolauri and up the Rioni valley, roughly six hours. The road is mostly asphalt, with the final
    section broken up. Leave the car near the central square: the lanes of the old quarter are narrow
    and partly unsurfaced. Fuel at Ambrolauri. An economy car is sufficient.
ru:
  name: Синагога Они
  short: Синагога 1895 года в старом еврейском квартале Они — одна из крупнейших в Грузии и действующая
    до сих пор.
  body: >-
    **Синагога — здание, которое перекрывает по размеру всё остальное в Они.** Её возвели в 1895 году
    на средства еврейской общины города, составлявшей тогда заметную часть населения и державшей большую
    часть торговли. По масштабу она идёт следом за синагогами Тбилиси и Кутаиси.


    Построена она из местного камня, с двумя квадратными башнями на главном фасаде и глубокими арочными
    окнами. Стиль смешанный: византийские арки, восточные детали, элементы провинциального классицизма.
    Внутри — высокий зал с женской галереей на деревянных столбах и расписным потолком. Убранство скромное,
    но объём поражает для маленького горного городка.


    Евреи жили в Раче столетиями, и община Они считалась одной из старейших в Грузии. Во второй половине
    XX века, особенно с 1970-х годов, большая её часть уехала в Израиль; землетрясение 1991 года, тяжело
    ударившее по Они, увело почти всех оставшихся. Само здание пострадало и позже было восстановлено при
    помощи диаспоры.


    Сегодня еврейская община Они — это несколько семей, но синагога не превратилась в музейный экспонат:
    службы здесь время от времени идут. Рядом лежит старый еврейский квартал: дома с лавками на первом
    этаже, деревянные балконы, узкие переулки, спускающиеся к Риони. На склоне за городом — старое еврейское
    кладбище с надписями на грузинском и иврите.


    Самым значимым местом Они его делает именно это: действующее здание общины, которой почти не осталось.
  tip: >-
    Часа хватит на синагогу и окрестные улицы. Открыта она не всегда — ключ у соседей, и обычно достаточно
    спросить. Мужчинам нужно покрыть голову, шапочки лежат у входа. Вход бесплатный, но стоит ящик для
    пожертвований. Прежде чем снимать внутри, спросите. Старое кладбище — минут двадцать пешком от центра,
    по крутой и никак не обозначенной тропе. Туалеты и кафе — в центре Они.
  route: >-
    Синагога стоит в центре Они, в квартале, спускающемся от площади к Риони, — пять минут пешком. На
    машине из Тбилиси 355 км через Кутаиси и перевал Накерала, затем Амбролаури и вверх по долине Риони,
    примерно шесть часов. Дорога в основном асфальтовая, последний участок разбит. Машину оставьте у центральной
    площади: переулки старого квартала узкие и местами без покрытия. Заправка в Амбролаури. Машины эконом-класса
    достаточно.
fa:
  name: کنیسهٔ اونی
  short: کنیسه‌ای از ۱۸۹۵ در محلهٔ قدیمی یهودیان اونی — از بزرگ‌ترین کنیسه‌های گرجستان و هنوز دایر.
  body: >-
    **کنیسه ساختمانی است که همه چیز دیگر اونی را کوچک نشان می‌دهد.** در سال ۱۸۹۵ به هزینهٔ جامعهٔ یهودی
    شهر ساخته شد؛ جامعه‌ای که آن روزها بخش چشمگیری از جمعیت را تشکیل می‌داد و بیشتر بازرگانی شهر در دستش
    بود. از نظر اندازه پس از کنیسه‌های تفلیس و کوتائیسی می‌آید.


    از سنگ محلی ساخته شده، با دو برج مربع بر نمای اصلی و پنجره‌های طاق‌دار گود. سبک آن آمیخته است: طاق‌های
    بیزانسی، جزئیات شرقی، و عناصری از کلاسیسیسم ولایتی. درون آن تالاری بلند است با بالکن زنان بر ستون‌های
    چوبی و سقفی نقاشی‌شده. آرایه‌ها ساده‌اند، اما حجم فضا برای شهری کوچک در کوهستان شگفت‌انگیز است.


    یهودیان قرن‌ها در راچا زیستند و جامعهٔ اونی از کهن‌ترین‌های گرجستان شمرده می‌شد. در نیمهٔ دوم سدهٔ
    بیستم، به‌ویژه از دههٔ ۱۹۷۰، بیشترشان به اسرائیل مهاجرت کردند؛ و زمین‌لرزهٔ ۱۹۹۱ که به اونی آسیب سختی
    زد، تقریباً همهٔ بازماندگان را نیز برد. خود بنا آسیب دید و بعدها با کمک دیاسپورا مرمت شد.


    امروز جامعهٔ یهودی اونی چند خانواده است، اما کنیسه به شیء موزه‌ای بدل نشده: هنوز گاه‌گاه در آن نماز
    برپا می‌شود. کنارش محلهٔ قدیمی یهودیان است؛ خانه‌هایی با دکان در طبقهٔ همکف، ایوان‌های چوبی و کوچه‌های
    باریکی که به سوی ریونی سرازیر می‌شوند. بر دامنهٔ بیرون شهر گورستان کهن یهودی است، با سنگ‌هایی که کتیبه‌هایی
    به گرجی و عبری دارند.


    آنچه این را مهم‌ترین دیدنی اونی می‌کند همین است: بنایی زنده متعلق به جامعه‌ای که تقریباً رفته است.
  tip: >-
    یک ساعت برای کنیسه و کوچه‌های پیرامون کافی است. همیشه باز نیست؛ کلید نزد همسایه‌هاست و معمولاً پرسیدن
    کفایت می‌کند. مردان باید سر خود را بپوشانند و کلاه‌ها کنار در گذاشته شده‌اند. ورود رایگان است، هرچند
    صندوق کمک هست. پیش از عکس گرفتن از داخل اجازه بگیرید. گورستان قدیمی حدود بیست دقیقه پیاده از مرکز
    است، از راهی تند و بی‌تابلو. سرویس بهداشتی و کافه در مرکز اونی است.
  route: >-
    کنیسه در مرکز اونی است، در محله‌ای که از میدان به سوی ریونی پایین می‌رود — پنج دقیقه پیاده. با خودرو
    از تفلیس ۳۵۵ کیلومتر از راه کوتائیسی و گردنهٔ ناکرالا، سپس آمبرولائوری و بالا رفتن در درّهٔ ریونی،
    تقریباً شش ساعت. جاده بیشتر آسفالت است و بخش پایانی آسیب‌دیده. خودرو را نزدیک میدان مرکزی بگذارید،
    چون کوچه‌های محلهٔ قدیمی باریک و جابه‌جا بی‌آسفالت‌اند. سوخت در آمبرولائوری. خودروی اقتصادی کافی است.
he:
  name: בית הכנסת של אוני
  short: בית כנסת משנת 1895 ברובע היהודי הישן של אוני — מן הגדולים בגאורגיה, ועדיין פעיל.
  body: >-
    **בית הכנסת הוא המבנה שמגמד את כל השאר באוני.** הוא הוקם ב-1895 על חשבון הקהילה היהודית של העיירה,
    שהיוותה אז חלק ניכר מן האוכלוסייה והחזיקה את רוב המסחר. בגודלו הוא בא אחרי בתי הכנסת של טביליסי וקותאיסי.


    הוא בנוי מאבן מקומית, עם שני מגדלים מרובעים בחזית הראשית וחלונות קשתיים עמוקים. הסגנון מעורב: קשתות
    ביזנטיות, פרטים מזרחיים ויסודות של קלאסיציזם פרובינציאלי. בפנים אולם גבוה עם עזרת נשים הנשענת על עמודי
    עץ ותקרה מצוירת. הריהוט צנוע, אך נפח החלל מפתיע לעיירת הרים קטנה.


    יהודים חיו בראצ'ה מאות שנים, וקהילת אוני נחשבה לאחת העתיקות בגאורגיה. במחצית השנייה של המאה ה-20,
    ובעיקר משנות השבעים, היגר רובה לישראל; ורעידת האדמה של 1991, שפגעה קשות באוני, נטלה כמעט את כל מי
    שנותר. המבנה עצמו ניזוק ושוקם מאוחר יותר בעזרת התפוצות.


    כיום מונה הקהילה היהודית באוני כמה משפחות בלבד, אך בית הכנסת לא הפך לפריט מוזיאלי: מדי פעם עדיין מתקיימות
    בו תפילות. לצידו שוכן הרובע היהודי הישן — בתים עם חנויות בקומת הקרקע, מרפסות עץ וסמטאות צרות היורדות
    אל הריוני. במדרון מחוץ לעיירה נמצא בית הקברות היהודי הישן, ואבניו נושאות כתובות בגאורגית ובעברית.


    מה שהופך את המקום לחשוב ביותר באוני הוא בדיוק זה: מבנה חי של קהילה שכמעט איננה עוד.
  tip: >-
    שעה מכסה את בית הכנסת ואת הרחובות סביבו. הוא אינו פתוח תמיד — המפתח אצל השכנים, ובדרך כלל די לשאול.
    גברים צריכים לכסות את הראש, וכיפות מונחות בכניסה. הכניסה חינם, אך יש קופת תרומות. שאלו לפני צילום
    בפנים. בית הקברות הישן במרחק כעשרים דקות הליכה מן המרכז, בשביל תלול ולא מסומן. שירותים ובתי קפה יש
    במרכז אוני.
  route: >-
    בית הכנסת נמצא במרכז אוני, ברובע היורד מן הכיכר אל הריוני — חמש דקות ברגל. ברכב מטביליסי 355 ק״מ דרך
    קותאיסי ומעבר נקראלה, אחר כך אמברולאורי ובמעלה עמק הריוני, כשש שעות. הכביש סלול ברובו, והקטע האחרון
    פרוץ. השאירו את הרכב ליד הכיכר המרכזית: סמטאות הרובע הישן צרות וחלקן ללא כביש. דלק באמברולאורי. רכב
    חסכוני מספיק.
ar:
  name: كنيس أوني
  short: كنيس من عام 1895 في حي أوني اليهودي القديم — من أكبر كُنُس جورجيا، وما زال عاملاً.
  body: >-
    **الكنيس هو المبنى الذي يُقزّم كل ما سواه في أوني.** أُقيم عام 1895 على نفقة الجالية اليهودية في البلدة،
    التي كانت يومئذ تشكّل حصة معتبرة من السكان وتدير معظم التجارة. وهو في الحجم يأتي بعد كنيسَي تبليسي
    وكوتايسي.


    بُني من حجر محلي، وله برجان مربعان في الواجهة الرئيسية ونوافذ معقودة غائرة. والطراز مختلط: عقود بيزنطية،
    وتفاصيل شرقية، وعناصر من الكلاسيكية الريفية. في الداخل قاعة عالية بشرفة للنساء محمولة على أعمدة خشبية
    وسقف مزخرف بالرسم. الأثاث متواضع، لكن حجم الفضاء مدهش لبلدة جبلية صغيرة.


    عاش اليهود في راتشا قروناً، وكانت جالية أوني تُعدّ من أقدم جاليات جورجيا. وفي النصف الثاني من القرن
    العشرين، ولا سيما منذ السبعينيات، هاجر معظمها إلى إسرائيل؛ ثم جاء زلزال 1991 الذي ضرب أوني بقسوة فأخذ
    معظم من بقي. وقد تضرر المبنى نفسه ورُمّم لاحقاً بمساعدة الشتات.


    واليوم لا تتعدى الجالية اليهودية في أوني بضع أسر، لكن الكنيس لم يتحول إلى قطعة متحفية: ما زالت تُقام
    فيه الصلوات بين حين وآخر. وإلى جانبه يمتد الحي اليهودي القديم: بيوت بحوانيت في الطابق الأرضي، وشرفات
    خشبية، وأزقة ضيقة تنحدر نحو ريوني. وعلى منحدر خارج البلدة تقع المقبرة اليهودية القديمة، وعلى حجارتها
    نقوش بالجورجية والعبرية.


    وما يجعل هذا أهم ما يُرى في أوني هو بالضبط أنه مبنى حيّ لجالية كادت تختفي.
  tip: >-
    ساعة تكفي للكنيس وللشوارع المحيطة. ليس مفتوحاً دائماً؛ المفتاح عند الجيران، والسؤال يكفي عادة. على
    الرجال تغطية الرؤوس، والقلنسوات موضوعة عند المدخل. الدخول مجاني، وإن كان هناك صندوق تبرعات. استأذن
    قبل التصوير في الداخل. المقبرة القديمة على بُعد نحو عشرين دقيقة سيراً من المركز، عبر درب حاد بلا لافتات.
    دورات المياه والمقاهي في وسط أوني.
  route: >-
    يقع الكنيس في وسط أوني، في الحي المنحدر من الساحة نحو ريوني — خمس دقائق سيراً. وبالسيارة من تبليسي
    355 كم عبر كوتايسي وممر ناكيرالا، ثم أمبرولاوري وصعوداً في وادي ريوني، نحو ست ساعات. الطريق معبّد
    في معظمه، ومقطعه الأخير متهالك. اترك السيارة قرب الساحة المركزية، فأزقة الحي القديم ضيقة وبعضها غير
    معبّد. الوقود في أمبرولاوري. وسيارة اقتصادية تكفي.
