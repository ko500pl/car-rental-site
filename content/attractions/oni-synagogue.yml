ka:
  name: ონის სინაგოგა
  short: >-
    საქართველოში სიდიდით მესამე სინაგოგა (1895): თაფლისფერი ქვის ნეომავრიტანული დარბაზი ღარებიანი გუმბათით,
    თემისთვის, რომელიც დღეს რამდენიმე ოჯახს ითვლის.
  body: >-
    **მთის ქალაქში, თუნუქის სახურავებსა და ხეხილის ბაღებს შორის, მავრიტანულ გუმბათს ნამდვილად არ ელით
    — ონის სინაგოგა კი ბააზოვის ქუჩაზე 1895 წლიდან დგას.**


    ეს საქართველოში სიდიდით მესამე სინაგოგაა, თბილისის დიდი სინაგოგისა და ქუთაისის სინაგოგის შემდეგ, და
    ის ოდესღაც ქვეყნის სიდიდით მესამე ებრაულ თემს ემსახურებოდა. ცნობების თანახმად, შენობა პოლონელმა არქიტექტორმა
    დააპროექტა, ააგეს კი თესალონიკიდან ჩამოსულმა ბერძენმა ებრაელებმა: ეს თაფლისფერი ქვით ნაგები გრძელი
    დარბაზია, თავისი დროისთვის დამახასიათებელ ეკლექტიკურ, ნეომავრიტანულ სტილში.


    შენობას ნელა შემოუარეთ. წყვილ სარკმლებს ნალისებრი თაღები ჩარჩოსავით ევლება, კარნიზის ქვეშ ტალღისებრი
    და ნიჟარისებრი ჩუქურთმის სარტყელი მიუყვება, კუთხეებზე ქვის ლარნაკისებრი დაბოლოებებია აღმართული. შუაში
    ამოზიდულ ყელს მრგვალი სარკმლები აქვს გაჭრილი, ზედ კი ღარებიანი რუხი გუმბათი ადგას, პატარა დავითის
    ვარსკვლავით დაგვირგვინებული. მოწმენდილ დღეს მას რაჭის მწვერვალები ზურგს უმაგრებს.


    1972 წელს თემი ჯერ კიდევ 3 150 წევრს ითვლიდა. მერე ისრაელში ემიგრაციის ტალღები წამოვიდა, 1991 წლის
    29 აპრილს კი რაჭის მიწისძვრამ შენობა მძიმედ დააზიანა. ოთხი წლის შემდეგ სინაგოგა სახელმწიფოსა და ამერიკული
    ებრაული ორგანიზაციის, „ჯოინტის“, დახმარებით აღადგინეს; ხელახალ კურთხევას პრეზიდენტი ედუარდ შევარდნაძე
    დაესწრო. 2015 წელს, როცა 120 წლისთავი პრემიერ-მინისტრ ირაკლი ღარიბაშვილის თანდასწრებით აღინიშნა, თემს
    სულ 16 წევრიღა შერჩენოდა. ამავე თემიდან იყვნენ ბააზოვები, რომელთა გვარსაც დღეს სინაგოგის ქუჩა ატარებს:
    რაბი დავით ბააზოვი, ქართული სიონიზმის ერთ-ერთი მეთაური, და მისი ვაჟი, 1938 წელს დახვრეტილი მწერალი
    გერცელ ბააზოვი.


    ლოცვა დღეს იშვიათად იმართება და კარი უფრო ხშირად დაკეტილია, ვიდრე ღია. საქართველოში ცოტა შენობა თუ
    მოგვითხრობს ასე ცხადად, რომ აქ ოდესღაც მთელი თემი ცხოვრობდა და ერთი ადამიანის სიცოცხლეში თითქმის მთლიანად
    წავიდა.
  tip: >-
    ერთი საათი საკმარისია. სინაგოგა ხშირად დაკეტილია, გასაღები კი მცველთანაა, ამიტომ მეზობლებს ან ქალაქის
    ცენტრში ჰკითხეთ და მოთმინება იქონიეთ: ზოგჯერ ამას ერთი სატელეფონო ზარი და ცოტა ლოდინი სჭირდება. შესვლა
    უფასოა, შემოწირულობა კი სასურველი. შიგნით მამაკაცებმა თავი უნდა დაიფარონ. ინტერიერის გადაღებამდე ნებართვა
    ითხოვეთ, და თუ ვინმე ლოცულობს, ხმადაბლა ილაპარაკეთ. მოწმენდილ დღეს ფასადის უკან აღმართული მთები კადრს
    თავად აწყობს. ტუალეტი და კაფეები ონის ცენტრშია, რამდენიმე წუთის სავალზე.
  route: >-
    სინაგოგა ბააზოვის ქუჩის №53-ში დგას, ცენტრიდან რამდენიმე წუთის სავალზე; მანქანის დასაყენებელი ადგილი
    ქუჩის პირას, როგორც წესი, მოიძებნება. თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190
    კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს შორის ჩრდილოეთით, შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე
    ადით, შ17-ით ნაქერალას უღელტეხილი გადაიარეთ ამბროლაურამდე, ბოლოს კი შ16-ით რიონის ხეობას 30 კილომეტრი
    აჰყევით. სულ დაახლოებით 295 კმ და გაუჩერებლად ხუთიოდე საათი, მთელ გზაზე ასფალტით. ეკონომ-კლასის მანქანა
    საკმარისია. ავზი ამბროლაურში შეავსეთ, ვიწრო ხეობაში კი წვიმის შემდეგ ფრთხილად იარეთ — ფერდობებიდან
    ქვა ცვივა.
en:
  name: Oni Synagogue
  short: >-
    Georgia's third-largest synagogue (1895): a Moorish Revival hall of honey-coloured stone under a ribbed
    dome, built for a community now counted in families.
  body: >-
    **In a mountain town of tin roofs and orchards, a Moorish dome is the last thing you expect, yet Oni's
    synagogue has stood on Baazov Street since 1895.**


    It is the third-largest synagogue in Georgia, after the Great Synagogue of Tbilisi and the synagogue
    of Kutaisi, and it served what was once the country's third-largest Jewish community. By most accounts
    a Polish architect designed it and Greek Jews from Thessaloniki built it: a long hall of honey-coloured
    stone in the eclectic Moorish Revival style of its day.


    Walk round it slowly. Horseshoe arches frame paired windows; bands of carving, waves and scallops,
    run beneath the cornice; stone finials shaped like vases stand at the corners. In the middle rises
    a drum pierced with round windows, and on it a ribbed grey dome crowned by a small Star of David.
    On a clear day the Racha peaks stand directly behind it.


    In 1972 the congregation still numbered 3,150. Then came the waves of emigration to Israel, and on
    29 April 1991 the Racha earthquake left the building badly damaged. It was restored four years later
    with help from the Georgian state and the American Jewish Joint Distribution Committee, and President
    Eduard Shevardnadze attended the rededication. By 2015, when the 120th anniversary was marked in the
    presence of Prime Minister Irakli Garibashvili, only 16 members remained. The community also produced
    the Baazovs, whose name the synagogue's street now bears: Rabbi David Baazov, a leading figure of
    Georgian Zionism, and his son Gerzel, a writer executed in 1938.


    Services are rare now, and the door is more often locked than open. Few buildings in Georgia say so
    plainly that a whole community once lived here, and that within a single lifetime almost all of it
    left.
  tip: >-
    Allow an hour. The synagogue is often locked and a caretaker keeps the key, so ask the neighbours
    or in the town centre and be patient: sometimes it takes a phone call and a short wait. Entry is free;
    a donation is welcome. Men should cover their heads inside. Ask before photographing the interior,
    and keep your voice low if anyone is praying. On a clear day the mountains behind the façade compose
    the photograph for you. Toilets and cafés are in the centre of Oni, a few minutes' walk away.
  route: >-
    The synagogue stands at 53 Baazov Street, a few minutes' walk from the centre, and there is usually
    room to park along the kerb. From Tbilisi take the S1 (E60) west for about 190 km, turn north between
    Zestaponi and Kutaisi on the Sh19 through Terjola to Tkibuli, cross the Nakerala pass on the Sh17
    to Ambrolauri, then drive 30 km up the Rioni on the Sh16. That makes about 295 km and roughly five
    hours without stops, all on asphalt. An economy car is enough. Fill up in Ambrolauri, and drive the
    narrow valley road carefully after rain, when stones come down.
ru:
  name: Синагога Они
  short: >-
    Третья по величине синагога Грузии (1895): неомавританский зал из медового камня под ребристым куполом
    — для общины, которую теперь считают по семьям.
  body: >-
    **В горном городке жестяных крыш и садов мавританский купол — последнее, что ожидаешь увидеть, но
    синагога Они стоит на улице Баазова с 1895 года.**


    Это третья по величине синагога Грузии после Большой синагоги Тбилиси и синагоги Кутаиси, и служила
    она некогда третьей по величине еврейской общине страны. По большинству свидетельств, спроектировал
    её польский архитектор, а построили евреи-греки из Салоник: длинный зал из камня медового цвета в
    эклектичном неомавританском стиле своего времени.


    Обойдите её не спеша. Подковообразные арки обрамляют парные окна; под карнизом тянутся резные пояса
    — волны и фестоны; по углам стоят каменные навершия в форме ваз. В середине поднимается барабан, прорезанный
    круглыми окнами, а на нём — ребристый серый купол, увенчанный маленькой звездой Давида. В ясный день
    прямо за ним встают вершины Рачи.


    В 1972 году община ещё насчитывала 3150 человек. Затем пошли волны эмиграции в Израиль, а 29 апреля
    1991 года Рачинское землетрясение тяжело повредило здание. Через четыре года его восстановили при
    поддержке грузинского государства и американской организации «Джойнт» (Американский еврейский объединённый
    распределительный комитет), и на повторном освящении присутствовал президент Эдуард Шеварднадзе. К
    2015 году, когда 120-летие отмечали в присутствии премьер-министра Ираклия Гарибашвили, в общине оставалось
    лишь 16 человек. Из этой же общины вышли Баазовы, чью фамилию теперь носит улица синагоги: раввин
    Давид Баазов, одна из ведущих фигур грузинского сионизма, и его сын Герцель, писатель, расстрелянный
    в 1938 году.


    Службы теперь редки, и дверь чаще заперта, чем открыта. Немногие здания в Грузии говорят так прямо:
    здесь когда-то жила целая община, и за одну человеческую жизнь почти вся она уехала.
  tip: >-
    Отведите на визит час. Синагога часто заперта, ключ хранит смотритель, поэтому спросите у соседей
    или в центре города и наберитесь терпения: иногда приходится позвонить и немного подождать. Вход бесплатный,
    пожертвование приветствуется. Мужчинам внутри следует покрыть голову. Прежде чем фотографировать интерьер,
    спросите разрешения, и говорите тише, если кто-то молится. В ясный день горы за фасадом сами выстраивают
    кадр. Туалеты и кафе — в центре Они, в нескольких минутах ходьбы.
  route: >-
    Синагога стоит на улице Баазова, 53, в нескольких минутах ходьбы от центра; место для парковки у тротуара
    обычно есть. Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север
    на Sh19 и через Терджолу доезжайте до Ткибули, по Sh17 через перевал Накерала доберитесь до Амбролаури,
    затем 30 км вверх по Риони по Sh16. Всего около 295 км и примерно пять часов без остановок, всё по
    асфальту. Машины эконом-класса достаточно. Заправьтесь в Амбролаури и после дождя осторожно ведите
    машину по узкой дороге в долине: сверху сыплются камни.
fa:
  name: کنیسهٔ اونی
  short: >-
    سومین کنیسهٔ بزرگ گرجستان (۱۸۹۵): تالاری به سبک احیای موری از سنگ عسلی‌رنگ زیر گنبدی شیاردار، ساخته
    برای جامعه‌ای که اکنون تنها چند خانواده است.
  body: >-
    **در شهری کوهستانی با بام‌های حلبی و باغ‌های میوه، گنبدی موری آخرین چیزی است که انتظارش را دارید؛
    با این همه، کنیسهٔ اونی از سال ۱۸۹۵ در خیابان باازوف ایستاده است.**


    این سومین کنیسهٔ بزرگ گرجستان است، پس از کنیسهٔ بزرگ تفلیس و کنیسهٔ کوتائیسی، و روزگاری به سومین جامعهٔ
    بزرگ یهودیان این کشور خدمت می‌کرد. به روایت بیشتر منابع، معماری لهستانی آن را طراحی کرد و یهودیان
    یونانی از تسالونیکی آن را ساختند: تالاری دراز از سنگ عسلی‌رنگ به سبک التقاطیِ احیای موری که در زمان
    خود رواج داشت.


    آرام دورش بگردید. طاق‌های نعل‌اسبی پنجره‌های جفت را قاب گرفته‌اند؛ نوارهایی از کنده‌کاری، با نقش موج
    و صدف، زیر قرنیز کشیده شده‌اند؛ و در گوشه‌ها تاج‌هایی سنگی به شکل گلدان ایستاده‌اند. در میانه، ساقه‌ای
    با پنجره‌های گرد بالا می‌رود و بر آن گنبدی خاکستری و شیاردار نشسته که ستارهٔ داوودی کوچک بر تارکش
    است. در روزهای صاف، قله‌های راچا درست پشت آن سر برمی‌آورند.


    در سال ۱۹۷۲ این جماعت هنوز ۳۱۵۰ عضو داشت. سپس موج‌های مهاجرت به اسرائیل آمد، و در ۲۹ آوریل ۱۹۹۱ زمین‌لرزهٔ
    راچا آسیب سختی به بنا زد. چهار سال بعد، با کمک دولت گرجستان و «جوینت» (کمیتهٔ توزیع مشترک یهودیان
    آمریکا) مرمت شد و رئیس‌جمهور ادوارد شواردنادزه در مراسم بازگشایی‌اش حضور یافت. تا سال ۲۰۱۵، که صدوبیستمین
    سالگرد آن با حضور نخست‌وزیر، ایراکلی غاریباشویلی، برگزار شد، تنها ۱۶ عضو باقی مانده بودند. خاندان
    باازوف، که خیابان کنیسه امروز نام آنان را بر خود دارد، نیز از همین جامعه برخاست: خاخام داوید باازوف،
    از چهره‌های برجستهٔ صهیونیسم در گرجستان، و پسرش گرتسل، نویسنده‌ای که در سال ۱۹۳۸ اعدام شد.


    اکنون مراسم عبادت به‌ندرت برگزار می‌شود و درِ کنیسه بیشتر بسته است تا باز. کمتر بنایی در گرجستان این‌چنین
    بی‌پرده می‌گوید که روزگاری جامعه‌ای کامل اینجا زندگی می‌کرد و در طول تنها یک عمر، تقریباً همه‌اش رفت.
  tip: >-
    یک ساعت وقت بگذارید. کنیسه اغلب بسته است و کلیدش دست سرایدار است، پس از همسایه‌ها یا در مرکز شهر بپرسید
    و صبور باشید: گاهی یک تماس تلفنی و کمی انتظار لازم است. ورود رایگان است و کمک مالی پذیرفته می‌شود.
    مردان باید درون کنیسه سر خود را بپوشانند. پیش از عکاسی از فضای داخلی اجازه بگیرید و اگر کسی مشغول
    نیایش است، آهسته سخن بگویید. در روز صاف، کوه‌های پشت نما خودشان قاب عکس را می‌چینند. سرویس بهداشتی
    و کافه در مرکز اونی است، چند دقیقه پیاده.
  route: >-
    کنیسه در شمارهٔ ۵۳ خیابان باازوف، چند دقیقه پیاده از مرکز شهر، قرار دارد و معمولاً کنار پیاده‌رو جای
    پارک هست. از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سمت غرب بروید، میان زستافونی و کوتائیسی به
    جادهٔ Sh19 به سمت شمال بپیچید و از راه ترجولا به تکیبولی برسید، با جادهٔ Sh17 از گردنهٔ ناکرالا تا
    آمبرولائوری بروید و سپس ۳۰ کیلومتر با جادهٔ Sh16 در امتداد ریونی بالا بروید. روی‌هم حدود ۲۹۵ کیلومتر
    و نزدیک به پنج ساعت بدون توقف، همه روی آسفالت. خودروی اقتصادی کافی است. در آمبرولائوری سوخت بگیرید
    و پس از باران در جادهٔ باریک دره با احتیاط برانید، چون سنگ از بالا فرو می‌ریزد.
he:
  name: בית הכנסת של אוני
  short: >-
    בית הכנסת השלישי בגודלו בגאורגיה (1895): אולם בסגנון התחייה המורית מאבן בגוון דבש תחת כיפה מצולעת,
    שנבנה עבור קהילה שהיום סופרים אותה במשפחות.
  body: >-
    **בעיירת הרים של גגות פח ומטעים, כיפה מורית היא הדבר האחרון שמצפים לראות — ובכל זאת בית הכנסת של אוני
    עומד ברחוב באזוב מאז 1895.**


    זהו בית הכנסת השלישי בגודלו בגאורגיה, אחרי בית הכנסת הגדול של טביליסי ובית הכנסת של קוטאיסי, והוא
    שירת את מה שהייתה פעם הקהילה היהודית השלישית בגודלה במדינה. לפי רוב המקורות תכנן אותו אדריכל פולני
    ובנו אותו יהודים יוונים מסלוניקי: אולם מוארך מאבן בגוון דבש, בסגנון האקלקטי של התחייה המורית שרווח
    בזמנו.


    הקיפו אותו לאט. קשתות פרסה ממסגרות זוגות של חלונות; מתחת לכרכוב נמשכות רצועות גילוף של גלים וצדפות;
    ובפינות ניצבים עיטורי פסגה מאבן בצורת כדים. באמצע מתנשא תוף מנוקב בחלונות עגולים, ועליו כיפה אפורה
    מצולעת שבראשה מגן דוד קטן. ביום בהיר פסגות ראצ'ה מזדקפות ממש מאחוריו.


    ב-1972 מנתה הקהילה עדיין 3,150 נפש. אחר כך באו גלי העלייה לישראל, וב-29 באפריל 1991 גרמה רעידת האדמה
    של ראצ'ה נזק כבד למבנה. כעבור ארבע שנים הוא שוקם בסיוע המדינה הגאורגית וארגון הג'וינט האמריקאי, והנשיא
    אדוארד שוורדנדזה השתתף בטקס חנוכתו המחודשת. עד 2015, כשצוין יום השנה ה-120 בנוכחות ראש הממשלה איראקלי
    גריבשווילי, נותרו בקהילה 16 חברים בלבד. מן הקהילה הזאת יצאה גם משפחת באזוב, שאת שמה נושא היום רחוב
    בית הכנסת: הרב דוד באזוב, מראשי התנועה הציונית בגאורגיה, ובנו הרצל, סופר שהוצא להורג ב-1938.


    תפילות מתקיימות כאן היום לעתים רחוקות, והדלת נעולה יותר משהיא פתוחה. מעט בניינים בגאורגיה אומרים בפשטות
    כזאת שפעם חיה כאן קהילה שלמה, ושבתוך חיים של אדם אחד כמעט כולה עזבה.
  tip: >-
    הקדישו לביקור שעה. בית הכנסת נעול לעתים קרובות והמפתח אצל השומר, אז שאלו את השכנים או במרכז העיירה
    והתאזרו בסבלנות: לפעמים צריך שיחת טלפון והמתנה קצרה. הכניסה חינם, ותרומה תתקבל בברכה. גברים צריכים
    לחבוש כיסוי ראש בפנים. בקשו רשות לפני שאתם מצלמים את הפנים, ודברו בשקט אם מישהו מתפלל. ביום בהיר ההרים
    שמאחורי החזית מרכיבים את התמונה בשבילכם. שירותים ובתי קפה נמצאים במרכז אוני, כמה דקות הליכה משם.
  route: >-
    בית הכנסת עומד ברחוב באזוב 53, כמה דקות הליכה מהמרכז, ובדרך כלל יש מקום לחנות לצד המדרכה. מטביליסי
    סעו מערבה בכביש S1 ‏(E60) כ-190 ק"מ, בין זסטאפוני לקוטאיסי פנו צפונה לכביש Sh19 דרך טרג'ולה עד טקיבולי,
    חצו את מעבר נקראלה בכביש Sh17 עד אמברולאורי, ומשם סעו 30 ק"מ במעלה הריוני בכביש Sh16. בסך הכול כ-295
    ק"מ וכחמש שעות בלי עצירות, הכול על כביש סלול. רכב מקטגוריית אקונומי מספיק. תדלקו באמברולאורי, ואחרי
    גשם נהגו בזהירות בכביש העמק הצר, כשאבנים מתדרדרות אליו.
ar:
  name: كنيس أوني
  short: >-
    ثالث أكبر كنيس في جورجيا (1895): قاعة على طراز الإحياء الموريسكي من حجر بلون العسل تحت قبة مضلّعة،
    بُنيت لجالية باتت اليوم تُعدّ بالأسر.
  body: >-
    **في بلدة جبلية من سقوف الصفيح والبساتين، آخر ما تتوقعه قبةٌ موريسكية، ومع ذلك يقف كنيس أوني في شارع
    باازوف منذ عام 1895.**


    إنه ثالث أكبر كنيس في جورجيا، بعد الكنيس الكبير في تبليسي وكنيس كوتايسي، وقد خدم ما كان يوماً ثالث
    أكبر جالية يهودية في البلاد. وتفيد أغلب الروايات بأن مهندساً معمارياً بولندياً صمّمه، وأن يهوداً يونانيين
    من سالونيك بنوه: قاعة مستطيلة طويلة من حجر بلون العسل على الطراز الانتقائي لإحياء العمارة الموريسكية
    الذي ساد في زمنه.


    طُف حوله متمهّلاً. أقواس على هيئة حدوة الفرس تؤطّر نوافذ مزدوجة؛ وتحت الإفريز تمتد أشرطة منحوتة من
    الأمواج والأصداف؛ وعند الزوايا تنتصب ذُرى حجرية زخرفية على هيئة مزهريات. وفي الوسط ترتفع رقبة تخترقها
    نوافذ مستديرة، تعلوها قبة رمادية مضلّعة تتوّجها نجمة داود صغيرة. وفي يوم صحو تنتصب قمم راتشا خلفه
    مباشرة.


    في عام 1972 كان عدد أبناء الجالية لا يزال 3150. ثم جاءت موجات الهجرة إلى إسرائيل، وفي 29 أبريل 1991
    ألحق زلزال راتشا بالمبنى أضراراً جسيمة. رُمّم بعد أربع سنوات بمساعدة الدولة الجورجية ولجنة التوزيع
    المشتركة اليهودية الأمريكية («الجوينت»)، وحضر الرئيس إدوارد شيفاردنادزه إعادة تدشينه. وبحلول عام 2015،
    حين أُحييت الذكرى العشرون بعد المئة لتأسيسه بحضور رئيس الوزراء إيراكلي غاريباشفيلي، لم يبقَ من أعضاء
    الجالية سوى 16. ومن هذه الجالية أيضاً خرجت أسرة باازوف، التي يحمل شارع الكنيس اليوم اسمها: الحاخام
    داود باازوف، أحد أبرز وجوه الحركة الصهيونية في جورجيا، وابنه غيرتسل، الكاتب الذي أُعدم عام 1938.


    أصبحت الصلوات نادرة الآن، والباب مقفل أكثر مما هو مفتوح. وقليلة هي المباني في جورجيا التي تقول بهذا
    الوضوح إن جالية كاملة عاشت هنا يوماً، وإنها رحلت كلها تقريباً في غضون عمر إنسان واحد.
  tip: >-
    خصّص للزيارة ساعة. كثيراً ما يكون الكنيس مقفلاً والمفتاح مع الحارس، فاسأل الجيران أو في وسط البلدة
    وتحلَّ بالصبر: أحياناً يلزم اتصال هاتفي وانتظار قصير. الدخول مجاني، والتبرّع موضع ترحيب. على الرجال
    تغطية رؤوسهم في الداخل. استأذن قبل تصوير الداخل، واخفض صوتك إن كان أحد يصلّي. وفي يوم صحو تتكفّل الجبال
    خلف الواجهة بتكوين الصورة نيابةً عنك. دورات المياه والمقاهي في وسط أوني، على بُعد دقائق سيراً.
  route: >-
    يقع الكنيس في الرقم 53 بشارع باازوف، على بُعد دقائق سيراً من الوسط، وعادةً ما يتوفر مكان للوقوف بمحاذاة
    الرصيف. من تبليسي اسلك الطريق S1 ‏(E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى
    الطريق Sh19 عبر تيرجولا حتى تكيبولي، واعبر ممر ناكيرالا على الطريق Sh17 إلى أمبرولاوري، ثم قُد 30
    كم صعوداً مع ريوني على الطريق Sh16. المجموع نحو 295 كم وقرابة خمس ساعات دون توقف، كلها على طريق معبّد.
    تكفي سيارة اقتصادية. تزوّد بالوقود في أمبرولاوري، وقُد بحذر على طريق الوادي الضيق بعد المطر، حين تتساقط
    الحجارة.
