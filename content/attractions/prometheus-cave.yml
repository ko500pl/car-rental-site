ka:
  name: პრომეთეს მღვიმე
  short: >-
    ექვსი განათებული დარბაზი იმერეთის კარსტის სიღრმეში: 1984 წელს აღმოჩენილი, ერთი სოფლელის ერთგულებით
    გადარჩენილი და, სურვილისამებრ, ნავით დასრულებული.
  body: >-
    **საბჭოთა კავშირის დაშლის შემდეგ წლების განმავლობაში პრომეთეს მღვიმესა და ვანდალებს შორის მხოლოდ ერთი
    ადგილობრივი კაცი და მისი ძაღლი იდგნენ.**


    მღვიმეს 1984 წლის ივლისში, სოფელ ყუმისთავთან, წყალტუბოდან ექვს კილომეტრში, ვახუშტი ბაგრატიონის სახელობის
    გეოგრაფიის ინსტიტუტის სპელეოლოგებმა ჯუმბერ ჯიშკარიანის ხელმძღვანელობით მიაგნეს. მომდევნო წელს მისი
    მოწყობა დაიწყეს და 1989 წლისთვის უკვე იყო დაახლოებით კილომეტრიანი ბილიკი, კიბეები, 150-მეტრიანი გასასვლელი
    გვირაბი და დროებითი განათება მცირე ჯგუფებისთვის. მერე საბჭოთა კავშირი დაიშალა, ფული გაქრა და 1990
    წელს პროექტი შეჩერდა. ცარიელ დარბაზებს წლების განმავლობაში ერთი სოფლელი დარაჯობდა; დღეს შესასვლელთან
    მისი და მისი ძაღლის ქანდაკება დგას.


    მღვიმე 2011 წლის 26 მაისს ახალი სახელით გაიხსნა. ადგილობრივი გადმოცემით, პრომეთე ახლომახლო, ხვამლის
    კლდეებზე იყო მიჯაჭვული და მას ყორანი ტანჯავდა. 2010 წელს მღვიმე პრეზიდენტმა მიხეილ სააკაშვილმა მოინახულა
    და მისთვის სწორედ პრომეთეს სახელის დარქმევა შესთავაზა.


    ოცდაორი დარბაზიდან ექვსია ღია და მათი სახელებიც მითს აგრძელებს: არგონავტების, კოლხეთის, მედეას, სიყვარულის,
    პრომეთეს და იბერიის დარბაზები. ბილიკი დაახლოებით 1,4 კილომეტრზე მიიკლაკნება მუდმივ 14 გრადუსში — რვა-ათმეტრიან
    სტალაგმიტებს, ნაღვენთ ფარდებსა და ჰელიქტიტებს შორის, რომლებიც გვერდულად იზრდება, თითქოს მიზიდულობის
    კანონი მათთვის არ იყოს დაწერილი. ფერადი განათება ნამდვილი თეატრია: შეიძლება მოგეწონოთ, შეიძლება ფანარი
    და ნამდვილი სიბნელე მოგენატროთ, მაგრამ მღვიმის მასშტაბი არც ერთზეა დამოკიდებული.


    ბოლო მონაკვეთი წყალს ეკუთვნის: ნავები 380-მეტრიან ტბაზე დაცურავს, რომელსაც მიწისქვეშა მდინარე კვებავს.
    ეს მდინარე დაახლოებით 30 კილომეტრზეა გამოკვლეული.


    ზედაპირზე თვალებმოჭუტული ამოდიხართ იმერეთის მწვანე სიცხეში, მღვიმის სიგრილე კი კიდევ დიდხანს გრჩებათ
    სახელოებში.
  tip: >-
    აგვისტოშიც თბილი რამ წამოიღეთ: მიწის ქვეშ 14 გრადუსია, ექსკურსია კი დაახლოებით ერთ საათს გრძელდება.
    ფეხსაცმელი მოუსრიალებელი ძირით უნდა იყოს, რადგან ბეტონის ბილიკი მუდამ სველია. დათვალიერება ჯგუფებად,
    გიდის თანხლებით მიმდინარეობს; ბილეთი დაახლოებით 25 ლარი ღირს, ნავი — კიდევ დაახლოებით 20 ლარი. ზაფხულში
    რიგს შეიძლება ნახევარი საათი დაელოდოთ, ამიტომ ჯობია გახსნისთანავე ან შუადღის მეორე ნახევარში მიხვიდეთ.
    ნავით სხვა გასასვლელთან ამოხვალთ, ვიდრე ფეხით მოსიარულეები. კაფე, ტუალეტი და პარკინგი შესასვლელთანაა.
    შესვლამდე მცველისა და მისი ძაღლის ქანდაკებასაც შეხედეთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით
    მიდიხართ ქუთაისამდე, დაახლოებით 220 კმ. ქუთაისიდან შ15-ს წყალტუბოსკენ დაადექით, იქიდან კი ნიშნებს
    მიჰყევით ყუმისთავამდე და მღვიმემდე. სულ დაახლოებით 250 კმ-ია და სამი საათი და ორმოცდახუთი წუთი, მთლიანად
    ასფალტზე; ბოლო რამდენიმე კილომეტრი ვიწრო სოფლის გზაა, მაგრამ სირთულეს არ ქმნის, ამიტომ ეკონომ კლასის
    მანქანა ნებისმიერ სეზონში საკმარისია. საწვავი და ბანკომატი ქუთაისსა და წყალტუბოშია. სათაფლია იმავე
    გზიდან მცირე გადახვევითაა, ამიტომ ორივე ერთ დღეში ბუნებრივად ეწყობა.
en:
  name: Prometheus Cave
  short: >-
    Six lit halls in the Imereti karst, found in 1984, guarded through the lean years by one villager,
    and, for a few lari more, left by boat on a hidden lake.
  body: >-
    **For years after the Soviet Union fell, the only thing standing between Prometheus Cave and the vandals
    was a man from the village and his dog.**


    Speleologists from the Vakhushti Bagrationi Institute of Geography, led by Jumber Jishkariani, found
    the cave in July 1984 near the village of Kumistavi, six kilometres from Tskaltubo. Work to open it
    began the next year, and by 1989 there was about a kilometre of path, stairs, a 150-metre exit tunnel
    and temporary lights for small groups. Then the Union collapsed, the money vanished and the project
    was shut in 1990. A local man kept watch over the empty halls; a statue of him and his dog now greets
    you at the entrance.


    The cave reopened on 26 May 2011 under a new name. Local legend holds that Prometheus was chained
    to the cliffs of nearby Mount Khvamli, where a raven tormented him, and in 2010 President Mikheil
    Saakashvili proposed naming the cave after him.


    Of 22 halls, six are open, and their names keep the myth going: Argonauts, Colchis, Medea, Love, Prometheus,
    Iberia. The path winds for about 1.4 kilometres at a constant 14 °C, past stalagmites eight to ten
    metres tall, curtains of flowstone and helictites that grow sideways as if gravity were optional.
    The coloured lighting is pure theatre; you may love it or long for a torch and honest darkness, but
    the scale does not depend on either.


    The last stretch belongs to the water: a 380-metre lake carries the boats, fed by a river explored
    for some 30 kilometres underground.


    You surface blinking into the green heat of Imereti, and the cave's chill stays in your sleeves a
    while longer.
  tip: >-
    Bring a warm layer even in August: it is 14 °C underground and the guided tour lasts about an hour.
    Wear shoes with grip, because the concrete path is always wet. Visits run in groups; tickets are around
    25 lari, with the boat about 20 more, and in summer you may wait half an hour for a slot, so come
    at opening time or in mid-afternoon. The boat surfaces at a different exit from the walking route.
    Café, toilets and parking are at the entrance. Before you go in, find the statue of the guardian and
    his dog.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri, over the Rikoti Pass and on to Kutaisi,
    about 220 km. In Kutaisi pick up the Sh15 towards Tskaltubo, then follow signs to Kumistavi and the
    cave. In total it is about 250 km and three hours forty-five, asphalt all the way; the last few kilometres
    are a narrow village road but pose no difficulty, so an economy car is enough in any season. Refuel
    and find an ATM in Kutaisi or Tskaltubo. Sataplia is a short detour off the same road, so the two
    pair naturally in one day.
ru:
  name: Пещера Прометея
  short: >-
    Шесть освещённых залов в имеретинском карсте: найдены в 1984-м, спасены сельчанином, а за доплату
    их покидают на лодке по подземному озеру.
  body: >-
    **Долгие годы после распада Советского Союза единственным, что стояло между пещерой Прометея и вандалами,
    был человек из соседнего села и его собака.**


    Спелеологи Института географии имени Вахушти Багратиони под руководством Джумбера Джишкариани нашли
    пещеру в июле 1984 года у села Кумистави, в шести километрах от Цхалтубо. Работы по её обустройству
    начались на следующий год, и к 1989 году там был примерно километр троп, лестницы, 150-метровый выходной
    тоннель и временное освещение для небольших групп. Затем Союз рухнул, деньги исчезли, и в 1990 году
    проект закрыли. Все эти годы пустые залы сторожил местный житель; сегодня у входа посетителей встречает
    его статуя вместе с собакой.


    Пещера вновь открылась 26 мая 2011 года под новым именем. Местная легенда гласит, что Прометей был
    прикован к скалам соседней горы Хвамли, где его терзал ворон, и в 2010 году президент Михаил Саакашвили
    предложил назвать пещеру в его честь.


    Из 22 залов открыты шесть, и их названия продолжают миф: Аргонавты, Колхида, Медея, Любовь, Прометей,
    Иберия. Тропа вьётся около 1,4 км при постоянной температуре 14 °C, минуя сталагмиты высотой 8–10
    метров, натёчные занавесы и геликтиты, растущие в сторону, будто не подчиняясь силе тяжести. Цветная
    подсветка — чистый театр; можно её полюбить или мечтать о фонарике и честной темноте, но масштаб от
    этого не меняется.


    Последний отрезок принадлежит воде: лодки скользят по 380-метровому озеру, которое питает подземная
    река, исследованная примерно на 30 км.


    Вы выходите на поверхность, щурясь, в зелёный зной Имерети, а пещерная прохлада ещё долго держится
    в рукавах.
  tip: >-
    Берите тёплую вещь даже в августе: под землёй 14 °C, а экскурсия длится около часа. Наденьте обувь
    с хорошим сцеплением — бетонная тропа всегда влажная. Посещение — только в группах с гидом; билеты
    стоят около 25 лари, лодка — ещё около 20, а летом можно ждать своей очереди полчаса, так что приезжайте
    к открытию или во второй половине дня. Лодка выходит на поверхность не там, где заканчивается пешеходный
    маршрут. Кафе, туалеты и парковка — у входа. Перед тем как войти, найдите статую хранителя и его собаки.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад через Гори и Хашури, через Рикотский перевал, до Кутаиси —
    около 220 км. В Кутаиси выезжайте на Ш15 в сторону Цхалтубо, затем следуйте указателям на Кумистави
    и пещеру. Всего около 250 км и три часа сорок пять минут, весь путь асфальтирован; последние несколько
    километров — узкая сельская дорога, но без сложностей, так что экономичный автомобиль подойдёт в любое
    время года. Заправляйтесь и ищите банкомат в Кутаиси или Цхалтубо. Сатаплия — небольшой крюк с той
    же дороги, так что оба места легко объединить в один день.
fa:
  name: غار پرومتئوس
  short: >-
    شش تالار روشن در کارست ایمرتی: کشف‌شده در ۱۹۸۴، نگه‌داشته در سال‌های سخت به دست یک روستایی، و با چند
    لاری بیشتر، پایان سفر با قایق بر دریاچه‌ای زیرزمینی.
  body: >-
    **سال‌ها پس از فروپاشی اتحاد جماهیر شوروی، تنها چیزی که میان غار پرومتئوس و ویرانگران ایستاده بود،
    مردی از روستا و سگش بود.**


    غارشناسانِ انستیتوی جغرافیای واخوشتی باگراتیونی، به سرپرستی جومبر جیشکاریانی، این غار را در ژوئیه‌ی
    ۱۹۸۴ نزدیک روستای کومیستاوی، در شش کیلومتری تسکالتوبو، یافتند. کار برای گشودن آن سال بعد آغاز شد،
    و تا سال ۱۹۸۹ حدود یک کیلومتر مسیر، پله، تونل خروجی ۱۵۰ متری، و روشنایی موقت برای گروه‌های کوچک فراهم
    بود. سپس اتحاد فروپاشید، پول ناپدید شد، و طرح در سال ۱۹۹۰ بسته شد. مردی محلی از تالارهای خالی نگهبانی
    می‌کرد؛ امروز مجسمه‌ی او و سگش در ورودی به شما خوش‌آمد می‌گوید.


    غار در ۲۶ مه ۲۰۱۱ با نامی تازه بازگشایی شد. افسانه‌ی محلی می‌گوید پرومتئوس را به صخره‌های کوه خواملی
    نزدیک زنجیر کرده بودند، جایی که کلاغی او را می‌آزرد، و در سال ۲۰۱۰ رئیس‌جمهور میخائیل ساکاشویلی نامیدن
    غار به نام او را پیشنهاد داد.


    از ۲۲ تالار، شش تالار گشوده‌اند، و نام‌هایشان افسانه را زنده نگه می‌دارد: آرگوناوت‌ها، کلخیس، مدئا،
    عشق، پرومتئوس، ایبریا. مسیر حدود ۱٫۴ کیلومتر در دمای ثابت ۱۴ درجه پیچ می‌خورد، از میان استالاگمیت‌هایی
    به بلندی هشت تا ده متر، پرده‌هایی از رسوب سنگی، و هلیکتیت‌هایی که به‌پهلو رشد می‌کنند، گویی جاذبه
    اختیاری است. نورپردازی رنگی، تئاتری محض است؛ می‌توانید عاشقش شوید یا آرزوی چراغ‌قوه و تاریکی راستین
    را داشته باشید، اما بزرگی غار به هیچ‌یک از این‌ها وابسته نیست.


    آخرین بخش از آنِ آب است: قایق‌ها بر دریاچه‌ای به طول ۳۸۰ متر می‌رانند که رودی زیرزمینی آن را تغذیه
    می‌کند؛ رودی که حدود ۳۰ کیلومتر از مسیرش کاوش شده است.


    با چشمانی تنگ‌شده از نور به گرمای سبز ایمرتی بیرون می‌آیید، و خنکای غار مدتی بیشتر در آستین‌هایتان
    می‌ماند.
  tip: >-
    حتی در اوت لباس گرمی همراه ببرید: زیرزمین ۱۴ درجه است و تور راهنمایی حدود یک ساعت طول می‌کشد. کفشی
    با زیره‌ی ضدلغزش بپوشید، چون مسیر سیمانی همیشه مرطوب است. بازدیدها گروهی است؛ بلیت حدود ۲۵ لاری است،
    قایق حدود ۲۰ لاری بیشتر، و در تابستان ممکن است نیم‌ساعتی برای نوبت منتظر بمانید، پس هنگام بازشدن در
    یا اواسط بعدازظهر بیایید. قایق شما را به خروجی دیگری جز خروجی مسیر پیاده می‌رساند. کافه، سرویس بهداشتی
    و پارکینگ در ورودی است. پیش از ورود، مجسمه‌ی نگهبان و سگش را بیابید.
  route: >-
    از تفلیس از مسیر S1 (E60) به سوی غرب بروید و با گذر از گوری، خاشوری و گردنه‌ی ریکوتی به کوتائیسی برسید؛
    حدود ۲۲۰ کیلومتر. در کوتائیسی، Sh15 را به سوی تسکالتوبو بگیرید، سپس نشانه‌ها را به سوی کومیستاوی و
    غار دنبال کنید. در مجموع حدود ۲۵۰ کیلومتر و سه ساعت و چهل‌وپنج دقیقه راه است، سراسر آسفالت؛ چند کیلومتر
    پایانی راهی باریک روستایی است اما دشواری ندارد، پس خودرویی معمولی در هر فصلی کافی است. در کوتائیسی
    یا تسکالتوبو سوخت‌گیری کنید و دستگاه خودپرداز بیابید. ساتاپلیا انحرافی کوتاه از همان راه است، پس این
    دو به‌راحتی در یک روز جا می‌شوند.
he:
  name: מערת פרומתאוס
  short: >-
    שישה אולמות מוארים בעומק הקארסט של אימרתי, שנתגלו ב-1984 ונשמרו בשנים הקשות בידי כפרי אחד, ותמורת
    תוספת קטנה יוצאים מהם בסירה על אגם תת-קרקעי.
  body: >-
    **במשך שנים אחרי קריסת ברית המועצות, הדבר היחיד שעמד בין מערת פרומתאוס לוונדלים היה איש מהכפר וכלבו.**


    חוקרי מערות מהמכון הגאוגרפי ע"ש ואחושטי בגרטיוני, בהנהגת ג'ומבר ג'ישקריאני, מצאו את המערה ביולי 1984
    סמוך לכפר קומיסטאווי, שישה ק"מ מצקלטובו. העבודה לפתיחתה החלה בשנה שלאחר מכן, ועד 1989 היה כבר כקילומטר
    של שביל, מדרגות, מנהרת יציאה של 150 מטר ותאורה זמנית לקבוצות קטנות. אז קרסה ברית המועצות, הכסף נעלם,
    והפרויקט נסגר ב-1990. איש מקומי המשיך לשמור על האולמות הריקים; פסל שלו ושל כלבו מקבל כיום את המבקרים
    בכניסה.


    המערה נפתחה מחדש ב-26 במאי 2011 בשם חדש. אגדה מקומית מספרת שפרומתאוס נכבל לצוקי הר חוואמלי הסמוך,
    שם עינה אותו עורב, וב-2010 הציע הנשיא מיחאיל סאקאשווילי לקרוא למערה על שמו.


    מבין 22 האולמות שישה פתוחים, ושמותיהם ממשיכים את המיתוס: ארגונאוטים, קולכיס, מדיאה, אהבה, פרומתאוס,
    איבריה. השביל מתפתל כ-1.4 ק"מ בטמפרטורה קבועה של 14°C, חולף על פני זקיפים בגובה 8–10 מטרים, מסכי נטף,
    והליקטיטים הצומחים הצידה כאילו כוח המשיכה הוא רשות. התאורה הצבעונית היא תיאטרון טהור; אפשר לאהוב אותה
    או להתגעגע לפנס ולחושך אמיתי, אך הממדים אינם תלויים באף אחד מהם.


    הקטע האחרון שייך למים: הסירות שטות על אגם באורך 380 מטר, שמזין אותו נהר תת-קרקעי שנחקר לאורך כ-30
    ק"מ.


    יוצאים בעיניים ממצמצות אל החום הירוק של אימרתי, וצינת המערה נשארת בשרוולים עוד זמן מה.
  tip: >-
    הביאו שכבה חמה אפילו באוגוסט: מתחת לאדמה 14°C, והסיור המודרך נמשך כשעה. נעלו נעליים עם אחיזה, כי השביל
    המבוטן תמיד רטוב. הביקורים בקבוצות מודרכות; הכרטיסים כ-25 לארי, הסירה כ-20 נוספים, ובקיץ אפשר לחכות
    חצי שעה לתור, אז בואו בשעת הפתיחה או באמצע אחר הצהריים. הסירה מביאה אתכם ליציאה אחרת מזו של מסלול
    ההליכה. בית קפה, שירותים וחניה בכניסה. לפני שנכנסים, מצאו את פסל השומר וכלבו.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה דרך גורי וחשורי, דרך מעבר ריקוטי, לקוטאיסי, כ-220 ק"מ. בקוטאיסי קחו
    את Sh15 לכיוון צקלטובו, ואז עקבו אחר השילוט לקומיסטאווי ולמערה. בסך הכל כ-250 ק"מ ושלוש שעות וארבעים
    וחמש דקות, אספלט כל הדרך; הקילומטרים האחרונים הם דרך כפרית צרה אך בלי קושי, ולכן רכב חסכוני מספיק
    בכל עונה. תדלקו וחפשו כספומט בקוטאיסי או בצקלטובו. סאטאפליה היא סטייה קצרה מאותו הכביש, כך ששני האתרים
    משתלבים באופן טבעי ביום אחד.
ar:
  name: كهف بروميثيوس
  short: >-
    ست قاعات مضاءة في أعماق كارست إيميريتي، اكتُشفت عام 1984، وحماها في السنوات العجاف رجل من القرية،
    ولقاء بضعة لاريات إضافية تغادرها بالقارب عبر بحيرة جوفية.
  body: >-
    **لسنوات بعد سقوط الاتحاد السوفيتي، كان الشيء الوحيد الذي يقف بين كهف بروميثيوس والعابثين رجلًا من
    القرية وكلبه.**


    عثر مستكشفو الكهوف من معهد فاخوشتي باغراتيوني للجغرافيا، بقيادة جومبر جيشكارياني، على الكهف في يوليو
    1984 قرب قرية كوميستافي، على ستة كيلومترات من تسكالتوبو. بدأ العمل على فتحه في العام التالي، وبحلول
    1989 كان هناك نحو كيلومتر من الممرات، والدرج، ونفق خروج بطول 150 مترًا، وإضاءة مؤقتة لمجموعات صغيرة.
    ثم انهار الاتحاد، وتبخّرت الأموال، وأُغلق المشروع عام 1990. ظل رجل محلي يحرس القاعات الخاوية؛ ويستقبلكم
    اليوم عند المدخل تمثال له ولكلبه.


    أُعيد افتتاح الكهف في 26 مايو 2011 تحت اسم جديد. تقول الأسطورة المحلية إن بروميثيوس كان مقيّدًا إلى
    صخور جبل خفاملي القريب، حيث كان غراب يعذّبه، وفي عام 2010 اقترح الرئيس ميخائيل ساكاشفيلي تسمية الكهف
    باسمه.


    من بين 22 قاعة، ستّ مفتوحة، وأسماؤها تُبقي الأسطورة حيّة: الأرغونوت، كولخيس، ميديا، الحب، بروميثيوس،
    إيبيريا. يتعرّج المسار نحو 1.4 كيلومتر بحرارة ثابتة 14 درجة مئوية، عابرًا صواعد يتراوح ارتفاعها بين
    ثمانية وعشرة أمتار، وستائر من الرواسب الكلسية، وهيليكتيتات تنمو جانبيًا كأن الجاذبية اختيارية. الإضاءة
    الملوّنة مسرح خالص؛ قد تعشقها أو تحنّ إلى مصباح يدوي وظلام صادق، لكن ضخامة الكهف لا تتوقف على أي منهما.


    المرحلة الأخيرة من نصيب الماء: بحيرة بطول 380 مترًا تحمل القوارب، يغذيها نهر جوفي استُكشف لنحو 30
    كيلومترًا.


    تخرج وأنت ترمش من الضوء إلى حرّ إيميريتي الأخضر، وتبقى برودة الكهف في أكمامك وقتًا أطول.
  tip: >-
    احمل طبقة دافئة حتى في أغسطس: الحرارة تحت الأرض 14 درجة، والجولة المرشَدة تستغرق نحو ساعة. ارتدِ حذاءً
    بنعل غير زلق، فالممر الخرساني رطب دومًا. تسير الزيارات في مجموعات؛ تكلفة التذكرة نحو 25 لاري، والقارب
    حوالي 20 إضافية، وقد تنتظر في الصيف نصف ساعة لدورك، فتعال عند موعد الفتح أو في منتصف بعد الظهر. يخرج
    القارب عند مخرج مختلف عن مسار المشي. المقهى والمراحيض وموقف السيارات عند المدخل. قبل الدخول، ابحث
    عن تمثال الحارس وكلبه.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري، وممر ريكوتي، وصولًا إلى كوتايسي، نحو 220 كم.
    في كوتايسي، اتبع طريق Sh15 نحو تسكالتوبو، ثم اتبع اللافتات إلى كوميستافي والكهف. الإجمالي نحو 250
    كم وثلاث ساعات وخمس وأربعون دقيقة، أسفلت طوال الطريق؛ الكيلومترات الأخيرة طريق قروي ضيق لكنه بلا صعوبة،
    فسيارة اقتصادية تكفي في أي فصل. عبّئ الوقود وابحث عن جهاز صرف آلي في كوتايسي أو تسكالتوبو. ساتابليا
    انحراف قصير عن نفس الطريق، فيسهل الجمع بين الموقعين في يوم واحد.
