ka:
  name: პრომეთეს მღვიმე
  short: წყალტუბოსთან მდებარე კარსტული მღვიმე განათებული დარბაზებითა და მიწისქვეშა ნავით.
  body: >
    პრომეთეს მღვიმე სოფელ ყუმისთავთან, წყალტუბოსთან ახლოსაა და საქართველოს ყველაზე ეფექტური კარსტული ღრმულია.
    ის შედარებით ახლახან, 1984 წელს აღმოაჩინეს, ტურისტებისთვის კი 2011 წელს გაიხსნა — სწორედ ამიტომ არის
    აქ ინფრასტრუქტურა ბევრად უკეთესი, ვიდრე ქვეყნის სხვა მღვიმეებში.


    მღვიმის სისტემა ორ ათეულზე მეტ დარბაზს მოიცავს, საიდანაც ექვსი ტურისტული მარშრუტისთვისაა მოწყობილი.
    სავალი ბილიკი დაახლოებით **1,4 კილომეტრია და ბეტონის ბილიკებითა და ხიდებით გადის** სტალაქტიტების,
    სტალაგმიტების, ქვის ჩანჩქერებისა და მიწისქვეშა მდინარის გასწვრივ.


    განათება ფერადია და თეატრალური — ვისაც ბუნებრივი, „ველური“ მღვიმე უფრო უყვარს, ეს გემოვნების საკითხია,
    მაგრამ მასშტაბი და ფორმები მაინც შთამბეჭდავია.


    პრაქტიკული დეტალები:


    - ტემპერატურა მთელი წლის განმავლობაში დაახლოებით თოთხმეტი გრადუსია

    - ექსკურსია ჯგუფებით, გიდის თანხლებით ტარდება და დაახლოებით ერთ საათს გრძელდება

    - გასასვლელთან შესაძლებელია მიწისქვეშა მდინარეზე ნავით გასეირნება, ცალკე გადასახადით

    - შიგნით სველი და პრიალა ბეტონია


    მღვიმე წყალტუბოს საბჭოთა სანატორიუმებთან და სათაფლიასთან ერთად ბუნებრივ ერთდღიან მარშრუტს ქმნის ქუთაისიდან.


    მღვიმის გვერდით წყალტუბოა — საბჭოთა პერიოდის სამკურნალო კურორტი, სადაც ათეულობით მიტოვებული სანატორიუმია
    შემორჩენილი. ნაწილი აღდგენილია და მუშაობს, ნაწილი კი დაცარიელებული დგას და ცალკე მიზეზია ჩამოსვლის.
    ორივე ობიექტი ერთმანეთისგან სულ თხუთმეტიოდე კილომეტრშია.
  tip: >-
    ჟაკეტი აუცილებლად თან წაიღე: გარეთ ოცდაათი გრადუსია, შიგნით თოთხმეტი, და ერთი საათი სიცივეში საკმაოდ
    გრძელია. ფეხსაცმელი მაგარლანჩხიანი უნდა იყოს — ბეტონი მუდმივად სველია. ბილეთი ჯგუფზეა მიბმული და ზაფხულში
    რიგი შესაძლოა ნახევარ საათს გაგრძელდეს; დილით ან შუადღის შემდეგ ნაკლები ხალხია. ნავით გასეირნება ცალკე
    იხდება და მას შემდეგ სხვა გასასვლელთან აღმოჩნდები. კაფე, ტუალეტი და პარკინგი შესასვლელთანაა.
  route: >
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ ჩრდილო-დასავლეთით წყალტუბოს გავლით ყუმისთავამდე — სულ დაახლოებით
    ორას ორმოცდაათი კილომეტრი და სამი საათი ორმოცდახუთი წუთი. მთელი მარშრუტი ასფალტიანია და კარგ მდგომარეობაშია,
    ბოლო ათი კილომეტრი ვიწროვდება, მაგრამ პრობლემას არ ქმნის. ეკონომ კლასი სავსებით საკმარისია. საწვავი
    და ბანკომატი ქუთაისსა და წყალტუბოშია. სათაფლიის ნაკრძალი იმავე მიმართულებით მდებარეობს, ამიტომ ორივეს
    ერთ დღეში მოხვედრა ადვილია. ზაფხულში მღვიმესთან პარკინგი შუადღისას ივსება, ამიტომ დილით ჩასვლა ორმაგად
    მომგებიანია.
en:
  name: Prometheus Cave
  short: A karst cave near Tskaltubo with lit halls, stone waterfalls and an underground boat ride.
  body: >-
    Prometheus Cave lies by the village of Kumistavi near Tskaltubo and is the most spectacular karst
    system open to visitors in Georgia. It was only discovered in 1984 and opened to the public in 2011,
    which is why the infrastructure here is far better developed than at other Georgian caves.


    The system contains more than twenty halls, of which six are laid out for visitors. The walking route
    is about **1.4 kilometres along concrete paths and bridges**, past stalactites, stalagmites, petrified
    stone waterfalls and an underground river.


    The lighting is coloured and theatrical. Whether that improves on a raw, unlit cave is a matter of
    taste, but the scale and the formations are genuinely impressive regardless.


    Practical details:


    - the temperature stays around fourteen degrees all year

    - visits run as guided groups and last roughly an hour

    - at the exit you can take a boat along the underground river for a separate fee

    - the concrete underfoot is permanently wet


    The cave combines naturally with Tskaltubo's abandoned Soviet sanatoriums and with Sataplia reserve
    to make a full day out of Kutaisi, and all three sit within twenty kilometres of each other.
  tip: >-
    Take a jacket without fail: it can be thirty degrees outside and fourteen inside, and an hour underground
    at that temperature feels long. Wear shoes with grip, because the concrete is constantly wet. Tickets
    are tied to group departures and in summer the wait can reach half an hour, so morning or mid-afternoon
    is quieter. The boat ride is paid separately and leaves you at a different exit. Cafe, toilets and
    parking are at the entrance.
  route: >-
    Take the E60 from Tbilisi to Kutaisi, then head northwest through Tskaltubo to Kumistavi — around
    250 km and three hours forty-five in total. The whole route is paved and in good condition; the last
    ten kilometres narrow but present no difficulty. An economy car is entirely sufficient. Fuel and ATMs
    are available in Kutaisi and Tskaltubo. Sataplia reserve lies in the same direction, so pairing the
    two in one day costs almost no extra driving.
ru:
  name: Пещера Прометея
  short: Карстовая пещера под Цхалтубо с подсвеченными залами, каменными водопадами и подземной лодкой.
  body: >
    Пещера Прометея находится у села Кумистави рядом с Цхалтубо и остаётся самой зрелищной карстовой системой
    Грузии, открытой для посещения. Её обнаружили сравнительно недавно, в 1984 году, а для туристов открыли
    в 2011-м — поэтому инфраструктура здесь заметно лучше, чем в других грузинских пещерах.


    Система насчитывает более двадцати залов, шесть из которых оборудованы для посетителей. Маршрут составляет
    около **1,4 километра по бетонным дорожкам и мостикам** мимо сталактитов, сталагмитов, окаменевших
    каменных водопадов и подземной реки.


    Подсветка цветная и театральная. Улучшает ли это впечатление от «дикой» пещеры — вопрос вкуса, но
    масштаб и формы впечатляют в любом случае.


    Практические детали:


    - температура круглый год держится около четырнадцати градусов

    - осмотр проходит группами с гидом и занимает примерно час

    - у выхода можно отдельно оплатить прогулку на лодке по подземной реке

    - бетон под ногами постоянно мокрый


    Пещера логично объединяется с заброшенными санаториями Цхалтубо и заповедником Сатаплиа в полноценный
    день из Кутаиси: все три точки лежат в пределах двадцати километров друг от друга.


    Рядом с пещерой находится Цхалтубо — лечебный курорт советского времени с десятками санаториев. Часть
    из них восстановлена и работает, часть стоит пустой и сама по себе служит поводом заехать. Оба объекта
    разделяют всего пятнадцать километров, и в один день они совмещаются без спешки.
  tip: >-
    Куртку берите обязательно: снаружи может быть тридцать градусов, внутри четырнадцать, и час под землёй
    при такой температуре кажется долгим. Нужна обувь с рифлёной подошвой, бетон всё время мокрый. Билеты
    привязаны к отправлению групп, летом ожидание доходит до получаса, поэтому утро или время после полудня
    спокойнее. Лодка оплачивается отдельно и высаживает у другого выхода. Кафе, туалеты и парковка — у
    входа.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на северо-запад через Цхалтубо до Кумистави — всего около 250
    км и три часа сорок пять минут. Весь маршрут асфальтирован и в хорошем состоянии, последние десять
    километров дорога сужается, но сложностей не создаёт. Достаточно машины эконом-класса. Заправки и
    банкоматы есть в Кутаиси и Цхалтубо. Заповедник Сатаплиа лежит в том же направлении, так что объединить
    обе точки в один день почти ничего не добавит к пробегу.
fa:
  name: غار پرومتئوس
  short: غاری کارستی نزدیک تسکالتوبو با تالارهای نورپردازی‌شده، آبشارهای سنگی و قایق‌سواری زیرزمینی.
  body: >-
    غار پرومتئوس کنار روستای کومیستاوی نزدیک تسکالتوبو قرار دارد و چشمگیرترین سامانهٔ کارستی گرجستان است
    که به روی بازدیدکنندگان باز شده باشد. این غار تازه در 1984 کشف شد و در 2011 برای عموم گشایش یافت،
    و به همین دلیل زیرساخت آن به‌مراتب بهتر از دیگر غارهای گرجستان است.


    سامانه بیش از بیست تالار دارد که شش تای آن برای بازدید آماده شده است. مسیر پیاده حدود **1.4 کیلومتر
    روی مسیرهای بتنی و پل‌ها** است و از کنار استالاکتیت‌ها، استالاگمیت‌ها، آبشارهای سنگ‌شدهٔ سنگی و یک
    رودخانهٔ زیرزمینی می‌گذرد. نورپردازی رنگی و نمایشی است؛ اینکه این کار غاری خام و بی‌نور را بهتر می‌کند
    یا نه، سلیقه‌ای است، اما ابعاد و شکل‌های سنگی به‌هر‌حال تحسین‌برانگیزند.


    چند نکتهٔ عملی: دما تمام سال حدود چهارده درجه می‌ماند؛ بازدید به‌صورت گروهی و با راهنما انجام می‌شود
    و تقریباً یک ساعت طول می‌کشد؛ در خروجی می‌توانید با پرداخت جداگانه سوار قایقی روی رودخانهٔ زیرزمینی
    شوید؛ و بتن زیر پا همیشه خیس است. غار به‌طور طبیعی با آسایشگاه‌های متروک شوروی در تسکالتوبو و با ذخیرهٔ
    طبیعی ساتاپلیا ترکیب می‌شود و از کوتایسی یک روز کامل می‌سازد، چون هر سه در فاصلهٔ بیست کیلومتری از
    یکدیگرند.
  tip: >-
    حتماً یک کاپشن بردارید: ممکن است بیرون سی درجه باشد و داخل چهارده، و یک ساعت زیر زمین در این دما طولانی
    حس می‌شود. کفشی با کف چنگ‌دار بپوشید، چون بتن پیوسته خیس است. بلیت‌ها به حرکت گروه‌ها گره خورده‌اند
    و در تابستان انتظار می‌تواند به نیم ساعت برسد، پس صبح یا اواسط بعدازظهر خلوت‌تر است. قایق‌سواری جداگانه
    پرداخت می‌شود و شما را از خروجی دیگری بیرون می‌آورد. کافه، سرویس بهداشتی و پارکینگ کنار ورودی‌اند.
  route: >-
    از تفلیس با E60 تا کوتایسی بروید و بعد رو به شمال‌غرب از تسکالتوبو تا کومیستاوی — روی هم حدود 250
    کیلومتر و سه ساعت و چهل‌وپنج دقیقه. تمام مسیر آسفالت و در وضعیت خوبی است؛ ده کیلومتر آخر باریک می‌شود
    اما هیچ دشواری ندارد. خودروی اقتصادی کاملاً کافی است. سوخت و خودپرداز در کوتایسی و تسکالتوبو هست.
    ذخیرهٔ طبیعی ساتاپلیا در همین جهت است، پس ترکیب این دو در یک روز تقریباً هیچ رانندگی اضافه‌ای نمی‌خواهد.
he:
  name: מערת פרומתאוס
  short: מערת קרסט ליד צקאלטובו עם אולמות מוארים, מפלי אבן ושיט תת-קרקעי.
  body: >-
    מערת פרומתאוס שוכנת ליד הכפר קומיסטאווי סמוך לצקאלטובו, והיא מערכת הקרסט המרשימה ביותר בגאורגיה מבין
    אלה הפתוחות למבקרים. היא התגלתה רק ב-1984 ונפתחה לקהל ב-2011, ומשום כך התשתית כאן מפותחת הרבה יותר
    מאשר במערות גאורגיות אחרות.


    במערכת יש יותר מעשרים אולמות, ומתוכם שישה מותאמים ומסודרים לביקור קהל. מסלול ההליכה הוא כ-**1.4 קילומטרים
    על שבילי בטון וגשרים**, לאורך נטיפים, זקיפים, מפלי אבן מאובנים ונהר תת-קרקעי. התאורה צבעונית ותיאטרלית;
    אם היא משפרת מערה גולמית ולא מוארת זהו עניין של טעם, אבל קנה המידה של האולמות והתצורות שבהם מרשימים
    בכל מקרה, בלי קשר לצבע האור.


    וכמה פרטים מעשיים שכדאי לדעת מראש: הטמפרטורה נשארת סביב ארבע עשרה מעלות לאורך כל השנה; הביקור מתנהל
    בקבוצות מודרכות ונמשך כשעה בערך; ביציאה אפשר לשוט בסירה על הנהר התת-קרקעי, בתשלום נפרד; והבטון שמתחת
    לרגליים רטוב תמיד ואינו מספיק להתייבש. המערה משתלבת באופן טבעי גם עם בתי ההבראה הסובייטיים הנטושים
    של צקאלטובו ועם שמורת סאטאפליה, וביחד הם עושים יום שלם מקוטאיסי — שלושתם נמצאים בטווח של עשרים קילומטרים
    זה מזה.
  tip: >-
    קחו מעיל בלי לוותר: בחוץ יכולות להיות שלושים מעלות ובפנים ארבע עשרה, ושעה מתחת לאדמה בטמפרטורה כזאת
    מרגישה ארוכה. נעלו נעליים עם אחיזה טובה, כי הבטון רטוב כל הזמן. הכרטיסים קשורים ליציאת הקבוצות ובקיץ
    ההמתנה מגיעה לחצי שעה, ולכן הבוקר או אמצע אחר הצהריים שקטים יותר. השיט בסירה נמכר בנפרד ומוציא אתכם
    ביציאה אחרת. בית קפה, שירותים וחניה נמצאים ליד הכניסה.
  route: >-
    סעו מטביליסי על E60 עד קוטאיסי, ומשם צפונה-מערבה דרך צקאלטובו אל קומיסטאווי — כ-250 ק״מ ושלוש שעות
    ארבעים וחמש בסך הכול. כל המסלול סלול ובמצב טוב; עשרת הקילומטרים האחרונים מצטמצמים אך אינם מציבים קושי.
    רכב חסכוני מספיק לחלוטין. דלק וכספומטים יש בקוטאיסי ובצקאלטובו. שמורת סאטאפליה נמצאת באותו כיוון,
    ולכן שילוב של השתיים ביום אחד כמעט אינו מוסיף נסיעה.
ar:
  name: كهف بروميثيوس
  short: كهف كارستي قرب تسكالتوبو بقاعات مضاءة وشلالات حجرية وجولة بالقارب تحت الأرض.
  body: >-
    يقع كهف بروميثيوس عند قرية كوميستافي قرب تسكالتوبو، وهو أكثر أنظمة الكارست إبهاراً بين ما هو مفتوح
    للزوار في جورجيا. لم يُكتشف إلا عام 1984 وافتُتح للجمهور عام 2011، ولهذا فبنيته التحتية أفضل بكثير
    من بنية الكهوف الجورجية الأخرى.


    يضم النظام أكثر من عشرين قاعة، ستٌّ منها مهيأة للزيارة. ويمتد مسار المشي نحو **1.4 كيلومتر على ممرات
    وجسور خرسانية**، بمحاذاة الهوابط والصواعد وشلالات حجرية متحجرة ونهر جوفي. الإضاءة ملونة ومسرحية؛ وهل
    تحسّن ذلك كهفاً خاماً غير مضاء؟ مسألة ذوق، لكن الحجم والتشكيلات مبهرة على أي حال.


    وهناك بعض التفاصيل العملية التي يحسن معرفتها مسبقاً: تبقى الحرارة نحو أربع عشرة درجة طوال العام؛ وتجري
    الزيارة في مجموعات مصحوبة بمرشد وتستغرق ساعة تقريباً؛ وعند المخرج يمكنك ركوب قارب على النهر الجوفي
    برسم منفصل؛ والخرسانة تحت قدميك مبللة دائماً. ويتكامل الكهف بطبيعته مع مصحّات تسكالتوبو السوفييتية
    المهجورة ومع محمية ساتابليا ليصنعا معاً يوماً كاملاً انطلاقاً من كوتايسي، فالمواقع الثلاثة تقع ضمن
    عشرين كيلومتراً من بعضها.
  tip: >-
    خذ معك سترة بلا تردد: قد تكون الحرارة ثلاثين درجة في الخارج وأربع عشرة في الداخل، وساعة تحت الأرض
    عند هذه الحرارة تبدو طويلة. البس حذاءً جيد القبضة، فالخرسانة مبللة باستمرار. التذاكر مرتبطة بمواعيد
    انطلاق المجموعات، وقد يبلغ الانتظار في الصيف نصف ساعة، ولذلك يكون الصباح أو منتصف العصر أهدأ. وجولة
    القارب تُدفع على حدة وتُخرجك من مخرج آخر. المقهى ودورات المياه والموقف كلها عند المدخل.
  route: >-
    اسلك E60 من تبليسي إلى كوتايسي، ثم اتجه شمالاً غرباً عبر تسكالتوبو إلى كوميستافي — نحو 250 كم وثلاث
    ساعات وخمس وأربعين دقيقة إجمالاً. المسار كله معبّد وبحال جيدة؛ والكيلومترات العشرة الأخيرة تضيق لكنها
    لا تمثل صعوبة. وسيارة اقتصادية تكفي تماماً. الوقود والصرافات متوفرة في كوتايسي وتسكالتوبو. ومحمية
    ساتابليا في الاتجاه نفسه، فالجمع بينهما في يوم واحد لا يكلفك قيادة إضافية تُذكر.
