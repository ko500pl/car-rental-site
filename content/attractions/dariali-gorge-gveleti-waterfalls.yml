ka:
  name: დარიალის ხეობა და გველეთის ჩანჩქერები
  short: >-
    „ალანთა კარი“ — თერგის ვიწრო, კილომეტრის სიღრმის ხეობა რუსეთის საზღვართან, 30-მეტრიანი გველეთის ჩანჩქერითა
    და 2011 წელს ნაკურთხი მონასტრით.
  body: >-
    **ორ ათას წელზე მეტია, ჯარები, ვაჭრები და მითები დარიალის ვიწრობში იკვლევენ გზას: აქ თერგს გრანიტი
    კილომეტრის სიღრმეზე ჩაუხერხავს და ცა თავზე ვიწრო ზოლადღა დარჩენილა.**


    ხეობა ჩხერის შესართავიდან, სტეფანწმინდის ოდნავ ჩრდილოეთით, ზემო ლარსამდე 11 კილომეტრზე გრძელდება.
    სახელი სპარსულია — დარ-ი ალან, „ალანთა კარი“. პლინიუსი მას კავკასიისა და იბერიის კარს უწოდებდა, პტოლემე
    — სარმატთა კარს, ძველი ქართული წყაროები კი დარიალანს, არაგვის კარსა და ოვსთა კარს. ეს კავკასიონის
    ორი ისტორიული გადასასვლელიდან ერთ-ერთია — მეორე დარუბანდთანაა, კასპიის ზღვის პირას, და ანტიკური ავტორები
    მათ ხშირად ერთმანეთში ურევდნენ.


    იოსებ ფლავიუსი წერდა რკინის კარზე, რომელიც ალექსანდრე მაკედონელს ერთ-ერთ უღელტეხილზე აუგია, და შემდგომმა
    ავტორებმა ეს კარი სწორედ აქ დაინახეს. ქართული გადმოცემით, პირველი სიმაგრე მირიან I-ს აუშენებია, V
    საუკუნეში ვახტანგ გორგასალს აღუდგენია, 1118–1120 წლებში კი დავით აღმაშენებელმა, რომელმაც ამ გზით ყივჩაღები
    ჩამოასახლა, ციხე განაახლა. მისი ნანგრევები დღესაც მარცხენა ნაპირის კლდეს აგვირგვინებს — ოღონდ საბაჟო
    კონტროლის მიღმა.


    სტეფანწმინდიდან შვიდ კილომეტრში გველეთის ორი ჩანჩქერია, ერთმანეთისგან დაახლოებით 750 მეტრის დაშორებით.
    ბილიკი სამსახურებრივი გზით იწყება, მერე ნაკადულებს გადადის, კლდეების ძირში, გვიმრასა და მთის ბუჩქნარში
    მიიკლაკნება. დიდი გველეთის ჩანჩქერი 30 მეტრის სიმაღლიდან ეშვება, ძირში ოთხ მეტრამდე ფართოვდება და
    გულის ფორმის აუზს ავსებს, რომელსაც „სიყვარულის ტბას“ ეძახიან. აგვისტო-ოქტომბერში ბილიკის პირას ასკილი,
    კოწახური და ქაცვი მწიფდება.


    საზღვართან ახლოს, თერგის მარჯვენა ნაპირზე, 2005 წელს დარიალის მამათა მონასტრის მშენებლობა დაიწყო;
    2011 წელს ილია II-მ აქ წმინდა მთავარანგელოზების, მიქაელისა და გაბრიელის, ტაძარი აკურთხა. ეს ბოლო ნაგებობაა,
    რაც საქართველომ საზღვრამდე აღმართა, და პირველი, რასაც სამხრეთისკენ მომავალ მგზავრს უჩვენებს.
  tip: >-
    გველეთის ბილიკი მოკლეა, მაგრამ ქვიანი და ადგილ-ადგილ სველი: ჩაიცვით დახურული ფეხსაცმელი კარგი ძირით,
    სანდლებით აქ ვერაფერს გახდებით. ჩანჩქერთან ჰაერი ცივია და შხეფები ტანსაცმელს ასველებს, ამიტომ ქარსაფარი
    წაიღეთ. წყალი ყველაზე უხვად მაის-ივნისშია, თოვლის დნობისას. ეს სასაზღვრო ზონაა: პასპორტი ან პირადობის
    მოწმობა თან იქონიეთ, სასაზღვრო პოლიცია ამოწმებს. ბილიკთან პატარა ფასიანი ავტოსადგომია, დაახლოებით
    5 ლარი, ხშირად ჯიხურითაც. საჭმელი და წყალი სტეფანწმინდაში იყიდეთ. დარიალის ციხე საბაჟოს მიღმაა და
    საზღვრის გადაკვეთის გარეშე მასთან ვერ მიხვალთ.
  route: >-
    სტეფანწმინდიდან მთავარ გზას (ს3/E117) ჩრდილოეთისკენ, თერგის გასწვრივ გაუყევით: გველეთამდე დაახლოებით
    7 კილომეტრი და ათიოდე წუთია, თბილისიდან კი სულ დაახლოებით 165 კილომეტრი და სამი საათი და თხუთმეტი
    წუთი. გზა ასფალტია, მაგრამ ხეობაში ჩამოცვენილი ქვები ჩვეულებრივი ამბავია, ამიტომ ნელა იარეთ. გველეთის
    ჩანჩქერის მოსახვევიდან ავტოსადგომამდე მოკლე გრუნტის მონაკვეთია, სადაც კროსოვერი სედანზე მოსახერხებელია.
    მონასტერი კიდევ რამდენიმე კილომეტრით ჩრდილოეთითაა, საზღვრის პუნქტამდე. თავად ლარსამდე ნუ მიხვალთ:
    დაქირავებული ავტომობილით საქართველოს დატოვება დაუშვებელია. საწვავი სტეფანწმინდაშია.
en:
  name: Dariali Gorge and the Gveleti Waterfalls
  short: >-
    The 'Gate of the Alans': the Tergi's kilometre-deep granite gorge at the Russian border, with the
    30-metre Gveleti falls and a monastery consecrated in 2011.
  body: >-
    **For more than two thousand years armies, traders and myths have had to squeeze through Dariali,
    where the Tergi has sawn a kilometre deep into granite and the sky shrinks to a strip overhead.**


    The gorge runs 11 km from the mouth of the Chkheri, just north of Stepantsminda, to Zemo Larsi on
    the Russian border. Its name is Persian, Dar-i Alan, the Gate of the Alans. Pliny called it the Caucasian
    and the Iberian Gates, Ptolemy the Sarmatian Gates, and Georgian chronicles Darialani, the Aragvi
    Gate or the Gate of the Ossetians. It is one of only two historic ways through the Caucasus; the other
    is at Derbent on the Caspian, and classical writers often muddled the two.


    Josephus wrote of iron gates that Alexander the Great built at a mountain pass, and later authors
    placed them here. Georgian tradition credits King Mirian I with the first fortress; Vakhtang Gorgasali
    restored it in the 5th century, and David the Builder renewed it in 1118–1120 when he brought Kipchak
    settlers in by this road. Its ruins still crown a crag on the left bank, just beyond customs control.


    Seven kilometres from Stepantsminda, two waterfalls stand about 750 metres apart at Gveleti. The path
    starts on a service road, then crosses streams among ferns and scrub beneath the cliffs. The Large
    Gveleti fall drops 30 metres, spreads to four metres wide at its foot and fills a heart-shaped pool
    known as the lake of love. From August to October, rose hips, barberry and sea buckthorn ripen along
    the trail.


    Near the border, on the right bank, work on the Dariali Monastery began in 2005, and in 2011 Ilia
    II consecrated its church of the Archangels Michael and Gabriel. It is the last thing Georgia has
    built before the frontier, and the first it shows to travellers coming south.
  tip: >-
    The Gveleti path is short but stony and wet in places, so wear closed shoes with a good grip; sandals
    are useless here. By the falls the air is cold and the spray soaks you, so bring a windproof layer.
    The water is fullest in May and June, at snowmelt. This is a border zone: carry your passport or ID
    card, as the border police do check. There is a small paid car park at the trailhead, about 5 GEL,
    usually with a kiosk. Buy food and water in Stepantsminda. Dariali fortress lies beyond customs control
    and cannot be visited without crossing the border.
  route: >-
    From Stepantsminda follow the main road (S3/E117) north along the Tergi: about 7 km and ten minutes
    to Gveleti, some 165 km and three and a quarter hours from Tbilisi in all. The road is asphalt, but
    rockfall on the carriageway is routine in the gorge, so drive slowly. From the signed turning for
    the Gveleti waterfall a short unpaved lane leads to the car park, where a crossover is more comfortable
    than a saloon. The monastery is a few kilometres further north, short of the border post. Do not continue
    to Larsi itself: taking a rental car out of Georgia is not allowed. Fuel in Stepantsminda.
ru:
  name: Дарьяльское ущелье и водопады Гвелети
  short: >-
    «Ворота аланов»: гранитное ущелье Терека глубиной в километр у российской границы, 30-метровый водопад
    Гвелети и монастырь, освящённый в 2011 году.
  body: >-
    **Больше двух тысяч лет армии, торговцы и мифы протискиваются через Дарьял, где Терек пропилил гранит
    на километр вглубь, а небо над головой сжимается в узкую полоску.**


    Ущелье тянется на 11 км — от устья Чхери, чуть севернее Степанцминды, до Земо-Ларси на российской
    границе. Название у него персидское: Дар-и Алан, «Ворота аланов». Плиний называл его Кавказскими и
    Иберийскими воротами, Птолемей — Сарматскими, а грузинские летописи — Дарьяланом, Арагвскими или Осетинскими
    воротами. Это один из лишь двух исторических проходов через Кавказ; второй — у Дербента на Каспии,
    и античные авторы нередко их путали.


    Иосиф Флавий писал о железных воротах, которые Александр Македонский воздвиг на горном перевале, и
    позднейшие авторы помещали их именно здесь. Грузинское предание приписывает первую крепость царю Мириану
    I; Вахтанг Горгасали восстановил её в V веке, а Давид Строитель обновил в 1118–1120 годах, когда привёл
    по этой дороге кипчакских переселенцев. Её руины до сих пор венчают скалу на левом берегу — сразу
    за таможенным контролем.


    В семи километрах от Степанцминды, у Гвелети, примерно в 750 метрах друг от друга низвергаются два
    водопада. Сначала тропа идёт по служебной дороге, затем пересекает ручьи среди папоротников и кустарника
    под скалами. Большой Гвелетский водопад падает с высоты 30 метров, у подножия расходится до четырёх
    метров в ширину и наполняет чашу в форме сердца, которую зовут озером любви. С августа по октябрь
    вдоль тропы созревают шиповник, барбарис и облепиха.


    У самой границы, на правом берегу, в 2005 году начали строить Дарьяльский монастырь, а в 2011-м Илия
    II освятил его храм во имя Архангелов Михаила и Гавриила. Это последнее, что Грузия построила перед
    рубежом, и первое, что она показывает путникам, едущим на юг.
  tip: >-
    Тропа к Гвелети короткая, но каменистая и местами мокрая, так что нужна закрытая обувь с хорошим протектором;
    в сандалиях здесь делать нечего. У водопадов холодно, а брызги промочат насквозь, поэтому возьмите
    ветровку. Воды больше всего в мае и июне, когда тает снег. Это пограничная зона: имейте при себе паспорт
    или удостоверение личности — пограничники действительно проверяют. У начала тропы есть небольшая платная
    парковка, около 5 лари, обычно с киоском. Еду и воду купите в Степанцминде. Дарьяльская крепость находится
    за таможенным контролем, и попасть к ней, не пересекая границу, нельзя.
  route: >-
    Из Степанцминды — по основной трассе (S3/E117) на север вдоль Терека: около 7 км и десять минут до
    Гвелети, а всего от Тбилиси примерно 165 км и три с четвертью часа. Дорога асфальтовая, но камнепады
    на проезжую часть в ущелье — обычное дело, так что не гоните. От поворота с указателем на Гвелетский
    водопад короткий грунтовый проезд ведёт к парковке; здесь кроссовер удобнее седана. Монастырь — ещё
    в нескольких километрах к северу, не доезжая погранпоста. До самого Ларси не езжайте: выезжать на
    арендованной машине за пределы Грузии запрещено. Заправка — в Степанцминде.
fa:
  name: تنگهٔ داریال و آبشارهای گولتی
  short: >-
    «دروازهٔ آلان‌ها»: تنگهٔ گرانیتی رود ترگی به ژرفای یک کیلومتر کنار مرز روسیه، با آبشار ۳۰ متری گولتی
    و صومعه‌ای که در ۲۰۱۱ تقدیس شد.
  body: >-
    **بیش از دو هزار سال است که لشکرها، بازرگانان و اسطوره‌ها ناچار شده‌اند از تنگنای داریال بگذرند؛ جایی
    که ترگی یک کیلومتر در دل گرانیت بریده و آسمانِ بالای سر به نواری باریک بدل شده است.**


    تنگه ۱۱ کیلومتر از دهانهٔ رود چخری، کمی شمال استپانتسمیندا، تا زمو لارسی بر مرز روسیه امتداد دارد.
    نامش فارسی است: «درِ آلان»، یعنی دروازهٔ آلان‌ها. پلینی آن را دروازه‌های قفقاز و دروازه‌های ایبری
    خواند، بطلمیوس دروازه‌های سارمات، و وقایع‌نامه‌های گرجی داریالان، دروازهٔ آراگوی یا دروازهٔ اوستی‌ها.
    این یکی از تنها دو گذرگاه تاریخی از میان قفقاز است؛ دیگری در دربند کنار دریای خزر است و نویسندگان
    کلاسیک اغلب این دو را با هم اشتباه می‌گرفتند.


    یوسفوس از دروازه‌هایی آهنین نوشت که اسکندر مقدونی بر گذرگاهی کوهستانی ساخته بود، و نویسندگان بعدی
    آن‌ها را همین‌جا دانستند. سنت گرجی نخستین دژ را به شاه میریان یکم نسبت می‌دهد؛ واختانگ گورگاسالی در
    سدهٔ پنجم آن را بازسازی کرد و داوید سازنده در ۱۱۱۸–۱۱۲۰ نوسازی‌اش کرد، هنگامی که مهاجران قپچاق را
    از همین راه آورد. ویرانه‌هایش هنوز بر فراز صخره‌ای در کرانهٔ چپ پیداست، درست آن‌سوی بازرسی گمرک.


    هفت کیلومتر دورتر از استپانتسمیندا، در گولتی، دو آبشار با فاصلهٔ حدود ۷۵۰ متر از هم فرو می‌ریزند.
    کوره‌راه از یک جادهٔ خدماتی آغاز می‌شود، سپس زیر صخره‌ها و از میان سرخس‌ها و بوته‌زار، از چند نهر
    می‌گذرد. آبشار بزرگ گولتی از ۳۰ متر بلندی فرو می‌ریزد، در پایین تا چهار متر پهن می‌شود و حوضچه‌ای
    قلبی‌شکل را پر می‌کند که «دریاچهٔ عشق» می‌نامندش. از اوت تا اکتبر میوهٔ نسترن کوهی، زرشک و سنجد تلخ
    در کنار کوره‌راه می‌رسند.


    نزدیک مرز، بر کرانهٔ راست، ساخت صومعهٔ داریال در ۲۰۰۵ آغاز شد و در ۲۰۱۱ ایلیای دوم کلیسای آن را به
    نام فرشتگان مقرب، میکائیل و جبرائیل، تقدیس کرد. این واپسین بنایی است که گرجستان پیش از مرز ساخته،
    و نخستین چیزی که به مسافرانِ رو به جنوب نشان می‌دهد.
  tip: >-
    کوره‌راه گولتی کوتاه است اما سنگلاخ و جابه‌جا خیس، پس کفش بسته با کفی که خوب بگیرد بپوشید؛ صندل اینجا
    به کاری نمی‌آید. کنار آبشارها هوا سرد است و ترشح آب خیس‌تان می‌کند، پس یک لایهٔ بادگیر بیاورید. آب
    در مه و ژوئن، هنگام آب شدن برف‌ها، از همیشه پرتر است. اینجا منطقهٔ مرزی است: گذرنامه یا کارت شناسایی
    همراه داشته باشید، چون پلیس مرزی واقعاً بازرسی می‌کند. سر کوره‌راه پارکینگ کوچکی پولی هست، حدود ۵
    لاری، معمولاً با یک دکه. خوراک و آب را در استپانتسمیندا بخرید. دژ داریال آن‌سوی بازرسی گمرک است و
    بی‌عبور از مرز نمی‌توان از آن دیدن کرد.
  route: >-
    از استپانتسمیندا جادهٔ اصلی (S3/E117) را در امتداد ترگی به سوی شمال بروید: حدود ۷ کیلومتر و ده دقیقه
    تا گولتی، و روی‌هم حدود ۱۶۵ کیلومتر و سه ساعت و ربع از تفلیس. جاده آسفالت است، اما ریزش سنگ روی سواره‌رو
    در تنگه امری عادی است، پس آهسته برانید. از پیچِ دارای تابلوی آبشار گولتی، راهی کوتاه و خاکی به پارکینگ
    می‌رسد که برای آن کراس‌اوور راحت‌تر از سواری است. صومعه چند کیلومتر شمالی‌تر، پیش از پاسگاه مرزی است.
    تا خود لارسی ادامه ندهید: بیرون بردن خودروی اجاره‌ای از گرجستان مجاز نیست. سوخت در استپانتسمیندا.
he:
  name: ערוץ דריאלי ומפלי גוולטי
  short: >-
    "שער האלנים": ערוץ הגרניט של הטרגי, בעומק קילומטר, על גבול רוסיה, עם מפל גוולטי בגובה 30 מטר ומנזר
    שהוקדש ב-2011.
  body: >-
    **כבר יותר מאלפיים שנה נאלצים צבאות, סוחרים ומיתוסים להידחק דרך דריאלי, שם ניסר הטרגי את הגרניט לעומק
    קילומטר והשמיים הצטמצמו לרצועה צרה מעל הראש.**


    הערוץ נמשך 11 ק"מ, ממפגש נחל צ'חרי, מעט צפונית לסטפנצמינדה, ועד זמו לרסי שעל גבול רוסיה. שמו פרסי:
    דר-י אלן, "שער האלנים". פליניוס כינה אותו השערים הקווקזיים והשערים האיבריים, תלמי – השערים הסרמטיים,
    והכרוניקות הגאורגיות – דריאלני, שער הארגווי או שער האוסטים. זהו אחד משני המעברים ההיסטוריים היחידים
    דרך הקווקז; השני נמצא בדרבנט שלחוף הים הכספי, וסופרים קלאסיים נהגו לבלבל ביניהם.


    יוסף בן מתתיהו כתב על שערי ברזל שבנה אלכסנדר מוקדון במעבר הרים, וסופרים מאוחרים יותר מיקמו אותם כאן.
    המסורת הגאורגית מייחסת את המבצר הראשון למלך מיריאן הראשון; וחטנג גורגסלי שיקם אותו במאה ה-5, ודוד
    הבונה חידש אותו ב-1118–1120, כשהביא בדרך זו מתיישבים קיפצ'קים. חורבותיו עדיין מכתירות צוק על הגדה
    השמאלית, ממש מעבר לביקורת המכס.


    שבעה קילומטרים מסטפנצמינדה, בגוולטי, יורדים שני מפלים במרחק של כ-750 מטר זה מזה. השביל יוצא מדרך שירות,
    ואחר כך חוצה פלגים בין שרכים ושיחים למרגלות הצוקים. מפל גוולטי הגדול צונח מגובה 30 מטר, מתרחב לארבעה
    מטרים בתחתיתו וממלא בריכה בצורת לב המכונה "אגם האהבה". מאוגוסט עד אוקטובר מבשילים לאורך השביל פירות
    ורד הבר, ברבריס ואשחר הים.


    ליד הגבול, על הגדה הימנית, החלה ב-2005 בניית מנזר דריאלי, וב-2011 הקדיש איליה השני את כנסייתו לשם
    המלאכים הראשיים מיכאל וגבריאל. זה הדבר האחרון שגאורגיה בנתה לפני הגבול, והראשון שהיא מראה לנוסעים
    הבאים דרומה.
  tip: >-
    שביל גוולטי קצר, אבל רצוף אבנים ורטוב במקומות, אז נעלו נעליים סגורות עם אחיזה טובה; סנדלים לא יעזרו
    כאן. ליד המפלים האוויר קר והרסס מרטיב לגמרי, אז הביאו שכבה חוסמת רוח. המים בשיאם במאי וביוני, בעונת
    הפשרת השלג. זה אזור גבול: שאו איתכם דרכון או תעודת זהות, כי משטרת הגבול אכן בודקת. בתחילת השביל יש
    חניון קטן בתשלום, כ-5 לארי, ולרוב גם קיוסק. קנו אוכל ומים בסטפנצמינדה. מבצר דריאלי נמצא מעבר לביקורת
    המכס, ואי אפשר לבקר בו בלי לחצות את הגבול.
  route: >-
    מסטפנצמינדה סעו צפונה בכביש הראשי (S3/E117) לאורך הטרגי: כ-7 ק"מ ועשר דקות עד גוולטי, ובסך הכול כ-165
    ק"מ ושלוש שעות ורבע מטביליסי. הכביש סלול, אבל נפילת סלעים על המסעה היא עניין שבשגרה בערוץ, אז סעו
    לאט. מהפנייה המשולטת למפל גוולטי מובילה דרך עפר קצרה אל החניון, ושם קרוסאובר נוח יותר מסדאן. המנזר
    נמצא כמה קילומטרים צפונה משם, לפני מחסום הגבול. אל תמשיכו עד לרסי עצמה: אסור להוציא רכב שכור מגאורגיה.
    דלק בסטפנצמינדה.
ar:
  name: مضيق داريالي وشلالات غفيليتي
  short: >-
    «بوابة اللان»: مضيق نهر تيرغي الغرانيتي بعمق كيلومتر عند الحدود الروسية، مع شلال غفيليتي البالغ 30
    متراً ودير كُرّس عام 2011.
  body: >-
    **منذ أكثر من ألفي عام والجيوش والتجار والأساطير مضطرة إلى الانسلال عبر داريالي، حيث نشر نهر تيرغي
    الغرانيت إلى عمق كيلومتر، وضاقت السماء فوق الرؤوس حتى صارت شريطاً.**


    يمتد المضيق 11 كم من مصب نهر تشخيري، شمال ستيبانتسميندا بقليل، إلى زيمو لارسي على الحدود الروسية.
    واسمه فارسي: «در-ي آلان»، أي «بوابة اللان». سمّاه بلينيوس البوابة القوقازية والبوابة الإيبيرية، وبطليموس
    البوابة السارماتية، والحوليات الجورجية داريالاني أو بوابة أراغفي أو بوابة الأوسيتيين. وهو واحد من
    ممرين تاريخيين فقط عبر القوقاز؛ والآخر عند دربند على بحر قزوين، وكثيراً ما خلط الكتّاب الكلاسيكيون
    بينهما.


    كتب يوسيفوس عن بوابات حديدية بناها الإسكندر الأكبر عند ممر جبلي، ووضعها كتّاب لاحقون هنا. وتنسب الرواية
    الجورجية أول قلعة إلى الملك ميريان الأول؛ وقد رمّمها فاختانغ غورغاسالي في القرن الخامس، وجدّدها داود
    البنّاء في 1118–1120 حين جلب مستوطنين من القبجاق عبر هذا الطريق. ولا تزال أطلالها تتوّج جرفاً على
    الضفة اليسرى، خلف نقطة الجمارك مباشرة.


    وعلى بعد سبعة كيلومترات من ستيبانتسميندا، عند غفيليتي، ينحدر شلالان تفصل بينهما نحو 750 متراً. يبدأ
    الدرب على طريق خدمة، ثم يعبر جداول بين السرخس والشجيرات تحت الجروف. يهوي شلال غفيليتي الكبير من علوّ
    30 متراً، ويتسع عند قاعدته إلى أربعة أمتار، ويملأ بركة على شكل قلب تُعرف ببحيرة الحب. ومن أغسطس إلى
    أكتوبر ينضج على جانبي الدرب ثمر الورد البري والبرباريس ونبق البحر.


    وقرب الحدود، على الضفة اليمنى، بدأ العمل في دير داريالي عام 2005، وفي عام 2011 كرّس إيليا الثاني كنيسته
    على اسم رئيسي الملائكة ميخائيل وجبرائيل. إنه آخر ما بنته جورجيا قبل الحدود، وأول ما تريه للمسافرين
    القادمين جنوباً.
  tip: >-
    درب غفيليتي قصير لكنه حجري ومبلل في مواضع، فانتعل حذاءً مغلقاً ذا نعل متماسك؛ فالصنادل لا تنفع هنا.
    عند الشلالات يبرد الهواء ويبلّلك الرذاذ، فاحمل طبقة واقية من الريح. يبلغ الماء ذروته في مايو ويونيو
    مع ذوبان الثلوج. هذه منطقة حدودية: احمل جواز سفرك أو بطاقة هويتك، فشرطة الحدود تفتّش فعلاً. عند بداية
    الدرب موقف سيارات صغير مدفوع، نحو 5 لاري، وفيه عادة كشك. اشترِ الطعام والماء من ستيبانتسميندا. تقع
    قلعة داريالي خلف نقطة الجمارك، ولا يمكن زيارتها من دون عبور الحدود.
  route: >-
    من ستيبانتسميندا اتبع الطريق الرئيسي (S3/E117) شمالاً بمحاذاة نهر تيرغي: نحو 7 كم وعشر دقائق إلى غفيليتي،
    ونحو 165 كم وثلاث ساعات وربع من تبليسي في المجمل. الطريق معبّد، لكن تساقط الصخور على الطريق أمر مألوف
    في المضيق، فقُد ببطء. ومن المنعطف المؤشَّر إلى شلال غفيليتي يقود ممر قصير غير معبّد إلى الموقف، والكروس
    أوفر هنا أريح من السيدان. يقع الدير على بعد بضعة كيلومترات شمالاً، قبل مركز الحدود. لا تتابع حتى لارسي
    نفسها: فإخراج السيارة المستأجرة من جورجيا غير مسموح. الوقود في ستيبانتسميندا.
