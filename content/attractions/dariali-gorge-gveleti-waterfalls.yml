ka:
  name: დარიალის ხეობა და გველეთის ჩანჩქერები
  short: კავკასიის ყველაზე ვიწრო ხეობა საზღვართან, ორი ჩანჩქერითა და მოკლე, ეფექტური ბილიკით.
  body: >-
    **დარიალი ის ადგილია, სადაც მთები გზას თითქმის კეტავს.** სტეფანწმინდის ჩრდილოეთით თერგის ხეობა უცებ
    ვიწროვდება და 300-მეტრიან გრანიტის კედლებს შორის გადადის — ეს ისტორიულად კავკასიის მთავარი კარიბჭეა,
    რომელსაც ჯერ კიდევ ანტიკური ავტორები „კავკასიის კარებს" უწოდებდნენ. ხეობა რუსეთის საზღვრამდე მიდის
    და ეს მარშრუტის ბოლო წერტილია, სადამდეც დაქირავებული ავტომობილით მისვლა შეიძლება.


    ხეობის შუაში, გველეთის სოფლის ზემოთ, ორი ჩანჩქერია:


    - **პატარა გველეთის ჩანჩქერი** — გზიდან 15 წუთის სავალზე, ხელმისაწვდომი თითქმის ყველასთვის

    - **დიდი გველეთის ჩანჩქერი** — დაახლოებით 25 მეტრი სიმაღლისა, კიდევ 20–30 წუთის ასვლის შემდეგ, ქვებზე
    გადავლით


    ბილიკი მოკლეა, მაგრამ არა ბრტყელი: ქვის ბლოკები, ფესვები, ადგილ-ადგილ სველი ქვა. საუკეთესო დროა მაისი-ივნისი,
    როცა თოვლის დნობა ჩანჩქერს მაქსიმალურ წყალს აძლევს.


    დარიალის ხეობაშივე დგას **დარიალის მონასტერი** — ახალი, 2000-იან წლებში აშენებული კომპლექსი, რომელიც
    კლდეების ფონზე მოულოდნელად კარგად ზის და საზღვრამდე ბოლო გაჩერებაა.


    ხეობას საკუთარი ისტორიული წონა აქვს: აქ გადიოდა კავკასიის მთავარი სავაჭრო და სამხედრო არტერია, აქვე
    იდგა ლეგენდარული თამარის ციხე, რომლის ნაშთებიც კლდის თავზე დღემდე ჩანს. მოგზაურები საუკუნეების განმავლობაში
    წერდნენ ამ მონაკვეთზე როგორც ყველაზე შთამბეჭდავზე მთელ მარშრუტში, და ეს შეფასება დღესაც ძალაშია —
    გრანიტის კედლები, ქვემოთ თერგის ხმაური და ცის ვიწრო ზოლი თავზე.
  tip: >-
    ბილიკზე მოსახერხებელი, დაცული ფეხსაცმელი აუცილებელია — სლიპერებით აქ არაფერი გამოვა. ჩანჩქერთან ჰაერი
    ცივია და წყლის ნისლი ტანსაცმელს ასველებს, ამიტომ ქარსაფარი ქურთუკი წაიღე. ეს სასაზღვრო ზონაა: პასპორტი
    ან პირადობა თან იქონიე, სასაზღვრო პოლიციამ შეიძლება შეამოწმოს. ბილიკის დასაწყისში პატარა ფასიანი პარკინგია
    და ხშირად ჯიხურიც. საჭმელი და წყალი სტეფანწმინდაში აიღე — ზემოთ არაფერია.
  route: >-
    სტეფანწმინდიდან გაუყევი ცენტრალურ გზას ჩრდილოეთით თერგის გასწვრივ — 12–15 კმ და ოცი წუთი. თბილისიდან
    სულ 170 კმ და დაახლოებით სამი საათი და ნახევარი. მთავარი გზა ასფალტია, თუმცა კლდეზე ჩამოცვენილი ქვები
    ჩვეულებრივი ამბავია. გველეთის ჩანჩქერების მოსახვევი მარცხნივ არის, ხიდის შემდეგ; იქიდან ორიოდ კილომეტრი
    გრუნტია და სწორედ ამიტომ არის სასურველი კროსოვერი და არა სედანი. საზღვრამდე არ მიხვიდე — დაქირავებული
    ავტომობილით ქვეყნის დატოვება არ არის ნებადართული.
en:
  name: Dariali Gorge and the Gveleti Waterfalls
  short: The narrowest gorge in the Caucasus, right at the border, with two waterfalls and a short, dramatic
    trail.
  body: >-
    **Dariali is where the mountains almost close the road.** North of Stepantsminda the Terek valley
    suddenly narrows and squeezes between granite walls three hundred metres high. This is historically
    the main gateway through the Caucasus, called the Caspian or Caucasian Gates by ancient authors. The
    gorge runs up to the Russian border, and this is the last point on the route that a rental car can
    legally reach.


    Halfway along, above Gveleti village, are two waterfalls:


    - The **lower Gveleti falls**, about fifteen minutes from the road and manageable for almost anyone

    - The **upper Gveleti falls**, roughly 25 metres high, another twenty to thirty minutes further up
    over boulders


    The trail is short but not flat: loose blocks, tree roots and wet rock in the shaded sections. May
    and June are the best months, when snowmelt gives the falls their maximum volume; by late August the
    upper cascade thins noticeably.


    Also in the gorge stands the **Dariali Monastery**, a modern complex built in the 2000s. It is new,
    but it sits surprisingly well against the cliffs and makes a natural last stop before the frontier
    zone begins.
  tip: >-
    Wear proper closed shoes with grip — sandals are useless on this trail. Near the falls the air is
    cold and the spray soaks clothing, so bring a windproof layer. This is a border zone: carry your passport
    or ID, as the border police do check. There is a small paid car park at the trailhead, usually with
    a kiosk. Buy food and water in Stepantsminda, because there is nothing at all further up the valley.
  route: >-
    From Stepantsminda follow the main road north along the Terek — 12 to 15 km, about twenty minutes.
    From Tbilisi it is 170 km in total and roughly three and a half hours. The main road is asphalt, though
    rockfall debris on the surface is routine here. The Gveleti turning is on the left after the bridge,
    and the last couple of kilometres are gravel, which is precisely why a crossover is preferable to
    a sedan. Do not drive up to the border crossing itself: taking a rental car out of Georgia is not
    permitted.
ru:
  name: Дарьяльское ущелье и водопады Гвелети
  short: Самое узкое ущелье Кавказа у самой границы, два водопада и короткая, но эффектная тропа.
  body: >-
    **Дарьял — место, где горы почти перекрывают дорогу.** К северу от Степанцминды долина Терека внезапно
    сужается и проходит между гранитными стенами высотой в триста метров. Исторически это главные ворота
    через Кавказ, которые античные авторы называли Кавказскими вратами. Ущелье тянется до российской границы,
    и это последняя точка маршрута, куда можно доехать на арендованной машине.


    На середине пути, выше села Гвелети, находятся два водопада:


    - **Нижний Гвелетский водопад** — примерно пятнадцать минут от дороги, доступен почти всем

    - **Верхний Гвелетский водопад** высотой около 25 метров — ещё двадцать-тридцать минут подъёма по
    валунам


    Тропа короткая, но не ровная: подвижные камни, корни, мокрая порода в тени. Лучшие месяцы — май и
    июнь, когда таяние снега даёт водопадам максимум воды; к концу августа верхний каскад заметно худеет.


    В том же ущелье стоит **Дарьяльский монастырь** — новый комплекс, построенный в 2000-х. Он современный,
    но на фоне скал смотрится неожиданно уместно и служит естественной последней остановкой перед пограничной
    зоной.
  tip: >-
    Нужна закрытая обувь с цепкой подошвой — в сандалиях на этой тропе делать нечего. У водопада воздух
    холодный, водяная пыль промачивает одежду, так что возьмите ветровку. Это погранзона: держите при
    себе паспорт или удостоверение, пограничники проверяют. У начала тропы небольшая платная парковка,
    обычно с киоском. Еду и воду покупайте в Степанцминде — выше по долине нет ничего.
  route: >-
    Из Степанцминды по главной дороге на север вдоль Терека — 12–15 км, около двадцати минут. От Тбилиси
    всего 170 км и примерно три с половиной часа. Основная дорога асфальтированная, но камнепадный мусор
    на покрытии здесь обычное дело. Поворот на Гвелети — налево за мостом, последние пара километров грунтовые,
    и именно поэтому кроссовер предпочтительнее седана. К самому пограничному переходу подъезжать не нужно:
    вывозить арендованный автомобиль из Грузии нельзя.
fa:
  name: تنگهٔ داریالی و آبشارهای گولتی
  short: باریک‌ترین تنگهٔ قفقاز، درست کنار مرز، با دو آبشار و مسیری کوتاه و پرهیجان.
  body: >-
    **داریالی جایی است که کوه‌ها نزدیک است راه را ببندند.** شمال کازبگی، درهٔ ترگی ناگهان تنگ می‌شود و
    میان دیواره‌های گرانیتی سیصد متری فشرده می‌ماند. این تاریخاً دروازهٔ اصلی عبور از قفقاز بوده و نویسندگان
    باستان آن را دروازه‌های کاسپین یا دروازه‌های قفقاز می‌نامیدند. تنگه تا مرز روسیه بالا می‌رود و همین‌جا
    آخرین نقطه‌ای است که خودروی کرایه‌ای قانوناً می‌تواند به آن برسد.


    در میانهٔ راه، بالای روستای گولتی، دو آبشار هست. آبشار پایینی گولتی حدود پانزده دقیقه از جاده فاصله
    دارد و تقریباً برای همه شدنی است؛ آبشار بالایی، نزدیک 25 متر بلندی، بیست تا سی دقیقهٔ دیگر بالاتر
    و از روی تخته‌سنگ‌هاست. مسیر کوتاه است اما هموار نیست: قلوه‌سنگ لق، ریشهٔ درخت و سنگ خیس در بخش‌های
    سایه‌دار. ماه‌های مه و ژوئن بهترین‌اند، وقتی آب‌شدن برف بیشترین حجم را به آبشارها می‌دهد؛ تا اواخر
    اوت آبشار بالایی به‌روشنی لاغر می‌شود.


    در همین تنگه **صومعهٔ داریالی** هم ایستاده است، مجموعه‌ای امروزی که در دههٔ 2000 ساخته شد. تازه‌ساز
    است، اما به‌طور غافلگیرکننده‌ای با صخره‌ها جور درمی‌آید و توقف طبیعی آخر پیش از آغاز منطقهٔ مرزی به
    شمار می‌رود.
  tip: >-
    کفش بستهٔ مناسب با کف چنگ‌دار بپوشید — صندل روی این مسیر به هیچ کار نمی‌آید. نزدیک آبشارها هوا سرد
    است و پاشش آب لباس را خیس می‌کند، پس یک لایهٔ بادگیر بردارید. اینجا منطقهٔ مرزی است: پاسپورت یا کارت
    شناسایی همراه داشته باشید، چون پلیس مرزی واقعاً کنترل می‌کند. سرِ مسیر پارکینگ کوچک پولی هست، معمولاً
    همراه یک دکه. خوراک و آب را در کازبگی بخرید، چون بالاتر در دره هیچ چیز نیست.
  route: >-
    از کازبگی جادهٔ اصلی را در امتداد ترگی به سمت شمال بگیرید — 12 تا 15 کیلومتر، حدود بیست دقیقه. از
    تفلیس در مجموع 170 کیلومتر و تقریباً سه ساعت و نیم است. جادهٔ اصلی آسفالت است، هرچند خرده‌سنگ ریزش‌کرده
    روی سطح آن اینجا امری عادی است. انشعاب گولتی پس از پل در سمت چپ است و دو کیلومتر آخر شنی، و دقیقاً
    به همین دلیل کراس‌اوور بر سواری ترجیح دارد. تا خود گذرگاه مرزی نرانید: بیرون بردن خودروی کرایه‌ای
    از گرجستان مجاز نیست.
he:
  name: ערוץ דריאלי ומפלי גוולטי
  short: הערוץ הצר ביותר בקווקז, ממש על הגבול, עם שני מפלים ושביל קצר ודרמטי.
  body: >-
    **דריאלי הוא המקום שבו ההרים כמעט סוגרים את הכביש.** מצפון לקזבגי עמק התרגי מצטמצם בבת אחת ונדחק בין
    קירות גרניט בגובה שלוש מאות מטרים. היסטורית זהו שער המעבר המרכזי דרך הקווקז, שסופרים עתיקים כינו אותו
    שערי הכספי או שערי הקווקז. הערוץ עולה עד הגבול הרוסי, וזו הנקודה האחרונה במסלול שרכב שכור רשאי להגיע
    אליה.


    בערך באמצע הדרך, מעל הכפר גוולטי, נמצאים שני מפלים. מפל גוולטי התחתון רחוק כחמש עשרה דקות מהכביש ומתאים
    כמעט לכל אחד; המפל העליון, בגובה של כ-25 מטרים, נמצא עוד עשרים עד שלושים דקות מעלה מעל גושי סלע. השביל
    קצר אך אינו שטוח: אבנים מתגלגלות, שורשי עצים וסלע רטוב בקטעים המוצלים. מאי ויוני הם החודשים הטובים
    ביותר, כשמי ההפשרה נותנים למפלים את נפחם המרבי; לקראת סוף אוגוסט המפל העליון מידלדל בבירור.


    בערוץ עומד גם **מנזר דריאלי**, מתחם מודרני שנבנה בשנות ה-2000. הוא חדש, אבל משתלב באופן מפתיע עם המצוקים
    ומהווה עצירה אחרונה טבעית לפני שמתחיל אזור הספר.
  tip: >-
    נעלו נעליים סגורות עם אחיזה טובה — סנדלים חסרי תועלת בשביל הזה. ליד המפלים האוויר קר והרסס מרטיב את
    הבגדים, אז קחו שכבה חוסמת רוח. זהו אזור גבול: החזיקו דרכון או תעודת זהות, כי משטרת הגבולות אכן בודקת.
    בראש השביל יש חניון קטן בתשלום, בדרך כלל עם דוכן. קנו אוכל ומים בקזבגי, כי מעלה העמק אין שם דבר.
  route: >-
    מקזבגי סעו בכביש הראשי צפונה לאורך התרגי — 12 עד 15 ק״מ, כעשרים דקות. מטביליסי מדובר ב-170 ק״מ בסך
    הכול וכשלוש שעות וחצי. הכביש הראשי אספלט, אם כי שברי סלע על פני הכביש הם עניין שבשגרה כאן. הפנייה
    לגוולטי נמצאת משמאל אחרי הגשר, ושני הקילומטרים האחרונים הם חצץ, ובדיוק בגלל זה קרוסאובר עדיף על רכב
    נמוך. אל תיסעו עד מעבר הגבול עצמו: הוצאת רכב שכור מגאורגיה אינה מותרת.
ar:
  name: مضيق داريالي وشلالات غفيليتي
  short: أضيق مضيق في القوقاز، عند الحدود مباشرة، بشلالين ودرب قصير مثير.
  body: >-
    **داريالي هو المكان الذي تكاد الجبال تُغلق فيه الطريق.** شمال كازبيغي يضيق وادي تيرغي فجأة وينحشر
    بين جدران غرانيتية بارتفاع ثلاثمئة متر. وهذه تاريخياً البوابة الرئيسية للعبور عبر القوقاز، وقد سماها
    كتّاب العصور القديمة بوابات قزوين أو بوابات القوقاز. ويصعد المضيق حتى الحدود الروسية، وهذه آخر نقطة
    في المسار يجوز لسيارة مستأجرة أن تبلغها قانوناً.


    وفي منتصف الطريق تقريباً، فوق قرية غفيليتي، يوجد شلالان. شلال غفيليتي الأسفل على بعد نحو خمس عشرة
    دقيقة من الطريق وفي متناول أي شخص تقريباً؛ أما الأعلى، وارتفاعه نحو 25 متراً، فيبعد عشرين إلى ثلاثين
    دقيقة أخرى صعوداً فوق الصخور الكبيرة. والدرب قصير لكنه غير مستوٍ: كتل سائبة وجذور أشجار وصخر مبلل
    في المقاطع المظللة. ومايو ويونيو أفضل الشهور، حين يمنح ذوبان الثلج الشلالات أقصى غزارتها؛ ومع أواخر
    أغسطس يرقّ الشلال الأعلى بوضوح.


    وفي المضيق أيضاً يقوم **دير داريالي**، وهو مجمع حديث يعود بناؤه إلى سنوات 2000. جديد نعم، لكنه ينسجم
    مع الجروف على نحو مفاجئ، ويشكل محطة أخيرة طبيعية قبل أن تبدأ المنطقة الحدودية.
  tip: >-
    البس حذاء مغلقاً جيد القبضة — فالصنادل عديمة الفائدة على هذا الدرب. وقرب الشلالات يكون الهواء بارداً
    والرذاذ يبلّل الثياب، فخذ طبقة صادّة للريح. وهذه منطقة حدودية: احمل جواز سفرك أو بطاقة هويتك، فشرطة
    الحدود تتحقق فعلاً. وعند بداية الدرب موقف صغير مدفوع، وفيه كشك عادة. واشترِ الطعام والماء في كازبيغي،
    فلا شيء البتة أعلى الوادي.
  route: >-
    من كازبيغي اتبع الطريق الرئيسي شمالاً بمحاذاة تيرغي — 12 إلى 15 كم، نحو عشرين دقيقة. ومن تبليسي المسافة
    170 كم إجمالاً ونحو ثلاث ساعات ونصف. الطريق الرئيسي إسفلت، وإن كان تناثر الصخور على سطحه أمراً معتاداً
    هنا. ومنعطف غفيليتي على اليسار بعد الجسر، والكيلومتران الأخيران حصويان، ولهذا بالضبط تُفضَّل سيارة
    كروس أوفر على السيارة المنخفضة. ولا تقد حتى المعبر الحدودي نفسه: فإخراج سيارة مستأجرة من جورجيا غير
    مسموح.
