ka:
  name: სქური — ყოფილი კურორტი
  short: >-
    ჭანისწყლის ტყიანი ხეობა წალენჯიხასთან, სადაც სამკურნალო წყაროს ჯერ საქონელმა მიაგნო — დღეს კურორტის
    ნაცვლად სიმშვიდე და ძველი ნანგრევები გხვდებათ.
  body: >-
    **სქურში წამალს პირველად საქონელმა მიაგნო: მწყემსებმა შენიშნეს, რომ ჯოგი მდინარეს გვერდს უვლიდა და
    წყაროს წყალს ეტანებოდა.**


    სქური ჭანისწყლის ხეობაშია, ეგრისის ქედის ძირას, ზღვის დონიდან 450–500 მეტრზე, წალენჯიხიდან გზით თხუთმეტიოდე
    კილომეტრზე. სახელი, როგორც ამბობენ, „ტყიან ხეობას“ ნიშნავს. აქვე ორი ნაკადი მოედინება — ნოლიმერი და
    წისქვილარი; მდინარეები კალმახით მდიდარია, ჭანისწყალზე კი პატარა ჰესი, „სქურჰესი“ დგას.


    წყაროები XIX საუკუნის 70–80-იან წლებში აღმოაჩინეს. გადმოცემით, გლეხებმა, რომელთა მიწაზეც წყარო ამოდიოდა,
    მისი დამალვა სცადეს — ეშინოდათ, თავადები მიწას წაგვართმევენო. საიდუმლო დიდხანს არ შენახულა: წყალი
    შეისწავლეს და 1920-იან წლებში სამკურნალოდ ცნეს. აქ საჭმლის მომნელებელი სისტემის, სახსრებისა და პერიფერიული
    ნერვული სისტემის დაავადებებს მკურნალობდნენ, ქარხანა კი წელიწადში ხუთ მილიონ ბოთლ „სქურს“ ასხამდა.


    დღევანდელ სქურზე გულწრფელად უნდა ითქვას: რეგიონული ტურისტული პორტალის (dmo.ge) ცნობით, კურორტის ინფრასტრუქტურა
    დაშლილია. დარჩა ხეობა, წყალი, საპიკნიკე ადგილები და ძველი ძეგლები: სქურის ეკლესია, მაღალი კოშკი, მთავარანგელოზის
    დანგრეული ეკლესია, დარბაზული ეკლესიის ნაშთები და „თეთრი ციხე“, რომელსაც ახ. წ. I–III საუკუნეებით ათარიღებენ.
    ხეობაში მოქმედი მონასტერიც არის.


    სქური კურორტია, რომელსაც კურორტი წაართვეს. დარჩა ის, რაც მწყემსებმა იპოვეს: მწვანე ხეობა და წყალი,
    რომელიც საქონელმა მდინარეს ამჯობინა.
  tip: >-
    სპა-პროცედურებს ნუ დაგეგმავთ: მოქმედი სამკურნალო სერვისების შესახებ სანდო ცნობა არ მოიპოვება, ამიტომ
    ღამისთევა ან მკურნალობა წინასწარ ადგილზე ან წალენჯიხაში გადაამოწმეთ. შესვლა თავისუფალია. მაღაზია და
    საწვავი წალენჯიხაშია. მონასტერში მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ.
    ზაფხული აქ ნოტიო და ცხელია — გაზაფხული და შემოდგომა უფრო სასიამოვნოა. ერთ დღეში შეუთავსეთ წალენჯიხის
    ტაძარი და ენგურჰესის კაშხალი, რომლებიც თხუთმეტიოდე კილომეტრშია.
  route: >-
    თბილისიდან სქურამდე დაახლოებით 335 კილომეტრია; ოფიციალური შეფასებით, გზას 5 საათსა და 35 წუთს მოანდომებთ.
    ს1 (E60) მაგისტრალით დასავლეთით, ქუთაისისა და სამტრედიის გავლით, სენაკამდე იარეთ, იქიდან კი შ6-ით
    ჩრდილოეთით, ჩხოროწყუს გავლით, წალენჯიხისკენ. წალენჯიხამდე დაახლოებით 11 კილომეტრით ადრე შ6-დან გადაუხვიეთ
    და ბოლო ოთხიოდე კილომეტრი ვიწრო სასოფლო გზით ჭანისწყალს აუყევით. ზუგდიდზე გავლა საჭირო არ არის. გზა
    მთლიანად საფარიანია, ეკონომ-კლასის მანქანაც საკმარისია; საწვავი სენაკში ან წალენჯიხაში ჩაასხით.
en:
  name: Skuri Gorge and Former Spa
  short: >-
    A wooded gorge near Tsalenjikha where cattle found the healing spring first — today the spa is gone,
    leaving quiet woods and scattered ancient ruins.
  body: >-
    **At Skuri the cattle found the cure first: shepherds noticed their herds walking past the river to
    drink from a spring instead.**


    Skuri lies in the Chanistskali gorge at the foot of the Egrisi range, 450–500 metres above the sea
    and some 15 km by road from Tsalenjikha. Its name is said to mean "a forest valley". Two streams,
    the Nolimeri and the Tsiskvilari, flow around the village; the rivers are rich in trout, and a small
    hydro plant, Skurhesi, stands on the Chanistskali.


    The springs were found in the 1870s or 1880s. Tradition says the peasants on whose land the water
    rose tried to keep it secret, afraid the nobles would take their fields once word got out. The secret
    did not hold. The water was studied and granted healing status in the 1920s; people came to treat
    digestive, joint and peripheral-nerve complaints, and a factory bottled five million bottles of "Skuri"
    a year.


    Be clear about what you will find today: according to the regional tourism portal dmo.ge, the resort's
    infrastructure has been dismantled. What remains is the gorge, the water, picnic spots and a scatter
    of monuments — Skuri church, a tall tower, the ruined Church of the Archangel, the remains of a hall
    church, and the "White Fortress", dated to the 1st–3rd centuries AD. A working monastery stands in
    the valley.


    Skuri is a spa with the spa taken away. What is left is what the shepherds found: a green valley,
    and water the cattle preferred to the river.
  tip: >-
    Do not plan on treatments: there is no reliable information on working spa services, so check any
    stay or cure locally or in Tsalenjikha before you rely on it. There is no entry fee. Shops and fuel
    are in Tsalenjikha. At the monastery, cover shoulders and knees; women will need a headscarf. Summers
    here are humid and hot, so spring and autumn are kinder. Pair the visit with Tsalenjikha Cathedral
    and the Enguri dam, each about 15 km away.
  route: >-
    Skuri is about 335 km from Tbilisi; the official estimate is 5 hours 35 minutes. Take the S1 (E60)
    west past Kutaisi and Samtredia to Senaki, then the Sh6 north through Chkhorotsqu towards Tsalenjikha.
    Roughly 11 km short of Tsalenjikha leave the Sh6 and follow a narrow village road up the Chanistskali
    for the last four kilometres or so. There is no need to go through Zugdidi. The road is surfaced throughout
    and an economy car is fine; fill up in Senaki or Tsalenjikha.
ru:
  name: Скури — бывший курорт
  short: >-
    Лесное ущелье близ Цаленджихи, где целебный источник первым нашёл скот; курорта больше нет — остались
    тихий лес и россыпь древних руин.
  body: >-
    **В Скури лекарство первым нашёл скот: пастухи заметили, что стадо проходит мимо реки, чтобы напиться
    из родника.**


    Скури лежит в ущелье Чанисцкали у подножия Эгрисского хребта, на высоте 450–500 метров над морем и
    примерно в 15 км по дороге от Цаленджихи. Говорят, название означает «лесная долина». Вокруг села
    текут два потока, Нолимери и Цисквилари; в реках водится форель, а на Чанисцкали стоит небольшая ГЭС
    — Скурхеси.


    Источники открыли в 1870-х или 1880-х годах. Предание гласит, что крестьяне, на чьей земле били ключи,
    пытались сохранить их в тайне: боялись, что, прослышав о воде, дворяне отберут у них поля. Тайна не
    удержалась. Воду изучили и в 1920-х годах признали лечебной; сюда ехали лечить болезни органов пищеварения,
    суставов и периферической нервной системы, а завод разливал по пять миллионов бутылок «Скури» в год.


    Скажем прямо, что вас ждёт сегодня: по данным регионального туристического портала dmo.ge, инфраструктура
    курорта демонтирована. Остались ущелье, вода, места для пикника и россыпь памятников — церковь Скури,
    высокая башня, разрушенная церковь Архангела, остатки зальной церкви и «Белая крепость», датируемая
    I–III веками н. э. В долине действует монастырь.


    Скури — курорт, у которого отняли курорт. Осталось то, что нашли пастухи: зелёная долина и вода, которую
    скот предпочёл реке.
  tip: >-
    Не рассчитывайте на процедуры: надёжных сведений о работающих лечебных услугах нет, так что любое
    проживание или лечение уточняйте на месте или в Цаленджихе, прежде чем на них полагаться. Платы за
    вход нет. Магазины и заправки — в Цаленджихе. В монастыре закрывайте плечи и колени; женщинам понадобится
    платок. Лето здесь влажное и жаркое, поэтому весна и осень приятнее. Совместите поездку с Цаленджихским
    собором и Ингурской ГЭС — до каждого около 15 км.
  route: >-
    От Тбилиси до Скури около 335 км; официальная оценка времени в пути — 5 часов 35 минут. Езжайте по
    S1 (E60) на запад мимо Кутаиси и Самтредиа до Сенаки, затем по Sh6 на север через Чхороцку в сторону
    Цаленджихи. Примерно за 11 км до Цаленджихи сверните с Sh6 и последние четыре километра или около
    того поднимайтесь по узкой сельской дороге вдоль Чанисцкали. Через Зугдиди ехать не нужно. Покрытие
    твёрдое на всём пути, машины эконом-класса вполне достаточно; заправьтесь в Сенаки или Цаленджихе.
fa:
  name: سکوری، استراحتگاه درمانی پیشین
  short: >-
    تنگه‌ای جنگلی نزدیک تسالنجیخا که چشمهٔ شفابخشش را نخست گاوها یافتند — آب‌درمانی دیگر نیست؛ جنگلی آرام
    مانده و ویرانه‌هایی کهن و پراکنده.
  body: >-
    **در سکوری درمان را نخست گاوها یافتند: چوپانان دیدند که گله از کنار رود می‌گذرد تا از چشمه‌ای آب بنوشد.**


    سکوری در تنگهٔ چانیستسکالی، پای رشته‌کوه اگریسی، در ارتفاع ۴۵۰ تا ۵۰۰ متر از سطح دریا و حدود ۱۵ کیلومتر
    راه از تسالنجیخا قرار دارد. می‌گویند نامش به معنای «درهٔ جنگلی» است. دو نهر، نولیمری و تسیسکویلاری،
    گرداگرد روستا روان‌اند؛ رودها پر از قزل‌آلا هستند و نیروگاه برق‌آبی کوچکی به نام سکورهسی روی چانیستسکالی
    ایستاده است.


    چشمه‌ها در دههٔ ۱۸۷۰ یا ۱۸۸۰ یافته شدند. روایت است که روستاییانی که آب از زمینشان می‌جوشید کوشیدند
    آن را پنهان نگه دارند، از بیم آنکه اگر خبرش پخش شود، اشراف زمین‌هایشان را بگیرند. راز پنهان نماند.
    آب را بررسی کردند و در دههٔ ۱۹۲۰ خاصیت درمانی‌اش را به رسمیت شناختند؛ مردم برای درمان بیماری‌های گوارشی،
    مفاصل و اعصاب محیطی به اینجا می‌آمدند و کارخانه‌ای سالی پنج میلیون بطری آب «سکوری» پر می‌کرد.


    دربارهٔ آنچه امروز می‌یابید روشن سخن بگوییم: به گفتهٔ درگاه گردشگری منطقه‌ای dmo.ge، زیرساخت‌های استراحتگاه
    برچیده شده است. آنچه مانده، تنگه است و آب، جاهایی برای پیک‌نیک و چند بنای کهنِ پراکنده: کلیسای سکوری،
    برجی بلند، کلیسای ویران فرشتهٔ مقرب، بقایای یک کلیسای تالاری، و «دژ سفید» که قدمتش را به سده‌های یکم
    تا سوم میلادی می‌رسانند. صومعه‌ای فعال هم در دره هست.


    سکوری آب‌درمانی‌ای است که آب‌درمانی‌اش را گرفته‌اند. آنچه مانده همان است که چوپانان یافتند: دره‌ای
    سبز، و آبی که گاوها بر رود ترجیحش دادند.
  tip: >-
    روی درمان حساب نکنید: اطلاعات قابل‌اعتمادی دربارهٔ خدمات درمانیِ فعال در دست نیست، پس هر اقامت یا
    درمانی را پیش از تکیه بر آن در محل یا در تسالنجیخا جویا شوید. ورودیه‌ای در کار نیست. فروشگاه و جایگاه
    سوخت در تسالنجیخاست. در صومعه شانه‌ها و زانوها را بپوشانید؛ بانوان به روسری نیاز خواهند داشت. تابستان
    اینجا شرجی و گرم است، پس بهار و پاییز دلپذیرترند. بازدید را با کلیسای جامع تسالنجیخا و سد انگوری همراه
    کنید که هر کدام حدود ۱۵ کیلومتر فاصله دارند.
  route: >-
    سکوری حدود ۳۳۵ کیلومتر از تفلیس فاصله دارد؛ برآورد رسمی زمان سفر ۵ ساعت و ۳۵ دقیقه است. از S1 (E60)
    رو به غرب، از کنار کوتائیسی و سامتردیا تا سناکی بروید، سپس با Sh6 رو به شمال از چخوروتسکو به سوی تسالنجیخا
    برانید. حدود ۱۱ کیلومتر پیش از تسالنجیخا از Sh6 جدا شوید و چهار کیلومتر پایانی یا اندکی بیشتر را از
    جادهٔ باریک روستایی در امتداد چانیستسکالی بالا بروید. نیازی به گذشتن از زوگدیدی نیست. جاده سراسر روکش
    دارد و خودروی کلاس اقتصادی کافی است؛ در سناکی یا تسالنجیخا باک را پر کنید.
he:
  name: סקורי — אתר מרפא לשעבר
  short: >-
    ערוץ מיוער ליד צאלנג'יחה, שבו הבקר מצא ראשון את מעיין המרפא — אתר המרפא איננו עוד, ונותרו יער שקט
    ושרידים עתיקים פזורים.
  body: >-
    **בסקורי הבקר מצא את התרופה ראשון: הרועים הבחינו שהעדר חולף על פני הנהר כדי לשתות ממעיין.**


    סקורי שוכנת בערוץ צ'אניסצקאלי למרגלות רכס אגריסי, בגובה 450–500 מטר מעל פני הים וכ-15 ק״מ בכביש מצאלנג'יחה.
    אומרים ששמה פירושו "עמק מיוער". שני פלגים, נולימרי וציסקווילארי, זורמים סביב הכפר; הנהרות שופעים פורל,
    ועל הצ'אניסצקאלי עומדת תחנת כוח הידרואלקטרית קטנה, סקורהסי.


    המעיינות התגלו בשנות ה-70 או ה-80 של המאה ה-19. המסורת מספרת שהאיכרים שעל אדמתם נבעו המים ניסו לשמור
    אותם בסוד, מחשש שהאצילים ייקחו את שדותיהם אם יתפשט הדבר. הסוד לא נשמר. המים נחקרו, ובשנות ה-20 של
    המאה ה-20 הוכרו כמי מרפא; אנשים באו לכאן לטיפול במחלות מערכת העיכול, המפרקים והעצבים ההיקפיים, ומפעל
    מילא חמישה מיליון בקבוקי "סקורי" בשנה.


    חשוב לומר בבירור מה תמצאו כאן היום: לפי פורטל התיירות האזורי dmo.ge, התשתית של אתר המרפא פורקה. מה
    שנותר הוא הערוץ, המים, פינות פיקניק ומקבץ של מונומנטים — כנסיית סקורי, מגדל גבוה, כנסיית המלאך הראשי
    ההרוסה, שרידי כנסיית אולם ו"המבצר הלבן", המתוארך למאות ה-1 עד ה-3 לספירה. בעמק פועל מנזר.


    סקורי היא עיירת מרפא שהמרפא נלקח ממנה. מה שנשאר הוא מה שמצאו הרועים: עמק ירוק, ומים שהבקר העדיף על
    פני הנהר.
  tip: >-
    אל תתכננו טיפולים: אין מידע אמין על שירותי מרפא פעילים, לכן בררו כל לינה או טיפול במקום או בצאלנג'יחה
    לפני שאתם סומכים עליהם. אין דמי כניסה. חנויות ותחנות דלק יש בצאלנג'יחה. במנזר כסו כתפיים וברכיים;
    נשים יזדקקו למטפחת ראש. הקיץ כאן לח וחם, ולכן האביב והסתיו נעימים יותר. שלבו את הביקור עם קתדרלת צאלנג'יחה
    ועם סכר אנגורי, כל אחד מהם במרחק של כ-15 ק״מ.
  route: >-
    סקורי נמצאת כ-335 ק״מ מטביליסי; לפי ההערכה הרשמית הנסיעה אורכת 5 שעות ו-35 דקות. סעו בכביש S1 (E60)
    מערבה, על פני קוטאיסי וסמטרדיה, עד סנאקי, ומשם בכביש Sh6 צפונה דרך צ'חורוצקו לכיוון צאלנג'יחה. כ-11
    ק״מ לפני צאלנג'יחה רדו מכביש Sh6 והמשיכו בארבעת הקילומטרים האחרונים, פחות או יותר, בדרך כפרית צרה
    העולה לאורך הצ'אניסצקאלי. אין צורך לעבור בזוגדידי. הדרך סלולה לכל אורכה ורכב מקטגוריית אקונומי מספיק;
    תדלקו בסנאקי או בצאלנג'יחה.
ar:
  name: سكوري، المنتجع الاستشفائي السابق
  short: >-
    مضيق حرجي قرب تسالنجيخا سبقت فيه الماشية الناسَ إلى نبع الشفاء — رحل المنتجع وبقيت غابة هادئة وأطلال
    قديمة متناثرة.
  body: >-
    **في سكوري سبقت الماشية الجميع إلى الدواء: لاحظ الرعاة أن القطيع يتجاوز النهر ليشرب من نبع.**


    تقع سكوري في مضيق تشانيستسكالي عند سفح سلسلة إغريسي، على ارتفاع 450–500 متر فوق سطح البحر ونحو 15
    كم بالطريق من تسالنجيخا. ويقال إن اسمها يعني «الوادي الحرجي». يجري حول القرية جدولان، نوليميري وتسيسكفيلاري؛
    والأنهار غنية بسمك السلمون المرقط، وعلى نهر تشانيستسكالي تقوم محطة كهرومائية صغيرة تُدعى سكورهيسي.


    اكتُشفت الينابيع في سبعينيات القرن التاسع عشر أو ثمانينياته. وتقول الرواية المتوارثة إن الفلاحين الذين
    تفجّر الماء في أرضهم حاولوا كتمان أمره، خشية أن ينتزع النبلاء حقولهم إن ذاع الخبر. لكن السر لم يصمد.
    دُرست المياه واعتُرف بها مياهاً علاجية في عشرينيات القرن العشرين؛ فصار الناس يأتون لعلاج أمراض الجهاز
    الهضمي والمفاصل والأعصاب الطرفية، وكان مصنع يعبّئ خمسة ملايين زجاجة من مياه «سكوري» في العام.


    ولنكن واضحين بشأن ما ستجده اليوم: بحسب بوابة السياحة الإقليمية dmo.ge، فُكّكت البنية التحتية للمنتجع.
    ما بقي هو المضيق والماء وأماكن للنزهات ومجموعة متناثرة من المعالم — كنيسة سكوري، وبرج شاهق، وكنيسة
    رئيس الملائكة المتهدمة، وبقايا كنيسة ذات قاعة واحدة، و«القلعة البيضاء» المؤرخة بالقرون من الأول إلى
    الثالث للميلاد. وفي الوادي دير عامر.


    سكوري منتجع استشفائي انتُزع منه الاستشفاء. وما بقي هو ما وجده الرعاة: وادٍ أخضر، وماء فضّلته الماشية
    على النهر.
  tip: >-
    لا تعوّل على العلاجات: لا توجد معلومات موثوقة عن خدمات استشفائية عاملة، فتحقّق من أي إقامة أو علاج
    في المكان نفسه أو في تسالنجيخا قبل أن تعتمد عليه. لا رسوم دخول. المتاجر ومحطات الوقود في تسالنجيخا.
    في الدير غطِّ الكتفين والركبتين؛ وستحتاج النساء إلى غطاء للرأس. الصيف هنا رطب وحار، فالربيع والخريف
    ألطف. اجمع الزيارة مع كاتدرائية تسالنجيخا وسد إنغوري، وكلاهما على بعد نحو 15 كم.
  route: >-
    تبعد سكوري عن تبليسي نحو 335 كم؛ والتقدير الرسمي للرحلة 5 ساعات و35 دقيقة. اسلك الطريق S1 (E60) غرباً
    مروراً بكوتايسي وسامترديا حتى سيناكي، ثم الطريق Sh6 شمالاً عبر تشخوروتسكو باتجاه تسالنجيخا. قبل تسالنجيخا
    بنحو 11 كم غادر Sh6 واصعد الكيلومترات الأربعة الأخيرة تقريباً على طريق قروي ضيق بمحاذاة نهر تشانيستسكالي.
    لا حاجة إلى المرور بزوغديدي. الطريق معبّد على طوله وتكفي سيارة من الفئة الاقتصادية؛ املأ الخزان في
    سيناكي أو تسالنجيخا.
