ka:
  name: რუსთავი
  short: >-
    ორჯერ აშენებული ქალაქი მტკვარზე: ქართლის მეფეთა ძველი ციხე-ქალაქი და სტალინის ფოლადის ქალაქი — საბჭოთა
    ავტოდრომითა და უზარმაზარი ავტობაზრობით.
  body: >-
    **რუსთავი ორჯერ აშენდა: ერთხელ — ქართლის მეფეებმა, მეორედ — ომის წლების აჩქარებით, ფოლადის ქარხნის
    ირგვლივ.**


    ლეონტი მროველის თხრობით, აქ ქართლოსის ცოლმა ქალაქი ააშენა და „ბოსტან-ქალაქი“ უწოდა. ეს გადმოცემაა,
    მაგრამ მიწა მას არ უღალატებს: არქეოლოგებმა აქ ბრინჯაოს ხანის სამოსახლო აღმოაჩინეს, IV საუკუნის ბოლოს
    კი მეფე თრდატმა ეკლესია ააგო და მტკვრიდან სარწყავი არხი გაიყვანა. 1069 წელს ბაგრატ IV-მ რუსთავის ციხე
    თბილისის ამირას წაართვა. თემურ-ლენგის შემოსევამ ქალაქი საბოლოოდ დააქცია — მისგან მხოლოდ ციხის ნანგრევები
    გადარჩა.


    მეორე რუსთავი მეორე მსოფლიო ომის წლებში დაიწყო: ძველი ნაქალაქარის ადგილას მეტალურგიული ქარხანა აშენდა.
    მშენებლები დასავლეთ საქართველოს ღარიბი სოფლებიდან ჩამოვიდნენ, მათ გვერდით კი გერმანელი სამხედრო ტყვეები
    შრომობდნენ. 1948 წელს რუსთავს ქალაქის სტატუსი მიენიჭა და პირველ ქუჩებს სახელები დაერქვა — ერთ-ერთს
    „ბოსტან-ქალაქი“. 1950 წლის 27 აპრილს მთელი ქალაქი პირველ ქართულ ფოლადს ზეიმობდა; დღესასწაული ხალიბებს
    მიეძღვნა — უძველეს მჭედლებს, რომლებიც, როგორც ფიქრობენ, ამ მიწის პირველი მკვიდრნი იყვნენ.


    ამ ეპოქის ნაყოფია ძველი რუსთავი — სტალინური ანსამბლი კოლონადებით, ღრმა ლოჯიებითა და სიმეტრიული მოედნებით,
    რომლის გულშიც მეტალურგთა კულტურის სასახლე (1956) დგას. ხიდის გაღმა ახალი რუსთავი მას პანელური კორპუსებით
    პასუხობს. 1991 წლის შემდეგ ქარხნების უმეტესობა გაჩერდა, მოსახლეობის 65% უმუშევარი დარჩა, 2002 წლისთვის
    კი მცხოვრებთა რიცხვი 160 ათასიდან 116 ათასამდე შემცირდა. დღეს რუსთავში კვლავ 127 ათასამდე ადამიანი
    ცხოვრობს.


    მძღოლისთვის კი აქ კიდევ ორი რამ არის საინტერესო. რუსთავის საერთაშორისო ავტოდრომი 1978 წელს გაიხსნა,
    როგორც საბჭოთა კავშირში აგებული უკანასკნელი სარბოლო ტრასა; ოცი წელი მიტოვებული იდგა და 2012 წლის 29
    აპრილს ხელახლა გაიხსნა. ქალაქის შესასვლელთან კი ამიერკავკასიის უდიდესი ავტობაზრობა გადაჭიმულა. მეორე
    რუსთავი ფოლადმა ააშენა — ახლა კი ლითონი აქ რიგებად დგას და ახალ პატრონს ელოდება.
  tip: >-
    სამი საათი საკმარისია: ერთი — ძველ რუსთავში ფეხით სასეირნოდ, დანარჩენი — ბაზრობისა და ავტოდრომისთვის.
    ავტობაზრობა ყველაზე ხალხმრავალია შაბათ-კვირას, ყველაზე მშვიდი — დილით ადრე; მოედნები უზარმაზარი, მტვრიანი
    და უჩრდილოა, ამიტომ მოხერხებული ფეხსაცმელი ჩაიცვით და წყალი თან იქონიეთ. ავტოდრომზე წასვლამდე ღონისძიებების
    კალენდარი გადაამოწმეთ — რბოლებს შორის იქ ბევრს ვერაფერს ნახავთ. ივლის-აგვისტოში სტეპის მზე დაუნდობელია:
    ძველ ცენტრში დილით ან საღამოს ხუთის შემდეგ იარეთ. კაფეს, ბანკომატსა და ბენზინგასამართ სადგურს ცენტრში
    ადვილად იპოვით.
  route: >-
    თბილისიდან სამხრეთ-აღმოსავლეთით ს4 რუსთავის გზატკეცილით გადით — ფონიჭალიდან რუსთავამდე ის თითო მიმართულებით
    ორზოლიანი მაგისტრალია: 30 კმ, დაახლოებით 35 წუთი. ერთადერთი სერიოზული საცობი პიკის საათებში თბილისიდან
    გასასვლელშია. ავტოდრომი გზატკეცილის პირას, დედაქალაქიდან დაახლოებით 20 კილომეტრშია, ავტობაზრობა კი
    ქალაქის შესასვლელთან, გზის გაყოლებაზე გადაჭიმულა — ორივეს ადვილად მიაგნებთ. ბენზინგასამართი სადგურები
    გზაზე ბევრია, ცენტრში პარკირება იშვიათად ქმნის პრობლემას. ეკონომკლასის მანქანა სრულიად საკმარისია
    — ეს რეგიონის ერთ-ერთი ყველაზე მარტივი მარშრუტია.
en:
  name: Rustavi
  short: >-
    A city built twice on the Mtkvari: an ancient royal fortress-town, then Stalin's steel city, with
    a Soviet race circuit and a vast car market.
  body: >-
    **Rustavi has been built twice: once by the kings of Kartli, and once, at wartime speed, around a
    steelworks.**


    The medieval chronicler Leonti Mroveli credits the wife of Kartlos, forefather of the Georgians, with
    founding a town here called Bostan-Kalaki, the "city of gardens". Legend, yet the ground keeps faith
    with it: archaeologists have found a Bronze Age settlement, and in the late 4th century King Trdat
    raised a church and cut an irrigation canal from the Mtkvari. Bagrat IV took its fortress from the
    emir of Tbilisi in 1069. Timur's invasion finished the town; only the ruins of its fortress survived.


    The second Rustavi began in wartime, with a metallurgical plant laid out on the very site of the old
    town. Villagers from poor western Georgia built it, with German prisoners of war beside them. In 1948
    Rustavi became a city and named its first streets, one of them Bostan-Kalaki. On 27 April 1950 the
    town celebrated the first Georgian steel with a festival devoted to the Khalibs, the ancient ironworkers
    believed to have first settled this land.


    Old Rustavi is the result: a Stalin-era ensemble of colonnades, deep loggias and symmetrical squares,
    with the Metallurgists' Palace of Culture of 1956 at its heart. Across the bridge, New Rustavi answers
    in panel blocks. After 1991 most factories closed and 65% of residents lost their jobs; by 2002 the
    population had fallen from 160,000 to 116,000. Today it is back to about 127,000.


    For drivers, Rustavi International Motorpark opened in 1978 as the last race track built in the USSR,
    lay derelict for twenty years and reopened on 29 April 2012. And at the city's entrance sprawls the
    largest car market in the South Caucasus. Steel built the second Rustavi; now the metal stands here
    in rows, waiting for a new owner.
  tip: >-
    Allow three hours: one on foot in Old Rustavi, the rest for the market and the circuit. The car market
    is busiest at weekends and calmest early in the morning; its lots are huge, dusty and shadeless, so
    wear sturdy shoes and carry water. Check the Motorpark's event calendar before you drive over, since
    between race and track days there may be little to watch. In July and August the steppe sun is fierce,
    so walk the old centre in the morning or after five. Cafés, cash machines and fuel are easy to find
    in the centre.
  route: >-
    Leave Tbilisi south-east on the S4 Rustavi highway, which runs as a dual carriageway, two lanes each
    way, from Ponichala to Rustavi: 30 km, about 35 minutes. The only real bottleneck is the exit from
    Tbilisi at rush hour. The Motorpark lies beside the highway about 20 km from the capital, and the
    car market spreads along the road at the entrance to the city, so neither is hard to find. Fuel stations
    line the route, and parking in the centre is rarely a problem. An economy car is all you need: this
    is one of the easiest drives in the region.
ru:
  name: Рустави
  short: >-
    Город, дважды выросший на Мтквари: древняя царская крепость, затем сталинский город стали — с советским
    автодромом и огромным авторынком.
  body: >-
    **Рустави строили дважды: сначала цари Картли, потом — с военной поспешностью — вокруг сталелитейного
    завода.**


    Средневековый летописец Леонти Мровели приписывает жене Картлоса, прародителя грузин, основание здешнего
    города — Бостан-калаки, «города садов». Это легенда, но земля от неё не отрекается: археологи нашли
    здесь поселение бронзового века, а в конце IV века царь Трдат возвёл церковь и провёл от Мтквари оросительный
    канал. В 1069 году Баграт IV отнял здешнюю крепость у тбилисского эмира. Нашествие Тимура добило город;
    уцелели лишь руины крепости.


    Второй Рустави начался в годы Второй мировой: металлургический завод заложили прямо на месте старого
    города. Строили его крестьяне из бедных сёл Западной Грузии, а рядом с ними работали немецкие военнопленные.
    В 1948 году Рустави получил статус города и дал имена первым улицам — одну из них назвали Бостан-калаки.
    27 апреля 1950 года город встречал первую грузинскую сталь праздником в честь халибов — древних кузнецов,
    которых считают первыми жителями этой земли.


    Так появился Старый Рустави: сталинский ансамбль колоннад, глубоких лоджий и симметричных площадей,
    в сердце которого стоит Дворец культуры металлургов 1956 года. За мостом ему отвечает панельными кварталами
    Новый Рустави. После 1991 года большинство заводов остановилось, 65% жителей остались без работы,
    и к 2002 году население сократилось со 160 000 до 116 000. Сегодня здесь снова живёт около 127 000
    человек.


    Для автомобилиста у Рустави есть ещё два повода. Международный автодром «Рустави» открылся в 1978
    году — последним гоночным треком, построенным в СССР, — двадцать лет простоял в запустении и вновь
    заработал 29 апреля 2012 года. А на въезде в город раскинулся крупнейший авторынок Южного Кавказа.
    Второй Рустави построила сталь; теперь металл стоит здесь рядами и ждёт нового хозяина.
  tip: >-
    Заложите три часа: час на прогулку по Старому Рустави, остальное — на рынок и автодром. Авторынок
    живее всего по выходным и спокойнее всего ранним утром; его площадки огромные, пыльные и без клочка
    тени, так что наденьте крепкую обувь и возьмите воду. Прежде чем ехать на автодром, загляните в его
    календарь: между гонками и трек-днями смотреть там бывает почти нечего. В июле и августе степное солнце
    беспощадно, поэтому старый центр лучше обходить утром или после пяти. Кафе, банкоматы и заправки в
    центре найти несложно.
  route: >-
    Из Тбилиси выезжайте на юго-восток по руставскому шоссе S4: от Поничалы до Рустави это магистраль
    с двумя полосами в каждую сторону — 30 км, около 35 минут. Единственное настоящее узкое место — выезд
    из Тбилиси в час пик. Автодром стоит у трассы примерно в 20 км от столицы, авторынок тянется вдоль
    дороги на въезде в город, так что ни тот ни другой искать не придётся. Заправок по пути много, с парковкой
    в центре проблем почти не бывает. Хватит машины эконом-класса: это одна из самых лёгких поездок в
    регионе.
fa:
  name: روستاوی
  short: >-
    شهری که دو بار کنار رود مْتکواری ساخته شد: نخست دژشهری شاهانه در روزگار کهن، سپس شهر فولادِ استالین،
    با پیست مسابقه‌ای شوروی و بازار خودرویی پهناور.
  body: >-
    **روستاوی دو بار ساخته شده است: یک بار به دست پادشاهان کارتلی، و بار دیگر، با شتابِ روزهای جنگ، گرداگرد
    یک کارخانهٔ فولاد.**


    لئونتی مْروِلی، وقایع‌نگار سده‌های میانه، بنیان‌گذاری شهری را در این‌جا به همسر کارتلوس، نیای گرجیان،
    نسبت می‌دهد: شهری به نام بوستان‌کالاکی، یعنی «شهر باغ‌ها». این افسانه است، اما خاکِ این‌جا با آن بی‌وفایی
    نمی‌کند: باستان‌شناسان سکونتگاهی از عصر مفرغ یافته‌اند، و در اواخر سدهٔ چهارم میلادی تردات شاه کلیسایی
    برافراشت و از مْتکواری نهری برای آبیاری حفر کرد. باگرات چهارم در سال ۱۰۶۹ دژ شهر را از امیر تفلیس
    گرفت. هجوم تیمور کار شهر را یکسره کرد؛ از آن جز ویرانه‌های دژ چیزی نماند.


    روستاویِ دوم در سال‌های جنگ جهانی دوم آغاز شد: کارخانهٔ ذوب‌آهنی درست بر جای شهر کهن پی افکنده شد.
    روستاییانی از دهکده‌های فقیر غرب گرجستان آن را ساختند و اسیران جنگی آلمانی دوشادوششان کار می‌کردند.
    در ۱۹۴۸ روستاوی عنوان شهر گرفت و بر نخستین خیابان‌هایش نام نهاد؛ یکی از آن‌ها بوستان‌کالاکی شد. در
    ۲۷ آوریل ۱۹۵۰ شهر نخستین فولاد گرجستان را با جشنی به افتخار خالیب‌ها گرامی داشت؛ آهنگران باستانی‌ای
    که گمان می‌رود نخستین ساکنان این سرزمین بوده‌اند.


    حاصلِ آن دوران، روستاوی قدیم است: مجموعه‌ای استالینی از ردیف ستون‌ها، ایوان‌های گود و سرپوشیده و میدان‌های
    قرینه، که کاخ فرهنگِ فلزکاران (۱۹۵۶) در قلب آن ایستاده است. آن سوی پل، روستاوی نو با بلوک‌های پیش‌ساخته
    به آن پاسخ می‌دهد. پس از ۱۹۹۱ بیشتر کارخانه‌ها از کار افتادند، ۶۵ درصد ساکنان بیکار شدند و تا سال
    ۲۰۰۲ جمعیت از ۱۶۰ هزار به ۱۱۶ هزار نفر فروکاست. امروز شمار ساکنان دوباره به حدود ۱۲۷ هزار نفر رسیده
    است.


    برای رانندگان، روستاوی دو دلیل دیگر هم دارد. پیست بین‌المللی روستاوی در ۱۹۷۸ به‌عنوان آخرین پیست مسابقه‌ای
    که در اتحاد شوروی ساخته شد گشایش یافت، بیست سال متروک ماند و در ۲۹ آوریل ۲۰۱۲ دوباره گشوده شد. و در
    ورودی شهر، بزرگ‌ترین بازار خودروی قفقاز جنوبی گسترده است. روستاویِ دوم را فولاد ساخت؛ اکنون فلز این‌جا
    ردیف‌به‌ردیف ایستاده و چشم‌به‌راه صاحبی تازه است.
  tip: >-
    سه ساعت کنار بگذارید: یک ساعت برای پیاده‌گردی در روستاوی قدیم و باقی برای بازار و پیست. بازار خودرو
    آخر هفته‌ها از همیشه شلوغ‌تر است و صبح زود از همیشه آرام‌تر؛ محوطه‌هایش پهناور، خاکی و بی‌سایه‌اند،
    پس کفش محکم بپوشید و آب همراه داشته باشید. پیش از رفتن به پیست، تقویم رویدادهایش را نگاه کنید، چون
    در فاصلهٔ مسابقه‌ها و روزهای آزادِ پیست شاید چیز چندانی برای تماشا نباشد. در ژوئیه و اوت آفتاب استپ
    بی‌رحم است؛ مرکز قدیم را صبح یا بعد از ساعت پنج بگردید. کافه، خودپرداز و پمپ بنزین در مرکز شهر به‌آسانی
    پیدا می‌شود.
  route: >-
    از تفلیس به سوی جنوب‌شرق، بزرگراه S4 روستاوی را در پیش بگیرید؛ این راه از پونیچالا تا روستاوی بزرگراهی
    با دو خط در هر سو است: ۳۰ کیلومتر، حدود ۳۵ دقیقه. تنها گلوگاه واقعی، خروج از تفلیس در ساعت‌های اوج
    ترافیک است. پیست در کنار بزرگراه و حدود ۲۰ کیلومتری پایتخت است و بازار خودرو در ورودی شهر در امتداد
    جاده گسترده شده، پس یافتن هیچ‌کدام دشوار نیست. پمپ بنزین در سراسر مسیر فراوان است و پارک کردن در مرکز
    شهر به‌ندرت دردسر دارد. خودروی کلاس اکونومی کاملاً بس است: این یکی از آسان‌ترین مسیرهای رانندگی در
    منطقه است.
he:
  name: רוסטאווי
  short: >-
    עיר שנבנתה פעמיים על גדות המטקוורי: עיר־מבצר מלכותית עתיקה, ואחריה עיר הפלדה של סטלין — עם מסלול מרוצים
    סובייטי ושוק מכוניות עצום.
  body: >-
    **רוסטאווי נבנתה פעמיים: פעם אחת בידי מלכי קרתלי, ופעם שנייה, בקצב של ימי מלחמה, סביב מפעל פלדה.**


    הכרוניקן לאונטי מרוולי, בן ימי הביניים, מייחס את ייסודה של עיר במקום הזה לאשתו של קרתלוס, אבי האומה
    הגאורגית; שמה היה בוסטן־קלאקי, "עיר הגנים". זו אגדה, אבל האדמה אינה מכזיבה אותה: ארכאולוגים מצאו כאן
    יישוב מתקופת הברונזה, ובשלהי המאה ה־4 הקים המלך טרדט כנסייה וחפר תעלת השקיה שהובילה מים מן המטקוורי.
    ב־1069 כבש בגרט הרביעי את מבצר העיר מידי אמיר טביליסי. פלישת טימור חיסלה את העיר; שרדו ממנה רק חורבות
    המבצר.


    רוסטאווי השנייה נולדה בשנות מלחמת העולם השנייה: מפעל מטלורגי הוקם בדיוק על אתר העיר העתיקה. בנו אותו
    כפריים מן הכפרים העניים של מערב גאורגיה, ולצדם עבדו שבויי מלחמה גרמנים. ב־1948 קיבלה רוסטאווי מעמד
    של עיר ונתנה שמות לרחובותיה הראשונים; אחד מהם נקרא בוסטן־קלאקי. ב־27 באפריל 1950 חגגה העיר את הפלדה
    הגאורגית הראשונה בפסטיבל שהוקדש לחאליבים, נפחי הברזל הקדומים שלפי הסברה היו הראשונים שהתיישבו בארץ
    הזאת.


    כך נוצרה רוסטאווי הישנה: מכלול מתקופת סטלין של שדרות עמודים, לוג'יות עמוקות וכיכרות סימטריות, ובלבו
    ארמון התרבות של המטלורגים משנת 1956. מעבר לגשר עונה לה רוסטאווי החדשה בשיכוני בטון טרומיים. אחרי 1991
    נסגרו רוב המפעלים, 65% מהתושבים איבדו את פרנסתם, ועד 2002 ירדה האוכלוסייה מ־160,000 ל־116,000. כיום
    חיים בעיר שוב כ־127,000 איש.


    לנהגים יש כאן עוד שתי סיבות לעצור. מסלול המרוצים הבינלאומי של רוסטאווי נפתח ב־1978 כמסלול המרוצים
    האחרון שנבנה בברית המועצות, עמד נטוש עשרים שנה ונפתח מחדש ב־29 באפריל 2012. ובכניסה לעיר משתרע שוק
    המכוניות הגדול ביותר בדרום הקווקז. את רוסטאווי השנייה בנתה הפלדה; עכשיו המתכת עומדת כאן בשורות ומחכה
    לבעלים חדשים.
  tip: >-
    הקדישו שלוש שעות: שעה לסיור רגלי ברוסטאווי הישנה, והשאר לשוק ולמסלול המרוצים. שוק המכוניות הומה במיוחד
    בסופי שבוע ושקט במיוחד בשעות הבוקר המוקדמות; המגרשים שלו עצומים, מאובקים וחשופים לשמש, אז נעלו נעליים
    יציבות וקחו מים. לפני הנסיעה למסלול בדקו את לוח האירועים שלו, כי בין מרוצים לימי נהיגה פתוחים ייתכן
    שלא יהיה שם הרבה מה לראות. ביולי ובאוגוסט שמש הערבה קופחת, ולכן כדאי לשוטט במרכז הישן בבוקר או אחרי
    חמש. בתי קפה, כספומטים ותחנות דלק קל למצוא במרכז העיר.
  route: >-
    צאו מטביליסי לכיוון דרום־מזרח בכביש S4 לרוסטאווי; מפוניצ'אלה ועד רוסטאווי זהו כביש מהיר מופרד עם שני
    נתיבים בכל כיוון: 30 ק"מ, כ־35 דקות. צוואר הבקבוק האמיתי היחיד הוא היציאה מטביליסי בשעות העומס. מסלול
    המרוצים שוכן לצד הכביש, כ־20 ק"מ מהבירה, ושוק המכוניות משתרע לאורך הדרך בכניסה לעיר, כך שקל למצוא
    את שניהם. תחנות דלק פזורות לכל אורך הדרך, וחניה במרכז העיר כמעט אף פעם אינה בעיה. רכב בקטגוריית אקונומי
    מספיק בהחלט: זו אחת הנסיעות הקלות ביותר באזור.
ar:
  name: روستافي
  short: >-
    مدينة بُنيت مرتين على نهر متكفاري: حصنٌ ملكي في الزمن القديم، ثم مدينة الفولاذ في عهد ستالين، ومعها
    حلبة سباق سوفييتية وسوق سيارات مترامي الأطراف.
  body: >-
    **بُنيت روستافي مرتين: مرةً على أيدي ملوك كارتلي، ومرةً أخرى، بعجلة زمن الحرب، حول مصنع للصلب.**


    ينسب مؤرّخ العصور الوسطى ليونتي مروفيلي تأسيسَ مدينةٍ هنا إلى زوجة كارتلوس، جدّ الجورجيين الأول، ويسمّيها
    بوستان-كالاكي، أي "مدينة البساتين". إنها أسطورة، غير أن الأرض لا تكذّبها: فقد عثر علماء الآثار على
    مستوطنة من العصر البرونزي، وفي أواخر القرن الرابع الميلادي شيّد الملك تردات كنيسة وشقّ قناة للري من
    نهر متكفاري. وفي عام 1069 انتزع باغرات الرابع قلعة المدينة من أمير تبليسي. ثم أجهز غزو تيمور على المدينة،
    فلم يبقَ منها سوى أطلال قلعتها.


    وُلدت روستافي الثانية في سنوات الحرب العالمية الثانية، حين أُقيم مصنع للحديد والصلب على موقع المدينة
    القديمة نفسه. بناه قرويون من قرى غرب جورجيا الفقيرة، وعمل إلى جانبهم أسرى حرب ألمان. وفي عام 1948
    نالت روستافي صفة المدينة وأطلقت أسماء على شوارعها الأولى، فكان أحدها بوستان-كالاكي. وفي 27 أبريل/نيسان
    1950 احتفلت المدينة بأول فولاذ جورجي بمهرجان كُرِّس للخاليبيين، صنّاع الحديد القدماء الذين يُعتقد
    أنهم أول من استوطن هذه الأرض.


    وهكذا نشأت روستافي القديمة: مجموعة معمارية من العهد الستاليني قوامها صفوف الأعمدة والشرفات العميقة
    المسقوفة والميادين المتناظرة، ويتوسطها قصر ثقافة عمال المعادن المشيَّد عام 1956. وعلى الضفة الأخرى
    من الجسر تردّ عليها روستافي الجديدة بعمارات من الألواح الجاهزة. بعد عام 1991 توقفت معظم المصانع وفقد
    65% من السكان أعمالهم، وبحلول عام 2002 تراجع عدد السكان من 160 ألفاً إلى 116 ألفاً. واليوم عاد إلى
    نحو 127 ألف نسمة.


    وللسائقين هنا سببان آخران للتوقف. فحلبة روستافي الدولية افتُتحت عام 1978 لتكون آخر حلبة سباق تُبنى
    في الاتحاد السوفييتي، ثم بقيت مهجورة عشرين عاماً قبل أن يُعاد افتتاحها في 29 أبريل/نيسان 2012. وعند
    مدخل المدينة يمتد أكبر سوق للسيارات في جنوب القوقاز. بنى الفولاذُ روستافي الثانية؛ وها هو المعدن اليوم
    يقف هنا صفوفاً، ينتظر مالكاً جديداً.
  tip: >-
    خصّص ثلاث ساعات: ساعة للتجوّل سيراً في روستافي القديمة، والباقي للسوق والحلبة. يبلغ سوق السيارات ذروة
    ازدحامه في عطلة نهاية الأسبوع، ويكون في أهدأ حالاته في الصباح الباكر؛ ساحاته شاسعة مغبرّة لا ظلّ فيها،
    فانتعل حذاءً متيناً واحمل معك ماءً. راجع جدول فعاليات الحلبة قبل التوجّه إليها، فقد لا يكون هناك ما
    يُشاهَد بين السباقات وأيام القيادة المفتوحة. في يوليو وأغسطس تشتدّ شمس السهوب، فتجوّل في الوسط القديم
    صباحاً أو بعد الخامسة. والمقاهي وأجهزة الصرّاف الآلي ومحطات الوقود سهلة المنال في وسط المدينة.
  route: >-
    اخرج من تبليسي باتجاه الجنوب الشرقي على طريق روستافي السريع S4، وهو من بونيتشالا حتى روستافي طريق
    مزدوج بمسربين في كل اتجاه: 30 كم، نحو 35 دقيقة. عنق الزجاجة الحقيقي الوحيد هو الخروج من تبليسي في
    ساعة الذروة. تقع الحلبة بجوار الطريق على بُعد نحو 20 كم من العاصمة، ويمتد سوق السيارات على جانب الطريق
    عند مدخل المدينة، فلن يصعب عليك العثور على أيٍّ منهما. محطات الوقود منتشرة على طول الطريق، ونادراً
    ما يكون الوقوف في وسط المدينة مشكلة. تكفيك سيارة من الفئة الاقتصادية: فهذه من أسهل الرحلات بالسيارة
    في المنطقة.
