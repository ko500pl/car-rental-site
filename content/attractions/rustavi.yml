ka:
  name: რუსთავი
  short: საბჭოთა ინდუსტრიული ქალაქი მტკვარზე, სტალინური ცენტრით, ავტოდრომითა და კავკასიის უდიდესი ავტობაზრობით.
  body: >-
    **რუსთავი არქიტექტურული ექსკურსიის მოულოდნელი ობიექტია, სამაგიეროდ გულწრფელი.** ქალაქი თბილისიდან
    ოცდაათ კილომეტრშია და საქართველოს ინდუსტრიული ისტორიის ყველაზე სუფთა მაგალითია.


    ძველი რუსთავი შუასაუკუნეების ქალაქი იყო მტკვარზე, რომელიც თემურ-ლენგმა გაანადგურა და საუკუნეების განმავლობაში
    მიწის ბორცვად რჩებოდა. თანამედროვე ქალაქი 1948 წელს დაიწყო ამიერკავკასიის მეტალურგიული ქარხნის გარშემო.
    ის ნულიდან დაიგეგმა და ეს ეტყობა.


    **ძველი რუსთავი** — მარჯვენა ნაპირზე — ერთიანი სტალინური ანსამბლია: ფართო ბულვარი ქარხნიდან მდინარემდე,
    სვეტებიანი ფასადები, ლოჯიები, კულტურის სახლი, სიმეტრიული მოედნები. ეს გვიანი 1940-იანი და 1950-იანი
    წლების ნეოკლასიციზმია, აშენებული საბჭოთა ინდუსტრიული ქალაქის იდეალის მიხედვით. მარცხენა ნაპირზე 1960-80-იანი
    წლების პანელური კვარტლებია — სულ სხვა ესთეტიკა, სულ სხვა ეპოქა.


    მანქანით მოგზაურთათვის რუსთავს ორი დამატებითი ინტერესი აქვს. **რუსთავის ავტოდრომი** ქალაქის მახლობლად
    2012 წელს სრულად რეკონსტრუირდა და რეგიონის მთავარი სარბოლო ტრასაა; შაბათ-კვირას ხშირად რაღაც მიმდინარეობს.
    **ავტობაზრობა** კი კავკასიის ყველაზე დიდი მეორადი მანქანების ბაზარია — ათასობით ავტომობილი მწკრივებში,
    ძირითადად აშშ-დან და ევროპიდან შემოტანილი. თუნდაც არაფრის ყიდვას არ აპირებდეთ, მასშტაბი შთამბეჭდავია.
  tip: >-
    სამი საათი საკმარისია ძველი ცენტრისა და ბაზრობისთვის. ავტობაზრობა შაბათ-კვირას ყველაზე დატვირთულია
    და დილით უფრო მშვიდი — ფეხსაცმელი გამოგადგებათ, ტერიტორია დიდია და მტვრიანი. ცენტრში კაფეები, ბანკომატები
    და საწვავია. ზაფხულში რუსთავი თბილისზე ცხელია, ჩრდილი ბულვარზეა. ავტოდრომზე ღონისძიების განრიგი წინასწარ
    შეამოწმეთ, თორემ კარი დაკეტილი დაგხვდებათ.
  route: >-
    თბილისიდან სამხრეთ-აღმოსავლეთით რუსთავის ავტომაგისტრალით — 30 კმ, დაახლოებით ოცდათხუთმეტი წუთი. გზა
    ორზოლიანი ავტობანია, კარგ მდგომარეობაში; პიკის საათებში თბილისის გასასვლელი იტვირთება. ავტოდრომი და
    ავტობაზრობა მაგისტრალის პირასაა, ქალაქამდე ცოტა ადრე, და მკაფიოდ არის მონიშნული. ცენტრში პარკინგი
    ფართო და უფასოა. ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Rustavi
  short: >-
    A Soviet industrial city on the Mtkvari, with a Stalin-era centre, a motorsport circuit and the largest
    car market in the Caucasus.
  body: >-
    **Rustavi is an unexpected subject for an architectural outing, and an unusually honest one.** The
    city lies thirty kilometres from Tbilisi and is the clearest example of Georgia's industrial history
    anywhere in the country.


    Old Rustavi was a medieval town on the Mtkvari, destroyed by Timur and left as a mound in the ground
    for centuries. The modern city began in 1948 around the Transcaucasian Metallurgical Plant. It was
    planned from nothing, and it shows.


    **Dzveli Rustavi**, the old town on the right bank, is a single Stalinist ensemble: a broad boulevard
    running from the plant to the river, colonnaded facades, loggias, a house of culture, symmetrical
    squares. This is neoclassicism of the late 1940s and 1950s, built to an ideal of what a Soviet industrial
    city should look like. On the left bank are panel housing districts of the 1960s to 1980s — a different
    aesthetic and a different era of the same project.


    For anyone travelling by car, Rustavi has two further draws. **Rustavi International Motorpark**,
    just outside the city, was completely rebuilt in 2012 and is the main racing circuit of the region;
    something is usually happening at weekends. And the **car market** here is the largest second-hand
    vehicle bazaar in the Caucasus, thousands of cars in ranks, mostly imported from the United States
    and Europe. Even with nothing to buy, the scale is worth seeing.
  tip: >-
    Three hours covers the old centre and the market. The car market is busiest at weekends and calmer
    in the morning; wear proper shoes, since the ground is large and dusty. Cafes, cash machines and fuel
    are all in the centre. Rustavi is hotter than Tbilisi in summer, and the shade is on the boulevard.
    Check the motorpark's event schedule in advance or you may find the gates closed.
  route: >-
    Take the Rustavi motorway southeast from Tbilisi — 30 km, about thirty-five minutes. It is a good
    two-lane dual carriageway, though the exit from Tbilisi backs up at rush hour. The motorpark and the
    car market both sit beside the main road shortly before the city and are clearly signed. Parking in
    the centre is plentiful and free. An economy car is entirely sufficient.
ru:
  name: Рустави
  short: >-
    Советский промышленный город на Мтквари, со сталинским центром, гоночной трассой и крупнейшим авторынком
    Кавказа.
  body: >-
    **Рустави — неожиданный объект для архитектурной поездки и на редкость честный.** Город лежит в тридцати
    километрах от Тбилиси и остаётся самым наглядным примером индустриальной истории Грузии.


    Старый Рустави был средневековым городом на Мтквари, разрушенным Тимуром и на столетия оставшимся
    холмом в земле. Современный город начали в 1948 году вокруг Закавказского металлургического завода.
    Его спланировали с нуля, и это видно.


    **Дзвели Рустави**, старый город на правом берегу, — цельный сталинский ансамбль: широкий бульвар
    от завода к реке, фасады с колоннами, лоджии, дом культуры, симметричные площади. Это неоклассицизм
    конца 1940-х и 1950-х, построенный по идеалу советского индустриального города. На левом берегу —
    панельные кварталы 1960-80-х годов, другая эстетика и другая эпоха того же проекта.


    Для тех, кто путешествует на машине, у Рустави есть ещё два повода. **Автодром Рустави** рядом с городом
    полностью перестроен в 2012 году и остаётся главной гоночной трассой региона; по выходным там обычно
    что-то происходит. А местный **авторынок** — крупнейший базар подержанных машин на Кавказе: тысячи
    автомобилей рядами, в основном ввезённых из США и Европы. Даже если ничего не покупать, масштаб стоит
    увидеть.
  tip: >-
    Трёх часов достаточно на старый центр и рынок. Авторынок наиболее загружен по выходным и спокойнее
    утром; обувь нужна нормальная, территория большая и пыльная. Кафе, банкоматы и заправки — в центре.
    Летом в Рустави жарче, чем в Тбилиси, тень только на бульваре. Расписание событий на автодроме проверьте
    заранее, иначе рискуете застать закрытые ворота.
  route: >-
    Из Тбилиси на юго-восток по руставской автомагистрали — 30 км, примерно тридцать пять минут. Это хорошая
    двухполосная скоростная дорога, но выезд из Тбилиси в час пик стоит. Автодром и авторынок расположены
    у самой трассы незадолго до города и хорошо обозначены. Парковка в центре просторная и бесплатная.
    Машины эконом-класса вполне достаточно.
fa:
  name: روستاوی
  short: >-
    شهری صنعتی از دورهٔ شوروی بر مْتکواری، با مرکزی به سبک استالینی، پیست اتومبیل‌رانی و بزرگ‌ترین بازار
    خودروی قفقاز.
  body: >-
    **روستاوی موضوعی غیرمنتظره برای گشتی معمارانه است، و به‌طرز نادری صادقانه.** شهر سی کیلومتر با تفلیس
    فاصله دارد و روشن‌ترین نمونهٔ تاریخ صنعتی گرجستان در سراسر کشور است.


    روستاویِ کهن شهری از سده‌های میانه بر مْتکواری بود که تیمور ویرانش کرد و قرن‌ها تنها تپه‌ای در خاک
    ماند. شهر امروزی در ۱۹۴۸ گرد کارخانهٔ متالورژی ماوراء قفقاز آغاز شد. از صفر طراحی شد و این پیداست.


    **دزولی روستاوی**، شهر قدیم بر کرانهٔ راست، مجموعه‌ای یکپارچه به سبک استالینی است: بلواری پهن از کارخانه
    تا رود، نماهایی ستون‌دار، ایوان‌های سرپوشیده، خانهٔ فرهنگ، و میدان‌های متقارن. این نئوکلاسیسیسمِ اواخر
    دههٔ ۱۹۴۰ و دههٔ ۱۹۵۰ است، ساخته‌شده بر آرمانی از آنکه شهر صنعتی شوروی چگونه باید باشد. بر کرانهٔ
    چپ محله‌های پیش‌ساختهٔ دهه‌های ۱۹۶۰ تا ۱۹۸۰ است؛ زیبایی‌شناسی دیگر و دوره‌ای دیگر از همان پروژه.


    برای هر که با خودرو سفر می‌کند، روستاوی دو جاذبهٔ دیگر دارد. **پیست بین‌المللی روستاوی**، بیرون شهر،
    در ۲۰۱۲ به‌کلی بازسازی شد و پیست اصلی مسابقات منطقه است؛ آخر هفته‌ها معمولاً برنامه‌ای برپاست. و **بازار
    خودرو** اینجا بزرگ‌ترین بازار خودروی دست دوم قفقاز است، هزاران خودرو در ردیف، بیشتر وارداتی از آمریکا
    و اروپا. حتی اگر چیزی برای خرید نداشته باشید، این مقیاس دیدنی است.
  tip: >-
    سه ساعت مرکز قدیم و بازار را می‌پوشاند. بازار خودرو آخر هفته‌ها شلوغ‌ترین است و صبح‌ها آرام‌تر؛ کفش
    مناسب بپوشید، چون محوطه بزرگ و خاکی است. کافه، خودپرداز و پمپ بنزین همه در مرکزند. تابستان روستاوی
    گرم‌تر از تفلیس است و سایه تنها روی بلوار پیدا می‌شود. برنامهٔ رویدادهای پیست را از پیش بررسی کنید
    وگرنه ممکن است درها بسته باشند.
  route: >-
    از تفلیس به جنوب‌شرق روی بزرگراه روستاوی — ۳۰ کیلومتر، حدود سی‌وپنج دقیقه. جاده‌ای دوبانده و خوب است،
    هرچند خروجی تفلیس در ساعات اوج راه‌بندان دارد. پیست و بازار خودرو هر دو کنار جادهٔ اصلی، اندکی پیش
    از شهر، و با تابلوهای روشن قرار دارند. پارکینگ در مرکز فراوان و رایگان است. خودروی اقتصادی کاملاً
    کافی است.
he:
  name: רוסתאווי
  short: עיר תעשייה סובייטית על המטקווארי, עם מרכז מתקופת סטלין, מסלול מירוצים ושוק המכוניות הגדול בקווקז.
  body: >-
    **רוסתאווי היא נושא בלתי צפוי לטיול אדריכלי, וכנה במידה נדירה.** העיר שוכנת שלושים קילומטרים מטביליסי
    והיא הדוגמה הברורה ביותר להיסטוריה התעשייתית של גאורגיה.


    רוסתאווי העתיקה הייתה עיר מימי הביניים על המטקווארי, שתימור החריב אותה והיא נותרה תל באדמה במשך מאות
    שנים. העיר המודרנית החלה ב-1948 סביב מפעל המתכות של עבר הקווקז. היא תוכננה מאפס, וזה ניכר.


    **דזוולי רוסתאווי**, העיר הישנה בגדה הימנית, היא מכלול סטליניסטי אחד: שדרה רחבה מן המפעל אל הנהר,
    חזיתות עם עמודים, לוג'יות, בית תרבות וכיכרות סימטריות. זהו ניאו-קלאסיציזם של שלהי שנות הארבעים ושנות
    החמישים, שנבנה לפי אידיאל של איך צריכה להיראות עיר תעשייה סובייטית. בגדה השמאלית שכונות בנייה טרומית
    משנות השישים עד השמונים — אסתטיקה אחרת ותקופה אחרת של אותו פרויקט.


    למי שנוסע ברכב יש לרוסתאווי שתי משיכות נוספות. **פארק המנועים הבינלאומי רוסתאווי**, ממש מחוץ לעיר,
    נבנה מחדש כליל ב-2012 והוא מסלול המירוצים המרכזי של האזור; בסופי שבוע בדרך כלל מתקיים בו משהו. ו**שוק
    המכוניות** כאן הוא בזאר הרכב המשומש הגדול בקווקז, אלפי מכוניות בשורות, רובן מיובאות מארצות הברית ומאירופה.
    גם בלי כוונה לקנות, קנה המידה שווה מבט.
  tip: >-
    שלוש שעות מכסות את המרכז הישן ואת השוק. שוק המכוניות עמוס בסופי שבוע ורגוע יותר בבוקר; נעלו נעליים
    מתאימות, השטח גדול ומאובק. בתי קפה, כספומטים ודלק נמצאים במרכז. רוסתאווי חמה מטביליסי בקיץ, והצל נמצא
    בשדרה. בדקו מראש את לוח האירועים של מסלול המירוצים, אחרת עלולים למצוא שערים סגורים.
  route: >-
    סעו מטביליסי דרום-מזרחה בכביש המהיר לרוסתאווי — 30 ק״מ, כשלושים וחמש דקות. זהו כביש דו-נתיבי טוב,
    אם כי היציאה מטביליסי נתקעת בשעות העומס. פארק המנועים ושוק המכוניות שוכנים שניהם לצד הכביש הראשי מעט
    לפני העיר ומשולטים היטב. החניה במרכז רבה וחינם. רכב חסכוני מספיק לחלוטין.
ar:
  name: روستافي
  short: مدينة صناعية سوفييتية على متكفاري، بمركز من العهد الستاليني، وحلبة سباق، وأكبر سوق سيارات في
    القوقاز.
  body: >-
    **روستافي موضوع غير متوقع لجولة معمارية، وصادق إلى حد نادر.** تقع المدينة على بعد ثلاثين كيلومتراً
    من تبليسي، وهي أوضح مثال على التاريخ الصناعي لجورجيا في البلاد كلها.


    كانت روستافي القديمة مدينة من العصور الوسطى على متكفاري، دمّرها تيمور فبقيت تلاً في الأرض قروناً.
    أما المدينة الحديثة فبدأت عام 1948 حول مصنع ما وراء القوقاز للمعادن. خُططت من الصفر، وهذا ظاهر.


    و**دزفيلي روستافي**، المدينة القديمة على الضفة اليمنى، مجموعة ستالينية واحدة: جادة عريضة تمتد من المصنع
    إلى النهر، وواجهات ذات أعمدة، وشرفات مسقوفة، ودار للثقافة، وميادين متناظرة. وهذه كلاسيكية جديدة من
    أواخر الأربعينيات والخمسينيات، بُنيت وفق مثال لما ينبغي أن تبدو عليه مدينة صناعية سوفييتية. وعلى الضفة
    اليسرى أحياء البناء الجاهز من الستينيات إلى الثمانينيات — جمالية أخرى وحقبة أخرى من المشروع نفسه.


    ولمن يسافر بالسيارة في روستافي جاذبان إضافيان. **حلبة روستافي الدولية**، خارج المدينة مباشرة، أُعيد
    بناؤها بالكامل عام 2012 وهي حلبة السباق الرئيسية في المنطقة؛ وعادة ما يجري فيها شيء في عطلات نهاية
    الأسبوع. أما **سوق السيارات** هنا فهو أكبر بازار للمركبات المستعملة في القوقاز، آلاف السيارات في صفوف،
    معظمها مستورد من الولايات المتحدة وأوروبا. وحتى إن لم تنوِ الشراء، فالحجم وحده يستحق النظر.
  tip: >-
    ثلاث ساعات تغطي المركز القديم والسوق. وسوق السيارات أشد ازدحاماً في عطلة نهاية الأسبوع وأهدأ صباحاً؛
    والبس حذاءً مناسباً فالأرض واسعة ومغبرة. والمقاهي والصرافات والوقود كلها في المركز. وروستافي أحرّ
    من تبليسي صيفاً، والظل على الجادة. وتحقق مسبقاً من جدول فعاليات الحلبة وإلا وجدت البوابات مغلقة.
  route: >-
    خذ طريق روستافي السريع جنوب شرق من تبليسي — 30 كم، نحو خمس وثلاثين دقيقة. وهو طريق مزدوج جيد بمسربين،
    وإن كان المخرج من تبليسي يزدحم في ساعة الذروة. وتقع الحلبة وسوق السيارات كلتاهما بجوار الطريق الرئيسي
    قبيل المدينة وعليهما لافتات واضحة. والوقوف في المركز وفير ومجاني. وسيارة اقتصادية تكفي تماماً.
