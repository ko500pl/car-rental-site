ka:
  name: თელავის 900 წლის ჭადარი
  short: >-
    დაახლოებით 40 მეტრის სიმაღლისა და 11 მეტრის გარშემოწერილობის აღმოსავლური ჭადარი თელავის გულში, ერეკლე
    II-ის ძეგლიდან რამდენიმე ნაბიჯზე.
  body: >-
    **თელავის უხუცეს მკვიდრს არც სახურავი აქვს, არც სალარო და არც დაბადების მოწმობა — მხოლოდ ტანი, რომლის
    შემოსახვევად ექვსი-შვიდი კაცი ხელიხელჩაკიდებული დაგჭირდებათ.**


    ეს აღმოსავლური ჭადარია (Platanus orientalis). ქალაქის ცენტრში, ჭადრის ქუჩაზე დგას — იმ მოედნიდან ორიოდე
    ნაბიჯზე, სადაც ერეკლე II ბრინჯაოს ცხენზე ზის. სიმაღლე დაახლოებით 40 მეტრია (ზოგი წყარო 45-საც ასახელებს),
    ტანის გარშემოწერილობა — 11-12 მეტრი. ხნოვანებად ცხრაას წელს უთვლიან. ეს რიცხვი ყველგან მეორდება, მაგრამ
    არსად გაზომილა: წლიური რგოლების დათვლის შედეგი არავის გამოუქვეყნებია. თუმცა არც ზღაპარია — აღმოსავლური
    ჭადარი ძველი სამყაროს ყველაზე დღეგრძელ ხეებს შორისაა: ირანში, ოსკუში, ერთ ჭადარს დაახლოებით 1200 წელს
    მიაწერენ.


    თუ ეს ცხრაასი წელი მიახლოებით მაინც სწორია, ხე უკვე ხნიერი იყო 1616 წელს, როცა შაჰ-აბას I-მა გრემი
    დაარბია და კახეთის სამეფოს დედაქალაქი თელავში გადმოვიდა. ერეკლე II-ს კი, რომელიც XVIII საუკუნეში აქედან
    კახეთს მართავდა, უკვე ბებერ ხედ დახვდა.


    კავკასიიდან ხმელთაშუა ზღვის აღმოსავლეთ სანაპირომდე ჭადარი სოფლის მოედნის ხეა: ხშირად წყაროსთან რგავდნენ,
    ხოლო ხნიერი ჭადარი ადგილობრივთა სიამაყედ იქცეოდა. თელავიც ასეა. ჭრელი ქერქი ფირფიტებად ცვივა და ქვემოდან
    მოყვითალო-თეთრ და მომწვანო ფენას აჩენს, ზაფხულში კი ვარჯი ქუჩაზე ფართო, გრილ ჩრდილს აფენს.


    მეფეები მოდიოდნენ და მიდიოდნენ. ჭადარი კი ისევ იმას აკეთებს, რასაც ყოველთვის — ჩრდილს უნახავს ყველას,
    ვინც მის ქვეშ ჩამოჯდება.
  tip: >-
    ჭადართან მისვლა უფასოა და ნებისმიერ დროს შეიძლება. ოცი წუთი სავსებით საკმარისია, ამიტომ ნახევარი კილომეტრით
    დაშორებულ ბატონის ციხესა და დილის ბაზარს გაუერთიანეთ. ერეკლე II-ის ძეგლის ირგვლივ მანქანის დაყენება
    ჩვეულებრივ ადვილია, მოედანზე კაფეებიცაა და საპირფარეშოც. ადრე დილით ან საღამოსკენ მოდით: დახრილი მზე
    ქერქს აცოცხლებს, ზაფხულის შუადღე კი თელავში მწველია. ფესვებზე ნუ ადგებით და ტანზე ნურაფერს ამოჭრით
    ან დაამაგრებთ — ხეს უკვე დასჭირდა სარეაბილიტაციო პროექტი. ალავერდი, იყალთო და წინანდალი ნახევარი საათის
    სავალზეა.
  route: >-
    მოკლე გზა გომბორის უღელტეხილზე გადის: თბილისიდან კახეთის გზატკეცილით (ს5) გადით, ვაზიანთან შ38-ზე
    გადაუხვიეთ და ქედზე გადასვლის შემდეგ თელავში ჩაეშვით — დაახლოებით 94 კმ და საათი და სამი მეოთხედი.
    გზა ბოლომდე ასფალტიანია, თხემთან ვიწრო და კლაკნილი, ძლიერი თოვლის შემდეგ კი შეიძლება დროებით ჩაიკეტოს.
    გრძელი, მაგრამ უფრო ვაკე გზა ს5-ით საგარეჯოს გავლით ბაკურციხემდე მიდის, იქიდან კი შ42-ით, გურჯაანის
    გავლით, ჩრდილოეთით უხვევს: დაახლოებით 150 კმ და ორნახევარი საათი. ეკონომ-კლასის მანქანა ორივესთვის
    საკმარისია. ჭადარი ჭადრის ქუჩაზე, მთავარ მოედანთან ახლოს დგას; საწვავი თბილისში ან თელავში ჩაასხით.
en:
  name: Telavi's 900-Year-Old Plane Tree
  short: >-
    An oriental plane about 40 metres tall and 11 metres round, a few steps from Erekle II's statue in
    the heart of Telavi.
  body: >-
    **Telavi's oldest resident has no roof, no ticket office and no birth certificate — only a trunk that
    would take six or seven people, hand in hand, to encircle.**


    It is an oriental plane, Platanus orientalis, standing on Chadri Street — Plane Tree Street — a few
    steps from the square where Erekle II sits his bronze horse. It is about 40 metres tall (some sources
    say 45), with a girth of 11 to 12 metres. Tradition gives it 900 years. The figure is repeated everywhere
    and measured nowhere: no tree-ring count has been published. Yet it is not fanciful. Oriental planes
    are among the longest-lived trees of the Old World, and one at Osku in Iran is credited with some
    1,200 years.


    If the 900 years are even roughly right, the tree was already old in 1616, when Shah Abbas I sacked
    Gremi and the capital of Kakheti moved to Telavi, and already an old giant when Erekle II ruled Kakheti
    from here in the 18th century.


    From the Caucasus to the eastern Mediterranean, the plane is the tree of the village square, often
    planted beside a spring, and great age makes it a matter of local pride. Telavi is no exception. The
    mottled bark flakes away in plates to show cream and olive beneath, and in summer the crown throws
    a broad, cool shade across the street.


    Kings came and went. The tree still does what it has always done: it keeps the shade for whoever sits
    down next.
  tip: >-
    It is free and open at every hour, and twenty minutes is enough, so fold it into a walk with the Batonis
    Tsikhe fortress, half a kilometre away, and the morning market. Parking is usually easy around the
    Erekle II statue, and the square has cafés and toilets. Come early or late in the day: the low sun
    lights up the bark, and summer noon in Telavi is fierce. Keep off the roots and never carve or pin
    anything to the trunk — the tree has already needed a rehabilitation project. Alaverdi, Ikalto and
    Tsinandali are all within half an hour's drive.
  route: >-
    The short way crosses the Gombori Pass: leave Tbilisi on the S5 Kakheti highway, turn onto the Sh38
    near Vaziani and follow it over the range and down into Telavi — about 94 km and an hour and three-quarters.
    It is asphalt all the way, narrow and winding near the top, and heavy snow can close it for a while.
    The longer, flatter alternative stays on the S5 through Sagarejo to Bakurtsikhe, then turns north
    on the Sh42 through Gurjaani: about 150 km and two and a half hours. An economy car is fine either
    way. The tree stands on Chadri Street, just off the main square; fill up in Tbilisi or Telavi.
ru:
  name: 900-летний платан Телави
  short: >-
    Восточный платан высотой около 40 метров и обхватом 11 метров — в нескольких шагах от памятника Ираклию
    II, в самом сердце Телави.
  body: >-
    **У старейшего жителя Телави нет ни крыши, ни кассы, ни свидетельства о рождении — только ствол, который
    под силу обхватить разве что шестерым-семерым, взявшимся за руки.**


    Это восточный платан. Он стоит на улице Чадри — то есть Платановой — в нескольких шагах от площади,
    где Ираклий II восседает на бронзовом коне. Высота его около 40 метров (по некоторым источникам —
    45), обхват — от 11 до 12 метров. Предание даёт ему 900 лет. Эту цифру повторяют повсюду, но нигде
    не измеряли: подсчёт годичных колец не опубликован. И всё же она не фантастична. Восточные платаны
    — одни из самых долгоживущих деревьев Старого Света, а платану в иранском Оску приписывают около 1200
    лет.


    Если 900 лет хотя бы приблизительно верны, дерево было уже старым в 1616 году, когда шах Аббас I разорил
    Греми и столица Кахети переехала в Телави, и уже старым великаном, когда в XVIII веке отсюда правил
    Кахети Ираклий II.


    От Кавказа до Восточного Средиземноморья платан — дерево деревенской площади, его часто сажают у родника,
    а почтенный возраст делает его предметом местной гордости. Телави — не исключение. Пятнистая кора
    отслаивается пластинами, открывая под собой кремовые и оливковые тона, а летом крона бросает на улицу
    широкую прохладную тень.


    Цари приходили и уходили. Дерево по-прежнему делает то, что делало всегда: бережёт тень для того,
    кто присядет следующим.
  tip: >-
    Вход свободный в любое время, и двадцати минут хватит, так что включите платан в прогулку вместе с
    крепостью Батонис-Цихе в полукилометре отсюда и утренним рынком. Припарковаться у памятника Ираклию
    II обычно легко, на площади есть кафе и туалеты. Приходите рано утром или ближе к вечеру: низкое солнце
    высвечивает кору, а летний полдень в Телави беспощаден. Не вставайте на корни и ничего не вырезайте
    на стволе и не прикрепляйте к нему — дереву уже понадобился проект реабилитации. Алаверди, Икалто
    и Цинандали — в пределах получаса езды.
  route: >-
    Короткий путь лежит через Гомборский перевал: выезжайте из Тбилиси по Кахетинскому шоссе S5, у Вазиани
    сверните на Sh38 и по ней перевалите хребет и спуститесь в Телави — около 94 км и час сорок пять минут.
    Асфальт на всём пути, у вершины дорога узкая и извилистая, а сильный снегопад может на время её закрыть.
    Более длинная и ровная альтернатива — оставаться на S5 через Сагареджо до Бакурцихе, затем свернуть
    на север по Sh42 через Гурджаани: около 150 км и два с половиной часа. В обоих случаях подойдёт машина
    эконом-класса. Дерево стоит на улице Чадри, сразу у главной площади; заправьтесь в Тбилиси или Телави.
fa:
  name: چنار ۹۰۰ سالهٔ تلاوی
  short: چناری شرقی به بلندی حدود ۴۰ متر و محیط ۱۱ متر، چند قدم آن‌سوتر از تندیس ارکلی دوم در قلب تلاوی.
  body: >-
    **کهن‌سال‌ترین ساکن تلاوی نه سقفی دارد، نه گیشهٔ بلیتی و نه شناسنامه‌ای — فقط تنه‌ای که شش هفت نفر
    باید دست در دست هم بدهند تا دورش را بگیرند.**


    این چناری شرقی است در خیابان چادری — یعنی خیابان چنار — چند قدم آن‌سوتر از میدانی که ارکلی دوم بر
    اسب مفرغی‌اش نشسته است. بلندی‌اش حدود ۴۰ متر است (برخی منابع ۴۵ می‌گویند) و محیط تنه‌اش ۱۱ تا ۱۲ متر.
    سنت ۹۰۰ سال به آن نسبت می‌دهد. این عدد همه‌جا تکرار می‌شود و هیچ‌جا اندازه‌گیری نشده است: هیچ شمارشی
    از حلقه‌های رشد آن منتشر نشده. با این همه، خیال‌بافی هم نیست. چنارهای شرقی از دیرزی‌ترین درختان دنیای
    قدیم‌اند، و برای چناری در اسکوی ایران حدود ۱,۲۰۰ سال عمر قائل‌اند.


    اگر آن ۹۰۰ سال حتی تقریباً درست باشد، درخت در ۱۶۱۶، هنگامی که شاه عباس یکم گرمی را غارت کرد و پایتخت
    کاختی به تلاوی منتقل شد، از پیش کهن بوده است، و هنگامی که ارکلی دوم در سدهٔ هجدهم از اینجا بر کاختی
    فرمان می‌راند، غولی سالخورده.


    از قفقاز تا شرق مدیترانه، چنار درخت میدان روستاست و اغلب کنار چشمه‌ای کاشته می‌شود، و سالخوردگی آن
    را مایهٔ افتخار محلی می‌کند. تلاوی هم از این قاعده بیرون نیست. پوست ابلق درخت تکه‌تکه ورمی‌آید و رنگ‌های
    کرم و زیتونیِ زیرش را نشان می‌دهد، و در تابستان تاجش سایه‌ای پهن و خنک بر خیابان می‌گستراند.


    شاهان آمدند و رفتند. درخت همان کاری را می‌کند که همیشه کرده است: سایه را برای هر کس که پس از این بنشیند
    نگه می‌دارد.
  tip: >-
    رایگان است و در هر ساعتی باز، و بیست دقیقه کافی است؛ پس آن را در گشتی پیاده همراه با دژ باتونیس تسیخه،
    در نیم کیلومتری، و بازار صبحگاهی بگنجانید. پیدا کردن جای پارک در اطراف تندیس ارکلی دوم معمولاً آسان
    است و میدان کافه و سرویس بهداشتی دارد. اول صبح یا اواخر روز بیایید: آفتاب کم‌ارتفاع پوست درخت را روشن
    می‌کند، و ظهر تابستانِ تلاوی سوزان است. پا روی ریشه‌ها نگذارید و هرگز چیزی روی تنه حک نکنید یا به
    آن نصب نکنید — درخت پیش از این هم به طرح احیا نیاز پیدا کرده است. آلاوردی، ایکالتو و تسیناندالی همه
    در فاصلهٔ نیم ساعت رانندگی‌اند.
  route: >-
    راه کوتاه از گردنهٔ گومبوری می‌گذرد: از تفلیس با بزرگراه کاختی S5 بیرون بروید، نزدیک وازیانی به Sh38
    بپیچید و آن را از فراز رشته‌کوه و در سراشیبی تا تلاوی دنبال کنید — حدود ۹۴ کیلومتر و یک ساعت و سه‌ربع.
    سراسر آسفالت است، نزدیک گردنه باریک و پرپیچ‌وخم، و برف سنگین ممکن است مدتی آن را ببندد. جایگزین طولانی‌تر
    و هموارتر این است که روی S5 بمانید و از ساگارجو تا باکورتسیخه بروید، سپس با Sh42 از راه گورجانی به
    شمال بپیچید: حدود ۱۵۰ کیلومتر و دو ساعت و نیم. در هر دو مسیر خودروی اقتصادی کافی است. درخت در خیابان
    چادری است، درست کنار میدان اصلی؛ در تفلیس یا تلاوی باک را پر کنید.
he:
  name: עץ הדולב בן 900 השנים של טלאווי
  short: דולב מזרחי בגובה כ-40 מטר ובהיקף 11 מטר, כמה צעדים מפסלו של ארקלה השני בלב טלאווי.
  body: >-
    **לתושב הוותיק ביותר של טלאווי אין גג, אין קופה ואין תעודת לידה — רק גזע שדרושים שישה או שבעה אנשים,
    יד ביד, כדי להקיף אותו.**


    זהו דולב מזרחי הניצב ברחוב צ'דרי — כלומר רחוב הדולב — כמה צעדים מהכיכר שבה יושב ארקלה השני על סוס
    הברונזה שלו. גובהו כ-40 מטר (יש מקורות שאומרים 45), והיקף גזעו 11 עד 12 מטר. המסורת מייחסת לו 900
    שנה. המספר חוזר בכל מקום ולא נמדד בשום מקום: לא פורסמה ספירה של טבעות השנה שלו. ובכל זאת אין הוא דמיוני.
    הדולבים המזרחיים הם מן העצים ארוכי החיים ביותר בעולם הישן, ולדולב אחד באוסקו שבאיראן מייחסים כ-1,200
    שנה.


    אם 900 השנים נכונות ולו בקירוב, העץ היה זקן כבר ב-1616, כשהשאה עבאס הראשון בזז את גרמי ובירת קאחתי
    עברה לטלאווי, והיה כבר ענק קשיש כשארקלה השני שלט מכאן בקאחתי במאה ה-18.


    מהקווקז ועד מזרח הים התיכון, הדולב הוא עץ כיכר הכפר, ולא פעם ניטע ליד מעיין, וגיל מופלג הופך אותו
    לגאווה מקומית. טלאווי אינה יוצאת דופן. הקליפה המנומרת מתקלפת בלוחות וחושפת מתחתיה גוני שמנת וזית,
    ובקיץ הצמרת מטילה צל רחב וקריר על הרחוב.


    מלכים באו והלכו. העץ עדיין עושה את מה שעשה תמיד: שומר את הצל למי שיתיישב תחתיו הבא בתור.
  tip: >-
    הכניסה חופשית בכל שעה, ועשרים דקות מספיקות, לכן שלבו אותו בסיור רגלי עם מבצר בטוניס ציחה, במרחק חצי
    קילומטר, ועם שוק הבוקר. בדרך כלל קל למצוא חניה סביב פסלו של ארקלה השני, ובכיכר יש בתי קפה ושירותים.
    בואו מוקדם או מאוחר ביום: השמש הנמוכה מאירה את הקליפה, וצהרי הקיץ בטלאווי לוהטים. אל תדרכו על השורשים,
    ולעולם אל תחרטו דבר על הגזע ואל תצמידו אליו דבר — העץ כבר נזקק לפרויקט שיקום. אלברדי, איקלטו וצינאנדלי
    נמצאות כולן בטווח של חצי שעה נסיעה.
  route: >-
    הדרך הקצרה חוצה את מעבר גומבורי: צאו מטביליסי בכביש קאחתי S5, פנו לכביש Sh38 סמוך לוואזיאני ועקבו
    אחריו מעל הרכס ובירידה אל טלאווי — כ-94 ק"מ ושעה ושלושה רבעים. אספלט לכל האורך, צר ומפותל סמוך לפסגה,
    ושלג כבד עלול לסגור אותו לזמן מה. החלופה הארוכה והמישורית יותר נשארת על S5 דרך סגרג'ו עד בקורציחה,
    ואז פונה צפונה בכביש Sh42 דרך גורג'אני: כ-150 ק"מ ושעתיים וחצי. רכב חסכוני מתאים בשתי הדרכים. העץ
    ניצב ברחוב צ'דרי, ממש ליד הכיכר הראשית; תדלקו בטביליסי או בטלאווי.
ar:
  name: شجرة الدلب ذات التسعمئة عام في تيلافي
  short: دلبة شرقية يبلغ ارتفاعها نحو 40 مترًا ومحيطها 11 مترًا، على بُعد خطوات من تمثال إريكلي الثاني
    في قلب تيلافي.
  body: >-
    **لأقدم سكان تيلافي لا سقف، ولا شبّاك تذاكر، ولا شهادة ميلاد — ليس له إلا جذعٌ يحتاج ستةً أو سبعة
    أشخاص متشابكي الأيدي ليحيطوا به.**


    إنها دلبة شرقية تقف في شارع تشادري — أي شارع الدلب — على بعد خطوات من الساحة التي يمتطي فيها إريكلي
    الثاني حصانه البرونزي. يبلغ ارتفاعها نحو 40 مترًا (وتذكر بعض المصادر 45)، ومحيط جذعها بين 11 و12 مترًا.
    ويمنحها التقليد 900 عام. رقمٌ يتكرر في كل مكان ولم يُقَس في أي مكان: فلم يُنشر أي عدٍّ لحلقات نموها.
    ومع ذلك فهو ليس ضربًا من الخيال. فالدلب الشرقي من أطول أشجار العالم القديم عمرًا، ويُنسب إلى دلبة
    في أسكو بإيران نحو 1,200 عام.


    إن صحّت الأعوام التسعمئة ولو على وجه التقريب، فقد كانت الشجرة عجوزًا بالفعل عام 1616، حين نهب الشاه
    عباس الأول غريمي وانتقلت عاصمة كاختي إلى تيلافي، وكانت عملاقًا مسنًّا حين حكم إريكلي الثاني كاختي
    من هنا في القرن الثامن عشر.


    من القوقاز إلى شرق المتوسط، الدلب هو شجرة ساحة القرية، وكثيرًا ما يُغرس بجوار نبع، ويجعله العمر المديد
    مصدر فخر محلي. وتيلافي ليست استثناءً. يتقشر لحاء الشجرة المبقّع صفائحَ تكشف تحتها ألوانًا قشدية وزيتونية،
    وفي الصيف يلقي تاجها ظلًّا واسعًا باردًا على الشارع.


    جاء ملوك ومضوا. وما زالت الشجرة تفعل ما فعلته دائمًا: تحفظ الظل لمن يأتي ليجلس تحتها تاليًا.
  tip: >-
    الزيارة مجانية ومتاحة في كل ساعة، وتكفيها عشرون دقيقة، فأدرجها في جولة مشي مع قلعة باتونيس تسيخه على
    بعد نصف كيلومتر، ومع السوق الصباحي. العثور على موقف للسيارة حول تمثال إريكلي الثاني سهل عادةً، وفي
    الساحة مقاهٍ ودورات مياه. تعالَ في أول النهار أو آخره: فالشمس المنخفضة تضيء اللحاء، وظهيرة الصيف في
    تيلافي لاهبة. لا تطأ الجذور، ولا تحفر شيئًا على الجذع ولا تثبّت عليه شيئًا أبدًا — فقد احتاجت الشجرة
    بالفعل إلى مشروع إعادة تأهيل. ألافيردي وإيكالتو وتسيناندالي كلها على مسافة نصف ساعة بالسيارة.
  route: >-
    الطريق الأقصر يعبر ممر غومبوري: اخرج من تبليسي على طريق كاختي السريع S5، وانحرف إلى Sh38 قرب فازياني،
    واتبعه فوق السلسلة الجبلية نزولًا إلى تيلافي — نحو 94 كم وساعة وثلاثة أرباع الساعة. الطريق أسفلت كله،
    ضيق ومتعرج قرب القمة، وقد يغلقه الثلج الكثيف بعض الوقت. البديل الأطول والأكثر استواءً هو البقاء على
    S5 عبر ساغاريجو حتى باكورتسيخي، ثم الانعطاف شمالًا على Sh42 عبر غورجاني: نحو 150 كم وساعتان ونصف.
    السيارة الاقتصادية تفي بالغرض في الحالتين. تقف الشجرة في شارع تشادري، بجوار الساحة الرئيسية مباشرة؛
    تزوّد بالوقود في تبليسي أو تيلافي.
