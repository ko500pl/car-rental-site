ka:
  name: ნოქალაქევი (არქეოპოლისი)
  short: >-
    ეგრისის სამეფოს ციხე-ქალაქი ტეხურის ხეობაზე, სადაც VI საუკუნეში ბიზანტია და ირანი იბრძოდნენ, არქეოლოგები
    კი დღესაც თხრიან.
  body: >-
    **ნოქალაქევი მეგრულად „ნაქალაქარს“ ნიშნავს — ადგილს, სადაც ოდესღაც ქალაქი იდგა. VIII საუკუნეში გამქრალ
    ქალაქს კი გასაოცრად მტკიცე კედლები შემორჩა.**


    ქართული მატიანეები მას ციხეგოჯს, „ქუჯის ციხეს“ უწოდებენ: გადმოცემით, ის ეგრისის ერისთავმა ქუჯიმ ძვ.
    წ. III საუკუნის დასაწყისში ააგო. ბიზანტიელი ავტორებისთვის ეს არქეოპოლისი, „ძველი ქალაქი“ იყო — ლაზიკის
    მთავარი სიმაგრე. ტეხური აქ მარყუჟს აკეთებს და კირქვაში ხეობას ჭრის: მდინარის მხარეს, ციცაბო კლდეებზე
    ერთი კედელიც საკმარისი იყო, ღია აღმოსავლეთით კი სამი პარალელური კედელი აღმართეს. ჩრდილოეთით, ციცაბო
    მთაზე, სამ ჰექტარზე მეტი ფართობის ციტადელი დგას, რომელსაც ქვედა ქალაქთან კედელი აერთებს.


    540–562 წლების ლაზიკის ომში აქ ბიზანტია და სასანური ირანი ერკინებოდნენ ერთმანეთს. სპარსელმა სარდალმა
    მიჰრ-მიჰროემ არქეოპოლისის აღება ორჯერ სცადა და ორჯერვე უშედეგოდ; 551 წელს მისი ჯარი უსურსათობამ გამოფიტა.
    მისმა მემკვიდრემ ნახორაგანმა ქალაქი ცოტა ხნით მაინც აიღო და დაანგრია, მაგრამ 556 წელს ბიზანტიელებმა
    და ლაზებმა ის დაიბრუნეს. 737–738 წლებში ქალაქი არაბმა სარდალმა მურვან ყრუმ გაანადგურა.


    ქვედა ქალაქში ეგრისის მეფეთა IV საუკუნის სასახლის ნანგრევები, V საუკუნის სამნავიანი ბაზილიკა, VI საუკუნის
    დასაწყისის ბაზილიკა, მოგვიანებით გუმბათოვან ეკლესიად გადაკეთებული, კოშკიანი ჭიშკარი და ორი აბანოა
    — ერთი მათგანი იატაკქვეშა გათბობით. კლდეში ნაკვეთი საფეხურებიანი გვირაბი მდინარისკენ ეშვება; ტრადიციით,
    ალყის დროს ქალაქი წყალს აქედან იღებდა.


    ნანგრევები არქეოპოლისად 1833–1834 წლებში შვეიცარიელმა ფრედერიკ დიუბუა დე მონპერემ ამოიცნო. 1930–1931
    წლებში ქართულ-გერმანულმა ექსპედიციამ აქ იმპერატორ მავრიკიოსის ოქროს სოლიდების განძი იპოვა, 2001 წლიდან
    კი ანგლო-ქართული ექსპედიცია თხრის.


    ზემო ციხეზე ნაშუადღევს ადით: სამხრეთით კოლხეთის დაბლობი გადაიშლება და ერთი შეხედვით მიხვდებით, რატომ
    ედავებოდნენ ამ ბორცვს იმპერიები.
  tip: >-
    გაითვალისწინეთ საათნახევრიდან ორ საათამდე. ფეხსაცმელი მოუცურავი ძირით ჩაიცვით: ტერიტორია ბალახიანი
    და დაქანებულია, მდინარისკენ მიმავალი გვირაბი კი ვიწრო და სველი, ამიტომ ფანარი გამოგადგებათ. ციტადელამდე
    აღმართი ციცაბო და უჩრდილოა; სამეგრელოს ნოტიო ზაფხულში დილით ან ნაშუადღევს წადით და წყალი თან იქონიეთ.
    ადგილობრივ მუზეუმში გათხრების მასალაა გამოფენილი; შესვლა დაახლოებით 10 ₾ ღირს. ძეგლის გვერდით, ტეხურის
    მარჯვენა ნაპირზე, ბუნებრივი ცხელი წყაროები გამოდის. უახლოესი ბანკომატი და კაფეები სენაკშია, ამიტომ
    ნაღდი ფული წინასწარ აიღეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით იარეთ, ხაშურის, რიკოთის გვირაბისა და ქუთაისის გავლით სამტრედიამდე,
    შემდეგ ისევ ს1-ით სენაკამდე. სენაკში ჩრდილოეთით, მარტვილის გზაზე გადაუხვიეთ; ნოქალაქევი დაახლოებით
    15 კილომეტრშია, ტეხურის პირას. სულ დაახლოებით 300 კილომეტრი და ოთხნახევარი საათია, ბოლომდე ასფალტით;
    ბოლო მონაკვეთი ვიწრო, მაგრამ მოწესრიგებული სოფლის გზაა, ამიტომ ეკონომ-კლასის მანქანაც საკმარისია.
    საწვავი სამტრედიაში ან სენაკში ჩაასხით. მარტვილის კანიონი დაახლოებით ორმოც წუთშია, ასე რომ ორივეს
    ერთ დღეში მოასწრებთ.
en:
  name: Nokalakevi (Archaeopolis)
  short: >-
    The walled capital of ancient Egrisi above the Tekhuri gorge, fought over by Byzantium and Persia
    in the 6th century and still being excavated.
  body: >-
    **Nokalakevi means, in Mingrelian, "where the city used to be"; for a city gone since the eighth century,
    it keeps remarkably good walls.**


    Georgian chronicles call it Tsikhegoji, "the fortress of Kuji", after an eristavi of Egrisi who, tradition
    says, built it in the early 3rd century BC. To Byzantine writers it was Archaeopolis, the "old city",
    chief stronghold of Lazica. The Tekhuri loops around it here, cutting a gorge through the limestone:
    on the river side the cliffs needed only a single wall, while the open east got three parallel ones.
    To the north, on a steep hill, sits a citadel of more than three hectares, joined to the lower town
    by a wall.


    In the Lazic War of 540–562 Byzantium and Sasanian Persia fought for this ground. The Persian general
    Mihr-Mihroe tried twice to take Archaeopolis and failed both times, his army starving in 551. His
    successor Nachoragan briefly captured and wrecked it, but by 556 the Byzantines and Laz had it back.
    In 737–738 the Arab commander Marwan the Deaf destroyed the city.


    In the lower town lie the ruins of a 4th-century palace of the kings of Egrisi, a 5th-century three-aisled
    basilica, an early 6th-century basilica later rebuilt with a dome, a towered gate and two bath houses,
    one with under-floor heating. A stepped tunnel cut through the rock runs down towards the river; tradition
    says the besieged city drew its water here.


    The Swiss scholar Frédéric Dubois de Montpéreux identified the ruins as Archaeopolis in 1833–34. A
    German-Georgian team found a hoard of Emperor Maurice's gold solidi here in 1930–31, and since 2001
    an Anglo-Georgian expedition has been digging.


    Climb to the citadel in the late afternoon. The Colchian plain opens to the south, and one look explains
    why empires wanted this hill.
  tip: >-
    Allow an hour and a half to two hours. Wear shoes with grip: the ground is grassy and sloping, and
    the tunnel down towards the river is narrow and damp, so bring a torch. The climb to the citadel is
    steep and unshaded; in the humid Samegrelo summer go in the morning or late afternoon and carry water.
    The site museum shows finds from the excavations; entry is about 10 ₾. Natural hot springs rise beside
    the site on the right bank of the Tekhuri. The nearest ATM and cafés are in Senaki, so bring cash.
  route: >-
    From Tbilisi take the S1 (E60) west through Khashuri, the Rikoti tunnel and Kutaisi to Samtredia,
    then stay on the S1 to Senaki. There turn north onto the Martvili road; Nokalakevi is about 15 km
    on, beside the Tekhuri. In all it is some 300 km and four and a half hours, on asphalt throughout.
    The last stretch is a narrow village road in sound condition, so an economy car is fine. Fuel in Samtredia
    or Senaki. Martvili Canyon is about forty minutes away, so the two make an easy day together.
ru:
  name: Нокалакеви (Археополис)
  short: >-
    Обнесённая стенами столица древнего Эгриси над ущельем Техури: в VI веке за неё бились Византия и
    Персия, раскопки идут до сих пор.
  body: >-
    **По-мегрельски Нокалакеви значит «там, где был город»; для города, исчезнувшего ещё в VIII веке,
    стены у него на удивление хорошо сохранились.**


    Грузинские летописи называют его Цихегоджи, «крепость Куджи», — по имени эристава Эгриси, который,
    по преданию, построил её в начале III века до н. э. Для византийских авторов это был Археополис, «древний
    город», главная твердыня Лазики. Техури делает здесь петлю, прорезая в известняке ущелье: со стороны
    реки обрывы требовали лишь одной стены, а открытый восток получил три параллельные. На севере, на
    крутом холме, стоит цитадель площадью больше трёх гектаров, связанная с нижним городом стеной.


    В Лазской войне 540–562 годов за эту землю бились Византия и Сасанидская Персия. Персидский полководец
    Мермероэс (Михр-Михрое) дважды пытался взять Археополис и оба раза потерпел неудачу; в 551 году его
    войско голодало. Его преемник Нахораган ненадолго захватил и разорил город, но к 556 году византийцы
    и лазы вернули его. В 737–738 годах арабский полководец Марван Глухой разрушил город.


    В нижнем городе лежат руины дворца царей Эгриси IV века, трёхнефной базилики V века, базилики начала
    VI века, позднее перестроенной в купольный храм, ворот с башней и двух бань, одна из которых с подпольным
    отоплением. Высеченный в скале ступенчатый туннель спускается к реке; по преданию, отсюда осаждённый
    город брал воду.


    Швейцарский учёный Фредерик Дюбуа де Монпере отождествил руины с Археополисом в 1833–1834 годах. В
    1930–1931 годах германо-грузинская экспедиция нашла здесь клад золотых солидов императора Маврикия,
    а с 2001 года раскопки ведёт англо-грузинская экспедиция.


    Поднимитесь к цитадели ближе к вечеру. К югу раскрывается Колхидская низменность, и одного взгляда
    хватает, чтобы понять, почему империи хотели владеть этим холмом.
  tip: >-
    Отведите на осмотр полтора-два часа. Нужна обувь с цепкой подошвой: земля травянистая и покатая, а
    туннель к реке узкий и сырой, так что возьмите фонарик. Подъём к цитадели крутой и без тени; во влажное
    мегрельское лето идите утром или ближе к вечеру и запаситесь водой. В музее при памятнике выставлены
    находки раскопок; вход около 10 ₾. Рядом с памятником, на правом берегу Техури, бьют природные горячие
    источники. Ближайшие банкомат и кафе — в Сенаки, так что возьмите наличные.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) через Хашури, Рикотский тоннель и Кутаиси до Самтредиа,
    затем по S1 до Сенаки. Там сверните на север, на дорогу в Мартвили; Нокалакеви — примерно через 15
    км, на берегу Техури. Всего около 300 км и четыре с половиной часа, асфальт на всём пути. Последний
    отрезок — узкая сельская дорога в приличном состоянии, так что хватит машины эконом-класса. Заправка
    — в Самтредиа или Сенаки. До Мартвильского каньона около сорока минут, так что их легко объединить
    в один день.
fa:
  name: نوکالاکوی (آرکئوپولیس)
  short: >-
    پایتخت حصاردار اگریسی باستان بر فراز تنگهٔ تخوری؛ بیزانس و ایران در سدهٔ ششم بر سرش جنگیدند و کاوش
    در آن هنوز ادامه دارد.
  body: >-
    **نوکالاکوی در زبان مگرلی یعنی «جایی که شهر بود»؛ و برای شهری که از سدهٔ هشتم دیگر وجود ندارد، دیوارهایش
    به‌گونه‌ای شگفت‌انگیز سالم مانده‌اند.**


    وقایع‌نامه‌های گرجی آن را تسیخه‌گوجی، «دژ کوجی»، می‌نامند، به نام اریستاو (فرمانروای) اگریسی که به
    روایت سنت در اوایل سدهٔ سوم پیش از میلاد آن را ساخت. نزد نویسندگان بیزانسی این شهر آرکئوپولیس، «شهر
    کهن»، و مهم‌ترین دژ لازیکا بود. رود تخوری اینجا حلقه می‌زند و تنگه‌ای در سنگ آهک می‌بُرد: در سوی رود،
    صخره‌ها تنها به یک دیوار نیاز داشتند، اما در شرقِ بی‌پناه سه دیوار موازی برآوردند. در شمال، بر تپه‌ای
    پرشیب، ارگی به وسعت بیش از سه هکتار نشسته که با دیواری به شهر پایینی پیوسته است.


    در جنگ لازیکا در سال‌های ۵۴۰ تا ۵۶۲، بیزانس و ایران ساسانی بر سر این سرزمین جنگیدند. سردار ایرانی،
    مهرمهروی، دو بار کوشید آرکئوپولیس را بگیرد و هر دو بار شکست خورد؛ در ۵۵۱ سپاهش گرفتار گرسنگی شد. جانشین
    او، نخوارگان، مدتی کوتاه شهر را گرفت و ویران کرد، اما تا ۵۵۶ بیزانسی‌ها و لازها آن را پس گرفتند. در
    ۷۳۷–۷۳۸ سردار عرب، مروان کر، شهر را ویران کرد.


    در شهر پایینی ویرانه‌های کاخ پادشاهان اگریسی از سدهٔ چهارم، باسیلیکایی سه‌راهرو از سدهٔ پنجم، باسیلیکایی
    از آغاز سدهٔ ششم که بعدها با گنبد بازسازی شد، دروازه‌ای برج‌دار و دو گرمابه، یکی با گرمایش زیر کف،
    بر جا مانده است. تونلی پله‌دار که در دل صخره کنده شده به سوی رود پایین می‌رود؛ به روایت سنت، شهر در
    محاصره آبش را از اینجا برمی‌داشت.


    دانشمند سوئیسی، فردریک دوبوا دو مونپرو، در ۱۸۳۳–۱۸۳۴ این ویرانه‌ها را همان آرکئوپولیس دانست. گروهی
    آلمانی‌گرجی در ۱۹۳۰–۱۹۳۱ گنجینه‌ای از سکه‌های زرین سولیدوس امپراتور موریس را اینجا یافت، و از ۲۰۰۱
    هیئتی بریتانیایی‌گرجی مشغول کاوش است.


    عصرگاه به ارگ بالا بروید. دشت کلخیس در جنوب گشوده می‌شود، و یک نگاه کافی است تا بفهمید چرا امپراتوری‌ها
    این تپه را می‌خواستند.
  tip: >-
    یک ساعت و نیم تا دو ساعت وقت بگذارید. کفشی با کف پرچسب بپوشید: زمین پوشیده از علف و شیب‌دار است و
    تونل رو به رود باریک و نمناک، پس چراغ‌قوه همراه داشته باشید. راه ارگ پرشیب و بی‌سایه است؛ در تابستان
    شرجی سامگرلو صبح یا اواخر بعدازظهر بروید و آب بردارید. موزهٔ محوطه یافته‌های کاوش را نشان می‌دهد؛
    ورودی حدود ۱۰ لاری است. کنار محوطه، بر کرانهٔ راست رود تخوری، چشمه‌های آب گرم طبیعی می‌جوشد. نزدیک‌ترین
    خودپرداز و کافه در سناکی است، پس پول نقد همراه داشته باشید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید و از خاشوری، تونل ریکوتی و کوتائیسی بگذرید تا سامتردیا،
    سپس روی S1 تا سناکی بروید. آنجا به شمال، به جادهٔ مارتویلی، بپیچید؛ نوکالاکوی حدود ۱۵ کیلومتر جلوتر
    و کنار رود تخوری است. روی‌هم نزدیک ۳۰۰ کیلومتر و چهار ساعت و نیم راه است، سراسر آسفالت. پارهٔ پایانی
    جاده‌ای روستایی و باریک اما سالم است، پس خودروی اقتصادی کافی است. سوخت در سامتردیا یا سناکی. درهٔ
    مارتویلی حدود چهل دقیقه فاصله دارد، پس این دو به‌راحتی یک روز خوب را پر می‌کنند.
he:
  name: נוקאלקווי (ארכיאופוליס)
  short: >-
    בירתה המוקפת חומה של אגריסי העתיקה, מעל ערוץ הטחורי: במאה ה-6 נלחמו עליה ביזנטיון ופרס, והחפירות בה
    נמשכות עד היום.
  body: >-
    **בשפה המגרלית פירוש השם נוקאלקווי הוא "המקום שבו הייתה עיר"; לעיר שנעלמה עוד במאה השמינית, החומות
    שלה שמורות היטב להפליא.**


    הכרוניקות הגאורגיות קוראות לה ציחגוג׳י, "מבצר קוג׳י", על שם אריסטאווי (מושל) של אגריסי שלפי המסורת
    בנה אותה בראשית המאה ה-3 לפני הספירה. בעיני הסופרים הביזנטים זו הייתה ארכיאופוליס, "העיר העתיקה",
    המעוז הראשי של לאזיקה. הטחורי מתפתל כאן בלולאה וחוצב ערוץ בסלע הגיר: בצד הנהר הספיקה לצוקים חומה אחת,
    ואילו המזרח הפתוח קיבל שלוש חומות מקבילות. בצפון, על גבעה תלולה, יושבת מצודה ששטחה יותר משלושה הקטרים,
    המחוברת לעיר התחתית בחומה.


    במלחמת לאזיקה, בשנים 540–562, נלחמו על האדמה הזאת ביזנטיון ופרס הסאסאנית. המצביא הפרסי מיהר-מיהרואה
    ניסה פעמיים לכבוש את ארכיאופוליס ונכשל בשתיהן; ב-551 סבל צבאו מרעב. יורשו, נחורגן, כבש את העיר לזמן
    קצר והחריב אותה, אבל עד 556 השיבו אותה הביזנטים והלאזים לידיהם. ב-737–738 החריב את העיר המצביא הערבי
    מרואן החירש.


    בעיר התחתית שוכנות חורבות ארמון מלכי אגריסי מן המאה ה-4, בזיליקה תלת-ספינתית מן המאה ה-5, בזיליקה
    מראשית המאה ה-6 שנבנתה מחדש מאוחר יותר עם כיפה, שער מבוצר במגדל ושני בתי מרחץ, באחד מהם חימום תת-רצפתי.
    מנהרה מדורגת החצובה בסלע יורדת לעבר הנהר; לפי המסורת, העיר הנצורה שאבה ממנה את מימיה.


    החוקר השווייצרי פרדריק דובואה דה מונפרה זיהה את ההריסות כארכיאופוליס ב-1833–1834. משלחת גרמנית-גאורגית
    מצאה כאן ב-1930–1931 מטמון של סולידי זהב מימי הקיסר מאוריקיוס, ומאז 2001 חופרת במקום משלחת בריטית-גאורגית.


    עלו אל המצודה בשעות אחר הצהריים המאוחרות. מישור קולכיס נפרש דרומה, ומבט אחד מסביר מדוע אימפריות חשקו
    בגבעה הזאת.
  tip: >-
    הקדישו לביקור שעה וחצי עד שעתיים. נעלו נעליים עם אחיזה טובה: הקרקע מכוסה עשב ומשופעת, והמנהרה היורדת
    לנהר צרה ולחה, אז הביאו פנס. העלייה אל המצודה תלולה וחשופה לשמש; בקיץ הלח של סמגרלו לכו בבוקר או לקראת
    ערב, וקחו מים. מוזיאון האתר מציג ממצאים מן החפירות; הכניסה כ-10 ₾. לצד האתר, על הגדה הימנית של הטחורי,
    נובעים מעיינות חמים טבעיים. הכספומט ובתי הקפה הקרובים ביותר בסנאקי, לכן הצטיידו במזומן.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) דרך חשורי, מנהרת ריקוטי וקוטאיסי עד סמטרדיה, והמשיכו ב-S1 עד סנאקי.
    שם פנו צפונה לכביש מרטווילי; נוקאלקווי נמצאת כ-15 ק״מ משם, על גדת הטחורי. בסך הכול כ-300 ק״מ וארבע
    וחצי שעות, בדרך סלולה לכל אורכה. הקטע האחרון הוא כביש כפרי צר במצב תקין, כך שרכב חסכוני מספיק. תדלוק
    בסמטרדיה או בסנאקי. קניון מרטווילי נמצא במרחק כארבעים דקות, והשניים משתלבים בקלות ליום אחד.
ar:
  name: نوكالاكيفي (أركيوبوليس)
  short: >-
    عاصمة إغريسي القديمة المسوّرة فوق خانق تيخوري: تنازعتها بيزنطة وفارس في القرن السادس، وما زالت أعمال
    التنقيب فيها جارية.
  body: >-
    **معنى نوكالاكيفي بالميغريلية «حيث كانت المدينة»؛ وبالنسبة إلى مدينة زالت منذ القرن الثامن، فإن أسوارها
    محفوظة على نحو لافت.**


    تسمّيها الحوليات الجورجية تسيخيغوجي، أي «قلعة كوجي»، نسبة إلى إريستافي (حاكم) إغريسي الذي بناها، بحسب
    الرواية المتوارثة، في مطلع القرن الثالث قبل الميلاد. أما عند الكتّاب البيزنطيين فكانت أركيوبوليس،
    «المدينة القديمة»، وأهم معاقل لازيكا. يلتفّ نهر تيخوري هنا في منعطف حادّ شاقّاً خانقاً في الحجر الجيري:
    فمن جهة النهر لم تحتج المنحدرات الصخرية إلا إلى سور واحد، في حين نال الشرق المكشوف ثلاثة أسوار متوازية.
    وفي الشمال، على تلّ شديد الانحدار، تقوم قلعة داخلية تزيد مساحتها على ثلاثة هكتارات، يصلها بالمدينة
    السفلى سور.


    في الحرب اللازيكية بين 540 و562 تقاتلت بيزنطة وفارس الساسانية على هذه الأرض. حاول القائد الفارسي مهر
    مهروي مرتين أن يستولي على أركيوبوليس وأخفق في المرتين، وفي 551 أنهك الجوع جيشه. واستولى خليفته نخوراغان
    على المدينة لفترة قصيرة وخرّبها، لكن البيزنطيين واللاز استعادوها بحلول 556. وفي 737–738 دمّر القائد
    العربي مروان الأصمّ المدينة.


    في المدينة السفلى أطلال قصر لملوك إغريسي من القرن الرابع، وبازيليكا ثلاثية الأجنحة من القرن الخامس،
    وبازيليكا من مطلع القرن السادس أعيد بناؤها لاحقاً بقبة، وبوابة ذات برج، وحمّامان أحدهما مزوّد بتدفئة
    تحت الأرضية. ونفق مدرّج منحوت في الصخر ينحدر نحو النهر؛ وتقول الرواية إن المدينة المحاصرة كانت تستقي
    منه الماء.


    وقد حدّد الباحث السويسري فريدريك دوبوا دي مونبيرو هذه الأطلال بأنها أركيوبوليس في 1833–1834. وفي 1930–1931
    عثر فريق ألماني جورجي هنا على كنز من قطع السوليدوس الذهبية للإمبراطور موريس، ومنذ 2001 تتولّى بعثة
    بريطانية جورجية التنقيب.


    اصعد إلى القلعة الداخلية في آخر النهار. ينفتح سهل كولخيس نحو الجنوب، وتكفي نظرة واحدة لتفهم لماذا
    أرادت الإمبراطوريات هذا التل.
  tip: >-
    خصّص ساعة ونصفاً إلى ساعتين. البس حذاءً ذا نعل متماسك: فالأرض معشوشبة ومنحدرة، والنفق النازل إلى النهر
    ضيق ورطب، فاحمل مصباحاً يدوياً. الصعود إلى القلعة الداخلية شديد الانحدار وبلا ظل؛ وفي صيف سامغريلو
    الرطب اذهب صباحاً أو في آخر النهار واحمل ماءً. يعرض متحف الموقع لقى التنقيب، ورسم الدخول نحو 10 ₾.
    وبجوار الموقع، على الضفة اليمنى لنهر تيخوري، تنبع ينابيع حارة طبيعية. أقرب صرّاف آلي ومقاهٍ في سيناكي،
    فاحمل نقوداً.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً عبر خاشوري ونفق ريكوتي وكوتايسي حتى سامتريديا، ثم تابع على S1
    إلى سيناكي. وهناك انعطف شمالاً إلى طريق مارتفيلي؛ وتقع نوكالاكيفي بعد نحو 15 كم على ضفة تيخوري. المسافة
    الإجمالية نحو 300 كم وأربع ساعات ونصف، والطريق معبّد كله. المقطع الأخير طريق قروي ضيق في حالة جيدة،
    فتكفي سيارة اقتصادية. الوقود في سامتريديا أو سيناكي. يبعد أخدود مارتفيلي نحو أربعين دقيقة، فيسهل الجمع
    بينهما في يوم واحد.
