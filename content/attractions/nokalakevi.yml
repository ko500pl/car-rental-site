ka:
  name: ნოქალაქევი (არქეოპოლისი)
  short: ლაზიკის ომების ეპოქის ციხე-ქალაქი მდინარე ტეხურაზე — კედლები, საიდუმლო გვირაბი და მოქმედი გათხრები.
  body: >-
    ნოქალაქევი დასავლეთ საქართველოს ერთ-ერთი ყველაზე მნიშვნელოვანი არქეოლოგიური ძეგლია. ბიზანტიური წყაროები
    მას არქეოპოლისის სახელით იცნობდნენ, ქართული ტრადიცია კი ციხეგოჯს უწოდებდა. ადგილი მდინარე ტეხურის
    ხეობაში, ბუნებრივად დაცულ პოზიციაზე დგას და IV–VI საუკუნეებში ეგრისის სამეფოს ერთ-ერთი მთავარი ცენტრი
    იყო.


    ძეგლის ისტორიული წონა ლაზიკის ომებზე მოდის — VI საუკუნეში ბიზანტიისა და სასანური ირანის დაპირისპირებაზე
    დასავლეთ საქართველოს კონტროლისთვის. ნოქალაქევი ამ ომების ერთ-ერთი მთავარი საფორტიფიკაციო კვანძი იყო
    და მისი კედლები სწორედ ამ პერიოდის ინჟინერიას ასახავს.


    რას ნახავთ ადგილზე:


    - **ქვედა ციხის კედლები და კოშკები**, ნაწილობრივ აღდგენილი

    - **საიდუმლო გვირაბი**, რომელიც კლდეში ჩამოდის მდინარე ტეხურამდე — ალყის დროს წყლის მისაწოდებლად

    - **ბაზილიკის ნაშთები** და აბანოს ნაგებობა

    - **მცირე მუზეუმი** გათხრებიდან მოპოვებული მასალით


    ტერიტორიაზე წლების განმავლობაში მიმდინარეობს ქართულ-ბრიტანული ერთობლივი არქეოლოგიური ექსპედიცია, ამიტომ
    ზაფხულში შესაძლოა მოქმედი გათხრებიც ნახოთ და მკვლევრებსაც შეხვდეთ. ზემო ციხემდე ასვლა ციცაბოა და უჩრდილო,
    მაგრამ ხედი ხეობაზე მას სრულად ამართლებს და მაშინვე ხსნის, რატომ აირჩიეს ქალაქისთვის ზუსტად ეს ადგილი.
    ნოქალაქევი შედარებით ცოტა ვიზიტორს იღებს, ამიტომ აქ ხმაურისა და რიგების გარეშე დადიხართ — რაც ასეთი
    მასშტაბის ძეგლისთვის იშვიათობაა.
  tip: >-
    ვიზიტს საათნახევრიდან ორ საათამდე სჭირდება. ჩაიცვით მოხერხებული ფეხსაცმელი — ტერიტორია ბალახიანი და
    დაქანებულია, გვირაბში ჩასასვლელი კიბე კი ვიწრო და სველია; ტელეფონის ფანარი გამოგადგებათ. ზაფხულში
    აქ ცხელი და ნოტიოა, ამიტომ დილა სჯობს შუადღეს, წყალი კი თან იქონიეთ. მანქანა შესასვლელთან პატარა მოედანზე
    ტოვებთ. კაფე და ბანკომატი ახლომდებარე სენაკშია — ნაღდი ფული წინასწარ აიღეთ.
  route: >-
    თბილისიდან დაახლოებით 300 კმ და ოთხნახევარი საათია. E60-ით მიდიხართ დასავლეთისკენ ხაშურის, რიკოთის
    მაგისტრალის, ქუთაისისა და სამტრედიის გავლით, შემდეგ სენაკის მიმართულებით უხვევთ და იქიდან რამდენიმე
    კილომეტრი ჩრდილოეთით ნოქალაქევამდე. მთელი მარშრუტი ასფალტია, ბოლო მონაკვეთი ვიწრო სოფლის გზაა, მაგრამ
    სრულიად გამართული — ეკონომ კლასის ავტომობილი საკმარისია. საწვავი სამტრედიაში ან სენაკში აავსეთ. ობიექტი
    კარგად ერწყმის მარტვილის კანიონს ერთ დღეში.
en:
  name: Nokalakevi (Archaeopolis)
  short: >-
    A fortified city from the Lazic Wars above the Tekhuri river — walls, a secret tunnel and an active
    excavation.
  body: >-
    Nokalakevi is one of the most important archaeological sites in western Georgia. Byzantine authors
    knew it as Archaeopolis, while Georgian tradition called it Tsikhegoji. It occupies a naturally defended
    position in the valley of the Tekhuri river and was a principal centre of the kingdom of Egrisi between
    the fourth and sixth centuries.


    Its historical weight comes from the Lazic Wars, the sixth-century contest between Byzantium and Sasanian
    Persia for control of western Georgia. Nokalakevi was one of the key fortified nodes in that conflict,
    and the surviving walls reflect the military engineering of exactly that period.


    What you will find on site:


    - **The lower fortress walls and towers**, partly consolidated and restored

    - **A secret tunnel** cut down through the rock to the Tekhuri, built to supply water during a siege

    - **The remains of a basilica** and a bath house

    - **A small museum** displaying finds from the excavations


    A joint Georgian-British archaeological expedition has worked here for many years, so in summer you
    may well see active trenches and researchers at work. The climb to the upper fortress is steep and
    unshaded, but the view along the valley makes it worth the effort, and it clarifies exactly why the
    site was chosen.
  tip: >-
    Allow an hour and a half to two hours. Wear comfortable shoes: the ground is grassy and sloping, and
    the stairway down the water tunnel is narrow and damp, so a phone torch helps. Summers here are hot
    and humid, which makes a morning visit far more pleasant than midday, and you should carry water.
    Park on the small area by the entrance. The nearest cafes and ATM are in Senaki, so take cash with
    you before you arrive.
  route: >-
    Nokalakevi is about 300 km and four and a half hours from Tbilisi. Follow the E60 west through Khashuri,
    the Rikoti section, Kutaisi and Samtredia, then turn toward Senaki and continue a few kilometres north
    to the site. The whole route is paved; the final stretch is a narrow village road but in sound condition,
    so an economy car is sufficient. Fill up in Samtredia or Senaki. The site combines well with Martvili
    Canyon in a single day, since both lie within about forty minutes of each other.
ru:
  name: Нокалакеви (Археополис)
  short: Город-крепость эпохи Лазских войн над рекой Техури — стены, потайной тоннель и действующие раскопки.
  body: >-
    Нокалакеви — один из важнейших археологических памятников Западной Грузии. Византийские авторы знали
    его как Археополис, грузинская традиция называла Цихегоджи. Городище занимает естественно защищённую
    позицию в долине реки Техури и в IV–VI веках было одним из главных центров царства Эгриси.


    Историческое значение памятника связано с Лазскими войнами — противостоянием Византии и сасанидского
    Ирана за контроль над Западной Грузией в VI веке. Нокалакеви был одним из ключевых узлов обороны в
    этом конфликте, и сохранившиеся стены отражают военную инженерию именно того времени.


    Что вы увидите на месте:


    - **Стены и башни нижней крепости**, частично законсервированные и восстановленные

    - **Потайной тоннель**, прорубленный в скале к реке Техури для подачи воды при осаде

    - **Остатки базилики** и банного здания

    - **Небольшой музей** с находками из раскопок


    Здесь много лет работает совместная грузино-британская археологическая экспедиция, поэтому летом вполне
    можно застать открытые раскопы и исследователей за работой. Подъём к верхней крепости крутой и без
    тени, но вид вдоль долины его оправдывает и сразу объясняет, почему для города выбрали именно это
    место.
  tip: >-
    Закладывайте полтора-два часа. Обувь нужна удобная: территория травянистая и наклонная, а лестница
    в водяном тоннеле узкая и сырая, фонарик в телефоне пригодится. Лето здесь жаркое и влажное, поэтому
    утренний визит куда приятнее полуденного, воду берите с собой. Машину оставляйте на небольшой площадке
    у входа. Ближайшие кафе и банкомат — в Сенаки, наличные снимите заранее.
  route: >-
    От Тбилиси около 300 км и четыре с половиной часа. По трассе E60 на запад через Хашури, Рикотский
    участок, Кутаиси и Самтредиа, затем поворот в сторону Сенаки и ещё несколько километров на север до
    городища. Весь маршрут асфальтированный, последний отрезок — узкая сельская дорога в исправном состоянии,
    машины эконом-класса достаточно. Заправляйтесь в Самтредиа или Сенаки. Объект хорошо сочетается с
    Мартвильским каньоном в один день: между ними около сорока минут.
fa:
  name: نوکالاکوی (آرکئوپولیس)
  short: شهری دژنشین از جنگ‌های لازیک بالای رود تخوری — دیوارها، تونلی پنهان و کاوشی فعال.
  body: >-
    نوکالاکوی یکی از مهم‌ترین محوطه‌های باستان‌شناختی غرب گرجستان است. نویسندگان بیزانسی آن را آرکئوپولیس
    می‌شناختند، حال آنکه سنت گرجی آن را تسیخه‌گوجی می‌نامید. جایگاهی به‌طور طبیعی قابل‌دفاع در درهٔ رود
    تخوری دارد و میان سده‌های چهارم و ششم یکی از مراکز اصلی پادشاهی اگریسی بود.


    وزن تاریخی آن از جنگ‌های لازیک می‌آید، کشمکش سدهٔ ششم میان بیزانس و ایران ساسانی بر سر تسلط بر غرب
    گرجستان. نوکالاکوی یکی از گره‌های کلیدی دژنشین در آن نبرد بود و دیوارهای برجای‌مانده دقیقاً مهندسی
    نظامی همان دوره را بازتاب می‌دهند.


    در محوطه این‌ها را می‌یابید: **دیوارها و برج‌های دژ پایینی** که تا حدی تحکیم و مرمت شده‌اند؛ **تونلی
    پنهان** که در سنگ تا رود تخوری کنده شده و برای تأمین آب در محاصره ساخته شده بود؛ **بازمانده‌های یک
    بازیلیکا** و یک گرمابه؛ و **موزه‌ای کوچک** با یافته‌های کاوش‌ها. هیئتی مشترک باستان‌شناسی گرجی-بریتانیایی
    سال‌هاست اینجا کار می‌کند، پس در تابستان به‌احتمال زیاد ترانشه‌های فعال و پژوهشگران مشغول کار را می‌بینید.
    صعود به دژ بالایی تند و بی‌سایه است، اما منظرهٔ امتداد دره ارزشش را دارد و دقیقاً روشن می‌کند که چرا
    این محل انتخاب شده بود.
  tip: >-
    یک ساعت و نیم تا دو ساعت وقت بگذارید. کفش راحت بپوشید: زمین چمنی و شیب‌دار است و پلکان پایین‌رونده
    در تونل آب باریک و نمناک است، پس چراغ‌قوهٔ تلفن کمک می‌کند. تابستان اینجا گرم و مرطوب است و همین بازدید
    صبحگاهی را بسیار خوشایندتر از ظهر می‌کند؛ آب همراه داشته باشید. در محوطهٔ کوچک کنار ورودی پارک کنید.
    نزدیک‌ترین کافه‌ها و خودپرداز در سناکی‌اند، پس پیش از رسیدن پول نقد بردارید.
  route: >-
    نوکالاکوی حدود 300 کیلومتر و چهار ساعت و نیم از تفلیس فاصله دارد. با E60 رو به غرب از خاشوری، مقطع
    ریکوتی، کوتایسی و سامتردیا بروید، سپس به سوی سناکی بپیچید و چند کیلومتر رو به شمال تا خود محوطه ادامه
    دهید. تمام مسیر آسفالت است؛ بخش پایانی جادهٔ روستایی باریکی است اما در وضعیت سالم، پس خودروی اقتصادی
    کافی است. در سامتردیا یا سناکی باک را پر کنید. این محوطه به‌خوبی با کانیون مارتویلی در یک روز جمع
    می‌شود، چون هر دو در حدود چهل دقیقه از یکدیگرند.
he:
  name: נוקאלקווי (ארכיאופוליס)
  short: עיר מבוצרת מתקופת מלחמות לאזיקה מעל נהר טחורי — חומות, מנהרה סודית וחפירה פעילה.
  body: >-
    נוקאלקווי היא אחד האתרים הארכיאולוגיים החשובים ביותר במערב גאורגיה. סופרים ביזנטיים הכירו אותה בשם
    ארכיאופוליס, ואילו המסורת הגאורגית קראה לה ציחגוג'י. היא תופסת עמדה מוגנת מטבעה בעמק נהר טחורי, מוקפת
    מדרונות תלולים משלושה עברים, והייתה מרכז ראשי של ממלכת אגריסי בין המאה הרביעית לשישית.


    משקלה ההיסטורי נובע ממלחמות לאזיקה, המאבק של המאה השישית בין ביזנטיון לפרס הסאסאנית על השליטה במערב
    גאורגיה. נוקאלקווי הייתה אחד ממוקדי הביצור המרכזיים בעימות הזה, והחומות ששרדו, על נדבכי האבן והלבנים
    שלהן, משקפות בדיוק את ההנדסה הצבאית של אותה תקופה.


    מה שתמצאו באתר: **חומות ומגדלי המבצר התחתון**, שיוצבו ושוחזרו חלקית; **מנהרה סודית** החצובה בסלע ויורדת
    אל הטחורי, שנבנתה כדי לספק מים בזמן מצור; **שרידי בזיליקה** ובית מרחץ; ו**מוזיאון קטן** המציג ממצאים
    מן החפירות. משלחת ארכיאולוגית גאורגית-בריטית משותפת פועלת כאן שנים רבות, ולכן בקיץ סביר שתראו חתכי
    חפירה פעילים וחוקרים בעבודה. הטיפוס אל המבצר העליון תלול וחשוף לשמש, אבל הנוף לאורך העמק שווה את המאמץ,
    והוא מבהיר בדיוק מדוע נבחר המקום הזה.
  tip: >-
    הקצו שעה וחצי עד שעתיים. נעלו נעליים נוחות: הקרקע מכוסה עשב ומשופעת, וגרם המדרגות היורד במנהרת המים
    צר ולח, ולכן פנס בטלפון עוזר. הקיץ כאן חם ולח, ולכן ביקור בבוקר נעים בהרבה מאשר בצהריים, וכדאי לשאת
    מים. החנו במגרש הקטן ליד הכניסה. בתי הקפה והכספומט הקרובים ביותר נמצאים בסנאקי, אז הצטיידו במזומן
    לפני שאתם מגיעים.
  route: >-
    נוקאלקווי נמצאת כ-300 ק"מ וארבע שעות וחצי מטביליסי. סעו בכביש E60 מערבה דרך חשורי, קטע ריקוטי, קוטאיסי
    וסמטרדיה, ואז פנו לכיוון סנאקי והמשיכו כמה קילומטרים צפונה עד האתר. כל המסלול סלול; הקטע האחרון הוא
    כביש כפרי צר אך במצב תקין, ולכן רכב חסכוני מספיק. תדלקו בסמטרדיה או בסנאקי. האתר משתלב היטב עם קניון
    מרטווילי ליום אחד, מפני ששניהם נמצאים במרחק של כארבעים דקות זה מזה.
ar:
  name: نوكالاكيفي (أركيوبوليس)
  short: مدينة محصنة من حروب اللاز فوق نهر تيخوري — أسوار ونفق سري وحفريات قائمة.
  body: >-
    نوكالاكيفي من أهم المواقع الأثرية في غرب جورجيا. عرفها الكتّاب البيزنطيون باسم أركيوبوليس، بينما سمّاها
    التقليد الجورجي تسيخيغوجي. وتحتل موقعاً محصناً بطبيعته في وادي نهر تيخوري، تحيط به منحدرات حادة من
    ثلاث جهات، وكانت مركزاً رئيسياً لمملكة إغريسي بين القرنين الرابع والسادس.


    ويأتي ثقلها التاريخي من حروب اللاز، ذلك الصراع الذي دار في القرن السادس بين بيزنطة وفارس الساسانية
    على السيطرة على غرب جورجيا. وكانت نوكالاكيفي إحدى العقد المحصنة الأساسية في ذلك النزاع، والأسوار الباقية،
    بمداميكها من الحجر والآجر، تعكس الهندسة العسكرية لتلك الحقبة بالذات.


    وما ستجده في الموقع: **أسوار القلعة السفلى وأبراجها**، وقد ثُبتت ورُممت جزئياً؛ و**نفق سري** محفور
    في الصخر ينزل إلى نهر تيخوري، بُني لتأمين الماء أثناء الحصار؛ و**بقايا بازيليكا** وحمّام؛ و**متحف
    صغير** يعرض مكتشفات الحفريات. وتعمل هنا منذ سنوات طويلة بعثة أثرية جورجية-بريطانية مشتركة، فقد ترى
    في الصيف مقاطع حفر نشطة وباحثين في عملهم. أما الصعود إلى القلعة العليا فحاد وبلا ظل، لكن الإطلالة
    على امتداد الوادي تستحق الجهد وتوضح تماماً لماذا اختير هذا الموقع.
  tip: >-
    خصّص ساعة ونصفاً إلى ساعتين. البس حذاءً مريحاً: فالأرض عشبية ومائلة، والدرج النازل في نفق الماء ضيق
    ورطب، لذا يفيد مصباح الهاتف. والصيف هنا حار ورطب، ما يجعل زيارة الصباح أمتع بكثير من الظهيرة، وينبغي
    أن تحمل ماءً. اركن في الساحة الصغيرة عند المدخل. وأقرب المقاهي والصراف الآلي في سيناكي، فخذ نقداً
    معك قبل الوصول.
  route: >-
    تبعد نوكالاكيفي عن تبليسي نحو 300 كم وأربع ساعات ونصف. اتبع الطريق E60 غرباً عبر خاشوري ومقطع ريكوتي
    وكوتايسي وسامتريديا، ثم انعطف نحو سيناكي وتابع بضعة كيلومترات شمالاً حتى الموقع. الطريق كله معبّد؛
    والمقطع الأخير طريق قروي ضيق لكنه بحالة سليمة، فسيارة اقتصادية تكفي. املأ الخزان في سامتريديا أو سيناكي.
    ويتكامل الموقع جيداً مع وادي مارتفيلي في يوم واحد، إذ يبعد أحدهما عن الآخر نحو أربعين دقيقة.
