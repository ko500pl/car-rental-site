ka:
  name: თრიალეთის პეტროგლიფები (განთიადი)
  short: >-
    დაახლოებით ასი ირემი, ცხენი, თხა, თევზი და პაწია მშვილდოსანი განთიადთან, ბაზალტზე — ამ ტიპის ერთადერთი
    პრეისტორიული კლდის ხელოვნება საქართველოში.
  body: >-
    **თრიალეთის ზეგანის ვიწრო ხეობაში, ბაზალტის ფილაზე, ფურირემი უკვე რამდენიმე ათასი წელია ნუკრს აწოვებს.**


    კლდის გამოსახულებები სოფელ განთიადის (ყოფილი თიკილისას) განაპირას, მდინარე ავდრისწყლის, იგივე პატარა
    ხრამის, ხეობაშია — ეს მდინარე ქციის მარჯვენა შენაკადია. პირველად ისინი XIX საუკუნის 80-იან წლებში
    შენიშნეს, მერე კვალი დაიკარგა და მხოლოდ 1976 წელს, რამდენიმე უშედეგო ძიების შემდეგ, კვლავ მიაგნეს.
    ოსტატები აქ ძალიან დიდი ხნის განმავლობაში კვეთდნენ — მეზოლითიდან შუა ბრინჯაოს ხანამდე.


    დაახლოებით ასი გამოსახულება ექვს ჯგუფად არის განლაგებული ბრტყელ ბაზალტზე, თითქმის 50 მეტრის სიგრძეზე.
    აქ ცხოველები ბატონობენ: ირმები გაზვიადებული რქებით, ცხენები, მთის თხები, ფრინველები და თევზები, ფანტასტიკური
    და ჰიბრიდული არსებები — ყველა პროფილში. ზოგი ნადირი მონადირის ბადეშია გახლართული. ადამიანები მონადირეები
    არიან — წინიდან გამოსახულნი, მშვილდ-ისრით მარცხენა ხელში და თავიანთ ნადირთან შედარებით გასაოცრად პატარები.
    ფიგურები 2,5-დან დაახლოებით 20 სანტიმეტრამდეა და ქვაში სულ ერთი-ორი მილიმეტრით არის ჩაღრმავებული.
    ცარიელ ადგილებს ჯვრები, ჭადრაკული ბადეები და მზის ნიშნები ავსებს. გამოსახულია აქლემებიც, თუმცა ისინი,
    სავარაუდოდ, გაცილებით გვიანდელი დანამატია და მათი თარიღი დადგენილი არ არის.


    საქართველოში მსგავსი სხვა არაფერია ცნობილი: იმერეთში, მღვიმევის მღვიმეში, და აფხაზეთში, აგცაში, მხოლოდ
    მარტივი გეომეტრიული ნიშნებია. ძეგლს კულტურული მემკვიდრეობის ძეგლის სტატუსი აქვს და ევროპის საბჭოს
    კულტურულ მარშრუტს — „პრეისტორიული კლდის ხელოვნების ბილიკებს“ — ეკუთვნის. ამასთან, მას დაზიანების საფრთხე
    ემუქრება.


    ხაზები იმდენად არაღრმაა, რომ შუადღის ბრტყელი შუქი მათ თითქმის შლის; დახრილი მზე კი ირმებს კვლავ აცოცხლებს.
    შეხედეთ თევზებსა და რქოსან ირმებს, მერე ირგვლივ გადაშლილ უხეო ველს — და უნებლიეთ დაფიქრდებით, როგორი
    იყო ეს ზეგანი მაშინ.


    ოსტატებმა ცხოველები დიდად გამოსახეს, საკუთარი თავი კი — პატარად. ამდენი ათასწლეულის შემდეგაც ეს პროპორცია
    პატიოსნად გამოიყურება.
  tip: >-
    ძეგლი უფასოა და ღია, მაგრამ არც ნიშანი აქვს, არც რაიმე ინფრასტრუქტურა. გამოსახულებები განთიადის ქვემოთ,
    ხეობაშია: კოორდინატებით იხელმძღვანელეთ (41.5862, 43.9772), სოფელში ჰკითხეთ, უკეთესი კი იქნება, თუ
    ადგილობრივ მეგზურს წალკაში მოძებნით. კლდეზე მოუცურებელი ფეხსაცმელი ჩაიცვით. ადრე დილით ან საღამოსკენ
    მოდით, როცა დახრილი შუქი ხაზებს აჩენს, ან ფანარი წაიღეთ და გვერდიდან მიანათეთ. გამოსახულებებს ნუ შეეხებით,
    ცარცით ნუ შემოხაზავთ, ნუ დაასველებთ და ნუ გახეხავთ — ისედაც მყიფეა. საჭმელი და საწვავი წალკაშია; დაშბაშის
    კანიონი და წალკის წყალსაცავი 10 კილომეტრის რადიუსშია.
  route: >-
    თბილისიდან შ36-ით წყნეთისა და კოჯრის გავლით მანგლისამდე იარეთ, იქიდან კი შ31-ით დასავლეთით, ზეგანზე,
    წალკამდე. ქალაქი იმავე გზით გაიარეთ და ნინოწმინდის მიმართულებით, დაახლოებით ათ კილომეტრში, განთიადს
    მიადგებით. სულ დაახლოებით 102 კმ და ორი საათი. კოჯრის შემდეგ ასფალტი აღმართსა და მკვეთრ მოსახვევებს
    მიუყვება, ზეგანზე კი ძლიერი გვერდითი ქარია; სოფლიდან ხეობამდე მოუნიშნავი ხრეშიანი გზა და მოკლე ფეხით
    სავალი გრძელდება. მაისიდან ოქტომბრამდე ეკონომ-კლასის მანქანაც საკმარისია; ზამთარში ზეგანს თოვლი ფარავს.
    საწვავი თბილისში ან წალკაში ჩაასხით.
en:
  name: Trialeti Petroglyphs (Gantiadi)
  short: >-
    About a hundred deer, horses, goats, fish and tiny archers cut into basalt near Gantiadi: Georgia's
    only prehistoric rock art of its kind.
  body: >-
    **In a narrow gorge on the Trialeti plateau, a doe has been suckling her fawn on a slab of basalt
    for several thousand years.**


    The carvings lie on the edge of Gantiadi, a village once called Tikilisa, in the gorge of the Avdris-Tsqali,
    also known as the Patara Khrami, a right-bank tributary of the Ktsia. They were first noticed in the
    1880s, then lost, and found again only in 1976 after a string of failed searches. Their makers worked
    over a very long span, from the Mesolithic to the Middle Bronze Age.


    About a hundred images are spread over six panels along some 50 metres of flat basalt. Animals rule
    them: deer with exaggerated antlers, horses, mountain goats, birds and fish, and fantastic hybrid
    creatures, all drawn side-on. Some beasts are tangled in a hunter's net. The people are hunters, shown
    front-on with bow and arrow in the left hand, and strikingly small beside their prey. The figures
    measure from 2.5 to about 20 centimetres and are cut only a millimetre or two into the stone. Crosses,
    chequerboards and sunbursts fill the gaps. Camels appear too, but they are probably a much later addition,
    and their date has not been established.


    Nothing else like it is known in Georgia: at Mghvimevi cave in Imereti and at Agtsa in Abkhazia the
    carvings are simple geometric marks. The site is a registered Cultural Heritage monument and part
    of the Council of Europe's Prehistoric Rock Art Trails — and it is at risk of deterioration.


    The lines are so shallow that flat midday light almost erases them; a low sun brings the deer back.
    Look at the fish and the antlered stags, then at the treeless grassland around you, and you begin
    to wonder what this plateau once looked like.


    The artists made the animals large and themselves small. After all these millennia, the proportion
    still looks honest.
  tip: >-
    The site is free and unfenced, with no signs and no facilities. The carvings lie in the gorge below
    Gantiadi: use the coordinates (41.5862, 43.9772), ask in the village or, better, arrange a local guide
    in Tsalka. Wear shoes that grip on rock. Come in the early morning or late afternoon, when raking
    light shows the lines, or bring a torch to shine from the side. Never touch, chalk, wet or scrub the
    carvings to make them stand out: they are fragile enough already. Food and fuel are in Tsalka; the
    Dashbashi Canyon and the Tsalka Reservoir are both within 10 km.
  route: >-
    Take the Sh36 out of Tbilisi through Tskneti and Kojori to Manglisi, then the Sh31 west across the
    plateau to Tsalka. Carry on through the town on the same road for about ten kilometres, towards Ninotsminda,
    to Gantiadi. In all it is about 102 km and two hours. The asphalt climbs with tight bends after Kojori,
    and crosswinds are strong up top; from the village an unmarked gravel track and a short walk lead
    down into the gorge. An economy car copes from May to October; in winter the plateau lies under snow.
    Refuel in Tbilisi or Tsalka.
ru:
  name: Триалетские петроглифы (Гантиади)
  short: >-
    Около сотни оленей, лошадей, козлов, рыб и крошечных лучников на базальте у Гантиади — единственное
    в Грузии доисторическое наскальное искусство такого рода.
  body: >-
    **В узком ущелье на Триалетском плато олениха вот уже несколько тысяч лет кормит оленёнка на базальтовой
    плите.**


    Изображения находятся на краю села Гантиади, прежде называвшегося Тикилиса, в ущелье реки Авдрис-Цкали,
    известной также как Патара-Храми, — правого притока Кции. Впервые их заметили в 1880-х годах, затем
    потеряли и вновь нашли лишь в 1976 году, после череды безуспешных поисков. Создавались они очень долго
    — от мезолита до средней бронзы.


    Около сотни изображений распределены по шести панно вдоль примерно 50 метров плоского базальта. Царят
    на них животные: олени с непомерно большими рогами, лошади, горные козлы, птицы и рыбы, а ещё фантастические
    существа-гибриды — все показаны в профиль. Некоторые звери запутались в охотничьей сети. Люди здесь
    — охотники, изображённые анфас, с луком и стрелой в левой руке, и поразительно маленькие рядом со
    своей добычей. Размеры фигур — от 2,5 до примерно 20 сантиметров, и врезаны они в камень всего на
    миллиметр-два. Промежутки заполняют кресты, шахматные узоры и лучистые солнца. Встречаются и верблюды,
    но это, вероятно, куда более позднее добавление, и их датировка не установлена.


    Ничего подобного в Грузии больше не известно: в пещере Мгвимеви в Имерети и в Агце в Абхазии резьба
    сводится к простым геометрическим знакам. Памятник внесён в реестр объектов культурного наследия и
    входит в маршрут Совета Европы «Пути доисторического наскального искусства» — и ему грозит разрушение.


    Линии так неглубоки, что плоский полуденный свет почти стирает их; низкое солнце возвращает оленей.
    Посмотрите на рыб и ветвисторогих оленей, потом на безлесные травяные просторы вокруг — и невольно
    задумаетесь, каким это плато было когда-то.


    Художники сделали животных большими, а себя — маленькими. И спустя тысячелетия эта пропорция по-прежнему
    кажется честной.
  tip: >-
    Вход свободный, место не огорожено, указателей и удобств нет. Изображения находятся в ущелье ниже
    Гантиади: воспользуйтесь координатами (41.5862, 43.9772), спросите дорогу в селе или, что ещё лучше,
    договоритесь о местном гиде в Цалке. Наденьте обувь, которая не скользит по камню. Приезжайте рано
    утром или ближе к вечеру, когда косой свет проявляет линии, или возьмите фонарик и светите сбоку.
    Никогда не трогайте, не обводите мелом, не смачивайте и не трите изображения, чтобы сделать их заметнее:
    они и так достаточно хрупки. Еда и топливо — в Цалке; каньон Дашбаши и Цалкское водохранилище — оба
    в пределах 10 км.
  route: >-
    Выезжайте из Тбилиси по Sh36 через Цхнети и Коджори на Манглиси, затем по Sh31 на запад через плато
    до Цалки. Проезжайте через город по той же дороге ещё около десяти километров, в сторону Ниноцминды,
    до Гантиади. Всего около 102 км и два часа. После Коджори асфальт идёт в гору крутыми поворотами,
    а наверху дует сильный боковой ветер; от села в ущелье ведут гравийная дорога без указателей и короткая
    пешая тропа. С мая по октябрь справится машина эконом-класса; зимой плато под снегом. Заправьтесь
    в Тбилиси или в Цалке.
fa:
  name: سنگ‌نگاره‌های تریالتی (گانتیادی)
  short: >-
    نزدیک به صد گوزن، اسب، بز، ماهی و کمانداری ریزنقش که بر بازالت در نزدیکی گانتیادی کنده شده‌اند: تنها
    هنر صخره‌ای پیش‌ازتاریخی از این دست در گرجستان.
  body: >-
    **در تنگه‌ای باریک بر فلات تریالتی، ماده‌گوزنی چند هزار سال است که بر تخته‌سنگی بازالتی به بچه‌اش
    شیر می‌دهد.**


    این نقش‌ها در حاشیهٔ گانتیادی قرار دارند، روستایی که پیش‌تر تیکیلیسا نام داشت، در تنگهٔ رود اودریس‌تسقالی
    — که پاتارا خرامی هم خوانده می‌شود — یکی از شاخه‌های کرانهٔ راست رود کتسیا. نخستین بار در دههٔ ۱۸۸۰
    به چشم آمدند، سپس گم شدند و تنها در ۱۹۷۶، پس از رشته‌ای جست‌وجوی ناکام، دوباره پیدا شدند. سازندگانشان
    در بازه‌ای بسیار طولانی، از دوران میان‌سنگی تا عصر مفرغ میانه، کار می‌کردند.


    حدود صد نقش بر شش سطح، در امتداد نزدیک به ۵۰ متر بازالت هموار پراکنده‌اند. فرمانروای آنها جانوران‌اند:
    گوزن‌هایی با شاخ‌های اغراق‌آمیز، اسب‌ها، بزهای کوهی، پرندگان و ماهی‌ها، و موجودات دورگهٔ خیالی، همه
    از نیم‌رخ. برخی جانوران در تور شکارچی گرفتار شده‌اند. انسان‌ها شکارچی‌اند، از روبه‌رو نقش شده، با
    کمان و تیر در دست چپ، و در کنار شکارشان به‌طرزی چشمگیر کوچک. اندازهٔ نقش‌ها از ۲٫۵ تا حدود ۲۰ سانتی‌متر
    است و تنها یکی دو میلی‌متر در سنگ فرو رفته‌اند. صلیب‌ها، نقش‌های شطرنجی و خورشیدهای پرتوافشان فاصله‌ها
    را پر کرده‌اند. شترهایی هم دیده می‌شوند، اما احتمالاً افزوده‌هایی بسیار متأخرترند و تاریخشان روشن
    نشده است.


    نمونهٔ دیگری مانند این در گرجستان شناخته نیست: در غار مغویموی در ایمرتی و در آگتسا در آبخازیا، کنده‌کاری‌ها
    نشانه‌هایی سادهٔ هندسی‌اند. این محوطه اثری ثبت‌شده در فهرست میراث فرهنگی و بخشی از «مسیرهای هنر صخره‌ای
    پیش‌ازتاریخ» شورای اروپاست — و در معرض خطر فرسایش و تخریب قرار دارد.


    خطوط چنان کم‌عمق‌اند که نور تخت نیمروز تقریباً پاکشان می‌کند؛ آفتاب کم‌ارتفاع گوزن‌ها را بازمی‌گرداند.
    به ماهی‌ها و گوزن‌های نرِ شاخ‌دار نگاه کنید، سپس به علفزار بی‌درخت پیرامونتان، و از خود خواهید پرسید
    این فلات روزگاری چه شکلی داشته است.


    هنرمندان جانوران را بزرگ کشیدند و خودشان را کوچک. پس از این همه هزاره، این تناسب هنوز صادقانه می‌نماید.
  tip: >-
    محل رایگان و بی‌حصار است، بی هیچ تابلو و امکاناتی. نقش‌ها در تنگهٔ پایین گانتیادی‌اند: از مختصات (۴۱٫۵۸۶۲,
    ۴۳٫۹۷۷۲) استفاده کنید، در روستا سراغ بگیرید یا، بهتر از آن، در تسالکا راهنمای محلی بگیرید. کفشی بپوشید
    که روی سنگ لیز نخورد. صبح زود یا اواخر بعدازظهر بیایید، وقتی نور مورب خطوط را آشکار می‌کند، یا چراغ‌قوه‌ای
    بیاورید و از پهلو بتابانید. هرگز برای نمایان‌تر کردن نقش‌ها به آنها دست نزنید، با گچ رویشان خط نکشید،
    خیسشان نکنید و نسابیدشان: همین حالا هم به اندازهٔ کافی شکننده‌اند. غذا و سوخت در تسالکاست؛ درهٔ داشباشی
    و آبگیر تسالکا هر دو در شعاع ۱۰ کیلومتری‌اند.
  route: >-
    از تفلیس با Sh36 از راه تسکنتی و کوجوری به مانگلیسی بروید، سپس با Sh31 به سمت غرب از فلات بگذرید تا
    تسالکا. از شهر با همان جاده حدود ده کیلومتر دیگر به سوی نینوتسمیندا ادامه دهید تا به گانتیادی برسید.
    روی‌هم حدود ۱۰۲ کیلومتر و دو ساعت. پس از کوجوری آسفالت با پیچ‌های تند بالا می‌رود و آن بالا باد پهلوی
    شدیدی می‌وزد؛ از روستا یک راه شنی بی‌نشان و پیاده‌رویی کوتاه به درون تنگه می‌رسد. از مه تا اکتبر خودروی
    اقتصادی از پس راه برمی‌آید؛ زمستان فلات زیر برف است. در تفلیس یا تسالکا سوخت بگیرید.
he:
  name: פטרוגליפי טריאלטי (גנטיאדי)
  short: >-
    כמאה איילים, סוסים, עזים, דגים וקשתים זעירים חרוטים בבזלת ליד גנטיאדי: אמנות הסלע הפרהיסטורית היחידה
    מסוגה בגאורגיה.
  body: >-
    **בערוץ צר על רמת טריאלטי, איילה מיניקה את העופר שלה על לוח בזלת כבר כמה אלפי שנים.**


    החריטות נמצאות בשולי גנטיאדי, כפר שנקרא בעבר טיקיליסה, בערוץ נחל אבדריס-צקאלי, הידוע גם בשם פטארה
    חראמי, יובל של נהר הקציה המצטרף אליו מגדתו הימנית. הן נצפו לראשונה בשנות ה-80 של המאה ה-19, אבדו,
    ונמצאו מחדש רק ב-1976, אחרי שורה של חיפושים כושלים. יוצריהן פעלו לאורך תקופה ארוכה מאוד, מן התקופה
    המזוליתית ועד תקופת הברונזה התיכונה.


    כמאה דימויים פרושים על פני שישה משטחים לאורך כ-50 מטר של בזלת שטוחה. בעלי החיים שולטים בהם: איילים
    עם קרניים מוגזמות, סוסים, עזי הרים, ציפורים ודגים, ויצורי כלאיים דמיוניים, כולם מתוארים מן הצד. כמה
    מן החיות לכודות ברשת של צייד. בני האדם הם ציידים, המתוארים חזיתית, עם קשת וחץ ביד שמאל, וקטנים להפליא
    לצד טרפם. גודל הדמויות נע בין 2.5 לכ-20 סנטימטרים, והן חרוטות באבן לעומק של מילימטר או שניים בלבד.
    צלבים, דוגמאות של לוח שחמט ושמשות קורנות ממלאים את הרווחים. מופיעים גם גמלים, אך ככל הנראה הם תוספת
    מאוחרת בהרבה, ותאריכם לא נקבע.


    שום דבר דומה לזה אינו מוכר בגאורגיה: במערת מגווימווי שבאימרתי ובאגצה שבאבחזיה החריטות הן סימנים גאומטריים
    פשוטים. האתר רשום כאתר מורשת תרבותית והוא חלק מ"שבילי אמנות הסלע הפרהיסטורית" של מועצת אירופה — והוא
    נתון בסכנת הידרדרות.


    הקווים רדודים כל כך שאור הצהריים השטוח כמעט מוחק אותם; שמש נמוכה מחזירה את האיילים. הביטו בדגים ובאיילים
    בעלי הקרניים, ואז בשטחי העשב חסרי העצים סביבכם, ותתחילו לתהות איך נראתה הרמה הזאת פעם.


    האמנים עשו את החיות גדולות ואת עצמם קטנים. אחרי כל אלפי השנים האלה, הפרופורציה עדיין נראית כנה.
  tip: >-
    הכניסה חופשית, האתר אינו מגודר, ואין בו שלטים או מתקנים כלשהם. החריטות נמצאות בערוץ שמתחת לגנטיאדי:
    היעזרו בקואורדינטות (41.5862, 43.9772), שאלו בכפר או, טוב יותר, תאמו מדריך מקומי בצאלקה. נעלו נעליים
    שאוחזות היטב בסלע. בואו בשעות הבוקר המוקדמות או אחר הצהריים המאוחרים, כשאור נמוך ומלוכסן מבליט את
    הקווים, או הביאו פנס והאירו מן הצד. לעולם אל תגעו בחריטות, אל תסמנו אותן בגיר, אל תרטיבו ואל תשפשפו
    אותן כדי להבליטן: הן שבריריות מספיק גם כך. אוכל ודלק יש בצאלקה; קניון דשבאשי ומאגר צאלקה נמצאים שניהם
    בטווח של 10 ק"מ.
  route: >-
    צאו מטביליסי בכביש Sh36 דרך צקנטי וקוג'ורי אל מאנגליסי, ואז בכביש Sh31 מערבה לרוחב הרמה עד צאלקה.
    המשיכו דרך העיירה באותו כביש עוד כעשרה קילומטרים, לכיוון נינוצמינדה, עד גנטיאדי. בסך הכול כ-102 ק"מ
    ושעתיים נסיעה. אחרי קוג'ורי האספלט מטפס בסיבובים חדים, ולמעלה נושבות רוחות צד חזקות; מן הכפר מובילות
    אל הערוץ דרך חצץ לא מסומנת והליכה קצרה. ממאי עד אוקטובר רכב חסכוני יסתדר; בחורף הרמה מכוסה שלג. תדלקו
    בטביליסי או בצאלקה.
ar:
  name: نقوش تريالتي الصخرية (غانتيادي)
  short: >-
    نحو مئة من الأيائل والخيول والماعز والأسماك والرماة الصغار محفورة في البازلت قرب غانتيادي: الفن الصخري
    الوحيد من نوعه في جورجيا من عصور ما قبل التاريخ.
  body: >-
    **في خانق ضيق على هضبة تريالتي، تُرضِع أنثى أيّلٍ صغيرَها على لوح من البازلت منذ بضعة آلاف من السنين.**


    تقع النقوش عند طرف غانتيادي، القرية التي كانت تُسمّى قديماً تيكيليسا، في خانق نهر أفدريس-تسقالي المعروف
    أيضاً باسم باتارا خرامي، وهو رافد أيمن لنهر كتسيا. لوحظت أول مرة في ثمانينيات القرن التاسع عشر، ثم
    ضاعت، ولم يُعثر عليها مجدداً إلا عام 1976 بعد سلسلة من عمليات البحث الفاشلة. وقد عمل صانعوها على مدى
    زمني طويل جداً، من العصر الحجري الوسيط إلى العصر البرونزي الأوسط.


    تتوزع نحو مئة صورة على ست لوحات على امتداد نحو 50 متراً من البازلت المستوي. والسيادة فيها للحيوانات:
    أيائل بقرون مبالغ فيها، وخيول، وماعز جبلي، وطيور وأسماك، ومخلوقات هجينة خيالية، وكلها مرسومة من الجانب.
    وبعض الحيوانات عالق في شبكة صياد. أما البشر فصيادون مصوَّرون من الأمام، يحملون القوس والسهم في اليد
    اليسرى، ويبدون صغاراً على نحو لافت إلى جانب طرائدهم. يتراوح حجم الأشكال بين 2.5 ونحو 20 سنتيمتراً،
    ولا يتجاوز عمق حفرها في الحجر مليمتراً أو اثنين. وتملأ الفراغات صلبانٌ ونقوش كرقعة الشطرنج وشموس مشعّة.
    وتظهر الجِمال أيضاً، لكنها على الأرجح إضافة أحدث بكثير، ولم يُحدَّد تاريخها.


    لا يُعرف في جورجيا شيء آخر يشبهها: ففي كهف مغفيميفي في إيميريتي وفي أغتسا في أبخازيا ليست النقوش سوى
    علامات هندسية بسيطة. والموقع معلم مسجّل من معالم التراث الثقافي وجزء من «مسارات الفن الصخري لما قبل
    التاريخ» التابعة لمجلس أوروبا — وهو معرّض لخطر التدهور.


    الخطوط ضحلة إلى حد أن ضوء الظهيرة المسطّح يكاد يمحوها؛ والشمس المنخفضة تعيد الأيائل إلى الظهور. انظر
    إلى الأسماك والأيائل ذات القرون المتشعبة، ثم إلى المراعي الخالية من الشجر من حولك، وستبدأ بالتساؤل
    كيف كانت هذه الهضبة تبدو يوماً.


    جعل الفنانون الحيوانات كبيرة وأنفسهم صغاراً. وبعد كل هذه الألفيات، لا تزال النسبة تبدو صادقة.
  tip: >-
    الموقع مجاني وغير مسيّج، بلا لافتات ولا مرافق. تقع النقوش في الخانق أسفل غانتيادي: استعن بالإحداثيات
    (41.5862, 43.9772)، واسأل في القرية، أو الأفضل أن ترتب مع دليل محلي في تسالكا. البس حذاءً يثبت على
    الصخر. تعالَ في الصباح الباكر أو آخر العصر، حين يُظهر الضوء المائل الخطوط، أو أحضر مصباحاً يدوياً
    وسلّط ضوءه من الجانب. لا تلمس النقوش أبداً، ولا تخطّ عليها بالطباشير، ولا تبللها أو تفركها لإبرازها:
    فهي هشة بما يكفي. الطعام والوقود في تسالكا؛ وأخدود داشباشي وخزان تسالكا كلاهما في حدود 10 كم.
  route: >-
    اخرج من تبليسي على الطريق Sh36 مروراً بتسكنيتي وكوجوري إلى مانغليسي، ثم على Sh31 غرباً عبر الهضبة
    حتى تسالكا. تابع عبر البلدة على الطريق نفسه نحو عشرة كيلومترات أخرى، باتجاه نينوتسميندا، حتى غانتيادي.
    المسافة الإجمالية نحو 102 كم وساعتان. بعد كوجوري يصعد الأسفلت بمنعطفات حادة، والرياح الجانبية قوية
    في الأعلى؛ ومن القرية يقود مسلك حصوي بلا علامات ثم مشي قصير نزولاً إلى الخانق. من مايو إلى أكتوبر
    تكفي سيارة اقتصادية؛ وفي الشتاء تكسو الثلوج الهضبة. تزوّد بالوقود في تبليسي أو تسالكا.
