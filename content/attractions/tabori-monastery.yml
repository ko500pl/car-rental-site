ka:
  name: თაბორის ფერისცვალების მონასტერი
  short: >-
    ნარიყალას პირისპირ, შაჰებისა და მეფეების ნაომარ მთაზე 1995–2001 წლებში ხელახლა აშენებული მონასტერი
    დგას — ძველი თბილისი აქედან ხელისგულივით ჩანს.
  body: >-
    **ლეღვთახევის გადაღმა, ნარიყალას პირისპირ, თაბორის მთა ყოფილა ეკლესიაც, ციხესიმაგრეც, ზარბაზნების
    ბაქანიც და უკვალოდ გამქრალი ნანგრევიც — მის თხემზე მდგარი დღევანდელი მონასტერი კი მხოლოდ 2001 წელს
    დასრულდა.**


    სახელი გალილეის თაბორის მთიდან მოდის, სადაც, ქრისტიანული გადმოცემით, უფალმა ფერი იცვალა. ამ ქედზე
    მდგარი ეკლესია უკვე 1392 წლის საბუთში იხსენიება, შემდეგ — ალექსანდრე I-ის 1429 წლის გუჯარში, ვახუშტი
    ბატონიშვილის 1735 წლის ტფილისის გეგმაზე კი „მთაბორად“ არის აღნიშნული. XIX საუკუნის ისტორიკოსი პლატონ
    იოსელიანი აქ ქვის გალავნით შემოზღუდულ სიმაგრეს — თაბორს, იგივე ყორჩი-ყალას — აღწერს, რომელიც ქალაქის
    სამხრეთ, განჯის კარს იცავდა.


    იოსელიანის ცნობები თბილისის უმძიმესი საუკუნეების მოკლე მატიანეს ჰგავს. 1618 წელს მთა შაჰ-აბასმა ააოხრა,
    როსტომ მეფემ აღადგინა, ნადირ-შაჰმა, რომელიც ტფილისს 1735 წელს დაეუფლა, დაანგრია და 1743 წელს თავადვე
    ბრძანა ეკლესიის ხელახლა აგება. 1759 წელს ერეკლე II-მ აქ გამაგრებული აბდულა-ბეგი განდევნა და მწვერვალზე
    დიდი ზარბაზნები დადგა. ბოლო წერტილი 1795 წელს აღა-მაჰმად-ხანის ლაშქარმა დასვა: იოსელიანის დროს მთაზე
    შენობების კვალიც აღარ ჩანდა.


    ახალი გუმბათიანი ტაძარი არქიტექტორებმა გია ცხადაიამ და ლევან ლომიძემ დააპროექტეს; მისი საძირკველი
    კათოლიკოს-პატრიარქმა ილია II-მ 1996 წლის 19 აგვისტოს, სწორედ ფერისცვალების დღესასწაულზე აკურთხა. გვერდით
    დგას მოსესა და ილიას სახელობის ეკლესია — სახარების თანახმად, ფერისცვალებისას ქრისტეს სწორედ ეს ორი
    წინასწარმეტყველი გამოეცხადა — და მოციქულთა მცირე ეკლესია. 2005 წლიდან მონასტერთან ნარკოდამოკიდებულ
    ადამიანთა სარეაბილიტაციო ცენტრი მუშაობს: ეს ცოცხალი სავანეა და არა დეკორაცია.


    მთის კიდიდან მთელი ძველი ქალაქი მოჩანს: აბანოთუბნის აგურის გუმბათები, ნარიყალას გალავანი, მეტეხის
    კლდეს შემოვლებული მტკვარი, მშვიდობის ხიდის შუშის რკალი. ლაშქრები ამ მთას იმიტომ ეცილებოდნენ, რომ აქედან
    მთელი ქალაქი მათ ფეხქვეშ იყო. დღესაც ასეა — მხოლოდ აქ ამოსვლის მიზეზი შეიცვალა.
  tip: >-
    შესვლა უფასოა. ფეხით აბანოთუბნიდან ციცაბო შესახვევებით ამოსვლას დაახლოებით ნახევარი საათი სჭირდება;
    ბილიკი არ არის განათებული, ამიტომ ამოდით დღისით და სრულ სიბნელემდე ჩამოდით. ეს მოქმედი მამათა მონასტერია,
    სადაც სარეაბილიტაციო ცენტრიც მუშაობს: ჩაიცვით მხრებისა და მუხლების დამფარავი სამოსი, ქალებს თავსაფარი
    დასჭირდებათ, ილაპარაკეთ ხმადაბლა და ბერებსა თუ ცენტრის ბინადრებს ნებართვის გარეშე ნუ გადაუღებთ. მწვერვალზე
    არც კაფეა, არც მაღაზია, არც საზოგადოებრივი ტუალეტი — წყალი თან იქონიეთ. საუკეთესო დრო გვიანი ნაშუადღევია,
    როცა დაბალი მზე ძველი ქალაქის აგურსა და ბათქაშს ათბობს.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 5 კმ და 15 წუთია, მთელი გზა ასფალტზე. პუშკინის ქუჩითა და ბარათაშვილის
    გამზირით ჩადით მტკვრის მარჯვენა სანაპიროზე, შემდეგ ვახტანგ გორგასლის ქუჩით გაჰყევით სამხრეთით, აბანოთუბნის
    გავლით ორთაჭალისკენ. მოუხვიეთ მარჯვნივ ბეჟან კალანდაძის ქუჩაზე, შემდეგ ისევ მარჯვნივ — ნოდარ ტაბიძის
    ქუჩაზე, თაბორის მთის ქუჩით დაახლოებით 700 მეტრი აუყევით აღმართს და მისი პირველი შესახვევით მონასტრის
    ჭიშკრამდე მიდით. ბოლო მონაკვეთი ციცაბო, ვიწრო და კლაკნილია, ზემოთ კი მხოლოდ რამდენიმე მანქანა ეტევა.
    ეკონომ-კლასის მანქანა უპრობლემოდ ამოვა, ოღონდ ნელა იარეთ და ჭიშკარს ნუ გადაკეტავთ. ასეთი მოკლე გზისთვის
    საწვავზე ფიქრიც ზედმეტია.
en:
  name: Tabori Monastery of the Transfiguration
  short: >-
    A monastery rebuilt in 1995–2001 on the ridge facing Narikala — a hill shahs and kings fought over,
    with Old Tbilisi laid out below.
  body: >-
    **Across the fig-tree gorge from Narikala, Tabori Hill has been church, fortress, gun platform and
    vanished ruin — and the monastery on its crown was finished only in 2001.**


    The name borrows Mount Tabor in Galilee, where Christian tradition places the Transfiguration. A church
    on this ridge appears in a document of 1392 and in a charter of King Alexander I from 1429, and Prince
    Vakhushti marked it as "Mtabori" on his 1735 plan of Tbilisi. The 19th-century historian Platon Ioseliani
    describes a walled stronghold here — Tabori, or Qorchi-qala — guarding the city's southern Ganja Gate.


    His account reads like a digest of Tbilisi's worst centuries. Shah Abbas laid the hill waste in 1618;
    King Rostom restored it; Nader Shah, master of Tbilisi from 1735, razed it, then in 1743 ordered the
    church rebuilt. In 1759 Erekle II drove out Abdullah-beg and set heavy cannon on the summit. Agha
    Mohammad Khan finished the work in 1795; by Ioseliani's day not a trace of building could be seen.


    The present domed church, designed by Gia Tskhadaia and Levan Lomidze, had its foundations blessed
    by Patriarch Ilia II on 19 August 1996 — the feast of the Transfiguration. Beside it stand a church
    of Moses and Elijah, the two prophets who in the Gospel account appeared with Christ, and a small
    church of the Apostles. Since 2005 the monastery has also run a rehabilitation centre for people recovering
    from drug addiction: a working community, not a set piece.


    Below, the Old Town lies open — the brick domes of Abanotubani, the walls of Narikala, the Mtkvari
    swinging round the Metekhi cliff, the glass arc of the Peace Bridge. Armies wanted this hill because
    it commanded the whole city. It still does; only the reasons for climbing it have changed.
  tip: >-
    Entry is free. On foot, the climb from the Abanotubani baths through steep lanes takes about 30 minutes,
    and the path is unlit — go up in daylight and be back down before full dark. This is a working men's
    monastery that also houses a rehabilitation centre: cover shoulders and knees, women should bring
    a headscarf, keep voices low and ask before photographing monks or residents. There is no café, shop
    or public toilet at the top, so carry water. Come in late afternoon, when low sun warms the brick
    and plaster of the Old Town below.
  route: >-
    About 5 km and 15 minutes from Freedom Square, paved all the way. Take Pushkin Street and Baratashvili
    Avenue down to the right-bank embankment, then follow Vakhtang Gorgasali Street south past the Abanotubani
    baths towards Ortachala. Turn right into Bejan Kalandadze Street, right again into Nodar Tabidze Street,
    then climb Taboris Mta Street for roughly 700 metres and take its first lane to the monastery gate.
    The last stretch is steep, narrow and twisting, with room for only a few cars at the top. An economy
    car copes easily, but take it slowly and never block the gate. No fuel stop needed for so short a
    hop.
ru:
  name: Таборский монастырь Преображения
  short: >-
    Монастырь, отстроенный в 1995–2001 годах на гребне напротив Нарикалы: за этот холм бились шахи и цари,
    а внизу раскинулся Старый Тбилиси.
  body: >-
    **По ту сторону инжирного ущелья, напротив Нарикалы, холм Табори успел побывать церковью, крепостью,
    орудийной позицией и бесследно исчезнувшими руинами — а монастырь на его вершине достроили лишь в
    2001 году.**


    Имя взято у горы Фавор в Галилее, где христианское предание помещает Преображение. Церковь на этом
    гребне упоминается в документе 1392 года и в грамоте царя Александра I 1429 года, а царевич Вахушти
    отметил её как «Мтабори» на своём плане Тбилиси 1735 года. Историк XIX века Платон Иоселиани описывает
    здесь обнесённую стенами твердыню — Табори, или Корчи-кала, — которая стерегла южные, Гянджинские
    ворота города.


    Его рассказ читается как конспект худших веков Тбилиси. Шах Аббас опустошил холм в 1618 году; царь
    Ростом его восстановил; Надир-шах, хозяин Тбилиси с 1735 года, сровнял его с землёй, а в 1743 году
    велел отстроить церковь. В 1759 году Ираклий II изгнал Абдулла-бека и поставил на вершине тяжёлые
    пушки. Ага-Мохаммед-хан довершил дело в 1795 году; во времена Иоселиани здесь не было видно и следа
    построек.


    Фундамент нынешней купольной церкви, спроектированной Гией Цхадаиа и Леваном Ломидзе, освятил Патриарх
    Илия II 19 августа 1996 года — в праздник Преображения. Рядом стоят церковь Моисея и Илии, двух пророков,
    которые, по евангельскому рассказу, явились вместе с Христом, и небольшая церковь Апостолов. С 2005
    года при монастыре работает и реабилитационный центр для людей, выздоравливающих от наркозависимости:
    это живая, трудовая община, а не декорация.


    Внизу открывается Старый город — кирпичные купола Абанотубани, стены Нарикалы, Мтквари, огибающая
    Метехскую скалу, стеклянная дуга Моста Мира. Армии стремились занять этот холм, потому что он господствовал
    над всем городом. Он господствует и теперь; изменились лишь причины, по которым на него поднимаются.
  tip: >-
    Вход бесплатный. Пешком подъём от бань Абанотубани по крутым переулкам занимает около 30 минут, и
    тропа не освещена — поднимайтесь засветло и спускайтесь до полной темноты. Это действующий мужской
    монастырь, при котором работает реабилитационный центр: закрывайте плечи и колени, женщинам нужен
    платок, говорите тихо и спрашивайте разрешения, прежде чем фотографировать монахов или подопечных
    центра. Наверху нет ни кафе, ни магазина, ни общественного туалета, так что возьмите воду. Приходите
    ближе к вечеру, когда низкое солнце согревает кирпич и штукатурку Старого города внизу.
  route: >-
    Около 5 км и 15 минут от площади Свободы, всё время по асфальту. Спуститесь по улице Пушкина и проспекту
    Бараташвили к правобережной набережной, затем по улице Вахтанга Горгасали на юг мимо бань Абанотубани
    в сторону Ортачалы. Сверните направо на улицу Беджана Каландадзе, ещё раз направо на улицу Нодара
    Табидзе, затем поднимайтесь по улице Таборис Мта примерно 700 метров и сверните в её первый переулок
    к воротам монастыря. Последний отрезок крутой, узкий и извилистый, наверху место лишь для нескольких
    машин. Машина эконом-класса справится без труда, но поезжайте медленно и никогда не загораживайте
    ворота. Для такой короткой поездки заправка не нужна.
fa:
  name: صومعه تبدیل هیئت تابوری
  short: >-
    صومعه‌ای که در ۱۹۹۵ تا ۲۰۰۱ بر یال روبه‌روی ناریکالا از نو ساخته شد؛ تپه‌ای که شاهان و پادشاهان بر
    سرش جنگیدند و تفلیس قدیم زیر پایش گسترده است.
  body: >-
    **آن سوی دره انجیر، روبه‌روی ناریکالا، تپه تابوری روزگاری کلیسا بوده، روزگاری دژ، روزگاری سکوی توپ
    و سرانجام ویرانه‌ای که از میان رفت — و صومعه‌ای که بر ستیغ آن ایستاده تنها در ۲۰۰۱ به پایان رسید.**


    نام از کوه تابور در جلیل گرفته شده، جایی که سنت مسیحی رویداد تبدیل هیئت مسیح را در آن می‌داند. کلیسایی
    بر این یال در سندی از سال ۱۳۹۲ و در فرمانی از پادشاه الکساندر یکم به سال ۱۴۲۹ آمده است، و شاهزاده
    واخوشتی آن را در نقشه‌اش از تفلیس به سال ۱۷۳۵ با نام «متابوری» نشان داده است. مورخ سده نوزدهم، پلاتون
    ایوسلیانی، در این‌جا دژی باروبند را توصیف می‌کند — تابوری یا قورچی‌قلعه — که دروازه جنوبی شهر، دروازه
    گنجه، را نگهبانی می‌کرد.


    گزارش او همچون چکیده‌ای از بدترین سده‌های تفلیس خوانده می‌شود. شاه عباس در ۱۶۱۸ تپه را ویران کرد؛
    رستم‌خان، پادشاه کارتلی، آن را بازسازی کرد؛ نادرشاه، که از ۱۷۳۵ بر تفلیس فرمان می‌راند، آن را با خاک
    یکسان کرد و سپس در ۱۷۴۳ فرمان داد کلیسا را دوباره بسازند. در ۱۷۵۹ ارکله دوم عبدالله‌بیگ را بیرون راند
    و توپ‌های سنگین بر ستیغ نشاند. آغا محمدخان در ۱۷۹۵ کار را تمام کرد؛ در روزگار ایوسلیانی هیچ نشانی
    از بنا دیده نمی‌شد.


    کلیسای گنبددار کنونی را گیا تسخادایا و لوان لومیدزه طراحی کردند و پاتریارک ایلیای دوم در ۱۹ اوت ۱۹۹۶
    — روز جشن تبدیل هیئت — پی آن را تبرک کرد. در کنارش کلیسایی به نام موسی و ایلیا، دو پیامبری که به روایت
    انجیل همراه مسیح ظاهر شدند، و کلیسای کوچکی به نام حواریون ایستاده است. از سال ۲۰۰۵ صومعه مرکزی برای
    بازپروری کسانی که از اعتیاد به مواد مخدر رهایی می‌یابند نیز اداره می‌کند: جامعه‌ای زنده و کوشا، نه
    صحنه‌آرایی.


    در پایین، شهر قدیم گشوده است — گنبدهای آجری آبانوتوبانی، باروهای ناریکالا، رود متکواری که گرد صخره
    متخی می‌پیچد، قوس شیشه‌ای پل صلح. سپاهیان این تپه را می‌خواستند چون بر همه شهر چیره بود. هنوز هم چیره
    است؛ تنها دلیل‌های بالا رفتن از آن تغییر کرده است.
  tip: >-
    ورود رایگان است. پیاده، سربالایی از گرمابه‌های آبانوتوبانی از میان کوچه‌های شیب‌دار حدود ۳۰ دقیقه
    طول می‌کشد و مسیر روشنایی ندارد — در روشنایی روز بالا بروید و پیش از تاریکی کامل پایین برگردید. این
    صومعه‌ای فعال و مردانه است که یک مرکز بازپروری نیز در خود دارد: شانه‌ها و زانوها را بپوشانید، بانوان
    روسری همراه بیاورند، آهسته سخن بگویید و پیش از عکاسی از راهبان یا ساکنان مرکز اجازه بگیرید. در بالا
    نه کافه هست، نه فروشگاه، نه سرویس بهداشتی عمومی؛ پس آب همراه داشته باشید. پسین هنگام بیایید، وقتی
    آفتاب کم‌ارتفاع آجر و گچ شهر قدیم را در پایین گرم می‌کند.
  route: >-
    حدود ۵ کیلومتر و ۱۵ دقیقه از میدان آزادی، سراسر آسفالت. از خیابان پوشکین و بلوار باراتاشویلی به خیابان
    ساحلی کرانه راست سرازیر شوید، سپس خیابان واختانگ گورگاسالی را به‌سوی جنوب، از کنار گرمابه‌های آبانوتوبانی
    به سمت اورتاچالا دنبال کنید. به راست، به خیابان بژان کالاندادزه بپیچید، دوباره به راست به خیابان نودار
    تابیدزه، سپس حدود ۷۰۰ متر از خیابان تابوریس متا بالا بروید و به نخستین کوچه آن بپیچید تا به دروازه
    صومعه برسید. بخش پایانی شیب‌دار، باریک و پرپیچ است و در بالا تنها برای چند خودرو جا هست. خودروی سواری
    معمولی به‌آسانی از پسش برمی‌آید، اما آهسته برانید و هرگز جلوی دروازه را نبندید. برای چنین مسیر کوتاهی
    نیازی به سوخت‌گیری نیست.
he:
  name: מנזר ההשתנות בטבורי
  short: >-
    מנזר שנבנה מחדש בשנים 1995–2001 על הרכס שמול נאריקלה — גבעה ששאהים ומלכים נלחמו עליה, וטביליסי העתיקה
    פרושה למרגלותיה.
  body: >-
    **מעבר לערוץ התאנים, מול נאריקלה, הייתה גבעת טבורי כנסייה, מבצר, עמדת תותחים וחורבה שנמחתה — והמנזר
    שעל פסגתה הושלם רק ב-2001.**


    השם שאול מהר תבור שבגליל, שבו ממקמת המסורת הנוצרית את ההשתנות. כנסייה על הרכס הזה מוזכרת במסמך משנת
    1392 ובכתב מלכותי של המלך אלכסנדר הראשון משנת 1429, והנסיך וחושטי סימן אותה בשם "מטבורי" במפת טביליסי
    שלו משנת 1735. ההיסטוריון בן המאה ה-19 פלטון יוסליאני מתאר כאן מצודה מוקפת חומה — טבורי, או קורצ'י-קלה
    — ששמרה על שער גנג'ה, השער הדרומי של העיר.


    תיאורו נקרא כמו תקציר של המאות הקשות ביותר בתולדות טביליסי. שאה עבאס החריב את הגבעה ב-1618; המלך רוסתום
    שיקם אותה; נאדר שאה, שליט טביליסי מ-1735, הרס אותה עד היסוד, ואז, ב-1743, ציווה לבנות מחדש את הכנסייה.
    ב-1759 גירש ארקלה השני את עבדאללה-בג והציב תותחים כבדים על הפסגה. אגא מוחמד ח'אן השלים את המלאכה ב-1795;
    בימיו של יוסליאני לא נראה כאן זכר לבניין.


    את יסודות הכנסייה הנוכחית בעלת הכיפה, שתכננו גיה צחדאיה ולבן לומידזה, בירך הפטריארך איליה השני ב-19
    באוגוסט 1996 — חג ההשתנות. לצדה עומדות כנסייה על שם משה ואליהו, שני הנביאים שלפי סיפור הבשורה נגלו
    עם ישו, וכנסייה קטנה על שם השליחים. מאז 2005 מפעיל המנזר גם מרכז שיקום לאנשים המחלימים מהתמכרות לסמים:
    קהילה חיה ועובדת, לא תפאורה.


    למטה נפרשת העיר העתיקה — כיפות הלבנים של אבנוטובאני, חומות נאריקלה, המטקווארי המתעקל סביב צוק מטכי,
    קשת הזכוכית של גשר השלום. צבאות חמדו את הגבעה הזאת כי היא שלטה על העיר כולה. היא שולטת בה עד היום;
    רק הסיבות לטפס אליה השתנו.
  tip: >-
    הכניסה חופשית. ברגל, העלייה מבתי המרחץ של אבנוטובאני בסמטאות תלולות אורכת כ-30 דקות, והשביל אינו מואר
    — עלו באור יום וחזרו לפני שמחשיך לגמרי. זהו מנזר גברים פעיל שפועל בו גם מרכז שיקום: כסו כתפיים וברכיים,
    נשים יביאו כיסוי ראש, דברו בשקט ובקשו רשות לפני שמצלמים נזירים או את שוהי המרכז. למעלה אין בית קפה,
    חנות או שירותים ציבוריים, אז קחו מים. בואו בשעות אחר הצהריים המאוחרות, כשהשמש הנמוכה מחממת את הלבנים
    והטיח של העיר העתיקה שלמטה.
  route: >-
    כ-5 ק"מ ו-15 דקות מכיכר החירות, סלול לכל אורכו. רדו ברחוב פושקין ובשדרות ברטשווילי אל הכביש שעל הגדה
    הימנית, ואז המשיכו דרומה ברחוב וחטנג גורגסלי, על פני בתי המרחץ של אבנוטובאני, לכיוון אורטצ'לה. פנו
    ימינה לרחוב בז'אן קלנדדזה, שוב ימינה לרחוב נודר טבידזה, ואז טפסו ברחוב טבוריס מטה כ-700 מטר ופנו לסמטה
    הראשונה שלו, עד שער המנזר. הקטע האחרון תלול, צר ומתפתל, ולמעלה יש מקום לכמה מכוניות בלבד. רכב פרטי
    רגיל יעבור בקלות, אבל סעו לאט ולעולם אל תחסמו את השער. לנסיעה קצרה כזאת אין צורך לתדלק.
ar:
  name: دير التجلي في تابوري
  short: >-
    دير أُعيد بناؤه بين 1995 و2001 على السلسلة المقابلة لناريكالا، فوق تلة تنازعها الشاهات والملوك، وتبليسي
    القديمة ممتدة تحتها.
  body: >-
    **عبر وادي التين، قبالة ناريكالا، كانت تلة تابوري كنيسةً وحصنًا ومربضًا للمدافع وأطلالًا اندثرت، أما
    الدير الذي يعلو قمتها فلم يكتمل إلا عام 2001.**


    الاسم مستعار من جبل طابور في الجليل، حيث يضع التقليد المسيحي حادثة التجلي. وتَرد كنيسة على هذه السلسلة
    في وثيقة من عام 1392 وفي منشور للملك ألكسندر الأول من عام 1429، وقد أشار إليها الأمير فاخوشتي باسم
    «متابوري» في مخططه لتبليسي عام 1735. ويصف مؤرخ القرن التاسع عشر بلاتون يوسيلياني حصنًا مسوّرًا هنا
    — تابوري أو قورجي قلعة — كان يحرس بوابة المدينة الجنوبية، بوابة غانجا.


    ويبدو سرده خلاصةً لأسوأ قرون تبليسي. فقد خرّب الشاه عباس التلة عام 1618؛ ثم رمّمها الملك روستوم؛ ودكّها
    نادر شاه، سيد تبليسي منذ 1735، ثم أمر عام 1743 بإعادة بناء الكنيسة. وفي عام 1759 طرد إريكلي الثاني
    عبد الله بك ونصب مدافع ثقيلة على القمة. وأتمّ آغا محمد خان المهمة عام 1795؛ وفي زمن يوسيلياني لم يكن
    يُرى أثر لأي بناء.


    أما الكنيسة الحالية ذات القبة، التي صممها غيا تسخادايا وليفان لوميدزه، فقد بارك البطريرك إيليا الثاني
    أساساتها في 19 أغسطس 1996، يوم عيد التجلي. وبجانبها كنيسة موسى وإيليا، النبيين اللذين ظهرا مع المسيح
    بحسب رواية الإنجيل، وكنيسة صغيرة للرسل. ومنذ عام 2005 يدير الدير أيضًا مركزًا لإعادة تأهيل المتعافين
    من إدمان المخدرات: إنها جماعة حية عاملة، لا مشهد للعرض.


    وفي الأسفل تنبسط البلدة القديمة: القباب الآجرية لأبانوتوباني، وأسوار ناريكالا، ونهر متكفاري ينعطف
    حول جرف ميتيخي، وقوس جسر السلام الزجاجي. أرادت الجيوش هذه التلة لأنها كانت تشرف على المدينة كلها.
    ولا تزال تشرف عليها؛ وحدها أسباب الصعود إليها تغيّرت.
  tip: >-
    الدخول مجاني. سيرًا على الأقدام يستغرق الصعود من حمّامات أبانوتوباني عبر أزقة شديدة الانحدار نحو 30
    دقيقة، والممر غير مضاء، فاصعد في ضوء النهار وعُد قبل حلول الظلام التام. هذا دير رجالي عامر بالرهبان
    يضم أيضًا مركزًا لإعادة التأهيل: غطِّ الكتفين والركبتين، وعلى النساء إحضار غطاء للرأس، واخفض صوتك،
    واستأذن قبل تصوير الرهبان أو نزلاء المركز. لا مقهى ولا متجر ولا دورات مياه عامة في الأعلى، فاحمل الماء
    معك. تعالَ في أواخر العصر، حين تدفئ الشمس المنخفضة آجرّ البلدة القديمة وجصّها في الأسفل.
  route: >-
    نحو 5 كم و15 دقيقة من ساحة الحرية، والطريق معبّد بالكامل. انزل عبر شارع بوشكين وجادة باراتاشفيلي إلى
    طريق الضفة اليمنى، ثم اتبع شارع فاختانغ غورغاسالي جنوبًا مرورًا بحمامات أبانوتوباني نحو أورتاتشالا.
    انعطف يمينًا إلى شارع بيجان كالاندادزه، ثم يمينًا مرة أخرى إلى شارع نودار تابيدزه، ثم اصعد شارع تابوريس
    متا نحو 700 متر وادخل أول زقاق متفرع منه حتى بوابة الدير. المقطع الأخير شديد الانحدار وضيق ومتعرج،
    ولا يتسع في الأعلى إلا لبضع سيارات. تتدبر السيارة العادية الأمر بسهولة، لكن قُد ببطء ولا تسدّ البوابة
    أبدًا. لا حاجة إلى التزود بالوقود لمشوار قصير كهذا.
