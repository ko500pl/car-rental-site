ka:
  name: ოზურგეთის ისტორიული მუზეუმი
  short: >-
    გურიის მთავარი ისტორიული მუზეუმი: ექვს ათასზე მეტი ნივთი ძვ. წ. IX ათასწლეულიდან დღემდე — კოლხური
    ბრინჯაო, აჯანყებულის ყამა და იდუმალი ფრანგული დაშნა.
  body: >-
    **ოზურგეთის მუზეუმის ექვსი ათასი ნივთიდან გურიაზე ყველაზე მეტს ორი იარაღი მოგიყვებათ: აჯანყებულის
    ყამა და ფრანგული დაშნა, რომლის ამბავი ჯერაც ბოლომდე არავის მოუყოლია.**


    პირველი ცდა 1924 წლის აპრილით თარიღდება, როცა ენათმეცნიერმა აკაკი შანიძემ ოზურგეთში საეთნოგრაფიო მუზეუმი
    დააარსა, რომლის შემდგომი ბედი უცნობია. დღევანდელი დაწესებულება 1936 წლის 1 აპრილს შეიქმნა: წითელგვარდიელთა
    და პარტიზანთა საზოგადოებამ ორასი ნივთი — კაჟიანი თოფები, დამბაჩები, სატევრები, ხმლები — გადასცა და
    ქალაქს, რომელსაც მაშინ მახარაძე ერქვა, მხარეთმცოდნეობის მუზეუმი გაუჩნდა. პირველი დირექტორი, ნიკოლოზ
    სამსონია, მეორე მსოფლიო ომში დაიღუპა. 1974–1991 წლებში კოლექცია გურიელების ყოფილ სასახლეში იყო, 1991
    წელს კი საბჭოთა მე-18 არმიის მუზეუმისთვის 1978–1981 წლებში აგებულ შენობაში გადავიდა.


    ექსპონატები ძველი წელთაღრიცხვის IX ათასწლეულიდან დღემდე მოდის: ნეოლითური მასალა, ბრინჯაოს ხანის კოლხური
    ცულები და ბრინჯაოს წვრილი პლასტიკა, ადრეანტიკური ოქრო და ვერცხლი, ურეკის განძის ნაწილი. მონეტები ძვ.
    წ. VI–III საუკუნეების კოლხური თეთრითა და ალექსანდრე მაკედონელის ოქროს მონეტით იწყება და თამარის, რუსუდანისა
    და ერეკლე II-ის ფულით გრძელდება. ექადიის ტაძრის ასომთავრული წარწერა კახაბერ I გურიელს იხსენიებს —
    გურიელთა მთავრული სახლის მამამთავარს.


    მერე კი — ორი იარაღი. ყამა ამბაკო შალიკაშვილს ეკუთვნოდა, რომელიც 1841 წელს რუსეთის ხელისუფლების წინააღმდეგ
    გურიის აჯანყებას მეთაურობდა: 60 სანტიმეტრი სიგრძისაა, შავი, ძვლით შემკული ვადით, ქალაქის კოლექციაში
    კი 1925 წელს, დღევანდელი მუზეუმის დაარსებამდე მოხვდა; იმავე აჯანყების საბრძოლო ბუკიც აქვეა დაცული.
    მეორე ფრანგული დაშნაა. ქართული წყარო მას მიურატების საგვარეულოს უკავშირებს, ინგლისურენოვანი კი — თავად
    ნაპოლეონ ბონაპარტს. როგორ მოხვდა ის გურიაში, არცერთ გამოქვეყნებულ წყაროში არ წერია; ჰკითხეთ მუზეუმის
    თანამშრომლებს.


    გურია იარაღს ყოველთვის ადვილად იღებდა ხელში. აქ, როგორც იქნა, იარაღი ისვენებს.
  tip: >-
    გამოქვეყნებული ცნობებით, მუზეუმი ყოველდღე 10:00-დან 18:00-მდე მუშაობს და შესვლა უფასოა, მაგრამ ერთ
    მოგზაურ ავტორს კარი რამდენჯერმე დაკეტილი დახვდა — ამიტომ წინასწარ დარეკეთ (საკონტაქტო ნომერი საქართველოს
    მუზეუმების ასოციაციის გვერდზეა) და მთელი დღე მარტო მასზე ნუ დაგეგმავთ. თუ კარი დაკეტილი დაგხვდათ,
    ქალაქის განაპირას მდებარე შემოქმედის მონასტერი მგზავრობას მაინც გაამართლებს. შენობის ფასადზე საბჭოთა
    დროის რელიეფია — ფოტოდ ღირს. დრამატული თეატრი ორიოდე წუთის სავალზეა. მუზეუმს ფილიალებიც აქვს: საეთნოგრაფიო
    მუზეუმი დვაბზუში, მემორიალური მუზეუმი გურიანთაში და ექვთიმე თაყაიშვილის მუზეუმი ლიხაურში — დიდი არქეოლოგის
    მშობლიურ სოფელში.
  route: >-
    ოზურგეთამდე თბილისიდან 300 კილომეტრია, დაახლოებით 4 საათი და 50 წუთი, მთელ გზაზე ასფალტით. E60-ით
    (ს1) დასავლეთისკენ იარეთ — ხაშურის, რიკოთის მონაკვეთისა და ზესტაფონის გავლით, ქუთაისის გვერდის ავლით
    სამტრედიამდე. იქ ს12-ზე ლანჩხუთისკენ გადადით, ლანჩხუთის შემდეგ კი ადგილობრივი გზებით და შ2-ით ოზურგეთამდე
    ჩადით — სამტრედიიდან დაახლოებით 50 კილომეტრია. მუზეუმი ქალაქის ცენტრშია, დრამატული თეატრიდან ორიოდე
    წუთის სავალზე; მანქანა ახლომდებარე ქუჩებში გააჩერეთ. საწვავი ხაშურში, ზესტაფონში, სამტრედიაში ან ოზურგეთში
    შეავსეთ. ეკონომ კლასის მანქანა სავსებით საკმარისია.
en:
  name: Ozurgeti History Museum
  short: >-
    Guria's main history museum: over 6,000 objects from the 9th millennium BC to today — Colchian bronzes,
    a rebel's qama and a French rapier with a riddle.
  body: >-
    **Of the six thousand objects in Ozurgeti's museum, two blades say the most about Guria: a rebel's
    qama and a French rapier whose story no one has yet fully told.**


    The first attempt came in April 1924, when the linguist Akaki Shanidze founded an ethnographic museum
    in Ozurgeti, whose later fate is unknown. The present institution was created on 1 April 1936: a society
    of former Red Guards and partisans handed over two hundred objects — flintlocks, pistols, daggers
    and sabres — and gave the town, then called Makharadze, a museum of local lore. Its first director,
    Nikoloz Samsonia, was killed in the Second World War. From 1974 to 1991 the collection filled the
    former Gurieli palace; in 1991 it moved into a building raised in 1978–81 for a museum of the Soviet
    18th Army.


    The exhibits run from the ninth millennium BC to the present: Neolithic finds, Bronze Age Colchian
    axes and small bronze figures, early Classical gold and silver, part of the Ureki hoard. The coins
    begin with Colchian silver of the sixth to third centuries BC and a gold coin of Alexander the Great,
    and carry on through the coinage of Tamar, Rusudan and Erekle II. An asomtavruli inscription from
    the church at Ekadia names Kakhaber I Gurieli, founder of the princely house.


    Then the two blades. The qama belonged to Ambako Shalikashvili, who led the Gurian uprising of 1841
    against Russian rule: 60 centimetres long, with a black, bone-inlaid hilt, which entered the town's
    collection in 1925, before the present museum existed; a war horn from the same revolt is kept here
    too. The other is a French rapier. A Georgian source links it to the Murat family, an English one
    to Napoleon Bonaparte himself. How it reached Guria, no published source says — ask the curators.


    Guria was always quick to take up arms. Here, at last, the arms are at rest.
  tip: >-
    Published listings give the hours as 10:00–18:00 daily with free entry, but at least one travel writer
    has repeatedly found the doors shut, so ring ahead (the number is listed by the Georgian Museums Association)
    and do not build a whole day around it. If the doors are shut, Shemokmedi Monastery, just outside
    town, still makes the trip worthwhile. The Soviet-era façade carries a bold bas-relief worth a photograph.
    The Drama Theatre is a couple of minutes' walk away. The museum also runs branches: an ethnographic
    museum in Dvabzu, a memorial museum in Gurianta and the Ekvtime Takaishvili museum in Likhauri, the
    great archaeologist's home village.
  route: >-
    Ozurgeti is 300 km from Tbilisi, about 4 hours 50 minutes, on asphalt all the way. Take the E60 (S1)
    west past Khashuri, through the Rikoti section and past Zestaponi and Kutaisi to Samtredia. There
    switch to the S12 towards Lanchkhuti, and beyond Lanchkhuti follow local roads and the Sh2 into Ozurgeti
    — about 50 km from Samtredia. The museum is in the town centre, a couple of minutes on foot from the
    Drama Theatre; park in the nearby streets. Fuel up at Khashuri, Zestaponi, Samtredia or in Ozurgeti.
    An economy car is all you need.
ru:
  name: Исторический музей Озургети
  short: >-
    Главный музей истории Гурии: более 6000 предметов от IX тысячелетия до н. э. до наших дней — колхидская
    бронза, кама повстанца и французская рапира с загадкой.
  body: >-
    **Из шести тысяч предметов озургетского музея больше всего о Гурии говорят два клинка: кама повстанца
    и французская рапира, чью историю до сих пор никто не рассказал до конца.**


    Первая попытка была сделана в апреле 1924 года, когда лингвист Акакий Шанидзе основал в Озургети этнографический
    музей, чья дальнейшая судьба неизвестна. Нынешний музей появился 1 апреля 1936 года: общество бывших
    красногвардейцев и партизан передало ему двести предметов — кремнёвые ружья, пистолеты, кинжалы и
    сабли — и подарило городу, который тогда назывался Махарадзе, краеведческий музей. Его первый директор,
    Николоз Самсония, погиб во Второй мировой войне. С 1974 по 1991 год коллекция занимала бывший дворец
    Гуриели, а в 1991-м переехала в здание, построенное в 1978–1981 годах для музея советской 18-й армии.


    Экспозиция охватывает время от IX тысячелетия до н. э. до наших дней: находки эпохи неолита, колхидские
    топоры и небольшие бронзовые фигурки эпохи бронзы, золото и серебро ранней античности, часть Урекского
    клада. Монетный ряд открывают колхидское серебро VI–III веков до н. э. и золотая монета Александра
    Македонского, а продолжают монеты Тамар, Русудан и Ираклия II. Надпись асомтаврули из церкви в Экадиа
    называет имя Кахабера I Гуриели — основателя княжеского дома.


    А теперь — два клинка. Кама принадлежала Амбако Шаликашвили, возглавившему Гурийское восстание 1841
    года против российской власти: длина 60 сантиметров, чёрная рукоять с костяной инкрустацией, в городское
    собрание она попала в 1925 году, ещё до основания нынешнего музея; здесь же хранится и боевой рог
    того же восстания. Второй клинок — французская рапира. Грузинский источник связывает её с семейством
    Мюратов, английский — с самим Наполеоном Бонапартом. Как она оказалась в Гурии, не сообщает ни один
    опубликованный источник — спросите у хранителей.


    Гурия всегда была скора на оружие. Здесь оно наконец обрело покой.
  tip: >-
    По опубликованным данным, музей открыт ежедневно с 10:00 до 18:00, вход свободный, но по меньшей мере
    один автор путевых заметок не раз заставал двери закрытыми, так что позвоните заранее (номер есть
    в списке Ассоциации музеев Грузии) и не стройте вокруг музея целый день. Если двери окажутся закрыты,
    поездку всё равно оправдает монастырь Шемокмеди сразу за городом. На фасаде советской эпохи — смелый
    барельеф, достойный снимка. До Драматического театра — пара минут пешком. У музея есть и филиалы:
    этнографический музей в Двабзу, мемориальный музей в Гурианте и музей Эквтиме Такаишвили в Лихаури,
    родном селе великого археолога.
  route: >-
    От Тбилиси до Озургети 300 км, около 4 часов 50 минут, и весь путь по асфальту. Двигайтесь по E60
    (S1) на запад мимо Хашури, через участок Рикоти, мимо Зестафони и Кутаиси до Самтредиа. Там сверните
    на S12 в сторону Ланчхути, а за Ланчхути следуйте по местным дорогам и Sh2 до Озургети — около 50
    км от Самтредиа. Музей стоит в центре города, в паре минут ходьбы от Драматического театра; машину
    оставьте на соседних улицах. Заправиться можно в Хашури, Зестафони, Самтредиа или в самом Озургети.
    Хватит и автомобиля эконом-класса.
fa:
  name: موزهٔ تاریخ ازورگتی
  short: >-
    موزهٔ اصلی تاریخ گوریا: بیش از ۶۰۰۰ شیء از هزارهٔ نهم پیش از میلاد تا امروز — مفرغ‌های کلخیسی، قمهٔ
    یک شورشی و شمشیر راپیری فرانسوی با یک معما.
  body: >-
    **از شش هزار شیء موزهٔ ازورگتی، دو تیغه بیش از همه از گوریا سخن می‌گویند: قمهٔ یک شورشی، و شمشیر راپیری
    فرانسوی که هنوز کسی داستانش را تا پایان بازنگفته است.**


    نخستین تلاش در آوریل ۱۹۲۴ بود، هنگامی که زبان‌شناس آکاکی شانیدزه در ازورگتی موزه‌ای مردم‌نگاری بنیاد
    نهاد که از سرنوشت بعدی‌اش خبری نیست. نهاد کنونی در ۱ آوریل ۱۹۳۶ پدید آمد: انجمنی از گاردهای سرخ و
    پارتیزان‌های پیشین دویست شیء — تفنگ‌های چخماقی، تپانچه، خنجر و شمشیر — به آن سپرد و به شهر، که آن
    زمان ماخارادزه نام داشت، یک موزهٔ تاریخ و فرهنگ محلی بخشید. نخستین مدیرش، نیکولوز سامسونیا، در جنگ
    جهانی دوم کشته شد. از ۱۹۷۴ تا ۱۹۹۱ مجموعه در کاخ پیشین خاندان گوریلی جای داشت و در ۱۹۹۱ به ساختمانی
    رفت که در سال‌های ۱۹۷۸ تا ۱۹۸۱ برای موزهٔ ارتش هجدهم شوروی ساخته شده بود.


    اشیای موزه از هزارهٔ نهم پیش از میلاد تا امروز را دربر می‌گیرند: یافته‌های دوران نوسنگی، تبرهای کلخیسی
    و پیکرک‌های کوچک مفرغی از عصر مفرغ، زر و سیم آغاز دوران کلاسیک، و بخشی از گنجینهٔ اورکی. سکه‌ها با
    نقرهٔ کلخیسی سده‌های ششم تا سوم پیش از میلاد و سکه‌ای زرین از اسکندر مقدونی آغاز می‌شوند و تا سکه‌های
    دوران تامار، روسودان و ایراکلی دوم ادامه می‌یابند. کتیبه‌ای به خط آسومتاورولی از کلیسای اکادیا نام
    کاخابر یکم گوریلی، بنیان‌گذار این خاندان امیری، را بر خود دارد.


    و اما آن دو تیغه. قمه از آنِ آمباکو شالیکاشویلی بود که قیام گوریا در ۱۸۴۱ را بر ضد حکومت روسیه رهبری
    کرد: ۶۰ سانتی‌متر درازا، با دسته‌ای سیاه و استخوان‌نشان، که در ۱۹۲۵، پیش از بنیاد موزهٔ کنونی، به
    مجموعهٔ شهر راه یافت؛ بوق جنگی همان قیام نیز اینجا نگهداری می‌شود. دیگری شمشیر راپیری فرانسوی است.
    منبعی گرجی آن را به خاندان مورا نسبت می‌دهد و منبعی انگلیسی به خودِ ناپلئون بناپارت. اینکه چگونه به
    گوریا رسیده، هیچ منبع منتشرشده‌ای نمی‌گوید — از متصدیان موزه بپرسید.


    گوریا همیشه زود دست به سلاح می‌برد. اینجا، سرانجام، سلاح‌ها آرام گرفته‌اند.
  tip: >-
    طبق اطلاعات منتشرشده، موزه هر روز از ۱۰:۰۰ تا ۱۸:۰۰ باز است و ورود رایگان است، اما دست‌کم یک سفرنامه‌نویس
    بارها درها را بسته یافته است؛ پس از پیش تماس بگیرید (شماره در فهرست انجمن موزه‌های گرجستان آمده) و
    همهٔ روزتان را بر پایهٔ این بازدید نچینید. اگر درها بسته بود، دیر شموکمدی، درست بیرون شهر، باز هم
    سفر را ارزشمند می‌کند. نمای دوران شوروی نقش‌برجسته‌ای جسورانه دارد که ارزش یک عکس را دارد. تئاتر درام
    تنها دو دقیقه پیاده‌روی فاصله دارد. موزه شعبه‌هایی هم دارد: موزهٔ مردم‌نگاری در دوابزو، موزهٔ یادبود
    در گوریانتا و موزهٔ اکوتیمه تاکائیشویلی در لیخائوری، زادگاه این باستان‌شناس بزرگ.
  route: >-
    ازورگتی ۳۰۰ کیلومتر از تفلیس فاصله دارد، حدود ۴ ساعت و ۵۰ دقیقه، و سراسر راه آسفالت است. از جادهٔ
    E60 (S1) به سوی غرب بروید، از کنار خاشوری بگذرید، از بخش ریکوتی عبور کنید و پس از زستافونی و کوتایسی
    به سامتردیا برسید. آنجا به S12 به سمت لانچخوتی بپیچید و پس از لانچخوتی از جاده‌های محلی و Sh2 به ازورگتی
    بروید — حدود ۵۰ کیلومتر از سامتردیا. موزه در مرکز شهر است، دو دقیقه پیاده تا تئاتر درام؛ در خیابان‌های
    اطراف پارک کنید. در خاشوری، زستافونی، سامتردیا یا خود ازورگتی سوخت بگیرید. یک خودروی اقتصادی کاملاً
    کافی است.
he:
  name: המוזיאון ההיסטורי של אוזורגתי
  short: >-
    המוזיאון ההיסטורי המרכזי של גוריה: יותר מ-6,000 פריטים מהאלף התשיעי לפנה״ס ועד ימינו — ברונזה קולכית,
    פגיון קאמה של מורד וחרב רפייר צרפתית שאופפת אותה חידה.
  body: >-
    **מתוך ששת אלפים הפריטים שבמוזיאון של אוזורגתי, שני להבים מספרים על גוריה יותר מכל השאר: פגיון הקאמה
    של מורד, וחרב רפייר צרפתית שאיש עוד לא סיפר את סיפורה עד תומו.**


    הניסיון הראשון נעשה באפריל 1924, כשהבלשן אקקי שנידזה ייסד באוזורגתי מוזיאון אתנוגרפי, שגורלו לאחר
    מכן אינו ידוע. המוסד הנוכחי נוסד ב-1 באפריל 1936: אגודה של יוצאי המשמר האדום ושל פרטיזנים לשעבר מסרה
    לו מאתיים פריטים — רובי צור, אקדחים, פגיונות וחרבות — וכך קיבלה העיר, שנקראה אז מחרדזה, מוזיאון לתולדות
    האזור. מנהלו הראשון, ניקולוז סמסוניה, נפל במלחמת העולם השנייה. מ-1974 עד 1991 שכן האוסף בארמון לשעבר
    של בית גוריאלי, וב-1991 עבר לבניין שהוקם בשנים 1978–1981 עבור מוזיאון הארמייה ה-18 הסובייטית.


    המוצגים משתרעים מהאלף התשיעי לפנה״ס ועד ימינו: ממצאים מהתקופה הנאוליתית, גרזנים קולכיים ופסלוני ברונזה
    קטנים מתקופת הברונזה, זהב וכסף מראשית התקופה הקלאסית, וחלק ממטמון אורקי. אוסף המטבעות נפתח בכסף קולכי
    מהמאות השישית עד השלישית לפנה״ס ובמטבע זהב של אלכסנדר הגדול, ונמשך במטבעות שהוטבעו בימי תמר, רוסודן
    וארקלה השני. כתובת בכתב אסומתאוורולי מהכנסייה באקדיה מזכירה בשמו את קאחאבר הראשון גוריאלי, מייסד בית
    הנסיכים.


    ועכשיו, שני הלהבים. הקאמה הייתה שייכת לאמבקו שליקשווילי, מנהיג מרד גוריה של 1841 נגד השלטון הרוסי:
    אורכה 60 סנטימטרים, ניצבה שחור ומשובץ עצם, והיא נכנסה לאוסף העירוני ב-1925, עוד לפני שהמוזיאון הנוכחי
    נוסד; גם קרן מלחמה מאותו מרד שמורה כאן. הלהב השני הוא חרב רפייר צרפתית. מקור גאורגי קושר אותה למשפחת
    מירה, ומקור אנגלי — לנפוליאון בונפרטה עצמו. איך הגיעה לגוריה? אף מקור שפורסם אינו מספר — שאלו את האוצרים.


    גוריה תמיד מיהרה לאחוז בנשק. כאן, סוף־סוף, הנשק נח.
  tip: >-
    לפי המידע שפורסם, המוזיאון פתוח מדי יום 10:00–18:00 והכניסה חינם, אבל לפחות כותב מסעות אחד מצא שוב
    ושוב את הדלתות נעולות, ולכן התקשרו מראש (המספר מופיע ברשימת איגוד המוזיאונים של גאורגיה) ואל תבנו
    סביב הביקור יום שלם. אם הדלתות נעולות, מנזר שמוקמדי, ממש מחוץ לעיר, עדיין מצדיק את הנסיעה. על החזית
    מהתקופה הסובייטית יש תבליט נועז ששווה צילום. תיאטרון הדרמה נמצא דקה־שתיים הליכה משם. למוזיאון יש גם
    שלוחות: מוזיאון אתנוגרפי בדוואבזו, מוזיאון הנצחה בגוריאנתה ומוזיאון אקוותימה טקאישווילי בליחאורי,
    כפר הולדתו של הארכאולוג הדגול.
  route: >-
    אוזורגתי נמצאת 300 ק״מ מטביליסי, כ-4 שעות ו-50 דקות נסיעה, כולה על אספלט. סעו מערבה בכביש E60 (S1),
    עברו את חשורי, את קטע ריקוטי, את זסטפוני ואת קוטאיסי, עד סמטרדיה. שם עברו לכביש S12 לכיוון לנצ'חותי,
    ואחרי לנצ'חותי המשיכו בדרכים מקומיות ובכביש Sh2 עד אוזורגתי — כ-50 ק״מ מסמטרדיה. המוזיאון במרכז העיר,
    דקה־שתיים הליכה מתיאטרון הדרמה; חנו ברחובות הסמוכים. תדלקו בחשורי, בזסטפוני, בסמטרדיה או באוזורגתי
    עצמה. רכב מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: متحف أوزورجيتي التاريخي
  short: >-
    متحف التاريخ الرئيسي في غوريا: أكثر من 6000 قطعة من الألفية التاسعة قبل الميلاد حتى اليوم — برونزيات
    كولخيسية، وخنجر «قاما» لثائر، وسيف رابير فرنسي يلفّه لغز.
  body: >-
    **من بين ستة آلاف قطعة في متحف أوزورجيتي، ثمة نصلان يقولان عن غوريا أكثر من سواهما: خنجر «قاما» لأحد
    الثوار، وسيف رابير فرنسي لم يروِ أحدٌ قصته كاملة بعد.**


    جاءت المحاولة الأولى في أبريل 1924، حين أسس اللغوي أكاكي شانيدزه متحفًا إثنوغرافيًا في أوزورجيتي لا
    يُعرف مصيره اللاحق. أما المؤسسة الحالية فأُنشئت في 1 أبريل 1936: إذ سلّمتها جمعيةٌ لقدامى الحرس الأحمر
    والمقاتلين الأنصار مئتي قطعة — بنادق صوانية ومسدسات وخناجر وسيوفًا — فحظيت المدينة، التي كانت تُسمّى
    آنذاك ماخارادزه، بمتحف للتاريخ المحلي. قُتل مديره الأول، نيكولوز سامسونيا، في الحرب العالمية الثانية.
    ومن 1974 إلى 1991 شغلت المجموعة قصر آل غورييلي السابق، ثم انتقلت عام 1991 إلى مبنى شُيّد بين 1978
    و1981 ليكون متحفًا للجيش السوفييتي الثامن عشر.


    تمتد المعروضات من الألفية التاسعة قبل الميلاد حتى الحاضر: لُقى من العصر الحجري الحديث، وفؤوس كولخيسية
    وتماثيل برونزية صغيرة من العصر البرونزي، وذهب وفضة من مطلع العصر الكلاسيكي، وجزء من كنز أوريكي. وتبدأ
    المسكوكات بالفضة الكولخيسية من القرون السادس إلى الثالث قبل الميلاد وبقطعة ذهبية للإسكندر الأكبر،
    وتتواصل مع نقود عهود تامار وروسودان وإريكلي الثاني. ويحمل نقشٌ بخط الأسومتافرولي من كنيسة إيكاديا
    اسمَ كاخابر الأول غورييلي، مؤسس البيت الأميري.


    ثم النصلان. كان الخنجر ملكًا لأمباكو شاليكاشفيلي، قائد انتفاضة غوريا عام 1841 على الحكم الروسي: طوله
    60 سنتيمترًا، ومقبضه أسود مطعّم بالعظم، ودخل مجموعة المدينة عام 1925، قبل تأسيس المتحف الحالي؛ ويُحفظ
    هنا أيضًا بوق حربي من الانتفاضة نفسها. أما الآخر فسيف رابير فرنسي. يربطه مصدر جورجي بآل مورات، ومصدر
    إنجليزي بنابليون بونابرت نفسه. كيف وصل إلى غوريا؟ لا يذكر ذلك أي مصدر منشور — فاسأل أمناء المتحف.


    لطالما كانت غوريا سريعة إلى حمل السلاح. وهنا، أخيرًا، يستريح السلاح.
  tip: >-
    بحسب المعلومات المنشورة، يفتح المتحف يوميًا من 10:00 إلى 18:00 والدخول مجاني، لكن أحد كتّاب الرحلات
    على الأقل وجد أبوابه مغلقة مرارًا، لذا اتصل مسبقًا (الرقم مدرج لدى رابطة المتاحف الجورجية) ولا تبنِ
    يومك كله حول الزيارة. وإن وجدت الأبواب مغلقة، فدير شيموكميدي خارج المدينة مباشرةً يبرّر الرحلة مع
    ذلك. تحمل الواجهة السوفييتية نقشًا بارزًا جريئًا يستحق صورة. ومسرح الدراما على بُعد دقيقتين سيرًا.
    وللمتحف فروع أيضًا: متحف إثنوغرافي في دفابزو، ومتحف تذكاري في غوريانتا، ومتحف إكفتيمه تاكايشفيلي في
    ليخاوري، مسقط رأس عالم الآثار الكبير.
  route: >-
    تقع أوزورجيتي على بعد 300 كم من تبليسي، أي نحو 4 ساعات و50 دقيقة، والطريق معبّد بالكامل. اتبع الطريق
    E60 (S1) غربًا مرورًا بخاشوري، ثم عبر مقطع ريكوتي، ومرورًا بزستافوني وكوتايسي حتى سامتريديا. هناك
    انتقل إلى الطريق S12 باتجاه لانتشخوتي، وبعد لانتشخوتي اتبع الطرق المحلية والطريق Sh2 إلى أوزورجيتي
    — نحو 50 كم من سامتريديا. يقع المتحف في وسط المدينة، على بعد دقيقتين سيرًا من مسرح الدراما؛ اركن سيارتك
    في الشوارع المجاورة. تزوّد بالوقود في خاشوري أو زستافوني أو سامتريديا أو في أوزورجيتي نفسها. سيارة
    اقتصادية تفي بالغرض تمامًا.
