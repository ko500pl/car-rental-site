ka:
  name: ფოთის შუქურა
  short: >-
    1862 წელს ლონდონში ჩამოსხმული თუჯის შუქურა რიონის შესართავთან — 160 რკინის საფეხური, პატარა მუზეუმი
    და დღემდე მოქმედი შუქი.
  body: >-
    **ფოთის შუქურა ნაწილ-ნაწილ ჩამოვიდა: თუჯის ფილები ლონდონში 1862 წელს ჩამოასხეს, ზღვით გამოგზავნეს
    და რიონის შესართავთან ჭანჭიკებით შეაერთეს — ერთი შედუღების გარეშე.**


    შუქურა ლონდონურმა ფირმამ „ისტონ, ეიმოს ენდ სანზ“ დაამზადა, ადგილზე კი ბრიტანელმა ინჟინრებმა ააწყვეს.
    შუქი 1864 წლის 1 ნოემბერს აინთო და მას შემდეგ ფოთის პორტს ემსახურება. სიმაღლე 36,6 მეტრია, წონა —
    126 ტონა, შიგნით 160 რკინის საფეხურიანი ხვეული კიბე ადის. ეს იყო საქართველოში ამ ტიპის პირველი სანავიგაციო
    ნაგებობა; მისი მეპატრონე, საზღვაო ტრანსპორტის სააგენტო, მას ქვეყნის შავიზღვისპირეთის უძველეს და უმაღლეს
    შუქურად მოიხსენიებს. ოდესღაც ფითილიანი ლამპა და ფრენელის ლინზა ანათებდა, დღეს ელექტროობაზე მუშაობს
    და 17 საზღვაო მილიდან ჩანს.


    თავდაპირველად შუქურა თეთრად იყო შეღებილი; მოგვიანებით, სანავიგაციო წესების მიხედვით, წითელ-თეთრი ზოლები
    მიიღო და ყოველ ოთხ წელიწადში ხელახლა იღებება. ქვედა ორ სართულზე პატარა მუზეუმია — საარქივო ფოტოები,
    ძველი სასიგნალო ნათურები, სანავიგაციო ხელსაწყოები. ხვეული კიბე ღია ბაქანზე ამოგიყვანთ, საიდანაც რიონის
    შესართავი და ნავსადგური მოჩანს.


    შუქურას ორი ამბავი ახლავს. ადგილობრივი გადმოცემით, რომელსაც თავად სააგენტოც იმეორებს, ინგლისელი მუშები
    შესვენებისას ბურთს აგორებდნენ, ფოთელები კი ცნობისმოყვარეობით უყურებდნენ — ასე რომ, საქართველოს მიწაზე
    პირველი ფეხბურთი თითქოს სწორედ აქ ითამაშეს. მეორეც სააგენტოს მოჰყავს: 1942 წელს მეშუქურე ივანიძემ
    ზედა აივნიდან ნაპირისკენ მომავალი უცნობი შავი ხომალდი შენიშნა და ავიაციას აცნობა, რომელმაც ის დაბომბა.
    დამოუკიდებლად არც ერთი ამბავი არ დასტურდება.


    160 წელზე მეტია, ჭანჭიკებით შეკრული კოშკი იმავე საქმეს აკეთებს, რისთვისაც ზღვით ჩამოიტანეს: ყოველ
    საღამოს შუქი ინთება.
  tip: >-
    შესვლა უფასოა; ღიაა ყოველდღე 9:00-დან 18:00-მდე, თუმცა შუქურა მოქმედი სანავიგაციო ობიექტია და საათები
    შეიძლება შეიცვალოს. მისამართი: დემეტრე თავდადებულის ქ. 93, ჰიდროგრაფიული სამსახურის ეზო. 160 საფეხური
    ვიწრო და ხვეულია — სიმაღლის შიშის მქონეთ გაუჭირდებათ, ბავშვებს ხელი ჩაჰკიდეთ. ეზოში დროდადრო ფილმების
    ჩვენებას, სპექტაკლებსა და გამოფენებს მართავენ. მანქანა ქალაქის ცენტრში დატოვეთ და ფეხით მიდით. იქვე
    ნახეთ ფოთის ტაძარი — 1906–1907 წლებში აია-სოფიის მიხედვით აგებული ნეობიზანტიური ნაგებობა; კოლხეთის
    ეროვნული პარკიც ოთხიოდე კილომეტრშია.
  route: >-
    თბილისიდან შუქურამდე დაახლოებით 319 კილომეტრი და ოთხი საათი და სამი მეოთხედია. ს1 (E60) მაგისტრალით
    დასავლეთით, რიკოთის უღელტეხილისა და ქუთაისის გავლით, სამტრედიამდე იარეთ; იქიდან ს12-ით, ლანჩხუთის
    გავლით, ზღვისკენ, ბოლოს კი ს2-ით ჩრდილოეთით, დაახლოებით 12 კილომეტრი, ფოთამდე. თანაბრად კარგი ვარიანტია
    ს1-ით სენაკამდე და იქიდან ს2-ით პირდაპირ ფოთში. ქალაქში დემეტრე თავდადებულის ქუჩას ნავსადგურისკენ
    მიჰყევით. მთელი გზა ასფალტია, ბენზინგასამართი სადგურები ყველგანაა — ეკონომ-კლასის მანქანა სავსებით
    საკმარისია.
en:
  name: Poti Lighthouse
  short: >-
    A cast-iron tower made in London in 1862 and lit in 1864 at the mouth of the Rioni — 160 iron steps,
    a small museum, and a light that still works.
  body: >-
    **Poti's lighthouse arrived as a kit: cast-iron plates made in London in 1862, shipped out by sea
    and bolted together at the mouth of the Rioni without a single weld.**


    The London firm of Easton, Amos & Sons made it, and British engineers assembled it on site. The light
    first shone on 1 November 1864 and has served the port of Poti ever since. The tower is 36.6 metres
    tall and weighs 126 tonnes, with a spiral staircase of 160 iron steps inside. It was the first navigational
    facility of its kind in Georgia, and its operator, the Maritime Transport Agency, calls it the oldest
    and tallest lighthouse on the country's Black Sea coast. A wick lamp and Fresnel lens once lit it;
    today it runs on electricity and can be seen 17 nautical miles out.


    It was whitewashed at first, then given its red-and-white bands to meet navigation standards, and
    is repainted every four years. The two lower floors hold a small museum of archival photographs, old
    beacons and navigational instruments. The iron spiral climbs to an open deck looking over the mouth
    of the Rioni and the harbour.


    Two stories come with it. Local tradition, repeated by the Agency itself, says the English workers
    kicked a ball about during their breaks while curious Poti residents watched — the first football
    ever played on Georgian soil, if the tale is true. The second also comes from the Agency: in 1942
    the keeper, Ivanidze, spotted an unknown dark vessel approaching from the top balcony and alerted
    the air force, which bombed it. Neither story has been independently confirmed.


    After more than 160 years, the bolted tower still does the job it was shipped here for: every evening,
    the light comes on.
  tip: >-
    Entry is free; it opens daily from 9am to 6pm, but this is a working aid to navigation, so hours can
    change. The address is 93 Demetre Tavdadebuli Street, inside the State Hydrographic Service compound.
    The 160 steps are narrow and tightly spiralled — hard going if you dislike heights, and keep hold
    of children. The courtyard occasionally hosts film screenings, theatre and exhibitions. Park in the
    centre and walk. Nearby, see Poti Cathedral, a neo-Byzantine church of 1906–07 modelled on Hagia Sophia;
    Kolkheti National Park is about 4 km away.
  route: >-
    The lighthouse is about 319 km and four and three-quarter hours from Tbilisi. Take the S1 (E60) west
    over the Rikoti Pass and past Kutaisi to Samtredia, then the S12 through Lanchkhuti towards the coast,
    and finally the S2 north for about 12 km into Poti. Equally good: stay on the S1 to Senaki and take
    the S2 straight into town. In Poti, follow Demetre Tavdadebuli Street towards the harbour. It is asphalt
    all the way with fuel stations everywhere — an economy car is all you need.
ru:
  name: Потийский маяк
  short: >-
    Чугунная башня, отлитая в Лондоне в 1862 году и зажжённая в 1864-м в устье Риони: 160 железных ступеней,
    маленький музей и огонь, который горит до сих пор.
  body: >-
    **Потийский маяк прибыл сюда в разобранном виде: чугунные плиты, отлитые в Лондоне в 1862 году, доставили
    морем и собрали в устье Риони на болтах — без единого сварного шва.**


    Его изготовила лондонская фирма «Истон, Эймос и сыновья», а собирали на месте британские инженеры.
    Огонь впервые загорелся 1 ноября 1864 года и с тех пор служит порту Поти. Высота башни — 36,6 метра,
    вес — 126 тонн, внутри — винтовая лестница из 160 железных ступеней. Это было первое навигационное
    сооружение такого рода в Грузии, а его оператор, Агентство морского транспорта, называет маяк самым
    старым и самым высоким на черноморском побережье страны. Когда-то свет давали фитильная лампа и линза
    Френеля; сегодня маяк работает на электричестве, и его видно за 17 морских миль.


    Сначала башню белили, потом, по требованиям навигационных стандартов, выкрасили красно-белыми полосами;
    перекрашивают её раз в четыре года. На двух нижних этажах — небольшой музей: архивные фотографии,
    старые сигнальные огни и навигационные приборы. Железная спираль поднимается к открытой площадке с
    видом на устье Риони и гавань.


    С маяком связаны две истории. Местное предание, которое повторяет и само Агентство, гласит, что английские
    рабочие в перерывах гоняли мяч, а любопытные жители Поти смотрели на них, — если это правда, то был
    первый футбол на грузинской земле. Вторую тоже рассказывает Агентство: в 1942 году смотритель Иванидзе
    заметил с верхнего балкона приближающееся неизвестное тёмное судно и поднял по тревоге авиацию, которая
    его разбомбила. Ни одна из историй независимо не подтверждена.


    Спустя больше 160 лет башня на болтах по-прежнему делает то, ради чего её везли морем: каждый вечер
    на ней зажигается свет.
  tip: >-
    Вход бесплатный; маяк открыт ежедневно с 9:00 до 18:00, но это действующее средство навигации, так
    что часы могут меняться. Адрес — улица Деметре Тавдадебули, 93, на территории Государственной гидрографической
    службы. 160 ступеней узкие, а спираль крутая — тяжело тем, кто боится высоты; детей держите за руку.
    Во дворе иногда устраивают кинопоказы, спектакли и выставки. Машину оставьте в центре и пройдитесь
    пешком. Рядом — Потийский собор, неовизантийский храм 1906–1907 годов, построенный по образцу Святой
    Софии; до Колхетского национального парка около 4 км.
  route: >-
    От Тбилиси до маяка около 319 км, или примерно 4 часа 45 минут пути. Поезжайте по S1 (E60) на запад
    через Рикотский перевал и мимо Кутаиси до Самтредиа, затем по S12 через Ланчхути к побережью и, наконец,
    по S2 на север около 12 км до Поти. Не хуже и другой вариант: оставайтесь на S1 до Сенаки и оттуда
    по S2 прямо в город. В Поти держитесь улицы Деметре Тавдадебули в сторону порта. Асфальт на всём пути,
    заправки повсюду — хватит машины эконом-класса.
fa:
  name: فانوس دریایی پوتی
  short: >-
    برجی از چدن که در ۱۸۶۲ در لندن ساخته شد و در ۱۸۶۴ در دهانهٔ ریونی روشن شد — ۱۶۰ پلهٔ آهنی، موزه‌ای
    کوچک و چراغی که هنوز کار می‌کند.
  body: >-
    **فانوس دریایی پوتی به صورت قطعات پیش‌ساخته رسید: صفحه‌های چدنی که در ۱۸۶۲ در لندن ساخته شدند، از
    راه دریا آمدند و در دهانهٔ ریونی بی‌آنکه حتی یک جوش بخورند، با پیچ و مهره به هم بسته شدند.**


    شرکت لندنی «ایستون، ایموس و پسران» آن را ساخت و مهندسان بریتانیایی در همین‌جا سرهمش کردند. چراغش نخستین
    بار در ۱ نوامبر ۱۸۶۴ روشن شد و از آن زمان به بندر پوتی خدمت کرده است. بلندی برج ۳۶٫۶ متر و وزنش ۱۲۶
    تن است و درونش پلکانی مارپیچ با ۱۶۰ پلهٔ آهنی دارد. این نخستین تأسیسات ناوبری از این دست در گرجستان
    بود، و گردانندهٔ آن، آژانس حمل‌ونقل دریایی، آن را کهن‌ترین و بلندترین فانوس دریایی کرانهٔ دریای سیاهِ
    کشور می‌خواند. روزگاری چراغی فتیله‌دار و عدسی فرنل روشنش می‌کردند؛ امروز با برق کار می‌کند و از ۱۷
    مایل دریایی دورتر دیده می‌شود.


    در آغاز سفیدش کرده بودند، سپس برای هماهنگی با استانداردهای ناوبری نوارهای سرخ و سفید گرفت، و هر چهار
    سال یک بار از نو رنگ می‌شود. دو طبقهٔ پایین موزه‌ای کوچک از عکس‌های آرشیوی، چراغ‌های راهنمای قدیمی
    و ابزارهای ناوبری را در خود جا داده‌اند. مارپیچ آهنی تا سکویی روباز بالا می‌رود که از آن دهانهٔ ریونی
    و بندر پیداست.


    دو داستان همراه این برج است. روایت محلی، که خود آژانس هم بازگویش می‌کند، می‌گوید کارگران انگلیسی در
    وقت استراحت توپ بازی می‌کردند و اهالی کنجکاو پوتی تماشایشان می‌کردند — اگر داستان راست باشد، این نخستین
    فوتبالی بود که بر خاک گرجستان بازی شد. داستان دوم را هم آژانس نقل می‌کند: در ۱۹۴۲ نگهبان فانوس، ایوانیدزه،
    از بالکن بالایی کشتی تیره و ناشناسی را دید که نزدیک می‌شد و نیروی هوایی را خبر کرد و کشتی بمباران
    شد. هیچ‌یک از این دو داستان به‌طور مستقل تأیید نشده است.


    پس از بیش از ۱۶۰ سال، برجِ پیچ‌ومهره‌ای هنوز همان کاری را می‌کند که برایش به اینجا آورده شد: هر شامگاه،
    چراغ روشن می‌شود.
  tip: >-
    ورود رایگان است؛ فانوس هر روز از ساعت ۹ تا ۱۸ باز است، اما چون ابزار ناوبری فعالی است، ساعت‌ها ممکن
    است تغییر کنند. نشانی: خیابان دمتره تاودادبولی، شمارهٔ ۹۳، در محوطهٔ سازمان دولتی آب‌نگاری. ۱۶۰ پله
    باریک‌اند و مارپیچ تند است — برای کسی که از ارتفاع می‌هراسد دشوار است، و دست کودکان را رها نکنید.
    در حیاط گاهی نمایش فیلم، تئاتر و نمایشگاه برپا می‌شود. خودرو را در مرکز شهر پارک کنید و پیاده بروید.
    در همان نزدیکی کلیسای جامع پوتی را ببینید، کلیسایی نوبیزانسی از ۱۹۰۶–۱۹۰۷ که به الگوی ایاصوفیه ساخته
    شده؛ پارک ملی کولخِتی حدود ۴ کیلومتر دورتر است.
  route: >-
    فانوس حدود ۳۱۹ کیلومتر و چهار ساعت و سه‌ربع از تفلیس فاصله دارد. از S1 (E60) رو به غرب، از گردنهٔ
    ریکوتی و کنار کوتائیسی تا سامتردیا بروید، سپس با S12 از لانچخوتی به سوی ساحل برانید و سرانجام حدود
    ۱۲ کیلومتر با S2 رو به شمال تا پوتی. راه دیگر هم به همان خوبی است: تا سناکی روی S1 بمانید و از آنجا
    با S2 یکراست وارد شهر شوید. در پوتی خیابان دمتره تاودادبولی را به سوی بندر دنبال کنید. سراسر راه آسفالت
    است و جایگاه سوخت همه‌جا هست — خودروی کلاس اقتصادی تمام آن چیزی است که لازم دارید.
he:
  name: המגדלור של פוטי
  short: >-
    מגדל מברזל יצוק שיוצר בלונדון ב-1862 והודלק ב-1864 בשפך הריוני — 160 מדרגות ברזל, מוזיאון קטן ואור
    שעדיין פועל.
  body: >-
    **המגדלור של פוטי הגיע כערכת הרכבה: לוחות ברזל יצוק שיוצרו בלונדון ב-1862, נשלחו בדרך הים והוברגו
    זה לזה בשפך הריוני בלי ריתוך אחד.**


    החברה הלונדונית 'איסטון, איימוס ובניו' ייצרה אותו, ומהנדסים בריטים הרכיבו אותו במקום. האור דלק לראשונה
    ב-1 בנובמבר 1864, ומאז הוא משרת את נמל פוטי. גובה המגדל 36.6 מטר ומשקלו 126 טון, ובתוכו גרם מדרגות
    לולייני של 160 מדרגות ברזל. זה היה מתקן הניווט הראשון מסוגו בגאורגיה, והמפעילה שלו, סוכנות התחבורה
    הימית, מכנה אותו המגדלור העתיק והגבוה ביותר בחוף הים השחור של המדינה. פעם האירו אותו מנורת פתילה ועדשת
    פרנל; כיום הוא פועל בחשמל ונראה ממרחק 17 מיילים ימיים.


    בתחילה הוא סויד בלבן, אחר כך קיבל את הפסים האדומים-לבנים כדי לעמוד בתקני הניווט, והוא נצבע מחדש כל
    ארבע שנים. בשתי הקומות התחתונות שוכן מוזיאון קטן של צילומי ארכיון, פנסי אותות ישנים ומכשירי ניווט.
    גרם המדרגות הלולייני מטפס אל מרפסת תצפית פתוחה הצופה על שפך הריוני ועל הנמל.


    שני סיפורים קשורים במגדלור. לפי המסורת המקומית, שהסוכנות עצמה חוזרת עליה, הפועלים האנגלים בעטו בכדור
    בהפסקות בזמן שתושבי פוטי הסקרנים צפו בהם — אם הסיפור נכון, היה זה משחק הכדורגל הראשון על אדמת גאורגיה.
    גם את השני מספרת הסוכנות: ב-1942 הבחין שומר המגדלור, איוואנידזה, מן המרפסת העליונה בכלי שיט כהה ובלתי
    מזוהה המתקרב, והזעיק את חיל האוויר, שהפציץ אותו. אף אחד משני הסיפורים לא אומת באופן עצמאי.


    אחרי יותר מ-160 שנה, המגדל המוברג עדיין עושה את העבודה שבשבילה נשלח לכאן: בכל ערב האור נדלק.
  tip: >-
    הכניסה חופשית; המגדלור פתוח מדי יום מ-9:00 עד 18:00, אבל זהו עזר ניווט פעיל, ולכן השעות עשויות להשתנות.
    הכתובת: רחוב דמטרה תבדדבולי 93, בתוך מתחם השירות ההידרוגרפי הממלכתי. 160 המדרגות הלולייניות צרות ותלולות
    — קשה למי שאינו אוהב גבהים, והחזיקו היטב את הילדים. בחצר מתקיימות לעיתים הקרנות סרטים, הצגות ותערוכות.
    החנו במרכז והמשיכו ברגל. בסביבה כדאי לראות את קתדרלת פוטי, כנסייה ניאו-ביזנטית מ-1906–1907 שנבנתה
    בדגם איה סופיה; הפארק הלאומי קולחתי נמצא במרחק של כ-4 ק״מ.
  route: >-
    המגדלור נמצא כ-319 ק״מ מטביליסי, כארבע שעות ושלושה רבעים של נסיעה. סעו בכביש S1 (E60) מערבה דרך מעבר
    ריקוטי ועל פני קוטאיסי עד סמטרדיה, ומשם בכביש S12 דרך לנצ'חוטי לכיוון החוף, ולבסוף בכביש S2 צפונה
    כ-12 ק״מ אל פוטי. טובה באותה מידה: הישארו ב-S1 עד סנאקי והמשיכו ב-S2 ישר העירה. בפוטי עקבו אחר רחוב
    דמטרה תבדדבולי לכיוון הנמל. אספלט לכל אורך הדרך ותחנות דלק בכל מקום — רכב מקטגוריית אקונומי הוא כל
    מה שצריך.
ar:
  name: منارة بوتي
  short: >-
    برج من الحديد الزهر صُنع في لندن عام 1862 وأُضيء عام 1864 عند مصب ريوني — 160 درجة حديدية ومتحف صغير
    وضوء ما زال يعمل.
  body: >-
    **وصلت منارة بوتي قطعاً جاهزة للتركيب: ألواح من الحديد الزهر صُنعت في لندن عام 1862، وشُحنت بحراً،
    ثم رُبطت بالبراغي عند مصب ريوني دون لحام واحد.**


    صنعتها شركة «إيستون وأموس وأبناؤهما» اللندنية، وركّبها مهندسون بريطانيون في الموقع. أضاء نورها أول
    مرة في 1 نوفمبر 1864، ولا يزال يخدم ميناء بوتي منذ ذلك الحين. يبلغ ارتفاع البرج 36.6 متراً ووزنه 126
    طناً، وفي داخله درج حلزوني من 160 درجة حديدية. كانت أول منشأة ملاحية من نوعها في جورجيا، وتصفها الجهة
    المشغّلة لها، وكالة النقل البحري، بأنها أقدم منارة وأعلاها على ساحل البحر الأسود في البلاد. كان يضيئها
    قديماً مصباح بفتيل وعدسة فرينل؛ أما اليوم فتعمل بالكهرباء ويُرى ضوؤها من مسافة 17 ميلاً بحرياً.


    طُليت في البداية بالأبيض، ثم أُعطيت أشرطتها الحمراء والبيضاء التزاماً بمعايير الملاحة، ويُعاد طلاؤها
    كل أربع سنوات. ويضم الطابقان السفليان متحفاً صغيراً فيه صور أرشيفية ومصابيح إشارة قديمة وأدوات ملاحية.
    ويصعد اللولب الحديدي إلى شرفة مكشوفة تطل على مصب ريوني والميناء.


    وترافقها حكايتان. تقول الرواية المحلية، التي تكررها الوكالة نفسها، إن العمال الإنجليز كانوا يركلون
    الكرة في استراحاتهم بينما يتفرج عليهم أهل بوتي الفضوليون — فإن صحّت الحكاية، كانت تلك أول مباراة كرة
    قدم على أرض جورجيا. والثانية ترويها الوكالة أيضاً: في عام 1942 لمح حارس المنارة، إيفانيدزه، من الشرفة
    العليا سفينة داكنة مجهولة تقترب، فأبلغ سلاح الجو الذي قصفها. ولم تؤكَّد أيّ من الحكايتين من مصدر مستقل.


    بعد أكثر من 160 عاماً، ما زال البرج المثبّت بالبراغي يؤدي العمل الذي شُحن إلى هنا من أجله: كل مساء،
    يُضاء النور.
  tip: >-
    الدخول مجاني؛ والمنارة مفتوحة يومياً من 9 صباحاً إلى 6 مساءً، لكنها وسيلة ملاحة عاملة، لذا قد تتغير
    المواعيد. العنوان: شارع ديميتري تافدادبولي رقم 93، داخل مجمّع الخدمة الهيدروغرافية الحكومية. الدرجات
    الـ160 ضيقة واللولب ضيق الانعطاف — صعب على من يهاب المرتفعات، وأمسك بأيدي الأطفال. يستضيف الفناء أحياناً
    عروضاً سينمائية ومسرحية ومعارض. اركن سيارتك في وسط المدينة وامشِ. وبالقرب منها كاتدرائية بوتي، كنيسة
    بيزنطية جديدة الطراز من 1906–1907 بُنيت على نمط آيا صوفيا؛ وحديقة كولخيتي الوطنية على بعد نحو 4 كم.
  route: >-
    تبعد المنارة عن تبليسي نحو 319 كم وأربع ساعات وثلاثة أرباع الساعة. اسلك الطريق S1 (E60) غرباً عبر
    ممر ريكوتي مروراً بكوتايسي حتى سامترديا، ثم الطريق S12 عبر لانتشخوتي نحو الساحل، وأخيراً الطريق S2
    شمالاً نحو 12 كم حتى بوتي. والبديل جيد بالقدر نفسه: ابقَ على S1 حتى سيناكي ثم خذ S2 مباشرة إلى المدينة.
    في بوتي اتبع شارع ديميتري تافدادبولي باتجاه الميناء. الطريق إسفلتي بالكامل ومحطات الوقود في كل مكان
    — سيارة من الفئة الاقتصادية هي كل ما تحتاجه.
