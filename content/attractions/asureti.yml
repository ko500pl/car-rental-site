ka:
  name: ასურეთი
  short: >-
    1818 წელს დაარსებული შვაბური კოლონია ელიზაბეტთალი: კრამიტიანი ფრონტონები, ღრმა მარნები, 1871 წლის
    ლუთერანული ეკლესია და ტყეში ნაპოვნი ვაზი.
  body: >-
    **თბილისიდან ერთ საათზე ნაკლებ გზაზე არის ქართული სოფელი, სადაც ერთ-ერთ ქუჩას Schwabenstraße ჰქვია,
    აბრები კი ქართულად და გერმანულადაა.**


    ასურეთი ძველი ქართული სოფელია, რომელიც XVIII საუკუნეში მტრის შემოსევებმა დააცარიელა. 1818 წლის 19
    ნოემბერს აქ ვიურტემბერგიდან წამოსულმა 72 შვაბურმა ოჯახმა — რელიგიურ დევნას გამოქცეულმა პროტესტანტებმა,
    რომლებიც ალექსანდრე I-მა მოიწვია, — კოლონია დააარსა და ელიზაბეტთალი უწოდა. ნატურალისტმა ფრიდრიხ პაროტმა,
    რომელმაც 1829 წელს გაიარა აქაურობა, მაშინვე მიხვდა, რომ კოლონიები გერმანული იყო — სახლებით, ყანებით,
    ურმებითა და ჩაცმულობით.


    დღესაც ადვილად მიხვდებით, რას გულისხმობდა. გრძელ, სწორ მთავარ ქუჩაზე ორსართულიანი სახლები დგას კრამიტიანი
    ფრონტონებით, ხის აივნებითა და ღვინისთვის ნაგები ღრმა ქვის მარნებით; ბევრს კარის თავზე აშენების წელი
    აქვს ამოკვეთილი. დგას 1871 წელს არქიტექტორ ალბერტ ზალცმანის პროექტით აშენებული ლუთერანული ეკლესიაც:
    1930 წელს ის დახურეს, 2000 წლიდან კი ეტაპობრივად აღადგენენ. მის გვერდით კოლონისტების სასაფლაოა. გერმანული
    სახელი ქუჩამ 2017 წელს, დაარსებიდან ორი საუკუნის შემდეგ, მიიღო — მანამდე ის სტალინის ქუჩა იყო.


    კოლონიის მეორე მემკვიდრეობა ღვინოა. ქართველი ამპელოგრაფების ცნობით, ასურეთის ტყეში, გარეულ ვაზებს
    შორის, ერთი ჯიში კოლონისტმა შალმა იპოვა; ის სწრაფად გავრცელდა ქვემო ქართლში „შალის ყურძნის“ სახელით,
    აკადემიკოსმა სოლომონ ჩოლოყაშვილმა კი მას „ასურეთული შავი“ დაარქვა. ზოგი ფიქრობს, რომ ეს ძველი ქართული
    ჯიშია, სოფლის დაცარიელების შემდეგ გაველურებული. 1930-იან წლებში აქაური კოლმეურნეობა „კონკორდია“ მევენახეობით
    იყო ცნობილი.


    დასასრული 1941 წლის ოქტომბერში დადგა: ასურეთის გერმანელები ციმბირსა და ყაზახეთში გადაასახლეს, მათ
    სახლებში კი ამბროლაურისა და ონის რაიონებიდან ჩამოყვანილი ოჯახები შესახლდნენ. ქუჩა ნელა გაიარეთ: ზოგი
    სახლი აღდგენილია, ზოგი ინგრევა, და მათ შორის სახლ-სახლ იკითხება, როგორ დასრულდა ერთ შემოდგომაში საუკუნეზე
    მეტი გერმანული ცხოვრება.
  tip: >-
    ორი საათი საკმარისია მთავარი ქუჩის, ეკლესიის, სასაფლაოსა და — თუ წინასწარ შეთანხმდებით — მარნისთვის.
    ქუჩა ვაკეზე გადის და ხანდაზმულებისთვისაც მოსახერხებელია. სახლების უმეტესობა კერძოა: ჭიშკრიდან დაათვალიერეთ
    და ეზოში შესვლამდე ნებართვა იკითხეთ. ეკლესია ყოველთვის ღია არ არის. სოფელში საჭმლის არჩევანი მწირია,
    ამიტომ თბილისში ისადილეთ ან საგზალი წამოიღეთ. თუ ღვინის დაგემოვნებას აპირებთ, წინასწარ გადაწყვიტეთ,
    ვინ დაჯდება საჭესთან. საუკეთესო დროა გაზაფხულის ყვავილობა და ოქტომბრის რთველი.
  route: >-
    თბილისიდან S6-ით სამხრეთით, მარნეულის მიმართულებით წადით. დაახლოებით 28 კილომეტრის შემდეგ დასავლეთით,
    Sh31-ზე — კოდა–მანგლისის გზაზე — გადაუხვიეთ და კოდა გაიარეთ; ასურეთი დაახლოებით ათ კილომეტრში, გზიდან
    ოდნავ მოშორებით, მაჩვენებლიანი გადასახვევით მდებარეობს. სულ დაახლოებით 38 კილომეტრი და 45–50 წუთი
    — ეს დედაქალაქიდან ერთ-ერთი ყველაზე მარტივი გასვლაა. გზა ბოლომდე ასფალტია, სოფელთან ვიწროვდება; ეკონომ-კლასის
    მანქანა ნებისმიერ სეზონზე საკმარისია. საწვავი S6-ზე ან თბილისში ჩაასხით. მანქანა მთავარ ქუჩაზე ან
    ეკლესიასთან გააჩერეთ.
en:
  name: Asureti
  short: >-
    The Swabian colony of Elisabethtal, founded in 1818: tiled gables, deep wine cellars, a Lutheran church
    of 1871 and a grape first found in the woods.
  body: >-
    **Less than an hour from Tbilisi is a Georgian village with a street called Schwabenstraße and signs
    in both German and Georgian.**


    Asureti is an old Georgian village emptied by invasions in the 18th century. On 19 November 1818 seventy-two
    Swabian families from Württemberg, Protestants fleeing religious persecution at the invitation of
    Tsar Alexander I, founded a colony here and named it Elisabethtal. When the naturalist Friedrich Parrot
    passed through in 1829, he knew the colonies for German at a glance: by their houses, their fields,
    their carts and their dress.


    You can still see what he meant. Along the long, straight main street stand two-storey houses with
    tiled gables, wooden balconies and deep stone cellars built for wine, many with the year of building
    carved over the door. The Lutheran church of 1871, designed by Albert Salzmann, still stands; deconsecrated
    in 1930, it has been restored step by step since 2000, and beside it lies the colonists' cemetery.
    The street took its German name in 2017, two centuries after the founding; until then it had been
    Stalin Street.


    Wine is the colony's other legacy. According to Georgian ampelographers, a colonist named Schal found
    a vine growing wild in the Asureti woods; it spread through Kvemo Kartli as "Schal's grape", and the
    academician Solomon Cholokashvili later named it Asuretuli Shavi. Some believe it is an old Georgian
    variety that ran wild after the village emptied. In the 1930s the local collective farm, Concordia,
    was known for its viticulture.


    The end came in October 1941, when the Germans of Asureti were deported to Siberia and Kazakhstan
    and families from Ambrolauri and Oni were moved into their homes. Walk the street slowly: some houses
    are restored, others are crumbling, and between them you can read, house by house, how more than a
    century of German life ended in a single autumn.
  tip: >-
    Two hours covers the main street, the church, the cemetery and, if you arrange it ahead, a wine cellar.
    The street is level and easy on older legs. Most houses are private homes: look from the gate and
    ask before stepping into a yard. The church is not always open. Food options in the village are thin,
    so eat in Tbilisi or bring a picnic. If you plan to taste wine, settle beforehand who is driving.
    Spring blossom and the October harvest are the best times to come.
  route: >-
    Leave Tbilisi south on the S6 towards Marneuli. After about 28 km turn west onto the Sh31, the Koda–Manglisi
    road, and drive through Koda; Asureti lies a little off the road some ten kilometres on, with a signed
    turn. It is about 38 km and 45 to 50 minutes, one of the easiest outings from the capital. The road
    is asphalt all the way, narrowing towards the village, and an economy car is all you need in any season.
    Refuel on the S6 or in Tbilisi. Park on the main street or by the church.
ru:
  name: Асурети
  short: >-
    Швабская колония Елизаветталь, основанная в 1818 году: черепичные фронтоны, глубокие винные погреба,
    лютеранская кирха 1871 года и лоза, найденная в лесу.
  body: >-
    **Меньше чем в часе езды от Тбилиси есть грузинское село с улицей Швабенштрассе и табличками на немецком
    и грузинском.**


    Асурети — старое грузинское село, опустевшее после нашествий XVIII века. 19 ноября 1818 года семьдесят
    две швабские семьи из Вюртемберга — протестанты, спасавшиеся от религиозных гонений, — по приглашению
    императора Александра I основали здесь колонию и назвали её Елизаветталь. Когда в 1829 году здесь
    проезжал естествоиспытатель Фридрих Паррот, он с первого взгляда узнавал немецкие колонии — по домам,
    полям, повозкам и одежде.


    Вы и сейчас поймёте, что он имел в виду. Вдоль длинной прямой главной улицы стоят двухэтажные дома
    с черепичными фронтонами, деревянными балконами и глубокими каменными погребами для вина, на многих
    над дверью вырезан год постройки. Лютеранская кирха 1871 года, построенная по проекту Альберта Зальцмана,
    по-прежнему на месте: в 1930 году её закрыли, а с 2000 года постепенно восстанавливают. Рядом с ней
    — кладбище колонистов. Немецкое название улица получила в 2017 году, через два века после основания
    села; до того она была улицей Сталина.


    Второе наследие колонии — вино. По данным грузинских ампелографов, колонист по фамилии Шаль нашёл
    в асуретских лесах дикорастущую лозу; она разошлась по Квемо-Картли как «виноград Шаля», а позже академик
    Соломон Чолокашвили дал ей имя Асуретули шави. Некоторые считают, что это старый грузинский сорт,
    одичавший после того, как село опустело. В 1930-е годы местный колхоз «Конкордия» славился своим виноградарством.


    Конец наступил в октябре 1941 года: немцев Асурети депортировали в Сибирь и Казахстан, а в их дома
    переселили семьи из Амбролаури и Они. Пройдите по улице не спеша: одни дома отреставрированы, другие
    рушатся, и между ними, дом за домом, читается, как более чем вековая немецкая жизнь оборвалась за
    одну осень.
  tip: >-
    Двух часов хватит на главную улицу, кирху, кладбище и, если договориться заранее, винный погреб. Улица
    ровная, по ней легко идти и пожилым. Большинство домов — частные: смотрите от калитки и спрашивайте
    разрешения, прежде чем войти во двор. Кирха открыта не всегда. С едой в селе туго, так что поешьте
    в Тбилиси или возьмите с собой пикник. Если собираетесь на дегустацию, заранее решите, кто сядет за
    руль. Лучшее время — весеннее цветение и октябрьский сбор винограда.
  route: >-
    Выезжайте из Тбилиси на юг по S6 в сторону Марнеули. Примерно через 28 км сверните на запад, на Sh31
    — дорогу Кода–Манглиси — и проезжайте через Коду; Асурети лежит чуть в стороне от трассы, километрах
    в десяти дальше, поворот обозначен указателем. Это около 38 км и 45–50 минут — одна из самых лёгких
    поездок из столицы. Асфальт на всём пути, у села дорога сужается; машины эконом-класса хватит в любое
    время года. Заправляйтесь на S6 или в Тбилиси. Парковаться можно на главной улице или у кирхи.
fa:
  name: آسورتی
  short: >-
    الیزابت‌تال، کوچ‌نشین شوابی‌ای که در ۱۸۱۸ بنیاد شد: شیروانی‌های سفالی، سرداب‌های ژرف شراب، کلیسای
    لوتری ۱۸۷۱ و انگوری که نخست در جنگل یافتند.
  body: >-
    **در کمتر از یک ساعت راه از تفلیس، روستایی گرجی هست با خیابانی به نام شوابن‌اشتراسه و تابلوهایی به
    دو زبان آلمانی و گرجی.**


    آسورتی روستایی کهن گرجی است که در سدهٔ هجدهم بر اثر یورش‌ها از مردم خالی شد. در ۱۹ نوامبر ۱۸۱۸ هفتاد
    و دو خانوادهٔ شوابی از وورتمبرگ، پروتستان‌هایی که از آزار دینی گریخته و به دعوت تزار الکساندر یکم
    آمده بودند، در اینجا کوچ‌نشینی بنیاد نهادند و نامش را الیزابت‌تال گذاشتند. وقتی طبیعی‌دان فریدریش
    پاروت در ۱۸۲۹ از اینجا گذشت، کوچ‌نشین‌های آلمانی را در نگاه نخست می‌شناخت: از خانه‌ها، کشتزارها، گاری‌ها
    و پوشاکشان.


    هنوز هم می‌توان دید منظورش چه بود. در امتداد خیابان اصلیِ دراز و راست، خانه‌های دوطبقه‌ای با شیروانی
    سفالی، بالکن‌های چوبی و سرداب‌های سنگی ژرف برای شراب ایستاده‌اند، و بر سردر بسیاری از آنها سال ساخت
    کنده شده است. کلیسای لوتری سال ۱۸۷۱ که آلبرت زالتسمان طراحی‌اش کرد هنوز پابرجاست؛ در ۱۹۳۰ از کاربری
    دینی خارج شد و از ۲۰۰۰ به این سو گام‌به‌گام بازسازی می‌شود. کنارش گورستان کوچ‌نشینان است. خیابان در
    سال ۲۰۱۷، دو سده پس از بنیاد روستا، نام آلمانی‌اش را گرفت؛ تا آن زمان خیابان استالین بود.


    میراث دیگر این کوچ‌نشین شراب است. به گفتهٔ انگورشناسان گرجی، کوچ‌نشینی به نام شال تاکی را یافت که
    در جنگل‌های آسورتی خودرو روییده بود؛ این تاک با نام «انگور شال» در سراسر کوِمو کارتلی پراکنده شد،
    و بعدها سولومون چولوکاشویلیِ آکادمیسین نام آسورتولی شاوی بر آن نهاد. برخی بر این باورند که این رقمی
    کهن و گرجی است که پس از خالی شدن روستا وحشی شده بود. در دههٔ ۱۹۳۰ مزرعهٔ اشتراکی محلی، کنکوردیا، به
    تاکداری‌اش نام‌آور بود.


    پایان در اکتبر ۱۹۴۱ فرا رسید، وقتی آلمانی‌های آسورتی به سیبری و قزاقستان تبعید شدند و خانواده‌هایی
    از آمبرولائوری و اونی را به خانه‌هایشان آوردند. آهسته در خیابان قدم بزنید: برخی خانه‌ها مرمت شده‌اند
    و برخی فرو می‌ریزند، و میان آنها، خانه به خانه، می‌توان خواند که چگونه بیش از یک سده زندگی آلمانی
    در یک پاییز به پایان رسید.
  tip: >-
    دو ساعت برای خیابان اصلی، کلیسا، گورستان و، اگر از پیش هماهنگ کنید، یک سرداب شراب بس است. خیابان هموار
    است و برای سالمندان هم آسان. بیشتر خانه‌ها خانهٔ شخصی‌اند: از کنار در تماشا کنید و پیش از پا گذاشتن
    به حیاط اجازه بگیرید. کلیسا همیشه باز نیست. در روستا جای غذا خوردن کم است، پس در تفلیس غذا بخورید
    یا خوراکی همراه بیاورید. اگر قصد چشیدن شراب دارید، از پیش روشن کنید چه کسی رانندگی می‌کند. شکوفه‌های
    بهار و انگورچینی اکتبر بهترین زمان‌ها هستند.
  route: >-
    از تفلیس با جادهٔ S6 رو به جنوب و به سوی مارنئولی بروید. پس از حدود ۲۸ کیلومتر به غرب و به جادهٔ Sh31،
    جادهٔ کودا–مانگلیسی، بپیچید و از کودا بگذرید؛ آسورتی کمی دور از جاده، حدود ده کیلومتر جلوتر است و
    انشعابش تابلو دارد. حدود ۳۸ کیلومتر و ۴۵ تا ۵۰ دقیقه راه است، یکی از آسان‌ترین گردش‌ها از پایتخت.
    جاده سراسر آسفالت است و نزدیک روستا باریک‌تر می‌شود، و در هر فصلی خودروی اقتصادی کافی است. در جادهٔ
    S6 یا در تفلیس سوخت بگیرید. در خیابان اصلی یا کنار کلیسا پارک کنید.
he:
  name: אסורתי
  short: >-
    אליזבטטל, המושבה השוואבית שנוסדה ב-1818: גמלונים מכוסי רעפים, מרתפי יין עמוקים, כנסייה לותרנית מ-1871
    וזן ענבים שנמצא לראשונה ביער.
  body: >-
    **פחות משעה מטביליסי יש כפר גאורגי שבו רחוב בשם שוואבנשטראסה ושלטים בגרמנית ובגאורגית.**


    אסורתי הוא כפר גאורגי עתיק שהתרוקן מיושביו בעקבות פלישות במאה ה-18. ב-19 בנובמבר 1818 ייסדו כאן שבעים
    ושתיים משפחות שוואביות מווירטמברג, פרוטסטנטים שנמלטו מרדיפות דתיות והגיעו בהזמנת הצאר אלכסנדר הראשון,
    מושבה שקראו לה אליזבטטל. כשחלף כאן חוקר הטבע פרידריך פארוט ב-1829, זיהה את המושבות הגרמניות במבט אחד:
    לפי הבתים, השדות, העגלות והלבוש.


    עד היום אפשר לראות למה התכוון. לאורך הרחוב הראשי, הארוך והישר, עומדים בתים בני שתי קומות עם גמלוני
    רעפים, מרפסות עץ ומרתפי אבן עמוקים שנבנו ליין, ועל רבים מהם חקוקה מעל הדלת שנת הבנייה. הכנסייה הלותרנית
    מ-1871, שתכנן האדריכל אלברט זלצמן, עדיין עומדת: ב-1930 חדלה לשמש לפולחן, ומאז 2000 היא משוקמת בהדרגה.
    לצידה בית הקברות של המתיישבים. את שמו הגרמני קיבל הרחוב ב-2017, מאתיים שנה אחרי ייסוד המושבה; עד אז
    נקרא רחוב סטלין.


    היין הוא המורשת האחרת של המושבה. לפי אמפלוגרפים (חוקרי זני גפן) גאורגים, מתיישב בשם שאל מצא גפן שצמחה
    פרא ביערות אסורתי; היא התפשטה ברחבי קוומו קרתלי בשם "הענב של שאל", ומאוחר יותר העניק לה האקדמיקאי
    סולומון צ'ולוקשווילי את השם אסורתולי שאווי. יש הסבורים שזהו זן גאורגי עתיק שהתפרא אחרי שהכפר התרוקן.
    בשנות ה-30 של המאה ה-20 נודע הקולחוז המקומי, "קונקורדיה", בגידול הגפנים שלו.


    הסוף בא באוקטובר 1941, כשגרמני אסורתי גורשו לסיביר ולקזחסטן ומשפחות מאמברולאורי ומאוני הועברו לבתיהם.
    לכו ברחוב לאט: חלק מן הבתים שוקמו, אחרים מתפוררים, וביניהם, בית אחר בית, אפשר לקרוא איך יותר ממאה
    שנה של חיים גרמניים הסתיימו בסתיו אחד.
  tip: >-
    שעתיים מספיקות לרחוב הראשי, לכנסייה, לבית הקברות, ואם תתאמו מראש, גם למרתף יין. הרחוב מישורי ונוח
    גם לרגליים מבוגרות. רוב הבתים הם בתים פרטיים: הביטו מן השער ובקשו רשות לפני שאתם נכנסים לחצר. הכנסייה
    אינה תמיד פתוחה. אפשרויות האוכל בכפר דלות, אז אכלו בטביליסי או הביאו פיקניק. אם אתם מתכננים לטעום
    יין, קבעו מראש מי נוהג. פריחת האביב ובציר אוקטובר הם הזמנים הטובים ביותר לבוא.
  route: >-
    צאו מטביליסי דרומה בכביש S6 לכיוון מרנאולי. אחרי כ-28 ק״מ פנו מערבה לכביש Sh31, דרך קודה–מאנגליסי,
    ועברו דרך קודה; אסורתי שוכנת מעט מחוץ לכביש, כעשרה קילומטרים הלאה, והפנייה אליה מסומנת. כ-38 ק״מ ו-45
    עד 50 דקות, אחת היציאות הקלות ביותר מן הבירה. הדרך סלולה לכל אורכה ומצטמצמת לקראת הכפר, ורכב חסכוני
    מספיק בכל עונה. תדלקו על כביש S6 או בטביליסי. חנו ברחוב הראשי או ליד הכנסייה.
ar:
  name: أسوريتي
  short: >-
    إليزابيثتال، المستعمرة الشوابية التي تأسست عام 1818: جملونات من القرميد، وأقبية نبيذ عميقة، وكنيسة
    لوثرية من 1871، وكرمة وُجدت أول مرة في الغابة.
  body: >-
    **على أقل من ساعة من تبليسي قرية جورجية فيها شارع يُدعى شفابنشتراسه ولافتات بالألمانية والجورجية معاً.**


    أسوريتي قرية جورجية قديمة أفرغتها الغزوات في القرن الثامن عشر. وفي 19 نوفمبر 1818 أسّست هنا اثنتان
    وسبعون أسرة شوابية من فورتمبيرغ، من البروتستانت الفارّين من الاضطهاد الديني، وقد جاؤوا بدعوة من القيصر
    ألكسندر الأول، مستعمرةً سمّوها إليزابيثتال. وحين مرّ بها عالم الطبيعة فريدريش باروت عام 1829، كان
    يعرف المستعمرات الألمانية من النظرة الأولى: من بيوتها وحقولها وعرباتها وملابس أهلها.


    وما زلت ترى ما كان يقصده. فعلى امتداد الشارع الرئيسي الطويل المستقيم تصطفّ بيوت من طابقين بجملونات
    من القرميد وشرفات خشبية وأقبية حجرية عميقة بُنيت للنبيذ، وقد نُقشت سنة البناء فوق أبواب كثير منها.
    وما زالت الكنيسة اللوثرية التي بُنيت عام 1871 بتصميم المعماري ألبرت زالتسمان قائمة؛ فقد أُخرجت من
    الخدمة الكنسية عام 1930، ويجري ترميمها تدريجياً منذ عام 2000، وإلى جانبها مقبرة المستوطنين. وقد نال
    الشارع اسمه الألماني عام 2017، بعد قرنين من التأسيس؛ وكان قبل ذلك شارع ستالين.


    والنبيذ هو الإرث الآخر للمستعمرة. فبحسب علماء الكرمة الجورجيين، عثر مستوطن يُدعى شال على كرمة تنمو
    برّية في غابات أسوريتي؛ فانتشرت في أنحاء كفيمو كارتلي باسم «عنب شال»، ثم أطلق عليها الأكاديمي سولومون
    تشولوكاشفيلي اسم أسوريتولي شافي. ويرى بعضهم أنها صنف جورجي قديم عاد إلى البرّية بعدما خلت القرية من
    أهلها. وفي ثلاثينيات القرن العشرين اشتهرت المزرعة الجماعية المحلية «كونكورديا» بزراعة الكروم.


    وجاءت النهاية في أكتوبر 1941، حين رُحّل ألمان أسوريتي إلى سيبيريا وكازاخستان، ونُقلت إلى بيوتهم أسر
    من أمبرولاوري وأوني. امشِ في الشارع على مهل: بعض البيوت رُمّم، وبعضها يتداعى، وبينها تستطيع أن تقرأ،
    بيتاً بعد بيت، كيف انتهت أكثر من مئة سنة من الحياة الألمانية في خريف واحد.
  tip: >-
    تكفي ساعتان للشارع الرئيسي والكنيسة والمقبرة، ولقبو نبيذ إن رتّبت ذلك مسبقاً. الشارع مستوٍ وسهل حتى
    على كبار السن. ومعظم البيوت مساكن خاصة: انظر من البوابة واستأذن قبل أن تدخل أي فناء. الكنيسة ليست
    مفتوحة دائماً. وخيارات الطعام في القرية شحيحة، فكُل في تبليسي أو أحضر معك طعاماً للنزهة. وإن كنت تنوي
    تذوّق النبيذ، فاتفق مسبقاً على من سيقود. أزهار الربيع وقطاف أكتوبر أفضل أوقات الزيارة.
  route: >-
    اخرج من تبليسي جنوباً على الطريق S6 باتجاه مارنئولي. وبعد نحو 28 كيلومتراً انعطف غرباً إلى الطريق
    Sh31، طريق كودا–مانغليسي، واعبر كودا؛ تقع أسوريتي بعيداً قليلاً عن الطريق على نحو عشرة كيلومترات أخرى،
    ومنعطفها معلَّم بلافتة. المسافة نحو 38 كيلومتراً ومن 45 إلى 50 دقيقة، وهي من أسهل الرحلات من العاصمة.
    الطريق معبّد كله ويضيق قرب القرية، وتكفي سيارة اقتصادية في أي فصل. تزوّد بالوقود على الطريق S6 أو
    في تبليسي. اركن في الشارع الرئيسي أو بجوار الكنيسة.
