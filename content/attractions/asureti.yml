ka:
  name: ასურეთი
  short: ყოფილი გერმანული კოლონია ელიზაბეტთალი, სადაც კოლონისტების სახლების მთელი ქუჩა და მათი ვაზი შემორჩა.
  body: >-
    **ასურეთი თბილისიდან ორმოც კილომეტრშია და სულ სხვა XIX საუკუნეს ეკუთვნის.** სოფელი 1818 წელს დაარსდა
    როგორც შვაბიური გერმანული კოლონია სახელად ელიზაბეტთალი. ვიურტემბერგიდან წამოსული ოჯახები, რომლებიც
    რელიგიური და ეკონომიკური მიზეზებით მიდიოდნენ, რუსეთის იმპერიის მოწვევით ამიერკავკასიაში დასახლდნენ
    — ასურეთი, ბოლნისი და კიდევ რამდენიმე სოფელი ამ ტალღის შედეგია.


    რაც შემორჩა, ქუჩაა. სახლები ორსართულიანია, კრამიტის ფრონტონული სახურავით, ხის აივნებით და ქვის სარდაფებით,
    რომლებიც ღვინისთვის იყო გათვლილი; კარის ზემოთ ხშირად ამოკვეთილია აშენების წელი. განლაგება მკაცრად
    გეგმიურია: სწორი ქუჩა, თანაბარი ნაკვეთები, ეზოს ბოლოში სამეურნეო შენობა. ეს ქართული სოფლის ლოგიკა
    არ არის და სწორედ ამიტომ თვალშისაცემია.


    ცენტრში ლუთერანული ეკლესია დგას, XIX საუკუნის ბოლოს აშენებული, და ძველი გერმანული სასაფლაო გვერდით.
    გერმანული მოსახლეობა 1941 წელს დეპორტირებულ იქნა ყაზახეთსა და შუა აზიაში და აღარ დაბრუნებულა.


    მეორე მემკვიდრეობა ღვინოა. ასურეთი „ასურეთული შავის" სამშობლოა — ადგილობრივი წითელი ჯიშის, რომელიც
    კოლონისტებმა გაავრცელეს. დღეს რამდენიმე ოჯახი კვლავ ამზადებს მას და სოფელში მცირე მარნებია. სახლების
    ნაწილი აღდგენილია, ნაწილი ინგრევა — და ეს კონტრასტიც ისტორიის ნაწილია.
  tip: >-
    ორი საათი საკმარისია: მთავარი ქუჩის ბოლომდე გავლა, ეკლესია, სასაფლაო და მარანი. ქუჩა ბრტყელია და ხანდაზმულთათვისაც
    მოსახერხებელი. სახლების უმეტესობა კერძოა — ეზოში შესვლამდე იკითხეთ. მარნის მონახულება წინასწარ შეათანხმეთ.
    სოფელში პატარა კაფეა, მაგრამ არა ყოველდღე ღია. ღვინის დასაგემოვნებლად მძღოლი წინასწარ განსაზღვრეთ.
    საუკეთესო დროა გაზაფხული და შემოდგომა.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით თბილისი-წალკის გზით, კოდის მიმართულებით, შემდეგ ასურეთის მაჩვენებელზე
    გაუხვევთ. სულ 38 კმ, დაახლოებით ორმოცდაათი წუთი — ეს ერთ-ერთი ყველაზე ახლო გასვლაა დედაქალაქიდან.
    გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, ბოლო ხუთი კილომეტრი ვიწროვდება. საწვავი კოდაში ან თბილისის
    გასასვლელში აიღეთ. მანქანა მთავარ ქუჩაზე ან ეკლესიასთან დგება, უფასოდ.
en:
  name: Asureti
  short: >-
    The former German colony of Elisabethtal, where a whole street of colonist houses and their vine still
    survive.
  body: >-
    **Asureti is forty kilometres from Tbilisi and belongs to an entirely different 19th century.** The
    village was founded in 1818 as a Swabian German colony called Elisabethtal. Families from Württemberg,
    leaving for religious and economic reasons, settled in the South Caucasus at the invitation of the
    Russian empire; Asureti, Bolnisi and a handful of other villages are the result of that wave.


    What survives is the street. The houses are two storeys, with tiled gable roofs, wooden balconies
    and deep stone cellars built for wine; the year of construction is often carved above the door. The
    layout is rigidly planned — a straight street, equal plots, a service building at the end of each
    yard. This is not the logic of a Georgian village, and that is exactly why it stands out.


    In the centre is the Lutheran church, built in the late 19th century, with the old German cemetery
    beside it. The German population was deported to Kazakhstan and Central Asia in 1941 and never returned.


    The second inheritance is wine. Asureti gives its name to Asuretuli Shavi, a local red grape the colonists
    propagated. Several families still make it and there are small cellars in the village. Some houses
    have been restored, others are quietly falling down, and that contrast is part of the history too.
  tip: >-
    Two hours is enough: walking the main street end to end, the church, the cemetery and a cellar. The
    street is flat and easy for older visitors. Most of the houses are private, so ask before stepping
    into a yard. Arrange a cellar visit in advance. There is a small cafe in the village but it is not
    open every day. If you plan to taste wine, decide who is driving beforehand. Spring and autumn are
    the best seasons.
  route: >-
    Head southwest from Tbilisi on the Tsalka road towards Koda, then turn off at the sign for Asureti.
    Thirty-eight kilometres in total, about fifty minutes — one of the shortest outings from the capital.
    The road is asphalt throughout and in good condition, narrowing for the last five kilometres. Refuel
    in Koda or on the edge of Tbilisi. Cars are parked free on the main street or by the church.
ru:
  name: Асурети
  short: Бывшая немецкая колония Елизаветталь, где сохранились целая улица домов колонистов и их виноградный
    сорт.
  body: >-
    **Асурети в сорока километрах от Тбилиси и принадлежит совершенно другому XIX веку.** Село основано
    в 1818 году как швабская немецкая колония под названием Елизаветталь. Семьи из Вюртемберга, уезжавшие
    по религиозным и экономическим причинам, селились в Закавказье по приглашению Российской империи;
    Асурети, Болниси и ещё несколько сёл — результат той волны.


    Сохранилась улица. Дома двухэтажные, с черепичными двускатными крышами, деревянными балконами и глубокими
    каменными подвалами, устроенными под вино; над дверью часто вырезан год постройки. Планировка жёстко
    регулярная: прямая улица, равные участки, хозяйственная постройка в глубине двора. Это не логика грузинского
    села, и потому она сразу бросается в глаза.


    В центре стоит лютеранская церковь конца XIX века, рядом старое немецкое кладбище. Немецкое население
    депортировали в Казахстан и Среднюю Азию в 1941 году, и оно не вернулось.


    Второе наследие — вино. Асурети дало имя сорту асуретули шави, местному красному винограду, который
    распространили колонисты. Несколько семей делают его до сих пор, в селе есть небольшие марани. Часть
    домов отреставрирована, часть тихо разрушается, и этот контраст тоже часть истории.
  tip: >-
    Двух часов достаточно: пройти главную улицу из конца в конец, церковь, кладбище и погреб. Улица ровная,
    удобна и для пожилых. Большинство домов частные — спрашивайте, прежде чем заходить во двор. Посещение
    погреба договаривайте заранее. В селе есть маленькое кафе, но работает не каждый день. Если собираетесь
    пробовать вино, заранее решите, кто за рулём. Лучшие сезоны — весна и осень.
  route: >-
    Из Тбилиси на юго-запад по цалкской дороге в сторону Кода, затем поворот по указателю на Асурети.
    Всего 38 км, примерно пятьдесят минут — одна из самых коротких вылазок из столицы. Дорога асфальтированная
    и в хорошем состоянии, последние пять километров сужается. Заправляйтесь в Кода или на выезде из Тбилиси.
    Машину бесплатно оставляют на главной улице или у церкви.
fa:
  name: آسورتی
  short: مستعمرهٔ آلمانی پیشین الیزابت‌تال، جایی که یک خیابان کامل از خانه‌های مهاجران و تاک آنان هنوز
    برجاست.
  body: >-
    **آسورتی چهل کیلومتر با تفلیس فاصله دارد و به سدهٔ نوزدهمی یکسره دیگر تعلق دارد.** روستا در ۱۸۱۸ همچون
    مستعمرهٔ آلمانیِ شوابی با نام الیزابت‌تال بنیاد گرفت. خانواده‌هایی از ویرتمبرگ که به انگیزه‌های دینی
    و اقتصادی مهاجرت می‌کردند، به دعوت امپراتوری روسیه در قفقاز جنوبی ساکن شدند؛ آسورتی، بولنیسی و چند
    روستای دیگر حاصل همان موج‌اند.


    آنچه مانده خیابان است. خانه‌ها دوطبقه‌اند، با بام‌های شیروانی سفالی، بالکن‌های چوبی و سردابه‌های سنگی
    ژرف که برای شراب ساخته شده بودند؛ سال ساخت اغلب بالای در کنده شده است. طرح، سخت‌گیرانه برنامه‌ریزی‌شده
    است: خیابانی مستقیم، قطعه‌هایی برابر، و بنایی خدماتی در انتهای هر حیاط. این منطق روستای گرجی نیست
    و درست به همین سبب به چشم می‌آید.


    در مرکز، کلیسای لوتری از اواخر سدهٔ نوزدهم ایستاده و گورستان کهن آلمانی در کنارش است. جمعیت آلمانی
    در ۱۹۴۱ به قزاقستان و آسیای میانه تبعید شد و هرگز بازنگشت.


    میراث دوم شراب است. آسورتی نام خود را به آسورتولی شاوی داده است، انگور سرخ محلی که مهاجران گسترش دادند.
    چند خانواده هنوز آن را می‌سازند و در روستا سردابه‌های کوچکی هست. برخی خانه‌ها مرمت شده‌اند و برخی
    بی‌سروصدا فرو می‌ریزند، و همین تضاد نیز بخشی از تاریخ است.
  tip: >-
    دو ساعت کافی است: پیمودن خیابان اصلی از این سر تا آن سر، کلیسا، گورستان و یک سردابه. خیابان هموار
    است و برای سالمندان آسان. بیشتر خانه‌ها خصوصی‌اند، پس پیش از ورود به حیاط اجازه بگیرید. بازدید از
    سردابه را از پیش هماهنگ کنید. در روستا کافه‌ای کوچک هست اما هر روز باز نیست. اگر قصد چشیدن شراب دارید،
    از پیش روشن کنید چه کسی می‌راند. بهار و پاییز بهترین فصل‌هایند.
  route: >-
    از تفلیس به جنوب‌غرب روی جادهٔ تسالکا به سوی کودا بروید، سپس سر تابلوی آسورتی بپیچید. روی‌هم ۳۸ کیلومتر،
    حدود پنجاه دقیقه — از کوتاه‌ترین بیرون‌رفت‌های پایتخت. جاده تا انتها آسفالت و در وضعیت خوبی است و
    در پنج کیلومتر آخر باریک می‌شود. سوخت را در کودا یا در خروجی تفلیس بگیرید. خودرو را رایگان در خیابان
    اصلی یا کنار کلیسا می‌گذارند.
he:
  name: אסורתי
  short: מושבת הגרמנים לשעבר אליזבטתאל, שבה שרדו רחוב שלם של בתי מתיישבים והגפן שלהם.
  body: >-
    **אסורתי נמצאת ארבעים קילומטרים מטביליסי ושייכת למאה ה-19 אחרת לגמרי.** הכפר נוסד ב-1818 כמושבה גרמנית
    שוואבית בשם אליזבטתאל. משפחות מווירטמברג, שיצאו מסיבות דתיות וכלכליות, התיישבו בדרום הקווקז בהזמנת
    האימפריה הרוסית; אסורתי, בולניסי וכמה כפרים נוספים הם תוצאת אותו גל.


    מה ששרד הוא הרחוב. הבתים בני שתי קומות, עם גגות רעפים משופעים, מרפסות עץ ומרתפי אבן עמוקים שנבנו ליין;
    שנת הבנייה חרוטה לעיתים קרובות מעל הדלת. התכנון נוקשה: רחוב ישר, מגרשים שווים, ומבנה שירות בסוף כל
    חצר. אין זו ההיגיון של כפר גאורגי, ובדיוק משום כך הוא בולט.


    במרכז עומדת הכנסייה הלותרנית מסוף המאה ה-19, ולידה בית הקברות הגרמני הישן. האוכלוסייה הגרמנית גורשה
    לקזחסטן ולמרכז אסיה ב-1941 ומעולם לא שבה.


    הירושה השנייה היא יין. אסורתי נותנת את שמה לזן אסורתולי שאווי, ענב אדום מקומי שהמתיישבים הפיצו. כמה
    משפחות עדיין מייצרות ממנו, ובכפר יש מרתפים קטנים. חלק מן הבתים שוקמו, אחרים מתמוטטים בשקט, והניגוד
    הזה אף הוא חלק מן ההיסטוריה.
  tip: >-
    שעתיים מספיקות: הליכה ברחוב הראשי מקצה לקצה, הכנסייה, בית הקברות ומרתף. הרחוב מישורי ונוח גם למבוגרים.
    רוב הבתים פרטיים, לכן שאלו לפני שנכנסים לחצר. תאמו ביקור במרתף מראש. בכפר יש בית קפה קטן אך הוא אינו
    פתוח בכל יום. אם בכוונתכם לטעום יין, החליטו מראש מי נוהג. אביב וסתיו הן העונות הטובות.
  route: >-
    צאו מטביליסי דרום-מערבה בכביש צאלקה לכיוון קודה, ואז פנו בשילוט לאסורתי. 38 ק״מ בסך הכול, כחמישים
    דקות — אחת היציאות הקצרות ביותר מן הבירה. הכביש סלול לכל אורכו ובמצב טוב, ומצטמצם בחמישה הקילומטרים
    האחרונים. תדלקו בקודה או בקצה טביליסי. חונים בחינם ברחוב הראשי או ליד הכנסייה.
ar:
  name: أسوريتي
  short: مستعمرة إليزابيتال الألمانية سابقاً، حيث بقي شارع كامل من بيوت المستوطنين وكرمتهم.
  body: >-
    **أسوريتي على بعد أربعين كيلومتراً من تبليسي وتنتمي إلى قرن تاسع عشر مختلف تماماً.** أُسست القرية
    عام 1818 مستعمرةً ألمانية شوابية باسم إليزابيتال. فقد استقرت عائلات من فورتمبرغ، رحلت لأسباب دينية
    واقتصادية، في جنوب القوقاز بدعوة من الإمبراطورية الروسية؛ وأسوريتي وبولنيسي وقرى أخرى قليلة ثمرة تلك
    الموجة.


    وما بقي هو الشارع. البيوت من طابقين، بأسقف قرميد جملونية، وشرفات خشبية، وأقبية حجرية عميقة بُنيت للنبيذ؛
    وكثيراً ما تُنحت سنة البناء فوق الباب. والتخطيط صارم: شارع مستقيم، وقطع متساوية، ومبنى خدمي في نهاية
    كل فناء. وهذا ليس منطق القرية الجورجية، ولهذا بالذات يلفت النظر.


    وفي الوسط تقوم الكنيسة اللوثرية المبنية في أواخر القرن التاسع عشر، وإلى جانبها المقبرة الألمانية القديمة.
    وقد رُحّل السكان الألمان إلى كازاخستان وآسيا الوسطى عام 1941 ولم يعودوا قط.


    والميراث الثاني نبيذ. تُعطي أسوريتي اسمها لصنف أسوريتولي شافي، وهو عنب أحمر محلي نشره المستوطنون.
    وما زالت عدة عائلات تصنعه، وفي القرية أقبية صغيرة. وقد رُمّم بعض البيوت وينهار بعضها بهدوء، وهذا التناقض
    جزء من التاريخ أيضاً.
  tip: >-
    ساعتان تكفيان: قطع الشارع الرئيسي من طرف إلى طرف، والكنيسة، والمقبرة، وقبو نبيذ. والشارع مستوٍ ومريح
    لكبار السن. ومعظم البيوت خاصة، فاستأذن قبل دخول أي فناء. ورتّب زيارة القبو مسبقاً. وفي القرية مقهى
    صغير لكنه لا يفتح كل يوم. وإن نويت تذوق النبيذ فحدّد من يقود قبل ذلك. والربيع والخريف أفضل الفصول.
  route: >-
    اتجه جنوب غرب من تبليسي على طريق تسالكا نحو كودا، ثم انعطف عند لافتة أسوريتي. ثمانية وثلاثون كيلومتراً
    إجمالاً، نحو خمسين دقيقة — وهي من أقصر الخرجات من العاصمة. الطريق معبّد بكامله وبحالة جيدة، ويضيق
    في الكيلومترات الخمسة الأخيرة. تزوّد بالوقود في كودا أو عند مخرج تبليسي. وتُركن السيارات مجاناً في
    الشارع الرئيسي أو بجوار الكنيسة.
