ka:
  name: 6 მაისის პარკი და ბათუმის დელფინარიუმი
  short: >-
    ბათუმის უძველესი პარკი ტბით, ზოოკუთხითა და საბჭოთა დროიდან მომუშავე დელფინარიუმით.
  body: >-
    **6 მაისის პარკი ბათუმის ყველაზე ძველი საზოგადოებრივი ბაღია** — გაშენდა 1881 წელს, როცა ქალაქი რუსეთის
    იმპერიის თავისუფალი პორტი გახდა და ბოტანიკოსებმა აქ სუბტროპიკული სახეობების გამოცდა დაიწყეს. დღეს
    ეს ცენტრის მწვანე ბირთვია: მაგნოლიები, ბამბუკის კორომები, კამფორის ხეები და ევკალიპტები, რომლებიც
    ასწლოვან სიმაღლეს მიაღწიეს.

    პარკის შუაგულში ნურიგელის ტბაა — პატარა, მრგვალი, ნაპირზე ნავებით და მოაჯირით. ზაფხულის საღამოს აქ
    ნახევარი ქალაქი დადის. სწორედ ტბის გარშემოა თავმოყრილი პარკის სამი ძირითადი დაწესებულება:

    - **დელფინარიუმი** — გაიხსნა 1975 წელს, საბჭოთა კავშირის ერთ-ერთი პირველი; შენობა 2010-იან წლებში
    გადააკეთეს, შოუ დღეს მოკლეა და დარბაზი პატარა

    - **აკვარიუმი** — შავი ზღვის სახეობებზეა აგებული და ბავშვებისთვის უფრო საინტერესოა, ვიდრე ზრდასრულებისთვის

    - **ზოოკუთხე** — მოკრძალებული, თუმცა ბოლო წლებში აშკარად გაუმჯობესებული

    დელფინარიუმზე პირდაპირ ღირს იმის თქმა, რასაც სხვები არ ამბობენ: ეს არ არის თანამედროვე ევროპული ტიპის
    საზღვაო ცენტრი, აუზი მცირეა და ვისაც პრინციპული პოზიცია აქვს ტყვეობაში მყოფ დელფინებზე, უმჯობესია
    გვერდი აუაროს. ვინც შედის, კარგად გააკეთებს, თუ ბილეთს წინასწარ აიღებს — ზაფხულში სეანსები ივსება.

    პარკი თავისთავად უფასოა და მთელი წელი ღიაა. ზამთარში, როცა ბულვარი ცარიელია, აქ მაინც ხალხია: მოხუცები
    ნარდს თამაშობენ, სკოლის მოსწავლეები ტბის გარშემო დარბიან. გაზაფხულზე მაგნოლიები ორ კვირაში ერთდროულად
    ყვავის და პარკი წლის საუკეთესო სახეს იღებს.
  tip: >-
    პარკის შემოვლას ორმოცი წუთი ჰყოფნის, დელფინარიუმის სეანსთან ერთად — ორი საათი. ბილეთი მხოლოდ შოუზეა
    საჭირო, პარკში შესვლა უფასოა. ბილეთი წინასწარ აიღე: ივლის-აგვისტოში სეანსები ივსება. დარბაზში პირველი
    რიგები სველდება. ტუალეტი პარკშია, კაფეები ტბის ჩრდილო ნაპირზე. ეტლით და ეტლიანი ბავშვით ბილიკები
    სავსებით გამავალია.
  route: >-
    თბილისიდან E60-ით ქუთაისსა და სამტრედიაზე გავლით, შემდეგ სამხრეთით ზღვისპირა გზით ქობულეთის გავლით
    — 370 კმ, დაახლოებით ხუთი საათი ნახევარი. მთელი მარშრუტი ასფალტია. პარკი ბათუმის ცენტრშია, ბულვარის
    სამხრეთ ბოლოსთან; შესასვლელი რუსთაველისა და გორგილაძის ქუჩების მხრიდანაა. ქუჩის პარკინგი ფასიანია
    და ზაფხულში სავსე — ჯობია მანქანა ორიოდე კვარტალით შორს დატოვო. საწვავი ქუთაისსა და ოზურგეთშია. ეკონომ-კლასი
    საკმარისია.
en:
  name: 6 May Park and Batumi Dolphinarium
  short: >-
    Batumi's oldest park, with a small lake, a zoo corner and a dolphinarium that has run since Soviet
    times.
  body: >-
    **6 May Park is the oldest public garden in Batumi,** laid out in 1881 when the town became a free
    port of the Russian Empire and botanists began testing subtropical species here. It is still the green
    core of the centre: magnolias, stands of bamboo, camphor trees and eucalyptus that have had a century
    to reach full height.

    At its middle lies Lake Nurigeli, small and round, with rowing boats and a railing walk around the
    shore. On summer evenings half the city seems to be circling it. The park's three institutions sit
    around that lake:

    - The **dolphinarium**, opened in 1975 and one of the first in the Soviet Union; the building was rebuilt
    in the 2010s, the show is short and the hall is small

    - The **aquarium**, built around Black Sea species and more rewarding for children than for adults

    - A modest **zoo corner**, clearly better kept than it was a decade ago

    It is worth being plain about the dolphinarium in a way that most listings are not. This is not a modern
    European marine centre, the pool is small, and anyone with a settled objection to captive dolphins
    should simply skip it. If you do go, book ahead — sessions fill in July and August.

    The park itself is free and open year round. In winter, when the boulevard empties, this is where people
    still gather: old men playing backgammon, schoolchildren running the loop around the water. In spring
    the magnolias flower more or less together over about two weeks, and the park has its best fortnight
    of the year.
  tip: >-
    Forty minutes covers the park; add a dolphin show and you are at two hours. Only the show needs a ticket
    — walking in is free. Book in advance in July and August, when sessions sell out. The first rows in
    the hall get wet. Toilets are inside the park and cafes sit along the north shore of the lake. Paths
    are flat and fully passable with a wheelchair or a pushchair.
  route: >-
    From Tbilisi drive west on the E60 through Kutaisi and Samtredia, then south on the coast road past
    Kobuleti — 370 km, about five and a half hours, asphalt the whole way. The park sits in central Batumi
    at the southern end of the boulevard, with entrances from Rustaveli and Gorgiladze streets. Street
    parking is paid and full in summer, so it is easier to leave the car a couple of blocks inland. Fuel
    is available at Kutaisi and Ozurgeti. An economy car is sufficient.
ru:
  name: Парк 6 мая и Батумский дельфинарий
  short: >-
    Старейший парк Батуми с небольшим озером, зооуголком и дельфинарием, работающим с советских времён.
  body: >-
    **Парк 6 мая — старейший общественный сад Батуми,** разбитый в 1881 году, когда город стал вольным
    портом Российской империи и ботаники начали испытывать здесь субтропические виды. Он и сейчас остаётся
    зелёным ядром центра: магнолии, заросли бамбука, камфорные деревья и эвкалипты, у которых был целый
    век, чтобы вырасти в полную высоту.

    В середине лежит озеро Нуригели — маленькое, круглое, с лодками и прогулочной дорожкой по берегу.
    Летними вечерами вокруг него ходит, кажется, половина города. Три главных заведения парка стоят как
    раз у воды:

    - **Дельфинарий**, открытый в 1975 году и один из первых в Советском Союзе; здание перестроили в 2010-х,
    представление короткое, зал небольшой

    - **Аквариум**, построенный вокруг черноморских видов и интересный скорее детям, чем взрослым

    - Скромный **зооуголок**, заметно более ухоженный, чем десять лет назад

    О дельфинарии стоит сказать прямо то, о чём обычно умалчивают. Это не современный европейский морской
    центр, бассейн невелик, и тем, у кого есть принципиальные возражения против дельфинов в неволе, лучше
    просто пройти мимо. Если всё же идёте — берите билет заранее: в июле и августе сеансы разбирают.

    Сам парк бесплатен и открыт круглый год. Зимой, когда бульвар пустеет, люди собираются именно здесь:
    старики играют в нарды, школьники бегают круги вокруг озера. Весной магнолии зацветают почти одновременно
    примерно на две недели — лучшие полмесяца в году.
  tip: >-
    На парк хватит сорока минут; с представлением получится около двух часов. Билет нужен только на шоу,
    вход в парк свободный. В июле и августе берите билет заранее — сеансы заполняются. Первые ряды в зале
    промокают. Туалеты есть в парке, кафе — вдоль северного берега озера. Дорожки ровные, коляска и кресло
    проходят везде.
  route: >-
    Из Тбилиси на запад по E60 через Кутаиси и Самтредиа, затем на юг по приморской дороге мимо Кобулети
    — 370 км, около пяти с половиной часов, асфальт всю дорогу. Парк находится в центре Батуми, у южного
    конца бульвара, входы со стороны улиц Руставели и Горгиладзе. Уличная парковка платная и летом забита,
    проще оставить машину на пару кварталов вглубь. Заправки есть в Кутаиси и Озургети. Машины эконом-класса
    достаточно.
fa:
  name: پارک ششم مه و دلفیناریوم باتومی
  short: >-
    کهن‌ترین پارک باتومی با دریاچه‌ای کوچک، گوشه‌ای از باغ‌وحش و دلفیناریومی که از دوران شوروی کار می‌کند.
  body: >-
    **پارک ششم مه کهن‌ترین باغ عمومی باتومی است،** که در ۱۸۸۱ ساخته شد؛ زمانی که شهر بندر آزاد امپراتوری
    روسیه شد و گیاه‌شناسان آزمودن گونه‌های نیمه‌گرمسیری را اینجا آغاز کردند. هنوز هستهٔ سبز مرکز شهر است:
    ماگنولیا، بیشه‌های بامبو، درختان کافور و اکالیپتوس که یک قرن فرصت داشته‌اند تا به بلندای کامل برسند.

    در میانهٔ آن دریاچهٔ نوریگلی است، کوچک و گرد، با قایق‌های پارویی و مسیری نرده‌دار گرد ساحل. عصرهای
    تابستان انگار نیمی از شهر دورش می‌چرخد. سه نهاد اصلی پارک درست کنار همین آب نشسته‌اند:

    - **دلفیناریوم**، گشوده در ۱۹۷۵ و از نخستین‌ها در اتحاد شوروی؛ ساختمان در دههٔ ۲۰۱۰ بازسازی شد، نمایش
    کوتاه است و سالن کوچک

    - **آکواریوم**، بر پایهٔ گونه‌های دریای سیاه، که برای کودکان جذاب‌تر است تا بزرگ‌سالان

    - **گوشهٔ باغ‌وحش**، ساده اما آشکارا بهتر از ده سال پیش نگهداری می‌شود

    دربارهٔ دلفیناریوم باید صریح بود، آن‌گونه که فهرست‌های گردشگری معمولاً نیستند. اینجا یک مرکز دریایی
    امروزی اروپایی نیست، استخر کوچک است، و هر کس مخالفت اصولی با نگهداری دلفین در اسارت دارد بهتر است
    ساده از کنارش بگذرد. اگر رفتید، بلیت را از پیش بگیرید؛ در تیر و مرداد سانس‌ها پر می‌شوند.

    خود پارک رایگان و تمام سال باز است. زمستان که بلوار خالی می‌شود، مردم هنوز اینجا جمع‌اند: پیرمردها
    تخته می‌بازند و بچه‌های مدرسه دور دریاچه می‌دوند. بهار، ماگنولیاها تقریباً هم‌زمان و در حدود دو هفته
    گل می‌دهند؛ بهترین دو هفتهٔ سال پارک همان است.
  tip: >-
    چهل دقیقه برای خود پارک بس است؛ با نمایش دلفین‌ها حدود دو ساعت می‌شود. فقط نمایش بلیت می‌خواهد و ورود
    به پارک آزاد است. در تیر و مرداد بلیت را از پیش تهیه کنید. ردیف‌های نخست سالن خیس می‌شوند. سرویس بهداشتی
    داخل پارک است و کافه‌ها در ساحل شمالی دریاچه. مسیرها هموارند و با کالسکه یا ویلچر کاملاً قابل عبورند.
  route: >-
    از تفلیس به غرب با E60 از کوتایسی و سامترِدیا، سپس به جنوب در جادهٔ ساحلی از کنار کوبولتی — ۳۷۰ کیلومتر،
    حدود پنج ساعت و نیم، سرتاسر آسفالت. پارک در مرکز باتومی و در انتهای جنوبی بلوار است، با ورودی‌هایی
    از خیابان‌های روستاولی و گورگیلادزه. پارکینگ خیابانی پولی و در تابستان پر است، پس بهتر است خودرو را
    دو خیابان دورتر بگذارید. سوخت در کوتایسی و اوزورگتی موجود است. خودروی اقتصادی کافی است.
he:
  name: פארק 6 במאי ודולפינריום באטומי
  short: >-
    הפארק העתיק ביותר בבאטומי, ובו אגם קטן, פינת חי ודולפינריום שפועל עוד מן התקופה הסובייטית.
  body: >-
    **פארק 6 במאי הוא הגן הציבורי העתיק ביותר בבאטומי,** שתוכנן ב-1881 כשהעיר הפכה לנמל חופשי של האימפריה
    הרוסית ובוטנאים החלו לבחון כאן מינים סובטרופיים. הוא עדיין הליבה הירוקה של המרכז: מגנוליות, חורשות
    במבוק, עצי קמפור ואקליפטוסים שהיה להם מאה שנה להגיע לגובה מלא.

    במרכזו שוכן אגם נוריגלי, קטן ועגול, עם סירות משוטים ושביל מעקה סביב הגדה. בערבי קיץ נדמה שחצי מן העיר
    מקיפה אותו. שלושת המוסדות המרכזיים של הפארק יושבים סביב אותם מים:

    - **הדולפינריום**, שנפתח ב-1975 והיה מן הראשונים בברית המועצות; המבנה נבנה מחדש בשנות העשרים, המופע
    קצר והאולם קטן

    - **האקווריום**, הבנוי סביב מיני הים השחור ומעניין יותר לילדים מאשר למבוגרים

    - **פינת חי** צנועה, מטופחת בבירור יותר מכפי שהייתה לפני עשור

    על הדולפינריום ראוי לומר בגלוי את מה שרוב המדריכים אינם אומרים. זה אינו מרכז ימי אירופי מודרני, הבריכה
    קטנה, ומי שיש לו התנגדות עקרונית להחזקת דולפינים בשבי מוטב שיוותר. מי שכן נכנס, כדאי שיזמין מראש —
    ביולי ובאוגוסט המופעים מתמלאים.

    הפארק עצמו חינם ופתוח כל השנה. בחורף, כשהטיילת מתרוקנת, כאן עדיין מתאספים: זקנים משחקים שש-בש, ילדי
    בית ספר רצים סביב האגם. באביב פורחות המגנוליות פחות או יותר יחד במשך כשבועיים, ואלה שבועיים הפארק
    היפים בשנה.
  tip: >-
    ארבעים דקות מספיקות לפארק; עם מופע דולפינים תגיעו לשעתיים. רק המופע דורש כרטיס, הכניסה לפארק חינם.
    ביולי ובאוגוסט הזמינו מראש. השורות הראשונות באולם נרטבות. שירותים יש בתוך הפארק ובתי קפה לאורך הגדה
    הצפונית של האגם. השבילים מישוריים ועבירים לגמרי בכיסא גלגלים או בעגלה.
  route: >-
    מטביליסי מערבה בכביש E60 דרך קוטאיסי וסמטרדיה, ואז דרומה בכביש החוף על יד קובולטי — 370 ק״מ, כחמש
    שעות וחצי, סלול לכל האורך. הפארק נמצא במרכז באטומי בקצה הדרומי של השדרה, עם כניסות מרחובות רוסתאוולי
    וגורגילאדזה. החניה ברחוב בתשלום ומלאה בקיץ, ולכן קל יותר להשאיר את הרכב שני רחובות פנימה. תדלוק בקוטאיסי
    ובאוזורגטי. רכב חסכוני מספיק.
ar:
  name: حديقة السادس من مايو ودولفيناريوم باتومي
  short: >-
    أقدم حدائق باتومي، وفيها بحيرة صغيرة وركن للحيوانات ودولفيناريوم يعمل منذ العهد السوفيتي.
  body: >-
    **حديقة السادس من مايو أقدم حديقة عامة في باتومي،** أُنشئت عام 1881 حين صارت المدينة ميناءً حراً للإمبراطورية
    الروسية وبدأ علماء النبات تجربة الأنواع شبه الاستوائية فيها. وما زالت النواة الخضراء لوسط المدينة:
    ماغنوليا وأجمات خيزران وأشجار كافور وكينا نالت قرناً كاملاً لتبلغ ارتفاعها التام.

    في وسطها تقع بحيرة نوريغيلي، صغيرة مستديرة، بقوارب تجديف وممشى بسياج حول الضفة. وفي أمسيات الصيف يبدو
    أن نصف المدينة يدور حولها. وتقوم مؤسسات الحديقة الثلاث عند هذا الماء:

    - **الدولفيناريوم**، افتُتح عام 1975 وكان من الأوائل في الاتحاد السوفيتي؛ أُعيد بناء المبنى في عشرينيات
    القرن، والعرض قصير والقاعة صغيرة

    - **الحوض المائي**، مبني حول أنواع البحر الأسود وهو أمتع للأطفال منه للكبار

    - **ركن حيوانات** متواضع، لكنه أفضل عناية بوضوح مما كان قبل عقد

    ويجدر القول بصراحة عن الدولفيناريوم ما لا تقوله الأدلة عادة. هذا ليس مركزاً بحرياً أوروبياً حديثاً،
    والحوض صغير، ومن لديه اعتراض مبدئي على حبس الدلافين فالأفضل أن يتجاوزه ببساطة. ومن يدخل فليحجز مسبقاً؛
    ففي يوليو وأغسطس تمتلئ العروض.

    أما الحديقة نفسها فمجانية ومفتوحة طوال العام. وفي الشتاء، حين يخلو الشارع البحري، يبقى الناس يجتمعون
    هنا: شيوخ يلعبون الطاولة وتلاميذ يركضون حول البحيرة. وفي الربيع تُزهر أشجار الماغنوليا معاً تقريباً
    نحو أسبوعين، وهما أجمل أسبوعين في سنة الحديقة.
  tip: >-
    أربعون دقيقة تكفي للحديقة؛ ومع عرض الدلافين تصير ساعتين. العرض وحده يحتاج تذكرة، والدخول إلى الحديقة
    مجاني. احجز مسبقاً في يوليو وأغسطس. الصفوف الأولى في القاعة تبتل. دورات المياه داخل الحديقة والمقاهي
    على الضفة الشمالية للبحيرة. الممرات مستوية وصالحة تماماً لكرسي متحرك أو عربة أطفال.
  route: >-
    من تبليسي غرباً على E60 عبر كوتايسي وسامتريديا، ثم جنوباً على طريق الساحل بمحاذاة كوبوليتي — 370 كم،
    نحو خمس ساعات ونصف، معبّد كله. الحديقة في وسط باتومي عند الطرف الجنوبي من الشارع البحري، ومداخلها
    من شارعي روستافيلي وغورغيلادزه. الوقوف في الشارع مدفوع وممتلئ صيفاً، فالأسهل ترك السيارة على بعد شارعين
    نحو الداخل. الوقود متوفر في كوتايسي وأوزورغيتي. وسيارة اقتصادية تكفي.
