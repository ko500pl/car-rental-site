ka:
  name: 6 მაისის პარკი და ბათუმის დელფინარიუმი
  short: >-
    ნურიგელის ტბის გარშემო გაშენებული ძველი პარკი და დელფინარიუმი, რომლის კედელზე 1974 წლის მოზაიკის დელფინები
    დღემდე მიცურავენ.
  body: >-
    **ბათუმის ყველაზე გულწრფელი დელფინები მოზაიკისაა: 1974 წელს დელფინარიუმის გარე კედელზე ზაურ წულაძემ
    და ვაჟა ბჯალავამ დელფინების გუნდი და ბიკინიანი მოცურავე ქალები ჩააწყვეს.**


    პარკი ნურიგელის ტბის გარშემოა გაშენებული და მისი ისტორია ბულვარისას ეხლართება. 1881 წელს, როცა სამხედრო
    გუბერნატორმა სმეკალოვმა ბათუმის ბულვარის გაშენება ჩაიფიქრა, ადგილი სწორედ ამ ტბის ჩრდილო-აღმოსავლეთ
    ნაპირზე შეარჩიეს და გასაშენებლად გერმანელი მებაღე რესლერი მოიწვიეს. ძველი ქალაქიდან აქეთ თუ ფეხით
    წამოხვალთ, მოდერნის ფასადები, ჩუქურთმიანი კარები და რკინის აივნები თითქმის პარკის ჭიშკრამდე გაგყვებათ.


    დღეს ეს ცენტრის მწვანე, მშვიდი კუნძულია: ჩრდილიანი ხეივნები, ტბის ირგვლივ მოაჯირიანი ბილიკი, პატარა
    აკვარიუმი და ზოოკუთხე. ზაფხულის საღამოს ტბის წრე ოჯახებით ივსება; შუადღის ხვატში კი ბათუმში ამაზე
    უკეთეს ჩრდილს ძნელად იპოვით.


    დელფინარიუმი საბჭოთა ხანაში გაჩნდა, განახლებული შენობა 2010 წელს გაიხსნა. ამაზე პირდაპირ უნდა ითქვას
    ის, რასაც სარეკლამო ბროშურები არ ამბობენ: ეს ტყვეობაში მყოფი დელფინების შოუა პატარა აუზში, და ვისაც
    ეს არ მოსწონს, სინდისის ქენჯნის გარეშე შეუძლია გვერდი აუაროს. ველური დელფინები ბათუმთან ზღვაში ხშირად
    ჩანან, განსაკუთრებით მზის ჩასვლისას, ნავსადგურთან და „ალი და ნინოს“ მიდამოებში.


    ჯერ ისინი ნახეთ, ნავმისადგომიდან, დაისის შუქზე — და მხოლოდ მერე გადაწყვიტეთ, ბილეთი კიდევ გჭირდებათ
    თუ არა.
  tip: >-
    პარკის შემოვლას ორმოციოდე წუთი სჭირდება, დელფინარიუმის სეანსით — დაახლოებით ორი საათი. პარკში შესვლა
    უფასოა, ბილეთი მხოლოდ შოუზეა საჭირო; ივლის-აგვისტოში სეანსები ივსება, ამიტომ ბილეთი წინასწარ აიღეთ.
    დარბაზის წინა რიგებში შეიძლება დაგასხათ წყალი. ბილიკები სწორია და ბავშვის ეტლითა თუ სავარძელ-ეტლით
    ადვილად გადაადგილდებით. მოზაიკა დელფინარიუმის გარე კედელზეა და ბილეთს არ მოითხოვს — შოუზე თუ არ შეხვალთ,
    მისთვის მაინც გამოყავით რამდენიმე წუთი. ველური დელფინების საძებნელად დაისისას ნავსადგურისა და „ალი
    და ნინოს“ მხარეს გაისეირნეთ.
  route: >-
    თბილისიდან 370 კილომეტრი და დაახლოებით ხუთნახევარი საათია, ბოლომდე ასფალტით. E60-ით ქუთაისისა და სამტრედიის
    გავლით მიდიხართ, შემდეგ S12-ით ზღვაზე გადიხართ და ქობულეთის გავლით ბათუმში შედიხართ. პარკი რუსთაველის
    გამზირზეა, ევროპის მოედნიდან დაახლოებით კილომეტრით სამხრეთ-დასავლეთით; შესასვლელები რუსთაველისა და
    გორგილაძის ქუჩებიდანაა. ქუჩის პარკინგი ფასიანია და ზაფხულში გადატვირთული, ამიტომ მანქანა ორიოდე კვარტალით
    შორს დატოვეთ. საწვავი ქუთაისში ან ქობულეთში ჩაასხით. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: 6 May Park and Batumi Dolphinarium
  short: >-
    An old lakeside park in central Batumi and a dolphinarium whose 1974 mosaic dolphins still swim across
    its outer wall.
  body: >-
    **Batumi's most honest dolphins have never been wet: a pod of them, with bikini-clad swimmers, laid
    in mosaic on the dolphinarium's outer wall by Zaur Tsuladze and Vaja Bjalava in 1974.**


    The park wraps around Lake Nurigeli, and its story is tangled up with the boulevard's. In 1881, when
    the military governor Smekalov conceived the seaside garden that became Batumi Boulevard, the site
    chosen lay on the north-east shore of this lake, and the German gardener Rössler was brought in to
    plant it. Walk here from the old town and the Art Nouveau facades, carved doors and iron balconies
    keep you company almost to the gate.


    Today it is a quiet green island in the centre: shaded alleys, a railed path around the water, a small
    aquarium and a zoo corner. On summer evenings the loop around the lake fills with families; in the
    midday heat there is little better shade in Batumi.


    The dolphinarium dates from Soviet times, and its rebuilt hall opened in 2010. It deserves the plain
    word most listings avoid: this is a show of captive dolphins in a small pool, and anyone uneasy about
    that can skip it with a clear conscience. Wild dolphins are often seen off Batumi, especially around
    sunset near the port and Ali and Nino.


    Look for them first, from the pier in the evening light, and only then decide if you still need a
    ticket.
  tip: >-
    Forty minutes covers the park; with a dolphin show allow about two hours. Entry to the park is free
    and only the show needs a ticket; sessions fill up in July and August, so book ahead. The front rows
    can get splashed. Paths are flat and easy with a pushchair or wheelchair. The mosaic is on the outside
    wall and costs nothing to see, so give it a few minutes even if you skip the show. For wild dolphins,
    walk towards the port and Ali and Nino around sunset.
  route: >-
    From Tbilisi it is 370 km, about five and a half hours on asphalt all the way. Take the E60 through
    Kutaisi to Samtredia, then the S12 to the coast and south through Kobuleti into Batumi. The park is
    on Rustaveli Avenue, about a kilometre south-west of Europe Square, with entrances from Rustaveli
    and Gorgiladze streets. Street parking is paid and crowded in summer, so leave the car a couple of
    blocks away. Fuel up in Kutaisi or Kobuleti. An economy car is entirely sufficient.
ru:
  name: Парк 6 Мая и Батумский дельфинарий
  short: >-
    Старый парк у озера в центре Батуми и дельфинарий, на внешней стене которого до сих пор плывут мозаичные
    дельфины 1974 года.
  body: >-
    **Самые честные дельфины Батуми никогда не бывали в воде: стаю дельфинов и купальщиц в бикини выложили
    мозаикой на внешней стене дельфинария в 1974 году Заур Цуладзе и Важа Бджалава.**


    Парк раскинулся вокруг озера Нуригели, и его история переплетена с историей бульвара. В 1881 году,
    когда военный губернатор Смекалов задумал приморский сад, ставший потом Батумским бульваром, место
    для него выбрали на северо-восточном берегу этого озера, а разбить его пригласили немецкого садовника
    Рёсслера. Если идти сюда от старого города пешком, модерновые фасады, резные двери и чугунные балконы
    будут сопровождать вас почти до самых ворот парка.


    Сегодня это тихий зелёный островок в центре: тенистые аллеи, дорожка с перилами вокруг воды, небольшой
    аквариум и живой уголок. В летний вечер круг вокруг озера заполняют семьи; в полуденную жару лучшей
    тени в Батуми не найти.


    Дельфинарий появился в советское время, а обновлённое здание открылось в 2010 году. Здесь стоит сказать
    прямо то, о чём молчат рекламные брошюры: это шоу дельфинов в неволе в небольшом бассейне, и тем,
    кому это не по душе, можно спокойно пройти мимо. Диких дельфинов у берегов Батуми часто видят, особенно
    на закате, у порта и рядом с «Али и Нино».


    Сначала посмотрите на них с пирса, в вечернем свете, — а уже потом решайте, нужен ли вам билет.
  tip: >-
    На обход парка нужно около сорока минут, с сеансом дельфинария — около двух часов. Вход в парк бесплатный,
    билет нужен только на шоу; в июле-августе сеансы заполняются, так что берите билет заранее. В первых
    рядах зала может обрызгать водой. Дорожки ровные, с детской коляской или инвалидным креслом пройти
    легко. Мозаика — на внешней стене дельфинария, смотреть её бесплатно, так что уделите ей пару минут,
    даже если не идёте на шоу. Чтобы увидеть диких дельфинов, прогуляйтесь на закате в сторону порта и
    «Али и Нино».
  route: >-
    От Тбилиси 370 км, около пяти с половиной часов, дорога заасфальтирована целиком. Двигайтесь по E60
    через Кутаиси до Самтредиа, затем по S12 к побережью и на юг через Кобулети в Батуми. Парк находится
    на проспекте Руставели, примерно в километре юго-западнее площади Европы; входы — с улиц Руставели
    и Горгиладзе. Уличная парковка платная и летом переполнена, так что оставьте машину в паре кварталов.
    Заправляйтесь в Кутаиси или Кобулети. Машины экономкласса вполне достаточно.
fa:
  name: پارک ششم مه و دلفیناریوم باتومی
  short: >-
    پارکی کهن کنار دریاچه در مرکز باتومی، و دلفیناریومی که دلفین‌های موزاییکی سال ۱۹۷۴ آن هنوز بر دیوار
    بیرونی‌اش شنا می‌کنند.
  body: >-
    **صادق‌ترین دلفین‌های باتومی هرگز خیس نشده‌اند: در سال ۱۹۷۴، زائور تسولادزه و واژا بجالاوا دسته‌ای
    از دلفین‌ها و شناگرانی با بیکینی را با موزاییک بر دیوار بیرونی دلفیناریوم چیدند.**


    پارک گرداگرد دریاچهٔ نوریگلی گسترده است و تاریخش با تاریخ بلوار گره خورده است. در سال ۱۸۸۱، هنگامی
    که فرماندار نظامی، اسمکالوف، باغ ساحلی‌ای را در سر داشت که بعدها بلوار باتومی شد، مکان آن را بر ساحل
    شمال‌شرقی همین دریاچه برگزیدند و باغبان آلمانی، رسلر، را برای کاشتنش فراخواندند. اگر از شهر قدیم پیاده
    به این‌جا بیایید، نماهای سبک آر نوو، درهای منبت‌کاری‌شده و بالکن‌های آهنی تا نزدیک دروازهٔ پارک همراه‌تان
    خواهند بود.


    امروز این‌جا جزیره‌ای آرام و سرسبز در دل مرکز شهر است: کوچه‌باغ‌های سایه‌دار، مسیری نرده‌دار گرداگرد
    آب، آکواریومی کوچک و گوشه‌ای برای حیوانات. در عصرهای تابستان، دور دریاچه از خانواده‌ها پر می‌شود؛
    و در گرمای نیمروز، سایه‌ای بهتر از این در باتومی به‌سختی می‌یابید.


    دلفیناریوم از دوران شوروی برجاست و ساختمان بازسازی‌شده‌اش در سال ۲۰۱۰ گشوده شد. این‌جا باید همان چیزی
    گفته شود که بروشورهای تبلیغاتی نمی‌گویند: این نمایشی از دلفین‌های اسیر در حوضی کوچک است، و هر کس از
    این کار دل خوشی ندارد، می‌تواند با وجدانی آسوده از آن بگذرد. دلفین‌های وحشی را اغلب در سواحل باتومی
    می‌بینند، به‌ویژه هنگام غروب، در نزدیکی بندر و اطراف «علی و نینو».


    نخست آن‌ها را از اسکله، در نور غروب، ببینید — و تنها پس از آن تصمیم بگیرید که آیا هنوز به بلیت نیاز
    دارید.
  tip: >-
    چهل دقیقه برای گشتن پارک کافی است؛ با یک برنامهٔ دلفیناریوم، حدود دو ساعت. ورود به پارک رایگان است
    و بلیت تنها برای نمایش لازم است؛ در ژوئیه و اوت برنامه‌ها پر می‌شوند، پس بلیت را زودتر تهیه کنید.
    ردیف‌های جلویی سالن ممکن است خیس شوند. مسیرها هموارند و با کالسکه یا ویلچر به‌راحتی می‌توان گذشت.
    موزاییک بر دیوار بیرونی دلفیناریوم است و دیدنش رایگان است، پس حتی اگر به نمایش نمی‌روید چند دقیقه
    برایش بگذارید. برای یافتن دلفین‌های وحشی هنگام غروب به‌سوی بندر و «علی و نینو» قدم بزنید.
  route: >-
    از تفلیس ۳۷۰ کیلومتر است، حدود پنج ساعت و نیم، تمامًا آسفالته. از E60 از میان کوتایسی تا سامترِدیا
    بروید، سپس از S12 به ساحل برسید و به‌سوی جنوب، از میان کوبولتی، به باتومی وارد شوید. پارک در خیابان
    روستاولی است، حدود یک کیلومتر جنوب‌غربی میدان اروپا؛ ورودی‌ها از خیابان‌های روستاولی و گورگیلادزه‌اند.
    پارکینگ خیابانی پولی است و در تابستان پرازدحام، پس ماشین را چند بلوک دورتر بگذارید. در کوتایسی یا
    کوبولتی سوخت‌گیری کنید. خودروی اقتصادی کاملاً کافی است.
he:
  name: פארק 6 במאי ודולפינריום בטומי
  short: פארק ישן על שפת אגם במרכז בטומי, ודולפינריום שדולפיני הפסיפס שלו משנת 1974 עדיין שוחים על קירו
    החיצוני.
  body: >-
    **הדולפינים הכנים ביותר בבטומי מעולם לא נרטבו: להקת דולפינים ורוחצות בביקיני, בפסיפס על הקיר החיצוני
    של הדולפינריום, יצרו זאור צולדזה וואז'ה בג'לאווה ב-1974.**


    הפארק עוטף את אגם נוריגלי, וסיפורו שלוב בסיפור הטיילת. ב-1881, כשהמושל הצבאי סמקלוב הגה את גן החוף
    שהפך לימים לטיילת של בטומי, המקום שנבחר היה על החוף הצפון-מזרחי של אגם זה, והגנן הגרמני רסלר הוזמן
    לשתול אותו. אם תבואו לכאן ברגל מהעיר העתיקה, חזיתות ארט נובו, דלתות מגולפות ומרפסות ברזל ילוו אתכם
    כמעט עד שער הפארק.


    היום זהו אי ירוק ושקט במרכז העיר: שדרות מוצללות, שביל מגודר סביב המים, אקווריום קטן ופינת חי. בערבי
    קיץ מתמלא השביל סביב האגם במשפחות; בחום הצהריים קשה למצוא צל טוב יותר בבטומי.


    הדולפינריום קיים מהתקופה הסובייטית, והבניין המחודש נפתח ב-2010. כאן כדאי לומר בפה מלא את מה שהחוברות
    הפרסומיות שותקות לגביו: זהו מופע של דולפינים בשבי בבריכה קטנה, ומי שלא נוח לו עם זה יכול לדלג עליו
    בלב שקט. דולפינים חופשיים נראים לעיתים קרובות בים השחור סמוך לבטומי, בעיקר בשעת השקיעה, לצד הנמל ובאזור
    "עלי וננו".


    חפשו אותם קודם, מהמזח, באור הערב — ורק אחר כך הכריעו אם עדיין דרוש לכם כרטיס.
  tip: >-
    ארבעים דקות מספיקות לסיבוב בפארק; עם מופע דולפינריום, כשעתיים. הכניסה לפארק חינם, וכרטיס דרוש רק למופע;
    ביולי ואוגוסט המופעים מתמלאים, אז הזמינו כרטיס מראש. השורות הקדמיות באולם עלולות להתרטב. השבילים מישוריים
    ונוחים לעגלת תינוק או לכיסא גלגלים. הפסיפס נמצא על הקיר החיצוני ואינו עולה כלום, אז הקדישו לו כמה
    דקות גם אם אתם מדלגים על המופע. לדולפינים חופשיים, צאו לכיוון הנמל ו"עלי וננו" בשעת השקיעה.
  route: >-
    מטביליסי המרחק הוא 370 ק"מ, כחמש שעות וחצי, סלול לכל אורכו. סעו בכביש E60 דרך קוטאיסי עד סמטרדיה,
    ואז ב-S12 לחוף ומשם דרומה דרך קובולטי לבטומי. הפארק נמצא בשדרות רוסתוולי, כקילומטר דרום-מערבית לכיכר
    אירופה; הכניסות מרחובות רוסתוולי וגורגילדזה. החנייה ברחוב בתשלום ועמוסה בקיץ, אז השאירו את הרכב כמה
    רחובות משם. תדלקו בקוטאיסי או בקובולטי. רכב אקונומי מספיק בהחלט.
ar:
  name: حديقة 6 مايو ودولفيناريوم باتومي
  short: >-
    حديقة قديمة على بحيرة في وسط باتومي، ودولفيناريوم لا تزال دلافين الفسيفساء فيه، من عام 1974، تسبح
    على جداره الخارجي.
  body: >-
    **أصدق دلافين باتومي لم تبتلّ قط: سربًا من الدلافين وسبّاحات بالبيكيني، رصفه بالفسيفساء على الجدار
    الخارجي للدولفيناريوم زاؤور تسولادزه وفاجا بجالافا عام 1974.**


    تلتفّ الحديقة حول بحيرة نوريغيلي، وقصتها متشابكة مع قصة الكورنيش. في عام 1881، عندما تصوّر الحاكم
    العسكري سميكالوف الحديقة الساحلية التي صارت لاحقًا كورنيش باتومي، اختير موقعها على الضفة الشمالية
    الشرقية من هذه البحيرة نفسها، واستُدعي البستاني الألماني روسلر لغرسها. إن مشيت إلى هنا من المدينة
    القديمة، فستلازمك واجهات الآرت نوفو والأبواب المنحوتة والشرفات الحديدية حتى تكاد تبلغ بوابة الحديقة.


    اليوم هي جزيرة خضراء هادئة في وسط المدينة: ممرات ظليلة، طريق محاط بدرابزين حول الماء، حوض أسماك صغير
    وزاوية للحيوانات. في مساءات الصيف يمتلئ الممشى حول البحيرة بالعائلات؛ وفي حرّ الظهيرة يصعب أن تجد
    في باتومي ظلًّا أفضل من هذا.


    يعود الدولفيناريوم إلى العهد السوفييتي، وافتُتح مبناه المُجدَّد عام 2010. وهنا يجدر أن يُقال بصراحة
    ما تتجنّبه كتيّبات الدعاية: هذا عرض لدلافين أسيرة في حوض صغير، ومن لا يستريح لهذه الفكرة يستطيع تجاوز
    العرض بضمير مطمئن. أما الدلافين البرّية فتُرى كثيرًا قرب باتومي، خاصة عند الغروب، بجانب الميناء وحول
    تمثالي "علي ونينو".


    ابحث عنها أولًا، من الرصيف، في ضوء المساء — وبعد ذلك فقط قرّر إن كنت لا تزال بحاجة إلى تذكرة.
  tip: >-
    تكفي أربعون دقيقة لجولة في الحديقة؛ ومع عرض الدولفيناريوم، نحو ساعتين. الدخول إلى الحديقة مجاني، والتذكرة
    مطلوبة فقط للعرض؛ وفي يوليو وأغسطس تمتلئ الجلسات، فاحجز التذكرة مسبقًا. قد تتعرّض الصفوف الأمامية
    في القاعة للرشّ بالماء. الممرات مستوية وسهلة مع عربة طفل أو كرسي متحرك. الفسيفساء على الجدار الخارجي
    ورؤيتها مجانية، فخصّص لها بضع دقائق حتى إن تجاوزت العرض. للبحث عن الدلافين البرّية، تمشَّ عند الغروب
    نحو الميناء وتمثالي "علي ونينو".
  route: >-
    تبعد باتومي عن تبليسي 370 كم، أي نحو خمس ساعات ونصف، على طريق معبّد بالكامل. سِر على الطريق E60 عبر
    كوتايسي إلى سامتريديا، ثم على S12 إلى الساحل، ثم جنوبًا عبر كوبوليتي إلى باتومي. تقع الحديقة على شارع
    روستافيلي، على نحو كيلومتر جنوب غرب ساحة أوروبا؛ والمدخلان من شارعي روستافيلي وغورغيلادزه. مواقف الشوارع
    مدفوعة ومزدحمة في الصيف، فاترك السيارة على بُعد حيّين. تزوّد بالوقود في كوتايسي أو كوبوليتي. تكفي
    سيارة اقتصادية تمامًا.
