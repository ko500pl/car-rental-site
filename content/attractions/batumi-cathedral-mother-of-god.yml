ka:
  name: ბათუმის ღვთისმშობლის სახელობის საკათედრო ტაძარი
  short: >-
    ღია ფერის ქვის ნეოგოთიკური ტაძარი: 1898–1903 წლებში ქართველ კათოლიკეთათვის აშენდა, საბჭოთა დროს ფიზიკის
    ლაბორატორია იყო, დღეს ბათუმის საკათედრო ტაძარია.
  body: >-
    **საქართველოში ცოტა შენობას თუ შეუცვლია რწმენაც და დანიშნულებაც იმდენჯერ, რამდენჯერაც ამას: ის კათოლიკეებისთვის
    აშენდა, საბჭოთა ფიზიკოსებს დაუთმეს და ბოლოს მართლმადიდებელ ეკლესიას გადაეცა.**


    ამბავი ძმებ ზუბალაშვილებით იწყება — ქართველი კათოლიკე ვაჭრებითა და ქველმოქმედებით, რომლებმაც ბათუმში
    ახალი ეკლესიის მშენებლობა დააფინანსეს და მთავარი კონტრაქტორებიც თავად იყვნენ. პოლონელმა არქიტექტორმა
    ალექსანდრე როგოისკიმ მათ ნეოგოთიკური ნაგებობა შეუქმნა: ისრული თაღები, ღია ფერის ქვაზე ამოკვეთილი რელიეფები
    და შესასვლელის ორივე მხარეს ორი სიმეტრიული კოშკი ციცაბო შპილებით. მშენებლობა 1898 წელს დაიწყო და 1903
    წელს დასრულდა. ქალაქის პალმებსა და აივნებს შორის ტაძარი დღესაც ჩრდილოეთ ევროპიდან ჩამოსულ სტუმარს
    ჰგავს.


    1930-იან წლებში საბჭოთა ანტირელიგიურმა კამპანიამ ის დახურა და ათწლეულების განმავლობაში ნავში მაღალი
    ძაბვის ფიზიკის ლაბორატორია იყო განთავსებული. 1989 წელს, გარდაქმნის წლებში, შენობა საქართველოს მართლმადიდებელ
    ეკლესიას გადაეცა; დღეს აქ ბათუმისა და ლაზეთის ეპისკოპოსის კათედრაა. ქალაქის კათოლიკეები ახლა ახალ,
    სულიწმიდის სახელობის ეკლესიაში ლოცულობენ, რომელიც 2000 წელს აკურთხეს.


    შიგნით ორი ტრადიცია ერთმანეთზეა დაშრევებული. არქიტექტურა ისევ გოთიკურია: ერთნავიანი დარბაზი ნეკნოვანი
    კამარებით, მაღალი ლანცეტისებრი სარკმლები, ქვის აჟურული ჩუქურთმა. მორთულობა კი მართლმადიდებლურია და
    1989 წლის შემდეგ გაჩნდა: კანკელი მოოქროვილი ხატებით და ღვთისმშობლის ცხოვრების ამსახველი ფრესკები.
    ზღვის ნესტიანი ჰაერი ქვის ჩუქურთმას არ ინდობს, ამიტომ ფასადებს დროდადრო რესტავრაცია სჭირდება.


    წირვისას უკანა რიგში დადექით და გაიგონებთ, როგორ ადის ქართული გალობა კამარებში, რომლებიც ოდესღაც ლათინური
    მესისთვის აღიმართა.
  tip: >-
    მსახურებებს შორის შესვლა უფასოა, ნახევარი საათიც საკმარისია. ჩაიცვით ისე, როგორც ნებისმიერ ქართულ
    ეკლესიაში: მხრები და მუხლები დაფარული, ქალებს — თავსაფარი, რომელიც, როგორც წესი, კარებთანაც არის.
    კვირა დილის წირვაზე ყველაზე ხალხმრავლადაა: მაშინ გალობისთვის მოდით, არქიტექტურის სანახავად კი — სამუშაო
    დღის მშვიდ ნაშუადღევს. მლოცველებს ნუ გადაიღებთ, მსახურებისას კი კამერას კანკელისკენ ნუ მიმართავთ.
    ორი კოშკის საუკეთესო ხედი ქუჩის მეორე მხრიდან იშლება. ორთა ჯამე, პიაცა და ბულვარი ახლოსაა, ასე რომ,
    ტაძარი ძველი ქალაქის სასეირნო მარშრუტში ადვილად ჩაჯდება.
  route: >-
    ბათუმამდე თბილისიდან დაახლოებით 370 კილომეტრი და ხუთნახევარი საათია. ს1 (E60) მაგისტრალით გაიარეთ
    გორი, ხაშური, რიკოთის გვირაბები და ქუთაისი სამტრედიამდე, შემდეგ ს12-ით ლანჩხუთის გავლით გრიგოლეთამდე,
    იქიდან კი ზღვისპირა ს2-ით (E70) სამხრეთით, ქობულეთის გავლით, ქალაქში შედით. გზა ბოლომდე ასფალტია,
    დიდწილად ოთხზოლიანი, ეკონომკლასის მანქანა სავსებით საკმარისია, საწვავიც ყველგან იშოვება. ტაძარი ბათუმის
    ცენტრშია, ბულვარიდან ფეხით რამდენიმე წუთში. ქუჩაში პარკირების ადგილი ზაფხულში ცოტაა, ამიტომ ფასიანი
    ავტოსადგომი ან სასტუმროს პარკინგი უფრო მშვიდი არჩევანია.
en:
  name: Batumi Cathedral of the Mother of God
  short: >-
    A Gothic Revival church of pale stone, built for Georgian Catholics in 1898–1903, a physics laboratory
    in Soviet years, now Batumi's Orthodox cathedral.
  body: >-
    **Few buildings in Georgia have changed faith and purpose as often as this one: it was built for Catholics,
    given over to Soviet physicists and finally handed to the Orthodox Church.**


    The story begins with the Zubalashvili brothers, Georgian Catholic merchants and philanthropists,
    who paid for a new church in Batumi and acted as its main contractors. The Polish architect Aleksander
    Rogojski gave them Gothic Revival: pointed arches, carved reliefs in light-coloured stone, and two
    symmetrical towers with steep spires either side of the entrance. Work began in 1898 and ended in
    1903. Among the palms and balconies of the city it still looks like a visitor from northern Europe.


    In the 1930s the Soviet campaign against religion closed it, and for decades the nave housed a high-voltage
    physics laboratory. In 1989, in the years of Perestroika, the building passed to the Georgian Orthodox
    Church; today it is the seat of the bishop of Batumi and Lazeti. The city's Catholics now worship
    at the modern Church of the Holy Spirit, consecrated in 2000.


    Inside, the two traditions sit one upon the other. The architecture is still Gothic: a single nave
    under rib vaults, tall lancet windows, stone tracery. The furnishings are Orthodox, added after 1989:
    an iconostasis of gilded icons and frescoes of the life of the Virgin. The damp sea air is hard on
    carved stone, and the façades need restoring every so often.


    Stand at the back during a service and you will hear Georgian chant rising into vaults that were raised
    for the Latin Mass.
  tip: >-
    Entry is free outside services, and half an hour is enough. Dress as for any Georgian church: shoulders
    and knees covered, and a headscarf for women, usually available at the door. Sunday morning liturgy
    is the busiest time; come then for the chant, or on a quiet weekday afternoon to look at the architecture.
    Do not photograph worshippers, and keep your camera away from the iconostasis during services. Step
    back across the street for the best view of the twin spires. The Orta Jame mosque, the Piazza and
    the Boulevard are all a short walk away, so the cathedral fits easily into an old-town stroll.
  route: >-
    Batumi is about 370 km and five and a half hours from Tbilisi. Take the S1 (E60) through Gori and
    Khashuri, through the Rikoti tunnels and past Kutaisi to Samtredia, then the S12 through Lanchkhuti
    to Grigoleti and the coastal S2 (E70) south through Kobuleti into the city. It is asphalt all the
    way, much of it four-lane, and an economy car is all you need; fuel is never far away. The cathedral
    stands in central Batumi, a short walk from the Boulevard. On-street parking nearby is limited in
    summer; a paid car park or your hotel's parking is less stressful.
ru:
  name: Батумский собор Богородицы
  short: >-
    Неоготический храм из светлого камня, построенный для грузин-католиков в 1898–1903 годах, при Советах
    — физическая лаборатория, ныне православный собор.
  body: >-
    **Немногие здания в Грузии столько раз меняли веру и назначение, как это: его построили для католиков,
    отдали советским физикам и в конце концов передали Православной церкви.**


    История начинается с братьев Зубалашвили — грузинских купцов-католиков и меценатов, которые оплатили
    строительство новой церкви в Батуми и сами выступили её главными подрядчиками. Польский архитектор
    Александр Рогойский предложил им неоготику: стрельчатые арки, резные рельефы по светлому камню и две
    симметричные башни с крутыми шпилями по сторонам входа. Строительство началось в 1898 году и завершилось
    в 1903-м. Среди пальм и балконов города храм и сегодня выглядит гостем из Северной Европы.


    В 1930-х годах советская антирелигиозная кампания закрыла его, и десятилетиями в нефе размещалась
    лаборатория физики высоких напряжений. В 1989 году, в годы перестройки, здание передали Грузинской
    православной церкви; сегодня здесь кафедра епископа Батумского и Лазского. Католики города молятся
    теперь в современной церкви Святого Духа, освящённой в 2000 году.


    Внутри две традиции легли одна поверх другой. Архитектура по-прежнему готическая: однонефный зал под
    нервюрными сводами, высокие стрельчатые окна, каменное кружево. Убранство же православное и появилось
    после 1989 года: иконостас с позолоченными иконами и фрески о жизни Богородицы. Влажный морской воздух
    не щадит резной камень, и фасады время от времени приходится реставрировать.


    Встаньте в глубине храма во время службы — и услышите, как грузинское песнопение поднимается под своды,
    возведённые для латинской мессы.
  tip: >-
    Вне служб вход свободный, получаса достаточно. Одевайтесь как в любую грузинскую церковь: плечи и
    колени закрыты, женщинам — платок, его обычно можно взять у входа. Воскресная утренняя литургия —
    самое многолюдное время; приходите тогда ради песнопений или тихим будним днём после обеда — ради
    архитектуры. Не фотографируйте молящихся и не направляйте камеру на иконостас во время службы. Лучший
    вид на два шпиля — с противоположной стороны улицы. Мечеть Орта-Джаме, Пьяцца и бульвар — в нескольких
    минутах ходьбы, так что собор легко вписывается в прогулку по старому городу.
  route: >-
    Батуми — примерно в 370 км и пяти с половиной часах езды от Тбилиси. Езжайте по S1 (E60) через Гори
    и Хашури, через Рикотские тоннели и мимо Кутаиси до Самтредиа, затем по S12 через Ланчхути до Григолети
    и по прибрежной S2 (E70) на юг через Кобулети в город. Асфальт на всём пути, большая часть — четыре
    полосы, и машины эконом-класса вполне достаточно; заправки всегда недалеко. Собор стоит в центре Батуми,
    в нескольких минутах ходьбы от бульвара. Мест для парковки на улицах рядом летом мало; платная стоянка
    или парковка отеля избавят от лишних нервов.
fa:
  name: کلیسای جامع مادر خدا در باتومی
  short: >-
    کلیسایی نئوگوتیک از سنگ روشن، ساخته‌ی ۱۸۹۸ تا ۱۹۰۳ برای کاتولیک‌های گرجی، در دوران شوروی آزمایشگاه
    فیزیک، و امروز کلیسای جامع ارتدکس باتومی.
  body: >-
    **کمتر بنایی در گرجستان به اندازه‌ی این یکی کیش و کاربری عوض کرده است: برای کاتولیک‌ها ساخته شد، به
    فیزیک‌دانان شوروی سپرده شد و سرانجام به کلیسای ارتدکس رسید.**


    داستان با برادران زوبالاشویلی آغاز می‌شود، بازرگانان و نیکوکاران کاتولیک گرجی، که هزینه‌ی ساخت کلیسایی
    تازه در باتومی را پرداختند و خود پیمانکاران اصلی‌اش بودند. معمار لهستانی، آلکساندر روگویسکی، برایشان
    بنایی به سبک احیای گوتیک طراحی کرد: طاق‌های جناغی، نقش‌برجسته‌های تراشیده بر سنگ روشن، و دو برج قرینه
    با نوک‌برج‌های تیز در دو سوی ورودی. ساخت در ۱۸۹۸ آغاز شد و در ۱۹۰۳ به پایان رسید. در میان نخل‌ها و
    بالکن‌های شهر، هنوز به میهمانی از شمال اروپا می‌ماند.


    در دهه‌ی ۱۹۳۰ پویش ضددینی شوروی درهایش را بست و ده‌ها سال در شبستانش آزمایشگاه فیزیک ولتاژ بالا جای
    داشت. در ۱۹۸۹، در سال‌های پرسترویکا، بنا به کلیسای ارتدکس گرجستان واگذار شد؛ امروز مقر اسقف باتومی
    و لازتی است. کاتولیک‌های شهر اکنون در کلیسای نوساز روح‌القدس نیایش می‌کنند که در ۲۰۰۰ تقدیس شد.


    درون، دو سنت روی هم نشسته‌اند. معماری همچنان گوتیک است: شبستانی یک‌دهانه زیر طاق‌های تویزه‌دار، پنجره‌های
    بلند و نوک‌تیز، و مشبک‌کاری سنگی. اما آرایه‌ها ارتدکس‌اند و پس از ۱۹۸۹ افزوده شده‌اند: ایکونوستازی
    با شمایل‌های زراندود و دیوارنگاره‌هایی از زندگی مریم مقدس. هوای نمناک دریا با سنگ تراشیده مدارا نمی‌کند
    و نماها هر چند گاه نیازمند مرمت‌اند.


    هنگام مراسم در انتهای کلیسا بایستید تا بشنوید چگونه سرود گرجی به سوی طاق‌هایی بالا می‌رود که برای
    آیین عشای ربانی لاتینی برافراشته شده بودند.
  tip: >-
    بیرون از زمان مراسم ورود رایگان است و نیم ساعت کافی است. همان‌گونه لباس بپوشید که برای هر کلیسای گرجی:
    شانه‌ها و زانوها پوشیده، و بانوان با روسری که معمولاً دم در هم پیدا می‌شود. آیین صبح یکشنبه شلوغ‌ترین
    زمان است؛ برای شنیدن سرودها آن هنگام بیایید، یا برای دیدن معماری بعدازظهر آرام یکی از روزهای هفته.
    از نیایشگران عکس نگیرید و هنگام مراسم دوربین را از ایکونوستاز دور نگه دارید. برای بهترین منظره‌ی دو
    برج نوک‌تیز به آن سوی خیابان بروید. مسجد اورتا جامع، پیاتسا و بلوار همه چند قدم آن‌سوترند، پس کلیسا
    به‌آسانی در گشتی در شهر قدیم جا می‌گیرد.
  route: >-
    باتومی حدود ۳۷۰ کیلومتر و پنج ساعت و نیم از تفلیس فاصله دارد. با S1 (E60) از گوری و خاشوری بگذرید،
    از تونل‌های ریکوتی عبور کنید و از کنار کوتایسی تا سامتردیا برانید؛ سپس با S12 از لانچخوتی به گریگولتی
    بروید و از جاده‌ی ساحلی S2 (E70) به سوی جنوب، از کوبولتی به شهر برسید. سراسر راه آسفالت است و بیشترش
    چهاربانده، و یک خودروی اکونومی همه‌ی آن چیزی است که لازم دارید؛ جایگاه سوخت هیچ‌گاه دور نیست. کلیسا
    در مرکز باتومی است، چند قدم آن‌سوتر از بلوار. جای پارک کنار خیابان در تابستان کم است؛ پارکینگ پولی
    یا پارکینگ هتل دردسر کمتری دارد.
he:
  name: קתדרלת אם האלוהים בבטומי
  short: >-
    כנסייה ניאו-גותית מאבן בהירה, שנבנתה לקתולים גאורגים ב-1898–1903, שימשה בימי ברית המועצות מעבדה לפיזיקה,
    והיום היא הקתדרלה האורתודוקסית של בטומי.
  body: >-
    **מעט בניינים בגאורגיה החליפו אמונה וייעוד פעמים רבות כל כך כמו זה: הוא נבנה לקתולים, נמסר לפיזיקאים
    סובייטים ולבסוף הועבר לכנסייה האורתודוקסית.**


    הסיפור מתחיל באחים זובלאשווילי, סוחרים ונדבנים גאורגים קתולים, שמימנו כנסייה חדשה בבטומי ושימשו גם
    הקבלנים הראשיים שלה. האדריכל הפולני אלכסנדר רוגויסקי תכנן עבורם מבנה בסגנון התחייה הגותית: קשתות מחודדות,
    תבליטים מגולפים באבן בהירה, ושני מגדלים סימטריים עם צריחים תלולים משני צידי הכניסה. הבנייה החלה ב-1898
    והסתיימה ב-1903. בין עצי הדקל והמרפסות של העיר היא עדיין נראית כמו אורחת מצפון אירופה.


    בשנות ה-30 סגר אותה המסע האנטי-דתי הסובייטי, ובמשך עשורים שכנה באולם המרכזי מעבדה לפיזיקה של מתח גבוה.
    ב-1989, בשנות הפרסטרויקה, הועבר הבניין לכנסייה האורתודוקסית הגאורגית; היום זהו מושבו של הבישוף של
    בטומי ולאזתי. הקתולים של העיר מתפללים כעת בכנסיית רוח הקודש המודרנית, שהוקדשה ב-2000.


    בפנים מונחות שתי המסורות זו על גבי זו. האדריכלות עדיין גותית: אולם בעל ספינה אחת תחת קמרונות צלעות,
    חלונות גבוהים מחודדים, עיטורי תחרה באבן. הריהוט, לעומת זאת, אורתודוקסי ונוסף אחרי 1989: איקונוסטזיס
    — קיר איקונות מוזהבות — וציורי קיר מחיי מרים הבתולה. אוויר הים הלח אינו חומל על אבן מגולפת, והחזיתות
    זקוקות לשחזור מדי כמה שנים.


    עמדו בירכתי הכנסייה בזמן תפילה, ותשמעו את הזמרה הגאורגית עולה אל קמרונות שהוקמו למיסה הלטינית.
  tip: >-
    הכניסה חינם מחוץ לזמני התפילה, וחצי שעה מספיקה. התלבשו כמו לכל כנסייה גאורגית: כתפיים וברכיים מכוסות,
    ומטפחת ראש לנשים, שבדרך כלל אפשר לקבל בכניסה. הליטורגיה של יום ראשון בבוקר היא הזמן העמוס ביותר; בואו
    אז בשביל הזמרה, או באחר צהריים שקט של יום חול בשביל האדריכלות. אל תצלמו מתפללים, והרחיקו את המצלמה
    מהאיקונוסטזיס בזמן התפילה. את המבט הטוב ביותר על שני הצריחים תקבלו מהצד השני של הרחוב. מסגד אורטה
    ג'אמע, הפיאצה והשדרה נמצאים כולם במרחק הליכה קצר, כך שהקתדרלה משתלבת בקלות בשיטוט בעיר העתיקה.
  route: >-
    בטומי נמצאת כ-370 ק"מ וחמש שעות וחצי נסיעה מטביליסי. סעו בכביש S1 (E60) דרך גורי וחשורי, דרך מנהרות
    ריקוטי ועל פני קוטאיסי עד סמטרדיה; משם בכביש S12 דרך לנצ'חוטי עד גריגולטי, ובכביש החוף S2 (E70) דרומה
    דרך קובולטי אל העיר. סלול לכל אורכו, רובו בארבעה נתיבים, ורכב אקונומי הוא כל מה שצריך; תחנת דלק אף
    פעם לא רחוקה. הקתדרלה עומדת במרכז בטומי, במרחק הליכה קצר מהשדרה. בקיץ יש מעט מקומות חנייה ברחובות
    הסמוכים; חניון בתשלום או החנייה של המלון יחסכו לכם עצבים.
ar:
  name: كاتدرائية والدة الإله في باتومي
  short: >-
    كنيسة قوطية جديدة من حجر فاتح، شُيّدت للكاثوليك الجورجيين بين 1898 و1903، وصارت مختبر فيزياء زمن السوفييت،
    واليوم كاتدرائية باتومي الأرثوذكسية.
  body: >-
    **قلّما غيّر مبنى في جورجيا دينه ووظيفته مرّاتٍ بقدر ما فعل هذا: بُني للكاثوليك، ثم سُلّم لعلماء الفيزياء
    السوفييت، وآل أخيرًا إلى الكنيسة الأرثوذكسية.**


    تبدأ الحكاية بالأخوين زوبالاشفيلي، التاجرين والمحسنين الجورجيين الكاثوليكيين، اللذين موّلا بناء كنيسة
    جديدة في باتومي وتولّيا بنفسيهما دور المقاولين الرئيسيين. وصمّم لهما المعماري البولندي ألكسندر روغويسكي
    بناءً على طراز الإحياء القوطي: أقواس مدبّبة، ونقوش بارزة محفورة في حجر فاتح اللون، وبرجان متناظران
    يعلوهما مستدقّان حادّان على جانبي المدخل. بدأ البناء عام 1898 وانتهى عام 1903. وبين نخيل المدينة وشرفاتها
    لا تزال تبدو ضيفًا قادمًا من شمال أوروبا.


    في ثلاثينيات القرن العشرين أغلقتها الحملة السوفييتية المعادية للدين، وظلّ صحنها عقودًا يضمّ مختبرًا
    لفيزياء الجهد العالي. وفي عام 1989، في سنوات البيريسترويكا، انتقل المبنى إلى الكنيسة الأرثوذكسية الجورجية؛
    وهو اليوم مقرّ أسقف باتومي ولازيتي. أما كاثوليك المدينة فيصلّون الآن في كنيسة الروح القدس الحديثة
    التي كُرّست عام 2000.


    في الداخل يستقرّ التقليدان أحدهما فوق الآخر. فالعمارة لا تزال قوطية: صحن واحد تحت أقبية مضلّعة، ونوافذ
    عالية مدبّبة، وزخارف حجرية مخرّمة. أما التجهيزات فأرثوذكسية أُضيفت بعد عام 1989: أيقونسطاس من أيقونات
    مذهّبة، وجداريات تصوّر حياة العذراء. وهواء البحر الرطب لا يرحم الحجر المنحوت، فتحتاج الواجهات إلى
    الترميم بين حين وآخر.


    قف في آخر الكنيسة أثناء القداس، وستسمع الترتيل الجورجي يصعد إلى أقبيةٍ رُفعت من أجل القداس اللاتيني.
  tip: >-
    الدخول مجاني خارج أوقات الصلوات، ونصف ساعة تكفي. البس كما تلبس لأي كنيسة جورجية: مع تغطية الكتفين
    والركبتين، وغطاء رأس للنساء يتوفّر عادةً عند الباب. قداس صباح الأحد هو أكثر الأوقات ازدحامًا؛ تعالَ
    حينها من أجل الترتيل، أو في عصر يوم هادئ من أيام الأسبوع لتتأمّل العمارة. لا تصوّر المصلّين، وأبعِد
    الكاميرا عن الأيقونسطاس أثناء الصلوات. اعبر إلى الجهة المقابلة من الشارع لأجمل منظر للبرجين المدبّبين
    التوأمين. مسجد أورتا جامع والبياتسا والبوليفار كلها على مسافة قصيرة سيرًا، فتندرج الكاتدرائية بسهولة
    في نزهة في البلدة القديمة.
  route: >-
    تبعد باتومي عن تبليسي نحو 370 كم وخمس ساعات ونصفًا. اسلك الطريق S1 ‏(E60) عبر غوري وخاشوري، ثم عبر
    أنفاق ريكوتي ومتجاوزًا كوتايسي حتى سامتريديا، ثم الطريق S12 عبر لانتشخوتي إلى غريغوليتي، ثم الطريق
    الساحلي S2 ‏(E70) جنوبًا عبر كوبوليتي إلى المدينة. الطريق معبّد بالكامل، ومعظمه بأربعة مسارات، والسيارة
    الاقتصادية هي كل ما تحتاجه؛ ومحطات الوقود ليست بعيدة أبدًا. تقع الكاتدرائية في وسط باتومي، على مسافة
    قصيرة سيرًا من البوليفار. أماكن الوقوف في الشوارع المجاورة قليلة صيفًا؛ والموقف المدفوع أو موقف الفندق
    أقل إرهاقًا للأعصاب.
