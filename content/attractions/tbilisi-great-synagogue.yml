ka:
  name: თბილისის დიდი სინაგოგა
  short: საქართველოს უდიდესი სინაგოგა კოტე აფხაზის ქუჩაზე — ახალციხელი ებრაელების აგებული აგურის ტაძარი
    (1904–1911).
  body: >-
    **დიდი სინაგოგა ძველი თბილისის ყველაზე ცოცხალი მრავალკონფესიურობის დასტურია** — კოტე აფხაზის (ყოფილ
    ლესელიძის) ქუჩაზე, სადაც რამდენიმე ასეულ მეტრში სინაგოგა, მეჩეთი, სომხური და ქართული ეკლესიები თანაარსებობენ.


    სინაგოგა 1904–1911 წლებში ააგეს ახალციხიდან ჩამოსახლებულმა ებრაელებმა, რომლებიც XIX საუკუნის ბოლოს
    კვემო კალაში დამკვიდრდნენ — ამიტომ მას „ახალციხურ სინაგოგასაც“ უწოდებენ. წითელი აგურის ორსართულიანი
    შენობა ეკლექტიკურ სტილშია, მავრიტანული და რომაული მოტივებით; ინტერიერი მოხატულია, პირველ სართულზე
    სამლოცველო დარბაზი და მიკვეა. 2011–2012 წლებში შენობა რესტავრირდა და დღემდე ქალაქის ებრაული თემის
    მთავარი სამლოცველოა — ხოლო ქართველ ებრაელთა ისტორია 26 საუკუნეს ითვლის.


    ნახვის ღირსია:


    - მოხატული, ლურჯ-ოქროსფერი სამლოცველო დარბაზი

    - აგურის ფასადი მავრიტანული თაღებით

    - დავით ბააზოვის ებრაული ისტორიის მუზეუმი — რამდენიმე ქუჩის იქით


    სინაგოგა მოქმედია: პარასკევ საღამოსა და შაბათ დილას ლოცვებია, დანარჩენ დროს სტუმრებს მშვიდად უშვებენ.
    ვიზიტი ბუნებრივად ჯდება ძველი ქალაქის ნებისმიერ მარშრუტში — სიონი და ანჩისხატი აქედან სულ რამდენიმე
    წუთის სავალზეა.
  tip: >-
    შესვლა უფასოა, დღისით კარი ჩვეულებრივ ღიაა. მამაკაცებმა თავი უნდა დაიფარონ — ქიფები შესასვლელთანაა.
    შაბათ დილას ტურისტული ვიზიტისგან თავი შეიკავე ან ლოცვას ჩუმად დაესწარი. ფოტოს გადაღებამდე ნებართვა
    იკითხე, შაბათს — საერთოდ არა. კოტე აფხაზის ქუჩა თავად ღირს გასეირნებად: სუვენირები, საცხობები, მაწონი
    და ჩურჩხელა გზადაგზა.
  route: >-
    სინაგოგა ძველი ქალაქის შუაგულშია, თავისუფლების მოედნიდან კოტე აფხაზის ქუჩით ჩასასვლელად ათი წუთი საკმარისია
    ფეხით — მანქანა აქ ხელს უფრო შეგიშლის. ქუჩა ვიწროა, ნაწილობრივ საფეხმავლო და გაჩერება აკრძალულია;
    მანქანა დატოვე გორგასლის მოედნის ან ევროპის მოედნის ფასიან პარკინგზე და ფეხით ახვედი. ცენტრიდან 1
    კმ-ია, ხუთი წუთი. ეკონომ-კლასი სავსებით საკმარისია — თუმცა ძველ თბილისში საერთოდ ურჩევნია ფეხით სიარული.
en:
  name: Great Synagogue of Tbilisi
  short: >-
    Georgia's largest synagogue on Kote Abkhazi Street — a red-brick temple built by Akhaltsikhe Jews
    in 1904–1911.
  body: >-
    **The Great Synagogue is the liveliest proof of Old Tbilisi's religious mosaic** — it stands on Kote
    Abkhazi Street (formerly Leselidze), where within a few hundred metres a synagogue, a mosque, Armenian
    and Georgian churches all coexist.


    It was built in 1904–1911 by Jews from Akhaltsikhe who had settled in the Kvemo Kala quarter in the
    late 19th century — hence its other name, the Akhaltsikhe Synagogue. The two-storey red-brick building
    is eclectic in style, mixing Moorish and Romanesque motifs; the interior is richly painted, with the
    main prayer hall and a mikveh on the ground floor. Restored in 2011–2012, it remains the central house
    of worship for the city's Jewish community — a community whose Georgian history is counted at some
    26 centuries.


    Worth seeing:


    - The painted blue-and-gold prayer hall

    - The brick facade with its Moorish arches

    - The David Baazov Museum of Georgian Jewish history, a few streets away


    The synagogue is active: services are held on Friday evening and Saturday morning; at other times
    visitors are quietly welcomed.
  tip: >-
    Entry is free and the door is usually open in daytime. Men should cover their heads — kippot are available
    at the entrance. Skip the tourist visit on Saturday morning, or attend the service quietly. Ask before
    photographing, and never on Shabbat. Kote Abkhazi Street itself deserves a slow walk: souvenir shops,
    bakeries, matsoni and churchkhela all along the way.
  route: >-
    The synagogue sits in the heart of the Old Town; from Freedom Square it's a ten-minute walk down Kote
    Abkhazi Street — a car is more hindrance than help here. The street is narrow, partly pedestrianised,
    and stopping is banned; leave the car at the paid lots by Gorgasali Square or Europe Square and walk
    up. It's 1 km from the centre, five minutes' drive. An economy car is entirely sufficient — though
    in Old Tbilisi walking beats driving every time.
ru:
  name: Большая синагога Тбилиси
  short: >-
    Крупнейшая синагога Грузии на улице Котэ Абхази — кирпичный храм, построенный ахалцихскими евреями
    в 1904–1911 годах.
  body: >-
    **Большая синагога — самое живое свидетельство религиозной мозаики Старого Тбилиси:** она стоит на
    улице Котэ Абхази (бывшей Леселидзе), где на нескольких сотнях метров соседствуют синагога, мечеть,
    армянские и грузинские церкви.


    Её построили в 1904–1911 годах евреи из Ахалцихе, обосновавшиеся в квартале Квемо Кала в конце XIX
    века, — отсюда второе название, Ахалцихская синагога. Двухэтажное здание из красного кирпича выдержано
    в эклектичном стиле с мавританскими и романскими мотивами; интерьер богато расписан, на первом этаже
    — главный молитвенный зал и миква. После реставрации 2011–2012 годов синагога остаётся центральным
    домом молитвы еврейской общины города — общины, чья история в Грузии насчитывает около 26 веков.


    Стоит увидеть:


    - Расписанный сине-золотой молитвенный зал

    - Кирпичный фасад с мавританскими арками

    - Музей истории евреев Грузии имени Давида Баазова в нескольких улицах отсюда


    Синагога действующая: службы проходят в пятницу вечером и субботу утром, в остальное время посетителей
    спокойно пускают.
  tip: >-
    Вход бесплатный, днём дверь обычно открыта. Мужчинам нужно покрыть голову — кипы лежат у входа. В
    субботу утром откажитесь от туристического визита или тихо постойте на службе. Перед съёмкой спрашивайте
    разрешение, в шаббат не снимайте вовсе. Сама улица Котэ Абхази заслуживает неспешной прогулки: сувенирные
    лавки, пекарни, мацони и чурчхела по всему пути.
  route: >-
    Синагога стоит в сердце Старого города; от площади Свободы до неё десять минут пешком вниз по улице
    Котэ Абхази — машина здесь скорее помеха. Улица узкая, частично пешеходная, остановка запрещена; оставьте
    автомобиль на платных парковках у площади Горгасали или площади Европы и поднимитесь пешком. От центра
    1 км, пять минут езды. Эконом-класса вполне достаточно — хотя по Старому Тбилиси в любом случае лучше
    ходить пешком.
fa:
  name: کنیسهٔ بزرگ تفلیس
  short: بزرگ‌ترین کنیسهٔ گرجستان در خیابان کوته آبخازی — معبد آجری که یهودیان آخالتسیخه در ۱۹۰۴–۱۹۱۱
    ساختند.
  body: >-
    **کنیسهٔ بزرگ زنده‌ترین گواه موزاییک دینی تفلیس قدیم است** — در خیابان کوته آبخازی (لسلیدزهٔ سابق)،
    جایی که در چند صد متر کنیسه، مسجد و کلیساهای ارمنی و گرجی در کنار هم‌اند.


    این بنا را در ۱۹۰۴–۱۹۱۱ یهودیان آخالتسیخه ساختند که اواخر سدهٔ نوزدهم در محلهٔ کومو کالا ساکن شده
    بودند — از همین رو به آن «کنیسهٔ آخالتسیخه» هم می‌گویند. ساختمان دوطبقهٔ آجر قرمز به سبک التقاطی است،
    با نقش‌مایه‌های مغربی و رومی؛ درونش نقاشی‌های غنی دارد و تالار اصلی نیایش و میکوه در طبقهٔ همکف است.
    پس از مرمت ۲۰۱۱–۲۰۱۲، همچنان عبادتگاه اصلی جامعهٔ یهودی شهر است — جامعه‌ای که تاریخش در گرجستان حدود
    ۲۶ قرن شمرده می‌شود.


    دیدنی‌ها:


    - تالار نیایش نقاشی‌شده به آبی و طلایی

    - نمای آجری با طاق‌های مغربی

    - موزهٔ تاریخ یهودیان گرجستان به نام داویت بازوف، چند خیابان آن‌سوتر


    کنیسه فعال است: مراسم در غروب جمعه و صبح شنبه برگزار می‌شود و در باقی اوقات بازدیدکنندگان را به‌آرامی
    می‌پذیرند.
  tip: >-
    ورود رایگان است و در طول روز معمولاً در باز است. آقایان باید سر خود را بپوشانند — کیپا کنار در هست.
    صبح شنبه از بازدید توریستی صرف‌نظر کنید یا بی‌صدا در مراسم بنشینید. پیش از عکاسی اجازه بگیرید و در
    شبات اصلاً عکس نگیرید. خود خیابان کوته آبخازی ارزش قدم‌زدن آهسته دارد: مغازه‌های سوغاتی، نانوایی‌ها،
    ماست گرجی و چورچخلا در تمام مسیر.
  route: >-
    کنیسه در دل شهر قدیم است؛ از میدان آزادی ده دقیقه پیاده‌روی سرازیری در خیابان کوته آبخازی کافی است
    — خودرو اینجا بیشتر دست‌وپاگیر است. خیابان تنگ و بخشی از آن پیاده‌راه است و توقف ممنوع؛ خودرو را در
    پارکینگ‌های پولی میدان گورگاسالی یا میدان اروپا بگذارید و پیاده بالا بروید. از مرکز ۱ کیلومتر و پنج
    دقیقه رانندگی است. خودروی اقتصادی کاملاً کافی است — هرچند در تفلیس قدیم پیاده‌روی همیشه بهتر از رانندگی
    است.
he:
  name: בית הכנסת הגדול של טביליסי
  short: בית הכנסת הגדול בגאורגיה ברחוב קוטה אבחזי — מבנה לבנים שבנו יהודי אחלציחה ב-1904–1911.
  body: >-
    **בית הכנסת הגדול הוא העדות החיה ביותר לפסיפס הדתי של טביליסי העתיקה** — הוא עומד ברחוב קוטה אבחזי
    (לשעבר לסלידזה), שבו מתקיימים זה לצד זה, בטווח כמה מאות מטרים, בית כנסת, מסגד וכנסיות ארמניות וגאורגיות.


    את הבניין הקימו בשנים 1904–1911 יהודים מאחלציחה שהתיישבו ברובע קוומו קאלה בשלהי המאה ה-19 — ומכאן
    שמו הנוסף, «בית הכנסת האחלציחי». מבנה הלבנים האדומות בן שתי הקומות בנוי בסגנון אקלקטי המשלב מוטיבים
    מוריים ורומנסקיים; הפנים מצויר בעושר, ובקומת הקרקע אולם התפילה המרכזי ומקווה. לאחר שיפוץ בשנים 2011–2012
    הוא נותר בית התפילה המרכזי של הקהילה היהודית בעיר — קהילה שתולדותיה בגאורגיה נמנות בכ-26 מאות שנים.


    שווה לראות:


    - אולם התפילה המצויר בכחול וזהב

    - חזית הלבנים עם הקשתות המוריות

    - מוזיאון דוד בעזוב לתולדות יהודי גאורגיה, כמה רחובות משם


    בית הכנסת פעיל: תפילות מתקיימות בערב שישי ובשבת בבוקר, ובשאר הזמן מקבלים מבקרים בסבר פנים שקט.
  tip: >-
    הכניסה חינם והדלת פתוחה בדרך כלל בשעות היום. גברים מתבקשים לכסות את הראש — כיפות זמינות בכניסה. בשבת
    בבוקר ותרו על ביקור תיירותי או הצטרפו לתפילה בשקט. בקשו רשות לפני צילום, ובשבת אל תצלמו כלל. רחוב
    קוטה אבחזי עצמו ראוי להליכה איטית: חנויות מזכרות, מאפיות, מצוני וצ'ורצ'חלה לכל אורך הדרך.
  route: >-
    בית הכנסת שוכן בלב העיר העתיקה; מכיכר החירות מגיעים אליו בעשר דקות הליכה במורד רחוב קוטה אבחזי — רכב
    כאן יותר מפריע מעוזר. הרחוב צר, חלקו מדרחוב, ועצירה אסורה; השאירו את הרכב בחניונים בתשלום ליד כיכר
    גורגסאלי או כיכר אירופה ועלו ברגל. מהמרכז 1 ק״מ, חמש דקות נסיעה. רכב חסכוני מספיק בהחלט — אם כי בטביליסי
    העתיקה ההליכה ברגל מנצחת תמיד.
ar:
  name: كنيس تبليسي الكبير
  short: أكبر كنيس في جورجيا على شارع كوته أبخازي — معبد من الآجر بناه يهود أخالتسيخه بين 1904 و1911.
  body: >-
    **الكنيس الكبير أحيا شاهد على الفسيفساء الدينية لتبليسي القديمة** — يقوم على شارع كوته أبخازي (ليسيليدزه
    سابقاً)، حيث يتجاور في بضع مئات من الأمتار كنيس ومسجد وكنائس أرمنية وجورجية.


    بناه بين 1904 و1911 يهودُ أخالتسيخه الذين استقروا في حي كفيمو كالا أواخر القرن التاسع عشر — ومن هنا
    اسمه الآخر «كنيس أخالتسيخه». المبنى المؤلف من طابقين بالآجر الأحمر ذو طراز انتقائي يمزج زخارف مغربية
    ورومانسكية؛ وداخله مرسوم بغنى، وفي الطابق الأرضي قاعة الصلاة الرئيسية والمكفيه (حمّام الطهارة). ورُمم
    في 2011–2012 وما زال بيت العبادة المركزي للجالية اليهودية في المدينة — وهي جالية يُحسب تاريخها في
    جورجيا بنحو 26 قرناً.


    يستحق المشاهدة:


    - قاعة الصلاة المرسومة بالأزرق والذهبي

    - واجهة الآجر بعقودها المغربية

    - متحف داود بازوف لتاريخ يهود جورجيا، على بعد شوارع قليلة


    الكنيس عامر: تقام الصلوات مساء الجمعة وصباح السبت، وفي بقية الأوقات يُستقبل الزوار بهدوء.
  tip: >-
    الدخول مجاني والباب مفتوح عادة نهاراً. على الرجال تغطية الرأس — والكِبّات متوافرة عند المدخل. تجنّب
    الزيارة السياحية صباح السبت أو احضر الصلاة بصمت. استأذن قبل التصوير، ولا تصوّر يوم السبت إطلاقاً.
    وشارع كوته أبخازي نفسه يستحق مشية متأنية: محال تذكارات ومخابز وماتسوني وتشورتشخيلا على امتداد الطريق.
  route: >-
    يقع الكنيس في قلب المدينة القديمة؛ من ساحة الحرية تبلغه بعشر دقائق سيراً نزولاً في شارع كوته أبخازي
    — والسيارة هنا عائق أكثر منها عوناً. الشارع ضيق وقسم منه للمشاة والتوقف ممنوع؛ اترك السيارة في المواقف
    المدفوعة قرب ساحة غورغاسالي أو ساحة أوروبا واصعد ماشياً. المسافة من المركز كيلومتر واحد وخمس دقائق
    قيادة. سيارة اقتصادية تكفي تماماً — وإن كان المشي في تبليسي القديمة يتفوق على القيادة دائماً.
