ka:
  name: თბილისის დიდი სინაგოგა
  short: >-
    საქართველოს უდიდესი სინაგოგა: წითელი აგური, მავრიტანული თაღები და მოხატული დარბაზი — ახალციხელმა ებრაელებმა
    1904–1911 წლებში ააშენეს.
  body: >-
    **კოტე აფხაზის ქუჩის შუაგულში, ხალიჩების დუქნებსა და ჩურჩხელის დახლებს შორის, ქვის ბოძებზე შემდგარი
    ორი მუქი ლომი კიბეს დარაჯობს — ეს კიბე საქართველოს უდიდეს სინაგოგაში ადის.**


    სინაგოგის მშენებლები ახალციხიდან იყვნენ. XIX საუკუნის ბოლოს ახალციხელი ქართველი ებრაელები თბილისის
    კვემო კალაში დამკვიდრდნენ და 1877 წელს კერძო სახლი სალოცავად გადააკეთეს — ქალაქი მას უბრალოდ „ახალციხელების
    სინაგოგას“ ეძახდა. 1899 წლისთვის შენობა ჩამოშლის პირას იყო და ხელისუფლების ბრძანებით დაანგრიეს. 1903
    წლის იანვარში „ივერია“ იუწყებოდა, რომ ქართულად მოლაპარაკე ებრაელებმა გუბერნატორს სთხოვეს, საკუთარი
    სალოცავის ასაგებად ფულის შეგროვების ნება დაერთო. მშენებლობა 1904 წელს დაიწყო და 1911 წელს დასრულდა.


    ასე დადგა წითელი აგურის ორსართულიანი ნაგებობა, რომელშიც ორი არქიტექტურული ენა — ნეომავრიტანული და
    ნეორომანული — ერთმანეთს ერწყმის. კიბის ძირში თეთრი მენორა დგას, შავ კარს აღთქმის ფილები ამშვენებს.
    შიგნით განწყობა წამიერად იცვლება: მოლურჯო-მომწვანო კედლები, მოოქროვილი ორნამენტი და მოხატული ჭერი
    თორის კიდობნის თავზე. შენობა 2011–2012 წლებში აღადგინეს; პირველ სართულზე მიკვეა — რიტუალური აბანო.


    ეს მუზეუმი არ გეგონოთ. ქართველ ებრაელთა ისტორია ამ მიწაზე ოცდაექვს საუკუნეს ითვლის, სინაგოგა კი დღემდე
    ქალაქის ებრაული თემის მთავარი სალოცავია. თემის წარსულს რამდენიმე წუთის სავალზე, ანტონ კათალიკოსის
    ქუჩის №3-ში გაიცნობთ: 1915 წელს აგებულ გუმბათიან ყოფილ სინაგოგაში დღეს დავით ბააზოვის სახელობის საქართველოს
    ებრაელთა ისტორიის მუზეუმია.


    ამ კიბიდან ათ წუთში მიხვალთ სიონამდე, ძველი ქალაქის სომხურ ეკლესიებამდე და აბანოთუბნის მეჩეთამდე.
    ძველ თბილისში სხვადასხვა სარწმუნოების სალოცავები ყოველთვის ერთმანეთის ხმის გასაგონზე იდგა.
  tip: >-
    შესვლა უფასოა, დღისით კარი ჩვეულებრივ ღიაა. ჩაიცვით თავდაჭერილად: მამაკაცებს თავი დაფარული უნდა ჰქონდეთ
    (თუ ქუდი არ გაქვთ, კართან იკითხეთ), მხრები და მუხლები კი ყველას დაფარული სჯობს. პარასკევ საღამოს და
    შაბათ დილით ლოცვაა — ამ დროს მხოლოდ სალოცავად მიდით ან იმისთვის, რომ ბოლო რიგში ჩუმად ჩამოჯდეთ. შაბათს
    ფოტოგადაღებაზე ფიქრიც ზედმეტია, სხვა დღეებში კი კამერის აწევამდე ნებართვა იკითხეთ. შიგნით კაფე არ
    არის, სამაგიეროდ კოტე აფხაზის ქუჩაზე გზადაგზა საცხობები და ღვინის ბარებია.
  route: >-
    სინაგოგა კოტე აფხაზის ქუჩის №45–47-შია, ძველი თბილისის საფეხმავლო გულში, თავისუფლების მოედნიდან დაახლოებით
    1 კილომეტრზე. მანქანით ხუთი წუთია, მაგრამ გულწრფელი რჩევა ასეთია: ათი წუთი ფეხით, დაღმართზე. თავად
    ქუჩაზე გაჩერება შეუძლებელია. თუ ნაქირავები მანქანით ხართ, მანქანა გორგასლის მოედნის ან მდინარის გაღმა,
    ევროპის მოედნის ფასიან ავტოსადგომზე დატოვეთ (გადახდა „თბილისი პარკინგის“ აპლიკაციით) და ბოლო 400–600
    მეტრი ფეხით გაიარეთ. საფარი მთელ გზაზე მყარია; ეკონომკლასი სავსებით საკმარისია, პატარა მანქანა კი
    ძველი ქალაქის ვიწრო, ცალმხრივ ქუჩებში ყველაზე იოლად ეტევა.
en:
  name: Great Synagogue of Tbilisi
  short: >-
    Georgia's largest synagogue: red brick, Moorish-tinged arches and a painted prayer hall, built in
    1904–1911 by Jews from Akhaltsikhe.
  body: >-
    **Halfway down Kote Afkhazi Street, between the carpet shops and the churchkhela stalls, two dark
    lions on stone posts guard a flight of steps that leads to the largest synagogue in Georgia.**


    Its builders came from Akhaltsikhe. In the late nineteenth century Georgian Jews from that southern
    town settled in Kvemo Kala, the lower quarter of Old Tbilisi, and in 1877 turned a private house into
    a prayer hall that the city simply called the synagogue of the Akhaltsikhe people. By 1899 it was
    close to collapse and was pulled down by government order. In January 1903 the newspaper *Iveria*
    reported that the Georgian-speaking Jews had petitioned the governor for leave to raise money for
    a house of prayer of their own. Building began in 1904 and was finished in 1911.


    What rose is two storeys of red brick in which two architectural languages, Neo-Moorish and Neo-Romanesque,
    speak at once. A white menorah stands at the foot of the steps, and the black doors carry the Tablets
    of the Law. Inside, the mood changes in a heartbeat: blue-green walls, gilded ornament and a painted
    ceiling above the Torah ark. The building was restored in 2011–2012; on the ground floor is a mikveh,
    the ritual bath.


    Do not mistake it for a museum. Georgian Jews count some twenty-six centuries of history in this country,
    and the synagogue is still the central house of worship for the city's community. For that history,
    walk a few minutes to 3 Anton Katalikosi Street, where a domed former synagogue of 1915 now houses
    the David Baazov Museum of History of Jews of Georgia.


    From these steps Sioni Cathedral, the Armenian churches of the Old Town and the Abanotubani mosque
    are all within a ten-minute walk. Old Tbilisi has always kept its houses of prayer within earshot
    of one another.
  tip: >-
    Entry is free and the door is usually open during the day. Dress modestly: men should cover their
    heads (if you have no hat, ask at the door), and shoulders and knees are best covered for everyone.
    Services are held on Friday evening and Saturday morning; come then only to pray or to sit quietly
    at the back. Photography is out of the question on the Sabbath, and on other days you should ask before
    raising a camera. There is no café inside, but Kote Afkhazi Street has bakeries and wine bars all
    the way down.
  route: >-
    The synagogue stands at 45–47 Kote Afkhazi Street, in the pedestrian heart of Old Tbilisi, about 1
    km from Freedom Square: five minutes by car, though the honest advice is a ten-minute walk downhill.
    You cannot stop on the street itself. If you arrive in a rental car, leave it at the paid car park
    on Gorgasali Square or across the river at Europe Square (pay through the Tbilisi Parking app) and
    walk the last 400–600 metres. The surface is hard all the way; an economy car is plenty, and a small
    one copes best with the Old Town's narrow one-way lanes.
ru:
  name: Большая синагога Тбилиси
  short: >-
    Крупнейшая синагога Грузии: красный кирпич, арки с мавританским акцентом и расписной молитвенный зал.
    Построена в 1904–1911 годах евреями из Ахалцихе.
  body: >-
    **На середине улицы Котэ Абхази, между ковровыми лавками и прилавками с чурчхелой, два тёмных льва
    на каменных столбах стерегут лестницу, ведущую к крупнейшей синагоге Грузии.**


    Её строители пришли из Ахалцихе. В конце XIX века грузинские евреи из этого южного города поселились
    в Квемо-Кала, нижнем квартале Старого Тбилиси, и в 1877 году превратили частный дом в молельню, которую
    город попросту звал синагогой ахалцихцев. К 1899 году она едва держалась и была снесена по распоряжению
    властей. В январе 1903 года газета «Иверия» сообщила, что грузиноязычные евреи обратились к губернатору
    за разрешением собрать деньги на собственный молитвенный дом. Строительство началось в 1904 году и
    завершилось в 1911-м.


    Выросло двухэтажное здание из красного кирпича, в котором одновременно звучат два архитектурных языка
    — неомавританский и неороманский. У подножия лестницы стоит белая менора, на чёрных дверях — скрижали
    Завета. Внутри настроение меняется в одно мгновение: сине-зелёные стены, золочёный орнамент и расписной
    потолок над ковчегом Торы. Здание отреставрировали в 2011–2012 годах; на первом этаже находится миква
    — бассейн для ритуального омовения.


    Не принимайте её за музей. Грузинские евреи ведут свою историю в этой стране около двадцати шести
    веков, и синагога по-прежнему остаётся главным молитвенным домом городской общины. А за самой историей
    пройдите несколько минут до улицы Антона Католикоса, 3: там, в бывшей купольной синагоге 1915 года,
    работает Музей истории евреев Грузии имени Давида Баазова.


    От этих ступеней до собора Сиони, армянских церквей Старого города и мечети в Абанотубани — не больше
    десяти минут пешком. Старый Тбилиси всегда держал свои молитвенные дома так близко, чтобы они слышали
    друг друга.
  tip: >-
    Вход свободный, днём дверь обычно открыта. Одевайтесь скромно: мужчинам нужно покрыть голову (если
    шапки нет, спросите у входа), а плечи и колени лучше закрыть всем. Службы проходят в пятницу вечером
    и в субботу утром; приходите в это время, только чтобы помолиться или тихо посидеть в задних рядах.
    В шаббат фотографировать нельзя ни в коем случае, а в другие дни спросите разрешения, прежде чем поднимать
    камеру. Кафе внутри нет, зато вдоль всей улицы Котэ Абхази тянутся пекарни и винные бары.
  route: >-
    Синагога стоит на улице Котэ Абхази, 45–47, в пешеходном сердце Старого Тбилиси, примерно в 1 км от
    площади Свободы: на машине пять минут, но честный совет — десять минут пешком под горку. Остановиться
    на самой улице нельзя. Если вы на арендованной машине, оставьте её на платной стоянке на площади Горгасали
    или за рекой, на площади Европы (оплата через приложение «Тбилиси Паркинг»), и пройдите последние
    400–600 метров пешком. Покрытие твёрдое на всём пути; машины эконом-класса более чем достаточно, а
    маленькая лучше справится с узкими односторонними улочками Старого города.
fa:
  name: کنیسهٔ بزرگ تفلیس
  short: >-
    بزرگ‌ترین کنیسهٔ گرجستان: آجر سرخ، طاق‌هایی با رنگ‌وبوی موری و تالار نیایشی نقاشی‌شده، ساختهٔ یهودیان
    آخالتسیخه در سال‌های ۱۹۰۴ تا ۱۹۱۱.
  body: >-
    **در میانهٔ خیابان کوته آفخازی، میان فرش‌فروشی‌ها و بساط چورچخلا، دو شیر تیره بر پایه‌های سنگی از
    پلکانی نگهبانی می‌کنند که به بزرگ‌ترین کنیسهٔ گرجستان می‌رسد.**


    سازندگانش از آخالتسیخه آمده بودند. در اواخر سدهٔ نوزدهم یهودیان گرجی آن شهر جنوبی در کوِمو کالا، محلهٔ
    پایینی تفلیس کهن، ساکن شدند و در سال ۱۸۷۷ خانه‌ای شخصی را به عبادتگاه بدل کردند؛ شهر آن را ساده «کنیسهٔ
    آخالتسیخه‌ای‌ها» می‌نامید. تا ۱۸۹۹ این بنا در آستانهٔ فروریختن بود و به فرمان حکومت ویران شد. در ژانویهٔ
    ۱۹۰۳ روزنامهٔ «ایوریا» خبر داد که یهودیان گرجی‌زبان از فرماندار اجازه خواسته‌اند تا برای ساختن نیایشگاهی
    از آنِ خود پول گرد آورند. ساخت در ۱۹۰۴ آغاز شد و در ۱۹۱۱ به پایان رسید.


    آنچه برآمد، بنایی دوطبقه از آجر سرخ است که دو زبان معماری، نئوموری و نئورومانسک، هم‌زمان در آن سخن
    می‌گویند. پای پلکان منورایی سپید ایستاده و بر درهای سیاه، لوح‌های شریعت نقش بسته است. درون، حال‌وهوا
    در یک چشم بر هم زدن دگرگون می‌شود: دیوارهای آبی‌سبز، نقش‌های زرین و سقفی نقاشی‌شده بر فراز صندوق تورات.
    بنا در سال‌های ۲۰۱۱ تا ۲۰۱۲ مرمت شد؛ در طبقهٔ همکف میکوه، حوضچهٔ غسل آیینی، جای دارد.


    آن را با موزه اشتباه نگیرید. یهودیان گرجستان تاریخ خود را در این سرزمین حدود بیست‌وشش سده می‌شمارند،
    و کنیسه هنوز نیایشگاه اصلی جامعهٔ یهودی شهر است. برای آن تاریخ، چند دقیقه پیاده تا خیابان آنتون کاتالیکوسی،
    شمارهٔ ۳، بروید؛ آنجا کنیسه‌ای گنبددار از سال ۱۹۱۵ امروز موزهٔ تاریخ یهودیان گرجستان به نام داوید
    باآزوف را در خود جای داده است.


    از همین پله‌ها، کلیسای جامع سیونی، کلیساهای ارمنی شهر کهن و مسجد آبانوتوبانی همه در فاصلهٔ ده دقیقه
    پیاده‌روی‌اند. تفلیس کهن همیشه نیایشگاه‌هایش را چنان نزدیک هم نگه داشته که صدای یکدیگر را بشنوند.
  tip: >-
    ورود رایگان است و در طول روز معمولاً در باز است. پوشیده لباس بپوشید: مردان باید سر خود را بپوشانند
    (اگر کلاه ندارید، دم در بپرسید) و بهتر است همه شانه‌ها و زانوها را بپوشانند. مراسم عبادت در شامگاه
    جمعه و صبح شنبه برگزار می‌شود؛ در این ساعت‌ها فقط برای نیایش یا نشستن آرام در ردیف‌های پشتی بیایید.
    عکاسی در روز شبات به هیچ روی پذیرفته نیست و در روزهای دیگر هم پیش از بالا بردن دوربین اجازه بگیرید.
    درون کنیسه کافه‌ای نیست، اما در سراسر خیابان کوته آفخازی نانوایی‌ها و بارهای شراب پشت سر هم ردیف شده‌اند.
  route: >-
    کنیسه در شمارهٔ ۴۵ تا ۴۷ خیابان کوته آفخازی، در قلب پیاده‌راه تفلیس کهن، حدود ۱ کیلومتر از میدان آزادی
    قرار دارد: پنج دقیقه با خودرو، اما توصیهٔ صادقانه ده دقیقه پیاده‌روی در سراشیبی است. در خود خیابان
    نمی‌توان توقف کرد. اگر با خودروی اجاره‌ای می‌آیید، آن را در پارکینگ پولی میدان گورگاسالی یا آن سوی
    رودخانه در میدان اروپا بگذارید (پرداخت از طریق اپلیکیشن «تفلیس پارکینگ») و ۴۰۰ تا ۶۰۰ متر پایانی را
    پیاده بروید. تمام مسیر رویهٔ سخت دارد؛ خودروی اقتصادی کاملاً کافی است و خودروی کوچک در کوچه‌های باریک
    و یک‌طرفهٔ شهر کهن از همه راحت‌تر است.
he:
  name: בית הכנסת הגדול של טביליסי
  short: >-
    בית הכנסת הגדול בגאורגיה: לבנים אדומות, קשתות בנגיעה מורית ואולם תפילה מצויר, שבנו יהודים מאחלציחה
    ב-1904–1911.
  body: >-
    **באמצע רחוב קוטה אפחזי, בין חנויות השטיחים לדוכני הצ'ורצ'חלה, שני אריות כהים על עמודי אבן שומרים
    על גרם מדרגות המוביל אל בית הכנסת הגדול ביותר בגאורגיה.**


    בוניו באו מאחלציחה. בסוף המאה ה-19 התיישבו יהודים גאורגים מן העיר הדרומית הזאת בקבמו קלה, הרובע התחתון
    של טביליסי העתיקה, וב-1877 הפכו בית פרטי לבית תפילה שהעיר כינתה פשוט "בית הכנסת של האחלציחאים". עד
    1899 הוא עמד על סף קריסה ונהרס בצו השלטונות. בינואר 1903 דיווח העיתון "איבריה" כי היהודים דוברי הגאורגית
    עתרו למושל וביקשו רשות לגייס כסף לבית תפילה משלהם. הבנייה החלה ב-1904 והסתיימה ב-1911.


    מה שקם הוא מבנה בן שתי קומות מלבנים אדומות, ששתי שפות אדריכליות — הנאו-מורית והנאו-רומנסקית — מדברות
    בו בבת אחת. למרגלות המדרגות ניצבת מנורה לבנה, ועל הדלתות השחורות מופיעים לוחות הברית. בפנים משתנה
    האווירה ברגע: קירות בכחול-ירקרק, עיטורים מוזהבים ותקרה מצוירת מעל ארון הקודש. המבנה שוחזר ב-2011–2012;
    בקומת הקרקע נמצא מקווה טהרה.


    אל תטעו לחשוב שזה מוזיאון. יהודי גאורגיה מונים כ-2,600 שנות היסטוריה בארץ הזאת, ובית הכנסת הוא עדיין
    בית התפילה המרכזי של הקהילה בעיר. את ההיסטוריה עצמה תמצאו כמה דקות הליכה משם, ברחוב אנטון קטליקוסי
    3: בבית כנסת לשעבר בעל כיפה משנת 1915 שוכן היום המוזיאון לתולדות יהודי גאורגיה על שם דוד באזוב.


    מן המדרגות האלה קתדרלת סיוני, הכנסיות הארמניות של העיר העתיקה והמסגד של אבנוטובאני — כולם במרחק עשר
    דקות הליכה. טביליסי העתיקה תמיד החזיקה את בתי התפילה שלה במרחק שמיעה זה מזה.
  tip: >-
    הכניסה חופשית, ובשעות היום הדלת בדרך כלל פתוחה. התלבשו בצניעות: גברים צריכים לכסות את הראש (אם אין
    לכם כובע, שאלו בכניסה), ורצוי שכולם יכסו כתפיים וברכיים. התפילות מתקיימות ביום שישי בערב ובשבת בבוקר;
    באו בשעות האלה רק כדי להתפלל או לשבת בשקט מאחור. צילום בשבת אינו בא בחשבון, ובימים אחרים בקשו רשות
    לפני שאתם מרימים מצלמה. בפנים אין בית קפה, אבל לאורך כל רחוב קוטה אפחזי יש מאפיות וברי יין.
  route: >-
    בית הכנסת נמצא ברחוב קוטה אפחזי 45–47, בלב האזור המיועד להולכי רגל בטביליסי העתיקה, כ-1 ק״מ מכיכר
    החירות: חמש דקות נסיעה, אבל העצה הכנה היא עשר דקות הליכה בירידה. ברחוב עצמו אי אפשר לעצור. אם הגעתם
    ברכב שכור, השאירו אותו בחניון בתשלום בכיכר גורגסאלי או מעבר לנהר בכיכר אירופה (תשלום דרך האפליקציה
    "טביליסי פארקינג"), ולכו ברגל את 400–600 המטרים האחרונים. כל הדרך סלולה; רכב חסכוני מספיק בהחלט, ורכב
    קטן מתמודד הכי טוב עם הסמטאות הצרות והחד-סטריות של העיר העתיקה.
ar:
  name: كنيس تبليسي الكبير
  short: >-
    أكبر كنيس في جورجيا: آجرّ أحمر وأقواس بلمسة مورية وقاعة صلاة مزدانة بالرسوم، شيّده يهود من أخالتسيخه
    بين 1904 و1911.
  body: >-
    **في منتصف شارع كوتيه أفخازي، بين متاجر السجاد وبسطات التشورتشخيلا، يحرس أسدان داكنان على قاعدتين
    حجريتين درجاً يقود إلى أكبر كنيس في جورجيا.**


    جاء بُناته من أخالتسيخه. ففي أواخر القرن التاسع عشر استقر يهود جورجيون من تلك المدينة الجنوبية في
    كفيمو كالا، الحي السفلي من تبليسي القديمة، وفي عام 1877 حوّلوا بيتاً خاصاً إلى مصلّى كانت المدينة
    تسمّيه ببساطة «كنيس أهل أخالتسيخه». وبحلول عام 1899 كان المبنى على وشك الانهيار، فهُدم بأمر من السلطات.
    وفي يناير 1903 نشرت صحيفة «إيفيريا» أن اليهود الناطقين بالجورجية تقدّموا بعريضة إلى الحاكم يلتمسون
    فيها الإذن بجمع المال لبناء بيت صلاة خاص بهم. بدأ البناء عام 1904 واكتمل عام 1911.


    وما ارتفع هو مبنى من طابقين من الآجر الأحمر، تتحدث فيه لغتان معماريتان في آن واحد: الطراز الموري الجديد
    والطراز الرومانسكي الجديد. عند أسفل الدرج تقف منوراه (شمعدان) بيضاء، وعلى الأبواب السوداء لوحا الشريعة.
    وفي الداخل يتبدّل المزاج في لحظة: جدران بزرقة مخضرّة، وزخارف مذهّبة، وسقف مرسوم فوق خزانة التوراة.
    رُمّم المبنى في 2011–2012، وفي الطابق الأرضي «مِكفاه»، أي حوض التطهّر الطقسي.


    لا تحسبه متحفاً. فيهود جورجيا يعدّون نحو ستة وعشرين قرناً من التاريخ في هذه البلاد، وما زال الكنيس
    بيت العبادة الرئيسي للجالية اليهودية في المدينة. أما التاريخ نفسه فامشِ دقائق قليلة إلى شارع أنطون
    كاتاليكوسي رقم 3، حيث يضم كنيس سابق ذو قبة يعود إلى عام 1915 اليوم متحف دافيد باآزوف لتاريخ يهود جورجيا.


    ومن هذه الدرجات تقع كاتدرائية سيوني والكنائس الأرمنية في المدينة القديمة ومسجد أبانوتوباني كلها على
    مسافة عشر دقائق سيراً. لطالما أبقت تبليسي القديمة بيوت صلاتها على مرمى السمع بعضها من بعض.
  tip: >-
    الدخول مجاني، والباب عادة مفتوح نهاراً. ارتدِ ملابس محتشمة: على الرجال تغطية رؤوسهم (وإن لم تكن معك
    قبعة فاسأل عند الباب)، ويُستحسن أن يغطي الجميع الأكتاف والركب. تُقام الصلوات مساء الجمعة وصباح السبت،
    فلا تأتِ في هذه الأوقات إلا للصلاة أو للجلوس بهدوء في الصفوف الخلفية. التصوير يوم السبت غير وارد إطلاقاً،
    وفي الأيام الأخرى استأذن قبل أن ترفع الكاميرا. لا مقهى في الداخل، لكن المخابز وحانات النبيذ تصطف على
    امتداد شارع كوتيه أفخازي.
  route: >-
    يقع الكنيس في 45–47 شارع كوتيه أفخازي، في القلب المخصّص للمشاة من تبليسي القديمة، على بعد نحو 1 كم
    من ميدان الحرية: خمس دقائق بالسيارة، لكن النصيحة الصادقة هي عشر دقائق مشياً في طريق منحدر. لا يمكن
    التوقف في الشارع نفسه. وإن جئت بسيارة مستأجرة فاتركها في الموقف المدفوع في ميدان غورغاسالي أو عبر
    النهر في ميدان أوروبا (الدفع عبر تطبيق «تبليسي باركينغ»)، ثم امشِ آخر 400–600 متر. الطريق معبّد طوال
    المسافة؛ والسيارة الاقتصادية تكفي تماماً، والصغيرة أقدر على التعامل مع أزقة المدينة القديمة الضيقة
    ذات الاتجاه الواحد.
