ka:
  name: ქედა და აჭარული მარნები
  short: აჭარისწყლის ხეობის პატარა ქალაქი, სადაც ჭვიშტისა და ცოლიკოურის ღვინო ხის მარნებში მწიფდება.
  body: >-
    **ქედა აჭარის მევენახეობის ცენტრია — და ეს რეგიონისთვის მოულოდნელი წინადადებაა.** სველ, სუბტროპიკულ
    კლიმატში ვაზი ჩვეულებრივ იტანჯება, აქ კი მას ხეზე ატარებენ: ვენახი მაღლარია, ლერწი ალვისა და კაკლის
    ხეზეა შემოხვეული, მტევანი ხუთ-შვიდ მეტრზეა ჩამოკიდებული. სწორედ ეს გამოსავალი გამოიგონეს — მიწიდან
    მოშორებით მტევანი უფრო სწრაფად შრება და სოკო ნაკლებად ჭრის.

    ძირითადი ჯიშია **ჭვიშტი** — მსუბუქი, ვარდისფერი ან ღია წითელი ღვინო, დაბალი ტანინითა და მჟავიანობით,
    რომელიც გაცივებული უფრო კარგად ისმევა, ვიდრე ოთახის ტემპერატურაზე. მას გვერდით უდგას ცოლიკოური და
    ადგილობრივი ბროლა. ღვინის უმეტესობა ქვევრში კი არა, ხის ან უჟანგავი ჭურჭელში მწიფდება — კიდევ ერთი
    განსხვავება კახეთისგან.

    ქედაში და მის გარშემო რამდენიმე ოჯახური მარანი მუშაობს. ისინი პატარაა, ხშირად სახლის სარდაფში, და
    დეგუსტაცია აქ არაფრით ჰგავს კახეთის მარკეტინგულ პროგრამებს: მაგიდაზე ყველი, აჭარული ხაჭაპური და სოფლის
    პური დაიდება, ღვინოს კი თვითონ მეპატრონე ჩამოასხამს. ბევრი მარანი წინასწარ შეთანხმებას ითხოვს — მოსვლამდე
    დარეკვა ან სასტუმროს მეშვეობით მოწესრიგება აუცილებელია.

    თვითონ ქალაქი პატარაა და მოწესრიგებული: ბაზარი, ხიდი აჭარისწყალზე და ცენტრალური მოედანი. სექტემბრის
    ბოლოს რთველია და მაშინ ხეობა ყველაზე ცოცხალია. ქედადან ზემოთ გზა შუახევსა და ხულოსკენ აგრძელებს —
    ხოლო მახუნცეთისა და დანდალოს თაღოვანი ხიდები ოციოდე წუთის სავალზეა.
  tip: >-
    სამი საათი მარნის ვიზიტს, სადილსა და ქალაქის შემოვლას ჰყოფნის. მარნები ოჯახურია — მისვლამდე შეათანხმე,
    უბრალოდ კარზე მისვლა ხშირად არ გამოდის. მძღოლისთვის დეგუსტაცია გამორიცხულია: გზა ხეობაშია და პოლიცია
    რეგულარულად ამოწმებს. სოფლის მარნებთან მისასვლელი ბოლო ასეული მეტრი ბეტონის ციცაბო აღმართია — წვიმაში
    ფრთხილად. ტუალეტი მარნებშია, კაფეები ცენტრში.
  route: >-
    ბათუმიდან აჭარისწყლის ხეობის გზით აღმოსავლეთით, ახალშენისა და მახუნცეთის გავლით — თბილისიდან ჯამში
    400 კმ, დაახლოებით ექვსი საათი. თბილისიდან ბათუმამდე E60, შემდეგ 30 კმ ხეობაში. ხეობის გზა ასფალტია
    და ბოლო წლებში გარემონტდა, თუმცა ვიწროა, სერპანტინით და ხშირად სველი. საწვავი ბათუმსა და ქედაშია.
    პარკინგი ცენტრალურ მოედანთან უფასოა. ეკონომ-კლასი საკმარისია, თუ მარანი მთის ფერდობზე არაა.
en:
  name: Keda and the Adjaran Wine Cellars
  short: A small town in the Adjaristsqali valley where Chkhaveri and Tsolikouri mature in wooden cellars.
  body: >-
    **Keda is the centre of Adjaran winemaking, which is an unlikely sentence for this region.** Vines
    normally suffer in a wet subtropical climate, so here they are trained up trees instead: the maghlari
    system, with shoots wound around poplar and walnut, and bunches hanging five to seven metres up. The
    solution was worked out locally — well clear of the ground, grapes dry faster and fungus takes less
    hold.

    The main variety is **Chkhaveri**, a light rosé or pale red with low tannin and gentle acidity that
    drinks far better chilled than at room temperature. Alongside it grow Tsolikouri and the local Brola.
    Most of the wine matures in wood or steel rather than in qvevri — another quiet difference from Kakheti.

    Several family cellars work in and around Keda. They are small, often no more than a house basement,
    and a tasting here bears no resemblance to the marketing programmes of the east. The table gets cheese,
    Adjaran khachapuri and village bread, and the owner pours. Many cellars want notice, so call ahead
    or arrange it through your guesthouse rather than turning up at the gate.

    The town itself is small and tidy: a market, a bridge over the Adjaristsqali, a central square. Harvest
    falls in late September and that is when the valley is most alive. From Keda the road continues up
    towards Shuakhevi and Khulo, while the arched bridges at Makhuntseti and Dandalo are both twenty minutes
    away.
  tip: >-
    Three hours covers a cellar visit, lunch and a walk through town. The cellars are family-run, so arrange
    the visit in advance; arriving unannounced often does not work. Tasting is out of the question for
    whoever is driving — the valley road is patrolled regularly. The last stretch up to hillside cellars
    is usually steep concrete, awkward when wet. Toilets are at the cellars, cafes in the centre.
  route: >-
    From Batumi head east up the Adjaristsqali valley road through Akhalsheni and Makhuntseti — 400 km
    from Tbilisi in total, about six hours. That is the E60 as far as Batumi and then 30 km inland. The
    valley road is asphalt and has been resurfaced in recent years, but it is narrow, winds constantly
    and is often wet. Fuel is available in Batumi and Keda. Parking by the central square is free. An
    economy car is sufficient unless the cellar sits high on a slope.
ru:
  name: Кеда и аджарские винные погреба
  short: Городок в ущелье Аджарисцкали, где чхавери и цоликоури зреют в деревянных погребах.
  body: >-
    **Кеда — центр аджарского виноделия, и для этого региона такая фраза звучит неожиданно.** Во влажном
    субтропическом климате лоза обычно страдает, поэтому здесь её пускают по деревьям: система маглари,
    побеги обвивают тополь и орех, гроздья висят на высоте пяти-семи метров. Решение придумано на месте
    — вдали от земли виноград быстрее сохнет и меньше берётся грибком.

    Основной сорт — **чхавери**, лёгкое розовое или бледно-красное вино с низким танином и мягкой кислотностью,
    которое куда лучше пьётся охлаждённым, чем комнатным. Рядом растут цоликоури и местная брола. Большая
    часть вина зреет в дереве или стали, а не в квеври — ещё одно тихое отличие от Кахетии.

    В Кеде и вокруг работает несколько семейных погребов. Они маленькие, часто это просто подвал дома,
    и дегустация здесь ничем не похожа на маркетинговые программы востока страны. На стол ставят сыр,
    аджарский хачапури и деревенский хлеб, а наливает сам хозяин. Многие погреба просят предупредить заранее
    — лучше позвонить или договориться через гостевой дом, чем приехать к воротам наудачу.

    Сам городок небольшой и опрятный: рынок, мост через Аджарисцкали, центральная площадь. Сбор урожая
    приходится на конец сентября, и тогда ущелье живее всего. Из Кеды дорога идёт дальше вверх, к Шуахеви
    и Хуло, а арочные мосты Махунцети и Дандало — в двадцати минутах.
  tip: >-
    Трёх часов хватит на погреб, обед и прогулку по городу. Погреба семейные, о визите договаривайтесь
    заранее: приехать без предупреждения часто не выходит. Тому, кто за рулём, дегустация исключена —
    дорогу по ущелью регулярно патрулируют. Последний подъём к погребам на склоне обычно крутой бетон,
    в дождь неприятный. Туалеты при погребах, кафе в центре.
  route: >-
    Из Батуми на восток по дороге вдоль Аджарисцкали через Ахалшени и Махунцети — от Тбилиси всего 400
    км, около шести часов. До Батуми это E60, дальше 30 км вглубь. Дорога по ущелью асфальтированная и
    в последние годы обновлена, но узкая, всё время вьётся и часто мокрая. Заправки есть в Батуми и Кеде.
    Парковка у центральной площади бесплатная. Машины эконом-класса достаточно, если погреб не стоит высоко
    на склоне.
fa:
  name: کدا و سردابه‌های شراب آجارا
  short: شهرکی در درهٔ آجاریسْتسقالی که چخاوری و تسولیکوری در سردابه‌های چوبی می‌رسند.
  body: >-
    **کدا مرکز شراب‌سازی آجاراست، و این جمله برای این منطقه نامنتظر است.** تاک در آب‌وهوای مرطوب نیمه‌گرمسیری
    معمولاً رنج می‌برد، پس اینجا آن را روی درخت بالا می‌برند: شیوهٔ ماغلاری، با شاخه‌هایی که دور صنوبر
    و گردو می‌پیچند و خوشه‌هایی که در پنج تا هفت متری آویزان‌اند. این راه‌حل همین‌جا پیدا شد؛ دور از زمین
    انگور زودتر خشک می‌شود و قارچ کمتر می‌گیرد.

    رقم اصلی **چخاوری** است، شرابی سبک، صورتی یا سرخ کم‌رنگ، با تانن کم و ترشی ملایم که سرد بسیار بهتر
    از دمای اتاق نوشیده می‌شود. کنارش تسولیکوری و برولای بومی می‌رویند. بیشتر شراب در چوب یا فولاد می‌رسد
    نه در کوره‌های سفالی زیرزمینی؛ تفاوتی آرام دیگر با کاختی.

    در کدا و پیرامونش چند سردابهٔ خانوادگی کار می‌کنند. کوچک‌اند، اغلب چیزی بیش از زیرزمین خانه نیستند،
    و مزه‌آزمایی اینجا هیچ شباهتی به برنامه‌های تبلیغاتی شرق کشور ندارد. روی میز پنیر و خاچاپوری آجاری
    و نان روستایی می‌گذارند و صاحب‌خانه خودش می‌ریزد. بسیاری از سردابه‌ها هماهنگی پیشین می‌خواهند، پس
    تلفن بزنید یا از طریق مهمان‌پذیر ترتیب دهید.

    خود شهر کوچک و مرتب است: بازاری، پلی بر آجاریسْتسقالی و میدانی مرکزی. برداشت انگور اواخر شهریور است
    و دره در همان روزها زنده‌ترین حال خود را دارد. از کدا جاده به سوی شواخوی و خولو بالا می‌رود، و پل‌های
    طاقی ماخونتستی و داندالو هر دو بیست دقیقه فاصله دارند.
  tip: >-
    سه ساعت برای دیدن سردابه، ناهار و گشتی در شهر کافی است. سردابه‌ها خانوادگی‌اند، پس از پیش هماهنگ کنید؛
    سررسیدن بی‌خبر اغلب جواب نمی‌دهد. برای راننده مزه‌آزمایی منتفی است؛ جادهٔ دره مرتب گشت‌زنی می‌شود.
    آخرین بالاروی تا سردابه‌های دامنه معمولاً بتنی و تند است و در باران دردسرساز. سرویس بهداشتی در سردابه‌ها
    و کافه‌ها در مرکز شهر است.
  route: >-
    از باتومی به شرق در جادهٔ درهٔ آجاریسْتسقالی از آخالشنی و ماخونتستی — از تفلیس روی‌هم ۴۰۰ کیلومتر،
    حدود شش ساعت. تا باتومی بزرگراه E60 و سپس ۳۰ کیلومتر به داخل. جادهٔ دره آسفالت است و سال‌های اخیر
    روکش شده، اما باریک و پرپیچ و اغلب خیس است. سوخت در باتومی و کدا موجود است. پارک کنار میدان مرکزی
    رایگان است. خودروی اقتصادی کافی است مگر سردابه بالای دامنه باشد.
he:
  name: קדה ומרתפי היין של אג׳ריה
  short: עיירה קטנה בעמק אג׳ריסצקאלי שבה זני צ׳חאברי וצוליקאורי מבשילים במרתפים משפחתיים מעץ.
  body: >-
    **קדה היא מרכז ייצור היין של אג׳ריה, וזה משפט לא צפוי לאזור הזה.** הגפן סובלת בדרך כלל באקלים סובטרופי
    לח, ולכן כאן מטפסים אותה על עצים: שיטת המאגלארי, שבה הזמורות נכרכות סביב צפצפה ואגוז והאשכולות תלויים
    בגובה חמישה עד שבעה מטרים. הפתרון פותח כאן — הרחק מן הקרקע הענבים מתייבשים מהר יותר והפטרייה נאחזת
    פחות.

    הזן המרכזי הוא **צ׳חאברי**, יין קליל, רוזה או אדום בהיר, דל טאנין ובעל חומציות רכה, שנשתה טוב בהרבה
    מצונן מאשר בטמפרטורת החדר. לצדו גדלים צוליקאורי והברולה המקומי. רוב היין מבשיל בעץ או בפלדה ולא בקוברי
    — עוד הבדל שקט מקאחתי.

    בקדה ובסביבתה פועלים כמה מרתפים משפחתיים. הם קטנים, לעתים לא יותר ממרתף בית, והטעימה כאן אינה דומה
    כלל לתוכניות השיווקיות של המזרח. על השולחן מגיעים גבינה, חצ׳פורי אג׳רי ולחם כפרי, ובעל הבית מוזג בעצמו.
    מרתפים רבים מבקשים תיאום מראש, אז התקשרו או סדרו זאת דרך בית ההארחה.

    העיירה עצמה קטנה ומסודרת: שוק, גשר מעל אג׳ריסצקאלי וכיכר מרכזית. הבציר נופל בסוף ספטמבר, ואז העמק
    חי במיטבו. מקדה הכביש ממשיך ומטפס אל שואחווי וחולו, ואילו הגשרים הקמורים במאחונצטי ובדנדאלו נמצאים
    עשרים דקות משם.
  tip: >-
    שלוש שעות מכסות ביקור במרתף, ארוחה וסיבוב בעיירה. המרתפים משפחתיים, אז תאמו מראש; הגעה ללא הודעה לרוב
    אינה עובדת. למי שנוהג הטעימה אינה באה בחשבון — כביש העמק מפוקח באופן קבוע. הקטע האחרון אל מרתפי המדרון
    הוא בדרך כלל בטון תלול, לא נוח בגשם. שירותים יש במרתפים ובתי קפה במרכז.
  route: >-
    מבאטומי מזרחה בכביש עמק אג׳ריסצקאלי דרך אחלשני ומאחונצטי — 400 ק״מ מטביליסי בסך הכול, כשש שעות. עד
    באטומי זה כביש E60 ואחר כך 30 ק״מ פנימה. כביש העמק סלול וחודש בשנים האחרונות, אך הוא צר, מתפתל ללא
    הרף ולעתים קרובות רטוב. תדלוק בבאטומי ובקדה. החניה ליד הכיכר המרכזית חינם. רכב חסכוני מספיק, אלא אם
    המרתף גבוה על המדרון.
ar:
  name: كيدا وأقبية النبيذ الأجارية
  short: بلدة صغيرة في وادي أجاريستسقالي ينضج فيها التشخافيري والتسوليكوري في أقبية خشبية.
  body: >-
    **كيدا مركز صناعة النبيذ في أجاريا، وهي جملة غير متوقعة عن هذا الإقليم.** الكرمة تعاني عادة في مناخ
    رطب شبه استوائي، ولذلك تُرفع هنا على الأشجار: نظام الماغلاري، حيث تلتف الأفرع حول الحور والجوز وتتدلى
    العناقيد على ارتفاع خمسة إلى سبعة أمتار. وقد ابتُكر هذا الحل محلياً؛ فالعنب بعيداً عن الأرض يجف أسرع
    وتقل إصابته بالفطر.

    الصنف الأساسي **تشخافيري**، نبيذ خفيف وردي أو أحمر فاتح، قليل التانين لطيف الحموضة، يُشرب مبرداً أفضل
    بكثير منه بحرارة الغرفة. وإلى جانبه يُزرع التسوليكوري والبرولا المحلي. ومعظم النبيذ ينضج في الخشب
    أو الفولاذ لا في الجرار المدفونة؛ فارق هادئ آخر عن كاخيتي.

    تعمل في كيدا وحولها عدة أقبية عائلية. صغيرة، لا تزيد أحياناً عن قبو بيت، والتذوق فيها لا يشبه برامج
    التسويق في شرق البلاد. يوضع على المائدة جبن وخاتشابوري أجاري وخبز قروي، ويصب صاحب البيت بنفسه. وكثير
    من الأقبية يطلب إشعاراً مسبقاً، فاتصل أو رتب الأمر عبر بيت الضيافة.

    والبلدة نفسها صغيرة مرتبة: سوق وجسر فوق أجاريستسقالي وساحة مركزية. والقطاف في أواخر سبتمبر، وحينها
    يكون الوادي في أنشط حالاته. ومن كيدا يتابع الطريق صعوده نحو شواخيفي وخولو، أما الجسران المقوسان في
    ماخونتسيتي ودانْدالو فعلى بعد عشرين دقيقة.
  tip: >-
    ثلاث ساعات تكفي لزيارة قبو وغداء وجولة في البلدة. الأقبية عائلية، فرتب الزيارة مسبقاً؛ فالحضور دون
    إخطار كثيراً ما لا ينفع. والتذوق مستبعد لمن يقود، فطريق الوادي يخضع لدوريات منتظمة. والمقطع الأخير
    الصاعد إلى أقبية المنحدر إسمنتي حاد عادة، ومزعج عند المطر. دورات المياه في الأقبية والمقاهي في المركز.
  route: >-
    من باتومي شرقاً على طريق وادي أجاريستسقالي عبر أخالشيني وماخونتسيتي — 400 كم من تبليسي إجمالاً، نحو
    ست ساعات. حتى باتومي هو الطريق E60 ثم 30 كم إلى الداخل. طريق الوادي معبّد وجُدد في السنوات الأخيرة،
    لكنه ضيق كثير الالتواء ورطب في الغالب. الوقود في باتومي وكيدا. الوقوف عند الساحة المركزية مجاني. وسيارة
    اقتصادية تكفي ما لم يكن القبو عالياً على المنحدر.
