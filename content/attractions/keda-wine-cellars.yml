ka:
  name: ქედა და აჭარული მარნები
  short: >-
    მდინარისპირა დაბა ბათუმიდან ახალციხისკენ მიმავალ ძველ გზაზე, სადაც ჩხავერს, საქართველოს ერთ-ერთ ყველაზე
    გვიანმწიფე ჯიშს, ნოემბრის შუა რიცხვების შემდეგ კრეფენ.
  body: >-
    **ქედაში რთველი მაშინ იწყება, როცა საქართველოს ვენახების უმეტესობა უკვე დაცარიელებულია: ჩხავერს, ამ
    ხეობის მთავარ ყურძენს, ჩვეულებრივ ნოემბრის შუა რიცხვების შემდეგ კრეფენ.**


    ქედა ზღვის დონიდან 256 მეტრზე, აჭარისწყლისა და აკავრეთის შესართავთან დგას, ბათუმიდან 42 კილომეტრში,
    ახალციხისკენ მიმავალ გზაზე. XVIII საუკუნეში ვახუშტი ბატონიშვილი მას მცირე ქალაქის მსგავს, ვაჭრებით
    დასახლებულ დაბად იხსენიებს, 1874 წელს აქ მოსულმა ისტორიკოსმა დიმიტრი ბაქრაძემ კი მდინარის ორივე ნაპირზე
    გაშლილი, ოთხუბნიანი სავაჭრო პუნქტი ნახა. დღეს ქედაში ათას სამასამდე კაცი ცხოვრობს; დაბას აქვს მხარეთმცოდნეობის
    მუზეუმი და საკუთარი მინერალური წყარო.


    ჩხავერი მეზობელი გურიიდან მოვიდა, სადაც მას ძველი წესით, მაღლარად ზრდიდნენ: ვაზი ცოცხალ ხეს მიუყვებოდა
    და მტევანი ნესტიან მიწას მაღლიდან დაჰყურებდა. 1935 წელს ჯიში ქედის საკოლექციო ნაკვეთზე გააშენეს. დღეს
    იგი მუნიციპალიტეტში მცირე ფართობებზეა შემორჩენილი, უმეტესად დაბლარად, ასე რომ, მაღლარი აქ უფრო მოგონებაა,
    ვიდრე მეთოდი. ჩხავრის ღვინო თითქმის თეთრიდან ღია ქარვისფრამდე და მკრთალ ვარდისფრამდე მერყეობს; ნაზია
    და ცოცხალი სიმჟავე აქვს. მისგან ნახევრადტკბილ ღვინოსაც აყენებენ. მეორე ჯიში, რომელსაც აჭარულ ეტიკეტებზე
    ხშირად შეხვდებით, თეთრი ცოლიკოურია.


    ხეობაში ასვლისას, სოფელ აჭარისწყალში, 2010 წლიდან მუშაობს „აჭარული ღვინის სახლი“: ქვევრიანი მარანი,
    სადეგუსტაციო დარბაზები და საკუთარი ვენახი. ჩხავრის ვარდისფერს აქ ქვევრშიც აყენებენ და ჩვეულებრივი
    წესითაც, სტუმარს კი ქვევრის მოხდას, პურის გამოცხობასა და ჭაჭის გამოხდას ასწავლიან. უფრო მაღლა, სოფლებში,
    ღვინო ჯერაც ოჯახის საქმეა და მასთან მისასვლელი საუკეთესო გზა საოჯახო სასტუმროს მასპინძელია.


    ქედა დაგვიანებულ მოგზაურს აჯილდოებს. ჩამოდით ნოემბერში, როცა მდინარის თავზე წაბლნარი ჟანგისფრად იფერება,
    წლევანდელი ჩხავერი კი ახლახან დაიწურა.
  tip: >-
    სამი საათი დეგუსტაციას, დინჯ სადილსა და მდინარის პირას გასეირნებას ეყოფა. „აჭარული ღვინის სახლი“ ყოველდღე
    11:00-დან 22:00-მდე მუშაობს და ჯავშანს ტელეფონით იღებს; დეგუსტაცია თუ მასტერკლასი წინასწარ დაჯავშნეთ.
    ქედის ოჯახურ მარნებს სამუშაო საათები საერთოდ არ აქვთ, ამიტომ ჭიშკარზე კაკუნის ნაცვლად ვიზიტი მასპინძელს
    შეათანხმებინეთ. ვინც საჭესთან ზის, ღვინოს არ სინჯავს: ხეობის გზა ვიწროა, სავსეა მიკროავტობუსებით და
    პატრულიც ხშირად დგას. ფერდობზე შეფენილ სახლებამდე ხშირად ციცაბო ბეტონის შესასვლელი ადის, წვიმის შემდეგ
    საშიშად სრიალა. ტუალეტი მარნებშია, კაფეები ქედის ცენტრში.
  route: >-
    თბილისიდან ს1-ით (E60) დასავლეთით წადით, ქუთაისის გავლით სამტრედიამდე, იქიდან ს12-ით (E692) ლანჩხუთის
    გავლით გრიგოლეთამდე, ზღვის პირას, შემდეგ კი ს2-ით (E70) სამხრეთით, ქობულეთის გავლით. ბათუმთან შ1-ზე,
    ბათუმი–ახალციხის გზაზე გადაუხვიეთ და აჭარისწყალს აღმა აჰყევით მახუნცეთის გავლით, ქედამდე დაახლოებით
    42 კილომეტრია. სულ ოთხასამდე კილომეტრი და ექვს საათზე ცოტა მეტი გამოდის. გზა ბოლომდე ასფალტია, მაგრამ
    ხეობის მონაკვეთი ვიწრო, კლაკნილი და ხშირად სველია. საწვავი სანაპიროზე ჩაასხით. ეკონომ-კლასის მანქანა
    საკმარისია; ფერდობის მარნებამდე ციცაბო ბეტონის აღმართებზე ნელა იარეთ.
en:
  name: Keda and the Adjaran Wine Cellars
  short: >-
    A river town on the old road inland from Batumi, where Chkhaveri, one of Georgia's latest-ripening
    grapes, is picked after mid-November.
  body: >-
    **In Keda the harvest begins when most of Georgia's vineyards already stand bare: Chkhaveri, the valley's
    signature grape, is usually picked only after mid-November.**


    Keda sits at 256 metres where the Akavreta meets the Adjaristsqali, 42 kilometres east of Batumi on
    the road to Akhaltsikhe. In the eighteenth century Prince Vakhushti described it as a small, town-like
    settlement of merchants; when the historian Dimitri Bakradze came through in 1874 he found a trading
    post of four quarters spread across both banks. Today some 1,300 people live here, with a local history
    museum and a mineral spring of the town's own.


    Chkhaveri came from neighbouring Guria, where it was grown the old way, as maghlari: the vine climbing
    a living tree, its clusters hanging high above the damp ground. In 1935 the variety was planted in
    a collection plot at Keda; today it survives on small plots across the municipality, mostly on low
    trellises, so that maghlari here is more memory than method. The wine runs from almost white through
    pale amber to the faintest pink, delicate and bright with acidity, and a semi-sweet version is made
    too. The other grape you will meet on Adjaran labels is Tsolikouri, a white.


    On the way up the valley, in the village of Adjaristsqali, the Adjarian Wine House has been working
    since 2010, with a qvevri cellar, tasting rooms and its own vines. It makes Chkhaveri rosé both in
    qvevri and in the conventional way, and teaches visitors to open a qvevri, bake bread and distil chacha.
    Higher up, wine is still a household affair, and the best introduction is your guesthouse host.


    Keda rewards the late traveller. Come in November, when the chestnut woods above the river turn to
    rust and the year's Chkhaveri has only just been pressed.
  tip: >-
    Allow three hours for a tasting, a long lunch and a stroll by the river. The Adjarian Wine House lists
    daily hours of 11:00 to 22:00 and takes bookings by phone; reserve ahead for a tasting or a master
    class. Family cellars in Keda keep no hours at all, so ask your guesthouse to arrange a visit rather
    than knocking at a gate. Whoever is driving does not taste: the valley road is narrow, full of minibuses
    and patrolled. Lanes up to hillside houses are often steep concrete, treacherous after rain. Toilets
    at the cellars, cafés in the centre of Keda.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then the S12 (E692) through Lanchkhuti
    to the coast at Grigoleti and the S2 (E70) south through Kobuleti. At Batumi turn inland onto the
    Sh1, the Batumi–Akhaltsikhe road, and follow the Adjaristsqali upstream past Makhuntseti for about
    42 km to Keda: roughly 400 km and just over six hours in all. It is asphalt throughout, but the valley
    section is narrow, winding and often wet. Fill up on the coast. An economy car is enough; take the
    steep concrete lanes to hillside cellars slowly.
ru:
  name: Кеда и аджарские винные погреба
  short: >-
    Приречный городок на старой дороге из Батуми вглубь Аджарии, где чхавери — один из самых позднеспевающих
    сортов Грузии — собирают после середины ноября.
  body: >-
    **В Кеде сбор винограда начинается тогда, когда большинство виноградников Грузии уже стоят пустые:
    чхавери, главный сорт этой долины, обычно собирают только после середины ноября.**


    Кеда стоит на высоте 256 метров, у слияния Акаврета и Аджарисцкали, в 42 километрах восточнее Батуми,
    на дороге к Ахалцихе. В XVIII веке царевич Вахушти описывал её как небольшое, похожее на городок поселение
    купцов; когда в 1874 году сюда добрался историк Димитрий Бакрадзе, он застал торговый пункт из четырёх
    кварталов на обоих берегах реки. Сегодня здесь живёт около 1300 человек, есть краеведческий музей
    и собственный минеральный источник.


    Чхавери пришёл из соседней Гурии, где его выращивали по старинке, маглари: лоза поднималась по живому
    дереву, а гроздья свисали высоко над влажной землёй. В 1935 году сорт высадили на коллекционном участке
    в Кеде; сегодня он сохранился на небольших наделах по всему муниципалитету, в основном на низких шпалерах,
    так что маглари здесь скорее память, чем метод. Вино получается от почти белого до светло-янтарного
    и едва розового, нежное, с яркой кислотностью; делают и полусладкий вариант. Второй сорт, который
    вы встретите на аджарских этикетках, — белый цоликоури.


    По дороге вверх по ущелью, в селе Аджарисцкали, с 2010 года работает «Аджарский винный дом»: погреб
    с квеври, дегустационные залы и собственные виноградники. Здесь делают розовое чхавери и в квеври,
    и обычным способом, а гостей учат открывать квеври, выпекать хлеб и гнать чачу. Выше в горах вино
    остаётся домашним делом, и лучший способ к нему прикоснуться — хозяин гостевого дома.


    Кеда вознаграждает тех, кто приезжает поздно. Приезжайте в ноябре, когда каштановые леса над рекой
    окрашиваются в цвет ржавчины, а урожай чхавери этого года только что отжат.
  tip: >-
    На дегустацию, долгий обед и прогулку у реки хватит трёх часов. «Аджарский винный дом» работает, по
    заявленным данным, ежедневно с 11:00 до 22:00 и принимает бронирование по телефону; на дегустацию
    или мастер-класс запишитесь заранее. У семейных погребов Кеды часов работы вообще нет, так что попросите
    хозяина гостевого дома договориться о визите, а не стучите в ворота сами. Тот, кто за рулём, не пьёт:
    дорога в ущелье узкая, забита микроавтобусами и часто патрулируется. Подъезды к домам на склоне часто
    крутые, бетонные, скользкие после дождя. Туалеты — в погребах, кафе — в центре Кеды.
  route: >-
    От Тбилиси по S1 (E60) на запад, через Кутаиси до Самтредиа, затем по S12 (E692) через Ланчхути к
    побережью у Григолети и по S2 (E70) на юг через Кобулети. У Батуми сверните от побережья на Ш1, дорогу
    Батуми–Ахалцихе, и следуйте вверх по Аджарисцкали, минуя Махунцети, около 42 км до Кеды: всего получается
    около 400 км и чуть больше шести часов. Дорога заасфальтирована целиком, но участок в ущелье узкий,
    извилистый и часто влажный. Заправляйтесь на побережье. Машины экономкласса достаточно; на крутых
    бетонных подъездах к погребам на склоне ведите машину медленно.
fa:
  name: کدا و سرداب‌های شراب آجارا
  short: >-
    شهرکی کنار رودخانه بر جاده‌ی کهنی که از باتومی به دل کوهستان می‌رود، جایی که «چخاوری»، یکی از دیررس‌ترین
    انگورهای گرجستان، پس از نیمه‌ی نوامبر چیده می‌شود.
  body: >-
    **در کدا، برداشت انگور زمانی آغاز می‌شود که بیشتر تاکستان‌های گرجستان از پیش خالی‌اند: چخاوری، انگور
    اصلی این دره، معمولاً تنها پس از نیمه‌ی نوامبر چیده می‌شود.**


    کدا در ارتفاع ۲۵۶ متری، در محل تلاقی آکاورتا و آجاریستسکالی قرار دارد، ۴۲ کیلومتر شرق باتومی، بر جاده‌ی
    آخالتسیخه. در سده‌ی هجدهم، شاهزاده واخوشتی آن را دهکده‌ای کوچک و شهرگون از بازرگانان وصف کرد؛ و چون
    تاریخ‌نگار دیمیتری باکرادزه در سال ۱۸۷۴ از این‌جا گذشت، پایگاهی بازرگانی از چهار محله بر دو کرانه‌ی
    رودخانه یافت. امروز نزدیک به ۱٬۳۰۰ نفر در کدا زندگی می‌کنند و موزه‌ی محلی تاریخی و چشمه‌ی معدنی خودش
    را دارد.


    چخاوری از گوریای همسایه آمده، جایی که به شیوه‌ی کهن، به‌صورت «ماغلاری» پرورده می‌شد: تاک از درختی
    زنده بالا می‌رفت و خوشه‌ها از فراز زمینی مرطوب آویزان می‌شدند. در سال ۱۹۳۵ این رقم را در یک قطعه‌ی
    کلکسیونی در کدا کاشتند؛ امروز در قطعات کوچکی در سراسر شهرستان باقی مانده، بیشتر روی داربست‌های پایین،
    پس ماغلاری در این‌جا بیش از آن‌که شیوه‌ای باشد، خاطره‌ای است. شراب آن از تقریباً سفید تا کهربایی روشن
    و صورتی محو در نوسان است، لطیف و با اسیدیته‌ای زنده؛ نوعی نیمه‌شیرین نیز از آن ساخته می‌شود. انگور
    دیگری که اغلب بر برچسب‌های آجارا می‌بینید، تسولیکوری است، انگوری سفید.


    در راه بالای دره، در روستای آجاریستسکالی، از سال ۲۰۱۰ «خانه‌ی شراب آجارا» کار می‌کند: سردابی با خمره‌های
    کوِوری، سالن‌های چشش و تاکستانی از خود. در این‌جا رزه‌ی چخاوری را هم در خمره و هم به شیوه‌ی معمول
    می‌سازند، و به بازدیدکننده باز‌کردن خمره، پختن نان و تقطیر چاچا را می‌آموزند. بالاتر، در روستاها،
    شراب هنوز کاری خانگی است و بهترین راه رسیدن به آن، میزبان اقامتگاه شماست.


    کدا به مسافر دیرآمده پاداش می‌دهد. در نوامبر بیایید، وقتی جنگل‌های شاه‌بلوط بالای رودخانه به رنگ زنگار
    می‌افتند و چخاوری امسال تازه فشرده شده است.
  tip: >-
    سه ساعت برای چشش، ناهاری طولانی و گشتی کنار رودخانه کافی است. «خانه‌ی شراب آجارا» به‌گفته‌ی خود، هر
    روز از ۱۱:۰۰ تا ۲۲:۰۰ باز است و رزرو تلفنی می‌پذیرد؛ برای چشش یا کارگاه از پیش جا بگیرید. سرداب‌های
    خانوادگی کدا اصلاً ساعت کاری ندارند، پس به‌جای در زدن، از میزبان اقامتگاه‌تان بخواهید بازدید را هماهنگ
    کند. هرکه پشت فرمان است چشش نمی‌کند: جاده‌ی دره تنگ و پر از ون است و اغلب گشت پلیس دارد. مسیرهای بتنیِ
    شیب‌دار به خانه‌های روی دامنه اغلب پس از باران خطرناک و لیزند. سرویس بهداشتی در سرداب‌هاست، کافه در
    مرکز کدا.
  route: >-
    از تفلیس با S1 (E60) به‌سوی غرب، از کوتایسی تا سامترِدیا، سپس با S12 (E692) از میان لانچخوتی تا ساحل
    در گریگولتی، و با S2 (E70) به‌سوی جنوب از میان کوبولتی. نزدیک باتومی به Sh1، جاده‌ی باتومی-آخالتسیخه،
    بپیچید و آجاریستسکالی را رو به بالا دنبال کنید، از کنار ماخونتسِتی، حدود ۴۲ کیلومتر تا کدا: در کل
    حدود ۴۰۰ کیلومتر و کمی بیش از شش ساعت. جاده تا انتها آسفالته است، اما بخش دره تنگ، پرپیچ و اغلب مرطوب
    است. در ساحل سوخت‌گیری کنید. خودروی اقتصادی کافی است؛ در سراشیبی‌های بتنیِ تند به‌سوی سرداب‌های روی
    دامنه آهسته برانید.
he:
  name: קדה ומרתפי היין של אג'ריה
  short: >-
    עיירת נהר על הדרך הישנה מבטומי אל פנים הארץ, שבה קוטפים את הצ'חוורי, אחד מזני הענבים המאוחרים ביותר
    בגאורגיה, אחרי אמצע נובמבר.
  body: >-
    **בקדה מתחיל הבציר בזמן שרוב כרמי גאורגיה כבר ריקים: את הצ'חוורי, זן הענבים הראשי של העמק, קוטפים
    בדרך כלל רק אחרי אמצע נובמבר.**


    קדה שוכנת בגובה 256 מטרים, במקום שבו נפגשים האקוורטה והאג'ריסצקלי, 42 קילומטרים ממזרח לבטומי, על הדרך
    לאחלציחה. במאה ה-18 תיאר הנסיך ואחושטי אותה כיישוב קטן, דמוי-עיר, של סוחרים; וכשהגיע ההיסטוריון דימיטרי
    בקראדזה ב-1874 מצא תחנת מסחר של ארבע שכונות פרושות על שתי גדות הנהר. היום חיים בקדה כ-1,300 תושבים,
    ויש בה מוזיאון היסטורי מקומי ומעיין מים מינרליים משלה.


    הצ'חוורי הגיע מגוריה השכנה, שם גידלו אותו בדרך הישנה, כ"מגלרי": הגפן מטפסת על עץ חי, ואשכולותיה תלויים
    גבוה מעל האדמה הלחה. ב-1935 נשתל הזן בחלקת אוסף בקדה; היום הוא שרד על חלקות קטנות בכל המחוז, בעיקר
    על דליות נמוכות, כך שהמגלרי כאן הוא זיכרון יותר משהוא שיטה. היין נע מגוון כמעט לבן, דרך ענבר בהיר,
    ועד ורוד קלוש, עדין עם חמיצות ערה; מכינים ממנו גם גרסה חצי-מתוקה. הזן השני שתפגשו על תוויות אג'ריה
    הוא צוליקורי, זן לבן.


    בעלייה בעמק, בכפר אג'ריסצקלי, פועל מ-2010 "בית היין של אג'ריה": מרתף קוורי, אולמות טעימה וכרם משלו.
    שם מכינים רוזה צ'חוורי גם בקוורי וגם בדרך המקובלת, ומלמדים מבקרים לפתוח קוורי, לאפות לחם ולזקק צ'אצ'ה.
    גבוה יותר, בכפרים, היין הוא עדיין עניין משפחתי, והדרך הטובה ביותר להגיע אליו היא בעל אכסניית האירוח
    שלכם.


    קדה מתגמלת את המטייל המאוחר. הגיעו בנובמבר, כשיערות הערמונים מעל הנהר מקבלים גוון של חלודה, והצ'חוורי
    של השנה נסחט רק לפני זמן קצר.
  tip: >-
    שלוש שעות מספיקות לטעימה, לארוחת צהריים ארוכה ולטיול לצד הנהר. "בית היין של אג'ריה" מציין שהוא פתוח
    מדי יום מ-11:00 עד 22:00 ומקבל הזמנות בטלפון; לטעימה או לסדנה הזמינו מראש. במרתפים המשפחתיים בקדה
    אין שעות פעילות כלל, אז בקשו מבעל האכסניה לתאם ביקור במקום לדפוק על השער. מי שנוהג לא טועם: הדרך בעמק
    צרה, מלאה במיניבוסים ולעיתים קרובות יש בה ניידות משטרה. דרכי הגישה לבתים שעל המדרון הן לרוב בטון תלול,
    שנעשה מסוכן אחרי גשם. שירותים במרתפים, בתי קפה במרכז קדה.
  route: >-
    מטביליסי סעו ב-S1 (E60) מערבה, דרך קוטאיסי עד סמטרדיה, ואז ב-S12 (E692) דרך לנצ'חוטי לחוף בגריגולטי,
    וב-S2 (E70) דרומה דרך קובולטי. סמוך לבטומי פנו פנימה אל כביש Sh1, כביש בטומי-אחלציחה, ועקבו אחר האג'ריסצקלי
    במעלה הזרם, לצד מאחונצטי, כ-42 ק"מ עד קדה: בסך הכול כ-400 ק"מ ומעט יותר משש שעות. הכביש סלול לכל אורכו,
    אך קטע העמק צר, מתפתל ולעיתים רטוב. תדלקו בחוף. רכב אקונומי מספיק; בעליות הבטון התלולות למרתפים על
    המדרון נהגו לאט.
ar:
  name: كِدا وأقبية النبيذ في أدجارا
  short: >-
    بلدة نهرية على الطريق القديم من باتومي إلى الداخل، حيث يُقطف عنب "تشخافيري"، أحد أبطأ أصناف العنب
    نضجًا في جورجيا، بعد منتصف نوفمبر.
  body: >-
    **في كِدا يبدأ قطاف العنب حين تكون معظم كروم جورجيا فارغة أصلًا: تشخافيري، عنب الوادي الرئيسي، لا
    يُقطف عادةً إلا بعد منتصف نوفمبر.**


    تقع كِدا على ارتفاع 256 مترًا، عند ملتقى نهري أكافريتا وأدجاريستسكالي، على بعد 42 كيلومترًا شرق باتومي،
    على طريق أخالتسيخه. في القرن الثامن عشر وصفها الأمير فاخوشتي بأنها بلدة صغيرة شبه مدينة يسكنها التجار؛
    وحين وصل إليها المؤرخ ديميتري باكرادزه عام 1874 وجد مركزًا تجاريًا من أربعة أحياء منتشرة على ضفتي
    النهر. يعيش في كِدا اليوم نحو 1,300 نسمة، وفيها متحف تاريخي محلي وعين مياه معدنية خاصة بها.


    قدِم تشخافيري من غوريا المجاورة، حيث كان يُزرع بالطريقة القديمة، "ماغلاري": الكرمة تتسلّق شجرة حية،
    وتتدلّى عناقيدها عاليًا فوق الأرض الرطبة. في عام 1935 غُرس هذا الصنف في حقل لتجميع الأصناف في كِدا؛
    واليوم بقي على مساحات صغيرة في أنحاء البلدية، معظمها على تعريشات منخفضة، فأصبح الماغلاري هنا ذكرى
    أكثر منه طريقة. يتراوح نبيذه من أبيض تقريبًا إلى كهرماني فاتح ووردي خفيف، رقيق وبحموضة نشطة؛ ويُصنع
    منه أيضًا نوع شبه حلو. والصنف الآخر الذي ستقابله كثيرًا على ملصقات أدجارا هو تسوليكوري، وهو عنب أبيض.


    في الطريق صعودًا في الوادي، في قرية أدجاريستسكالي، تعمل منذ عام 2010 "دار نبيذ أدجارا": قبو بجرار
    كفيفري، وقاعات تذوق، وكرمها الخاص. يُصنع هناك نبيذ تشخافيري الوردي في الكفيفري وبالطريقة المعتادة
    معًا، ويتعلّم الزائر فتح الكفيفري وخَبز الخبز وتقطير التشاتشا. أما في الأعلى، في القرى، فالنبيذ لا
    يزال شأنًا عائليًا، وأفضل طريق إليه هو مضيف بيت الضيافة الذي تنزل فيه.


    تجزي كِدا المسافر المتأخر. تعالَ في نوفمبر، حين تتحوّل غابات الكستناء فوق النهر إلى لون الصدأ، وتشخافيري
    هذا العام قد عُصر لتوّه.
  tip: >-
    تكفي ثلاث ساعات للتذوق وغداء طويل ونزهة على ضفة النهر. تذكر "دار نبيذ أدجارا" أنها مفتوحة يوميًا من
    11:00 إلى 22:00 وتقبل الحجز بالهاتف؛ فاحجز مسبقًا لجلسة تذوق أو ورشة. لا تلتزم الأقبية العائلية في
    كِدا بأي مواعيد على الإطلاق، فاطلب من مضيف بيت الضيافة أن يرتّب الزيارة بدلًا من أن تقرع بابًا مباشرة.
    من يقود لا يتذوّق: طريق الوادي ضيق ومزدحم بالحافلات الصغيرة وتكثر فيه دوريات الشرطة. الممرات الخرسانية
    الصاعدة إلى البيوت على المنحدر غالبًا شديدة الانحدار وخطرة بعد المطر. المرافق الصحية في الأقبية، والمقاهي
    في وسط كِدا.
  route: >-
    من تبليسي سِر على S1 (E60) غربًا، عبر كوتايسي إلى سامتريديا، ثم على S12 (E692) عبر لانتشخوتي إلى الساحل
    عند غريغوليتي، وعلى S2 (E70) جنوبًا عبر كوبوليتي. قرب باتومي انحرف إلى طريق Sh1، طريق باتومي-أخالتسيخه،
    واتبع نهر أدجاريستسكالي صعودًا، مارًّا بماخونتسِتي، نحو 42 كم حتى كِدا: أي نحو 400 كم إجمالًا وأكثر
    من ست ساعات بقليل. الطريق معبّد بالكامل، لكن قطاع الوادي ضيق ومتعرّج ورطب غالبًا. تزوّد بالوقود على
    الساحل. تكفي سيارة اقتصادية؛ وقُد بحذر في المنحدرات الخرسانية الشديدة نحو الأقبية على السفح.
