ka:
  name: ზესხოს სოფელი და ხეობა
  short: >-
    ქვემო სვანეთის მხოლოდ ზაფხულობით დასახლებული სოფელი 1800 მეტრზე მაღლა — ოდესღაც ალპინისტების ბაზა,
    დღეს რაჭისკენ მიმავალი ლაშქრობის დასაწყისი.
  body: >-
    **ზესხო ის სოფელია, რომელიც ივნისში ივსება და სექტემბერში ისევ ცარიელდება.**


    ის ქვემო სვანეთში, ზღვის დონიდან 1800 მეტრზე მაღლა, ზესხოს — ისტორიულად ზესხურას — ხეობაში მდებარეობს.
    მდინარე სულ 19 კილომეტრისაა: კავკასიონის სამხრეთ კალთაზე, შარივცეკის უღელტეხილის დასავლეთით, 2780
    მეტრზე იწყება და ქვემოთ ცხენისწყალს ერთვის. ზამთარი აქ გრძელი და თოვლიანია, გზა იკეტება და მუდმივად
    ცოტა ვინმე რჩება. ზაფხულში მწყემსები საქონელს მაღალ საძოვრებზე ამორეკავენ და სოფელი რამდენიმე თვით
    ისევ ცოცხლდება.


    1978 წელს სოფლის სამხრეთ-აღმოსავლეთით, ხეობაში, ალპინისტური ბანაკი „ზესხო“ მოეწყო. საბჭოთა ალპინისტები
    აქედან ტექნიკურად რთულ მარშრუტებზე — აილამაზე, ყორულდაშსა და შხარის სამხრეთ კალთებზე — ადიოდნენ. შენობების
    დიდი ნაწილი დღეს დანგრეულია, მაგრამ მოლაშქრეები კარვებს ისევ აქ შლიან.


    დღეს ზესხო, უპირველეს ყოვლისა, ზღურბლია: ზესხო–ღების ლაშქრობის ერთი ბოლო, რომელიც სასვანოს ტბების
    გავლით მთებს გადაკვეთს და ზემო რაჭაში ჩადის.


    სოფელი ზესხოს მწვერვალში არ აგერიოთ — ეს 3792-მეტრიანი მთა რუსეთის საზღვარზე, სოფლიდან დაახლოებით
    ექვსი კილომეტრით ჩრდილო-აღმოსავლეთით დგას. მათ მხოლოდ სახელი აქვთ საერთო, სიმაღლე — არა.


    მანქანის ფანჯრიდან ზესხო ბევრს ვერაფერს გაჩვენებთ. მისი საჩუქარი ბილიკია, რომელიც იქ იწყება, სადაც
    გზა მთავრდება.
  tip: >-
    ჩამოდით ივნისის ბოლოდან სექტემბრის შუა რიცხვებამდე და ზესხო ექსპედიციის დასაწყისად აღიქვით და არა
    სანახაობად. მაღაზია, საწვავი და ნაღდი ფული ბოლოს ლენტეხშია; იქიდან ყველაფერი თან წაიღეთ, კარვისა და
    წყლის გასაწმენდი საშუალების ჩათვლით. მობილური კავშირი დიდ მონაკვეთებზე არ არის, ამიტომ თქვენი გეგმა
    ლენტეხში ვინმეს დაუტოვეთ. ხეობის თავზე აღმართული მთავარი ქედი რუსეთთან სახელმწიფო საზღვარია: მისკენ
    წასვლამდე ადგილობრივ გიდს ან სასაზღვრო პოლიციას ჰკითხეთ, საშვი ხომ არ გჭირდებათ. ზესხო–ღების ლაშქრობას
    რამდენიმე დღე სჭირდება — აიყვანეთ გიდი, რომელმაც უღელტეხილები კარგად იცის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ქუთაისამდე, იქიდან ცაგერამდე — ან შ15-ით წყალტუბოს გავლით,
    ან რიონის ხეობით ალპანაზე, — შემდეგ კი შ15-ით ცხენისწყალს ლენტეხამდე აუყევით: სულ დაახლოებით 320 კმ.
    ლენტეხის შემდეგ შ15 ხეობას აღმოსავლეთით კიდევ 49-იოდე კილომეტრი მიუყვება, ბოლო 5 კილომეტრზე კი შ123
    ზესხოს ხეობაში ადის. სულ დაახლოებით 375 კმ-ია; გზას შვიდნახევარი საათი დაუთმეთ. ლენტეხის იქით გზა
    უარესდება, ბოლო მონაკვეთი კი მოუასფალტებელია — უხიდო ფონებით, ჩამოცვენილი ქვებითა და წვიმის შემდეგ
    ტალახით. აქ ნამდვილი ოთხწამყვანიანი მანქანაა საჭირო; გვიანი შემოდგომიდან გვიან გაზაფხულამდე გზა თოვლით
    იკეტება. საწვავი ლენტეხში ჩაასხით.
en:
  name: Zeskho Village and Gorge
  short: >-
    A summer-only herders' village above 1,800 metres in Lower Svaneti, once a base for Soviet climbers
    and now the start of the trek to Racha.
  body: >-
    **Zeskho is a village that fills up in June and empties again in September.**


    It lies above 1,800 metres in Lower Svaneti, in the valley of the Zeskho, historically the Zeskhura.
    The river is only 19 km long: it rises at 2,780 metres on the southern slope of the Caucasus, west
    of the Sharivtsek pass, and joins the Tskhenistskali below. Winters here are long and deep in snow,
    the track closes, and few people stay. In summer the herders bring their animals up to the high pastures,
    and for a few months the village comes back to life.


    In 1978 a mountaineering camp, also called Zeskho, was set up in the valley south-east of the village.
    Soviet climbers used it as a base for demanding technical routes on Ailama, Koruldashi and the southern
    flanks of Shkhara. Most of its buildings have since fallen into disrepair, but trekkers still pitch
    their tents on the site.


    Today Zeskho is above all a threshold: one end of the Zeskho–Ghebi trek, which crosses the mountains
    past the Sasvano lakes into upper Racha.


    Do not confuse the village with Mount Zeskho, a 3,792-metre peak on the Russian border about six kilometres
    to the north-east. They share a name, not a height.


    From a car window Zeskho has little to show. What it offers is the path that begins where the track
    ends.
  tip: >-
    Come between late June and mid-September, and treat Zeskho as the start of an expedition rather than
    a sight. Lentekhi is the last place with shops, fuel and cash; beyond it, carry everything, including
    a tent and a way to purify water. There is no phone signal for long stretches, so leave your plans
    with someone in Lentekhi. The main ridge above the valley is the state border with Russia: before
    walking towards it, ask a local guide or the Border Police if a permit is needed. The Zeskho–Ghebi
    trek takes several days; hire a guide who knows the passes.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi and head north to Tsageri, either on the Sh15 through
    Tskaltubo or up the Rioni via Alpana, then follow the Sh15 up the Tskhenistskali to Lentekhi, about
    320 km in all. Beyond Lentekhi the Sh15 continues east up the valley for some 49 km before the Sh123
    climbs the last 5 km into the Zeskho valley. The total is about 375 km: allow seven and a half hours.
    Past Lentekhi the road deteriorates, and the final track is unpaved, with unbridged stream crossings,
    rockfall and mud after rain. It needs a genuine 4x4 and is closed by snow from late autumn to late
    spring. Refuel in Lentekhi.
ru:
  name: Село и ущелье Зесхо
  short: >-
    Летнее пастушье село выше 1800 метров в Нижней Сванетии: когда-то база советских альпинистов, теперь
    начало перехода в Рачу.
  body: >-
    **Зесхо — село, которое наполняется в июне и снова пустеет в сентябре.**


    Оно лежит выше 1800 метров в Нижней Сванетии, в долине реки Зесхо, исторически Зесхуры. Река длиной
    всего 19 км берёт начало на высоте 2780 метров на южном склоне Кавказа, западнее перевала Шаривцек,
    и ниже впадает в Цхенисцкали. Зимы здесь долгие и снежные, дорога закрывается, и остаются немногие.
    Летом пастухи пригоняют скот на высокогорные пастбища, и на несколько месяцев село оживает.


    В 1978 году в долине юго-восточнее села открыли альпинистский лагерь, тоже названный Зесхо. Советские
    альпинисты использовали его как базу для сложных технических маршрутов на Айламу, Корулдаши и южные
    склоны Шхары. Большинство его зданий с тех пор пришло в упадок, но туристы по-прежнему ставят палатки
    на месте лагеря.


    Сегодня Зесхо прежде всего порог: один из концов маршрута Зесхо — Геби, который пересекает горы мимо
    озёр Сасвано и выводит в Верхнюю Рачу.


    Не путайте село с горой Зесхо — вершиной высотой 3792 метра на границе с Россией, примерно в шести
    километрах к северо-востоку. Общее у них — имя, а не высота.


    Из окна машины Зесхо почти нечего показать. Его настоящий дар — тропа, которая начинается там, где
    кончается дорога.
  tip: >-
    Приезжайте с конца июня до середины сентября и воспринимайте Зесхо как начало экспедиции, а не как
    достопримечательность. Лентехи — последнее место с магазинами, топливом и наличными; дальше везите
    всё с собой, включая палатку и средство для очистки воды. На долгих участках нет мобильной связи,
    поэтому оставьте свои планы кому-нибудь в Лентехи. Главный хребет над долиной — государственная граница
    с Россией: прежде чем идти в её сторону, спросите местного гида или пограничную полицию, нужен ли
    пропуск. Переход Зесхо — Геби занимает несколько дней; наймите гида, который знает перевалы.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси и на север до Цагери — либо по Sh15 через Цхалтубо, либо
    вверх по Риони через Алпану, — а затем по Sh15 вверх по Цхенисцкали до Лентехи, всего около 320 км.
    За Лентехи Sh15 продолжается на восток вверх по долине ещё примерно 49 км, после чего Sh123 поднимается
    последние 5 км в долину Зесхо. Всего около 375 км: закладывайте семь с половиной часов. За Лентехи
    дорога ухудшается, а последний отрезок — грунтовка с бродами через ручьи без мостов, камнепадами и
    грязью после дождя. Нужен настоящий полноприводный внедорожник (4x4); с поздней осени до поздней весны
    дорогу закрывает снег. Заправьтесь в Лентехи.
fa:
  name: روستا و درهٔ زسخو
  short: >-
    روستای تابستانیِ شبانان در بالای ۱٬۸۰۰ متر در سوانتی سفلی؛ روزگاری پایگاه کوهنوردان شوروی و اکنون
    آغاز کوه‌پیمایی به سوی راچا.
  body: >-
    **زسخو روستایی است که در ژوئن پر می‌شود و در سپتامبر دوباره خالی.**


    در بالای ۱٬۸۰۰ متر در سوانتی سفلی، در درهٔ رود زسخو، که در گذشته زسخورا نام داشت، جای گرفته است. این
    رود تنها ۱۹ کیلومتر درازا دارد: در ارتفاع ۲٬۷۸۰ متری بر دامنهٔ جنوبی قفقاز، در غرب گردنهٔ شاریوتسک،
    سرچشمه می‌گیرد و پایین‌تر به تسخنیستسکالی می‌پیوندد. زمستان‌ها این‌جا طولانی و پربرف است، راه بسته
    می‌شود و کمتر کسی می‌ماند. تابستان‌ها شبانان دام‌هایشان را به چراگاه‌های بلند می‌آورند و روستا چند
    ماهی دوباره جان می‌گیرد.


    در سال ۱۹۷۸ اردوگاهی کوهنوردی، که آن هم زسخو نام گرفت، در دره و در جنوب‌شرق روستا برپا شد. کوهنوردان
    شوروی از آن به عنوان پایگاهی برای مسیرهای فنی دشوار بر آیلاما، کورولداشی و دامنه‌های جنوبی شخارا استفاده
    می‌کردند. بیشتر ساختمان‌هایش از آن زمان رو به ویرانی رفته‌اند، اما کوه‌پیمایان هنوز در همان محل چادر
    می‌زنند.


    امروز زسخو پیش از هر چیز یک آستانه است: یک سرِ مسیر کوه‌پیمایی زسخو–غبی، که از کوه‌ها و از کنار دریاچه‌های
    ساسوانو می‌گذرد و به راچای علیا می‌رسد.


    روستا را با کوه زسخو اشتباه نگیرید، قله‌ای ۳٬۷۹۲ متری بر مرز روسیه، حدود شش کیلومتر در شمال‌شرق. آن
    دو در نام شریک‌اند، نه در بلندی.


    از پنجرهٔ خودرو، زسخو چیز چندانی برای نشان دادن ندارد. آنچه پیش می‌نهد، راهی است که از جایی آغاز می‌شود
    که جاده پایان می‌یابد.
  tip: >-
    میان اواخر ژوئن و نیمهٔ سپتامبر بیایید و زسخو را آغاز یک سفر اکتشافی بدانید، نه یک جاذبهٔ دیدنی. لنتخی
    آخرین جایی است که فروشگاه، سوخت و پول نقد دارد؛ پس از آن همه چیز را با خود ببرید، از جمله چادر و وسیله‌ای
    برای تصفیهٔ آب. در بخش‌های طولانی آنتن تلفن نیست، پس برنامه‌تان را به کسی در لنتخی بسپارید. ستیغ اصلی
    بالای دره مرز دولتی با روسیه است: پیش از آن‌که به سویش بروید، از راهنمای محلی یا پلیس مرزی بپرسید
    که آیا مجوز لازم است. کوه‌پیمایی زسخو–غبی چند روز طول می‌کشد؛ راهنمایی استخدام کنید که گردنه‌ها را
    بشناسد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا کوتائیسی و سپس به سوی شمال تا تساگری بروید — یا از راه Sh15
    و تسخالتوبو، یا در امتداد رود ریونی از راه آلپانا — و آنگاه Sh15 را در امتداد تسخنیستسکالی تا لنتخی
    بالا بروید؛ روی‌هم حدود ۳۲۰ کیلومتر. پس از لنتخی، Sh15 حدود ۴۹ کیلومتر دیگر به سوی شرق در دره بالا
    می‌رود و سپس Sh123 پنج کیلومتر پایانی را تا درهٔ زسخو صعود می‌کند. کل مسیر حدود ۳۷۵ کیلومتر است: هفت
    ساعت و نیم وقت بگذارید. پس از لنتخی جاده بدتر می‌شود و راه پایانی خاکی است، با گذر از جویبارهای بی‌پل،
    ریزش سنگ و گل‌ولای پس از باران. به یک خودروی چهارچرخ‌محرک واقعی (4x4) نیاز دارد و از اواخر پاییز تا
    اواخر بهار برف آن را می‌بندد. در لنتخی سوخت‌گیری کنید.
he:
  name: הכפר זסחו וערוצו
  short: >-
    כפר רועים של קיץ בלבד, בגובה של יותר מ-1,800 מטר בסוואנטי התחתונה; פעם בסיס של מטפסי הרים סובייטים,
    והיום נקודת המוצא של הטרק לרצ'ה.
  body: >-
    **זסחו הוא כפר שמתמלא ביוני ומתרוקן שוב בספטמבר.**


    הוא שוכן בגובה של יותר מ-1,800 מטר בסוואנטי התחתונה, בעמק נהר הזסחו, שנקרא בעבר זסחורה. אורכו של הנהר
    19 ק״מ בלבד: הוא נובע בגובה 2,780 מטר על המדרון הדרומי של הקווקז, ממערב למעבר שריבצק, ונשפך למטה אל
    הצחניסצקאלי. החורפים כאן ארוכים ועמוסי שלג, הדרך נסגרת, ומעטים נשארים. בקיץ מעלים הרועים את עדריהם
    אל כרי המרעה הגבוהים, ולכמה חודשים הכפר חוזר לחיים.


    ב-1978 הוקם בעמק, מדרום-מזרח לכפר, מחנה טיפוס הרים שנקרא גם הוא זסחו. מטפסים סובייטים השתמשו בו כבסיס
    למסלולים טכניים תובעניים על אילמה, קורולדשי והמדרונות הדרומיים של שחרה. רוב מבניו התדרדרו מאז, אך
    מטיילים עדיין מקימים את אוהליהם באתר.


    היום זסחו הוא קודם כול סף: קצהו האחד של טרק זסחו–גבי, החוצה את ההרים על פני אגמי סאסוואנו אל רצ'ה
    העילית.


    אל תבלבלו בין הכפר להר זסחו, פסגה בגובה 3,792 מטר על הגבול עם רוסיה, כשישה קילומטרים לצפון-מזרח. משותף
    להם השם, לא הגובה.


    מחלון המכונית אין לזסחו הרבה מה להראות. מה שהוא מציע הוא השביל שמתחיל במקום שבו הדרך נגמרת.
  tip: >-
    בואו בין סוף יוני לאמצע ספטמבר, והתייחסו לזסחו כנקודת פתיחה של משלחת ולא כאתר תיירות. לנטחי היא המקום
    האחרון עם חנויות, דלק ומזומן; מעבר לה קחו איתכם הכול, כולל אוהל ואמצעי לטיהור מים. לאורך קטעים ארוכים
    אין קליטה סלולרית, אז השאירו את תוכניותיכם אצל מישהו בלנטחי. הרכס הראשי שמעל העמק הוא גבול המדינה
    עם רוסיה: לפני שאתם הולכים לכיוונו, שאלו מדריך מקומי או את משטרת הגבול אם נדרש היתר. טרק זסחו–גבי
    נמשך כמה ימים; שכרו מדריך שמכיר את המעברים.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד קותאיסי, ומשם צפונה לצאגרי — בכביש Sh15 דרך צחלטובו או במעלה
    הריוני דרך אלפאנה — ואז בכביש Sh15 במעלה הצחניסצקאלי עד לנטחי, כ-320 ק״מ בסך הכול. אחרי לנטחי ממשיך
    כביש Sh15 מזרחה במעלה העמק עוד כ-49 ק״מ, ואז כביש Sh123 מטפס את 5 הקילומטרים האחרונים אל עמק זסחו.
    המרחק הכולל כ-375 ק״מ: הקדישו שבע שעות וחצי. אחרי לנטחי הדרך מידרדרת, והקטע האחרון הוא דרך עפר, עם
    חציות נחלים ללא גשר, מפולות אבנים ובוץ אחרי גשם. נדרש רכב 4x4 של ממש, והדרך חסומה בשלג מסוף הסתיו
    ועד סוף האביב. תדלקו בלנטחי.
ar:
  name: قرية زيسخو وواديها
  short: >-
    قرية رعاة لا تعمر إلا صيفاً، فوق 1,800 متر في سفانيتي السفلى؛ كانت يوماً قاعدة لمتسلقي الجبال السوفييت،
    وهي اليوم منطلق المسير إلى راتشا.
  body: >-
    **زيسخو قرية تمتلئ في يونيو/حزيران ثم تفرغ من جديد في سبتمبر/أيلول.**


    تقع فوق 1,800 متر في سفانيتي السفلى، في وادي نهر زيسخو، الذي عُرف تاريخياً باسم زيسخورا. لا يتجاوز
    طول النهر 19 كم: ينبع على ارتفاع 2,780 متراً من السفح الجنوبي للقوقاز، غربي ممر شاريفتسيك، ويصبّ في
    نهر تسخينيستسكالي في الأسفل. الشتاء هنا طويل كثير الثلوج، يُغلق فيه الدرب، ولا يبقى إلا القليلون.
    وفي الصيف يصعد الرعاة بمواشيهم إلى المراعي العالية، فتعود الحياة إلى القرية بضعة أشهر.


    في عام 1978 أُقيم في الوادي، جنوب شرقي القرية، معسكر لتسلق الجبال سُمّي هو أيضاً زيسخو. اتخذه المتسلقون
    السوفييت قاعدة لمسارات تقنية صعبة على أيلاما وكورولداشي والسفوح الجنوبية لشخارا. وقد تداعت معظم مبانيه
    منذ ذلك الحين، لكن هواة الرحلات الجبلية ما زالوا ينصبون خيامهم في موقعه.


    واليوم زيسخو قبل كل شيء عتبة: أحد طرفي مسار زيسخو–غيبي، الذي يعبر الجبال مروراً ببحيرات ساسفانو إلى
    راتشا العليا.


    لا تخلط بين القرية وجبل زيسخو، القمة البالغ ارتفاعها 3,792 متراً على الحدود الروسية، على بعد نحو ستة
    كيلومترات إلى الشمال الشرقي. يجمعهما الاسم لا الارتفاع.


    من نافذة السيارة لا تملك زيسخو الكثير لتعرضه. ما تقدّمه هو الدرب الذي يبدأ حيث ينتهي الطريق.
  tip: >-
    تعالَ بين أواخر يونيو/حزيران ومنتصف سبتمبر/أيلول، وتعامل مع زيسخو على أنها بداية رحلة استكشافية لا
    معلماً سياحياً. لنتيخي آخر مكان فيه متاجر ووقود ونقد؛ بعدها احمل كل شيء معك، بما في ذلك خيمة ووسيلة
    لتنقية الماء. لا تغطية هاتفية على امتداد مقاطع طويلة، فاترك خطتك لدى أحد في لنتيخي. الحيد الرئيسي
    فوق الوادي هو حدود الدولة مع روسيا: قبل أن تسير نحوه اسأل مرشداً محلياً أو شرطة الحدود إن كان التصريح
    مطلوباً. يستغرق مسار زيسخو–غيبي عدة أيام؛ استأجر مرشداً يعرف الممرات.
  route: >-
    من تبليسي اسلك S1 (E60) غرباً حتى كوتايسي، واتجه شمالاً إلى تساغيري، إما على Sh15 عبر تسخالتوبو وإما
    صعوداً مع نهر ريوني عبر ألبانا، ثم اتبع Sh15 صعوداً مع تسخينيستسكالي حتى لنتيخي، أي نحو 320 كم في
    المجموع. بعد لنتيخي يواصل Sh15 شرقاً صعوداً في الوادي نحو 49 كم، ثم يصعد Sh123 الكيلومترات الخمسة
    الأخيرة إلى وادي زيسخو. المسافة الكلية نحو 375 كم: خصّص سبع ساعات ونصفاً. بعد لنتيخي تسوء حال الطريق،
    والمقطع الأخير ترابي، فيه مخاضات جداول بلا جسور وتساقط صخور ووحل بعد المطر. يحتاج إلى سيارة دفع رباعي
    حقيقية (4x4)، ويغلقه الثلج من أواخر الخريف إلى أواخر الربيع. تزوّد بالوقود في لنتيخي.
