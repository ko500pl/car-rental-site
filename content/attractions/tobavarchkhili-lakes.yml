ka:
  name: ტობავარჩხილის ტბები
  short: >-
    მეგრული ლეგენდების „ვერცხლის ტბა“: 35 მეტრი სიღრმის მყინვარული ტბა ეგრისის ქედზე, 2650 მეტრზე — გზიდან
    სამ-ხუთდღიანი ლაშქრობით.
  body: >-
    **გადმოცემით, შუაღამისას ამ ტბიდან ოქროსბეწვიანი ვერძი ამოდის — თავმდაბალს აკურთხებს, ხარბს კი ღუპავს.**


    ამბავი ასე მიდის. ერთ მდიდარ მწყემსს ტბასთან ნისლმა მოუსწრო და ფარის დაბინავება იმ ნაპირზე მოუხდა,
    რომელსაც ყველა ერიდებოდა. საუკეთესო ვერძი ღმერთს შესწირა, ილოცა და აღთქმა დადო: რასაც დამიწესებ, აღვასრულებო.
    შუაღამისას წყლიდან ოქროსბეწვიანი ვერძი ამოვიდა, დოლის დროს კი ფარის ყველა ნერბმა ოქროსბეწვიანი ბატკანი
    მოიგო. შურიანი მეზობელი იმავე ბედის საცდელად ამოვიდა, მაგრამ ვერძის შეწირვა დაენანა და ლოცვაც გულით
    არ აღუვლენია. შუაღამისას ვერძი კვლავ ამოვიდა, ფარას წინ გაუძღვა და წყალში შეიყვანა. ხმელეთზე ერთი
    ცხვარიც აღარ დარჩენილა.


    ტბა თავის ლეგენდას იმსახურებს. ტობავარჩხილი — მეგრულად „ვერცხლის ტბა“ — მყინვარულ ცირკში, ეგრისის
    ქედის სამხრეთ კალთაზე, ზღვის დონიდან დაახლოებით 2650 მეტრზე წევს, მდინარე მაგანას სათავეში. პატარაა,
    სულ რაღაც 0,21 კვადრატული კილომეტრი, მაგრამ სიღრმე 35 მეტრამდე აქვს და თევზი არ ბინადრობს. ახლომახლო
    სხვა ტბებიცაა, მათ შორის ოხოჯა და დიდი ტობავარჩხილი. ღრუბლიან დღეს წყალი ნაჭედი კალის ფერს იღებს,
    მზეზე კი სახელი თავისთავად იხსნება.


    ეგრისის ქედი კავკასიონის მთავარი ქედის პარალელურად გასდევს და სამხრეთ კალთებზე წელიწადში ორ ათას მილიმეტრზე
    მეტ ნალექს იღებს. ამიტომ ეშვება ნისლი ასე სწრაფად და ამიტომაა წიფლნარის, სოჭნარისა და ნაძვნარის ზემოთ
    მდელოები ასე ხასხასა. გზა ტბასთან ახლოსაც არ მიდის. ჩვეულებრივ, სოფელ მუხურიდან სამიდან ხუთ დღემდე
    ლაშქრობით ამოდიან; სხვა გზა ლებარდედან მოდის — ტეხურის სათავეებთან საბჭოთა დროს გაშენებული, დიდი ხანია
    ნახევრად მიტოვებული კურორტიდან.


    ლეგენდის რჩევა ბილიკზეც ძალაშია: ნისლს პატივი ეცით და მთას იმაზე მეტს ნუ მოსთხოვთ, რასაც თავად გაძლევთ.
  tip: >-
    სამიდან ხუთ დღემდე დაგეგმეთ — კარვით, ქურით და მთელი საკვებით: თავშესაფარი არ არის, მწყემსების ქოხებს
    კი ვერ დაეყრდნობით. მეგზური მუხურში აიყვანეთ, იქვე ცხენებიც მოიძებნება, რადგან მაღლა ბილიკი ქრება
    და ნისლი რამდენიმე წუთში ეშვება. რეალური ფანჯარა ივლისის შუა რიცხვებიდან სექტემბრის შუა რიცხვებამდეა;
    ივნისში ტბები შეიძლება ჯერ კიდევ ნახევრად გაყინული იყოს, უღელტეხილებზე კი ძველი თოვლი იდოს. ღამით
    ივლისშიც შეიძლება ყინავდეს. მობილური კავშირი თითქმის არ არის, ამიტომ მარშრუტი და დაბრუნების თარიღი
    ვინმეს დაუტოვეთ. ღამით საკვები კარავს მოშორებით შეინახეთ — ქედზე დათვი ბინადრობს.
  route: >-
    მითითებული მანძილი და დრო ბილიკის სათავემდეა და არა ტბამდე. თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის
    გავლით სამტრედიამდე იარეთ, შემდეგ იმავე ს1-ით სენაკამდე, იქიდან კი ჩრდილოეთით ჩხოროწყუსკენ და ხეობის
    აყოლებით სოფელ მუხურამდე — დაახლოებით 345 კმ და ექვსნახევარი საათი. ჩხოროწყუმდე ასფალტია; შემდეგ გზა
    ვიწროვდება, ცალზოლიან ხიდებზე გადადის და უხეშდება, მუხურის ზემოთ კი მხოლოდ ოთხწამყვანიანი მანქანისთვის
    ვარგისი სატყეო გზები გრძელდება. საწვავი სენაკში ან ჩხოროწყუში ჩაასხით, ზემოთ არაფერია. მეგზურები ჩვეულებრივ
    ეზოს გიშოვიან, სადაც მანქანა თქვენს დაბრუნებამდე დაგელოდებათ. მუხურის იქით ყველაფერი ფეხით ან ცხენით
    ხდება.
en:
  name: Tobavarchkhili Lakes
  short: >-
    The Silver Lake of Mingrelian legend: a 35-metre-deep cirque tarn at 2,650 m on the Egrisi range,
    three to five days' trek from the road.
  body: >-
    **Legend says that at midnight a ram with a golden fleece rises from this lake — a blessing for the
    humble, ruin for the greedy.**


    The story goes like this. A rich shepherd, caught by fog beside the lake, had to bed his flock down
    on a shore everyone avoided. He sacrificed his finest ram, prayed, and vowed to obey whatever was
    asked of him. At midnight a golden-fleeced ram came up out of the water, and at lambing time every
    ewe in his flock bore a golden lamb. An envious neighbour climbed up to try his luck, but grudged
    the sacrifice and prayed without meaning it. At midnight the ram rose again, led his whole flock into
    the lake, and not one sheep came back.


    The lake deserves its legend. Tobavarchkhili — "silver lake" in Mingrelian — lies in a glacial cirque
    at about 2,650 metres on the southern flank of the Egrisi range, at the source of the Magana. It is
    small, some 0.21 square kilometres, yet up to 35 metres deep, and holds no fish. Other tarns lie nearby,
    among them Okhoja and Didi Tobavarchkhili. Under cloud the water turns the colour of hammered pewter;
    in sun, the name explains itself.


    The Egrisi range runs parallel to the main Caucasus, and its southern slopes catch more than two metres
    of rain and snow a year. That is why fog falls so fast, and why the beech, fir and spruce give way
    to such green meadows. No road comes near. The usual approach is a three-to-five-day trek from the
    village of Mukhuri; another comes in from Lebarde, a Soviet-era spa on the upper Tekhuri, long half-abandoned.


    The legend's advice still holds on the trail: respect the fog, and never try to take more than the
    mountain offers.
  tip: >-
    Plan three to five days with a tent, stove and all your food: there are no huts, and shepherds' shelters
    cannot be relied on. Hire a guide in Mukhuri, where horses can also be arranged, because the path
    fades on the high ground and fog can fall within minutes. The realistic window is mid-July to mid-September;
    in June the lakes may still be half-frozen, with old snow on the passes. Nights can drop to freezing
    even in July. Mobile signal is almost nil, so leave your route and return date with someone. Keep
    food well away from the tent at night: bears live on the range.
  route: >-
    These figures are to the trailhead, not the lake. From Tbilisi take the S1 (E60) past Kutaisi to Samtredia
    and on along the S1 to Senaki, then head north to Chkhorotsku and up the valley to the village of
    Mukhuri — about 345 km and six and a half hours. Asphalt runs to Chkhorotsku; beyond it the road narrows,
    crosses single-lane bridges and roughens, and above Mukhuri only forest tracks for 4x4s continue.
    Refuel in Senaki or Chkhorotsku, as there is nothing higher up. Guides usually arrange a yard where
    the car can wait while you are away. Everything beyond Mukhuri is on foot or on horseback.
ru:
  name: Озёра Тобаварчхили
  short: >-
    Серебряное озеро мегрельской легенды: каровое озеро глубиной 35 м на высоте 2650 м на Эгрисском хребте
    — цель похода на три–пять дней от дороги.
  body: >-
    **Легенда гласит, что в полночь из этого озера выходит баран с золотым руном — благословение для смиренных
    и погибель для жадных.**


    История такова. Богатого пастуха у озера застиг туман, и ему пришлось уложить отару на ночь у берега,
    которого все сторонились. Он принёс в жертву лучшего барана, помолился и поклялся исполнить всё, что
    от него потребуют. В полночь из воды поднялся баран с золотым руном, а когда пришла пора ягниться,
    каждая овца в его отаре принесла золотого ягнёнка. Завистливый сосед поднялся сюда попытать счастья,
    но пожалел жертвы и молился не от сердца. В полночь баран вышел снова, увёл всю его отару в озеро,
    и ни одна овца не вернулась.


    Озеро достойно своей легенды. Тобаварчхили — по-мегрельски «серебряное озеро» — лежит в ледниковом
    каре на высоте около 2650 метров, на южном склоне Эгрисского хребта, у истока Маганы. Оно невелико,
    около 0,21 квадратного километра, но глубиной до 35 метров, и рыбы в нём нет. Рядом лежат другие озёра,
    среди них Оходжа и Диди-Тобаварчхили. Под облаками вода становится цвета кованого олова; на солнце
    название объясняет себя само.


    Эгрисский хребет тянется параллельно Главному Кавказскому, и на его южные склоны выпадает больше двух
    метров осадков в год. Поэтому туман опускается так быстро, и поэтому бук, пихта и ель уступают место
    таким зелёным лугам. Ни одна дорога сюда не подходит. Обычно идут трёх-пятидневным походом из села
    Мухури; другой путь ведёт из Лебарде — курорта советских времён в верховьях Техури, давно полузаброшенного.


    Совет легенды на тропе по-прежнему в силе: уважайте туман и никогда не пытайтесь взять больше, чем
    даёт гора.
  tip: >-
    Рассчитывайте на три-пять дней с палаткой, горелкой и всей едой: приютов нет, а на пастушьи шалаши
    полагаться нельзя. Наймите проводника в Мухури — там же можно договориться о лошадях, — потому что
    на высокогорье тропа теряется, а туман может опуститься за считаные минуты. Реальное окно — с середины
    июля до середины сентября; в июне озёра бывают ещё наполовину во льду, а на перевалах лежит старый
    снег. Ночью даже в июле возможны заморозки. Мобильной связи почти нет, поэтому оставьте кому-нибудь
    свой маршрут и дату возвращения. На ночь убирайте еду подальше от палатки: на хребте водятся медведи.
  route: >-
    Эти цифры — до начала тропы, а не до озера. Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа и дальше
    по S1 до Сенаки, затем на север до Чхороцку и вверх по долине до села Мухури — около 345 км и шести
    с половиной часов. Асфальт тянется до Чхороцку; дальше дорога сужается, идёт по однополосным мостам
    и становится всё хуже, а выше Мухури продолжаются лишь лесные дороги для внедорожников. Заправьтесь
    в Сенаки или Чхороцку — выше ничего нет. Проводники обычно договариваются о дворе, где машина подождёт
    вас. Всё, что выше Мухури, — пешком или верхом.
fa:
  name: دریاچه‌های توباوارچخیلی
  short: >-
    دریاچهٔ نقره‌ای افسانه‌های مگرلی: آبگیری یخچالی به ژرفای ۳۵ متر در ارتفاع ۲٬۶۵۰ متر بر رشته‌کوه اگریسی،
    در پایان سه تا پنج روز پیاده‌روی از جاده.
  body: >-
    **افسانه می‌گوید که نیمه‌شب قوچی با پشم زرین از این دریاچه برمی‌خیزد — برکتی برای فروتنان و تباهی
    برای آزمندان.**


    داستان چنین است. چوپانی توانگر در کنار دریاچه گرفتار مه شد و ناچار گله‌اش را شب در کرانه‌ای خواباند
    که همه از آن دوری می‌کردند. او بهترین قوچش را قربانی کرد، دعا خواند و پیمان بست که هر چه از او بخواهند
    فرمان ببرد. نیمه‌شب قوچی زرین‌پشم از آب بیرون آمد و در فصل زایش، هر میشِ گله‌اش برهٔ زرینی زاد. همسایه‌ای
    حسود برای آزمودن بخت خود بالا آمد، اما از قربانی دریغ کرد و دعایش از دل نبود. نیمه‌شب قوچ دوباره برخاست،
    همهٔ گلهٔ او را به درون دریاچه برد و حتی یک گوسفند هم بازنگشت.


    دریاچه سزاوار افسانهٔ خویش است. توباوارچخیلی — در زبان مگرلی به معنای «دریاچهٔ نقره‌ای» — در سیرکی
    یخچالی در ارتفاع حدود ۲٬۶۵۰ متر بر دامنهٔ جنوبی رشته‌کوه اگریسی، در سرچشمهٔ رود ماگانا، آرمیده است.
    کوچک است، حدود ۰٫۲۱ کیلومتر مربع، اما تا ۳۵ متر ژرفا دارد و ماهی ندارد. دریاچه‌های دیگری نیز در نزدیکی
    آن‌اند، از جمله اوخوجا و دیدی توباوارچخیلی. زیر ابر، آب به رنگ قلع چکش‌خورده درمی‌آید؛ در آفتاب، نام
    خود را توضیح می‌دهد.


    رشته‌کوه اگریسی به موازات رشتهٔ اصلی قفقاز کشیده شده و دامنه‌های جنوبی‌اش سالانه بیش از دو متر باران
    و برف می‌گیرند. از همین روست که مه چنین تند فرو می‌افتد و راش و نراد و نوئل جای خود را به چنین مرغزارهای
    سبزی می‌دهند. هیچ جاده‌ای به این نزدیکی نمی‌رسد. راه معمول، پیاده‌رویِ سه تا پنج روزه از روستای موخوری
    است؛ راه دیگری از لبارده می‌آید، آسایشگاهی از دوران شوروی در بالادست رود تخوری که دیرزمانی است نیمه‌متروک
    مانده.


    پند افسانه در مسیر هنوز به کار می‌آید: مه را حرمت بگذارید و هرگز نکوشید بیش از آنچه کوه می‌بخشد بردارید.
  tip: >-
    سه تا پنج روز با چادر، اجاق سفری و همهٔ خوراکتان برنامه‌ریزی کنید: پناهگاهی نیست و نمی‌توان به کلبه‌های
    چوپانان تکیه کرد. در موخوری راهنما بگیرید — اسب هم آن‌جا فراهم می‌شود — چون ردّ راه در ارتفاعات محو
    می‌شود و مه می‌تواند در چند دقیقه فرود آید. بازهٔ واقع‌بینانه از میانهٔ ژوئیه تا میانهٔ سپتامبر است؛
    در ژوئن ممکن است دریاچه‌ها هنوز نیمه‌یخ‌زده باشند و برف کهنه روی گردنه‌ها مانده باشد. شب‌ها حتی در
    ژوئیه ممکن است دما به زیر صفر برسد. آنتن تلفن همراه تقریباً صفر است، پس مسیر و تاریخ بازگشتتان را
    به کسی بسپارید. شب‌ها خوراک را دور از چادر نگه دارید؛ در این رشته‌کوه خرس زندگی می‌کند.
  route: >-
    این ارقام تا آغاز مسیر پیاده است، نه تا دریاچه. از تفلیس از جادهٔ S1 (E60) و از کنار کوتائیسی تا سامتردیا
    بروید و روی S1 تا سناکی ادامه دهید، سپس به سوی شمال تا چخوروتسکو و از دره بالا تا روستای موخوری بروید
    — حدود ۳۴۵ کیلومتر و شش ساعت و نیم. آسفالت تا چخوروتسکو می‌رسد؛ پس از آن جاده باریک می‌شود، از پل‌های
    یک‌خطه می‌گذرد و ناهموار می‌شود، و بالاتر از موخوری تنها راه‌های جنگلی برای خودروهای دودیفرانسیل ادامه
    دارند. در سناکی یا چخوروتسکو سوخت‌گیری کنید، چون بالاتر هیچ نیست. راهنماها معمولاً حیاطی را ترتیب
    می‌دهند که خودرو در نبودتان آن‌جا بماند. هر آنچه فراتر از موخوری است، پیاده یا سواره پیموده می‌شود.
he:
  name: אגמי טובאוורצ׳חילי
  short: >-
    אגם הכסף של האגדה המגרלית: אגם קרחוני בעומק 35 מ׳, בגובה 2,650 מ׳ על רכס אגריסי, בסופו של טרק בן שלושה
    עד חמישה ימים מן הכביש.
  body: >-
    **האגדה מספרת שבחצות עולה מן האגם הזה איל בעל גיזת זהב — ברכה לענווים וחורבן לחמדנים.**


    כך הולך הסיפור. רועה עשיר נלכד בערפל ליד האגם ונאלץ להלין את עדרו על גדה שכולם התרחקו ממנה. הוא הקריב
    את האיל הטוב ביותר שלו, התפלל ונשבע לציית לכל מה שיידרש ממנו. בחצות עלה מן המים איל בעל גיזת זהב,
    ובעונת ההמלטה המליטה כל כבשה בעדרו טלה של זהב. שכן קנאי טיפס לכאן לנסות את מזלו, אך צרה עינו בקורבן
    והתפלל בלי כוונה. בחצות עלה האיל שוב, הוביל את כל עדרו אל תוך האגם, ואף כבשה אחת לא חזרה.


    האגם ראוי לאגדה שלו. טובאוורצ׳חילי — „אגם הכסף“ במגרלית — שוכן בגומה קרחונית בגובה של כ-2,650 מטרים
    במדרון הדרומי של רכס אגריסי, במקורות נהר המגאנה. הוא קטן, כ-0.21 קילומטר רבוע, אך עומקו מגיע ל-35
    מטרים, ואין בו דגים. אגמים אחרים שוכנים בקרבתו, ובהם אוחוג׳ה ודידי טובאוורצ׳חילי. תחת עננים המים מקבלים
    צבע של בדיל מרוקע; בשמש, השם מסביר את עצמו.


    רכס אגריסי משתרע במקביל לרכס הקווקז הראשי, ומדרונותיו הדרומיים סופגים יותר משני מטרים של משקעים בשנה.
    זו הסיבה שהערפל יורד כל כך מהר, וזו הסיבה שיערות האשור, האשוח והאשוחית מפנים את מקומם לכרי דשא ירוקים
    כל כך. שום כביש אינו מגיע קרוב. הגישה המקובלת היא טרק בן שלושה עד חמישה ימים מן הכפר מוחורי; דרך אחרת
    מגיעה מלברדה, עיירת מרפא מן התקופה הסובייטית במעלה נהר התחורי, שננטשה למחצה לפני זמן רב.


    עצת האגדה עדיין תקפה על השביל: כבדו את הערפל, ולעולם אל תנסו לקחת יותר ממה שההר נותן.
  tip: >-
    תכננו שלושה עד חמישה ימים עם אוהל, כירה וכל האוכל: אין בקתות, ואי אפשר לסמוך על מחסות הרועים. שכרו
    מדריך במוחורי, שם אפשר גם לארגן סוסים, כי השביל נעלם באזורים הגבוהים והערפל יכול לרדת תוך דקות. החלון
    המעשי הוא מאמצע יולי עד אמצע ספטמבר; ביוני האגמים עשויים להיות עדיין קפואים למחצה, ועל המעברים עוד
    שוכב שלג ישן. בלילות הטמפרטורה עלולה לרדת לאפס גם ביולי. קליטה סלולרית כמעט אין, לכן השאירו אצל מישהו
    את המסלול ואת תאריך החזרה. בלילה הרחיקו את האוכל מן האוהל: ברכס חיים דובים.
  route: >-
    הנתונים האלה הם עד תחילת השביל, לא עד האגם. מטביליסי סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה
    והמשיכו ב-S1 עד סנקי, ומשם צפונה לצ׳חורוצקו ובמעלה העמק עד הכפר מוחורי — כ-345 ק״מ ושש וחצי שעות.
    הכביש סלול עד צ׳חורוצקו; אחריו הוא מצטמצם, חוצה גשרים חד-נתיביים ונעשה משובש, ומעל מוחורי ממשיכות
    רק דרכי יער לרכבי שטח בהנעה כפולה. תדלקו בסנקי או בצ׳חורוצקו, כי גבוה יותר אין דבר. המדריכים מסדרים
    בדרך כלל חצר שבה הרכב יחכה בזמן היעדרותכם. כל מה שמעבר למוחורי — ברגל או על גב סוס.
ar:
  name: بحيرات توبافارتشخيلي
  short: >-
    البحيرة الفضية في الأسطورة المنغرلية: بحيرة جليدية بعمق 35 م على ارتفاع 2,650 م في سلسلة إيغريسي،
    في نهاية رحلة سير من ثلاثة إلى خمسة أيام.
  body: >-
    **تقول الأسطورة إن كبشاً ذا صوف ذهبي يخرج من هذه البحيرة عند منتصف الليل — بركةً للمتواضعين وهلاكاً
    للطامعين.**


    وتروي الحكاية أن راعياً ثرياً باغته الضباب قرب البحيرة، فاضطر إلى أن يُبيّت قطيعه على شاطئ كان الجميع
    يتجنّبونه. فذبح أفضل كباشه قرباناً، وصلّى، ونذر أن يطيع كل ما يُطلب منه. وعند منتصف الليل خرج من الماء
    كبش ذو صوف ذهبي، ولمّا حان موسم الولادة وضعت كل نعجة في قطيعه حَمَلاً من ذهب. فصعد جار حسود ليجرّب
    حظه، لكنه بخل بالقربان وصلّى بلا إخلاص. وعند منتصف الليل خرج الكبش ثانية، وقاد قطيعه كله إلى البحيرة،
    ولم تعد منه شاة واحدة.


    والبحيرة جديرة بأسطورتها. فتوبافارتشخيلي — "البحيرة الفضية" باللغة المنغرلية — تقع في حوض جليدي على
    ارتفاع نحو 2,650 متراً على السفح الجنوبي لسلسلة إيغريسي، عند منبع نهر ماغانا. وهي صغيرة، نحو 0.21
    كيلومتر مربع، لكن عمقها يبلغ 35 متراً، ولا سمك فيها. وتقع بالقرب منها بحيرات أخرى، منها أوخوجا وديدي
    توبافارتشخيلي. تحت الغيم يكتسي الماء لون القصدير المطروق، وفي الشمس يشرح الاسم نفسه.


    تمتد سلسلة إيغريسي موازية لسلسلة القوقاز الرئيسية، وتتلقّى سفوحها الجنوبية أكثر من مترين من الأمطار
    والثلوج سنوياً. ولهذا يهبط الضباب بهذه السرعة، ولهذا تُفسح أشجار الزان والشوح والتنّوب المكان لمروج
    بهذه الخضرة. لا طريق يقترب من هنا. والمدخل المعتاد رحلة سير من ثلاثة إلى خمسة أيام تنطلق من قرية موخوري،
    وثمة مدخل آخر من ليبارده، وهي منتجع استشفائي من الحقبة السوفييتية على أعالي نهر تيخوري، شبه مهجور
    منذ زمن طويل.


    وما زالت نصيحة الأسطورة صالحة على الدرب: احترم الضباب، ولا تحاول أبداً أن تأخذ أكثر مما يمنحه الجبل.
  tip: >-
    خطّط لثلاثة إلى خمسة أيام مع خيمة وموقد وكل طعامك: فلا أكواخ هنا، ولا يمكن الاعتماد على ملاجئ الرعاة.
    استأجر مرشداً في موخوري، حيث يمكن أيضاً ترتيب الخيول، لأن الدرب يتلاشى في المرتفعات والضباب قد يهبط
    في دقائق. النافذة الواقعية من منتصف يوليو إلى منتصف سبتمبر؛ ففي يونيو قد تكون البحيرات لا تزال نصف
    متجمّدة وعلى الممرات ثلج قديم. وقد تنخفض الحرارة ليلاً إلى درجة التجمّد حتى في يوليو. تغطية الهاتف
    المحمول شبه معدومة، فاترك مسارك وتاريخ عودتك لدى أحد ما. وأبعِد الطعام عن الخيمة ليلاً، فالدببة تعيش
    في هذه السلسلة.
  route: >-
    هذه الأرقام حتى بداية الدرب لا حتى البحيرة. من تبليسي اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامتريديا،
    وتابع على S1 إلى سيناكي، ثم اتجه شمالاً إلى تشخوروتسكو وصعوداً في الوادي حتى قرية موخوري — نحو 345
    كم وست ساعات ونصف. الطريق معبّد حتى تشخوروتسكو، وبعدها يضيق ويعبر جسوراً بحارة واحدة ويزداد وعورة،
    وفوق موخوري لا تستمر إلا مسالك غابات لسيارات الدفع الرباعي. تزوّد بالوقود في سيناكي أو تشخوروتسكو،
    فلا شيء أعلى من ذلك. وعادة ما يرتّب المرشدون فناءً تنتظر فيه السيارة أثناء غيابك. وكل ما بعد موخوري
    يُقطع سيراً على الأقدام أو على ظهور الخيل.
