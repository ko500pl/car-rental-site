ka:
  name: ტობავარჩხილის ტბები
  short: ვერცხლის ტბები ეგრისის ქედზე, 2650 მეტრზე — სამეგრელოს ყველაზე რთული და ყველაზე დასამახსოვრებელი
    ლაშქრობა.
  body: >-
    **ტობავარჩხილი სამეგრელოს მთავარი მაღალმთიანი მარშრუტია** და ერთადერთი, რომელიც სერიოზულ მომზადებას
    მოითხოვს. სახელი მეგრულად ვერცხლის ტბას ნიშნავს და ზუსტად აღწერს იმას, რასაც ხედავ: ცივი, ლითონისფერი
    წყალი ქვის ქვაბულში, დაახლოებით 2650 მეტრზე, ეგრისის ქედის გულში.


    ტბა ერთი არ არის. მარშრუტზე რამდენიმე მყინვარული ტბაა, მათ შორის ტობასკური — მუქი, ჩრდილში ჩარჩენილი
    წყალსატევი — და დიდი ტობავარჩხილი. ისინი ყინულის მიერ გამოხრულ ქვაბულებში წევს, გარშემო კი ალპური
    მდელო, დეკიანი და შიშველი კლდეა.


    აქამდე გზა არ მიდის. ეს პრინციპულად მნიშვნელოვანია: ტობავარჩხილი ერთდღიანი გასეირნება არ არის. სტანდარტული
    მარშრუტი სამიდან ხუთ დღემდე გრძელდება და ჩხოროწყუს მუნიციპალიტეტის სოფელ მუხურიდან იწყება; მეორე ვარიანტი
    ლებარდის მხრიდან მოდის. ორივე მაღალ უღელტეხილს კვეთს.


    თოვლი ივლისამდე დგას. ივნისში ტბები ხშირად ჯერ კიდევ ნაწილობრივ გაყინულია, უღელტეხილებზე კი ფირნია.
    ივლისის შუიდან სექტემბრის შუამდე — აი, რეალური ფანჯარა.


    თავშესაფარი არ არის. მწყემსების ქოხები ზოგან დგას, მაგრამ მათზე დაყრდნობა არ შეიძლება; კარავი, სახელდახელო
    ღუმელი და საკვები თან უნდა გქონდეს. წყალი უხვია, მაგრამ ბოლო დღეებში ზოგჯერ მხოლოდ თოვლის ნადნობია.


    ამინდი აქაური მთავარი რისკია. ეგრისის ქედი შავი ზღვიდან პირდაპირ იღებს ტენს და ნისლი რამდენიმე წუთში
    ეშვება. პლატოზე ორიენტირები ცოტაა და ბილიკი ადგილ-ადგილ ქრება. ამიტომ გამცილებელი აქ ფუფუნება არ არის
    — ის უსაფრთხოების საკითხია. მუხურიდან ცხენების დაქირავებაც შესაძლებელია.


    ეგრისის ქედი დაბალია მთავარ კავკასიონთან შედარებით, მაგრამ სწორედ ამიტომ არის ასეთი მწვანე: ტყის ზედა
    საზღვარი მაღლა დგას და უღელტეხილებამდე მდელო და დეკიანი აღწევს. ივლისში აქ ყვავილი ისეთი უხვია, როგორიც
    საქართველოში ცოტა სად. სამაგიეროდ, ტენი მუდმივია — კარვის შიგნით დილით ყოველთვის ნესტია და ტანსაცმელი
    ძნელად შრება.


    ველური ბუნება რეალურია: არემარეში დათვი ბინადრობს, ასევე ჯიხვი და არწივი. საკვები ღამით ხეზე ან ჩანთაში
    მოშორებით უნდა შეინახო.


    რაც ამ ყველაფრის სანაცვლოდ გელოდება, მარტივია და იშვიათი — სამი დღე ისეთ ლანდშაფტში, სადაც არც გზა
    ჩანს, არც ბოძი და არც სახლი. საქართველოში ასეთი ადგილი სულ უფრო ცოტაა.


    ქვემოთ მითითებული მანძილი და დრო მუხურის ტრეილჰედამდეა და არა ტბებამდე; იქიდან ყველაფერი ფეხით ან
    ცხენით ხდება.
  tip: >-
    ეს არ არის ერთდღიანი ვიზიტი: დაგეგმე სამიდან ხუთ დღემდე, კარვით და საკვებით. გამცილებელი ძალიან რეკომენდებულია
    — ნისლში ბილიკი იკარგება და პლატოზე ორიენტირი თითქმის არ არის. მუხურიში ცხენებისა და მეგზურის შეთანხმებაა
    შესაძლებელი. თბილი ტანსაცმელი აუცილებელია ივლისშიც: ღამით ნული გრადუსია. კავშირგაბმულობა თითქმის არსად
    არის, ამიტომ ვინმეს დაუტოვე მარშრუტი და დაბრუნების თარიღი. წყალი ბევრია, საკვები კი მხოლოდ ის, რაც
    წაიღე. სექტემბრის მეორე ნახევრიდან პირველი თოვლი უკვე შესაძლებელია, ამიტომ ამინდის პროგნოზს ორი დღით
    ადრე მაინც შეხედე.
  route: >-
    ტრეილჰედამდე: თბილისიდან E60-ით სენაკამდე, შემდეგ ჩხოროწყუსკენ და იქიდან ჩრდილოეთით სოფელ მუხურამდე
    — დაახლოებით 345 კმ და ექვს-ექვსნახევარი საათი. ჩხოროწყუმდე ასფალტია; შემდეგ გზა ვიწროვდება, ხიდები
    ვიწროა და მუხურის ზემოთ სატყეო კვალი მხოლოდ ოთხთვალა ავტომობილს გაატარებს. მანქანა სოფელში დატოვე
    — გამცილებლები ჩვეულებრივ ეზოში დგომას აწყობენ. საწვავი სენაკში ან ჩხოროწყუში აიღე — მუხურის ზემოთ
    არც სადგურია და არც მაღაზია. მშრალ ამინდშიც კი ბოლო კილომეტრები ჯიპს მოითხოვს, ხოლო წვიმის შემდეგ
    სოფლამდე მისვლაც ნელა ხდება.
en:
  name: Tobavarchkhili Lakes
  short: The Silver Lakes of the Egrisi range at 2,650 m — the hardest and most memorable trek in Samegrelo.
  body: >-
    **Tobavarchkhili is the great high route of Samegrelo,** and the only one that demands serious preparation.
    The name means Silver Lake in Mingrelian and describes exactly what you find: cold, metallic water
    in a bowl of rock at about 2,650 metres, in the heart of the Egrisi range.


    There is more than one lake. The route passes several glacial tarns, among them Tobaskuri, a dark
    pool that sits permanently in shadow, and the large Tobavarchkhili itself. They lie in cirques scooped
    out by ice, ringed by alpine meadow, rhododendron and bare rock.


    No road reaches them, and that matters. Tobavarchkhili is not a day out. The standard route takes
    three to five days and starts from the village of Mukhuri in Chkhorotsku municipality; a second approach
    comes in from the Lebarde side. Both cross high passes.


    Snow lies late. In June the lakes are often still partly frozen and the passes hold old névé. The
    realistic window is mid-July to mid-September.


    There are no huts. Shepherds' shelters stand in places but cannot be relied on: you carry a tent,
    a stove and your food. Water is plentiful, though on some sections late in the season it is snowmelt
    only.


    Weather is the main risk here. The Egrisi range takes its moisture straight off the Black Sea and
    cloud can come down in minutes. There are few landmarks on the plateau and the path disappears in
    stretches, which is why a guide is not a luxury but a safety measure. Horses can also be arranged
    in Mukhuri.


    The Egrisi range is low beside the main Caucasus, and that is exactly why it is so green: the treeline
    sits high and meadow and rhododendron run right up to the passes. In July the flowering here is as
    rich as anywhere in Georgia. The other side of that is constant damp — the inside of a tent is wet
    every morning and clothes dry slowly.


    The wildlife is real. Brown bear live in this country, along with Caucasian tur and eagles, and food
    should be hung or stored well away from the tent at night.


    What you get in exchange is simple and increasingly rare: three days in a landscape with no road,
    no pylon and no house in view.


    The distance and time given below are to the trailhead at Mukhuri, not to the lakes. Everything beyond
    that point is on foot or on horseback.
  tip: >-
    This is not a day visit: plan three to five days with a tent and your own food. A guide is strongly
    advised, because the path vanishes in cloud and the plateau offers almost nothing to navigate by.
    Horses and guides can be arranged in Mukhuri. Warm clothing is essential even in July, when nights
    drop to freezing. There is almost no phone signal, so leave your route and return date with somebody.
    Water is everywhere; food is only what you carry.
  route: >-
    To the trailhead: from Tbilisi take the E60 to Senaki, then head for Chkhorotsku and north from there
    to the village of Mukhuri — about 345 km and six to six and a half hours. Asphalt runs as far as Chkhorotsku;
    beyond that the road narrows, the bridges are single-track, and above Mukhuri the forest tracks are
    four-wheel drive only. Leave the car in the village, where guides usually arrange a yard to park in.
    Refuel in Senaki or Chkhorotsku; there is nothing higher up.
ru:
  name: Озёра Тобаварчхили
  short: Серебряные озёра Эгрисского хребта на высоте 2650 м — самый трудный и самый памятный поход Самегрело.
  body: >-
    **Тобаварчхили — главный высокогорный маршрут Самегрело** и единственный, который требует серьёзной
    подготовки. Название означает по-мегрельски «серебряное озеро» и точно описывает то, что вы увидите:
    холодная металлического цвета вода в каменной чаше на высоте около 2650 метров, в сердце Эгрисского
    хребта.


    Озеро не одно. По пути встречается несколько ледниковых каров, среди них Тобаскури — тёмный водоём,
    постоянно стоящий в тени, — и большое собственно Тобаварчхили. Они лежат в котлах, выпаханных льдом,
    в окружении альпийских лугов, рододендрона и голой скалы.


    Дороги сюда нет, и это принципиально. Тобаварчхили — не однодневная прогулка. Стандартный маршрут
    занимает от трёх до пяти дней и начинается в селе Мухури Чхороцкуского муниципалитета; второй подход
    идёт со стороны Лебарде. Оба пересекают высокие перевалы.


    Снег держится долго. В июне озёра нередко ещё частично подо льдом, а на перевалах лежит старый фирн.
    Реальное окно — с середины июля до середины сентября.


    Приютов нет. Пастушьи балаганы кое-где стоят, но полагаться на них нельзя: палатка, горелка и еда
    — с собой. Воды много, хотя на отдельных участках в конце сезона это только снеговая талая вода.


    Главный риск здесь — погода. Эгрисский хребет берёт влагу прямо с Чёрного моря, и облако садится за
    считаные минуты. Ориентиров на плато мало, тропа местами исчезает — поэтому проводник тут не роскошь,
    а мера безопасности. В Мухури можно договориться и о лошадях.


    Эгрисский хребет невысок рядом с Главным Кавказом, и именно поэтому он так зелен: верхняя граница
    леса стоит высоко, а луга и рододендрон доходят до самых перевалов. В июле цветение здесь такое, какого
    мало где в Грузии. Оборотная сторона — постоянная сырость: внутри палатки каждое утро мокро, а вещи
    сохнут плохо.


    Дикая природа настоящая: здесь живут бурый медведь, кавказский тур и орлы, и еду на ночь стоит подвешивать
    или убирать подальше от палатки.


    Взамен вы получаете простую и всё более редкую вещь: три дня в пейзаже, где не видно ни дороги, ни
    опоры ЛЭП, ни дома.


    Указанные ниже расстояние и время — до начала тропы в Мухури, а не до озёр. Всё дальше — пешком или
    верхом.
  tip: >-
    Это не однодневная поездка: планируйте три-пять дней с палаткой и своей едой. Проводник настоятельно
    рекомендуется: в облаке тропа теряется, а на плато ориентироваться практически не по чему. Лошадей
    и проводника можно найти в Мухури. Тёплая одежда обязательна даже в июле — ночью бывает около нуля.
    Связи почти нет, поэтому оставьте кому-нибудь маршрут и дату возвращения. Воды сколько угодно, еда
    — только та, что несёте.
  route: >-
    До начала тропы: из Тбилиси по E60 до Сенаки, затем на Чхороцку и оттуда на север до села Мухури —
    около 345 км и шесть-шесть с половиной часов. До Чхороцку асфальт; дальше дорога сужается, мосты однополосные,
    а выше Мухури лесные колеи проходимы только на полном приводе. Машину оставьте в селе: проводники
    обычно договариваются о дворе для стоянки. Заправляйтесь в Сенаки или Чхороцку — выше нет ничего.
fa:
  name: دریاچه‌های توباوارچخیلی
  short: دریاچه‌های نقره‌ای رشته‌کوه اگریسی در ۲۶۵۰ متری — دشوارترین و ماندگارترین پیاده‌روی سامگرلو.
  body: >-
    **توباوارچخیلی مسیر بلندکوهستانی بزرگ سامگرلو است** و تنها مسیری که آمادگی جدی می‌طلبد. نام آن به
    مینگرلی یعنی دریاچهٔ نقره، و دقیقاً همان است که می‌بینید: آبی سرد و فلزی‌رنگ در کاسه‌ای سنگی در ارتفاع
    نزدیک ۲۶۵۰ متر، در دل رشته‌کوه اگریسی.


    دریاچه یکی نیست. در مسیر چند دریاچهٔ یخچالی هست، از جمله توباسکوری، برکه‌ای تیره که همیشه در سایه
    است، و توباوارچخیلی بزرگ. همه در گودال‌هایی نشسته‌اند که یخ تراشیده، و پیرامونشان چمنزار آلپی و رودودندرون
    و سنگ برهنه است.


    هیچ جاده‌ای به آنها نمی‌رسد و این نکته‌ای اساسی است. توباوارچخیلی گردشی یک‌روزه نیست. مسیر متعارف
    سه تا پنج روز می‌برد و از روستای موخوری در شهرستان چخوروتسکو آغاز می‌شود؛ راه دوم از سمت لبارده می‌آید.
    هر دو از گردنه‌های بلند می‌گذرند.


    برف دیر می‌ماند. در خرداد دریاچه‌ها اغلب هنوز نیمه‌یخ‌زده‌اند و گردنه‌ها برف کهنه دارند. پنجرهٔ واقعی
    از نیمهٔ تیر تا نیمهٔ شهریور است.


    پناهگاهی وجود ندارد. کلبه‌های چوپانی جاهایی هست اما نمی‌توان بر آنها تکیه کرد: چادر و اجاق و خوراک
    را خودتان می‌برید. آب فراوان است، هرچند در برخی بخش‌ها اواخر فصل فقط آب ذوب برف است.


    خطر اصلی اینجا هواست. رشته‌کوه اگریسی رطوبت را مستقیم از دریای سیاه می‌گیرد و ابر در چند دقیقه پایین
    می‌آید. روی فلات نشانه‌های کمی هست و مسیر جاهایی ناپدید می‌شود؛ به همین سبب راهنما اینجا تجمل نیست
    بلکه اقدامی ایمنی است. در موخوری اسب هم می‌توان کرایه کرد.


    رشته‌کوه اگریسی در کنار قفقاز بزرگ کوتاه است و درست به همین سبب چنین سبز است: مرز بالایی جنگل بلند
    است و چمنزار و رودودندرون تا خود گردنه‌ها بالا می‌روند. در تیر گل‌دهی اینجا به اندازهٔ هر جای دیگر
    گرجستان غنی است. روی دیگر سکه رطوبت همیشگی است؛ درون چادر هر صبح خیس است و لباس دیر خشک می‌شود.


    حیات وحش واقعی است: خرس قهوه‌ای در این سرزمین زندگی می‌کند، همچنین بز کوهی قفقازی و عقاب، و شب باید
    خوراک را آویخت یا دور از چادر گذاشت.


    آنچه در برابر همهٔ اینها می‌گیرید ساده و روزبه‌روز کمیاب‌تر است: سه روز در چشم‌اندازی که در آن نه
    جاده‌ای پیداست، نه دکل برقی و نه خانه‌ای.


    مسافت و زمانی که در زیر آمده تا سرِ مسیر در موخوری است، نه تا دریاچه‌ها؛ از آنجا به بعد همه چیز پیاده
    یا با اسب است.
  tip: >-
    این دیدار یک‌روزه نیست: سه تا پنج روز با چادر و خوراک خودتان برنامه بریزید. راهنما به‌شدت توصیه می‌شود،
    چون مسیر در ابر گم می‌شود و فلات نشانه‌ای برای جهت‌یابی ندارد. اسب و راهنما را می‌توان در موخوری هماهنگ
    کرد. لباس گرم حتی در تیر ضروری است، چون شب‌ها تا نزدیک صفر می‌رسد. آنتن تقریباً هیچ‌جا نیست، پس مسیر
    و تاریخ بازگشتتان را به کسی بسپارید. آب همه‌جا هست و خوراک تنها همان است که می‌برید.
  route: >-
    تا سرِ مسیر: از تفلیس با E60 تا سناکی، سپس به سوی چخوروتسکو و از آنجا به شمال تا روستای موخوری — حدود
    ۳۴۵ کیلومتر و شش تا شش‌ونیم ساعت. تا چخوروتسکو آسفالت است؛ پس از آن جاده باریک می‌شود، پل‌ها تک‌بانده‌اند
    و بالاتر از موخوری راه‌های جنگلی تنها با چهارچرخ‌محرک رفتنی است. خودرو را در روستا بگذارید؛ راهنمایان
    معمولاً حیاطی برای پارک ترتیب می‌دهند. سوخت را در سناکی یا چخوروتسکو بگیرید، چون بالاتر چیزی نیست.
he:
  name: אגמי טובאוורצ׳חילי
  short: אגמי הכסף של רכס אגריסי בגובה 2,650 מ׳ — המסלול הקשה והבלתי נשכח ביותר בסמגרלו.
  body: >-
    **טובאוורצ׳חילי הוא המסלול הגבוה הגדול של סמגרלו,** והיחיד שדורש הכנה רצינית. השם פירושו במינגרלית
    אגם הכסף, והוא מתאר בדיוק את מה שתמצאו: מים קרים בגוון מתכתי בקערת סלע בגובה כ-2,650 מטרים, בלב רכס
    אגריסי.


    יש כאן יותר מאגם אחד. המסלול עובר כמה אגמי קרחון, ובהם טובאסקורי, בריכה כהה היושבת תמיד בצל, ואגם
    טובאוורצ׳חילי הגדול עצמו. הם שוכנים בקרים שחפר הקרח, מוקפים אחו אלפיני, רודודנדרון וסלע חשוף.


    שום כביש אינו מגיע אליהם, וזה עיקרון חשוב. טובאוורצ׳חילי אינו טיול יומי. המסלול המקובל אורך שלושה
    עד חמישה ימים ומתחיל בכפר מוחורי שבמחוז צ׳חורוצקו; גישה שנייה מגיעה מצד לברדה. שתיהן חוצות מעברים
    גבוהים.


    השלג נשאר מאוחר. ביוני האגמים עדיין קפואים למחצה לא פעם, ובמעברים מונח פירן ישן. החלון הריאלי הוא
    מאמצע יולי עד אמצע ספטמבר.


    אין בקתות. יש מקומות שבהם עומדים מחסות רועים, אך אי אפשר לסמוך עליהם: אוהל, כירה ומזון נישאים על הגב.
    מים יש בשפע, אף שבקטעים מסוימים בסוף העונה מדובר רק במי הפשרה.


    הסיכון העיקרי כאן הוא מזג האוויר. רכס אגריסי לוקח את לחותו היישר מן הים השחור, והענן יכול לרדת בתוך
    דקות. ברמה יש מעט נקודות ציון והשביל נעלם בקטעים, ולכן מדריך אינו מותרות אלא אמצעי בטיחות. במוחורי
    אפשר גם לשכור סוסים.


    רכס אגריסי נמוך לעומת הקווקז הראשי, ובדיוק משום כך הוא כה ירוק: קו העצים גבוה, והאחו והרודודנדרון
    מטפסים עד המעברים עצמם. ביולי הפריחה כאן עשירה כמעט כמו בכל מקום בגאורגיה. הצד השני של זה הוא לחות
    מתמדת: פנים האוהל רטוב בכל בוקר והבגדים מתייבשים לאט.


    חיות הבר אמיתיות: דוב חום חי בארץ הזאת, וכן תאו קווקזי ועיטים, ואת המזון כדאי לתלות או להרחיק מן האוהל
    בלילה.


    מה שמקבלים בתמורה פשוט והולך ונעשה נדיר: שלושה ימים בנוף שאין בו כביש, אין בו עמוד חשמל ואין בו בית.


    המרחק והזמן המצוינים למטה הם עד תחילת המסלול במוחורי ולא עד האגמים. משם והלאה הכול ברגל או על סוס.
  tip: >-
    זה אינו ביקור של יום: תכננו שלושה עד חמישה ימים עם אוהל ומזון משלכם. מדריך מומלץ מאוד, כי השביל נעלם
    בענן וברמה כמעט אין לפי מה לנווט. סוסים ומדריכים אפשר לארגן במוחורי. ביגוד חם הכרחי גם ביולי, כשהלילות
    יורדים לאפס. כמעט אין קליטה, לכן השאירו אצל מישהו את המסלול ואת מועד החזרה. מים יש בכל מקום, ומזון
    יש רק כזה שנשאתם.
  route: >-
    עד תחילת המסלול: מטביליסי בכביש E60 עד סנאקי, משם לצ׳חורוצקו ומשם צפונה לכפר מוחורי — כ-345 ק״מ ושש
    עד שש וחצי שעות. עד צ׳חורוצקו אספלט; אחר כך הדרך מצטמצמת, הגשרים חד-נתיביים, ומעל מוחורי דרכי היער
    עבירות רק בהנעה כפולה. השאירו את הרכב בכפר; המדריכים בדרך כלל מסדרים חצר לחניה. תדלקו בסנאקי או בצ׳חורוצקו,
    כי מעל מוחורי אין תחנה ואין חנות. גם במזג אוויר יבש הקילומטרים האחרונים דורשים רכב שטח, ואחרי גשם
    גם ההגעה עד הכפר נעשית איטית.
ar:
  name: بحيرات توبافارتشخيلي
  short: بحيرات الفضة في سلسلة إيغريسي على ارتفاع 2650 م — أصعب مسارات سامغريلو وأبقاها في الذاكرة.
  body: >-
    **توبافارتشخيلي هو المسار الجبلي الكبير في سامغريلو،** والوحيد الذي يتطلب إعداداً جاداً. الاسم يعني
    بالمينغريلية بحيرة الفضة، وهو يصف تماماً ما ستجده: ماء بارد معدني اللون في حوض صخري على ارتفاع نحو
    2650 متراً، في قلب سلسلة إيغريسي.


    والبحيرة ليست واحدة. يمر المسار ببضع بحيرات جليدية، منها توباسكوري، وهي بركة داكنة تقيم في الظل دائماً،
    ومنها توبافارتشخيلي الكبرى نفسها. تقع في أحواض حفرها الجليد، وتحيط بها مروج ألبية وشجيرات الرودودندرون
    وصخر عارٍ.


    لا طريق يصل إليها، وهذا أمر جوهري. توبافارتشخيلي ليست نزهة يوم واحد. المسار المعتاد يستغرق ثلاثة إلى
    خمسة أيام ويبدأ من قرية موخوري في بلدية تشخوروتسكو؛ ويأتي طريق آخر من جهة ليباردي. وكلاهما يعبر ممرات
    عالية.


    الثلج يبقى متأخراً. ففي حزيران كثيراً ما تكون البحيرات متجمدة جزئياً وتحمل الممرات فرناً قديماً. والنافذة
    الواقعية من منتصف تموز إلى منتصف أيلول.


    لا أكواخ هنا. تقوم في مواضع مآوي رعاة لكن لا يُعتمد عليها: تحمل خيمتك وموقدك وطعامك. الماء وفير، وإن
    كان في بعض المقاطع أواخر الموسم ماء ذوبان ثلج فقط.


    الخطر الأكبر هنا هو الطقس. فسلسلة إيغريسي تأخذ رطوبتها من البحر الأسود مباشرة، والغيم قد ينزل في دقائق.
    وعلى الهضبة معالم قليلة والدرب يختفي في مقاطع، ولذلك فالمرشد هنا ليس ترفاً بل إجراء سلامة. ويمكن أيضاً
    استئجار خيول في موخوري.


    سلسلة إيغريسي منخفضة قياساً بالقوقاز الكبرى، ولهذا بالذات هي شديدة الخضرة: فحد الأشجار مرتفع، والمروج
    والرودودندرون تصعد حتى الممرات نفسها. وفي تموز يكون الإزهار هنا من أغنى ما في جورجيا. والوجه الآخر
    لذلك رطوبة دائمة: داخل الخيمة مبلل كل صباح والثياب تجف ببطء.


    والحياة البرية حقيقية: يعيش الدب البني في هذه الأرض، ومعه الوعل القوقازي والنسور، وينبغي تعليق الطعام
    أو إبعاده عن الخيمة ليلاً.


    وما تناله في المقابل بسيط ونادر أكثر فأكثر: ثلاثة أيام في مشهد لا يظهر فيه طريق ولا عمود كهرباء ولا
    بيت.


    والمسافة والزمن المذكوران أدناه هما إلى بداية المسار في موخوري لا إلى البحيرات؛ وما بعد ذلك كله مشياً
    أو على ظهر خيل.
  tip: >-
    هذه ليست زيارة يوم: خطط لثلاثة إلى خمسة أيام بخيمة وطعام من عندك. المرشد موصى به بشدة، لأن الدرب يختفي
    في الغيم ولا تكاد الهضبة تقدم ما يُهتدى به. الخيول والمرشدون يُرتَّبون في موخوري. الثياب الدافئة ضرورية
    حتى في تموز، إذ تهبط الليالي إلى الصفر. ولا تكاد توجد تغطية هاتفية، فاترك مسارك وموعد عودتك مع أحد.
    الماء في كل مكان، والطعام هو ما تحمله فقط.
  route: >-
    إلى بداية المسار: من تبليسي على الطريق E60 حتى سيناكي، ثم نحو تشخوروتسكو ومنها شمالاً إلى قرية موخوري
    — نحو 345 كم وست إلى ست ساعات ونصف. الإسفلت يمتد حتى تشخوروتسكو؛ وبعده يضيق الطريق وتصير الجسور بمسرب
    واحد، وفوق موخوري لا تصلح دروب الغابة إلا للدفع الرباعي. اترك السيارة في القرية، فالمرشدون عادةً يرتبون
    فناءً للوقوف. تزوّد بالوقود في سيناكي أو تشخوروتسكو، فلا شيء في الأعلى.
