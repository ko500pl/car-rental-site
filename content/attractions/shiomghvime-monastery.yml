ka:
  name: შიომღვიმის მონასტერი
  short: VI საუკუნის მონასტერი მშრალ კირქვის ხეობაში, სადაც ასურელი მამა შიო გამოქვაბულში ცხოვრობდა და
    იქვე დაიმარხა.
  body: >-
    **შიომღვიმე მშრალ კირქვის კანიონშია და სულ არ ჰგავს იმ მწვანე ველს, საიდანაც ახლახან ამოხვედი.** მცხეთიდან
    ცხრა კილომეტრი ვიწრო გზა თითქმის უტყეო, ღია ფერის ხეობაში შეგიყვანს; მონასტერი ქვემოთ, კლდის თაროზე
    ჩნდება, ზემოთ კი კლდე გამოქვაბულებითაა დაფლეთილი.


    დამაარსებელი შიო იყო, ცამეტი ასურელი მამიდან ერთ-ერთი, რომლებიც VI საუკუნეში ქართლში ახალგაზრდა ეკლესიის
    გასამაგრებლად მოვიდნენ. მან ყველაზე მკაცრი გზა აირჩია: ღრმა გამოქვაბულში ცხოვრობდა, გადმოცემით მტრედი
    კვებავდა, ბოლოს კი ორმოში ჩაიკეტა და იქვე აღესრულა დაახლოებით 560 წელს. მისი საფლავი მთავარი ეკლესიის
    ქვეშ, ბნელ პატარა კამარაშია, კიბით ჩასასვლელი; იქ თითქმის ყოველთვის სანთელი ანთია.


    ნათლისმცემლის ეკლესია, აშენებული დაახლოებით 560-580 წლებში, უძველესი შემორჩენილი ნაგებობაა და საქართველოს
    ერთ-ერთი ადრეული გუმბათოვანი ტაძარი — დაბალი, ჯვრული, მკაცრი, ნაწილობრივ კლდეში ჩაჭრილი. მის ზემოთ
    მდგარი უფრო დიდი ღვთისმშობლის ეკლესია XII საუკუნეში დავით აღმაშენებლის დროს გუმბათიანად აშენდა, არაერთხელ
    დაინგრა და XVII საუკუნეში უბრალო კამაროვან დარბაზად აღადგინეს, ამიტომ გარედან ბევრად უფრო ძველი ჩანს,
    ვიდრე შიგნიდან.


    მონასტერი 1614 წელს შაჰ-აბასის ჯარმა და 1720-იან წლებში სპარსელმა მოთარეშეებმა გაანადგურეს, XIX საუკუნეში
    კი აღადგინეს. ეკლესიების გარდა შემორჩა:


    - XII საუკუნის ქვის წყალსადენი, რამდენიმე კილომეტრის სიგრძის, აშენებული ჭყონდიდელი ეპისკოპოსის ანტონის
    ბრძანებით


    - სატრაპეზოს ნანგრევები და ბერების სენაკები


    - ათეულობით მეუდაბნოეს გამოქვაბული კლედეზე; ზოგამდე უხეში ბილიკი მიდის, უმეტესობამდე — არა


    მოდი გვიან შუადღეს. კლდე ნარინჯისფრდება, კანიონი ჩრდილით ივსება და ადგილი წყვეტს პარკინგად გამოყურებას,
    რომლის ბოლოშიც ეკლესია დგას.
  tip: >-
    საათნახევარი საკმარისია, შიოს საფლავამდე ჩასვლისა და ამოსვლის ჩათვლით. საფლავისკენ მიმავალი კიბე ციცაბოა,
    გაცვეთილი და ცუდად განათებული — ტელეფონის ფანარი გამოგადგება. ეს მოქმედი მამათა მონასტერია: მამაკაცებს
    გრძელი შარვალი, ქალებს კაბა ან შემოსახვევი და თავსაფარი; ყველაფერი კარიბჭესთანაა. პარკინგთან ტუალეტია
    და ჩვეულებრივ სანთლისა და თაფლის ჯიხურიც, კაფე კი არა — უახლოესი საჭმელი მცხეთაშია. თოვლში ან ძლიერი
    წვიმის შემდეგ დაბალი მანქანით ბოლო კილომეტრებს ნუ სცდები.
  route: >-
    თბილისიდან E60-ით მცხეთამდე მიდიხარ, დაახლოებით 20 კმ, შემდეგ ქალაქიდან დასავლეთით, სასაფლაოს გვერდით
    გამავალ პატარა გზას აუყვები, რომელიც ხეობაში ადის. კიდევ 12 კმ-ია, სულ 35 კმ და 50 წუთი. საფარი ასფალტია,
    მაგრამ ძველი, ვიწრო და ჩანაკერებიანი, ადგილ-ადგილ მოაჯირის გარეშე და ავტობუსთან გასაშვები ადგილი თითქმის
    არსად არის. მშრალ ამინდში ეკონომ-კლასის მანქანა საკმარისია; ძლიერი წვიმის ან თოვლის შემდეგ ჯობია ჯიპი.
    საწვავი და მაღაზია მცხეთაშია — შემდეგ არაფერია.
en:
  name: Shio-Mgvime Monastery
  short: >-
    A 6th-century monastery in a dry limestone canyon, built around the cave where the Assyrian father
    Shio lived and died.
  body: >-
    **Shio-Mgvime sits in a dry limestone canyon that looks nothing like the green valley you drove out
    of.** Nine kilometres of narrow road from Mtskheta bring you into a pale, almost treeless gorge; the
    monastery appears below you, low buildings on a shelf of rock, with caves pocking the cliff above.


    The founder was Shio, one of the Thirteen Assyrian Fathers who came to Kartli in the 6th century to
    strengthen a young church. He chose the hardest option available: he lived in a deep cave, was said
    to be fed by a dove, and finally had himself sealed into a pit, where he died around 560. His tomb
    is in a small dark chamber below the main church, reached by a flight of stairs, and a candle is nearly
    always burning there.


    The Church of St John the Baptist, built between about 560 and 580, is the oldest surviving structure
    and one of the earliest domed churches in Georgia — squat, cruciform, austere, cut partly into the
    rock. The larger Church of the Virgin above it was a domed 12th-century foundation of David the Builder,
    ruined more than once and rebuilt in the 17th century as a plain barrel-vaulted hall, so the outside
    looks far older than the interior.


    Shah Abbas's troops sacked the site in 1614, Persian raiders again in the 1720s, and it was revived
    in the 19th century. Besides the churches there survive:


    - a 12th-century stone water conduit several kilometres long, built on the orders of Bishop Anton
    of Chkondidi to bring spring water down to the monastery


    - the ruins of the refectory and the monks' cells


    - dozens of hermits' caves in the cliffs, a few reachable by a rough path, most not


    Come in late afternoon. The rock turns orange, the canyon fills with shadow, and the place stops looking
    like a car park with a church at the end of it.
  tip: >-
    An hour and a half covers it, including the walk down to Shio's tomb and back. The stairs to the tomb
    are steep, worn and badly lit, so a phone torch helps. This is an active male monastery: long trousers
    for men, a skirt or wrap and a headscarf for women, all supplied at the gate. There is a toilet by
    the car park and usually a stall selling candles and honey, but no café — the nearest food is back
    in Mtskheta. Do not attempt the final kilometres in snow or after heavy rain in a low car.
  route: >-
    From Tbilisi run up to Mtskheta on the E60, about 20 km, then take the small road that leaves the
    town westwards past the cemetery and climbs into the gorge. That is another 12 km, 35 km and roughly
    50 minutes in all. The surface is asphalt but old, narrow and patched, with unfenced drops in places
    and almost nowhere to pass a bus. An economy car is enough in dry conditions; after heavy rain or
    snow the last stretch is better left to an SUV. Fuel and shops are in Mtskheta — there is nothing
    beyond it.
ru:
  name: Монастырь Шиомгвиме
  short: Монастырь VI века в сухом известняковом каньоне, выросший вокруг пещеры, где жил и умер ассирийский
    отец Шио.
  body: >-
    **Шиомгвиме стоит в сухом известняковом каньоне, совсем не похожем на зелёную долину, из которой вы
    только что выехали.** Девять километров узкой дороги от Мцхеты выводят в светлое, почти безлесное
    ущелье; монастырь открывается внизу — низкие постройки на скальной полке, а над ними обрыв, изъеденный
    пещерами.


    Основателем был Шио, один из Тринадцати ассирийских отцов, пришедших в Картли в VI веке укреплять
    молодую церковь. Он выбрал самый суровый путь: жил в глубокой пещере, по преданию его кормил голубь,
    а под конец велел замуровать себя в яме, где и умер около 560 года. Его гробница — в маленькой тёмной
    камере под главным храмом, куда ведёт лестница; там почти всегда горит свеча.


    Церковь Иоанна Крестителя, построенная примерно между 560 и 580 годами, — древнейшее сохранившееся
    здание и один из самых ранних купольных храмов Грузии: приземистый, крестообразный, суровый, частично
    врезанный в скалу. Стоящая выше более крупная церковь Богородицы была купольной постройкой XII века
    времён Давида Строителя, не раз разрушалась и в XVII веке восстановлена простым сводчатым залом, так
    что снаружи она выглядит куда древнее, чем внутри.


    Войска шаха Аббаса разорили монастырь в 1614 году, персидские отряды — снова в 1720-х, а возрождён
    он был в XIX веке. Кроме храмов уцелели:


    - каменный водовод XII века длиной в несколько километров, построенный по приказу чкондидского епископа
    Антония, чтобы вести родниковую воду в монастырь


    - руины трапезной и монашеские кельи


    - десятки пещер отшельников в обрывах: к некоторым ведёт грубая тропа, к большинству — нет


    Приезжайте ближе к вечеру. Скала становится оранжевой, каньон заполняется тенью, и место перестаёт
    выглядеть парковкой с церковью в конце.
  tip: >-
    Полутора часов хватает, включая спуск к гробнице Шио и обратно. Лестница вниз крутая, стёртая и плохо
    освещённая — фонарик в телефоне пригодится. Монастырь мужской и действующий: мужчинам длинные брюки,
    женщинам юбка или платок на пояс и косынка; всё выдают у ворот. У парковки есть туалет и обычно киоск
    со свечами и мёдом, но кафе нет — ближайшая еда в Мцхете. В снег и после сильного дождя не суйтесь
    на последние километры на низкой машине.
  route: >-
    Из Тбилиси по трассе E60 до Мцхеты, около 20 км, затем свернуть на маленькую дорогу, уходящую из города
    на запад мимо кладбища и поднимающуюся в ущелье. Это ещё 12 км, всего 35 км и примерно 50 минут. Покрытие
    асфальтовое, но старое, узкое и латаное, местами без отбойников и почти нигде не разъехаться с автобусом.
    В сухую погоду достаточно машины эконом-класса; после сильного дождя или снега последний отрезок лучше
    оставить внедорожнику. Заправка и магазины — в Мцхете, дальше нет ничего.
fa:
  name: صومعهٔ شیومغویمه
  short: صومعه‌ای از سدهٔ ششم در دره‌ای خشک و آهکی، ساخته گرد غاری که شیوی آسوری در آن زیست و درگذشت.
  body: >-
    **شیومغویمه در دره‌ای خشک و آهکی نشسته که هیچ شباهتی به دشت سبز پشت سر شما ندارد.** نه کیلومتر جادهٔ
    باریک از متسختا شما را به دره‌ای روشن و تقریباً بی‌درخت می‌برد؛ صومعه پایین‌تر پدیدار می‌شود، بناهایی
    کوتاه بر لبه‌ای سنگی، و بالای آن صخره‌ای که غارها آن را سوراخ‌سوراخ کرده‌اند.


    بنیان‌گذار شیو بود، یکی از سیزده پدر آسوری که در سدهٔ ششم برای استوار کردن کلیسایی نوپا به کارتلی
    آمدند. او سخت‌ترین راه ممکن را برگزید: در غاری ژرف زیست، می‌گویند کبوتری او را خوراک می‌داد، و سرانجام
    خود را در چاهی محبوس کرد و همان‌جا حدود سال 560 درگذشت. گور او در اتاقکی تاریک زیر کلیسای اصلی است
    که با پلکانی به آن می‌رسند و تقریباً همیشه شمعی در آن روشن است.


    کلیسای یحیای تعمیددهنده، ساخته‌شده میان سال‌های 560 و 580، کهن‌ترین بنای برجای‌مانده و از نخستین کلیساهای
    گنبددار گرجستان است: کوتاه، چلیپایی، بی‌پیرایه و بخشی از آن بریده در دل صخره. کلیسای بزرگ‌تر مریم
    مقدس در بالای آن، بنایی گنبددار از سدهٔ دوازدهم و از روزگار داویت سازنده بود که بارها ویران شد و در
    سدهٔ هفدهم به تالاری ساده با سقف طاقی بازساخته شد؛ از این رو بیرونش بسیار کهن‌تر از درونش می‌نماید.


    سپاه شاه عباس در 1614 و مهاجمان ایرانی بار دیگر در دههٔ 1720 اینجا را غارت کردند و در سدهٔ نوزدهم
    دوباره آباد شد. جز کلیساها اینها برجای مانده است:


    - آبراهی سنگی از سدهٔ دوازدهم به درازای چند کیلومتر، ساخته به فرمان آنتون، اسقف چکوندیدی، برای رساندن
    آب چشمه به صومعه


    - ویرانه‌های تالار غذاخوری و حجره‌های راهبان


    - ده‌ها غار زاهدان در صخره‌ها؛ به چند تای آنها راهی ناهموار می‌رسد و به بیشترشان هیچ راهی نیست


    پسین دیروقت بیایید. سنگ نارنجی می‌شود، دره از سایه پر می‌شود و جا دیگر شبیه پارکینگی با کلیسایی در
    انتها نیست.
  tip: >-
    یک ساعت و نیم، از جمله پایین رفتن تا گور شیو و بازگشت، کافی است. پلکان گور تند و ساییده و کم‌نور است،
    پس چراغ گوشی به کار می‌آید. اینجا صومعه‌ای فعال و مردانه است: مردان شلوار بلند و زنان دامن یا شال
    و روسری لازم دارند و همه کنار دروازه فراهم است. کنار پارکینگ سرویس بهداشتی هست و معمولاً دکه‌ای برای
    شمع و عسل، اما کافه‌ای نیست؛ نزدیک‌ترین غذا در متسختاست. در برف یا پس از باران سنگین با خودروی کم‌ارتفاع
    به کیلومترهای پایانی نزنید.
  route: >-
    از تفلیس با بزرگراه E60 تا متسختا بروید، حدود 20 کیلومتر، سپس جادهٔ کوچکی را بگیرید که از غرب شهر
    و از کنار گورستان بیرون می‌رود و به دره بالا می‌رود. این 12 کیلومتر دیگر است؛ رویهم 35 کیلومتر و نزدیک
    50 دقیقه. روکش آسفالت است اما کهنه و باریک و وصله‌خورده، جاهایی بدون حفاظ و تقریباً بی هیچ جای مناسب
    برای گذشتن از کنار اتوبوس. در هوای خشک خودروی اقتصادی بس است؛ پس از باران سنگین یا برف بهتر است بخش
    پایانی را به خودروی شاسی‌بلند بسپارید. سوخت و مغازه در متسختاست و پس از آن هیچ چیز نیست.
he:
  name: מנזר שיאומגוימה
  short: מנזר מן המאה השישית בקניון גיר יבש, שנבנה סביב המערה שבה חי ומת האב האשורי שיאו.
  body: >-
    **שיאומגוימה יושב בקניון גיר יבש שאינו דומה כלל לעמק הירוק שממנו יצאתם.** תשעה קילומטרים של דרך צרה
    ממצחתה מכניסים אתכם לערוץ בהיר וכמעט חסר עצים; המנזר מתגלה למטה, מבנים נמוכים על מדף סלע, ומעליהם
    צוק מנוקב מערות.


    המייסד היה שיאו, אחד משלושה עשר האבות האשורים שהגיעו לקרתלי במאה השישית כדי לחזק כנסייה צעירה. הוא
    בחר באפשרות הקשה ביותר: חי במערה עמוקה, ולפי המסורת יונה כלכלה אותו, ולבסוף ציווה לאטום אותו בבור,
    ושם מת בערך בשנת 560. קברו נמצא בחדרון אפל מתחת לכנסייה הראשית, שאליו יורדים במדרגות, וכמעט תמיד דולק
    שם נר.


    כנסיית יוחנן המטביל, שנבנתה בין 560 ל-580 לערך, היא המבנה העתיק ביותר ששרד ואחת מכנסיות הכיפה המוקדמות
    בגאורגיה: נמוכה, צלבית, נוקשה ומגולפת בחלקה בתוך הסלע. כנסיית הבתולה הגדולה יותר שמעליה הייתה מבנה
    כיפה מן המאה ה-12 מימי דויד הבנאי, נהרסה יותר מפעם אחת ונבנתה מחדש במאה ה-17 כאולם קמרוני פשוט, ולכן
    מבחוץ היא נראית עתיקה בהרבה מאשר מבפנים.


    צבאו של שאה עבאס בזז את המקום ב-1614, פושטים פרסיים שוב בשנות ה-20 של המאה ה-18, והוא שוקם במאה ה-19.
    מלבד הכנסיות שרדו כאן:


    - אמת מים מאבן מן המאה ה-12, באורך כמה קילומטרים, שנבנתה בפקודת אנטון הבישוף מצ׳קונדידי כדי להוליך
    מי מעיין אל המנזר


    - חורבות חדר האוכל ותאי הנזירים


    - עשרות מערות מתבודדים בצוקים; אל אחדות מהן מוליך שביל גס, ואל רובן לא מוליך דבר


    בואו לפנות ערב. הסלע נצבע בכתום, הקניון מתמלא צל, והמקום חדל להיראות כמו חניון עם כנסייה בקצה.
  tip: >-
    שעה וחצי מספיקה, כולל הירידה לקבר שיאו והחזרה. המדרגות אל הקבר תלולות, שחוקות ומוארות גרוע, ופנס הטלפון
    עוזר. זהו מנזר גברים פעיל: גברים במכנסיים ארוכים, נשים בחצאית או בכיסוי ובמטפחת ראש, והכול מסופק בשער.
    ליד החניון יש שירותים ובדרך כלל דוכן נרות ודבש, אך אין בית קפה — האוכל הקרוב ביותר הוא במצחתה. אל
    תנסו את הקילומטרים האחרונים בשלג או אחרי גשם כבד ברכב נמוך.
  route: >-
    מטביליסי עולים למצחתה בכביש E60, כ-20 ק״מ, ומשם פונים לדרך הקטנה היוצאת מן העיר מערבה על פני בית הקברות
    ומטפסת אל הערוץ. עוד 12 ק״מ, בסך הכול 35 ק״מ וכ-50 דקות. המשטח אספלט אך ישן, צר ומטולא, במקומות ללא
    מעקה וכמעט בלי מקום לחלוף על פני אוטובוס. במזג אוויר יבש רכב חסכוני מספיק; אחרי גשם כבד או שלג עדיף
    להשאיר את הקטע האחרון לרכב שטח. דלק וחנויות יש במצחתה, ומעבר לה אין דבר.
ar:
  name: دير شيومغفيمي
  short: دير من القرن السادس في وادٍ كلسي جاف، نشأ حول الكهف الذي عاش فيه الأب الآشوري شيو ومات.
  body: >-
    **يقع دير شيومغفيمي في وادٍ كلسي جاف لا يشبه في شيء السهل الأخضر الذي خرجت منه.** تسعة كيلومترات من
    طريق ضيق تفصل متسخيتا عن ممر فاتح اللون يكاد يخلو من الشجر؛ ويظهر الدير في الأسفل، مبانٍ منخفضة على
    حافة صخرية، وفوقها جرف تنخره الكهوف.


    المؤسس هو شيو، أحد الآباء الآشوريين الثلاثة عشر الذين قدموا إلى كارتلي في القرن السادس لتثبيت كنيسة
    فتية. اختار أقسى الطرق: عاش في كهف عميق، ويُروى أن حمامة كانت تطعمه، ثم أمر أخيراً بأن يُسدّ عليه
    في حفرة، فمات فيها نحو عام 560. وقبره في حجرة صغيرة مظلمة تحت الكنيسة الرئيسية، ينزل إليها بدرج، وتكاد
    شمعة لا تنطفئ فيها.


    أما كنيسة يوحنا المعمدان، المبنية بين نحو 560 و580، فهي أقدم بناء باق وواحدة من أولى الكنائس المقببة
    في جورجيا: منخفضة، صليبية، صارمة، ومنحوت جزء منها في الصخر. وكنيسة العذراء الأكبر فوقها كانت بناءً
    مقبباً من القرن الثاني عشر في عهد داويت الباني، وقد خربت أكثر من مرة وأعيد بناؤها في القرن السابع
    عشر قاعةً بسيطة معقودة، فبدت من الخارج أقدم بكثير مما هي عليه من الداخل.


    نهبت جيوش الشاه عباس الموقع عام 1614، ثم أغار عليه الفرس مرة أخرى في عشرينيات القرن الثامن عشر، وأُحيي
    في القرن التاسع عشر. وإلى جانب الكنيستين بقي هنا:


    - قناة ماء حجرية من القرن الثاني عشر بطول عدة كيلومترات، شُيدت بأمر أنطون أسقف تشكونديدي لجرّ ماء
    النبع إلى الدير


    - أطلال قاعة الطعام وقلالي الرهبان


    - عشرات كهوف النساك في الجروف، يصل إلى بعضها درب وعر ولا يصل إلى أكثرها شيء


    تعال في آخر النهار. يميل الصخر إلى البرتقالي، ويمتلئ الوادي بالظل، ويكف المكان عن أن يبدو موقف سيارات
    تنتهي عنده كنيسة.
  tip: >-
    ساعة ونصف تكفي، بما فيها النزول إلى قبر شيو والعودة. ودرج القبر شديد الانحدار ومهترئ وضعيف الإضاءة،
    فمصباح الهاتف يفيد. المكان دير رجال عامل: بنطال طويل للرجال، وتنورة أو غطاء وغطاء رأس للنساء، وكل
    ذلك متوفر عند البوابة. عند الموقف دورة مياه وغالباً كشك للشموع والعسل، لكن لا مقهى؛ وأقرب طعام في
    متسخيتا. ولا تخض الكيلومترات الأخيرة في الثلج أو بعد مطر غزير بسيارة منخفضة.
  route: >-
    من تبليسي اصعد إلى متسخيتا على الطريق E60، نحو 20 كم، ثم خذ الطريق الصغير الخارج من البلدة غرباً بمحاذاة
    المقبرة والصاعد إلى الوادي. تلك 12 كم إضافية، أي 35 كم ونحو 50 دقيقة إجمالاً. السطح معبّد لكنه قديم
    وضيق ومرقّع، وفي مواضع بلا حواجز، ويكاد لا يتسع لتجاوز حافلة. في الجو الجاف تكفي سيارة اقتصادية؛ وبعد
    المطر الغزير أو الثلج يُترك القسم الأخير لسيارة دفع رباعي. الوقود والمتاجر في متسخيتا، وبعدها لا شيء.
