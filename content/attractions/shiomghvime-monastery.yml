ka:
  name: შიომღვიმის მონასტერი
  short: >-
    VI საუკუნის მონასტერი მცხეთის დასავლეთით, ღია ფერის კირქვის ხეობაში, იმ მღვიმის გარშემო აღზრდილი,
    სადაც მეუდაბნოე შიომ დაასრულა სიცოცხლე და დაიკრძალა.
  body: >-
    **შიომღვიმისკენ მიმავალი გზა ჯერ მწვანე ტყეში მიიკლაკნება, მერე ხეობის კალთები ვიწროვდება და თეთრდება,
    კლდეებში კი ბერების მღვიმეთა ბნელი კარები ჩნდება.**


    სახელი „შიოს მღვიმეს“ ნიშნავს. ანტიოქიაში დაბადებული შიო იოანე ზედაზნელის მოწაფე და ცამეტ ასურელ მამათაგანი
    იყო, VI საუკუნეში ქართლში რომ მოვიდნენ. ძმებს განშორდა და ამ ხეობაში დაემკვიდრა; წყაროების თანახმად,
    სიცოცხლის ბოლო წლები მარტომ, თორმეტიოდე მეტრის სიღრმის მღვიმეში გაატარა და ანდერძისამებრ იქვე დაკრძალეს.
    მისი საფლავი მონასტრის უწმინდეს ადგილად იქცა; სატრაპეზოდან დღესაც მღვიმეში ჩადიხართ.


    იმავე საუკუნის ბოლოსთვის, როგორც ამბობენ, აქ ორი ათასი ბერი მოღვაწეობდა — იმდროინდელ საქართველოში
    ყველაზე დიდი საძმო. მათი პირველი ეკლესია, იოანე ნათლისმცემლისა, VI საუკუნის მეორე ნახევარს განეკუთვნება:
    დაბალი, მკაცრი ჯვარი, თითქმის სანახევროდ მიწაში ჩაფლული, რვაწახნაგა ყელითა და კონუსური სახურავით.
    მისი ჩუქურთმიანი ქვის კანკელი ახლა თბილისში, ხელოვნების მუზეუმშია. ზემოთ ღვთისმშობლის, ანუ ზემო ეკლესია
    დგას, XI-XII საუკუნეთა მიჯნაზე დავით აღმაშენებლის ბრძანებით აგებული; დავითმა შიომღვიმე სამეფო საკუთრებად
    აქცია და 1123 წელს მას განგება დაუწესა. ოდესღაც გუმბათიანი, 1678 წელს უბრალო ბაზილიკად აღადგინეს.


    1614-1616 წლებში შაჰ-აბასის ლაშქარმა მონასტერი ააოხრა, 1720-იან წლებში იგი დაცარიელდა, 1733 წელს განახლდა,
    1735 წელს კი ყიზილბაშებმა დაარბიეს და ბერები ამოწყვიტეს. XIX საუკუნეში აღორძინდა, ბოლშევიკებმა დახურეს,
    დღეს კი კვლავ მოქმედებს.


    ორიოდე კილომეტრის სიგრძის ქვის წყალსადენი, 1202 წლის საბუთში მოხსენიებული, ოდესღაც სოფელ სხალტბიდან
    აქ წყალს მოაქცევდა.


    დარჩით, სანამ მზე ეზოდან კლდეებზე აინაცვლებს — მაშინ ზემოთ ჩამწკრივებული მღვიმეები ნანგრევებს კი აღარ
    ჰგავს, არამედ ფანჯრებს, რომლებსაც ვიღაც ახლახან მოსცილდა.
  tip: >-
    საათნახევარი გამოყავით, შიოს მღვიმეში ჩასვლის ჩათვლით — კიბე ციცაბო, გაცვეთილი და ბნელია, ტელეფონის
    ფანარი გამოგადგებათ. ეს მოქმედი მამათა მონასტერია: მამაკაცებს გრძელი შარვალი სჭირდებათ, ქალებს — ქვედაბოლო
    და თავსაფარი; მოსასხამები ჩვეულებრივ შესასვლელთან არის. მღვიმესთან ხმადაბლა ილაპარაკეთ და ბერებს ნებართვის
    გარეშე ნუ გადაუღებთ. სანთლის ჯიხურისა და მარტივი ტუალეტის გარდა აქ თითქმის არაფერია — წყალი თან იქონიეთ,
    საჭმელად კი მცხეთაში დაბრუნდით. თოვლში ან ძლიერი წვიმის შემდეგ ხეობის გზაზე ნელა იარეთ, დაბალი მანქანით
    კი ჯობს, საერთოდ არ წახვიდეთ.
  route: >-
    თბილისიდან S1 (E60) ავტომაგისტრალით მცხეთის გასასვლელამდე იარეთ, დაახლოებით 20 კმ, და მტკვარზე გადასვლით
    ქალაქში შედით. ცენტრიდან დავით აღმაშენებლის ქუჩას და მის გაგრძელებას, ივანე ჯავახიშვილის ქუჩას, მდინარის
    მარცხენა ნაპირით დასავლეთისკენ გაჰყევით; ბოლო რამდენიმე კილომეტრზე გზა გვერდით ხეობაში უხვევს. მცხეთიდან
    დაახლოებით 11 კმ-ია, სულ — 37 კმ და 50-მდე წუთი. ასფალტი ძველი, ვიწრო და დაკემსილია, ადგილ-ადგილ მოაჯირის
    გარეშე, ავტობუსთან გასაცდენი ადგილი კი იშვიათია. მშრალ ამინდში ეკონომ-კლასის მანქანა საკმარისია; ძლიერი
    წვიმის ან თოვლის შემდეგ ჯობს ჯიპი. საწვავი მცხეთაში ჩაასხით — მის იქით აღარაფერია.
en:
  name: Shio-Mgvime Monastery
  short: >-
    A 6th-century monastery deep in a pale limestone gorge west of Mtskheta, grown around the cave where
    the hermit Shio chose to live, die and be buried.
  body: >-
    **The road to Shio-Mgvime runs through green woods, then the walls of the valley close in and turn
    pale, and the cliffs are pocked with the dark doorways of monks' caves.**


    The name means "Shio's cave". Shio, born in Antioch and a disciple of John of Zedazeni, was one of
    the Thirteen Assyrian Fathers who came to Kartli in the 6th century. He left his brethren for this
    gorge and, the sources say, spent his last years alone in a cave some 12 metres deep, where at his
    own wish he was buried. His grave became the monastery's holiest place; the refectory still opens
    into the cave.


    By the end of that century the community is said to have numbered 2,000 monks, the largest in Georgia.
    Their first church, St John the Baptist, belongs to the second half of that century, a squat, severe
    cross half sunk into the ground under an octagonal drum and a conical roof. Its carved stone iconostasis
    now stands in the art museum in Tbilisi. Above it rises the Upper Church of the Virgin, built at the
    turn of the 12th century for David the Builder, who made Shio-Mgvime a royal domain and gave it a
    rule in 1123. Once domed, it was rebuilt as a plain basilica in 1678.


    Shah Abbas's armies sacked the monastery in 1614–16; it emptied in the 1720s; restored in 1733, it
    was raided by the Persians in 1735 and its monks were massacred. Revived in the 19th century and shut
    by the Bolsheviks, it is active again.


    A stone aqueduct some 2 km long, recorded in 1202, once brought water from the village of Skhaltba.


    Stay until the sun leaves the courtyard for the cliffs: the caves then look less like ruins than like
    windows someone has just stepped away from.
  tip: >-
    Allow an hour and a half, including the steps down to Shio's cave, which are steep, worn and dim;
    a phone torch helps. This is an active men's monastery: long trousers for men, a skirt and headscarf
    for women, and wraps are usually available at the entrance. Keep your voice down near the cave and
    ask before photographing monks. Beyond a candle stall and basic toilets there is little on site, so
    bring water and plan to eat in Mtskheta. In snow or after heavy rain, drive the gorge road slowly
    or not at all in a low car.
  route: >-
    Take the S1 motorway (E60) out of Tbilisi to the Mtskheta exit, about 20 km, and cross the Mtkvari
    into town. From the centre follow David Aghmashenebeli Street and its continuation, Ivane Javakhishvili
    Street, west along the left bank of the river; for the last few kilometres the road turns into the
    side gorge. It is about 11 km from Mtskheta, 37 km and roughly 50 minutes in all. The asphalt is old,
    narrow and patched, with unfenced drops and few places to pass a coach. An economy car is fine in
    dry weather; after heavy rain or snow an SUV is the safer choice. Fuel up in Mtskheta — there is nothing
    beyond.
ru:
  name: Монастырь Шиомгвиме
  short: >-
    Монастырь VI века в светлом известняковом ущелье к западу от Мцхеты, выросший вокруг пещеры, где отшельник
    Шио пожелал жить, умереть и быть погребённым.
  body: >-
    **Дорога к Шиомгвиме бежит через зелёный лес, потом стены долины сходятся и светлеют, а скалы оказываются
    изрыты тёмными проёмами монашеских пещер.**


    Название означает «пещера Шио». Шио, уроженец Антиохии и ученик Иоанна Зедазнийского, был одним из
    Тринадцати сирийских (ассирийских) отцов, пришедших в Картли в VI веке. Он оставил братию ради этого
    ущелья и, как говорят источники, провёл последние годы в одиночестве в пещере глубиной около 12 метров,
    где по собственной воле и был похоронен. Его могила стала главной святыней монастыря; трапезная до
    сих пор открывается прямо в пещеру.


    К концу того же века община, как считается, насчитывала 2000 монахов и была крупнейшей в Грузии. Их
    первая церковь, Иоанна Крестителя, относится ко второй половине столетия: приземистый суровый крест,
    наполовину ушедший в землю, под восьмигранным барабаном и конической кровлей. Её резной каменный иконостас
    теперь хранится в Художественном музее в Тбилиси. Выше поднимается Верхняя церковь Богородицы, построенная
    на рубеже XI и XII веков для Давида Строителя, который сделал Шиомгвиме царским владением и в 1123
    году дал ему устав. Когда-то купольная, в 1678 году она была перестроена в простую базилику.


    Войска шаха Аббаса разорили монастырь в 1614–16 годах; в 1720-х он опустел; восстановленный в 1733-м,
    в 1735 году он подвергся набегу персов, и его монахов перебили. Возрождённый в XIX веке и закрытый
    большевиками, сегодня он снова действует.


    Каменный акведук длиной около 2 км, упомянутый в 1202 году, некогда подводил воду из села Схалтба.


    Останьтесь, пока солнце не уйдёт со двора на скалы: тогда пещеры кажутся уже не руинами, а окнами,
    от которых кто-то только что отошёл.
  tip: >-
    Отведите полтора часа, включая спуск к пещере Шио по крутым, стёртым и тёмным ступеням — пригодится
    фонарик в телефоне. Это действующий мужской монастырь: мужчинам — длинные брюки, женщинам — юбка и
    платок; накидки обычно лежат у входа. У пещеры говорите вполголоса и спрашивайте разрешения, прежде
    чем фотографировать монахов. Кроме свечной лавки и простых туалетов, здесь почти ничего нет, так что
    возьмите воду и планируйте обед в Мцхете. В снег или после сильного дождя езжайте по ущелью медленно,
    а на низкой машине лучше не езжайте вовсе.
  route: >-
    Выезжайте из Тбилиси по автомагистрали S1 (E60) до съезда на Мцхету, около 20 км, и по мосту через
    Мтквари въезжайте в город. Из центра следуйте по улице Давида Агмашенебели и её продолжению, улице
    Иване Джавахишвили, на запад вдоль левого берега реки; последние несколько километров дорога идёт
    боковым ущельем. От Мцхеты около 11 км, всего около 37 км и примерно 50 минут. Асфальт старый, узкий
    и в заплатах, обрывы не огорожены, а мест, где можно разъехаться с туристическим автобусом, мало.
    В сухую погоду хватит машины эконом-класса; после сильного дождя или снега надёжнее внедорожник. Заправьтесь
    в Мцхете — дальше ничего нет.
fa:
  name: دیر شیومگویمه
  short: >-
    دیری از سدهٔ ششم در ژرفای دره‌ای آهکی و روشن در غرب متسختا، رُسته گرد غاری که زاهدی به نام شیو برای
    زیستن، مردن و آرمیدن برگزید.
  body: >-
    **جاده به شیومگویمه از میان جنگل‌های سبز می‌گذرد، سپس دیواره‌های دره تنگ‌تر و رنگ‌پریده‌تر می‌شوند
    و دهانه‌های تاریک غارهای راهبان صخره‌ها را سوراخ‌سوراخ کرده‌اند.**


    نام دیر یعنی «غار شیو». شیو، زادهٔ انطاکیه و شاگرد یوحنای زدازنی، یکی از «سیزده پدر آشوری» بود که
    در سدهٔ ششم به کارتلی آمدند. او برادران دینی‌اش را ترک کرد و به این دره آمد و، به گفتهٔ منابع، واپسین
    سال‌هایش را تنها در غاری به ژرفای حدود ۱۲ متر گذراند و به خواست خودش در همان‌جا به خاک سپرده شد. گور
    او مقدس‌ترین جای دیر شد؛ سفره‌خانهٔ راهبان هنوز به همان غار راه دارد.


    گفته می‌شود تا پایان همان سده شمار راهبان به ۲۰۰۰ تن رسید و این جماعت بزرگ‌ترین در گرجستان بود. نخستین
    کلیسایشان، کلیسای یحیای تعمیددهنده، از نیمهٔ دوم همان سده است: صلیبی کوتاه و عبوس که تا نیمه در زمین
    فرو رفته، زیر گریوی هشت‌ضلعی و بامی مخروطی. دیوارهٔ سنگی کنده‌کاری‌شدهٔ پیش‌محراب آن (ایکونوستاز)
    اکنون در موزهٔ هنر تفلیس است. بالاتر، کلیسای بالایی مریم باکره قد برافراشته که در آستانهٔ سدهٔ دوازدهم
    برای داوید سازنده ساخته شد؛ همو که شیومگویمه را ملک شاهی کرد و در ۱۱۲۳ برایش قاعده‌نامه‌ای نهاد. این
    کلیسا روزی گنبد داشت و در ۱۶۷۸ به صورت بازیلیکایی ساده بازسازی شد.


    سپاهیان شاه عباس در ۱۶۱۴–۱۶ دیر را غارت کردند؛ در دههٔ ۱۷۲۰ از راهب خالی شد؛ در ۱۷۳۳ مرمت شد، اما
    در ۱۷۳۵ سپاه ایران بر آن تاخت و راهبانش را قتل‌عام کرد. در سدهٔ نوزدهم جان تازه گرفت، بلشویک‌ها درش
    را بستند، و اکنون دوباره دایر است.


    آبراهه‌ای سنگی به درازای حدود ۲ کیلومتر، که در ۱۲۰۲ از آن یاد شده، روزگاری آب را از روستای سخالتبا
    به اینجا می‌آورد.


    بمانید تا آفتاب از حیاط برود و بر صخره‌ها بنشیند: آن‌گاه غارها کمتر به ویرانه می‌مانند و بیشتر به
    پنجره‌هایی که کسی همین حالا از کنارشان رفته است.
  tip: >-
    یک ساعت و نیم وقت بگذارید، با پله‌های سرازیر به غار شیو که تند، ساییده و کم‌نورند؛ چراغ‌قوهٔ گوشی
    به کار می‌آید. اینجا دیری فعال و مردانه است: مردان شلوار بلند، زنان دامن و روسری؛ معمولاً در ورودی
    پارچهٔ پوششی هست. نزدیک غار آهسته سخن بگویید و پیش از عکس گرفتن از راهبان اجازه بخواهید. جز دکهٔ شمع‌فروشی
    و سرویس بهداشتی ساده چیز دیگری نیست؛ پس آب همراه بیاورید و برای غذا روی متسختا حساب کنید. در برف یا
    پس از باران سنگین، جادهٔ دره را آهسته برانید، و با خودروی کف‌کوتاه بهتر است اصلاً نروید.
  route: >-
    از تفلیس با بزرگراه S1 (E60) تا خروجی متسختا، حدود ۲۰ کیلومتر، بروید و از روی متکواری وارد شهر شوید.
    از مرکز، خیابان داوید آغماشنبلی و دنبالهٔ آن، خیابان ایوانه جواخیشویلی، را به سوی غرب در امتداد کرانهٔ
    چپ رود بگیرید؛ در چند کیلومتر پایانی، جاده به درهٔ فرعی می‌پیچد. از متسختا حدود ۱۱ کیلومتر و روی‌هم
    حدود ۳۷ کیلومتر و نزدیک ۵۰ دقیقه راه است. آسفالت کهنه، باریک و وصله‌پینه است، با پرتگاه‌های بی‌حفاظ
    و جاهای اندکی برای رد شدن از کنار اتوبوس. در هوای خشک خودروی اقتصادی کافی است؛ پس از باران سنگین یا
    برف، شاسی‌بلند انتخاب مطمئن‌تری است. در متسختا باک را پر کنید — پس از آن هیچ خبری نیست.
he:
  name: מנזר שיו-מגווימה
  short: >-
    מנזר מהמאה ה-6 עמוק בערוץ של אבן גיר בהירה ממערב למצחתה, שצמח סביב המערה שבה בחר הנזיר המתבודד שיו
    לחיות, למות ולהיקבר.
  body: >-
    **הדרך לשיו-מגווימה עוברת ביערות ירוקים, ואז קירות העמק נסגרים ומלבינים, והמצוקים מנוקבים בפתחים אפלים
    של מערות נזירים.**


    השם פירושו "מערת שיו". שיו, יליד אנטיוכיה ותלמידו של יוחנן מזדאזני, היה אחד משלושה-עשר האבות האשורים
    שהגיעו לקרתלי במאה ה-6. הוא עזב את אחיו הנזירים לטובת הערוץ הזה, ולפי המקורות בילה את שנותיו האחרונות
    לבדו במערה בעומק של כ-12 מטרים, ושם, לבקשתו, נקבר. קברו הפך למקום הקדוש ביותר במנזר; חדר האוכל של
    הנזירים נפתח עד היום אל המערה.


    לקראת סוף אותה מאה מנתה הקהילה, כך מסופר, 2,000 נזירים — הגדולה בגאורגיה. הכנסייה הראשונה שלהם, כנסיית
    יוחנן המטביל, שייכת למחציתה השנייה של אותה מאה: צלב נמוך וחמור סבר, שקוע למחצה באדמה, תחת תוף מתומן
    וגג חרוטי. האיקונוסטזיס המגולף באבן שהיה בה עומד כיום במוזיאון לאמנות בטביליסי. מעליה מתנשאת הכנסייה
    העליונה של הבתולה, שנבנתה סביב ראשית המאה ה-12 עבור דוד הבונה, שהפך את שיו-מגווימה לנחלת המלך ונתן
    לה תקנון ב-1123. פעם הייתה לה כיפה; ב-1678 נבנתה מחדש כבזיליקה פשוטה.


    צבאותיו של השאה עבאס בזזו את המנזר ב-1614–16; בשנות ה-1720 הוא התרוקן; לאחר ששוקם ב-1733, פשטו עליו
    הפרסים ב-1735 ונזיריו נטבחו. הוא קם לתחייה במאה ה-19, נסגר בידי הבולשביקים, וכיום הוא פעיל שוב.


    אמת מים מאבן, באורך של כ-2 ק"מ, שנזכרת כבר ב-1202, הביאה לכאן פעם מים מן הכפר סחאלטבה.


    הישארו עד שהשמש עוזבת את החצר ועולה אל המצוקים: אז המערות נראות פחות כמו חורבות ויותר כמו חלונות שמישהו
    התרחק מהם זה עתה.
  tip: >-
    הקדישו שעה וחצי, כולל הירידה במדרגות אל מערת שיו — תלולות, שחוקות ואפלוליות; פנס הטלפון יעזור. זהו
    מנזר גברים פעיל: לגברים מכנסיים ארוכים, לנשים חצאית וכיסוי ראש, ובדרך כלל יש בכניסה בדים לכיסוי. דברו
    בשקט ליד המערה ובקשו רשות לפני שאתם מצלמים נזירים. מלבד דוכן נרות ושירותים בסיסיים אין כאן כמעט דבר,
    לכן הביאו מים ותכננו לאכול במצחתה. בשלג או אחרי גשם כבד סעו בדרך הערוץ לאט — וברכב נמוך עדיף לא לנסוע
    בה כלל.
  route: >-
    צאו מטביליסי בכביש המהיר S1 (E60) עד מחלף מצחתה, כ-20 ק"מ, וחצו את המטקווארי אל העיירה. מהמרכז המשיכו
    ברחוב דוד אגמשנבלי ובהמשכו, רחוב איוואנה ג'וואחישווילי, מערבה לאורך הגדה השמאלית של הנהר; בקילומטרים
    האחרונים הדרך פונה אל ערוץ צדדי. כ-11 ק"מ ממצחתה, ובסך הכול כ-37 ק"מ וכ-50 דקות נסיעה. האספלט ישן,
    צר ומטולא, עם מדרונות תלולים ללא גדר ומעט מקומות שבהם אפשר לחלוף על פני אוטובוס. רכב חסכוני מתאים
    במזג אוויר יבש; אחרי גשם כבד או שלג, רכב שטח הוא הבחירה הבטוחה יותר. תדלקו במצחתה — הלאה אין כלום.
ar:
  name: دير شيومغفيمي
  short: >-
    دير من القرن السادس في عمق وادٍ كلسيّ شاحب غرب متسخيتا، نما حول الكهف الذي اختاره الناسك شيو ليعيش
    فيه ويموت ويُدفن.
  body: >-
    **يمرّ الطريق إلى شيومغفيمي عبر غابات خضراء، ثم تنطبق جدران الوادي ويشحب لونها، وتبدو الجروف مثقّبة
    بمداخل مظلمة لكهوف الرهبان.**


    يعني الاسم «كهف شيو». كان شيو، المولود في أنطاكية وتلميذ يوحنا الزيدازيني، واحداً من الآباء الآشوريين
    الثلاثة عشر الذين قدموا إلى كارتلي في القرن السادس. ترك إخوته الرهبان من أجل هذا الوادي، وتقول المصادر
    إنه قضى سنواته الأخيرة وحيداً في كهف يبلغ عمقه نحو 12 متراً، ودُفن فيه بناءً على رغبته. فصار قبره
    أقدس موضع في الدير، وما زالت قاعة الطعام تنفتح على الكهف حتى اليوم.


    ويُقال إن الجماعة بلغت بحلول نهاية ذلك القرن 2000 راهب، فكانت الأكبر في جورجيا. وتعود كنيستهم الأولى،
    كنيسة يوحنا المعمدان، إلى النصف الثاني من ذلك القرن: صليب قصير صارم، نصفه غائص في الأرض، تحت رقبة
    مثمّنة وسقف مخروطي. أما حاجز الأيقونات الحجري المنحوت الذي كان فيها فهو اليوم في متحف الفنون بتبليسي.
    وفوقها ترتفع الكنيسة العليا للسيدة العذراء، التي بُنيت عند مطلع القرن الثاني عشر لداود الباني، الذي
    جعل شيومغفيمي ملكاً للتاج ووضع له قانوناً رهبانياً عام 1123. كانت ذات قبة، ثم أعيد بناؤها عام 1678
    بازيليكا بسيطة.


    نهبت جيوش الشاه عباس الدير في 1614–16؛ وخلا من رهبانه في عشرينيات القرن الثامن عشر؛ ورُمّم عام 1733،
    ثم أغار عليه الفرس عام 1735 وذُبح رهبانه. أُحيي في القرن التاسع عشر وأغلقه البلاشفة، وهو اليوم عامر
    من جديد.


    وكانت قناة مائية حجرية يبلغ طولها نحو 2 كم، ورد ذكرها عام 1202، تجلب الماء يوماً من قرية سخالتبا.


    ابقَ حتى تغادر الشمس الفناء إلى الجروف: عندها تبدو الكهوف أقل شبهاً بالأطلال وأكثر شبهاً بنوافذ ابتعد
    عنها أحدهم للتو.
  tip: >-
    خصّص ساعة ونصفاً، بما في ذلك النزول على الدرج إلى كهف شيو، وهو شديد الانحدار ومتآكل وخافت الإضاءة،
    ويفيدك فيه مصباح الهاتف. هذا دير رجالي عامر: سراويل طويلة للرجال، وتنورة وغطاء رأس للنساء، وعادةً
    تتوفر أوشحة عند المدخل. اخفض صوتك قرب الكهف، واستأذن قبل تصوير الرهبان. لا يوجد في الموقع سوى كشك
    للشموع ودورات مياه بسيطة، فاحمل ماءً وخطّط لتناول الطعام في متسخيتا. في الثلج أو بعد مطر غزير، قُد
    ببطء على طريق الوادي، أو لا تسلكه أصلاً بسيارة منخفضة.
  route: >-
    اسلك الطريق السريع S1 (E60) من تبليسي حتى مخرج متسخيتا، نحو 20 كم، واعبر نهر متكفاري إلى البلدة. من
    الوسط اتبع شارع داود أغماشينيبيلي وامتداده، شارع إيفاني جافاخيشفيلي، غرباً على طول الضفة اليسرى للنهر؛
    وفي الكيلومترات الأخيرة ينعطف الطريق إلى وادٍ جانبي. الدير على بعد نحو 11 كم من متسخيتا، أي نحو 37
    كم ونحو 50 دقيقة إجمالاً. الإسفلت قديم وضيق ومرقّع، والمنحدرات بلا حواجز، والأماكن التي تتسع لمرور
    حافلة سياحية قليلة. تكفي سيارة اقتصادية في الطقس الجاف؛ أما بعد مطر غزير أو ثلج فسيارة الدفع الرباعي
    هي الخيار الأسلم. املأ الخزان في متسخيتا، فلا شيء بعدها.
