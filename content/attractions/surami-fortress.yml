ka:
  name: სურამის ციხე
  short: >-
    შუასაუკუნეების ციხე კლდოვან ბორცვზე ლიხის ქედის ძირში, რომელიც ქართულ ლიტერატურაში ყველაზე ცნობილი
    ლეგენდის ადგილია.
  body: >-
    **სურამის ციხე იმ ბორცვზე დგას, საიდანაც ჩანს, თუ სად იყოფა საქართველო ორად.** ლიხის ქედი აქ ეშვება
    ბარში და საუკუნეების განმავლობაში ეს ვიწრო გასასვლელი აღმოსავლეთსა და დასავლეთ საქართველოს შორის
    ერთადერთი მოსახერხებელი გზა იყო. ვინც ამ ბორცვს აკონტროლებდა, აკონტროლებდა ვაჭრობასაც და ლაშქრობასაც.


    ციხის ბირთვი XII საუკუნისაა, თუმცა გამაგრებული პუნქტი აქ ბევრად ადრე არსებობდა. დღევანდელი კედლები და
    ბურჯები ძირითადად XVI-XVIII საუკუნეებში აშენდა, როცა სურამი ამილახვრების საგვარეულოს ეკუთვნოდა. XX
    საუკუნის ბოლოს ნაწილობრივ აღადგინეს, ამიტომ სილუეტი მთლიანია, ქვის ფაქტურა კი ადგილ-ადგილ თვალსაჩინოდ
    ახალი. შიგნით თითქმის არაფერია გარდა ბალახიანი ეზოსი, კიბეებისა და კოშკებისა, საიდანაც ხეობა და
    მატარებლის ლიანდაგი კარგად მოჩანს.


    ციხე მეტად ცნობილია ლეგენდით, ვიდრე არქიტექტურით. დანიელ ჭონქაძის 1859 წლის მოთხრობა „სურამის ციხე"
    მოგვითხრობს, რომ კედელი მანამ ინგრეოდა, სანამ ახალგაზრდა ზურაბი ცოცხლად არ ჩააშენეს მასში. სერგო
    ფარაჯანოვისა და დოდო აბაშიძის 1985 წლის ფილმმა ეს ამბავი მსოფლიოს გააცნო. ქართველი მკითხველისთვის
    ბორცვი სწორედ ამ ტექსტით არის დატვირთული.


    სურამი თავად პატარა დასახლებაა ფიჭვნარით — საბჭოთა პერიოდში კლიმატური კურორტი და სანატორიუმების
    ადგილი. გზისპირას მთელი რიგი დახლებია ნაზუქით: თონეში გამომცხვარი ტკბილი პური კვერცხითა და სუნელით,
    რომელიც სწორედ ამ ქალაქთან ასოცირდება. ზამთარში ბორცვი ხშირად თოვლიანია და ლიხის უღელტეხილი ნისლში
    იძირება; გაზაფხულზე ირგვლივ ყველაფერი მწვანეა და ციხე ყველაზე კარგად ჩანს.
  tip: >-
    ერთი საათი სავსებით საკმარისია. ბორცვზე ასასვლელი ბილიკი მოკლეა, მაგრამ ციცაბო და ქვაფენილიანი — სველ
    ამინდში საშიშად სრიალა ხდება. კოშკებში მოაჯირი არ არის, ბავშვებს თვალი ადევნეთ. ტუალეტი ან კაფე
    ციხესთან არ არის, სამაგიეროდ გზისპირას ნაზუქისა და ლიმონათის დახლებია. მანქანა ბორცვის ძირში, სოფლის
    ქუჩაზე დატოვეთ. ზაფხულში დღის შუა საათებში აქ ჩრდილი არსად არის.
  route: >-
    თბილისიდან გახვალთ E60-ით გორისა და ხაშურის მიმართულებით, ხაშურის შემდეგ კი ზესტაფონის გზაზე გაუხვევთ
    — სულ 133 კმ, დაახლოებით საათი და ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია და უმეტესწილად ავტობანია;
    რიკოთის ახალი მონაკვეთის გამო მოძრაობა სწრაფია. სურამში შესასვლელი მკაფიოდ არის მონიშნული, ციხე კი
    შორიდან ჩანს. საწვავი გორსა და ხაშურში აიღეთ, სოფელში სადგურები მცირეა. ეკონომ-კლასის ავტომობილი
    მთელი წლის განმავლობაში საკმარისია.
en:
  name: Surami Fortress
  short: >-
    A medieval fortress on a rocky knoll at the foot of the Likhi range, and the setting of the
    best-known legend in Georgian literature.
  body: >-
    **Surami sits on the hill from which you can see where Georgia divides in two.** The Likhi range
    drops to the plain here, and for centuries this narrow gap was the only practical passage between
    eastern and western Georgia. Whoever held the hill held the trade and the armies that used it.


    The core of the castle is 12th century, though a stronghold stood here much earlier. Most of what you
    walk through now — curtain walls, round bastions, the tall keep — went up between the 16th and 18th
    centuries, when Surami belonged to the Amilakhvari family. A restoration in the late 20th century put
    the silhouette back together, so the profile is complete while some of the stonework is visibly
    modern. Inside there is little but grass, stairs and towers; the reward is the view down the valley
    and over the railway that still climbs towards the pass.


    The fortress is famous less for its architecture than for a story. Daniel Chonkadze's 1859 novella
    *The Surami Fortress* tells of walls that kept collapsing until a young man, Zurab, agreed to be
    immured alive in them. Sergei Parajanov and Dodo Abashidze filmed it in 1985, and the film carried
    the tale far beyond Georgia. For Georgian visitors the hill is read through that text.


    Surami itself is a small pine-shaded town, a climatic resort in Soviet times with sanatoria for lung
    patients. Along the through-road, stalls sell nazuki — sweet spiced bread baked in a clay oven —
    which is what most Georgian drivers actually stop here for. In winter the hill is often under snow
    and the pass above disappears into cloud; in spring everything around it is green and the walls read
    most clearly.
  tip: >-
    An hour is enough. The path up is short but steep and cobbled, and it becomes genuinely slippery in
    wet weather. There are no handrails on the towers, so keep children close. No toilets or cafe at the
    fortress itself, but the nazuki stalls on the main road have both bread and cold drinks. Leave the
    car on the village street below the hill. In midsummer there is no shade at all on top, so come early
    or late in the day.
  route: >-
    Leave Tbilisi westbound on the E60 towards Gori and Khashuri, then follow signs for Zestaponi after
    Khashuri — 133 km in total, about an hour and forty-five minutes. The road is asphalt throughout and
    mostly dual carriageway, and the new Rikoti sections have made the run faster than it used to be. The
    Surami turn-off is clearly marked and the fortress is visible from the main road. Refuel in Gori or
    Khashuri; filling stations in the village are small. An economy car is enough all year.
ru:
  name: Крепость Сурами
  short: >-
    Средневековая крепость на скалистом холме у подножия Лихского хребта и место действия самой известной
    легенды грузинской литературы.
  body: >-
    **Сурами стоит на холме, с которого видно, где Грузия делится надвое.** Лихский хребет здесь
    спускается к равнине, и веками этот узкий проход был единственной удобной дорогой между Восточной и
    Западной Грузией. Кто держал холм, тот держал торговлю и войска.


    Ядро замка относится к XII веку, хотя укрепление здесь существовало гораздо раньше. Почти всё, по
    чему сегодня ходишь, — стены, круглые бастионы, высокая башня — построено между XVI и XVIII веками,
    когда Сурами принадлежал роду Амилахвари. Реставрация конца XX века вернула силуэт целиком, поэтому
    очертания читаются полностью, а часть кладки заметно новая. Внутри почти пусто: трава, лестницы,
    башни. Награда — вид на долину и на железную дорогу, которая до сих пор ползёт к перевалу.


    Крепость знаменита не архитектурой, а историей. Повесть Даниэла Чонкадзе «Сурамская крепость» (1859)
    рассказывает о стенах, которые рушились, пока юноша Зураб не согласился быть замурованным в них
    заживо. В 1985 году Сергей Параджанов и Додо Абашидзе сняли по ней фильм, и предание вышло далеко за
    пределы Грузии. Грузинский посетитель смотрит на холм именно через этот текст.


    Сам Сурами — небольшой городок в соснах, в советское время климатический курорт с санаториями для
    лёгочных больных. Вдоль трассы тянутся лотки с назуки: сладким пряным хлебом из тонэ, ради которого
    здесь и останавливается большинство грузинских водителей. Зимой холм часто под снегом, а перевал над
    ним тонет в облаках; весной вокруг всё зелено и стены читаются лучше всего.
  tip: >-
    Часа вполне достаточно. Подъём короткий, но крутой и вымощен камнем — в дождь становится
    по-настоящему скользко. На башнях нет перил, детей держите рядом. Туалета и кафе у крепости нет, зато
    на трассе у лотков с назуки есть и то и другое. Машину оставьте на деревенской улице под холмом. В
    разгар лета наверху нет ни клочка тени, поэтому лучше приезжать утром или под вечер.
  route: >-
    Из Тбилиси на запад по E60 в сторону Гори и Хашури, после Хашури — по указателям на Зестафони. Всего
    133 км, примерно час сорок пять. Дорога асфальтированная, в основном скоростная; новые участки
    Рикотской трассы заметно ускорили путь. Съезд на Сурами хорошо обозначен, крепость видна с трассы.
    Заправляйтесь в Гори или Хашури — в самом посёлке станции мелкие. Машины эконом-класса хватит круглый
    год.
fa:
  name: قلعهٔ سورامی
  short: >-
    قلعه‌ای از سده‌های میانه بر تپه‌ای سنگی در پای رشتهٔ لیخی و صحنهٔ مشهورترین افسانهٔ ادبیات گرجی.
  body: >-
    **سورامی بر تپه‌ای ایستاده که از آن می‌توان دید گرجستان کجا به دو نیم می‌شود.** رشتهٔ لیخی اینجا به
    دشت می‌ریزد و قرن‌ها این تنگنای باریک تنها گذرگاه عملی میان شرق و غرب گرجستان بود. هر که تپه را در
    دست داشت، بازرگانی و لشکرکشی را نیز در دست داشت.


    هستهٔ قلعه به سدهٔ دوازدهم بازمی‌گردد، هرچند دژی بسیار پیش‌تر اینجا بوده است. بیشتر آنچه امروز میان
    آن راه می‌روید — دیوارها، برج‌های گرد و برج بلند مرکزی — میان سده‌های شانزدهم تا هجدهم ساخته شد،
    زمانی که سورامی از آنِ خاندان آمیلاخواری بود. مرمتی در اواخر سدهٔ بیستم خط بیرونی بنا را کامل کرد، پس
    نمای کلی یکپارچه است اما بخشی از سنگ‌چینی آشکارا تازه است. درون قلعه چیز چندانی نیست جز چمن و پله و
    برج؛ پاداش کار، منظرهٔ درّه و خط آهنی است که هنوز به سوی گردنه بالا می‌رود.


    شهرت قلعه بیش از معماری، از یک داستان است. داستان بلند دانیل چونکادزه با نام قلعهٔ سورامی، نوشتهٔ
    ۱۸۵۹، از دیوارهایی می‌گوید که پیوسته فرو می‌ریختند تا آنکه جوانی به نام زوراب پذیرفت زنده در آنها دفن
    شود. در ۱۹۸۵ سرگئی پاراجانوف و دودو آباشیدزه از آن فیلمی ساختند و افسانه از مرزهای گرجستان فراتر رفت.
    بازدیدکنندهٔ گرجی این تپه را از دریچهٔ همان متن می‌بیند.


    خود سورامی شهرکی کوچک زیر سایهٔ کاج است؛ در دورهٔ شوروی آسایشگاه اقلیمی برای بیماران ریوی داشت. کنار
    جادهٔ اصلی دکه‌هایی نازوکی می‌فروشند، نان شیرین ادویه‌دار پخته در تنور، که بیشتر رانندگان گرجی در
    حقیقت برای همان توقف می‌کنند. زمستان تپه اغلب زیر برف است و گردنه در ابر گم می‌شود؛ بهار همه‌جا سبز
    است و دیوارها بهتر از هر فصل خوانده می‌شوند.
  tip: >-
    یک ساعت کافی است. مسیر بالا کوتاه اما تند و سنگفرش است و در هوای بارانی به‌راستی لغزنده می‌شود.
    برج‌ها نرده ندارند، پس کودکان را نزدیک نگه دارید. کنار قلعه سرویس بهداشتی و کافه نیست، اما دکه‌های
    نازوکی روی جادهٔ اصلی هر دو را دارند. خودرو را در خیابان روستا زیر تپه بگذارید. اواسط تابستان بالای
    تپه هیچ سایه‌ای نیست، پس اول صبح یا نزدیک غروب بروید.
  route: >-
    از تفلیس به سمت غرب روی E60 به سوی گوری و خاشوری بروید و پس از خاشوری نشانه‌های زستافونی را دنبال
    کنید — روی‌هم ۱۳۳ کیلومتر، حدود یک ساعت و چهل‌وپنج دقیقه. جاده سراسر آسفالت و بیشتر دوبانده است و
    قطعه‌های تازهٔ ریکوتی مسیر را سریع‌تر کرده‌اند. خروجی سورامی به‌روشنی تابلو دارد و قلعه از جادهٔ اصلی
    دیده می‌شود. سوخت را در گوری یا خاشوری بگیرید؛ پمپ‌های داخل شهرک کوچک‌اند. خودروی اقتصادی در تمام سال
    کافی است.
he:
  name: מבצר סורמי
  short: >-
    מבצר מימי הביניים על גבעת סלע למרגלות רכס ליחי, ומקום התרחשותה של האגדה המפורסמת ביותר בספרות
    הגאורגית.
  body: >-
    **סורמי יושב על הגבעה שממנה רואים היכן גאורגיה נחצית לשניים.** רכס ליחי יורד כאן אל המישור, ובמשך
    מאות שנים היה המעבר הצר הזה הדרך המעשית היחידה בין מזרח גאורגיה למערבה. מי שאחז בגבעה אחז גם במסחר
    ובצבאות שעברו בה.


    ליבת המבצר הוא מן המאה ה-12, אף שמצודה עמדה כאן הרבה קודם. רוב מה שרואים היום — חומות ההיקף,
    הבסטיונים העגולים והמגדל הגבוה — נבנה בין המאה ה-16 למאה ה-18, כשסורמי היה בידי משפחת אמילכווארי.
    שיחזור בשלהי המאה ה-20 השלים את קו המתאר, ולכן הצללית שלמה בעוד חלק מן האבן חדש בעליל. בפנים אין הרבה
    מלבד עשב, מדרגות ומגדלים; השכר הוא הנוף אל העמק ואל מסילת הברזל שעדיין מטפסת אל המעבר.


    המבצר מפורסם פחות בזכות אדריכלותו ויותר בזכות סיפור. הנובלה של דניאל צ'ונקאדזה משנת 1859, מבצר סורמי,
    מספרת על חומות שקרסו שוב ושוב עד שצעיר בשם זוראב הסכים להיקבר בהן חי. ב-1985 עשו סרגיי פרג'אנוב ודודו
    אבשידזה מן הסיפור סרט, והאגדה יצאה הרחק מגבולות גאורגיה. המבקר הגאורגי קורא את הגבעה דרך הטקסט הזה.


    סורמי עצמה היא עיירה קטנה בצל אורנים, ובימי ברית המועצות אתר מרפא אקלימי עם בתי הבראה לחולי ריאות.
    לאורך הכביש הראשי דוכנים מוכרים נאזוקי, לחם מתוק ומתובל האפוי בתנור חרס, ולמענו עוצרים כאן רוב הנהגים
    הגאורגים. בחורף הגבעה מושלגת לעיתים קרובות והמעבר שמעליה נבלע בענן; באביב הכול ירוק מסביב והחומות
    נקראות בבירור.
  tip: >-
    שעה מספיקה. השביל למעלה קצר אך תלול ומרוצף אבן, ובגשם הוא נעשה חלקלק ממש. במגדלים אין מעקות, לכן שמרו
    על ילדים קרוב. אין שירותים או בית קפה במבצר, אך בדוכני הנאזוקי שעל הכביש הראשי יש גם וגם. השאירו את
    הרכב ברחוב הכפר שמתחת לגבעה. באמצע הקיץ אין למעלה שום צל, לכן עדיף לבוא מוקדם בבוקר או לפנות ערב.
  route: >-
    צאו מטביליסי מערבה בכביש E60 לכיוון גורי וחשורי, ואחרי חשורי לכו לפי השילוט לזסטפוני — 133 ק״מ בסך
    הכול, כשעה וארבעים וחמש. הכביש סלול לכל אורכו וברובו דו-מסלולי, והקטעים החדשים של ריקוטי קיצרו את
    הנסיעה. היציאה לסורמי משולטת היטב והמבצר נראה מן הכביש הראשי. תדלקו בגורי או בחשורי; התחנות בעיירה
    עצמה קטנות. רכב חסכוני מספיק בכל עונות השנה.
ar:
  name: قلعة سورامي
  short: >-
    قلعة من العصور الوسطى على تلة صخرية عند سفح سلسلة ليخي، وهي مسرح أشهر أسطورة في الأدب الجورجي.
  body: >-
    **تقوم سورامي على التلة التي يُرى منها أين تنقسم جورجيا شطرين.** تهبط سلسلة ليخي هنا إلى السهل، وظل
    هذا المضيق الضيق قروناً الممر العملي الوحيد بين شرق جورجيا وغربها. ومن أمسك بالتلة أمسك بالتجارة
    وبالجيوش التي تعبرها.


    يعود قلب القلعة إلى القرن الثاني عشر، وإن كان حصن قد قام هنا قبل ذلك بكثير. أما معظم ما تمشي فيه
    اليوم — الأسوار والأبراج المستديرة والبرج المرتفع — فقد بُني بين القرنين السادس عشر والثامن عشر، حين
    كانت سورامي لآل أميلاخفاري. وأعاد ترميم في أواخر القرن العشرين تكوين الهيئة الخارجية كاملة، فصار الظل
    الخارجي متصلاً بينما يبدو بعض الحجر جديداً بوضوح. وفي الداخل لا شيء تقريباً غير العشب والدرج
    والأبراج؛ والمكافأة هي الإطلالة على الوادي وعلى سكة الحديد التي ما زالت تتسلق نحو الممر.


    وشهرة القلعة تأتي من حكاية أكثر مما تأتي من عمارتها. فرواية دانيال تشونكادزه القصيرة قلعة سورامي،
    الصادرة عام 1859، تحكي عن أسوار ظلت تنهار حتى قبل شاب اسمه زوراب أن يُبنى حياً داخلها. وفي 1985
    أخرجها سيرغي بارادجانوف ودودو أباشيدزه فيلماً حمل الحكاية إلى ما وراء جورجيا. والزائر الجورجي يقرأ
    التلة عبر هذا النص.


    وسورامي نفسها بلدة صغيرة في ظل الصنوبر، كانت في العهد السوفييتي مصحة مناخية لمرضى الرئة. وعلى امتداد
    الطريق العام تبيع أكشاك النازوكي، وهو خبز حلو بالتوابل يُخبز في فرن طيني، وهو في الحقيقة سبب توقف
    معظم السائقين الجورجيين. وفي الشتاء تكسو الثلوج التلة كثيراً ويغيب الممر في السحاب؛ وفي الربيع يخضرّ
    كل ما حولها وتبدو الأسوار في أوضح حالاتها.
  tip: >-
    ساعة تكفي. والدرب إلى الأعلى قصير لكنه شديد الانحدار ومرصوف بالحجر، ويصير زلقاً فعلاً في المطر. ولا
    درابزين على الأبراج، فأبقِ الأطفال قريبين. لا دورات مياه ولا مقهى عند القلعة، لكن أكشاك النازوكي على
    الطريق العام فيها الاثنان. اترك السيارة في شارع القرية أسفل التلة. وفي عز الصيف لا ظل في الأعلى
    مطلقاً، فتعال باكراً أو قرب الغروب.
  route: >-
    اخرج من تبليسي غرباً على الطريق E60 نحو غوري وخاشوري، ثم اتبع لافتات زيستافوني بعد خاشوري — 133 كم
    إجمالاً، نحو ساعة وخمس وأربعين دقيقة. الطريق معبّد بكامله ومزدوج في معظمه، وقد جعلت مقاطع ريكوتي
    الجديدة الرحلة أسرع. ومخرج سورامي عليه لافتة واضحة، والقلعة تُرى من الطريق العام. تزوّد بالوقود في
    غوري أو خاشوري؛ فمحطات البلدة صغيرة. وسيارة اقتصادية تكفي طوال السنة.
