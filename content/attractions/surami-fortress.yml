ka:
  name: სურამის ციხე
  short: >-
    ციხე კლდოვან გორაკზე, ლიხისა და ბორჯომის ძველი გზების გასაყარზე, ქართული ლიტერატურის ერთ-ერთი ყველაზე
    ცნობილი თქმულების სამშობლო.
  body: >-
    **თქმულებით, სურამის ციხის კედელი მანამ არ დადგა, სანამ მასში დედისერთა ვაჟი არ ჩააშენეს — და ქვა
    დღემდე დედის ცრემლს ჟონავს.**


    ამბავი წიგნზე ბევრად ძველია. დანიელ ჭონქაძემ იგი 1859 წელს მოთხრობად — „სურამის ციხე“ — აქცია, 1985
    წელს კი სერგო ფარაჯანოვმა და დოდო აბაშიძემ ეკრანზე გადაიტანეს. გადმოცემა ზურაბს შიდა ციხის აღმოსავლეთ
    კედელში ათავსებს და ამბობს, რომ მთვარიან ღამეებში შავებში ჩაცმული ქალი მოდის და მოთქვამს: „სურამისა
    ციხეო, სურვილითა გნახეო, ჩემი ზურაბ მანდ არის, კარგად შემინახეო.“


    ვინ გაამაგრა ეს კლდე პირველად, უცნობია; ყველაზე ადრეული ნაგებობები, სავარაუდოდ, XII საუკუნისაა. ციხე
    ორი ძველი გზის გასაყარზე დგას — ერთი დასავლეთით, ლიხის უღელტეხილებისკენ მიდიოდა, მეორე სამხრეთით,
    ბორჯომის ხეობისკენ — ამიტომაც ყველას სწადდა. 1170-იანი წლებიდან XIV საუკუნის ბოლომდე აქ ქართლის ერისთავები
    ისხდნენ, რომლებმაც სურამელის გვარი სწორედ ამ ციხისგან აიღეს. 1625 წელს გიორგი სააკაძემ იგი ირანელთა
    წინააღმდეგ გაამაგრა; მოგვიანებით როსტომ მეფემ აქ ირანული გარნიზონი ჩააყენა, ფრანგმა მოგზაურმა ჟან
    შარდენმა კი 1672–1673 წლებში ასკაციანი რაზმი ნახა. 1740-იან წლებში ციხე აჯანყებული გივი ამილახვრის
    საყრდენი იყო; 1745 წელს, მისი დანებების შემდეგ, შაჰის ბრძანებით დაანგრიეს, 1756 წელს კი აღადგინეს.


    ზემოთ ასვლისას ჩრდილოეთ კარიბჭესთან კლდეში ნაკვეთ საფეხურებს გაივლით, ძველი კედლის უხეშ, უთანაბრო
    ქონგურებს და მათ გვერდით XVII საუკუნის ხშირ, მომრგვალებულ ქონგურებს, ბოლოს კი პირამიდულ კოშკს, რომელიც
    ორი შემორჩენილი სართულიდან XX საუკუნის 80-იანი წლების ბოლოს აღადგინეს. ქვემოთ დაბა ხელისგულივით მოჩანს,
    რკინიგზა კი დასავლეთისკენ, უღელტეხილისკენ მიიკლაკნება. დაბრუნებისას ქართველი მძღოლების მაგალითს მიბაძეთ
    და გზისპირა თონეებიდან ტკბილი, სურნელოვანი ნაზუქი იყიდეთ.
  tip: >-
    შესვლა უფასოა. ასასვლელი მოკლეა, მაგრამ ციცაბო — კლდეში ნაკვეთი საფეხურები და უსწორმასწორო ქვა სველ
    ამინდში სრიალებს, კედლებს მოაჯირი არ აქვს, ამიტომ ბავშვებს თვალი არ მოაცილოთ. გორაკზე არც კაფეა, არც
    ტუალეტი, არც ჩრდილი — ზაფხულში დილით ადრე ან საღამოს ამოდით. მანქანა ქვემოთ, დაბის ქუჩებში დატოვეთ.
    ციხეს საათი ეყოფა; კიდევ ერთი საათი ლესია უკრაინკას სახლ-მუზეუმს დაუთმეთ — უკრაინელმა პოეტმა აქ სიცოცხლის
    ბოლო თვეები გაატარა, 1913 წელს.
  route: >-
    თბილისიდან ს1 (E60) გზით დასავლეთისკენ იარეთ, გორისა და ხაშურის გავლით — დაახლოებით 130 კმ, დიდწილად
    ოთხზოლიან გზაზე. ხაშურის შემდეგ სურამის გასასვლელზე გადაუხვიეთ: დაბა ხაშურიდან 4 კმ-შია, ციხე კი მის
    ჩრდილოეთ ნაწილში, მდინარე სურამულას ზემოთ, კლდოვან გორაკზე აღმართულა. სულ დაახლოებით 133 კმ და საათი
    და სამი მეოთხედი. გზა ბოლომდე ასფალტიანია და ეკონომკლასის მანქანა ნებისმიერ სეზონში საკმარისია, თუმცა
    ზამთარში ლიხის ფერდობების თოვლი დაბის ციცაბო ქუჩებს შეიძლება მოყინოს. საწვავი გორსა და ხაშურში უხვადაა.
en:
  name: Surami Fortress
  short: >-
    A citadel on a rock at the old fork of the roads west over the Likhi range and south to Borjomi, home
    to one of Georgia's best-known legends.
  body: >-
    **Legend says the walls of Surami would not stand until a mother's only son was built into them, and
    that the stone still weeps his mother's tears.**


    The story is far older than the book. Daniel Chonkadze made it literature in his 1859 novella *The
    Surami Fortress*, and in 1985 Sergei Parajanov and Dodo Abashidze filmed it as *The Legend of Suram
    Fortress*. Tradition places young Zurab in the east wall of the inner citadel and tells of a woman
    in black who comes on moonlit nights to lament: "Fortress of Surami, I look on you with longing; my
    Zurab is inside, keep him well for me."


    Nobody knows who first fortified the rock; the oldest work may be 12th-century. It stands where the
    old roads parted, one west over the Likhi passes and one south into the Borjomi gorge, and so everyone
    wanted it. From the 1170s to the late 14th century it was the seat of the eristavs of Kartli, who
    took the name Surameli, "of Surami". Giorgi Saakadze fortified it against the Persians in 1625; later
    Rostom, the Safavid-appointed ruler of Kartli, garrisoned it with Iranian troops, and the traveller
    Jean Chardin found a hundred men here in 1672–73. Prince Givi Amilakhvari held it in revolt in the
    1740s; after his surrender in 1745 the Shah had it torn down, and it was rebuilt in 1756.


    The climb passes rock-cut steps at the north gate, crude early battlements beside the neat rounded
    merlons of the 17th century, and a pyramidal keep rebuilt from two surviving storeys in the late 1980s.
    Below, the town spreads out, and the railway threads west towards the pass. Coming down, do as Georgian
    drivers do and buy nazuki, sweet spiced bread, from the roadside ovens.
  tip: >-
    Entry is free. The climb is short but steep, over rock-cut steps and uneven stone that turn slippery
    in the wet, and the walls have no railings, so keep children close. There is no café, toilet or shade
    on the hill, so in summer come early or late. Leave the car in the streets below. Allow an hour, and
    another if you want to see the Lesya Ukrainka house-museum, where the Ukrainian poet spent her last
    months in 1913.
  route: >-
    Leave Tbilisi on the S1 (E60) heading west and stay on it past Gori and Khashuri, about 130 km, much
    of it dual carriageway. Take the Surami exit just beyond Khashuri; the town lies 4 km from Khashuri,
    and the fortress rises on a rocky hill on its northern side, above the Suramula stream. In all about
    133 km and an hour and three-quarters. It is asphalt throughout and an economy car is fine in every
    season, though winter snow on the Likhi slopes can make the town's steep streets slick. Fuel is plentiful
    in Gori and Khashuri.
ru:
  name: Крепость Сурами
  short: >-
    Цитадель на скале у старой развилки дорог — на запад через Лихский хребет и на юг к Боржоми, — родина
    одной из самых известных грузинских легенд.
  body: >-
    **Легенда гласит, что стены Сурами не желали стоять, пока в них не замуровали единственного сына одной
    матери, и что камень до сих пор плачет её слезами.**


    Эта история намного старше книги. Литературой её сделал Даниэл Чонкадзе в повести «Сурамская крепость»
    1859 года, а в 1985 году Сергей Параджанов и Додо Абашидзе экранизировали её под названием «Легенда
    о Сурамской крепости». Предание помещает юного Зураба в восточную стену внутренней цитадели и рассказывает
    о женщине в чёрном, которая лунными ночами приходит оплакивать его: «Сурамская крепость, смотрю на
    тебя с тоской; мой Зураб у тебя внутри — сбереги его для меня».


    Кто первым укрепил эту скалу, неизвестно; древнейшие постройки, возможно, относятся к XII веку. Крепость
    стоит там, где расходились две старые дороги — на запад через Лихские перевалы и на юг в Боржомское
    ущелье, — и потому её хотели все. С 1170-х годов до конца XIV века здесь сидели эриставы Картли, принявшие
    по крепости фамилию Сурамели. Георгий Саакадзе укреплял её против персов в 1625 году; позднее Ростом,
    поставленный Сефевидами правитель Картли, разместил здесь иранский гарнизон, и путешественник Жан
    Шарден застал тут в 1672–1673 годах сотню воинов. В 1740-х годах в ней засел восставший князь Гиви
    Амилахвари; после его сдачи в 1745 году шах приказал срыть крепость, а в 1756 году её отстроили снова.


    Подъём ведёт мимо вырубленных в скале ступеней у северных ворот, грубых ранних зубцов рядом с аккуратными
    закруглёнными зубцами XVII века и пирамидального донжона, восстановленного в конце 1980-х из двух
    уцелевших ярусов. Внизу раскинулся город, а железная дорога тянется на запад, к перевалу. На обратном
    пути сделайте, как грузинские водители: купите в придорожных печах назуки, сладкий пряный хлеб.
  tip: >-
    Вход свободный. Подъём короткий, но крутой — по вырубленным в скале ступеням и неровному камню, который
    в сырость становится скользким, а перил на стенах нет, так что держите детей рядом. На холме нет ни
    кафе, ни туалета, ни тени, поэтому летом приходите рано утром или ближе к вечеру. Машину оставьте
    на улицах внизу. Отведите на крепость час и ещё час, если хотите увидеть дом-музей Леси Украинки,
    где украинская поэтесса провела последние месяцы жизни в 1913 году.
  route: >-
    Выезжайте из Тбилиси на запад по трассе S1 (E60) и держитесь её мимо Гори и Хашури — около 130 км,
    большей частью по четырёхполосной дороге. Сразу за Хашури сверните на съезд к Сурами; город лежит
    в 4 км от Хашури, а крепость поднимается на скалистом холме в его северной части, над речкой Сурамулой.
    Всего около 133 км и час сорок пять минут. Асфальт на всём пути, и машина эконом-класса подходит в
    любое время года, хотя зимой снег на склонах Лихского хребта может сделать крутые улицы города скользкими.
    Заправок в Гори и Хашури достаточно.
fa:
  name: قلعهٔ سورامی
  short: >-
    ارگی بر صخره، بر دوراهیِ کهنِ راه غرب از فراز لیخی و راه جنوب به بورجومی؛ زادگاه یکی از مشهورترین
    افسانه‌های گرجستان.
  body: >-
    **افسانه می‌گوید دیوارهای سورامی بر پا نماندند تا آن‌که تنها پسر مادری را زنده در دیوارشان چیدند،
    و سنگ هنوز اشک‌های آن مادر را می‌گرید.**


    این داستان بسیار کهن‌تر از کتاب است. دانیل چونکادزه در داستان بلند «قلعهٔ سورامی» (۱۸۵۹) آن را به
    ادبیات بدل کرد، و در ۱۹۸۵ سرگئی پاراجانوف و دودو آباشیدزه آن را با نام «افسانهٔ قلعهٔ سورامی» به فیلم
    درآوردند. روایت سنتی، زوراب جوان را در دیوار شرقی ارگ درونی جای می‌دهد و از زنی سیاه‌پوش می‌گوید که
    در شب‌های مهتابی به سوگواری می‌آید: «ای قلعهٔ سورامی، با دلتنگی در تو می‌نگرم؛ زوراب من در دل توست،
    نیکو نگاهش دار.»


    کسی نمی‌داند نخستین بار چه کسی این صخره را استوار کرد؛ کهن‌ترین بخش‌ها شاید از سدهٔ دوازدهم باشند.
    قلعه آن‌جا ایستاده که دو راه کهن از هم جدا می‌شدند، یکی به غرب از گردنه‌های لیخی و دیگری به جنوب به
    تنگهٔ بورجومی، و از همین رو همه خواهانش بودند. از دههٔ ۱۱۷۰ تا اواخر سدهٔ چهاردهم، مقر اریستاوهای
    (فرمانداران) کارتلی بود که نام «سورامِلی»، یعنی «سورامی»، را برگزیدند. گیورگی ساآکادزه در ۱۶۲۵ آن
    را در برابر سپاه ایران استوار کرد؛ بعدها رستم، فرمانروای کارتلی که صفویان بر سر کار آورده بودند، سربازان
    ایرانی را در آن مستقر کرد، و ژان شاردنِ جهانگرد در سال‌های ۱۶۷۲ تا ۱۶۷۳ صد مرد را در آن یافت. شاهزاده
    گیوی آمیلاخواری در دههٔ ۱۷۴۰ سر به شورش برداشت و قلعه را در دست گرفت؛ پس از تسلیم او در ۱۷۴۵، شاه
    فرمان به ویرانی‌اش داد، و قلعه در ۱۷۵۶ از نو ساخته شد.


    راه بالا از کنار پله‌های تراشیده در صخره نزد دروازهٔ شمالی می‌گذرد، از کنار کنگره‌های زمخت نخستین
    در کنار کنگره‌های گرد و منظم سدهٔ هفدهم، و از کنار برج اصلی هرمی‌شکل که در اواخر دههٔ ۱۹۸۰ بر پایهٔ
    دو طبقهٔ بازمانده از نو ساخته شد. در پایین، شهر گسترده است و راه‌آهن رو به غرب، به سوی گردنه، پیش
    می‌رود. هنگام پایین آمدن همان کنید که رانندگان گرجی می‌کنند: از تنورهای کنار جاده نازوکی، نانی شیرین
    و ادویه‌دار، بخرید.
  tip: >-
    ورود رایگان است. بالا رفتن کوتاه اما پرشیب است، از روی پله‌های صخره‌ای و سنگ‌های ناهموار که در هوای
    خیس لغزنده می‌شوند، و دیوارها نرده ندارند؛ پس کودکان را نزدیک خود نگه دارید. روی تپه نه کافه‌ای هست،
    نه سرویس بهداشتی و نه سایه‌ای، پس در تابستان صبح زود یا نزدیک غروب بیایید. خودرو را در خیابان‌های
    پایین بگذارید. یک ساعت وقت بگذارید، و ساعتی دیگر اگر می‌خواهید خانه‌موزهٔ لسیا اوکراینکا را ببینید؛
    شاعرِ اوکراینی واپسین ماه‌های عمرش را در ۱۹۱۳ در آن گذراند.
  route: >-
    از تفلیس جادهٔ S1 (E60) را رو به غرب بگیرید و از گوری و خاشوری بگذرید، حدود ۱۳۰ کیلومتر که بیشترش
    جادهٔ دوبانده است. درست پس از خاشوری از خروجی سورامی خارج شوید؛ شهر ۴ کیلومتر با خاشوری فاصله دارد
    و قلعه بر تپه‌ای صخره‌ای در بخش شمالی آن، بالای نهر سورامولا، سر برآورده است. روی هم حدود ۱۳۳ کیلومتر
    و یک ساعت و سه‌ربع. تمام راه آسفالت است و خودروی اقتصادی در هر فصلی کافی است، هرچند برف زمستانی بر
    دامنه‌های لیخی ممکن است خیابان‌های پرشیب شهر را لغزنده کند. سوخت در گوری و خاشوری فراوان است.
he:
  name: מבצר סורמי
  short: >-
    מצודה על סלע בצומת דרכים עתיק – מערבה מעל רכס ליחי ודרומה לבורג'ומי – ומשכנה של אחת האגדות המפורסמות
    ביותר בגאורגיה.
  body: >-
    **האגדה מספרת שחומות סורמי סירבו לעמוד עד שנבנה לתוכן בנה היחיד של אם אחת, ושהאבן בוכה עד היום את
    דמעותיה.**


    הסיפור עתיק בהרבה מן הספר. דניאל צ'ונקדזה הפך אותו לספרות בנובלה "מבצר סורמי" משנת 1859, ובשנת 1985
    הסריטו אותו סרגיי פרג'נוב ודודו אבשידזה בשם "האגדה על מבצר סורמי". המסורת ממקמת את זוראב הצעיר בחומה
    המזרחית של המצודה הפנימית ומספרת על אישה בשחורים הבאה בלילות ירח לקונן: "מבצר סורמי, בגעגועים אני
    מביטה בך; זוראב שלי בתוכך, שמור לי עליו היטב."


    איש אינו יודע מי ביצר את הסלע לראשונה; הבנייה העתיקה ביותר אולי מן המאה ה-12. המבצר עומד במקום שבו
    נפרדו בעבר שתי דרכים, אחת מערבה דרך מעברי ליחי ואחת דרומה אל ערוץ בורג'ומי, ולכן כולם רצו בו. משנות
    ה-70 של המאה ה-12 ועד סוף המאה ה-14 ישבו בו האריסטאווים (המושלים) של קרתלי, שאימצו את השם סורמלי,
    "של סורמי". גיורגי סאאקדזה ביצר אותו נגד הפרסים ב-1625; מאוחר יותר הציב בו רוסטום, שליט קרתלי שמינו
    הספווים, חיל מצב איראני, והנוסע ז'אן שרדן מצא כאן מאה איש בשנים 1672–1673. הנסיך גיווי אמילחווארי
    החזיק בו במרד בשנות ה-40 של המאה ה-18; אחרי כניעתו ב-1745 ציווה השאה להרוס אותו, והוא נבנה מחדש ב-1756.


    העלייה עוברת ליד מדרגות חצובות בסלע בשער הצפוני, ליד שיני חומה מוקדמות וגסות הסמוכות לשיני חומה מעוגלות
    ומסודרות מן המאה ה-17, וליד מגדל ראשי פירמידלי ששוחזר בסוף שנות ה-80 על בסיס שתי קומות ששרדו. למטה
    נפרשת העיר, ומסילת הרכבת משתחלת מערבה לעבר המעבר. בירידה עשו כמו הנהגים הגאורגים וקנו נאזוקי, לחם
    מתוק ומתובל, מן התנורים שלצד הדרך.
  tip: >-
    הכניסה חינם. העלייה קצרה אבל תלולה, על מדרגות חצובות בסלע ואבן לא אחידה שהופכות חלקלקות ברטיבות, ולחומות
    אין מעקות, לכן החזיקו ילדים קרוב. על הגבעה אין בית קפה, שירותים או צל, ולכן בקיץ בואו מוקדם או מאוחר.
    השאירו את הרכב ברחובות שלמטה. הקדישו שעה, ועוד שעה אם תרצו לראות את בית-המוזיאון של לסיה אוקראינקה,
    שבו בילתה המשוררת האוקראינית את חודשיה האחרונים ב-1913.
  route: >-
    צאו מטביליסי מערבה בכביש S1 (E60) והישארו עליו אחרי גורי וחשורי, כ-130 ק״מ, רובם בכביש דו-מסלולי.
    רדו ביציאה לסורמי מיד אחרי חשורי; העיר שוכנת 4 ק״מ מחשורי, והמבצר מתנשא על גבעה סלעית בצדה הצפוני,
    מעל הנחל סורמולה. בסך הכול כ-133 ק״מ ושעה ושלושה רבעים. הדרך סלולה לכל אורכה ורכב אקונומי מתאים בכל
    עונה, אם כי בחורף שלג על מורדות ליחי עלול להפוך את הרחובות התלולים בעיר לחלקלקים. דלק יש בשפע בגורי
    ובחשורי.
ar:
  name: قلعة سورامي
  short: >-
    قلعة على صخرة عند مفترق طريقين قديمين، غرباً عبر سلسلة ليخي وجنوباً إلى بورجومي، وموطن إحدى أشهر الأساطير
    في جورجيا.
  body: >-
    **تقول الأسطورة إن أسوار سورامي أبت أن تقوم حتى بُني في جوفها حيّاً الابنُ الوحيد لأمٍّ ما، وإن الحجر
    لا يزال يذرف دموعها.**


    القصة أقدم بكثير من الكتاب. فقد حوّلها دانيال تشونكادزه إلى أدب في روايته القصيرة «قلعة سورامي» عام
    1859، ثم نقلها سيرغي باراجانوف ودودو أباشيدزه إلى الشاشة عام 1985 بعنوان «أسطورة قلعة سورامي». ويضع
    التقليد الفتى زوراب في الجدار الشرقي للقلعة الداخلية، ويحكي عن امرأة متشحة بالسواد تأتي في الليالي
    المقمرة لتنوح: «يا قلعة سورامي، إليكِ أنظر بحنين؛ زوراب في داخلك، فاحفظيه لي جيداً».


    لا أحد يعرف من حصّن الصخرة أولاً؛ وربما تعود أقدم الأعمال فيها إلى القرن الثاني عشر. تقوم القلعة حيث
    كان يفترق طريقان قديمان، أحدهما غرباً عبر ممرات ليخي والآخر جنوباً إلى مضيق بورجومي، ولذا أرادها الجميع.
    ومن سبعينيات القرن الثاني عشر حتى أواخر القرن الرابع عشر كانت مقرّ إريستافات (حكّام) كارتلي، الذين
    اتخذوا اسم سوراميلي، أي «السورامي». وحصّنها غيورغي ساآكادزه في وجه الفرس عام 1625؛ ثم أقام فيها رستم،
    حاكم كارتلي المعيّن من قِبل الصفويين، حامية إيرانية، ووجد فيها الرحّالة جان شاردان مئة رجل في عامي
    1672–1673. وتحصّن فيها الأمير غيفي أميلاخفاري ثائراً في أربعينيات القرن الثامن عشر؛ وبعد استسلامه
    عام 1745 أمر الشاه بهدمها، ثم أُعيد بناؤها عام 1756.


    يمرّ الصعود بدرجات منحوتة في الصخر عند البوابة الشمالية، وبشُرَفٍ أولى خشنة إلى جانب شُرَف مستديرة
    منتظمة من القرن السابع عشر، وببرج رئيسي هرمي أُعيد بناؤه في أواخر الثمانينيات انطلاقاً من طابقين بقيا
    قائمين. وفي الأسفل تنبسط المدينة، وتنساب سكة الحديد غرباً نحو الممر. وفي طريق النزول افعل ما يفعله
    السائقون الجورجيون واشترِ النازوكي، الخبز الحلو المتبّل، من الأفران على جانب الطريق.
  tip: >-
    الدخول مجاني. الصعود قصير لكنه شديد الانحدار، على درجات منحوتة في الصخر وحجارة غير مستوية تصبح زلقة
    في الطقس الرطب، ولا درابزين على الأسوار، فأبقِ الأطفال قريبين منك. لا مقهى ولا دورة مياه ولا ظل على
    التلة، فتعالَ صيفاً في الصباح الباكر أو قُبيل المساء. اترك السيارة في الشوارع أسفل التلة. خصّص ساعة،
    وساعة أخرى إن أردت زيارة البيت المتحف لليسيا أوكراينكا، حيث قضت الشاعرة الأوكرانية أشهرها الأخيرة
    عام 1913.
  route: >-
    اخرج من تبليسي غرباً على الطريق S1 (E60) وابقَ عليه متجاوزاً غوري وخاشوري، نحو 130 كم معظمها طريق
    مزدوج. اسلك مخرج سورامي بعد خاشوري مباشرة؛ تقع البلدة على بعد 4 كم من خاشوري، وترتفع القلعة على تلة
    صخرية في جانبها الشمالي فوق جدول سورامولا. المجموع نحو 133 كم وساعة وثلاثة أرباع الساعة. الطريق معبّد
    بالكامل والسيارة الاقتصادية مناسبة في كل الفصول، وإن كان ثلج الشتاء على منحدرات ليخي قد يجعل شوارع
    البلدة الشديدة الانحدار زلقة. والوقود متوفر بكثرة في غوري وخاشوري.
