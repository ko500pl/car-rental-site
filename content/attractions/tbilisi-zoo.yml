ka:
  name: თბილისის ზოოპარკი
  short: >-
    საქართველოს უძველესი ზოოპარკი, 1927 წლიდან ვერეს მწვანე ხეობაში — მშვიდი საოჯახო დილა, რომელსაც მძიმე
    და პატიოსანი ისტორია ახლავს.
  body: >-
    **თითქმის ერთი საუკუნეა, თბილისელი ბავშვები პირველ ლომს ერთსა და იმავე ვიწრო, მწვანე ხეობაში ხვდებიან.**
    ზოოპარკი ქალაქის საბჭოს გადაწყვეტილებით 1927 წლის 10 თებერვალს დაარსდა, მდინარე ვერეს ნაპირას — პატარა
    მდინარისა, რომელიც ქალაქს მტკვრისკენ ჩაუყვება. 1930-იან წლებში გაფართოვდა, 1970-იან წლებში კი, თავის
    საუკეთესო ხანაში, ათასზე მეტ ცხოველს ითვლიდა და წელიწადში ნახევარ მილიონზე მეტ სტუმარს იღებდა.


    მერე ძნელი ათწლეულები დადგა. 1991 წლის შემდეგ, ეკონომიკის ნგრევის წლებში, ცხოველების ნახევარზე მეტი
    შიმშილსა და სიცივეს შეეწირა — ასე აღწერა ვითარება ცხოველთა კეთილდღეობის ინსპექტორმა, რომელიც აქ 1993
    წელს იყო. აღდგენა ნელა მიმდინარეობდა: 2007 წელს ზოოპარკში საზღვაო აკვარიუმი გაიხსნა, პირველი მთელ
    კავკასიაში. 2012 წელს ქალაქმა ზოოპარკის თბილისის ზღვასთან, ახალ ვრცელ პარკში გადატანა გადაწყვიტა,
    მაგრამ თანხა ვერ მოიძებნა — და ცხოველები ისევ აქ იყვნენ 2015 წლის 14 ივნისს, როცა ადიდებულმა ვერემ
    ტერიტორია წალეკა. დაიღუპა კოლექციის თითქმის ნახევარი და სამი თანამშრომელი, რომლებიც აქვე ცხოვრობდნენ;
    ბეჰემოთი, ლომები, ვეფხვები, დათვები და მგლები ქალაქის ქუჩებში აღმოჩნდნენ, ის კადრები კი მთელმა მსოფლიომ
    ნახა.


    დღევანდელი ზოოპარკი ხელახლა აშენებულია: ახალი ვოლიერები, ხეობის ფერდზე ამავალი ბილიკები ძველი ხეების
    ჩრდილში, ეგზოტარიუმის თბილი, ნოტიო ჰაერი. ის მოკრძალებულია და ეს თავადაც კარგად იცის. თითქმის ორმოცდაათი
    წლის განმავლობაში, 2013 წლამდე, ფოტოგრაფი ვიქტორ სუკიასოვი აქ ბავშვებს პაპიე-მაშეს ცხენებზე სვამდა
    და სურათებს უღებდა — პატარა რიტუალი, რომელიც საბჭოთა კავშირს ორი ათწლეულით გადაურჩა.


    მოდით პატარებთან ერთად, უჩქარო დილით — და ამ ადგილის ისტორიამ ცოტათი უფრო ლმობიერი გაგხადოთ მის მიმართ.
  tip: >-
    ბილეთი 12 წლიდან 4 ლარია, 3–12 წლის ბავშვისთვის — 2 ლარი, სამ წლამდე შესვლა უფასოა. ეგზოტარიუმს ცალკე
    ბილეთი აქვს (2 ლარი, ბავშვისთვის — 1), ბილეთების ყიდვა ონლაინაც შეიძლება. ზოოპარკი მთელი წელი ღიაა,
    თუმცა ზამთარში ბევრი ცხოველი შიდა სათავსებშია, ამიტომ აპრილიდან ოქტომბრამდე მეტს ნახავთ. ბილიკები
    ხეობის ფერდზე ადის და საბავშვო ეტლისთვის ზოგან ციცაბოა. კვების წერტილები ცოტაა — წყალი და წასახემსებელი
    თან იქონიეთ. ცხოველების კვება აკრძალულია. შაბათ-კვირას, შუადღისას, ზოოპარკი ადგილობრივი ოჯახებით ივსება;
    სამუშაო დღის დილა გაცილებით მშვიდია.
  route: >-
    შესასვლელი გმირთა მოედანთანაა, იქ, სადაც კოსტავას ქუჩა მთავრდება: თავისუფლების მოედნიდან გზით დაახლოებით
    4 კმ, თავისუფალ გზაზე 10–15 წუთი, პიკის საათებში — შესამჩნევად მეტი. მტკვრის მარჯვენა სანაპიროს ჩრდილოეთით
    გაჰყევით და გმირთა მოედანზე ამოდით — ეს ქალაქის ყველაზე ჩახლართული კვანძია, სადაც რამდენიმე სწრაფი
    ნაკადი ერთმანეთს ერთვის. სასურველ ზოლში წინასწარ გადადით, თორემ წრის ხელახლა შემოვლა მოგიწევთ. კოსტავას
    ქუჩაზე, შესასვლელთან, ფასიანი პარკინგია, მაგრამ შაბათ-კვირის შუადღისთვის ადგილი აღარ რჩება — დილით
    მიდით. ნებისმიერი ეკონომკლასის მანქანა გამოდგება, მეტს აქ არაფერი მოითხოვს.
en:
  name: Tbilisi Zoo
  short: >-
    Georgia's oldest zoo, opened in 1927 in the green fold of the Vere valley: an easy family morning
    with a hard and honest history.
  body: >-
    **For almost a century, Tbilisi children have met their first lion in the same narrow green valley.**
    The zoo was founded by decision of the city council on 10 February 1927, on the banks of the Vere,
    a small river that slips through the city towards the Mtkvari. It grew through the 1930s, and in its
    1970s heyday kept more than a thousand animals and welcomed over half a million visitors a year.


    Then came the lean decades. After 1991, as the economy collapsed, more than half of the animals died
    of hunger and cold, according to an animal-welfare inspector who came in 1993. Recovery was slow;
    in 2007 the zoo opened a marine aquarium, the first in the Caucasus. In 2012 the city decided to move
    everything to a spacious new park beside the Tbilisi Sea, but the money never came, and the animals
    were still here on 14 June 2015, when the swollen Vere tore through the grounds. Nearly half the collection
    died, along with three keepers who lived on site; a hippopotamus, lions, tigers, bears and wolves
    escaped into the streets, and the pictures went round the world.


    What you walk through today is the rebuilt zoo: new enclosures, paths climbing the valley side under
    old trees, the warm, damp air of the exotarium. It is modest, and it knows it. For nearly fifty years,
    until 2013, the photographer Victor Sukiasov sat children on papier-mâché horses here to take their
    portraits, a small ritual that outlived the Soviet Union by two decades.


    Come for an unhurried morning with small children, and let the place's story make you a little gentler
    with it.
  tip: >-
    Tickets are 4 GEL from age 12 and 2 GEL for children aged 3–12; under-threes go free. The exotarium
    has its own ticket (2 GEL, 1 GEL for children), and tickets can also be bought online. The zoo is
    open all year, but in winter many animals stay in their indoor quarters, so April to October shows
    you more. Paths climb the valley side and some are steep for a pushchair. Food inside is limited:
    bring water and snacks. Feeding the animals is forbidden. Weekend afternoons fill with local families;
    weekday mornings are calm.
  route: >-
    The entrance is at Heroes' Square, where Kostava Street ends: about 4 km by road from Freedom Square,
    10–15 minutes in light traffic and noticeably more at rush hour. Follow the right-bank embankment
    of the Mtkvari north and climb to Heroes' Square, the city's most tangled interchange, where several
    fast streams of traffic merge. Pick your lane early or you will be sent round the loop again. There
    is paid parking along Kostava Street near the gate, but by weekend afternoons it is full, so come
    in the morning. Any economy car will do; nothing here asks for more.
ru:
  name: Тбилисский зоопарк
  short: >-
    Старейший зоопарк Грузии, открытый в 1927 году в зелёной складке долины Вере: лёгкое семейное утро
    с тяжёлой и честной историей.
  body: >-
    **Почти столетие тбилисские дети встречают своего первого льва в одной и той же узкой зелёной долине.**
    Зоопарк основан решением городского совета 10 февраля 1927 года на берегах Вере — небольшой реки,
    которая пробирается через город к Мтквари. В 1930-е он разросся, а в свои лучшие годы, в 1970-е, содержал
    больше тысячи животных и принимал свыше полумиллиона посетителей в год.


    Потом пришли голодные десятилетия. После 1991 года, когда рухнула экономика, больше половины животных
    погибло от голода и холода — так свидетельствовал инспектор по защите животных, приезжавший сюда в
    1993-м. Восстановление шло медленно; в 2007 году в зоопарке открылся морской аквариум — первый на
    Кавказе. В 2012-м город решил перевезти всё в просторный новый парк у Тбилисского моря, но денег так
    и не нашлось, и животные всё ещё были здесь 14 июня 2015 года, когда вздувшаяся Вере пронеслась по
    территории. Погибла почти половина коллекции, а вместе с ней трое смотрителей, живших при зоопарке;
    бегемот, львы, тигры, медведи и волки вырвались на улицы, и эти кадры облетели весь мир.


    Сегодня вы гуляете по заново отстроенному зоопарку: новые вольеры, дорожки, взбирающиеся по склону
    долины под старыми деревьями, тёплый влажный воздух экзотариума. Он скромен и знает об этом. Почти
    пятьдесят лет, до 2013 года, фотограф Виктор Сукиасов усаживал здесь детей на лошадок из папье-маше,
    чтобы снять их портреты, — маленький ритуал, переживший Советский Союз на два десятилетия.


    Приезжайте сюда на неспешное утро с маленькими детьми — и позвольте истории этого места сделать вас
    к нему чуть мягче.
  tip: >-
    Билет стоит 4 лари с 12 лет и 2 лари для детей от 3 до 12; малыши до трёх лет проходят бесплатно.
    В экзотариум нужен отдельный билет (2 лари, для детей 1 лари); билеты можно купить и онлайн. Зоопарк
    открыт круглый год, но зимой многие животные остаются во внутренних помещениях, так что с апреля по
    октябрь вы увидите больше. Дорожки поднимаются по склону долины, и некоторые из них круты для детской
    коляски. С едой внутри негусто: возьмите воду и перекус. Кормить животных запрещено. По выходным после
    обеда здесь полно местных семей; утром в будни спокойно.
  route: >-
    Вход — на площади Героев, там, где заканчивается улица Костава: около 4 км по дороге от площади Свободы,
    10–15 минут при свободном движении и заметно дольше в час пик. Держите на север по правобережной набережной
    Мтквари и поднимитесь к площади Героев — самой запутанной развязке города, где сливаются несколько
    быстрых потоков. Выбирайте полосу заранее, иначе вас снова отправят на круг. Платная парковка есть
    вдоль улицы Костава у ворот, но в выходные после обеда она забита, так что приезжайте с утра. Подойдёт
    любая машина эконом-класса — ничего большего здесь не нужно.
fa:
  name: باغ‌وحش تفلیس
  short: >-
    قدیمی‌ترین باغ‌وحش گرجستان، گشوده در ۱۹۲۷ در چین سبز درهٔ وره: صبحی آسان برای خانواده، با تاریخی سخت
    و صادقانه.
  body: >-
    **نزدیک به یک سده است که کودکان تفلیس نخستین شیر زندگی‌شان را در همین درهٔ سبز و باریک می‌بینند.**
    باغ‌وحش به تصمیم شورای شهر در ۱۰ فوریهٔ ۱۹۲۷ بر کرانه‌های وره بنیاد نهاده شد، رودی کوچک که از میان
    شهر به سوی متکواری می‌لغزد. در دههٔ ۱۹۳۰ گسترش یافت و در دوران اوجش، در دههٔ ۱۹۷۰، بیش از هزار جانور
    داشت و سالانه بیش از نیم میلیون بازدیدکننده را پذیرا می‌شد.


    سپس دهه‌های تنگدستی از راه رسید. پس از ۱۹۹۱، با فروپاشی اقتصاد، به گفتهٔ بازرسی از حوزهٔ رفاه حیوانات
    که در ۱۹۹۳ به این‌جا آمد، بیش از نیمی از جانوران از گرسنگی و سرما مردند. بهبود کند بود؛ در ۲۰۰۷ باغ‌وحش
    آکواریومی دریایی گشود که نخستین آکواریوم دریایی قفقاز بود. در ۲۰۱۲ شهر تصمیم گرفت همه‌چیز را به پارکی
    تازه و پهناور کنار دریای تفلیس ببرد، اما پول هرگز نرسید، و جانوران در ۱۴ ژوئن ۲۰۱۵ هنوز همین‌جا بودند؛
    روزی که ورهٔ طغیان‌کرده از میان محوطه گذشت. نزدیک به نیمی از جانوران تلف شدند و سه تن از مراقبان باغ‌وحش
    که در همان محوطه زندگی می‌کردند نیز جان باختند؛ یک اسب آبی، شیرها، ببرها، خرس‌ها و گرگ‌ها به خیابان‌ها
    گریختند و تصویرهایش در سراسر جهان دست‌به‌دست شد.


    آنچه امروز در آن قدم می‌زنید باغ‌وحش بازسازی‌شده است: جایگاه‌های تازه، راه‌هایی که زیر درختان کهن
    از دامنهٔ دره بالا می‌روند، و هوای گرم و مرطوب اگزوتاریوم. فروتن است و خودش این را می‌داند. نزدیک
    به پنجاه سال، تا ۲۰۱۳، ویکتور سوکیاسوف عکاس کودکان را این‌جا بر اسب‌های پاپیه‌ماشه می‌نشاند تا از
    آنان عکس بگیرد؛ آیینی کوچک که دو دهه بیش از اتحاد شوروی دوام آورد.


    برای صبحی بی‌شتاب با کودکان خردسال بیایید، و بگذارید سرگذشت این‌جا شما را نسبت به آن کمی مهربان‌تر
    کند.
  tip: >-
    بلیت از ۱۲ سالگی ۴ لاری و برای کودکان ۳ تا ۱۲ سال ۲ لاری است؛ کودکان زیر سه سال رایگان‌اند. اگزوتاریوم
    بلیت جداگانه دارد (۲ لاری، برای کودکان ۱ لاری) و بلیت‌ها را آنلاین هم می‌توان خرید. باغ‌وحش تمام سال
    باز است، اما در زمستان بسیاری از جانوران در جایگاه‌های سرپوشیده می‌مانند، پس از آوریل تا اکتبر بیشتر
    می‌بینید. راه‌ها از دامنهٔ دره بالا می‌روند و برخی برای کالسکهٔ بچه زیادی شیب دارند. خوراکی درون باغ‌وحش
    محدود است: آب و تنقلات همراه بیاورید. غذا دادن به جانوران ممنوع است. بعدازظهرهای آخر هفته پر از خانواده‌های
    محلی است؛ صبح‌های روزهای کاری آرام است.
  route: >-
    ورودی در میدان قهرمانان است، جایی که خیابان کوستاوا به پایان می‌رسد: حدود ۴ کیلومتر رانندگی از میدان
    آزادی، ۱۰ تا ۱۵ دقیقه در ترافیک سبک و به‌مراتب بیشتر در ساعت شلوغی. خیابان ساحلی کرانهٔ راست متکواری
    را به سوی شمال دنبال کنید و تا میدان قهرمانان بالا بروید؛ درهم‌ترین تقاطع شهر، جایی که چند جریان تند
    ترافیک به هم می‌پیوندند. خط خود را زود انتخاب کنید، وگرنه دوباره به دور حلقه فرستاده می‌شوید. کنار
    دروازه، در امتداد خیابان کوستاوا، پارکینگ پولی هست، اما بعدازظهرهای آخر هفته پر می‌شود؛ پس صبح بیایید.
    هر خودروی اقتصادی کافی است؛ این‌جا چیزی بیش از آن لازم نیست.
he:
  name: גן החיות של טביליסי
  short: 'גן החיות הוותיק ביותר בגאורגיה, שנפתח ב-1927 בקפל הירוק של עמק ורה: בוקר משפחתי קל, עם היסטוריה
    קשה וכנה.'
  body: >-
    **כבר כמעט מאה שנה שילדי טביליסי פוגשים את האריה הראשון שלהם באותו עמק ירוק וצר.** גן החיות נוסד בהחלטת
    מועצת העיר ב-10 בפברואר 1927, על גדות נהר ורה, נהר קטן שמשתחל דרך העיר אל המטקוורי. הוא התרחב בשנות
    ה-30, ובימי הזוהר שלו, בשנות ה-70, החזיק יותר מאלף בעלי חיים וקיבל למעלה מחצי מיליון מבקרים בשנה.


    אחר כך באו העשורים הרזים. אחרי 1991, כשהכלכלה קרסה, יותר ממחצית בעלי החיים מתו מרעב ומקור, לדברי מפקח
    לרווחת בעלי חיים שהגיע למקום ב-1993. ההתאוששות הייתה איטית; ב-2007 נפתח בגן אקווריום ימי, הראשון בקווקז.
    ב-2012 החליטה העירייה להעביר הכול לפארק חדש ומרווח ליד הים של טביליסי, אבל הכסף לא הגיע מעולם, ובעלי
    החיים עדיין היו כאן ב-14 ביוני 2015, כשנהר ורה הגואה פרץ דרך השטח. כמעט מחצית מן האוסף מתה, ואיתה
    שלושה מטפלים שגרו במקום; היפופוטם, אריות, טיגריסים, דובים וזאבים נמלטו אל הרחובות, והתמונות הקיפו
    את העולם.


    מה שתטיילו בו היום הוא גן החיות שנבנה מחדש: מתחמים חדשים, שבילים המטפסים במדרון העמק תחת עצים ותיקים,
    האוויר החם והלח של האקזוטריום. הוא צנוע, והוא יודע את זה. במשך כמעט חמישים שנה, עד 2013, הושיב כאן
    הצלם ויקטור סוקיאסוב ילדים על סוסי פפייה-מאשה כדי לצלם את דיוקנם — טקס קטן ששרד את ברית המועצות בשני
    עשורים.


    בואו לבוקר נינוח עם ילדים קטנים, ותנו לסיפורו של המקום לרכך אתכם כלפיו מעט.
  tip: >-
    כרטיס עולה 4 לארי מגיל 12 ו-2 לארי לילדים בני 3–12; פעוטות מתחת לגיל שלוש נכנסים בחינם. לאקזוטריום
    יש כרטיס נפרד (2 לארי, 1 לארי לילדים), ואפשר לקנות כרטיסים גם באינטרנט. גן החיות פתוח כל השנה, אבל
    בחורף רבים מבעלי החיים נשארים במבנים המקורים, כך שמאפריל עד אוקטובר תראו יותר. השבילים מטפסים במדרון
    העמק, וחלקם תלולים לעגלת תינוק. האוכל בפנים מוגבל: הביאו מים וחטיפים. אסור להאכיל את בעלי החיים. אחר
    הצהריים בסופי שבוע הגן מתמלא במשפחות מקומיות; בבקרים של ימי חול שקט.
  route: >-
    הכניסה בכיכר הגיבורים, במקום שבו מסתיים רחוב קוסטבה: כ-4 ק״מ בכביש מכיכר החירות, 10–15 דקות בתנועה
    דלילה ומשמעותית יותר בשעת העומס. סעו צפונה בכביש הטיילת של הגדה הימנית של המטקוורי ועלו אל כיכר הגיבורים,
    המחלף הסבוך ביותר בעיר, שבו מתמזגים כמה זרמי תנועה מהירים. בחרו נתיב מוקדם, אחרת תישלחו שוב לסיבוב.
    יש חניה בתשלום לאורך רחוב קוסטבה ליד השער, אבל אחר הצהריים בסופי שבוע היא מלאה, אז באו בבוקר. כל רכב
    חסכוני יתאים; שום דבר כאן לא דורש יותר.
ar:
  name: حديقة حيوان تبليسي
  short: 'أقدم حديقة حيوان في جورجيا، افتُتحت عام 1927 في ثنية وادي فيري الخضراء: صباح عائلي سهل، وتاريخ
    قاسٍ وصادق.'
  body: >-
    **منذ قرابة قرن يلتقي أطفال تبليسي أسدهم الأول في الوادي الأخضر الضيق نفسه.** أُسست الحديقة بقرار
    من مجلس المدينة في 10 فبراير 1927 على ضفتي نهر فيري، وهو نهر صغير يتسلل عبر المدينة نحو متكفاري. واتسعت
    في ثلاثينيات القرن العشرين، وفي عصرها الذهبي خلال السبعينيات ضمّت أكثر من ألف حيوان واستقبلت ما يزيد
    على نصف مليون زائر في العام.


    ثم جاءت العقود العجاف. فبعد عام 1991، ومع انهيار الاقتصاد، نفق أكثر من نصف الحيوانات جوعاً وبرداً،
    بحسب مفتش في مجال رعاية الحيوان زار الحديقة عام 1993. كان التعافي بطيئاً؛ وفي عام 2007 افتتحت الحديقة
    حوضاً للأحياء البحرية هو الأول في القوقاز. وفي عام 2012 قررت المدينة نقل كل شيء إلى متنزه جديد فسيح
    قرب بحر تبليسي، لكن المال لم يأتِ قط، فكانت الحيوانات لا تزال هنا في 14 يونيو 2015 حين اجتاح نهر فيري
    الهائج أرجاء الحديقة. نفق قرابة نصف المجموعة، ولقي ثلاثة من العاملين في رعاية الحيوانات ممن كانوا
    يقيمون في الموقع حتفهم؛ وفرّ فرس نهر وأسود ونمور ودببة وذئاب إلى الشوارع، وجابت الصور العالم.


    ما تمشي فيه اليوم هو الحديقة بعد إعادة بنائها: حظائر جديدة، ودروب تتسلق سفح الوادي تحت أشجار معمّرة،
    وهواء الإكزوتاريوم الدافئ الرطب. إنها متواضعة، وتعرف ذلك. وطوال قرابة خمسين عاماً، حتى عام 2013، كان
    المصوّر فيكتور سوكياسوف يُجلس الأطفال هنا على خيول من الورق المعجّن ليلتقط صورهم، في طقس صغير عاش
    بعد الاتحاد السوفيتي عقدين كاملين.


    تعالَ لصباح هادئ مع أطفال صغار، ودع حكاية المكان تجعلك أرفق به قليلاً.
  tip: >-
    سعر التذكرة 4 لاري من سن 12 عاماً، و2 لاري للأطفال من 3 إلى 12 عاماً، ويدخل من هم دون الثالثة مجاناً.
    وللإكزوتاريوم تذكرة مستقلة (2 لاري، و1 لاري للأطفال)، ويمكن شراء التذاكر عبر الإنترنت أيضاً. تفتح
    الحديقة طوال العام، لكن كثيراً من الحيوانات تبقى شتاءً في مساكنها المغلقة، فمن أبريل إلى أكتوبر ترى
    أكثر. الدروب تصعد سفح الوادي، وبعضها شديد الانحدار لعربة الأطفال. الطعام في الداخل محدود، فأحضر ماءً
    ووجبات خفيفة. إطعام الحيوانات ممنوع. تمتلئ الحديقة بعد ظهر عطلات نهاية الأسبوع بالعائلات المحلية،
    أما صباحات أيام العمل فهادئة.
  route: >-
    المدخل في ميدان الأبطال، حيث ينتهي شارع كوستافا: نحو 4 كم بالطريق من ميدان الحرية، و10–15 دقيقة في
    حركة مرور خفيفة، وأكثر بوضوح في ساعة الذروة. اتبع كورنيش الضفة اليمنى لنهر متكفاري شمالاً، ثم اصعد
    إلى ميدان الأبطال، أكثر تقاطعات المدينة تشابكاً، حيث تندمج عدة تيارات مرورية سريعة. اختر مسارك مبكراً،
    وإلا اضطُررت إلى الدوران حول الحلقة مرة أخرى. وهناك موقف مدفوع على امتداد شارع كوستافا قرب البوابة،
    لكنه يمتلئ بعد ظهر عطلات نهاية الأسبوع، فتعالَ صباحاً. تكفي أي سيارة اقتصادية، فلا شيء هنا يتطلب أكثر
    من ذلك.
