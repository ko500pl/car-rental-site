ka:
  name: თბილისის ზოოპარკი
  short: კავკასიის უძველესი ზოოპარკი (1927) გმირთა მოედანთან — საოჯახო გაჩერება ქალაქის შუაგულში, სიმბოლური
    ბილეთით.
  body: >-
    **კავკასიის უძველესმა ზოოპარკმა იმაზე მეტი დრამა გადაიტანა, ვიდრე მისმა ბინადრებმა ერთად.** ის 1927
    წლის 10 თებერვალს დაარსდა მდინარე ვერეს ხეობაში, დღევანდელი გმირთა მოედნის გვერდით, და 1970-იანებში
    ათასზე მეტ ცხოველს ითვლიდა. 2015 წლის 14 ივნისს ადიდებულმა ვერემ ტერიტორია წალეკა: დაიღუპა კოლექციის
    თითქმის ნახევარი და სამი თანამშრომელი, ქუჩებში კი ლომები, ვეფხვები და ბეჰემოთი აღმოჩნდნენ — კადრები
    მსოფლიო პრესამ მოიარა.


    მას შემდეგ პარკი ეტაპობრივად განახლდა: აშენდა ახალი ვოლიერები, მოწესრიგდა ინფრასტრუქტურა, თბილისის
    ზღვასთან გადატანის გეგმა კი ჯერჯერობით გეგმად რჩება. დღეს აქ ნახავ:


    - მსხვილ მტაცებლებს — ლომებს, ვეფხვებსა და დათვებს განახლებულ ვოლიერებში

    - ეგზოტარიუმს ქვეწარმავლებითა და ეგზოტიკური სახეობებით

    - ჩრდილიან ხეივნებს, სადაც პატარებთან ერთად სეირნობა ადვილია


    ეს მსოფლიო დონის ზოოპარკი არ არის და ამას არც აპირებს — მაგრამ ბავშვიანი ოჯახისთვის ორსაათიანი მშვიდი
    გაჩერებაა ქალაქის ცენტრში, ბილეთი კი თბილისის ღირსშესანიშნაობებს შორის ყველაზე იაფია. შაბათ-კვირას
    ადგილობრივი ოჯახებით ივსება.
  tip: >-
    ბილეთი ზრდასრულისთვის 4 ლარია, 3–12 წლის ბავშვისთვის — 2; ეგზოტარიუმი ცალკე, სიმბოლურ ფასად. ღიაა
    ყოველდღე, მაგრამ ზამთარში ცხოველების ნაწილი შიდა სათავსებშია — აპრილიდან ოქტომბრამდე ვიზიტი უფრო ღირებულია.
    კვების წერტილები მინიმალურია, წყალი და საჭმელი თან წამოიღე. ეზო ვერეს ხეობის ფერდობზეა — ეტლით მოძრაობა
    ზოგან ციცაბოა. ცხოველების კვება იკრძალება.
  route: >-
    ზოოპარკის შესასვლელი გმირთა მოედნის მხრიდანაა, კოსტავას ქუჩის გასწვრივ — რუსთაველიდან მანქანით 10
    წუთი. გმირთა მოედანი ქალაქის ყველაზე დატვირთული კვანძია: მოძრაობა მრავალზოლიანია და ნაკადი სწრაფი,
    ამიტომ ნავიგატორს წინასწარ დააკვირდი, გასასვლელი რომ არ გამოგრჩეს. მანქანა შესასვლელთან, კოსტავას
    გასწვრივ ფასიან ზონაში დგება; შაბათ-კვირის შუადღეს ადგილის პოვნა ჭირს — დილით მიდი. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია, ალტერნატივად მეტრო „სამედიცინო უნივერსიტეტი" ან „თავისუფლების მოედნიდან"
    ავტობუსები გამოდგება.
en:
  name: Tbilisi Zoo
  short: >-
    The oldest zoo in the Caucasus (1927), beside Heroes' Square — an easy family stop in the middle of
    the city, with a token ticket price.
  body: >-
    **The oldest zoo in the Caucasus has survived more drama than all its animals put together.** Founded
    on 10 February 1927 in the valley of the Vere river, beside what is now Heroes' Square, it counted
    over a thousand animals by the 1970s. On 14 June 2015 the swollen Vere burst through the grounds:
    nearly half the collection and three keepers died, and lions, tigers and a hippopotamus wandered the
    streets of Tbilisi — footage that went around the world.


    Since then the park has been rebuilt in stages, with new enclosures and proper flood defences, while
    the long-promised move to a bigger site by the Tbilisi Sea remains a plan on paper. Today you will
    find:


    - Big cats and bears in renovated enclosures

    - An exotarium with reptiles and other exotic species

    - Shaded walkways that make an easy loop with small children


    This is not a world-class zoo and does not pretend to be — but for a family with kids it is a calm
    two-hour stop right in the city, and the ticket is the cheapest of any Tbilisi attraction. On weekends
    it fills up with local families.
  tip: >-
    Tickets are 4 GEL for adults and 2 GEL for children aged 3–12; the exotarium charges a small separate
    fee. Open daily year-round, but in winter some animals stay in indoor quarters — April to October
    is the better window. Food options inside are minimal, so bring water and snacks. The grounds climb
    the Vere valley slope, so some paths are steep for strollers. Feeding the animals is forbidden.
  route: >-
    The entrance is off Heroes' Square along Kostava Street — about 10 minutes' drive from Rustaveli.
    Heroes' Square is the busiest interchange in the city: multiple fast lanes merge, so watch the navigator
    early or you will miss the exit and loop again. Park in the paid zone along Kostava near the entrance;
    on weekend afternoons spaces are scarce, so come in the morning. An economy car is entirely sufficient;
    the Medical University metro station or buses from the centre work as an alternative.
ru:
  name: Тбилисский зоопарк
  short: >-
    Старейший зоопарк Кавказа (1927) у площади Героев — лёгкая семейная остановка в центре города с символической
    ценой билета.
  body: >-
    **Старейший зоопарк Кавказа пережил больше драм, чем все его обитатели вместе взятые.** Он основан
    10 февраля 1927 года в долине реки Вере, рядом с нынешней площадью Героев, и к 1970-м насчитывал больше
    тысячи животных. 14 июня 2015 года вздувшаяся Вере прорвалась через территорию: погибла почти половина
    коллекции и трое сотрудников, а по улицам Тбилиси бродили львы, тигры и бегемот — кадры обошли весь
    мир.


    С тех пор парк поэтапно отстроили заново — новые вольеры, нормальная защита от паводков; давно обещанный
    переезд на большую территорию у Тбилисского моря пока остаётся планом на бумаге. Сегодня здесь:


    - крупные хищники и медведи в обновлённых вольерах

    - экзотариум с рептилиями и экзотическими видами

    - тенистые дорожки, по которым легко гулять с маленькими детьми


    Это не зоопарк мирового уровня и не претендует на это — но для семьи с детьми это спокойная двухчасовая
    остановка прямо в городе, а билет — самый дешёвый среди достопримечательностей Тбилиси. По выходным
    здесь много местных семей.
  tip: >-
    Билет для взрослых — 4 лари, для детей 3–12 лет — 2 лари; экзотариум оплачивается отдельно, недорого.
    Открыт ежедневно круглый год, но зимой часть животных сидит во внутренних помещениях — лучшее время
    с апреля по октябрь. Еды внутри почти нет, берите воду и перекус. Территория поднимается по склону
    долины Вере, местами дорожки крутые для коляски. Кормить животных запрещено.
  route: >-
    Вход — со стороны площади Героев, вдоль улицы Костава; от Руставели на машине минут десять. Площадь
    Героев — самая загруженная развязка города: полосы быстрые и их много, следите за навигатором заранее,
    иначе проскочите съезд и пойдёте на второй круг. Парковка — платная зона вдоль Костава у входа; в
    выходные после обеда мест мало, приезжайте утром. Машины эконом-класса вполне достаточно; альтернатива
    — метро «Медицинский университет» или автобусы из центра.
fa:
  name: باغ‌وحش تفلیس
  short: کهن‌ترین باغ‌وحش قفقاز (۱۹۲۷) کنار میدان قهرمانان — توقفی خانوادگی در دل شهر با بلیتی تقریباً
    نمادین.
  body: >-
    **کهن‌ترین باغ‌وحش قفقاز بیش از همهٔ جانورانش ماجرا از سر گذرانده است.** این باغ‌وحش در ۱۰ فوریهٔ
    ۱۹۲۷ در درهٔ رود وره، کنار میدان قهرمانان امروزی، بنیاد شد و تا دههٔ ۱۹۷۰ بیش از هزار جانور داشت.
    در ۱۴ ژوئن ۲۰۱۵ رود طغیان‌کردهٔ وره محوطه را درنوردید: نزدیک به نیمی از مجموعه و سه نگهبان جان باختند
    و شیرها، ببرها و یک اسب آبی در خیابان‌های تفلیس سرگردان شدند — تصاویری که دنیا را دور زد.


    از آن زمان پارک مرحله‌به‌مرحله بازسازی شده: قفس‌ها و محوطه‌های تازه و سامانهٔ دفاع در برابر سیل؛ وعدهٔ
    قدیمی انتقال به زمینی بزرگ‌تر کنار دریاچهٔ تفلیس هنوز روی کاغذ مانده است. امروز اینجا می‌بینید:


    - گربه‌سانان بزرگ و خرس‌ها در محوطه‌های نوسازی‌شده

    - اگزوتاریوم با خزندگان و گونه‌های کمیاب

    - گذرگاه‌های سایه‌دار که با بچه‌های کوچک به‌راحتی دور می‌زنید


    این باغ‌وحشی در تراز جهانی نیست و ادعایش را هم ندارد — اما برای خانواده‌ای با کودک، توقفی آرام و دوساعته
    وسط شهر است و بلیتش ارزان‌ترینِ جاذبه‌های تفلیس. آخر هفته‌ها پر از خانواده‌های محلی می‌شود.
  tip: >-
    بلیت بزرگسال ۴ لاری و کودک ۳ تا ۱۲ سال ۲ لاری است؛ اگزوتاریوم ورودی جداگانه و اندکی دارد. تمام سال
    هر روز باز است، اما زمستان بخشی از جانوران در جایگاه‌های سرپوشیده‌اند — آوریل تا اکتبر بهترین بازه
    است. خوراکی داخل کم است؛ آب و تنقلات همراه ببرید. محوطه روی شیب درهٔ وره است و بعضی مسیرها برای کالسکه
    تند است. غذا دادن به جانوران ممنوع است.
  route: >-
    ورودی از سمت میدان قهرمانان، در امتداد خیابان کوستاواست — از روستاولی حدود ده دقیقه رانندگی. میدان
    قهرمانان شلوغ‌ترین تقاطع شهر است: باندها زیاد و سریع‌اند، پس زودتر به مسیریاب نگاه کنید وگرنه خروجی
    را رد می‌کنید و باید دوری دوباره بزنید. خودرو را در محدودهٔ پولی امتداد کوستاوا نزدیک ورودی پارک کنید؛
    بعدازظهر آخر هفته جای خالی کم است، صبح بروید. خودروی اقتصادی کاملاً کافی است؛ متروی «دانشگاه پزشکی»
    یا اتوبوس‌های مرکز شهر هم گزینه‌اند.
he:
  name: גן החיות של טביליסי
  short: גן החיות הוותיק בקווקז (1927) ליד כיכר הגיבורים — עצירה משפחתית קלה בלב העיר, בכרטיס סמלי.
  body: >-
    **גן החיות הוותיק בקווקז שרד יותר דרמות מכל חיותיו יחד.** הוא נוסד ב-10 בפברואר 1927 בעמק נהר וֶרֶה,
    ליד כיכר הגיבורים של היום, ובשנות השבעים מנה יותר מאלף בעלי חיים. ב-14 ביוני 2015 פרץ הוורה הגועש
    אל השטח: כמחצית מהאוסף ושלושה מטפלים נספו, ואריות, נמרים והיפופוטם שוטטו ברחובות טביליסי — צילומים
    שהקיפו את העולם.


    מאז נבנה הפארק מחדש בשלבים — מתחמים חדשים והגנות נאותות מפני שיטפונות; המעבר המובטח לשטח גדול יותר
    ליד ים טביליסי נשאר בינתיים תוכנית על הנייר. היום תמצאו כאן:


    - חתולים גדולים ודובים במתחמים משופצים

    - אקזוטריום עם זוחלים ומינים אקזוטיים

    - שבילים מוצלים שמרכיבים הקפה קלה עם ילדים קטנים


    זה לא גן חיות ברמה עולמית והוא גם לא מתיימר — אבל למשפחה עם ילדים זו עצירה רגועה של שעתיים בתוך העיר,
    והכרטיס הוא הזול ביותר מבין האטרקציות של טביליסי. בסופי שבוע הוא מתמלא במשפחות מקומיות.
  tip: >-
    כרטיס למבוגר עולה 4 לארי ולילד בגיל 3–12 — 2 לארי; לאקזוטריום תשלום נפרד וקטן. פתוח כל יום כל השנה,
    אבל בחורף חלק מהחיות במבנים סגורים — אפריל עד אוקטובר הוא החלון הטוב. האוכל בפנים מינימלי, קחו מים
    וחטיפים. השטח מטפס על מדרון עמק הוורה, וחלק מהשבילים תלולים לעגלה. האכלת החיות אסורה.
  route: >-
    הכניסה מכיוון כיכר הגיבורים, לאורך רחוב קוסטבה — כעשר דקות נסיעה מרוסתוולי. כיכר הגיבורים היא המחלף
    העמוס בעיר: נתיבים רבים ומהירים, אז עקבו אחרי הניווט מוקדם, אחרת תפספסו את היציאה ותקיפו שוב. חנו
    באזור בתשלום לאורך קוסטבה ליד הכניסה; בסופי שבוע אחר הצהריים קשה למצוא מקום — בואו בבוקר. רכב חסכוני
    מספיק לגמרי; תחנת המטרו "האוניברסיטה הרפואית" או אוטובוסים מהמרכז הם חלופה טובה.
ar:
  name: حديقة حيوانات تبليسي
  short: أقدم حديقة حيوانات في القوقاز (1927) بجوار ساحة الأبطال — محطة عائلية سهلة في قلب المدينة بتذكرة
    رمزية.
  body: >-
    **أقدم حديقة حيوانات في القوقاز عاشت من الدراما أكثر مما عاشت حيواناتها مجتمعة.** تأسست في 10 فبراير
    1927 في وادي نهر فيري بجوار ما يُعرف اليوم بساحة الأبطال، وبلغ عدد حيواناتها في السبعينيات أكثر من
    ألف. وفي 14 يونيو 2015 اجتاح نهر فيري الفائض أرضها: نفق نحو نصف المجموعة وقضى ثلاثة من العاملين، وهامت
    الأسود والنمور وفرس نهر في شوارع تبليسي — مشاهد طافت العالم.


    منذ ذلك الحين أعيد بناء الحديقة على مراحل — حظائر جديدة ودفاعات حقيقية ضد الفيضان؛ أما الانتقال الموعود
    منذ زمن إلى موقع أكبر عند بحر تبليسي فما زال خطة على الورق. اليوم تجد هنا:


    - السنوريات الكبيرة والدببة في حظائر مجددة

    - «إكزوتاريوم» بالزواحف والأنواع النادرة

    - ممرات ظليلة تشكل جولة سهلة مع الأطفال الصغار


    ليست حديقة من الطراز العالمي ولا تدّعي ذلك — لكنها لعائلة مع أطفال محطة هادئة لساعتين في وسط المدينة،
    وتذكرتها الأرخص بين معالم تبليسي. في عطلات نهاية الأسبوع تمتلئ بالعائلات المحلية.
  tip: >-
    تذكرة البالغ 4 لاري وللطفل من 3 إلى 12 سنة لاريان؛ وللإكزوتاريوم رسم صغير منفصل. مفتوحة يومياً طوال
    السنة، لكن في الشتاء يبقى بعض الحيوانات في أماكن مغلقة — من أبريل إلى أكتوبر الفترة الأفضل. خيارات
    الطعام في الداخل قليلة، فخذ معك ماء ووجبات خفيفة. الأرض تصعد على منحدر وادي فيري وبعض الممرات شديدة
    الميل لعربة الأطفال. إطعام الحيوانات ممنوع.
  route: >-
    المدخل من جهة ساحة الأبطال على امتداد شارع كوستافا — نحو عشر دقائق بالسيارة من روستافيلي. ساحة الأبطال
    أكثر تقاطعات المدينة ازدحاماً: مسارات كثيرة وسريعة، فانتبه إلى الملاح مبكراً وإلا فاتك المخرج ودرت
    دورة أخرى. أوقف السيارة في المنطقة المدفوعة على كوستافا قرب المدخل؛ بعد ظهر العطلة تندر الأماكن فتعال
    صباحاً. سيارة اقتصادية تكفي تماماً؛ ومحطة مترو «الجامعة الطبية» أو حافلات وسط المدينة بديل جيد.
