ka:
  name: ალაზნის ველი
  short: >-
    ვენახების გრძელი მწვანე ტაფობი გომბორსა და კავკასიონს შორის — სტრაბონისთვის ნაცნობი მდინარე, ჰერეთის
    მიწა და ქართული ღვინის გული.
  body: >-
    **მოწმენდილ დილას სიღნაღის გალავანზე დადექით და მთელი კახეთი ხელისგულზე გექნებათ: ვენახების გრძელი
    მწვანე ტაფობი, მის მიღმა კი კავკასიონის თეთრი კედელი.**


    ალაზნის ვაკე საქართველოში დაახლოებით 160 კილომეტრზეა გადაჭიმული და აზერბაიჯანში გრძელდება; სამხრეთ-დასავლეთიდან
    გომბორის ქედი ზღუდავს, ჩრდილო-აღმოსავლეთიდან — კავკასიონი, ზღვის დონიდან 200–470 მეტრზე. შუაზე ალაზანი
    მიიკლაკნება: ზამთარში თითქმის შრება, გაზაფხულზე, მთებში თოვლის დნობისას, კი ადიდდება და ნაპირებიდან
    გადმოდის. ქართველები ველის ორ მხარეს სხვადასხვა სახელით იცნობენ: გომბორის ძირს წინამხარს ეძახიან,
    კავკასიონისას — გაღმამხარს.


    ეს ძველი მიწაა. ანტიკური გეოგრაფები, სტრაბონი და პლინიუსი, მდინარეს ალაზონიოსად მოიხსენიებენ და, შესაძლოა,
    სწორედ ის იყოს აბასი, რომლის ნაპირზეც ძვ. წ. 65 წელს პომპეუსის ლეგიონები კავკასიის ალბანელებს შეებნენ.
    შუა საუკუნეებში ველის ქართული ნაწილი ჰერეთი იყო, XI საუკუნიდან კი კახეთის სამეფოს შემადგენლობაში შევიდა.
    XVII საუკუნის დასაწყისში, შაჰ-აბასის შემოსევების შემდეგ, ველის აღმოსავლეთ ნაწილში ისლამი გავრცელდა.
    დღესაც ვრცელ ველზე, საზღვრის ორივე მხარეს, ქართველები და აზერბაიჯანელები, ინგილოები, ავარები, ცახურები
    და უდები ცხოვრობენ.


    მაინც, უწინარეს ყოვლისა, ეს ღვინის ქვეყანაა. წინამხარზე წინანდალი და მუკუზანია, გაღმამხარზე — ქინძმარაული
    და ნაფარეული; ქვევრში ღვინის დაყენების ქართული წესი 2013 წლიდან იუნესკოს არამატერიალური მემკვიდრეობის
    ნუსხაშია. სამი მხრიდან მთებით დაცულ ველს აღმოსავლეთ ამიერკავკასიაში ყველაზე რბილი ჰავა აქვს; გლეხის
    მთავარი შიში სეტყვაა — აქ ის ხშირად არ მოდის, მაგრამ მსხვილი მოდის.


    საუკეთესო ხედები სიღნაღის გალავნიდან, გომბორიდან თელავისკენ დაშვებისას და ყვარლის მხრიდან იშლება,
    სადაც ვენახები მთის ძირს ეკვრის. ზემოდან ალაზნის ველი სურათია; ქვემოთ ჩახვალთ — და სუფრად იქცევა.
  tip: >-
    ველს ერთ გაჩერებად ნუ დაგეგმავთ — ეს მთელი დღის წრეა: თელავი, წინანდალი, ყვარელი, სიღნაღი. ხედები
    უფასოა და დროში შეზღუდული არაა; საუკეთესო შუქი დილით ადრე და მზის ჩასვლისასაა, შუადღისას ზაფხულში
    ველს ბურუსი ფარავს, ყველაზე სუფთა ჰაერი კი ზამთარსა და გვიან შემოდგომაზეა. მარნებში დეგუსტაცია წინასწარ
    დაჯავშნეთ და მძღოლს ღვინო არ დაალევინოთ — კახეთის გზებზე პოლიცია ხშირად ამოწმებს. რთველისას, სექტემბერ-ოქტომბერში,
    თელავისა და სიღნაღის სასტუმროები ადრე ივსება.
  route: >-
    თბილისიდან ველისკენ ორი გზა მიდის. უმოკლესი გომბორის უღელტეხილია (შ38): კახეთის გზატკეცილით (ს5) ვაზიანამდე,
    იქიდან კი უღელტეხილზე გადასვლით თელავამდე — დაახლოებით 90 კმ და საათი და ორმოცი წუთი, მოსახვევიანი,
    მაგრამ კარგი ასფალტით; ზამთარში თოვლი შეიძლება დაგხვდეთ. მეორე კახეთის გზატკეცილია (ს5) საგარეჯოსა
    და ბაკურციხის გავლით — უფრო გრძელი, მაგრამ ვაკე და სიღნაღისა და გურჯაანისკენ მოსახერხებელი. საწვავი
    საგარეჯოში, თელავსა და გურჯაანშია. ველის მთავარი გზები ასფალტიანია და ეკონომ-კლასის მანქანა მშვენივრად
    გაძლებს; მხოლოდ ვენახებს შორის ჩამავალი შესახვევებია ხანდახან ხრეშიანი.
en:
  name: Alazani Valley
  short: >-
    A long green trough of vineyards between Gombori and the Caucasus: Strabo's Alazonius, medieval Hereti,
    and the heart of Georgian wine.
  body: >-
    **Stand on the walls of Sighnaghi on a clear morning and all of Kakheti lies open below you: a long
    green trough of vineyards, and beyond it the white wall of the Greater Caucasus.**


    The Alazani plain runs for about 160 km through Georgia and on into Azerbaijan, hemmed in by the Gombori
    range to the south-west and the Caucasus to the north-east, at 200 to 470 metres above sea level.
    Down the middle winds the Alazani, which shrinks almost to nothing in winter and floods its banks
    in spring as the mountain snow melts. Georgians give the two sides two names: Tsinamkhari, the near
    side under Gombori, and Gaghmamkhari, the far side under the Caucasus.


    It is old ground. Strabo and Pliny knew the river as the Alazonius, and it may be the Abas, where
    Pompey's legions fought the Caucasian Albanians in 65 BC. In the Middle Ages the Georgian side was
    the province of Hereti, part of the Kingdom of Kakheti from the 11th century. Shah Abbas's invasions
    in the early 17th century brought Islam to its eastern reaches, and the wider valley, on both sides
    of the border, is still shared by Georgians and Azerbaijanis, Ingiloys, Avars, Tsakhurs and Udis.


    Above all, though, this is wine country. Tsinandali and Mukuzani lie on the near side, Kindzmarauli
    and Napareuli on the far, and Georgia's qvevri method has been on UNESCO's intangible heritage list
    since 2013. Sheltered by mountains on three sides, the valley has the mildest climate in the eastern
    South Caucasus. What growers fear most is hail: it does not fall often here, but when it does the
    hailstones are large.


    The finest views are from Sighnaghi's walls, from the road down off Gombori towards Telavi, and from
    the Kvareli side, where the vines run right up to the mountains. Seen from above, the valley is a
    view; drive down into it and it becomes a table.
  tip: >-
    Treat the valley as a full-day loop rather than a single stop: Telavi, Tsinandali, Kvareli, Sighnaghi.
    The views are free and never close. The light is best early in the morning and at sunset; on summer
    afternoons a haze settles over the plain, and the air is clearest in winter and late autumn. Book
    winery tastings ahead and keep your driver sober, as police checks on Kakheti roads are routine. During
    the September-October harvest, hotels in Telavi and Sighnaghi fill up early.
  route: >-
    Two roads lead from Tbilisi. The shorter crosses the Gombori Pass (Sh38): take the Kakheti Highway
    (S5) as far as Vaziani, then turn off and climb over the pass to Telavi. That is about 90 km and an
    hour and forty minutes, winding but well surfaced, though snow is possible in winter. The alternative
    stays on the Kakheti Highway (S5) through Sagarejo and Bakurtsikhe: longer but flat, and the better
    choice for Sighnaghi or Gurjaani. There is fuel in Sagarejo, Telavi and Gurjaani. The valley's main
    roads are asphalt and an economy car copes easily; only some lanes between the vineyards are gravel.
ru:
  name: Алазанская долина
  short: >-
    Длинная зелёная впадина виноградников между Гомбори и Кавказом: Алазоний у Страбона, средневековая
    Эрети и сердце грузинского вина.
  body: >-
    **Встаньте на стены Сигнахи ясным утром — и вся Кахетия раскинется под вами: длинная зелёная впадина
    виноградников, а за ней белая стена Большого Кавказа.**


    Алазанская равнина тянется около 160 км по Грузии и далее в Азербайджан, стиснутая с юго-запада Гомборским
    хребтом, а с северо-востока Кавказом, на высоте от 200 до 470 метров. Посередине петляет Алазани —
    зимой она почти пересыхает, а весной, когда тают горные снега, заливает берега. У двух сторон долины
    у грузин свои имена: Цинамхари — ближняя сторона, под Гомбори, и Гагмамхари — дальняя, под Кавказом.


    Это древняя земля. Страбон и Плиний знали реку как Алазоний, и, возможно, это та самая река Абас,
    у которой в 65 году до н. э. легионы Помпея сражались с кавказскими албанами. В Средние века грузинская
    сторона была провинцией Эрети, с XI века — частью Кахетинского царства. Вторжения шаха Аббаса в начале
    XVII века принесли ислам в её восточные пределы, и всю долину, по обе стороны границы, до сих пор
    делят между собой грузины и азербайджанцы, ингилойцы, аварцы, цахуры и удины.


    Но прежде всего это винный край. Цинандали и Мукузани стоят на ближней стороне, Кинздмараули и Напареули
    — на дальней, а грузинский способ виноделия в квеври с 2013 года входит в список нематериального наследия
    ЮНЕСКО. Укрытая горами с трёх сторон, долина обладает самым мягким климатом восточного Южного Кавказа.
    Больше всего виноградари боятся града: он выпадает нечасто, но градины бывают крупными.


    Лучшие виды открываются со стен Сигнахи, с дороги, спускающейся с Гомбори к Телави, и со стороны Кварели,
    где виноградники подступают к самым горам. Сверху долина — пейзаж; спуститесь в неё — и она станет
    застольем.
  tip: >-
    Отнеситесь к долине как к целодневному кольцевому маршруту, а не к одной остановке: Телави, Цинандали,
    Кварели, Сигнахи. Виды бесплатны и никогда не закрываются. Свет лучше всего ранним утром и на закате;
    летними днями над равниной оседает дымка, а зимой и поздней осенью воздух самый чистый. Дегустации
    на винодельнях бронируйте заранее и следите, чтобы водитель оставался трезвым, поскольку полицейские
    проверки на кахетинских дорогах — обычное дело. Во время сентябрьско-октябрьского сбора урожая отели
    в Телави и Сигнахи заполняются рано.
  route: >-
    Из Тбилиси ведут две дороги. Короче та, что через Гомборский перевал (Sh38): по Кахетинской трассе
    (S5) до Вазиани, затем подъём через перевал к Телави. Это около 90 км и час сорок минут, дорога извилистая,
    но с хорошим покрытием, хотя зимой возможен снег. Альтернатива — ехать дальше по Кахетинской трассе
    (S5) через Сагареджо и Бакурцихе: длиннее, но ровнее, и лучший выбор для Сигнахи или Гурджаани. Заправиться
    можно в Сагареджо, Телави и Гурджаани. Основные дороги долины асфальтированы, машина эконом-класса
    легко справится; лишь некоторые проезды между виноградниками — гравийные.
fa:
  name: دره‌ی آلازانی
  short: >-
    گودالی سبز و کشیده از تاکستان‌ها میان گومبوری و قفقاز: آلازونیوس در نوشته‌های استرابون، هرتی سده‌های
    میانه، و قلب شراب گرجی.
  body: >-
    **در بامدادی صاف بر دیوارهای سیغناغی بایستید و همهٔ کاختی زیر پایتان گشوده می‌شود: گودالی سبز و کشیده
    از تاکستان‌ها، و پس‌پشتش دیوار سپید قفقاز بزرگ.**


    دشت آلازانی نزدیک به ۱۶۰ کیلومتر در گرجستان و سپس در آذربایجان کشیده می‌شود، از جنوب‌غرب با رشته‌کوه
    گومبوری و از شمال‌شرق با قفقاز محصور شده، در ارتفاع ۲۰۰ تا ۴۷۰ متری. در میانهٔ آن رود آلازانی پیچ‌وتاب
    می‌خورد؛ زمستان تقریباً خشک می‌شود و بهار با آب‌شدن برف کوهستان از کناره‌ها بیرون می‌ریزد. گرجی‌ها
    به دو کناره دو نام می‌دهند: تسینامخاری، کناره‌ی نزدیک زیر گومبوری، و گاغمامخاری، کناره‌ی دور زیر قفقاز.


    این زمینی کهن است. استرابون و پلینی رود را آلازونیوس می‌شناختند، و شاید همان آباس باشد که در کنار
    آن سپاهیان پومپیوس در سال ۶۵ پیش از میلاد با آلبانی‌های قفقاز جنگیدند. در سده‌های میانه، سوی گرجی
    این دره ایالت هرتی بود، و از سدهٔ یازدهم بخشی از پادشاهی کاختی شد. یورش‌های شاه عباس در اوایل سدهٔ
    هفدهم اسلام را به کناره‌های شرقی آن آورد، و دره‌ی گسترده‌تر، در دو سوی مرز، هنوز میان گرجی‌ها و آذربایجانی‌ها،
    اینگیلوها، آوارها، تساخورها و اودی‌ها تقسیم می‌شود.


    اما پیش از هر چیز، این‌جا سرزمین شراب است. تسیناندالی و موکوزانی در کناره‌ی نزدیک، کیندزماراولی و
    ناپارئولی در کناره‌ی دور می‌ایستند، و شیوه‌ی گرجی شراب‌سازی در کووِری از سال ۲۰۱۳ در فهرست میراث ناملموس
    یونسکو ثبت شده است. دره که از سه سو در پناه کوه‌هاست، ملایم‌ترین آب‌وهوای جنوب قفقاز شرقی را دارد.
    باغداران بیش از هر چیز از تگرگ می‌ترسند: این‌جا کم می‌بارد، اما وقتی می‌بارد، دانه‌هایش بزرگ‌اند.


    بهترین چشم‌اندازها از دیوارهای سیغناغی، از راه سرازیر از گومبوری به‌سوی تلاوی، و از سوی کوارلی، جایی
    که تاک‌ها تا خودِ کوه‌ها می‌روند، دیده می‌شود. از بالا، دره منظره‌ای است؛ به درونش که برانید، سفره‌ای
    می‌شود.
  tip: >-
    دره را چون حلقه‌ای تمام‌روزه در نظر بگیرید، نه یک توقف تنها: تلاوی، تسیناندالی، کوارلی، سیغناغی. چشم‌اندازها
    رایگان‌اند و هرگز بسته نمی‌شوند. بهترین نور در بامداد زود و هنگام غروب است؛ در بعدازظهرهای تابستان
    مهی روی دشت می‌نشیند، و هوا در زمستان و اواخر پاییز پاک‌ترین است. چشیدن شراب در شراب‌سازی‌ها را پیش‌تر
    رزرو کنید و مراقب باشید راننده‌تان هشیار بماند، چون بازرسی پلیس در راه‌های کاختی معمول است. در فصل
    برداشت انگور، سپتامبر تا اکتبر، هتل‌های تلاوی و سیغناغی زود پُر می‌شوند.
  route: >-
    از تفلیس دو راه به این‌جا می‌رسد. کوتاه‌ترش از گذرگاه گومبوری (Sh38) می‌گذرد: بزرگراه کاختی (S5) را
    تا وازیانی بگیرید، سپس از گذرگاه بالا بروید تا تلاوی. این حدود ۹۰ کیلومتر و یک ساعت و چهل دقیقه است،
    پرپیچ‌وخم اما با آسفالت خوب، هرچند در زمستان احتمال برف هست. راه دیگر ماندن بر بزرگراه کاختی (S5)
    از راه ساگارِجو و باکورتسیخه است: طولانی‌تر اما هموارتر، و انتخاب بهتر برای سیغناغی یا گورجانی. سوخت‌گیری
    در ساگارِجو، تلاوی و گورجانی ممکن است. راه‌های اصلی دره آسفالته‌اند و خودروی اقتصادی به‌آسانی از پس
    آن‌ها برمی‌آید؛ تنها برخی راه‌های فرعی میان تاکستان‌ها شنی‌اند.
he:
  name: עמק אלזני
  short: 'שוקת ירוקה וארוכה של כרמים בין גומבורי לקווקז: האלזוניוס של סטרבון, הרתי מימי הביניים, ולב היין
    הגאורגי.'
  body: >-
    **עמדו על חומות סיגנאגי בבוקר צלול, וכל קאחתי נפתחת מתחתיכם: שוקת ירוקה וארוכה של כרמים, ומעֵבר לה
    החומה הלבנה של הקווקז הגדול.**


    מישור האלזני נמשך כ-160 ק"מ בגאורגיה וממשיך לתוך אזרבייג'ן, סגור בין רכס גומבורי בדרום־מערב לקווקז
    בצפון־מזרח, בגובה 200 עד 470 מטר. במרכזו מתפתל האלזני, שמצטמק כמעט לאפס בחורף ומציף את גדותיו באביב
    כשהשלג ההררי נמס. הגאורגים נותנים לשני הצדדים שני שמות: צינמחארי, הצד הקרוב תחת גומבורי, וגחמאמחארי,
    הצד המרוחק תחת הקווקז.


    זו קרקע עתיקה. סטרבון ופליניוס הכירו את הנהר כאלזוניוס, ואולי הוא האבאס, שעל גדותיו נלחמו לגיונות
    פומפיוס באלבנים הקווקזיים ב-65 לפנה"ס. בימי הביניים היה הצד הגאורגי מחוז הרתי, ומהמאה ה-11 חלק מממלכת
    קאחתי. פשיטות השאה עבאס בתחילת המאה ה-17 הביאו את האסלאם לגבולותיו המזרחיים, והעמק הרחב יותר, בשני
    צדי הגבול, עדיין משותף לגאורגים ולאזרבייג'נים, לאינגילויים, לאווארים, לצחורים ולאודים.


    אבל מעל הכול, זו ארץ יין. צינאנדלי ומוקוזני שוכנות בצד הקרוב, קינדזמראולי ונפאראולי בצד המרוחק, ושיטת
    הקוורי הגאורגית נמצאת ברשימת המורשת הבלתי־מוחשית של אונסק"ו מאז 2013. מכיוון שהוא מוגן בהרים משלושה
    צדדים, נהנה העמק מהאקלים המתון ביותר בדרום הקווקז המזרחי. יותר מכול חוששים מגדלי הכרמים מברד: הוא
    לא יורד כאן לעתים קרובות, אבל כשהוא יורד, אבני הברד גדולות.


    הנופים היפים ביותר נראים מחומות סיגנאגי, מהכביש היורד מגומבורי לעבר טלאווי, ומצד קוורלי, שם הכרמים
    מגיעים ממש עד ההרים. מלמעלה העמק הוא נוף; רדו אליו, והוא נעשה שולחן ערוך.
  tip: >-
    התייחסו לעמק כאל מסלול מעגלי של יום שלם ולא כתחנה אחת: טלאווי, צינאנדלי, קוורלי, סיגנאגי. הנופים חינם
    ואף פעם לא נסגרים. האור הטוב ביותר הוא בבוקר מוקדם ובשקיעה; בשעות אחר הצהריים בקיץ שוכן אובך על המישור,
    והאוויר הצלול ביותר בחורף ובסתיו המאוחר. הזמינו טעימות יין מראש ודאגו שהנהג יישאר פיכח, כי בדיקות
    משטרה בכבישי קאחתי שכיחות. בזמן הבציר בספטמבר-אוקטובר, המלונות בטלאווי ובסיגנאגי מתמלאים מוקדם.
  route: >-
    מטביליסי יוצאות שתי דרכים. הקצרה חוצה את מעבר גומבורי (Sh38): קחו את כביש קאחתי (S5) עד ואזיאני, ואז
    טפסו דרך המעבר לטלאווי. זה כ-90 ק"מ ושעה וארבעים דקות, מתפתל אך סלול היטב, אם כי בחורף ייתכן שלג.
    החלופה היא להישאר על כביש קאחתי (S5) דרך סגרג'ו ובקורציחה: ארוכה יותר אך מישורית, והבחירה הטובה יותר
    לסיגנאגי או לגורג'אני. יש דלק בסגרג'ו, בטלאווי ובגורג'אני. הכבישים הראשיים בעמק סלולים, ורכב חסכוני
    מתמודד בקלות; רק כמה שבילים בין הכרמים הם חצץ.
ar:
  name: وادي ألازاني
  short: >-
    حوض أخضر طويل من الكروم بين غومبوري والقوقاز: ألازونيوس عند سترابون، وهيريتي في العصور الوسطى، وقلب
    النبيذ الجورجي.
  body: >-
    **قِف على أسوار سيغناغي في صباح صافٍ، وتنفتح كاختي كلها تحتك: حوض أخضر طويل من الكروم، وخلفه الجدار
    الأبيض لجبال القوقاز الكبرى.**


    يمتد سهل ألازاني نحو 160 كم في جورجيا ثم في أذربيجان، محصورًا بين سلسلة غومبوري جنوب غربًا والقوقاز
    شمال شرقًا، على ارتفاع بين 200 و470 مترًا. في وسطه يتعرّج نهر ألازاني، الذي يتقلص إلى ما يقارب العدم
    شتاءً ويفيض على ضفتيه ربيعًا مع ذوبان ثلوج الجبال. ويسمّي الجورجيون الجانبين باسمين: تسينامخاري، الجانب
    القريب تحت غومبوري، وغاغمامخاري، الجانب البعيد تحت القوقاز.


    هذه أرض قديمة. عرف سترابون وبليني النهر باسم ألازونيوس، وقد يكون هو نهر الأباس الذي حاربت على ضفافه
    جيوش بومبيوس الألبان القوقازيين عام 65 قبل الميلاد. في العصور الوسطى كان الجانب الجورجي مقاطعة هيريتي،
    وأصبح من القرن الحادي عشر جزءًا من مملكة كاختي. جلبت غزوات الشاه عباس في أوائل القرن السابع عشر الإسلام
    إلى أطرافه الشرقية، ولا يزال الوادي الأوسع، على جانبي الحدود، مشتركًا بين الجورجيين والأذربيجانيين
    والإنغيلويين والأفاريين والتساخوريين والأوديين.


    لكن قبل كل شيء، هذه أرض النبيذ. تقع تسيناندالي وموكوزاني على الجانب القريب، وكيندزماراولي ونابارئولي
    على الجانب البعيد، وطريقة الكفيفري الجورجية مُدرجة على قائمة التراث اللامادي لليونسكو منذ 2013. ولأن
    الجبال تحميه من ثلاث جهات، يتمتع الوادي بأعدل مناخ في جنوب القوقاز الشرقي. وأكثر ما يخشاه مزارعوه
    البرَد: لا يتساقط هنا كثيرًا، ولكن حين يتساقط تكون حباته كبيرة.


    أجمل المشاهد تُرى من أسوار سيغناغي، ومن الطريق النازل من غومبوري نحو تيلافي، ومن جانب كفاريلي، حيث
    تصعد الكروم حتى الجبال نفسها. من الأعلى يبدو الوادي مشهدًا؛ فإذا نزلت إليه صار مائدة.
  tip: >-
    خطّط لزيارة الوادي كجولة دائرية ليوم كامل لا كمحطة واحدة: تيلافي، تسيناندالي، كفاريلي، سيغناغي. المشاهد
    مجانية ولا تُغلق أبدًا. الضوء أفضل في الصباح الباكر وعند الغروب؛ وفي بعد ظهر الصيف يخيّم ضباب خفيف
    على السهل، والهواء أصفى في الشتاء وأواخر الخريف. احجز تذوق النبيذ في معاصر النبيذ مسبقًا واحرص على
    أن يبقى السائق صاحيًا، فتفتيش الشرطة على طرق كاختي أمر معتاد. خلال قطاف سبتمبر-أكتوبر، تمتلئ فنادق
    تيلافي وسيغناغي مبكرًا.
  route: >-
    من تبليسي يخرج طريقان. الأقصر يعبر ممر غومبوري (Sh38): خذ طريق كاختي السريع (S5) إلى فازياني، ثم اصعد
    عبر الممر إلى تيلافي. المسافة نحو 90 كم وساعةٍ وأربعين دقيقة، متعرج لكنه مُعبَّد جيدًا، مع إمكانية
    الثلج شتاءً. البديل هو البقاء على طريق كاختي السريع (S5) عبر ساغاريجو وباكورتسيخه: أطول لكنه مستوٍ،
    والخيار الأفضل نحو سيغناغي أو غورجاني. يتوفر الوقود في ساغاريجو وتيلافي وغورجاني. الطرق الرئيسية في
    الوادي مُعبَّدة، وتتعامل معها سيارة اقتصادية بسهولة؛ ولا تكون حصوية إلا بعض الدروب بين الكروم.
