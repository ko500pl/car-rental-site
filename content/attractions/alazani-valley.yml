ka:
  name: ალაზნის ველი
  short: კახეთის კლასიკური პანორამა — ვენახებით სავსე ვაკე გომბორის ქედსა და კავკასიონს შორის, საქართველოს
    ღვინის გული.
  body: >-
    **ალაზნის ველი ის ხედია, რომელიც კახეთს კახეთად აქცევს.** დაახლოებით 200 კილომეტრზე გაწოლილი, 20–40
    კილომეტრის სიგანის ვაკე ორ კედელს შორის დევს: სამხრეთ-დასავლეთიდან გომბორის ქედი საზღვრავს, ჩრდილო-აღმოსავლეთიდან
    კი კავკასიონის თოვლიანი მწვერვალები აღიმართება. შუაში მდინარე ალაზანი მიედინება, რომლის სახელიც მთელმა
    რეგიონმა შეითვისა.


    ეს საქართველოს ღვინის გულია — აქ იწურება ქართული ყურძნის დიდი ნაწილი, აქვეა წინანდლის, მუკუზნის, ქინძმარაულისა
    და ნაფარეულის მიკროზონები, ქვევრის ღვინის დაყენების მეთოდი კი 2013 წლიდან იუნესკოს არამატერიალური
    მემკვიდრეობის სიაშია.


    საუკეთესო სათვალთვალო წერტილები:


    - **სიღნაღის ტერასები და გალავანი** — ველი ფეხქვეშ, კავკასიონი ჰორიზონტზე

    - **გომბორის უღელტეხილიდან დაშვება** თელავისკენ — პირველი დიდი პანორამა

    - **ყვარლისა და ნაფარეულის მხარე**, სადაც ვენახები პირდაპირ მთებს ეყრდნობა


    სექტემბერ-ოქტომბერში ველი რთველით ცოცხლდება, გაზაფხულზე ხასხასა მწვანეა, ზამთარში კი ჰაერი ისე სუფთაა,
    რომ კავკასიონი ხელისგულზე ჩანს.
  tip: >-
    ველი დანიშნულების წერტილი კი არა, მთელი დღის მარშრუტია — დაგეგმე წრე: თელავი, წინანდალი, ყვარელი,
    სიღნაღი. ხედები უფასოა და საათობრივი შეზღუდვა არ არსებობს; საუკეთესო შუქი დილით და მზის ჩასვლისასაა.
    მარნებში დეგუსტაცია წინასწარ დაჯავშნე და მძღოლს ღვინო არ დაალევინო — გზაზე პოლიცია ხშირად ამოწმებს.
    სექტემბერში, რთველისას, სასტუმროები ადრე ივსება.
  route: >-
    თბილისიდან ორი გზა მიდის: უმოკლესი გომბორის უღელტეხილია — 90 კმ თელავამდე, დაახლოებით საათი და ორმოცი
    წუთი, სერპანტინიანი, მაგრამ კარგი ასფალტით. მეორე ვარიანტია კახეთის გზატკეცილი საგარეჯო-გურჯაანის
    გავლით — გრძელია, მაგრამ ბრტყელი, სიღნაღისკენ მიმავალს ეს გირჩევნია. საწვავი საგარეჯოში, თელავში ან
    გურჯაანში აიღე. ველის ძირითადი გზები ასფალტიანია და ეკონომ-კლასის ავტომობილი მშვენივრად ივლის; მხოლოდ
    ვენახებს შორის ჩამავალი შესახვევებია ხანდახან მოხრეშილი.
en:
  name: Alazani Valley
  short: >-
    The classic Kakheti panorama — a river plain of vineyards between the Gombori range and the Caucasus,
    the heart of Georgian wine.
  body: >-
    **The Alazani Valley is the view that makes Kakheti Kakheti.** Stretching for roughly 200 km and 20–40
    km across, the plain lies between two walls: the Gombori range closes it off to the southwest, while
    the snow peaks of the Greater Caucasus rise along the northeast. Down the middle runs the Alazani
    river, which lent its name to the whole region — and to half the wine labels in Georgia.


    This is the country's wine heartland. A large share of Georgia's grapes is pressed here, the Tsinandali,
    Mukuzani, Kindzmarauli and Napareuli appellations all sit on the valley floor and its slopes, and
    the qvevri method of fermenting wine in buried clay vessels has been on UNESCO's intangible heritage
    list since 2013.


    The best vantage points:


    - **Sighnaghi's terraces and town walls** — the valley at your feet, the Caucasus on the horizon

    - **The descent from the Gombori pass** towards Telavi — the first big panorama

    - **The Kvareli and Napareuli side**, where vineyards lean straight against the mountains


    In September and October the valley comes alive with the rtveli harvest; spring turns it vivid green,
    and in winter the air is so clear the Caucasus feels within arm's reach.
  tip: >-
    Treat the valley as a full-day loop rather than a single stop: Telavi, Tsinandali, Kvareli, Sighnaghi.
    The views are free with no opening hours; the light is best early morning and at sunset. Book winery
    tastings ahead, and keep your driver dry — police checks on the Kakheti roads are routine. During
    the September harvest, hotels in Telavi and Sighnaghi fill up early.
  route: >-
    Two roads lead from Tbilisi. The shortest is over the Gombori pass — 90 km to Telavi, about an hour
    and forty minutes, a winding but well-surfaced climb. The alternative is the Kakheti highway via Sagarejo
    and Gurjaani — longer but flat, and the better choice if you are heading for Sighnaghi. Refuel in
    Sagarejo, Telavi or Gurjaani. The valley's main roads are all asphalt and an economy car handles them
    easily; only some side lanes between vineyards are gravel.
ru:
  name: Алазанская долина
  short: >-
    Классическая панорама Кахетии — равнина виноградников между Гомборским хребтом и Кавказом, сердце
    грузинского вина.
  body: >-
    **Алазанская долина — тот самый вид, который делает Кахетию Кахетией.** Равнина длиной около 200 км
    и шириной 20–40 км лежит между двумя стенами: с юго-запада её замыкает Гомборский хребет, с северо-востока
    поднимаются снежные вершины Большого Кавказа. Посередине течёт река Алазани, давшая имя всему региону
    — и половине винных этикеток Грузии.


    Это винное сердце страны. Здесь давят значительную часть грузинского винограда, на дне долины и её
    склонах лежат аппелласьоны Цинандали, Мукузани, Киндзмараули и Напареули, а квеври — метод брожения
    вина в зарытых глиняных сосудах — с 2013 года входит в список нематериального наследия ЮНЕСКО.


    Лучшие смотровые точки:


    - **Террасы и крепостные стены Сигнахи** — долина под ногами, Кавказ на горизонте

    - **Спуск с Гомборского перевала** к Телави — первая большая панорама

    - **Сторона Кварели и Напареули**, где виноградники упираются прямо в горы


    В сентябре-октябре долина оживает сбором урожая ртвели, весной она ярко-зелёная, а зимой воздух так
    прозрачен, что Кавказ кажется на расстоянии вытянутой руки.
  tip: >-
    Воспринимайте долину как маршрут на целый день, а не одну остановку: Телави, Цинандали, Кварели, Сигнахи.
    Виды бесплатны и без расписания; лучший свет — рано утром и на закате. Дегустации на винодельнях бронируйте
    заранее, а водителю вина не наливайте — полиция на кахетинских дорогах проверяет регулярно. В сентябре,
    в сезон ртвели, гостиницы в Телави и Сигнахи заполняются рано.
  route: >-
    Из Тбилиси ведут две дороги. Кратчайшая — через Гомборский перевал: 90 км до Телави, примерно час
    сорок, серпантин с хорошим асфальтом. Альтернатива — Кахетинская трасса через Сагареджо и Гурджаани:
    длиннее, но ровная, и лучше подходит, если едете в Сигнахи. Заправляйтесь в Сагареджо, Телави или
    Гурджаани. Основные дороги долины асфальтированы, машина эконом-класса справляется легко; гравий встречается
    только на просёлках между виноградниками.
fa:
  name: درهٔ آلازانی
  short: پانورامای کلاسیک کاختی — دشتی از تاکستان‌ها میان رشته‌کوه گمبوری و قفقاز، قلب شراب گرجستان.
  body: >-
    **درهٔ آلازانی همان منظره‌ای است که کاختی را کاختی می‌کند.** این دشت با حدود 200 کیلومتر طول و 20
    تا 40 کیلومتر عرض میان دو دیوار خوابیده است: از جنوب غرب رشته‌کوه گمبوری آن را می‌بندد و از شمال شرق
    قله‌های برفی قفقاز بزرگ سر برمی‌آورند. در میانه رود آلازانی جاری است که نامش را به کل منطقه — و نیمی
    از برچسب‌های شراب گرجستان — داده است.


    اینجا قلب شراب کشور است. بخش بزرگی از انگور گرجستان همین‌جا فشرده می‌شود؛ مناطق ثبت‌شدهٔ تسیناندالی،
    موکوزانی، کیندزمارائولی و ناپارئولی در کف دره و دامنه‌هایش قرار دارند و روش «کوِوری» — تخمیر شراب
    در خمره‌های سفالی مدفون — از 2013 در فهرست میراث ناملموس یونسکو است.


    بهترین نقاط تماشا:


    - **تراس‌ها و باروی سیغناغی** — دره زیر پا، قفقاز در افق

    - **سرازیری گردنهٔ گمبوری** به سوی تلاوی — نخستین پانورامای بزرگ

    - **سمت کواره‌لی و ناپارئولی**، جایی که تاکستان‌ها مستقیم به کوه تکیه داده‌اند


    در سپتامبر و اکتبر دره با برداشت انگور «رتوِلی» جان می‌گیرد، بهار سبزِ سبز است و در زمستان هوا چنان
    شفاف است که قفقاز در دسترس به نظر می‌رسد.
  tip: >-
    دره را یک مسیر یک‌روزه ببینید نه یک توقف: تلاوی، تسیناندالی، کواره‌لی، سیغناغی. مناظر رایگان‌اند و
    ساعت کاری ندارند؛ بهترین نور صبح زود و غروب است. تست شراب را از پیش رزرو کنید و راننده نباید بنوشد
    — پلیس در جاده‌های کاختی مرتب کنترل می‌کند. در سپتامبر، فصل برداشت، هتل‌های تلاوی و سیغناغی زود پر
    می‌شوند.
  route: >-
    از تفلیس دو راه هست. کوتاه‌ترین از گردنهٔ گمبوری است: 90 کیلومتر تا تلاوی، حدود یک ساعت و چهل دقیقه،
    پرپیچ اما با آسفالت خوب. راه دیگر بزرگراه کاختی از ساگارجو و گورجاآنی است — درازتر ولی هموار، و برای
    سیغناغی گزینهٔ بهتر. در ساگارجو، تلاوی یا گورجاآنی سوخت بزنید. جاده‌های اصلی دره همه آسفالت‌اند و
    خودروی اقتصادی به‌راحتی از پس‌شان برمی‌آید؛ فقط برخی راه‌های فرعی میان تاکستان‌ها شنی است.
he:
  name: עמק אלזאני
  short: הפנורמה הקלאסית של קחתי — מישור כרמים בין רכס גומבורי לקווקז, לב היין הגאורגי.
  body: >-
    **עמק אלזאני הוא הנוף שהופך את קחתי לקחתי.** המישור, שאורכו כ-200 ק״מ ורוחבו 20–40 ק״מ, שוכן בין שתי
    חומות: מדרום-מערב סוגר עליו רכס גומבורי, ומצפון-מזרח מתרוממות פסגות השלג של הקווקז הגדול. במרכזו זורם
    נהר אלזאני, שהעניק את שמו לאזור כולו — ולמחצית מתוויות היין של גאורגיה.


    זהו לב היין של המדינה. חלק גדול מהענבים של גאורגיה נסחט כאן; אזורי היין צינאנדלי, מוקוזאני, קינדזמראולי
    ונפראולי שוכנים בקרקעית העמק ובמדרונותיו, ושיטת הקוורי — תסיסת יין בכדי חרס קבורים — נמצאת ברשימת
    המורשת הלא-חומרית של אונסק"ו מאז 2013.


    נקודות התצפית הטובות ביותר:


    - **הטרסות והחומות של סיגנאגי** — העמק לרגליכם, הקווקז באופק

    - **הירידה ממעבר גומבורי** לכיוון טלאווי — הפנורמה הגדולה הראשונה

    - **הצד של קווארלי ונפראולי**, שם הכרמים נשענים היישר על ההרים


    בספטמבר-אוקטובר העמק מתעורר עם בציר הרטוולי; באביב הוא ירוק עז, ובחורף האוויר צלול עד שהקווקז נראה
    במרחק נגיעה.
  tip: >-
    התייחסו לעמק כאל מסלול של יום שלם ולא כתחנה אחת: טלאווי, צינאנדלי, קווארלי, סיגנאגי. הנופים חינם ובלי
    שעות פתיחה; האור הכי יפה בבוקר מוקדם ובשקיעה. הזמינו טעימות ביקבים מראש, והנהג לא שותה — משטרת התנועה
    בכבישי קחתי בודקת באופן שגרתי. בספטמבר, בעונת הבציר, המלונות בטלאווי ובסיגנאגי מתמלאים מוקדם.
  route: >-
    מטביליסי מובילות שתי דרכים. הקצרה עוברת במעבר גומבורי: 90 ק״מ עד טלאווי, כשעה וארבעים דקות, דרך מתפתלת
    עם אספלט טוב. החלופה היא כביש קחתי דרך סגרג'ו וגורג'אני — ארוכה יותר אבל שטוחה, ועדיפה למי שנוסע לסיגנאגי.
    תדלקו בסגרג'ו, בטלאווי או בגורג'אני. הכבישים הראשיים בעמק סלולים כולם ורכב חסכוני מסתדר בקלות; רק
    דרכים צדדיות בין הכרמים הן לעיתים חצץ.
ar:
  name: وادي ألازاني
  short: بانوراما كاخيتي الكلاسيكية — سهل من الكروم بين سلسلة غومبوري والقوقاز، قلب النبيذ الجورجي.
  body: >-
    **وادي ألازاني هو المشهد الذي يجعل كاخيتي كاخيتي.** يمتد السهل نحو 200 كيلومتر بعرض 20 إلى 40 كيلومتراً
    بين جدارين: من الجنوب الغربي تغلقه سلسلة غومبوري، ومن الشمال الشرقي ترتفع قمم القوقاز الكبرى المثلجة.
    وفي الوسط يجري نهر ألازاني الذي أعطى اسمه للمنطقة كلها — ولنصف ملصقات النبيذ في جورجيا.


    هذا قلب النبيذ في البلاد. هنا يُعصر جزء كبير من عنب جورجيا، وفي قاع الوادي وسفوحه تقع مناطق تسيناندالي
    وموكوزاني وكيندزمارائولي ونابارئولي المسجلة، وطريقة «الكفيفري» — تخمير النبيذ في جرار فخارية مدفونة
    — مدرجة في قائمة اليونسكو للتراث غير المادي منذ 2013.


    أفضل نقاط المشاهدة:


    - **شرفات سيغناغي وأسوارها** — الوادي تحت قدميك والقوقاز في الأفق

    - **المنحدر من ممر غومبوري** نحو تيلافي — أول بانوراما كبرى

    - **جهة كفاريلي ونابارئولي**، حيث تستند الكروم مباشرة إلى الجبال


    في سبتمبر وأكتوبر يدبّ الحياة في الوادي مع قطاف «رتفيلي»، وفي الربيع يكتسي أخضر ساطعاً، وفي الشتاء
    يصفو الهواء حتى يبدو القوقاز على مدّ اليد.
  tip: >-
    تعامل مع الوادي كجولة يوم كامل لا كمحطة واحدة: تيلافي، تسيناندالي، كفاريلي، سيغناغي. المناظر مجانية
    وبلا مواعيد؛ وأجمل الضوء في الصباح الباكر وعند الغروب. احجز جلسات التذوق مسبقاً، ولا تدع السائق يشرب
    — فدوريات الشرطة على طرق كاخيتي منتظمة. وفي سبتمبر، موسم القطاف، تمتلئ فنادق تيلافي وسيغناغي مبكراً.
  route: >-
    من تبليسي طريقان. الأقصر عبر ممر غومبوري: 90 كم إلى تيلافي في نحو ساعة وأربعين دقيقة، طريق متعرج بأسفلت
    جيد. والبديل طريق كاخيتي السريع عبر ساغاريجو وغورجاني — أطول لكنه مستوٍ، وهو الأفضل لمن يقصد سيغناغي.
    تزود بالوقود في ساغاريجو أو تيلافي أو غورجاني. الطرق الرئيسية في الوادي معبّدة كلها وسيارة اقتصادية
    تكفي تماماً؛ الحصى فقط في بعض الطرق الجانبية بين الكروم.
