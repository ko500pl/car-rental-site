ka:
  name: ჭიათურის საბაგიროები
  short: მანგანუმის მაღაროების ქალაქი ყვირილას ვიწრო ხეობაში, სადაც საბაგირო ლიფტის ფუნქციას ასრულებს.
  body: >-
    **ჭიათურა ერთადერთი ქალაქია საქართველოში, სადაც საზოგადოებრივი ტრანსპორტი ვერტიკალურად მოძრაობს.**
    ქალაქი ყვირილას კანიონშია ჩამჯდარი, კედლები ას-ორასი მეტრით ეშვება და საცხოვრებელი უბნები ზემოთ, პლატოებზეა
    — ფეხით ასვლა ნახევარი საათია, საბაგიროთი ორი წუთი.


    ყველაფერი მანგანუმით დაიწყო. 1879 წელს პოეტმა აკაკი წერეთელმა აქაური მადნის სამრეწველო მნიშვნელობა
    გამოაქვეყნა; ოცდახუთ წელიწადში ჭიათურა მსოფლიო მანგანუმის წარმოების დაახლოებით 60 პროცენტს იძლეოდა.
    მაღაროები დღემდე მუშაობს და ხეობის კედლებზე ტრანსპორტიორები, ბუნკერები და ნაყარი მთები ჩანს.


    საბაგირო ქსელი 1954 წელს გაიხსნა — მუშების მაღაროებამდე ატანა სხვაგვარად შეუძლებელი იყო. ჩამოყალიბდა
    17 ხაზი, რომლებიც თითქმის ორმოცდაათი წელი თავდაპირველი მოწყობილობით მუშაობდა. 2017 წლიდან სახელმწიფომ
    სისტემის ჩანაცვლება დაიწყო: ცენტრალური ოთხხაზიანი კვანძი 2021 წლის სექტემბერში ამოქმედდა, კიდევ ერთი
    ხაზი 2025 წლის დასაწყისში დაემატა, ნაწილი კი ჯერ კიდევ დახურულია. ძველი, კვადრატული კაბინები აღარ
    დადის; ზოგიერთი ისტორიული სადგური შენარჩუნებას ექვემდებარება.


    რას ნახავ დღეს:


    - მოქმედი ახალი კაბინები, უფასო, ქალაქის ცენტრიდან ზემო უბნებამდე


    - მიტოვებული სადგურები — ბეტონის კოშკები, დაჟანგული მექანიზმები, გატეხილი ფანჯრები


    - 1950-იანების საბჭოთა ცენტრი: თეატრი, პარკი, სტადიონი კანიონის ფსკერზე


    ჭიათურა ლამაზი ქალაქი არ არის და არც თავს აჩვენებს ასეთად. ის საინტერესოა როგორც ინდუსტრიული ლანდშაფტი
    და როგორც ადგილი, სადაც საბჭოთა საინჟინრო გადაწყვეტა ჯერ კიდევ ყოველდღიურ საჭიროებას ემსახურება.


    ადგილობრივისთვის ეს გასართობი კი არა, ტრანსპორტია. კაბინები თავიდანვე უფასო იყო და დღემდე უფასოა;
    ხალხი მათით მაღაზიაში, სკოლაში და სასაფლაოზე დადის. ძველ სისტემას აქ ჯერ კიდევ „სტალინის საბაგიროს“
    ეძახიან, რადგან ის მისი მმართველობის ბოლო წლების ჩანაფიქრი იყო — და 2021 წლამდე მართლაც შეგეძლო 1950-იან
    წლებში მოჭედილი კაბინით გემგზავრა.
  tip: >-
    სამი საათი ქალაქისთვის და საბაგიროებისთვის საკმარისია. მგზავრობა უფასოა, კაბინები პატარაა და პიკის
    საათებში ადგილობრივებით ივსება — ფოტოსთვის უკეთესია შუადღე. მიტოვებულ სადგურებში შესვლა სახიფათოა:
    იატაკი ჩაცვენილია, ბაგირები დაძაბულია. კაფეები და მაღაზიები ცენტრალურ მოედანთანაა, ტუალეტი — თეატრთან.
    ღრმა ხეობის გამო ზამთარში მზე გვიან შემოდის და მთელი დღე ნესტიანია. მაღაროს ტერიტორიაზე შესვლა აკრძალულია.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე (დაახლოებით 180 კმ), შემდეგ ჩრდილოეთით ყვირილას ხეობით ჭიათურისკენ
    — კიდევ 35 კმ. სულ 215 კმ, დაახლოებით სამი საათი და ათი წუთი. მთელი მარშრუტი ასფალტიანია; ზესტაფონის
    შემდეგ გზა ვიწროვდება, ბევრი მოსახვევი და დატვირთული სატვირთოებია. საწვავი ზესტაფონში აიღე. ცენტრში
    მოედანთან უფასოდ დგახარ. კაცხის სვეტი იმავე გზაზეა, ქალაქამდე 10 კმ-ით ადრე. ეკონომ-კლასი საკმარისია.
en:
  name: Chiatura Cable Cars
  short: A manganese mining town wedged in the Kvirila gorge, where the public transport system runs vertically.
  body: >-
    **Chiatura is the only town in Georgia where public transport goes up and down rather than along.**
    The town sits in a canyon of the Kvirila, the walls rise a hundred to two hundred metres, and the
    residential districts are on the plateaus above. Walking up takes half an hour; the cable car takes
    two minutes.


    It all began with manganese. In 1879 the poet Akaki Tsereteli publicised the industrial value of the
    local ore, and within twenty-five years Chiatura was producing roughly 60 per cent of the world's
    manganese. The mines still work, and the gorge walls carry conveyors, ore bunkers and grey spoil heaps.


    The ropeway network opened in 1954, because there was no other practical way to get miners to the
    workings. It grew to seventeen lines and ran for nearly fifty years on original equipment. From 2017
    the state began replacing it: a central four-line hub entered service in September 2021, a further
    line was added in early 2025, and some routes remain closed. The old square cabins no longer run,
    and several historic stations are marked for preservation.


    What you actually see today:


    - the new cabins in service, free to ride, from the centre up to the upper districts


    - abandoned stations — concrete towers, rusted winding gear, broken glass


    - a 1950s Soviet town centre on the canyon floor: theatre, park, stadium


    Chiatura is not a pretty town and does not pretend to be. It is worth the detour as an industrial
    landscape, and as a place where a Soviet engineering answer to an awkward geography is still doing
    a daily job.


    For a resident this is not a ride but a commute. The cabins were free from the start and are still
    free, and people use them to reach the shops, the school and the cemetery. The old system is still
    called Stalin's ropeway locally, because it was conceived in the last years of his rule — and until
    2021 you could genuinely travel in a cabin riveted together in the 1950s.
  tip: >-
    Three hours covers the town and a few rides. Travel is free, the cabins are small, and at shift times
    they fill with commuters — midday is easier for photographs. Do not climb into the abandoned stations:
    floors have collapsed and cables are under tension. Cafes and shops are around the central square,
    with toilets by the theatre. Because the gorge is deep, winter sun arrives late and the town stays
    damp all day. Mine sites themselves are closed to visitors.
  route: >-
    Follow the E60 west from Tbilisi to Zestaponi, about 180 km, then turn north up the Kvirila valley
    towards Chiatura, a further 35 km. Total 215 km, roughly three hours ten. The whole route is asphalt;
    after Zestaponi it narrows, with many bends and heavy lorry traffic. Refuel in Zestaponi. In the centre
    you can park free beside the main square. Katskhi Pillar stands on the same road about 10 km before
    town, so the two combine easily. An economy car is enough.
ru:
  name: Канатные дороги Чиатуры
  short: Марганцевый шахтёрский город в ущелье Квирилы, где общественный транспорт ходит по вертикали.
  body: >-
    **Чиатура — единственный город Грузии, где общественный транспорт движется вверх и вниз, а не вдоль.**
    Город лежит в каньоне Квирилы, стены поднимаются на сто-двести метров, а жилые кварталы находятся
    наверху, на плато. Пешком подниматься полчаса, на канатке — две минуты.


    Всё началось с марганца. В 1879 году поэт Акакий Церетели обнародовал промышленное значение здешней
    руды, и через двадцать пять лет Чиатура давала около 60 процентов мировой добычи марганца. Шахты работают
    до сих пор, а по склонам ущелья тянутся конвейеры, бункеры и серые отвалы.


    Сеть канатных дорог открыли в 1954 году: иначе доставить горняков к забоям было невозможно. Она выросла
    до семнадцати линий и почти полвека работала на исходном оборудовании. С 2017 года государство начало
    её замену: центральный узел из четырёх линий заработал в сентябре 2021 года, ещё одна линия добавилась
    в начале 2025-го, часть маршрутов пока закрыта. Старые квадратные кабины больше не ходят, а несколько
    исторических станций решено сохранить.


    Что вы увидите сегодня:


    - новые кабины в работе, бесплатные, из центра в верхние кварталы


    - заброшенные станции: бетонные башни, ржавые лебёдки, выбитые стёкла


    - советский центр 1950-х на дне каньона — театр, парк, стадион


    Чиатура не красивый город и не притворяется им. Сюда стоит свернуть ради индустриального ландшафта
    и ради места, где советское инженерное решение неудобной географии до сих пор делает ежедневную работу.


    Для местного жителя это не аттракцион, а транспорт. Кабины были бесплатными с самого начала и остаются
    бесплатными; на них ездят в магазин, в школу и на кладбище. Старую систему здесь до сих пор называют
    сталинской канаткой, потому что задумана она была в последние годы его правления, — и до 2021 года
    вы действительно могли проехать в кабине, склёпанной в 1950-е.
  tip: >-
    Трёх часов хватает на город и несколько поездок. Проезд бесплатный, кабины маленькие, в пересменку
    их заполняют местные — для съёмки лучше середина дня. В заброшенные станции лазить не надо: перекрытия
    провалены, тросы под натяжением. Кафе и магазины вокруг центральной площади, туалет у театра. Ущелье
    глубокое, поэтому зимой солнце приходит поздно, а сырость держится весь день. На территорию шахт вход
    запрещён.
  route: >-
    Из Тбилиси по E60 до Зестафони, около 180 км, затем на север вверх по долине Квирилы в сторону Чиатуры
    — ещё 35 км. Всего 215 км, примерно три часа десять минут. Вся дорога асфальтированная; после Зестафони
    она сужается, много поворотов и грузовиков. Заправляйтесь в Зестафони. В центре можно бесплатно встать
    у главной площади. Столп Кацхи стоит на той же дороге километрах в десяти до города, так что оба места
    удобно совместить. Достаточно машины эконом-класса.
fa:
  name: تله‌کابین‌های چیاتورا
  short: شهر معدن منگنز در تنگهٔ کویریلا، جایی که حمل‌ونقل عمومی به‌جای افقی، عمودی حرکت می‌کند.
  body: >-
    **چیاتورا تنها شهر گرجستان است که حمل‌ونقل عمومی‌اش بالا و پایین می‌رود، نه در امتداد خیابان.** شهر
    در دره‌ای عمیق بر رود کویریلا نشسته، دیواره‌ها صد تا دویست متر بالا می‌روند و محله‌های مسکونی روی
    فلات‌های بالا قرار دارند. پیاده رفتن نیم ساعت طول می‌کشد؛ با تله‌کابین دو دقیقه.


    همه‌چیز با منگنز آغاز شد. در ۱۸۷۹ شاعر آکاکی تسرِتِلی ارزش صنعتی سنگ معدن این ناحیه را اعلام کرد و
    بیست‌وپنج سال بعد چیاتورا حدود ۶۰ درصد منگنز جهان را تولید می‌کرد. معادن هنوز کار می‌کنند و بر دیواره‌های
    دره نوار نقاله، سیلوهای سنگ و تپه‌های خاکستری باطله دیده می‌شود.


    شبکهٔ تله‌کابین در ۱۹۵۴ گشوده شد، چون راه عملی دیگری برای رساندن کارگران به معادن وجود نداشت. این
    شبکه به هفده خط رسید و نزدیک پنجاه سال با تجهیزات اولیه کار کرد. از ۲۰۱۷ دولت جایگزینی آن را آغاز
    کرد: هستهٔ مرکزی با چهار خط در سپتامبر ۲۰۲۱ به کار افتاد، خطی دیگر در آغاز ۲۰۲۵ افزوده شد و بخشی از
    مسیرها هنوز بسته است. کابین‌های مکعبی قدیمی دیگر حرکت نمی‌کنند و چند ایستگاه تاریخی برای نگهداری علامت‌گذاری
    شده‌اند.


    آنچه امروز می‌بینید:


    - کابین‌های تازه در سرویس، رایگان، از مرکز تا محله‌های بالا


    - ایستگاه‌های متروک: برج‌های بتنی، چرخ‌های زنگ‌زده، شیشه‌های شکسته


    - مرکز شهری دههٔ ۱۹۵۰ در کف دره: تئاتر، پارک، ورزشگاه


    چیاتورا شهر زیبایی نیست و ادعایش را هم ندارد. ارزش انحراف از مسیر را به‌عنوان یک چشم‌انداز صنعتی دارد،
    و به‌عنوان جایی که پاسخ مهندسی شوروی به جغرافیایی دشوار هنوز هر روز کار می‌کند.


    برای اهالی این یک تفریح نیست، رفت‌وآمد روزانه است. کابین‌ها از همان آغاز رایگان بودند و هنوز هم رایگان‌اند؛
    مردم با آن‌ها به مغازه و مدرسه و گورستان می‌روند. سامانهٔ قدیمی را اینجا هنوز «تله‌کابین استالین»
    می‌نامند، چون در واپسین سال‌های حکومت او طرح شد — و تا ۲۰۲۱ می‌شد واقعاً در کابینی نشست که در دههٔ
    ۱۹۵۰ پرچ شده بود.
  tip: >-
    سه ساعت برای شهر و چند سواری کافی است. سفر رایگان است، کابین‌ها کوچک‌اند و در ساعت تعویض شیفت پر از
    اهالی می‌شوند؛ برای عکاسی میانهٔ روز بهتر است. به ایستگاه‌های متروک بالا نروید: کف‌ها فرو ریخته و
    سیم‌ها زیر کشش‌اند. کافه و مغازه گرد میدان مرکزی است و سرویس بهداشتی کنار تئاتر. چون دره عمیق است،
    زمستان آفتاب دیر می‌رسد و رطوبت تمام روز می‌ماند. ورود به محوطهٔ معادن ممنوع است.
  route: >-
    از تفلیس بزرگراه E60 را تا زستافونی بروید، حدود ۱۸۰ کیلومتر، سپس شمال و بالای درهٔ کویریلا به سوی
    چیاتورا، ۳۵ کیلومتر دیگر. روی‌هم ۲۱۵ کیلومتر، نزدیک سه ساعت و ده دقیقه. کل مسیر آسفالت است؛ پس از
    زستافونی باریک می‌شود و پیچ‌های زیاد و کامیون سنگین دارد. سوخت را در زستافونی بگیرید. در مرکز می‌توانید
    کنار میدان اصلی رایگان پارک کنید. ستون کاتسخی روی همین جاده و حدود ۱۰ کیلومتر پیش از شهر است. خودروی
    اقتصادی کافی است.
he:
  name: הרכבלים של צ'יאטורה
  short: עיירת כריית מנגן תחובה בגיא הקווירילה, שבה התחבורה הציבורית נעה במאונך ולא לאורך.
  body: >-
    **צ'יאטורה היא העיירה היחידה בגאורגיה שבה התחבורה הציבורית עולה ויורדת במקום לנסוע לאורך.** העיירה
    יושבת בקניון של נהר קווירילה, הקירות מתרוממים מאה עד מאתיים מטר, ורובעי המגורים נמצאים על הרמות שמעל.
    ההליכה למעלה נמשכת חצי שעה; ברכבל זה שתי דקות.


    הכול התחיל במנגן. ב-1879 פרסם המשורר אקאקי צרתלי את ערכה התעשייתי של העפרה המקומית, וכעבור עשרים וחמש
    שנה סיפקה צ'יאטורה כ-60 אחוז מתפוקת המנגן בעולם. המכרות פועלים עד היום, ועל קירות הגיא נמתחים מסועים,
    ממגורות עפרה וערמות פסולת אפורות.


    רשת הרכבלים נפתחה ב-1954, משום שלא הייתה דרך מעשית אחרת להעלות כורים אל המכרות. היא גדלה לשבעה־עשר
    קווים ופעלה כחמישים שנה על הציוד המקורי. משנת 2017 החלה המדינה להחליף אותה: מוקד מרכזי בן ארבעה קווים
    נכנס לשירות בספטמבר 2021, קו נוסף נוסף בתחילת 2025, וחלק מן המסלולים עדיין סגורים. התאים המרובעים
    הישנים כבר אינם נוסעים, וכמה תחנות היסטוריות סומנו לשימור.


    מה רואים כאן היום:


    - התאים החדשים בשירות, בחינם, מן המרכז אל הרובעים העליונים


    - תחנות נטושות: מגדלי בטון, גלגלי הינע חלודים, זכוכית שבורה


    - מרכז סובייטי משנות החמישים בקרקעית הקניון — תיאטרון, פארק, אצטדיון


    צ'יאטורה אינה עיירה יפה ואינה מתיימרת להיות. כדאי לסטות אליה בזכות הנוף התעשייתי, ובזכות היותה מקום
    שבו פתרון הנדסי סובייטי לגיאוגרפיה קשה עדיין עושה עבודה יומיומית.


    עבור התושבים זו אינה אטרקציה אלא נסיעה יומיומית. התאים היו חינם מן ההתחלה ועודם חינם, ואנשים נוסעים
    בהם אל החנויות, אל בית הספר ואל בית הקברות. את המערכת הישנה עדיין מכנים כאן הרכבל של סטלין, משום שנהגתה
    בשנות שלטונו האחרונות — ועד 2021 אפשר היה באמת לנסוע בתא שנרתך בשנות החמישים.
  tip: >-
    שלוש שעות מספיקות לעיירה ולכמה נסיעות. הנסיעה חינם, התאים קטנים, ובשעות חילופי המשמרת הם מתמלאים בתושבים
    — לצילום עדיפות שעות הצהריים. אל תטפסו לתחנות הנטושות: הרצפות קרסו והכבלים במתח. בתי קפה וחנויות סביב
    הכיכר המרכזית, שירותים ליד התיאטרון. מכיוון שהגיא עמוק, בחורף השמש מגיעה מאוחר והלחות נשארת כל היום.
    הכניסה לשטחי המכרות אסורה.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, כ-180 ק״מ, ואז צפונה במעלה עמק קווירילה לכיוון צ'יאטורה, עוד 35 ק״מ.
    בסך הכול 215 ק״מ, כשלוש שעות ועשר דקות. כל המסלול סלול; אחרי זסטפוני הוא מצטמצם, עם פניות רבות ותנועת
    משאיות כבדה. תדלקו בזסטפוני. במרכז אפשר לחנות בחינם ליד הכיכר הראשית. עמוד קצחי נמצא על אותו כביש
    כעשרה ק״מ לפני העיירה, כך שקל לשלב. רכב חסכוני מספיק.
ar:
  name: تلفريكات تشياتورا
  short: بلدة لتعدين المنغنيز محشورة في وادي كفيريلا الضيق، حيث تسير وسائل النقل العام عمودياً لا أفقياً.
  body: >-
    **تشياتورا هي البلدة الوحيدة في جورجيا التي يصعد فيها النقل العام ويهبط بدل أن يسير على الطول.** تقع
    البلدة في أخدود نهر كفيريلا، وترتفع جدرانه من مئة إلى مئتي متر، بينما تقوم الأحياء السكنية على الهضاب
    فوق. الصعود سيراً يستغرق نصف ساعة، وبالتلفريك دقيقتين.


    بدأ كل شيء بالمنغنيز. في 1879 نشر الشاعر أكاكي تسيريتيلي أهمية الخام المحلي صناعياً، وبعد خمسة وعشرين
    عاماً كانت تشياتورا تنتج نحو 60 في المئة من منغنيز العالم. وما زالت المناجم تعمل، وعلى جدران الوادي
    سيور ناقلة وصوامع خام وتلال رمادية من المخلفات.


    افتُتحت شبكة التلفريك عام 1954 لأنه لم تكن ثمة وسيلة عملية أخرى لإيصال عمال المناجم إلى مواقعهم. ونمت
    الشبكة إلى سبعة عشر خطاً وظلت نحو خمسين عاماً تعمل بمعداتها الأصلية. ومنذ 2017 بدأت الدولة استبدالها:
    دخلت العقدة المركزية بخطوطها الأربعة الخدمة في سبتمبر 2021، وأُضيف خط آخر مطلع 2025، وما زال بعض المسارات
    مغلقاً. لم تعد المقصورات المربعة القديمة تعمل، وقد خُصّصت عدة محطات تاريخية للحفظ.


    ما تراه اليوم فعلاً:


    - المقصورات الجديدة العاملة، والركوب مجاني، من المركز إلى الأحياء العليا


    - محطات مهجورة: أبراج خرسانية وبكرات صدئة وزجاج مكسور


    - مركز سوفييتي من الخمسينيات في قاع الأخدود: مسرح وحديقة وملعب


    تشياتورا ليست بلدة جميلة ولا تدّعي ذلك. تستحق الانعطاف إليها بوصفها مشهداً صناعياً، وبوصفها مكاناً
    ما زال فيه حلٌّ هندسي سوفييتي لجغرافيا صعبة يؤدي عملاً يومياً.


    بالنسبة إلى الأهالي هذه ليست نزهة بل تنقلاً يومياً. كانت المقصورات مجانية منذ البداية وما زالت كذلك،
    ويستعملها الناس للوصول إلى المتاجر والمدرسة والمقبرة. وما زال المحليون يسمّون المنظومة القديمة تلفريك
    ستالين لأنها وُضعت في السنوات الأخيرة من حكمه — وحتى 2021 كان بإمكانك فعلاً أن تركب مقصورة بُرشمت
    في الخمسينيات.
  tip: >-
    ثلاث ساعات تغطي البلدة وبضع رحلات. الركوب مجاني، والمقصورات صغيرة، وفي أوقات تبديل الورديات تمتلئ
    بالأهالي، فمنتصف النهار أفضل للتصوير. لا تتسلق المحطات المهجورة: الأرضيات منهارة والكابلات مشدودة.
    المقاهي والمتاجر حول الساحة المركزية، ودورات المياه قرب المسرح. ولأن الوادي عميق، تتأخر الشمس شتاءً
    وتبقى الرطوبة طوال النهار. ودخول مواقع المناجم ممنوع.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، نحو 180 كم، ثم شمالاً صعوداً في وادي كفيريلا نحو تشياتورا،
    35 كم أخرى. المجموع 215 كم، نحو ثلاث ساعات وعشر دقائق. الطريق كله معبّد، ويضيق بعد زستافوني بمنعطفات
    كثيرة وحركة شاحنات ثقيلة. تزوّد بالوقود في زستافوني. في المركز يمكنك الوقوف مجاناً بجوار الساحة الرئيسية.
    ويقع عمود كاتسخي على الطريق نفسه قبل البلدة بنحو 10 كم، فيسهل الجمع بينهما. وتكفي سيارة اقتصادية.
