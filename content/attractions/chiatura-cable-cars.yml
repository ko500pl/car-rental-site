ka:
  name: ჭიათურის საბაგიროები
  short: >-
    მანგანუმის ქალაქი ყვირილას ხეობის ფსკერზე, სადაც 1954 წლიდან კლდეზე საბაგიროთი ადიან — ჯერ მეშახტეები
    ადიოდნენ, დღეს კი მთელი ქალაქი.
  body: >-
    **ჭიათურაში სამსახურისკენ გზა ვერტიკალურად მიდის: ყვირილას ხეობის ფსკერიდან კლდის თავზე შეფენილ უბნებამდე
    — საბაგიროთი.**


    მიზეზი ქვაშია. 1879 წელს აქ მადნის საძებნელად ჩამოსულმა პოეტმა აკაკი წერეთელმა საბადოს მიაგნო; მოგვიანებით
    გაირკვა, რომ მანგანუმის ფენები ზოგან თექვსმეტი მეტრის სისქისაა, 1905 წლისთვის კი ეს ვიწრო ხეობა მსოფლიოს
    მანგანუმის დაახლოებით 60 პროცენტს იძლეოდა. შრომა სასტიკი იყო. 1905 წელს დაახლოებით 3700 მეშახტე დღეში
    თვრამეტ საათს მუშაობდა და მაღაროშივე ეძინა, ჭიათურა კი უმეტესად მენშევიკურ საქართველოში ბოლშევიკების
    ერთადერთ დასაყრდენად იქცა. მეშახტეებს ახალგაზრდა იოსებ სტალინი აწყობდა — მათთვის უბრალოდ კობა, — რომელმაც
    აქ სტამბა და შეიარაღებული რაზმები შექმნა. 1906 წელს ბოლშევიკები თავს დაესხნენ მატარებელს, რომელსაც
    მეშახტეების ხელფასი მიჰქონდა, და 21 000 მანეთი წაიღეს; 1913 წელს კი 55-დღიანი წარმატებული გაფიცვა
    რვასაათიან სამუშაო დღეს ითხოვდა.


    საბაგიროები 1954 წელს გაჩნდა, რადგან მაღაროებამდე აღმართი ყოველ ცვლას დროს აცლიდა. ქსელი ჩვიდმეტ ხაზამდე
    გაიზარდა და თავდაპირველი საბჭოთა მოწყობილობით 67 წელი იმუშავა, სანამ 2021 წელს სახიფათოდ არ ცნეს.
    იმავე წლის სექტემბერში ოთხხაზიანი ახალი ცენტრალური სადგური გაიხსნა, 2025 წლის დასაწყისში საშევარდნოს
    მეხუთე ხაზი დაემატა, სხვები კი ჯერ კიდევ შენდება. სახელმწიფო რამდენიმე ძველი სადგურის მემკვიდრეობის
    ძეგლად შენარჩუნებას აპირებს.


    ასე რომ, ახალი კაბინებით ძველი სისტემის ჩონჩხს თავზე გადაუფრენთ: დაჟანგულ ამწე მექანიზმებს, ჩამსხვრეულმინიან
    ბეტონის კოშკებს. ქვემოთ რკინიგზა მიიკლაკნება, რომელსაც მადანი ზესტაფონისკენ მიაქვს, და ნაცრისფერი
    ნაყარი მთები, მოქმედი ქალაქის ნიშანი.


    ჭიათურა არ ცდილობს, თავი მოგაწონოს. მას სხვა საზრუნავი აქვს: ცვლა კლდეზე აიყვანოს.
  tip: >-
    სამი საათი გამოყავით საბაგიროებისთვის, ქალაქში სასეირნოდ და X–XI საუკუნეების მღვიმევის მონასტრისთვის,
    რომელიც ცენტრიდან კილომეტრზე ცოტა მეტითაა დაშორებული. კაბინები პატარაა და ცვლების შეცვლისას ადგილობრივებით
    ივსება, ამიტომ ფოტოსთვის შუადღე ჯობია. მიტოვებულ სადგურებში ნუ შეხვალთ: იატაკი ზოგან ჩანგრეულია, ძველი
    მექანიზმები კი ისევ ადგილზეა. მაღაროების ტერიტორიაზე სტუმრებს არ უშვებენ. კაფეები და მაღაზიები ცენტრალურ
    მოედანთანაა. ხეობა ღრმაა: ზამთარში მზე გვიან შემოდის, ადრე მიდის და ქალაქი ნესტიანია. გამგზავრებამდე
    რატი ონელის 2017 წლის დოკუმენტური ფილმი „მზის ქალაქი“ ნახეთ — ჭიათურელებზეა გადაღებული.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის უღელტეხილის გავლით ზესტაფონამდე, დაახლოებით
    180 კმ, შემდეგ კი ჩრდილოეთით ყვირილას ხეობას აუყევით შ22-ით — კიდევ 35 კმ; ქალაქამდე დაახლოებით 10
    კმ-ით ადრე კაცხის სვეტს ჩაუვლით. სულ 215 კმ-ია და დაახლოებით სამი საათი და ათი წუთი, მთლიანად ასფალტზე,
    თუმცა ზესტაფონის შემდეგ გზა ვიწროვდება, მოსახვევებით სავსეა და მძიმე სატვირთოები დადის. უფრო მოკლე
    ვარიანტიც არსებობს: მაგისტრალიდან აგარასთან გადაუხვიეთ და შ22-ით საჩხერის გავლით იარეთ — დაახლოებით
    185 კმ. საწვავი მაგისტრალიდან გადახვევამდე ჩაასხით. ეკონომ კლასი საკმარისია; მანქანა ცენტრალურ მოედანთან
    გააჩერეთ.
en:
  name: Chiatura Cable Cars
  short: >-
    A manganese town at the bottom of the Kvirila gorge, where cable cars have lifted miners up the cliffs
    since 1954 and still carry the daily commute.
  body: >-
    **In Chiatura the commute runs vertically: from the floor of the Kvirila gorge to the districts on
    the cliff tops, by cable car.**


    The reason is in the rock. In 1879 the poet Akaki Tsereteli came prospecting here and found the deposits;
    later surveys showed manganese seams up to sixteen metres thick, and by 1905 this narrow valley supplied
    some 60 per cent of the world's output. The work was brutal. In 1905 about 3,700 miners laboured eighteen
    hours a day and slept in the mines, and Chiatura became the only Bolshevik stronghold in a largely
    Menshevik Georgia. Their organiser was a young Joseph Stalin, known to them as Koba, who set up a
    printing press and armed squads. In 1906 Bolshevik raiders attacked the train carrying the miners'
    wages and made off with 21,000 roubles; in 1913 the miners held out for 55 days in a successful strike,
    demanding an eight-hour day.


    The cable cars came in 1954, because the climb to the pits was eating into every shift. The network
    grew to seventeen lines and ran on its original Soviet hardware for 67 years, until it was judged
    unsafe in 2021. A new four-line central station opened that September, a fifth line to Sashevardno
    followed in early 2025, and others are still being rebuilt. The state means to keep several old stations
    as heritage.


    So you ride modern cabins over the bones of the old system: rusted winding gear, concrete towers with
    their glass knocked out. Below run the railway that hauls ore to Zestaponi and the grey spoil of a
    town still at work.


    Chiatura makes no effort to charm you. It has a shift to get up the cliff.
  tip: >-
    Allow three hours for rides, a walk and the 10th–11th-century Mgvimevi Monastery, just over a kilometre
    from the centre. The cabins are small and fill with locals at shift changes, so midday is easier for
    photographs. Keep out of the abandoned stations: floors have given way and old machinery is still
    in place. The mine workings are closed to visitors. Cafés and shops cluster around the central square.
    The gorge is deep, so in winter the sun comes late and leaves early, and the town stays damp. Before
    you go, watch Rati Oneli's 2017 documentary City of the Sun, filmed among Chiatura's people.
  route: >-
    From Tbilisi take the S1 (E60) west over the Rikoti Pass to Zestaponi, about 180 km, then turn north
    up the Kvirila valley on the Sh22 for the last 35 km, passing Katskhi Pillar some 10 km before town.
    That makes 215 km and roughly three hours ten, all on asphalt, though after Zestaponi the road narrows,
    bends constantly and carries heavy lorries. A shorter option leaves the S1 near Agara and follows
    the Sh22 through Sachkhere, about 185 km. Refuel on the highway before you turn off. An economy car
    is enough; park near the central square.
ru:
  name: Канатные дороги Чиатуры
  short: >-
    Марганцевый город на дне ущелья Квирилы, где канатные дороги поднимают шахтёров по скалам с 1954 года
    и до сих пор служат для повседневных поездок.
  body: >-
    **В Чиатуре путь на работу проходит по вертикали: от дна ущелья Квирилы до кварталов на вершинах скал
    — по канатной дороге.**


    Причина — в самой породе. В 1879 году поэт Акакий Церетели приехал сюда искать месторождения и нашёл
    их; последующие разведки показали марганцевые пласты толщиной до шестнадцати метров, и к 1905 году
    эта узкая долина давала около 60 процентов мировой добычи. Труд был жестоким. В 1905 году около 3700
    шахтёров трудились по восемнадцать часов в сутки и спали в шахтах, и Чиатура стала единственным большевистским
    оплотом в преимущественно меньшевистской Грузии. Организатором шахтёров был молодой Иосиф Сталин,
    известный им как Коба, устроивший здесь типографию и вооружённые отряды. В 1906 году большевистские
    налётчики напали на поезд, перевозивший зарплату шахтёров, и захватили 21 000 рублей; в 1913 году
    шахтёры 55 дней держались в успешной стачке, требуя восьмичасового рабочего дня.


    Канатные дороги появились в 1954 году, потому что подъём к шахтам съедал время каждой смены. Сеть
    выросла до семнадцати линий и работала на первоначальном советском оборудовании 67 лет, пока в 2021
    году её не признали небезопасной. Новая четырёхлинейная центральная станция открылась в сентябре того
    же года, пятая линия — на Сашевардно — последовала в начале 2025 года, а другие ещё восстанавливаются.
    Государство намерено сохранить несколько старых станций как памятники.


    Так вы едете в современных кабинках над остовом старой системы: ржавыми лебёдками, бетонными опорами
    с выбитыми стёклами. Внизу — железная дорога, по которой руду везут в Зестафони, и серые отвалы города,
    который всё ещё работает.


    Чиатура не старается вас очаровать. Ей некогда: смену пора поднимать на скалу.
  tip: >-
    Отведите три часа на поездки, прогулку и монастырь Мгвимеви X–XI веков, чуть более чем в километре
    от центра. Кабинки маленькие и заполняются местными в пересменку, так что для фотографий проще в середине
    дня. Не заходите на заброшенные станции: полы провалились, а старое оборудование до сих пор на месте.
    Шахты закрыты для посетителей. Кафе и магазины сосредоточены вокруг центральной площади. Ущелье глубокое,
    так что зимой солнце появляется поздно и уходит рано, а в городе сыро. Перед поездкой посмотрите документальный
    фильм Рати Онели 2017 года «Город солнца», снятый среди жителей Чиатуры.
  route: >-
    Из Тбилиси по трассе S1 (E60) через Рикотский перевал до Зестафони — около 180 км, затем на север
    по долине Квирилы по Ш22 последние 35 км, минуя Кацхский столб примерно за 10 км до города. Итого
    215 км и около трёх часов десяти минут, весь путь асфальтирован, хотя после Зестафони дорога сужается,
    сплошь в поворотах, и по ней идут тяжёлые грузовики. Более короткий вариант — съехать с S1 у Агары
    и следовать по Ш22 через Сачхере, около 185 км. Заправляйтесь на шоссе перед поворотом. Экономичного
    автомобиля достаточно; паркуйтесь у центральной площади.
fa:
  name: تله‌کابین‌های چیاتورا
  short: >-
    شهری منگنزی در بستر تنگه‌ی کویریلا، جایی که تله‌کابین‌ها از سال ۱۹۵۴ معدنچیان را از میان صخره‌ها بالا
    برده‌اند و هنوز بار رفت‌وآمد روزانه را می‌کشند.
  body: >-
    **در چیاتورا، رفت‌وآمد به سرِ کار عمودی است: از بستر تنگه‌ی کویریلا تا محله‌های بر فراز صخره‌ها، با
    تله‌کابین.**


    دلیل آن در خودِ سنگ نهفته است. در سال ۱۸۷۹ شاعر آکاکی تسرتلی برای کاوش به این‌جا آمد و ذخایر را یافت؛
    بررسی‌های بعدی رگه‌های منگنزی به ضخامت تا شانزده متر را نمایان کرد، و تا سال ۱۹۰۵ این دره‌ی تنگ حدود
    ۶۰ درصد از تولید جهانی را فراهم می‌کرد. کار سخت و بی‌رحم بود. در سال ۱۹۰۵ حدود ۳۷۰۰ معدنچی هجده ساعت
    در روز کار می‌کردند و در خودِ معادن می‌خوابیدند، و چیاتورا تنها پایگاه بلشویکی در گرجستانی شد که بیشتر
    منشویک بود. سازمان‌دهنده‌ی آن‌ها یوسف استالین جوان بود، که در میانشان به کوبا شناخته می‌شد، و دستگاه
    چاپ و گروه‌های مسلح این‌جا برپا کرد. در سال ۱۹۰۶ راهزنانی بلشویک به قطاری که دستمزد معدنچیان را حمل
    می‌کرد حمله کردند و ۲۱٬۰۰۰ روبل با خود بردند؛ در سال ۱۹۱۳ معدنچیان ۵۵ روز در اعتصابی موفق ایستادگی
    کردند و خواستار روز کار هشت‌ساعته شدند.


    تله‌کابین‌ها در سال ۱۹۵۴ آمدند، چون بالارفتن تا معادن وقت هر شیفت را می‌خورد. شبکه به هفده خط رسید
    و ۶۷ سال بر تجهیزات اصلیِ دوران شوروی کار کرد، تا آن‌که در سال ۲۰۲۱ ناامن شناخته شد. ایستگاه مرکزی
    جدیدی با چهار خط در سپتامبر همان سال گشایش یافت، خط پنجمی به سوی ساشواردنو در اوایل ۲۰۲۵ در پی آن
    آمد، و خطوط دیگر هنوز در دست بازسازی‌اند. دولت بر آن است که چند ایستگاه کهن را به‌عنوان میراث نگه
    دارد.


    پس شما در کابین‌های نو، بر فراز استخوان‌های نظام کهن سفر می‌کنید: بالابرهای زنگ‌زده، برج‌های سیمانی
    با شیشه‌های شکسته. در پایین راه‌آهنی می‌گذرد که سنگ معدن را به زستافونی می‌برد، و تپه‌های خاکستری
    باطله نشان شهری‌اند که هنوز کار می‌کند.


    چیاتورا برای دلبری از شما تلاشی نمی‌کند؛ باید شیفت کاری‌اش را از صخره بالا ببرد.
  tip: >-
    سه ساعت برای سواری‌ها، پیاده‌روی و صومعه‌ی مگویمِوی از سده‌های دهم و یازدهم، اندکی بیش از یک کیلومتر
    از مرکز، در نظر بگیرید. کابین‌ها کوچک‌اند و در ساعات تغییر شیفت با اهالی محل پر می‌شوند، پس ظهرها
    برای عکاسی آسان‌تر است. از ایستگاه‌های متروکه دور بمانید: کف‌ها فروریخته و ماشین‌آلات کهنه هنوز سرجایشان
    هستند. معادن به بازدیدکنندگان بسته است. کافه‌ها و مغازه‌ها گرداگرد میدان مرکزی جمع‌اند. تنگه عمیق
    است، پس در زمستان آفتاب دیر می‌آید و زود می‌رود، و شهر مرطوب می‌ماند. پیش از سفر، مستند «شهر خورشید»
    (۲۰۱۷) ساخته‌ی راتی اونلی را ببینید که میان مردم چیاتورا فیلمبرداری شده است.
  route: >-
    از تفلیس از مسیر S1 (E60) به سوی غرب بروید و از گردنه‌ی ریکوتی بگذرید تا به زستافونی برسید، حدود ۱۸۰
    کیلومتر؛ سپس ۳۵ کیلومتر پایانی را از راه Sh22 به سوی شمال، در دره‌ی کویریلا، بپیمایید. حدود ۱۰ کیلومتر
    پیش از شهر از کنار ستون کاتسخی می‌گذرید. در مجموع ۲۱۵ کیلومتر و تقریباً سه ساعت و ده دقیقه راه است،
    سراسر آسفالت، هرچند پس از زستافونی جاده باریک‌تر می‌شود، پیچ‌درپیچ است و کامیون‌های سنگین در آن رفت‌وآمد
    می‌کنند. گزینه‌ی کوتاه‌تر این است که نزدیک آگارا از S1 جدا شوید و از راه Sh22 و از میان ساچخره بروید؛
    حدود ۱۸۵ کیلومتر. پیش از جداشدن از بزرگراه سوخت‌گیری کنید. خودرویی معمولی کافی است؛ نزدیک میدان مرکزی
    پارک کنید.
he:
  name: הרכבלים של צ'יאטורה
  short: עיר מנגן על קרקעית גיא קווירילה, שם הרכבלים מרימים כורים במעלה הצוקים מ-1954 ועדיין משמשים לנסיעה
    היומיומית.
  body: >-
    **בצ'יאטורה הנסיעה לעבודה עוברת אנכית: מקרקעית גיא קווירילה עד לשכונות שעל ראשי הצוקים, ברכבל.**


    הסיבה נמצאת בסלע עצמו. ב-1879 הגיע המשורר אקאקי צרטלי לחפש כאן מחצבים ומצא את המרבצים; סקרים מאוחרים
    יותר הראו שכבות מנגן בעובי של עד שישה-עשר מטרים, ועד 1905 סיפק העמק הצר הזה כ-60 אחוזים מהתפוקה העולמית.
    העבודה הייתה אכזרית. ב-1905 עבדו כ-3,700 כורים שמונה-עשרה שעות ביום וישנו במכרות, וצ'יאטורה הפכה למעוז
    הבולשביקי היחיד בגאורגיה המנשביקית ברובה. המארגן שלהם היה יוסף סטלין הצעיר, שהכירוהו בשם קובה, שהקים
    כאן בית דפוס וחוליות חמושות. ב-1906 תקפו שודדים בולשביקים את הרכבת שנשאה את שכר הכורים ונמלטו עם 21,000
    רובל; ב-1913 החזיקו הכורים מעמד 55 ימים בשביתה מוצלחת, ובה דרשו יום עבודה של שמונה שעות.


    הרכבלים הגיעו ב-1954, כי הטיפוס למכרות בלע חלק גדול מכל משמרת. הרשת גדלה לשבעה-עשר קווים ועבדה על
    הציוד הסובייטי המקורי שלה 67 שנה, עד שנקבע ב-2021 שאינה בטוחה. תחנה מרכזית חדשה בת ארבעה קווים נפתחה
    בספטמבר של אותה שנה, קו חמישי לסאשוורדנו הגיע בתחילת 2025, ואחרים עדיין נבנים מחדש. המדינה מתכוונת
    לשמור כמה תחנות ישנות כמורשת.


    כך אתם נוסעים בתאים מודרניים מעל עצמות המערכת הישנה: מנגנוני הנפה חלודים, עמודי בטון עם זכוכית שבורה.
    מתחת עוברת מסילת הברזל הנושאת עפרה לזסטפוני, וערימות הפסולת האפורות של עיר שעדיין עובדת.


    צ'יאטורה לא מתאמצת לקסום לכם. יש לה משמרת להעלות אל ראש הצוק.
  tip: >-
    הקצו שלוש שעות לנסיעות, להליכה, ולמנזר מגווימווי מהמאה ה-10–11, קצת יותר מקילומטר מהמרכז. התאים קטנים
    ומתמלאים בתושבים המקומיים בזמני החלפת המשמרות, אז הצהריים נוחים יותר לצילום. הישארו מחוץ לתחנות הנטושות:
    רצפות קרסו והמכונות הישנות עדיין במקום. אתרי הכרייה סגורים למבקרים. בתי קפה וחנויות מתקבצים סביב הכיכר
    המרכזית. הגיא עמוק, אז בחורף השמש מגיעה מאוחר ועוזבת מוקדם, והעיר נשארת לחה. לפני שתצאו, צפו בסרט
    התיעודי של רטי אונלי מ-2017, "עיר השמש", שנוצר בין תושבי צ'יאטורה.
  route: >-
    מטביליסי קחו את S1 (E60) דרך מעבר ריקותי לזסטפוני, כ-180 ק"מ, ואז צפונה בעמק קווירילה על Sh22 ל-35
    הק"מ האחרונים, חולפים על עמוד קאצחי כ-10 ק"מ לפני העיר. בסך הכול 215 ק"מ ובערך שלוש שעות ועשר דקות,
    אספלט כל הדרך, אף שאחרי זסטפוני הכביש נעשה צר, מתפתל בלי הפסקה ועוברות בו משאיות כבדות. אפשרות קצרה
    יותר עוזבת את S1 סמוך לאגרה ועוקבת אחר Sh22 דרך סאצ'חרה, כ-185 ק"מ. תדלקו בכביש הראשי לפני שאתם פונים.
    רכב חסכוני מספיק; חנו סמוך לכיכר המרכזית.
ar:
  name: تلفريك تشياتورا
  short: >-
    بلدة منغنيز في قعر وادي كفيريلا، حيث ترفع التلفريكات عمال المناجم على المنحدرات منذ عام 1954 ولا تزال
    وسيلة التنقل اليومي.
  body: >-
    **في تشياتورا يسير التنقل إلى العمل عموديًا: من قعر وادي كفيريلا إلى الأحياء على قمم المنحدرات، بالتلفريك.**


    يكمن السبب في الصخر نفسه. عام 1879 جاء الشاعر أكاكي تسيريتيلي منقّبًا فوجد الرواسب؛ وأظهرت مسوحات
    لاحقة عروق منغنيز يصل سُمكها إلى ستة عشر مترًا، وبحلول 1905 وفّر هذا الوادي الضيق نحو 60 بالمئة من
    الإنتاج العالمي. كان العمل قاسيًا. عام 1905 عمل نحو 3700 عامل منجم ثماني عشرة ساعة يوميًا وناموا في
    المناجم، وصارت تشياتورا المعقل البلشفي الوحيد في جورجيا التي كانت في غالبها منشفيكية. كان منظّمهم
    يوسف ستالين الشاب، المعروف عندهم باسم كوبا، الذي أقام هناك مطبعة وفرقًا مسلّحة. عام 1906 هاجم مسلحون
    بلاشفة القطار الذي يحمل أجور عمال المناجم وفرّوا بـ21,000 روبل؛ وفي عام 1913 صمد العمال 55 يومًا في
    إضراب ناجح طالبوا فيه بيوم عمل من ثماني ساعات.


    جاءت التلفريكات عام 1954، لأن صعود المنحدر إلى المناجم كان يستهلك وقت كل وردية. نمت الشبكة إلى سبعة
    عشر خطًا وعملت بمعداتها السوفيتية الأصلية 67 عامًا، حتى اعتُبرت غير آمنة عام 2021. افتُتحت محطة مركزية
    جديدة بأربعة خطوط في سبتمبر من ذاك العام، وتبعها خط خامس إلى ساشيفاردنو في أوائل 2025، وما زالت خطوط
    أخرى قيد إعادة البناء. تنوي الدولة الحفاظ على عدة محطات قديمة معالمَ تراثية.


    فتركب اليوم مقصورات حديثة فوق عظام النظام القديم: أجهزة رفع صدئة، وأبراج خرسانية بزجاج مهشّم. تحتها
    يمر خط سكة حديد يحمل الخام إلى زستافوني، وأكوام المخلّفات الرمادية لبلدة لا تزال تعمل.


    لا تحاول تشياتورا أن تسحرك. لديها وردية عليها أن تُصعدها إلى أعلى الجرف.
  tip: >-
    خصص ثلاث ساعات للركوب والتمشي ودير مغفيميفي من القرنين العاشر والحادي عشر، على بُعد ما يزيد قليلًا
    على كيلومتر من المركز. المقصورات صغيرة وتمتلئ بالسكان المحليين عند تبديل الورديات، فمنتصف النهار أسهل
    للتصوير. لا تدخل المحطات المهجورة: انهارت الأرضيات ولا تزال الآلات القديمة في موضعها. المناجم مغلقة
    للزوار. تتجمع المقاهي والمتاجر حول الساحة المركزية. الوادي عميق، فتأتي الشمس متأخرة وترحل باكرًا شتاءً،
    وتبقى البلدة رطبة. قبل السفر، شاهد فيلم راتي أونيلي الوثائقي "مدينة الشمس" من عام 2017، المصوَّر بين
    سكان تشياتورا.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) عبر ممر ريكوتي إلى زستافوني، نحو 180 كم، ثم شمالًا في وادي كفيريلا على
    طريق Sh22 لآخر 35 كم، متجاوزًا عمود كاتسخي على نحو 10 كم قبل البلدة. يصبح الإجمالي 215 كم وحوالي ثلاث
    ساعات وعشر دقائق، أسفلت طوال الطريق، مع أن الطريق يضيق بعد زستافوني ويتعرّج باستمرار وتسلكه شاحنات
    ثقيلة. خيار أقصر يترك S1 قرب أغارا ويتبع Sh22 عبر ساتشخيري، نحو 185 كم. عبّئ الوقود على الطريق السريع
    قبل الانعطاف. سيارة اقتصادية تكفي؛ اركن قرب الساحة المركزية.
