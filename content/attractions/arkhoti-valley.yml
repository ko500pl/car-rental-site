ka:
  name: არხოტის ხეობა
  short: >-
    ხევსურეთის საზღვრისპირა ხეობა იქ, სადაც გზა მთავრდება: აქ მხოლოდ ჯიპით ან ფეხით მოხვდებით, ორ სოფელში
    კი კერა ჯერ არ ჩამქრალა.
  body: >-
    **არხოტი ის ადგილია, სადაც საქართველოს გზა უთავდება: ხევსურეთის მაღალი ხეობა რუსეთის საზღვარს მიჰყრდნობია,
    მისასვლელი უღელტეხილი კი პირველ თოვლთან ერთად იკეტება.**


    ხეობა დაახლოებით 241 კვადრატულ კილომეტრზეა გადაჭიმული. მისი წყლები მდინარე ასაში იყრის თავს, ასა კი
    ჩრდილოეთით, ინგუშეთისკენ მიედინება. დღეს მხოლოდ ორი სოფელი ცოცხლობს — ახიელი და ამღა; ჭიმღა დაიცალა,
    კალოთანა, ღორღუ, წყალშუა და კვირიწმინდა კი ნანგრევებად შემორჩა. ხეობას ხუთი საბრძოლო კოშკი და ციხე-სახლი
    დაჰყურებს, ფერდობებზე კი ჯვარ-ხატებია — ხევსურული სალოცავები, სადაც ქრისტიანობა და მთის უძველესი რწმენა
    ერთმანეთისგან არასოდეს გამიჯნულა.


    დიდხანს აქ მხოლოდ ფეხით ან ცხენით ამოდიოდნენ; ჯიპის გზა როშკიდან უღელტეხილზე მხოლოდ 2017–2018 წლებში
    გაიყვანეს. ძველი გზა კი სულ სხვა მხარეს მიდიოდა — ასას დინებას მიუყვებოდა ქისტებისა და ინგუშების სოფლებისკენ,
    რომლებიც აქედან 18–20 კილომეტრზეა.


    ხევსურეთი საუკუნეების განმავლობაში თავად განაგებდა თავს: თემს არჩეული ხევისბერები უძღვებოდნენ, კაცები
    კი მეფეს საზღვრის მცველებად ემსახურებოდნენ. ჯვრებით შემკულ ხევსურულ სამოსსა და ჯაჭვის პერანგს XIX
    საუკუნეში რუსმა ეთნოგრაფმა არნოლდ ზისერმანმა ჯვაროსნული წარმომავლობის „საბუთი“ დაუძებნა. ქართველი
    მეცნიერები ამ თეორიას კატეგორიულად უარყოფენ — ეს მითია და არა ისტორია.


    ზემო არხოტში ათობით ნაკადული ერთ მდინარედ იკრიფება, რომელსაც ხეობის ფსკერზე ვიწრო კანიონი ამოუჭრია.
    ივლისის დასაწყისში ფერდობებზე დეკა ყვავილობს, ხეობის სიღრმეში კი ტანიეს ტბა ელოდება მათ, ვინც მრავალდღიან
    ლაშქრობას არ შეუშინდა.


    აქ არც სალარო დაგხვდებათ და არც სანახაობების სია. არხოტს საათები კი არა, დღეები სჭირდება — სამაგიეროდ
    იმ საქართველოს გაჩვენებთ, რომელსაც რუკები დიდი ხანია შეელია.
  tip: >-
    არხოტი სასაზღვრო ზონაა: პასპორტი აუცილებლად თან იქონიეთ — ჯუთის ბილიკზე სასაზღვრო პოლიციის საგუშაგოა
    და საბუთებს ამოწმებენ; გამგზავრებამდე სასაზღვრო ზონაში შესვლის მიმდინარე წესებიც გადაამოწმეთ. სეზონი
    ივნისის ბოლოდან სექტემბრამდე გრძელდება. მაღაზია, ბანკომატი და საიმედო მობილური კავშირი არ არის — ფული
    და საკვები წინასწარ მოიმარაგეთ. ზაფხულის დასაწყისში მდინარეები ადიდებულია, ტანიეს ხეობის ხიდები კი
    ხშირად დაზიანებულია, ამიტომ ამ მონაკვეთს ივლისის ბოლომდე ჯობია მოერიდოთ. გაიყოლეთ ადგილობრივი მეგზური
    ან მეცხენე; მთის გამოცდილების გარეშე უღელტეხილზე მარტო ნუ გადახვალთ.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117, ს3) ჟინვალამდე მიდიხართ, იქიდან ფშავის არაგვის ხეობას
    მიუყვებით ბარისახოს გავლით და ციცაბო, ქვიან შესახვევზე როშკისკენ უხვევთ — სულ 119 კმ და დაახლოებით
    სამი საათი. ბოლო კილომეტრები მართლაც მძიმეა: საჭიროა მაღალი კლირენსის სრულამძრავიანი მანქანა (ყველგანმავალის
    კლასი). საწვავი ჟინვალში ან ბარისახოში ჩაასხით. როშკაში მანქანა რჩება: უღელტეხილზე სეზონური ჯიპის
    გზა ახიელამდე ჯობია ადგილობრივმა მძღოლმა გაიაროს, ფეხით კი ერთ-ორ დღეს მოუნდებით. ალტერნატივა ყაზბეგის
    მხრიდანაა — ჯუთიდან არხოტისთავის უღელტეხილით (3287 მ), მხოლოდ ფეხით. ხეობაზე გამავალი გზა არ არსებობს
    — ხეობა საზღვართან ჩიხით მთავრდება.
en:
  name: Arkhoti Valley
  short: >-
    A Khevsur border valley beyond the end of the road, reached only by jeep track or on foot, where two
    villages still keep their hearths burning.
  body: >-
    **Arkhoti is where Georgia runs out of road: a high Khevsur valley pressed against the Russian border,
    reached over a pass that shuts with the first snow.**


    The valley spreads across some 241 square kilometres, its streams gathering into the Asa, which flows
    north into Ingushetia. Only two villages are still lived in, Akhieli and Amgha; Chimgha has emptied,
    and Kalotana, Ghorghu, Tskalshua and Kviritsminda survive as ruins. Five defensive towers and castle-houses
    watch over the valley, and the slopes are marked with jvari — Khevsur shrines where Christianity and
    far older mountain cults were never fully pulled apart.


    For generations the only ways in were on foot or on horseback; a jeep track over the pass from Roshka
    was finished only in 2017–2018. The old road ran the other way entirely, down the Asa towards the
    Kist and Ingush villages 18–20 km away.


    Khevsureti long governed itself: communities were led by elected elders, the khevisberi, and its men
    served the Georgian crown as border guards. In the 19th century the Russian ethnographer Arnold Zisserman
    looked at their chain mail and cross-decorated clothes and declared them descendants of Crusaders.
    Georgian scholars reject the idea outright — it is a myth, not history.


    In upper Arkhoti dozens of streams braid into a single river that has cut a narrow canyon into the
    valley floor. In early July rhododendrons flower on the slopes, and deeper in, Tanie Lake waits for
    those willing to walk for days.


    There is no ticket office here and no list of sights. Arkhoti asks for days, not hours — and in return
    shows you a Georgia that most maps gave up on long ago.
  tip: >-
    Arkhoti is a border zone: carry your passport — there is a border police post on the trail from Juta
    and documents are checked — and confirm the current border-zone rules before you set out. The season
    runs from late June to September. There are no shops, no ATM and no reliable mobile signal, so bring
    cash and food. In early summer the rivers run high and the bridges in the Tanie gorge are often damaged;
    leave that section until late July. Take a local guide or horseman, and do not cross the pass alone
    without mountain experience.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117, S3) to Zhinvali, then follow the Pshavi Aragvi
    valley via Barisakho and take the steep, stony turn-off to Roshka — 119 km and about three hours in
    all. The last kilometres are genuinely rough: you need a high-clearance four-wheel-drive (offroad
    class). Refuel in Zhinvali or Barisakho. At Roshka the car stays behind: the seasonal jeep track over
    the pass to Akhieli is best left to a local driver, or it is one to two days on foot. The alternative,
    from the Kazbegi side, is on foot only — from Juta over the Arkhotistavi pass (3,287 m). No road runs
    through the valley; it dead-ends at the border.
ru:
  name: Долина Архоти
  short: >-
    Хевсурская пограничная долина за концом дороги: сюда добираются только по джиповой колее или пешком,
    и в двух сёлах до сих пор горят очаги.
  body: >-
    **Архоти — место, где у Грузии кончаются дороги: высокая хевсурская долина, прижатая к российской
    границе, куда ведёт перевал, закрывающийся с первым снегом.**


    Долина раскинулась примерно на 241 квадратный километр, а её ручьи собираются в реку Асса, которая
    течёт на север, в Ингушетию. Жилыми остались лишь два села — Ахиели и Амга; Чимга опустела, а от Калотаны,
    Горгу, Цкалшуа и Квирицминды остались руины. Над долиной стоят пять оборонительных башен и домов-крепостей,
    а склоны отмечены джвари — хевсурскими святилищами, где христианство так и не отделилось до конца
    от куда более древних горских культов.


    Поколениями сюда можно было попасть только пешком или верхом; джиповую колею через перевал от Рошки
    достроили лишь в 2017–2018 годах. Старый путь вёл совсем в другую сторону — вниз по Ассе, к кистинским
    и ингушским сёлам в 18–20 км отсюда.


    В Хевсурети долго царило самоуправление: общинами руководили выборные старейшины — хевисбери, а мужчины
    служили грузинской короне пограничной стражей. В XIX веке русский этнограф Арнольд Зиссерман, увидев
    их кольчуги и одежду, расшитую крестами, объявил хевсуров потомками крестоносцев. Грузинские учёные
    эту идею решительно отвергают: это миф, а не история.


    В верхнем Архоти десятки ручьёв сплетаются в одну реку, прорезавшую в дне долины узкий каньон. В начале
    июля на склонах цветут рододендроны, а дальше, в глубине, ждёт озеро Тание — для тех, кто готов идти
    несколько дней.


    Здесь нет ни кассы, ни списка достопримечательностей. Архоти требует дней, а не часов — и взамен показывает
    Грузию, от которой большинство карт давно отказались.
  tip: >-
    Архоти — пограничная зона: возьмите паспорт — на тропе от Джуты стоит пост пограничной полиции, документы
    проверяют, — и перед выходом уточните действующие правила посещения погранзоны. Сезон — с конца июня
    по сентябрь. Здесь нет магазинов, банкомата и надёжной мобильной связи, так что берите наличные и
    еду. В начале лета реки полноводны, а мосты в ущелье Тание часто повреждены — оставьте этот участок
    на конец июля. Возьмите местного проводника или погонщика с лошадьми и не переходите перевал в одиночку
    без горного опыта.
  route: >-
    Из Тбилиси езжайте по Военно-Грузинской дороге (E117, S3) до Жинвали, затем по долине Пшавской Арагви
    через Барисахо и сверните на крутой каменистый съезд к Рошке — всего 119 км и около трёх часов. Последние
    километры по-настоящему тяжёлые: нужен внедорожник с высоким клиренсом и полным приводом (класс «внедорожник»).
    Заправьтесь в Жинвали или Барисахо. В Рошке машина остаётся: сезонную джиповую колею через перевал
    к Ахиели лучше доверить местному водителю — или идти пешком один-два дня. Альтернатива, со стороны
    Казбеги, только пешая: от Джуты через перевал Архотистави (3287 м). Сквозной дороги через долину нет
    — она упирается в границу.
fa:
  name: درهٔ آرخوتی
  short: >-
    درهٔ مرزی خوسورتی در آن سوی پایان جاده، که فقط از راه جیپ‌رو یا پیاده به آن می‌رسند و در دو روستایش
    هنوز اجاق‌ها روشن است.
  body: >-
    **آرخوتی جایی است که جاده‌های گرجستان به پایان می‌رسند: درهٔ مرتفعی از خوسورتی که به مرز روسیه چسبیده
    و راهش از گردنه‌ای می‌گذرد که با نخستین برف بسته می‌شود.**


    این دره حدود ۲۴۱ کیلومتر مربع وسعت دارد و نهرهایش به رود آسا می‌پیوندند که به سوی شمال، به اینگوشتیا،
    جاری است. تنها دو روستا هنوز مسکونی‌اند، آخیئلی و آمغا؛ چیمغا خالی از سکنه شده و کالوتانا، غورغو،
    تسکالشوآ و کویریتسمیندا فقط ویرانه‌ای از خود به جا گذاشته‌اند. پنج برج دفاعی و خانه‌قلعه بر دره نظاره
    دارند و دامنه‌ها با جواری‌ها نشان‌دار شده‌اند — زیارتگاه‌های خوسوری که در آن‌ها مسیحیت هرگز به‌تمامی
    از آیین‌های بسیار کهن‌تر کوهستانی جدا نشد.


    نسل‌ها تنها راه ورود پیاده یا سواره بود؛ راه جیپ‌رویی که از روشکا از گردنه می‌گذرد، تازه در ۲۰۱۷–۲۰۱۸
    تکمیل شد. راه قدیمی به سویی کاملاً دیگر می‌رفت: پایین، در امتداد آسا، به سمت روستاهای کیست و اینگوش
    در ۱۸ تا ۲۰ کیلومتری.


    خوسورتی دیرزمانی خود بر خود فرمان می‌راند: جماعت‌ها را ریش‌سفیدانی برگزیده به نام خویسبری رهبری می‌کردند
    و مردانش در مقام مرزبان در خدمت تاج و تخت گرجستان بودند. در سدهٔ نوزدهم، مردم‌نگار روس، آرنولد زیسرمان،
    با دیدن زره‌های زنجیری و جامه‌های صلیب‌نشانشان، آنان را از نوادگان صلیبیان خواند. پژوهشگران گرجی این
    نظر را یکسره رد می‌کنند: این اسطوره است، نه تاریخ.


    در آرخوتی علیا، ده‌ها نهر در هم می‌بافند و رودی واحد می‌سازند که در کف دره کانیونی باریک کنده است.
    اوایل ژوئیه رودودندرون‌ها روی دامنه‌ها گل می‌دهند و در ژرفای دره، دریاچهٔ تانیه در انتظار کسانی است
    که حاضرند روزها راه بروند.


    این‌جا نه باجهٔ بلیت هست و نه فهرستی از جاذبه‌ها. آرخوتی روزها از شما می‌خواهد، نه ساعت‌ها — و در
    عوض گرجستانی را نشانتان می‌دهد که بیشتر نقشه‌ها مدت‌هاست از آن دست کشیده‌اند.
  tip: >-
    آرخوتی منطقه‌ای مرزی است: گذرنامه همراه داشته باشید — در مسیر پیاده از جوتا یک پاسگاه پلیس مرزی هست
    و مدارک را بررسی می‌کنند — و پیش از حرکت، مقررات جاری منطقهٔ مرزی را جویا شوید. فصل سفر از اواخر ژوئن
    تا سپتامبر است. نه مغازه‌ای هست، نه خودپردازی، نه آنتن موبایل قابل اعتماد؛ پس پول نقد و خوراک با خود
    ببرید. اوایل تابستان رودها پرآب‌اند و پل‌های درهٔ تانیه اغلب آسیب‌دیده‌اند؛ این بخش را برای اواخر
    ژوئیه بگذارید. راهنما یا اسب‌دار محلی بگیرید و بی‌تجربهٔ کوهستان، تنها از گردنه نگذرید.
  route: >-
    از تفلیس از جادهٔ نظامی گرجستان (E117، S3) تا ژینوالی بروید، سپس درهٔ آراگوی پشاوی را از راه باریساخو
    دنبال کنید و وارد انشعاب سنگلاخی و پرشیب روشکا شوید — روی هم ۱۱۹ کیلومتر و حدود سه ساعت. کیلومترهای
    آخر به‌راستی سخت‌اند: خودروی شاسی‌بلند چهارچرخ‌محرک (کلاس آفرود) لازم است. در ژینوالی یا باریساخو
    سوخت‌گیری کنید. در روشکا خودرو می‌ماند: راه فصلی جیپ‌رو از روی گردنه تا آخیئلی را بهتر است به رانندهٔ
    محلی بسپارید، وگرنه یک تا دو روز پیاده‌روی است. راه دیگر، از سوی کازبگی، فقط پیاده است: از جوتا و
    از گردنهٔ آرخوتیستاوی (۳۲۸۷ متر). هیچ جاده‌ای از دره عبور نمی‌کند؛ دره به مرز ختم می‌شود.
he:
  name: עמק ארחוטי
  short: עמק גבול חבסורי שמעבר לסוף הכביש, שאפשר להגיע אליו רק בדרך ג׳יפים או ברגל, ובשניים מכפריו עוד
    דולקת האש באח.
  body: >-
    **ארחוטי הוא המקום שבו לגאורגיה נגמרת הדרך: עמק חבסורי גבוה הצמוד לגבול רוסיה, שמגיעים אליו דרך מעבר
    הרים הנסגר עם השלג הראשון.**


    העמק משתרע על כ־241 קמ"ר, ונחליו מתאספים אל נהר אסה, הזורם צפונה אל אינגושטיה. רק שני כפרים עוד מיושבים
    — אחיאלי ואמגה; צ׳ימגה התרוקן, ומקלוטנה, מגורגו, מצקאלשואה ומקביריצמינדה נותרו רק חורבות. חמישה מגדלי
    הגנה ובתי מבצר משקיפים על העמק, והמדרונות מסומנים בג׳וארי — מקדשים חבסוריים שבהם הנצרות ופולחני הרים
    עתיקים בהרבה מעולם לא נפרדו עד הסוף.


    במשך דורות אפשר היה להיכנס לכאן רק ברגל או על גב סוס; דרך הג׳יפים מעל המעבר מרושקה הושלמה רק ב־2017–2018.
    הדרך הישנה הובילה לכיוון אחר לגמרי — במורד האסה, אל הכפרים הקיסטיים והאינגושיים במרחק 18–20 ק"מ.


    חבסורתי ניהלה את עצמה זמן רב: את הקהילות הנהיגו זקנים נבחרים, החביסברי, וגבריה שירתו את הכתר הגאורגי
    כשומרי גבול. במאה ה־19 התבונן האתנוגרף הרוסי ארנולד זיסרמן בשריוני הטבעות שלהם ובבגדיהם המעוטרים בצלבים,
    והכריז שהם צאצאי הצלבנים. חוקרים גאורגים דוחים את הרעיון מכול וכול — זה מיתוס, לא היסטוריה.


    בארחוטי העליון עשרות נחלים נשזרים לנהר אחד, שחצב קניון צר בקרקעית העמק. בתחילת יולי פורחים הרודודנדרונים
    על המדרונות, ועמוק יותר מחכה אגם טאניה למי שמוכן ללכת ימים.


    אין כאן קופה ואין רשימת אתרים. ארחוטי מבקש ימים, לא שעות — ובתמורה מראה לכם גאורגיה שרוב המפות ויתרו
    עליה מזמן.
  tip: >-
    ארחוטי הוא אזור גבול: קחו איתכם דרכון — בשביל מג׳וטה יש עמדה של משטרת הגבול, והמסמכים נבדקים — ובררו
    את כללי אזור הגבול העדכניים לפני היציאה. העונה נמשכת מסוף יוני עד ספטמבר. אין חנויות, אין כספומט ואין
    קליטה סלולרית אמינה, אז הביאו מזומן ואוכל. בתחילת הקיץ הנהרות גואים, והגשרים בערוץ טאניה ניזוקים לעיתים
    קרובות; השאירו את הקטע הזה לסוף יולי. קחו מדריך מקומי או בעל סוסים, ואל תחצו את המעבר לבד בלי ניסיון
    בהרים.
  route: >-
    מטביליסי סעו בכביש הצבא הגאורגי (E117, S3) עד ז׳ינוואלי, ואז לאורך עמק האראגווי הפשאווי דרך בריסאחו,
    ופנו לשלוחה התלולה והסלעית לרושקה — 119 ק"מ וכשלוש שעות בסך הכול. הקילומטרים האחרונים קשים באמת: צריך
    רכב שטח גבוה עם הנעה כפולה (קטגוריית רכבי שטח). תדלקו בז׳ינוואלי או בבריסאחו. ברושקה הרכב נשאר מאחור:
    את דרך הג׳יפים העונתית מעל המעבר לאחיאלי עדיף להשאיר לנהג מקומי — או יום־יומיים של הליכה. החלופה,
    מצד קזבגי, היא ברגל בלבד: מג׳וטה דרך מעבר ארחוטיסטאבי (3,287 מ'). שום כביש אינו חוצה את העמק; הוא
    נגמר בגבול.
ar:
  name: وادي أرخوتي
  short: >-
    وادٍ حدودي في خيفسوريتي وراء نهاية الطريق، لا يُبلغ إلا بمسار سيارات الدفع الرباعي أو سيرًا على الأقدام،
    وفي قريتين منه لا تزال المواقد مشتعلة.
  body: >-
    **أرخوتي هو المكان الذي تنتهي فيه طرق جورجيا: وادٍ خيفسوري مرتفع يلاصق الحدود الروسية، يُبلغ عبر ممرٍّ
    جبلي يُغلق مع أول ثلج.**


    يمتد الوادي على نحو 241 كيلومترًا مربعًا، وتتجمع جداوله في نهر آسا الذي يجري شمالًا إلى إنغوشيا. لم
    يبقَ مأهولًا سوى قريتين، أخييلي وأمغا؛ أما تشيمغا فقد خلت من سكانها، ولم يبقَ من كالوتانا وغورغو وتسكالشوا
    وكفيريتسميندا إلا الأطلال. تحرس الوادي خمسة أبراج دفاعية وبيوت محصّنة، وتنتشر على المنحدرات «الجفاري»
    — مزارات خيفسورية لم تنفصل فيها المسيحية تمامًا قط عن عبادات جبلية أقدم منها بكثير.


    طوال أجيال لم يكن الدخول إلى هنا ممكنًا إلا سيرًا أو على ظهور الخيل؛ ولم يُستكمل مسار سيارات الدفع
    الرباعي عبر الممر من روشكا إلا في 2017–2018. أما الطريق القديم فكان يمضي في اتجاه آخر تمامًا — نزولًا
    مع نهر آسا نحو قرى الكيست والإنغوش على بعد 18–20 كم.


    حكمت خيفسوريتي نفسها زمنًا طويلًا: كان يقود الجماعات شيوخ منتخبون يُسمَّون «خيفيسبيري»، وخدم رجالها
    التاج الجورجي حرّاسًا للحدود. وفي القرن التاسع عشر نظر الإثنوغرافي الروسي أرنولد زيسرمان إلى دروعهم
    الزردية وثيابهم المزيّنة بالصلبان فأعلن أنهم أحفاد الصليبيين. ويرفض العلماء الجورجيون هذه الفكرة رفضًا
    قاطعًا: إنها أسطورة لا تاريخ.


    في أعالي أرخوتي تتضافر عشرات الجداول في نهر واحد شقّ في قاع الوادي أخدودًا ضيقًا. وفي أوائل يوليو
    تُزهر أشجار الرودودندرون على المنحدرات، وفي العمق تنتظر بحيرة تانيه من يرضى بالسير أيامًا.


    لا شبّاك تذاكر هنا ولا قائمة معالم. أرخوتي يطلب أيامًا لا ساعات — ويُريك في المقابل جورجيا تخلّت عنها
    معظم الخرائط منذ زمن بعيد.
  tip: >-
    أرخوتي منطقة حدودية: احمل جواز سفرك — فعلى المسار القادم من جوتا نقطة لشرطة الحدود تُفحص فيها الوثائق
    — وتحقّق من القواعد السارية للمنطقة الحدودية قبل الانطلاق. يمتد الموسم من أواخر يونيو حتى سبتمبر.
    لا متاجر ولا صرّاف آلي ولا تغطية هاتفية موثوقة، فاحمل النقود والطعام. في أوائل الصيف تفيض الأنهار،
    وكثيرًا ما تكون الجسور في مضيق تانيه متضررة؛ فأجّل هذا المقطع إلى أواخر يوليو. استعن بمرشد محلي أو
    صاحب خيل، ولا تعبر الممر وحدك من دون خبرة جبلية.
  route: >-
    من تبليسي اسلك الطريق العسكري الجورجي (E117، S3) حتى جينفالي، ثم تابع وادي أراغفي البشافي مرورًا ببريساخو،
    وادخل التفرّع الشديد الانحدار والحجري المؤدي إلى روشكا — 119 كم ونحو ثلاث ساعات إجمالًا. الكيلومترات
    الأخيرة وعرة فعلًا: تحتاج إلى سيارة دفع رباعي عالية الارتفاع عن الأرض (فئة الطرق الوعرة). تزوّد بالوقود
    في جينفالي أو بريساخو. في روشكا تبقى السيارة: فمسار الدفع الرباعي الموسمي عبر الممر إلى أخييلي من
    الأفضل تركه لسائق محلي — أو يوم إلى يومين سيرًا على الأقدام. أما البديل، من جهة كازبيغي، فسيرًا فقط:
    من جوتا عبر ممر أرخوتيستافي (3287 م). لا طريق يعبر الوادي؛ فهو ينتهي عند الحدود.
