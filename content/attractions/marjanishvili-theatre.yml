ka:
  name: კოტე მარჯანიშვილის თეატრი
  short: >-
    მოდერნის სტილის სახალხო სახლი მარჯანიშვილის ქუჩაზე, სადაც 1930 წლიდან ცხოვრობს კოტე მარჯანიშვილის
    დაარსებული დასი — თბილისის „საზოგადოებრივი თეატრი“.
  body: >-
    **როცა ზუბალაშვილების სახალხო სახლი 1909 წელს გაიხსნა, მის დარბაზში ხელოვნური განათება არ იყო, ამიტომ
    ყველა წარმოდგენა დღისით იმართებოდა — გვერდით კედლებში გაჭრილი დიდი სარკმლების შუქზე.** სარკმლები დიდი
    ხანია ამოვსებულია, შენობა კი მარჯანიშვილის ქუჩაზე უპირველესად საჩუქარია: კონსტანტინე ზუბალაშვილის
    ვაჟებმა — ლევანმა, სტეფანემ, პეტრემ და იაკობმა — ის მამის სახსოვრად, საკუთარი ხარჯით ააშენეს და ქალაქს
    აჩუქეს. პროექტი სტეფან კრიჩინსკის ეკუთვნის, მშენებლობას ალექსანდრე როგოისკი ხელმძღვანელობდა, შედეგი
    კი მარცხენა სანაპიროს მოდერნის ერთ-ერთი ღირსშესანიშნაობაა.


    დასი, რომელიც აქ ცხოვრობს, სხვაგან დაიბადა. კოტე მარჯანიშვილი (1872–1933), ყვარლელი მსახიობი და რეჟისორი,
    რომელიც მოსკოვის სამხატვრო თეატრში სტანისლავსკისთან მუშაობდა და ედვარდ გორდონ კრეგის სახელგანთქმულ
    „ჰამლეტზე“ ასისტენტი იყო, 1926 წელს რუსთაველის თეატრიდან წავიდა, 1928 წელს კი ქუთაისში ახალი თეატრი
    დააარსა. პირველ სეზონში ერნსტ ტოლერის „ჰოპლა, ჩვენ ვცოცხლობთ!“ და ლოპე დე ვეგას „ცხვრის წყარო“ დაიდგა.
    1930 წელს მთავრობამ დასი თბილისში, სახალხო სახლში გადმოიყვანა, 1933 წელს კი, მარჯანიშვილის გარდაცვალების
    შემდეგ, თეატრს მისი სახელი ეწოდა.


    ვერიკო ანჯაფარიძე და უშანგი ჩხეიძე გუცკოვის „ურიელ აკოსტაში“ თამაშობდნენ, რომელიც მარჯანიშვილმა 1929
    წელს დადგა — სპექტაკლი ისე შეეზარდა დასის სახელს, რომ ანჯაფარიძემ ის 1972 წელს აღადგინა. 2006 წლიდან
    თეატრს რეჟისორი ლევან წულაძე ხელმძღვანელობს და მარჯანიშვილის თეატრს „საზოგადოებრივი თეატრის“ სახელი
    დაუმკვიდრდა — სცენისა, რომელიც დღევანდელობას ეკამათება. სცენა სამი აქვს: დიდი, სხვენში მოწყობილი „სხვენი“
    და 2013 წლიდან — ახალი.


    მოდით სპექტაკლზე ან უბრალოდ დადექით მარჯანიშვილის მოედანზე შებინდებისას, როცა მაყურებელი შესასვლელთან
    იკრიბება. „გარდიანი“ ერთხელ წერდა: სხვა ქართული თეატრები ამ დონეს ოდნავ მაინც რომ უახლოვდებოდნენ,
    საქართველოში თეატრის კრიტიკოსობა ყველაზე სანატრელი პროფესია იქნებოდაო.
  tip: >-
    აფიშა და ბილეთები — marjanishvili.com-ზე, biletebi.ge-ზე ან სალაროში (+995 32 295 59 66). წარმოდგენების
    უმეტესობა ქართულადაა; სალაროში ჰკითხეთ, რომელ სპექტაკლს აქვს სუბტიტრები, ან აირჩიეთ ისეთი, სადაც მოძრაობა
    და მუსიკა სიტყვაზე მეტს ამბობს. „სხვენი“ პატარა სცენაა და ბილეთები იქ სწრაფად იყიდება. ადრე მიდით
    — დაგვიანებულს შეიძლება ანტრაქტამდე ლოდინი მოუწიოს. სპექტაკლის შემდეგ ვახშმისთვის აღმაშენებლის გამზირი
    და „ფაბრიკა“ სულ რამდენიმე წუთის სავალზეა.
  route: >-
    თეატრი მარჯანიშვილის ქუჩის 8 ნომერშია, თავისუფლების მოედნიდან დაახლოებით 2 კილომეტრში — მდინარის გაღმა,
    მანქანით ათ წუთში. საკუთარი სადგომი თეატრს არ აქვს, მარჯანიშვილის მოედანთან კი ადგილი იშვიათად თავისუფლდება;
    საუკეთესო შანსი აღმაშენებლის გამზირის გვერდით ქუჩებშია, ფასიან ადგილებზე, თუმცა საღამოს წრეების დარტყმა
    მოგიწევთ. უფრო ადვილია მეტრო: მარჯანიშვილის სადგური რამდენიმე წუთის სავალზეა, რუსთაველიდან ერთი გაჩერებით.
    ეკონომკლასის მანქანა საკმარისია — და რაც უფრო პატარაა, მით უკეთესი ამ ქუჩებისთვის.
en:
  name: Kote Marjanishvili Theatre
  short: >-
    An Art Nouveau people's house on Marjanishvili Street, home since 1930 to the company Kote Marjanishvili
    founded — Tbilisi's 'social theatre'.
  body: >-
    **When the Zubalov People's House opened in 1909, its hall had no artificial light, so every performance
    was given by day, lit through tall windows cut into the side walls.** The windows are long filled
    in, but the building on Marjanishvili Street remains, above all, a gift: the four sons of Konstantine
    Zubalashvili (Zubalov) — Levan, Stepane, Petre and Iakob — built it at their own expense in their
    father's memory and gave it to the city. Stefan Kryczyński drew the design, Aleksander Rogojski led
    the construction, and the result is an Art Nouveau landmark of the left bank.


    The company that lives here was born elsewhere. Kote Marjanishvili (1872–1933), an actor and director
    from Kvareli who had worked with Stanislavski at the Moscow Art Theatre and assisted on Edward Gordon
    Craig's celebrated Hamlet, left the Rustaveli Theatre in 1926 and in 1928 founded a new theatre in
    Kutaisi. Its first season included Ernst Toller's Hoppla, We're Alive! and Lope de Vega's Fuenteovejuna.
    In 1930 the government moved the company to Tbilisi, into the People's House, and after Marjanishvili's
    death in 1933 it took his name.


    Veriko Anjaparidze and Ushangi Chkheidze starred in Marjanishvili's 1929 staging of Gutzkow's Uriel
    Acosta — a production so bound up with the company's name that Anjaparidze revived it in 1972. Since
    2006 the theatre has been led by the director Levan Tsuladze, and it has earned a name as Tbilisi's
    "social theatre", a stage that argues with the present. There are three stages: the main house, Skhveni
    in the attic, and a newer one opened in 2013.


    Come for a play, or just stand in Marjanishvili Square at dusk as the audience gathers. The Guardian
    once wrote, in effect, that if other Georgian theatres came anywhere near this level, theatre critic
    would be the most enviable job in the country.
  tip: >-
    Programme and tickets: marjanishvili.com, biletebi.ge or the box office (+995 32 295 59 66). Most
    performances are in Georgian; ask the box office which productions have surtitles, or choose one where
    movement and music carry the story. Skhveni, the attic stage, is small and sells out quickly. Arrive
    early — latecomers may have to wait for the interval. For supper afterwards, Aghmashenebeli Avenue
    and Fabrika are a few minutes' walk away.
  route: >-
    The theatre is at 8 Marjanishvili Street, about 2 km from Freedom Square — across the river, ten minutes
    by car. It has no car park, and space around Marjanishvili Square rarely frees up; your best chance
    is the paid bays in the side streets off Aghmashenebeli Avenue, though in the evening you will circle.
    The metro is easier: Marjanishvili station is a few minutes' walk, one stop from Rustaveli. An economy
    car is all you need — and on these streets, the smaller the better.
ru:
  name: Театр имени Коте Марджанишвили
  short: >-
    Народный дом в стиле модерн на улице Марджанишвили: с 1930 года здесь играет труппа, основанная Коте
    Марджанишвили, — «социальный театр» Тбилиси.
  body: >-
    **Когда в 1909 году открылся Зубаловский народный дом, искусственного освещения в его зале не было,
    и все спектакли давали днём — при свете высоких окон, прорезанных в боковых стенах.** Окна давно заложены,
    но здание на улице Марджанишвили по-прежнему прежде всего подарок: четверо сыновей Константина Зубалашвили
    (Зубалова) — Леван, Степане, Петре и Иаков — построили его на собственные средства в память об отце
    и преподнесли городу. Автором проекта был Стефан Крычиньский, стройкой руководил Александр Рогойский,
    и левый берег получил один из самых узнаваемых своих памятников модерна.


    Труппа, которая здесь живёт, родилась в другом городе. Коте Марджанишвили (1872–1933), актёр и режиссёр
    из Кварели, работал со Станиславским в Московском Художественном театре и ассистировал Эдварду Гордону
    Крэгу в его знаменитом «Гамлете». В 1926 году он ушёл из театра Руставели, а в 1928-м основал новый
    театр в Кутаиси. В первом сезоне там шли «Гоп-ля, мы живём!» Эрнста Толлера и «Фуэнте Овехуна» Лопе
    де Веги. В 1930 году власти перевели труппу в Тбилиси, в Народный дом, а после смерти Марджанишвили
    в 1933-м театр получил его имя.


    Верико Анджапаридзе и Ушанги Чхеидзе играли в «Уриэле Акосте» Гуцкова, поставленном Марджанишвили
    в 1929 году, — спектакль так сросся с именем труппы, что в 1972 году Анджапаридзе его возобновила.
    С 2006 года театром руководит режиссёр Леван Цуладзе, и за ним закрепилась слава «социального театра»
    Тбилиси — сцены, которая спорит с сегодняшним днём. Сцен здесь три: основная, «Схвени» под самой крышей
    (по-грузински это и значит «чердак») и новая, открытая в 2013 году.


    Приходите на спектакль — или просто постойте в сумерках на площади Марджанишвили, пока собирается
    публика. Британская «Гардиан» однажды написала, по сути, вот что: если бы другие грузинские театры
    хоть немного приближались к этому уровню, профессия театрального критика была бы самой завидной в
    стране.
  tip: >-
    Афиша и билеты — на marjanishvili.com, biletebi.ge или в кассе (+995 32 295 59 66). Большинство спектаклей
    идёт на грузинском; спросите в кассе, у каких постановок есть титры, или выберите такую, где историю
    ведут пластика и музыка. «Схвени», чердачная сцена, совсем маленькая, и билеты туда расходятся быстро.
    Приходите заранее: опоздавшим иногда приходится ждать антракта. Поужинать после спектакля можно на
    проспекте Агмашенебели или в «Фабрике» — до них несколько минут пешком.
  route: >-
    Театр стоит на улице Марджанишвили, 8, примерно в 2 км от площади Свободы — на другом берегу реки,
    в десяти минутах езды. Своей парковки у него нет, а у площади Марджанишвили места освобождаются редко;
    больше шансов найти платное место в переулках у проспекта Агмашенебели, хотя вечером придётся покружить.
    Проще на метро: станция «Марджанишвили» в нескольких минутах ходьбы, одна остановка от «Руставели».
    Хватит машины эконом-класса — а на этих улицах чем она меньше, тем лучше.
fa:
  name: تئاتر کوته مارجانیشویلی
  short: >-
    خانهٔ مردمیِ آر نوو در خیابان مارجانیشویلی که از ۱۹۳۰ خانهٔ گروهی است که کوته مارجانیشویلی بنیاد گذاشت
    — «تئاتر اجتماعی» تفلیس.
  body: >-
    **وقتی «خانهٔ مردم» زوبالوف در سال ۱۹۰۹ گشوده شد، تالارش هیچ نور مصنوعی نداشت؛ از این رو همهٔ اجراها
    در روز برگزار می‌شد، در روشنایی پنجره‌های بلندی که در دیوارهای جانبی گشوده بودند.** این پنجره‌ها مدت‌هاست
    پر شده‌اند، اما بنای خیابان مارجانیشویلی هنوز پیش از هر چیز یک هدیه است: چهار پسر کنستانتینه زوبالاشویلی
    (زوبالوف) — لوان، استپانه، پتره و یاکوب — آن را با هزینهٔ خود و به یاد پدرشان ساختند و به شهر بخشیدند.
    طرح را استفان کریچینسکی کشید، ساخت را الکساندر روگویسکی هدایت کرد و حاصل کار یکی از نشانه‌های شاخص
    سبک آر نوو در ساحل چپ رود شد.


    گروهی که امروز در این خانه زندگی می‌کند جای دیگری زاده شد. کوته مارجانیشویلی (۱۸۷۲–۱۹۳۳)، بازیگر و
    کارگردانی از کوارلی، در تئاتر هنری مسکو با استانیسلاوسکی کار کرده و در «هملت» پرآوازهٔ ادوارد گوردون
    کریگ دستیار بود. او در ۱۹۲۶ از تئاتر روستاولی جدا شد و در ۱۹۲۸ تئاتری تازه در کوتائیسی بنیاد گذاشت.
    در نخستین فصل آن «هوپلا، ما زنده‌ایم!» اثر ارنست تولر و «فوئنته اووخونا» اثر لوپه د وگا روی صحنه رفت.
    در ۱۹۳۰ دولت گروه را به تفلیس و به «خانهٔ مردم» منتقل کرد و پس از مرگ مارجانیشویلی در ۱۹۳۳، تئاتر
    نام او را گرفت.


    وریکو آنجاپاریدزه و اوشانگی چخئیدزه در «اوریل آکوستا»ی گوتسکوف بازی کردند که مارجانیشویلی در ۱۹۲۹
    به صحنه برد — نمایشی که چنان با نام این گروه گره خورد که آنجاپاریدزه در ۱۹۷۲ دوباره آن را روی صحنه
    برد. از ۲۰۰۶ لوان تسولادزه، کارگردان، ادارهٔ تئاتر را بر عهده دارد و این تئاتر به «تئاتر اجتماعی»
    تفلیس شهرت یافته است؛ صحنه‌ای که با زمانهٔ خود جدل می‌کند. سه صحنه دارد: سالن اصلی، «سخونی» زیر شیروانی
    (که در گرجی یعنی همان «اتاق زیرشیروانی») و صحنه‌ای تازه‌تر که در ۲۰۱۳ گشوده شد.


    برای دیدن نمایشی بیایید، یا فقط هنگام غروب در میدان مارجانیشویلی بایستید و گرد آمدن تماشاگران را تماشا
    کنید. روزنامهٔ گاردین یک بار، به این مضمون، نوشت که اگر دیگر تئاترهای گرجستان اندکی به این سطح نزدیک
    می‌شدند، منتقد تئاتر بودن رشک‌برانگیزترین شغل این کشور می‌شد.
  tip: >-
    برنامه و بلیت: marjanishvili.com، biletebi.ge یا گیشهٔ تئاتر (+۹۹۵ ۳۲ ۲۹۵ ۵۹ ۶۶). بیشتر اجراها به
    زبان گرجی است؛ از گیشه بپرسید کدام نمایش زیرنویس دارد، یا نمایشی را برگزینید که حرکت و موسیقی بار
    روایتش را می‌کشند. «سخونی»، صحنهٔ زیرشیروانی، کوچک است و بلیت‌هایش زود تمام می‌شود. زودتر برسید؛ دیرآمدگان
    ممکن است ناچار شوند تا میان‌پرده منتظر بمانند. برای شام پس از نمایش، خیابان آغماشنبلی و «فابریکا»
    تنها چند دقیقه پیاده فاصله دارند.
  route: >-
    تئاتر در شمارهٔ ۸ خیابان مارجانیشویلی است، حدود ۲ کیلومتر از میدان آزادی — آن سوی رود، ده دقیقه با
    خودرو. پارکینگ ندارد و در اطراف میدان مارجانیشویلی جای پارک به‌ندرت خالی می‌شود؛ بهترین شانس شما جاهای
    پارک پولی در کوچه‌های فرعی خیابان آغماشنبلی است، هرچند شب‌ها باید چند دور بزنید. مترو ساده‌تر است:
    ایستگاه مارجانیشویلی چند دقیقه پیاده راه است و تنها یک ایستگاه با روستاولی فاصله دارد. خودروی کلاس
    اقتصادی کافی است — و در این خیابان‌ها هرچه کوچک‌تر، بهتر.
he:
  name: תיאטרון קוטה מרג'נישווילי
  short: >-
    בית העם בסגנון ארט נובו ברחוב מרג'נישווילי, מאז 1930 משכנה של הלהקה שייסד קוטה מרג'נישווילי – "התיאטרון
    החברתי" של טביליסי.
  body: >-
    **כשנפתח בית העם של זובלוב ב־1909, לא הייתה באולם שלו תאורה מלאכותית, ולכן כל ההצגות הועלו ביום, לאורם
    של חלונות גבוהים שנפרצו בקירות הצד.** החלונות נאטמו מזמן, אבל הבניין ברחוב מרג'נישווילי הוא עדיין,
    לפני הכול, מתנה: ארבעת בניו של קונסטנטינה זובלשווילי (זובלוב) – לבאן, סטפנה, פטרה ויאקוב – בנו אותו
    על חשבונם לזכר אביהם והעניקו אותו לעיר. את התכנון שרטט סטפן קריצ'ינסקי, את הבנייה הוביל אלכסנדר רוגויסקי,
    והתוצאה היא אחד מציוני הדרך של הארט נובו בגדה השמאלית של הנהר.


    הלהקה שגרה כאן נולדה במקום אחר. קוטה מרג'נישווילי (1872–1933), שחקן ובמאי מקוורלי, עבד עם סטניסלבסקי
    בתיאטרון האמנותי של מוסקבה והיה עוזר במאי ב"המלט" המפורסם של אדוארד גורדון קרייג. ב־1926 עזב את תיאטרון
    רוסתוולי, וב־1928 ייסד תיאטרון חדש בקוטאיסי. בעונה הראשונה עלו שם "הופלה, אנחנו חיים!" של ארנסט טולר
    ו"פואנטה אובחונה" של לופה דה וגה. ב־1930 העבירה הממשלה את הלהקה לטביליסי, אל בית העם, ואחרי מותו של
    מרג'נישווילי ב־1933 נקרא התיאטרון על שמו.


    וריקו אנג'אפרידזה ואושנגי צ'חאידזה שיחקו ב"אוריאל אקוסטה" של גוצקוב, שמרג'נישווילי העלה ב־1929 – הפקה
    שנקשרה בשמה של הלהקה עד כדי כך שאנג'אפרידזה חידשה אותה ב־1972. מאז 2006 עומד בראש התיאטרון הבמאי לבאן
    צולדזה, ויצא לו שם של "התיאטרון החברתי" של טביליסי – במה שמתווכחת עם ההווה. יש בו שלוש במות: האולם
    הראשי, "סחווני" בעליית הגג (זו בדיוק משמעות המילה בגאורגית) ובמה חדשה יותר שנפתחה ב־2013.


    בואו להצגה, או פשוט עמדו בכיכר מרג'נישווילי בשעת בין ערביים, כשהקהל מתאסף. ה"גרדיאן" כתב פעם, פחות
    או יותר, שאילו תיאטראות אחרים בגאורגיה היו מתקרבים ולו במעט לרמה הזאת, מבקר תיאטרון היה המקצוע הנחשק
    ביותר במדינה.
  tip: >-
    תוכנייה וכרטיסים: marjanishvili.com, biletebi.ge או בקופה (+995 32 295 59 66). רוב ההצגות בגאורגית;
    שאלו בקופה לאילו הפקות יש כתוביות, או בחרו הצגה שבה התנועה והמוזיקה נושאות את הסיפור. "סחווני", הבמה
    שבעליית הגג, קטנה, והכרטיסים אליה אוזלים מהר. הגיעו מוקדם – מאחרים עלולים להיאלץ להמתין עד ההפסקה.
    לארוחת ערב אחרי ההצגה, שדרת אגמשנבלי ו"פבריקה" נמצאות במרחק כמה דקות הליכה.
  route: >-
    התיאטרון נמצא ברחוב מרג'נישווילי 8, כ־2 ק"מ מכיכר החירות – מעבר לנהר, עשר דקות נסיעה. אין לו חניון,
    וסביב כיכר מרג'נישווילי מקום מתפנה לעיתים רחוקות; הסיכוי הטוב ביותר הוא בחנייה בתשלום ברחובות הצדדיים
    של שדרת אגמשנבלי, אם כי בערב תצטרכו להסתובב לא מעט. קל יותר במטרו: תחנת מרג'נישווילי נמצאת כמה דקות
    הליכה משם, תחנה אחת מרוסתוולי. רכב בקטגוריית אקונומי מספיק – וברחובות האלה, כמה שקטן יותר, יותר טוב.
ar:
  name: مسرح كوتي مارجانيشفيلي
  short: >-
    دار شعب على طراز الآر نوفو في شارع مارجانيشفيلي، تحتضن منذ 1930 الفرقة التي أسسها كوتي مارجانيشفيلي
    — «المسرح الاجتماعي» في تبليسي.
  body: >-
    **حين افتُتحت دار الشعب التي شيّدها آل زوبالوف عام 1909، لم تكن في قاعتها أي إنارة اصطناعية، فكانت
    العروض كلها تُقدَّم نهارًا على ضوء نوافذ عالية فُتحت في الجدران الجانبية.** سُدّت تلك النوافذ منذ
    زمن بعيد، لكن المبنى القائم في شارع مارجانيشفيلي يبقى قبل كل شيء هدية: فقد بناه أبناء كونستانتينه
    زوبالاشفيلي (زوبالوف) الأربعة — ليفان وستيبانه وبيتره وياكوب — على نفقتهم الخاصة تخليدًا لذكرى أبيهم،
    ثم وهبوه للمدينة. وضع التصميمَ ستيفان كريتشينسكي، وأشرف على البناء ألكسندر روغويسكي، فكانت الثمرة
    معلمًا من معالم الفن الحديث (آر نوفو) على الضفة اليسرى للنهر.


    أما الفرقة التي تسكنه فقد وُلدت في مكان آخر. كان كوتي مارجانيشفيلي (1872–1933)، الممثل والمخرج القادم
    من كفاريلي، قد عمل مع ستانيسلافسكي في مسرح موسكو الفني، وكان مساعدًا لإدوارد غوردون كريغ في «هاملت»
    الشهير. وفي عام 1926 ترك مسرح روستافيلي، ثم أسس عام 1928 مسرحًا جديدًا في كوتايسي، ضمّ موسمه الأول
    مسرحية إرنست تولر «هوبلا، نحن أحياء!» ومسرحية لوبي دي فيغا «فوينتي أوبيخونا». وفي عام 1930 نقلت الحكومة
    الفرقة إلى تبليسي، إلى دار الشعب، وبعد وفاة مارجانيشفيلي عام 1933 حمل المسرح اسمه.


    وقد تألّقت فيريكو أنجاباريدزه ومعها أوشانغي تشخيدزه في «أوريل أكوستا» لغوتسكوف، الذي أخرجه مارجانيشفيلي
    عام 1929 — عرضٌ ارتبط باسم الفرقة حتى إن أنجاباريدزه أعادت إحياءه عام 1972. ومنذ 2006 يدير المسرح
    المخرج ليفان تسولادزه، وقد اكتسب سمعة «المسرح الاجتماعي» في تبليسي: خشبة تُجادل الحاضر. وللمسرح ثلاث
    خشبات: القاعة الرئيسية، و«سخفيني» في العلّية (وهذا معنى الكلمة بالجورجية)، وخشبة أحدث افتُتحت عام
    2013.


    تعالَ لمشاهدة عرض، أو قف فحسب في ساحة مارجانيشفيلي عند الغسق والجمهور يتوافد. وقد كتبت صحيفة «الغارديان»
    مرةً ما معناه أنه لو اقتربت المسارح الجورجية الأخرى ولو قليلًا من هذا المستوى، لكانت مهنة الناقد المسرحي
    أكثر المهن إثارةً للحسد في البلاد.
  tip: >-
    البرنامج والتذاكر: marjanishvili.com أو biletebi.ge أو شباك التذاكر (+995 32 295 59 66). معظم العروض
    باللغة الجورجية؛ اسأل في الشباك عن العروض المصحوبة بترجمة نصية، أو اختر عرضًا تحمل فيه الحركةُ والموسيقى
    الحكاية. «سخفيني»، خشبة العلّية، صغيرة وتنفد تذاكرها بسرعة. احضر مبكرًا، فقد يضطر المتأخرون إلى انتظار
    الاستراحة. ولعشاء بعد العرض، لا تبعد جادة أغماشينيبيلي و«فابريكا» سوى دقائق سيرًا على الأقدام.
  route: >-
    يقع المسرح في الرقم 8 من شارع مارجانيشفيلي، على بعد نحو 2 كم من ساحة الحرية — على الضفة الأخرى من
    النهر، وعلى مسافة عشر دقائق بالسيارة. لا موقف سيارات خاصًّا به، ونادرًا ما يخلو مكان حول ساحة مارجانيشفيلي؛
    وأفضل فرصة لك في المواقف المدفوعة بالشوارع الجانبية المتفرعة من جادة أغماشينيبيلي، وإن كنت ستدور طويلًا
    في المساء. المترو أسهل: محطة مارجانيشفيلي على بعد دقائق سيرًا، وهي على بعد محطة واحدة من روستافيلي.
    تكفيك سيارة من الفئة الاقتصادية — وفي هذه الشوارع، كلما صغرت كان أفضل.
