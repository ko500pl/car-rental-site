ka:
  name: ბოლნისი
  short: >-
    კატარინენფელდი, 1818 წლის შვაბური კოლონია: გერმანული სახლების სწორი ქუჩები, წისქვილის ქუჩა, 2020 წლის
    მუზეუმი, ირგვლივ კი ვენახი და სპილენძი.
  body: >-
    **ბოლნისს ორი ისტორია აქვს, ერთმანეთისგან რვა კილომეტრით დაშორებული: საქართველოში უძველესი შემორჩენილი
    ეკლესია და 1818 წელს თითქოს სახაზავით დაგეგმილი გერმანული ქალაქი.**


    ბოლნისის სიონი, 478–493 წლებში აგებული, სამხრეთით, სოფელ ქვემო ბოლნისში დგას. თავად ქალაქი 1818 წელს
    დაიწყო, როცა ვიურტემბერგიდან წამოსული შვაბური ოჯახები ძველ სოფლებთან — სამტრედოსთან, ყორანთასა და
    ველკეთილთან — დასახლდნენ და კოლონიას კატარინენფელდი უწოდეს, ალექსანდრე I-ის დის, ვიურტემბერგის დედოფალ
    ეკატერინე პავლოვნას პატივსაცემად. რვა წლის შემდეგ, 1826 წლის რუსეთ-სპარსეთის ომის დროს, კოლონიას თავს
    დაესხნენ: მაშინდელი 85 ოჯახიდან 30 ადამიანი მოკლეს, 130 ტყვედ წაიყვანეს. 1829 წელს აქ გამოვლილ ფრიდრიხ
    პაროტს ტყვეთა ნახევარი ჯერაც დაკარგული დახვდა; ოჯახებს მან ორი ქალის ამბავი მოუტანა, რომლებსაც შემთხვევით
    ერევნის ბაზარში გადაეყარა.


    გადარჩენილებმა ყველაფერი აღადგინეს და კოლონია აყვავდა: ღვინის, კონიაკისა და ყველის ქარხნები, სარწყავი
    არხები, სახანძრო რაზმი, სასულე ორკესტრი, ველოსიპედისტთა და ფეხბურთელთა გუნდებიც კი. 1921 წელს საბჭოთა
    ხელისუფლებამ დასახლებას როზა ლუქსემბურგის პატივსაცემად ლუქსემბურგი უწოდა; 1941 წელს ყველა გერმანელი,
    ვინც ქართველზე არ იყო დაქორწინებული, ციმბირსა და ყაზახეთში გადაასახლეს, 1943 წლის 3 აპრილს კი ქალაქს
    ბოლნისი ეწოდა.


    კოლონისტების გეგმა დღესაც ცოცხალია: აღმოსავლეთიდან დასავლეთისკენ გაჭიმული სწორი, პარალელური ქუჩები,
    ორსართულიანი სახლები ციცაბო ფრონტონებითა და ხის ნაკვეთი აივნებით. ყველაზე კარგად ეს წისქვილის ქუჩაზე
    ჩანს, სადაც XX საუკუნის დასაწყისის რამდენიმე გერმანული წარწერა დღემდე შემორჩა. მერე ბოლნისის მუზეუმს
    ესტუმრეთ: 2020 წელს გახსნილი და ევროპის წლის მუზეუმის პრემიაზე წარდგენილი, ის ოთხ დარბაზში დმანისის
    უძველესი ადამიანებიდან საყდრისის ოქროს მაღაროსა და გერმანელ კოლონისტებამდე მიგიძღვებათ.


    ბოლო ქუჩის მიღმა ვენახები იწყება, უფრო შორს კი კაზრეთთან მადნეულის სპილენძისა და ოქროს საბადოა. ერთი
    ახსნით, ქალაქის სახელიც ამ წიაღს ეხმიანება: სულხან-საბას განმარტებით, „ბოვი არს, სადა ოქრო, ვერცხლი,
    სპილენძი და მისთანანი ითხრების და გამოიდნობის“.
  tip: >-
    ქალაქს ორი საათი დაუთმეთ, ბოლნისის სიონთან და წუღრუღაშენთან ერთად კი ნახევარი დღე. დაიწყეთ მუზეუმით
    (სამუშაო დღეები წინასწარ გადაამოწმეთ), შემდეგ წისქვილის ქუჩა და მისი მეზობელი ქუჩები მოიარეთ. სახლებში
    დღემდე ცხოვრობენ: ტროტუარიდან დაათვალიერეთ და ეზოში შესვლამდე ნებართვა იკითხეთ. ცენტრში კაფეები, ბანკომატები
    და აფთიაქია. ამ ვაკეზე ზაფხული ცხელია — რეკორდი 40,2 °C-ია, — ამიტომ დილით ან საღამოს ისეირნეთ. ბოლნისის
    სიონისთვის ნავიგატორში თავად ტაძარი მონიშნეთ: ის ქვემო ბოლნისშია და არა ქალაქში.
  route: >-
    მთელ საქმეს S6 აკეთებს. თბილისიდან ფონიჭალის გავლით სამხრეთით მარნეულამდე იარეთ, სადაც გზა დასავლეთით
    უხვევს და მაშავერას ხეობით ბოლნისამდე მიდის — სულ დაახლოებით 64 კილომეტრი და საათი და ათი წუთი. ორზოლიანი
    ასფალტი კარგ მდგომარეობაშია, დღისით მარნეულთან მოძრაობა მჭიდროა; ეკონომ-კლასის მანქანა ნებისმიერ სეზონზე
    საკმარისია. საწვავი მარნეულში ან ბოლნისის შესასვლელთან ჩაასხით. ცენტრში ქუჩის პარკინგი უფასოა. აქედან
    S6 ქვეშის ციხის გავლით კაზრეთისა და დმანისისკენ მიდის, Sh154 კი სამხრეთით, ბოლნისის სიონისა და წუღრუღაშენისკენ.
en:
  name: Bolnisi Town
  short: >-
    Katharinenfeld, the Swabian colony of 1818: straight streets of German houses, Mill Street, a museum
    opened in 2020, and vineyards and copper all around.
  body: >-
    **Bolnisi has two histories eight kilometres apart: the oldest surviving church in Georgia, and a
    German town laid out as if with a ruler in 1818.**


    Bolnisi Sioni, built in 478–493, stands to the south, in Kvemo Bolnisi. The town itself began in 1818,
    when Swabian families from Württemberg settled beside the old villages of Samtredo, Koranta and Velketili
    and called their colony Katharinenfeld, after the Tsar's sister Catherine Pavlovna, Queen of Württemberg.
    Eight years later, in the Russo-Persian war of 1826, raiders fell on it: of its 85 families, 30 people
    were killed and 130 carried off. Friedrich Parrot, passing in 1829, found half the captives still
    missing, and brought news of two women he had met by chance in Yerevan's bazaar.


    The survivors rebuilt and the colony prospered: wine, cognac and cheese works, irrigation canals,
    a fire brigade, a brass band, even cycling and football clubs. In 1921 the Soviets renamed it Luxemburg,
    after Rosa Luxemburg; in 1941 every German not married to a Georgian was deported to Siberia or Kazakhstan,
    and on 3 April 1943 the town became Bolnisi.


    The colonists' plan survives: straight, parallel streets running east to west, two-storey houses with
    steep gables and carved wooden balconies. Mill Street shows it best, with a few German signs from
    the early 20th century still in place. Then visit the Bolnisi Museum, opened in 2020 and nominated
    for European Museum of the Year; its four halls run from the Dmanisi hominins and the gold mine of
    Sakdrisi to the German settlers.


    Beyond the last street the vineyards begin, and further off lies the Madneuli copper and gold deposit
    at Kazreti. By one derivation the name itself remembers the ore: Sulkhan-Saba Orbeliani defined "bovi"
    as a place where gold, silver and copper are dug and smelted.
  tip: >-
    Give the town two hours, or half a day with Bolnisi Sioni and Tsughrughasheni. Start at the museum
    (check its opening days before you go), then walk Mill Street and the lanes around it. The houses
    are lived in, so admire them from the pavement and ask before entering a yard. The centre has cafés,
    cash machines and a pharmacy. Summers on this plain are hot, with a record of 40.2 °C, so walk in
    the morning or early evening. For Bolnisi Sioni, set your navigator to the church itself: it is in
    Kvemo Bolnisi, not in town.
  route: >-
    The S6 does all the work. Leave Tbilisi south past Ponichala to Marneuli, where the road swings west
    up the Mashavera valley to Bolnisi: about 64 km and an hour and ten minutes. It is two-lane asphalt
    in good condition, busy around Marneuli in the daytime, and an economy car is enough in any season.
    Fuel is easy to find in Marneuli and at the entrance to Bolnisi. Street parking in the centre is free.
    From here the S6 continues past Kveshi Fortress to Kazreti and Dmanisi, while the Sh154 runs south
    to Bolnisi Sioni and Tsughrughasheni.
ru:
  name: Город Болниси
  short: >-
    Екатериненфельд, швабская колония 1818 года: прямые улицы немецких домов, Мельничная улица, музей
    2020 года, а вокруг — виноградники и медь.
  body: >-
    **У Болниси две истории, и их разделяют восемь километров: древнейшая сохранившаяся церковь Грузии
    и немецкий городок, в 1818 году расчерченный будто по линейке.**


    Болнисский Сион, построенный в 478–493 годах, стоит к югу, в Квемо-Болниси. История самого города
    началась в 1818 году, когда швабские семьи из Вюртемберга поселились рядом со старыми сёлами Самтредо,
    Коранта и Велкетили и назвали свою колонию Екатериненфельд — в честь сестры императора, Екатерины
    Павловны, королевы Вюртемберга. Восемь лет спустя, в русско-персидскую войну 1826 года, на колонию
    обрушились налётчики: из 85 семей 30 человек были убиты и 130 угнаны в плен. Фридрих Паррот, проезжавший
    здесь в 1829 году, застал половину пленных всё ещё пропавшими и привёз вести о двух женщинах, которых
    случайно встретил на ереванском базаре.


    Уцелевшие отстроились, и колония процветала: винный, коньячный и сыроваренный заводы, оросительные
    каналы, пожарная команда, духовой оркестр, даже велосипедный и футбольный клубы. В 1921 году советская
    власть переименовала её в Люксембург — в честь Розы Люксембург; в 1941 году всех немцев, кроме состоявших
    в браке с грузинами, депортировали в Сибирь или Казахстан, а 3 апреля 1943 года город стал Болниси.


    План колонистов уцелел: прямые параллельные улицы с востока на запад, двухэтажные дома с крутыми фронтонами
    и резными деревянными балконами. Лучше всего его видно на Мельничной улице, где кое-где ещё держатся
    немецкие вывески начала XX века. Затем загляните в Болнисский музей, открытый в 2020 году и номинированный
    на премию «Европейский музей года»; его четыре зала ведут от дманисских гоминидов и золотого рудника
    Сакдриси до немецких колонистов.


    За последней улицей начинаются виноградники, а дальше, у Казрети, лежит Маднеульское медно-золотое
    месторождение. По одной из версий, об этой руде помнит и само имя: Сулхан-Саба Орбелиани определял
    «бови» как место, где добывают и плавят золото, серебро и медь.
  tip: >-
    Отведите на город два часа, а вместе с Болнисским Сионом и Цугругашени — полдня. Начните с музея (заранее
    проверьте, в какие дни он открыт), затем пройдитесь по Мельничной улице и окрестным переулкам. В домах
    живут люди, так что любуйтесь с тротуара и спрашивайте разрешения, прежде чем войти во двор. В центре
    есть кафе, банкоматы и аптека. Лето на этой равнине жаркое — рекорд 40,2 °C, — поэтому гуляйте утром
    или ранним вечером. Для Болнисского Сиона ставьте в навигаторе саму церковь: она в Квемо-Болниси,
    а не в городе.
  route: >-
    Всю работу делает S6. Из Тбилиси на юг мимо Поничалы до Марнеули, где дорога поворачивает на запад
    и поднимается долиной Машаверы к Болниси: около 64 км и час десять минут. Двухполосный асфальт в хорошем
    состоянии, днём у Марнеули оживлённое движение; машины эконом-класса хватит в любое время года. Заправки
    легко найти в Марнеули и на въезде в Болниси. Парковка на улицах в центре бесплатная. Отсюда S6 идёт
    дальше мимо крепости Квеши к Казрети и Дманиси, а Sh154 уходит на юг к Болнисскому Сиону и Цугругашени.
fa:
  name: شهر بولنیسی
  short: >-
    کاتارینن‌فلد، کوچ‌نشین شوابیِ سال ۱۸۱۸: خیابان‌های راست با خانه‌های آلمانی، خیابان آسیاب، موزه‌ای
    گشوده در ۲۰۲۰، و تاکستان‌ها و مس در پیرامون.
  body: >-
    **بولنیسی دو تاریخ دارد که هشت کیلومتر از هم فاصله دارند: کهن‌ترین کلیسای برجای‌ماندهٔ گرجستان، و
    شهرکی آلمانی که در ۱۸۱۸ گویی با خط‌کش طراحی شد.**


    سیونی بولنیسی، ساخته‌شده در سال‌های ۴۷۸ تا ۴۹۳، در جنوب، در کوِمو بولنیسی، ایستاده است. اما خود شهر
    در ۱۸۱۸ آغاز شد، وقتی خانواده‌های شوابی از وورتمبرگ کنار روستاهای کهن سامترِدو، کورانتا و ولکتیلی
    ساکن شدند و کوچ‌نشین خود را کاتارینن‌فلد نامیدند، به نام خواهر تزار، یکاترینا پاولوونا، ملکهٔ وورتمبرگ.
    هشت سال بعد، در جنگ روس و ایران در ۱۸۲۶، مهاجمان بر آن تاختند: از ۸۵ خانوادهٔ آن، ۳۰ تن کشته و ۱۳۰
    تن به اسارت برده شدند. فریدریش پاروت که در ۱۸۲۹ از اینجا گذشت، دریافت که نیمی از اسیران هنوز ناپیدایند،
    و خبر دو زن را آورد که به‌تصادف در بازار ایروان دیده بود.


    بازماندگان از نو ساختند و کوچ‌نشین شکوفا شد: کارگاه‌های شراب، کنیاک و پنیر، کانال‌های آبیاری، گروه
    آتش‌نشانی، دستهٔ موسیقی بادی، و حتی باشگاه‌های دوچرخه‌سواری و فوتبال. در ۱۹۲۱ شوروی‌ها به یاد رزا
    لوکزامبورگ نام آن را لوکزامبورگ گذاشتند؛ در ۱۹۴۱ هر آلمانی‌ای که با گرجی‌ای ازدواج نکرده بود به سیبری
    یا قزاقستان تبعید شد، و در ۳ آوریل ۱۹۴۳ شهر بولنیسی نام گرفت.


    نقشهٔ کوچ‌نشینان به جا مانده است: خیابان‌های راست و موازی که از خاور به باختر می‌روند، و خانه‌های
    دوطبقه با شیروانی‌های تند و بالکن‌های چوبیِ کنده‌کاری‌شده. خیابان آسیاب آن را از همه بهتر نشان می‌دهد،
    و چند تابلوی آلمانی از آغاز سدهٔ بیستم هنوز بر جای خود مانده است. سپس به موزهٔ بولنیسی سر بزنید که
    در ۲۰۲۰ گشوده شد و نامزد جایزهٔ موزهٔ سال اروپا شد؛ چهار تالار آن از انسان‌تباران دمانیسی و معدن طلای
    ساکدریسی تا کوچ‌نشینان آلمانی را در بر می‌گیرد.


    پس از آخرین خیابان تاکستان‌ها آغاز می‌شوند، و دورتر، در کازرتی، کانسار مس و طلای مادنئولی جای دارد.
    بنا به یک ریشه‌شناسی، خود نام شهر هم این کانی را به یاد دارد: سولخان-سابا اوربلیانی «بووی» را جایی
    تعریف کرده است که در آن طلا، نقره و مس استخراج و ذوب می‌کنند.
  tip: >-
    برای شهر دو ساعت وقت بگذارید، یا با سیونی بولنیسی و تسوغروغاشنی، نیم‌روز. از موزه آغاز کنید (پیش از
    رفتن روزهای بازبودنش را بررسی کنید)، سپس در خیابان آسیاب و کوچه‌های پیرامونش قدم بزنید. در این خانه‌ها
    مردم زندگی می‌کنند، پس از پیاده‌رو تماشا کنید و پیش از رفتن به حیاطی اجازه بگیرید. مرکز شهر کافه،
    خودپرداز و داروخانه دارد. تابستان در این دشت گرم است و رکورد دما ۴۰٫۲ درجهٔ سانتی‌گراد است، پس صبح
    یا سر شب قدم بزنید. برای سیونی بولنیسی، مسیریاب را روی خود کلیسا تنظیم کنید: کلیسا در کوِمو بولنیسی
    است، نه در شهر.
  route: >-
    همهٔ کار را جادهٔ S6 انجام می‌دهد. از تفلیس رو به جنوب از کنار پونیچالا تا مارنئولی بروید، جایی که
    جاده به غرب می‌پیچد و از درهٔ ماشاورا بالا می‌رود تا بولنیسی: حدود ۶۴ کیلومتر و یک ساعت و ده دقیقه.
    جاده‌ای دوخطه با آسفالت خوب است، که در روز پیرامون مارنئولی شلوغ می‌شود، و در هر فصلی خودروی اقتصادی
    کافی است. سوخت در مارنئولی و در ورودی بولنیسی به‌آسانی پیدا می‌شود. پارک در خیابان‌های مرکز شهر رایگان
    است. از اینجا S6 از کنار قلعهٔ کوِشی تا کازرتی و دمانیسی ادامه می‌یابد، و Sh154 رو به جنوب به سیونی
    بولنیسی و تسوغروغاشنی می‌رود.
he:
  name: העיירה בולניסי
  short: >-
    קתריננפלד, המושבה השוואבית מ-1818: רחובות ישרים של בתים גרמניים, רחוב הטחנה, מוזיאון שנפתח ב-2020,
    ומסביב כרמים ונחושת.
  body: >-
    **לבולניסי שתי היסטוריות, שמונה קילומטרים זו מזו: הכנסייה העתיקה ביותר ששרדה בגאורגיה, ועיירה גרמנית
    שתוכננה ב-1818 כאילו בסרגל.**


    בולניסי סיוני, שנבנתה בשנים 478–493, עומדת מדרום, בקוומו בולניסי. תולדות העיירה עצמה החלו ב-1818,
    כשמשפחות שוואביות מווירטמברג התיישבו לצד הכפרים הוותיקים סמטרדו, קורנטה ווולקטילי וקראו למושבתן קתריננפלד,
    על שם אחות הצאר, יקטרינה פבלובנה, מלכת וירטמברג. שמונה שנים אחר כך, במלחמת רוסיה–פרס של 1826, הסתערו
    עליה פושטים: מתוך 85 משפחותיה נהרגו 30 איש ו-130 נלקחו בשבי. פרידריך פארוט, שעבר כאן ב-1829, מצא שמחצית
    השבויים עדיין נעדרים, והביא ידיעות על שתי נשים שפגש במקרה בשוק של ירוואן.


    הניצולים בנו מחדש והמושבה שגשגה: מפעלי יין, קוניאק וגבינה, תעלות השקיה, מכבי אש, תזמורת כלי נשיפה,
    ואפילו מועדוני אופניים וכדורגל. ב-1921 שינו הסובייטים את שמה ללוקסמבורג, על שם רוזה לוקסמבורג; ב-1941
    גורש כל גרמני שלא היה נשוי לגאורגי או לגאורגית לסיביר או לקזחסטן, וב-3 באפריל 1943 הפכה העיירה לבולניסי.


    תוכנית המתיישבים שרדה: רחובות ישרים ומקבילים הנמשכים ממזרח למערב, בתים בני שתי קומות עם גמלונים תלולים
    ומרפסות עץ מגולפות. רחוב הטחנה מציג אותה במיטבה, ועדיין נותרו בו כמה שלטים גרמניים מראשית המאה ה-20.
    אחר כך בקרו במוזיאון בולניסי, שנפתח ב-2020 והיה מועמד לפרס המוזיאון האירופי של השנה; ארבעת אולמותיו
    מובילים מן ההומינינים של דמניסי ומכרה הזהב של סקדריסי ועד המתיישבים הגרמנים.


    מעבר לרחוב האחרון מתחילים הכרמים, ורחוק יותר, בקזרטי, שוכן מרבץ הנחושת והזהב של מדנאולי. לפי אחד ההסברים,
    גם השם עצמו זוכר את העפרה: סולחאן-סבא אורבליאני הגדיר "בובי" כמקום שבו כורים ומתיכים זהב, כסף ונחושת.
  tip: >-
    הקדישו לעיירה שעתיים, או חצי יום יחד עם בולניסי סיוני וצוגרוגאשני. התחילו במוזיאון (בדקו מראש באילו
    ימים הוא פתוח), ואחר כך טיילו ברחוב הטחנה ובסמטאות שסביבו. בבתים גרים אנשים, אז התפעלו מן המדרכה ובקשו
    רשות לפני שאתם נכנסים לחצר. במרכז יש בתי קפה, כספומטים ובית מרקחת. הקיץ במישור הזה חם, והשיא שנמדד
    הוא 40.2 מעלות, לכן טיילו בבוקר או בשעות הערב המוקדמות. לבולניסי סיוני, כוונו את הניווט אל הכנסייה
    עצמה: היא נמצאת בקוומו בולניסי, לא בעיירה.
  route: >-
    כביש S6 עושה את כל העבודה. צאו מטביליסי דרומה, על פני פוניצ'לה, עד מרנאולי, שם הכביש פונה מערבה ועולה
    בעמק המשאוורה עד בולניסי: כ-64 ק״מ ושעה ועשר דקות. זהו כביש דו-נתיבי סלול במצב טוב, עמוס סביב מרנאולי
    בשעות היום, ורכב חסכוני מספיק בכל עונה. קל למצוא דלק במרנאולי ובכניסה לבולניסי. החניה ברחובות המרכז
    חינם. מכאן ממשיך כביש S6 על פני מבצר קוושי אל קזרטי ודמניסי, וכביש Sh154 יורד דרומה אל בולניסי סיוני
    וצוגרוגאשני.
ar:
  name: بلدة بولنيسي
  short: >-
    كاتارينينفيلد، المستعمرة الشوابية التي تأسست عام 1818: شوارع مستقيمة من البيوت الألمانية، وشارع الطاحونة،
    ومتحف افتُتح عام 2020، والكروم والنحاس حولها.
  body: >-
    **لبولنيسي تاريخان تفصل بينهما ثمانية كيلومترات: أقدم كنيسة باقية في جورجيا، وبلدة ألمانية خُطّطت
    عام 1818 وكأنما بالمسطرة.**


    تقوم بولنيسي سيوني، المبنية بين عامي 478 و493، إلى الجنوب، في كفيمو بولنيسي. أما البلدة نفسها فتعود
    بدايتها إلى عام 1818، حين استقرّت أسر شوابية من فورتمبيرغ إلى جانب القرى القديمة سامتريدو وكورانتا
    وفيلكيتيلي، وسمّت مستعمرتها كاتارينينفيلد، نسبةً إلى أخت القيصر يكاترينا بافلوفنا، ملكة فورتمبيرغ.
    وبعد ثماني سنوات، في الحرب الروسية الفارسية عام 1826، انقضّ عليها المغيرون: فمن أسرها الخمس والثمانين
    قُتل 30 شخصاً وسيق 130 أسرى. وحين مرّ بها فريدريش باروت عام 1829، وجد نصف الأسرى ما زالوا مفقودين،
    وحمل أخبار امرأتين التقاهما مصادفة في سوق يريفان.


    أعاد الناجون البناء وازدهرت المستعمرة: معامل للنبيذ والكونياك والجبن، وقنوات للري، وفرقة إطفاء، وفرقة
    موسيقى نحاسية، بل وناديان للدراجات وكرة القدم. وفي عام 1921 غيّر السوفييت اسمها إلى لوكسمبورغ، تيمّناً
    بروزا لوكسمبورغ؛ وفي عام 1941 رُحّل كل ألماني لم يكن متزوجاً من جورجي أو جورجية إلى سيبيريا أو كازاخستان،
    وفي 3 أبريل 1943 صارت البلدة بولنيسي.


    وقد بقي تخطيط المستوطنين: شوارع مستقيمة متوازية تمتد من الشرق إلى الغرب، وبيوت من طابقين بجملونات
    حادة وشرفات خشبية منحوتة. ويُظهره شارع الطاحونة على أفضل وجه، وما زالت فيه بضع لافتات ألمانية من مطلع
    القرن العشرين. ثم زُر متحف بولنيسي الذي افتُتح عام 2020 ورُشّح لجائزة المتحف الأوروبي للعام؛ وتمتد
    قاعاته الأربع من أشباه البشر في دمانيسي ومنجم ذهب ساكدريسي إلى المستوطنين الألمان.


    وبعد آخر شارع تبدأ الكروم، وأبعد منها، عند كازريتي، يقع منجم مادنيولي للنحاس والذهب. وبحسب أحد التفسيرات،
    فإن الاسم نفسه يحفظ ذكرى الخام: إذ عرّف سولخان سابا أوربيلياني «البوفي» بأنه موضع يُستخرج فيه الذهب
    والفضة والنحاس ويُصهر.
  tip: >-
    خصّص للبلدة ساعتين، أو نصف يوم مع بولنيسي سيوني وتسوغروغاشيني. ابدأ بالمتحف (تحقّق من أيام فتحه قبل
    الذهاب)، ثم تمشَّ في شارع الطاحونة والأزقة حوله. البيوت مسكونة، فتأمّلها من الرصيف واستأذن قبل دخول
    أي فناء. في الوسط مقاهٍ وأجهزة صرف آلي وصيدلية. الصيف في هذا السهل حار، وقد سُجّلت فيه حرارة قياسية
    بلغت 40.2 درجة مئوية، فامشِ صباحاً أو في أول المساء. أما بولنيسي سيوني فاضبط الملاحة على الكنيسة نفسها:
    فهي في كفيمو بولنيسي لا في البلدة.
  route: >-
    الطريق S6 يتكفّل بكل شيء. اخرج من تبليسي جنوباً مروراً ببونيتشالا حتى مارنيولي، حيث ينعطف الطريق غرباً
    صاعداً في وادي ماشافيرا إلى بولنيسي: نحو 64 كيلومتراً وساعة وعشر دقائق. الطريق إسفلتي بمسارين وفي
    حالة جيدة، مزدحم حول مارنيولي نهاراً، وتكفي سيارة اقتصادية في أي فصل. الوقود متوافر بسهولة في مارنيولي
    وعند مدخل بولنيسي. الوقوف في شوارع الوسط مجاني. ومن هنا يمضي الطريق S6 مروراً بقلعة كفيشي إلى كازريتي
    ودمانيسي، بينما يتجه الطريق Sh154 جنوباً إلى بولنيسي سيوني وتسوغروغاشيني.
