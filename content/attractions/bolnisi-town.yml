ka:
  name: ბოლნისი
  short: ყოფილი გერმანული კოლონია კატარინენფელდი — ქვის სახლების ფართო ქუჩა, ღვინის რაიონი და სამთო მრეწველობის
    ცენტრი.
  body: >-
    **ბოლნისი ორ სხვადასხვა ისტორიას ინახავს და უმეტესობა მხოლოდ ერთს იცნობს.** ხუთ კილომეტრში ბოლნისის
    სიონი დგას — V საუკუნის ბაზილიკა, საქართველოს უძველესი ეკლესია. თავად ქალაქი კი მხოლოდ 1818 წლისაა.


    ის დაარსდა როგორც შვაბიური გერმანული კოლონია კატარინენფელდი, ვიურტემბერგელი ოჯახებით. 1921 წელს დაარქვეს
    ლუქსემბურგი — როზა ლუქსემბურგის სახელით — და 1943 წელს ბოლნისი. 1826 წელს, რუსეთ-სპარსეთის ომის დროს,
    კოლონია აოხრდა და მოსახლეობის დიდი ნაწილი დაიღუპა ან ტყვედ წაიყვანეს; გადარჩენილებმა იმავე გეგმით
    აღადგინეს დასახლება. გერმანული მოსახლეობა 1941 წელს დეპორტირებული იქნა.


    რაც შემორჩა, ქალაქგეგმარებაშია. მთავარი ქუჩა უჩვეულოდ ფართოა და სწორი; ორივე მხარეს ორსართულიანი ქვის
    სახლებია კრამიტის სახურავებით და კარის ზემოთ ამოკვეთილი თარიღებით. ქვა ადგილობრივია — მომწვანო-მონაცრისფრო
    ტუფი, რომელსაც „ბოლნისის ქვა" ჰქვია და რომლითაც ბოლნისის სიონიცაა ნაშენი და თბილისის მრავალი შენობაც.
    ყოფილი ლუთერანული ეკლესია ქუჩის ცენტრშია.


    ქალაქის მესამე ფენა ინდუსტრიულია: ბოლნისი საქართველოს სპილენძისა და ოქროს მოპოვების რაიონის ცენტრია
    — მადნეულის საბადო კაზრეთთან ახლოსაა. ეს ქალაქს სამუშაო ადგილებს აძლევს და გარემოსდაცვით პრობლემებსაც.
    ირგვლივ ვენახებია; ბოლნისის ღვინის რაიონი ბოლო წლებში ცნობილი გახდა.
  tip: >-
    ორი საათი საკმარისია მთავარი ქუჩისა და მუზეუმისთვის, ბოლნისის სიონთან ერთად კი ნახევარი დღე. ქუჩა
    ბრტყელი და ჩრდილიანია, ფეხით სიარულისთვის სასიამოვნო. სახლების უმეტესობა კერძოა და დღემდე საცხოვრებელი
    — ეზოში ნებართვის გარეშე არ შეხვიდეთ. ცენტრში კაფეები, ბანკომატები და აფთიაქია. საწვავი ქალაქის შესასვლელშია.
    ზაფხულში აქ ცხელა, დილა ან საღამო ჯობია.
  route: >-
    თბილისიდან სამხრეთით მარნეულამდე, შემდეგ დასავლეთით ბოლნისისკენ — სულ 64 კმ, დაახლოებით საათი და ათი
    წუთი. გზა ბოლომდე ასფალტია, ორზოლიანი და კარგ მდგომარეობაშია; მარნეულის ახლოს დღისით მოძრაობა მკვრივია.
    საწვავი მარნეულში ან ბოლნისის შესასვლელში აიღეთ. ცენტრში ქუჩის პარკინგი უფასოა. ეკონომ-კლასის ავტომობილი
    მთელი წლის განმავლობაში საკმარისია.
en:
  name: Bolnisi Town
  short: >-
    The former German colony of Katharinenfeld — a broad street of stone houses, a wine district and a
    mining centre.
  body: >-
    **Bolnisi holds two separate histories, and most visitors know only one.** Five kilometres away stands
    Bolnisi Sioni, the 5th-century basilica that is the oldest church in Georgia. The town itself dates
    only from 1818.


    It was founded as the Swabian German colony of Katharinenfeld, settled by families from Württemberg.
    In 1921 it was renamed Luxemburg, after Rosa Luxemburg, and in 1943 Bolnisi. In 1826, during the Russo-Persian
    war, the colony was raided and a large part of its people were killed or carried off; the survivors
    rebuilt on the same plan. The German population was deported in 1941.


    What survives is the town plan. The main street is unusually wide and straight, lined on both sides
    with two-storey stone houses under tiled roofs, many with the date of building carved above the door.
    The stone is local: a greenish-grey tuff known as Bolnisi stone, the same material used for Bolnisi
    Sioni and for a great many buildings in Tbilisi. The former Lutheran church stands in the middle of
    the street.


    A third layer is industrial. Bolnisi is the centre of Georgia's copper and gold mining district; the
    Madneuli deposit lies nearby at Kazreti. That gives the town jobs and also gives it environmental
    problems that are openly discussed locally. Vineyards surround the town, and the Bolnisi wine district
    has gained a reputation over the past decade.
  tip: >-
    Two hours covers the main street and the local museum; half a day if you add Bolnisi Sioni. The street
    is flat and shaded and pleasant to walk. Most of the houses are private and still lived in, so do
    not enter yards without asking. There are cafes, cash machines and a pharmacy in the centre. Fuel
    is at the edge of town. Summers here are hot, so morning or evening is better.
  route: >-
    Head south from Tbilisi to Marneuli, then west towards Bolnisi — 64 km in all, about an hour and ten
    minutes. The road is asphalt throughout, two lanes and in good condition, though traffic thickens
    near Marneuli during the day. Refuel in Marneuli or at the entrance to Bolnisi. Street parking in
    the centre is free. An economy car is sufficient all year round.
ru:
  name: Город Болниси
  short: Бывшая немецкая колония Катариненфельд — широкая улица каменных домов, винный район и центр горнодобычи.
  body: >-
    **В Болниси две разные истории, и большинство приезжих знает только одну.** В пяти километрах стоит
    Болнисский Сиони — базилика V века, древнейшая церковь Грузии. Сам город возник лишь в 1818 году.


    Он был основан как швабская немецкая колония Катариненфельд, заселённая семьями из Вюртемберга. В
    1921 году его переименовали в Люксембург — в честь Розы Люксембург, — а в 1943-м в Болниси. В 1826
    году, во время русско-персидской войны, колонию разорили: значительная часть жителей погибла или была
    уведена в плен, а уцелевшие отстроились по прежнему плану. Немецкое население депортировали в 1941
    году.


    Сохранилась планировка. Главная улица необычно широкая и прямая, с обеих сторон застроена двухэтажными
    каменными домами под черепицей, у многих над дверью вырезан год постройки. Камень местный: зеленовато-серый
    туф, известный как болнисский, из которого сложен и Болнисский Сиони, и множество зданий Тбилиси.
    Бывшая лютеранская церковь стоит посреди улицы.


    Третий слой — промышленный. Болниси является центром грузинского района добычи меди и золота; месторождение
    Маднеули находится рядом, у Казрети. Это даёт городу рабочие места и вместе с тем экологические проблемы,
    о которых здесь говорят открыто. Вокруг виноградники, и болнисский винный район за последнее десятилетие
    заметно поднялся.
  tip: >-
    Двух часов хватит на главную улицу и краеведческий музей; полдня — если добавить Болнисский Сиони.
    Улица ровная, тенистая, гулять приятно. Большинство домов частные и жилые, во дворы без разрешения
    не заходите. В центре есть кафе, банкоматы и аптека. Заправка на въезде. Лето здесь жаркое, лучше
    утро или вечер.
  route: >-
    Из Тбилиси на юг до Марнеули, затем на запад в сторону Болниси — всего 64 км, примерно час десять.
    Дорога асфальтированная, двухполосная, в хорошем состоянии, но у Марнеули днём плотный поток. Заправляйтесь
    в Марнеули или на въезде в Болниси. Уличная парковка в центре бесплатная. Машины эконом-класса достаточно
    круглый год.
fa:
  name: شهر بولنیسی
  short: مستعمرهٔ آلمانی پیشین کاتارینن‌فلد — خیابانی پهن از خانه‌های سنگی، ناحیه‌ای شرابی و مرکزی معدنی.
  body: >-
    **بولنیسی دو تاریخ جداگانه دارد و بیشتر بازدیدکنندگان تنها یکی را می‌شناسند.** پنج کیلومتر آن‌سوتر
    سیونی بولنیسی ایستاده است، بازیلیکای سدهٔ پنجم و کهن‌ترین کلیسای گرجستان. اما خود شهر تنها به ۱۸۱۸
    بازمی‌گردد.


    شهر همچون مستعمرهٔ آلمانیِ شوابی کاتارینن‌فلد بنیاد گرفت و خانواده‌هایی از ویرتمبرگ در آن ساکن شدند.
    در ۱۹۲۱ نامش به لوکزامبورگ، به یاد رزا لوکزامبورگ، و در ۱۹۴۳ به بولنیسی تغییر کرد. در ۱۸۲۶، در جریان
    جنگ روس و ایران، به مستعمره تاختند و بخش بزرگی از ساکنان کشته یا به اسارت برده شدند؛ بازماندگان بر
    همان نقشه از نو ساختند. جمعیت آلمانی در ۱۹۴۱ تبعید شد.


    آنچه مانده طرح شهر است. خیابان اصلی به‌طرز غیرعادی پهن و مستقیم است و در دو سویش خانه‌های سنگی دوطبقه
    با بام‌های سفالی صف کشیده‌اند، و بر بسیاری از آنها سال ساخت بالای در کنده شده است. سنگ محلی است: توفِ
    خاکستریِ متمایل به سبز که به سنگ بولنیسی شهرت دارد، همان مصالحی که سیونی بولنیسی و شمار بسیاری از
    ساختمان‌های تفلیس از آن ساخته شده‌اند. کلیسای لوتری پیشین در میانهٔ خیابان است.


    لایهٔ سوم صنعتی است. بولنیسی مرکز ناحیهٔ استخراج مس و طلای گرجستان است؛ معدن مادنئولی در نزدیکی و
    در کازرتی قرار دارد. این هم برای شهر کار می‌آورد و هم مسائل زیست‌محیطی که در همان‌جا آشکارا دربارهٔ
    آنها سخن می‌گویند. پیرامون شهر تاکستان است، و ناحیهٔ شراب بولنیسی در دههٔ گذشته آوازه یافته است.
  tip: >-
    دو ساعت خیابان اصلی و موزهٔ محلی را می‌پوشاند؛ نیم روز اگر سیونی بولنیسی را هم بیفزایید. خیابان هموار
    و سایه‌دار است و پیاده‌روی در آن دلپذیر. بیشتر خانه‌ها خصوصی و هنوز مسکونی‌اند، پس بی‌اجازه وارد حیاط
    نشوید. در مرکز کافه، خودپرداز و داروخانه هست. پمپ بنزین در ورودی شهر است. تابستان اینجا گرم است، پس
    صبح یا عصر بهتر است.
  route: >-
    از تفلیس به جنوب تا مارنئولی، سپس به غرب به سوی بولنیسی — روی‌هم ۶۴ کیلومتر، حدود یک ساعت و ده دقیقه.
    جاده تا انتها آسفالت، دوخطه و در وضعیت خوبی است، هرچند نزدیک مارنئولی در روز ترافیک سنگین می‌شود.
    سوخت را در مارنئولی یا ورودی بولنیسی بگیرید. پارک خیابانی در مرکز رایگان است. خودروی اقتصادی در تمام
    سال کافی است.
he:
  name: העיירה בולניסי
  short: מושבת הגרמנים לשעבר קתרינפלד — רחוב רחב של בתי אבן, אזור יין ומרכז כרייה.
  body: >-
    **לבולניסי שתי היסטוריות נפרדות, ורוב המבקרים מכירים רק אחת.** חמישה קילומטרים משם עומדת בולניסי סיוני,
    הבזיליקה מן המאה ה-5 שהיא הכנסייה העתיקה בגאורגיה. העיירה עצמה קיימת רק מ-1818.


    היא נוסדה כמושבה גרמנית שוואבית בשם קתרינפלד, ובה התיישבו משפחות מווירטמברג. ב-1921 שונה שמה ללוקסמבורג,
    על שם רוזה לוקסמבורג, וב-1943 לבולניסי. ב-1826, במלחמת רוסיה-פרס, נפשטה המושבה וחלק גדול מתושביה נהרג
    או נלקח בשבי; הניצולים בנו מחדש לפי אותה תוכנית. האוכלוסייה הגרמנית גורשה ב-1941.


    מה ששרד הוא תוכנית העיירה. הרחוב הראשי רחב וישר באופן חריג, ומשני צדדיו בתי אבן בני שתי קומות תחת
    גגות רעפים, ועל רבים מהם חרוטה שנת הבנייה מעל הדלת. האבן מקומית: טוף אפור-ירקרק המוכר כאבן בולניסי,
    אותו חומר שממנו נבנתה בולניסי סיוני ומבנים רבים בטביליסי. הכנסייה הלותרנית לשעבר עומדת באמצע הרחוב.


    השכבה השלישית תעשייתית. בולניסי היא מרכז אזור כריית הנחושת והזהב של גאורגיה; מכרה מאדנאולי נמצא בסמוך,
    בקאזרתי. זה מספק לעיירה מקומות עבודה וגם בעיות סביבתיות שמדברים עליהן כאן בגלוי. כרמים מקיפים את העיירה,
    ואזור היין של בולניסי צבר מוניטין בעשור האחרון.
  tip: >-
    שעתיים מכסות את הרחוב הראשי ואת המוזיאון המקומי; חצי יום אם מוסיפים את בולניסי סיוני. הרחוב מישורי
    ומוצל ונעים להליכה. רוב הבתים פרטיים ומאוכלסים, לכן אל תיכנסו לחצרות בלי לשאול. במרכז יש בתי קפה,
    כספומטים ובית מרקחת. הדלק בקצה העיירה. הקיץ כאן חם, לכן עדיף בוקר או ערב.
  route: >-
    סעו מטביליסי דרומה עד מרנאולי, ואז מערבה לכיוון בולניסי — 64 ק״מ בסך הכול, כשעה ועשר דקות. הכביש סלול
    לכל אורכו, דו-נתיבי ובמצב טוב, אם כי התנועה מתעבה ליד מרנאולי במשך היום. תדלקו במרנאולי או בכניסה
    לבולניסי. החניה ברחובות המרכז חינם. רכב חסכוני מספיק בכל ימות השנה.
ar:
  name: بلدة بولنيسي
  short: مستعمرة كاترينينفلد الألمانية سابقاً — شارع عريض من بيوت الحجر، ومنطقة نبيذ، ومركز تعدين.
  body: >-
    **لبولنيسي تاريخان منفصلان، ولا يعرف معظم الزائرين إلا واحداً منهما.** على بعد خمسة كيلومترات تقوم
    سيوني بولنيسي، البازيليكا من القرن الخامس وأقدم كنيسة في جورجيا. أما البلدة نفسها فلا يعود تاريخها
    إلا إلى 1818.


    أُسست مستعمرةً ألمانية شوابية باسم كاترينينفلد، سكنتها عائلات من فورتمبرغ. وفي 1921 غُيّر اسمها إلى
    لوكسمبورغ نسبةً إلى روزا لوكسمبورغ، وفي 1943 إلى بولنيسي. وفي عام 1826، أثناء الحرب الروسية الفارسية،
    أُغير على المستعمرة فقُتل أو سُبي جزء كبير من أهلها؛ وأعاد الناجون البناء على المخطط نفسه. ورُحّل
    السكان الألمان عام 1941.


    وما بقي هو مخطط البلدة. الشارع الرئيسي عريض مستقيم على نحو غير مألوف، تصطف على جانبيه بيوت حجرية من
    طابقين تحت أسقف قرميد، وعلى كثير منها سنة البناء منحوتة فوق الباب. والحجر محلي: توف رمادي مائل إلى
    الخضرة يُعرف بحجر بولنيسي، وهو المادة نفسها التي بُنيت بها سيوني بولنيسي وعدد كبير من مباني تبليسي.
    وتقوم الكنيسة اللوثرية السابقة في منتصف الشارع.


    وثمة طبقة ثالثة صناعية. فبولنيسي مركز منطقة تعدين النحاس والذهب في جورجيا؛ ويقع منجم مادنيولي قريباً
    في كازريتي. وهذا يمنح البلدة فرص عمل ويمنحها كذلك مشكلات بيئية يُتحدث عنها هنا صراحة. وتحيط بالبلدة
    الكروم، وقد اكتسبت منطقة نبيذ بولنيسي سمعة في العقد الأخير.
  tip: >-
    ساعتان تغطيان الشارع الرئيسي والمتحف المحلي؛ ونصف يوم إن أضفت سيوني بولنيسي. والشارع مستوٍ مظلل وممتع
    للمشي. ومعظم البيوت خاصة وما زالت مسكونة، فلا تدخل الأفنية دون استئذان. وفي المركز مقاهٍ وصرافات آلية
    وصيدلية. والوقود عند طرف البلدة. والصيف هنا حار، فالصباح أو المساء أفضل.
  route: >-
    اتجه جنوباً من تبليسي إلى مارنئولي، ثم غرباً نحو بولنيسي — 64 كم إجمالاً، نحو ساعة وعشر دقائق. الطريق
    معبّد بكامله، بمسربين وبحالة جيدة، وإن كانت الحركة تشتد قرب مارنئولي في النهار. تزوّد بالوقود في مارنئولي
    أو عند مدخل بولنيسي. والوقوف على الرصيف في المركز مجاني. وسيارة اقتصادية تكفي على مدار السنة.
