ka:
  name: ევროპის მოედანი
  short: 'ბათუმის საპარადო მოედანი: მედეა სვეტზე ოქროს საწმისით, აღდგენილი ფასადები და გერმანული ასტრონომიული
    საათი.'
  body: >-
    **ევროპის მოედანი ბათუმის არგუმენტია, ქვასა და ბრინჯაოში ნათქვამი: ეს შავი ზღვის ნავსადგური ყოველთვის
    ევროპის უძველესი ამბის ნაწილი იყო.**


    შუაგულში, მაღალ სვეტზე, კოლხეთის მეფის ასული მედეა დგას და ხელში ოქროს საწმისი უჭირავს. დავით ხმალაძის
    ბრინჯაოს ქანდაკება 2007 წლის 6 ივლისს პრეზიდენტმა მიხეილ სააკაშვილმა გახსნა — ბათუმის შავი ზღვის კურორტად
    გარდაქმნის პროგრამის ფარგლებში. მითის მიხედვით, სწორედ მედეა, აიეტ მეფის ასული, დაეხმარა იასონს საწმისის
    დაუფლებაში და მასთან ერთად გაცურა. აქ კი საწმისი მასვე დარჩა.


    მედეას გარშემო XIX–XX საუკუნეების აღდგენილი ფასადები XXI საუკუნის ახალ შენობებს ეთავსება: რესტორნებს,
    მაღაზიებს, სასტუმროებს. არც სახელია შემთხვევითი — ის ქვეყნის ევროპული მისწრაფების ნიშნად შეირჩა.


    რას დააკვირდეთ:


    - ასტრონომიულ საათს — 2010 წელს გერმანიაში დამზადებულს, რომელიც დროსთან ერთად მზისა და მთვარის მდებარეობას,
    მთვარის ფაზას და მზის ამოსვლა-ჩასვლის დროს აჩვენებს;

    - „არგოს“ რელიეფს მედეას კვარცხლბეკზე — ადვილად გამოგრჩებათ, თუ მხოლოდ ზემოთ, ქანდაკებას უყურებთ;

    - მოცეკვავე შადრევანს მოედნის შუაგულში, სადაც ზაფხულის პაპანაქებაში ბავშვები წყალში დარბიან.


    მოედანი ქალაქის მთავარი სცენაცაა: აქ იმართება ბათუმობა, საშობაო ბაზრობები, საახალწლო ღამე და საერთაშორისო
    კონცერტები. პიაცამდეც და ზღვამდეც ხუთ-ხუთი წუთის სავალია.


    მედეას ბოლოს შეხედეთ. 2007 წლიდან საწმისი ქუჩის ხმაურს ზემოთ უჭირავს და მისი დაბრუნება, როგორც ჩანს,
    არ უფიქრია.
  tip: >-
    მოედანი მუდამ ღიაა და უფასოა. საათს კარგად დააკვირდით: მის ციფერბლატებზე ასტრონომიული მონაცემებიცაა,
    რასაც სტუმრების უმეტესობა ვერც ამჩნევს. დილით ადრე მოედანი ცარიელია და შუქი რბილი, საღამოს კი განათება
    ირთვება. ივლის-აგვისტოში კონცერტებზე დიდი ხალხმრავლობაა. მოედნის ირგვლივ კაფეები საშუალო ფასისაა და
    ტუალეტიც მათშია ყველაზე ადვილად საპოვნი. თავად მოედანზე პარკინგი არ არის — მიმდებარე ქუჩების ფასიანი
    ადგილები გამოიყენეთ და ფეხით გაისეირნეთ: პიაცა, ბულვარი და ძველი ქალაქი რამდენიმე წუთის სავალზეა.
  route: >-
    თბილისიდან დაახლოებით 375 კილომეტრი და ხუთნახევარი საათია, სულ ასფალტზე. ს1 (E60) მაგისტრალით დასავლეთისკენ,
    გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით და ქუთაისის გვერდის ავლით სამტრედიამდე იარეთ;
    იქიდან ს12 (E692) ლანჩხუთის გავლით გრიგოლეთამდე, ზღვამდე ჩაგიყვანთ, ს2 (E70) კი სამხრეთისკენ, ქობულეთის
    გავლით, ბათუმში შეგიყვანთ. საწვავი მთელ გზაზეა. ევროპის მოედანი ქალაქის ცენტრში, მემედ აბაშიძის გამზირზეა:
    ნავიგატორში ის აკრიფეთ, მანქანა ახლომახლო ფასიან ადგილზე დააყენეთ და ფეხით მიდით. ეკონომკლასის ავტომობილიც
    სავსებით საკმარისია.
en:
  name: Europe Square
  short: >-
    Batumi's grand square: Medea on her column with the Golden Fleece, restored facades and a German astronomical
    clock.
  body: >-
    **Europe Square is Batumi's argument, made in stone and bronze: that this Black Sea port has always
    belonged to Europe's oldest story.**


    At its centre, high on a column, stands Medea, princess of Colchis, holding up the Golden Fleece.
    Davit Khmaladze's bronze was unveiled on 6 July 2007 by President Mikheil Saakashvili, part of a programme
    to remake Batumi as a Black Sea resort. In the myth it was Medea, daughter of King Aeëtes, who helped
    Jason seize the fleece and then sailed away with him. Here, she keeps it.


    Around her, restored facades of the 19th and 20th centuries stand shoulder to shoulder with 21st-century
    newcomers: restaurants, shops, hotels. The name was no accident either; it was chosen to express the
    country's European aspirations.


    What to look for:


    - the astronomical clock, made in Germany in 2010, which shows not only the hour but the positions
    of the sun and moon, the phase of the moon, and the times of sunrise and sunset;

    - a relief of the Argo on Medea's pedestal, easy to miss when your eyes are on the statue above;

    - the dancing fountain in the middle of the square, where children splash through the summer heat.


    The square is also the city's main stage: Batumoba, the Christmas markets, New Year's Eve and international
    concerts all happen here, and the Piazza and the sea are each only five minutes' walk away.


    Look up at Medea last. She has held that fleece above the traffic since 2007 and shows no sign of
    handing it back.
  tip: >-
    The square is always open and free. Give the clock a proper look: its dials carry astronomical information
    that most visitors walk straight past. Early morning brings an empty square and soft light; evening
    brings the illuminations. In July and August concerts draw big crowds. Cafés around the square are
    mid-priced, and their toilets are the easiest option. There is no parking on the square itself, so
    use the paid street parking around it and explore on foot: the Piazza, the Boulevard and the Old Town
    are all within a few minutes' walk.
  route: >-
    From Tbilisi allow about 375 km and five and a half hours, all of it on asphalt. Take the S1 (E60)
    west past Gori and Khashuri, over the Rikoti Pass and past Kutaisi to Samtredia; from there the S12
    (E692) runs through Lanchkhuti to the coast at Grigoleti, and the S2 (E70) carries you south through
    Kobuleti into Batumi. Fuel is available throughout. Europe Square lies in the city centre on Memed
    Abashidze Avenue: set the navigator to it, then park on a paid street nearby and walk. An economy
    car is all you need.
ru:
  name: Площадь Европы
  short: >-
    Главная площадь Батуми: Медея на колонне с золотым руном, восстановленные фасады и немецкие астрономические
    часы.
  body: >-
    **Площадь Европы — это аргумент Батуми, высказанный камнем и бронзой: этот черноморский порт всегда
    был частью самой древней европейской истории.**


    В центре, высоко на колонне, стоит Медея, царевна Колхиды, поднимающая золотое руно. Бронзовую фигуру
    Давида Хмаладзе открыл 6 июля 2007 года президент Михаил Саакашвили — в рамках программы превращения
    Батуми в черноморский курорт. По преданию, именно Медея, дочь царя Ээта, помогла Ясону завладеть руном
    и уплыла с ним. Здесь же руно осталось при ней.


    Вокруг неё восстановленные фасады XIX–XX веков стоят плечом к плечу с новостройками XXI века: ресторанами,
    магазинами, отелями. И само название площади выбрано не случайно — оно должно было выразить европейские
    устремления страны.


    На что обратить внимание:


    - астрономические часы, изготовленные в Германии в 2010 году: они показывают не только время, но и
    положение солнца и луны, лунную фазу, время восхода и заката;

    - рельеф «Арго» на пьедестале Медеи — его легко пропустить, если смотреть только на статую наверху;

    - танцующий фонтан посреди площади, где летом в жару плещутся дети.


    Площадь — ещё и главная сцена города: здесь проходят Батумоба, рождественские ярмарки, новогодняя
    ночь и международные концерты, а до Пьяццы и до моря — всего пять минут пешком.


    На Медею взгляните последней. С 2007 года она держит руно над уличным шумом и, судя по всему, не собирается
    его возвращать.
  tip: >-
    Площадь открыта всегда и вход бесплатный. Присмотритесь к часам внимательнее: на их циферблатах есть
    астрономические данные, которые большинство гостей пропускает мимо глаз. Ранним утром площадь пуста,
    а свет мягкий; вечером включается подсветка. В июле и августе на концертах собираются большие толпы.
    Кафе вокруг площади — по средним ценам, и их туалеты — самый удобный вариант. Парковки на самой площади
    нет, поэтому воспользуйтесь платной парковкой на соседних улицах и гуляйте пешком: Пьяцца, Бульвар
    и Старый город — в нескольких минутах ходьбы.
  route: >-
    От Тбилиси — около 375 км и пять с половиной часов, всё по асфальту. Следуйте по S1 (E60) на запад
    через Гори и Хашури, через перевал Рикоти и Кутаиси до Самтредиа; оттуда S12 (E692) через Ланчхути
    до побережья у Григолети, а S2 (E70) — на юг через Кобулети в Батуми. Заправки есть на всём пути.
    Площадь Европы находится в центре города, на проспекте Мемеда Абашидзе: задайте её в навигаторе, затем
    оставьте машину на платной парковке рядом и идите пешком. Автомобиля экономкласса вполне достаточно.
fa:
  name: میدان اروپا
  short: 'میدان بزرگ باتومی: مده‌آ بر ستون خود با پشم زرین، نماهای بازسازی‌شده و ساعتی نجومی آلمانی.'
  body: >-
    **میدان اروپا استدلال باتومی است، بیان‌شده در سنگ و برنز: این بندر کنار دریای سیاه همیشه بخشی از کهن‌ترین
    روایت اروپا بوده است.**


    در مرکز میدان، بر فراز ستونی بلند، مده‌آ ایستاده است، شاهدخت کولخیس، که پشم زرین را بالای سر گرفته.
    مجسمهٔ برنزی داویت خمالادزه را در ۶ ژوئیهٔ ۲۰۰۷ رئیس‌جمهور میخائیل ساآکاشویلی رونمایی کرد — بخشی از
    برنامه‌ای برای بازآفرینی باتومی به‌عنوان تفرجگاه کنار دریای سیاه. بر پایهٔ افسانه، این مده‌آ، دختر
    پادشاه آییتس، بود که یاسون را در تصاحب پشم زرین یاری داد و سپس با او به دریا زد و رفت. اینجا، اما،
    پشم همچنان نزد اوست.


    در پیرامون او، نماهای بازسازی‌شدهٔ سده‌های نوزدهم و بیستم شانه‌به‌شانهٔ تازه‌واردهای سدهٔ بیست‌ویکم
    ایستاده‌اند: رستوران‌ها، مغازه‌ها، هتل‌ها. نام میدان نیز تصادفی نبود؛ آن را برای بیان آرمان‌های اروپایی
    کشور برگزیدند.


    چه چیزهایی را باید دید:


    - ساعت نجومی، ساختهٔ آلمان در سال ۲۰۱۰، که نه‌تنها ساعت را، بلکه موقعیت خورشید و ماه، فاز ماه، و زمان
    طلوع و غروب را نیز نشان می‌دهد؛

    - نقش برجستهٔ آرگو بر پایهٔ مجسمهٔ مده‌آ، که اگر تنها به مجسمهٔ بالا چشم بدوزید، به‌آسانی از چشمتان
    می‌افتد؛

    - فوارهٔ رقصان در میان میدان، جایی که کودکان در گرمای تابستان در آب بازی می‌کنند.


    این میدان صحنهٔ اصلی شهر نیز هست: باتوموبا، بازارهای کریسمس، شب سال نو و کنسرت‌های بین‌المللی، همه
    اینجا برگزار می‌شوند، و پیاتزا و دریا هرکدام تنها پنج دقیقه پیاده‌روی دورترند.


    مده‌آ را در پایان تماشا کنید. او از سال ۲۰۰۷ پشم زرین را بالای سر ترافیک نگه داشته و هیچ نشانه‌ای
    از قصد بازگرداندنش در او پیدا نیست.
  tip: >-
    میدان همیشه باز و رایگان است. به ساعت با دقت نگاه کنید: بر صفحات آن اطلاعات نجومی‌ای نهفته است که
    بیشتر بازدیدکنندگان بدون توجه از کنارش می‌گذرند. صبح زود میدان خالی و روشنایی نرم است؛ شامگاه، نورافشانی
    روشن می‌شود. در ژوئیه و اوت، کنسرت‌ها جمعیت زیادی جذب می‌کنند. کافه‌های اطراف میدان قیمت متوسطی دارند
    و سرویس‌های بهداشتی‌شان آسان‌ترین گزینه‌اند. در خود میدان پارکینگی نیست، پس از پارکینگ‌های خیابانی
    پولی اطراف استفاده کنید و پیاده گردش کنید: پیاتزا، بلوار و شهر قدیم همه چند دقیقه پیاده‌روی فاصله
    دارند.
  route: >-
    از تفلیس حدود ۳۷۵ کیلومتر و پنج ساعت و نیم راه است، همه بر آسفالت. از S1 (E60) به سوی غرب، از میان
    گوری و خاشوری، از گذرگاه ریکوتی و کنار کوتایسی تا سامتردیا بروید؛ از آنجا S12 (E692) از میان لانچخوتی
    تا ساحل در گریگولتی می‌رساندتان، و S2 (E70) به سوی جنوب، از میان کوبولتی، شما را به باتومی می‌برد.
    پمپ‌بنزین در سراسر مسیر پیدا می‌شود. میدان اروپا در مرکز شهر، در خیابان ممد آباشیدزه، قرار دارد: آن
    را در ناوبر تنظیم کنید، سپس در پارکینگ خیابانی پولی نزدیک توقف کنید و پیاده بروید. یک خودروی اکونومی
    کاملاً کافی است.
he:
  name: כיכר אירופה
  short: 'הכיכר המרכזית של בטומי: מדיאה על עמוד ובידה גיזת הזהב, חזיתות משוחזרות ושעון אסטרונומי גרמני.'
  body: >-
    **כיכר אירופה היא הטיעון של בטומי, שנאמר באבן ובברונזה: שנמל זה על שפת הים השחור היה מאז ומתמיד חלק
    מהסיפור העתיק ביותר של אירופה.**


    במרכזה, גבוה על עמוד, עומדת מדיאה, נסיכת קולכיס, ומרימה את גיזת הזהב. פסל הברונזה של דוד חמלדזה נחשף
    ב-6 ביולי 2007 בידי הנשיא מיחאיל סאקאשווילי, כחלק מתוכנית לעיצוב בטומי כאתר נופש על חופי הים השחור.
    לפי המיתוס, מדיאה, בתו של המלך איטס, היא זו שעזרה ליאסון לזכות בגיזה ואז הפליגה עמו. כאן היא שומרת
    אותה לעצמה.


    מסביבה עומדות חזיתות משוחזרות מהמאות ה-19 וה-20 שכם אל שכם עם מבנים חדשים מהמאה ה-21: מסעדות, חנויות,
    מלונות. גם השם לא נבחר בכדי; הוא נועד להביע את הכמיהה האירופית של המדינה.


    למה לשים לב:


    - השעון האסטרונומי, שיוצר בגרמניה ב-2010 ומראה לא רק את השעה אלא גם את מיקומי השמש והירח, את פאזת
    הירח ואת שעות הזריחה והשקיעה;

    - תבליט הארגו על כן הפסל של מדיאה, שקל להחמיץ כשהעיניים נשואות אל הפסל שלמעלה;

    - המזרקה הרוקדת במרכז הכיכר, שבה ילדים מתרטבים בחום הקיץ.


    הכיכר היא גם הבמה המרכזית של העיר: בטומובה, שוקי חג המולד, ליל השנה האזרחית החדשה וקונצרטים בין-לאומיים
    — כולם מתקיימים כאן, והפיאצה והים נמצאים כל אחד רק חמש דקות הליכה משם.


    הביטו במדיאה לבסוף. מאז 2007 היא מחזיקה את הגיזה מעל שאון התנועה, ואין שום סימן שהיא עומדת להחזיר
    אותה.
  tip: >-
    הכיכר פתוחה תמיד וללא תשלום. הביטו היטב בשעון: על לוחותיו מידע אסטרונומי שרוב המבקרים חולפים על פניו.
    השעות המוקדמות של הבוקר מביאות כיכר ריקה ואור רך; הערב מביא את התאורה. ביולי ובאוגוסט הקונצרטים מושכים
    קהל רב. בתי הקפה סביב הכיכר במחירים אמצעיים, והשירותים שלהם הם האפשרות הנוחה ביותר. אין חניה בכיכר
    עצמה, אז השתמשו בחניון רחוב בתשלום בסביבה וטיילו ברגל: הפיאצה, הטיילת והעיר העתיקה כולם במרחק כמה
    דקות הליכה.
  route: >-
    מטביליסי כ-375 ק"מ וחמש שעות וחצי, כולן על אספלט. קחו את S1 (E60) מערבה דרך גורי וחשורי, דרך מעבר
    ריקוטי ולצד קוטאיסי עד סמטרדיה; משם S12 (E692) דרך לנצ'חוטי עד לחוף בגריגולטי, ו-S2 (E70) דרומה דרך
    קובולטי לבטומי. תדלוק זמין בכל אורך הדרך. כיכר אירופה נמצאת במרכז העיר, בשדרת ממד אבשידזה: הזינו אותה
    בניווט, חנו בחניון רחוב בתשלום קרוב, וטיילו ברגל. רכב אקונומי רגיל מספיק בהחלט.
ar:
  name: ساحة أوروبا
  short: 'الساحة الكبرى في باتومي: ميديا على عمودها تحمل الجزة الذهبية، وواجهات مُرمَّمة، وساعة فلكية
    ألمانية.'
  body: >-
    **ساحة أوروبا هي حجة باتومي المكتوبة بالحجر والبرونز: أن هذا الميناء على البحر الأسود كان دائمًا جزءًا
    من أقدم حكاية أوروبية.**


    في وسطها، عاليًا على عمود، تقف ميديا، أميرة كولخيس، رافعةً الجزة الذهبية. أُزيح الستار عن تمثال دافيت
    خمالادزه البرونزي في 6 يوليو 2007 على يد الرئيس ميخائيل ساكاشفيلي، في إطار برنامج لإعادة صياغة باتومي
    كمنتجع على البحر الأسود. وبحسب الأسطورة، كانت ميديا، ابنة الملك آيتيس، هي من ساعدت ياسون على الاستحواذ
    على الجزة، ثم أبحرت معه. أما هنا، فتحتفظ بها لنفسها.


    من حولها تقف واجهات مُرمَّمة من القرنين التاسع عشر والعشرين جنبًا إلى جنب مع وافدين من القرن الحادي
    والعشرين: مطاعم ومحال وفنادق. حتى الاسم لم يكن اعتباطيًا؛ فقد اختير للتعبير عن تطلعات البلاد الأوروبية.


    ما يستحق الانتباه إليه:


    - الساعة الفلكية، المصنوعة في ألمانيا عام 2010، التي لا تعرض الوقت فحسب بل مواقع الشمس والقمر وطور
    القمر وأوقات الشروق والغروب؛

    - نقش سفينة أرجو البارز على قاعدة تمثال ميديا، ومن السهل أن يفوتك إن اكتفيت بالنظر إلى التمثال في
    الأعلى؛

    - النافورة الراقصة في وسط الساحة، حيث يخوض الأطفال في الماء هربًا من حر الصيف.


    الساحة أيضًا مسرح المدينة الرئيسي: هنا يُقام مهرجان باتوموبا، وأسواق الميلاد، وليلة رأس السنة، والحفلات
    الدولية، وكل من البياتزا والبحر لا يبعد سوى خمس دقائق سيرًا على الأقدام.


    انظر إلى ميديا في النهاية. منذ عام 2007 وهي ترفع الجزة فوق ضجيج الشارع، ولا يبدو أنها تنوي إعادتها.
  tip: >-
    الساحة مفتوحة دائمًا ومجانية. تأمّل الساعة جيدًا: تحمل أقراصها معلومات فلكية يمر بها معظم الزوار دون
    أن يلحظوها. الصباح الباكر يترك الساحة خالية والضوء لينًا؛ والمساء يشعل الإضاءة. في يوليو وأغسطس تجذب
    الحفلات حشودًا كبيرة. مقاهي الساحة متوسطة الأسعار، ومرافقها الصحية هي الخيار الأسهل. لا يوجد موقف
    سيارات في الساحة نفسها، فاستخدم مواقف الشوارع المدفوعة حولها وتنقّل سيرًا على الأقدام: البياتزا والكورنيش
    والبلدة القديمة كلها على مسافة دقائق قليلة.
  route: >-
    من تبليسي نحو 375 كم وخمس ساعات ونصف، كلها على أسفلت. اتبع S1 (E60) غربًا عبر غوري وخاشوري، عبر ممر
    ريكوتي وبمحاذاة كوتايسي حتى سامتريديا؛ ومن هناك S12 (E692) عبر لانتشخوتي إلى الساحل عند غريغوليتي،
    و S2 (E70) جنوبًا عبر كوبوليتي إلى باتومي. الوقود متوفر طوال الطريق. تقع ساحة أوروبا في وسط المدينة،
    على جادة ممد أباشيدزه: أدخلها في جهاز التوجيه، ثم اترك السيارة في موقف شارع مدفوع قريب وتنقّل سيرًا.
    سيارة اقتصادية عادية كافية تمامًا.
