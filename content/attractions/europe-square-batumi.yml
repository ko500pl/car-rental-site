ka:
  name: ევროპის მოედანი
  short: ბათუმის საპარადო მოედანი — მედეას სვეტი ოქროს საწმისით, „ბელ ეპოკის" ფასადები და ასტრონომიული
    საათი.
  body: >-
    **ევროპის მოედანი ბათუმის სავიზიტო ბარათია** — ის ადგილი, სადაც ქალაქის ძველი, ნავთობის ბუმის დროინდელი
    არქიტექტურა ყველაზე მოწესრიგებულად ჩანს. მოედანს XIX-XX საუკუნეების აღდგენილი ფასადები აკრავს, მათ
    შორის ერევა XXI საუკუნის დანამატებიც, ცენტრში კი მაღალ სვეტზე მედეა დგას.


    დავით ხმალაძის ბრინჯაოს მედეა 2007 წლის 6 ივლისს გაიხსნა. ის ხელში ოქროს საწმისს იჭერს — პირდაპირი
    მინიშნება არგონავტების მითზე, რომელიც კოლხეთს, ანუ დღევანდელ დასავლეთ საქართველოს უკავშირდება. ბათუმისთვის
    ეს უბრალო ძეგლი არ არის: ქალაქი საკუთარ თავს ანტიკური სავაჭრო სამყაროს ნაწილად წარმოაჩენს.


    რა ნახო მოედანზე:


    - მედეას სვეტი — საღამოს განათებით განსაკუთრებით ეფექტური

    - ასტრონომიული საათი ყოფილი ბანკის შენობაზე (2010 წელს გერმანიაში დამზადდა) — მთვარის ფაზებსა და მზის
    ამოსვლა-ჩასვლასაც აჩვენებს

    - შადრევანი, რომელშიც ზაფხულის პაპანაქებაში ბავშვები ცურავენ


    მოედანი ქალაქის მთავარი სასცენო სივრცეა: აქ იმართება საერთაშორისო კონცერტები, ბათუმობა და საახალწლო
    ბაზრობა. პიაცამდე აქედან ხუთი წუთია ფეხით, ასე რომ ორივე ერთ გასეირნებაში თავსდება.
  tip: >-
    მოედანი ღიაა მუდმივად და უფასოა. საათს კარგად დააკვირდი — ციფერბლატზე ჩვეულებრივი დროის გარდა ასტრონომიული
    მონაცემებიცაა. ფოტოსთვის საუკეთესო დროა ადრიანი დილა (ცარიელი მოედანი) ან საღამო (განათება). ივლის-აგვისტოში
    კონცერტების დროს ხალხმრავლობაა. კაფეები მოედნის ირგვლივ საშუალო ფასისაა; ტუალეტი ახლომდებარე სავაჭრო
    ცენტრებშია. პარკინგი მოედანზე არ არის — მიმდებარე ქუჩებზეა, ფასიანი.
  route: >-
    თბილისიდან E60/S1 მაგისტრალით იმგზავრე: რიკოთი, ქუთაისის შემოვლითი, სამტრედია, შემდეგ ზღვისპირა გზა
    ქობულეთით ბათუმამდე — სულ დაახლოებით 375 კმ, 5:30 სთ, ბოლომდე ასფალტი. საწვავი ყველგანაა. ევროპის
    მოედანი ქალაქის ცენტრშია, მემედ აბაშიძის გამზირთან; ნავიგატორში „Europe Square Batumi" აკრიფე. მანქანა
    მიმდებარე ქუჩების ფასიან პარკინგზე გააჩერე და ცენტრი ფეხით დაათვალიერე — პიაცა, ბულვარი და ძველი ქალაქი
    ერთმანეთის გვერდითაა. ეკონომ-კლასი საკმარისია.
en:
  name: Europe Square
  short: >-
    Batumi's showpiece square — the Medea column with the Golden Fleece, restored Belle Époque facades
    and an astronomical clock.
  body: >-
    **Europe Square is Batumi's calling card** — the spot where the city's oil-boom-era architecture looks
    its most polished. The square is framed by restored 19th- and early 20th-century facades with a scattering
    of 21st-century additions, and at its centre a tall column carries the figure of Medea.


    Davit Khmaladze's bronze Medea was unveiled on 6 July 2007. She holds the Golden Fleece — a direct
    nod to the Argonaut myth, which places the land of Colchis in today's western Georgia. For Batumi
    this is more than decoration: the city is claiming its seat in the ancient trading world.


    What to look for:


    - The Medea column, at its most dramatic under evening lighting

    - The astronomical clock on the former bank building (made in Germany in 2010), showing moon phases
    and sunrise and sunset times alongside the hour

    - The fountain, where local kids cool off in the summer heat


    The square doubles as the city's main stage: international concerts, the Batumoba city festival, Christmas
    markets and New Year celebrations all happen here. The Piazza is a five-minute walk away, so the two
    slot naturally into one stroll through the old quarter.
  tip: >-
    The square is always open and free. Give the clock a proper look — beyond the time it displays astronomical
    data, which most visitors walk straight past. Best photo windows are early morning (empty square)
    and evening (lighting). Expect crowds during July-August concerts. Cafes around the square are mid-priced;
    toilets are in nearby malls. There is no parking on the square itself — use paid street parking around
    it.
  route: >-
    From Tbilisi take the E60/S1 highway: Rikoti tunnels, the Kutaisi bypass, Samtredia, then the coast
    road through Kobuleti into Batumi — roughly 375 km and 5:30 of driving on asphalt the whole way, with
    fuel available throughout. Europe Square sits in the city centre by Memed Abashidze Avenue; type "Europe
    Square Batumi" into the navigator. Park on the surrounding streets (paid) and explore the centre on
    foot — the Piazza, the Boulevard and the Old Town are all adjacent. An economy car is enough.
ru:
  name: Площадь Европы
  short: >-
    Парадная площадь Батуми — колонна Медеи с золотым руном, отреставрированные фасады belle époque и
    астрономические часы.
  body: >-
    **Площадь Европы — визитная карточка Батуми,** место, где архитектура города эпохи нефтяного бума
    выглядит наряднее всего. Площадь обрамляют отреставрированные фасады XIX — начала XX века с вкраплениями
    построек века XXI, а в центре на высокой колонне стоит Медея.


    Бронзовую Медею скульптора Давида Хмаладзе открыли 6 июля 2007 года. В руках она держит золотое руно
    — прямую отсылку к мифу об аргонавтах, помещающему Колхиду на территорию нынешней Западной Грузии.
    Для Батуми это не просто украшение: город заявляет своё место в античном торговом мире.


    Что смотреть:


    - Колонну Медеи — эффектнее всего в вечерней подсветке

    - Астрономические часы на здании бывшего банка (изготовлены в Германии в 2010 году) — помимо времени
    показывают фазы луны и время восхода и заката

    - Фонтан, в котором летом плещутся местные дети


    Площадь служит главной сценой города: здесь проходят международные концерты, праздник Батумоба, рождественские
    ярмарки и новогодние гуляния. До Пьяццы отсюда пять минут пешком, так что обе площади укладываются
    в одну прогулку по старому кварталу.
  tip: >-
    Площадь открыта всегда, вход свободный. Присмотритесь к часам: кроме времени на циферблате — астрономические
    данные, мимо которых большинство проходит не глядя. Лучшие кадры — ранним утром (пустая площадь) и
    вечером (подсветка). В июле-августе во время концертов многолюдно. Кафе вокруг площади среднего ценового
    уровня; туалеты — в соседних торговых центрах. Парковки на самой площади нет — только платная на окрестных
    улицах.
  route: >-
    Из Тбилиси — по трассе E60/S1: Рикотские тоннели, объезд Кутаиси, Самтредиа, затем прибрежная дорога
    через Кобулети до Батуми — около 375 км и 5:30 езды, асфальт на всём пути, заправки повсюду. Площадь
    Европы находится в центре города у проспекта Мемеда Абашидзе; в навигаторе набирайте «Europe Square
    Batumi». Машину оставьте на платной парковке окрестных улиц и гуляйте пешком — Пьяцца, Бульвар и Старый
    город рядом. Эконом-класса достаточно.
fa:
  name: میدان اروپا (باتومی)
  short: میدان تشریفاتی باتومی — ستون مدئا با پشم زرین، نماهای مرمت‌شدهٔ «بل اپوک» و ساعت نجومی.
  body: >-
    **میدان اروپا کارت ویزیت باتومی است** — جایی که معماری دوران رونق نفتی شهر آراسته‌ترین چهرهٔ خود را
    دارد. دورتادور میدان را نماهای مرمت‌شدهٔ سدهٔ نوزدهم و اوایل بیستم گرفته‌اند، با چند افزودهٔ قرن بیست‌ویکمی،
    و در مرکز، بر ستونی بلند، پیکرهٔ مدئا ایستاده است.


    مدئای برنزی اثر داویت خمالادزه در 6 ژوئیهٔ 2007 پرده‌برداری شد. او پشم زرین را در دست دارد — اشاره‌ای
    مستقیم به اسطورهٔ آرگونات‌ها که سرزمین کلخیس را در غرب گرجستان امروزی می‌نهد. برای باتومی این فقط
    تزیین نیست: شهر جایگاه خود را در جهان بازرگانی باستان یادآوری می‌کند.


    چه چیزهایی را ببینید:


    - ستون مدئا — در نورپردازی شبانه از همه‌جا تماشایی‌تر

    - ساعت نجومی بر ساختمان بانک سابق (ساخت آلمان، 2010) که علاوه بر وقت، اهلهٔ ماه و زمان طلوع و غروب
    را نشان می‌دهد

    - فواره‌ای که بچه‌های محل در گرمای تابستان در آن آب‌تنی می‌کنند


    میدان صحنهٔ اصلی شهر هم هست: کنسرت‌های بین‌المللی، جشن شهر «باتوموبا»، بازارهای کریسمس و جشن سال نو
    همین‌جا برگزار می‌شوند. پیاتزا پنج دقیقه پیاده فاصله دارد، پس هر دو در یک گردش در محلهٔ قدیمی جا می‌شوند.
  tip: >-
    میدان همیشه باز و رایگان است. به ساعت با دقت نگاه کنید — جدا از وقت، داده‌های نجومی هم نشان می‌دهد
    و بیشتر بازدیدکنندگان بی‌اعتنا از کنارش می‌گذرند. بهترین زمان عکاسی صبح زود (میدان خالی) و شب (نورپردازی)
    است. در کنسرت‌های ژوئیه و اوت شلوغ می‌شود. کافه‌های اطراف قیمت متوسطی دارند؛ سرویس بهداشتی در مراکز
    خرید نزدیک است. خود میدان پارکینگ ندارد — از پارک حاشیه‌ای پولی خیابان‌های اطراف استفاده کنید.
  route: >-
    از تفلیس با بزرگراه E60/S1 بروید: تونل‌های ریکوتی، کمربندی کوتایسی، سامتردیا و سپس جادهٔ ساحلی از
    کوبولتی تا باتومی — حدود 375 کیلومتر و 5:30 ساعت رانندگی، سراسر آسفالت و پمپ‌بنزین در همه‌جا. میدان
    اروپا در مرکز شهر کنار خیابان ممد آباشیدزه است؛ در مسیریاب «Europe Square Batumi» را وارد کنید. خودرو
    را در پارکینگ پولی خیابان‌های اطراف بگذارید و مرکز را پیاده بگردید — پیاتزا، بلوار و شهر قدیم همه
    کنار هم‌اند. خودروی اقتصادی کافی است.
he:
  name: כיכר אירופה בבתומי
  short: כיכר הראווה של בתומי — עמוד מדיאה עם גיזת הזהב, חזיתות בל אפוק משוחזרות ושעון אסטרונומי.
  body: >-
    **כיכר אירופה היא כרטיס הביקור של בתומי** — המקום שבו אדריכלות עידן בום הנפט של העיר נראית במיטבה.
    את הכיכר מקיפות חזיתות משוחזרות מהמאה ה-19 ותחילת המאה ה-20, עם כמה תוספות בנות המאה ה-21, ובמרכזה
    ניצבת מדיאה על עמוד גבוה.


    פסל מדיאה מברונזה, מעשה ידי דוד חמלאדזה, נחנך ב-6 ביולי 2007. היא אוחזת בגיזת הזהב — רמז ישיר למיתוס
    הארגונאוטים, שממקם את קולכיס בשטחה של מערב גאורגיה של ימינו. עבור בתומי זה יותר מקישוט: העיר תובעת
    את מקומה בעולם המסחר העתיק.


    מה מחפשים בכיכר:


    - עמוד מדיאה — דרמטי במיוחד בתאורת הערב

    - השעון האסטרונומי על בניין הבנק לשעבר (נבנה בגרמניה ב-2010), שמציג לצד השעה גם את מופעי הירח וזמני
    הזריחה והשקיעה

    - המזרקה, שבה ילדי המקום מצטננים בחום הקיץ


    הכיכר משמשת גם הבמה הראשית של העיר: קונצרטים בינלאומיים, פסטיבל בתומובה, שוקי חג המולד וחגיגות השנה
    החדשה — הכול קורה כאן. הפיאצה במרחק חמש דקות הליכה, כך ששתי הכיכרות משתלבות בטיול אחד ברובע הישן.
  tip: >-
    הכיכר פתוחה תמיד והכניסה חופשית. הקדישו לשעון מבט אמיתי — מעבר לשעה הוא מציג נתונים אסטרונומיים שרוב
    המבקרים חולפים על פניהם. חלונות הצילום הטובים: בוקר מוקדם (כיכר ריקה) וערב (תאורה). ביולי-אוגוסט,
    בזמן קונצרטים, צפוף. בתי הקפה סביב הכיכר במחיר בינוני; שירותים בקניונים הסמוכים. אין חניה בכיכר עצמה
    — חנו בתשלום ברחובות שמסביב.
  route: >-
    מטביליסי נוסעים בכביש E60/S1: מנהרות ריקוטי, עוקף כותאיסי, סמטרדיה, ואז כביש החוף דרך קובולטי אל בתומי
    — כ-375 ק"מ ו-5:30 שעות נסיעה, אספלט לכל האורך ותחנות דלק בשפע. כיכר אירופה נמצאת במרכז העיר ליד שדרות
    ממד אבשידזה; הקלידו בניווט "Europe Square Batumi". חנו בתשלום ברחובות הסמוכים וסיירו במרכז ברגל —
    הפיאצה, הטיילת והעיר העתיקה צמודות זו לזו. רכב חסכוני מספיק.
ar:
  name: ساحة أوروبا في باتومي
  short: ساحة باتومي الاحتفالية — عمود ميديا حاملة الجزة الذهبية، وواجهات «العصر الجميل» المرممة، وساعة
    فلكية.
  body: >-
    **ساحة أوروبا هي بطاقة تعريف باتومي** — المكان الذي تبدو فيه عمارة المدينة من عصر ازدهار النفط في
    أبهى حللها. تحيط بالساحة واجهات مرممة من القرن التاسع عشر وأوائل العشرين مع لمسات من القرن الحادي
    والعشرين، وفي وسطها يقوم عمود عالٍ تعلوه ميديا.


    أزيح الستار عن تمثال ميديا البرونزي، للنحات دافيت خمالادزه، في 6 يوليو 2007. وهي تحمل الجزة الذهبية
    — إشارة مباشرة إلى أسطورة الأرغونوت التي تضع بلاد كولخيس في غرب جورجيا الحالي. وبالنسبة لباتومي ليس
    هذا مجرد زخرفة: المدينة تعلن مكانها في عالم التجارة القديم.


    ما الذي تبحث عنه في الساحة:


    - عمود ميديا — أكثر ما يكون تأثيراً تحت إضاءة المساء

    - الساعة الفلكية على مبنى المصرف السابق (صُنعت في ألمانيا عام 2010)، وتعرض إلى جانب الوقت أطوار القمر
    ومواقيت الشروق والغروب

    - النافورة التي ينتعش فيها أطفال المدينة في حر الصيف


    الساحة هي أيضاً المسرح الرئيسي للمدينة: هنا تقام الحفلات الدولية ومهرجان «باتوموبا» وأسواق الميلاد
    واحتفالات رأس السنة. والبياتزا على بعد خمس دقائق سيراً، فتجتمع الساحتان في نزهة واحدة عبر الحي القديم.
  tip: >-
    الساحة مفتوحة دائماً والدخول مجاني. أمعن النظر في الساعة — فهي تعرض إلى جانب الوقت بيانات فلكية يمر
    معظم الزوار بجانبها دون انتباه. أفضل أوقات التصوير: الصباح الباكر (ساحة خالية) والمساء (الإضاءة).
    توقع الزحام أثناء حفلات يوليو وأغسطس. المقاهي المحيطة متوسطة الأسعار؛ ودورات المياه في المراكز التجارية
    القريبة. لا مواقف في الساحة نفسها — استخدم مواقف الشوارع المدفوعة حولها.
  route: >-
    من تبليسي عبر الطريق السريع E60/S1: أنفاق ريكوتي، التفافية كوتايسي، سامتريديا، ثم طريق الساحل عبر
    كوبوليتي إلى باتومي — نحو 375 كم و5:30 ساعة قيادة على أسفلت كامل، والوقود متوفر طوال الطريق. تقع ساحة
    أوروبا في وسط المدينة قرب جادة ممد أباشيدزه؛ اكتب في الملاح «Europe Square Batumi». اركن السيارة في
    مواقف الشوارع المدفوعة المحيطة وتجول في المركز سيراً — البياتزا والكورنيش والمدينة القديمة متجاورة.
    سيارة اقتصادية تكفي.
