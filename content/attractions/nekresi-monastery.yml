ka:
  name: ნეკრესის მონასტერი
  short: >-
    VI საუკუნის მონასტერი ტყიან ბორცვზე ალაზნის ველის თავზე: ეპისკოპოსის სასახლე, მეფე ლევანის ფრესკა
    და მიწაში ჩაფლული ქვევრები.
  body: >-
    **დიდხანს ფიქრობდნენ, რომ ნეკრესში საქართველოს ერთ-ერთი უძველესი ეკლესია დგას; მერე არქეოლოგებმა მიწა
    გათხარეს — ამბავი გაახალგაზრდავდა, სამაგიეროდ უფრო საინტერესო გახდა.**


    ბორცვზე მდგარი პაწაწინა სამლოცველო — ოთხი კვადრატული მეტრი, ყველა მხრიდან ღია, იატაკის ქვეშ კამაროვანი
    სამარხით — IV საუკუნის ეკლესიად ითვლებოდა, ცეცხლთაყვანისმცემელთა სალოცავის ადგილზე აგებულად. 2008–2009
    წლების გათხრებმა VI საუკუნემდე აქ ადამიანის ყოფნის კვალი ვერ იპოვა. მონასტერიც სწორედ მაშინ დაიწყო
    — ბერმონაზვნობის იმ დიდ ტალღასთან ერთად, რომელსაც ცამეტ ასურელ მამას უკავშირებენ.


    გადმოცემა ნეკრესს ერთ-ერთ მათგანს, წმინდა აბიბოსს უკავშირებს. ის არაგვის აღმოსავლეთით მცხოვრებ მთიელებს
    უქადაგებდა და ცეცხლთაყვანისმცემლობას ებრძოდა — ამბობენ, ერთხელ წმინდა ცეცხლი წყლით ჩააქრო — სანამ
    შეიპყრეს და სიკვდილით დასაჯეს.


    კომპლექსი ტყიან ბორცვს, ნაზვრევ გორას აგვირგვინებს — სახელი „ნავენახარ გორას“ ნიშნავს, და ღვინო აქ
    მართლაც ყოველ ნაბიჯზეა. VI–VII საუკუნეების ღვთისმშობლის მიძინების სამეკლესიან ბაზილიკაში XVI საუკუნის
    ფრესკები შემორჩა: სამხრეთ კედელზე მეფე ლევანი მეუღლე თინათინთან და ძე ალექსანდრესთან ერთად დგას. გვერდით
    IX საუკუნის ეპისკოპოსის სასახლეა; მისი სარკმლების ნალისებრი თაღები საქართველოში X საუკუნის შემდეგ
    აღარ გამოუყენებიათ, პირველი სართული კი მთლიანად მარანია — დიდი ქვის საწნახლით, მიწაში ჩაფლული ქვევრებით
    და ჭერით, რომელსაც ერთადერთი რვაწახნაგა სვეტი იჭერს. ამას ემატება მცირე გუმბათოვანი მთავარანგელოზის
    ეკლესია (VIII–IX სს.), XII საუკუნის სატრაპეზო და XVI საუკუნის კოშკი, რომელიც სამრეკლოდაც გამოიყენებოდა.


    ლეკიანობის გამო ეპისკოპოსმა კათედრა 1785 წელს შილდაში გადაიტანა; 1811 წელს, ქართული ეკლესიის ავტოკეფალიის
    გაუქმების შემდეგ, ჯერ ეპარქია, მერე მონასტერიც გაუქმდა. ბერები აქ მხოლოდ 2000 წელს დაბრუნდნენ. ტერასიდან
    ალაზნის ველი ვენახებით მოქარგულა — ნავენახარი გორა ცოცხალ ვენახებს დაჰყურებს.
  tip: >-
    კერძო მანქანა ქვედა ავტოსადგომზე ჩერდება; ციცაბო ბოლო მონაკვეთზე მცირე საფასურად მიკროავტობუსი ადის,
    ან ფეხით ორმოციოდე წუთში ახვალთ. ბოლო დაღმავალი რეისის დრო წინასწარ გაიგეთ და დღის ბოლოს ნუ მიხვალთ.
    ორი საათი გაითვალისწინეთ. ნეკრესი კვლავ მოქმედი მონასტერია: მხრები და მუხლები დაფარული უნდა იყოს,
    ქალებს თავსაფარი დასჭირდებათ (მოსასხამები ადგილზე, როგორც წესი, არის). მიძინების ეკლესიის სამხრეთ
    კედელზე სამეფო ოჯახი მოძებნეთ, სასახლის მარანში კი — ქვის საწნახელი. ნაღდი ფული თან იქონიეთ.
  route: >-
    თბილისიდან ს5-ით გამოდით და ვაზიანთან შ38-ზე გადაუხვიეთ გომბორის უღელტეხილისკენ — ხვეული გზა ქედზე
    გადადის და თელავში ჩადის (დაახლოებით 90 კმ). თელავიდან შ70-ით ალაზანი გადაკვეთეთ, შემდეგ შ43-ით სამხრეთ-აღმოსავლეთით,
    ყვარლისკენ იარეთ; შილდის შემდეგ მარცხნივ შ197 მისასვლელი გზა ქვედა ავტოსადგომამდე ადის. სულ დაახლოებით
    127 კმ, ორი საათი და ოცდაათი წუთი. გზა ბოლომდე ასფალტია და ეკონომკლასის მანქანა საკმარისია, რადგან
    ციცაბო ბოლო მონაკვეთს მიკროავტობუსი გადის. თოვლში ს5-ით, გურჯაანის გავლით იარეთ. საწვავი თელავში ან
    ყვარელში ჩაასხით.
en:
  name: Nekresi Monastery
  short: >-
    A 6th-century monastery on a wooded spur above the Alazani valley, with a bishop's palace, a royal
    fresco and a cellar of buried qvevri.
  body: >-
    **For generations Nekresi was hailed as one of the oldest churches in Georgia; then the archaeologists
    dug, and the story grew younger and better.**


    The tiny chapel on this hill, four square metres, open on all sides, with a vaulted burial crypt beneath
    its floor, was long thought to be a 4th-century church built over a Zoroastrian shrine. Excavations
    in 2008–2009 found no sign of anyone on the hill before the 6th century. That is when the monastery
    began, in the wave of monasticism linked to the Thirteen Assyrian Fathers.


    Tradition gives Nekresi one of them, St Abibos. He preached to the mountain peoples east of the Aragvi
    and fought Zoroastrian fire-worship, once, the story goes, dousing a sacred flame with water, until
    he was seized and put to death.


    The complex crowns a wooded hillock called Nazvrevi Gora, 'the hill of former vineyards', and wine
    is never far away. The 6th–7th-century Church of the Dormition, a 'three-church basilica', keeps 16th-century
    frescoes in which King Leon of Kakheti stands with his wife Tinatin and their son Alexander. Beside
    it, the 9th-century bishop's palace has horseshoe-arched windows of a kind Georgian builders dropped
    after the 10th century, and a ground floor given over to wine: a great stone press, qvevri sunk in
    the earth, the ceiling carried on a single octagonal column. Add the small domed Church of the Archangel
    (8th–9th century), a 12th-century refectory and a 16th-century tower that doubled as a belfry.


    Dagestani raids drove the bishop down to Shilda in 1785, and after Russia abolished the Georgian Church's
    autocephaly in 1811 the see and the monastery were dissolved. Monks returned only in 2000. From the
    terrace the Alazani valley lies quilted with vines: the hill of former vineyards, looking down on
    the living ones.
  tip: >-
    Private cars stop at the lower car park; a minibus shuttle climbs the steep final road for a small
    fee, or you can walk up in about forty minutes. Check the time of the last shuttle down and don't
    arrive late in the day. Allow two hours. Nekresi is a working monastery again: cover shoulders and
    knees, and women need a headscarf (wraps are usually on hand). Look for the royal family on the south
    wall of the Dormition church and the stone winepress in the palace cellar. Carry some cash.
  route: >-
    Leave Tbilisi on the S5 and turn onto the Sh38 near Vaziani for the Gombori Pass, a winding climb
    over the ridge and down to Telavi (about 90 km). From Telavi take the Sh70 across the Alazani, then
    the Sh43 south-east towards Kvareli; past Shilda, the Sh197 access road on the left climbs to the
    lower car park. Total about 127 km; allow 2 hours 30 minutes. It is asphalt all the way, and an economy
    car is enough because the shuttle handles the steep final stretch. In snow, take the lower S5 route
    via Gurjaani. Fuel in Telavi or Kvareli.
ru:
  name: Монастырь Некреси
  short: >-
    Монастырь VI века на лесистом отроге над долиной Алазани — с архиерейским дворцом, царской фреской
    и погребом, где в землю вкопаны квеври.
  body: >-
    **Некреси веками называли одной из древнейших церквей Грузии — а потом за дело взялись археологи,
    и история монастыря стала моложе, но не менее интересной.**


    Крошечная часовня на этом холме — четыре квадратных метра, открытая со всех сторон, со сводчатой погребальной
    криптой под полом — долго считалась храмом IV века, построенным на месте зороастрийского капища. Раскопки
    2008–2009 годов не нашли следов жизни на холме до VI века. Именно тогда здесь начался монастырь —
    на волне монашеского движения, связанного с Тринадцатью сирийскими отцами.


    Предание связывает Некреси с одним из них — святым Абибосом. Он проповедовал горным народам к востоку
    от Арагви и боролся с зороастрийским огнепоклонством: по легенде, однажды залил священное пламя водой,
    — пока его не схватили и не казнили.


    Комплекс венчает лесистый холм под названием Назвреви Гора — «холм бывших виноградников», и вино здесь
    всегда рядом. В церкви Успения VI–VII веков, «трёхцерковной базилике», сохранились фрески XVI века,
    где кахетинский царь Леван (Леон) стоит рядом с супругой Тинатин и сыном Александром. Рядом — архиерейский
    дворец IX века с подковообразными арочными окнами, от которых грузинские строители отказались после
    X века; его нижний этаж целиком отдан вину: огромный каменный пресс, вкопанные в землю квеври, потолок
    держится на единственной восьмигранной колонне. Добавьте небольшую купольную церковь Архангела (VIII–IX
    века), трапезную XII века и башню XVI века, служившую и колокольней.


    В 1785 году набеги дагестанцев вынудили епископа перебраться в Шилду, а после того, как в 1811 году
    Россия отменила автокефалию Грузинской церкви, кафедра и монастырь были упразднены. Монахи вернулись
    только в 2000 году. С террасы долина Алазани лежит стёганым покровом виноградников: холм бывших виноградников
    смотрит на живые.
  tip: >-
    Личные машины останавливаются на нижней парковке; за небольшую плату микроавтобус-шаттл поднимается
    по крутой финальной дороге, либо можно подняться пешком — около сорока минут. Уточните время последнего
    спуска и не приезжайте под вечер. На посещение хватит двух часов. Некреси — снова действующий монастырь:
    плечи и колени нужно прикрыть, а женщинам понадобится платок (обычно есть на месте). Обратите внимание
    на царскую семью на южной стене церкви Успения и на каменный винный пресс в подвале дворца. Возьмите
    с собой немного наличных.
  route: >-
    Выезжайте из Тбилиси по трассе S5 и у Вазиани поверните на Sh38 к Гомборскому перевалу — извилистый
    подъём через хребет и спуск к Телави (около 90 км). Из Телави по Sh70 пересеките Алазани, затем по
    Sh43 двигайтесь на юго-восток в сторону Кварели; за Шилдой слева начинается подъездная дорога Sh197,
    ведущая к нижней парковке. Всего около 127 км, время в пути — 2 часа 30 минут. Дорога асфальтирована
    на всём протяжении, обычной машины достаточно, так как крутой финальный участок берёт на себя шаттл.
    В снегопад воспользуйтесь нижним маршрутом по S5 через Гурджаани. Заправиться можно в Телави или Кварели.
fa:
  name: صومعهٔ نکرسی
  short: >-
    صومعه‌ای از سدهٔ ششم میلادی بر دامنه‌ای جنگلی بالای درهٔ آلازانی، با کاخ اسقفی، نگاره‌ای از خانواده
    شاهی و انباری از کوِوری‌های مدفون در خاک.
  body: >-
    **نسل‌ها نکرسی را یکی از کهن‌ترین کلیساهای گرجستان می‌دانستند؛ اما باستان‌شناسان که کار خود را آغاز
    کردند، داستان جوان‌تر و درخشان‌تر از آب درآمد.**


    نمازخانهٔ کوچک این تپه — چهار متر مربع، رو به هر چهار سو باز، با دخمه‌ای طاق‌دار زیر کف آن — سال‌ها
    کلیسایی از سدهٔ چهارم پنداشته می‌شد که بر جای پرستشگاهی زرتشتی بنا شده باشد. کاوش‌های سال‌های ۲۰۰۸
    تا ۲۰۰۹ هیچ نشانی از سکونت بر این تپه پیش از سدهٔ ششم نیافت. صومعه از همان زمان، در موجی از رهبانیت
    که با سیزده پدر آسوری در پیوند است، آغاز شد.


    روایت یکی از آن سیزده تن، قدیس آبیبوس، را به نکرسی نسبت می‌دهد. او نزد قوم‌های کوهستانی شرق آراگوی
    به موعظه پرداخت و با آتش‌پرستی زرتشتی درافتاد؛ می‌گویند روزی شعله‌ای مقدس را با آب خاموش کرد، تا آن‌که
    او را دستگیر و به قتل رساندند.


    این مجموعه بر فراز تپه‌ای جنگلی به نام نازورِوی گورا، یعنی «تپهٔ تاکستان‌های پیشین»، نشسته و شراب
    هرگز از آن دور نیست. کلیسای خفتنِ مریم از سده‌های ششم و هفتم، یک «بازیلیکای سه‌کلیسایی»، نگاره‌های
    دیواری سدهٔ شانزدهم را نگه داشته که در آن لئون، پادشاه کاختی، در کنار همسرش تیناتین و پسرشان الکساندر
    ایستاده است. کنار آن، کاخ اسقفی سدهٔ نهم پنجره‌هایی با طاق نعل‌اسبی دارد، سبکی که معماران گرجی پس
    از سدهٔ دهم کنار گذاشتند، و طبقهٔ زیرین آن یکسره به شراب اختصاص یافته: چرخشتی سنگی بزرگ، کوِوری‌هایی
    در خاک فروبرده، و سقفی که تنها بر یک ستون هشت‌ضلعی تکیه دارد. کلیسای کوچک و گنبددار فرشتهٔ مقرب (سده‌های
    هشتم و نهم)، سفره‌خانه‌ای (ناهارخوری راهبان) از سدهٔ دوازدهم و برجی از سدهٔ شانزدهم که وظیفهٔ ناقوس‌خانه
    را نیز داشت، بر این مجموعه می‌افزایند.


    یورش‌های داغستانی‌ها در سال ۱۷۸۵ اسقف را به شیلدا کوچاند، و پس از آن‌که روسیه در سال ۱۸۱۱ استقلال
    کلیسایی (اتوکفالی) کلیسای گرجستان را برچید، این کرسی و صومعه منحل شدند. راهبان تنها در سال ۲۰۰۰ بازگشتند.
    از ایوان صومعه، درهٔ آلازانی چون لحافی از تاک‌ها گسترده است: تپهٔ تاکستان‌های پیشین، رو به تاکستان‌های
    زنده.
  tip: >-
    خودروهای شخصی در پارکینگ پایین توقف می‌کنند؛ ون سرویسی با هزینه‌ای اندک از مسیر پرشیب پایانی بالا
    می‌رود، یا می‌توانید پیاده بروید که حدود چهل دقیقه طول می‌کشد. زمان آخرین سرویس بازگشت را بررسی کنید
    و دیروقت نرسید. دو ساعت زمان کافی است. نکرسی بار دیگر صومعه‌ای فعال است: شانه و زانو را بپوشانید،
    و زنان به روسری نیاز دارند (معمولاً روسری در دسترس است). به تصویر خانوادهٔ شاهی بر دیوار جنوبی کلیسای
    خفتنِ مریم و چرخشت سنگی در زیرزمین کاخ توجه کنید. مقداری پول نقد همراه داشته باشید.
  route: >-
    از تفلیس در مسیر S5 حرکت کنید و نزدیک وازیانی به راه Sh38 به‌سوی گذرگاه گومبوری بپیچید — صعودی پرپیچ‌وخم
    از رشته‌کوه و فرود به تلاوی (حدود ۹۰ کیلومتر). از تلاوی با مسیر Sh70 از آلازانی بگذرید، سپس Sh43 را
    به‌سوی جنوب‌شرق و کوارلی ادامه دهید؛ پس از شیلدا، راه دسترسی Sh197 در سمت چپ به‌سوی پارکینگ پایین
    بالا می‌رود. مسافت کل حدود ۱۲۷ کیلومتر و زمان لازم ۲ ساعت و ۳۰ دقیقه است. راه تا انتها آسفالته است
    و یک خودروی معمولی کافی است، چون شیب پایانی را ون سرویس طی می‌کند. در برف، از مسیر پایین‌تر S5 از
    گورجانی استفاده کنید. سوخت‌گیری در تلاوی یا کوارلی ممکن است.
he:
  name: מנזר נקרסי
  short: מנזר מהמאה השישית על רכס מיוער מעל עמק האלאזני, עם ארמון בישוף, פרסקו מלכותי ומרתף ובו קוורי
    טמונים באדמה.
  body: >-
    **דורות שלמים תיארו את נקרסי כאחת הכנסיות העתיקות בגאורגיה; ואז חפרו הארכיאולוגים, והסיפור התגלה כצעיר
    יותר — וטוב יותר.**


    הקפלה הקטנה שעל הגבעה הזו — ארבעה מטרים רבועים, פתוחה לכל צדדיה, עם כריפטה קבורה מקומרת מתחת לרצפתה
    — נחשבה זמן רב לכנסייה מהמאה הרביעית שנבנתה על מקדש זורואסטרי. חפירות בשנים 2008–2009 לא מצאו כל סימן
    לנוכחות אנושית על הגבעה לפני המאה השישית. אז החל המנזר, בגל הנזירות שקשור לשלושה־עשר האבות האשוריים.


    המסורת מייחסת את נקרסי לאחד מהם, אביבוס הקדוש. הוא הטיף לעמי ההרים ממזרח לאראגווי ונלחם בהערצת האש
    הזורואסטרית; פעם, כך מספרים, הוא כיבה להבה קדושה במים, עד שנתפס והוצא להורג.


    המתחם עומד על גבעה מיוערת בשם נזורוואי גורה, "גבעת הכרמים לשעבר", והיין אינו רחוק ממנה לעולם. כנסיית
    ההשכבה מהמאות השישית–שביעית, "בזיליקת שלוש כנסיות", משמרת פרסקאות מהמאה השש־עשרה שבהן ניצב המלך לאון
    מקאחתי עם אשתו טינאטין ובנם אלכסנדר. לצידה, ארמון הבישוף מהמאה התשיעית מציג חלונות בעלי קשת פרסה,
    סגנון שהבנאים הגאורגים זנחו אחרי המאה העשירית, וקומת הקרקע שלו מוקדשת כולה ליין: גת אבן גדולה, קוורי
    טמונים בקרקע, והתקרה נשענת על עמוד מתומן בודד. הוסיפו לכך את כנסיית שרי־המלאכים הקטנה בעלת הכיפה (מאות
    שמינית–תשיעית), חדר אוכל של הנזירים (רפקטוריום) מהמאה ה-12 ומגדל מהמאה השש־עשרה ששימש גם כמגדל פעמונים.


    פשיטות דאגסטניות אילצו את הבישוף לעבור לשילדה ב-1785, ואחרי שרוסיה ביטלה את האוטוקפליה של הכנסייה
    הגאורגית ב-1811, בוטלו הבישופות (הדיוקסיה) והמנזר. הנזירים חזרו רק בשנת 2000. מהמרפסת נשקף עמק האלאזני
    כשמיכת טלאים של גפנים: גבעת הכרמים לשעבר, מביטה אל הכרמים החיים.
  tip: >-
    מכוניות פרטיות נעצרות בחניון התחתון; מיניבוס שאטל עולה בתשלום קטן בדרך התלולה האחרונה, או אפשר לעלות
    ברגל בכארבעים דקות. בדקו את שעת השאטל האחרון ואל תגיעו בשעה מאוחרת. שעתיים מספיקות. נקרסי הוא שוב
    מנזר פעיל: כסו כתפיים וברכיים, ונשים צריכות כיסוי ראש (בדרך כלל יש שם צעיפים). חפשו את המשפחה המלכותית
    על הקיר הדרומי של כנסיית ההשכבה ואת גת האבן במרתף הארמון. הביאו מזומן.
  route: >-
    צאו מטביליסי בכביש S5 ופנו לכביש Sh38 סמוך לוואזיאני לעבר מעבר גומבורי — טיפוס מתפתל מעל הרכס וירידה
    לטלאווי (כ-90 ק"מ). מטלאווי המשיכו בכביש Sh70 וחצו את האלאזני, ואז בכביש Sh43 דרום־מזרחה לעבר קוואראלי;
    אחרי שילדה, דרך הגישה Sh197 בצד שמאל עולה לחניון התחתון. בסך הכול כ-127 ק"מ; הקצו שעתיים וחצי. הכביש
    סלול לכל אורכו, ומכונית רגילה מספיקה כי את הקטע התלול האחרון עושה השאטל. בשלג, השתמשו במסלול התחתון
    S5 דרך גורג'אני. תדלוק בטלאווי או בקוואראלי.
ar:
  name: دير نيكريسي
  short: >-
    دير من القرن السادس على نتوء حرجي يعلو وادي ألازاني، فيه قصر الأسقف، وجدارية ملكية، وقبو مليء بجرار
    الكفيفري المدفونة.
  body: >-
    **لأجيال وُصف نيكريسي بأنه من أقدم كنائس جورجيا؛ ثم حفر علماء الآثار، فبدت القصة أحدث عهدًا وأجمل
    في آن.**


    الكنيسة الصغيرة على هذا التل — أربعة أمتار مربعة، مفتوحة من كل جانب، وتحت أرضها سرداب دفن مقنطر —
    ظُنّت طويلًا كنيسة من القرن الرابع بُنيت على أنقاض معبد زرادشتي. لم تعثر الحفريات في 2008–2009 على
    أي أثر لوجود بشري على التل قبل القرن السادس. وفي ذلك الوقت بالذات بدأ الدير، في موجة الرهبنة المرتبطة
    بالآباء الآشوريين الثلاثة عشر.


    ينسب التقليد نيكريسي إلى أحدهم، القديس أبيبوس. بشّر بين شعوب الجبال شرق نهر أراغفي وحارب عبادة النار
    الزرادشتية؛ وتقول الرواية إنه أخمد يومًا لهبًا مقدسًا بالماء، حتى قُبض عليه وقُتل.


    يتوّج هذا المجمّع تلًا حرجيًا يُدعى نازفريفي غورا، أي «تل الكروم السابقة»، والنبيذ لا يغيب عنه أبدًا.
    كنيسة الرقاد من القرنين السادس والسابع، وهي «بازيليكا ثلاثية الكنائس»، تحتفظ بجداريات من القرن السادس
    عشر يقف فيها الملك ليون ملك كاخيتي إلى جانب زوجته تيناتين وابنهما ألكسندر. وإلى جانبها، يضم قصر الأسقف
    من القرن التاسع نوافذ ذات عقود حدوية (على شكل حدوة الحصان)، طراز تركه البنّاؤون الجورجيون بعد القرن
    العاشر، وطابقه الأرضي مخصص كليًا للنبيذ: معصرة حجرية ضخمة، وجرار كفيفري مغروسة في الأرض، وسقف يرتكز
    على عمود ثُماني واحد. يضاف إلى ذلك كنيسة رئيس الملائكة الصغيرة ذات القبة (القرنان الثامن والتاسع)،
    وقاعة طعام من القرن الثاني عشر، وبرج من القرن السادس عشر كان يُستخدم أيضًا برجًا للأجراس.


    دفعت غارات الداغستانيين الأسقف إلى النزوح إلى شيلدا عام 1785، وبعد أن ألغت روسيا استقلال الكنيسة الجورجية
    (الأوتوكيفالية) عام 1811، حُلّت الأسقفية والدير معًا. لم يعد الرهبان إلا في عام 2000. من الشرفة يمتد
    وادي ألازاني كلحاف من الكروم: تل الكروم السابقة، يطل على كروم لا تزال حية.
  tip: >-
    تتوقف السيارات الخاصة عند الموقف السفلي؛ وترتقي حافلة صغيرة الطريق الأخير الشديد الانحدار بأجر رمزي،
    أو يمكن المشي صعودًا في نحو أربعين دقيقة. تحققوا من وقت آخر حافلة نازلة ولا تصلوا في وقت متأخر من
    اليوم. ساعتان كافيتان. نيكريسي دير عامر بالرهبان من جديد: غطّوا الكتفين والركبتين، وتحتاج النساء إلى
    غطاء رأس (تتوفر أوشحة عادة في الموقع). تأمّلوا صورة العائلة الملكية على الجدار الجنوبي لكنيسة الرقاد
    والمعصرة الحجرية في قبو القصر. احملوا بعض النقود.
  route: >-
    اخرجوا من تبليسي على طريق S5 وانحرفوا قرب فازياني إلى الطريق Sh38 نحو ممر غومبوري — صعود متعرج فوق
    السلسلة ونزول إلى تيلافي (نحو 90 كم). من تيلافي خذوا الطريق Sh70 عبر ألازاني، ثم Sh43 جنوب شرقًا نحو
    كفاريلي؛ بعد شيلدا، يصعد طريق الوصول Sh197 على اليسار إلى الموقف السفلي. المسافة الإجمالية نحو 127
    كم؛ خصّصوا ساعتين ونصفًا. الطريق مُعبّد بالكامل، وتكفي سيارة اقتصادية لأن الحافلة تتولى المنحدر الأخير
    الشديد. في حال الثلوج، اتخذوا الطريق السفلي S5 عبر غورجاني. التزود بالوقود ممكن في تيلافي أو كفاريلي.
