ka:
  name: ნეკრესის მონასტერი
  short: IV საუკუნის ერთ-ერთი უძველესი ეკლესია საქართველოში, ტყიან ფერდობზე, ალაზნის ველის ფართო ხედით.
  body: >-
    ნეკრესი ყვარლის მახლობლად, კავკასიონის სამხრეთ ფერდობზეა გაშენებული, ველიდან დაახლოებით სამასი მეტრით
    მაღლა. კომპლექსი რამდენიმე შენობისგან შედგება და მათ შორის ყველაზე ძველი პატარა, სამნავიანი სამლოცველოა,
    რომელიც IV საუკუნის მეორე ნახევრით თარიღდება — ეს საქართველოში შემორჩენილი უძველესი საეკლესიო ნაგებობებიდან
    ერთ-ერთია, აშენებული ქრისტიანობის სახელმწიფო რელიგიად გამოცხადებიდან სულ რამდენიმე ათწლეულში.


    გვერდით დგას VI–VII საუკუნეების სამების ეკლესია, IX საუკუნის მთავარეპისკოპოსის სასახლე თაღოვანი დარბაზით
    და დიდი მარანი, სადაც ორმოცდაათამდე ქვევრია მიწაში ჩაფლული. მონასტერი VI საუკუნეში ასურელმა მამამ
    აბიბოს ნეკრესელმა განაახლა; მისი სახელი ცეცხლთაყვანისმცემლობის წინააღმდეგ ბრძოლას უკავშირდება და მან
    სწამებით დაასრულა სიცოცხლე.


    ავტომობილით ზემოთ ასვლა აკრძალულია: მანქანა ქვემოთ, სპეციალურ სადგომზე რჩება და მონასტრამდე პატარა
    ავტობუსი დადის, რომელიც ორ კილომეტრზე მეტ ციცაბო აღმართს ფარავს. სურვილის შემთხვევაში ბილიკით ფეხითაც
    ახვალთ, დაახლოებით ორმოცი წუთი. ზემოდან ალაზნის ველი და კავკასიონის კედელი მთელი სიგანით იშლება —
    ბევრი მნახველისთვის სწორედ ეს პანორამა რჩება ვიზიტის მთავარ შთაბეჭდილებად. ტერიტორია ჩრდილიანია და
    ზაფხულშიც სასიამოვნო. შემოდგომაზე ფერდობის ტყე ყვითლდება და ზემოდან ეს ხედი განსაკუთრებით ეფექტურია.
    ნეკრესი ლოგიკურად ერთიანდება გრემთან და ყვარელთან ერთ დღეში, რადგან სამივე ერთსა და იმავე გზაზეა,
    ერთმანეთისგან ოციოდე კილომეტრში.
  tip: >-
    გაითვალისწინეთ ავტობუსის ფაქტორი: ბილეთი იყიდება ქვედა სადგომზე, რეისები რამდენიმე წუთის ინტერვალითაა,
    მაგრამ ბოლო დაშვება საღამოს ადრე ხდება — ნუ ჩახვალთ დღის ბოლოს. ორი საათი ეყოფა ასვლას, კომპლექსს
    და ხედს. ჩაცმა მოკრძალებული უნდა იყოს, თავსაბურავები ადგილზეა. ქვედა სადგომზეა ტუალეტი და პატარა ჯიხური;
    ბანკომატი მხოლოდ ყვარელშია, ამიტომ ნაღდი ფული თან იქონიეთ.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე, შემდეგ ყვარლის მიმართულებით გრემის გავლით — სულ დაახლოებით
    135 კმ და ორ საათ ნახევრამდე. მთელი მარშრუტი ასფალტიანია და ეკონომ კლასის მანქანა სავსებით საკმარისია,
    რადგან ციცაბო ნაწილს ავტობუსი გადის. მოსახვევი ნეკრესისკენ მაგისტრალიდან მარცხნივაა და მითითებულია.
    საწვავს ავსებთ თელავში ან ყვარელში. ბრტყელი ალტერნატივაა კახეთის გზატკეცილი საგარეჯო–გურჯაანზე, დაახლოებით
    ოცდაათი კილომეტრით გრძელი, სამაგიეროდ უღელტეხილის გარეშე.
en:
  name: Nekresi Monastery
  short: >-
    One of the oldest surviving churches in Georgia, on a wooded slope with a sweeping view over the Alazani
    Valley.
  body: >-
    Nekresi sits on the southern slope of the Caucasus near Kvareli, about three hundred metres above
    the valley floor. The complex holds several buildings, and the oldest of them is a small three-nave
    chapel dated to the second half of the fourth century — one of the earliest surviving church structures
    in the country, built within a few decades of Christianity becoming the state religion. It is plain,
    low and easy to walk past, which is part of its appeal.


    Beside it stand the Trinity church of the sixth or seventh century, a ninth-century archbishop's palace
    with a vaulted hall, and a large **marani** where some fifty qvevri are sunk into the floor. The monastery
    was renewed in the sixth century by Abibos of Nekresi, one of the Assyrian Fathers, whose name is
    tied to the struggle against Zoroastrian fire worship and who was killed for it.


    Private cars cannot drive up. You leave the car at a lower car park and take a shuttle minibus that
    covers the two kilometres of steep climbing; alternatively you can walk the path in about forty minutes.
    From the top the Alazani plain and the Caucasus wall open out across the whole horizon, and for many
    visitors that panorama, rather than any single building, is what the trip is remembered for. The grounds
    are shaded and stay pleasant even in summer.
  tip: >-
    Plan around the shuttle. Tickets are sold at the lower car park, minibuses run every few minutes,
    but the last descent is fairly early in the evening, so do not arrive at the end of the day. Two hours
    covers the ride up, the complex and the viewpoint. Dress modestly; wraps are available on site. The
    lower car park has a toilet and a small kiosk, but the nearest ATM is in Kvareli, so carry cash.
  route: >-
    From Tbilisi cross the Gombori Pass to Telavi, then head towards Kvareli past Gremi — around 135 km
    and roughly two and a half hours. The entire route is asphalt and an economy car is sufficient, since
    the steep section is handled by the shuttle. The turning for Nekresi is on the left off the main road
    and is signposted. Fuel is available in Telavi and Kvareli. The flat alternative is the Kakheti Highway
    via Sagarejo and Gurjaani, about thirty kilometres longer but with no mountain pass.
ru:
  name: Монастырь Некреси
  short: Одна из древнейших сохранившихся церквей Грузии на лесистом склоне с широким видом на Алазанскую
    долину.
  body: >-
    Некреси стоит на южном склоне Кавказа неподалёку от Кварели, метров на триста выше дна долины. Комплекс
    состоит из нескольких построек, и самая старая из них — небольшая трёхнефная часовня, которую относят
    ко второй половине IV века. Это одно из древнейших сохранившихся церковных сооружений страны, возведённое
    всего через несколько десятилетий после того, как христианство стало государственной религией. Здание
    простое и низкое, мимо него легко пройти, и в этом часть его обаяния.


    Рядом находятся церковь Троицы VI–VII веков, дворец архиепископа IX века со сводчатым залом и большой
    **марани**, где в пол вкопано около полусотни квеври. Монастырь обновил в VI веке Абибос Некресский,
    один из ассирийских отцов; его имя связано с борьбой против огнепоклонства, за что он и был казнён.


    Подъезжать на своей машине наверх нельзя: её оставляют на нижней стоянке, а до монастыря идёт микроавтобус,
    покрывающий два километра крутого подъёма. При желании можно подняться пешком по тропе примерно за
    сорок минут. Сверху Алазанская равнина и стена Кавказа разворачиваются на весь горизонт, и для многих
    именно эта панорама, а не отдельная постройка, остаётся главным впечатлением. Территория тенистая
    и приятная даже летом.
  tip: >-
    Планируйте визит с учётом шаттла: билеты продают на нижней стоянке, микроавтобусы ходят каждые несколько
    минут, но последний спуск довольно ранний, так что не приезжайте под конец дня. Двух часов хватит
    на подъём, осмотр комплекса и смотровую площадку. Одежда нужна скромная, накидки есть на месте. На
    нижней стоянке туалет и небольшой киоск, ближайший банкомат — в Кварели, поэтому берите наличные.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави, затем в сторону Кварели мимо Греми — около 135 км и
    примерно два с половиной часа. Весь маршрут асфальтовый, машины эконом-класса достаточно, поскольку
    крутой участок проходит шаттл. Поворот на Некреси уходит налево с основной дороги и обозначен указателем.
    Заправиться можно в Телави и Кварели. Ровная альтернатива — Кахетинское шоссе через Сагареджо и Гурджаани:
    примерно на тридцать километров длиннее, зато без горного перевала.
fa:
  name: صومعهٔ نکرسی
  short: یکی از کهن‌ترین کلیساهای برجای‌مانده در گرجستان، روی دامنه‌ای جنگلی با نمایی گسترده بر درهٔ آلازانی.
  body: >-
    نکرسی روی دامنهٔ جنوبی قفقاز نزدیک کوارلی نشسته است، حدود سیصد متر بالاتر از کف دره. مجموعه چند بنا
    دارد و کهن‌ترین آن‌ها نمازخانه‌ای کوچک و سه‌شبستانی است که به نیمهٔ دوم سدهٔ چهارم تاریخ‌گذاری شده
    — یکی از نخستین ساختارهای کلیسایی برجای‌مانده در کشور، ساخته‌شده تنها چند دهه پس از آنکه مسیحیت دین
    رسمی شد. ساده و کوتاه است و به‌آسانی می‌توان از کنارش گذشت، و همین بخشی از جذابیت آن است.


    کنار آن کلیسای تثلیث از سدهٔ ششم یا هفتم، کاخ اسقف اعظم از سدهٔ نهم با تالاری طاق‌دار، و **مارانی**
    بزرگی ایستاده‌اند که در آن حدود پنجاه کوِوری در کف فرو رفته است. صومعه در سدهٔ ششم به دست آبیبوس نکرسی،
    یکی از پدران آشوری، نوسازی شد؛ نامی که با ستیز علیه آتش‌پرستی زرتشتی گره خورده و به همین سبب کشته
    شد.


    خودروی شخصی نمی‌تواند بالا برود. خودرو را در پارکینگ پایینی می‌گذارید و با ون رفت‌وآمدی دو کیلومتر
    سربالایی تند را می‌پیمایید؛ یا می‌توانید بیلیک را در حدود چهل دقیقه پیاده بروید. از بالا دشت آلازانی
    و دیوار قفقاز در تمام افق باز می‌شوند و برای بسیاری همین منظره، نه هیچ بنای منفرد، چیزی است که از
    سفر در خاطر می‌ماند. محوطه سایه‌دار است و حتی در تابستان خوشایند می‌ماند.
  tip: >-
    برنامه را حول ون رفت‌وآمدی بچینید. بلیت در پارکینگ پایینی فروخته می‌شود و ون‌ها هر چند دقیقه حرکت
    می‌کنند، اما آخرین سرویس پایین نسبتاً زود در عصر است، پس در پایان روز نرسید. دو ساعت برای بالا رفتن،
    مجموعه و نقطهٔ دید کافی است. پوشش محجوب داشته باشید؛ در محل پوشش موجود است. پارکینگ پایینی سرویس بهداشتی
    و دکه‌ای کوچک دارد، اما نزدیک‌ترین خودپرداز در کوارلی است، پس پول نقد همراه ببرید.
  route: >-
    از تفلیس از گردنهٔ گومبوری به تلاوی بروید و سپس از کنار گرمی به سوی کوارلی — حدود 135 کیلومتر و تقریباً
    دو ساعت و نیم. تمام مسیر آسفالت است و خودروی اقتصادی کافی، چون بخش تند را ون رفت‌وآمدی می‌پیماید.
    انشعاب نکرسی در سمت چپ جادهٔ اصلی است و علامت‌گذاری شده. سوخت در تلاوی و کوارلی هست. جایگزین هموار،
    بزرگراه کاختی از راه ساگارجو و گورجانی است؛ حدود سی کیلومتر طولانی‌تر اما بدون گردنهٔ کوهستانی.
he:
  name: מנזר נקרסי
  short: אחת הכנסיות העתיקות ששרדו בגאורגיה, על מדרון מיוער עם נוף רחב אל עמק אלאזני.
  body: >-
    נקרסי יושב על המדרון הדרומי של הקווקז ליד קווארלי, כשלוש מאות מטרים מעל קרקעית העמק. המתחם כולל כמה
    מבנים, והעתיק שבהם הוא קפלה קטנה בת שלושה אולמות המתוארכת למחצית השנייה של המאה הרביעית — אחד ממבני
    הכנסייה העתיקים ביותר ששרדו במדינה, שנבנה כמה עשורים בלבד לאחר שהנצרות הפכה לדת המדינה. הוא פשוט ונמוך
    וקל לחלוף על פניו בלי לשים לב, וגם בזה טמון חלק מקסמו.


    לצידו עומדים כנסיית השילוש מן המאה השישית או השביעית, ארמון ארכיבישוף מן המאה התשיעית עם אולם מקומר,
    ו**מראני** גדול שבו כחמישים כדי קווברי שקועים ברצפה. המנזר חודש במאה השישית בידי אביבוס מנקרסי, אחד
    האבות האשורים, ששמו קשור למאבק בפולחן האש הזורואסטרי ושנהרג בשל כך.


    מכוניות פרטיות אינן יכולות לעלות. משאירים את הרכב בחניון התחתון ועולים במיניבוס הסעה שעושה שני קילומטרים
    של טיפוס תלול; לחלופין אפשר ללכת בשביל בכארבעים דקות. מלמעלה נפרשים מישור אלאזני וחומת הקווקז על פני
    כל האופק, ועבור מבקרים רבים דווקא הפנורמה הזאת, ולא מבנה מסוים, היא מה שנחרט בזיכרון. שטח המנזר מוצל
    ונשאר נעים גם בקיץ.
  tip: >-
    תכננו סביב ההסעה. הכרטיסים נמכרים בחניון התחתון והמיניבוסים יוצאים כל כמה דקות, אך הירידה האחרונה
    מוקדמת יחסית בערב, לכן אל תגיעו בסוף היום. שעתיים מספיקות לנסיעה למעלה, למתחם ולנקודת התצפית. התלבשו
    בצניעות; כיסויים זמינים במקום. בחניון התחתון יש שירותים ודוכן קטן, אבל הכספומט הקרוב ביותר נמצא בקווארלי,
    לכן קחו איתכם מזומן.
  route: >-
    מטביליסי חצו את מעבר גומבורי לטלאווי, ומשם המשיכו לכיוון קווארלי על פני גרמי — כ-135 ק"מ וכשעתיים
    וחצי. כל המסלול סלול ורכב חסכוני מספיק, מפני שאת הקטע התלול עושה ההסעה. הפנייה לנקרסי נמצאת משמאל
    לכביש הראשי ומסומנת בשילוט. דלק זמין בטלאווי ובקווארלי. החלופה השטוחה היא כביש קחתי דרך סאגארג'ו וגורג'אני,
    ארוכה בכשלושים קילומטרים אך בלי מעבר הרים כלל.
ar:
  name: دير نيكريسي
  short: من أقدم الكنائس الباقية في جورجيا، على منحدر مشجر بإطلالة واسعة على وادي ألازاني.
  body: >-
    يقع دير نيكريسي على المنحدر الجنوبي للقوقاز قرب كفاريلي، على ارتفاع نحو ثلاثمئة متر فوق قاع الوادي.
    ويضم المجمع عدة مبانٍ، أقدمها كنيسة صغيرة ثلاثية الصحون تعود إلى النصف الثاني من القرن الرابع — وهي
    من أوائل المنشآت الكنسية الباقية في البلاد، إذ بُنيت بعد عقود قليلة من جعل المسيحية ديناً للدولة.
    وهي بسيطة ومنخفضة ويسهل أن تمر بها من دون أن تنتبه، وهذا جزء من فتنتها.


    وإلى جانبها تقوم كنيسة الثالوث من القرن السادس أو السابع، وقصر رئيس أساقفة من القرن التاسع بقاعة معقودة،
    و**مراني** كبير غُرست في أرضه نحو خمسين جرة كفيفري. وقد جدد الدير في القرن السادس أبيبوس النيكريسي،
    أحد الآباء الآشوريين، وارتبط اسمه بالتصدي لعبادة النار الزرادشتية وقُتل من أجل ذلك.


    ولا يمكن للسيارات الخاصة الصعود. تترك سيارتك في الموقف السفلي وتستقل حافلة صغيرة ناقلة تقطع الكيلومترين
    من الصعود الحاد؛ أو يمكنك قطع الدرب سيراً في نحو أربعين دقيقة. ومن الأعلى ينفتح سهل ألازاني وجدار
    القوقاز على الأفق كله، وبالنسبة إلى كثير من الزوار فإن هذه البانوراما، لا أي مبنى بعينه، هي ما يبقى
    في الذاكرة. وأرض الدير مظللة وتبقى لطيفة حتى في الصيف.
  tip: >-
    خطط على أساس الحافلة الناقلة. تُباع التذاكر في الموقف السفلي، وتنطلق الحافلات كل بضع دقائق، لكن آخر
    نزول مبكر نسبياً في المساء، فلا تصل في نهاية اليوم. وساعتان تكفيان للصعود والمجمع والمطل. والبس ملابس
    محتشمة؛ والأغطية متوفرة في الموقع. وفي الموقف السفلي دورة مياه وكشك صغير، لكن أقرب صراف آلي في كفاريلي،
    فاحمل نقداً معك.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي، ثم اتجه نحو كفاريلي مروراً بغريمي — نحو 135 كم وقرابة ساعتين
    ونصف. الطريق كله معبّد وسيارة اقتصادية تكفي، لأن الحافلة الناقلة تتولى المقطع الحاد. والمنعطف إلى
    نيكريسي على يسار الطريق الرئيسي ومُشار إليه باللافتات. والوقود متوفر في تيلافي وكفاريلي. أما البديل
    المستوي فهو طريق كاخيتي السريع عبر ساغاريجو وغورجاني، وهو أطول بنحو ثلاثين كيلومتراً لكن بلا ممر جبلي.
