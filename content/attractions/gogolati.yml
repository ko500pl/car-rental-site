ka:
  name: გოგოლათის ისტორიული სოფელი
  short: >-
    250 წლამდე ასაკის ხის ოდა-სახლები შარეულას ნაპირას, აივნებზე ამოკვეთილი ჯვრებით, ფრინველებითა და ცხოველებით
    — ჯერ კიდევ გადარჩენის მოლოდინში.
  body: >-
    **გოგოლათის სახლები ხისა და ქვის ფეხებზე შემდგარა, ნესტიან მიწას რომ მოსცილდეს — და ზოგი მათგანი ასე
    ორი საუკუნეა დგას.**


    პატარა სოფელი ამბროლაურის მუნიციპალიტეტში, რიონის მარცხენა შენაკადის, შარეულას ნაპირზე, ზღვის დონიდან
    დაახლოებით 600 მეტრზე მდებარეობს. აქ 54 ისტორიული სახლია შემორჩენილი, ზოგი თითქმის 250 წლისა. ეს ოდა-სახლებია,
    დასავლეთ საქართველოს ხის ნაგებობის ტიპი: ბოძებზე აწეული საცხოვრებელი სართული, ფასადს გაყოლებული ღია
    აივანი და მოაჯირები, რომლებშიც ჯვრები, ფრინველები და ცხოველებია ამოჭრილი. ტურიზმის ეროვნული ადმინისტრაციის
    ცნობით, გოგოლათში გამორჩეული ხის ოსტატები ცხოვრობდნენ — და ეს ეტყობა კიდეც. 2019 წელს სოფელი კულტურული
    მემკვიდრეობის ძეგლთა ეროვნულ სიაში შეიტანეს.


    სიმართლისთვის მზად იყავით. რამდენიმე წლის წინ ხელისუფლებამ სახლების აღსადგენად თითქმის 6 მილიონი ლარი
    აღუთქვა და პირობა დადო, რომ გოგოლათი საქართველოს ერთ-ერთ ყველაზე პოპულარულ ტურისტულ ადგილად იქცეოდა;
    2024 წლის ივლისში, როცა აქ „რადიო თავისუფლების“ ჟურნალისტები ჩამოვიდნენ, სამუშაოები ჯერაც არ დაწყებულიყო.
    თუნუქის სახურავების ქვეშ ფიცრები ვერცხლისფრად გაცრეცილა, ხეში წყალი ჟონავს, ზოგ კარს კი ბოქლომი ადევს
    და მიღმა ოთახები ნელ-ნელა ლპება. მეპატრონეთა უმეტესობა მხოლოდ გაზაფხულიდან გვიან შემოდგომამდე ამოდის.


    ზოგი მასპინძელი სიამოვნებით გაჩვენებთ თავის სახლს. სოფლის ირგვლივ შარეულას კარსტში კანიონები ამოუღრმავებია.
    ქვახიდი, იგივე ქვიხითი, ბუნებრივი ქვის ხიდია — ხეობის თავზე კლდეებს შორის გაჭედილი უზარმაზარი ლოდი.
    „ოთხთითა“ კლდეში ნაკვეთი პატარა ოთახია, სადაც, გადმოცემით, მტრის შემოსევისას ხეობის გასაფრთხილებლად
    ჩირაღდნებს ანთებდნენ. სოფლიდან აღმოსავლეთით, დაახლოებით 1,5 კილომეტრში, მარჯვენა ნაპირზე, ტყით შენიღბული
    ციცაბო ფერდის თავში გოგოლათის მღვიმეა, სტალაქტიტებით მოფენილი.


    მოდით, სანამ ჩუქურთმა ჯერ კიდევ იკითხება.
  tip: >-
    საათნახევარი დაუთმეთ, ქვის ხიდისა და მღვიმისთვის — მეტი. ეს კერძო სახლებია: ეზოში შესვლამდე ნებართვა
    ითხოვეთ, აივნებზე ნუ ახვალთ, რადგან ძველი ფიცარი შეიძლება დამპალი იყოს, სახურავებს ზემოთ დრონის აფრენამდე
    კი მასპინძლებს ჰკითხეთ. მაღაზია, კაფე და ტუალეტი არ არის, ამიტომ წყალი და საგზალი თან იქონიეთ, ცოტა
    ნაღდი ფულიც — თუ ვინმე თაფლს ან ღვინოს შემოგთავაზებთ. ტურიზმის ადმინისტრაციის რჩევით, სოფელი განსაკუთრებით
    გვიან შემოდგომაზე და ადრე გაზაფხულზეა კარგი. წვიმის შემდეგ ბოლო გრუნტის მონაკვეთი ტალახდება, ზამთარში
    კი თოვლი გზას ძნელად სავალს ხდის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით, შემდეგ შ17-ით ნაქერალას
    უღელტეხილი გადაიარეთ ამბროლაურამდე (დაახლოებით 265 კმ). ამბროლაურში დასავლეთით, შ16 გზაზე, ალპანის
    მიმართულებით გადაუხვიეთ და რიონს დაახლოებით 25 კილომეტრი ჩაჰყევით; ზედა ღვარდიასთან მარცხნივ შეუხვიეთ
    და შარეულას ხეობით ბოლო 3,5 კილომეტრი აიარეთ — გრუნტის ვიწრო გზით, მაღალი კლდეების ქვეშ. სულ დაახლოებით
    285 კმ, ოთხნახევარი საათი. ქუთაისიდან, წყალტუბოსა და ალპანის გავლით, შ16-ით დაახლოებით 68 კმ-ია. მშრალ
    ამინდში ეკონომ-კლასის მანქანაც გაუძლებს; წვიმის შემდეგ ნელა იარეთ.
en:
  name: Historic Village of Gogolati
  short: >-
    Timber oda houses up to 250 years old above the Shareula, their balconies cut with crosses, birds
    and animals, and still waiting for rescue.
  body: >-
    **The houses of Gogolati stand on legs of timber and stone, lifted clear of the damp ground, and some
    have stood that way for two centuries.**


    This small village lies on the Shareula, a left-bank tributary of the Rioni, at about 600 metres in
    Ambrolauri municipality. It keeps 54 historic homes, some almost 250 years old, and they are oda houses,
    the timber type of western Georgia: a living floor raised on posts, an open gallery along the front,
    balustrades pierced with crosses, birds and animals. Skilled carpenters once lived here, says the
    national tourism board, and it shows. In 2019 it was entered on Georgia's national list of cultural
    heritage monuments.


    Come prepared for the truth. Some years ago the government promised almost 6 million lari to restore
    the houses and turn Gogolati into one of Georgia's most popular sights; when reporters from RFE/RL
    visited in July 2024, the work had not begun. The planks have weathered to silver-grey under tin roofs,
    water is getting into the timber, and a few doors are padlocked on rooms that are slowly rotting.
    Most owners now come up only from spring to late autumn.


    Some owners are glad to show you round. Around the village the Shareula has cut karst canyons. Kvakhidi,
    also called Kvikhiti, is a natural stone bridge, a huge boulder wedged between rocks above the gorge;
    its name simply means "stone bridge". Otkhtita is a small chamber carved into the cliff where, tradition
    says, torches were lit to warn the valley of raiders. About 1.5 km east, at the top of a steep wooded
    slope on the right bank, Gogolati cave is hung with stalactites.


    Come while the carving can still be read.
  tip: >-
    Allow an hour and a half, more for the stone bridge and the cave. These are private homes: ask before
    entering a yard, keep off the galleries, where old boards may be rotten, and ask before flying a drone
    over the roofs. There is no shop, café or toilet, so bring water and food, and some cash in case someone
    offers honey or wine. The tourism board rates late autumn and early spring as the best seasons for
    the village. After rain the unpaved last stretch turns to mud; in winter snow makes it hard going.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km, turn north between Zestaponi and Kutaisi on
    the Sh19 through Terjola to Tkibuli, and cross the Nakerala pass on the Sh17 to Ambrolauri (about
    265 km). There turn west on the Sh16, down the Rioni towards Alpana, for about 25 km; at Zeda Ghvardia
    turn left up the Shareula for the last 3.5 km, unpaved and narrow under tall rock walls. Total about
    285 km, some four and a half hours. From Kutaisi it is about 68 km via Tskaltubo and Alpana on the
    Sh16. An economy car copes in dry weather; after rain, go slowly.
ru:
  name: Историческое село Гоголати
  short: >-
    Деревянные дома-оды возрастом до 250 лет над Шареулой, с балконами, прорезанными крестами, птицами
    и зверями, — и всё ещё ждущие спасения.
  body: >-
    **Дома Гоголати стоят на деревянных и каменных опорах, приподнятые над сырой землёй, и некоторые стоят
    так уже два столетия.**


    Это небольшое село лежит на Шареуле, левом притоке Риони, на высоте около 600 метров в Амбролаурском
    муниципалитете. Здесь сохранилось 54 исторических дома, некоторым почти 250 лет, и это оды — деревянный
    тип жилища Западной Грузии: жилой этаж, поднятый на столбах, открытая галерея вдоль фасада, балюстрады,
    прорезанные крестами, птицами и зверями. Когда-то здесь жили искусные плотники, говорит национальное
    туристическое ведомство, и это заметно. В 2019 году село внесли в национальный список памятников культурного
    наследия Грузии.


    Приезжайте готовыми к правде. Несколько лет назад правительство пообещало почти 6 миллионов лари на
    реставрацию домов и на то, чтобы превратить Гоголати в одну из самых популярных достопримечательностей
    Грузии; когда в июле 2024 года сюда приехали журналисты Радио Свобода, работы так и не начались. Доски
    выветрились до серебристо-серого цвета под жестяными крышами, вода проникает в дерево, а несколько
    дверей заперты на навесные замки — за ними медленно гниют комнаты. Большинство хозяев теперь приезжает
    только с весны до поздней осени.


    Некоторые хозяева охотно показывают гостям свои дома. Вокруг села Шареула прорезала карстовые каньоны.
    Квахиди, он же Квихити, — природный каменный мост: огромный валун, застрявший между скалами над ущельем;
    его имя так и переводится — «каменный мост». Отхтита — маленькая комнатка, высеченная в скале, где,
    по преданию, зажигали факелы, чтобы предупредить долину о набегах. Примерно в 1,5 км к востоку, наверху
    крутого лесистого склона на правом берегу, находится Гоголатская пещера, увешанная сталактитами.


    Приезжайте, пока резьбу ещё можно прочесть.
  tip: >-
    Отведите полтора часа, больше — если хотите дойти до каменного моста и пещеры. Это частные дома: спрашивайте,
    прежде чем войти во двор, не выходите на галереи, где старые доски могут прогнить, и спрашивайте разрешения,
    прежде чем поднять дрон над крышами. Магазина, кафе и туалета нет, поэтому возьмите воду и еду, а
    также немного наличных — вдруг кто-то предложит мёд или вино. Туристическое ведомство считает лучшими
    сезонами для села позднюю осень и раннюю весну. После дождя последний грунтовый участок превращается
    в грязь, зимой по снегу проехать трудно.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север на Sh19
    через Терджолу к Ткибули и по Sh17 через перевал Накерала доезжайте до Амбролаури (около 265 км).
    Там сверните на запад на Sh16 и езжайте вниз по Риони в сторону Алпаны около 25 км; в Зеда-Гвардии
    сверните налево вверх по Шареуле — последние 3,5 км грунтовые и узкие, под высокими скальными стенами.
    Всего около 285 км, примерно четыре с половиной часа. Из Кутаиси — около 68 км через Цхалтубо и Алпану
    по Sh16. В сухую погоду справится машина эконом-класса; после дождя езжайте медленно.
fa:
  name: روستای تاریخی گوگولاتی
  short: >-
    خانه‌های چوبیِ «اودا» با عمری تا ۲۵۰ سال بر فراز شارئولا، با ایوان‌هایی که صلیب و پرنده و جانور در
    آن‌ها بریده‌اند، و هنوز در انتظار نجات.
  body: >-
    **خانه‌های گوگولاتی بر پایه‌هایی از چوب و سنگ ایستاده‌اند، بالاتر از زمین نمناک، و برخی از آن‌ها دو
    سده است که همین‌گونه برپایند.**


    این روستای کوچک بر کرانهٔ شارئولا، از شاخه‌های کرانهٔ چپ ریونی، در ارتفاع حدود ۶۰۰ متری و در شهرستان
    آمبرولائوری قرار دارد. ۵۴ خانهٔ تاریخی در آن مانده است که برخی نزدیک به ۲۵۰ سال عمر دارند، و همه از
    گونهٔ «اودا»یند، خانهٔ چوبی غرب گرجستان: طبقهٔ مسکونی بر ستون‌ها بالا رفته، ایوانی باز در سراسر جلوی
    خانه، و نرده‌هایی که صلیب و پرنده و جانور در آن‌ها بریده‌اند. به گفتهٔ سازمان ملی گردشگری، روزگاری
    درودگران چیره‌دستی در اینجا می‌زیستند، و این پیداست. در سال ۲۰۱۹ روستا در فهرست ملی آثار میراث فرهنگی
    گرجستان ثبت شد.


    آماده باشید که حقیقت را ببینید. چند سال پیش دولت وعدهٔ نزدیک به ۶ میلیون لاری برای مرمت خانه‌ها و
    تبدیل گوگولاتی به یکی از پربازدیدترین جاذبه‌های گرجستان داد؛ اما وقتی خبرنگاران رادیو اروپای آزاد/رادیو
    آزادی در ژوئیهٔ ۲۰۲۴ به اینجا آمدند، کار هنوز آغاز نشده بود. تخته‌ها زیر بام‌های حلبی رنگ خاکستری‌نقره‌ای
    گرفته‌اند، آب به درون چوب نفوذ می‌کند و چند در با قفل آویز بر اتاق‌هایی بسته شده که آرام‌آرام می‌پوسند.
    بیشتر صاحبان خانه‌ها اکنون فقط از بهار تا اواخر پاییز به روستا می‌آیند.


    برخی از صاحبان خانه‌ها با خوشحالی خانه‌شان را به شما نشان می‌دهند. پیرامون روستا، شارئولا دره‌هایی
    کارستی تراشیده است. کواخیدی، که کویخیتی هم خوانده می‌شود، پلی سنگی و طبیعی است: تخته‌سنگی عظیم که
    میان صخره‌ها بالای تنگه گیر افتاده است؛ نامش هم به سادگی یعنی «پل سنگی». اوتختیتا اتاقکی کوچک است
    که در دل صخره کنده‌اند و به روایت‌ها، در آن مشعل می‌افروختند تا دره را از هجوم غارتگران آگاه کنند.
    حدود ۱٫۵ کیلومتر به سمت شرق، بر فراز دامنه‌ای پرشیب و جنگلی در کرانهٔ راست، غار گوگولاتی با قندیل‌های
    آهکی‌اش قرار دارد.


    تا کنده‌کاری‌ها هنوز خواندنی‌اند، بیایید.
  tip: >-
    یک ساعت و نیم وقت بگذارید، و برای پل سنگی و غار بیشتر. این‌ها خانه‌های شخصی‌اند: پیش از ورود به حیاط
    اجازه بگیرید، روی ایوان‌ها نروید، چون تخته‌های کهنه ممکن است پوسیده باشند، و پیش از پرواز پهپاد بر
    فراز بام‌ها اجازه بخواهید. فروشگاه، کافه یا سرویس بهداشتی نیست، پس آب و خوراک همراه بیاورید و کمی
    پول نقد، برای وقتی که کسی عسل یا شراب پیشنهاد کند. سازمان گردشگری اواخر پاییز و اوایل بهار را بهترین
    فصل‌های دیدار از روستا می‌داند. پس از باران، تکهٔ خاکیِ پایانی راه گل‌آلود می‌شود و در زمستان برف
    رفتن را دشوار می‌کند.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سمت غرب بروید، میان زستافونی و کوتائیسی به جادهٔ Sh19
    به سمت شمال بپیچید و از راه ترجولا به تکیبولی بروید، سپس با جادهٔ Sh17 از گردنهٔ ناکرالا تا آمبرولائوری
    برانید (حدود ۲۶۵ کیلومتر). آنجا به سمت غرب، به جادهٔ Sh16، بپیچید و حدود ۲۵ کیلومتر در مسیر ریونی
    به سوی آلپانا پایین بروید؛ در زدا غواردیا به چپ بپیچید و در امتداد شارئولا بالا بروید: ۳٫۵ کیلومتر
    پایانی خاکی و باریک است و از زیر دیواره‌های بلند صخره‌ای می‌گذرد. کل مسیر حدود ۲۸۵ کیلومتر است، نزدیک
    به چهار ساعت و نیم. از کوتائیسی حدود ۶۸ کیلومتر راه است، از راه تسخالتوبو و آلپانا بر جادهٔ Sh16.
    در هوای خشک یک خودروی اقتصادی از پس راه برمی‌آید؛ پس از باران آهسته برانید.
he:
  name: הכפר ההיסטורי גוגולאטי
  short: >-
    בתי "אודה" מעץ, בני עד 250 שנה, מעל השראולה, ובמרפסותיהם גילופים של צלבים, ציפורים ובעלי חיים — ועדיין
    מחכים להצלה.
  body: >-
    **בתי גוגולאטי עומדים על כרעיים של עץ ואבן, מורמים מעל האדמה הלחה, וכמה מהם עומדים כך כבר מאתיים שנה.**


    הכפר הקטן שוכן על גדות השראולה, יובל של הריוני מגדתו השמאלית, בגובה של כ-600 מטר, בתחום עיריית אמברולאורי.
    נשמרו בו 54 בתים היסטוריים, חלקם בני כמעט 250 שנה, וכולם בתי "אודה" — טיפוס בית העץ של מערב גאורגיה:
    קומת מגורים מוגבהת על עמודים, גלריה פתוחה לאורך החזית, ומעקות שבהם נחתכו צלבים, ציפורים ובעלי חיים.
    פעם חיו כאן נגרים מיומנים, אומרת רשות התיירות הלאומית, וזה ניכר. ב-2019 נכלל הכפר ברשימה הלאומית של
    אתרי המורשת התרבותית של גאורגיה.


    בואו מוכנים לאמת. לפני כמה שנים הבטיחה הממשלה כמעט 6 מיליון לארי לשיקום הבתים ולהפיכת גוגולאטי לאחד
    האתרים הפופולריים ביותר בגאורגיה; כשכתבי רדיו אירופה החופשית/רדיו חירות ביקרו כאן ביולי 2024, העבודות
    עוד לא החלו. הקרשים הפכו לאפורים-כסופים תחת גגות הפח, מים חודרים לעץ, וכמה דלתות נעולות במנעולי תלייה
    על חדרים שנרקבים לאט. רוב הבעלים עולים לכאן היום רק מהאביב ועד סוף הסתיו.


    יש בעלי בתים שישמחו להראות לכם את המקום. סביב הכפר חצבה השראולה קניוני קרסט. קוואחידי, הנקרא גם קוויחיטי,
    הוא גשר אבן טבעי: סלע עצום שנתקע בין צוקים מעל הערוץ; שמו פשוט פירושו "גשר אבן". אוטחטיטה היא חדרון
    קטן החצוב בצוק, שבו, לפי המסורת, הדליקו לפידים כדי להזהיר את העמק מפני פושטים. כ-1.5 ק"מ מזרחה, בראש
    מדרון מיוער ותלול על הגדה הימנית, נמצאת מערת גוגולאטי, שנטיפים משתלשלים מתקרתה.


    בואו כל עוד אפשר עדיין לקרוא את הגילופים.
  tip: >-
    הקדישו שעה וחצי, ויותר אם תרצו להגיע לגשר האבן ולמערה. אלה בתים פרטיים: בקשו רשות לפני שאתם נכנסים
    לחצר, אל תעלו על הגלריות, שבהן קרשים ישנים עלולים להיות רקובים, ובקשו רשות לפני שאתם מטיסים רחפן מעל
    הגגות. אין חנות, בית קפה או שירותים, אז הביאו מים ואוכל, וגם מעט מזומן למקרה שמישהו יציע דבש או יין.
    רשות התיירות מציינת את סוף הסתיו ואת תחילת האביב כעונות הטובות ביותר לביקור בכפר. אחרי גשם הקטע האחרון,
    הלא סלול, הופך לבוץ; בחורף השלג מקשה מאוד על הנסיעה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 ‏(E60) כ-190 ק"מ, בין זסטאפוני לקוטאיסי פנו צפונה לכביש Sh19 דרך טרג'ולה
    עד טקיבולי, וחצו את מעבר נקרלה בכביש Sh17 עד אמברולאורי (כ-265 ק"מ). שם פנו מערבה לכביש Sh16, במורד
    הריוני לכיוון אלפנה, כ-25 ק"מ; בזדה ע'וורדיה פנו שמאלה במעלה השראולה ל-3.5 הק"מ האחרונים, לא סלולים
    וצרים, מתחת לקירות סלע גבוהים. בסך הכול כ-285 ק"מ, כארבע וחצי שעות. מקוטאיסי הדרך היא כ-68 ק"מ דרך
    צחלטובו ואלפנה בכביש Sh16. ביום יבש רכב מקטגוריית אקונומי יסתדר; אחרי גשם סעו לאט.
ar:
  name: قرية غوغولاتي التاريخية
  short: >-
    بيوت «أودا» خشبية يصل عمرها إلى 250 عاماً فوق نهر شاريولا، شُرفاتها مخرّمة بالصلبان والطيور والحيوانات،
    وما زالت تنتظر من ينقذها.
  body: >-
    **تقف بيوت غوغولاتي على قوائم من الخشب والحجر، مرفوعةً فوق الأرض الرطبة، وبعضها واقف على هذه الحال
    منذ قرنين.**


    تقع هذه القرية الصغيرة على نهر شاريولا، أحد روافد ريوني من ضفته اليسرى، على ارتفاع نحو 600 متر في
    بلدية أمبرولاوري. وتحتفظ بـ54 بيتاً تاريخياً، عمر بعضها قرابة 250 عاماً، وكلها من طراز «أودا»، أي
    البيت الخشبي في غرب جورجيا: طابق للسكن مرفوع على أعمدة، ورواق مفتوح على امتداد الواجهة، ودرابزينات
    مخرّمة بالصلبان والطيور والحيوانات. تقول الهيئة الوطنية للسياحة إن نجّارين مهرة عاشوا هنا يوماً، وهذا
    واضح للعيان. وفي عام 2019 أُدرجت القرية في القائمة الوطنية لمعالم التراث الثقافي في جورجيا.


    تعالَ مستعداً للحقيقة. فقبل بضع سنوات وعدت الحكومة بنحو 6 ملايين لاري لترميم البيوت وتحويل غوغولاتي
    إلى أحد أكثر المعالم شعبية في جورجيا؛ وحين زار مراسلو إذاعة أوروبا الحرة/إذاعة الحرية القرية في يوليو
    2024، لم تكن الأعمال قد بدأت. لقد استحالت الألواح رمادية فضية تحت سقوف الصفيح، والماء يتسرّب إلى الخشب،
    وبضعة أبواب موصدة بأقفال معلّقة على غرف تتعفّن ببطء. ومعظم المالكين لا يأتون الآن إلا من الربيع حتى
    أواخر الخريف.


    بعض المالكين يسرّهم أن يُطلعوك على بيوتهم. وحول القرية شقّ نهر شاريولا أخاديد كارستية. كفاخيدي، ويُسمّى
    أيضاً كفيخيتي، جسر حجري طبيعي: صخرة هائلة انحشرت بين الصخور فوق المضيق، واسمه يعني ببساطة «الجسر الحجري».
    أما أوتختيتا فحجرة صغيرة منحوتة في الجرف، يُروى أن المشاعل كانت تُوقد فيها لتحذير الوادي من الغزاة.
    وعلى بُعد نحو 1.5 كم شرقاً، في أعلى منحدر حرجي شديد الانحدار على الضفة اليمنى، تقع مغارة غوغولاتي
    التي تتدلّى منها الهوابط.


    تعالَ ما دامت النقوش لا تزال مقروءة.
  tip: >-
    خصّص ساعة ونصفاً، وأكثر إن أردت زيارة الجسر الحجري والمغارة. هذه بيوت خاصة: استأذن قبل دخول أي فناء،
    وابتعد عن الأروقة حيث قد تكون الألواح القديمة متعفّنة، واستأذن قبل إطلاق طائرة مسيّرة فوق السطوح.
    لا متجر ولا مقهى ولا دورة مياه، فأحضر الماء والطعام، وبعض النقود تحسّباً لأن يعرض عليك أحدهم عسلاً
    أو نبيذاً. وترى هيئة السياحة أن أواخر الخريف ومطلع الربيع أفضل موسمين لزيارة القرية. بعد المطر يتحوّل
    المقطع الأخير غير المعبّد إلى وحل، وفي الشتاء يجعل الثلج الطريق شاقاً.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى الطريق
    Sh19 عبر تيرجولا حتى تكيبولي، واعبر ممر ناكيرالا على الطريق Sh17 إلى أمبرولاوري (نحو 265 كم). وهناك
    اتجه غرباً على الطريق Sh16، نزولاً مع ريوني نحو ألبانا، مسافة 25 كم تقريباً؛ وفي زيدا غفارديا انعطف
    يساراً صعوداً مع شاريولا لآخر 3.5 كم، وهي غير معبّدة وضيقة تحت جدران صخرية عالية. المجموع نحو 285
    كم، قرابة أربع ساعات ونصف. ومن كوتايسي المسافة نحو 68 كم عبر تسخالتوبو وألبانا على الطريق Sh16. في
    الطقس الجاف تكفي سيارة اقتصادية؛ وبعد المطر قُد ببطء.
