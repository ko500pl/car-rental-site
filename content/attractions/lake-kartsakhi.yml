ka:
  name: ქარწახის ტბა
  short: >-
    თურქეთთან გაყოფილი ტბა 1 799 მეტრზე: მარილით შეთეთრებული ნაპირი, ქოჩორა ვარხვები, წეროები და ფრინველებზე
    დასაკვირვებელი კოშკი.
  body: >-
    **ქარწახის ტბას უხილავი ხაზი ორად ჰყოფს: ახლო წყალი საქართველოა, შორეული ნაპირი — თურქეთი, ფრინველებისთვის
    კი არც ერთს აქვს მნიშვნელობა.**


    ჯავახეთის ზეგანზე, ზღვის დონიდან 1 799 მეტრზე მდებარე ქარწახი ფართობით, ფარავნის შემდეგ, საქართველოს
    ტბებს შორის მეორეა, ოღონდ მისი ნაწილი თურქეთის მიწაზეა. დაახლოებით 26 კვადრატული კილომეტრი თხელი,
    მლაშე წყალი ვულკანურ ქვაბულში დგას და გასავალი არსად აქვს. ქართულ მხარეს ტბას ხოზაფინსაც ეძახიან,
    თურქულ მხარეს კი მას აქთაში ჰქვია, რაც „თეთრ ქვას“ ნიშნავს. ნაპირზე მიზეზი მაშინვე ჩანს: წყლისპირა
    ლოდებს მარილის ფერმკრთალი ნადები ადევს, თითქოს აგვისტოშიც თრთვილი მოსდებოდეთ.


    აქ არც მონასტერია, არც ციხე, არც მატიანეში ჩაწერილი ამბავი, რომელსაც წყაროები დაადასტურებდნენ — ამ
    ტბის ისტორია ბუმბულით იწერება. ჯავახეთის მთიანეთში 140-ზე მეტი სახეობის ფრინველია აღრიცხული, ქარწახი
    კი მათ შორის ყველაზე შთამბეჭდავებს იზიდავს: ქარისგან აღელვებულ წყალზე ქოჩორა ვარხვები ირწევიან, წყლისპირს
    რუხი წეროები, რუხი ყანჩები და თეთრი ყარყატები დასეირნობენ. დასაკვირვებლად სპეციალური კოშკი დგას, 2011
    წლიდან კი ტბის სანაპირო ქარწახის აღკვეთილია და ჯავახეთის დაცულ ტერიტორიებს ეკუთვნის.


    აქ მოთმინებით უნდა მოხვიდეთ და არა ჩამონათვალით ხელში. ზეგანი უტყეოა, ქარი იშვიათად წყნარდება, დილისა
    და საღამოს დაბალი მზე კი თეთრ ქვებს წამიერად ათბობს, სანამ ისინი კვლავ ნაცრისფრად ჩაქრებიან. დეკემბრიდან
    მარტის შუა რიცხვებამდე ქვაბული ყინულით იკვრება და დუმს.


    მაისიდან ოქტომბრამდე თევზაობა მხოლოდ ანკესით შეიძლება — ძირითადად რიპუსსა და კობრზე.
  tip: >-
    გზაში გასვლამდე ნინოწმინდაში ჯავახეთის დაცული ტერიტორიების ვიზიტორთა ცენტრს დაუკავშირდით. ტბის შორეული
    ნაპირი თურქეთია, ქართული მხარე სასაზღვრო ზონაშია და ცნობები იმაზე, სჭირდება თუ არა სტუმარს ნებართვა,
    ერთმანეთს არ ემთხვევა. პასპორტი თან იქონიეთ, ღობეებსა და სასაზღვრო საგუშაგოებს არ მიუახლოვდეთ, დრონს
    ნუ აუშვებთ და სასაზღვრო ნაგებობებს ნუ გადაიღებთ. შესვლა უფასოა. ბინოკლი აუცილებელია, ჭოგრიტი კიდევ
    უკეთესი: ფრინველები მანძილს იცავენ. ივლისშიც კი ქარგაუმტარი ქურთუკი, საჭმელი და წყალი წაიღეთ — ნაპირზე
    კაფე არ გელით. ფრინველებისთვის საუკეთესოა ადრიანი დილა და საღამო, მაისიდან ოქტომბრამდე.
  route: >-
    თბილისიდან შ36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ შ31-ით ზეგნის გადაღმა წალკამდე იარეთ; იქიდან
    სამხრეთით, ფარავნის ტბის გასწვრივ, ნინოწმინდამდე და შემდეგ ახალქალაქამდე — დაახლოებით 185 კილომეტრი
    განახლებულ ასფალტზე. ახალქალაქიდან ტბის ნაპირამდე, სოფლების გავლით, სამხრეთ-დასავლეთით კიდევ 20-იოდე
    კილომეტრია, ბოლო მონაკვეთი კი ხრეშიანია: სულ დაახლოებით 210 კილომეტრი და 3 საათი და 55 წუთი. საწვავი
    წალკაში ან ახალქალაქში ჩაასხით — შემდეგ საიმედო ბენზინგასამართს ვეღარ ნახავთ. აიღეთ მაღალი გამავლობის
    (SUV კლასის) მანქანა: წვიმის შემდეგ სოფლის გზები ღრმად იჭრება, ნოემბრიდან კი ზეგნის ქარი გზებზე თოვლს
    ახვეტს.
en:
  name: Lake Kartsakhi
  short: >-
    A salt-rimmed lake at 1,799 m, shared with Turkey, where Dalmatian pelicans and cranes work the shallows
    below a birdwatching tower.
  body: >-
    **An invisible line cuts Lake Kartsakhi in two: the near water is Georgian, the far shore is Turkey,
    and the birds pay no attention to either.**


    At 1,799 metres on the Javakheti plateau, Kartsakhi is second only to Paravani among Georgia's lakes
    by area, although part of it lies across the border. It is some 26 square kilometres of shallow, salty
    water in a volcanic basin with no outflow. On the Georgian side it is also called Khozapini; on the
    Turkish side it is Aktaş, “white stone”, and the shore explains why. The boulders at the water's edge
    carry a pale crust of salt, as if frost had settled on them in August.


    There is no monastery here, no fortress, no chronicle story the sources can confirm: this lake's history
    is written in feathers. More than 140 bird species have been recorded in the Javakheti highlands,
    and Kartsakhi draws some of the most striking of them. Dalmatian pelicans ride the wind-chopped water;
    common cranes, grey herons and white storks pace the margins. A purpose-built tower gives birdwatchers
    a raised vantage, and since 2011 the shore has been protected as the Kartsakhi Managed Reserve, part
    of the Javakheti Protected Areas.


    Come with patience rather than a checklist. The plateau is treeless, the wind rarely drops, and the
    low sun at either end of the day warms the white stones for a moment before they fade back to grey.
    From December to mid-March the whole basin freezes and falls silent.


    Between May and October fishing is allowed with hook and line only, mostly for vendace and carp.
  tip: >-
    Before you set out, contact the Javakheti Protected Areas visitor centre in Ninotsminda. The far shore
    is Turkey, the Georgian side lies in the border zone, and reports differ on whether visitors need
    clearance. Carry your passport, keep well clear of fences and border posts, do not fly a drone and
    do not photograph border installations. Entry is free. Binoculars are essential and a spotting scope
    is better, as the birds keep their distance. Bring a windproof layer even in July, plus food and water:
    there is no café on the shore. Early morning and evening, May to October, are best for birds.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi, then the Sh31 across the plateau to Tsalka,
    and continue south along Lake Paravani to Ninotsminda and on to Akhalkalaki: about 185 km on rebuilt
    asphalt. From Akhalkalaki it is roughly another 20 km south-west through the villages to the lakeshore,
    and the last stretch is gravel, making some 210 km and 3 hours 55 minutes in all. Fill up in Tsalka
    or Akhalkalaki, as there is nothing reliable beyond. Take an SUV: the village tracks rut badly after
    rain, and from November the plateau wind drifts snow across them.
ru:
  name: Озеро Карцахи
  short: >-
    Озеро в соляной кайме на высоте 1799 м, общее с Турцией: кудрявые пеликаны и журавли на мелководье
    под вышкой для птиц.
  body: >-
    **Невидимая линия рассекает озеро Карцахи надвое: ближняя вода — грузинская, дальний берег — Турция,
    а птицы не обращают внимания ни на ту, ни на другую.**


    Карцахи лежит на высоте 1799 метров на Джавахетском нагорье и по площади уступает среди озёр Грузии
    только Паравани, хотя часть его находится за границей. Это около 26 квадратных километров мелкой солёной
    воды в вулканической котловине без стока. На грузинской стороне его называют ещё Хозапини; на турецкой
    — Акташ, «белый камень», и берег объясняет почему. Валуны у кромки воды покрыты бледной соляной коркой,
    будто в августе на них лёг иней.


    Здесь нет ни монастыря, ни крепости, ни летописного сюжета, который подтверждали бы источники: история
    этого озера написана перьями. На Джавахетском нагорье отмечено более 140 видов птиц, и Карцахи притягивает
    одних из самых эффектных. Кудрявые пеликаны покачиваются на взбитой ветром воде; серые журавли, серые
    цапли и белые аисты вышагивают вдоль кромки воды. Специально построенная вышка даёт наблюдателям обзор
    сверху, а с 2011 года берег охраняется как заказник Карцахи — часть Джавахетских охраняемых территорий.


    Приезжайте с терпением, а не со списком видов. Нагорье безлесно, ветер почти не стихает, а низкое
    солнце в начале и в конце дня на мгновение согревает белые камни, прежде чем те снова посереют. С
    декабря до середины марта вся котловина замерзает и затихает.


    С мая по октябрь разрешена рыбалка только на удочку с крючком — ловят в основном ряпушку и карпа.
  tip: >-
    Перед поездкой свяжитесь с визит-центром Джавахетских охраняемых территорий в Ниноцминде. Дальний
    берег — Турция, грузинская сторона находится в пограничной зоне, и сведения о том, нужен ли посетителям
    пропуск, расходятся. Возьмите паспорт, держитесь подальше от заграждений и пограничных постов, не
    запускайте дрон и не фотографируйте пограничные объекты. Вход свободный. Бинокль обязателен, а подзорная
    труба ещё лучше: птицы держатся на расстоянии. Даже в июле возьмите ветрозащитную куртку, а также
    еду и воду — кафе на берегу нет. Лучшее время для птиц — раннее утро и вечер, с мая по октябрь.
  route: >-
    Из Тбилиси — по Sh36 через Коджори и Манглиси, затем по Sh31 через нагорье до Цалки и дальше на юг
    вдоль озера Паравани до Ниноцминды и Ахалкалаки: около 185 км по обновлённому асфальту. От Ахалкалаки
    ещё примерно 20 км на юго-запад через сёла до берега, последний отрезок — гравий; всего выходит около
    210 км и 3 часа 55 минут. Заправьтесь в Цалке или Ахалкалаки: дальше надёжных заправок нет. Берите
    кроссовер или внедорожник (SUV): после дождя сельские дороги разбиты глубокой колеёй, а с ноября ветер
    на нагорье наметает на них снег.
fa:
  name: دریاچهٔ کارتساخی
  short: >-
    دریاچه‌ای با حاشیهٔ نمکی در ۱٬۷۹۹ متری، مشترک با ترکیه: پلیکان‌های خاکستری و درناها در آب کم‌عمق،
    زیر برج پرنده‌نگری.
  body: >-
    **خطی نامرئی دریاچهٔ کارتساخی را دو نیم می‌کند: آبِ این سو از آنِ گرجستان است و کرانهٔ دوردست از آنِ
    ترکیه، و پرندگان به هیچ‌کدام اعتنایی ندارند.**


    کارتساخی در ارتفاع ۱٬۷۹۹ متری بر فلات جاواختی، از نظر مساحت در میان دریاچه‌های گرجستان تنها پس از
    پاراوانی جای می‌گیرد، هرچند بخشی از آن آن سوی مرز است. حدود ۲۶ کیلومتر مربع آب کم‌عمق و شور است، در
    حوضه‌ای آتشفشانی که آبراهه‌ای به بیرون ندارد. در سوی گرجستان آن را خوزاپینی هم می‌نامند؛ در سوی ترکیه
    «آق‌تاش» است، یعنی «سنگ سفید»، و کرانه خود دلیلش را نشان می‌دهد. تخته‌سنگ‌های لب آب پوسته‌ای کم‌رنگ
    از نمک بر خود دارند، گویی در اوت برفکی بر آن‌ها نشسته باشد.


    اینجا نه صومعه‌ای هست، نه دژی، نه ماجرایی از وقایع‌نامه‌ها که منابع تأییدش کنند: تاریخ این دریاچه
    با پَر نوشته شده است. در ارتفاعات جاواختی بیش از ۱۴۰ گونه پرنده ثبت شده، و کارتساخی برخی از چشمگیرترین
    آن‌ها را به سوی خود می‌کشد. پلیکان‌های خاکستری بر آب موج‌برداشته از باد شناورند؛ درناهای خاکستری،
    حواصیل‌های خاکستری و لک‌لک‌های سفید در حاشیه‌ها گام برمی‌دارند. برجی که برای همین ساخته شده، به پرنده‌نگرها
    چشم‌اندازی از بالا می‌دهد، و از سال ۲۰۱۱ کرانهٔ دریاچه با نام ذخیره‌گاه مدیریت‌شدهٔ کارتساخی، بخشی
    از مناطق حفاظت‌شدهٔ جاواختی، حفاظت می‌شود.


    با شکیبایی بیایید، نه با فهرستی برای تیک زدن. فلات بی‌درخت است، باد به‌ندرت آرام می‌گیرد، و خورشید
    کم‌ارتفاعِ آغاز و پایان روز، سنگ‌های سفید را لحظه‌ای گرم می‌کند و سپس آن‌ها دوباره به خاکستری می‌گرایند.
    از دسامبر تا میانهٔ مارس سراسر حوضه یخ می‌بندد و خاموش می‌شود.


    از مه تا اکتبر ماهیگیری تنها با قلاب و نخ مجاز است، بیشتر برای ماهی وِنداس (از خانوادهٔ آزادماهیان)
    و کپور.
  tip: >-
    پیش از حرکت با مرکز بازدیدکنندگان مناطق حفاظت‌شدهٔ جاواختی در نینوتسمیندا تماس بگیرید. کرانهٔ دوردست
    ترکیه است، سوی گرجستان در منطقهٔ مرزی قرار دارد، و گزارش‌ها دربارهٔ اینکه بازدیدکنندگان به مجوز نیاز
    دارند یا نه، با هم یکی نیست. گذرنامه همراه داشته باشید، از حصارها و پاسگاه‌های مرزی به‌خوبی فاصله
    بگیرید، پهپاد پرواز ندهید و از تأسیسات مرزی عکس نگیرید. ورود رایگان است. دوربین دوچشمی ضروری است و
    دوربین تک‌چشمی پرنده‌نگری بهتر، چون پرندگان فاصله‌شان را نگه می‌دارند. حتی در ژوئیه لایه‌ای بادگیر
    همراه بیاورید، و نیز خوراک و آب: هیچ کافه‌ای بر کرانه نیست. سپیده‌دم و شامگاه، از مه تا اکتبر، بهترین
    زمان برای پرندگان است.
  route: >-
    از تفلیس با جادهٔ Sh36 از کوجوری و مانگلیسی بگذرید، سپس با Sh31 از روی فلات به تسالکا برانید و در
    امتداد دریاچهٔ پاراوانی به سوی جنوب تا نینوتسمیندا و از آنجا تا آخال‌کالاکی ادامه دهید: حدود ۱۸۵ کیلومتر
    بر آسفالت نوسازی‌شده. از آخال‌کالاکی حدود ۲۰ کیلومتر دیگر به سوی جنوب‌غرب از میان روستاها تا کرانهٔ
    دریاچه راه است، و تکهٔ پایانی شنی است؛ روی‌هم حدود ۲۱۰ کیلومتر و ۳ ساعت و ۵۵ دقیقه. در تسالکا یا آخال‌کالاکی
    باک را پر کنید، چون پس از آن جایگاه سوخت مطمئنی نیست. خودروی شاسی‌بلند (SUV) بردارید: راه‌های روستایی
    پس از باران به‌شدت شیار می‌افتند، و از نوامبر باد فلات برف را بر آن‌ها انباشته می‌کند.
he:
  name: אגם קרצחי
  short: >-
    אגם עטור מלח בגובה 1,799 מ', שגאורגיה חולקת עם טורקיה: שקנאים מסולסלים ועגורים מחפשים מזון במים הרדודים,
    למרגלות מגדל לצפרות.
  body: >-
    **קו בלתי נראה חוצה את אגם קרצחי לשניים: המים הקרובים הם גאורגיים, החוף הרחוק הוא טורקיה, והציפורים
    אינן מתייחסות לא לזה ולא לזה.**


    קרצחי שוכן בגובה 1,799 מטר ברמת ג'אווחטי, ובשטחו הוא שני רק לפרוואני בין אגמי גאורגיה, אף שחלק ממנו
    נמצא מעבר לגבול. מדובר בכ-26 קמ"ר של מים רדודים ומלוחים באגן וולקני שאין לו מוצא. בצד הגאורגי הוא
    נקרא גם חוזפיני; בצד הטורקי שמו אקטאש, "אבן לבנה", והחוף מסביר מדוע. על הסלעים בשפת המים מונח קרום
    חיוור של מלח, כאילו כפור ירד עליהם באוגוסט.


    אין כאן מנזר, אין מבצר, אין סיפור מן הכרוניקות שהמקורות יכולים לאשר: ההיסטוריה של האגם הזה כתובה בנוצות.
    ברמות ג'אווחטי תועדו יותר מ-140 מיני ציפורים, וקרצחי מושך כמה מן המרשימים שבהם. שקנאים מסולסלים שטים
    על המים שהרוח מסעירה; עגורים אפורים, אנפות אפורות וחסידות לבנות צועדים לאורך שולי המים. מגדל שנבנה
    במיוחד מעניק לצפרים נקודת תצפית גבוהה, ומאז 2011 החוף מוגן כשמורה המנוהלת קרצחי, חלק מהשטחים המוגנים
    של ג'אווחטי.


    בואו עם סבלנות, לא עם רשימת סימון. הרמה חשופה מעצים, הרוח כמעט אינה שוככת, והשמש הנמוכה בתחילת היום
    ובסופו מחממת לרגע את האבנים הלבנות לפני שהן שבות ומאפירות. מדצמבר ועד אמצע מרץ קופא האגן כולו ושוקע
    בדממה.


    ממאי עד אוקטובר מותר לדוג בחכה ובקרס בלבד, בעיקר ונדאס (דג ממשפחת הסלמוניים) וקרפיונים.
  tip: >-
    לפני היציאה צרו קשר עם מרכז המבקרים של השטחים המוגנים של ג'אווחטי בנינוצמינדה. החוף הרחוק הוא טורקיה,
    הצד הגאורגי נמצא באזור הגבול, והדיווחים חלוקים בשאלה אם מבקרים זקוקים לאישור. קחו דרכון, התרחקו היטב
    מגדרות ומעמדות גבול, אל תטיסו רחפן ואל תצלמו מתקני גבול. הכניסה חינם. משקפת היא חובה, וטלסקופ צפרות
    עדיף, כי הציפורים שומרות מרחק. הביאו שכבה חסינת רוח גם ביולי, וגם אוכל ומים: אין בית קפה על החוף.
    שעות הבוקר המוקדמות והערב, ממאי עד אוקטובר, הן הטובות ביותר לצפרות.
  route: >-
    מטביליסי נוסעים בכביש Sh36 דרך קוג'ורי ומנגליסי, אחר כך בכביש Sh31 לרוחב הרמה עד צלקה, וממשיכים דרומה
    לאורך אגם פרוואני לנינוצמינדה ומשם לאחלקלאקי: כ-185 ק"מ על אספלט שחודש. מאחלקלאקי עוד כ-20 ק"מ דרום-מערבה
    דרך הכפרים עד שפת האגם, והקטע האחרון הוא חצץ; בסך הכול כ-210 ק"מ ו-3 שעות ו-55 דקות. תדלקו בצלקה או
    באחלקלאקי, כי מעבר להן אין תחנה שאפשר לסמוך עליה. קחו רכב SUV: דרכי הכפרים נחרשות בתלמים אחרי גשם,
    ומנובמבר רוח הרמה מערימה עליהן שלג.
ar:
  name: بحيرة كارتساخي
  short: >-
    بحيرة تحفّها حافة من الملح على ارتفاع 1,799 م، تتقاسمها جورجيا مع تركيا، حيث يطلب البجع الدلماسي والكراكي
    رزقها في المياه الضحلة أسفل برج لمراقبة الطيور.
  body: >-
    **خط غير مرئي يشطر بحيرة كارتساخي نصفين: المياه القريبة جورجية، والشاطئ البعيد تركيا، والطيور لا تلتفت
    إلى هذا ولا ذاك.**


    تقع كارتساخي على ارتفاع 1,799 متراً فوق هضبة جافاخيتي، ولا يتقدّمها مساحةً بين بحيرات جورجيا إلا بارافاني،
    وإن كان جزء منها يقع وراء الحدود. إنها نحو 26 كيلومتراً مربعاً من المياه الضحلة المالحة في حوض بركاني
    لا مخرج له. وتُسمّى على الجانب الجورجي أيضاً خوزابيني؛ أما على الجانب التركي فاسمها «آق طاش»، أي «الحجر
    الأبيض»، والشاطئ يفسّر السبب. فالصخور عند حافة الماء تحمل قشرة شاحبة من الملح، كأن صقيعاً حطّ عليها
    في أغسطس.


    لا دير هنا ولا قلعة، ولا حكاية من الحوليات تستطيع المصادر تأكيدها: تاريخ هذه البحيرة مكتوب بالريش.
    سُجّل في مرتفعات جافاخيتي أكثر من 140 نوعاً من الطيور، وتجتذب كارتساخي بعضاً من أكثرها لفتاً للأنظار.
    يتهادى البجع الدلماسي على الماء الذي تعكّره الريح، وتذرع الكراكي الشائعة ومالك الحزين الرمادي واللقالق
    البيضاء حوافَّ الماء. ويمنح برج شُيّد خصيصاً مراقبي الطيور موقعاً مرتفعاً، ومنذ عام 2011 يخضع الشاطئ
    للحماية بوصفه محمية كارتساخي المُدارة، ضمن المناطق المحمية في جافاخيتي.


    تعال متسلّحاً بالصبر لا بقائمة تشطب منها. الهضبة جرداء بلا أشجار، والريح نادراً ما تهدأ، والشمس المنخفضة
    في أول النهار وآخره تدفئ الحجارة البيضاء لحظةً قبل أن تعود فتخبو إلى الرمادي. ومن ديسمبر حتى منتصف
    مارس يتجمّد الحوض كله ويخيّم عليه الصمت.


    وبين مايو وأكتوبر يُسمح بالصيد بالصنارة والخطاف فقط، وأكثره لسمك الفنداس (من فصيلة السلمونيات) والشبوط.
  tip: >-
    قبل الانطلاق، تواصل مع مركز الزوار التابع للمناطق المحمية في جافاخيتي في نينوتسميندا. فالشاطئ البعيد
    تركيا، والجانب الجورجي يقع في المنطقة الحدودية، والروايات متضاربة حول حاجة الزوار إلى تصريح. احمل
    جواز سفرك، وابتعد كثيراً عن الأسوار والمخافر الحدودية، ولا تُطلق طائرة مسيّرة، ولا تصوّر المنشآت الحدودية.
    الدخول مجاني. المنظار الثنائي ضروري، والمقراب الأحادي أفضل، فالطيور تحافظ على مسافتها. احمل طبقة واقية
    من الريح حتى في يوليو، ومعها الطعام والماء: لا مقهى على الشاطئ. أفضل الأوقات لمشاهدة الطيور الصباح
    الباكر والمساء، من مايو إلى أكتوبر.
  route: >-
    من تبليسي خذ الطريق Sh36 عبر كوجوري ومانغليسي، ثم الطريق Sh31 عبر الهضبة إلى تسالكا، وتابع جنوباً
    على امتداد بحيرة بارافاني إلى نينوتسميندا ثم إلى أخالكالاكي: نحو 185 كم على إسفلت مُجدَّد. ومن أخالكالاكي
    نحو 20 كم أخرى باتجاه الجنوب الغربي عبر القرى حتى شاطئ البحيرة، والجزء الأخير حصوي؛ فيصير المجموع
    نحو 210 كم و3 ساعات و55 دقيقة. املأ خزان الوقود في تسالكا أو أخالكالاكي، إذ لا محطة يُعوَّل عليها
    بعدهما. خذ سيارة رياضية متعددة الاستخدامات (SUV): فطرق القرى تتخدّد بشدة بعد المطر، ومن نوفمبر تكدّس
    ريح الهضبة الثلج فوقها.
