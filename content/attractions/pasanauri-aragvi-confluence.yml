ka:
  name: ფასანაური და არაგვების შესართავი
  short: სოფელი სამხედრო გზაზე, სადაც შავი და თეთრი არაგვი ერთდება და ორი წყალი ერთხანს შეურევლად მიდის.
  body: >-
    **ფასანაურში არაგვი ერთ მდინარედ იქცევა.** შავი არაგვი ჩრდილო-აღმოსავლეთიდან, გუდამაყრის ხეობიდან
    ჩამოდის, ფიქლისა და ჩრდილისგან მუქი; თეთრი არაგვი დასავლეთიდან მოაქვს, ღია ნაცრისფერი, გუდაურის ფერდობებიდან
    ჩამორეცხილი კირქვის შლამით. ისინი სოფლის ჩრდილოეთ კიდეზე ხვდებიან ერთმანეთს და შესართავიდან ორას-სამასი
    მეტრის მანძილზე ორი ნაკადი გვერდიგვერდ, შეურევლად მიდის — კალაპოტის შუაში სუფთა, თვალსაჩინო ნაკერით.


    ეს გვიან გაზაფხულსა და ზაფხულის დასაწყისში ჩანს საუკეთესოდ, როცა ორივე მდინარე სავსეა და ფერთა სხვაობა
    ყველაზე ძლიერია. აგვისტოს ბოლოსთვის ხარჯი ეცემა, შლამი ილექება და ეფექტი იმდენად სუსტდება, რომ ჯერ
    უნდა გითხრან და მერე დაინახავ. დადექი საავტომობილო ხიდზე ან ჩადი ქვემოთ, კენჭნარ ნაპირზე.


    თავად სოფელი სახლების გრძელი ზოლია 1050 მეტრზე, საქართველოს სამხედრო გზაზე, ანანურსა და გუდაურის ასასვლელს
    შორის ნახევარ გზაზე. ის საბჭოთა კლიმატურ კურორტად გაიზარდა — ჰაერი თხელი, გრილი და მშრალია და აქ სანატორიუმები
    აგზავნიდნენ პაციენტებს — და დღემდე უფრო გაჩერების, ვიდრე დანიშნულების ადგილია.


    ფასანაურის მეორე პრეტენზია ხინკალია. ადგილობრივები გეტყვიან, რომ ხინკალი სწორედ ამ მთებში გამოიგონეს,
    სადაც ხორცს კეპავდნენ და არა ატარებდნენ და საკუთარ წვენში ხარშავდნენ; მტკიცება საკამათოა, მაგრამ აქაური
    გზისპირა რესტორნები ხინკალს სერიოზულად ეკიდებიან და დონე მაღალია. მდინარეზე მდებარე კალმახის მეურნეობები
    მენიუს მეორე ნახევარს ავსებს.


    სოფლის ზემოთ გზა ვიწროვდება და ასვლას იწყებს. ფასანაური გუდაურამდე ბოლო ადგილია, სადაც მაღაზიებისა
    და კაფეების ნორმალური არჩევანია, ზამთარში კი აქ ჩერდებიან მძღოლები ჯაჭვების დასაყენებლად ან უღელტეხილის
    გახსნის მოსაცდელად.
  tip: >-
    ნახევარი საათიდან ერთ საათამდე: შესართავს უყურებ, ჭამ და მიდიხარ. ორი წყლის საუკეთესო ხედი სოფლის
    ჩრდილოეთ ბოლოს ხიდიდანაა, გზაზე კი მანქანის დასატოვებელი ჯიბეა. აქაური რესტორნები დღის ერთსა და სამს
    შორის ტურისტული ავტობუსებით ივსება — ან ადრე მოდი, ან გვიან. ხინკალს ცალობით უკვეთავენ, ხუთი მსუბუქი
    სადილია და ხელით ჭამენ; კუდი თეფშზე რჩება. ტუალეტები რესტორნებთანაა. ზამთარში ჩრდილოეთით გაგრძელებამდე
    უღელტეხილის მდგომარეობა გადაამოწმე.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) ჩრდილოეთით მიდიხარ მცხეთაზე, ჟინვალსა და ანანურზე გავლით,
    არაგვის აყოლებით — 92 კმ და დაახლოებით საათი და ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია და ნორმალურ
    მდგომარეობაშია, თუმცა ჟინვალსა და ფასანაურს შორის ვიწროა, კლდეში ჩაჭრილი და რუსეთის საზღვრისკენ მიმავალი
    ტვირთმზიდებით სავსე — გამოსწრება მოთმინებას მოითხოვს. საწვავი ჟინვალსა და თავად ფასანაურშია. ეკონომ-კლასის
    მანქანა საკმარისია; ზამთარში ჯაჭვები თან იქონიე, რადგან სოფლის ზემოთ მონაკვეთი პირველი იყინება.
en:
  name: Pasanauri and the Aragvi Confluence
  short: A village on the Military Highway where the Black and White Aragvi meet and run side by side
    without mixing.
  body: >-
    **Pasanauri is where the Aragvi becomes one river.** The Black Aragvi comes down from the Gudamaqari
    valley to the north-east, dark with shale and shadow; the White Aragvi arrives from the west, pale
    grey with limestone silt washed off the Gudauri slopes. They meet at the northern edge of the village,
    and for two or three hundred metres below the junction the two currents run side by side without mixing
    — a clean, visible seam down the middle of the riverbed.


    This is best in late spring and early summer, when both rivers are high and the colour difference
    is at its strongest. By late August the flows drop, the silt settles, and the effect fades to something
    you have to be told about before you can see it. Stand on the road bridge, or walk down to the shingle
    bank below it.


    The village itself is a long strip of houses at 1,050 metres on the Georgian Military Highway, halfway
    between Ananuri and the climb to Gudauri. It grew as a Soviet climatic resort — the air is thin, cool
    and dry, and sanatoria sent patients here — and it remains a stopping place rather than a destination.


    Pasanauri's second claim is khinkali. Locals will tell you the dumpling was invented in these mountains,
    where the meat was chopped rather than minced and cooked in its own juice. Whether or not the claim
    survives scrutiny, the roadside restaurants here take khinkali seriously and the standard is high.
    Trout farms along the river supply the other half of the menu.


    Above the village the highway narrows and begins to climb. Pasanauri is the last place with a proper
    choice of shops and cafés before Gudauri, and in winter it is where drivers stop to fit chains or
    to wait out a closure at the pass.
  tip: >-
    Half an hour to an hour: look at the confluence, eat, move on. The best view of the two waters is
    from the bridge at the north end of the village, and there is a lay-by on the highway to leave the
    car. Restaurants fill between one and three in the afternoon with tour buses, so arrive before or
    after. Khinkali are ordered by the piece, five make a light lunch, and they are eaten by hand with
    the top knot left on the plate. Toilets belong to the restaurants. In winter, check pass conditions
    before continuing north.
  route: >-
    Follow the Georgian Military Highway (E117) north from Tbilisi through Mtskheta, past Zhinvali and
    Ananuri and on up the Aragvi — 92 km and about an hour and forty-five minutes. The road is asphalt
    throughout and in reasonable condition, but between Zhinvali and Pasanauri it is narrow, cut into
    the hillside and full of lorries bound for the Russian border, so overtaking takes patience. Fuel
    is available in Zhinvali and in Pasanauri itself. An economy car is enough; in winter carry chains,
    because the section above the village is the first to ice over.
ru:
  name: Пасанаури и слияние Арагви
  short: >-
    Село на Военно-Грузинской дороге, где сходятся Чёрная и Белая Арагви и какое-то время текут рядом,
    не смешиваясь.
  body: >-
    **В Пасанаури Арагви становится одной рекой.** Чёрная Арагви спускается с северо-востока, из Гудамакарского
    ущелья, тёмная от сланца и тени; Белая приходит с запада, светло-серая от известнякового ила, смытого
    со склонов Гудаури. Они сходятся у северного края села, и метров двести-триста ниже слияния два потока
    идут рядом, не смешиваясь: посреди русла тянется чёткий, хорошо видимый шов.


    Лучше всего это в конце весны и начале лета, когда обе реки полноводны и разница в цвете самая сильная.
    К концу августа расход падает, ил оседает, и эффект ослабевает настолько, что сначала о нём надо услышать,
    а уже потом увидеть. Смотреть удобно с автомобильного моста или спустившись на галечную косу под ним.


    Само село — длинная полоса домов на высоте 1050 метров вдоль Военно-Грузинской дороги, ровно между
    Ананури и подъёмом на Гудаури. Оно выросло как советский климатический курорт: воздух здесь разрежённый,
    прохладный и сухой, сюда направляли пациентов санаториев. И сегодня это скорее место остановки, чем
    цель поездки.


    Вторая претензия Пасанаури — хинкали. Местные скажут, что их придумали именно в этих горах, где мясо
    рубили, а не пропускали через мясорубку, и варили в собственном соку. Спорить об этом можно долго,
    но придорожные рестораны здесь относятся к хинкали серьёзно, и уровень высокий. Форелевые хозяйства
    на реке обеспечивают вторую половину меню.


    Выше села дорога сужается и начинает подъём. Пасанаури — последнее место с нормальным выбором магазинов
    и кафе перед Гудаури, а зимой здесь останавливаются, чтобы надеть цепи или переждать закрытие перевала.
  tip: >-
    От получаса до часа: посмотреть на слияние, поесть и ехать дальше. Лучший вид на две воды — с моста
    в северной части села, у трассы есть карман, где оставить машину. Рестораны заполняются туристическими
    автобусами с часу до трёх — приезжайте раньше или позже. Хинкали заказывают поштучно, пять штук —
    лёгкий обед, едят руками, хвостик оставляют на тарелке. Туалеты — при ресторанах. Зимой перед продолжением
    пути на север уточните обстановку на перевале.
  route: >-
    По Военно-Грузинской дороге (E117) на север от Тбилиси через Мцхету, мимо Жинвали и Ананури и дальше
    вверх по Арагви — 92 км, около часа сорока пяти минут. Дорога асфальтированная и в приличном состоянии,
    но между Жинвали и Пасанаури узкая, врезана в склон и забита фурами, идущими к российской границе,
    так что обгон требует терпения. Заправки есть в Жинвали и в самом Пасанаури. Достаточно машины эконом-класса;
    зимой возите цепи — участок выше села замерзает первым.
fa:
  name: پاسانائوری و پیوستگاه آراگوی
  short: روستایی بر بزرگراه نظامی، جایی که آراگوی سیاه و سفید به هم می‌رسند و مدتی بی‌آمیختن کنار هم می‌روند.
  body: >-
    **در پاسانائوری آراگوی یک رود می‌شود.** آراگوی سیاه از شمال شرق و از درهٔ گودامقاری پایین می‌آید،
    تیره از سنگ لوح و سایه؛ آراگوی سفید از غرب می‌رسد، خاکستری روشن از گِل آهکی شسته‌شده از دامنه‌های
    گودائوری. این دو در کنارهٔ شمالی روستا به هم می‌رسند و دویست تا سیصد متر پس از پیوستگاه، دو جریان
    پهلوبه‌پهلو و بی‌آنکه بیامیزند پیش می‌روند: درزی روشن و آشکار در میانهٔ بستر رود.


    بهترین زمان دیدنش اواخر بهار و اوایل تابستان است، وقتی هر دو رود پرآب‌اند و تفاوت رنگ در اوج است.
    تا اواخر مرداد دبی می‌افتد، گِل ته‌نشین می‌شود و اثر چنان کم‌رنگ می‌شود که نخست باید کسی به شما بگوید
    تا بتوانید ببینید. روی پل جاده بایستید یا به کرانهٔ سنگریزه‌ای زیر آن پایین بروید.


    خود روستا نواری دراز از خانه‌هاست در ارتفاع 1050 متر بر بزرگراه نظامی گرجستان، درست میانهٔ راه آنانوری
    و سربالایی گودائوری. به عنوان استراحتگاه آب‌وهوایی شوروی رشد کرد، چون هوا رقیق و خنک و خشک است و آسایشگاه‌ها
    بیماران را به اینجا می‌فرستادند؛ و هنوز بیشتر جای توقف است تا مقصد.


    ادعای دوم پاسانائوری خینکالی است. مردم محلی می‌گویند این کوفتهٔ آبپز را در همین کوه‌ها ساخته‌اند،
    جایی که گوشت را ریز می‌کوبیدند نه چرخ می‌کردند و در آب خودش می‌پختند. درستی این ادعا هرچه باشد، رستوران‌های
    کنار جاده در اینجا خینکالی را جدی می‌گیرند و کیفیت بالاست. مزرعه‌های قزل‌آلا در کنار رود نیمهٔ دیگر
    فهرست غذا را تأمین می‌کنند.


    بالاتر از روستا جاده باریک می‌شود و بالا رفتن آغاز می‌شود. پاسانائوری آخرین جایی است که تا گودائوری
    گزینه‌های واقعی مغازه و کافه دارد، و در زمستان همین‌جاست که رانندگان می‌ایستند تا زنجیر ببندند یا
    بسته بودن گردنه را به سر آورند.
  tip: >-
    نیم ساعت تا یک ساعت: پیوستگاه را ببینید، غذایی بخورید و راه بیفتید. بهترین منظرهٔ دو آب از پل شمال
    روستاست و کنار جاده جای مناسبی برای گذاشتن خودرو هست. رستوران‌ها میان ساعت یک تا سه بعدازظهر با اتوبوس‌های
    تور پر می‌شوند، پس پیش از آن یا پس از آن برسید. خینکالی را دانه‌ای سفارش می‌دهند، پنج تا ناهاری سبک
    است و با دست خورده می‌شود و گره بالایی در بشقاب می‌ماند. سرویس‌های بهداشتی متعلق به رستوران‌هاست.
    در زمستان پیش از ادامهٔ راه به شمال وضعیت گردنه را بپرسید.
  route: >-
    از تفلیس روی بزرگراه نظامی گرجستان (E117) به شمال، از متسختا و از کنار ژینوالی و آنانوری و سپس بالا
    در امتداد آراگوی — 92 کیلومتر و نزدیک یک ساعت و چهل‌وپنج دقیقه. جاده تا انتها آسفالت و در وضعیت قابل
    قبولی است، اما میان ژینوالی و پاسانائوری باریک است و در دل دامنه بریده شده و پر از کامیون‌های راهی
    مرز روسیه، پس سبقت صبر می‌خواهد. سوخت در ژینوالی و در خود پاسانائوری هست. خودروی اقتصادی کافی است؛
    در زمستان زنجیر همراه داشته باشید، چون بخش بالای روستا زودتر از همه یخ می‌بندد.
he:
  name: פסנאורי ומפגש האראגווי
  short: כפר על כביש הצבא שבו נפגשים האראגווי השחור והלבן וזורמים זה לצד זה בלי להתערבב.
  body: >-
    **בפסנאורי הופך האראגווי לנהר אחד.** האראגווי השחור יורד מצפון-מזרח, מעמק גודמאקארי, כהה מפצלי שיש
    ומצל; האראגווי הלבן מגיע ממערב, אפור בהיר מסחף גיר שנשטף ממדרונות גודאורי. הם נפגשים בקצה הצפוני של
    הכפר, ולאורך מאתיים או שלוש מאות מטר מתחת למפגש זורמים שני הזרמים זה לצד זה בלי להתערבב — תפר נקי
    וברור באמצע אפיק הנהר.


    המראה במיטבו בסוף האביב ובתחילת הקיץ, כששני הנהרות מלאים והפרש הצבע חזק ביותר. עד סוף אוגוסט הספיקה
    יורדת, הסחף שוקע, והאפקט נחלש עד כדי כך שצריך שיספרו לכם עליו כדי לראות אותו. אפשר לעמוד על גשר הכביש
    או לרדת אל שפת החלוקים שמתחתיו.


    הכפר עצמו הוא רצועת בתים ארוכה בגובה 1,050 מטר על כביש הצבא הגאורגי, בדיוק בין אנאנורי לבין העלייה
    לגודאורי. הוא צמח כאתר אקלים סובייטי — האוויר דליל, קריר ויבש, ובתי הבראה שלחו לכאן מטופלים — והוא
    נותר תחנת ביניים יותר מאשר יעד.


    הטענה השנייה של פסנאורי היא החינקאלי. המקומיים יספרו שהכיסון הומצא בהרים האלה, שבהם קצצו את הבשר במקום
    לטחון אותו ובישלו אותו במיץ שלו. אם הטענה עומדת במבחן או לא, המסעדות שלצד הכביש כאן מתייחסות לחינקאלי
    ברצינות והרמה גבוהה. חוות פורלים לאורך הנהר מספקות את המחצית השנייה של התפריט.


    מעל הכפר הכביש מצטמצם ומתחיל לטפס. פסנאורי היא המקום האחרון עם מבחר סביר של חנויות ובתי קפה לפני גודאורי,
    ובחורף כאן עוצרים הנהגים כדי להרכיב שרשראות או להמתין לפתיחת המעבר.
  tip: >-
    חצי שעה עד שעה: להביט במפגש, לאכול ולהמשיך. הנוף הטוב ביותר של שני המים הוא מן הגשר בקצה הצפוני של
    הכפר, ויש מפרץ עצירה בכביש להשאיר בו את הרכב. המסעדות מתמלאות באוטובוסי תיירים בין אחת לשלוש אחר הצהריים,
    אז הגיעו לפני או אחרי. חינקאלי מזמינים ביחידות, חמישה הם ארוחה קלה, אוכלים אותם ביד ומשאירים את הקשר
    העליון בצלחת. השירותים שייכים למסעדות. בחורף בררו את מצב המעבר לפני שממשיכים צפונה.
  route: >-
    סעו צפונה מטביליסי בכביש הצבא הגאורגי (E117) דרך מצחתה, על פני ז׳ינוואלי ואנאנורי ומעלה לאורך האראגווי
    — 92 ק״מ וכשעה וארבעים וחמש דקות. הכביש סלול לכל אורכו ובמצב סביר, אך בין ז׳ינוואלי לפסנאורי הוא צר,
    חצוב במדרון ומלא במשאיות בדרכן לגבול הרוסי, ולכן עקיפה דורשת סבלנות. דלק יש בז׳ינוואלי ובפסנאורי עצמה.
    רכב חסכוני מספיק; בחורף שאו שרשראות, כי הקטע מעל הכפר קופא ראשון.
ar:
  name: باسانائوري وملتقى نهري أراغفي
  short: قرية على الطريق العسكري يلتقي عندها أراغفي الأسود والأبيض ويجريان جنباً إلى جنب دون أن يمتزجا.
  body: >-
    **عند باسانائوري يصير أراغفي نهراً واحداً.** ينحدر أراغفي الأسود من الشمال الشرقي من وادي غوداماكاري،
    داكناً بالصخر الصفائحي والظل؛ ويصل أراغفي الأبيض من الغرب، رمادياً فاتحاً بغرين كلسي جرفته منحدرات
    غودااوري. يلتقيان عند الطرف الشمالي للقرية، وعلى مدى مئتين أو ثلاثمئة متر تحت الملتقى يجري التياران
    متجاورين بلا امتزاج: خط فاصل نظيف واضح في وسط مجرى النهر.


    أفضل أوقات المشهد أواخر الربيع وأوائل الصيف، حين يمتلئ النهران ويبلغ فرق اللون ذروته. ومع أواخر آب
    ينخفض التصريف ويرسب الغرين ويخفت الأثر حتى تحتاج إلى من يخبرك به لتراه. قف على جسر الطريق أو انزل
    إلى ضفة الحصى تحته.


    أما القرية فشريط طويل من البيوت على ارتفاع 1050 متراً على الطريق العسكري الجورجي، في منتصف المسافة
    بين أنانوري وصعود غودااوري. نمت بوصفها مصحة مناخية سوفييتية، لأن الهواء رقيق وبارد وجاف وكانت المصحات
    ترسل مرضاها إليها؛ وما تزال محطة توقف أكثر منها مقصداً.


    ودعوى باسانائوري الثانية هي الخينكالي. سيقول لك الأهالي إن هذه الفطيرة المحشوة اخترعت في هذه الجبال،
    حيث كان اللحم يُفرم بالسكين لا بالمفرمة ويُطهى في مائه. وأياً كان مصير هذه الدعوى، فمطاعم الطريق هنا
    تأخذ الخينكالي على محمل الجد والمستوى عالٍ. ومزارع سمك السلمون المرقط على النهر تسد النصف الآخر من
    القائمة.


    وفوق القرية يضيق الطريق ويبدأ الصعود. باسانائوري آخر مكان فيه خيارات معقولة من المتاجر والمقاهي قبل
    غودااوري، وفي الشتاء هنا يقف السائقون لتركيب السلاسل أو لانتظار فتح الممر.
  tip: >-
    من نصف ساعة إلى ساعة: تنظر إلى الملتقى، وتأكل، وتمضي. وأفضل مشهد للمائين من الجسر في الطرف الشمالي
    للقرية، وعلى الطريق جيب لترك السيارة. تمتلئ المطاعم بحافلات الرحلات بين الواحدة والثالثة بعد الظهر،
    فاحضر قبل ذلك أو بعده. ويُطلب الخينكالي بالحبة، وخمس حبات غداء خفيف، ويؤكل باليد وتُترك العقدة العليا
    في الطبق. ودورات المياه تابعة للمطاعم. وفي الشتاء تأكد من حال الممر قبل المتابعة شمالاً.
  route: >-
    اتبع الطريق العسكري الجورجي (E117) شمالاً من تبليسي عبر متسخيتا، بمحاذاة جينفالي وأنانوري ثم صعوداً
    مع أراغفي — 92 كم ونحو ساعة وخمس وأربعين دقيقة. الطريق معبّد على امتداده وبحالة معقولة، لكنه بين جينفالي
    وباسانائوري ضيق ومحفور في السفح ومزدحم بالشاحنات المتجهة إلى الحدود الروسية، فالتجاوز يحتاج صبراً.
    الوقود متوفر في جينفالي وفي باسانائوري نفسها. وسيارة اقتصادية تكفي؛ وفي الشتاء احمل السلاسل، فالقسم
    فوق القرية أول ما يتجمد.
