ka:
  name: ფასანაური და არაგვების შესართავი
  short: >-
    მთიულეთის ძველი გული, სადაც თეთრი და შავი არაგვი ორ ფერად ხვდება ერთმანეთს, ხინკალი კი ადგილობრივი
    ღირსების საქმეა.
  body: >-
    **ფასანაურთან ორი თანამოსახელე მდინარე ბოლოს და ბოლოს ერთმანეთს ხვდება და ადრეული ზაფხულის მზიან დღეს
    შეიძლება დაინახოთ, როგორ ყოყმანობენ, სანამ ერთ წყლად იქცევიან.**


    თეთრი არაგვი — გეოგრაფების ენაზე მთიულეთის არაგვი — ჩრდილოეთიდან, მლეთისა და ქვეშეთის გავლით ჩამოდის
    და ყელის ვულკანურ ზეგანზე, 3180 მეტრზე მდებარე სათავიდან 41 კილომეტრს გადის. შავი, ანუ გუდამაყრის
    არაგვი, უფრო მოკლეა: ჭაუხის დასავლეთ კალთიდან 30 კილომეტრს მოედინება და მარცხნიდან ერთვის. თეთრს მეტი
    წყალი მოაქვს — საშუალოდ 12 კუბური მეტრი წამში, შავს კი 8-მდე — და თოვლის დნობის შემდეგ, როცა ორივე
    ადიდებულია, ღია და მუქი ნაკადი შესართავის ქვემოთ ერთხანს გვერდიგვერდ მიედინება, სანამ მდინარე სხვაობას
    ჩაყლაპავს. ზაფხულის ბოლოს ეფექტი ქრება და შეიძლება დაგჭირდეთ, რომ ვინმემ მიგითითოთ, სად შეხედოთ.


    თავად ფასანაური მთიულეთის ძველი გულია — გრძელი დაბა 1050 მეტრზე, საქართველოს სამხედრო გზაზე. გადმოცემა
    მის სახელს სიტყვა „ფასს“ უკავშირებს და გზისპირა ძველ სავაჭრო ადგილს იხსენებს. საბჭოთა წლებში ფასანაური
    კურორტი იყო, ტურბაზითა და ორი სასტუმროთი — „ინტურისტითა“ და „არაგვით“; პოსტსაბჭოთა კრიზისმა მას მძიმედ
    გადაუარა, და 2014 წლის აღწერით აქ 1148 ადამიანი ცხოვრობდა.


    მადა კი გადარჩა. ფასანაური მთელ საქართველოში მთიულური სამზარეულოთი და თავისი ხინკლით არის ცნობილი,
    ადგილობრივი მზარეულები კი — რწმენით და არა საბუთით — დაგიმტკიცებენ, რომ ხინკალი სწორედ ამ მთებში დაიბადა.


    შესართავის ქვემოთ ის უკვე უბრალოდ არაგვია. ორივე ფერი სამხრეთით, ჟინვალის წყალსაცავისკენ მიაქვს —
    და ბოლოს თბილისის ონკანებამდე.
  tip: >-
    ნახევარი საათიდან საათამდე: შეხედეთ, ჭამეთ და გზა განაგრძეთ. ორი წყლის სანახავად შესართავთან ახლოს,
    ხიდებსა და ხრეშიან ნაპირზე ჩადით, მანქანა კი გზისპირა ჯიბეში დატოვეთ და არა სავალ ნაწილზე. რესტორნები
    დაახლოებით პირველიდან სამ საათამდე ტურისტული ჯგუფებით ივსება — ან ადრე მოდით, ან გვიან. ხინკალს ცალობით
    უკვეთავენ, ხუთი მსუბუქი სადილია: კუდით აიღეთ, წაკბიჩეთ, წვენი შესვით და კუდი თეფშზე დატოვეთ. საპირფარეშო
    რესტორნებშია. ზამთარში თოვლი აქ დაახლოებით 73 დღე დევს — ჯაჭვები თან იქონიეთ და ჩრდილოეთით წასვლამდე
    გზის მდგომარეობა გადაამოწმეთ.
  route: >-
    თბილისიდან ს1-ით მცხეთისკენ გადით და საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთით, ჟინვალისა და
    ანანურის გავლით, არაგვის ხეობას აუყევით — დაახლოებით 92 კმ და საათი და სამი მეოთხედი. გზა ბოლომდე
    მოასფალტებული და მოვლილია, მაგრამ ჟინვალსა და ფასანაურს შორის ვიწროა, ფერდობში ჩაჭრილი და რუსეთის
    საზღვრისკენ მიმავალი ტვირთმზიდებით დატვირთული — გასწრება მოთმინებას მოითხოვს. საწვავი ჟინვალსა და
    თავად ფასანაურშია. ეკონომ-კლასის მანქანა საკმარისია; ნოემბრიდან აპრილამდე ზამთრის საბურავები და ჯაჭვები
    აუცილებელია, მით უმეტეს, თუ გუდაურისკენ აპირებთ.
en:
  name: Pasanauri and the Aragvi Confluence
  short: >-
    The old heart of Mtiuleti, where the White and Black Aragvi meet in two colours and khinkali are treated
    as a matter of local honour.
  body: >-
    **At Pasanauri two rivers with the same name finally meet, and on a bright day in early summer you
    can watch them hesitate before they become one.**


    The White Aragvi, which Georgian geographers call the Mtiuleti Aragvi, comes down from the north past
    Mleta and Kvesheti, 41 km from its source at 3,180 metres on the Keli volcanic plateau. The Black
    Aragvi, or Gudamakari Aragvi, is the shorter of the two: 30 km from the western flank of Mount Chaukhi,
    joining from the left. The White carries more water, on average about 12 cubic metres a second to
    the Black's 8, and when both run high after the snowmelt the pale and the dark currents can travel
    side by side below the junction before the river swallows the difference. By late summer the effect
    fades, and you may need someone to point.


    Pasanauri itself is the old heart of Mtiuleti, a long village at 1,050 metres on the Georgian Military
    Highway. Tradition ties its name to pasi, "price", and remembers a trading place on the road. In Soviet
    times it was a resort with a tourist base and two hotels, the Intourist and the Aragvi; the post-Soviet
    years were hard on it, and the 2014 census counted 1,148 inhabitants.


    What survived is appetite. Pasanauri is known across Georgia for Mtiuleti cooking and for its own
    khinkali, and local cooks will tell you, as a matter of faith rather than record, that the dumpling
    was born in these mountains.


    Below the confluence it is simply the Aragvi. It carries both colours south to the reservoir at Zhinvali
    and, in the end, to the taps of Tbilisi.
  tip: >-
    Half an hour to an hour: look, eat, drive on. For the two waters, walk to the bridges and shingle
    banks near the junction, and leave the car in a lay-by rather than on the carriageway. Restaurants
    fill from about one to three with tour groups, so come earlier or later. Khinkali are ordered by the
    piece and five make a light lunch: hold the knot, bite, drink the broth, and leave the knot on the
    plate. Toilets belong to the restaurants. Snow lies here for around 73 days a winter; carry chains
    and check the highway before heading north.
  route: >-
    Leave Tbilisi on the S1 towards Mtskheta and take the Georgian Military Highway (S3/E117) north past
    Zhinvali and Ananuri, then up the Aragvi valley: about 92 km and an hour and three-quarters. The road
    is asphalt throughout and in reasonable shape, but between Zhinvali and Pasanauri it is narrow, cut
    into the hillside and busy with lorries bound for the Russian border, so overtaking takes patience.
    Fuel is available in Zhinvali and in Pasanauri itself. An economy car is enough; from November to
    April fit winter tyres and carry chains, especially if you are going on to Gudauri.
ru:
  name: Пасанаури и слияние Арагви
  short: Старое сердце Мтиулети, где Белая и Чёрная Арагви сходятся двумя цветами, а хинкали — дело местной
    чести.
  body: >-
    **В Пасанаури две реки с одним и тем же именем наконец встречаются, и ясным днём в начале лета видно,
    как они медлят, прежде чем стать одной.**


    Белая Арагви, которую грузинские географы называют Мтиулетской, спускается с севера мимо Млеты и Квешети;
    от истока на высоте 3180 метров на Кельском вулканическом плато до этого места она проходит 41 км.
    Чёрная, или Гудамакарская, Арагви короче: 30 км от западного склона горы Чаухи, и впадает она слева.
    Белая многоводнее — в среднем около 12 кубометров в секунду против 8 у Чёрной, — и когда обе вздуваются
    после таяния снегов, светлая и тёмная струи ещё какое-то время бегут бок о бок ниже слияния, пока
    река не проглотит разницу. К концу лета эффект слабеет, и, возможно, придётся попросить кого-нибудь
    показать, куда смотреть.


    Сам Пасанаури — старое сердце Мтиулети, длинное село на высоте 1050 метров на Военно-Грузинской дороге.
    Предание связывает его имя со словом «паси» — «цена» — и помнит здесь торговое место на дороге. В
    советское время это был курорт с турбазой и двумя гостиницами, «Интурист» и «Арагви»; постсоветские
    годы обошлись с ним сурово, и перепись 2014 года насчитала 1148 жителей.


    Уцелел аппетит. Пасанаури знают по всей Грузии за мтиулетскую кухню и собственные хинкали, и местные
    повара скажут вам — как символ веры, а не как исторический факт, — что эти пельмени родились в здешних
    горах.


    Ниже слияния это просто Арагви. Она несёт оба цвета на юг, к водохранилищу у Жинвали, и в конце концов
    — к кранам Тбилиси.
  tip: >-
    От получаса до часа: посмотреть, поесть, ехать дальше. Чтобы увидеть две воды, дойдите до мостов и
    галечных берегов у слияния, а машину оставьте на площадке у обочины, а не на проезжей части. Рестораны
    примерно с часу до трёх заполняют туристические группы, так что приезжайте раньше или позже. Хинкали
    заказывают поштучно, пять — это лёгкий обед: держите за хвостик, надкусите, выпейте бульон, а хвостик
    оставьте на тарелке. Туалеты — при ресторанах. Снег лежит здесь около 73 дней за зиму; возите цепи
    и проверяйте состояние трассы, прежде чем ехать на север.
  route: >-
    Выезжайте из Тбилиси по S1 в сторону Мцхеты и по Военно-Грузинской дороге (S3/E117) на север мимо
    Жинвали и Ананури, дальше вверх по долине Арагви: около 92 км и час сорок пять. Дорога асфальтирована
    на всём протяжении и в приличном состоянии, но между Жинвали и Пасанаури дорога узкая, врезана в склон
    и загружена фурами к российской границе, так что обгон требует терпения. Заправки есть в Жинвали и
    в самом Пасанаури. Машины эконом-класса достаточно; с ноября по апрель ставьте зимнюю резину и возите
    цепи, особенно если едете дальше, в Гудаури.
fa:
  name: پاسانائوری و پیوستگاه آراگوی
  short: دل کهن متیولتی، جایی که آراگوی سفید و آراگوی سیاه با دو رنگ به هم می‌پیوندند و خینکالی موضوع
    آبروی محلی است.
  body: >-
    **در پاسانائوری دو رود هم‌نام سرانجام به هم می‌رسند، و در روزی روشن در آغاز تابستان می‌توانید ببینید
    که پیش از یکی شدن، لحظه‌ای درنگ می‌کنند.**


    آراگوی سفید، که جغرافی‌دانان گرجی آن را آراگوی متیولتی می‌نامند، از شمال و از کنار ملتا و کوِشِتی
    پایین می‌آید و از سرچشمه‌اش در ارتفاع ۳۱۸۰ متری فلات آتشفشانی کِلی تا اینجا ۴۱ کیلومتر راه پیموده
    است. آراگوی سیاه، یا آراگوی گودامکاری، کوتاه‌تر است: ۳۰ کیلومتر از دامنهٔ غربی کوه چائوخی، و از چپ
    به آن می‌پیوندد. آراگوی سفید پرآب‌تر است، به‌طور میانگین حدود ۱۲ متر مکعب در ثانیه در برابر ۸ متر
    مکعبِ آراگوی سیاه، و وقتی هر دو پس از ذوب برف طغیان می‌کنند، جریان روشن و تیره می‌توانند پایین‌تر
    از پیوستگاه تا مسافتی دوشادوش هم بروند، تا آنکه رود این تفاوت را فرو ببلعد. در اواخر تابستان این جلوه
    کمرنگ می‌شود و شاید لازم باشد کسی آن را نشانتان دهد.


    خود پاسانائوری دل کهن متیولتی است، روستایی کشیده در ارتفاع ۱۰۵۰ متری بر جادهٔ نظامی گرجستان. روایت‌ها
    نامش را به «پاسی» به معنای «بها» پیوند می‌دهند و از بازارگاهی بر سر راه یاد می‌کنند. در دوران شوروی
    اینجا استراحتگاهی بود با یک اردوگاه گردشگری و دو هتل، «اینتوریست» و «آراگوی»؛ سال‌های پس از شوروی
    بر آن سخت گذشت و در سرشماری ۲۰۱۴ جمعیتش ۱۱۴۸ نفر بود.


    آنچه ماند، اشتها بود. پاسانائوری در سراسر گرجستان به آشپزی متیولتی و خینکالیِ خودش شهره است، و آشپزهای
    محلی به شما خواهند گفت، از سر ایمان و نه بر پایهٔ سند، که این خوراک در همین کوه‌ها زاده شده است.


    پایین‌تر از پیوستگاه، رود دیگر فقط آراگوی است. هر دو رنگ را به جنوب، تا مخزن ژینوالی، و سرانجام تا
    شیرهای آب تفلیس می‌برد.
  tip: >-
    نیم تا یک ساعت: تماشا، غذا، و ادامهٔ راه. برای دیدن دو آب، تا پل‌ها و ساحل‌های سنگریزه‌ای نزدیک پیوستگاه
    پیاده بروید و خودرو را در توقفگاه کنار جاده بگذارید، نه روی سوارهرو. رستوران‌ها از حدود یک تا سه بعدازظهر
    از تورهای گروهی پر می‌شوند، پس زودتر یا دیرتر بیایید. خینکالی را دانه‌ای سفارش می‌دهند و پنج‌تا ناهاری
    سبک است: گره‌اش را بگیرید، گاز بزنید، آبگوشتش را بنوشید و گره را در بشقاب بگذارید. سرویس بهداشتی متعلق
    به رستوران‌هاست. برف اینجا در هر زمستان حدود ۷۳ روز می‌ماند؛ زنجیر همراه داشته باشید و پیش از رفتن
    به شمال وضعیت جاده را بررسی کنید.
  route: >-
    از تفلیس با S1 به سوی متسختا بروید و از جادهٔ نظامی گرجستان (S3/E117) به شمال، از کنار ژینوالی و آنانوری،
    و سپس در درهٔ آراگوی بالا بروید: حدود ۹۲ کیلومتر و یک ساعت و سه ربع. تمام راه آسفالت است و در وضعی
    قابل‌قبول، اما میان ژینوالی و پاسانائوری جاده باریک است، در دل دامنه کنده شده و پر از کامیون‌هایی
    که به مرز روسیه می‌روند یا از آن می‌آیند، پس سبقت صبر می‌خواهد. سوخت در ژینوالی و خود پاسانائوری هست.
    خودروی اقتصادی کافی است؛ از نوامبر تا آوریل لاستیک زمستانی نصب کنید و زنجیر همراه داشته باشید، به‌ویژه
    اگر تا گودائوری ادامه می‌دهید.
he:
  name: פסנאורי ומפגש האראגווי
  short: הלב הישן של מתיולתי, שבו האראגווי הלבן והאראגווי השחור נפגשים בשני צבעים, והחינקלי הם עניין של
    כבוד מקומי.
  body: >-
    **בפסנאורי נפגשים סוף סוף שני נהרות הנושאים אותו שם, וביום בהיר בתחילת הקיץ אפשר לראות אותם מהססים
    לפני שהם הופכים לאחד.**


    האראגווי הלבן, שהגאוגרפים הגאורגים קוראים לו אראגווי של מתיולתי, יורד מצפון על פני מלטה וקווישתי,
    אחרי 41 ק״מ ממקורו בגובה 3,180 מטר ברמת קלי הוולקנית. האראגווי השחור, או אראגווי של גודמקרי, הוא הקצר
    מבין השניים: 30 ק״מ מן המדרון המערבי של הר צ׳אוחי, והוא מצטרף משמאל. הלבן נושא יותר מים, בממוצע כ-12
    מטרים מעוקבים בשנייה לעומת 8 של השחור, וכשהשניים גואים אחרי הפשרת השלגים, הזרם הבהיר והזרם הכהה יכולים
    לזרום זה לצד זה במורד המפגש, עד שהנהר בולע את ההבדל. בסוף הקיץ האפקט דוהה, ואולי תצטרכו שמישהו יצביע
    עליו בשבילכם.


    פסנאורי עצמה היא הלב הישן של מתיולתי, כפר ארוך בגובה 1,050 מטר על כביש הצבא הגאורגי. המסורת קושרת
    את שמה למילה ״פאסי״, ״מחיר״, וזוכרת כאן מקום מסחר על הדרך. בימי ברית המועצות היה זה אתר נופש עם בסיס
    תיירות ושני בתי מלון, ״אינטוריסט״ ו״אראגווי״; השנים שאחרי ברית המועצות היו קשות לה, ומפקד האוכלוסין
    של 2014 מנה 1,148 תושבים.


    מה ששרד הוא התיאבון. פסנאורי ידועה בכל גאורגיה במטבח של מתיולתי ובחינקלי שלה, והטבחים המקומיים יגידו
    לכם, כעניין של אמונה ולא של תיעוד, שהכיסון הזה נולד בהרים האלה.


    במורד המפגש זהו פשוט האראגווי. הוא נושא את שני הצבעים דרומה אל המאגר בז׳ינוואלי, ובסופו של דבר אל
    הברזים של טביליסי.
  tip: >-
    חצי שעה עד שעה: להסתכל, לאכול ולהמשיך. כדי לראות את שני הזרמים, לכו אל הגשרים ואל גדות החצץ ליד המפגש,
    והשאירו את הרכב במפרץ חניה ולא על הכביש. המסעדות מתמלאות בקבוצות מאורגנות בערך מאחת עד שלוש, אז בואו
    מוקדם או מאוחר יותר. חינקלי מזמינים לפי יחידה, וחמישה הם ארוחת צהריים קלה: אחזו בקשר, נגסו, שתו את
    הציר והשאירו את הקשר בצלחת. השירותים שייכים למסעדות. השלג נשאר כאן כ-73 ימים בכל חורף; קחו שרשראות
    ובדקו את מצב הכביש לפני שאתם ממשיכים צפונה.
  route: >-
    צאו מטביליסי בכביש S1 לכיוון מצחתה ועלו צפונה בכביש הצבא הגאורגי (S3/E117) על פני ז׳ינוואלי ואנאנורי,
    ואז במעלה עמק האראגווי: כ-92 ק״מ ושעה ושלושה רבעים. הכביש סלול לכל אורכו ובמצב סביר, אבל בין ז׳ינוואלי
    לפסנאורי הוא צר, חצוב בצלע ההר ועמוס משאיות בדרכן אל גבול רוסיה וממנו, כך שעקיפה דורשת סבלנות. דלק
    יש בז׳ינוואלי ובפסנאורי עצמה. רכב חסכוני מספיק; מנובמבר עד אפריל התקינו צמיגי חורף וקחו שרשראות, במיוחד
    אם אתם ממשיכים לגודאורי.
ar:
  name: باسانائوري وملتقى نهري أراغفي
  short: القلب القديم لمتيوليتي، حيث يلتقي أراغفي الأبيض وأراغفي الأسود بلونين مختلفين، والخينكالي فيه
    مسألة شرف محلي.
  body: >-
    **في باسانائوري يلتقي أخيراً نهران يحملان الاسم نفسه، وفي يوم صافٍ من أوائل الصيف تستطيع أن تراهما
    يتردّدان قبل أن يصيرا نهراً واحداً.**


    أراغفي الأبيض، الذي يسمّيه الجغرافيون الجورجيون أراغفي متيوليتي، ينحدر من الشمال مارّاً بمليتا وكفيشيتي،
    بعد 41 كم من منبعه على ارتفاع 3180 متراً في هضبة كيلي البركانية. أما أراغفي الأسود، أو أراغفي غوداماكاري،
    فهو الأقصر بينهما: 30 كم من السفح الغربي لجبل تشاوخي، ويصبّ فيه من اليسار. الأبيض أغزر ماءً، إذ يحمل
    في المتوسط نحو 12 متراً مكعباً في الثانية مقابل 8 للأسود، وحين يفيض الاثنان بعد ذوبان الثلوج قد يسير
    التياران الفاتح والداكن جنباً إلى جنب أسفل الملتقى، إلى أن يبتلع النهر الفرق. ومع أواخر الصيف يخفت
    هذا المشهد، وقد تحتاج إلى من يدلّك عليه بإصبعه.


    وباسانائوري نفسها هي القلب القديم لمتيوليتي، قرية طويلة على ارتفاع 1050 متراً على الطريق العسكري الجورجي.
    ويربط التقليد اسمها بكلمة «باسي» أي «الثمن»، ويذكر سوقاً للتجارة على الطريق. وفي العهد السوفييتي كانت
    منتجعاً فيه قاعدة سياحية وفندقان، «إنتوريست» و«أراغفي»؛ ثم قست عليها سنوات ما بعد السوفييت، وأحصى
    تعداد 2014 فيها 1148 نسمة.


    أما ما بقي فهو الشهيّة. فباسانائوري معروفة في جورجيا كلها بمطبخ متيوليتي وبالخينكالي الخاص بها، وسيقول
    لك الطهاة المحليون، إيماناً لا توثيقاً، إن هذه الفطائر المسلوقة وُلدت في هذه الجبال.


    وأسفل الملتقى لا يبقى سوى أراغفي. يحمل اللونين معاً جنوباً إلى بحيرة السد عند جينفالي، ثم في النهاية
    إلى صنابير تبليسي.
  tip: >-
    من نصف ساعة إلى ساعة: انظر، وكُل، وتابع الطريق. لرؤية الماءين، امشِ إلى الجسور والضفاف الحصوية قرب
    الملتقى، واترك السيارة في موقف جانبي لا على قارعة الطريق. تمتلئ المطاعم بالمجموعات السياحية من الواحدة
    إلى الثالثة تقريباً، فتعالَ قبل ذلك أو بعده. يُطلب الخينكالي بالقطعة، وخمس قطع غداء خفيف: أمسك العقدة،
    واقضم، واشرب المرق، واترك العقدة في الصحن. دورات المياه تابعة للمطاعم. يبقى الثلج هنا نحو 73 يوماً
    في الشتاء؛ فاحمل السلاسل وتحقّق من حال الطريق قبل التوجه شمالاً.
  route: >-
    اخرج من تبليسي على الطريق S1 باتجاه متسخيتا، ثم الطريق العسكري الجورجي (S3/E117) شمالاً مروراً بجينفالي
    وأنانوري، ثم صعوداً في وادي أراغفي: نحو 92 كم وساعة وثلاثة أرباع الساعة. الطريق معبّد بالكامل وحالته
    مقبولة، لكنه بين جينفالي وباسانائوري ضيق، محفور في سفح الجبل، ومزدحم بالشاحنات القادمة من الحدود الروسية
    والذاهبة إليها، فالتجاوز يحتاج إلى صبر. الوقود متوفر في جينفالي وفي باسانائوري نفسها. تكفي سيارة اقتصادية؛
    ومن نوفمبر إلى أبريل ركّب إطارات شتوية واحمل السلاسل، ولا سيما إن كنت متجهاً إلى غوداوري.
