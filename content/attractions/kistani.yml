ka:
  name: კისტანი
  short: >-
    შუა საუკუნეების ციხე-სოფელი პირიქითა ხევსურეთში, 30-მდე ციხე-სახლით; 1813 წელს აქვე ხევსურები რუსულ
    რაზმს ჩაუსაფრდნენ, 2014 წლისთვის კი ერთი მცხოვრებიღა დარჩა.
  body: >-
    **კისტანში სახლები კლდეზე ისე მჭიდროდ ააშენეს, რომ ერთი ოჯახის ბანი მეზობლის ეზო-ტერასა იყო, სოფლის
    გარე კედლები კი — მისი გალავანი.**


    კისტანი პირიქითა ხევსურეთშია, კავკასიონის წყალგამყოფი ქედის ჩრდილოეთ კალთაზე, მდინარე არღუნის მარცხენა
    მხარეს, ზღვის დონიდან 2000 მეტრზე მაღლა. შუა საუკუნეების მშენებლებს სწორი ადგილი არ ჰქონდათ, ამიტომ
    სახლებს საფეხურებად აშენებდნენ. სოფელი ორ კომპაქტურ უბნად იყოფა. მთავარ უბანში 30-მდე ციხე-სახლი იდგა,
    ერთდროულად საცხოვრისი და სიმაგრე: ბრტყელსახურავიანი საცხოვრებელი კოშკები პირამიდულსახურავიანი საბრძოლო
    კოშკების გვერდით, ფიქლის მშრალი წყობით ნაგები, კირით — იშვიათად. დააკვირდით წვრილმანებს: პატარა სარკმლებს,
    სათოფურებს, კერის საკვამლეებს, ბოლო სართულებზე კი ხის აივნებისა და საბრძოლო ჩარდახების კვალს. სოფლიდან
    მოშორებით, მაღალ ქარაფზე, ორი მხოლოდ თავდაცვითი დანიშნულების ნაგებობა დგას. სოფელში რამდენიმე სამრევლო
    იყო — ქალთა საწესო ადგილი; სალოცავები და წისქვილები კი სოფლის გარეთ იყო გატანილი.


    კისტანს საკუთარი ისტორიაც აქვს. როცა ალექსანდრე ბატონიშვილი რუსეთის მმართველობის წინააღმდეგ აჯანყებას
    მეთაურობდა, გენერალ სიმონოვიჩის ჯარმა ხევსურეთის სოფლები დაარბია, მათ შორის — კისტანიც. 1813 წელს,
    როცა ბატონიშვილის მდევარი რუსული რაზმი კისტანზე გავლით უკან ბრუნდებოდა, ხევსურები წყალწყაულად წოდებულ
    ადგილას ჩაუსაფრდნენ და სასტიკად დაამარცხეს.


    რაც თარეშმა ვერ მოახერხა, ბარმა ნელ-ნელა შეძლო. XIX–XX საუკუნეების მიჯნაზე ხალხმა ბარად ჩასვლას უმატა;
    1926 წელს სოფელში 24 სული ცხოვრობდა, 2014 წლის აღწერამ კი ერთადერთი მცხოვრები დაითვალა. ფრთხილად იარეთ:
    თითქმის დაცლილი სოფელიც ვიღაცის სახლია.
  tip: >-
    შესვლა უფასოა; არც მცველია, არც საპირფარეშო, არც მაღაზია. ნანგრევები ტერასებად ეშვება, ბილიკი ციცაბო
    და ქვიანია — გამძლე ფეხსაცმელი ჩაიცვით და ფიქლის მშრალ წყობაზე ნუ აძვრებით: ქვა ადვილად იძვრის. სოფლის
    გარეთ მდგარ სალოცავებს პატივი ეცით: ხევსურეთში ზოგი საწესო ადგილი დღესაც დაცულია და მათთან ახლოს მისვლა
    ყველგან არ არის მიღებული. 2000 მეტრზე ზაფხულშიც ცივა, წვიმა მოულოდნელად მოდის. საზღვრისპირა მხარეა
    — პასპორტი თან იქონიეთ. ერთი საათი საკმარისია; ლებაისკართან ერთად ნახეთ და შატილისკენ განაგრძეთ.
  route: >-
    139 კმ; გაითვალისწინეთ დაახლოებით ოთხი საათი და მეოთხედი. თბილისიდან ს1 მაგისტრალით მცხეთამდე იარეთ,
    შემდეგ ჩრდილოეთით, ს3-ით; ჟინვალთან შ26 გზაზე — ბარისახოსა და შატილისკენ — გადაუხვიეთ. ასფალტი ბარისახოს
    მიდამოებში მთავრდება; იქიდან ხრეშიანი მთის გზა დათვისჯვრის უღელტეხილზე (2676 მ) ადის და პირიქითა ხევსურეთში
    ეშვება. ლებაისკარს კიდევ დაახლოებით 2 კილომეტრით გასცდით: კისტანი შატილის გზის პირას, ფერდობზე დგას,
    ნანგრევებამდე კი ფეხით ადიხართ. საჭიროა მაღალი გამავლობის ოფროუდ-მანქანა: წვიმა გზას ტალახად და ქვად
    აქცევს. ავზი ჟინვალში შეავსეთ — ხეობაში ზემოთ საწვავის იმედი ნუ გექნებათ. გზა რეალურად მხოლოდ დაახლოებით
    ივნისიდან სექტემბრამდეა გასავლელი.
en:
  name: Kistani
  short: >-
    A medieval village-fortress of up to thirty tower-houses in Pirikita Khevsureti; Khevsurs ambushed
    Russian troops nearby in 1813. One resident remained in 2014.
  body: >-
    **At Kistani the houses were built so tightly up the rock that one family's roof was the next family's
    terrace, and the village's outer walls doubled as its rampart.**


    Kistani lies in Pirikita Khevsureti, on the northern slope of the Caucasus watershed, on the left
    bank of the Arghuni, more than 2,000 metres above the sea. Its medieval builders had no level ground
    to spare, so they built in steps. The village falls into two compact quarters. The main one held up
    to thirty tower-houses that were home and stronghold at once: flat-roofed dwelling towers beside pyramid-roofed
    fighting towers, laid in dry-stone slate and only rarely in lime mortar. Look for the details: small
    windows and gun-loops, smoke-holes for the hearths and, on the top floors, traces of wooden balconies
    and fighting galleries. A little apart, on a high crag, stand two purely defensive buildings. The
    village itself had several samrevlo, women's ritual places, while its shrines and mills stood outside
    it.


    Kistani has a history of its own. When Prince Alexander (Aleksandre Batonishvili) led a rising against
    Russian rule, troops under General Simonovich raided the Khevsur villages, Kistani among them. In
    1813, as a Russian force that had been pursuing the prince marched back through Kistani, the Khevsurs
    lay in ambush at a place called Tskaltskauli and dealt it a heavy defeat.


    What raids could not do, the lowlands did slowly. From the turn of the 20th century people moved down
    to the plains; by 1926 only 24 lived here, and the 2014 census counted a single resident. Tread softly:
    even an almost empty village is still somebody's home.
  tip: >-
    Free, with no warden, toilet or shop. The ruins step steeply down the slope and the paths are loose
    and stony, so wear sturdy shoes and do not climb on the dry-stone slate walls, which shift easily.
    Respect the shrines outside the village: some Khevsur sacred places are still kept, and approaching
    them is not always welcome. At over 2,000 metres it is cold even in summer and rain arrives without
    warning. This is a border district, so carry your passport. An hour is enough; see it together with
    Lebaiskari and carry on to Shatili.
  route: >-
    139 km; allow about four and a quarter hours. From Tbilisi take the S1 to Mtskheta and the S3 north;
    at Zhinvali turn off onto the Sh26 for Barisakho and Shatili. The asphalt gives out around Barisakho;
    from there a gravel mountain road climbs over the Datvisjvari Pass (2,676 m) and drops into Pirikita
    Khevsureti. Continue about 2 km past Lebaiskari: Kistani sits on the slope beside the Shatili road,
    and you climb to the ruins on foot. Take an off-road vehicle with real ground clearance; rain turns
    the road to mud and stones. Fill the tank at Zhinvali — do not count on fuel further up the valley.
    In practice the road is passable only from about June to September.
ru:
  name: Кистани
  short: >-
    Средневековое село-крепость в Пирикитской Хевсуретии, до 30 домов-башен; рядом в 1813 году хевсуры
    разбили русский отряд, а к 2014-му остался один житель.
  body: >-
    **В Кистани дома лепились к скале так тесно, что крыша одной семьи была террасой для соседней, а внешние
    стены села служили ему крепостной стеной.**


    Кистани лежит в Пирикитской Хевсуретии, на северном склоне Главного Кавказского хребта, на левом берегу
    Аргуна, выше 2000 метров над морем. Ровной земли у средневековых строителей не было, и они строили
    уступами. Село делится на два компактных квартала. В главном стояло до тридцати домов-башен, бывших
    одновременно жильём и укреплением: жилые башни с плоской кровлей соседствовали с боевыми башнями под
    пирамидальной кровлей, сложенными из сланца насухо и лишь изредка на известковом растворе. Присмотритесь
    к деталям: маленькие окна и бойницы, дымоходные отверстия очагов, а на верхних этажах — следы деревянных
    балконов и боевых галерей. Чуть в стороне, на высоком утёсе, стоят две чисто оборонительные постройки.
    В самом селе было несколько самревло — женских обрядовых мест, а святилища и мельницы вынесены за
    его пределы.


    У Кистани есть и собственная история. Когда царевич Александр (Александре Батонишвили) поднял восстание
    против российского владычества, войска генерала Симоновича разоряли хевсурские сёла, в том числе и
    Кистани. В 1813 году, когда русский отряд, преследовавший царевича, возвращался назад через Кистани,
    хевсуры устроили засаду в месте под названием Цкалцкаули и нанесли ему тяжёлое поражение.


    Чего не смогли набеги, то медленно сделала равнина. С рубежа XX века люди всё чаще переселялись вниз,
    в равнинные сёла; в 1926 году здесь жили всего 24 человека, а перепись 2014 года насчитала одного-единственного
    жителя. Ступайте тихо: даже почти опустевшее село всё ещё чей-то дом.
  tip: >-
    Вход свободный; ни смотрителя, ни туалета, ни магазина нет. Руины круто спускаются по склону, тропы
    сыпучие и каменистые, так что наденьте крепкую обувь и не лазайте по сухой сланцевой кладке — она
    легко осыпается. Уважайте святилища за пределами села: некоторые хевсурские святые места по-прежнему
    почитаются, и подходить к ним не всегда уместно. На высоте больше 2000 метров холодно даже летом,
    а дождь налетает без предупреждения. Это пограничный район, поэтому держите паспорт при себе. Часа
    достаточно; осмотрите Кистани вместе с Лебаискари и поезжайте дальше, в Шатили.
  route: >-
    139 км, закладывайте около четырёх с четвертью часов. Из Тбилиси по S1 до Мцхеты и по S3 на север;
    у Жинвали сверните на Sh26 на Барисахо и Шатили. Асфальт заканчивается в районе Барисахо; дальше гравийная
    горная дорога поднимается на перевал Датвисджвари (2676 м) и спускается в Пирикитскую Хевсуретию.
    Проезжайте ещё около 2 км после Лебаискари: Кистани стоит на склоне у шатилийской дороги, к руинам
    поднимаетесь пешком. Нужен внедорожник с настоящим клиренсом: в дождь дорога превращается в грязь
    и камни. Заправьтесь в Жинвали — дальше по долине на топливо не рассчитывайте. На практике дорога
    проходима примерно с июня по сентябрь.
fa:
  name: کیستانی
  short: >-
    روستا-دژی از سده‌های میانه در خوسورتیِ پیریکیتا با تا سی برج‌خانه؛ خوسورها در ۱۸۱۳ نزدیک اینجا به
    نیرویی روسی کمین زدند و تا ۲۰۱۴ تنها یک ساکن ماند.
  body: >-
    **در کیستانی خانه‌ها را چنان تنگ و پیوسته روی صخره ساخته بودند که بام یک خانواده، مهتابیِ خانوادهٔ
    بعدی بود و دیوارهای بیرونی روستا، باروی آن.**


    کیستانی در خوسورتیِ پیریکیتا قرار دارد، بر دامنهٔ شمالی خط آب‌پخشان قفقاز، در کرانهٔ چپ رود آرغونی،
    بیش از ۲۰۰۰ متر بالاتر از سطح دریا. سازندگان سده‌های میانه زمین همواری در اختیار نداشتند، پس پلکانی
    ساختند. روستا به دو محلهٔ فشرده تقسیم می‌شود. در محلهٔ اصلی تا سی برج‌خانه برپا بود که هم خانه بودند
    و هم دژ: برج‌های مسکونیِ بام‌تخت در کنار برج‌های جنگیِ بام‌هرمی، ساخته‌شده از لاشه‌سنگ لوح بی‌ملات
    و تنها گاهی با ملات آهک. به جزئیات دقت کنید: پنجره‌های کوچک و مزغل‌ها، روزنه‌های دود اجاق‌ها، و در
    طبقه‌های بالا ردّ ایوان‌های چوبی و راهروهای جنگی. کمی دورتر، بر صخره‌ای بلند، دو بنای صرفاً دفاعی
    ایستاده‌اند. در خود روستا چند «سامرولو»، یعنی مکان‌های آیینی زنان، بود، اما زیارتگاه‌ها و آسیاب‌ها
    بیرون از روستا جای داشتند.


    کیستانی تاریخ خاص خود را هم دارد. هنگامی که شاهزاده الکساندر (آلکساندره باتونیشویلی) شورشی را بر ضد
    حکومت روسیه رهبری کرد، نیروهای ژنرال سیمونوویچ روستاهای خوسور، از جمله کیستانی، را غارت کردند. در
    سال ۱۸۱۳، هنگامی که یک نیروی روسی که در تعقیب شاهزاده بود از راه کیستانی بازمی‌گشت، خوسورها در جایی
    به نام تسقالتسقائولی کمین کردند و شکستی سنگین بر آن وارد آوردند.


    آنچه یورش‌ها نتوانستند، دشت‌ها آهسته‌آهسته کردند. از آستانهٔ سدهٔ بیستم مردم به دشت‌ها کوچیدند؛ در
    سال ۱۹۲۶ تنها ۲۴ نفر اینجا می‌زیستند و سرشماری ۲۰۱۴ فقط یک ساکن را شمرد. آهسته گام بردارید: حتی روستایی
    تقریباً خالی هنوز خانهٔ کسی است.
  tip: >-
    ورود رایگان است و نه نگهبانی هست، نه سرویس بهداشتی و نه مغازه‌ای. ویرانه‌ها با شیب تند در دامنه پایین
    می‌روند و راه‌ها سست و سنگلاخ‌اند، پس کفش محکم بپوشید و از دیوارهای سنگ لوحِ خشکه‌چین بالا نروید،
    چون به‌آسانی جابه‌جا می‌شوند. به زیارتگاه‌های بیرون روستا احترام بگذارید: برخی مکان‌های مقدس خوسورها
    هنوز پاس داشته می‌شوند و نزدیک شدن به آن‌ها همیشه پسندیده نیست. در ارتفاع بیش از ۲۰۰۰ متر حتی در تابستان
    هوا سرد است و باران بی‌خبر می‌رسد. اینجا منطقه‌ای مرزی است، پس گذرنامه همراه داشته باشید. یک ساعت
    کافی است؛ آن را همراه با لبایسکاری ببینید و به سوی شاتیلی ادامه دهید.
  route: >-
    ۱۳۹ کیلومتر؛ حدود چهار ساعت و ربع وقت بگذارید. از تفلیس جادهٔ S1 را تا متسختا و سپس S3 را به سمت شمال
    بگیرید؛ در ژینوالی به Sh26 به سوی باریساخو و شاتیلی بپیچید. آسفالت حوالی باریساخو تمام می‌شود؛ از
    آنجا جاده‌ای کوهستانی و شنی از گردنهٔ داتویسجواری (۲۶۷۶ متر) بالا می‌رود و به خوسورتیِ پیریکیتا فرود
    می‌آید. حدود ۲ کیلومتر از لبایسکاری جلوتر بروید: کیستانی بر دامنه‌ای کنار جادهٔ شاتیلی است و تا ویرانه‌ها
    باید پیاده بالا بروید. خودروی آفرود با فاصلهٔ واقعی کف از زمین بگیرید؛ باران جاده را به گل و سنگ بدل
    می‌کند. باک را در ژینوالی پر کنید و بالاتر در دره روی سوخت حساب نکنید. در عمل، جاده تنها از حدود ژوئن
    تا سپتامبر قابل عبور است.
he:
  name: קיסטאני
  short: >-
    כפר-מבצר מימי הביניים בפיריקיטה חבסורתי, ובו עד שלושים בתים-מגדלים; ב-1813 ארבו החבסורים בקרבת מקום
    לכוח רוסי, וב-2014 נותר בו תושב אחד.
  body: >-
    **בקיסטאני נבנו הבתים צפופים כל כך במעלה הסלע, שהגג של משפחה אחת היה המרפסת של המשפחה הבאה, והקירות
    החיצוניים של הכפר שימשו גם כחומתו.**


    קיסטאני שוכן בפיריקיטה חבסורתי, על המדרון הצפוני של קו פרשת המים של הקווקז, על הגדה השמאלית של נהר
    ארגוני, בגובה של יותר מ-2,000 מטר מעל פני הים. לבונים בימי הביניים לא היה שטח מישורי לבזבז, ולכן בנו
    במדרגות. הכפר מתחלק לשני רבעים צפופים. ברובע הראשי עמדו עד שלושים בתים-מגדלים ששימשו בעת ובעונה אחת
    בית ומבצר: מגדלי מגורים שטוחי גג לצד מגדלי קרב בעלי גג פירמידלי, בנויים מלוחות צפחה בבנייה יבשה ורק
    לעיתים רחוקות בטיט סיד. שימו לב לפרטים: חלונות קטנים וחרכי ירי, פתחי עשן מעל מוקדי האש, ובקומות העליונות
    – שרידים של מרפסות עץ ושל גזוזטראות לחימה. מעט בנפרד, על צוק גבוה, עומדים שני מבנים שנועדו להגנה בלבד.
    בתוך הכפר היו כמה "סמרבלו" – מקומות פולחן של נשים – ואילו המקדשים וטחנות הקמח הוצבו מחוץ לו.


    לקיסטאני יש גם היסטוריה משלו. כשהנסיך אלכסנדר (אלכסנדרה בטונישווילי) הנהיג מרד נגד השלטון הרוסי, פשטו
    כוחות הגנרל סימונוביץ' על כפרי החבסורים, וקיסטאני ביניהם. ב-1813, כשכוח רוסי שרדף אחרי הנסיך צעד בחזרה
    דרך קיסטאני, ארבו לו החבסורים במקום הנקרא צקלצקאולי והנחילו לו תבוסה קשה.


    מה שהפשיטות לא הצליחו לעשות, עשה המישור לאט. מתחילת המאה ה-20 ירדו האנשים אל המישורים; ב-1926 חיו
    כאן רק 24 נפשות, ובמפקד 2014 נמנה תושב אחד בלבד. צעדו בשקט: גם כפר שכמעט התרוקן הוא עדיין ביתו של
    מישהו.
  tip: >-
    הכניסה חופשית, ואין שומר, שירותים או חנות. ההריסות יורדות בתלילות במורד המדרון והשבילים רופפים ומלאי
    אבנים, לכן נעלו נעליים חזקות ואל תטפסו על קירות הצפחה הבנויים ללא טיט, שזזים בקלות. כבדו את המקדשים
    שמחוץ לכפר: חלק מהמקומות הקדושים של החבסורים עדיין נשמרים, והתקרבות אליהם אינה תמיד רצויה. בגובה של
    יותר מ-2,000 מטר קר גם בקיץ, והגשם מגיע בלי התראה. זהו אזור גבול, לכן החזיקו את הדרכון בהישג יד. שעה
    מספיקה; צרפו את הביקור ללבאיסקארי והמשיכו לשאטילי.
  route: >-
    139 ק״מ; הקדישו כארבע שעות ורבע. מטביליסי סעו בכביש S1 עד מצחתה ובכביש S3 צפונה; בז'ינוואלי פנו לכביש
    Sh26 לכיוון בריסאחו ושאטילי. האספלט נגמר בסביבות בריסאחו; משם מטפסת דרך הררית של חצץ אל מעבר דאטוויסג'ווארי
    (2,676 מ׳) ויורדת אל פיריקיטה חבסורתי. המשיכו כ-2 ק״מ אחרי לבאיסקארי: קיסטאני נמצא על המדרון לצד הדרך
    לשאטילי, ואל ההריסות עולים ברגל. קחו רכב שטח עם מרווח גחון אמיתי; גשם הופך את הדרך לבוץ ואבנים. מלאו
    את המכל בז'ינוואלי – אל תסמכו על דלק במעלה העמק. בפועל הדרך עבירה רק בערך מיוני עד ספטמבר.
ar:
  name: كيستاني
  short: >-
    قرية-حصن من العصور الوسطى في خيفسوريتي بيريكيتي تضم حتى ثلاثين بيتاً-برجاً؛ قربها كمن الخيفسوريون
    لقوة روسية عام 1813، ولم يبقَ فيها عام 2014 سوى ساكن واحد.
  body: >-
    **في كيستاني بُنيت البيوت متلاصقة على الصخر إلى حدّ أن سطح عائلة كان شرفةً للعائلة التالية، وكانت
    جدران القرية الخارجية سورها في الوقت نفسه.**


    تقع كيستاني في خيفسوريتي بيريكيتي، على المنحدر الشمالي لخط تقسيم المياه في القوقاز، على الضفة اليسرى
    لنهر أرغوني، على ارتفاع يزيد على 2,000 متر فوق سطح البحر. لم تكن لدى بنّائي العصور الوسطى أرض مستوية
    تفيض عن حاجتهم، فبنوا على مدرّجات. تنقسم القرية إلى حيّين متراصّين. في الحي الرئيسي قام ما يصل إلى
    ثلاثين بيتاً-برجاً كانت مسكناً وحصناً معاً: أبراج سكنية مسطحة السقوف إلى جانب أبراج قتالية بسقوف هرمية،
    مبنية من ألواح الأردواز بالرصف الجاف، ونادراً بملاط الجير. تأمّل التفاصيل: نوافذ صغيرة ومزاغل للبنادق،
    وفتحات دخان للمواقد، وفي الطوابق العليا آثار شرفات خشبية وأروقة قتال. وعلى مسافة قليلة، فوق جرف عالٍ،
    يقوم مبنيان دفاعيان خالصان. وكان في القرية نفسها عدد من «السامريفلو»، أي أماكن طقوس النساء، أما المزارات
    والطواحين فكانت خارجها.


    ولكيستاني تاريخها الخاص. فحين قاد الأمير ألكسندر (ألكساندره باتونيشفيلي) انتفاضة على الحكم الروسي،
    أغارت قوات الجنرال سيمونوفيتش على قرى الخيفسوريين، ومنها كيستاني. وفي عام 1813، بينما كانت قوة روسية
    عائدةً عبر كيستاني بعد مطاردتها للأمير، كمن لها الخيفسوريون في موضع يُدعى تسكالتسكاولي وألحقوا بها
    هزيمة ثقيلة.


    وما عجزت عنه الغارات، أنجزه السهل ببطء. فمنذ مطلع القرن العشرين نزل الناس إلى السهول؛ وفي عام 1926
    لم يكن يعيش هنا سوى 24 شخصاً، وأحصى تعداد 2014 ساكناً واحداً فقط. امشِ بخفّة: فحتى القرية شبه الخالية
    ما زالت بيتاً لأحد ما.
  tip: >-
    الدخول مجاني، ولا حارس ولا دورة مياه ولا دكان. تنحدر الأطلال بشدة على السفح والممرات مفككة وكثيرة
    الحجارة، فالبس حذاءً متيناً ولا تتسلّق جدران الأردواز المرصوفة جافاً، فهي تتزحزح بسهولة. احترم المزارات
    خارج القرية: فبعض الأماكن المقدسة للخيفسوريين ما زالت مرعيّة، والاقتراب منها ليس مرحّباً به دائماً.
    على ارتفاع يتجاوز 2,000 متر يكون الجو بارداً حتى في الصيف، ويهطل المطر بلا إنذار. هذه منطقة حدودية،
    فاحمل جواز سفرك. تكفي ساعة؛ زُرها مع ليبايسكاري وتابع إلى شاتيلي.
  route: >-
    139 كم؛ احسب نحو أربع ساعات وربع. من تبليسي اسلك S1 حتى متسخيتا ثم S3 شمالاً؛ وعند جينفالي انعطف إلى
    Sh26 باتجاه باريساخو وشاتيلي. ينتهي الإسفلت عند باريساخو تقريباً؛ ومن هناك يصعد طريق جبلي من الحصى
    إلى ممر داتفيسجفاري (2,676 م) ثم ينحدر إلى خيفسوريتي بيريكيتي. تابع نحو 2 كم بعد ليبايسكاري: تقع كيستاني
    على السفح بجانب طريق شاتيلي، وتصعد إلى الأطلال مشياً. خذ سيارة للطرق الوعرة بخلوص أرضي حقيقي؛ فالمطر
    يحوّل الطريق إلى وحل وحجارة. املأ الخزان في جينفالي، ولا تعوّل على الوقود في أعلى الوادي. وعملياً
    لا يُسلك الطريق إلا من يونيو إلى سبتمبر تقريباً.
