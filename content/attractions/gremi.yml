ka:
  name: გრემის არქიტექტურული კომპლექსი
  short: >-
    აგურის ტაძარი, სამეფო კოშკი და ფრესკაზე გამოსახული მეფე საკუთარი ეკლესიით ხელში — კახეთის დაკარგული
    დედაქალაქის გორაკზე, ინწობის თავზე.
  body: >-
    **„ოცდახუთი წელია, რაც ტაძარი ააგეს“, — უთხრა არქიმანდრიტმა ათანასემ გრემში ჩამოსულ რუს ელჩებს 1589–1590
    წლებში; სწორედ ამ სიტყვებით დაადგინეს მთავარანგელოზთა ეკლესიის თარიღი — 1565 წელი.**


    მეფე ლევანის (1520–1574) დროს გრემი კახეთის სამეფოს დედაქალაქი და აბრეშუმის გზის ერთ-ერთ განშტოებაზე
    გაშენებული ხალხმრავალი სავაჭრო ქალაქი იყო. 1939–1949 და 1963–1967 წლების გათხრებმა აჩვენა, როგორი:
    ეზოს გარშემო ოცდაათი კამაროვანი დუქნით შემოფარგლული დახურული ბაზარი, 80-მეტრიანი ქარვასლა, რომლის
    დერეფნის ორივე მხარეს თექვსმეტ-თექვსმეტი პატარა ოთახი იყო, უცხოელი ვაჭრებისთვის აგებული ორსართულიანი
    აბანო, ლოპოტიდან გამოყვანილი არხით მომარაგებული თიხის წყალსადენი და სპარსული თუ ჩინური ჭურჭლის ნატეხები.
    1615 წელს შაჰ-აბას I-ის ლაშქარმა ქალაქი მიწასთან გაასწორა, მეფეები თელავს დაბრუნდნენ, ქუჩები კი მინდვრებმა
    დაფარეს.


    დღეს ინწობის თავზე, გორაკზე, ციტადელი დგას: ეკლესია, სამეფო კოშკი და სათოფურებიანი გალავანი, რომელიც
    მოგვიანებით ერეკლე II-ს შეუკეთებია; მდინარისკენ ქვით ნაგები საიდუმლო გასასვლელი ჩადის. ტაძარი ქართული
    კვადრატული აგურითაა ნაშენი კირის ხსნარზე, აქა-იქ რიყის ქვით, და მისი ყოველი ხაზი მაღლა, გუმბათისკენ
    მიისწრაფვის, რომლის ყელსაც რვა შეისრულთაღიანი სარკმელი ჭრის. მოხატულობა 1577 წელს დასრულდა. დასავლეთ
    კედელზე მეფე ლევანს ხელში ეკლესიის მოდელი უჭირავს, წარწერით „მეფე ლეონ აღმშენებელი“; მისი სამარხიც
    აქვეა.


    გვერდით მდგარ სამსართულიან კოშკში პატარა მუზეუმია: გათხრებისას ნაპოვნი ნივთები, XVI საუკუნის ზარბაზანი
    და კახთა მეფეების პორტრეტები, რომლებიც ლევან ჭოღოშვილმა 1985 წელს დახატა. გორაკიდან ალაზნის ველი ხელისგულივით
    ჩანს.


    1959 წელს ოთარ ჭილაძემ ლექსი დაწერა — „როდესაც ასე ახლოა გრემი“. საღამოს გალავანთან დადექით და მიხვდებით,
    რას ნიშნავს ეს სათაური: დედაქალაქი აღარ არის, მაგრამ ისე ახლოსაა, თითქოს ხელით შეეხებით.
  tip: >-
    ერთი საათი დაუთმეთ, კოშკის მუზეუმში თუ შეყოვნდებით — მეტიც; მუზეუმის ბილეთი მცირე ღირებულებისაა (ბოლო
    ცნობით, დაახლოებით 5 ლარი). გორაკზე ჩრდილი თითქმის არ არის, ამიტომ ზაფხულში დილით ან საღამოსკენ მოდით
    და წყალი თან იქონიეთ. ეკლესიაში მხრები დაფარული უნდა იყოს, შორტი კი შეუფერებელია. 2025 წელს ძეგლზე
    საკონსერვაციო სამუშაოები მიმდინარეობდა, ამიტომ ტაძრის ნაწილი შეიძლება ხარაჩოებში დაგხვდეთ. მანქანა
    გორაკის ძირში, გზის პირას დააყენეთ. კარგი სადილისთვის ყვარელში გააგრძელეთ გზა ან თელავს დაბრუნდით;
    ნეკრესის მონასტერი და ხარების ღვინის გვირაბი სულ ახლოსაა.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით გადით, ვაზიანის გავლით შ38-ზე გადაუხვიეთ და გომბორის უღელტეხილით თელავამდე
    ჩადით — დაახლოებით 90 კილომეტრი. თელავიდან შ70-ით ჩრდილო-აღმოსავლეთით, შაქრიანის მიმართულებით წადით,
    შემდეგ შ43-ით ყვარლისკენ. გრემი თელავიდან 27-ე კილომეტრზე, პირდაპირ გზის პირას დგას, ასე რომ, მოსახვევის
    ძებნა არ დაგჭირდებათ. სულ 114 კილომეტრი, დაახლოებით ორი საათი და ათი წუთი, მთელ გზაზე ასფალტი. საწვავი
    თელავშია. ეკონომ-კლასის მანქანა სავსებით საკმარისია. თუ გომბორი თოვლმა ჩაკეტა, ს5-ით საგარეჯოსა და
    გურჯაანზე შემოუარეთ: გრძელია, მაგრამ ბარის გზაა.
en:
  name: Gremi
  short: >-
    A brick church, a royal tower and a painted king holding his own church, on the hill of Kakheti's
    lost capital above the Intsoba river.
  body: >-
    **"It is twenty-five years since the church was built," an archimandrite told Russian envoys at Gremi
    in 1589–90, which is how the Church of the Archangels got its date: 1565.**


    Under King Levan (1520–1574) Gremi was the capital of Kakheti and a busy trading town on a branch
    of the Silk Road. Excavations in 1939–49 and 1963–67 found what that meant: a covered market of thirty
    vaulted shops around a courtyard, an 80-metre caravanserai with sixteen small rooms on each side of
    its corridor, a two-storey bathhouse for foreign merchants, ceramic water pipes fed by a canal from
    the Lopota, and shards of Persian and Chinese ware. In 1615 the armies of Shah Abbas I razed the town,
    the kings moved back to Telavi, and the fields closed over the streets.


    What stands is the citadel on its hill above the Intsoba: church, royal tower and a wall with gun
    loops, repaired by Erekle II, with a stone-built secret passage running down to the river. The church
    is brick, Georgian square bricks set in lime with river cobble here and there, and every line in it
    pulls upwards to a dome on a drum pierced by eight pointed-arched windows. The frescoes were finished
    in 1577. On the west wall King Levan holds a model of the church, labelled "King Leon the Builder",
    and his tomb is here too.


    The three-storey tower beside it keeps a small museum: finds from the digs, a 16th-century cannon,
    and portraits of the kings of Kakheti painted by Levan Chogoshvili in 1985. From the hill the Alazani
    valley spreads out below.


    In 1959 the poet Otar Chiladze called a poem "When Gremi Is So Near". Stand by the walls at dusk and
    the title makes sense: the capital is gone, and still close enough to touch.
  tip: >-
    Allow an hour, longer if you linger in the tower museum, which has a small ticket (around 5 lari at
    our last check). The hill has almost no shade, so in summer come in the morning or late afternoon
    and bring water. Inside the church, shoulders should be covered and shorts are out of place. Conservation
    work was under way in 2025, so parts of the church may be behind scaffolding. Parking is at the foot
    of the hill, right beside the road. For a proper meal, go on to Kvareli or back to Telavi; the Nekresi
    monastery and the Khareba wine tunnel are both a short drive away.
  route: >-
    From Tbilisi take the S5 east and, just past Vaziani, the Sh38 over the Gombori Pass to Telavi, about
    90 km. From Telavi follow the Sh70 north-east towards Shakriani, then the Sh43 towards Kvareli. Gremi
    stands right beside the road at the 27th kilometre from Telavi, so there is no turning to hunt for.
    The total is 114 km, about 2 hours 10 minutes, all on asphalt. Fuel is in Telavi. An economy car is
    all you need. If snow closes Gombori, go round on the S5 through Sagarejo and Gurjaani instead: longer,
    but flat.
ru:
  name: Греми
  short: >-
    Кирпичная церковь, царская башня и царь на фреске с моделью собственного храма — на холме над рекой
    Инцоба, где стояла погибшая столица Кахетии.
  body: >-
    **«Церкви уже двадцать пять лет», — сказал архимандрит русским послам в Греми в 1589–90 годах; так
    и стала известна дата постройки церкви Архангелов — 1565.**


    При царе Леване (1520–1574) Греми был столицей Кахетинского царства и оживлённым торговым городом
    на одной из ветвей Шёлкового пути. Раскопки 1939–49 и 1963–67 годов показали, что это значило: крытый
    рынок из тридцати сводчатых лавок вокруг двора, караван-сарай длиной 80 метров с шестнадцатью небольшими
    комнатами по каждой стороне коридора, двухэтажная баня для иноземных купцов, керамический водопровод,
    в который вода поступала по каналу от Лопоты, и осколки персидской и китайской посуды. В 1615 году
    войска шаха Аббаса I разрушили город, цари вернулись в Телави, а поля сомкнулись над улицами.


    Сохранилась цитадель на холме над Инцобой: церковь, царская башня и стена с бойницами, восстановленная
    Ираклием II, с каменным потайным ходом, ведущим вниз к реке. Церковь построена из кирпича — грузинского
    квадратного кирпича, скреплённого известью, кое-где с речным булыжником, — и каждая линия в ней тянется
    вверх, к куполу на барабане, прорезанном восемью стрельчатыми окнами. Фрески были завершены в 1577
    году. На западной стене царь Леван держит в руках модель церкви с надписью «царь Леон-строитель»,
    здесь же находится и его гробница.


    В трёхэтажной башне рядом устроен небольшой музей: находки с раскопок, пушка XVI века и портреты кахетинских
    царей, написанные Леваном Чогошвили в 1985 году. С холма открывается вид на Алазанскую долину.


    В 1959 году поэт Отар Чиладзе назвал одно из стихотворений «Когда Греми так близко». Постойте у стен
    в сумерках — и заглавие обретает смысл: столицы больше нет, но она всё ещё достаточно близко, чтобы
    её коснуться.
  tip: >-
    На осмотр хватит часа, дольше — если задержаться в музее башни, где берут небольшую плату за вход
    (около 5 лари на момент нашей последней проверки). На холме почти нет тени, поэтому летом приезжайте
    утром или под вечер и берите с собой воду. В церкви плечи должны быть закрыты, шорты неуместны. В
    2025 году в церкви шли реставрационные работы, так что часть здания может быть в лесах. Парковка —
    у подножия холма, прямо у дороги. За полноценным обедом отправляйтесь в Кварели или обратно в Телави;
    до монастыря Некреси и винного тоннеля Хареба отсюда совсем недалеко.
  route: >-
    Из Тбилиси езжайте по трассе S5 на восток и, сразу за Вазиани, по дороге Sh38 через Гомборский перевал
    до Телави — около 90 км. Из Телави следуйте по Sh70 на северо-восток в направлении Шакриани, затем
    по Sh43 в сторону Кварели. Греми стоит прямо у дороги, на 27-м километре от Телави, так что искать
    поворот не придётся. Всего 114 км, около 2 часов 10 минут, полностью по асфальту. Заправиться можно
    в Телави. Достаточно машины эконом-класса. Если Гомборский перевал закрыт из-за снега, поезжайте в
    обход по S5 через Сагареджо и Гурджаани: длиннее, но равнинная дорога.
fa:
  name: گرمی
  short: >-
    کلیسایی آجری، برجی سلطنتی و پادشاهی نگاره‌شده که کلیسای خود را در دست دارد، بر تپهٔ پایتخت ازدست‌رفتهٔ
    کاختی، بالای رود اینتسوبا.
  body: >-
    **«بیست‌وپنج سال از ساخت این کلیسا می‌گذرد» - آرشیمندریتی به فرستادگان روسی در گرمی، در سال‌های ۱۵۸۹-۹۰
    میلادی چنین گفت، و از همین رو تاریخ ساخت کلیسای فرشتگان مقرب، یعنی سال ۱۵۶۵، به دست آمد.**


    در دوران پادشاهی لِوان (۱۵۲۰-۱۵۷۴)، گرمی پایتخت کاختی و شهری پرتجارت بر شاخه‌ای از راه ابریشم بود.
    کاوش‌های سال‌های ۱۹۳۹-۴۹ و ۱۹۶۳-۶۷ نشان داد این یعنی چه: بازاری سرپوشیده با سی مغازهٔ طاق‌دار پیرامون
    یک حیاط، کاروان‌سرایی به طول ۸۰ متر با شانزده اتاق کوچک در هر سوی راهرو، حمامی دوطبقه برای بازرگانان
    خارجی، لوله‌های سفالی آب که از کانالی متصل به رود لوپوتا تغذیه می‌شد، و تکه‌های ظروف سفالی ایرانی
    و چینی. در سال ۱۶۱۵، سپاهیان شاه‌عباس اول شهر را ویران کردند، پادشاهان به تلاوی بازگشتند و کشتزارها
    روی خیابان‌ها را پوشاندند.


    آنچه امروز برپاست، دژی بر تپه‌ای بالای اینتسوبا است: کلیسا، برج سلطنتی و باروی مزغل‌دار که به دست
    ارکله دوم بازسازی شد، همراه با راهرویی مخفی و سنگ‌چین که تا رود پایین می‌رود. کلیسا از آجر ساخته شده
    - آجرهای مربعی گرجی، ملات‌شده با آهک و جای‌جای با قلوه‌سنگ رودخانه‌ای - و هر خطِ آن رو به بالا می‌کشد،
    به سوی گنبدی بر گریوی که هشت پنجرهٔ جناغی در آن گشوده شده است. نقاشی‌های دیواری در سال ۱۵۷۷ به پایان
    رسید. بر دیوار غربی، پادشاه لوان نمونه‌ای از کلیسا را در دست دارد، با کتیبهٔ «پادشاه لئون سازنده»،
    و آرامگاه او نیز همین‌جاست.


    برج سه‌طبقهٔ کناری، موزهٔ کوچکی در خود جای داده: یافته‌های کاوش‌ها، توپی از سدهٔ شانزدهم و تصویرهای
    پادشاهان کاختی که لوان چوگوشویلی در سال ۱۹۸۵ کشیده است. از بالای تپه، دشت آلازانی زیر پا گسترده می‌شود.


    در سال ۱۹۵۹، شاعر اوتار چیلادزه شعری با عنوان «وقتی گرمی این‌قدر نزدیک است» سرود. در گرگ‌ومیش کنار
    دیوارها بایستید و آن عنوان معنا می‌یابد: پایتخت رفته است، اما هنوز چنان نزدیک که می‌توان آن را لمس
    کرد.
  tip: >-
    یک ساعت کافی است، اگر در موزهٔ برج درنگ کنید بیشتر؛ بلیت آن ارزان است (در آخرین بازدید ما حدود ۵ لاری).
    تپه تقریباً هیچ سایه‌ای ندارد، پس در تابستان صبح یا اواخر بعدازظهر بیایید و آب همراه داشته باشید.
    درون کلیسا، شانه‌ها باید پوشیده باشد و شلوارک جایی ندارد. در سال ۲۰۲۵ کار حفاظتی در جریان بود، پس
    بخش‌هایی از کلیسا ممکن است پوشیده از داربست باشد. پارکینگ در پای تپه، کنار جاده است. برای غذایی درست‌وحسابی،
    به کوارلی بروید یا به تلاوی برگردید؛ صومعهٔ نکرسی و تونل شرابِ خارِبا هر دو با فاصله‌ای کوتاه در دسترس‌اند.
  route: >-
    از تفلیس مسیر S5 را به سوی شرق بگیرید و درست پس از وازیانی، از راه Sh38 از گذرگاه گومبوری به تلاوی
    بروید، حدود ۹۰ کیلومتر. از تلاوی، از راه Sh70 به سوی شمال‌شرق و شاکریانی پیش بروید، سپس Sh43 به سوی
    کوارلی. گرمی درست کنار جاده، در کیلومتر ۲۷ از تلاوی قرار دارد، پس نیازی به جست‌وجوی پیچی نیست. مسافت
    کل ۱۱۴ کیلومتر است، حدود ۲ ساعت و ۱۰ دقیقه، همه بر آسفالت. سوخت‌گیری در تلاوی ممکن است. خودرویی اقتصادی
    کافی است. اگر برف گذرگاه گومبوری را ببندد، از راه S5 از ساگارجو و گورجانی دور بزنید: طولانی‌تر اما
    هموار.
he:
  name: גרמי
  short: >-
    כנסיית לבנים, מגדל מלכותי ומלך בפרסקו האוחז בדגם הכנסייה שבנה, על הגבעה שמעל נהר האינצובה, בעיר הבירה
    האבודה של קאחתי.
  body: >-
    **“עברו עשרים וחמש שנה מאז שנבנתה הכנסייה”, אמר ארכימנדריט לשליחים רוסיים בגרמי בשנים 1589–1590, ומכאן
    ידוע תאריכה של כנסיית המלאכים הראשיים: 1565.**


    בימי המלך לוואן (1520–1574) הייתה גרמי בירת קאחתי ועיר מסחר תוססת על ענף של דרך המשי. חפירות בשנים
    1939–1949 ו-1963–1967 חשפו למה הכוונה: שוק מקורה של שלושים חנויות מקומרות סביב חצר, פונדק דרכים (קרוואנסראי)
    באורך 80 מטר עם שישה-עשר חדרים קטנים בכל צד של המסדרון, בית מרחץ דו-קומתי לסוחרים זרים, צנרת מים מקרמיקה
    שהוזנה מתעלה מנהר הלופוטה, וחרסים של כלים פרסיים וסיניים. בשנת 1615 החריבו צבאות השאה עבאס הראשון
    את העיר, המלכים חזרו לטלאווי, והשדות נסגרו מעל הרחובות.


    מה שנותר על עומדו הוא המצודה על גבעתה מעל האינצובה: כנסייה, מגדל מלכותי וחומה עם חרכי ירי, שתוקנה
    בידי ארקלה השני, עם מעבר סודי בנוי אבן היורד עד הנהר. הכנסייה בנויה מלבנים - לבנים גאורגיות מרובעות
    מונחות בסיד, ופה ושם אבני נחל - וכל קו בה נמשך מעלה, לכיפה שעל תוף מנוקב בשמונה חלונות בעלי קשת מחודדת.
    עבודות הפרסקו הושלמו ב-1577. על הקיר המערבי מחזיק המלך לוואן דגם של הכנסייה, ועליו הכיתוב “המלך לאון
    הבנאי”, וכאן נמצא גם קברו.


    המגדל התלת-קומתי לצדה מכיל מוזיאון קטן: ממצאים מהחפירות, תותח מהמאה ה-16, ודיוקנאות של מלכי קאחתי
    שצייר לוואן צ'וגושווילי בשנת 1985. מהגבעה נפרש למטה עמק האלאזני.


    בשנת 1959 קרא המשורר אוטאר צ'ילדזה לשיר בשם “כשגרמי כך קרובה”. עמדו לצד החומות בין השמשות והכותרת
    מקבלת משמעות: הבירה איננה עוד, ועדיין קרובה מספיק כדי לגעת בה.
  tip: >-
    שעה אחת מספיקה, יותר אם משתהים במוזיאון המגדל, שהכניסה אליו כרוכה בתשלום קטן (כ-5 לארי בבדיקתנו האחרונה).
    לגבעה אין כמעט צל, אז בקיץ מומלץ להגיע בבוקר או אחר הצהריים המאוחר ולהביא מים. בתוך הכנסייה יש לכסות
    כתפיים, ומכנסים קצרים אינם מתאימים. ב-2025 היו עבודות שימור בעיצומן, כך שחלקים מהכנסייה עשויים להיות
    מכוסים בפיגומים. החניה בתחתית הגבעה, ממש לצד הדרך. לארוחה של ממש, המשיכו לקוואראלי או חזרו לטלאווי;
    מנזר נקרסי ומנהרת היין חרבה נמצאים שניהם במרחק נסיעה קצר.
  route: >-
    מטביליסי סעו בכביש S5 מזרחה, ומעבר לוואזיאני פנו לדרך Sh38 העולה על מעבר גומבורי לטלאווי, כ-90 ק"מ.
    מטלאווי המשיכו בדרך Sh70 צפון-מזרחה לכיוון שקריאני, ואז ב-Sh43 לכיוון קוואראלי. גרמי נמצאת ממש לצד
    הדרך, בקילומטר ה-27 מטלאווי, כך שאין צורך לחפש פנייה. בסך הכול 114 ק"מ, כשעתיים ו-10 דקות, כולו על
    אספלט. תדלוק אפשרי בטלאווי. רכב אקונומי מספיק בהחלט. אם השלג סוגר את מעבר גומבורי, עקפו בכביש S5 דרך
    סאגארג'ו וגורג'אני: ארוך יותר אך שטוח.
ar:
  name: غرمي
  short: كنيسة من الآجر، وبرج ملكي، وملك في جدارية يحمل نموذج كنيسته، على تلة عاصمة كاختي الضائعة فوق
    نهر إنتسوبا.
  body: >-
    **«لقد مضت خمسة وعشرون عامًا على بناء الكنيسة»، هذا ما قاله الأرشمندريت أثناسيوس للمبعوثين الروس في
    غرمي عام 1589–1590، ومن هنا عُرف تاريخ بناء كنيسة رئيسي الملائكة: 1565.**


    في عهد الملك ليفان (1520–1574)، كانت غرمي عاصمة كاختي ومدينة تجارية نشطة على أحد فروع طريق الحرير.
    كشفت الحفريات في 1939–1949 و1963–1967 عن معنى ذلك: سوق مسقوف من ثلاثين متجرًا مقنطرًا حول ساحة، وخان
    (كرفانسراي) طوله 80 مترًا فيه ست عشرة غرفة صغيرة على كل جانب من ممره، وحمّام من طابقين للتجار الأجانب،
    وأنابيب مياه فخارية تُغذّى من قناة من نهر لوبوتا، وشقف من الفخار الفارسي والصيني. في عام 1615 دمّرت
    جيوش الشاه عباس الأول المدينة، فعاد الملوك إلى تيلافي، وغطّت الحقول الشوارع.


    ما تبقّى قائمًا هو القلعة على تلتها فوق إنتسوبا: كنيسة، وبرج ملكي، وسور بفتحات لإطلاق النار، أعاد
    ترميمه إريكله الثاني، مع ممر سري مبني بالحجر ينحدر إلى النهر. الكنيسة مبنية بالآجر - آجر جورجي مربع
    مثبَّت بالجير، مع حصى نهري هنا وهناك - وكل خط فيها يمتد إلى الأعلى، نحو قبة على رقبة تخترقها ثماني
    نوافذ ذات عقود مدببة. اكتملت الجداريات عام 1577. على الجدار الغربي، يحمل الملك ليفان نموذجًا للكنيسة،
    وقد كُتب عليه «الملك ليون الباني»، وضريحه موجود هنا أيضًا.


    البرج المجاور، المكوّن من ثلاثة طوابق، يضم متحفًا صغيرًا: لُقى من الحفريات، ومدفعًا من القرن السادس
    عشر، وصورًا لملوك كاختي رسمها ليفان تشوغوشفيلي عام 1985. من التلة، ينبسط وادي ألازاني في الأسفل.


    في عام 1959، أسمى الشاعر أوتار تشيلادزه قصيدة له «حين تكون غرمي قريبة جدًا». قِف عند الأسوار عند الغسق،
    وسيصبح للعنوان معنى: العاصمة زالت، ومع ذلك تبقى قريبة بما يكفي لتُلمس.
  tip: >-
    ساعة واحدة تكفي، وأطول إن تمهّلت في متحف البرج، الذي يتطلب تذكرة بسيطة (حوالي 5 لاري في آخر زيارة
    لنا). لا يوجد على التلة أي ظل تقريبًا، فتعال في الصيف صباحًا أو في وقت متأخر من بعد الظهر واحمل معك
    الماء. داخل الكنيسة يجب تغطية الأكتاف، ولا مكان للسراويل القصيرة. كانت أعمال الصيانة جارية في 2025،
    فقد تكون أجزاء من الكنيسة خلف السقالات. الموقف عند سفح التلة، بجانب الطريق مباشرة. لوجبة حقيقية، توجّه
    إلى كفاريلي أو عد إلى تيلافي؛ دير نيكريسي ونفق خاريبا للنبيذ كلاهما على مسافة قصيرة بالسيارة.
  route: >-
    من تبليسي خذ الطريق S5 شرقًا، وبعد فازياني مباشرة، خذ الطريق Sh38 عبر ممر غومبوري إلى تيلافي، حوالي
    90 كم. من تيلافي، اتبع الطريق Sh70 باتجاه الشمال الشرقي نحو شاكرياني، ثم الطريق Sh43 نحو كفاريلي.
    تقع غرمي مباشرة على الطريق، عند الكيلومتر 27 من تيلافي، فلا حاجة للبحث عن منعطف. المسافة الإجمالية
    114 كم، حوالي ساعتين و10 دقائق، كلها على الإسفلت. يمكن التزود بالوقود في تيلافي. سيارة اقتصادية كافية.
    إذا أغلق الثلج ممر غومبوري، فالتفّ عبر الطريق S5 مرورًا بساغاريجو وغورجاني: أطول لكنه مستوٍ.
