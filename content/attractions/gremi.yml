ka:
  name: გრემის არქიტექტურული კომპლექსი
  short: კახეთის დაკარგული დედაქალაქის ციტადელი — მთავარანგელოზთა ეკლესია და კოშკი ბორცვზე, ალაზნის ველის
    თავზე.
  body: >-
    გრემი XVI საუკუნეში კახეთის სამეფოს დედაქალაქი იყო — მრავალათასიანი სავაჭრო ქალაქი აბრეშუმის გზის
    ერთ-ერთ განშტოებაზე, სომხური, სპარსული და ქართული უბნებით. 1615 წელს შაჰ-აბას პირველის ლაშქრობამ ქალაქი
    მიწასთან გაასწორა; მოსახლეობა ან დაიხოცა, ან სპარსეთში გადაასახლეს, და დედაქალაქი თელავში გადავიდა.
    დღეს ვრცელი ქალაქიდან ბორცვზე მდგარი ციტადელი შემორჩა.


    ცენტრალური ნაგებობა **მთავარანგელოზთა ეკლესიაა**, აშენებული 1565 წელს მეფე ლევანის დროს — წაგრძელებული,
    აგურის წყობის ტაძარი მაღალი გუმბათით, რომელიც კახური არქიტექტურის სპარსული გავლენით გამორჩეული ნიმუშია.
    ინტერიერში XVI საუკუნის მოხატულობის მნიშვნელოვანი ფრაგმენტებია შემორჩენილი, მათ შორის ქტიტორთა პორტრეტები.
    ეკლესიის გვერდით სამრეკლო-კოშკი დგას, რომლის სამ სართულზეც პატარა მუზეუმია მოწყობილი.


    ასვლა ბორცვზე ხუთი წუთია და ზემოდან იშლება ხედი ალაზნის ველზე, ვენახებზე და კავკასიონის ქედზე. კომპლექსი
    კომპაქტურია — ერთი საათი სავსებით საკმარისია — ამიტომ იგი ლოგიკურად ჯდება ნეკრესსა და ყვარელს შორის
    ერთდღიან მარშრუტში. არქეოლოგიური გათხრები ქვემოთ, ველზე, დღემდე გრძელდება. ბორცვის ძირში, სოფლის მხარეს,
    აღდგენილია სამეფო აბანოსა და სასახლის ნაწილი, ხოლო გზის მეორე მხარეს ვენახებია — გრემის სახელი დღეს
    ღვინის ეტიკეტებზეც გვხვდება. კომპლექსში მოკლე დათვალიერებაც კი ნათლად აჩვენებს, რამდენად მდიდარი იყო
    კახეთი შაჰ-აბასის ლაშქრობამდე.
  tip: >-
    საათი სავსებით საკმარისია, თუ კოშკზეც ახვალთ. ბილეთი სიმბოლურია და კოშკის მუზეუმს მოიცავს; ეზოში შესვლა
    უფასოა. მანქანა შესასვლელთან, გზის პირას დგება. საუკეთესო შუქი დილაა ან საღამო, შუადღისას ბორცვზე
    ჩრდილი თითქმის არ არის და ზაფხულში ცხელა. ეკლესიაში მოკრძალებული ჩაცმაა საჭირო — შორტი და ღია მხრები
    არასასურველია. ტუალეტი ტერიტორიაზეა, კაფე — ყვარელში.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე, შემდეგ ყვარლის მიმართულებით ჩრდილო-აღმოსავლეთით კიდევ ოცდაათიოდე
    კილომეტრი — სულ დაახლოებით 125 კმ და ორი საათი ოცი წუთი. გზა ბოლომდე ასფალტიანია და ეკონომ კლასის
    მანქანა სავსებით საკმარისია; გრემი პირდაპირ მაგისტრალის პირასაა და მოსახვევის ძებნა არ დაგჭირდებათ.
    საწვავს ავსებთ თელავში ან ყვარელში. ალტერნატიული გზა საგარეჯო–გურჯაანზე ბრტყელია, მაგრამ ოცდაათი კილომეტრით
    გრძელი.
en:
  name: Gremi
  short: The citadel of Kakheti's lost capital — a 1565 church and tower on a hill above the Alazani Valley.
  body: >-
    In the sixteenth century Gremi was the capital of the Kingdom of Kakheti: a trading town of several
    thousand people on a branch of the Silk Road, with Armenian, Persian and Georgian quarters, workshops,
    a caravanserai and a royal palace. In 1615 the campaign of Shah Abbas I destroyed it completely —
    the population was killed or deported to Persia, and the capital moved to Telavi. What survives today
    is the citadel on its hill; the town itself is under the fields below.


    The centrepiece is the **Church of the Archangels**, built in 1565 under King Levan: an elongated
    brick church with a tall drum and dome, one of the clearest examples of Kakhetian architecture absorbing
    Persian influence. Inside, substantial fragments of sixteenth-century painting remain, including donor
    portraits. Beside it stands the bell tower, whose three floors now house a small museum of finds from
    the site.


    The climb up to the citadel takes five minutes and repays it with a wide view over the Alazani plain,
    its vineyards, and the Caucasus ridge beyond. The complex is compact — an hour covers it comfortably
    — which makes it a natural stop on a day that also takes in Nekresi and Kvareli. Archaeological excavation
    of the lower town continues in the fields at the foot of the hill.
  tip: >-
    An hour is enough, including the tower. The ticket is nominal and covers the tower museum; walking
    into the grounds is free. Park at the entrance directly off the road. Morning or late afternoon gives
    the best light — there is almost no shade on the hill and summer middays are hot. Modest dress is
    expected inside the church, so avoid shorts and bare shoulders. There is a toilet on site; the nearest
    cafés are in Kvareli.
  route: >-
    From Tbilisi cross the Gombori Pass to Telavi, then continue north-east towards Kvareli for another
    thirty kilometres or so — around 125 km and two hours twenty in total. The road is asphalt throughout
    and an economy car is entirely sufficient; Gremi sits directly beside the main road, so there is no
    turning to hunt for. Fuel is available in Telavi and Kvareli. The alternative route via Sagarejo and
    Gurjaani is flatter but roughly thirty kilometres longer.
ru:
  name: Греми
  short: Цитадель исчезнувшей столицы Кахетии — храм 1565 года и башня на холме над Алазанской долиной.
  body: >-
    В XVI веке Греми был столицей Кахетинского царства: торговый город на ответвлении Шёлкового пути,
    с армянским, персидским и грузинским кварталами, мастерскими, караван-сараем и царским дворцом. В
    1615 году поход шаха Аббаса I стёр город с лица земли — жителей перебили или угнали в Персию, а столицу
    перенесли в Телави. Сегодня от всего этого сохранилась цитадель на холме; сам город лежит под полями
    внизу.


    Ядро комплекса — **церковь Архангелов**, построенная в 1565 году при царе Леване: вытянутый кирпичный
    храм с высоким барабаном и куполом, один из самых наглядных примеров того, как кахетинская архитектура
    впитывала персидское влияние. Внутри сохранились значительные фрагменты росписи XVI века, включая
    ктиторские портреты. Рядом стоит колокольня, на трёх этажах которой устроен небольшой музей находок.


    Подъём на цитадель занимает пять минут и открывает широкий вид на Алазанскую равнину, виноградники
    и хребет Кавказа. Комплекс компактный — часа хватает с запасом, — поэтому он естественно вписывается
    в день, куда входят также Некреси и Кварели. Раскопки нижнего города в полях у подножия холма продолжаются
    до сих пор.
  tip: >-
    Часа достаточно, включая подъём на башню. Билет символический и покрывает музей в башне, вход на территорию
    свободный. Машину оставляют у входа прямо с дороги. Лучший свет утром или ближе к вечеру: тени на
    холме почти нет, летом в середине дня жарко. Внутри храма нужна скромная одежда — шорты и открытые
    плечи нежелательны. Туалет есть на территории, ближайшие кафе — в Кварели.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави, затем на северо-восток в сторону Кварели ещё около
    тридцати километров — всего примерно 125 км и два часа двадцать. Дорога асфальтовая на всём протяжении,
    машины эконом-класса вполне достаточно; Греми стоит прямо у трассы, искать поворот не придётся. Заправиться
    можно в Телави и Кварели. Альтернативный маршрут через Сагареджо и Гурджаани ровнее, но примерно на
    тридцать километров длиннее.
fa:
  name: گرمی
  short: ارگ پایتخت ازدست‌رفتهٔ کاختی — کلیسایی از 1565 و برجی بر تپه‌ای مشرف به درهٔ آلازانی.
  body: >-
    در سدهٔ شانزدهم گرمی پایتخت پادشاهی کاختی بود: شهری بازرگانی با چند هزار ساکن بر یکی از شاخه‌های جادهٔ
    ابریشم، با محله‌های ارمنی، ایرانی و گرجی، کارگاه‌ها، کاروانسرا و کاخی سلطنتی. در 1615 لشکرکشی شاه
    عباس یکم آن را یکسره ویران کرد — مردم شهر یا کشته شدند یا به ایران کوچانده شدند، و پایتخت به تلاوی
    منتقل شد. آنچه امروز برجای مانده ارگ روی تپه است؛ خود شهر زیر دشت‌های پایین خوابیده است.


    هستهٔ مجموعه **کلیسای فرشتگان مقرب** است، ساختهٔ 1565 در روزگار شاه لوان: کلیسایی آجری و کشیده با
    گریو و گنبدی بلند، از روشن‌ترین نمونه‌های معماری کاختی که تأثیر ایرانی را در خود جذب کرده است. در
    درون، بخش‌های چشمگیری از نقاشی سدهٔ شانزدهم برجای مانده، از جمله تصویر واقفان. کنار آن برج ناقوس ایستاده
    که سه طبقه‌اش امروز موزهٔ کوچکی از یافته‌های محوطه را در خود جای داده است.


    بالا رفتن تا ارگ پنج دقیقه طول می‌کشد و در برابرش نمایی گسترده بر دشت آلازانی، تاکستان‌های آن و رشته‌کوه
    قفقاز در دوردست به شما می‌دهد. مجموعه فشرده است — یک ساعت به‌راحتی کافی است — و همین آن را به توقفی
    طبیعی در روزی بدل می‌کند که نکرسی و کوارلی را هم در بر می‌گیرد. کاوش باستان‌شناسی شهرِ پایین هنوز
    در دشت‌های دامنهٔ تپه ادامه دارد.
  tip: >-
    یک ساعت کافی است، با احتساب برج. بلیت نمادین است و موزهٔ برج را در بر می‌گیرد؛ ورود به محوطه رایگان
    است. ماشین را درست کنار جاده، مقابل ورودی پارک کنید. بهترین نور صبح یا اواخر بعدازظهر است — روی تپه
    تقریباً هیچ سایه‌ای نیست و ظهرهای تابستان گرم‌اند. در کلیسا پوشش محجوب انتظار می‌رود، پس از شلوارک
    و شانه‌های برهنه بپرهیزید. سرویس بهداشتی در محوطه هست؛ نزدیک‌ترین کافه‌ها در کوارلی‌اند.
  route: >-
    از تفلیس گردنهٔ گومبوری را تا تلاوی بگذرید، سپس به سوی شمال‌شرق در جهت کوارلی حدود سی کیلومتر دیگر
    ادامه دهید — روی‌هم نزدیک 125 کیلومتر و دو ساعت و بیست دقیقه. جاده سرتاسر آسفالت است و ماشین اقتصادی
    کاملاً کافی است؛ گرمی درست کنار جادهٔ اصلی ایستاده، پس دنبال هیچ مسیر انحرافی نخواهید گشت. سوخت در
    تلاوی و کوارلی موجود است. مسیر جایگزین از راه ساگارجو و گورجاانی هموارتر است، اما تقریباً سی کیلومتر
    بلندتر.
he:
  name: גרמי
  short: המצודה של בירת קחתי האבודה — כנסייה משנת 1565 ומגדל על גבעה מעל עמק אלאזני.
  body: >-
    במאה ה-16 הייתה גרמי בירת ממלכת קחתי: עיר מסחר של כמה אלפי תושבים על אחד מענפי דרך המשי, ובה רבעים
    ארמניים, פרסיים וגאורגיים, בתי מלאכה, חאן ואף ארמון מלכותי. ב-1615 מסע המלחמה של השאה עבאס הראשון
    החריב אותה כליל — התושבים נהרגו או הוגלו לפרס, והבירה הועברה לטלאווי. מה שנותר היום הוא המצודה על
    גבעתה; העיר עצמה שוכנת קבורה מתחת לשדות שלמטה.


    לב המתחם הוא **כנסיית המלאכים הראשיים**, שנבנתה ב-1565 בימי המלך לוואן: כנסיית לבנים מוארכת עם תוף
    גבוה וכיפה, אחת הדוגמאות הברורות ביותר לאדריכלות הקחתית שספגה אל תוכה השפעה פרסית. בפנים נשתמרו קטעים
    נרחבים של ציור קיר מן המאה ה-16, ובהם דיוקנאות התורמים. לצידה ניצב מגדל הפעמונים, ובשלוש קומותיו שוכן
    היום מוזיאון קטן של ממצאים שנחשפו באתר.


    הטיפוס אל המצודה נמשך חמש דקות ומחזיר על ההשקעה נוף רחב על מישור אלאזני, על כרמיו ועל רכס הקווקז שמאחוריו.
    המתחם קומפקטי — שעה מספיקה לו בנוחות — ולכן הוא משתלב באופן טבעי ביום שכולל גם את נקרסי ואת קווארלי.
    החפירות הארכיאולוגיות של העיר התחתית נמשכות עד היום בשדות שלמרגלות הגבעה.
  tip: >-
    שעה מספיקה, כולל המגדל. הכרטיס סמלי ומכסה את המוזיאון שבמגדל; הכניסה לשטח המתחם חינם. אפשר להחנות
    ממש בכניסה, מן הכביש. האור הטוב ביותר הוא בבוקר או לקראת ערב — על הגבעה כמעט אין צל ושעות הצהריים
    בקיץ חמות. בתוך הכנסייה מצופה לבוש צנוע, לכן הימנעו ממכנסיים קצרים ומכתפיים חשופות. יש שירותים בשטח;
    בתי הקפה הקרובים ביותר נמצאים בקווארלי.
  route: >-
    מטביליסי חוצים את מעבר גומבורי אל טלאווי, ואז ממשיכים צפונה-מזרחה לכיוון קווארלי עוד כשלושים קילומטרים
    — בסך הכול כ-125 ק״מ ושעתיים ועשרים דקות. הכביש סלול לכל אורכו ורכב אקונומי מספיק לחלוטין; גרמי עומדת
    ממש בצד הכביש הראשי, כך שאין פנייה שצריך לחפש. דלק זמין בטלאווי ובקווארלי. המסלול החלופי דרך סאגארג'ו
    וגורג'אני שטוח יותר, אך ארוך בכשלושים קילומטרים.
ar:
  name: غريمي
  short: قلعة عاصمة كاخيتي المفقودة — كنيسة من عام 1565 وبرج على تل يطل على وادي ألازاني.
  body: >-
    في القرن السادس عشر كانت غريمي عاصمة مملكة كاخيتي: مدينة تجارية يسكنها بضعة آلاف على أحد فروع طريق
    الحرير، بأحياء أرمنية وفارسية وجورجية، وورش وخان وقصر ملكي. وفي عام 1615 دمرتها حملة الشاه عباس الأول
    تدميراً كاملاً — فقُتل السكان أو رُحّلوا إلى بلاد فارس، وانتقلت العاصمة إلى تيلافي. وما بقي اليوم
    هو القلعة فوق تلها؛ أما المدينة نفسها فترقد تحت الحقول في الأسفل.


    وقلب المجمع هو **كنيسة رؤساء الملائكة**، التي بُنيت عام 1565 في عهد الملك ليفان: كنيسة آجرية ممتدة
    برقبة عالية وقبة، وهي من أوضح أمثلة العمارة الكاخيتية التي استوعبت التأثير الفارسي. وفي الداخل بقيت
    أجزاء كبيرة من التصوير الجداري العائد إلى القرن السادس عشر، ومنها صور الواقفين. ويقوم إلى جانبها برج
    الأجراس، وتضم طوابقه الثلاثة اليوم متحفاً صغيراً للقى الموقع.


    ويستغرق الصعود إلى القلعة خمس دقائق، ويكافئك بإطلالة واسعة على سهل ألازاني وكرومه وسلسلة القوقاز خلفه.
    والمجمع صغير متماسك — تكفيه ساعة براحة — وهذا ما يجعله محطة طبيعية في يوم يشمل أيضاً نيكريسي وكفاريلي.
    ولا تزال أعمال التنقيب الأثري عن المدينة السفلى مستمرة في الحقول عند سفح التل.
  tip: >-
    ساعة واحدة تكفي، بما فيها البرج. التذكرة رمزية وتشمل متحف البرج؛ أما دخول الساحة فمجاني. اركن السيارة
    عند المدخل مباشرة من الطريق. وأفضل ضوء في الصباح أو في أواخر العصر — فلا ظل يُذكر على التل وأوقات
    الظهيرة الصيفية حارة. ويُتوقع اللباس المحتشم داخل الكنيسة، فتجنب السراويل القصيرة والأكتاف المكشوفة.
    توجد دورة مياه في الموقع؛ وأقرب المقاهي في كفاريلي.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي، ثم تابع شمالاً شرقاً نحو كفاريلي ثلاثين كيلومتراً أخرى تقريباً
    — نحو 125 كم وساعتين وعشرين دقيقة إجمالاً. الطريق معبّد طوال المسافة وسيارة اقتصادية كافية تماماً؛
    فغريمي تقع مباشرة إلى جانب الطريق الرئيسي، ولا مُنعطف تبحث عنه. والوقود متوفر في تيلافي وكفاريلي.
    أما المسار البديل عبر ساغاريجو وغورجاني فأكثر استواءً، لكنه أطول بنحو ثلاثين كيلومتراً.
