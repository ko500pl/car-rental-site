ka:
  name: ილია ჭავჭავაძის საგურამოს სახლ-მუზეუმი
  short: >-
    „ერის მამის“ სოფლის სახლი: ხელნაწერები, სურათები, ილიას ნივთები — და წიწამური, სადაც 1907 წელს ის
    მოკლეს, სულ რამდენიმე კილომეტრშია.
  body: >-
    **1907 წლის 12 სექტემბერს (ძველი სტილით 30 აგვისტოს) ილია ჭავჭავაძე საგურამოსკენ მიემართებოდა, როცა
    წიწამურთან შეიარაღებული კაცები დაუხვდნენ. საკუთარ ჭიშკრამდე რამდენიმე კილომეტრის გავლა აღარ დასცალდა.**


    ყვარელში 1837 წელს დაბადებული მწერალი, პუბლიცისტი და გამომცემელი XIX საუკუნის ქართული ეროვნული აღორძინების
    სათავეში იდგა. ის „თერგდალეულთა“ თაობას მეთაურობდა, „საქართველოს მოამბე“ დააარსა, „ივერია“ კი დააარსა
    და წლების განმავლობაში რედაქტორობდა, მოძრაობას კი თავისი სამი სიტყვა აჩუქა: „ენა, მამული, სარწმუნოება“.
    საგურამო მისი სოფლის სახლი იყო — ადგილი, სადაც რედაქციის ხმაური თბილისში რჩებოდა.


    მუზეუმი 1951 წელს გაიხსნა და დღეს 2522 ნივთს ინახავს: ილიას ხელნაწერებს, „ივერიისა“ და „საქართველოს
    მოამბის“ ნომრებს, ევროპულ ფერწერას, XVIII–XIX საუკუნეების ავეჯსა და საოჯახო ნივთებს. თავად სახლიც
    კულტურული მემკვიდრეობის ძეგლია. აქ ძეგლი კი არ გხვდებათ, არამედ ადამიანი: კალმის ნაკვალევი ქაღალდზე,
    სკამები, რომლებზეც ისხდნენ, ოთახები, რომლებშიც ცხოვრობდნენ.


    ერთი დეტალი ისტორიის ნამდვილი ირონიაა: „ივერიისთვის“ ილიამ თავად შეარჩია და დაბეჭდა თბილისის სასულიერო
    სემინარიის ყმაწვილი მოსწავლის, იოსებ ჯუღაშვილის ლექსები — კაცისა, რომელსაც მსოფლიო მოგვიანებით სტალინის
    სახელით გაიცნობს. თავად ილია კი 1987 წელს საქართველოს მართლმადიდებელმა ეკლესიამ წმინდანად შერაცხა
    — წმინდა ილია მართალი.


    აქ წიწამურის გავლით მოდით, ისე, როგორც თვითონ მოდიოდა: ჯერ ადგილი, სადაც მისი გზა შეწყდა, მერე — ჭიშკარი,
    რომელსაც ვეღარ მიაღწია.
  tip: >-
    მუზეუმი ორშაბათის გარდა ყოველდღე ღიაა, 10:00-დან 18:00-მდე; ბილეთი, მუზეუმის ოფიციალური მონაცემებით,
    დიდებისთვის 2 ლარია, მოსწავლეებისა და სტუდენტებისთვის — 1 (წასვლამდე გადაამოწმეთ). სახლისა და ეზოს
    დასათვალიერებლად საათი-საათნახევარი საკმარისია. ჭიშკართან პარკირება უფასოა. მუზეუმთან კაფე არ არის
    — ისადილეთ მცხეთაში, მანქანით ათიოდე წუთში. გზად წიწამურის მემორიალთან გაჩერდით: სახლს მერე სხვა თვალით
    შეხედავთ. სოფლის თავზე, ქედზე, ზედაზნის მონასტერია — დღის ბუნებრივი გაგრძელება.
  route: >-
    თბილისის ცენტრიდან ს1 (E60) გზით მტკვრის აყოლებით მცხეთისკენ გაემართეთ. მცხეთის შემდეგ ს1-დან წიწამურის
    კვანძთან გადაუხვიეთ და შ149 გზით დაახლოებით ოთხი კილომეტრი იარეთ საგურამომდე; სოფლიდან მუზეუმამდე
    მიმთითებლები დგას. ქალაქის ცენტრიდან სულ დაახლოებით 29 კმ და 35 წუთია, მთელ გზაზე ასფალტია, ასე რომ,
    ეკონომკლასის მანქანა ნებისმიერ სეზონში საკმარისია. საწვავი თბილისში ან მცხეთასთან, გზისპირა სადგურებში
    ჩაასხით — სხვა არაფრის დაგეგმვა არ დაგჭირდებათ.
en:
  name: Ilia Chavchavadze Saguramo Museum
  short: >-
    The country house of Georgia's "Father of the Nation": manuscripts, paintings and his belongings,
    a few kilometres from where he was killed in 1907.
  body: >-
    **On 12 September 1907 (30 August, Old Style) Ilia Chavchavadze was on his way home to Saguramo when
    armed men stopped him at Tsitsamuri. He died a few kilometres short of his own gate.**


    Born in Kvareli in 1837, the writer, journalist and publisher stood at the head of Georgia's nineteenth-century
    national revival. He led the generation known as the Tergdaleulebi, founded the journal Sakartvelos
    Moambe, founded and edited the newspaper Iveria, and gave the movement its watchwords: "Language,
    Homeland, Faith". Saguramo was his country house, the place where the noise of the newsroom stayed
    behind in Tbilisi.


    The museum opened in 1951 and today holds 2,522 items: manuscripts in Ilia's hand, issues of Iveria
    and Sakartvelos Moambe, European paintings, eighteenth- and nineteenth-century furniture and household
    things. The house itself is a listed monument. What you meet here is not a statue but a man — the
    drag of a pen across paper, chairs that were sat in, rooms that were lived in.


    One detail is pure historical irony. For Iveria, Ilia personally chose and printed poems by a teenage
    student of the Tbilisi seminary named Ioseb Jughashvili — the world would later know him as Stalin.
    And in 1987 the Georgian Orthodox Church canonised Ilia himself as Saint Ilia the Righteous.


    Come by way of Tsitsamuri, as he did: first the place where the road ended for him, then the gate
    he never reached.
  tip: >-
    Open daily except Monday, 10:00–18:00; tickets are 2 GEL for adults and 1 GEL for pupils and students,
    according to the museum's own listing — worth checking before you go. An hour to an hour and a half
    covers the house and grounds. Parking at the gate is free. There is no café at the museum, so eat
    in Mtskheta, ten minutes' drive away. On the way in, stop at the memorial at Tsitsamuri: you will
    see the house with different eyes. Zedazeni Monastery, on the ridge above the village, makes a natural
    second stop.
  route: >-
    From central Tbilisi take the S1 (E60) along the Mtkvari towards Mtskheta. Just past Mtskheta leave
    the S1 at the Tsitsamuri junction and follow the Sh149 for about four kilometres into Saguramo; the
    museum is signposted from the village. It is around 29 km and 35 minutes from the city centre, asphalt
    all the way, so an economy car is fine in any season. Fill up in Tbilisi or at the roadside stations
    near Mtskheta — nothing more needs planning.
ru:
  name: Музей Ильи Чавчавадзе в Сагурамо
  short: >-
    Загородный дом «отца нации» Грузии: рукописи, картины и личные вещи — в нескольких километрах от места,
    где его убили в 1907 году.
  body: >-
    **12 сентября (30 августа по старому стилю) 1907 года Илья Чавчавадзе возвращался домой, в Сагурамо,
    когда у Цицамури его остановили вооружённые люди. Он погиб в нескольких километрах от собственных
    ворот.**


    Писатель, журналист и издатель, родившийся в Кварели в 1837 году, стоял во главе грузинского национального
    возрождения XIX века. Он возглавил поколение, известное как тергдалеулеби, основал журнал «Сакартвелос
    моамбе», основал и редактировал газету «Иверия» и дал движению его девиз: «Язык, Отечество, Вера».
    Сагурамо было его загородным домом — местом, где редакционный шум оставался позади, в Тбилиси.


    Музей открылся в 1951 году и сегодня хранит 2522 предмета: рукописи, написанные рукой Ильи, номера
    «Иверии» и «Сакартвелос моамбе», европейскую живопись, мебель и предметы быта XVIII–XIX веков. Сам
    дом — охраняемый памятник. Здесь вас встречает не статуя, а человек: нажим пера на бумаге, стулья,
    на которых сидели, комнаты, в которых жили.


    Одна деталь — чистая историческая ирония. Для «Иверии» Илья лично отобрал и напечатал стихи юного
    воспитанника Тбилисской духовной семинарии по имени Иосиф Джугашвили — мир позже узнает его как Сталина.
    А в 1987 году Грузинская православная церковь причислила самого Илью к лику святых как святого Илью
    Праведного.


    Приезжайте через Цицамури, как ехал он: сначала место, где для него оборвалась дорога, потом ворота,
    до которых он так и не доехал.
  tip: >-
    Музей открыт ежедневно, кроме понедельника, с 10:00 до 18:00; билет стоит 2 лари для взрослых и 1
    лари для школьников и студентов — так указано самим музеем, но перед поездкой лучше уточнить. На дом
    и усадьбу хватит часа–полутора. Парковка у ворот бесплатная. Кафе при музее нет, так что обедайте
    в Мцхете, в десяти минутах езды. По дороге остановитесь у мемориала в Цицамури — и вы посмотрите на
    дом другими глазами. Монастырь Зедазени на хребте над селом — естественная вторая остановка.
  route: >-
    Из центра Тбилиси поезжайте по S1 (E60) вдоль Мтквари в сторону Мцхеты. Сразу за Мцхетой съезжайте
    с S1 на развязке Цицамури и около четырёх километров следуйте по Sh149 до Сагурамо; от села к музею
    ведут указатели. Всего около 29 км и 35 минут от центра города, всё время по асфальту, так что машина
    эконом-класса подойдёт в любое время года. Заправиться можно в Тбилиси или на придорожных заправках
    у Мцхеты — больше ничего планировать не нужно.
fa:
  name: موزهٔ ایلیا چاوچاوادزه در ساگورامو
  short: >-
    خانهٔ ییلاقی «پدر ملت» گرجستان: دست‌نوشته‌ها، نقاشی‌ها و وسایل شخصی او، چند کیلومتر دورتر از جایی
    که در ۱۹۰۷ کشته شد.
  body: >-
    **در ۱۲ سپتامبر ۱۹۰۷ (۳۰ اوت به تقویم قدیم)، ایلیا چاوچاوادزه در راه بازگشت به خانه‌اش در ساگورامو
    بود که مردانی مسلح در تسیتساموری راهش را بستند. او چند کیلومتر مانده به دروازهٔ خانه‌اش جان باخت.**


    این نویسنده، روزنامه‌نگار و ناشر، که در ۱۸۳۷ در کوارلی زاده شد، در رأس نوزایی ملی گرجستان در سدهٔ
    نوزدهم ایستاده بود. رهبری نسلی را بر عهده داشت که به «ترگدالئولبی» شهره‌اند، مجلهٔ «ساکارتولوس موآمبه»
    را بنیاد نهاد، روزنامهٔ «ایوریا» را بنیاد گذاشت و سردبیرش شد، و شعار جنبش را به آن بخشید: «زبان، میهن،
    ایمان». ساگورامو خانهٔ ییلاقی او بود، جایی که هیاهوی تحریریه در تفلیس جا می‌ماند.


    موزه در ۱۹۵۱ گشایش یافت و امروز ۲۵۲۲ شیء را نگه می‌دارد: دست‌نوشته‌هایی به خط ایلیا، شماره‌هایی از
    «ایوریا» و «ساکارتولوس موآمبه»، نقاشی‌های اروپایی، و مبلمان و وسایل خانگی سده‌های هجدهم و نوزدهم.
    خودِ خانه اثری ثبت‌شده در فهرست میراث است. آنچه اینجا با آن روبه‌رو می‌شوید تندیس نیست، انسان است:
    ردّ قلمی که بر کاغذ کشیده شده، صندلی‌هایی که بر آن‌ها نشسته‌اند، اتاق‌هایی که در آن‌ها زیسته‌اند.


    یک نکته طنزی ناب از تاریخ است. ایلیا برای «ایوریا» شخصاً شعرهای شاگردی نوجوان از مدرسهٔ الهیات تفلیس
    به نام یوسب جوغاشویلی را برگزید و چاپ کرد؛ کسی که جهان بعدها او را با نام استالین شناخت. و در ۱۹۸۷
    کلیسای ارتدوکس گرجستان خودِ ایلیا را با عنوان «ایلیای قدیس درستکار» در شمار قدیسان آورد.


    از راه تسیتساموری بیایید، همان‌گونه که او آمد: نخست جایی که راه برای او به پایان رسید، سپس دروازه‌ای
    که هرگز به آن نرسید.
  tip: >-
    هر روز جز دوشنبه، از ۱۰:۰۰ تا ۱۸:۰۰ باز است؛ بلیت بزرگسالان ۲ لاری و دانش‌آموزان و دانشجویان ۱ لاری
    است، طبق آنچه خود موزه اعلام کرده، ولی بهتر است پیش از رفتن دوباره بررسی کنید. یک تا یک ساعت و نیم
    برای دیدن خانه و محوطه بس است. پارکینگ کنار دروازه رایگان است. موزه کافه ندارد، پس در متسختا، ده دقیقه
    رانندگی دورتر، غذا بخورید. سر راه در یادمان تسیتساموری توقف کنید: خانه را با چشم دیگری خواهید دید.
    صومعهٔ زِدازِنی، بر ستیغ بالای روستا، ایستگاه دوم طبیعی شماست.
  route: >-
    از مرکز تفلیس جادهٔ S1 (E60) را در امتداد رود مْتکواری به سوی متسختا بگیرید. کمی پس از متسختا، در
    تقاطع تسیتساموری از S1 بیرون بروید و حدود چهار کیلومتر جادهٔ Sh149 را تا ساگورامو دنبال کنید؛ در روستا
    تابلوهای راهنما شما را به موزه می‌رسانند. فاصله حدود ۲۹ کیلومتر و ۳۵ دقیقه از مرکز شهر است، سراسر
    آسفالت، پس خودروی کلاس اکونومی در هر فصلی کافی است. در تفلیس یا در پمپ‌بنزین‌های کنار جاده نزدیک متسختا
    سوخت بزنید؛ چیز دیگری برنامه‌ریزی نمی‌خواهد.
he:
  name: מוזיאון איליה צ'בצ'בדזה בסגוראמו
  short: 'בית הכפר של "אבי האומה" הגאורגית: כתבי יד, ציורים וחפציו האישיים, קילומטרים ספורים מהמקום שבו
    נרצח ב־1907.'
  body: >-
    **ב־12 בספטמבר 1907 (30 באוגוסט לפי הלוח היוליאני) היה איליה צ'בצ'בדזה בדרכו הביתה לסגוראמו, כשאנשים
    חמושים עצרו אותו בציצאמורי. הוא מת קילומטרים ספורים לפני שער ביתו.**


    הסופר, העיתונאי והמו"ל, שנולד בקווארלי ב־1837, עמד בראש התחייה הלאומית הגאורגית במאה ה־19. הוא הנהיג
    את הדור שנודע בשם "טרגדלאולבי", ייסד את כתב העת "סקרתוולוס מואמבה", ייסד וערך את העיתון "איווריה",
    ונתן לתנועה את סיסמתה: "שפה, מולדת, אמונה". סגוראמו הייתה בית הכפר שלו, המקום שבו רעש המערכת נשאר
    מאחור, בטביליסי.


    המוזיאון נפתח ב־1951 ומחזיק כיום 2,522 פריטים: כתבי יד בכתב ידו של איליה, גיליונות של "איווריה" ושל
    "סקרתוולוס מואמבה", ציורים אירופיים, רהיטים וחפצי בית מהמאות ה־18 וה־19. הבית עצמו הוא אתר מורשת מוכרז.
    מה שפוגשים כאן אינו פסל אלא אדם: משיכת העט על הנייר, כיסאות שישבו עליהם, חדרים שחיו בהם.


    פרט אחד הוא אירוניה היסטורית צרופה. ל"איווריה" בחר איליה בעצמו והדפיס שירים של תלמיד מתבגר בסמינר
    התאולוגי של טביליסי בשם יוסב ג'וגשווילי – העולם יכיר אותו מאוחר יותר בשם סטלין. וב־1987 הכריזה הכנסייה
    האורתודוקסית הגאורגית על איליה עצמו כקדוש: איליה הקדוש הצדיק.


    בואו דרך ציצאמורי, כפי שהוא בא: קודם המקום שבו נגמרה לו הדרך, ואחר כך השער שלא הגיע אליו מעולם.
  tip: >-
    פתוח מדי יום מלבד שני, 10:00–18:00; כרטיס עולה 2 לארי למבוגרים ו־1 לארי לתלמידים ולסטודנטים, לפי הרישום
    של המוזיאון עצמו – כדאי לבדוק לפני שיוצאים. שעה עד שעה וחצי מספיקות לבית ולשטח שסביבו. החניה בשער
    חינם. במוזיאון אין בית קפה, אז אכלו במצחתה, עשר דקות נסיעה משם. בדרך עצרו באנדרטה בציצאמורי: תראו
    את הבית בעיניים אחרות. מנזר זדאזני, על הרכס שמעל הכפר, הוא התחנה השנייה הטבעית.
  route: >-
    ממרכז טביליסי סעו בכביש S1 (E60) לאורך נהר המטקוורי לכיוון מצחתה. ממש אחרי מצחתה צאו מכביש S1 במחלף
    ציצאמורי ועקבו אחר כביש Sh149 כארבעה קילומטרים עד סגוראמו; מהכפר יש שילוט למוזיאון. בסך הכול כ־29
    ק"מ ו־35 דקות ממרכז העיר, אספלט לכל אורך הדרך, כך שרכב מקטגוריית אקונומי מתאים בכל עונה. תדלקו בטביליסי
    או בתחנות שלצד הדרך ליד מצחתה – שום דבר אחר לא דורש תכנון.
ar:
  name: متحف إيليا تشافتشافادزه في ساغورامو
  short: >-
    البيت الريفي لـ«أبي الأمة» الجورجية: مخطوطات ولوحات ومقتنياته الشخصية، على بعد كيلومترات قليلة من
    المكان الذي قُتل فيه عام 1907.
  body: >-
    **في 12 سبتمبر 1907 (30 أغسطس بالتقويم اليولياني) كان إيليا تشافتشافادزه في طريقه إلى بيته في ساغورامو
    حين أوقفه رجال مسلحون عند تسيتساموري. ومات على بعد كيلومترات قليلة من بوابة داره.**


    وُلد الكاتب والصحفي والناشر في كفاريلي عام 1837، ووقف على رأس النهضة القومية الجورجية في القرن التاسع
    عشر. قاد الجيل المعروف باسم «تيرغداليوليبي»، وأسس مجلة «ساكارتفيلوس موامبي»، وأسس صحيفة «إيفيريا»
    وتولى تحريرها، ومنح الحركة شعارها: «اللغة، الوطن، الإيمان». كانت ساغورامو بيته الريفي، المكان الذي
    كان يُخلّف فيه ضجيج غرفة التحرير وراءه في تبليسي.


    افتُتح المتحف عام 1951 ويضم اليوم 2522 قطعة: مخطوطات بخط يد إيليا، وأعداداً من «إيفيريا» و«ساكارتفيلوس
    موامبي»، ولوحات أوروبية، وأثاثاً وأدوات منزلية من القرنين الثامن عشر والتاسع عشر. والبيت نفسه معلم
    تراثي مسجَّل. ما تلقاه هنا ليس تمثالاً بل إنساناً: أثر القلم وهو ينسحب على الورق، وكراسيّ جُلس عليها،
    وغرفاً عيش فيها.


    ثمة تفصيل هو مفارقة تاريخية خالصة. فقد اختار إيليا بنفسه لـ«إيفيريا» قصائد طالب مراهق في المعهد اللاهوتي
    في تبليسي يُدعى يوسب جوغاشفيلي، ونشرها؛ وسيعرفه العالم لاحقاً باسم ستالين. وفي عام 1987 أعلنت الكنيسة
    الأرثوذكسية الجورجية إيليا نفسه قديساً باسم القديس إيليا البار.


    تعالَ عن طريق تسيتساموري كما جاء هو: أولاً المكان الذي انتهى عنده طريقه، ثم البوابة التي لم يبلغها
    قط.
  tip: >-
    يفتح المتحف يومياً ما عدا الاثنين، من 10:00 إلى 18:00؛ والتذكرة بـ2 لاري للبالغين و1 لاري للتلاميذ
    والطلاب، بحسب ما يعلنه المتحف نفسه، ويُستحسن التحقق قبل الذهاب. تكفي ساعة إلى ساعة ونصف للبيت والأرض
    المحيطة به. الموقف عند البوابة مجاني. لا مقهى في المتحف، فتناول طعامك في متسخيتا على بعد عشر دقائق
    بالسيارة. وفي طريقك توقف عند النصب التذكاري في تسيتساموري: سترى البيت بعين أخرى. أما دير زيدازيني
    على الحافة الجبلية فوق القرية فمحطة ثانية طبيعية.
  route: >-
    من وسط تبليسي اسلك الطريق S1 (E60) بمحاذاة نهر متكفاري باتجاه متسخيتا. وبعد متسخيتا مباشرة غادر الطريق
    S1 عند تقاطع تسيتساموري واتبع الطريق Sh149 نحو أربعة كيلومترات حتى ساغورامو؛ وفي القرية لافتات ترشدك
    إلى المتحف. المسافة نحو 29 كم و35 دقيقة من وسط المدينة، على الإسفلت طوال الطريق، فالسيارة الاقتصادية
    تكفي في كل الفصول. تزوّد بالوقود في تبليسي أو في محطات الطريق قرب متسخيتا، ولا شيء آخر يحتاج إلى تخطيط.
