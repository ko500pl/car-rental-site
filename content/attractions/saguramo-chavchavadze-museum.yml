ka:
  name: ილია ჭავჭავაძის საგურამოს სახლ-მუზეუმი
  short: >-
    ერის მამის მამული საგურამოში — თერთმეტოთახიანი სახლი, ბაღი და მარანი, სადაც ილიამ სიცოცხლის ბოლო წლები
    გაატარა.
  body: >-
    **საგურამო ის ადგილია, სადაც ილია ჭავჭავაძე უბრალოდ ადამიანი იყო** — მეურნე, მასპინძელი და მებაღე,
    და არა მხოლოდ სახელმძღვანელოს პორტრეტი. მწერალმა, პუბლიცისტმა და ეროვნული მოძრაობის ლიდერმა (1837-1907)
    სიცოცხლის ბოლო წლები სწორედ ამ მამულში გაატარა, სანამ 1907 წელს, აქვე, წიწამურის მინდორთან არ მოკლეს.


    მუზეუმი 1951 წელს გაიხსნა და დღეს 2500-ზე მეტ ექსპონატს ინახავს. თერთმეტოთახიან სახლში ნახავ:


    - **ილიას ხელნაწერებსა და „ივერიის" ნომრებს** — გაზეთისა, რომელსაც თავად რედაქტორობდა

    - **პირად ნივთებსა და XVIII-XIX საუკუნეების ავეჯს** — სახლი ცოცხალ გარემოდაა შენარჩუნებული

    - **ევროპული და ქართული მხატვრობის ნიმუშებს**

    - ბაღს, სადაც ილიას დარგული ხეები დღემდე დგას, და მარანს


    ბაღი ცალკე ამბავია: აქ ილია ყოველ 2 აგვისტოს, თავის სახელობის დღეს, თბილისელ ინტელიგენციას მასპინძლობდა,
    და ეს ტრადიცია მუზეუმს დღემდე შემორჩა — ზაფხულის ბოლოს აქ ლიტერატურული საღამოები იმართება. მცხეთასთან
    სიახლოვის გამო მუზეუმი იდეალურად ჯდება ერთდღიან მარშრუტში ჯვართან და სვეტიცხოველთან ერთად.
  tip: >-
    მუზეუმი ორშაბათის გარდა ყოველდღე მუშაობს, 10:00-18:00. ბილეთი 2 ლარია, სტუდენტებისთვის — 1; ექსკურსია
    ღირს და ცოტათი ძვირია, მაგრამ ქართულად მდიდარ კონტექსტს იძლევა. დათვალიერებას საათ-ნახევარი ეყოფა
    ბაღითურთ. პარკინგი ეზოსთან უფასოა. იქვე, ტყის პირას, წიწამურის მემორიალიც ნახე — ილიას მკვლელობის
    ადგილი. სოფელში კარგი საოჯახო რესტორნებია.
  route: >-
    თბილისიდან მცხეთის მიმართულებით სამხედრო გზას (E117) დაადექი და ნატახტართან საგურამოსკენ გადაუხვიე
    — ჯამში 25 კმ და დაახლოებით 35 წუთი. გზა ბოლომდე ასფალტირებულია და მშვენიერ მდგომარეობაშია; მუზეუმამდე
    სოფლის ვიწრო, მაგრამ მოასფალტებული ქუჩა მიდის, მითითებლები დგას. საწვავი ნატახტარში ან თბილისის გასასვლელთან
    აიღე. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისზე მეტია. მარშრუტი იდეალურად უკავშირდება
    მცხეთასა და ზედაზენს.
en:
  name: Ilia Chavchavadze Saguramo Museum
  short: >-
    The estate of Georgia's "Father of the Nation" — an eleven-room house, garden and wine cellar where
    Ilia Chavchavadze spent his last years.
  body: >-
    **Saguramo is where Ilia Chavchavadze was simply a man** — a farmer, a host and a gardener, not just
    a portrait in a textbook. The writer, publisher and leader of the national movement (1837–1907) spent
    his final years on this estate, until he was assassinated in 1907 at the Tsitsamuri field just nearby.


    The museum opened in 1951 and now holds more than 2,500 items. Inside the eleven-room mansion you
    find:


    - **Ilia's manuscripts and issues of "Iveria"**, the newspaper he edited himself

    - **Personal belongings and 18th–19th-century furniture** — the house is kept as a lived-in home

    - **European and Georgian paintings** from his collection

    - The garden, where trees planted by Ilia himself still stand, and the wine cellar


    The garden is a story of its own: every 2 August, on his name day, Ilia hosted the Tbilisi intelligentsia
    here, and the museum keeps the tradition alive with literary evenings in late summer. Being minutes
    from Mtskheta, the museum slots perfectly into a day loop with Jvari Monastery and Svetitskhoveli.
  tip: >-
    Open daily except Monday, 10:00–18:00. Tickets cost 2 GEL, students 1 GEL; the guided tour costs extra
    and is worth it for the context, though mostly in Georgian. An hour and a half covers house and garden.
    Parking by the gate is free. Combine it with the Tsitsamuri memorial at the forest edge nearby — the
    site of Ilia's assassination. The village has good family-run restaurants.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117) towards Mtskheta and turn off for Saguramo
    at Natakhtari — 25 km and about 35 minutes in total. The road is asphalt the whole way and in fine
    condition; a narrow but paved village street leads to the museum, with signposts along the way. Fuel
    up at Natakhtari or on the way out of Tbilisi. An economy car is more than enough all year round.
    The route pairs naturally with Mtskheta and Zedazeni Monastery.
ru:
  name: Дом-музей Ильи Чавчавадзе в Сагурамо
  short: >-
    Усадьба «отца нации» в Сагурамо — дом из одиннадцати комнат, сад и марани, где Илья Чавчавадзе провёл
    последние годы жизни.
  body: >-
    **Сагурамо — то место, где Илья Чавчавадзе был просто человеком** — хозяином, садовником и гостеприимцем,
    а не только портретом из учебника. Писатель, издатель и лидер национального движения (1837-1907) провёл
    в этой усадьбе последние годы жизни, пока в 1907 году не был убит неподалёку, у поля Цицамури.


    Музей открылся в 1951 году и хранит сегодня более 2500 экспонатов. В особняке из одиннадцати комнат
    вы увидите:


    - **Рукописи Ильи и номера газеты «Иверия»**, которую он сам редактировал

    - **Личные вещи и мебель XVIII-XIX веков** — дом сохранён как жилое пространство

    - **Европейскую и грузинскую живопись** из его собрания

    - Сад, где до сих пор стоят посаженные Ильёй деревья, и винный погреб-марани


    Сад — отдельная история: каждое 2 августа, в свои именины, Илья принимал здесь тбилисскую интеллигенцию,
    и музей поддерживает традицию литературными вечерами в конце лета. До Мцхеты отсюда считанные минуты,
    так что музей идеально встраивается в дневной маршрут с Джвари и Светицховели.
  tip: >-
    Открыто ежедневно, кроме понедельника, с 10:00 до 18:00. Билет 2 лари, студентам 1; экскурсия за отдельную
    плату и стоит того, но в основном на грузинском. Полутора часов хватит на дом и сад. Парковка у ворот
    бесплатная. Совместите с мемориалом Цицамури на опушке леса рядом — местом убийства Ильи. В селе хорошие
    семейные рестораны.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге (E117) в сторону Мцхеты, у Натахтари — поворот на Сагурамо;
    всего 25 км и около 35 минут. Дорога асфальтированная и в отличном состоянии; к музею ведёт узкая,
    но мощёная сельская улица, указатели есть. Заправляйтесь в Натахтари или на выезде из Тбилиси. Машины
    эконом-класса более чем достаточно круглый год. Маршрут естественно сочетается с Мцхетой и монастырём
    Зедазени.
fa:
  name: خانه‌موزهٔ ایلیا چاوچاوادزه در ساگورامو
  short: >-
    املاک «پدر ملت» گرجستان — خانه‌ای یازده‌اتاقه با باغ و شراب‌خانه، جایی که ایلیا چاوچاوادزه واپسین
    سال‌هایش را گذراند.
  body: >-
    **ساگورامو جایی است که ایلیا چاوچاوادزه صرفاً یک انسان بود** — کشاورز، میزبان و باغبان، نه فقط چهره‌ای
    در کتاب درسی. این نویسنده، روزنامه‌نگار و رهبر جنبش ملی (1837–1907) واپسین سال‌های زندگی را در همین
    ملک گذراند، تا آنکه در 1907 در همین نزدیکی، کنار دشت تسیتسا‌موری، ترور شد.


    موزه در 1951 گشوده شد و امروز بیش از 2500 شیء را نگه می‌دارد. در عمارت یازده‌اتاقه می‌بینید:


    - **دست‌نوشته‌های ایلیا و شماره‌های «ایوریا»** — روزنامه‌ای که خود سردبیرش بود

    - **اشیای شخصی و مبلمان سده‌های هجدهم و نوزدهم** — خانه به‌صورت فضایی زیسته حفظ شده است

    - **نقاشی‌های اروپایی و گرجی** از مجموعهٔ او

    - باغ، که درختانِ کاشتهٔ خود ایلیا هنوز در آن ایستاده‌اند، و شراب‌خانه


    باغ خود حکایتی جداست: ایلیا هر دوم اوت، در روز نام‌گذاری‌اش، روشنفکران تفلیس را همین‌جا مهمان می‌کرد
    و موزه این سنت را با شب‌های ادبی اواخر تابستان زنده نگه داشته است. با چند دقیقه فاصله تا متسختا، موزه
    به‌خوبی در گشت یک‌روزهٔ جواری و سوتیتسخوولی جا می‌گیرد.
  tip: >-
    موزه هر روز جز دوشنبه باز است، 10:00 تا 18:00. بلیت 2 لاری و دانشجویی 1 لاری است؛ تور راهنما هزینهٔ
    جدا دارد و برای درک بستر می‌ارزد، هرچند بیشتر به زبان گرجی است. یک ساعت و نیم برای خانه و باغ بس است.
    پارکینگ کنار در رایگان است. آن را با یادمان تسیتسا‌موری در حاشیهٔ جنگل — محل ترور ایلیا — همراه کنید.
    روستا رستوران‌های خانوادگی خوبی دارد.
  route: >-
    از تفلیس با بزرگراه نظامی گرجستان (E117) به سوی متسختا بروید و در ناتاختاری به سمت ساگورامو بپیچید
    — روی هم 25 کیلومتر و حدود 35 دقیقه. جاده سراسر آسفالت و در وضعیت عالی است؛ خیابانی روستایی باریک
    اما آسفالته با تابلوهای راهنما به موزه می‌رسد. سوخت را در ناتاختاری یا خروجی تفلیس بزنید. خودروی اقتصادی
    در تمام سال بیش از کافی است. این مسیر به‌طور طبیعی با متسختا و صومعهٔ زدازنی جفت می‌شود.
he:
  name: מוזיאון איליה צ'בצ'בדזה בסגוראמו
  short: >-
    אחוזתו של "אבי האומה" הגאורגי — בית של אחת-עשרה חדרים, גן ומרתף יין, שבו בילה איליה צ'בצ'בדזה את שנותיו
    האחרונות.
  body: >-
    **סגוראמו הוא המקום שבו איליה צ'בצ'בדזה היה פשוט אדם** — חקלאי, מארח וגנן, ולא רק דיוקן בספר לימוד.
    הסופר, המו"ל ומנהיג התנועה הלאומית (1837–1907) בילה באחוזה הזאת את שנותיו האחרונות, עד שנרצח ב-1907
    ליד שדה ציצאמורי הסמוך.


    המוזיאון נפתח ב-1951 ומחזיק כיום יותר מ-2,500 פריטים. בבית בן אחת-עשרה החדרים תמצאו:


    - **כתבי היד של איליה וגיליונות "איווריה"**, העיתון שערך בעצמו

    - **חפצים אישיים ורהיטים מהמאות ה-18-19** — הבית נשמר כבית מגורים חי

    - **ציורים אירופיים וגאורגיים** מאוספו

    - את הגן, שבו עומדים עד היום עצים שנטע איליה במו ידיו, ואת מרתף היין


    הגן הוא סיפור בפני עצמו: בכל 2 באוגוסט, ביום שמו, אירח כאן איליה את האינטליגנציה של טביליסי, והמוזיאון
    ממשיך את המסורת בערבי ספרות בסוף הקיץ. בזכות הקרבה למצחתה, המוזיאון משתלב מושלם ביום סיור אחד עם מנזר
    ג'ווארי וסבטיצחובלי.
  tip: >-
    פתוח כל יום מלבד שני, 10:00–18:00. כרטיס 2 לארי, לסטודנטים 1; סיור מודרך בתשלום נוסף ושווה בזכות ההקשר,
    אם כי בעיקר בגאורגית. שעה וחצי מספיקה לבית ולגן. חניה ליד השער חינם. שלבו עם אנדרטת ציצאמורי בשולי
    היער הסמוך — מקום הרצח של איליה. בכפר מסעדות משפחתיות טובות.
  route: >-
    מטביליסי בכביש הצבא הגאורגי (E117) לכיוון מצחתה, ובנטאחטארי פנייה לסגוראמו — 25 ק"מ וכ-35 דקות בסך
    הכול. הכביש סלול לכל אורכו ובמצב מצוין; אל המוזיאון מוביל רחוב כפרי צר אך סלול, עם שילוט בדרך. תדלקו
    בנטאחטארי או ביציאה מטביליסי. רכב חסכוני מספיק ויותר כל השנה. המסלול משתלב באופן טבעי עם מצחתה ומנזר
    זדזני.
ar:
  name: متحف إيليا تشافتشافادزه في ساغورامو
  short: ضيعة «أبي الأمة» الجورجي — بيت من أحد عشر غرفة وحديقة وقبو نبيذ، حيث أمضى إيليا تشافتشافادزه
    سنواته الأخيرة.
  body: >-
    **ساغورامو هي المكان الذي كان فيه إيليا تشافتشافادزه إنساناً بسيطاً** — مزارعاً ومضيفاً وبستانياً،
    لا مجرد صورة في كتاب مدرسي. أمضى الكاتب والناشر وقائد الحركة الوطنية (1837–1907) سنواته الأخيرة في
    هذه الضيعة، إلى أن اغتيل عام 1907 قرب حقل تسيتساموري المجاور.


    افتُتح المتحف عام 1951 ويضم اليوم أكثر من 2500 قطعة. في القصر ذي الغرف الإحدى عشرة ترى:


    - **مخطوطات إيليا وأعداد صحيفة «إيفيريا»** التي كان يحررها بنفسه

    - **مقتنيات شخصية وأثاثاً من القرنين الثامن عشر والتاسع عشر** — فالبيت محفوظ كمسكن حي

    - **لوحات أوروبية وجورجية** من مجموعته

    - الحديقة التي ما زالت تقف فيها أشجار غرسها إيليا بيده، وقبو النبيذ


    وللحديقة حكايتها الخاصة: ففي الثاني من أغسطس من كل عام، يوم عيد اسمه، كان إيليا يستضيف هنا مثقفي تبليسي،
    وما زال المتحف يحيي التقليد بأمسيات أدبية في أواخر الصيف. ولقربه من متسخيتا، يندرج المتحف تماماً في
    جولة يوم واحد مع دير جفاري وكاتدرائية سفيتيتسخوفيلي.
  tip: >-
    مفتوح يومياً عدا الاثنين، من 10:00 إلى 18:00. التذكرة 2 لاري وللطلاب 1 لاري؛ الجولة المصحوبة بمرشد
    برسوم إضافية وتستحق لسياقها، وإن كانت غالباً بالجورجية. ساعة ونصف تكفي للبيت والحديقة. الوقوف عند
    البوابة مجاني. اجمعها مع نصب تسيتساموري عند طرف الغابة القريب — موضع اغتيال إيليا. وفي القرية مطاعم
    عائلية جيدة.
  route: >-
    من تبليسي على الطريق العسكري الجورجي (E117) باتجاه متسخيتا، ثم انعطف نحو ساغورامو عند ناتاختاري —
    25 كم ونحو 35 دقيقة إجمالاً. الطريق معبّد بالكامل وبحالة ممتازة؛ ويقود إلى المتحف شارع قروي ضيق لكنه
    معبّد، مع لافتات على الطريق. تزوّد بالوقود في ناتاختاري أو عند مخرج تبليسي. سيارة اقتصادية أكثر من
    كافية طوال السنة. ويقترن المسار طبيعياً بمتسخيتا ودير زيدازيني.
