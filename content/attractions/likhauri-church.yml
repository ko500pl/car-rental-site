ka:
  name: ლიხაურის ღვთისმშობლის ეკლესია
  short: >-
    მოჩუქურთმებული ქვის დარბაზული ეკლესია სოფლის ბორცვზე, ოზურგეთის სამხრეთით — 1422 წლის სამრეკლოთი და
    ორ კილომეტრში სამკოშკიანი ციხით.
  body: >-
    **ლიხაურის ეკლესიას თითქმის ყველაფერი წაართვეს, რისი წაღებაც შეიძლებოდა, — და მაინც გურიის ერთ-ერთი
    ყველაზე მეტყველი ქვაა.**


    ღვთისმშობლის ეკლესია სოფლის შუაგულში, შემაღლებულ ბორცვზე დგას, სასაფლაოთი გარშემორტყმული, ოზურგეთიდან
    სამხრეთით ხუთიოდე კილომეტრში. ეს უგუმბათო დარბაზია, ბაცი ნაცრისფერი თლილი ქვით ნაშენი, აღმოსავლეთით
    გამოზიდული ხუთწახნაგა აფსიდით. ექვთიმე თაყაიშვილი და დიმიტრი ბაქრაძე მას ერთ-ერთი ხატის წარწერის მიხედვით
    1352 წლით, კახაბერ გურიელის ხანით ათარიღებდნენ; ხელოვნებათმცოდნეები უფრო ადრეულად, XIII საუკუნის მეორე
    ნახევრით მიიჩნევენ. სამხრეთის ფასადი მოგვიანებით ქვითა და აგურით აღუდგენიათ და მისი სარკმლები ჯუმათის
    სარკმლების ტყუპისცალია — ეტყობა, ორივე ეკლესია ერთსა და იმავე ოსტატს განუახლებია.


    დააკვირდით:

    - აფსიდის სამ თაღოვან **სარკმელს**, თითოეულს ჩუქურთმიანი საპირით

    - **დასავლეთის კარიბჭის** შეწყვილებულ თაღს — მოგვიანო მინაშენს

    - ორსართულიან **სამრეკლოს**: დასავლეთ ფასადის ასომთავრული წარწერა მას 1422 წლით ათარიღებს და სოფლის
    ძველ სახელს, რეხოელს გვიმხელს; კედლიდან ქვაში გამოკვეთილი ვერძის თავი იყურება


    განძი აქედან სათითაოდ წავიდა. 1924 წელს კომუნისტებმა ტაძარი ძვირფასეულობისგან გაძარცვეს; იმავე წელს
    აკაკი შანიძემ და შალვა ამირანაშვილმა XI საუკუნის ლიხაურის სახარება თბილისში წაიღეს — დღეს ის ხელნაწერთა
    ეროვნულ ცენტრშია დაცული; 1890 წელს ხელნაწერი ხელახლა შეაკაზმინა ტაძრის უკანასკნელმა წინამძღვარმა,
    ნესტორ კონტრიძემ. XV–XVI საუკუნეების მოხატულობა, რომელშიც ოთხი ერისკაცის პორტრეტიც იყო, 1990-იანი
    წლების დასაწყისში „განახლების“ საბაბით ჩამოფხიკეს. ადგილზე მხოლოდ ორი სცენა გადარჩა — გარდამოხსნა
    და საფლავის გახსნა; დაზიანებული ნარჩენები თბილისის სამხატვრო აკადემიაში ინახება.


    ორი კილომეტრის იქით, ჭანიეთის საზღვარზე, ლიხაურის ციხის ნანგრევებია — ხალხი მას თამარის ციხესაც უწოდებს.
    მის გალავანში სამი კოშკია ჩართული, ციხესთან კი ათასი ოსმალური ვერცხლის მონეტა აღმოაჩინეს. ეკლესიამ
    ქვა შეინარჩუნა; დანარჩენი კედლებზე წარმოსახვით უნდა დააბრუნოთ.
  tip: >-
    ერთი საათი, ციხესთან ერთად — ორი. ეკლესია ხშირად დაკეტილია; გასაღები სოფელშია და მეზობლები მიგასწავლიან.
    მხრები და მუხლები დაფარული უნდა იყოს, ქალებს თავსაფარი დასჭირდებათ. ეკლესიის ეზო მოქმედი სასაფლაოა
    — საფლავებს შორის წყნარად იარეთ. ციხისკენ ბილიკი ადგილობრივებს ჰკითხეთ: მარკირება არ აქვს, ზაფხულში
    ბალახით იფარება, ჭინჭარი და ტკიპა ბევრია, ამიტომ დახურული ფეხსაცმელი და გრძელი შარვალი აუცილებელია.
    ტუალეტი და კაფე აქ არ არის — ორივე ათი წუთის სავალზე, ოზურგეთშია. შუადღის შემდეგ მზე დასავლეთ ფასადს
    თბილ ფერს სძენს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთით
    ლანჩხუთამდე და იქიდან ჯაპანის გავლით ოზურგეთამდე. ქალაქი გაიარეთ და სოფლის გზით კიდევ ხუთიოდე კილომეტრი
    სამხრეთისკენ იარეთ ლიხაურამდე — 306 კმ, დაახლოებით ოთხი საათი და ორმოცდახუთი წუთი. ასფალტი სოფლამდე
    გრძელდება, იქ კი გზა ვიწროვდება და ორმოები იწყება; ეკლესიამდე ბოლო მოკლე აღმართი ციცაბოა და წვიმის
    შემდეგ სრიალებს. საწვავი ლანჩხუთსა და ოზურგეთშია. მშრალ ამინდში ეკონომ-კლასის მანქანა გაართმევს თავს;
    ძლიერი წვიმის შემდეგ მანქანა ბორცვის ძირში დატოვეთ და ფეხით აიარეთ.
en:
  name: Likhauri Church of the Virgin
  short: >-
    A carved stone hall church on a village hilltop south of Ozurgeti, with a bell tower dated 1422 and
    a three-towered fortress two kilometres away.
  body: >-
    **Likhauri's church has lost almost everything that could be carried away, and it is still one of
    the most eloquent stones in Guria.**


    The Church of the Virgin crowns a rise in the village centre, ringed by graves, about five kilometres
    south of Ozurgeti. It is a domeless hall of pale grey dressed stone, with a five-sided apse pushed
    out to the east. Ekvtime Takaishvili and Dimitri Bakradze dated it to 1352, the time of Kakhaber Gurieli,
    from an icon inscription; art historians place it earlier, in the second half of the 13th century.
    The south façade, patched later with stone and brick, has windows identical to those at Jumati — probably
    the same restorer's hand.


    Look closely at:

    - the three arched **apse windows**, each framed in carved ornament

    - the paired arch of the **west porch**, a later addition

    - the two-storey **bell tower**, whose west-facing inscription dates it to 1422 and gives the village's
    old name, Rekhoeli; a carved ram's head looks out from its wall


    The treasures left one by one. In 1924 communists stripped the church of its valuables, and that year
    Akaki Shanidze and Shalva Amiranashvili took its 11th-century Gospel to Tbilisi, now in the National
    Centre of Manuscripts; the last parish priest, Nestor Kontridze, had rebound it in 1890. The 15th–16th-century
    frescoes, with portraits of four noblemen, were scraped off in the early 1990s "for renewal". Only
    the Deposition and the Opening of the Tomb remain; the damaged fragments are at the Tbilisi Academy
    of Arts.


    Two kilometres away, on the Chanieti boundary, the ruined Likhauri Fortress — locally Tamar's Fortress
    — still sets three towers into its walls, and a thousand Ottoman silver coins were found beside it.
    The church kept its stone; the rest you must imagine back onto the walls.
  tip: >-
    Allow an hour, two with the fortress. The church is often locked; the key is kept in the village and
    neighbours will point you to it. Cover shoulders and knees; women will want a headscarf. The churchyard
    is a working cemetery, so move quietly among the graves. For the fortress, ask locals for the path:
    it is unmarked, overgrown in summer and thick with nettles and ticks, so wear closed shoes and long
    trousers. No toilets or café here; Ozurgeti, ten minutes away, has both. Late-afternoon sun warms
    the west front.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia and the S12 south to Lanchkhuti, then
    the road through Japana to Ozurgeti. Cross the town and continue about five kilometres south on the
    village road to Likhauri — 306 km, about four hours forty-five. It is asphalt as far as the village,
    where the lane narrows and the potholes begin; the last short climb to the church is steep and slippery
    after rain. Fuel in Lanchkhuti and Ozurgeti. An economy car copes in dry weather; after heavy rain,
    park at the foot of the hill and walk up.
ru:
  name: Церковь Богородицы в Лихаури
  short: >-
    Резная каменная зальная церковь на вершине холма южнее Озургети, с колокольней 1422 года и трёхбашенной
    крепостью в двух километрах.
  body: >-
    **Церковь в Лихаури утратила почти всё, что можно было унести, и всё же остаётся одним из самых красноречивых
    камней Гурии.**


    Церковь Богородицы венчает возвышенность в центре деревни, окружённую могилами, в пяти километрах
    южнее Озургети. Это бескупольный зальный храм из светло-серого тёсаного камня, с пятигранной апсидой,
    выступающей на восток. Эквтиме Такаишвили и Димитрий Бакрадзе датировали церковь 1352 годом, временем
    Кахабера Гуриели, по надписи на иконе; историки искусства относят её к более раннему времени — второй
    половине XIII века. Южный фасад, позднее подновлённый камнем и кирпичом, имеет окна, идентичные окнам
    в Джумати — вероятно, работа того же реставратора.


    Обратите внимание на:

    - три арочных **окна апсиды**, каждое в резном обрамлении

    - парную арку **западного притвора**, более позднюю пристройку

    - двухъярусную **колокольню**, чья надпись на западной стороне датирует её 1422 годом и называет старое
    имя деревни — Рехоели; из её стены выглядывает резная баранья голова


    Сокровища уходили одно за другим. В 1924 году коммунисты вывезли из церкви всё ценное, и в том же
    году Акакий Шанидзе и Шалва Амиранашвили забрали в Тбилиси Евангелие XI века, ныне хранящееся в Национальном
    центре рукописей; последний приходской священник, Нестор Контридзе, переплёл его заново в 1890 году.
    Фрески XV–XVI веков с портретами четырёх дворян были соскоблены в начале 1990-х годов «под обновление».
    Сохранились лишь «Снятие с креста» и «Явление у гроба»; повреждённые фрагменты находятся в Тбилисской
    академии художеств.


    В двух километрах, на границе с Чаниети, руины крепости Лихаури — в округе её называют крепостью Тамар
    — до сих пор хранят в своих стенах три башни, а рядом с ней нашли тысячу османских серебряных монет.
    Церковь сохранила свой камень; остальное придётся представлять самому, глядя на стены.
  tip: >-
    Отведите час, а с крепостью — два. Церковь часто заперта; ключ хранится в деревне, и соседи покажут,
    у кого его спросить. Прикрывайте плечи и колени; женщинам понадобится платок. Церковный двор — действующее
    кладбище, так что ступайте среди могил тихо. К крепости спрашивайте дорогу у местных: тропа не размечена,
    летом зарастает и кишит крапивой и клещами, так что наденьте закрытую обувь и длинные брюки. Здесь
    нет ни туалетов, ни кафе; в Озургети, в десяти минутах езды, есть и то, и другое. Ближе к вечеру солнце
    тепло освещает западный фасад.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юг до Ланчхути,
    а дальше через Джапану до Озургети. Пересеките город и продолжайте около пяти километров на юг по
    деревенской дороге до Лихаури — 306 км, около четырёх часов сорока пяти минут. Асфальт держится до
    самой деревни, где дорога сужается и начинаются выбоины; последний короткий подъём к церкви крутой
    и после дождя скользкий. Заправиться можно в Ланчхути и Озургети. Машина эконом-класса справится в
    сухую погоду; после сильного дождя оставьте машину у подножия холма и поднимитесь пешком.
fa:
  name: کلیسای حضرت مریم در لیخائوری
  short: >-
    کلیسایی سنگی و تک‌سالنه با کنده‌کاری، بر فراز تپه‌ای روستایی در جنوب اوزورگتی، با برج ناقوسی به تاریخ
    ۱۴۲۲ و قلعه‌ای سه‌برجه در دو کیلومتری آن.
  body: >-
    **کلیسای لیخائوری تقریباً هر آنچه را که می‌شد با خود برد از دست داده، و با این‌همه یکی از رساترین
    سنگ‌های گوریا باقی مانده است.**


    کلیسای حضرت مریم بر فراز بلندی‌ای در مرکز روستا، که گورهایی آن را در بر گرفته‌اند، در پنج کیلومتری
    جنوب اوزورگتی قرار دارد. این کلیسایی تک‌سالنه و بی‌گنبد از سنگ تراشیدهٔ خاکستری‌روشن است، با اَپسیدی
    پنج‌ضلعی که به سوی شرق بیرون زده است. اکوتیمه تاکایشویلی و دیمیتری باکرادزه بر پایهٔ کتیبه‌ای بر روی
    یک شمایل، تاریخ آن را ۱۳۵۲، یعنی دوران کاخابر گوریئلی، دانسته‌اند؛ تاریخ‌نگاران هنر آن را کهن‌تر می‌دانند
    و به نیمهٔ دوم سدهٔ سیزدهم برمی‌گردانند. نمای جنوبی، که بعدها با سنگ و آجر وصله‌کاری شده، پنجره‌هایی
    همسان با پنجره‌های جوماتی دارد — گویا دست همان مرمت‌کار.


    به این‌ها با دقت نگاه کنید:

    - سه **پنجرهٔ طاق‌دار اَپسید**، هرکدام در قابی کنده‌کاری‌شده

    - طاق دوگانهٔ **ایوان غربی**، الحاقی متأخرتر

    - **برج ناقوسیِ** دو طبقه، که کتیبهٔ رو به غربش آن را به سال ۱۴۲۲ تاریخ‌گذاری می‌کند و نام کهن روستا،
    رخوئلی، را به دست می‌دهد؛ و سری کنده‌کاری‌شده از قوچ از دیوارش بیرون نگاه می‌کند


    گنجینه‌ها یکی‌یکی از دست رفتند. در سال ۱۹۲۴ کمونیست‌ها هر آنچه گران‌بها بود از کلیسا بیرون بردند،
    و همان سال آکاکی شانیدزه و شالوا امیرانشویلی، انجیلِ سدهٔ یازدهم آن را به تفلیس بردند که اکنون در
    مرکز ملی نسخ خطی نگه‌داری می‌شود؛ آخرین کشیش محلی، نستور کونتریدزه، آن را در سال ۱۸۹۰ دوباره جلدبندی
    کرده بود. نگاره‌های دیواریِ سده‌های پانزدهم و شانزدهم، با چهرهٔ چهار نجیب‌زاده، در اوایل دههٔ ۱۹۹۰
    به بهانهٔ «نوسازی» تراشیده شدند. تنها «فرودآوردن از صلیب» و «گشودن مقبره» باقی مانده‌اند؛ قطعات آسیب‌دیده
    در آکادمی هنرهای تفلیس نگه‌داری می‌شوند.


    در دو کیلومتری آن، بر مرز چانی‌ئتی، ویرانه‌های قلعهٔ لیخائوری — که در محل آن را قلعهٔ تامار می‌نامند
    — هنوز سه برج در دیوارهایش جای داده، و در کنار آن هزار سکهٔ نقرهٔ عثمانی یافته‌اند. کلیسا سنگ خود
    را نگه داشته؛ باقی را باید خود در ذهن بر دیوارها بازسازید.
  tip: >-
    یک ساعت زمان بگذارید، و با قلعه، دو ساعت. کلیسا غالباً قفل است؛ کلید در روستا نگه‌داری می‌شود و همسایه‌ها
    راه را نشانتان می‌دهند. شانه‌ها و زانوها را بپوشانید؛ زنان به روسری نیاز خواهند داشت. حیاط کلیسا گورستانی
    فعال است، پس آرام میان گورها حرکت کنید. برای قلعه، مسیر را از مردم محل بپرسید: راهی نشانه‌گذاری‌نشده
    که در تابستان پر از علف هرز و پوشیده از گزنه و کنه می‌شود، پس کفش بسته و شلوار بلند بپوشید. اینجا
    نه توالتی هست نه کافه‌ای؛ اوزورگتی، ده دقیقه دورتر، هر دو را دارد. نور آفتاب اواخر بعدازظهر نمای غربی
    را گرم می‌کند.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 به جنوب
    تا لانچخوتی، و از آن‌جا از میان جاپانا تا اوزورگتی ادامه دهید. از شهر بگذرید و حدود پنج کیلومتر دیگر
    در جادهٔ روستایی به سوی جنوب برانید تا لیخائوری — حدود ۳۰۶ کیلومتر، نزدیک به چهار ساعت و چهل‌وپنج
    دقیقه. مسیر تا خود روستا آسفالت است، جایی که جاده تنگ می‌شود و چاله‌ها آغاز می‌شوند؛ آخرین سربالایی
    کوتاه به کلیسا پرشیب و پس از باران لغزنده است. سوخت‌گیری در لانچخوتی و اوزورگتی. یک خودروی معمولی
    در هوای خشک از پس این راه برمی‌آید؛ پس از باران شدید، خودرو را در دامنهٔ تپه بگذارید و پیاده بالا
    بروید.
he:
  name: כנסיית הבתולה בליחאוורי
  short: >-
    כנסיית אולם מאבן מסותת על גבעת כפר מדרום לאוזורגתי, עם מגדל פעמונים מתוארך ל-1422 ומצודה בת שלושה
    מגדלים במרחק שני קילומטרים.
  body: >-
    **כנסיית ליחאוורי איבדה כמעט כל מה שאפשר היה לסחוב ממנה, ובכל זאת היא נותרה אחת האבנים הרהוטות ביותר
    בגוריה.**


    כנסיית הבתולה מכתירה גבעה במרכז הכפר, מוקפת קברים, כחמישה קילומטרים מדרום לאוזורגתי. זהו אולם חסר-כיפה
    מאבן גזית אפרפרה בהירה, עם אפסיס מחומש הבולט מזרחה. אקווטימה טקאישווילי ודימיטרי בקראדזה תיארכו אותה
    ל-1352, לתקופתו של קחבר גוריאלי, על סמך כתובת על איקונה; חוקרי אמנות מקדימים את התאריך לחצי השני של
    המאה ה-13. בחזית הדרומית, שתוקנה מאוחר יותר באבן ולבנים, יש חלונות זהים לאלה שבג'ומאתי — כנראה מלאכת
    אותו משפץ.


    התבוננו מקרוב ב:

    - שלושת **חלונות האפסיס** הקשתיים, כל אחד ממוסגר בקישוט מגולף

    - הקשת הכפולה של **האכסדרה המערבית**, תוספת מאוחרת יותר

    - **מגדל הפעמונים** הדו-קומתי, שכתובתו הפונה מערבה מתארכת אותו ל-1422 ונותנת את שמו הישן של הכפר,
    רחואלי; ראש איל מגולף מציץ מקירו


    האוצרות אבדו אחד אחרי השני. ב-1924 שללו הקומוניסטים מהכנסייה את חפצי הערך שבה, ובאותה שנה נשאו אקאקי
    שאנידזה ושאלוה אמירנשווילי את ספר הבשורות שלה מהמאה ה-11 לטביליסי, השמור כיום במרכז הלאומי לכתבי-יד;
    הכומר האחרון של הקהילה, נסטור קונטרידזה, כרך אותו מחדש ב-1890. ציורי הקיר מהמאות ה-15–16, עם דיוקנאות
    ארבעה אצילים, נגרדו בתחילת שנות ה-90 "לשם שיפוץ". רק "הורדה מן הצלב" ו"פתיחת הקבר" נותרו בעין; השרידים
    הפגומים מוחזקים באקדמיה לאמנות בטביליסי.


    במרחק שני קילומטרים, על גבול צ'אנייתי, שרידי מבצר ליחאוורי — הידוע במקום כמבצר תמר — עדיין משלבים
    שלושה מגדלים בחומותיהם, ולידו נמצאו אלף מטבעות כסף עות'מאניים. הכנסייה שמרה על אבניה; את השאר צריך
    לדמיין בחזרה על הקירות.
  tip: >-
    הקדישו שעה, ושעתיים עם המבצר. הכנסייה נעולה לרוב; המפתח שמור בכפר והשכנים יפנו אתכם למי שמחזיק בו.
    כסו כתפיים וברכיים; נשים יזדקקו לכיסוי ראש. חצר הכנסייה היא בית קברות פעיל, אז התהלכו בשקט בין הקברים.
    לגבי המבצר, שאלו את המקומיים לגבי השביל: הוא לא מסומן, מכוסה צמחייה בקיץ ורווי בסרפדים וקרציות, אז
    נעלו נעליים סגורות ומכנסיים ארוכים. אין כאן שירותים או בית קפה; באוזורגתי, במרחק עשר דקות, יש את שניהם.
    שמש אחר הצהריים המאוחרת מחממת את החזית המערבית.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה ובכביש S12 דרומה עד לנצ'חוטי, ומשם
    בדרך העוברת בג'אפנה עד אוזורגתי. חצו את העיר והמשיכו כחמישה קילומטרים דרומה בדרך הכפרית עד ליחאוורי
    — 306 ק"מ, כארבע שעות ושלושה רבעי שעה. הדרך אספלט עד הכפר, שם היא מצטמצמת והמהמורות מתחילות; העלייה
    הקצרה והאחרונה לכנסייה תלולה וחלקלקה אחרי גשם. תדלוק בלנצ'חוטי ובאוזורגתי. רכב אקונומי מתמודד היטב
    במזג אוויר יבש; אחרי גשם חזק, השאירו את הרכב בתחתית הגבעה וטפסו ברגל.
ar:
  name: كنيسة السيدة العذراء في ليخاوري
  short: >-
    كنيسة قاعة حجرية منقوشة على تلة قروية جنوب أوزورغيتي، ببرج جرس يعود إلى عام 1422 وقلعة ثلاثية الأبراج
    على مسافة كيلومترين.
  body: >-
    **فقدت كنيسة ليخاوري تقريبًا كل ما كان يمكن حمله وأخذه، ومع ذلك تبقى من أبلغ الحجارة في غوريا.**


    تتوّج كنيسة السيدة العذراء ربوة في وسط القرية، تحيط بها القبور، على نحو خمسة كيلومترات جنوب أوزورغيتي.
    وهي كنيسة قاعة بلا قبة من الحجر المنحوت الرمادي الفاتح، بحنية خماسية الجوانب تبرز شرقًا. أرّخها إكفتيمه
    تاكايشفيلي ودميتري باكرادزه إلى عام 1352، عهد كاخابر غورييلي، استنادًا إلى كتابة على إحدى الأيقونات؛
    بينما يرى مؤرخو الفن أنها أقدم من ذلك، في النصف الثاني من القرن الثالث عشر. وتحمل الواجهة الجنوبية،
    التي رُمّمت لاحقًا بالحجر والآجر، نوافذ مماثلة لتلك الموجودة في جوماتي — ولعلّها يد المرمِّم نفسه.


    انظر بدقة إلى:

    - **نوافذ الحنية** الثلاث المقنطرة، كل منها بإطار منقوش

    - القنطرة المزدوجة في **الرواق الغربي**، وهي إضافة لاحقة

    - **برج الجرس** ذي الطابقين، الذي تؤرّخه كتابته المطلة على الغرب إلى عام 1422 وتحمل اسم القرية القديم،
    ريخوئيلي؛ ورأس كبش منقوش يتطلع من جداره


    رحلت الكنوز واحدًا تلو الآخر. في عام 1924 جرّد الشيوعيون الكنيسة من نفائسها، وفي تلك السنة نفسها حمل
    أكاكي شانيدزه وشالفا أميرانشفيلي إنجيلها من القرن الحادي عشر إلى تبليسي، وهو محفوظ اليوم في المركز
    الوطني للمخطوطات؛ وكان آخر كاهن للأبرشية، نستور كونتريدزه، قد أعاد تجليده في عام 1890. أما جداريات
    القرنين الخامس عشر والسادس عشر، بصور أربعة من النبلاء، فقد كُشطت في أوائل التسعينيات بذريعة «التجديد».
    ولم يبقَ سوى «إنزال المسيح عن الصليب» و«فتح القبر»؛ والقطع التالفة محفوظة في أكاديمية الفنون في تبليسي.


    على مسافة كيلومترين، عند حدود تشانييتي، لا تزال أنقاض قلعة ليخاوري — المعروفة محليًا بقلعة تامار —
    تضمّ ثلاثة أبراج في أسوارها، وقد عُثر إلى جانبها على ألف قطعة نقدية فضية عثمانية. حافظت الكنيسة على
    حجرها؛ أما الباقي فعليك أن تعيده بخيالك إلى الجدران.
  tip: >-
    خصّص ساعة، وساعتين مع القلعة. الكنيسة مقفلة غالبًا؛ والمفتاح محفوظ في القرية وسيدلّك الجيران على من
    يحمله. غطِّ الكتفين والركبتين؛ وستحتاج النساء إلى غطاء رأس. باحة الكنيسة مقبرة لا تزال قيد الاستخدام،
    فتحرّك بهدوء بين القبور. أما بالنسبة للقلعة، فاسأل السكان المحليين عن الطريق: فهو غير معلَّم، ويكسوه
    العشب في الصيف ويكثر فيه القريص والقُراد، فارتدِ حذاءً مغلقًا وسروالًا طويلًا. لا مراحيض هنا ولا مقهى؛
    وتوفرهما أوزورغيتي على مسافة عشر دقائق. وتُدفئ شمسُ الأصيل الواجهةَ الغربية.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم S12 جنوبًا حتى لانتشخوتي، ومنها
    الطريق العابر بجابانا حتى أوزورغيتي. اعبر البلدة وتابع نحو خمسة كيلومترات جنوبًا على الطريق الريفي
    حتى ليخاوري — 306 كم، نحو أربع ساعات وخمس وأربعين دقيقة. الطريق معبّد حتى القرية، حيث يضيق الممر وتبدأ
    الحفر؛ والصعود القصير الأخير إلى الكنيسة حاد وزلق بعد المطر. التزود بالوقود في لانتشخوتي وأوزورغيتي.
    تتحمّل السيارة الاقتصادية الطريق في الطقس الجاف؛ وبعد مطر غزير، اترك السيارة عند سفح التلة وتابع سيرًا
    على الأقدام.
