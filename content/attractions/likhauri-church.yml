ka:
  name: ლიხაურის ღვთისმშობლის ეკლესია
  short: გურული სოფლის ეკლესია ბორცვზე ოზურგეთის სამხრეთით, გვერდით კი ციხის ნაშთები.
  body: >-
    **ლიხაური იმ ადგილთაგანია, სადაც გურიის ისტორია ჯერ კიდევ მიწაზეა და არა მუზეუმში.** სოფელი ოზურგეთიდან
    სამხრეთით, ბორცვებში, შემოქმედის მეზობლადაა. აქ ორი რამაა: ღვთისმშობლის ეკლესია და მისგან არც თუ შორს
    ძველი ციხის ნაშთები.

    ეკლესია დარბაზული ტიპისაა, გვიანი შუა საუკუნეებისა — ჩვეულებრივ XVI-XVII საუკუნეებით თარიღდება, თუმცა
    ადგილი ძველია. ის გურიელების, გურიის მთავრების, ერთ-ერთი საგვარეულო ეკლესია იყო. შენობა მარტივია:
    სწორი ქვის კედლები, ვიწრო ფანჯრები, კრამიტის სახურავი. შიგნით შემორჩენილია ფრესკის ფრაგმენტები და
    რამდენიმე საფლავის ქვა.

    რაზეც ღირს ყურადღების მიქცევა:

    - **დასავლეთ კარის ჩარჩო**, ქვის კვეთით — მარტივი, მაგრამ ზუსტი

    - **საკურთხევლის სარკმელი** და მისი პროპორციები, ტიპური დასავლურ-ქართული

    - **ბორცვის ხედი** — გურიის ტალღოვანი რელიეფი, ჩაისა და თხილის ბაღები

    ციხის ნაშთები სოფლის ზემოთაა, ტყეში მიმალული: კედლის ფრაგმენტები და კოშკის ბაზისი. ისინი შუა საუკუნეებისაა
    და ხეობის კონტროლს ემსახურებოდა. მისვლა ბილიკით ხდება, მარკირება არაა და ზაფხულში მცენარეულობა ბევრს
    ფარავს — ადგილობრივის კითხვა ჯობია.

    ერთი საათი. ლიხაური არ არის ის ადგილი, რომლისთვისაც თბილისიდან ჩამოხვალ, მაგრამ შემოქმედთან ერთად
    ის ერთ ლოგიკურ ნახევარდღიან მარშრუტს ქმნის.
  tip: >-
    ერთი საათი, ციხის ნაშთებთან ერთად — საათნახევარი. ეკლესია ხშირად დაკეტილია; გასაღები სოფელშია და მეზობლები
    დაგეხმარებიან. ჩაცმის წესები მოქმედებს. ციხისკენ მიმავალი ბილიკი მოუვლელია, დახურული ფეხსაცმელი და
    გრძელი შარვალი აუცილებელია — ჭინჭარი და ტკიპა ჩვეულებრივია. ტუალეტი და კაფე არაა, უახლოესი ოზურგეთშია.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთის გავლით ოზურგეთამდე და კიდევ თხუთმეტიოდე
    კილომეტრი სამხრეთით — 335 კმ, დაახლოებით ხუთი საათი. მთავარი გზა ბოლომდე ასფალტია, სოფლის მონაკვეთი
    კი ვიწრო და ორმოებიანი. ბორცვზე ასასვლელი ბოლო კილომეტრი ციცაბოა და წვიმის შემდეგ სრიალებს. საწვავი
    ოზურგეთშია. ეკონომ-კლასის მანქანა მშრალ ამინდში სავსებით საკმარისია.
en:
  name: Likhauri Church of the Virgin
  short: A village church on a hill south of Ozurgeti, with the remains of a fortress in the woods above
    it.
  body: >-
    **Likhauri is one of those places where the history of Guria is still on the ground rather than in
    a museum.** The village sits in the hills south of Ozurgeti, next to Shemokmedi. There are two things
    here: the Church of the Virgin, and the remains of an old fortress not far above it.

    The church is a late medieval hall church, usually dated to the 16th or 17th century, though the site
    itself is older. It served as one of the family churches of the Gurieli, the princes of Guria. The
    building is plain: straight stone walls, narrow windows, a tiled roof. Inside, fragments of fresco
    survive along with several grave slabs.

    Worth looking at:

    - The **west doorway surround**, stone-carved, simple but precise

    - The **altar window** and its proportions, typical of western Georgian building

    - The **view from the hill** — the rolling relief of Guria, tea and hazelnut plots below

    The fortress remains lie above the village, hidden in trees: sections of wall and the base of a tower.
    They are medieval and served to control the valley. A path leads up, but there is no waymarking and
    summer growth hides a good deal, so it is worth asking someone in the village.

    An hour. Likhauri is not a place you drive from Tbilisi for on its own, but with Shemokmedi it makes
    one coherent half-day loop through the quietest part of Guria.
  tip: >-
    An hour, or an hour and a half with the fortress remains. The church is often locked; the key is kept
    in the village and neighbours will help. Dress rules apply. The path to the fortress is unmaintained,
    so closed shoes and long trousers matter — nettles and ticks are common. There are no toilets or cafe,
    the nearest being in Ozurgeti.
  route: >-
    From Tbilisi take the E60 to Samtredia, then south through Lanchkhuti to Ozurgeti and about fifteen
    kilometres further south — 335 km, roughly five hours. The main road is asphalt throughout, while
    the village section is narrow and potholed. The last kilometre up the hill is steep and slippery after
    rain. Fuel is available in Ozurgeti. An economy car is entirely sufficient in dry weather.
ru:
  name: Церковь Богородицы в Лихаури
  short: Сельская церковь на холме южнее Озургети, а выше в лесу — остатки крепости.
  body: >-
    **Лихаури — из тех мест, где история Гурии всё ещё лежит на земле, а не в музее.** Село стоит в холмах
    южнее Озургети, по соседству с Шемокмеди. Здесь два объекта: церковь Богородицы и остатки старой крепости
    чуть выше неё.

    Церковь — зальная, позднего Средневековья, обычно её относят к XVI-XVII векам, хотя само место старше.
    Она служила одной из родовых церквей Гуриели, князей Гурии. Здание простое: прямые каменные стены,
    узкие окна, черепичная кровля. Внутри сохранились фрагменты фресок и несколько надгробных плит.

    На что посмотреть:

    - **Обрамление западного портала**, каменная резьба — простая, но точная

    - **Алтарное окно** и его пропорции, типичные для западногрузинского строительства

    - **Вид с холма** — волнистый рельеф Гурии, чайные и фундучные участки внизу

    Остатки крепости лежат выше села, скрытые деревьями: участки стены и основание башни. Они средневековые
    и служили для контроля над долиной. Наверх ведёт тропа, но маркировки нет, а летняя растительность
    многое прячет, так что лучше спросить кого-нибудь в селе.

    Час. Ради Лихаури одного из Тбилиси не едут, но вместе с Шемокмеди получается связный полудневный
    маршрут по самой тихой части Гурии.
  tip: >-
    Час, а с остатками крепости полтора. Церковь часто заперта; ключ хранится в селе, соседи подскажут.
    Правила одежды действуют. Тропа к крепости не расчищена, так что закрытая обувь и длинные брюки обязательны
    — крапива и клещи обычны. Ни туалета, ни кафе нет, ближайшие в Озургети.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути до Озургети и ещё примерно пятнадцать километров
    южнее — 335 км, около пяти часов. Главная дорога асфальтированная, сельский участок узкий и в ямах.
    Последний километр в гору крутой и после дождя скользит. Заправка в Озургети. Машины эконом-класса
    в сухую погоду вполне достаточно.
fa:
  name: کلیسای مریم مقدس در لیخائوری
  short: کلیسایی روستایی بر تپه‌ای جنوب اوزورگتی، و بالاتر از آن بازمانده‌های قلعه‌ای در جنگل.
  body: >-
    **لیخائوری از آن جاهاست که تاریخ گوریا هنوز روی زمین است نه در موزه.** روستا در تپه‌های جنوب اوزورگتی
    و همسایهٔ شموکمدی است. اینجا دو چیز هست: کلیسای مریم مقدس، و بازمانده‌های قلعه‌ای کهن اندکی بالاتر
    از آن.

    کلیسا بنایی تالاری از اواخر سده‌های میانه است و معمولاً به سدهٔ شانزدهم یا هفدهم نسبت داده می‌شود،
    هرچند خود مکان کهن‌تر است. یکی از کلیساهای خاندان گوریلی، امیران گوریا، بود. بنا ساده است: دیوارهای
    راست سنگی، پنجره‌های باریک، بام سفالی. در درون پاره‌هایی از فرسک و چند سنگ گور مانده است.

    آنچه ارزش نگاه دارد:

    - **قاب درگاه غربی**، با کنده‌کاری سنگی؛ ساده اما دقیق

    - **پنجرهٔ محراب** و تناسبات آن، نمونه‌وار برای معماری غرب گرجستان

    - **چشم‌انداز تپه** — پستی و بلندی موج‌دار گوریا و قطعه‌های چای و فندق در پایین

    بازمانده‌های قلعه بالای روستا و پنهان میان درختان است: بخش‌هایی از دیوار و پی یک برج. از سده‌های میانه
    است و کار کنترل دره را می‌کرد. مسیری به بالا می‌رود اما نشانه‌گذاری ندارد و پوشش گیاهی تابستان بسیاری
    را می‌پوشاند، پس بهتر است از کسی در روستا بپرسید.

    یک ساعت. کسی تنها برای لیخائوری از تفلیس نمی‌آید، اما همراه شموکمدی یک مسیر نیم‌روزهٔ منسجم در آرام‌ترین
    بخش گوریا می‌سازد.
  tip: >-
    یک ساعت، و با بازمانده‌های قلعه یک ساعت و نیم. کلیسا اغلب قفل است؛ کلید در روستاست و همسایه‌ها کمک
    می‌کنند. قواعد پوشش برقرار است. مسیر قلعه نگهداری نمی‌شود، پس کفش بسته و شلوار بلند مهم است؛ گزنه
    و کنه معمول است. سرویس بهداشتی و کافه نیست و نزدیک‌ترین‌ها در اوزورگتی است.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی تا اوزورگتی و حدود پانزده کیلومتر جنوب‌تر —
    ۳۳۵ کیلومتر، تقریباً پنج ساعت. جادهٔ اصلی سرتاسر آسفالت است و بخش روستایی باریک و پرچاله. یک کیلومتر
    آخر بالای تپه تند است و پس از باران لیز. سوخت در اوزورگتی. خودروی اقتصادی در هوای خشک کاملاً کافی
    است.
he:
  name: כנסיית הבתולה בליחאורי
  short: כנסיית כפר על גבעה מדרום לאוזורגטי, ומעליה שרידי מבצר ביער.
  body: >-
    **ליחאורי היא אחד המקומות שבהם ההיסטוריה של גוריה עדיין על הקרקע ולא במוזיאון.** הכפר יושב בגבעות
    מדרום לאוזורגטי, בשכנות לשמוקמדי. יש כאן שני דברים: כנסיית הבתולה, ושרידי מבצר ישן מעט מעליה.

    הכנסייה היא כנסיית אולם מסוף ימי הביניים, מתוארכת בדרך כלל למאה ה-16 או ה-17, אף שהאתר עצמו עתיק יותר.
    היא שימשה כאחת מכנסיות המשפחה של בית גוריאלי, נסיכי גוריה. המבנה פשוט: קירות אבן ישרים, חלונות צרים,
    גג רעפים. בפנים שרדו שברי ציורי קיר וכמה מצבות.

    ראוי להתבונן ב:

    - **מסגרת הפתח המערבי**, מגולפת באבן, פשוטה אך מדויקת

    - **חלון המזבח** ופרופורציותיו, אופייניים לבנייה במערב גאורגיה

    - **הנוף מן הגבעה** — התבליט המתגלגל של גוריה, וחלקות תה ואגוזי לוז למטה

    שרידי המבצר נמצאים מעל הכפר, מוסתרים בעצים: קטעי חומה ובסיס מגדל. הם מימי הביניים ושימשו לשליטה בעמק.
    שביל עולה לשם, אך אין סימון והצמחייה בקיץ מסתירה הרבה, אז כדאי לשאול מישהו בכפר.

    שעה. אין נוסעים מטביליסי בשביל ליחאורי לבדה, אבל יחד עם שמוקמדי היא יוצרת מסלול חצי-יום קוהרנטי בחלק
    השקט ביותר של גוריה.
  tip: >-
    שעה, ועם שרידי המבצר שעה וחצי. הכנסייה נעולה לעתים קרובות; המפתח נשמר בכפר והשכנים יעזרו. חלים כללי
    לבוש. השביל למבצר אינו מתוחזק, ולכן נעליים סגורות ומכנסיים ארוכים חשובים — סרפדים וקרציות שכיחים.
    אין שירותים ואין בית קפה, והקרובים ביותר באוזורגטי.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי עד אוזורגטי ועוד כחמישה עשר קילומטרים דרומה
    — 335 ק״מ, כחמש שעות. הכביש הראשי סלול לכל אורכו, והקטע הכפרי צר ומלא בורות. הקילומטר האחרון במעלה
    הגבעה תלול וחלקלק אחרי גשם. תדלוק באוזורגטי. רכב חסכוני מספיק לחלוטין במזג אוויר יבש.
ar:
  name: كنيسة العذراء في ليخاوري
  short: كنيسة قروية على تل جنوب أوزورغيتي، وفوقها بقايا قلعة بين الأشجار.
  body: >-
    **ليخاوري من الأماكن التي ما زال تاريخ غوريا فيها على الأرض لا في متحف.** تقع القرية في التلال جنوب
    أوزورغيتي، إلى جوار شيموكميدي. وفيها شيئان: كنيسة العذراء، وبقايا قلعة قديمة على مسافة قصيرة فوقها.

    الكنيسة قاعية من أواخر العصور الوسطى، وتُؤرخ عادة بالقرن السادس عشر أو السابع عشر، وإن كان الموقع
    نفسه أقدم. وكانت إحدى كنائس أسرة غورييلي، أمراء غوريا. البناء بسيط: جدران حجرية مستقيمة ونوافذ ضيقة
    وسقف قرميدي. وفي الداخل بقايا رسوم جدارية وعدد من شواهد القبور.

    ما يستحق النظر:

    - **إطار المدخل الغربي** المنحوت في الحجر، بسيط لكنه متقن

    - **نافذة المذبح** ونسبها، وهي نموذجية لعمارة غرب جورجيا

    - **الإطلالة من التل** — تضاريس غوريا المتموجة وقطع الشاي والبندق في الأسفل

    أما بقايا القلعة فتقع فوق القرية مختبئة بين الأشجار: مقاطع من سور وقاعدة برج. وهي من العصور الوسطى
    وكانت تتحكم في الوادي. ويصعد إليها درب بلا علامات، وينمو النبات صيفاً فيخفي كثيراً منه، فالأفضل سؤال
    أحد أهل القرية.

    ساعة واحدة. لا يقود أحد من تبليسي من أجل ليخاوري وحدها، لكنها مع شيموكميدي تصنع جولة نصف يوم متماسكة
    في أهدأ أجزاء غوريا.
  tip: >-
    ساعة، أو ساعة ونصف مع بقايا القلعة. الكنيسة مغلقة غالباً؛ والمفتاح محفوظ في القرية والجيران يساعدون.
    وتُطبق قواعد اللباس. درب القلعة غير مصان، فالحذاء المغلق والبنطال الطويل مهمان؛ فالقُرّاص والقراد
    شائعان. ولا دورات مياه ولا مقهى، وأقربها في أوزورغيتي.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي إلى أوزورغيتي وخمسة عشر كيلومتراً أخرى جنوباً
    — 335 كم، نحو خمس ساعات. الطريق الرئيسي معبّد كله، والمقطع القروي ضيق كثير الحفر. والكيلومتر الأخير
    صاعداً على التل حاد وزلق بعد المطر. الوقود في أوزورغيتي. وسيارة اقتصادية تكفي تماماً في الجو الجاف.
