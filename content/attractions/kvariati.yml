ka:
  name: კვარიათი
  short: ბათუმის სამხრეთით ყველაზე სუფთა წყლის კენჭოვანი სანაპირო, მთები პირდაპირ ზღვასთან მიდის.
  body: >-
    **კვარიათი იქაა, სადაც აჭარის სანაპირო ვიწროვდება.** გონიოსა და სარფს შორის მთები ზღვასთან ახლოს მოდიან
    და ბრტყელი ზოლი, რომელზეც ბათუმი დგას, სულ რამდენიმე ასეულ მეტრზე ვიწროვდება. სოფელი ამ ზოლშია ჩამწყვდეული:
    ერთი გზა, ერთი რიგი სასტუმროებისა და პირდაპირ მათ უკან ციცაბო, ტყიანი ფერდობი.

    სანაპირო კენჭოვანია, კენჭი მსხვილი და გლუვი. მთავარი განსხვავება ქობულეთისა და ურეკისგან სწორედ ეს
    არის: ქვიშა არ ირევა, წყალი გამჭვირვალეა და ფსკერი მალე ღრმავდება. ამიტომაც ჩამოდიან აქ მყვინთავები
    — საქართველოს რამდენიმე დაივინგ-ცენტრი სწორედ კვარიათსა და გონიოშია, ხოლო წყალქვეშა ხილვადობა ზაფხულის
    შუაში ათ მეტრს აღწევს.

    რაც უნდა იცოდე ჩამოსვლამდე:

    - **ბავშვისთვის შესაფერისი ნაკლებად არის** — ფსკერი ციცაბოდ ეშვება და ტალღა კენჭზე უფრო ძლიერად ერტყმის

    - **ჩუსტი აუცილებელია** — მშრალი კენჭი შუადღისას ცხელია, სველი კი მოლიპულია

    - **ჩრდილი ცოტაა** — ქოლგა ან ადგილობრივი შეზლონგი აუცილებელი გახდება

    - სექტემბერი საუკეთესო თვეა: წყალი ჯერ თბილია, ხალხი კი აღარაა

    სოფელი ბოლო ათწლეულში სწრაფად აშენდა და არქიტექტურა შემთხვევითია, თუმცა მასშტაბი მაინც პატარაა. საღამოს
    გემები საზღვრისკენ მიდიან და მზე თურქეთის მთების უკან ჩადის — ეს არის ის ხედი, რომლისთვისაც ბათუმიდან
    აქამდე ჩამოსვლა ღირს. სამზღვრო სარფი ხუთიოდე კილომეტრზეა, გონიოს ციხე კი — სამზე.
  tip: >-
    ნახევარი დღე საკმარისია. კენჭზე ჩუსტის გარეშე გაჭირდება, სველი ქვა მოლიპულია. ჩრდილი მხოლოდ ქოლგის
    ქვეშაა და შეზლონგები ფასიანია. სასმელი წყალი და საკვები სოფლის მაღაზიებშია, ტუალეტი კი ძირითადად კაფეებში.
    სექტემბერში წყალი ჯერ თბილია და ხალხი ნაკლები. ჩამქრალ ამინდში დინება იგრძნობა — ბუიების მიღმა ცურვა
    არ ღირს.
  route: >-
    ბათუმიდან სამხრეთით ქვემო აჭარის ზღვისპირა გზით მდინარე ჭოროხის ხიდზე გავლით, ადლიის, გონიოს გავლით
    — თბილისიდან ჯამში 388 კმ, დაახლოებით ექვსი საათი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, თუმცა
    ვიწროა და ზაფხულში დატვირთული. სასაზღვრო ზონაა — პასპორტი თან იქონიე, თუმცა შემოწმება იშვიათია. პარკინგი
    გზის პირას და სასტუმროებთანაა, ზაფხულში ფასიანი. საწვავი ბათუმსა და ადლიაშია. ეკონომ-კლასი სავსებით
    საკმარისია.
en:
  name: Kvariati
  short: The clearest water on the coast south of Batumi, on a pebble shore where the mountains reach
    the sea.
  body: >-
    **Kvariati is where the Adjaran coast runs out of room.** Between Gonio and Sarpi the mountains close
    on the water and the flat shelf that Batumi is built on narrows to a few hundred metres. The village
    is squeezed into that strip: one road, one line of guesthouses, and immediately behind them a steep
    forested slope.

    The beach is pebble, the stones large and smooth. That is the essential difference from Kobuleti or
    Ureki: no sand is stirred up, the water stays clear, and the bottom drops away quickly. This is why
    divers come here — most of Georgia's diving operations work out of Kvariati and Gonio, and underwater
    visibility in midsummer reaches around ten metres.

    Things worth knowing before you come:

    - **It suits small children less well** — the bottom shelves steeply and waves land harder on stone
    than on sand

    - **Water shoes are close to essential** — dry pebbles get hot by noon, wet ones are slippery

    - **Shade is scarce** — you will need an umbrella or a rented sunbed

    - September is the best month: the sea is still warm and the crowds have gone

    The village was built out quickly over the last decade and the architecture is accidental, but the
    scale has stayed small. In the evening ships move south towards the border and the sun goes down behind
    the Turkish mountains — that view is the real reason to drive down from Batumi. Sarpi and the frontier
    are five kilometres on; Gonio fortress is three kilometres back.
  tip: >-
    Half a day is enough. Bring water shoes; wet pebbles are slippery and dry ones burn. Shade exists
    only under umbrellas, and sunbeds are charged. Shops in the village sell water and food, while toilets
    are mostly inside the cafes. September still has warm water and far fewer people. In still weather
    there is a noticeable current here — swimming beyond the buoys is not worth it.
  route: >-
    From Batumi head south on the coast road, crossing the Chorokhi river bridge and passing Adlia and
    Gonio — 388 km from Tbilisi in total, about six hours. The road is asphalt throughout and in good
    condition, though narrow and busy in summer. This is a border zone, so carry your passport, even though
    checks are rare. Parking is along the road and at the guesthouses, paid in season. Fuel is available
    in Batumi and Adlia. An economy car is entirely sufficient.
ru:
  name: Квариати
  short: Самая прозрачная вода к югу от Батуми, галечный берег, горы подходят вплотную к морю.
  body: >-
    **Квариати — там, где аджарскому берегу перестаёт хватать места.** Между Гонио и Сарпи горы подступают
    к воде, и плоская полка, на которой стоит Батуми, сужается до нескольких сотен метров. Посёлок втиснут
    в эту полосу: одна дорога, один ряд гостевых домов и сразу за ними крутой лесистый склон.

    Пляж галечный, камни крупные и гладкие. В этом и главное отличие от Кобулети или Уреки: песок не поднимается,
    вода остаётся прозрачной, а дно уходит вниз быстро. Поэтому сюда едут дайверы — большая часть грузинских
    дайв-центров работает в Квариати и Гонио, а видимость под водой в разгар лета доходит примерно до
    десяти метров.

    Что стоит знать заранее:

    - **Для маленьких детей подходит хуже** — дно круто уходит вниз, и волна бьёт по камню сильнее, чем
    по песку

    - **Коралловые тапки почти обязательны** — сухая галька к полудню раскаляется, мокрая скользит

    - **Тени мало** — понадобится зонт или платный лежак

    - Сентябрь — лучший месяц: море ещё тёплое, а толпы уже нет

    Посёлок быстро застроился за последнее десятилетие, архитектура случайная, но масштаб остался небольшим.
    Вечером суда идут на юг к границе, а солнце садится за турецкие горы — ради этого вида и стоит спуститься
    сюда из Батуми. До Сарпи и границы пять километров, до крепости Гонио — три.
  tip: >-
    Полдня достаточно. Возьмите тапки для воды: мокрая галька скользит, сухая обжигает. Тень есть только
    под зонтами, лежаки платные. Вода и еда — в поселковых магазинах, туалеты в основном при кафе. В сентябре
    море ещё тёплое, а людей заметно меньше. В штиль здесь ощутимое течение — заплывать за буи не стоит.
  route: >-
    Из Батуми на юг по приморской дороге через мост над Чорохи, мимо Адлии и Гонио — от Тбилиси всего
    388 км, около шести часов. Дорога асфальтированная и в хорошем состоянии, но узкая и летом загруженная.
    Это пограничная зона, так что паспорт держите при себе, хотя проверки редки. Парковка вдоль дороги
    и у гостевых домов, в сезон платная. Заправки есть в Батуми и Адлии. Машины эконом-класса вполне достаточно.
fa:
  name: کواریاتی
  short: زلال‌ترین آب ساحل جنوب باتومی، بر ساحلی سنگ‌ریزه‌ای که کوه‌ها تا لب دریا می‌آیند.
  body: >-
    **کواریاتی جایی است که ساحل آجارا دیگر جا کم می‌آورد.** میان گونیو و سارپی کوه‌ها به آب نزدیک می‌شوند
    و آن سکوی هموار که باتومی بر آن ساخته شده به چند صد متر تنگ می‌شود. روستا در همین نوار فشرده شده است:
    یک جاده، یک ردیف مهمان‌پذیر، و بلافاصله پشت آن‌ها دامنه‌ای تند و جنگلی.

    ساحل سنگ‌ریزه‌ای است و سنگ‌ها درشت و صاف. تفاوت اصلی با کوبولتی یا اورکی همین است: ماسه‌ای به هم نمی‌خورد،
    آب زلال می‌ماند و کف به‌سرعت گود می‌شود. به همین دلیل غواصان اینجا می‌آیند؛ بیشتر مراکز غواصی گرجستان
    در کواریاتی و گونیو کار می‌کنند و دید زیر آب در اوج تابستان به حدود ده متر می‌رسد.

    آنچه پیش از آمدن باید بدانید:

    - **برای کودکان خردسال کمتر مناسب است** — کف به‌سرعت گود می‌شود و موج روی سنگ سخت‌تر می‌کوبد تا روی
    ماسه

    - **کفش دریایی تقریباً ضروری است** — سنگ خشک تا ظهر داغ می‌شود و سنگ خیس لیز است

    - **سایه کم است** — به چتر یا تخت‌ ساحلی کرایه‌ای نیاز دارید

    - شهریور بهترین ماه است: دریا هنوز گرم است و ازدحام رفته

    روستا در دههٔ گذشته به‌سرعت ساخته شد و معماری‌اش اتفاقی است، اما مقیاس کوچک مانده. غروب‌ها کشتی‌ها
    به سوی مرز جنوب می‌روند و خورشید پشت کوه‌های ترکیه فرو می‌نشیند؛ همین منظره دلیل واقعی رانندگی از
    باتومی تا اینجاست. سارپی و مرز پنج کیلومتر جلوتر است و قلعهٔ گونیو سه کیلومتر عقب‌تر.
  tip: >-
    نیم روز کافی است. کفش دریایی بیاورید؛ سنگ خیس لیز است و سنگ خشک می‌سوزاند. سایه فقط زیر چتر است و
    تخت‌ها کرایه‌ای‌اند. آب و خوراک در مغازه‌های روستا هست و سرویس بهداشتی بیشتر داخل کافه‌ها. شهریور
    آب هنوز گرم است و جمعیت بسیار کمتر. در هوای آرام جریان آب اینجا محسوس است؛ شنا از بویه‌ها آن‌طرف‌تر
    نمی‌ارزد.
  route: >-
    از باتومی به جنوب در جادهٔ ساحلی، از پل رود چوروخی و کنار آدلیا و گونیو — از تفلیس روی‌هم ۳۸۸ کیلومتر،
    حدود شش ساعت. جاده سرتاسر آسفالت و در وضعیت خوب است، اما باریک و در تابستان شلوغ. اینجا منطقهٔ مرزی
    است، پس گذرنامه همراه داشته باشید، هرچند بازرسی کم پیش می‌آید. پارک کنار جاده و نزد مهمان‌پذیرهاست
    و در فصل پولی. سوخت در باتومی و آدلیا. خودروی اقتصادی کاملاً کافی است.
he:
  name: קווריאתי
  short: המים הצלולים ביותר בחוף שמדרום לבאטומי, על חוף חלוקים שבו ההרים מגיעים עד הים.
  body: >-
    **קווריאתי היא המקום שבו נגמר לחוף אג׳ריה המקום.** בין גוניו לסארפי ההרים נסגרים על המים, והמדף השטוח
    שעליו בנויה באטומי מצטמצם למאות מטרים בודדים. הכפר דחוס ברצועה הזאת: כביש אחד, שורה אחת של בתי הארחה,
    ומיד מאחוריהם מדרון תלול ומיוער.

    החוף חלוקים, האבנים גדולות וחלקות. זה ההבדל המהותי מקובולטי או מאורקי: אין חול שנסחף, המים נשארים
    צלולים, והקרקעית צונחת מהר. משום כך צוללנים מגיעים לכאן — רוב מרכזי הצלילה של גאורגיה פועלים מקווריאתי
    ומגוניו, והראות מתחת למים באמצע הקיץ מגיעה לכעשרה מטרים.

    כדאי לדעת מראש:

    - **פחות מתאים לילדים קטנים** — הקרקעית יורדת בתלילות והגל מכה חזק יותר על אבן מאשר על חול

    - **נעלי ים כמעט הכרחיות** — חלוקים יבשים לוהטים בצהריים ורטובים חלקלקים

    - **הצל מועט** — תזדקקו לשמשייה או למיטת חוף בתשלום

    - ספטמבר הוא החודש הטוב ביותר: הים עדיין חמים והקהל כבר הלך

    הכפר נבנה במהירות בעשור האחרון והאדריכלות מקרית, אבל קנה המידה נשאר קטן. בערב אניות נעות דרומה לעבר
    הגבול והשמש שוקעת מאחורי הרי טורקיה — הנוף הזה הוא הסיבה האמיתית לנסוע לכאן מבאטומי. סארפי והגבול
    חמישה קילומטרים הלאה, ומבצר גוניו שלושה קילומטרים אחורה.
  tip: >-
    חצי יום מספיק. הביאו נעלי ים; חלוקים רטובים חלקלקים ויבשים שורפים. צל יש רק מתחת לשמשיות, ומיטות החוף
    בתשלום. מים ומזון נמכרים בחנויות הכפר, והשירותים בעיקר בתוך בתי הקפה. בספטמבר המים עדיין חמים והאנשים
    מעטים בהרבה. במזג אוויר רגוע יש כאן זרם מורגש — לא כדאי לשחות מעבר למצופים.
  route: >-
    מבאטומי דרומה בכביש החוף, מעל גשר נהר צ׳ורוחי ודרך אדליה וגוניו — 388 ק״מ מטביליסי בסך הכול, כשש שעות.
    הכביש סלול לכל אורכו ובמצב טוב, אך צר ועמוס בקיץ. זהו אזור גבול, אז שאו דרכון, אף שהבדיקות נדירות.
    החניה לצד הכביש ובבתי ההארחה, בתשלום בעונה. תדלוק בבאטומי ובאדליה. רכב חסכוני מספיק לחלוטין.
ar:
  name: كفارياتي
  short: أصفى مياه الساحل جنوب باتومي، على شاطئ حصوي تصل عنده الجبال إلى البحر.
  body: >-
    **كفارياتي هي حيث ينفد المكان من ساحل أجاريا.** بين غونيو وسارپي تقترب الجبال من الماء، فيضيق الرف
    المستوي الذي بنيت عليه باتومي إلى بضع مئات من الأمتار. والقرية محشورة في هذا الشريط: طريق واحد وصف
    واحد من بيوت الضيافة، وخلفها مباشرة منحدر حاد مكسو بالغابة.

    الشاطئ حصوي والحصى كبيرة ملساء. وهذا هو الفارق الجوهري عن كوبوليتي أو أوريكي: لا رمل يثور، فيبقى الماء
    صافياً، والقاع ينحدر سريعاً. لذلك يأتي الغواصون إلى هنا؛ فمعظم مراكز الغوص في جورجيا تعمل من كفارياتي
    وغونيو، ومدى الرؤية تحت الماء في ذروة الصيف يبلغ نحو عشرة أمتار.

    ما يحسن معرفته قبل المجيء:

    - **أقل ملاءمة للأطفال الصغار** — القاع ينحدر بحدة والموج يرتطم بالحجر أقسى مما يرتطم بالرمل

    - **حذاء الماء يكاد يكون ضرورة** — الحصى الجاف يلتهب ظهراً والمبلل زلق

    - **الظل شحيح** — ستحتاج مظلة أو كرسي شاطئ بأجر

    - سبتمبر أفضل الشهور: البحر لا يزال دافئاً والزحام قد انصرف

    نمت القرية بسرعة في العقد الأخير وعمارتها عشوائية، لكن مقياسها ظل صغيراً. وفي المساء تمضي السفن جنوباً
    نحو الحدود وتغرب الشمس خلف جبال تركيا؛ وهذا المشهد هو السبب الحقيقي للنزول إلى هنا من باتومي. سارپي
    والحدود على بعد خمسة كيلومترات، وقلعة غونيو ثلاثة كيلومترات إلى الوراء.
  tip: >-
    نصف يوم يكفي. أحضر حذاء ماء؛ فالحصى المبلل زلق والجاف حارق. الظل تحت المظلات فقط والكراسي بأجر. الماء
    والطعام في متاجر القرية، ودورات المياه غالباً داخل المقاهي. في سبتمبر يبقى الماء دافئاً والناس أقل
    بكثير. وفي الجو الهادئ يوجد تيار محسوس هنا، فلا تسبح خلف العوامات.
  route: >-
    من باتومي جنوباً على طريق الساحل، عبر جسر نهر تشوروخي ومروراً بأدليا وغونيو — 388 كم من تبليسي إجمالاً،
    نحو ست ساعات. الطريق معبّد كله وبحالة جيدة، لكنه ضيق ومزدحم صيفاً. هذه منطقة حدودية، فاحمل جواز سفرك
    وإن كان التفتيش نادراً. الوقوف على جانب الطريق وعند بيوت الضيافة، وبأجر في الموسم. الوقود في باتومي
    وأدليا. وسيارة اقتصادية تكفي تماماً.
