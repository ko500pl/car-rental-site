ka:
  name: კვარიათი
  short: 'ბათუმის ყველაზე სამხრეთული პლაჟი: ერთი კილომეტრი კენჭი და გამჭვირვალე წყალი, სადაც მთები ზღვას
    თითქმის ეხება.'
  body: >-
    **კვარიათი ბათუმის ადმინისტრაციულ საზღვრებში უკანასკნელი პლაჟია: კილომეტრიანი კენჭოვანი ზოლი, სადაც
    მთები ისე ახლოს ჩამოდის, რომ გზა, სასტუმროები და ზღვა ერთ ვიწრო რაფაზე ეტევა.**


    სულ ახლახან აქ სოფელიც ძლივს იყო. საბჭოთა დროს კახაბრის ვაკის ამ კუთხეში ციტრუსი და ჩაი მოჰყავდათ,
    2002 წელს კი კვარიათში სულ 98 ადამიანი ცხოვრობდა. 2011 წელს ის ბათუმს შეუერთდა და მალე სასტუმროებიც
    გაჩნდა. მათი უმეტესობა წყლიდან ასიოდე მეტრშია, ახლები კი უკან, ტყიან ფერდობს მიუყვებიან.


    აქ მთავარი კენჭია. მსხვილი, გლუვი და მძიმე, ის წყალს ქვიშასავით არ ამღვრევს, ამიტომ კვარიათთან ზღვა
    გამჭვირვალეა, ფსკერი კი სწრაფად ღრმავდება. ამ სისუფთავემ და მდიდარმა წყალქვეშა სამყარომ აქ მყვინთავებიც
    მოიზიდა: პლაჟზე დაივინგ-ცენტრი მუშაობს.


    სანაპიროს ბოლომდე თუ გაუყვებით, ორივე კიდეს მიადგებით. ჩრდილოეთით პლაჟი შეუმჩნევლად გადადის გონიოს
    პლაჟში, გონიოს ციხე კი დაახლოებით სამ კილომეტრშია. სამხრეთით მას კლდოვანი კონცხი ხურავს. კლდის იქით
    სარფია, სოფელი, რომელიც 1921 წლის ყარსის ხელშეკრულებამ პატარა ტობაშის ღელეზე ორად გაჭრა; ეს ხაზი დღემდე
    საქართველო-თურქეთის საზღვარია.


    საღამომდე დარჩით. ზაფხულში მზე ღია ზღვაში, დასავლეთ-ჩრდილო-დასავლეთით ჩადის, თურქეთის სანაპირო კი
    სამხრეთ-დასავლეთით იკლაკნება და მისი ქედები ბინდში ერთმანეთის მიყოლებით ქრება.
  tip: >-
    ნახევარი დღე საკმარისია, მეტი კი მაშინ, თუ ცურვა და ნიღბით ყვინთვა გიყვართ. წყლის ფეხსაცმელი აუცილებლად
    წაიღეთ: შუადღისას მშრალი კენჭი ფეხს სწვავს, სველი მოლიპულია, ფსკერი კი სწრაფად ღრმავდება, ამიტომ პატარა
    ბავშვებს თვალი არ მოაცილოთ. ჩრდილს მხოლოდ ქოლგა იძლევა, შეზლონგები კი ფასიანია. საჭმელს სანაპიროს
    კაფეებში იშოვით, ტუალეტებიც ძირითადად იქაა. საუკეთესო თვე სექტემბერია: ზღვა ჯერ კიდევ თბილია, ხალხი
    კი აღარ არის. იცურავეთ ბუიების შიგნით. გონიოს ციხე მანქანით ხუთიოდე წუთშია, თუ ბანაობასთან ერთად ცოტა
    ისტორიაც გსურთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, ს12-ით გრიგოლეთამდე, შემდეგ კი ს2-ით სამხრეთით,
    ზღვის გაყოლებით, ქობულეთისა და ბათუმის გავლით. ქალაქის იქით ს2 აეროპორტს ჩაუვლის, ჭოროხს გადაკვეთს
    და გონიოზე გადის; კვარიათი რამდენიმე წუთში გამოჩნდება. თბილისიდან დაახლოებით 388 კმ და ექვსი საათია.
    გზა ბოლომდე ასფალტიანია და კარგ მდგომარეობაშია, მაგრამ ვიწროა და ზაფხულში გადატვირთული. მანქანა გზისპირას
    ან სასტუმროსთან დატოვეთ (სეზონზე პარკირება ფასიანია). საწვავი ბათუმში ჩაასხით. ეკონომკლასის ავტომობილიც
    სავსებით საკმარისია.
en:
  name: Kvariati
  short: 'Batumi''s southernmost beach: a kilometre of pebbles and clear water where the mountains crowd
    down to the sea.'
  body: >-
    **Kvariati is the last beach inside Batumi's city limits: a kilometre of pebbles where the mountains
    come so close that road, hotels and sea share one narrow ledge.**


    Not long ago it was barely a village. In Soviet times Kvariati grew citrus and tea on a corner of
    the Kakhaberi plain, and in 2002 it had 98 inhabitants. In 2011 it was absorbed into the city of Batumi,
    and the hotels followed. Most now stand within a hundred metres of the water; the newer ones climb
    the wooded slope behind.


    The pebbles are the point. Large, smooth and heavy, they do not cloud the water the way sand does,
    so the sea off Kvariati stays clear and the seabed falls away quickly. That clarity and a lively underwater
    world have drawn divers, and a dive centre works from the beach.


    Walk the length of the shore and you reach both of its edges. To the north it runs without a break
    into Gonio beach, with Gonio fortress about three kilometres away. To the south a rocky headland closes
    it off. Beyond that rock lies Sarpi, the village the 1921 Treaty of Kars cut in two along the little
    Tobashi stream; that line is still the frontier between Georgia and Turkey.


    Stay for the evening. In summer the sun goes down over open water to the west-north-west, while the
    Turkish coast curves away to the south-west, its ridges fading one behind another into the dusk.
  tip: >-
    Half a day is plenty, longer if you swim and snorkel. Bring water shoes: dry pebbles burn by noon,
    wet ones are slippery, and the seabed drops quickly, so keep small children close. Shade comes only
    from umbrellas, and sunbeds cost extra. Cafés along the front sell food, and the toilets are mostly
    inside them. September is the sweet spot, with the sea still warm and the crowds gone. Swim inside
    the buoys. Gonio fortress is five minutes away by car if you want some history with your swim.
  route: >-
    From Tbilisi take the S1 (E60) to Samtredia, the S12 to Grigoleti and the S2 south along the coast
    through Kobuleti and Batumi. Beyond the city the S2 passes the airport, crosses the Chorokhi and runs
    through Gonio; Kvariati comes a few minutes later, about 388 km and six hours from Tbilisi. It is
    asphalt all the way and in good repair, but narrow and slow with summer traffic. Park along the road
    or at your guesthouse (parking is paid in season). Fill up in Batumi. An economy car is all you need.
ru:
  name: Квариати
  short: 'Самый южный пляж Батуми: километр гальки и прозрачной воды, где горы почти касаются моря.'
  body: >-
    **Квариати — последний пляж в черте Батуми: километровая галечная полоса, где горы подступают так
    близко, что дороге, отелям и морю приходится делить одну узкую полку.**


    Ещё недавно здесь была крошечная деревня. В советское время в этом уголке Кахабрской равнины растили
    цитрусы и чай, а в 2002 году в Квариати жило всего 98 человек. В 2011 году село вошло в состав Батуми,
    а следом пришли и отели. Большинство из них стоит не дальше сотни метров от воды, новые же поднимаются
    по лесистому склону позади.


    Главное здесь — галька. Крупная, гладкая и тяжёлая, она не мутит воду, как это делает песок, поэтому
    море у Квариати остаётся прозрачным, а дно быстро уходит вглубь. Эта чистота и богатый подводный мир
    привлекли ныряльщиков: на пляже работает дайвинг-центр.


    Пройдите берег до конца — и окажетесь у обеих его границ. На севере пляж без разрыва переходит в пляж
    Гонио, а крепость Гонио — примерно в трёх километрах. На юге его замыкает скалистый мыс. За этой скалой
    — Сарпи, село, которое Карсский договор 1921 года рассёк пополам по маленькому ручью Тобаши; эта линия
    и сегодня остаётся границей Грузии и Турции.


    Останьтесь до вечера. Летом солнце садится над открытым морем, на запад-северо-запад, а турецкий берег
    изгибается к юго-западу, и его хребты один за другим тают в сумерках.
  tip: >-
    Половины дня достаточно, дольше — если купаться и плавать с маской. Возьмите обувь для воды: сухая
    галька к полудню обжигает, мокрая — скользит, а дно уходит вглубь быстро, так что маленьких детей
    не отпускайте далеко. Тень дают только зонты, шезлонги — за отдельную плату. Кафе вдоль набережной
    продают еду, туалеты в основном там же. Лучшее время — сентябрь: море ещё тёплое, а толпы уже разошлись.
    Купайтесь в пределах буёв. Крепость Гонио — пять минут на машине, если хочется добавить к купанию
    немного истории.
  route: >-
    Из Тбилиси — по трассе S1 (E60) до Самтредиа, затем по S12 до Григолети и по S2 на юг вдоль побережья
    через Кобулети и Батуми. За городом S2 проходит мимо аэропорта, пересекает Чорохи и идёт через Гонио;
    Квариати появится через несколько минут — всего около 388 км и шесть часов от Тбилиси. Дорога асфальтирована
    на всём протяжении и в хорошем состоянии, но узкая и летом загружена. Машину оставляйте у дороги или
    у гостевого дома (в сезон парковка платная). Заправляйтесь в Батуми. Автомобиля экономкласса вполне
    достаточно.
fa:
  name: کواریاتی
  short: 'جنوبی‌ترین ساحل باتومی: یک کیلومتر سنگ‌ریزه و آب زلال، جایی که کوه‌ها تا کنار دریا پیش می‌آیند.'
  body: >-
    **کواریاتی آخرین ساحل در محدوده‌ی شهر باتومی است: نواری به طول یک کیلومتر از سنگ‌ریزه، جایی که کوه‌ها
    چنان به دریا نزدیک می‌شوند که راه، هتل‌ها و دریا ناچارند لبهٔ باریکی را با هم شریک شوند.**


    تا چندی پیش، این‌جا بیش از روستایی کوچک نبود. در دوران شوروی در این گوشه از دشت کاخابری مرکبات و چای
    می‌کاشتند و در سال ۲۰۰۲ فقط ۹۸ نفر در کواریاتی زندگی می‌کردند. در سال ۲۰۱۱ این روستا به شهر باتومی
    پیوست و هتل‌ها به‌دنبال آن آمدند. بیشترشان در فاصلهٔ کمتر از صد متری از آب ایستاده‌اند؛ تازه‌سازها
    به دامنهٔ پرجنگل پشت سر بالا می‌روند.


    سنگ‌ریزه‌ها نکتهٔ اصلی‌اند. بزرگ، صاف و سنگین، برخلاف شن، آب را کدر نمی‌کنند؛ به همین دلیل دریا در
    کواریاتی زلال می‌ماند و بستر دریا به‌سرعت عمیق می‌شود. همین شفافیت و دنیای زیرآبی پرجنب‌وجوش، غواصان
    را به این ساحل کشانده و مرکز غواصی‌ای در آن فعالیت می‌کند.


    اگر طول ساحل را طی کنید، به هر دو انتهای آن می‌رسید. در شمال، ساحل بی‌هیچ فاصله‌ای به ساحل گونیو می‌پیوندد؛
    قلعهٔ گونیو حدود سه کیلومتر آن‌سوتر است. در جنوب، دماغه‌ای صخره‌ای آن را می‌بندد. آن‌سوی این صخره
    سارپی است، روستایی که پیمان قارص در سال ۱۹۲۱ آن را در طول جویبار کوچک توباشی به دو نیم کرد؛ همین خط
    هنوز مرز میان گرجستان و ترکیه است.


    تا غروب بمانید. در تابستان خورشید بر فراز دریای باز، در سمت غرب-شمال‌غربی، فرو می‌نشیند و ساحل ترکیه
    به سمت جنوب‌غربی پیچ می‌خورد و رشته‌کوه‌هایش یکی پس از دیگری در گرگ‌ومیش محو می‌شوند.
  tip: >-
    نیم روز کافی است، بیشتر اگر قصد شنا و غواصی سطحی داشته باشید. کفش آب‌ورزشی همراه ببرید: سنگ‌ریزهٔ
    خشک تا ظهر داغ می‌شود، سنگ‌ریزهٔ خیس لغزنده است، و بستر دریا به‌سرعت عمیق می‌شود، پس کودکان خرد را
    نزدیک نگه دارید. سایه فقط زیر چترهاست و صندلی‌های ساحلی هزینه‌ای جدا دارند. کافه‌های امتداد ساحل غذا
    می‌فروشند و سرویس‌های بهداشتی بیشتر داخل همان کافه‌هاست. سپتامبر بهترین زمان است، وقتی دریا هنوز گرم
    است و ازدحام رفته. درون حصار شناورها شنا کنید. قلعهٔ گونیو با ماشین پنج دقیقه فاصله دارد، اگر بخواهید
    کنار شنا کمی هم تاریخ ببینید.
  route: >-
    از تفلیس مسیر S1 (E60) را تا سامتردیا بروید، سپس S12 را تا گریگولتی، و آن‌گاه S2 را رو به جنوب در
    امتداد ساحل بروید و از کوبولتی و باتومی بگذرید. پس از شهر، S2 از کنار فرودگاه می‌گذرد، از رودخانهٔ
    چوروخی عبور می‌کند و از میان گونیو می‌گذرد؛ چند دقیقه بعد به کواریاتی می‌رسید، در حدود ۳۸۸ کیلومتری
    و شش ساعت از تفلیس. تمام مسیر آسفالت و در وضعیت خوبی است، اما باریک و در تابستان کند و پرترافیک می‌شود.
    ماشین را کنار راه یا نزد اقامتگاه پارک کنید (پارکینگ در فصل گردشگری پولی است). در باتومی باک را پر
    کنید. یک خودروی اقتصادی کافی است.
he:
  name: קווריאטי
  short: 'החוף הדרומי ביותר של בטומי: קילומטר של חלוקי אבן ומים צלולים, במקום שבו ההרים יורדים ממש עד
    הים.'
  body: >-
    **קווריאטי הוא החוף האחרון בתחום העירוני של בטומי: רצועת חלוקים בת קילומטר אחד, שבה ההרים מתקרבים
    כך שהכביש, בתי המלון והים חולקים מדף צר אחד.**


    עד לא מזמן זה היה בקושי כפר. בתקופה הסובייטית גידלו בפינה הזו של מישור קחברי הדרים ותה, ובשנת 2002
    חיו בקווריאטי רק 98 תושבים. בשנת 2011 סופח הכפר לעיר בטומי, ובעקבותיו הגיעו המלונות. רובם עומדים במרחק
    של מאה מטר מהמים לכל היותר; החדשים יותר מתפרשים במעלה המדרון המיוער שמאחור.


    החלוקים הם העיקר. גדולים, חלקים וכבדים, הם אינם מעכירים את המים כמו שהחול עושה, כך שהים ליד קווריאטי
    נשאר צלול והקרקעית משתפלת מהר לעומק. הצלילות הזו ועולם תת-מימי עשיר משכו צוללנים, ומרכז צלילה פועל
    על החוף.


    לכו לאורך החוף ותגיעו לשני קצותיו. בצפון הוא ממשיך בלי הפרעה לחוף גוניו, ומצודת גוניו במרחק של כשלושה
    קילומטרים. בדרום סוגר אותו כף סלעי. מעבר לסלע ההוא נמצא סארפי, הכפר שאמנת קארס משנת 1921 חצתה לשניים
    לאורך נחל טובאשי הצר; קו זה נותר עד היום הגבול בין גאורגיה לטורקיה.


    הישארו עד הערב. בקיץ השמש שוקעת מעל הים הפתוח, לכיוון מערב-צפון-מערב, בעוד חוף טורקיה מתעקל דרום-מערבה
    ורכסיו נמוגים אחד אחרי השני בדמדומים.
  tip: >-
    חצי יום מספיק, ויותר אם אתם שוחים וצוללים בשנורקל. הביאו נעלי מים: החלוקים היבשים צורבים בשעות הצהריים,
    הרטובים חלקלקים, והקרקעית משתפלת מהר, אז השגיחו על ילדים קטנים. הצללה יש רק מתחת למטריות, וכיסאות
    חוף עולים בנפרד. בתי הקפה לאורך החוף מוכרים אוכל, והשירותים בעיקר בתוכם. ספטמבר הוא הזמן הטוב ביותר,
    כשהים עדיין חם וההמונים כבר נעלמו. שחו בתחום המצופים. מצודת גוניו במרחק חמש דקות נסיעה, אם בא לכם
    קצת היסטוריה לצד הרחצה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) עד סמטרדיה, אחר כך S12 עד גריגולטי ו-S2 דרומה לאורך החוף, דרך קובולטי
    ובטומי. אחרי העיר עובר S2 סמוך לשדה התעופה, חוצה את נהר צ'ורוחי ועובר בגוניו; לקווריאטי תגיעו כמה
    דקות אחר כך, כ-388 ק"מ ושש שעות מטביליסי. הכביש סלול מקצה לקצה ובמצב טוב, אך צר ועמוס בתנועה בקיץ.
    השאירו את הרכב בצד הדרך או אצל האכסניה (חניה בתשלום בעונה). מלאו דלק בבטומי. רכב אקונומי מספיק בהחלט.
ar:
  name: كفارياتي
  short: 'أقصى شواطئ باتومي جنوبًا: كيلومتر من الحصى وماء صافٍ حيث تقترب الجبال من البحر حتى تلامسه تقريبًا.'
  body: >-
    **كفارياتي هو آخر شاطئ داخل حدود مدينة باتومي: شريط من الحصى طوله كيلومتر واحد، تقترب فيه الجبال من
    البحر حتى يضطر الطريق والفنادق والبحر إلى تقاسم حافة ضيقة واحدة.**


    قبل سنوات قليلة لم يكن المكان سوى قرية صغيرة بالكاد تُذكر. في العهد السوفيتي زُرعت الحمضيات والشاي
    في هذه الزاوية من سهل كاخابيري، وفي عام 2002 لم يكن يقطن كفارياتي سوى 98 نسمة. في عام 2011 ضُمّت القرية
    إلى مدينة باتومي، وتبعتها الفنادق. يقف معظمها على مسافة لا تزيد على مئة متر من الماء، بينما تتسلق
    الفنادق الأحدث المنحدر المكسو بالغابات في الخلف.


    الحصى هو جوهر المكان. حبّاته كبيرة وناعمة وثقيلة، فلا تُعكّر الماء كما يفعل الرمل، ولهذا يبقى البحر
    عند كفارياتي صافيًا وينحدر القاع بسرعة نحو العمق. هذا الصفاء وعالم تحت الماء نابض بالحياة جذبا الغواصين،
    ويعمل مركز غوص على الشاطئ.


    سِر على طول الشاطئ فتصل إلى طرفيه كليهما. شمالًا يتصل الشاطئ دون فاصل بشاطئ غونيو، وتقع قلعة غونيو
    على مسافة نحو ثلاثة كيلومترات. جنوبًا يغلقه رأس صخري. وخلف تلك الصخرة تقع ساربي، القرية التي شقّتها
    معاهدة قارص عام 1921 إلى نصفين على امتداد جدول توباشي الصغير؛ ولا يزال هذا الخط الحدّ الفاصل بين جورجيا
    وتركيا حتى اليوم.


    ابقَ حتى المساء. في الصيف تغرب الشمس فوق البحر المفتوح، جهة الغرب الشمالي الغربي، بينما ينحني الساحل
    التركي نحو الجنوب الغربي وتتلاشى سلاسله الجبلية الواحدة تلو الأخرى في الشفق.
  tip: >-
    يكفي نصف يوم، وأكثر إذا رغبت في السباحة والغطس بالأنبوب. احمل حذاءً مائيًا: يسخن الحصى الجاف عند الظهيرة،
    ويصبح الحصى المبلل زلقًا، وينحدر القاع بسرعة نحو العمق، فاحرص على أن يبقى الأطفال الصغار قريبين. لا
    يوجد ظل سوى تحت الشمسيات، ومقاعد الاستلقاء بأجر إضافي. تبيع المقاهي المنتشرة على الواجهة البحرية الطعام،
    ومعظم دورات المياه بداخلها. أفضل وقت هو سبتمبر، حين يبقى البحر دافئًا وتنصرف الحشود. اسبح داخل حدود
    العوامات. قلعة غونيو على خمس دقائق بالسيارة إن رغبت في إضافة قليل من التاريخ إلى سباحتك.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) إلى سامتريديا، ثم S12 إلى غريغوليتي، ثم S2 جنوبًا على امتداد الساحل
    عبر كوبوليتي وباتومي. بعد المدينة يمر الطريق S2 قرب المطار، ويعبر نهر تشوروخي، ويمرّ بغونيو؛ ويظهر
    كفارياتي بعد دقائق قليلة، على مسافة نحو 388 كم وست ساعات من تبليسي. الطريق مُعبّد بالكامل وبحالة جيدة،
    لكنه ضيق ومزدحم في الصيف. اترك السيارة على جانب الطريق أو عند مكان إقامتك (الوقوف بأجر في الموسم).
    عبّئ الوقود في باتومي. سيارة اقتصادية كافية تمامًا.
