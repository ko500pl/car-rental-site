ka:
  name: ცხრაჯვარი
  short: წმინდა გიორგის სალოცავი ცხრა ჯვრით ნაქერალას ქედზე — რაჭისა და იმერეთის საზღვრის ყველაზე პანორამული
    წერტილი.
  body: >-
    **ცხრაჯვარიდან, კარგ ამინდში, დასავლეთ საქართველო მთლიანად ფეხქვეშ გეშლება** — კოლხეთის დაბლობი შავ
    ზღვამდე ერთ მხარეს, კავკასიონის თეთრი კედელი მეორეზე. ნაქერალას ქედის კლდოვან კიდეზე, 1569 მეტრზე,
    წმინდა გიორგის სალოცავი დგას, რომელსაც სახელი ცხრა ჯვარმა დაარქვა.


    ლეგენდა ორია. ერთის მიხედვით, მამამ ომში გაშვებული ცხრა ვაჟისთვის ცხრა ჯვარი აზიდა მთაზე და შვილები
    უვნებლად დაუბრუნდნენ. მეორე სვანეთიდან გადმოხვეწილ სოფრომიანთ ძმებზე მოგვითხრობს, რომლებსაც მტრედმა
    მიუძღვა ამ მწვერვალამდე; მათი შთამომავლები, სოფრომაძეები, დღემდე მაისის ბოლო შაბათს "ცხრაჯვარობას"
    იხდიან და მთაზე მთელი უბნებით ადიან.


    გზა ასეთია: ტყიბულსა და ამბროლაურს შორის ნაქერალას უღელტეხილიდან ჯერ დაახლოებით 1 კმ გრუნტის გზა,
    შემდეგ 2 კმ ბილიკი კლდის პირას — საშუალო სირთულის, მაგრამ ხედებით ისეთი, რომ ყოველ ორ წუთში ჩერდები.
    ზემოთ სალოცავი, ჯვრები და მცირე გამოქვაბულია, ქვემოთ კი შაორის წყალსაცავის ლურჯი ზედაპირი და ნიკორწმინდის
    მხარე ჩანს.


    საუკეთესო დროა მაისიდან ოქტომბრამდე; ზამთარში ბილიკი თოვლიანია და კლდის პირას სახიფათო ხდება.
  tip: >-
    ბილიკი კლდის კიდეს მიუყვება — მოაჯირები არ არის, ბავშვებთან და ნისლში განსაკუთრებით ფრთხილად. საღამოს
    ან დილის ნისლი აქ წუთებში ადის, თან საწვიმარი და თბილი ფენა იქონიე. წყალი და საკვები წამოიღე, უღელტეხილზე
    არაფერი იყიდება. მაისის ბოლო შაბათს დღესასწაულია — ხალხმრავალი, მაგრამ ავთენტური დღე.
  route: >-
    თბილისიდან E60-ით ქუთაისის მიმართულებით, შემდეგ ტყიბულის გზაზე ახვევ და ნაქერალას უღელტეხილისკენ ადიხარ
    — ჯამში დაახლოებით 280 კმ და 4:30. ასფალტი უღელტეხილამდე მთლიანადაა, სერპენტინი ციცაბო, მაგრამ კარგ
    მდგომარეობაში. ბოლო 1 კმ გრუნტია — SUV-ით სალოცავის ბილიკამდე მიხვალ, ეკონომ-კლასით კი უღელტეხილზე
    გააჩერე და ფეხით განაგრძე. საწვავი ტყიბულში ჩაასხი.
en:
  name: Tskhrajvari
  short: >-
    The Nine Crosses shrine of St George on the Nakerala ridge — the most panoramic point on the Racha–Imereti
    border.
  body: >-
    **From Tskhrajvari, in clear weather, the whole of western Georgia lies at your feet** — the Colchis
    lowland running to the Black Sea on one side, the white wall of the Caucasus on the other. On a rocky
    lip of the Nakerala ridge, at 1,569 m, stands a shrine of St George that takes its name from nine
    crosses.


    There are two legends. In one, a father carried nine crosses up the mountain for his nine sons sent
    to war — and all nine came home unharmed. The other tells of the Sopromiani brothers, exiles from
    Svaneti, whom a dove led to this summit; their descendants, the Sopromadze family, still climb up
    en masse on the last Saturday of May for the "Tskhrajvaroba" festival.


    Getting there works like this: from the Nakerala Pass on the Tkibuli–Ambrolauri road, first about
    1 km of dirt track, then a 2 km footpath along the cliff edge — moderate walking, with views that
    stop you every couple of minutes. At the top are the shrine, the crosses and a small cave; below shines
    the blue sheet of the Shaori reservoir and the Nikortsminda plateau.


    Best from May to October; in winter the trail is snowbound and the cliff-edge sections turn genuinely
    risky.
  tip: >-
    The path follows an unfenced cliff edge — take real care with children and in fog, which can roll
    up here in minutes. Carry a rain shell and a warm layer even in summer, plus water and food, since
    nothing is sold at the pass. On the last Saturday of May the shrine festival fills the mountain —
    crowded, but a genuinely authentic day out.
  route: >-
    From Tbilisi follow the E60 towards Kutaisi, then turn off for Tkibuli and climb to the Nakerala Pass
    — about 280 km and 4 hours 30 in total. Asphalt runs all the way to the pass; the serpentine is steep
    but in decent shape. The final 1 km is dirt track: an SUV gets you to the start of the footpath, while
    with an economy car you simply park at the pass and walk. Refuel in Tkibuli.
ru:
  name: Цхраджвари
  short: >-
    Святилище святого Георгия «Девять крестов» на хребте Накерала — самая панорамная точка на границе
    Рачи и Имерети.
  body: >-
    **С Цхраджвари в ясную погоду вся Западная Грузия лежит у ваших ног** — Колхидская низменность до
    самого Чёрного моря с одной стороны и белая стена Кавказа с другой. На скалистом краю хребта Накерала,
    на высоте 1569 м, стоит святилище святого Георгия, названное по девяти крестам.


    Легенды две. По одной, отец поднял на гору девять крестов за девятерых сыновей, ушедших на войну,
    — и все девять вернулись невредимыми. Другая рассказывает о братьях Сопромиани, беженцах из Сванети,
    которых на эту вершину привёл голубь; их потомки, род Сопромадзе, до сих пор в последнюю субботу мая
    поднимаются сюда целыми семьями на праздник «Цхраджвароба».


    Добираться так: от перевала Накерала на дороге Ткибули–Амбролаури сначала около 1 км грунтовки, затем
    2 км тропы вдоль кромки обрыва — идти несложно, но виды заставляют останавливаться каждые пару минут.
    Наверху — святилище, кресты и небольшая пещера, внизу блестит синяя гладь Шаорского водохранилища
    и плато Никорцминды.


    Лучшее время — с мая по октябрь; зимой тропа под снегом, и участки вдоль обрыва становятся по-настоящему
    опасными.
  tip: >-
    Тропа идёт по неограждённой кромке обрыва — будьте особенно осторожны с детьми и в туман, который
    поднимается сюда за считаные минуты. Даже летом возьмите дождевик и тёплый слой, а также воду и еду:
    на перевале ничего не продаётся. В последнюю субботу мая здесь праздник — многолюдно, зато по-настоящему
    аутентично.
  route: >-
    Из Тбилиси по E60 в сторону Кутаиси, затем поворот на Ткибули и подъём к перевалу Накерала — всего
    около 280 км и 4,5 часа. Асфальт доходит до самого перевала, серпантин крутой, но в приличном состоянии.
    Последний километр — грунтовка: на SUV доедете до начала тропы, на эконом-классе просто оставьте машину
    на перевале и идите пешком. Заправьтесь в Ткибули.
fa:
  name: تسخراجواری
  short: زیارتگاه «نُه صلیب» قدیس گئورگی بر خط‌الرأس ناکرالا — پانورامیک‌ترین نقطهٔ مرز راچا و ایمرتی.
  body: >-
    **از تسخراجواری، در هوای صاف، همهٔ غرب گرجستان زیر پای شماست** — از یک سو جلگهٔ کلخیس تا دریای سیاه
    و از سوی دیگر دیوار سپید قفقاز. بر لبهٔ صخره‌ای خط‌الرأس ناکرالا، در ارتفاع ۱۵۶۹ متر، زیارتگاه قدیس
    گئورگی ایستاده که نامش را از نُه صلیب گرفته است.


    دو افسانه هست. در یکی، پدری برای نُه پسرش که به جنگ رفته بودند نُه صلیب بر دوش تا قله برد — و هر نُه
    سالم بازگشتند. دیگری از برادران سوپرومیانی می‌گوید، پناهندگانی از سوانتی، که کبوتری آنها را به این
    قله رهنمون شد؛ بازماندگانشان، خاندان سوپرومادزه، هنوز آخرین شنبهٔ ماه مه برای جشن «تسخراجواروبا» گروهی
    بالا می‌آیند.


    مسیر چنین است: از گردنهٔ ناکرالا در جادهٔ تکیبولی–آمبرولائوری، نخست حدود یک کیلومتر راه خاکی و سپس
    دو کیلومتر کوره‌راه در امتداد لبهٔ پرتگاه — پیاده‌روی متوسط، با چشم‌اندازهایی که هر دو دقیقه نگهتان
    می‌دارد. بالا، زیارتگاه و صلیب‌ها و غاری کوچک است؛ پایین، پهنهٔ آبی دریاچهٔ سد شائوری و فلات نیکورتسمیندا
    می‌درخشد.


    بهترین زمان از مه تا اکتبر است؛ در زمستان مسیر زیر برف می‌رود و بخش‌های لب پرتگاه به‌راستی خطرناک
    می‌شوند.
  tip: >-
    کوره‌راه در امتداد لبهٔ پرتگاهِ بی‌حفاظ می‌رود — با کودکان و در مه، که اینجا در چند دقیقه بالا می‌آید،
    بسیار محتاط باشید. حتی در تابستان بادگیر و لایهٔ گرم بردارید، و نیز آب و خوراکی، چون در گردنه چیزی
    فروخته نمی‌شود. آخرین شنبهٔ مه جشن زیارتگاه است — شلوغ اما به‌راستی اصیل.
  route: >-
    از تفلیس با E60 به سمت کوتائیسی، سپس به جادهٔ تکیبولی بپیچید و تا گردنهٔ ناکرالا بالا بروید — روی‌هم
    حدود ۲۸۰ کیلومتر و چهار ساعت و نیم. آسفالت تا خود گردنه ادامه دارد؛ پیچ‌ها تند اما جاده قابل‌قبول
    است. یک کیلومتر آخر خاکی است: با شاسی‌بلند تا ابتدای کوره‌راه می‌رسید و با خودروی اقتصادی کافی است
    در گردنه پارک کنید و پیاده بروید. در تکیبولی سوخت‌گیری کنید.
he:
  name: צחראג'ווארי
  short: מקדש "תשעת הצלבים" של גאורגי הקדוש על רכס נאקראלה — נקודת התצפית הפנורמית ביותר בגבול ראצ'ה–אימרתי.
  body: >-
    **מצחראג'ווארי, במזג אוויר בהיר, כל מערב גאורגיה פרושה לרגליכם** — שפלת קולכיס עד הים השחור מצד אחד,
    והחומה הלבנה של הקווקז מצד שני. על שפה סלעית של רכס נאקראלה, בגובה 1,569 מ', עומד מקדש של גאורגי הקדוש
    שקיבל את שמו מתשעה צלבים.


    שתי אגדות מסופרות כאן. באחת, אב נשא אל ההר תשעה צלבים עבור תשעת בניו שיצאו למלחמה — וכל התשעה שבו
    בשלום. האחרת מספרת על האחים סופרומיאני, גולים מסוונטי, שיונה הובילה אותם אל הפסגה הזו; צאצאיהם, משפחת
    סופרומאדזה, עולים לכאן עד היום בהמוניהם בשבת האחרונה של מאי לחג ה"צחראג'ווארובה".


    וכך מגיעים: ממעבר נאקראלה שבדרך טקיבולי–אמברולאורי, תחילה כקילומטר של דרך עפר, ואחריו שביל של 2 ק"מ
    לאורך שפת המצוק — הליכה בינונית, עם נופים שעוצרים אתכם כל שתי דקות. למעלה — המקדש, הצלבים ומערה קטנה;
    למטה מנצנץ המשטח הכחול של מאגר שאורי ורמת ניקורצמינדה.


    הזמן הטוב ביותר — ממאי עד אוקטובר; בחורף השביל מושלג, וקטעי שפת המצוק נעשים מסוכנים באמת.
  tip: >-
    השביל הולך לאורך שפת מצוק לא מגודרת — היזהרו במיוחד עם ילדים ובערפל, שמטפס לכאן בתוך דקות. גם בקיץ
    קחו מעיל גשם ושכבה חמה, וכן מים ואוכל — במעבר לא נמכר דבר. בשבת האחרונה של מאי מתקיים כאן חג ההר —
    צפוף, אבל יום אותנטי באמת.
  route: >-
    מטביליסי ב-E60 לכיוון קוטאיסי, ואז פנייה לטקיבולי ועלייה למעבר נאקראלה — בסך הכול כ-280 ק"מ וכ-4:30
    שעות. האספלט מגיע עד המעבר עצמו; הסרפנטינה תלולה אך במצב סביר. הקילומטר האחרון הוא דרך עפר: רכב שטח
    קל מביא אתכם לתחילת השביל, ועם רכב חסכוני פשוט חנו במעבר ולכו ברגל. תדלקו בטקיבולי.
ar:
  name: تسخراجفاري
  short: مزار «الصلبان التسعة» للقديس جرجس على حافة سلسلة ناكيرالا — أكثر نقاط الحدود بين راتشا وإيميريتي
    بانورامية.
  body: >-
    **من تسخراجفاري، في الطقس الصافي، يمتد غرب جورجيا كله تحت قدميك** — سهل كولخيس حتى البحر الأسود من
    جهة، وجدار القوقاز الأبيض من جهة أخرى. على حافة صخرية من سلسلة ناكيرالا، على ارتفاع 1569 متراً، يقوم
    مزار للقديس جرجس أخذ اسمه من تسعة صلبان.


    وللمكان أسطورتان. تقول الأولى إن أباً حمل تسعة صلبان إلى قمة الجبل من أجل أبنائه التسعة الذين ذهبوا
    إلى الحرب — فعاد التسعة سالمين. وتروي الثانية قصة الإخوة سوبروميّاني، المهاجرين من سفانيتي، الذين
    قادتهم حمامة إلى هذه القمة؛ وما زال أحفادهم، عائلة سوبرومادزه، يصعدون جماعات في آخر سبت من مايو لعيد
    «تسخراجفاروبا».


    أما الوصول فهكذا: من ممر ناكيرالا على طريق تكيبولي–أمبرولاوري، نحو كيلومتر من طريق ترابي أولاً، ثم
    درب مشي طوله كيلومتران على حافة الجرف — مشي متوسط الصعوبة، بمناظر توقفك كل دقيقتين. في الأعلى المزار
    والصلبان وكهف صغير؛ وفي الأسفل يلمع سطح خزان شاوري الأزرق وهضبة نيكورتسميندا.


    أفضل وقت من مايو إلى أكتوبر؛ ففي الشتاء يغطي الثلج الدرب وتصبح مقاطع حافة الجرف خطرة حقاً.
  tip: >-
    يسير الدرب على حافة جرف بلا سياج — فاحذر جداً مع الأطفال وفي الضباب الذي يصعد إلى هنا في دقائق. خذ
    معطف مطر وطبقة دافئة حتى في الصيف، وماءً وطعاماً كذلك، فلا شيء يُباع عند الممر. وفي آخر سبت من مايو
    يقام عيد المزار — مزدحم، لكنه يوم أصيل بحق.
  route: >-
    من تبليسي عبر E60 باتجاه كوتايسي، ثم انعطف نحو تكيبولي واصعد إلى ممر ناكيرالا — نحو 280 كم و4 ساعات
    ونصف إجمالاً. الأسفلت ممتد حتى الممر نفسه؛ والمنعطفات حادة لكن الطريق بحالة مقبولة. الكيلومتر الأخير
    ترابي: بسيارة الدفع الرباعي تصل إلى بداية درب المشي، وبالسيارة الاقتصادية أوقف ببساطة عند الممر وتابع
    سيراً. تزوّد بالوقود في تكيبولي.
