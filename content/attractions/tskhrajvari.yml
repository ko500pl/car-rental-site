ka:
  name: ცხრაჯვარი
  short: >-
    წმინდა გიორგის სალოცავი და ცხრა ჯვარი ნაქერალას უღელტეხილის თავზე, კლდის პირას — იქიდან დასავლეთ საქართველო
    ზღვამდე მოჩანს.
  body: >-
    **ცხრაჯვარზე მოწმენდილ დილას მთის ერთი მხრიდან შავი ზღვა ჩანს, მეორიდან — კავკასიონის თოვლი.**


    მწვერვალი ნაქერალას ქედზე, ზღვის დონიდან 1569 მეტრზე აზიდულა — იქ, სადაც იმერეთი რაჭას ხვდება; თავად
    სალოცავი იმერეთის მხარეს, ტყიბულის მუნიციპალიტეტშია. სახელი ცხრა ჯვრისგან მიიღო, სალოცავი კი წმინდა
    გიორგისაა.


    ამ სახელს ორი გადმოცემა ხსნის. უფრო ცნობილის მიხედვით, მამამ, რომლის ცხრა ვაჟიც ომში იყო წასული (ზოგი
    მთხრობელი ამ ამბავს მეორე მსოფლიო ომს უკავშირებს), აღთქმა დადო: მთაზე ცხრა ჯვარს ავიტან და სალოცავს
    ავაშენებო. ცხრავე შვილი შინ უვნებელი დაბრუნდა. მეორე გადმოცემა სოფრომაძეების ოჯახს ეკუთვნის: მათ მიერ
    გაშვებული მტრედი ამ მწვერვალზე დაჯდა, თემმა კი სალოცავის ქვები მთაზე ხელით აზიდა. მაისის ბოლო შაბათს
    ოჯახი დღემდე „ცხრაჯვარობას“ იხდის და იმ დღეს ხორცს არ ჭამს.


    ასასვლელი მოკლეა, მაგრამ შეცდომას არ გაპატიებთ. ნაქერალას უღელტეხილიდან კილომეტრზე ნაკლები გრუნტის
    გზაა, შემდეგ კი დაახლოებით ორკილომეტრიანი ბილიკი კლდის ნაპირს მიუყვება — საშუალო სირთულის, ისეთი ციცაბოთი
    გვერდით, რომ თვალი თავისთავად ფეხქვეშ გირბით. ზემოთ სალოცავი და ჯვრები დაგხვდებათ, მახლობლად კი მღვიმეც
    აღმოაჩინეს. დასავლეთით კოლხეთის დაბლობი ზღვისკენ იშლება, რაჭის მხარეს კი შაორის წყალსაცავი მოჩანს.


    ცხრა ჯვარი ცხრა ვაჟისთვის — საქართველოში ცოტა მწვერვალი თუ ინახავს ამდენ მადლიერებას ასე პატარა კლდეზე.
  tip: >-
    ბილიკი მოაჯირის გარეშე მიუყვება კლდის პირს: ბავშვებს ხელი არ გაუშვათ, ღრუბელი თუ ჩამოწვა და კიდე აღარ
    ჩანს, უკან დაბრუნდით. ჩაიცვით ნამდვილი სალაშქრო ფეხსაცმელი — ადგილობრივი ტურისტული სამსახურიც სალაშქრო
    აღჭურვილობას გირჩევთ. წყალი, საგზალი და თბილი ფენა თან იქონიეთ: უღელტეხილზე არაფერი იყიდება, ქედზე
    კი ქარი ზაფხულშიც კბენს. სეზონი მაისიდან ოქტომბრამდეა; ზამთარში თოვლი ბილიკს სახიფათოს ხდის. მაისის
    ბოლო შაბათს მთა ხალხით ივსება — ადრე მიდით, ან სიჩუმისთვის სხვა დღე აირჩიეთ.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით დაახლოებით 190 კმ იარეთ, ქუთაისში შესვლამდე გადაუხვიეთ და შ19-ით
    თერჯოლის გავლით ტყიბულამდე მიდით, იქიდან კი ქუთაისი–ტყიბული–ამბროლაურის გზით (შ17) ნაქერალას უღელტეხილზე
    ადით. სულ დაახლოებით 240 კმ და ოთხი საათია. ასფალტი უღელტეხილამდეა, სერპანტინი ციცაბოა, მაგრამ კარგ
    მდგომარეობაში. ბილიკის დასაწყისამდე ბოლო კილომეტრი გრუნტია: ჯიპი უპრობლემოდ ავა, ეკონომ-კლასის მანქანა
    კი უღელტეხილზე დატოვეთ და ფეხით განაგრძეთ. საწვავი ტყიბულში ჩაასხით.
en:
  name: Tskhrajvari
  short: >-
    A shrine of St George and nine crosses on a cliff-edge summit above the Nakerala Pass, looking over
    western Georgia towards the sea.
  body: >-
    **On a clear morning at Tskhrajvari you can see the Black Sea from one side of the mountain and the
    snows of the Caucasus from the other.**


    The summit rises to 1,569 metres on the Nakerala ridge, where Imereti meets Racha; the shrine itself
    stands on the Imereti side, in Tkibuli Municipality. Its name means "Nine Crosses", and it belongs
    to St George.


    Two stories explain the name, and both are told as legends. In the better-known one, a father whose
    nine sons had gone to war (some tellers set it in the Second World War) vowed to carry nine crosses
    up the mountain and build a shrine there. All nine sons came home. The second story belongs to the
    Sopromadze family: a dove they released came to rest on this summit, and the community carried the
    stones for the shrine up by hand. On the last Saturday of May the family still keeps Tskhrajvaroba,
    the shrine's feast, and eats no meat that day.


    The way up is short and unforgiving. From the Nakerala Pass a dirt road of under a kilometre brings
    you to a path of about two kilometres that runs along the lip of a cliff: moderate going, with a drop
    that keeps your eyes on your boots. At the top wait the shrine and its crosses; a cave has been found
    nearby. Look down and the Colchis lowland spreads westwards towards the sea; on the Racha side lies
    the Shaori reservoir.


    Nine crosses for nine sons: few summits in Georgia carry so much gratitude on so little rock.
  tip: >-
    The path follows an unfenced cliff edge, so keep children close and turn back if cloud rolls in and
    you lose sight of the edge. Wear proper walking boots; the local tourism office recommends hiking
    gear rather than trainers. Bring water, food and a warm layer — nothing is sold at the pass, and the
    wind on the ridge bites even in summer. May to October is the season; in winter snow makes the ledge
    dangerous. On the last Saturday of May the feast fills the mountain: go early for a parking spot,
    or come another day for silence.
  route: >-
    From Tbilisi take the E60 (S1) west for about 190 km, leave it before Kutaisi and follow the Sh19
    through Terjola to Tkibuli, then the Sh17 Kutaisi–Tkibuli–Ambrolauri road up to the Nakerala Pass.
    It is about 240 km and four hours in all. Asphalt runs to the pass; the serpentine is steep but in
    decent shape. The final kilometre to the start of the footpath is dirt: an SUV makes it easily, while
    in an economy car you simply park at the pass and walk. Refuel in Tkibuli.
ru:
  name: Цхраджвари
  short: >-
    Святилище святого Георгия и девять крестов на вершине у края обрыва над перевалом Накерала — с видом
    на Западную Грузию до самого моря.
  body: >-
    **Ясным утром с Цхраджвари по одну сторону горы видно Чёрное море, а по другую — снега Кавказа.**


    Вершина поднимается на 1569 метров на хребте Накерала, там, где Имеретия сходится с Рачей; само святилище
    стоит на имеретинской стороне, в Ткибульском муниципалитете. Название означает «Девять крестов», а
    посвящено святилище святому Георгию.


    Имя объясняют две истории, и обе рассказывают как легенды. В самой известной отец, девять сыновей
    которого ушли на войну (иные рассказчики относят это ко Второй мировой), дал обет поднять на гору
    девять крестов и построить там святилище. Все девять сыновей вернулись домой. Вторая история принадлежит
    роду Сопромадзе: отпущенный ими голубь опустился на эту вершину, и община подняла камни для святилища
    на руках. В последнюю субботу мая семья до сих пор празднует Цхраджвароба — праздник святилища — и
    в этот день не ест мяса.


    Путь наверх короткий, но ошибок не прощает. От перевала Накерала грунтовка длиной меньше километра
    выводит к тропе километра в два, которая идёт по самой кромке обрыва: нагрузка умеренная, а пропасть
    сбоку заставляет смотреть под ноги. Наверху ждут святилище и его кресты; неподалёку обнаружена пещера.
    Посмотрите вниз — на запад, к морю, раскинулась Колхидская низменность; на рачинской стороне лежит
    Шаорское водохранилище.


    Девять крестов за девять сыновей: немногие вершины Грузии несут столько благодарности на таком клочке
    скалы.
  tip: >-
    Тропа идёт по краю обрыва без ограждений: держите детей рядом и поворачивайте назад, если наползает
    облако и вы перестаёте видеть край. Надевайте настоящие треккинговые ботинки — местный туристический
    офис советует походную обувь, а не кроссовки. Возьмите воду, еду и тёплую кофту: на перевале ничего
    не продают, а ветер на гребне пробирает даже летом. Сезон — с мая по октябрь; зимой снег делает карниз
    опасным. В последнюю субботу мая гору заполняет праздник: приезжайте пораньше, чтобы найти место для
    машины, или выберите другой день ради тишины.
  route: >-
    Из Тбилиси по E60 (S1) на запад около 190 км, сверните, не доезжая Кутаиси, и по Sh19 через Терджолу
    доезжайте до Ткибули, а затем по Sh17 (Кутаиси — Ткибули — Амбролаури) поднимайтесь к перевалу Накерала.
    Всего около 240 км и четыре часа. До перевала асфальт; серпантин крутой, но в приличном состоянии.
    Последний километр до начала пешей тропы — грунт: внедорожник проедет его без труда, а на машине эконом-класса
    просто оставьте её на перевале и идите пешком. Заправьтесь в Ткибули.
fa:
  name: تسخراجواری
  short: >-
    زیارتگاه قدیس گئورگی و نُه صلیب بر قله‌ای لب پرتگاه بالای گردنهٔ ناکرالا، با چشم‌اندازی بر غرب گرجستان
    تا دریا.
  body: >-
    **در صبحی صاف، از تسخراجواری از یک سوی کوه دریای سیاه پیداست و از سوی دیگر برف‌های قفقاز.**


    قله بر یال ناکرالا، جایی که ایمرتی به راچا می‌رسد، تا ۱,۵۶۹ متر بالا می‌رود؛ خود زیارتگاه در سوی ایمرتی،
    در شهرستان تکیبولی، ایستاده است. نامش یعنی «نُه صلیب» و از آنِ قدیس گئورگی است.


    دو داستان این نام را توضیح می‌دهند و هر دو را همچون افسانه بازمی‌گویند. در داستان مشهورتر، پدری که
    نُه پسرش به جنگ رفته بودند (برخی راویان آن را در جنگ جهانی دوم می‌گذارند) نذر کرد نُه صلیب را به کوه
    ببرد و آنجا زیارتگاهی بسازد. هر نُه پسر به خانه بازگشتند. داستان دوم از آنِ خاندان سوپرومادزه است:
    کبوتری که رها کرده بودند بر این قله نشست، و اهالی سنگ‌های زیارتگاه را با دست به بالا بردند. خاندان
    هنوز در آخرین شنبهٔ ماه مه «تسخراجواروبا»، جشن زیارتگاه، را برپا می‌دارد و آن روز گوشت نمی‌خورد.


    راه بالا کوتاه است و بی‌گذشت. از گردنهٔ ناکرالا جاده‌ای خاکی به طول کمتر از یک کیلومتر شما را به کوره‌راهی
    حدود دوکیلومتری می‌رساند که درست از لبهٔ پرتگاه می‌گذرد: سختی‌اش متوسط است، اما پرتگاه کنار دستتان
    چشم‌هایتان را روی کفش‌هایتان نگه می‌دارد. بالا، زیارتگاه و صلیب‌هایش چشم‌به‌راه‌اند؛ در نزدیکی آن
    غاری هم یافته‌اند. پایین را نگاه کنید: دشت کلخیس رو به غرب تا دریا گسترده است و در سوی راچا مخزن شائوری
    آرمیده است.


    نُه صلیب برای نُه پسر: کمتر قله‌ای در گرجستان این‌همه سپاس را بر چنین تکه‌سنگ کوچکی نگه داشته است.
  tip: >-
    کوره‌راه از لبهٔ پرتگاهی بی‌حفاظ می‌گذرد؛ بچه‌ها را نزدیک خود نگه دارید و اگر ابر رسید و لبه را دیگر
    ندیدید، برگردید. پوتین کوهپیمایی درست‌وحسابی بپوشید؛ دفتر گردشگری محلی هم تجهیزات کوهپیمایی را به‌جای
    کفش ورزشی توصیه می‌کند. آب، خوراک و یک لایه لباس گرم بیاورید؛ در گردنه چیزی فروخته نمی‌شود و باد روی
    یال حتی در تابستان گزنده است. فصل مناسب از مه تا اکتبر است؛ در زمستان برف این لبهٔ باریک را خطرناک
    می‌کند. در آخرین شنبهٔ مه جشن کوه را پر می‌کند: برای یافتن جای پارک زود بروید، یا برای سکوت روز دیگری
    بیایید.
  route: >-
    از تفلیس حدود ۱۹۰ کیلومتر با E60 (S1) به سمت غرب بروید، پیش از کوتائیسی از آن خارج شوید و با Sh19
    از ترجولا بگذرید تا تکیبولی، سپس جادهٔ Sh17 کوتائیسی–تکیبولی–آمبرولائوری را تا گردنهٔ ناکرالا بالا
    بروید. روی هم حدود ۲۴۰ کیلومتر و چهار ساعت. تا گردنه آسفالت است؛ جادهٔ پیچ‌درپیچ شیب تندی دارد اما
    وضعش بد نیست. یک کیلومتر آخر تا سر کوره‌راه خاکی است: شاسی‌بلند به‌راحتی می‌رود، و با خودروی اقتصادی
    کافی است در گردنه پارک کنید و پیاده بروید. در تکیبولی سوخت بگیرید.
he:
  name: צחראג׳ווארי
  short: מקדש של גאורגיוס הקדוש ותשעה צלבים על פסגה בשפת מצוק מעל מעבר נקרלה, הצופה על מערב גאורגיה עד
    הים.
  body: >-
    **בבוקר בהיר רואים מצחראג׳ווארי את הים השחור מצדו האחד של ההר ואת שלגי הקווקז מצדו האחר.**


    הפסגה מתנשאת לגובה 1,569 מטר על רכס נקרלה, במקום שבו אימרתי פוגשת את רצ׳ה; המקדש עצמו עומד בצד של
    אימרתי, במחוז טקיבולי. שמו פירושו "תשעה צלבים", והוא מוקדש לגאורגיוס הקדוש.


    שני סיפורים מסבירים את השם, ושניהם מסופרים כאגדות. בסיפור הידוע יותר, אב שתשעת בניו יצאו למלחמה (יש
    המספרים שהיה זה במלחמת העולם השנייה) נדר לשאת תשעה צלבים אל ההר ולבנות שם מקדש. כל תשעת הבנים שבו
    הביתה. הסיפור השני שייך למשפחת סופרומדזה: יונה ששחררו נחה על הפסגה הזאת, ובני הקהילה נשאו את אבני
    המקדש במעלה ההר בידיים. בשבת האחרונה של מאי המשפחה עדיין חוגגת את צחראג׳וורובה, חג המקדש, ואינה אוכלת
    בו בשר.


    הדרך למעלה קצרה ואינה סלחנית. ממעבר נקרלה מובילה דרך עפר של פחות מקילומטר אל שביל של כשני קילומטרים
    הצמוד לשפת מצוק: מאמץ בינוני, עם תהום שמשאירה את עיניכם על הנעליים. בפסגה מחכים המקדש וצלביו; בסמוך
    נמצאה מערה. הביטו למטה: שפלת קולכיס נפרשת מערבה לעבר הים, ובצד של רצ׳ה שוכן מאגר שאורי.


    תשעה צלבים לתשעה בנים: מעט פסגות בגאורגיה נושאות כל כך הרבה הכרת תודה על כל כך מעט סלע.
  tip: >-
    השביל עובר לאורך שפת מצוק לא מגודרת, אז החזיקו את הילדים קרוב וחזרו על עקבותיכם אם יורד ענן ואתם כבר
    לא רואים את השפה. נעלו נעלי הליכה אמיתיות; משרד התיירות המקומי ממליץ על ציוד טיולים ולא על נעלי ספורט.
    קחו מים, אוכל ושכבה חמה – במעבר לא מוכרים דבר, והרוח על הרכס נושכת גם בקיץ. העונה היא ממאי עד אוקטובר;
    בחורף השלג הופך את שפת המצוק הצרה למסוכנת. בשבת האחרונה של מאי החג ממלא את ההר: הגיעו מוקדם כדי למצוא
    חניה, או בואו ביום אחר בשביל השקט.
  route: >-
    מטביליסי סעו בכביש E60 (S1) מערבה כ-190 ק״מ, צאו ממנו לפני קוטאיסי והמשיכו בכביש Sh19 דרך טרג׳ולה
    עד טקיבולי, ומשם בכביש Sh17 (קוטאיסי–טקיבולי–אמברולאורי) במעלה ההר עד מעבר נקרלה. בסך הכול כ-240 ק״מ
    וארבע שעות. הכביש סלול עד המעבר; הסרפנטינות תלולות אך במצב סביר. הקילומטר האחרון עד תחילת השביל הרגלי
    הוא דרך עפר: רכב שטח עובר אותו בקלות, וברכב אקונומי פשוט חונים במעבר וממשיכים ברגל. תדלקו בטקיבולי.
ar:
  name: تسخراجفاري
  short: مزار للقديس جاورجيوس وتسعة صلبان على قمة عند حافة جرف فوق ممر ناكيرالا، تطل على غرب جورجيا حتى
    البحر.
  body: >-
    **في صباح صافٍ ترى من تسخراجفاري البحرَ الأسود من جانب الجبل، وثلوجَ القوقاز من جانبه الآخر.**


    ترتفع القمة إلى 1569 متراً على سلسلة ناكيرالا، حيث تلتقي إيميريتي براتشا؛ أما المزار نفسه فيقوم على
    الجانب الإيميريتي، في بلدية تكيبولي. ومعنى اسمه «الصلبان التسعة»، وهو مكرّس للقديس جاورجيوس.


    حكايتان تفسّران الاسم، وكلتاهما تُروى على أنها أسطورة. في الأشهر منهما، نذر أبٌ ذهب أبناؤه التسعة
    إلى الحرب (ويجعلها بعض الرواة في الحرب العالمية الثانية) أن يحمل تسعة صلبان إلى الجبل ويبني هناك مزاراً.
    فعاد الأبناء التسعة جميعاً إلى البيت. أما الحكاية الثانية فلآل سوبرومادزه: حمامة أطلقوها حطّت على
    هذه القمة، فحمل أهل الجماعة حجارة المزار إلى الأعلى بأيديهم. وفي آخر سبت من شهر مايو ما زالت العائلة
    تحيي «تسخراجفاروبا»، عيد المزار، ولا تأكل اللحم في ذلك اليوم.


    الطريق إلى القمة قصير لكنه لا يرحم. من ممر ناكيرالا يوصلك طريق ترابي لا يبلغ كيلومتراً إلى درب طوله
    نحو كيلومترين يسير على شفا جرف: جهده معتدل، لكن الهاوية بجانبه تُبقي عينيك على حذائك. وفي الأعلى ينتظرك
    المزار وصلبانه؛ وقد اكتُشف كهف على مقربة منه. انظر إلى الأسفل: سهل كولخيس يمتد غرباً نحو البحر، وعلى
    جانب راتشا يرقد خزان شاوري.


    تسعة صلبان لتسعة أبناء: قليلة هي قمم جورجيا التي تحمل كل هذا الامتنان على هذا القدر الضئيل من الصخر.
  tip: >-
    يسير الدرب على حافة جرف بلا سياج، فأبقِ الأطفال قريبين منك، وعُد أدراجك إن زحفت الغيوم ولم تعد ترى
    الحافة. انتعل حذاء مشي حقيقياً؛ فمكتب السياحة المحلي يوصي بعدّة المشي الجبلي لا بالأحذية الرياضية.
    احمل الماء والطعام وطبقة ثياب دافئة، فلا شيء يُباع عند الممر، والريح على السلسلة لاذعة حتى في الصيف.
    الموسم من مايو إلى أكتوبر؛ وفي الشتاء يجعل الثلج الحافة الضيقة خطرة. وفي آخر سبت من مايو يملأ العيدُ
    الجبل: بكّر لتجد مكاناً لسيارتك، أو تعالَ في يوم آخر طلباً للسكينة.
  route: >-
    من تبليسي خذ الطريق E60 (S1) غرباً نحو 190 كم، واخرج منه قبل كوتايسي لتتبع الطريق Sh19 عبر تيرجولا
    حتى تكيبولي، ثم اصعد بالطريق Sh17 (كوتايسي–تكيبولي–أمبرولاوري) إلى ممر ناكيرالا. المجموع نحو 240 كم
    وأربع ساعات. الطريق معبّد حتى الممر، والمنعطفات شديدة الانحدار لكنها في حال مقبولة. أما الكيلومتر
    الأخير حتى بداية درب المشاة فترابي: تجتازه السيارة رباعية الدفع بسهولة، ومع السيارة الاقتصادية يكفي
    أن تركنها عند الممر وتكمل سيراً. تزوّد بالوقود في تكيبولي.
