ka:
  name: აბულის ციხე
  short: >-
    ბრინჯაოს ხანის ციხე დუღაბის გარეშე ნაწყობი ბაზალტისგან, 2670 მეტრზე, პატარა აბულზე, ფარავნის თავზე;
    არასოდეს გათხრილა და დღემდე ამოუცნობია.
  body: >-
    **დაახლოებით 3500 წლის წინ ადამიანებმა პატარა აბულის ფერდზე ბაზალტის ლოდები აზიდეს და დუღაბის გარეშე
    ისეთ კედლებად ააწყვეს, რომ ზოგან დღესაც ხუთი მეტრის სიმაღლისაა.**


    აბულის ციხე პატარა აბულის მთის სამხრეთ ფერდზე, დაახლოებით 2670 მეტრზე, ჯავახეთის ვულკანურ მაღლობზე
    მდებარეობს. ეს ციკლოპური ციხე-სიმაგრეა: ცენტრალური ციტადელი დაახლოებით 60×40 მეტრია, მასში სამხრეთიდან
    და აღმოსავლეთიდან ორი კარი შედის, მშრალად ნაწყობი კედლები კი ხუთ მეტრამდე სიმაღლისა და სამ მეტრამდე
    სისქისაა. აღმოსავლეთით საცხოვრებლებისა და სამალავების ლაბირინთი იშლება, ზოგი ორ-სამ იარუსად, ციხის
    შიგნით კი ორმოცამდე ქვის სადგომია. სამხრეთ ფერდზე წყარო ამოდის — ალბათ ამის წყალობით შეიძლებოდა საერთოდ
    ამ სიმაღლის შენარჩუნება.


    რისთვის აშენდა, დღემდე ღია კითხვაა. აბულში გათხრები არასოდეს ჩატარებულა, ამიტომ მას შედარებით ათარიღებენ:
    არქეოლოგები მას, ფარავანთან მდგარი მისი „დის“, შაორის ციხის მსგავსად, შუა და გვიანი ბრინჯაოს ხანას
    მიაკუთვნებენ, როცა სამხრეთ კავკასიაში ციკლოპური ციხეები ვრცელდებოდა და ადგილობრივი ელიტა მიწასა და
    საძოვრებს იმორჩილებდა. ზოგი მკვლევარი ამ მხარეს დიაოხს უკავშირებს — სამეფოს, რომელსაც ასურული და ურარტული
    წარწერები იხსენიებს. ციხეში მუდმივად ცხოვრობდა გარნიზონი თუ მთელი თემი მხოლოდ საფრთხის ჟამს ადიოდა,
    ჯერ არავინ იცის. 2019 წელს საქართველოს მემკვიდრეობის დაცვის უწყებამ მრავალწლიანი პროგრამა წამოიწყო
    აბულისა და ქვეყნის სხვა მეგალითური ძეგლების შესასწავლად და დასაცავად.


    ადგილობრივები ნანგრევს „ქოროღლისაც“ ეძახიან, თურქულენოვანი ხალხების ეპოსის გმირის, ქოროღლის სახელით
    — ეს ხალხური სახელია და არა ისტორია.


    კედლებიდან ფარავნის ტბა და უფრო მაღალი დიდი აბული მოჩანს. აქ, ზემოთ, ლაპარაკი უმეტესად ქარის საქმეა.
  tip: >-
    იარეთ მხოლოდ ზაფხულში, ივნისიდან სექტემბრამდე; მაშინაც კი მაღლობზე ამინდი ერთ საათში შეიძლება გაცივდეს
    და ქარიშხალი ამოვარდეს — თან იქონიეთ თბილი ფენა და საწვიმარი, ჭექა-ქუხილის მოახლოებისას კი უკან დაბრუნდით.
    არც ინფრასტრუქტურაა, არც საფასური, არც ჩრდილი; წყლის პოვნის იმედი ნუ გექნებათ — ბევრი წაიღეთ. ბოლო
    ბილიკი ბალახსა და ლოდებზე გადის: ჩაიცვით სალაშქრო ფეხსაცმელი და ფეხს გაუფრთხილდით. კედლებზე ნუ ახვალთ
    და ქვებს ნუ დაძრავთ — ეს გაუთხრელი, ეროვნული მნიშვნელობის ძეგლია. ადგილზე ორი საათი გაითვალისწინეთ,
    ფეხით სავალ დროს გარდა, და ვიზიტი ფოკის დედათა მონასტერთან შეათავსეთ — სწორედ იქიდან იწყება გზა.
  route: >-
    თბილისიდან შ36 გზით მანგლისისკენ წადით, შემდეგ შ31 გზით წალკის გავლით ჯავახეთის მაღლობზე ადით და ფარავნის
    ტბის გასწვრივ მის სამხრეთ ნაპირამდე, სოფელ ფოკამდე იარეთ. იქ ასფალტიდან უსწორმასწორო გრუნტის გზაზე
    გადადით და დასავლეთით, დაახლოებით 9 კმ, პატარა აბულის ფერდისკენ იარეთ. ბოლო მონაკვეთი — რუკით დაახლოებით
    2 კმ და 350 მეტრამდე აღმართი — ფეხით უნდა გაიაროთ. ამ გზით სულ დაახლოებით 150 კმ-ია; გაითვალისწინეთ
    ოთხნახევარი საათი. გრუნტის გზას მაღალი კლირენსის 4x4 (ოფროუდ კლასი) სჭირდება, არ არის მოვლილი და წვიმის
    შემდეგ ან თოვლში მასზე სვლა არ ღირს. საწვავი წალკაში ჩაასხით.
en:
  name: Abuli Fortress
  short: >-
    A Bronze Age fortress of mortarless basalt at 2,670 m on Mount Patara Abuli, above Lake Paravani:
    never excavated, still unexplained.
  body: >-
    **Some 3,500 years ago, people hauled basalt boulders up the flank of Patara Abuli and stacked them,
    without a grain of mortar, into walls that in places still stand five metres high.**


    The Abuli fortress sits on the southern slope of Mount Patara Abuli, at about 2,670 metres, in the
    volcanic uplands of Javakheti. It is a cyclopean hillfort: a central citadel of roughly 60 by 40 metres,
    entered through gates on the south and east, its dry-stone walls up to five metres high and three
    thick. To the east spreads a warren of dwellings and hiding places, some on two or three levels, and
    inside the fortress there are about forty stone stables. A spring rises on the southern slope, which
    is probably what let anyone hold this height at all.


    What it was for is still an open question. Abuli has never been excavated, so it is dated by comparison:
    archaeologists place it, like its sister fortress of Shaori near Lake Paravani, in the Middle to Late
    Bronze Age, when hillforts spread across the South Caucasus as new local elites took hold of land
    and pasture. Some researchers link the area with Diauehi, a kingdom named in Assyrian and Urartian
    inscriptions. Whether a garrison lived here all year or whole communities climbed up only in times
    of danger, no one can yet say. In 2019 Georgia's heritage authorities launched a multi-year programme
    to study and conserve Abuli and the country's other megalithic sites.


    Locals also call the ruin Korogli, after Koroğlu, the hero of Turkic epic, though that is folk naming,
    not history.


    From the walls you look out over Lake Paravani to the higher summit of Didi Abuli. Up here, the wind
    does most of the talking.
  tip: >-
    Go only in summer, from June to September, and even then the plateau can turn cold and stormy within
    an hour, so carry a warm layer and a waterproof and turn back if thunder builds. There are no facilities,
    no fee and no shade, and you shouldn't count on finding water, so bring plenty. The final path is
    grass and boulders: wear proper boots and watch your ankles. Don't climb on the walls or shift stones,
    because this is an unexcavated monument of national importance. Allow two hours on site plus the walk,
    and combine it with the Poka nunnery, where the track begins.
  route: >-
    Leave Tbilisi on the Sh36 to Manglisi, then follow the Sh31 through Tsalka onto the Javakheti plateau
    and along Lake Paravani to Poka on its southern shore. There leave the asphalt for a rough track heading
    west for roughly 9 km towards the flank of Patara Abuli. The last part, about 2 km on the map with
    some 350 m of climb, is on foot. By this route it is around 150 km; allow four and a half hours. The
    track needs a high-clearance 4x4 (offroad class), is not maintained, and shouldn't be attempted after
    rain or in snow. Fuel up in Tsalka.
ru:
  name: Крепость Абули
  short: >-
    Крепость бронзового века из базальта без раствора, 2670 м, на горе Патара-Абули над Паравани: не раскопана
    и не разгадана.
  body: >-
    **Около 3500 лет назад люди подняли базальтовые глыбы на склон Патара-Абули и сложили из них, без
    единой крупицы раствора, стены, которые местами и сегодня достигают пяти метров в высоту.**


    Крепость Абули стоит на южном склоне горы Патара-Абули, на высоте около 2670 метров, на вулканическом
    нагорье Джавахети. Это циклопическое городище: центральная цитадель размером примерно 60 на 40 метров
    с воротами на юге и востоке, стены сухой кладки — до пяти метров в высоту и до трёх в толщину. К востоку
    тянется лабиринт жилищ и укрытий, иные в два-три уровня, а внутри крепости — около сорока каменных
    стойл. На южном склоне бьёт родник — вероятно, только он и позволял вообще удерживать эту высоту.


    Зачем она была нужна, до сих пор неясно. Абули никогда не раскапывали, поэтому датируют её по аналогии:
    археологи относят её, как и родственную крепость Шаори у озера Паравани, к среднему и позднему бронзовому
    веку — времени, когда городища распространились по всему Южному Кавказу, а новые местные элиты брали
    под контроль земли и пастбища. Некоторые исследователи связывают эти места с Диаухи — царством, упомянутым
    в ассирийских и урартских надписях. Жил ли здесь круглый год гарнизон или целые общины поднимались
    сюда только в час опасности, пока не может сказать никто. В 2019 году грузинские органы охраны наследия
    запустили многолетнюю программу изучения и консервации Абули и других мегалитических памятников страны.


    Местные жители называют руины ещё и Корогли — по имени Кёроглу, героя тюркского эпоса, но это народное
    название, а не история.


    Со стен открывается вид на озеро Паравани и на более высокую вершину Диди-Абули. Здесь, наверху, говорит
    в основном ветер.
  tip: >-
    Приезжайте только летом, с июня по сентябрь, — и даже тогда погода на плато может за час смениться
    холодом и ненастьем, поэтому возьмите тёплый слой и непромокаемую куртку и поворачивайте назад, если
    собирается гроза. Никаких удобств, платы за вход и тени здесь нет, и на воду рассчитывать не стоит,
    так что возьмите её с запасом. Последний отрезок тропы — трава и валуны: нужны настоящие ботинки,
    берегите лодыжки. Не залезайте на стены и не сдвигайте камни: это нераскопанный памятник национального
    значения. На саму крепость отведите два часа плюс дорогу пешком и совместите поездку с женским монастырём
    в Поке, где начинается колея.
  route: >-
    Из Тбилиси выезжайте по Sh36 на Манглиси, затем по Sh31 через Цалку на Джавахетское нагорье и вдоль
    озера Паравани до Поки на его южном берегу. Там асфальт кончается: грубая колея уходит на запад примерно
    на 9 км, к склону Патара-Абули. Последний участок — около 2 км по карте и примерно 350 м набора высоты
    — пешком. Этим путём выходит около 150 км; закладывайте четыре с половиной часа. Для колеи нужен внедорожник
    4x4 с высоким клиренсом (внедорожный класс); её никто не обслуживает, и после дождя или по снегу ехать
    по ней не стоит. Заправьтесь в Цалке.
fa:
  name: دژ آبولی
  short: >-
    دژی از عصر مفرغ با سنگ‌های بازالتی بی‌ملاط، در ارتفاع ۲٬۶۷۰ متری بر کوه پاتارا آبولی و مشرف بر دریاچهٔ
    پاراوانی: هرگز کاوش نشده و هنوز رازآلود است.
  body: >-
    **حدود ۳٬۵۰۰ سال پیش، مردمانی تخته‌سنگ‌های بازالتی را از دامنهٔ پاتارا آبولی بالا کشیدند و بی‌ذره‌ای
    ملاط بر هم چیدند؛ دیوارهایی که هنوز در جاهایی پنج متر بلندی دارند.**


    دژ آبولی بر دامنهٔ جنوبی کوه پاتارا آبولی، در ارتفاع حدود ۲٬۶۷۰ متر، در ارتفاعات آتشفشانی جاواختی
    جای دارد. این دژی کوهستانی با معماری سیکلوپی است: ارگی مرکزی به ابعاد تقریبی ۶۰ در ۴۰ متر، با دروازه‌هایی
    در جنوب و شرق، و دیوارهایی خشکه‌چین تا پنج متر بلندی و سه متر ضخامت. در سوی شرق، هزارتویی از خانه‌ها
    و پناهگاه‌ها گسترده است که برخی دو یا سه طبقه دارند، و درون دژ حدود چهل اصطبل سنگی هست. چشمه‌ای بر
    دامنهٔ جنوبی می‌جوشد، که احتمالاً تنها همان نگه‌داشتن این بلندی را ممکن می‌کرد.


    کاربرد این دژ هنوز پرسشی بی‌پاسخ است. آبولی هرگز کاوش نشده، پس تاریخ آن را از راه مقایسه تعیین می‌کنند:
    باستان‌شناسان آن را، همچون دژ همزادش شائوری در نزدیکی دریاچهٔ پاراوانی، از عصر مفرغ میانی تا متأخر
    می‌دانند؛ روزگاری که دژهای کوهستانی در سراسر قفقاز جنوبی گسترش یافتند و نخبگان محلی تازه‌ای زمین و
    چراگاه را در دست گرفتند. برخی پژوهشگران این ناحیه را با دیائوخی، پادشاهی‌ای که نامش در کتیبه‌های آشوری
    و اورارتویی آمده، پیوند می‌دهند. آیا پادگانی سراسر سال اینجا می‌زیست، یا اجتماع‌هایی کامل تنها هنگام
    خطر به این بلندی پناه می‌آوردند؟ هنوز کسی نمی‌تواند بگوید. در سال ۲۰۱۹ نهادهای میراث فرهنگی گرجستان
    برنامه‌ای چندساله برای پژوهش و حفاظت از آبولی و دیگر محوطه‌های مگالیتی کشور آغاز کردند.


    مردم محلی این ویرانه را کوروغلی هم می‌نامند، به نام کوراوغلو، قهرمان حماسهٔ مردمان ترک‌زبان؛ اما این
    نام‌گذاری‌ای عامیانه است، نه تاریخ.


    از فراز دیوارها، نگاه بر دریاچهٔ پاراوانی و قلهٔ بلندتر دیدی آبولی می‌افتد. این بالا، بیشترِ سخن را
    باد می‌گوید.
  tip: >-
    تنها در تابستان، از ژوئن تا سپتامبر، بروید؛ و حتی آن هنگام هم هوای فلات می‌تواند در یک ساعت سرد و
    طوفانی شود، پس لایه‌ای گرم و بارانی همراه داشته باشید و اگر رعدوبرق در راه بود بازگردید. اینجا نه
    امکاناتی هست، نه ورودیه‌ای و نه سایه‌ای، و بر یافتن آب هم حساب نکنید، پس آب فراوان بیاورید. راه پایانی
    از چمن و تخته‌سنگ است: پوتین درست بپوشید و مراقب مچ پایتان باشید. از دیوارها بالا نروید و سنگ‌ها را
    جابه‌جا نکنید، زیرا این بنایی کاوش‌نشده با اهمیت ملی است. دو ساعت برای خود دژ و افزون بر آن زمان پیاده‌روی
    را در نظر بگیرید، و دیدار را با صومعهٔ بانوان پوکا، که راه خاکی از آنجا آغاز می‌شود، همراه کنید.
  route: >-
    از تفلیس با جادهٔ Sh36 به مانگلیسی بروید، سپس با Sh31 از تسالکا بگذرید و به فلات جاواختی برسید و در
    امتداد دریاچهٔ پاراوانی تا پوکا بر کرانهٔ جنوبی آن برانید. آنجا آسفالت را رها کنید و به راهی خاکی
    و ناهموار بزنید که حدود ۹ کیلومتر به سوی غرب، به دامنهٔ پاتارا آبولی، می‌رود. بخش پایانی، حدود ۲ کیلومتر
    روی نقشه با نزدیک به ۳۵۰ متر صعود، پیاده است. از این مسیر حدود ۱۵۰ کیلومتر می‌شود؛ چهار ساعت و نیم
    در نظر بگیرید. این راه خاکی خودروی ۴×۴ شاسی‌بلند (کلاس آفرود) می‌خواهد، نگهداری نمی‌شود و پس از باران
    یا در برف نباید به آن زد. در تسالکا باک را پر کنید.
he:
  name: מבצר אבולי
  short: >-
    מבצר מתקופת הברונזה, בנוי בזלת בלי טיט, בגובה 2,670 מ' על הר פטרה אבולי מעל אגם פרוואני: מעולם לא
    נחפר, ועדיין לא פוענח.
  body: >-
    **לפני כ-3,500 שנה גררו בני אדם גושי בזלת במעלה צלע ההר פטרה אבולי וערמו אותם, בלי גרגר של טיט, לחומות
    שבמקומות מסוימים עדיין מתנשאות לגובה חמישה מטרים.**


    מבצר אבולי ניצב על המדרון הדרומי של הר פטרה אבולי, בגובה של כ-2,670 מטר, ברמות הוולקניות של ג'אווחטי.
    זהו מבצר גבעה ציקלופי: מצודה מרכזית של כ-60 על 40 מטר, שנכנסים אליה בשערים בדרום ובמזרח, וחומות בבנייה
    יבשה בגובה של עד חמישה מטרים ובעובי של עד שלושה. ממזרח לה נפרש מבוך של מגורים ומסתורים, חלקם בשתיים
    או שלוש קומות, ובתוך המבצר יש כארבעים אורוות אבן. במדרון הדרומי נובע מעיין, וכנראה רק בזכותו אפשר
    היה בכלל להחזיק בגובה הזה.


    למה שימש המבצר – זו עדיין שאלה פתוחה. באבולי לא נערכו מעולם חפירות, ולכן מתארכים אותו בהשוואה: ארכאולוגים
    משייכים אותו, כמו את מבצר־אחותו שאורי, הסמוך לאגם פרוואני, לתקופת הברונזה התיכונה עד המאוחרת – התקופה
    שבה התפשטו מבצרי גבעה ברחבי דרום הקווקז, כשאליטות מקומיות חדשות השתלטו על אדמות ועל שטחי מרעה. יש
    חוקרים שמקשרים את האזור לדיאאוחי, ממלכה הנזכרת בכתובות אשוריות ואורארטיות. האם חיל מצב גר כאן כל השנה,
    או שקהילות שלמות עלו לכאן רק בעת סכנה – איש עוד אינו יכול לומר. ב-2019 השיקו רשויות המורשת של גאורגיה
    תוכנית רב-שנתית לחקר ולשימור של אבולי ושל שאר האתרים המגליתיים במדינה.


    המקומיים קוראים לחורבה גם קורוגלי, על שם קורואוגלו, גיבור האפוס של העמים הטורקיים – אבל זהו כינוי
    עממי, לא היסטוריה.


    מהחומות נשקף מבט אל אגם פרוואני ואל הפסגה הגבוהה יותר, דידי אבולי. כאן למעלה, רוב הדיבור נשאר לרוח.
  tip: >-
    בואו רק בקיץ, מיוני עד ספטמבר, וגם אז מזג האוויר ברמה עלול להפוך לקר וסוער בתוך שעה, לכן קחו שכבה
    חמה ומעיל גשם, וחזרו על עקבותיכם אם מתקרבת סופת רעמים. אין כאן שום מתקנים, אין דמי כניסה ואין צל,
    ואל תסמכו על כך שתמצאו מים, אז הביאו הרבה. השביל האחרון עובר בין עשב וסלעים: נעלו נעלי הליכה של ממש
    ושימו לב לקרסוליים. אל תטפסו על החומות ואל תזיזו אבנים, כי זהו אתר מורשת בעל חשיבות לאומית שמעולם
    לא נחפר. הקצו שעתיים לאתר עצמו ועוד זמן להליכה, ושלבו את הביקור במנזר הנזירות בפוקה, שממנו מתחילה
    דרך העפר.
  route: >-
    יוצאים מטביליסי בכביש Sh36 למנגליסי, ממשיכים בכביש Sh31 דרך צלקה אל רמת ג'אווחטי ולאורך אגם פרוואני
    עד פוקה שעל חופו הדרומי. שם עוזבים את האספלט לדרך עפר משובשת שפונה מערבה לאורך כ-9 ק"מ, אל צלע ההר
    פטרה אבולי. הקטע האחרון, כ-2 ק"מ על המפה ועלייה של כ-350 מ', נעשה ברגל. בדרך זו מדובר בכ-150 ק"מ;
    הקצו ארבע שעות וחצי. דרך העפר דורשת רכב 4x4 גבוה (קטגוריית שטח), אינה מתוחזקת, ואין לנסות לעבור בה
    אחרי גשם או בשלג. תדלקו בצלקה.
ar:
  name: قلعة أبولي
  short: >-
    قلعة من العصر البرونزي مبنية من البازلت بلا ملاط، على ارتفاع 2,670 م على جبل باتارا أبولي المطل على
    بحيرة بارافاني: لم تُنقَّب قط، وما زال لغزها قائماً.
  body: >-
    **قبل نحو 3,500 عام، جرّ أناسٌ كتلاً من البازلت صعوداً على سفح باتارا أبولي، ورصّوها بعضها فوق بعض،
    بلا ذرّة ملاط، أسواراً ما زال بعضها يرتفع خمسة أمتار.**


    تقع قلعة أبولي على السفح الجنوبي لجبل باتارا أبولي، على ارتفاع نحو 2,670 متراً، في المرتفعات البركانية
    لجافاخيتي. إنها حصن جبلي من البناء السيكلوبي: قلعة مركزية مساحتها نحو 60 في 40 متراً، يُدخل إليها
    من بوابتين في الجنوب والشرق، وأسوار من الحجر الجاف يصل ارتفاعها إلى خمسة أمتار وسُمكها إلى ثلاثة.
    وإلى الشرق تمتد متاهة من المساكن والمخابئ، بعضها من طابقين أو ثلاثة، وفي داخل القلعة نحو أربعين إسطبلاً
    حجرياً. وعلى السفح الجنوبي تتفجّر عين ماء، ولعلها وحده ما جعل التمسّك بهذا المرتفع ممكناً أصلاً.


    أما الغرض منها فما زال سؤالاً مفتوحاً. لم تُنقَّب أبولي قط، لذا تُؤرَّخ بالمقارنة: يُرجعها علماء الآثار،
    مثل شقيقتها قلعة شاوري قرب بحيرة بارافاني، إلى العصر البرونزي الأوسط والمتأخر، حين انتشرت الحصون الجبلية
    في أنحاء جنوب القوقاز مع إحكام نخب محلية جديدة قبضتها على الأرض والمراعي. ويربط بعض الباحثين المنطقة
    بمملكة دياوخي، المذكورة في النقوش الآشورية والأورارتية. أكانت هنا حامية تقيم طوال العام، أم كانت جماعات
    بأكملها تصعد إليها في أوقات الخطر فقط؟ لا أحد يستطيع أن يجزم بعد. وفي عام 2019 أطلقت هيئات التراث
    في جورجيا برنامجاً متعدد السنوات لدراسة أبولي وسائر المواقع الميغاليثية في البلاد وصونها.


    ويسمّي السكان المحليون الأطلال أيضاً «كوروغلي»، نسبةً إلى كوراوغلو، بطل الملحمة لدى الشعوب التركية،
    غير أن هذه تسمية شعبية لا تاريخ.


    ومن فوق الأسوار يمتد النظر إلى بحيرة بارافاني وإلى القمة الأعلى، ديدي أبولي. هنا في الأعالي، تتولّى
    الريح معظم الكلام.
  tip: >-
    لا تذهب إلا صيفاً، من يونيو إلى سبتمبر، وحتى حينها قد ينقلب الطقس على الهضبة بارداً عاصفاً في غضون
    ساعة، فاحمل طبقة دافئة وسترة واقية من المطر، وعُد أدراجك إن بدأت العاصفة الرعدية تتجمّع. لا مرافق
    هنا ولا رسوم دخول ولا ظل، ولا تعوّل على العثور على الماء، فاحمل منه الكثير. الدرب الأخير عشب وصخور:
    البس حذاء مشي حقيقياً وانتبه لكاحليك. لا تتسلّق الأسوار ولا تحرّك الحجارة، فهذا معلم أثري ذو أهمية
    وطنية لم يُنقَّب بعد. خصّص ساعتين للموقع إضافة إلى وقت المشي، واجمع الزيارة مع دير الراهبات في بوكا،
    حيث يبدأ المسار الترابي.
  route: >-
    اخرج من تبليسي على الطريق Sh36 إلى مانغليسي، ثم اتبع الطريق Sh31 عبر تسالكا إلى هضبة جافاخيتي وعلى
    امتداد بحيرة بارافاني حتى بوكا على شاطئها الجنوبي. هناك اترك الإسفلت إلى مسار ترابي وعر يتجه غرباً
    نحو 9 كم باتجاه سفح باتارا أبولي. أما الجزء الأخير، نحو 2 كم على الخريطة بصعود يقارب 350 م، فسيراً
    على الأقدام. تبلغ المسافة بهذا الطريق نحو 150 كم؛ احسب لها أربع ساعات ونصفاً. يتطلب المسار سيارة دفع
    رباعي (4x4) عالية عن الأرض (فئة الطرق الوعرة)، ولا يخضع لأي صيانة، ولا ينبغي سلوكه بعد المطر أو في
    الثلج. املأ خزان الوقود في تسالكا.
