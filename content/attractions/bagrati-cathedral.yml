ka:
  name: ბაგრატის ტაძარი და ქუთაისის ცენტრი
  short: >-
    ბაგრატ III-ის 1003 წლის ტაძარი უქიმერიონის გორაზე: ოსმალთა აფეთქებული, სადავოდ აღდგენილი და ძველი
    ქუთაისის თავზე აღმართული.
  body: >-
    **ბაგრატის ტაძარი საქართველოს ერთიანობის სათქმელად აშენდა, მისი დანგრეული კედლები კი სამი საუკუნე
    სულ სხვა რამეს ჰყვებოდა.**


    ბაგრატ III თითქმის მთელ ქართულ მიწას, თბილისის გარდა, ფლობდა და თავს „აფხაზთა, ქართველთა, რანთა და
    კახთა მეფეს“ უწოდებდა. ქუთაისი ამ გაერთიანებული სამეფოს დედაქალაქი 978 წლიდან 1122 წლამდე იყო. სწორედ
    აქ, უქიმერიონის გორაზე, ააგო მეფემ ღვთისმშობლის მიძინების სახელობის საკათედრო ტაძარი. ჩრდილოეთ კედლის
    წარწერა იატაკის დაგებას „ქორონიკონ სკგ“-ით, ანუ 1003 წლით ათარიღებს, სხვა წარწერები კი მეფის დედის,
    გურანდუხტ დედოფლის შემწეობას მოგვითხრობს.


    1650–1652 წლებში რუსმა ელჩებმა, ალექსი იევლევმა და ნიკიფორე ტოლოჩანოვმა, ტაძარი ჯერ კიდევ მთელი ნახეს:
    სპილენძით გადახურული გუმბათი, რვა მრგვალი სვეტი და პატრონიკე, საიდანაც დედოფალს გალობა ესმოდა და ყველას
    ხედავდა, თავად კი არავის ჩანდა. ორმოციოდე წლის შემდეგ, როცა არჩილ მეფის ლაშქარი ციხეს ალყას არტყამდა,
    ოსმალთა გარნიზონმა ტაძრის კუთხეებში თოფის წამალი ჩააწყო და ააფეთქა. ქართული წყაროები ამას 1691 წლით
    ათარიღებენ, ინგლისურენოვანი წყაროების უმეტესობა კი 1692-ით. მარმარილოს მოპირკეთება ჩამოხსნეს და სვეტები
    წაიღეს. 1770 წელს გენერალ ტოტლებენის ზარბაზნებმა აღმოსავლეთის კედელი კიდევ უფრო დააზიანეს.


    ნანგრევის გამაგრება 1950-იან წლებში დაიწყო და 1994 წელს უგუმბათო ტაძარი გელათთან ერთად მსოფლიო მემკვიდრეობის
    ნუსხაში შევიდა. 2009–2012 წლებში კი იგი თანამედროვე მასალებითა და ახალი კონსტრუქციებით აღადგინეს.
    იუნესკომ ეს ჩარევა ავთენტურობისთვის საზიანოდ მიიჩნია და 2017 წელს ბაგრატი ნუსხიდან ამოიღო. დღეს ტაძარი
    ისევ მოქმედია, ქუთათელი მიტროპოლიტის კათედრაა და ჯვრისწერისთვის ერთ-ერთი საყვარელი ადგილი.


    უქიმერიონიდან ქუთაისი და რიონი ხელისგულზე მოჩანს. მერე ქალაქში ფეხით ჩადით:


    - კოლხეთის შადრევანი ცენტრალურ მოედანზე, ძველი ოქროს სამკაულების გადიდებული ასლებით

    - თეთრი ხიდი რიონზე

    - მწვანე ბაზარი, იმერული ყველითა და სანელებლებით


    შებინდებისას აქ დადექით და თავად გადაწყვიტეთ: შუა საუკუნეების აღდგენილი ტაძარია თუ ახალი ეკლესია,
    ძველი ქვით შემოსილი.
  tip: >-
    თუ შეგიძლიათ, ცენტრიდან ფეხით ამოდით: ძველი ქუჩებით თხუთმეტი-ოცი წუთი დაგჭირდებათ. მანქანითაც შეიძლება
    ზემოთ ამოსვლა და ეზოსთან დაყენება. ტაძარში ჩაცმის ჩვეულებრივი წესი მოქმედებს: ქალებს თავსაფარი და
    კაბა, კაცებს გრძელი შარვალი. შაბათ-კვირას ჯვრისწერებია, ამიტომ სიმშვიდისთვის სამუშაო დღის დილა აირჩიეთ.
    ბორცვიდან მზის ჩასვლა ლოდინად ღირს, მაგრამ დაღმართი ცუდად არის განათებული და ტელეფონის ფანარი გამოგადგებათ.
    კაფეები, ტუალეტი და ბანკომატები ქვემოთ, ცენტრალურ მოედანთანაა. ტაძრისა და ქალაქისთვის რამდენიმე საათი
    გამოყავით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალი დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადადის
    და ქუთაისამდე მიდის: დაახლოებით 230 კმ და სამი საათი და ოცი წუთი. ქალაქში აღმოსავლეთიდან შედიხართ;
    ცენტრისკენ წადით და ბაგრატის ქუჩით ტაძრამდე ადით. მთელი გზა ასფალტიანია, ეკონომ-კლასის მანქანაც საკმარისია.
    ცენტრში ცალმხრივი ქუჩებია და დღისით პარკინგი ივსება, ამიტომ ხშირად ჯობია, მანქანა ტაძართან დატოვოთ
    და ქალაქი ფეხით დაათვალიეროთ. საწვავი, სერვისი და ბანკომატები ქუთაისში ყველგანაა. გელათი აქედან ნახევარი
    საათის სავალზეა, ტყიბულის გზაზე.
en:
  name: Bagrati Cathedral and central Kutaisi
  short: >-
    Bagrat III's cathedral of 1003 on Ukimerioni Hill, blown up by an Ottoman garrison and controversially
    rebuilt, above the old heart of Kutaisi.
  body: >-
    **Bagrati was built to say that Georgia was one kingdom, and for three centuries its broken walls
    said something else.**


    Bagrat III ruled almost every Georgian land except Tbilisi and styled himself king of the Abkhazians,
    Kartvelians, Rans and Kakhs. Kutaisi was the capital of this united realm from 978 to 1122, and on
    Ukimerioni Hill he raised its cathedral, dedicated to the Dormition of the Virgin. An inscription
    on the north wall dates the floor to 'chronicon 223', that is, 1003; another records the help of his
    mother, Queen Gurandukht.


    In 1650–52 the Russian envoys Aleksei Ievlev and Nikifor Tolochanov saw it whole: a copper-roofed
    dome, eight round columns, and a royal gallery from which the queen could hear the chant and see everyone
    without being seen. Forty years later, while King Archil's men besieged the citadel, the Ottoman garrison
    packed gunpowder into the cathedral's corners and blew it up. Georgian sources give 1691, most English-language
    ones 1692. Its marble facing and columns were carried off. In 1770 General Totleben's Russian cannon
    battered the east wall again.


    Consolidated from the 1950s, the roofless ruin joined the World Heritage List with Gelati in 1994.
    Then, in 2009–2012, it was rebuilt with modern materials and new structures. UNESCO judged the work
    damaging to its authenticity and in 2017 removed Bagrati from the list. Today it is a working cathedral
    again, seat of the Metropolitan of Kutaisi and a favourite place for weddings.


    From the hill, Kutaisi and the Rioni lie at your feet. Walk down afterwards:


    - the Colchis Fountain on the central square, with enlarged copies of ancient gold ornaments

    - the White Bridge over the Rioni

    - the Green Bazaar, for Imeretian cheese and spices


    At dusk, decide for yourself: a medieval cathedral restored, or a new church wearing old stone.
  tip: >-
    Walk up from the centre if you can: it takes around fifteen to twenty minutes through old streets.
    You can also drive to the top and park by the churchyard. Church dress rules apply: headscarf and
    skirt for women, long trousers for men. Weekends bring weddings, so come on a weekday morning for
    quiet. Sunset from the hill is worth the wait, but the path down is dimly lit, so a phone torch helps.
    Cafés, toilets and ATMs cluster around the central square below. Allow a few hours to see both the
    cathedral and the town.
  route: >-
    From Tbilisi the S1 (E60) runs west past Gori and Khashuri and over the Rikoti Pass to Kutaisi, about
    230 km and roughly three hours twenty minutes. The road enters the city from the east. Head for the
    centre and follow Bagrati Street up the hill to the cathedral. The whole way is paved, and an economy
    car is fine. The centre has one-way streets, and daytime parking fills up, so leaving the car near
    the cathedral and exploring on foot is often simplest. Fuel, service stations and ATMs are everywhere
    in Kutaisi. Gelati is about half an hour's drive further, on the Tkibuli road.
ru:
  name: Собор Баграта и центр Кутаиси
  short: >-
    Собор Баграта III 1003 года на холме Укимериони, взорванный османским гарнизоном и спорно восстановленный,
    над старым сердцем Кутаиси.
  body: >-
    **Баграти строили, чтобы заявить, что Грузия — единое царство, а три столетия его разрушенные стены
    говорили совсем иное.**


    Баграт III правил почти всеми грузинскими землями, кроме Тбилиси, и называл себя царём абхазов, картвелов,
    ранов и кахов. С 978 по 1122 год Кутаиси был столицей этого объединённого царства, и на холме Укимериони
    царь возвёл его собор, посвящённый Успению Богородицы. Надпись на северной стене датирует закладку
    пола «хрониконом 223», то есть 1003 годом; другая упоминает помощь его матери, царицы Гурандухт.


    В 1650–1652 годах русские послы Алексей Иевлев и Никифор Толочанов видели его целым: купол с медной
    крышей, восемь круглых колонн и царская галерея, откуда царица могла слышать службу и видеть всех,
    оставаясь незамеченной. Сорок лет спустя, когда войска царя Арчила осаждали крепость, османский гарнизон
    заложил порох в углы собора и взорвал его. Грузинские источники называют 1691 год, большинство англоязычных
    — 1692-й. Его мраморную облицовку и колонны вывезли. В 1770 году русская артиллерия генерала Тотлебена
    снова разбила восточную стену.


    Укреплённые с 1950-х годов, руины без крыши вошли в список Всемирного наследия вместе с Гелати в 1994
    году. Затем, в 2009–2012 годах, собор был восстановлен с использованием современных материалов и новых
    конструкций. ЮНЕСКО признала эту работу вредящей аутентичности объекта и в 2017 году вывела Баграти
    из списка. Сегодня это снова действующий собор, кафедра Кутаисского митрополита и любимое место для
    венчаний.


    С холма Кутаиси и Риони лежат у ваших ног. Спустившись, пройдитесь:


    - к фонтану «Колхида» на центральной площади, с увеличенными копиями древних золотых украшений

    - к Белому мосту через Риони

    - к Зелёному базару, за имеретинским сыром и специями


    В сумерках решите сами: восстановленный средневековый собор — или новая церковь в старом камне.
  tip: >-
    Поднимитесь от центра пешком, если можете: это займёт минут пятнадцать-двадцать по старым улицам.
    Можно и подъехать прямо к вершине и оставить машину у церковного двора. Действуют церковные правила
    одежды: платок и юбка для женщин, длинные брюки для мужчин. По выходным здесь венчания, так что за
    тишиной приезжайте в будний день утром. Закат с холма стоит того, чтобы подождать, но спуск плохо
    освещён, так что фонарик телефона пригодится. Кафе, туалеты и банкоматы сгруппированы вокруг центральной
    площади внизу. Отведите несколько часов, чтобы увидеть и собор, и город.
  route: >-
    Из Тбилиси трасса S1 (E60) идёт на запад через Гори и Хашури, через Рикотский перевал, до Кутаиси
    — около 230 км и примерно три часа двадцать минут. Дорога входит в город с востока. Держите курс на
    центр и поднимайтесь по улице Баграти к собору. Весь путь асфальтирован, экономичный автомобиль вполне
    подходит. В центре одностороннее движение, а дневная парковка заполняется, так что часто проще оставить
    машину у собора и гулять пешком. Топливо, автосервисы и банкоматы повсюду в Кутаиси. Гелати — ещё
    около получаса езды дальше, по дороге на Ткибули.
fa:
  name: کلیسای جامع باگراتی و مرکز کوتایسی
  short: >-
    کلیسای جامع باگرات سوم از سال ۱۰۰۳ بر تپهٔ اوکیمریونی، که پادگانی عثمانی آن را منفجر کرد و بازسازی‌اش
    بحث‌برانگیز شد، بالای قلب کهن کوتایسی.
  body: >-
    **باگراتی را ساختند تا بگویند گرجستان یک پادشاهی است، و سه قرن دیوارهای فروریخته‌اش چیزی دیگر می‌گفت.**


    باگرات سوم بر تقریباً همهٔ سرزمین‌های گرجی به‌جز تفلیس فرمان می‌راند و خود را پادشاه ابخازها، کارتولی‌ها،
    ران‌ها و کاخ‌ها می‌نامید. کوتایسی از سال ۹۷۸ تا ۱۱۲۲ پایتخت این قلمرو یکپارچه بود، و او بر تپهٔ اوکیمریونی
    کلیسای جامع آن را، وقف‌شده به خفتن مریم مقدس، برافراشت. کتیبه‌ای بر دیوار شمالی، تاریخ سنگ‌فرش کف
    کلیسا را «کرونیکون ۲۲۳»، یعنی سال ۱۰۰۳، ثبت کرده است؛ کتیبه‌ای دیگر یاری مادرش، ملکه گورندوخت، را
    ثبت می‌کند.


    در سال‌های ۱۶۵۰ تا ۱۶۵۲، ایلچیان روس، الکسی یِولف و نیکیفور تولوچانوف، آن را دست‌نخورده دیدند: گنبدی
    با پوششِ مسی، هشت ستون گرد، و ایوان شاهانه‌ای که ملکه از آن‌جا سرود دینی را می‌شنید و همه را می‌دید
    بدون آن‌که دیده شود. چهل سال بعد، هنگامی که سپاهیان پادشاه آرچیل ارگ را محاصره کرده بودند، پادگان
    عثمانی باروت را در گوشه‌های کلیسا انباشت و آن را منفجر کرد. منابع گرجی سال ۱۶۹۱ را ثبت می‌کنند، بیشتر
    منابع انگلیسی‌زبان ۱۶۹۲ را. روکش مرمر و ستون‌های آن را با خود بردند. در سال ۱۷۷۰ توپخانهٔ روسی ژنرال
    توتلبن بار دیگر دیوار شرقی را درهم کوبید.


    این ویرانهٔ بی‌سقف، که از دههٔ ۱۹۵۰ استحکام‌بخشی شده بود، در سال ۱۹۹۴ همراه با گلاتی به فهرست میراث
    جهانی پیوست. سپس، در سال‌های ۲۰۰۹ تا ۲۰۱۲، با موادی نو و سازه‌های تازه بازسازی شد. یونسکو این کار
    را آسیب‌رسان به اصالت اثر دانست و در سال ۲۰۱۷ باگراتی را از فهرست خود بیرون کرد. امروز بار دیگر کلیسایی
    جامعِ فعال است، کرسیِ متروپولیتن کوتایسی و مکانی محبوب برای عروسی‌ها.


    از تپه، کوتایسی و ریونی زیر پای شماست. پس از آن پیاده به پایین بروید:


    - فوارهٔ کولخیس بر میدان مرکزی، با نسخه‌های بزرگ‌شده‌ای از زینت‌های طلایی باستانی

    - پل سفید بر روی ریونی

    - بازار سبز، برای پنیر و ادویهٔ ایمرتی


    در غروب، خودتان قضاوت کنید: کلیسایی جامع سده‌های میانه که بازسازی شده، یا کلیسایی نو در پوشش سنگی
    کهن.
  tip: >-
    اگر می‌توانید، از مرکز پیاده بالا بروید: حدود پانزده تا بیست دقیقه از میان خیابان‌های قدیمی طول می‌کشد.
    می‌توانید با ماشین هم تا بالا بروید و کنار حیاط کلیسا پارک کنید. قواعد پوشش کلیسا رعایت می‌شود: روسری
    و دامن برای زنان، شلوار بلند برای مردان. آخر هفته‌ها عروسی برگزار می‌شود، پس برای آرامش صبح یک روز
    هفته بیایید. غروب آفتاب از تپه ارزش انتظار را دارد، اما مسیر پایین کم‌نور است، پس چراغ‌قوهٔ گوشی کمک
    می‌کند. کافه‌ها، سرویس‌های بهداشتی و دستگاه‌های خودپرداز دور میدان مرکزی پایین جمع‌اند. چند ساعت برای
    دیدن هم کلیسا و هم شهر در نظر بگیرید.
  route: >-
    از تفلیس، مسیر S1 (E60) به سوی غرب، از میان گوری و خاشوری و گذرگاه ریکوتی، تا کوتایسی می‌رود — حدود
    ۲۳۰ کیلومتر و تقریباً سه ساعت و بیست دقیقه. راه از شرق وارد شهر می‌شود. به سوی مرکز بروید و از خیابان
    باگراتی به سوی کلیسا بالا بروید. تمام مسیر آسفالت است و خودرویی معمولی کافی است. مرکز شهر خیابان‌های
    یک‌طرفه دارد و پارکینگ روزانه پر می‌شود، پس اغلب ساده‌تر است ماشین را نزدیک کلیسا بگذارید و پیاده
    بگردید. سوخت، تعمیرگاه و دستگاه خودپرداز در کوتایسی همه‌جا هست. گلاتی حدود نیم ساعت دیگر رانندگی،
    در راه تکیبولی، فاصله دارد.
he:
  name: קתדרלת בגרטי ומרכז קוטאיסי
  short: >-
    קתדרלת בגרט השלישי משנת 1003 על גבעת אוקימריוני, שחיל המצב העות'מאני פוצץ ושיקומה עורר מחלוקת, מעל
    לב העיר העתיק של קוטאיסי.
  body: >-
    **את בגרטי בנו כדי לומר שגאורגיה היא ממלכה אחת, ובמשך שלוש מאות שנה אמרו קירותיה ההרוסים דבר אחר.**


    בגרט השלישי מלך על כמעט כל הארצות הגאורגיות, פרט לטביליסי, וכינה עצמו מלך האבחזים, הקרתוולים, הראנים
    והקאחים. קוטאיסי הייתה בירת הממלכה המאוחדת הזו מ-978 עד 1122, ועל גבעת אוקימריוני הקים את הקתדרלה
    שלה, המוקדשת להסתלקות הבתולה. כתובת על הקיר הצפוני מתארכת את הרצפה ל"כרוניקון 223", כלומר 1003; כתובת
    אחרת מציינת את עזרת אמו, המלכה גורנדוכט.


    בשנים 1650–1652 ראו אותה השליחים הרוסים אלכסיי יבלב וניקיפור טולוצ'נוב שלמה: כיפה מקורה נחושת, שמונה
    עמודים עגולים, וגלריה מלכותית שממנה יכלה המלכה לשמוע את הזמרה ולראות את כולם מבלי שתיראה. ארבעים שנה
    מאוחר יותר, בעת שאנשי המלך ארצ'יל צרו על המצודה, ארז חיל המצב העות'מאני אבק שריפה בפינות הקתדרלה ופוצץ
    אותה. מקורות גאורגיים נותנים 1691, ורוב המקורות באנגלית 1692. ציפוי השיש שלה ועמודיה נלקחו. ב-1770
    היכו תותחי הגנרל הרוסי טוטלבן שוב בקיר המזרחי.


    החורבה חשופת הגג, שיוצבה משנות ה-50, נכללה ב-1994 יחד עם גלאתי ברשימת מורשת העולם. אז, ב-2009–2012,
    שוקמה בחומרים מודרניים ומבנים חדשים. אונסק"ו קבעה שהעבודה מזיקה לאותנטיות שלה, וב-2017 הסירה את בגרטי
    מהרשימה. כיום היא קתדרלה פעילה מחדש, מקום כסאו של המטרופוליט של קוטאיסי ומקום מבוקש לחתונות.


    מהגבעה פרושים קוטאיסי ונהר ריוני לרגליכם. אחר כך רדו והתהלכו:


    - מזרקת קולכיס בכיכר המרכזית, עם עותקים מוגדלים של תכשיטי זהב עתיקים

    - הגשר הלבן מעל ריוני

    - השוק הירוק, לגבינה אימרתית ולתבלינים


    בין הערביים, הכריעו בעצמכם: קתדרלה ביניימית ששוקמה, או כנסייה חדשה העוטה אבן עתיקה.
  tip: >-
    עלו מהמרכז ברגל אם אפשר: זה לוקח כחמש-עשרה עד עשרים דקות ברחובות עתיקים. אפשר גם לנסוע עד לראש הגבעה
    ולחנות לצד חצר הכנסייה. חלים כללי הלבוש של הכנסייה: מטפחת ראש וחצאית לנשים, מכנסיים ארוכים לגברים.
    בסופי שבוע נערכות כאן חתונות, לכן בשביל השקט בואו בבוקר של יום חול. השקיעה מהגבעה שווה את ההמתנה,
    אך השביל למטה מואר חלושות, אז פנס הטלפון יועיל. בתי קפה, שירותים וכספומטים מתקבצים סביב הכיכר המרכזית
    שלמטה. הקצו כמה שעות לראות גם את הקתדרלה וגם את העיר.
  route: >-
    מטביליסי עובר כביש S1 (E60) מערבה דרך גורי וחשורי ומעל מעבר ריקותי לקוטאיסי, כ-230 ק"מ ובערך שלוש
    שעות ועשרים דקות. הכביש נכנס לעיר ממזרח. פנו למרכז ועלו ברחוב בגרטי לקתדרלה. כל הדרך אספלט, ורכב רגיל
    מתאים. במרכז יש רחובות חד-סטריים, והחניה מתמלאת במהלך היום, כך שלהשאיר את הרכב סמוך לקתדרלה ולסייר
    ברגל הוא לרוב הפתרון הפשוט ביותר. דלק, מוסכים וכספומטים בכל מקום בקוטאיסי. גלאתי כחצי שעת נסיעה נוספת,
    בכביש לטקיבולי.
ar:
  name: كاتدرائية باغراتي ووسط كوتايسي
  short: >-
    كاتدرائية باغرات الثالث من عام 1003 على تلة أوكيميريوني، التي فجّرتها حامية عثمانية وأُعيد بناؤها
    بشكل مثير للجدل، فوق قلب كوتايسي القديم.
  body: >-
    **بُنيت باغراتي لتقول إن جورجيا مملكة واحدة، ولثلاثة قرون قالت جدرانها المهدّمة شيئًا آخر.**


    حكم باغرات الثالث كل الأراضي الجورجية تقريبًا سوى تبليسي، ولقّب نفسه ملك الأبخاز والكارتفليين والرانيين
    والكاخيين. كانت كوتايسي عاصمة هذه المملكة الموحّدة من 978 إلى 1122، وعلى تلة أوكيميريوني شيّد كاتدرائيتها،
    المكرّسة لرقاد السيدة العذراء. يؤرّخ نقش على الجدار الشمالي أرضيتها بـ"الكرونيكون 223"، أي عام 1003؛
    وتسجّل كتابة أخرى مساعدة والدته، الملكة غوراندوخت.


    في 1650–1652 رآها المبعوثان الروسيان أليكسي ييفليف ونيكيفور تولوتشانوف كاملة: قبة مسقوفة بالنحاس،
    وثمانية أعمدة مستديرة، وشرفة ملكية كانت الملكة تسمع منها التراتيل وترى الجميع دون أن تُرى. بعد أربعين
    عامًا، وبينما كان رجال الملك أرتشيل يحاصرون القلعة، حشت الحامية العثمانية البارود في زوايا الكاتدرائية
    وفجّرتها. تذكر المصادر الجورجية عام 1691، وأغلب المصادر الإنكليزية عام 1692. نُقل كساؤها المرمري وأعمدتها.
    وفي 1770 ضربت مدفعية الجنرال الروسي توتليبن الجدار الشرقي مجددًا.


    ثُبِّتت الأنقاض المكشوفة بلا سقف منذ الخمسينيات، وأُدرجت في قائمة التراث العالمي مع غيلاتي عام 1994.
    ثم، بين 2009 و2012، أُعيد بناؤها بمواد حديثة وهياكل جديدة. رأت اليونسكو أن العمل يضر بأصالة الموقع،
    وفي عام 2017 حذفت باغراتي من القائمة. اليوم هي كاتدرائية تُقام فيها الصلوات من جديد، مقر متروبوليت
    كوتايسي، ومكان مفضّل لحفلات الزفاف.


    من التلة، تقع كوتايسي ونهر ريوني تحت قدميك. وبعدها، انزل واستكشف:


    - نافورة كولخيس في الساحة المركزية، بنسخ مكبَّرة من الحلي الذهبية القديمة

    - الجسر الأبيض فوق ريوني

    - السوق الأخضر، للجبن الإيميريتي والبهارات


    عند الغسق، احكم بنفسك: كاتدرائية من العصور الوسطى أُعيد بناؤها، أم كنيسة جديدة ترتدي حجرًا قديمًا.
  tip: >-
    اصعد من الوسط سيرًا إن استطعت: يستغرق ذلك نحو خمس عشرة إلى عشرين دقيقة عبر شوارع قديمة. يمكنك أيضًا
    القيادة إلى القمة وركن السيارة قرب باحة الكنيسة. تُطبَّق قواعد اللباس الكنسي: غطاء رأس وتنورة للنساء،
    وسراويل طويلة للرجال. تُقام حفلات الزفاف في عطلات نهاية الأسبوع، فتعال في صباح يوم عمل طلبًا للهدوء.
    غروب الشمس من التلة يستحق الانتظار، لكن طريق النزول خافت الإضاءة، فمصباح الهاتف مفيد. تتجمع المقاهي
    والمراحيض وأجهزة الصرف الآلي حول الساحة المركزية أدناه. خصّص بضع ساعات لرؤية الكاتدرائية والمدينة
    معًا.
  route: >-
    من تبليسي، يمتد الطريق S1 (E60) غربًا عبر غوري وخاشوري وممر ريكوتي إلى كوتايسي، نحو 230 كم وحوالي
    ثلاث ساعات وعشرين دقيقة. يدخل الطريق المدينة من الشرق. توجه نحو الوسط واتبع شارع باغراتي صعودًا إلى
    الكاتدرائية. الطريق كله معبّد، وسيارة اقتصادية تكفي. يضم الوسط شوارع باتجاه واحد، وتمتلئ مواقف النهار،
    فترك السيارة قرب الكاتدرائية والتجول سيرًا غالبًا هو الأسهل. الوقود ومحطات الخدمة وأجهزة الصرف الآلي
    متوفرة في كل مكان بكوتايسي. غيلاتي على نحو نصف ساعة قيادة أخرى، على طريق تكيبولي.
