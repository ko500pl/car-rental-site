ka:
  name: ბაგრატის ტაძარი და ქუთაისის ცენტრი
  short: უკიმერიონის ბორცვზე აღმართული ტაძარი და მის ქვემოთ გაშლილი ძველი ქუთაისი.
  body: >
    ბაგრატის ტაძარი უკიმერიონის ბორცვზე დგას და მთელი ქუთაისიდან ჩანს. მისი მშენებლობა ბაგრატ III-ის დროს
    დასრულდა 1003 წელს — ეს იყო გაერთიანებული ქართული სამეფოს სიმბოლური მთავარი ტაძარი. 1692 წელს ოსმალთა
    ლაშქრობის დროს აფეთქებამ გუმბათი და კედლების დიდი ნაწილი დაანგრია და თითქმის სამი საუკუნის განმავლობაში
    ტაძარი ნანგრევად იდგა.


    2009–2012 წლებში ტაძარი მასშტაბურად აღადგინეს თანამედროვე მასალებით, ლიფტისა და ახალი კონსტრუქციების
    ჩათვლით. სწორედ ამ ჩარევის გამო **იუნესკომ ბაგრატი მსოფლიო მემკვიდრეობის ნუსხიდან ამოიღო; დღეს ტაძარი
    ამ სიაში აღარ არის** — განსხვავებით გელათისგან, რომელიც ნუსხაში დარჩა.


    ეს არ ნიშნავს, რომ ვიზიტი არ ღირს: ბორცვიდან ქუთაისისა და რიონის ხეობის საუკეთესო ხედია, ხოლო თავად
    შენობა კარგად აჩვენებს რეკონსტრუქციის ეთიკის კამათს.


    ქვემოთ, ქალაქში:


    - კოლხიდის შადრევანი ცენტრალურ მოედანზე, ოქროს ნაკეთობათა გადიდებული ასლებით

    - თეთრი ხიდი და რიონის სანაპირო

    - მწვანე ბაზარი — იმერული ყველი, თაფლი, სანელებლები

    - ოპერის თეატრი და XIX საუკუნის საცხოვრებელი კვარტლები


    ქუთაისი ძველი კოლხეთის სამეფოს ცენტრად ითვლება — ოქროს საწმისისა და აიეტის ლეგენდები სწორედ ამ მხარეს
    უკავშირდება.


    ქუთაისი კომპაქტურია და მისი ცენტრი ფეხით ერთ საათში მოიარება. ქალაქი ბოლო წლებში სამზარეულოთი გამოირჩევა:
    იმერული ხაჭაპური, ხარჩო და ადგილობრივი ღვინო ცენტრის მცირე რესტორნებში ბევრად უკეთესია, ვიდრე ტურისტულ
    ზონებში. ბაზარი დილით ყველაზე ცოცხალია.
  tip: >-
    ტაძრამდე მანქანით ბოლომდე ახვალ, პარკინგი ზემოთაა; მაგრამ ჯობია ქალაქში დატოვო და ბორცვზე ფეხით ახვიდე
    — გზა თხუთმეტ წუთს იკავებს და ძველ უბნებზე გადის. ტაძარში ჩვეულებრივი სამონასტრო ჩაცმის წესი მოქმედებს.
    საღამოს ბორცვიდან მზის ჩასვლა ლამაზია, თუმცა განათება მწირია — ფანარი გამოგადგება. კაფეები, ტუალეტი
    და ბანკომატები ცენტრალურ მოედანთანაა, სულ ათი წუთის სავალზე.
  route: >
    თბილისიდან E60-ით ქუთაისამდე — ორას ოცდაათი კილომეტრი და დაახლოებით სამი საათი ოცი წუთი. მაგისტრალი
    რიკოთის ახალი გვირაბებით გადის და ეს მონაკვეთი ბოლო წლებში მნიშვნელოვნად დაჩქარდა. ქუთაისში შესვლისას
    ბაგრატი მარჯვნივ, ბორცვზე ჩანს და მიმართულების აღება ადვილია. ქალაქის ცენტრში ცალმხრივი მოძრაობაა
    და პარკინგი დღისით დატვირთულია. მთელი გზა ასფალტიანია, ეკონომ კლასი სავსებით საკმარისია. საწვავი,
    სერვისი და ბანკომატები ქუთაისში ყველგანაა. ქუთაისის საერთაშორისო აეროპორტი ქალაქიდან ოციოდე კილომეტრშია
    და მარშრუტის დაწყება ხშირად სწორედ იქიდან ჯობია.
en:
  name: Bagrati Cathedral and central Kutaisi
  short: The cathedral on Ukimerioni hill and the old streets of Kutaisi spread out below it.
  body: >-
    Bagrati Cathedral stands on Ukimerioni hill and is visible from most of Kutaisi. It was completed
    in 1003 under Bagrat III as the symbolic cathedral of a newly united Georgian kingdom. In 1692, during
    an Ottoman campaign, an explosion brought down the dome and much of the walls, and for nearly three
    centuries the building stood as a ruin.


    Between 2009 and 2012 it was heavily rebuilt using modern materials, including new structural elements
    and a lift. Because of that intervention **UNESCO removed Bagrati from the World Heritage List, and
    the cathedral is no longer inscribed** — unlike Gelati, which retained its listing.


    That does not make the visit pointless. The hill gives the best view over Kutaisi and the Rioni valley,
    and the building itself is an unusually clear illustration of the argument about how far restoration
    should go.


    Down in the town:


    - the Colchis Fountain on the central square, with enlarged copies of ancient goldwork

    - the White Bridge and the Rioni embankment

    - the Green Bazaar, good for Imeretian cheese, honey and spices

    - the opera house and streets of 19th-century townhouses


    Kutaisi is identified with the ancient kingdom of Colchis, and the legends of Aeetes and the Golden
    Fleece belong to this stretch of river.
  tip: >-
    You can drive all the way up to the cathedral and park at the top, but walking up from town is better:
    it takes about fifteen minutes and passes through the old quarters. Normal church dress rules apply
    inside. Sunset from the hill is worth staying for, though lighting on the path down is poor and a
    torch helps. Cafes, toilets and ATMs are all around the central square, roughly ten minutes below.
  route: >-
    From Tbilisi it is the E60 straight to Kutaisi — 230 km and about three hours twenty. The motorway
    now runs through the new Rikoti tunnels, which has cut a significant amount off this drive. As you
    enter the city Bagrati is obvious on the hill to your right, so navigation is easy. The centre of
    Kutaisi has one-way streets and parking fills during the day. The entire route is paved and an economy
    car is fine. Fuel, service stations and ATMs are everywhere in the city.
ru:
  name: Собор Баграти и центр Кутаиси
  short: Собор на холме Укимериони и старые кварталы Кутаиси, раскинувшиеся под ним.
  body: >
    Собор Баграти стоит на холме Укимериони и виден почти из любой точки Кутаиси. Его строительство завершилось
    в 1003 году при Баграте III: это был символический главный храм только что объединённого грузинского
    царства. В 1692 году во время османского похода взрыв обрушил купол и значительную часть стен, и почти
    три столетия храм простоял руиной.


    В 2009-2012 годах его масштабно восстановили с применением современных материалов, новых конструкций
    и лифта. Именно из-за этого вмешательства **ЮНЕСКО исключила Баграти из списка Всемирного наследия,
    и сегодня собор в этом списке не значится** — в отличие от Гелати, который статус сохранил.


    Визит от этого не теряет смысла: с холма открывается лучший вид на Кутаиси и долину Риони, а само
    здание наглядно иллюстрирует спор о допустимых границах реставрации.


    Внизу, в городе:


    - фонтан Колхиды на центральной площади с увеличенными копиями древних золотых изделий

    - Белый мост и набережная Риони

    - Зелёный базар: имеретинский сыр, мёд, специи

    - оперный театр и кварталы городских домов XIX века


    Кутаиси отождествляют с древним Колхидским царством — легенды об Ээте и золотом руне связаны именно
    с этими местами.


    Кутаиси компактен, и его центр обходится пешком примерно за час. В последние годы город заметен и
    гастрономически: имеретинский хачапури, харчо и местное вино в маленьких ресторанах центра заметно
    лучше, чем в туристических точках. Рынок оживлённее всего утром.
  tip: >-
    К собору можно подняться на машине и оставить её наверху, но приятнее пройти пешком из города: минут
    пятнадцать по старым кварталам. Внутри действуют обычные правила церковной одежды. Закат с холма красив,
    но подсветка на спуске слабая, фонарик пригодится. Кафе, туалеты и банкоматы сосредоточены вокруг
    центральной площади, примерно в десяти минутах ниже.
  route: >-
    Из Тбилиси — по трассе E60 прямо до Кутаиси: 230 км и около трёх часов двадцати минут. Магистраль
    теперь идёт через новые рикотские тоннели, и это заметно сократило время в пути. При въезде в город
    Баграти хорошо виден на холме справа, так что заблудиться сложно. В центре Кутаиси одностороннее движение,
    а днём парковки заполнены. Вся дорога асфальтированная, машины эконом-класса достаточно. Заправки,
    сервисы и банкоматы есть по всему городу.
fa:
  name: کلیسای جامع باگراتی و مرکز کوتایسی
  short: کلیسای جامع بر تپهٔ اوکیمریونی و خیابان‌های قدیمی کوتایسی که زیر آن گسترده‌اند.
  body: >-
    کلیسای جامع باگراتی بر تپهٔ اوکیمریونی ایستاده و از بیشتر نقاط کوتایسی دیده می‌شود. ساخت آن در 1003
    در زمان باگرات سوم به پایان رسید، به‌عنوان کلیسای نمادین پادشاهی تازه‌متحدشدهٔ گرجستان. در 1692، در
    جریان لشکرکشی عثمانی، انفجاری گنبد و بخش بزرگی از دیوارها را فرو ریخت و بنا نزدیک به سه سده ویرانه
    ماند.


    میان 2009 تا 2012 با مصالح مدرن، از جمله عناصر سازه‌ای تازه و یک آسانسور، به‌شدت بازسازی شد. به‌سبب
    همین مداخله **یونسکو باگراتی را از فهرست میراث جهانی حذف کرد و کلیسا دیگر ثبت‌شده نیست** — برخلاف
    گلاتی که ثبت خود را حفظ کرد.


    این بازدید را بی‌فایده نمی‌کند. تپه بهترین منظره را بر کوتایسی و درهٔ ریونی می‌دهد و خود بنا نمونه‌ای
    غیرعادی روشن از بحث بر سر مرزهای مجاز مرمت است.


    پایین در شهر:


    - فوارهٔ کلخیس در میدان مرکزی، با نسخه‌های بزرگ‌شدهٔ زرینه‌های باستانی

    - پل سفید و کرانهٔ ریونی

    - بازار سبز، خوب برای پنیر ایمرتی، عسل و ادویه

    - ساختمان اپرا و خیابان‌هایی از خانه‌های شهری سدهٔ نوزدهم


    کوتایسی با پادشاهی باستانی کلخیس شناخته می‌شود و افسانه‌های آئتس و پشم زرین به همین بخش از رودخانه
    تعلق دارند.
  tip: >-
    می‌توانید تا خود کلیسا رانندگی کنید و بالا پارک کنید، اما پیاده بالا رفتن از شهر بهتر است: حدود پانزده
    دقیقه طول می‌کشد و از محله‌های قدیمی می‌گذرد. داخل کلیسا قواعد معمول پوشش برقرار است. ماندن برای غروب
    از روی تپه ارزش دارد، هرچند مسیر پایین آمدن روشنایی خوبی ندارد و چراغ‌قوه کمک می‌کند. کافه، سرویس
    بهداشتی و خودپرداز همه دور میدان مرکزی‌اند، حدود ده دقیقه پایین‌تر.
  route: >-
    از تفلیس مستقیم با E60 به کوتایسی — 230 کیلومتر و حدود سه ساعت و بیست دقیقه. بزرگراه اکنون از تونل‌های
    تازهٔ ریکوتی می‌گذرد و همین زمان قابل‌توجهی از این مسیر کم کرده است. هنگام ورود به شهر باگراتی روی
    تپهٔ سمت راست کاملاً پیداست، پس مسیریابی آسان است. مرکز کوتایسی خیابان‌های یک‌طرفه دارد و پارکینگ
    در طول روز پر می‌شود. کل مسیر آسفالت است و خودروی اقتصادی مناسب است. سوخت، تعمیرگاه و خودپرداز در
    سراسر شهر هست.
he:
  name: קתדרלת בגראטי ומרכז קוטאיסי
  short: הקתדרלה על גבעת אוקימריוני והרחובות הישנים של קוטאיסי הפרושים למטה.
  body: >-
    קתדרלת בגראטי עומדת על גבעת אוקימריוני ונראית כמעט מכל מקום בקוטאיסי. היא הושלמה ב-1003 בימי בגרט
    השלישי ככנסייה הסמלית של ממלכה גאורגית מאוחדת מחדש. ב-1692, במהלך מסע עות'מאני, מוטט פיצוץ את הכיפה
    ואת רוב החומות, ובמשך קרוב לשלוש מאות שנה עמד המבנה כחורבה.


    בין 2009 ל-2012 הוא נבנה מחדש בהיקף רחב בחומרים מודרניים, ובהם אלמנטים מבניים חדשים ומעלית. בשל אותה
    התערבות **הסירה אונסקו את בגראטי מרשימת מורשת עולמית, והקתדרלה אינה רשומה עוד** — בניגוד לגלאטי, ששמר
    על מעמדו.


    זה אינו הופך את הביקור למיותר. הגבעה מציעה את התצפית הטובה ביותר על קוטאיסי ועל עמק הריוני, והמבנה
    עצמו הוא המחשה בהירה במיוחד לוויכוח על גבולותיו של שחזור.


    למטה בעיר:


    - מזרקת קולכיס בכיכר המרכזית, עם העתקים מוגדלים של פריטי זהב עתיקים

    - הגשר הלבן וטיילת הריוני

    - הבזאר הירוק, מצוין לגבינה אימרתית, לדבש ולתבלינים

    - בניין האופרה ורחובות של בתי עיר מן המאה ה-19


    קוטאיסי מזוהה עם ממלכת קולכיס העתיקה, ואגדות אייטס וגיזת הזהב שייכות לקטע הזה של הנהר.
  tip: >-
    אפשר לנסוע ברכב עד הקתדרלה ולחנות למעלה, אבל עדיף לעלות ברגל מן העיר: זה לוקח כרבע שעה ועובר ברבעים
    הישנים. בפנים חלים כללי הלבוש הרגילים בכנסייה. שווה להישאר לשקיעה מן הגבעה, אם כי התאורה בשביל היורד
    גרועה ופנס עוזר. בתי קפה, שירותים וכספומטים נמצאים כולם סביב הכיכר המרכזית, כעשר דקות למטה.
  route: >-
    מטביליסי זהו כביש E60 ישר לקוטאיסי — 230 ק״מ וכשלוש שעות עשרים. הכביש המהיר עובר עכשיו במנהרות ריקוטי
    החדשות, מה שקיצר את הנסיעה במידה ניכרת. עם הכניסה לעיר בגראטי בולט על הגבעה מימין, ולכן הניווט פשוט.
    במרכז קוטאיסי יש רחובות חד-סטריים והחניה מתמלאת במהלך היום. כל המסלול סלול ורכב חסכוני מתאים. דלק,
    מוסכים וכספומטים יש בכל רחבי העיר.
ar:
  name: كاتدرائية باغراتي ووسط كوتايسي
  short: الكاتدرائية على تل أوكيميريوني وشوارع كوتايسي القديمة الممتدة تحتها.
  body: >-
    تقوم كاتدرائية باغراتي على تل أوكيميريوني وتُرى من معظم أنحاء كوتايسي. اكتمل بناؤها عام 1003 في عهد
    باغرات الثالث لتكون الكاتدرائية الرمزية لمملكة جورجية حديثة التوحيد. وفي عام 1692، خلال حملة عثمانية،
    أسقط انفجار القبة ومعظم الجدران، وبقي البناء أطلالاً قرابة ثلاثة قرون.


    وبين عامي 2009 و2012 أُعيد بناؤها على نطاق واسع بمواد حديثة، شملت عناصر إنشائية جديدة ومصعداً. وبسبب
    هذا التدخل **شطبت اليونسكو باغراتي من قائمة التراث العالمي، ولم تعد الكاتدرائية مدرجة** — بخلاف غيلاتي
    التي احتفظت بإدراجها.


    لكن ذلك لا يجعل الزيارة بلا معنى. فالتل يمنح أفضل إطلالة على كوتايسي ووادي ريوني، والمبنى نفسه مثال
    واضح إلى حد نادر على الجدل حول حدود الترميم المقبولة.


    وفي الأسفل في المدينة:


    - نافورة كولخيس في الساحة المركزية، بنسخ مكبَّرة من المشغولات الذهبية القديمة

    - الجسر الأبيض وكورنيش ريوني

    - البازار الأخضر، ممتاز للجبن الإيميريتي والعسل والتوابل

    - دار الأوبرا وشوارع بيوت المدينة من القرن التاسع عشر


    وتُنسب كوتايسي إلى مملكة كولخيس القديمة، وأساطير أيتيس والجزة الذهبية تخص هذا المقطع من النهر.
  tip: >-
    يمكنك القيادة حتى الكاتدرائية والوقوف في الأعلى، لكن الصعود سيراً من المدينة أفضل: يستغرق نحو خمس
    عشرة دقيقة ويمر بالأحياء القديمة. وتُطبق في الداخل قواعد اللباس المعتادة في الكنائس. ويستحق غروب الشمس
    من التل البقاء له، وإن كانت إنارة الدرب نزولاً ضعيفة ويفيد معها مصباح يدوي. المقاهي ودورات المياه
    وأجهزة الصراف كلها حول الساحة المركزية، على بعد نحو عشر دقائق في الأسفل.
  route: >-
    من تبليسي الطريق E60 مباشرة إلى كوتايسي — 230 كم ونحو ثلاث ساعات وعشرين دقيقة. ويمر الطريق السريع
    الآن عبر أنفاق ريكوتي الجديدة، وهو ما اختصر جزءاً كبيراً من هذه الرحلة. وعند دخول المدينة تظهر باغراتي
    بوضوح على التل إلى يمينك، فالملاحة سهلة. ووسط كوتايسي فيه شوارع باتجاه واحد وتمتلئ مواقفه خلال النهار.
    الطريق كله معبّد وسيارة اقتصادية مناسبة. والوقود ومحطات الخدمة وأجهزة الصراف منتشرة في المدينة كلها.
