ka:
  name: ფოკის წმინდა ნინოს დედათა მონასტერი
  short: >-
    XI საუკუნის ეკლესია და მოქმედი დედათა მონასტერი ფარავნის სამხრეთ ნაპირზე, 2073 მეტრზე — იქ, სადაც
    გადმოცემით წმინდა ნინო შეჩერდა.
  body: >-
    **გადმოცემით, ქრისტიანობა საქართველოში ამ მთებით ფეხით შემოვიდა: სომხეთიდან ჯავახეთის მთებით მომავალი
    წმინდა ნინო სწორედ აქ, ფარავნის ტბის ნაპირას შეჩერდა.**


    ამას „მოქცევაჲ ქართლისაჲ“ მოგვითხრობს და ფოკა ამ ამბავს დღემდე ინახავს. სოფელი ტბის სამხრეთ ნაპირზე,
    დაახლოებით 2080 მეტრზე დგას, ნინოწმინდიდან 28 კილომეტრში; ტბის სარკე 2073 მეტრზეა, 37,5 კვადრატული
    კილომეტრით კი ფარავანი საქართველოს უდიდესი ტბაა. ზამთარში მას ყინული 73 სანტიმეტრამდე სისქით ფარავს.


    წმინდა ნინოს ეკლესია პატარა და ძველია: ადგილობრივი, სუფთად თლილი ქვით ნაგები XI საუკუნის დარბაზი,
    ჩუქურთმიანი კარ-სარკმლით, შიგნით კი მხატვრობის ფრაგმენტებით. სამხრეთ კედელს დააკვირდით. ერთი წარწერა
    ქრისტეს სთხოვს, ადიდოს ბაგრატ კურაპალატი, მეორე ქართლის კათალიკოსს, იოანე ოქროპირს, მოიხსენიებს, კიდევ
    ერთი კი თავად მშენებლისაა: „მე ბავრელი ღირს ვიქმენ შენებასა წმიდაისა ამის ეკლესიისა... ხელოსანი ვიყავ
    ოქროპირისა ქართლისა კათალიკოზისა“.


    ეკლესიის გარშემო წმინდა ნინოს დედათა მონასტერია, სამრევლო სკოლით, სამედიცინო კაბინეტითა და მაღაზიით;
    სოფელში მამათა მონასტერიც მოქმედებს. 1989 წლიდან, კათოლიკოს-პატრიარქ ილია II-ის ლოცვა-კურთხევით, ყოველ
    1 ივნისს, წმინდა ნინოს საქართველოში შემოსვლის დღეს, აქ მღვდელმთავრები, სასულიერო პირები და მრევლი
    იკრიბება, ნათლისღებას კი ტბის წყალში აღნიშნავენ.


    ფოკის 1115 მცხოვრების უმრავლესობა სომეხია — ასე უკვე XX საუკუნის დასაწყისშიც იყო. მონასტერი მათ სოფელში
    ქართული კუნძულია, მეზობლებს კი ერთი და იგივე ქარი აერთიანებს. როცა ქარი ჩადგება, ნაპირზე დადექით:
    ტბა და ცა უნაკეროდ ერწყმის ერთმანეთს.
  tip: >-
    ერთი საათი საკმარისია. ჩაიცვით ისე, როგორც ნებისმიერ ქართულ მონასტერში: ქალებს თავსაფარი და კაბა,
    კაცებს გრძელი შარვალი; მოსასხამები ჩვეულებრივ კართან გელოდებათ. დების ყოველდღიური წესრიგი უპირველესია
    — ხმადაბლა ილაპარაკეთ და ვინმეს გადაღებამდე ნებართვა ითხოვეთ. 2000 მეტრზე ჩრდილი არ არის და მზე მაშინაც
    წვავს, როცა ქარი ცივია: ქუდი, მზისგან დამცავი კრემი და ქარგაუმტარი ქურთუკი წამოიღეთ. ტბის ნაპირი ჭაობიანია.
    საჭმელი და ნორმალური ტუალეტი ნინოწმინდაშია, 28 კილომეტრში. 1 ივნისს, წმინდა ნინოს საქართველოში შემოსვლის
    დღესასწაულზე, ხალხმრავლობას, მღვდელმთავრებსა და გადავსებულ სადგომს ელოდეთ.
  route: >-
    თბილისიდან Sh36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ Sh31-ით ზეგნის გადაღმა წალკამდე იარეთ, იქიდან
    კი სამხრეთით: გზა ფარავნამდე ადის და ტბის გასწვრივ მის სამხრეთ ბოლოში, ფოკამდე მიდის. სულ დაახლოებით
    140 კილომეტრი და ორნახევარი საათი. გზა ასფალტია, თუმცა ზეგანზე არათანაბარი, მონასტრის ჭიშკრამდე ბოლო
    მონაკვეთი კი ხრეშიანია. საწვავი წალკაში შეავსეთ. გირჩევთ ჯიპს — კლირენსისა და ძლიერი ქარის გამო; ნოემბრიდან
    აპრილამდე თოვლისა და ყინულის გამო ის აუცილებელია, ქარბუქში კი გზა შეიძლება საათობით ჩაიკეტოს.
en:
  name: Poka Nunnery of St Nino
  short: >-
    An 11th-century church and a living convent on the southern shore of Lake Paravani, at 2,073 m, where
    tradition says St Nino paused.
  body: >-
    **Tradition says that Christianity came into Georgia over these hills on foot: St Nino, walking from
    Armenia through the mountains of Javakheti, stopped here, on the shore of Lake Paravani.**


    The story is told in the 'Conversion of Kartli', and Poka keeps it alive. The village lies on the
    southern shore of the lake at about 2,080 m, 28 km from Ninotsminda; the water beside it sits at 2,073
    m, and at 37.5 km² Paravani is the largest lake in Georgia. In winter it lies under ice up to 73 cm
    thick.


    The Church of St Nino is small and old: an 11th-century hall of neatly dressed local stone, its door
    and windows framed in carving, fragments of painting still inside. Read the south wall. One inscription
    asks Christ to glorify Bagrat the kouropalates; another names Ioane Okropiri, Catholicos of Kartli;
    a third is the builder's own: 'I, Bavreli, was found worthy to build this holy church… I was the master
    builder of Okropiri, Catholicos of Kartli.'


    Around the church has grown the convent of St Nino, with a parish school, a medical room and a shop;
    a monastery for monks works in the village too. Since 1989, with the blessing of Patriarch Ilia II,
    bishops, clergy and pilgrims gather here every 1 June, the feast of St Nino's coming into Georgia,
    and Epiphany is celebrated in the waters of the lake.


    Most of Poka's 1,115 people are Armenian, as they already were at the start of the 20th century. The
    convent is a Georgian island in their village, and the same wind binds the neighbours together. When
    it drops, stand on the shore: lake and sky run into each other without a seam.
  tip: >-
    An hour is enough. Dress as for any Georgian convent: women in a headscarf and skirt, men in long
    trousers; wraps usually wait by the door. The sisters' routine comes first, so keep your voice low
    and ask before photographing anyone. At 2,000 m there is no shade and the sun burns even when the
    wind is cold: bring a hat, sunscreen and a windproof jacket. The shore is boggy. Food and a proper
    toilet are in Ninotsminda, 28 km on. On 1 June, for the St Nino feast, expect crowds, bishops and
    a full car park.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi, then the Sh31 across the plateau to Tsalka,
    and from there head south: the road climbs to Paravani and runs along the lake to Poka at its southern
    end. About 140 km and two and a half hours. The road is asphalt but uneven on the plateau, and the
    last stretch to the convent gate is gravel. Fill up in Tsalka. We recommend an SUV for its clearance
    and stability in strong wind; from November to April snow and ice make it essential, and in a blizzard
    the road can close for hours.
ru:
  name: Женский монастырь Святой Нино в Поке
  short: >-
    Церковь XI века и действующая женская обитель на южном берегу озера Паравани, на высоте 2073 м, где,
    по преданию, остановилась святая Нино.
  body: >-
    **Предание говорит, что христианство пришло в Грузию через эти холмы пешком: святая Нино, шедшая из
    Армении через горы Джавахети, остановилась здесь, на берегу озера Паравани.**


    Эта история записана в «Обращении Картли», и Пока бережёт её до сих пор. Село лежит на южном берегу
    озера, на высоте около 2080 м, в 28 км от Ниноцминды; вода рядом стоит на отметке 2073 м, а при площади
    37,5 км² Паравани — самое большое озеро Грузии. Зимой его сковывает лёд толщиной до 73 см.


    Церковь Святой Нино невелика и стара: однонефный храм XI века из аккуратно тёсанного местного камня,
    двери и окна обрамлены резьбой, внутри сохранились фрагменты росписи. Прочтите южную стену. Одна надпись
    просит Христа возвеличить Баграта куропалата; другая называет Иоанна Окропири, католикоса Картли;
    ещё одна — надпись самого строителя: «Я, Баврели, удостоился построить эту святую церковь… Я был мастером-строителем
    Окропири, католикоса Картли».


    Вокруг церкви вырос женский монастырь Святой Нино с приходской школой, медпунктом и лавкой; в селе
    действует и мужской монастырь. С 1989 года, по благословению Патриарха Илии II, ежегодно 1 июня, в
    праздник прихода святой Нино в Грузию, здесь собираются архиереи, духовенство и паломники, а Крещение
    празднуют в водах озера.


    Большинство из 1115 жителей Поки — армяне, как и в начале XX века. Монастырь — грузинский островок
    в их селе, и один и тот же ветер связывает соседей. Когда он стихнет, встаньте на берегу: озеро и
    небо сходятся без шва.
  tip: >-
    Часа достаточно. Одевайтесь, как в любой грузинский женский монастырь: женщинам — платок и юбка, мужчинам
    — длинные брюки; накидки обычно ждут у входа. Уклад сестёр важнее всего, поэтому говорите тихо и спрашивайте
    разрешения, прежде чем кого-то фотографировать. На 2000 метрах тени нет, и солнце жжёт, даже когда
    ветер холодный: возьмите шляпу, солнцезащитный крем и ветровку. Берег топкий. Еда и нормальный туалет
    — в Ниноцминде, в 28 км дальше. 1 июня, в праздник святой Нино, ждите толпу, архиереев и забитую парковку.
  route: >-
    Из Тбилиси поезжайте по Sh36 через Коджори и Манглиси, затем по Sh31 через плато до Цалки, а оттуда
    — на юг: дорога поднимается к Паравани и идёт вдоль озера до Поки у его южной оконечности. Около 140
    км и два с половиной часа. Дорога асфальтовая, но на плато неровная, а последний отрезок до ворот
    монастыря — гравийный. Заправьтесь в Цалке. Советуем внедорожник — за клиренс и устойчивость при сильном
    ветре; с ноября по апрель снег и гололёд делают его обязательным, а в метель дорогу могут закрыть
    на несколько часов.
fa:
  name: دیر بانوان نینوی قدیس در پوکا
  short: >-
    کلیسایی از سدهٔ یازدهم و دیر بانوانی فعال بر کرانهٔ جنوبی دریاچهٔ پاراوانی، در ارتفاع ۲۰۷۳ متری؛ جایی
    که به روایت سنت، نینوی قدیس درنگ کرد.
  body: >-
    **سنت می‌گوید مسیحیت پای‌پیاده از همین تپه‌ها به گرجستان آمد: نینوی قدیس که از ارمنستان از میان کوه‌های
    جاواختی می‌آمد، اینجا، بر کرانهٔ دریاچهٔ پاراوانی، درنگ کرد.**


    این داستان در کتاب «گرویدن کارتلی» آمده و پوکا آن را زنده نگه داشته است. روستا بر کرانهٔ جنوبی دریاچه،
    در ارتفاع حدود ۲۰۸۰ متر و ۲۸ کیلومتری نینوتسمیندا قرار دارد؛ آبِ کنارش در ارتفاع ۲۰۷۳ متری است و پاراوانی
    با ۳۷٫۵ کیلومتر مربع بزرگ‌ترین دریاچهٔ گرجستان است. در زمستان یخی تا ۷۳ سانتی‌متر ضخامت رویش را می‌پوشاند.


    کلیسای نینوی قدیس کوچک و کهن است: کلیسایی تک‌تالاری از سدهٔ یازدهم، از سنگ محلیِ به‌دقت تراشیده، با
    در و پنجره‌هایی در قاب کنده‌کاری و پاره‌هایی از نقاشی دیواری که هنوز در درون مانده است. دیوار جنوبی
    را بخوانید. یک کتیبه از مسیح می‌خواهد باگرات کوروپالات را بزرگ دارد؛ دیگری از یوآنه اوکروپیری، جاثلیق
    کارتلی، نام می‌برد؛ و یکی دیگر از آنِ خود سازنده است: «من، باورلی، سزاوار آن شدم که این کلیسای مقدس
    را بسازم… من استادکار معمارِ اوکروپیری، جاثلیق کارتلی، بودم.»


    پیرامون کلیسا دیر بانوان نینوی قدیس شکل گرفته است، با مدرسهٔ کلیسایی، اتاق درمان و فروشگاه؛ یک دیر
    مردانه نیز در روستا فعال است. از سال ۱۹۸۹، با تبرک پاتریارک ایلیای دوم، هر سال در ۱ ژوئن، روز جشن
    آمدن نینوی قدیس به گرجستان، اسقفان، روحانیان و زائران اینجا گرد می‌آیند و جشن تعمید مسیح (اپیفانی)
    در آب‌های دریاچه برگزار می‌شود.


    بیشتر ۱۱۱۵ ساکن پوکا ارمنی‌اند، همان‌گونه که در آغاز سدهٔ بیستم هم بودند. دیر جزیره‌ای گرجی در روستای
    آنان است و همان باد همسایه‌ها را به هم پیوند می‌دهد. وقتی باد فرو نشست، بر کرانه بایستید: دریاچه و
    آسمان بی‌هیچ درزی در هم می‌روند.
  tip: >-
    یک ساعت کافی است. مانند هر دیر بانوان در گرجستان لباس بپوشید: بانوان روسری و دامن، آقایان شلوار بلند؛
    معمولاً کنار در پوشش اضافه گذاشته‌اند. برنامهٔ روزانهٔ راهبه‌ها مقدم است؛ پس آهسته حرف بزنید و پیش
    از عکس گرفتن از کسی اجازه بگیرید. در ارتفاع ۲۰۰۰ متری سایه‌ای نیست و آفتاب حتی وقتی باد سرد است می‌سوزاند:
    کلاه، کرم ضدآفتاب و بادگیر همراه داشته باشید. کرانه باتلاقی است. غذا و سرویس بهداشتی درست‌وحسابی در
    نینوتسمیندا است، ۲۸ کیلومتر جلوتر. در ۱ ژوئن، جشن نینوی قدیس، منتظر جمعیت، اسقفان و پارکینگی پر باشید.
  route: >-
    از تفلیس جادهٔ Sh36 را از کوجوری و مانگلیسی بگیرید، سپس از جادهٔ Sh31 از فلات بگذرید تا تسالکا، و
    از آنجا به سوی جنوب بروید: جاده تا پاراوانی بالا می‌رود و در امتداد دریاچه تا پوکا در انتهای جنوبی
    آن پیش می‌رود. حدود ۱۴۰ کیلومتر و دو ساعت و نیم. جاده آسفالته است اما روی فلات ناهموار، و تکهٔ آخر
    تا دروازهٔ دیر شنی است. در تسالکا باک را پر کنید. خودروی شاسی‌بلند را برای فاصلهٔ زیادش از زمین و
    پایداری در باد شدید توصیه می‌کنیم؛ از نوامبر تا آوریل برف و یخ آن را ضروری می‌کند و در کولاک ممکن
    است جاده ساعت‌ها بسته بماند.
he:
  name: מנזר הנזירות של נינו הקדושה בפוקה
  short: >-
    כנסייה מהמאה ה-11 ומנזר נזירות פעיל על החוף הדרומי של אגם פרוואני, בגובה 2,073 מ', במקום שבו, לפי
    המסורת, עצרה נינו הקדושה.
  body: >-
    **המסורת מספרת שהנצרות הגיעה לגאורגיה ברגל, דרך הגבעות האלה: נינו הקדושה, שהלכה מארמניה דרך הרי ג'אוואחטי,
    עצרה כאן, על חוף אגם פרוואני.**


    הסיפור מסופר בחיבור "התנצרות קרתלי", ופוקה שומרת אותו חי. הכפר שוכן על החוף הדרומי של האגם בגובה של
    כ-2,080 מ', 28 ק"מ מנינוצמינדה; המים שלצדו נמצאים בגובה 2,073 מ', ובשטח של 37.5 קמ"ר פרוואני הוא האגם
    הגדול ביותר בגאורגיה. בחורף הוא מכוסה קרח שעוביו מגיע עד 73 ס"מ.


    כנסיית נינו הקדושה קטנה ועתיקה: כנסיית אולם מהמאה ה-11, בנויה מאבן מקומית מסותתת בקפידה, הדלת והחלונות
    ממוסגרים בגילופים, ובפנים שרדו שרידי ציורי קיר. קראו את הקיר הדרומי. כתובת אחת פונה אל ישו ומבקשת
    שיפאר את בגרט הקורופלטס; שנייה מזכירה את יואנה אוקרופירי, הקתוליקוס של קרתלי; אחרת היא של הבנאי עצמו:
    "אני, באברלי, זכיתי לבנות את הכנסייה הקדושה הזאת… הייתי אדריכלו של אוקרופירי, הקתוליקוס של קרתלי".


    סביב הכנסייה צמח מנזר הנזירות של נינו הקדושה, ובו בית ספר קהילתי, חדר מרפאה וחנות; בכפר פועל גם מנזר
    של נזירים. מאז 1989, בברכת הפטריארך איליה השני, מתכנסים כאן מדי 1 ביוני — חג בואה של נינו הקדושה לגאורגיה
    — בישופים, אנשי כמורה ועולי רגל, ואת חג ההתגלות חוגגים במי האגם.


    רוב 1,115 תושבי פוקה הם ארמנים, כפי שהיו כבר בראשית המאה ה-20. המנזר הוא אי גאורגי בכפר שלהם, ואותה
    רוח קושרת את השכנים זה לזה. כשהיא שוככת, עמדו על החוף: האגם והשמיים נמזגים זה בזה בלי תפר.
  tip: >-
    שעה מספיקה. התלבשו כמו לכל מנזר נזירות בגאורגיה: נשים בכיסוי ראש ובחצאית, גברים במכנסיים ארוכים; בדרך
    כלל ממתינים ליד הדלת צעיפים ובדים להתעטף בהם. סדר היום של הנזירות קודם לכול, לכן דברו בשקט ובקשו רשות
    לפני שאתם מצלמים מישהו. בגובה 2,000 מ' אין צל, והשמש צורבת גם כשהרוח קרה: הביאו כובע, קרם הגנה ומעיל
    רוח. החוף ביצתי. אוכל ושירותים של ממש יש בנינוצמינדה, 28 ק"מ הלאה. ב-1 ביוני, בחג נינו הקדושה, צפו
    להמונים, לבישופים ולחניון מלא.
  route: >-
    מטביליסי סעו בכביש Sh36 דרך קוג'ורי ומנגליסי, אחר כך בכביש Sh31 לרוחב הרמה עד צלקה, ומשם דרומה: הכביש
    מטפס אל פרוואני ונמשך לאורך האגם עד פוקה שבקצהו הדרומי. כ-140 ק"מ ושעתיים וחצי. הכביש סלול אבל משובש
    על הרמה, והקטע האחרון עד שער המנזר הוא דרך חצץ. תדלקו בצלקה. אנו ממליצים על רכב שטח בזכות מרווח הגחון
    והיציבות ברוח חזקה; מנובמבר עד אפריל, בשלג ובקרח, הוא הכרחי, ובסופת שלגים הכביש עלול להיסגר לשעות.
ar:
  name: دير الراهبات على اسم القديسة نينو في بوكا
  short: >-
    كنيسة من القرن الحادي عشر ودير راهبات عامر على الضفة الجنوبية لبحيرة بارافاني، على ارتفاع 2073 م،
    حيث توقّفت القديسة نينو كما يروي التقليد.
  body: >-
    **يروي التقليد أن المسيحية دخلت جورجيا عبر هذه التلال سيراً على الأقدام: فالقديسة نينو، وهي قادمة
    من أرمينيا عبر جبال جافاخيتي، توقّفت هنا، على ضفة بحيرة بارافاني.**


    تُروى القصة في كتاب «اهتداء كارتلي»، وبوكا تُبقيها حيّة. تقع القرية على الضفة الجنوبية للبحيرة على
    ارتفاع نحو 2080 م، وعلى بُعد 28 كم من نينوتسميندا؛ أما الماء بجوارها فعلى ارتفاع 2073 م، وبمساحة 37.5
    كم² تُعدّ بارافاني أكبر بحيرة في جورجيا. وفي الشتاء يغطيها جليد يصل سُمكه إلى 73 سم.


    كنيسة القديسة نينو صغيرة وعتيقة: كنيسة ذات صحن واحد من القرن الحادي عشر، مبنية من حجر محلي منحوت بعناية،
    تؤطّر الزخارف المنحوتة بابها ونوافذها، وما زالت في داخلها بقايا من الرسوم الجدارية. اقرأ الجدار الجنوبي.
    نقش يدعو المسيح أن يمجّد باغرات الكوروبالاط، وآخر يذكر يوانه أوكروبيري، جاثليق كارتلي، وآخر هو نقش
    البنّاء نفسه: «أنا بافريلي، استحققتُ أن أبني هذه الكنيسة المقدسة… كنتُ المعلّم البنّاء لأوكروبيري،
    جاثليق كارتلي».


    حول الكنيسة نشأ دير الراهبات على اسم القديسة نينو، وفيه مدرسة رعوية وغرفة طبية ومتجر صغير، كما يعمل
    في القرية دير للرهبان. ومنذ عام 1989، بمباركة البطريرك إيليا الثاني، يجتمع هنا الأساقفة ورجال الدين
    والحجّاج في الأول من يونيو من كل عام، وهو عيد قدوم القديسة نينو إلى جورجيا، ويُحتفل بعيد الغطاس في
    مياه البحيرة.


    معظم سكان بوكا البالغ عددهم 1115 نسمة من الأرمن، كما كانوا في مطلع القرن العشرين. والدير جزيرة جورجية
    في قريتهم، والريح نفسها تربط الجيران بعضهم ببعض. وحين تهدأ، قف على الضفة: تذوب البحيرة في السماء بلا
    أي فاصل.
  tip: >-
    تكفي ساعة. البس كما تلبس لأي دير راهبات في جورجيا: للنساء غطاء رأس وتنّورة، وللرجال سراويل طويلة؛
    وعادةً ما تنتظر عند الباب أوشحة للتغطية. نظام حياة الراهبات يأتي أولاً، فاخفض صوتك واستأذن قبل تصوير
    أي شخص. على ارتفاع 2000 م لا ظلّ، والشمس تلسع حتى حين تكون الريح باردة: احمل قبعة وواقياً من الشمس
    وسترة تقي من الريح. الضفة مستنقعية. الطعام ودورة المياه اللائقة في نينوتسميندا، على بُعد 28 كم. وفي
    الأول من يونيو، عيد القديسة نينو، توقّع الزحام والأساقفة وموقفاً ممتلئاً.
  route: >-
    من تبليسي اسلك الطريق Sh36 عبر كوجوري ومانغليسي، ثم الطريق Sh31 عبر الهضبة إلى تسالكا، ومن هناك اتجه
    جنوباً: يصعد الطريق إلى بارافاني ويسير بمحاذاة البحيرة حتى بوكا عند طرفها الجنوبي. نحو 140 كم وساعتان
    ونصف. الطريق معبّد لكنه غير مستوٍ على الهضبة، والمقطع الأخير حتى بوابة الدير حصوي. املأ خزان الوقود
    في تسالكا. ننصح بسيارة دفع رباعي لارتفاعها عن الأرض وثباتها في الريح الشديدة؛ ومن نوفمبر إلى أبريل
    يجعلها الثلج والجليد ضرورية، وقد يُغلق الطريق ساعات في العاصفة الثلجية.
