ka:
  name: ფოკის წმინდა ნინოს დედათა მონასტერი
  short: ფარავნის ტბის ნაპირზე, ორ ათას მეტრზე მდგარი დედათა მონასტერი მინანქრისა და ყველის სახელოსნოებით.
  body: >-
    **ფოკა ფარავნის ტბის ჩრდილო-დასავლეთ ნაპირზეა, ზუსტად ორ ათას სამოცდაათ მეტრზე.** ეს საქართველოს ერთ-ერთი
    ყველაზე მაღალი მოქმედი მონასტერია და, ალბათ, ყველაზე ღია ადგილას მდგარი: გარშემო ხე არ არის, მხოლოდ
    ტბა, ბალახი და ჰორიზონტი.


    ადგილს გადმოცემა წმინდა ნინოს უკავშირებს. IV საუკუნეში ქართლში მიმავალი წმინდა ნინო ჯავახეთის ზეგანზე
    გადმოვიდა და ფარავანთან შეჩერდა — სწორედ აქ, ტბის ნაპირას. ძველი ქვის ეკლესია, პატარა და დაბალი, სწორედ
    ამ გადმოცემას უკავშირდება; ის ჯავახეთის ტიპურ ვულკანურ ქვაშია ნაგები და ზეგანის ფერს იმეორებს.


    დედათა მონასტერი 1990-იან წლებში აღდგა და დღეს სწორედ სახელოსნოებით არის ცნობილი:


    - **მინანქარი** — ქართული გადახურვითი მინანქრის ტექნიკით შესრულებული ჯვრები და ხატები, რომლებიც თბილისის
    მაღაზიებშიც იყიდება

    - **ყველი და რძის პროდუქტი** — ზეგნის მაღალმთიანი საძოვრის რძისგან

    - პატარა მაღაზია მონასტრის ეზოში, სადაც ორივე შეიძლება იყიდო


    ზეგნის ამ ნაწილში სოფლების უმეტესობა სომხურენოვანია და მონასტერი მრავალი კილომეტრის რადიუსში ერთ-ერთი
    მცირერიცხოვანი ქართული მართლმადიდებლური სავანეა. ფარავანი სამხრეთით იღვრება — ფარავნის მდინარე ხერთვისთან
    მტკვარს უერთდება, ანუ წყალი, რომელიც აქ მონასტრის წინ ჩამოდის, ბოლოს ვარძიის კედლების ქვეშ გაივლის.


    ტბა ცალკე სანახავია. ფარავანი ფართობით საქართველოს უდიდესი ტბაა და მისი ნაპირი აქ თითქმის ბრტყელია
    — წყალი და ცა ერთმანეთში გადადის, განსაკუთრებით უქარო დილას. ზამთარში ტბა მთლიანად იყინება.


    და პირდაპირ: ეს ადგილი ზაფხულის ადგილია. ნოემბრიდან აპრილამდე აქ თოვლი, მუდმივი ქარი და ღამით მინუს
    ოცდაათამდე ტემპერატურაა. მონასტერი წელიწადის ყველა დროს მუშაობს, მაგრამ ზამთარში მისვლა ამინდზეა დამოკიდებული.
  tip: >-
    ერთი საათი საკმარისია. ჩაცმის წესები მოქმედებს: ქალებს თავსაფარი და გრძელი კალთა, კაცებს გრძელი შარვალი;
    კართან ჩვეულებრივ დევს. მინანქრის სახელოსნო ყოველთვის ღია არაა — ეზოში იკითხე. ორ ათას მეტრზე მზე
    ძლიერია და ჩრდილი არ არსებობს, ქუდი და კრემი წაიღე; ქარი კი თითქმის ყოველთვის ქრის, ქარსაცავი ქურთუკი
    ზაფხულშიც გამოგადგება. ტუალეტი მარტივია, კაფე ნინოწმინდაშია. ტბის ნაპირი ჭაობიანია.
  route: >-
    თბილისიდან წალკის მიმართულებით, შემდეგ ფარავნის ტბის გასწვრივ სამხრეთით — ფოკა მთავარ გზაზე, ტბის
    ჩრდილო-დასავლეთ კუთხეშია. სულ 170 კმ, დაახლოებით სამი საათი. გზა ძირითადად ასფალტია, თუმცა ზეგანზე
    მისი ხარისხი ცვალებადია და საშუალო სიჩქარე დაბალი რჩება; მონასტრამდე ბოლო მონაკვეთი მოხრეშილია. საწვავი
    წალკაში აიღე. კლირენსიანი ავტომობილი სასურველია, ზამთარში კი აუცილებელი.
en:
  name: Poka Nunnery of St Nino
  short: A nunnery on the shore of Lake Paravani at two thousand metres, known for its enamel and cheese
    workshops.
  body: >-
    **Poka sits on the north-western shore of Lake Paravani, at exactly 2,073 metres.** It is one of the
    highest working monasteries in Georgia and probably the most exposed: there is not a tree anywhere
    near, only lake, grass and horizon.


    Tradition connects the place with St Nino. On her way into Kartli in the 4th century she crossed the
    Javakheti plateau and stopped at Paravani, here on the shore. The old stone church, small and low,
    is tied to that tradition; it is built of the region's volcanic stone and repeats the colour of the
    plateau.


    The nunnery was re-established in the 1990s and today is known above all for its workshops:


    - **Cloisonné enamel** — crosses and icons made in the Georgian minankari technique, sold in Tbilisi
    shops as well

    - **Cheese and dairy** — made from the milk of high-pasture herds on the plateau

    - A small shop in the monastery yard where both can be bought


    Most villages on this part of the plateau are Armenian-speaking, and the nunnery is one of very few
    Georgian Orthodox communities for many kilometres around. The lake drains south: the Paravani river
    joins the Mtkvari at Khertvisi, so the water passing in front of the monastery eventually runs beneath
    the walls of Vardzia.


    The lake deserves its own look. Paravani is the largest lake in Georgia by surface area, and its shore
    here is almost flat, so on a windless morning water and sky run into one another with nothing to mark
    the join. In winter it freezes over completely.


    And plainly: this is a summer place. From November to April there is snow, unrelenting wind and night
    temperatures approaching minus thirty. The nunnery works all year, but getting here in winter depends
    entirely on the weather.
  tip: >-
    An hour is enough. Dress rules apply: headscarf and long skirt for women, long trousers for men, with
    wraps usually by the door. The enamel workshop is not always open, so ask in the yard. At two thousand
    metres the sun is strong and there is no shade at all, so bring a hat and sunscreen; the wind blows
    almost constantly and a windproof jacket earns its place even in summer. The toilet is basic and the
    nearest cafe is in Ninotsminda. The lake shore is boggy.
  route: >-
    From Tbilisi head towards Tsalka, then south along Lake Paravani; Poka is on the main road at the
    north-western corner of the lake. The total is 170 km, roughly three hours. The road is mostly asphalt,
    though its quality varies on the plateau and average speed stays low; the last stretch to the monastery
    is gravel. Fill up in Tsalka. A car with decent ground clearance is preferable, and in winter it is
    not optional.
ru:
  name: Женский монастырь Святой Нино в Поке
  short: Женский монастырь на берегу озера Паравани на высоте двух тысяч метров, известный мастерскими
    эмали и сыра.
  body: >-
    **Пока стоит на северо-западном берегу озера Паравани, ровно на 2073 метрах.** Это один из самых высокогорных
    действующих монастырей Грузии и, вероятно, самый открытый всем ветрам: вокруг нет ни одного дерева,
    только озеро, трава и горизонт.


    Предание связывает место со святой Нино. В IV веке, направляясь в Картли, она перешла Джавахетское
    плато и остановилась у Паравани, именно здесь, на берегу. Старая каменная церковь, маленькая и низкая,
    связана с этим преданием; она сложена из местного вулканического камня и повторяет цвет плато.


    Монастырь был возобновлён в 1990-х годах и сегодня известен прежде всего мастерскими:


    - **Перегородчатая эмаль** — кресты и иконы в грузинской технике минанкари, которые продаются и в
    тбилисских магазинах

    - **Сыр и молочные продукты** — из молока стад, пасущихся на высокогорных лугах плато

    - Небольшая лавка во дворе монастыря, где можно купить и то, и другое


    Большинство сёл в этой части плато армяноязычные, и монастырь — одна из немногих грузинских православных
    общин на много километров вокруг. Озеро стекает на юг: река Паравани впадает в Куру у Хертвиси, так
    что вода, проходящая перед монастырём, в конце концов течёт под стенами Вардзии.


    Озеро заслуживает отдельного взгляда. Паравани — самое большое по площади озеро Грузии, а берег здесь
    почти плоский, так что безветренным утром вода и небо перетекают друг в друга без заметной границы.
    Зимой озеро замерзает полностью.


    И прямо: это место летнее. С ноября по апрель здесь снег, непрекращающийся ветер и ночные температуры
    под минус тридцать. Монастырь работает круглый год, но доехать сюда зимой — целиком вопрос погоды.
  tip: >-
    Часа достаточно. Действуют правила одежды: женщинам платок и длинная юбка, мужчинам длинные брюки,
    накидки обычно лежат у входа. Мастерская эмали открыта не всегда, спросите во дворе. На двух тысячах
    метров солнце сильное, а тени нет вовсе — берите головной убор и крем; ветер дует почти постоянно,
    и ветрозащитная куртка оправдывает себя даже летом. Туалет простой, ближайшее кафе в Ниноцминде. Берег
    озера топкий.
  route: >-
    Из Тбилиси в сторону Цалки, затем на юг вдоль озера Паравани; Пока стоит прямо на трассе, в северо-западном
    углу озера. Всего 170 км, около трёх часов. Дорога в основном асфальтированная, но на плато качество
    меняется и средняя скорость остаётся низкой; последний отрезок к монастырю гравийный. Заправляйтесь
    в Цалке. Желателен автомобиль с нормальным клиренсом, а зимой он обязателен.
fa:
  name: دیر بانوان پوکا موسوم به نینوی قدیس
  short: دیر بانوان بر کرانهٔ دریاچهٔ پاراوانی در دو هزار متری، مشهور به کارگاه‌های میناکاری و پنیر.
  body: >-
    **پوکا بر کرانهٔ شمال‌غربی دریاچهٔ پاراوانی نشسته است، درست در ارتفاع ۲۰۷۳ متر.** از بلندترین صومعه‌های
    فعال گرجستان است و شاید بی‌پناه‌ترینشان: هیچ درختی در نزدیکی نیست، تنها دریاچه و علف و افق.


    روایت این جا را به نینوی قدیس پیوند می‌زند. او در سدهٔ چهارم در راه کارتلی از فلات جاواخِتی گذشت و
    کنار پاراوانی، همین‌جا بر کرانه، درنگ کرد. کلیسای سنگی کهن، کوچک و کوتاه، به همین روایت بسته است؛
    از سنگ آتشفشانی همین ناحیه ساخته شده و رنگ فلات را تکرار می‌کند.


    دیر در دههٔ ۱۹۹۰ از نو برپا شد و امروز بیش از هر چیز به کارگاه‌هایش شناخته می‌شود:


    - **مینای خانه‌بندی** — صلیب‌ها و شمایل‌هایی به شیوهٔ میناکاری گرجی که در مغازه‌های تفلیس هم فروخته
    می‌شود

    - **پنیر و لبنیات** — از شیر گله‌های چراگاه‌های بلند فلات

    - دکه‌ای کوچک در حیاط دیر که هر دو را می‌توان از آن خرید


    بیشتر روستاهای این بخش از فلات ارمنی‌زبان‌اند، و این دیر یکی از معدود جماعت‌های ارتدکس گرجی در شعاع
    کیلومترها است. آب دریاچه به جنوب می‌ریزد: رود پاراوانی نزد خرتویسی به متکواری می‌پیوندد، پس آبی که
    اینجا از برابر دیر می‌گذرد سرانجام از زیر دیوارهای واردزیا رد می‌شود.


    دریاچه هم نگاه جداگانه‌ای می‌طلبد. پاراوانی از نظر مساحت بزرگ‌ترین دریاچهٔ گرجستان است و کرانه‌اش
    اینجا تقریباً هموار، پس در صبحی بی‌باد آب و آسمان بی‌هیچ مرزی در هم می‌روند. زمستان یکسره یخ می‌بندد.


    و صریح بگوییم: اینجا جای تابستان است. از نوامبر تا آوریل برف هست و بادی که نمی‌ایستد و دمای شبانه
    نزدیک منفی سی. دیر تمام سال کار می‌کند، اما رسیدن به آن در زمستان یکسره به هوا بسته است.
  tip: >-
    یک ساعت کافی است. قواعد پوشش برقرار است: روسری و دامن بلند برای زنان و شلوار بلند برای مردان، و پوشش‌ها
    معمولاً کنار در. کارگاه مینا همیشه باز نیست، در حیاط بپرسید. در دو هزار متری آفتاب تند است و هیچ سایه‌ای
    نیست، پس کلاه و کرم ضدآفتاب ببرید؛ باد تقریباً همیشه می‌وزد و کاپشن بادگیر حتی در تابستان جای خود
    را دارد. سرویس بهداشتی ساده است و نزدیک‌ترین کافه در نینوتسمینداست. کرانهٔ دریاچه باتلاقی است.
  route: >-
    از تفلیس به سوی تسالکا بروید و سپس جنوب در امتداد دریاچهٔ پاراوانی؛ پوکا بر جادهٔ اصلی و در گوشهٔ
    شمال‌غربی دریاچه است. مجموع ۱۷۰ کیلومتر و حدود سه ساعت. جاده بیشتر آسفالت است، هرچند کیفیتش روی فلات
    تغییر می‌کند و سرعت متوسط پایین می‌ماند؛ بخش پایانی تا دیر شنی است. در تسالکا سوخت بگیرید. خودرویی
    با ارتفاع کف مناسب بهتر است و در زمستان اختیاری نیست.
he:
  name: מנזר הנזירות פוקה על שם נינו הקדושה
  short: מנזר נזירות על גדת אגם פרוואני בגובה אלפיים מטר, הידוע בסדנאות האמייל והגבינה שלו.
  body: >-
    **פוקה יושבת על החוף הצפון-מערבי של אגם פרוואני, בגובה 2,073 מטר בדיוק.** זהו אחד המנזרים הפעילים
    הגבוהים בגאורגיה וכנראה החשוף מכולם: אין עץ אחד בסביבה, רק אגם, עשב ואופק.


    המסורת קושרת את המקום לנינו הקדושה. במאה ה-4, בדרכה אל קרתלי, חצתה את רמת ג'וואחתי ועצרה בפרוואני,
    כאן על החוף. כנסיית האבן הישנה, קטנה ונמוכה, קשורה למסורת הזאת; היא בנויה מאבן געשית מקומית וחוזרת
    על צבע הרמה.


    המנזר הוקם מחדש בשנות התשעים והוא נודע היום בעיקר בזכות סדנאותיו:


    - **אמייל תאים** — צלבים ואיקונות בטכניקת המינאנקארי הגאורגית, הנמכרים גם בחנויות בטביליסי

    - **גבינה ומוצרי חלב** — מחלב העדרים הרועים במרעה הגבוה של הרמה

    - חנות קטנה בחצר המנזר שבה אפשר לקנות את שניהם


    רוב הכפרים בחלק הזה של הרמה דוברי ארמנית, והמנזר הוא אחת הקהילות הגאורגיות האורתודוקסיות הבודדות בטווח
    של קילומטרים רבים. האגם מתנקז דרומה: נהר פרוואני מתחבר למטקוורי ליד חרתוויסי, כך שהמים החולפים מול
    המנזר זורמים בסופו של דבר מתחת לחומות ורדזיה.


    גם האגם ראוי למבט נפרד. פרוואני הוא האגם הגדול בגאורגיה מבחינת שטח, והחוף כאן כמעט שטוח, כך שבבוקר
    נטול רוח המים והשמיים נשפכים זה לתוך זה בלי קו מפריד. בחורף הוא קופא כולו.


    ובגלוי: זהו מקום של קיץ. מנובמבר עד אפריל יש כאן שלג, רוח שאינה פוסקת וטמפרטורות לילה המתקרבות למינוס
    שלושים. המנזר פועל כל השנה, אך ההגעה לכאן בחורף תלויה כולה במזג האוויר.
  tip: >-
    שעה מספיקה. חלים כללי לבוש: מטפחת וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים, וכיסויים מונחים בדרך
    כלל ליד הדלת. סדנת האמייל אינה פתוחה תמיד, אז שאלו בחצר. בגובה אלפיים מטר השמש חזקה ואין צל כלל, אז
    קחו כובע וקרם הגנה; הרוח נושבת כמעט תמיד, ומעיל אוטם רוח מצדיק את מקומו גם בקיץ. השירותים בסיסיים
    ובית הקפה הקרוב נמצא בנינוצמינדה. גדת האגם בוצית.
  route: >-
    מטביליסי לכיוון צלקה, ואז דרומה לאורך אגם פרוואני; פוקה יושבת על הכביש הראשי בפינה הצפון-מערבית של
    האגם. בסך הכול 170 ק״מ, כשלוש שעות. הכביש סלול ברובו, אך איכותו משתנה על הרמה והמהירות הממוצעת נשארת
    נמוכה; הקטע האחרון אל המנזר הוא חצץ. תדלקו בצלקה. עדיף רכב עם מרווח גחון סביר, ובחורף זו אינה בחירה.
ar:
  name: دير الراهبات في بوكا على اسم القديسة نينو
  short: دير للراهبات على ضفة بحيرة بارافاني عند ألفي متر، يُعرف بورشتي المينا والجبن فيه.
  body: >-
    **تجلس بوكا على الضفة الشمالية الغربية لبحيرة بارافاني، على ارتفاع 2073 متراً بالضبط.** وهو من أعلى
    الأديرة العامرة في جورجيا وربما أشدها انكشافاً: لا شجرة في الجوار، بل بحيرة وعشب وأفق.


    وتربط الرواية المكان بالقديسة نينو. ففي القرن الرابع، وهي في طريقها إلى كارتلي، عبرت هضبة جاواخيتي
    ووقفت عند بارافاني، هنا على الضفة. والكنيسة الحجرية القديمة، الصغيرة المنخفضة، مرتبطة بهذه الرواية؛
    وهي مبنية من حجر المنطقة البركاني وتعيد لون الهضبة.


    أُعيد إحياء الدير في التسعينيات، وهو اليوم معروف قبل كل شيء بورشه:


    - **المينا المقسّمة** — صلبان وأيقونات بتقنية المينانكاري الجورجية، وتُباع في متاجر تبليسي أيضاً

    - **الجبن ومنتجات الألبان** — من حليب القطعان الراعية في مراعي الهضبة العالية

    - متجر صغير في فناء الدير يمكن شراء الاثنين منه


    ومعظم قرى هذا الجزء من الهضبة ناطقة بالأرمنية، والدير من الجماعات الأرثوذكسية الجورجية القليلة جداً
    على مدى كيلومترات. وتصرف البحيرة ماءها جنوباً: فنهر بارافاني يلتقي متكفاري عند خيرتفيسي، أي أن الماء
    المار أمام الدير ينتهي جارياً تحت أسوار فاردزيا.


    وتستحق البحيرة نظرة مستقلة. بارافاني أكبر بحيرات جورجيا مساحةً، وضفتها هنا تكاد تكون مستوية، فتنساب
    المياه والسماء في صباح بلا ريح إحداهما في الأخرى دون خط فاصل. وفي الشتاء تتجمد كلها.


    وبصراحة: هذا مكان صيفي. فمن نوفمبر إلى أبريل ثلج وريح لا تهدأ وحرارة ليلية تقترب من ثلاثين تحت الصفر.
    والدير يعمل طوال السنة، لكن الوصول إليه شتاءً رهن الطقس بالكامل.
  tip: >-
    ساعة تكفي. وتُطبق قواعد اللباس: غطاء رأس وتنورة طويلة للنساء وبنطال طويل للرجال، والأغطية عادة عند
    الباب. وورشة المينا ليست مفتوحة دائماً، فاسأل في الفناء. وعلى ألفي متر تشتد الشمس ولا ظل مطلقاً، فاحمل
    قبعة وواقياً شمسياً؛ والريح تهب على الدوام تقريباً، وسترة صادّة للريح تستحق مكانها حتى صيفاً. دورة
    المياه بسيطة وأقرب مقهى في نينوتسميندا. وضفة البحيرة موحلة.
  route: >-
    من تبليسي اتجه نحو تسالكا ثم جنوباً بمحاذاة بحيرة بارافاني؛ وتقع بوكا على الطريق الرئيسي عند الركن
    الشمالي الغربي للبحيرة. المجموع 170 كم ونحو ثلاث ساعات. الطريق معبّد في معظمه، وإن تفاوتت جودته فوق
    الهضبة وبقيت السرعة المتوسطة منخفضة؛ والمقطع الأخير إلى الدير حصوي. تزوّد بالوقود في تسالكا. ويفضل
    مركبة بارتفاع هيكل معقول، وفي الشتاء ليست خياراً.
