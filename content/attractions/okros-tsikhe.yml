ka:
  name: ოქროს ციხე
  short: >-
    ჯაყელების „ოქროს ციხე“: კლდეში ჩაზრდილი ათმეტრიანი კედლები ქვაბლიანის ხეობის თავზე, სადაც 1578 წლის
    ომში მთავრის ქალი გამაგრდა.
  body: >-
    **ოქროს ციხე — ასე ერქვა ჯაყელების ამ სიმაგრეს, და როცა ოსმალებმა ბოლოს და ბოლოს აიღეს, სახელი არ
    შეუცვლიათ: ალთუნყალა თურქულად იგივეს ნიშნავს.**


    XIII საუკუნის ბოლოს ან XIV საუკუნის დასაწყისში აგებული ციხე სამცხის მთავრების, ჯაყელების, ერთ-ერთი
    მთავარი სიმაგრე იყო. მშენებლებმა სოფელ შოყის ჩრდილოეთით, ქვაბლიანის ხეობაზე გაბატონებული კლდე შეარჩიეს
    და მტერს შანსი არ დაუტოვეს: უხეშად გათლილი უზარმაზარი ლოდებით ნაგები კედლები ათ მეტრამდე აღწევს, ციტადელი
    კლდოვან ქედს აგვირგვინებს, დიდი კოშკებით გამაგრებული გალავანი კი ციცაბოდ ეშვება როგორც ჩრდილოეთ, ისე
    სამხრეთ ფერდობზე. ოქროს ციხე საქართველოს უდიდეს შუა საუკუნეების სიმაგრეთა შორის მოიხსენიება.


    მის იარუსებს რომ შემოუვლით, შეამჩნევთ, რა ძნელია იმის გარჩევა, სად გაჩერდნენ ხუროები და სად იწყება
    მთა. გეგმა კლდის ყოველ მოსახვევს მიჰყვება, ნაშენი კედელი და კლდე კი ერთ მთლიან ზღუდედ ერწყმის ერთმანეთს.


    1578 წელს, ლალა მუსტაფა-ფაშას კავკასიური ლაშქრობისას, ციხე სამცხის თავდაცვის ბურჯად იქცა. სწორედ აქ
    გამაგრდა მთავრის ქალი დედისიმედი, სანამ ოსმალთა სარდალთან ზავზე მოლაპარაკებას დაიწყებდა. როცა ოსმალებმა
    მხარე საბოლოოდ დაიპყრეს, ალთუნყალა ამავე სახელწოდების ოლქის — ლივის — ცენტრი გახდა და XVIII საუკუნის
    ბოლომდე მოქმედ სიმაგრედ დარჩა.


    დღეს ეს ეროვნული მნიშვნელობის ძეგლია — ბილეთების სალაროს, მანიშნებლებისა და მოაჯირების გარეშე: მხოლოდ
    ქვა, ქარი და ადიგენისკენ გადაშლილი ხეობა.


    ოქრო მხოლოდ სახელში იყო. ჯაყელები სიმაღლეს აფასებდნენ — და ის, აღმართზე თავადაც დარწმუნდებით, სულაც
    არ გაცვეთილა.
  tip: >-
    შესვლა უფასოა; ძეგლს არც მომვლელი ჰყავს, არც მანიშნებლები აქვს. მანქანა იქ დატოვეთ, სადაც შოყის მახლობლად
    სოფლის გზა მთავრდება. კლდეზე ასასვლელი მონიშნული არ არის — ციცაბო, ქვაღორღიანი ბილიკია, მოაჯირების
    გარეშე, და ზოგან ხელის მოშველიებაც მოგიწევთ. ჩაიცვით ძირმოუცურებელი ფეხსაცმელი და წვიმაში, ნისლში
    ან თოვლში უკან დაბრუნდით — სველი კლდე აქ მოღალატეა. ასვლასა და გალავნის შემოვლას სულ მცირე ორი საათი
    დაუთმეთ. წყალი და საჭმელი თან იქონიეთ: სოფელში სტუმრისთვის არაფერია. ბავშვებს კედლებზე ხელიდან ნუ
    გაუშვებთ. იმავე დღეს ადვილად შეუთავსებთ ზარზმის მონასტერს (გზით დაახლოებით 25 კმ) ან აბასთუმნის ობსერვატორიას
    (დაახლოებით 30 კმ).
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ხაშურის გასაყრელამდე (დაახლოებით 120 კმ), შემდეგ ს8 გზით ბორჯომის
    გავლით ახალციხემდე იარეთ. ახალციხიდან შ1 გზას დასავლეთისკენ, ადიგენისა და გოდერძის უღელტეხილის მიმართულებით,
    დაახლოებით 15 კილომეტრი მიჰყევით, შემდეგ ჩრდილოეთით, ქვემო ენთელისკენ გადაუხვიეთ; ვიწრო სოფლის გზა
    კიდევ დაახლოებით 5 კილომეტრს ადის ციხის ძირას მდებარე შოყისკენ. სულ დაახლოებით 236 კილომეტრი და 4
    საათია. ასფალტი სოფლამდე აღწევს; ბოლო მონაკვეთი ვიწროა და ყველგან სწორი არ არის, მაგრამ ეკონომკლასის
    მანქანაც გაივლის, თუ ფრთხილად იმოძრავებთ. საწვავი ახალციხეში ჩაასხით.
en:
  name: Okros Tsikhe (Golden Fortress)
  short: >-
    The Jaqelis' 'golden fortress': ten-metre walls grown into a crag above the Kvabliani valley, where
    a princess held out in the Ottoman war of 1578.
  body: >-
    **Okros Tsikhe means 'the golden fortress' — and when the Ottomans finally took it, they kept the
    name: Altunkal'a says the same thing in Turkish.**


    Built in the late 13th or early 14th century, it was one of the principal strongholds of the Jaqeli
    dynasty, the princes of Samtskhe. Its builders chose a crag north of the village of Shoka that commands
    the Kvabliani valley, and left attackers no easy way in: walls of massive, roughly dressed blocks
    stand up to ten metres high, the citadel crowns the rocky ridge, and ramparts braced by large towers
    pour steeply down both the northern and southern slopes. It is counted among the largest medieval
    fortifications in Georgia.


    Walk its levels and you notice how hard it is to say where the builders stopped and the mountain began.
    The plan follows every twist of the rock, and masonry and cliff merge into a single wall.


    In 1578, during Lala Mustafa Pasha's campaign in the Caucasus, the fortress became a bulwark of Samtskhe.
    Princess Dedisimedi entrenched herself here before negotiating peace with the Ottoman commander. After
    the final Ottoman conquest of the province, Altunkal'a became the seat of its own district, a liva,
    and remained a working fortress until the end of the 18th century.


    Today it is a monument of national significance with no ticket office, no signposts and no railings
    — only stone, wind and the valley opening towards Adigeni.


    The gold was only ever in the name. What the Jaqelis prized was height, and that, as you will notice
    on the way up, has not worn away at all.
  tip: >-
    Free, unmanaged and unsigned. Leave the car where the lane near Shoka runs out; the way up the rock
    is an unmarked, steep path over loose stone with no railings, and in places you will need your hands.
    Wear boots with grip and turn back in rain, fog or snow, since wet rock here is treacherous. Allow
    at least two hours for the climb and a slow circuit of the ramparts. Bring water and food: the village
    has nothing for visitors. Keep children close on the walls. Zarzma Monastery (about 25 km by road)
    and Abastumani Observatory (about 30 km) make easy companions.
  route: >-
    From Tbilisi take the S1 (E60) west to the Khashuri junction, about 120 km, then the S8 through Borjomi
    to Akhaltsikhe. There pick up the Sh1 west, the road to Adigeni and the Goderdzi pass, for about 15
    km, then turn north for Kvemo Enteli; a narrow village road climbs some 5 km more towards the hamlet
    of Shoka beneath the fortress. About 236 km and 4 h in all. Asphalt reaches the village area; the
    last lane is narrow and not always smooth, but an economy car manages it with care. Refuel in Akhaltsikhe.
ru:
  name: Окрос-Цихе (Золотая крепость)
  short: >-
    «Золотая крепость» Джакели: десятиметровые стены, вросшие в скалу над долиной Кваблиани, где в войну
    с османами 1578 года держала оборону княгиня.
  body: >-
    **Окрос-Цихе значит «Золотая крепость» — и когда османы наконец её взяли, они сохранили имя: Алтункала
    по-турецки означает то же самое.**


    Построенная в конце XIII или начале XIV века, она была одной из главных твердынь династии Джакели,
    князей Самцхе. Строители выбрали скалу к северу от села Шока, господствующую над долиной Кваблиани,
    и не оставили нападающим ни шанса: стены из массивных, грубо отёсанных блоков поднимаются до десяти
    метров, цитадель венчает скалистый гребень, а укреплённые большими башнями куртины круто сбегают и
    по северному, и по южному склону. Крепость считается одним из крупнейших средневековых укреплений
    Грузии.


    Пройдите по её ярусам, и вы заметите, как трудно сказать, где кончается работа строителей и начинается
    гора. План повторяет каждый изгиб скалы, и кладка сливается с утёсом в одну стену.


    В 1578 году, во время кавказского похода Лала Мустафы-паши, крепость стала оплотом Самцхе. Княгиня
    Дедисимеди укрепилась здесь, прежде чем начать переговоры о мире с османским полководцем. После окончательного
    завоевания области османами Алтункала стала центром собственного округа — ливы — и оставалась действующей
    крепостью до конца XVIII века.


    Сегодня это памятник национального значения, где нет ни кассы, ни указателей, ни перил — только камень,
    ветер и долина, раскрывающаяся к Адигени.


    Золото всегда было лишь в названии. Джакели ценили высоту, и она, как вы заметите на подъёме, ничуть
    не стёрлась.
  tip: >-
    Вход свободный; крепость никем не охраняется и не обозначена указателями. Оставьте машину там, где
    у Шоки кончается сельская дорога; наверх по скале ведёт немаркированная крутая тропа по сыпучему камню,
    без перил, местами придётся помогать себе руками. Наденьте обувь с цепкой подошвой и поворачивайте
    назад в дождь, туман или снег: мокрая скала здесь коварна. Закладывайте не меньше двух часов на подъём
    и неспешный обход стен. Возьмите воду и еду: в селе для приезжих ничего нет. На стенах держите детей
    рядом. Монастырь Зарзма (около 25 км по дороге) и Абастуманская обсерватория (около 30 км) легко добавить
    к поездке.
  route: >-
    Из Тбилиси по S1 (E60) на запад до развязки у Хашури, около 120 км, затем по S8 через Боржоми до Ахалцихе.
    Там выезжайте на запад по Sh1 — дороге на Адигени и перевал Годердзи — и через 15 км сверните на север
    к Квемо-Энтели; узкая сельская дорога поднимается ещё примерно на 5 км к деревушке Шока под крепостью.
    Всего около 236 км и 4 ч. Асфальт доходит до окрестностей села; последний отрезок узкий и не везде
    ровный, но автомобиль эконом-класса при аккуратной езде справится. Заправьтесь в Ахалцихе.
fa:
  name: اوکروس تسیخه (دژ زرین)
  short: >-
    «دژ زرین» جاقلی‌ها: دیوارهایی ده‌متری که در صخره‌ای بالای درهٔ کوابلیانی ریشه دوانده‌اند و در جنگ
    با عثمانی در سال ۱۵۷۸ شاهدختی در پناهشان ایستادگی کرد.
  body: >-
    **اوکروس تسیخه یعنی «دژ زرین» — و عثمانی‌ها وقتی سرانجام آن را گرفتند، نامش را نگه داشتند: آلتون‌قلعه
    در ترکی همین معنا را دارد.**


    این دژ که در اواخر سدهٔ ۱۳ یا اوایل سدهٔ ۱۴ ساخته شد، یکی از استحکامات اصلی خاندان جاقلی، فرمانروایان
    سامتسخه، بود. سازندگانش صخره‌ای در شمال روستای شوکا را برگزیدند که بر درهٔ کوابلیانی مسلط است، و هیچ
    راه آسانی برای مهاجمان باقی نگذاشتند: دیوارهایی از قطعه‌سنگ‌های عظیم و زمخت‌تراش تا ده متر بالا می‌روند،
    ارگ بر تاج یال صخره‌ای نشسته است، و باروهایی که برج‌های بزرگ پشتیبانشان‌اند با شیبی تند از هر دو دامنهٔ
    شمالی و جنوبی فرومی‌ریزند. این دژ از بزرگ‌ترین استحکامات قرون وسطایی گرجستان به شمار می‌رود.


    در طبقه‌های آن قدم بزنید تا ببینید چه دشوار است گفتن اینکه کار سازندگان کجا تمام شد و کوه از کجا آغاز
    شد. نقشهٔ دژ هر پیچ‌وتاب صخره را دنبال می‌کند و سنگ‌چین و پرتگاه در یک دیوار یکی می‌شوند.


    در سال ۱۵۷۸، در لشکرکشی لله مصطفی پاشا به قفقاز، این دژ سنگر سامتسخه شد. شاهدخت دِدیسیمدی پیش از آنکه
    با فرماندهٔ عثمانی به مذاکرهٔ صلح بنشیند، در اینجا سنگر گرفت. پس از فتح نهایی این ولایت به دست عثمانی‌ها،
    آلتون‌قلعه مرکز ناحیه‌ای مستقل، یک «لِوا»، شد و تا پایان سدهٔ ۱۸ دژی فعال باقی ماند.


    امروز این دژ اثری با اهمیت ملی است، بی‌باجهٔ بلیت، بی‌تابلوی راهنما و بی‌نرده — فقط سنگ است و باد
    و دره‌ای که به سوی آدیگنی گشوده می‌شود.


    طلا همیشه تنها در نامش بود. آنچه جاقلی‌ها ارج می‌نهادند بلندی بود، و آن، چنان‌که در راه بالا خواهید
    دید، ذره‌ای فرسوده نشده است.
  tip: >-
    رایگان، بی‌نگهبان و بی‌تابلو. خودرو را جایی بگذارید که کوچه‌راه نزدیک شوکا تمام می‌شود؛ راه بالا رفتن
    از صخره کوره‌راهی بی‌نشان و پرشیب روی سنگ‌های لق است، بی‌نرده، و جاهایی باید از دست‌هایتان هم کمک
    بگیرید. کفشی با کف چسبنده بپوشید و در باران، مه یا برف برگردید، چون صخرهٔ خیس اینجا خطرناک است. دست‌کم
    دو ساعت برای صعود و گشتی آرام بر باروها در نظر بگیرید. آب و غذا همراه بیاورید: روستا چیزی برای بازدیدکنندگان
    ندارد. روی دیوارها کودکان را نزدیک خود نگه دارید. صومعهٔ زارزما (حدود ۲۵ کیلومتر با خودرو) و رصدخانهٔ
    آباستومانی (حدود ۳۰ کیلومتر) همراهان خوبی برای این سفرند.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب تا تقاطع خاشوری، حدود ۱۲۰ کیلومتر، بروید، سپس با S8 از بورجومی
    تا آخالتسیخه برانید. آنجا جادهٔ Sh1 را به سمت غرب، راه آدیگنی و گردنهٔ گودِردزی، حدود ۱۵ کیلومتر بروید
    و سپس به شمال، به سوی کومو انتلی، بپیچید؛ جاده‌ای باریک و روستایی حدود ۵ کیلومتر دیگر تا آبادی کوچک
    شوکا در پای دژ بالا می‌رود. روی‌هم حدود ۲۳۶ کیلومتر و ۴ ساعت. آسفالت تا نزدیکی روستا می‌رسد؛ کوچه‌راه
    پایانی باریک است و همه‌جا هموار نیست، اما خودروی اقتصادی با احتیاط از پسش برمی‌آید. در آخالتسیخه سوخت‌گیری
    کنید.
he:
  name: אוקרוס ציחה (מבצר הזהב)
  short: >-
    'מבצר הזהב' של בית ג'קלי: חומות בגובה עשרה מטרים הצומחות מתוך צוק מעל עמק קוובליאני, שבו החזיקה מעמד
    נסיכה במלחמה עם העות'מאנים ב-1578.
  body: >-
    **אוקרוס ציחה פירושו 'מבצר הזהב' — וכשהעות'מאנים כבשו אותו לבסוף, הם שמרו על השם: אלטונקלעה אומר בטורקית
    בדיוק אותו דבר.**


    המבצר, שנבנה בסוף המאה ה-13 או בראשית המאה ה-14, היה אחד המעוזים העיקריים של שושלת ג'קלי, נסיכי סמצחה.
    בוניו בחרו בצוק מצפון לכפר שוקה, השולט על עמק קוובליאני, ולא הותירו לתוקפים שום סיכוי: חומות מגושים
    מסיביים, מסותתים בגסות, מתנשאות לגובה של עד עשרה מטרים, המצודה הפנימית מכתירה את רכס הסלע, וסוללות
    המחוזקות במגדלים גדולים גולשות בתלילות במורד המדרון הצפוני והדרומי כאחד. הוא נמנה עם הביצורים הגדולים
    ביותר מימי הביניים בגאורגיה.


    כשמטיילים בין מפלסיו מבחינים כמה קשה לומר היכן הפסיקו הבונים והיכן מתחיל ההר. התוכנית עוקבת אחר כל
    פיתול של הסלע, והבנייה והמצוק מתמזגים לחומה אחת.


    ב-1578, במסע המלחמה של לאלא מוסטפא פאשה בקווקז, הפך המבצר למעוז של סמצחה. הנסיכה דדיסימדי התבצרה כאן
    בטרם ניהלה משא ומתן לשלום עם המצביא העות'מאני. לאחר הכיבוש העות'מאני הסופי של המחוז הפכה אלטונקלעה
    למרכז של נפה משלה, 'ליווא', ונותרה מבצר פעיל עד סוף המאה ה-18.


    היום זהו אתר מורשת בעל חשיבות לאומית, בלי קופה, בלי שילוט ובלי מעקות — רק אבן, רוח, והעמק הנפתח לעבר
    אדיגני.


    הזהב היה תמיד רק בשם. מה שבית ג'קלי העריך היה הגובה, וזה, כפי שתיווכחו בדרך למעלה, לא נשחק כלל.
  tip: >-
    הכניסה חופשית; אין במקום הנהלה ואין שילוט. השאירו את הרכב במקום שבו נגמרת הדרך הצרה ליד שוקה; העלייה
    אל הסלע היא בשביל לא מסומן ותלול, על אבנים רופפות וללא מעקות, ובקטעים תצטרכו להיעזר בידיים. נעלו נעליים
    עם אחיזה טובה וחזרו על עקבותיכם בגשם, בערפל או בשלג, כי הסלע הרטוב כאן בוגדני. הקצו לפחות שעתיים לטיפוס
    ולסיבוב איטי על החומות. הביאו מים ואוכל: בכפר אין דבר למבקרים. על החומות החזיקו את הילדים קרוב. מנזר
    זרזמה (כ-25 ק"מ בכביש) ומצפה הכוכבים של אבסטומני (כ-30 ק"מ) משתלבים בקלות באותו יום.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד צומת חשורי, כ-120 ק"מ, ומשם בכביש S8 דרך בורג'ומי עד אחלציחה.
    שם עלו על כביש Sh1 מערבה — הדרך לאדיגני ולמעבר גודרדזי — וכעבור כ-15 ק"מ פנו צפונה לקוומו אנטלי; כביש
    כפרי צר מטפס עוד כ-5 ק"מ אל הכפרון שוקה שלמרגלות המבצר. בסך הכול כ-236 ק"מ ו-4 שעות. האספלט מגיע עד
    סביבות הכפר; הדרך האחרונה צרה ולא תמיד חלקה, אבל רכב אקונומי יעבור אותה בזהירות. תדלקו באחלציחה.
ar:
  name: أوكروس تسيخه (القلعة الذهبية)
  short: >-
    «القلعة الذهبية» لآل جاقلي: أسوار بارتفاع عشرة أمتار نبتت في صخرة فوق وادي كفابلياني، حيث صمدت أميرة
    في الحرب العثمانية عام 1578.
  body: >-
    **أوكروس تسيخه تعني «القلعة الذهبية» — وحين استولى عليها العثمانيون أخيرًا احتفظوا بالاسم: فـ«ألتون
    قلعة» تقول الشيء نفسه بالتركية.**


    بُنيت في أواخر القرن الثالث عشر أو مطلع القرن الرابع عشر، وكانت من أهم معاقل سلالة جاقلي، أمراء سامتسخه.
    اختار من شيّدوها صخرةً إلى الشمال من قرية شوكا تشرف على وادي كفابلياني، ولم يتركوا للمهاجمين أي فرصة:
    أسوار من كتل ضخمة خشنة النحت يصل ارتفاعها إلى عشرة أمتار، وقلعة داخلية تتوّج الحافة الصخرية، وأسوار
    تدعمها أبراج كبيرة تنحدر بشدّة على المنحدرين الشمالي والجنوبي كليهما. وتُعدّ من أكبر تحصينات العصور
    الوسطى في جورجيا.


    تجوّل بين مستوياتها وستلاحظ كم يصعب القول أين توقّف البنّاؤون وأين بدأ الجبل. فالمخطّط يتبع كل التواءة
    في الصخر، ويندمج البناء والجرف في جدار واحد.


    وفي عام 1578، خلال حملة لالا مصطفى باشا على القوقاز، صارت القلعة حصنًا منيعًا لسامتسخه. فقد تحصّنت
    فيها الأميرة ديديسيميدي قبل أن تفاوض القائد العثماني على الصلح. وبعد الفتح العثماني النهائي للإقليم
    صارت ألتون قلعة مركزًا للواء خاص بها، وبقيت قلعة عاملة حتى أواخر القرن الثامن عشر.


    وهي اليوم معلم ذو أهمية وطنية بلا شبّاك تذاكر ولا لافتات ولا درابزين — لا شيء سوى الحجر والريح والوادي
    المنفتح نحو أديغيني.


    لم يكن الذهب يومًا إلا في الاسم. أما ما ثمّنه آل جاقلي فهو العلوّ، وهذا، كما ستلاحظ في طريق الصعود،
    لم يَبْلَ قط.
  tip: >-
    الدخول مجاني، ولا إدارة للموقع ولا لافتات. اترك السيارة حيث ينتهي الدرب قرب شوكا؛ فالصعود إلى الصخرة
    يكون عبر ممرّ شديد الانحدار غير معلَّم فوق حجارة مفكّكة بلا درابزين، وستحتاج في بعض المواضع إلى الاستعانة
    بيديك. انتعل حذاءً ذا نعل متماسك، وارجع إن هطل المطر أو حلّ الضباب أو الثلج، فالصخر المبلّل هنا غادر.
    خصّص ساعتين على الأقل للصعود وجولة متمهّلة على الأسوار. احمل الماء والطعام: فالقرية لا تقدّم شيئًا
    للزوار. أبقِ الأطفال قريبين منك على الأسوار. ويسهل الجمع بين الزيارة ودير زارزما (نحو 25 كم بالطريق)
    ومرصد أباستوماني (نحو 30 كم).
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا حتى تقاطع خاشوري، نحو 120 كم، ثم الطريق S8 عبر بورجومي حتى أخالتسيخه.
    هناك اتجه غربًا على الطريق Sh1، طريق أديغيني وممر غوديرزي، نحو 15 كم، ثم انعطف شمالًا نحو كفيمو إنتيلي؛
    ويصعد طريق قروي ضيق نحو 5 كم أخرى إلى قرية شوكا الصغيرة أسفل القلعة. نحو 236 كم و4 ساعات إجمالًا.
    يصل الأسفلت إلى محيط القرية؛ أما الدرب الأخير فضيق وليس ممهّدًا دائمًا، لكن السيارة الاقتصادية تجتازه
    بحذر. تزوّد بالوقود في أخالتسيخه.
