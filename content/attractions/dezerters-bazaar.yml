ka:
  name: დეზერტირების ბაზარი
  short: |-
    სადგურის მახლობლად მდებარე საქართველოს მთავარი სასურსათო ბაზარი, სადაც ქვეყნის ყველა კუთხის პროდუქტი იყიდება.
  body: |-
    **ეს ის ადგილია, სადაც თბილისი სინამდვილეში ყიდულობს საჭმელს.** დეზერტირების ბაზარი ცენტრალური რკინიგზის სადგურის გვერდითაა და სახელი 1920-იანი წლებიდან შემორჩა, როცა ფრონტიდან დაბრუნებული ჯარისკაცები აქ ყიდდნენ იარაღს, შინელებს და ჩექმებს, რომ თბილისამდე მისულიყვნენ.

    დღეს ის უპირველესად სასურსათო ბაზარია და მთელი ქვეყანა აქ ერთდება. რიგებზე გავლისას ნახავ:

    - ყველის რიგს — სულგუნი, იმერული, გუდის ყველი, დამბალხაჭო

    - სანელებლების მაგიდებს: ხმელი სუნელი, უცხო სუნელი, ქინძი, იმერული ზაფრანა

    - ჩურჩხელას, ტყლაპს, ნიგოზს, ჩირს, თაფლს

    - მწვანილს, ტარხუნას, თურშს, ტყემალს, აჯიკას

    - ხორცის და ფრინველის რიგებს, სადაც ცოცხალი ქათამიც იყიდება

    ფასები კილოზეა და ჩვეულებრივ ქალაქის მაღაზიაზე მკვეთრად დაბალი. გემოს დაგაწებინებენ — ეს ნორმალურია და ყველის რიგზე უარის თქმა თითქმის უზრდელობაა. ვაჭრობა შესაძლებელია, თუმცა კამათი აქ ისეთი აგრესიული არ არის, როგორც ძველმანების ბაზრობაზე.

    ეს არ არის მოწესრიგებული ტურისტული ბაზარი. იატაკი სველია, სუნი ძლიერი, გასასვლელები ვიწრო და ხმაურიანი. სწორედ ამიტომ ღირს: აქ ერთ საათში მეტს გაიგებ ქართულ სამზარეულოზე, ვიდრე ხუთ რესტორანში.

    ბაზარი სეზონს მკაფიოდ მიჰყვება და სწორედ ამიტომ ღირს მასზე ორჯერ მისვლა. გაზაფხულზე მწვანილი, ჭინჭარი და ჯონჯოლი ჭარბობს; ივლის-აგვისტოში პომიდორი, ატამი და ბადრიჯანი; სექტემბერ-ოქტომბერში ყურძენი, ნიგოზი და ჩურჩხელის მოხარშვის სეზონი; ზამთარში კი აჭარული მანდარინი და ხახვის დახლები. დახურული დარბაზების გარეთ, ტროტუარზე, სოფლიდან ჩამოსული ხალხი ყიდის იმას, რაც თავად მოიყვანა — ხშირად სამი-ოთხი პროდუქტი, ერთ ცელოფანზე გაშლილი.
  tip: |-
    ერთი საათი საკმარისია. ყველაზე კარგი დროა დილის 9-დან 12-მდე, როცა პროდუქტი ახალია და ხალხი ჯერ არ არის ბევრი. ნაღდი ფული აუცილებელია, წვრილი კუპიურებით — ტერმინალი მხოლოდ ცალკეულ დახლზეა. ჩანთა წინ დაიჭირე და ჯიბეს თვალი ადევნე. ფეხსაცმელი ისეთი ჩაიცვი, რომელსაც სველი იატაკი არ დაუშავდება. ყველის და ხორცის თვითმფრინავით გატანა შეზღუდულია — სანელებლები, ჩურჩხელა და ჩირი უპრობლემოდ მიდის.
  route: |-
    ბაზარი სადგურის მოედანთანაა, ცენტრიდან 5 კმ და 15 წუთი, აღმაშენებლის გამზირით ან წერეთლის გამზირით. მანქანით მისვლა შესაძლებელია, მაგრამ ეს ქალაქის ერთ-ერთი ყველაზე დატვირთული კვანძია: მარშრუტკები, ტაქსები და დატვირთვა-გადმოტვირთვა ერთ სივრცეში ხდება. ბაზრის ქვეშ და სავაჭრო ცენტრ „თბილისი ცენტრალის" შენობაში ანაზღაურებადი პარკინგია — ესაა ერთადერთი გონივრული ვარიანტი. ქუჩაში დგომა ნიშნავს, რომ სატვირთოს გზას გადაუღობავ. ალტერნატივა: მეტრო „სადგურის მოედანი", პირდაპირ ბაზართან. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Dezerter Bazaar
  short: |-
    Georgia's main food market beside the railway station, where produce from every region ends up.
  body: |-
    **This is where Tbilisi actually buys its food.** Dezerter Bazaar sits next to the central railway station, and the name has stuck since the 1920s, when soldiers coming back from the front sold weapons, greatcoats and boots here to pay their way home.

    Today it is first and foremost a food market, and the whole country converges on it. Walking the rows you pass:

    - the cheese line — sulguni, imeruli, guda cheese from the mountains, and the fermented dambalkhacho

    - spice tables: khmeli suneli, blue fenugreek, coriander seed, marigold known here as Imeretian saffron

    - churchkhela, fruit leather, walnuts, dried fruit and honey

    - herbs by the armful, tarragon, pickles, tkemali plum sauce and ajika

    - meat and poultry rows, where live chickens are also sold

    Prices are by the kilo and well below city shops. You will be handed things to taste; that is normal, and refusing along the cheese row is close to rude. Bargaining is possible, though the haggling here is far less aggressive than at the flea market.

    This is not a tidied-up market built for visitors. The floors are wet, the smells are strong, the aisles are narrow and everyone is shouting. That is exactly why it is worth an hour: you will learn more about Georgian cooking here than in five restaurants.

    The market follows the season closely, which is a good reason to come twice. Spring is herbs, nettles and pickled jonjoli buds; July and August are tomatoes, peaches and aubergines; September and October bring grapes, walnuts and the churchkhela-boiling season; winter is tangerines from Adjara and long rows of onions. Outside the covered halls, on the pavement, villagers sell only what they grew themselves — often three or four items laid out on a sheet of plastic, and usually the best produce in the market.
  tip: |-
    An hour is enough. Come between nine and noon, when the produce is fresh and the crowd is still thin. Bring cash in small notes; only some stalls take cards. Keep your bag in front of you and watch your pockets. Wear shoes you do not mind getting wet. Note that carrying cheese and meat out by air is restricted, while spices, churchkhela and dried fruit travel without trouble.
  route: |-
    The market is at Station Square, 5 km and about fifteen minutes from the centre by Agmashenebeli or Tsereteli avenue. You can drive, but this is one of the busiest junctions in the city, with minibuses, taxis and delivery vans sharing the same space. There is paid parking under the market and in the Tbilisi Central complex, and that is the only sensible option. Parking on the street here means blocking a delivery lorry. The alternative is the metro: Station Square station opens directly at the bazaar. An economy car is enough.
ru:
  name: Дезертирский базар
  short: |-
    Главный продуктовый рынок Грузии у вокзала, куда стекаются продукты из всех регионов страны.
  body: |-
    **Здесь Тбилиси на самом деле покупает еду.** Дезертирский базар стоит рядом с центральным вокзалом, а название держится с 1920-х, когда возвращавшиеся с фронта солдаты продавали тут оружие, шинели и сапоги, чтобы добраться до дома.

    Сегодня это прежде всего продуктовый рынок, и сюда съезжается вся страна. Проходя по рядам, вы увидите:

    - сырный ряд — сулугуни, имерули, горный гуда, ферментированный дамбалхачо

    - столы со специями: хмели-сунели, голубой пажитник, кориандр, бархатцы, которые здесь зовут имеретинским шафраном

    - чурчхелу, фруктовую пастилу, орехи, сухофрукты и мёд

    - зелень охапками, тархун, соленья, ткемали и аджику

    - мясные и птичьи ряды, где продают и живых кур

    Цены на килограммы и заметно ниже городских магазинов. Вам будут давать пробовать: это норма, а отказ в сырном ряду почти невежлив. Торговаться можно, но здесь это гораздо спокойнее, чем на барахолке.

    Это не прилизанный рынок для туристов. Полы мокрые, запахи сильные, проходы узкие, все кричат. Именно поэтому он стоит часа: о грузинской кухне здесь узнаёшь больше, чем в пяти ресторанах.

    Рынок точно следует сезону, и это хороший повод прийти дважды. Весна — зелень, крапива и маринованный джонджоли; июль и август — помидоры, персики и баклажаны; сентябрь и октябрь приносят виноград, орехи и время варки чурчхелы; зима — аджарские мандарины и длинные ряды лука. Снаружи, у крытых павильонов, прямо на тротуаре, приехавшие из сёл продают только то, что вырастили сами: часто три-четыре наименования на куске плёнки, и обычно это лучший товар на рынке.
  tip: |-
    Часа достаточно. Приходите с девяти до полудня, когда продукты свежие, а толпы ещё нет. Наличные мелкими купюрами обязательны, карты принимают лишь отдельные прилавки. Держите сумку перед собой и следите за карманами. Обувь наденьте такую, которую не жалко намочить. Учтите: вывоз сыра и мяса самолётом ограничен, а специи, чурчхела и сухофрукты едут без проблем.
  route: |-
    Рынок у Привокзальной площади, 5 км и около пятнадцати минут от центра по проспекту Агмашенебели или Церетели. Доехать можно, но это один из самых загруженных узлов города: маршрутки, такси и разгрузка идут в одном пространстве. Платная парковка есть под рынком и в комплексе «Тбилиси Централь» — это единственный разумный вариант. Оставить машину на улице значит перегородить дорогу фуре. Альтернатива — метро: станция «Вокзальная площадь» выходит прямо к базару. Достаточно машины эконом-класса.
fa:
  name: بازار دِزرتیر
  short: |-
    بازار اصلی مواد غذایی گرجستان کنار ایستگاه راه‌آهن، که محصول همهٔ استان‌ها به آن می‌رسد.
  body: |-
    **اینجا جایی است که تفلیس واقعاً خوراکش را می‌خرد.** بازار دزرتیر کنار ایستگاه مرکزی راه‌آهن است و نامش از دههٔ ۱۹۲۰ مانده، وقتی سربازان بازگشته از جبهه اسلحه و شنل و چکمه را همین‌جا می‌فروختند تا خرج راه خانه را درآورند.

    امروز پیش از هر چیز بازار خوراک است و همهٔ کشور در آن گرد می‌آید. در گذر از ردیف‌ها می‌بینید:

    - ردیف پنیر: سولوگونی، ایمرولی، پنیر گودای کوهستان و دامبال‌خاچوی تخمیری

    - میزهای ادویه: خملی سونلی، شنبلیلهٔ آبی، تخم گشنیز، و همیشه‌بهاری که اینجا زعفران ایمرتی خوانده می‌شود

    - چورچخلا، لواشک، گردو، میوهٔ خشک و عسل

    - سبزی به بغل، ترخون، ترشی، سس آلوی تکمالی و آجیکا

    - ردیف گوشت و مرغ، که مرغ زنده هم در آن فروخته می‌شود

    قیمت‌ها کیلویی و به‌روشنی کمتر از مغازه‌های شهر است. چیزهایی برای چشیدن به دستتان می‌دهند؛ این عادی است و رد کردن در ردیف پنیر نزدیک به بی‌ادبی است. چانه زدن ممکن است، هرچند اینجا بسیار ملایم‌تر از بازار سمساری است.

    این بازاری مرتب‌شده برای گردشگر نیست. کف خیس است، بوها تند، راهروها باریک و همه بلند حرف می‌زنند. دقیقاً به همین سبب یک ساعتش می‌ارزد: اینجا دربارهٔ آشپزی گرجی بیشتر می‌آموزید تا در پنج رستوران.

    بازار دقیقاً از فصل پیروی می‌کند و همین دلیل خوبی است برای آنکه دو بار به آن سر بزنید. بهار فصل سبزی و گزنه و جوانه‌های ترشی‌شدهٔ جونجولی است؛ تیر و مرداد گوجه و هلو و بادمجان؛ شهریور و مهر انگور و گردو و موسم پختن چورچخلا؛ و زمستان نارنگی آجارا و ردیف‌های بلند پیاز. بیرون از سالن‌های سرپوشیده، روی پیاده‌رو، روستاییان تنها آنچه را خود کاشته‌اند می‌فروشند؛ اغلب سه چهار قلم روی یک تکه نایلون، و معمولاً بهترین محصول بازار.
  tip: |-
    یک ساعت کافی است. میان ساعت نه تا ظهر بیایید که محصول تازه است و جمعیت هنوز کم. پول نقد با اسکناس خرد لازم است و تنها بعضی غرفه‌ها کارت می‌پذیرند. کیف را جلوی خود نگه دارید و مراقب جیب باشید. کفشی بپوشید که خیس شدنش برایتان مهم نباشد. توجه کنید که بردن پنیر و گوشت با هواپیما محدودیت دارد، اما ادویه و چورچخلا و میوهٔ خشک بی‌دردسر می‌روند.
  route: |-
    بازار در میدان ایستگاه است، ۵ کیلومتر و حدود پانزده دقیقه از مرکز شهر از خیابان آغماشنبلی یا تسرتلی. رانندگی ممکن است، اما این یکی از شلوغ‌ترین گره‌های شهر است: ون‌ها و تاکسی‌ها و بارگیری همه در یک فضا. پارکینگ پولی زیر بازار و در مجتمع تفلیس سنترال هست و تنها گزینهٔ معقول همان است. پارک کردن در خیابان یعنی بستن راه کامیون بار. گزینهٔ دیگر مترو است: ایستگاه میدان راه‌آهن درست به بازار باز می‌شود. خودروی اقتصادی کافی است.
he:
  name: שוק דזרטיר
  short: |-
    שוק המזון המרכזי של גאורגיה ליד תחנת הרכבת, שאליו מגיעה תוצרת מכל אזורי הארץ.
  body: |-
    **כאן טביליסי באמת קונה את האוכל שלה.** שוק דזרטיר יושב ליד תחנת הרכבת המרכזית, והשם דבק בו מאז שנות ה-20, כשחיילים שחזרו מן החזית מכרו כאן נשק, מעילים ומגפיים כדי לממן את הדרך הביתה.

    היום זהו קודם כול שוק מזון, וכל המדינה נפגשת בו. בהליכה בין השורות תעברו על פני:

    - שורת הגבינות — סולוגוני, אימרולי, גבינת גודה מן ההרים, ודמבלחאצ'ו המותסס

    - שולחנות תבלינים: חמלי סונלי, חילבה כחולה, זרעי כוסברה, וציפורן חתול הנקראת כאן זעפרן אימרטי

    - צ'ורצ'חלה, לדרים, אגוזי מלך, פירות יבשים ודבש

    - עשבי תיבול בערמות, טרגון, חמוצים, רוטב שזיפים תקמאלי ואג'יקה

    - שורות הבשר והעופות, שבהן נמכרים גם תרנגולים חיים

    המחירים לפי קילו ונמוכים בהרבה מן החנויות בעיר. יגישו לכם דברים לטעום; זה מקובל, וסירוב בשורת הגבינות גובל בגסות. אפשר להתמקח, אך זה עדין הרבה יותר מאשר בשוק הפשפשים.

    זה אינו שוק מסודר לתיירים. הרצפות רטובות, הריחות חזקים, המעברים צרים וכולם צועקים. בדיוק משום כך הוא שווה שעה: כאן תלמדו על המטבח הגאורגי יותר מאשר בחמש מסעדות.

    השוק הולך אחרי העונה בדייקנות, וזו סיבה טובה לבוא פעמיים. האביב הוא עשבי תיבול, סרפדים וניצני ג'ונג'ולי כבושים; יולי ואוגוסט הם עגבניות, אפרסקים וחצילים; ספטמבר ואוקטובר מביאים ענבים, אגוזים ואת עונת בישול הצ'ורצ'חלה; החורף הוא מנדרינות מאג'ריה ושורות ארוכות של בצל. מחוץ לאולמות המקורים, על המדרכה, מוכרים בני הכפרים רק את מה שגידלו בעצמם — לרוב שלושה או ארבעה פריטים על יריעת ניילון, ובדרך כלל התוצרת הטובה ביותר בשוק.
  tip: |-
    שעה מספיקה. בואו בין תשע לצהריים, כשהתוצרת טרייה והקהל עדיין דליל. הביאו מזומן בשטרות קטנים; רק חלק מן הדוכנים מקבלים כרטיסים. החזיקו את התיק לפניכם ושימו לב לכיסים. נעלו נעליים שלא אכפת לכם שיירטבו. שימו לב שהוצאת גבינה ובשר בטיסה מוגבלת, ואילו תבלינים, צ'ורצ'חלה ופירות יבשים עוברים בלי בעיה.
  route: |-
    השוק בכיכר התחנה, 5 ק״מ וכחמש-עשרה דקות מן המרכז דרך שדרות אגמשנבלי או צרטלי. אפשר להגיע ברכב, אך זהו אחד הצמתים העמוסים בעיר: מיניבוסים, מוניות ופריקת סחורה חולקים אותו מרחב. יש חניון בתשלום מתחת לשוק ובמתחם טביליסי סנטרל, וזו האפשרות ההגיונית היחידה. חניה ברחוב כאן פירושה חסימת משאית. חלופה היא הרכבת התחתית: תחנת כיכר התחנה נפתחת ישירות אל השוק. רכב חסכוני מספיק.
ar:
  name: سوق ديزيرتير
  short: |-
    سوق الغذاء الرئيسي في جورجيا بجوار محطة القطار، تصل إليه محاصيل كل أقاليم البلاد.
  body: |-
    **هنا تشتري تبليسي طعامها فعلاً.** يقع سوق ديزيرتير إلى جانب محطة السكك الحديدية المركزية، وقد لصق به الاسم منذ عشرينيات القرن الماضي، حين كان الجنود العائدون من الجبهة يبيعون فيه السلاح والمعاطف والأحذية ليدفعوا ثمن طريق العودة.

    وهو اليوم قبل كل شيء سوق طعام تلتقي فيه البلاد كلها. وأنت تمشي بين الصفوف تمر بـ:

    - صف الأجبان: سولغوني وإيميرولي وجبن غودا الجبلي والدامبالخاتشو المخمّر

    - طاولات البهار: خملي سونيلي والحلبة الزرقاء وبذور الكزبرة والقطيفة التي تُسمى هنا زعفران إيميريتي

    - التشورتشخيلا وألواح الفاكهة والجوز والفواكه المجففة والعسل

    - أكوام الأعشاب والطرخون والمخللات وصلصة الخوخ تكمالي والأجيكا

    - صفوف اللحم والدواجن، حيث يُباع الدجاج الحي أيضاً

    والأسعار بالكيلو وأدنى بكثير من متاجر المدينة. وستُمدّ إليك أشياء لتتذوقها؛ وهذا معتاد، والرفض في صف الأجبان قريب من قلة الذوق. والمساومة ممكنة، وإن كانت هنا ألطف بكثير منها في سوق الأشياء المستعملة.

    وهذا ليس سوقاً مرتّباً للزوار. الأرض مبللة والروائح قوية والممرات ضيقة والجميع يرفع صوته. ولهذا بالضبط يستحق ساعة من وقتك: ستتعلم هنا عن المطبخ الجورجي أكثر مما تتعلمه في خمسة مطاعم.

    يتبع السوق الموسم بدقة، وهذا سبب وجيه لزيارته مرتين. فالربيع للأعشاب والقراص وبراعم الجونجولي المخللة؛ ويوليو وأغسطس للطماطم والخوخ والباذنجان؛ وسبتمبر وأكتوبر يأتيان بالعنب والجوز وموسم طبخ التشورتشخيلا؛ والشتاء ليوسفي أدجارا ولصفوف البصل الطويلة. وخارج القاعات المسقوفة، على الرصيف، يبيع القرويون ما زرعوه بأنفسهم فقط: ثلاثة أو أربعة أصناف مفروشة على قطعة بلاستيك، وهي عادة أجود ما في السوق.
  tip: |-
    ساعة تكفي. تعال بين التاسعة والظهر حين تكون البضاعة طازجة والزحام خفيفاً. واحمل نقداً بفئات صغيرة، فبعض البسطات فقط يقبل البطاقات. واجعل حقيبتك أمامك وانتبه لجيوبك. والبس حذاء لا يهمك أن يبتل. وانتبه إلى أن إخراج الجبن واللحم جواً مقيّد، أما البهارات والتشورتشخيلا والفواكه المجففة فتسافر بلا مشكلة.
  route: |-
    السوق عند ميدان المحطة، على بعد 5 كم ونحو خمس عشرة دقيقة من المركز عبر جادة أغماشينيبيلي أو تسيريتيلي. يمكنك القدوم بالسيارة، لكن هذا من أكثر التقاطعات ازدحاماً في المدينة: حافلات صغيرة وسيارات أجرة وشاحنات تفريغ في الحيز نفسه. وهناك موقف مدفوع تحت السوق وفي مجمع تبليسي سنترال، وهو الخيار المعقول الوحيد. والوقوف في الشارع هنا يعني سدّ طريق شاحنة. والبديل المترو: محطة ميدان المحطة تفتح على السوق مباشرة. وسيارة اقتصادية تكفي.
