ka:
  name: ჩოხატაური
  short: გურიის აღმოსავლეთი ქალაქი — ბახმაროსა და ნაბეღლავისკენ მიმავალი გზების კვანძი.
  body: >-
    **ჩოხატაური ის ადგილია, სადაც გურიის ბრტყელი ნაწილი მთაში გადადის.** ქალაქი სუფსის ხეობის შესასვლელთანაა
    და აქედან იწყება ორივე გზა, რომლისთვისაც აღმოსავლეთ გურიაში ჩამოდიან: ერთი ნაბეღლავისკენ, მეორე —
    გუბაზეულის ხეობით ბახმაროსკენ.

    ქალაქი პატარაა და მისი ღირსება პრაქტიკულია და არა სანახაობრივი: აქ არის ბოლო ნორმალური სუპერმარკეტი,
    ბანკომატი, აფთიაქი და საწვავი, სანამ მთაში ახვალ. ვინც ბახმაროში მიდის, აქ უნდა შეავსოს ბაკი და შეიძინოს
    ყველაფერი — ზემოთ არაფერია.

    რაც თვითონ ქალაქშია:

    - **ბაზარი**, სადაც შემოდგომაზე თხილი, თაფლი და ჩურჩხელა იყიდება

    - **სუფსის ხიდი** და მდინარის ნაპირი, სადაც ზაფხულში ბანაობენ

    - **ჩაის ყოფილი ფაბრიკის** შენობა — საბჭოთა მრეწველობის ნაშთი, რომელიც აქ ყველგან ჩანს

    ჩოხატაურის მუნიციპალიტეტი გურიის ყველაზე მთიანია და მისი სოფლები — ზოტი, ამაღლება, ბუკისციხე — ხეობებში,
    ღრმად შესულია. სწორედ აქედან იწყება საქართველოს ერთ-ერთი ულამაზესი, თუმცა ცუდი მთის გზა ბახმაროსკენ.

    ორი საათი ქალაქს ჰყოფნის. ის დანიშნულების წერტილი არაა, მაგრამ ლოგიკური გაჩერებაა და ღამის გასათევადაც
    გამოდგება, თუ ბახმაროში დილით ადრე გინდა ასვლა.
  tip: >-
    ერთი-ორი საათი. მთავარი ფუნქცია პრაქტიკულია: ბახმაროსკენ ან ნაბეღლავისკენ ასვლამდე აქ შეავსე ბაკი,
    აიღე ნაღდი ფული და იყიდე წყალი და საკვები — ზემოთ მაღაზია პრაქტიკულად არაა. ბაზარი დილით მუშაობს.
    სასტუმროები ცოტაა, ზაფხულში წინასწარ დაჯავშნა სჯობს. ცენტრში პარკინგი უფასოა.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ სამხრეთ-დასავლეთით ვანის გავლით ან სამტრედიიდან ლანჩხუთ-ოზურგეთის
    გზით — 315 კმ, დაახლოებით ხუთი საათი. ორივე ვარიანტი ბოლომდე ასფალტია; ქუთაისზე გავლით ოდნავ მოკლეა,
    მაგრამ გზა ვიწროა. საწვავი ქუთაისსა და თვითონ ჩოხატაურშია — ბოლო ნორმალური გასამართი სადგური ბახმაროსკენ
    მიმავალ გზაზე. ეკონომ-კლასის მანქანა თვითონ ქალაქამდე სავსებით საკმარისია.
en:
  name: Chokhatauri
  short: The eastern town of Guria — the junction for the roads up to Bakhmaro and Nabeghlavi.
  body: >-
    **Chokhatauri is where the flat part of Guria turns into mountains.** The town sits at the entrance
    to the Supsa valley, and both of the roads that bring people to eastern Guria start here: one to Nabeghlavi,
    the other up the Gubazeuli valley to Bakhmaro.

    The town is small and its value is practical rather than scenic. This is the last proper supermarket,
    cash machine, pharmacy and filling station before the mountains. Anyone heading for Bakhmaro should
    fill the tank and buy everything here, because there is nothing above.

    In the town itself:

    - The **market**, selling hazelnuts, honey and churchkhela in autumn

    - The **Supsa bridge** and the riverbank, where people swim in summer

    - The shell of the old **tea factory** — a piece of Soviet industry that is visible everywhere in
    this district

    Chokhatauri municipality is the most mountainous part of Guria and its villages — Zoti, Amaghleba,
    Bukistsikhe — run deep into the valleys. It is from here that one of the most beautiful and worst-surfaced
    mountain roads in Georgia climbs towards Bakhmaro.

    Two hours covers the town. It is not a destination, but it is a logical stop and a sensible place
    to spend a night if you want to start the climb to Bakhmaro early in the morning.
  tip: >-
    One to two hours. The main function is practical: before driving up to Bakhmaro or Nabeghlavi, fill
    the tank here, draw cash and buy water and food, because shops above are effectively non-existent.
    The market works in the morning. Hotels are few, so book ahead in summer. Parking in the centre is
    free.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head south-west through Vani, or continue to Samtredia
    and come round via Lanchkhuti and Ozurgeti — 315 km, about five hours. Both options are asphalt throughout;
    the Kutaisi route is slightly shorter but narrower. Fuel is available in Kutaisi and in Chokhatauri
    itself, which is the last proper station on the Bakhmaro road. An economy car is entirely sufficient
    as far as the town.
ru:
  name: Чохатаури
  short: Восточный город Гурии — развилка дорог на Бахмаро и Набеглави.
  body: >-
    **Чохатаури — там, где равнинная Гурия переходит в горы.** Город стоит у входа в ущелье Супса, и отсюда
    начинаются обе дороги, ради которых едут в восточную Гурию: одна на Набеглави, другая по ущелью Губазеули
    на Бахмаро.

    Город небольшой, и ценность его практическая, а не видовая. Это последний нормальный супермаркет,
    банкомат, аптека и заправка перед горами. Тому, кто едет в Бахмаро, стоит залить полный бак и купить
    всё здесь: выше нет ничего.

    В самом городе:

    - **Рынок**, где осенью продают фундук, мёд и чурчхелу

    - **Мост через Супсу** и берег реки, где летом купаются

    - Корпус бывшей **чайной фабрики** — след советской промышленности, заметный тут повсюду

    Чохатаурский муниципалитет — самая горная часть Гурии, а его сёла — Зоти, Амаглеба, Букисцихе — уходят
    глубоко в ущелья. Именно отсюда поднимается одна из красивейших и худших по покрытию горных дорог
    Грузии, ведущая к Бахмаро.

    Двух часов на город достаточно. Это не пункт назначения, но логичная остановка и разумное место для
    ночёвки, если подъём в Бахмаро вы хотите начать рано утром.
  tip: >-
    Час-два. Главная функция практическая: перед подъёмом в Бахмаро или Набеглави залейте здесь бак, снимите
    наличные и купите воду и еду — выше магазинов практически нет. Рынок работает по утрам. Гостиниц мало,
    летом лучше бронировать заранее. Парковка в центре бесплатная.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на юго-запад через Вани, либо дальше до Самтредиа и в обход через
    Ланчхути и Озургети — 315 км, около пяти часов. Оба варианта асфальтированы; через Кутаиси чуть короче,
    но дорога уже. Заправки в Кутаиси и в самом Чохатаури — последняя нормальная станция на дороге к Бахмаро.
    Машины эконом-класса до самого города вполне достаточно.
fa:
  name: چوخاتائوری
  short: شهر شرقی گوریا — تقاطع جاده‌های بالا به باخمارو و نابغلاوی.
  body: >-
    **چوخاتائوری جایی است که بخش هموار گوریا به کوهستان بدل می‌شود.** شهر در دهانهٔ درهٔ سوپسا نشسته و
    هر دو جاده‌ای که مردم را به شرق گوریا می‌آورند از همین‌جا آغاز می‌شوند: یکی به نابغلاوی و دیگری از
    درهٔ گوبازئولی به باخمارو.

    شهر کوچک است و ارزشش عملی است نه دیداری. اینجا آخرین سوپرمارکت درست‌وحسابی، خودپرداز، داروخانه و پمپ
    بنزین پیش از کوهستان است. هرکس رهسپار باخماروست باید همین‌جا باک را پر کند و همه‌چیز را بخرد، چون
    بالاتر هیچ نیست.

    در خود شهر:

    - **بازار**، که پاییز فندق و عسل و چورچخلا می‌فروشد

    - **پل سوپسا** و کرانهٔ رود که تابستان در آن شنا می‌کنند

    - اسکلت **کارخانهٔ چای** قدیمی — تکه‌ای از صنعت شوروی که در این شهرستان همه‌جا دیده می‌شود

    شهرستان چوخاتائوری کوهستانی‌ترین بخش گوریاست و روستاهایش — زوتی، آماغلبا، بوکیستسیخه — تا ژرفای دره‌ها
    پیش می‌روند. و از همین‌جاست که یکی از زیباترین و بدترین جاده‌های کوهستانی گرجستان به سوی باخمارو بالا
    می‌رود.

    دو ساعت برای شهر کافی است. مقصد نیست، اما توقفی منطقی است و برای ماندن یک شب مناسب، اگر می‌خواهید
    صعود به باخمارو را صبح زود آغاز کنید.
  tip: >-
    یک تا دو ساعت. کارکرد اصلی عملی است: پیش از بالا رفتن به باخمارو یا نابغلاوی، اینجا باک را پر کنید،
    پول نقد بگیرید و آب و خوراک بخرید، چون بالاتر عملاً مغازه‌ای نیست. بازار صبح‌ها کار می‌کند. هتل کم
    است، پس تابستان از پیش رزرو کنید. پارکینگ مرکز رایگان است.
  route: >-
    از تفلیس با E60 تا کوتایسی، سپس به جنوب‌غرب از وانی، یا ادامه تا سامترِدیا و دور زدن از لانچخوتی و
    اوزورگتی — ۳۱۵ کیلومتر، حدود پنج ساعت. هر دو گزینه سرتاسر آسفالت‌اند؛ راه کوتایسی کمی کوتاه‌تر اما
    باریک‌تر است. سوخت در کوتایسی و در خود چوخاتائوری، که آخرین جایگاه درست‌وحسابی روی جادهٔ باخماروست.
    خودروی اقتصادی تا خود شهر کاملاً کافی است.
he:
  name: צ׳וחאטאורי
  short: העיירה המזרחית של גוריה — צומת הדרכים העולות לבאחמארו ולנאבגלאווי.
  body: >-
    **צ׳וחאטאורי היא המקום שבו החלק המישורי של גוריה הופך להרים.** העיירה יושבת בפתח עמק סופסה, ומכאן
    מתחילות שתי הדרכים שמביאות אנשים למזרח גוריה: אחת לנאבגלאווי, והשנייה במעלה עמק גובאזאולי לבאחמארו.

    העיירה קטנה וערכה מעשי ולא נופי. זהו הסופרמרקט הראוי האחרון, וכן הכספומט, בית המרקחת ותחנת הדלק לפני
    ההרים. מי שנוסע לבאחמארו כדאי שימלא כאן דלק ויקנה כאן הכול, כי למעלה אין דבר.

    בעיירה עצמה:

    - **השוק**, שבו נמכרים בסתיו אגוזי לוז, דבש וצ׳ורצ׳חלה

    - **גשר סופסה** וגדת הנהר, שבה שוחים בקיץ

    - שלד **מפעל התה** הישן — פיסת תעשייה סובייטית שנראית כאן בכל מקום

    מחוז צ׳וחאטאורי הוא החלק ההררי ביותר בגוריה, וכפריו — זוטי, אמאגלבה, בוקיסציחה — נכנסים עמוק אל תוך
    העמקים. מכאן מטפסת אחת הדרכים ההרריות היפות ביותר והגרועות ביותר במצבן בגאורגיה, לעבר באחמארו.

    שעתיים מכסות את העיירה. היא אינה יעד, אבל היא עצירה הגיונית ומקום סביר ללינה אם אתם רוצים להתחיל את
    העלייה לבאחמארו מוקדם בבוקר.
  tip: >-
    שעה עד שעתיים. התפקיד העיקרי מעשי: לפני העלייה לבאחמארו או לנאבגלאווי מלאו כאן דלק, משכו מזומן וקנו
    מים ואוכל, כי למעלה כמעט אין חנויות. השוק פועל בבוקר. המלונות מעטים, אז הזמינו מראש בקיץ. החניה במרכז
    חינם.
  route: >-
    מטביליסי בכביש E60 עד קוטאיסי, ואז דרום-מערבה דרך ואני, או להמשיך עד סמטרדיה ולהקיף דרך לנצ׳חותי ואוזורגטי
    — 315 ק״מ, כחמש שעות. שתי האפשרויות סלולות לכל אורכן; דרך קוטאיסי מעט קצרה יותר אך צרה יותר. תדלוק
    בקוטאיסי ובצ׳וחאטאורי עצמה, שהיא התחנה הראויה האחרונה בדרך לבאחמארו. רכב חסכוני מספיק לחלוטין עד העיירה.
ar:
  name: تشوخاتاوري
  short: بلدة غوريا الشرقية — ملتقى الطريقين الصاعدين إلى باخمارو ونابيغلافي.
  body: >-
    **تشوخاتاوري هي حيث يتحول سهل غوريا إلى جبال.** تقع البلدة عند مدخل وادي سوبسا، ومن هنا يبدأ الطريقان
    اللذان يقودان الناس إلى شرق غوريا: أحدهما إلى نابيغلافي، والآخر صعوداً في وادي غوبازاولي إلى باخمارو.

    البلدة صغيرة وقيمتها عملية لا مشهدية. هنا آخر سوبرماركت حقيقي وصراف آلي وصيدلية ومحطة وقود قبل الجبال.
    ومن يقصد باخمارو فليملأ الخزان ويشترِ كل شيء هنا، فلا شيء في الأعلى.

    وفي البلدة نفسها:

    - **السوق**، حيث يُباع البندق والعسل والتشورتشخيلا في الخريف

    - **جسر سوبسا** وضفة النهر، حيث يسبح الناس صيفاً

    - هيكل **مصنع الشاي** القديم — قطعة من الصناعة السوفيتية تُرى في كل مكان بهذه البلدية

    وبلدية تشوخاتاوري أكثر أجزاء غوريا جبلية، وقراها — زوتي وأماغليبا وبوكيستسيخه — تتوغل عميقاً في الأودية.
    ومن هنا يصعد أحد أجمل طرق الجبال في جورجيا وأسوأها سطحاً، نحو باخمارو.

    ساعتان تغطيان البلدة. ليست وجهة، لكنها محطة منطقية ومكان معقول لقضاء ليلة إن أردت بدء الصعود إلى باخمارو
    باكراً.
  tip: >-
    ساعة إلى ساعتين. الوظيفة الأساسية عملية: قبل الصعود إلى باخمارو أو نابيغلافي املأ الخزان هنا واسحب
    نقداً واشترِ الماء والطعام، فالمتاجر في الأعلى شبه معدومة. السوق يعمل صباحاً. الفنادق قليلة، فاحجز
    مسبقاً في الصيف. والوقوف في الوسط مجاني.
  route: >-
    من تبليسي على E60 حتى كوتايسي، ثم جنوباً غرباً عبر فاني، أو المتابعة إلى سامتريديا والالتفاف عبر لانتشخوتي
    وأوزورغيتي — 315 كم، نحو خمس ساعات. كلا الخيارين معبّد بالكامل؛ وطريق كوتايسي أقصر قليلاً لكنه أضيق.
    الوقود في كوتايسي وفي تشوخاتاوري نفسها، وهي آخر محطة حقيقية على طريق باخمارو. وسيارة اقتصادية تكفي
    تماماً حتى البلدة.
