ka:
  name: ჩოხატაური
  short: >-
    პატარა გურული დაბა, სადაც ვაკე მთას ხვდება — ბოლო საწვავი ბახმარომდე და წარსული გარნიზონებით, აჯანყებებითა
    და ჩაით.
  body: >-
    **ჩოხატაურთან გურიის ვაკე მთავრდება.** დაბა გურიის ქედის სამხრეთ კალთის ძირას, სუფსის მარჯვენა ნაპირზე,
    ზღვის დონიდან 150 მეტრზე დგას და აქედან გზები მთისკენ მიიკლაკნება: ერთი გუბაზეულის ხეობით ბახმაროსკენ,
    მეორე — ნაბეღლავისკენ.


    სახელი გვარიდან, ჩახატარაშვილებისგან მოდის და XIX საუკუნის 70-იან წლებამდე „ჩახატაური“ დღევანდელი
    დაბის სამხრეთ-აღმოსავლეთით, სუფსისა და თეთრიღელის შესაყართან მდებარე დასახლებას ერქვა. 1810 წელს,
    გურიის სამთავროსა და რუსეთის იმპერიას შორის დადებული შეთანხმებით, აქ რუსული გარნიზონი ჩადგა. 1820
    წლის აპრილიდან აგვისტომდე, იმერეთის აჯანყების დროს, ამ მიწაზე აჯანყებული გურულები იმპერიის ჯარს ებრძოდნენ,
    დამარცხების შემდეგ კი გამაგრებული კოშკები დაანგრიეს. ახალმა სამხედრო გზამ სახელი ოსკოჯურის შესართავთან,
    დღევანდელ ადგილას გადმოიტანა. 1906 წლის თებერვალში, გურიის რესპუბლიკის ჩახშობისას, სადამსჯელო რაზმმა
    მეზობელ აკეთში ოცი სახლი გადაწვა.


    საბჭოთა ათწლეულებმა აქ იმაზე მძიმე კვალი დატოვა, ვიდრე მოელით: ჩაის ოთხი ფაბრიკა, ღვინის ქარხანა,
    ქუთაისის საავტომობილო ქარხნის ფილიალი. დაბაში ნახავთ:

    - **ნიკოლოზ ბერძენიშვილის სახელობის მხარეთმცოდნეობის მუზეუმს**, 1958 წელს დაარსებულს

    - ორაგულისფერ შენობას **საათიანი კოშკითა** და წითელი პირამიდული სახურავით — დაბის სავიზიტო ბარათს

    - შემორჩენილ **ოდა-სახლებს**, დასავლეთ საქართველოს ტრადიციულ ხის საცხოვრებლებს

    - **სუფსის ნაპირს**, ზაფხულის საღამოს გრილსა და წყნარს


    ჩოხატაური თავისთავად სამოგზაურო მიზანი არ არის, მაგრამ ბახმარომდე ბოლო ნორმალური სუპერმარკეტი, ბანკომატი
    და ბენზინგასამართი სადგური სწორედ აქაა. ბაკი გაავსეთ, პური იყიდეთ და თვალი მაღლა აუშვით: წინ ბახმაროს
    გრძელი, ციცაბო და უსწორმასწორო გზაა.
  tip: >-
    ერთი-ორი საათი. დაბის ნამდვილი დანიშნულება ლოჯისტიკაა: ბახმაროსკენ ან ნაბეღლავისკენ წასვლამდე აქ გაავსეთ
    ბაკი, გამოიტანეთ ნაღდი ფული და იყიდეთ წყალი და საჭმელი — ზემოთ მაღაზიები პრაქტიკულად ქრება. ბაზარი
    დილითაა ყველაზე ხალხმრავალი; შემოდგომაზე თხილს, თაფლსა და ჩურჩხელას ნახავთ. სასტუმრო ცოტაა, ამიტომ
    თუ მთაში ადრე დილით აპირებთ ასვლას, ივლის-აგვისტოში ოთახი წინასწარ დაჯავშნეთ. ცენტრში მანქანის დაყენება
    უფასოა. ცხრაოდე კილომეტრში, ხიდისთავთან ბახმაროს გზიდან ოდნავ გადახვევით, ზენობანში ნოდარ დუმბაძის
    მუზეუმია — გზად ერთი საათი ღირს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთისკენ
    დაახლოებით შვიდი კილომეტრი და შ2 გზაზე გადასვლა, რომელიც საჯავახოს გავლით ჩოხატაურამდე მიდის — 277
    კმ, დაახლოებით ოთხი საათი. გზა ბოლომდე ასფალტიანია: ს1-ზე სწრაფი, უმეტესად ოთხზოლიანი, ბოლო ოციოდე
    კილომეტრი კი ორზოლიანი სოფლის გზაა. საწვავი ქუთაისში, სამტრედიასა და თავად ჩოხატაურშია — ეს უკანასკნელი
    ნორმალური გასამართი სადგურია ბახმაროს გზაზე. დაბამდე ეკონომ-კლასის მანქანა სრულიად საკმარისია; ბახმაროს
    აღმართისთვის კი მაღალი გამავლობის (ოთხწამყვანიანი) მანქანა დაგჭირდებათ.
en:
  name: Chokhatauri
  short: >-
    A small Gurian town where the plain meets the mountains: the last fuel before Bakhmaro, and a past
    of garrisons, revolts and tea.
  body: >-
    **Chokhatauri is where Guria stops being flat.** The town lies at the foot of the Guria range, on
    the right bank of the Supsa at about 150 metres, and from here the roads climb into the mountains:
    one up the Gubazeuli valley towards Bakhmaro, another towards Nabeghlavi.


    The name comes from a family, the Chakhatarashvilis, and until the 1870s "Chakhatauri" meant a settlement
    south-east of today's town, where the Tetrighele stream meets the Supsa. In 1810, under an agreement
    between the Principality of Guria and the Russian Empire, a Russian garrison was posted here. From
    April to August 1820, during the Imeretian uprising, Gurian rebels fought imperial troops on this
    ground, and after their defeat the fortified towers were torn down. A new military road then carried
    the name to the present site at the mouth of the Oskojuri stream. In February 1906, as the Gurian
    Republic was crushed, a punitive force burned twenty houses in nearby Aketi.


    The Soviet decades left a heavier mark than you might expect: four tea factories, a winery, a branch
    of the Kutaisi car plant. In town:

    - the **Nikoloz Berdzenishvili Museum of Local Lore**, opened in 1958 and named after the historian

    - the salmon-pink building with the **clock tower** and red pyramid roof, the town's landmark

    - a few surviving **oda houses**, the traditional wooden homes of western Georgia

    - the **Supsa** riverbank, cool on a summer evening


    Chokhatauri is not a destination in itself, but it has the last proper supermarket, cash machine and
    filling station before Bakhmaro. Fill the tank, buy the bread, and look up: the road ahead is long,
    steep and rough.
  tip: >-
    An hour or two. The town's real job is logistics: before Bakhmaro or Nabeghlavi, fill up, draw cash
    and buy water and food here, because above the town shops all but vanish. The market is busiest in
    the morning; in autumn look for hazelnuts, honey and churchkhela. Hotels are few, so book ahead in
    July and August if you plan an early start up the mountain. Parking in the centre is free. The Nodar
    Dumbadze museum at Zenobani is about nine kilometres away, just off the Bakhmaro road at Khidistavi,
    and worth an hour on the way.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, follow the S12 south for about seven
    kilometres, then turn onto the Sh2, which runs through Sajavakho to Chokhatauri — 277 km, about four
    hours. It is asphalt the whole way: fast, largely dual carriageway on the S1, then a two-lane country
    road for the last twenty-odd kilometres. Fuel in Kutaisi, Samtredia and Chokhatauri itself, which
    has the last proper station on the Bakhmaro road. An economy car is entirely sufficient as far as
    the town; for the climb to Bakhmaro you will want an SUV or 4x4.
ru:
  name: Чохатаури
  short: >-
    Небольшой гурийский городок, где равнина встречается с горами: последняя заправка перед Бахмаро и
    прошлое, полное гарнизонов, восстаний и чая.
  body: >-
    **В Чохатаури равнинная Гурия заканчивается.** Городок лежит у подножия Гурийского хребта, на правом
    берегу Супсы, на высоте около 150 метров, и отсюда дороги начинают подниматься в горы: одна — вверх
    по долине Губазеули к Бахмаро, другая — к Набеглави.


    Название пошло от рода Чахатарашвили, и до 1870-х годов «Чахатаури» означало поселение к юго-востоку
    от нынешнего города, там, где ручей Тетригеле впадает в Супсу. В 1810 году, по соглашению между княжеством
    Гурия и Российской империей, здесь разместили русский гарнизон. С апреля по август 1820 года, во время
    имеретинского восстания, гурийские повстанцы сражались здесь с императорскими войсками, а после их
    разгрома укреплённые башни были разрушены. Затем новая военная дорога перенесла название на нынешнее
    место, к устью ручья Оскоджури. В феврале 1906 года, когда подавляли Гурийскую республику, карательный
    отряд сжёг двадцать домов в соседнем Акети.


    Советские десятилетия оставили след глубже, чем можно ожидать: четыре чайные фабрики, винзавод, филиал
    кутаисского автозавода. В городе:

    - **краеведческий музей имени Николоза Бердзенишвили**, открытый в 1958 году и названный в честь историка

    - лососево-розовое здание с **башней с часами** и красной пирамидальной крышей — визитная карточка
    городка

    - несколько сохранившихся **ода** — традиционных деревянных домов западной Грузии

    - берег **Супсы**, прохладный летним вечером


    Чохатаури — не пункт назначения сам по себе, но здесь последний настоящий супермаркет, банкомат и
    заправка перед Бахмаро. Заправьте бак, купите хлеб и поднимите глаза: дорога впереди длинная, крутая
    и ухабистая.
  tip: >-
    Час-два. Настоящая роль городка — логистика: перед Бахмаро или Набеглави заправьтесь, снимите наличные
    и купите воду и еду здесь, потому что выше по дороге магазины почти исчезают. Рынок оживлённее по
    утрам; осенью ищите фундук, мёд и чурчхелу. Отелей немного, так что бронируйте заранее на июль и август,
    если планируете ранний старт в горы. Парковка в центре бесплатная. Музей Нодара Думбадзе в Зенобани
    — примерно в девяти километрах, чуть в стороне от дороги на Бахмаро у Хидистави; он стоит часа по
    пути.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юг около семи
    километров, потом сверните на Sh2, которая идёт через Саджавахо до Чохатаури — 277 км, около четырёх
    часов. Асфальт на всём протяжении: быстрая трасса S1, по большей части с разделительной полосой, затем
    двухполосная сельская дорога на последних двадцати с лишним километрах. Заправиться можно в Кутаиси,
    Самтредиа и самом Чохатаури, где находится последняя настоящая заправка на дороге к Бахмаро. Обычной
    легковой машины хватит вплоть до города; для подъёма к Бахмаро понадобится внедорожник или полноприводный
    автомобиль.
fa:
  name: چوخاتائوری
  short: >-
    شهری کوچک در گوریا، جایی که دشت به کوهستان می‌رسد: آخرین سوخت‌گیری پیش از باخمارو، و گذشته‌ای پر از
    پادگان، شورش و چای.
  body: >-
    **چوخاتائوری همان‌جایی است که گوریای هموار به پایان می‌رسد.** این شهر در دامنهٔ رشته‌کوه گوریا، بر
    کنارهٔ راست رود سوپسا و در ارتفاع تقریبی ۱۵۰ متری قرار دارد، و از همین‌جا جاده‌ها به کوهستان بالا
    می‌روند: یکی در دل درهٔ گوبازئولی به سوی باخمارو، و دیگری به سوی نابگلاوی.


    این نام از خانوادهٔ چاخاتاراشویلی گرفته شده و تا دههٔ ۱۸۷۰ «چاخاتائوری» به سکونتگاهی در جنوب‌شرق شهر
    امروزی اشاره داشت، جایی که رودک تتریگله به سوپسا می‌ریزد. در سال ۱۸۱۰، بر پایهٔ توافقی میان شاهزاده‌نشین
    گوریا و امپراتوری روسیه، پادگانی روس در اینجا مستقر شد. از آوریل تا اوت ۱۸۲۰، در جریان شورش ایمرتی،
    شورشیان گوریایی در همین محل با نیروهای امپراتوری جنگیدند، و پس از شکستشان برج‌های دفاعی ویران شدند.
    سپس راهی نظامی تازه این نام را به محل کنونی، در محل ریزش رودک اسکوجوری، منتقل کرد. در فوریهٔ ۱۹۰۶،
    هنگام سرکوب جمهوری گوریا، نیرویی تنبیهی بیست خانه در آکتیِ نزدیک را به آتش کشید.


    دهه‌های شوروی اثری عمیق‌تر از آنچه انتظار می‌رود گذاشتند: چهار کارخانهٔ چای، یک کارخانهٔ شراب‌سازی،
    و شعبه‌ای از کارخانهٔ خودروسازی کوتایسی. در شهر:

    - **موزهٔ محلی نیکولوز بردزنیشویلی**، گشایش‌یافته در سال ۱۹۵۸ و نام‌گرفته از این تاریخ‌نگار

    - بنایی به رنگ گلبهی با **برج ساعت** و سقف هرمی سرخ، نشانهٔ شهر

    - چند **خانهٔ اودا** باقی‌مانده، خانه‌های چوبی سنتی گرجستان غربی

    - کنارهٔ رود **سوپسا**، خنک در شامگاهان تابستان


    چوخاتائوری خودش مقصد نیست، اما آخرین سوپرمارکت واقعی، دستگاه خودپرداز و پمپ بنزین پیش از باخمارو را
    دارد. باک را پر کنید، نان بخرید، و به بالا نگاه کنید: راه پیش رو طولانی، پرشیب و ناهموار است.
  tip: >-
    یک تا دو ساعت. نقش اصلی این شهر تدارکاتی است: پیش از باخمارو یا نابگلاوی، اینجا سوخت‌گیری کنید، پول
    نقد بردارید و آب و غذا بخرید، چون بالاتر از شهر مغازه‌ها تقریباً ناپدید می‌شوند. بازار در صبح‌ها شلوغ‌تر
    است؛ در پاییز فندق، عسل و چورچخلا بجویید. هتل‌ها کم‌اند، پس اگر قصد شروع زودهنگام به کوهستان دارید،
    در ژوئیه و اوت از پیش رزرو کنید. پارک خودرو در مرکز شهر رایگان است. موزهٔ نودار دومبادزه در زنوبانی
    حدود نه کیلومتر دورتر است، اندکی بیرون از جادهٔ باخمارو در خیدیستاوی، و ارزش یک ساعت وقت را در همین
    مسیر دارد.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 حدود هفت
    کیلومتر به جنوب ادامه دهید، و بعد به Sh2 بپیچید که از میان ساجاواخو تا چوخاتائوری می‌رود — ۲۷۷ کیلومتر،
    حدود چهار ساعت. تمام مسیر آسفالت است: بزرگ‌راه S1 سریع و اغلب دوخطه در هر سو، و سپس جاده‌ای روستایی
    و دوخطه برای بیست و چند کیلومتر پایانی. سوخت‌گیری در کوتایسی، سامتردیا و خودِ چوخاتائوری ممکن است،
    که آخرین پمپ بنزین واقعی در جادهٔ باخمارو را دارد. یک خودروی معمولی تا خودِ شهر کاملاً کافی است؛ برای
    سربالایی به باخمارو به شاسی‌بلند یا خودروی چهارچرخ‌محرک نیاز خواهید داشت.
he:
  name: צ'וחאטאורי
  short: 'עיירה גוריאנית קטנה שבה המישור פוגש את ההרים: תדלוק אחרון לפני באחמארו, ועבר של חילות משמר,
    מרידות ותה.'
  body: >-
    **צ'וחאטאורי הוא המקום שבו גוריה חדלה להיות מישורית.** העיירה שוכנת למרגלות רכס גוריה, על הגדה הימנית
    של סופסה, בגובה כ-150 מטרים, ומכאן מתחילות הדרכים לעלות להרים: אחת במעלה עמק גובזאולי לעבר באחמארו,
    ואחרת לעבר נבגלאווי.


    השם בא ממשפחת צ'אחאטאראשווילי, ועד שנות ה-70 של המאה ה-19 "צ'אחאטאורי" ציין יישוב מדרום-מזרח לעיירה
    של היום, שם נחל טטריגלה נפגש עם סופסה. ב-1810, לפי הסכם בין נסיכות גוריה לאימפריה הרוסית, הוצב כאן
    חיל משמר רוסי. מאפריל עד אוגוסט 1820, בעת המרד האימרתי, נלחמו מורדים גוריאנים בכוחות האימפריאליים
    בשטח הזה, ולאחר תבוסתם נהרסו מגדלי הביצור. דרך צבאית חדשה נשאה אז את השם למקום הנוכחי, בשפך נחל אוסקוג'ורי.
    בפברואר 1906, בעת דיכוי הרפובליקה הגוריאנית, שרף כוח עונשין עשרים בתים באקטי הסמוכה.


    העשורים הסובייטיים הטביעו חותם עמוק מהצפוי: ארבעה בתי חרושת לתה, יקב, סניף של מפעל הרכב הקוטאיסי.
    בעיירה:

    - **מוזיאון המורשת המקומית ניקולוז ברדזנישווילי**, שנפתח ב-1958 ונקרא על שם ההיסטוריון

    - הבניין בצבע סלמון עם **מגדל השעון** וגג פירמידלי אדום, סימן ההיכר של העיירה

    - כמה **בתי אודה** שרדו, בתי העץ המסורתיים של מערב גאורגיה

    - גדת נהר **סופסה**, קרירה בערב קיץ


    צ'וחאטאורי אינה יעד בפני עצמה, אבל בה הסופרמרקט האמיתי האחרון, הכספומט ותחנת הדלק האחרונים לפני באחמארו.
    מלאו את המכל, קנו לחם, והביטו מעלה: הדרך שלפניכם ארוכה, תלולה ומשובשת.
  tip: >-
    שעה עד שעתיים. תפקידה האמיתי של העיירה הוא לוגיסטי: לפני באחמארו או נבגלאווי, תדלקו, משכו מזומן וקנו
    מים ומזון כאן, כי מעל העיירה החנויות נעלמות כמעט כליל. השוק פעיל יותר בבוקר; בסתיו חפשו אגוזי לוז,
    דבש וצ'ורצ'חלה. מלונות מעטים, אז הזמינו מראש ביולי ובאוגוסט אם מתכננים יציאה מוקדמת להר. חנייה במרכז
    חינם. מוזיאון נודאר דומבדזה בזנובני נמצא כתשעה קילומטרים מכאן, סמוך לכביש באחמארו ליד חידיסטאווי,
    ושווה שעה בדרך.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, המשיכו ב-S12 דרומה כשבעה קילומטרים,
    ואז פנו ל-Sh2, העובר בסאג'אווכו עד צ'וחאטאורי — 277 ק"מ, כארבע שעות. אספלט כל הדרך: כביש מהיר, ברובו
    דו-מסלולי, ב-S1, ואז כביש כפרי בשני נתיבים בקילומטרים העשרים ומשהו האחרונים. תדלוק בקוטאיסי, בסמטרדיה
    ובצ'וחאטאורי עצמה, שם התחנה האמיתית האחרונה בכביש באחמארו. רכב פשוט מספיק בהחלט עד העיירה; לעלייה
    לבאחמארו תרצו רכב שטח או רכב עם הנעה כפולה.
ar:
  name: تشوخاتاوري
  short: 'بلدة غورية صغيرة يلتقي فيها السهل بالجبال: آخر محطة وقود قبل باخمارو، وماضٍ من الحاميات والثورات
    والشاي.'
  body: >-
    **تشوخاتاوري هي حيث تتوقف غوريا عن كونها سهلًا مسطحًا.** تقع البلدة عند سفح سلسلة جبال غوريا، على
    الضفة اليمنى لنهر سوبسا وعلى ارتفاع نحو 150 مترًا، ومن هنا تبدأ الطرق بالصعود إلى الجبال: أحدها في
    وادي غوبازئولي صعودًا نحو باخمارو، وآخر نحو نابغلافي.


    يأتي الاسم من عائلة تشاخاتاراشفيلي، وحتى سبعينيات القرن التاسع عشر كانت «تشاخاتاوري» تشير إلى مستوطنة
    جنوب شرق البلدة الحالية، حيث يلتقي جدول تتريغيله بنهر سوبسا. في عام 1810، بموجب اتفاق بين إمارة غوريا
    والإمبراطورية الروسية، تمركزت حامية روسية هنا. ومن أبريل إلى أغسطس 1820، خلال ثورة إيميريتي، قاتل
    الثوار الغوريون القوات الإمبراطورية على هذه الأرض، وبعد هزيمتهم هُدمت الأبراج المحصّنة. ثم حمل طريق
    عسكري جديد الاسم إلى الموضع الحالي، عند مصب جدول أوسكوجوري. وفي فبراير 1906، أثناء سحق جمهورية غوريا،
    أحرقت قوة عقابية عشرين بيتًا في أكيتي القريبة.


    تركت العقود السوفيتية أثرًا أعمق من المتوقع: أربعة معامل للشاي، ومعمل نبيذ، وفرع لمصنع سيارات كوتايسي.
    في البلدة:

    - **متحف نيكولوز بردزنيشفيلي للتراث المحلي**، افتُتح عام 1958 وسُمّي باسم المؤرخ

    - المبنى الوردي السلمونيّ ذو **برج الساعة** وسقفه الهرمي الأحمر، معلَم البلدة

    - بعض **بيوت الأودا** الباقية، وهي البيوت الخشبية التقليدية في غرب جورجيا

    - ضفة نهر **سوبسا**، الباردة في مساء الصيف


    لا تُعدّ تشوخاتاوري وجهة بذاتها، لكنها تحوي آخر سوبرماركت حقيقي وآخر صرّاف آلي وآخر محطة وقود قبل
    باخمارو. عبّئ الخزان، اشترِ الخبز، وانظر إلى الأعلى: الطريق أمامك طويل، حاد الانحدار ووعر.
  tip: >-
    ساعة إلى ساعتين. وظيفة البلدة الحقيقية لوجستية: قبل باخمارو أو نابغلافي، تزوّد بالوقود واسحب النقود
    واشترِ الماء والطعام هنا، لأن المتاجر تختفي تقريبًا فوق البلدة. السوق أكثر ازدحامًا في الصباح؛ وفي
    الخريف ابحث عن البندق والعسل والتشورتشخيلا. الفنادق قليلة، فاحجز مسبقًا في يوليو وأغسطس إذا كنت تخطط
    لانطلاقة مبكرة إلى الجبل. ركن السيارة في وسط البلدة مجاني. يقع متحف نودار دومبادزه في زينوباني على
    بُعد نحو تسعة كيلومترات، على مقربة من طريق باخمارو عند خيديستاوي، ويستحق ساعة في الطريق.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم تابع على S12 جنوبًا لنحو سبعة
    كيلومترات، ثم انعطف إلى Sh2 الذي يمر بساجافاخو حتى تشوخاتاوري — 277 كم، نحو أربع ساعات. الطريق معبّد
    بالكامل: سريع، ومزدوج المسار غالبًا على S1، ثم طريق ريفي بمسارين في آخر عشرين كيلومترًا ونيّف. يمكن
    التزود بالوقود في كوتايسي وسامتريديا وفي تشوخاتاوري نفسها، التي تضم آخر محطة حقيقية على طريق باخمارو.
    سيارة اقتصادية تكفي تمامًا حتى البلدة؛ أما للصعود إلى باخمارو فستحتاج إلى سيارة دفع رباعي أو رياضية
    متعددة الاستخدامات.
