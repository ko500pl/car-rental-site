ka:
  name: ანაკლია
  short: >-
    ნახევრად აშენებული კურორტი, 540-მეტრიანი ხიდი და ცარიელი ქვიშა ენგურის შესართავთან — ისტორიით, რომელიც
    ბეტონზე ბევრად ძველია.
  body: >-
    **ხალხური გადმოცემით, ანაკლიის სახელი კივილიდან დაიბადა.**


    ლეგენდა მეგრულია: ამ ნაპირზე დედა, ანა, იდგა და უყურებდა, როგორ მიჰყავდათ გემით მისი მოტაცებული შვილი.
    ხალხმა იკითხა, რა ხდებაო, და პასუხი მოვიდა: „ანა რკიანს“ — ანა კივის. მეცნიერები უფრო ფხიზლად მსჯელობენ
    და ამ ადგილს კოლხეთის ანტიკურ ჰერაკლეასთან აიგივებენ. ლეგენდა კი უმიზეზოდ არ შექმნილა. XV–XVII საუკუნეებში
    ანაკლია ოდიშის სამთავროს მნიშვნელოვანი ნავსადგური იყო და ტრაპიზონთან და კონსტანტინოპოლთან ვაჭრობდა;
    1723 წელს ოსმალებმა დაიკავეს და ტყვეებით ვაჭრობის ბუდედ აქციეს. 1802 წელს აფხაზეთის მმართველმა ქელეშ-ბეი
    შარვაშიძემ გრიგოლ დადიანს ანაკლიის დათმობა აიძულა და მისი მემკვიდრე, ლევანი, მძევლად წაიყვანა; 1805
    წელს რუსულმა ჯარმა ანაკლია აიღო და ტყვე გაათავისუფლეს. ძველი ციხის ნანგრევები სოფელში დღესაც დგას.


    2010-იანი წლების დასაწყისში ბეტონის ჯერი დადგა: კილომეტრზე გრძელი ბულვარი, სასტუმროები და ენგურზე
    განმუხურისკენ გადებული დაახლოებით 540-მეტრიანი საფეხმავლო ხიდი. მერე ელექტრონული მუსიკაც მოვიდა —
    2014 წელს „კაზანტიპი“, 2015 წლიდან კი GEM Fest. ზოგი შენობა ასე დაუმთავრებელი დარჩა. ღრმაწყლოვან პორტს
    თავისი ამბავი აქვს: 2016 წელს მიიღეს გადაწყვეტილება, 2017 წლის დეკემბერში დაიწყეს, 2020 წელს კონტრაქტი
    გაწყდა, 2024 წელს კი პროექტი ახალი პარტნიორებით განახლდა.


    სანაპირო კილომეტრობით გრძელდება — წვრილი ქვიშა და ფართო ცა, სამხრეთის კურორტებზე გაცილებით ნაკლები
    ხალხით. სოფლის სამხრეთით კოლხეთის ეროვნული პარკის ანაკლია–ჭურიის უბანი იწყება, ფრინველთა ერთ-ერთ უდიდეს
    სამიგრაციო გზაზე, რამსარის კონვენციით დაცული; შემოდგომაზე ბინოკლი აქ საცურაო პირსახოცზე ნაკლებად არ
    გამოგადგებათ.


    მზის ჩასვლისას ხიდზე დადექით: ზურგს უკან ნახევრად ცარიელი სასტუმროები გრჩებათ, ქვემოთ ენგური ზღვას
    მღვრიე წყალს აწვდის, მოწმენდილ საღამოს კი ორმოციოდე კილომეტრის იქით კავკასიონის თოვლი მოჩანს.
  tip: >-
    ჩამოდით რამდენიმე საათით, ან, თუ ბანაობა გინდათ, მთელი ზაფხულის დღით. ივლის-აგვისტოს მიღმა კაფეებისა
    და სასტუმროების უმეტესობა იკეტება, ამიტომ წყალი და საჭმელი ზუგდიდიდან წამოიღეთ; ბულვარის გარდა ჩრდილი
    ცოტაა. ხიდზე გასეირნება უფასოა და მზის ჩასვლისას საუკეთესო. აქ ტალღა სამხრეთის პლაჟებთან შედარებით
    ძლიერია, შესართავთან დინება სერიოზულია, მაშველები კი მხოლოდ მოკლე მაღალ სეზონში მუშაობენ. ხიდს გაღმა
    განმუხურის ჩრდილოეთით ნუ გადახვალთ: რუსეთის მიერ ოკუპირებულ აფხაზეთთან გამყოფი ხაზი ახლოსაა. პორტის
    სამშენებლო სატვირთოებიც გაითვალისწინეთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ იმავე S1-ით სენაკის გავლით
    ზუგდიდამდე, იქიდან კი დასავლეთით, ზღვისკენ, 30 კილომეტრი — სულ დაახლოებით 365 კმ და ხუთნახევარი საათი,
    მთელ გზაზე ასფალტი. ოდნავ მოკლე ალტერნატივაა ხობთან მაგისტრალიდან გადახვევა და ჩრდილო-დასავლეთით ვაკეზე
    გადაჭრა, თუმცა სოფლის გზები უფრო ნელია. ბოლო მონაკვეთი სწორი და ვაკეა, ოღონდ სამშენებლო სატვირთოებთან
    მოგიწევთ მისი გაყოფა. პარკირება ბულვართან და ხიდთან უფასოა. საწვავი ზუგდიდში ჩაასხით. ეკონომკლასის
    მანქანაც სავსებით საკმარისია.
en:
  name: Anaklia
  short: >-
    A half-built resort, a 540-metre footbridge and empty sand where the Enguri meets the sea — and a
    history far older than the concrete.
  body: >-
    **Anaklia's name, folk etymology says, began as a scream.**


    The legend is Mingrelian: a mother called Ana stood on this shore while her child was carried off
    by ship, and when people asked what the cry was, the answer came back, "Ana rkians" — "Ana is screaming."
    Scholars, more soberly, identify the site with the classical Heraclea of Colchis. Yet the legend is
    not idle. From the fifteenth to the seventeenth century Anaklia was a port of the Principality of
    Mingrelia, trading with Trebizond and Constantinople; in 1723 the Ottomans took it and made it a slave-trading
    post. In 1802 the Abkhaz ruler Kelesh-Bey Sharvashidze forced Prince Grigol Dadiani to surrender the
    town and took his heir, Levan, hostage; in 1805 Russian troops seized Anaklia and the prisoner was
    freed. The ruins of the old fortress still stand in the village.


    In the early 2010s came concrete: a boulevard more than a kilometre long, hotels, and a pedestrian
    bridge of some 540 metres across the Enguri to Ganmukhuri. Electronic music followed — Kazantip in
    2014, GEM Fest from 2015. Some buildings were never finished. The deep-sea port has its own saga:
    decided in 2016, begun in December 2017, cancelled in 2020, revived in 2024 with new partners.


    The beach runs for kilometres, fine sand under a wide sky, far emptier than the resorts further south.
    Just south of the village lies the Anaklia–Churia sector of Kolkheti National Park, on one of the
    great bird-migration routes and protected under the Ramsar Convention; in autumn, binoculars earn
    their place.


    Stand on the bridge at sunset: behind you the half-empty hotels, below you the Enguri pushing brown
    water into the sea, and on a clear evening the snows of the Caucasus some forty kilometres away.
  tip: >-
    Come for a few hours, or a whole summer day if you swim. Outside July and August most cafés and hotels
    close, so bring water and food from Zugdidi; shade is scarce beyond the boulevard. The walk across
    the footbridge is free and best at sunset. The surf is stronger than on the southern beaches and the
    current by the river mouth is real, with lifeguards only in the short high season. Across the bridge,
    do not wander north of Ganmukhuri: the line with Russian-occupied Abkhazia is close. Expect lorries
    serving the port works.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia and on along the S1 through Senaki to Zugdidi,
    then turn west for the 30 km run down to the coast — about 365 km and five and a half hours, asphalt
    all the way. A slightly shorter alternative leaves the highway at Khobi and cuts north-west across
    the plain on slower village roads. The final stretch is flat and straight, shared with construction
    lorries. Parking by the boulevard and the bridge is free. Refuel in Zugdidi. An economy car is all
    you need.
ru:
  name: Анаклия
  short: >-
    Недостроенный курорт, пешеходный мост длиной 540 метров и пустой песок там, где Ингури встречается
    с морем, — а за всем этим история куда древнее бетона.
  body: >-
    **Название Анаклии, если верить народной этимологии, родилось из крика.**


    Легенда мегрельская: на этом берегу стояла мать по имени Ана, а корабль увозил прочь её ребёнка; когда
    люди спрашивали, что это за крик, им отвечали: «Ана ркианс» — «Ана кричит». Учёные судят трезвее:
    они отождествляют это место с античной Гераклеей Колхидской. И всё же легенда родилась не на пустом
    месте. С XV по XVII век Анаклия была портом Мегрельского княжества и торговала с Трапезундом и Константинополем;
    в 1723 году её захватили османы и устроили здесь невольничий рынок. В 1802 году абхазский владетель
    Келеш-бей Шервашидзе вынудил князя Григола Дадиани сдать город и увёз в заложники его наследника Левана;
    в 1805-м Анаклию заняли русские войска, и пленник вышел на свободу. Руины старой крепости до сих пор
    стоят в селе.


    В начале 2010-х пришёл бетон: бульвар длиной больше километра, гостиницы и пешеходный мост около 540
    метров через Ингури — к Ганмухури. Следом пришла электронная музыка: Казантип в 2014 году, GEM Fest
    — с 2015-го. Некоторые здания так и не достроили. У глубоководного порта своя сага: решение приняли
    в 2016 году, строить начали в декабре 2017-го, в 2020-м проект отменили, а в 2024-м возродили с новыми
    партнёрами.


    Пляж тянется на километры — мелкий песок под огромным небом, и людей здесь куда меньше, чем на курортах
    южнее. Сразу к югу от села начинается Анаклия-Чурийский участок Колхетского национального парка: он
    лежит на одном из великих путей птичьих перелётов и охраняется Рамсарской конвенцией. Осенью бинокль
    здесь совсем не лишний.


    Поднимитесь на мост на закате: за спиной полупустые гостиницы, внизу Ингури выталкивает в море бурую
    воду, а ясным вечером видны снега Кавказа — километрах в сорока отсюда.
  tip: >-
    Приезжайте на несколько часов — или на целый летний день, если собираетесь купаться. Вне июля и августа
    большинство кафе и гостиниц закрыто, так что воду и еду везите из Зугдиди; за пределами бульвара тени
    почти нет. Прогулка по мосту бесплатна, лучше всего — на закате. Прибой здесь сильнее, чем на южных
    пляжах, течение у устья реки нешуточное, а спасатели дежурят лишь в короткий разгар сезона. Перейдя
    мост, не уходите севернее Ганмухури: рядом линия разграничения с оккупированной Россией Абхазией.
    Будьте готовы к грузовикам, обслуживающим стройку порта.
  route: >-
    Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа, дальше по той же S1 через Сенаки до Зугдиди, а там
    — поворот на запад и 30 км до побережья: всего около 365 км и пять с половиной часов, всё по асфальту.
    Чуть более короткий вариант — съехать с трассы у Хоби и срезать на северо-запад через равнину по более
    медленным сельским дорогам. Последний отрезок ровный и прямой, его придётся делить со строительными
    грузовиками. Парковка у бульвара и моста бесплатная. Заправьтесь в Зугдиди. Машины эконом-класса вполне
    достаточно.
fa:
  name: آناکلیا
  short: >-
    تفرجگاهی نیمه‌کاره، پلی پیاده به درازای ۵۴۰ متر و ماسه‌زاری خالی آنجا که انگوری به دریا می‌رسد — و
    تاریخی بسیار کهن‌تر از بتن.
  body: >-
    **به روایت ریشه‌شناسی عامیانه، نام آناکلیا از یک فریاد زاده شد.**


    افسانه مگرلی است: مادری به نام آنا بر این ساحل ایستاده بود و کشتی‌ای فرزندش را با خود می‌برد؛ وقتی
    مردم پرسیدند این فریاد چیست، پاسخ آمد: «آنا رکیانس» — یعنی «آنا فریاد می‌زند». پژوهشگران هشیارانه‌تر
    این مکان را همان هراکلهٔ کلخیسِ دوران باستان می‌دانند. با این همه، افسانه بی‌پایه نیست. از سدهٔ پانزدهم
    تا هفدهم، آناکلیا بندری از امیرنشین مگرلیا بود که با طرابوزان و قسطنطنیه داد و ستد داشت؛ در ۱۷۲۳ عثمانی‌ها
    آن را گرفتند و به پایگاه برده‌فروشی بدل کردند. در ۱۸۰۲ کلش‌بیگ شرواشیدزه، فرمانروای آبخاز، شاهزاده
    گریگول دادیانی را به تسلیم شهر واداشت و وارثش لوان را به گروگان برد؛ در ۱۸۰۵ سپاهیان روس آناکلیا را
    گرفتند و گروگان آزاد شد. ویرانه‌های دژ کهن هنوز در روستا پابرجاست.


    در آغاز دههٔ ۲۰۱۰ نوبت بتن رسید: بلواری به درازای بیش از یک کیلومتر، هتل‌ها و پلی پیاده به طول نزدیک
    ۵۴۰ متر بر روی انگوری تا گانموخوری. در پی آن موسیقی الکترونیک آمد — کازانتیپ در ۲۰۱۴ و جشنوارهٔ «جم
    فست» از ۲۰۱۵. برخی ساختمان‌ها هرگز تمام نشدند. بندر آب‌های ژرف هم ماجرای پرفراز و نشیب خودش را دارد:
    تصمیمش در ۲۰۱۶ گرفته شد، ساختش در دسامبر ۲۰۱۷ آغاز شد، در ۲۰۲۰ لغو شد و در ۲۰۲۴ با شریکانی تازه دوباره
    جان گرفت.


    ساحل کیلومترها امتداد دارد — ماسه‌ای نرم زیر آسمانی فراخ، بسیار خلوت‌تر از تفرجگاه‌های جنوبی‌تر. درست
    در جنوب روستا بخش آناکلیا–چوریای پارک ملی کلخِتی آغاز می‌شود که بر یکی از بزرگ‌ترین مسیرهای کوچ پرندگان
    قرار دارد و زیر حمایت کنوانسیون رامسر است؛ در پاییز، دوربین دوچشمی اینجا به‌راستی به کار می‌آید.


    هنگام غروب روی پل بایستید: پشت سرتان هتل‌های نیمه‌خالی، زیر پایتان انگوری که آب قهوه‌ای‌اش را به دریا
    می‌راند، و در غروبی صاف، برف‌های قفقاز در فاصلهٔ حدود چهل کیلومتری.
  tip: >-
    برای چند ساعت بیایید، یا اگر اهل شنا هستید برای یک روز کامل تابستانی. بیرون از ژوئیه و اوت بیشتر کافه‌ها
    و هتل‌ها بسته‌اند، پس آب و خوراک را از زوگدیدی بیاورید؛ بیرون از محدودهٔ بلوار سایه کم است. پیاده‌روی
    روی پل رایگان است و بهترین زمانش غروب. موج‌ها از ساحل‌های جنوبی قوی‌ترند و جریان آب کنار دهانهٔ رود
    جدی است، و غریق‌نجات تنها در اوج کوتاه فصل حضور دارد. آن سوی پل، از گانموخوری به سمت شمال نروید: خط
    تماس با آبخازیای اشغال‌شده به دست روسیه نزدیک است. منتظر کامیون‌هایی باشید که برای کارگاه بندر رفت‌وآمد
    می‌کنند.
  route: >-
    از تفلیس جادهٔ S1 (E60) را بگیرید، از کنار کوتائیسی تا سامتردیا بروید و همچنان در S1 از سناکی به زوگدیدی
    برسید؛ سپس به غرب بپیچید و ۳۰ کیلومتر تا ساحل برانید — روی هم حدود ۳۶۵ کیلومتر و پنج ساعت و نیم، تماماً
    آسفالت. گزینه‌ای اندکی کوتاه‌تر این است که در شهرکی به نام خوبی از بزرگراه خارج شوید و از میان دشت،
    با جاده‌های روستایی کندتر، به شمال‌غرب میان‌بر بزنید. بخش پایانی هموار و مستقیم است و باید آن را با
    کامیون‌های ساختمانی شریک شوید. پارکینگ کنار بلوار و پل رایگان است. در زوگدیدی سوخت‌گیری کنید. یک خودروی
    اقتصادی کاملاً کافی است.
he:
  name: אנאקליה
  short: >-
    אתר נופש שבנייתו לא הושלמה, גשר להולכי רגל באורך 540 מטר וחול ריק במקום שבו האנגורי פוגש את הים —
    והיסטוריה עתיקה בהרבה מן הבטון.
  body: >-
    **לפי האטימולוגיה העממית, שמה של אנאקליה נולד מצעקה.**


    האגדה מגרלית: אם בשם אנה עמדה על החוף הזה בשעה שילדה נלקח ממנה בספינה, וכשאנשים שאלו מהי הזעקה, באה
    התשובה: "אנה רקיאנס" — "אנה צועקת". החוקרים, מפוכחים יותר, מזהים את המקום עם הרקליאה הקדומה שבקולכיס.
    ובכל זאת, האגדה לא נולדה יש מאין. מן המאה ה-15 ועד המאה ה-17 הייתה אנאקליה נמל של נסיכות מגרליה, שסחר
    עם טרביזונד ועם קונסטנטינופול; ב-1723 כבשו אותה העות'מאנים והפכו אותה לתחנה של סחר עבדים. ב-1802 אילץ
    השליט האבחזי קלש-ביי שרוושידזה את הנסיך גריגול דדיאני למסור את העיר, ולקח את יורשו, לבאן, כבן ערובה;
    ב-1805 כבשו כוחות רוסיים את אנאקליה, והשבוי שוחרר. חורבות המבצר הישן עומדות בכפר עד היום.


    בתחילת שנות ה-2010 הגיע הבטון: טיילת שאורכה יותר מקילומטר, מלונות, וגשר להולכי רגל באורך של כ-540
    מטר מעל האנגורי, אל גנמוחורי. אחריו באה המוזיקה האלקטרונית — קזנטיפ ב-2014, ו"ג'ם פסט" החל מ-2015.
    חלק מהמבנים לא הושלמו מעולם. לנמל המים העמוקים יש סאגה משלו: ההחלטה התקבלה ב-2016, הבנייה החלה בדצמבר
    2017, הפרויקט בוטל ב-2020 וקם לתחייה ב-2024 עם שותפים חדשים.


    החוף משתרע לאורך קילומטרים — חול דק תחת שמיים רחבים, ריק בהרבה מאתרי הנופש שמדרום. ממש מדרום לכפר
    נמצא מקטע אנאקליה–צ'וריה של הפארק הלאומי קולחתי, השוכן על אחד מנתיבי נדידת הציפורים הגדולים בעולם
    ומוגן במסגרת אמנת רמסר; בסתיו, המשקפת מצדיקה את מקומה בתיק.


    עמדו על הגשר בשקיעה: מאחוריכם המלונות החצי-ריקים, מתחתיכם האנגורי דוחף מים חומים אל הים, ובערב צלול
    נראים השלגים של הקווקז, במרחק של כארבעים קילומטר.
  tip: >-
    בואו לכמה שעות, או ליום קיץ שלם אם אתם מתכוונים לשחות. מחוץ ליולי ולאוגוסט רוב בתי הקפה והמלונות סגורים,
    לכן הביאו מים ואוכל מזוגדידי; מחוץ לטיילת כמעט אין צל. ההליכה על הגשר חינם, והיא יפה במיוחד בשקיעה.
    הגלים חזקים יותר מאשר בחופים הדרומיים, והזרם ליד שפך הנהר חזק באמת; מצילים יש רק בשיא העונה הקצר.
    אחרי שחוצים את הגשר, אל תתרחקו צפונה מגנמוחורי: קו ההפרדה עם אבחזיה, הכבושה בידי רוסיה, קרוב. צפו
    למשאיות המשרתות את עבודות הנמל.
  route: >-
    מטביליסי סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, והמשיכו ב-S1 דרך סנאקי עד זוגדידי; שם פנו מערבה
    ל-30 הק״מ האחרונים עד החוף — כ-365 ק״מ וחמש שעות וחצי, כולם על אספלט. חלופה קצרה מעט יוצאת מהכביש
    המהיר בחובי וחוצה את המישור צפונה-מערבה בדרכי כפר איטיות יותר. הקטע האחרון שטוח וישר, ומשאיות בנייה
    חולקות אותו איתכם. החניה ליד הטיילת והגשר חינם. תדלקו בזוגדידי. רכב מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: أناكليا
  short: >-
    منتجع لم يكتمل بناؤه، وجسر للمشاة طوله 540 مترًا، ورمال خالية حيث يلتقي إنغوري بالبحر — وتاريخ أقدم
    بكثير من الخرسانة.
  body: >-
    **يقول الاشتقاق الشعبي إن اسم أناكليا وُلد من صرخة.**


    الأسطورة ميغريلية: أمٌّ تُدعى آنا وقفت على هذا الشاطئ بينما حملت سفينةٌ طفلها بعيدًا، ولما سأل الناس
    عن تلك الصرخة جاءهم الجواب: «آنا ركيانس» — أي «آنا تصرخ». أما العلماء فيطابقون الموقع، بقدر أكبر من
    الرصانة، مع هيراكليا الكولخية القديمة. ومع ذلك فالأسطورة لم تأتِ من فراغ. فمن القرن الخامس عشر إلى
    السابع عشر كانت أناكليا ميناءً لإمارة ميغريليا يتاجر مع طرابزون والقسطنطينية؛ وفي عام 1723 استولى
    عليها العثمانيون وجعلوها مركزًا لتجارة الرقيق. وفي عام 1802 أرغم الحاكم الأبخازي كيليش بيك شرفاشيدزه
    الأميرَ غريغول دادياني على تسليم البلدة، وأخذ وريثه ليفان رهينةً؛ وفي عام 1805 استولت القوات الروسية
    على أناكليا وأُطلق سراح الأسير. ولا تزال أطلال القلعة القديمة قائمة في القرية.


    وفي مطلع العقد الثاني من هذا القرن جاءت الخرسانة: كورنيش يزيد طوله على كيلومتر، وفنادق، وجسر للمشاة
    يقارب طوله 540 مترًا فوق إنغوري إلى غانموخوري. ثم تبعتها الموسيقى الإلكترونية — مهرجان كازانتيب عام
    2014، ومهرجان «جيم فست» منذ عام 2015. بعض المباني لم يكتمل قط. ولميناء المياه العميقة حكايته الطويلة:
    اتُّخذ القرار عام 2016، وبدأ البناء في ديسمبر 2017، وأُلغي المشروع عام 2020، ثم بُعث من جديد عام 2024
    مع شركاء جدد.


    يمتد الشاطئ كيلومترات: رملٌ ناعم تحت سماء رحبة، وهو أخلى بكثير من المنتجعات الواقعة جنوبًا. وإلى الجنوب
    من القرية مباشرة يقع قطاع أناكليا–تشوريا من حديقة كولخيتي الوطنية، على أحد أعظم مسارات هجرة الطيور،
    وهو محمي بموجب اتفاقية رامسار؛ وفي الخريف يستحق المنظار مكانه في الحقيبة.


    قف على الجسر عند الغروب: خلفك الفنادق شبه الخالية، وتحتك إنغوري يدفع ماءه البني إلى البحر، وفي مساء
    صافٍ تلوح ثلوج القوقاز على بعد نحو أربعين كيلومترًا.
  tip: >-
    تعالَ لبضع ساعات، أو ليوم صيفي كامل إن كنت تنوي السباحة. خارج يوليو وأغسطس تُغلق معظم المقاهي والفنادق،
    فاحمل الماء والطعام من زوغديدي؛ والظل نادر خارج الكورنيش. عبور الجسر مجاني، وأجمل ما يكون عند الغروب.
    الأمواج أقوى منها على الشواطئ الجنوبية، والتيار عند مصب النهر قوي فعلًا، ولا يوجد منقذون إلا في ذروة
    الموسم القصيرة. وبعد عبور الجسر لا تتجول شمال غانموخوري: فخط التماس مع أبخازيا التي تحتلها روسيا قريب.
    وتوقّع شاحنات تخدم أعمال الميناء.
  route: >-
    من تبليسي خذ الطريق S1 (E60) مرورًا بكوتايسي حتى سامتريديا، ثم تابع على S1 عبر سيناكي إلى زوغديدي،
    ومنها انعطف غربًا لمسافة 30 كم نزولًا إلى الساحل — نحو 365 كم وخمس ساعات ونصف، على الأسفلت طوال الطريق.
    وثمة بديل أقصر قليلًا: أن تغادر الطريق السريع عند خوبي وتقطع السهل نحو الشمال الغربي عبر طرق قروية
    أبطأ. المقطع الأخير مستوٍ ومستقيم، وتشاركك فيه شاحنات البناء. الوقوف قرب الكورنيش والجسر مجاني. تزوّد
    بالوقود في زوغديدي. سيارة اقتصادية تكفي تمامًا.
