ka:
  name: ანაკლია
  short: >-
    შავი ქვიშის ფართო სანაპირო ენგურის შესართავთან — მშვიდი, ნახევრად მიტოვებული და საქართველოში ყველაზე
    უჩვეულო საზღვაო ადგილი.
  body: >-
    **ანაკლია საქართველოს ყველაზე უცნაური საზღვაო ადგილია** — ნახევრად აშენებული კურორტი, ნახევრად ცარიელი
    სანაპირო, სადაც ენგური ზღვას ხვდება. აქ ჩამოსული ადამიანი ან იმედგაცრუებული რჩება, ან იმ დაცლილ, ქარიან
    სივრცეს შეიყვარებს.


    სანაპირო თავად კარგია: მუქი, თითქმის შავი ქვიშა და წვრილი კენჭი, ბევრი კილომეტრის სიგრძეზე გაწელილი,
    თანდათანობითი ჩასვლით წყალში და თითქმის ყოველთვის ცარიელი. ურეკისგან განსხვავებით, აქ არც რიგია და
    არც მუსიკა. ტალღა უფრო ძლიერია და დინება შესართავთან საგრძნობი — პატარებთან ერთად სიფრთხილეა საჭირო.


    ის, რაც შორიდან ჩანს, 2011-2012 წლების პროექტია: ბულვარი, ამფითეატრი, ჰოტელები და ენგურზე გადებული
    ნახევარკილომეტრზე გრძელი საკიდი საფეხმავლო ხიდი, რომელიც იმ დროისთვის ევროპაში ერთ-ერთ ყველაზე გრძელად
    მიიჩნეოდა. 2012 წლის შემდეგ პროექტმა ტემპი დაკარგა; შენობების ნაწილი დაუმთავრებელი ან დაკეტილია, ბეტონი
    კი ზღვის მარილისგან იშლება. რამდენიმე წელი აქ ზაფხულის ელექტრონული მუსიკის ფესტივალი იმართებოდა და
    მერე ისიც შეწყდა.


    მეორე ამბავი ღრმაწყლოვანი პორტია. მისი მშენებლობა 2016 წელს დაიწყო, 2020 წელს კონტრაქტი გაუქმდა, 2024
    წელს კი პროექტს ახალი კონსორციუმი დაუბრუნდა. შედეგად სოფელში სამშენებლო ტექნიკა და მუშათა ტრანსპორტი
    დადის — ეს არ არის მშვიდი, გაყინული ადგილი.


    ანაკლიის სახელს ბევრად უფრო ძველი ისტორია აქვს, ვიდრე ბულვარს. XVII საუკუნეში აქ ერთ-ერთი ის ნავსადგური
    იყო, საიდანაც სამეგრელოს მთავრები ტყვეებს ოსმალეთში ჰყიდდნენ; ეს ამბავი ახალ სანაპირო ხეივანზე არსად
    წერია. ქვიშის მუქი ფერიც შემთხვევითი არაა — ენგური მთებიდან ვულკანური წარმოშობის ნატანს ეზიდება და
    სწორედ ის ლაგდება აქ.


    შესართავი ფრინველებისთვისაც კარგი ადგილია: შემოდგომაზე მდინარის პირას წყალმცურავები და თოლიები გროვდებიან,
    ზოგჯერ იშვიათი სახეობებიც. ბინოკლით სიარული აქ ისეთივე გამართლებულია, როგორც ბანაობა.


    ჩრდილოეთით, ენგურის მეორე ნაპირს იქით, აფხაზეთის დე-ფაქტო საზღვარია. ანაკლია ბოლო დასახლებაა გზაზე.
    სანაპიროზე სიარული უსაფრთხოა, მაგრამ ჩრდილოეთით მდინარის შესართავის იქით გადასვლა არ შეიძლება და არც
    უნდა სცადო.


    ისტორიულად ანაკლიაში ოსმალურ-სამეგრელოს ციხე იდგა, რომელიც ლევან II დადიანის დროს გაძლიერდა. მიწის
    ზემოთ მისგან თითქმის არაფერი დარჩა, თუმცა სოფლისა და შესართავის მიდამოები არქეოლოგიური ფენებით არის
    სავსე და დროდადრო აქ გათხრებიც მიმდინარეობს.
  tip: >-
    სამი საათი ან ერთი ზაფხულის დღე — ისე, როგორც გინდა. სექტემბრის შემდეგ თითქმის ყველაფერი იკეტება:
    ერთი-ორი კაფე თუ იმუშავებს, ამიტომ წყალი და საჭმელი ზუგდიდიდან წაიღე. ჩრდილი მხოლოდ ბულვარის ხეებთანაა.
    ხიდზე გასეირნება უფასოა და ღირს, განსაკუთრებით მზის ჩასვლისას. ქარი ხშირად ძლიერია — ქვიშა ზოგჯერ
    სახეში გირტყამს. საშხაპე და გამოსაცვლელი ჯიხურები ყველგან არაა, ამიტომ წინასწარ დაგეგმე. მოკლე სეზონის
    გარეთ მაშველი არ დგას, ხოლო შესართავთან დინება სერიოზულია — ღრმად შესვლა არ ღირს.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით, ზუგდიდიდან კი ანაკლიის შესახვევი დასავლეთით
    — სულ დაახლოებით 365 კმ და ხუთი საათ ნახევარი. ალტერნატიულად შეგიძლია ხობიდან პირდაპირ ჩრდილო-დასავლეთით
    წახვიდე. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, ბოლო მონაკვეთი ბრტყელი და სწორია, თუმცა სამშენებლო
    სატვირთოებია. პარკირება ბულვართან და ხიდთან უფასოა, თუმცა უასფალტო. საწვავი ზუგდიდში აიღე — ანაკლიაში
    სადგური ყოველთვის არ მუშაობს. ეკონომ-კლასის ავტომობილი მთელი მარშრუტისთვის სავსებით საკმარისია.
en:
  name: Anaklia
  short: >-
    A wide black-sand beach at the mouth of the Enguri — quiet, half-abandoned and the strangest seaside
    place in Georgia.
  body: >-
    **Anaklia is the oddest stretch of coast in Georgia:** half a built resort, half an empty shore, at
    the point where the Enguri meets the sea. People either leave disappointed or fall for the emptiness
    and the wind.


    The beach itself is good. Dark, almost black sand and fine shingle run for kilometres, the slope into
    the water is gentle, and it is nearly always empty. Unlike Ureki there are no rows of umbrellas and
    no music. The surf is stronger than further south and the current near the river mouth is real, so
    small children need watching.


    What you see from a distance is the building programme of 2011 and 2012: a boulevard, an amphitheatre,
    hotels, and a suspension footbridge over the Enguri more than half a kilometre long, at the time reckoned
    among the longest in Europe. After 2012 the project lost its momentum. Some buildings were never finished,
    others are shut, and the concrete is spalling in the salt air. For a few summers a large electronic
    music festival was held here; that stopped too.


    The other story is the deep-sea port. Construction began in 2016, the contract was cancelled in 2020,
    and in 2024 the project was handed to a new consortium. The practical effect is that heavy plant and
    worker traffic move through the village. This is not the frozen ghost town some accounts describe.


    The name is far older than the boulevard. In the seventeenth century this was one of the harbours
    through which Mingrelian rulers sold captives into the Ottoman slave trade, a part of the coast's
    history that the new promenade does not mention. The dark colour of the sand is not accidental either:
    the Enguri carries down volcanic sediment from the mountains and drops it here.


    The estuary is also good for birds. In autumn ducks, gulls and waders gather along the last bend of
    the river, and scarcer species turn up regularly. Binoculars earn their place here as much as a swimming
    towel.


    North of the river is the de facto boundary with Abkhazia, and Anaklia is the last settlement on the
    road. Walking the beach is fine, but you cannot go north beyond the river mouth and should not try.


    Historically an Ottoman and Mingrelian fort stood here, strengthened under Levan II Dadiani. Almost
    nothing of it survives above ground, though the ground around the village and the estuary is thick
    with archaeology.
  tip: >-
    Three hours, or a whole summer day if you swim. After September almost everything closes; one or two
    cafés may open, so bring water and food from Zugdidi. Shade exists only under the boulevard trees.
    Walking the bridge is free and worth doing, best at sunset. The wind is often strong and the sand
    can sting. Showers and changing huts are not everywhere, so plan accordingly. There are no lifeguards
    outside the short high season, and the current by the estuary deserves respect.
  route: >-
    From Tbilisi take the E60 to Senaki, continue towards Zugdidi, and turn west for Anaklia — about 365
    km in all, five and a half hours. You can also cut across north-west from Khobi, which is slightly
    shorter but slower. The road is asphalt the whole way and in good condition; the final stretch is
    flat and straight, though you will share it with construction lorries serving the port. Parking by
    the boulevard and the bridge is free and unpaved. Refuel in Zugdidi. An economy car is entirely sufficient.
ru:
  name: Анаклия
  short: >-
    Широкий пляж чёрного песка в устье Ингури — тихий, наполовину заброшенный и самый странный приморский
    посёлок Грузии.
  body: >-
    **Анаклия — самый необычный отрезок побережья Грузии:** наполовину построенный курорт, наполовину
    пустой берег там, где Ингури впадает в море. Отсюда либо уезжают разочарованными, либо влюбляются
    в эту пустоту и ветер.


    Сам пляж хорош. Тёмный, почти чёрный песок и мелкая галька тянутся километрами, вход в воду пологий,
    людей почти нет. В отличие от Уреки здесь нет ни рядов зонтов, ни музыки. Прибой сильнее, чем южнее,
    а течение у устья реки вполне ощутимо, так что за маленькими детьми нужно следить.


    То, что видно издалека, — программа застройки 2011 и 2012 годов: бульвар, амфитеатр, гостиницы и подвесной
    пешеходный мост через Ингури длиной больше полукилометра, который тогда считали одним из самых длинных
    в Европе. После 2012 года проект потерял темп. Часть зданий так и не достроили, другие закрыты, бетон
    крошится от солёного воздуха. Несколько лет здесь проводили большой фестиваль электронной музыки,
    но и он прекратился.


    Вторая история — глубоководный порт. Строительство началось в 2016 году, контракт расторгли в 2020-м,
    а в 2024-м проект передали новому консорциуму. На практике это значит, что через посёлок идёт тяжёлая
    техника и транспорт рабочих. Это не застывший город-призрак, каким его иногда описывают.


    Само название куда старше бульвара. В XVII веке это была одна из гаваней, через которые мегрельские
    владетели продавали пленников в османскую работорговлю, — об этой части истории побережья новая набережная
    не упоминает. Тёмный цвет песка тоже не случаен: Ингури несёт с гор вулканические наносы и оставляет
    их здесь.


    Устье хорошо и для птиц. Осенью на последнем изгибе реки собираются утки, чайки и кулики, регулярно
    появляются редкие виды. Бинокль здесь оправдывает себя не хуже полотенца.


    К северу за рекой проходит фактическая граница с Абхазией, и Анаклия — последний населённый пункт
    на дороге. Гулять по пляжу можно спокойно, но севернее устья хода нет, и пробовать не стоит.


    Исторически здесь стояла османско-мегрельская крепость, укреплённая при Леване II Дадиани. Над землёй
    от неё почти ничего не осталось, зато почва вокруг посёлка и лимана насыщена археологией.
  tip: >-
    Три часа, а если купаетесь — целый летний день. После сентября закрывается почти всё: работать может
    одно-два кафе, поэтому воду и еду везите из Зугдиди. Тень есть только под деревьями бульвара. Прогулка
    по мосту бесплатна и стоит того, лучше всего на закате. Ветер часто сильный, песок может больно сечь.
    Душевых и кабинок для переодевания хватает не везде, планируйте заранее. Спасателей вне короткого
    сезона нет, а течение у лимана требует уважения.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше в сторону Зугдиди, а от Зугдиди поворот на запад к Анаклии — всего
    около 365 км, пять с половиной часов. Можно срезать северо-западнее от Хоби: чуть короче, но медленнее.
    Дорога асфальтированная на всём протяжении и в хорошем состоянии; последний участок ровный и прямой,
    но по нему идут строительные грузовики, обслуживающие порт. Парковка у бульвара и моста бесплатная,
    без покрытия. Заправляйтесь в Зугдиди. Машины эконом-класса вполне достаточно.
fa:
  name: آناکلیا
  short: ساحل پهن ماسهٔ سیاه در مصب رود اینگوری — آرام، نیمه‌رهاشده و غریب‌ترین نقطهٔ دریایی گرجستان.
  body: >-
    **آناکلیا عجیب‌ترین بخش ساحل گرجستان است:** نیمی تفرجگاهی ساخته‌شده و نیمی کرانه‌ای خالی، درست جایی
    که اینگوری به دریا می‌ریزد. آدم‌ها یا سرخورده از اینجا می‌روند یا دلبستهٔ همین خلوت و باد می‌شوند.


    خودِ ساحل خوب است. ماسهٔ تیره و تقریباً سیاه و ریگ ریز کیلومترها ادامه دارد، شیب ورود به آب ملایم
    است و تقریباً همیشه خلوت. برخلاف اورکی اینجا نه صف چترهاست و نه موسیقی. موج از جنوب قوی‌تر است و جریان
    آب نزدیک مصب جدی است، پس باید حواستان به کودکان باشد.


    آنچه از دور دیده می‌شود حاصل برنامهٔ ساخت‌وساز سال‌های ۲۰۱۱ و ۲۰۱۲ است: بلوار، آمفی‌تئاتر، هتل‌ها
    و پل معلق پیادهٔ روی اینگوری به درازای بیش از نیم کیلومتر که آن روزها یکی از بلندترین‌های اروپا شمرده
    می‌شد. پس از ۲۰۱۲ کار از نفس افتاد. برخی ساختمان‌ها هرگز تمام نشدند، برخی بسته‌اند و بتن در هوای شور
    پوسته می‌اندازد. چند تابستان اینجا جشنوارهٔ بزرگ موسیقی الکترونیک برگزار شد و آن هم متوقف شد.


    داستان دوم بندر آب‌های عمیق است. ساخت آن در ۲۰۱۶ آغاز شد، قرارداد در ۲۰۲۰ لغو شد و در ۲۰۲۴ پروژه به
    کنسرسیومی تازه واگذار شد. اثر عملی‌اش این است که ماشین‌آلات سنگین و رفت‌وآمد کارگران از میان روستا
    می‌گذرد. اینجا آن شهر ارواح یخ‌زده‌ای نیست که گاهی وصف می‌شود.


    نام این جا بسیار کهن‌تر از بلوار است. در سدهٔ هفدهم یکی از بندرهایی بود که فرمانروایان مینگرلیا از
    آن اسیران را به بردگی عثمانی می‌فروختند؛ بخشی از تاریخ این ساحل که گردشگاه تازه به آن اشاره‌ای ندارد.
    رنگ تیرهٔ ماسه هم تصادفی نیست: اینگوری رسوب آتشفشانی را از کوه‌ها می‌آورد و همین‌جا بر جا می‌گذارد.


    مصب برای پرنده‌نگری هم خوب است. در پاییز اردک و کاکایی و پرندگان کرانه‌زی در آخرین خم رود جمع می‌شوند
    و گونه‌های کمیاب هم پیدا می‌شوند. دوربین دوچشمی اینجا به اندازهٔ حولهٔ شنا به کار می‌آید.


    شمالِ رود مرز عملی با آبخازیا است و آناکلیا آخرین آبادی سر راه. قدم زدن روی ساحل بی‌اشکال است، اما
    از مصب به شمال راهی نیست و نباید کوشید.


    از نظر تاریخی اینجا دژی عثمانی و مینگرلی بود که در روزگار لوان دوم داديانی استوارتر شد. تقریباً چیزی
    از آن بالای زمین نمانده، هرچند خاک پیرامون روستا و مصب پر از لایه‌های باستانی است.
  tip: >-
    سه ساعت، و اگر شنا می‌کنید یک روز کامل تابستانی. پس از شهریور تقریباً همه چیز بسته می‌شود؛ شاید یکی
    دو کافه باز باشد، پس آب و خوراک را از زوگدیدی بیاورید. سایه فقط زیر درختان بلوار هست. گذر از پل رایگان
    است و می‌ارزد، بهترش هنگام غروب. باد اغلب تند است و ماسه می‌سوزاند. دوش و رختکن همه‌جا نیست، پس برنامه‌ریزی
    کنید. بیرون از فصل کوتاه، غریق‌نجات نیست و جریان نزدیک مصب احترام می‌خواهد.
  route: >-
    از تفلیس با E60 تا سناکی، سپس به سوی زوگدیدی و از زوگدیدی انشعاب غربی به آناکلیا — رویهم حدود ۳۶۵
    کیلومتر و پنج ساعت و نیم. می‌توان از خوبی هم به شمال غرب میان‌بر زد که کوتاه‌تر اما کندتر است. جاده
    تا انتها آسفالت و در وضعیت خوبی است؛ بخش پایانی صاف و مستقیم است، هرچند کامیون‌های ساختمانی بندر هم
    از آن می‌گذرند. پارک کردن کنار بلوار و پل رایگان و خاکی است. سوخت را در زوگدیدی بگیرید. خودروی اقتصادی
    کاملاً کافی است.
he:
  name: אנאקליה
  short: חוף רחב של חול שחור בשפך האינגורי — שקט, נטוש למחצה, והמקום החופי המוזר ביותר בגאורגיה.
  body: >-
    **אנאקליה היא מקטע החוף המשונה ביותר בגאורגיה:** חציה אתר נופש בנוי וחציה חוף ריק, בנקודה שבה האינגורי
    נפגש עם הים. אנשים או עוזבים מאוכזבים או מתאהבים בריקנות וברוח.


    החוף עצמו טוב. חול כהה, כמעט שחור, וחלוקים דקים נמשכים לאורך קילומטרים, השיפוע אל המים מתון, וכמעט
    תמיד אין בו איש. בניגוד לאורקי אין כאן שורות שמשיות ואין מוזיקה. הגלים חזקים יותר מאשר בדרום, והזרם
    ליד שפך הנהר ממשי, כך שצריך להשגיח על ילדים קטנים.


    מה שנראה מרחוק הוא תוכנית הבנייה של 2011 ו-2012: טיילת, אמפיתיאטרון, מלונות, וגשר הולכי רגל תלוי מעל
    האינגורי באורך של יותר מחצי קילומטר, שנחשב אז לאחד הארוכים באירופה. אחרי 2012 איבד הפרויקט תאוצה.
    חלק מהמבנים לא הושלמו מעולם, אחרים סגורים, והבטון מתקלף באוויר המלוח. במשך כמה קיצים נערך כאן פסטיבל
    מוזיקה אלקטרונית גדול, וגם הוא הופסק.


    הסיפור השני הוא נמל המים העמוקים. הבנייה החלה ב-2016, החוזה בוטל ב-2020, וב-2024 הועבר הפרויקט לקונסורציום
    חדש. התוצאה המעשית היא שציוד כבד ותנועת פועלים עוברים דרך הכפר. זו אינה עיר רפאים קפואה כפי שמתארים
    לפעמים.


    השם עתיק בהרבה מן הטיילת. במאה השבע-עשרה היה זה אחד הנמלים שדרכם מכרו שליטי מינגרליה שבויים לסחר העבדים
    העות׳מאני, פרק בתולדות החוף שהטיילת החדשה אינה מזכירה. גם צבעו הכהה של החול אינו מקרי: האינגורי סוחף
    מן ההרים משקעים וולקניים ומניח אותם כאן.


    השפך טוב גם לצפרות. בסתיו נאספים בעיקול האחרון של הנהר ברווזים, שחפים וחופמאים, ומינים נדירים מגיעים
    בקביעות. משקפת מצדיקה את מקומה כאן לא פחות ממגבת ים.


    מצפון לנהר עובר גבול השליטה בפועל עם אבחזיה, ואנאקליה היא היישוב האחרון בדרך. ההליכה על החוף בטוחה,
    אך צפונה משפך הנהר אין מעבר ואין לנסות.


    מבחינה היסטורית עמד כאן מבצר עות׳מאני-מינגרלי, שחוזק בימי לוואן השני דאדיאני. כמעט דבר ממנו לא שרד
    מעל פני הקרקע, אך האדמה סביב הכפר והשפך עשירה בשכבות ארכיאולוגיות.
  tip: >-
    שלוש שעות, ואם אתם רוחצים אז יום קיץ שלם. אחרי ספטמבר כמעט הכול נסגר; אולי בית קפה אחד או שניים יפעלו,
    לכן הביאו מים ואוכל מזוגדידי. צל יש רק תחת עצי הטיילת. המעבר על הגשר חינם ושווה, ובעיקר בשקיעה. הרוח
    לעיתים קרובות עזה והחול צורב. מקלחות ותאי הלבשה אינם בכל מקום, אז תכננו בהתאם. מחוץ לעונה הקצרה אין
    מצילים, והזרם ליד השפך מחייב זהירות.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לכיוון זוגדידי, ומזוגדידי פנייה מערבה לאנאקליה — כ-365 ק״מ בסך הכול,
    חמש שעות וחצי. אפשר גם לחתוך צפונה-מערבה מחובי, מסלול קצר מעט אך איטי יותר. הכביש סלול לכל אורכו ובמצב
    טוב; הקטע האחרון שטוח וישר, אם כי עוברות בו משאיות בנייה של הנמל. החניה ליד הטיילת והגשר חינם ולא
    סלולה. תדלקו בזוגדידי. רכב חסכוני מספיק לחלוטין.
ar:
  name: أناكليا
  short: شاطئ واسع من الرمل الأسود عند مصب نهر إنغوري — هادئ ونصف مهجور وأغرب موضع بحري في جورجيا.
  body: >-
    **أناكليا أغرب امتداد ساحلي في جورجيا:** نصفه منتجع مبني ونصفه شاطئ خالٍ، عند النقطة التي يلتقي فيها
    إنغوري بالبحر. والناس إما يغادرونها خائبين وإما يعشقون هذا الخلاء وهذه الريح.


    الشاطئ نفسه جيد. رمل داكن يكاد يكون أسود وحصى ناعم يمتدان كيلومترات، والانحدار إلى الماء لطيف، والمكان
    خالٍ في أغلب الأوقات. وعلى خلاف أوريكي لا صفوف مظلات هنا ولا موسيقى. الموج أقوى مما هو في الجنوب،
    والتيار قرب مصب النهر حقيقي، فالأطفال الصغار يحتاجون إلى مراقبة.


    ما يُرى من بعيد هو ثمرة برنامج البناء في عامي 2011 و2012: كورنيش ومدرج ومنشآت فندقية وجسر مشاة معلق
    فوق إنغوري يزيد طوله على نصف كيلومتر، وقد عُدّ حينها من أطول جسور المشاة في أوروبا. وبعد 2012 فقد
    المشروع زخمه. بعض المباني لم يكتمل قط، وبعضها مغلق، والخرسانة تتقشر في الهواء المالح. وأقيم هنا بضعة
    صيفيات مهرجان كبير للموسيقى الإلكترونية، ثم توقف هو الآخر.


    القصة الأخرى هي ميناء المياه العميقة. بدأ البناء عام 2016، وأُلغي العقد عام 2020، وفي 2024 أُسند المشروع
    إلى تحالف جديد. والأثر العملي أن المعدات الثقيلة وحركة العمال تمر عبر القرية. فهذه ليست مدينة أشباح
    متجمدة كما تُوصف أحياناً.


    الاسم أقدم بكثير من الكورنيش. ففي القرن السابع عشر كان هذا أحد المرافئ التي باع عبرها أمراء مينغريليا
    الأسرى في تجارة الرقيق العثمانية، وهو فصل من تاريخ الساحل لا تذكره الممشى الجديدة. ولون الرمل الداكن
    ليس صدفة أيضاً: فنهر إنغوري يحمل من الجبال رواسب بركانية ويتركها هنا.


    والمصب موضع جيد لمراقبة الطيور. ففي الخريف تجتمع عند آخر منعطف للنهر البط والنوارس وطيور الخوض، وتظهر
    أنواع نادرة بانتظام. والمنظار هنا لا يقل نفعاً عن منشفة السباحة.


    وإلى الشمال من النهر يمر خط الفصل الفعلي مع أبخازيا، وأناكليا آخر تجمع سكني على الطريق. المشي على
    الشاطئ آمن، لكن لا سبيل إلى الشمال بعد المصب ولا ينبغي محاولة ذلك.


    تاريخياً قام هنا حصن عثماني مينغريلي، عُزّز في عهد ليفان الثاني داديياني. ولم يبق منه فوق الأرض شيء
    يُذكر، غير أن تربة القرية والمصب غنية بالطبقات الأثرية.
  tip: >-
    ثلاث ساعات، أو يوم صيفي كامل إن كنت تسبح. بعد أيلول يغلق كل شيء تقريباً؛ قد يفتح مقهى أو اثنان، لذا
    احمل الماء والطعام من زوغديدي. الظل لا يوجد إلا تحت أشجار الكورنيش. عبور الجسر مجاني ويستحق، وأجمله
    عند الغروب. الريح كثيراً ما تشتد والرمل يلسع. الدشات وغرف تغيير الملابس ليست في كل مكان، فخطط لذلك.
    ولا يوجد منقذون خارج الموسم القصير، وتيار المصب يستوجب الحذر.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم باتجاه زوغديدي، ومن زوغديدي انعطف غرباً إلى أناكليا — نحو
    365 كم إجمالاً وخمس ساعات ونصف. ويمكن أيضاً الاختصار شمالاً غرباً من خوبي، وهو أقصر قليلاً لكنه أبطأ.
    الطريق معبّد بكامله وبحالة جيدة؛ والمقطع الأخير مستوٍ مستقيم، وإن شاركتك فيه شاحنات بناء الميناء.
    الوقوف قرب الكورنيش والجسر مجاني وغير معبّد. تزوّد بالوقود في زوغديدي. والسيارة الاقتصادية كافية تماماً.
