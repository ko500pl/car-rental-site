ka:
  name: შორაპნის ციხე
  short: >-
    სტრაბონის სარაპანა: ციხე ძირულისა და ყვირილას შესართავთან, სადაც მდინარის გზა მთავრდებოდა და ხმელეთის
    გზა იწყებოდა.
  body: >-
    **ორი ათასი წელია, ყველას, ვინც საქართველოს დასავლეთიდან აღმოსავლეთისკენ კვეთს, ამ გორის ძირში უწევს
    გავლა.** შორაპანი იქ დგას, სადაც ძირულა ყვირილას ერთვის — იმ დერეფნის დასავლეთ კარიბჭესთან, რომელიც
    ლიხის ქედზე გადადის და იმერეთს ქართლთან აკავშირებს. ქართველი მკვლევრების აზრით, აქ მთავრდებოდა სამდინარო
    გზა და იწყებოდა სახმელეთო, ქალაქი კი ამ მიმოსვლით ცხოვრობდა: ქარვასლებით, სამჭედლოებით, ბაზრით, სავარაუდოდ,
    ნავმისადგომითა და საბაჟოთიც.


    სტრაბონი ამ ადგილს სარაპანას უწოდებს და წერს, რომ ციხე იმდენად დიდი იყო, რომ ქალაქის მთელ მოსახლეობას
    იტევდა. VI საუკუნეში, ეგრისის დიდი ომის დროს, პროკოპი კესარიელი მას სარაპანისად მოიხსენიებს — მკაცრ,
    თითქმის მიუვალ ადგილზე მდგარ ციხედ, რომელიც ლაზებმა დიდი გაჭირვებით გაამაგრეს. ციხე ხელიდან ხელში
    გადადიოდა; 550 წლისთვის ნანგრევად იყო ქცეული და სპარსელმა სარდალმა მერმეროემ აღადგინა. გაცილებით გვიან,
    1730 წელს, შორაპანი ოსმალებმა დაიკავეს, 1770 წელს კი იმერეთის მეფე სოლომონ I-მა დაიბრუნა. ბერძნული
    მითიც აქ ატარებს არგონავტებს — სარაპანისის გავლით, კოლხეთის სიღრმისკენ.


    კედლები წიგნივით იკითხება. უხეშად გათლილი კვადრების რიგებს აგურის ხუთრიგიანი სარტყელი ენაცვლება —
    VI საუკუნის რომაულ-ბიზანტიური ხელწერა, — ზემოთ კი გვიანდელი, რიყის ქვის წყობა ადევს. დასავლეთ კედლიდან
    სამოციოდე მეტრის სიგრძის გვირაბი ყვირილას ნაპირზე მდგარ ოთხკუთხა კოშკამდე ჩადიოდა; დღეს ის ცუდადაა
    შემონახული. თხემზე მოზრდილი მრგვალი კოშკი დგას, მის გვერდით კი — ახალი პატარა სამლოცველო და ანძა ქართული
    დროშით.


    ქვემოთ რკინიგზა და მაგისტრალი დღესაც იმავე ვიწრო ყელში ეტევა, საიდანაც ოდესღაც ქარავნები გადიოდნენ.
    შორაპანს სილამაზე არასოდეს სჭირდებოდა. მას მხოლოდ ზუსტად აქ დგომა სჭირდებოდა.
  tip: >-
    ორმოცდახუთი წუთიდან ერთ საათამდე საკმარისია. სოფლიდან ზემოთ არამარკირებული, ბალახიანი ბილიკი ადის;
    ზაფხულში ბალახი წელამდეა და ტკიპაც გვხვდება, ამიტომ გრძელი შარვალი და დახურული ფეხსაცმელი ჩაიცვით.
    წვიმის შემდეგ ბილიკი სრიალებს. ბილეთის სალარო და საინფორმაციო დაფა არ არის. კედლებზე ნუ ახვალთ — ძველი
    დუღაბი იფშვნება. საწვავი, კაფე და ტუალეტი ზესტაფონშია, ოთხ კილომეტრზე ნაკლებ მანძილზე; იქაურ მხარეთმცოდნეობის
    მუზეუმში ციხის გათხრებისას ნაპოვნი ნივთები ინახება. ზაფხულში დილაადრიან ადით, სანამ ხეობას სიცხე ჩაეწოლება.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთისკენ, გორსა და ხაშურზე გავლით, რიკოთის მონაკვეთს გადალახავთ და ძირულის
    ხეობაში ჩაეშვებით — სულ დაახლოებით 180 კმ, ორი საათი და ოცდათხუთმეტი წუთი. მაგისტრალიდან შორაპანთან
    გადაუხვიეთ, ზესტაფონამდე რამდენიმე კილომეტრით ადრე; ციხის გორა სოფელს პირდაპირ თავზე ადგას. ბოლო რამდენიმე
    ასეული მეტრი ვიწრო, ხრეშიანი ქუჩაა — მანქანა სოფელში დატოვეთ და ფეხით ადით. საწვავი ხაშურსა და ზესტაფონში.
    ეკონომ-კლასის ნებისმიერი მანქანა მთელი წლის განმავლობაში გამოგადგებათ.
en:
  name: Shorapani Fortress
  short: >-
    Strabo’s Sarapana: a hilltop fort over the Dzirula–Kvirila confluence, where the river road ended
    and the land road began.
  body: >-
    **For two thousand years, anyone crossing Georgia from west to east has had to pass beneath this hill.**
    Shorapani stands where the Dzirula meets the Kvirila, at the western gate of the corridor that climbs
    over the Likhi range to link Imereti with Kartli. Georgian scholars see it as the point where river
    navigation ended and the overland road began, and the town lived on that traffic: caravanserais, smithies,
    a market, most likely a landing stage and a customs post.


    Strabo knew it as Sarapana, a fortress so large it could shelter a whole town’s population. In the
    6th century, during the great war for Lazica, Procopius called it Sarapanis: a harsh, almost inaccessible
    place that the Lazi had fortified with great difficulty. It changed hands again and again; by 550
    it lay in ruins, and the Persian general Mermeroes rebuilt it. Much later the Ottomans seized it in
    1730, and King Solomon I of Imereti won it back in 1770. Greek myth, for good measure, sends the Argonauts
    past Sarapanis on their way inland.


    The walls can be read like a book. Rough-cut blocks alternate with five-course bands of brick, the
    Roman and Byzantine habit of the 6th century, and higher up comes later rebuilding in river cobbles.
    A tunnel, now poorly preserved, once ran sixty metres from the west wall down to a square tower on
    the bank of the Kvirila. On the summit today stand a stout round tower and, beside it, a small modern
    chapel and a flagpole flying the Georgian flag.


    Below, the railway and the highway still squeeze through the same narrow gap the caravans used. Shorapani
    never needed to be beautiful. It only needed to be exactly here.
  tip: >-
    Allow forty-five minutes to an hour. The way up from the village is an unmarked grassy path, waist-high
    in summer, when ticks are about, so wear long trousers and closed shoes; it turns slick after rain.
    There is no ticket desk or information board. Stay off the wall-tops, as the old mortar crumbles.
    Zestaponi, under four kilometres away, has fuel, cafés and toilets, and its local museum keeps the
    finds from the fortress excavations. In summer go early, before the heat settles into the valley.
  route: >-
    Take the E60 (S1) west from Tbilisi through Gori and Khashuri, over the Rikoti section and down the
    Dzirula valley: about 180 km, two hours thirty-five. Leave the highway at Shorapani, a few kilometres
    short of Zestaponi; the fortress hill rises directly above the village. The last few hundred metres
    are a narrow gravel street, so park in the village and walk up. Fuel in Khashuri or Zestaponi. Any
    economy car will do, all year round.
ru:
  name: Крепость Шорапани
  short: >-
    Сарапана Страбона: крепость на холме над слиянием Дзирулы и Квирилы, где речной путь кончался и начинался
    сухопутный.
  body: >-
    **Две тысячи лет всякий, кто пересекал Грузию с запада на восток, должен был пройти под этим холмом.**
    Шорапани стоит там, где Дзирула впадает в Квирилу, у западных ворот коридора, что поднимается через
    Лихский хребет и связывает Имерети с Картли. Грузинские учёные считают это место точкой, где кончалось
    речное судоходство и начиналась сухопутная дорога, и город жил этим движением: караван-сараи, кузницы,
    рынок, скорее всего пристань и таможенный пост.


    Страбон знал его как Сарапану — крепость столь обширную, что она могла укрыть население целого города.
    В VI веке, во время великой войны за Лазику, Прокопий Кесарийский называл его Сарапанис: суровое,
    почти неприступное место, которое лазы укрепили с великим трудом. Крепость переходила из рук в руки
    снова и снова; к 550 году она лежала в руинах, и персидский полководец Мермерой отстроил её заново.
    Много позже, в 1730 году, её захватили османы, а в 1770 году царь Имерети Соломон I вернул её себе.
    Греческий миф, не упуская случая, отправляет аргонавтов мимо Сарапаниса на пути вглубь страны.


    Стены здесь читаются как книга. Грубо тёсаные блоки чередуются с пятирядными полосами кирпича — римско-византийская
    манера VI века, — а выше — более поздняя кладка из речного булыжника. Туннель, ныне плохо сохранившийся,
    некогда тянулся на шестьдесят метров от западной стены вниз к квадратной башне на берегу Квирилы.
    На вершине сегодня стоит массивная круглая башня, а рядом с ней — небольшая современная часовня и
    флагшток с грузинским флагом.


    Внизу железная дорога и шоссе всё так же протискиваются через тот же узкий проход, которым пользовались
    караваны. Шорапани никогда не требовалось быть красивым. Ему нужно было лишь стоять именно здесь.
  tip: >-
    Отведите на осмотр от сорока пяти минут до часа. Путь наверх из деревни — неразмеченная травяная тропа,
    летом трава по пояс, а с ней и клещи, так что наденьте длинные брюки и закрытую обувь; после дождя
    тропа становится скользкой. Кассы и информационного щита здесь нет. Не ходите по верху стен — старый
    раствор крошится. В Зестафони, менее чем в четырёх километрах отсюда, есть заправка, кафе и туалеты,
    а в местном музее хранятся находки из раскопок крепости. Летом приезжайте рано, до того как жара осядет
    в долине.
  route: >-
    Двигайтесь по трассе E60 (S1) на запад от Тбилиси через Гори и Хашури, через Рикотский перевал и вниз
    по долине Дзирулы: около 180 км, два часа тридцать пять минут. Сверните с шоссе у Шорапани, за несколько
    километров до Зестафони; крепостной холм поднимается прямо над деревней. Последние несколько сотен
    метров — узкая гравийная улица, так что оставьте машину в деревне и идите пешком. Заправляйтесь в
    Хашури или Зестафони. Подойдёт любой автомобиль эконом-класса, в любое время года.
fa:
  name: دژ شوراپانی
  short: >-
    ساراپانای استرابون: دژی بر تپه‌ای مشرف بر محل تلاقی دزیرولا و کویریلا، جایی که راه رودی به پایان می‌رسید
    و راه خشکی آغاز می‌شد.
  body: >-
    **برای دو هزار سال، هر که می‌خواست گرجستان را از غرب به شرق بپیماید، ناگزیر از زیر این تپه می‌گذشت.**
    شوراپانی در جایی ایستاده که دزیرولا به کویریلا می‌پیوندد، بر دروازه غربی راهروی که از فراز رشته‌کوه
    لیخی بالا می‌رود و ایمرتی را به کارتلی پیوند می‌دهد. پژوهشگران گرجی این‌جا را نقطه‌ای می‌دانند که
    کشتیرانی رودخانه‌ای به پایان می‌رسید و راه خشکی آغاز می‌شد، و شهر از این آمدورفت زندگی می‌کرد: کاروانسراها،
    آهنگری‌ها، بازاری، و به‌احتمال زیاد اسکله‌ای و ایستگاه گمرکی.


    استرابون آن را ساراپانا می‌نامید، دژی چنان بزرگ که می‌توانست مردم یک شهر کامل را در خود جای دهد. در
    سده ششم، در جنگ بزرگ بر سر لازیکا، پروکوپیوس آن را ساراپانیس نامید: جایی سخت و تقریباً دست‌نایافتنی
    که مردم لاز به دشواری بسیار مستحکم کرده بودند. دژ بارها دست به دست شد؛ تا سال ۵۵۰ به ویرانه‌ای بدل
    شده بود و سردار ایرانی مرمروئس آن را بازساخت. مدت‌ها بعد، عثمانی‌ها در سال ۱۷۳۰ آن را تصرف کردند،
    و شاه سولومون یکم ایمرتی در سال ۱۷۷۰ آن را بازپس گرفت. اسطوره یونانی نیز، برای تکمیل داستان، آرگوناوت‌ها
    را در راه خود به درون سرزمین از کنار ساراپانیس می‌گذراند.


    دیوارهای آن چون کتابی خوانده می‌شوند. بلوک‌های خام‌تراش با نوارهایی از پنج ردیف آجر یک در میان چیده
    شده‌اند، شیوه رومی-بیزانسی سده ششم، و بالاتر بازسازی‌ای دیرتر با سنگ‌های گردشده رودخانه‌ای می‌آید.
    تونلی که امروز چندان سالم نمانده، زمانی شصت متر از دیوار غربی تا برجی چهارگوش بر کنار کویریلا کشیده
    می‌شد. امروز بر فراز تپه برجی گرد و ستبر ایستاده، و در کنارش نمازخانه‌ای کوچک و نوساز و میله‌ای با
    پرچم گرجستان.


    در پایین، خط راه‌آهن و بزرگ‌راه هنوز از همان گذرگاه تنگی می‌گذرند که کاروان‌ها می‌گذشتند. شوراپانی
    هرگز نیازی به زیبایی نداشت. تنها می‌بایست دقیقاً همین‌جا می‌بود.
  tip: >-
    چهل‌وپنج دقیقه تا یک ساعت زمان بگذارید. راه بالا از روستا، مسیری علفی و بدون نشانه است، در تابستان
    علف تا کمر می‌رسد و کنه هم پیدا می‌شود، پس شلوار بلند و کفش بسته بپوشید؛ پس از باران لیز می‌شود. باجه
    بلیت یا تابلوی اطلاعات وجود ندارد. روی دیوارها راه نروید، چون ملاط کهنه فرومی‌ریزد. زستافونی، کمتر
    از چهار کیلومتر آن‌سوتر، سوخت، کافه و سرویس بهداشتی دارد، و موزه محلی آن یافته‌های کاوش دژ را نگاه
    می‌دارد. در تابستان زود بروید، پیش از آن‌که گرما در دره بنشیند.
  route: >-
    از تفلیس بر جاده E60 (S1) به سوی غرب حرکت کنید، از گوری و خاشوری بگذرید، از گذرگاه ریکوتی عبور کنید
    و به دره دزیرولا فرود آیید: حدود ۱۸۰ کیلومتر، دو ساعت و سی‌وپنج دقیقه. چند کیلومتر پیش از زستافونی،
    در شوراپانی از بزرگ‌راه خارج شوید؛ تپه دژ درست بر فراز روستا بالا می‌آید. چند صد متر پایانی خیابانی
    باریک و شنی است، پس خودرو را در روستا بگذارید و پیاده بالا بروید. در خاشوری یا زستافونی سوخت‌گیری
    کنید. هر خودروی اقتصادی در تمام سال کافی است.
he:
  name: מבצר שוראפני
  short: >-
    סאראפנה של סטראבון: מצודה על גבעה מעל מפגש נהרות דזירולה וקווירילה, במקום שבו הסתיימה דרך הנהר והתחילה
    דרך היבשה.
  body: >-
    **במשך אלפיים שנה, כל מי שחצה את גאורגיה ממערב למזרח נאלץ לעבור מתחת לגבעה הזו.** שוראפני עומדת במקום
    שבו נהר דזירולה נפגש עם קווירילה, בשער המערבי של המעבר העולה על רכס ליחי ומקשר את אימרתי לקרתלי. חוקרים
    גאורגים רואים בה את הנקודה שבה הסתיים השיט בנהר והתחילה דרך היבשה, והעיר התקיימה מהתנועה הזו: פונדקי
    שיירות, נפחיות, שוק, וכנראה גם מעגן ותחנת מכס.


    סטראבון הכיר אותה כסאראפנה, מצודה גדולה כל־כך שיכלה להכיל את כל תושבי עיר שלמה. במאה השישית, בעת המלחמה
    הגדולה על לאזיקה, פרוקופיוס קרא לה סאראפניס: מקום קשה שכמעט אי אפשר להגיע אליו, שבני לאז ביצרו בעמל
    רב. היא עברה מיד ליד שוב ושוב; עד שנת 550 כבר הייתה חרבה, והמפקד הפרסי מרמרוס בנה אותה מחדש. הרבה
    יותר מאוחר, ב-1730, לכדו אותה העות'מאנים, וב-1770 השיב אותה המלך סולומון הראשון של אימרתי. אף המיתולוגיה
    היוונית, למען השלמת התמונה, שולחת את הארגונאוטים לעבור בסביבות סאראפניס בדרכם פנימה.


    את החומות אפשר לקרוא כספר. גושי אבן מסותתים בגסות מתחלפים ברצועות של חמישה נדבכי לבנים, מנהג רומי-ביזנטי
    מהמאה השישית, ומעליהם בנייה מאוחרת יותר של אבני נחל. מנהרה, שכיום שרידיה דלים, נמתחה בעבר שישים מטר
    מהחומה המערבית עד מגדל מרובע על גדת קווירילה. על הפסגה עומד כיום מגדל עגול ומוצק, ולצדו קפלה קטנה
    וחדשה ותורן ועליו דגל גאורגיה.


    מתחת, מסילת הרכבת והכביש הראשי עדיין נדחקים באותו מעבר צר שבו נהגו השיירות לעבור. שוראפני לא נזקקה
    מעולם ליופי. היא רק הייתה צריכה לעמוד בדיוק כאן.
  tip: >-
    הקדישו ארבעים וחמש דקות עד שעה. הדרך מהכפר היא שביל דשא לא מסומן, שבקיץ מגיע לגובה המותניים ויש בו
    קרציות, לכן לבשו מכנסיים ארוכים ונעליים סגורות; הוא הופך חלקלק אחרי גשם. אין קופה או שלט מידע. אל
    תעלו על ראש החומות, שכן הטיט הישן מתפורר. זסטפוני, במרחק של פחות מארבעה קילומטרים, מציעה תדלוק, בתי
    קפה ושירותים, והמוזיאון המקומי שלה משמר את הממצאים מחפירות המצודה. בקיץ צאו מוקדם, לפני שהחום משתקע
    בעמק.
  route: >-
    נסעו בכביש E60 (S1) מטביליסי מערבה, דרך גורי וחשורי, דרך מקטע ריקותי ומטה אל עמק דזירולה: כ-180 ק"מ,
    שעתיים ושלושים וחמש דקות. צאו מהכביש הראשי בשוראפני, כמה קילומטרים לפני זסטפוני; גבעת המצודה מתנשאת
    ישר מעל הכפר. כמה מאות המטרים האחרונים הם רחוב חצץ צר, לכן השאירו את הרכב בכפר וטפסו ברגל. תדלקו בחשורי
    או בזסטפוני. כל רכב אקונומי מתאים, בכל עונות השנה.
ar:
  name: قلعة شوراباني
  short: 'سارابانا عند سترابون: حصن على تلة تعلو ملتقى نهري دزيرولا وكفيريلا، حيث انتهى الطريق النهري
    وبدأ الطريق البري.'
  body: >-
    **على مدى ألفي عام، كان على كل من يعبر جورجيا من الغرب إلى الشرق أن يمرّ تحت هذه التلة.** تقف شوراباني
    حيث يلتقي نهر دزيرولا بنهر كفيريلا، عند البوابة الغربية للممر الذي يصعد فوق سلسلة جبال ليخي ليصل إيميريتي
    بكارتلي. يرى الباحثون الجورجيون فيها النقطة التي انتهت عندها الملاحة النهرية وبدأ عندها الطريق البري،
    وقد عاشت المدينة على هذه الحركة: خانات للقوافل، وورش حدادة، وسوق، وعلى الأرجح رصيف مرسى ونقطة جمارك.


    عرفها سترابون باسم سارابانا، حصنًا كبيرًا إلى حدّ أنه كان يتّسع لسكان مدينة بأكملها. وفي القرن السادس،
    أثناء الحرب الكبرى على لازيقا، سمّاها بروكوبيوس سارابانيس: مكانًا قاسيًا يكاد يتعذّر الوصول إليه،
    حصّنه اللاز بجهد عظيم. وتناوبت عليها أيدٍ كثيرة؛ وبحلول عام 550 كانت قد صارت أثرًا خربًا، فأعاد القائد
    الفارسي مرمروس بناءها. وبعد ذلك بزمن طويل، استولى عليها العثمانيون عام 1730، واستردّها الملك سولومون
    الأول ملك إيميريتي عام 1770. وحتى الأسطورة اليونانية، إتمامًا للحكاية، تجعل بحّارة الأرغو يمرّون قرب
    سارابانيس في طريقهم إلى الداخل.


    يمكن قراءة أسوارها كصفحات كتاب. تتعاقب فيها الكتل المشذّبة بخشونة مع أشرطة من خمسة صفوف من الآجر،
    وهي عادة رومانية-بيزنطية من القرن السادس، ثم يأتي أعلاها بناء أحدث من حصى النهر. وكان نفقٌ، سيّئ الحفظ
    اليوم، يمتد ستين مترًا من السور الغربي نزولًا إلى برج مربّع على ضفة كفيريلا. ويقف على القمة اليوم
    برج مستدير متين، وإلى جانبه كنيسة صغيرة حديثة وسارية ترفرف عليها الراية الجورجية.


    وفي الأسفل، لا يزال خط السكة الحديد والطريق السريع يمرّان عبر ذلك الممر الضيق نفسه الذي استعملته القوافل.
    لم تكن شوراباني بحاجة أبدًا إلى أن تكون جميلة. كل ما احتاجته هو أن تكون هنا، بالضبط.
  tip: >-
    خصّص من خمس وأربعين دقيقة إلى ساعة. الطريق الصاعد من القرية ممرّ عشبي غير موسوم، يبلغ ارتفاع عشبه
    الخصر في الصيف حين تنتشر القُراد، فارتدِ بنطالًا طويلًا وحذاءً مغلقًا؛ ويصبح زلقًا بعد المطر. لا يوجد
    شبّاك تذاكر أو لوحة معلومات. تجنّب المشي على قمم الأسوار، فالملاط القديم يتفتّت. وفي زيستافوني، على
    بُعد أقل من أربعة كيلومترات، وقود ومقاهٍ ومرافق صحية، ومتحفها المحلي يحفظ القطع المكتشفة في حفريات
    القلعة. في الصيف، اذهب باكرًا قبل أن تستقرّ الحرارة في الوادي.
  route: >-
    اتبع الطريق E60 (S1) غربًا من تبليسي عبر غوري وخاشوري، وفوق مقطع ريكوتي ونزولًا في وادي دزيرولا: نحو
    180 كم، أي ساعتان و35 دقيقة. غادر الطريق السريع عند شوراباني، على مسافة قليلة قبل زيستافوني؛ فتلة
    الحصن ترتفع مباشرة فوق القرية. والمئات القليلة الأخيرة من الأمتار شارع حصوي ضيّق، فاترك السيارة في
    القرية وتابع سيرًا على الأقدام. تزوّد بالوقود في خاشوري أو زيستافوني. تكفي سيارة اقتصادية عادية على
    مدار السنة.
