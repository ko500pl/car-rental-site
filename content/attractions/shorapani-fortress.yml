ka:
  name: შორაპნის ციხე
  short: ანტიკური სარაპანისის ადგილას მდგარი ციხის ნაშთი, ძირულისა და ყვირილას შესართავთან.
  body: >-
    **შორაპანი იმ წერტილთაგანია, სადაც საქართველოს გეოგრაფია პოლიტიკად იქცევა.** დასახლება ძირულისა და
    ყვირილას შესართავთან, ზესტაფონის მუნიციპალიტეტშია და გავრცელებული ვერსიით ძვ. წ. III საუკუნით თარიღდება.


    მნიშვნელობა მდებარეობიდან მოდის. აქ იწყება ის დერეფანი, რომელიც ლიხის ქედს გადაივლის და დასავლეთ საქართველოს
    აღმოსავლეთთან აკავშირებს — ანუ კოლხეთს იბერიასთან. ვინც შორაპანს აკონტროლებდა, ის აკონტროლებდა გადასასვლელს.
    სწორედ ამიტომ ჩნდება ის ბერძნულ და რომაულ წყაროებში: სტრაბონი მას სარაპანას უწოდებს, პროკოპი კესარიელი
    კი — სარაპანისს და ძლიერ პოზიციად მოიხსენიებს იმ გზაზე, რომელიც კოლხეთიდან იბერიაში მიდიოდა.


    ადრეულ შუა საუკუნეებში შორაპანი არგვეთის ერისთავების რეზიდენცია იყო; ისტორიულ ტექსტებში „შორაპნის
    საერისთავოც“ გვხვდება. ბერძნულ მითოლოგიაში სარაპანისი არგონავტების მარშრუტთანაა დაკავშირებული — რიონისა
    და ყვირილას სისტემა სწორედ ის გზაა, რომლითაც ლეგენდის მიხედვით ხომალდი ქვეყნის სიღრმეში შედიოდა.


    რას ნახავ დღეს: გორაკზე ასული ქვის კედლების ფრაგმენტები, კოშკის ნაშთი და ბალახით დაფარული ტერასები.
    დღეს ხილული წყობა გაცილებით გვიანდელია, ვიდრე ანტიკური სიმაგრე — ის ადგილი კი, სადაც დგას, ორი ათასწლეულია
    გამოიყენება.


    გულწრფელად: ქვის თვალსაზრისით ეს მოკრძალებული ძეგლია და მას ორმოცდაათ წუთზე მეტს არ დაუთმობ. საინტერესოა
    კონტექსტში — ხედი შესართავზე, რკინიგზაზე და იმ ვიწრო ხეობაზე, რომელზეც ორი ათასი წელი გადიოდა ყველა,
    ვინც აღმოსავლეთიდან დასავლეთისკენ მიდიოდა.


    იმავე ლოგიკას თანამედროვე ფენაც აქვს. შორაპანზე გადის თბილისი-ბათუმის რკინიგზა, აქვეა ძველი მაგისტრალი,
    ხოლო რიკოთის ახალი ჩქაროსნული გზა თავისი გვირაბებით იმავე საქმეს რამდენიმე კილომეტრში აკეთებს. სამი
    სატრანსპორტო სისტემა, ორი ათასწლეულის სხვაობით, ერთსა და იმავე ვიწრო ღრიჭოში ეტევა — ეს ყველაზე ნათელი
    ახსნაა იმისა, თუ რატომ ამაგრებდნენ ამ სოფელს.
  tip: >-
    ორმოცდაათი წუთი საკმარისია. გორაკზე ასვლა ბალახიან, არამარკირებულ ბილიკს მოითხოვს — ზაფხულში ბალახი
    წელამდეა და ტკიპაა, ამიტომ გრძელი შარვალი და დახურული ფეხსაცმელი. კედლებზე ასვლა სახიფათოა: დუღაბი
    გამოფიტულია და კიდეები ჩამონგრეული. საინფორმაციო დაფა ან ბილეთის სალარო არ არსებობს. ტუალეტი, მაღაზია
    და კაფე ზესტაფონშია, ათი კილომეტრი დასავლეთით. წვიმის შემდეგ ბილიკი სრიალდება.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ გორსა და ხაშურზე გავლით, რიკოთის მონაკვეთის შემდეგ კი ძირულის ხეობაში
    ჩახვალ — სულ დაახლოებით 180 კმ და ორი საათი და ოცდათხუთმეტი წუთი. შორაპანი მაგისტრალის გვერდით, სოფლის
    შესასვლელთანაა; ციხისკენ მიმავალი ქუჩა ვიწროა და ბოლო რამდენიმე ასეული მეტრი ხრეშიანი. მანქანას სოფლის
    ქუჩაზე დატოვებ, შემდეგ ფეხით ახვალ. საწვავი ხაშურსა და ზესტაფონში აიღე.
en:
  name: Shorapani Fortress
  short: The ruins of a fortress on the site of ancient Sarapana, at the meeting of the Dzirula and the
    Kvirila.
  body: >-
    **Shorapani is one of the points where Georgian geography turns into politics.** The settlement stands
    at the confluence of the Dzirula and the Kvirila in Zestaponi municipality, and is generally dated
    back to the 3rd century BC.


    Its importance comes from where it is. This is where the corridor begins that crosses the Likhi ridge
    and links western Georgia to eastern — Colchis to Iberia. Whoever held Shorapani held the crossing.
    That is why it appears in classical sources: Strabo calls it Sarapana, and Procopius names it Sarapanis
    and describes it as a strong position on the road running from Colchis into Iberia.


    In the early medieval period Shorapani was the seat of the eristavis of Argveti, and the historical
    texts also speak of a Duchy of Shorapani. In Greek myth Sarapanis belongs to the route of the Argonauts:
    the Rioni and Kvirila system is the way by which, in the legend, the ship worked inland.


    What you find today: fragments of stone wall climbing a low hill, the stump of a tower and grassy
    terraces. The masonry now visible is a good deal later than the classical fort — but the ground it
    stands on has been in use for two thousand years.


    Honestly, as a monument of stone it is modest and you will not give it more than fifty minutes. It
    is interesting in context: the view over the confluence, the railway, and the narrow valley through
    which everyone travelling between east and west has passed for two millennia.


    The same logic has a modern layer. The Tbilisi–Batumi railway runs through Shorapani, the old highway
    does too, and the new Rikoti expressway with its tunnels does the same job a few kilometres away.
    Three transport systems, two thousand years apart, all squeeze through one gap in the hills — which
    is the clearest possible demonstration of why anyone bothered to fortify this village.
  tip: >-
    Fifty minutes is enough. Getting up the hill means an unmarked path through grass; in summer the grass
    is waist-high and there are ticks, so wear long trousers and closed shoes. Do not climb on the walls
    — the mortar is weathered and the edges are broken. There is no information board and no ticket desk.
    Toilets, shops and cafes are in Zestaponi, ten kilometres west. The path is slippery after rain.
  route: >-
    Take the E60 west from Tbilisi through Gori and Khashuri; after the Rikoti section the road drops
    into the Dzirula valley — about 180 km in all, two hours thirty-five. Shorapani sits beside the highway
    at the entrance to the village; the street towards the fortress is narrow and the last few hundred
    metres are gravel. Leave the car on the village street and walk up. Fuel is available in Khashuri
    and Zestaponi. An economy car is enough.
ru:
  name: Крепость Шорапани
  short: Руины крепости на месте античной Сарапаны, у слияния Дзирулы и Квирилы.
  body: >-
    **Шорапани — одна из точек, где грузинская география превращается в политику.** Поселение стоит у
    слияния Дзирулы и Квирилы в Зестафонском муниципалитете, и его основание обычно относят к III веку
    до н. э.


    Значение определяется положением. Здесь начинается коридор, пересекающий Лихский хребет и связывающий
    Западную Грузию с Восточной, то есть Колхиду с Иберией. Кто держал Шорапани, тот держал переход. Поэтому
    крепость попадает в античные источники: Страбон называет её Сарапаной, а Прокопий Кесарийский — Сарапанисом
    и описывает как сильную позицию на дороге из Колхиды в Иберию.


    В раннем средневековье Шорапани была резиденцией эриставов Аргвети, а исторические тексты говорят
    и о Шорапанском эриставстве. В греческой мифологии Сарапанис связан с маршрутом аргонавтов: система
    Риони и Квирилы — тот путь, которым, по легенде, корабль поднимался вглубь страны.


    Что здесь сегодня: фрагменты каменных стен, поднимающихся по невысокому холму, остаток башни и заросшие
    травой террасы. Видимая кладка заметно позднее античного укрепления, но само место используется две
    тысячи лет.


    Скажем прямо: как памятник камня это скромно, и больше пятидесяти минут вы здесь не проведёте. Интересен
    контекст — вид на слияние рек, железную дорогу и узкую долину, через которую два тысячелетия проходили
    все, кто ехал с востока на запад.


    У той же логики есть современный слой. Через Шорапани идёт железная дорога Тбилиси — Батуми, здесь
    же старая трасса, а новая скоростная дорога через Рикоти с её тоннелями делает то же самое в нескольких
    километрах отсюда. Три транспортные системы, разделённые двумя тысячелетиями, протискиваются через
    одну и ту же щель в горах — яснее объяснить, зачем укрепляли это село, невозможно.
  tip: >-
    Пятидесяти минут достаточно. Подъём на холм — по неразмеченной тропе в траве; летом трава по пояс
    и есть клещи, так что длинные брюки и закрытая обувь. На стены лезть не стоит: раствор выветрен, края
    обвалены. Ни информационного щита, ни кассы здесь нет. Туалет, магазины и кафе — в Зестафони, в десяти
    километрах западнее. После дождя тропа скользкая.
  route: >-
    Из Тбилиси по E60 на запад через Гори и Хашури; за участком Рикоти дорога спускается в ущелье Дзирулы
    — всего около 180 км, два часа тридцать пять минут. Шорапани стоит у самой трассы, при въезде в село;
    улица к крепости узкая, последние несколько сотен метров — гравий. Машину оставляют на сельской улице
    и поднимаются пешком. Заправки есть в Хашури и Зестафони. Машины эконом-класса достаточно.
fa:
  name: قلعهٔ شوراباني
  short: ویرانه‌های قلعه‌ای بر جای ساراپانای باستانی، در محل به‌هم‌پیوستن دزیرولا و کویریلا.
  body: >-
    **شوراباني یکی از نقطه‌هایی است که جغرافیای گرجستان در آن به سیاست بدل می‌شود.** آبادی در محل پیوستن
    دزیرولا و کویریلا در شهرستان زستافونی ایستاده و بنیادش را معمولاً به سدهٔ سوم پیش از میلاد می‌رسانند.


    اهمیتش از جای آن می‌آید. اینجا آغاز دالانی است که از یال لیخی می‌گذرد و غرب گرجستان را به شرق آن پیوند
    می‌دهد، یعنی کلخیس را به ایبریا. هرکه شوراباني را داشت، گذرگاه را داشت. به همین سبب در منابع کلاسیک
    پیدا می‌شود: استرابون آن را ساراپانا می‌خواند و پروکوپیوس ساراپانیس می‌نامد و آن را موضعی مستحکم بر
    راه کلخیس به ایبریا وصف می‌کند.


    در سده‌های میانهٔ آغازین شوراباني مقر فرمانروایان آرگوتی بود و متون تاریخی از «دوک‌نشین شوراباني»
    نیز سخن می‌گویند. در اسطورهٔ یونانی ساراپانیس به مسیر آرگونات‌ها تعلق دارد: سامانهٔ ریونی و کویریلا
    همان راهی است که بنا بر افسانه کشتی از آن به دل سرزمین رفت.


    آنچه امروز می‌یابید: پاره‌های دیوار سنگی که از تپه‌ای کوتاه بالا می‌رود، کندهٔ یک برج و تراس‌های پوشیده
    از علف. بنایی که اکنون دیده می‌شود بسیار متأخرتر از دژ کلاسیک است، اما زمینی که بر آن ایستاده دو هزار
    سال در استفاده بوده است.


    صادقانه بگوییم: به‌عنوان اثری سنگی متواضع است و بیش از پنجاه دقیقه وقتتان را نمی‌گیرد. جذابیتش در
    زمینه است: منظرهٔ محل پیوستن رودها، راه‌آهن، و درهٔ باریکی که دو هزاره هرکس میان شرق و غرب سفر کرده
    از آن گذشته است.


    همین منطق لایه‌ای امروزی هم دارد. راه‌آهن تفلیس‑باتومی از شوراباني می‌گذرد، بزرگراه قدیم هم همین‌جاست،
    و آزادراه تازهٔ ریکوتی با تونل‌هایش همان کار را چند کیلومتر آن‌سوتر انجام می‌دهد. سه سامانهٔ حمل‌ونقل
    با دو هزار سال فاصله، همه از یک شکاف در تپه‌ها فشرده می‌گذرند — و این روشن‌ترین توضیح ممکن برای اینکه
    چرا کسی زحمت استحکام این روستا را به خود داد.
  tip: >-
    پنجاه دقیقه کافی است. بالا رفتن از تپه مسیری بی‌علامت در علف می‌طلبد؛ تابستان علف تا کمر است و کنه
    هست، پس شلوار بلند و کفش بسته بپوشید. از دیوارها بالا نروید؛ ملاط فرسوده و لبه‌ها ریخته است. تابلوی
    اطلاعات و باجهٔ بلیت وجود ندارد. سرویس بهداشتی و مغازه و کافه در زستافونی، ده کیلومتر غربی‌ترند. پس
    از باران مسیر لغزنده است.
  route: >-
    از تفلیس بزرگراه E60 را به غرب و از گوری و خاشوری بگذرید؛ پس از مقطع ریکوتی جاده به درهٔ دزیرولا پایین
    می‌رود — روی‌هم حدود ۱۸۰ کیلومتر و دو ساعت و سی‌وپنج دقیقه. شوراباني کنار بزرگراه و در ورودی روستاست؛
    کوچهٔ رو به قلعه باریک است و چند صد متر آخر شنی. خودرو را در کوچهٔ روستا بگذارید و پیاده بالا بروید.
    سوخت در خاشوری و زستافونی موجود است. خودروی اقتصادی کافی است.
he:
  name: מבצר שוראפאני
  short: חורבות מבצר על מקומה של סאראפאנה העתיקה, במפגש הדזירולה והקווירילה.
  body: >-
    **שוראפאני היא אחת הנקודות שבהן הגיאוגרפיה הגאורגית הופכת לפוליטיקה.** היישוב עומד במפגש הדזירולה
    והקווירילה בנפת זסטפוני, וייסודו מתוארך בדרך כלל למאה ה-3 לפני הספירה.


    חשיבותו נובעת ממקומו. כאן מתחיל המסדרון החוצה את רכס ליחי ומחבר את מערב גאורגיה עם מזרחה — כלומר את
    קולכיס עם איבריה. מי שהחזיק בשוראפאני החזיק במעבר. לכן היא מופיעה במקורות הקלאסיים: סטרבון קורא לה
    סאראפאנה, ופרוקופיוס מכנה אותה סאראפאניס ומתאר עמדה חזקה על הדרך מקולכיס לאיבריה.


    בימי הביניים המוקדמים הייתה שוראפאני מושבם של שליטי ארגווטי, והמקורות ההיסטוריים מדברים גם על דוכסות
    שוראפאני. במיתולוגיה היוונית שייכת סאראפאניס למסלול הארגונאוטים: מערכת הריוני והקווירילה היא הדרך
    שבה, לפי האגדה, התקדמה הספינה אל תוך היבשת.


    מה מוצאים היום: שברי חומת אבן המטפסים על גבעה נמוכה, גדם מגדל וטרסות מכוסות עשב. הבנייה הנראית כיום
    מאוחרת בהרבה מן המצודה הקלאסית — אך הקרקע שעליה היא עומדת נמצאת בשימוש אלפיים שנה.


    בכנות, כמונומנט של אבן זה צנוע ולא תקדישו לו יותר מחמישים דקות. הוא מעניין בהקשר: הנוף אל מפגש הנהרות,
    מסילת הברזל, והעמק הצר שדרכו עברו במשך אלפיים שנה כל הנוסעים בין מזרח למערב.


    לאותו היגיון יש שכבה מודרנית. מסילת טביליסי–בטומי עוברת בשוראפאני, גם הכביש הישן, והאקספרסוויי החדש
    של ריקוטי על מנהרותיו עושה את אותה עבודה כמה קילומטרים משם. שלוש מערכות תחבורה, במרחק אלפיים שנה זו
    מזו, נדחקות דרך אותו מפתח בהרים — וזו ההדגמה הברורה ביותר לשאלה למה בכלל טרחו לבצר את הכפר הזה.
  tip: >-
    חמישים דקות מספיקות. העלייה לגבעה היא בשביל לא מסומן בתוך עשב; בקיץ העשב מגיע למותניים ויש קרציות,
    לכן מכנסיים ארוכים ונעליים סגורות. אל תטפסו על החומות — הטיט בלוי והשוליים שבורים. אין לוח הסבר ואין
    קופה. שירותים, חנויות ובתי קפה נמצאים בזסטפוני, עשרה ק״מ מערבה. אחרי גשם השביל חלקלק.
  route: >-
    מטביליסי בכביש E60 מערבה דרך גורי וחשורי; אחרי מקטע ריקוטי הכביש יורד אל עמק הדזירולה — כ-180 ק״מ
    בסך הכול, שעתיים ושלושים וחמש. שוראפאני יושבת ליד הכביש הראשי בכניסה לכפר; הרחוב אל המבצר צר ומאות
    המטרים האחרונים חצץ. משאירים את הרכב ברחוב הכפר ועולים ברגל. דלק יש בחשורי ובזסטפוני. רכב חסכוני מספיק.
ar:
  name: قلعة شوراباني
  short: أطلال قلعة على موقع سارابانا القديمة، عند التقاء نهري دزيرولا وكفيريلا.
  body: >-
    **شوراباني من النقاط التي تتحول فيها جغرافيا جورجيا إلى سياسة.** تقوم البلدة عند التقاء نهري دزيرولا
    وكفيريلا في بلدية زستافوني، ويُؤرَّخ تأسيسها عادةً إلى القرن الثالث قبل الميلاد.


    وتأتي أهميتها من موقعها. فهنا يبدأ الممر الذي يعبر حرف ليخي ويصل غرب جورجيا بشرقها، أي كولخيس بإيبيريا.
    ومن أمسك شوراباني أمسك المعبر. ولهذا ترد في المصادر الكلاسيكية: يسميها سترابون سارابانا، ويسميها بروكوبيوس
    سارابانيس ويصفها موقعاً منيعاً على الطريق الممتد من كولخيس إلى إيبيريا.


    وفي مطلع العصور الوسطى كانت شوراباني مقراً لأمراء أرغفيتي، وتتحدث النصوص التاريخية أيضاً عن دوقية
    شوراباني. وفي الأسطورة اليونانية تنتمي سارابانيس إلى مسار الأرغونوت: فمنظومة ريوني وكفيريلا هي الطريق
    التي صعدت عبرها السفينة، في الحكاية، إلى داخل البلاد.


    ما تجده اليوم: شظايا سور حجري يتسلق تلاً منخفضاً، وجذمور برج، ومصاطب يغطيها العشب. والبناء الظاهر
    الآن أحدث كثيراً من الحصن الكلاسيكي، لكن الأرض التي يقوم عليها مستعملة منذ ألفي عام.


    وبصراحة، هو أثر حجري متواضع ولن تمنحه أكثر من خمسين دقيقة. أهميته في سياقه: الإطلالة على ملتقى النهرين
    وسكة الحديد والوادي الضيق الذي مر به ألفي عام كل مسافر بين الشرق والغرب.


    لهذا المنطق طبقة حديثة أيضاً. فسكة حديد تبليسي–باتومي تمر بشوراباني، والطريق القديم كذلك، والطريق
    السريع الجديد في ريكوتي بأنفاقه يؤدي المهمة نفسها على بعد كيلومترات قليلة. ثلاث منظومات نقل تفصل بينها
    ألفا عام، تتزاحم كلها في الفجوة ذاتها بين التلال — وهذا أوضح برهان ممكن على سبب تحصين هذه القرية.
  tip: >-
    خمسون دقيقة تكفي. الصعود إلى التل يعني درباً غير مُعلَّم وسط العشب؛ وفي الصيف يبلغ العشب الخصر وتوجد
    قرادات، فالبس سروالاً طويلاً وحذاءً مغلقاً. لا تتسلق الأسوار، فالملاط متآكل والحواف مكسورة. ولا لوحة
    معلومات ولا شباك تذاكر. أما دورات المياه والمتاجر والمقاهي ففي زستافوني على بعد عشرة كيلومترات غرباً.
    والدرب زلق بعد المطر.
  route: >-
    من تبليسي على الطريق E60 غرباً عبر غوري وخاشوري؛ وبعد مقطع ريكوتي يهبط الطريق إلى وادي دزيرولا — نحو
    180 كم إجمالاً وساعتان وخمس وثلاثون دقيقة. تقع شوراباني إلى جانب الطريق السريع عند مدخل القرية؛ والشارع
    المؤدي إلى القلعة ضيق وآخر بضع مئات من الأمتار حصى. اترك السيارة في شارع القرية واصعد سيراً. الوقود
    متوفر في خاشوري وزستافوني. وتكفي سيارة اقتصادية.
