ka:
  name: ასას აღკვეთილი
  short: >-
    პატარა მყინვარები და ასას უკანასკნელი ქართული ხეობა ინგუშეთამდე: გზა არ მიდის, სალარო არ არის, მხოლოდ
    გრძელი ბილიკია გიდთან ერთად.
  body: >-
    **ასა საქართველოს იმ იშვიათ კუთხეთაგანია, სადაც მანქანა ვერ შევა: ბოლო ჯიპის გზა არხოტის სოფლებთან
    წყდება, მის იქით კი ყველაფერი ფეხით უნდა გაიაროთ.**


    აღკვეთილი 2014 წელს შეიქმნა და მას დაცული ტერიტორიების სააგენტო მართავს. იგი დუშეთის მუნიციპალიტეტის
    შორეულ ჩრდილოეთში, ისტორიულ ხევსურეთში მდებარეობს, 39,43 კვადრატულ კილომეტრს მოიცავს და მდინარე ასას
    ქართულ მონაკვეთს არხოტის სოფლების ქვემოთ და მის შენაკადს, ჩხოტუნს, იცავს. საზღვრებში რამდენიმე პატარა
    მყინვარია, მიზანი კი მარტივია: ამ მაღალმთიანეთის მცენარეთა და ცხოველთა სამყაროს შენახვა.


    გეოგრაფია აქ უჩვეულოა. ასა დიდი კავკასიონის ჩრდილოეთ კალთებზე იღებს სათავეს, ამიტომ მისი წყალი თბილისისკენ,
    სამხრეთით კი არ მიედინება, არამედ ჩრდილოეთით — საზღვრის გადაღმა, ინგუშეთში, სადაც სუნჟას უერთდება.
    ზემოთ, იმავე მდინარის ხეობაში, არხოტია, საქართველოს ერთ-ერთი ყველაზე მიყრუებული კუთხე: აქ ხალხი მხოლოდ
    ახიელსა და ამღაში ცხოვრობს, დაცლილ სოფლებს კი ძველი კოშკებისა და ციხე-სახლების ნანგრევები დაჰყურებს.


    ვიზიტორთა ცენტრი, მონიშნული ბილიკი ან კაფე აქ არ დაგხვდებათ. დაგხვდებათ ყინული, ღორღი, მდელო და მდინარე,
    რომელიც მთებს იქით, სხვა მხარეს მიედინება.


    არაფერს შევალამაზებთ: მოგზაურთა უმეტესობისთვის ასა რუკაზე დაწერილ სახელად დარჩება. მათთვის კი, ვინც
    გიდით, ნებართვითა და რამდენიმე თავისუფალი დღით მოვა, ეს ქვეყნის კიდეა — ამ სიტყვის პირდაპირი მნიშვნელობით.
  tip: >-
    ეს ლაშქრობაა და არა გაჩერება: ბარათზე მითითებული ვიზიტის სამი საათი მხოლოდ აღკვეთილის კიდემდე მისასვლელად
    გეყოფათ, ნამდვილ ვიზიტს კი რამდენიმე დღე სჭირდება. ტერიტორია რუსეთის მოსაზღვრე სასაზღვრო ზონაშია,
    ამიტომ წასვლამდე სასაზღვრო პოლიციაში ნებართვის საკითხი გაარკვიეთ და ადგილობრივ გიდთან ერთად იარეთ,
    რომელმაც ბილიკები იცის. ამღიდან აღკვეთილამდე მონიშნული ბილიკი არ არის და სანდო მანძილიც არსად გვიპოვია,
    ამიტომ ფეხით სავალი მონაკვეთი გიდთან ერთად დაგეგმეთ. წადით მხოლოდ ივნისიდან სექტემბრამდე: წლის დანარჩენ
    დროს თოვლი გზასაც კეტავს და ბილიკსაც. შესვლა უფასოა, მაგრამ არანაირი ინფრასტრუქტურა არ არსებობს: თან
    იქონიეთ საკვები, წყლის გასაწმენდი საშუალება, თბილი ტანსაცმელი და კარავი, მარშრუტი კი ქვემოთ ვინმეს
    დაუტოვეთ.
  route: >-
    თბილისიდან S3-ით ჩრდილოეთით ჟინვალამდე იარეთ, შემდეგ შ26-ით არაგვის ხეობას აჰყევით ბარისახოს გავლით
    და ციცაბო, ქვიან შესახვევზე როშკისკენ აუხვიეთ: სულ 119 კილომეტრი და დაახლოებით სამი საათი, ბოლო მონაკვეთზე
    კი მაღალი კლირენსის ჯიპი დაგჭირდებათ. როშკიდან სეზონური ჯიპის გზა უღელტეხილით არხოტის ხეობაში, ახიელამდე
    და ამღამდე გადადის — ეს მონაკვეთი ჯობია ადგილობრივმა მძღოლმა გაიაროს, — იქიდან კი ასას დინებას ფეხით
    მიჰყვებით აღკვეთილამდე. თავად ასაში გზა არ შედის. ავზი S3-ზე, ჟინვალის გადასახვევამდე შეავსეთ. იქირავეთ
    ნამდვილი გამავლობის ჯიპი კარგი საბურავებით; კროსოვერს როშკის აღმართზე გაუჭირდება.
en:
  name: Asa Managed Reserve
  short: >-
    Small glaciers and the Assa's last Georgian gorge before Ingushetia: no road, no ticket office, only
    a long guided walk in.
  body: >-
    **Asa is one of the rare Georgian landscapes no car can enter: the last jeep track stops at the Arkhoti
    villages, and everything beyond is on foot.**


    The reserve was created in 2014 and is run by the Agency of Protected Areas. It covers 39.43 km² in
    the far north of Dusheti Municipality, in historical Khevsureti, around the Georgian stretch of the
    Assa below the Arkhoti villages and its tributary, the Chkhotuni. Several small glaciers lie inside
    its boundary, and its purpose is plain: to protect the plants and animals of this high country.


    Geography makes it strange. The Assa rises on the northern slopes of the Greater Caucasus, so its
    water runs not south towards Tbilisi but north, across the border into Ingushetia, and on to join
    the Sunzha. Upstream lies the Arkhoti valley, the Assa's own Georgian valley and one of the most isolated
    corners of Georgia, where only Akhieli and Amgha are still lived in and the stones of old towers and
    castle-houses stand over emptied hamlets.


    There is no visitor centre here, no marked loop, no café. There is ice, scree, meadow, and a river
    heading the other way over the mountains.


    We will not dress it up. For most travellers Asa will remain a name on a map. For the few who come
    with a guide, a permit and several days to spare, it is the edge of the country in the most literal
    sense.
  tip: >-
    This is a trek, not a stop: the three-hour visit time on the card is only the minimum to reach the
    edge, and a real visit takes days. The reserve sits in a border zone beside Russia, so check permit
    requirements with the Border Police before you go and travel with a local guide who knows the paths.
    No waymarked trail runs from Amgha into the reserve and we found no reliable published distance, so
    plan the walk with your guide. Go only between June and September; snow shuts both road and trail
    the rest of the year. Entry is free, but there are no facilities at all: carry food, water treatment,
    a warm layer and a shelter, and leave your route with someone below.
  route: >-
    From Tbilisi take the S3 north to Zhinvali, then the Sh26 up the Aragvi valley through Barisakho and
    the steep, stony turn-off to Roshka: 119 km and about three hours, with a high-clearance 4x4 needed
    for the last stretch. From Roshka a seasonal jeep track crosses the pass into the Arkhoti valley to
    Akhieli and Amgha — best left to a local driver — and from there you continue on foot down the Assa
    into the reserve. No road enters Asa itself. Fill up on the S3 before the Zhinvali turn. Rent a genuine
    off-road 4x4 with good tyres; a crossover will struggle on the climb to Roshka.
ru:
  name: Заказник Аса
  short: >-
    Небольшие ледники и последнее грузинское ущелье Ассы перед Ингушетией: ни дороги, ни кассы — только
    долгий путь пешком с проводником.
  body: >-
    **Аса — один из редких грузинских пейзажей, куда не въедет ни одна машина: последняя колея для внедорожников
    обрывается у сёл Архоти, а всё, что дальше, — только пешком.**


    Заказник создан в 2014 году, им управляет Агентство охраняемых территорий. Он занимает 39,43 км² на
    крайнем севере Душетского муниципалитета, в исторической Хевсурети, вокруг грузинского участка Ассы
    ниже сёл Архоти и её притока Чхотуни. В его границах лежат несколько небольших ледников, а задача
    заказника проста: беречь растения и животных этого высокогорья.


    Странным это место делает география. Асса берёт начало на северных склонах Большого Кавказа, поэтому
    её вода бежит не на юг, к Тбилиси, а на север — через границу в Ингушетию, чтобы влиться в Сунжу.
    Выше по течению лежит долина Архоти — грузинская долина той же Ассы, один из самых отрезанных уголков
    Грузии: жилыми там остались лишь Ахиели и Амга, а над опустевшими хуторами стоят камни старых башен
    и домов-крепостей.


    Здесь нет визит-центра, нет размеченного кольцевого маршрута, нет кафе. Есть лёд, осыпи, луга и река,
    которая уходит за горы в другую сторону.


    Приукрашивать не станем. Для большинства путешественников Аса так и останется названием на карте.
    Для тех немногих, кто придёт сюда с проводником, пропуском и несколькими свободными днями, это край
    страны в самом буквальном смысле.
  tip: >-
    Это поход, а не остановка по пути: три часа на осмотр, указанные в карточке, — лишь минимум, чтобы
    добраться до границы заказника, а настоящее знакомство займёт несколько дней. Заказник лежит у самой
    границы с Россией, в пограничной зоне, поэтому заранее уточните в Пограничной полиции, нужен ли пропуск,
    и идите с местным проводником, который знает тропы. Размеченной тропы от Амги до заказника нет, и
    надёжных данных о расстоянии мы не нашли, так что пеший участок планируйте вместе с проводником. Отправляйтесь
    только с июня по сентябрь: в остальное время снег закрывает и дорогу, и тропу. Вход бесплатный, но
    инфраструктуры нет никакой: несите еду, средства для очистки воды, тёплую одежду и укрытие, а свой
    маршрут оставьте кому-нибудь внизу.
  route: >-
    Из Тбилиси по трассе S3 на север до Жинвали, затем по Sh26 вверх по долине Арагви через Барисахо и
    по крутому каменистому съезду к Рошке: 119 км и около трёх часов, на последнем участке нужен внедорожник
    с высоким клиренсом. От Рошки сезонная колея для внедорожников переваливает в долину Архоти, к Ахиели
    и Амге, — её лучше доверить местному водителю, — а оттуда вы идёте пешком вниз по Ассе в заказник.
    В саму Асу не ведёт ни одна дорога. Заправьтесь на S3 до поворота на Жинвали. Берите в прокат настоящий
    внедорожник 4x4 с хорошей резиной: кроссовер на подъёме к Рошке будет мучиться.
fa:
  name: قرقگاه آسا
  short: >-
    یخچال‌های کوچک و آخرین تنگهٔ گرجیِ رود آسا پیش از اینگوشتیا: نه جاده‌ای، نه باجهٔ بلیتی؛ فقط راهپیمایی
    طولانی با راهنما.
  body: >-
    **آسا از معدود چشم‌اندازهای گرجستان است که هیچ خودرویی به آن راه ندارد: آخرین راه خاکیِ خودروهای چهارچرخ‌محرک
    در روستاهای آرخوتی تمام می‌شود و هرچه پس از آن است، فقط پیاده در دسترس است.**


    این قرقگاه در سال ۲۰۱۴ تأسیس شد و زیر نظر آژانس مناطق حفاظت‌شده اداره می‌شود. مساحتش ۳۹٫۴۳ کیلومتر
    مربع است، در منتهی‌الیه شمال شهرداری دوشتی، در خوسورتیِ تاریخی، پیرامون بخش گرجیِ رود آسا در پایین‌دست
    روستاهای آرخوتی و شاخهٔ آن، چخوتونی. چند یخچال کوچک درون مرزهای آن قرار دارند و هدفش روشن است: حفاظت
    از گیاهان و جانوران این سرزمین مرتفع.


    جغرافیا این مکان را غریب می‌کند. آسا از دامنه‌های شمالی قفقاز بزرگ سرچشمه می‌گیرد، پس آبش نه به جنوب
    و سوی تفلیس، که به شمال می‌رود؛ از مرز می‌گذرد، وارد اینگوشتیا می‌شود و به رود سونژا می‌پیوندد. بالادست،
    درهٔ آرخوتی است، درهٔ گرجیِ همین رود آسا و یکی از دورافتاده‌ترین گوشه‌های گرجستان، جایی که فقط آخیِلی
    و اَمغا هنوز ساکن دارند و سنگ‌های برج‌ها و خانه‌قلعه‌های کهن بر فراز آبادی‌های خالی‌شده ایستاده‌اند.


    اینجا نه مرکز بازدیدکنندگان هست، نه مسیر حلقوی نشانه‌گذاری‌شده، نه کافه‌ای. یخ هست، سنگ‌ریزه‌زار هست،
    مرغزار هست، و رودی که از آن سوی کوه‌ها راه خود را می‌رود.


    اغراق نمی‌کنیم. برای بیشتر مسافران، آسا همچنان نامی روی نقشه خواهد ماند. برای آن معدود کسانی که با
    راهنما، مجوز و چند روز وقت آزاد می‌آیند، اینجا لبهٔ کشور است، به معنای واقعی کلمه.
  tip: >-
    اینجا مقصد کوه‌پیمایی است، نه توقفی کوتاه: سه ساعت زمان بازدید که روی کارت آمده فقط حداقل زمان برای
    رسیدن به حاشیهٔ قرقگاه است و بازدید واقعی چند روز طول می‌کشد. قرقگاه در منطقهٔ مرزی کنار روسیه قرار
    دارد، پس پیش از سفر دربارهٔ لزوم مجوز از پلیس مرزی بپرسید و با راهنمایی محلی که راه‌ها را می‌شناسد
    بروید. از اَمغا تا قرقگاه مسیر نشانه‌گذاری‌شده‌ای نیست و ما مسافت معتبری هم نیافتیم، پس بخش پیاده
    را با راهنمایتان برنامه‌ریزی کنید. فقط میان ژوئن و سپتامبر بروید؛ در باقی سال برف هم جاده و هم کوره‌راه
    را می‌بندد. ورود رایگان است، اما هیچ امکاناتی وجود ندارد: غذا، وسیلهٔ تصفیهٔ آب، لباس گرم و سرپناه
    همراه ببرید و مسیرتان را به کسی در پایین بسپارید.
  route: >-
    از تفلیس جادهٔ S3 را به سمت شمال تا ژینوالی بگیرید، سپس از جادهٔ Sh26 درهٔ آراگوی را از راه باریساخو
    بالا بروید و در انشعاب پرشیب و سنگلاخ به سوی روشکا بپیچید: روی‌هم ۱۱۹ کیلومتر و حدود سه ساعت، و برای
    تکهٔ پایانی خودروی چهارچرخ‌محرک با فاصلهٔ زیاد از زمین لازم است. از روشکا راهی فصلی برای خودروهای
    چهارچرخ‌محرک از گردنه می‌گذرد و به درهٔ آرخوتی، تا آخیِلی و اَمغا، می‌رسد که بهتر است آن را به رانندهٔ
    محلی بسپارید؛ از آنجا پیاده در امتداد رود آسا رو به پایین‌دست تا قرقگاه ادامه می‌دهید. هیچ جاده‌ای
    به خودِ آسا وارد نمی‌شود. پیش از انشعاب ژینوالی، روی S3 باک را پر کنید. یک خودروی آفرود چهارچرخ‌محرک
    واقعی با لاستیک‌های خوب کرایه کنید؛ کراس‌اوور در سربالایی روشکا به زحمت می‌افتد.
he:
  name: שמורת אסה
  short: 'קרחונים קטנים והערוץ הגאורגי האחרון של נהר אסה לפני אינגושטיה: אין כביש, אין קופה — רק הליכה
    ארוכה עם מדריך.'
  body: >-
    **אסה היא אחד הנופים הנדירים בגאורגיה שאף רכב אינו יכול להיכנס אליהם: דרך העפר האחרונה לרכבי שטח נגמרת
    בכפרי ארחוטי, וכל מה שמעבר לה — רק ברגל.**


    השמורה הוכרזה ב-2014 ומנוהלת בידי הסוכנות לשטחים מוגנים. היא משתרעת על 39.43 קמ"ר בקצה הצפוני של מוניציפליטת
    דושתי, בחבסורתי ההיסטורית, סביב קטע האסה הגאורגי שמתחת לכפרי ארחוטי ויובלו, הצ'חוטוני. כמה קרחונים
    קטנים נמצאים בתחומה, ומטרתה פשוטה: להגן על הצמחים ובעלי החיים של הארץ הגבוהה הזאת.


    הגיאוגרפיה היא שהופכת אותה למוזרה. האסה נובע במדרונות הצפוניים של הקווקז הגדול, ולכן מימיו אינם זורמים
    דרומה, לעבר טביליסי, אלא צפונה — מעבר לגבול, אל אינגושטיה, ומשם אל נהר הסונז'ה. במעלה הזרם שוכן עמק
    ארחוטי, העמק הגאורגי של האסה עצמו, אחת הפינות המבודדות ביותר בגאורגיה, שבה רק אחיאלי ואמע'ה עדיין
    מיושבים, ואבני מגדלים ובתי-מבצר עתיקים מתנשאות מעל כפרונים שהתרוקנו.


    אין כאן מרכז מבקרים, אין מסלול מעגלי מסומן, אין בית קפה. יש קרח, מדרונות חצץ, אחו, ונהר שזורם לצד
    השני של ההרים.


    לא נייפה את המציאות. לרוב המטיילים אסה תישאר שם על מפה. למעטים שמגיעים עם מדריך, היתר וכמה ימים פנויים,
    זה קצה המדינה במובן המילולי ביותר.
  tip: >-
    זה טרק, לא עצירה בדרך: שלוש שעות הביקור שמופיעות בכרטיס הן רק המינימום כדי להגיע לשולי השמורה, וביקור
    אמיתי נמשך כמה ימים. השמורה נמצאת באזור גבול לצד רוסיה, לכן בררו מראש במשטרת הגבולות אילו היתרים נדרשים,
    וצאו עם מדריך מקומי שמכיר את השבילים. מאמע'ה אל השמורה אין שביל מסומן, ולא מצאנו מרחק מפורסם ואמין,
    לכן תכננו את קטע ההליכה עם המדריך. צאו רק בין יוני לספטמבר; בשאר השנה השלג סוגר גם את הדרך וגם את
    השביל. הכניסה חינם, אבל אין שום מתקנים: קחו אוכל, אמצעי לטיהור מים, שכבת ביגוד חמה ומחסה, והשאירו
    את פרטי המסלול אצל מישהו למטה.
  route: >-
    מטביליסי סעו צפונה בכביש S3 עד ז'ינוואלי, ומשם בכביש Sh26 במעלה עמק האראגווי דרך בריסאחו ובפנייה התלולה
    והסלעית לרושקה: 119 ק"מ וכשלוש שעות, ובקטע האחרון נדרש רכב שטח עם הנעה כפולה ומרווח גחון גבוה. מרושקה
    חוצה דרך עפר עונתית לרכבי שטח את המעבר אל עמק ארחוטי, עד אחיאלי ואמע'ה – עדיף להשאיר אותה לנהג מקומי
    – ומשם ממשיכים ברגל במורד האסה אל השמורה. שום כביש אינו נכנס לאסה עצמה. תדלקו על ה-S3 לפני הפנייה
    לז'ינוואלי. שכרו רכב שטח אמיתי עם הנעה כפולה עם צמיגים טובים; רכב קרוסאובר יתקשה בעלייה לרושקה.
ar:
  name: محمية آسا
  short: >-
    أنهار جليدية صغيرة وآخر خانق جورجي لنهر آسا قبل إنغوشيا: لا طريق ولا شباك تذاكر، بل مسير طويل على
    الأقدام مع دليل.
  body: >-
    **آسا من المناظر الجورجية النادرة التي لا تدخلها أي سيارة: ينتهي آخر مسلك لسيارات الدفع الرباعي عند
    قرى أرخوتي، وكل ما بعده لا يُقطع إلا مشيًا.**


    أُنشئت المحمية عام 2014 وتديرها وكالة المناطق المحمية. تمتد على 39.43 كم² في أقصى شمال بلدية دوشيتي،
    في خيفسوريتي التاريخية، حول المجرى الجورجي لنهر آسا أسفل قرى أرخوتي ورافده تشخوتوني. وتقع داخل حدودها
    بضعة أنهار جليدية صغيرة، وغايتها واضحة: حماية نبات هذه البلاد المرتفعة وحيوانها.


    الجغرافيا هي ما يجعلها غريبة. ينبع نهر آسا من المنحدرات الشمالية للقوقاز الكبير، فلا تجري مياهه جنوبًا
    نحو تبليسي بل شمالًا، عابرةً الحدود إلى إنغوشيا لتلتقي بنهر سونجا. وفي أعلى المجرى يقع وادي أرخوتي،
    الوادي الجورجي لنهر آسا نفسه، وأحد أكثر أركان جورجيا عزلة، حيث لم يبقَ مأهولًا سوى أخييلي وأمغا، وتقف
    حجارة الأبراج القديمة والبيوت-القلاع فوق نجوع خلت من أهلها.


    لا مركز زوار هنا، ولا مسار دائري مُعلَّم، ولا مقهى. هناك جليد وركام صخري ومرج، ونهر يمضي إلى الجهة
    الأخرى من الجبال.


    لن نجمّل الأمر. عند أغلب المسافرين ستبقى آسا اسمًا على الخريطة. أما القلة الذين يأتون مع دليل وتصريح
    وأيام عدة من الوقت، فهي عندهم حافة البلاد بأدق معاني الكلمة.
  tip: >-
    هذه رحلة مشي طويلة لا وقفة عابرة: ساعات الزيارة الثلاث المذكورة في البطاقة ليست سوى الحد الأدنى لبلوغ
    أطراف المحمية، والزيارة الحقيقية تستغرق أيامًا. تقع المحمية في منطقة حدودية بجوار روسيا، فاستعلموا
    لدى شرطة الحدود عن التصاريح المطلوبة قبل الانطلاق، وسيروا مع دليل محلي يعرف الدروب. لا يوجد درب معلَّم
    من أمغا إلى المحمية، ولم نجد مسافة منشورة موثوقة، فخطّطوا لمقطع المشي مع دليلكم. لا تذهبوا إلا بين
    يونيو وسبتمبر؛ فالثلج يغلق الطريق والمسار في بقية السنة. الدخول مجاني، لكن لا مرافق على الإطلاق: احملوا
    الطعام ووسيلة لتنقية الماء وطبقة ملابس دافئة ومأوى، واتركوا خط سيركم لدى أحد في الأسفل.
  route: >-
    من تبليسي خذوا طريق S3 شمالًا حتى جينفالي، ثم طريق Sh26 صعودًا في وادي أراغفي مرورًا بباريساخو، ثم
    المنعطف الشديد الانحدار الكثير الحجارة نحو روشكا: 119 كم ونحو ثلاث ساعات، ويحتاج المقطع الأخير إلى
    سيارة دفع رباعي بخلوص أرضي عالٍ. ومن روشكا يعبر مسلك موسمي لسيارات الدفع الرباعي الممرَّ إلى وادي
    أرخوتي حتى أخييلي وأمغا، والأفضل أن تتركوه لسائق محلي، ومن هناك تكملون سيرًا على الأقدام مع مجرى نهر
    آسا نزولًا إلى المحمية. لا طريق يدخل آسا نفسها. املؤوا الخزان على S3 قبل منعطف جينفالي. استأجروا سيارة
    دفع رباعي حقيقية للطرق الوعرة بإطارات جيدة؛ فسيارة الكروس أوفر ستعاني في الصعود إلى روشكا.
