ka:
  name: ბოლნისის სიონი
  short: >-
    საქართველოში დღემდე მდგარი უძველესი ეკლესია ბოლნისთან: მისმა მშენებლებმა V საუკუნეში თარიღი ქართული
    ასოებით ქვაზე ამოკვეთეს.
  body: >-
    **ბოლნისის სიონი იმ იშვიათ ნაგებობათაგანია, რომელიც ასაკს თავად გეუბნებათ: მისმა მშენებლებმა თარიღი
    ქვაზე V საუკუნის 90-იან წლებში ამოკვეთეს.**


    ბაზილიკა ბოლნისისწყლის ხეობაში, სოფელ ქვემო ბოლნისში დგას, ქალაქ ბოლნისის სამხრეთით. მისი შენება 478–479
    წლებში დაიწყო და 493–494 წლებში დასრულდა: ეს საქართველოში დღემდე მდგარი უძველესი ეკლესიაა. ასომთავრული
    წარწერები, ქართული დამწერლობის უძველეს დათარიღებულ ნიმუშთა შორის, გვამცნობს, რომ ტაძრის შენება მეფე
    პეროზის მეფობის მეოცე წელს დაიწყეს და თხუთმეტი წლის შემდეგ დაასრულეს, და შეწყალებას შესთხოვს მის მაშენებელს,
    დავით ეპისკოპოსს. პეროზი სასანიანთა ირანის შაჰი იყო. ქართული ეკლესია სპარსი მეფის მეფობის წლებით რომ
    თარიღდება, თავადვე ცხადყოფს, სად იდგა მაშინ ეს ხეობა — ბიზანტიასა და ირანს შორის. კედელში დღეს წარწერის
    ასლია, რომელიც თავის ადგილას 1967–1969 წლების რესტავრაციისას ჩასვეს.


    ტაძარი გრძელი, დაბალი და მძიმეა. თლილი ტუფის კვადრები ფერს ცვლის: მკრთალი მომწვანოდან ჩალისფრამდე
    და ძლივს შესამჩნევ ვარდისფრამდე. დასავლეთის კარი, რომლითაც დღეს შედიხართ, მხოლოდ XVII საუკუნეში გაჭრეს.
    შიგნით ჯერ ბაზისებს დახედეთ, მერე სვეტისთავებს ახედეთ: ვაზის ლერწი, არაბესკები და მცენარეული სახეები
    სასანურ ხელოვნებასთან ნათესაობას ამჟღავნებს, მათ გვერდით კი ხარის თავი, ფრინველები და ცხოველებია —
    ქართულ ხუროთმოძღვრებაში პირველი რელიეფური გამოსახულებები, წარმართული სახეები, ახალმა სარწმუნოებამ
    რომ შეითვისა. ნაკვეთ ჯვრებს შორის ერთი, წრეში ჩასმული ბოლოებგაფართოებული ჯვარი „ბოლნური ჯვრის“ სახელითაა
    ცნობილი; დღევანდელი სახელმწიფო დროშის ოთხ მცირე ჯვარს ოფიციალურად „ბოლნურ-კაცხური“ ეწოდება.


    ხეობას გაცილებით ახალგაზრდა ამბავიც აქვს. 1818 წელს ახლომახლო 95-მა შვაბმა გერმანელმა ოჯახმა კოლონია
    დააარსა და ეკატერინენფელდი უწოდა. 1921 წელს საბჭოთა ხელისუფლებამ მას ლუქსემბურგი დაარქვა, 1941 წელს
    გერმანელთა უმეტესობა ციმბირსა და ყაზახეთში გადაასახლა, 1943 წლიდან კი ქალაქს ბოლნისი ჰქვია. ბოლნისის
    მუზეუმში ერთი დარბაზი სწორედ მათ ეძღვნება.


    ასლია თუ არა, ეს ის სიტყვებია, ქვისმთლელებმა რომ ამოკვეთეს, როცა თხუთმეტი საუკუნის წინ ხარაჩოები ჩამოხსნეს.
  tip: >-
    ბოლნისის სიონი მოქმედი ეკლესიაა: ქალებს თავსაბურავი და კაბა სჭირდებათ, მამაკაცებს — გრძელი შარვალი.
    საკუთარი შალი თან იქონიეთ და კართან დაწყობილ მოსასხამებს ნუ მიენდობით. შესვლა და მანქანის დაყენება
    უფასოა. ერთი საათი საკმარისია, ოღონდ მისი უმეტესი ნაწილი ახლოდან ცქერას დაუთმეთ: ნაკვეთი ბაზისები
    და სვეტისთავები მოთმინებას აჯილდოებს, მოღრუბლულ დღეს კი ტელეფონის ფანარიც გამოგადგებათ. იმავე გზაზე,
    ორი კილომეტრით მოშორებით, წუღრუღაშენია — ბუნებრივი მეორე გაჩერება. კაფე, ტუალეტი და ბანკომატი ქალაქ
    ბოლნისშია, დაახლოებით რვა კილომეტრით ჩრდილოეთით; იქვეა ბოლნისის მუზეუმიც, გერმანელი კოლონისტების დარბაზით.
  route: >-
    თბილისიდან სამხრეთით, ს6-ით — მარნეულის გზატკეცილით — გადით და მარნეულის გავლით ბოლნისამდე იარეთ.
    ქალაქის ცენტრში სიონის ქუჩაზე (შ154) სამხრეთით გადაუხვიეთ და დაახლოებით რვა კილომეტრი გაიარეთ სოფელ
    ქვემო ბოლნისამდე. სულ დაახლოებით 70 კმ-ია, საათი და ოცდახუთი წუთი, მთელ გზაზე ასფალტია, ასე რომ, ეკონომ
    კლასის მანქანა სავსებით საკმარისია. საწვავს მარნეულსა და ბოლნისში უპრობლემოდ იპოვით. ნავიგატორში თავად
    ტაძარი მიუთითეთ და არა ქალაქი ბოლნისი: ქალაქის ცენტრი ტაძრამდე რვა კილომეტრით ადრეა. 620 მეტრ სიმაღლეზე
    გზა მთელი ზამთარი ღიაა.
en:
  name: Bolnisi Sioni
  short: >-
    Georgia's oldest standing church, finished in 493–494 near Bolnisi, still carries the dated Georgian
    inscriptions its builders cut into the stone.
  body: >-
    **Bolnisi Sioni is one of the rare buildings that tells you its own age: its builders carved the dates
    into the stone in the 490s.**


    The basilica stands in the village of Kvemo Bolnisi, south of Bolnisi town. Begun in 478–479 and finished
    in 493–494, it is the oldest church still standing in Georgia. Its Asomtavruli inscriptions, among
    the earliest dated Georgian writing, record that work began in the twentieth year of King Peroz and
    ended fifteen years later, and they ask mercy for the builder, Bishop David. Peroz was the Sasanian
    shah of Persia; a Georgian church dated by an Iranian reign shows where this valley stood, between
    Byzantium and Iran. The stone in the wall today is a copy, set in place during the restoration of
    1967–69.


    Long, low and heavy, the church is built of tuff blocks shifting from pale green to straw-yellow and
    faint rose. The west door you walk through was cut only in the 17th century. Inside, look down at
    the column bases and up at the capitals: vine scrolls, arabesques and foliage of Sasanian ancestry,
    and beside them a bull's head, birds and beasts, the first relief sculpture in Georgian architecture,
    pagan images adopted by the new faith. Among the carved crosses is a flared one set in a circle, the
    Bolnisi cross; the four small crosses on today's national flag are officially described as being of
    the Bolnisi–Katskhuri type.


    The valley has a younger story too. In 1818 ninety-five Swabian German families founded a colony nearby,
    Katharinenfeld. The Soviets renamed it Luxemburg in 1921, deported most of its Germans to Siberia
    and Kazakhstan in 1941 and called it Bolnisi from 1943. A room in the town museum remembers them.


    Copy or not, these are the words the masons cut when the scaffolding came down fifteen centuries ago.
  tip: >-
    Bolnisi Sioni is a working church: women should cover their heads and wear a skirt, men long trousers.
    Carry a scarf of your own rather than relying on wraps at the door. Entry and parking are free. An
    hour is enough, but spend most of it close up: the carved bases and capitals reward patience, and
    a phone torch helps on a dull day. Tsughrughasheni, two kilometres further along the same road, is
    the natural second stop. Cafés, toilets and cash machines are in Bolnisi town, about eight kilometres
    north, and so is the Bolnisi Museum with its room on the German settlers.
  route: >-
    Leave Tbilisi heading south on the S6, the Marneuli highway, and stay on it through Marneuli to Bolnisi.
    In the town centre turn south onto Sioni Street, the Sh154, and follow it for about eight kilometres
    to the village of Kvemo Bolnisi. That makes about 70 km and an hour and twenty-five minutes, all of
    it on asphalt, so an economy car is all you need. Fuel is easy to find in Marneuli and Bolnisi. Set
    your navigator to the church itself, not to Bolnisi town: the centre is eight kilometres short. At
    620 metres the road stays open all winter.
ru:
  name: Болнисский Сион
  short: >-
    Старейшая сохранившаяся церковь Грузии, завершённая в 493–494 годах близ Болниси, до сих пор несёт
    датированные грузинские надписи, высеченные её строителями.
  body: >-
    **Болнисский Сион — одно из тех редких зданий, что сами называют свой возраст: строители высекли даты
    прямо в камне в 490-х годах.**


    Базилика стоит в селе Квемо-Болниси, к югу от города Болниси. Начатая в 478–479 и законченная в 493–494
    годах, она — старейшая из сохранившихся церквей Грузии. Её надписи асомтаврули, одни из самых ранних
    датированных образцов грузинского письма, сообщают, что работы начались в двадцатый год царя Пероза
    и завершились пятнадцать лет спустя, и просят милости для строителя, епископа Давида. Пероз был сасанидским
    шахом Персии: грузинская церковь, датированная годами иранского царствования, показывает, где стояла
    эта долина — между Византией и Ираном. Камень, который сегодня в стене, — копия, установленная во
    время реставрации 1967–69 годов.


    Длинная, низкая, тяжёлая, церковь сложена из туфовых блоков, переходящих от бледно-зелёного к соломенно-жёлтому
    и едва розовому. Западную дверь, через которую вы входите, прорубили лишь в XVII веке. Внутри посмотрите
    вниз, на базы колонн, и вверх, на капители: виноградная лоза, арабески и листва сасанидского происхождения,
    а рядом голова быка, птицы и звери — первая рельефная скульптура в грузинской архитектуре, языческие
    образы, принятые новой верой. Среди резных крестов есть расширяющийся к концам крест, вписанный в
    круг, — болнисский крест; четыре малых креста на нынешнем государственном флаге официально описаны
    как кресты болнисско-кацхурского типа.


    У долины есть и история помоложе. В 1818 году девяносто пять семей швабских немцев основали неподалёку
    колонию Екатериненфельд. В 1921 году советская власть переименовала её в Люксембург, в 1941-м депортировала
    большинство немцев в Сибирь и Казахстан, а с 1943-го город называется Болниси. Немецким колонистам
    посвящён зал в городском музее.


    Копия или нет, это те самые слова, которые каменщики высекли, когда пятнадцать веков назад сняли леса.
  tip: >-
    Болнисский Сион — действующий храм: женщинам следует покрыть голову и надеть юбку, мужчинам — длинные
    брюки. Возьмите собственный платок, не рассчитывая на накидки у входа. Вход и парковка бесплатные.
    Часа хватит, но проведите его вблизи: резные базы и капители вознаграждают терпение, а в пасмурный
    день пригодится фонарик телефона. Цугругашени, в двух километрах дальше по той же дороге, — естественная
    вторая остановка. Кафе, туалеты и банкоматы — в городе Болниси, примерно в восьми километрах к северу;
    там же Болнисский музей с залом о немецких поселенцах.
  route: >-
    Выезжайте из Тбилиси на юг по S6, Марнеульскому шоссе, и не сворачивайте с него через Марнеули до
    Болниси. В центре города поверните на юг, на улицу Сиони (Sh154), и следуйте по ней около восьми километров
    до села Квемо-Болниси. Всего около 70 км и час двадцать пять минут, всё по асфальту, так что машины
    эконом-класса вполне достаточно. Заправиться легко в Марнеули и Болниси. Ставьте в навигатор саму
    церковь, а не город Болниси: центр города остаётся в восьми километрах от церкви. Высота 620 метров,
    и дорога открыта всю зиму.
fa:
  name: سیونی بولنیسی
  short: >-
    کهن‌ترین کلیسای پابرجای گرجستان، ساخته‌شده در ۴۹۳–۴۹۴ نزدیک بولنیسی، هنوز کتیبه‌های تاریخ‌دار گرجی
    را که سازندگانش بر سنگ کندند بر خود دارد.
  body: >-
    **سیونی بولنیسی از معدود بناهایی است که سن خود را خودش می‌گوید: سازندگانش در دههٔ ۴۹۰ تاریخ‌ها را
    بر سنگ کندند.**


    این باسیلیکا در روستای کومو بولنیسی، در جنوب شهر بولنیسی، ایستاده است. ساختش در ۴۷۸–۴۷۹ آغاز و در
    ۴۹۳–۴۹۴ تمام شد و کهن‌ترین کلیسای برجای‌مانده در گرجستان است. کتیبه‌های آن به خط اسومتاورولی، از نخستین
    نمونه‌های تاریخ‌دار نوشتار گرجی، می‌گویند که کار در بیستمین سال پادشاهی پیروز آغاز شد و پانزده سال
    بعد پایان یافت، و برای سازنده، اسقف داوید، طلب رحمت می‌کنند. پیروز شاهنشاه ساسانی ایران بود؛ کلیسایی
    گرجی که با سال‌های سلطنت پادشاهی ایرانی تاریخ‌گذاری شده، نشان می‌دهد این دره کجا ایستاده بود: میان
    بیزانس و ایران. سنگی که امروز در دیوار است نسخه‌ای بدل است که در مرمت ۱۹۶۷–۱۹۶۹ در جایش نشانده شد.


    کلیسا کشیده، کوتاه‌قامت و سنگین است و از بلوک‌های توف ساخته شده که رنگشان از سبز کم‌رنگ به زرد کاهی
    و صورتی محو می‌گراید. در غربی‌ای که از آن وارد می‌شوید تنها در سدهٔ هفدهم گشوده شد. درون کلیسا به
    پایه‌های ستون‌ها نگاه کنید و سپس به سرستون‌ها: پیچک‌های تاک، اسلیمی‌ها و برگ‌آرایی‌هایی با تباری ساسانی،
    و در کنارشان سر گاوی، پرندگان و جانوران — نخستین پیکرتراشی برجسته در معماری گرجی، نقش‌های پیشامسیحی
    (مشرکانه) که ایمان تازه از آنِ خود کرد. در میان صلیب‌های کنده‌کاری‌شده صلیبی هست با بازوهای پهن‌شونده
    درون دایره، صلیب بولنیسی؛ چهار صلیب کوچک پرچم ملی امروز به‌طور رسمی از گونهٔ بولنیسی–کاتسخوری توصیف
    شده‌اند.


    دره داستانی جوان‌تر هم دارد. در ۱۸۱۸ نود و پنج خانوادهٔ آلمانی شوابی در نزدیکی این‌جا کوچ‌نشین کاتارینن‌فلد
    را بنیاد نهادند. شوروی در ۱۹۲۱ نامش را لوکزامبورگ گذاشت، در ۱۹۴۱ بیشتر آلمانی‌هایش را به سیبری و قزاقستان
    تبعید کرد و از ۱۹۴۳ آن را بولنیسی خواند. تالاری در موزهٔ شهر یادشان را نگه داشته است.


    نسخهٔ بدل باشد یا نه، این همان واژه‌هایی است که سنگتراشان پانزده سده پیش، هنگام برچیدن داربست، کندند.
  tip: >-
    سیونی بولنیسی کلیسایی فعال است: بانوان باید سر را بپوشانند و دامن بپوشند و آقایان شلوار بلند. به‌جای
    پوشش‌های دم در، روسری خودتان را بیاورید. ورود و پارکینگ رایگان است. یک ساعت کافی است، اما بیشترش را
    از نزدیک بگذرانید: پایه‌ها و سرستون‌های کنده‌کاری‌شده پاداش حوصله را می‌دهند و در روز ابری چراغ‌قوهٔ
    تلفن به کار می‌آید. تسوغروغاشنی، دو کیلومتر جلوتر در همین جاده، ایستگاه دوم طبیعی است. کافه، سرویس
    بهداشتی و خودپرداز در شهر بولنیسی است، حدود هشت کیلومتر به سوی شمال، و موزهٔ بولنیسی با تالارش دربارهٔ
    کوچ‌نشینان آلمانی نیز همان‌جاست.
  route: >-
    از تفلیس با S6، بزرگراه مارنئولی، به سوی جنوب بیرون بروید و از مارنئولی تا بولنیسی در آن بمانید. در
    مرکز شهر به جنوب، به خیابان سیونی (Sh154) بپیچید و حدود هشت کیلومتر تا روستای کومو بولنیسی آن را دنبال
    کنید. روی هم حدود ۷۰ کیلومتر و یک ساعت و بیست‌وپنج دقیقه، سراسر آسفالت، پس خودروی اقتصادی همهٔ آن
    چیزی است که لازم دارید. سوخت در مارنئولی و بولنیسی به‌آسانی پیدا می‌شود. مسیریاب را روی خود کلیسا
    تنظیم کنید، نه شهر بولنیسی: مرکز شهر هشت کیلومتر پیش از کلیسا است. در ارتفاع ۶۲۰ متری، جاده تمام زمستان
    باز است.
he:
  name: בולניסי סיוני
  short: >-
    הכנסייה העתיקה ביותר שעומדת בגאורגיה, שהושלמה ב-493–494 ליד בולניסי, עדיין נושאת את הכתובות הגאורגיות
    המתוארכות שבוניה חרטו באבן.
  body: >-
    **בולניסי סיוני היא מן המבנים הנדירים שמספרים לכם בעצמם את גילם: בוניה חקקו את התאריכים באבן בשנות
    ה-490.**


    הבזיליקה עומדת בכפר קבמו בולניסי, מדרום לעיירה בולניסי. היא החלה להיבנות ב-478–479 והושלמה ב-493–494,
    והיא הכנסייה העתיקה ביותר שעדיין עומדת בגאורגיה. כתובותיה בכתב אסומתאוורולי, מן הדוגמאות המתוארכות
    המוקדמות ביותר של כתב גאורגי, מספרות שהעבודה החלה בשנה העשרים למלך פרוז והסתיימה חמש עשרה שנה אחר
    כך, ומבקשות רחמים על הבונה, הבישוף דוד. פרוז היה השאה הסאסאני של פרס; כנסייה גאורגית שמתוארכת לפי
    שנות מלכותו של מלך איראני מראה היכן עמד העמק הזה — בין ביזנטיון לאיראן. האבן שבקיר כיום היא העתק,
    שהוצב במקומה בשיפוץ של 1967–1969.


    הכנסייה ארוכה, נמוכה וכבדה, בנויה מגושי טוף שגוונם עובר מירוק חיוור לצהוב-קש ולוורוד קלוש. הדלת המערבית
    שדרכה נכנסים נפרצה רק במאה ה-17. בפנים הביטו למטה, אל בסיסי העמודים, ולמעלה, אל הכותרות: סלסולי גפן,
    ערבסקות ועלווה ממוצא סאסאני, ולצדם ראש שור, ציפורים וחיות — התבליטים הראשונים באדריכלות הגאורגית,
    דימויים פגאניים שהאמונה החדשה אימצה. בין הצלבים המגולפים יש צלב שזרועותיו מתרחבות, נתון בתוך עיגול:
    צלב בולניסי. ארבעת הצלבים הקטנים שעל הדגל הלאומי של היום מתוארים באופן רשמי כצלבים מטיפוס בולניסי–קצחורי.


    לעמק יש גם סיפור צעיר יותר. ב-1818 ייסדו תשעים וחמש משפחות גרמנים שוואבים מושבה בסמוך, קתרינענפלד.
    הסובייטים שינו את שמה ללוקסמבורג ב-1921, גירשו את רוב הגרמנים שבה לסיביר ולקזחסטן ב-1941, ומ-1943
    היא נקראת בולניסי. במוזיאון העירוני יש אולם המוקדש לזכרם.


    העתק או לא, אלה הן המילים שהסתתים חרטו כשהפיגומים ירדו לפני חמש עשרה מאות שנה.
  tip: >-
    בולניסי סיוני היא כנסייה פעילה: נשים צריכות לכסות את ראשן וללבוש חצאית, וגברים מכנסיים ארוכים. הביאו
    צעיף משלכם ואל תסמכו על כיסויים בפתח. הכניסה והחניה חינם. שעה מספיקה, אבל בלו את רובה מקרוב: הבסיסים
    והכותרות המגולפים מתגמלים סבלנות, וביום מעונן פנס הטלפון עוזר. צוגרוגשני, שני קילומטרים הלאה באותה
    דרך, היא התחנה השנייה הטבעית. בתי קפה, שירותים וכספומטים יש בעיירה בולניסי, כשמונה קילומטרים צפונה,
    ושם גם מוזיאון בולניסי עם האולם על המתיישבים הגרמנים.
  route: >-
    צאו מטביליסי דרומה על כביש S6, כביש מרנאולי, והישארו עליו דרך מרנאולי עד בולניסי. במרכז העיירה פנו
    דרומה לרחוב סיוני (Sh154) והמשיכו בו כשמונה קילומטרים עד הכפר קבמו בולניסי. בסך הכול כ-70 ק"מ ושעה
    ועשרים וחמש דקות, כולם על אספלט, כך שרכב חסכוני הוא כל מה שצריך. קל למצוא דלק במרנאולי ובבולניסי.
    כוונו את הניווט לכנסייה עצמה, לא לעיירה בולניסי: מרכז העיירה נמצא כשמונה קילומטרים לפני הכנסייה. בגובה
    620 מטרים הדרך פתוחה כל החורף.
ar:
  name: بولنيسي سيوني
  short: >-
    أقدم كنيسة قائمة في جورجيا، اكتمل بناؤها في 493–494 قرب بولنيسي، وما زالت تحمل النقوش الجورجية المؤرَّخة
    التي حفرها البنّاؤون في الحجر.
  body: >-
    **بولنيسي سيوني من المباني النادرة التي تخبرك بعمرها بنفسها: فقد حفر بنّاؤوها التواريخ في الحجر في
    تسعينيات القرن الخامس.**


    تقوم البازيليكا في قرية كفيمو بولنيسي، جنوب بلدة بولنيسي. بدأ بناؤها في 478–479 واكتمل في 493–494،
    وهي أقدم كنيسة ما زالت قائمة في جورجيا. وتذكر نقوشها بخط الأسومتافرولي، وهي من أقدم نماذج الكتابة
    الجورجية المؤرَّخة، أن العمل بدأ في السنة العشرين من حكم الملك فيروز وانتهى بعد خمس عشرة سنة، وتطلب
    الرحمة للباني، الأسقف دافيد. كان فيروز شاه فارس الساساني؛ وكنيسة جورجية تؤرَّخ بسنوات حكم ملك إيراني
    تكشف أين كان هذا الوادي يقف: بين بيزنطة وإيران. أما الحجر الذي في الجدار اليوم فنسخة، ثُبّتت في مكانها
    أثناء ترميم 1967–1969.


    الكنيسة طويلة منخفضة ثقيلة، مبنية من كتل التوف التي يتدرّج لونها من الأخضر الشاحب إلى أصفر القش والوردي
    الخافت. والباب الغربي الذي تدخل منه لم يُفتح إلا في القرن السابع عشر. في الداخل انظر إلى الأسفل، إلى
    قواعد الأعمدة، ثم إلى الأعلى، إلى التيجان: لفائف الكرمة والأرابيسك وأوراق نباتية من أصل ساساني، وإلى
    جانبها رأس ثور وطيور وحيوانات، وهي أول نحت نافر في العمارة الجورجية، صور وثنية تبنّاها الإيمان الجديد.
    وبين الصلبان المنحوتة صليب متّسع الأطراف داخل دائرة، هو صليب بولنيسي؛ والصلبان الأربعة الصغيرة على
    العلم الوطني اليوم توصف رسمياً بأنها من طراز بولنيسي–كاتسخوري.


    وللوادي حكاية أحدث أيضاً. ففي عام 1818 أسّست خمس وتسعون عائلة من الألمان الشوابيين مستعمرة قريبة هي
    كاتارينينفيلد. وغيّر السوفييت اسمها إلى لوكسمبورغ عام 1921، ورحّلوا معظم ألمانها إلى سيبيريا وكازاخستان
    عام 1941، وأطلقوا عليها اسم بولنيسي منذ 1943. وتخلّد ذكراهم قاعة في متحف البلدة.


    نسخةً كانت أم لا، فهذه هي الكلمات نفسها التي حفرها البناؤون حين أُزيلت السقالات قبل خمسة عشر قرناً.
  tip: >-
    بولنيسي سيوني كنيسة عاملة تُقام فيها الصلوات: على النساء تغطية الرأس وارتداء تنورة، وعلى الرجال سراويل
    طويلة. احمل وشاحك الخاص بدل الاعتماد على الأغطية عند الباب. الدخول والوقوف مجانيان. تكفي ساعة، لكن
    أمضِ معظمها عن قرب: القواعد والتيجان المنحوتة تكافئ الصبر، ومصباح الهاتف مفيد في اليوم الغائم. وتسوغروغاشيني،
    على بعد كيلومترين في الطريق نفسه، هي المحطة الثانية الطبيعية. المقاهي ودورات المياه والصرافات الآلية
    في بلدة بولنيسي، على بعد نحو ثمانية كيلومترات شمالاً، وهناك أيضاً متحف بولنيسي بقاعته عن المستوطنين
    الألمان.
  route: >-
    غادر تبليسي جنوباً على الطريق S6، طريق مارنيولي السريع، وابقَ عليه عبر مارنيولي حتى بولنيسي. في وسط
    البلدة انعطف جنوباً إلى شارع سيوني (Sh154) واتبعه نحو ثمانية كيلومترات حتى قرية كفيمو بولنيسي. المجموع
    نحو 70 كم وساعة وخمس وعشرون دقيقة، كلها على الإسفلت، فلا تحتاج إلى أكثر من سيارة اقتصادية. الوقود
    سهل المنال في مارنيولي وبولنيسي. اضبط الملاحة على الكنيسة نفسها لا على بلدة بولنيسي: فوسط البلدة يقع
    قبلها بثمانية كيلومترات. وعلى ارتفاع 620 متراً يبقى الطريق مفتوحاً طوال الشتاء.
