ka:
  name: ბოლნისის სიონი
  short: V საუკუნის ბაზილიკა — საქართველოში შემორჩენილი უძველესი ეკლესია და ქართული წარწერების უადრესი
    ნიმუში.
  body: >-
    ბოლნისის სიონი 478–493 წლებში აშენდა და საქართველოს ტერიტორიაზე შემორჩენილი უძველესი მოქმედი ეკლესიაა.
    ეს არის სამნავიანი ბაზილიკა — არქიტექტურული ტიპი, რომელიც ჯერ კიდევ გუმბათოვან ხუროთმოძღვრებამდე იყო
    გავრცელებული — შედარებით დაბალი, გრძელი და მასიური, ლურჯ-მოყვითალო ტუფის ქვისგან ნაგები. სწორედ ეს
    სიმარტივე ტოვებს მთავარ შთაბეჭდილებას: შენობა თხუთმეტ საუკუნეს გაუძლო თითქმის უცვლელად.


    განსაკუთრებული მნიშვნელობა წარწერებს აქვს. ტაძრის კედლებზე შემორჩენილია ასომთავრულით შესრულებული ტექსტები,
    რომლებიც დაახლოებით 494 წლით თარიღდება — ეს ქართული დამწერლობის უძველეს დათარიღებულ ნიმუშთა შორისაა
    და მას საქართველოს ისტორიაში ისეთივე წონა აქვს, როგორიც თავად შენობას. აქვე გვხვდება „ბოლნისის ჯვარი“
    — ბოლოებგანიერი ჯვრის ფორმა, რომელიც შემდგომში ქართული სახელმწიფო სიმბოლიკის ნაწილი გახდა და დღეს
    ეროვნულ დროშაზეცაა.


    ინტერიერი მკაცრი და თითქმის მოურთავია: სვეტების რიგი, ვიწრო ფანჯრები და ქვის სუფთა ზედაპირი. კაპიტელებზე
    შემორჩენილია ხარების, ჯვრებისა და მცენარეული ორნამენტის რელიეფები — ადრექრისტიანული ხანის იშვიათი
    ნიმუშები. ტაძარი მოქმედია და აქტიური სამრევლოა. ტაძრის ჩრდილოეთით მოგვიანებით სამრეკლო აშენდა, ეზოში
    კი ძველი საფლავის ქვებია. ბოლნისი დღეს მრავალეთნიკური მუნიციპალიტეტია და სოფლებში ჯერ კიდევ ჩანს XIX
    საუკუნის გერმანელი კოლონისტების მიერ აშენებული სახლები.
  tip: >-
    ეკლესია მოქმედია, ამიტომ ჩაცმა მოკრძალებული უნდა იყოს: ქალებს კაბა და თავსაბურავი, მამაკაცებს გრძელი
    შარვალი; გასახვევები შესასვლელთანაა. ერთი საათი სავსებით საკმარისია, თუმცა წარწერების და კაპიტელების
    დათვალიერებას ცოტა მეტი დრო დაუთმეთ. მანქანა ეზოს წინ, უფასოდ დგება. კაფე, ბანკომატი და მაღაზიები
    ბოლნისის ცენტრშია, აქედან რამდენიმე კილომეტრში.
  route: >-
    თბილისიდან გადით მარნეულის გზატკეცილით და შემდეგ დასავლეთით ბოლნისისკენ — სულ დაახლოებით 70 კმ და
    საათი და ოცდახუთი წუთი. მთელი მარშრუტი ასფალტიანია და კარგ მდგომარეობაშია, ეკონომ კლასის მანქანა სავსებით
    საკმარისია. ტაძარი თავად ქალაქ ბოლნისში კი არა, მეზობელ სოფელშია — ნავიგატორში მიუთითეთ „ბოლნისის
    სიონი“, რადგან ქალაქის ცენტრიდან კიდევ რამდენიმე კილომეტრია. საწვავს ავსებთ მარნეულში ან ბოლნისში.
en:
  name: Bolnisi Sioni
  short: >-
    A basilica of 478–493 — the oldest surviving church in Georgia and home to the earliest dated Georgian
    inscriptions.
  body: >-
    Bolnisi Sioni was built between 478 and 493 and is the oldest surviving church still in use in Georgia.
    It is a three-nave basilica, the architectural type that preceded the domed churches Georgia later
    became known for: relatively low, long and heavy, put together from blue-grey and yellowish tuff.
    That plainness is the main impression it leaves — a building that has stood for fifteen centuries
    in essentially unaltered form.


    Its exceptional significance lies in the inscriptions. Texts in the **Asomtavruli** script survive
    on the walls, dated to around 494, placing them among the earliest dated examples of Georgian writing
    anywhere. For the history of the language they carry as much weight as the building does for architecture.
    The church also gives its name to the **Bolnisi cross**, the flared cross form that later entered
    Georgian state symbolism and appears on the national flag today.


    Inside, the space is austere and almost undecorated: a row of columns, narrow windows and clean stone
    surfaces. The capitals carry carved reliefs of bulls, crosses and plant ornament, unusual survivals
    from the early Christian period and worth a close look. The church remains active with a working parish,
    so there are usually a few people quietly present.
  tip: >-
    This is a working church, so dress modestly: a skirt and head covering for women, long trousers for
    men, with wraps available at the door. An hour is enough overall, though it is worth spending some
    of it looking closely at the inscriptions and the carved capitals rather than only the general view.
    Parking in front of the yard is free. Cafés, shops and ATMs are in central Bolnisi, a few kilometres
    away.
  route: >-
    From Tbilisi take the Marneuli highway, then turn west towards Bolnisi — about 70 km and an hour twenty-five
    in total. The whole route is asphalt and in good condition, so an economy car is entirely adequate.
    Note that the church is not in Bolnisi town itself but in a neighbouring village a few kilometres
    further on, so set your navigation to "Bolnisi Sioni" rather than to the town centre. Fuel is easy
    to find in Marneuli and Bolnisi.
ru:
  name: Болнисский Сиони
  short: Базилика 478–493 годов — древнейший сохранившийся храм Грузии и место с самыми ранними грузинскими
    надписями.
  body: >-
    Болнисский Сиони построен между 478 и 493 годами и остаётся древнейшим сохранившимся действующим храмом
    Грузии. Это трёхнефная базилика — архитектурный тип, предшествовавший купольным храмам, которыми Грузия
    прославилась позже: сравнительно низкая, длинная и тяжёлая постройка из серо-голубого и желтоватого
    туфа. Именно эта простота и оставляет главное впечатление: здание простояло пятнадцать веков практически
    без изменений.


    Исключительное значение памятника связано с надписями. На стенах сохранились тексты письмом **асомтаврули**,
    датируемые примерно 494 годом, — одни из самых ранних датированных образцов грузинской письменности
    вообще. Для истории языка они значат не меньше, чем сама постройка для архитектуры. Отсюда же происходит
    название **болнисского креста** — расширяющейся к концам формы, вошедшей позже в государственную символику
    и присутствующей на нынешнем флаге.


    Внутри пространство суровое и почти лишённое украшений: ряд колонн, узкие окна, чистая поверхность
    камня. На капителях сохранились рельефы с быками, крестами и растительным орнаментом — редкие образцы
    раннехристианского времени, которые стоит рассмотреть вблизи. Храм действующий, с живым приходом,
    поэтому внутри обычно есть люди.
  tip: >-
    Храм действующий, поэтому одежда нужна скромная: юбка и платок для женщин, длинные брюки для мужчин;
    накидки есть у входа. Часа достаточно, но часть этого времени стоит потратить именно на надписи и
    резные капители, а не только на общий вид. Парковка перед двором бесплатная. Кафе, магазины и банкоматы
    находятся в центре Болниси, в нескольких километрах отсюда.
  route: >-
    Из Тбилиси по трассе на Марнеули, затем поворот на запад в сторону Болниси — всего около 70 км и час
    двадцать пять. Весь маршрут асфальтовый и в хорошем состоянии, машины эконом-класса вполне достаточно.
    Учтите, что храм стоит не в самом городе Болниси, а в соседнем селе ещё в нескольких километрах, поэтому
    в навигаторе задавайте «Болнисский Сиони», а не центр города. Заправиться просто в Марнеули и Болниси.
fa:
  name: بولنیسی سیونی
  short: باسیلیکایی از 478–493 — کهن‌ترین کلیسای بازماندهٔ گرجستان و خانهٔ نخستین کتیبه‌های تاریخ‌دار
    گرجی.
  body: >-
    بولنیسی سیونی میان 478 و 493 ساخته شد و کهن‌ترین کلیسای بازمانده‌ای است که هنوز در گرجستان استفاده
    می‌شود. باسیلیکایی سه‌شبستانی است، همان گونهٔ معماری که پیش از کلیساهای گنبددار — که بعدها گرجستان
    با آن‌ها شناخته شد — رواج داشت: نسبتاً کوتاه، دراز و سنگین، ساخته‌شده از توف خاکستری-آبی و زردفام.
    همین سادگی برداشت اصلی است که به جا می‌گذارد — بنایی که پانزده سده تقریباً بی‌تغییر ایستاده است.


    اهمیت استثنایی آن در کتیبه‌هاست. متن‌هایی به خط **اسومتاورولی** روی دیوارها مانده که به حدود 494 تاریخ
    خورده‌اند و از کهن‌ترین نمونه‌های تاریخ‌دار نوشتار گرجی در جهان‌اند. برای تاریخ زبان همان‌قدر وزن
    دارند که خود بنا برای معماری. این کلیسا نام خود را به **صلیب بولنیسی** هم داده است، همان صلیب با بازوهای
    گشاد که بعدها به نمادهای دولتی گرجستان راه یافت و امروز روی پرچم ملی دیده می‌شود.


    داخل، فضا ساده و تقریباً بی‌تزیین است: ردیفی از ستون‌ها، پنجره‌های باریک و سطوح تمیز سنگ. سرستون‌ها
    نقش‌برجستهٔ گاو، صلیب و نگارهٔ گیاهی دارند، بازمانده‌هایی نامعمول از دوران مسیحیت آغازین که ارزش نگاه
    نزدیک دارند. کلیسا با یک اجتماع فعال کلیسایی همچنان دایر است، پس معمولاً چند نفر در سکوت آنجا هستند.
  tip: >-
    اینجا کلیسای فعالی است، پس ساده و پوشیده لباس بپوشید: دامن و روسری برای زنان، شلوار بلند برای مردان،
    و شال‌ها کنار در موجود است. یک ساعت در مجموع کافی است، هرچند ارزش دارد بخشی از آن را به تماشای دقیق
    کتیبه‌ها و سرستون‌های کنده‌کاری‌شده اختصاص دهید نه فقط به نمای کلی. پارکینگ روبه‌روی حیاط رایگان است.
    کافه، مغازه و خودپرداز در مرکز بولنیسی است، چند کیلومتر آن‌سوتر.
  route: >-
    از تفلیس بزرگراه مارنئولی را بگیرید، سپس به غرب به سوی بولنیسی بپیچید — در مجموع حدود 70 کیلومتر و
    یک ساعت و بیست‌وپنج دقیقه. کل مسیر آسفالت و در وضعیت خوبی است، پس خودروی اقتصادی کاملاً کافی است.
    توجه کنید که کلیسا در خود شهر بولنیسی نیست بلکه در روستایی همسایه چند کیلومتر جلوتر قرار دارد، پس
    مسیریاب را روی «بولنیسی سیونی» تنظیم کنید نه مرکز شهر. سوخت در مارنئولی و بولنیسی به‌آسانی پیدا می‌شود.
he:
  name: בולניסי סיוני
  short: בזיליקה מן השנים 478–493 — הכנסייה העתיקה ביותר ששרדה בגאורגיה ובה הכתובות הגאורגיות המתוארכות
    הראשונות.
  body: >-
    בולניסי סיוני נבנתה בין 478 ל-493 והיא הכנסייה העתיקה ביותר ששרדה ועדיין בשימוש בגאורגיה. זו בזיליקה
    תלת-אולמית, הטיפוס האדריכלי שקדם לכנסיות הכיפה שבהן התפרסמה גאורגיה מאוחר יותר: נמוכה יחסית, ארוכה
    וכבדה, בנויה מטוף אפור-כחלחל וצהבהב. הפשטות הזאת היא הרושם המרכזי שהיא מותירה — מבנה שעומד חמש עשרה
    מאות שנה בצורה כמעט בלתי משתנה.


    חשיבותה יוצאת הדופן טמונה בכתובות. על הקירות שרדו טקסטים בכתב **אסומתאוורולי**, המתוארכים לסביבות
    494, והם נמנים עם הדוגמאות המתוארכות המוקדמות ביותר של כתיבה גאורגית בעולם. עבור תולדות השפה יש להם
    משקל זהה לזה שיש למבנה עבור האדריכלות. הכנסייה גם העניקה את שמה ל**צלב בולניסי**, אותו צלב מתרחב שנכנס
    מאוחר יותר לסמליה של המדינה הגאורגית ומופיע היום על הדגל הלאומי.


    בפנים החלל צנוע וכמעט נטול קישוט: שורת עמודים, חלונות צרים ומשטחי אבן נקיים. הכותרות נושאות תבליטים
    מגולפים של שוורים, צלבים ועיטור צמחי, שרידים נדירים מן התקופה הנוצרית הקדומה ששווים התבוננות מקרוב.
    הכנסייה פעילה ומשרתת קהילה, ולכן בדרך כלל יש בה כמה אנשים בשקט.
  tip: >-
    זו כנסייה פעילה, ולכן התלבשו בצניעות: חצאית וכיסוי ראש לנשים, מכנסיים ארוכים לגברים, ומטפחות זמינות
    בדלת. שעה מספיקה בסך הכול, אם כי כדאי להקדיש חלק ממנה להתבוננות מקרוב בכתובות ובכותרות המגולפות ולא
    רק במבט הכללי. החניה מול החצר חינם. בתי קפה, חנויות וכספומטים נמצאים במרכז בולניסי, כמה קילומטרים
    משם.
  route: >-
    מטביליסי סעו בכביש מרנאולי, ואז פנו מערבה לכיוון בולניסי — כ-70 ק״מ ושעה עשרים וחמש בסך הכול. כל המסלול
    אספלט ובמצב טוב, ולכן רכב חסכוני מספיק לחלוטין. שימו לב שהכנסייה אינה בעיירה בולניסי עצמה אלא בכפר
    סמוך כמה קילומטרים הלאה, לכן הגדירו בניווט "בולניסי סיוני" ולא את מרכז העיירה. דלק קל למצוא במרנאולי
    ובבולניסי, ובשתיהן יש גם חנויות ומקומות לעצור בהם לקפה בדרך.
ar:
  name: بولنيسي سيوني
  short: بازيليكا من عامي 478–493 — أقدم كنيسة باقية في جورجيا وموطن أقدم النقوش الجورجية المؤرخة.
  body: >-
    بُنيت بولنيسي سيوني بين عامي 478 و493، وهي أقدم كنيسة باقية وما زالت مستعملة في جورجيا. وهي بازيليكا
    بثلاثة صحون، وهو الطراز المعماري الذي سبق الكنائس المقبّبة التي اشتهرت بها جورجيا لاحقاً: منخفضة نسبياً
    وطويلة وثقيلة، مبنية من حجر التف الرمادي المزرق والمصفر. وهذه البساطة هي الانطباع الأول الذي تتركه
    — بناء ظل قائماً خمسة عشر قرناً في هيئة تكاد تكون بلا تغيير.


    وتكمن أهميتها الاستثنائية في النقوش. فعلى الجدران نصوص بخط **أسومتافرولي** تعود إلى نحو عام 494، وهي
    من أقدم النماذج المؤرخة للكتابة الجورجية في أي مكان. ووزنها في تاريخ اللغة يعادل وزن المبنى في تاريخ
    العمارة. كما أعطت الكنيسة اسمها لـ**صليب بولنيسي**، ذلك الصليب المتسع الأطراف الذي دخل لاحقاً في الرموز
    الرسمية الجورجية ويظهر اليوم على العلم الوطني.


    وفي الداخل يبدو الحيز متقشفاً وشبه خالٍ من الزخرفة: صف من الأعمدة ونوافذ ضيقة وأسطح حجرية نظيفة. وتحمل
    التيجان نقوشاً بارزة لثيران وصلبان وزخارف نباتية، وهي بقايا نادرة من العصر المسيحي المبكر تستحق نظرة
    قريبة. والكنيسة ما زالت عاملة ولها رعية، فتجد فيها عادة بضعة أشخاص في صمت.
  tip: >-
    هذه كنيسة عاملة، فالبس ثياباً محتشمة: تنورة وغطاء رأس للنساء، وسروال طويل للرجال، والأغطية متاحة عند
    الباب. ساعة تكفي إجمالاً، وإن كان يجدر أن تخصص جزءاً منها للنظر عن قرب في النقوش وتيجان الأعمدة المنحوتة
    لا للمشهد العام وحده. والوقوف أمام الفناء مجاني. أما المقاهي والمتاجر وأجهزة الصراف ففي وسط بولنيسي،
    على بعد بضعة كيلومترات.
  route: >-
    من تبليسي اسلك طريق مارنيولي السريع، ثم انعطف غرباً نحو بولنيسي — نحو 70 كم وساعة وخمس وعشرين دقيقة
    إجمالاً. الطريق كله إسفلت وبحالة جيدة، فسيارة اقتصادية تكفي تماماً. وانتبه إلى أن الكنيسة ليست في
    بلدة بولنيسي نفسها بل في قرية مجاورة على بعد بضعة كيلومترات، فاضبط الملاحة على «بولنيسي سيوني» لا
    على مركز البلدة. والوقود سهل المنال في مارنيولي وبولنيسي.
