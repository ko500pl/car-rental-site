ka:
  name: ჭაქვინჯის ციხე
  short: დადიანების ნახევრად დანგრეული ციხე ჭანისწყლის თავზე, სადაც 1813 წელს სამეგრელოს მომავალი მთავარი
    დაიბადა.
  body: >-
    **ჭაქვინჯი სამეფო სიმაგრეც ყოფილა, მთავრის საზაფხულო რეზიდენციაც, საპყრობილეც, 1905 წელს კი — გადამწვარი
    სოფლის თავშესაფარი. დღეს ეს ისეთი მყიფე ნანგრევია, რომ სტუმრისგან სიფრთხილეს ითხოვს.**


    ციხე, რომელსაც ჯიხასაც და ჯიხაშკარის ციხესაც უწოდებენ, ზუგდიდის აღმოსავლეთით, სოფელ ჯიხაშკარში, მდინარე
    ჭანისწყლის თავზე აზიდულ გრძელ, ელიფსურ გორას აგვირგვინებს. ჩვეულებრივ მას VIII საუკუნით, ეგრის-აფხაზეთის
    სამეფოს ხანით ათარიღებენ; XII საუკუნეში იგი განაახლეს, XVI–XVII საუკუნეებში კი საფუძვლიანად აღადგინეს.
    1968–1969 წლების გათხრებმა გამოავლინა ციტადელი და ქვედა ციხე, ჩრდილოეთ და აღმოსავლეთ მხარეს ჩაშენებული
    კოშკები, ეკლესია და ჩრდილოეთ ფერდზე ჩაყოლებული გვირაბი, რომლის ბოლოსაც კოშკი დგას. ძეგლის მკვლევარმა
    პარმენ ზაქარაიამ უძველესი სამშენებლო ფენა III–IV საუკუნეებით დაათარიღა.


    XVII საუკუნისთვის ციხე სამეგრელოს მფლობელებს, დადიანებს ეკუთვნოდა. ვახუშტი ბატონიშვილი მოგვითხრობს,
    როგორ ალყა შემოარტყა ქართლის მეფე ვახტანგ V-მ ჭაქვინჯს, სადაც დადიანის ცოლ-შვილი იყო შეხიზნული, და
    როგორ წაიღო იქიდან „საჭურჭლენი მრავალნი“. დადიანებს აქ საზაფხულო სასახლე ჰქონდათ; სწორედ მასში დაიბადა
    1813 წელს დავით დადიანი, სამეგრელოს მთავარი 1846–1853 წლებში. ციხის ჩრდილო-დასავლეთით აღმართულ ერთადერთ
    ჩამონგრეულ ბუხარს იმ სასახლის ნაშთად მიიჩნევენ.


    სახელს ადგილობრივები „ჭის ძირად“ ხსნიან — ციხის შუაგულში ოდესღაც ძალიან ღრმა ჭა ყოფილა. გადმოცემა
    ფარულ სავალზეც მოგვითხრობს, რომლითაც ალყაშემორტყმულები წყლისთვის პატარა ციხეში გადიოდნენ, და ისიც,
    რომ ციხე თავად სოფლელებმა ააშენეს: ჭანისწყლიდან ქვებს ცოცხალი ჯაჭვით, ხელიდან ხელში აწვდიდნენ ერთმანეთს.
    1905 წელს სადამსჯელო რაზმებმა ჯიხაშკარი და ჭაქვინჯი გადაწვეს, უსახლკაროდ დარჩენილმა ოჯახებმა კი ძველ
    გალავანს შეაფარეს თავი.


    2017 წელს ადგილობრივმა მედიამ დაწერა, რომ ნანგრევი ჩამოქცევის პირასაა. აქ მდინარის ხედისა და ამბისთვის
    ამოდით, ქვები კი იქ დატოვეთ, სადაც დევს.
  tip: >-
    უპირველესად — უსაფრთხოება. 2017 წელს ციხე მძიმედ დაზიანებულად და ჩამოქცევის პირას მყოფად აღწერეს,
    სარეაბილიტაციო სამუშაოები არ დაწყებულა, და მას შემდეგ შეკეთების დამადასტურებელი ცნობა ვერ ვიპოვეთ.
    ღია ადგილას იარეთ, კედლებზე ნუ ახვალთ, გვირაბში ნუ შეხვალთ, გადახრილი წყობის ქვეშ ნუ შეჩერდებით, ბავშვები
    კი გვერდით გყავდეთ. ასვლამდე ჯიხაშკარში იკითხეთ, გასავლელია თუ არა ბილიკი გორაზე. შესასვლელი უფასოა,
    ინფრასტრუქტურა არ არის — წყალი თან წაიღეთ. ჩაიცვით კარგად მოჭიდებადი ფეხსაცმელი: წვიმის შემდეგ გორა
    ლიპდება, სამეგრელოში კი ხშირად წვიმს. ვიზიტი ზუგდიდის დადიანების სასახლესთან ერთად დაგეგმეთ — იქ ამ
    ოჯახის ამბავი გრძელდება.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სენაკამდე იარეთ, შემდეგ შ6 გზით ჩხოროწყუსკენ
    და ადგილობრივი გზებით (ჯერ შ87, მერე შ84) ჯიხაშკარამდე. სულ დაახლოებით 313 კმ და ოთხნახევარი საათია.
    სოფელი ზუგდიდიდან პირდაპირი ხაზით დაახლოებით 12 კმ-ით აღმოსავლეთითაა, ამიტომ ციხე ზუგდიდის ერთდღიან
    მოგზაურობაშიც იოლად ეტევა. გზა თითქმის ბოლომდე ასფალტიანია; ბოლო შესახვევი შეიძლება მოუასფალტებელი
    იყოს, მაგრამ ეკონომკლასის მანქანაც გაივლის. მთავარი ძალისხმევა გორაზე ფეხით ასვლაა. საწვავი სენაკში
    ან ზუგდიდში ჩაასხით.
en:
  name: Chakvinji Fortress
  short: >-
    The crumbling hill fortress of the Dadianis above the Chanistsqali river, where a future prince of
    Samegrelo was born in 1813.
  body: >-
    **Chakvinji has been a royal stronghold, a princely summer seat, a prison and, in 1905, a refuge for
    villagers whose homes had been burned. Today it is a ruin so fragile that it asks visitors to tread
    carefully.**


    The fortress, also called Jikha or Jikhashkari, crowns a long, oval hill above the Chanistsqali river
    in the village of Jikhashkari, east of Zugdidi. It is usually dated to the eighth century and the
    kingdom of Egrisi-Abkhazia, rebuilt in the twelfth and heavily restored in the sixteenth and seventeenth.
    Excavations in 1968 and 1969 traced a citadel and a lower fortress, towers along the north and east,
    a church, and a tunnel running down the north slope to a tower at its end; Parmen Zakaraia dated the
    earliest building layer to the third and fourth centuries.


    By the seventeenth century it belonged to the Dadiani rulers of Samegrelo. Prince Vakhushti tells
    how King Vakhtang V of Kartli besieged Chakvinji while the Dadiani's wife and children sheltered inside,
    and carried away a hoard of treasure. The Dadianis kept a summer residence here, and in 1813 David
    Dadiani, Prince of Samegrelo from 1846 to 1853, was born in it. A lone broken chimney north-west of
    the walls is said to be all that is left of it.


    One local explanation of the name is "the bottom of the well", after a very deep well at the centre
    of the fortress. Tradition adds a hidden passage along which besieged defenders crept to a smaller
    fort for water, and says the villagers built the walls themselves, passing stones up from the river
    hand to hand. In 1905 punitive troops burned Jikhashkari and Chakvinji, and families left homeless
    camped inside the old enclosure.


    In 2017 local media reported the ruin close to collapse. Come for the river view and the story, and
    leave the stones where they lie.
  tip: >-
    Safety first. In 2017 the fortress was reported seriously damaged and close to collapse, with no rehabilitation
    begun, and we could not confirm any repair since. Keep to open ground, stay off the walls and out
    of the tunnel, don't linger under leaning masonry, and keep children close. Ask in Jikhashkari whether
    the way up is passable before you set off. There is no fee and there are no facilities, so bring water.
    Wear boots with good grip, because the hill turns slippery after rain, and in Samegrelo it rains often.
    Combine the visit with the Dadiani Palace in Zugdidi, where the family story continues.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Senaki, then the Sh6 towards Chkhorotsku and local
    roads (Sh87, then Sh84) to Jikhashkari: about 313 km and four and a half hours. The village lies roughly
    12 km east of Zugdidi as the crow flies, so the fortress also fits easily into a Zugdidi day. The
    roads are paved almost to the end; the last lane may be unsurfaced, but an economy car copes. The
    real effort is the walk up the hill. Fuel up in Senaki or Zugdidi.
ru:
  name: Крепость Чаквинджи
  short: >-
    Осыпающаяся крепость Дадиани на холме над рекой Чанисцкали, где в 1813 году родился будущий владетель
    Самегрело.
  body: >-
    **Чаквинджи успела побывать царской твердыней, летней резиденцией князей, тюрьмой, а в 1905 году —
    убежищем для крестьян, чьи дома сожгли; сегодня это руина настолько хрупкая, что требует от гостей
    бережности.**


    Крепость, которую называют также Джиха или Джихашкари, венчает длинный овальный холм над рекой Чанисцкали
    в селе Джихашкари, к востоку от Зугдиди. Её обычно относят к VIII веку, ко временам Эгрисско-Абхазского
    царства; в XII веке её перестроили, а в XVI–XVII веках основательно обновили. Раскопки 1968 и 1969
    годов выявили цитадель и нижнюю крепость, башни по северной и восточной сторонам, церковь и тоннель,
    который спускается по северному склону к башне в его конце; древнейший строительный слой Пармен Закарая
    датировал III–IV веками.


    К XVII веку крепость принадлежала Дадиани, правителям Самегрело. Царевич Вахушти рассказывает, как
    царь Картли Вахтанг V осадил Чаквинджи, когда внутри укрывались жена и дети Дадиани, и увёз отсюда
    богатую казну. Дадиани держали здесь летнюю резиденцию, и в 1813 году в ней родился Давид Дадиани,
    владетель Самегрело в 1846–1853 годах. Говорят, одинокая обломанная труба к северо-западу от стен
    — всё, что от неё осталось.


    Одно из местных толкований названия — «дно колодца»: в центре крепости был очень глубокий колодец.
    Предание добавляет потайной ход, по которому осаждённые пробирались за водой к крепости поменьше,
    и уверяет, что стены возвели сами крестьяне, передавая камни с реки из рук в руки. В 1905 году карательные
    войска сожгли Джихашкари и Чаквинджи, и оставшиеся без крова семьи нашли приют за старыми стенами.


    В 2017 году местные СМИ писали, что руина вот-вот обрушится. Приезжайте ради вида на реку и ради истории
    — и оставьте камни там, где они лежат.
  tip: >-
    Прежде всего — безопасность. В 2017 году сообщалось, что крепость серьёзно повреждена и близка к обрушению,
    а реставрацию так и не начали; подтверждений какого-либо ремонта с тех пор мы не нашли. Держитесь
    открытых мест, не поднимайтесь на стены и не заходите в тоннель, не задерживайтесь под накренившейся
    кладкой, а детей держите рядом. Прежде чем идти, спросите в Джихашкари, проходим ли подъём. Платы
    нет, удобств тоже, так что возьмите воду. Нужны ботинки с цепкой подошвой: после дождя холм становится
    скользким, а дожди в Самегрело часты. Совместите поездку с дворцом Дадиани в Зугдиди — там семейная
    история продолжается.
  route: >-
    Из Тбилиси — по S1 (E60) на запад, мимо Кутаиси до Сенаки, затем по Sh6 в сторону Чхороцку и местными
    дорогами (Sh87, потом Sh84) до Джихашкари: около 313 км и четыре с половиной часа. По прямой село
    лежит примерно в 12 км к востоку от Зугдиди, так что крепость легко вписать в день, проведённый там.
    Асфальт идёт почти до конца; последний сельский проезд может оказаться грунтовым, но машина эконом-класса
    справится. Настоящее усилие — подъём на холм пешком. Заправьтесь в Сенаки или Зугдиди.
fa:
  name: قلعهٔ چاکوینجی
  short: دژ فرسودهٔ دادیانی‌ها بر تپه‌ای بالای رود چانیستسقالی، جایی که فرمانروای آیندهٔ سامگرلو در ۱۸۱۳
    به دنیا آمد.
  body: >-
    **چاکوینجی روزگاری دژی شاهی بوده، روزگاری اقامتگاه تابستانی شاهزادگان، زمانی زندان و در ۱۹۰۵ پناهگاه
    روستاییانی که خانه‌هایشان را سوزانده بودند؛ و امروز ویرانه‌ای است چنان شکننده که بازدیدکنندهٔ محتاط
    می‌طلبد.**


    این قلعه که جیخا یا جیخاشکاری هم خوانده می‌شود، بر فراز تپه‌ای دراز و بیضی‌شکل بالای رود چانیستسقالی،
    در روستای جیخاشکاری در شرق زوگدیدی، چون تاجی نشسته است. معمولاً آن را به سدهٔ هشتم و دوران پادشاهی
    اگریسی-آبخازیا نسبت می‌دهند؛ در سدهٔ دوازدهم از نو ساخته شد و در سده‌های شانزدهم و هفدهم به‌طور گسترده
    مرمت شد. کاوش‌های سال‌های ۱۹۶۸ و ۱۹۶۹ ارگ و قلعهٔ پایینی، برج‌هایی در امتداد ضلع‌های شمالی و شرقی،
    یک کلیسا و تونلی را آشکار کرد که از دامنهٔ شمالی پایین می‌رود و به برجی در انتهای خود می‌رسد؛ پارمن
    زاکارایا کهن‌ترین لایهٔ ساختمانی را از سده‌های سوم و چهارم دانست.


    تا سدهٔ هفدهم قلعه از آنِ دادیانی‌ها، فرمانروایان سامگرلو، شده بود. شاهزاده واخوشتی روایت می‌کند که
    واختانگ پنجم، پادشاه کارتلی، چاکوینجی را در حالی محاصره کرد که همسر و فرزندان دادیانی درون آن پناه
    گرفته بودند، و گنجینه‌ای انبوه با خود برد. دادیانی‌ها اینجا اقامتگاهی تابستانی داشتند و در ۱۸۱۳ داوید
    دادیانی، فرمانروای سامگرلو از ۱۸۴۶ تا ۱۸۵۳، در همان اقامتگاه به دنیا آمد. می‌گویند دودکشی شکسته و
    تنها در شمال‌غربی دیوارها، همهٔ آن چیزی است که از آن مانده است.


    یکی از توضیح‌های محلی برای نام قلعه «تهِ چاه» است، به سبب چاهی بسیار ژرف در میانهٔ قلعه. روایت‌های
    کهن از گذرگاهی پنهان می‌گویند که مدافعان محاصره‌شده از آن تا دژی کوچک‌تر می‌خزیدند تا آب بیاورند،
    و نیز می‌گویند روستاییان خودشان دیوارها را ساختند و سنگ‌ها را دست‌به‌دست از رود بالا آوردند. در ۱۹۰۵
    نیروهای تنبیهی جیخاشکاری و چاکوینجی را به آتش کشیدند و خانواده‌های بی‌خانمان درون حصار کهن سکنا گزیدند.


    در ۲۰۱۷ رسانه‌های محلی خبر دادند که این ویرانه در آستانهٔ فروریختن است. برای چشم‌انداز رود و برای
    داستانش بیایید، و سنگ‌ها را همان‌جا که افتاده‌اند رها کنید.
  tip: >-
    ایمنی در درجهٔ اول. در ۲۰۱۷ گزارش شد که قلعه به‌شدت آسیب دیده و در آستانهٔ فروریختن است و هیچ مرمتی
    آغاز نشده؛ ما نتوانستیم تأیید کنیم که از آن پس تعمیری انجام شده باشد. در فضای باز بمانید، از دیوارها
    بالا نروید و وارد تونل نشوید، زیر سنگ‌چین‌های کج‌شده درنگ نکنید و کودکان را کنار خود نگه دارید. پیش
    از راه افتادن، در جیخاشکاری بپرسید که راه بالا رفتن قابل عبور است یا نه. ورودیه‌ای نیست و هیچ امکاناتی
    هم نیست، پس آب همراه داشته باشید. کفشی با زیرهٔ ضدلغزش بپوشید، چون تپه پس از باران لغزنده می‌شود و
    در سامگرلو باران فراوان می‌بارد. بازدید را با کاخ دادیانی در زوگدیدی همراه کنید؛ داستان این خاندان
    آنجا ادامه می‌یابد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب، از کنار کوتایسی تا سناکی بروید، سپس جادهٔ Sh6 را به سوی چخوروتسقو
    و جاده‌های محلی (Sh87 و بعد Sh84) را تا جیخاشکاری بگیرید: حدود ۳۱۳ کیلومتر و چهار ساعت و نیم. روستا
    در خط مستقیم حدود ۱۲ کیلومتر در شرق زوگدیدی است، پس قلعه به‌راحتی در یک روزِ گردش در زوگدیدی جا می‌گیرد.
    جاده‌ها تقریباً تا انتها آسفالت‌اند؛ کوچهٔ آخر شاید خاکی باشد، ولی خودروی اقتصادی از پسش برمی‌آید.
    زحمت اصلی، بالا رفتن پیاده از تپه است. در سناکی یا زوگدیدی سوخت‌گیری کنید.
he:
  name: מבצר צ'קווינג'י
  short: מבצר הגבעה המתפורר של בית דדיאני מעל נהר צ'אניסצקאלי, שבו נולד ב-1813 מי שעתיד היה להיות נסיך
    סמגרלו.
  body: >-
    **צ'קווינג'י היה מעוז מלכותי, מעון קיץ של נסיכים, בית כלא, ובשנת 1905 גם מקלט לכפריים שבתיהם הועלו
    באש; כיום זו חורבה שבירה כל כך, שהיא זקוקה למבקרים זהירים.**


    המבצר, המכונה גם ג'יחה או ג'יחאשקרי, מכתיר גבעה ארוכה וסגלגלה מעל נהר צ'אניסצקאלי, בכפר ג'יחאשקרי
    שממזרח לזוגדידי. בדרך כלל מתארכים אותו למאה השמינית, לימי ממלכת אגריסי-אבחזיה; הוא נבנה מחדש במאה
    ה-12 ושוקם בהרחבה במאות ה-16 וה-17. בחפירות של 1968 ו-1969 נחשפו מצודה ומבצר תחתון, מגדלים לאורך הצד
    הצפוני והמזרחי, כנסייה ומנהרה היורדת במדרון הצפוני אל מגדל שבקצהּ; פרמן זקראיה תיארך את שכבת הבנייה
    הקדומה ביותר למאות השלישית והרביעית.


    עד המאה ה-17 עבר המבצר לידי בית דדיאני, שליטי סמגרלו. הנסיך וחושטי מספר כיצד מלך קרתלי, וחטנג החמישי,
    צר על צ'קווינג'י בשעה שאשתו וילדיו של הדדיאני הסתתרו בתוכו, ונשא עמו אוצר רב. בני דדיאני החזיקו כאן
    מעון קיץ, ובו נולד ב-1813 דוד דדיאני, נסיך סמגרלו בשנים 1846–1853. אומרים שארובה שבורה ובודדת מצפון-מערב
    לחומות היא כל מה שנותר מן המעון.


    אחד ההסברים המקומיים לשם הוא "קרקעית הבאר", על שם באר עמוקה מאוד במרכז המבצר. המסורת מוסיפה מעבר נסתר
    שבו התגנבו המגינים הנצורים אל מבצר קטן יותר כדי להביא מים, ומספרת שהכפריים בנו את החומות בעצמם והעבירו
    את האבנים מהנהר מיד ליד. ב-1905 שרפו כוחות עונשין את ג'יחאשקרי ואת צ'קווינג'י, ומשפחות שנותרו בלי
    קורת גג מצאו מחסה בתוך המתחם העתיק.


    ב-2017 דיווחה התקשורת המקומית שהחורבה עומדת לקרוס. בואו בשביל הנוף אל הנהר ובשביל הסיפור, והשאירו
    את האבנים במקומן.
  tip: >-
    הבטיחות קודמת לכול. ב-2017 דווח שהמבצר ניזוק קשות ועומד על סף קריסה, ושום שיקום לא החל; לא הצלחנו
    לאשר שבוצע מאז תיקון כלשהו. הישארו בשטח הפתוח, אל תעלו על החומות ואל תיכנסו למנהרה, אל תתעכבו מתחת
    לבנייה נוטה, והחזיקו את הילדים קרוב. לפני היציאה שאלו בג'יחאשקרי אם הדרך למעלה עבירה. אין דמי כניסה
    ואין שום מתקנים, אז הביאו מים. נעלו נעליים עם אחיזה טובה, כי הגבעה נעשית חלקלקה אחרי גשם, ובסמגרלו
    יורד גשם לעיתים קרובות. שלבו את הביקור עם ארמון דדיאני בזוגדידי, שם נמשך סיפור המשפחה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), על פני קוטאיסי ועד סנאקי, משם בכביש Sh6 לכיוון צ'חורוצקו ובדרכים
    מקומיות (Sh87 ואחריו Sh84) עד ג'יחאשקרי: כ-313 ק"מ וארבע שעות וחצי. בקו אווירי שוכן הכפר כ-12 ק"מ
    ממזרח לזוגדידי, כך שקל לשלב את המבצר ביום בזוגדידי. הכבישים סלולים כמעט עד הסוף; ייתכן שהסמטה הכפרית
    האחרונה אינה סלולה, אבל רכב מקטגוריית אקונומי יסתדר. המאמץ האמיתי הוא העלייה ברגל אל ראש הגבעה. תדלקו
    בסנאקי או בזוגדידי.
ar:
  name: قلعة تشاكفينجي
  short: قلعة آل دادياني المتداعية على تلٍّ فوق نهر تشانيستسكالي، حيث وُلد عام 1813 أميرٌ سيحكم ساميغريلو
    لاحقًا.
  body: >-
    **كانت تشاكفينجي حصنًا ملكيًّا، ومقرًّا صيفيًّا للأمراء، وسجنًا، ثم صارت عام 1905 ملاذًا لقرويين أُحرقت
    بيوتهم؛ وهي اليوم أطلال بلغت من الهشاشة حدًّا يستدعي زوارًا حذرين.**


    تتوّج القلعة، المعروفة أيضًا باسم جيخا أو جيخاشكاري، تلًّا طويلًا بيضاويًّا فوق نهر تشانيستسكالي في
    قرية جيخاشكاري شرقي زوغديدي. يُنسب بناؤها عادةً إلى القرن الثامن وعهد مملكة إغريسي-أبخازيا، وقد أُعيد
    بناؤها في القرن الثاني عشر ورُمِّمت ترميمًا واسعًا في القرنين السادس عشر والسابع عشر. وكشفت حفريات
    عامَي 1968 و1969 عن قلعة داخلية وقلعة سفلى، وأبراج على امتداد الجانبين الشمالي والشرقي، وكنيسة، ونفق
    ينحدر على السفح الشمالي إلى برج عند طرفه؛ وأرّخ بارمين زاكارايا أقدم طبقات البناء بالقرنين الثالث
    والرابع.


    وبحلول القرن السابع عشر صارت القلعة ملكًا لآل دادياني حكّام ساميغريلو. ويروي الأمير فاخوشتي كيف حاصر
    فاختانغ الخامس، ملك كارتلي، تشاكفينجي فيما كانت زوجة دادياني وأولاده محتمين بداخلها، ثم حمل معه كنزًا
    وفيرًا. وقد اتخذ آل دادياني هنا مقرًّا صيفيًّا، وفيه وُلد عام 1813 دافيد دادياني، أمير ساميغريلو من
    1846 إلى 1853. ويقال إن مدخنة مكسورة وحيدة إلى الشمال الغربي من الأسوار هي كل ما بقي من ذلك المقر.


    ومن التفسيرات المحلية للاسم «قاع البئر»، نسبةً إلى بئر عميقة جدًّا في وسط القلعة. ويضيف التراث ممرًّا
    خفيًّا كان المدافعون المحاصَرون يتسللون عبره إلى حصن أصغر ليجلبوا الماء، ويقول إن القرويين بنوا الأسوار
    بأيديهم، يتناقلون الحجارة من النهر يدًا بيد. وفي عام 1905 أحرقت قوات تأديبية جيخاشكاري وتشاكفينجي،
    فلجأت الأسر المشرّدة إلى داخل السور القديم.


    وفي عام 2017 أفادت وسائل الإعلام المحلية بأن الأطلال توشك أن تنهار. تعالَ من أجل مشهد النهر ومن أجل
    الحكاية، واترك الحجارة حيث هي.
  tip: >-
    السلامة أولًا. في عام 2017 أُفيد بأن القلعة متضررة بشدة وعلى وشك الانهيار دون أن يبدأ أي ترميم، ولم
    نتمكن من التحقق من أي إصلاح منذ ذلك الحين. ابقَ في الأماكن المكشوفة، ولا تصعد إلى الأسوار ولا تدخل
    النفق، ولا تمكث تحت البناء المائل، وأبقِ الأطفال قريبين منك. وقبل الانطلاق اسأل في جيخاشكاري إن كان
    الطريق إلى الأعلى سالكًا. لا رسوم دخول ولا أي مرافق، فاحمل الماء معك. البس حذاءً مانعًا للانزلاق،
    فالتل يصبح زلقًا بعد المطر، والمطر كثير في ساميغريلو. واجمع الزيارة مع قصر دادياني في زوغديدي، حيث
    تتواصل حكاية الأسرة.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا متجاوزًا كوتايسي حتى سيناكي، ثم الطريق Sh6 باتجاه تشخوروتسكو،
    فطرقًا محلية (Sh87 ثم Sh84) حتى جيخاشكاري: نحو 313 كم وأربع ساعات ونصف. تقع القرية على بُعد نحو 12
    كم شرقي زوغديدي في خط مستقيم، لذا يسهل ضمّ القلعة إلى يوم تقضيه في زوغديدي. الطرق معبّدة حتى النهاية
    تقريبًا؛ وقد يكون الزقاق الأخير ترابيًّا، لكن السيارة الاقتصادية تجتازه. الجهد الحقيقي هو صعود التل
    سيرًا. تزوّد بالوقود في سيناكي أو زوغديدي.
