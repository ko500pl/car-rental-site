ka:
  name: რიკოთის უღელტეხილი
  short: >-
    ლიხის ქედის 996-მეტრიანი უნაგირი, სადაც საქართველოს წყლები შავ და კასპიის ზღვებს შორის იყოფა: ქვემოთ
    1982 წლის გვირაბი, ზემოთ — ტყით გამავალი ძველი გზა.
  body: >-
    **რიკოთი მაღალი არ არის — სულ 996 მეტრი, — მაგრამ სწორედ აქ წყვეტს საქართველო, რომელ ზღვას ეკუთვნის.**


    უღელტეხილი ლიხის ქედზე გადადის — კავკასიონის იმ მერიდიანულ განშტოებაზე, რომელიც ქვეყანას შუაზე ყოფს.
    აღმოსავლეთ კალთებზე დაცემული წვიმა კასპიის ზღვისკენ მიედინება, დასავლეთის კალთებზე დაცემული — შავი
    ზღვისკენ. ეს მხოლოდ წყალგამყოფი არ არის: აღმოსავლეთით ღია, უფრო მშრალი ქართლია, დასავლეთით — ნოტიო,
    ტყიანი იმერეთი, და ორივე ნახევარს ოდითგანვე საკუთარი ჰავა, ბუნება და ისტორია აქვს. თავად უნაგირი ხაშურისა
    და ხარაგაულის მუნიციპალიტეტების საზღვარზე, მდინარე რიკოთულას სათავესთან მდებარეობს; მიდამო პალეოზოური
    გრანიტოიდებითაა აგებული და კოლხური ტიპის ფართოფოთლოვან ტყეშია გახვეული.


    მძღოლთა უმრავლესობისთვის უღელტეხილი სიბნელის მონაკვეთია. 1982 წელს თბილისი–ქუთაისის მაგისტრალი კლდეში
    გაჭრილ 1722-მეტრიან გვირაბში გადაიტანეს, 2010–2011 წლებში კი გვირაბი განაახლეს; ქვეყნის ყველაზე დატვირთული
    სამთო გადასასვლელი მას შემდეგ მიწის ქვეშ გადის. გვირაბის თავზე კი ძველი გზა ისევ მიიკლაკნება მწვერვალისკენ,
    და ვისაც არსად ეჩქარება, ტყის გულისთვის დღესაც მას ირჩევს.


    მწვერვალის დასავლეთით გზა რიკოთულასა და ძირულას ხეობებს მიუყვება, მდინარისპირა დასასვენებელი ადგილებისა
    და გზისპირა სასადილოების გავლით. შროშაში მეთუნეები გზის გასწვრივ დოქებს, ჯამებსა და ქოთნებს აწყობენ;
    სხვაგან ადგილობრივები კალათებსა და ხის ჭურჭელს ყიდიან. სოფელ უბისასთან, გზიდან სულ რამდენიმე მეტრში,
    უბისის მონასტერი დგას — შუა საუკუნეების ქართული ხუროთმოძღვრების ერთ-ერთი თვალსაჩინო ძეგლი.


    ქედის გავლით ახალი ჩქაროსნული მაგისტრალია დაპროექტებული — 52 კილომეტრი, 53 გვირაბი, 96 ხიდი, — რომელმაც
    მძიმე ნაკადი უფრო სწრაფად და უფრო ღრმად უნდა გაატაროს. ერთხელ მაინც ძველი გზით გადაიარეთ მწვერვალზე:
    გვირაბი ქუთაისამდე მიგიყვანთ, მწვერვალი კი დაგანახებთ, რა გადაკვეთეთ.
  tip: >-
    ბილეთი არ არსებობს და არც არაფერი იკეტება: ეს გზაა, და გაჩერება იმდენ ხანს გრძელდება, რამდენსაც თავად
    მოისურვებთ — ნახევარი საათი მწვერვალზე, მეტი, თუ ქვემოთ, ხეობებში საპიკნიკოდ შეჩერდებით. ძველი გზა
    ვიწრო და ხვეულია; ზამთარში მასზე შესაძლოა თოვლი ან ყინული დაგხვდეთ მაშინაც, როცა გვირაბის გზა სუფთაა,
    ამიტომ ამინდი წინასწარ შეამოწმეთ და ზაფხულის საბურავებს ნუ ენდობით. მთავარ გზაზე სატვირთოების ნაკადი
    დიდია — გაუსწარით მხოლოდ თვალსაჩინო სწორ მონაკვეთზე. შროშაში თიხის ჭურჭლის საყიდლად ნაღდი ფული იქონიეთ
    და ნაყიდი კარგად შეფუთეთ: საბარგულში თავისუფლად დაგორებულ თიხას გზა არ უყვარს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთისკენ გაჰყევით გორისა და ხაშურის გავლით. სურამისა და სოფელ
    ჭუმათელეთის შემდეგ უღელტეხილისკენ აღმართი იწყება — დედაქალაქიდან დაახლოებით 143 კმ და 1 საათი და 50
    წუთი. მთავარი გზა 1722-მეტრიან გვირაბში შედის; თავად მწვერვალზე ასასვლელად ძველ გზას აუყევით, რომელიც
    რუკებზე რიკოთის გვირაბის შემოსავლელ გზად (შ56) არის აღნიშნული. ახალი მაგისტრალის მონაკვეთების გახსნასთან
    ერთად გადასახვევები და ზოლები იცვლება, ამიტომ ძველ რუკას კი არა, ადგილზე არსებულ ნიშნებს მიჰყევით.
    გზა მთელ სიგრძეზე მოასფალტებულია და ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავი და საჭმელი —
    ხაშურსა და სურამში, სადაც გზისპირა დახლებზე პურსა და ჩურჩხელას ყიდიან.
en:
  name: Rikoti Pass
  short: >-
    A 996-metre saddle of the Likhi Range where Georgia's waters divide between Black Sea and Caspian,
    with a 1982 tunnel below and an old forest road above.
  body: >-
    **Rikoti is not high — 996 metres — but it is where Georgia makes up its mind which sea it belongs
    to.**


    The pass crosses the Likhi Range, the north–south spur of the Caucasus that splits the country in
    two. Rain falling on its eastern slopes drains towards the Caspian; on the western slopes it runs
    to the Black Sea. The divide is not only hydrological: east of it lies open, drier Kartli, west of
    it humid, wooded Imereti, and each half has long kept its own climate, landscape and history. The
    saddle itself sits on the boundary of the Khashuri and Kharagauli municipalities, at the head of the
    little Rikotula river, on Palaeozoic granite wrapped in Colchic broadleaf forest.


    For most drivers the pass is a stretch of darkness. In 1982 the Tbilisi–Kutaisi highway was taken
    through a rock-cut tunnel 1,722 metres long, renovated in 2010–2011, and Georgia's busiest mountain
    crossing has run underground ever since. Above the tunnel, though, the old road still coils over the
    top, and travellers in no hurry still choose it for the forest.


    West of the summit the road drops along the Rikotula and Dzirula valleys, past riverside picnic spots
    and roadside restaurants. In Shrosha, potters line the road with jugs, bowls and clay pots; elsewhere
    locals sell baskets and wooden kitchenware. Near Ubisa village, a few metres from the road, stands
    Ubisa Monastery, one of the notable monuments of medieval Georgian architecture.


    A new motorway through the range — 52 kilometres, 53 tunnels, 96 bridges — is designed to carry the
    heavy traffic faster and deeper. Take the old road over the top at least once: the tunnel gets you
    to Kutaisi; the summit shows you what you crossed.
  tip: >-
    There is no ticket and nothing to open or close: this is a road, and the stop lasts as long as you
    like — half an hour at the top, longer if you picnic in the valleys below. The old summit road is
    narrow and twisting; in winter it can be snowy or icy even when the tunnel route is clear, so check
    the weather and do not trust summer tyres. Lorry traffic on the main road is heavy — overtake only
    on clear straights. Carry cash for the Shrosha pottery stalls, and pack what you buy well: loose clay
    does not enjoy a car boot.
  route: >-
    Take the S1 (E60) west from Tbilisi past Gori and Khashuri. After Surami and the village of Chumateleti
    the climb to the pass begins, about 143 km and 1 hour 50 minutes from the capital. The main highway
    dives into the 1,722-metre tunnel; to reach the summit itself, take the old road over the top, marked
    on maps as the Rikoti tunnel bypass (Sh56). As sections of the new motorway open, junctions and lanes
    change, so follow the signs on the ground rather than an old map. The road is paved throughout and
    an economy car is all you need. Fuel and food in Khashuri and Surami, where roadside stalls sell bread
    and churchkhela.
ru:
  name: Рикотский перевал
  short: >-
    Седловина Лихского хребта высотой 996 м, где воды Грузии делятся между Чёрным и Каспийским морями:
    внизу тоннель 1982 года, наверху старая лесная дорога.
  body: >-
    **Рикоти невысок — 996 метров, — но именно здесь Грузия решает, к какому морю она принадлежит.**


    Перевал пересекает Лихский хребет — отрог Кавказа, протянувшийся с севера на юг и разделяющий страну
    надвое. Дождь, упавший на восточные склоны, стекает к Каспию, на западные — к Чёрному морю. Водораздел
    здесь не только гидрологический: к востоку лежит открытая, более сухая Картли, к западу — влажная,
    лесистая Имерети, и у каждой половины издавна свой климат, свой ландшафт и своя история. Сама седловина
    находится на границе Хашурского и Харагаульского муниципалитетов, у истоков речки Рикотула, на палеозойских
    гранитах, укутанных колхидским широколиственным лесом.


    Для большинства водителей перевал — это отрезок темноты. В 1982 году шоссе Тбилиси — Кутаиси провели
    через пробитый в скале тоннель длиной 1722 метра, реконструированный в 2010–2011 годах, и с тех пор
    самая оживлённая горная трасса Грузии идёт под землёй. Но над тоннелем старая дорога по-прежнему вьётся
    через седловину, и путники, которым некуда спешить, всё ещё выбирают её ради леса.


    К западу от седловины дорога спускается по долинам Рикотулы и Дзирулы, мимо мест для пикника у реки
    и придорожных ресторанов. В Шроше гончары выставляют вдоль обочины кувшины, миски и глиняные горшки;
    в других местах местные жители продают корзины и деревянную кухонную утварь. У села Убиса, в нескольких
    метрах от дороги, стоит монастырь Убиса — один из заметных памятников средневековой грузинской архитектуры.


    Новая автомагистраль через хребет — 52 километра, 53 тоннеля, 96 мостов — задумана, чтобы пропускать
    тяжёлый поток быстрее и глубже. Хотя бы раз поезжайте поверху, через перевал: тоннель доставит вас
    в Кутаиси, а перевал покажет, что именно вы пересекли.
  tip: >-
    Билетов нет, и открываться-закрываться здесь нечему: это дорога, и остановка длится столько, сколько
    захотите, — полчаса наверху, дольше, если устроите пикник в долинах ниже. Старая дорога через перевал
    узкая и извилистая; зимой на ней может лежать снег или лёд, даже когда путь через тоннель чист, так
    что следите за погодой и не полагайтесь на летнюю резину. Грузовиков на главной трассе много — обгоняйте
    только на прямых участках с хорошим обзором. Возьмите наличные для гончарных лотков Шроши и хорошо
    упакуйте покупки: незакреплённая керамика в багажнике долго не живёт.
  route: >-
    Из Тбилиси по S1 (E60) на запад мимо Гори и Хашури. После Сурами и села Чумателети начинается подъём
    к перевалу — около 143 км и 1 час 50 минут от столицы. Основная трасса уходит в тоннель длиной 1722
    метра; чтобы попасть на саму седловину, поезжайте по старой верхней дороге, обозначенной на картах
    как объезд Рикотского тоннеля (Sh56). По мере открытия участков новой магистрали развязки и полосы
    меняются, поэтому ориентируйтесь на указатели на месте, а не на старую карту. Дорога асфальтирована
    на всём протяжении, и машины эконом-класса вполне достаточно. Топливо и еда — в Хашури и Сурами, где
    у дороги продают хлеб и чурчхелу.
fa:
  name: گردنهٔ ریکوتی
  short: >-
    گردنه‌ای ۹۹۶ متری در رشته‌کوه لیخی که آب‌های گرجستان در آن میان دریای سیاه و خزر تقسیم می‌شوند؛ تونلی
    از ۱۹۸۲ در زیر و جاده‌ای کهنه و جنگلی در بالا.
  body: >-
    **ریکوتی بلند نیست — ۹۹۶ متر — اما همین‌جاست که گرجستان تصمیم می‌گیرد از آنِ کدام دریاست.**


    این گردنه از رشته‌کوه لیخی می‌گذرد، شاخه‌ای شمالی–جنوبی از قفقاز که کشور را دو نیم می‌کند. بارانی
    که بر دامنه‌های شرقی‌اش می‌بارد به سوی خزر روان می‌شود و آنچه بر دامنه‌های غربی می‌بارد به دریای سیاه
    می‌رسد. این مرز تنها آب‌شناختی نیست: در شرق، کارتلیِ باز و خشک‌تر گسترده است و در غرب، ایمرتیِ مرطوب
    و جنگلی؛ و هر نیمه از دیرباز آب‌وهوا، چشم‌انداز و تاریخ خود را داشته است. خودِ گردنه بر مرز شهرداری‌های
    خاشوری و خاراگائولی، در سرچشمهٔ رود کوچک ریکوتولا، بر گرانیت‌های پالئوزوئیک جای دارد که جنگل پهن‌برگ
    کلخیدی آن‌ها را پوشانده است.


    برای بیشتر رانندگان، گردنه تکه‌ای از تاریکی است. در سال ۱۹۸۲ بزرگراه تفلیس–کوتائیسی از تونلی سنگ‌بری‌شده
    به طول ۱٬۷۲۲ متر گذرانده شد که در ۲۰۱۰–۲۰۱۱ نوسازی شد، و پرترددترین گذرگاه کوهستانی گرجستان از آن
    پس زیر زمین است. با این همه، بالای تونل جادهٔ کهنه هنوز پیچ‌وتاب‌خوران از فراز کوه می‌گذرد و مسافرانی
    که شتابی ندارند، هنوز به خاطر جنگل آن را برمی‌گزینند.


    در غرب قله، جاده در امتداد دره‌های ریکوتولا و دزیرولا پایین می‌رود، از کنار گردشگاه‌های کنار رود و
    رستوران‌های کنار جاده. در شروشا سفالگران کوزه‌ها، کاسه‌ها و دیگ‌های سفالی را کنار جاده می‌چینند؛ جاهای
    دیگر، مردم محلی سبد و ظروف چوبی آشپزخانه می‌فروشند. نزدیک روستای اوبیسا، چند متری جاده، صومعهٔ اوبیسا
    ایستاده است، یکی از بناهای شاخص معماری گرجیِ سده‌های میانه.


    بزرگراهی تازه از میان این رشته‌کوه — ۵۲ کیلومتر، ۵۳ تونل، ۹۶ پل — طراحی شده تا ترافیک سنگین را سریع‌تر
    و در عمقی بیشتر عبور دهد. دست‌کم یک بار از جادهٔ کهنه از فراز کوه بگذرید: تونل شما را به کوتائیسی
    می‌رساند؛ قله نشانتان می‌دهد از چه گذشته‌اید.
  tip: >-
    نه بلیتی در کار است و نه ساعت کاری: این‌جا یک جاده است و توقف هر قدر بخواهید طول می‌کشد — نیم ساعت
    بر فراز گردنه، و بیشتر اگر در دره‌های پایین پیک‌نیک کنید. جادهٔ کهنهٔ فراز کوه باریک و پرپیچ است؛
    در زمستان ممکن است برفی یا یخ‌زده باشد حتی وقتی مسیر تونل باز است، پس هوا را بررسی کنید و به لاستیک
    تابستانی اعتماد نکنید. ترافیک کامیون در جادهٔ اصلی سنگین است — فقط در مسیرهای مستقیم و با دید کافی
    سبقت بگیرید. برای غرفه‌های سفال شروشا پول نقد همراه داشته باشید و خریدهایتان را خوب بسته‌بندی کنید:
    سفالِ رها در صندوق عقب دوام نمی‌آورد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب، از کنار گوری و خاشوری، بروید. پس از سورامی و روستای چوماتلتی
    سربالایی به سوی گردنه آغاز می‌شود، حدود ۱۴۳ کیلومتر و یک ساعت و ۵۰ دقیقه از پایتخت. بزرگراه اصلی به
    درون تونل ۱٬۷۲۲ متری فرو می‌رود؛ برای رسیدن به خود گردنه، جادهٔ کهنهٔ فراز کوه را بگیرید که روی نقشه‌ها
    با نام کنارگذر تونل ریکوتی (Sh56) آمده است. با گشایش بخش‌های بزرگراه جدید، تقاطع‌ها و خطوط تغییر می‌کنند؛
    پس به تابلوهای راهنمای سر راه تکیه کنید، نه به نقشه‌ای قدیمی. جاده سراسر آسفالت است و خودروی اقتصادی
    کاملاً کافی است. سوخت و غذا در خاشوری و سورامی، جایی که غرفه‌های کنار جاده نان و چورچخلا می‌فروشند.
he:
  name: מעבר ריקוטי
  short: >-
    אוכף בגובה 996 מטר ברכס ליחי, שבו מתחלקים מימי גאורגיה בין הים השחור לים הכספי — מנהרה משנת 1982 מתחת
    ודרך יער ישנה מעל.
  body: >-
    **ריקוטי אינו גבוה — 996 מטר — אבל כאן מחליטה גאורגיה לאיזה ים היא שייכת.**


    המעבר חוצה את רכס ליחי, שלוחה של הקווקז הנמתחת מצפון לדרום ומחלקת את המדינה לשניים. גשם היורד על מדרונותיו
    המזרחיים מתנקז אל הים הכספי, ומה שיורד על המדרונות המערביים זורם אל הים השחור. קו פרשת המים אינו רק
    הידרולוגי: ממזרח לו משתרעת קרתלי הפתוחה והיבשה יותר, ממערב לו אימרתי הלחה והמיוערת, וכל חצי שמר לאורך
    הדורות אקלים, נוף והיסטוריה משלו. האוכף עצמו שוכן על הגבול בין המוניציפליות חשורי וחרגאולי, סמוך למקורות
    נחל ריקוטולה הקטן, על גרניט פליאוזואי העטוף ביער קולכי רחב-עלים.


    לרוב הנהגים המעבר הוא קטע של חושך. ב-1982 הועבר כביש טביליסי–קותאיסי במנהרה חצובה בסלע באורך 1,722
    מטר, ששופצה ב-2010–2011, ומאז עובר מעבר ההרים העמוס ביותר בגאורגיה מתחת לאדמה. אבל מעל המנהרה הדרך
    הישנה עדיין מתפתלת מעל הפסגה, ומטיילים שאינם ממהרים עדיין בוחרים בה בשביל היער.


    ממערב לפסגה יורדת הדרך לאורך עמקי הריקוטולה והדזירולה, על פני מקומות פיקניק לצד הנהר ומסעדות דרכים.
    בשרושה מציבים הקדרים לאורך הכביש כדים, קערות וסירי חרס; במקומות אחרים מוכרים המקומיים סלים וכלי מטבח
    מעץ. ליד הכפר אוביסה, מטרים ספורים מן הכביש, ניצב מנזר אוביסה, מן המונומנטים הבולטים של האדריכלות
    הגאורגית בימי הביניים.


    כביש מהיר חדש דרך הרכס — 52 קילומטרים, 53 מנהרות, 96 גשרים — מתוכנן להעביר את התנועה הכבדה מהר יותר
    ועמוק יותר. סעו לפחות פעם אחת בדרך הישנה מעל הפסגה: המנהרה תביא אתכם לקותאיסי; הפסגה תראה לכם מה חציתם.
  tip: >-
    אין כרטיס ואין שעות פתיחה: זו דרך, והעצירה נמשכת כמה שתרצו — חצי שעה בפסגה, יותר אם תעשו פיקניק בעמקים
    שלמטה. הדרך הישנה מעל הפסגה צרה ומפותלת; בחורף היא עלולה להיות מושלגת או קפואה גם כשנתיב המנהרה פנוי,
    אז בדקו את מזג האוויר ואל תסמכו על צמיגי קיץ. תנועת המשאיות בכביש הראשי כבדה — עקפו רק בקטעים ישרים
    עם שדה ראייה פתוח. הביאו מזומן לדוכני הקדרות בשרושה, וארזו היטב את מה שקניתם: חרס רופף לא אוהב תא
    מטען.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), על פני גורי וחשורי. אחרי סורמי והכפר צ'ומטלטי מתחילה העלייה אל
    המעבר, כ-143 ק״מ ושעה ו-50 דקות מהבירה. הכביש הראשי צולל אל המנהרה באורך 1,722 מטר; כדי להגיע אל האוכף
    עצמו, סעו בדרך הישנה מעל הפסגה, המסומנת במפות כעוקף מנהרת ריקוטי (Sh56). ככל שנפתחים קטעים של הכביש
    המהיר החדש, המחלפים והנתיבים משתנים, ולכן היצמדו לשלטים בשטח ולא למפה ישנה. הכביש סלול לכל אורכו,
    ורכב אקונומי הוא כל מה שצריך. דלק ואוכל בחשורי ובסורמי, שם מוכרים בדוכנים לצד הדרך לחם וצ'ורצ'חלה.
ar:
  name: ممرّ ريكوتي
  short: >-
    ممرّ جبلي على ارتفاع 996 متراً في سلسلة ليخي، تتوزع عنده مياه جورجيا بين البحر الأسود وبحر قزوين؛
    تحته نفق من عام 1982، وفوقه طريق غابيّ قديم.
  body: >-
    **ليس ريكوتي عالياً — 996 متراً فحسب — لكنه المكان الذي تحسم فيه جورجيا إلى أيّ بحر تنتمي.**


    يعبر الممرّ سلسلة ليخي، ذلك الفرع الممتد من الشمال إلى الجنوب من القوقاز الذي يشطر البلاد شطرين. المطر
    الذي يهطل على منحدراتها الشرقية ينصرف نحو بحر قزوين، وما يهطل على منحدراتها الغربية يجري إلى البحر
    الأسود. وليس هذا الحدّ مائياً فحسب: فإلى شرقه تمتد كارتلي المكشوفة الأكثر جفافاً، وإلى غربه إيميريتي
    الرطبة المكسوّة بالغابات، ولكلّ شطرٍ منذ زمن بعيد مناخه وطبيعته وتاريخه. أما أعلى نقطة في الممرّ فتقع
    على الحدّ بين بلديتَي خاشوري وخاراغاولي، عند منابع نهير ريكوتولا، على صخور غرانيتية من الحقب القديم
    (الباليوزوي) تكسوها غابة كولخيدية عريضة الأوراق.


    بالنسبة لمعظم السائقين، الممرّ مقطع من الظلام. ففي عام 1982 مُرِّر طريق تبليسي–كوتايسي عبر نفق منحوت
    في الصخر طوله 1,722 متراً، جُدِّد في 2010–2011، ومنذ ذلك الحين يمرّ أكثر المعابر الجبلية ازدحاماً
    في جورجيا تحت الأرض. غير أن الطريق القديم ما زال يتلوّى فوق النفق عبر القمة، وما زال المسافرون غير
    المستعجلين يختارونه من أجل الغابة.


    غرب القمة ينحدر الطريق على امتداد واديي ريكوتولا ودزيرولا، مارّاً بمواضع للنزهة على ضفاف النهر ومطاعم
    على جانب الطريق. في شروشا يصفّ الخزّافون على حافة الطريق الجرار والأوعية والقدور الفخارية، وفي أماكن
    أخرى يبيع الأهالي السلال وأدوات المطبخ الخشبية. وقرب قرية أوبيسا، على بعد أمتار من الطريق، يقوم دير
    أوبيسا، أحد المعالم البارزة للعمارة الجورجية في العصور الوسطى.


    صُمِّم طريق سريع جديد عبر السلسلة — 52 كيلومتراً و53 نفقاً و96 جسراً — ليحمل حركة المرور الثقيلة بسرعة
    أكبر وفي عمق أكبر. اسلك الطريق القديم فوق القمة مرة واحدة على الأقل: النفق يوصلك إلى كوتايسي، أما
    القمة فتريك ما عبرته.
  tip: >-
    لا تذكرة هنا ولا مواعيد فتح وإغلاق: إنه طريق، والتوقف يطول بقدر ما تشاء — نصف ساعة في الأعلى، وأكثر
    إن تنزّهت في الوديان أسفله. الطريق القديم فوق القمة ضيق كثير المنعطفات، وقد يغطيه الثلج أو الجليد
    شتاءً حتى حين يكون طريق النفق سالكاً، فتابع حالة الطقس ولا تثق بالإطارات الصيفية. حركة الشاحنات على
    الطريق الرئيسي كثيفة، فلا تتجاوز إلا على المقاطع المستقيمة المكشوفة. احمل نقداً لأكشاك الفخار في شروشا،
    وغلّف ما تشتريه جيداً: فالفخار السائب لا يحتمل صندوق السيارة.
  route: >-
    من تبليسي اسلك S1 (E60) غرباً مروراً بغوري وخاشوري. بعد سورامي وقرية تشوماتيليتي يبدأ الصعود نحو الممرّ،
    على بعد نحو 143 كم وساعة و50 دقيقة من العاصمة. يغوص الطريق الرئيسي في النفق البالغ طوله 1,722 متراً؛
    وللوصول إلى أعلى نقطة في الممرّ خذ الطريق القديم فوق القمة، المسمّى على الخرائط الطريق الالتفافي لنفق
    ريكوتي (Sh56). ومع افتتاح مقاطع من الطريق السريع الجديد تتغير التقاطعات والمسارات، فاتبع اللافتات
    القائمة على الطريق لا خريطة قديمة. الطريق معبّد بالكامل، والسيارة الاقتصادية تكفيك. الوقود والطعام
    في خاشوري وسورامي، حيث تبيع الأكشاك على جانب الطريق الخبز والتشورتشخيلا.
