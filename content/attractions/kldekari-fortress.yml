ka:
  name: კლდეკარის ციხე
  short: >-
    ტრიალეთის ქედზე მდებარე ციხის ნანგრევები, რომელიც ერთ დროს საქართველოს ყველაზე ძლიერი ფეოდალური სამთავროს
    ცენტრი იყო.
  body: >-
    **კლდეკარი უფრო ისტორიაა, ვიდრე ნახავი.** ციხის ნაშთები თეძმის ხეობის სათავეში, ტრიალეთის ქედის კლდოვან
    ქიმზეა და მისვლა ფეხით ან სერიოზული ჯიპით ხდება. ვინც სრულყოფილ კედლებს ელოდება, იმედგაცრუებული დარჩება;
    ვისაც ქართული შუასაუკუნეების პოლიტიკა აინტერესებს, ამ ადგილს გამოტოვებას ვერ აპატიებს.


    ციხე 876 წელს ლიპარიტ ბაღვაშმა ააგო. მისმა შთამომავლებმა კლდეკარის საერისთავო შექმნეს, რომელიც X-XI
    საუკუნეებში ფაქტობრივად დამოუკიდებელი ძალა იყო: ბაღვაშები მეფეებს აყენებდნენ და ამხობდნენ, ბიზანტიასთან
    ცალკე მოლაპარაკებას აწარმოებდნენ და ერთ მომენტში სამეფო ხელისუფლებაზე ძლიერნიც კი აღმოჩნდნენ. სწორედ
    ეს იყო მიზეზი, რის გამოც დავით აღმაშენებელმა 1103-1104 წლებში საერისთავო საბოლოოდ გააუქმა და ბაღვაშები
    ქვეყნიდან გაასახლა. ამის შემდეგ ციხემ მნიშვნელობა დაკარგა.


    დღეს ქიმზე კედლების მონაკვეთები, კოშკის ქვედა ნაწილი და წყალსაცავის კვალი შემორჩა, ბალახსა და ბუჩქებში.
    სახელი — „კლდე" და „კარი" — ზუსტად აღწერს ადგილს: კლდეში გაჭრილი კარიბჭე, საიდანაც შიდა ქართლიდან
    ტრიალეთისკენ გადადიოდნენ.


    ხედი ღირს ასვლად: ჩრდილოეთით მტკვრის ველი და კავკასიონი, სამხრეთით ტრიალეთის ზეგანი. ივნისიდან სექტემბრამდე
    ალპური მდელოები ყვავილობს. ოქტომბრის შემდეგ ამინდი სწრაფად იცვლება და თოვლი ადრე მოდის.
  tip: >-
    ეს მთელი დღეა, არა გაჩერება გზაზე. რკონიდან აღმართში სამიოდე საათი სჭირდება ერთი მიმართულებით, ბილიკი
    მონიშნული არ არის — GPS ტრეკი ან ადგილობრივი გამცილებელი აუცილებელია. წყალი წამოიღეთ, ზემოთ წყარო
    ყოველთვის არ არის. ამინდი ქედზე სწრაფად იცვლება, ქარსაფარი და თბილი ტანსაცმელი საჭიროა ზაფხულშიც.
    მობილურის კავშირი არასტაბილურია. მარტო ასვლა არ არის სასურველი.
  route: >-
    თბილისიდან იგოეთამდე E60-ით, შემდეგ კასპისა და ჩაჩუბეთის გავლით თეძმის ხეობით რკონამდე — 75 კმ, აქედან
    55 კმ ასფალტი, დანარჩენი ხრეში მდინარის გადასასვლელებით. რკონიდან ზემოთ მხოლოდ მაღალი გამავლობის ჯიპი
    ადის და ისიც მშრალ ამინდში; უმეტესობა მანქანას რკონში ტოვებს და ფეხით ადის. სულ 85 კმ და ორნახევარი
    საათი მართვა კარგ დღეს. საწვავი კასპში აიღეთ.
en:
  name: Kldekari Fortress
  short: Ruined walls on the Trialeti ridge, once the centre of the most powerful feudal principality
    in Georgia.
  body: >-
    **Kldekari is more history than sight.** What is left of the fortress sits on a rocky crest at the
    head of the Tedzami valley, on the Trialeti ridge, and getting there means walking or driving a serious
    off-road vehicle. Anyone expecting intact walls will be disappointed; anyone interested in medieval
    Georgian politics will not forgive themselves for skipping it.


    The castle was built in 876 by Liparit Baghvashi. His descendants turned it into the Duchy of Kldekari,
    which through the 10th and 11th centuries operated as an effectively independent power. The Baghvashis
    made and unmade kings, negotiated separately with Byzantium, and at moments held more real strength
    than the crown itself. That is precisely why David the Builder abolished the duchy in 1103-1104 and
    exiled the family from the country. After that the fortress lost its purpose.


    Today the crest holds sections of wall, the lower part of a tower and traces of a cistern, all half
    buried in grass and scrub. The name — from the Georgian words for cliff and gate — describes the place
    exactly: a gateway cut through rock where the route crossed from Shida Kartli into Trialeti.


    The view repays the climb. North lie the Mtkvari plain and the Greater Caucasus; south, the Trialeti
    plateau rolls away in bare ridges. From June to September the alpine meadows are in flower. After
    October the weather turns quickly and snow arrives early.
  tip: >-
    This is a full day out, not a roadside stop. From Rkoni the climb takes roughly three hours each way,
    and the path is not waymarked, so a GPS track or a local guide is essential. Carry water; springs
    higher up are not reliable. Weather on the ridge changes fast, and a windproof layer plus something
    warm is needed even in July. Mobile coverage is patchy. Going up alone is not advisable.
  route: >-
    Take the E60 from Tbilisi to Igoeti, then head south through Kaspi and Chachubeti and along the Tedzami
    gorge to Rkoni — 75 km, of which 55 are asphalt and the rest gravel with river fords. Above Rkoni
    only a high-clearance four-wheel drive continues, and only in dry conditions; most people leave the
    car at Rkoni and walk. Eighty-five kilometres in total and about two and a half hours of driving on
    a good day. Refuel in Kaspi.
ru:
  name: Крепость Клдекари
  short: Развалины стен на Триалетском хребте, некогда центр самого сильного феодального княжества Грузии.
  body: >-
    **Клдекари — это больше история, чем зрелище.** То, что осталось от крепости, стоит на скалистом гребне
    в верховьях Тедзамской долины, на Триалетском хребте, и добираться туда приходится пешком или на серьёзном
    внедорожнике. Тот, кто ждёт целых стен, будет разочарован; тому, кому интересна средневековая грузинская
    политика, пропустить это место будет жаль.


    Замок построил в 876 году Липарит Багваши. Его потомки создали Клдекарское эриставство, которое в
    X-XI веках действовало как фактически независимая сила. Багваши ставили и свергали царей, вели отдельные
    переговоры с Византией и в отдельные моменты обладали большей реальной властью, чем корона. Именно
    поэтому Давид Строитель в 1103-1104 годах упразднил княжество и выслал род из страны. После этого
    крепость потеряла смысл.


    Сегодня на гребне сохранились отрезки стен, нижняя часть башни и следы цистерны, наполовину скрытые
    травой и кустарником. Название — от грузинских слов «скала» и «ворота» — описывает место точно: проход,
    прорубленный в скале там, где дорога переходила из Шида-Картли в Триалети.


    Вид окупает подъём. На севере — долина Мтквари и Большой Кавказ; на юге голыми гребнями уходит Триалетское
    плато. С июня по сентябрь цветут альпийские луга. После октября погода меняется быстро, и снег ложится
    рано.
  tip: >-
    Это выезд на целый день, а не остановка у дороги. От Ркони подъём занимает около трёх часов в одну
    сторону, тропа не маркирована, поэтому нужен GPS-трек или местный проводник. Берите воду: родники
    выше по склону не всегда есть. Погода на гребне меняется стремительно, ветрозащитный слой и что-то
    тёплое нужны даже в июле. Связь неустойчивая. Подниматься в одиночку не стоит.
  route: >-
    По E60 из Тбилиси до Игоети, затем на юг через Каспи и Чачубети по Тедзамскому ущелью до Ркони — 75
    км, из них 55 асфальт, остальное гравий с бродами. Выше Ркони проходит только высокий полноприводный
    внедорожник и только в сухую погоду; большинство оставляет машину в Ркони и идёт пешком. Всего 85
    км и около двух с половиной часов за рулём в хороший день. Заправляйтесь в Каспи.
fa:
  name: قلعهٔ کلدکاری
  short: دیوارهای ویران بر یال تریالتی، که روزگاری مرکز نیرومندترین امیرنشین فئودالی گرجستان بود.
  body: >-
    **کلدکاری بیش از آنکه دیدنی باشد، تاریخ است.** آنچه از قلعه مانده بر تیغه‌ای صخره‌ای در سرچشمهٔ درّهٔ
    تدزامی، روی یال تریالتی، قرار دارد و رسیدن به آن یا پیاده است یا با خودروی آفرود جدی. هر که انتظار
    دیوارهای سالم داشته باشد ناامید می‌شود؛ و هر که به سیاست گرجستان در سده‌های میانه علاقه‌مند باشد،
    از نادیده گذاشتنش پشیمان خواهد شد.


    قلعه را در سال ۸۷۶ لیپاریت باغواشی ساخت. بازماندگان او آن را به امیرنشین کلدکاری بدل کردند که در سده‌های
    دهم و یازدهم عملاً همچون قدرتی مستقل عمل می‌کرد. باغواشی‌ها پادشاهان را بر تخت می‌نشاندند و از تخت
    به زیر می‌کشیدند، جداگانه با بیزانس مذاکره می‌کردند، و در برهه‌هایی نیرویی واقعی‌تر از خود تاج داشتند.
    دقیقاً به همین سبب داوید سازنده در ۱۱۰۳ تا ۱۱۰۴ امیرنشین را برانداخت و خاندان را از کشور تبعید کرد.
    پس از آن قلعه کارکرد خود را از دست داد.


    امروز بر تیغه پاره‌هایی از دیوار، بخش پایینی یک برج و رد آب‌انباری مانده است، همه نیمه‌پنهان در علف
    و بوته. نام آن، از واژه‌های گرجی صخره و دروازه، این جا را دقیق وصف می‌کند: دروازه‌ای بریده در سنگ،
    جایی که راه از شیدا کارتلی به تریالتی می‌گذشت.


    چشم‌انداز، بهای بالا رفتن را می‌پردازد. در شمال دشت مْتکواری و قفقاز بزرگ و در جنوب فلات تریالتی با
    یال‌های برهنه گسترده است. از خرداد تا شهریور چمنزارهای کوهستانی گل می‌دهند. پس از مهر هوا تند دگرگون
    می‌شود و برف زود می‌آید.
  tip: >-
    این یک روز کامل است، نه توقفی کنار جاده. از رکونی بالا رفتن حدود سه ساعت در هر جهت طول می‌کشد و مسیر
    علامت‌گذاری ندارد، پس مسیر جی‌پی‌اس یا راهنمای محلی ضروری است. آب همراه ببرید؛ چشمه‌های بالادست همیشه
    قابل اتکا نیستند. هوای یال به‌سرعت عوض می‌شود و لایهٔ بادگیر و پوشاک گرم حتی در تیر لازم است. آنتن‌دهی
    پراکنده است. تنها بالا رفتن توصیه نمی‌شود.
  route: >-
    از تفلیس روی E60 تا ایگوئتی، سپس به جنوب از کاسپی و چاچوبتی و در امتداد درّهٔ تدزامی تا رکونی — ۷۵
    کیلومتر که ۵۵ کیلومتر آن آسفالت و باقی شنی با گذر از رود است. بالاتر از رکونی تنها خودروی چهارچرخ‌محرکِ
    بلند پیش می‌رود، آن هم در هوای خشک؛ بیشتر مردم خودرو را در رکونی می‌گذارند و پیاده می‌روند. روی‌هم
    ۸۵ کیلومتر و حدود دو ساعت و نیم رانندگی در روزی خوب. سوخت را در کاسپی بگیرید.
he:
  name: מבצר קלדקארי
  short: חומות הרוסות על רכס טריאלטי, שהיו פעם מרכז הנסיכות הפיאודלית החזקה ביותר בגאורגיה.
  body: >-
    **קלדקארי הוא היסטוריה יותר מאשר מראה.** מה שנותר מן המבצר יושב על רכס סלעי בראש עמק הטדזאמי, על רכס
    טריאלטי, וההגעה אליו היא ברגל או ברכב שטח רציני. מי שמצפה לחומות שלמות יתאכזב; ומי שמתעניין בפוליטיקה
    הגאורגית של ימי הביניים לא יסלח לעצמו אם ידלג עליו.


    את הטירה בנה בשנת 876 ליפאריט באגוואשי. צאצאיו הפכו אותה לדוכסות קלדקארי, שפעלה במאות ה-10 וה-11 ככוח
    עצמאי למעשה. בני באגוואשי הכתירו מלכים והפילו אותם, ניהלו מגעים נפרדים עם ביזנטיון, ובזמנים מסוימים
    החזיקו בכוח ממשי רב יותר מן הכתר עצמו. בדיוק משום כך ביטל דוד הבנאי את הדוכסות ב-1103-1104 והגלה את
    המשפחה מן הארץ. מאז איבד המבצר את תכליתו.


    כיום נותרו על הרכס קטעי חומה, חלקו התחתון של מגדל ושרידי בור מים, כולם חצי קבורים בעשב ובשיחים. השם,
    מן המילים הגאורגיות לצוק ולשער, מתאר את המקום במדויק: שער חצוב בסלע במקום שבו עברה הדרך משידה קרתלי
    אל טריאלטי.


    הנוף מצדיק את הטיפוס. בצפון מישור המטקווארי והקווקז הגדול; בדרום מתגלגלת רמת טריאלטי ברכסים חשופים.
    מיוני עד ספטמבר אחו ההרים בפריחה. אחרי אוקטובר מזג האוויר מתהפך מהר והשלג מקדים.
  tip: >-
    זהו יום שלם, לא עצירה בצד הדרך. מרקוני הטיפוס אורך כשלוש שעות לכל כיוון, והשביל אינו מסומן, לכן מסלול
    ניווט לוויני או מדריך מקומי הכרחיים. קחו מים; מעיינות במעלה אינם אמינים. מזג האוויר על הרכס משתנה
    במהירות, ושכבה נגד רוח ובגד חם נחוצים גם ביולי. הקליטה חלקית. אין להעפיל לבד.
  route: >-
    סעו מטביליסי בכביש E60 עד איגואתי, ואז דרומה דרך קאספי וצ'אצ'ובתי ולאורך ערוץ הטדזאמי עד רקוני — 75
    ק״מ, מתוכם 55 סלולים והשאר חצץ עם מעברי נהר. מעל רקוני ממשיך רק רכב הנעה כפולה עם מרווח גחון גבוה,
    ורק בתנאים יבשים; רוב האנשים משאירים את הרכב ברקוני והולכים ברגל. 85 ק״מ בסך הכול וכשעתיים וחצי נהיגה
    ביום טוב. תדלקו בקאספי.
ar:
  name: قلعة كلدكاري
  short: أسوار خربة على يال تريالتي، كانت يوماً مركز أقوى إمارة إقطاعية في جورجيا.
  body: >-
    **كلدكاري تاريخ أكثر منها مشهداً.** فما بقي من القلعة يقوم على حرف صخري في أعلى وادي تدزامي على يال
    تريالتي، والوصول إليه يكون سيراً أو بمركبة طرق وعرة حقيقية. ومن يتوقع أسواراً سليمة سيخيب ظنه؛ ومن
    يهتم بسياسة جورجيا في العصور الوسطى لن يغفر لنفسه تجاوزها.


    بنى القلعة عام 876 ليباريت باغفاشي. وحوّلها أحفاده إلى دوقية كلدكاري التي عملت خلال القرنين العاشر
    والحادي عشر كقوة مستقلة فعلياً. كان آل باغفاشي يصنعون الملوك ويعزلونهم، ويتفاوضون مع بيزنطة على حدة،
    وامتلكوا في لحظات قوة أكبر من قوة التاج نفسه. ولهذا بالذات ألغى داوود البنّاء الدوقية بين 1103 و1104
    ونفى الأسرة من البلاد. ومنذ ذلك الحين فقدت القلعة غايتها.


    واليوم يحمل الحرف الصخري مقاطع من الأسوار، وقاعدة برج، وأثر صهريج، كلها نصف مدفونة في العشب والشجيرات.
    والاسم، من الكلمتين الجورجيتين للصخرة والباب، يصف المكان بدقة: باب مشقوق في الصخر حيث كان الطريق يعبر
    من شيدا كارتلي إلى تريالتي.


    والمنظر يكافئ الصعود. في الشمال سهل متكفاري والقوقاز الكبرى؛ وفي الجنوب تتدحرج هضبة تريالتي بحروف
    عارية. ومن حزيران إلى أيلول تزهر مروج المرتفعات. وبعد تشرين الأول يتقلب الطقس سريعاً ويبكر الثلج.
  tip: >-
    هذا يوم كامل لا محطة على الطريق. فالصعود من ركوني يستغرق نحو ثلاث ساعات في كل اتجاه، والدرب غير معلّم،
    فمسار جي بي إس أو دليل محلي ضروري. واحمل الماء؛ فالينابيع في الأعلى غير مضمونة. والطقس على الحرف يتبدل
    بسرعة، وطبقة صادّة للريح وشيء دافئ لازمان حتى في تموز. والتغطية متقطعة. ولا يُنصح بالصعود منفرداً.
  route: >-
    خذ الطريق E60 من تبليسي إلى إيغويتي، ثم اتجه جنوباً عبر كاسبي وتشاتشوبيتي وبمحاذاة وادي تدزامي حتى
    ركوني — 75 كم، منها 55 معبّدة والباقي حصى مع مخاضات. وفوق ركوني لا يواصل إلا دفع رباعي مرتفع، وفي
    الجو الجاف وحده؛ ويترك معظم الناس السيارة في ركوني ويمشون. خمسة وثمانون كيلومتراً إجمالاً ونحو ساعتين
    ونصف قيادة في يوم جيد. تزوّد بالوقود في كاسبي.
