ka:
  name: კლდეკარის ციხე
  short: >-
    ბაღვაშების ბუდე ტრიალეთის ქედზე — „კლდის კარი“, რომლის პატრონები ორ საუკუნეზე მეტ ხანს გზებს აკონტროლებდნენ
    და მეფეებს სამეფოს ეცილებოდნენ.
  body: >-
    **კლდეკარი „კლდის კარს“ ნიშნავს — და ორ საუკუნეზე მეტ ხანს, ვინც ამ კარს ფლობდა, შეეძლო გზა ჩაეკეტა,
    ზოგჯერ კი მთელი სამეფოსთვის ეკარნახა პირობები.**


    ნანგრევები ტრიალეთის ქედზე, 2000-მეტრიან კლდეკარის მთასთან დგას, სადაც კლდოვანი უღელტეხილი აღმოსავლეთ
    საქართველოს სამხრეთელ მეზობლებთან და ბიზანტიასთან აკავშირებდა. 876 წელს აქ ციხე ლიპარიტ I ბაღვაშმა
    ააგო — ფეოდალმა, რომელიც აფხაზთა მეფეებმა არგვეთიდან განდევნეს. ტახტისთვის ბრძოლაში, რომელიც 888 წელს
    დასრულდა, მან გამარჯვებულ ადარნასე IV-ს დაუჭირა მხარი და ამით თავის გვარს ტრიალეთისა და კლდეკარის
    მემკვიდრეობითი საერისთავო მოუპოვა.


    მისი შთამომავლები გვირგვინის ყველაზე სახიფათო ვასალები გახდნენ. მათგან ყველაზე ძლიერმა, ლიპარიტ IV-მ,
    1042 წელს სასირეთთან ბაგრატ IV დაამარცხა და რამდენიმე წელი სამეფოს თითქმის ნახევარს განაგებდა; არაბი
    მემატიანე იბნ ალ-ასირი მას მეფედაც კი იხსენიებს. 1048 წელს სელჩუკებმა ტყვედ ჩაიგდეს, მაგრამ მალე გაათავისუფლეს
    — სომეხი მემატიანის, მათე ურჰაელის თქმით, მას შემდეგ, რაც ლიპარიტმა სულთნის თვალწინ ორთაბრძოლაში მოწინააღმდეგე
    დაამარცხა. 1060 წლის ახლო ხანებში საკუთარმა ხალხმა შეიპყრო და ბაგრატს ჩააბარა; მეფემ იგი ბერად აღკვეცა,
    ლიპარიტი კი კონსტანტინოპოლში გარდაიცვალა.


    დასასრული უხმაუროდ მოვიდა. დავით აღმაშენებელმა გვარი 1093 წელს დაიმორჩილა, 1103 წელს კი, როცა უკანასკნელი
    ერისთავი, რატი III, გარდაიცვალა, კლდეკარი უბრალოდ სამეფო სახასო მიწებს შემოუერთა.


    დღეს ქარისგან გაშიშვლებულ ქედზე ბალახმოდებული ნანგრევები და ჩამოქცეული კედლების ნაშთებია, მაგრამ ადგილი
    თავად ხსნის, რატომ აირჩიეს. მოწმენდილ დღეს ჩრდილოეთით მიწა მტკვრის ვაკისა და კავკასიონისკენ ეშვება,
    სამხრეთით კი ტრიალეთის შიშველი ზეგნები იშლება. ივნისიდან სექტემბრამდე მდელოები ყვავის, ოქტომბრის შემდეგ
    კი თოვლი ადრე მოდის. კარი დღეს აღარაფერს კეტავს. მასთან მისვლა კი ისევ ძნელია — და მის მშენებლებს
    ეს ალბათ ესიამოვნებოდათ.
  tip: >-
    ეს მთელი დღის ლაშქრობაა და არა გზისპირა გაჩერება. რკონიდან ასვლას ერთი მიმართულებით დაახლოებით სამი
    საათი სჭირდება და ათას მეტრზე მეტ სიმაღლეს იმატებთ; ბილიკი მონიშნული არ არის, ამიტომ სანავიგაციო ტრეკი
    ან ადგილობრივი გამყოლი აუცილებელია. წყალი მთელი დღისთვის თან წაიღეთ — ზემოთ წყაროებს ვერ დაეყრდნობით.
    ქედზე ამინდი სწრაფად იცვლება: ქარგაუმტარი და თბილი ტანსაცმელი ივლისშიც გამოგადგებათ, გზას კი ადრე
    დაადექით, რომ ნაშუადღევის ქარიშხლამდე ქედიდან ჩამოსული იყოთ. მობილური კავშირი არასტაბილურია. მარტო
    ნუ წახვალთ.
  route: >-
    თბილისიდან E60 (ს1) მაგისტრალით იგოეთამდე, იქიდან სამხრეთით, კასპისა და ჩაჩუბეთის გავლით, თეძმის ხეობით
    რკონის მონასტრამდე — 75 კილომეტრი, აქედან პირველი 55 ასფალტია, დანარჩენი კი ხრეში მდინარის ფონებით,
    რომელსაც ჯიპი მშრალ ამინდში უპრობლემოდ გაივლის. რკონიდან ზემოთ მხოლოდ მაღალი გამავლობის, ოთხივე წამყვანთვლიანი
    ავტომობილი ადის და ისიც მხოლოდ მშრალ გზაზე, ამიტომ უმეტესობა მანქანას მონასტერთან ტოვებს და ფეხით
    მიდის. თბილისიდან რკონამდე დაახლოებით ორი საათია; ქედამდე მთელ 85 კილომეტრს, იქ, სადაც მაღალი გამავლობის
    ჯიპი გაივლის, დაახლოებით ორნახევარი საათი სჭირდება. საწვავი კასპში ჩაასხით — ხეობაში ბენზინგასამართი
    სადგური არ არის.
en:
  name: Kldekari Fortress
  short: >-
    The Baghuashi eyrie on the Trialeti ridge: a 'rock gate' whose lords held the roads for two centuries
    and fought kings for the kingdom.
  body: >-
    **Kldekari means "rock gate", and for more than two centuries whoever held it could shut the road
    and, at times, hold the kingdom to ransom.**


    The ruins stand by Kldekari mountain, a 2,000-metre crest of the Trialeti range where a rocky pass
    linked eastern Georgia with its southern neighbours and Byzantium. In 876 Liparit I of the Baghuashi,
    driven out of Argveti by the Abkhazian kings, built a fortress here. By backing the winning claimant,
    Adarnase IV, in the succession war that ended in 888, he secured his family a hereditary duchy of
    Trialeti and Kldekari.


    His descendants became the crown's most dangerous vassals. The greatest of them, Liparit IV, defeated
    King Bagrat IV at Sasireti in 1042 and for several years governed nearly half the realm; the Arab
    chronicler Ibn al-Athir even calls him a king. Captured by the Seljuks in 1048, he was soon released,
    according to the Armenian chronicler Matthew of Edessa after beating a champion in single combat before
    the sultan. Around 1060 his own followers handed him to Bagrat, who forced him to take monastic vows;
    he died in Constantinople.


    The end came quietly. David the Builder brought the family to heel in 1093, and in 1103, when the
    last duke, Rati III, died, he simply folded Kldekari into the royal domain.


    What remains is grass-grown rubble and broken wall on a wind-scoured ridge, yet the site explains
    itself. On a clear day the land falls away north to the Mtkvari plain and the Greater Caucasus, south
    to the bare Trialeti uplands. The meadows flower from June to September; after October, snow comes
    early. The gate closes nothing now. It is still hard to reach, which would have pleased its builders.
  tip: >-
    This is a full day, not a roadside stop. From Rkoni the climb takes roughly three hours each way and
    gains more than a thousand metres; the path is unmarked, so carry a GPS track or hire a local guide.
    Take all your water, as springs higher up cannot be relied on. Weather on the ridge turns fast: pack
    a windproof and a warm layer even in July, and start early so you are off the crest before any afternoon
    storm builds. Mobile signal is patchy. Do not go alone.
  route: >-
    Take the E60 (S1) west to Igoeti, then turn south through Kaspi and Chachubeti into the Tedzami gorge
    as far as Rkoni monastery: 75 km, the first 55 on asphalt and the rest on gravel with river fords,
    which an SUV handles in dry weather. Above Rkoni only a high-clearance off-road 4x4 goes further,
    and only when the track is dry, so most people leave the car at the monastery and walk. Tbilisi to
    Rkoni takes about two hours; the full 85 km to the ridge, where a 4x4 can manage it, about two and
    a half. Refuel in Kaspi; there is no station in the gorge.
ru:
  name: Крепость Клдекари
  short: >-
    Орлиное гнездо Багуаши на Триалетском хребте: «скальные ворота», чьи владетели два века держали дороги
    и спорили с царями за царство.
  body: >-
    **Клдекари значит «скальные ворота», и больше двух столетий тот, кто их держал, мог перекрыть дорогу,
    а порой — держать в заложниках всё царство.**


    Руины стоят у горы Клдекари — двухтысячеметрового гребня Триалетского хребта, где скалистый перевал
    связывал Восточную Грузию с её южными соседями и Византией. В 876 году Липарит I из рода Багуаши,
    изгнанный абхазскими царями из Аргвети, построил здесь крепость. Поддержав в войне за престол, закончившейся
    в 888 году, победившего претендента — Адарнасе IV, он добился для своего рода наследственного эриставства
    Триалети и Клдекари.


    Его потомки стали самыми опасными вассалами короны. Величайший из них, Липарит IV, в 1042 году разбил
    царя Баграта IV при Сасирети и несколько лет правил почти половиной страны; арабский хронист Ибн аль-Асир
    даже называет его царём. В 1048 году он попал в плен к сельджукам, но вскоре был отпущен — по словам
    армянского хрониста Матфея Эдесского, после того как одолел в поединке богатыря на глазах у султана.
    Около 1060 года собственные сторонники выдали его Баграту, и тот заставил его принять монашеский постриг;
    умер Липарит в Константинополе.


    Конец наступил тихо. Давид Строитель усмирил род в 1093 году, а в 1103-м, когда умер последний эристав,
    Рати III, просто присоединил Клдекари к царскому домену.


    От крепости остались заросшие травой груды камня и обломки стен на продуваемом всеми ветрами гребне,
    но место объясняет себя само. В ясный день земля уходит на север, к равнине Мтквари и Большому Кавказу,
    и на юг, к голым Триалетским нагорьям. Луга цветут с июня по сентябрь; после октября рано приходит
    снег. Ворота больше ничего не запирают. Добраться до них по-прежнему трудно — их строителям это бы
    понравилось.
  tip: >-
    Это целый день, а не остановка у дороги. От Ркони подъём занимает около трёх часов в одну сторону
    с набором высоты больше тысячи метров; тропа не маркирована, поэтому загрузите трек в навигатор или
    наймите местного проводника. Всю воду несите с собой: на родники выше рассчитывать нельзя. Погода
    на гребне меняется быстро — даже в июле берите ветровку и тёплый слой и выходите рано, чтобы спуститься
    с гребня до того, как соберётся послеполуденная гроза. Мобильная связь неустойчива. Не ходите в одиночку.
  route: >-
    По E60 (S1) на запад до Игоети, затем на юг через Каспи и Чачубети в ущелье Тедзами до монастыря Ркони:
    75 км, первые 55 по асфальту, дальше гравийная дорога с бродами, вполне проходимая для внедорожника
    в сухую погоду. Выше Ркони проедет только высокий полноприводный внедорожник, и то лишь по сухой колее,
    поэтому большинство оставляет машину у монастыря и идёт пешком. От Тбилиси до Ркони около двух часов;
    все 85 км до гребня — там, где полноприводный внедорожник вообще может проехать, — около двух с половиной.
    Заправьтесь в Каспи — в ущелье заправок нет.
fa:
  name: دژ کلدکاری
  short: >-
    آشیانهٔ عقابِ خاندان باغواشی بر رشته‌کوه تریالتی: «دروازهٔ سنگی» که اربابانش دو سده راه‌ها را در دست
    داشتند و بر سر کشور با شاهان جنگیدند.
  body: >-
    **کلدکاری یعنی «دروازهٔ سنگی»، و بیش از دو سده هر که آن را در دست داشت می‌توانست راه را ببندد و گاه
    سرنوشت کل پادشاهی را به گروگان بگیرد.**


    ویرانه‌ها کنار کوه کلدکاری ایستاده‌اند، ستیغی دوهزارمتری از رشته‌کوه تریالتی، جایی که گذرگاهی سنگلاخی
    گرجستان شرقی را به همسایگان جنوبی‌اش و به بیزانس پیوند می‌داد. در سال ۸۷۶، لیپاریت یکم از خاندان باغواشی،
    که پادشاهان آبخاز او را از آرگوتی رانده بودند، اینجا دژی ساخت. او در جنگ جانشینی که در ۸۸۸ به پایان
    رسید از مدعی پیروز، آدارناسه چهارم، پشتیبانی کرد و بدین‌سان برای خاندانش دوک‌نشینی موروثی در تریالتی
    و کلدکاری به دست آورد.


    نوادگانش خطرناک‌ترین دست‌نشاندگان تاج و تخت شدند. بزرگ‌ترینشان، لیپاریت چهارم، در ۱۰۴۲ شاه باگرات
    چهارم را در ساسیرتی شکست داد و چند سال بر نزدیک به نیمی از کشور فرمان راند؛ ابن اثیر، وقایع‌نگار عرب،
    حتی او را «شاه» می‌خواند. در ۱۰۴۸ به اسارت سلجوقیان درآمد، اما به‌زودی آزاد شد؛ به روایت متی اورهایی،
    وقایع‌نگار ارمنی، پس از آنکه پهلوانی را در نبرد تن‌به‌تن در برابر سلطان شکست داد. حدود ۱۰۶۰، پیروان
    خودش او را به باگرات سپردند و باگرات او را واداشت که جامهٔ رهبانی بپوشد؛ او در قسطنطنیه درگذشت.


    پایان کار بی‌سروصدا فرارسید. داوید سازنده در ۱۰۹۳ این خاندان را رام کرد، و در ۱۱۰۳، هنگامی که آخرین
    دوک، راتی سوم، درگذشت، کلدکاری را به‌سادگی به قلمرو سلطنتی پیوست.


    آنچه مانده آوار علف‌پوش و دیوارهای شکسته بر ستیغی بادرُفته است، اما خودِ مکان داستانش را روشن می‌گوید.
    در روزی صاف، زمین به سوی شمال تا دشت متکواری و قفقاز بزرگ فرو می‌افتد، و به سوی جنوب تا فلات‌های برهنهٔ
    تریالتی. مرغزارها از ژوئن تا سپتامبر گل می‌دهند؛ پس از اکتبر برف زود از راه می‌رسد. این دروازه دیگر
    چیزی را نمی‌بندد. اما رسیدن به آن هنوز دشوار است، و این سازندگانش را خشنود می‌کرد.
  tip: >-
    این سفر یک روز کامل است، نه توقفی کنار جاده. از رکونی، راه در هر سو حدود سه ساعت طول می‌کشد و بیش
    از هزار متر ارتفاع می‌گیرد؛ مسیر نشانه‌گذاری نشده، پس فایل مسیر را در جی‌پی‌اس داشته باشید یا راهنمای
    محلی بگیرید. همهٔ آب خود را بیاورید، چون به چشمه‌های بالادست نمی‌شود اعتماد کرد. هوا بر ستیغ به‌سرعت
    دگرگون می‌شود: حتی در ژوئیه بادگیر و لباس گرم بردارید و زود راه بیفتید تا پیش از شکل گرفتن طوفان بعدازظهر
    از ستیغ پایین آمده باشید. آنتن موبایل ضعیف و ناپیوسته است. تنها نروید.
  route: >-
    بزرگراه E60 (S1) را به سمت غرب تا ایگوئتی بگیرید، سپس به جنوب بپیچید و از کاسپی و چاچوبتی به درون
    درهٔ تدزامی تا صومعهٔ رکونی بروید: ۷۵ کیلومتر، که ۵۵ کیلومتر نخستش آسفالت است و باقی شنی با گذر از
    رودخانه، که شاسی‌بلند در هوای خشک از پسش برمی‌آید. بالاتر از رکونی تنها یک خودروی آفرودِ چهارچرخ‌محرک
    با ارتفاع زیاد از زمین جلوتر می‌رود، آن هم فقط وقتی مسیر خشک است؛ بنابراین بیشتر مردم خودرو را کنار
    صومعه می‌گذارند و پیاده می‌روند. از تفلیس تا رکونی حدود دو ساعت راه است؛ تمام ۸۵ کیلومتر تا ستیغ،
    آن‌جا که خودروی چهارچرخ‌محرک از پسش برآید، حدود دو ساعت و نیم. در کاسپی سوخت بگیرید؛ در دره پمپ‌بنزینی
    نیست.
he:
  name: מבצר קלדקארי
  short: >-
    קן הנשרים של בית בגוואשי על רכס טריאלטי: «שער סלע» שאדוניו שלטו בדרכים במשך מאתיים שנה ונאבקו במלכים
    על הממלכה.
  body: >-
    **קלדקארי פירושו «שער הסלע», ובמשך יותר ממאתיים שנה מי שהחזיק בו יכול היה לחסום את הדרך, ולעיתים גם
    לאחוז בגרונה של הממלכה כולה.**


    ההריסות עומדות ליד הר קלדקארי, פסגה בגובה 2,000 מטר ברכס טריאלטי, שבו מעבר סלעי חיבר את מזרח גאורגיה
    עם שכנותיה בדרום ועם ביזנטיון. בשנת 876 בנה כאן מבצר ליפאריט הראשון מבית בגוואשי, לאחר שמלכי אבחזיה
    גירשו אותו מארגווטי. בזכות תמיכתו בטוען לכתר שניצח, אדרנסה הרביעי, במלחמת הירושה שהסתיימה ב-888, השיג
    למשפחתו דוכסות תורשתית בטריאלטי ובקלדקארי.


    צאצאיו הפכו לווסלים המסוכנים ביותר של הכתר. הגדול שבהם, ליפאריט הרביעי, הביס ב-1042 את המלך בגרט הרביעי
    בסאסירטי ובמשך כמה שנים משל בכמעט מחצית הממלכה; ההיסטוריון הערבי אבן אל-את'יר אף מכנה אותו מלך. ב-1048
    נפל בשבי הסלג'וקים אך שוחרר עד מהרה – לפי הכרוניקן הארמני מתיאוס מאדסה, אחרי שגבר בקרב יחידים על לוחם
    אלוף לעיני הסולטן. בסביבות 1060 מסרו אותו אנשיו שלו לידי בגרט, וזה אילץ אותו לקבל על עצמו נדרי נזירות;
    הוא מת בקונסטנטינופול.


    הסוף בא בשקט. דוד הבונה הכניע את המשפחה ב-1093, וב-1103, כשמת הדוכס האחרון, רטי השלישי, פשוט צירף
    את קלדקארי לנחלת המלך.


    מה שנותר הוא גלי אבנים מכוסים עשב ושרידי חומה שבורים על רכס שהרוח מכה בו בלי הרף, ובכל זאת המקום מסביר
    את עצמו. ביום בהיר הארץ צונחת צפונה אל מישור המטקוורי ואל הקווקז הגדול, ודרומה אל הרמות החשופות של
    טריאלטי. הכרים פורחים מיוני עד ספטמבר; אחרי אוקטובר השלג מגיע מוקדם. השער כבר אינו סוגר דבר. אבל עדיין
    קשה להגיע אליו, ובוניו היו שמחים על כך.
  tip: >-
    זהו יום שלם, לא עצירה בצד הדרך. מרקוני העלייה נמשכת כשלוש שעות לכל כיוון, עם טיפוס של יותר מאלף מטרים;
    השביל אינו מסומן, לכן הצטיידו במסלול לניווט לוויני או שכרו מדריך מקומי. קחו את כל המים איתכם, כי אי
    אפשר לסמוך על המעיינות שבהמשך. מזג האוויר על הרכס מתהפך במהירות: ארזו מעיל רוח ושכבה חמה גם ביולי,
    וצאו מוקדם כדי לרדת מן הרכס לפני שסופת אחר הצהריים מתגבשת. הקליטה הסלולרית חלקית. אל תצאו לבד.
  route: >-
    סעו מערבה בכביש E60 (S1) עד איגואטי, משם דרומה דרך קספי וצ'צ'ובטי אל ערוץ טדזאמי, עד מנזר רקוני: 75
    ק"מ, 55 הראשונים סלולים והשאר דרך חצץ עם מעברי נחל, שרכב שטח עובר במזג אוויר יבש. מעל רקוני ממשיך
    רק רכב שטח גבוה בהנעה כפולה, ורק כשהדרך יבשה, ולכן רוב המבקרים משאירים את הרכב ליד המנזר וממשיכים
    ברגל. מטביליסי עד רקוני כשעתיים; כל 85 הק"מ עד הרכס, במקום שבו רכב שטח מסוגל לעבור, כשעתיים וחצי.
    תדלקו בקספי; בערוץ אין תחנת דלק.
ar:
  name: قلعة كلديكاري
  short: 'وكر النسور لآل باغواشي على سلسلة تريالتي: «بوابة صخرية» أمسك أسيادها بالطرق قرنين، ونازعوا الملوك
    على المملكة.'
  body: >-
    **كلديكاري تعني «البوابة الصخرية»، وطوال أكثر من قرنين كان من يمسك بها قادراً على إغلاق الطريق، بل
    على أن يرتهن المملكة كلها أحياناً.**


    تقوم الأطلال عند جبل كلديكاري، وهو ذروة من سلسلة تريالتي ترتفع 2000 متر، حيث كان ممرّ صخري يصل شرق
    جورجيا بجيرانها في الجنوب وبالإمبراطورية البيزنطية. في عام 876 بنى هنا ليباريت الأول من آل باغواشي
    قلعةً، بعدما طرده ملوك الأبخاز من أرغفيتي. وبمناصرته المطالبَ بالعرش الذي انتصر، أدرناسي الرابع، في
    حرب الخلافة التي انتهت عام 888، ضمن لأسرته دوقية وراثية في تريالتي وكلديكاري.


    صار أحفاده أخطر أتباع التاج. وأعظمهم، ليباريت الرابع، هزم الملك باغرات الرابع في ساسيرتي عام 1042،
    وحكم سنوات عدة ما يقارب نصف المملكة؛ بل إن المؤرخ العربي ابن الأثير يسمّيه ملكاً. أسره السلاجقة عام
    1048 لكنهم أطلقوه سريعاً، وبحسب المؤرخ الأرمني متى الرهاوي فقد كان ذلك بعد أن صرع بطلاً في مبارزة
    فردية أمام السلطان. ونحو عام 1060 سلّمه أتباعه أنفسهم إلى باغرات، فأرغمه على الترهّب؛ ومات في القسطنطينية.


    جاءت النهاية بهدوء. أخضع داود البنّاء الأسرة عام 1093، وفي عام 1103، حين مات آخر الدوقات، راتي الثالث،
    ضمّ كلديكاري ببساطة إلى الأملاك الملكية.


    ما بقي ركام يكسوه العشب وجدران محطمة على ذروة تجلدها الرياح، لكن الموقع يشرح نفسه بنفسه. في يوم صافٍ
    تنحدر الأرض شمالاً إلى سهل نهر متكفاري (كورا) والقوقاز الكبير، وجنوباً إلى هضاب تريالتي الجرداء. تزهر
    المروج من حزيران إلى أيلول، وبعد تشرين الأول يأتي الثلج مبكراً. لم تعد البوابة تغلق شيئاً. لكن الوصول
    إليها ما زال شاقاً، وهذا كان سيُرضي بُناتها.
  tip: >-
    هذه رحلة يوم كامل لا وقفة على جانب الطريق. من ركوني يستغرق الصعود نحو ثلاث ساعات في كل اتجاه، بارتفاع
    يزيد على ألف متر؛ والدرب غير معلَّم، فاحملوا المسار على جهاز ملاحة أو استأجروا دليلاً محلياً. احملوا
    ماءكم كله، إذ لا يمكن الاعتماد على الينابيع في الأعلى. يتقلب الطقس على الذروة بسرعة: خذوا سترة واقية
    من الريح وطبقة دافئة حتى في تموز، وانطلقوا باكراً لتنزلوا عن الذروة قبل أن تتشكل عاصفة ما بعد الظهر.
    تغطية الهاتف متقطعة. لا تذهبوا وحدكم.
  route: >-
    اسلكوا الطريق E60 (S1) غرباً حتى إيغوئيتي، ثم انعطفوا جنوباً عبر كاسبي وتشاتشوبيتي إلى وادي تيدزامي
    حتى دير ركوني: 75 كم، أول 55 منها معبّدة والباقي حصى مع مخاضات نهرية تجتازها سيارة دفع رباعي في الطقس
    الجاف. فوق ركوني لا تتقدم إلا سيارة دفع رباعي عالية مخصصة للطرق الوعرة، وفقط حين يكون الدرب جافاً،
    ولذلك يترك معظم الزوار السيارة عند الدير ويكملون سيراً. من تبليسي إلى ركوني نحو ساعتين؛ أما الـ85
    كم كلها حتى الذروة، حيث تستطيع سيارة الدفع الرباعي بلوغها، فنحو ساعتين ونصف. تزوّدوا بالوقود في كاسبي،
    فلا محطة في الوادي.
