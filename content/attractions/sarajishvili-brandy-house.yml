ka:
  name: სარაჯიშვილის კონიაკის სახლი
  short: >-
    ქართული კონიაკის სახლი, რომელსაც სათავე 1884 წელს ქიმიკოსმა დავით სარაჯიშვილმა დაუდო: მარნები, მუხის
    კასრები და დეგუსტაცია — მხოლოდ წინასწარი ჩაწერით.
  body: >-
    **ქართული კონიაკი ქიმიკოსის თავში დაიბადა: დავით სარაჯიშვილი ჰაიდელბერგის დოქტორის ხარისხით და ფრანგი
    მხდელის ცოდნით დაბრუნდა შინ და გადაწყვიტა, რომ ქართული ყურძენი მუხის კასრს იმსახურებდა.**


    სარაჯიშვილი 1848 წელს თბილისში, ვაჭრის ოჯახში დაიბადა. 1871 წელს ჰაიდელბერგის უნივერსიტეტში ქიმიისა
    და ფილოსოფიის დოქტორის ხარისხი მიიღო, 1878–1879 წლებში კი საფრანგეთში, ჟან-ბატისტ კამიუსთან, მეღვინეობასა
    და დისტილაციას სწავლობდა. შინ დაბრუნებულმა 1884–1885 წლებში მომავალი ქარხნის საძირკველი ჩაყარა; პირველი
    პროდუქცია 1887 წელს გამოვიდა, თბილისის ქარხანა კი 1888 წელს ამოქმედდა. საკონიაკე სპირტს კავკასიური
    მთის მუხის კასრებში აძველებდა — ამ წესით კონიაკი რუსეთის იმპერიაში პირველმა მან დაიწყო — და 1910 წლისთვის
    მისი ფირმა წელიწადში 600 ათასამდე ბოთლს უშვებდა. 1913 წელს, მისი გარდაცვალებიდან ორი წლის შემდეგ,
    კომპანიამ საიმპერატორო კარის მომწოდებლის წოდება მიიღო.


    ფულს ისეთივე გაბედულად ხარჯავდა, როგორც შოულობდა. მისი სტიპენდიებით ისწავლეს კომპოზიტორებმა ზაქარია
    ფალიაშვილმა და დიმიტრი არაყიშვილმა, მხატვარმა გიგო გაბაშვილმა, მოქანდაკე იაკობ ნიკოლაძემ; მისი ფულით
    ჩატარდა ექვთიმე თაყაიშვილის არქეოლოგიური გათხრები. უშვილო სარაჯიშვილი 1911 წელს გარდაიცვალა და დღეს
    რუსთაველის გამზირზე, ქაშვეთის ეკლესიის გვერდით განისვენებს.


    ტურზე სარაჯიშვილის სახლს არ ნახავთ — ის დღევანდელ მაჩაბლის ქუჩაზე იყო. საბჭოთა ხანაში, ნაციონალიზაციის
    შემდეგ, ქარხანას „თბილისის კონიაკის ქარხანა“ ეწოდა; ამჟამინდელი საწარმო 1939–1954 წლებში აშენდა, 1994
    წელს კი კომპანია კერძო მფლობელობაში გადავიდა და დამფუძნებლის სახელი დაუბრუნდა. მის მარაგში დღემდე
    ინახება სპირტები, რომლებიც 1893 და 1905 წლებში თავად სარაჯიშვილის ხელმძღვანელობით გამოიხადა. კომპანიის
    თქმით, ციცქის, ცოლიკოურის, გორული მწვანის, ჩინურისა და რქაწითლის ღვინო ორჯერ იხდება შარანტული ტიპის
    სახდელ აპარატში, სპირტი კი 350–400-ლიტრიან მუხის კასრებში სულ მცირე სამ წელს ძველდება, ნაწილი კი „ანგელოზების
    წილად“ ორთქლდება.


    სადღაც ამ კასრებს შორის ჯერ კიდევ ელოდება სპირტი, რომელიც სარაჯიშვილის სიცოცხლეში გამოიხადა — დეგუსტაციის
    ჭიქა მასთან საუბრის ყველაზე ახლო გზაა.
  tip: >-
    ქარხანაში მხოლოდ წინასწარ დაჯავშნილი ექსკურსიით შეხვალთ — sarajishvili.com-ზე; „ქუჩიდან“ შესვლა არ
    ხდება. ტურები ყოველდღე, 10:00–17:00 საათებში ტარდება, გრძელდება 60–90 წუთი, ქართულ, რუსულ, ინგლისურ
    ან ჩინურ ენაზე. ფასი საიტზე გამოქვეყნებული არ არის — ჯავშნისას დააზუსტეთ ისიც, ჭიშკრის ზუსტი მისამართიც
    და პარკირებაც. ტური დეგუსტაციით მთავრდება, ამიტომ მძღოლმა ჭიქაზე უარი უნდა თქვას — საქართველოში ნასვამ
    მდგომარეობაში მართვის წესები მკაცრია. უფრო მარტივია ტაქსი ან მეტრო: პირველ ხაზზე ქარხნის სახელობის
    სადგური „სარაჯიშვილია“ — ოღონდ ჯავშნისას იკითხეთ, რა მანძილია იქიდან ჭიშკრამდე. ქარხანა ნუ აგერევათ
    მაჩაბლის ქუჩა №13-ში მდებარე მის სასახლეში, რომელიც 1903–1905 წლებში აშენდა და დღეს საქართველოს მწერალთა
    სახლია, ან რიყის პარკის ძეგლში.
  route: >-
    თავისუფლების მოედნიდან მტკვრისკენ დაეშვით, მარცხენა სანაპიროზე გადადით და ჩრდილოეთისკენ სანაპიროებს
    მიჰყევით — ჯერ ბარათაშვილის მარცხენა სანაპიროს, შემდეგ კოსმონავტების სანაპიროს — დაახლოებით 7 კილომეტრი,
    შემდეგ კი ნაძალადევის სარაჯიშვილის უბნის ქუჩებში შეუხვიეთ. სულ დაახლოებით 13 კილომეტრია, საცობის გარეშე
    20 წუთი; პიკის საათებში ორმაგი დრო ივარაუდეთ. გზა ბოლომდე მოასფალტებულია, მხოლოდ ქალაქური მოძრაობაა,
    ასე რომ, ეკონომკლასის მანქანა სავსებით საკმარისია. ჩვენი რუკის ნიშნული უბანს აჩვენებს და არა ქარხნის
    ჭიშკარს — ნავიგატორში ჯავშნის დადასტურებაში მითითებული მისამართი შეიყვანეთ. ბენზინგასამართი სადგურები
    გზაზე ბევრია.
en:
  name: Sarajishvili Brandy House
  short: >-
    The Tbilisi brandy house begun in 1884 by chemist David Sarajishvili: cellars, oak barrels and a guided
    tasting — by advance booking only.
  body: >-
    **Georgian brandy began in a chemist's head: David Sarajishvili came home with a Heidelberg doctorate
    and a French distiller's know-how, and decided that Georgian grapes deserved oak.**


    A Tbilisi merchant's son born in 1848, Sarajishvili took a doctorate in chemistry and philosophy at
    Heidelberg in 1871, then spent 1878–79 in France learning winemaking and distillation with Jean-Baptiste
    Camus. Back home he laid the foundations of a brandy works in 1884–85; the first product came out
    in 1887 and the Tbilisi factory opened in 1888. Ageing grape spirit in Caucasian mountain oak, he
    was the first in the Russian Empire to make brandy this way; by 1910 his firm produced some 600,000
    bottles a year. In 1913, two years after his death, the company was named a supplier to the imperial
    court.


    He spent money as boldly as he made it. His scholarships educated the composers Zakaria Paliashvili
    and Dimitri Arakishvili, the painter Gigo Gabashvili and the sculptor Iakob Nikoladze; he paid for
    Ekvtime Takaishvili's archaeological digs. Childless, he died in 1911 and lies beside Kashveti Church
    on Rustaveli Avenue.


    What you tour is not his home, which was on today's Machabeli Street. Nationalised in Soviet times
    as the Tbilisi Cognac Factory, the business moved into its present plant, built in 1939–54, and in
    1994 went private and took back the founder's name. Its reserves still hold spirits distilled in 1893
    and 1905 under Sarajishvili himself. The company says wine from Tsitska, Tsolikouri, Goruli Mtsvane,
    Chinuri and Rkatsiteli grapes is double-distilled in a Charente-type still, and the spirit aged for
    at least three years in 350–400-litre oak barrels, with a share lost to the angels.


    Somewhere among those barrels a spirit from Sarajishvili's own lifetime is still waiting; the tasting
    glass is the nearest you will come to a conversation with him.
  tip: >-
    Visits are by pre-booked guided tour only, via sarajishvili.com — there are no walk-ins. Tours run
    daily between 10:00 and 17:00, last 60–90 minutes and are given in Georgian, Russian, English or Chinese.
    The price isn't published, so confirm it, the gate address and parking when you book. The tour ends
    in a tasting, so the driver should pass: Georgia's drink-driving rules are strict. A taxi or the metro
    is simpler — Line 1 has a station named Sarajishvili after the factory; ask when booking how far the
    gate is from it. Not to be confused with his mansion at 13 Machabeli Street, built in 1903–05 and
    now the Writers' House of Georgia, or with his monument in Rike Park.
  route: >-
    From Freedom Square drop down to the Mtkvari, cross to the left bank and follow the embankments north
    — first the Baratashvili left-bank embankment, then Kosmonavtebi Embankment — for about 7 km, before
    turning into the streets of the Sarajishvili neighbourhood in Nadzaladevi. It is about 13 km and 20
    minutes outside rush hour; allow double at peak times. Tarmac all the way and nothing but city traffic,
    so an economy car is plenty. Our map pin marks the neighbourhood, not the factory gate: put the address
    from your booking confirmation into the navigator. Fuel stations are plentiful along the way.
ru:
  name: Коньячный дом Сараджишвили
  short: >-
    Тбилисский коньячный дом, основанный в 1884 году химиком Давидом Сараджишвили: погреба, дубовые бочки
    и дегустация с гидом — только по предварительной записи.
  body: >-
    **Грузинский коньяк родился в голове химика: Давид Сараджишвили вернулся домой с гейдельбергским докторским
    дипломом и знаниями французского винокура и решил, что грузинский виноград заслуживает дубовой бочки.**


    Сын тбилисского купца, родившийся в 1848 году, Сараджишвили в 1871-м получил в Гейдельберге степень
    доктора химии и философии, а в 1878–1879 годах учился во Франции виноделию и дистилляции у Жана-Батиста
    Камю. Вернувшись, он в 1884–1885 годах заложил основы коньячного производства; первая продукция вышла
    в 1887 году, а тбилисский завод открылся в 1888-м. Выдерживая виноградный спирт в бочках из кавказского
    горного дуба, он первым в Российской империи стал делать коньяк таким способом; к 1910 году его фирма
    выпускала около 600 000 бутылок в год. В 1913 году, через два года после его смерти, компания получила
    звание поставщика императорского двора.


    Деньги он тратил так же смело, как зарабатывал. На его стипендии учились композиторы Захарий Палиашвили
    и Дмитрий Аракишвили, художник Гиго Габашвили и скульптор Яков Николадзе; он оплачивал археологические
    раскопки Эквтиме Такайшвили. Бездетный, он умер в 1911 году и похоронен у церкви Кашвети на проспекте
    Руставели.


    На экскурсии вы увидите не его дом — тот стоял на нынешней улице Мачабели. В советское время предприятие
    национализировали под названием Тбилисский коньячный завод; оно переехало на нынешнюю площадку, построенную
    в 1939–1954 годах, а в 1994-м стало частным и вернуло себе имя основателя. В его запасах до сих пор
    хранятся спирты, перегнанные в 1893 и 1905 годах под руководством самого Сараджишвили. По словам компании,
    вино из винограда цицка, цоликоури, горули мцване, чинури и ркацители дважды перегоняют в аппарате
    шарантского типа, а спирт выдерживают не меньше трёх лет в дубовых бочках на 350–400 литров, и часть
    его уходит на «долю ангелов».


    Где-то среди этих бочек всё ещё ждёт своего часа спирт, перегнанный при жизни Сараджишвили; дегустационный
    бокал — самое близкое, что может заменить разговор с ним.
  tip: >-
    Посещение — только на экскурсии с гидом по предварительной записи через sarajishvili.com; просто прийти
    с улицы нельзя. Экскурсии проходят ежедневно с 10:00 до 17:00, длятся 60–90 минут и ведутся на грузинском,
    русском, английском или китайском. Цена не опубликована, поэтому при записи уточните её, а также адрес
    ворот и парковку. Экскурсия заканчивается дегустацией, так что водителю лучше отказаться: в Грузии
    строгие правила насчёт вождения в нетрезвом виде. Проще на такси или метро — на первой линии есть
    станция «Сараджишвили», названная в честь завода; при записи спросите, далеко ли от неё до ворот.
    Не путайте с его особняком на улице Мачабели, 13, построенным в 1903–1905 годах (сегодня это Дом писателей
    Грузии), и с памятником в парке Рике.
  route: >-
    От площади Свободы спуститесь к Мтквари, переезжайте на левый берег и поезжайте на север по набережным
    — сначала по левобережной набережной Бараташвили, затем по набережной Космонавтов — около 7 км, после
    чего сверните на улицы района Сараджишвили в Надзаладеви. Это около 13 км и 20 минут вне часа пик;
    в пиковые часы закладывайте вдвое больше. Асфальт на всём пути и только городское движение, так что
    машины эконом-класса вполне достаточно. Наша метка на карте указывает район, а не ворота завода: введите
    в навигатор адрес из подтверждения записи. Заправок по дороге много.
fa:
  name: خانهٔ براندی ساراجیشویلی
  short: >-
    خانهٔ براندی تفلیس که شیمی‌دانی به نام داویت ساراجیشویلی در ۱۸۸۴ بنیادش را نهاد: سرداب‌ها، بشکه‌های
    بلوط و چشیدن همراه راهنما، فقط با رزرو قبلی.
  body: >-
    **براندی گرجی در ذهن یک شیمی‌دان زاده شد: داویت ساراجیشویلی با دکترایی از هایدلبرگ و دانش یک تقطیرگر
    فرانسوی به خانه بازگشت و به این نتیجه رسید که انگور گرجی سزاوار بلوط است.**


    ساراجیشویلی، پسر بازرگانی تفلیسی که در ۱۸۴۸ به دنیا آمد، در ۱۸۷۱ در هایدلبرگ دکترای شیمی و فلسفه گرفت
    و سپس سال‌های ۱۸۷۸–۱۸۷۹ را در فرانسه گذراند تا شراب‌سازی و تقطیر را نزد ژان-باتیست کامو بیاموزد. پس
    از بازگشت، در ۱۸۸۴–۱۸۸۵ بنیاد کارگاه براندی‌سازی را گذاشت؛ نخستین محصول در ۱۸۸۷ بیرون آمد و کارخانهٔ
    تفلیس در ۱۸۸۸ گشوده شد. او با کهنه کردن عرق انگور در بلوط کوهستانی قفقاز نخستین کسی بود که در امپراتوری
    روسیه براندی را به این شیوه ساخت؛ تا سال ۱۹۱۰ شرکتش سالانه حدود ۶۰۰ هزار بطری تولید می‌کرد. در ۱۹۱۳،
    دو سال پس از مرگش، شرکت عنوان تأمین‌کنندهٔ دربار امپراتوری را گرفت.


    پول را همان‌قدر بی‌پروا خرج می‌کرد که به دست می‌آورد. با بورس‌های تحصیلی او آهنگسازان زاکاریا پالیاشویلی
    و دیمیتری آراکیشویلی، نقاش گیگو گاباشویلی و پیکرتراش یاکوب نیکولادزه درس خواندند؛ هزینهٔ کاوش‌های
    باستان‌شناختی اکوتیمه تاکایشویلی را هم او پرداخت. بی‌فرزند بود، در ۱۹۱۱ درگذشت و در کنار کلیسای کاشوتی
    در خیابان روستاولی آرمیده است.


    آنچه در این گشت می‌بینید خانهٔ او نیست؛ آن خانه در خیابانی بود که امروز ماچابلی نام دارد. این کسب‌وکار
    در دوران شوروی ملی شد و نام کارخانهٔ کنیاک تفلیس را گرفت، به کارخانهٔ کنونی که در ۱۹۳۹–۱۹۵۴ ساخته
    شده بود منتقل شد و در ۱۹۹۴ خصوصی شد و نام بنیان‌گذار را بازپس گرفت. در ذخیره‌هایش هنوز عرق‌هایی نگهداری
    می‌شود که در ۱۸۹۳ و ۱۹۰۵ زیر نظر خودِ ساراجیشویلی تقطیر شده‌اند. به گفتهٔ شرکت، شرابِ انگورهای تسیتسکا،
    تسولیکوری، گورولی متسوانه، چینوری و رکاتسیتلی دو بار در دستگاه تقطیری از نوع شارانت تقطیر می‌شود و
    عرق دست‌کم سه سال در بشکه‌های بلوط ۳۵۰ تا ۴۰۰ لیتری کهنه می‌شود، و بخشی از آن به «سهم فرشتگان» می‌رود.


    جایی میان این بشکه‌ها، عرقی از روزگار زندگی خودِ ساراجیشویلی هنوز در انتظار است؛ جام چشیدن نزدیک‌ترین
    راهی است که به گفت‌وگو با او خواهید داشت.
  tip: >-
    بازدید فقط با گشت راهنمادار و رزرو قبلی از طریق sarajishvili.com ممکن است؛ بدون رزرو نمی‌توانید وارد
    شوید. گشت‌ها هر روز میان ساعت ۱۰:۰۰ و ۱۷:۰۰ برگزار می‌شوند، ۶۰ تا ۹۰ دقیقه طول می‌کشند و به زبان گرجی،
    روسی، انگلیسی یا چینی‌اند. قیمت منتشر نشده است، پس هنگام رزرو آن را همراه با نشانی درِ ورودی و وضعیت
    پارکینگ جویا شوید. گشت با چشیدن براندی به پایان می‌رسد، پس بهتر است راننده ننوشد: قوانین گرجستان دربارهٔ
    رانندگی در حالت مستی سخت‌گیرانه است. تاکسی یا مترو ساده‌تر است: خط ۱ ایستگاهی دارد به نام ساراجیشویلی
    که نامش را از کارخانه گرفته؛ هنگام رزرو بپرسید درِ ورودی چقدر از آن فاصله دارد. آن را با عمارت او
    در شمارهٔ ۱۳ خیابان ماچابلی، ساختهٔ ۱۹۰۳–۱۹۰۵ که امروز خانهٔ نویسندگان گرجستان است، یا بنای یادبودش
    در پارک ریکه اشتباه نگیرید.
  route: >-
    از میدان آزادی به سوی متکواری سرازیر شوید، به کرانهٔ چپ بروید و در امتداد خیابان‌های ساحلی به سمت
    شمال برانید، نخست خیابان ساحلی باراتاشویلی در کرانهٔ چپ و سپس خیابان ساحلی کاسموناوت‌ها (کاسموناوتبی)،
    حدود ۷ کیلومتر، و سپس به خیابان‌های محلهٔ ساراجیشویلی در ناحیهٔ نادزالادوی بپیچید. این مسیر حدود ۱۳
    کیلومتر و ۲۰ دقیقه بیرون از ساعت شلوغی است؛ در ساعت اوج دو برابر زمان بگذارید. سراسر آسفالت است و
    تنها با ترافیک شهری سروکار دارید، پس خودروی اقتصادی کاملاً کافی است. نشانگر ما روی نقشه محله را نشان
    می‌دهد، نه درِ کارخانه را: نشانی مندرج در تأیید رزروتان را در مسیریاب وارد کنید. در طول راه پمپ‌بنزین
    فراوان است.
he:
  name: בית הברנדי סרג'ישווילי
  short: >-
    בית הברנדי של טביליסי שייסד ב-1884 הכימאי דוד סרג'ישווילי: מרתפים, חביות אלון וטעימה מודרכת – בהזמנה
    מראש בלבד.
  body: >-
    **הברנדי הגאורגי נולד בראשו של כימאי: דוד סרג'ישווילי חזר הביתה עם דוקטורט מהיידלברג ועם הידע של מזקק
    צרפתי, והחליט שהענבים הגאורגיים ראויים לאלון.**


    סרג'ישווילי נולד ב-1848 בטביליסי, בן לסוחר. ב-1871 קיבל דוקטורט בכימיה ובפילוסופיה בהיידלברג, ובשנים
    1878–1879 שהה בצרפת ולמד ייננות וזיקוק אצל ז'אן-בטיסט קאמי. כשחזר הניח בשנים 1884–1885 את היסודות
    למזקקת ברנדי; המוצר הראשון יצא ב-1887, והמפעל בטביליסי נפתח ב-1888. הוא יישן את תזקיק הענבים בחביות
    מאלון ההרים הקווקזי, והיה הראשון באימפריה הרוסית שייצר ברנדי בדרך זו; עד 1910 ייצרה החברה שלו כ-600,000
    בקבוקים בשנה. ב-1913, שנתיים אחרי מותו, הוכרזה החברה ספקית החצר הקיסרית.


    את הכסף הוציא באותה נועזות שבה הרוויח אותו. במלגותיו למדו המלחינים זכריה פליאשווילי ודימיטרי ארקישווילי,
    הצייר גיגו גבשווילי והפסל יאקוב ניקולדזה; הוא מימן את החפירות הארכאולוגיות של אקוותימה טקאישווילי.
    הוא מת ב-1911 ללא ילדים, וקבור לצד כנסיית קשווטי בשדרות רוסתוולי.


    מה שתסיירו בו אינו ביתו, שעמד ברחוב שנקרא היום מצ'בלי. בתקופה הסובייטית הולאם העסק ונקרא מפעל הקוניאק
    של טביליסי; הוא עבר למתחם הנוכחי שנבנה בשנים 1939–1954, וב-1994 הופרט והשיב לעצמו את שם המייסד. במלאי
    שלו שמורים עד היום תזקיקים שזוקקו ב-1893 וב-1905 בפיקוחו של סרג'ישווילי עצמו. לדברי החברה, יין מהזנים
    ציצקה, צוליקורי, גורולי מצוואנה, צ'ינורי ורקאציטלי עובר זיקוק כפול במתקן זיקוק מסוג שרנט, והתזקיק
    מיושן שלוש שנים לפחות בחביות אלון של 350–400 ליטר, כשחלק ממנו הולך ל"חלק המלאכים".


    אי-שם בין החביות האלה עדיין ממתין תזקיק מימי חייו של סרג'ישווילי; כוס הטעימה היא הדבר הקרוב ביותר
    לשיחה איתו.
  tip: >-
    הביקור אפשרי רק בסיור מודרך שהוזמן מראש דרך sarajishvili.com – אין כניסה בלי הזמנה. הסיורים מתקיימים
    מדי יום בין 10:00 ל-17:00, נמשכים 60–90 דקות ומועברים בגאורגית, ברוסית, באנגלית או בסינית. המחיר לא
    מפורסם, אז ודאו אותו, וגם את כתובת השער והחניה, בעת ההזמנה. הסיור מסתיים בטעימה, ולכן מוטב שהנהג יוותר:
    חוקי הנהיגה בשכרות בגאורגיה מחמירים. מונית או רכבת תחתית פשוטות יותר – בקו 1 יש תחנה בשם סרג'ישווילי,
    שנקראה על שם המפעל; שאלו בעת ההזמנה כמה רחוק ממנה השער. אל תבלבלו עם אחוזתו ברחוב מצ'בלי 13, שנבנתה
    ב-1903–1905 ומשמשת היום כבית הסופרים של גאורגיה, או עם האנדרטה שלו בפארק ריקה.
  route: >-
    מכיכר החירות רדו אל המטקווארי, חצו לגדה השמאלית וסעו צפונה לאורך הסוללות – תחילה סוללת ברטשווילי שעל
    הגדה השמאלית, ואחר כך סוללת הקוסמונאוטים (קוסמונבטבי) – כ-7 ק״מ, ואז פנו אל רחובות שכונת סרג'ישווילי
    שברובע נדזלדבי. זה כ-13 ק״מ ו-20 דקות מחוץ לשעות העומס; בשעות השיא הקצו פי שניים. אספלט לכל אורך הדרך
    ורק תנועה עירונית, כך שרכב חסכוני מספיק בהחלט. הסיכה שלנו במפה מסמנת את השכונה, לא את שער המפעל: הזינו
    לניווט את הכתובת מאישור ההזמנה. תחנות דלק יש בשפע לאורך הדרך.
ar:
  name: دار ساراجيشفيلي للبراندي
  short: >-
    دار البراندي في تبليسي التي بدأها الكيميائي دافيت ساراجيشفيلي عام 1884: أقبية وبراميل من البلوط وتذوّق
    مع مرشد، بالحجز المسبق فقط.
  body: >-
    **وُلد البراندي الجورجي في رأس كيميائي: عاد دافيت ساراجيشفيلي إلى بلاده بدكتوراه من هايدلبرغ وبخبرة
    مقطّر فرنسي، وقرر أن العنب الجورجي يستحق البلوط.**


    وُلد ساراجيشفيلي عام 1848 لتاجر من تبليسي، ونال عام 1871 الدكتوراه في الكيمياء والفلسفة من هايدلبرغ،
    ثم أمضى 1878–1879 في فرنسا يتعلم صناعة النبيذ والتقطير على يد جان باتيست كامو. ولما عاد أرسى في 1884–1885
    أسس مصنع البراندي؛ فخرج أول إنتاج عام 1887، وافتُتح مصنع تبليسي عام 1888. وبتعتيقه كحول العنب المقطَّر
    في براميل من بلوط جبال القوقاز كان أول من صنع البراندي بهذه الطريقة في الإمبراطورية الروسية؛ وبحلول
    عام 1910 كانت شركته تنتج نحو 600,000 زجاجة في السنة. وفي عام 1913، بعد عامين من وفاته، مُنحت الشركة
    لقب مورّد البلاط الإمبراطوري.


    كان ينفق المال بجرأة تضاهي جرأته في كسبه. فبمنحه الدراسية تعلّم المؤلفان الموسيقيان زاكاريا بالياشفيلي
    وديميتري أراكيشفيلي، والرسام غيغو غاباشفيلي، والنحات ياكوب نيكولادزه؛ وموّل الحفريات الأثرية لإكفتيمي
    تاكايشفيلي. مات بلا عقب عام 1911، ويرقد بجوار كنيسة كاشفيتي في جادة روستافيلي.


    ما تزوره ليس بيته، فذاك كان في الشارع الذي يُسمى اليوم ماتشابيلي. أُمِّمت المنشأة في العهد السوفييتي
    باسم مصنع تبليسي للكونياك، وانتقلت إلى موقعها الحالي الذي بُني بين 1939 و1954، ثم خُصخصت عام 1994
    واستعادت اسم مؤسسها. وما زالت مخزوناتها تضم كحولاً قُطّر عامَي 1893 و1905 بإشراف ساراجيشفيلي نفسه.
    وبحسب الشركة، يُقطَّر نبيذ أصناف تسيتسكا وتسوليكوري وغورولي متسفانه وتشينوري وركاتسيتيلي مرتين في
    جهاز تقطير من طراز شارانت، ثم يُعتَّق المقطَّر ثلاث سنوات على الأقل في براميل بلوط سعتها 350–400 لتر،
    ويذهب جزء منه «حصةً للملائكة».


    في مكان ما بين هذه البراميل ما زال مقطَّرٌ من أيام ساراجيشفيلي نفسه ينتظر؛ وكأس التذوّق أقرب ما يمكن
    أن تبلغه من حديث معه.
  tip: >-
    لا تتم الزيارة إلا بجولة مع مرشد محجوزة مسبقاً عبر sarajishvili.com، ولا دخول دون حجز. تُقام الجولات
    يومياً بين 10:00 و17:00، وتستغرق 60–90 دقيقة، وتُقدَّم بالجورجية أو الروسية أو الإنجليزية أو الصينية.
    السعر غير منشور، فتأكد منه ومن عنوان البوابة والموقف عند الحجز. تنتهي الجولة بالتذوّق، فالأفضل أن
    يمتنع السائق: قوانين القيادة تحت تأثير الكحول في جورجيا صارمة. سيارة الأجرة أو المترو أبسط، ففي الخط
    1 محطة اسمها ساراجيشفيلي سُمّيت على اسم المصنع؛ واسأل عند الحجز عن بعد البوابة عنها. ولا تخلط بين
    المصنع وقصره في شارع ماتشابيلي رقم 13، الذي بُني في 1903–1905 وهو اليوم دار الكتّاب الجورجيين، أو
    نصبه في حديقة ريكي.
  route: >-
    من ساحة الحرية انزل إلى نهر متكفاري، واعبر إلى الضفة اليسرى، واتجه شمالاً على الكورنيش، أولاً كورنيش
    باراتاشفيلي على الضفة اليسرى ثم كورنيش كوسموناوتيبي (رواد الفضاء)، نحو 7 كم، ثم ادخل شوارع حي ساراجيشفيلي
    في منطقة نادزالاديفي. المسافة نحو 13 كم و20 دقيقة خارج ساعة الذروة، وضاعف الوقت في أوقات الازدحام.
    الطريق معبّد كله ولا شيء سوى حركة المدينة، فالسيارة الاقتصادية تكفي تماماً. دبوسنا على الخريطة يحدد
    الحي لا بوابة المصنع: أدخل في الملاحة العنوان الوارد في تأكيد حجزك. محطات الوقود كثيرة على الطريق.
