ka:
  name: ანასეულის ჩაის პლანტაციები და ინსტიტუტი
  short: >-
    ოზურგეთის ჩაის უბანი: თოთხმეტი დანომრილი, გაველურებული საბჭოთა პლანტაცია, მიტოვებული ინსტიტუტი მოზაიკური
    შადრევნებით და ფაბრიკა, რომელიც ჯერაც მუშაობს.
  body: >-
    **ანასეულში ჩაის ბუჩქები იმ იმპერიას გადაურჩნენ, რომელმაც ისინი დარგო, და ახლა ისე იზრდებიან, როგორც
    თავად მოესურვებათ.**


    ანასეული ოზურგეთის სამხრეთ-დასავლეთ განაპირას მდებარე უბანია. გადმოცემით, სახელი ანა ბატონიშვილს უკავშირდება
    — გურიის მთავრის, მამია II გურიელის (მთავრობდა 1600–1625 წლებში) ასულს, რომელიც მამამ კახთა მეფე თეიმურაზს
    მიათხოვა და მამული უბოძა. აქ ნეოლითის ხანაშიც ცხოვრობდნენ, მაგრამ ამ ადგილს სახე ჩაიმ მისცა. 1930
    წელს აქ ჩაის მეურნეობის ინსტიტუტი დაარსდა, რომელიც მოგვიანებით ჩაისა და სუბტროპიკულ კულტურათა საკავშირო
    სამეცნიერო-კვლევით ინსტიტუტად იქცა: 1938 წლიდან ციტრუსებზეც მუშაობდა, 1948 წლიდან მათ სელექციას შეუდგა,
    ფილიალები კი ჩაქვში, სოხუმში, ფოთსა და ზუგდიდში ჰქონდა. 1953 წელს ჩაის განყოფილების ბაზაზე ცალკე ჩაის
    მრეწველობის ინსტიტუტი შეიქმნა, საკუთარი ფაბრიკით. 1958 წლისთვის ანასეულში 900 კომლზე მეტი ცხოვრობდა.


    ეს სამყარო საბჭოთა კავშირთან ერთად დასრულდა. პირველიდან მეთოთხმეტემდე დანომრილი პლანტაციები აბურდულია
    და გადაზრდილი: როცა კრეფა შეწყდა, ბევრი ბუჩქი გაველურდა, ბევრი მწკრივი კი ამოძირკვეს და თხილით შეცვალეს,
    რომელიც უფრო მომგებიანია. ინსტიტუტის ძველი შენობა მიტოვებულია, ეზოში მოზაიკები და შადრევნები შემორჩა.
    მუშათა საცხოვრებელ კორპუსებში ისევ ოჯახები ცხოვრობენ და ფოტოაპარატიან უცნობებს დიდი ხანია მიეჩვივნენ.


    ინსტიტუტის იქით გრუნტის გზები დაბალ ბორცვებზე მიიკლაკნება, გაბურძგნილი, მაღლა აზიდული ჩაის მწკრივებს
    შორის. აქ წელიწადში საშუალოდ 2 168 მილიმეტრი ნალექი მოდის, და ეს სიმწვანეს ეტყობა.


    ანასეულის ჩაის ფაბრიკა დღესაც მუშაობს. ქართული ჩაი ახლა პატარა, გულდასმით დამზადებული პარტიებით ბრუნდება
    — გურიის „ჩაის გზაზე“ რამდენიმე ოჯახური მწარმოებელი საქმიანობს. ანასეულში კი ხედავთ, რას აღადგენენ
    ისინი და რა დაიკარგა.
  tip: >-
    შესვლა უფასოა — ეს საზოგადოებრივი გზების გასწვრივ გადაჭიმული, ნაწილობრივ მიტოვებული მინდვრებია. ინსტიტუტის
    იქით გრუნტის გზებს ფეხით გაუყევით: წვიმის შემდეგ, აქ კი ხშირად წვიმს, ისინი სრიალა ხდება. ინსტიტუტის
    შენობა ავარიულია — მოზაიკებით გარედან დატკბით და შიგნით ნუ შეხვალთ. ანასეულის ჩაის ფაბრიკაში ექსკურსია
    წინასწარ, ტელეფონით უნდა შეუთანხმდეთ. ადგილზე არაფერია მოწყობილი, ამიტომ საჭმელი და საწვავი ხუთიოდე
    წუთის სავალზე, ოზურგეთში მოძებნეთ. ყველაზე მწვანე მაისიდან ოქტომბრამდეა; ნამდვილი დეგუსტაციისთვის
    „ჩაის გზის“ რომელიმე მეურნეობაში გადადით.
  route: >-
    ანასეულამდე თბილისიდან 304 კილომეტრია, დაახლოებით 4 საათი და 25 წუთი, მთელ გზაზე ასფალტით. E60-ით
    (ს1) დასავლეთისკენ იარეთ — ხაშურის, რიკოთის მონაკვეთისა და ზესტაფონის გავლით, ქუთაისის გვერდის ავლით
    სამტრედიამდე; იქიდან ს12-ით ლანჩხუთისკენ, შემდეგ ადგილობრივი გზებით და შ2-ით ოზურგეთამდე. ცენტრიდან
    თაყაიშვილის ქუჩას სამხრეთ-დასავლეთისკენ გაუყევით — ანასეული დაახლოებით ორ კილომეტრშია. ასფალტი ინსტიტუტამდე
    მიდის; პლანტაციებში შემავალი გზები გრუნტისაა და ფეხით სიარულისთვისაა. ეკონომ კლასის მანქანა საკმარისია.
    საწვავი ოზურგეთში ჩაასხით.
en:
  name: Anaseuli Tea Fields and Research Institute
  short: >-
    Ozurgeti's tea suburb: fourteen numbered Soviet plantations running wild, an abandoned research institute
    with mosaic fountains, and a factory still at work.
  body: >-
    **In Anaseuli the tea bushes have outlived the empire that planted them, and now grow as they please.**


    Anaseuli is a suburb on the south-western edge of Ozurgeti. Tradition ties its name to Princess Ana,
    daughter of Mamia II Gurieli, ruler of Guria from 1600 to 1625, who married her to King Teimuraz of
    Kakheti and granted her an estate. People lived on this ground in the Neolithic, but it was tea that
    gave the place its shape. A tea institute was founded here in 1930 and grew into the All-Union Research
    Institute of Tea and Subtropical Crops: it took on citrus from 1938, began breeding citrus in 1948
    and ran branches in Chakvi, Sukhumi, Poti and Zugdidi. In 1953 its tea department became a separate
    Tea Industry Institute with a factory of its own. By 1958 Anaseuli had more than 900 households.


    That world ended with the Soviet Union. The plantations, numbered 1 to 14, are shaggy and overgrown:
    when the picking stopped, many bushes ran wild, and many rows were grubbed up for hazelnut, the more
    profitable crop. The old institute building stands abandoned, with mosaics and fountains left in its
    grounds. Families still live in the workers' housing blocks and have long grown used to strangers
    with cameras.


    Beyond the institute, dirt tracks wind over low hills between tall, untidy hedges of tea. An average
    of 2,168 mm of rain falls here each year, and the green shows it.


    The Anaseuli Tea Factory still works. Georgian tea is coming back in small, careful batches from family
    producers along Guria's Tea Route; Anaseuli shows you what they are reviving — and what was lost.
  tip: >-
    Entry is free: these are working and abandoned fields along public roads. Walk the dirt tracks beyond
    the institute rather than drive them; they turn slick after rain, and rain here is frequent. The institute
    building is derelict — admire the mosaics from outside and do not go in. Tours of the Soviet-era Anaseuli
    Tea Factory must be arranged by phone in advance. There are no facilities, so eat and refuel in Ozurgeti,
    five minutes away. The fields are greenest from May to October; for a proper tasting, continue to
    one of the farms on the Tea Route.
  route: >-
    Anaseuli is 304 km from Tbilisi, about 4 hours 25 minutes, on asphalt all the way. Take the E60 (S1)
    west past Khashuri, through the Rikoti section and past Zestaponi and Kutaisi to Samtredia, then the
    S12 towards Lanchkhuti and local roads onto the Sh2 into Ozurgeti. From the centre follow Takaishvili
    Street south-west; Anaseuli is about 2 km out. The asphalt reaches the institute; the tracks into
    the plantations are dirt and best explored on foot. An economy car is enough. Fill up in Ozurgeti.
ru:
  name: Чайные плантации и институт в Анасеули
  short: >-
    Чайный пригород Озургети: 14 одичавших советских плантаций с номерами, заброшенный институт с мозаиками
    и фонтанами и всё ещё работающая фабрика.
  body: >-
    **В Анасеули чайные кусты пережили империю, которая их посадила, и теперь растут как им вздумается.**


    Анасеули — пригород на юго-западной окраине Озургети. Предание связывает его название с княжной Аной,
    дочерью Мамии II Гуриели, правителя Гурии в 1600–1625 годах: отец выдал её за кахетинского царя Теймураза
    и пожаловал ей поместье. Люди жили здесь ещё в неолите, но облик этому месту придал чай. В 1930 году
    здесь основали чайный институт, который вырос во Всесоюзный научно-исследовательский институт чая
    и субтропических культур: с 1938 года он занимался и цитрусовыми, с 1948-го начал их селекцию и держал
    филиалы в Чакви, Сухуми, Поти и Зугдиди. В 1953 году его чайный отдел выделился в самостоятельный
    Институт чайной промышленности с собственной фабрикой. К 1958 году в Анасеули насчитывалось более
    900 дворов.


    Этот мир кончился вместе с Советским Союзом. Плантации, пронумерованные от 1 до 14, стоят косматые
    и заросшие: когда сбор прекратился, многие кусты одичали, а многие ряды выкорчевали под фундук — более
    доходную культуру. Старое здание института заброшено, во дворе остались мозаики и фонтаны. В рабочих
    жилых корпусах по-прежнему живут семьи; к чужакам с фотоаппаратами здесь давно привыкли.


    За институтом грунтовки петляют по невысоким холмам между высокими, растрёпанными живыми изгородями
    чая. Осадков здесь выпадает в среднем 2168 мм в год, и зелень это выдаёт.


    Анасеульская чайная фабрика работает до сих пор. Грузинский чай возвращается — небольшими, тщательно
    сделанными партиями семейных производителей вдоль Чайного пути Гурии; Анасеули показывает, что именно
    они возрождают — и что было утрачено.
  tip: >-
    Вход свободный: это действующие и заброшенные поля вдоль общественных дорог. Грунтовки за институтом
    лучше пройти пешком, чем проехать: после дождя они становятся скользкими, а дожди здесь часты. Здание
    института в аварийном состоянии — любуйтесь мозаиками снаружи и внутрь не заходите. Экскурсию на Анасеульскую
    чайную фабрику советской постройки нужно заранее согласовать по телефону. Никакой инфраструктуры нет,
    так что поесть и заправиться лучше в Озургети, в пяти минутах отсюда. Зеленее всего поля с мая по
    октябрь; за настоящей дегустацией поезжайте на одну из ферм Чайного пути.
  route: >-
    До Анасеули 304 км от Тбилиси, около 4 часов 25 минут, всю дорогу по асфальту. Езжайте по E60 (S1)
    на запад мимо Хашури, через участок Рикоти, мимо Зестафони и Кутаиси до Самтредиа, затем по S12 в
    сторону Ланчхути и местными дорогами выезжайте на Sh2 до Озургети. Из центра держите на юго-запад
    по улице Такаишвили; Анасеули примерно в 2 км. Асфальт доходит до института; дороги в плантации грунтовые,
    и исследовать их лучше пешком. Хватит машины эконом-класса. Заправьтесь в Озургети.
fa:
  name: کشتزارهای چای و مؤسسهٔ پژوهشی آناسئولی
  short: >-
    حومهٔ چای‌خیز اوزورگتی: چهارده کشتزار شماره‌دار شوروی که وحشی شده‌اند، مؤسسه‌ای متروک با موزاییک و
    فواره، و کارخانه‌ای که هنوز کار می‌کند.
  body: >-
    **در آناسئولی، بوته‌های چای از امپراتوری‌ای که آن‌ها را کاشت بیشتر عمر کرده‌اند و حالا هر طور که دلشان
    بخواهد می‌رویند.**


    آناسئولی محله‌ای در حاشیهٔ جنوب‌غربی اوزورگتی است. روایت‌ها نامش را به شاهزاده‌خانم آنا پیوند می‌دهند،
    دختر مامیا دوم گوریلی، فرمانروای گوریا از ۱۶۰۰ تا ۱۶۲۵، که او را به همسری تیموراز، شاه کاختی، درآورد
    و ملکی به او بخشید. مردم از دوران نوسنگی بر این خاک می‌زیستند، اما این چای بود که به این‌جا شکل داد.
    در سال ۱۹۳۰ مؤسسه‌ای برای چای در این‌جا بنیان نهاده شد که بعدها به مؤسسهٔ پژوهشی سراسری شوروی برای
    چای و محصولات نیمه‌گرمسیری بدل شد: از ۱۹۳۸ به مرکبات هم پرداخت، از ۱۹۴۸ به اصلاح نژاد مرکبات روی آورد
    و در چاکوی، سوخومی، پوتی و زوگدیدی شعبه داشت. در ۱۹۵۳ بخش چای آن به مؤسسه‌ای مستقل با نام مؤسسهٔ صنعت
    چای، با کارخانه‌ای از آنِ خود، تبدیل شد. تا سال ۱۹۵۸ بیش از ۹۰۰ خانوار در آناسئولی زندگی می‌کردند.


    آن جهان با اتحاد شوروی به پایان رسید. کشتزارها که از ۱ تا ۱۴ شماره‌گذاری شده‌اند، ژولیده و انبوه‌اند:
    وقتی برگ‌چینی متوقف شد، بسیاری از بوته‌ها وحشی شدند و بسیاری از ردیف‌ها را از ریشه کندند و به‌جایشان
    فندق کاشتند که محصولی سودآورتر است. ساختمان قدیمی مؤسسه متروک مانده و در محوطه‌اش موزاییک‌ها و فواره‌هایی
    بر جا مانده است. خانواده‌ها هنوز در مجتمع‌های مسکونی کارگران زندگی می‌کنند و مدت‌هاست به غریبه‌های
    دوربین‌به‌دست عادت کرده‌اند.


    آن سوی مؤسسه، راه‌های خاکی بر تپه‌های کم‌ارتفاع، میان پرچین‌های بلند و نامرتب چای، پیچ‌وتاب می‌خورند.
    این‌جا به‌طور میانگین سالانه ۲۱۶۸ میلی‌متر باران می‌بارد، و سبزیِ زمین گواه آن است.


    کارخانهٔ چای آناسئولی هنوز کار می‌کند. چای گرجستان دوباره بازمی‌گردد، در دسته‌های کوچک و با وسواس،
    به دست تولیدکنندگان خانوادگی در امتداد «جادهٔ چای» گوریا؛ آناسئولی نشانتان می‌دهد آنان چه چیزی را
    احیا می‌کنند — و چه چیزی از دست رفت.
  tip: >-
    ورود رایگان است: این‌ها کشتزارهای فعال و متروکی در امتداد جاده‌های عمومی‌اند. راه‌های خاکیِ آن سوی
    مؤسسه را پیاده بپیمایید، نه با خودرو؛ پس از باران لغزنده می‌شوند و این‌جا باران زیاد می‌بارد. ساختمان
    مؤسسه فرسوده و ناایمن است — موزاییک‌ها را از بیرون تماشا کنید و داخل نشوید. بازدید از کارخانهٔ چای
    آناسئولی، که از دوران شوروی باقی مانده، باید از پیش تلفنی هماهنگ شود. هیچ امکاناتی در محل نیست؛ پس
    غذا و سوخت را در اوزورگتی، پنج دقیقه آن‌طرف‌تر، تهیه کنید. کشتزارها از ماه مه تا اکتبر سبزترین‌اند؛
    برای چشیدن جدی چای، به یکی از مزرعه‌های «جادهٔ چای» بروید.
  route: >-
    آناسئولی ۳۰۴ کیلومتر با تفلیس فاصله دارد، حدود ۴ ساعت و ۲۵ دقیقه، و تمام راه آسفالت است. از جادهٔ
    E60 (S1) به سمت غرب بروید، از کنار خاشوری، از گذرگاه ریکوتی و از کنار زستافونی و کوتائیسی بگذرید تا
    به سامتردیا برسید؛ سپس از S12 به‌سوی لانچخوتی و از راه‌های محلی وارد Sh2 شوید تا اوزورگتی. از مرکز
    شهر خیابان تاکائیشویلی را به سمت جنوب‌غرب دنبال کنید؛ آناسئولی حدود ۲ کیلومتر بیرون از شهر است. آسفالت
    تا مؤسسه می‌رسد؛ راه‌های درون کشتزارها خاکی‌اند و بهتر است پیاده کاوش شوند. یک خودروی سواری معمولی
    کافی است. در اوزورگتی باک را پر کنید.
he:
  name: מטעי התה ומכון המחקר של אנאסאולי
  short: >-
    פרבר התה של אוזורגטי: ארבעה-עשר מטעים סובייטיים ממוספרים שהתפראו, מכון נטוש עם פסיפסים ומזרקות, ומפעל
    שעדיין עובד.
  body: >-
    **באנאסאולי האריכו שיחי התה ימים יותר מהאימפריה ששתלה אותם, ועכשיו הם גדלים כרצונם.**


    אנאסאולי היא פרבר בשוליה הדרום-מערביים של אוזורגטי. המסורת קושרת את שמה לנסיכה אנה, בתו של ממיה השני
    גוריאלי, שליט גוריה בשנים 1600–1625, שהשיא אותה למלך טיימורז מקחתי והעניק לה אחוזה. בני אדם חיו על
    האדמה הזאת כבר בתקופה הנאוליתית, אבל את דמותו של המקום עיצב התה. ב-1930 נוסד כאן מכון לתה, שצמח והפך
    למכון המחקר הכלל-סובייטי לתה ולגידולים סובטרופיים: מ-1938 עסק גם בפרי הדר, ב-1948 החל בטיפוח זנים
    של פרי הדר, והחזיק סניפים בצ'קווי, בסוחומי, בפוטי ובזוגדידי. ב-1953 נפרדה ממנו מחלקת התה והפכה למכון
    עצמאי לתעשיית התה, עם מפעל משלו. עד 1958 מנתה אנאסאולי יותר מ-900 משקי בית.


    העולם הזה נגמר יחד עם ברית המועצות. המטעים, הממוספרים מ-1 עד 14, פרועים ומגודלים: כשהקטיף פסק, שיחים
    רבים התפראו, ושורות רבות נעקרו כדי לפנות מקום לאגוזי לוז, גידול רווחי יותר. בניין המכון הישן עומד
    נטוש, ובחצרו נותרו פסיפסים ומזרקות. משפחות עדיין גרות בבנייני המגורים של הפועלים, וכבר מזמן התרגלו
    לזרים עם מצלמות.


    מעבר למכון מתפתלות דרכי עפר על פני גבעות נמוכות, בין משוכות תה גבוהות ופרועות. בממוצע יורדים כאן 2,168
    מ״מ גשם בשנה, והירוק מעיד על כך.


    מפעל התה של אנאסאולי עדיין פועל. התה הגאורגי חוזר, באצוות קטנות ומוקפדות של יצרנים משפחתיים לאורך
    "דרך התה" של גוריה; אנאסאולי מראה לכם מה הם מחיים — ומה אבד.
  tip: >-
    הכניסה חופשית: אלה שדות פעילים ונטושים לאורך דרכים ציבוריות. את דרכי העפר שמעבר למכון עדיף לעבור ברגל
    ולא ברכב; אחרי גשם הן נעשות חלקלקות, וגשם יורד כאן לעיתים קרובות. בניין המכון רעוע — התפעלו מהפסיפסים
    מבחוץ ואל תיכנסו פנימה. סיור במפעל התה של אנאסאולי, מתקופת ברית המועצות, יש לתאם מראש בטלפון. אין
    במקום שום שירותים, אז אכלו ותדלקו באוזורגטי, חמש דקות משם. השדות ירוקים ביותר ממאי עד אוקטובר; לטעימה
    של ממש המשיכו לאחת החוות שלאורך "דרך התה".
  route: >-
    אנאסאולי נמצאת 304 ק״מ מטביליסי, כ-4 שעות ו-25 דקות נסיעה, כולה על אספלט. סעו מערבה בכביש E60 (S1)
    על פני חאשורי, דרך מקטע ריקוטי ועל פני זסטפוני וקוטאיסי עד סמטרדיה, ומשם בכביש S12 לכיוון לנצ'חוטי
    ובדרכים מקומיות אל כביש Sh2 ועד אוזורגטי. ממרכז העיר סעו ברחוב טקאישווילי דרומה-מערבה; אנאסאולי נמצאת
    כ-2 ק״מ מחוץ לעיר. האספלט מגיע עד המכון; הדרכים אל תוך המטעים הן דרכי עפר, ועדיף לחקור אותן ברגל.
    רכב פרטי רגיל מספיק. תדלקו באוזורגטי.
ar:
  name: حقول الشاي ومعهد الأبحاث في أناسيولي
  short: >-
    ضاحية الشاي في أوزورغيتي: أربع عشرة مزرعة سوفيتية مرقّمة عادت إلى البرّية، ومعهد مهجور بفسيفسائه ونوافيره،
    ومصنع لا يزال يعمل.
  body: >-
    **في أناسيولي عاشت شجيرات الشاي أطول من الإمبراطورية التي غرستها، وهي تنمو الآن على هواها.**


    أناسيولي ضاحية على الطرف الجنوبي الغربي لمدينة أوزورغيتي. ويربط التراث اسمها بالأميرة آنا، ابنة ماميا
    الثاني غورييلي، حاكم غوريا من 1600 إلى 1625، الذي زوّجها من الملك تيموراز ملك كاخيتي ووهبها ضيعة.
    سكن البشر هذه الأرض منذ العصر الحجري الحديث، لكن الشاي هو الذي منح المكان ملامحه. ففي عام 1930 تأسس
    هنا معهد للشاي نما حتى صار معهد عموم الاتحاد السوفيتي لأبحاث الشاي والمحاصيل شبه الاستوائية: تولّى
    الحمضيات أيضًا منذ 1938، وبدأ استنباط أصنافها عام 1948، وأدار فروعًا في تشاكفي وسوخومي وبوتي وزوغديدي.
    وفي عام 1953 انفصل قسم الشاي فيه ليصبح معهدًا مستقلًا لصناعة الشاي له مصنعه الخاص. وبحلول عام 1958
    كانت أناسيولي تضم أكثر من 900 أسرة.


    انتهى ذلك العالم بانتهاء الاتحاد السوفيتي. المزارع المرقّمة من 1 إلى 14 شعثاء كثّة: فحين توقف القطاف
    توحّشت شجيرات كثيرة، واقتُلعت صفوف كثيرة ليحلّ محلها البندق، المحصول الأربح. ويقف مبنى المعهد القديم
    مهجورًا، وقد بقيت في باحته فسيفساء ونوافير. ولا تزال عائلات تسكن المباني السكنية للعمّال، وقد ألفت
    منذ زمن بعيد الغرباءَ حاملي الكاميرات.


    وخلف المعهد تتلوّى دروب ترابية فوق تلال منخفضة بين أسيجة شاي عالية غير مشذّبة. يهطل هنا في المتوسط
    2168 ملم من المطر سنويًا، والخضرة تشهد بذلك.


    لا يزال مصنع شاي أناسيولي يعمل. والشاي الجورجي يعود اليوم بدفعات صغيرة متقنة ينتجها منتجون عائليون
    على امتداد «طريق الشاي» في غوريا؛ وفي أناسيولي ترى ما يُحيونه، وما ضاع.
  tip: >-
    الدخول مجاني: فهذه حقول مزروعة وأخرى مهجورة على امتداد طرق عامة. امشِ في الدروب الترابية خلف المعهد
    بدل أن تقود فيها؛ فهي تزلق بعد المطر، والمطر هنا كثير. مبنى المعهد متداعٍ، فتأمّل الفسيفساء من الخارج
    ولا تدخله. أما زيارة مصنع شاي أناسيولي، العائد إلى الحقبة السوفيتية، فيجب ترتيبها هاتفيًا مسبقًا.
    لا توجد أي مرافق، فتناول طعامك وتزوّد بالوقود في أوزورغيتي على بعد خمس دقائق. تكون الحقول في أشد خضرتها
    من مايو إلى أكتوبر؛ ولتذوّق حقيقي، تابع إلى إحدى مزارع «طريق الشاي».
  route: >-
    تبعد أناسيولي 304 كم عن تبليسي، أي نحو 4 ساعات و25 دقيقة، والطريق معبّد بالأسفلت كله. اسلك الطريق
    E60 (S1) غربًا مرورًا بخاشوري، وعبر مقطع ريكوتي، ثم بزيستافوني وكوتايسي حتى سامتريديا، ومنها الطريق
    S12 باتجاه لانتشخوتي، ثم طرقًا محلية إلى الطريق Sh2 حتى أوزورغيتي. من وسط المدينة اتبع شارع تاكايشفيلي
    نحو الجنوب الغربي؛ تقع أناسيولي على بعد نحو 2 كم. يصل الأسفلت حتى المعهد، أما الدروب المؤدية إلى المزارع
    فترابية ويُستحسن استكشافها سيرًا. تكفي سيارة عادية. املأ خزان الوقود في أوزورغيتي.
