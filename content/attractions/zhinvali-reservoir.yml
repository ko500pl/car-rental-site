ka:
  name: ჟინვალის წყალსაცავი
  short: >-
    თბილისის სასმელი წყალი გრძელ ფირუზისფერ ტბაში, წყალქვეშ მოქცეული შუა საუკუნეების ქალაქის თავზე; ნაპირს
    საქართველოს სამხედრო გზა მიუყვება.
  body: >-
    **თბილისის თითქმის ნახევარი იმ გრძელი, ცისფერ-მწვანე ტბის წყალს სვამს, რომელიც დედაქალაქიდან საათის
    სავალზე, გზის მარჯვნივ იშლება.**


    ჟინვალის წყალსაცავი კაშხალმა შვა, რომლის მშენებლობა 1974 წელს დაიწყო და 1985 წელს დასრულდა: რიყის
    ქვისა და მიწის 102 მეტრი სიმაღლისა და 415 მეტრი სიგრძის ნაყარი არაგვს იქ გადაეღობა, სადაც მდინარე
    ალევის, გუდამაყრისა და ქართლის ქედებს შორის მიედინება. მის უკან 520 მილიონი კუბური მეტრი წყალი დგას,
    11,5 კვადრატულ კილომეტრზე გაშლილი და 75 მეტრამდე სიღრმის, კაშხლის ძირას კი ოთხი ტურბინა, თითო 32,5
    მეგავატის სიმძლავრით, ტრიალებს. მზიან დილას წყალი რძიან ფირუზისფერს იღებს, ღრუბლიან დღეს კი მოიღუშება
    და ნაცრისფერდება.


    წყალმა რაც დაფარა, ის უფრო საინტერესო ამბავია. ძველი ჟინვალი, რომელსაც ქართული წერილობითი წყაროები
    XII საუკუნიდან ქალაქად იცნობენ და ვახუშტი ბაგრატიონმა XVIII საუკუნეში „ძველი ქალაქი“ უწოდა, დატბორვის
    ზონაში მოექცა, მოსახლეობა კი ახალ ადგილას გადასახლდა. მანამდე, 1971 წლიდან, რ. რამიშვილის ხელმძღვანელობით
    მომუშავე არქეოლოგიური ექსპედიცია ხეობის ფსკერს სწავლობდა. მან წარმართული ხატ-სალოცავი აღმოაჩინა, რომლის
    საკურთხეველზეც რელიეფური სპირალებით შემკული თიხის ღვთაების თავი იდგა — საქართველოში ნაპოვნი ერთ-ერთი
    უძველესი ქანდაკება. სამაროვანმა კი აჩვენა, რომ I–VIII საუკუნეებში ქალაქური ტიპის დასახლება არაგვის
    ორივე ნაპირს მოიცავდა.


    წარსული დროდადრო ზედაპირზე ამოდის. წყალქვეშ მოექცა XII საუკუნის ჯვარიპატიოსნის ეკლესიაც; იმ თვეებში,
    როცა დონე იკლებს, მისი კედლები ისევ ტბიდან ამოდის.


    გზა დასავლეთ ნაპირს ანანურამდე მიუყვება, რომლის კოშკებიც წყლის პირასვე დგას. ხედის მოედანზე გაჩერდით,
    წყლის ფერს ჩახედეთ და გაიხსენეთ თიხის ღვთაება, რომელიც ამ ხეობას ინჟინრების მოსვლამდე დიდი ხნით ადრე
    დარაჯობდა.
  tip: >-
    აქ ყველაფერს მზე წყვეტს: ნათელ დილას ან შუადღისას ფირუზისფერი ანათებს, ღრუბლის ქვეშ კი ქრება. გაჩერდით
    მხოლოდ მონიშნულ ჯიბეებში — გზა ვიწროა, მოსახვევები ბრმა, რუსეთის საზღვრისკენ მიმავალი ტვირთმზიდები
    კი მთელი დღე დადიან. ნუ იბანავებთ: ეს დედაქალაქის სასმელი წყალია და სიღრმე 75 მეტრს აღწევს. ყავა და
    საპირფარეშო ანანურთან და დაბა ჟინვალშია. ხედებისთვის ნახევარი საათი საკმარისია; კიდევ ერთი საათი ანანურს
    დაუთმეთ, რომელიც იმავე ნაპირზე დგას.
  route: >-
    თბილისიდან ს1-ით მცხეთისკენ გადით, შემდეგ საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთით წადით, ნატახტარსა
    და ბაზალეთის გასახვევს გასცდით და დაბა ჟინვალამდე და კაშხლამდე მიხვალთ — დაახლოებით 56 კმ და საათზე
    ცოტა მეტი. კაშხლის შემდეგ გზა დასავლეთ ნაპირს მიუყვება და ანანურამდე მომდევნო ათი კილომეტრი სწორედ
    ხედების მონაკვეთია. ასფალტი კარგია, მაგრამ ვიწრო, ფერდობში ჩაჭრილი და ბრმა მოსახვევებით სავსე — ტვირთმზიდებს
    მოთმინებით გაუსწარით. საწვავი ნატახტარსა და ჟინვალში იშოვება. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში
    სავსებით საკმარისია.
en:
  name: Zhinvali Reservoir
  short: >-
    Tbilisi's drinking water in a long turquoise lake, laid over a drowned medieval town, with the Military
    Highway running along its shore.
  body: >-
    **Roughly half of Tbilisi drinks from the long blue-green lake that opens on your right an hour north
    of the city.**


    The Zhinvali reservoir was made by a dam begun in 1974 and completed in 1985: a pebble-and-earth wall
    102 metres high and 415 metres long, thrown across the Aragvi where it runs between the Aleve, Gudamakari
    and Kartli ranges. Behind it wait some 520 million cubic metres of water, up to 75 metres deep and
    spread over 11.5 square kilometres, while four turbines of 32.5 megawatts each turn at its foot. On
    a sunny morning the water goes a milky turquoise; under cloud it sulks to grey.


    What the lake covered is the better story. Old Zhinvali, which Georgian chronicles know as a town
    from the 12th century and which Vakhushti Bagrationi called "an old city" in the 18th, went under,
    and its people were resettled on higher ground. Before the water came, an archaeological expedition
    led by R. Ramishvili worked the valley floor from 1971. It found a pagan sanctuary whose altar held
    a clay head of a deity, ringed with relief spirals, among the oldest sculptures ever found in Georgia.
    Graves showed that from the 1st to the 8th century a town-like settlement spread across both banks
    of the Aragvi.


    Some of the past still surfaces. The 12th-century church of Jvaripatiosani was caught by the rising
    water, and in the months when the level drops its walls step out of the lake again.


    The highway follows the western shore to Ananuri, whose towers stand at the water's edge. Pull into
    a lay-by, look down at the colour, and think of the clay god who watched over this valley long before
    the engineers arrived.
  tip: >-
    Sun is everything here: on a bright morning or at midday the turquoise glows, under cloud it vanishes.
    Stop only in the marked lay-bys, because the road is narrow, the bends are blind and lorries bound
    for the Russian border use it all day. Do not swim: this is the capital's drinking water, and it is
    up to 75 metres deep. Coffee and toilets are at Ananuri and in the town of Zhinvali. Half an hour
    covers the viewpoints; add an hour for Ananuri, which shares the same shore.
  route: >-
    Leave Tbilisi on the S1 towards Mtskheta, then head north on the Georgian Military Highway (S3/E117)
    past Natakhtari and the Bazaleti turn to the town of Zhinvali and the dam: about 56 km and just over
    an hour. Beyond the dam the road runs along the western shore, and the next ten kilometres to Ananuri
    are the stretch with the views. The asphalt is good but narrow, cut into the hillside, with plenty
    of blind corners, so overtake lorries with patience. Fuel is available in Natakhtari and Zhinvali.
    An economy car is entirely sufficient all year.
ru:
  name: Жинвальское водохранилище
  short: >-
    Питьевая вода Тбилиси в длинном бирюзовом озере над затопленным средневековым городом; вдоль его берега
    бежит Военно-Грузинская дорога.
  body: >-
    **Примерно половина Тбилиси пьёт воду из длинного сине-зелёного озера, которое открывается справа
    через час езды на север от города.**


    Жинвальское водохранилище создала плотина, начатая в 1974 году и законченная в 1985-м: галечно-земляной
    вал высотой 102 метра и длиной 415 метров, перегородивший Арагви там, где она течёт между Алевским,
    Гудамакарским и Картлийским хребтами. За ним стоит около 520 миллионов кубометров воды глубиной до
    75 метров на площади 11,5 квадратного километра, а у подножия вращаются четыре турбины по 32,5 мегаватта
    каждая. Солнечным утром вода становится молочно-бирюзовой, под тучами хмурится и сереет.


    Но интереснее то, что скрыто под водой. Старый Жинвали, который грузинские летописи знают как город
    с XII века и который Вахушти Багратиони в XVIII веке назвал «старым городом», ушёл на дно, а жителей
    переселили выше по склонам. Перед затоплением, с 1971 года, на дне долины работала археологическая
    экспедиция под руководством Р. Рамишвили. Она нашла языческое святилище, на алтаре которого лежала
    глиняная голова божества, опоясанная рельефными спиралями, — одна из древнейших скульптур, когда-либо
    найденных в Грузии. Погребения показали, что с I по VIII век по обоим берегам Арагви раскинулось поселение
    городского типа.


    Кое-что из прошлого до сих пор выходит на поверхность. Церковь Джварипатиосани XII века оказалась
    в зоне затопления, и в те месяцы, когда уровень падает, её стены снова выступают из озера.


    Шоссе идёт по западному берегу к Ананури, чьи башни стоят у самой воды. Сверните на площадку у обочины,
    посмотрите вниз на этот цвет и вспомните глиняного бога, который охранял долину задолго до прихода
    инженеров.
  tip: >-
    Здесь всё решает солнце: ясным утром или в полдень бирюза светится, под облаками исчезает. Останавливайтесь
    только на обозначенных площадках — дорога узкая, повороты без обзора, а фуры к российской границе
    идут по ней весь день. Не купайтесь: это питьевая вода столицы, и глубина здесь до 75 метров. Кофе
    и туалеты — в Ананури и в посёлке Жинвали. На смотровые площадки хватит получаса; добавьте час на
    Ананури, который стоит на том же берегу.
  route: >-
    Выезжайте из Тбилиси по S1 в сторону Мцхеты, затем на север по Военно-Грузинской дороге (S3/E117)
    мимо Натахтари и поворота на Базалети к посёлку Жинвали и плотине: около 56 км и чуть больше часа.
    За плотиной дорога идёт вдоль западного берега, и следующие десять километров до Ананури — самый видовой
    отрезок. Асфальт хороший, но узкий, врезанный в склон, со множеством поворотов без обзора, так что
    обгоняйте фуры терпеливо. Заправки есть в Натахтари и Жинвали. Машины эконом-класса вполне достаточно
    круглый год.
fa:
  name: دریاچهٔ سد ژینوالی
  short: >-
    آب آشامیدنی تفلیس در دریاچه‌ای دراز و فیروزه‌ای، گسترده بر شهری غرق‌شده از سده‌های میانه، که جادهٔ
    نظامی گرجستان در کرانه‌اش می‌گذرد.
  body: >-
    **نزدیک به نیمی از تفلیس از دریاچهٔ دراز آبی‌سبزی آب می‌نوشد که یک ساعت پس از خروج از شهر به سمت شمال،
    در سمت راستتان پدیدار می‌شود.**


    دریاچهٔ ژینوالی را سدی پدید آورد که ساختش در ۱۹۷۴ آغاز شد و در ۱۹۸۵ به پایان رسید: دیواره‌ای از قلوه‌سنگ
    و خاک به بلندی ۱۰۲ متر و درازای ۴۱۵ متر که بر آراگوی کشیده شد، آنجا که رود میان رشته‌کوه‌های آلوه،
    گودامکاری و کارتلی جاری است. پشت آن حدود ۵۲۰ میلیون متر مکعب آب با ژرفای تا ۷۵ متر بر ۱۱٫۵ کیلومتر
    مربع گسترده است و در پای سد چهار توربین، هر یک ۳۲٫۵ مگاوات، می‌چرخند. در صبحی آفتابی آب به فیروزه‌ای
    شیری درمی‌آید؛ زیر ابر اخم می‌کند و خاکستری می‌شود.


    داستان بهتر آن چیزی است که دریاچه پوشانده است. ژینوالی کهن، که وقایع‌نامه‌های گرجی از سدهٔ دوازدهم
    آن را شهر می‌شناسند و واخوشتی باگراتیونی در سدهٔ هجدهم «شهری کهن» خواندش، زیر آب رفت و مردمش را به
    زمین‌های بالاتر کوچاندند. پیش از آمدن آب، از ۱۹۷۱ هیئتی باستان‌شناسی به سرپرستی ر. رامیشویلی در کف
    دره کاوش کرد. این هیئت پرستشگاهی پیش از مسیحیت یافت که بر محرابش سری سفالین از یک خدا، با حلقه‌ای
    از مارپیچ‌های برجسته، قرار داشت؛ از کهن‌ترین پیکره‌هایی که تاکنون در گرجستان پیدا شده است. گورها نشان
    دادند که از سدهٔ یکم تا هشتم میلادی، سکونتگاهی شهرمانند بر هر دو کرانهٔ آراگوی گسترده بوده است.


    پاره‌ای از گذشته هنوز سر برمی‌آورد. کلیسای جواری‌پاتیوسانی از سدهٔ دوازدهم در میان آب بالاآمده گرفتار
    ماند، و در ماه‌هایی که سطح آب پایین می‌رود دیوارهایش دوباره از دریاچه بیرون می‌آیند.


    جاده کرانهٔ غربی را تا آنانوری دنبال می‌کند، که برج‌هایش درست کنار آب ایستاده‌اند. در یکی از توقفگاه‌های
    کنار جاده بایستید، به آن رنگ از بالا نگاه کنید و به خدای سفالینی بیندیشید که دیرزمانی پیش از رسیدن
    مهندسان، نگهبان این دره بود.
  tip: >-
    اینجا همه چیز به آفتاب بسته است: در صبح روشن یا نیمروز، فیروزه‌ای می‌درخشد و زیر ابر ناپدید می‌شود.
    فقط در توقفگاه‌های مشخص بایستید، چون جاده باریک است، پیچ‌ها کور است و کامیون‌هایی که به سوی مرز روسیه
    می‌روند تمام روز از آن می‌گذرند. شنا نکنید: این آب آشامیدنی پایتخت است و ژرفایش به ۷۵ متر می‌رسد.
    قهوه و سرویس بهداشتی در آنانوری و شهرک ژینوالی هست. نیم ساعت برای چشم‌اندازها کافی است؛ یک ساعت هم
    برای آنانوری، که بر همین کرانه است، بیفزایید.
  route: >-
    از تفلیس با S1 به سوی متسختا بروید، سپس از جادهٔ نظامی گرجستان (S3/E117) به شمال بپیچید و از ناتاختاری
    و دوراهی بازالتی بگذرید تا به شهرک ژینوالی و سد برسید: حدود ۵۶ کیلومتر و کمی بیش از یک ساعت. پس از
    سد، جاده در کرانهٔ غربی پیش می‌رود و ده کیلومتر بعدی تا آنانوری همان بخشی است که چشم‌اندازها را دارد.
    آسفالت خوب اما باریک است، در دل دامنه کنده شده و پر از پیچ‌های کور، پس برای سبقت از کامیون‌ها صبور
    باشید. سوخت در ناتاختاری و ژینوالی هست. خودروی اقتصادی در همهٔ فصل‌ها کاملاً کافی است.
he:
  name: מאגר ז׳ינוואלי
  short: >-
    מי השתייה של טביליסי באגם ארוך בצבע טורקיז, הפרוש מעל עיר טבועה מימי הביניים, וכביש הצבא הגאורגי עובר
    לאורך חופו.
  body: >-
    **כמחצית מטביליסי שותה מן האגם הארוך, הכחול-ירוק, שנפתח מימינכם שעת נסיעה צפונה מן העיר.**


    מאגר ז׳ינוואלי נוצר בידי סכר שבנייתו החלה ב-1974 והושלמה ב-1985: סוללה של חצץ ועפר בגובה 102 מטר ובאורך
    415 מטר, שנמתחה לרוחב האראגווי במקום שבו הוא זורם בין רכסי אלווה, גודמקרי וקרתלי. מאחוריה עומדים כ-520
    מיליון מטרים מעוקבים של מים, בעומק של עד 75 מטר ועל שטח של 11.5 קמ״ר, ולמרגלותיה מסתובבות ארבע טורבינות
    של 32.5 מגה-ואט כל אחת. בבוקר שמשי המים הופכים לטורקיז חלבי; תחת עננים הם מתקדרים ומאפירים.


    הסיפור הטוב יותר הוא מה שהאגם כיסה. ז׳ינוואלי העתיקה, שהכרוניקות הגאורגיות מכירות כעיר מן המאה ה-12
    ושוואחושטי בגרטיוני כינה במאה ה-18 ״עיר עתיקה״, שקעה מתחת למים, ותושביה יושבו מחדש על קרקע גבוהה יותר.
    לפני שהגיעו המים, החל מ-1971, חפרה בקרקעית העמק משלחת ארכאולוגית בראשות ר. רמישווילי. היא מצאה מקדש
    פגני שעל המזבח שלו ניצב ראש חימר של אל, מוקף ספירלות בתבליט, מן הפסלים הקדומים ביותר שנמצאו אי פעם
    בגאורגיה. קברים הראו שמן המאה ה-1 ועד המאה ה-8 השתרע על שתי גדות האראגווי יישוב בעל אופי עירוני.


    חלק מן העבר עדיין עולה אל פני השטח. כנסיית ג׳וואריפטיוסאני מן המאה ה-12 נלכדה במים העולים, ובחודשים
    שבהם המפלס יורד קירותיה יוצאים שוב מן האגם.


    הכביש עוקב אחר החוף המערבי עד אנאנורי, שמגדליה עומדים על שפת המים. עצרו במפרץ חניה, הביטו מטה אל הצבע,
    וחשבו על אל החימר ששמר על העמק הזה הרבה לפני שהגיעו המהנדסים.
  tip: >-
    כאן הכול תלוי בשמש: בבוקר בהיר או בצהריים הטורקיז זוהר, ותחת עננים הוא נעלם. עצרו רק במפרצי החניה
    המסומנים, כי הכביש צר, העיקולים עיוורים ומשאיות בדרכן לגבול רוסיה נוסעות בו כל היום. אל תשחו: אלה
    מי השתייה של הבירה, והעומק מגיע ל-75 מטר. קפה ושירותים יש באנאנורי ובעיירה ז׳ינוואלי. חצי שעה מספיקה
    לנקודות התצפית; הוסיפו שעה לאנאנורי, השוכנת על אותו חוף.
  route: >-
    צאו מטביליסי בכביש S1 לכיוון מצחתה, ואז צפונה בכביש הצבא הגאורגי (S3/E117), על פני נטחטרי והפנייה
    לבזלטי, אל העיירה ז׳ינוואלי והסכר: כ-56 ק״מ וקצת יותר משעה. אחרי הסכר הכביש עובר לאורך החוף המערבי,
    ועשרת הקילומטרים הבאים עד אנאנורי הם קטע הנוף היפה ביותר. האספלט טוב אך צר, חצוב בצלע ההר ומלא עיקולים
    עיוורים, לכן עקפו משאיות בסבלנות. דלק יש בנטחטרי ובז׳ינוואלי. רכב חסכוני מספיק בהחלט בכל ימות השנה.
ar:
  name: بحيرة سدّ جينفالي
  short: >-
    مياه الشرب لتبليسي في بحيرة طويلة فيروزية اللون، ممدودة فوق مدينة غارقة من القرون الوسطى، يسير الطريق
    العسكري الجورجي بمحاذاة شاطئها.
  body: >-
    **نحو نصف سكان تبليسي يشربون من البحيرة الطويلة الزرقاء الخضراء التي تنفتح على يمينك بعد ساعة من القيادة
    شمالاً من المدينة.**


    صنع بحيرةَ جينفالي سدٌّ بدأ بناؤه عام 1974 واكتمل عام 1985: جدار من الحصى والتراب ارتفاعه 102 متر
    وطوله 415 متراً، أُلقي عرضاً على نهر أراغفي حيث يجري بين سلاسل أليفي وغوداماكاري وكارتلي. وخلفه ينتظر
    نحو 520 مليون متر مكعب من الماء، بعمق يصل إلى 75 متراً، ممتدة على 11.5 كيلومتر مربع، بينما تدور عند
    قاعدته أربعة توربينات قدرة كل منها 32.5 ميغاواط. في الصباح المشمس يصير الماء فيروزياً حليبياً، وتحت
    الغيم يتجهّم ويستحيل رمادياً.


    غير أن الحكاية الأجمل هي ما غطّته البحيرة. فجينفالي القديمة، التي تعرفها الحوليات الجورجية مدينةً
    منذ القرن الثاني عشر، ووصفها فاخوشتي باغراتيوني في القرن الثامن عشر بأنها «مدينة قديمة»، غرقت تحت
    الماء، ونُقل سكانها إلى أرض أعلى. وقبل أن يصل الماء، ومنذ عام 1971، عملت في قاع الوادي بعثة أثرية
    بقيادة ر. راميشفيلي. فعثرت على معبد وثني حمل مذبحه رأساً من الطين لإله تحيط به لوالب نافرة، وهو من
    أقدم المنحوتات التي وُجدت في جورجيا على الإطلاق. وكشفت القبور أن مستوطنة ذات طابع مديني امتدت على
    ضفتي أراغفي من القرن الأول حتى القرن الثامن.


    وبعض الماضي لا يزال يطفو. فكنيسة جواريباتيوساني من القرن الثاني عشر حاصرها الماء الصاعد، وفي الأشهر
    التي ينخفض فيها المنسوب تخرج جدرانها من البحيرة من جديد.


    يتبع الطريق الشاطئ الغربي حتى أنانوري، التي تقف أبراجها على حافة الماء. توقّف في أحد المواقف الجانبية،
    وانظر إلى الأسفل نحو ذلك اللون، وتذكّر إله الطين الذي حرس هذا الوادي قبل وصول المهندسين بزمن طويل.
  tip: >-
    الشمس هنا هي كل شيء: في صباح صافٍ أو عند الظهيرة يتوهّج الفيروز، وتحت الغيم يختفي. لا تتوقف إلا في
    المواقف المحددة، فالطريق ضيق والمنعطفات عمياء، والشاحنات المتجهة إلى الحدود الروسية تسلكه طوال اليوم.
    لا تسبح: هذه مياه شرب العاصمة، وعمقها يبلغ 75 متراً. القهوة ودورات المياه في أنانوري وفي بلدة جينفالي.
    تكفي نصف ساعة لنقاط المشاهدة، وأضف ساعة لأنانوري التي تقع على الشاطئ نفسه.
  route: >-
    اخرج من تبليسي على الطريق S1 باتجاه متسخيتا، ثم اتجه شمالاً على الطريق العسكري الجورجي (S3/E117) مروراً
    بناتاختاري ومنعطف بازاليتي حتى بلدة جينفالي والسد: نحو 56 كم وما يزيد قليلاً على ساعة. بعد السد يسير
    الطريق على الشاطئ الغربي، والكيلومترات العشرة التالية حتى أنانوري هي أجمل مقاطع المناظر. الأسفلت جيد
    لكنه ضيق، محفور في سفح الجبل، وكثير المنعطفات العمياء، فتحلَّ بالصبر عند تجاوز الشاحنات. الوقود متوفر
    في ناتاختاري وجينفالي. وتكفي سيارة اقتصادية تماماً طوال العام.
