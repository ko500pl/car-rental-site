ka:
  name: ჟინვალის წყალსაცავი
  short: ფირუზისფერი ხელოვნური ტბა არაგვის ხეობაში — საქართველოს სამხედრო გზის პირველი დიდი ხედი.
  body: >-
    **ჟინვალის წყალსაცავი ის მომენტია, სადაც გზა უცებ იცვლება.** თბილისიდან ერთი საათის შემდეგ ბარის პეიზაჟი
    მთავრდება და მარჯვნივ იშლება გრძელი, ვიწრო, კაშკაშა ფირუზისფერი წყალი, რომელიც მთებს შორის იკლაკნება.
    ფერი ნამდვილია და მინერალური ნაწილაკებით აიხსნება, რომლებსაც არაგვი მთიდან ჩამოაქვს.


    წყალსაცავი 1985 წელს შეიქმნა ჟინვალის ჰიდროელექტროსადგურის კაშხლის აშენების შემდეგ. ის თბილისს სასმელი
    წყლის დიდ ნაწილს აწვდის და ერთდროულად ელექტროენერგიასაც. წყალქვეშ დარჩა ძველი სოფლები და შუა საუკუნეების
    ნაგებობები; მშრალ წლებში, როცა დონე მკვეთრად ეცემა, ზოგან კედლების ნაშთები ჩნდება — ეს ადგილობრივი
    ლეგენდების საყვარელი თემაა.


    პრაქტიკულად, ჟინვალი გაჩერების ადგილია და არა დანიშნულების პუნქტი:


    - გზისპირა ხედის მოედნები კაშხალსა და ანანურს შორის, თითქმის ყველა მოსახვევზე

    - ანანურის ციხე პირდაპირ ნაპირზე — ორივე ერთ ვიზიტში ჯდება

    - სეზონურად მუშაობს ნავები და კატამარანები ჩრდილოეთ ნაწილში

    - გზისპირა კაფეები და თევზის რესტორნები კაშხლის სამხრეთით


    დონე წლის განმავლობაში საგრძნობლად იცვლება: გაზაფხულზე წყალსაცავი სავსეა და ფერი ყველაზე მკვეთრია,
    ზაფხულის ბოლოს კი ნაპირი შიშვლდება და ხედი ნაკლებად ეფექტურია.
  tip: >-
    ფოტოსთვის საუკეთესო დროა დილის სინათლე ან შუადღის მზე — მოღრუბლულ ამინდში ფირუზისფერი პრაქტიკულად
    ქრება და წყალი ნაცრისფერი ხდება. გაჩერდი მხოლოდ მონიშნულ ჯიბეებში: გზა ვიწროა და მოსახვევში დგომა
    სახიფათოა. ბანაობა კაშხლის ზონაში აკრძალულია და დინებაც არასტაბილურია. თხევადი ინფრასტრუქტურა — ტუალეტი,
    ყავა — ანანურთან და ჟინვალის სოფელშია. ნახევარი საათი გაჩერებისთვის სავსებით საკმარისია.
  route: >-
    თბილისიდან ჩრდილოეთით საქართველოს სამხედრო გზით (E117): მცხეთა, ნატახტარი, ჟინვალი — დაახლოებით 65
    კმ და საათი და ათი-თხუთმეტი წუთი. კაშხლის შემდეგ გზა ნაპირს გაჰყვება და შემდეგი 10 კმ სწორედ ის მონაკვეთია,
    სადაც ხედები იშლება. ასფალტი კარგია, მაგრამ ვიწრო და კლდეში ჩაჭრილი, ბევრი ბრმა მოსახვევით — ტვირთის
    მანქანებს ფრთხილად უსწრებ. საწვავი აიღე ნატახტარში, ზემოთ სადგურები იშვიათია. ეკონომ-კლასი სავსებით
    საკმარისია.
en:
  name: Zhinvali Reservoir
  short: A turquoise artificial lake in the Aragvi valley — the first big view on the Georgian Military
    Highway.
  body: >-
    **Zhinvali is the point where the drive changes character.** An hour out of Tbilisi the lowland scenery
    ends and a long, narrow, startlingly turquoise lake appears on the right, winding between wooded ridges.
    The colour is genuine, caused by fine mineral particles the Aragvi carries down from the mountains,
    and it is strongest under direct sun.


    The reservoir was created in 1985 when the Zhinvali dam was completed. It supplies a large part of
    Tbilisi's drinking water and generates power at the same time. Old villages and medieval structures
    were flooded when the valley filled; in dry years, when the level drops sharply, fragments of walls
    reappear, which keeps local legends in good supply.


    In practice Zhinvali is a stop rather than a destination:


    - Roadside viewpoints between the dam and Ananuri, at almost every bend

    - Ananuri fortress standing directly on the shore, so both fit into one visit

    - Seasonal boat and pedalo hire in the northern arm of the lake

    - Roadside cafés and trout restaurants south of the dam


    The water level changes a lot through the year. In spring the reservoir is full and the colour is
    at its most intense; by late summer the shoreline is exposed and the effect is noticeably weaker.
  tip: >-
    Morning light or bright midday sun give the best photographs — under cloud the turquoise disappears
    almost completely and the water turns grey. Stop only in the marked lay-bys, because the road is narrow
    and standing on a bend is dangerous. Swimming near the dam is prohibited and the currents are unpredictable.
    Toilets and coffee are available at Ananuri and in Zhinvali village. Half an hour is plenty for the
    viewpoints if you are heading further north.
  route: >-
    From Tbilisi head north on the Georgian Military Highway (E117) through Mtskheta and Natakhtari to
    Zhinvali — about 65 km and an hour and ten to fifteen minutes. After the dam the road follows the
    shoreline, and the next ten kilometres are the stretch with the views. The asphalt is good but narrow,
    cut into the rock, with plenty of blind corners, so overtake lorries carefully. Fill up in Natakhtari,
    as stations become scarce higher up. An economy car is entirely sufficient.
ru:
  name: Жинвальское водохранилище
  short: Бирюзовое искусственное озеро в Арагвском ущелье — первый большой вид Военно-Грузинской дороги.
  body: >-
    **Жинвали — та точка, где дорога меняет характер.** Через час после Тбилиси равнинный пейзаж заканчивается,
    и справа появляется длинное узкое озеро поразительного бирюзового цвета, петляющее между лесистыми
    хребтами. Цвет настоящий: его дают мельчайшие минеральные частицы, которые Арагви несёт с гор, и ярче
    всего он под прямым солнцем.


    Водохранилище появилось в 1985 году после завершения Жинвальской плотины. Оно снабжает значительную
    часть Тбилиси питьевой водой и одновременно даёт электроэнергию. При заполнении долины под водой остались
    старые сёла и средневековые постройки; в засушливые годы, когда уровень резко падает, местами показываются
    остатки стен — благодатная почва для местных легенд.


    На практике Жинвали — это остановка, а не пункт назначения:


    - Придорожные смотровые площадки между плотиной и Ананури, почти на каждом повороте

    - Крепость Ананури прямо на берегу, так что оба места укладываются в один визит

    - Сезонный прокат лодок и катамаранов в северной части озера

    - Придорожные кафе и форелевые рестораны южнее плотины


    Уровень воды сильно меняется в течение года: весной водохранилище полное и цвет максимально насыщенный,
    к концу лета берег обнажается и эффект заметно слабее.
  tip: >-
    Для фотографий лучше утренний свет или яркое дневное солнце — в пасмурную погоду бирюза почти исчезает
    и вода становится серой. Останавливайтесь только в размеченных карманах: дорога узкая, стоять на повороте
    опасно. Купаться у плотины запрещено, течения непредсказуемы. Туалеты и кофе есть в Ананури и в селе
    Жинвали. Получаса на смотровые площадки достаточно, если едете дальше на север.
  route: >-
    Из Тбилиси на север по Военно-Грузинской дороге (E117) через Мцхету и Натахтари до Жинвали — около
    65 км и час десять-пятнадцать. За плотиной дорога идёт вдоль берега, и следующие десять километров
    — как раз тот участок, где открываются виды. Асфальт хороший, но узкий, дорога врезана в скалу, много
    слепых поворотов, обгонять грузовики надо осторожно. Заправляйтесь в Натахтари: выше станции попадаются
    редко. Машины эконом-класса вполне достаточно.
fa:
  name: آبگیر ژینوالی
  short: دریاچهٔ مصنوعی فیروزه‌ای در درهٔ آراگوی — نخستین منظرهٔ بزرگ بزرگراه نظامی گرجستان.
  body: >-
    **ژینوالی نقطه‌ای است که رانندگی در آن عوض می‌شود.** یک ساعت بیرون از تفلیس چشم‌انداز پست تمام می‌شود
    و دریاچه‌ای دراز، باریک و به‌طرز شگفتی فیروزه‌ای در سمت راست پیدا می‌شود که میان ستیغ‌های جنگلی می‌پیچد.
    رنگ واقعی است و از ذرات ریز معدنی می‌آید که آراگوی از کوهستان پایین می‌آورد، و زیر آفتاب مستقیم پررنگ‌ترین
    است.


    آبگیر در 1985 با تکمیل سد ژینوالی پدید آمد. بخش بزرگی از آب آشامیدنی تفلیس را تأمین می‌کند و هم‌زمان
    برق تولید می‌کند. با پرشدن دره روستاهای کهن و بناهای سده‌های میانه زیر آب رفتند؛ در سال‌های خشک که
    تراز به‌شدت پایین می‌آید، پاره‌های دیوار دوباره پیدا می‌شوند و افسانه‌های محلی را زنده نگه می‌دارند.


    در عمل ژینوالی توقفی است، نه مقصد: چشم‌اندازهای کنار جاده میان سد و آنانوری، تقریباً در هر پیچ؛ قلعهٔ
    آنانوری که درست بر ساحل ایستاده، پس هر دو در یک بازدید جا می‌شوند؛ کرایهٔ فصلی قایق و قایق پایی در
    بازوی شمالی دریاچه؛ و کافه‌ها و رستوران‌های قزل‌آلا در کنار جاده، جنوب سد. تراز آب در طول سال بسیار
    تغییر می‌کند. بهار آبگیر پر است و رنگ در شدیدترین حالت؛ تا اواخر تابستان خط ساحلی برهنه می‌شود و اثر
    به‌روشنی ضعیف‌تر است.
  tip: >-
    نور صبح یا آفتاب تند نیمروز بهترین عکس‌ها را می‌دهد — زیر ابر فیروزه‌ای تقریباً یکسره ناپدید می‌شود
    و آب خاکستری می‌گردد. فقط در توقفگاه‌های علامت‌دار بایستید، چون جاده باریک است و ایستادن روی پیچ خطرناک.
    شنا نزدیک سد ممنوع است و جریان‌ها پیش‌بینی‌ناپذیرند. سرویس بهداشتی و قهوه در آنانوری و در روستای ژینوالی
    هست. اگر شمالی‌تر می‌روید، نیم ساعت برای چشم‌اندازها کافی است.
  route: >-
    از تفلیس رو به شمال بزرگراه نظامی گرجستان (E117) را از متسختا و ناتاختاری تا ژینوالی بگیرید — حدود
    65 کیلومتر و یک ساعت و ده تا پانزده دقیقه. پس از سد جاده خط ساحلی را دنبال می‌کند و ده کیلومتر بعدی
    همان بخشی است که منظره دارد. آسفالت خوب اما باریک است، در صخره بریده شده و پیچ‌های کور فراوان دارد،
    پس در سبقت از کامیون‌ها محتاط باشید. باک را در ناتاختاری پر کنید، چون بالاتر پمپ‌ها کمیاب می‌شوند.
    خودروی اقتصادی کاملاً کافی است.
he:
  name: מאגר ז'ינוואלי
  short: אגם מלאכותי טורקיז בעמק האראגווי — הנוף הגדול הראשון על כביש הצבא הגאורגי.
  body: >-
    **ז'ינוואלי היא הנקודה שבה הנסיעה משנה אופי.** שעה מטביליסי נגמר נוף השפלה ומימין מופיע אגם ארוך,
    צר וטורקיז באופן מפתיע, המתפתל בין רכסים מיוערים לאורך העמק. הצבע אמיתי, ומקורו בחלקיקי מינרלים דקים
    שהאראגווי מוריד עמו מן ההרים, והוא חזק ביותר תחת שמש ישירה.


    המאגר נוצר ב-1985 עם השלמת סכר ז'ינוואלי. הוא מספק חלק גדול ממי השתייה של טביליסי ומייצר חשמל בו בזמן.
    כפרים עתיקים ומבנים מימי הביניים הוצפו כשהעמק התמלא; בשנים יבשות, כשהמפלס יורד בחדות, שבים ומופיעים
    שרידי חומות, וזה מספק דלק קבוע לאגדות המקומיות.


    בפועל ז'ינוואלי היא עצירה ולא יעד: נקודות תצפית לצד הכביש בין הסכר לאנאנורי, כמעט בכל פנייה; מבצר
    אנאנורי העומד ממש על שפת המים, כך ששני האתרים נכנסים לביקור אחד; השכרת סירות ופדלו עונתית בזרוע הצפונית
    של האגם; ובתי קפה ומסעדות פורלים הפרושים לצד הכביש מדרום לסכר. מפלס המים משתנה מאוד לאורך השנה. באביב
    המאגר מלא והצבע במיטבו; בשלהי הקיץ קו החוף נחשף וההשפעה חלשה בהרבה.
  tip: >-
    אור הבוקר או שמש צהריים בהירה נותנים את התצלומים הטובים ביותר — תחת עננים הטורקיז נעלם כמעט לחלוטין
    והמים הופכים אפורים. עצרו רק במפרצי החניה המסומנים, כי הכביש צר ועמידה בפנייה מסוכנת. השחייה בקרבת
    הסכר אסורה והזרמים בלתי צפויים. שירותים וקפה זמינים באנאנורי ובכפר ז'ינוואלי. חצי שעה מספיקה בהחלט
    לנקודות התצפית אם אתם ממשיכים צפונה.
  route: >-
    מטביליסי סעו צפונה בכביש הצבא הגאורגי (E117) דרך מצחתה ונאטאחתארי עד ז'ינוואלי — כ-65 ק"מ ושעה ועשר
    עד חמש עשרה דקות. אחרי הסכר הכביש עוקב אחר קו החוף, ועשרת הקילומטרים הבאים הם הקטע עם הנופים. האספלט
    טוב אך צר, חצוב בסלע ומלא פניות עיוורות, אז עקפו משאיות בזהירות. תדלקו בנאטאחתארי, שכן התחנות מתמעטות
    גבוה יותר. רכב חסכוני מספיק לחלוטין.
ar:
  name: خزان جينفالي
  short: بحيرة صناعية فيروزية في وادي أراغفي — أول إطلالة كبرى على الطريق العسكري الجورجي.
  body: >-
    **جينفالي هي النقطة التي تتبدل عندها طبيعة الرحلة.** فبعد ساعة من تبليسي ينتهي مشهد السهول وتظهر على
    اليمين بحيرة طويلة ضيقة فيروزية على نحو مذهل، تتلوى بين حواف مشجرة. واللون حقيقي، سببه جزيئات معدنية
    دقيقة يحملها أراغفي نازلاً من الجبال، وهو أشد ما يكون تحت الشمس المباشرة.


    نشأ الخزان عام 1985 مع اكتمال سد جينفالي. وهو يزود تبليسي بجزء كبير من مياه الشرب ويولّد الكهرباء
    في الوقت نفسه. وقد غُمرت قرى قديمة ومبانٍ من العصور الوسطى حين امتلأ الوادي؛ وفي السنوات الجافة، حين
    يهبط المنسوب بحدة، تعود بقايا الجدران إلى الظهور، وهو ما يبقي الأساطير المحلية حية.


    وعملياً جينفالي محطة لا وجهة: مطلات على جانب الطريق بين السد وأنانوري، عند كل منعطف تقريباً؛ وقلعة
    أنانوري القائمة على الشاطئ مباشرة، فتدخل الاثنتان في زيارة واحدة؛ وتأجير موسمي للقوارب وقوارب الدواسات
    في الذراع الشمالية للبحيرة؛ ومقاهٍ ومطاعم لسمك السلمون المرقط على جانب الطريق جنوب السد. ويتغير منسوب
    الماء كثيراً على مدار السنة. ففي الربيع يمتلئ الخزان ويبلغ اللون ذروته؛ وفي أواخر الصيف ينكشف خط الشاطئ
    ويضعف الأثر بوضوح.
  tip: >-
    ضوء الصباح أو شمس الظهيرة الساطعة يمنحان أفضل الصور — فتحت الغيوم يختفي اللون الفيروزي تقريباً ويصير
    الماء رمادياً. توقف في الجيوب المعلَّمة فقط، فالطريق ضيق والوقوف عند منعطف خطر. السباحة قرب السد ممنوعة
    والتيارات لا يمكن التنبؤ بها. دورات المياه والقهوة متاحة عند أنانوري وفي قرية جينفالي. ونصف ساعة تكفي
    تماماً للمطلات إن كنت متجهاً إلى الشمال.
  route: >-
    من تبليسي اتجه شمالاً على الطريق العسكري الجورجي (E117) عبر متسخيتا وناتاختاري حتى جينفالي — نحو 65
    كم وساعة وعشر إلى خمس عشرة دقيقة. وبعد السد يتبع الطريق خط الشاطئ، والكيلومترات العشرة التالية هي
    المقطع صاحب الإطلالات. الإسفلت جيد لكنه ضيق منحوت في الصخر وكثير المنعطفات العمياء، فتجاوز الشاحنات
    بحذر. تزود بالوقود في ناتاختاري، فالمحطات تقل كلما ارتفعت. والسيارة الاقتصادية كافية تماماً.
