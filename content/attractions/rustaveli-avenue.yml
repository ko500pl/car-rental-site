ka:
  name: რუსთაველის გამზირი
  short: >-
    ერთნახევარი კილომეტრი ოპერის, პარლამენტის, მოხატული ტაძრისა და ჭადრების ჩრდილისა — თბილისის ვიტრინა
    და მისი პოლიტიკური მეხსიერების სცენა.
  body: >-
    **თბილისი თავის საუკეთესო შენობებს რუსთაველის გამზირზე აშენებს — და თავის რისხვასაც აქ მოაქვს.**


    გამზირი დიღმის გზით დაიწყო, რომელიც ქალაქიდან ჩრდილოეთისკენ გადიოდა. XIX საუკუნის 40-იან წლებში მეფისნაცვალმა
    მიხეილ ვორონცოვმა ჯერ კიდევ სპარსული იერის ქალაქში ფართო ევროპული ბულვარის გაყვანა ბრძანა. 1918 წლამდე
    მას წინამორბედი მთავარმართებლის სახელი ერქვა — გოლოვინის პროსპექტი, შემდეგ კი შოთა რუსთაველისა დაერქვა.
    თავისუფლების მოედნიდან გამზირი დაახლოებით ერთნახევარ კილომეტრზე, თითქმის შეუმჩნეველი აღმართით გრძელდება,
    და მასზე თითქმის ყველა შენობა ვინმეს გასაოცებლად აშენდა.


    ჩრდილოეთისკენ თუ გაუყვებით, ჯერ ეროვნული მუზეუმი შეგხვდებათ, შემდეგ პარლამენტი, რომლის მთავარი კორპუსი
    1953 წელს დასრულდა. 1989 წლის 9 აპრილს მის წინ საბჭოთა ჯარმა დამოუკიდებლობის მომხრეთა მშვიდობიანი
    აქცია დაარბია; 21 ადამიანი დაიღუპა, მათი უმეტესობა ქალი. ზუსტად ორი წლის შემდეგ, 1991 წლის 9 აპრილს,
    სწორედ აქ გამოცხადდა საქართველოს დამოუკიდებლობის აღდგენა, 2004 წლიდან კი ადგილს მემორიალი აღნიშნავს.


    გზის გადაღმა ქაშვეთის წმინდა გიორგის ეკლესიაა, 1904–1910 წლებში ლეოპოლდ ბილფელდის მიერ შუა საუკუნეების
    სამთავისის მიხედვით აგებული. სახელს გადმოცემა ხსნის: ერთმა ქალმა VI საუკუნის ბერს, დავით გარეჯელს,
    ცილი დასწამა, თითქოს მისგან დაორსულდა; დავითმა უწინასწარმეტყველა, რომ ქვას შობდა — და ასეც მოხდა:
    „ქვა-შვა“, ანუ „ქვის შობა“, ქაშვეთის სახელად იქცა. ომის შემდეგ ტაძარი ლადო გუდიაშვილმა მოხატა და ამისთვის
    პარტიული ბილეთიც დაკარგა და სამხატვრო აკადემიაში პედაგოგობაც.


    უფრო ზემოთ როკოკოს სტილის რუსთაველის თეატრია (1898–1901), რომლის სარდაფშიც 1920-იან წლებში ცისფერყანწელების
    კაფე „ქიმერიონი“ იყო, გუდიაშვილის, კაკაბაძისა და სუდეიკინის მოხატული. კიდევ უფრო შორს ვიქტორ შრეტერის
    ფსევდომავრიტანული ოპერაა: 1896 წელს გაიხსნა, 1973 წელს ხანძარმა შიგნიდან გამოწვა, ბოლოს კი 2016 წელს
    აღადგინეს.


    დაბრუნდით შებინდებისას, როცა ფასადები ნათდება — ან აქციის დღეს, როცა მოძრაობა ჩერდება და გამზირი კვლავ
    ქვეყნის მთავარ მოედნად იქცევა.
  tip: >-
    სეირნობას ორი საათი ეყოფა, მეტი — თუ ეროვნულ მუზეუმში ან ეროვნულ გალერეაში შეიხედავთ. გადასასვლელების
    უმეტესობა მიწისქვეშაა, კიბეებით და ლიფტის გარეშე. ქაშვეთში შესვლისას მხრები და მუხლები დაიფარეთ, ქალები
    ჩვეულებრივ თავსაც იფარავენ. მუზეუმების უმეტესობა ორშაბათობით დაკეტილია. ტუალეტს ყველაზე იოლად კაფეებში
    ან თავისუფლების მოედანთან, სავაჭრო ცენტრ „გალერეაში“ იპოვით. სარეაბილიტაციო სამუშაოების გამო გამზირი
    2026 წლის დიდ ნაწილში მანქანებისთვის დაკეტილი იყო, აქციები კი მოძრაობას ხშირად წინასწარი გაფრთხილების
    გარეშე აჩერებს — მანქანით წამოსვლამდე მიმდინარე ვითარება გადაამოწმეთ.
  route: >-
    ცენტრის ნებისმიერი წერტილიდან გამზირამდე დაახლოებით 2 კილომეტრი და ათი წუთია — პრობლემა მანძილი კი
    არა, პარკინგია. თავად რუსთაველზე გაჩერება აკრძალულია და ევაკუატორები აქტიურად მუშაობენ. ისარგებლეთ
    თავისუფლების მოედანთან, სავაჭრო ცენტრის ქვეშ მდებარე ფასიანი მიწისქვეშა ავტოსადგომით ან გვერდითი ქუჩების
    — მაგალითად, ჩიტაძისა და ლერმონტოვის — ფასიანი ადგილებით; გამგზავრებამდე გაქირავების კომპანიას ჰკითხეთ,
    როგორ იხდება მათი მანქანის ქალაქის პარკირების საფასური. უმჯობესია, მანქანა სასტუმროსთან დატოვოთ და
    მეტროთი ჩამოხვიდეთ: სადგურები „თავისუფლების მოედანი“ და „რუსთაველი“ გამზირის ორ ბოლოშია. ეკონომკლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Rustaveli Avenue
  short: >-
    A kilometre and a half of opera, parliament, frescoed church and plane-tree shade: Tbilisi's showcase
    and the stage of its political memory.
  body: >-
    **Tbilisi builds its showpieces on Rustaveli Avenue, and brings its anger here too.**


    The avenue began as the Digomi road, the way north out of town. In the 1840s the viceroy Mikhail Vorontsov
    had it laid out as a broad European boulevard in a city still Persian in shape. Until 1918 it was
    Golovinsky Prospekt, after an earlier viceroy; then it took the name of the poet Shota Rustaveli.
    From Freedom Square it runs about 1.5 km, rising gently, and nearly every building on it was meant
    to impress someone.


    Walk north and the National Museum comes first, then Parliament, its main block finished in 1953.
    On 9 April 1989 Soviet troops broke up a peaceful pro-independence demonstration in front of it; 21
    people died, most of them women. Two years later to the day, Georgia's independence was declared here,
    and since 2004 a memorial has marked the spot.


    Across the road stands Kashveti, the church of St George, built in 1904–1910 by Leopold Bilfeldt on
    the model of medieval Samtavisi. Legend explains the name: a woman accused the 6th-century monk David
    of Gareja of fathering her child, and he foretold she would give birth to a stone — *kva* — and she
    did: *kva-shva*, "stone-birth", became Kashveti. Just after the war Lado Gudiashvili painted the interior
    and paid with his party card and his teaching post at the Academy of Arts.


    Further on, the rococo Rustaveli Theatre (1898–1901) hides in its cellar the 1920s café of the Blue
    Horns poets, painted by Gudiashvili, Kakabadze and Sudeikin. Beyond rises Viktor Schröter's neo-Moorish
    Opera, opened in 1896, gutted by fire in 1973 and restored again in 2016.


    Come back after dark, when the facades are lit, or on a day of protest, when the traffic stops and
    the avenue becomes the country's public square once more.
  tip: >-
    Allow two hours on foot, more if you step into the National Museum or the National Gallery. Most crossings
    are underpasses with stairs and no lifts. Cover shoulders and knees for Kashveti; women usually cover
    their hair too. Most museums close on Mondays. Toilets are easiest to find in cafés or in the Galleria
    shopping centre by Freedom Square. Rehabilitation works closed the avenue to traffic for much of 2026,
    and protests can stop traffic at short notice, so check current access before you drive.
  route: >-
    From anywhere central the avenue is about 2 km and ten minutes away; the problem is parking, not distance.
    Stopping on Rustaveli itself is prohibited and tow trucks are active. Use the paid underground car
    park beneath the shopping centre at Freedom Square, or paid bays on side streets such as Chitadze
    and Lermontov; before you set off, ask your rental company how the car's city parking is paid. Better
    still, leave the car at the hotel and take the metro: Liberty Square and Rustaveli stations sit at
    either end of the avenue. An economy car is all you need.
ru:
  name: Проспект Руставели
  short: >-
    Полтора километра оперы, парламента, расписанной церкви и платановой тени: парадная витрина Тбилиси
    и сцена его политической памяти.
  body: >-
    **Свои парадные здания Тбилиси строит на проспекте Руставели — и сюда же приносит свой гнев.**


    Проспект начинался как Дигомская дорога, путь из города на север. В 1840-х годах наместник Михаил
    Воронцов велел проложить на её месте широкий европейский бульвар — в городе, всё ещё персидском по
    облику. До 1918 года это был Головинский проспект, названный в честь одного из прежних наместников;
    затем он получил имя поэта Шота Руставели. От площади Свободы проспект тянется примерно на 1,5 км,
    плавно поднимаясь, и почти каждое здание на нём строилось, чтобы кого-то впечатлить.


    Если идти на север, первым встретится Национальный музей, затем парламент, главный корпус которого
    достроили в 1953 году. 9 апреля 1989 года советские войска разогнали перед ним мирную демонстрацию
    за независимость; погиб 21 человек, большинство — женщины. Ровно через два года, день в день, здесь
    провозгласили независимость Грузии, а с 2004 года это место отмечает мемориал.


    Через дорогу стоит Кашвети — церковь Святого Георгия, построенная в 1904–1910 годах Леопольдом Бильфельдтом
    по образцу средневекового Самтависи. Название объясняет легенда: женщина обвинила монаха VI века Давида
    Гареджийского в том, что он отец её ребёнка, и он предрёк, что она родит камень — «ква». Так и случилось:
    «ква-шва», «рождение камня», дало имя Кашвети. Сразу после войны Ладо Гудиашвили расписал интерьер
    и поплатился за это партбилетом и местом преподавателя в Академии художеств.


    Дальше, в подвале театра Руставели в стиле рококо (1898–1901), прячется кафе поэтов «Голубых рогов»
    1920-х годов, расписанное Гудиашвили, Какабадзе и Судейкиным. За ним поднимается неомавританская опера
    Виктора Шрётера, открытая в 1896 году, выгоревшая изнутри при пожаре 1973 года и вновь отреставрированная
    в 2016-м.


    Вернитесь сюда после заката, когда подсвечены фасады, или в день протеста, когда движение замирает
    и проспект снова становится главной площадью страны.
  tip: >-
    На прогулку пешком отведите два часа, больше — если зайдёте в Национальный музей или Национальную
    галерею. Большинство переходов — подземные, со ступеньками и без лифтов. В Кашвети закройте плечи
    и колени; женщины обычно покрывают и голову. Большинство музеев закрыты по понедельникам. Туалет проще
    всего найти в кафе или в торговом центре «Галерея» у площади Свободы. Из-за ремонтных работ проспект
    был закрыт для машин большую часть 2026 года, а протесты могут остановить движение без предупреждения,
    так что перед поездкой уточните, открыт ли проезд.
  route: >-
    Из любой точки центра до проспекта около 2 км и десять минут езды; проблема не в расстоянии, а в парковке.
    Останавливаться на самом Руставели запрещено, и эвакуаторы не дремлют. Пользуйтесь платным подземным
    паркингом под торговым центром на площади Свободы или платными местами на боковых улицах — например,
    на Читадзе и Лермонтова; перед выездом спросите в прокатной компании, как оплачивается городская парковка
    для вашей машины. А лучше оставьте машину у отеля и поезжайте на метро: станции «Площадь Свободы»
    и «Руставели» стоят на двух концах проспекта. Машины эконом-класса вполне достаточно.
fa:
  name: خیابان روستاولی
  short: 'یک‌ونیم کیلومتر اپرا، پارلمان، کلیسای نقاشی‌شده و سایهٔ چنار: ویترین تفلیس و صحنهٔ حافظهٔ سیاسی‌اش.'
  body: >-
    **تفلیس بناهای نمایشی‌اش را در خیابان روستاولی می‌سازد و خشمش را هم به همین‌جا می‌آورد.**


    این خیابان در آغاز جادهٔ دیگومی بود، راه خروج از شهر به سوی شمال. در دههٔ ۱۸۴۰ میخائیل ورونتسوف، نایب‌السلطنه،
    دستور داد آن را به بلواری پهن و اروپایی بدل کنند، در شهری که هنوز سیمایی ایرانی داشت. تا سال ۱۹۱۸
    «پروسپکت گولووینسکی» نام داشت، به یاد نایب‌السلطنه‌ای پیش‌تر؛ سپس نام شوتا روستاولی، شاعر، را گرفت.
    از میدان آزادی حدود ۱٫۵ کیلومتر با شیبی ملایم بالا می‌رود و تقریباً هر ساختمانش برای تحت‌تأثیر قرار
    دادن کسی ساخته شده است.


    به سوی شمال که بروید، نخست موزهٔ ملی می‌آید و سپس پارلمان، که ساختمان اصلی‌اش در ۱۹۵۳ به پایان رسید.
    در ۹ آوریل ۱۹۸۹ نیروهای شوروی تظاهراتی مسالمت‌آمیز در هواداری از استقلال را روبه‌روی آن سرکوب کردند؛
    ۲۱ نفر جان باختند که بیشترشان زن بودند. درست دو سال بعد، در همان روز، استقلال گرجستان همین‌جا اعلام
    شد و از سال ۲۰۰۴ یادبودی این نقطه را نشان می‌دهد.


    آن‌سوی خیابان کاشوتی ایستاده است، کلیسای گئورگی قدیس، که لئوپولد بیلفلد آن را در سال‌های ۱۹۰۴ تا ۱۹۱۰
    به الگوی کلیسای سامتاویسی از سده‌های میانه ساخت. افسانه‌ای نامش را توضیح می‌دهد: زنی داوید گارجی،
    راهب سدهٔ ششم، را متهم کرد که پدر فرزند اوست، و داوید پیشگویی کرد که آن زن سنگی خواهد زایید، «کْوا».
    و چنین شد: «کْوا-شْوا»، یعنی «زادن سنگ»، نام کاشوتی شد. اندکی پس از جنگ، لادو گودیاشویلی درون کلیسا
    را نقاشی کرد و بهایش را با کارت عضویت حزب و کرسی استادی‌اش در آکادمی هنر پرداخت.


    کمی جلوتر، تئاتر روستاولی به سبک روکوکو (۱۸۹۸–۱۹۰۱) کافهٔ شاعران گروه «شاخ‌های آبی» در دههٔ ۱۹۲۰ را
    در زیرزمینش پنهان کرده است، با نقاشی‌هایی از گودیاشویلی، کاکابادزه و سودیکین. آن‌سوتر اپرای ویکتور
    شروتر به سبک نئوموری سر برمی‌آورد که در ۱۸۹۶ گشایش یافت، در آتش‌سوزی ۱۹۷۳ درونش یکسره سوخت و در ۲۰۱۶
    بار دیگر مرمت شد.


    پس از تاریک شدن هوا برگردید، وقتی نماها روشن‌اند؛ یا در روز اعتراض، وقتی ترافیک می‌ایستد و خیابان
    بار دیگر میدان عمومی کشور می‌شود.
  tip: >-
    برای پیاده‌روی دو ساعت وقت بگذارید، و بیشتر اگر به موزهٔ ملی یا گالری ملی سر می‌زنید. بیشتر گذرگاه‌ها
    زیرگذرهایی با پله و بی‌آسانسورند. برای کاشوتی شانه‌ها و زانوها را بپوشانید؛ بانوان معمولاً سرشان را
    هم می‌پوشانند. بیشتر موزه‌ها دوشنبه‌ها تعطیل‌اند. سرویس بهداشتی را راحت‌تر از همه در کافه‌ها یا مرکز
    خرید «گالریا» کنار میدان آزادی پیدا می‌کنید. کارهای بازسازی خیابان را در بخش بزرگی از سال ۲۰۲۶ به
    روی خودروها بست و اعتراض‌ها هم ممکن است بی‌خبر ترافیک را متوقف کنند؛ پس پیش از رانندگی بررسی کنید
    که راه باز است یا نه.
  route: >-
    از هر جای مرکز شهر، این خیابان حدود ۲ کیلومتر و ده دقیقه فاصله دارد؛ مشکل پارکینگ است، نه مسافت. توقف
    در خود خیابان روستاولی ممنوع است و جرثقیل‌های یدک‌کش فعال‌اند. از پارکینگ زیرزمینی پولیِ زیر مرکز
    خرید میدان آزادی استفاده کنید یا از جای پارک‌های پولی در خیابان‌های فرعی مانند چیتادزه و لرمانتوف؛
    پیش از راه افتادن از شرکت کرایهٔ خودرو بپرسید پول پارک شهری این خودرو چگونه پرداخت می‌شود. بهتر از
    همه: ماشین را در هتل بگذارید و با مترو بیایید؛ ایستگاه‌های «میدان آزادی» و «روستاولی» در دو سر خیابان‌اند.
    یک خودروی کلاس اکونومی کافی است.
he:
  name: שדרות רוסתאוולי
  short: 'קילומטר וחצי של אופרה, פרלמנט, כנסייה מצוירת וצל עצי דולב: חלון הראווה של טביליסי והבמה של זיכרונה
    הפוליטי.'
  body: >-
    **את מבני הראווה שלה טביליסי בונה בשדרות רוסתאוולי — ולכאן היא מביאה גם את זעמה.**


    השדרה התחילה כדרך דיגומי, הדרך צפונה אל מחוץ לעיר. בשנות ה-40 של המאה ה-19 הורה המשנה למלך מיכאיל
    וורונצוב לסלול במקומה שדרה אירופית רחבה, בעיר שעדיין הייתה פרסית בצורתה. עד 1918 נקראה "פרוספקט גולובינסקי",
    על שם משנה למלך קודם; אחר כך קיבלה את שמו של המשורר שותא רוסתאוולי. מכיכר החירות היא נמשכת כ-1.5 ק"מ
    בעלייה מתונה, וכמעט כל בניין לאורכה נועד להרשים מישהו.


    כשהולכים צפונה, מגיעים תחילה למוזיאון הלאומי ואחריו לפרלמנט, שבניינו הראשי הושלם ב-1953. ב-9 באפריל
    1989 פיזרו כוחות סובייטיים לפניו הפגנה בדרכי שלום בעד עצמאות; 21 בני אדם נהרגו, רובם נשים. שנתיים
    בדיוק לאחר מכן, באותו יום, הוכרזה כאן עצמאות גאורגיה, ומאז 2004 מציינת אנדרטה את המקום.


    מעבר לכביש עומדת קשווטי, כנסיית גאורגיוס הקדוש, שנבנתה בשנים 1904–1910 בידי לאופולד בילפלדט בדמות
    כנסיית סמתאוויסי מימי הביניים. אגדה מסבירה את השם: אישה האשימה את הנזיר בן המאה ה-6 דוד מגרג'ה בכך
    שהוא אבי ילדה, והוא ניבא שתלד אבן — "קווה". וכך היה: "קווה-שווה", "לידת אבן", הפכה לשם קשווטי. מיד
    אחרי המלחמה צייר לאדו גודיאשווילי את פנים הכנסייה, ושילם על כך בכרטיס המפלגה שלו ובמשרת ההוראה באקדמיה
    לאמנויות.


    הלאה משם, תיאטרון רוסתאוולי בסגנון רוקוקו (1898–1901) מסתיר במרתפו את בית הקפה של משוררי "הקרניים
    הכחולות" משנות ה-20, שציירו בו גודיאשווילי, קקבדזה וסודייקין. מעבר לו מתנשא בית האופרה בסגנון ניאו-מורי
    של ויקטור שרטר, שנפתח ב-1896, נשרף מבפנים בשריפה של 1973 ושוקם שוב ב-2016.


    חזרו אחרי רדת החשכה, כשהחזיתות מוארות, או ביום של מחאה, כשהתנועה נעצרת והשדרה הופכת שוב לכיכר העירונית
    של המדינה כולה.
  tip: >-
    הקצו שעתיים להליכה, ויותר אם תיכנסו למוזיאון הלאומי או לגלריה הלאומית. רוב המעברים הם מעברים תת-קרקעיים
    עם מדרגות וללא מעליות. בקשווטי כסו כתפיים וברכיים; נשים נוהגות לכסות גם את הראש. רוב המוזיאונים סגורים
    בימי שני. שירותים הכי קל למצוא בבתי קפה או בקניון "גלריה" שליד כיכר החירות. עבודות שיקום סגרו את השדרה
    לתנועת כלי רכב במשך רוב שנת 2026, ומחאות עלולות לעצור את התנועה בהתראה קצרה, לכן בדקו אם הדרך פתוחה
    לפני שאתם יוצאים לנסיעה.
  route: >-
    מכל נקודה במרכז העיר השדרה נמצאת במרחק כ-2 ק"מ ועשר דקות נסיעה; הבעיה היא החניה, לא המרחק. העצירה
    ברוסתאוולי עצמה אסורה, וגררים פעילים. השתמשו בחניון התת-קרקעי בתשלום מתחת למרכז הקניות בכיכר החירות,
    או במקומות חניה בתשלום ברחובות צדדיים כמו צ'יטדזה ולרמונטוב; לפני היציאה שאלו את חברת ההשכרה איך משלמים
    על חניה עירונית ברכב. עדיף עוד יותר להשאיר את הרכב במלון ולנסוע ברכבת התחתית: התחנות "כיכר החירות"
    ו"רוסתאוולי" נמצאות בשני קצות השדרה. רכב מקטגוריית אקונומי הוא כל מה שצריך.
ar:
  name: جادة روستافيلي
  short: 'كيلومتر ونصف من الأوبرا والبرلمان وكنيسة مرسومة الجدران وظلال الدُّلب: واجهة تبليسي ومسرح ذاكرتها
    السياسية.'
  body: >-
    **على جادة روستافيلي تبني تبليسي صروحها الاستعراضية، وإليها أيضاً تحمل غضبها.**


    بدأت الجادة طريقاً إلى ديغومي، مخرج المدينة نحو الشمال. وفي أربعينيات القرن التاسع عشر أمر نائب الملك
    ميخائيل فورونتسوف بشقّها جادةً أوروبية عريضة في مدينة ما زالت فارسية الملامح. وحتى عام 1918 كانت تُسمّى
    «جادة غولوفينسكي» نسبةً إلى نائب ملك سابق، ثم حملت اسم الشاعر شوتا روستافيلي. تمتد من ساحة الحرية
    نحو 1.5 كم صاعدةً بلطف، وقد شُيِّد كل مبنى تقريباً على جانبيها ليُبهر أحداً ما.


    إن سرت شمالاً صادفت المتحف الوطني أولاً، ثم البرلمان الذي اكتمل مبناه الرئيسي عام 1953. وفي 9 أبريل
    1989 فرّقت القوات السوفييتية أمامه مظاهرة سلمية مؤيّدة للاستقلال؛ فلقي 21 شخصاً حتفهم، معظمهم نساء.
    وبعد عامين بالتمام، في اليوم نفسه، أُعلن هنا استقلال جورجيا، ومنذ عام 2004 يَسِم نصبٌ تذكاري المكان.


    وعلى الجهة المقابلة تقف كاشفيتي، كنيسة القديس جاورجيوس، التي بناها ليوبولد بيلفيلدت بين 1904 و1910
    على مثال كنيسة سامتافيسي من العصور الوسطى. وتفسّر أسطورةٌ اسمها: اتّهمت امرأة الراهبَ داود الغاريجي،
    من القرن السادس، بأنه أبو طفلها، فتنبّأ بأنها ستلد حجراً، «كفا». وهكذا كان: ومن «كفا-شفا»، أي «ولادة
    الحجر»، جاء اسم كاشفيتي. وبُعيد الحرب رسم لادو غودياشفيلي داخل الكنيسة، فدفع الثمن بطرده من الحزب
    وخسارته منصب التدريس في أكاديمية الفنون.


    وأبعد قليلاً يُخفي مسرح روستافيلي، المبني على طراز الروكوكو (1898–1901)، في قبوه مقهى شعراء «القرون
    الزرقاء» من عشرينيات القرن العشرين، الذي رسم جدرانه غودياشفيلي وكاكابادزه وسوديكين. ومن ورائه ترتفع
    دار الأوبرا التي صمّمها فيكتور شروتر على الطراز المورسكي الجديد، وافتُتحت عام 1896، والتهم حريق عام
    1973 داخلها، ثم رُمِّمت من جديد عام 2016.


    عُد إليها بعد حلول الظلام حين تُضاء الواجهات، أو في يوم احتجاج حين يتوقّف السير وتصبح الجادة من جديد
    الساحة العامة للبلاد.
  tip: >-
    خصِّص ساعتين للمشي، وأكثر إن دخلت المتحف الوطني أو المعرض الوطني. معظم المعابر أنفاق للمشاة بدرج ومن
    دون مصاعد. في كاشفيتي غطِّ الكتفين والركبتين؛ والنساء يغطّين رؤوسهن عادةً. معظم المتاحف مغلقة أيام
    الإثنين. أسهل مكان لدورة المياه المقاهي أو مركز «غاليريا» التجاري قرب ساحة الحرية. أغلقت أعمال التأهيل
    الجادة أمام السيارات معظم عام 2026، وقد توقف الاحتجاجات السير دون إنذار يُذكر، فتحقّق من إمكانية المرور
    قبل أن تقود إليها.
  route: >-
    من أي نقطة في الوسط تبعد الجادة نحو 2 كم وعشر دقائق؛ المشكلة في الوقوف لا في المسافة. التوقّف على
    روستافيلي نفسها ممنوع، وشاحنات السحب نشطة. استخدم الموقف المدفوع تحت الأرض أسفل المركز التجاري في
    ساحة الحرية، أو الأماكن المدفوعة في الشوارع الجانبية مثل تشيتادزه وليرمونتوف؛ وقبل أن تنطلق اسأل شركة
    التأجير كيف تُدفع رسوم الوقوف في المدينة لسيارتك. والأفضل أن تترك السيارة في الفندق وتركب المترو:
    محطتا «ساحة الحرية» و«روستافيلي» عند طرفي الجادة. وتكفيك سيارة اقتصادية.
