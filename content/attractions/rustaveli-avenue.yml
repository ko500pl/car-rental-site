ka:
  name: რუსთაველის გამზირი
  short: >-
    ქალაქის მთავარი ქუჩა — ჭადრების ორი რიგი, ოპერა, პარლამენტი და საქართველოს პოლიტიკური მეხსიერება ერთ
    კილომეტრნახევარზე.
  body: >-
    **რუსთაველის გამზირი თანამედროვე თბილისის ხერხემალია.** ის 1850-იან წლებში გაიყვანეს იმ გზის ადგილას,
    რომელიც ძველი ქალაქიდან გარეთ გადიოდა, და 1918 წლამდე რუსი მთავარმართებლის სახელს ატარებდა. თავისუფლების
    მოედნიდან რუსთაველის მოედნამდე დაახლოებით 1,5 კილომეტრია — საკმარისად ფართო ორი რიგი ჭადრისთვის, და
    ამ გზაზე თითქმის ყოველი შენობა ვინმეს შთაბეჭდილებისთვის აშენდა.


    თავისუფლების მოედნიდან ასვლისას მარცხნივ ჯერ ეროვნული მუზეუმია, შემდეგ პარლამენტის შენობა თავისი გრძელი
    კოლონადით, დასრულებული 1950-იანი წლების დასაწყისში. მის წინ არსებული ტროტუარი ქვეყნის ყველაზე დატვირთული
    პოლიტიკური ადგილია: 1989 წლის 9 აპრილს საბჭოთა ჯარმა აქ დაარბია მშვიდობიანი აქცია და ოცდაერთი ადამიანი
    დაიღუპა, უმეტესობა ქალი. მოკრძალებული მემორიალი ადგილს აღნიშნავს, ხოლო მოაჯირზე დღემდე იკვრება ბანერები.


    ცოტა ზემოთ დგას ქაშვეთის წმინდა გიორგის ეკლესია, აშენებული 1904–1910 წლებში თეთრი ქვით, სამთავისის
    XI საუკუნის ფასადის მიხედვით. შიგნით, აფსიდი 1947 წელს ლადო გუდიაშვილმა მოხატა — ნამუშევარმა მას სამსახურიც
    დააკარგვინა და პარტიული ბილეთიც. მოპირდაპირე მხარეს რუსთაველის თეატრია, 1901 წლის მძიმე, დეკორატიული
    შენობა, უფრო შორს კი ოპერისა და ბალეტის თეატრი — 1890-იანი წლების მავრიტანული სტილის ნაგებობა, რომელიც
    1973 წელს დაიწვა და ხელახლა აღადგინეს.


    გამზირი მარტივი სასეირნო მარშრუტია, მაგრამ არა მშვიდი: ეს ქალაქის ყველაზე ხმაურიანი ავტომაგისტრალიცაა.
    საღამოს, როცა შუქები ინთება და ჭადრები ჩრდილს აღარ საჭიროებს, ის საგრძნობლად უკეთესია. თუ დემონსტრაციაა,
    გამზირი იკეტება — ეს თბილისში ნორმალური მოვლენაა და არა ინციდენტი.


    ერთი დეტალი, რომელსაც ვერავინ ხედავს რუკაზე: გამზირი ბრტყელი მხოლოდ გამოიყურება, სინამდვილეში ის მუდმივად,
    თუმცა ძალიან ნაზად ადის თავისუფლების მოედნიდან რუსთაველის მოედნისკენ. ამიტომ სეირნობა ერთი მიმართულებით
    ოდნავ უფრო ადვილია. ჭადრები 1930-იან წლებში დარგეს და ზაფხულში სწორედ ისინი ხდიან გამზირს გასავლელს
    — უმათოდ აქ დღისით ვერავინ დადიოდა.
  tip: >-
    ორი საათი საკმარისია სეირნობისთვის, თუ მუზეუმში არ შეხვალ. აღმართი ნაზია და სიარული ადვილია, მაგრამ
    გადასასვლელები ძირითადად მიწისქვეშაა — კიბეებით და ლიფტის გარეშე. ეკლესიაში შესვლისას ჩაცმის წესები
    მოქმედებს. ტუალეტი ყველაზე მარტივად კაფეებსა და გალერეა თბილისის სავაჭრო ცენტრში მოიძებნება. მუზეუმების
    უმეტესობა ორშაბათს დაკეტილია. აქციების დროს მოძრაობა ჩერდება — ამ დღეს მანქანა საერთოდ არ გამოგადგება.
  route: >-
    ცენტრიდან რუსთაველამდე 2 კმ და 10 წუთია, მაგრამ პრობლემა გზა კი არა, პარკინგია. თავად გამზირზე გაჩერება
    აკრძალულია და ევაკუატორი მუშაობს. ყველაზე საიმედოა მიწისქვეშა ანაზღაურებადი პარკინგი თავისუფლების
    მოედანთან, სავაჭრო ცენტრის ქვეშ, ან ჩიტაძის და ლერმონტოვის ქუჩების ზონალური ადგილები — ქალაქის ლურჯ
    ზონაში დგომა ნებართვას მოითხოვს, რომელიც ქირავნობის მანქანებს ჩვეულებრივ უკვე აქვთ. უმჯობესია მანქანა
    სასტუმროსთან დატოვო და მეტროთი ჩამოხვიდე: სადგურები „თავისუფლების მოედანი" და „რუსთაველი" გამზირის
    ორ ბოლოშია. ეკონომკლასის მანქანა სავსებით საკმარისია.
en:
  name: Rustaveli Avenue
  short: 'Tbilisi''s main street: a kilometre and a half of plane trees, opera, parliament and political
    memory.'
  body: >-
    **Rustaveli Avenue is the spine of the modern city.** It was laid out in the 1850s along the road
    that ran out of the old town, and until 1918 it carried the name of a Russian viceroy. From Freedom
    Square to Rustaveli Square is about 1.5 km, wide enough for two rows of plane trees, and nearly every
    building on it was put up to impress somebody.


    Walking up from Freedom Square you pass the Georgian National Museum, then the Parliament building
    with its long colonnade, finished in the early 1950s. The pavement in front of it is the most politically
    charged ground in the country: on 9 April 1989 Soviet troops broke up a peaceful hunger strike here
    and twenty-one people died, most of them women. A restrained memorial marks the spot, and the railings
    are still where banners get tied.


    A little further stands Kashveti Church of St George, built in white stone between 1904 and 1910,
    its facade copied from eleventh-century Samtavisi. Inside, the apse was painted in 1947 by Lado Gudiashvili
    — work that cost him his teaching post and his party card. Opposite is the Rustaveli Theatre, a heavy
    decorated pile of 1901, and beyond it the Opera and Ballet Theatre, a Moorish-revival building of
    the 1890s that burned in 1973 and was rebuilt.


    The avenue is an easy walk but not a quiet one: it is also the city's busiest through road, and traffic
    runs hard along both sides. It improves in the evening, when the facades are lit and the plane trees
    no longer have to do the work of shade. If there is a demonstration the whole avenue closes; in Tbilisi
    that is a normal event rather than an incident, and it is worth stopping to watch.


    One detail that no map shows: the avenue only looks flat. It climbs steadily but very gently from
    Freedom Square towards Rustaveli Square, which is why walking it in one direction is noticeably easier
    than in the other. The plane trees were planted in the 1930s, and in July they are the only reason
    the avenue is walkable at all in the afternoon; without them the pavement on the sunny side is unusable
    from noon until six.
  tip: >-
    Two hours is enough for the walk if you do not go into a museum. The gradient is gentle and the walking
    is easy, but most crossings are underpasses with stairs and no lifts. Dress rules apply inside Kashveti.
    Toilets are easiest to find in cafes and in the shopping centre at the Freedom Square end. Most museums
    close on Mondays. On protest days traffic stops completely, so a car is useless — plan to be on foot.
  route: >-
    It is 2 km and ten minutes from the centre, but the problem is not the driving, it is parking. Stopping
    on Rustaveli itself is prohibited and tow trucks do work. The reliable option is the paid underground
    car park under the shopping centre at Freedom Square, or metered bays on Chitadze and Lermontov streets;
    the city's paid zones need a permit, which rental cars normally already carry. Better still, leave
    the car at your hotel and take the metro: Liberty Square and Rustaveli stations sit at either end
    of the avenue. An economy car is fine.
ru:
  name: Проспект Руставели
  short: Главная улица Тбилиси — полтора километра платанов, опера, парламент и вся политическая память
    страны.
  body: >-
    **Проспект Руставели — хребет современного города.** Его проложили в 1850-х годах по дороге, выходившей
    из старого города, и до 1918 года он носил имя российского наместника. От площади Свободы до площади
    Руставели около полутора километров, ширины хватает на два ряда платанов, и почти каждое здание здесь
    строилось, чтобы произвести на кого-то впечатление.


    Поднимаясь от площади Свободы, вы минуете Национальный музей, затем здание парламента с длинной колоннадой,
    законченное в начале 1950-х. Тротуар перед ним — самый политически заряженный участок земли в стране:
    9 апреля 1989 года советские войска разогнали здесь мирную голодовку, погиб двадцать один человек,
    в основном женщины. Скромный мемориал отмечает это место, а к ограде до сих пор привязывают плакаты.


    Чуть выше стоит Кашветская церковь Святого Георгия, построенная из белого камня в 1904–1910 годах;
    её фасад повторяет Самтависи XI века. Внутри апсиду расписал в 1947 году Ладо Гудиашвили — работа
    стоила ему преподавательского места и партбилета. Напротив — театр Руставели, тяжеловесное декоративное
    здание 1901 года, а дальше Театр оперы и балета в мавританском стиле 1890-х, сгоревший в 1973-м и
    восстановленный.


    Прогулка лёгкая, но не тихая: проспект остаётся главной транзитной магистралью, и движение идёт плотно
    по обеим сторонам. Вечером он заметно выигрывает — фасады подсвечены, и платанам уже не надо давать
    тень. Если идёт демонстрация, проспект перекрывают целиком; в Тбилиси это обычное событие, а не происшествие,
    и посмотреть на него стоит.


    Деталь, которой не видно на карте: проспект только кажется ровным. Он ровно и очень мягко поднимается
    от площади Свободы к площади Руставели, поэтому идти в одну сторону заметно легче, чем в другую. Платаны
    высадили в 1930-х, и в июле только благодаря им по проспекту вообще можно ходить днём: без них тротуар
    на солнечной стороне непригоден с полудня до шести.
  tip: >-
    Двух часов достаточно, если не заходить в музей. Подъём пологий, идти легко, но переходы в основном
    подземные, со ступенями и без лифтов. В Кашвети действуют правила одежды. Туалеты проще всего найти
    в кафе и в торговом центре у площади Свободы. Большинство музеев закрыто по понедельникам. В дни акций
    движение встаёт полностью, машина в этот день бесполезна — рассчитывайте идти пешком.
  route: >-
    От центра 2 км и десять минут, но сложность не в дороге, а в парковке. Останавливаться на самом Руставели
    запрещено, эвакуатор работает. Надёжный вариант — платный подземный паркинг под торговым центром на
    площади Свободы либо размеченные места на улицах Читадзе и Лермонтова; городские платные зоны требуют
    разрешения, которое у прокатных машин обычно уже есть. Ещё лучше оставить машину у гостиницы и приехать
    на метро: станции «Площадь Свободы» и «Руставели» стоят по краям проспекта. Машины эконом-класса достаточно.
fa:
  name: خیابان روستاولی
  short: خیابان اصلی تفلیس؛ یک‌ونیم کیلومتر چنار، اپرا، پارلمان و همهٔ حافظهٔ سیاسی گرجستان.
  body: >-
    **خیابان روستاولی ستون فقرات شهر امروزی است.** آن را در دههٔ ۱۸۵۰ روی جاده‌ای کشیدند که از شهر قدیم
    بیرون می‌رفت و تا ۱۹۱۸ نام نایب‌السلطنه‌ای روس را بر خود داشت. از میدان آزادی تا میدان روستاولی حدود
    یک‌ونیم کیلومتر است، آن‌قدر پهن که دو ردیف چنار در آن جا بگیرد، و تقریباً هر ساختمانی در این مسیر
    برای تحت تأثیر گذاشتن کسی ساخته شده است.


    وقتی از میدان آزادی بالا می‌روید، نخست موزهٔ ملی گرجستان و سپس ساختمان پارلمان با ستون‌های بلندش را
    می‌بینید که در آغاز دههٔ ۱۹۵۰ کامل شد. پیاده‌روی روبه‌روی آن سیاسی‌ترین تکه‌زمین کشور است: در نهم
    آوریل ۱۹۸۹ نیروهای شوروی اعتصاب غذای مسالمت‌آمیزی را در همین‌جا درهم شکستند و بیست‌ویک نفر کشته شدند
    که بیشترشان زن بودند. یادمانی کم‌ادعا این نقطه را نشان می‌دهد و هنوز پلاکاردها را به همان نرده‌ها
    می‌بندند.


    کمی بالاتر کلیسای سنت گئورگی کاشوتی ایستاده است، ساخته‌شده از سنگ سفید میان ۱۹۰۴ تا ۱۹۱۰، با نمایی
    برگرفته از سامتاویسی سدهٔ یازدهم. در داخل، لادو گودیاشویلی در ۱۹۴۷ محراب را نقاشی کرد؛ کاری که به
    قیمت از دست دادن کرسی تدریس و کارت حزبی‌اش تمام شد. روبه‌رو تئاتر روستاولی است، بنایی سنگین و پرتزیین
    از ۱۹۰۱، و آن‌سوتر تئاتر اپرا و باله، ساختمانی به سبک مغربی از دههٔ ۱۸۹۰ که در ۱۹۷۳ سوخت و بازسازی
    شد.


    قدم زدن در این خیابان آسان است اما آرام نیست: این هنوز شلوغ‌ترین مسیر عبوری شهر است. عصرها بهتر می‌شود،
    وقتی نماها روشن می‌شوند. اگر تظاهراتی برپا باشد کل خیابان بسته می‌شود؛ در تفلیس این یک رویداد عادی
    است، نه حادثه.


    جزئیاتی که هیچ نقشه‌ای نشان نمی‌دهد: این خیابان فقط به نظر صاف می‌آید. در واقع پیوسته اما بسیار ملایم
    از میدان آزادی به سوی میدان روستاولی بالا می‌رود، و به همین سبب پیاده رفتن در یک جهت محسوس‌تر آسان
    است. چنارها در دههٔ ۱۹۳۰ کاشته شدند و در تیر و مرداد تنها به لطف آنهاست که می‌توان بعدازظهر در این
    خیابان راه رفت؛ بی‌آنها پیاده‌روِ آفتاب‌گیر از ظهر تا ساعت شش غیرقابل استفاده است.
  tip: >-
    اگر وارد موزه نشوید، دو ساعت کافی است. شیب خیابان ملایم است و پیاده‌روی راحت، اما بیشتر گذرگاه‌ها
    زیرگذرهایی با پله و بدون آسانسورند. در کلیسا قواعد پوشش برقرار است. سرویس بهداشتی را ساده‌تر از همه
    در کافه‌ها و مرکز خرید نزدیک میدان آزادی می‌یابید. بیشتر موزه‌ها دوشنبه‌ها تعطیل‌اند. در روزهای اعتراض
    ترافیک به‌کلی متوقف می‌شود و خودرو بی‌فایده است؛ پیاده برنامه‌ریزی کنید.
  route: >-
    از مرکز شهر ۲ کیلومتر و ده دقیقه راه است، اما دشواری در رانندگی نیست، در پارک کردن است. توقف روی خود
    روستاولی ممنوع است و خودروبَر واقعاً کار می‌کند. گزینهٔ مطمئن پارکینگ زیرزمینی پولی زیر مرکز خرید
    میدان آزادی است، یا جای‌های خط‌کشی‌شده در خیابان‌های چیتادزه و لرمانتوف؛ مناطق پولی شهر مجوز می‌خواهند
    که خودروهای کرایه‌ای معمولاً دارند. بهتر از همه خودرو را کنار هتل بگذارید و با مترو بیایید: ایستگاه‌های
    میدان آزادی و روستاولی در دو سر خیابان‌اند. خودروی اقتصادی کافی است.
he:
  name: שדרות רוסתאוולי
  short: הרחוב הראשי של טביליסי — קילומטר וחצי של עצי דולב, אופרה, פרלמנט וכל הזיכרון הפוליטי של המדינה.
  body: >-
    **שדרות רוסתאוולי הן עמוד השדרה של העיר המודרנית.** הן הותוו בשנות ה-50 של המאה ה-19 לאורך הדרך שיצאה
    מן העיר העתיקה, ועד 1918 נשאו את שמו של נציב רוסי. מכיכר החירות ועד כיכר רוסתאוולי יש כקילומטר וחצי,
    רוחב שמספיק לשתי שורות עצי דולב, וכמעט כל בניין כאן הוקם כדי להרשים מישהו.


    בעלייה מכיכר החירות עוברים על פני המוזיאון הלאומי, ואחר כך על פני בניין הפרלמנט עם שורת העמודים הארוכה
    שלו, שהושלם בראשית שנות ה-50 של המאה ה-20. המדרכה שלפניו היא פיסת הקרקע הטעונה ביותר במדינה: ב-9 באפריל
    1989 פיזרו כאן חיילים סובייטים שביתת רעב שקטה, ועשרים ואחד בני אדם נהרגו, רובם נשים. אנדרטה מאופקת
    מסמנת את המקום, ואל המעקה עדיין קושרים שלטים.


    מעט מעלה עומדת כנסיית קאשווטי על שם גיאורגיוס הקדוש, שנבנתה מאבן לבנה בין 1904 ל-1910, וחזיתה מעתיקה
    את סמטאוויסי מן המאה ה-11. בפנים צייר לאדו גודיאשווילי את האפסיס ב-1947 — עבודה שעלתה לו במשרת ההוראה
    ובכרטיס המפלגה. ממול ניצב תיאטרון רוסתאוולי, מבנה כבד ומעוטר מ-1901, ומעבר לו תיאטרון האופרה והבלט
    בסגנון מורי משנות ה-90 של המאה ה-19, שנשרף ב-1973 ונבנה מחדש.


    ההליכה קלה אך אינה שקטה: זהו גם עורק התנועה הראשי של העיר. בערב השדרה משתפרת מאוד, כשהחזיתות מוארות.
    אם מתקיימת הפגנה הרחוב נסגר כולו; בטביליסי זה אירוע רגיל ולא תקרית, ושווה לעצור ולהתבונן.


    פרט אחד שאף מפה אינה מראה: השדרה רק נראית מישורית. היא מטפסת בהתמדה אך בעדינות רבה מכיכר החירות לעבר
    כיכר רוסתאוולי, ולכן ההליכה בכיוון אחד קלה במידה מורגשת מזו שבכיוון השני. עצי הדולב ניטעו בשנות ה-30,
    ובחודשי הקיץ רק בזכותם אפשר בכלל ללכת כאן אחר הצהריים; בלעדיהם המדרכה בצד השמש אינה שמישה מן הצהריים
    ועד שש.
  tip: >-
    שעתיים מספיקות אם לא נכנסים למוזיאון. השיפוע מתון וההליכה נוחה, אך רוב המעברים הם מנהרות עם מדרגות
    ובלי מעליות. בכנסייה חלים כללי לבוש. שירותים נמצאים בקלות בבתי קפה ובקניון שבקצה כיכר החירות. רוב
    המוזיאונים סגורים בימי שני. בימי הפגנה התנועה נעצרת לחלוטין והרכב חסר תועלת — תכננו ללכת ברגל.
  route: >-
    שני קילומטרים ועשר דקות מן המרכז, אבל הקושי אינו בנהיגה אלא בחניה. עצירה על רוסתאוולי עצמה אסורה,
    וגרר אכן פועל. האפשרות האמינה היא חניון תת-קרקעי בתשלום מתחת לקניון בכיכר החירות, או מקומות מסומנים
    ברחובות צ'יטאדזה ולרמונטוב; אזורי התשלום בעיר דורשים היתר, שלרכבי השכרה בדרך כלל כבר יש. עדיף להשאיר
    את הרכב במלון ולהגיע ברכבת התחתית: התחנות כיכר החירות ורוסתאוולי נמצאות בשני קצות השדרה. רכב חסכוני
    מספיק.
ar:
  name: جادة روستافيلي
  short: شارع تبليسي الرئيسي؛ كيلومتر ونصف من أشجار الدلب والأوبرا والبرلمان وذاكرة البلاد السياسية كلها.
  body: >-
    **جادة روستافيلي هي العمود الفقري للمدينة الحديثة.** شُقّت في خمسينيات القرن التاسع عشر على امتداد
    الطريق الخارج من المدينة القديمة، وظلت حتى 1918 تحمل اسم نائب ملك روسي. وبين ميدان الحرية وميدان روستافيلي
    نحو كيلومتر ونصف، باتساع يكفي لصفين من أشجار الدلب، وقد بُني كل مبنى فيها تقريباً ليثير إعجاب أحد
    ما.


    وأنت صاعد من ميدان الحرية تمر بالمتحف الوطني الجورجي، ثم بمبنى البرلمان بأعمدته الطويلة الذي اكتمل
    في مطلع الخمسينيات. والرصيف أمامه أشد بقعة سياسية شحناً في البلاد: ففي التاسع من أبريل 1989 فضّت القوات
    السوفييتية هنا إضراباً سلمياً عن الطعام، وقُتل واحد وعشرون شخصاً معظمهم من النساء. ويشير نصب متواضع
    إلى الموقع، وما زالت اللافتات تُربط على السياج نفسه.


    وأعلى قليلاً تقوم كنيسة كاشفيتي المكرسة للقديس جيورجي، وقد بُنيت من الحجر الأبيض بين 1904 و1910، ونُقلت
    واجهتها عن سامتافيسي من القرن الحادي عشر. وفي الداخل رسم لادو غودياشفيلي الحنية عام 1947، وهو عمل
    كلّفه وظيفته في التدريس وبطاقته الحزبية. وفي المقابل مسرح روستافيلي، مبنى ثقيل مزخرف من 1901، وخلفه
    دار الأوبرا والباليه، بناء بالطراز المغربي من تسعينيات القرن التاسع عشر احترق عام 1973 ثم أُعيد بناؤه.


    المشي هنا سهل لكنه غير هادئ: فالجادة ما تزال أكثر محاور المرور ازدحاماً. وتتحسن كثيراً في المساء حين
    تُضاء الواجهات. وإذا قامت مظاهرة أُغلق الشارع بأكمله؛ وهذا في تبليسي حدث عادي لا حادثة، ويستحق التوقف
    لمشاهدته.


    تفصيلة لا تُظهرها أي خريطة: الجادة تبدو مستوية فحسب. فهي تصعد بثبات وبلطف شديد من ميدان الحرية نحو
    ميدان روستافيلي، ولهذا يكون المشي في اتجاه أيسر بوضوح منه في الاتجاه الآخر. وقد غُرست أشجار الدلب
    في الثلاثينيات، وفي تموز لا يمكن السير في الجادة بعد الظهر إلا بفضلها؛ فمن دونها يصبح الرصيف المشمس
    غير صالح من الظهيرة حتى السادسة.
  tip: >-
    ساعتان تكفيان إن لم تدخل متحفاً. ميل الجادة خفيف والمشي فيها مريح، لكن معظم المعابر أنفاق فيها درج
    بلا مصاعد. وتُطبّق قواعد اللباس داخل الكنيسة. ودورات المياه تُوجد بسهولة في المقاهي وفي مركز التسوق
    عند طرف ميدان الحرية. ومعظم المتاحف تغلق يوم الاثنين. وفي أيام الاحتجاج تتوقف الحركة تماماً وتصبح
    السيارة بلا فائدة، فخطّط للتنقل سيراً.
  route: >-
    كيلومتران وعشر دقائق من وسط المدينة، غير أن الصعوبة ليست في القيادة بل في الوقوف. فالتوقف على روستافيلي
    نفسها ممنوع، وسيارة السحب تعمل فعلاً. والخيار الموثوق هو المرآب الأرضي المدفوع تحت مركز التسوق في
    ميدان الحرية، أو الأماكن المخططة في شارعي تشيتادزه وليرمونتوف؛ ومناطق الرسوم في المدينة تحتاج تصريحاً
    تحمله سيارات الإيجار عادة. والأفضل ترك السيارة عند الفندق والقدوم بالمترو: محطتا ميدان الحرية وروستافيلي
    عند طرفي الجادة. وسيارة اقتصادية تكفي.
