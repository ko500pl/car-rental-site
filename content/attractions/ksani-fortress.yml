ka:
  name: ქსნის ციხე
  short: >-
    მუხრანბატონების XVI საუკუნის ციხე სარკინეთის მთაზე, ქსნისა და მტკვრის შესართავის თავზე — ნახევრად
    დანგრეული, მაგრამ ჯერ კიდევ მეთვალყურე.
  body: >-
    **ქსნის ციხე შუღლმა ააშენა: 1512 წელს მეფის უმცროსმა ძმამ მუხრანი საუფლისწულოდ მიიღო და პირველ რიგში
    ორი მდინარის თავზე კედლები აღმართა.**


    ბაგრატი, ქართლის მეფის კონსტანტინე II-ის ძე, მუხრანი თავისი ძმისგან, მეფე დავით X-ისგან მიიღო და სანაცვლოდ
    კახეთის მეფესთან ბრძოლა იკისრა. ციხისთვის სარკინეთის მთა შეარჩია — დაახლოებით 600-მეტრიანი სიმაღლე,
    საიდანაც ქსნისა და მტკვრის ხეობები ერთბაშად ჩანს. ძველ წყაროებში მას მტკვრის ან მტვერის ციხედაც იხსენიებენ;
    ხალხმა კი ქსნის ციხე შეარქვა. ბაგრატისგან იწყება მუხრანბატონთა სახლი.


    გადმოცემით, კახეთის მეფე ავგიორგიმ ციხეს სამი თვე ალყა არტყა, მერე კი დამცინავად ღვინო გაუგზავნა:
    მეფის შვილი ხარ და ღვინის გემო დიდი ხანია არ გინახავსო. ბაგრატმა პასუხად ციხეში შენახული ცოცხალი ორაგული
    გაუგზავნა: სამი თვეა ქსანზე დგახარ და ორაგული არ გიგემიაო. ავგიორგი მიხვდა, რომ ციხე შიმშილით ვერ
    დაეცემოდა, და უკან დაიხია. 1513 წელს იგი ისევ შემოვიდა ქართლში, ბაგრატმა კი შეიპყრო და სწორედ ამ ციხეში
    გამოამწყვდია; მემატიანის თქმით, მალე იქვე მოაშთვეს.


    კედლებზე ორი ეპოქა იკითხება. პირველი, XVI საუკუნის ფენა მთლიანად რიყის ქვითაა ნაგები; 1746 წელს კი
    ძლიერ დაზიანებული ციხე კონსტანტინე მუხრანბატონმა თითქმის ხელახლა ააშენა — აგურით, სამი მრავალსართულიანი
    კოშკით და შესასვლელის თავზე ამოკვეთილი სამშენებლო წარწერით. დააკვირდით ნახევარწრიულ ქონგურებს, ნისკარტა
    სალოდეებსა და სათოფურებს; ჩრდილო-დასავლეთის კოშკის იატაკში ქვევრებია ჩაფლული, ეზოში — წყალსაცავი.
    წყალი ციხეს ქედს გაყოლებული კერამიკული მილებით, რამდენიმე კილომეტრიდან მოსდიოდა.


    ციხე მთავარი მაგისტრალიდან ყოველდღე ჩანს, მაგრამ ცოტა ვინმე უხვევს. ვინც აქამდე ამოვა, ერთი მზერით
    ორივე ხეობას დაინახავს — და ციხეს, რომელიც ერთმა თევზმა გადაარჩინა.
  tip: >-
    შესვლა უფასოა, ციხეს დარაჯი არ ჰყავს და არც არანაირი ინფრასტრუქტურა აქვს: წყალი თან იქონიეთ. ბოლო
    ასასვლელი მოკლე, მაგრამ ციცაბოა და ფეხქვეშ ქვები სრიალებს, ამიტომ მოხერხებული ფეხსაცმელი ჩაიცვით.
    ნანგრევს მოაჯირები არ აქვს, კედლები ადგილ-ადგილ იშლება — ბავშვებს თვალი ადევნეთ და კედლებზე ნუ აძვრებით.
    დათვალიერებას ერთი საათი ეყოფა. ეროვნული მნიშვნელობის ძეგლია — ქვას ნურაფერს მიაწერთ და ნურც წაიღებთ.
    ახლოს, დაახლოებით ხუთ კილომეტრში, შატო მუხრანია — ორივე ერთ ნახევარდღეში შეთავსდება.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ მიდიხართ, მცხეთას გასცდებით და ციხისძირთან გადიხართ
    მაგისტრალიდან — ციხე სამხრეთით, ქედზე, მაგისტრალიდანვე ჩანს. სოფლის გზებით და ბოლოს გრუნტის გზით ქედისკენ
    დაახლოებით სამი კილომეტრია. სულ 44 კმ და დაახლოებით 55 წუთი. ახალგორის მიმართულებით ჩრდილოეთისკენ
    ნუ წახვალთ — ის გზა ოკუპაციის ხაზისკენ მიდის. წვიმის შემდეგ გრუნტის გზა სრიალა ხდება და ღრმულებით
    ივსება, ამიტომ მაღალი კლირენსის SUV ჯობია; მანქანას იქ ტოვებთ, სადაც გზა მთავრდება, და ბოლო ციცაბო
    მონაკვეთს ფეხით ადიხართ. საწვავი ს1-ის გასწვრივ მრავლადაა.
en:
  name: Ksani Fortress
  short: >-
    A 16th-century stronghold of the Mukhrani princes on Mount Sarkineti, half-ruined but still keeping
    watch where the Ksani meets the Mtkvari.
  body: >-
    **Ksani fortress was born of a quarrel: in 1512 a king’s younger brother was granted Mukhrani and,
    before anything else, raised walls on the hill above two rivers.**


    Bagrat, son of King Constantine II of Kartli, received the Mukhrani district from his brother, King
    David X, promising in return to fight the king of Kakheti. For his stronghold he chose Mount Sarkineti,
    a height of some 600 metres from which both the Ksani and Mtkvari valleys open at a glance. Old records
    call it the Mtkvari or Mtveri fortress; people simply call it Ksani. From Bagrat descends the princely
    house of Mukhrani.


    Tradition says George II of Kakheti besieged it for three months, then mockingly sent the defenders
    wine: a king’s son, and so long without tasting it. Bagrat answered with a live salmon kept inside
    the walls — three months on the Ksani, and you have not tasted salmon. George understood the fortress
    would not starve, and withdrew. In 1513 he invaded again; Bagrat captured him and locked him up in
    this very fortress, where, the chronicle says, he was soon strangled.


    Two eras are legible in the walls. The 16th-century work is all river cobbles; in 1746 Constantine
    III, Prince of Mukhrani, rebuilt the badly damaged fortress almost from scratch, adding brick, three
    multi-storey towers and a building inscription above the entrance. Look for the rounded merlons, the
    projecting machicolations and the gun loops; the north-western tower has qvevri sunk into its floor,
    and the courtyard holds a reservoir. Water once arrived by ceramic pipes laid along the ridge from
    several kilometres away.


    Drivers on the main highway see it every day; very few turn off. Those who climb up get both valleys
    in one glance — and a fortress that was saved by a fish.
  tip: >-
    Entry is free, but the fortress is unstaffed and has no facilities, so bring water. The final climb
    is short and steep over loose stones — wear proper shoes. There are no railings and some walls are
    crumbling: keep children close and stay off the ramparts. An hour is enough. This is a monument of
    national significance, so leave the stones as you found them. Chateau Mukhrani is about five kilometres
    away, and the two fit comfortably into half a day.
  route: >-
    From Tbilisi head west on the S1 (E60) past Mtskheta and leave the highway at Tsikhisdziri — the fortress
    is visible on its ridge to the south before you even turn off. From there it is roughly three kilometres
    of village lanes and finally a dirt track towards the ridge; 44 km and about 55 minutes in all. Do
    not follow the Akhalgori road north: it leads towards the occupation line. The dirt track turns slick
    and rutted after rain, so a high-clearance SUV is the safer choice; park where the track ends and
    walk the last steep stretch. Fuel is plentiful along the S1.
ru:
  name: Ксанская крепость
  short: >-
    Твердыня князей Мухрани XVI века на горе Саркинети: полуразрушенная, она всё так же стережёт место,
    где Ксани впадает в Куру.
  body: >-
    **Ксанская крепость родилась из распри: в 1512 году младший брат царя получил в удел Мухрани и первым
    делом возвёл стены на холме над двумя реками.**


    Баграт, сын картлийского царя Константина II, получил Мухрани от брата, царя Давида X, обязавшись
    взамен воевать с кахетинским царём. Для твердыни он выбрал гору Саркинети — высоту около 600 метров,
    откуда одним взглядом охватываешь долины Ксани и Куры (Мтквари). В старых записях её называют крепостью
    Мтквари, или Мтвери; в народе — просто Ксанской. От Баграта ведёт свой род княжеский дом Мухрани.


    Предание гласит, что Георгий II Кахетинский три месяца держал крепость в осаде, а потом с издёвкой
    послал защитникам вина: царский сын — и так давно его не пробовал. Баграт ответил живым лососем, которого
    держали в стенах крепости: три месяца стоишь на Ксани — и лосося не отведал. Георгий понял, что голодом
    крепость не взять, и отступил. В 1513 году он вторгся снова; Баграт взял его в плен и заточил в этой
    самой крепости, где, по словам летописи, его вскоре задушили.


    В стенах читаются две эпохи. Кладка XVI века — сплошь речной булыжник; в 1746 году Константин III,
    князь Мухрани, почти заново отстроил сильно разрушенную крепость, добавив кирпич, три многоэтажные
    башни и строительную надпись над входом. Присмотритесь к полукруглым зубцам, выступающим машикулям
    и ружейным бойницам; в пол северо-западной башни вкопаны квеври, во дворе — водоём. Когда-то вода
    приходила сюда по керамическим трубам, проложенным по хребту за несколько километров.


    Водители на главной трассе видят её каждый день; сворачивают единицы. Кто поднимется, увидит обе долины
    разом — и крепость, которую спасла рыба.
  tip: >-
    Вход свободный, но смотрителя и удобств нет, так что возьмите воду. Последний подъём короткий и крутой,
    по осыпающимся камням, — нужна нормальная обувь. Перил нет, некоторые стены крошатся: держите детей
    рядом и не забирайтесь на крепостные стены. Часа вполне хватит. Это памятник национального значения,
    поэтому оставьте камни такими, какими их нашли. До Шато Мухрани около пяти километров, и оба места
    легко укладываются в полдня.
  route: >-
    Из Тбилиси езжайте на запад по S1 (E60) мимо Мцхеты и сверните с трассы у Цихисдзири — крепость видна
    на хребте к югу ещё до поворота. Дальше примерно три километра по сельским улочкам и под конец по
    грунтовке к хребту; всего 44 км и около 55 минут. Не уходите на север по дороге на Ахалгори: она ведёт
    к линии оккупации. После дождя грунтовка становится скользкой и разбитой, так что надёжнее внедорожник
    с высоким клиренсом; оставьте машину там, где кончается дорога, и последний крутой отрезок пройдите
    пешком. Заправок на S1 в избытке.
fa:
  name: قلعهٔ کسانی
  short: >-
    دژ شاهزادگان موخرانی از سدهٔ شانزدهم بر کوه سارکینتی؛ نیمه‌ویران، اما هنوز نگهبان جایی که کسانی به
    کورا می‌پیوندد.
  body: >-
    **قلعهٔ کسانی زادهٔ یک کشمکش بود: در سال ۱۵۱۲ برادر کوچک‌تر یک پادشاه، موخرانی را به تیول گرفت و پیش
    از هر کار دیگری، بر تپه‌ای مشرف بر دو رود دیوار برافراشت.**


    باگرات، پسر کنستانتین دوم شاه کارتلی، ناحیهٔ موخرانی را از برادرش، شاه داوید دهم، گرفت و در عوض متعهد
    شد با شاه کاختی بجنگد. برای دژ خود کوه سارکینتی را برگزید، بلندی‌ای حدود ۶۰۰ متری که دره‌های کسانی
    و کورا (متکواری) از آن با یک نگاه پیداست. اسناد کهن آن را قلعهٔ متکواری یا متوری می‌نامند؛ مردم اما
    به‌سادگی می‌گویند کسانی. خاندان شاهزادگان موخرانی از نسل باگرات است.


    روایت است که گیورگی دوم، شاه کاختی، سه ماه قلعه را در محاصره گرفت و سپس به ریشخند برای مدافعان شراب
    فرستاد: پسر پادشاهی و این‌همه مدت طعم شراب را نچشیده‌ای. باگرات در پاسخ ماهی آزاد زنده‌ای فرستاد که
    درون دیوارها نگه داشته می‌شد: سه ماه است کنار کسانی نشسته‌ای و طعم ماهی آزاد را نچشیده‌ای. گیورگی
    دریافت که قلعه از گرسنگی تسلیم نخواهد شد و عقب نشست. در سال ۱۵۱۳ دوباره یورش آورد؛ باگرات او را اسیر
    کرد و در همین قلعه به بند کشید، و به گفتهٔ وقایع‌نامه، اندکی بعد خفه‌اش کردند.


    در دیوارها دو دوره را می‌توان خواند. کارِ سدهٔ شانزدهم یکسره از قلوه‌سنگ رودخانه است؛ در سال ۱۷۴۶
    کنستانتین سوم، شاهزادهٔ موخرانی، قلعهٔ سخت آسیب‌دیده را تقریباً از نو ساخت و آجر، سه برج چندطبقه و
    کتیبهٔ ساخت بر فراز ورودی را به آن افزود. به کنگره‌های گرد، سکوهای تیرریزِ بیرون‌زده و مزغل‌های تفنگ
    دقت کنید؛ در کف برج شمال‌غربی کوِوری‌ها (کوزه‌های بزرگ سفالی) در زمین نشانده شده‌اند و در حیاط آب‌انباری
    هست. زمانی آب با لوله‌های سفالی که در امتداد خط‌الرأس کشیده شده بود، از چند کیلومتر دورتر به قلعه
    می‌رسید.


    رانندگان جادهٔ اصلی هر روز آن را می‌بینند، اما کمتر کسی به سویش می‌پیچد. آنان که بالا می‌روند هر دو
    دره را با یک نگاه می‌بینند — و قلعه‌ای را که یک ماهی نجاتش داد.
  tip: >-
    ورود رایگان است، اما قلعه نگهبان و هیچ امکاناتی ندارد؛ پس آب همراه داشته باشید. سربالایی پایانی کوتاه
    و تند است و از روی سنگ‌های لق می‌گذرد — کفش مناسب بپوشید. نرده‌ای در کار نیست و برخی دیوارها در حال
    فروریختن‌اند: کودکان را نزدیک خود نگه دارید و از باروها بالا نروید. یک ساعت کافی است. این‌جا اثری
    با اهمیت ملی است؛ سنگ‌ها را همان‌طور که یافتید رها کنید. شاتو موخرانی حدود پنج کیلومتر آن‌طرف‌تر است
    و هر دو به‌راحتی در نصف روز جا می‌شوند.
  route: >-
    از تفلیس از جادهٔ S1 (E60) به سمت غرب بروید، از کنار متسختا بگذرید و در تسیخیسدزیری از بزرگراه خارج
    شوید — قلعه پیش از آن‌که بپیچید، بر خط‌الرأسی در جنوب پیداست. از آن‌جا حدود سه کیلومتر از کوچه‌های
    روستایی و در پایان از راهی خاکی به‌سوی خط‌الرأس می‌روید؛ در مجموع ۴۴ کیلومتر و حدود ۵۵ دقیقه. جادهٔ
    آخالگوری را به سمت شمال دنبال نکنید: به خط اشغال می‌رسد. راه خاکی پس از باران لغزنده و پرچاله می‌شود،
    پس یک شاسی‌بلند با فاصلهٔ زیاد از زمین انتخاب مطمئن‌تری است؛ جایی که راه تمام می‌شود پارک کنید و سربالایی
    تند پایانی را پیاده بروید. در امتداد S1 جایگاه سوخت فراوان است.
he:
  name: מבצר קסאני
  short: >-
    מעוז של נסיכי מוחראני מהמאה ה-16 על הר סרקינטי: חציו חרב, והוא עדיין שומר על המקום שבו הקסאני נשפך
    אל המטקווארי.
  body: >-
    **מבצר קסאני נולד מתוך סכסוך: ב-1512 קיבל אחיו הצעיר של המלך את מוחראני כנחלה, ולפני כל דבר אחר הקים
    חומות על הגבעה שמעל שני נהרות.**


    בגרט, בנו של קונסטנטין השני מלך קרתלי, קיבל את מחוז מוחראני מאחיו, המלך דוד העשירי, והתחייב בתמורה
    להילחם במלך קחתי. למעוזו בחר בהר סרקינטי, רום של כ-600 מטר שממנו נפרשים במבט אחד עמקי הקסאני והמטקווארי
    (הקורה). רשומות עתיקות מכנות אותו מבצר מטקווארי או מטוורי; העם קורא לו פשוט קסאני. מבגרט מתחיל בית
    הנסיכים של מוחראני.


    המסורת מספרת שגיורגי השני מלך קחתי צר על המבצר שלושה חודשים, ואז שלח למגינים יין בלגלוג: בן מלך אתה,
    וכל כך הרבה זמן לא טעמת יין. בגרט השיב לו בסלמון חי שהוחזק בין החומות: שלושה חודשים אתה חונה על הקסאני,
    ועוד לא טעמת סלמון. גיורגי הבין שהמבצר לא ייפול ברעב, ונסוג. ב-1513 פלש שוב; בגרט שבה אותו וכלא אותו
    במבצר הזה עצמו, ושם, כך מספר כותב הכרוניקה, נחנק זמן קצר לאחר מכן.


    בחומות אפשר לקרוא שתי תקופות. הבנייה מהמאה ה-16 עשויה כולה אבני נחל מעוגלות; ב-1746 בנה קונסטנטין
    השלישי, נסיך מוחראני, את המבצר שנפגע קשות כמעט מחדש, והוסיף לבנים, שלושה מגדלים רבי-קומות וכתובת בנייה
    מעל הכניסה. חפשו את שיני החומה המעוגלות, את מרפסות ההטלה הבולטות ואת חרכי הירי לרובים; ברצפת המגדל
    הצפון-מערבי שקועים קווברי — כדי חרס גדולים — ובחצר יש מאגר מים. פעם הגיעו לכאן המים בצינורות קרמיקה
    שהונחו לאורך הרכס מכמה קילומטרים משם.


    נהגים בכביש הראשי רואים אותו כל יום; מעטים מאוד פונים אליו. מי שמטפס למעלה מקבל את שני העמקים במבט
    אחד — ומבצר שדג הציל אותו.
  tip: >-
    הכניסה חופשית, אבל אין במבצר צוות ואין שירותים, אז הביאו מים. הטיפוס האחרון קצר ותלול, על אבנים רופפות
    — נעלו נעליים מתאימות. אין מעקות וחלק מהחומות מתפוררות: שמרו על הילדים קרוב ואל תעלו על החומות. שעה
    מספיקה. זהו אתר מורשת בעל חשיבות לאומית, אז השאירו את האבנים כפי שמצאתם אותן. שאטו מוחראני נמצא כחמישה
    קילומטרים משם, ושניהם נכנסים בנוחות בחצי יום.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני מצחתה, וצאו מהכביש המהיר בציחיסדזירי — המבצר נראה על רכסו
    מדרום עוד לפני הפנייה. משם כשלושה קילומטרים בסמטאות כפר ולבסוף בדרך עפר לכיוון הרכס; בסך הכול 44 ק״מ
    וכ-55 דקות. אל תמשיכו צפונה בכביש לאחלגורי: הוא מוביל אל קו הכיבוש. אחרי גשם דרך העפר נעשית חלקלקה
    ומלאת תלמים, ולכן רכב שטח גבוה הוא הבחירה הבטוחה יותר; חנו היכן שהדרך נגמרת ועלו את הקטע התלול האחרון
    ברגל. תחנות דלק יש בשפע לאורך S1.
ar:
  name: قلعة كساني
  short: >-
    حصن أمراء موخراني من القرن السادس عشر على جبل ساركينيتي، نصف مهدّم لكنه لا يزال يحرس ملتقى نهر كساني
    بنهر كورا.
  body: >-
    **وُلدت قلعة كساني من خصومة: ففي عام 1512 نال الأخ الأصغر للملك إقطاعة موخراني، فكان أول ما فعله أن
    رفع الأسوار على التلة المطلّة على نهرين.**


    تسلّم باغرات، ابن قسطنطين الثاني ملك كارتلي، منطقة موخراني من أخيه الملك داود العاشر، متعهدًا في المقابل
    بمحاربة ملك كاخيتي. واختار لحصنه جبل ساركينيتي، وهو مرتفع يبلغ نحو 600 متر ينفتح منه واديا كساني وكورا
    (متكفاري) بنظرة واحدة. تسمّيها السجلات القديمة قلعة متكفاري أو متفيري، أما الناس فيسمّونها ببساطة
    كساني. ومن باغرات يتحدّر بيت أمراء موخراني.


    يروي التراث أن غيورغي الثاني ملك كاخيتي حاصر القلعة ثلاثة أشهر، ثم أرسل إلى المدافعين نبيذًا على سبيل
    السخرية: ابنُ ملك، وقد طال عهدك بطعم النبيذ. فردّ باغرات بسمكة سلمون حيّة كانت تُحفظ داخل الأسوار:
    ثلاثة أشهر وأنت مقيم على نهر كساني ولم تذق السلمون. فأدرك غيورغي أن القلعة لن تسقط جوعًا، فانسحب.
    وفي عام 1513 عاد غازيًا، فأسره باغرات وسجنه في هذه القلعة نفسها، حيث خُنق بعد قليل، كما تقول الحولية.


    تُقرأ في الأسوار حقبتان. بناء القرن السادس عشر كله من حصى الأنهار؛ وفي عام 1746 أعاد قسطنطين الثالث،
    أمير موخراني، بناء القلعة المتضررة بشدة من أساسها تقريبًا، مضيفًا الآجر وثلاثة أبراج متعددة الطوابق
    ونقشًا تأسيسيًا فوق المدخل. تأمّل الشُّرَف المستديرة، والسقّاطات الناتئة، ومزاغل البنادق؛ وفي أرضية
    البرج الشمالي الغربي جرار «قفيري» (أوانٍ فخارية كبيرة) مطمورة، وفي الباحة خزان للماء. وكان الماء يصل
    قديمًا عبر أنابيب خزفية ممدودة على طول الحافة الجبلية من مسافة عدة كيلومترات.


    يراها سائقو الطريق الرئيسي كل يوم، وقليلون جدًا ينعطفون إليها. ومن يصعد إليها يحظى بالواديين في نظرة
    واحدة، وبقلعةٍ أنقذتها سمكة.
  tip: >-
    الدخول مجاني، لكن القلعة بلا حارس ولا مرافق، فاحمل معك الماء. الصعود الأخير قصير وشديد الانحدار فوق
    حجارة مفككة، فالبس حذاءً مناسبًا. لا درابزين، وبعض الأسوار يتداعى: أبقِ الأطفال قريبين منك ولا تصعد
    على الأسوار. تكفي ساعة واحدة. هذا معلم ذو أهمية وطنية، فاترك الحجارة كما وجدتها. يقع شاتو موخراني
    على بعد نحو خمسة كيلومترات، ويتسع نصف يوم للمكانين بسهولة.
  route: >-
    من تبليسي اتجه غربًا على الطريق S1 (E60) مرورًا بمتسخيتا، واخرج من الطريق السريع عند تسيخيسدزيري —
    تظهر القلعة على حافتها جنوبًا قبل أن تنعطف. ومن هناك نحو ثلاثة كيلومترات في أزقّة القرية ثم دربٌ ترابي
    نحو الحافة؛ والمجموع 44 كم ونحو 55 دقيقة. لا تسلك طريق أخالغوري شمالًا: فهو يقود إلى خط الاحتلال.
    يصبح الدرب الترابي زلقًا ومليئًا بالأخاديد بعد المطر، لذا فسيارة دفع رباعي ذات خلوص أرضي مرتفع هي
    الخيار الأسلم؛ اركن حيث ينتهي الدرب واصعد المقطع الأخير الشديد الانحدار سيرًا. محطات الوقود وفيرة
    على طول الطريق S1.
