ka:
  name: გეგუთის სასახლე
  short: >-
    გიორგი III-ის დიდი სასახლის აგურის ნანგრევები ქუთაისის სამხრეთით, სადაც 1191 წელს აჯანყებულმა დიდებულებმა
    თამარის მეტოქეს გვირგვინი დაადგეს.
  body: >-
    **1191 წელს რიონის ვაკეზე მდგარი სასახლის დარბაზში აჯანყებულმა დიდებულებმა თამარ მეფის ყოფილ მეუღლეს,
    გიორგი რუსს — რუს უფლისწულ იური ბოგოლიუბსკის — გვირგვინი დაადგეს.**


    შეთქმულება ჩაიშალა, სასახლეს კი მაშინ უკვე გრძელი წარსული ჰქონდა. გეგუთი ქუთაისიდან შვიდ კილომეტრშია,
    სამხრეთით. ჯუანშერის თხზულების ერთ-ერთ ნუსხაში VIII საუკუნის ქართლის ერისმთავარი არჩილი ამბობს: „...წარვალ
    და დავეშენები ციხესა გეგუთს და ქუთათისს“. ადგილზე ყველაზე ძველი ნაგებობა — ერთოთახიანი „სანადირო სახლი“
    უზარმაზარი ბუხრით — VIII–IX საუკუნეებით თარიღდება; ამბობენ, იმ ბუხარში მთელი ირემი იწვებოდაო.


    გიორგი III-მ (1156–1184) სანადირო სახლი სამეფო რეზიდენციად აქცია: თლილი ქვის სამმეტრიან ცოკოლზე აგურის
    ოთხიარუსიანი სასახლე აღიმართა, რომლის ჯვრულ დარბაზს თოთხმეტმეტრიანი გუმბათი ედგა, აქეთ-იქით საწოლი
    ოთახი, სალარო, საგანძური და აბანო ეკვროდა, მთელ ნაგებობას კი გარედან მასიური ბურჯები ამაგრებდა. ქართული
    წყაროებით, სწორედ აქ გამოაცხადა მეფემ თანამოსაყდრედ თავისი ასული, თამარი. სამეფოს დაშლის შემდეგ გეგუთი
    იმერეთის მეფეთა რეზიდენცია გახდა — 1737 წლის რუკაზეც აღნიშნულია.


    მერე ნელი ნგრევა დაიწყო. XIX საუკუნის დასაწყისში სოლომონ II-ის ომებმა სასახლე დააზიანა, იმერეთის სამეფოს
    ანექსიის შემდეგ კი რუსეთის იმპერიის მოხელეებმა მისი მასალა ქუთაისში შენობების ასაშენებლად წაიღეს.
    1833 წელს შვეიცარიელმა მოგზაურმა ფრედერიკ დიუბუა დე მონპერემ შემორჩენილი ნაწილის გეგმა შეადგინა; 1937
    წლისა და 1950-იანი წლების გათხრებმა სასახლის მოხაზულობა აღადგინა.


    დღეს აქ სქელი აგურის კედლები, გადარჩენილი თაღი, სამეფო აბანოსა და წყალგაყვანილობის კვალი დაგხვდებათ,
    2016 წლიდან კი — შუშის პანელებიც, რომლებზეც დაკარგული გუმბათი ჰაერშია დახატული. შუა საუკუნეების საქართველო
    ძირითადად ეკლესიებით შემოგვრჩა. დარბაზებიდან, სადაც მისი მეფეები ისვენებდნენ, ნადიმობდნენ და გვირგვინს
    იდგამდნენ, თითქმის მხოლოდ ესღა დარჩა.
  tip: >-
    ნახევარი საათიდან ერთ საათამდე საკმარისია. ძეგლი ღიაა — არც ღობეა და არც ბილეთი. ზაფხულში ბალახი ხშირად
    მაღალია და ტკიპაც გვხვდება, ამიტომ გრძელი შარვალი და დახურული ფეხსაცმელი ჩაიცვით. აგურის წყობით მიწიდან
    დატკბით: ის ძველია, ფხვიერი და კიდეებში ჩამონგრეული, ყოველი ნაბიჯი კი კიდევ უფრო ცვეთს. ჩრდილი თითქმის
    არ არის — დილით ან საღამოსკენ მოდით, როცა დაბალი მზე აგურს ათბობს. ადგილზე არანაირი მომსახურება არ
    არის: სოფელში მაღაზიაა, დანარჩენი ყველაფერი ქუთაისშია, მანქანით თხუთმეტიოდე წუთში. სასახლის გეგმა
    წინასწარ გაიცანით — ნანგრევი მაშინ ბევრად მეტს გეტყვით.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონის გავლით ქუთაისის მიმართულებით — სულ დაახლოებით
    225 კმ და 3 სთ 15 წთ. გეგუთი ქუთაისის სამხრეთით, მაგისტრალთან ახლოსაა, იქ, სადაც გზა ქალაქს სამტრედიისკენ
    უვლის გვერდს; გეგუთის გასასვლელზე გადაუხვიეთ და სოფელში მაჩვენებლებს მიჰყევით. ბოლო ორასიოდე მეტრი
    მოხრეშილია: მშრალ ამინდში ჩვეულებრივი მანქანითაც იოლად გაივლით, წვიმის შემდეგ კი ღრმა გუბეები დგება.
    მანქანა ნანგრევებთან, ბალახზე დააყენეთ. საწვავი S1-ზე და ქუთაისში ყველგანაა. ეკონომ-კლასის მანქანა
    საკმარისია, თუ გზა წყალს არ დაუფარავს.
en:
  name: Geguti Palace
  short: >-
    Brick ruins of George III's great palace on the Rioni plain south of Kutaisi, where in 1191 rebel
    nobles crowned a rival to Queen Tamar.
  body: >-
    **In 1191, in a palace hall on the Rioni plain, rebel nobles set a crown on the head of Queen Tamar's
    former husband, the Russian prince Yuri Bogolyubsky.**


    The coup failed, but the hall already had a long past. Geguti lies seven kilometres south of Kutaisi,
    and one manuscript of Juansher's chronicle puts it in the mouth of Archil, an 8th-century ruler of
    Kartli: "I shall go and settle at the castle of Geguti and at Kutatisi." The oldest building on the
    site, a one-room hunting lodge with a huge fireplace, is dated to the 8th–9th century; the story goes
    that a whole deer could be roasted in it.


    George III (1156–1184) turned the lodge into a royal residence: a four-tiered brick palace on a three-metre
    plinth of dressed stone, its cross-shaped hall crowned by a dome fourteen metres across and flanked
    by a bedchamber, treasuries and a bath, the whole braced by massive buttresses. Georgian sources say
    it was here that he proclaimed his daughter Tamar co-ruler. After the kingdom split, Geguti served
    the kings of Imereti; a map of 1737 still marks it.


    Then came the slow unmaking. The wars of Solomon II damaged it in the early 19th century, and after
    Russia annexed Imereti, imperial officials carted its material away to build in Kutaisi. In 1833 the
    Swiss traveller Frédéric Dubois de Montpéreux drew what was left; excavations in 1937 and the 1950s
    recovered the plan.


    Today you find thick brick walls, a surviving arch, traces of the royal bath and its water channels,
    and, since 2016, glass panels on which the lost dome is drawn in the air. Medieval Georgia survives
    mostly as churches. Of the rooms where its kings rested, feasted and were crowned, this is almost
    all that is left.
  tip: >-
    Half an hour to an hour is enough. The site is open, unfenced and free. In summer the grass can stand
    high and ticks are about, so wear long trousers and closed shoes. Admire the brickwork from the ground:
    it is old, friable and broken at the edges, and every foothold wears it further. There is almost no
    shade, so come in the morning or towards evening, when a low sun warms the brick. There are no facilities
    on site; the village has a shop, and everything else is in Kutaisi, fifteen minutes' drive away. Read
    up on the plan first; the ruin says far more then.
  route: >-
    From Tbilisi follow the S1 (E60) west past Zestaponi towards Kutaisi: about 225 km and 3 h 15 min
    in all. Geguti lies just south of Kutaisi, close to the highway where it skirts the city towards Samtredia;
    take the exit for Geguti and follow the signs through the village. The last couple of hundred metres
    are gravel, easy in an ordinary car when dry but deeply puddled after rain. Park on the grass beside
    the ruins. Fuel is plentiful along the S1 and in Kutaisi. An economy car is enough unless the track
    is waterlogged.
ru:
  name: Гегутский дворец
  short: >-
    Кирпичные руины великого дворца Георгия III на равнине Риони южнее Кутаиси, где в 1191 году мятежные
    вельможи венчали соперника царицы Тамары.
  body: >-
    **В 1191 году во дворцовом зале на равнине Риони мятежные вельможи возложили корону на голову бывшего
    супруга царицы Тамары — русского князя Юрия Боголюбского.**


    Заговор провалился, но у этого зала уже была долгая история. Гегути лежит в семи километрах южнее
    Кутаиси, и в одной из рукописей хроники Джуаншера эти слова вложены в уста Арчила, правителя Картли
    VIII века: «Пойду и поселюсь в крепости Гегути и в Кутатиси». Самое старое здание на этом месте —
    однокомнатный охотничий домик с огромным очагом — датируется VIII–IX веком; говорят, в этом очаге
    можно было зажарить целого оленя.


    Георгий III (1156–1184) превратил охотничий домик в царскую резиденцию: четырёхъярусный кирпичный
    дворец на трёхметровом цоколе из тёсаного камня, крестообразный зал которого венчал купол диаметром
    четырнадцать метров, с опочивальней, казнохранилищами и баней по бокам, а всё сооружение снаружи держали
    массивные контрфорсы. Грузинские источники говорят, что именно здесь он провозгласил свою дочь Тамару
    соправительницей. После распада царства Гегути служил резиденцией имеретинских царей; он отмечен ещё
    на карте 1737 года.


    Затем началось медленное разрушение. Войны Соломона II повредили дворец в начале XIX века, а после
    присоединения Имеретии к России имперские чиновники вывозили его материал на строительство в Кутаиси.
    В 1833 году швейцарский путешественник Фредерик Дюбуа де Монпере зарисовал то, что осталось; раскопки
    1937 года и 1950-х годов выявили план сооружения.


    Сегодня здесь толстые кирпичные стены, сохранившаяся арка, следы царской бани и её водопровода, а
    с 2016 года — стеклянные панели, на которых утраченный купол прочерчен прямо в воздухе. Средневековая
    Грузия дошла до нас в основном церквями. От покоев, где её цари отдыхали, пировали и венчались на
    царство, не уцелело почти ничего, кроме этого.
  tip: >-
    Достаточно получаса-часа. Место открытое, без ограждения и бесплатное. Летом трава бывает высокой,
    а клещей хватает, так что наденьте длинные брюки и закрытую обувь. Кирпичной кладкой любуйтесь с земли:
    она старая, рассыпающаяся и обломана по краям, и каждый шаг стирает её ещё больше. Тени почти нет,
    так что приходите утром или к вечеру, когда низкое солнце согревает кирпич. На месте никаких удобств;
    в деревне есть магазин, всё остальное — в Кутаиси, пятнадцать минут на машине. Изучите план заранее
    — тогда руины расскажут вам гораздо больше.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, минуя Зестафони, в сторону Кутаиси: всего около 225 км и 3
    ч 15 мин. Гегути лежит сразу к югу от Кутаиси, рядом с трассой, которая обходит город в сторону Самтредиа;
    сверните на съезд на Гегути и следуйте указателям через деревню. Последние метров двести — гравийка:
    в сухую погоду обычная машина проедет легко, но после дождя там стоят глубокие лужи. Оставьте машину
    на траве возле руин. Заправок много вдоль S1 и в Кутаиси. Машины эконом-класса достаточно, если только
    дорога не залита водой.
fa:
  name: کاخ گگوتی
  short: >-
    ویرانه‌های آجری کاخ بزرگ گیورگی سوم بر دشت ریونی در جنوب کوتایسی، جایی که در سال ۱۱۹۱ اشراف شورشی
    رقیب ملکه تامار را تاج‌گذاری کردند.
  body: >-
    **در سال ۱۱۹۱، در تالار کاخی بر دشت ریونی، اشراف شورشی تاجی بر سر همسر پیشین ملکه تامار، شاهزادهٔ
    روس یوری بوگولیوبسکی، نهادند.**


    کودتا ناکام ماند، اما این تالار پیش از آن نیز تاریخی طولانی داشت. گگوتی هفت کیلومتر در جنوب کوتایسی
    است، و در یک نسخهٔ خطی از تاریخ جوانشر، این سخنان از زبان آرچیل، فرمانروای کارتلی در سدهٔ هشتم، نقل
    شده است: «خواهم رفت و در قلعهٔ گگوتی و در کوتاتیسی سکونت خواهم گزید.» کهن‌ترین ساختمان این مکان، خانهٔ
    شکار یک‌اتاقه‌ای با اجاقی بزرگ، به سدهٔ هشتم و نهم تاریخ‌گذاری می‌شود؛ می‌گویند در آن اجاق می‌شد گوزنی
    را به‌تمامی کباب کرد.


    گیورگی سوم (۱۱۵۶–۱۱۸۴) خانهٔ شکار را به اقامتگاه سلطنتی بدل کرد: کاخی آجری چهارمرتبه‌ای بر سکویی سه‌متری
    از سنگ تراش‌خورده، که تالار صلیب‌شکلش را گنبدی به قطر چهارده متر می‌پوشاند، و در دو سوی آن اتاق خواب،
    خزانه‌ها و حمامی بود، و همهٔ این بنا را از بیرون پشت‌بندهایی عظیم نگاه می‌داشت. منابع گرجی می‌گویند
    دقیقاً همین‌جا بود که پادشاه دخترش، تامار، را هم‌فرمانروا اعلام کرد. پس از فروپاشی پادشاهی، گگوتی
    اقامتگاه پادشاهان ایمرتی شد؛ نقشه‌ای از سال ۱۷۳۷ هنوز آن را نشان می‌دهد.


    سپس فروپاشی آرام آغاز شد. جنگ‌های سولومون دوم در آغاز سدهٔ نوزدهم به کاخ آسیب رساند، و پس از الحاق
    ایمرتی به روسیه، مأموران امپراتوری مصالح آن را برای ساخت‌وساز در کوتایسی بردند. در سال ۱۸۳۳ فردریک
    دوبوآ دو مونپِره، سیاح سوئیسی، آن‌چه باقی مانده بود را ترسیم کرد؛ کاوش‌های سال ۱۹۳۷ و دههٔ ۱۹۵۰ نقشهٔ
    بنا را بازیافتند.


    امروز در این‌جا دیوارهای آجری ستبر، طاقی برجامانده، ردی از حمام سلطنتی و کانال‌های آب آن، و از سال
    ۲۰۱۶ نیز پانل‌های شیشه‌ای می‌یابید که گنبد ازدست‌رفته بر آن‌ها در هوا ترسیم شده است. گرجستان سده‌های
    میانه بیشتر به‌شکل کلیساها برای ما باقی مانده. از تالارهایی که پادشاهانش در آن می‌آسودند، جشن می‌گرفتند
    و تاج‌گذاری می‌کردند، تقریباً تنها همین باقی مانده است.
  tip: >-
    نیم ساعت تا یک ساعت کافی است. محل باز، بدون حصار و رایگان است. در تابستان علف‌ها اغلب بلندند و کنه
    هم دیده می‌شود، پس شلوار بلند و کفش بسته بپوشید. آجرکاری را از روی زمین تحسین کنید: قدیمی، فرسوده
    و لبه‌شکسته است، و هر قدم بیشتر آن را می‌ساید. تقریباً هیچ سایه‌ای نیست، پس صبح یا نزدیک غروب بیایید،
    وقتی خورشیدِ مایلِ صبح یا عصر آجرها را گرم می‌کند. در محل هیچ امکاناتی نیست؛ روستا مغازه‌ای دارد،
    و بقیهٔ چیزها در کوتایسی است، پانزده دقیقه با ماشین. پیش از آمدن نقشهٔ بنا را بخوانید؛ ویرانه آن‌گاه
    بسیار بیشتر با شما سخن می‌گوید.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب و از کنار زستافونی به سوی کوتایسی بروید: در کل نزدیک به ۲۲۵
    کیلومتر و ۳ ساعت و ۱۵ دقیقه. گگوتی درست در جنوب کوتایسی است، نزدیک بزرگراهی که شهر را به سوی سامترِدیا
    دور می‌زند؛ از خروجی گگوتی بپیچید و در روستا تابلوها را دنبال کنید. دویست متر آخر شنی است، در هوای
    خشک با ماشین معمولی به‌آسانی طی می‌شود، اما پس از باران به‌شدت آب می‌گیرد. ماشین را روی چمن نزدیک
    ویرانه‌ها پارک کنید. سوخت در طول S1 و در کوتایسی فراوان است. یک خودروی اکونومی کافی است، مگر آن‌که
    راه زیر آب باشد.
he:
  name: ארמון גגוטי
  short: >-
    חורבות לבנים של ארמונו הגדול של גיאורגי השלישי במישור ריוני מדרום לקוטאיסי, שם הוכתר ב-1191 יריב למלכה
    תמר בידי אצילים מורדים.
  body: >-
    **ב-1191, באולם ארמון במישור ריוני, הניחו אצילים מורדים כתר על ראשו של בעלה הקודם של המלכה תמר, הנסיך
    הרוסי יורי בוגוליובסקי.**


    ההפיכה נכשלה, אך לאולם הזה היה כבר עבר ארוך. גגוטי שוכנת שבעה קילומטרים מדרום לקוטאיסי, וכתב יד אחד
    של כרוניקת ג'ואנשר שם בפי ארצ'יל, שליט קרטלי במאה השמינית, את המילים: "אלך ואשתקע במצודת גגוטי ובקוטאטיסי".
    הבניין העתיק ביותר באתר, בית ציד בעל חדר אחד עם אח עצום, מתוארך למאה השמינית-תשיעית; מספרים שאייל
    שלם היה יכול להיצלות באח ההוא.


    גיאורגי השלישי (1156–1184) הפך את בית הציד למעון מלכותי: ארמון לבנים בן ארבעה מפלסים על בסיס אבן מסותתת
    בגובה שלושה מטרים, שאולמו דמוי הצלב הוכתר בכיפה בקוטר ארבעה-עשר מטרים, ולצדו חדר שינה, חדרי אוצר ומרחץ,
    וכל המבנה נתמך מבחוץ בתומכות מסיביות. מקורות גאורגיים מספרים שכאן הכריז המלך על בתו תמר כשותפה לשלטון.
    אחרי התפרקות הממלכה שירתה גגוטי את מלכי אימרתי; מפה מ-1737 עדיין מציינת אותה.


    ואז החלה ההתפוררות האיטית. מלחמותיו של סולומון השני פגעו בארמון בתחילת המאה ה-19, ואחרי סיפוח אימרתי
    לרוסיה פקידי האימפריה נטלו את חומריו לבנייה בקוטאיסי. ב-1833 שרטט המטייל השווייצרי פרדריק דובואה דה
    מונפרה את מה שנותר; חפירות 1937 ושנות ה-50 חשפו את תוכנית המבנה.


    כיום מוצאים כאן קירות לבנים עבים, קשת ששרדה, שרידי מרחץ המלוכה ותעלות המים שלו, ומ-2016 גם לוחות זכוכית
    שעליהם משוחזרת הכיפה האבודה באוויר. גאורגיה של ימי הביניים שרדה בעיקרה בכנסיות. מהחדרים שבהם נחו מלכיה,
    חגגו והוכתרו, זה כמעט כל מה שנשאר.
  tip: >-
    חצי שעה עד שעה מספיקות. האתר פתוח, ללא גדר וללא תשלום. בקיץ העשב יכול להיות גבוה ויש קרציות, לכן לבשו
    מכנסיים ארוכים ונעליים סגורות. התרשמו מבניית הלבנים מהקרקע: היא עתיקה, מתפוררת ושבורה בקצוות, וכל
    דריכה שוחקת אותה עוד. אין כמעט צל, כך שכדאי להגיע בבוקר או לפנות ערב, כשהשמש הנמוכה מחממת את הלבנים.
    אין מתקנים במקום; בכפר יש חנות, וכל השאר בקוטאיסי, רבע שעה נסיעה. קראו על התוכנית מראש — החורבה תגיד
    לכם הרבה יותר.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה, דרך זסטפוני, לכיוון קוטאיסי: בסך הכול כ-225 ק"מ ו-3 שעות ו-15 דקות.
    גגוטי שוכנת ממש מדרום לקוטאיסי, קרוב לכביש הראשי העוקף את העיר לכיוון סמטרדיה; פנו ליציאה לגגוטי ועקבו
    אחר השילוט בכפר. מאתיים המטרים האחרונים הם חצץ, קלים לנהיגה ברכב רגיל כשהם יבשים אך מוצפים לעומק אחרי
    גשם. חנו על הדשא סמוך לחורבות. דלק זמין בשפע לאורך S1 ובקוטאיסי. רכב חסכוני מספיק, אלא אם השביל מוצף.
ar:
  name: قصر غيغوتي
  short: >-
    أنقاض من الآجر لقصر غيورغي الثالث العظيم على سهل ريوني جنوب كوتايسي، حيث توّج نبلاء ثائرون عام 1191
    خصماً للملكة تامار.
  body: >-
    **في عام 1191، وفي قاعة قصر على سهل ريوني، وضع نبلاء ثائرون تاجاً على رأس الزوج السابق للملكة تامار،
    الأمير الروسي يوري بوغوليوبسكي.**


    فشل الانقلاب، لكن القاعة كان لها ماضٍ طويل من قبل. تقع غيغوتي على سبعة كيلومترات جنوب كوتايسي، وفي
    إحدى مخطوطات تاريخ جوانشير يضع الكاتب على لسان أرتشيل، حاكم كارتلي في القرن الثامن، هذه الكلمات: "سأمضي
    وأستوطن في قلعة غيغوتي وفي كوتاتيسي". أقدم بناء في الموقع، بيت صيد من غرفة واحدة بمدفأة ضخمة، يعود
    إلى القرنين الثامن والتاسع؛ وتقول الرواية إن أيّلاً كاملاً كان يُشوى في تلك المدفأة.


    حوّل غيورغي الثالث (1156-1184) بيت الصيد إلى مقر ملكي: قصر من الآجر بأربعة مستويات على قاعدة حجرية
    منحوتة ارتفاعها ثلاثة أمتار، تعلو قاعته الصليبية الشكل قبة قطرها أربعة عشر متراً، تحفّها غرفة نوم
    وخزائن وحمّام، ويدعم البناء كله من الخارج دعامات ضخمة. تقول مصادر جورجية إنه هنا أعلن الملك ابنته
    تامار حاكمة مشاركة. وبعد انقسام المملكة، خدمت غيغوتي ملوك إيميريتي؛ وما زالت خريطة من عام 1737 تشير
    إليها.


    ثم بدأ التفكك البطيء. أضرّت حروب سولومون الثاني بالقصر في أوائل القرن التاسع عشر، وبعد ضمّ روسيا لإيميريتي،
    حمل موظفو الإمبراطورية مواده لبناء أبنية في كوتايسي. في عام 1833 رسم الرحّالة السويسري فريدريك دوبوا
    دو مونبيريه ما تبقّى منه؛ وكشفت حفريات عام 1937 وحفريات الخمسينيات عن مخططه.


    اليوم تجد هنا جدراناً آجرية ثخينة، وقنطرة نجت، وآثاراً لحمّام الملك وقنوات مائه، ومنذ 2016 لوحات زجاجية
    تُرسم عليها القبة المفقودة في الهواء. وجلّ ما بقي لنا من جورجيا العصور الوسطى كنائس. ومن القاعات التي
    استراح فيها ملوكها وأقاموا الولائم وتُوِّجوا فيها، لم يبقَ تقريباً إلا هذا.
  tip: >-
    نصف ساعة إلى ساعة تكفي. الموقع مفتوح، بلا سياج وبلا رسوم. في الصيف قد يطول العشب وينشط القُراد، فارتدِ
    بنطالاً طويلاً وحذاءً مغلقاً. تأمّل البناء الآجري من الأرض: فهو قديم وهشّ ومكسور الحواف، وكل خطوة
    عليه تزيده تآكلاً. لا يوجد ظل تقريباً، فتعال في الصباح أو قرب المساء، حين تُدفّئ الشمس المنخفضة الآجر.
    لا مرافق في الموقع؛ في القرية متجر، وكل ما عداه في كوتايسي، على ربع ساعة بالسيارة. اقرأ عن المخطط
    مسبقاً؛ فالأنقاض تخبرك حينها بأكثر بكثير.
  route: >-
    من تبليسي على الطريق السريع S1 (E60) غرباً، مروراً بزستافوني، نحو كوتايسي: الإجمالي نحو 225 كم و3
    ساعات و15 دقيقة. تقع غيغوتي جنوب كوتايسي مباشرة، قرب الطريق السريع حيث يتجاوز المدينة نحو سامتريديا؛
    انحرف عند مخرج غيغوتي واتبع اللافتات عبر القرية. المئتا متر الأخيرة حصوية، سهلة العبور بسيارة عادية
    في الجفاف لكنها تغرق بعمق بعد المطر. اترك السيارة على العشب قرب الأنقاض. الوقود متوفر بكثرة على طول
    S1 وفي كوتايسي. سيارة اقتصادية تكفي، إلا إذا كان الطريق مغموراً بالمياه.
