ka:
  name: გეგუთის სასახლე
  short: >-
    ქუთაისის სამხრეთით, რიონის ველზე მდგარი სამეფო სასახლის ნანგრევები — შუა საუკუნეების ერთ-ერთი უდიდესი
    საერო ნაგებობა.
  body: >-
    **გეგუთი ის ადგილია, სადაც საქართველოს მეფეები ცხოვრობდნენ მაშინ, როცა ტაძრებს არ აშენებდნენ.** სასახლის
    ნანგრევები ქუთაისიდან შვიდიოდე კილომეტრით სამხრეთით, რიონის ვაკეზეა — დაბალი აგურის კედლები ბალახში,
    ტყის კიდეზე.


    უძველესი ბირთვი VIII–IX საუკუნეებისაა: ერთი დარბაზი დიდი ბუხრით. მთავარი კომპლექსი გიორგი III-ის დროს
    (1156–1184) აშენდა და მასშტაბით სრულიად გამორჩეულია — ჯვრული გეგმის ცენტრალური დარბაზი, ზემოდან თოთხმეტმეტრიანი
    გუმბათით, ტრომპებზე დაყრდნობილი, სამმეტრიან ქვის ბაქანზე. სულ ნაგებობა ორი ათას კვადრატულ მეტრზე მეტს
    იკავებდა. XIII–XIV საუკუნეებში დაემატა კიდევ რამდენიმე კორპუსი და სასახლის ეკლესია.


    აქ თამარ მეფე ისვენებდა; 1191 წელს გეგუთი მისი პირველი ქმრის, გიორგი რუსის, მომხრეთა აჯანყების ერთ-ერთი
    კვანძი გახდა. ზამთრობით სასახლე მეფის რეზიდენციად გამოიყენებოდა — რიონის ვაკე თბილია და ნადირობისთვის
    მოხერხებული.


    გულწრფელად: დღეს აქ გუმბათი აღარაა. რჩება მასიური აგურის კედლები ორ-სამ მეტრზე, ბუხრის ნიშა, კამარების
    ჩამონაშთი და გეგმის კონტური. 2016 წელს დაიდგა შუშის პანელები, რომლებზეც შენობის თავდაპირველი სახეა
    დახატული — მათი დახმარებით მასშტაბი გასაგები ხდება.


    მოდი მაშინ, თუ არქიტექტურის ისტორია გაინტერესებს ან ქუთაისიდან წყალტუბოსკენ მიდიხარ და ნახევარი საათი
    გაქვს. ღობე და ბილეთი აქ არ არის, ტურისტი — თითქმის არასდროს.


    ცალკე მისახედია სამშენებლო ტექნიკა. გეგუთი აგურითაა ნაშენი და არა თლილი ქვით, როგორც ქართული ეკლესიები
    — თხელი წყობით და ფართო დუღაბის ნაკერებით. ეს სასახლეებისა და აბანოების ენა იყო და არა საეკლესიო არქიტექტურისა,
    დღეს კი საქართველოში თითქმის აღარსად შემორჩა. აგური ქვაზე სწრაფად ცვდება, ამიტომ ნანგრევი ათწლეულიდან
    ათწლეულში კარგავს მოხაზულობას — ნაწილობრივ სწორედ ამიტომ დაიდგა 2016 წლის შუშის პანელები.
  tip: >-
    ნახევარი საათიდან ერთ საათამდე. ბალახი ზაფხულში მაღალია და ტკიპაა — გრძელი შარვალი ჯობია, ღია ფეხსაცმელი
    არა. ნანგრევებზე ასვლა შესაძლებელია, მაგრამ აგური ფხვიერია და კიდეები ჩამონგრეულია. ჩრდილი თითქმის
    არ არის, შუადღის მზე კი დამქანცველია — დილა ან საღამო სჯობს. ტუალეტი, კაფე და მაღაზია მხოლოდ სოფელშია,
    კილომეტრში. საინფორმაციო დაფები ქართულ და ინგლისურ ენებზეა, სხვა არაფერი — ისტორია წინასწარ წაიკითხე.
  route: >-
    თბილისიდან E60-ით ქუთაისისკენ, ქალაქამდე ცოტა ადრე კი სამხრეთით, ვარციხე-ბაღდათის მიმართულებით გადაუხვიე
    — სულ დაახლოებით 225 კმ და სამი საათი და თხუთმეტი წუთი. სოფელ გეგუთში მაჩვენებელი ნიშანი ასფალტიდან
    გაგიყვანს; ბოლო ორასიოდე მეტრი მოხრეშილი გზაა, მშრალ ამინდში ჩვეულებრივი მანქანით უპრობლემოდ გაივლი,
    წვიმის შემდეგ კი ღრმა გუბეებია. მანქანას პირდაპირ ნანგრევებთან, ბალახზე დააყენებ. საწვავი ქუთაისში
    აიღე.
en:
  name: Geguti Palace
  short: >-
    The ruins of a royal palace on the Rioni plain south of Kutaisi — one of the largest secular buildings
    of medieval Georgia.
  body: >-
    **Geguti is where the kings of Georgia lived when they were not building cathedrals.** The ruins stand
    about seven kilometres south of Kutaisi on the flat Rioni plain: low brick walls in rough grass at
    the edge of the woods.


    The oldest core is 8th or 9th century — a single room with a large fireplace. The main complex went
    up under George III (1156–1184) and was extraordinary in scale: a cruciform central hall carrying
    a dome fourteen metres across on squinches, set on a stone plinth three metres high. In all the building
    covered more than two thousand square metres. Further ranges and a palace church were added in the
    13th and 14th centuries.


    Queen Tamar used Geguti as a retreat, and in 1191 it became one of the focal points of the revolt
    mounted by supporters of her first husband, Yuri Bogolyubsky. The palace served mainly as a winter
    residence: the Rioni lowland is mild, and the surrounding forest was royal hunting ground.


    To be honest about it: the dome is long gone. What survives is massive brickwork standing two or three
    metres high, the hearth recess, the springing of vaults and the outline of the plan. Glass information
    panels installed in 2016 carry drawings of the original building, and they are what make the scale
    intelligible.


    Come if you are interested in the history of architecture, or if you are driving from Kutaisi to Tskaltubo
    and have half an hour. There is no fence, no ticket, and almost never another visitor.


    The building technique deserves a look in its own right. Geguti is brick, not the dressed stone of
    Georgian churches, laid in thin courses with wide mortar beds. That was the language of palaces and
    bath houses rather than of religious architecture, and almost nothing of it survives elsewhere in
    Georgia. Brick also weathers faster than stone, so the ruin loses definition from decade to decade,
    which is part of why the glass panels were installed in 2016.
  tip: >-
    Half an hour to an hour. In summer the grass is high and there are ticks, so long trousers are sensible
    and open shoes are not. You can climb on the ruins, but the brickwork is friable and the edges are
    broken. There is almost no shade and the midday sun is punishing; early or late is better. Toilets,
    a shop and a cafe exist only in the village, a kilometre away. Information boards are in Georgian
    and English and nothing else, so read up beforehand.
  route: >-
    Follow the E60 west towards Kutaisi and turn south shortly before the city, in the direction of Vartsikhe
    and Baghdati — about 225 km in total, three hours fifteen. In Geguti village a sign takes you off
    the asphalt; the last two hundred metres are gravel, easy in a normal car in dry weather but deeply
    puddled after rain. You park on the grass beside the ruins. Refuel in Kutaisi. An economy car is enough
    unless the track is waterlogged.
ru:
  name: Дворец Гегути
  short: >-
    Руины царского дворца на Рионской равнине к югу от Кутаиси — одно из крупнейших светских зданий средневековой
    Грузии.
  body: >-
    **Гегути — место, где грузинские цари жили тогда, когда не строили соборы.** Руины стоят километрах
    в семи южнее Кутаиси, на ровной Рионской равнине: невысокие кирпичные стены в высокой траве у кромки
    леса.


    Древнейшее ядро — VIII–IX веков: одно помещение с большим камином. Основной комплекс возвели при Георгии
    III (1156–1184), и по масштабу он исключителен: крестообразный центральный зал с куполом четырнадцати
    метров в диаметре на тромпах, поставленный на каменный стилобат высотой три метра. Всего постройка
    занимала больше двух тысяч квадратных метров. В XIII–XIV веках добавились новые корпуса и дворцовая
    церковь.


    Царица Тамар использовала Гегути как место отдыха, а в 1191 году дворец стал одним из узлов мятежа,
    поднятого сторонниками её первого мужа Юрия Боголюбского. В основном он служил зимней резиденцией:
    Рионская низина мягкая по климату, а окрестный лес был царским охотничьим угодьем.


    Скажем честно: купола давно нет. Сохранились массивная кирпичная кладка на два-три метра, ниша очага,
    пяты сводов и контур плана. В 2016 году поставили стеклянные панели с прорисовкой первоначального
    облика — именно они делают масштаб понятным.


    Ехать стоит, если вам интересна история архитектуры или если вы едете из Кутаиси в Цхалтубо и есть
    полчаса. Ограды нет, билета нет, других посетителей почти никогда.


    Отдельного взгляда заслуживает строительная техника. Гегути сложен из кирпича, а не из тёсаного камня
    грузинских храмов, тонкими рядами с широкими швами раствора. Это был язык дворцов и бань, а не церковной
    архитектуры, и почти нигде больше в Грузии он не сохранился. Кирпич к тому же выветривается быстрее
    камня, так что руина теряет очертания от десятилетия к десятилетию, — отчасти поэтому в 2016 году
    и поставили стеклянные панели.
  tip: >-
    От получаса до часа. Летом трава высокая и есть клещи, так что длинные брюки разумны, а открытая обувь
    нет. На руины можно залезть, но кирпич крошится, а края обвалены. Тени почти нет, полуденное солнце
    тяжёлое — лучше утро или вечер. Туалет, магазин и кафе есть только в селе, в километре. Информационные
    щиты на грузинском и английском и больше ни на каких, так что почитайте заранее.
  route: >-
    По E60 на запад в сторону Кутаиси, незадолго до города свернуть на юг, в направлении Варцихе и Багдати
    — всего около 225 км, три часа пятнадцать минут. В селе Гегути указатель уводит с асфальта; последние
    двести метров — гравий, в сухую погоду проезжий на обычной машине, после дождя с глубокими лужами.
    Паркуются прямо на траве у руин. Заправиться лучше в Кутаиси. Машины эконом-класса достаточно, если
    грунтовка не размыта.
fa:
  name: کاخ گگوتی
  short: ویرانه‌های کاخی سلطنتی در دشت ریونی جنوب کوتایسی — از بزرگ‌ترین بناهای غیردینی گرجستان در قرون
    میانه.
  body: >-
    **گگوتی جایی است که پادشاهان گرجستان وقتی کلیسا نمی‌ساختند در آن زندگی می‌کردند.** ویرانه‌ها حدود
    هفت کیلومتری جنوب کوتایسی در دشت هموار ریونی ایستاده‌اند: دیوارهای کوتاه آجری در علفزار، کنار جنگل.


    کهن‌ترین هسته از سدهٔ هشتم یا نهم است؛ اتاقی یگانه با بخاری دیواری بزرگ. مجموعهٔ اصلی در روزگار گئورگی
    سوم (۱۱۵۶–۱۱۸۴) برپا شد و در مقیاس خود کم‌نظیر بود: تالاری مرکزی با نقشهٔ صلیبی که گنبدی به قطر چهارده
    متر بر فیلپوش‌ها بر آن نشسته بود، روی سکویی سنگی به بلندی سه متر. کل بنا بیش از دو هزار متر مربع را
    می‌پوشاند. در سده‌های سیزدهم و چهاردهم بال‌های تازه و کلیسای کاخ افزوده شد.


    ملکه تامار گگوتی را برای آسودن به کار می‌برد، و در ۱۱۹۱ این کاخ یکی از کانون‌های شورش هواداران شوهر
    نخست او، یوری بوگولیوبسکی، شد. کاخ بیشتر اقامتگاه زمستانی بود: پست‌دشت ریونی معتدل است و جنگل پیرامون
    شکارگاه شاهی بود.


    صادقانه بگوییم: گنبد دیرزمانی است رفته. آنچه مانده آجرکاری سنگین به بلندی دو سه متر است، گودی اجاق،
    پاشنهٔ طاق‌ها و خط نقشه. در ۲۰۱۶ صفحه‌های شیشه‌ای با طرح بنای اصلی نصب شد و همین‌هاست که مقیاس را
    قابل درک می‌کند.


    اگر به تاریخ معماری علاقه دارید یا از کوتایسی به تسکالتوبو می‌روید و نیم ساعت وقت دارید بیایید. نه
    حصاری هست، نه بلیتی، و تقریباً هرگز بازدیدکنندهٔ دیگری.


    شیوهٔ ساخت خودش دیدنی است. گگوتی از آجر ساخته شده نه از سنگ تراشیدهٔ کلیساهای گرجی، با رگ‌های نازک
    و بندهای پهن ملات. این زبان کاخ‌ها و گرمابه‌ها بود نه معماری دینی، و تقریباً هیچ نمونهٔ دیگری از آن
    در گرجستان نمانده است. آجر هم تندتر از سنگ فرسوده می‌شود، پس ویرانه دهه به دهه خطوطش را از دست می‌دهد؛
    و همین بخشی از دلیل نصب صفحه‌های شیشه‌ای در ۲۰۱۶ بود.
  tip: >-
    نیم ساعت تا یک ساعت. تابستان علف بلند است و کنه هست، پس شلوار بلند عاقلانه است و کفش باز نه. می‌توان
    از ویرانه‌ها بالا رفت، اما آجر پوسیده و لبه‌ها ریخته است. سایه تقریباً وجود ندارد و آفتاب ظهر آزاردهنده
    است؛ صبح زود یا پایان روز بهتر است. سرویس بهداشتی و مغازه و کافه فقط در روستا و یک کیلومتر آن‌سوترند.
    تابلوهای اطلاعات فقط گرجی و انگلیسی‌اند، پس از پیش بخوانید.
  route: >-
    بزرگراه E60 را به غرب و به سوی کوتایسی بگیرید و کمی پیش از شهر به جنوب، در جهت وارتسیخه و باغداتی،
    بپیچید — روی‌هم حدود ۲۲۵ کیلومتر و سه ساعت و ربع. در روستای گگوتی تابلویی شما را از آسفالت بیرون می‌برد؛
    دویست متر آخر شنی است و در هوای خشک با خودروی معمولی بی‌دردسر، اما پس از باران گودال‌های عمیق دارد.
    خودرو را روی چمن کنار ویرانه‌ها می‌گذارید. سوخت را در کوتایسی بگیرید.
he:
  name: ארמון גגוטי
  short: חורבות ארמון מלכותי במישור הריוני מדרום לקוטאיסי — מן המבנים החילוניים הגדולים של גאורגיה בימי
    הביניים.
  body: >-
    **בגגוטי חיו מלכי גאורגיה כשלא בנו קתדרלות.** החורבות עומדות כשבעה קילומטרים מדרום לקוטאיסי, במישור
    הריוני השטוח: חומות לבנים נמוכות בעשב גבוה בשולי היער.


    הגרעין העתיק ביותר הוא מן המאה ה-8 או ה-9 — חדר יחיד ובו אח גדולה. המכלול המרכזי הוקם בימי גיאורגי
    השלישי (1156–1184) והיה יוצא דופן בקנה מידתו: אולם מרכזי צלבי שנשא כיפה בקוטר ארבעה־עשר מטרים על טרומפים,
    על אדן אבן בגובה שלושה מטרים. בסך הכול השתרע המבנה על יותר מאלפיים מטרים רבועים. במאות ה-13 וה-14
    נוספו אגפים וכנסיית ארמון.


    המלכה תמר נהגה לנוח בגגוטי, וב-1191 הפך הארמון לאחד ממוקדי המרד של תומכי בעלה הראשון, יורי בוגוליובסקי.
    בעיקר שימש כמשכן חורף: שפלת הריוני ממוזגת, והיער סביב היה שטח ציד מלכותי.


    ובכנות: הכיפה איננה מזמן. מה ששרד הוא בנייה מסיבית בלבנים בגובה שניים-שלושה מטרים, גומחת האח, בסיסי
    הקמרונות וקו המתאר של התוכנית. ב-2016 הוצבו לוחות זכוכית ועליהם שרטוט המבנה המקורי, והם שהופכים את
    קנה המידה למובן.


    כדאי לבוא אם מעניינת אתכם היסטוריה של אדריכלות, או אם אתם נוסעים מקוטאיסי לצחלטובו ויש חצי שעה. אין
    גדר, אין כרטיס וכמעט לעולם אין מבקר נוסף.


    שיטת הבנייה ראויה למבט בפני עצמה. גגוטי בנוי לבנים ולא באבן מסותתת כמו כנסיות גאורגיה, בנדבכים דקים
    ובמישקי טיט רחבים. זו הייתה שפתם של ארמונות ובתי מרחץ ולא של אדריכלות דתית, וכמעט לא נותר ממנה דבר
    במקום אחר בגאורגיה. הלבנים גם נשחקות מהר יותר מאבן, ולכן החורבה מאבדת צורה מעשור לעשור — וזה חלק מן
    הסיבה להצבת לוחות הזכוכית ב-2016.
  tip: >-
    חצי שעה עד שעה. בקיץ העשב גבוה ויש קרציות, לכן מכנסיים ארוכים הגיוניים ונעליים פתוחות לא. אפשר לטפס
    על החורבות, אך הלבנים מתפוררות והשוליים שבורים. כמעט אין צל ושמש הצהריים קשה — עדיף בוקר או ערב. שירותים,
    חנות ובית קפה קיימים רק בכפר, קילומטר משם. שלטי ההסבר בגאורגית ובאנגלית בלבד, לכן קראו מראש.
  route: >-
    נוסעים בכביש E60 מערבה לכיוון קוטאיסי ופונים דרומה מעט לפני העיר, לכיוון וארציחה ובגדאטי — כ-225 ק״מ
    בסך הכול, שלוש שעות ורבע. בכפר גגוטי שלט מוריד אתכם מן האספלט; מאתיים המטרים האחרונים חצץ, נוחים ברכב
    רגיל בימים יבשים אך מלאי שלוליות עמוקות אחרי גשם. חונים על הדשא ליד החורבות. תדלקו בקוטאיסי. רכב חסכוני
    מספיק כל עוד הדרך אינה מוצפת.
ar:
  name: قصر غيغوتي
  short: أطلال قصر ملكي في سهل ريوني جنوب كوتايسي — من أكبر المباني المدنية في جورجيا الوسيطة.
  body: >-
    **في غيغوتي كان ملوك جورجيا يقيمون حين لا يبنون الكاتدرائيات.** تقوم الأطلال على بعد نحو سبعة كيلومترات
    جنوب كوتايسي في سهل ريوني المستوي: جدران آجرية منخفضة وسط عشب كثيف عند حافة الغابة.


    أقدم نواة تعود إلى القرن الثامن أو التاسع: غرفة واحدة بموقد كبير. أما المجمع الرئيسي فشُيّد في عهد
    غيورغي الثالث (1156–1184) وكان استثنائياً في حجمه: قاعة مركزية صليبية تحمل قبة قطرها أربعة عشر متراً
    على مقرنصات ركنية، فوق قاعدة حجرية بارتفاع ثلاثة أمتار. وكان البناء كله يغطي أكثر من ألفي متر مربع.
    وفي القرنين الثالث عشر والرابع عشر أُضيفت أجنحة وكنيسة للقصر.


    كانت الملكة تامار تتخذ غيغوتي مكاناً للراحة، وفي 1191 صار القصر أحد بؤر التمرد الذي قاده أنصار زوجها
    الأول يوري بوغوليوبسكي. وقد استُعمل أساساً مقراً شتوياً: فسهل ريوني معتدل، والغابة المحيطة كانت أرض
    صيد ملكية.


    ولنكن صريحين: القبة زالت منذ زمن بعيد. ما بقي بناء آجري ضخم بارتفاع مترين أو ثلاثة، وتجويف الموقد،
    ومنابت الأقبية، وخط المسقط. وفي 2016 وُضعت ألواح زجاجية عليها رسوم للبناء الأصلي، وهي التي تجعل الحجم
    مفهوماً.


    تعال إن كنت مهتماً بتاريخ العمارة، أو إن كنت متجهاً من كوتايسي إلى تسخالتوبو ولديك نصف ساعة. لا سياج
    ولا تذكرة، ونادراً جداً أن تجد زائراً آخر.


    تستحق تقنية البناء نظرة مستقلة. غيغوتي مبني بالآجر لا بالحجر المنحوت المألوف في كنائس جورجيا، بمداميك
    رفيعة ومفاصل ملاط عريضة. كانت تلك لغة القصور والحمامات لا لغة العمارة الدينية، ولم يبقَ منها شيء يُذكر
    في مكان آخر من جورجيا. والآجر يتآكل أسرع من الحجر، فتفقد الأطلال ملامحها من عقد إلى عقد، وهذا جزء
    من سبب تركيب الألواح الزجاجية عام 2016.
  tip: >-
    من نصف ساعة إلى ساعة. في الصيف يعلو العشب وتكثر القرادات، فالسراويل الطويلة معقولة والأحذية المفتوحة
    لا. يمكن الصعود على الأطلال، لكن الآجر متفتت والحواف مكسورة. لا ظل يُذكر وشمس الظهيرة قاسية، فالصباح
    أو المساء أفضل. دورات المياه والمتجر والمقهى في القرية فقط على بعد كيلومتر. ولوحات المعلومات بالجورجية
    والإنجليزية لا غير، فاقرأ عن المكان مسبقاً.
  route: >-
    اسلك الطريق E60 غرباً نحو كوتايسي ثم انعطف جنوباً قبل المدينة بقليل باتجاه فارتسيخه وباغداتي — نحو
    225 كم إجمالاً وثلاث ساعات وربع. في قرية غيغوتي تُخرجك لافتة عن الإسفلت؛ والمئتا متر الأخيرة حصى،
    سهلة بسيارة عادية في الجو الجاف لكنها مليئة بالبرك بعد المطر. تقف بالسيارة على العشب بجانب الأطلال.
    تزوّد بالوقود في كوتايسي. وتكفي سيارة اقتصادية ما لم يكن الدرب مغموراً.
