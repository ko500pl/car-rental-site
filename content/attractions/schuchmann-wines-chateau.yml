ka:
  name: შუხმანის ღვინის შატო
  short: >-
    2008 წელს თელავთან დაარსებული გერმანულ-ქართული მარანი: ქვევრისა და ევროპული წესით დაყენებული ღვინოები
    სამი კახური აპელასიონიდან, სპა-სასტუმროს გვერდით.
  body: >-
    **ბურკჰარდ შუხმანმა საქართველო პირველად სტუდენტობისას ნახა; ათწლეულების შემდეგ, როცა გერმანულ მრეწველობაში
    კარიერა დაასრულა, დაბრუნდა და კისისხევში მარანი დააარსა.**


    ეს 2008 წელს მოხდა. შუხმანი თითქმის ოცი წლის განმავლობაში გერმანულ სარკინიგზო-საინჟინრო ჯგუფ „ფოსლოს“
    ხელმძღვანელობდა და კახეთში დიდი მასშტაბით შენების ჩვევაც თან ჩამოიტანა. მამული თელავთან ახლოს, წინანდლის
    აპელასიონის ფარგლებშია, ყურძენს კი კახეთის სამი დაცული ზონის — წინანდლის, ნაფარეულისა და ქინძმარაულის
    — ვენახებიდან იღებს. თავად შუხმანი ამ წამოწყებას თავისი ცხოვრების საუკეთესო გადაწყვეტილებას უწოდებს.


    ღვინო კი ქართველების ხელშია. მთავარი ენოლოგი გიორგი დაკიშვილი მეღვინეთა ოჯახის მესამე თაობაა, მარანი
    კი ქართული ღვინის ორივე ენაზე ლაპარაკობს: ღვინო აქ ქვევრშიც დგება — მიწაში ჩაფლულ დიდ თიხის ჭურჭელში
    — და ევროპული წესითაც. მთავარი აქცენტი ადგილობრივ ჯიშებზეა — საფერავზე, რქაწითელზე, ქისსა და მწვანეზე;
    მათ გვერდით კაბერნე სოვინიონი, შარდონე და რისლინგია, ასევე ცქრიალა ღვინო და მუხაში დავარგებული ჭაჭა.


    მარნის ირგვლივ მთელი შატო გაიზარდა: სასტუმრო ვილები, რესტორანი, გათბობადი აუზი და სპა, რომლის პროცედურებიც
    ღვინოს ეფუძნება. ყველაფერი აქ გაპრიალებული, კომფორტული და თავიდან ბოლომდე თანამედროვეა.


    ქართული ღვინის ისტორია რვა ათას წელს ითვლის; ამ მარანს ოცი წელიც არ შესრულებია და ამას არც მალავს.
    ქვევრის ღვინო ევროპული წესით დაყენებულის გვერდით დააგემოვნეთ და მთელ ამ ჩანაფიქრს ორ ჭიქაში ამოიკითხავთ.
  tip: >-
    პირდაპირ ნუ მიადგებით. ტურების ხელმისაწვდომობა ბოლო დროს არასტაბილური იყო, ამიტომ გასვლამდე შატოს
    დაურეკეთ ან მისწერეთ და დააზუსტეთ, რა ხერხდება; დეგუსტაციის ფასებს ადგილზე გეტყვიან. მარნისა და დეგუსტაციისთვის
    ორი საათი გამოყავით, სადილით — მეტი. პირველ ჭიქამდე გადაწყვიტეთ, ვინ დაჯდება საჭესთან: საქართველოში
    ნასვამ მდგომარეობაში მართვისთვის მკაცრად სჯიან, გზაზე შემოწმებაც ხდება. თუ თავის შეკავება არავის სურს,
    ღამე ერთ-ერთ ვილაში გაათიეთ. წინანდლის მამული 2,4 კილომეტრშია და ერთ დღეში იოლად ეთავსება.
  route: >-
    თბილისიდან ს5-ით (კახეთის გზატკეცილი) აღმოსავლეთით იარეთ, ვაზიანთან შ38-ზე გადაუხვიეთ და გომბორის
    უღელტეხილით თელავამდე გადადით — დაახლოებით 95 კილომეტრი. კისისხევი თელავიდან წინანდლისკენ მიმავალ
    გზაზე, რამდენიმე კილომეტრშია. სულ დაახლოებით 100 კილომეტრი და საათი და ორმოცდაათი წუთი, მთელ გზაზე
    ასფალტი, შატოში კი საკუთარი ავტოსადგომია. ეკონომკლასის მანქანა სავსებით საკმარისია; საწვავი თელავში
    ჩაასხით. თუ ზამთარში გომბორს თოვლი ჩაკეტავს, ს5-ით საგარეჯოსა და გურჯაანის გავლით იარეთ — ეს დაახლოებით
    35 კილომეტრს დაამატებს.
en:
  name: Schuchmann Wines Château
  short: >-
    A German-Georgian winery founded near Telavi in 2008, pouring qvevri and European-style wines from
    three Kakhetian appellations beside a spa hotel.
  body: >-
    **Burkhard Schuchmann first saw Georgia as a student; decades later, at the end of a career in German
    industry, he came back and founded a winery in Kisiskhevi.**


    That was in 2008. For almost twenty years Schuchmann had run the German rail-engineering group Vossloh,
    and he brought to Kakheti the habits of a man used to building on a large scale. The estate lies just
    outside Telavi, within the Tsinandali appellation, and draws its grapes from vineyards in three of
    Kakheti's protected zones: Tsinandali, Napareuli and Kindzmarauli. Schuchmann himself calls the venture
    the best decision of his life.


    The wine is in Georgian hands. The chief oenologist, Giorgi Dakishvili, is the third generation of
    a winemaking family, and the cellar speaks both languages of Georgian wine: some of it is fermented
    in qvevri, the great clay jars buried in the ground, and some made the European way. The focus is
    on native varieties — Saperavi, Rkatsiteli, Kisi, Mtsvane — with Cabernet Sauvignon, Chardonnay and
    Riesling alongside, plus sparkling wine and oak-aged chacha.


    Around the cellar a complete château has grown up: guest villas, a restaurant, a heated pool and a
    spa whose treatments are built on wine. Everything is polished, comfortable and thoroughly modern.


    Georgian wine counts its history in eight thousand years; this cellar has not yet reached twenty,
    and it does not pretend otherwise. Taste a qvevri wine beside one made the European way and you will
    read the whole project in two glasses.
  tip: >-
    Do not simply turn up. Tour availability has been patchy lately, so call or email the château before
    setting out and confirm what is running; tasting prices are given on site. Allow about two hours for
    the cellar and a tasting, more if you stay to eat. Decide who is driving before the first glass: Georgian
    police take drink-driving seriously, and roadside checks do happen. If nobody wants to abstain, book
    one of the villas for the night. Tsinandali Estate is 2.4 km away and pairs easily in a single day.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) east, branch onto the Sh38 near Vaziani and cross the Gombori
    Pass to Telavi, about 95 km. Kisiskhevi lies a few kilometres further on, along the road towards Tsinandali.
    That makes about 100 km and roughly an hour and fifty minutes, on asphalt all the way, with parking
    at the château. An economy car is perfectly adequate; fill up in Telavi. If snow closes the Gombori
    Pass in winter, stay on the S5 through Sagarejo and Gurjaani instead, which adds roughly 35 km.
ru:
  name: Шато Шухман
  short: >-
    Немецко-грузинская винодельня под Телави (2008): вина из квеври и европейские вина из трёх кахетинских
    апелласьонов, рядом — спа-отель.
  body: >-
    **Буркхард Шухман впервые увидел Грузию студентом; десятилетия спустя, на исходе карьеры в немецкой
    промышленности, он вернулся сюда и основал винодельню в Кисисхеви.**


    Это было в 2008 году. Почти двадцать лет Шухман руководил немецкой железнодорожно-машиностроительной
    группой «Фосслох» и привёз в Кахети повадки человека, который привык строить с размахом. Поместье
    лежит сразу за Телави, в границах апелласьона Цинандали, а виноград берёт с виноградников в трёх охраняемых
    зонах происхождения Кахети: Цинандали, Напареули и Киндзмараули. Сам Шухман называет эту затею лучшим
    решением в своей жизни.


    А вот вино — в грузинских руках. Главный энолог Гиорги Дакишвили — третье поколение винодельческой
    семьи, и погреб говорит на обоих языках грузинского вина: часть вина бродит в квеври, огромных глиняных
    кувшинах, зарытых в землю, часть делается по-европейски. Главное здесь — местные сорта: саперави,
    ркацители, киси, мцване; рядом с ними каберне совиньон, шардоне и рислинг, а ещё игристое и выдержанная
    в дубе чача.


    Вокруг погреба выросло настоящее шато: гостевые виллы, ресторан, бассейн с подогревом и спа, где процедуры
    построены на вине. Всё отполировано, удобно и совершенно современно.


    Грузинское вино ведёт счёт своей истории на восемь тысяч лет; этому погребу нет ещё и двадцати, и
    он не притворяется старше. Попробуйте вино из квеври рядом с вином, сделанным по-европейски, — и весь
    замысел прочтётся в двух бокалах.
  tip: >-
    Не приезжайте наудачу. С экскурсиями в последнее время бывает по-разному, поэтому перед выездом позвоните
    или напишите в шато и уточните, что сейчас проводится; цены на дегустации называют на месте. На погреб
    и дегустацию заложите около двух часов, больше — если останетесь обедать. Решите, кто за рулём, до
    первого бокала: грузинская полиция строга к вождению в нетрезвом виде, а проверки на дорогах случаются.
    Если воздерживаться не хочет никто, забронируйте на ночь одну из вилл. Усадьба Цинандали — в 2,4 км,
    и её легко совместить с шато в один день.
  route: >-
    Из Тбилиси поезжайте на восток по Кахетинскому шоссе (S5), у Вазиани сверните на Sh38 и через Гомборский
    перевал доберитесь до Телави — около 95 км. Кисисхеви — ещё в нескольких километрах, по дороге на
    Цинандали. Всего выходит около 100 км и примерно час пятьдесят, по асфальту на всём пути; у шато есть
    парковка. Машины эконом-класса вполне достаточно; заправьтесь в Телави. Если зимой снег закроет Гомборский
    перевал, оставайтесь на S5 и езжайте через Сагареджо и Гурджаани — это добавит около 35 км.
fa:
  name: شاتوی شوخمان
  short: >-
    شراب‌سازی‌ای آلمانی‌ـ‌گرجی که در ۲۰۰۸ نزدیک تلاوی بنیاد شد و کنار هتلی با اسپا، شراب‌های کوِوری و
    اروپایی از سه خاستگاه ثبت‌شدهٔ کاختی در جام می‌ریزد.
  body: >-
    **بورکهارد شوخمان نخستین بار در دوران دانشجویی گرجستان را دید؛ دهه‌ها بعد، در پایان کارنامه‌ای در
    صنعت آلمان، بازگشت و در کیسیسخوی شراب‌سازی‌ای بنیاد نهاد.**


    این در سال ۲۰۰۸ بود. شوخمان نزدیک به بیست سال گروه آلمانی مهندسی راه‌آهن «فوسلو» را اداره کرده بود
    و خوی مردی را که به ساختن در مقیاس بزرگ عادت داشت با خود به کاختی آورد. این ملک درست بیرون تلاوی،
    در محدودهٔ خاستگاه تسیناندالی، قرار دارد و انگورش را از تاکستان‌هایی در سه منطقهٔ خاستگاهِ حفاظت‌شدهٔ
    کاختی می‌گیرد: تسیناندالی، ناپارئولی و کیندزمارائولی. خود شوخمان این کار را بهترین تصمیم زندگی‌اش
    می‌داند.


    اما شراب در دست گرجی‌هاست. سرشراب‌ساز، گیورگی داکیشویلی، نسل سوم خاندانی شراب‌ساز است، و سرداب به
    هر دو زبان شراب گرجی سخن می‌گوید: بخشی از شراب در کوِوری — خمره‌های بزرگ سفالی که در خاک دفن می‌شوند
    — تخمیر می‌شود و بخشی به شیوهٔ اروپایی ساخته می‌شود. تکیه بر انگورهای بومی است — ساپراوی، رکاتسیتلی،
    کیسی، متسوانه — و در کنارشان کابرنه سووینیون، شاردونه و ریسلینگ، به‌علاوهٔ شراب گازدار و چاچای کهنه‌شده
    در چوب بلوط.


    گرداگرد سرداب شاتویی کامل سر برآورده است: ویلاهای مهمان، رستوران، استخر با آب گرم‌شده و اسپایی که
    درمان‌هایش بر پایهٔ شراب است. همه‌چیز آراسته، راحت و یکسره امروزی است.


    شراب گرجی تاریخ خود را با هشت هزار سال می‌شمارد؛ این سرداب هنوز به بیست سالگی نرسیده است و وانمود
    هم نمی‌کند که رسیده. شرابی کوِوری را کنار شرابی که به شیوهٔ اروپایی ساخته شده بچشید تا کل این طرح
    را در دو جام بخوانید.
  tip: >-
    سرزده نروید. برگزاری تورها این اواخر نامنظم بوده است، پس پیش از راه افتادن به شاتو زنگ بزنید یا ایمیل
    بفرستید و بپرسید چه برنامه‌ای برقرار است؛ قیمت چشیدن شراب در محل اعلام می‌شود. برای سرداب و چشیدن
    حدود دو ساعت کنار بگذارید، و اگر برای غذا بمانید بیشتر. پیش از نخستین جام معلوم کنید چه کسی رانندگی
    می‌کند: پلیس گرجستان با رانندگی در حال مستی سخت‌گیر است و بازرسی در جاده‌ها هم پیش می‌آید. اگر کسی
    حاضر نیست لب به شراب نزند، یکی از ویلاها را برای شب رزرو کنید. ملک تسیناندالی ۲٫۴ کیلومتر آن‌سوتر
    است و به‌آسانی در یک روز با این شاتو جفت می‌شود.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق بگیرید، نزدیک وازیانی به Sh38 بپیچید و از گردنهٔ گومبوری
    بگذرید تا به تلاوی برسید؛ حدود ۹۵ کیلومتر. کیسیسخوی چند کیلومتر جلوتر است، در جاده‌ای که به تسیناندالی
    می‌رود. روی هم حدود ۱۰۰ کیلومتر و تقریباً یک ساعت و پنجاه دقیقه، سراسر آسفالت، با پارکینگ در خود شاتو.
    خودروی اقتصادی کاملاً کافی است؛ در تلاوی باک را پر کنید. اگر در زمستان برف گردنهٔ گومبوری را ببندد،
    روی S5 بمانید و از ساگارجو و گورجانی بروید؛ این راه حدود ۳۵ کیلومتر بیشتر است.
he:
  name: שאטו שוכמן
  short: >-
    יקב גרמני-גאורגי שנוסד ליד טלאווי ב-2008, ומוזג יינות קווברי ויינות בסגנון אירופי משלושה אזורי מוצא
    בקאחתי, לצד מלון ספא.
  body: >-
    **בורקהרד שוכמן ראה את גאורגיה לראשונה כסטודנט; עשרות שנים אחר כך, בסוף קריירה בתעשייה הגרמנית, חזר
    והקים יקב בקיסיסחווי.**


    זה היה ב-2008. במשך כמעט עשרים שנה עמד שוכמן בראש קבוצת הנדסת הרכבות הגרמנית פוסלו, והביא איתו לקאחתי
    את ההרגלים של אדם שרגיל לבנות בגדול. האחוזה שוכנת ממש מחוץ לטלאווי, בתחום אזור המוצא צינאנדלי, והענבים
    שלה באים מכרמים בשלושה מאזורי המוצא המוגנים של קאחתי: צינאנדלי, נפראולי וקינדזמראולי. שוכמן עצמו מכנה
    את המיזם ההחלטה הטובה ביותר בחייו.


    היין עצמו נמצא בידיים גאורגיות. היינן הראשי, גיורגי דקישווילי, הוא בן הדור השלישי במשפחה שעוסקת בייצור
    יין, והמרתף מדבר בשתי השפות של היין הגאורגי: חלק מהיין מותסס בקווברי, כדי חרס ענקיים הקבורים באדמה,
    וחלק נעשה בדרך האירופית. הדגש הוא על זנים מקומיים — ספרבי, רקציטלי, קיסי, מצוואנה — ולצדם קברנה סוביניון,
    שרדונה וריזלינג, וגם יין מבעבע וצ'אצ'ה שיושנה בעץ אלון.


    סביב המרתף צמח שאטו שלם: וילות אירוח, מסעדה, בריכה מחוממת וספא שהטיפולים בו מבוססים על יין. הכול מלוטש,
    נוח ומודרני לגמרי.


    היין הגאורגי מונה את תולדותיו בשמונת אלפים שנה; המרתף הזה עוד לא הגיע לגיל עשרים, ואינו מעמיד פנים
    אחרת. טעמו יין קווברי לצד יין שנעשה בדרך האירופית, ותקראו את כל המיזם בשתי כוסות.
  tip: >-
    אל תגיעו סתם כך. הסיורים התקיימו לאחרונה באופן לא סדיר, לכן התקשרו או שלחו דוא"ל לשאטו לפני היציאה
    ובדקו מה פועל; מחירי הטעימות נמסרים במקום. הקצו כשעתיים למרתף ולטעימה, ויותר אם נשארים לאכול. החליטו
    מי נוהג לפני הכוס הראשונה: משטרת גאורגיה מחמירה עם נהיגה בשכרות, ובדיקות בכבישים אכן מתקיימות. אם
    אף אחד לא מוכן לוותר על היין, הזמינו אחת הווילות ללילה. אחוזת צינאנדלי נמצאת במרחק 2.4 ק"מ, וקל לשלב
    את שתיהן ביום אחד.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) מזרחה, פנו לכביש Sh38 סמוך לוואזיאני וחצו את מעבר גומבורי עד טלאווי,
    כ-95 ק"מ. קיסיסחווי נמצאת כמה קילומטרים הלאה, על הדרך לצינאנדלי. בסך הכול כ-100 ק"מ וכשעה וחמישים
    דקות, על אספלט לכל אורך הדרך, עם חניה בשאטו. רכב חסכוני מספיק בהחלט; תדלקו בטלאווי. אם שלג סוגר את
    מעבר גומבורי בחורף, הישארו על S5 ועברו דרך סגרג'ו וגורג'אני; זה מוסיף כ-35 ק"מ.
ar:
  name: شاتو شوخمان
  short: >-
    مصنع نبيذ ألماني جورجي تأسس قرب تيلافي عام 2008، يقدّم نبيذ الكفيفري والنبيذ على الطريقة الأوروبية
    من ثلاث مناطق تسمية منشأ في كاختي، إلى جوار فندق ومنتجع صحي.
  body: >-
    **رأى بوركهارد شوخمان جورجيا أول مرة وهو طالب؛ وبعد عقود، في ختام مسيرة مهنية في الصناعة الألمانية،
    عاد وأسّس مصنعًا للنبيذ في كيسيسخيفي.**


    كان ذلك عام 2008. طوال نحو عشرين عامًا أدار شوخمان مجموعة «فوسلوه» الألمانية لهندسة السكك الحديدية،
    وحمل معه إلى كاختي عادات رجل اعتاد البناء على نطاق واسع. تقع الضيعة خارج تيلافي مباشرة، ضمن منطقة
    تسمية المنشأ تسيناندالي، ويأتي عنبها من كروم في ثلاث من مناطق المنشأ المحمية في كاختي: تسيناندالي
    ونابارئولي وكيندزماراولي. ويصف شوخمان نفسه هذا المشروع بأنه أفضل قرار اتخذه في حياته.


    أما النبيذ ففي أيدٍ جورجية. كبير خبراء النبيذ، غيورغي داكيشفيلي، ابن الجيل الثالث في عائلة تصنع النبيذ،
    والقبو يتكلم لغتَي النبيذ الجورجي كلتيهما: جزء منه يُخمَّر في الكفيفري، تلك الجرار الفخارية الضخمة
    المدفونة في الأرض، وجزء يُصنع على الطريقة الأوروبية. ينصبّ التركيز على الأصناف المحلية — سابيرافي
    وركاتسيتيلي وكيسي ومتسفانه — وإلى جانبها كابرنيه سوفينيون وشاردونيه وريسلينغ، فضلًا عن نبيذ فوّار
    وتشاتشا معتّقة في خشب البلوط.


    وحول القبو نشأ شاتو متكامل: فيلات للضيوف، ومطعم، ومسبح مُدفّأ، ومنتجع صحي تقوم علاجاته على النبيذ.
    كل شيء مصقول ومريح وعصري تمامًا.


    يعدّ النبيذ الجورجي تاريخه بثمانية آلاف عام؛ أما هذا القبو فلم يبلغ العشرين بعد، ولا يدّعي غير ذلك.
    تذوّق نبيذ كفيفري إلى جانب نبيذ صُنع على الطريقة الأوروبية، وستقرأ المشروع كله في كأسين.
  tip: >-
    لا تأتِ دون تنسيق مسبق. كانت الجولات متقطعة في الآونة الأخيرة، فاتصل بالشاتو أو راسله بالبريد الإلكتروني
    قبل الانطلاق وتأكّد مما هو متاح؛ وأسعار التذوق تُعلن في المكان. خصّص نحو ساعتين للقبو والتذوق، وأكثر
    إن بقيت لتناول الطعام. اتفقوا على من سيقود قبل الكأس الأولى: فالشرطة الجورجية تتعامل بصرامة مع القيادة
    تحت تأثير الكحول، ونقاط التفتيش على الطرق واردة. وإن لم يرغب أحد في الامتناع، فاحجز إحدى الفيلات للمبيت.
    ضيعة تسيناندالي على بُعد 2.4 كم، ومن السهل الجمع بينهما في يوم واحد.
  route: >-
    من تبليسي خذ طريق كاختي السريع (S5) شرقًا، وانحرف إلى Sh38 قرب فازياني، واعبر ممر غومبوري إلى تيلافي،
    نحو 95 كم. وتقع كيسيسخيفي على بُعد بضعة كيلومترات أخرى، على الطريق المؤدي إلى تسيناندالي. يصبح المجموع
    نحو 100 كم وقرابة ساعة وخمسين دقيقة، على الأسفلت طوال الطريق، مع موقف للسيارات عند الشاتو. السيارة
    الاقتصادية كافية تمامًا؛ تزوّد بالوقود في تيلافي. وإذا أغلق الثلج ممر غومبوري شتاءً، فابقَ على S5
    عبر ساغاريجو وغورجاني بدلًا منه، وهذا يضيف نحو 35 كم.
