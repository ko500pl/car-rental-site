ka:
  name: გელათის მონასტერი
  short: >-
    დავით აღმაშენებლის მონასტერი და აკადემია ქუთაისთან: XII საუკუნის ოქროსფერი მოზაიკა, მეფეთა საძვალე
    და თავად მეფე, კარიბჭის ზღურბლქვეშ.
  body: >-
    **დავით აღმაშენებელი გელათში საკუთარი კარიბჭის ზღურბლქვეშ განისვენებს და, გადმოცემით, ასე თავად ინება:
    ყველა, ვინც შემოდის, მეფეს გადააბიჯებს.**


    მონასტერი დავითმა 1106 წელს დააარსა, წყალწითელას ხეობის თავზე, ქუთაისიდან თერთმეტ კილომეტრზე, ჩრდილო-აღმოსავლეთით.
    ქუთაისი მაშინ სამეფოს დედაქალაქი იყო. გელათი მხოლოდ სავანე არ უნდა ყოფილიყო, არამედ სასწავლებელიც.
    მეფემ აქ მეცნიერები შემოიკრიბა, მათ შორის ისინიც, ვინც უცხოეთის მონასტრებში, მაგალითად, კონსტანტინოპოლის
    მანგანაში მოღვაწეობდნენ. გელათში წერდა იოანე პეტრიწი პროკლეს განმარტებებს, აქ შეადგინა არსენ იყალთოელმა
    „დოგმატიკონი“. დავითის ისტორიკოსმა გელათს „ყოვლისა აღმოსავლეთისა მეორედ იერუსალიმად… სხუად ათინად“
    უწოდა, მოგვიანებით კი მას „ახალ ელადასა“ და „მეორე ათონსაც“ ეძახდნენ.


    ღვთისმშობლის მთავარი ტაძარი 1130 წელს, დავითის ძის, დემეტრე I-ის დროს დასრულდა. გარედან თლილი ქვა
    და დეკორატიული თაღედები თითქმის ჩუქურთმის გარეშეა, რადგან მთელი ძალა შიგნით არის თავმოყრილი. საკურთხევლის
    კონქში XII საუკუნის მოზაიკა, ყრმით ღვთისმშობელი მთავარანგელოზებს, მიქაელსა და გაბრიელს შორის, ნახევარბნელიდან
    ოქროსფრად ანათებს. ეს კავკასიაში შემორჩენილ შუა საუკუნეების მოზაიკათა შორის ერთ-ერთი უდიდესი და უმნიშვნელოვანესია.
    გარშემო კედლები XII–XVIII საუკუნეების მხატვრობით არის დაფარული, მათ შორის ჩრდილოეთ კედელზე იმერეთის
    სამეფო ოჯახის წევრები დავითის გამოსახულების გვერდით დგანან.


    ასევე ნახეთ:


    - განჯის კარი დავითის საფლავთან, რომელიც დემეტრე I-მა 1138 წელს ნადავლად ჩამოიტანა

    - XIII საუკუნის სამრეკლო, რომლის თაღებიანი ქვედა სართული წყაროზეა დაშენებული

    - აკადემიის დარბაზი კედლებს გაყოლებული ქვის დასაჯდომებით


    გელათი მეფეთა საძვალედ იქცა: აქ განისვენებენ დემეტრე I, გიორგი III, გიორგი V ბრწყინვალე და იმერეთის
    მეფეთა არაერთი თაობა, თამარის ისტორიკოსების ცნობით კი თავად თამარიც. 1994 წელს იუნესკომ გელათი მსოფლიო
    მემკვიდრეობის ნუსხაში შეიტანა.


    ცხრა საუკუნის შემდეგაც დავითის საფლავი თავის საქმეს აკეთებს: გელათში თვალდახრილი შედიხართ.
  tip: >-
    გელათი მოქმედი მონასტერია: ქალებს თავსაფარი და კაბა სჭირდებათ, კაცებს გრძელი შარვალი. გადასაფარებლებს
    კარიბჭესთან ჩვეულებრივ გაძლევენ. შესვლა უფასოა. საკურთხეველი აღმოსავლეთისკენაა მიქცეული, ამიტომ დილით
    მოდით, როცა სინათლე მოზაიკას ეცემა. ტაძრებში ივლისშიც გრილა, ამიტომ თბილი რამ წამოიღეთ. კომპლექსის
    ნაწილი შეიძლება ხარაჩოებში იყოს, რადგან კონსერვაცია აქ დღემდე გრძელდება და უშეცდომოდ არც ჩაუვლია.
    შიგნით ფოტოს გადაღებამდე ნებართვა ითხოვეთ, წირვის დროს კი ხმამაღლა ნუ ილაპარაკებთ. მოწამეთა 2,4 კილომეტრშია
    და იმავე დილას ადვილად მოასწრებთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით
    იარეთ ქუთაისამდე, დაახლოებით 220 კმ. ქალაქი გადაკვეთეთ და ტყიბულის გზას (შ17) დაადექით; ბოლო კილომეტრნახევარს
    მოკლე განშტოება (შ110) მონასტრის კარიბჭემდე აგიყვანთ. სულ დაახლოებით 240 კმ-ია და სამი საათი და ოცდაათი
    წუთი; გზა ბოლომდე ასფალტიანია, ბოლო მონაკვეთი ვიწრო, მაგრამ კარგ მდგომარეობაში. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია. საწვავი და ბანკომატები ქუთაისში ბევრია. მოწამეთას გადასახვევი იმავე გზაზეა, ქუთაისში
    ღამის გათევა კი დაბრუნების გრძელ დღეს ბევრად გაგიადვილებთ.
en:
  name: Gelati Monastery
  short: >-
    David the Builder's monastery and academy above Kutaisi: a gold 12th-century mosaic, a royal burial
    ground, and the king himself under the gate.
  body: >-
    **David the Builder lies beneath the threshold of his own gate at Gelati, and tradition says he wanted
    it so: every visitor who enters steps over the king.**


    He founded the monastery in 1106 on a hill above the Tskaltsitela gorge, eleven kilometres north-east
    of Kutaisi, which was then his capital. It was meant to be a school as well as a church. David gathered
    scholars here, some trained at monasteries abroad such as Mangana in Constantinople. Ioane Petritsi
    wrote his commentaries on Proclus at Gelati, and Arsen Ikaltoeli compiled his *Dogmatikon*. The king's
    chronicler called it 'a second Jerusalem of all the East … another Athens'; later writers added 'a
    new Hellas' and 'a second Athos'.


    The main Church of the Virgin was completed in 1130 under David's son Demetrius I. Outside, dressed
    stone and blind arcades carry almost no carving; the drama is kept for the interior. In the apse the
    12th-century mosaic of the Virgin and Child between the archangels Michael and Gabriel glows gold
    out of the half-dark. It is one of the largest and finest medieval mosaics in the Caucasus. Around
    it, painting from the 12th to the 18th century covers the walls, including a row of Imeretian royals
    beside a portrait of David.


    Look also for:


    - the Gates of Ganja by David's tomb, seized as a trophy by Demetrius I in 1138

    - the 13th-century bell tower, its arched ground floor built over a spring

    - the academy hall, with stone benches along the walls


    Gelati became a royal burial ground for Demetrius I, George III, George V the Brilliant and generations
    of Imeretian kings; Queen Tamar too, by her chroniclers' account. UNESCO inscribed it in 1994.


    Nine centuries on, David's grave still does its work: you enter Gelati with lowered eyes.
  tip: >-
    Gelati is a working monastery: women need a headscarf and a skirt, men long trousers, and wraps are
    usually lent at the gate. Entry is free. The apse faces east, so come in the morning, when light falls
    on the mosaic. The churches stay cool even in July, so bring a layer. Parts of the complex may be
    under scaffolding, because conservation here is ongoing and has had setbacks. Ask before photographing
    inside, and keep quiet during services. Motsameta Monastery is 2.4 km away and fits easily into the
    same morning.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri and over the Rikoti Pass to Kutaisi, about
    220 km. Cross the city and leave on the Sh17 towards Tkibuli; a short spur, the Sh110, climbs the
    last kilometre and a half to the monastery gate. In total it is about 240 km and three and a half
    hours, paved all the way, with the final stretch narrow but sound. An economy car is entirely adequate.
    Fuel and cash are plentiful in Kutaisi. The turning for Motsameta is on the same road, and a night
    in Kutaisi turns a long return day into an easy one.
ru:
  name: Монастырь Гелати
  short: >-
    Монастырь и академия Давида Строителя над Кутаиси: золотая мозаика XII века, царская усыпальница и
    сам царь под порогом ворот.
  body: >-
    **Давид Строитель лежит под порогом собственных ворот в Гелати, и, по преданию, он сам этого желал:
    каждый входящий переступает через царя.**


    Он основал монастырь в 1106 году на холме над ущельем Цхалцитела, в одиннадцати километрах северо-восточнее
    Кутаиси, тогдашней его столицы. Задуман он был не только как храм, но и как школа. Давид собрал здесь
    учёных, некоторые из которых учились за границей — в частности, в константинопольском монастыре Мангана.
    Иоанэ Петрици писал здесь свои комментарии к Проклу, а Арсен Икалтоели составил свой «Догматикон».
    Летописец царя назвал монастырь «вторым Иерусалимом всего Востока… другими Афинами»; позднейшие авторы
    добавили: «новая Эллада» и «второй Афон».


    Главный храм Богородицы был завершён в 1130 году при сыне Давида, Димитрии I. Снаружи тёсаный камень
    и глухие арки почти не украшены резьбой — весь драматизм оставлен для интерьера. В апсиде мозаика
    XII века с Богородицей и Младенцем между архангелами Михаилом и Гавриилом сияет золотом из полутьмы.
    Это одна из крупнейших и лучших средневековых мозаик Кавказа. Вокруг неё стены покрыты живописью XII–XVIII
    веков, включая ряд имеретинских царей рядом с портретом самого Давида.


    Обратите внимание также на:


    - Гянджинские ворота у гробницы Давида, захваченные Димитрием I в качестве трофея в 1138 году

    - колокольню XIII века, чей арочный первый этаж построен над источником

    - зал академии, с каменными скамьями вдоль стен


    Гелати стал усыпальницей Димитрия I, Георгия III, Георгия V Блистательного и поколений имеретинских
    царей; по свидетельству летописцев, здесь же похоронена и царица Тамар. В 1994 году ЮНЕСКО включило
    монастырь в список Всемирного наследия.


    Девять веков спустя могила Давида всё ещё делает своё дело: в Гелати входят, опустив глаза.
  tip: >-
    Гелати — действующий монастырь: женщинам нужен платок и юбка, мужчинам — длинные брюки, накидки обычно
    дают у ворот. Вход бесплатный. Апсида смотрит на восток, так что приходите утром, когда свет падает
    на мозаику. Храмы прохладны даже в июле, так что возьмите тёплую вещь. Часть комплекса может быть
    в лесах, потому что реставрация здесь продолжается и не раз давала сбои. Спрашивайте разрешения перед
    съёмкой внутри и соблюдайте тишину во время службы. Монастырь Моцамета находится в 2,4 км и легко
    вписывается в то же утро.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад через Гори и Хашури, через Рикотский перевал, до Кутаиси —
    около 220 км. Пересеките город и выезжайте по Sh17 в сторону Ткибули; короткий отвод, Sh110, ведёт
    последние полтора километра к воротам монастыря. Всего около 240 км и три с половиной часа, асфальт
    на всём пути, последний участок узкий, но в хорошем состоянии. Машины эконом-класса вполне достаточно.
    Топливо и наличные легко найти в Кутаиси. Поворот на Моцамета — на той же дороге, а ночёвка в Кутаиси
    превращает долгий обратный день в лёгкий.
fa:
  name: صومعهٔ گلاتی
  short: >-
    صومعه و آکادمی داوود سازنده، بالای کوتایسی: موزاییکی زرین از سدهٔ دوازدهم، آرامگاه شاهان، و خودِ پادشاه
    زیر آستانهٔ دروازه.
  body: >-
    **داوود سازنده زیر آستانهٔ دروازهٔ خودش در گلاتی آرام گرفته، و روایت است که خودش چنین خواسته بود:
    هر زائری که وارد می‌شود، از روی پادشاه گام برمی‌دارد.**


    او این صومعه را در سال ۱۱۰۶ بر فراز تنگهٔ تسکالتسیتلا، در یازده کیلومتری شمال شرقی کوتایسی — پایتخت
    آن زمانش — بنیاد نهاد. این‌جا قرار بود هم کلیسا باشد و هم مدرسه. داوود دانشمندانی را در این‌جا گرد
    آورد، برخی تربیت‌یافتهٔ صومعه‌هایی در خارج، چون مانگانا در قسطنطنیه. یووانه پتریتسی شرح‌های خود بر
    پروکلوس را در گلاتی نوشت، و آرسن ایکالتوئلی «دگماتیکون» خود را در همان‌جا گرد آورد. وقایع‌نگار پادشاه
    این‌جا را «اورشلیمی دیگر برای همهٔ مشرق… آتنی دیگر» نامید؛ نویسندگان متأخرتر «یونانِ نو» و «آتوسی
    دیگر» را نیز بر آن افزودند.


    کلیسای اصلیِ مریم مقدس در سال ۱۱۳۰ به دست دمتره اول، پسر داوود، به پایان رسید. در بیرون، سنگ تراش‌خورده
    و طاق‌نماهای کور تقریباً بدون هیچ حجاری‌اند؛ همهٔ نمایش برای درون نگه داشته شده است. در اَپسید، موزاییک
    سدهٔ دوازدهمِ مریم مقدس و کودک میان فرشتگان مقرب، میکائیل و جبرئیل، از میان نیمه‌تاریکی، زرین می‌درخشد.
    این یکی از بزرگ‌ترین و زیباترین موزاییک‌های قرون‌وسطایی قفقاز است. گرداگرد آن، نقاشی‌هایی از سدهٔ
    دوازدهم تا هجدهم دیوارها را پوشانده‌اند، از جمله ردیفی از شاهان ایمرتی در کنار تصویر خودِ داوود.


    به این‌ها نیز بنگرید:


    - دروازه‌های گنجه، نزدیک آرامگاه داوود، که دمتره اول در سال ۱۱۳۸ آن‌ها را چون غنیمتی به دست آورد

    - برج ناقوس سدهٔ سیزدهم، که طبقهٔ طاق‌دار زیرینش بر فراز چشمه‌ای ساخته شده

    - سالن آکادمی، با نیمکت‌های سنگی در کنار دیوارها


    گلاتی به آرامگاه شاهی دمتره اول، گئورگی سوم، گئورگی پنجم درخشان و نسل‌های شاهان ایمرتی بدل شد؛ و به
    روایت وقایع‌نگاران، ملکه تامار نیز در همین‌جا آرام گرفته است. یونسکو در سال ۱۹۹۴ آن را در فهرست میراث
    جهانی ثبت کرد.


    نه قرن پس از آن، آرامگاه داوود هنوز کار خود را می‌کند: به گلاتی که وارد می‌شوید، نگاهتان به زیر است.
  tip: >-
    گلاتی صومعه‌ای فعال است: زنان به روسری و دامن نیاز دارند، مردان به شلوار بلند، و معمولاً پارچه‌های
    پوششی دم دروازه به امانت داده می‌شود. ورود رایگان است. اَپسید رو به شرق است، پس صبح بیایید که نور
    بر موزاییک می‌افتد. کلیساها حتی در ژوئیه نیز خنک‌اند، پس لباسی گرم همراه داشته باشید. بخش‌هایی از
    مجموعه ممکن است زیر داربست باشد، چون بازسازی این‌جا همچنان ادامه دارد و بی‌مشکل نبوده. پیش از عکس
    گرفتن در درون اجازه بگیرید و در هنگام آیین‌ها آرام بمانید. صومعهٔ موتسامتا در ۲٫۴ کیلومتری است و به‌آسانی
    در همان صبح جای می‌گیرد.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب، از میان گوری و خاشوری و گذرگاه ریکوتی، تا کوتایسی در پیش بگیرید
    — حدود ۲۲۰ کیلومتر. از شهر عبور کنید و از راه Sh17 به سوی تکیبولی خارج شوید؛ انشعابی کوتاه، Sh110،
    آخرین یک‌ونیم کیلومتر را تا دروازهٔ صومعه بالا می‌رود. در مجموع حدود ۲۴۰ کیلومتر و سه ساعت و نیم است،
    همه‌جا آسفالت، با بخش پایانی باریک اما سالم. خودروی اکونومی کاملاً کافی است. سوخت و پول نقد در کوتایسی
    به‌فراوانی یافت می‌شود. تقاطع موتسامتا بر همان راه است، و یک شب ماندن در کوتایسی روز برگشتِ طولانی
    را به روزی آسان بدل می‌کند.
he:
  name: מנזר גלאתי
  short: 'מנזר ואקדמיה של דוד הבנאי מעל קוטאיסי: פסיפס זהב מהמאה ה-12, בית קברות מלכותי, והמלך עצמו מתחת
    לשער.'
  body: >-
    **דוד הבנאי טמון מתחת לסף שערו שלו בגלאתי, והמסורת מספרת שכך רצה: כל מבקר שנכנס פוסע מעל המלך.**


    הוא הקים את המנזר ב-1106 על גבעה מעל גיא צקלציטלה, אחת-עשרה ק"מ מצפון-מזרח לקוטאיסי, בירתו אז. הוא
    נועד להיות בית ספר ולא רק כנסייה. דוד קיבץ כאן חכמים, חלקם התחנכו במנזרים בחוץ לארץ, כגון מנגנה שבקונסטנטינופול.
    יואנה פטריצי כתב את פירושיו לפרוקלוס בגלאתי, וארסן איקלטואלי חיבר את "הדוגמטיקון" שלו. הכרוניקן של
    המלך קרא למקום "ירושלים שנייה לכל המזרח... אתונה נוספת"; סופרים מאוחרים יותר הוסיפו "הלס חדשה" ו"אתוס
    שנייה".


    כנסיית הבתולה המרכזית הושלמה ב-1130 בימי בנו של דוד, דמטרה הראשון. בחוץ, אבן מסותתת וארקדות עיוורות
    נושאות מעט מאוד עיטור; הדרמה נשמרת לפְנים. בקונכיית המזבח בוהק פסיפס המאה ה-12 של הבתולה והילד בין
    המלאכים הראשיים מיכאל וגבריאל בזהב מתוך החצי-אפלה. זהו אחד הפסיפסים הביניימיים הגדולים והמשובחים בקווקז.
    מסביבו מכסה ציור מהמאה ה-12 עד ה-18 את הקירות, ובהם שורת מלכי אימרתי לצד תמונת דוד עצמו.


    חפשו גם:


    - שערי גנג'ה, לצד קבר דוד, שנתפסו כשלל בידי דמטרה הראשון ב-1138

    - מגדל הפעמונים מהמאה ה-13, שקומת הקרקע המקושתת שלו נבנתה מעל מעיין

    - אולם האקדמיה, עם ספסלי אבן לאורך הקירות


    גלאתי הפך לבית קברות מלכותי לדמטרה הראשון, גיאורגי השלישי, גיאורגי החמישי המבריק ודורות של מלכי אימרתי;
    וגם המלכה תמר, כפי שהכרוניקנים מספרים. אונסק"ו הכליל אותו ב-1994 ברשימת אתרי המורשת העולמית.


    תשע מאות שנה אחר כך, קברו של דוד עדיין עושה את שלו: נכנסים לגלאתי במבט מושפל.
  tip: >-
    גלאתי הוא מנזר פעיל: נשים צריכות מטפחת ראש וחצאית, גברים מכנסיים ארוכים, ובשער משאילים לרוב כיסויים.
    הכניסה חינם. הקונכייה פונה מזרחה, אז בואו בבוקר, כשהאור נופל על הפסיפס. הכנסיות קרירות אפילו ביולי,
    אז הביאו שכבת לבוש חמה. חלקים מהמתחם עשויים להיות תחת פיגומים, כי השימור כאן נמשך ולא פעם נתקל בקשיים.
    בקשו רשות לפני צילום בפְנים ושמרו על שקט בזמן טקסים. מנזר מוצמטה נמצא 2.4 ק"מ משם ומשתלב בקלות באותו
    הבוקר.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי וחשורי, מעל מעבר ריקותי, עד קוטאיסי — כ-220 ק"מ. חצו את העיר
    וצאו ב-Sh17 לכיוון טקיבולי; ענף קצר, Sh110, מטפס את הקילומטר וחצי האחרונים לשער המנזר. בסך הכל כ-240
    ק"מ ושלוש וחצי שעות, אספלט כל הדרך, עם הקטע האחרון צר אך תקין. רכב חסכוני מספיק בהחלט. דלק ומזומן
    בשפע בקוטאיסי. הפנייה למוצמטה על אותו הכביש, ולינה בקוטאיסי הופכת יום חזרה ארוך ליום קל.
ar:
  name: دير غيلاتي
  short: >-
    دير وأكاديمية داود الباني فوق كوتايسي: فسيفساء ذهبية من القرن الثاني عشر، ومقبرة ملكية، والملك نفسه
    تحت عتبة البوابة.
  body: >-
    **يرقد داود الباني تحت عتبة بوابته في غيلاتي، وتقول التقاليد إنه أراد ذلك بنفسه: كل زائر يدخل يخطو
    فوق الملك.**


    أسس الدير عام 1106 على تلة فوق وادي تسكالتسيتيلا، على أحد عشر كيلومترًا شمال شرق كوتايسي، عاصمته في
    ذلك الحين. وكان يُراد له أن يكون مدرسة أيضًا لا كنيسة فقط. جمع داود هنا علماء، بعضهم تدرّب في أديرة
    خارج البلاد، مثل مانغانا في القسطنطينية. كتب يوآنه بتريتسي شروحه على بروكلوس في غيلاتي، وجمع أرسن
    إيكالتوئيلي "الدوغماتيكون" الخاص به. سمّاه مؤرخ الملك "أورشليم ثانية لكل الشرق... أثينا أخرى"؛ وأضاف
    كتّاب لاحقون "هيلاس جديدة" و"آثوس ثانية".


    اكتملت كنيسة العذراء الرئيسية عام 1130 في عهد ابن داود، ديمتري الأول. من الخارج، لا يحمل الحجر المشذّب
    والأقواس العمياء زخرفة تُذكر؛ فالدراما محفوظة للداخل. في الحنية تتلألأ فسيفساء القرن الثاني عشر للعذراء
    والطفل بين رئيسَي الملائكة ميخائيل وجبرائيل، ذهبية من العتمة الجزئية. وهي من أكبر فسيفساء العصور الوسطى
    وأجملها في القوقاز. وحولها تغطي الجدران رسوم من القرن الثاني عشر إلى الثامن عشر، منها صف من ملوك إيميريتي
    إلى جانب صورة لداود نفسه.


    انظر أيضًا إلى:


    - بوابات غنجة، قرب ضريح داود، التي استولى عليها ديمتري الأول غنيمةً عام 1138

    - برج الجرس من القرن الثالث عشر، الذي بُني طابقه الأرضي المعقود فوق نبع

    - قاعة الأكاديمية، بمقاعدها الحجرية على طول الجدران


    صار غيلاتي مقبرة ملكية لديمتري الأول، وغيورغي الثالث، وغيورغي الخامس البهي، وأجيال من ملوك إيميريتي؛
    والملكة تامار أيضًا، بحسب رواية المؤرخين. أدرجته اليونسكو في قائمة التراث العالمي عام 1994.


    بعد تسعة قرون، لا يزال قبر داود يفعل فعله: يدخل المرء غيلاتي مطأطئ الرأس.
  tip: >-
    غيلاتي دير قائم تُقام فيه الصلوات: تحتاج النساء إلى غطاء رأس وتنورة، والرجال إلى سراويل طويلة، وتُقرَض
    الأغطية عادة عند البوابة. الدخول مجاني. تتجه الحنية شرقًا، فتعال في الصباح حين يسقط الضوء على الفسيفساء.
    تبقى الكنائس باردة حتى في يوليو، فاحمل ثياباً إضافية. قد تكون أجزاء من المجمّع تحت السقالات، لأن أعمال
    الصيانة هنا مستمرة وقد واجهت انتكاسات. اطلب الإذن قبل التصوير في الداخل وحافظ على الهدوء أثناء القدّاس.
    يقع دير موتساميتا على 2.4 كم ويمكن إدراجه بسهولة في نفس الصباح.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري وممر ريكوتي إلى كوتايسي، نحو 220 كم. اعبر المدينة
    وانطلق على طريق Sh17 نحو تكيبولي؛ فرع قصير، Sh110، يصعد آخر كيلومتر ونصف إلى بوابة الدير. الإجمالي
    نحو 240 كم وثلاث ساعات ونصف، معبّد بالكامل، والمقطع الأخير ضيق لكنه سليم. سيارة اقتصادية كافية تمامًا.
    الوقود والنقد متوفران بكثرة في كوتايسي. مفرق موتساميتا على نفس الطريق، وليلة في كوتايسي تحوّل يوم
    العودة الطويل إلى يوم سهل.
