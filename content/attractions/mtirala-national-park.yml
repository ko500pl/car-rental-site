ka:
  name: მტირალას ეროვნული პარკი
  short: >-
    იუნესკოს სიაში შეტანილი კოლხური ტყე ბათუმის თავზე: 28-მეტრიანი ჩანჩქერი, ხავსით შემოსილი ქვები და
    საქართველოში ერთ-ერთი ყველაზე უხვი წვიმა.
  body: >-
    **მთას მტირალა სახელად შემთხვევით არ ჰქვია: წელიწადში აქ დაახლოებით 4500 მილიმეტრი ნალექი მოდის, რაც
    ყოფილ საბჭოთა კავშირში ერთ-ერთი ყველაზე მაღალი მაჩვენებელია.**


    პარკი 2006 წელს, ყოფილი ცისკარას ნაკრძალის ბაზაზე შეიქმნა და თითქმის 15 700 ჰექტარს მოიცავს იმ ქედზე,
    რომელიც ჩაქვსა და ბათუმს პირდაპირ ზურგიდან ამოსდგომია. 2021 წელს იგი იუნესკოს მსოფლიო მემკვიდრეობის
    ძეგლის, „კოლხეთის ტყეებისა და ჭარბტენიანი ტერიტორიების“ ნაწილი გახდა. ეს რელიქტური ტყეა, თბილი და
    ნოტიო ტყის ნაშთი, რომელიც შავი ზღვის ამ კუთხეში მილიონობით წელია ძლებს.


    შეხვალთ თუ არა, სიმწვანე თავზე დაგეხურებათ. ტყის ვარჯს წაბლი და აღმოსავლური წიფელი კრავს, მათ ქვეშ
    წყავი, შქერი და კოლხური ბზა ხარობს, ტოტებიდან კი ლიანები გემის მოშვებული ბაგირებივით ეკიდება. ყველა
    ქვა ხავსითაა შემოსილი. უფრო სიღრმეში მურა დათვი და შველი ბინადრობს, ნაკადულებთან კი ყვითელწინწკლებიანი
    კავკასიური სალამანდრა იმალება.


    სტუმართა უმეტესობა წაბლნარის ბილიკს მიუყვება, შვიდ კილომეტრს ჩაქვისწყლის ხეობაში, ჩაქვისთავის ვიზიტორთა
    ცენტრიდან. ორ კილომეტრში 28-მეტრიანი ჩანჩქერი სურო-ბზის ფარდებში ეშვება, უფრო შორს პატარა ტბაა და
    ქვებს შორის მორევად დატრიალებული მდინარე. ხეების თავზე 220-მეტრიანი ზიპლაინი გადის, ორდღიანი ცივწყაროს
    ბილიკი კი 1250 მეტრამდე ადის; მეცხრე კილომეტრზე რვაადგილიანი თავშესაფარი დგას.


    შემოდგომით ცას ახედეთ. ყოველწლიურად ამ სანაპიროს გასწვრივ მილიონზე მეტი მტაცებელი ფრინველი მიედინება,
    მათ შორის ჩია არწივისა და ჩვეულებრივი კრაზანაჭამიას მსოფლიო პოპულაციის ნახევარზე მეტი.


    წვიმის მოსასხამი წამოიღეთ, დიდი ალბათობით დაგჭირდებათ. მტირალა სწორედ მაშინაა თავისი თავი, როცა ტირის.
  tip: >-
    წაბლნარის ბილიკს სამიდან ოთხ საათამდე დაუთმეთ და დილით დაიწყეთ, სანამ შუადღის წვიმები მოიკრებს ძალას.
    წყალგაუმტარი ტანსაცმელი და კარგად მოჭიდებული ძირის ფეხსაცმელი აუცილებელია: თიხიანი ბილიკები თითქმის
    მთელი წელი სრიალაა. პარკის ცნობით, ზიპლაინი 20 ლარი ღირს, თოკების პარკი 15–20 ლარი; ფასი იცვლება,
    ბარათით გადახდის იმედი კი ნუ გექნებათ, ამიტომ ნაღდი ფული იქონიეთ. ჩანჩქერთან პიკნიკისა და კარვის ადგილები
    და კოცონის მოწყობილი კერებია; ცეცხლი მხოლოდ იქ დაანთეთ. ტყეში მობილური კავშირი წყდება, ამიტომ შეხვედრის
    ადგილი წინასწარ შეათანხმეთ. შემოდგომის მიგრაციის სანახავად პარკს ყოროლისთავის სადამკვირვებლო პუნქტზე
    ჰკითხეთ.
  route: >-
    თბილისიდან ს1-ით (E60) სამტრედიამდე წადით, იქიდან ს12-ით (E692) გრიგოლეთამდე, ზღვის პირას, შემდეგ
    ს2-ით (E70) სამხრეთით, ქობულეთის გავლით. ჩაქვში მთისკენ გადაუხვიეთ და ჩაქვისწყალს აღმა აჰყევით ჩაქვისთავის
    ვიზიტორთა ცენტრამდე: სულ დაახლოებით 385 კილომეტრი და ხუთი საათი და ორმოცდაათი წუთი, ბათუმიდან კი 30-იოდე
    კილომეტრი. გზის უმეტესი ნაწილი ასფალტია, ბოლო მონაკვეთი კი ვიწრო, ნაწილობრივ ხრეშიანი და წვიმის შემდეგ
    სრიალაა, ამიტომ გონივრული არჩევანი ჯიპი ან მაღალი კლირენსის მანქანაა; წვიმაში დაბალი სედანით ასვლა
    რისკია. საწვავი სანაპიროზე ჩაასხით, სანამ ხეობაში შეუხვევთ.
en:
  name: Mtirala National Park
  short: >-
    UNESCO-listed Colchic rainforest on the ridge behind Batumi: a 28-metre waterfall, moss on every stone,
    and some of the heaviest rain in Georgia.
  body: >-
    **Mtirala means "the weeping one", and the mountain earns its name: about 4,500 millimetres of rain
    fall on it each year, one of the heaviest totals anywhere in the former Soviet Union.**


    The park was created in 2006 from the old Tsiskara reserve and covers nearly 15,700 hectares of the
    ridge that rises straight behind Chakvi and Batumi. In 2021 it became part of UNESCO's Colchic Rainforests
    and Wetlands, recognition that this is relict forest: a survivor of the warm, wet woodland that has
    held on along this corner of the Black Sea for millions of years.


    Walk in and the green closes over you. Sweet chestnut and oriental beech hold up the canopy; beneath
    them grow cherry laurel, Pontic rhododendron and Colchic box, and lianas hang from the branches like
    slack rigging. Moss furs every stone. Brown bears and roe deer live deeper in, and the yellow-spotted
    Caucasian salamander keeps to the streams.


    Most visitors follow the Tsablnari trail, seven kilometres through the gorge of the Chakvistskali
    from the visitor centre at Chakvistavi. Two kilometres in, a 28-metre waterfall drops through curtains
    of ivy and box; further on there is a small lake, and pools where the river spins between the rocks.
    A 220-metre zip-line crosses above the trees, and the two-day Tsivtskaro trail climbs to 1,250 metres,
    with a shelter for eight at the ninth kilometre.


    In autumn, look up. More than a million birds of prey funnel along this coast each year, among them
    over half the world's booted eagles and European honey buzzards.


    Bring a raincoat and expect to use it. Mtirala is most itself when it weeps.
  tip: >-
    Give the Tsablnari trail three to four hours and start in the morning, before the afternoon showers
    build. Waterproofs and boots with real grip are essential: the clay paths are slick almost all year.
    The park lists the zip-line at 20 lari and the rope park at 15–20 lari; prices change, and card payment
    cannot be counted on, so carry cash. There are picnic spots, fire pits and camping areas near the
    waterfall; fires only where marked. Mobile signal is patchy under the canopy, so agree a meeting point.
    For the autumn raptor migration, ask the park about the viewing point at Korolistavi.
  route: >-
    From Tbilisi take the S1 (E60) to Samtredia, the S12 (E692) to the coast at Grigoleti and the S2 (E70)
    south past Kobuleti. At Chakvi turn inland and follow the Chakvistskali upstream to the visitor centre
    at Chakvistavi: about 385 km and five hours fifty in all, and roughly 30 km from Batumi. Most of the
    road is paved, but the final stretch is narrow, partly gravel and slippery after rain, so an SUV or
    other high-clearance car is the sensible choice, and in wet weather a low sedan is a gamble. Fill
    up on the coast before turning inland.
ru:
  name: Национальный парк Мтирала
  short: >-
    Внесённый в список ЮНЕСКО колхидский дождевой лес на хребте за Батуми: 28-метровый водопад, мох на
    каждом камне и одни из самых обильных дождей в Грузии.
  body: >-
    **«Мтирала» значит «плачущий», и гора носит это имя по праву: ежегодно на неё выпадает около 4500
    миллиметров осадков — один из самых высоких показателей на всём пространстве бывшего Советского Союза.**


    Парк создан в 2006 году на месте старого заповедника Цискара и занимает почти 15 700 гектаров хребта,
    поднимающегося прямо за спиной у Чакви и Батуми. В 2021 году он стал частью объекта ЮНЕСКО «Колхидские
    дождевые леса и болота» — признание того, что это реликтовый лес, уцелевший осколок тёплой влажной
    чащи, которая держится в этом уголке черноморского побережья уже миллионы лет.


    Стоит войти — и зелень смыкается над головой. Съедобный каштан и восточный бук держат полог, под ними
    растут лавровишня, понтийский рододендрон и колхидский самшит, а лианы висят на ветвях, как ослабшие
    снасти корабля. Мхом обросли все камни без исключения. Глубже в лесу живут бурый медведь и косуля,
    а у ручьёв держится желтопятнистая кавказская саламандра.


    Большинство гостей идут по тропе Цаблнари — семь километров вверх по ущелью Чаквисцкали от визит-центра
    в Чаквистави. Через два километра 28-метровый водопад падает сквозь завесы плюща и самшита; дальше
    — небольшое озеро и заводи, где река кружит между камнями. Над кронами деревьев протянут 220-метровый
    зиплайн, а двухдневная тропа Цивцкаро поднимается до 1250 метров; на её девятом километре стоит хижина
    на восемь человек.


    Осенью посмотрите вверх. Каждый год вдоль этого побережья пролетает больше миллиона хищных птиц, среди
    них — больше половины мировой популяции орла-карлика и осоеда.


    Возьмите дождевик и будьте готовы его надеть. Мтирала по-настоящему становится собой, когда плачет.
  tip: >-
    На тропу Цаблнари дайте три-четыре часа и выходите утром, пока не разгулялись послеобеденные ливни.
    Непромокаемая одежда и обувь с настоящим сцеплением необходимы: глинистые тропы скользкие почти весь
    год. По данным парка, зиплайн стоит 20 лари, верёвочный парк — 15–20 лари; цены меняются, а на оплату
    картой рассчитывать не стоит, так что возьмите наличные. У водопада есть места для пикника, костровища
    и площадки для кемпинга; костры — только там, где отмечено. Под кронами мобильная связь работает нестабильно,
    поэтому договоритесь о месте встречи заранее. Насчёт осенней миграции хищных птиц спросите в парке
    о смотровой площадке в Королистави.
  route: >-
    Из Тбилиси по S1 (E60) до Самтредиа, по S12 (E692) к побережью у Григолети и по S2 (E70) на юг через
    Кобулети. В Чакви сверните от побережья в горы и поднимайтесь вдоль Чаквисцкали до визит-центра в
    Чаквистави: всего около 385 км и пять часов пятьдесят минут, а от Батуми — примерно 30 км. Большая
    часть дороги асфальтирована, но последний отрезок узкий, частично гравийный и скользкий после дождя,
    так что разумный выбор — внедорожник или другая машина с высоким клиренсом, а низкий седан в мокрую
    погоду — это риск. Заправьтесь на побережье, прежде чем свернуть в горы.
fa:
  name: پارک ملی متیرالا
  short: >-
    جنگل بارانی کلخیسی ثبت‌شده در فهرست یونسکو بر تیغه‌ای پشت باتومی: آبشاری به بلندای ۲۸ متر، خزه بر
    هر سنگ، و یکی از بارانی‌ترین نقاط گرجستان.
  body: >-
    **«متیرالا» به معنای «گریان» است، و این کوه به‌راستی سزاوار این نام است: هرسال نزدیک به ۴۵۰۰ میلی‌متر
    باران بر آن می‌بارد، یکی از بالاترین رقم‌ها در سراسر پهنهٔ اتحاد جماهیر شوروی سابق.**


    این پارک در سال ۲۰۰۶ بر جای ذخیره‌گاه پیشین تسیسکارا بنا شد و نزدیک به ۱۵٬۷۰۰ هکتار از تیغه‌ای را
    در بر می‌گیرد که درست پشت چاکوی و باتومی سر برمی‌کشد. در سال ۲۰۲۱ این پارک بخشی از میراث جهانی یونسکو
    با نام «جنگل‌های بارانی و تالاب‌های کلخیسی» شد، گواهی بر این‌که این جنگلی بازمانده از روزگاران کهن
    است، پاره‌ای از جنگل گرم و مرطوبی که میلیون‌ها سال است در این گوشه از ساحل دریای سیاه دوام آورده.


    به درون که بروید، سبزی بر سرتان سایه می‌افکند. شاه‌بلوط و راش شرقی سقف جنگل را نگه می‌دارند، و در
    زیر آن‌ها برگ‌بوی گیلاسی، رودودندرون پونتیک و شمشاد کلخیسی می‌رویند، و گیاهان بالارونده از شاخه‌ها
    آویزانند، مثل طناب‌های شل کشتی. خزه بر هر سنگ نشسته است. خرس قهوه‌ای و شوکا در عمق جنگل زندگی می‌کنند،
    و سمندر قفقازی زردخال‌دار در کنار جویبارها می‌ماند.


    بیشتر بازدیدکنندگان مسیر تسابلناری را می‌روند، هفت کیلومتر در درهٔ چاکویستسکالی، از مرکز بازدیدکنندگان
    در چاکویستاوی. دو کیلومتر جلوتر، آبشاری به بلندای ۲۸ متر از میان پرده‌های پیچک و شمشاد فرو می‌ریزد؛
    کمی جلوتر دریاچه‌ای کوچک است و گودال‌هایی که رودخانه در آن‌ها میان صخره‌ها می‌چرخد. یک زیپ‌لاین به
    طول ۲۲۰ متر بالای درختان کشیده شده، و مسیر دو‌روزهٔ تسیوتسکارو تا ۱٬۲۵۰ متر بالا می‌رود، با پناهگاهی
    برای هشت نفر در کیلومتر نهم.


    در پاییز، به بالا نگاه کنید. هرسال بیش از یک میلیون پرندهٔ شکاری از این ساحل می‌گذرند، از جمله بیش
    از نیمی از جمعیت جهانی عقاب پرپا و سارگپهٔ جنگلی.


    بارانی همراه داشته باشید و آماده باشید که آن را بپوشید. متیرالا وقتی خودِ خودش است که می‌گرید.
  tip: >-
    برای مسیر تسابلناری سه تا چهار ساعت بگذارید و صبح راه بیفتید، پیش از آن‌که رگبارهای بعدازظهر شدت بگیرد.
    لباس ضدآب و کفشی با کفِ پرچنگ ضروری است: مسیرهای گلی تقریباً تمام سال لیز هستند. به گفتهٔ پارک، زیپ‌لاین
    ۲۰ لاری و پارک طناب ۱۵ تا ۲۰ لاری هزینه دارد؛ قیمت‌ها تغییر می‌کنند و روی پرداخت با کارت حساب نکنید،
    پس پول نقد همراه داشته باشید. کنار آبشار جای پیک‌نیک، آتشدان و محل چادرزدن هست؛ آتش فقط در جای مشخص‌شده
    روشن کنید. زیر سایهٔ درختان آنتن موبایل ناپیوسته است، پس محل ملاقات را از پیش هماهنگ کنید. برای مهاجرت
    پرندگان شکاری در پاییز، از پارک دربارهٔ نقطهٔ دیدبانی در کورولیستاوی بپرسید.
  route: >-
    از تفلیس مسیر S1 (E60) را تا سامترِدیا بروید، سپس S12 (E692) را تا ساحل در گریگولتی، و آن‌گاه S2 (E70)
    را به سوی جنوب از میان کوبولتی. در چاکوی به سوی داخل بپیچید و در امتداد رود چاکویستسکالی به سوی بالادست
    تا مرکز بازدیدکنندگان در چاکویستاوی بروید: در کل نزدیک ۳۸۵ کیلومتر و پنج ساعت و پنجاه دقیقه، و از
    باتومی حدود ۳۰ کیلومتر. بیشتر راه آسفالت است، اما بخش پایانی باریک، تا حدی شنی و پس از باران لیز است،
    پس انتخاب معقول خودرویی شاسی‌بلند است؛ در هوای بارانی سواری کم‌ارتفاع ریسکی است. پیش از پیچیدن به
    سوی داخل، در ساحل سوخت‌گیری کنید.
he:
  name: הגן הלאומי מטירלה
  short: >-
    יער גשם קולכי הרשום ברשימת אונסק"ו על הרכס שמעל בטומי: מפל בגובה 28 מטרים, טחב על כל אבן, ואחד ממקומות
    הגשם העזים בגאורגיה.
  body: >-
    **"מטירלה" פירושו "הבוכייה", וההר עומד בשמו: כ-4,500 מ"מ גשם יורדים עליו בשנה, אחת הכמויות הגדולות
    בכל שטחה של ברית המועצות לשעבר.**


    הגן נוסד ב-2006 על שרידי שמורת ציסקרה הישנה, ומשתרע על כ-15,700 הקטרים מהרכס שמתרומם ישר מאחורי צ'קווי
    ובטומי. ב-2021 הצטרף לאתר המורשת העולמית של אונסק"ו "יערות הגשם ואזורי הביצות הקולכיים", הכרה בכך
    שזהו יער שריד, שארית של החורש החם והלח ששרד בפינה הזאת של חוף הים השחור כבר מיליוני שנים.


    תיכנסו לתוכו, והירוק יסגור מעליכם. ערמון אכיל ואשור מזרחי נושאים את החופה, ותחתיהם צומחים דובדבן-דפנה,
    רודודנדרון פונטי ותאשור קולכי, ומטפסים תלויים מהענפים כחבלים רפויים על אונייה. טחב עוטף כל אבן. דוב
    חום ויחמור חיים עמוק יותר בפנים, וסלמנדרה קווקזית מנוקדת-צהוב נשארת בקרבת הנחלים.


    רוב המבקרים הולכים בשביל צבלנרי, שבעה קילומטרים בקניון צ'קוויסצקלי ממרכז המבקרים בצ'קוויסטאווי. אחרי
    שני קילומטרים נופל מפל בגובה 28 מטרים מבין מסכי קיסוס ותאשור; ומעבר לו אגם קטן ובריכות שבהן הנהר מסתחרר
    בין הסלעים. זיפ-ליין באורך 220 מטרים חוצה מעל העצים, והשביל הדו-יומי צבצקרו מטפס ל-1,250 מטרים, עם
    מחסה לשמונה איש בקילומטר התשיעי.


    בסתיו, הביטו מעלה. יותר ממיליון עופות דורסים חולפים מדי שנה על החוף הזה, ובהם למעלה ממחצית האוכלוסייה
    העולמית של העיט הגמדי ועקב הצרעים.


    הביאו מעיל גשם, וסביר שתזדקקו לו. מטירלה נאמנה לעצמה יותר מכול כשהיא בוכה.
  tip: >-
    הקדישו לשביל צבלנרי שלוש עד ארבע שעות והתחילו בבוקר, לפני שממטרי אחר הצהריים מתגברים. ביגוד עמיד למים
    ונעליים עם אחיזה ממשית חיוניים: השבילים החרסיתיים חלקלקים כמעט כל השנה. לפי הגן, הזיפ-ליין עולה 20
    לארי ופארק החבלים 15–20 לארי; המחירים משתנים, ואי אפשר לסמוך על תשלום בכרטיס, אז הביאו מזומן. לצד
    המפל יש מקומות לפיקניק, בורות מדורה ואזורי קמפינג; מדורה רק במקומות המסומנים. הקליטה הסלולרית מקוטעת
    מתחת לחופה, אז קבעו נקודת מפגש מראש. לגבי נדידת העופות הדורסים בסתיו, שאלו בגן על תחנת התצפית בקורוליסטאווי.
  route: >-
    מטביליסי סעו ב-S1 (E60) עד סמטרדיה, אחר כך ב-S12 (E692) עד החוף בגריגולטי, ומשם ב-S2 (E70) דרומה דרך
    קובולטי. בצ'קווי פנו פנימה ועלו לאורך צ'קוויסצקלי עד מרכז המבקרים בצ'קוויסטאווי: בסך הכול כ-385 ק"מ
    וחמש שעות וחמישים דקות, ומבטומי כ-30 ק"מ. רוב הדרך סלולה, אבל הקטע האחרון צר, חלקו מכוסה חצץ וחלקלק
    אחרי גשם, כך שרכב שטח או רכב אחר עם גחון גבוה הוא הבחירה הנכונה; וסדאן נמוך במזג אוויר גשום הוא הימור.
    תדלקו בחוף לפני שאתם פונים פנימה.
ar:
  name: حديقة متيرالا الوطنية
  short: >-
    غابة مطيرة كولخية مسجّلة في قائمة اليونسكو على السلسلة الجبلية خلف باتومي: شلال بارتفاع 28 مترًا،
    وطحالب على كل حجر، وأحد أكثر الأماكن غزارة بالأمطار في جورجيا.
  body: >-
    **تعني "متيرالا" "الباكية"، والجبل يستحق اسمه: يسقط عليه نحو 4,500 ملم من الأمطار سنويًا، وهو من أعلى
    المعدلات في كل الاتحاد السوفياتي السابق.**


    أُنشئت الحديقة في عام 2006 على أساس محمية تسيسكارا القديمة، وتغطي نحو 15,700 هكتار من السلسلة التي
    ترتفع مباشرة خلف تشاكفي وباتومي. وفي عام 2021 أصبحت جزءًا من موقع التراث العالمي لليونسكو "الغابات
    المطيرة والأراضي الرطبة في كولخيس"، وهو تقدير لكونها غابة متبقّية من عصور غابرة، بقيّة من الغابة الدافئة
    الرطبة التي بقيت في هذه الزاوية من ساحل البحر الأسود منذ ملايين السنين.


    ادخلوا، وسينسدل الأخضر فوقكم. يحمل شجر الكستناء الحلو والزان الشرقي القبّة، وتحتهما ينمو الغار الكرزي
    والرودودندرون البنطي والبقس الكولخي، وتتدلى النباتات المتسلقة من الأفرع كحبال سفينة متراخية. الطحالب
    تكسو كل حجر. الدب البني واليحمور يعيشان في العمق، وسمندر القوقاز المنقّط بالأصفر يبقى قريبًا من الجداول.


    يسير أغلب الزوار على مسار تسابلناري، سبعة كيلومترات في وادي تشاكفيستسكالي من مركز الزوار في تشاكفيستافي.
    بعد كيلومترين، ينهمر شلال بارتفاع 28 مترًا من خلال ستائر اللبلاب والبقس؛ وبعده بحيرة صغيرة وبرك يدور
    فيها النهر بين الصخور. ويمتد خط انزلاقي (زيب لاين) بطول 220 مترًا فوق الأشجار، ويصعد مسار تسيفتسكارو،
    ذو اليومين، إلى 1,250 مترًا، حيث يوجد ملجأ لثمانية أشخاص عند الكيلومتر التاسع.


    في الخريف، انظروا إلى الأعلى. أكثر من مليون طائر جارح يمر عبر هذا الساحل كل عام، من بينها أكثر من
    نصف تعداد العالم من العقاب القزم وحوّام النحل الأوروبي.


    خذوا معطف مطر وتوقعوا استخدامه. متيرالا هي نفسها أكثر ما تكون حين تبكي.
  tip: >-
    خصّصوا لمسار تسابلناري ثلاث إلى أربع ساعات، وابدأوا في الصباح قبل أن تشتد زخات بعد الظهر. الملابس
    المضادة للماء والأحذية ذات النعال المانعة للانزلاق ضرورية: المسارات الطينية زلقة تقريبًا طوال العام.
    تقول الحديقة إن الخط الانزلاقي يكلّف 20 لاري وحديقة الحبال 15 إلى 20 لاري؛ الأسعار تتغيّر، ولا يمكن
    الاعتماد على الدفع بالبطاقة، فاحملوا نقدًا. توجد أماكن للنزهات ومواقد نار ومناطق تخييم قرب الشلال؛
    لا تُشعلوا النار إلا حيث يُسمح بذلك. تغطية الهاتف متقطعة تحت الأشجار، فحددوا نقطة لقاء مسبقًا. لهجرة
    الطيور الجارحة في الخريف، اسألوا الحديقة عن نقطة المراقبة في كوروليستافي.
  route: >-
    من تبليسي خذوا S1 (E60) إلى سامتريديا، ثم S12 (E692) إلى الساحل عند غريغوليتي، ثم S2 (E70) جنوبًا
    عبر كوبوليتي. في تشاكفي، انحرفوا نحو الداخل واصعدوا بمحاذاة تشاكفيستسكالي إلى مركز الزوار في تشاكفيستافي:
    نحو 385 كم وخمس ساعات وخمسون دقيقة في المجموع، ونحو 30 كم من باتومي. معظم الطريق مُعبّد، لكن المقطع
    الأخير ضيق، وجزء منه حصوي وزلق بعد المطر، فالاختيار المعقول سيارة دفع رباعي أو أي سيارة أخرى ذات ارتفاع
    عالٍ؛ وسيارة سيدان منخفضة في الطقس الرطب مجازفة. عبّئوا الوقود على الساحل قبل الانحراف نحو الداخل.
