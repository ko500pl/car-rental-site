ka:
  name: მთირალას ეროვნული პარკი
  short: კოლხური წვიმის ტყე ბათუმის უკან — ევროპის ერთ-ერთი ყველაზე ნოტიო ადგილი, ბილიკებით, ჩანჩქერით
    და ზიპლაინით.
  body: >-
    მთირალას ეროვნული პარკი ბათუმიდან აღმოსავლეთით, სანაპირო ქედზეა გაშენებული და საქართველოს ერთ-ერთი
    ყველაზე უჩვეულო ბუნებრივი ტერიტორიაა. სახელი პირდაპირ ითარგმნება როგორც „მტირალი" და ის სრულიად ზუსტია:
    აქ წელიწადში ოთხი ათას მილიმეტრზე მეტი ნალექი მოდის, რაც ამ ადგილს ევროპის ყველაზე ნოტიო წერტილებს
    შორის აყენებს.


    შედეგი კოლხური რელიქტური ტყეა — მუდმივმწვანე ქვეტყით, ხავსით დაფარული ხეებით, გვიმრებითა და ლიანებით.
    ეს ეკოსისტემა მესამეული პერიოდიდან შემორჩა და დასავლეთ საქართველოს გარდა თითქმის აღარსად გვხვდება;
    სწორედ ამიტომ აქვს პარკს საერთაშორისო მნიშვნელობა.


    რას გთავაზობთ პარკი:


    - **მოკლე ბილიკი ჩანჩქერამდე** — დაახლოებით ორსაათიანი მარშრუტი პატარა ტბით და ჩანჩქერით

    - **ზიპლაინი** მდინარეზე, სავიზიტო ცენტრთან

    - **გრძელი მარშრუტები** ქედზე, რომლებიც ღამის გათევასაც ითხოვს

    - **სავიზიტო ცენტრი** ჩაქვისთავში, საინფორმაციო პუნქტითა და კარვის ადგილებით


    მთავარი გაფრთხილება ამინდზეა: აქ წვიმა ნორმაა და არა გამონაკლისი. მშრალ დღეს მოხვედრა იღბალია, ამიტომ
    აღჭურვილობა წვიმისთვის უნდა შეარჩიოთ და არა მზისთვის, ხოლო მოწმენდილი შუადღე ბონუსად ჩათვალოთ. სამაგიეროდ,
    ტყე ნისლში ყველაზე შთამბეჭდავია და ვიზიტორი აქ გაცილებით ნაკლებია, ვიდრე სანაპიროზე. მთირალა ასევე
    კარგი არჩევანია მაშინ, როცა ბათუმში წვიმს და პლაჟი მაინც აზრს კარგავს — მაღლა ტყეში სწორედ ასეთი ამინდი
    ბუნებრივია.
  tip: >-
    წყალგაუმტარი ქურთუკი და მოცურავე ძირიანი ფეხსაცმელი აქ სავალდებულოა — ბილიკები თიხიანი და სრიალაა
    თითქმის ყოველთვის. ზაფხულში ტენიანობა მაღალია და მწერების საწინააღმდეგო საშუალება გამოგადგებათ. ვიზიტს
    სამიდან ოთხ საათამდე დაუთმეთ და დილით შედით: შუადღის შემდეგ ავდარი უფრო სავარაუდოა. სავიზიტო ცენტრში
    არის ტუალეტი და მცირე კაფე, ბანკომატი კი არა — ნაღდი ფული თან იქონიეთ. მობილური კავშირი ტყეში სუსტია.
  route: >-
    თბილისიდან დაახლოებით 385 კმ და ხუთი საათი და 50 წუთია. E60-ით ჩადიხართ სანაპიროზე, ჩაქვის მიდამოებში
    აღმოსავლეთით უხვევთ და ჩაქვისთავის მიმართულებით ადიხართ — ბათუმიდან სულ 25-30 კმ-ია, დაახლოებით 50
    წუთი. გზის დიდი ნაწილი ასფალტია, ბოლო მონაკვეთი კი ვიწრო, ხრეშოვანი და წვიმის შემდეგ სრიალა. სწორედ
    ამიტომ სჯობს მაღალი კლირენსის ავტომობილი; სედანით ავდარში ასვლა არ ღირს. საწვავი ბათუმში ან ჩაქვში
    აავსეთ.
en:
  name: Mtirala National Park
  short: >-
    Colchic rainforest behind Batumi — one of the wettest places in Europe, with trails, a waterfall and
    a zipline.
  body: >-
    Mtirala National Park lies east of Batumi on the coastal ridge and is one of the most unusual natural
    areas in Georgia. The name translates literally as "the weeping one", and it is accurate: more than
    four thousand millimetres of rain fall here each year, which puts the park among the wettest places
    in Europe.


    The result is Colchic relict forest — evergreen understorey, moss-covered trees, ferns and lianas.
    This ecosystem survives from the Tertiary period and is found almost nowhere outside western Georgia,
    which is why the park matters internationally rather than just locally.


    What the park offers:


    - **A short trail to the waterfall** — a roughly two-hour route past a small lake

    - **A zipline** across the river near the visitor centre

    - **Longer ridge routes** that require an overnight stay

    - **The visitor centre** at Chakvistavi, with an information point and camping areas


    The main warning concerns weather. Rain here is the norm, not the exception, and catching a dry day
    is genuinely a matter of luck. Choose your clothing for wet conditions rather than sun, and treat
    a clear afternoon as a bonus. In compensation, the forest is at its most striking in mist, and there
    are far fewer visitors than on the coast.
  tip: >-
    A waterproof jacket and shoes with real grip are essential — the paths are clay-based and slippery
    almost all the time. Humidity is high in summer, so insect repellent is worth carrying. Allow three
    to four hours and start in the morning, since storms are more likely after midday. The visitor centre
    has toilets and a small cafe but no ATM, so bring cash for the zipline and any fees. Mobile coverage
    inside the forest is weak, so agree a meeting point if you split up.
  route: >-
    It is about 385 km and roughly five hours fifty from Tbilisi. Take the E60 down to the coast, turn
    east near Chakvi and climb toward Chakvistavi: from Batumi it is 25–30 km in total, about fifty minutes.
    Most of the road is paved, but the final section is narrow gravel that turns slippery after rain.
    That is why a higher-clearance vehicle is the sensible choice here; taking a sedan up in wet weather
    is not worth it. Fill up in Batumi or Chakvi before turning inland.
ru:
  name: Национальный парк Мтирала
  short: Колхидский дождевой лес за Батуми — одно из самых влажных мест Европы, с тропами, водопадом и
    зиплайном.
  body: >-
    Национальный парк Мтирала расположен к востоку от Батуми на прибрежном хребте и остаётся одной из
    самых необычных природных территорий Грузии. Название переводится буквально как «плачущая», и это
    точно: здесь выпадает более четырёх тысяч миллиметров осадков в год, что ставит парк в число самых
    влажных мест Европы.


    Результат — колхидский реликтовый лес с вечнозелёным подлеском, покрытыми мхом деревьями, папоротниками
    и лианами. Эта экосистема сохранилась с третичного периода и почти нигде за пределами Западной Грузии
    не встречается, поэтому парк имеет международное, а не только местное значение.


    Что предлагает парк:


    - **Короткую тропу к водопаду** — примерно двухчасовой маршрут мимо небольшого озера

    - **Зиплайн** через реку рядом с визит-центром

    - **Длинные хребтовые маршруты**, требующие ночёвки

    - **Визит-центр** в Чаквистави с информационным пунктом и местами под палатки


    Главное предупреждение касается погоды. Дождь здесь норма, а не исключение, и попасть на сухой день
    — вопрос везения. Одежду подбирайте под сырость, а не под солнце. Взамен лес особенно выразителен
    в тумане, а людей тут заметно меньше, чем на побережье.
  tip: >-
    Непромокаемая куртка и обувь с цепким протектором обязательны — тропы глинистые и скользкие практически
    всегда. Летом высокая влажность, репеллент пригодится. Закладывайте три-четыре часа и выходите утром:
    после полудня грозы вероятнее. В визит-центре есть туалеты и небольшое кафе, банкомата нет — наличные
    на зиплайн и сборы берите с собой. Связь в лесу слабая, поэтому заранее договоритесь о точке встречи,
    если разойдётесь.
  route: >-
    От Тбилиси около 385 км и примерно пять часов пятьдесят минут. По трассе E60 вы спускаетесь к побережью,
    у Чакви поворачиваете на восток и поднимаетесь в сторону Чаквистави: от Батуми это 25–30 км, около
    пятидесяти минут. Большая часть дороги асфальтированная, но последний участок — узкий грунт, который
    после дождя становится скользким. Поэтому здесь разумнее машина с высоким клиренсом; ехать наверх
    на седане в сырость не стоит. Заправляйтесь в Батуми или Чакви перед поворотом вглубь.
fa:
  name: پارک ملی متیرالا
  short: جنگل بارانی کلخی پشت باتومی — یکی از پربارش‌ترین جاهای اروپا، با مسیرها، آبشار و زیپ‌لاین.
  body: >-
    پارک ملی متیرالا در شرق باتومی روی ستیغ ساحلی قرار دارد و یکی از غیرعادی‌ترین پهنه‌های طبیعی گرجستان
    است. نام آن تحت‌اللفظی یعنی «گریان» و دقیق هم هست: هر سال بیش از چهار هزار میلی‌متر باران اینجا می‌بارد
    و همین پارک را در شمار پربارش‌ترین جاهای اروپا می‌گذارد.


    نتیجه، جنگل بازماندهٔ کلخی است — زیراشکوب همیشه‌سبز، درختان پوشیده از خزه، سرخس و پیچک‌های چوبی. این
    بوم‌سازگان از دوران ترشیری برجا مانده و بیرون از غرب گرجستان تقریباً هیچ‌جا یافت نمی‌شود؛ به همین
    سبب اهمیت پارک جهانی است نه صرفاً محلی.


    پارک چه چیزی عرضه می‌کند: **مسیر کوتاه آبشار** — راهی حدوداً دوساعته از کنار دریاچه‌ای کوچک؛ **زیپ‌لاین**
    روی رودخانه نزدیک مرکز بازدیدکنندگان؛ **مسیرهای بلندتر ستیغ** که به یک شب اقامت نیاز دارند؛ و **مرکز
    بازدیدکنندگان** در چاکویستاوی با باجهٔ اطلاعات و محوطه‌های کمپینگ. هشدار اصلی به هوا مربوط است. باران
    اینجا قاعده است نه استثنا و گیر آوردن یک روز خشک واقعاً بخت می‌خواهد. لباس را برای شرایط مرطوب انتخاب
    کنید نه برای آفتاب، و بعدازظهر صاف را موهبت بشمارید. در عوض، جنگل در مه چشمگیرترین حالت خود را دارد
    و بازدیدکنندگان بسیار کمتر از ساحل‌اند.
  tip: >-
    ژاکت ضدآب و کفشی با ته‌گیر واقعی ضروری‌اند — بیلیک‌ها رسی‌اند و تقریباً همیشه لغزنده. رطوبت در تابستان
    بالاست، پس دورکنندهٔ حشره ارزش همراه بردن دارد. سه تا چهار ساعت وقت بگذارید و صبح شروع کنید، چون احتمال
    رگبار بعد از ظهر بیشتر است. مرکز بازدیدکنندگان سرویس بهداشتی و کافه‌ای کوچک دارد اما خودپرداز ندارد،
    پس برای زیپ‌لاین و هزینه‌های دیگر پول نقد بیاورید. پوشش تلفن همراه درون جنگل ضعیف است، پس اگر از هم
    جدا می‌شوید نقطهٔ قرار تعیین کنید.
  route: >-
    از تفلیس حدود 385 کیلومتر و تقریباً پنج ساعت و پنجاه دقیقه است. با E60 تا ساحل بروید، نزدیک چاکوی
    رو به شرق بپیچید و به سوی چاکویستاوی بالا بروید: از باتومی روی هم 25 تا 30 کیلومتر است، حدود پنجاه
    دقیقه. بیشتر جاده آسفالت است، اما بخش پایانی شنی و باریک است و پس از باران لغزنده می‌شود. به همین
    سبب خودرویی با ارتفاع کف بیشتر اینجا انتخاب معقولی است؛ بالا بردن سدان در هوای بارانی ارزشش را ندارد.
    پیش از پیچیدن به سمت داخل، در باتومی یا چاکوی باک را پر کنید.
he:
  name: הפארק הלאומי מטירלה
  short: יער גשם קולכי מאחורי בטומי — מהמקומות הגשומים באירופה, עם שבילים, מפל ואומגה.
  body: >-
    הפארק הלאומי מטירלה שוכן ממזרח לבטומי על רכס החוף והוא אחד האזורים הטבעיים יוצאי הדופן ביותר בגאורגיה.
    שמו מיתרגם מילולית ל"הבוכה", והתיאור מדויק: יותר מארבעת אלפים מילימטר גשם יורדים כאן מדי שנה, מה שמציב
    את הפארק בין המקומות הגשומים ביותר באירופה.


    התוצאה היא יער רליקטי קולכי — תת-יער ירוק-עד, עצים מכוסי טחב, שרכים וליאנות. המערכת האקולוגית הזאת
    שרדה מן התקופה הטרציארית ואינה נמצאת כמעט בשום מקום מחוץ למערב גאורגיה, ומכאן חשיבותו הבינלאומית של
    הפארק ולא רק המקומית.


    מה שהפארק מציע: **שביל קצר אל המפל** — מסלול של כשעתיים החולף על פני אגם קטן; **אומגה** מעל הנחל ליד
    מרכז המבקרים; **מסלולי רכס ארוכים יותר** המחייבים לינה בשטח; ו**מרכז המבקרים** בצ'קוויסטאווי, עם נקודת
    מידע ואזורי קמפינג. האזהרה העיקרית נוגעת למזג האוויר. גשם כאן הוא הכלל ולא היוצא מן הכלל, ולתפוס יום
    יבש הוא באמת עניין של מזל. בחרו את הלבוש לתנאים רטובים ולא לשמש, והתייחסו לאחר צהריים בהיר כאל בונוס.
    בתמורה, היער מרשים במיוחד דווקא בערפל, ויש בו הרבה פחות מבקרים מאשר בחוף.
  tip: >-
    מעיל אטום למים ונעליים עם אחיזה אמיתית הם הכרחיים — השבילים חרסיתיים וחלקלקים כמעט תמיד. הלחות בקיץ
    גבוהה, ולכן כדאי לקחת דוחה חרקים. הקצו שלוש עד ארבע שעות והתחילו בבוקר, מפני שסופות נפוצות יותר אחרי
    הצהריים. במרכז המבקרים יש שירותים ובית קפה קטן אך אין כספומט, לכן הביאו מזומן עבור האומגה ועבור תשלומים
    אחרים. הקליטה הסלולרית בתוך היער חלשה, אז קבעו נקודת מפגש אם אתם מתפצלים.
  route: >-
    מטביליסי מדובר בכ-385 ק"מ ובכחמש שעות וחמישים דקות. סעו בכביש E60 עד החוף, פנו מזרחה ליד צ'קווי וטפסו
    לעבר צ'קוויסטאווי: מבטומי מדובר ב-25–30 ק"מ בסך הכול, כחמישים דקות. רוב הדרך סלולה, אך הקטע האחרון
    הוא חצץ צר שנעשה חלקלק אחרי גשם. לכן רכב עם גובה גחון גדול יותר הוא הבחירה ההגיונית כאן; להעלות סדאן
    בגשם פשוט לא שווה את זה. תדלקו בבטומי או בצ'קווי לפני שאתם פונים פנימה אל ההרים.
ar:
  name: منتزه متيرالا الوطني
  short: غابة مطيرة كولخية خلف باتومي — من أكثر البقاع مطراً في أوروبا، وفيها مسارات وشلال وخط انزلاق.
  body: >-
    يقع منتزه متيرالا الوطني شرق باتومي على حافة الساحل، وهو من أغرب المناطق الطبيعية في جورجيا. ويُترجم
    اسمه حرفياً إلى «الباكي»، والوصف دقيق: إذ يهطل هنا أكثر من أربعة آلاف مليمتر من المطر سنوياً، ما يضع
    المنتزه بين أكثر الأماكن مطراً في أوروبا.


    والنتيجة غابة كولخية متبقية — طبقة سفلى دائمة الخضرة، وأشجار تكسوها الطحالب، وسراخس ونباتات متسلقة.
    ونظام بيئي كهذا نجا من العصر الثلاثي ولا يكاد يوجد خارج غرب جورجيا، ولهذا فأهمية المنتزه عالمية لا
    محلية فحسب.


    وما يقدمه المنتزه: **مسار قصير إلى الشلال** — طريق يستغرق نحو ساعتين ويمر ببحيرة صغيرة؛ و**خط انزلاق**
    فوق النهر قرب مركز الزوار؛ و**مسارات أطول على الحافة** تتطلب مبيتاً؛ و**مركز الزوار** في تشاكفيستافي،
    وفيه نقطة معلومات ومناطق تخييم. أما التحذير الأهم فيتعلق بالطقس. المطر هنا هو القاعدة لا الاستثناء،
    والظفر بيوم جاف مسألة حظ فعلاً. اختر ملابسك لظروف مبللة لا للشمس، واعتبر أي عصر صافٍ مكسباً إضافياً.
    وفي المقابل، تبلغ الغابة أجمل صورها في الضباب، وعدد الزوار فيها أقل بكثير مما على الساحل.
  tip: >-
    سترة مقاومة للماء وحذاء جيد التشبث أمران ضروريان — فالدروب طينية وزلقة في معظم الأوقات. والرطوبة عالية
    صيفاً، لذا يستحق طارد الحشرات أن تحمله معك. خصّص ثلاث إلى أربع ساعات وابدأ صباحاً، لأن العواصف أكثر
    احتمالاً بعد الظهر. وفي مركز الزوار دورات مياه ومقهى صغير لكن لا صراف آلي، فاحمل نقداً لخط الانزلاق
    وللرسوم الأخرى. وتغطية الهاتف داخل الغابة ضعيفة، فاتفقوا على نقطة لقاء إن افترقتم.
  route: >-
    المسافة من تبليسي نحو 385 كم وقرابة خمس ساعات وخمسين دقيقة. اسلك الطريق E60 نزولاً إلى الساحل، ثم
    انعطف شرقاً قرب تشاكفي واصعد نحو تشاكفيستافي: من باتومي المسافة 25–30 كم إجمالاً، أي نحو خمسين دقيقة.
    ومعظم الطريق معبّد، لكن المقطع الأخير حصى ضيق يصبح زلقاً بعد المطر. ولهذا فالمركبة الأعلى خلوصاً هي
    الخيار المعقول هنا؛ وإصعاد سيارة سيدان في الطقس الممطر لا يستحق العناء. املأ الخزان في باتومي أو تشاكفي
    قبل الانعطاف نحو الداخل.
