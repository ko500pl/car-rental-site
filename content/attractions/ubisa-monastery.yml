ka:
  name: უბისის მონასტერი
  short: IX საუკუნის წმინდა გიორგის მონასტერი ძირულის ხეობაში, დამიანეს XIV საუკუნის ფრესკებით და 1141
    წლის კოშკით.
  body: >-
    **უბისა იმ ადგილთაგანია, სადაც შუა საუკუნეების მხატვრობა თითქმის მთლიანად შემორჩა.** მონასტერი ძირულის
    ხეობაში, ხარაგაულიდან ჩრდილო-დასავლეთით, ტყიან ფერდობზეა და გზიდან თითქმის არ ჩანს.


    წმინდა გიორგის ეკლესია IX საუკუნეში გრიგოლ ხანძთელმა დააარსა. ეს პატარა, ერთნავიანი, კამაროვანი ბაზილიკაა
    — გარედან თითქმის უსახური, კედლის სისქეში ჩამალული აფსიდით და მოგვიანებით მიშენებული სამხრეთისა და
    დასავლეთის კარიბჭეებით. ეზოში ოთხსართულიანი კოშკი დგას, რომლის წარწერაც მშენებლობის ზუსტ თარიღს —
    1141 წელს — და დიმიტრი მეფის დროინდელ სიმონ ჩქონდიდელს ასახელებს. გალავნის ფრაგმენტებიც XII საუკუნისაა.


    მთავარი კი შიგნით არის. ეკლესიის მთელი ინტერიერი XIV საუკუნის ბოლოს მოიხატა; წარწერების მიხედვით ოსტატი
    გერასიმე ხელმძღვანელობდა, მხატვარი კი მისი მოწაფე დამიანე იყო. ფრესკებზე ჩანს:


    - მაცხოვარი დიდებაში კამარაზე და დეისისი


    - საიდუმლო სერობა და შობა, უჩვეულოდ ხალხმრავალი კომპოზიციებით


    - წმინდა გიორგის ცხოვრების ციკლი, ეკლესიის პატრონისა


    - „ძველი დღეთა“ — იშვიათი იკონოგრაფიული სიუჟეტი


    სპეციალისტები დამიანეს მხატვრობაში ბიზანტიური, სერბული და რუსული გავლენების შერწყმას ხედავენ, თუმცა
    ფიგურების წაგრძელებული პროპორციები და სახეების სიმშვიდე სავსებით ქართულია. ფერი დროთა განმავლობაში
    ჩამუქდა, მაგრამ თხრობა ისევ იკითხება.


    ეკლესია დღეს მოქმედი მონასტერია; ბერები ფუტკარს უვლიან და თაფლს ყიდიან. სამრეკლოსა და ტყის ფონზე მთელი
    ეზო ძალიან წყნარია — უბისა იმ იშვიათი ადგილებია, სადაც ტურისტული ავტობუსი იშვიათად ჩერდება.
  tip: >-
    ერთი საათი საკმარისია, თუმცა ფრესკებს მეტიც ეკადრება. შიგნით ბნელა და ფოტოს გადაღება უფლების გარეშე
    არ შეიძლება — ბერს ჰკითხე. ჩაცმის წესები მკაცრია: ქალებს თავსაფარი და გრძელი კაბა სჭირდებათ, კართან
    დევს. ეზოში ბილიკი ქვაფენილია და მცირედ აღმართი, ურიკით რთულია. კაფე და მაღაზია აქ არ არის — უახლოესი
    ხარაგაულში ან ზესტაფონშია. ტუალეტი ეზოს კუთხეშია. ზამთარში ეკლესია გაუთბობელია და ცივი.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ — გორი, ხაშური და რიკოთის უღელტეხილის განახლებული მონაკვეთი. უღელტეხილის
    შემდეგ ძირულის ხეობაში ჩახვალ და უბისის მაჩვენებელი ნიშანი მარცხნივ, ძველ გზაზე გაგიყვანს. სულ დაახლოებით
    170 კმ, ორ საათნახევარში. ბოლო ორი კილომეტრი ვიწრო, მაგრამ ასფალტიანი ქუჩაა სოფელში. საწვავი ხაშურსა
    და ზესტაფონში აიღე. მონასტრის ეზოსთან პატარა უფასო პარკინგია. ეკონომ-კლასის მანქანა მთელი წელი საკმარისია.
en:
  name: Ubisa Monastery
  short: >-
    A 9th-century monastery of St George in the Dzirula valley, holding an almost complete cycle of 14th-century
    frescoes.
  body: >-
    **Ubisa is one of the places where medieval Georgian painting survived nearly intact.** The monastery
    sits on a wooded slope in the Dzirula valley north-west of Kharagauli, and is barely visible from
    the road.


    The church of St George was founded in the 9th century by Grigol Khandzteli. It is a small single-nave
    barrel-vaulted basilica, plain from outside, with the apse hidden inside the thickness of the east
    wall and open porches added later on the south and west. In the yard stands a four-storey tower whose
    inscription gives an exact date, 1141, and names its builder, Simon Chkondideli, in the reign of King
    Demetrius I. Fragments of the enclosure wall are also 12th century.


    The reason to come is inside. The whole interior was painted at the end of the 14th century; inscriptions
    credit the master Gerasime and his pupil Damiane, the painter. The programme includes:


    - Christ in Glory on the vault, and a Deesis


    - the Last Supper and the Nativity, in unusually crowded compositions


    - a cycle from the life of St George, to whom the church is dedicated


    - the Ancient of Days, a rare subject


    Specialists read Damiane's work as a meeting of Byzantine, Serbian and Russian currents, but the elongated
    figures and the calm, almost withdrawn faces are entirely Georgian. The colour has darkened over six
    centuries, yet the storytelling is still easy to follow.


    The church is a working monastery again; the monks keep bees and sell honey by the gate. Between the
    tower, the old walnut trees and the forest behind, the yard is very quiet — Ubisa is one of the few
    important sites in Imereti where tour buses rarely stop.
  tip: >-
    An hour is enough, though the frescoes reward longer. It is dark inside and photography is not allowed
    without asking a monk first. Dress rules are enforced: women need a headscarf and long skirt, both
    kept by the door. The path through the yard is cobbled and slightly uphill, awkward with a pushchair.
    There is no cafe or shop here — the nearest are in Kharagauli or Zestaponi. A toilet stands in the
    corner of the yard. In winter the church is unheated and genuinely cold.
  route: >-
    Take the E60 west from Tbilisi through Gori and Khashuri and over the rebuilt Rikoti section. After
    the pass the road drops into the Dzirula valley, and a sign for Ubisa sends you left onto the old
    road — about 170 km in total, two and a half hours. The last two kilometres are a narrow but paved
    village street. Refuel in Khashuri or Zestaponi. There is a small free car park by the monastery gate.
    An economy car is fine all year.
ru:
  name: Монастырь Убиси
  short: Монастырь Святого Георгия IX века в ущелье Дзирула с почти полностью сохранившимися фресками
    XIV века.
  body: >-
    **Убиси — одно из мест, где средневековая грузинская живопись уцелела почти целиком.** Монастырь стоит
    на лесистом склоне в ущелье Дзирула, к северо-западу от Харагаули, и с дороги его почти не видно.


    Церковь Святого Георгия основал в IX веке Григол Хандзтели. Это небольшая однонефная базилика с цилиндрическим
    сводом, снаружи совсем простая; апсида спрятана в толще восточной стены, а южный и западный притворы
    пристроены позже. Во дворе стоит четырёхъярусная башня, надпись на которой даёт точную дату — 1141
    год — и называет строителя, Симона Чкондидели, при царе Деметре I. Фрагменты ограды тоже XII века.


    Главное находится внутри. Весь интерьер расписан в конце XIV века; надписи называют мастера Герасиме
    и его ученика, живописца Дамиане. В росписи есть:


    - Спас во славе на своде и деисус


    - Тайная вечеря и Рождество, необычно многолюдные


    - цикл жития Святого Георгия, которому посвящён храм


    - «Ветхий денми» — редкий иконографический сюжет


    Специалисты видят у Дамиане встречу византийской, сербской и русской традиций, но вытянутые пропорции
    фигур и спокойные, отрешённые лица вполне грузинские. Краски за шесть веков потемнели, однако повествование
    читается легко.


    Сегодня это действующий монастырь; монахи держат пасеку и продают мёд у ворот. Между башней, старыми
    ореховыми деревьями и лесом позади двор очень тих — Убиси остаётся одним из немногих значимых мест
    Имерети, где туристические автобусы почти не останавливаются.
  tip: >-
    Часа достаточно, хотя фрески заслуживают большего. Внутри темно, снимать без разрешения монаха нельзя.
    Правила одежды соблюдаются строго: женщинам нужны платок и длинная юбка, они лежат у входа. Дорожка
    во дворе мощёная и слегка идёт вверх, с коляской неудобно. Кафе и магазина здесь нет — ближайшие в
    Харагаули или Зестафони. Туалет в углу двора. Зимой храм не отапливается и по-настоящему холодный.
  route: >-
    Из Тбилиси по E60 на запад через Гори и Хашури и далее по перестроенному участку Рикоти. За перевалом
    дорога спускается в ущелье Дзирула, указатель на Убиси уводит влево на старую трассу — всего около
    170 км, два с половиной часа. Последние два километра — узкая, но асфальтированная сельская улица.
    Заправляйтесь в Хашури или Зестафони. У ворот монастыря есть маленькая бесплатная парковка. Машины
    эконом-класса хватает круглый год.
fa:
  name: صومعهٔ اوبیسی
  short: صومعهٔ سنت گئورگی از سدهٔ نهم در درهٔ دزیرولا، با مجموعه‌ای تقریباً کامل از نقاشی‌های دیواری
    سدهٔ چهاردهم.
  body: >-
    **اوبیسی از معدود جاهایی است که نقاشی دیواری قرون وسطای گرجستان در آن تقریباً دست‌نخورده مانده است.**
    صومعه بر دامنه‌ای جنگلی در درهٔ دزیرولا، شمال غربی خاراگاولی، نشسته و از جاده به‌سختی دیده می‌شود.


    کلیسای سنت گئورگی را در سدهٔ نهم گریگول خاندزتلی بنیاد نهاد. بنایی کوچک است، تک‌شبستانی با طاق گهواره‌ای
    و نمایی بسیار ساده؛ محراب در ضخامت دیوار شرقی پنهان شده و ایوان‌های جنوبی و غربی بعدها افزوده شده‌اند.
    در حیاط برجی چهارطبقه ایستاده که کتیبه‌اش تاریخ دقیق ۱۱۴۱ و نام سازنده‌اش، سیمون چقوندیدلی، را در
    روزگار دیمیتری پادشاه ثبت کرده است. پاره‌های دیوار حصار نیز از سدهٔ دوازدهم است.


    اما دلیل آمدن، درون بناست. تمام فضای داخلی در اواخر سدهٔ چهاردهم نقاشی شد؛ کتیبه‌ها از استاد گراسیمه
    و شاگردش دامیانه نام می‌برند. برنامهٔ تصویری شامل این‌هاست:


    - مسیح در جلال بر طاق، و صحنهٔ شفاعت


    - شام آخر و میلاد، با ترکیب‌بندی‌هایی به‌طور غیرعادی پرجمعیت


    - چرخه‌ای از زندگی سنت گئورگی، شفیع کلیسا


    - کهن‌الایام، موضوعی کمیاب در نگارگری


    کارشناسان کار دامیانه را تلاقی جریان‌های بیزانسی، صربی و روسی می‌خوانند، اما تناسب‌های کشیدهٔ پیکرها
    و چهره‌های آرام و درون‌گرا کاملاً گرجی است. رنگ‌ها در شش سده تیره شده‌اند، ولی روایت هنوز به‌روشنی
    خوانده می‌شود.


    کلیسا امروز صومعه‌ای فعال است؛ راهبان زنبورداری می‌کنند و کنار دروازه عسل می‌فروشند. میان برج، درختان
    کهن گردو و جنگل پشت سر، حیاط بسیار آرام است — اوبیسی از معدود جاهای مهم ایمرتی است که اتوبوس‌های تور
    کمتر آنجا توقف می‌کنند.
  tip: >-
    یک ساعت کافی است، هرچند نقاشی‌ها وقت بیشتری می‌ارزند. داخل تاریک است و عکاسی بدون اجازهٔ راهب مجاز
    نیست. قواعد پوشش جدی گرفته می‌شود: زنان به روسری و دامن بلند نیاز دارند که کنار در گذاشته شده است.
    مسیر حیاط سنگ‌فرش و کمی سربالا است و با کالسکه دشوار می‌شود. کافه و فروشگاهی اینجا نیست؛ نزدیک‌ترین‌ها
    در خاراگاولی یا زستافونی‌اند. سرویس بهداشتی در گوشهٔ حیاط است. زمستان کلیسا گرمایش ندارد و واقعاً
    سرد است.
  route: >-
    از تفلیس با بزرگراه E60 به غرب بروید: گوری، خاشوری و مقطع بازسازی‌شدهٔ ریکوتی. پس از گردنه جاده به
    درهٔ دزیرولا پایین می‌رود و تابلوی اوبیسی شما را به چپ و روی جادهٔ قدیم می‌برد — روی‌هم حدود ۱۷۰ کیلومتر
    و دو ساعت و نیم. دو کیلومتر آخر کوچه‌ای باریک اما آسفالته در روستاست. سوخت را در خاشوری یا زستافونی
    بگیرید. کنار دروازهٔ صومعه پارکینگ کوچک رایگان هست. خودروی اقتصادی در همهٔ فصل‌ها کافی است.
he:
  name: מנזר אוביסי
  short: מנזר גיאורגיוס הקדוש מן המאה ה-9 בעמק דזירולה, ובו מחזור כמעט שלם של ציורי קיר מן המאה ה-14.
  body: >-
    **אוביסי הוא אחד המקומות שבהם שרדה הציור הגאורגי של ימי הביניים כמעט בשלמותו.** המנזר יושב על מדרון
    מיוער בעמק דזירולה, צפונית‑מערבית לחראגאולי, וכמעט אינו נראה מן הכביש.


    כנסיית גיאורגיוס הקדוש נוסדה במאה ה-9 בידי גריגול חנדזתלי. זו בזיליקה קטנה חד‑אולמית בעלת קמרון חבית,
    פשוטה מאוד מבחוץ; האפסיס חבוי בעובי הקיר המזרחי, ואולמות הכניסה בדרום ובמערב נוספו מאוחר יותר. בחצר
    עומד מגדל בן ארבע קומות שכתובת עליו נותנת תאריך מדויק, 1141, ומציינת את בונהו סימון צ'קונדידלי בימי
    המלך דמטרה הראשון. גם שרידי חומת ההיקף הם מן המאה ה-12.


    הסיבה לבוא נמצאת בפנים. כל חלל הכנסייה צויר בסוף המאה ה-14; הכתובות מזכירות את המורה גראסימה ואת תלמידו
    הצייר דמיאנה. התוכנית כוללת:


    - המשיח בהדרו על הקמרון, ותמונת השתדלות


    - הסעודה האחרונה והמולד, בהרכבים עמוסי דמויות באופן חריג


    - מחזור מחיי גיאורגיוס הקדוש, פטרון הכנסייה


    - עתיק היומין, נושא נדיר באיקונוגרפיה


    מומחים קוראים ביצירתו של דמיאנה מפגש של זרמים ביזנטיים, סרביים ורוסיים, אבל הפרופורציות המוארכות והפנים
    השקטות והמכונסות גאורגיות לגמרי. הצבע התכהה בשש מאות שנה, אך הסיפור עדיין נקרא בבירור.


    הכנסייה שוב מנזר פעיל; הנזירים מגדלים דבורים ומוכרים דבש ליד השער. בין המגדל, עצי האגוז הזקנים והיער
    שמאחור, החצר שקטה מאוד — אוביסי הוא אחד האתרים החשובים המעטים באימרתי שאוטובוסי תיירים כמעט אינם עוצרים
    בהם.
  tip: >-
    שעה מספיקה, אם כי ציורי הקיר ראויים ליותר. בפנים חשוך, ואין לצלם בלי לשאול נזיר. כללי הלבוש נאכפים:
    נשים זקוקות למטפחת ולחצאית ארוכה, ושתיהן מונחות ליד הדלת. השביל בחצר מרוצף ומטפס מעט, ולא נוח לעגלת
    ילדים. אין כאן בית קפה או חנות — הקרובים ביותר בחראגאולי או בזסטפוני. שירותים נמצאים בפינת החצר. בחורף
    הכנסייה אינה מחוממת וקרה באמת.
  route: >-
    מטביליסי נוסעים מערבה בכביש E60 דרך גורי וחשורי ובמקטע ריקוטי המחודש. אחרי המעבר הכביש יורד אל עמק
    דזירולה, ושילוט לאוביסי מפנה שמאלה אל הדרך הישנה — כ‑170 ק״מ בסך הכול, שעתיים וחצי. שני הקילומטרים
    האחרונים הם רחוב כפרי צר אך סלול. תדלקו בחשורי או בזסטפוני. ליד שער המנזר יש חניון קטן וחינמי. רכב
    חסכוני מתאים לכל השנה.
ar:
  name: دير أوبيسي
  short: >-
    دير القديس جيورجي من القرن التاسع في وادي دزيرولا، يحتفظ بدورة شبه كاملة من الرسوم الجدارية من القرن
    الرابع عشر.
  body: >-
    **أوبيسي من الأماكن القليلة التي بقي فيها التصوير الجورجي الوسيط سليماً تقريباً.** يقوم الدير على
    منحدر مشجر في وادي دزيرولا شمال غرب خاراغاولي، ولا يكاد يُرى من الطريق.


    أسّس كنيسة القديس جيورجي في القرن التاسع غريغول خاندزتيلي. وهي بازيليكا صغيرة ذات صحن واحد وقبو أسطواني،
    بسيطة من الخارج؛ والحنية مخبأة في سُمك الجدار الشرقي، وأُضيف الرواقان الجنوبي والغربي لاحقاً. وفي
    الفناء برج من أربعة طوابق يحمل نقشاً يعطي تاريخاً دقيقاً هو 1141 ويسمّي بانيه سيمون تشكونديدلي في
    عهد الملك ديمتري الأول. وشظايا سور الدير أيضاً من القرن الثاني عشر.


    لكن سبب الزيارة في الداخل. فقد صُوّر الفراغ الداخلي كله في أواخر القرن الرابع عشر، وتذكر الكتابات
    المعلم غيراسيمه وتلميذه المصوّر داميانه. ويشمل البرنامج:


    - المسيح في مجده على القبو، ومشهد الشفاعة


    - العشاء الأخير والميلاد، بتكوينات مزدحمة على غير المألوف


    - دورة من سيرة القديس جيورجي، شفيع الكنيسة


    - القديم الأيام، وهو موضوع نادر في الأيقونوغرافيا


    يقرأ المختصون عمل داميانه بوصفه التقاءً لتيارات بيزنطية وصربية وروسية، غير أن النسب الممشوقة والوجوه
    الهادئة المنطوية جورجية تماماً. وقد اغمقت الألوان عبر ستة قرون، لكن السرد ما زال واضح القراءة.


    الكنيسة اليوم دير عامل؛ يربّي الرهبان النحل ويبيعون العسل عند البوابة. وبين البرج وأشجار الجوز المعمرة
    والغابة خلفها، يظل الفناء هادئاً جداً — فأوبيسي من المواقع المهمة القليلة في إيميريتي التي نادراً
    ما تتوقف عندها حافلات السياح.
  tip: >-
    ساعة تكفي، وإن كانت الجداريات تستحق أكثر. الداخل مظلم، ولا يُسمح بالتصوير قبل سؤال أحد الرهبان. وقواعد
    اللباس مطبّقة: تحتاج النساء إلى غطاء رأس وتنورة طويلة، وكلاهما موضوع عند الباب. الممر في الفناء مرصوف
    وفيه صعود خفيف، وهو متعب مع عربة أطفال. لا مقهى ولا متجر هنا، وأقربها في خاراغاولي أو زستافوني. توجد
    دورة مياه في ركن الفناء. وفي الشتاء الكنيسة بلا تدفئة وباردة فعلاً.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً عبر غوري وخاشوري ومقطع ريكوتي المعاد بناؤه. بعد الممر تهبط الطريق
    إلى وادي دزيرولا، وتحوّلك لافتة أوبيسي يساراً إلى الطريق القديم — نحو 170 كم إجمالاً، ساعتان ونصف.
    الكيلومتران الأخيران شارع قروي ضيق لكنه معبّد. تزوّد بالوقود في خاشوري أو زستافوني. وعند بوابة الدير
    موقف صغير مجاني. وسيارة اقتصادية تكفي طوال العام.
