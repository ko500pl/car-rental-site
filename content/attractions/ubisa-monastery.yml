ka:
  name: უბისის მონასტერი
  short: >-
    IX საუკუნის მონასტერი ძირულის ხეობაში — XIV საუკუნის ფრესკებითა და 1141 წლის კოშკით, რომელიც მეფის
    მწიგნობართუხუცესმა ააგო.
  body: >-
    **1141 წელს საქართველოს ერთ-ერთმა უძლიერესმა კაცმა აქ ოთხსართულიანი ქვის კოშკი აიშენა — ბუხრით, საპირფარეშოთი
    და წიგნებისთვის ამოჭრილი ღრმა ნიშებით.**


    ეს სიმონ ჭყონდიდელი იყო. დავით აღმაშენებლის დროიდან ჭყონდიდელი ეპისკოპოსი, ჩვეულებრივ, მწიგნობართუხუცესიც
    იყო — მეფის შემდეგ პირველი კაცი სამეფოში. სიმონის წარწერა კოშკს დავითის ძის, დემეტრე I-ის მეფობით
    ათარიღებს. კოშკი თითქმის გადაუკეთებლად შემორჩა: ქვემოთ საკუჭნაოა, მის ზემოთ ბუხრიანი საცხოვრებელი
    ოთახი, კიდევ უფრო მაღლა სალოცავი და სამუშაო სენაკი, თავზე კი თავდაცვითი სართული. მკვლევრები ვარაუდობენ,
    რომ სიცოცხლის ბოლო წლები სიმონმა სწორედ აქ გაატარა.


    მონასტერი კოშკზე სამი საუკუნით ძველია. IX საუკუნეში ის გრიგოლ ხანძთელმა და მისმა მოწაფეებმა დააარსეს.
    გიორგი მერჩულე გვიამბობს, რომ გრიგოლმა მონასტერს „უბე“ უწოდა და წინამძღვრად იერუსალიმიდან მოსული მოხუცი
    ილარიონი დაადგინა. მოგვიანებით ხალხურმა ლექსმა ტაძრის დასრულება თამარ მეფეს მიაწერა — ეს გადმოცემაა
    და არა მატიანე.


    მთავარი საუნჯე კი შიგნითაა. XIV საუკუნეში, გიორგი ბრწყინვალის მეფობისას, ტაძარი მთლიანად მოიხატა.
    შალვა ამირანაშვილი მხატვრობას დამიანეს მიაწერდა, ვახტანგ ბერიძე კი — მის აღზრდილსა და მოწაფეს, გერასიმეს.
    ვისიც არ უნდა ყოფილიყო ფუნჯი, დააკვირდით:


    - საიდუმლო სერობა — ხალხმრავალი და ამავე დროს შინაური

    - წმინდა გიორგი, ტაძრის მფარველი, თავისთავად სახელგანთქმული ფრესკა

    - „ძველი დღეთა“ — სიუჟეტი, რომელიც ქართულ მხატვრობაში იშვიათად გვხვდება


    ექვსმა საუკუნემ ფერები ჩააქრო, სახეები კი კიდევ უფრო დაადუმა. ბერები ფუტკარს უვლიან და უბისის თაფლი
    ერთადერთი სუვენირია, რომლის შინ წაღებაც ნამდვილად ღირს.
  tip: >-
    ერთი საათი საკმარისია, თუმცა ფრესკები მეტს იმსახურებს. ტაძარში ბინდია: სანამ მხატვრობაზე აზრს შეიქმნით,
    თვალს ერთი წუთი აცალეთ, ფოტოს გადაღებამდე კი ბერს ჰკითხეთ. ჩაცმა თავშეკავებული უნდა იყოს: ქალები თავს
    იფარავენ და ქვედაბოლოს იცვამენ, მოსასხამები ჩვეულებრივ კართან აწყვია. შესვლა უფასოა. კაფე აქ არ არის
    — საჭმელი და მაღაზიები ხარაგაულსა და ზესტაფონშია. ზამთარში ტაძარი გაუთბობელი და მართლაც ცივია. ეზოში
    რამდენიმე ნაბიჯით უკან დაიხიეთ და კოშკის ზედა სარკმლებსა და თავდაცვითი სართულის ღიობებს შეხედეთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადადიხართ.
    უღელტეხილის შემდეგ, როცა გზა ძირულის ხეობას ჩაუყვება, მაგისტრალიდან ძველ გზაზე (შ213) გადაუხვიეთ,
    სადაც უბისის მაჩვენებელია; მონასტერი სოფლის ჩრდილო-აღმოსავლეთით დგას. სულ დაახლოებით 170 კმ-ია და
    ორსაათნახევრიანი სავალი, მთლიანად ასფალტზე; ბოლო ორიოდე კილომეტრი ვიწრო სოფლის გზაა. საწვავი ხაშურში
    ან ზესტაფონში ჩაასხით. ჭიშკართან პარკინგი უფასოა. ეკონომ კლასის მანქანა მთელი წელი საკმარისია, ხარაგაული
    კი, ბორჯომ-ხარაგაულის ეროვნული პარკის კარიბჭე, სულ ახლოსაა.
en:
  name: Ubisa Monastery
  short: >-
    A 9th-century monastery in the Dzirula valley, with 14th-century frescoes and a tower-house of 1141
    built by the kingdom's grand chancellor.
  body: >-
    **In 1141 one of the most powerful men in Georgia built himself a four-storey stone tower here, with
    a fireplace, a latrine and deep niches for his books.**


    He was Simon Chkondideli. From the time of David the Builder, the bishop of Chkondidi usually also
    served as grand chancellor, second only to the king, and Simon's inscription on the tower dates it
    to the reign of David's son, Demetre I. The tower survives almost unaltered: a storeroom at the bottom,
    a living room with its hearth above, a room for prayer and work higher still, and a defensive storey
    on top. Scholars believe Simon spent his last years in it.


    The monastery is three centuries older. Grigol Khandzteli and his disciples founded it in the 9th
    century, and his biographer Giorgi Merchule records that Grigol named it Ube and set an old man from
    Jerusalem, Ilarion, over it as abbot. Folk verse later credited Queen Tamar with finishing the church;
    that is tradition, not chronicle.


    The real treasure is inside. In the 14th century, under King Giorgi V the Brilliant, the whole interior
    was painted. Shalva Amiranashvili attributed the murals to the painter Damiane; Vakhtang Beridze argued
    they were the work of Damiane's pupil, Gerasime. Whoever held the brush, look for:


    - the Last Supper, crowded and yet intimate

    - St George, the church's patron, in a fresco famous in its own right

    - the Ancient of Days, an unusual subject in Georgian painting


    Six centuries have darkened the colours and made the faces quieter still. The monks keep bees, and
    a jar of Ubisa honey is the one souvenir worth carrying home.
  tip: >-
    An hour is enough, though the frescoes reward more. The church is dim inside, so give your eyes a
    minute before judging the paintings, and ask a monk before taking photographs. Modest dress is expected:
    women cover their heads and wear a skirt, and wraps are usually left by the door. Entry is free. There
    is no café; food and shops are in Kharagauli or Zestaponi. In winter the church is unheated and genuinely
    cold. Step back across the yard to see the tower's upper windows and the openings of its defensive
    top storey.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri and over the Rikoti Pass. Beyond the pass,
    as the highway runs down the Dzirula valley, turn off onto the old road (Sh213) where it is signed
    for Ubisa; the monastery stands just north-east of the village. It is about 170 km and two and a half
    hours, paved all the way, and the last couple of kilometres are a narrow village lane. Refuel in Khashuri
    or Zestaponi. Parking by the gate is free. An economy car is fine all year, and Kharagauli, gateway
    to the Borjomi-Kharagauli National Park, is close by.
ru:
  name: Монастырь Убиси
  short: >-
    Монастырь IX века в долине Дзирулы, с фресками XIV века и башней-домом 1141 года, построенной великим
    канцлером царства.
  body: >-
    **В 1141 году один из самых влиятельных людей Грузии выстроил здесь для себя четырёхэтажную каменную
    башню — с камином, отхожим местом и глубокими нишами для книг.**


    Это был Симон Чкондидели. Со времён Давида Строителя епископ Чкондидский обычно одновременно занимал
    должность великого канцлера, второго лица после царя, и надпись Симона на башне датирует её правлением
    сына Давида, Деметре I. Башня сохранилась почти без изменений: кладовая внизу, жилая комната с очагом
    над ней, помещение для молитвы и трудов ещё выше, и оборонительный этаж на самом верху. Учёные полагают,
    что Симон провёл здесь последние годы жизни.


    Монастырь на три века старше. Григол Хандзтели и его ученики основали его в IX веке, и его биограф
    Георгий Мерчуле пишет, что Григол назвал место Убе и поставил над ним настоятелем старца из Иерусалима,
    Илариона. Народная поэзия позже приписывала завершение храма царице Тамар — это предание, а не летопись.


    Настоящее сокровище — внутри. В XIV веке, при царе Георгии V Блистательном, весь интерьер был расписан.
    Шалва Амиранашвили приписывал росписи художнику Дамиане; Вахтанг Беридзе утверждал, что это работа
    ученика Дамиане, Герасиме. Кто бы ни держал кисть, обратите внимание на:


    - Тайную вечерю, многолюдную и всё же исполненную близости

    - святого Георгия, покровителя храма, во фреске, знаменитой сама по себе

    - Ветхого днями — сюжет, редкий для грузинской живописи


    Шесть веков приглушили краски и сделали лица ещё тише. Монахи держат пчёл, и банка убисского мёда
    — единственный сувенир, который стоит везти домой.
  tip: >-
    Часа достаточно, хотя фрески заслуживают большего. Внутри храма темно, так что дайте глазам минуту
    привыкнуть, прежде чем судить о живописи, и спросите монаха, прежде чем фотографировать. Ожидается
    скромная одежда: женщинам платок и юбка, накидки обычно лежат у входа. Вход бесплатный. Кафе здесь
    нет; еда и магазины — в Харагаули или Зестафони. Зимой храм не отапливается и по-настоящему холоден.
    Отойдите через двор назад, чтобы разглядеть верхние окна башни и бойницы её оборонительного этажа.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад через Гори и Хашури, через Рикотский перевал. За перевалом,
    где шоссе спускается по долине Дзирулы, сверните на старую дорогу (Ш213) там, где указан поворот на
    Убиси; монастырь стоит к северо-востоку от села. Всего около 170 км и два с половиной часа, весь путь
    асфальтирован, последние два километра — узкая сельская дорога. Заправляйтесь в Хашури или Зестафони.
    Парковка у ворот бесплатная. Машина эконом-класса подходит в любое время года, а Харагаули, ворота
    в Национальный парк Боржоми-Харагаули, совсем рядом.
fa:
  name: صومعه اوبیسی
  short: >-
    صومعه‌ای از سده‌ی نهم در دره‌ی دزیرولا، با نگاره‌های دیواری سده‌ی چهاردهم و برج-خانه‌ای از سال ۱۱۴۱
    که به دست صدراعظم بزرگ پادشاهی ساخته شد.
  body: >-
    **در سال ۱۱۴۱، یکی از قدرتمندترین مردان گرجستان برای خود برجی سنگی چهارطبقه در این‌جا ساخت، با شومینه،
    مستراح، و طاقچه‌های عمیقی برای کتاب‌هایش.**


    او سیمون چقوندیدلی بود. از زمان داوود سازنده، اسقف چقوندیدی معمولاً هم‌زمان صدراعظم بزرگ نیز بود،
    دومین مقام پس از پادشاه، و کتیبه‌ی سیمون بر برج، ساخت آن را به دوران فرمانروایی پسر داوود، دمتره اول،
    می‌رساند. برج تقریباً بدون تغییر باقی مانده: انباری در پایین، اتاق نشیمنی با بخاری‌اش بالاتر، اتاقی
    برای نیایش و کار بالاتر از آن، و طبقه‌ای دفاعی در بالاترین نقطه. دانشمندان بر این باورند که سیمون
    سال‌های پایانی زندگی‌اش را در آن گذرانده است.


    صومعه سه قرن کهن‌تر است. گریگول خاندزتلی و شاگردانش آن را در سده‌ی نهم بنیاد نهادند، و زندگی‌نامه‌نویسش،
    گئورگی مرچوله، ثبت می‌کند که گریگول این‌جا را اوبه نامید و پیرمردی از اورشلیم، ایلاریون، را به ریاست
    آن گمارد. شعر عامیانه بعدها اتمام کلیسا را به ملکه تامار نسبت داد؛ این روایتی عامیانه است، نه تاریخ
    مکتوب.


    گنجینه‌ی راستین در درون است. در سده‌ی چهاردهم، در دوران پادشاه گئورگی پنجم درخشان، سراسر درون کلیسا
    نگاره‌کاری شد. شالوا امیراناشویلی این نگاره‌ها را به نگارگر دامیانه نسبت داد؛ وختانگ بریدزه استدلال
    کرد که کار شاگرد دامیانه، گراسیمه، است. قلم‌مو در دست هر که بود، این‌ها را بجویید:


    - شام آخر، پرجمعیت و در عین حال صمیمی

    - قدیس گئورگی، حامی کلیسا، در نگاره‌ای که خود به‌تنهایی شهره است

    - قدیم‌الایام، موضوعی کم‌یاب در نقاشی گرجی


    شش قرن رنگ‌ها را کم‌رنگ‌تر و چهره‌ها را آرام‌تر کرده است. راهبان زنبورداری می‌کنند، و شیشه‌ای عسل
    اوبیسی تنها یادگاری‌ست که ارزش با خود بردن دارد.
  tip: >-
    یک ساعت کافی است، هرچند نگاره‌ها بیش از این ارزش دارند. درون کلیسا تاریک است، پس پیش از قضاوت درباره‌ی
    نگاره‌ها یک دقیقه به چشمانتان مهلت دهید، و پیش از عکس‌گرفتن از راهبی اجازه بگیرید. پوشش محتشمانه انتظار
    می‌رود: زنان روسری سر می‌کنند و دامن می‌پوشند، و معمولاً کنار در پوشش‌هایی گذاشته شده است. ورود رایگان
    است. کافه‌ای این‌جا نیست؛ خوراک و مغازه‌ها در خاراگائولی یا زستافونی است. زمستان کلیسا گرم نمی‌شود
    و به‌راستی سرد است. در حیاط چند قدم عقب بروید تا پنجره‌های بالایی برج و روزنه‌های طبقه‌ی دفاعی آن
    را ببینید.
  route: >-
    از تفلیس از مسیر S1 (E60) به سوی غرب بروید و از گوری، خاشوری و گردنه‌ی ریکوتی بگذرید. آن‌سوی گردنه،
    جایی که بزرگراه از دره‌ی دزیرولا پایین می‌رود، به راه قدیمی (Sh213) بپیچید، جایی که تابلوی اوبیسی
    نصب است؛ صومعه درست در شمال‌شرقی روستا ایستاده است. حدود ۱۷۰ کیلومتر و دو ساعت و نیم است، همه بر آسفالت،
    و دو کیلومتر پایانی راهی باریک روستایی است. در خاشوری یا زستافونی سوخت‌گیری کنید. پارکینگ کنار دروازه
    رایگان است. خودرویی معمولی در همه‌ی فصل‌ها کافی است، و خاراگائولی، دروازه‌ی پارک ملی بورجومی-خاراگائولی،
    نزدیک است.
he:
  name: מנזר אוביסי
  short: מנזר מהמאה ה-9 בעמק דזירולה, עם ציורי קיר מהמאה ה-14 ומגדל-בית משנת 1141 שבנה הקנצלר הגדול של
    הממלכה.
  body: >-
    **ב-1141 בנה לעצמו אחד האנשים החזקים ביותר בגאורגיה מגדל אבן בן ארבע קומות, עם אח, בית שימוש וגומחות
    עמוקות לספריו.**


    הוא היה סימון צ'קונדידלי. מזמנו של דוד הבונה, שימש בישוף צ'קונדידי בדרך כלל גם כקנצלר הגדול, שני בחשיבותו
    רק למלך, וכתובתו של סימון על המגדל מתארכת אותו לימי בנו של דוד, דמטרה הראשון. המגדל שרד כמעט ללא שינוי:
    מחסן בתחתית, מעליו חדר מגורים ובו אח, חדר לתפילה ולעבודה גבוה יותר, וקומת הגנה בראש. חוקרים סוברים
    שסימון בילה בו את שנותיו האחרונות.


    המנזר עתיק יותר בשלוש מאות שנה. גריגול חנדזטלי ותלמידיו הקימו אותו במאה ה-9, והביוגרף שלו, גיאורגי
    מרצ'ולה, מספר שגריגול קרא לו אובה והעמיד עליו כראש מנזר זקן מירושלים, אילריון. שירה עממית מייחסת מאוחר
    יותר את השלמת הכנסייה למלכה תמר; זו מסורת, לא כרוניקה.


    האוצר האמיתי נמצא בפְנים. במאה ה-14, בימי המלך גיאורגי החמישי הזוהר, צויר כל הפְנים. שלווה אמירנשווילי
    ייחס את הציורים לצייר דמיאנה; ואחטנג ברידזה טען שהם עבודתו של תלמידו של דמיאנה, גרסימה. יהיה מי שיהיה
    שהחזיק במכחול, חפשו:


    - הסעודה האחרונה, צפופה ועם זאת אינטימית

    - גיאורגי הקדוש, פטרון הכנסייה, בפרסקו המפורסם בזכות עצמו

    - עתיק הימים, נושא נדיר בציור הגאורגי


    שש מאות שנים החשיכו את הצבעים והשקיטו עוד יותר את הפנים. הנזירים מגדלים דבורים, וצנצנת דבש אוביסי
    היא המזכרת האחת ששווה לשאת הביתה.
  tip: >-
    שעה מספיקה, אף שהציורים ראויים ליותר. הכנסייה חשוכה בפְנים, אז תנו לעיניים דקה לפני שתשפטו את הציורים,
    ובקשו רשות מנזיר לפני צילום. נדרש לבוש צנוע: לנשים מטפחת ראש וחצאית, כיסויים מונחים לרוב ליד הדלת.
    הכניסה חינם. אין בית קפה כאן; אוכל וחנויות בחרגאולי או בזסטפוני. בחורף הכנסייה לא מחוממת וקרה באמת.
    התרחקו כמה צעדים לאחור בחצר כדי לראות את חלונות המגדל העליונים ואת פתחי קומת ההגנה שלו.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה דרך גורי וחשורי ודרך מעבר ריקותי. אחרי המעבר, כשהכביש המהיר יורד
    בעמק דזירולה, פנו לכביש הישן (Sh213) במקום המסומן לאוביסי; המנזר עומד ממש מצפון-מזרח לכפר. כ-170 ק"מ
    ושעתיים וחצי, אספלט כל הדרך, ושני הקילומטרים האחרונים הם דרך כפרית צרה. תדלקו בחשורי או בזסטפוני.
    החניה ליד השער חינם. רכב חסכוני מתאים בכל עונה, וחרגאולי, שער הגן הלאומי בורז'ומי-חרגאולי, קרוב.
ar:
  name: دير أوبيسي
  short: >-
    دير من القرن التاسع في وادي دزيرولا، بجداريات من القرن الرابع عشر وبرج-منزل من عام 1141 بناه كبير
    مستشاري المملكة.
  body: >-
    **عام 1141 بنى لنفسه أحد أقوى رجال جورجيا برجًا حجريًا من أربع طبقات، فيه مدفأة ومرحاض وحنيات عميقة
    لكتبه.**


    كان ذلك الرجل سيمون تشقونديديلي. منذ عهد داود البنّاء، كان أسقف تشقونديدي يشغل غالبًا أيضًا منصب كبير
    المستشارين، أي الثاني بعد الملك، ونقش سيمون على البرج يؤرّخه بعهد ابن داود، ديمتري الأول. ظل البرج
    على حاله تقريبًا: مخزن في الأسفل، وغرفة معيشة بموقدها فوقه، وغرفة للصلاة والعمل أعلى منها، وطابق دفاعي
    في القمة. يرى الباحثون أن سيمون قضى فيه سنواته الأخيرة.


    الدير أقدم بثلاثة قرون. أسسه غريغول خاندزتيلي وتلاميذه في القرن التاسع، ويروي كاتب سيرته جيورجي ميرتشوله
    أن غريغول سمّاه أوبه وأقام عليه شيخًا من القدس، إيلاريون، رئيسًا للدير. نسب شعر شعبي لاحقًا إتمام
    الكنيسة إلى الملكة تامار؛ وهذه رواية شعبية لا سجل تاريخي.


    الكنز الحقيقي في الداخل. في القرن الرابع عشر، في عهد الملك جورجي الخامس البهي، زُيّنت الكنيسة كلها
    من الداخل بالرسوم. نسب شالفا أميرنشفيلي الرسوم إلى الرسام دميانه؛ بينما رأى فاختانغ بريدزه أنها عمل
    تلميذ دميانه، غيراسيمه. أيًّا كان من حمل الفرشاة، انظر إلى:


    - العشاء الأخير، المزدحم والحميم في آن

    - القديس جورج، شفيع الكنيسة، في جدارية مشهورة بذاتها

    - قديم الأيام، موضوع نادر في الرسم الجورجي


    أخمدت ستة قرون الألوان وأسكتت الوجوه أكثر. يربّي الرهبان النحل، ومرطبان من عسل أوبيسي هو الهدية التذكارية
    الوحيدة التي تستحق أن تُحمَل إلى البيت.
  tip: >-
    تكفي ساعة، مع أن الجداريات تستحق أكثر. الكنيسة معتمة من الداخل، فأعطِ عينيك دقيقة قبل الحكم على الرسوم،
    واستأذن راهبًا قبل التصوير. يُتوقع لباس محتشم: غطاء رأس وتنورة للنساء، وتوجد أغطية للرأس عادةً عند
    الباب. الدخول مجاني. لا مقهى هنا؛ الطعام والمتاجر في خاراغاولي أو زستافوني. في الشتاء لا تُدفَّأ الكنيسة
    وتكون باردة حقًا. تراجع بضع خطوات عبر الفناء لترى نوافذ البرج العلوية وفتحات طابقه الدفاعي.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري وممر ريكوتي. بعد الممر، حيث ينحدر الطريق السريع
    في وادي دزيرولا، انعطف إلى الطريق القديم (Sh213) عند اللافتة المؤدية إلى أوبيسي؛ يقع الدير شمال شرق
    القرية مباشرة. نحو 170 كم وساعتان ونصف، معبّد بالكامل، والكيلومتران الأخيران طريق قروي ضيق. عبّئ الوقود
    في خاشوري أو زستافوني. الموقف عند البوابة مجاني. سيارة اقتصادية تكفي في كل الفصول، وخاراغاولي، بوابة
    حديقة بورجومي-خاراغاولي الوطنية، قريبة.
