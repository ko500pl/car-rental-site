ka:
  name: ჯუმა მეჩეთი
  short: >-
    ძველი თბილისის ერთადერთი შემორჩენილი მეჩეთი ნარიყალას ძირას: წითელი აგური, რვაწახნაგა მინარეთი, ორი
    მიჰრაბი და ერთ დარბაზში მლოცველი სუნიტები და შიიტები.
  body: >-
    **ოდესღაც ჯუმა მეჩეთის სალოცავ დარბაზს ფარდა ყოფდა — ერთ მხარეს სუნიტები ლოცულობდნენ, მეორეზე შიიტები.
    1996 წლიდან ისინი ერთად ლოცულობენ.**


    თბილისში მუსლიმები VII საუკუნის არაბთა დაპყრობიდან ცხოვრობენ და ქალაქში ოდესღაც ბევრი მეჩეთი იდგა.
    ძველ თბილისში დღეს მხოლოდ ეს დარჩა, მისი ისტორია კი მშენებლებისა და დამანგრევლების ესტაფეტას ჰგავს.
    ოსმალებმა ნარიყალას ძირას მეჩეთი 1723–1735 წლებში ააგეს; 1740-იან წლებში სპარსელებმა დაანგრიეს; 1846–1851
    წლებში იტალიელმა არქიტექტორმა ჯოვანი სკუდიერიმ აღადგინა, 1895 წელს კი აზერბაიჯანელმა ნავთობმრეწველმა
    ზეინალაბდინ თაღიევმა დღევანდელი, წითელი აგურის შენობა დააფინანსა. სხვა, უფრო ძველ შიიტურ მეჩეთს მეიდანთან,
    1522–1524 წლებში შაჰ-ისმაილ I-ის მფარველობით აგებულს, ბედმა არ გაუღიმა: 1950 წელს მეტეხის ხიდის მშენებლობისას
    დაანგრიეს.


    თაღიევის მეჩეთი უცნაური ნაზავია: ნეოგოთიკური თაღოვანი სარკმლები თბილ წითელ აგურში, ბოტანიკურის ქუჩის
    თავზე აზიდული რვაწახნაგა მინარეთი, ფერადი მოზაიკა გარეთაც და შიგნითაც. დარბაზში ორი მიჰრაბია — მექისკენ
    მიმართული სალოცავი ნიშა: ერთი ოთახი ორი ტრადიციისთვის. სახელიც ამასვე ამბობს: „ჯუმა“ პარასკევია, საერთო
    ლოცვის დღე.


    1998 წელს შენობა აღადგინეს. დღესაც აქ იკრიბებიან პარასკევის ლოცვაზე, ორაზა-ბაირამსა და ყურბან-ბაირამზე
    — უმეტესად თბილისელი აზერბაიჯანელები. გარეთ გამოსულს ორიოდე წუთის სავალზე მდებარე აბანოების გოგირდის
    სუნი დაგხვდებათ; ახლოს სინაგოგაც დგას და მართლმადიდებლური ეკლესიებიც, ყველას კი ზემოდან ნარიყალა დაჰყურებს.


    ქალაქში, რომელსაც მეზობლები არაერთხელ წვავდნენ და რომელიც ყოველ ჯერზე ფერფლიდან აღდგებოდა, ეს პატარა
    აგურის მეჩეთი უფრო წყნარ არგუმენტს გვთავაზობს: ადამიანებს, რომლებიც ერთმანეთს არ ეთანხმებიან, ერთი
    ჭერის გაზიარება მაინც შეუძლიათ.
  tip: >-
    შესვლა უფასოა; პატივისცემით მოსულ სტუმრებს შიგნით შესვლა ლოცვის საათებს გარეთ შეუძლიათ, პარასკევის
    შუადღის ლოცვას კი აჯობებს მოერიდოთ. ჩაიცვით მხრებისა და მუხლების დამფარავი ტანსაცმელი, ქალებმა თავსაფარი
    თან იქონიონ, შესასვლელთან ფეხსაცმელი გაიხადეთ. მლოცველებს ნუ გადაუღებთ, დარბაზში კი ფოტოს გადაღებამდე
    ნებართვა ითხოვეთ. ოცი-ოცდაათი წუთი საკმარისია. გოგირდის აბანოები ორ წუთშია, ნარიყალა პირდაპირ თავზე
    დგას, ამიტომ მეჩეთი ძველი ქალაქის ნებისმიერ გასეირნებას ბუნებრივად ერწყმის.
  route: >-
    მეჩეთი ძველი ქალაქის გულში, აბანოთუბანში, ბოტანიკურის ქუჩაზე დგას, თავისუფლების მოედნიდან დაახლოებით
    2 კმ-ში. მანქანით ეს ათიოდე წუთია, მაგრამ აბანოთუბნის ვიწრო, ნაწილობრივ ქვაფენილიანი და საფეხმავლო
    ქუჩები მანქანისთვის არ არის: დატოვეთ ის ძველი ქალაქის კიდეზე, მეიდნის (გორგასლის მოედნის) მიდამოებში,
    და ფეხით შედით. თავისუფლების მოედნიდან ფეხით 15–20 წუთია — კოტე აფხაზის ქუჩით მეიდნამდე, შემდეგ აბანოებს
    გაუარეთ და ბოტანიკურის ქუჩაზე ახვედით. ეკონომ კლასის მანქანა სავსებით საკმარისია, საწვავზე ფიქრი კი
    საჭირო არ არის.
en:
  name: Juma Mosque, Tbilisi
  short: >-
    Old Tbilisi's last surviving mosque, at the foot of Narikala: red brick, an octagonal minaret, two
    mihrabs, and Sunnis and Shias praying in one hall.
  body: >-
    **A curtain once divided the prayer hall of the Juma Mosque — Sunnis on one side, Shias on the other.
    Since 1996 they have prayed together.**


    Muslims have lived in Tbilisi since the Arab conquest of the 7th century, and the city once had many
    mosques. This is the only one left in the Old Town, and its history reads like a relay of builders
    and wreckers. The Ottomans raised a mosque here, at the foot of Narikala, between 1723 and 1735; Persian
    forces destroyed it in the 1740s; the Italian architect Giovanni Scudieri rebuilt it in 1846–51; and
    in 1895 the Azerbaijani oil magnate Zeynalabdin Taghiyev paid for the red-brick building that stands
    today. An older Shia mosque near Meidan, built in 1522–24 under Shah Ismail I, was less lucky: it
    was pulled down in 1950 to make way for the Metekhi Bridge.


    Taghiyev's mosque is a curious hybrid — Neo-Gothic arched windows in warm red brick, an octagonal
    minaret rising over Botanical Street, colourful mosaics inside and out. In the hall there are two
    mihrabs, the niches that point towards Mecca: one room, arranged for two traditions. Even the name
    fits: *juma* is Friday, the day of congregational prayer.


    Restored in 1998, the mosque still fills for Friday prayers and for Eid al-Fitr and Eid al-Adha, mostly
    with Tbilisi's Azerbaijani community. Step outside and the sulphur of the bathhouses, a couple of
    minutes away, hangs in the lane; a synagogue and Orthodox churches stand within a short walk, and
    Narikala looks down on all of them.


    In a city its neighbours burned more than once, and which rose again each time, this small brick mosque
    makes a quieter argument: people who disagree can still share a roof.
  tip: >-
    Entry is free, and respectful visitors may go in outside prayer times; avoid the Friday midday prayer.
    Cover shoulders and knees, women should bring a headscarf, and shoes come off at the door. Do not
    photograph people at prayer, and ask before taking pictures inside. Twenty to thirty minutes is enough.
    The sulphur baths are two minutes' walk away and Narikala Fortress rises directly above, so the mosque
    fits naturally into any Old Town walk.
  route: >-
    The mosque stands on Botanikuri (Botanical) Street in Abanotubani, in the heart of the Old Town, about
    2 km from Freedom Square. By car that is around ten minutes, but the narrow, partly cobbled and pedestrianised
    lanes of Abanotubani are no place for one: park at the edge of the Old Town, around Meidan (Gorgasali
    Square), and walk in. On foot from Freedom Square it takes 15–20 minutes — down Kote Afkhazi Street
    to Meidan, past the bathhouses and up into Botanikuri Street. An economy car is all you need, and
    fuel is no concern.
ru:
  name: Джума-мечеть, Тбилиси
  short: >-
    Последняя уцелевшая мечеть Старого Тбилиси у подножия Нарикалы: красный кирпич, восьмигранный минарет,
    два михраба и сунниты с шиитами в одном зале.
  body: >-
    **Когда-то молельный зал Джума-мечети делила занавеска: по одну сторону — сунниты, по другую — шииты.
    С 1996 года они молятся вместе.**


    Мусульмане живут в Тбилиси со времён арабского завоевания VII века, и мечетей в городе когда-то было
    много. Эта — единственная, что осталась в Старом городе, и её история похожа на эстафету строителей
    и разрушителей. Османы возвели здесь, у подножия Нарикалы, мечеть в 1723–1735 годах; в 1740-х её разрушили
    персидские войска; в 1846–1851 годах её отстроил итальянский архитектор Джованни Скудиери; а в 1895
    году азербайджанский нефтяной магнат Зейналабдин Тагиев оплатил то краснокирпичное здание, что стоит
    сегодня. Более древней шиитской мечети у Мейдана, построенной в 1522–1524 годах при шахе Исмаиле I,
    повезло меньше: в 1950 году её снесли ради Метехского моста.


    Мечеть Тагиева — любопытный гибрид: неоготические стрельчатые окна в тёплом красном кирпиче, восьмигранный
    минарет над Ботанической улицей, яркая мозаика снаружи и внутри. В зале два михраба — ниши, указывающие
    направление на Мекку: одно помещение, устроенное для двух традиций. Даже название под стать: *джума*
    — это пятница, день общей молитвы.


    Отреставрированная в 1998 году, мечеть по-прежнему заполняется на пятничную молитву, на Ураза-байрам
    и Курбан-байрам — в основном прихожанами из тбилисской азербайджанской общины. Выйдите наружу: в переулке
    висит серный дух бань, до которых пара минут; синагога и православные церкви — в нескольких шагах,
    а Нарикала смотрит сверху на всех.


    В городе, который соседи не раз сжигали и который не раз отстраивался заново, эта небольшая кирпичная
    мечеть приводит довод потише: несогласные могут жить под одной крышей.
  tip: >-
    Вход свободный, и вне времени молитвы уважительных посетителей пускают внутрь; избегайте пятничной
    полуденной молитвы. Плечи и колени должны быть закрыты, женщинам стоит взять платок, обувь снимают
    у входа. Не фотографируйте молящихся и спрашивайте разрешения, прежде чем снимать внутри. Двадцати–тридцати
    минут хватит. Серные бани — в двух минутах ходьбы, а крепость Нарикала поднимается прямо над головой,
    так что мечеть естественно вписывается в любую прогулку по Старому городу.
  route: >-
    Мечеть стоит на Ботанической улице (Ботаникури) в Абанотубани, в самом сердце Старого города, примерно
    в 2 км от площади Свободы. На машине это минут десять, но узкие, местами мощёные и пешеходные переулки
    Абанотубани не для автомобиля: оставьте его на краю Старого города, в районе Мейдана (площади Горгасали),
    и дальше идите пешком. От площади Свободы пешком 15–20 минут — вниз по улице Котэ Абхази до Мейдана,
    мимо бань и вверх на Ботаникури. Хватит эконом-класса, а о топливе можно не думать.
fa:
  name: مسجد جمعه‌ی تفلیس
  short: >-
    آخرین مسجد به‌جامانده در تفلیس قدیم، پای ناریکالا: آجر سرخ، مناره‌ای هشت‌ضلعی، دو محراب، و سنی و شیعه
    که در یک شبستان نماز می‌گزارند.
  body: >-
    **روزگاری پرده‌ای شبستان مسجد جمعه را دو نیم می‌کرد — سنی‌ها یک سو، شیعه‌ها سوی دیگر. از ۱۹۹۶ همه
    با هم نماز می‌خوانند.**


    مسلمانان از زمان فتوحات عرب در سده‌ی هفتم در تفلیس زندگی کرده‌اند، و شهر روزگاری مسجدهای بسیار داشت.
    این تنها مسجدی است که در شهر قدیم برجا مانده، و تاریخش به دست‌به‌دست شدن مشعل میان سازندگان و ویرانگران
    می‌ماند. عثمانی‌ها میان ۱۷۲۳ و ۱۷۳۵ این‌جا، پای ناریکالا، مسجدی برپا کردند؛ نیروهای ایرانی در دهه‌ی
    ۱۷۴۰ ویرانش کردند؛ معمار ایتالیایی، جووانی اسکودیری، در ۱۸۴۶–۱۸۵۱ آن را از نو ساخت؛ و در ۱۸۹۵ سرمایه‌دار
    نفتی آذربایجانی، زین‌العابدین تقی‌اف، هزینه‌ی بنای آجری سرخی را پرداخت که امروز برپاست. مسجد شیعی
    کهن‌تری در نزدیکی میدان، که در ۱۵۲۲–۱۵۲۴ در روزگار شاه اسماعیل یکم ساخته شده بود، بخت کمتری داشت:
    در ۱۹۵۰ آن را برای ساختن پل متخی فرو ریختند.


    مسجد تقی‌اف آمیزه‌ای شگفت است — پنجره‌های قوسی نئوگوتیک در آجر سرخ و گرم، مناره‌ای هشت‌ضلعی که بر
    فراز خیابان بوتانیکوری قد کشیده، و موزاییک‌های رنگارنگ در بیرون و درون. در شبستان دو محراب هست، دو
    طاق‌نمایی که رو به مکه دارند: یک تالار، آراسته برای دو سنت. حتی نامش به‌جاست: *جمعه* روز نماز جماعت
    است.


    مسجد که در ۱۹۹۸ مرمت شد، هنوز در نماز جمعه و در عید فطر و عید قربان پر می‌شود، بیشتر از جامعه‌ی آذربایجانی
    تفلیس. پا که بیرون بگذارید، بوی گوگرد گرمابه‌ها، که دو دقیقه بیشتر راه نیستند، در کوچه پیچیده است؛
    کنیسه‌ای و کلیساهای ارتدکس چند قدم آن‌سوترند، و ناریکالا از بالا بر همه‌شان می‌نگرد.


    در شهری که همسایگانش بیش از یک بار به آتشش کشیدند و هر بار دوباره از خاکستر برخاست، این مسجد کوچک
    آجری استدلالی آرام‌تر پیش می‌کشد: کسانی که هم‌رأی نیستند، هنوز می‌توانند زیر یک سقف باشند.
  tip: >-
    ورود رایگان است و بازدیدکنندگانِ باادب بیرون از وقت نماز می‌توانند وارد شوند؛ از نماز ظهر جمعه دوری
    کنید. شانه‌ها و زانوها پوشیده باشد، بانوان روسری همراه بیاورند، و کفش‌ها دم در درآورده می‌شود. از
    نمازگزاران عکس نگیرید و پیش از عکاسی در داخل اجازه بخواهید. بیست تا سی دقیقه کافی است. گرمابه‌های
    گوگردی دو دقیقه پیاده راه‌اند و دژ ناریکالا درست بالای سرتان سر برافراشته، پس مسجد به‌طور طبیعی در
    هر گشت پیاده‌ای در شهر قدیم جا می‌گیرد.
  route: >-
    مسجد در خیابان بوتانیکوری (خیابان گیاه‌شناسی) در آبانوتوبانی است، در دل شهر قدیم و حدود ۲ کیلومتر
    از میدان آزادی. با خودرو ده دقیقه‌ای راه است، اما کوچه‌های باریک، بخشی سنگ‌فرش و بخشی ویژه‌ی عابران
    پیاده‌ی آبانوتوبانی جای ماشین نیست: خودرو را در لبه‌ی شهر قدیم، حوالی میدان (میدان گرگسالی)، پارک
    کنید و پیاده بروید. پیاده از میدان آزادی ۱۵ تا ۲۰ دقیقه طول می‌کشد — از خیابان کوته آپخازی پایین بروید
    تا میدان، از کنار گرمابه‌ها بگذرید و به خیابان بوتانیکوری بالا بروید. یک خودروی اکونومی کافی است و
    سوخت دغدغه‌ای نیست.
he:
  name: מסגד ג'ומעה, טביליסי
  short: >-
    המסגד האחרון ששרד בטביליסי העתיקה, למרגלות נריקלה: לבנים אדומות, צריח מתומן, שני מחראבים, וסונים ושיעים
    שמתפללים באותו אולם.
  body: >-
    **פעם חילק וילון את אולם התפילה של מסגד ג'ומעה — הסונים מצד אחד, השיעים מהצד השני. מאז 1996 הם מתפללים
    יחד.**


    מוסלמים חיים בטביליסי מאז הכיבוש הערבי במאה ה-7, ופעם היו בעיר מסגדים רבים. זהו היחיד שנותר בעיר העתיקה,
    ותולדותיו נקראות כמו מרוץ שליחים של בונים ומחריבים. העות'מאנים הקימו כאן מסגד, למרגלות נריקלה, בין
    1723 ל-1735; כוחות פרסיים הרסו אותו בשנות ה-40 של המאה ה-18; האדריכל האיטלקי ג'ובאני סקודיירי בנה
    אותו מחדש ב-1846–1851; וב-1895 מימן איל הנפט האזרבייג'ני זיינלאבדין טאגייב את בניין הלבנים האדומות
    שעומד כאן היום. מסגד שיעי עתיק יותר ליד מיידאן, שנבנה ב-1522–1524 בימי השאה איסמאעיל הראשון, היה בר
    מזל פחות: הוא נהרס ב-1950 כדי לפנות מקום לגשר מטחי.


    המסגד של טאגייב הוא הכלאה מסקרנת — חלונות מקושתים ניאו-גותיים בלבנים אדומות וחמות, צריח מתומן שמתנשא
    מעל רחוב בוטניקורי, ופסיפסים צבעוניים מבחוץ ומבפנים. באולם יש שני מחראבים, הגומחות המכוונות לעבר מכה:
    חדר אחד, מסודר לשתי מסורות. אפילו השם מתאים: *ג'ומעה* פירושו יום שישי, יום התפילה בציבור.


    המסגד, ששוחזר ב-1998, עדיין מתמלא בתפילות יום השישי ובחגי עיד אל-פיטר ועיד אל-אדחא, בעיקר בבני הקהילה
    האזרבייג'נית של טביליסי. צאו החוצה, וריח הגופרית מבתי המרחץ, במרחק שתי דקות, עומד בסמטה; בית כנסת
    וכנסיות אורתודוקסיות נמצאים במרחק הליכה קצר, ונריקלה משקיפה מלמעלה על כולם.


    בעיר ששכניה העלו אותה באש יותר מפעם אחת, ושקמה מחדש בכל פעם, המסגד הקטן הזה, עשוי לבנים, מעלה טיעון
    שקט יותר: אנשים שאינם מסכימים עדיין יכולים לחלוק קורת גג.
  tip: >-
    הכניסה חינם, ומבקרים שמתנהגים בכבוד יכולים להיכנס מחוץ לזמני התפילה; הימנעו מתפילת הצהריים של יום
    שישי. כסו כתפיים וברכיים, נשים צריכות להביא מטפחת ראש, ואת הנעליים חולצים בפתח. אל תצלמו אנשים בזמן
    תפילה, ובקשו רשות לפני שאתם מצלמים בפנים. עשרים עד שלושים דקות מספיקות. מרחצאות הגופרית במרחק שתי
    דקות הליכה, ומבצר נריקלה מתנשא ממש מעליכם, כך שהמסגד משתלב באופן טבעי בכל טיול בעיר העתיקה.
  route: >-
    המסגד עומד ברחוב בוטניקורי (הרחוב הבוטני) באבאנוטובאני, בלב העיר העתיקה, כ-2 ק"מ מכיכר החירות. ברכב
    זה כעשר דקות, אבל הסמטאות הצרות של אבאנוטובאני, שחלקן מרוצפות אבן וחלקן מדרחוב, אינן מקום למכונית:
    החנו בשולי העיר העתיקה, סביב מיידאן (כיכר גורגסאלי), והמשיכו ברגל. ברגל מכיכר החירות זה 15–20 דקות
    — במורד רחוב קוטה אפחאזי עד מיידאן, על פני המרחצאות ובעלייה אל רחוב בוטניקורי. רכב אקונומי מספיק,
    ואין צורך לדאוג לדלק.
ar:
  name: مسجد الجمعة، تبليسي
  short: >-
    آخر مسجد باقٍ في تبليسي القديمة عند سفح ناريكالا: آجرّ أحمر، ومئذنة مثمّنة، ومحرابان، وسنّة وشيعة
    يصلّون في قاعة واحدة.
  body: >-
    **كانت ستارةٌ تقسم قاعة الصلاة في مسجد الجمعة ذات يوم: السنّة في جانب والشيعة في الجانب الآخر. ومنذ
    عام 1996 يصلّون معًا.**


    يعيش المسلمون في تبليسي منذ الفتح العربي في القرن السابع، وكان في المدينة يومًا مساجد كثيرة. هذا هو
    الوحيد الباقي في البلدة القديمة، وتاريخه أشبه بسباق تتابع بين البنّائين والهادمين. شيّد العثمانيون
    هنا، عند سفح ناريكالا، مسجدًا بين عامي 1723 و1735؛ ودمّرته القوات الفارسية في أربعينيات القرن الثامن
    عشر؛ وأعاد المعماري الإيطالي جوفاني سكوديري بناءه في 1846–1851؛ وفي عام 1895 موّل قطب النفط الأذربيجاني
    زين العابدين تقييف المبنى الآجرّي الأحمر القائم اليوم. أما مسجد شيعي أقدم قرب ميدان، شُيّد في 1522–1524
    في عهد الشاه إسماعيل الأول، فكان أقل حظًا: هُدم عام 1950 لإفساح المجال لجسر ميتيخي.


    مسجد تقييف هجينٌ لافت — نوافذ مقوّسة على الطراز القوطي الجديد في آجرّ أحمر دافئ، ومئذنة مثمّنة ترتفع
    فوق شارع بوتانيكوري، وفسيفساء ملوّنة في الخارج والداخل. وفي القاعة محرابان، وهما التجويفان اللذان
    يشيران إلى مكة: قاعة واحدة مهيّأة لمذهبين. حتى الاسم في محلّه: *الجمعة* يوم الصلاة الجامعة.


    رُمّم المسجد عام 1998، ولا يزال يمتلئ في صلاة الجمعة وفي عيدي الفطر والأضحى، وأغلب رواده من الجالية
    الأذربيجانية في تبليسي. اخرج إلى الزقاق فتجد رائحة الكبريت المنبعثة من الحمّامات، على بُعد دقيقتين،
    عالقةً في الهواء؛ وكنيسٌ وكنائس أرثوذكسية على مسافة قصيرة سيرًا، وناريكالا تطلّ عليها جميعًا من علٍ.


    في مدينة أحرقها جيرانها وأعادت بناء نفسها أكثر من مرة، يسوق هذا المسجد الآجرّي الصغير حجةً أهدأ: من
    يختلفون يمكنهم مع ذلك أن يتقاسموا سقفًا واحدًا.
  tip: >-
    الدخول مجاني، ويمكن للزوّار المحتشمين الدخول خارج أوقات الصلاة؛ وتجنّب صلاة الجمعة وقت الظهر. غطِّ
    الكتفين والركبتين، وعلى النساء إحضار غطاء للرأس، وتُخلع الأحذية عند الباب. لا تصوّر المصلّين، واستأذن
    قبل التصوير في الداخل. تكفي عشرون إلى ثلاثين دقيقة. الحمّامات الكبريتية على بُعد دقيقتين سيرًا، وقلعة
    ناريكالا ترتفع فوقك مباشرة، فيندرج المسجد بطبيعة الحال في أي جولة في البلدة القديمة.
  route: >-
    يقع المسجد في شارع بوتانيكوري (شارع النباتات) في حيّ أبانوتوباني، في قلب البلدة القديمة، على بُعد
    نحو 2 كم من ساحة الحرية. بالسيارة نحو عشر دقائق، لكن أزقّة أبانوتوباني الضيقة، المرصوفة بالحجارة في
    بعضها والمخصّصة للمشاة في بعضها الآخر، ليست مكانًا للسيارات: أوقف سيارتك على أطراف البلدة القديمة،
    حول ميدان (ساحة غورغاسالي)، وتابع سيرًا. مشيًا من ساحة الحرية يستغرق الطريق 15–20 دقيقة — نزولًا في
    شارع كوتي أبخازي حتى ميدان، مرورًا بالحمّامات، ثم صعودًا إلى شارع بوتانيكوري. تكفي سيارة اقتصادية،
    ولا داعي للقلق بشأن الوقود.
