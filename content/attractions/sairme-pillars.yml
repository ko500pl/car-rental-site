ka:
  name: საირმის სვეტები
  short: >-
    კირქვის სვეტები ლეჩხუმის ტყიდან, რიონის ხეობის თავზე: სამკილომეტრიანი ბილიკი, შუა საუკუნეების ეკლესიის
    ნანგრევი და, დიდი ალბათობით, სრული სიმარტოვე.
  body: >-
    **საირმის სვეტები არავის აუშენებია, თუმცა გზიდან ამის დაჯერება ძნელია: ფერმკრთალი კირქვის კოშკები
    ლეჩხუმის ტყიდან ისე ამოდის, თითქოს ციხის ნანგრევი იყოს, რომელიც არც ერთ მატიანეს არ უხსენებია.**


    სახელი უბრალო ქართულია — სა-ირმ-ე, „ირმების ადგილი“ — და ადგილობრივები ამბობენ, რომ ირემი აქ ოდესღაც
    ბევრი იყო. სვეტები სოფლების, ალპანასა და ჭრელობას შორის, საირმესთან, რიონის ხეობის თავზე დგას: კარსტული
    მასივი, რომელიც წყალმა და დრომ ცალკეულ სვეტებად და შვეულ კედლებად დაჩეხა.


    პირველად მათ უღელტეხილიდან დაინახავთ, სადაც ასფალტი აღმართს ამთავრებს და დაღმართზე გადადის. აქედან
    ტყეში დაახლოებით სამკილომეტრიანი ბილიკი ადის; პირველ კილომეტრს ოთხწამყვანიანი მანქანა გაივლის, შემდეგ
    გზა ბილიკად ვიწროვდება. ზემოთ შუა საუკუნეების ეკლესიის ნანგრევებია — ადგილობრივი გიდები მას ღვთისმშობლის
    სახელობისად მოიხსენიებენ. ესე იგი, აქ ადამიანები ხედის გარდა სხვა რამისთვისაც ამოდიოდნენ.


    რას მიიღებთ ამ აღმართის სანაცვლოდ:


    - სვეტების კედლებს, რომლებიც სიმაღლის მატებასთან ერთად ფორმას იცვლის

    - გრძელ ხედს რიონის ხეობაზე და დასავლეთით, ხვამლის ბრტყელ თავზე

    - დიდი ალბათობით — არავის, თქვენ გარდა


    ამ ადგილზე ცოტა დაწერილა და ესეც მისი მიმზიდველობის ნაწილია. დილით ან საღამოსკენ მოდით, როცა დაბალი
    მზე კირქვას რელიეფს სძენს; შუადღის სინათლე მას აბრტყელებს.
  tip: >-
    გასვლა-დაბრუნებას სამი საათი დაუთმეთ. ბილიკი მარტივია, მაგრამ ცუდად მონიშნული, ამიტომ ბილიკის ნავიგაციური
    ტრეკი (ერთ-ერთს გზამკვლევი „ჯორჯიან თრეველ გაიდი“ აქვეყნებს) კავშირის დაკარგვამდე ჩამოტვირთეთ. წყალი
    და საჭმელი თან წაიღეთ: გზაზე არც მაღაზიაა, არც საიმედო წყარო. კლდის პირებზე მოაჯირი არ არის — ბავშვები
    ახლოს გყავდეთ. ზამთარშიც შეიძლება ასვლა, რადგან ბილიკი ტყეში მიდის, მაგრამ თოვლი მას მალავს, ამიტომ
    ტრეკს ზუსტად მიჰყევით. სრული დღისთვის დაახლოებით რვა კილომეტრით დაშორებული ლაილაში ან ნიქორწმინდის
    ტაძარი დაამატეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ16-ით ჩრდილოეთით რიონის ხეობით ალპანამდე — ტვიშთან
    გზა ვიწრო, კლაკნილი და ძალიან ლამაზია. ალპანიდან შ16-ს ამბროლაურის მიმართულებით კიდევ დაახლოებით ხუთი
    კილომეტრი მიჰყევით, უღელტეხილამდე, სადაც ბილიკი იწყება. სულ დაახლოებით 280 კმ და ოთხნახევარი საათია,
    უღელტეხილამდე — ბოლომდე ასფალტით. მანქანა გზისპირას უსაფრთხოდ გააჩერეთ; ტყის გრუნტის გზის პირველი
    კილომეტრი მხოლოდ ოთხწამყვანიანი მანქანისთვისაა და უმჯობესია, ფეხით გაიაროთ. სწორედ ამ მონაკვეთის გამო
    გირჩევთ ჯიპს. საწვავი ქუთაისში ჩაასხით — ლეჩხუმში ბენზინგასამართი ცოტაა.
en:
  name: Sairme Pillars
  short: >-
    Limestone pillars rising from Lechkhumi's forest above the Rioni gorge: a three-kilometre trail, a
    medieval church ruin and, very likely, no one else.
  body: >-
    **Nobody built the Sairme Pillars, though from the road it is hard to believe: pale limestone towers
    stand out of the Lechkhumi forest like the ruin of a castle no chronicle ever mentioned.**


    The name is plain Georgian, sa-irm-e, 'place of deer', and locals say deer were once plentiful here.
    The pillars rise between the villages of Alpana and Chreloba, near Sairme, above the Rioni gorge.
    They are a karst massif that water and time have split into free-standing columns and sheer walls.


    You first see them from the pass, where the asphalt stops climbing and tips downhill. From there a
    trail of about three kilometres climbs through the forest. A 4x4 can manage the first kilometre before
    the track narrows to a footpath. Higher up lie the ruins of a medieval church that local guides call
    the Virgin's, a sign that people once climbed here for more than the view.


    What the climb gives you:


    - the pillar walls, changing shape as you gain height

    - a long view over the Rioni gorge and west to the flat top of Khvamli

    - very probably, no one else


    Little has been written about this place, and that is part of its pull. Come in the morning or towards
    evening, when a low sun gives the limestone relief; midday light flattens it.
  tip: >-
    Allow three hours there and back. The trail is easy but poorly marked, so download the GPX track (Georgian
    Travel Guide publishes one) before you lose signal. Bring water and food, because there is no shop
    and no reliable spring on the way. The cliff edges are unfenced, so keep children close. You can come
    in winter, because the path stays in the forest, but snow hides it and you will need to follow the
    track closely. For a full day, add Lailashi, about eight kilometres away, or Nikortsminda Cathedral.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh16 north up the Rioni gorge to Alpana;
    the stretch around Tvishi is narrow, winding and very beautiful. From Alpana stay on the Sh16 towards
    Ambrolauri for about five kilometres to the pass where the trail begins. The total is about 280 km
    and four and a half hours, on asphalt all the way to the pass. Pull off the road where it is safe.
    The forest track beyond is for 4x4s only for its first kilometre and is better walked, which is why
    we recommend an SUV. Fill up in Kutaisi, as stations are scarce in Lechkhumi.
ru:
  name: Столбы Саирме
  short: >-
    Известняковые столбы над лесами Лечхуми и ущельем Риони: трёхкилометровая тропа, руины средневековой
    церкви и, скорее всего, ни души вокруг.
  body: >-
    **Столбы Саирме никто не строил, хотя с дороги в это трудно поверить: бледные известняковые башни
    поднимаются из лечхумского леса, словно руины замка, о котором молчат все летописи.**


    Название чисто грузинское: са-ирм-е — «место оленей», и местные говорят, что когда-то оленей здесь
    было много. Столбы стоят между сёлами Алпана и Чрелоба, неподалёку от Саирме, над ущельем Риони. Это
    карстовый массив, который вода и время расщепили на отдельные колонны и отвесные стены.


    Впервые вы видите их с перевала, там, где асфальт перестаёт карабкаться вверх и переваливает вниз.
    Отсюда через лес поднимается тропа длиной около трёх километров. Первый километр осилит внедорожник,
    дальше колея сужается до пешеходной тропы. Выше лежат руины средневековой церкви — местные гиды называют
    её Богородичной, — а значит, люди поднимались сюда не только ради вида.


    Что даёт подъём:


    - стены столбов, меняющие очертания по мере того, как вы набираете высоту

    - далёкий вид на ущелье Риони и на запад, на плоскую вершину Хвамли

    - очень вероятно, полное безлюдье


    Об этом месте почти ничего не написано, и в этом отчасти его притяжение. Приходите утром или ближе
    к вечеру, когда низкое солнце лепит рельеф известняка; в полдень свет делает его плоским.
  tip: >-
    Закладывайте три часа туда и обратно. Тропа лёгкая, но размечена плохо, поэтому скачайте трек маршрута
    для навигатора (его публикует путеводитель «Джорджиан трэвел гайд»), пока не пропала связь. Возьмите
    воду и еду: магазина нет, надёжного родника по пути тоже. Края обрывов без ограждений — держите детей
    рядом. Прийти можно и зимой, ведь тропа идёт по лесу, но снег её прячет, и придётся внимательно следить
    за треком. Чтобы получился целый день, добавьте Лаилаши, до него около восьми километров, или собор
    Никорцминда.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh16 на север вверх по ущелью Риони до Алпаны;
    участок у Твиши узкий, извилистый и очень красивый. От Алпаны оставайтесь на Sh16 в сторону Амбролаури
    ещё около пяти километров, до перевала, где начинается тропа. Всего около 280 км и четыре с половиной
    часа, асфальт до самого перевала. Съезжайте на обочину там, где это безопасно. Лесная колея дальше
    проходима только для полноприводных машин, и то лишь первый километр, а пройти её лучше пешком, —
    поэтому мы рекомендуем внедорожник. Заправьтесь в Кутаиси: в Лечхуми заправок мало.
fa:
  name: ستون‌های سائیرمه
  short: >-
    ستون‌های آهکی که از جنگل لچخومی بر فراز تنگهٔ ریونی سر برآورده‌اند: کوره‌راهی سه‌کیلومتری، ویرانهٔ
    کلیسایی از سده‌های میانه و، به احتمال زیاد، هیچ‌کس جز شما.
  body: >-
    **ستون‌های سائیرمه را کسی نساخته است، هرچند از کنار جاده باورش سخت است: برج‌های آهکی رنگ‌پریده از
    دل جنگل لچخومی بیرون زده‌اند، چون ویرانهٔ قلعه‌ای که هیچ وقایع‌نامه‌ای از آن یاد نکرده است.**


    نام، گرجی ساده است: «سا-ایرم-ه»، یعنی «جای گوزن»، و اهالی می‌گویند روزگاری گوزن اینجا فراوان بود.
    ستون‌ها میان روستاهای آلپانا و چرلوبا، نزدیک سائیرمه، بر فراز تنگهٔ ریونی قد کشیده‌اند. این‌ها بخشی
    از توده‌ای کارستی‌اند که آب و زمان آن را به ستون‌های جدا از هم و دیواره‌های قائم شکافته است.


    نخستین بار از گردنه می‌بینیدشان، همان‌جا که آسفالت از بالا رفتن دست می‌کشد و سرازیر می‌شود. از آنجا
    کوره‌راهی حدود سه‌کیلومتری از میان جنگل بالا می‌رود. یک کیلومتر نخست را خودروی دودیفرانسیل می‌تواند
    برود، پس از آن جاده به باریکه‌راهی پیاده بدل می‌شود. بالاتر ویرانه‌های کلیسایی از سده‌های میانه است
    که راهنمایان محلی آن را کلیسای مریم مقدس می‌نامند؛ نشانه‌ای که مردم روزگاری برای چیزی بیش از منظره
    به اینجا می‌آمدند.


    آنچه این سربالایی به شما می‌دهد:


    - دیواره‌های ستون‌ها که هرچه بالاتر می‌روید شکل عوض می‌کنند

    - چشم‌اندازی دور بر تنگهٔ ریونی و در غرب، تا قلهٔ هموار خوامْلی

    - و به احتمال بسیار، هیچ‌کس جز خودتان


    دربارهٔ این مکان کم نوشته‌اند و بخشی از کشش آن در همین است. صبح یا نزدیک غروب بیایید، وقتی خورشید
    کم‌ارتفاع به آهک برجستگی می‌بخشد؛ نور نیمروز آن را تخت و بی‌جان می‌کند.
  tip: >-
    برای رفت و برگشت سه ساعت وقت بگذارید. کوره‌راه آسان است ولی نشانه‌گذاری ضعیفی دارد، پس پیش از قطع
    شدن آنتن، فایل مسیر را برای مسیریاب دانلود کنید (راهنمای سفر «جورجین تراول گاید» یکی منتشر کرده است).
    آب و خوراک همراه بیاورید، چون در راه نه مغازه‌ای هست و نه چشمه‌ای که بشود رویش حساب کرد. لبهٔ پرتگاه‌ها
    حفاظ ندارد، پس بچه‌ها را نزدیک خود نگه دارید. زمستان هم می‌شود آمد، چون راه در دل جنگل می‌ماند، اما
    برف آن را می‌پوشاند و باید فایل مسیر را دقیق دنبال کنید. برای یک روز کامل، لایلاشی را در حدود هشت
    کیلومتری یا کلیسای جامع نیکورتسمیندا را هم به برنامه بیفزایید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب تا کوتائیسی بروید، سپس با Sh16 به شمال، در تنگهٔ ریونی بالا
    بروید تا آلپانا؛ بخش اطراف تویشی باریک، پرپیچ‌وخم و بسیار زیباست. از آلپانا روی همان Sh16 به سوی آمبرولائوری
    حدود پنج کیلومتر دیگر ادامه دهید تا گردنه‌ای که کوره‌راه از آن آغاز می‌شود. روی هم حدود ۲۸۰ کیلومتر
    و چهار ساعت و نیم، و تا خود گردنه آسفالت. هر جا که امن است از جاده کنار بکشید. جادهٔ جنگلی پس از آن
    فقط در یک کیلومتر نخست برای خودروی دودیفرانسیل رفتنی است و بهتر است پیاده بروید؛ برای همین شاسی‌بلند
    را توصیه می‌کنیم. در کوتائیسی باک را پر کنید، چون در لچخومی پمپ‌بنزین کم است.
he:
  name: עמודי סאירמה
  short: >-
    עמודי גיר המתנשאים מתוך יער לצ'חומי מעל ערוץ הריוני: שביל של שלושה קילומטרים, חורבת כנסייה מימי הביניים,
    ובסבירות גבוהה – אף אחד מלבדכם.
  body: >-
    **איש לא בנה את עמודי סאירמה, אף שמהכביש קשה להאמין בכך: מגדלי גיר חיוורים מזדקרים מתוך יער לצ'חומי
    כמו חורבות של טירה שאף כרוניקה לא הזכירה מעולם.**


    השם גאורגי פשוט: סא-ירמ-ה, "מקום האיילים", והמקומיים מספרים שפעם היו כאן איילים רבים. העמודים מתנשאים
    בין הכפרים אלפנה וצ'רלובה, סמוך לסאירמה, מעל ערוץ הריוני. זהו גוש קארסטי שהמים והזמן ביקעו לעמודים
    נפרדים ולקירות זקופים.


    לראשונה רואים אותם מן המעבר, במקום שבו האספלט מפסיק לטפס ומתחיל לרדת. משם מטפס שביל של כשלושה קילומטרים
    דרך היער. רכב בהנעה כפולה יצלח את הקילומטר הראשון, ואחר כך הדרך מצטמצמת לשביל רגלי. גבוה יותר שוכנות
    חורבות כנסייה מימי הביניים שהמדריכים המקומיים מכנים כנסיית מרים הבתולה – סימן שפעם טיפסו לכאן לא רק
    בשביל הנוף.


    מה העלייה נותנת לכם:


    - קירות העמודים, שמשנים את צורתם ככל שאתם עולים

    - תצפית רחוקה על ערוץ הריוני ומערבה, עד הפסגה השטוחה של חוומלי

    - ובסבירות גבוהה מאוד – אף אחד מלבדכם


    מעט מאוד נכתב על המקום הזה, וזה חלק מקסמו. בואו בבוקר או לקראת ערב, כשהשמש הנמוכה מעניקה לגיר עומק
    ותבליט; אור הצהריים משטיח אותו.
  tip: >-
    הקדישו שלוש שעות הלוך ושוב. השביל קל אבל מסומן בצורה גרועה, לכן הורידו קובץ מסלול לניווט (המדריך "ג'ורג'יאן
    טראוול גייד" מפרסם אחד) לפני שהקליטה נעלמת. הביאו מים ואוכל, כי בדרך אין חנות ואין מעיין שאפשר לסמוך
    עליו. שפות המצוקים אינן מגודרות, אז החזיקו את הילדים קרוב. אפשר לבוא גם בחורף, כי השביל נשאר בתוך
    היער, אבל השלג מסתיר אותו ותצטרכו לעקוב אחרי המסלול בקפידה. ליום מלא, צרפו את לאילאשי, במרחק כשמונה
    קילומטרים, או את קתדרלת ניקורצמינדה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד קוטאיסי, משם בכביש Sh16 צפונה במעלה ערוץ הריוני עד אלפנה; הקטע
    שליד טווישי צר, מפותל ויפה מאוד. מאלפנה המשיכו בכביש Sh16 לכיוון אמברולאורי עוד כחמישה קילומטרים,
    עד המעבר שבו מתחיל השביל. בסך הכול כ-280 ק"מ וארבע שעות וחצי, סלול עד המעבר עצמו. עצרו בצד הדרך במקום
    בטוח. דרך היער שמעבר לו עבירה לרכבים בהנעה כפולה בלבד, ורק בקילומטר הראשון, ועדיף ללכת בה ברגל – ולכן
    אנחנו ממליצים על רכב שטח. תדלקו בקוטאיסי, כי בלצ'חומי תחנות הדלק מעטות.
ar:
  name: أعمدة سايرمه
  short: >-
    أعمدة كلسية تنهض من غابة ليتشخومي فوق مضيق ريوني: درب طوله ثلاثة كيلومترات، وأطلال كنيسة من العصور
    الوسطى، وعلى الأرجح لا أحد سواك.
  body: >-
    **لم يبنِ أحدٌ أعمدةَ سايرمه، وإن صعب تصديق ذلك من الطريق: أبراج كلسية شاحبة تنتصب من غابة ليتشخومي
    كأنها أطلال قلعة لم يذكرها أي تاريخ مدوّن.**


    الاسم جورجي بسيط: «سا-إيرم-ه»، أي «موطن الأيائل»، ويقول الأهالي إن الأيائل كانت كثيرة هنا ذات يوم.
    تنتصب الأعمدة بين قريتي ألبانا وتشريلوبا، قرب سايرمه، فوق مضيق ريوني. وهي كتلة كارستية شقّها الماء
    والزمن إلى أعمدة قائمة بذاتها وجدران عمودية.


    تراها أول مرة من الممر، حيث يكفّ الإسفلت عن الصعود ويميل نازلاً. ومن هناك يصعد درب طوله نحو ثلاثة
    كيلومترات عبر الغابة. تستطيع سيارة الدفع الرباعي قطع الكيلومتر الأول، ثم يضيق المسلك حتى يصير ممشى
    للراجلين. وفي الأعلى أطلال كنيسة من العصور الوسطى يسمّيها الأدلاء المحليون كنيسة العذراء، علامةً على
    أن الناس صعدوا إلى هنا يوماً لأمر أبعد من المنظر.


    ما يمنحك إياه الصعود:


    - جدران الأعمدة وهي تبدّل أشكالها كلما ارتفعت

    - إطلالة بعيدة على مضيق ريوني، وغرباً حتى قمة خفاملي المسطّحة

    - وعلى الأرجح، لا أحد سواك


    قليل ما كُتب عن هذا المكان، وفي ذلك بعض سحره. تعالَ صباحاً أو قرابة المساء، حين تمنح الشمس الخفيضة
    الحجر الكلسي بروزاً وظلالاً؛ أما ضوء الظهيرة فيسطّحه.
  tip: >-
    خصّص ثلاث ساعات للذهاب والإياب. الدرب سهل لكن علاماته قليلة، فنزّل ملف المسار للملاحة (ينشر دليل «جورجيان
    ترافيل غايد» واحداً منها) قبل أن تفقد الإشارة. احمل الماء والطعام، فلا متجر في الطريق ولا نبع يُعتمد
    عليه. حواف الجروف بلا سياج، فأبقِ الأطفال قريبين منك. يمكن المجيء شتاءً أيضاً لأن الدرب يبقى داخل
    الغابة، لكن الثلج يخفيه وسيلزمك اتباع المسار بدقة. ولتملأ يوماً كاملاً، أضف قرية لايلاشي على بعد نحو
    ثمانية كيلومترات، أو كاتدرائية نيكورتسميندا.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً إلى كوتايسي، ثم الطريق Sh16 شمالاً صعوداً في مضيق ريوني حتى ألبانا؛
    والمقطع حول تفيشي ضيق ومتعرّج وبالغ الجمال. ومن ألبانا ابقَ على الطريق Sh16 باتجاه أمبرولاوري نحو
    خمسة كيلومترات أخرى حتى الممر الذي يبدأ منه الدرب. المجموع نحو 280 كم وأربع ساعات ونصف، والطريق معبّد
    حتى الممر. توقّف على جانب الطريق حيث يكون ذلك آمناً. أما المسلك الحرجي بعده فلا تسلكه إلا سيارات الدفع
    الرباعي، وفي كيلومتره الأول فقط، والأفضل قطعه سيراً؛ لذلك نوصي بسيارة رباعية الدفع. تزوّد بالوقود
    في كوتايسي، فالمحطات نادرة في ليتشخومي.
