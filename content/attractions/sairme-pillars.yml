ka:
  name: საირმის სვეტები
  short: >-
    კირქვის გიგანტური სვეტები ლეჩხუმში, რიონის მარჯვენა ნაპირზე — ბუნების ძეგლი, რომელსაც ტურისტების უმეტესობა
    ჯერ ვერ პოულობს.
  body: >-
    **საირმის სვეტები ლეჩხუმის ყველაზე უცნაური სანახაობაა** — კირქვის მასივიდან ამოზრდილი გიგანტური კოშკები,
    რომლებიც ტყიდან ისე ამოდის, თითქოს ვიღაცამ განზრახ ჩაარჭო. სახელი ირმებს უკავშირდება: "საირმე" ირმების
    სამყოფელს ნიშნავს და ადგილობრივები ამბობენ, რომ ადრე აქ ისინი მართლა ბლომად იყვნენ.


    სვეტები სოფლების ალპანასა და ჭრელობას შორის დგას, რიონის მარჯვენა ნაპირზე, ცაგერიდან 28 კილომეტრში.
    ეს ბუნების ძეგლია — ეროზიით გამოქანდაკებული კლდოვანი მასივი, რომლის კედლები და ცალკეული სვეტები ხეობის
    ზემოთ ასობით მეტრზე იმართება. ბილიკზე, მწვერვალთან ახლოს, შუა საუკუნეების ღვთისმშობლის ეკლესიის ნანგრევებია
    — ნიშანი იმისა, რომ ეს ადგილი საუკუნეების წინაც წმინდად ითვლებოდა.


    რას უნდა ელოდო:


    - დაახლოებით 3 კმ ბილიკი უღელტეხილიდან, ტყეში, მსუბუქი აღმართით

    - ხედები რიონის ხეობაზე, ხვამლის მასივსა და ლეჩხუმის ქედებზე

    - თავად სვეტების კედლები, რომლებთანაც ფოტო ყველა რაკურსით გამოდის


    ბილიკი მარტივია, მაგრამ მარკირება მწირი — GPS-ჩანაწერი წინასწარ ჩამოტვირთე. გაზაფხულიდან შემოდგომამდე
    ყველაზე კომფორტულია; ზამთარში თოვლი ბილიკს ფარავს და მიგნება ჭირს. ხალხი აქ ცოტაა — დიდი შანსია, სვეტები
    მთლიანად შენ დაგრჩეს.
  tip: >-
    ბილიკის დასაწყისამდე გრუნტის გზაა — მაღალძირიანი მანქანით დაახლოებით 1 კმ-ის შეყვანა შეიძლება, მერე
    გზა ვიწროვდება და ფეხით გაგრძელება მოგიწევს. საკვები და წყალი წამოიღე: ადგილზე არც მაღაზიაა, არც წყარო
    ბილიკის დიდ ნაწილზე. კლდის პირებთან ფრთხილად — მოაჯირები არ არის. ახლოსაა ლაილაშის "საიდუმლო აუზიც",
    ერთ დღეში ორივე ესწრება.
  route: >-
    თბილისიდან E60 ავტობანით ქუთაისამდე, შემდეგ წყალტუბო–ალპანას გზით ლეჩხუმისკენ — ჯამში დაახლოებით 280
    კმ და 4:30 საათი. ასფალტი ალპანამდე კარგია, ტვიშის სერპენტინი ვიწრო, მაგრამ ხედებიანი. ალპანას შემდეგ
    ცაგერის მიმართულებით მოკლე მონაკვეთია, საიდანაც გრუნტის მისასვლელი იწყება — აქ SUV ნამდვილად აჯობებს
    ეკონომ-კლასს. საწვავი ქუთაისში ან ალპანაში ჩაასხი, ლეჩხუმში ბენზინგასამართი ცოტაა.
en:
  name: Sairme Pillars
  short: >-
    Giant limestone towers rising from the forests of Lechkhumi above the Rioni — a natural monument most
    tourists haven't found yet.
  body: >-
    **The Sairme Pillars are the strangest sight in Lechkhumi** — huge limestone towers growing out of
    a rocky massif, as if someone had hammered them into the forest on purpose. The name comes from deer:
    "sairme" means "place of red deer", and locals say the animals really were plentiful here once.


    The pillars stand between the villages of Alpana and Chreloba, on the right bank of the Rioni, about
    28 km from Tsageri. It is a protected natural monument: an erosion-carved karst massif whose walls
    and free-standing columns rear up high above the valley. Near the top of the trail lie the ruins of
    a medieval Virgin Mary church — a sign that this place was considered holy centuries ago.


    What to expect:


    - A roughly 3 km trail from the road, through forest, on a gentle climb

    - Views over the Rioni valley, the Khvamli massif and the Lechkhumi ridges

    - The pillar walls themselves, photogenic from every angle


    The walking is easy but waymarking is thin, so download a GPS track in advance. Late spring to autumn
    is the comfortable window; in winter snow hides the path and route-finding gets awkward. Crowds are
    close to zero — there is a good chance you will have the pillars entirely to yourself.
  tip: >-
    A dirt track leads towards the trailhead — a high-clearance car manages about 1 km of it before the
    road narrows and you continue on foot. Bring food and water; there is no shop and no spring along
    most of the trail. Watch your footing near the cliff edges — nothing is fenced. The Lailashi "secret
    pool" is nearby, and both fit comfortably into one day.
  route: >-
    From Tbilisi take the E60 motorway to Kutaisi, then the Tskaltubo–Alpana road towards Lechkhumi —
    about 280 km and 4 hours 30 in total. Asphalt is good as far as Alpana; the Tvishi serpentine is narrow
    but scenic. Past Alpana, a short stretch towards Tsageri brings you to the gravel approach road, where
    an SUV clearly beats an economy car. Refuel in Kutaisi or Alpana — petrol stations are scarce in Lechkhumi.
ru:
  name: Саирмские столбы
  short: >-
    Гигантские известняковые башни в лесах Лечхуми над Риони — памятник природы, до которого туристы ещё
    не добрались.
  body: >-
    **Саирмские столбы — самое странное зрелище Лечхуми:** огромные известняковые башни, вырастающие из
    скального массива, будто кто-то нарочно вбил их в лес. Название связано с оленями: «саирме» означает
    «место оленей», и местные говорят, что когда-то их здесь действительно было много.


    Столбы стоят между сёлами Альпана и Чрелоба, на правом берегу Риони, примерно в 28 км от Цагери. Это
    охраняемый памятник природы: карстовый массив, выточенный эрозией, стены и отдельные колонны которого
    поднимаются высоко над долиной. У вершины тропы — руины средневековой церкви Богородицы, знак того,
    что место считалось святым уже столетия назад.


    Чего ждать:


    - Тропа около 3 км от дороги, по лесу, с плавным набором высоты

    - Виды на долину Риони, массив Хвамли и хребты Лечхуми

    - Сами стены столбов, фотогеничные с любого ракурса


    Идти легко, но маркировка скудная — заранее скачайте GPS-трек. Комфортное окно — с конца весны до
    осени; зимой снег скрывает тропу, и ориентироваться трудно. Людей почти нет: велик шанс, что столбы
    достанутся вам целиком.
  tip: >-
    К началу тропы ведёт грунтовка — машина с высоким клиренсом проезжает по ней около километра, дальше
    дорога сужается, и придётся идти пешком. Возьмите еду и воду: магазина нет, родников на большей части
    тропы тоже. У обрывов будьте осторожны — ограждений никаких. Рядом «секретный бассейн» Лайлаши; оба
    места спокойно укладываются в один день.
  route: >-
    Из Тбилиси по автомагистрали E60 до Кутаиси, дальше по дороге Цхалтубо–Альпана в сторону Лечхуми —
    всего около 280 км и 4,5 часа. Асфальт до Альпаны хороший, серпантин у Твиши узкий, но с красивыми
    видами. За Альпаной, на коротком участке в сторону Цагери, начинается гравийный подъезд — здесь SUV
    заметно выигрывает у эконом-класса. Заправьтесь в Кутаиси или Альпане: АЗС в Лечхуми мало.
fa:
  name: ستون‌های سائیرمه
  short: برج‌های آهکی غول‌پیکر در جنگل‌های لچخومی بر فراز رود ریونی — یادمانی طبیعی که هنوز گردشگران کشفش
    نکرده‌اند.
  body: >-
    **ستون‌های سائیرمه عجیب‌ترین منظرهٔ لچخومی است** — برج‌های آهکی عظیمی که از دل تودهٔ صخره‌ای بیرون
    زده‌اند، انگار کسی آنها را عمداً در جنگل کوبیده باشد. نام از گوزن می‌آید: «سائیرمه» یعنی «جای گوزن‌ها»،
    و اهالی می‌گویند روزگاری اینجا واقعاً پرشمار بودند.


    ستون‌ها میان روستاهای آلپانا و چرلوبا، در کرانهٔ راست ریونی و حدود ۲۸ کیلومتری تساگری ایستاده‌اند.
    اینجا یادمان طبیعی حفاظت‌شده است: تودهٔ کارستی که فرسایش آن را تراشیده و دیواره‌ها و ستون‌های مستقلش
    بلندا بر فراز دره سر برافراشته‌اند. نزدیک پایان مسیر، ویرانه‌های کلیسای قرون‌وسطایی مریم مقدس قرار
    دارد — نشانی از تقدس این مکان از سده‌ها پیش.


    چه انتظاری داشته باشید:


    - مسیری حدود ۳ کیلومتر از جاده، در جنگل، با شیب ملایم

    - چشم‌اندازهای درهٔ ریونی، تودهٔ کوه خوامْلی و خط‌الرأس‌های لچخومی

    - خود دیواره‌های ستون‌ها که از هر زاویه‌ای عکس خوب می‌دهند


    پیاده‌روی آسان است اما علامت‌گذاری کم — مسیر GPS را از قبل دانلود کنید. از اواخر بهار تا پاییز راحت‌ترین
    زمان است؛ در زمستان برف مسیر را می‌پوشاند و راه‌یابی دشوار می‌شود. اینجا تقریباً خلوت است — به‌احتمال
    زیاد ستون‌ها یکسره مال شما خواهند بود.
  tip: >-
    تا ابتدای مسیر پیاده جاده‌ای خاکی است — خودروی شاسی‌بلند حدود یک کیلومتر آن را می‌رود و بعد جاده تنگ
    می‌شود و باید پیاده ادامه دهید. خوراکی و آب بردارید: نه فروشگاهی هست و نه در بیشتر مسیر چشمه‌ای. نزدیک
    لبهٔ پرتگاه‌ها مراقب باشید — حفاظی وجود ندارد. «استخر پنهان» لایلاشی هم همان نزدیکی است و هر دو در
    یک روز جا می‌شوند.
  route: >-
    از تفلیس با آزادراه E60 تا کوتائیسی، سپس با جادهٔ تسخالتوبو–آلپانا به سوی لچخومی — روی‌هم حدود ۲۸۰
    کیلومتر و چهار ساعت و نیم. آسفالت تا آلپانا خوب است؛ پیچ‌های توییشی باریک اما خوش‌منظره‌اند. پس از
    آلپانا، در قطعهٔ کوتاهی به سمت تساگری، راه شنی دسترسی آغاز می‌شود — اینجا شاسی‌بلند آشکارا بهتر از
    خودروی اقتصادی است. در کوتائیسی یا آلپانا بنزین بزنید؛ جایگاه سوخت در لچخومی کم است.
he:
  name: עמודי סאירמה
  short: מגדלי גיר ענקיים ביערות לצחומי מעל נהר הריוני — אתר טבע שרוב התיירים עוד לא גילו.
  body: >-
    **עמודי סאירמה הם המחזה המוזר ביותר בלצחומי** — מגדלי גיר עצומים שצומחים מתוך גוש סלע, כאילו מישהו
    נעץ אותם ביער בכוונה. השם קשור לאיילים: "סאירמה" פירושו "מקום האיילים", והמקומיים מספרים שפעם הם באמת
    היו כאן בשפע.


    העמודים ניצבים בין הכפרים אלפאנה וצ'רלובה, על הגדה הימנית של הריוני, כ-28 ק"מ מצאגרי. זהו אתר טבע
    מוגן: גוש קארסטי שהסחיפה פיסלה, שקירותיו ועמודיו החופשיים מתנשאים גבוה מעל העמק. סמוך לראש השביל שוכנות
    חורבות כנסייה ימי-ביניימית של מרים הבתולה — עדות לכך שהמקום נחשב קדוש כבר לפני מאות שנים.


    למה לצפות:


    - שביל של כ-3 ק"מ מהדרך, ביער, בעלייה מתונה

    - נופים של עמק הריוני, גוש חוואמלי ורכסי לצחומי

    - קירות העמודים עצמם, פוטוגניים מכל זווית


    ההליכה קלה אך הסימון דל — הורידו מראש מסלול GPS. סוף האביב עד הסתיו הוא החלון הנוח; בחורף השלג מכסה
    את השביל והניווט נעשה מסובך. מבקרים כמעט אין — סיכוי טוב שהעמודים יהיו כולם שלכם.
  tip: >-
    אל תחילת השביל מובילה דרך עפר — רכב גבוה עובר בה כקילומטר, ואז הדרך נהיית צרה וממשיכים ברגל. קחו אוכל
    ומים: אין חנות ואין מעיין לאורך רוב השביל. היזהרו ליד שפת המצוקים — אין שום גידור. "הבריכה הסודית"
    של לאילאשי נמצאת בקרבת מקום, ושני האתרים נכנסים בנוחות ליום אחד.
  route: >-
    מטביליסי בכביש המהיר E60 עד קוטאיסי, ומשם בדרך צחאלטובו–אלפאנה לכיוון לצחומי — בסך הכול כ-280 ק"מ
    וכ-4:30 שעות. האספלט טוב עד אלפאנה; הסרפנטינה ליד טווישי צרה אך יפהפייה. אחרי אלפאנה, בקטע קצר לכיוון
    צאגרי, מתחילה דרך הגישה המחוצצת — כאן רכב שטח קל עדיף בבירור על רכב חסכוני. תדלקו בקוטאיסי או באלפאנה
    — תחנות דלק בלצחומי מעטות.
ar:
  name: أعمدة سايرمه
  short: أبراج كلسية عملاقة في غابات ليتشخومي فوق نهر ريوني — معلم طبيعي لم يكتشفه معظم السياح بعد.
  body: >-
    **أعمدة سايرمه أغرب مشهد في ليتشخومي** — أبراج كلسية ضخمة تنبثق من كتلة صخرية وكأن أحداً غرسها في
    الغابة عمداً. الاسم مرتبط بالأيائل: «سايرمه» تعني «موطن الأيائل»، ويقول الأهالي إنها كانت هنا بالفعل
    وفيرة يوماً ما.


    تقوم الأعمدة بين قريتي ألبانا وتشريلوبا، على الضفة اليمنى لنهر ريوني، على بعد نحو 28 كيلومتراً من
    تساغيري. وهي معلم طبيعي محمي: كتلة كارستية نحتها التعرية، ترتفع جدرانها وأعمدتها المنفردة عالياً فوق
    الوادي. وقرب نهاية الدرب تقع أطلال كنيسة العذراء من العصور الوسطى — دليل على قداسة المكان منذ قرون.


    ما الذي ينتظرك:


    - درب طوله نحو 3 كم من الطريق، عبر الغابة، بصعود لطيف

    - إطلالات على وادي ريوني وكتلة جبل خفاملي وسلاسل ليتشخومي

    - جدران الأعمدة نفسها، وهي مثالية للتصوير من كل زاوية


    المشي سهل لكن العلامات شحيحة — حمّل مسار GPS مسبقاً. الفترة المريحة من أواخر الربيع إلى الخريف؛ وفي
    الشتاء يخفي الثلج الدرب ويصعب الاهتداء. الزوار هنا قلائل — ومن المرجح أن تكون الأعمدة كلها لك وحدك.
  tip: >-
    يقود طريق ترابي نحو بداية الدرب — تقطع السيارة المرتفعة نحو كيلومتر منه ثم يضيق الطريق وتتابع سيراً.
    خذ طعاماً وماءً: لا متجر هناك ولا نبع على معظم الدرب. وانتبه قرب حواف الجروف — لا سياج إطلاقاً. «البركة
    السرية» في لايلاشي قريبة، والمكانان يتسعان براحة في يوم واحد.
  route: >-
    من تبليسي عبر الطريق السريع E60 حتى كوتايسي، ثم بطريق تسخالتوبو–ألبانا نحو ليتشخومي — نحو 280 كم و4
    ساعات ونصف إجمالاً. الأسفلت جيد حتى ألبانا؛ ومنعطفات تفيشي ضيقة لكنها خلابة. بعد ألبانا، على مقطع
    قصير باتجاه تساغيري، يبدأ طريق الوصول الحصوي — وهنا تتفوق سيارة الدفع الرباعي بوضوح على الاقتصادية.
    تزوّد بالوقود في كوتايسي أو ألبانا؛ فمحطات الوقود في ليتشخومي قليلة.
