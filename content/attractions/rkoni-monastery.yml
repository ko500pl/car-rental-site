ka:
  name: რკონის მონასტერი და თამარის ხიდი
  short: >-
    VII საუკუნის მონასტერი თეძმის ტყიანი ხეობის სიღრმეში — ფონებითა და ხრეშით მისადგომი, შუა საუკუნეების
    ქვის ხიდით, რომელზეც დღემდე დადიან.
  body: >-
    **რკონი თეძმის ხეობის სიღრმეში იმალება და იქამდე მისასვლელი გზა — ხრეში, ფონები, თავზე შეკრული ტყე
    — ამ მოგზაურობის პირველი თავია.**


    მონასტერი VII საუკუნეში, სავარაუდოდ 642–645 წლებში, დაარსდა — ერთდროულად სალოცავადაც და საგუშაგოდაც:
    არაბები მოიწევდნენ, ეს ხეობა კი შიდა ქართლს ტრიალეთთან და ჯავახეთთან აკავშირებდა. კომპლექსის გული
    ღვთისმშობლის მიძინების ეკლესიაა, VII საუკუნის მეორე ნახევრის სამნავიანი ბაზილიკა, თითქმის ნახევარწრიული
    თაღებითა და კამაროვანი გადახურვით. შიგნით მოხატულობის ფრაგმენტებია შემორჩენილი, შესასვლელის სამხრეთ
    წირთხლზე კი არაუგვიანეს X საუკუნის საერო პირის გამოსახულებაა. სამხრეთით XIII–XIV საუკუნეების ნათლისმცემლის
    ეკლესია დგას — თლილი ქვის დარბაზი, სამ ფასადზე დეკორატიული თაღედით. ირგვლივ დანგრეული სატრაპეზო, მოგვიანო
    ხანის ორსართულიანი სამრეკლო და თავდაცვითი კოშკის ნაშთია.


    1400 წელს თემურ-ლენგის ლაშქარმა მონასტერი დაარბია. იგი აღადგინეს, თუმცა XVI–XVII საუკუნეებისთვის ნელ-ნელა
    დაცარიელდა. 1905 წელს მისი განმარტოება სულ სხვა „მრევლს“ გამოადგა: რევოლუციონერებმა აქ საიდუმლო სახელოსნო
    მოაწყვეს და მეფის პოლიციის თვალს მიღმა ცეცხლსასროლ იარაღსა და ასაფეთქებელ ნივთიერებებს ამზადებდნენ.


    და ბოლოს — ხიდი. თამარის ხიდი თეძამს ერთი ქვის თაღით გადასდებია: 12,5 მეტრი სიგრძისაა, 2,2 მეტრი სიგანის,
    ბურჯები კი ბუნებრივ კლდეზე აქვს დაყრდნობილი. აქ გადიოდა ძველი გზა შიდა ქართლიდან ტრიალეთისკენ. ხიდს
    ჩვეულებრივ XII–XIII საუკუნეებით ათარიღებენ. გადმოცემა მას თამარ მეფეს უკავშირებს, რომელსაც, თითქოს,
    ახლოს საზაფხულო სასახლე ჰქონია; ეს თქმულებაა და არა საბუთი — საქართველოში ბევრი ძველი ხიდი ატარებს
    მის სახელს.


    გადადით მასზე ფეხით, როგორც თქვენამდე ბერები, ვაჭრები და იარაღის ოსტატები გადადიოდნენ.
  tip: >-
    სამი საათი გამოყავით: დაახლოებით ერთი — მონასტერს, დანარჩენი — ხეობის გზას და ხიდამდე სეირნობას. ძლიერი
    წვიმის შემდეგ და გაზაფხულის თოვლის დნობისას ფონები დაბალი მანქანისთვის ზედმეტად ღრმა შეიძლება იყოს
    — სანამ წახვალთ, ჩაჩუბეთში იკითხეთ. ზამთარში გზა ხშირად სრულიად იკეტება. ჩაიცვით კარგი სალაშქრო ფეხსაცმელი,
    ბილიკები ქვიანია. ხეობაში არც მაღაზიაა, არც კაფე და არც მობილურის კავშირი — წყალი და საჭმელი კასპიდან
    წამოიღეთ. მონასტერში შესაფერისად ჩაიცვით. საუკეთესო დრო ოქტომბრის ბოლოა, როცა ტყე ფერს იცვლის.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ იგოეთის კვანძამდე, იქიდან სამხრეთით კასპში — აქ
    შეავსეთ ავზი, ხეობამდე ეს ბოლო ბენზინგასამართია. კასპიდან ძველი გზით (შ29) დასავლეთისკენ მეფისკალაკამდე
    იარეთ, სადაც შ129 სამხრეთისკენ, თეძმის ხეობაში უხვევს და ჩაჩუბეთზე გადის; მონასტერი სოფლიდან დაახლოებით
    5,5 კმ-შია. სულ დაახლოებით 75 კმ და საათი და ორმოცდახუთი წუთი. ბოლო 20-ოდე კილომეტრი ხრეშია, ფონებითა
    და ვიწრო მონაკვეთებით: აიღეთ ჯიპი ან, სულ მცირე, მაღალი კლირენსის მანქანა. მანქანა მონასტერთან, ღია
    მოედანზე დატოვეთ.
en:
  name: Rkoni Monastery and Tamar's Bridge
  short: >-
    A 7th-century monastery deep in the forested Tedzami gorge, reached by fords and gravel, with a medieval
    stone bridge that still carries walkers.
  body: >-
    **Rkoni hides at the far end of the Tedzami gorge, and the drive in — gravel, fords, the forest closing
    overhead — is the first chapter of the visit.**


    The monastery was founded in the 7th century, probably between 642 and 645, as a house of prayer and
    a lookout at once: the Arabs were advancing, and this gorge was a road between Shida Kartli, Trialeti
    and Javakheti. Its heart is the Church of the Dormition, a three-aisled basilica of the later 7th
    century with near-semicircular arches and a vaulted roof. Fragments of painting survive inside, and,
    on the south jamb of the entrance, a painted secular figure from no later than the 10th century. South
    of it stands the 13th–14th-century Church of the Baptist, a hall of cut stone with decorative arcades
    on three façades. Around them lie a ruined refectory, a later two-storey bell tower and the stump
    of a defensive tower.


    Timur's raiders wrecked the monastery in 1400. It was rebuilt, yet by the 16th and 17th centuries
    it was slowly emptying. In 1905 its isolation served a very different congregation: revolutionaries
    set up a secret workshop here to make firearms and explosives out of sight of the Tsar's police.


    Then there is the bridge. Tamar's Bridge crosses the Tedzami in a single stone arch, 12.5 metres long
    and 2.2 metres wide, its footings set on living rock, where the old road from Shida Kartli to Trialeti
    once crossed. It is usually dated to the 12th–13th century. Tradition ties it to Queen Tamar, said
    to have kept a summer residence nearby; that is a story rather than a record, and many old Georgian
    bridges carry her name.


    Cross it on foot, as monks, merchants and gunsmiths did before you.
  tip: >-
    Allow three hours: about one at the monastery, the rest on the gorge road and the walk to the bridge.
    After heavy rain and in spring snowmelt the fords can run too deep for a low car — ask in Chachubeti
    before you commit. Winter often closes the track altogether. Wear proper walking shoes; the paths
    are stony. There is no shop, café or mobile signal in the gorge, so bring water and food from Kaspi.
    Dress modestly at the monastery. Late October, when the forest turns, is the finest time.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi to the Igoeti junction and turn south into Kaspi — fill
    up here, the last fuel before the gorge. From Kaspi follow the old road (Sh29) west to Mepiskalaki,
    where the Sh129 turns south up the Tedzami valley through Chachubeti; the monastery lies about 5.5
    km beyond the village. Around 75 km and 1 hour 45 minutes. The final 20 km or so are gravel, with
    fords and narrow sections: take an SUV, or at the very least a car with good ground clearance. Park
    on the open ground by the monastery.
ru:
  name: Монастырь Ркони и мост Тамары
  short: >-
    Монастырь VII века в глубине лесистого Тедзамского ущелья, куда ведут броды и гравийка, и средневековый
    каменный мост, по которому до сих пор ходят люди.
  body: >-
    **Ркони прячется в самом конце Тедзамского ущелья, и дорога туда — гравий, броды, смыкающийся над
    головой лес — становится первой главой визита.**


    Монастырь основали в VII веке, вероятно между 642 и 645 годами, — одновременно как обитель и как сторожевой
    пост: наступали арабы, а ущелье было дорогой между Шида-Картли, Триалети и Джавахети. Его сердце —
    Успенская церковь, трёхнефная базилика второй половины VII века с почти полуциркульными арками и сводчатым
    перекрытием. Внутри уцелели фрагменты росписи, а на южном косяке входа — живописное изображение светского
    лица не позднее X века. К югу от неё стоит церковь Иоанна Крестителя XIII–XIV веков, однонефный храм
    из тёсаного камня с декоративными аркадами на трёх фасадах. Вокруг — руины трапезной, более поздняя
    двухъярусная колокольня и остаток оборонительной башни.


    В 1400 году монастырь разорили воины Тимура. Его восстановили, но к XVI–XVII векам он постепенно пустел.
    В 1905 году уединённость Ркони послужила совсем иной пастве: революционеры устроили здесь тайную мастерскую,
    где подальше от глаз царской полиции делали оружие и взрывчатку.


    И наконец — мост. Мост Тамары перекидывает через Тедзами одну каменную арку длиной 12,5 метра и шириной
    2,2 метра; его опоры стоят прямо на скале, там, где когда-то старая дорога из Шида-Картли в Триалети
    пересекала реку. Обычно его датируют XII–XIII веками. Предание связывает мост с царицей Тамарой, у
    которой будто бы была неподалёку летняя резиденция; но это рассказ, а не документ, и её имя носят
    многие старые грузинские мосты.


    Перейдите его пешком, как до вас это делали монахи, купцы и оружейники.
  tip: >-
    Закладывайте три часа: около часа на монастырь, остальное — на дорогу по ущелью и прогулку к мосту.
    После сильных дождей и в весеннее половодье броды могут оказаться слишком глубокими для низкой машины
    — прежде чем ехать дальше, спросите в Чачубети. Зимой дорога нередко закрыта совсем. Наденьте нормальную
    треккинговую обувь: тропы каменистые. В ущелье нет ни магазина, ни кафе, ни мобильной связи, так что
    воду и еду везите из Каспи. В монастыре одевайтесь скромно. Лучшее время — конец октября, когда лес
    меняет цвет.
  route: >-
    Выезжайте из Тбилиси на запад по автомагистрали S1 (E60) до развязки у Игоети и сворачивайте на юг,
    в Каспи, — заправьтесь здесь, это последняя заправка перед ущельем. Из Каспи по старой дороге (Sh29)
    езжайте на запад до Мепискалаки, где Sh129 уходит на юг вверх по долине Тедзами через Чачубети; монастырь
    примерно в 5,5 км за селом. Всего около 75 км и 1 час 45 минут. Последние километров 20 — гравийная
    дорога с бродами и узкими участками: берите внедорожник или хотя бы машину с хорошим клиренсом. Парковка
    — на открытой площадке у монастыря.
fa:
  name: صومعهٔ رکونی و پل تامار
  short: >-
    صومعه‌ای از سدهٔ هفتم در ژرفای درهٔ جنگلی تدزامی که با گذر از آبگذرها و جادهٔ شنی به آن می‌رسید، با
    پلی سنگی از سده‌های میانه که هنوز رهگذران از آن می‌گذرند.
  body: >-
    **رکونی در انتهای درهٔ تدزامی پنهان شده است و راهِ رسیدن به آن — جادهٔ شنی، آبگذرها و جنگلی که بالای
    سر به هم می‌رسد — نخستین فصل این دیدار است.**


    صومعه در سدهٔ هفتم، احتمالاً میان سال‌های ۶۴۲ تا ۶۴۵، بنا شد؛ هم خانهٔ نیایش و هم دیده‌بانگاهی نظامی:
    عرب‌ها پیش می‌آمدند و این دره راهی میان شیدا کارتلی، تریالتی و جاواختی بود. قلب آن کلیسای رقاد (خواب
    ابدی مریم مقدس) است، باسیلیکایی سه‌راهرویی از نیمهٔ دوم سدهٔ هفتم با طاق‌هایی نزدیک به نیم‌دایره و
    بامی گهواره‌ای. درون آن پاره‌هایی از نقاشی دیواری مانده است و بر لبهٔ جنوبی درگاه، تصویر نقاشی‌شدهٔ
    یک شخص غیرروحانی از سدهٔ دهم یا پیش از آن دیده می‌شود. در جنوب آن کلیسای یحیای تعمیددهنده از سده‌های
    سیزدهم و چهاردهم ایستاده است، بنایی تک‌تالاری از سنگ تراش‌خورده با طاق‌نماهای تزیینی بر سه نما. پیرامونشان
    سفره‌خانهٔ ویران راهبان، برج ناقوسی دوطبقه از دوره‌ای متأخرتر و بازماندهٔ یک برج دفاعی دیده می‌شود.


    در سال ۱۴۰۰ سپاهیان تیمور صومعه را ویران کردند. دوباره ساخته شد، اما تا سده‌های شانزدهم و هفدهم آرام‌آرام
    از سکنه خالی می‌شد. در سال ۱۹۰۵ دورافتادگی‌اش به کار جماعتی یکسره متفاوت آمد: انقلابیون اینجا کارگاهی
    مخفی برپا کردند تا دور از چشم پلیس تزار سلاح گرم و مواد منفجره بسازند.


    و اما پل. پل تامار با یک طاق سنگی، به درازای ۱۲٫۵ متر و پهنای ۲٫۲ متر، از روی رود تدزامی می‌گذرد؛
    پایه‌هایش بر صخرهٔ طبیعی نشسته، همان‌جا که جادهٔ کهن شیدا کارتلی به تریالتی روزگاری از رود می‌گذشت.
    معمولاً قدمتش را سده‌های دوازدهم و سیزدهم می‌دانند. سنت آن را به ملکه تامار نسبت می‌دهد که گویا اقامتگاهی
    تابستانی در همین نزدیکی داشته است؛ این قصه است نه سند، و بسیاری از پل‌های کهن گرجستان نام او را بر
    خود دارند.


    پیاده از رویش بگذرید، همان‌گونه که پیش از شما راهبان، بازرگانان و سازندگان تفنگ گذشتند.
  tip: >-
    سه ساعت در نظر بگیرید: حدود یک ساعت برای صومعه و باقی برای جادهٔ دره و پیاده‌روی تا پل. پس از باران‌های
    تند و در زمان آب شدن برف‌های بهاری، آبگذرها ممکن است برای خودروی کوتاه بیش از حد عمیق باشند؛ پیش از
    آنکه راهی شوید، در چاچوبتی بپرسید. زمستان اغلب جاده را کاملاً می‌بندد. کفش مناسب پیاده‌روی بپوشید؛
    راه‌ها سنگلاخی‌اند. در دره نه مغازه‌ای هست، نه کافه‌ای و نه آنتن موبایل؛ پس آب و خوراک را از کاسپی
    بیاورید. در صومعه پوشیده لباس بپوشید. اواخر اکتبر، وقتی جنگل رنگ عوض می‌کند، بهترین زمان است.
  route: >-
    از تفلیس آزادراه S1 (E60) را به سوی غرب تا تقاطع ایگوئتی بگیرید و به جنوب، به کاسپی، بپیچید؛ همین‌جا
    باک را پر کنید، که آخرین پمپ بنزین پیش از دره است. از کاسپی جادهٔ قدیمی (Sh29) را به سوی غرب تا مپیسکالاکی
    دنبال کنید؛ آنجا جادهٔ Sh129 به جنوب می‌پیچد و از درهٔ تدزامی و روستای چاچوبتی بالا می‌رود؛ صومعه
    حدود ۵٫۵ کیلومتر آن‌سوی روستاست. روی‌هم حدود ۷۵ کیلومتر و ۱ ساعت و ۴۵ دقیقه. حدود ۲۰ کیلومتر پایانی
    شنی است، با آبگذرها و تکه‌های باریک: خودروی شاسی‌بلند ببرید، یا دست‌کم خودرویی با فاصلهٔ خوب از زمین.
    در زمین باز کنار صومعه پارک کنید.
he:
  name: מנזר רקוני וגשר תמר
  short: >-
    מנזר מהמאה ה-7 בעומק ערוץ תדזאמי המיוער, שמגיעים אליו דרך מעברי מים ודרכי חצץ, ולצדו גשר אבן מימי
    הביניים שהולכי רגל חוצים אותו עד היום.
  body: >-
    **רקוני מסתתר בקצה ערוץ תדזאמי, והנסיעה פנימה — דרך חצץ, מעברי מים, יער שנסגר מעל הראש — היא הפרק
    הראשון של הביקור.**


    המנזר נוסד במאה ה-7, כנראה בין 642 ל-645, כבית תפילה וכעמדת תצפית גם יחד: הערבים התקדמו, והערוץ הזה
    היה דרך בין שידה קרתלי, טריאלטי וג'אוואחטי. לבו הוא כנסיית שנת מרים (הדורמיציון), בזיליקה תלת-ספינתית
    מהמחצית השנייה של המאה ה-7, עם קשתות כמעט חצי-עגולות וגג מקומר. בפנים שרדו שרידי ציורי קיר, ועל המזוזה
    הדרומית של הפתח ציור של דמות חילונית, לא מאוחר מהמאה ה-10. מדרום לה עומדת כנסיית יוחנן המטביל מהמאות
    ה-13–14, כנסיית אולם מאבן מסותתת, ועל שלוש מחזיתותיה ארקדות עיטוריות. סביבן שרידי חדר האוכל של הנזירים,
    מגדל פעמונים דו-קומתי מתקופה מאוחרת יותר ובסיסו השבור של מגדל הגנה.


    אנשי טימור החריבו את המנזר ב-1400. הוא נבנה מחדש, אבל עד המאות ה-16–17 הלך והתרוקן. ב-1905 שירת הבידוד
    שלו קהל מסוג אחר לגמרי: מהפכנים הקימו כאן סדנה חשאית לייצור נשק חם וחומרי נפץ, הרחק מעיני המשטרה של
    הצאר.


    ואז — הגשר. גשר תמר חוצה את התדזאמי בקשת אבן אחת, באורך 12.5 מטר וברוחב 2.2 מטר, ויסודותיו נטועים
    בסלע הטבעי, במקום שבו חצתה פעם את הנהר הדרך הישנה משידה קרתלי לטריאלטי. בדרך כלל מתארכים אותו למאות
    ה-12–13. המסורת קושרת אותו למלכה תמר, שלפי הסיפור היה לה מעון קיץ בסביבה; זה סיפור ולא תיעוד, ושמה
    נקשר לגשרים גאורגיים עתיקים רבים.


    חצו אותו ברגל, כמו שעשו לפניכם נזירים, סוחרים ויצרני נשק.
  tip: >-
    הקצו שלוש שעות: כשעה במנזר, והשאר לדרך בערוץ ולהליכה אל הגשר. אחרי גשמים כבדים ובעונת הפשרת השלגים
    באביב, מעברי המים עלולים להיות עמוקים מדי לרכב נמוך — שאלו בצ'צ'ובטי לפני שאתם ממשיכים. בחורף הדרך
    נסגרת לעיתים קרובות לגמרי. נעלו נעלי הליכה של ממש; השבילים סלעיים. בערוץ אין חנות, אין בית קפה ואין
    קליטה סלולרית, אז הביאו מים ואוכל מקספי. התלבשו בצניעות במנזר. סוף אוקטובר, כשהיער מחליף צבעים, הוא
    הזמן היפה ביותר.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) עד מחלף איגואטי ופנו דרומה לקספי — תדלקו שם, זו תחנת הדלק
    האחרונה לפני הערוץ. מקספי המשיכו מערבה בכביש הישן (Sh29) עד מפיסקלקי, שם כביש Sh129 פונה דרומה ועולה
    בעמק התדזאמי דרך צ'צ'ובטי; המנזר נמצא כ-5.5 ק"מ אחרי הכפר. בסך הכול כ-75 ק"מ ושעה ו-45 דקות. כ-20
    הק"מ האחרונים הם דרך חצץ, עם מעברי מים וקטעים צרים: קחו רכב שטח, או לפחות רכב עם מרווח גחון טוב. חנו
    בשטח הפתוח ליד המנזר.
ar:
  name: دير ركوني وجسر تامار
  short: >-
    دير من القرن السابع في عمق وادي تيدزامي الحرجي، يُبلَغ عبر المخاضات والطرق الحصوية، ومعه جسر حجري
    من العصور الوسطى ما زال المشاة يعبرونه.
  body: >-
    **يختبئ ركوني في أقصى وادي تيدزامي، والطريق إليه — حصى ومخاضات وغابة تنغلق فوق الرأس — هو الفصل الأول
    من الزيارة.**


    تأسّس الدير في القرن السابع، على الأرجح بين عامي 642 و645، ليكون بيتاً للصلاة ونقطة مراقبة في آن:
    فقد كان العرب يتقدّمون، وكان هذا الوادي طريقاً بين شيدا كارتلي وترياليتي وجافاخيتي. قلبه كنيسة رقاد
    السيدة العذراء، بازيليكا ثلاثية الأروقة من النصف الثاني من القرن السابع، بأقواس شبه نصف دائرية وسقف
    معقود. وفي داخلها بقايا من الرسوم الجدارية، وعلى الدعامة الجنوبية لمدخلها صورة مرسومة لشخصية دنيوية
    لا يتأخر تاريخها عن القرن العاشر. وإلى جنوبها تقف كنيسة يوحنا المعمدان من القرنين الثالث عشر والرابع
    عشر، كنيسة ذات صحن واحد من الحجر المنحوت، وعلى ثلاث من واجهاتها أقواس زخرفية. وحولهما أطلال قاعة الطعام،
    وبرج أجراس من طابقين يعود إلى عهد لاحق، وبقايا برج دفاعي.


    في عام 1400 خرّب جنود تيمور الدير. أُعيد بناؤه، لكنه أخذ يخلو شيئاً فشيئاً بحلول القرنين السادس عشر
    والسابع عشر. وفي عام 1905 خدمت عزلته جماعة مختلفة تماماً: فقد أقام الثوّار هنا ورشة سرّية لصنع الأسلحة
    النارية والمتفجرات بعيداً عن أعين شرطة القيصر.


    ثم هناك الجسر. يعبر جسر تامار نهر تيدزامي بقوس حجري واحد، طوله 12.5 متراً وعرضه 2.2 متر، وأساساته
    قائمة على الصخر الطبيعي، في الموضع الذي كان الطريق القديم من شيدا كارتلي إلى ترياليتي يعبر فيه النهر.
    ويُؤرَّخ عادةً بالقرنين الثاني عشر والثالث عشر. ويربطه التقليد بالملكة تامار، التي يُقال إنها كانت
    تملك مقرّاً صيفياً قريباً؛ لكن هذه حكاية لا وثيقة، وكثير من الجسور الجورجية القديمة يحمل اسمها.


    اعبره سيراً على قدميك، كما فعل قبلك الرهبان والتجّار وصنّاع السلاح.
  tip: >-
    خصِّص ثلاث ساعات: نحو ساعة للدير، والباقي لطريق الوادي والمشي إلى الجسر. بعد الأمطار الغزيرة وفي ذوبان
    الثلوج ربيعاً قد تصبح المخاضات أعمق من أن تجتازها سيارة منخفضة، فاسأل في تشاتشوبيتي قبل أن تمضي. وكثيراً
    ما يُغلق الشتاء المسلك تماماً. البس حذاء مشي مناسباً، فالممرات حجرية. لا متجر ولا مقهى ولا تغطية للهاتف
    المحمول في الوادي، فاحمل الماء والطعام من كاسبي. التزم اللباس المحتشم في الدير. وأجمل الأوقات أواخر
    أكتوبر حين تتلوّن الغابة.
  route: >-
    اسلك الطريق السريع S1 (E60) غرباً من تبليسي حتى تقاطع إيغوئيتي، ثم انعطف جنوباً إلى كاسبي، واملأ خزان
    الوقود هنا فهي آخر محطة قبل الوادي. ومن كاسبي اتبع الطريق القديم (Sh29) غرباً إلى ميبيسكالاكي، حيث
    ينعطف الطريق Sh129 جنوباً صاعداً في وادي تيدزامي عبر تشاتشوبيتي؛ ويقع الدير على بُعد نحو 5.5 كم بعد
    القرية. المجموع نحو 75 كم وساعة و45 دقيقة. الكيلومترات العشرون الأخيرة تقريباً حصوية، فيها مخاضات
    ومقاطع ضيقة: خذ سيارة دفع رباعي، أو على الأقل سيارة مرتفعة جيداً عن الأرض. اركن في الساحة المكشوفة
    قرب الدير.
