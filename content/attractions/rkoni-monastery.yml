ka:
  name: რკონის მონასტერი და თამარის ხიდი
  short: >-
    შუასაუკუნეების მონასტერი თეძმის ხეობაში, ერთთაღიანი ქვის ხიდით, რომელიც საქართველოში საუკეთესოდ
    შემონახულთა შორისაა.
  body: >-
    **რკონი ხეობის ბოლოშია და გზაც ამ ამბის ნაწილია.** თეძმის ხეობა კასპის სამხრეთით ტრიალეთის ქედში
    შედის; გზა მდინარეს გაჰყვება, რამდენჯერმე გადაკვეთს და ბოლო კილომეტრებში ტყე ორივე მხრიდან ეხურება.


    მონასტერი VII საუკუნეში დაარსდა და შუა საუკუნეებში დიდ სავანედ იქცა. ცენტრში ღვთისმშობლის მიძინების
    ეკლესია დგას, რომელიც არაერთხელ გადაკეთდა; ირგვლივ სატრაპეზო, სენაკები, გალავნისა და კოშკის ნაშთებია.
    ზოგი ნაგებობა აღდგენილია, ზოგი მხოლოდ საძირკვლამდეა შემორჩენილი. მოქმედი მამათა მონასტერია, თუმცა
    მცირერიცხოვანი.


    ბევრისთვის მთავარი აქ ხიდია. თეძმზე გადებული **თამარის ხიდი** — ერთთაღიანი, წვეტიანი, ქვის — XII-XIII
    საუკუნეებით თარიღდება და დღემდე გამოიყენება ფეხით. მისი მოხრილი სილუეტი წყალში აირეკლება და ეს ალბათ
    ყველაზე ფოტოგრაფირებული შუასაუკუნეების ხიდია საქართველოში. სახელი ტრადიციულია, არა დოკუმენტური —
    თამარ მეფეს საქართველოში ბევრი ხიდი მიეწერება.


    სოფელი რკონი თითქმის დაცლილია. ხეობა კი ზაფხულში სასეირნოდ და საპიკნიკედ ივსება თბილისელებით: წყალი
    ცივია, ჩრდილი ბევრი, ბილიკები ხიდის ზემოთაც აგრძელებს. გაზაფხულზე მდინარე მღვრიე და ძლიერია, გვიან
    შემოდგომაზე კი ტყე ყვითელია და ხალხი აღარაა. ზამთარში გზა ხშირად გაუვალია.
  tip: >-
    სამი საათი გამოყავით — თავად მონასტერს ერთი საათი სჭირდება, დანარჩენი გზაზე და ხიდამდე სასეირნოდ
    მიდის. ბოლო მონაკვეთი ხრეშია მდინარის რამდენიმე გადასასვლელით; გაზაფხულზე წყალი მაღალია და მსუბუქი
    მანქანა ვერ გაივლის. სასეირნო ფეხსაცმელი აუცილებელია, ბილიკები ქვიანია. მაღაზია და კაფე ხეობაში არ
    არის — წყალი და საკვები კასპიდან წამოიღეთ. მონასტერში ჩაცმის წესები მოქმედებს. მობილურის კავშირი
    ხეობაში წყდება.
  route: >-
    თბილისიდან E60-ით იგოეთამდე, შემდეგ სამხრეთით კასპისა და ჩაჩუბეთის გავლით თეძმის ხეობაში. სულ 75 კმ,
    დაახლოებით საათი და ორმოცდახუთი წუთი. პირველი 55 კმ ასფალტია, ბოლო 20 კმ კი ხრეშის გზაა მდინარის
    გადასასვლელებით და ვიწრო მონაკვეთებით — SUV ან მაღალი კლირენსი საჭიროა, განსაკუთრებით გაზაფხულზე.
    საწვავი კასპში აიღეთ, ხეობაში სადგური არ არის. მანქანა მონასტრის წინ, ხიდთან რჩება.
en:
  name: Rkoni Monastery and Tamar's Bridge
  short: >-
    A medieval monastery at the head of the Tedzami gorge, with a single-arch stone bridge among the best
    preserved in Georgia.
  body: >-
    **Rkoni sits at the end of a gorge, and the drive in is part of the story.** The Tedzami valley cuts
    south from Kaspi into the Trialeti range; the road follows the river, crosses it several times, and
    in the last few kilometres the forest closes over both sides.


    The monastery was founded in the 7th century and grew into a large medieval house. At its centre
    stands the Church of the Dormition, rebuilt more than once. Around it are a refectory, cells, and the
    remains of an enclosure wall and tower. Some buildings have been restored, others survive only to
    foundation level. A small monastic community lives here.


    For many visitors the bridge is the real reason to come. **Tamar's Bridge** over the Tedzami is a
    single pointed arch in stone, dated to the 12th or 13th century and still used on foot. Its curve
    reflects in the water below, and it is probably the most photographed medieval bridge in Georgia. The
    name is traditional rather than documented; many bridges in Georgia are attributed to Queen Tamar.


    Rkoni village itself is nearly empty. The gorge, though, fills with Tbilisi families in summer for
    walking and picnics: the water is cold, there is plenty of shade, and paths continue upstream beyond
    the bridge. In spring the river runs high and muddy; in late October the beech and hornbeam turn
    yellow and the crowds are gone. In winter the track is often impassable.
  tip: >-
    Allow three hours: the monastery itself needs about one, the rest goes on the drive in and the walk
    to the bridge. The last stretch is gravel with several river crossings, and in spring the water is
    high enough to stop a low car. Walking shoes are necessary — the paths are stony. There is no shop or
    cafe in the gorge, so bring water and food from Kaspi. Dress rules apply at the monastery. Mobile
    signal drops out in the valley.
  route: >-
    Take the E60 from Tbilisi to Igoeti, then head south through Kaspi and Chachubeti into the Tedzami
    gorge. Seventy-five kilometres in all, roughly an hour and forty-five minutes. The first 55 km are
    asphalt; the final 20 km are gravel with river fords and narrow sections, so an SUV or decent ground
    clearance is needed, particularly in spring. Refuel in Kaspi, as there is no station in the gorge.
    Cars are left on the open ground in front of the monastery, near the bridge.
ru:
  name: Монастырь Ркони и мост Тамары
  short: >-
    Средневековый монастырь в верховьях Тедзамского ущелья с однопролётным каменным мостом, одним из
    лучше всего сохранившихся в Грузии.
  body: >-
    **Ркони стоит в конце ущелья, и дорога туда — часть впечатления.** Тедзамская долина уходит на юг от
    Каспи в Триалетский хребет; дорога идёт вдоль реки, несколько раз пересекает её, а на последних
    километрах лес смыкается с обеих сторон.


    Монастырь основан в VII веке и вырос в крупную средневековую обитель. В центре — церковь Успения,
    перестраивавшаяся не раз. Вокруг трапезная, кельи, остатки ограды и башни. Часть построек
    восстановлена, часть сохранилась лишь до уровня фундамента. Здесь живёт небольшая монашеская община.


    Для многих настоящая причина приехать — мост. **Мост Тамары** через Тедзами представляет собой одну
    стрельчатую каменную арку XII-XIII веков, по которой до сих пор ходят пешком. Его дуга отражается в
    воде, и это, вероятно, самый фотографируемый средневековый мост Грузии. Название традиционное, а не
    документальное: царице Тамар в Грузии приписывают множество мостов.


    Само село Ркони почти опустело. Зато ущелье летом наполняется тбилисскими семьями: вода холодная,
    тени много, тропы продолжаются вверх по течению за мостом. Весной река мутная и полноводная, в конце
    октября бук и граб желтеют, а людей уже нет. Зимой дорога часто непроходима.
  tip: >-
    Заложите три часа: сам монастырь займёт около часа, остальное уйдёт на дорогу и прогулку к мосту.
    Последний участок гравийный, с несколькими бродами; весной вода поднимается настолько, что низкая
    машина не пройдёт. Нужна прогулочная обувь — тропы каменистые. Магазина и кафе в ущелье нет, воду и
    еду везите из Каспи. В монастыре действуют правила одежды. Мобильная связь в долине пропадает.
  route: >-
    По E60 из Тбилиси до Игоети, затем на юг через Каспи и Чачубети в Тедзамское ущелье. Всего 75 км,
    примерно час сорок пять. Первые 55 км асфальт; последние 20 км — гравий с бродами и узкими участками,
    так что нужен внедорожник или приличный клиренс, особенно весной. Заправляйтесь в Каспи, в ущелье
    станций нет. Машины оставляют на площадке перед монастырём, у моста.
fa:
  name: صومعهٔ رکونی و پل تامار
  short: >-
    صومعه‌ای از سده‌های میانه در سرچشمهٔ درّهٔ تدزامی، با پلی سنگی تک‌دهانه که از بهترین نمونه‌های
    بازمانده در گرجستان است.
  body: >-
    **رکونی در انتهای یک درّه است و خودِ راه بخشی از ماجراست.** درّهٔ تدزامی از جنوب کاسپی به درون رشتهٔ
    تریالتی می‌برد؛ جاده کنار رود می‌رود، چند بار از آن می‌گذرد و در چند کیلومتر پایانی جنگل از دو سو بر
    آن بسته می‌شود.


    صومعه در سدهٔ هفتم بنیاد گرفت و در سده‌های میانه به مجموعه‌ای بزرگ بدل شد. در میانهٔ آن کلیسای
    خوابیدگی مریم ایستاده که بیش از یک بار بازسازی شده است. پیرامونش تالار غذاخوری، حجره‌ها و
    بازمانده‌های دیوار محوطه و برج دیده می‌شود. برخی بناها مرمت شده‌اند و برخی تنها تا پیِ خود مانده‌اند.
    جماعتی کوچک از راهبان اینجا زندگی می‌کنند.


    برای بسیاری، دلیل واقعی آمدن، پل است. **پل تامار** بر تدزامی یک طاق تیزه‌دار سنگی است که به سدهٔ
    دوازدهم یا سیزدهم بازمی‌گردد و هنوز پیاده از آن می‌گذرند. قوسش در آب زیر آن بازتاب می‌یابد و احتمالاً
    پرعکس‌ترین پل سده‌های میانه در گرجستان است. نام آن سنتی است نه مستند؛ پل‌های بسیاری در گرجستان به
    ملکه تامار نسبت داده می‌شوند.


    خود روستای رکونی تقریباً خالی است. اما درّه در تابستان از خانواده‌های تفلیسی پر می‌شود: آب سرد است،
    سایه فراوان، و مسیرها از بالای پل رو به سرچشمه ادامه می‌یابند. بهار رود پرآب و گل‌آلود است؛ اواخر مهر
    راش و ممرز زرد می‌شوند و شلوغی رفته است. زمستان راه اغلب بسته است.
  tip: >-
    سه ساعت در نظر بگیرید: خود صومعه حدود یک ساعت می‌خواهد و باقی صرف راه و پیاده‌روی تا پل می‌شود. بخش
    پایانی شنی است و چند گذرگاه رودخانه دارد، و در بهار آب چنان بالا می‌آید که خودروی کوتاه را متوقف
    می‌کند. کفش پیاده‌روی لازم است؛ مسیرها سنگی‌اند. در درّه مغازه و کافه نیست، پس آب و خوراک را از کاسپی
    بیاورید. در صومعه قواعد پوشش برقرار است. آنتن تلفن در درّه قطع می‌شود.
  route: >-
    از تفلیس روی E60 تا ایگوئتی، سپس به جنوب از کاسپی و چاچوبتی به درّهٔ تدزامی. روی‌هم ۷۵ کیلومتر، نزدیک
    یک ساعت و چهل‌وپنج دقیقه. ۵۵ کیلومتر نخست آسفالت است؛ ۲۰ کیلومتر پایانی شنی با گذر از رود و تنگناهایی
    است، پس خودروی شاسی‌بلند یا دست‌کم ارتفاع مناسب لازم است، به‌ویژه در بهار. سوخت را در کاسپی بگیرید،
    چون در درّه پمپی نیست. خودروها را در زمین باز پیش از صومعه، نزدیک پل، می‌گذارند.
he:
  name: מנזר רקוני וגשר תמר
  short: >-
    מנזר מימי הביניים בראש ערוץ טדזאמי, ובו גשר אבן בעל קשת אחת מן השמורים ביותר בגאורגיה.
  body: >-
    **רקוני יושב בקצה ערוץ, והנסיעה פנימה היא חלק מן הסיפור.** עמק הטדזאמי חותך דרומה מקאספי אל תוך רכס
    טריאלטי; הדרך הולכת לצד הנהר, חוצה אותו כמה פעמים, ובקילומטרים האחרונים היער נסגר משני הצדדים.


    המנזר נוסד במאה ה-7 וגדל למוסד גדול בימי הביניים. במרכזו עומדת כנסיית ההירדמות, שנבנתה מחדש יותר מפעם
    אחת. סביבה חדר אוכל, תאי נזירים ושרידי חומת מתחם ומגדל. חלק מן המבנים שוקמו, אחרים שרדו רק עד גובה
    היסודות. קהילה נזירית קטנה חיה כאן.


    עבור מבקרים רבים הגשר הוא הסיבה האמיתית לבוא. **גשר תמר** על הטדזאמי הוא קשת אבן מחודדת אחת, מתוארך
    למאה ה-12 או ה-13, ועדיין עוברים בו ברגל. הקימור שלו משתקף במים מתחת, וזהו כנראה גשר ימי הביניים
    המצולם ביותר בגאורגיה. השם מסורתי ולא מתועד; גשרים רבים בגאורגיה מיוחסים למלכה תמר.


    הכפר רקוני עצמו כמעט ריק. אך הערוץ מתמלא בקיץ במשפחות מטביליסי לטיולים ולפיקניקים: המים קרים, יש הרבה
    צל, והשבילים ממשיכים במעלה הזרם מעבר לגשר. באביב הנהר גבוה ועכור; בסוף אוקטובר האשור והגרניט מצהיבים
    והקהל נעלם. בחורף הדרך לרוב אינה עבירה.
  tip: >-
    הקצו שלוש שעות: המנזר עצמו דורש כשעה, והשאר הולך על הנסיעה פנימה ועל ההליכה אל הגשר. הקטע האחרון הוא
    חצץ עם כמה מעברי נהר, ובאביב המים גבוהים דיים כדי לעצור רכב נמוך. נעלי הליכה הכרחיות — השבילים
    אבניים. אין חנות או בית קפה בערוץ, לכן הביאו מים ואוכל מקאספי. במנזר חלים כללי לבוש. הקליטה הסלולרית
    נעלמת בעמק.
  route: >-
    סעו מטביליסי בכביש E60 עד איגואתי, ואז דרומה דרך קאספי וצ'אצ'ובתי אל ערוץ הטדזאמי. 75 ק״מ בסך הכול,
    כשעה וארבעים וחמש. 55 הקילומטרים הראשונים סלולים; 20 הקילומטרים האחרונים הם חצץ עם מעברי מים וקטעים
    צרים, ולכן נדרש רכב שטח או מרווח גחון סביר, במיוחד באביב. תדלקו בקאספי, שכן בערוץ אין תחנה. את הרכב
    משאירים על המשטח הפתוח לפני המנזר, ליד הגשר.
ar:
  name: دير ركوني وجسر تامار
  short: >-
    دير من العصور الوسطى في أعلى وادي تدزامي، وفيه جسر حجري بقوس واحد من أفضل الجسور حفظاً في جورجيا.
  body: >-
    **يقع ركوني في نهاية وادٍ، والطريق إليه جزء من الحكاية.** يقطع وادي تدزامي جنوباً من كاسبي إلى داخل
    سلسلة تريالتي؛ ويسير الطريق بمحاذاة النهر ويعبره مراراً، وفي الكيلومترات الأخيرة تنغلق الغابة من
    الجانبين.


    أُسس الدير في القرن السابع ونما ليصير داراً كبيرة في العصور الوسطى. وفي وسطه تقوم كنيسة رقاد العذراء
    التي أُعيد بناؤها أكثر من مرة. وحولها قاعة طعام وقلالي وبقايا سور وبرج. وقد رُمّم بعض الأبنية وبقي
    بعضها عند مستوى الأساس فقط. وتعيش هنا جماعة رهبانية صغيرة.


    وعند كثير من الزائرين يكون الجسر هو السبب الحقيقي للمجيء. **جسر تامار** فوق تدزامي قوس حجري مدبب
    واحد، يُؤرخ بالقرن الثاني عشر أو الثالث عشر، وما زال يُعبر سيراً. وينعكس انحناؤه في الماء تحته، وهو
    على الأرجح أكثر جسور العصور الوسطى تصويراً في جورجيا. والاسم تقليدي لا موثق؛ فجسور كثيرة في جورجيا
    تُنسب إلى الملكة تامار.


    وقرية ركوني نفسها شبه خالية. أما الوادي فيمتلئ صيفاً بعائلات من تبليسي للمشي ونزهات الطعام: الماء
    بارد، والظل وافر، والمسارات تواصل صعودها فوق الجسر. وفي الربيع يجري النهر عالياً عكراً؛ وفي أواخر
    تشرين الأول يصفرّ الزان والغرب ويختفي الزحام. وفي الشتاء يتعذر السلوك غالباً.
  tip: >-
    خصّص ثلاث ساعات: الدير نفسه يحتاج ساعة تقريباً، والباقي يذهب في الطريق وفي المشي إلى الجسر. والمقطع
    الأخير حصوي وفيه عدة مخاضات، وفي الربيع يرتفع الماء بما يكفي لإيقاف سيارة منخفضة. وحذاء المشي ضروري
    لأن المسارات حجرية. ولا متجر ولا مقهى في الوادي، فاحمل الماء والطعام من كاسبي. وتُطبق قواعد اللباس في
    الدير. وتنقطع تغطية الهاتف في الوادي.
  route: >-
    خذ الطريق E60 من تبليسي حتى إيغويتي، ثم اتجه جنوباً عبر كاسبي وتشاتشوبيتي إلى وادي تدزامي. خمسة
    وسبعون كيلومتراً إجمالاً، نحو ساعة وخمس وأربعين دقيقة. الخمسة والخمسون كيلومتراً الأولى معبّدة؛
    والعشرون الأخيرة حصى مع مخاضات نهرية ومقاطع ضيقة، فيلزم دفع رباعي أو ارتفاع مناسب عن الأرض، خاصة في
    الربيع. تزوّد بالوقود في كاسبي إذ لا محطة في الوادي. وتُترك السيارات على الأرض المكشوفة أمام الدير
    قرب الجسر.
