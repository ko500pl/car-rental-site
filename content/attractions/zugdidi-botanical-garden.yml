ka:
  name: ზუგდიდის ბოტანიკური ბაღი
  short: 1840-იან წლებში დადიანების პარკში გაშენებული ბაღი, სუბტროპიკული ხეებით და დადიანების სასახლის
    მეზობლად.
  body: >-
    **ზუგდიდის ბოტანიკური ბაღი საქართველოს უძველეს ბაღებშია** და პირდაპირ დადიანების სასახლის უკან იწყება.
    ორივე ერთ დღეში უნდა ნახო — ისინი ერთი და იმავე ოჯახის ორი მხარეა.


    ბაღი 1840-იან წლებში ეკატერინე ჭავჭავაძე-დადიანმა გააშენა, დავით დადიანის მეუღლემ. ეს ის ქალია, რომელიც
    ალექსანდრე ჭავჭავაძის ქალიშვილი და ნინო გრიბოედოვას დაა; 1853 წელს ქმრის გარდაცვალების შემდეგ სამეგრელოს
    რეგენტი გახდა, მოგვიანებით კი პარიზში წავიდა. ბაღი მისი ევროპული აღზრდისა და ადგილობრივი კლიმატის
    შეხვედრის შედეგია.


    კოლხეთის ჰავა აქ ყველაფერს განსაზღვრავს: რბილი, ნოტიო ზამთარი და წელიწადში ერთნახევარი ათასი მილიმეტრზე
    მეტი ნალექი. ეს ნიშნავს, რომ სუბტროპიკული სახეობები სათბურის გარეშე იზრდება — და სწორედ ამიტომ დაიწყო
    აქ იაპონიიდან, ჩინეთიდან და ამერიკიდან ჩამოტანილი მცენარეების გამოცდა.


    დღეს ბაღი დაახლოებით ოცდაექვს ჰექტარზეა გაშლილი. მასში კრიპტომერია, ქაფურის ხე, მაგნოლიები, ჰიმალაის
    კედარი, კორპის მუხა, სეკვოია, ბამბუკი, გინკგო და იაპონური ზღმარტლია. ზოგი ხე თითქმის ორასი წლისაა
    და ტანი იმდენად სქელი აქვს, რომ ორი ადამიანი ვერ შემოხვევს.


    პარკის ხერხემალი ძველი ხეივნებია, შუაში პატარა ტბორი და ყოფილი რეგულარული კვლების ნაშთები. საბჭოთა
    პერიოდში ბაღი სამეცნიერო დაწესებულება იყო; დღეს ის ნახევრად ველურია.


    საბჭოთა ათწლეულებში დასავლეთ საქართველო მთელი კავშირის ციტრუსის, ჩაისა და ტუნგის რაიონი იყო, ბაღი
    კი ამ პროგრამას ემსახურებოდა: ახალ ჯიშებს ჯერ აქ ცდიდნენ და მერე სამეგრელოში რგავდნენ. ამის კვალი
    დღესაც ჩანს — ციტრუსის ძველი ნარგავები, ჩაის ბუჩქები ხეივნების კიდეებში და აღმოსავლეთ კედელთან გაშენებული
    ბამბუკის კორომი, რომელიც ქარში მთელ ბაღზე ხმაურობს.


    მეზობელი მუზეუმიც ამ ისტორიის ნაწილია. დადიანების სასახლეში, ბაღიდან სამი წუთის სავალზე, ნაპოლეონის
    სამარხის ნიღაბი ინახება — ის სამეგრელოში სალომე დადიანისა და აშილ მიურატის ქორწინების გზით მოხვდა.
    ერთი ოჯახის ორი მემკვიდრეობა — ეგზოტიკური ხეები და ბონაპარტის რელიქვია — ერთმანეთის გვერდით დგას.


    აქვე უნდა ითქვას პირდაპირ: ეს არ არის მოვლილი საჩვენებელი ბაღი. ბილიკები წვიმის შემდეგ ტალახიანია,
    წარწერები ცოტაა, ზოგი უბანი მიტოვებულია. თუ ბათუმის ბოტანიკურ ბაღს ელოდები, იმედი გაგიცრუვდება.


    სამაგიეროდ, აქ თითქმის არავინაა. ზუგდიდელები ძაღლებს ასეირნებენ, სკოლის ბავშვები გაკვეთილებს გარბიან,
    ჩიტები ხმაურობენ. აპრილ-მაისში მაგნოლიები და აზალიები ყვავის, ნოემბერში კი ფოთოლი ფერდება — ეს ორი
    პერიოდი საუკეთესოა.


    ერთი საათი სავსებით საკმარისია, თუ უბრალოდ გაივლი; ორი — თუ ხეებს ცალ-ცალკე დაუწყებ ყურებას.
  tip: >-
    ერთი საათი კმარა. შესასვლელი სასახლის მხრიდანაა და ბილეთი სიმბოლურია. წვიმის შემდეგ ბილიკები ტალახიანია
    — მაგარი ფეხსაცმელი აუცილებელია, სანდლები არა. ზაფხულში კოღოა, განსაკუთრებით ტბორთან, ამიტომ საწინააღმდეგო
    საშუალება წაიღე. ჩრდილი უხვია და ცხელ დღეს აქ ქალაქზე გრილა. მერხები ცოტაა, ტუალეტი შესასვლელთანაა.
    კაფე ბაღში არ არის, მაგრამ სასახლის მოედანთან რამდენიმეა. ბავშვებთან ერთად სიარული უსაფრთხოა, ველოსიპედით
    — არა, რადგან ბილიკები ვიწროა და ფესვებით არის დაფარული. ზამთარშიც ღიაა და ჩვეულებრივ სრულიად ცარიელი.
  route: >-
    თბილისიდან E60-ით გორსა და ქუთაისზე გავლით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით — დაახლოებით 320
    კმ და ოთხი საათი ორმოცი წუთი. გზა ბოლომდე ასფალტია, დიდი ნაწილი ავტობანი, მდგომარეობა კარგი. ბაღი
    ქალაქის ცენტრშია, დადიანების სასახლის უკან; ორივესთვის ერთი შესახვევია საკმარისი. პარკირება სასახლის
    წინ, ქუჩაზეა და უფასოა, თუმცა ზაფხულის შუადღეს ადგილი ცოტაა. საწვავი სენაკში ან ზუგდიდში აიღე. ეკონომ-კლასის
    ავტომობილი მთელი წლის განმავლობაში სავსებით საკმარისია.
en:
  name: Zugdidi Botanical Garden
  short: A garden laid out in the 1840s behind the Dadiani palace, full of subtropical trees and almost
    always empty.
  body: >-
    **Zugdidi's botanical garden is among the oldest in Georgia,** and it begins immediately behind the
    Dadiani palace. The two belong together: they are two sides of the same family's life.


    The garden was laid out in the 1840s by Ekaterine Chavchavadze-Dadiani, wife of David Dadiani. She
    was a daughter of the poet Alexander Chavchavadze and a sister of Nino, Griboedov's widow; after her
    husband's death in 1853 she became regent of Mingrelia, and later moved to Paris. The garden is what
    happened when a European education met the Colchic climate.


    That climate decides everything here: mild wet winters and well over fifteen hundred millimetres of
    rain a year. Subtropical species grow outdoors without glass, which is why the estate became a place
    for trying out plants brought from Japan, China and the Americas.


    The garden now covers about twenty-six hectares. In it are cryptomeria, camphor laurel, magnolias,
    Himalayan cedar, cork oak, sequoia, bamboo, ginkgo and loquat. Some trees are close to two centuries
    old and thick enough that two people cannot reach round them.


    The structure is a set of old avenues, a small pond in the middle, and the remains of formal beds.
    In the Soviet period this was a scientific institution; now it is half wild.


    In the Soviet decades western Georgia was the citrus, tea and tung-oil district of the entire union,
    and the garden served that programme: new varieties were trialled here before being planted out across
    Samegrelo. Traces remain — old citrus stock, tea bushes at the edges of the avenues, and a bamboo
    grove by the eastern wall that is the loudest thing in the garden in a wind.


    The museum next door belongs to the same story. Three minutes away in the Dadiani palace is Napoleon's
    death mask, which reached Mingrelia through the marriage of Salome Dadiani and Achille Murat. Two
    inheritances of one family, exotic trees and a Bonaparte relic, sit side by side.


    It is fair to say plainly what it is not. This is not a manicured show garden. Paths turn to mud after
    rain, labelling is thin, and parts of it are simply neglected. Anyone arriving with Batumi's botanical
    garden in mind will be disappointed.


    What it offers instead is emptiness. People from Zugdidi walk dogs here, schoolchildren skip lessons,
    and the birds are loud. April and May bring magnolia and azalea; November brings colour. Those are
    the two best moments.


    An hour is enough for a walk through, two if you start looking at individual trees.
  tip: >-
    An hour covers it. The entrance is on the palace side and the ticket is nominal. After rain the paths
    are muddy, so proper shoes matter and sandals do not work. Mosquitoes are active in summer, especially
    near the pond, so bring repellent. There is plenty of shade and on a hot day it is noticeably cooler
    here than in the streets. Benches are few and the toilet is by the entrance. There is no café inside,
    but several stand near the palace square, two minutes away.
  route: >-
    From Tbilisi take the E60 west through Gori and Kutaisi to Senaki, then continue towards Zugdidi —
    about 320 km and four hours forty. The road is asphalt throughout, largely dual carriageway, and in
    good condition. The garden is in the town centre, directly behind the Dadiani palace, so one turning
    serves both. Parking is on the street in front of the palace and is free, though space is short on
    summer afternoons. Refuel in Senaki or Zugdidi. An economy car is entirely sufficient all year round.
ru:
  name: Зугдидский ботанический сад
  short: Сад, разбитый в 1840-х годах за дворцом Дадиани, с субтропическими деревьями и почти всегда пустыми
    аллеями.
  body: >-
    **Зугдидский ботанический сад — один из старейших в Грузии,** и начинается он сразу за дворцом Дадиани.
    Эти два места стоит смотреть вместе: они две стороны жизни одной семьи.


    Сад разбила в 1840-х годах Екатерина Чавчавадзе-Дадиани, жена Давида Дадиани. Она была дочерью поэта
    Александра Чавчавадзе и сестрой Нины, вдовы Грибоедова; после смерти мужа в 1853 году стала регентшей
    Мегрелии, а позже уехала в Париж. Сад — результат встречи европейского воспитания с колхидским климатом.


    Климат здесь решает всё: мягкая сырая зима и больше полутора тысяч миллиметров осадков в год. Субтропические
    виды растут под открытым небом, без теплиц, — поэтому имение и стало местом, где испытывали растения,
    привезённые из Японии, Китая и Америки.


    Сегодня сад занимает около двадцати шести гектаров. В нём криптомерия, камфорный лавр, магнолии, гималайский
    кедр, пробковый дуб, секвойя, бамбук, гинкго и локва. Некоторым деревьям почти двести лет, и обхватить
    их вдвоём не получается.


    Каркас сада — старые аллеи, небольшой пруд посередине и остатки регулярных куртин. В советское время
    это было научное учреждение; сейчас сад наполовину одичал.


    В советские десятилетия Западная Грузия была цитрусовым, чайным и тунговым районом всего Союза, и
    сад работал на эту программу: новые сорта испытывали здесь, прежде чем высаживать по всей Мегрелии.
    Следы видны и сейчас — старые цитрусовые посадки, кусты чая по краям аллей и бамбуковая роща у восточной
    ограды, которая в ветер шумит громче всего сада.


    Соседний музей — часть той же истории. В трёх минутах ходьбы, во дворце Дадиани, хранится посмертная
    маска Наполеона: она попала в Мегрелию через брак Саломе Дадиани и Ашиля Мюрата. Два наследства одной
    семьи — экзотические деревья и бонапартовская реликвия — стоят рядом.


    Стоит сказать прямо, чем он не является. Это не ухоженный парадный парк. После дождя дорожки раскисают,
    табличек мало, часть территории попросту заброшена. Тот, кто приедет с батумским ботаническим садом
    в голове, будет разочарован.


    Зато здесь пусто. Зугдидцы выгуливают собак, школьники прогуливают уроки, птицы шумят. В апреле и
    мае цветут магнолии и азалии, в ноябре загорается листва — два лучших момента.


    Часа хватит на прогулку, двух — если начать разглядывать отдельные деревья.
  tip: >-
    Часа достаточно. Вход со стороны дворца, билет символический. После дождя дорожки грязные, так что
    нужна нормальная обувь, сандалии не годятся. Летом донимают комары, особенно у пруда, — возьмите средство.
    Тени много, и в жару здесь заметно прохладнее, чем на улицах. Скамеек мало, туалет у входа. Кафе внутри
    нет, но несколько есть у дворцовой площади, в двух минутах ходьбы. С детьми гулять безопасно, на велосипеде
    неудобно: дорожки узкие и в корнях.
  route: >-
    Из Тбилиси на запад по E60 через Гори и Кутаиси до Сенаки, дальше в сторону Зугдиди — около 320 км
    и четыре часа сорок минут. Дорога асфальтированная на всём протяжении, в основном скоростная, состояние
    хорошее. Сад в центре города, прямо за дворцом Дадиани, так что один поворот обслуживает оба места.
    Парковка вдоль улицы перед дворцом бесплатная, хотя летом днём мест мало. Заправляйтесь в Сенаки или
    Зугдиди. Машины эконом-класса вполне достаточно круглый год.
fa:
  name: باغ گیاه‌شناسی زوگدیدی
  short: باغی که در دههٔ ۱۸۴۰ پشت کاخ داديانی طرح شد، پر از درختان نیمه‌گرمسیری و تقریباً همیشه خلوت.
  body: >-
    **باغ گیاه‌شناسی زوگدیدی از کهن‌ترین باغ‌های گرجستان است** و درست پشت کاخ داديانی آغاز می‌شود. این
    دو به هم تعلق دارند: دو روی زندگی یک خانواده‌اند.


    باغ را در دههٔ ۱۸۴۰ اکاترینه چاوچاوادزه‑داديانی، همسر داوید داديانی، طرح افکند. او دختر الکساندر چاوچاوادزهٔ
    شاعر و خواهر نینو، بیوهٔ گریبایدوف، بود؛ پس از مرگ شوهرش در ۱۸۵۳ نایب‌السلطنهٔ مینگرلیا شد و بعدها
    به پاریس رفت. این باغ حاصل برخورد یک تربیت اروپایی با اقلیم کولخیس است.


    اقلیم اینجا همه چیز را تعیین می‌کند: زمستان ملایم و نمناک و بیش از هزار و پانصد میلی‌متر بارش در سال.
    گونه‌های نیمه‌گرمسیری بی‌گلخانه در فضای باز می‌رویند، و به همین سبب این ملک جایی شد برای آزمودن گیاهانی
    که از ژاپن و چین و آمریکا آورده بودند.


    باغ امروز حدود بیست و شش هکتار است. در آن کریپتومریا، درخت کافور، ماگنولیا، سرو هیمالیا، بلوط چوب‌پنبه،
    سکویا، بامبو، جینکو و ازگیل ژاپنی هست. برخی درختان نزدیک دو سده عمر دارند و چنان ستبرند که دو نفر
    نمی‌توانند دورشان دست بگیرند.


    استخوان‌بندی باغ چند خیابان کهن است، برکه‌ای کوچک در میانه و بازمانده‌های کرت‌های منظم. در دورهٔ شوروی
    اینجا نهادی علمی بود؛ اکنون نیمه‌وحشی است.


    در دهه‌های شوروی، گرجستان غربی ناحیهٔ مرکبات و چای و روغن تونگِ سراسر اتحاد بود و باغ در خدمت همان
    برنامه قرار داشت: رقم‌های تازه نخست اینجا آزموده می‌شد و سپس در سراسر سامگرلو کاشته. نشانه‌ها هنوز
    مانده است: پایه‌های کهن مرکبات، بوته‌های چای در کنارهٔ خیابان‌ها، و بیشهٔ بامبو کنار دیوار شرقی که
    در باد پرصداترین چیز باغ است.


    موزهٔ همسایه هم بخشی از همین داستان است. سه دقیقه آن‌سوتر، در کاخ داديانی، نقاب مرگ ناپلئون نگهداری
    می‌شود که از راه ازدواج سالومه داديانی و آشیل مورا به مینگرلیا رسید. دو میراث یک خانواده، درختان غریب
    و یادگاری بناپارتی، کنار هم ایستاده‌اند.


    باید صریح گفت که چه نیست. این باغی آراسته و نمایشی نیست. پس از باران راه‌ها گِل می‌شود، برچسب‌ها اندک
    است و بخش‌هایی به‌کلی رها شده. هرکس با تصویر باغ گیاه‌شناسی باتومی در ذهن بیاید سرخورده می‌شود.


    در عوض خلوت است. مردم زوگدیدی سگ می‌گردانند، دانش‌آموزان از درس می‌گریزند و پرندگان پرصدایند. فروردین
    و اردیبهشت ماگنولیا و آزالیا گل می‌دهد و آبان برگ‌ها رنگ می‌گیرند؛ همین دو زمان بهترین‌اند.


    یک ساعت برای گشتی کافی است و دو ساعت اگر بنا را بر تماشای تک‌تک درختان بگذارید.
  tip: >-
    یک ساعت بس است. ورودی از سمت کاخ است و بلیت نمادین. پس از باران راه‌ها گِلی است، پس کفش مناسب مهم
    است و صندل به کار نمی‌آید. تابستان پشه هست، به‌ویژه کنار برکه، پس مادهٔ دورکننده بردارید. سایه فراوان
    است و در روز گرم اینجا محسوس خنک‌تر از خیابان‌هاست. نیمکت کم است و سرویس بهداشتی کنار ورودی. کافه‌ای
    درون باغ نیست، اما چند کافه در میدان کاخ در دو دقیقه‌ای هست.
  route: >-
    از تفلیس با بزرگراه E60 به غرب، از گوری و کوتایسی تا سناکی و سپس به سوی زوگدیدی — حدود ۳۲۰ کیلومتر
    و چهار ساعت و چهل دقیقه. جاده تا انتها آسفالت است، بیشترش دوبانده و در وضعیت خوب. باغ در مرکز شهر
    و درست پشت کاخ داديانی است، پس یک انشعاب برای هر دو کافی است. پارک در خیابان روبه‌روی کاخ رایگان است،
    هرچند بعدازظهرهای تابستان جا کم می‌شود. سوخت را در سناکی یا زوگدیدی بگیرید. خودروی اقتصادی تمام سال
    کاملاً کافی است.
he:
  name: הגן הבוטני של זוגדידי
  short: גן שהוקם בשנות הארבעים של המאה ה-19 מאחורי ארמון דאדיאני, מלא עצים סובטרופיים וכמעט תמיד ריק.
  body: >-
    **הגן הבוטני של זוגדידי הוא מן העתיקים בגאורגיה,** והוא מתחיל מיד מאחורי ארמון דאדיאני. השניים שייכים
    זה לזה: הם שני צדדים של חיי אותה משפחה.


    את הגן תכננה בשנות הארבעים של המאה התשע-עשרה אקטרינה צ׳אוצ׳אוואדזה-דאדיאני, אשתו של דויד דאדיאני.
    היא הייתה בתו של המשורר אלכסנדר צ׳אוצ׳אוואדזה ואחותה של נינו, אלמנתו של גריבויידוב; אחרי מות בעלה
    ב-1853 שימשה עוצרת מינגרליה, ולימים עברה לפריז. הגן הוא מה שקרה כשחינוך אירופי פגש את אקלים קולכיס.


    האקלים קובע כאן הכול: חורף מתון ולח ולמעלה מאלף וחמש מאות מילימטרים גשם בשנה. מינים סובטרופיים גדלים
    בחוץ בלי חממה, ולכן הפכה האחוזה למקום שבו ניסו צמחים שהובאו מיפן, מסין ומאמריקה.


    הגן משתרע היום על כעשרים ושישה הקטרים. יש בו קריפטומריה, עץ קמפור, מגנוליות, ארז הימלאיה, אלון שעם,
    סקויה, במבוק, גינקו ושסק. אחדים מן העצים בני קרוב למאתיים שנה, ועבים כל כך ששני אנשים אינם מקיפים
    אותם.


    שלד הגן הוא שדרות ישנות, בריכה קטנה במרכז ושרידי ערוגות מסודרות. בתקופה הסובייטית היה זה מוסד מדעי;
    היום הוא פרא למחצה.


    בעשורים הסובייטיים הייתה גאורגיה המערבית מחוז ההדרים, התה ושמן הטונג של כל ברית המועצות, והגן שירת
    את התוכנית הזאת: זנים חדשים נוסו כאן לפני שנשתלו ברחבי סמגרלו. העקבות נותרו — כני הדרים ישנים, שיחי
    תה בשולי השדרות, וחורשת במבוק ליד החומה המזרחית שהיא הדבר הרועש ביותר בגן ברוח.


    גם המוזיאון הסמוך שייך לאותו סיפור. שלוש דקות משם, בארמון דאדיאני, שמורה מסכת המוות של נפוליאון, שהגיעה
    למינגרליה דרך נישואיהם של סלומה דאדיאני ואשיל מורא. שתי ירושות של משפחה אחת, עצים אקזוטיים ושריד בונפרטי,
    עומדות זו לצד זו.


    ראוי לומר בפירוש מה הוא אינו. זה אינו גן ראווה מטופח. אחרי גשם השבילים נעשים בוץ, השילוט דל וחלקים
    ממנו פשוט מוזנחים. מי שיגיע עם הגן הבוטני של בטומי בראש יתאכזב.


    מה שיש כאן במקום זה הוא ריקנות. תושבי זוגדידי מוציאים כלבים, תלמידים מבריזים משיעורים, והציפורים רועשות.
    אפריל ומאי מביאים מגנוליה ואזלאה, נובמבר מביא צבע. אלה שני הרגעים הטובים.


    שעה מספיקה להליכה, שעתיים אם מתחילים להתבונן בעצים אחד-אחד.
  tip: >-
    שעה מכסה את המקום. הכניסה מצד הארמון והכרטיס סמלי. אחרי גשם השבילים בוציים, ולכן נעליים ראויות חשובות
    וסנדלים אינם מתאימים. בקיץ יש יתושים, בעיקר ליד הבריכה, אז קחו דוחה. יש צל בשפע, וביום חם קריר כאן
    במידה ניכרת מאשר ברחובות. הספסלים מעטים והשירותים ליד הכניסה. אין בית קפה בתוך הגן, אך כמה כאלה נמצאים
    בכיכר הארמון, שתי דקות משם. עם ילדים ההליכה בטוחה, על אופניים פחות: השבילים צרים ומלאי שורשים.
  route: >-
    מטביליסי מערבה בכביש E60 דרך גורי וקוטאיסי עד סנאקי, ומשם לכיוון זוגדידי — כ-320 ק״מ וארבע שעות וארבעים.
    הכביש סלול לכל אורכו, ברובו דו-מסלולי ובמצב טוב. הגן במרכז העיר, ממש מאחורי ארמון דאדיאני, כך שפנייה
    אחת משרתת את שני המקומות. החניה ברחוב מול הארמון חינם, אם כי בשעות אחר הצהריים בקיץ המקומות מעטים.
    תדלקו בסנאקי או בזוגדידי. רכב חסכוני מספיק לחלוטין בכל ימות השנה.
ar:
  name: حديقة زوغديدي النباتية
  short: حديقة أُنشئت في أربعينيات القرن التاسع عشر خلف قصر داديياني، مليئة بأشجار شبه استوائية وخالية
    غالباً.
  body: >-
    **حديقة زوغديدي النباتية من أقدم حدائق جورجيا،** وتبدأ مباشرة خلف قصر داديياني. والموضعان ينتميان
    معاً: فهما وجهان لحياة أسرة واحدة.


    أنشأت الحديقة في أربعينيات القرن التاسع عشر إيكاترينه تشافتشافادزه داديياني، زوجة داويد داديياني.
    كانت ابنة الشاعر ألكسندر تشافتشافادزه وأخت نينو أرملة غريبايدوف؛ وبعد وفاة زوجها عام 1853 صارت وصية
    على مينغريليا، ثم انتقلت لاحقاً إلى باريس. والحديقة هي ما حدث حين التقت تربية أوروبية بمناخ كولخيس.


    هذا المناخ يقرر كل شيء هنا: شتاء معتدل رطب وأمطار تزيد على ألف وخمسمئة مليمتر في السنة. تنمو الأنواع
    شبه الاستوائية في الهواء الطلق بلا بيوت زجاجية، ولذلك صارت الضيعة موضعاً لتجريب نباتات جيء بها من
    اليابان والصين والأمريكتين.


    تمتد الحديقة اليوم على نحو ستة وعشرين هكتاراً. فيها الكريبتوميريا وغار الكافور والماغنوليا وأرز الهيمالايا
    وبلوط الفلين والسكويا والخيزران والجنكة والأسكدنيا. وبعض الأشجار يقارب عمره قرنين، وهي من الغلظ بحيث
    لا يطوقها شخصان.


    هيكل الحديقة جادات قديمة وبركة صغيرة في الوسط وبقايا أحواض منتظمة. وفي العهد السوفييتي كانت مؤسسة
    علمية؛ أما اليوم فهي شبه برية.


    في العقود السوفييتية كانت جورجيا الغربية إقليم الحمضيات والشاي وزيت التونغ للاتحاد كله، وكانت الحديقة
    في خدمة ذلك البرنامج: تُجرَّب الأصناف الجديدة هنا قبل أن تُغرس في أنحاء سامغريلو. وما زالت الآثار
    باقية: أصول حمضيات قديمة، وشجيرات شاي على أطراف الجادات، وأجمة خيزران عند السور الشرقي هي أعلى ما
    في الحديقة صوتاً حين تهب الريح.


    والمتحف المجاور جزء من القصة نفسها. فعلى بعد ثلاث دقائق، في قصر داديياني، يُحفظ قناع نابليون الجنائزي،
    وقد بلغ مينغريليا عبر زواج سالومي داديياني وأشيل مورا. إرثان لأسرة واحدة، أشجار غريبة وأثر بونابرتي،
    يقفان جنباً إلى جنب.


    ومن الإنصاف أن نقول بوضوح ما ليست هي. ليست حديقة عرض مشذبة. فبعد المطر تصير الممرات طيناً، واللافتات
    قليلة، وبعض الأجزاء مهمل ببساطة. ومن يأتي وفي ذهنه حديقة باتومي النباتية سيصاب بخيبة.


    لكن ما تقدمه بدلاً من ذلك هو الخلاء. أهل زوغديدي يمشون بكلابهم، وتلاميذ المدارس يتهربون من الحصص،
    والطيور صاخبة. نيسان وأيار يجلبان الماغنوليا والأزاليا، وتشرين الثاني يجلب الألوان. وهذان أفضل موسمين.


    ساعة تكفي للتجول، وساعتان إن بدأت تتأمل الأشجار واحدة واحدة.
  tip: >-
    ساعة تغطي المكان. المدخل من جهة القصر والتذكرة رمزية. وبعد المطر تصير الممرات موحلة، فالحذاء المناسب
    مهم والصندل لا ينفع. البعوض نشط في الصيف وخاصة قرب البركة، فاحمل طارداً. الظل وافر، وفي اليوم الحار
    يكون الجو هنا أبرد بوضوح من الشوارع. المقاعد قليلة ودورة المياه عند المدخل. ولا مقهى داخل الحديقة،
    لكن عدة مقاهٍ عند ساحة القصر على بعد دقيقتين.
  route: >-
    من تبليسي غرباً على الطريق E60 عبر غوري وكوتايسي حتى سيناكي، ثم باتجاه زوغديدي — نحو 320 كم وأربع
    ساعات وأربعين دقيقة. الطريق معبّد بكامله، ومعظمه مزدوج وبحالة جيدة. الحديقة في وسط المدينة خلف قصر
    داديياني مباشرة، فمنعطف واحد يخدم الموضعين. الوقوف في الشارع أمام القصر مجاني، وإن ضاقت الأماكن بعد
    ظهر الصيف. تزوّد بالوقود في سيناكي أو زوغديدي. والسيارة الاقتصادية كافية تماماً على مدار السنة.
