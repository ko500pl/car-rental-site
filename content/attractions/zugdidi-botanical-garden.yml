ka:
  name: ზუგდიდის ბოტანიკური ბაღი
  short: >-
    დადიანების 1840 წელს გაშენებული ბაღი ზუგდიდის სასახლის უკან: ჭადრის ხეივნები, მაგნოლიები, კედრები
    და კუნძულიანი ტბა, ტრიესტელი მებაღის ნაკეთები.
  body: >-
    **1856 წელს ისქანდერ-ფაშამ, რომლის გარნიზონსაც მეგრელები მოსვენებას არ აძლევდნენ, ეს ბაღი გაჩეხვინა
    და ძირფესვიანად ამოათხრევინა; რცხილის ხეივანი, რომელშიც დღეს სეირნობთ, მოჭრილი ხეების ძირკვებიდან
    ამოიზარდა.**


    ბაღის ისტორია 1840 წელს იწყება, როცა სამეგრელოს ახალმა მთავარმა, დავით დადიანმა, სასახლის გარშემო
    ტყის ნაწილი შემოღობა და მებაღეთა მუდმივი შტატი დააწესა. მალე ბაღი მეუღლეს, პოეტ ალექსანდრე ჭავჭავაძის
    ასულს, ეკატერინე ჭავჭავაძე-დადიანს ჩააბარა. ეკატერინემ ტრიესტიდან მებაღე ჟოზეფ ბაბინი მოიწვია, რომელმაც
    ტყე ფრანგული, სიმეტრიული გეგმით გადააწყო და ხელოვნური ტბა კუნძულით გააშენა — ის დღესაც აქ არის.


    მერე ომი მოვიდა. 1855 წელს ომარ-ფაშას ოცდაათათასიანმა ჯარმა სამეგრელოში ნახევარ წელზე მეტი დაჰყო,
    მომდევნო წელს კი ბაღი გაანადგურეს. ეკატერინემ, რომელმაც 1853 წელს ქმრის სიკვდილის შემდეგ სამთავროს
    მართვა იკისრა, ზავისთანავე აღდგენა დაიწყო, ნამდვილი აღორძინება კი 1869 წლიდან, საფრანგეთიდან მისი
    დაბრუნების შემდეგ მოვიდა. 1896 წელს იტალიის ქალაქ ვარეზედან ძმები გაეტანო და ჯოვანი ზამბერლეტები ჩამოვიდნენ,
    პეტერბურგიდან იშვიათი თესლი და ნერგები ჩამოიტანეს და გოლიათი ჭადრების ხეივნები გააშენეს, რომლებიც
    დღეს ბაღს 1182 მეტრზე სერავს.


    კოლექციაში ოთხმოცამდე გვარია აზიიდან, ხმელთაშუაზღვისპირეთიდან და ამერიკიდან: მაგნოლიის ექვსი სახეობა,
    ატლასისა და ჰიმალაის კედრები, მუხის სხვადასხვა სახეობა. ზოგი უცხოელი დღემდე ჭირვეულობს: კორპის მუხა
    იზრდება, მაგრამ არ ყვავის, ქაღალდის ხის ერთადერთი ეგზემპლარი კი მდედრია და ნაყოფს ვერ იმწიფებს.


    1970 წლიდან ბაღი მეცნიერებათა აკადემიის ცენტრალური ბოტანიკური ბაღის ფილიალია, 2020 წლისთვის კი დიდი
    რეაბილიტაცია გაიარა: განახლდა ხეივნები და ტბა. სასახლე ნაპოლეონის სიკვდილის ნიღბით ორიოდე წუთის სავალზეა.


    აპრილში მაგნოლიებისთვის ჩამოდით, ნოემბერში — ფერისთვის, როცა ჭადრები ხეივნებს ფართო ყვითელი ფოთლებით
    ფარავს.
  tip: >-
    გასასეირნებლად ერთი საათი კმარა, თუ ხეებს ცალ-ცალკე დაუწყებთ თვალიერებას — ორი. შესასვლელი სასახლის
    მხრიდანაა, საფასური სიმბოლურია (ბოლო ცნობით 2 ₾). ბაღის დიდი ნაწილი ხშირ ჩრდილშია და ივლისში აქ ქალაქის
    ქუჩებთან შედარებით შესამჩნევად გრილა. ზაფხულში ტბასთან კოღოები გროვდება — საწინააღმდეგო საშუალება
    წაიღეთ. წვიმის შემდეგ ბილიკები შეიძლება დარბილდეს, ამიტომ სანდლებს ჯობია დახურული ფეხსაცმელი. ბაღი
    მეზობელ დადიანების სასახლე-მუზეუმთან ერთად ნახეთ. კაფეები სასახლის მოედანთანაა, ორიოდე წუთის სავალზე.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით, გორისა და ქუთაისის გავლით, სამტრედიამდე იარეთ, შემდეგ
    ისევ ს1-ით, სენაკის გავლით, ზუგდიდამდე: დაახლოებით 320 კილომეტრი და ოთხი საათი და ორმოცი წუთი. გზა
    ბოლომდე ასფალტია და კარგ მდგომარეობაშია. ბაღი ქალაქის ცენტრში, პირდაპირ დადიანების სასახლის უკანაა,
    ამიტომ ორივესთვის ერთი მისამართი კმარა. მანქანა სასახლესთან, ქუჩაში დააყენეთ; პარკირება უფასოა, თუმცა
    ზაფხულის შუადღეებზე ადგილი ცოტაა. საწვავი სენაკში ან ზუგდიდში ჩაასხით. ეკონომ-კლასის მანქანა ნებისმიერ
    სეზონში საკმარისია.
en:
  name: Zugdidi Botanical Garden
  short: >-
    The Dadiani princes' garden of 1840 behind their Zugdidi palace: plane avenues, magnolias, cedars
    and an island lake laid out by a gardener from Trieste.
  body: >-
    **In 1856 Iskander Pasha, his garrison harried by Mingrelian fighters, had this garden cut down and
    grubbed up; the hornbeam avenue you walk along today grew back from the stumps.**


    The garden begins in 1840, when David Dadiani, newly ruler of Mingrelia, fenced off the forest around
    his palace and put gardeners on permanent staff. He soon handed it to his wife, Ekaterine Chavchavadze-Dadiani,
    daughter of the poet Alexander Chavchavadze. She brought in Joseph Babini, a gardener from Trieste,
    who reshaped the woodland to a symmetrical French plan and dug an artificial lake with an island,
    still there today.


    Then the war arrived. In 1855 Omar Pasha's army of 30,000 occupied Samegrelo for more than half a
    year, and the following year the garden was destroyed. Ekaterine, who had governed the principality
    since David's death in 1853, began restoring it after the peace, but the real revival came from 1869,
    once she was back from France. In 1896 the brothers Gaetano and Giovanni Zamberletti arrived from
    Varese with rare seeds and saplings from St Petersburg, and planted the giant plane avenues that now
    run through the park for 1,182 metres.


    The collection spans some eighty genera from Asia, the Mediterranean and the Americas: six kinds of
    magnolia, Atlas and Himalayan cedars, a range of oaks. Some exotics still sulk. The cork oak grows
    but will not flower, and the lone paper mulberry is female, so its fruit never ripens.


    Since 1970 the garden has been a branch of the Academy of Sciences' Central Botanical Garden, and
    by 2020 a major rehabilitation had renewed its avenues and lake. The palace, with Napoleon's death
    mask, is a two-minute walk away.


    Come in April for the magnolias, or in November, when the planes pave the avenues with broad yellow
    leaves.
  tip: >-
    An hour covers a walk, two if you start looking at individual trees. The entrance is on the palace
    side and the fee is nominal (2 ₾ at last check). Much of the garden lies in deep shade, noticeably
    cooler than the streets in July. Mosquitoes gather by the lake in summer, so bring repellent. Paths
    can turn soft after rain, so closed shoes beat sandals. Pair the garden with the Dadiani Palace museum
    next door. Cafés are on the palace square, a couple of minutes away.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Kutaisi to Samtredia, then continue on the S1 through
    Senaki to Zugdidi: about 320 km and four hours forty. It is asphalt all the way and in good condition.
    The garden lies in the town centre directly behind the Dadiani Palace, so one address serves both.
    Park on the street by the palace; it is free, though spaces run short on summer afternoons. Fuel in
    Senaki or Zugdidi. An economy car is all you need, in any season.
ru:
  name: Зугдидский ботанический сад
  short: >-
    Сад князей Дадиани 1840 года за их дворцом в Зугдиди: платановые аллеи, магнолии, кедры и озеро с
    островом, устроенное садовником из Триеста.
  body: >-
    **В 1856 году Искандер-паша, чьему гарнизону не давали покоя мегрельские бойцы, приказал вырубить
    этот сад и выкорчевать его; грабовая аллея, по которой вы идёте сегодня, отросла от пней.**


    История сада начинается в 1840 году, когда Давид Дадиани, только что ставший владетелем Мегрелии,
    огородил лес вокруг своего дворца и взял садовников на постоянную службу. Вскоре он передал сад жене,
    Екатерине Чавчавадзе-Дадиани, дочери поэта Александра Чавчавадзе. Та пригласила садовника из Триеста
    Джозефа Бабини, который перекроил лесной массив по симметричному французскому плану и выкопал искусственное
    озеро с островом — оно на месте и сегодня.


    Потом пришла война. В 1855 году тридцатитысячная армия Омер-паши больше полугода занимала Самегрело,
    а на следующий год сад был уничтожен. Екатерина, правившая княжеством после смерти Давида в 1853 году,
    начала восстанавливать его после заключения мира, но настоящее возрождение началось в 1869-м, когда
    она вернулась из Франции. В 1896 году из Варезе приехали братья Гаэтано и Джованни Замберлетти с редкими
    семенами и саженцами из Петербурга и заложили исполинские платановые аллеи, которые теперь тянутся
    через парк на 1182 метра.


    Коллекция охватывает около восьмидесяти родов из Азии, Средиземноморья и обеих Америк: шесть видов
    магнолий, атласский и гималайский кедры, целый ряд дубов. Иные экзоты до сих пор капризничают. Пробковый
    дуб растёт, но не цветёт, а единственная бумажная шелковица — женское дерево, так что её плоды так
    и не вызревают.


    С 1970 года сад — филиал Центрального ботанического сада Академии наук, а к 2020 году большая реконструкция
    обновила его аллеи и озеро. Дворец, где хранится посмертная маска Наполеона, — в двух минутах ходьбы.


    Приезжайте в апреле, когда цветут магнолии, или в ноябре, когда платаны мостят аллеи широкими жёлтыми
    листьями.
  tip: >-
    На прогулку хватит часа, а если начнёте разглядывать отдельные деревья — двух. Вход со стороны дворца,
    плата символическая (при последней проверке 2 ₾). Бо́льшая часть сада в глубокой тени, и в июле здесь
    заметно прохладнее, чем на улицах. Летом у озера собираются комары, так что захватите репеллент. После
    дождя дорожки раскисают, и закрытая обувь лучше сандалий. Совместите сад с музеем во дворце Дадиани
    по соседству. Кафе — на дворцовой площади, в паре минут ходьбы.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) мимо Гори и Кутаиси до Самтредиа, затем по той же S1 через
    Сенаки до Зугдиди: около 320 км и четыре часа сорок минут. Асфальт на всём пути и в хорошем состоянии.
    Сад находится в центре города, прямо за дворцом Дадиани, так что один адрес годится для обоих. Оставьте
    машину на улице у дворца: парковка бесплатная, хотя летом во второй половине дня мест не хватает.
    Заправка — в Сенаки или Зугдиди. Машины эконом-класса достаточно в любое время года.
fa:
  name: باغ گیاه‌شناسی زوگدیدی
  short: >-
    باغ سال ۱۸۴۰ شاهزادگان دادیانی پشت کاخشان در زوگدیدی: خیابان‌های چنار، ماگنولیا، سدر و دریاچه‌ای با
    جزیره که باغبانی از تریست طرح انداخت.
  body: >-
    **در ۱۸۵۶ اسکندر پاشا، که پادگانش از دست جنگجویان مگرل آرام نداشت، فرمان داد این باغ را ببرند و از
    ریشه برکنند؛ خیابان درختان ممرزی که امروز در آن قدم می‌زنید، از همان کنده‌ها دوباره رویید.**


    داستان باغ از ۱۸۴۰ آغاز می‌شود، وقتی داوید دادیانی، که تازه فرمانروای مگرلیا شده بود، جنگل گرداگرد
    کاخش را حصار کشید و باغبانانی را به خدمت دائمی گماشت. او چندی بعد باغ را به همسرش، اکاترینه چاوچاوادزه-دادیانی،
    دختر شاعر الکساندر چاوچاوادزه، سپرد. اکاترینه باغبانی از تریست به نام جوزف بابینی را آورد که جنگل
    را بر پایهٔ طرحی متقارن به شیوهٔ فرانسوی از نو شکل داد و دریاچه‌ای مصنوعی با جزیره‌ای در میانش کند؛
    دریاچه‌ای که هنوز بر جاست.


    سپس جنگ از راه رسید. در ۱۸۵۵ سپاه سی‌هزارنفری عمر پاشا بیش از شش ماه سامگرلو را در اشغال داشت، و سال
    بعد باغ نابود شد. اکاترینه، که از مرگ داوید در ۱۸۵۳ فرمانروایی امیرنشین را در دست داشت، پس از صلح
    بازسازی باغ را آغاز کرد، اما احیای واقعی از ۱۸۶۹ و پس از بازگشت او از فرانسه رخ داد. در ۱۸۹۶ برادران
    گائتانو و جووانی زامبرلتی از وارزه با بذرها و نهال‌های کمیاب از سن پترزبورگ آمدند و خیابان‌های چنارهای
    غول‌پیکر را کاشتند که امروز ۱,۱۸۲ متر در دل پارک امتداد دارند.


    مجموعهٔ گیاهان حدود هشتاد سرده از آسیا، مدیترانه و قارهٔ آمریکا را در بر می‌گیرد: شش گونه ماگنولیا،
    سدر اطلس و سدر هیمالیا، و انواعی از بلوط. برخی گیاهان بیگانه هنوز قهر کرده‌اند. بلوط چوب‌پنبه رشد
    می‌کند اما گل نمی‌دهد، و تنها درخت توت کاغذی ماده است، از این رو میوه‌اش هرگز نمی‌رسد.


    باغ از ۱۹۷۰ شعبه‌ای از باغ گیاه‌شناسی مرکزی آکادمی علوم است، و تا ۲۰۲۰ بازسازی بزرگی خیابان‌ها و دریاچه‌اش
    را نو کرده بود. کاخ، با نقاب مرگ ناپلئون، دو دقیقه پیاده‌روی فاصله دارد.


    در آوریل برای ماگنولیاها بیایید، یا در نوامبر که چنارها خیابان‌ها را با برگ‌های پهن و زرد فرش می‌کنند.
  tip: >-
    یک ساعت برای گشتی در باغ بس است، و اگر به تماشای تک‌تک درختان بنشینید دو ساعت. ورودی در سمت کاخ است
    و بلیت ناچیز است (در آخرین بررسی ۲ لاری). بخش بزرگی از باغ در سایهٔ انبوه است و در ژوئیه به‌وضوح خنک‌تر
    از خیابان‌های شهر. در تابستان پشه‌ها کنار دریاچه جمع می‌شوند، پس دافع حشرات بیاورید. پس از باران راه‌ها
    گِلی می‌شوند و کفش بسته از صندل بهتر است. باغ را با موزهٔ کاخ دادیانی در همسایگی‌اش یکجا ببینید. کافه‌ها
    در میدان کاخ‌اند، چند دقیقه آن‌سوتر.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید و از کنار گوری و کوتائیسی تا سامتردیا بروید، سپس روی
    همان S1 از سناکی تا زوگدیدی ادامه دهید: حدود ۳۲۰ کیلومتر و چهار ساعت و چهل دقیقه. همهٔ راه آسفالت
    و در وضعیت خوبی است. باغ در مرکز شهر و درست پشت کاخ دادیانی است، پس یک نشانی برای هر دو کافی است.
    خودرو را در خیابان کنار کاخ پارک کنید؛ رایگان است، هرچند بعدازظهرهای تابستان جای خالی کم است. سوخت
    در سناکی یا زوگدیدی. خودروی اقتصادی در هر فصلی کافی است.
he:
  name: הגן הבוטני של זוגדידי
  short: >-
    הגן של נסיכי דאדיאני משנת 1840, מאחורי ארמונם בזוגדידי: שדרות דולבים, מגנוליות, ארזים ואגם עם אי שתכנן
    גנן מטריאסטה.
  body: >-
    **ב-1856 ציווה איסקנדר פאשה, שחיל המצב שלו הוטרד בלי הרף בידי לוחמים מגרלים, לכרות את הגן הזה ולעקור
    אותו; שדרת הקרפינוס שבה אתם צועדים היום צמחה מחדש מן הגדמים.**


    סיפורו של הגן מתחיל ב-1840, כשדוד דאדיאני, שזה עתה החל לשלוט במגרליה, גידר את היער שסביב ארמונו והעסיק
    גננים דרך קבע. זמן קצר אחר כך מסר את הגן לאשתו, אקטרינה צ׳בצ׳בדזה-דאדיאני, בתו של המשורר אלכסנדר צ׳בצ׳בדזה.
    היא הביאה את ג׳וזף באביני, גנן מטריאסטה, שעיצב מחדש את היער לפי תוכנית צרפתית סימטרית וחפר אגם מלאכותי
    ובו אי, שקיים עד היום.


    ואז הגיעה המלחמה. ב-1855 כבש צבאו של עומר פאשה, 30,000 חיילים, את סמגרלו ליותר מחצי שנה, ובשנה שלאחר
    מכן הושמד הגן. אקטרינה, ששלטה בנסיכות מאז מות דוד ב-1853, החלה לשקם אותו אחרי השלום, אבל ההתחדשות
    האמיתית באה מ-1869, עם שובה מצרפת. ב-1896 הגיעו האחים גאיטנו וג׳ובאני זמברלטי מוורזה, עם זרעים ושתילים
    נדירים מסנקט פטרבורג, ונטעו את שדרות הדולבים הענקיים העוברות היום בפארק לאורך 1,182 מטרים.


    האוסף משתרע על כשמונים סוגים מאסיה, מאגן הים התיכון ומן האמריקות: שישה מינים של מגנוליה, ארז האטלס
    וארז ההימלאיה, ומגוון אלונים. כמה מן הצמחים הזרים עדיין מתקשים להסתגל. אלון השעם גדל אבל אינו פורח,
    ועץ תות הנייר היחיד הוא נקבה, ולכן פירותיו אינם מבשילים לעולם.


    מאז 1970 הגן הוא שלוחה של הגן הבוטני המרכזי של האקדמיה למדעים, ועד 2020 חידש שיקום נרחב את שדרותיו
    ואת האגם. הארמון, ובו מסכת המוות של נפוליאון, נמצא במרחק שתי דקות הליכה.


    בואו באפריל בשביל המגנוליות, או בנובמבר, כשהדולבים מרצפים את השדרות בעלים צהובים ורחבים.
  tip: >-
    שעה מספיקה לסיבוב, שעתיים אם מתחילים להתעכב על עצים בודדים. הכניסה מצד הארמון, והתשלום סמלי (2 ₾ בבדיקה
    האחרונה). רוב הגן שרוי בצל עמוק, ובחודש יולי הוא קריר בהרבה מן הרחובות. בקיץ מתקבצים יתושים ליד האגם,
    לכן הביאו תכשיר דוחה. אחרי גשם השבילים מתרככים, ונעליים סגורות עדיפות על סנדלים. שלבו את הגן עם מוזיאון
    ארמון דאדיאני הסמוך. בתי קפה יש בכיכר הארמון, במרחק דקות ספורות.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי וקוטאיסי עד סמטרדיה, והמשיכו ב-S1 דרך סנאקי עד זוגדידי:
    כ-320 ק״מ וארבע שעות וארבעים דקות. הדרך סלולה לכל אורכה ובמצב טוב. הגן נמצא במרכז העיר, ממש מאחורי
    ארמון דאדיאני, כך שכתובת אחת משרתת את שניהם. החנו ברחוב ליד הארמון; החניה חינמית, אם כי בשעות אחר
    הצהריים בקיץ קשה למצוא מקום. תדלוק בסנאקי או בזוגדידי. רכב חסכוני מספיק בכל עונה.
ar:
  name: حديقة زوغديدي النباتية
  short: >-
    حديقة أمراء آل دادياني منذ 1840 خلف قصرهم في زوغديدي: ممرات الدُّلب، والمغنوليا، والأرز، وبحيرة ذات
    جزيرة صمّمها بستاني من ترييستي.
  body: >-
    **في عام 1856 أمر إسكندر باشا، وقد أنهك المقاتلون الميغريليون حاميته، بقطع هذه الحديقة واقتلاعها من
    جذورها؛ وممرّ أشجار النِّير (الكاربينوس) الذي تسير فيه اليوم نبت من جديد من جذوعها المقطوعة.**


    تبدأ الحكاية عام 1840، حين أحاط دافيد دادياني، وقد صار لتوّه حاكماً لميغريليا، الغابة المحيطة بقصره
    بسياج، وعيّن لها بستانيين دائمين. وسرعان ما سلّم الحديقة إلى زوجته إيكاتيريني تشافتشافادزه-دادياني،
    ابنة الشاعر ألكسندر تشافتشافادزه. فاستقدمت جوزيف بابيني، البستاني القادم من ترييستي، فأعاد تشكيل الغابة
    وفق مخطط فرنسي متناظر، وحفر بحيرة اصطناعية تتوسطها جزيرة ما زالت قائمة إلى اليوم.


    ثم جاءت الحرب. ففي 1855 احتلّ جيش عمر باشا البالغ ثلاثين ألف جندي سامغريلو أكثر من نصف عام، وفي العام
    التالي دُمّرت الحديقة. وبدأت إيكاتيريني، التي تولّت حكم الإمارة منذ وفاة دافيد عام 1853، ترميمها بعد
    السلام، لكن النهضة الحقيقية جاءت منذ 1869، بعد عودتها من فرنسا. وفي 1896 وصل الأخوان غايتانو وجوفاني
    زامبرليتي من فاريزي ومعهما بذور وشتلات نادرة من سانت بطرسبرغ، فغرسا ممرّات الدُّلب العملاقة التي تمتدّ
    اليوم عبر الحديقة مسافة 1182 متراً.


    تضمّ المجموعة نحو ثمانين جنساً نباتياً من آسيا وحوض المتوسط والأمريكتين: ستة أنواع من المغنوليا، وأرز
    الأطلس وأرز الهيمالايا، وطائفة من أشجار البلوط. وبعض النباتات الغريبة ما زال عصيّاً على التأقلم: فالبلوط
    الفليني ينمو لكنه لا يزهر، وشجرة توت الورق الوحيدة أنثى، فلا تنضج ثمارها أبداً.


    ومنذ 1970 صارت الحديقة فرعاً للحديقة النباتية المركزية التابعة لأكاديمية العلوم، وبحلول 2020 كانت
    عملية تأهيل كبرى قد جدّدت ممرّاتها وبحيرتها. أما القصر، وفيه قناع الموت لنابليون، فعلى بعد دقيقتين
    سيراً.


    تعالَ في أبريل حين تزهر المغنوليا، أو في نوفمبر حين تفرش أشجار الدُّلب الممرّات بأوراقها الصفراء العريضة.
  tip: >-
    تكفي ساعة للتجوّل، وساعتان إن بدأت تتأمّل الأشجار واحدة واحدة. المدخل من جهة القصر، والرسم رمزي (2
    ₾ عند آخر تحقّق). معظم الحديقة في ظل كثيف، وهي في يوليو أبرد من الشوارع بشكل ملحوظ. في الصيف يتجمّع
    البعوض قرب البحيرة، فاحمل طارداً للحشرات. تلين الممرات بعد المطر، فالأحذية المغلقة أفضل من الصنادل.
    اجمع الحديقة مع متحف قصر دادياني المجاور. المقاهي في ساحة القصر، على بعد دقيقتين.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بغوري وكوتايسي حتى سامتريديا، ثم تابع على S1 عبر سيناكي
    إلى زوغديدي: نحو 320 كم وأربع ساعات وأربعون دقيقة. الطريق معبّد كله وفي حالة جيدة. تقع الحديقة في
    وسط المدينة خلف قصر دادياني مباشرة، فعنوان واحد يكفي للاثنين. اركن السيارة في الشارع قرب القصر؛ الموقف
    مجاني، وإن كانت الأماكن تشحّ بعد ظهر أيام الصيف. الوقود في سيناكي أو زوغديدي. تكفي سيارة اقتصادية
    في أي فصل.
