ka:
  name: ქვიშხეთის კურორტი
  short: >-
    მშვიდი საკურორტო სოფელი ბორჯომის გზის ზემოთ: 1609 წლის ბრძოლის ლეგენდა და დიმიტრი ყიფიანის სახლ-მუზეუმი,
    ქართველ მწერალთა ძველი თავშესაფარი.
  body: >-
    **1609 წელს, გადმოცემით, სოფლის მღვდელმა დამპყრობელთა ლაშქარი შეგნებულად ააცდინა გზას — ბრძოლა, რომელიც
    ამას მოჰყვა, ქვიშხეთის სახელს ატარებს.**


    ქვიშხეთი ლიხის ქედის აღმოსავლეთ კალთაზე, ზღვის დონიდან 730 მეტრზე, ხაშურიდან 10 კილომეტრში, ბორჯომის
    გზის ზემოთ მდებარეობს. 1609 წელს ქართლს ოსმალები და ყირიმელი თათრები შემოესივნენ. გადმოცემის თანახმად,
    რომელიც კალისტრატე სალიამ „ქართველი ერის ისტორიაში“ ჩაიწერა, მათ სოფელ ქველთის მღვდელი თევდორე შეიპყრეს
    და ლუარსაბ II-ის სასახლისკენ გზის ჩვენება უბრძანეს. თევდორემ მტერი გზას ააცდინა, ამას სიცოცხლე შესწირა
    და მეფეს ლაშქრის შესაკრებად დრო მოუპოვა. დამპყრობლები ქვიშხეთის ბრძოლაში დამარცხდნენ, სადაც თავი გამოიჩინა
    გიორგი სააკაძემ.


    მოგვიანებით ქვიშხეთი აბაშიძეთა მამულის ცენტრი იყო და 1744 წელს აქ ერეკლე II აბაშიძის ასულზე დაქორწინდა.
    XIX საუკუნის 60-იან წლებში დიმიტრი ყიფიანმა — სახელმწიფო მოღვაწემ, პუბლიცისტმა და ლიბერალური თავადაზნაურობის
    ერთ-ერთმა ლიდერმა — აქ სახლი ააშენა. რუსიფიკაციის მძიმე წლებში ეს სახლი ქართველი მწერლების საზაფხულო
    თავშესაფრად იქცა; სტუმრებს შორის ილია ჭავჭავაძესა და ვაჟა-ფშაველას ასახელებენ. 1886 წელს ყიფიანმა
    რუს ეგზარქოსს, რომელმაც ქართველი ერი შეაჩვენა, მისწერა, რომ შეურაცხმყოფელმა შეურაცხყოფილი ქვეყანა
    დაუყოვნებლივ უნდა დატოვოს. იმავე წელს სტავროპოლში გადაასახლეს, სადაც 1887 წელს ბოლომდე გაურკვეველ
    ვითარებაში მოკლეს. XX საუკუნეში სახლი მწერალთა დასასვენებელი სახლი გახდა, 2007 წლიდან კი, ახლანდელი
    სახით, დიმიტრი ყიფიანის სახლ-მუზეუმია, სადაც მასთან დაკავშირებული 900-მდე ექსპონატი, დოკუმენტი და
    ფოტო ინახება.


    სახელი, ხალხური გადმოცემით, ქვიშისგან მოდის: გაზაფხულზე ადიდებულ მდინარე შოლას სოფელში ქვიშა და ხეები
    ჩამოჰქონდა.


    ჰაერისთვის ჩამოდით, როგორც ყიფიანის სტუმრები ჩამოდიოდნენ, მაგრამ ნურავის მისცემთ უფლებას, სახლს აგაცდინოთ.
  tip: >-
    სოფელში სეირნობა უფასოა. დიმიტრი ყიფიანის სახლ-მუზეუმი ხაშურის მხარეთმცოდნეობის მუზეუმის ფილიალია;
    სამუშაო საათები წინასწარ გადაამოწმეთ, რადგან პატარა მუზეუმები ხშირად მოკლე ან არარეგულარული განრიგით
    მუშაობს. სპა- და გამაჯანსაღებელ პროცედურებს პატარა საკურორტო სასტუმროები, მაგალითად „მწერლები რეზორტი“,
    სთავაზობს — დაჯავშნა და გადახდა უშუალოდ მათთან ხდება. სადილისა და საწვავისთვის ხაშური და ბორჯომი ახლოსაა.
    დაახლოებით 730 მეტრზე მდებარე სოფელი მთელი წლის განმავლობაში ხელმისაწვდომია. საათნახევარი დაუთმეთ;
    ხაშურიდან მცირე გადახვევით სურამის ციხესაც ნახავთ, ან ბორჯომისკენ გააგრძელეთ.
  route: >-
    138 კმ, დაახლოებით 2 საათი, მთელ გზაზე ასფალტია. თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, მცხეთის,
    გორისა და ქარელის გავლით, ხაშურამდე იარეთ — მაგისტრალზე დაახლოებით 128 კილომეტრი. ხაშურში ს8 გზაზე,
    ბორჯომისა და ახალციხის მიმართულებით, გადაუხვიეთ; ქვიშხეთი ქალაქიდან დაახლოებით 10 კილომეტრშია, ბორჯომის
    გზის ზემოთ. ეკონომ-კლასის ნებისმიერი მანქანა ნებისმიერ სეზონზე გამოდგება. ავზი ხაშურში აავსეთ. ბორჯომი
    იმავე გზაზე ცოტა მოშორებითაა, ასე რომ, ქვიშხეთში გზად შეჩერება ადვილია.
en:
  name: Kvishkheti Resort
  short: >-
    A quiet resort village above the Borjomi road, with a legendary battle of 1609 and the house-museum
    of Dimitri Kipiani, once a refuge for Georgia's writers.
  body: >-
    **In 1609, the story goes, a village priest led an invading army the wrong way on purpose, and the
    battle that followed bears Kvishkheti's name.**


    Kvishkheti lies at 730 metres on the eastern slope of the Likhi range, 10 km from Khashuri and above
    the road to Borjomi. In 1609 Ottoman and Crimean Tatar forces invaded Kartli. Tradition, recorded
    in Kalistrat Salia's History of the Georgian Nation, says they seized Tevdore, priest of nearby Kvelta,
    and ordered him to lead them to King Luarsab II. He led them astray, paid with his life and bought
    the king time to muster his army. The invaders were routed at the Battle of Kvishkheti, where Giorgi
    Saakadze distinguished himself.


    Later the village was the seat of the Abashidze princes, and in 1744 Erekle II married an Abashidze
    bride here. In the 1860s Dimitri Kipiani, statesman, publicist and a leader of the liberal nobility,
    built a house in Kvishkheti that became a summer refuge for Georgian letters at the height of Russification;
    Ilia Chavchavadze and Vazha-Pshavela are named among its guests. In 1886 Kipiani wrote to the Russian
    exarch who had anathematised the Georgian nation that the insulter should leave the insulted country
    at once. He was exiled to Stavropol that year and killed there in 1887, in circumstances never fully
    explained. The house later became a writers' rest home and, since 2007, the Dimitri Kipiani House
    Museum, with some 900 objects, documents and photographs.


    The name, local tradition says, comes from sand, kvisha, carried down by the Shola stream in spring
    floods.


    Come for the air, as Kipiani's guests did, but don't let anyone lead you past the house.
  tip: >-
    The village is free to wander. The Dimitri Kipiani House Museum is a branch of the Khashuri local
    history museum; check its opening hours before you go, as small Georgian museums often keep short
    or irregular days. Spa and wellness treatments are offered by small resort hotels such as Mtserlebi
    Resort; book and pay directly. For a proper meal or fuel, Khashuri and Borjomi are both close. At
    about 730 metres the village is reachable all year. Allow an hour and a half, with Surami Fortress
    a short detour from Khashuri, or Borjomi beyond.
  route: >-
    138 km, about 2 hours, asphalt all the way. Leave Tbilisi on the S1 (E60) west past Mtskheta, Gori
    and Kareli to Khashuri, about 128 km of motorway. In Khashuri turn onto the S8 towards Borjomi and
    Akhaltsikhe; Kvishkheti is about 10 km beyond the town, above the Borjomi road. Any economy car is
    fine in every season. Fill up in Khashuri. Borjomi lies a little further along the same road, which
    makes Kvishkheti an easy stop on the way there.
ru:
  name: Курорт Квишхети
  short: >-
    Тихое курортное село над боржомской дорогой: легендарная битва 1609 года и дом-музей Дмитрия Кипиани,
    некогда убежище грузинских писателей.
  body: >-
    **В 1609 году, гласит предание, сельский священник нарочно повёл вражеское войско не той дорогой,
    и битва, которая за этим последовала, носит имя Квишхети.**


    Квишхети лежит на высоте 730 метров на восточном склоне Лихского хребта, в 10 км от Хашури, над дорогой
    на Боржоми. В 1609 году османские и крымско-татарские войска вторглись в Картли. Предание, записанное
    в «Истории грузинской нации» Калистрата Салиа, рассказывает, что захватчики схватили Тевдоре, священника
    из соседней Квелты, и приказали ему вести их к царю Луарсабу II. Он завёл их в сторону, поплатился
    жизнью и выиграл для царя время, чтобы собрать войско. Захватчики были разбиты в битве при Квишхети,
    где отличился Георгий Саакадзе.


    Позднее село стало резиденцией князей Абашидзе, и в 1744 году Ираклий II обвенчался здесь с невестой
    из рода Абашидзе. В 1860-х годах Дмитрий Кипиани — государственный деятель, публицист и один из лидеров
    либерального дворянства — построил в Квишхети дом, ставший летним прибежищем грузинской словесности
    в самый разгар русификации; среди его гостей называют Илью Чавчавадзе и Важа-Пшавела. В 1886 году
    Кипиани написал русскому экзарху, предавшему анафеме грузинский народ, что оскорбитель должен немедленно
    покинуть оскорблённую страну. В том же году его сослали в Ставрополь, где в 1887 году он был убит
    при обстоятельствах, так до конца и не выясненных. Позже здесь устроили дом творчества писателей,
    а с 2007 года это Дом-музей Дмитрия Кипиани, где хранится около 900 предметов, документов и фотографий.


    Название, по местному преданию, происходит от песка — «квиша», который весенние паводки приносят по
    ручью Шола.


    Приезжайте за воздухом, как гости Кипиани, — но не позволяйте никому провести вас мимо его дома.
  tip: >-
    По селу можно гулять свободно. Дом-музей Дмитрия Кипиани — филиал Хашурского краеведческого музея;
    уточните часы работы заранее: небольшие грузинские музеи часто открыты недолго или нерегулярно. Спа-
    и оздоровительные процедуры предлагают небольшие курортные отели, например «Мцерлеби Резорт»; бронируйте
    и платите напрямую. Чтобы как следует поесть или заправиться, есть Хашури и Боржоми — оба рядом. На
    высоте около 730 метров село доступно круглый год. Заложите полтора часа, а от Хашури можно ненадолго
    свернуть к Сурамской крепости или поехать дальше, в Боржоми.
  route: >-
    138 км, около 2 часов, всё время по асфальту. Выезжайте из Тбилиси на запад по S1 (E60) мимо Мцхеты,
    Гори и Карели до Хашури — около 128 км по магистрали. В Хашури сверните на S8 в сторону Боржоми и
    Ахалцихе; Квишхети примерно в 10 км за городом, над боржомской дорогой. Любая машина эконом-класса
    справится в любое время года. Заправьтесь в Хашури. Боржоми лежит чуть дальше по той же дороге, так
    что Квишхети — удобная остановка по пути туда.
fa:
  name: استراحتگاه کویشختی
  short: >-
    روستای آرام استراحتگاهی بالای جادهٔ بورجومی، با نبردی افسانه‌ای در ۱۶۰۹ و خانه‌موزهٔ دیمیتری کیپیانی
    که روزگاری پناهگاه نویسندگان گرجستان بود.
  body: >-
    **روایت است که در ۱۶۰۹ کشیش روستایی سپاه مهاجم را عمداً به بیراهه برد، و نبردی که در پی آمد نام کویشختی
    را بر خود دارد.**


    کویشختی در ارتفاع ۷۳۰ متری بر دامنهٔ شرقی رشته‌کوه لیخی، در ۱۰ کیلومتری خاشوری و بالای جادهٔ بورجومی
    قرار دارد. در ۱۶۰۹ نیروهای عثمانی و تاتارهای کریمه به کارتلی یورش آوردند. روایتی که در «تاریخ ملت
    گرجی» نوشتهٔ کالیسترات سالیا ثبت شده، می‌گوید آنان تودوره، کشیش روستای نزدیکِ کوئلتا، را گرفتند و
    به او فرمان دادند آنان را نزد لوارساب دوم ببرد. او گمراهشان کرد، جانش را بر سر این کار گذاشت و به
    شاه فرصت داد تا سپاهش را گرد آورد. مهاجمان در نبرد کویشختی درهم شکستند، نبردی که گیورگی ساآکادزه در
    آن درخشید.


    بعدها روستا مقر شاهزادگان آباشیدزه شد و در ۱۷۴۴ ارکلی دوم در اینجا با عروسی از خاندان آباشیدزه پیمان
    زناشویی بست. در دههٔ ۱۸۶۰ دیمیتری کیپیانی، دولتمرد، روزنامه‌نگار و از رهبران اشرافیت لیبرال، خانه‌ای
    در کویشختی ساخت که در اوج روسی‌سازی به پناهگاه تابستانی ادبیات گرجی بدل شد؛ از ایلیا چاوچاوادزه و
    واژا-پشاولا به‌عنوان مهمانان آن نام برده می‌شود. در ۱۸۸۶ کیپیانی به اگزارخ روس، که ملت گرجی را لعن
    و تکفیر کرده بود، نوشت که توهین‌کننده باید بی‌درنگ سرزمینی را که به آن توهین کرده ترک کند. او همان
    سال به استاوروپول تبعید شد و در ۱۸۸۷ در همان‌جا، در شرایطی که هرگز به‌طور کامل روشن نشد، کشته شد.
    این خانه بعدها آسایشگاه نویسندگان شد و از ۲۰۰۷ خانه‌موزهٔ دیمیتری کیپیانی است، با حدود ۹۰۰ شیء، سند
    و عکس.


    به روایت محلی، نام روستا از ماسه، «کویشا»، می‌آید که نهر شولا در سیلاب‌های بهاری با خود می‌آورد.


    برای هوای پاکش بیایید، همان‌گونه که مهمانان کیپیانی می‌آمدند، اما نگذارید کسی شما را از کنار آن خانه
    به راه دیگری ببرد.
  tip: >-
    گشت‌وگذار در روستا رایگان است. خانه‌موزهٔ دیمیتری کیپیانی شعبه‌ای از موزهٔ محلی خاشوری است؛ پیش از
    رفتن ساعات کارش را جویا شوید، چون موزه‌های کوچک گرجستان اغلب ساعات کوتاه یا نامنظمی دارند. خدمات آبگرم
    و تندرستی را هتل‌های کوچک استراحتگاهی مانند «متسرلبی ریزورت» ارائه می‌دهند؛ مستقیماً رزرو و پرداخت
    کنید. برای یک وعدهٔ غذای درست‌وحسابی یا سوخت، خاشوری و بورجومی هر دو نزدیک‌اند. روستا در ارتفاع حدود
    ۷۳۰ متری است و در تمام سال می‌توان به آن رسید. یک ساعت و نیم وقت بگذارید و قلعهٔ سورامی را با انحرافی
    کوتاه از خاشوری، یا بورجومی را کمی آن‌سوتر، هم ببینید.
  route: >-
    ۱۳۸ کیلومتر، حدود ۲ ساعت، تمام راه آسفالت. از تفلیس جادهٔ S1 (E60) را به سمت غرب، از کنار متسختا،
    گوری و کارلی تا خاشوری بروید، حدود ۱۲۸ کیلومتر بزرگراه. در خاشوری به جادهٔ S8 به سوی بورجومی و آخالتسیخه
    بپیچید؛ کویشختی حدود ۱۰ کیلومتر آن سوی شهر و بالای جادهٔ بورجومی است. هر خودروی اقتصادی در هر فصلی
    از پسش برمی‌آید. در خاشوری سوخت‌گیری کنید. بورجومی کمی جلوتر بر همین جاده است، از این رو کویشختی توقفی
    آسان در راه آنجاست.
he:
  name: אתר הנופש קווישחטי
  short: >-
    כפר נופש שקט מעל הדרך לבורג'ומי, עם קרב אגדי משנת 1609 ובית-המוזיאון של דימיטרי קיפיאני, שהיה פעם
    מקלט לסופרי גאורגיה.
  body: >-
    **ב-1609, כך מספרים, הוביל כומר כפרי צבא פולש בכוונה בדרך הלא נכונה, והקרב שבא בעקבות זאת נושא את
    שמה של קווישחטי.**


    קווישחטי שוכנת בגובה 730 מטרים על המדרון המזרחי של רכס ליחי, 10 ק"מ מחשורי, מעל הדרך לבורג'ומי. ב-1609
    פלשו כוחות עות'מאניים וטטרים מחצי האי קרים לקרתלי. המסורת, שתועדה ב"תולדות האומה הגאורגית" של קליסטרט
    סאליה, מספרת שהם תפסו את טבדורה, הכומר מן הכפר הסמוך קבלטה, וציוו עליו להוביל אותם אל המלך לוארסאב
    השני. הוא הוליך אותם שולל, שילם על כך בחייו, וקנה למלך זמן לגייס את צבאו. הפולשים הובסו בקרב קווישחטי,
    שבו הצטיין גיאורגי סאאקדזה.


    מאוחר יותר היה הכפר מושבם של נסיכי אבשידזה, וב-1744 נשא כאן ארקלה השני לאישה כלה מבית אבשידזה. בשנות
    ה-60 של המאה ה-19 בנה דימיטרי קיפיאני, מדינאי, פובליציסט ואחד ממנהיגי האצולה הליברלית, בית בקווישחטי,
    שהפך למפלט קיץ של הספרות הגאורגית בשיא הרוסיפיקציה; בין אורחיו נמנים איליה צ'בצ'בדזה וּואז'ה-פשאבלה.
    ב-1886 כתב קיפיאני לאקסרך הרוסי, שהטיל חרם כנסייתי (אנתמה) על האומה הגאורגית, כי על המעליב לעזוב מיד
    את הארץ שהעליב. באותה שנה הוגלה לסטברופול, ושם נרצח ב-1887, בנסיבות שמעולם לא התבררו עד הסוף. מאוחר
    יותר הפך הבית לבית הבראה לסופרים, ומאז 2007 הוא בית-המוזיאון של דימיטרי קיפיאני, ובו כ-900 חפצים,
    מסמכים ותצלומים.


    השם, לפי מסורת מקומית, בא מן החול, "קווישה", שנחל שולה סוחף במורד בשיטפונות האביב.


    בואו בשביל האוויר, כמו אורחיו של קיפיאני, אבל אל תתנו לאיש להוביל אתכם על פני הבית בלי לעצור.
  tip: >-
    אפשר לשוטט בכפר בחופשיות. בית-המוזיאון של דימיטרי קיפיאני הוא שלוחה של המוזיאון לתולדות האזור בחשורי;
    בדקו את שעות הפתיחה לפני שאתם יוצאים, כי מוזיאונים קטנים בגאורגיה פתוחים לעיתים קרובות שעות מעטות
    או לא סדירות. טיפולי ספא ובריאות מציעים מלונות נופש קטנים כמו "מצרלבי ריזורט"; הזמינו ושלמו ישירות.
    לארוחה של ממש או לדלק, חשורי ובורג'ומי שתיהן קרובות. בגובה של כ-730 מטרים הכפר נגיש כל השנה. הקדישו
    שעה וחצי, ושלבו את מבצר סוראמי, סטייה קצרה מחשורי, או את בורג'ומי, מעט הלאה.
  route: >-
    138 ק"מ, כשעתיים, כולם על אספלט. צאו מטביליסי מערבה בכביש S1 (E60), על פני מצחתה, גורי וקארלי, עד
    חשורי, כ-128 ק"מ של כביש מהיר. בחשורי פנו לכביש S8 לכיוון בורג'ומי ואחלציחה; קווישחטי נמצאת כ-10 ק"מ
    אחרי העיר, מעל הדרך לבורג'ומי. כל רכב מקטגוריית אקונומי יסתדר בכל עונה. תדלקו בחשורי. בורג'ומי נמצאת
    מעט הלאה באותה דרך, כך שקווישחטי היא עצירה נוחה בדרך לשם.
ar:
  name: منتجع كفيشخيتي
  short: >-
    قرية منتجع هادئة فوق طريق بورجومي، فيها معركة أسطورية من عام 1609 وبيت-متحف ديميتري كيبياني، الذي
    كان يومًا ملاذًا لكتّاب جورجيا.
  body: >-
    **في عام 1609، كما تقول الرواية، قاد كاهن قرية جيشًا غازيًا في الطريق الخطأ عن عمد، والمعركة التي
    تلت ذلك تحمل اسم كفيشخيتي.**


    تقع كفيشخيتي على ارتفاع 730 مترًا على السفح الشرقي لسلسلة جبال ليخي، على بُعد 10 كم من خاشوري، فوق
    الطريق المؤدي إلى بورجومي. في عام 1609 اجتاحت قوات عثمانية وتتارية قرمية مملكة كارتلي. ويروي التراث،
    كما دوّنه كاليسترات ساليا في «تاريخ الأمة الجورجية»، أنهم أسروا تيفدوري، كاهن قرية كفيلتا المجاورة،
    وأمروه بأن يقودهم إلى الملك لوارساب الثاني. فأضلّهم الطريق، ودفع حياته ثمنًا لذلك، وكسب للملك وقتًا
    ليحشد جيشه. ودُحر الغزاة في معركة كفيشخيتي التي تميّز فيها غيورغي ساآكادزه.


    وفي ما بعد صارت القرية مقرًّا لأمراء آل أباشيدزه، وفي عام 1744 تزوّج إريكلي الثاني هنا عروسًا من آل
    أباشيدزه. وفي ستينيات القرن التاسع عشر بنى ديميتري كيبياني، رجل الدولة والكاتب الصحفي وأحد قادة النبلاء
    الليبراليين، بيتًا في كفيشخيتي صار ملاذًا صيفيًّا للأدب الجورجي في ذروة سياسة الترويس؛ ويُذكر من بين
    ضيوفه إيليا تشافتشافادزه وفاجا-بشافيلا. وفي عام 1886 كتب كيبياني إلى الإكسرخس الروسي الذي أنزل الحرم
    الكنسي بالأمة الجورجية أن على المُهين أن يغادر البلد الذي أهانه فورًا. ونُفي في العام نفسه إلى ستافروبول،
    وقُتل هناك عام 1887 في ظروف لم تتضح كليًّا قط. ثم صار البيت دار استراحة للكتّاب، ومنذ عام 2007 أصبح
    بيت-متحف ديميتري كيبياني، وفيه نحو 900 قطعة ووثيقة وصورة.


    ويقول التراث المحلي إن الاسم مشتق من الرمل، «كفيشا»، الذي يجرفه جدول شولا في فيضانات الربيع.


    تعالَ من أجل الهواء، كما فعل ضيوف كيبياني، لكن لا تدع أحدًا يمضي بك متجاوزًا البيت.
  tip: >-
    التجوّل في القرية مجاني. بيت-متحف ديميتري كيبياني فرع من متحف خاشوري للتاريخ المحلي؛ تحقّق من مواعيد
    فتحه قبل الذهاب، فالمتاحف الجورجية الصغيرة كثيرًا ما تفتح لساعات قليلة أو غير منتظمة. وتقدّم فنادق
    المنتجعات الصغيرة، مثل «متسيرليبي ريزورت»، علاجات السبا والعافية؛ احجز وادفع مباشرة. ولوجبة حقيقية
    أو للوقود، فخاشوري وبورجومي قريبتان كلتاهما. وعلى ارتفاع نحو 730 مترًا يمكن بلوغ القرية طوال العام.
    خصّص ساعة ونصفًا؛ ويمكنك أن تضيف قلعة سورامي بانعطافة قصيرة من خاشوري، أو أن تكمل إلى بورجومي.
  route: >-
    138 كم، نحو ساعتين، وكله إسفلت. غادر تبليسي غربًا على الطريق S1 (E60) متجاوزًا متسخيتا وغوري وكاريلي
    حتى خاشوري، أي نحو 128 كم على الطريق السريع. وفي خاشوري انعطف إلى الطريق S8 باتجاه بورجومي وأخالتسيخي؛
    تقع كفيشخيتي على بُعد نحو 10 كم بعد المدينة، فوق طريق بورجومي. تكفي أي سيارة اقتصادية في كل الفصول.
    تزوّد بالوقود في خاشوري. وتقع بورجومي أبعد قليلًا على الطريق نفسه، مما يجعل كفيشخيتي محطة سهلة في
    الطريق إليها.
