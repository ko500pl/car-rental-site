ka:
  name: იუსტიციის სახლი
  short: >-
    თერთმეტი თეთრი „ფურცელი“ ფოლადის ხეებზე მტკვრის პირას: ფუქსასების შენობა, სადაც პასპორტის აღებას არქიტექტურაც
    მოჰყვება.
  body: >-
    **თბილისმა გადაწყვიტა, რომ პასპორტის განახლება ქალაქის ყველაზე თამამი სახურავის ქვეშ უნდა ხდებოდეს:
    თერთმეტი თეთრი ფურცლის ქვეშ, რომლებიც ფოლადის ხეებზე მტკვრის თავზე აზიდულა.**


    სოლოლაკის ძირას, სანაპიროზე მდგარი შენობა მასიმილიანო და დორიანა ფუქსასებმა დააპროექტეს; ის 2010–2012
    წლებში აშენდა და 2012 წლის 21 სექტემბერს გაიხსნა. სახურავის ქვეშ კი ყველაფერი ცივი გონებითაა გათვლილი:
    შვიდი საოფისე კორპუსი, თითოეული ოთხსართულიანი და სხვადასხვა დონეზე განლაგებული, ცენტრალურ „საჯარო
    მოედანს“ გარს ერტყმის, სადაც მომსახურების დარბაზია; კორპუსებს ერთმანეთთან შიდა ხიდები აკავშირებს.
    ამ ყველაფრის ზემოთ თერთმეტი უზარმაზარი ფურცელი ჰაერში ეკიდება — ზოგი თითქმის 35 მეტრს აღწევს, — ხისებრ
    ფოლადის სვეტებზე დაყრდნობილი, რომლებიც შენობის გარეთაც ჩანს და შიგნითაც. სამი მათგანი ცენტრალურ დარბაზს
    ფარავს.


    ყველაზე ჭკვიანური დეტალი თვალით არ ჩანს. ფურცლებს შორის ჩასმული მინის კედლები მათზე მიმაგრებული არ
    არის — თავისუფლად დგას, ამიტომ, როცა თოვლის სიმძიმე, ქარი თუ ტემპერატურის ცვლა სახურავს შეარხევს,
    მინა არ იბზარება.


    შიგნით კი ჩვეულებრივი ცხოვრება მიედინება. ეს საქართველოს იუსტიციის სახლია, სადაც ადამიანები დაბადებას,
    ქორწინებას, ქონებასა და ბიზნესს არეგისტრირებენ, პასპორტსა და პირადობის მოწმობას იღებენ. დარბაზი მომსახურების
    ხანგრძლივობის მიხედვით იყოფა — თვითმომსახურება, ორ წუთამდე და ხუთ წუთზე მეტი, — ელექტრონული რიგი კი
    სივრცეს სიმშვიდეს უნარჩუნებს. ამ მოდელმა 2012 წელს გაეროს საჯარო სამსახურის ჯილდო მოიპოვა, ინდონეზიამ
    კი ის საკუთარი „საჯარო მომსახურების მოლებისთვის“ ისესხა — პირველი 2017 წელს აღმოსავლეთ იავაზე, ბანიუვანგიში
    გაიხსნა.


    დიდ შენობებს, როგორც წესი, მეფეებისთვის, ღმერთებისთვის ან ფულისთვის აგებენ. ეს რიგისთვის აშენდა —
    და რიგს, ერთხელ მაინც, მაღლა ახედვის საშუალება მიეცა.
  tip: >-
    ეს მოქმედი სახელმწიფო დაწესებულებაა და არა მუზეუმი: დარბაზი სამუშაო დღეებში, სამსახურებრივ საათებში
    ღიაა და შესვლა უფასოა, მაგრამ აქ ისე მოიქეცით, როგორც ნებისმიერ საჯარო ოფისში — ხმადაბლა ილაპარაკეთ
    და ნუ გადაუღებთ თანამშრომლებსა და რიგში მდგომ ადამიანებს. სახურავის სრული ხედისთვის მტკვრის მოპირდაპირე
    ნაპირიდან ან მშრალი ხიდიდან შეხედეთ. ნახევარი საათი საკმარისია; გზა მშრალი ხიდის ბაზრობისკენ, ორბელიანის
    მოედნისკენ ან ანჩისხატისკენ განაგრძეთ — სამივე ფეხით ახლოსაა.
  route: >-
    მანქანით აქ მოსვლა თითქმის სიმბოლურია: თავისუფლების მოედნიდან დაახლოებით 1 კმ და ხუთი წუთი ქალაქის
    ასფალტიან ქუჩებზე. პუშკინის ქუჩით ჩადით ზვიად გამსახურდიას სანაპიროზე და გაჰყევით მას სანაპიროს ქუჩა
    №2-მდე, სოლოლაკის ძირას. ეკონომ კლასის ნებისმიერი მანქანა საკმარისია. სანაპიროზე მოძრაობა მჭიდროა,
    ქუჩაში გაჩერების ადგილი კი ცოტაა; კომპლექსი დიდი ავტოსადგომით დაპროექტდა, მაგრამ ფეხით მაინც უფრო
    მარტივია — თავისუფლების მოედნიდან ან ძველი ქალაქიდან მდინარის გასწვრივ 10–15 წუთი. საწვავზე ფიქრი
    არ გჭირდებათ — დედაქალაქის შუაგულში ხართ.
en:
  name: Public Service Hall (House of Justice)
  short: >-
    Eleven white 'petals' on steel trees beside the Mtkvari: the Fuksas building where renewing a passport
    comes with a piece of architecture.
  body: >-
    **Tbilisi decided that renewing a passport should happen under the boldest roof in the city: eleven
    white petals raised on steel trees above the Mtkvari.**


    The building on the embankment below Sololaki was designed by Massimiliano and Doriana Fuksas, built
    between 2010 and 2012 and inaugurated on 21 September 2012. Underneath, it is all reason. Seven office
    blocks, each of four storeys on staggered levels, gather around a central "public square" where the
    service desks are, linked to one another by internal footbridges. Above them float eleven great "leaves",
    some reaching almost 35 metres, carried on tree-shaped steel columns that you see both outside and
    in. Three of them roof the central hall.


    The cleverest part is the one you cannot see. The glass walls set between the petals are not fixed
    to them; they are left free, so that when snow, wind or a change in temperature makes the roof move,
    the glass does not crack.


    Inside, ordinary life gets done. This is Georgia's House of Justice, where people register births,
    marriages, property and businesses and collect passports and ID cards. The hall is divided by how
    long a service takes — self-service, under two minutes, over five — and an electronic queue keeps
    it calm. The model won a UN Public Service Award in 2012, and Indonesia borrowed it for its own "public
    service malls", the first opening in Banyuwangi, East Java, in 2017.


    Most great buildings are raised for kings, gods or money. This one was built for the queue — and the
    queue, for once, gets to look up.
  tip: >-
    This is a working government office, not a museum: the hall is open on weekdays during office hours
    and costs nothing to enter, but behave as you would in any public office — keep your voice down and
    do not photograph staff or people waiting at the desks. For the whole roof in one view, look from
    the opposite bank of the Mtkvari or from the Dry Bridge. Half an hour is plenty; carry on to the Dry
    Bridge market, Orbeliani Square or Anchiskhati Basilica, all a short walk away.
  route: >-
    It is barely a drive: about 1 km and five minutes from Freedom Square on paved city streets. Go down
    Pushkin Street to the Zviad Gamsakhurdia embankment and follow it to No. 2 Sanapiro Street, below
    Sololaki. Any economy car will do. Traffic on the embankment is heavy and kerbside parking scarce;
    the complex was designed with a large car park, but walking is simpler — 10–15 minutes from Freedom
    Square or the Old Town along the river. No fuel worries: you are in the middle of the capital.
ru:
  name: Зал публичных услуг (Дом юстиции)
  short: >-
    Одиннадцать белых «лепестков» на стальных деревьях у Куры: здание Фуксасов, где к замене паспорта
    прилагается архитектура.
  body: >-
    **Тбилиси решил, что менять паспорт следует под самой смелой крышей города: под одиннадцатью белыми
    лепестками, поднятыми на стальных деревьях над Курой.**


    Здание на набережной под Сололаки спроектировали Массимилиано и Дориана Фуксас; его строили с 2010
    по 2012 год и открыли 21 сентября 2012 года. Под этой кровлей всё рационально. Семь офисных блоков
    по четыре этажа, со смещёнными уровнями, собраны вокруг центральной «общественной площади», где стоят
    стойки обслуживания, и соединены между собой внутренними мостиками. Над ними парят одиннадцать огромных
    «листьев» — некоторые размером почти 35 метров, — которые несут древовидные стальные колонны, видимые
    и снаружи, и изнутри. Три из них накрывают центральный зал.


    Самое остроумное — то, чего не видно. Стеклянные стены между лепестками к ним не прикреплены: их оставили
    свободными, чтобы стекло не трескалось, когда снег, ветер или перепад температуры заставляют крышу
    двигаться.


    Внутри вершатся обычные житейские дела. Это грузинский Дом юстиции, где регистрируют рождения, браки,
    недвижимость и компании, получают паспорта и удостоверения личности. Зал разделён по длительности
    услуги — самообслуживание, до двух минут, больше пяти, — а электронная очередь поддерживает спокойствие.
    В 2012 году эта модель получила Премию ООН в области государственной службы, а Индонезия переняла
    её для своих «моллов государственных услуг»: первый открылся в 2017 году в Баньюванги на Восточной
    Яве.


    Большинство великих зданий возводили для царей, богов или денег. Это построено для очереди — и очереди,
    для разнообразия, есть на что поднять глаза.
  tip: >-
    Это действующее государственное учреждение, а не музей: зал открыт по будням в рабочие часы, вход
    бесплатный, но ведите себя как в любом госучреждении — говорите тихо и не фотографируйте сотрудников
    и людей, ожидающих у стоек. Чтобы увидеть всю крышу целиком, смотрите с противоположного берега Куры
    или с Сухого моста. Получаса вполне достаточно; потом можно дойти до рынка у Сухого моста, площади
    Орбелиани или базилики Анчисхати — всё в нескольких минутах ходьбы.
  route: >-
    Ехать почти не придётся: около 1 км и пять минут от площади Свободы по городским улицам. Спуститесь
    по улице Пушкина к набережной Звиада Гамсахурдиа и следуйте по ней до улицы Санапиро, 2, под Сололаки.
    Подойдёт любая машина эконом-класса. Движение на набережной плотное, мест у тротуара мало; при комплексе
    предусмотрена большая парковка, но пешком проще — 10–15 минут вдоль реки от площади Свободы или Старого
    города. О топливе не беспокойтесь: вы в центре столицы.
fa:
  name: تالار خدمات عمومی (خانهٔ عدالت)
  short: >-
    یازده «گلبرگ» سفید بر درختانی فولادی کنار رود کورا: بنای فوکساس، جایی که تمدید گذرنامه با تماشای معماری
    همراه است.
  body: >-
    **تفلیس تصمیم گرفت تمدید گذرنامه زیر جسورانه‌ترین سقف شهر انجام شود: یازده گلبرگ سفید که بر درختانی
    فولادی بالای رود کورا افراشته شده‌اند.**


    این بنا را، بر کرانهٔ رود و پایین محلهٔ سولولاکی، ماسیمیلیانو و دوریانا فوکساس طراحی کردند؛ ساختش
    از ۲۰۱۰ تا ۲۰۱۲ طول کشید و در ۲۱ سپتامبر ۲۰۱۲ گشایش یافت. زیر این سقف، همه‌چیز منطق است. هفت بلوک
    اداری، هر یک چهار طبقه در ترازهای پلکانی، گرد یک «میدان عمومی» مرکزی جمع شده‌اند که باجه‌های خدمات
    در آن است، و با پل‌هایی درونی به هم پیوسته‌اند. بر فراز آن‌ها یازده «برگ» بزرگ شناورند، برخی با اندازه‌ای
    نزدیک به ۳۵ متر، که بر ستون‌هایی فولادی به شکل درخت استوارند؛ ستون‌هایی که هم از بیرون دیده می‌شوند
    و هم از درون. سه تا از این برگ‌ها سقف تالار مرکزی‌اند.


    هوشمندانه‌ترین بخش همانی است که دیده نمی‌شود. دیوارهای شیشه‌ای میان گلبرگ‌ها به آن‌ها متصل نیستند؛
    آزاد رها شده‌اند تا وقتی برف، باد یا تغییر دما سقف را جابه‌جا می‌کند، شیشه ترک برندارد.


    درون، کارهای روزمرهٔ زندگی انجام می‌شود. اینجا «خانهٔ عدالت» گرجستان است، جایی که مردم تولد، ازدواج،
    املاک و کسب‌وکار را ثبت می‌کنند و گذرنامه و کارت شناسایی می‌گیرند. تالار بر پایهٔ مدت‌زمان هر خدمت
    بخش‌بندی شده است (خودخدمت، کمتر از دو دقیقه، بیش از پنج دقیقه) و نوبت‌دهی الکترونیکی آرامش را حفظ
    می‌کند. این الگو در ۲۰۱۲ جایزهٔ خدمات عمومی سازمان ملل را برد و اندونزی آن را برای «مال‌های خدمات
    عمومی» خود به کار گرفت؛ نخستینشان در ۲۰۱۷ در بانیووانگی، در جاوهٔ شرقی، گشایش یافت.


    بیشتر بناهای بزرگ برای شاهان، خدایان یا پول برپا شده‌اند. این یکی برای صف ساخته شد، و صف، دست‌کم این
    بار، چیزی دارد که سر بلند کند و به آن بنگرد.
  tip: >-
    اینجا اداره‌ای دولتی و فعال است، نه موزه: تالار در روزهای کاری و در ساعات اداری باز است و ورود به
    آن رایگان است، اما مانند هر ادارهٔ عمومی دیگری رفتار کنید؛ آهسته سخن بگویید و از کارکنان یا مردمی
    که کنار باجه‌ها منتظرند عکس نگیرید. برای دیدن کل سقف در یک نگاه، از کرانهٔ روبه‌روی رود کورا یا از
    پل خشک تماشا کنید. نیم ساعت کافی است؛ سپس به بازار پل خشک، میدان اوربلیانی یا کلیسای آنچیسخاتی بروید
    که همه چند دقیقه پیاده فاصله دارند.
  route: >-
    به زحمت می‌شود اسمش را رانندگی گذاشت: حدود ۱ کیلومتر و پنج دقیقه از میدان آزادی در خیابان‌های آسفالت
    شهر. از خیابان پوشکین به کناره‌راه زویاد گامساخوردیا پایین بروید و آن را تا خیابان ساناپیرو، شمارهٔ
    ۲، پایین سولولاکی دنبال کنید. هر خودروی اقتصادی کافی است. ترافیک کناره‌راه سنگین است و جای پارک کنار
    خیابان کم؛ مجموعه با پارکینگی بزرگ طراحی شده، اما پیاده رفتن ساده‌تر است: ۱۰ تا ۱۵ دقیقه از میدان
    آزادی یا شهر قدیم در امتداد رود. نگران سوخت نباشید؛ در قلب پایتخت هستید.
he:
  name: היכל השירות הציבורי (בית הצדק)
  short: 'אחד-עשר "עלי כותרת" לבנים על עצי פלדה לצד נהר קורה: מבנה של פוקסאס, שבו חידוש דרכון בא יחד עם
    יצירה אדריכלית.'
  body: >-
    **טביליסי החליטה שחידוש דרכון צריך להתרחש מתחת לגג הנועז ביותר בעיר: אחד-עשר עלי כותרת לבנים המורמים
    על עצי פלדה מעל נהר קורה.**


    את הבניין שעל גדת הנהר, למרגלות סולולאקי, תכננו מסימיליאנו ודוריאנה פוקסאס; הוא נבנה בין 2010 ל-2012
    ונחנך ב-21 בספטמבר 2012. מתחת לגג הכול היגיון צרוף. שבעה גושי משרדים, כל אחד בן ארבע קומות במפלסים
    מדורגים, מתכנסים סביב "כיכר ציבורית" מרכזית שבה עמדות השירות, ומחוברים זה לזה בגשרונים פנימיים. מעליהם
    מרחפים אחד-עשר "עלים" ענקיים, חלקם בגודל של כמעט 35 מטרים, הנישאים על עמודי פלדה דמויי עצים הנראים
    גם מבחוץ וגם מבפנים. שלושה מהם משמשים גג לאולם המרכזי.


    החלק המתוחכם ביותר הוא זה שאינו נראה. קירות הזכוכית שבין עלי הכותרת אינם מחוברים אליהם; הם נותרו חופשיים,
    כך שכאשר שלג, רוח או שינוי טמפרטורה מזיזים את הגג, הזכוכית אינה נסדקת.


    בפנים מתנהלים חיי היומיום. זהו "בית הצדק" של גאורגיה, שבו אנשים רושמים לידות, נישואים, נכסים ועסקים,
    ומקבלים דרכונים ותעודות זהות. האולם מחולק לפי משך השירות – שירות עצמי, פחות משתי דקות, יותר מחמש –
    ותור אלקטרוני שומר על רוגע. המודל זכה ב-2012 בפרס השירות הציבורי של האו"ם, ואינדונזיה אימצה אותו עבור
    "קניוני השירות הציבורי" שלה; הראשון נפתח ב-2017 בבניוואנגי שבמזרח ג'אווה.


    רוב המבנים הגדולים הוקמו למען מלכים, אלים או כסף. זה נבנה למען התור – והתור, לשם שינוי, זוכה להרים
    את עיניו.
  tip: >-
    זהו משרד ממשלתי פעיל, לא מוזיאון: האולם פתוח בימי חול בשעות העבודה והכניסה חינם, אבל התנהגו כמו בכל
    משרד ציבורי – דברו בשקט ואל תצלמו את העובדים או את הממתינים ליד העמדות. כדי לראות את הגג כולו במבט
    אחד, הביטו מן הגדה שממול של נהר קורה או מן הגשר היבש. חצי שעה מספיקה בהחלט; המשיכו לשוק הגשר היבש,
    לכיכר אורבליאני או לבזיליקת אנצ'יסחאטי, כולם במרחק הליכה קצר.
  route: >-
    זו כמעט לא נסיעה: כ-1 ק"מ וחמש דקות מכיכר החירות ברחובות סלולים. רדו ברחוב פושקין אל דרך הגדה ע"ש
    זביאד גמסחורדיה והמשיכו בה עד רחוב סנאפירו 2, למרגלות סולולאקי. כל רכב חסכוני יתאים. התנועה בדרך הגדה
    כבדה ומקומות החניה לצד המדרכה מעטים; המתחם תוכנן עם חניון גדול, אבל פשוט יותר ללכת ברגל – 10–15 דקות
    מכיכר החירות או מהעיר העתיקה לאורך הנהר. אין צורך לדאוג לדלק: אתם בלב הבירה.
ar:
  name: قاعة الخدمات العامة (دار العدالة)
  short: >-
    إحدى عشرة «بتلة» بيضاء على أشجار من الفولاذ بجانب نهر كورا: مبنى آل فوكساس حيث يأتي تجديد جواز السفر
    مع قطعة من فن العمارة.
  body: >-
    **قررت تبليسي أن تجديد جواز السفر ينبغي أن يجري تحت أجرأ سقف في المدينة: إحدى عشرة بتلة بيضاء مرفوعة
    على أشجار فولاذية فوق نهر كورا.**


    صمّم المبنى القائم على الكورنيش أسفل حي سولولاكي ماسيميليانو ودوريانا فوكساس، وشُيّد بين عامي 2010
    و2012، وافتُتح في 21 سبتمبر 2012. وتحت السقف يسود المنطق وحده. سبع كتل مكتبية، كل منها من أربعة طوابق
    على مستويات متدرجة، تلتف حول «ساحة عامة» مركزية فيها مكاتب الخدمة، وتصل بينها جسور داخلية. وفوقها
    تطفو إحدى عشرة «ورقة» ضخمة، يبلغ طول بعضها قرابة 35 متراً، تحملها أعمدة فولاذية على هيئة أشجار تُرى
    من الخارج والداخل معاً. ثلاث منها تسقف القاعة المركزية.


    أذكى ما في المبنى هو ما لا يُرى. فالجدران الزجاجية بين البتلات غير مثبتة بها، بل تُركت حرة، حتى إذا
    حرّك الثلج أو الريح أو تبدّل الحرارة السقف، لم يتشقق الزجاج.


    وفي الداخل تمضي شؤون الحياة العادية. هذه «دار العدالة» في جورجيا، حيث يسجّل الناس المواليد والزيجات
    والعقارات والشركات، ويتسلمون جوازات السفر وبطاقات الهوية. وتنقسم القاعة بحسب مدة الخدمة: خدمة ذاتية،
    وأقل من دقيقتين، وأكثر من خمس دقائق، ويحفظ نظام الدور الإلكتروني الهدوء. وقد نال هذا النموذج جائزة
    الأمم المتحدة للخدمة العامة عام 2012، واستعارته إندونيسيا لـ«مجمّعات الخدمة العامة» لديها، وافتُتح
    أولها عام 2017 في بانيوانغي بجاوة الشرقية.


    أكثر المباني العظيمة شُيّدت للملوك أو للآلهة أو للمال. أما هذا فبُني للطابور، والطابور، لمرة واحدة،
    يحظى بأن يرفع رأسه وينظر إلى الأعلى.
  tip: >-
    هذه مصلحة حكومية عاملة لا متحف: القاعة مفتوحة في أيام العمل خلال ساعات الدوام، والدخول مجاني، لكن
    تصرفوا كما في أي مكتب عام؛ اخفضوا أصواتكم ولا تصوروا الموظفين أو المنتظرين عند المكاتب. لرؤية السقف
    كله دفعة واحدة، انظروا من الضفة المقابلة لنهر كورا أو من الجسر الجاف. تكفي نصف ساعة؛ ثم تابعوا إلى
    سوق الجسر الجاف أو ساحة أوربلياني أو بازيليكا أنتشيسخاتي، وكلها على مسافة مشي قصيرة.
  route: >-
    لا تكاد تكون قيادة: نحو 1 كم وخمس دقائق من ساحة الحرية عبر شوارع المدينة المعبّدة. انزلوا في شارع
    بوشكين إلى كورنيش زفياد غامساخورديا وتابعوه حتى رقم 2 في شارع سانابيرو، أسفل سولولاكي. أي سيارة اقتصادية
    تفي بالغرض. حركة السير على الكورنيش كثيفة ومواقف الرصيف نادرة؛ صُمّم المجمع بموقف سيارات كبير، لكن
    المشي أبسط: 10 إلى 15 دقيقة من ساحة الحرية أو البلدة القديمة على امتداد النهر. لا داعي للقلق بشأن
    الوقود، فأنتم في قلب العاصمة.
