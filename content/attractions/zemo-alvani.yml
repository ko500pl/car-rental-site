ka:
  name: ზემო ალვანი
  short: >-
    თუშების ზამთრის სოფელი ალაზნის ველზე — ცხვარი, მატყლი, VIII–IX საუკუნეების ბაზილიკა — იქ, სადაც თუშეთის
    გზა იწყება.
  body: >-
    **ყოველ შემოდგომაზე, როცა აბანოს უღელტეხილს თოვლი კეტავს, თუშეთი ბარგს იკრავს და ბარად ეშვება — მისი
    დიდი ნაწილი კი ზემო ალვანში ჩამოდის.**


    ზემო ალვანი დიდი სოფელია ალაზნის ვაკეზე, მდინარის მარცხენა მხარეს, ზღვის დონიდან 460 მეტრზე, ახმეტიდან
    9 კილომეტრში; 2014 წლის აღწერით აქ 3306 ადამიანი ცხოვრობდა. მოსახლეობა თუშებია, წოვათა და პირიქითა
    თემებიდან, და თაობების განმავლობაში მათი წელიწადი ორად იყოფოდა: კაცები დაახლოებით აპრილიდან ოქტომბრამდე
    ფარასთან ერთად თუშეთის მაღალ ხეობებში ცხოვრობდნენ, ცხვარი კი ზამთარს აქ, ალვანის ველზე ათევდა.


    ქართული წყაროები ალვანის ველზე თუშების უფლებას კახეთის მეფე ლევანს (1520–1574) უკავშირებენ; თეიმურაზ
    II-ისა და ერეკლე II-ის 1757 წლის წყალობის სიგელითაც ეს მიწა თუშებს ჯერ მხოლოდ საძოვრად ჰქონდათ. სხვა
    ცნობები წყალობას XVII საუკუნეს და კახეთის ომებში თუშთა სამსახურს მიაწერს: 1659 წლის ბახტრიონის აჯანყებაში
    თუშები თავიანთი გმირის, ზეზვა გაფრინდაულის, წინამძღოლობით იბრძოდნენ. მუდმივი კერა აქ XIX საუკუნის
    დასაწყისიდან გაჩნდა, XX საუკუნის 50-იან წლებში კი საბჭოთა ხელისუფლებამ მთაში დარჩენილი ოჯახების უმეტესობა
    ბარად ჩამოასახლა.


    მთავარ გზას გადაუხვიეთ. სოფლის ჩრდილო-აღმოსავლეთით, ქვის გალავანში, VIII–IX საუკუნეების იოანე ნათლისმცემლის
    სამნავიანი ბაზილიკა დგას, მის ახლოს, მაღალ მთაზე კი — მეფე ლევანის აგურით ნაშენი სასახლის, „ცხრაკარას“,
    ნანგრევები. როცა 1990-იან წლებში საბჭოთა მატყლის მრეწველობა დაიშალა, მთელ თემს მატყლს მხოლოდ ერთი
    საამქრო — აქაური „დიტოს ფაბრიკა“ — ურთავდა.


    მაისის ბოლო კვირას ალვანში ზეზვაობა იმართება — ბაზრობითა და დოღით, ზეზვა გაფრინდაულის სახსოვრად.


    თუშეთის კოშკები ღრუბლებში დგას; მისი სუფრა კი წლის ნახევარს აქ, ბარში, იშლება.
  tip: >-
    სოფელი მთელი წლის განმავლობაშია ღია, ბილეთი და სამუშაო საათები არ არსებობს. „ცხრაკარას“ ნანგრევებამდე
    ბილიკი და ისიც, ღიაა თუ არა ბაზილიკა, ადგილობრივებს ჰკითხეთ. ოქტომბერში და კვლავ გაზაფხულზე ფარები
    მოძრაობს — გზაზე ცხვარს მოელოდეთ და ნელა იარეთ. ხალხმრავლობა თუ გიყვართ, მაისის ბოლო კვირას, ზეზვაობაზე
    ჩამოდით. თუშეთისკენ მიდიხართ? მეზობელ ქვემო ალვანში მთამდე უკანასკნელი ბანკომატია და იქიდანვე გადიან
    ომალოსკენ საერთო ჯიპ-ტაქსები. საწვავი ახმეტაში ჩაასხით — უკანასკნელი საიმედო ბენზინგასამართი იქაა.
  route: >-
    გომბორის უღელტეხილით იარეთ: თბილისიდან ს5-ით, ვაზიანიდან შ38-ით ქედზე გადასვლით და თელავის განაპირამდე
    დაშვებით. იქ შ42-ზე გადადით და ახმეტის მიმართულებით დაახლოებით 7 კილომეტრი იარეთ, შემდეგ მარჯვნივ
    შ184-ზე გადაუხვიეთ, რომელიც ვენახებიან ველზე ალავერდის ტაძრის გვერდით ჩაგატარებთ, ბოლოს კი შ43-ით
    სოფელში შედით. სულ დაახლოებით 113 კმ და ორი საათი და თხუთმეტი წუთი; გზა ბოლომდე ასფალტიანია და ეკონომკლასის
    მანქანა სავსებით საკმარისია. თუ გომბორი თოვლით ჩაკეტილია, ს5-ითა და შ42-ით, საგარეჯოსა და გურჯაანის
    გავლით შემოიარეთ. აბანოს უღელტეხილით თუშეთისკენ გზა მხოლოდ ოფროუდ კლასისთვისაა და დაახლოებით ივნისიდან
    ოქტომბრის შუა რიცხვებამდეა ღია.
en:
  name: Zemo Alvani
  short: >-
    The Tush people's winter village on the Alazani plain — sheep, wool, an 8th–9th-century basilica —
    where the road to Tusheti begins.
  body: >-
    **Every autumn, when snow begins to close the Abano Pass, Tusheti packs up and comes down to the plain
    — and a good part of it comes to Zemo Alvani.**


    Zemo Alvani is a large village on the left bank of the Alazani, 460 metres above sea level and 9 km
    from Akhmeta; the 2014 census counted 3,306 people. Its families are Tush, of the Tsova and Pirikiti
    communities, and for generations their year was split in two. The men spent roughly April to October
    with the flocks in the high valleys of Tusheti, and the sheep wintered down here on the Alvani plain.


    Georgian sources trace the Tush claim to this land to King Levan of Kakheti (1520–1574); a charter
    of Teimuraz II and Erekle II from 1757 still treated it as pasture only. Other accounts link the grant
    to the 17th century and Tush service in Kakheti's wars: in the Bakhtrioni uprising of 1659 the Tush
    fought under their own hero, Zezva Gaprindauli. Permanent homes followed in the early 19th century,
    and in the 1950s Soviet policy moved most of the remaining highland families down to the plain.


    Step off the main road. On the north-eastern edge of the village, inside a stone wall, stands a three-nave
    basilica of St John the Baptist from the 8th–9th century; on a high hill nearby lie the ruins of Tskhrakara,
    King Levan's brick palace. When the Soviet wool industry collapsed in the 1990s, a single mill here,
    Dito's, was left spinning wool for the whole community.


    On the last Sunday of May, Zezvaoba brings a market and a horse race to Alvani in Zezva's honour.


    Tusheti's towers stand in the clouds; for half the year, its kitchen tables are laid down here.
  tip: >-
    The village is free and open all year, with no tickets or opening hours. Ask locally for the path
    up to the Tskhrakara ruins and whether the basilica is unlocked. In October, and again in spring,
    the flocks are on the move, so expect sheep across the road and drive slowly. For a crowd, come to
    Zezvaoba on the last Sunday of May. Heading on to Tusheti? Neighbouring Kvemo Alvani has the last
    ATM before the mountains and the shared 4x4 taxis to Omalo. Fill up in Akhmeta, the last reliable
    fuel.
  route: >-
    Cross the Gombori Pass: the S5 out of Tbilisi, then the Sh38 from Vaziani over the range and down
    to the edge of Telavi. Join the Sh42 north-west towards Akhmeta for about 7 km, turn right onto the
    Sh184, which runs across the vineyard plain past Alaverdi cathedral, then follow the Sh43 into the
    village. In all it is about 113 km and two and a quarter hours, asphalt throughout, so an economy
    car is plenty. If snow shuts Gombori, go round via Sagarejo and Gurjaani on the S5 and Sh42. The road
    on over the Abano Pass to Tusheti is offroad-class only, open roughly June to mid-October.
ru:
  name: Земо-Алвани
  short: Зимнее село тушин на Алазанской равнине — овцы, шерсть, базилика VIII–IX веков — и начало дороги
    в Тушети.
  body: >-
    **Каждую осень, когда снег начинает закрывать перевал Абано, Тушети собирает пожитки и спускается
    на равнину — и немалая её часть приходит в Земо-Алвани.**


    Земо-Алвани — большое село на левом берегу Алазани, на высоте 460 метров над уровнем моря и в 9 км
    от Ахметы; перепись 2014 года насчитала здесь 3306 жителей. Местные семьи — тушины из общин Цова и
    Пирикити, и поколениями их год делился надвое. Примерно с апреля по октябрь мужчины жили с отарами
    в высокогорных долинах Тушети, а зимовали овцы здесь, на Алванской равнине.


    Грузинские источники возводят права тушин на эту землю к кахетинскому царю Левану (1520–1574); грамота
    Теймураза II и Ираклия II 1757 года всё ещё считала её лишь пастбищем. Другие авторы связывают пожалование
    с XVII веком и службой тушин в войнах Кахети: в Бахтрионском восстании 1659 года тушины сражались
    под началом своего героя Зезвы Гаприндаули. Постоянные дома появились в начале XIX века, а в 1950-х
    советская политика переселила на равнину большинство остававшихся в горах семей.


    Сверните с главной дороги. На северо-восточной окраине села, за каменной оградой, стоит трёхнефная
    базилика Иоанна Крестителя VIII–IX веков; на высоком холме неподалёку лежат руины Цхракары, кирпичного
    дворца царя Левана. Когда в 1990-х рухнула советская шерстяная промышленность, для всей общины продолжала
    прясть шерсть единственная здешняя фабрика — фабрика Дито.


    В последнее воскресенье мая Зезваоба приводит в Алвани ярмарку и скачки в честь Зезвы.


    Башни Тушети стоят в облаках; полгода её кухонные столы накрывают здесь, внизу.
  tip: >-
    Село открыто круглый год, бесплатно, без билетов и часов работы. Спросите у местных дорогу к руинам
    Цхракары и открыта ли базилика. В октябре и снова весной отары в пути, так что ждите овец на дороге
    и поезжайте медленно. Если хочется праздничной толпы, приезжайте на Зезваобу в последнее воскресенье
    мая. Едете дальше в Тушети? В соседнем Квемо-Алвани — последний банкомат перед горами и общие внедорожники-такси
    до Омало. Заправьтесь в Ахмете: это последнее надёжное топливо.
  route: >-
    Через Гомборский перевал: из Тбилиси по S5, затем от Вазиани по Sh38 через хребет и вниз к окраине
    Телави. Там выезжайте на Sh42 на северо-запад в сторону Ахметы и через 7 км сверните направо на Sh184,
    которая идёт по виноградной равнине мимо собора Алаверди, а затем по Sh43 въезжайте в село. Всего
    около 113 км и два с четвертью часа, всё по асфальту, так что машины эконом-класса вполне хватит.
    Если снег закроет Гомбори, объезжайте через Сагареджо и Гурджаани по S5 и Sh42. Дальше, через перевал
    Абано в Тушети, — только на внедорожнике, дорога открыта примерно с июня до середины октября.
fa:
  name: زمو آلوانی
  short: >-
    روستای زمستانیِ توش‌ها در دشت آلازانی، با گوسفند و پشم و باسیلیکایی از قرن هشتم تا نهم؛ جایی که جادهٔ
    توشتی آغاز می‌شود.
  body: >-
    **هر پاییز، وقتی برف کم‌کم گردنهٔ آبانو را می‌بندد، توشتی بار و بنه‌اش را می‌بندد و به دشت می‌آید؛
    و بخش بزرگی از آن به زمو آلوانی می‌رسد.**


    زمو آلوانی روستایی بزرگ بر کرانهٔ چپ آلازانی است، در ارتفاع ۴۶۰ متری از سطح دریا و ۹ کیلومتری آخمتا؛
    سرشماری سال ۲۰۱۴ جمعیتش را ۳۳۰۶ نفر ثبت کرده است. خانواده‌هایش توش‌اند، از جامعه‌های تسووا و پیریکیتی،
    و نسل‌ها سالشان دو نیمه داشت. مردان تقریباً از آوریل تا اکتبر با گله‌ها در دره‌های بلند توشتی به سر
    می‌بردند و گوسفندان زمستان را همین پایین، در دشت آلوانی، می‌گذراندند.


    منابع گرجی حق توش‌ها بر این زمین را به لوان، شاه کاختی (۱۵۲۰–۱۵۷۴)، می‌رسانند؛ فرمانی از تیموراز دوم
    و ارکلی دوم در سال ۱۷۵۷ هنوز آن را فقط چراگاه می‌شمرد. روایت‌های دیگر این واگذاری را به قرن هفدهم
    و خدمت توش‌ها در جنگ‌های کاختی پیوند می‌دهند: در شورش باختریونی در سال ۱۶۵۹، توش‌ها به فرماندهی قهرمان
    خود، زِزوا گاپریندائولی، جنگیدند. خانه‌های دائمی در آغاز قرن نوزدهم برپا شدند و در دههٔ ۱۹۵۰ سیاست
    شوروی بیشتر خانواده‌هایی را که هنوز در کوهستان مانده بودند به دشت کوچاند.


    از جادهٔ اصلی بیرون بزنید. در لبهٔ شمال‌شرقی روستا، درون دیواری سنگی، باسیلیکایی سه‌شبستانی به نام
    یحیای تعمیددهنده از قرن هشتم تا نهم ایستاده است؛ و بر تپه‌ای بلند در همان نزدیکی، ویرانه‌های تسخراکارا،
    کاخ آجری شاه لوان، افتاده است. وقتی در دههٔ ۱۹۹۰ صنعت پشم شوروی فروریخت، تنها یک کارگاه در اینجا،
    کارگاه دیتو، برای همهٔ جامعه پشم می‌ریسید.


    در آخرین یکشنبهٔ ماه مه، جشن زِزوائوبا به افتخار زِزوا بازار و مسابقهٔ اسب‌دوانی را به آلوانی می‌آورد.


    برج‌های توشتی در میان ابرها ایستاده‌اند؛ نیمی از سال، سفره‌های خانه‌هایش همین پایین پهن می‌شود.
  tip: >-
    روستا در تمام سال باز و رایگان است؛ نه بلیتی در کار است، نه ساعت کاری. از اهالی راه ویرانه‌های تسخراکارا
    را بپرسید و اینکه در باسیلیکا باز است یا نه. در اکتبر، و دوباره در بهار، گله‌ها در حرکت‌اند؛ پس منتظر
    گوسفند در جاده باشید و آهسته برانید. اگر شلوغی جشن را می‌خواهید، در آخرین یکشنبهٔ ماه مه برای زِزوائوبا
    بیایید. راهی توشتی هستید؟ کوِمو آلوانیِ همسایه آخرین خودپرداز پیش از کوهستان را دارد و تاکسی‌های اشتراکی
    4x4 به اومالو نیز از همان‌جا حرکت می‌کنند. باک را در آخمتا پر کنید؛ آخرین جای مطمئن برای سوخت است.
  route: >-
    از گردنهٔ گومبوری بگذرید: از تفلیس جادهٔ S5، سپس از وازیانی جادهٔ Sh38 را بگیرید که از رشته‌کوه می‌گذرد
    و تا حاشیهٔ تلاوی پایین می‌آید. آنجا به جادهٔ Sh42 به سمت شمال‌غربی و آخمتا بپیچید و حدود ۷ کیلومتر
    بروید، سپس به راست وارد Sh184 شوید که از دشت تاکستان‌ها و کنار کلیسای جامع آلاوردی می‌گذرد، و بعد
    با Sh43 وارد روستا شوید. روی هم حدود ۱۱۳ کیلومتر و دو ساعت و ربع راه است و سراسر آسفالت، پس خودروی
    اقتصادی کاملاً کافی است. اگر برف گومبوری را ببندد، از راه ساگارجو و گورجانی و جاده‌های S5 و Sh42 دور
    بزنید. ادامهٔ راه از گردنهٔ آبانو به توشتی فقط برای خودروهای آفرود است و تقریباً از ژوئن تا نیمهٔ
    اکتبر باز است.
he:
  name: זמו אלוואני
  short: כפר החורף של הטושים במישור האלזאני — כבשים, צמר ובזיליקה מהמאות ה-8–9 — ושם מתחילה הדרך לטושתי.
  body: >-
    **בכל סתיו, כשהשלג מתחיל לסגור את מעבר אבאנו, טושתי אורזת את חפציה ויורדת אל המישור — וחלק גדול ממנה
    מגיע לזמו אלוואני.**


    זמו אלוואני הוא כפר גדול על הגדה השמאלית של האלזאני, בגובה 460 מטר מעל פני הים ו-9 ק"מ מאחמטה; במפקד
    2014 נמנו בו 3,306 תושבים. משפחותיו הן טושיות, מקהילות צובה ופיריקיטי, ובמשך דורות השנה שלהן נחלקה
    לשתיים. הגברים בילו בערך מאפריל עד אוקטובר עם העדרים בעמקים הגבוהים של טושתי, והכבשים חרפו כאן למטה,
    במישור אלוואני.


    מקורות גאורגיים מייחסים את זכותם של הטושים על האדמה הזאת למלך לוואן מקאחתי (1520–1574); כתב זכויות
    של טיימוראז השני וארקלה השני משנת 1757 עדיין ראה בה אדמת מרעה בלבד. מקורות אחרים קושרים את ההענקה
    למאה ה-17 ולשירותם של הטושים במלחמות קאחתי: במרד בחטריוני ב-1659 לחמו הטושים בפיקודו של גיבורם, זזווה
    גפרינדאולי. בתי קבע נבנו בראשית המאה ה-19, ובשנות ה-50 של המאה ה-20 העבירה המדיניות הסובייטית אל המישור
    את רוב המשפחות שעוד נותרו בהרים.


    רדו מהכביש הראשי. בקצה הצפון-מזרחי של הכפר, בתוך חומת אבן, עומדת בזיליקה תלת-ספינתית של יוחנן המטביל
    מהמאות ה-8–9; על גבעה גבוהה בקרבת מקום שוכנות חורבות צחרקרה, ארמון הלבנים של המלך לוואן. כשתעשיית
    הצמר הסובייטית קרסה בשנות ה-90, נותר כאן מפעל יחיד, של דיטו, שטווה צמר לכל הקהילה.


    ביום ראשון האחרון של מאי מביא חג זזוואובה לאלוואני יריד ומרוץ סוסים לכבודו של זזווה.


    המגדלים של טושתי עומדים בעננים; חצי שנה שולחנות המטבח שלה ערוכים כאן למטה.
  tip: >-
    הכפר פתוח כל השנה ובחינם, בלי כרטיסים ובלי שעות פתיחה. שאלו את המקומיים על השביל אל חורבות צחרקרה
    והאם הבזיליקה פתוחה. באוקטובר, ושוב באביב, העדרים בתנועה — צפו לכבשים על הכביש וסעו לאט. אם אתם רוצים
    המולה, בואו לזזוואובה ביום ראשון האחרון של מאי. ממשיכים לטושתי? בכפר השכן קוומו אלוואני נמצא הכספומט
    האחרון לפני ההרים, ומשם יוצאות מוניות 4x4 שיתופיות לאומאלו. תדלקו באחמטה, מקור הדלק האמין האחרון.
  route: >-
    חצו את מעבר גומבורי: מטביליסי בכביש S5, ומוואזיאני בכביש Sh38 מעל הרכס ובירידה אל שולי טלאווי. שם
    עלו על כביש Sh42 צפון-מערבה לכיוון אחמטה לכ-7 ק"מ, פנו ימינה לכביש Sh184, שחוצה את מישור הכרמים על
    פני קתדרלת אלאוורדי, והמשיכו בכביש Sh43 אל הכפר. בסך הכול כ-113 ק"מ ושעתיים ורבע, כולם סלולים, כך
    שרכב חסכוני מספיק בהחלט. אם השלג סוגר את גומבורי, עקפו דרך סגרג'ו וגורג'אני בכבישים S5 ו-Sh42. הדרך
    הלאה, דרך מעבר אבאנו לטושתי, מתאימה רק לרכבי שטח, ופתוחה בערך מיוני עד אמצע אוקטובר.
ar:
  name: زيمو ألفاني
  short: >-
    قرية الشتاء لأهل توشيتي في سهل ألازاني: أغنام وصوف وبازيليكا من القرنين الثامن والتاسع، ومنها يبدأ
    الطريق إلى توشيتي.
  body: >-
    **كل خريف، حين يبدأ الثلج بإغلاق ممر أبانو، تحزم توشيتي أمتعتها وتنزل إلى السهل، ويصل جزء كبير منها
    إلى زيمو ألفاني.**


    زيمو ألفاني قرية كبيرة على الضفة اليسرى لنهر ألازاني، على ارتفاع 460 مترًا فوق سطح البحر وعلى بعد
    9 كم من أخميتا؛ وقد أحصى تعداد عام 2014 فيها 3306 نسمة. عائلاتها من التوش، من جماعتي تسوفا وبيريكيتي،
    وعلى مدى أجيال انقسمت سنتهم شطرين. كان الرجال يقضون تقريبًا من أبريل إلى أكتوبر مع القطعان في أودية
    توشيتي العالية، بينما تمضي الأغنام الشتاء هنا في الأسفل، في سهل ألفاني.


    تُرجع المصادر الجورجية حق التوش في هذه الأرض إلى ملك كاخيتي ليفان (1520–1574)؛ وكانت وثيقة لتيموراز
    الثاني وإيريكلي الثاني عام 1757 لا تزال تعدّها مرعى فحسب. وتربط روايات أخرى المنحة بالقرن السابع عشر
    وبخدمة التوش في حروب كاخيتي: ففي انتفاضة باختريوني عام 1659 قاتل التوش بقيادة بطلهم زيزفا غابرينداولي.
    ثم قامت البيوت الدائمة في مطلع القرن التاسع عشر، وفي خمسينيات القرن العشرين نقلت السياسة السوفيتية
    معظم العائلات التي بقيت في الجبال إلى السهل.


    انعطفوا عن الطريق الرئيسي. على الطرف الشمالي الشرقي للقرية، داخل سور حجري، تقوم بازيليكا ثلاثية الأروقة
    مكرّسة للقديس يوحنا المعمدان من القرنين الثامن والتاسع؛ وعلى تلة عالية قريبة تقع أطلال تسخراكارا،
    قصر الملك ليفان المبني بالآجر. وحين انهارت صناعة الصوف السوفيتية في التسعينيات، بقي هنا مصنع واحد،
    مصنع ديتو، يغزل الصوف للجماعة كلها.


    وفي الأحد الأخير من مايو يحمل عيد زيزفاوبا إلى ألفاني سوقًا وسباق خيل تكريمًا لزيزفا.


    أبراج توشيتي قائمة في الغيوم؛ أما موائد مطابخها، فنصف العام تُمدّ هنا في الأسفل.
  tip: >-
    القرية مفتوحة طوال العام ومجانية، بلا تذاكر ولا مواعيد. اسألوا الأهالي عن الدرب الصاعد إلى أطلال تسخراكارا
    وعمّا إذا كانت البازيليكا مفتوحة. في أكتوبر، ثم في الربيع، تكون القطعان في ترحال، فتوقعوا أغنامًا
    على الطريق وقودوا ببطء. وإن أردتم الزحام والبهجة فتعالوا في عيد زيزفاوبا في الأحد الأخير من مايو.
    متجهون إلى توشيتي؟ في كفيمو ألفاني المجاورة آخر صراف آلي قبل الجبال، ومنها تنطلق سيارات الأجرة المشتركة
    ذات الدفع الرباعي إلى أومالو. املؤوا الخزان في أخميتا، آخر مصدر موثوق للوقود.
  route: >-
    اعبروا ممر غومبوري: من تبليسي على طريق S5، ثم من فازياني على طريق Sh38 فوق السلسلة نزولًا إلى أطراف
    تيلافي. هناك خذوا طريق Sh42 شمالًا غربًا باتجاه أخميتا نحو 7 كم، ثم انعطفوا يمينًا إلى طريق Sh184
    الذي يعبر سهل الكروم مرورًا بكاتدرائية ألافيردي، ثم اتبعوا طريق Sh43 إلى القرية. المجموع نحو 113 كم
    وساعتان وربع، والطريق معبّد بالكامل، فتكفي سيارة اقتصادية. وإذا أغلق الثلج غومبوري، فالتفّوا عبر ساغاريجو
    وغورجاني على طريقي S5 وSh42. أما الطريق الممتد عبر ممر أبانو إلى توشيتي فلا يصلح إلا لسيارات الطرق
    الوعرة، وهو مفتوح تقريبًا من يونيو حتى منتصف أكتوبر.
