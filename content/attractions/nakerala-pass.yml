ka:
  name: ნაქერალას უღელტეხილი
  short: >-
    სერპანტინი 300-მეტრიან კირქვის კედელზე, ზემოთ კი ბრტყელი, მწვანე რაჭა — შაორის ტბითა და საბჭოთა კურორტის
    დაცარიელებული დაბით.
  body: >-
    **ტყიბულის ხეობიდან ნაქერალა გადაულახავ კედლად მოჩანს; ზემოდან კი აღმოჩნდება, რომ ეს რაჭის ზღურბლია.**
    შ17, ქუთაისი–ამბროლაურის გზა, ტყიბულიდან მჭიდრო სერპანტინით ადის და ქედს 1217 მეტრზე გადაკვეთს. ფერმკრთალი
    კლდე, რომელსაც ქვემოდან შესცქეროდით — ნაქერალას ქედის სამხრეთი ფლატე, სამასიდან ექვსას მეტრამდე სიმაღლის
    კირქვა, — იმერეთისა და რაჭის ისტორიული საზღვარია.


    თავად მთა 1570 მეტრამდე აზიდულა და იურული და ქვედაცარცული კირქვებითაა აგებული: ქვედა კალთებზე ფოთლოვანი
    ტყეა, ზემოთ — სუბალპური მდელო. მის ფერდობებზე სამი მდინარე იბადება და სამივე თავის გზას ადგას: ტყიბულა
    სამხრეთით, თავისი წყალსაცავისკენ მიემართება, წყალწითელა — ყვირილისკენ, შარეულა კი ჩრდილოეთით, რიონისკენ.


    უღელტეხილიდან ხუთიოდე კილომეტრში შაორის წყალსაცავია — რაჭის უდიდესი ტბა, ცხრა კვადრატულ კილომეტრზე
    მეტი წყალი კარსტულ ზეგანზე, დაახლოებით 1150 მეტრზე. კაშხლამდე აქ ორი პატარა ტბა იყო — ხარისთვალა და
    ძროხისთვალა. ხარისთვალა დღესაც დაბად ითვლება: 1950-იან წლებში აქ ჰესის მშენებლები და გეოლოგები ცხოვრობდნენ,
    2021 წლის აღწერით კი იქ მუდმივი მცხოვრები აღარავინ დარჩენილა.


    ქედის გასწვრივ, დასავლეთით, 1569 მეტრზე ცხრაჯვრის სალოცავი დგას. გადმოცემით, მამამ, რომლის ცხრა ვაჟიც
    ომში წავიდა, აქ აღთქმად ცხრა ჯვარი აღმართა; ცხრავე შინ უვნებლად დაბრუნდა და ამ ადგილას წმინდა გიორგის
    სალოცავი ააგეს.


    იმ ფლატის კიდიდან დასავლეთით კოლხეთის დაბლობი ლურჯ ბურუსში იკარგება, ჩრდილოეთით კი, მოწმენდილ დღეს,
    კავკასიონი თეთრად დგას.
  tip: >-
    ზემოთ ნახევარი საათიც იკმარებს, მაგრამ თუ სამ-ოთხ საათს გამოყოფთ, ცხრაჯვრამდე გაისეირნეთ — ის ქედის
    გასწვრივ, დასავლეთით, დაახლოებით 5 კილომეტრშია: ჯერ გრუნტის გზაა, ბოლო ორი კილომეტრი კი საშუალო სირთულის
    ბილიკი ფლატის კიდეს მიუყვება. კიდეს ნუ მიუახლოვდებით, განსაკუთრებით ნისლში, რომელიც ხედს წუთებში ყლაპავს.
    ქუთაისთან შედარებით აქ შესამჩნევად გრილა და ქარია, ამიტომ ქურთუკი ივლისშიც წაიღეთ. უღელტეხილზე საყიდელი
    არაფერია — წყალი და საჭმელი ტყიბულიდან წამოიღეთ. სალოცავის დღესასწაულზე, მაისის ბოლო შაბათს, ხალხმრავლობაა.
    ზამთარში შ17 მოქმედებს, მაგრამ თოვლსა და ყინულზე ზამთრის საბურავები აუცილებელია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, დაახლოებით 190 კილომეტრი
    იარეთ, ზესტაფონთან გადაუხვიეთ და შ19-ით, თერჯოლის გავლით, ჩრდილოეთით ტყიბულამდე ადით. ქალაქში შ17-ს
    დაადექით ამბროლაურის მიმართულებით: შემდეგი ათიოდე კილომეტრი გზა კლდის ფერდზე სერპანტინით განუწყვეტლივ
    ადის უღელტეხილამდე — სულ დაახლოებით 238 კმ; მთის მონაკვეთის გათვალისწინებით ოთხი საათი გამოყავით.
    გზა ბოლომდე ასფალტიანია და მშრალ ამინდში ეკონომკლასის მანქანაც საკმარისია. საწვავი თერჯოლაში ან ტყიბულში
    ჩაასხით: უღელტეხილის იქით ამბროლაურამდე თითქმის არაფერი დაგხვდებათ.
en:
  name: Nakerala Pass
  short: >-
    Hairpins up a 300-metre limestone wall, and at the top Racha opens flat and green, with the Shaori
    lake and an empty Soviet resort town.
  body: >-
    **From the Tkibuli valley Nakerala looks like a wall with no way over it; from the top it turns out
    to be the doorstep of Racha.** The Sh17, the road from Kutaisi to Ambrolauri, climbs out of Tkibuli
    in tight hairpins and crosses the ridge at 1,217 metres. The pale cliff you were staring at from below
    — the southern face of the Nakerala range, 300 to 600 metres of limestone — is the historic boundary
    between Imereti and Racha.


    The mountain itself rises to 1,570 metres and is built of Jurassic and Lower Cretaceous limestone:
    broadleaf forest on the lower slopes, subalpine meadow on the crest. Three rivers are born on its
    flanks and go three separate ways — the Tkibula south to its reservoir, the Tskaltsiteli to the Kvirila,
    the Shareula north to the Rioni.


    Five kilometres beyond the pass lies the Shaori reservoir, the largest lake in Racha, more than nine
    square kilometres of water on a karst plateau at about 1,150 metres. Before the dam there were two
    small lakes here, Kharistvala and Dzrokhistvala — literally 'ox-eye' and 'cow-eye'. Kharistvala is
    still registered as an urban settlement: it housed the builders and geologists of the 1950s hydro
    scheme, and by the 2021 count it had no permanent residents at all.


    Along the ridge to the west, at 1,569 metres, stands the shrine of Tskhrajvari, the Nine Crosses.
    Tradition says a father whose nine sons had gone to war raised nine crosses here as a vow; all nine
    came home, and a shrine of St George was built on the spot.


    From that cliff edge the Colchian lowland fades into blue haze to the west, and on a clear day the
    Greater Caucasus stands white to the north.
  tip: >-
    Stop for half an hour at the top, or give it three to four hours and walk to Tskhrajvari, about 5
    km west along the ridge: a dirt track first, then the last two kilometres on a cliff-edge path of
    medium difficulty. Keep well back from the rim, especially in fog, which can swallow the view in minutes.
    It is noticeably colder and windier than in Kutaisi, so pack a jacket even in July. There is nothing
    to buy on the pass; bring water and food from Tkibuli. The shrine's festival, on the last Saturday
    of May, draws crowds. In winter the Sh17 stays in use, but snow and ice call for winter tyres.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri for about 190 km, leave it near Zestaponi
    and follow the Sh19 north via Terjola to Tkibuli. In town join the Sh17 towards Ambrolauri: the next
    ten kilometres or so are a steady climb in hairpins up the face of the cliff to the pass — about 238
    km in all, and allow four hours with the mountain section. The road is asphalt throughout and an economy
    car is fine in dry weather. Fill up in Terjola or Tkibuli: beyond the pass there is little until Ambrolauri.
ru:
  name: Перевал Накерала
  short: >-
    Серпантин по 300-метровой известняковой стене, а наверху — плоская, зелёная Рача с Шаорским озером
    и опустевшим советским курортным посёлком.
  body: >-
    **Из ущелья Ткибули Накерала кажется непреодолимой стеной; сверху же выясняется, что это порог Рачи.**
    Sh17, дорога из Кутаиси в Амбролаури, поднимается из Ткибули крутыми серпантинами и пересекает хребет
    на высоте 1217 метров. Светлая скала, на которую вы смотрели снизу, — южный обрыв хребта Накерала,
    известняковая стена высотой от 300 до 600 метров, — историческая граница между Имерети и Рачей.


    Сама гора поднимается до 1570 метров и сложена юрскими и нижнемеловыми известняками: на нижних склонах
    — широколиственный лес, на гребне — субальпийский луг. На её склонах рождаются три реки и расходятся
    в три разные стороны: Ткибула течёт на юг, к своему водохранилищу, Цкалцители — к Квириле, Шареула
    — на север, к Риони.


    В пяти километрах за перевалом лежит Шаорское водохранилище, самое большое озеро Рачи — свыше девяти
    квадратных километров воды на карстовом плато, на высоте около 1150 метров. До постройки дамбы здесь
    было два маленьких озера, Харисцвала и Дзрохисцвала — буквально «бычий глаз» и «коровий глаз». Харисцвала
    до сих пор числится посёлком городского типа: в нём жили строители и геологи гидроузла 1950-х годов,
    а по переписи 2021 года постоянных жителей там не осталось вовсе.


    Вдоль хребта на западе, на высоте 1569 метров, стоит святилище Цхражвари — Девять Крестов. Предание
    говорит, что отец, у которого девять сыновей ушли на войну, поставил здесь девять крестов как обет;
    все девятеро вернулись домой, и на этом месте построили святилище Святого Георгия.


    С этого края скалы Колхидская низменность тает в синей дымке на западе, а в ясный день на севере белеет
    Большой Кавказ.
  tip: >-
    Наверху достаточно и получаса, но если у вас есть три-четыре часа, дойдите до Цхражвари — около 5
    км на запад вдоль хребта: сначала грунтовка, а последние два километра — тропа средней сложности по
    краю обрыва. Держитесь подальше от кромки, особенно в тумане, который может скрыть вид за считанные
    минуты. Здесь заметно холоднее и ветренее, чем в Кутаиси, так что берите куртку даже в июле. На перевале
    ничего не купить; воду и еду возьмите в Ткибули. На праздник святилища, в последнюю субботу мая, съезжается
    много людей. Зимой Sh17 остаётся проезжей, но в снег и гололёд нужны зимние шины.
  route: >-
    Из Тбилиси по S1 (E60) на запад, через Гори и Хашури, около 190 км, съезжайте у Зестафони и двигайтесь
    по Sh19 на север через Терджолу до Ткибули. В городе выезжайте на Sh17 в сторону Амбролаури: следующие
    десять с небольшим километров — это непрерывный подъём серпантинами по склону скалы до перевала. Всего
    около 238 км; с учётом горного участка закладывайте четыре часа. Дорога полностью асфальтирована,
    в сухую погоду хватит машины эконом-класса. Заправьтесь в Терджоле или Ткибули: за перевалом, до Амбролаури,
    заправок почти нет.
fa:
  name: گذرگاه ناکرالا
  short: >-
    پیچ‌وخم‌هایی بر دیواره‌ی سنگ‌آهکی ۳۰۰ متری، و در بالا راچا، مسطح و سبز، با دریاچه‌ی شائوری و شهرکِ
    تفریحیِ متروکه‌ای از دوران شوروی، گشوده می‌شود.
  body: >-
    **از دره‌ی تکیبولی، ناکرالا دیواری بی‌گذر به نظر می‌رسد؛ اما از بالا، آشکار می‌شود که این آستانه‌ی
    راچاست.** جاده‌ی Sh17، مسیر کوتائیسی به آمبرولائوری، از تکیبولی با پیچ‌های تنگ بالا می‌رود و از تیغه‌ی
    کوه در ارتفاع ۱۲۱۷ متری می‌گذرد. صخره‌ی روشنی که از پایین به آن چشم دوخته بودید — دیواره‌ی جنوبی رشته‌ی
    ناکرالا، دیواری سنگ‌آهکی به بلندای ۳۰۰ تا ۶۰۰ متر — مرز تاریخی ایمرتی و راچا است.


    خود کوه تا ۱۵۷۰ متر بالا می‌رود و از سنگ‌آهک ژوراسیک و کرتاسه‌ی زیرین ساخته شده: در دامنه‌های پایینی
    جنگل پهن‌برگ، بر تیغه چمنزار زیرآلپی. سه رود بر دامنه‌های آن زاده می‌شوند و هر یک راهی جدا می‌روند
    — تکیبولا رو به جنوب، به‌سوی مخزن خویش؛ تسکالتسیتلی به‌سوی کویریلا؛ شارئولا رو به شمال، به‌سوی ریونی.


    پنج کیلومتر پس از گذرگاه، مخزن شائوری قرار دارد، بزرگ‌ترین دریاچه‌ی راچا، بیش از نه کیلومتر مربع آب
    بر فلاتی کارستی در ارتفاع نزدیک به ۱۱۵۰ متری. پیش از سد، دو دریاچه‌ی کوچک اینجا بود، خاریستوالا و
    ذروخیستوالا — به‌معنای لفظی «چشم گاو نر» و «چشم گاو». خاریستوالا هنوز به‌عنوان سکونتگاهی شهری ثبت
    است: در دهه‌ی ۱۹۵۰ سازندگان و زمین‌شناسان طرح برق‌آبی در آن می‌زیستند، و بر پایه‌ی سرشماری ۲۰۲۱ هیچ
    ساکن دائمی در آن باقی نمانده است.


    در امتداد تیغه، رو به غرب، در ارتفاع ۱۵۶۹ متری، زیارتگاه تسخراجواری، یعنی «نه صلیب»، برپاست. روایت
    است که پدری که نُه پسرش به جنگ رفته بودند، در اینجا نُه صلیب به‌نشان نذر برافراشت؛ هر نُه تن به سلامت
    بازگشتند، و در همان جا زیارتگاه قدیس گئورگ بنا شد.


    از کنار همان صخره، دشت کولخیس رو به غرب در غباری آبی محو می‌شود، و در روزی صاف، رو به شمال، قفقاز
    بزرگ سپید برمی‌خیزد.
  tip: >-
    نیم‌ساعت در بالا کافی است، یا اگر سه تا چهار ساعت وقت دارید، تا تسخراجواری پیاده بروید، حدود ۵ کیلومتر
    در امتداد تیغه رو به غرب: نخست راهی خاکی، سپس در دو کیلومتر پایانی کوره‌راهی با دشواری متوسط بر لبه‌ی
    صخره. از لبه فاصله بگیرید، به‌ویژه در مه، که می‌تواند منظره را در چند دقیقه ببلعد. این‌جا به‌روشنی
    از کوتائیسی سردتر و بادخیزتر است، پس حتی در ژوئیه ژاکتی همراه ببرید. در گذرگاه چیزی برای خریدن نیست؛
    آب و غذا را از تکیبولی بیاورید. جشن زیارتگاه، در آخرین شنبه‌ی ماه مه، جمعیت زیادی را به این‌جا می‌کشد.
    در زمستان Sh17 همچنان باز است، اما برف و یخ لاستیک زمستانی می‌خواهد.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از گوری و خاشوری، حدود ۱۹۰ کیلومتر بروید، نزدیک زستافونی از آن خارج
    شوید و از Sh19، از راه ترجولا، به شمال تا تکیبولی برانید. در شهر به Sh17 به‌سوی آمبرولائوری بپیوندید:
    ده کیلومتر بعدی صعودی پیوسته و پرپیچ بر دیواره‌ی صخره تا گذرگاه است — در مجموع نزدیک به ۲۳۸ کیلومتر؛
    با احتساب بخش کوهستانی، روی هم چهار ساعت در نظر بگیرید. جاده تمام مسیر آسفالته است و در آب‌وهوای خشک
    خودرویی معمولی کافی است. در ترجولا یا تکیبولی سوخت‌گیری کنید: پس از گذرگاه تا آمبرولائوری تقریباً
    هیچ امکاناتی نیست.
he:
  name: מעבר נקרלה
  short: >-
    עיקולים על קיר אבן גיר בגובה 300 מטרים, ובראש נפתחת רָאצָ'ה השטוחה והירוקה, עם אגם שאורי ועיירת נופש
    סובייטית נטושה.
  body: >-
    **מעמק טקיבולי נראית נקרלה כקיר שאין דרך מעליו; מלמעלה מתגלה שזהו סף הכניסה לרָאצָ'ה.** כביש Sh17,
    הדרך מקוטאיסי לאמברולאורי, מטפס מטקיבולי בעיקולים חדים וחוצה את הרכס בגובה 1,217 מטרים. הצוק הבהיר
    שבו הבטתם מלמטה — המצוק הדרומי של רכס נקרלה, 300 עד 600 מטרים של אבן גיר — הוא הגבול ההיסטורי בין
    אימרתי לרָאצָ'ה.


    ההר עצמו מתנשא ל-1,570 מטרים ובנוי מאבני גיר מתקופות היורה והקרטיקון התחתון: יער רחב-עלים בשלוחות
    התחתונות, אחו סאב-אלפיני על הרכס. שלושה נהרות נולדים על מדרונותיו ופונים שלוש דרכים נפרדות — הטקיבולה
    דרומה לעבר מאגרה, הצקלציטלה לעבר הקווירילה, השראולה צפונה לעבר הריוני.


    חמישה קילומטרים אחרי המעבר שוכן מאגר שאורי, האגם הגדול ביותר ברָאצָ'ה, יותר מתשעה קילומטרים רבועים
    של מים על רמת קארסט בגובה של כ-1,150 מטרים. לפני הסכר היו כאן שני אגמים קטנים, חריסצוואלה ודזרוחיסצוואלה
    — פשוטו כמשמעו 'עין השור' ו'עין הפרה'. חריסצוואלה עדיין רשומה כיישוב עירוני: בה התגוררו הבונים והגאולוגים
    של מיזם הכוח ההידרואלקטרי בשנות ה-50, ולפי מפקד 2021 לא נותרו בה תושבים קבועים בכלל.


    לאורך הרכס מערבה, בגובה 1,569 מטרים, עומד מקדש צחרג'וורי, תשעת הצלבים. המסורת מספרת על אב שתשעת בניו
    יצאו למלחמה, והוא הקים כאן תשעה צלבים כנדר; כל התשעה חזרו בשלום, ובמקום נבנה מקדש לכבוד גאורגיוס הקדוש.


    מקצה אותו מצוק נמוג מישור קולכיס מערבה בערפל כחול, וביום צח, בצפון, ניצב הקווקז הגדול לבן.
  tip: >-
    חצי שעה בראש מספיקה, אבל אם יש לכם שלוש-ארבע שעות, צאו ברגל לצחרג'וורי, כחמישה קילומטרים מערבה לאורך
    הרכס: תחילה דרך עפר, ובשני הקילומטרים האחרונים שביל בדרגת קושי בינונית על שפת המצוק. הישארו הרחק מהשוליים,
    בייחוד בערפל, שיכול לבלוע את הנוף בתוך דקות. קר יותר ונושבת כאן רוח חזקה יותר מאשר בקוטאיסי, אז קחו
    מעיל אפילו ביולי. אין מה לקנות במעבר; הביאו מים ואוכל מטקיבולי. חג המקדש, בשבת האחרונה של מאי, מושך
    המונים. בחורף כביש Sh17 נשאר פתוח, אך שלג וקרח מחייבים צמיגי חורף.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי וחשורי, כ-190 ק"מ, צאו ממנו ליד זסטאפוני והמשיכו ב-Sh19 צפונה
    דרך טרג'ולה עד טקיבולי. בעיר התחברו ל-Sh17 לכיוון אמברולאורי: כעשרת הקילומטרים הבאים הם טיפוס מתמיד
    בעיקולים על פני המצוק עד המעבר. בסך הכול כ-238 ק"מ; בגלל הקטע ההררי הקציבו לנסיעה כולה ארבע שעות.
    הכביש סלול לכל אורכו, ורכב אקונומי מספיק במזג אוויר יבש. תדלקו בטרג'ולה או בטקיבולי: אחרי המעבר אין
    כמעט דבר עד אמברולאורי.
ar:
  name: ممر ناكيرالا
  short: >-
    منعرجات على جدار جيري ارتفاعه 300 متر، وفي القمة تنفتح راتشا المسطحة والخضراء، ببحيرة شاوري وبلدة
    منتجع سوفييتية مهجورة.
  body: >-
    **من وادي تكيبولي، يبدو ناكيرالا جدارًا لا معبر منه؛ ومن القمة يتكشّف أنه عتبة راتشا.** طريق Sh17،
    من كوتايسي إلى أمبرولاوري، يصعد من تكيبولي بمنعرجات ضيقة ويعبر السلسلة عند 1217 مترًا. الصخرة الفاتحة
    التي كنتم تحدّقون فيها من الأسفل — الجدار الجنوبي لسلسلة ناكيرالا، جدار جيري من 300 إلى 600 متر —
    هي الحدود التاريخية بين إيميريتي وراتشا.


    يرتفع الجبل نفسه إلى 1570 مترًا ويتكوّن من حجر جيري من العصر الجوراسي والكريتاسي السفلي: غابة عريضة
    الأوراق على السفوح السفلى، ومرج شبه ألبي على القمة. تولد ثلاثة أنهار على منحدراته وتذهب في ثلاثة اتجاهات
    مختلفة — تكيبولا جنوبًا إلى خزانها، وتسكالتسيتيلي إلى كفيريلا، وشارئولا شمالًا إلى ريوني.


    على مسافة خمسة كيلومترات بعد الممر تقع بحيرة شاوري، أكبر بحيرة في راتشا، بأكثر من تسعة كيلومترات مربعة
    من المياه على هضبة كارستية على ارتفاع نحو 1150 مترًا. قبل السد كانت هنا بحيرتان صغيرتان، خاريستفالا
    ودزروخيستفالا — وتعني حرفيًا «عين الثور» و«عين البقرة». لا تزال خاريستفالا مسجّلة بلدةً حضرية: كانت
    تؤوي بناةَ مشروع الطاقة الكهرومائية وجيولوجييه في الخمسينيات، ووفق تعداد 2021 لم يبق فيها أي سكان
    دائمين.


    على امتداد السلسلة غربًا، عند 1569 مترًا، يقف مزار تسخراجفاري، أي الصلبان التسعة. تقول التقاليد إن
    أبًا ذهب أبناؤه التسعة إلى الحرب رفع هنا تسعة صلبان نذرًا؛ فعاد التسعة جميعًا سالمين، وبُني في المكان
    مزار للقديس جاورجيوس.


    من حافة تلك الصخرة يذوب سهل كولخيس غربًا في ضباب أزرق، وفي يوم صافٍ يقف القوقاز الكبير أبيضَ في الشمال.
  tip: >-
    نصف ساعة في القمة تكفي، أو خصّصوا ثلاث إلى أربع ساعات وامشوا إلى تسخراجفاري، على بعد نحو 5 كم غربًا
    على امتداد السلسلة: طريق ترابي أولًا، ثم درب متوسط الصعوبة على حافة الجرف في الكيلومترين الأخيرين.
    ابقوا بعيدًا عن الحافة، خصوصًا في الضباب الذي قد يبتلع المشهد في دقائق. الجو هنا أبرد وأشد رياحًا
    بوضوح مما في كوتايسي، فاحملوا سترة حتى في يوليو. لا شيء يُشترى على الممر؛ احملوا الماء والطعام من
    تكيبولي. يجذب عيد المزار، في آخر سبت من مايو، حشودًا كبيرة. في الشتاء يبقى طريق Sh17 مفتوحًا، لكن
    الثلج والجليد يتطلبان إطارات شتوية.
  route: >-
    من تبليسي خذوا S1 (E60) غربًا عبر غوري وخاشوري لنحو 190 كم، ثم اخرجوا منه قرب زيستافوني واتبعوا Sh19
    شمالًا عبر ترجولا إلى تكيبولي. في المدينة انتقلوا إلى Sh17 نحو أمبرولاوري: الكيلومترات العشرة التالية
    صعود متواصل بمنعرجات على جدار الصخرة حتى الممر. المسافة الإجمالية نحو 238 كم، فخصّصوا للرحلة كلها
    أربع ساعات بسبب القطاع الجبلي. الطريق مُعبّد بالكامل، وتكفي سيارة اقتصادية في الطقس الجاف. تزوّدوا
    بالوقود في ترجولا أو تكيبولي: بعد الممر لا تكاد توجد خدمات حتى أمبرولاوري.
