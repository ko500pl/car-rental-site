ka:
  name: ნაქერალას უღელტეხილი
  short: 1200 მეტრზე მაღლა მდებარე უღელტეხილი ტყიბულსა და რაჭას შორის, კირქვის კედლისა და ორი ხეობის ხედით.
  body: >-
    **ნაქერალა ის ადგილია, სადაც იმერეთი მთავრდება და რაჭა იწყება.** უღელტეხილი ტყიბულის მუნიციპალიტეტში,
    დაახლოებით 1230 მეტრზეა და ტყიბულ-ამბროლაურის გზაზე გადის — ეს დასავლეთიდან რაჭაში შესვლის მთავარი
    კარია.


    ნაქერალა ამავე დროს კირქვის ქედის სახელიცაა. თეთრი, თითქმის ვერტიკალური კედელი ტყიბულის ხეობის ზემოთ
    ოცდაათიოდე კილომეტრზეა გადაჭიმული და შორიდანვე ჩანს — სწორედ ის ქმნის ორ ისტორიულ მხარეს შორის ბუნებრივ
    საზღვარს.


    რას ხედავ ზემოდან:


    - სამხრეთით — ტყიბულის ხეობა, წყალსაცავი და მის მიღმა კოლხეთის დაბლობი


    - ჩრდილოეთით — რაჭის სოფლები, შაორის წყალსაცავი და ხვამლის მასივი


    - აღმოსავლეთით — ცხრაჯვარის ქედი, საიდანაც ნათელ ამინდში კავკასიონის მთავარი ქედიც მოჩანს


    უღელტეხილიდან ცხრაჯვარისკენ საფეხმავლო ბილიკი მიდის: სამ-ოთხსაათიანი გასეირნება ალპურ მდელოებზე, ნაქერალას
    კედლის კიდის გასწვრივ. ეს ერთ-ერთი საუკეთესო ერთდღიანი ლაშქრობაა ქუთაისის ახლოს და ტექნიკურად რთული
    არაა, თუმცა წყალი თან უნდა გქონდეს.


    თავად უღელტეხილზე შენობა თითქმის არაა — რამდენიმე გაჩერების ადგილი, ჯიხური თაფლითა და ჩურჩხელით სეზონზე,
    და ქარი. საღამოს, როცა დაბლობზე ნისლი დგება და მხოლოდ კედლის თავია განათებული, აქ ღირს გაჩერება.


    თავად კედელიც ღირს გასაგებად. ეს ცარცული კირქვის ფილაა, რაჭის ქედის კიდეზე აწეული და დახრილი; მისი
    ძირი მღვიმეებითა და წყაროებითაა დაცხრილული — იგივე ქანი, რომელიც დასავლეთით ოქრიბის კარსტს ქმნის.
    ზემოთ, ქიმის უკან, ბრტყელი მდელოებია: ზაფხულში აქ პირუტყვს ამოდიან და თივას თიბავენ. ივნისში ეს მდელო
    ველური ყვავილებითაა სავსე, აგვისტოს ბოლოს კი უკვე გამომშრალი და ყვითელია.
  tip: >-
    ერთი საათი გაჩერებისთვის, სამიდან ოთხ საათამდე — თუ ცხრაჯვარისკენ ბილიკზე გახვალ. უღელტეხილზე ქარი
    თითქმის ყოველთვის ქრის და ტემპერატურა ქუთაისზე ათი გრადუსით დაბალია — ქურთუკი ზაფხულშიც წაიღე. ნისლი
    სწრაფად ეშვება და ხედი წუთებში ქრება. ბილიკზე წყალი არ არის. ზამთარში გზა ინახება, მაგრამ თოვლისა
    და ყინულის დროს ზამთრის საბურავები და გამოცდილება აუცილებელია; ქარბუქში მოძრაობა დროებით ჩერდება.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ჩრდილოეთით თერჯოლასა და ტყიბულზე გავლით ამბროლაურის მიმართულებით
    — სულ დაახლოებით 255 კმ და ოთხი საათი. ტყიბულის შემდეგ გზა ოციოდე კილომეტრზე უწყვეტად ადის, ვიწრო
    სერპანტინით; საფარი ასფალტია და ზოგადად კარგ მდგომარეობაში. საწვავი აუცილებლად ზესტაფონში ან ტყიბულში
    აიღე — უღელტეხილსა და ამბროლაურს შორის სადგური არ არის. მშრალ ამინდში ეკონომ-კლასი საკმარისია.
en:
  name: Nakerala Pass
  short: A pass above 1,200 metres between Tkibuli and Racha, with a limestone wall and two valleys in
    view.
  body: >-
    **Nakerala is where Imereti ends and Racha begins.** The pass lies in Tkibuli municipality at about
    1,230 metres, on the Tkibuli–Ambrolauri road — the main way into Racha from the west.


    Nakerala is also the name of the limestone ridge. The white, near-vertical wall runs for some thirty
    kilometres above the Tkibuli valley and is visible from far off; it forms the natural boundary between
    the two historic provinces.


    What you see from the top:


    - south, the Tkibuli valley, the reservoir and beyond it the Colchic lowland


    - north, the villages of Racha, the Shaori reservoir and the Khvamli massif


    - east, the Tskhrajvari ridge, and in clear weather the main range of the Caucasus behind it


    A walking trail leaves the pass towards Tskhrajvari: three to four hours over alpine meadow along
    the edge of the Nakerala wall. It is one of the best day walks within reach of Kutaisi and is not
    technically difficult, but there is no water on the route.


    On the pass itself there is almost nothing built — a few pull-ins, a stall selling honey and churchkhela
    in season, and wind. It is worth stopping in the evening, when mist settles over the lowland and only
    the top of the wall is still lit.


    The wall itself is worth understanding. It is a slab of Cretaceous limestone lifted and tilted along
    the edge of the Racha range, and its base is riddled with caves and springs — the same rock that produces
    the karst of Okriba further west. Behind the rim the ground flattens into meadow: cattle are brought
    up here in summer and hay is cut. In June the meadow is full of wild flowers, and by late August it
    has dried to yellow.
  tip: >-
    An hour for the stop, three to four if you walk out towards Tskhrajvari. The wind blows almost constantly
    on the pass and the temperature is around ten degrees lower than in Kutaisi, so take a jacket even
    in summer. Cloud comes down fast and the view can disappear in minutes. There is no water on the trail.
    The road is kept open in winter, but snow and ice demand winter tyres and some experience, and traffic
    is stopped during blizzards.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then head north through Terjola and Tkibuli towards Ambrolauri
    — about 255 km in all, four hours. Beyond Tkibuli the road climbs continuously for some twenty kilometres
    in tight hairpins; the surface is asphalt and generally in good condition. Fill up in Zestaponi or
    Tkibuli, because there is no fuel station between the pass and Ambrolauri. In dry weather an economy
    car is sufficient.
ru:
  name: Перевал Накерала
  short: Перевал выше 1200 метров между Ткибули и Рачей, с известняковой стеной и двумя долинами в поле
    зрения.
  body: >-
    **Накерала — место, где заканчивается Имеретия и начинается Рача.** Перевал находится в Ткибульском
    муниципалитете на высоте около 1230 метров, на дороге Ткибули — Амбролаури, главном пути в Рачу с
    запада.


    Накерала — это ещё и название известнякового хребта. Белая, почти отвесная стена тянется километров
    на тридцать над Ткибульской долиной и видна издалека; именно она образует естественную границу между
    двумя историческими краями.


    Что видно сверху:


    - на юг — Ткибульская долина, водохранилище и за ним Колхидская низменность


    - на север — рачинские сёла, Шаорское водохранилище и массив Хвамли


    - на восток — гребень Цхраджвари, а в ясную погоду за ним и Главный Кавказский хребет


    От перевала в сторону Цхраджвари уходит пешеходная тропа: три-четыре часа по альпийским лугам вдоль
    кромки стены Накералы. Это один из лучших однодневных маршрутов в досягаемости от Кутаиси, технически
    несложный, но воды по пути нет.


    На самом перевале почти ничего не построено — несколько карманов для остановки, киоск с мёдом и чурчхелой
    в сезон и ветер. Останавливаться стоит вечером, когда над низиной ложится туман, а освещённой остаётся
    только верхняя кромка стены.


    Саму стену стоит понять. Это плита мелового известняка, поднятая и наклонённая по краю Рачинского
    хребта; её основание изрешечено пещерами и источниками — та же порода, что образует карст Окрибы западнее.
    За кромкой поверхность выполаживается в луга: летом сюда поднимают скот и косят сено. В июне луг полон
    диких цветов, а к концу августа выгорает до жёлтого.
  tip: >-
    Час на остановку, три-четыре — если пойдёте в сторону Цхраджвари. На перевале почти всегда дует, а
    температура градусов на десять ниже, чем в Кутаиси, так что куртка нужна и летом. Облако опускается
    быстро, и вид исчезает за минуты. Воды на тропе нет. Зимой дорогу чистят, но при снеге и льду нужны
    зимняя резина и опыт, а в метель движение перекрывают.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем на север через Тержолу и Ткибули в сторону Амбролаури — всего
    около 255 км, четыре часа. За Ткибули дорога непрерывно поднимается километров двадцать крутым серпантином;
    покрытие асфальтовое и в целом в хорошем состоянии. Заправляйтесь в Зестафони или Ткибули: между перевалом
    и Амбролаури заправок нет. В сухую погоду достаточно машины эконом-класса.
fa:
  name: گردنهٔ ناکرالا
  short: گردنه‌ای بالای ۱۲۰۰ متر میان تکیبولی و راچا، با دیوارهٔ سنگ آهکی و دو دره در چشم‌انداز.
  body: >-
    **ناکرالا جایی است که ایمرتی پایان می‌یابد و راچا آغاز می‌شود.** گردنه در شهرستان تکیبولی و در ارتفاع
    حدود ۱۲۳۰ متر بر جادهٔ تکیبولی به آمبرولاوری قرار دارد؛ همان راه اصلی ورود به راچا از غرب.


    ناکرالا نام رشته‌ای از سنگ آهک هم هست. دیوارهٔ سفید و تقریباً عمودی حدود سی کیلومتر بالای درهٔ تکیبولی
    کشیده شده و از دور پیداست؛ همین دیواره مرز طبیعی میان دو ولایت تاریخی است.


    از بالا چه می‌بینید:


    - در جنوب، درهٔ تکیبولی، آبگیر و پشت آن پست‌دشت کلخی


    - در شمال، روستاهای راچا، آبگیر شائوری و تودهٔ خوامْلی


    - در شرق، یال تسخراجواری و در هوای صاف رشته‌کوه اصلی قفقاز پشت آن


    از گردنه مسیری پیاده به سوی تسخراجواری می‌رود: سه تا چهار ساعت روی چمنزار کوهستانی و در امتداد لبهٔ
    دیوارهٔ ناکرالا. این از بهترین پیاده‌روی‌های یک‌روزه در دسترس کوتایسی است و از نظر فنی دشوار نیست،
    اما در راه آبی پیدا نمی‌شود.


    روی خود گردنه تقریباً ساختمانی نیست؛ چند جای توقف، دکه‌ای با عسل و چورچخلا در فصل، و باد. ارزش دارد
    غروب بایستید، وقتی مه روی پست‌دشت می‌نشیند و تنها لبهٔ بالای دیواره هنوز روشن است.


    خود دیواره ارزش فهمیدن دارد. تخته‌سنگی از آهک کرتاسه است که در امتداد لبهٔ رشته‌کوه راچا بالا آمده
    و کج شده، و پای آن پر از غار و چشمه است — همان سنگی که کارست اوکریبا را در غرب می‌سازد. پشت لبه، زمین
    به چمنزار هموار می‌شود: تابستان دام را به اینجا می‌آورند و علوفه می‌چینند. در ژوئن چمنزار پر از گل‌های
    وحشی است و تا اواخر اوت خشک و زرد شده است.
  tip: >-
    یک ساعت برای توقف، سه تا چهار ساعت اگر به سوی تسخراجواری پیاده بروید. روی گردنه باد تقریباً همیشه
    می‌وزد و دما حدود ده درجه کمتر از کوتایسی است، پس حتی در تابستان کاپشن ببرید. ابر تند پایین می‌آید
    و منظره در چند دقیقه ناپدید می‌شود. در مسیر آب نیست. جاده در زمستان باز نگه داشته می‌شود، اما برف
    و یخ لاستیک زمستانی و کمی تجربه می‌خواهد، و در کولاک تردد متوقف می‌شود.
  route: >-
    از تفلیس با E60 تا زستافونی، سپس شمال از راه ترجولا و تکیبولی به سوی آمبرولاوری — روی‌هم حدود ۲۵۵
    کیلومتر و چهار ساعت. پس از تکیبولی جاده حدود بیست کیلومتر پیوسته و با پیچ‌های تند بالا می‌رود؛ روکش
    آسفالت و عموماً در وضع خوبی است. حتماً در زستافونی یا تکیبولی سوخت‌گیری کنید، چون میان گردنه و آمبرولاوری
    پمپ بنزینی نیست. در هوای خشک خودروی اقتصادی کافی است.
he:
  name: מעבר נאקראלה
  short: מעבר בגובה של יותר מ-1,200 מטר בין טקיבולי לראצ'ה, עם קיר גיר ושני עמקים בשדה הראייה.
  body: >-
    **נאקראלה הוא המקום שבו נגמרת אימרתי ומתחילה ראצ'ה.** המעבר נמצא בנפת טקיבולי בגובה כ-1,230 מטר, על
    כביש טקיבולי–אמברולאורי, הדרך הראשית אל ראצ'ה מן המערב.


    נאקראלה הוא גם שמו של רכס הגיר. הקיר הלבן, כמעט אנכי, נמתח כשלושים ק״מ מעל עמק טקיבולי ונראה מרחוק;
    הוא היוצר את הגבול הטבעי בין שני החבלים ההיסטוריים.


    מה רואים מלמעלה:


    - בדרום, עמק טקיבולי, המאגר ומעברו השפלה הקולכית


    - בצפון, כפרי ראצ'ה, מאגר שאורי וגוש חוואמלי


    - במזרח, רכס צחראג'ווארי, ובמזג אוויר בהיר גם רכס הקווקז הראשי מאחוריו


    מן המעבר יוצא שביל הליכה לכיוון צחראג'ווארי: שלוש עד ארבע שעות על אחו אלפיני לאורך שפת קיר נאקראלה.
    זו אחת ההליכות היומיות הטובות בהישג יד מקוטאיסי, ואינה קשה טכנית, אך אין מים לאורך המסלול.


    על המעבר עצמו כמעט לא בנוי דבר — כמה מפרצי עצירה, דוכן שמוכר דבש וצ'ורצ'חלה בעונה, ורוח. כדאי לעצור
    לפנות ערב, כשערפל יורד על השפלה ורק ראש הקיר עדיין מואר.


    כדאי להבין את הקיר עצמו. זהו לוח של אבן גיר קרטיקונית שהורם והוטה לאורך שולי רכס ראצ'ה, ובסיסו מנוקב
    מערות ומעיינות — אותו סלע היוצר את הקרסט של אוקריבה ממערב. מאחורי השפה מתיישרת הקרקע לאחו: בקיץ מעלים
    לכאן בקר וקוצרים חציר. ביוני האחו מלא פרחי בר, ובסוף אוגוסט הוא כבר יבש וצהוב.
  tip: >-
    שעה לעצירה, שלוש עד ארבע אם תלכו לעבר צחראג'ווארי. הרוח נושבת כמעט תמיד במעבר והטמפרטורה נמוכה בכעשר
    מעלות מקוטאיסי, אז קחו מעיל גם בקיץ. העננים יורדים מהר והנוף עלול להיעלם בדקות. אין מים בשביל. הכביש
    נשמר פתוח בחורף, אך שלג וקרח מחייבים צמיגי חורף וניסיון, ובסופות שלג התנועה נעצרת.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז צפונה דרך טרז'ולה וטקיבולי לכיוון אמברולאורי — כ-255 ק״מ בסך הכול,
    ארבע שעות. אחרי טקיבולי הכביש מטפס ברציפות כעשרים ק״מ בסרפנטינות צרות; המיסעה אספלט ובדרך כלל במצב
    טוב. תדלקו בזסטפוני או בטקיבולי, שכן בין המעבר לאמברולאורי אין תחנת דלק. בימים יבשים רכב חסכוני מספיק.
ar:
  name: ممر ناكيرالا
  short: ممر يعلو 1200 متر بين تكيبولي وراتشا، بجدار جيري وواديين في مرمى البصر.
  body: >-
    **ناكيرالا هو حيث تنتهي إيميريتي وتبدأ راتشا.** يقع الممر في بلدية تكيبولي على ارتفاع نحو 1230 متراً،
    على طريق تكيبولي–أمبرولاوري، وهو المدخل الرئيسي إلى راتشا من الغرب.


    وناكيرالا اسم السلسلة الجيرية أيضاً. فالجدار الأبيض شبه العمودي يمتد نحو ثلاثين كيلومتراً فوق وادي
    تكيبولي ويُرى من بعيد؛ وهو الذي يشكّل الحدّ الطبيعي بين الإقليمين التاريخيين.


    ما تراه من الأعلى:


    - جنوباً: وادي تكيبولي والخزان وخلفه سهل كولخيس المنخفض


    - شمالاً: قرى راتشا وخزان شاوري وكتلة خفاملي


    - شرقاً: حرف تسخراجفاري، وفي الجو الصافي سلسلة القوقاز الكبرى خلفه


    ومن الممر ينطلق مسار مشي نحو تسخراجفاري: ثلاث إلى أربع ساعات على مروج جبلية بمحاذاة حافة جدار ناكيرالا.
    وهو من أفضل مسيرات اليوم الواحد في متناول كوتايسي وليس صعباً تقنياً، غير أن الطريق بلا ماء.


    وعلى الممر نفسه لا يكاد يوجد بناء: بضعة مواضع للتوقف، وكشك يبيع العسل والتشورتشخيلا في الموسم، وريح.
    ويستحق التوقف عند المساء، حين يهبط الضباب على السهل ويبقى أعلى الجدار وحده مضاءً.


    الجدار نفسه يستحق أن يُفهم. إنه لوح من الحجر الجيري الطباشيري ارتفع وانحنى على طول حافة سلسلة راتشا،
    وقاعدته مثقوبة بالكهوف والينابيع — الصخر ذاته الذي يصنع كارست أوكريبا غرباً. وخلف الحافة تستوي الأرض
    مرجاً: تُساق المواشي إلى هنا صيفاً ويُحصد التبن. في يونيو يمتلئ المرج بالأزهار البرية، ومع أواخر أغسطس
    يكون قد جفّ واصفرّ.
  tip: >-
    ساعة للتوقف، وثلاث إلى أربع إن مشيت نحو تسخراجفاري. الريح تهب على الممر شبه دائماً والحرارة أدنى بنحو
    عشر درجات من كوتايسي، فخذ سترة حتى في الصيف. والغيوم تهبط بسرعة وقد يختفي المنظر في دقائق. ولا ماء
    على المسار. تُبقى الطريق مفتوحة شتاءً، لكن الثلج والجليد يتطلبان إطارات شتوية وشيئاً من الخبرة، وتُوقف
    الحركة أثناء العواصف الثلجية.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم شمالاً عبر ترجولا وتكيبولي نحو أمبرولاوري — نحو 255 كم إجمالاً
    وأربع ساعات. بعد تكيبولي يصعد الطريق بلا انقطاع نحو عشرين كيلومتراً بمنعطفات ضيقة؛ والسطح إسفلت وبحالة
    جيدة عموماً. تزوّد بالوقود في زستافوني أو تكيبولي، فلا محطة بين الممر وأمبرولاوري. وفي الجو الجاف
    تكفي سيارة اقتصادية.
