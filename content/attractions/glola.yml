ka:
  name: გლოლა
  short: >-
    სოფელი ჭანჭახის ხეობაში, შოვიდან 5 კილომეტრით ქვემოთ: მყინვარის ჩამოტანილი სახლისოდენა ლოდები და კლდოვან
    კონცხზე ციხე-ქალაქის ნანგრევები.
  body: >-
    **გლოლაში ორი ლოდია, მყინვარს რომ დაუტოვებია, თითოეული ორსართულიანი სახლის ოდენა — და ერთი მათგანი
    ვიღაცის ეზოში დგას.**


    სოფელი ზღვის დონიდან დაახლოებით 1280 მეტრზე, რიონის მარცხენა შენაკადის, ჭანჭახის ნაპირებზეა გაშენებული,
    იქ, სადაც მას კავკასიონის მთავარი ქედიდან ჩამომავალი ბოყოსწყალი ერთვის. ონიდან გზით 26 კილომეტრია,
    კურორტ შოვამდე კი — 5. ექვსიოდე კილომეტრით ქვემოთ, საგლოლოსთან, ჭიორისა და ღებისკენ მიმავალი გზა რიონის
    ხეობას მიჰყვება; ვინც შოვისკენ ან უძირო ტბის ბილიკისკენ მიდის, გლოლას გვერდს ვერ აუვლის.


    ეს ერატიკული ლოდებია — გრანიტი, რომელიც ბოყოს ხეობის ძველმა მყინვარმა მთავარი ქედიდან უკანასკნელი
    ან უკანასკნელისწინა გამყინვარების დროს ჩამოათრია. ორი უდიდესის ზომები დაახლოებით 11 × 13 × 12 და 18
    × 10 × 12 მეტრია; გლოლის ლოდები საქართველოს წითელ წიგნშია შეტანილი.


    გლოლა XV საუკუნის ალექსანდრე მეფის სიგელშია მოხსენიებული, XVIII საუკუნეში კი ვახუშტი ბაგრატიონი მას
    ციხესავით ნაგებ, კოშკებითა და გალავნით შემოზღუდულ დაბად აღწერს, ეკლესიით, რომელიც ძველთაგანვე აქ დახიზნული
    ოქრო-ვერცხლის ხატებით, ჯვრებითა და წიგნებით იყო სავსე. ძველ და ახალ გლოლას შორის აღმართულ კლდოვან
    კონცხზე, რომელსაც ადგილობრივები ზედაქალაქს უწოდებენ, ციხისა და ორი ეკლესიის ნანგრევებია; მათგან დიდი,
    წმინდა გიორგისა, სუფთად გათლილი მოყვითალო შირიმის კვადრებითაა შემოსილი და მოხატულობის კვალი დღემდე
    ატყვია. 1911 წელს გლოლაში 754 ადამიანი ცხოვრობდა, 2014 წელს — 279.


    ეს ხეობა დღესაც მოძრაობს. 2023 წლის 3 აგვისტოს ბუბის ხეობის სათავეში ჩამოშლილმა კლდემ და მყინვარის
    ყინულმა ღვარცოფი დაძრა, რომელმაც შოვში 32 ადამიანი იმსხვერპლა, ერთი კი დღემდე დაკარგულად ითვლება.
    ზედაქალაქზე ადით და მიხვდებით, ძველმა მშენებლებმა ეს ადგილი რატომ აირჩიეს: ჭანჭახის ხეობის ყველა გზა
    აქედან ხელისგულივით ჩანს.
  tip: >-
    ერთი-ორი საათი საკმარისია, თუ ლაშქრობას არ იწყებთ. უდიდესი ლოდი სოფელში იკითხეთ: ის კერძო ეზოში დგას,
    ამიტომ, თუ არ დაგპატიჟებენ, ქუჩიდან დაათვალიერეთ. ზედაქალაქი ციცაბო კლდოვანი კონცხია — მყარი ფეხსაცმელი
    ჩაიცვით და გზა ადგილობრივებს ჰკითხეთ. ბანკომატი, აფთიაქი და საწვავი არ არის, მაღაზია კი, საუკეთესო
    შემთხვევაში, ერთი პატარაა, ამიტომ ყველაფერი ონში მოიმარაგეთ. ღამის გასათევი და კვება სასტუმრო სახლში
    წინასწარ შეათანხმეთ. ძლიერი წვიმის შემდეგ ადგილობრივთა გაფრთხილებას ყური ათხოვეთ: ამ ხეობაში ღვარცოფი
    თეორია არ არის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით, შ17-ით ნაქერალას უღელტეხილი
    გადაიარეთ ამბროლაურამდე და შ16-ით რიონს ონამდე აჰყევით (დაახლოებით 295 კმ). შემდეგ შ16-ით უწერაზე
    გაიარეთ; დაახლოებით 20 კილომეტრში, საგლოლოსთან, სადაც შ121 ჭიორისა და ღებისკენ იტოტება, მარჯვნივ დარჩით
    და ბოლო 6 კილომეტრი ჭანჭახის ხეობით აიარეთ. სულ დაახლოებით 320 კმ, ხუთნახევრიდან ექვს საათამდე. გზა
    ახლანდელი რუკებით ასფალტიანია, მაგრამ ვიწრო და ქვათაცვენისგან დაზიანებული; გონივრული არჩევანი მაღალი
    გამავლობის მანქანაა. ონის შემდეგ საწვავი აღარ არის, ზამთარში კი გზას თოვლმა შეიძლება ჩაკეტოს.
en:
  name: Glola
  short: >-
    A village on the Chanchakhi, 5 km below Shovi, with glacier-borne boulders as big as houses and a
    ruined citadel on a rocky crag.
  body: >-
    **Glola keeps two boulders that a glacier left behind, each as big as a two-storey house, and one
    of them sits in somebody's yard.**


    The village lies at about 1,280 metres on the Chanchakhi, a left-bank tributary of the Rioni, where
    the Boqostsqali comes down from the main Caucasus ridge. It is 26 km by road above Oni and 5 km below
    the resort of Shovi. Six kilometres downstream, at Saglolo, the road to Chiora and Ghebi branches
    off along the Rioni; anyone bound for Shovi or the trail to Lake Udziro passes through Glola.


    The boulders are erratics: granite dragged off the main ridge by the old glacier of the Boqo valley
    during the last or the penultimate ice age. The two largest measure roughly 11 × 13 × 12 and 18 ×
    10 × 12 metres, and they are listed in Georgia's Red Book.


    A 15th-century charter of King Alexander names Glola, and in the 18th century Vakhushti Bagrationi
    described a settlement built like a fortress, with towers and walls and a church full of gold and
    silver icons, crosses and books brought there long before for safekeeping. On the crag between old
    and new Glola, which locals call Zedakalaki, the "upper town", lie the ruins of the fortress and two
    churches; the larger, St George's, is faced with neatly cut yellowish tufa and still shows traces
    of painting. Glola had 754 inhabitants in 1911 and 279 in 2014.


    This valley is still moving. On 3 August 2023 a collapse of rock and glacier ice at the head of the
    Buba sent a debris flow into Shovi, killing 32 people; one more was never found. Climb Zedakalaki
    and you will see why the old builders chose it: every road up the Chanchakhi lies in plain view.
  tip: >-
    An hour or two, unless you are starting a hike. Ask in the village for the biggest boulder; it stands
    in a private yard, so admire it from the lane unless you are invited in. Zedakalaki is a steep rocky
    headland, so wear proper shoes and ask the way. There is no ATM, pharmacy or fuel, and at most a small
    shop, so come supplied from Oni. Arrange a guesthouse bed and meals in advance. After heavy rain take
    local warnings seriously: in this valley mudflows are not theoretical.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km, turn north between Zestaponi and Kutaisi on
    the Sh19 through Terjola to Tkibuli, cross the Nakerala pass on the Sh17 to Ambrolauri and follow
    the Sh16 up the Rioni to Oni (about 295 km). Stay on the Sh16 through Utsera; after about 20 km, at
    Saglolo, keep right where the Sh121 branches off to Chiora and Ghebi, and climb the last 6 km up the
    Chanchakhi. About 320 km in all, five and a half to six hours. The road is asphalt on current maps
    but narrow and scarred by rockfall; an SUV is the sensible choice. No fuel beyond Oni, and snow can
    close the road in winter.
ru:
  name: Глола
  short: >-
    Село на Чанчахи, в 5 км ниже Шови: принесённые ледником валуны размером с дом и руины цитадели на
    скалистом утёсе.
  body: >-
    **Глола хранит два валуна, оставленных ледником, — каждый величиной с двухэтажный дом, и один из них
    лежит у кого-то во дворе.**


    Село стоит на высоте около 1280 метров на Чанчахи, левом притоке Риони, там, где с Главного Кавказского
    хребта спускается Бокосцкали. По дороге оно в 26 км выше Они и в 5 км ниже курорта Шови. В шести километрах
    ниже по течению, у Саглоло, вдоль Риони ответвляется дорога на Чиору и Геби; кто едет в Шови или на
    тропу к озеру Удзиро, проезжает через Глолу.


    Валуны — эрратические: гранит, который древний ледник долины Боко стащил с Главного хребта в последнее
    или предпоследнее оледенение. Два крупнейших имеют размеры примерно 11 × 13 × 12 и 18 × 10 × 12 метров;
    они внесены в Красную книгу Грузии.


    Глолу упоминает грамота царя Александра XV века, а в XVIII веке Вахушти Багратиони описал поселение,
    выстроенное как крепость, с башнями и стенами, и церковь, полную золотых и серебряных икон, крестов
    и книг, свезённых сюда на хранение задолго до того. На утёсе между старой и новой Глолой, который
    местные называют Зедакалаки, «верхний город», лежат руины крепости и двух церквей; бо́льшая, церковь
    Святого Георгия, облицована аккуратно тёсанным желтоватым известковым туфом и до сих пор хранит следы
    росписи. В 1911 году в Глоле жили 754 человека, в 2014-м — 279.


    Эта долина до сих пор в движении. 3 августа 2023 года обвал скал и ледникового льда в верховьях Бубы
    обрушил на Шови селевой поток: погибли 32 человека, ещё одного так и не нашли. Поднимитесь на Зедакалаки,
    и станет ясно, почему старые строители выбрали это место: каждая дорога вверх по Чанчахи видна отсюда
    как на ладони.
  tip: >-
    Хватит часа-двух, если только вы не начинаете здесь поход. Спросите в селе, где самый большой валун:
    он стоит в частном дворе, так что любуйтесь им с улицы, если вас не пригласят войти. Зедакалаки —
    крутой скалистый мыс: нужна нормальная обувь, дорогу спросите у местных. Банкомата, аптеки и заправки
    нет, в лучшем случае маленький магазин, так что запаситесь всем в Они. О ночлеге в гостевом доме и
    еде договоритесь заранее. После сильных дождей относитесь к местным предупреждениям всерьёз: сели
    в этой долине — не теория.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север на Sh19
    и через Терджолу доезжайте до Ткибули, по Sh17 через перевал Накерала — в Амбролаури, затем по Sh16
    вверх по Риони до Они (около 295 км). Оставайтесь на Sh16, минуя Уцеру; примерно через 20 км, у Саглоло,
    держитесь правее там, где Sh121 уходит на Чиору и Геби, и поднимитесь последние 6 км вдоль Чанчахи.
    Всего около 320 км, от пяти с половиной до шести часов. По нынешним картам дорога асфальтирована,
    но узкая и изрезана следами камнепадов; разумный выбор — внедорожник. За Они заправок нет, а зимой
    снег может перекрыть дорогу.
fa:
  name: گلولا
  short: >-
    روستایی بر رود چانچاخی، ۵ کیلومتر پایین‌تر از شووی، با تخته‌سنگ‌هایی به بزرگی خانه که یخچال آورده
    و ویرانهٔ ارگی بر فراز صخره‌ای بلند.
  body: >-
    **گلولا دو تخته‌سنگ را نگه داشته که یخچالی کهن بر جا گذاشته، هر یک به بزرگی خانه‌ای دوطبقه، و یکی‌شان
    در حیاط خانهٔ کسی افتاده است.**


    روستا در ارتفاع حدود ۱۲۸۰ متر بر چانچاخی، شاخابهٔ چپ ریونی، قرار دارد، جایی که بوقوستسقالی از رشته‌کوه
    اصلی قفقاز پایین می‌آید. از راه جاده ۲۶ کیلومتر بالاتر از اونی و ۵ کیلومتر پایین‌تر از استراحتگاه
    شووی است. شش کیلومتر پایین‌تر، در ساگلولو، جادهٔ چیورا و غبی از این مسیر جدا می‌شود و ریونی را دنبال
    می‌کند؛ هر که به شووی یا به کوره‌راه دریاچهٔ اودزیرو برود، از گلولا می‌گذرد.


    این تخته‌سنگ‌ها سنگ‌های سرگردانِ یخچالی‌اند: گرانیتی که یخچال کهن درهٔ بوقو در آخرین یا یکی مانده
    به آخرین عصر یخبندان از رشته‌کوه اصلی کَند و با خود آورد. دو تای بزرگ‌ترشان تقریباً ۱۱ × ۱۳ × ۱۲ و
    ۱۸ × ۱۰ × ۱۲ متر اندازه دارند و در کتاب سرخ گرجستان ثبت شده‌اند.


    فرمانی از شاه الکساندر در سدهٔ پانزدهم از گلولا نام می‌برد، و در سدهٔ هجدهم واخوشتی باگراتیونی از
    سکونتگاهی نوشت که چون دژ ساخته شده بود، با برج‌ها و باروها، و کلیسایی آکنده از شمایل‌های زرین و سیمین،
    صلیب‌ها و کتاب‌هایی که از دیرباز برای نگهداری به آنجا آورده بودند. بر صخره‌ای میان گلولای کهنه و نو،
    که اهالی آن را زداکالاکی، یعنی «شهر بالا»، می‌نامند، ویرانه‌های دژ و دو کلیسا افتاده است؛ بزرگ‌ترشان،
    کلیسای گئورگی قدیس، با توفِ آهکیِ زردفام و خوش‌تراش روکار شده و هنوز ردّ نقاشی دیواری را در خود دارد.
    شمار ساکنان گلولا در سال ۱۹۱۱ به ۷۵۴ نفر می‌رسید و در سال ۲۰۱۴ به ۲۷۹ نفر.


    این دره هنوز آرام نگرفته است. در ۳ اوت ۲۰۲۳ ریزش سنگ و یخ یخچال در سرچشمهٔ بوبا سیلابی از گِل و سنگ
    را به شووی فرستاد و ۳۲ نفر را کشت؛ یک نفر دیگر هرگز پیدا نشد. از زداکالاکی بالا بروید تا ببینید چرا
    سازندگان کهن اینجا را برگزیدند: هر راهی که از درهٔ چانچاخی بالا می‌آید پیش چشمتان است.
  tip: >-
    یکی دو ساعت کافی است، مگر اینکه بخواهید از اینجا پیاده‌روی را آغاز کنید. در روستا سراغ بزرگ‌ترین تخته‌سنگ
    را بگیرید؛ در حیاطی خصوصی است، پس اگر دعوتتان نکردند از کوچه تماشایش کنید. زداکالاکی دماغه‌ای سنگی
    و پرشیب است؛ کفش مناسب بپوشید و راه را بپرسید. خودپرداز، داروخانه و پمپ‌بنزین نیست و دست‌بالا مغازه‌ای
    کوچک هست، پس از اونی آذوقه بیاورید. تخت در مهمان‌خانه و غذا را از پیش هماهنگ کنید. پس از باران‌های
    سنگین هشدارهای محلی را جدی بگیرید: در این دره سیلِ گِل و سنگ خطری نظری نیست، واقعی است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سوی غرب بروید، میان زستافونی و کوتائیسی به شمال بپیچید
    و از Sh19 و از میان ترجولا تا تکیبولی برانید، با Sh17 از گردنهٔ ناکرالا بگذرید تا آمبرولائوری و از
    Sh16 در امتداد ریونی تا اونی بالا بروید (حدود ۲۹۵ کیلومتر). روی Sh16 بمانید و از اوتسرا بگذرید؛ پس
    از حدود ۲۰ کیلومتر، در ساگلولو، جایی که Sh121 به سوی چیورا و غبی جدا می‌شود، به راست بمانید و ۶ کیلومتر
    پایانی را در امتداد چانچاخی بالا بروید. روی‌هم حدود ۳۲۰ کیلومتر، پنج ساعت و نیم تا شش ساعت. بنابر
    نقشه‌های کنونی جاده آسفالت است، اما باریک و زخم‌خورده از ریزش سنگ؛ خودروی شاسی‌بلند انتخاب عاقلانه
    است. پس از اونی پمپ‌بنزینی نیست و در زمستان برف ممکن است جاده را ببندد.
he:
  name: גלולה
  short: כפר על הצ'אנצ'אחי, 5 ק"מ מתחת לשובי, עם סלעי ענק בגודל בית שהביא קרחון ושרידי מצודה על צוק סלעי.
  body: >-
    **בגלולה שמורים שני סלעים שהשאיר אחריו קרחון, כל אחד בגודל של בית בן שתי קומות, ואחד מהם עומד בחצר
    של מישהו.**


    הכפר שוכן בגובה של כ-1,280 מטר על נהר הצ'אנצ'אחי, יובל שמאלי של הריוני, במקום שבו הבוקוסצקלי יורד
    מן הרכס הראשי של הקווקז. בכביש הוא נמצא 26 ק"מ במעלה העמק מאוני ו-5 ק"מ במורד מאתר הנופש שובי. שישה
    קילומטרים במורד הזרם, בסגלולו, מתפצלת לאורך הריוני הדרך לצ'יורה ולגבי; כל מי שנוסע לשובי או לשביל
    אל אגם אודזירו עובר בגלולה.


    הסלעים הם סלעים נודדים: גרניט שקרחון עמק בוקו הקדום גרר מן הרכס הראשי בתקופת הקרח האחרונה או בזו שלפניה.
    שני הגדולים שבהם מגיעים לכ-11 × 13 × 12 ו-18 × 10 × 12 מטר, והם רשומים בספר האדום של גאורגיה.


    תעודה מלכותית של המלך אלכסנדר מהמאה ה-15 מזכירה את גלולה, ובמאה ה-18 תיאר וחושטי בגרטיוני יישוב הבנוי
    כמבצר, עם מגדלים וחומות, וכנסייה מלאה איקונות של זהב וכסף, צלבים וספרים שהובאו אליה לשמירה זמן רב
    קודם לכן. על הצוק שבין גלולה הישנה לחדשה, שהמקומיים קוראים לו זדקלקי, "העיר העליונה", שוכנות חורבות
    המבצר ושתי כנסיות; הגדולה שבהן, כנסיית גאורגיוס הקדוש, מצופה באבני טוף גירי צהבהבות מסותתות בקפידה,
    ועדיין ניכרים בה שרידי ציורי קיר. ב-1911 חיו בגלולה 754 תושבים, וב-2014 – 279.


    העמק הזה עדיין בתנועה. ב-3 באוגוסט 2023 קריסת סלע וקרח קרחון בראש עמק הבובה שלחה זרם בוץ ופסולת אל
    שובי, ו-32 בני אדם נהרגו; אדם נוסף לא נמצא מעולם. טפסו אל זדקלקי ותבינו מדוע בחרו בו הבונים של פעם:
    כל דרך במעלה הצ'אנצ'אחי פרושה משם לעין.
  tip: >-
    שעה או שעתיים, אלא אם אתם יוצאים מכאן למסלול הליכה. שאלו בכפר היכן הסלע הגדול ביותר; הוא עומד בחצר
    פרטית, אז התפעלו ממנו מהסמטה, אלא אם הוזמנתם פנימה. זדקלקי הוא לשון סלע תלולה, אז נעלו נעליים מתאימות
    ושאלו על הדרך. אין כספומט, בית מרקחת או תחנת דלק, לכל היותר חנות קטנה, לכן הצטיידו באוני. סגרו מראש
    מיטה בבית הארחה וארוחות. אחרי גשם כבד קחו ברצינות את האזהרות המקומיות: בעמק הזה שטפונות בוץ אינם תאוריה.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) כ-190 ק"מ, פנו צפונה בין זסטפוני לקוטאיסי לכביש Sh19 דרך טרג'ולה עד
    טקיבולי, חצו את מעבר נקרלה בכביש Sh17 עד אמברולאורי, ומשם עלו בכביש Sh16 לאורך הריוני עד אוני (כ-295
    ק"מ). הישארו על Sh16 דרך אוצרה; אחרי כ-20 ק"מ, בסגלולו, היכן שכביש Sh121 מתפצל לצ'יורה ולגבי, המשיכו
    ימינה ועלו את 6 הקילומטרים האחרונים לאורך הצ'אנצ'אחי. בסך הכול כ-320 ק"מ, חמש וחצי עד שש שעות. לפי
    המפות העדכניות הכביש סלול, אבל צר ומצולק ממפולות סלעים; רכב שטח הוא הבחירה הנבונה. אחרי אוני אין תחנות
    דלק, ובחורף שלג עלול לחסום את הדרך.
ar:
  name: غلولا
  short: >-
    قرية على نهر تشانتشاخي، على بعد 5 كم أسفل شوفي، فيها جلاميد بحجم البيوت حملها نهر جليدي، وأطلال قلعة
    فوق جرف صخري.
  body: >-
    **تحتفظ غلولا بصخرتين عملاقتين خلّفهما نهر جليدي، كلٌّ منهما بحجم بيت من طابقين، وإحداهما قائمة في
    فناء أحد السكان.**


    تقع القرية على ارتفاع نحو 1280 متراً على نهر تشانتشاخي، الرافد الأيسر لريوني، حيث ينحدر نهر بوقوستسقالي
    من سلسلة القوقاز الرئيسية. وهي على بعد 26 كم بالطريق أعلى الوادي من أوني، و5 كم أسفل منتجع شوفي. وعلى
    بعد ستة كيلومترات مع مجرى النهر، عند ساغلولو، يتفرّع على امتداد ريوني الطريقُ إلى تشيورا وغيبي؛ وكل
    من يقصد شوفي أو درب بحيرة أودزيرو يمرّ بغلولا.


    هذه الصخور جلاميد ضالّة: غرانيت جرّه النهر الجليدي القديم لوادي بوقو من السلسلة الرئيسية في العصر
    الجليدي الأخير أو الذي سبقه. تبلغ أبعاد أكبر اثنين منها نحو 11 × 13 × 12 و18 × 10 × 12 متراً، وهي
    مدرجة في الكتاب الأحمر لجورجيا.


    يرد ذكر غلولا في براءة للملك ألكسندر من القرن الخامس عشر، وفي القرن الثامن عشر وصف فاخوشتي باغراتيوني
    مستوطنةً مبنية كالحصن، بأبراج وأسوار، وكنيسةً ملأى بالأيقونات الذهبية والفضية والصلبان والكتب التي
    نُقلت إليها قبل زمن بعيد لحفظها. وعلى الجرف الواقع بين غلولا القديمة والجديدة، الذي يسميه الأهالي
    زيداكالاكي أي «المدينة العليا»، ترقد أطلال الحصن وكنيستين؛ كبراهما، كنيسة القديس جاورجيوس، مكسوّة
    بحجر التوفا الكلسي المصفرّ المنحوت بعناية، ولا تزال تحمل آثار رسوم جدارية. وكان في غلولا 754 نسمة
    عام 1911، و279 عام 2014.


    هذا الوادي لم يهدأ بعد. ففي 3 أغسطس 2023 أرسل انهيار صخري وجليدي في أعالي وادي بوبا سيلاً من الطين
    والحطام إلى شوفي، فقتل 32 شخصاً، وما زال شخص آخر في عداد المفقودين. اصعد إلى زيداكالاكي وسترى لماذا
    اختار البنّاؤون القدامى هذا الموضع: فكل طريق صاعد في وادي تشانتشاخي مكشوف أمام عينيك.
  tip: >-
    تكفي ساعة أو ساعتان، إلا إذا كنت تبدأ رحلة مشي من هنا. اسأل في القرية عن أكبر الصخور؛ فهي في فناء
    خاص، فتأمّلها من الزقاق ما لم تُدعَ إلى الدخول. زيداكالاكي لسان صخري شديد الانحدار، فانتعل حذاءً مناسباً
    واسأل عن الطريق. لا صراف آلي ولا صيدلية ولا محطة وقود، وفي أحسن الأحوال متجر صغير، فتزوّد بما تحتاجه
    من أوني. رتّب المبيت في بيت ضيافة والوجبات مسبقاً. وبعد الأمطار الغزيرة خذ التحذيرات المحلية بجدّية:
    فالسيول الطينية في هذا الوادي ليست احتمالاً نظرياً.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى Sh19 عبر
    ترجولا حتى تكيبولي، واعبر ممر ناكيرالا على Sh17 إلى أمبرولاوري، ثم اصعد على Sh16 مع ريوني حتى أوني
    (نحو 295 كم). ابقَ على Sh16 مروراً بأوتسيرا؛ وبعد نحو 20 كم، عند ساغلولو، التزم اليمين حيث يتفرّع
    Sh121 نحو تشيورا وغيبي، واصعد الكيلومترات الستة الأخيرة مع تشانتشاخي. المجموع نحو 320 كم، أي خمس ساعات
    ونصف إلى ست ساعات. الطريق مُعبَّد وفق الخرائط الحالية، لكنه ضيق وتشوّهه الانهيارات الصخرية؛ وسيارة
    الدفع الرباعي هي الخيار الحكيم. لا وقود بعد أوني، وقد يغلق الثلج الطريق في الشتاء.
