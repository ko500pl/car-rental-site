ka:
  name: გლოლა
  short: ზემო რაჭის უკანასკნელი დიდი სოფელი, სადაც გზა შოვისა და ღების მიმართულებებად იყოფა.
  body: >-
    **გლოლა ის წერტილია, სადაც ზემო რაჭა ორად იყოფა.** სოფელი დაახლოებით ათას სამას მეტრზე დგას, იქ, სადაც
    ჭანჭახის ხეობა რიონს უერთდება: ერთი გზა ჭანჭახის ხეობით შოვისკენ ადის, მეორე ჩრდილო-დასავლეთით, რიონის
    ზემო წელზე, ჭიორასა და ღებისკენ. ვისაც ზემო რაჭაში სიღრმეში მიდის, გლოლა ყველას გაივლის.


    სოფელი დიდია რაჭული მასშტაბით — რამდენიმე ასეული მცხოვრები ზაფხულში, ბევრად ნაკლები ზამთარში. სახლები
    ფერდობზეა გაშლილი, ქვის ცოკოლებით და ხის ზედა სართულებით, ეზოებში თივის ზვინები და კაკლის ხეები. ეკლესია
    სოფლის ზემოთაა და აქედან ხეობა ორივე მიმართულებით მოჩანს.


    გლოლა ორმაგად დაზარალდა. 1991 წლის მიწისძვრამ ზემო რაჭაში სახლების დიდი ნაწილი დაანგრია და მოსახლეობის
    გადინება დაიწყო; 2023 წლის 3 აგვისტოს კი შოვის ხეობაში ჩამოწოლილმა ღვარცოფმა ხეობის გზა და ინფრასტრუქტურა
    მძიმედ დააზიანა. ეს ხეობა აქტიურია — ღვარცოფი და ქვათაცვენა აქ რეალური რისკია და არა თეორიული.


    ამის მიუხედავად, გლოლა ლამაზი და ცოცხალი ადგილია. ალპური მდელოები სოფლის ზემოთ იწყება, სამხრეთით რაჭის
    ქედია, ჩრდილოეთით კი კავკასიონის მთავარი ქედის კბილები, ნათელ დღეს დანათლული. აქედან ბილიკები ადის
    შოდას ტბებისკენ და ჭანჭახის ხეობისკენ.


    სოფელში ორიოდე ოჯახური გესტჰაუსია და პატარა მაღაზია. კვება წინასწარ უნდა შეათანხმო. ივნისიდან სექტემბრამდე
    აქ ხალხია; ოქტომბრის შემდეგ სოფელი იცლება და გზა თოვლს ემორჩილება.


    ერთი პრაქტიკული დეტალი, რომელიც გლოლას მნიშვნელოვნად ხდის: აქ იყოფა არა მარტო გზა, არამედ სეზონიც.
    შოვის მხარე ივნისის შუიდან იხსნება და ოქტომბრამდე რჩება გასავლელი; ჭიორისა და ღების მიმართულება უფრო
    გვიან იხსნება და უფრო ადრე იკეტება. ადგილობრივები ამას ზუსტად იციან და ეს ინფორმაცია რუკაზე არსად
    წერია — ამიტომ სოფელში გაჩერება და კითხვა უფრო სასარგებლოა, ვიდრე ნავიგატორის ნდობა.
  tip: >-
    ერთი-ორი საათი გლოლისთვის საკმარისია, თუ ლაშქრობას არ იწყებ. აქ ბოლო ადგილია, სადაც პატარა მაღაზიაა
    — შემდეგ ღებამდე არაფერია. ბანკომატი, აფთიაქი და საწვავი არ არსებობს. გესტჰაუსში ღამე და კვება წინასწარ
    შეათანხმე, ადგილზე მისვლა რისკია. მობილური კავშირი არასტაბილურია. წვიმის შემდეგ ხეობის გზა შეიძლება
    დროებით დაიხუროს ჩამონაშალის გამო — გასვლამდე ადგილობრივებს ჰკითხე მდგომარეობა.
  route: >-
    ონიდან აღმოსავლეთით რიონის ხეობით უწერაზე გავლით — ოცდაათიოდე კილომეტრი, ერთი საათი. თბილისიდან სულ
    386 კმ, დაახლოებით შვიდი საათი. ონის შემდეგ ასფალტი ფრაგმენტულია და ბოლო კილომეტრებში თითქმის მთლიანად
    იკარგება: ორმოები, ჩამონაშალი ქვა, ვიწრო მონაკვეთები მდინარის თავზე. SUV-ს ან კროსოვერს აქ ნამდვილი
    აზრი აქვს. ბოლო ავტოგასამართი ამბროლაურშია, ონში ხანდახან მუშაობს. ნოემბრიდან მაისამდე გზა ხშირად
    დახურულია.
en:
  name: Glola
  short: >-
    The last large village of Upper Racha, where the road splits towards Shovi in one direction and Ghebi
    in the other.
  body: >-
    **Glola is the point at which Upper Racha divides in two.** The village stands at about 1,300 metres
    where the Chanchakhi valley joins the Rioni: one road continues up the Chanchakhi to Shovi, the other
    turns north-west along the upper Rioni to Chiora and Ghebi. Anyone going deeper into these mountains
    passes through here.


    By Racha standards Glola is a big place — a few hundred people in summer, far fewer in winter. The
    houses are spread across the slope, stone at the base and timber above, with haystacks and walnut
    trees in the yards. The church stands above the village, and from there both arms of the valley are
    visible at once.


    Glola has been hit twice. The 1991 earthquake destroyed a great many houses across Upper Racha and
    started an exodus that never reversed. Then on 3 August 2023 a debris flow came down the Shovi valley
    and did severe damage to the road and the infrastructure above the village. This is an active valley:
    mudflow and rockfall are a real risk here, not a theoretical one.


    Despite that, Glola is a handsome and living place. Alpine meadows begin immediately above the houses,
    the Racha range closes the view to the south, and to the north the teeth of the Greater Caucasus main
    ridge appear on clear days. Trails lead from here towards the Shoda lakes and up the Chanchakhi.


    The village has two or three family guesthouses and a small shop. Meals need to be arranged in advance.
    From June to September there are people about; after October it empties and the road gives way to
    snow.


    One practical detail makes Glola matter: what divides here is not only the road but the season. The
    Shovi side opens from about the middle of June and stays passable into October; the Chiora and Ghebi
    arm opens later and closes earlier. Local people know the dates precisely, and none of it appears
    on any map — which is why stopping in the village and asking is more useful than trusting a navigation
    app.
  tip: >-
    An hour or two covers Glola unless you are starting a hike. This is the last place with even a small
    shop — after it there is nothing until Ghebi. There is no ATM, no pharmacy and no fuel. Arrange a
    bed and meals at a guesthouse in advance; simply turning up is a gamble. Mobile coverage is patchy.
    After heavy rain the valley road can close temporarily because of slides, so ask locally about conditions
    before setting out.
  route: >-
    From Oni head east up the Rioni through Utsera — about thirty kilometres, an hour. From Tbilisi the
    total is 386 km, roughly seven hours. Beyond Oni the asphalt is intermittent and in the last kilometres
    largely disappears: potholes, fallen stone, and narrow sections cut above the river. An SUV or crossover
    genuinely earns its keep here. The last reliable filling station is at Ambrolauri; the one in Oni
    works only sometimes. From November to May the road is often closed.
ru:
  name: Глола
  short: 'Последнее крупное село Верхней Рачи, где дорога расходится: одна ветка на Шови, другая на Геби.'
  body: >-
    **Глола — точка, в которой Верхняя Рача раздваивается.** Село стоит примерно на 1300 метрах там, где
    ущелье Чанчахи выходит к Риони: одна дорога уходит вверх по Чанчахи к Шови, другая поворачивает на
    северо-запад по верхнему Риони, к Чиоре и Геби. Все, кто едет вглубь этих гор, проезжают здесь.


    По рачинским меркам Глола велика — несколько сотен человек летом и намного меньше зимой. Дома разбросаны
    по склону, камень внизу, дерево наверху, во дворах стога и ореховые деревья. Церковь стоит выше села,
    и оттуда видны сразу оба рукава ущелья.


    Глоле досталось дважды. Землетрясение 1991 года разрушило множество домов по всей Верхней Раче и запустило
    отток населения, который так и не обратился вспять. А 3 августа 2023 года по ущелью Шови сошёл сель,
    тяжело повредивший дорогу и инфраструктуру выше села. Это активное ущелье: сели и камнепады здесь
    реальный, а не теоретический риск.


    И всё же Глола красива и жива. Альпийские луга начинаются прямо над домами, с юга вид замыкает Рачинский
    хребет, а с севера в ясные дни встают зубцы Главного Кавказского хребта. Отсюда идут тропы к озёрам
    Шода и вверх по Чанчахи.


    В селе два-три семейных гостевых дома и небольшой магазин. Питание нужно оговаривать заранее. С июня
    по сентябрь здесь есть люди; после октября село пустеет, а дорогу забирает снег.


    Одна практическая деталь делает Глолу важной: здесь расходится не только дорога, но и сезон. Сторона
    Шови открывается примерно с середины июня и остаётся проезжей до октября; ветка на Чиору и Геби открывается
    позже и закрывается раньше. Местные знают эти сроки точно, и ни на одной карте этого нет — поэтому
    остановиться в селе и спросить полезнее, чем доверять навигатору.
  tip: >-
    Часа-двух на Глолу хватит, если вы не начинаете здесь поход. Это последнее место, где есть хотя бы
    маленький магазин, — дальше до Геби нет ничего. Ни банкомата, ни аптеки, ни заправки. Ночлег и еду
    в гостевом доме оговаривайте заранее, приезжать наудачу рискованно. Мобильная связь неустойчивая.
    После сильного дождя дорога по ущелью может временно закрыться из-за оползней, так что уточняйте обстановку
    у местных перед выездом.
  route: >-
    Из Они на восток по долине Риони через Уцеру — около тридцати километров, час. От Тбилиси всего 386
    км, примерно семь часов. После Они асфальт идёт кусками, а на последних километрах почти исчезает:
    ямы, осыпавшийся камень, узкие участки над рекой. Внедорожник или кроссовер здесь оправдывают себя
    вполне. Последняя надёжная заправка — в Амбролаури, в Они она работает не всегда. С ноября по май
    дорога часто закрыта.
fa:
  name: گلولا
  short: 'آخرین روستای بزرگ راچای بالا، جایی که جاده به دو شاخه می‌شود: یکی به شووی و دیگری به غبی.'
  body: >-
    **گلولا همان نقطه‌ای است که راچای بالا در آن دو شاخه می‌شود.** روستا در حدود ۱۳۰۰ متری آنجا ایستاده
    که درّهٔ چانچاخی به ریونی می‌پیوندد: یک جاده در درّهٔ چانچاخی به سوی شووی بالا می‌رود و دیگری به شمال‌غرب
    و در امتداد ریونی بالا به سوی چیورا و غبی. هر که به عمق این کوه‌ها می‌رود از اینجا می‌گذرد.


    به معیار راچا گلولا بزرگ است؛ چند صد نفر در تابستان و بسیار کمتر در زمستان. خانه‌ها روی دامنه پخش
    شده‌اند، پایینشان سنگ و بالایشان چوب، و در حیاط‌ها کپه‌های علف خشک و درختان گردو. کلیسا بالای روستاست
    و از آنجا هر دو بازوی درّه یکجا دیده می‌شود.


    گلولا دو بار ضربه خورده است. زمین‌لرزهٔ ۱۹۹۱ شمار زیادی خانه را در سراسر راچای بالا ویران کرد و کوچی
    را آغاز کرد که هرگز برنگشت. سپس در سوم اوت ۲۰۲۳ سیلابی از گِل و سنگ در درّهٔ شووی فرود آمد و به جاده
    و تأسیسات بالای روستا آسیب سنگین زد. این درّه فعال است: سیلاب گِلی و ریزش سنگ اینجا خطری واقعی است،
    نه نظری.


    با این حال گلولا جایی زیبا و زنده است. چمنزارهای کوهستانی درست بالای خانه‌ها آغاز می‌شوند، رشته‌کوه
    راچا چشم‌انداز جنوب را می‌بندد، و در شمال در روزهای صاف دندانه‌های ستیغ اصلی قفقاز بزرگ پیدا می‌شوند.
    از اینجا مسیرهایی به سوی دریاچه‌های شودا و بالای چانچاخی می‌رود.


    در روستا دو سه خانهٔ مهمان خانوادگی و مغازه‌ای کوچک هست. غذا را باید از پیش هماهنگ کرد. از خرداد تا
    شهریور اینجا آدم هست؛ پس از مهر خالی می‌شود و جاده را برف می‌گیرد.


    یک نکتهٔ عملی گلولا را مهم می‌کند: آنچه اینجا دو شاخه می‌شود تنها جاده نیست، فصل هم هست. سمت شووی
    از حدود نیمهٔ خرداد باز می‌شود و تا مهر قابل عبور می‌ماند؛ شاخهٔ چیورا و غبی دیرتر باز و زودتر بسته
    می‌شود. اهالی این تاریخ‌ها را دقیق می‌دانند و هیچ‌کدام روی نقشه نیامده است؛ به همین سبب توقف در روستا
    و پرسیدن سودمندتر از اعتماد به نقشهٔ گوشی است.
  tip: >-
    یک تا دو ساعت برای گلولا کافی است، مگر آنکه از اینجا پیاده‌روی را آغاز کنید. این آخرین جایی است که
    حتی مغازه‌ای کوچک دارد؛ پس از آن تا غبی هیچ نیست. خودپرداز و داروخانه و پمپ بنزین وجود ندارد. جا و
    غذا را در خانهٔ مهمان از پیش هماهنگ کنید؛ سرزده رفتن قمار است. آنتن موبایل ناپایدار است. پس از باران
    سنگین ممکن است جادهٔ درّه به سبب ریزش موقتاً بسته شود، پس پیش از حرکت وضعیت را از اهالی بپرسید.
  route: >-
    از اونی به شرق در درّهٔ ریونی و از کنار اوتسرا — حدود سی کیلومتر، یک ساعت. از تفلیس در مجموع ۳۸۶ کیلومتر،
    تقریباً هفت ساعت. پس از اونی آسفالت تکه‌تکه است و در کیلومترهای پایانی تقریباً از میان می‌رود: چاله،
    سنگ ریخته، و بخش‌های باریک بریده‌شده بالای رودخانه. شاسی‌بلند یا کراس‌اور اینجا واقعاً به کار می‌آید.
    آخرین پمپ بنزین قابل اعتماد در آمبرولائوری است؛ آن یکی در اونی همیشه کار نمی‌کند. از آبان تا اردیبهشت
    جاده اغلب بسته است.
he:
  name: גלולה
  short: הכפר הגדול האחרון של ראצ'ה העליונה, שבו הדרך מתפצלת לשובי מכאן ולגבי מכאן.
  body: >-
    **גלולה היא הנקודה שבה ראצ'ה העליונה נחלקת לשניים.** הכפר עומד בגובה כ-1,300 מטר, במקום שבו עמק צ'אנצ'אחי
    נפגש עם הריוני: כביש אחד ממשיך במעלה הצ'אנצ'אחי לשובי, והשני פונה צפון-מערבה לאורך הריוני העליון אל
    צ'יורה וגבי. כל מי שנוסע אל עומק ההרים האלה עובר כאן.


    לפי מידות ראצ'ה גלולה היא מקום גדול — כמה מאות נפשות בקיץ, הרבה פחות בחורף. הבתים פרושים על המדרון,
    אבן למטה ועץ למעלה, ובחצרות ערימות שחת ועצי אגוז. הכנסייה ניצבת מעל הכפר, ומשם נראים שני זרועות העמק
    בבת אחת.


    גלולה ספגה פעמיים. רעידת האדמה של 1991 החריבה בתים רבים בכל ראצ'ה העליונה והתניעה יציאה שמעולם לא
    התהפכה. וב-3 באוגוסט 2023 ירד זרם בוץ ואבנים בעמק שובי ופגע קשות בכביש ובתשתיות שמעל הכפר. זהו עמק
    פעיל: זרימות בוץ ומפולות סלע הן כאן סיכון ממשי ולא תיאורטי.


    ולמרות זאת גלולה יפה וחיה. אחו אלפיני מתחיל מיד מעל הבתים, רכס ראצ'ה סוגר את הנוף מדרום, ומצפון מופיעות
    בימים בהירים שיני הרכס הראשי של הקווקז הגדול. מכאן יוצאים שבילים אל אגמי שודה ובמעלה הצ'אנצ'אחי.


    בכפר שניים-שלושה בתי הארחה משפחתיים וחנות קטנה. ארוחות יש לתאם מראש. מיוני עד ספטמבר יש כאן אנשים;
    אחרי אוקטובר הכפר מתרוקן והדרך נכנעת לשלג.


    פרט מעשי אחד עושה את גלולה לחשובה: מה שמתפצל כאן אינו רק הכביש אלא גם העונה. הצד של שובי נפתח בערך
    מאמצע יוני ונשאר עביר לתוך אוקטובר; הזרוע של צ'יורה וגבי נפתחת מאוחר יותר ונסגרת מוקדם יותר. המקומיים
    יודעים את התאריכים במדויק, ודבר מזה אינו מופיע בשום מפה — ולכן לעצור בכפר ולשאול מועיל יותר מלסמוך
    על אפליקציית ניווט.
  tip: >-
    שעה עד שעתיים מכסות את גלולה, אלא אם אתם מתחילים כאן מסלול הליכה. זה המקום האחרון שיש בו אפילו חנות
    קטנה — הלאה, עד גבי, אין דבר. אין כספומט, אין בית מרקחת ואין דלק. תאמו מראש לינה וארוחות בבית הארחה;
    להגיע סתם כך זה הימור. הקליטה הסלולרית חלקית. אחרי גשם כבד עלול כביש העמק להיסגר זמנית בגלל מפולות,
    לכן שאלו מקומיים על מצב הדרך לפני היציאה.
  route: >-
    מאוני מזרחה בעמק הריוני דרך אוצרה — כשלושים קילומטרים, שעה. מטביליסי הסך הכול 386 ק״מ, כשבע שעות.
    מעבר לאוני האספלט מקוטע ובקילומטרים האחרונים נעלם כמעט לחלוטין: בורות, אבנים שנשרו וקטעים צרים החצובים
    מעל הנהר. ג'יפ או רכב פנאי באמת משתלמים כאן. תחנת הדלק האמינה האחרונה היא באמברולאורי; זו שבאוני פועלת
    רק לפעמים. מנובמבר עד מאי הדרך סגורה לעיתים קרובות.
ar:
  name: غلولا
  short: آخر قرية كبيرة في راتشا العليا، حيث ينقسم الطريق فرعاً نحو شوفي وفرعاً نحو غيبي.
  body: >-
    **غلولا هي النقطة التي تنقسم عندها راتشا العليا إلى شطرين.** تقف القرية عند نحو 1300 متر حيث يلتقي
    وادي تشانتشاخي بريوني: طريق يصعد في وادي تشانتشاخي إلى شوفي، وآخر ينعطف شمالاً غرباً مع ريوني الأعلى
    إلى تشيورا وغيبي. وكل من يقصد عمق هذه الجبال يمرّ من هنا.


    وبمقاييس راتشا تُعدّ غلولا كبيرة: بضع مئات في الصيف وأقل من ذلك بكثير في الشتاء. البيوت منثورة على
    المنحدر، حجر في الأسفل وخشب في الأعلى، وفي الأفنية أكداس القش وأشجار الجوز. وتقف الكنيسة فوق القرية،
    ومنها يُرى ذراعا الوادي معاً.


    ضُربت غلولا مرتين. فزلزال 1991 هدم بيوتاً كثيرة في عموم راتشا العليا وبدأ نزوحاً لم ينعكس قط. ثم في
    الثالث من آب 2023 انحدر سيل من الطين والصخر في وادي شوفي فألحق ضرراً بالغاً بالطريق والمنشآت فوق القرية.
    هذا وادٍ نشط: السيول الطينية وسقوط الصخور خطر واقعي هنا لا نظري.


    ومع ذلك تبقى غلولا مكاناً جميلاً حياً. تبدأ المروج الألبية فوق البيوت مباشرة، وتغلق سلسلة راتشا المشهد
    من الجنوب، وتظهر من الشمال في الأيام الصافية أسنان السلسلة الرئيسية للقوقاز الكبير. ومن هنا تنطلق
    دروب نحو بحيرات شودا وصعوداً في تشانتشاخي.


    في القرية بيتا ضيافة عائليان أو ثلاثة ودكان صغير. ويلزم ترتيب الوجبات مسبقاً. من حزيران إلى أيلول
    يوجد ناس هنا؛ وبعد تشرين الأول تفرغ القرية ويأخذ الثلج الطريق.


    تفصيل عملي واحد يجعل لغلولا أهميتها: ما ينقسم هنا ليس الطريق وحده بل الموسم أيضاً. فجهة شوفي تُفتح
    من منتصف حزيران تقريباً وتبقى سالكة حتى تشرين الأول؛ أما ذراع تشيورا وغيبي فتُفتح متأخرة وتُغلق مبكرة.
    والأهالي يعرفون هذه المواعيد بدقة، ولا شيء منها مذكور في أي خريطة — ولهذا فالتوقف في القرية والسؤال
    أنفع من الوثوق بتطبيق الملاحة.
  tip: >-
    ساعة إلى ساعتين تكفيان لغلولا ما لم تبدأ منها مسيراً جبلياً. هذا آخر موضع فيه ولو دكان صغير؛ وبعده
    لا شيء حتى غيبي. لا صراف آلي ولا صيدلية ولا وقود. رتّب المبيت والطعام في بيت ضيافة مسبقاً، فالوصول
    على غير موعد مجازفة. تغطية الهاتف متقطعة. وبعد مطر غزير قد يُغلق طريق الوادي مؤقتاً بسبب الانزلاقات،
    فاسأل الأهالي عن الحال قبل الانطلاق.
  route: >-
    من أوني شرقاً في وادي ريوني مروراً بأوتسيرا — نحو ثلاثين كيلومتراً، ساعة. ومن تبليسي المجموع 386 كم،
    أي نحو سبع ساعات. بعد أوني يصير الإسفلت متقطعاً ويكاد يزول في الكيلومترات الأخيرة: حفر وحجارة متساقطة
    ومقاطع ضيقة محفورة فوق النهر. وسيارة الدفع الرباعي أو العبور تستحق ثمنها هنا فعلاً. آخر محطة وقود
    يُعتمد عليها في أمبرولاوري، أما التي في أوني فتعمل أحياناً فقط. ومن تشرين الثاني إلى أيار يكون الطريق
    مغلقاً في الغالب.
