ka:
  name: არუხლოს ნეოლითური ნამოსახლარი
  short: >-
    ხუთი ბალახიანი ბორცვი ხრამისა და მაშავერას შესართავთან: ძვ. წ. 5800–5400 წლებში აქ ცხოვრობდნენ მიწათმოქმედები,
    კავკასიაში სპილენძის ადრეული დამმუშავებლები.
  body: >-
    **არუხლოში სანახავი მხოლოდ მიწაა — მიწა, რომელიც თითქმის რვა ათასი წლის წინ ოთხი საუკუნის სოფლურმა
    ცხოვრებამ ექვსი მეტრით ასწია.**


    არუხლო ხუთი ბორცვის ჯგუფია სოფელ ნახიდურთან, ხრამისა და მაშავერას შესართავთან ახლოს, თბილისიდან სამხრეთ-დასავლეთით
    დაახლოებით 50 კილომეტრში. ეს შულავერ-შომუთეფეს კულტურის — სამხრეთ კავკასიის უძველესი ცნობილი მიწათმოქმედი
    კულტურის — ყველაზე დასავლეთით მდებარე ძეგლია. რვა კილომეტრში მისი მონათესავე ბორცვებია — იმირის გორა,
    შულავრის გორა და ხრამის დიდი გორა — და ეს ნამოსახლარები ერთად დაახლოებით 800 ჰექტარს მოიცავს.


    მთავარ ბორცვზე, არუხლო I-ზე, ძვ. წ. დაახლოებით 5800-დან 5400 წლამდე ცხოვრობდნენ. მშენებლები პატარა
    მრგვალ ნაგებობებს აგებდნენ — ზოგი იმდენად მცირეა, რომ არქეოლოგები მათ საცხოვრებლად კი არა, სათავსოდ
    მიიჩნევენ — და საკუთარ ნანგრევებზე ისევ და ისევ აშენებდნენ, სანამ ნამოსახლარი ველზე ექვსი მეტრით არ
    ამაღლდა. გათხრები 1966–1985 წლებში მიმდინარეობდა, 2005 წლიდან კი ქართულ-გერმანული ექსპედიციით განახლდა.


    აღმოჩენებს შორისაა ძვ. წ. 5800–5300 წლებით დათარიღებული სპილენძის მძივის ნატეხები და სამი პატარა ჭურჭელი
    სპილენძის ნაშთებით, რომლებსაც გამთხრელები სადნობ ჭურჭლად მიიჩნევენ. ეს კავკასიაში ლითონის დამუშავების
    ერთ-ერთი უადრესი კვალია — მეზობელი აზერბაიჯანის გოითეფესა და მენთეშ-თეფესთან ერთად.


    მერე სიჩუმე ჩამოდგება. ძვ. წ. დაახლოებით 5400–5300 წლების შემდეგ არუხლო და მისი მონათესავე ნამოსახლარები
    ცარიელდება და რამდენიმე საუკუნის განმავლობაში მთელ მხარეში სოფლის კვალი არ ჩანს. რატომ — ამაზე მეცნიერები
    დღემდე დაობენ.


    დღეს მინდვრებს შორის დაბალ, ბალახით დაფარულ ბორცვს ნახავთ — არც წარწერა, არც ღობე, არც ბილეთი. მაინც
    ადით: ფეხქვეშ კავკასიის პირველ მიწათმოქმედთა სახლების იატაკები გაქვთ.
  tip: >-
    ძეგლი ღიაა და უფასო; არც ნიშანი აქვს, არც ღობე, არც სადგომი ან საპირფარეშო. კოორდინატებით იხელმძღვანელეთ
    (41.4533, 44.6957) და ნახიდურში ჰკითხეთ: ბოლო მონაკვეთი მინდვრის გზებზე გადის, ბორცვებს კი სოფლელები
    კარგად იცნობენ. ნათესების კიდეებს მიჰყევით, მოსავალზე მანქანით არ გადაიაროთ და თიხის ნატეხი, თუ შეგხვდათ,
    იქვე დატოვეთ — ადგილს მოწყვეტილი, ის აღარაფერს მოგვითხრობს. დილის ან საღამოს დახრილი მზე ბორცვების
    რელიეფს ამოკვეთს; ზაფხულის შუადღე კი ცხელი და უჩრდილოა. არქეოლოგი-მეგზური ბალახიან გორას ამბად აქცევს.
    დღე მარნეულითა და ბოლნისის სიონით შეავსეთ — ორივე 10–12 კილომეტრშია.
  route: >-
    თბილისიდან მარნეულის გზატკეცილით (ს6) სამხრეთით, ქვემო ქართლის ვაკის გავლით, მარნეულამდე იარეთ. იქიდან
    იმავე ს6-ით დასავლეთით კიდევ დაახლოებით ათი კილომეტრი გაიარეთ ნახიდურამდე და სოფლის ქუჩებზე მარცხნივ
    გადაუხვიეთ: მთავარი ბორცვი, არუხლო I, დაახლოებით 1,5 კილომეტრში, სოფლის სამხრეთ კიდეზე, ხრამისა და
    მაშავერას შესართავის მიმართულებით მდებარეობს. სულ დაახლოებით 48 კმ და ერთი საათი. სოფლამდე ასფალტია,
    ბოლო მონაკვეთი კი მოუნიშნავ მინდვრის გზებზე გადის — ზაფხულში მტვრიანია, წვიმის შემდეგ ტალახიანი. მშრალ
    ამინდში ეკონომ-კლასის მანქანა საკმარისია; გზის პირას, სადაც ამის საშუალებაა, გაჩერდით და ბოლო მეტრები
    ფეხით გაიარეთ. საწვავი მარნეულში ჩაასხით.
en:
  name: Arukhlo Neolithic Settlement
  short: >-
    Five grassy mounds near the Khrami–Mashavera confluence where farmers lived c. 5800–5400 BC and worked
    some of the Caucasus's earliest copper.
  body: >-
    **There is nothing to see at Arukhlo but the ground itself — ground raised six metres by four centuries
    of village life nearly eight thousand years ago.**


    Arukhlo is a cluster of five mounds beside the village of Nakhiduri, near the confluence of the Khrami
    and Mashavera rivers, about 50 km south-west of Tbilisi. It is the westernmost site of the Shulaveri–Shomutepe
    culture, the earliest known farming culture of the South Caucasus. Eight kilometres away lie its sister
    mounds — Imiris Gora, Shulaveri Gora and Khramis Didi Gora — and together these settlements spread
    over some 800 hectares.


    The main mound, Arukhlo I, was lived on from about 5800 to 5400 BC. Its builders put up small round
    buildings, some so small that archaeologists think they were stores rather than homes, and rebuilt
    them again and again on their own debris until the settlement stood six metres above the plain. Excavations
    ran from 1966 to 1985 and resumed in 2005 as a Georgian–German project.


    The finds include fragments of a copper bead dated to 5800–5300 BC and three small vessels with copper
    residue, read by the excavators as crucibles: some of the earliest evidence of metalworking in the
    Caucasus, alongside Göytepe and Mentesh Tepe in neighbouring Azerbaijan.


    Then comes silence. After about 5400–5300 BC Arukhlo and its sister sites fall empty, and for several
    centuries no village can be traced anywhere in the area. Why is still argued over.


    Today you will find a low grassy rise among fields, with no sign, fence or ticket. Climb it anyway:
    beneath your boots lie the floors of some of the first farmers of the Caucasus.
  tip: >-
    The site is free and open, with no sign, fence, parking or toilets. Navigate by the coordinates (41.4533,
    44.6957) and ask in Nakhiduri: the final approach is on farm tracks, and villagers know the mounds.
    Keep to field edges, never drive across crops, and leave any potsherd exactly where it lies — out
    of context it tells nobody anything. Morning or evening sun brings out the relief of the mounds; summer
    middays are hot and shadeless. An archaeologist-guide turns a grassy hill into a story. Marneuli and
    Bolnisi Sioni, 10–12 km away, round out the day.
  route: >-
    Leave Tbilisi on the S6 Marneuli highway and follow it south across the Kvemo Kartli plain to Marneuli.
    From there stay on the S6 west for about ten kilometres to Nakhiduri, then turn left into the village
    lanes: the main mound, Arukhlo I, lies about 1.5 km on, at the southern edge of the village, towards
    the Khrami–Mashavera confluence. In all it is about 48 km and an hour. The road is asphalt as far
    as the village; the last stretch runs on unmarked farm tracks, dusty in summer and sticky after rain.
    An economy car is enough in dry weather — pull over where the track allows and walk the final metres.
    Refuel in Marneuli.
ru:
  name: Неолитическое поселение Арухло
  short: >-
    Пять травянистых холмов у слияния Храми и Машаверы, где около 5800–5400 гг. до н. э. жили земледельцы
    — одни из первых на Кавказе, кто работал с медью.
  body: >-
    **В Арухло нечего смотреть, кроме самой земли — земли, которую почти восемь тысяч лет назад четыре
    столетия деревенской жизни подняли на шесть метров.**


    Арухло — группа из пяти холмов у села Нахидури, у слияния рек Храми и Машавера, примерно в 50 км к
    юго-западу от Тбилиси. Это самый западный памятник шулавери-шомутепинской культуры — древнейшей известной
    земледельческой культуры Южного Кавказа. В восьми километрах отсюда лежат родственные ему холмы —
    Имирис-Гора, Шулаверис-Гора и Храмис-Диди-Гора, — и вместе эти поселения занимают около 800 гектаров.


    Главный холм, Арухло I, был обитаем примерно с 5800 по 5400 год до н. э. Его строители возводили небольшие
    круглые постройки — некоторые настолько маленькие, что археологи считают их скорее кладовыми, чем
    жилищами, — и снова и снова отстраивали их на собственных руинах, пока поселение не поднялось на шесть
    метров над равниной. Раскопки шли с 1966 по 1985 год и возобновились в 2005-м как грузино-германский
    проект.


    Среди находок — фрагменты медной бусины, датированной 5800–5300 годами до н. э., и три небольших сосуда
    со следами меди, которые исследователи определили как тигли: одни из самых ранних свидетельств металлообработки
    на Кавказе наряду с Гёйтепе и Ментеш-Тепе в соседнем Азербайджане.


    Потом наступает тишина. Примерно после 5400–5300 годов до н. э. Арухло и родственные ему поселения
    пустеют, и на несколько столетий во всей округе не прослеживается ни одной деревни. Почему — спорят
    до сих пор.


    Сегодня вы увидите лишь невысокий травянистый бугор среди полей — ни указателя, ни ограды, ни билетов.
    И всё же поднимитесь на него: под вашими ботинками лежат полы жилищ одних из первых земледельцев Кавказа.
  tip: >-
    Вход свободный, место открыто; указателей, ограды, парковки и туалетов нет. Прокладывайте маршрут
    по координатам (41.4533, 44.6957) и спрашивайте дорогу в Нахидури: последний подъезд идёт по полевым
    дорогам, а местные жители знают эти холмы. Держитесь края полей, никогда не заезжайте на посевы и
    оставляйте любой черепок ровно там, где он лежит: вырванный из контекста, он никому ничего не расскажет.
    Утреннее или вечернее солнце проявляет рельеф холмов; летом в полдень здесь жарко и негде укрыться
    от солнца. Гид-археолог превратит травянистый холм в историю. Марнеули и Болнисский Сиони в 10–12
    км отсюда дополнят день.
  route: >-
    Выезжайте из Тбилиси по трассе S6 на Марнеули и следуйте по ней на юг через Квемо-Картлийскую равнину
    до самого Марнеули. Оттуда ещё около десяти километров на запад по той же S6 до Нахидури, затем сверните
    налево на сельские улицы: главный холм, Арухло I, лежит примерно в 1,5 км, на южной окраине села,
    в сторону слияния Храми и Машаверы. Всего около 48 км и час пути. До села — асфальт; последний отрезок
    идёт по полевым дорогам без каких-либо указателей, пыльным летом и вязким после дождя. В сухую погоду
    хватит машины эконом-класса — остановитесь, где позволяет дорога, и последние метры пройдите пешком.
    Заправьтесь в Марнеули.
fa:
  name: سکونتگاه نوسنگی آروخلو
  short: >-
    پنج تپهٔ پوشیده از علف نزدیک محل تلاقی رودهای خرامی و ماشاورا، جایی که کشاورزان حدود ۵۸۰۰ تا ۵۴۰۰
    پیش از میلاد می‌زیستند و از نخستین مس‌کاران قفقاز بودند.
  body: >-
    **در آروخلو چیزی جز خود زمین برای دیدن نیست — زمینی که چهار سده زندگی روستایی، نزدیک به هشت هزار سال
    پیش، آن را شش متر بالا آورده است.**


    آروخلو مجموعه‌ای از پنج تپه است در کنار روستای ناخیدوری، نزدیک محل تلاقی رودهای خرامی و ماشاورا و
    حدود ۵۰ کیلومتری جنوب‌غربی تفلیس. این غربی‌ترین محوطهٔ فرهنگ شولاوری–شوموتپه است، کهن‌ترین فرهنگ کشاورزی
    شناخته‌شده در قفقاز جنوبی. در هشت کیلومتری آن تپه‌های هم‌خانواده‌اش قرار دارند — ایمیریس گورا، شولاوریس
    گورا و خرامیس دیدی گورا — و این سکونتگاه‌ها روی‌هم حدود ۸۰۰ هکتار را در بر می‌گیرند.


    تپهٔ اصلی، آروخلو I، از حدود ۵۸۰۰ تا ۵۴۰۰ پیش از میلاد مسکونی بود. سازندگانش بناهای گرد و کوچکی برپا
    می‌کردند — برخی چنان کوچک که باستان‌شناسان آنها را انبار می‌دانند نه خانه — و بارها و بارها آنها را
    بر آوار خودشان از نو می‌ساختند، تا جایی که سکونتگاه شش متر از دشت بالاتر ایستاد. کاوش‌ها از ۱۹۶۶ تا
    ۱۹۸۵ ادامه داشت و در ۲۰۰۵ در قالب طرحی مشترک گرجی–آلمانی از سر گرفته شد.


    در میان یافته‌ها تکه‌هایی از یک مهرهٔ مسی است که به ۵۸۰۰ تا ۵۳۰۰ پیش از میلاد تاریخ‌گذاری شده، و سه
    ظرف کوچک با پس‌ماندهٔ مس که کاوشگران آنها را بوته‌های ذوب فلز دانسته‌اند: از کهن‌ترین شواهد فلزکاری
    در قفقاز، در کنار گوی‌تپه و منتش‌تپه در جمهوری آذربایجانِ همسایه.


    سپس سکوت از راه می‌رسد. پس از حدود ۵۴۰۰ تا ۵۳۰۰ پیش از میلاد، آروخلو و محوطه‌های هم‌خانواده‌اش خالی
    می‌شوند و تا چند سده در هیچ جای این ناحیه ردی از روستایی نمی‌توان یافت. چرایی آن هنوز محل بحث است.


    امروز تنها برآمدگی کم‌ارتفاع و علف‌پوشی میان کشتزارها خواهید دید، بی تابلو، بی حصار، بی بلیت. با این
    همه از آن بالا بروید: زیر پایتان کف خانه‌های برخی از نخستین کشاورزان قفقاز خفته است.
  tip: >-
    ورود رایگان و آزاد است؛ نه تابلو هست، نه حصار، نه پارکینگ، نه سرویس بهداشتی. با مختصات (۴۱٫۴۵۳۳, ۴۴٫۶۹۵۷)
    مسیریابی کنید و در ناخیدوری سراغ بگیرید: رسیدن نهایی از راه‌های کشاورزی است و اهالی روستا تپه‌ها را
    می‌شناسند. از حاشیهٔ کشتزارها بروید، هرگز با خودرو از روی کشت نگذرید و هر سفال‌پاره‌ای را درست همان‌جا
    که افتاده رها کنید — بیرون از بافتش هیچ چیزی به هیچ‌کس نمی‌گوید. آفتاب صبح یا عصر برجستگی تپه‌ها را
    نمایان می‌کند؛ نیمروزهای تابستان داغ و بی‌سایه است. یک راهنمای باستان‌شناس از تپه‌ای علفی داستانی
    می‌سازد. مارنئولی و بولنیسی سیونی، در ۱۰ تا ۱۲ کیلومتری، روزتان را کامل می‌کنند.
  route: >-
    از تفلیس با بزرگراه S6 به سوی مارنئولی بیرون بروید و آن را از میان دشت کومو کارتلی به سمت جنوب تا
    مارنئولی دنبال کنید. از آنجا حدود ده کیلومتر دیگر در همان S6 به غرب تا ناخیدوری بروید و سپس به چپ،
    به کوچه‌های روستا بپیچید: تپهٔ اصلی، آروخلو I، حدود ۱٫۵ کیلومتر جلوتر، در لبهٔ جنوبی روستا و به سوی
    محل تلاقی خرامی و ماشاورا قرار دارد. روی‌هم حدود ۴۸ کیلومتر و یک ساعت. جاده تا روستا آسفالت است؛ تکهٔ
    آخر از راه‌های کشاورزی بی‌نشان می‌گذرد که تابستان خاک‌آلود و پس از باران چسبناک است. در هوای خشک خودروی
    اقتصادی کافی است — هر جا راه اجازه داد کنار بزنید و چند متر پایانی را پیاده بروید. در مارنئولی سوخت
    بگیرید.
he:
  name: היישוב הנאוליתי ארוחלו
  short: >-
    חמישה תלים מכוסי עשב ליד מפגש הנהרות חראמי ומשאוורה, שבהם חיו חקלאים בערך בין 5800 ל-5400 לפנה"ס —
    מן הראשונים בקווקז שעיבדו נחושת.
  body: >-
    **בארוחלו אין מה לראות מלבד האדמה עצמה — אדמה שארבע מאות שנות חיי כפר, לפני כמעט שמונת אלפים שנה,
    הגביהו בשישה מטרים.**


    ארוחלו הוא מקבץ של חמישה תלים בצמוד לכפר נחידורי, סמוך למפגש הנהרות חראמי ומשאוורה, כ-50 ק"מ דרומית-מערבית
    לטביליסי. זהו האתר המערבי ביותר של תרבות שולאוורי–שומוטפה, תרבות החקלאים הקדומה ביותר הידועה בדרום
    הקווקז. במרחק שמונה קילומטרים שוכנים התלים-האחים שלו — אימיריס גורה, שולאווריס גורה וחראמיס דידי גורה
    — ויחד משתרעים היישובים האלה על פני כ-800 הקטאר.


    התל הראשי, ארוחלו I, היה מיושב בערך מ-5800 עד 5400 לפנה"ס. בוניו הקימו מבנים עגולים קטנים — חלקם קטנים
    כל כך שהארכאולוגים סבורים שהיו מחסנים ולא בתי מגורים — ובנו אותם שוב ושוב על ההריסות של עצמם, עד שהיישוב
    התנשא שישה מטרים מעל המישור. החפירות נמשכו מ-1966 עד 1985 וחודשו ב-2005 כפרויקט גאורגי–גרמני.


    בין הממצאים שברי חרוז נחושת המתוארך ל-5800–5300 לפנה"ס ושלושה כלים קטנים עם שאריות נחושת, שהחופרים
    פירשו ככורי היתוך: מן העדויות המוקדמות ביותר לעיבוד מתכת בקווקז, לצד גויטפה ומנטש טפה באזרבייג'ן השכנה.


    ואז משתררת דממה. אחרי 5400–5300 לפנה"ס בערך מתרוקנים ארוחלו והאתרים-האחים שלו, ובמשך כמה מאות שנים
    אי אפשר לאתר שום כפר בכל האזור. מדוע — על כך עדיין חלוקות הדעות.


    היום תמצאו גבעה נמוכה מכוסת עשב בין השדות, בלי שלט, בלי גדר ובלי כרטיס. טפסו עליה בכל זאת: מתחת לנעליכם
    שוכנות רצפות בתיהם של כמה מן החקלאים הראשונים של הקווקז.
  tip: >-
    הכניסה חופשית והאתר פתוח, ואין בו שלט, גדר, חניה או שירותים. נווטו לפי הקואורדינטות (41.4533, 44.6957)
    ושאלו בנחידורי: הגישה האחרונה עוברת בדרכי שדות, ותושבי הכפר מכירים את התלים. הקפידו ללכת בשולי השדות,
    לעולם אל תיסעו דרך גידולים, והשאירו כל חרס בדיוק במקום שבו הוא מונח — מחוץ להקשרו הוא אינו מספר דבר
    לאיש. שמש הבוקר או הערב מבליטה את קווי המתאר של התלים; צהרי הקיץ חמים וחסרי צל. מדריך ארכאולוג הופך
    גבעת עשב לסיפור. מרנאולי ובולניסי סיוני, במרחק 10–12 ק"מ, ישלימו את היום.
  route: >-
    צאו מטביליסי בכביש S6 לכיוון מרנאולי וסעו בו דרומה לרוחב מישור קוומו קרתלי עד מרנאולי. משם המשיכו
    באותו כביש S6 מערבה כעשרה קילומטרים עד נחידורי, ופנו שמאלה אל דרכי הכפר: התל הראשי, ארוחלו I, נמצא
    כ-1.5 ק"מ משם, בשוליו הדרומיים של הכפר, לכיוון מפגש החראמי והמשאוורה. בסך הכול כ-48 ק"מ ושעת נסיעה.
    הכביש סלול עד הכפר; הקטע האחרון עובר בדרכי שדות לא מסומנות, מאובקות בקיץ ודביקות אחרי גשם. במזג אוויר
    יבש מספיק רכב חסכוני — עצרו בצד היכן שהדרך מאפשרת ולכו את המטרים האחרונים ברגל. תדלקו במרנאולי.
ar:
  name: مستوطنة أروخلو النيوليتية
  short: >-
    خمسة تلال معشوشبة قرب ملتقى نهري خرامي وماشافيرا، عاش فيها مزارعون نحو 5800–5400 ق.م. وكانوا من أوائل
    من شغّل النحاس في القوقاز.
  body: >-
    **لا شيء يُرى في أروخلو سوى الأرض نفسها — أرضٍ رفعتها أربعة قرون من حياة القرية ستة أمتار قبل نحو
    ثمانية آلاف عام.**


    أروخلو مجموعة من خمسة تلال تقع بجوار قرية ناخيدوري، قرب ملتقى نهري خرامي وماشافيرا، على بعد نحو 50
    كم جنوب غربي تبليسي. وهي أقصى مواقع ثقافة شولافيري–شوموتيبي غرباً، وهي أقدم ثقافة زراعية معروفة في
    جنوب القوقاز. وعلى بعد ثمانية كيلومترات تقع تلالها الشقيقة — إيميريس غورا وشولافيريس غورا وخراميس
    ديدي غورا — وتمتد هذه المستوطنات معاً على نحو 800 هكتار.


    سُكن التل الرئيسي، أروخلو I، من نحو 5800 إلى 5400 ق.م. شيّد سكّانه مباني مستديرة صغيرة، بعضها صغير
    إلى حد أن علماء الآثار يرجّحون أنها كانت مخازن لا مساكن، وأعادوا بناءها مرة بعد مرة فوق أنقاضها حتى
    ارتفعت المستوطنة ستة أمتار فوق السهل. استمرت التنقيبات من 1966 إلى 1985، ثم استؤنفت عام 2005 مشروعاً
    جورجياً–ألمانياً.


    ومن اللقى أجزاء من خرزة نحاسية تعود إلى 5800–5300 ق.م.، وثلاثة أوانٍ صغيرة عليها بقايا نحاس فسّرها
    المنقّبون بوصفها بواتق صهر: وهي من أقدم الأدلة على تشغيل المعادن في القوقاز، إلى جانب غويتيبي ومنتيش
    تيبي في أذربيجان المجاورة.


    ثم يحلّ الصمت. فبعد نحو 5400–5300 ق.م. تخلو أروخلو ومواقعها الشقيقة، ولا يمكن تتبّع أي قرية في المنطقة
    كلها طوال قرون عدة. ولا يزال سبب ذلك موضع جدل.


    ستجد اليوم رابية منخفضة معشوشبة بين الحقول، بلا لافتة ولا سياج ولا تذكرة. اصعدها مع ذلك: فتحت قدميك
    ترقد أرضيات بيوت بعضٍ من أوائل المزارعين في القوقاز.
  tip: >-
    الدخول مجاني والموقع مفتوح، بلا لافتات أو سياج أو موقف سيارات أو دورات مياه. استعن بالإحداثيات (41.4533,
    44.6957) واسأل في ناخيدوري: فالمقطع الأخير يمر بمسالك زراعية، وأهل القرية يعرفون التلال. التزم أطراف
    الحقول، ولا تقُد سيارتك عبر المزروعات أبداً، واترك أي كِسرة فخار في مكانها تماماً — فهي خارج سياقها
    لا تخبر أحداً بشيء. تُبرز شمس الصباح أو المساء تضاريس التلال؛ أما ظهائر الصيف فحارة بلا ظل. ودليلٌ
    من علماء الآثار يحوّل التل المعشوشب إلى حكاية. وتكمل مارنئولي وبولنيسي سيوني، على بعد 10–12 كم، يومك.
  route: >-
    اخرج من تبليسي على الطريق السريع S6 المؤدي إلى مارنئولي واتبعه جنوباً عبر سهل كفيمو كارتلي حتى مارنئولي.
    ومن هناك تابع على الطريق نفسه S6 نحو عشرة كيلومترات غرباً إلى ناخيدوري، ثم انعطف يساراً إلى دروب القرية:
    يقع التل الرئيسي، أروخلو I، على بعد نحو 1.5 كم عند الطرف الجنوبي للقرية، باتجاه ملتقى خرامي وماشافيرا.
    المسافة الإجمالية نحو 48 كم وساعة واحدة. الطريق معبّد حتى القرية؛ أما المقطع الأخير فيمر بمسالك زراعية
    بلا علامات، مغبرّة صيفاً ولزجة بعد المطر. تكفي سيارة اقتصادية في الطقس الجاف — توقّف جانباً حيث يسمح
    المسلك وامشِ الأمتار الأخيرة. تزوّد بالوقود في مارنئولي.
