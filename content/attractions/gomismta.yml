ka:
  name: გომისმთა
  short: >-
    ხის კოტეჯების ზაფხულის დაბა მესხეთის ქედზე, 2100 მეტრზე, საიდანაც გარიჟრაჟზე გურიის დაბლობი ხშირად
    ღრუბლების ზღვის ქვეშ ჩანს.
  body: >-
    **გარიჟრაჟზე გომისმთა ხშირად ამინდის ზემოთ დგას: გურიის დაბლობი თეთრი ღრუბლის იატაკის ქვეშ ქრება,
    კოტეჯები კი ქედზე ღუზაჩაშვებულ ნავებს ჰგავს.**


    კურორტი მესხეთის ქედის ჩრდილოეთ ფერდობზე, ბჟუჟის ხეობის ზემოთ, დაახლოებით 2100 მეტრზე მდებარეობს,
    ოზურგეთიდან 33 კილომეტრზე. სამხრეთ-დასავლეთიდან ნაძვნარ-სოჭნარი ეკვრის, ჩრდილო-აღმოსავლეთით კი ალპური
    მდელოები იშლება. ზაფხული გრილია, აგვისტოს საშუალო ტემპერატურა 13–18 გრადუსია, ზამთარში კი ყველაფერს
    თოვლი ფარავს.


    საუკუნეების განმავლობაში აქ საზაფხულო საძოვრები იყო. ისინი შემოქმედის მონასტერს ეკუთვნოდა და მწყემსები
    ბაჟს ცხვრით, ყველითა და პურით იხდიდნენ. 1829 წლიდან 1878 წლამდე რუსეთისა და ოსმალეთის საზღვარი ზემოთ,
    წყალგამყოფზე გადიოდა. ადგილს ნაფაცხვარი ერქვა. გადმოცემის თანახმად, მწყემსმა თუმანოვმა განუკურნებელი
    სენით შეპყრობილი ქალიშვილი მთაზე ამოიყვანა და გოგონა აქაურმა ჰაერმა განკურნა.


    1902 წელს აქ ოციოდე სახლი და სამი დუქანი იდგა. ოზურგეთიდან საავტომობილო გზა 1955 წელს გაიყვანეს; მაშინ
    აქ უკვე 500-მდე კოტეჯი იდგა და ყოველ ზაფხულს 4500–5000 დამსვენებელი ამოდიოდა. 1970 წლისთვის სახლების
    რიცხვმა 1000-ს მიაღწია, 1980-იან წლებში კი 1500-ს, თუმცა არც წყალსადენი იყო და არც ელექტროენერგია.


    საბჭოთა კავშირის დაშლის შემდეგ კურორტი დაკნინდა. 2010 წლიდან კი ისევ გამოცოცხლდა: გაჩნდა ზაფხულის
    დღესასწაული „გომისმთობა“ და მშენებლობის ისეთი ტალღა, რომ ბევრი რამ ნებართვის გარეშე აშენდა. 2021 წლიდან
    გომისმთა დაბაა, თუმცა აღწერით მუდმივი მოსახლე აქ არავინ ჰყავს.


    ყოველ ზაფხულს დაბა, სადაც არავინ ცხოვრობს, ისევ ივსება.
  tip: >-
    ღამე აქ დარჩით: ღრუბლების ზღვა დილის სანახაობაა, შუადღისთვის კი ღრუბელი ხშირად თავად მთას ეხვევა.
    თბილი ტანსაცმელი აგვისტოშიც წაიღეთ: ამ თვის საშუალო ტემპერატურა სულ 13–18 გრადუსია, ღამით კი უფრო
    ცივა. ჩვეულებრივი სასტუმროები არ არის, მხოლოდ საოჯახო სახლები და საქირავებელი კოტეჯები, ამიტომ შუა
    ზაფხულში ადგილი წინასწარ დაჯავშნეთ. საჭმელი და წყალი ოზურგეთში იყიდეთ, ზემოთ მაღაზია ცოტაა. დაახლოებით
    2500 მეტრზე მდებარე ჭინჭაოს ტბამდე ფეხით გასეირნებაც შეიძლება. მოგზაურობა ივნისის ბოლოდან სექტემბრის
    შუა რიცხვებამდე დაგეგმეთ: წლის დანარჩენ დროს გზას თოვლი კეტავს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე იარეთ, იქიდან ს12-ით ლანჩხუთამდე,
    შემდეგ კი ჯაპანის გავლით ოზურგეთამდე. ეს დაახლოებით 300 კმ ასფალტია. ოზურგეთიდან შ45-ს დაადექით, შემოქმედის
    გავლით ბჟუჟის ხეობაში შედით და ბოლო 33 კილომეტრი აღმა აიარეთ. რაც უფრო მაღლა ადიხართ, ასფალტი მით
    უფრო მწირდება, ზედა მონაკვეთი კი მოუასფალტებელი სამთო გზაა, წვიმის შემდეგ დაღარული და მოლიპული. აიღეთ
    მაღალი კლირენსის ჯიპი. სულ დაახლოებით 350 კმ გამოდის; გაითვალისწინეთ სულ ცოტა ექვსი საათი და თხუთმეტი
    წუთი. საწვავი ოზურგეთში ჩაასხით. ზოგი სანავიგაციო აპლიკაცია აჭარისა და გომისმთა–შუახევის ბილიკის გავლით
    გატარებთ; ამას ნუ დაუჯერებთ.
en:
  name: Gomismta
  short: >-
    A summer town of timber cottages at about 2,100 m on the Meskheti Range, where dawn often finds the
    Guria lowland drowned in cloud below.
  body: >-
    **At dawn Gomismta often stands above the weather: the Guria lowland disappears under a white floor
    of cloud, and the cottages ride the ridge like boats at anchor.**


    The resort sits at about 2,100 metres on the northern slope of the Meskheti Range, above the Bzhuzhi
    valley, 33 km by road from Ozurgeti. Spruce and fir close in from the south-west; alpine meadows open
    to the north-east. Summer is cool, with August averaging 13–18 °C, and winter buries everything in
    snow.


    For centuries this was summer grazing. The pastures belonged to Shemokmedi monastery, and shepherds
    paid for them in sheep, cheese and bread. From 1829 to 1878 the Russian–Ottoman border ran along the
    watershed above. The place was called Napatskhvari, literally 'where the huts stood'. Legend tells
    of a shepherd, Tumanov, who brought his incurably ill daughter up the mountain; the air, the story
    goes, healed her.


    By 1902 there were some twenty houses and three small shops. The road from Ozurgeti arrived in 1955,
    when about 500 cottages already stood here and 4,500–5,000 people came each summer. By 1970 there
    were 1,000 houses; by the 1980s, 1,500, still without piped water or mains electricity.


    After the Soviet collapse the resort decayed. Since 2010 it has revived with a summer festival, Gomismtoba,
    and a building rush so fast that much of it went up without permits. In 2021 Gomismta became a *daba*,
    a small town, although the census counts no permanent residents.


    Every summer, the town where nobody lives fills up again.
  tip: >-
    Stay the night: the cloud sea belongs to the early morning, and by midday cloud often wraps the mountain
    itself. Pack warm layers even in August: the month averages only 13–18 °C, and nights are colder still.
    Accommodation is guesthouses and rented cottages, with no conventional hotels; book ahead in high
    summer. Buy food and water in Ozurgeti, as shops up here are few. Chinchao Lake, at about 2,500 m,
    is close enough for a walk. Plan for late June to mid-September: the rest of the year snow closes
    the road.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then the S12 to Lanchkhuti and the
    road via Japana to Ozurgeti, about 300 km of asphalt. In Ozurgeti take the Sh45 through Shemokmedi
    into the Bzhuzhi valley and climb the last 33 km to Gomismta. The paving thins out as you climb, and
    the upper section is an unpaved mountain road, rutted and slippery after rain. Hire an SUV with proper
    ground clearance. In total it is about 350 km; allow at least six and a quarter hours. Fill up in
    Ozurgeti. Some navigation apps route you via Adjara and the Gomismta–Shuakhevi track; ignore them.
ru:
  name: Гомисмта
  short: >-
    Летний посёлок из деревянных домиков на высоте около 2100 м на Месхетском хребте, где рассвет часто
    застаёт низменность Гурии утонувшей в облаках.
  body: >-
    **На рассвете Гомисмта часто оказывается выше погоды: низменность Гурии исчезает под белым облачным
    настилом, а домики стоят на гребне, будто лодки на якоре.**


    Курорт расположен на высоте около 2100 метров на северном склоне Месхетского хребта, над долиной Бжужи,
    в 33 км по дороге от Озургети. С юго-запада подступают ели и пихты; на северо-востоке открываются
    альпийские луга. Лето здесь прохладное — в августе в среднем 13–18 °C, — а зима заваливает всё снегом.


    Веками это были летние пастбища. Они принадлежали монастырю Шемокмеди, и пастухи платили за них овцами,
    сыром и хлебом. С 1829 по 1878 год по хребту над ними проходила русско-турецкая граница. Место называлось
    Напацхвари — буквально «где стояли хижины». Легенда рассказывает о пастухе Туманове, который поднял
    на гору свою неизлечимо больную дочь; здешний воздух, гласит история, исцелил её.


    К 1902 году здесь стояло около двадцати домов и три небольшие лавки. Автодорогу из Озургети провели
    в 1955 году, когда тут уже стояло около 500 домиков и каждое лето приезжало 4500–5000 человек. К 1970
    году домов было 1000, к 1980-м — 1500, всё ещё без водопровода и электросети.


    После распада Союза курорт пришёл в упадок. С 2010 года он возрождается — здесь проводят летний фестиваль
    Гомисмтоба — и строят так поспешно, что немалая часть построек возведена без разрешений. В 2021 году
    Гомисмта получила статус дабы, то есть посёлка, хотя перепись не насчитывает здесь постоянных жителей.


    Каждое лето посёлок, где никто не живёт, снова наполняется людьми.
  tip: >-
    Останьтесь на ночь: море облаков — зрелище раннего утра, а к полудню туман часто укрывает саму гору.
    Берите тёплые вещи даже в августе: средняя температура месяца — лишь 13–18 °C, а ночи ещё холоднее.
    Жильё здесь — гостевые дома и съёмные домики, обычных гостиниц нет; бронируйте заранее в разгар лета.
    Еду и воду покупайте в Озургети — местных магазинов немного. Озеро Чинчао, на высоте около 2500 м,
    находится в пределах пешей прогулки. Планируйте поездку с конца июня до середины сентября: остальное
    время дорогу закрывает снег.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, минуя Кутаиси, до Самтредиа, затем по S12 до Ланчхути и дальше
    через Джапану до Озургети — около 300 км асфальта. В Озургети сверните на Sh45, через Шемокмеди, в
    долину Бжужи, и поднимайтесь последние 33 км до Гомисмты. С высотой асфальт постепенно сходит на нет,
    а верхний участок — немощёная горная дорога, разбитая и скользкая после дождя. Берите внедорожник
    с достаточным клиренсом. Всего около 350 км; закладывайте не менее шести с четвертью часов. Заправляйтесь
    в Озургети. Некоторые навигационные приложения прокладывают маршрут через Аджарию по грунтовке Гомисмта–Шуахеви
    — не следуйте им.
fa:
  name: گومیسمتا
  short: >-
    شهرکی تابستانی از کلبه‌های چوبی در ارتفاع حدود ۲۱۰۰ متری رشته‌کوه مسختی، جایی که سپیده‌دم اغلب دشت
    گوریا را در زیر دریایی از ابر غرق‌شده می‌یابد.
  body: >-
    **در سپیده‌دم، گومیسمتا اغلب بالاتر از آب‌وهوا می‌ایستد: دشت گوریا زیر کفی سپید از ابر ناپدید می‌شود
    و کلبه‌ها بر خطِ الرأس همچون قایق‌هایی لنگر انداخته به نظر می‌رسند.**


    این استراحتگاه در ارتفاع حدود ۲۱۰۰ متری، بر دامنهٔ شمالی رشته‌کوه مسختی و بالای درهٔ بژوژی، در ۳۳
    کیلومتری اوزورگتی از راه قرار دارد. از جنوب غربی، درختان نوئل و نراد به آن نزدیک می‌شوند؛ در شمال
    شرقی، چمنزارهای آلپی گشوده می‌شوند. تابستان خنک است، با میانگین ۱۳ تا ۱۸ درجه سانتی‌گراد در ماه اوت،
    و زمستان همه‌چیز را زیر برف دفن می‌کند.


    قرن‌ها این‌جا چراگاه تابستانی بود. این چراگاه‌ها متعلق به صومعهٔ شمکمدی بودند و چوپان‌ها بهای آن را
    با گوسفند، پنیر و نان می‌پرداختند. از سال ۱۸۲۹ تا ۱۸۷۸ مرز روسیه و عثمانی بر خط تقسیم آب بالای این‌جا
    کشیده می‌شد. این محل ناپاتسخواری نام داشت، به معنای لفظی «جایی که کلبه‌ها بودند». افسانه از چوپانی
    به نام تومانوف می‌گوید که دختر بیمار و درمان‌ناپذیرش را به کوه آورد؛ هوای این‌جا، بنا به روایت، او
    را شفا داد.


    تا سال ۱۹۰۲ حدود بیست خانه و سه مغازهٔ کوچک این‌جا بود. جادهٔ اوزورگتی در سال ۱۹۵۵ به این‌جا رسید،
    زمانی که حدود ۵۰۰ کلبه پیش‌تر برپا شده بود و هر تابستان ۴۵۰۰ تا ۵۰۰۰ نفر می‌آمدند. تا سال ۱۹۷۰، هزار
    خانه بود؛ تا دههٔ ۱۹۸۰، ۱۵۰۰ خانه، هنوز بدون آب لوله‌کشی یا برق سراسری.


    پس از فروپاشی شوروی، این استراحتگاه رو به ویرانی رفت. از سال ۲۰۱۰ با جشنوارهٔ تابستانی گومیسمتوبا
    دوباره جان گرفته و ساخت‌وسازی چنان شتابان در جریان است که بخش بزرگی از آن بدون پروانه بالا رفته است.
    در سال ۲۰۲۱ گومیسمتا به یک «دابا» — شهرک کوچک — تبدیل شد، هرچند سرشماری هیچ ساکن دائمی برای آن ثبت
    نمی‌کند.


    هر تابستان، شهرکی که هیچ‌کس در آن زندگی نمی‌کند، دوباره پر می‌شود.
  tip: >-
    شب را بمانید: دریای ابر متعلق به بامداد زود است، و تا نیمروز ابر اغلب خودِ کوه را نیز در بر می‌گیرد.
    حتی در اوت لایه‌های گرم همراه داشته باشید: میانگین این ماه تنها ۱۳ تا ۱۸ درجه است و شب‌ها سردتر نیز
    می‌شود. اقامتگاه‌ها خانه‌های مهمان و کلبه‌های اجاره‌ای‌اند، بدون هتل به معنای متعارف؛ در اوج تابستان
    پیشاپیش رزرو کنید. خوراک و آب را در اوزورگتی بخرید، چون مغازه‌های این‌جا کم‌اند. دریاچهٔ چینچائو،
    در ارتفاع حدود ۲۵۰۰ متری، برای پیاده‌روی نزدیک است. سفر را از اواخر ژوئن تا نیمهٔ سپتامبر برنامه‌ریزی
    کنید: باقی سال برف راه را می‌بندد.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب و از کنار کوتایسی تا سامتردیا در پیش بگیرید، سپس S12 را تا لانچخوتی
    و از آن‌جا راه جاپانا را تا اوزورگتی، در حدود ۳۰۰ کیلومتر آسفالت. در اوزورگتی به Sh45 بپیچید، از میان
    شمکمدی به درهٔ بژوژی، و آخرین ۳۳ کیلومتر را تا گومیسمتا بالا بروید. با بالا رفتن، آسفالت کم‌کم تمام
    می‌شود و بخش بالایی، راهی کوهستانی و خاکی است، چاله‌دار و پس از باران لیز. خودرویی شاسی‌بلند با ارتفاع
    کافی از سطح زمین کرایه کنید. در مجموع حدود ۳۵۰ کیلومتر است؛ حداقل شش ساعت و ربع در نظر بگیرید. در
    اوزورگتی باک را پر کنید. برخی اپلیکیشن‌های مسیریابی شما را از آجارا و مسیر گومیسمتا-شوآخوی می‌برند؛
    به آن‌ها اعتماد نکنید.
he:
  name: גומיסמטה
  short: עיירת קיט של בקתות עץ בגובה של כ-2,100 מ' על רכס מסחתי, שם השחר מוצא לרוב את שפלת גוריה טבועה
    בעננים מתחתיה.
  body: >-
    **עם עלות השחר עומדת גומיסמטה לא פעם מעל למזג האוויר: שפלת גוריה נעלמת מתחת לרצפת עננים לבנה, והבקתות
    רוכבות על הרכס כסירות עוגנות.**


    אתר הנופש שוכן בגובה של כ-2,100 מטר במדרון הצפוני של רכס מסחתי, מעל עמק בז'וז'י, 33 ק"מ בכביש מאוזורגתי.
    יערות אשוחית ואשוח סוגרים עליו מדרום-מערב; אחו אלפיני נפתח לצפון-מזרח. הקיץ קריר, עם ממוצע של 13–18°C
    באוגוסט, והחורף קובר הכל בשלג.


    במשך דורות היה זה מרעה קיץ. המרעה השתייך למנזר שמוקמדי, והרועים שילמו עליו בכבשים, בגבינה ובלחם. משנת
    1829 עד 1878 עבר הגבול הרוסי-עות'מאני על קו פרשת המים ממעל. המקום נקרא נאפצחוארי, פשוטו כמשמעו "מקום
    שהיו בו הבקתות". האגדה מספרת על רועה בשם טומנוב, שהעלה להר את בתו החולה במחלה חשוכת מרפא; האוויר כאן,
    כך מסופר, ריפא אותה.


    עד 1902 עמדו כאן כעשרים בתים ושלוש חנויות קטנות. הכביש מאוזורגתי הגיע ב-1955, כשכ-500 בקתות עמדו כבר
    במקום ו-4,500–5,000 בני אדם הגיעו כל קיץ. עד 1970 היו כאן 1,000 בתים; עד שנות ה-80, 1,500, עדיין בלי
    מים זורמים או חשמל מהרשת.


    אחרי קריסת ברית המועצות דעך האתר. מ-2010 הוא מתעורר לחיים עם פסטיבל קיץ, גומיסמטובה, וגל בנייה כה
    מהיר עד כי חלק גדול ממנו נבנה בלי היתרים. ב-2021 הפכה גומיסמטה ל"דאבה", עיירה קטנה, אף שהמפקד אינו
    סופר בה תושבים קבועים כלל.


    בכל קיץ מתמלאת שוב העיירה שאיש אינו גר בה.
  tip: >-
    הישארו כאן ללילה: ים העננים שייך לשעות הבוקר המוקדמות, וכבר בצהריים העננים עוטפים לא פעם את ההר עצמו.
    הביאו שכבות חמות אפילו באוגוסט: הממוצע החודשי הוא רק 13–18°C, והלילות קרים עוד יותר. הלינה כאן היא
    בבתי הארחה ובבקתות להשכרה, בלי בתי מלון במובן המקובל; הזמינו מקום מראש בשיא הקיץ. קנו מזון ומים באוזורגתי,
    כי החנויות כאן מעטות. אגם צ'ינצ'או, בגובה של כ-2,500 מ', קרוב מספיק להליכה. תכננו את הביקור מסוף יוני
    עד אמצע ספטמבר: בשאר השנה השלג סוגר את הדרך.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, ואז S12 עד לנצ'חוטי ומשם בדרך העוברת
    בג'אפנה עד אוזורגתי — כ-300 ק"מ אספלט. באוזורגתי פנו ל-Sh45 דרך שמוקמדי לעמק בז'וז'י, וטפסו את 33
    הק"מ האחרונים לגומיסמטה. עם הטיפוס האספלט מידלדל, והקטע העליון הוא דרך הררית לא סלולה, מלאה מהמורות
    וחלקלקה אחרי גשם. השכירו רכב שטח עם מרווח גחון גבוה. בסך הכל כ-350 ק"מ; הקצו לפחות שש שעות ורבע. תדלקו
    באוזורגתי. יש אפליקציות ניווט שמנתבות דרך אג'ריה ומסלול גומיסמטה-שואחווי — אל תלכו לפיהן.
ar:
  name: غوميسمتا
  short: >-
    بلدة صيفية من بيوت خشبية على ارتفاع نحو 2100 متر في سلسلة مسخيتي، حيث يجد الفجر غالبًا سهل غوريا غارقًا
    تحت الغيوم.
  body: >-
    **عند الفجر، تقف غوميسمتا غالبًا فوق الطقس نفسه: يختفي سهل غوريا تحت أرضية بيضاء من الغيوم، وترسو
    البيوت الخشبية على الحافة الجبلية كقوارب في مرساها.**


    يقع المنتجع على ارتفاع نحو 2100 متر على المنحدر الشمالي لسلسلة مسخيتي، فوق وادي بجوجي، على 33 كم بالطريق
    من أوزورغيتي. تحاصره أشجار التنوب والشوح من الجنوب الغربي؛ وتنفتح المروج الألبية إلى الشمال الشرقي.
    الصيف منعش، بمعدل يتراوح بين 13 و18 درجة مئوية في أغسطس، والشتاء يدفن كل شيء تحت الثلج.


    لقرون طويلة كانت هذه مراعي صيفية، مملوكة لدير شيموكميدي، وكان الرعاة يدفعون ثمنها بالخراف والجبن والخبز.
    من عام 1829 إلى 1878 كانت الحدود الروسية العثمانية تمر على خط تقسيم المياه أعلاه. كان الموضع يُعرف
    باسم نابتسخفاري، ومعناه الحرفي "حيث كانت الأكواخ". وتروي الأسطورة أن راعيًا يُدعى تومانوف صعد بابنته
    المصابة بداء عضال إلى الجبل؛ فشفاها هواء المكان، على ما تقول الحكاية.


    بحلول عام 1902 كان هناك نحو عشرين بيتًا وثلاثة متاجر صغيرة. وصل الطريق من أوزورغيتي عام 1955، حين
    كان نحو 500 كوخ قد بُني فعلًا، ويأتي كل صيف بين 4500 و5000 شخص. بحلول عام 1970 بلغ عدد البيوت 1000،
    وفي الثمانينيات 1500، وكانت لا تزال بلا شبكة مياه ولا كهرباء.


    بعد انهيار الاتحاد السوفيتي، تراجع المنتجع. ومنذ عام 2010 عاد إلى الحياة بمهرجان صيفي، غوميسمتوبا،
    وموجة بناء سريعة إلى حد أن كثيرًا منها شُيّد دون تراخيص. وفي عام 2021 صارت غوميسمتا "دابا"، أي بلدة
    صغيرة، مع أن التعداد لا يحصي فيها أي سكان دائمين.


    وفي كل صيف، تعود البلدة التي لا يسكنها أحد إلى الامتلاء من جديد.
  tip: >-
    اقضِ الليل هناك: بحر الغيوم مشهد الصباح الباكر، وبحلول الظهر تلتف الغيوم غالبًا حول الجبل نفسه. احمل
    طبقات دافئة حتى في أغسطس: فمعدل الشهر لا يتجاوز 13 إلى 18 درجة مئوية، والليالي أبرد بعد. الإقامة هنا
    في بيوت ضيافة وأكواخ مؤجَّرة، دون فنادق بالمعنى المعتاد؛ فاحجز مسبقًا في عز الصيف. اشترِ الطعام والماء
    في أوزورغيتي، فالمتاجر هنا قليلة. بحيرة تشينتشاو، على ارتفاع نحو 2500 متر، قريبة بما يكفي لنزهة سيرًا
    على الأقدام. خطط للزيارة من أواخر يونيو إلى منتصف سبتمبر: أما بقية العام فيغلق الثلج الطريق.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا متجاوزًا كوتايسي إلى سامتريديا، ثم S12 إلى لانتشخوتي، ومنها الطريق
    المارّ بجابانا إلى أوزورغيتي، نحو 300 كم من الأسفلت. في أوزورغيتي، انعطف إلى Sh45 عبر شيموكميدي إلى
    وادي بجوجي، وتابع الصعود آخر 33 كم إلى غوميسمتا. يتلاشى الرصف تدريجيًا مع الصعود، والقسم العلوي طريق
    جبلي غير معبّد، مليء بالحفر وزلق بعد المطر. استأجر سيارة دفع رباعي بارتفاع مناسب عن الأرض. الإجمالي
    نحو 350 كم؛ خصص ما لا يقل عن ست ساعات وربع. عبّئ الوقود في أوزورغيتي. بعض تطبيقات التنقل توجهك عبر
    أدجارا وطريق غوميسمتا-شواخيفي؛ تجاهلها.
