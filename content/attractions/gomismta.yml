ka:
  name: გომისმთა
  short: გურიის „კურორტი ღრუბლებში" — ხის ქოხების ზაფხულის დასახლება მესხეთის ქედის ალპურ მდელოებზე 2100
    მეტრზე, ღრუბლების ზღვის ზემოთ ამომავალი მზით.
  body: >-
    **გომისმთა გურიის „კურორტი ღრუბლებშია".** ზაფხულის სამთო კურორტი მესხეთის ქედის ჩრდილოეთ ფერდობზე,
    ბჟუჟის ხეობის ზემოთ, დაახლოებით 2100 მეტრზე დგას. მისი მთავარი სანახაობა ცაა: გარიჟრაჟზე დაბლობი
    ხშირად ღრუბლების უწყვეტი ზღვით არის დაფარული, მთა კი მის ზემოთ ცურავს, და მზის ამოსვლა-ჩასვლა აქ
    მართლაც ისეთია, როგორსაც ფოტოებზე ხედავ. მოწმენდილ დღეს ჰორიზონტზე შავი ზღვაც კი მოჩანს.


    თავად დასახლება ასობით უხეში ხის ქოხისგან შედგება, რომლებიც უტყეო ალპურ მდელოებზეა მიმოფანტული, გარშემო
    კი ნაძვნარ-სოჭნარი ტყე ერტყმის. გომისმთა ჯერ კიდევ 1950-იანი წლებიდან ვითარდებოდა როგორც სამკურნალო
    ჰავის კურორტი, 2010-იანი წლებიდან კი ეკოტურიზმმა ახალი სიცოცხლე შთაბერა. ჩვეულებრივი სასტუმროები აქ
    არ არის — მხოლოდ საოჯახო ქოხები და საქირავებელი კოტეჯები, და სწორედ ეს უბრალოება ქმნის ადგილის ხასიათს.


    სეზონი მოკლეა — ივნისის ბოლოდან სექტემბრის შუამდე; წლის დანარჩენ დროს გზა უმეტესად თოვლითაა ჩახერგილი.
    ადგილზე მინერალური წყაროებია, ცხენით სეირნობა და საფეხმავლო მარშრუტები: ბახმაროსკენ მდელოებზე გადავლით
    და მესხეთის ქედის გადაკვეთით შუახევისკენ, აჭარაში. უმეტესობა აქ ოზურგეთიდან გრძელი ერთდღიანი გასვლით
    ამოდის ან ერთ ღამეს ქოხში ათევს — ღრუბლების ზღვაზე ამომავალი მზისთვის ღამისთევა ნამდვილად ღირს.
  tip: >-
    ღრუბლების ზღვა ყველაზე ხშირად გარიჟრაჟზეა — თუ ფოტოებისთვის ამოდიხარ, ღამე ქოხში დარჩი და მზის ამოსვლას
    დაესწარი. თბილი ტანსაცმელი აგვისტოშიც აუცილებელია: ღამით ტემპერატურა მკვეთრად ეცემა. მაღაზია და კაფე
    მინიმალურია — საკვები და წყალი ოზურგეთში აიღე. ღრუბელი ხშირად შუადღისას მთას ეფარება, ამიტომ ხედებისთვის
    დილა ჯობია. ზამთარსა და გაზაფხულზე გზა ჩაკეტილია — მარშრუტი მხოლოდ ზაფხულისთვის დაგეგმე.
  route: >-
    თბილისიდან ავტობანით სამტრედიამდე, შემდეგ ოზურგეთისკენ — სულ დაახლოებით 330 კმ ასფალტი. ოზურგეთიდან
    გომისმთამდე ბოლო ±20 კმ მოუსფალტებელი სამთო გზაა, სერპანტინით ტყეში: მშრალ ზაფხულში ფრთხილი მძღოლი
    ჩვეულებრივი მანქანითაც ავა, მაგრამ მაღალი კლირენსის ჯიპი აშკარად კომფორტულია და წვიმის შემდეგ აუცილებელიც.
    სულ თბილისიდან დაახლოებით 350 კმ და 5:45 საათი. ზამთარში გზა თოვლიანია და იკეტება.
en:
  name: Gomismta
  short: Guria's "resort in the clouds" — a summer settlement of wooden cottages on treeless alpine meadows
    at 2,100 m, famous for sunrises over a sea of clouds.
  body: >-
    **Gomismta is Guria's "resort in the clouds".** This summer mountain resort sits at about 2,100 metres
    on the northern slope of the Meskheti Range, above the Bzhuzhi gorge. Its main spectacle is the sky:
    at dawn the lowlands are often buried under an unbroken sea of clouds while the mountain floats above
    it, and the sunrises and sunsets here genuinely look the way they do in photographs. On a clear day
    you can even make out the Black Sea on the horizon.


    The settlement itself is hundreds of rough wooden cottages scattered across treeless alpine meadows,
    ringed by spruce and fir forest. Gomismta grew as a health resort from the 1950s, and since the 2010s
    ecotourism has been bringing it back to life. There are no conventional hotels — only guesthouses
    and cottage rentals — and that simplicity is precisely the charm of the place.


    The season is short: late June to mid-September, with the road snowbound much of the rest of the year.
    On the spot you will find mineral springs, horse riding and trekking routes — across the meadows towards
    Bakhmaro, and over the Meskheti ridge to Shuakhevi in Adjara. Most visitors come up as a long day
    trip from Ozurgeti or stay one night in a cottage — and for the sunrise over the cloud sea, the overnight
    is well worth it.
  tip: >-
    The sea of clouds is most reliable at dawn — if you are coming for photographs, sleep in a cottage
    and catch the sunrise. Warm clothing is essential even in August: temperatures drop sharply at night.
    Shops and cafés are minimal, so buy food and water in Ozurgeti. Cloud often wraps the mountain by
    midday, so mornings are best for the views. In winter and spring the road is closed — plan this one
    strictly for summer.
  route: >-
    From Tbilisi take the highway to Samtredia, then continue towards Ozurgeti — about 330 km of asphalt
    in total. From Ozurgeti the final roughly 20 km to Gomismta is an unpaved mountain road climbing in
    serpentines through the forest: in a dry summer a careful driver can manage it in an ordinary car,
    but a high-clearance SUV is distinctly more comfortable and necessary after rain. In total about 350
    km and 5 hours 45 minutes from Tbilisi. In winter the road is snowbound and closed.
ru:
  name: Гомисмта
  short: Гурийский «курорт в облаках» — летний посёлок деревянных домиков на безлесных альпийских лугах
    на высоте 2100 м, знаменитый рассветами над морем облаков.
  body: >-
    **Гомисмта — гурийский «курорт в облаках».** Летний горный курорт лежит на высоте около 2100 метров
    на северном склоне Месхетского хребта, над ущельем Бжужи. Главное зрелище здесь — небо: на рассвете
    низины часто скрыты сплошным морем облаков, а гора плывёт над ним, и восходы с закатами действительно
    выглядят так, как на фотографиях. В ясный день на горизонте видно даже Чёрное море.


    Сам посёлок — это сотни грубых деревянных домиков, разбросанных по безлесным альпийским лугам в кольце
    елово-пихтового леса. Гомисмта развивалась как климатический курорт ещё с 1950-х, а с 2010-х экотуризм
    вдохнул в неё новую жизнь. Обычных гостиниц нет — только гостевые дома и аренда домиков, и именно
    эта простота составляет характер места.


    Сезон короткий: с конца июня до середины сентября, большую часть остального года дорога завалена снегом.
    На месте — минеральные источники, конные прогулки и пешие маршруты: по лугам в сторону Бахмаро и через
    Месхетский хребет к Шуахеви в Аджарии. Большинство приезжает сюда длинной однодневной вылазкой из
    Озургети или остаётся на ночь в домике — ради рассвета над морем облаков ночёвка того стоит.
  tip: >-
    Море облаков надёжнее всего на рассвете — если едете за фотографиями, переночуйте в домике и встретьте
    восход. Тёплая одежда обязательна даже в августе: ночью температура резко падает. Магазинов и кафе
    почти нет — еду и воду берите в Озургети. К полудню гору часто затягивает облаками, так что за видами
    лучше идти утром. Зимой и весной дорога закрыта — планируйте поездку строго на лето.
  route: >-
    Из Тбилиси по автомагистрали до Самтредиа, дальше в сторону Озургети — всего около 330 км асфальта.
    От Озургети последние примерно 20 км до Гомисмты — грунтовая горная дорога, серпантином поднимающаяся
    через лес: сухим летом аккуратный водитель проедет и на обычной машине, но кроссовер с высоким клиренсом
    заметно комфортнее, а после дождя необходим. Всего от Тбилиси около 350 км и 5 часов 45 минут. Зимой
    дорога под снегом и закрыта.
fa:
  name: گومیسمتا
  short: «تفرجگاه میان ابرهای» گوریا — اقامتگاهی تابستانی از کلبه‌های چوبی روی چمنزارهای آلپی بی‌درخت
    در ارتفاع 2,100 متر، نامدار به طلوع بر فراز دریای ابر.
  body: >-
    **گومیسمتا «تفرجگاه میان ابرهای» گوریاست.** این تفرجگاه کوهستانی تابستانی در ارتفاع حدود 2,100 متر
    روی دامنهٔ شمالی رشته‌کوه مسختی، بالای درهٔ بژوژی نشسته است. تماشای اصلی اینجا آسمان است: سپیده‌دم
    دشت‌های پایین اغلب زیر دریای یکپارچه‌ای از ابر پنهان‌اند و کوه بر فراز آن شناور است، و طلوع و غروب
    اینجا واقعاً همان‌طور است که در عکس‌ها می‌بینید. در روز صاف حتی دریای سیاه در افق پیداست.


    خود اقامتگاه صدها کلبهٔ چوبی ساده است که روی چمنزارهای آلپی بی‌درخت پراکنده‌اند و جنگل نراد و کاج
    نقره‌ای دورشان را گرفته است. گومیسمتا از دههٔ 1950 به‌عنوان تفرجگاهی برای آب‌وهوای شفابخش رشد کرد
    و از دههٔ 2010 بوم‌گردی جانی تازه به آن داده است. هتل معمولی اینجا نیست — فقط مهمان‌خانه و کلبه‌های
    اجاره‌ای — و همین سادگی جوهر جای است.


    فصل کوتاه است: از اواخر ژوئن تا میانهٔ سپتامبر؛ بیشترِ باقی سال جاده زیر برف بسته است. در محل چشمه‌های
    آب معدنی، اسب‌سواری و مسیرهای کوه‌پیمایی هست — از میان چمنزارها به سوی باخمارو و از روی ستیغ مسختی
    به شوآخوی در آجارا. بیشتر بازدیدکنندگان با یک گشت یک‌روزهٔ بلند از اوزورگتی بالا می‌آیند یا شبی را
    در کلبه می‌مانند — و برای طلوع بر دریای ابر، شب ماندن به‌راستی می‌ارزد.
  tip: >-
    دریای ابر بیش از همه سپیده‌دم پیداست — اگر برای عکاسی می‌آیید، شب را در کلبه بمانید و طلوع را ببینید.
    لباس گرم حتی در اوت ضروری است: شب‌ها دما به‌شدت پایین می‌آید. مغازه و کافه بسیار اندک است — خوراک
    و آب را در اوزورگتی بخرید. نزدیک ظهر ابر اغلب کوه را می‌پوشاند، پس برای منظره صبح بهتر است. در زمستان
    و بهار جاده بسته است — این سفر را فقط برای تابستان برنامه‌ریزی کنید.
  route: >-
    از تفلیس با بزرگراه تا سامتردیا و سپس به سوی اوزورگتی — روی هم حدود 330 کیلومتر آسفالت. از اوزورگتی
    حدود 20 کیلومتر پایانی تا گومیسمتا جادهٔ کوهستانی خاکی است که با پیچ‌وخم از میان جنگل بالا می‌رود:
    در تابستان خشک رانندهٔ محتاط با خودروی معمولی هم می‌رسد، اما شاسی‌بلند آشکارا راحت‌تر است و پس از
    باران ضروری. روی هم از تفلیس حدود 350 کیلومتر و 5 ساعت و 45 دقیقه. در زمستان جاده زیر برف و بسته
    است.
he:
  name: גומיסמטה
  short: '"אתר הנופש בעננים" של גוריה — יישוב קיץ של בקתות עץ על כרי דשא אלפיניים בגובה 2,100 מטר, מפורסם
    בזריחות מעל ים של עננים.'
  body: >-
    **גומיסמטה היא "אתר הנופש בעננים" של גוריה.** אתר הנופש ההררי הקיצי שוכן בגובה כ-2,100 מטר על המדרון
    הצפוני של רכס מסחתי, מעל ערוץ בז'וז'י. המחזה המרכזי כאן הוא השמיים: עם שחר השפלה מכוסה לעיתים קרובות
    בים עננים רצוף בעוד ההר צף מעליו, והזריחות והשקיעות כאן באמת נראות כמו בתצלומים. ביום בהיר אפשר להבחין
    באופק אפילו בים השחור.


    היישוב עצמו הוא מאות בקתות עץ פשוטות הפזורות על כרי דשא אלפיניים חשופי עצים, מוקפים יער אשוחים. גומיסמטה
    צמחה כאתר מרפא עוד משנות ה-50 של המאה העשרים, ומאז שנות ה-2010 תיירות אקולוגית מחזירה אותה לחיים.
    אין כאן מלונות רגילים — רק בתי הארחה והשכרת בקתות — והפשטות הזאת היא בדיוק קסמו של המקום.


    העונה קצרה: מסוף יוני עד אמצע ספטמבר, וברוב שאר השנה הדרך חסומה בשלג. במקום יש מעיינות מינרליים, רכיבת
    סוסים ומסלולי הליכה — על פני כרי הדשא לכיוון בחמארו ומעבר לרכס מסחתי אל שואחווי שבאג'ריה. רוב המבקרים
    עולים לכאן בטיול יום ארוך מאוזורגטי או נשארים ללילה בבקתה — ולמען הזריחה מעל ים העננים, הלינה בהחלט
    שווה.
  tip: >-
    ים העננים אמין ביותר עם שחר — אם אתם באים לצלם, לונו בבקתה וקבלו את הזריחה. ביגוד חם הכרחי גם באוגוסט:
    בלילה הטמפרטורה צונחת בחדות. חנויות ובתי קפה כמעט שאין — קנו אוכל ומים באוזורגטי. לקראת צהריים עננים
    עוטפים לרוב את ההר, ולכן הבוקר עדיף לתצפיות. בחורף ובאביב הדרך סגורה — תכננו את הנסיעה לקיץ בלבד.
  route: >-
    מטביליסי בכביש המהיר עד סמטרדיה, ומשם לכיוון אוזורגטי — כ-330 ק״מ אספלט בסך הכול. מאוזורגטי כ-20 הק״מ
    האחרונים לגומיסמטה הם דרך הרים לא סלולה המטפסת בסרפנטינות דרך היער: בקיץ יבש נהג זהיר יעבור גם ברכב
    רגיל, אבל רכב שטח גבוה נוח בהרבה והכרחי אחרי גשם. בסך הכול כ-350 ק״מ ו-5:45 שעות מטביליסי. בחורף הדרך
    מושלגת וסגורה.
ar:
  name: غوميسمتا
  short: '"منتجع الغيوم" في غوريا — مستوطنة صيفية من أكواخ خشبية على مروج ألبية بلا أشجار على ارتفاع 2,100
    متر، شهيرة بشروق الشمس فوق بحر من السحب.'
  body: >-
    **غوميسمتا هي "منتجع الغيوم" في غوريا.** يقع هذا المنتجع الجبلي الصيفي على ارتفاع نحو 2,100 متر على
    السفح الشمالي لسلسلة مسخيتي، فوق وادي بجوجي. والمشهد الرئيسي هنا هو السماء: فعند الفجر كثيراً ما تختفي
    الأراضي المنخفضة تحت بحر متصل من السحب بينما يطفو الجبل فوقه، وشروق الشمس وغروبها هنا يبدوان فعلاً
    كما في الصور. وفي اليوم الصافي يمكن تمييز البحر الأسود في الأفق.


    المستوطنة نفسها مئات من الأكواخ الخشبية البسيطة المتناثرة على مروج ألبية خالية من الأشجار، يحيط بها
    غابة من التنوب والشوح. نمت غوميسمتا منتجعاً صحياً منذ خمسينيات القرن العشرين، ومنذ عقد 2010 تعيدها
    السياحة البيئية إلى الحياة. لا فنادق تقليدية هنا — فقط بيوت ضيافة وأكواخ للإيجار — وهذه البساطة هي
    سر سحر المكان.


    الموسم قصير: من أواخر يونيو إلى منتصف سبتمبر، والطريق مدفون بالثلج معظم بقية السنة. في المكان ينابيع
    معدنية وركوب خيل ودروب مشي — عبر المروج نحو باخمارو، وفوق سلسلة مسخيتي إلى شواخيفي في أجاريا. ومعظم
    الزوار يصعدون في رحلة يوم طويلة من أوزورغيتي أو يبيتون ليلة في كوخ — ومن أجل الشروق فوق بحر السحب،
    المبيت يستحق فعلاً.
  tip: >-
    بحر السحب أضمن ما يكون عند الفجر — إن جئت للتصوير فبِت في كوخ واشهد الشروق. الملابس الدافئة ضرورية
    حتى في أغسطس: فالحرارة تهبط ليلاً بحدة. المتاجر والمقاهي شبه معدومة — اشترِ الطعام والماء في أوزورغيتي.
    وكثيراً ما تلف الغيوم الجبل عند الظهيرة، فالصباح أفضل للمناظر. وفي الشتاء والربيع الطريق مغلق — خطط
    لهذه الرحلة للصيف حصراً.
  route: >-
    من تبليسي عبر الطريق السريع حتى سامتريديا، ثم نحو أوزورغيتي — نحو 330 كم من الأسفلت إجمالاً. من أوزورغيتي
    آخر 20 كم تقريباً إلى غوميسمتا طريق جبلي غير معبّد يتسلق بمنعطفات عبر الغابة: في الصيف الجاف يجتازه
    سائق حذر بسيارة عادية، لكن سيارة دفع رباعي مرتفعة أريح بوضوح وضرورية بعد المطر. الإجمالي من تبليسي
    نحو 350 كم و5 ساعات و45 دقيقة. وفي الشتاء الطريق تحت الثلج ومغلق.
