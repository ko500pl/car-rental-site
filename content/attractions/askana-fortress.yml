ka:
  name: ასკანის ციხე
  short: გურიის მთავრების ციხის ნანგრევები ტყიან ბორცვზე, ოზურგეთის აღმოსავლეთით, ბახვისწყლის ხეობის შესასვლელთან.
  body: >-
    **ასკანა გურიის მთავრების ერთ-ერთი საყრდენი ციხე იყო.** ის ოზურგეთიდან აღმოსავლეთით, ბახვისწყლის ხეობაში,
    ტყიან ბორცვზე დგას — ზუსტად იმ ადგილას, საიდანაც ხეობის სიღრმეში მიმავალი გზა კონტროლდებოდა.

    ციხის ისტორია გვიანი შუა საუკუნეებისაა. მას გურიელები იყენებდნენ, როგორც ერთ-ერთ რეზიდენციასა და თავშესაფარს
    იმ პერიოდში, როცა გურია ოსმალეთსა და იმერეთს შორის იყო მოქცეული და ბრძოლები ხშირი იყო. XVIII საუკუნეში
    ციხემ სამხედრო მნიშვნელობა დაკარგა და თანდათან მიატოვეს.

    დღეს რაც შემორჩა, ნანგრევებია და ამის ცოდნა მნიშვნელოვანია:

    - **გალავნის ფრაგმენტები**, ბორცვის კონტურზე მიყოლებული, ადგილ-ადგილ ორ-სამ მეტრამდე სიმაღლის

    - **კოშკის ბაზისი**, უმაღლეს წერტილში

    - **წყალსაცავის ნაშთი** — ალყისთვის აუცილებელი ელემენტი, კარგად ჩანს

    - **მცენარეულობა** — ხე და სუროა კედლებში გაზრდილი და ზაფხულში ბევრს ფარავს

    ღირსება არქიტექტურა კი არაა, არამედ ადგილი: ბორცვიდან ხეობა ორივე მიმართულებით იშლება და ნათლად ჩანს,
    რატომ დადგა ციხე ზუსტად აქ. ეს არის ის ტიპის ძეგლი, სადაც ერთი მარტივი კითხვის პასუხს — რატომ სწორედ
    ამ წერტილში? — თვალით იღებ.

    გაზაფხულსა და შემოდგომაზე, როცა ფოთოლი ცოტაა, ნანგრევები ბევრად უკეთ ჩანს. ივლის-აგვისტოში მცენარეულობა
    კედლების ნახევარს ფარავს.
  tip: >-
    საათნახევარი, ასვლის ჩათვლით. ბოლო მონაკვეთი ფეხითაა — ოციდან ოცდაათ წუთამდე ციცაბო ბილიკზე, მარკირების
    გარეშე. დახურული ფეხსაცმელი და გრძელი შარვალი აუცილებელია: ჭინჭარი, მაყვალი და ტკიპა ჩვეულებრივია.
    კედლებზე ასვლა არ ღირს, ქვა ფხვიერია. ტუალეტი და კაფე არაა. გაზაფხული და გვიანი შემოდგომა საუკეთესო
    დროა — ნაკლები ფოთოლი, მეტი ხედი.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთისა და ოზურგეთის გავლით, მერე აღმოსავლეთით
    ბახვისწყლის ხეობაში — 340 კმ, დაახლოებით ხუთი საათი ოცდაათი წუთი. მთავარი გზა ასფალტია; ხეობის მონაკვეთი
    ვიწრო, ორმოებიანი და ბოლოს ხრეშიანი. მაღალი კლირენსი სასურველია, განსაკუთრებით წვიმის შემდეგ. საწვავი
    ოზურგეთშია. მანქანა სოფლის ბოლოს დატოვე და ბილიკს ფეხით მიჰყევი.
en:
  name: Askana Fortress
  short: The ruins of a fortress of the princes of Guria, on a wooded hill east of Ozurgeti.
  body: >-
    **Askana was one of the strongholds of the Gurieli, the princes of Guria.** It stands east of Ozurgeti
    on a wooded hill in the Bakhvistsqali valley — exactly where the road into the upper valley could
    be controlled.

    The fortress belongs to the late medieval period. The Gurieli used it as a residence and a refuge
    during the centuries when Guria lay between the Ottomans and Imereti and fighting was frequent. By
    the 18th century it had lost its military purpose and was gradually abandoned.

    What survives is ruin, and it is worth knowing that in advance:

    - **Sections of curtain wall** following the contour of the hill, in places two or three metres high

    - **The base of a tower** at the highest point

    - **The remains of a cistern**, the element a siege depended on, clearly readable

    - **Vegetation** — trees and ivy have taken the walls, and in summer they hide a good deal

    The merit here is not architecture but position. From the hill the valley opens in both directions
    and it becomes obvious why the fortress stands on this particular spur. It is the sort of monument
    that answers one simple question — why here? — with your own eyes rather than a panel.

    In spring and late autumn, when the leaf is off, the ruins read far better. In July and August the
    growth covers half the masonry.
  tip: >-
    An hour and a half including the climb. The final stretch is on foot, twenty to thirty minutes up
    a steep unmarked path. Closed shoes and long trousers are essential: nettles, brambles and ticks are
    all common. Do not climb on the walls, as the stone is loose. There are no toilets or cafe. Spring
    and late autumn are the best times — less leaf, more to see.
  route: >-
    From Tbilisi take the E60 to Samtredia, then south through Lanchkhuti and Ozurgeti before turning
    east into the Bakhvistsqali valley — 340 km, about five and a half hours. The main road is asphalt;
    the valley section is narrow, potholed and gravel at the end. Good clearance is advisable, especially
    after rain. Fuel is available in Ozurgeti. Leave the car at the end of the village road and continue
    on foot.
ru:
  name: Крепость Аскана
  short: Руины крепости гурийских князей на лесистом холме восточнее Озургети, у входа в долину Бахвисцкали.
  body: >-
    **Аскана была одной из опорных крепостей Гуриели, князей Гурии.** Она стоит восточнее Озургети, на
    лесистом холме в долине Бахвисцкали — ровно там, где можно было держать дорогу в верхнюю часть ущелья.

    Крепость относится к позднему Средневековью. Гуриели пользовались ею как резиденцией и убежищем в
    те века, когда Гурия лежала между османами и Имеретией, а столкновения были частыми. К XVIII веку
    она потеряла военное значение и постепенно опустела.

    То, что уцелело, — руины, и об этом лучше знать заранее:

    - **Участки внешней стены** по контуру холма, местами высотой в два-три метра

    - **Основание башни** в высшей точке

    - **Остатки цистерны** — элемент, от которого зависела осада, хорошо читаются

    - **Растительность** — деревья и плющ взяли стены, летом скрывая изрядную часть

    Ценность здесь не архитектурная, а позиционная. С холма долина раскрывается в обе стороны, и становится
    очевидно, почему крепость стоит именно на этом отроге. Это тот тип памятника, где ответ на простой
    вопрос — почему здесь? — получаешь глазами, а не с таблички.

    Весной и поздней осенью, когда листа нет, руины читаются гораздо лучше. В июле и августе зелень закрывает
    половину кладки.
  tip: >-
    Полтора часа с подъёмом. Последний отрезок пеший — двадцать-тридцать минут по крутой тропе без маркировки.
    Закрытая обувь и длинные брюки обязательны: крапива, ежевика и клещи здесь обычны. На стены не лезьте,
    камень непрочен. Ни туалета, ни кафе нет. Весна и поздняя осень — лучшее время: меньше листвы, больше
    видно.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути и Озургети, дальше на восток в долину Бахвисцкали
    — 340 км, около пяти с половиной часов. Главная дорога асфальтированная; участок по ущелью узкий,
    в ямах, а в конце гравийный. Высокий клиренс желателен, особенно после дождя. Заправка в Озургети.
    Машину оставьте в конце сельской дороги и идите пешком.
fa:
  name: قلعهٔ آسکانا
  short: ویرانه‌های قلعهٔ امیران گوریا بر تپه‌ای جنگلی در شرق اوزورگتی.
  body: >-
    **آسکانا یکی از دژهای گوریلی‌ها، امیران گوریا، بود.** شرق اوزورگتی بر تپه‌ای جنگلی در درهٔ باخویسْتسقالی
    ایستاده است — درست جایی که راه بالادست دره از آن مهار می‌شد.

    قلعه به اواخر سده‌های میانه تعلق دارد. گوریلی‌ها آن را در سده‌هایی که گوریا میان عثمانی و ایمرتی قرار
    داشت و نبرد پرتکرار بود، هم اقامتگاه می‌ساختند و هم پناهگاه. تا سدهٔ هجدهم اهمیت نظامی‌اش از میان
    رفت و کم‌کم رها شد.

    آنچه مانده ویرانه است، و دانستن این پیش از رفتن مهم است:

    - **بخش‌هایی از دیوار حصار** که خط تپه را دنبال می‌کند و جاهایی دو سه متر ارتفاع دارد

    - **پی یک برج** در بلندترین نقطه

    - **بازماندهٔ آب‌انبار**، عنصری که تاب محاصره به آن بسته بود، و به‌روشنی خوانده می‌شود

    - **پوشش گیاهی** — درخت و پیچک دیوارها را گرفته‌اند و تابستان بسیاری را می‌پوشانند

    ارزش اینجا معماری نیست، موقعیت است. از تپه دره در هر دو سو باز می‌شود و روشن می‌گردد که چرا قلعه دقیقاً
    بر همین زبانه ایستاده است. از آن بناهاست که پاسخ یک پرسش ساده — چرا اینجا؟ — را با چشم خود می‌گیرید،
    نه از تابلو.

    بهار و اواخر پاییز، وقتی برگ ریخته، ویرانه‌ها بسیار بهتر خوانده می‌شوند. در تیر و مرداد رستنی‌ها نیمی
    از بنّایی را می‌پوشانند.
  tip: >-
    یک ساعت و نیم با صعود. بخش پایانی پیاده است، بیست تا سی دقیقه روی مسیری تند و بی‌نشانه. کفش بسته و
    شلوار بلند ضروری است: گزنه و تمشک وحشی و کنه همه معمول‌اند. از دیوارها بالا نروید، سنگ سست است. سرویس
    بهداشتی و کافه نیست. بهار و اواخر پاییز بهترین وقت است؛ برگ کمتر، دید بیشتر.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی و اوزورگتی و آنگاه به شرق در درهٔ باخویسْتسقالی
    — ۳۴۰ کیلومتر، حدود پنج ساعت و نیم. جادهٔ اصلی آسفالت است؛ بخش دره باریک و پرچاله و در انتها شنی است.
    ارتفاع مناسب از زمین مطلوب است، به‌ویژه پس از باران. سوخت در اوزورگتی. خودرو را در انتهای جادهٔ روستا
    بگذارید و پیاده ادامه دهید.
he:
  name: מבצר אסקאנה
  short: חורבות מבצר של נסיכי גוריה על גבעה מיוערת ממזרח לאוזורגטי.
  body: >-
    **אסקאנה הייתה אחד ממעוזי בית גוריאלי, נסיכי גוריה.** היא עומדת ממזרח לאוזורגטי על גבעה מיוערת בעמק
    באחוויסצקאלי — בדיוק במקום שממנו אפשר היה לשלוט בדרך אל מעלה העמק.

    המבצר שייך לסוף ימי הביניים. בני גוריאלי השתמשו בו כמשכן וכמקלט במאות שבהן שכנה גוריה בין העות׳מאנים
    לאימרתי והקרבות היו תכופים. במאה ה-18 איבד את ערכו הצבאי וננטש בהדרגה.

    מה ששרד הוא חורבה, וכדאי לדעת זאת מראש:

    - **קטעי חומת היקף** העוקבים אחר קו הגבעה, במקומות בגובה שניים-שלושה מטרים

    - **בסיס מגדל** בנקודה הגבוהה ביותר

    - **שרידי בור מים**, המרכיב שהמצור היה תלוי בו, וניכר היטב

    - **צמחייה** — עצים וקיסוס השתלטו על החומות ובקיץ מסתירים חלק ניכר

    היתרון כאן אינו האדריכלות אלא המיקום. מן הגבעה נפתח העמק לשני הכיוונים ומתברר מיד מדוע המבצר עומד
    דווקא על הכתף הזאת. זהו סוג האתר שבו התשובה לשאלה פשוטה — למה כאן? — מגיעה דרך העיניים ולא משלט הסבר.

    באביב ובסתיו המאוחר, כשהעלווה נשרה, החורבות נקראות טוב בהרבה. ביולי ובאוגוסט הצמחייה מכסה מחצית מן
    הבנייה.
  tip: >-
    שעה וחצי כולל הטיפוס. הקטע האחרון ברגל, עשרים עד שלושים דקות בשביל תלול ולא מסומן. נעליים סגורות ומכנסיים
    ארוכים הכרחיים: סרפדים, פטל בר וקרציות שכיחים כאן. אל תטפסו על החומות, האבן רופפת. אין שירותים ואין
    בית קפה. אביב וסתיו מאוחר הם הזמן הטוב ביותר — פחות עלווה, יותר לראות.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי ואוזורגטי ומשם מזרחה אל עמק באחוויסצקאלי — 340
    ק״מ, כחמש שעות וחצי. הכביש הראשי סלול; קטע העמק צר, מלא בורות ובסופו חצץ. מרווח גחון טוב רצוי, במיוחד
    אחרי גשם. תדלוק באוזורגטי. השאירו את הרכב בסוף דרך הכפר והמשיכו ברגל.
ar:
  name: قلعة أسكانا
  short: أطلال قلعة لأمراء غوريا على تل مشجر شرق أوزورغيتي، عند مدخل وادي باخفيستسقالي.
  body: >-
    **كانت أسكانا أحد معاقل آل غورييلي، أمراء غوريا.** تقوم شرق أوزورغيتي على تل مشجر في وادي باخفيستسقالي
    — في الموضع الذي يمكن منه بالضبط التحكم في الطريق إلى أعلى الوادي.

    القلعة من أواخر العصور الوسطى. استخدمها آل غورييلي مقراً وملجأً في القرون التي كانت فيها غوريا بين
    العثمانيين وإيميريتي وكان القتال متواتراً. وبحلول القرن الثامن عشر فقدت قيمتها العسكرية وهُجرت تدريجاً.

    وما بقي أطلال، ومن المفيد معرفة ذلك سلفاً:

    - **مقاطع من السور** تتبع خط التل، وترتفع في مواضع مترين أو ثلاثة

    - **قاعدة برج** في أعلى نقطة

    - **بقايا صهريج**، وهو العنصر الذي كان الحصار يتوقف عليه، وواضح المعالم

    - **النبات** — استولت الأشجار واللبلاب على الجدران وتخفي صيفاً قدراً كبيراً

    والميزة هنا ليست العمارة بل الموقع. فمن التل ينفتح الوادي في الاتجاهين ويتضح فوراً لماذا تقف القلعة
    على هذا النتوء بالذات. إنه من المواقع التي تأتيك فيها إجابة سؤال بسيط — لماذا هنا؟ — من عينيك لا من
    لوحة شرح.

    في الربيع وأواخر الخريف، حين يسقط الورق، تُقرأ الأطلال أفضل بكثير. وفي يوليو وأغسطس يغطي النبات نصف
    البناء.
  tip: >-
    ساعة ونصف شاملة الصعود. المقطع الأخير سيراً، عشرون إلى ثلاثون دقيقة على درب حاد بلا علامات. الحذاء
    المغلق والبنطال الطويل ضروريان: فالقُرّاص والعليق والقراد كلها شائعة. ولا تتسلق الجدران، فالحجر مفكك.
    ولا دورات مياه ولا مقهى. والربيع وأواخر الخريف أفضل الأوقات — ورق أقل ورؤية أوضح.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي وأوزورغيتي ثم شرقاً إلى وادي باخفيستسقالي
    — 340 كم، نحو خمس ساعات ونصف. الطريق الرئيسي معبّد؛ ومقطع الوادي ضيق كثير الحفر وحصوي في آخره. ويستحسن
    ارتفاع الهيكل، خاصة بعد المطر. الوقود في أوزورغيتي. اترك السيارة في نهاية طريق القرية وتابع سيراً.
