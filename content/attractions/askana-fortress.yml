ka:
  name: ასკანის ციხე
  short: >-
    ჩამოქცეული კოშკი ბახვისწყლის პირას, მთისპირში: გურიის სამთავროს ხაზინა და საპყრობილე, 1828 წლამდე
    ალყაშემორტყმული, დღეს ტყეში ჩაკარგული.
  body: >-
    **ოდესღაც გურიელები ამ კედლებს მიღმა ინახავდნენ სამთავროს ხაზინას; დღეს ჩამოქცეული ქვის კოშკი ტყის
    თავზე ძლივს ამოყოფს თავს.**


    ასკანის ციხე ბახვისწყლის მარცხენა ნაპირზე, სოფელ მთისპირში, დელემურისა და თაფურიათის მთებს შორის დგას.
    სახელი ასკანის თემიდან მოდის, რომელსაც მთისპირი ისტორიულად ეკუთვნოდა; ადგილობრივები მას თამარ მეფის
    ციხესაც უწოდებენ — ეს სახელი გადმოცემამ საქართველოს ბევრ ციხეს შეარქვა. ციხე მეცნიერულად არასოდეს
    შეუსწავლიათ. ძველი ენციკლოპედიური ცნობებით, მისი უძველესი ფენა IV საუკუნისაა, აქაური ბაზილიკა — V–VII
    საუკუნეებისა, უახლესი ფენა კი XIX საუკუნეს განეკუთვნება.


    ციხისთვის ბოლომდე იბრძოდნენ. 1770 და 1774 წლებში ციხე ოსმალებმა აიღეს და ორივეჯერ მამია IV გურიელმა
    და სოლომონ I-მა დაიბრუნეს. 1804 წელს ქაიხოსრო გურიელი ექვსი კვირა ედგა ალყაში ურჩ ციხისთავს, დავით
    ასათიანს, და ვერაფერს გახდა; ბოლოს ერთმა აზნაურმა ასათიანი ღალატით გამოიტყუა და ის მოკლეს. ამის შემდეგ
    ასკანა სამთავროს მთავარ საპყრობილედ იქცა. 1828 წლის სექტემბერში აქ სოფიო გურიელი გამაგრდა რუსეთის
    მმართველობის წინააღმდეგ, სანამ 30 სექტემბერს ციხე რუსეთის ჯარმა არ დაიკავა.


    გადმოცემა უფრო ძველ ალყასაც იხსენებს: თითქოს მურვან ყრუმ მეომრებს უნაგირები ერთმანეთზე დააწყობინა,
    რომ კედელზე ასულიყვნენ, მეციხოვნეებმა კი გავარვარებული ისრებით უნაგირებს ცეცხლი წაუკიდეს. მურვანის
    დაკარგული მუზარადი, ამბობენ, დიდხანს ინახებოდა ციხის ეკლესიაში.


    დღეს აქ მხოლოდ ნანგრევია. 1833 წლის ცნობით, ციხე ორი კოშკისა და წითელი მარმარილოს სამლოცველოსგან შედგებოდა;
    1884 წელს მაზრის უფროსმა კედლის ერთი კუთხე მხოლოდ იმიტომ დაანგრევინა, რომ მისი სისქე გაეზომა. ახლა
    კოშკის ნაშთი და ორ მეტრზე მეტი სისქის კედლები ხეებშია ჩაფლული, ძველი ნასოფლარის ადგილას კი ბენტონიტის
    თიხას მოიპოვებენ. აქ არქიტექტურისთვის კი არა, ადგილისა და ამბისთვის მოდიან.
  tip: >-
    ასვლის ჩათვლით საათნახევარი დაუთმეთ. ბოლო მონაკვეთი ფეხით გადის: ოციდან ოცდაათ წუთამდე ციცაბო, მარკირების
    გარეშე ბილიკზე, ამიტომ გზა მთისპირში იკითხეთ. დახურული ფეხსაცმელი და გრძელი შარვალი აუცილებელია —
    ჭინჭარი, მაყვალი და ტკიპა ბევრია. კედლებზე ნუ აძვრებით, ქვა ფხვიერია. ხეობაში ბენტონიტის თიხას მოიპოვებენ
    — სამუშაო უბანსა და სატვირთოებს მოერიდეთ. ტუალეტი და კაფე არ არის. საუკეთესო დრო გაზაფხული და გვიანი
    შემოდგომაა, როცა შიშველი ტოტებიდან წყობა კარგად ჩანს. გზად ზენობანში ნოდარ დუმბაძის მუზეუმია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე, შემდეგ ს12-ით სამხრეთისკენ
    დაახლოებით შვიდი კილომეტრი და შ2 გზით, საჯავახოს გავლით, ჩოხატაურამდე იარეთ. იქიდან ბახმაროს გზას
    (შ81) გაუყევით ხიდისთავამდე და სოფლის გზაზე გადაუხვიეთ, რომელიც ათიოდე კილომეტრზე სამხრეთ-დასავლეთით,
    ჭაჭიეთის გავლით მთისპირამდე მიდის — 292 კმ, დაახლოებით ოთხი საათი და ორმოცდახუთი წუთი. ხიდისთავამდე
    ასფალტია, შემდეგ გზა ვიწროვდება, ორმოიანი და დაკემსილია, ბოლოს კი ხრეშზე გადადის. გონივრული არჩევანია
    მაღალი კლირენსის მქონე ჯიპი ან კროსოვერი, განსაკუთრებით წვიმის შემდეგ. საწვავი ჩოხატაურშია. მანქანა
    გზის ბოლოს დატოვეთ და ფეხით აიარეთ.
en:
  name: Askana Fortress
  short: >-
    A broken tower above the Bakhvistsqali at Mtispiri: once Guria's treasury and prison, besieged until
    1828, now swallowed by forest.
  body: >-
    **The princes of Guria once kept their treasury behind these walls; today a broken stone tower barely
    lifts its head above the forest.**


    Askana Fortress stands on the left bank of the Bakhvistsqali, in the village of Mtispiri, between
    the Delemuri and Tapuriati hills. It takes its name from Askana, the old community Mtispiri belonged
    to; locals also call it Queen Tamar's Fortress, a name tradition gives to many Georgian strongholds.
    No archaeologist has ever studied it. Older reference works date its first stones to the 4th century
    and a basilica here to the 5th–7th; its youngest layer is 19th-century.


    It was fought over to the very end. Ottoman troops took Askana in 1770 and again in 1774, and both
    times Mamia IV Gurieli and King Solomon I won it back. In 1804 Kaikhosro Gurieli besieged his own
    rebellious commandant, David Asatiani, for six weeks in vain; in the end a nobleman lured Asatiani
    out, and he was killed. Askana then became the principality's main prison. In September 1828 Sofio
    Gurieli held out here against Russian rule until Russian troops took the fortress on the 30th.


    Tradition remembers an older siege. The Arab commander Marwan the Deaf, it is said, had his men stack
    their saddles against the walls to climb them, and the defenders set the pile alight with red-hot
    arrows; his lost helmet was long kept in the fortress church.


    What survives is ruin. An 1833 account describes two towers and a chapel of red marble; in 1884 a
    district chief had a corner of the wall pulled down simply to measure its thickness. Now a tower stump
    and walls more than two metres thick hide among the trees, while bentonite clay is quarried where
    the old settlement stood. Come for the position and the story, not the architecture.
  tip: >-
    Allow an hour and a half with the climb. The last stretch is on foot: twenty to thirty minutes up
    a steep, unmarked path, so ask in Mtispiri for the way. Closed shoes and long trousers are essential
    against nettles, brambles and ticks. Keep off the walls, as the stone is loose. The valley is quarried
    for bentonite clay; stay clear of the working area and its trucks. There are no toilets or café. Come
    in spring or late autumn, when bare branches reveal the masonry. The Nodar Dumbadze museum at Zenobani
    is on the way.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, follow the S12 south for about seven
    kilometres, then the Sh2 through Sajavakho to Chokhatauri. There take the Sh81 Bakhmaro road to Khidistavi
    and turn onto the village road that runs about ten kilometres south-west through Chachieti to Mtispiri
    — 292 km, about four hours forty-five. It is asphalt to Khidistavi; after that the road narrows, is
    patched and potholed, and ends in gravel. An SUV or crossover with good clearance is the sensible
    choice, especially after rain. Fuel in Chokhatauri. Leave the car where the road ends and walk up.
ru:
  name: Крепость Аскана
  short: >-
    Разрушенная башня над рекой Бахвисцкали в Мтиспири: некогда казна и тюрьма Гурии, осаждаемая до 1828
    года, теперь поглощённая лесом.
  body: >-
    **Некогда за этими стенами гурийские князья хранили свою казну; сегодня разрушенная каменная башня
    едва поднимает голову над лесом.**


    Крепость Аскана стоит на левом берегу Бахвисцкали, в деревне Мтиспири, между холмами Делемури и Тапуриати.
    Название она получила от Асканы — старой общины, к которой относилась Мтиспири; местные также называют
    её крепостью царицы Тамар — это имя предание даёт многим грузинским крепостям. Ни один археолог никогда
    её не исследовал. Более старые справочники датируют первые камни IV веком, а стоявшую здесь базилику
    — V–VII веками; самый молодой слой относится к XIX веку.


    За неё бились до последнего. Османские войска взяли Аскану в 1770 году и снова в 1774-м, и оба раза
    Мамия IV Гуриели и царь Соломон I возвращали её обратно. В 1804 году Кайхосро Гуриели шесть недель
    безуспешно осаждал собственного взбунтовавшегося коменданта Давида Асатиани; в конце концов один дворянин
    выманил Асатиани наружу, и того убили. После этого Аскана стала главной тюрьмой княжества. В сентябре
    1828 года Софио Гуриели держалась здесь против российской власти, пока 30-го числа русские войска
    не взяли крепость.


    Предание хранит память о более ранней осаде. Говорят, арабский полководец Мурван Глухой велел своим
    воинам сложить сёдла у стен, чтобы взойти по ним, а защитники подожгли эту кучу раскалёнными стрелами;
    а потерянный Мурваном шлем долго хранился в крепостной церкви.


    То, что осталось, — руины. Описание 1833 года упоминает две башни и часовню из красного мрамора; в
    1884 году уездный начальник велел разрушить угол стены просто для того, чтобы измерить её толщину.
    Теперь обломок башни и стены толще двух метров прячутся среди деревьев, а на месте старого поселения
    добывают бентонитовую глину. Приезжайте сюда ради самого места и его истории, а не ради архитектуры.
  tip: >-
    Отведите полтора часа с учётом подъёма. Последний отрезок — пешком: двадцать-тридцать минут по крутой
    неразмеченной тропе, так что спрашивайте дорогу в Мтиспири. Закрытая обувь и длинные брюки необходимы
    против крапивы, колючих кустов и клещей. Не забирайтесь на стены — камень непрочный. В долине добывают
    бентонитовую глину; держитесь в стороне от рабочей зоны и грузовиков. Здесь нет ни туалетов, ни кафе.
    Приезжайте весной или поздней осенью, когда голые ветви открывают кладку. По пути — музей Нодара Думбадзе
    в Зенобани.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 на юг около семи
    километров, потом по Sh2 через Саджавахо до Чохатаури. Там возьмите дорогу на Бахмаро Sh81 до Хидистави
    и сверните на деревенскую дорогу, которая идёт около десяти километров на юго-запад через Чачиети
    до Мтиспири — 292 км, около четырёх часов сорока пяти минут. До Хидистави асфальт; дальше дорога сужается,
    латаная и в выбоинах, заканчивается гравием. Разумный выбор — внедорожник или кроссовер с хорошим
    клиренсом, особенно после дождя. Заправиться можно в Чохатаури. Оставьте машину там, где кончается
    дорога, и поднимитесь пешком.
fa:
  name: قلعهٔ آسکانا
  short: >-
    برجی شکسته بر فراز رود باخویستسکالی در متیسپیری: زمانی خزانه و زندان گوریا، محاصره‌شده تا سال ۱۸۲۸،
    و اکنون بلعیده‌شده در جنگل.
  body: >-
    **زمانی شاهزادگان گوریا خزانهٔ خود را پس این دیوارها نگه می‌داشتند؛ امروز برجی سنگی و شکسته به‌سختی
    سر خود را بالای جنگل بلند می‌کند.**


    قلعهٔ آسکانا بر کنارهٔ چپ رود باخویستسکالی، در روستای متیسپیری، میان تپه‌های دلموری و تاپوریاتی برپاست.
    نامش را از آسکانا، دهستان کهنی که متیسپیری بدان تعلق داشت، گرفته است؛ مردم محل آن را قلعهٔ ملکه تامار
    نیز می‌نامند؛ نامی که سنت بر بسیاری از دژهای گرجستان نهاده است. هرگز هیچ باستان‌شناسی آن را بررسی
    نکرده است. منابع کهن‌تر نخستین سنگ‌های آن را به سدهٔ چهارم و بازیلیکایی در همان‌جا را به سده‌های پنجم
    تا هفتم نسبت می‌دهند؛ جوان‌ترین لایهٔ آن به سدهٔ نوزدهم تعلق دارد.


    بر سرش تا آخرین لحظه جنگیدند. نیروهای عثمانی آسکانا را در سال ۱۷۷۰ و بار دیگر در ۱۷۷۴ تصرف کردند،
    و هر دو بار مامیا چهارم گوریئلی و پادشاه سولومون یکم آن را باز پس گرفتند. در سال ۱۸۰۴ کایخسرو گوریئلی
    شش هفته بی‌ثمر فرماندهٔ شورشیِ خود، داوید آساتیانی، را محاصره کرد؛ سرانجام یک نجیب‌زاده آساتیانی را
    به بیرون کشاند و او کشته شد. آسکانا از آن پس زندان اصلی شاهزاده‌نشین شد. در سپتامبر ۱۸۲۸ سوفیو گوریئلی
    در اینجا در برابر حکومت روسیه ایستادگی کرد تا آنکه نیروهای روس در روز سی‌ام قلعه را گرفتند.


    روایتی محاصره‌ای کهن‌تر را به یاد می‌آورد. گفته می‌شود فرمانده عرب، مروانِ کر، به سربازانش دستور داد
    زین‌های اسبانشان را کنار دیوارها روی هم بگذارند تا از آن‌ها بالا روند، و مدافعان با تیرهای گداخته
    آن انبوه را به آتش کشیدند؛ کلاهخود گمشدهٔ او مدت‌ها در کلیسای قلعه نگه‌داری می‌شد.


    آنچه باقی مانده ویرانه است. توصیفی از سال ۱۸۳۳ از دو برج و نمازخانه‌ای از مرمر سرخ سخن می‌گوید؛ در
    سال ۱۸۸۴ رئیس ناحیه دستور داد گوشه‌ای از دیوار را فقط برای اندازه‌گیری ضخامتش خراب کنند. اکنون کندهٔ
    برجی و دیوارهایی به ضخامت بیش از دو متر میان درختان پنهان‌اند، در حالی که در محل روستای کهن، خاک رس
    بنتونیت استخراج می‌شود. برای مکان و داستانش بیایید، نه برای معماری‌اش.
  tip: >-
    با در نظر گرفتن سربالایی، یک ساعت و نیم زمان بگذارید. آخرین بخش راه پیاده است: بیست تا سی دقیقه بر
    مسیری پرشیب و نشانه‌گذاری‌نشده، پس در متیسپیری راه را بپرسید. کفش بسته و شلوار بلند در برابر گزنه،
    بوته‌های تیغ‌دار و کنه ضروری است. روی دیوارها نروید، چون سنگ‌ها شل‌اند. در این دره خاک رس بنتونیت
    استخراج می‌شود؛ از منطقهٔ کار و کامیون‌هایش دور بمانید. اینجا نه توالتی هست نه کافه‌ای. در بهار یا
    اواخر پاییز بیایید، وقتی شاخه‌های برهنه سنگ‌کاری را نمایان می‌کنند. موزهٔ نودار دومبادزه در زنوبانی
    در همان مسیر است.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 حدود هفت
    کیلومتر به جنوب ادامه دهید، و بعد از راه Sh2 از میان ساجاواخو تا چوخاتائوری بروید. در آن‌جا جادهٔ
    باخمارو Sh81 را تا خیدیستاوی در پیش بگیرید و به جادهٔ روستایی بپیچید که حدود ده کیلومتر به سوی جنوب‌غرب
    از میان چاچی‌ئتی تا متیسپیری می‌رود — حدود ۲۹۲ کیلومتر، نزدیک به چهار ساعت و چهل‌وپنج دقیقه. تا خیدیستاوی
    آسفالت است؛ پس از آن جاده تنگ‌تر می‌شود، وصله‌کاری‌شده و پرچاله است و به شنریزه ختم می‌شود. یک شاسی‌بلند
    یا کراس‌آور با ارتفاع خوب از سطح زمین، به‌خصوص پس از باران، انتخاب معقولی است. سوخت‌گیری در چوخاتائوری.
    خودرو را جایی که جاده به پایان می‌رسد رها کنید و پیاده بالا بروید.
he:
  name: מבצר אסקנה
  short: 'מגדל שבור מעל נהר בחוויסצקלי במטיספירי: פעם בית הגנזך והכלא של גוריה, שנצור עד 1828, וכיום נבלע
    ביער.'
  body: >-
    **פעם שמרו נסיכי גוריה את גנזכם מאחורי חומות אלה; היום מגדל אבן שבור מרים בקושי את ראשו מעל היער.**


    מבצר אסקנה עומד על הגדה השמאלית של בחוויסצקלי, בכפר מטיספירי, בין גבעות דלמורי וטפוריאתי. שמו ניתן
    לו על שם אסקנה, הקהילה הישנה שאליה השתייכה מטיספירי; המקומיים קוראים לו גם מבצר המלכה תמר — שם שהמסורת
    מעניקה למבצרים גאורגיים רבים. שום ארכיאולוג לא חקר אותו מעולם. חיבורי עיון ישנים יותר מתארכים את אבניו
    הראשונות למאה ה-4 ובזיליקה שעמדה כאן למאות ה-5–7; השכבה הצעירה ביותר שבו היא מהמאה ה-19.


    נלחמו עליו עד הסוף. הכוחות העות'מאניים כבשו את אסקנה ב-1770 ושוב ב-1774, ובשני המקרים החזירו אותה
    מאמיה הרביעי גוריאלי והמלך סולומון הראשון. ב-1804 צר קייחוסרו גוריאלי שישה שבועות לשווא על מפקדו המורד,
    דוד אסאטיאני; לבסוף פיתה אציל את אסאטיאני לצאת, והוא נהרג. אסקנה הפכה אז לבית הכלא המרכזי של הנסיכות.
    בספטמבר 1828 עמדה סופיו גוריאלי כאן נגד השלטון הרוסי, עד שהכוחות הרוסיים כבשו את המבצר ב-30 בחודש.


    המסורת זוכרת מצור קדום יותר. מספרים שהמצביא הערבי מרואן החרש הורה לחייליו לערוֹם את אוכפיהם לצד החומות
    כדי לטפס עליהם, והמגינים הצליחו להצית את ערמת האוכפים בחצים לוהטים; קסדתו האבודה נשמרה זמן רב בכנסיית
    המבצר.


    מה שנותר הוא חורבה. תיאור מ-1833 מזכיר שני מגדלים וקפלה משיש אדום; ב-1884 הורה ראש מחוז להרוס פינה
    בחומה רק כדי למדוד את עוביה. כיום שריד מגדל וקירות בעובי של יותר משני מטרים מתחבאים בין העצים, ובמקום
    שבו עמד היישוב הישן חוצבים חרסית בנטוניט. באו לכאן בשל המקום והסיפור, לא בשל האדריכלות.
  tip: >-
    הקדישו שעה וחצי, כולל העלייה. הקטע האחרון הוא ברגל: עשרים עד שלושים דקות במעלה שביל תלול ולא מסומן,
    אז שאלו את הדרך במטיספירי. נעליים סגורות ומכנסיים ארוכים הכרחיים מפני סרפדים, שיחי קוצים וקרציות.
    אל תטפסו על החומות — האבן בהן רופפת. בעמק חוצבים חרסית בנטוניט; הישארו מרוחקים מאזור החציבה ומהמשאיות.
    אין כאן שירותים או בית קפה. באו באביב או בסתיו המאוחר, כשהענפים החשופים חושפים את הבנייה. מוזיאון
    נודאר דומבדזה בזנובני נמצא בדרך.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, המשיכו ב-S12 דרומה כשבעה קילומטרים,
    ואז ב-Sh2 שעובר בסאג'אווכו עד צ'וחאטאורי. משם עלו על כביש בכמארו Sh81 עד חידיסטאווי ופנו לדרך כפרית
    הנמשכת כעשרה קילומטרים דרום-מערבה דרך צ'אצייתי עד מטיספירי — 292 ק"מ, כארבע שעות ושלושה רבעי שעה.
    אספלט עד חידיסטאווי; אחרי זה הדרך מצטמצמת, מתוקנת ומלאה מהמורות, ומסתיימת בחצץ. רכב שטח או קרוסאובר
    עם מרווח גחון טוב הם הבחירה הנבונה, בייחוד אחרי גשם. תדלוק בצ'וחאטאורי. השאירו את הרכב במקום שבו הדרך
    מסתיימת וטפסו ברגל.
ar:
  name: قلعة أسكانا
  short: >-
    برج متصدّع فوق نهر باخفيستسكالي في متيسبيري: كان خزانة غوريا وسجنها يومًا، وحوصر حتى عام 1828، والآن
    تلتهمه الغابة.
  body: >-
    **كان أمراء غوريا يحفظون خزانتهم خلف هذه الجدران؛ واليوم بالكاد يرفع برج حجري متصدّع رأسه فوق الغابة.**


    تقع قلعة أسكانا على الضفة اليسرى لنهر باخفيستسكالي، في قرية متيسبيري، بين تلّي ديليموري وتابورياتي.
    أخذت اسمها من أسكانا، الجماعة القديمة التي كانت متيسبيري تنتمي إليها؛ ويسمّيها السكان المحليون أيضًا
    قلعة الملكة تامار، وهو اسم يطلقه التراث على كثير من الحصون الجورجية. لم يدرسها أي عالم آثار قط. تؤرّخ
    المراجع القديمة أولى حجارتها إلى القرن الرابع، وبازيليكا كانت هنا إلى القرون من الخامس إلى السابع؛
    وأحدث طبقاتها تعود إلى القرن التاسع عشر.


    قوتِلَ عليها حتى النهاية. استولت القوات العثمانية على أسكانا في عام 1770 ومجددًا في 1774، وفي كلتا
    المرتين استردها ماميا الرابع غورييلي والملك سليمان الأول. في عام 1804 حاصر كايخوسرو غورييلي قائده
    المتمرد دافيد أساتياني ستة أسابيع بلا فائدة؛ وفي النهاية استدرجه أحد النبلاء إلى الخارج، فقُتل أساتياني.
    أصبحت أسكانا بعد ذلك السجن الرئيسي للإمارة. وفي سبتمبر 1828 صمدت صوفيو غورييلي هنا في وجه الحكم الروسي
    إلى أن استولت القوات الروسية على القلعة في اليوم الثلاثين من الشهر.


    يحفظ التراث الشعبي ذكرى حصار أقدم. يُقال إن القائد العربي مروان الأصمّ أمر جنده بأن يكدّسوا سُرُوجهم
    عند الجدران للتسلق عليها، فأشعل المدافعون الكومة بسهام محمّاة؛ وقد ظلّت خوذته المفقودة محفوظة زمنًا
    طويلًا في كنيسة القلعة.


    ما تبقّى هو خراب. يذكر وصفٌ يعود إلى عام 1833 برجين وكنيسة صغيرة من المرمر الأحمر؛ وفي عام 1884 أمر
    رئيس منطقة بهدم زاوية من الجدار فقط لقياس سُمكه. والآن يتوارى جذع برج وجدران يزيد سمكها على مترين
    بين الأشجار، بينما تُستخرج طينة البنتونيت في موضع المستوطنة القديمة. تعال من أجل الموقع والحكاية،
    لا من أجل العمارة.
  tip: >-
    خصّص ساعة ونصف الساعة شاملةً الصعود. الجزء الأخير سيرًا على الأقدام: عشرون إلى ثلاثين دقيقة صعودًا
    في مسار حاد الانحدار وغير معلَّم، فاسأل عن الطريق في متيسبيري. الحذاء المغلق والسروال الطويل ضروريان
    في مواجهة القريص والعلّيق والقُراد. تجنّب الاقتراب من الجدران، فالحجارة مخلخلة. يُستخرج في الوادي
    طين البنتونيت؛ فابقَ بعيدًا عن منطقة العمل وشاحناتها. لا مراحيض هنا ولا مقهى. تعال في الربيع أو أواخر
    الخريف، حين تكشف الأغصان العارية عن البناء الحجري. متحف نودار دومبادزه في زينوباني يقع على الطريق.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم تابع على S12 جنوبًا لنحو سبعة
    كيلومترات، ثم Sh2 عبر ساجافاخو حتى تشوخاتاوري. من هناك اتبع طريق باخمارو Sh81 حتى خيديستاوي وانعطف
    إلى الطريق الريفي الذي يمتد نحو عشرة كيلومترات باتجاه الجنوب الغربي عبر تشاتشييتي حتى متيسبيري — 292
    كم، نحو أربع ساعات وخمس وأربعين دقيقة. الطريق معبّد حتى خيديستاوي؛ وبعد ذلك يضيق ويصبح مرقّعًا ومليئًا
    بالحفر، وينتهي بالحصى. سيارة دفع رباعي أو كروس أوفر بارتفاع جيد عن الأرض هي الخيار المعقول، خصوصًا
    بعد المطر. التزود بالوقود في تشوخاتاوري. اترك السيارة حيث ينتهي الطريق وتابع صعودًا سيرًا على الأقدام.
