ka:
  name: 300 არაგველის მემორიალი
  short: >-
    1959 წლის ობელისკი ორთაჭალაში, მტკვრის თავზე — იქ, სადაც 1795 წელს თბილისისთვის დაღუპულთა ნეშტი მოგვიანებით
    აღმოჩნდა.
  body: >-
    **1795 წლის 11 სექტემბერს, საღამოსთვის, თბილისის ლაშქარი ძალაგამოცლილი იყო და ქალაქი დაუცველი დარჩა;
    ორთაჭალის თავზე აღმართული ეს ობელისკი იქ დგას, სადაც მისი უკანასკნელი დამცველების ნეშტი აღმოაჩინეს.**


    შემოსეულ ლაშქარს აღა-მაჰმად-ხანი, ყაჯართა დინასტიის ფუძემდებელი, მეთაურობდა — დაახლოებით 35–40 ათასი
    მეომარი. მოხუცმა ერეკლე II-მ მხოლოდ ხუთიოდე ათასის შეკრება მოახერხა, მათ შორის ორი ათასამდე იმერელისა,
    რომლებიც მეფე სოლომონ II-მ მოაშველა. 9 და 10 სექტემბერს ქართველებმა ქალაქის სამხრეთ-დასავლეთ მისადგომებთან,
    კრწანისთან, შეტევა შეტევაზე მოიგერიეს. 11 სექტემბერს სპარსელებმა მტკვარი გადალახეს და ქართველებს ფლანგიდან
    მოუარეს. ერეკლემ დაახლოებით 150 კაცით მთებს შეაფარა თავი, ქალაქი კი აიკლეს და დაახლოებით 15 ათასი
    ადამიანი ტყვედ წაასხეს.


    ქართული წყაროების თანახმად, არაგვის ხეობის მთიელთა რაზმმა, რომელიც უფლისწულ ვახტანგის სარდლობით იბრძოდა,
    სიკვდილამდე ბრძოლა შეფიცა და ფიცი არ გატეხა: მეფის უკანდახევა თავისი სისხლით უზრუნველყო. გადმოცემამ
    მათ მრგვალი, სპარტული რიცხვი შერჩინა — სამასი. პირველად ისინი უფლისწულმა თეიმურაზმა, ბრძოლის ყმაწვილმა
    მონაწილემ, შეაქო თავის ისტორიაში; ილია ჭავჭავაძემ, ვაჟა-ფშაველამ და გალაკტიონ ტაბიძემ ეროვნულ გმირებად
    აქციეს, 2008 წელს კი საქართველოს ეკლესიამ ისინი, კრწანისის ბრძოლაში დაღუპულ სასულიერო და საერო პირებთან
    ერთად, წმინდა მოწამეებად შერაცხა.


    ძეგლი ა. ბაქრაძის პროექტით 1959 წელს აღიმართა იმ ადგილას, სადაც 1795 წელს დაღუპულთა საფლავების ნაშთი
    გამოჩნდა; 1969 წელს მას მემორიალური კედელი დაემატა. კრწანისის ველი რამდენიმე კილომეტრით სამხრეთ-აღმოსავლეთითაა
    — ეს საფლავია და არა ბრძოლის ველი. „300 არაგველის“ სახელს ატარებს მეტროსადგური, ხიდი და პარკიც.


    ქვემოთ ის მდინარე მიედინება, რომელიც სპარსელებმა იმ დღეს გადალახეს, — ისე მშვიდად, თითქოს აქ არაფერი
    მომხდარა.
  tip: >-
    ხანმოკლე გაჩერებაა — 20–30 წუთი. შესვლა უფასოა, ძეგლი ნებისმიერ დროს ღიაა, თუმცა არც მომსახურე პერსონალია,
    არც საპირფარეშო, არც კაფე: ეს ყველაფერი ერთიოდე კილომეტრით ჩრდილოეთით, მეტეხთან და ძველ ქალაქშია.
    მდინარის ხედისთვის მოწმენდილი დღე აირჩიეთ. ადვილად გააერთიანებთ მეტეხთან, ნარიყალასთან, ჯუმა-მეჩეთთან
    და თაბორის მონასტერთან — ყველა მტკვრის გაყოლებაზეა. ეს სამარხია და ასეც მოეპყარით: ხმამაღალი საუბარი
    და ძეგლზე აცოცება აქ ადგილს არ შეეფერება. ეკლესია სამას არაგველს 24 სექტემბერს (ძველი სტილით 11 სექტემბერს)
    იხსენიებს.
  route: >-
    თავისუფლების მოედნიდან მტკვრისკენ დაეშვით და მარჯვენა სანაპიროთი, ძველი ქალაქის გასწვრივ, სამხრეთისკენ
    წადით, შემდეგ ვახტანგ გორგასლის ქუჩას მიჰყევით ორთაჭალისკენ. სულ დაახლოებით 4 კილომეტრია და 10 წუთი,
    ბოლო აღმართისა და პარკირების ჩათვლით. მანიშნებლით მონიშნული მოკლე გვერდითი გზა ბორცვზე ადის, პატარა
    ავტოსადგომამდე; იქიდან ძეგლამდე ერთი-ორი წუთის სავალია. გზა ბოლომდე მოასფალტებულია — ნებისმიერი ეკონომკლასის
    მანქანა გამოდგება; ერთადერთი სირთულე გორგასლის ქუჩის მოძრაობაა. საწვავი ქალაქშია, აქ მასზე ფიქრი არ
    მოგიწევთ.
en:
  name: Monument to the 300 Aragvians
  short: >-
    A 1959 obelisk above the Mtkvari at Ortachala, raised where remains of Tbilisi's defenders of 1795
    were unearthed.
  body: >-
    **By nightfall on 11 September 1795 Tbilisi's army was spent and the city lay open; this obelisk above
    Ortachala stands where remains of its last defenders were found.**


    The invader was Agha Mohammad Khan, founder of the Qajar dynasty, with an army of some 35,000–40,000.
    The ageing King Erekle II could muster about 5,000, some 2,000 of them Imeretians sent by King Solomon
    II. On 9 and 10 September the Georgians threw back attack after attack on the city's south-western
    approaches at Krtsanisi. On the 11th the Persians crossed the Mtkvari and outflanked them. Erekle
    escaped to the mountains with about 150 men; the city was sacked and some 15,000 people were driven
    off into captivity.


    Georgian accounts say that a detachment of highlanders from the Aragvi valley, fighting under Prince
    Vakhtang, had sworn to fight to the death, and kept the oath, covering the king's retreat with their
    last stand. Tradition gave them a round, Spartan number: three hundred. Prince Teimuraz, a teenage
    participant in the battle, first praised them in his history; Ilia Chavchavadze, Vazha-Pshavela and
    Galaktion Tabidze made them national heroes; and in 2008 the Georgian Orthodox Church canonised them,
    with the clergy and laymen who fell at Krtsanisi, as holy martyrs.


    The monument, designed by A. Bakradze, went up in 1959 where remains of the graves of the 1795 dead
    were unearthed; a memorial wall was added in 1969. The Krtsanisi battlefield itself lies several kilometres
    to the south-east — this is a grave, not the field. The metro station, bridge and park called "300
    Aragveli" all carry the same men's name.


    Below, the river the Persians crossed that day still runs south, unhurried, as if nothing had happened
    here.
  tip: >-
    A short stop: 20–30 minutes. It is free and open at any hour, but there are no staff, toilets or cafés
    — those are a kilometre or so north around Metekhi and the Old Town. Choose a clear day for the view
    over the river. It combines easily with Metekhi, Narikala, the Juma Mosque and Tabori Monastery, all
    strung along the Mtkvari. Treat it as the grave it is: keep voices low and don't climb on the monument.
    The Church commemorates the Three Hundred on 24 September (11 September in the old calendar).
  route: >-
    From Freedom Square drop down to the Mtkvari and head south along the right-bank embankment past the
    Old Town, then follow Vakhtang Gorgasali Street towards Ortachala. It is about 4 km and 10 minutes,
    including the final climb and parking. A short signposted side lane climbs the hill to a small car
    park at the top; the monument is a minute or two on foot. Paved all the way, so any economy car will
    do; the only difficulty is the traffic on Gorgasali Street. Fuel is in the city — no need to plan
    for it on so short a hop.
ru:
  name: Памятник 300 арагвинцам
  short: Обелиск 1959 года над Мтквари в Ортачале, поставленный там, где нашли останки защитников Тбилиси
    1795 года.
  body: >-
    **К вечеру 11 сентября 1795 года тбилисское войско было обескровлено, а город беззащитен; этот обелиск
    над Ортачалой стоит там, где нашли останки его последних защитников.**


    Захватчиком был Ага Мохаммед-хан, основатель династии Каджаров, с армией примерно в 35 000–40 000
    человек. Престарелый царь Ираклий II сумел собрать около 5000, из них около 2000 имеретинцев, присланных
    царём Соломоном II. 9 и 10 сентября грузины отбивали атаку за атакой на юго-западных подступах к городу,
    у Крцаниси. 11-го персы переправились через Мтквари и обошли их с фланга. Ираклий ушёл в горы примерно
    со 150 воинами; город разграбили, около 15 000 человек угнали в плен.


    Грузинские источники рассказывают, что отряд горцев из долины Арагви, сражавшийся под началом царевича
    Вахтанга, поклялся биться насмерть — и сдержал клятву, прикрыв своим последним боем отход царя. Предание
    дало им круглое, спартанское число: триста. Первым воспел их в своём историческом сочинении царевич
    Теймураз, подростком участвовавший в битве; Илья Чавчавадзе, Важа-Пшавела и Галактион Табидзе сделали
    их национальными героями, а в 2008 году Грузинская православная церковь причислила их — вместе с павшими
    при Крцаниси священнослужителями и мирянами — к лику святых мучеников.


    Памятник по проекту А. Бакрадзе поставили в 1959 году там, где были обнаружены остатки захоронений
    павших в 1795 году; в 1969-м к нему добавили мемориальную стену. Само Крцанисское поле лежит в нескольких
    километрах к юго-востоку — здесь могила, а не место битвы. Станция метро, мост и парк «300 Арагвели»
    носят имя тех же людей.


    Внизу река, которую персы перешли в тот день, всё так же неспешно течёт на юг, будто здесь ничего
    не случилось.
  tip: >-
    Остановка короткая: 20–30 минут. Вход свободный и в любое время, но нет ни смотрителя, ни туалетов,
    ни кафе — всё это примерно в километре к северу, у Метехи и в Старом городе. Выбирайте ясный день
    ради вида на реку. Место легко объединить с Метехи, Нарикалой, Джума-мечетью и монастырём Табори —
    все они нанизаны на берега Мтквари. Помните, что это могила: говорите вполголоса и не забирайтесь
    на памятник. Церковь чтит память Трёхсот 24 сентября (11 сентября по старому стилю).
  route: >-
    От площади Свободы спуститесь к Мтквари и поезжайте на юг по правобережной набережной мимо Старого
    города, затем по улице Вахтанга Горгасали в сторону Ортачалы. Это около 4 км и 10 минут, включая последний
    подъём и парковку. Короткий переулок с указателем поднимается на холм к маленькой стоянке наверху;
    до памятника оттуда минута-другая пешком. Асфальт на всём пути, так что подойдёт любая машина эконом-класса;
    единственная трудность — пробки на улице Горгасали. Заправки есть в городе, на такой короткий переезд
    о топливе можно не думать.
fa:
  name: یادمان سیصد آراگویی
  short: >-
    ستونی یادبود از سال ۱۹۵۹ بر فراز متکواری در اورتاچالا، برافراشته در جایی که بقایای مدافعان تفلیس در
    سال ۱۷۹۵ از خاک بیرون آمد.
  body: >-
    **تا شامگاه ۱۱ سپتامبر ۱۷۹۵ سپاه تفلیس از پا افتاده بود و شهر بی‌دفاع مانده بود؛ این ستون یادبود بر
    فراز اورتاچالا در جایی ایستاده که بقایای آخرین مدافعانش یافته شد.**


    مهاجم آقامحمدخان، بنیان‌گذار دودمان قاجار، بود با سپاهی حدود ۳۵٬۰۰۰ تا ۴۰٬۰۰۰ نفر. شاه سالخورده، ارکلی
    دوم، توانست حدود ۵٬۰۰۰ نفر گرد آورد که نزدیک ۲٬۰۰۰ تن از آنان ایمرتیایی‌هایی بودند که شاه سولومون
    دوم فرستاده بود. در ۹ و ۱۰ سپتامبر گرجی‌ها در کرتسانیسی، بر راه‌های ورودی جنوب‌غربی شهر، یورش پشت
    یورش را پس زدند. در روز ۱۱ ایرانیان از متکواری گذشتند و از پهلو دورشان زدند. ارکلی با حدود ۱۵۰ مرد
    به کوهستان گریخت؛ شهر غارت شد و حدود ۱۵٬۰۰۰ نفر به اسارت برده شدند.


    روایت‌های گرجی می‌گویند دسته‌ای از کوه‌نشینان درّهٔ آراگوی که زیر فرمان شاهزاده واختانگ می‌جنگیدند،
    سوگند خورده بودند تا پای جان بجنگند و به سوگندشان وفا کردند و با آخرین ایستادگی خود عقب‌نشینی شاه
    را پوشش دادند. روایت‌های شفاهی عددی گرد و اسپارتی به آنان دادند: سیصد. نخستین کسی که در کتاب تاریخش
    آنان را ستود، شاهزاده تیموراز بود که نوجوانی در همان نبرد بود؛ ایلیا چاوچاوادزه، واژا-پشاولا و گالاکتیون
    تابیدزه آنان را قهرمانان ملی کردند؛ و در سال ۲۰۰۸ کلیسای ارتدکس گرجستان آنان را، همراه با روحانیان
    و مردم عادی‌ای که در کرتسانیسی جان باختند، در شمار شهیدان مقدس آورد.


    این یادمان به طراحی آ. باکرادزه در سال ۱۹۵۹ در جایی برپا شد که بقایای گورهای کشته‌شدگان ۱۷۹۵ از خاک
    بیرون آمده بود؛ دیوار یادبودی نیز در ۱۹۶۹ به آن افزوده شد. خودِ میدان نبرد کرتسانیسی چند کیلومتر دورتر
    در جنوب‌شرقی است؛ اینجا گور است، نه میدان جنگ. ایستگاه مترو، پل و پارکی که «۳۰۰ آراگولی» نام دارند،
    همه نام همین مردان را بر خود دارند.


    در پایین، رودی که ایرانیان آن روز از آن گذشتند هنوز آرام به سوی جنوب روان است، گویی اینجا هیچ رخ نداده
    است.
  tip: >-
    توقفی کوتاه است: ۲۰ تا ۳۰ دقیقه. رایگان است و در هر ساعتی باز، اما نه نگهبانی هست، نه دست‌شویی، نه
    کافه؛ این‌ها حدود یک کیلومتر شمال‌تر، در اطراف متخی و شهر قدیم یافت می‌شوند. برای تماشای رود روزی
    صاف را برگزینید. به‌آسانی می‌توان آن را با متخی، ناریکالا، مسجد جامع و صومعهٔ تابوری که همه در امتداد
    متکواری ردیف شده‌اند همراه کرد. با آن همچون گوری که هست رفتار کنید: آهسته سخن بگویید و از بنای یادبود
    بالا نروید. کلیسا یاد این سیصد تن را در ۲۴ سپتامبر (۱۱ سپتامبر به گاه‌شماری کهن) گرامی می‌دارد.
  route: >-
    از میدان آزادی به سوی متکواری سرازیر شوید و از خیابان ساحلی کرانهٔ راست، از کنار شهر قدیم، به سمت
    جنوب بروید، سپس خیابان واختانگ گورگاسالی را به سوی اورتاچالا دنبال کنید. حدود ۴ کیلومتر و ۱۰ دقیقه
    راه است، با احتساب سربالایی پایانی و پارک کردن. کوچهٔ فرعی کوتاهی با تابلو از تپه بالا می‌رود و به
    پارکینگ کوچکی در بالای آن می‌رسد؛ تا بنای یادبود یکی دو دقیقه پیاده‌روی است. سراسر آسفالت است، پس
    هر خودروی اقتصادی کار را راه می‌اندازد؛ تنها دشواری ترافیک خیابان گورگاسالی است. سوخت در شهر هست و
    برای چنین مسیر کوتاهی نیازی به برنامه‌ریزی برای آن نیست.
he:
  name: האנדרטה ל-300 בני אראגווי
  short: אובליסק משנת 1959 מעל המטקווארי באורטצ'אלה, שהוקם במקום שבו נחשפו שרידי מגיני טביליסי משנת 1795.
  body: >-
    **עם רדת הלילה ב-11 בספטמבר 1795 היה צבא טביליסי מותש והעיר עמדה פרוצה; האובליסק הזה מעל אורטצ'אלה
    ניצב במקום שבו נמצאו שרידי מגיניה האחרונים.**


    הפולש היה אע'א מוחמד ח'אן, מייסד שושלת קאג'אר, עם צבא של כ-35,000–40,000 איש. המלך הזקן ארקלה השני
    הצליח לגייס כ-5,000, מהם כ-2,000 אימרתים ששלח המלך סולומון השני. ב-9 וב-10 בספטמבר הדפו הגאורגים מתקפה
    אחר מתקפה בגישות הדרום-מערביות לעיר, בקרצאניסי. ב-11 בחודש חצו הפרסים את המטקווארי ואיגפו אותם. ארקלה
    נמלט להרים עם כ-150 איש; העיר נבזזה, וכ-15,000 בני אדם הובלו לשבי.


    לפי מקורות גאורגיים, פלוגה של אנשי הרים מעמק אראגווי, שלחמה בפיקודו של הנסיך וחטנג, נשבעה להילחם עד
    מוות ועמדה בשבועתה, כשבקרב האחרון שלה חיפתה על נסיגת המלך. המסורת העניקה להם מספר עגול וספרטני: שלוש
    מאות. הראשון ששיבח אותם, בספר ההיסטוריה שכתב, היה הנסיך טיימורז, שהשתתף בקרב כנער; איליה צ'בצ'בדזה,
    ואז'ה-פשאוולה וגלקטיון טבידזה הפכו אותם לגיבורים לאומיים; וב-2008 הכריזה עליהם הכנסייה האורתודוקסית
    הגאורגית, יחד עם אנשי הכמורה והאנשים מן השורה שנפלו בקרצאניסי, כקדושים מעונים.


    האנדרטה, שתכנן א. בקרדזה, הוקמה ב-1959 במקום שבו נחשפו שרידי קבריהם של חללי 1795; ב-1969 נוסף לה קיר
    זיכרון. שדה הקרב של קרצאניסי עצמו שוכן כמה קילומטרים מדרום-מזרח – כאן קבר, לא שדה הקרב. תחנת הרכבת
    התחתית, הגשר והפארק הקרויים "300 אראגוולי" נושאים כולם את שמם של אותם אנשים.


    למטה, הנהר שהפרסים חצו באותו יום עדיין זורם דרומה, בלי חיפזון, כאילו דבר לא קרה כאן.
  tip: >-
    עצירה קצרה: 20–30 דקות. הכניסה חופשית ופתוחה בכל שעה, אבל אין צוות, שירותים או בית קפה – אלה נמצאים
    כקילומטר צפונה, סביב מטחי והעיר העתיקה. בחרו יום בהיר בשביל הנוף על הנהר. קל לשלב את המקום עם מטחי,
    נריקלה, מסגד ג'ומה ומנזר טבורי, שכולם שזורים לאורך המטקווארי. התייחסו למקום כפי שהוא – קבר: דברו בקול
    שקט ואל תטפסו על האנדרטה. הכנסייה מציינת את זכר השלוש מאות ב-24 בספטמבר (11 בספטמבר לפי הלוח הישן).
  route: >-
    מכיכר החירות רדו אל המטקווארי וסעו דרומה לאורך הסוללה שעל הגדה הימנית, על פני העיר העתיקה, ואז המשיכו
    ברחוב וחטנג גורגסלי לכיוון אורטצ'אלה. זה כ-4 ק״מ ו-10 דקות, כולל העלייה האחרונה והחניה. סמטה צדדית
    קצרה ומשולטת מטפסת במעלה הגבעה אל חניון קטן בראשה; משם דקה או שתיים ברגל אל האנדרטה. אספלט לכל אורך
    הדרך, כך שכל רכב חסכוני יתאים; הקושי היחיד הוא התנועה ברחוב גורגסלי. דלק יש בעיר – אין צורך לתכנן
    אותו לנסיעה קצרה כל כך.
ar:
  name: نصب الأراغفيين الثلاثمئة
  short: مسلّة من عام 1959 فوق نهر متكفاري في أورتاتشالا، أُقيمت حيث عُثر على رفات المدافعين عن تبليسي
    عام 1795.
  body: >-
    **مع حلول ليل 11 أيلول/سبتمبر 1795 كان جيش تبليسي قد استُنزف والمدينة مكشوفة؛ وهذه المسلّة فوق أورتاتشالا
    قائمة حيث عُثر على رفات آخر المدافعين عنها.**


    كان الغازي آغا محمد خان، مؤسس السلالة القاجارية، على رأس جيش قوامه نحو 35,000–40,000 رجل. ولم يستطع
    الملك المسنّ إريكلي الثاني أن يحشد إلا نحو 5,000، منهم نحو 2,000 من الإيميريتيين أرسلهم الملك سليمان
    الثاني. وفي 9 و10 أيلول صدّ الجورجيون هجوماً بعد هجوم عند المداخل الجنوبية الغربية للمدينة في كرتسانيسي.
    وفي اليوم الحادي عشر عبر الفرس نهر متكفاري والتفّوا عليهم من الجناح. فرّ إريكلي إلى الجبال مع نحو
    150 رجلاً؛ ونُهبت المدينة، وسيق نحو 15,000 إنسان إلى الأسر.


    تروي المصادر الجورجية أن فصيلاً من أبناء الجبال من وادي أراغفي، كان يقاتل بقيادة الأمير فاختانغ، أقسم
    على القتال حتى الموت، ووفى بقسمه، فغطّى انسحاب الملك بوقفته الأخيرة. وأعطتهم الرواية المتوارثة عدداً
    مدوّراً إسبارطياً: ثلاثمئة. وأول من أشاد بهم في كتابه التاريخي الأمير تيموراز، الذي شارك في المعركة
    فتىً يافعاً؛ ثم جعل منهم إيليا تشافتشافادزه وفاجا بشافيلا وغالاكتيون تابيدزه أبطالاً وطنيين؛ وفي عام
    2008 أعلنتهم الكنيسة الأرثوذكسية الجورجية، ومعهم من سقط في كرتسانيسي من رجال الدين وعامة المؤمنين،
    شهداء قديسين.


    أُقيم النصب، من تصميم أ. باكرادزه، عام 1959 في الموضع الذي كُشف فيه عن بقايا قبور قتلى 1795؛ وأُضيف
    إليه جدار تذكاري عام 1969. أما ساحة معركة كرتسانيسي نفسها فتقع على بعد بضعة كيلومترات إلى الجنوب الشرقي،
    فهذا قبر لا ساحة قتال. ومحطة المترو والجسر والحديقة المسمّاة «300 أراغفيلي» كلها تحمل اسم الرجال أنفسهم.


    وفي الأسفل ما زال النهر الذي عبره الفرس ذلك اليوم يجري جنوباً على مهل، كأن شيئاً لم يحدث هنا.
  tip: >-
    وقفة قصيرة: 20–30 دقيقة. الدخول مجاني ومتاح في كل ساعة، لكن لا موظفين ولا دورات مياه ولا مقاهٍ، فهذه
    على بعد كيلومتر تقريباً شمالاً حول ميتيخي والمدينة القديمة. اختر يوماً صافياً من أجل الإطلالة على
    النهر. ويسهل جمع الزيارة مع ميتيخي وناريكالا ومسجد الجمعة ودير تابوري، وكلها منتظمة على امتداد متكفاري.
    وعامِل المكان على حقيقته، قبراً: اخفض صوتك ولا تتسلق النصب. وتحيي الكنيسة ذكرى الثلاثمئة في 24 أيلول/سبتمبر
    (11 أيلول بالتقويم القديم).
  route: >-
    من ساحة الحرية انزل إلى نهر متكفاري واتجه جنوباً على كورنيش الضفة اليمنى مروراً بالمدينة القديمة،
    ثم اتبع شارع فاختانغ غورغاسالي نحو أورتاتشالا. المسافة نحو 4 كم و10 دقائق، بما في ذلك الصعود الأخير
    والوقوف. يصعد زقاق جانبي قصير عليه لافتات إلى التلّ حتى موقف صغير في أعلاه، ومنه إلى النصب دقيقة أو
    دقيقتان مشياً. الطريق معبّد كله، فأي سيارة اقتصادية تفي بالغرض؛ والصعوبة الوحيدة زحمة شارع غورغاسالي.
    الوقود متوفر في المدينة، ولا داعي للتخطيط له في مشوار بهذا القصر.
