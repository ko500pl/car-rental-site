ka:
  name: ფარსმა
  short: >-
    უკაცრიელი კოშკებიანი სოფელი პირიქითა ალაზნის მარცხენა ნაპირზე, სადაც შვიდსართულიანი ციხე-სახლი დღესაც
    გირევის გზას დარაჯობს.
  body: >-
    **XVIII საუკუნეში ფარსმა პირიქითა თუშეთის მთავარი სოფელი იყო; დღეს მისი შვიდსართულიანი ციხე-სახლი
    ქარის გარდა არავის იფარებს.**


    სოფელი პირიქითა ალაზნის მარცხენა ნაპირზე, ბალახიან ბორცვებზე დგას, დართლო-გირევის გზიდან ოდნავ მაღლა,
    ზღვის დონიდან დაახლოებით 2100 მეტრზე. XVIII საუკუნის საარქივო ჩანაწერებში ის პირიქითის თემის ცენტრალურ
    სოფლად იხსენიება. აქ ქააძეები, თორღვაიძეები და სულაკაურები ცხოვრობდნენ, მათგან ყველაზე მრავალრიცხოვანი
    — ქააძეები. 2014 წლის აღწერამ სოფელში მუდმივი მცხოვრები აღარ აღრიცხა.


    რაც დარჩა, დუღაბის გარეშე, მშრალად დაწყობილი ფიქლითაა ნაშენი. დასავლეთ განაპირას სამი ციხე-სახლი მხარდამხარ
    დგას: ორი ექვსსართულიანია, მესამე — შვიდსართულიანი, თუმცა მისი ზედა სართული ჩამონგრეულია. ერთ-ერთ
    მათგანს დღემდე „სასოფლო ციხედ“ მოიხსენიებენ. ჩრდილო-დასავლეთ კიდეზე ოთხსართულიანი კოშკი აღმართულა,
    რომელიც მაღლა მკვეთრად ვიწროვდება. აღმოსავლეთით, სასაფლაოსთან, გვიანი შუა საუკუნეების პატარა დარბაზულ
    ეკლესიას სახურავი და აღმოსავლეთის კედელი ჩამოენგრა, სამხრეთ-აღმოსავლეთით კი წმინდა თევდორეს ხატი დღესაც
    სალოცავად რჩება.


    გადმოცემით, ფარსმის წვერიანი ციხე, ისევე როგორც გირევისა, ქისტმა მამა-შვილმა ააგო: მშვიდობიან წლებში
    თუშები ქედს გადაღმა მცხოვრებ ქისტებს მშენებლებად ქირაობდნენ.


    2018 წლიდან ფარსმა ეროვნული მნიშვნელობის კულტურული მემკვიდრეობის ძეგლია. ზაფხულობით სოფლის ერთ სახლში
    ჯერაც თუშურ ლუდს ხარშავენ, ივნისის ბოლოსა და ივლისის დასაწყისში კი კოშკების ირგვლივ ფერდობები ყვავილებით
    იფარება.


    საღამოსკენ ამოდით, როცა მზე ფიქალს მოშორდება და კოშკები ნანგრევებს აღარ ჰგვანან — უფრო გუშაგებს, რომლებიც
    ცვლას დღემდე ელოდებიან.
  tip: >-
    ფარსმა თუშეთის მოგზაურობის ერთი გაჩერებაა და არა ერთდღიანი გასვლა: ღამე დართლოში ან ხეობის ზემო სოფლებში
    გაათიეთ. სასტუმრო სახლები დაახლოებით ივნისიდან სექტემბრამდე მუშაობს. მაღაზია და ბანკომატი არ არის,
    კავშირი ძლივს იჭერს, ამიტომ თან იქონიეთ ნაღდი ფული, საჭმელი და თბილი ტანსაცმელი — ივლისშიც ღამე ცივა.
    მანქანა გზაზე დატოვეთ და ფეხით ამოდით: აღმართი მოკლეა, მაგრამ ციცაბო. კოშკებში მხოლოდ იქ შედით, სადაც
    სართულები გადარჩენილია — ზოგიერთში სართულშუა გადახურვა ჩამოქცეულია. თუშურ სალოცავებს თავისი წესები
    აქვს, ზოგთან ქალების მისვლა არ შეიძლება, ამიტომ წმინდა თევდორეს ხატთან მიახლოებამდე ადგილობრივებს
    ჰკითხეთ. ერთი საათი საკმარისია.
  route: >-
    თბილისიდან ს5-ით ვაზიანამდე იარეთ, შემდეგ შ38-ით გომბორის უღელტეხილზე გადადით თელავამდე და ახმეტის
    გავლით ფშაველამდე განაგრძეთ; ავზი ახმეტაში შეავსეთ — ეს ბოლო საიმედო ბენზინგასამართია. ფშაველში ასფალტი
    მთავრდება და ხრეშიანი შ44 აბანოს უღელტეხილზე (2826 მ) ადის, შემდეგ კი ომალოში ეშვება; მარტო ამ მონაკვეთს
    ოთხი საათი მაინც სჭირდება. ომალოდან დართლომდე მდინარის ფონებიანი გრუნტის გზა დაახლოებით ერთი საათის
    სავალია, იქიდან კი კიდევ უფრო უხეში გზა პირიქითა ალაზანს ჭეშოს გავლით მიუყვება ფარსმის ძირამდე. სულ
    დაახლოებით 240 კილომეტრი და 7 საათი და 45 წუთი. მხოლოდ ოფროუდ კლასი: მაღალი გამავლობის ჯიპი აუცილებელია.
    უღელტეხილი დაახლოებით ოქტომბრიდან მაისამდე თოვლით არის ჩაკეტილი.
en:
  name: Parsma
  short: >-
    A deserted tower-village on the left bank of the Pirikiti Alazani, where a seven-storey tower-house
    still keeps watch over the track to Girevi.
  body: >-
    **In the eighteenth century Parsma was the chief village of Pirikiti Tusheti; today its seven-storey
    tower-house shelters nothing but the wind.**


    The village stands on grassy knolls on the left bank of the Pirikiti Alazani, a short climb above
    the Dartlo–Girevi track, at about 2,100 metres. Eighteenth-century archive records name it as the
    central village of the Pirikiti community, home to the Kaadze, Torghvaidze and Sulakauri families,
    the Kaadzes the most numerous. The 2014 census recorded no permanent residents at all.


    What remains is built of slate laid dry, without mortar. On the western edge three tower-houses stand
    shoulder to shoulder, two of six storeys and one of seven, its top floor now collapsed; one of them
    is still known as the village fortress. At the north-western edge a four-storey tower narrows sharply
    as it climbs. To the east, by the cemetery, a small late-medieval hall church has lost its roof and
    its east wall, while to the south-east the shrine of St Theodore remains a place of prayer.


    Tradition says that Parsma's peaked tower, like the one at Girevi, was raised by a Kist father and
    son: in peaceful years the Tush hired their Chechen-speaking neighbours from across the ridge as builders.


    Parsma has been a monument of national significance since 2018. In summer one house in the village
    still brews Tush beer, and in late June and early July the slopes around the towers fill with flowers.


    Come towards evening, when the sun leaves the slate and the towers stop looking like ruins and start
    looking like sentries still waiting for the watch to change.
  tip: >-
    Parsma is a stop on a Tusheti journey, never a day trip: sleep in Dartlo or further up the valley.
    Guesthouses open roughly from June to September. There is no shop, no ATM and little signal, so bring
    cash, food and a warm layer; nights are cold even in July. Leave the car by the track and walk up
    — the climb is short but steep. Enter the towers only where the floors survive, as several have collapsed
    inside. Tush shrines keep their own rules, and some may not be approached by women, so ask locally
    before going near the St Theodore shrine. An hour is enough.
  route: >-
    From Tbilisi take the S5 to Vaziani and the Sh38 over the Gombori Pass to Telavi, then continue through
    Akhmeta to Pshaveli; fill up in Akhmeta, the last reliable fuel. At Pshaveli the asphalt ends and
    the Sh44 climbs as gravel over the Abano Pass (2,826 m) before dropping to Omalo; that section alone
    takes four hours or more. From Omalo a dirt track with river fords runs on to Dartlo in about an hour,
    and beyond it a rougher track follows the Pirikiti Alazani past Chesho to the foot of Parsma. Allow
    about 240 km and 7 hours 45 minutes. Offroad class only: a genuine high-clearance 4x4 is essential.
    The pass is snowbound roughly from October to May.
ru:
  name: Парсма
  short: >-
    Покинутое башенное селение на левом берегу Пирикитской Алазани, где семиэтажная башня-жилище всё ещё
    стережёт дорогу на Гиреви.
  body: >-
    **В XVIII веке Парсма была главным селом Пирикити-Тушети; сегодня её семиэтажная башня-жилище укрывает
    лишь ветер.**


    Селение стоит на травянистых холмах левого берега Пирикитской Алазани, чуть выше дороги Дартло — Гиреви,
    на высоте около 2100 метров. Архивные записи XVIII века называют его центральным селом общины Пирикити;
    здесь жили роды Каадзе, Торгвайдзе и Сулакаури, и Каадзе были самыми многочисленными. Перепись 2014
    года не зафиксировала здесь ни одного постоянного жителя.


    Всё, что осталось, сложено из сланца насухо, без раствора. На западной окраине плечом к плечу стоят
    три башни-жилища: две шестиэтажные и одна семиэтажная, чей верхний этаж обрушился; одну из них до
    сих пор называют сельской крепостью. На северо-западном краю поднимается четырёхэтажная башня, резко
    сужающаяся кверху. На востоке, у кладбища, маленькая позднесредневековая зальная церковь лишилась
    крыши и восточной стены, а на юго-востоке святилище святого Феодора по-прежнему остаётся местом молитвы.


    Предание гласит, что островерхую башню Парсмы, как и башню в Гиреви, возвели отец и сын из кистинцев:
    в мирные годы тушины нанимали строителями своих чеченоязычных соседей из-за хребта.


    С 2018 года Парсма — памятник национального значения. Летом в одном доме селения ещё варят тушинское
    пиво, а в конце июня и начале июля склоны вокруг башен покрываются цветами.


    Приходите ближе к вечеру, когда солнце уходит со сланца и башни перестают казаться руинами — теперь
    они похожи на часовых, которые всё ещё ждут смены караула.
  tip: >-
    Парсма — остановка в путешествии по Тушети, но никак не цель однодневной поездки: ночуйте в Дартло
    или выше по долине. Гостевые дома работают примерно с июня по сентябрь. Здесь нет ни магазина, ни
    банкомата, связь слабая, так что возьмите наличные, еду и тёплую одежду: ночи холодные даже в июле.
    Оставьте машину у дороги и поднимитесь пешком — подъём короткий, но крутой. Заходите в башни только
    там, где сохранились перекрытия: в нескольких они обрушились. У тушинских святилищ свои правила, и
    к некоторым женщинам приближаться нельзя, поэтому, прежде чем подходить к святилищу святого Феодора,
    спросите у местных. Хватит и часа.
  route: >-
    Из Тбилиси по S5 до Вазиани, затем по Sh38 через Гомборский перевал в Телави и дальше через Ахмету
    до Пшавели; заправьтесь в Ахмете — это последняя надёжная заправка. В Пшавели асфальт кончается, и
    Sh44 гравийкой взбирается на перевал Абано (2826 м), а потом спускается к Омало; один только этот
    участок занимает четыре часа и больше. От Омало грунтовка с бродами примерно за час приводит в Дартло,
    а дальше ещё более разбитая колея идёт вдоль Пирикитской Алазани мимо Чешо к подножию Парсмы. Всего
    около 240 км и 7 часов 45 минут. Только для бездорожья: нужен настоящий полноприводный внедорожник
    с высоким клиренсом. Перевал под снегом примерно с октября по май.
fa:
  name: پارسما
  short: >-
    روستایی برج‌دار و متروک بر کرانهٔ چپ آلازانیِ پیریکیتی، جایی که برج‌خانه‌ای هفت‌طبقه هنوز بر راه گیروی
    دیده‌بانی می‌کند.
  body: >-
    **در سدهٔ هجدهم، پارسما روستای اصلی پیریکیتی توشتی بود؛ امروز برج‌خانهٔ هفت‌طبقه‌اش جز باد کسی را
    پناه نمی‌دهد.**


    روستا بر تپه‌های پوشیده از علف در کرانهٔ چپ آلازانیِ پیریکیتی ایستاده است، کمی بالاتر از راه دارتلو–گیروی،
    در ارتفاع حدود ۲۱۰۰ متر. اسناد بایگانی سدهٔ هجدهم از آن به عنوان روستای مرکزی ناحیهٔ پیریکیتی یاد
    می‌کنند؛ خاندان‌های کاآدزه، تورغوایدزه و سولاکائوری در آن می‌زیستند و کاآدزه‌ها پرشمارترینشان بودند.
    سرشماری ۲۰۱۴ هیچ ساکن دائمی‌ای در آن ثبت نکرد.


    آن‌چه مانده، از سنگ لوح به شیوهٔ خشکه‌چین و بی‌ملات ساخته شده است. در لبهٔ غربی سه برج‌خانه شانه‌به‌شانه
    ایستاده‌اند: دو تا شش‌طبقه و یکی هفت‌طبقه که طبقهٔ بالایش اکنون فرو ریخته است؛ یکی از آن‌ها را هنوز
    «دژ روستا» می‌نامند. در لبهٔ شمال‌غربی برجی چهارطبقه قد برافراشته که هرچه بالاتر می‌رود، تندتر باریک
    می‌شود. در شرق، کنار گورستان، کلیسای تالاری کوچکی از اواخر سده‌های میانه سقف و دیوار شرقی‌اش را از
    دست داده، و در جنوب‌شرق، زیارتگاه تئودور مقدس همچنان جای نیایش است.


    به روایت سنت، برج نوک‌تیز پارسما را، مانند برج گیروی، پدر و پسری از کیست‌ها ساختند: توش‌ها در سال‌های
    آرامش همسایگان چچنی‌زبانِ آن سوی رشته‌کوه را به بنّایی می‌گرفتند.


    پارسما از سال ۲۰۱۸ اثری با اهمیت ملی است. تابستان‌ها در یکی از خانه‌های روستا هنوز آبجوی توشی دم می‌کنند،
    و در اواخر ژوئن و اوایل ژوئیه دامنه‌های پیرامون برج‌ها پر از گل می‌شود.


    نزدیک غروب بیایید، وقتی آفتاب از روی سنگ‌های لوح کنار می‌رود و برج‌ها دیگر به ویرانه نمی‌مانند، بلکه
    به نگهبانانی که هنوز چشم‌به‌راه تعویض پاس‌اند.
  tip: >-
    پارسما ایستگاهی در سفر توشتی است، هرگز مقصدی یک‌روزه نیست: شب را در دارتلو یا بالاتر در دره بمانید.
    مهمان‌خانه‌ها تقریباً از ژوئن تا سپتامبر بازند. نه فروشگاهی هست، نه خودپردازی، و آنتن هم ضعیف است؛
    پس پول نقد، خوراک و یک لایه لباس گرم بیاورید، چون شب‌ها حتی در ژوئیه سردند. خودرو را کنار راه بگذارید
    و پیاده بالا بروید — سربالایی کوتاه اما تند است. تنها جایی وارد برج‌ها شوید که کف طبقات سالم مانده؛
    درون چند برج فرو ریخته است. زیارتگاه‌های توشی آداب خود را دارند و زنان نباید به برخی از آن‌ها نزدیک
    شوند، پس پیش از رفتن به سوی زیارتگاه تئودور مقدس از اهالی بپرسید. یک ساعت کافی است.
  route: >-
    از تفلیس جادهٔ S5 را تا وازیانی و سپس Sh38 را از گردنهٔ گومبوری تا تلاوی بروید، آن‌گاه از آخمتا تا
    پشاولی ادامه دهید؛ باک را در آخمتا، آخرین جایگاه سوخت مطمئن، پر کنید. در پشاولی آسفالت تمام می‌شود
    و Sh44 به صورت راهی شنی از گردنهٔ آبانو (۲۸۲۶ متر) بالا می‌رود و سپس تا اومالو پایین می‌آید؛ همین
    بخش به‌تنهایی چهار ساعت یا بیشتر طول می‌کشد. از اومالو راهی خاکی با گذرگاه‌های رودخانه‌ای در حدود
    یک ساعت به دارتلو می‌رسد، و پس از آن راهی ناهموارتر در امتداد آلازانی پیریکیتی از کنار چشو تا پای
    پارسما می‌رود. روی‌هم حدود ۲۴۰ کیلومتر و ۷ ساعت و ۴۵ دقیقه وقت بگذارید. فقط خودروی آفرود: یک خودروی
    چهارچرخ‌محرک واقعی با فاصلهٔ زیاد از زمین ضروری است. گردنه تقریباً از اکتبر تا مه زیر برف است.
he:
  name: פרסמה
  short: כפר מגדלים נטוש על הגדה השמאלית של האלזני הפיריקיטי, שבו בית-מגדל בן שבע קומות עדיין שומר על
    הדרך לגירבי.
  body: >-
    **במאה ה-18 הייתה פרסמה הכפר הראשי של פיריקיטי תושטי; היום בית-המגדל שלה בן שבע הקומות אינו נותן מחסה
    לאיש מלבד הרוח.**


    הכפר ניצב על גבעות מוריקות על הגדה השמאלית של האלזני הפיריקיטי, טיפוס קצר מעל דרך דרטלו–גירבי, בגובה
    של כ-2,100 מטר. רישומי ארכיון מהמאה ה-18 מציינים אותו ככפר המרכזי של קהילת פיריקיטי, ביתן של משפחות
    קאאדזה, טורגוואידזה וסולקאורי, ומשפחת קאאדזה הייתה המרובה שבהן. מפקד 2014 לא רשם בו אף תושב קבע.


    מה שנותר בנוי מצפחה בבנייה יבשה, בלי טיט. בקצה המערבי עומדים כתף אל כתף שלושה בתי-מגדל: שניים בני
    שש קומות ואחד בן שבע, שקומתו העליונה קרסה; אחד מהם עדיין מכונה מבצר הכפר. בקצה הצפון-מערבי מתנשא מגדל
    בן ארבע קומות שהולך ומצר בחדות ככל שהוא עולה. במזרח, ליד בית הקברות, איבדה כנסיית אולם קטנה משלהי
    ימי הביניים את גגה ואת קירה המזרחי, ובדרום-מזרח מקדש תאודורוס הקדוש עדיין משמש מקום תפילה.


    על פי המסורת, את המגדל המחודד של פרסמה, כמו את זה שבגירבי, הקימו אב ובנו מבני הקיסטים: בשנות שלום
    שכרו התושים את שכניהם דוברי הצ'צ'נית מעבר לרכס כבנאים.


    מאז 2018 פרסמה היא אתר מורשת בעל חשיבות לאומית. בקיץ עדיין מבשלים בבית אחד בכפר בירה תושית, ובסוף
    יוני ותחילת יולי המדרונות סביב המגדלים מתמלאים פרחים.


    בואו לקראת ערב, כשהשמש עוזבת את הצפחה והמגדלים מפסיקים להיראות כחורבות ומתחילים להיראות כזקיפים שעדיין
    ממתינים להחלפת המשמרת.
  tip: >-
    פרסמה היא תחנה במסע בתושטי, לעולם לא טיול של יום אחד: לינו בדרטלו או במעלה העמק. בתי ההארחה פתוחים
    בערך מיוני עד ספטמבר. אין חנות, אין כספומט וכמעט אין קליטה, אז הביאו מזומן, אוכל ושכבה חמה; הלילות
    קרים גם ביולי. השאירו את הרכב ליד הדרך ועלו ברגל — הטיפוס קצר אבל תלול. היכנסו למגדלים רק היכן שהרצפות
    שרדו, כי בכמה מהם הן קרסו. למקדשים התושיים כללים משלהם, ולחלקם אסור לנשים להתקרב, לכן שאלו את המקומיים
    לפני שאתם ניגשים אל מקדש תאודורוס הקדוש. שעה מספיקה.
  route: >-
    מטביליסי סעו בכביש S5 עד ואזיאני ובכביש Sh38 דרך מעבר גומבורי לטלאווי, והמשיכו דרך אחמטה לפשאוולי;
    תדלקו באחמטה, תחנת הדלק האחרונה שאפשר לסמוך עליה. בפשאוולי נגמר האספלט, וכביש Sh44 מטפס כדרך חצץ אל
    מעבר אבאנו (2,826 מ') ויורד לאומאלו; הקטע הזה לבדו אורך ארבע שעות ויותר. מאומאלו ממשיכה דרך עפר עם
    חציות נהר לדרטלו, בתוך כשעה, ומעבר לה דרך משובשת עוד יותר עוקבת אחר האלזני הפיריקיטי, על פני צ'שו,
    עד למרגלות פרסמה. בסך הכול כ-240 ק״מ; הקצו 7 שעות ו-45 דקות. רק רכב שטח: רכב אמיתי בעל הנעה כפולה
    ומרווח גחון גבוה הוא הכרח. המעבר מושלג בערך מאוקטובר עד מאי.
ar:
  name: بارسما
  short: >-
    قرية أبراج مهجورة على الضفة اليسرى لنهر ألازاني البيريكيتي، لا يزال فيها برج سكني من سبعة طوابق يحرس
    الطريق إلى غيريفي.
  body: >-
    **في القرن الثامن عشر كانت بارسما القرية الرئيسية في بيريكيتي توشيتي؛ واليوم لا يؤوي برجها السكني
    ذو الطوابق السبعة سوى الريح.**


    تقوم القرية على روابٍ معشوشبة على الضفة اليسرى لألازاني البيريكيتي، على مسافة صعود قصير فوق طريق دارتلو–غيريفي،
    على ارتفاع نحو 2100 متر. وتذكرها سجلات أرشيفية من القرن الثامن عشر بوصفها القرية المركزية لجماعة بيريكيتي،
    وموطن عائلات كاآدزه وتورغفايدزه وسولاكاوري، وكانت عائلة كاآدزه أكثرها عدداً. ولم يسجّل تعداد 2014
    فيها أي ساكن دائم.


    ما بقي مبنيّ من الأردواز المرصوف جافاً، بلا ملاط. عند الطرف الغربي تقف ثلاثة أبراج سكنية كتفاً إلى
    كتف: اثنان من ستة طوابق، وثالث من سبعة انهار طابقه العلوي؛ ولا يزال أحدها يُعرف باسم حصن القرية. وعند
    الطرف الشمالي الغربي يرتفع برج من أربعة طوابق يضيق بحدة كلما علا. وإلى الشرق، قرب المقبرة، فقدت كنيسة
    صغيرة ذات قاعة واحدة من أواخر العصور الوسطى سقفها وجدارها الشرقي، بينما لا يزال مزار القديس ثيودور
    في الجنوب الشرقي مكاناً للصلاة.


    تقول الرواية المتوارثة إن برج بارسما المدبّب، مثل برج غيريفي، شيّده أب وابنه من الكيست: ففي سنوات
    السلم كان التوش يستأجرون جيرانهم الناطقين بالشيشانية من وراء السلسلة الجبلية بنّائين.


    صارت بارسما منذ عام 2018 معلماً ذا أهمية وطنية. وفي الصيف لا يزال بيت واحد في القرية يخمّر بيرة التوش،
    وفي أواخر يونيو وأوائل يوليو تمتلئ المنحدرات حول الأبراج بالأزهار.


    تعالَ قرب المساء، حين تغادر الشمس حجر الأردواز، فتكفّ الأبراج عن أن تبدو أطلالاً، وتصير أشبه بحرّاس
    ما زالوا ينتظرون تبديل النوبة.
  tip: >-
    بارسما محطة في رحلة إلى توشيتي، وليست وجهة ليوم واحد أبداً: بِت في دارتلو أو أعلى الوادي. تفتح بيوت
    الضيافة تقريباً من يونيو إلى سبتمبر. لا متجر ولا صراف آلي والإشارة ضعيفة، فاحمل النقود والطعام وطبقة
    دافئة من الملابس؛ فالليالي باردة حتى في يوليو. اترك السيارة عند الطريق واصعد مشياً — الصعود قصير لكنه
    شديد الانحدار. لا تدخل الأبراج إلا حيث بقيت الأرضيات، فقد انهارت في عدد منها من الداخل. لمزارات التوش
    قواعدها الخاصة، ولا يجوز للنساء الاقتراب من بعضها، فاسأل الأهالي قبل الاقتراب من مزار القديس ثيودور.
    تكفي ساعة واحدة.
  route: >-
    من تبليسي خذ الطريق S5 حتى فازياني، ثم Sh38 عبر ممر غومبوري إلى تيلافي، وتابع عبر آخميتا إلى بشافيلي؛
    وعبّئ الوقود في آخميتا، آخر محطة موثوقة. في بشافيلي ينتهي الإسفلت، ويصعد الطريق Sh44 حصوياً إلى ممر
    أبانو (2826 م) ثم ينحدر إلى أومالو؛ وهذا المقطع وحده يستغرق أربع ساعات أو أكثر. ومن أومالو يمضي مسار
    ترابي فيه مخاضات نهرية إلى دارتلو في نحو ساعة، وبعدها يتبع مسار أوعر نهر ألازاني البيريكيتي مروراً
    بتشيشو حتى سفح بارسما. المجموع نحو 240 كم و7 ساعات و45 دقيقة. فئة الطرق الوعرة فقط: لا غنى عن سيارة
    دفع رباعي حقيقية عالية الخلوص الأرضي. يغطي الثلج الممر تقريباً من أكتوبر إلى مايو.
