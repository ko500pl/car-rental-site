ka:
  name: ნაბახტევის ღვთისმშობლის ეკლესია
  short: >-
    ჭერათხევის ხეობაში, გორაზე მდგარი XV საუკუნის თავმდაბალი ეკლესია, რომლის შიგნითაც 1412–1431 წლებში
    „ღვთისმშობელი სამოთხეში“ დაიხატა.
  body: >-
    **1412–1431 წლებში ნაბახტევის თავზე, გორაზე, მხატვრებმა ნაცრისფერი ქვის უბრალო ეკლესიის შიგნით სამოთხე
    დახატეს.**


    ეკლესია ხაშურის მუნიციპალიტეტში, ჭერათხევის ხეობაში, სოფელ ნაბახტევის სამხრეთ-აღმოსავლეთ განაპირას,
    გორაზე დგას. XV საუკუნის დასაწყისში იგი ხეობის ფეოდალის, ქუცნა ამირეჯიბის დაკვეთით აიგო; ჩრდილოეთით
    ორსართულიანი სამრეკლო უდგას. გარედან თავმდაბალი ნაგებობაა: 14,5 × 9,35 მეტრის დარბაზი მონაცრისფრო
    თლილი კვადრებით. დასავლეთის კარი დიდი ხანია ამოშენებულია, ამიტომ შიგნით ჩრდილოეთიდან შედიხართ.


    აქ მოსვლის მიზეზი შიგნითაა. მოხატულობა ბიზანტიური ხელოვნების ფართო წრეს განეკუთვნება, მისი ყველაზე
    ცნობილი კომპოზიცია კი — ტახტზე მჯდომი ღვთისმშობელი წმინდანებს შორის, „ღვთისმშობელი სამოთხეში“ — ეკლესიის
    სახელს შეეფერება. ინტერიერის უჩვეულო ნაწილია აფსიდის წინ აღმართული კედელი, რომელიც საკურთხევლის ჩრდილოეთ
    ნაწილს მთლიანად ფარავს, სამხრეთით კი სატრიუმფო თაღში გადადის. დარბაზისა და საკურთხევლის გამყოფ კედელზე
    მხატვრობა სამ რეგისტრადაა განლაგებული: ზემოთ — ყოვლისმხედველი თვალი, შუაში — აბრაამის სტუმართმოყვარეობა,
    ქვემოთ — ეკლესიის მამები და სვიმეონ მესვეტე.


    ყველაფერი ადგილზე აღარ არის: ზოგიერთი კომპოზიცია კედლიდან ჩამოხსნეს და დღეს თბილისში, საქართველოს
    ხელოვნების მუზეუმში ინახება, ამიტომ მთელ ციკლს აქ ვერ ნახავთ. 2006 წელს ეკლესიას ეროვნული კულტურული
    ძეგლის სტატუსი მიენიჭა.


    ექვსი საუკუნის შემდეგაც ნაცრისფერი ქვა გარედან არაფერს გასცემს — ჩრდილოეთის კარი შეაღეთ.
  tip: >-
    შესვლა უფასოა. აქ არც სალარო, არც მცველი და არც კაფეა; თუ კარი დაკეტილია, სოფელში იკითხეთ. ჩაიცვით
    ისე, როგორც ნებისმიერ ქართულ ეკლესიაში — მხრები და მუხლები დაფარული, ქალებს თავსაფარი — და მოხატულობის
    გადაღებისას ნათებას (ფლეშს) ნუ გამოიყენებთ. ზოგიერთი ფრესკა თბილისშია, ამიტომ ციკლს სრულად ვერ ნახავთ;
    თუ მხატვრობა გაინტერესებთ, ხელოვნების მუზეუმში იკითხეთ, გამოფენილია თუ არა ჩამოხსნილი ფრაგმენტები.
    საჭმელი და საწვავი ხაშურშია. ერთი საათი საკმარისია; ახლოსაა სურამის ციხეც.
  route: >-
    126 კმ, დაახლოებით 1 საათი და 50 წუთი. ს1 (E60) მაგისტრალით დასავლეთისკენ, მცხეთის, გორისა და ქარელის
    გავლით, გომის გზაჯვარედინამდე იარეთ (დაახლოებით 123 კმ) და ჩრდილოეთით, შ22 გზაზე, საჩხერის მიმართულებით
    გადაუხვიეთ; ნაბახტევი ჭერათხევის ხეობაში დაახლოებით 3 კილომეტრშია. გზა თითქმის ბოლომდე მოასფალტებულია,
    ბოლოს მოკლე უსწორმასწორო მონაკვეთია; მანქანა სოფლის განაპირას დატოვეთ და ეკლესიამდე ფეხით აუყევით
    აღმართს. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში გამოდგება. საწვავი ს1-ზე ან ხაშურში შეავსეთ.
en:
  name: Nabakhtevi Virgin Mary Church
  short: >-
    A plain grey 15th-century church on a hill in the Cheratkhevi valley, painted inside between 1412
    and 1431 with the 'Holy Virgin in Paradise'.
  body: >-
    **Between 1412 and 1431, on a hill above Nabakhtevi, painters turned the inside of a plain grey church
    into paradise.**


    The church stands at the south-eastern edge of the village, in the Cheratkhevi valley of Khashuri
    municipality. It was built in the early 15th century at the order of Kutsna Amirejibi, lord of the
    valley, and has a two-storey bell tower to its north. From outside it is modest: a hall 14.5 by 9.35
    metres of greyish dressed stone. The west door was walled up long ago, so you enter from the north.


    The reason to come is inside. The murals belong to the wider circle of Byzantine art, and their best-known
    composition, the Virgin enthroned among saints and known as the 'Holy Virgin in Paradise', is fitting
    for a church dedicated to her. Look for an unusual feature: a wall raised in front of the apse that
    hides the northern part of the sanctuary and opens to the south into the triumphal arch. The wall
    between hall and sanctuary is painted in three registers: the all-seeing Eye at the top, the Hospitality
    of Abraham in the middle, and church fathers with Symeon the Stylite below.


    Not everything is still here. Some compositions were taken off the walls and are now held by the Art
    Museum of Georgia in Tbilisi, so what you see is not the whole cycle. The church was listed as a National
    Cultural Monument in 2006.


    Six hundred years on, the grey stone still gives nothing away from outside. Go round to the north
    door.
  tip: >-
    Free. There is no ticket office, guard or café; if the door is shut, ask in the village. Dress as
    for any Georgian church, with shoulders and knees covered and a headscarf for women, and do not use
    flash on the murals. Some panels are in Tbilisi, so expect an incomplete cycle; if the paintings are
    your reason for coming, ask at the Art Museum of Georgia whether the removed pieces are on show. Food
    and fuel are in Khashuri. An hour is enough, and Surami Fortress is close by.
  route: >-
    126 km, about 1 hour 50 minutes. Take the S1 (E60) west past Mtskheta, Gori and Kareli to the Gomi
    junction, about 123 km, and turn north onto the Sh22 towards Sachkhere; Nabakhtevi is about 3 km up
    the Cheratkhevi valley. The road is paved almost to the end, with a short rough stretch at the last.
    Park at the edge of the village and walk up the hill to the church. An economy car is fine all year.
    Fuel up on the S1 or in Khashuri.
ru:
  name: Церковь Богородицы в Набахтеви
  short: >-
    Скромная серая церковь XV века на холме в долине Чератхеви; в 1412–1431 годах её расписали изнутри,
    среди росписей — «Богородица в раю».
  body: >-
    **Между 1412 и 1431 годами на холме над Набахтеви художники превратили простую серую церковь изнутри
    в рай.**


    Церковь стоит на юго-восточной окраине села, в долине Чератхеви Хашурского муниципалитета. Её построили
    в начале XV века по заказу Куцны Амиреджиби, владетеля долины; к северу от неё поднимается двухъярусная
    колокольня. Снаружи она скромна: зал 14,5 на 9,35 метра из сероватого тёсаного камня. Западный вход
    давно заложен, поэтому внутрь попадают с севера.


    Ехать сюда стоит ради того, что внутри. Росписи принадлежат широкому кругу византийского искусства,
    а самая известная их композиция — Богородица на троне среди святых, так называемая «Богородица в раю»,
    — как нельзя лучше подходит храму, посвящённому ей. Обратите внимание на необычную деталь: перед апсидой
    возведена стена, которая скрывает северную часть алтаря, а с юга переходит в триумфальную арку. Стена
    между залом и алтарём расписана в три яруса: наверху — всевидящее Око, посередине — Гостеприимство
    Авраама, внизу — отцы церкви и Симеон Столпник.


    Сохранилось не всё. Часть композиций сняли со стен, и теперь они хранятся в Художественном музее Грузии
    в Тбилиси, так что цикл вы увидите не целиком. В 2006 году церкви присвоили статус национального памятника
    культуры.


    Шесть столетий спустя серый камень снаружи по-прежнему ничего не выдаёт. Обойдите храм и войдите через
    северную дверь.
  tip: >-
    Вход свободный. Кассы, сторожа и кафе нет; если дверь заперта, спросите в селе. Одевайтесь как для
    любой грузинской церкви — плечи и колени закрыты, женщинам платок — и не снимайте росписи со вспышкой.
    Часть панно находится в Тбилиси, так что цикл неполный; если вы едете именно ради фресок, узнайте
    в Художественном музее Грузии, выставлены ли снятые фрагменты. Еда и топливо — в Хашури. Часа вполне
    достаточно, а рядом крепость Сурами.
  route: >-
    126 км, около 1 часа 50 минут. Двигайтесь по S1 (E60) на запад мимо Мцхеты, Гори и Карели до развязки
    у Гоми, около 123 км, и сверните на север, на Sh22 — дорогу на Сачхере; Набахтеви примерно в 3 км
    вверх по долине Чератхеви. Асфальт почти до конца, лишь в самом конце короткий разбитый участок. Оставьте
    машину на краю села и поднимитесь на холм к церкви пешком. Машины эконом-класса хватит в любое время
    года. Заправьтесь на S1 или в Хашури.
fa:
  name: کلیسای مریم مقدس نباختوی
  short: >-
    کلیسایی ساده و خاکستری از سدهٔ پانزدهم بر تپه‌ای در درّهٔ چراتخوی که درونش میان ۱۴۱۲ و ۱۴۳۱ نقاشی
    شد، با نگارهٔ «مریم مقدس در بهشت».
  body: >-
    **میان سال‌های ۱۴۱۲ و ۱۴۳۱، بر تپه‌ای بالای نباختوی، نقاشان درونِ کلیسایی ساده از سنگ خاکستری را به
    بهشت بدل کردند.**


    کلیسا در لبهٔ جنوب‌شرقی روستا ایستاده است، در درّهٔ چراتخوی در شهرستان خاشوری. آن را در آغاز سدهٔ
    پانزدهم به فرمان کوتسنا امیرجیبی، خداوندگار این درّه، ساختند و در شمالش برج ناقوسی دوطبقه برپاست.
    از بیرون فروتن است: تالاری ۱۴٫۵ در ۹٫۳۵ متر از سنگ تراشیدهٔ مایل به خاکستری. درِ غربی دیرزمانی است
    که با دیوار بسته شده، پس از شمال وارد می‌شوید.


    دلیل آمدن در درون است. نقاشی‌های دیواری به حلقهٔ گسترده‌ترِ هنر بیزانسی تعلق دارند و نامدارترین ترکیب‌بندی‌شان،
    مریم نشسته بر تخت در میان قدیسان که به «مریم مقدس در بهشت» شهرت دارد، برازندهٔ کلیسایی است که به نام
    او وقف شده. به جزئیاتی غیرمعمول دقت کنید: دیواری که جلوی شاه‌نشینِ محراب (اَپس) برافراشته‌اند، بخش
    شمالی محراب را پنهان می‌کند و در سوی جنوب به طاق نصرت می‌پیوندد. دیوارِ میان تالار و محراب در سه ردیف
    نقاشی شده است: در بالا چشمِ همه‌بین، در میانه مهمان‌نوازی ابراهیم، و در پایین پدران کلیسا همراه با
    شمعون ستون‌نشین.


    همه چیز هنوز اینجا نیست. برخی ترکیب‌بندی‌ها را از دیوار جدا کرده‌اند و اکنون در موزهٔ هنر گرجستان
    در تفلیس نگهداری می‌شوند، پس آنچه می‌بینید تمام چرخه نیست. کلیسا در سال ۲۰۰۶ عنوان اثر فرهنگی ملی
    گرفت.


    ششصد سال گذشته و سنگ خاکستری هنوز از بیرون رازی بروز نمی‌دهد. دورش بگردید و از درِ شمالی وارد شوید.
  tip: >-
    ورود رایگان است. نه باجهٔ بلیت هست، نه نگهبان، نه کافه؛ اگر در بسته بود، از اهالی روستا بپرسید. مانند
    هر کلیسای گرجی لباس بپوشید: شانه‌ها و زانوها پوشیده و برای زنان روسری. از نقاشی‌ها با فلاش عکس نگیرید.
    برخی از قطعه‌ها در تفلیس‌اند، پس انتظار چرخه‌ای ناقص را داشته باشید؛ اگر نقاشی‌ها دلیل اصلی سفرتان
    است، از موزهٔ هنر گرجستان بپرسید که آیا قطعه‌های جداشده به نمایش درآمده‌اند یا نه. غذا و سوخت در خاشوری
    است. یک ساعت کافی است و قلعهٔ سورامی هم همین نزدیکی است.
  route: >-
    ۱۲۶ کیلومتر، حدود ۱ ساعت و ۵۰ دقیقه. از S1 (E60) به سوی غرب بروید و از کنار متسختا، گوری و کارلی بگذرید
    تا به تقاطع گومی برسید، حدود ۱۲۳ کیلومتر؛ آنجا به سمت شمال وارد Sh22، جادهٔ ساچخره، شوید. نباختوی
    حدود ۳ کیلومتر بالاتر در درّهٔ چراتخوی است. جاده تقریباً تا انتها آسفالت است و فقط تکهٔ کوتاهِ پایانی
    ناهموار است. خودرو را در لبهٔ روستا پارک کنید و پیاده از تپه تا کلیسا بالا بروید. خودروی اقتصادی در
    تمام سال کافی است. در S1 یا خاشوری سوخت‌گیری کنید.
he:
  name: כנסיית מרים הבתולה בנבחטבי
  short: >-
    כנסייה אפורה ופשוטה מהמאה ה-15 על גבעה בעמק צ'רתחבי, שחללה הפנימי צויר בין 1412 ל-1431 – ובין הציורים
    "הבתולה הקדושה בגן העדן".
  body: >-
    **בין 1412 ל-1431, על גבעה מעל נבחטבי, הפכו ציירים את פנים הכנסייה האפורה והפשוטה לגן עדן.**


    הכנסייה עומדת בקצה הדרום-מזרחי של הכפר, בעמק צ'רתחבי שבמחוז חשורי. היא נבנתה בראשית המאה ה-15 בהזמנת
    קוצנה אמירג'יבי, אדון העמק, ומצפון לה ניצב מגדל פעמונים בן שתי קומות. מבחוץ היא צנועה: אולם במידות
    14.5 על 9.35 מטר מאבן מסותתת אפרפרה. הפתח המערבי נאטם בבנייה לפני זמן רב, ולכן נכנסים מצפון.


    הסיבה לבוא נמצאת בפנים. ציורי הקיר שייכים למעגל הרחב של האמנות הביזנטית, והקומפוזיציה הנודעת שבהם
    – הבתולה יושבת על כס בין קדושים, המוכרת בשם "הבתולה הקדושה בגן העדן" – הולמת כנסייה המוקדשת לה. חפשו
    פרט יוצא דופן: קיר שהוקם לפני האפסיס מסתיר את החלק הצפוני של חלל המזבח, ובצדו הדרומי הוא נפתח אל קשת
    הניצחון. הקיר המפריד בין האולם לחלל המזבח מצויר בשלוש רצועות: למעלה העין הרואה-כול, באמצע הכנסת האורחים
    של אברהם, ולמטה אבות הכנסייה ושמעון איש העמוד.


    לא הכול נשאר כאן. חלק מהקומפוזיציות הוסרו מהקירות ושמורים כיום במוזיאון האמנות של גאורגיה בטביליסי,
    כך שמה שתראו אינו המחזור כולו. ב-2006 הוכרזה הכנסייה אתר מורשת תרבות לאומי.


    שש מאות שנה אחר כך, האבן האפורה עדיין אינה מסגירה דבר מבחוץ. הקיפו אותה והיכנסו בדלת הצפונית.
  tip: >-
    הכניסה חופשית. אין קופה, שומר או בית קפה; אם הדלת נעולה, שאלו בכפר. התלבשו כמו לכל כנסייה גאורגית
    – כתפיים וברכיים מכוסות, ולנשים כיסוי ראש – ואל תצלמו את ציורי הקיר בפלאש. חלק מהלוחות נמצאים בטביליסי,
    אז צפו למחזור חסר; אם הציורים הם הסיבה שלכם לבוא, בררו במוזיאון האמנות של גאורגיה אם הקטעים שהוסרו
    מוצגים. אוכל ודלק יש בחשורי. שעה מספיקה, ומבצר סורמי קרוב.
  route: >-
    126 ק״מ, כשעה ו-50 דקות. סעו מערבה בכביש S1 (E60) על פני מצחתה, גורי וקארלי עד צומת גומי, כ-123 ק״מ,
    ופנו צפונה לכביש Sh22, הדרך לסצ'חרה; נבחטבי נמצאת כ-3 ק״מ במעלה עמק צ'רתחבי. הכביש סלול כמעט עד הסוף,
    ורק בסופו קטע קצר ומשובש. חנו בקצה הכפר ועלו ברגל במעלה הגבעה אל הכנסייה. רכב מקטגוריית אקונומי מתאים
    בכל ימות השנה. תדלקו בכביש S1 או בחשורי.
ar:
  name: كنيسة السيدة العذراء في نباختيفي
  short: >-
    كنيسة رمادية متواضعة من القرن الخامس عشر على تلّ في وادي تشيراتخيفي، زُيّن داخلها بالرسوم بين 1412
    و1431، وفيها «العذراء القديسة في الفردوس».
  body: >-
    **بين عامي 1412 و1431، وعلى تلّ فوق نباختيفي، حوّل الرسامون داخل كنيسة رمادية بسيطة إلى فردوس.**


    تقوم الكنيسة عند الطرف الجنوبي الشرقي للقرية، في وادي تشيراتخيفي التابع لبلدية خاشوري. شُيّدت في مطلع
    القرن الخامس عشر بأمر من كوتسنا أميريجيبي، سيد الوادي، وإلى شمالها برج أجراس من طابقين. من الخارج
    تبدو متواضعة: قاعة أبعادها 14.5 في 9.35 متر من حجر منحوت يميل إلى الرمادي. وقد سُدّ الباب الغربي بالبناء
    منذ زمن بعيد، فالدخول من الشمال.


    سبب المجيء في الداخل. تنتمي الجداريات إلى الدائرة الأوسع للفن البيزنطي، وأشهر تكويناتها، العذراء جالسة
    على العرش بين القديسين والمعروفة باسم «العذراء القديسة في الفردوس»، يليق بكنيسة مكرّسة لها. وابحث
    عن سمة غير مألوفة: جدار أُقيم أمام الحنية يحجب الجزء الشمالي من الهيكل، وينفتح من جهة الجنوب على قوس
    النصر. أما الجدار الفاصل بين القاعة والهيكل فمرسوم في ثلاثة صفوف: في الأعلى العين التي ترى كل شيء،
    وفي الوسط ضيافة إبراهيم، وفي الأسفل آباء الكنيسة وسمعان العمودي.


    لم يبقَ كل شيء هنا. فقد نُزعت بعض التكوينات عن الجدران وهي محفوظة اليوم في متحف جورجيا للفنون في تبليسي،
    فما تراه ليس الدورة كاملة. وفي عام 2006 مُنحت الكنيسة صفة معلم ثقافي وطني.


    بعد ستة قرون ما زال الحجر الرمادي لا يبوح بشيء من الخارج. دُر حولها وادخل من الباب الشمالي.
  tip: >-
    الدخول مجاني. لا شباك تذاكر ولا حارس ولا مقهى؛ وإن وجدت الباب مغلقاً فاسأل في القرية. البس كما في
    أي كنيسة جورجية: كتفان وركبتان مستورتان وغطاء رأس للنساء، ولا تستعمل الفلاش مع الجداريات. بعض الألواح
    في تبليسي، فتوقّع دورة ناقصة؛ وإن كانت الرسوم سبب مجيئك فاسأل متحف جورجيا للفنون إن كانت القطع المنزوعة
    معروضة. الطعام والوقود في خاشوري. تكفي ساعة، وقلعة سورامي قريبة.
  route: >-
    126 كم، نحو ساعة و50 دقيقة. اتجه غرباً على الطريق S1 (E60) مروراً بمتسخيتا وغوري وكاريلي حتى تقاطع
    غومي، نحو 123 كم، ثم انعطف شمالاً إلى الطريق Sh22 المتجه إلى ساتشخيري؛ وتقع نباختيفي على بُعد نحو
    3 كم صعوداً في وادي تشيراتخيفي. الطريق معبّد حتى النهاية تقريباً، ولا يبقى في آخره إلا مقطع قصير وعر.
    اترك السيارة عند طرف القرية واصعد التلّ مشياً إلى الكنيسة. السيارة الاقتصادية تكفي طوال العام. تزوّد
    بالوقود على S1 أو في خاشوري.
