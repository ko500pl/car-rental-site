ka:
  name: წუნდა
  short: >-
    ჯავახეთის უძველესი ცენტრის ადგილი მტკვრის ხეობაში, ვარძიასთან: კლდეზე შემდგარი XII–XIII საუკუნეების
    ეკლესია, ჩუქურთმიანი კარიბჭე და ძველი ტერასები.
  body: >-
    **სანამ ზემოთ, კლდეში, ვარძიას გამოკვეთდნენ, წუნდა ჯავახეთის მთავარი ქალაქი იყო.**


    ქართული ტრადიცია მის დაარსებას ჯავახოსს, ქართველთა ერთ-ერთ ეთნარქს, მიაწერს: ლეონტი მროველის თქმით,
    მან ორი ციხე-ქალაქი — წუნდა და არტაანი — ააშენა. მატიანის მიხედვით, ძვ. წ. III საუკუნეში ფარნავაზ
    მეფემ აქ საერისთავო დააარსა, რომელიც ჯავახეთს, კოლასა და არტაანს მოიცავდა. გაქრისტიანების შემდეგ,
    როგორც მატიანე მოგვითხრობს, კონსტანტინე კეისრის მოციქულმა წუნდაში ეკლესიის ასაშენებლად ხუროები და
    განძი დატოვა, თვითონ კი მანგლისისკენ გაემართა. V საუკუნეში ვახტანგ გორგასალმა წუნდაში ეპისკოპოსი დასვა,
    ანდერძით კი ქალაქი მეუღლესა და ორ ვაჟს დაუტოვა. VIII–IX საუკუნეებში ცენტრი მტკვრის გაღმა, თმოგვის
    ციხეში გადავიდა და წუნდა ნელ-ნელა მინდვრებად იქცა.


    ქალაქისგან მიწის ზემოთ თითქმის არაფერი დარჩა. გორაზე წმინდა იოანე ნათლისმცემლის XII–XIII საუკუნეების
    დარბაზული ეკლესია დგას, პატარა კლდეზე, სუფთად გათლილი კვადრებით ნაშენი. დასავლეთ კარის ზემოთ ასომთავრული
    წარწერა მშენებლის სახელს ინახავს — იჩქით გურგენისძე, თამარ მეფის თანამედროვე ჯავახელი დიდებული. იმავე
    კაცმა 1186–1191 წლებში ახლომახლო ვანის ქვაბების მონასტერი განაახლა, მისი სახელი კი შორს, იერუსალიმის
    ჯვრის მონასტერშიც ახსოვდათ: მოსახსენიებელი დღე 23 ნოემბერს ჰქონდა დაწესებული.


    სამხრეთით მოგვიანებით მიშენებული კარიბჭის სვეტები ჩუქურთმითაა შემკული, მდიდრულადაა დამუშავებული სარკმლების
    ჩარჩოები და კარნიზიც. მოძებნეთ სამრეკლო და ქვაში ამოკვეთილი საწნახლები; შემორჩა XIX საუკუნის ქარვასლაც.
    გორის დასავლეთ ფერდს სამ მეტრამდე სიმაღლის ხელოვნური ტერასები საფეხურებად აუყვება — შესაძლოა ქალაქის
    დროინდელიც, მაგრამ ამის შესამოწმებლად აქ ჯერ არავის გაუთხრია. ნაქალაქარი წუნდა დღემდე მიწის ქვეშ ელოდება
    თავის არქეოლოგს.
  tip: >-
    შესვლა უფასოა, სალარო არ არის. ტუალეტს, კაფესა და წყალს აქ ნუ ელით — ყველაფერი ხუთიოდე კილომეტრში,
    ვარძიაშია, ამიტომ ორივე ადგილი ერთ დღეს გააერთიანეთ. ეკლესია გზიდან ორასიოდე მეტრშია, პატარა კლდეზე;
    ბილიკი მოკლეა, მაგრამ უსწორმასწორო, ამიტომ მყარი ფეხსაცმელი ჩაიცვით. თუ ეკლესია ღიაა, მხრები და მუხლები
    დაიფარეთ. ივლის-აგვისტოში ხეობა ხურდება — დილით ან გვიან ნაშუადღევს მოდით, როცა დახრილი შუქი კარიბჭის
    ჩუქურთმას კარგად ამოკვეთს. ნახევარი საათიდან ერთ საათამდე საკმარისია.
  route: >-
    თბილისიდან E60/ს1-ით ხაშურამდე, ს8-ით ბორჯომის გავლით ახალციხემდე, იქიდან კი ს11-ით ასპინძამდე იარეთ.
    ასპინძიდან გზა მტკვარს ზემოთ მიუყვება, ხერთვისის ციხეს ჩაუვლის და ვარძიისკენ მიდის; წუნდის გორა გზის
    აღმოსავლეთით, ვარძიამდე ხუთიოდე კილომეტრით ადრე ამოიმართება. სულ დაახლოებით 259 კილომეტრი და 4 საათი
    და 15 წუთია, ბოლომდე ასფალტზე, თუმცა მდინარისპირა ბოლო მონაკვეთი ვიწროა და უხილავი მოსახვევებით სავსე.
    ეკონომკლასი სავსებით საკმარისია. საწვავი ახალციხეში ან ასპინძაში ჩაასხით — შემდეგ ბენზინგასამართი
    იშვიათია.
en:
  name: Tsunda
  short: >-
    The site of Javakheti's oldest centre by the Mtkvari near Vardzia: a 12th–13th-century church on a
    rock, a carved porch and terraces nobody has dug.
  body: >-
    **Before Vardzia was cut into the cliffs upstream, Tsunda was the chief city of Javakheti.**


    Georgian tradition credits its founding to Javakhos, one of the forefathers of the Georgians: according
    to the chronicler Leonti Mroveli, he built two fortress-cities, Tsunda and Artaani. The chronicles
    go on to say that in the third century BC King Parnavaz made it the seat of a duchy covering Javakheti,
    Kola and Artaani. After the conversion, they relate, the envoy of Emperor Constantine left builders
    and treasure at Tsunda for a church before moving on to Manglisi. In the fifth century Vakhtang Gorgasali
    installed a bishop here and willed the town to his wife and two sons. By the eighth or ninth century
    the centre had shifted across the Mtkvari to the fortress of Tmogvi, and Tsunda slowly dissolved into
    fields.


    Almost nothing of the city stands above ground. On the hill is the church of St John the Baptist,
    a twelfth- or thirteenth-century hall church on a small rock, built of finely dressed blocks. An asomtavruli
    inscription over the west door preserves the builder's name: Ichkit Gurgenisdze, a Javakheti nobleman
    of Queen Tamar's time. The same man restored the nearby cave monastery of Vanis Kvabebi in 1186–1191,
    and his name was remembered as far away as the Georgian Monastery of the Cross in Jerusalem, where
    a commemoration was kept for him on 23 November.


    The south porch, added later, has carved columns, and the window frames and cornice are richly worked.
    Look for the bell tower and wine presses cut into the rock; a nineteenth-century caravanserai also
    survives. Stepped terraces up to three metres high climb the western side of the hill, perhaps as
    old as the city, but nobody has yet dug to find out. Tsunda is still waiting for its archaeologist.
  tip: >-
    Entry is free and there is no ticket office. Do not expect toilets, a café or water here: all of that
    is at Vardzia, about five kilometres on, so pair the two in one day. The church stands a couple of
    hundred metres from the road on a small rock; the path is short but uneven, so wear proper shoes.
    If the church is open, cover shoulders and knees. The valley bakes in July and August, so come in
    the morning or late afternoon, when low light sharpens the carving on the porch. Half an hour to an
    hour is enough.
  route: >-
    From Tbilisi take the E60/S1 to Khashuri, the S8 through Borjomi to Akhaltsikhe, then the S11 to Aspindza.
    From Aspindza the road follows the Mtkvari upstream past Khertvisi fortress towards Vardzia; Tsunda's
    hill rises just east of the road, about five kilometres before Vardzia. In all it is roughly 259 km
    and 4 hours 15 minutes, on asphalt throughout, though the last stretch along the river is narrow with
    blind bends. An economy car is fine. Fill up in Akhaltsikhe or Aspindza, as fuel stations are scarce
    beyond.
ru:
  name: Цунда
  short: >-
    Место древнейшего центра Джавахети у Мтквари близ Вардзии: церковь XII–XIII веков на скале, резной
    притвор и террасы, которых никто не раскапывал.
  body: >-
    **Прежде чем выше по течению в скалах высекли Вардзию, главным городом Джавахети была Цунда.**


    Грузинская традиция приписывает её основание Джавахосу, одному из праотцов грузин: по словам летописца
    Леонтия Мровели, он построил два города-крепости — Цунду и Артаани. Дальше летописи сообщают, что
    в III веке до н. э. царь Фарнаваз сделал её центром эриставства, охватывавшего Джавахети, Колу и Артаани.
    После обращения Грузии, как они рассказывают, посланец императора Константина оставил в Цунде строителей
    и сокровища для церкви, а сам двинулся дальше, в Манглиси. В V веке Вахтанг Горгасали поставил здесь
    епископа и завещал город жене и двум сыновьям. К VIII или IX веку центр переместился за Мтквари, в
    крепость Тмогви, и Цунда постепенно растворилась в полях.


    Над землёй от города почти ничего не осталось. На холме стоит церковь Иоанна Крестителя — зальный
    храм XII или XIII века на небольшой скале, сложенный из тщательно тёсаных блоков. Надпись асомтаврули
    над западной дверью сохранила имя строителя: Ичкит Гургенисдзе, джавахетский вельможа времён царицы
    Тамар. Этот же человек в 1186–1191 годах восстановил неподалёку пещерный монастырь Ванис-Квабеби,
    а имя его помнили даже в грузинском Крестовом монастыре в Иерусалиме, где 23 ноября совершали по нему
    поминовение.


    Южный притвор, пристроенный позже, украшен резными колоннами, богато проработаны и обрамления окон,
    и карниз. Поищите колокольню и высеченные в скале винные давильни; сохранился и караван-сарай XIX
    века. Ступенчатые террасы высотой до трёх метров поднимаются по западному склону холма; возможно,
    они ровесники города, но никто пока не копал, чтобы это выяснить. Цунда всё ещё ждёт своего археолога.
  tip: >-
    Вход свободный, кассы нет. Не рассчитывайте здесь на туалеты, кафе или воду: всё это есть в Вардзии,
    примерно в пяти километрах дальше, так что совместите их в один день. Церковь стоит в паре сотен метров
    от дороги на небольшой скале; тропа короткая, но неровная, поэтому наденьте нормальную обувь. Если
    церковь открыта, прикройте плечи и колени. В июле и августе долина раскаляется, так что приезжайте
    утром или ближе к вечеру, когда низкий свет чётче прорисовывает резьбу притвора. Хватит от получаса
    до часа.
  route: >-
    Из Тбилиси поезжайте по E60/S1 до Хашури, по S8 через Боржоми до Ахалцихе, затем по S11 до Аспиндзы.
    От Аспиндзы дорога идёт вверх по Мтквари мимо крепости Хертвиси к Вардзии; холм Цунды поднимается
    сразу к востоку от дороги, примерно в пяти километрах не доезжая Вардзии. Всего около 259 км и 4 часа
    15 минут, везде по асфальту, хотя последний отрезок вдоль реки узкий, с поворотами без обзора. Машины
    эконом-класса достаточно. Заправьтесь в Ахалцихе или Аспиндзе: дальше заправок мало.
fa:
  name: تسوندا
  short: >-
    جایگاه کهن‌ترین مرکز جاواختی کنار متکواری نزدیک واردزیا: کلیسایی از سده‌های دوازدهم و سیزدهم بر صخره،
    ایوانی کنده‌کاری‌شده و تراس‌هایی که هنوز کاوش نشده‌اند.
  body: >-
    **پیش از آنکه واردزیا در بالادست رود در دل صخره‌ها کنده شود، تسوندا شهر اصلی جاواختی بود.**


    سنت گرجی بنیادش را به جاواخوس، یکی از نیاکان گرجیان، نسبت می‌دهد: به روایت وقایع‌نگار، لئونتی مروولی،
    او دو شهر-دژ ساخت: تسوندا و آرتائانی. وقایع‌نامه‌ها در ادامه می‌گویند که در سدهٔ سوم پیش از میلاد،
    شاه پارناواز آن را مقر دوک‌نشینی کرد که جاواختی، کولا و آرتائانی را در بر می‌گرفت. به روایت همین متون،
    پس از گرویدن گرجستان به مسیحیت، فرستادهٔ امپراتور کنستانتین سازندگان و گنجی برای ساختن کلیسا در تسوندا
    به جا گذاشت و سپس رهسپار مانگلیسی شد. در سدهٔ پنجم، واختانگ گورگاسالی اسقفی در اینجا گماشت و شهر را
    برای همسر و دو پسرش به ارث گذاشت. تا سدهٔ هشتم یا نهم، مرکز به آن سوی متکواری، به دژ تموگوی، منتقل
    شده بود و تسوندا آرام‌آرام در کشتزارها حل شد.


    از شهر تقریباً چیزی بر روی زمین نمانده است. بر تپه، کلیسای یحیی تعمیددهنده ایستاده است: کلیسایی تک‌تالاری
    از سدهٔ دوازدهم یا سیزدهم بر صخره‌ای کوچک، ساخته از سنگ‌هایی به‌دقت تراش‌خورده. کتیبه‌ای به خط آسومتاورولی
    بر فراز درِ غربی نام سازنده را نگه داشته است: ایچکیت گورگنیسدزه، از نجبای جاواختی در روزگار ملکه تامار.
    همین مرد در ۱۱۸۶ تا ۱۱۹۱ صومعهٔ غاریِ نزدیکِ وانیس کوابِبی را مرمت کرد، و نامش تا صومعهٔ گرجیِ صلیب
    در اورشلیم به یاد مانده بود؛ جایی که در ۲۳ نوامبر برایش مراسم یادبود برگزار می‌شد.


    ایوان جنوبی، که بعدها افزوده شد، ستون‌هایی کنده‌کاری‌شده دارد، و قاب پنجره‌ها و قرنیز با ظرافت فراوان
    کار شده‌اند. به دنبال برج ناقوس و چرخشت‌های شرابِ کنده‌شده در صخره بگردید؛ کاروانسرایی از سدهٔ نوزدهم
    نیز برجای مانده است. تراس‌های پلکانی به بلندی حداکثر سه متر از دامنهٔ غربی تپه بالا می‌روند؛ شاید
    به قدمت خود شهر باشند، اما هنوز هیچ‌کس برای دانستنش کاوش نکرده است. تسوندا هنوز چشم‌به‌راه باستان‌شناس
    خویش است.
  tip: >-
    ورود رایگان است و گیشهٔ بلیتی در کار نیست. اینجا انتظار سرویس بهداشتی، کافه یا آب نداشته باشید: همهٔ
    این‌ها در واردزیاست، حدود پنج کیلومتر جلوتر، پس این دو را در یک روز با هم ببینید. کلیسا بر صخره‌ای
    کوچک، حدود دویست متر دورتر از جاده، ایستاده است؛ مسیر کوتاه اما ناهموار است، پس کفش مناسب بپوشید.
    اگر کلیسا باز بود، شانه‌ها و زانوها را بپوشانید. دره در ژوئیه و اوت داغ می‌شود، پس صبح یا اواخر بعدازظهر
    بیایید، وقتی نور کم‌ارتفاع کنده‌کاری‌های ایوان را برجسته‌تر می‌کند. نیم تا یک ساعت کافی است.
  route: >-
    از تفلیس E60/S1 را تا خاشوری بگیرید، S8 را از راه بورجومی تا آخالتسیخه، سپس S11 را تا آسپیندزا. از
    آسپیندزا جاده در امتداد متکواری رو به بالادست، از کنار دژ خرتویسی، به سوی واردزیا می‌رود؛ تپهٔ تسوندا
    درست در شرق جاده، حدود پنج کیلومتر پیش از واردزیا، سر برمی‌آورد. روی هم حدود ۲۵۹ کیلومتر و ۴ ساعت
    و ۱۵ دقیقه، سراسر آسفالت، هرچند آخرین بخش در کنار رود باریک است و پیچ‌های کور دارد. خودروی اقتصادی
    کافی است. در آخالتسیخه یا آسپیندزا باک را پر کنید، چون پس از آن پمپ بنزین کم است.
he:
  name: צונדה
  short: >-
    אתר המרכז העתיק ביותר של ג'אווחטי על המטקוורי ליד ורדזיה: כנסייה מהמאות ה-12–13 על סלע, אכסדרה מגולפת
    וטרסות שאיש עוד לא חפר בהן.
  body: >-
    **לפני שוורדזיה נחצבה בצוקים במעלה הנהר, צונדה הייתה העיר הראשית של ג'אווחטי.**


    המסורת הגאורגית מייחסת את ייסודה לג'אווחוס, מאבותיהם הקדמונים של הגאורגים: לפי הכרוניקן לאונטי מרוולי,
    הוא בנה שתי ערי-מבצר, צונדה וארטאני. הכרוניקות מספרות עוד שבמאה ה-3 לפנה"ס עשה אותה המלך פרנבז למושבה
    של דוכסות שכללה את ג'אווחטי, קולה וארטאני. לאחר התנצרותה של גאורגיה, כך הן מספרות, השאיר שליחו של
    הקיסר קונסטנטינוס בצונדה בנאים ואוצר לבניית כנסייה, ורק אז המשיך למנגליסי. במאה ה-5 הושיב כאן וחטנג
    גורגסלי בישוף, והוריש את העיר לאשתו ולשני בניו. עד המאה ה-8 או ה-9 עבר המרכז אל מעבר למטקוורי, למבצר
    תמוגווי, וצונדה התמוססה לאיטה אל תוך השדות.


    כמעט דבר מן העיר אינו עומד מעל פני הקרקע. על הגבעה ניצבת כנסיית יוחנן המטביל, כנסיית אולם מהמאה ה-12
    או ה-13 על סלע קטן, בנויה מגושי אבן מסותתים בקפידה. כתובת באסומטברולי מעל הדלת המערבית שימרה את שם
    הבונה: איצ'קיט גורגניסדזה, אציל מג'אווחטי בימי המלכה תמר. אותו אדם שיקם בשנים 1186–1191 את מנזר המערות
    הסמוך ואניס קוואבבי, ושמו נזכר אפילו במנזר המצלבה הגאורגי בירושלים, שם נערכה לזכרו אזכרה ב-23 בנובמבר.


    לאכסדרה הדרומית, שנוספה מאוחר יותר, עמודים מגולפים, ומסגרות החלונות והכרכוב מעוטרים בעושר. חפשו את
    מגדל הפעמונים ואת גתות היין החצובות בסלע; השתמר גם קרוונסראי מהמאה ה-19. טרסות מדורגות בגובה של עד
    שלושה מטרים מטפסות במדרון המערבי של הגבעה, אולי עתיקות כמו העיר עצמה, אבל איש עדיין לא חפר כדי לברר.
    צונדה עדיין מחכה לארכאולוג שלה.
  tip: >-
    הכניסה חופשית ואין קופה. אל תצפו כאן לשירותים, לבית קפה או למים: כל אלה נמצאים בוורדזיה, כחמישה קילומטרים
    הלאה, אז שלבו את שתיהן ביום אחד. הכנסייה עומדת על סלע קטן, כמאתיים מטרים מהכביש; השביל קצר אבל לא
    אחיד, לכן נעלו נעליים מתאימות. אם הכנסייה פתוחה, כסו כתפיים וברכיים. העמק לוהט ביולי ובאוגוסט, לכן
    בואו בבוקר או בשעות אחר הצהריים המאוחרות, כשהאור הנמוך מחדד את הגילופים שבאכסדרה. חצי שעה עד שעה מספיקות.
  route: >-
    מטביליסי קחו את E60/S1 עד חשורי, את S8 דרך בורג'ומי עד אחלציחה, ואז את S11 עד אספינדזה. מאספינדזה
    הכביש עולה במעלה המטקוורי, על פני מבצר חרטוויסי, לכיוון ורדזיה; הגבעה של צונדה מתנשאת ממש ממזרח לכביש,
    כחמישה קילומטרים לפני ורדזיה. בסך הכול כ-259 ק"מ ו-4 שעות ורבע, על אספלט לכל האורך, אם כי הקטע האחרון
    לאורך הנהר צר ויש בו עיקולים עיוורים. רכב חסכוני מתאים. תדלקו באחלציחה או באספינדזה, כי מעבר להן תחנות
    הדלק מעטות.
ar:
  name: تسوندا
  short: >-
    موقع أقدم مراكز جافاخيتي على نهر متكفاري قرب فاردزيا: كنيسة من القرنين الثاني عشر والثالث عشر على
    صخرة، ورواق منحوت، ومصاطب لم يُنقّب فيها أحد.
  body: >-
    **قبل أن تُنحت فاردزيا في المنحدرات الصخرية أعلى النهر، كانت تسوندا المدينة الرئيسية في جافاخيتي.**


    ينسب التقليد الجورجي تأسيسها إلى جافاخوس، أحد أسلاف الجورجيين الأوائل: فبحسب المؤرخ ليونتي مروفيلي،
    بنى مدينتين حصينتين هما تسوندا وأرتاني. وتمضي الحوليات فتذكر أن الملك فارنافاز جعلها في القرن الثالث
    قبل الميلاد مقرًّا لدوقية تشمل جافاخيتي وكولا وأرتاني. وبعد اعتناق جورجيا المسيحية، كما تروي، ترك
    مبعوث الإمبراطور قسطنطين في تسوندا بنّائين وكنزًا لبناء كنيسة قبل أن يمضي إلى مانغليسي. وفي القرن
    الخامس نصّب فاختانغ غورغاسالي فيها أسقفًا، وأوصى بالمدينة لزوجته وابنيه. وبحلول القرن الثامن أو التاسع
    انتقل المركز إلى الضفة الأخرى من متكفاري، إلى قلعة تموغفي، وذابت تسوندا شيئًا فشيئًا في الحقول.


    لم يبقَ من المدينة فوق الأرض شيء يُذكر تقريبًا. على التل تقوم كنيسة يوحنا المعمدان، كنيسة قاعة من
    القرن الثاني عشر أو الثالث عشر على صخرة صغيرة، مبنية من كتل حجرية مهذبة بعناية. ويحفظ نقش بخط الأسومتافرولي
    فوق الباب الغربي اسم بانيها: إيتشكيت غورغينيسدزه، أحد نبلاء جافاخيتي في عهد الملكة تامار. وهو نفسه
    الذي رمّم دير الكهوف القريب فانيس كفابيبي بين عامي 1186 و1191، وقد بقي اسمه مذكورًا حتى في دير الصليب
    الجورجي في القدس، حيث كان يُقام له تذكار في 23 نوفمبر.


    الرواق الجنوبي، الذي أُضيف لاحقًا، ذو أعمدة منحوتة، وأُطر النوافذ والإفريز مشغولة بغنى. ابحث عن برج
    الأجراس ومعاصر النبيذ المحفورة في الصخر؛ وقد بقي أيضًا خان للقوافل من القرن التاسع عشر. وتصعد مصاطب
    متدرجة يصل ارتفاعها إلى ثلاثة أمتار على الجانب الغربي من التل، ربما كانت بقِدم المدينة نفسها، لكن
    أحدًا لم يحفر بعد ليعرف. ما زالت تسوندا تنتظر عالم آثارها.
  tip: >-
    الدخول مجاني ولا يوجد شبّاك تذاكر. لا تتوقع هنا دورات مياه أو مقهى أو ماءً: فكل ذلك في فاردزيا، على
    بعد نحو خمسة كيلومترات، فاجمع بينهما في يوم واحد. تقف الكنيسة على صخرة صغيرة على بعد مئتي متر أو نحوها
    من الطريق؛ الممر قصير لكنه غير مستوٍ، فارتدِ حذاءً مناسبًا. إن كانت الكنيسة مفتوحة فغطِّ كتفيك وركبتيك.
    يشتد الحر في الوادي في يوليو وأغسطس، فتعالَ صباحًا أو في آخر العصر، حين يُبرز الضوء المنخفض نقوش الرواق.
    تكفي نصف ساعة إلى ساعة.
  route: >-
    من تبليسي خذ E60/S1 إلى خاشوري، ثم S8 عبر بورجومي إلى أخالتسيخي، ثم S11 إلى أسبيندزا. ومن أسبيندزا
    يسير الطريق بمحاذاة متكفاري صعودًا نحو المنبع، مارًّا بقلعة خيرتفيسي، نحو فاردزيا؛ ويرتفع تل تسوندا
    شرق الطريق مباشرة، قبل فاردزيا بنحو خمسة كيلومترات. المجموع نحو 259 كم و4 ساعات و15 دقيقة، على الأسفلت
    طوال الطريق، وإن كان المقطع الأخير بمحاذاة النهر ضيقًا كثير المنعطفات العمياء. السيارة الاقتصادية
    كافية. تزوّد بالوقود في أخالتسيخي أو أسبيندزا، فمحطات الوقود نادرة بعدهما.
