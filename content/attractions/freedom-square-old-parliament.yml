ka:
  name: თავისუფლების მოედანი და ძველი პარლამენტი
  short: ქალაქის ცენტრალური მოედანი, რომელმაც ხუთჯერ იცვალა სახელი და თითოეული ცვლილება რეჟიმის შეცვლას
    ნიშნავდა.
  body: >-
    **თუ თბილისს შუაგული აქვს, ის აქ არის.** მოედანი XIX საუკუნის დასაწყისში გაჩნდა ქალაქის ძველი კედლების
    გარეთ და მას შემდეგ ხუთჯერ გადაარქვეს სახელი: ერევნის მოედანი, პალიაშვილის, ბერიას, ლენინის და ბოლოს
    — თავისუფლების.


    ცენტრში 2006 წლიდან დგას ოქროსფერი წმინდა გიორგი გველეშაპთან, ზურაბ წერეთლის ნამუშევარი, დაახლოებით
    35 მეტრის სვეტზე. მანამდე იმავე ადგილას ლენინის ძეგლი იდგა, რომელიც 1990 წლის აგვისტოში ერთ ღამეში
    ჩამოხსნეს. სამხრეთ მხარეს ქალაქის მერიაა — 1870-იანი წლების მავრიტანული სტილის შენობა საათის კოშკით,
    რომელიც თბილისის ერთ-ერთი ყველაზე ამოსაცნობი ფასადია.


    მოედანს ერთი კონკრეტული ისტორიაც აქვს: 1907 წლის 26 ივნისს აქ ბოლშევიკებმა, კამოს მეთაურობით და სტალინის
    მონაწილეობით, ბანკის ფულადი ტრანსპორტი ბომბებით დაესხნენ თავს. ათეულობით ადამიანი დაიღუპა. 1989-ის,
    2003-ის და შემდგომი წლების საპროტესტო ტალღები ასევე ამ ქვაფენილზე გაიარა.


    მოედნიდან რუსთაველისკენ ასვლისას მარჯვნივ ჩნდება ძველი პარლამენტის შენობა გრძელი კოლონადითა და ფართო
    კიბით. აქ იჯდა უზენაესი საბჭო, აქვე გამოცხადდა დამოუკიდებლობა 1991 წელს, და აქვე მოხდა 2003 წლის ვარდების
    რევოლუციის კულმინაცია. 2012 წელს პარლამენტი ქუთაისში გადაიტანეს, შემდეგ კი ნაწილობრივ დააბრუნეს —
    შენობა კვლავ მოქმედია და შიგნით არ შედიან.


    თავად მოედანი გასაჩერებელი ადგილი კი არა, გამზირის დასაწყისია: ტრანსპორტის კვანძი, საიდანაც ძველი
    ქალაქიც იწყება და რუსთაველიც.


    მოედანს თანამედროვე ისტორიაც ახსოვს: 2005 წლის მაისში, აშშ-ის პრეზიდენტის ჯორჯ ბუშის გამოსვლისას,
    ბრბოდან სცენისკენ ხელყუმბარა ისროლეს, რომელიც არ აფეთქდა. დღეს მოედანი ყოველდღიურ რეჟიმში ტრანსპორტის
    რგოლია, საღამოს კი შუქებში ერთადერთი ადგილია ცენტრში, სადაც ცა ფართოდ ჩანს — ძველი ქალაქის ვიწრო ქუჩების
    შემდეგ ეს შესამჩნევია.
  tip: >-
    ნახევარი საათი სავსებით საკმარისია — ეს გასავლელი და არა გასაჩერებელი ადგილია. მოედანი მიწისზედა გადასასვლელების
    გარეშეა: ყველა მხარეს მიწისქვეშა გვირაბით გადადიან, სადაც პატარა მაღაზიები და ვალუტის გადამცვლელებია.
    კიბეები ეტლისთვის რთულია. აქვეა მეტროსადგური „თავისუფლების მოედანი", ტურისტული საინფორმაციო ცენტრი
    და ბანკომატები. ტუალეტი გვირაბსა და მიმდებარე კაფეებშია. ზაფხულში მოედანზე ჩრდილი თითქმის არ არის.
  route: >-
    მოედანი თბილისის ყველა მთავარი გამზირის კვანძია და მანქანით მასთან მისვლა ადვილია, გაჩერება კი — არა.
    თავად მოედანზე დგომა შეუძლებელია. გამოიყენე მიწისქვეშა ანაზღაურებადი პარკინგი სავაჭრო ცენტრის ქვეშ,
    შესასვლელით ფრედ ბერნის მხრიდან, ან ზონალური ადგილები პუშკინისა და ლერმონტოვის ქუჩებზე. ლურჯ ზონაში
    დგომა ნებართვას მოითხოვს — ქირავნობის მანქანებს ის ჩვეულებრივ აქვთ, თუმცა ჯობია გამქირავებელს დაუზუსტო.
    საწვავი მოედნიდან ერთ კილომეტრში, ბარათაშვილის გასწვრივ. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Freedom Square and the Old Parliament
  short: The city's central square, renamed five times, each renaming marking the arrival of a different
    regime.
  body: >-
    **If Tbilisi has a middle, this is it.** The square appeared in the early nineteenth century outside
    the old city walls, and it has been renamed five times since: Yerevan Square, then Paliashvili, then
    Beria, then Lenin, and finally Freedom.


    At the centre, since 2006, stands a gilded St George spearing the dragon by Zurab Tsereteli, on a
    column some thirty-five metres high. Before it there was a statue of Lenin, taken down overnight in
    August 1990. On the south side is City Hall, an 1870s Moorish-style building with a clock tower —
    one of the most recognisable facades in the city, and still the mayor's office.


    The square also carries one very specific piece of history. On 26 June 1907 Bolsheviks led by Kamo,
    with Stalin somewhere in the planning, ambushed a bank convoy here with bombs and gunfire; dozens
    of people were killed and the money went to fund the party. The mass protests of 1989, of 2003, and
    of most years since have crossed the same paving.


    Walking up towards Rustaveli, the Old Parliament appears on the right: a long colonnade above a wide
    flight of steps. This was the Supreme Soviet, then the chamber where independence was declared in
    1991, and the building the Rose Revolution walked into in November 2003. Parliament was moved to Kutaisi
    in 2012 and later partly moved back, so the building is in use and not open to visitors — you look
    at it from the pavement.


    The square itself is a place you pass through rather than linger in: a traffic knot where the old
    town, the avenue and the metro all meet.


    One more recent episode belongs here: in May 2005, during a speech by the American president George
    W. Bush, a live grenade was thrown from the crowd towards the platform and failed to detonate. On
    an ordinary day the square's one real quality is its openness: after the narrow lanes of the old town,
    this is the only place in the centre where you see a wide piece of sky.
  tip: >-
    Half an hour covers it — this is a junction, not a destination. There are no surface crossings; every
    side is reached through pedestrian tunnels lined with small shops and currency changers, and the stairs
    are awkward with a pushchair or wheelchair. Liberty Square metro station, a tourist information point
    and plenty of cash machines are all here. Toilets are in the underpass and in nearby cafes. In summer
    the square offers almost no shade, so cross it early or late.
  route: >-
    Every main avenue in Tbilisi meets here, so driving to the square is easy and stopping at it is not.
    There is no parking on the square itself. Use the paid underground car park beneath the shopping centre,
    entered from the Fred Bern side, or the metered bays on Pushkin and Lermontov streets. The city's
    paid zones require a permit; hire cars usually carry one, but confirm with the rental company. Fuel
    is available about a kilometre away along Baratashvili. An economy car is enough, and a small one
    parks far more easily here.
ru:
  name: Площадь Свободы и здание старого парламента
  short: Центральная площадь города, менявшая имя пять раз, и каждое переименование означало смену режима.
  body: >-
    **Если у Тбилиси есть середина, то она здесь.** Площадь возникла в начале XIX века за пределами старых
    городских стен и с тех пор меняла название пять раз: Эриванская, затем Палиашвили, Берии, Ленина и
    наконец — Свободы.


    В центре с 2006 года стоит позолоченный святой Георгий, поражающий дракона, работы Зураба Церетели,
    на колонне высотой около тридцати пяти метров. До него здесь был памятник Ленину, снятый за одну ночь
    в августе 1990 года. С южной стороны — здание мэрии, мавританская постройка 1870-х с часовой башней,
    один из самых узнаваемых фасадов города и по сей день кабинет мэра.


    За площадью числится и один вполне конкретный эпизод. 26 июня 1907 года большевики во главе с Камо,
    при участии Сталина в подготовке, напали здесь бомбами на банковский обоз; погибли десятки людей,
    а деньги ушли в партийную кассу. Протестные волны 1989, 2003 и большинства последующих лет проходили
    по этой же мостовой.


    Поднимаясь к Руставели, справа видишь здание старого парламента: длинная колоннада над широкой лестницей.
    Здесь заседал Верховный совет, здесь в 1991 году провозгласили независимость, сюда в ноябре 2003-го
    вошла «революция роз». В 2012 году парламент перевели в Кутаиси, потом частично вернули, так что здание
    действующее и внутрь не пускают — на него смотрят с тротуара.


    Сама площадь — место, которое проходят, а не место, где сидят: транспортный узел, где сходятся старый
    город, проспект и метро.


    У площади есть и недавняя история: в мае 2005 года, во время выступления американского президента
    Джорджа Буша, из толпы в сторону трибуны бросили боевую гранату, которая не взорвалась. В обычный
    же день это просто кольцевая развязка с памятником посередине, и её единственное настоящее достоинство
    — открытость: после узких переулков старого города здесь впервые видишь широкий кусок неба.
  tip: >-
    Получаса вполне достаточно: это перекрёсток, а не цель поездки. Наземных переходов нет, на любую сторону
    идут через подземные туннели с лавками и обменниками, лестницы неудобны с коляской и креслом. Здесь
    же станция метро «Площадь Свободы», туристический инфоцентр и множество банкоматов. Туалеты в переходе
    и в соседних кафе. Летом тени на площади почти нет, так что переходите её утром или под вечер.
  route: >-
    Здесь сходятся все главные магистрали, поэтому доехать до площади легко, а остановиться — нет. На
    самой площади парковки не существует. Пользуйтесь платным подземным паркингом под торговым центром
    со стороны улицы Фреда Берна либо размеченными местами на улицах Пушкина и Лермонтова. Городские платные
    зоны требуют разрешения; у прокатных машин оно обычно есть, но лучше уточнить в компании. Заправка
    примерно в километре, вдоль улицы Бараташвили. Машины эконом-класса достаточно, а маленькая паркуется
    здесь заметно проще.
fa:
  name: میدان آزادی و ساختمان پارلمان قدیم
  short: میدان مرکزی شهر که پنج بار نامش عوض شده و هر بار نشانهٔ آمدن حکومتی تازه بوده است.
  body: >-
    **اگر تفلیس مرکزی داشته باشد، همین‌جاست.** میدان در آغاز سدهٔ نوزدهم بیرون از دیوارهای شهر کهن پدید
    آمد و از آن زمان پنج بار نامش تغییر کرده است: میدان ایروان، سپس پالیاشویلی، بریا، لنین و سرانجام آزادی.


    از سال ۲۰۰۶ در میانهٔ آن مجسمهٔ زراندود سنت گئورگی در حال کشتن اژدها، کار زوراب تسرتلی، بر ستونی حدود
    سی‌وپنج متری ایستاده است. پیش از آن مجسمهٔ لنین در همین نقطه بود که در اوت ۱۹۹۰ در یک شب پایین کشیده
    شد. در سمت جنوب ساختمان شهرداری قرار دارد؛ بنایی به سبک مغربی از دههٔ ۱۸۷۰ با برج ساعت، از شناخته‌شده‌ترین
    نماهای شهر و هنوز دفتر شهردار.


    میدان یک ماجرای مشخص هم دارد. در ۲۶ ژوئن ۱۹۰۷ بلشویک‌ها به رهبری کامو و با دست داشتن استالین در طراحی،
    کاروان پول بانک را اینجا با بمب و تیر غافلگیر کردند؛ ده‌ها نفر کشته شدند و پول به صندوق حزب رفت. موج‌های
    اعتراضی ۱۹۸۹ و ۲۰۰۳ و بیشتر سال‌های پس از آن نیز از همین سنگفرش گذشته‌اند.


    در مسیر بالا رفتن به سوی روستاولی، ساختمان پارلمان قدیم در سمت راست پیدا می‌شود: ردیفی بلند از ستون‌ها
    بر فراز پلکانی پهن. اینجا شورای عالی می‌نشست، در ۱۹۹۱ استقلال اعلام شد و در نوامبر ۲۰۰۳ انقلاب گل
    سرخ وارد همین در شد. پارلمان در ۲۰۱۲ به کوتائیسی رفت و بعد تا حدی بازگشت، پس ساختمان فعال است و بازدید
    داخلی ندارد.


    خود میدان جای گذشتن است نه ماندن: گره‌ای که شهر قدیم، خیابان اصلی و مترو در آن به هم می‌رسند.


    میدان تکه‌ای از تاریخ نزدیک را هم در خود دارد: در مه ۲۰۰۵، هنگام سخنرانی جورج بوش رئیس‌جمهور آمریکا،
    نارنجکی زنده از میان جمعیت به سوی جایگاه پرتاب شد و منفجر نشد. اما در روزی معمولی این تنها یک فلکه
    است با بنایی در میانه، و تنها امتیاز واقعی‌اش گشودگی است: پس از کوچه‌های تنگ شهر قدیم، اینجا نخستین
    جایی است که تکه‌ای پهن از آسمان می‌بینید.
  tip: >-
    نیم ساعت کافی است؛ اینجا یک تقاطع است نه یک مقصد. گذرگاه هم‌سطح وجود ندارد و برای رفتن به هر سو باید
    از زیرگذرهایی رد شوید که پر از دکه و صرافی‌اند، و پله‌هایشان با کالسکه یا ویلچر دشوار است. ایستگاه
    مترو میدان آزادی، دفتر اطلاعات گردشگری و خودپردازهای فراوان همین‌جاست. سرویس بهداشتی در زیرگذر و کافه‌های
    اطراف است. تابستان‌ها میدان تقریباً سایه ندارد، پس صبح زود یا نزدیک غروب از آن بگذرید.
  route: >-
    همهٔ خیابان‌های اصلی تفلیس اینجا به هم می‌رسند، پس رسیدن آسان است و توقف کردن نه. روی خود میدان پارکینگ
    وجود ندارد. از پارکینگ زیرزمینی پولی زیر مرکز خرید با ورودی سمت خیابان فرد برن استفاده کنید، یا از
    جای‌های خط‌کشی‌شده در خیابان‌های پوشکین و لرمانتوف. مناطق پولی شهر مجوز می‌خواهند؛ خودروهای کرایه‌ای
    معمولاً دارند، اما از شرکت اجاره بپرسید. پمپ بنزین حدود یک کیلومتر دورتر در امتداد باراتاشویلی است.
    خودروی اقتصادی کافی است و هرچه کوچک‌تر، پارک کردن ساده‌تر.
he:
  name: כיכר החירות ובניין הפרלמנט הישן
  short: הכיכר המרכזית של העיר, ששמה הוחלף חמש פעמים, וכל החלפה סימנה שלטון אחר.
  body: >-
    **אם יש לטביליסי אמצע, הוא כאן.** הכיכר נוצרה בראשית המאה ה-19 מחוץ לחומות העיר העתיקה, ומאז הוחלף
    שמה חמש פעמים: כיכר ירוואן, אחר כך פליאשווילי, בריה, לנין, ולבסוף החירות.


    במרכזה ניצב מאז 2006 פסל מוזהב של גיאורגיוס הקדוש דוקר את הדרקון, מעשה ידי זוראב צרטלי, על עמוד בגובה
    כשלושים וחמישה מטרים. לפניו עמד כאן פסל לנין, שהוסר בלילה אחד באוגוסט 1990. בצד הדרומי עומד בניין
    העירייה, מבנה בסגנון מורי משנות ה-70 של המאה ה-19 עם מגדל שעון — אחת החזיתות המזוהות ביותר בעיר, ועד
    היום לשכת ראש העיר.


    לכיכר יש גם פרק היסטורי אחד מוגדר מאוד. ב-26 ביוני 1907 תקפו כאן בולשביקים בהנהגת קאמו, כשסטלין מעורב
    בתכנון, שיירת כספים של בנק בפצצות ובאש; עשרות נהרגו והכסף הלך לקופת המפלגה. גלי המחאה של 1989, של
    2003 ושל רוב השנים שאחריהן חצו את אותה רחבה.


    בעלייה לעבר רוסתאוולי מופיע מימין בניין הפרלמנט הישן: שורת עמודים ארוכה מעל גרם מדרגות רחב. כאן ישבה
    המועצה העליונה, כאן הוכרזה העצמאות ב-1991, ולתוכו נכנסה מהפכת הוורדים בנובמבר 2003. ב-2012 הועבר הפרלמנט
    לקוטאיסי ולאחר מכן הוחזר חלקית, ולכן הבניין פעיל ואינו פתוח לקהל.


    הכיכר עצמה היא מקום שעוברים בו ולא נשארים בו: צומת שבו נפגשים העיר העתיקה, השדרה והרכבת התחתית.


    לכיכר יש גם פרק מן ההיסטוריה הקרובה: במאי 2005, במהלך נאום של נשיא ארצות הברית ג'ורג' בוש, הושלך מן
    הקהל רימון חי לעבר הבמה והוא לא התפוצץ. ביום רגיל, לעומת זאת, זו פשוט כיכר תנועה עם אנדרטה במרכזה,
    ויתרונה האמיתי היחיד הוא הפתיחות: אחרי הסמטאות הצרות של העיר העתיקה, זהו המקום היחיד במרכז שרואים
    בו פיסת שמיים רחבה.
  tip: >-
    חצי שעה מספיקה — זהו צומת ולא יעד. אין מעברי חצייה עיליים, ולכל צד עוברים דרך מנהרות הולכי רגל מלאות
    חנויות קטנות והמרות מטבע, והמדרגות מסורבלות עם עגלה או כיסא גלגלים. כאן תחנת הרכבת התחתית כיכר החירות,
    נקודת מידע לתיירים והרבה כספומטים. שירותים יש במעבר התת-קרקעי ובבתי הקפה הסמוכים. בקיץ כמעט אין צל,
    אז חצו אותה מוקדם או לקראת ערב.
  route: >-
    כל השדרות הראשיות נפגשות כאן, ולכן קל להגיע וקשה לעצור. בכיכר עצמה אין חניה. השתמשו בחניון התת-קרקעי
    בתשלום שמתחת לקניון, בכניסה מצד רחוב פרד ברן, או במקומות המסומנים ברחובות פושקין ולרמונטוב. אזורי
    התשלום דורשים היתר; לרכבי השכרה בדרך כלל יש, אך כדאי לוודא מול החברה. תחנת דלק נמצאת כקילומטר משם
    לאורך רחוב בראטאשווילי. רכב חסכוני מספיק, וככל שהוא קטן יותר החניה כאן פשוטה יותר.
ar:
  name: ميدان الحرية ومبنى البرلمان القديم
  short: ميدان المدينة المركزي الذي تبدّل اسمه خمس مرات، وكل تبديل كان إعلاناً عن وصول نظام جديد.
  body: >-
    **إن كان لتبليسي وسط، فهو هنا.** نشأ الميدان في مطلع القرن التاسع عشر خارج أسوار المدينة القديمة،
    وتغيّر اسمه منذ ذلك الحين خمس مرات: ميدان يريفان، ثم بالياشفيلي، ثم بيريا، ثم لينين، وأخيراً الحرية.


    وفي وسطه يقوم منذ 2006 تمثال مذهّب للقديس جيورجي يطعن التنين، من عمل زوراب تسيريتيلي، على عمود يبلغ
    نحو خمسة وثلاثين متراً. وقبله كان هنا تمثال لينين، أُنزل في ليلة واحدة في أغسطس 1990. وفي الجهة الجنوبية
    مبنى بلدية المدينة، وهو بناء على الطراز المغربي من سبعينيات القرن التاسع عشر ببرج ساعة، من أكثر الواجهات
    تميزاً في المدينة، وما زال مكتب رئيس البلدية.


    وللميدان فصل تاريخي محدد جداً. ففي السادس والعشرين من يونيو 1907 هاجم البلاشفة بقيادة كامو، وبمشاركة
    ستالين في التخطيط، قافلة نقود مصرفية هنا بالقنابل والرصاص؛ فقُتل العشرات وذهب المال إلى صندوق الحزب.
    كما عبرت موجات الاحتجاج في 1989 و2003 ومعظم السنوات اللاحقة الرصف نفسه.


    وفي الصعود نحو روستافيلي يظهر على اليمين مبنى البرلمان القديم: صف طويل من الأعمدة فوق درج عريض. هنا
    كان مجلس السوفييت الأعلى، وهنا أُعلن الاستقلال عام 1991، وإلى هذا الباب دخلت ثورة الورود في نوفمبر
    2003. ونُقل البرلمان إلى كوتايسي عام 2012 ثم عاد جزئياً، فالمبنى عامل ولا يُزار من الداخل.


    أما الميدان نفسه فمكان يُعبر منه لا يُمكث فيه: عقدة تلتقي عندها المدينة القديمة والجادة والمترو.


    وللميدان أيضاً فصل من التاريخ القريب: ففي مايو 2005، أثناء خطاب للرئيس الأمريكي جورج بوش، أُلقيت من
    بين الحشد قنبلة يدوية حية نحو المنصة فلم تنفجر. أما في يوم عادي فهو مجرد دوار في وسطه نصب، وميزته
    الحقيقية الوحيدة هي الانفتاح: فبعد أزقة المدينة القديمة الضيقة، هذا هو المكان الوحيد في المركز الذي
    ترى فيه رقعة واسعة من السماء.
  tip: >-
    نصف ساعة تكفي؛ فهذا مفترق لا وجهة. ولا توجد معابر سطحية، إذ يُنتقل إلى كل جهة عبر أنفاق للمشاة تصطف
    فيها متاجر صغيرة ومكاتب صرافة، ودرجها متعب مع عربة طفل أو كرسي متحرك. وهنا محطة مترو ميدان الحرية
    ومكتب معلومات سياحية وأجهزة صراف كثيرة. ودورات المياه في النفق وفي المقاهي المجاورة. وفي الصيف لا
    ظل تقريباً، فاعبره باكراً أو قرب الغروب.
  route: >-
    تلتقي هنا كل الجادات الرئيسية، فالوصول سهل والوقوف ليس كذلك. ولا يوجد موقف في الميدان ذاته. استخدم
    المرآب الأرضي المدفوع تحت مركز التسوق بمدخله من جهة شارع فريد بيرن، أو الأماكن المخططة في شارعي بوشكين
    وليرمونتوف. ومناطق الرسوم في المدينة تحتاج تصريحاً تحمله سيارات الإيجار عادة، لكن تأكد من الشركة.
    ومحطة الوقود على نحو كيلومتر واحد على امتداد شارع باراتاشفيلي. وسيارة اقتصادية تكفي، وكلما كانت أصغر
    كان الوقوف أيسر.
