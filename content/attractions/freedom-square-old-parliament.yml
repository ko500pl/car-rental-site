ka:
  name: თავისუფლების მოედანი და ძველი პარლამენტი
  short: >-
    თბილისის მთავარი მოედანი, რომელიც ყოველ ახალ ბატონს ახალი სახელით ხვდებოდა — პასკევიჩიდან ბერიამდე
    და ლენინამდე; დღეს მას წმინდა გიორგი დაჰყურებს.
  body: >-
    **თბილისში არც ერთ მოედანს იმდენი სახელი არ უტარებია, რამდენიც ამას — და ყოველი ახალი სახელი ახალ
    ბატონს აუწყებდა.** 1801 წლამდე აქ ქალაქის გალავნის გარეთ მდებარე უკაცრიელი ადგილი იყო, სადაც სოფლელები
    ურმებით ჩამოტანილ შეშას ჰყიდდნენ. 1828 წელს რუსულმა ხელისუფლებამ მოედანს ერევნის დამპყრობლის, გენერალ
    პასკევიჩის, სახელი უწოდა. 1917 წელს, როცა მეფის დამხობის ამბავი ქალაქს მოსწვდა, აქ შეკრებილმა რევოლუციური
    პარტიების ლიდერებმა მას თავისუფლების მოედანი დაარქვეს. საბჭოთა ხელისუფლებამ ჯერ ამიერკავკასიის ფედერაციის,
    მერე ბერიას, ხოლო 1953 წელს ბერიას დახვრეტის შემდეგ — ლენინის სახელი მიაკერა. 1990 წელს მოედანს ძველი
    სახელი დაუბრუნდა.


    1907 წლის 26 ივნისს აქ იმპერიის ერთ-ერთი ყველაზე ხმაურიანი ძარცვა მოხდა. კამოს ბოლშევიკურმა რაზმმა,
    რომლის ორგანიზატორთა შორის სტალინიც იყო, ფოსტასა და სახელმწიფო ბანკს შორის ფულით დატვირთულ ეტლს ბომბებითა
    და რევოლვერებით დაესხა თავს. ორმოცი ადამიანი დაიღუპა; თავდამსხმელებმა 241 000 მანეთი გაიტაცეს, თუმცა
    ბანკნოტების დიდი ნაწილის ნომრები პოლიციას უკვე ჩაწერილი ჰქონდა.


    ლენინი აქ 1956 წლიდან 1991 წლის აგვისტომდე იდგა, სანამ ხალხის თვალწინ არ ჩამოაგდეს. 2006 წლის 23 ნოემბრიდან
    მაღალი სვეტის თავზე ზურაბ წერეთლის მოოქროვილი წმინდა გიორგი გველეშაპს განგმირავს. მის ზურგს უკან საათიანი
    კოშკით დაგვირგვინებული ძველი საქალაქო სახლია, 1878–1879 წლებში გადაკეთებული, — დღეს აქ საკრებულო სხდება.
    2005 წლის 10 მაისს, ჯორჯ ბუშის სიტყვით გამოსვლისას, ბრბოდან ტრიბუნისკენ ცოცხალი ყუმბარა ისროლეს; ცხვირსახოცში
    იყო გახვეული და არ აფეთქდა.


    რუსთაველის გამზირზე რამდენიმე წუთის სავალზე 1953 წელს დასრულებული პარლამენტის კოლონადიანი შენობა დგას
    — „ძველ“ პარლამენტად მხოლოდ 2012–2019 წლებში იწოდებოდა, როცა დეპუტატები ქუთაისში სხდებოდნენ; დღეს
    ისინი ისევ აქ იკრიბებიან. აქ ისხდნენ დეპუტატები, რომლებმაც 1991 წლის აპრილში დამოუკიდებლობა გამოაცხადეს,
    2003 წლის ნოემბერში კი ამ კარში ვარდების რევოლუცია შევიდა. გამზირს უკან გადახედეთ: ძველი ქალაქის ვიწრო
    ქუჩების შემდეგ თბილისი აქ, ბოლოს და ბოლოს, ფართო ცას გაჩვენებთ.
  tip: >-
    მოედნისთვის ნახევარი საათი საკმარისია, პარლამენტამდე გასეირნებით — ცოტა მეტი. მიწისზედა გადასასვლელები
    აქ არ არის: ერთი მხრიდან მეორეზე მიწისქვეშა გადასასვლელებით გადადიხართ, სადაც ჯიხურები და ვალუტის
    გადამცვლელებია; ბავშვის ეტლითა და სავარძელ-ეტლით კიბეები მძიმე დასაძლევია. მეტროსადგური „თავისუფლების
    მოედანი“ აქვეა, ბანკომატები — ყოველ ნაბიჯზე. მოედანზე ჩრდილი თითქმის არ არის, ამიტომ ზაფხულში დილით
    ან საღამოს გაიარეთ. რუსთაველზე, პარლამენტის წინ, დღესაც იმართება აქციები; თუ მიმდინარეობს, მანქანა
    მოშორებით დატოვეთ და ფეხით მოდით. ტუალეტი მოედნის ირგვლივ მდებარე კაფეებშია.
  route: >-
    თავისუფლების მოედანი თბილისის ცენტრის კვანძია: აქედან იწყება რუსთაველის გამზირი, პუშკინის, კოტე აფხაზის,
    ლეონიძის, გალაკტიონ ტაბიძისა და დადიანის ქუჩები, ამიტომ მანქანით აქ მოსვლა ადვილია, გაჩერება კი —
    არა. თავად მოედანზე სადგომი არ არის. ისარგებლეთ მოედანზე მდგარი სავაჭრო ცენტრის მიწისქვეშა ფასიანი
    ავტოსადგომით ან პუშკინისა და ლერმონტოვის ქუჩების ფასიანი ადგილებით. ცენტრში ქუჩის პარკირება ზონებად
    არის დაყოფილი და ფასიანია — გამქირავებელს ჰკითხეთ, როგორ იხდის მათი მანქანა. ცენტრალური სასტუმროების
    უმეტესობიდან აქამდე მანქანით ათი წუთია. ეკონომკლასის მანქანა საკმარისია, პატარა კი გაცილებით ადვილად
    გაჩერდება.
en:
  name: Freedom Square and the Old Parliament
  short: >-
    Tbilisi's central square has changed its name with every new master, from a Russian general to Beria
    and Lenin; today St George rides above the traffic.
  body: >-
    **No square in Tbilisi has worn as many names as this one, and each new name announced a new master.**
    Before 1801 this was open ground outside the city wall, where villagers sold firewood from their carts.
    In 1828 the Russian authorities named it after General Paskevich, the conqueror of Erivan. In 1917,
    as news of the Tsar's fall reached the city, the revolutionary parties gathered here and called it
    Freedom Square. The Soviets answered with Transcaucasian Federation Square, then Beria Square, and
    — after Beria was shot in 1953 — Lenin Square. In 1990 the old name came back.


    On 26 June 1907 the square saw one of the most notorious robberies in the empire. Kamo's Bolshevik
    gang, with Stalin among the organisers, ambushed, with bombs and revolvers, a bank coach carrying
    cash from the post office to the State Bank. Forty people died; the robbers escaped with 241,000 roubles,
    though the police held the serial numbers of many notes.


    Lenin stood here from 1956 until August 1991, when he was pulled down in front of a crowd. Since 23
    November 2006 Zurab Tsereteli's gilded St George has speared his dragon from the top of a tall column.
    Behind him stands the old town hall with its clock tower, rebuilt in 1878–79 and now home to the City
    Assembly. On 10 May 2005, during a speech by George W. Bush, a man threw a live grenade towards the
    stage; it was wrapped in a handkerchief and never went off.


    A few minutes up Rustaveli Avenue rises the colonnaded Parliament building, completed in 1953 — the
    "old" parliament only during the Kutaisi years of 2012–2019, and back in use today. The deputies who
    declared independence in April 1991 sat here, and in November 2003 the Rose Revolution came through
    its doors. Look back down the avenue: after the old town's lanes, Tbilisi finally gives you a wide
    piece of sky.
  tip: >-
    Half an hour for the square, a little more if you walk up to Parliament. There are no surface crossings:
    you move between the sides through underpasses lined with kiosks and exchange booths, and the stairs
    are hard going with a pushchair or wheelchair. Freedom Square (Tavisuplebis Moedani) metro station
    opens right here, and cash machines are everywhere. The square has almost no shade, so cross it early
    or late in summer. Demonstrations still gather in front of Parliament on Rustaveli; if one is under
    way, leave the car elsewhere and walk. Toilets are in the cafés around the square.
  route: >-
    Freedom Square is the hub of central Tbilisi: Rustaveli Avenue, Pushkin, Kote Apkhazi, Leonidze, Galaktion
    Tabidze and Dadiani streets all branch from it, so reaching it by car is easy and stopping is not.
    There is no parking on the square itself. Use the paid underground car park beneath the shopping centre
    on the square, or the paid street bays on Pushkin and Lermontov streets. Street parking in the centre
    is zoned and paid, so ask your rental company how its car pays for it. From most central hotels it
    is ten minutes by car. An economy car is enough, and a small one parks far more easily.
ru:
  name: Площадь Свободы и старый парламент
  short: >-
    Центральная площадь Тбилиси меняла имя при каждом новом хозяине — от русского генерала до Берии и
    Ленина; сегодня над потоком машин скачет святой Георгий.
  body: >-
    **Ни одна площадь Тбилиси не сменила столько имён, как эта, и каждое новое имя объявляло о новом хозяине.**
    До 1801 года здесь был пустырь за городской стеной, где крестьяне продавали с арб дрова. В 1828 году
    российские власти назвали площадь в честь генерала Паскевича, покорителя Эривани. В 1917-м, когда
    до города дошла весть о падении царя, здесь собрались революционные партии и нарекли её площадью Свободы.
    Советы ответили площадью Закавказской федерации, потом площадью Берии, а после того как Берию расстреляли
    в 1953 году, — площадью Ленина. В 1990 году старое имя вернулось.


    26 июня 1907 года площадь стала местом одного из самых громких ограблений в империи. Большевистская
    группа Камо, среди организаторов которой был Сталин, бомбами и револьверами атаковала банковский экипаж,
    перевозивший деньги между почтой и Государственным банком. Погибли сорок человек; налётчики скрылись
    с 241 000 рублей, хотя номера многих купюр полиция знала.


    Ленин стоял здесь с 1956 года до августа 1991-го, когда его сбросили с постамента на глазах у толпы.
    С 23 ноября 2006 года с вершины высокой колонны пронзает змия позолоченный святой Георгий Зураба Церетели.
    За ним — старая ратуша с часовой башней, перестроенная в 1878–79 годах; сегодня в ней заседает городское
    собрание. 10 мая 2005 года, во время речи Джорджа Буша, какой-то человек бросил в сторону трибуны
    боевую гранату; она была завёрнута в носовой платок и так и не взорвалась.


    В нескольких минутах вверх по проспекту Руставели высится колоннада здания парламента, достроенного
    в 1953 году; «старым» оно было лишь в 2012–2019 годах, когда парламент заседал в Кутаиси, — сегодня
    депутаты снова собираются здесь. Здесь заседали депутаты, провозгласившие независимость в апреле 1991
    года, и в ноябре 2003-го через эти двери вошла революция роз. Оглянитесь вниз по проспекту: после
    переулков старого города Тбилиси наконец дарит вам широкий кусок неба.
  tip: >-
    На площадь хватит получаса, чуть больше — если дойти до парламента. Наземных переходов нет: с одной
    стороны на другую перебираются подземными переходами, где теснятся киоски и обменники, и лестницы
    тяжелы для детской или инвалидной коляски. Станция метро «Площадь Свободы» выходит прямо сюда, банкоматы
    на каждом шагу. Тени на площади почти нет, так что летом пересекайте её рано утром или ближе к вечеру.
    У парламента на Руставели по-прежнему собираются демонстрации; если идёт митинг, оставьте машину подальше
    и пройдитесь пешком. Туалеты — в кафе вокруг площади.
  route: >-
    Площадь Свободы — узел центрального Тбилиси: от неё расходятся проспект Руставели, улицы Пушкина,
    Коте Апхази, Леонидзе, Галактиона Табидзе и Дадиани, так что доехать сюда легко, а остановиться —
    нет. На самой площади парковки нет. Пользуйтесь платным подземным паркингом под торговым центром на
    площади или платными местами на улицах Пушкина и Лермонтова. Уличная парковка в центре разбита на
    зоны и платная — спросите в прокатной компании, как оплачивается стоянка для её машины. От большинства
    центральных гостиниц — десять минут езды. Хватит машины эконом-класса, а маленькую машину припарковать
    куда проще.
fa:
  name: میدان آزادی و پارلمان قدیم
  short: >-
    میدان مرکزی تفلیس با هر اربابی نامش را عوض کرد، از یک ژنرال روس تا بریا و لنین؛ امروز گئورگیوس قدیس
    بر فراز ترافیک می‌تازد.
  body: >-
    **هیچ میدانی در تفلیس به اندازهٔ این یکی نام عوض نکرده است، و هر نام تازه از اربابی تازه خبر می‌داد.**
    پیش از ۱۸۰۱ اینجا زمینی باز بیرون از بارویِ شهر بود که روستاییان از گاری‌هایشان هیزم می‌فروختند. در
    ۱۸۲۸ مقامات روس آن را به نام ژنرال پاسکویچ، فاتح ایروان، نامیدند. در ۱۹۱۷، وقتی خبر سقوط تزار به شهر
    رسید، احزاب انقلابی اینجا گرد آمدند و نامش را میدان آزادی گذاشتند. شوروی‌ها با «میدان فدراسیون ماوراء
    قفقاز» پاسخ دادند، سپس «میدان بریا»، و پس از تیرباران بریا در ۱۹۵۳، «میدان لنین». در ۱۹۹۰ نام قدیم
    بازگشت.


    در ۲۶ ژوئن ۱۹۰۷ این میدان شاهد یکی از بدنام‌ترین سرقت‌های امپراتوری بود. گروه بلشویکی کامو، که استالین
    هم از سازمان‌دهندگانش بود، با بمب و هفت‌تیر به کالسکه‌ای بانکی حمله کرد که پول نقد را میان ادارهٔ
    پست و بانک دولتی جابه‌جا می‌کرد. چهل نفر کشته شدند؛ سارقان با ۲۴۱,۰۰۰ روبل گریختند، هرچند شمارهٔ سریال
    بسیاری از اسکناس‌ها در دست پلیس بود.


    لنین از ۱۹۵۶ تا اوت ۱۹۹۱ اینجا ایستاده بود، تا آنکه جلوی چشم جمعیت پایینش کشیدند. از ۲۳ نوامبر ۲۰۰۶
    گئورگیوس قدیسِ زراندودِ زوراب تسرتلی از فراز ستونی بلند اژدهایش را با نیزه می‌زند. پشت سرش شهرداری
    قدیم با برج ساعتش ایستاده، که در ۱۸۷۸–۷۹ بازسازی شد و امروز جایگاه شورای شهر است. در ۱۰ مه ۲۰۰۵، هنگام
    سخنرانی جورج دبلیو بوش، مردی نارنجکی جنگی به سوی جایگاه پرتاب کرد؛ نارنجک در دستمالی پیچیده شده بود
    و هرگز منفجر نشد.


    چند دقیقه بالاتر در خیابان روستاولی، ساختمان ستون‌دار پارلمان سر برمی‌آورد که در ۱۹۵۳ تکمیل شد؛ این
    بنا تنها در سال‌های ۲۰۱۲ تا ۲۰۱۹، که پارلمان در کوتائیسی تشکیل می‌شد، «پارلمان قدیم» بود و امروز دوباره
    محل نشست نمایندگان است. نمایندگانی که در آوریل ۱۹۹۱ استقلال را اعلام کردند اینجا می‌نشستند، و در نوامبر
    ۲۰۰۳ انقلاب گل سرخ از همین درها گذشت. به پایین خیابان نگاه کنید: پس از کوچه‌های شهر قدیم، تفلیس سرانجام
    تکه‌ای پهناور از آسمان را به شما می‌دهد.
  tip: >-
    نیم ساعت برای میدان کافی است، و کمی بیشتر اگر تا پارلمان بالا بروید. گذرگاه هم‌سطح وجود ندارد: از
    یک سو به سوی دیگر از زیرگذرهایی می‌روید که دکه‌ها و صرافی‌ها در آن‌ها صف کشیده‌اند، و پله‌ها با کالسکهٔ
    بچه یا ویلچر دشوارند. ایستگاه متروی میدان آزادی درست همین‌جا باز می‌شود و خودپرداز همه‌جا هست. میدان
    تقریباً سایه ندارد، پس در تابستان صبح زود یا نزدیک غروب از آن بگذرید. هنوز هم تظاهرات جلوی پارلمان
    در روستاولی برپا می‌شود؛ اگر تجمعی در جریان است، ماشین را جای دیگری بگذارید و پیاده بیایید. سرویس
    بهداشتی در کافه‌های دور میدان است.
  route: >-
    میدان آزادی قلب مرکز تفلیس است: خیابان روستاولی و خیابان‌های پوشکین، کوته آپخازی، لئونیدزه، گالاکتیون
    تابیدزه و دادیانی همه از آن منشعب می‌شوند؛ پس رسیدن با ماشین آسان است و ایستادن نه. در خود میدان جای
    پارک نیست. از پارکینگ زیرزمینی پولیِ زیر مرکز خرید میدان یا جای پارک پولی کنار خیابان در پوشکین و
    لرمانتوف استفاده کنید. پارک کنار خیابان در مرکز منطقه‌بندی‌شده و پولی است؛ از شرکت کرایه بپرسید خودرویشان
    هزینه را چگونه می‌پردازد. از بیشتر هتل‌های مرکز ده دقیقه با ماشین راه است. خودروی اکونومی کافی است
    و خودروی کوچک بسیار راحت‌تر جا پارک پیدا می‌کند.
he:
  name: כיכר החירות והפרלמנט הישן
  short: >-
    הכיכר המרכזית של טביליסי החליפה שם עם כל שליט חדש, מגנרל רוסי ועד בריה ולנין; היום גאורגיוס הקדוש
    רוכב מעל התנועה.
  body: >-
    **אף כיכר בטביליסי לא נשאה שמות רבים כמו זו, וכל שם חדש הכריז על שליט חדש.** לפני 1801 היה כאן שטח
    פתוח מחוץ לחומת העיר, שבו מכרו כפריים עצי הסקה מעגלותיהם. ב-1828 קראו לה השלטונות הרוסיים על שם הגנרל
    פסקביץ', כובש ירוואן. ב-1917, כשהידיעה על נפילת הצאר הגיעה לעיר, התכנסו כאן המפלגות המהפכניות וקראו
    לה כיכר החירות. הסובייטים השיבו בכיכר הפדרציה הטרנס-קווקזית, אחר כך בכיכר בריה, ואחרי שבריה הוצא להורג
    בירייה ב-1953 — בכיכר לנין. ב-1990 חזר השם הישן.


    ב-26 ביוני 1907 הייתה הכיכר זירה לאחד השודים הידועים לשמצה באימפריה. חוליית הבולשביקים של קאמו, שסטלין
    היה בין מארגניה, תקפה בפצצות ובאקדחים כרכרה של הבנק שהובילה מזומנים בין בית הדואר לבנק הממלכתי. ארבעים
    בני אדם נהרגו; השודדים נמלטו עם 241,000 רובל, אף שבידי המשטרה היו המספרים הסידוריים של רבים מהשטרות.


    לנין עמד כאן מ-1956 ועד אוגוסט 1991, אז הופל מול עיני ההמון. מאז 23 בנובמבר 2006 נועץ גאורגיוס הקדוש
    המוזהב של זוראב צרטלי את רומחו בדרקון מראש עמוד גבוה. מאחוריו עומד בית העירייה הישן עם מגדל השעון,
    שנבנה מחדש ב-1878–79 ומשמש היום את מועצת העיר. ב-10 במאי 2005, במהלך נאום של ג'ורג' וו. בוש, זרק אדם
    רימון חי לעבר הבמה; הרימון היה עטוף בממחטה ולא התפוצץ.


    כמה דקות במעלה שדרות רוסתוולי מתנשא בניין הפרלמנט עטור העמודים, שהושלם ב-1953; הוא היה "הפרלמנט הישן"
    רק בשנים 2012–2019, כשהפרלמנט ישב בקוטאיסי, והיום הצירים שוב מתכנסים בו. כאן ישבו הצירים שהכריזו על
    העצמאות באפריל 1991, ובנובמבר 2003 נכנסה בדלתותיו מהפכת הוורדים. הביטו לאחור, במורד השדרה: אחרי סמטאות
    העיר העתיקה טביליסי נותנת לכם סוף-סוף פיסת שמיים רחבה.
  tip: >-
    חצי שעה מספיקה לכיכר, קצת יותר אם עולים עד הפרלמנט. אין מעברי חצייה במפלס הרחוב: עוברים מצד לצד במעברים
    תת-קרקעיים עמוסי קיוסקים ודלפקי המרת מטבע, והמדרגות קשות עם עגלת תינוק או כיסא גלגלים. תחנת המטרו
    כיכר החירות נפתחת ממש כאן, וכספומטים יש בכל פינה. בכיכר כמעט אין צל, ולכן בקיץ עברו בה מוקדם בבוקר
    או לקראת ערב. הפגנות עדיין מתכנסות מול הפרלמנט ברוסתוולי; אם מתקיימת הפגנה, השאירו את הרכב במקום אחר
    ובואו ברגל. שירותים יש בבתי הקפה שסביב הכיכר.
  route: >-
    כיכר החירות היא הצומת של מרכז טביליסי: שדרות רוסתוולי ורחובות פושקין, קוטה אפחאזי, לאונידזה, גלקטיון
    טבידזה ודדיאני מתפצלים ממנה, כך שקל להגיע אליה ברכב וקשה לעצור. בכיכר עצמה אין חניה. השתמשו בחניון
    התת-קרקעי בתשלום שמתחת למרכז הקניות שבכיכר, או במקומות החניה בתשלום ברחובות פושקין ולרמונטוב. החניה
    ברחובות המרכז מחולקת לאזורים ובתשלום, אז שאלו את חברת ההשכרה איך הרכב שלה משלם עליה. מרוב המלונות
    שבמרכז זו נסיעה של עשר דקות. רכב חסכוני מספיק, ורכב קטן קל בהרבה להחנות.
ar:
  name: ساحة الحرية والبرلمان القديم
  short: >-
    بدّلت ساحة تبليسي المركزية اسمها مع كل سيد جديد، من جنرال روسي إلى بيريا ولينين؛ واليوم يمتطي القديس
    جاورجيوس جواده فوق زحام السيارات.
  body: >-
    **لم تحمل ساحة في تبليسي من الأسماء ما حملته هذه الساحة، وكان كل اسم جديد إعلاناً عن سيد جديد.** قبل
    عام 1801 كانت هنا أرض مكشوفة خارج سور المدينة، يبيع فيها القرويون الحطب من عرباتهم. وفي عام 1828 سمّتها
    السلطات الروسية باسم الجنرال باسكيفيتش، فاتح إيريفان. وفي عام 1917، حين بلغ المدينةَ نبأ سقوط القيصر،
    احتشدت هنا الأحزاب الثورية وأطلقت عليها اسم ساحة الحرية. فردّ السوفييت بساحة اتحاد ما وراء القوقاز،
    ثم ساحة بيريا، ثم — بعد إعدام بيريا رمياً بالرصاص عام 1953 — ساحة لينين. وفي عام 1990 عاد الاسم القديم.


    في 26 حزيران/يونيو 1907 شهدت الساحة واحدة من أشهر عمليات السطو في الإمبراطورية. فقد هاجمت عصابة كامو
    البلشفية، وكان ستالين من منظميها، بالقنابل والمسدسات عربةً للمصرف تنقل النقود بين مكتب البريد ومصرف
    الدولة. قُتل أربعون شخصاً، وفرّ اللصوص بـ 241,000 روبل، وإن كانت الشرطة تملك الأرقام التسلسلية لكثير
    من الأوراق النقدية.


    وقف تمثال لينين هنا من عام 1956 حتى آب/أغسطس 1991، حين أُسقط أمام الجموع. ومنذ 23 تشرين الثاني/نوفمبر
    2006 يطعن القديس جاورجيوس المذهّب، من صنع زوراب تسيريتيلي، تنّينه من أعلى عمود شاهق. ووراءه دار البلدية
    القديمة ببرج ساعتها، التي أُعيد بناؤها في 1878–79 وتضم اليوم مجلس المدينة. وفي 10 أيار/مايو 2005،
    في أثناء خطاب لجورج دبليو بوش، رمى رجل قنبلة يدوية حية نحو المنصة؛ كانت ملفوفة بمنديل ولم تنفجر قط.


    وعلى بعد دقائق صعوداً في جادة روستافيلي يرتفع مبنى البرلمان ذو الأعمدة، الذي اكتمل عام 1953؛ ولم يكن
    "البرلمان القديم" إلا في سنوات 2012–2019 حين انعقد البرلمان في كوتايسي، وهو اليوم مقرّه من جديد. هنا
    جلس النواب الذين أعلنوا الاستقلال في نيسان/أبريل 1991، ومن أبوابه دخلت ثورة الورود في تشرين الثاني/نوفمبر
    2003. التفت إلى أسفل الجادة: بعد أزقة المدينة القديمة، تمنحك تبليسي أخيراً قطعة واسعة من السماء.
  tip: >-
    تكفي نصف ساعة للساحة، وأكثر قليلاً إن صعدت إلى البرلمان. لا معابر مشاة على مستوى الشارع: تنتقل من
    جهة إلى أخرى عبر أنفاق تصطف فيها الأكشاك ومكاتب الصرافة، والدرج شاق مع عربة أطفال أو كرسي متحرك. تنفتح
    محطة مترو ساحة الحرية هنا مباشرة، وأجهزة الصراف في كل مكان. الساحة تكاد تخلو من الظل، فاعبرها صيفاً
    في الصباح الباكر أو قرب المساء. وما زالت المظاهرات تتجمع أمام البرلمان في روستافيلي؛ فإن كانت إحداها
    جارية، فاترك السيارة في مكان آخر وتعالَ مشياً. ودورات المياه في المقاهي المحيطة بالساحة.
  route: >-
    ساحة الحرية هي محور وسط تبليسي: تتفرع منها جادة روستافيلي وشوارع بوشكين وكوتي أبخازي وليونيدزه وغالاكتيون
    تابيدزه ودادياني، فالوصول إليها بالسيارة سهل، أما التوقف فلا. لا موقف في الساحة نفسها. استخدم المرآب
    المدفوع تحت الأرض أسفل المركز التجاري في الساحة، أو أماكن الوقوف المدفوعة في شارعي بوشكين وليرمونتوف.
    الوقوف في شوارع الوسط مقسّم إلى مناطق ومدفوع، فاسأل شركة التأجير كيف تُدفع رسومه لسيارتها. ومن معظم
    فنادق الوسط هي عشر دقائق بالسيارة. تكفي سيارة اقتصادية، والصغيرة أسهل كثيراً في الركن.
