ka:
  name: ნიკო მარის სახლ-მუზეუმი
  short: >-
    ქუთაისში დაბადებული აღმოსავლეთმცოდნის, ნიკო მარის, სოფლის მუზეუმი: ბრიტანელი მამა, გურული დედა და
    ენის თეორია, რომელიც სტალინმა დაგმო.
  body: >-
    **ნიკო მარი ცდილობდა, დედამიწის ყველა ენა ოთხ მარცვლამდე — სალ, ბერ, იონ, როშ — დაეყვანა, და გზა,
    რომელმაც იქამდე მიიყვანა, ამ გურულ სოფელში იწყება.**


    მისი მამა, იაკობ (ჯეიმზ) მარი, შოტლანდიური წარმოშობის ბრიტანელი, კავკასიაში 1822 წელს ვაჭრად ჩამოვიდა.
    1820-იან წლებში გურიის ხელისუფლების მიწვევით სწორედ აქ, დაბლაციხეში, მეურნეობა მოაწყო და გურიელების
    ბაღებს უვლიდა. დედა ქართველი იყო და გურულად ლაპარაკობდა. ნიკო 1865 წლის 6 იანვარს ქუთაისში დაიბადა.
    ჯერ ახლომახლო, ოზურგეთის სამაზრო სასწავლებელში სწავლობდა, ბავშვობაშივე კი მამა გარდაეცვალა. 1884 წელს
    ქუთაისის გიმნაზია დაამთავრა და პეტერბურგის უნივერსიტეტის აღმოსავლურ ენათა ფაკულტეტზე გაემგზავრა.


    ადრეული მარის ღვაწლი უნებლიეთ აღტაცებას იწვევს. 1892–1917 წლებში ის ანისში, შუა საუკუნეების სომხეთის
    დანგრეულ დედაქალაქში, გათხრებს ხელმძღვანელობდა. 1898 წელს ათონის მთაზე ქართული ხელნაწერები გადაწერა
    და აღწერა, 1902 წელს სინის მთაზე ივანე ჯავახიშვილთან ერთად იმუშავა, 1910 წელს კი „ვეფხისტყაოსანზე“
    გამოკვლევა გამოსცა. 1912 წელს რუსეთის მეცნიერებათა აკადემიის ნამდვილი წევრი გახდა.


    მერე „იაფეტური თეორია“ მოვიდა, ნოეს ვაჟის, იაფეტის, სახელობისა. თავიდან ეს იყო ენათა ოჯახი, რომელიც
    ქართულს სემიტურ ენებთან აკავშირებდა, ბოლოს კი მტკიცება, თითქოს მთელი ადამიანური მეტყველება სწორედ
    ამ ოთხი პირველადი ელემენტიდან აღმოცენდა. ეს მოძღვრება საბჭოთა ენათმეცნიერებას ძალით მოახვიეს თავს
    და მის ავტორსაც გადაურჩა: მარი 1934 წელს ლენინგრადში გარდაიცვალა, თეორია კი მხოლოდ 1950 წლის ივნისში
    დაგმო „პრავდაში“ თავად სტალინმა.


    მუზეუმი სოფლის მოკრძალებული სახლია მისი წიგნებით, ხელნაწერებითა და ფოტოებით; ადგილობრივების თქმით,
    მას ოჯახის ნათესავები უვლიან. აქ მარი არც დიდი მეცნიერია და არც დაგმობილი წინასწარმეტყველი — მხოლოდ
    შოტლანდიური ძირების მქონე მებაღის შვილია გურიის გორაკებში.
  tip: >-
    მუზეუმს მუდმივი სამუშაო საათები არ აქვს და თხოვნით იღება, ამიტომ ვიზიტი წინასწარ შეათანხმეთ ჩოხატაურის
    მუნიციპალიტეტის ან ადგილობრივი გიდის მეშვეობით და საფასურიც მაშინვე იკითხეთ. ნუ აგერევათ ახლომახლო,
    ხიდისთავში მდებარე ნოდარ დუმბაძის სახლ-მუზეუმში, რომელიც მწერალს ეძღვნება: სხვა კაცს, სხვა საუკუნეს.
    დაბლაციხეში წმინდა გიორგის ეკლესიაც დგას. სოფელი პატარა და წყნარია, ამიტომ მანქანა გზისპირას ისე დააყენეთ,
    რომ არავის შეუშალოთ ხელი. შემოწირულობისთვის ნაღდი ფული იქონიეთ, დღე კი მეზობელ ბუკისციხეში, გურის
    ტბაზე, ბანაობით დაასრულეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ იარეთ გორის, ხაშურის, ზესტაფონისა და ქუთაისის გავლით სამტრედიამდე,
    იქიდან კი S12-ით ლანჩხუთის მიმართულებით დაახლოებით 7 კილომეტრი. საჯავახოსთან სამხრეთით, შ2-ზე გადაუხვიეთ
    და ჩოხატაურის მიმართულებით დაახლოებით 18 კილომეტრი გაიარეთ. ქალაქამდე დაახლოებით ერთი კილომეტრით ადრე
    დაბლაციხისკენ გადაუხვიეთ: სოფელი ცენტრიდან 3–4 კილომეტრით სამხრეთ-აღმოსავლეთითაა, სუფსის მარჯვენა
    ნაპირზე; სოფლის გზის ბოლო მონაკვეთი შესაძლოა ხრეშიანი იყოს. მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის,
    წვიმის შემდეგ კი ფრთხილად იარეთ. სულ დაახლოებით 275 კმ და 4 საათი და 25 წუთი. საწვავი სამტრედიაში
    ან ჩოხატაურში ჩაასხით.
en:
  name: Nikolai Marr House-Museum
  short: >-
    Village museum of Niko Marr, the Kutaisi-born orientalist with a British father and a Gurian-speaking
    mother, whose theory of language Stalin denounced.
  body: >-
    **Nikolai Marr tried to trace every language on earth back to four syllables, sal, ber, yon and rosh,
    and the road that led him there begins in this Gurian village.**


    His father, James (Iakob) Marr, a Briton of Scottish descent, came to the Caucasus as a trader in
    1822. In the 1820s, at the invitation of Guria's rulers, he set up a farm here in Dablatsikhe and
    worked in horticulture for the Gurieli princes. His mother was a Georgian who spoke the Gurian dialect.
    Nikolai was born in Kutaisi on 6 January 1865. He went to school first in nearby Ozurgeti and lost
    his father as a boy. In 1884 he finished the Kutaisi gymnasium and went on to the Oriental faculty
    in St Petersburg.


    The early Marr is hard not to admire. From 1892 to 1917 he led excavations at Ani, the ruined medieval
    Armenian capital. In 1898 he copied and described Georgian manuscripts on Mount Athos. In 1902 he
    worked on Sinai with Ivane Javakhishvili, and in 1910 he published a study of The Knight in the Panther's
    Skin. In 1912 he joined the Russian Academy of Sciences as a full member.


    Then came the "Japhetic theory", named after Noah's son Japheth. It began as a language family linking
    Georgian with the Semitic tongues. It ended as the claim that all human speech grew from those four
    primal elements. Forced on Soviet linguistics, the doctrine outlived him: Marr died in Leningrad in
    1934, and it was not until June 1950 that Stalin himself denounced it in Pravda.


    The museum is a modest village house of books, manuscripts and photographs, cared for, locals say,
    by relatives of the household. Here he is neither the great scholar nor the discredited prophet, only
    the son of a gardener of Scottish stock in the Gurian hills.
  tip: >-
    There are no fixed opening hours. The museum opens on request, so arrange your visit in advance through
    the Chokhatauri municipality or a local guide, and ask about any fee at the same time. Do not confuse
    it with the Nodar Dumbadze house-museum in nearby Khidistavi, which is devoted to the novelist: a
    different man and a different century. Dablatsikhe also has a church of St George. The village is
    small and quiet, so park on the verge where you block no one. Bring cash for a donation, and finish
    with a swim at Guris Tba in neighbouring Bukitsikhe.
  route: >-
    From Tbilisi take the E60/S1 west past Gori, Khashuri, Zestaponi and Kutaisi to Samtredia, then the
    S12 towards Lanchkhuti for about 7 km. At Sajavakho turn south onto the Sh2 towards Chokhatauri, some
    18 km away. About 1 km before the town, turn off for Dablatsikhe, which lies 3–4 km south-east of
    the centre on the right bank of the Supsa, along a village road whose last stretch may be gravel.
    An economy car manages it in dry weather; go gently after rain. Allow about 275 km and 4 hours 25
    minutes. Refuel in Samtredia or Chokhatauri.
ru:
  name: Дом-музей Николая Марра
  short: >-
    Сельский музей Нико Марра — уроженца Кутаиси, востоковеда с отцом-британцем и матерью-гурийкой, чью
    теорию языка осудил Сталин.
  body: >-
    **Николай Марр пытался свести все языки на земле к четырём слогам — сал, бер, йон и рош, — и путь,
    который привёл его к этому, начинается в этом гурийском селе.**


    Его отец, Джеймс (Яков) Марр, британец шотландского происхождения, приехал на Кавказ торговцем в 1822
    году. В 1820-х годах по приглашению правителей Гурии он завёл здесь, в Даблацихе, хозяйство и занимался
    садоводством для князей Гуриели. Мать была грузинкой и говорила на гурийском диалекте. Николай родился
    в Кутаиси 6 января 1865 года. Учился сначала в соседнем Озургети, отца потерял ещё ребёнком. В 1884
    году окончил Кутаисскую гимназию и поступил на факультет восточных языков в Петербурге.


    Раннему Марру трудно не отдать должное. С 1892 по 1917 год он руководил раскопками Ани — разрушенной
    средневековой армянской столицы. В 1898 году копировал и описывал грузинские рукописи на Афоне. В
    1902 году работал на Синае вместе с Иване Джавахишвили, а в 1910-м опубликовал исследование о «Витязе
    в тигровой шкуре». В 1912 году он стал действительным членом Российской академии наук.


    Потом появилась «яфетическая теория», названная по имени Иафета, сына Ноя. Начиналась она как языковая
    семья, связывающая грузинский с семитскими языками. Закончилась утверждением, что вся человеческая
    речь выросла из тех самых четырёх первоэлементов. Навязанное советской лингвистике учение пережило
    своего автора: Марр умер в Ленинграде в 1934 году, и лишь в июне 1950 года сам Сталин осудил его на
    страницах «Правды».


    Музей — скромный сельский дом с книгами, рукописями и фотографиями; по словам местных жителей, за
    ним присматривают родственники семьи. Здесь Марр не великий учёный и не развенчанный пророк, а просто
    сын садовника с шотландскими корнями с гурийских холмов.
  tip: >-
    Постоянного расписания нет. Музей открывают по просьбе, поэтому договоритесь о визите заранее через
    муниципалитет Чохатаури или местного гида и тогда же спросите о плате. Не путайте его с домом-музеем
    Нодара Думбадзе в соседнем Хидистави — он посвящён писателю: другой человек и другой век. В Даблацихе
    есть также церковь Святого Георгия. Село маленькое и тихое, так что ставьте машину на обочине, никому
    не мешая. Возьмите наличные для пожертвования, а закончите день купанием в Гурис-Тба в соседнем Букицихе.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори, Хашури, Зестафони и Кутаиси до Самтредиа, затем около 7 км
    по S12 в сторону Ланчхути. У Саджавахо сверните на юг на Sh2 в сторону Чохатаури (около 18 км). Примерно
    за километр до городка сверните на Даблацихе: село лежит в 3–4 км к юго-востоку от центра, на правом
    берегу Супсы; туда ведёт сельская дорога, последний отрезок которой может оказаться гравийным. Машина
    эконом-класса справится с ним в сухую погоду; после дождя будьте осторожны. Рассчитывайте примерно
    на 275 км и 4 часа 25 минут. Заправиться можно в Самтредиа или Чохатаури.
fa:
  name: خانه‌موزهٔ نیکلای مار
  short: >-
    موزه‌ای روستایی برای نیکو مار، خاورشناس زادهٔ کوتایسی با پدری بریتانیایی و مادری گوریایی‌زبان، که
    استالین نظریهٔ زبانی‌اش را محکوم کرد.
  body: >-
    **نیکلای مار کوشید همهٔ زبان‌های جهان را به چهار هجا بازگرداند، «سال»، «بر»، «یون» و «روش»؛ و راهی
    که او را به آنجا رساند از همین روستای گوریا آغاز می‌شود.**


    پدرش، جیمز (یاکوب) مار، بریتانیایی‌ای اسکاتلندی‌تبار بود که در سال ۱۸۲۲ به‌عنوان بازرگان به قفقاز
    آمد. در دههٔ ۱۸۲۰، به دعوت فرمانروایان گوریا، همین‌جا در دابلاتسیخه مزرعه‌ای برپا کرد و برای شاهزادگان
    گوریلی به باغبانی پرداخت. مادرش گرجی بود و به گویش گوریایی سخن می‌گفت. نیکلای در ۶ ژانویهٔ ۱۸۶۵ در
    کوتایسی به دنیا آمد. نخست در اوزورگتیِ نزدیک به مدرسه رفت و در کودکی پدرش را از دست داد. در سال ۱۸۸۴
    دبیرستان کوتایسی را به پایان رساند و به دانشکدهٔ شرق‌شناسی سن‌پترزبورگ رفت.


    دشوار است مارِ نخستین را نستود. از ۱۸۹۲ تا ۱۹۱۷ کاوش‌های آنی، پایتخت ویرانِ ارمنی سده‌های میانه، را
    رهبری کرد. در ۱۸۹۸ نسخه‌های خطی گرجی را در کوه آتوس رونویسی و توصیف کرد. در ۱۹۰۲ همراه با ایوانه جاواخیشویلی
    در سینا کار کرد و در ۱۹۱۰ پژوهشی دربارهٔ «پهلوان پلنگینه‌پوش» منتشر کرد. در ۱۹۱۲ عضو پیوستهٔ فرهنگستان
    علوم روسیه شد.


    سپس «نظریهٔ یافثی» آمد که نامش را از یافث، پسر نوح، گرفته بود. این نظریه با خانواده‌ای زبانی آغاز
    شد که گرجی را به زبان‌های سامی پیوند می‌داد، و به این ادعا انجامید که همهٔ گفتار بشری از همان چهار
    عنصر نخستین روییده است. این آموزه که بر زبان‌شناسی شوروی تحمیل شد، از صاحبش بیشتر عمر کرد: مار در
    سال ۱۹۳۴ در لنینگراد درگذشت و تنها در ژوئن ۱۹۵۰ بود که خودِ استالین در روزنامهٔ «پراودا» آن را محکوم
    کرد.


    موزه خانه‌ای روستایی و ساده است با کتاب‌ها، دست‌نوشته‌ها و عکس‌ها، و به گفتهٔ اهالی، خویشاوندان خانواده
    از آن نگهداری می‌کنند. اینجا او نه دانشمندی بزرگ است و نه پیامبری بی‌اعتبارشده؛ تنها پسر باغبانی اسکاتلندی‌تبار
    در تپه‌های گوریاست.
  tip: >-
    ساعت کاری ثابتی ندارد. موزه بنا به درخواست باز می‌شود، پس دیدارتان را از پیش از طریق شهرداری چوخاتائوری
    یا یک راهنمای محلی هماهنگ کنید و همان موقع دربارهٔ هزینهٔ احتمالی بپرسید. آن را با خانه‌موزهٔ نودار
    دومبادزه در خیدیستاوی نزدیک اشتباه نگیرید که به آن رمان‌نویس اختصاص دارد: مردی دیگر و قرنی دیگر. در
    دابلاتسیخه کلیسای جرج مقدس هم هست. روستا کوچک و آرام است، پس کنار جاده جایی پارک کنید که راه کسی را
    نبندد. پول نقد برای کمک مالی همراه داشته باشید و روز را با شنا در گوریس تبا در بوکیتسیخهٔ همسایه به
    پایان ببرید.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب بروید و از کنار گوری، خاشوری، زستافونی و کوتایسی تا سامترِدیا پیش
    بروید، سپس حدود ۷ کیلومتر با S12 به سوی لانچخوتی. در ساجاواخو به جنوب و به جادهٔ Sh2 به سوی چوخاتائوری
    بپیچید (حدود ۱۸ کیلومتر). حدود یک کیلومتر پیش از رسیدن به شهر، به سمت دابلاتسیخه بپیچید؛ این روستا
    ۳ تا ۴ کیلومتر جنوب‌شرقیِ مرکز شهر، بر کرانهٔ راست سوپسا قرار دارد و با جاده‌ای روستایی به آن می‌رسید
    که تکهٔ پایانی‌اش ممکن است شنی باشد. خودروی اقتصادی در هوای خشک از پسش برمی‌آید؛ پس از باران آهسته
    برانید. حدود ۲۷۵ کیلومتر و ۴ ساعت و ۲۵ دقیقه در نظر بگیرید. در سامترِدیا یا چوخاتائوری سوخت بزنید.
he:
  name: בית-המוזיאון של ניקולאי מאר
  short: >-
    מוזיאון כפרי לזכר ניקו מאר, המזרחן יליד קוטאיסי, בן לאב בריטי ולאם דוברת הניב הגוריאני, שאת תורת הלשון
    שלו גינה סטלין.
  body: >-
    **ניקולאי מאר ניסה להראות שכל שפות העולם צמחו מארבע הברות – סאל, בר, יון ורוש – והדרך שהובילה אותו
    לשם מתחילה בכפר הגוריאני הזה.**


    אביו, ג'יימס (יאקוב) מאר, בריטי ממוצא סקוטי, הגיע לקווקז כסוחר ב-1822. בשנות ה-20 של המאה ה-19, בהזמנת
    שליטי גוריה, הקים כאן, בדבלציחה, משק חקלאי ועבד בגננות בשירות נסיכי בית גוריאלי. אמו הייתה גאורגית
    שדיברה בניב הגוריאני. ניקולאי נולד בקוטאיסי ב-6 בינואר 1865. תחילה למד בבית הספר באוזורגטי הסמוכה,
    ועוד בילדותו איבד את אביו. ב-1884 סיים את הגימנסיה בקוטאיסי והמשיך לפקולטה ללימודי המזרח בסנקט פטרבורג.


    קשה שלא להעריך את מאר הצעיר. מ-1892 עד 1917 ניהל את החפירות בעיר אני, בירתה ההרוסה של ארמניה בימי
    הביניים. ב-1898 העתיק ותיאר כתבי יד גאורגיים בהר אתוס. ב-1902 עבד בסיני עם איוואנה ג'אווחישווילי,
    וב-1910 פרסם מחקר על "האביר בעור הנמר". ב-1912 התקבל כחבר מן המניין באקדמיה הרוסית למדעים.


    ואז באה "התורה היפתית", הקרויה על שם יפת בן נח. היא החלה כמשפחת שפות שקושרת את הגאורגית לשפות השמיות,
    והסתיימה בטענה שכל הדיבור האנושי צמח מאותם ארבעה יסודות קדמוניים. הדוקטרינה נכפתה על הבלשנות הסובייטית
    ושרדה אחרי מות יוצרה: מאר מת בלנינגרד ב-1934, ורק ביוני 1950 גינה אותה סטלין בעצמו מעל דפי "פראבדה".


    המוזיאון הוא בית כפרי צנוע ובו ספרים, כתבי יד ותצלומים, ולפי המקומיים מטפלים בו קרובי משפחה של בני
    הבית. כאן הוא אינו המלומד הגדול וגם לא הנביא שהוקע, אלא רק בנו של גנן ממוצא סקוטי בגבעות גוריה.
  tip: >-
    אין שעות פתיחה קבועות. המוזיאון נפתח לפי בקשה, לכן תאמו את הביקור מראש דרך מוניציפליטת צ׳וחאטאורי
    או מדריך מקומי, ובאותה הזדמנות שאלו אם יש תשלום. אל תבלבלו אותו עם בית-המוזיאון של נודאר דומבדזה בחידיסטאווי
    הסמוכה, המוקדש לסופר: אדם אחר ומאה אחרת. בדבלציחה יש גם כנסייה של גאורגיוס הקדוש. הכפר קטן ושקט, אז
    חנו בשולי הדרך במקום שבו אינכם חוסמים איש. הביאו מזומן לתרומה, וסיימו ברחצה בגוריס טבה שבבוקיציחה
    השכנה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני גורי, חשורי, זסטפוני וקוטאיסי עד סמטרדיה, ואז כ-7 ק״מ בכביש
    S12 לכיוון לנצ׳חותי. בסג'אווחו פנו דרומה לכביש Sh2 לכיוון צ׳וחאטאורי (כ-18 ק״מ). כקילומטר לפני העיירה
    פנו לדבלציחה, השוכנת 3–4 ק״מ דרום-מזרחית למרכז, על הגדה הימנית של הסופסה; מגיעים אליה בדרך כפרית שהקטע
    האחרון שלה עשוי להיות חצץ. רכב אקונומי יסתדר בה במזג אוויר יבש; אחרי גשם סעו בעדינות. חשבו על כ-275
    ק״מ ו-4 שעות ו-25 דקות. תדלקו בסמטרדיה או בצ׳וחאטאורי.
ar:
  name: متحف بيت نيكولاي مار
  short: >-
    متحف قروي لنيكو مار، المستشرق المولود في كوتايسي لأب بريطاني وأم تتكلم اللهجة الغورية، والذي أدان
    ستالين نظريته اللغوية.
  body: >-
    **حاول نيكولاي مار أن يردّ كل لغات الأرض إلى أربعة مقاطع صوتية، «سال» و«بير» و«يون» و«روش»، والطريق
    الذي قاده إلى ذلك يبدأ في هذه القرية الغورية.**


    كان أبوه، جيمس (ياكوب) مار، بريطانياً من أصل اسكتلندي، وصل إلى القوقاز تاجراً عام 1822. وفي عشرينيات
    القرن التاسع عشر، بدعوة من حكّام غوريا، أنشأ مزرعة هنا في دابلاتسيخه، وعمل في البستنة لدى أمراء غورييلي.
    أما أمه فكانت جورجية تتكلم اللهجة الغورية. وُلد نيكولاي في كوتايسي في 6 يناير 1865. درس أولاً في أوزورغيتي
    القريبة، وفقد أباه وهو صبي. وفي عام 1884 أتمّ دراسته في ثانوية كوتايسي والتحق بكلية اللغات الشرقية
    في سانت بطرسبورغ.


    يصعب ألا تُعجب بمار في بداياته. فمن 1892 إلى 1917 قاد التنقيبات في آني، العاصمة الأرمنية المدمّرة
    من العصور الوسطى. وفي 1898 نسخ مخطوطات جورجية ووصفها في جبل آثوس. وفي 1902 عمل في سيناء مع إيفانه
    جافاخيشفيلي، وفي 1910 نشر دراسة عن ملحمة «الفارس في جلد النمر». وفي 1912 صار عضواً كامل العضوية في
    أكاديمية العلوم الروسية.


    ثم جاءت «النظرية اليافثية»، المسمّاة باسم يافث بن نوح. بدأت أسرةً لغوية تربط الجورجية باللغات السامية،
    وانتهت بالزعم أن الكلام البشري كله نبت من تلك العناصر الأولية الأربعة. فُرض هذا المذهب على اللسانيات
    السوفييتية وعاش بعد صاحبه: توفي مار في لينينغراد عام 1934، ولم يُدِنه ستالين بنفسه على صفحات «برافدا»
    إلا في يونيو 1950.


    المتحف بيت قروي متواضع يضم كتباً ومخطوطات وصوراً، ويقول الأهالي إن أقارب العائلة يرعونه. وهنا لا يبدو
    مار العالمَ الكبير ولا النبيّ الذي سقطت دعواه، بل مجرد ابن بستانيّ من أصل اسكتلندي في تلال غوريا.
  tip: >-
    لا مواعيد ثابتة للمتحف. يُفتح عند الطلب، فرتّب زيارتك مسبقاً عبر بلدية تشوخاتاوري أو دليل محلي، واسأل
    في الوقت نفسه عن أي رسوم. لا تخلط بينه وبين البيت-المتحف لنودار دومبادزه في خيديستاوي القريبة، المكرّس
    للروائي: رجل آخر وقرن آخر. وفي دابلاتسيخه أيضاً كنيسة القديس جاورجيوس. القرية صغيرة وهادئة، فاركن
    على جانب الطريق حيث لا تعيق أحداً. احمل نقوداً للتبرع، واختم يومك بالسباحة في «غوريس تبا» في قرية
    بوكيتسيخه المجاورة.
  route: >-
    من تبليسي اسلك E60/S1 غرباً مروراً بغوري وخاشوري وزيستافوني وكوتايسي حتى سامتريديا، ثم S12 نحو 7 كم
    باتجاه لانتشخوتي. عند ساجافاخو انعطف جنوباً إلى Sh2 باتجاه تشوخاتاوري (نحو 18 كم). وقبل البلدة بنحو
    كيلومتر انعطف نحو دابلاتسيخه، الواقعة على بُعد 3–4 كم جنوب شرقي المركز، على الضفة اليمنى لنهر سوبسا،
    ويوصل إليها طريق قروي قد يكون آخر مقطع منه من الحصى. تجتازه سيارة اقتصادية في الطقس الجاف؛ وبعد المطر
    قُد برفق. احسب نحو 275 كم و4 ساعات و25 دقيقة. تزوّد بالوقود في سامتريديا أو تشوخاتاوري.
