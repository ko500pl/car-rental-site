ka:
  name: ოქროს ჩარდახი — იმერეთის მეფეთა სასახლე
  short: >-
    იმერეთის მეფეთა ქუთაისური რეზიდენციის ერთადერთი გადარჩენილი დარბაზი: ორსართულიანი სახლი რიონის პირას,
    დაახლოებით 800 წლის ჭადრის ჩრდილში.
  body: >-
    **სამეფო რეზიდენციიდან, სადაც იმერეთის მეფეები სტუმრებს იღებდნენ, ერთადერთი შენობა გადარჩა — ორსართულიანი
    სახლი რიონის პირას, ირგვლივ შემოვლებული აივნით.**


    ოქროს ჩარდახი იმერეთის მეფეთა მისაღები დარბაზი იყო ქუთაისში. რეზიდენცია ოდესღაც რამდენიმე შენობისგან
    შედგებოდა; დღეს მხოლოდ ეს დარჩა. შენობა ძლიერ გადაკეთდა — XIX საუკუნეში იგი საფუძვლიანად გარდაიქმნა,
    — მაგრამ მის კედლებში XVII საუკუნით დათარიღებული ფრაგმენტები შემორჩა. მიუხედავად ამისა, ის მაინც იშვიათობაა:
    შუა საუკუნეების ქართული საერო ხუროთმოძღვრების ნიმუში, რომელიც არც სალოცავად აშენდა და არც საომრად.


    აქ ყველაზე ხნიერი შენობა კი არა, ხეა. ეზოში დაახლოებით 800 წლის ჭადარი დგას, რომელიც ქუთაისში XVII
    საუკუნეში ნამყოფ უცხოელ მოგზაურთა ჩანაწერებშიც იხსენიება. ის ხე, რომელზეც ისინი წერდნენ, ახლა თქვენ
    გჩრდილავთ.


    დარბაზი ქუთაისის ისტორიულ-ხუროთმოძღვრული მუზეუმ-ნაკრძალის ნაწილია. დიდს ნუ მოელით: ეს წყნარი ნახევარი
    საათია და არა სასახლის ტური. მაგრამ ქუთაისში ცოტა ადგილი თუ მიგიყვანთ ასე ახლოს მეფეთა ზღურბლთან.
  tip: >-
    ოფიციალური სამუშაო საათებია ორშაბათიდან პარასკევამდე, 10:00–18:00 — მხოლოდ სამუშაო დღეებში, რაც შაბათ-კვირას
    ჩამოსულ ბევრ სტუმარს იმედს უცრუებს, ამიტომ წინასწარ დაგეგმეთ. შესვლის საფასური წერისას დადასტურებული
    არ იყო — კარზე იკითხეთ. ნახევარი საათი საკმარისია. მისამართია ცისფერყანწელების ქუჩა №9, ძველ ქალაქში,
    მდინარის პირას, თეთრ ხიდთან ახლოს; ქუჩები ვიწროა, ამიტომ მანქანა რუსთაველის გამზირთან დატოვეთ და ფეხით
    გაიარეთ. 2025 წელს შიგნით ახალი ექსპოზიციის გახსნა იყო დაგეგმილი — ადგილზე იკითხეთ, რა არის გამოფენილი.
    ახლოსაა ოპერა და დრამატული თეატრი.
  route: >-
    ქუთაისი თბილისიდან დაახლოებით 230 კილომეტრშია, გზა დაახლოებით 3 საათსა და 20 წუთს გრძელდება. დასავლეთით
    ს1 (E60) გზატკეცილს მიჰყევით მცხეთის, გორისა და ხაშურის გავლით, რიკოთის მონაკვეთსა და ზესტაფონს იქით,
    ქუთაისამდე — გზა მთლიანად მოასფალტებულია, ბენზინგასამართი ყველა ქალაქშია. ქალაქში ცენტრისა და რუსთაველის
    გამზირის მიმართულებას მიჰყევით; ოქროს ჩარდახი მდინარისპირა ძველ ქალაქშია, თეთრ ხიდთან ახლოს, ოპერიდან
    ხუთიოდე წუთის სავალზე. მანქანა მთავარ ქუჩაზე დატოვეთ და ბოლო მონაკვეთი ფეხით გაიარეთ. ეკონომკლასის
    მანქანაც სავსებით საკმარისია.
en:
  name: Okros Chardakhi (Palace of the Imeretian Kings)
  short: >-
    The last surviving hall of the Imeretian kings' Kutaisi residence: a two-storey house above the Rioni,
    shaded by a plane tree some 800 years old.
  body: >-
    **Of the royal residence where the kings of Imereti received their guests, one building survives —
    a two-storey house above the Rioni, with a balcony running all the way round it.**


    Okros Chardakhi, the "Golden Pavilion", was the reception hall of the Imeretian kings in Kutaisi.
    The residence once had several buildings; this is the only one left. It has been heavily rebuilt —
    the 19th century reshaped it thoroughly — yet fragments dated to the 17th century remain in its walls.
    Even so it is a rarity: a piece of medieval Georgian architecture made neither for prayer nor for
    war.


    The oldest thing here is not the building. In the courtyard stands a plane tree about 800 years old,
    noted by foreign travellers who passed through Kutaisi in the 17th century. The tree they wrote about
    is the one that shades you now.


    The hall belongs to the Kutaisi Historical-Architectural Museum-Reserve. Keep expectations modest:
    this is a quiet half-hour, not a palace tour. But few places in Kutaisi bring you this close to the
    kings' own threshold.
  tip: >-
    Listed opening hours are Monday to Friday, 10:00–18:00 — weekdays only, which catches out many weekend
    visitors, so plan accordingly. The entry fee was not confirmed at the time of writing; check at the
    door. Half an hour is enough. The address is 9 Tsisperkantselebi Street in the old town, by the river
    near the White Bridge; the lanes are narrow, so park near Rustaveli Avenue and walk. A new museum
    display was reported to be opening in 2025; check at the door what is on show. Pair it with the opera
    house and the drama theatre, both a few minutes away.
  route: >-
    Kutaisi is about 230 km from Tbilisi, roughly 3 hours 20 minutes. Take the S1 (E60) west past Mtskheta,
    Gori and Khashuri, over the Rikoti section and past Zestaponi into Kutaisi — four-lane in long stretches,
    asphalt throughout, with fuel in every town. In the city head for the centre and Rustaveli Avenue;
    Okros Chardakhi is in the riverside old town near the White Bridge, a five-minute walk from the opera
    house. Leave the car on a main street and walk the last stretch. An economy car is perfectly adequate.
ru:
  name: Окрос Чардахи (дворец имеретинских царей)
  short: >-
    Последний уцелевший зал кутаисской резиденции имеретинских царей: двухэтажный дом над Риони в тени
    платана, которому около 800 лет.
  body: >-
    **От царской резиденции, где имеретинские цари принимали гостей, уцелело одно-единственное здание
    — двухэтажный дом над Риони, опоясанный балконом.**


    Окрос Чардахи, «Золотой шатёр», служил приёмным залом имеретинских царей в Кутаиси. Когда-то резиденция
    состояла из нескольких построек; осталась только эта. Здание сильно перестроено — XIX век переделал
    его основательно, — и всё же в стенах сохранились фрагменты, датированные XVII веком. Даже в таком
    виде это редкость: образец средневековой грузинской архитектуры, созданный не для молитвы и не для
    войны.


    Самое древнее здесь — вовсе не здание. Во дворе растёт платан возрастом около 800 лет; его отмечали
    иностранные путешественники, проезжавшие через Кутаиси в XVII веке. Дерево, о котором они писали,
    — то самое, что сейчас укрывает вас своей тенью.


    Зал входит в Кутаисский историко-архитектурный музей-заповедник. Не ждите многого: это тихие полчаса,
    а не экскурсия по дворцу. Но мало где в Кутаиси можно подойти так близко к порогу самих царей.
  tip: >-
    Официальные часы работы — с понедельника по пятницу, 10:00–18:00, только по будням; на этом спотыкаются
    многие, кто приезжает в выходные, так что планируйте заранее. Стоимость входа на момент написания
    подтвердить не удалось — уточните у входа. Получаса вполне достаточно. Адрес: улица Цисперканцелеби,
    9, в старом городе, у реки, недалеко от Белого моста; улочки узкие, поэтому оставьте машину у проспекта
    Руставели и пройдитесь пешком. На 2025 год внутри было запланировано открытие новой экспозиции — уточните
    у входа, что сейчас выставлено. Совместите визит с оперным и драматическим театрами — оба в нескольких
    минутах ходьбы.
  route: >-
    Кутаиси находится примерно в 230 км от Тбилиси, дорога занимает около 3 часов 20 минут. Езжайте на
    запад по трассе S1 (E60) мимо Мцхеты, Гори и Хашури, через Рикоти и мимо Зестафони до Кутаиси — на
    длинных отрезках четыре полосы, асфальт на всём протяжении, заправки в каждом городе. В городе держите
    курс на центр и проспект Руставели; Окрос Чардахи — в старом городе у реки, недалеко от Белого моста,
    в пяти минутах ходьбы от оперного театра. Оставьте машину на главной улице и последний отрезок пройдите
    пешком. Машины эконом-класса вполне достаточно.
fa:
  name: اوکروس چارداخی (کاخ پادشاهان ایمرتی)
  short: >-
    آخرین تالار بازمانده از اقامتگاه پادشاهان ایمرتی در کوتایسی: خانه‌ای دوطبقه بر فراز رود ریونی، در
    سایهٔ چناری حدوداً ۸۰۰ ساله.
  body: >-
    **از اقامتگاه سلطنتی‌ای که پادشاهان ایمرتی مهمانانشان را در آن به حضور می‌پذیرفتند، تنها یک بنا بر
    جا مانده است — خانه‌ای دوطبقه بر فراز رود ریونی، با ایوانی که گرداگردش را فرا گرفته است.**


    اوکروس چارداخی، یعنی «کوشک زرین»، تالار پذیرایی پادشاهان ایمرتی در کوتایسی بود. این اقامتگاه روزگاری
    از چند بنا تشکیل می‌شد؛ اکنون فقط همین یکی مانده است. بنا به‌شدت بازسازی شده — سدهٔ نوزدهم آن را از
    بنیاد دگرگون کرد — اما در دیوارهایش هنوز پاره‌هایی مانده که به سدهٔ هفدهم تاریخ‌گذاری شده‌اند. با
    این همه، اثری کمیاب است: نمونه‌ای از معماری قرون وسطایی گرجستان که نه برای عبادت ساخته شد و نه برای
    جنگ.


    کهن‌ترین چیز اینجا خودِ بنا نیست. در حیاط چناری حدوداً ۸۰۰ ساله ایستاده است که جهانگردان خارجیِ گذرکرده
    از کوتایسی در سدهٔ هفدهم از آن یاد کرده‌اند. همان درختی که آنان وصفش را نوشتند، اکنون بر سر شما سایه
    انداخته است.


    این تالار بخشی از مجموعهٔ موزه‌ای و حفاظت‌شدهٔ تاریخی‌ـ‌معماری کوتایسی است. انتظار زیادی نداشته باشید:
    اینجا نیم ساعتی آرام است، نه گشتی در یک کاخ. اما در کوتایسی کمتر جایی شما را تا این اندازه به آستانهٔ
    خودِ پادشاهان نزدیک می‌کند.
  tip: >-
    ساعات رسمی بازدید دوشنبه تا جمعه، ۱۰:۰۰–۱۸:۰۰ است — فقط روزهای کاری؛ و بسیاری از کسانی که شنبه یا
    یکشنبه می‌آیند با درِ بسته روبه‌رو می‌شوند، پس از پیش برنامه بریزید. بهای ورودی هنگام نگارش این متن
    تأیید نشده بود؛ دمِ در بپرسید. نیم ساعت کافی است. نشانی: خیابان تسیسپرکانتسلبی، شمارهٔ ۹، در شهر قدیم،
    کنار رودخانه و نزدیک پل سفید. کوچه‌ها باریک‌اند، پس خودرو را نزدیک خیابان روستاولی پارک کنید و پیاده
    بروید. گشایش نمایشگاه تازه‌ای در داخل بنا برای ۲۰۲۵ خبر داده شده بود؛ دمِ در بپرسید اکنون چه چیزی
    به نمایش درآمده است. بازدید را با ساختمان اپرا و تئاتر درام همراه کنید؛ هر دو تنها چند دقیقه با آن
    فاصله دارند.
  route: >-
    کوتایسی حدود ۲۳۰ کیلومتر با تفلیس فاصله دارد و رانندگی تا آنجا نزدیک به ۳ ساعت و ۲۰ دقیقه طول می‌کشد.
    از جادهٔ S1 (E60) به سمت غرب بروید، از کنار متسختا، گوری و خاشوری بگذرید، از بخش ریکوتی عبور کنید
    و پس از زستافونی به کوتایسی برسید — جاده در بخش‌های طولانی چهاربانده و سراسر آسفالت است و در هر شهر
    پمپ‌بنزین هست. در شهر به سمت مرکز و خیابان روستاولی بروید؛ اوکروس چارداخی در شهر قدیمِ کنار رودخانه،
    نزدیک پل سفید و پنج دقیقه پیاده از ساختمان اپراست. خودرو را در یکی از خیابان‌های اصلی بگذارید و باقی
    راه را پیاده بروید. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: אוקרוס צ'ארדאחי (ארמון מלכי אימרתי)
  short: 'האולם האחרון ששרד ממעון מלכי אימרתי בקוטאיסי: בית בן שתי קומות מעל נהר ריוני, בצל עץ דולב בן
    כ-800 שנה.'
  body: >-
    **מן המעון המלכותי שבו קיבלו מלכי אימרתי את אורחיהם שרד מבנה אחד בלבד — בית בן שתי קומות מעל נהר ריוני,
    שמרפסת מקיפה אותו מכל עבר.**


    אוקרוס צ'ארדאחי, "ביתן הזהב", היה אולם קבלת הפנים של מלכי אימרתי בקוטאיסי. המעון כלל פעם כמה מבנים;
    זה היחיד שנותר. הוא נבנה מחדש במידה רבה — במאה ה-19 עוצב מחדש ביסודיות — ובכל זאת השתמרו בקירותיו
    חלקים המתוארכים למאה ה-17. גם כך זהו דבר נדיר: פיסה של אדריכלות גאורגית מימי הביניים שלא נבנתה לא
    לתפילה ולא למלחמה.


    הדבר העתיק ביותר כאן אינו הבניין. בחצר עומד עץ דולב בן כ-800 שנה, שנוסעים זרים שעברו בקוטאיסי במאה
    ה-17 הזכירו אותו ברשימותיהם. העץ שעליו כתבו הוא אותו עץ שמטיל עליכם את צלו עכשיו.


    האולם שייך למוזיאון-השמורה ההיסטורי-אדריכלי של קוטאיסי. אל תצפו ליותר מדי: זו חצי שעה שקטה, לא סיור
    בארמון. אבל מעט מקומות בקוטאיסי מקרבים אתכם כל כך אל מפתנם של המלכים עצמם.
  tip: >-
    שעות הפתיחה הרשמיות: ימים שני עד שישי, 10:00–18:00 בלבד — ורבים שמגיעים בשבת או ביום ראשון מוצאים
    דלת סגורה, אז תכננו מראש. דמי הכניסה לא אומתו בעת הכתיבה; בררו בכניסה. חצי שעה מספיקה. הכתובת: רחוב
    ציספרקנצלבי 9, בעיר העתיקה, ליד הנהר, סמוך לגשר הלבן; הסמטאות צרות, לכן השאירו את הרכב ליד שדרות רוסתאוולי
    והמשיכו ברגל. לפי הדיווחים, תצוגה חדשה בתוך הבניין הייתה אמורה להיפתח ב-2025 — בררו בכניסה מה מוצג
    כעת. שלבו בביקור את בית האופרה ואת התיאטרון הדרמטי, שניהם במרחק דקות ספורות.
  route: >-
    קוטאיסי נמצאת כ-230 ק"מ מטביליסי, כ-3 שעות ו-20 דקות נסיעה. סעו מערבה בכביש S1 (E60) על פני מצחתה,
    גורי וחשורי, דרך קטע ריקוטי ועל פני זסטפוני עד קוטאיסי — בקטעים ארוכים ארבעה נתיבים, אספלט לכל האורך
    ותחנות דלק בכל עיר. בעיר כוונו למרכז ולשדרות רוסתאוולי; אוקרוס צ'ארדאחי נמצא בעיר העתיקה שעל גדת הנהר,
    סמוך לגשר הלבן, חמש דקות הליכה מבית האופרה. השאירו את הרכב ברחוב ראשי ועשו את הקטע האחרון ברגל. רכב
    מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: أوكروس تشارداخي (قصر ملوك إيميريتي)
  short: >-
    آخر قاعة باقية من مقرّ ملوك إيميريتي في كوتايسي: بيت من طابقين يطلّ على نهر ريوني، في ظلّ شجرة دُلب
    يناهز عمرها 800 عام.
  body: >-
    **من المقرّ الملكي الذي كان ملوك إيميريتي يستقبلون فيه ضيوفهم لم يبقَ سوى مبنى واحد — بيت من طابقين
    يطلّ على نهر ريوني، تلتفّ حوله شرفة من كل الجهات.**


    كان أوكروس تشارداخي، أي «السرادق الذهبي»، قاعةَ الاستقبال لدى ملوك إيميريتي في كوتايسي. ضمّ المقرّ
    يومًا عدة مبانٍ، ولم يبقَ منها إلا هذا. وقد أُعيد بناؤه إلى حدّ بعيد — إذ غيّر القرن التاسع عشر ملامحه
    تغييرًا جذريًا — لكن جدرانه ما زالت تحتفظ بأجزاء يعود تاريخها إلى القرن السابع عشر. ومع ذلك يبقى نادرًا:
    قطعة من العمارة الجورجية في العصور الوسطى لم تُشيَّد للصلاة ولا للحرب.


    ليس المبنى أقدم ما في المكان. ففي الفناء تقف شجرة دُلب يناهز عمرها 800 عام، ذكرها رحّالة أجانب مرّوا
    بكوتايسي في القرن السابع عشر. والشجرة التي كتبوا عنها هي نفسها التي تُظلّك الآن.


    تتبع القاعة محميّةَ كوتايسي المتحفية التاريخية والمعمارية. لا ترفع سقف توقعاتك: إنها نصف ساعة هادئة،
    لا جولة في قصر. لكن قلّة من الأماكن في كوتايسي تقرّبك إلى هذا الحدّ من عتبة الملوك أنفسهم.
  tip: >-
    ساعات العمل المعلنة من الاثنين إلى الجمعة، 10:00–18:00 — في أيام العمل فقط، وهو ما يفاجئ كثيرًا من
    الزوار القادمين يومَي السبت والأحد، فخطّط مسبقًا. لم يكن رسم الدخول مؤكَّدًا وقت كتابة هذا النص؛ اسأل
    عند الباب. تكفي نصف ساعة. العنوان: شارع تسيسبيركانتسيليبي رقم 9، في المدينة القديمة، على ضفة النهر
    قرب الجسر الأبيض؛ الأزقة ضيقة، فاترك السيارة قرب جادة روستافيلي وأكمل سيرًا. أفادت التقارير بأن معرضًا
    جديدًا سيُفتتح داخل المبنى عام 2025، فاسأل عند الباب عمّا هو معروض الآن. واجمع الزيارة مع دار الأوبرا
    والمسرح الدرامي، وكلاهما على بعد دقائق قليلة.
  route: >-
    تبعد كوتايسي نحو 230 كم عن تبليسي، أي قرابة 3 ساعات و20 دقيقة بالسيارة. اتجه غربًا على الطريق S1 (E60)
    مرورًا بمتسخيتا وغوري وخاشوري، ثم عبر مقطع ريكوتي ومرورًا بزستافوني حتى كوتايسي — الطريق بأربعة مسارات
    في امتدادات طويلة، معبَّد بالأسفلت على طوله، والوقود متوفر في كل مدينة. في المدينة اتجه نحو المركز
    وجادة روستافيلي؛ يقع أوكروس تشارداخي في المدينة القديمة على ضفة النهر قرب الجسر الأبيض، على بعد خمس
    دقائق سيرًا من دار الأوبرا. اترك السيارة في شارع رئيسي وامشِ المسافة الأخيرة. وسيارة من الفئة الاقتصادية
    كافية تمامًا.
