ka:
  name: ბარისახო
  short: >-
    ხევსურეთის კარიბჭე არაგვის პირას: საოჯახო სასტუმროები, ცხელი სადილი და ხანგრძლივი ისტორია, სანამ გზა
    ჯიპის ბილიკად იქცევა.
  body: >-
    **ხევსურეთში შემავალი ერთადერთი გზა ბარისახოზე გადის, და ბევრი მოგზაურისთვის დღე სწორედ აქ მთავრდება:
    ცხელი სადილით, თბილი ლოგინით და ფანჯრის ქვეშ მთელი ღამე მოჩუხჩუხე არაგვით.**


    სოფელი ხევსურეთის არაგვის მარჯვენა ნაპირზე, გუდამაყრის ქედის აღმოსავლეთ კალთაზე დგას. ბარისახო ხევსურეთის
    თემის ცენტრია, თემი კი ოცდაათზე მეტ სოფელს აერთიანებს — მათ შორის კორშას, როშკას, გუდანსა და ახიელს.
    2014 წლის აღწერით აქ 153 ადამიანი ცხოვრობდა.


    მშვიდ სოფელს მძიმე წარსულიც აქვს. 1813 წელს ბარისახოსთან აჯანყებული ხევსურები რუსეთის ჯარს შეებრძოლნენ
    და დამარცხდნენ. XIX საუკუნის მეორე ნახევარში სოფელში 46 კომლი ცხოვრობდა. 1934 წელს კი სწორედ აქ საზეიმოდ
    გაიხსნა დუშეთიდან ამომავალი გზა, რომლის მშენებლობაც 1930 წელს დაიწყო. ეს ის გზაა, რომლითაც დღეს თქვენ
    ამოდიხართ.


    ბარისახოს ყველაზე ძვირფასი ნივთი თბილისში ინახება. საქართველოს ეროვნულ მუზეუმში დაცულია სოფლიდან ჩამოტანილი
    რიტუალური წყლის ჭურჭელი ლომის გამოსახულებით, XII–XIV საუკუნეებში შექმნილი და ხმალას ანგელოზისადმი
    შეწირული. მასზე მოგვიანებით, XVII–XVIII საუკუნეებში ამოტვიფრული წარწერა გვამცნობს, რომ ვინმე საღირამ
    ის ხმალასა და მთავარანგელოზს შვილის სახელით შესწირა. აქ სიტყვები წყდება.


    დღეს ბარისახო, უპირველეს ყოვლისა, მოგზაურის ბანაკია. აქედან გზა დათვისჯვრის უღელტეხილით შატილისკენ
    მიიკლაკნება, ან როშკასა და აბუდელაურის ტბებისკენ უხვევს, და იქ მხოლოდ ჯიპი თუ გამოგადგებათ. ბარისახოში
    ჯერ კიდევ თქვენ წყვეტთ, რა ტემპით იაროთ; მის იქით ამას უკვე მთა წყვეტს.
  tip: >-
    შესასვლელი საფასური არ არსებობს: ეს ცოცხალი სოფელია და არა ღირსშესანიშნაობა. ბარისახო ღამის გასათევად
    გამოიყენეთ და ივლისსა და აგვისტოში სასტუმრო სახლი წინასწარ დაჯავშნეთ, როცა შატილისკენ მიმავალი მგზავრები
    ყველა ოთახს იკავებენ. თან იქონიეთ ნაღდი ფული: პატარა სახლებში ბარათს იშვიათად იღებენ. სეზონი დაახლოებით
    მაისიდან ოქტომბრამდე გრძელდება; სხვა დროს ტალახმა და თოვლმა შეიძლება გზა ჩაკეტოს. დიდუბიდან მარშრუტკა
    სეზონზე მხოლოდ ოთხშაბათობით და შაბათობით დადის, ამიტომ მანქანა თავისუფლებას გაძლევთ. ხევსურეთის სალოცავები
    დღესაც მოქმედი წმინდა ადგილებია: ქვის გალავანს გარედან შეხედეთ და შიგნით ნუ შეხვალთ.
  route: >-
    თბილისიდან S3-ით (საქართველოს სამხედრო გზა) მცხეთის გავლით ჟინვალამდე ჩრდილოეთით იარეთ — დაახლოებით
    ერთი საათი. წყალსაცავთან შ26-ზე გადაუხვიეთ ბარისახოსა და შატილის მიმართულებით და არაგვს აღმა გაჰყევით.
    პირველი მონაკვეთი ასფალტიანია, სოფლის მისადგომი კი ხრეშიანი: ზაფხულში მტვრიანი, წვიმის შემდეგ მოლიპული.
    108 კილომეტრს დაახლოებით 2 საათი და 30 წუთი დასჭირდება. ავზი S3-ზე, გადასახვევამდე შეავსეთ და ზემოთ
    საწვავის იმედი ნუ გექნებათ. გონივრული არჩევანია მაღალი კლირენსის მქონე მანქანა: ფრთხილი მძღოლი მშრალ
    ამინდში პატარა მანქანითაც ამოვა, მაგრამ კლირენსი გამოგადგებათ, ბარისახოს იქით კი ნამდვილი ჯიპი დაგჭირდებათ.
en:
  name: Barisakho
  short: >-
    The gateway village of Khevsureti on the Aragvi: guesthouses, a hot meal and a long memory before
    the road turns into a 4x4 track.
  body: >-
    **The only road into Khevsureti runs through Barisakho, and for many travellers the day's driving
    ends here: a hot meal, a bed, and the Aragvi talking all night below the window.**


    The village stands on the right bank of the Khevsureti Aragvi, on the eastern slope of the Gudamakari
    range. It is the centre of the Khevsureti community, an administrative knot that ties together more
    than thirty villages, among them Korsha, Roshka, Gudani and Akhieli. At the 2014 census, 153 people
    lived here.


    A quiet place with a hard past. In 1813, near Barisakho, rebel Khevsurs fought a Russian army and
    were beaten. In the second half of the nineteenth century the village counted 46 households. In 1934
    the road from Dusheti, begun in 1930, was opened here with ceremony. It is the road you arrive on.


    Barisakho's most precious object lives in Tbilisi. The Georgian National Museum keeps a ritual water
    vessel from the village, decorated with a lion and made between the twelfth and fourteenth centuries,
    dedicated to the shrine-angel Khmala. A later inscription, of the seventeenth or eighteenth century,
    records that a man named Saghira offered it to Khmala and the Archangel on behalf of a son. Then the
    words break off.


    Today Barisakho is above all a base camp. Beyond it the road climbs over the Datvisjvari pass to Shatili,
    or turns towards Roshka and the Abudelauri Lakes, and from there only a 4x4 will do. In Barisakho
    you still set the pace; past it, the mountains do.
  tip: >-
    There is no entry fee: this is a living village, not a site. Treat it as your overnight stop and book
    a guesthouse ahead in July and August, when Shatili-bound drivers fill the beds; carry cash, as small
    places rarely take cards. The season runs roughly May to October; outside it, mud and snow can close
    the approach. A public minibus from Didube runs only on Wednesdays and Saturdays in season, so a car
    gives you freedom. Khevsureti shrines are still active sacred places: admire any stone enclosure from
    outside rather than walking in.
  route: >-
    From Tbilisi take the S3 (Georgian Military Road) north past Mtskheta to Zhinvali, about an hour.
    At the reservoir turn off onto the Sh26 towards Barisakho and Shatili and follow the Aragvi upstream.
    The first stretch is asphalt; the approach to the village is gravel, dusty in summer and slippery
    after rain. Allow about 2 hours 30 minutes for the 108 km. Fill the tank on the S3 before the turn-off
    and do not count on fuel further up. An SUV is the sensible choice: a careful driver can manage in
    a small car in dry weather, but clearance helps, and beyond Barisakho you will need a genuine 4x4.
ru:
  name: Барисахо
  short: >-
    Ворота Хевсурети на берегу Арагви: гостевые дома, горячий ужин и долгая память — прежде чем дорога
    станет колеёй для внедорожников.
  body: >-
    **Единственная дорога в Хевсурети проходит через Барисахо, и для многих путешественников дневной перегон
    заканчивается именно здесь: горячий ужин, постель и Арагви, которая всю ночь шумит под окном.**


    Село стоит на правом берегу Хевсурской Арагви, на восточном склоне Гудамакарского хребта. Это центр
    Хевсуретской общины — административный узел, который связывает больше тридцати сёл, среди них Корша,
    Рошка, Гудани и Ахиели. По переписи 2014 года здесь жили 153 человека.


    Тихое место с тяжёлым прошлым. В 1813 году близ Барисахо восставшие хевсуры сразились с русской армией
    и были разбиты. Во второй половине XIX века в селе насчитывалось 46 дворов. В 1934 году сюда торжественно
    довели дорогу из Душети, которую начали строить в 1930-м. По ней вы и приехали.


    Самая драгоценная вещь Барисахо находится в Тбилиси. В Национальном музее Грузии хранится ритуальный
    сосуд для воды из этого села с изображением льва, созданный между XII и XIV веками и посвящённый Хмале,
    ангелу-покровителю святилища. Более поздняя надпись, XVII или XVIII века, сообщает, что некий Сагира
    поднёс его Хмале и Архангелу за сына. Дальше слова обрываются.


    Сегодня Барисахо — прежде всего базовый лагерь. За ним дорога поднимается через перевал Датвисджвари
    к Шатили или сворачивает к Рошке и Абуделаурским озёрам, и дальше пройдёт только полноприводная машина.
    В Барисахо темп ещё задаёте вы; дальше его задают горы.
  tip: >-
    Платы за вход нет: это живое село, а не музей под открытым небом. Считайте его местом ночёвки и в
    июле–августе бронируйте гостевой дом заранее — в это время кровати занимают водители, едущие в Шатили;
    берите наличные, маленькие заведения карты почти не принимают. Сезон длится примерно с мая по октябрь;
    в остальное время подъезд могут перекрыть грязь и снег. Рейсовая маршрутка от Дидубе ходит в сезон
    только по средам и субботам, так что машина даёт свободу. Святилища Хевсурети — по-прежнему действующие
    священные места: любуйтесь каменными оградами снаружи и не заходите внутрь.
  route: >-
    Из Тбилиси по трассе S3 (Военно-Грузинская дорога) на север, мимо Мцхеты до Жинвали — около часа.
    У водохранилища сверните на Sh26 в сторону Барисахо и Шатили и поднимайтесь вверх по Арагви. Первый
    участок асфальтирован; подъезд к селу — гравийка, летом пыльная, после дождя скользкая. На 108 км
    закладывайте около 2 часов 30 минут. Заправьтесь на S3 до поворота и не рассчитывайте на топливо выше.
    Разумный выбор — кроссовер: аккуратный водитель в сухую погоду доберётся и на маленькой машине, но
    клиренс не помешает, а за Барисахо понадобится настоящий полноприводный внедорожник.
fa:
  name: باریساخو
  short: >-
    دروازهٔ خوسورتی در کنار آراگوی: مهمان‌خانه، غذای گرم و حافظه‌ای دیرپا، پیش از آنکه جاده به راهی خاکی
    برای خودروهای 4x4 بدل شود.
  body: >-
    **تنها جادهٔ ورود به خوسورتی از باریساخو می‌گذرد و برای بسیاری از مسافران، رانندگیِ آن روز همین‌جا
    تمام می‌شود: غذایی گرم، بستری آماده و آراگوی که تمام شب زیر پنجره زمزمه می‌کند.**


    روستا بر کرانهٔ راست آراگویِ خوسورتی، در دامنهٔ شرقی رشته‌کوه گوداماکاری، قرار دارد. اینجا مرکز جامعهٔ
    خوسورتی است؛ گرهی اداری که بیش از سی روستا را به هم پیوند می‌دهد، از جمله کورشا، روشکا، گودانی و آخیِلی.
    بنا بر سرشماری سال ۲۰۱۴ جمعیت روستا ۱۵۳ نفر بود.


    جایی آرام با گذشته‌ای سخت. در سال ۱۸۱۳، نزدیک باریساخو، خوسورهای شورشی با ارتشی روس جنگیدند و شکست
    خوردند. در نیمهٔ دوم قرن نوزدهم، روستا ۴۶ خانوار داشت. در سال ۱۹۳۴ جاده‌ای که از دوشتی می‌آید و ساختش
    از ۱۹۳۰ آغاز شده بود، با تشریفات تا اینجا گشوده شد. همان جاده‌ای که شما از آن رسیده‌اید.


    گران‌بهاترین یادگار باریساخو در تفلیس نگهداری می‌شود. موزهٔ ملی گرجستان ظرفی آیینی برای آب از این
    روستا دارد که نقش شیری بر آن است؛ این ظرف میان قرن‌های دوازدهم و چهاردهم ساخته شده و به خمالا، فرشتهٔ
    نگهبانِ زیارتگاه، پیشکش شده است. کتیبه‌ای متأخرتر، از قرن هفدهم یا هجدهم، می‌گوید مردی به نام ساغیرا
    آن را برای پسرش به خمالا و فرشتهٔ مقرب نذر کرده است. و همین‌جا کلمات ناتمام می‌مانند.


    امروز باریساخو پیش از هر چیز یک اردوگاه پایه است. پس از آن، جاده از گردنهٔ داتویسجواری به سوی شاتیلی
    بالا می‌رود یا به سمت روشکا و دریاچه‌های آبودلائوری می‌پیچد، و از آنجا به بعد فقط خودروی چهارچرخ‌محرک
    از پس راه برمی‌آید. در باریساخو هنوز شما آهنگ سفر را تعیین می‌کنید؛ از آن به بعد، کوه‌ها.
  tip: >-
    ورودیه‌ای در کار نیست: اینجا روستایی زنده است، نه یک بنای تاریخی. آن را منزلگاه شبانهٔ خود بدانید
    و در ژوئیه و اوت از پیش مهمان‌خانه رزرو کنید، چون رانندگانِ راهیِ شاتیلی تخت‌ها را پر می‌کنند؛ پول
    نقد همراه داشته باشید، زیرا جاهای کوچک به‌ندرت کارت می‌پذیرند. فصل سفر تقریباً از مه تا اکتبر است؛
    بیرون از آن، گل‌ولای و برف ممکن است راه را ببندد. مینی‌بوس عمومی از دیدوبه در فصل فقط چهارشنبه‌ها
    و شنبه‌ها حرکت می‌کند، پس خودرو به شما آزادی می‌دهد. زیارتگاه‌های خوسورتی هنوز مکان‌های مقدسِ زنده‌اند:
    هر حصار سنگی را از بیرون تماشا کنید و پا به درونش نگذارید.
  route: >-
    از تفلیس جادهٔ S3 (جادهٔ نظامی گرجستان) را به سمت شمال بگیرید، از کنار متسختا بگذرید و تا ژینوالی
    بروید؛ حدود یک ساعت. کنار مخزن سد به جادهٔ Sh26 به سوی باریساخو و شاتیلی بپیچید و در امتداد آراگوی
    رو به بالادست بروید. بخش نخست آسفالت است؛ راهِ نزدیک روستا شنی است، تابستان پرگردوخاک و پس از باران
    لغزنده. برای این ۱۰۸ کیلومتر حدود ۲ ساعت و ۳۰ دقیقه وقت بگذارید. پیش از انشعاب، روی S3 باک را پر کنید
    و به سوخت در بالادست امید نبندید. شاسی‌بلند انتخاب معقولی است: رانندهٔ محتاط در هوای خشک با خودروی
    کوچک هم از پس راه برمی‌آید، اما فاصلهٔ کف از زمین کمک می‌کند، و پس از باریساخو به یک خودروی 4x4 واقعی
    نیاز خواهید داشت.
he:
  name: בריסאחו
  short: 'שער הכניסה לחבסורתי על גדת האראגווי: בתי הארחה, ארוחה חמה וזיכרון ארוך — לפני שהכביש הופך לדרך
    עפר לרכבי 4x4.'
  body: >-
    **הדרך היחידה לחבסורתי עוברת בבריסאחו, ולמטיילים רבים יום הנהיגה מסתיים כאן: ארוחה חמה, מיטה, והאראגווי
    ששוצף כל הלילה מתחת לחלון.**


    הכפר עומד על הגדה הימנית של האראגווי החבסורי, במדרון המזרחי של רכס גודמקרי. זהו מרכז קהילת חבסורתי
    — צומת מנהלי שקושר יחד יותר משלושים כפרים, ובהם קורשה, רושקה, גודאני ואחיאלי. במפקד האוכלוסין של 2014
    חיו כאן 153 בני אדם.


    מקום שקט עם עבר קשה. ב-1813, סמוך לבריסאחו, נלחמו חבסורים מורדים בצבא רוסי והובסו. במחצית השנייה של
    המאה ה-19 מנה הכפר 46 משקי בית. ב-1934 נחנכה בטקס הדרך מדושתי, שסלילתה החלה ב-1930, והגיעה עד לכאן.
    זו הדרך שבה הגעתם.


    החפץ היקר ביותר של בריסאחו שמור בטביליסי. המוזיאון הלאומי של גאורגיה מחזיק כלי פולחני למים מן הכפר,
    ועליו דמות של אריה, שנוצר בין המאה ה-12 למאה ה-14 והוקדש לחמאלה, המלאך השומר של המקדש. כתובת מאוחרת
    יותר, מהמאה ה-17 או ה-18, מתעדת שאדם בשם סאע'ירה הקדיש אותו לחמאלה ולמלאך הראשי למען בנו. וכאן המילים
    נקטעות.


    היום בריסאחו היא קודם כול מחנה בסיס. מעבר לה הדרך מטפסת דרך מעבר דטוויסג'ווארי אל שאטילי, או פונה
    לעבר רושקה ואגמי אבודלאורי, ומשם רק רכב 4x4 יעבור. בבריסאחו אתם עוד קובעים את הקצב; מעבר לה — ההרים.
  tip: >-
    אין דמי כניסה: זה כפר חי, לא אתר תיירות. תכננו אותו כתחנת הלינה שלכם והזמינו בית הארחה מראש ביולי
    ובאוגוסט, כשנהגים בדרכם לשאטילי ממלאים את המיטות; הביאו מזומן, כי מקומות קטנים כמעט אינם מקבלים כרטיסי
    אשראי. העונה נמשכת בערך ממאי עד אוקטובר; מחוצה לה בוץ ושלג עלולים לחסום את הגישה. מיניבוס ציבורי מדידובה
    יוצא בעונה רק בימי רביעי ושבת, כך שרכב נותן לכם חופש. המקדשים של חבסורתי הם עדיין מקומות קדושים פעילים:
    התבוננו בכל מתחם אבן מבחוץ ואל תיכנסו פנימה.
  route: >-
    מטביליסי סעו צפונה בכביש S3 (דרך הצבא הגאורגית), על פני מצחתה, עד ז'ינוואלי — כשעה. ליד המאגר פנו
    לכביש Sh26 לכיוון בריסאחו ושאטילי, והמשיכו במעלה האראגווי. הקטע הראשון סלול; הגישה לכפר היא דרך חצץ,
    מאובקת בקיץ וחלקלקה אחרי גשם. הקדישו כ-2 שעות ו-30 דקות ל-108 הק״מ. מלאו את המכל על ה-S3 לפני הפנייה
    ואל תסמכו על דלק בהמשך העלייה. רכב פנאי-שטח הוא הבחירה הנבונה: נהג זהיר יסתדר ברכב קטן במזג אוויר
    יבש, אבל מרווח גחון גבוה עוזר, ומעבר לבריסאחו תזדקקו לרכב 4x4 של ממש.
ar:
  name: باريساخو
  short: >-
    بوابة خيفسوريتي على نهر أراغفي: بيوت ضيافة ووجبة ساخنة وذاكرة طويلة، قبل أن يتحوّل الطريق إلى مسلك
    لسيارات الدفع الرباعي.
  body: >-
    **الطريق الوحيد إلى خيفسوريتي يمرّ بباريساخو، وعند كثير من المسافرين ينتهي يوم القيادة هنا: وجبة ساخنة
    وسرير، ونهر أراغفي يهدر طوال الليل تحت النافذة.**


    تقع القرية على الضفة اليمنى لنهر أراغفي الخيفسوري، على المنحدر الشرقي لسلسلة غوداماكاري. وهي مركز
    مجتمع خيفسوريتي المحلي، عقدة إدارية تربط أكثر من ثلاثين قرية، منها كورشا وروشكا وغوداني وأخييلي. وفي
    تعداد عام 2014 كان يسكنها 153 شخصًا.


    مكان هادئ بماضٍ قاسٍ. ففي عام 1813، قرب باريساخو، قاتل الخيفسوريون الثائرون جيشًا روسيًا وهُزموا.
    وفي النصف الثاني من القرن التاسع عشر كانت القرية تضم 46 أسرة. وفي عام 1934 افتُتح هنا في احتفال رسمي
    الطريقُ القادم من دوشيتي، الذي بدأ شقّه عام 1930. إنه الطريق الذي جئتم منه.


    أثمن ما تملكه باريساخو محفوظ في تبليسي. إذ يقتني المتحف الوطني الجورجي إناءً طقسيًا للماء من القرية
    يحمل صورة أسد، صُنع بين القرنين الثاني عشر والرابع عشر ونُذر لخمالا، ملاك المزار الحارس. وتذكر نقيشة
    لاحقة، من القرن السابع عشر أو الثامن عشر، أن رجلًا يُدعى ساغيرا قدّمه لخمالا ولرئيس الملائكة من أجل
    ابنه. ثم تنقطع الكلمات.


    واليوم باريساخو قبل كل شيء معسكر قاعدة. بعدها يصعد الطريق عبر ممر داتفيسجفاري نحو شاتيلي، أو ينعطف
    نحو روشكا وبحيرات أبوديلاوري، ومن هناك لا يصلح إلا الدفع الرباعي. في باريساخو ما زلتم أنتم من يحدد
    الإيقاع؛ وبعدها تحدده الجبال.
  tip: >-
    لا رسوم دخول: هذه قرية حيّة لا موقع سياحي. اجعلوها محطة مبيتكم واحجزوا بيت ضيافة مسبقًا في يوليو وأغسطس،
    حين يملأ الأسرّةَ السائقون المتجهون إلى شاتيلي؛ واحملوا نقدًا، فالأماكن الصغيرة نادرًا ما تقبل البطاقات.
    يمتد الموسم تقريبًا من مايو إلى أكتوبر، وخارجه قد يقطع الوحل والثلج الطريق. الحافلة الصغيرة العامة
    من ديدوبي لا تسير في الموسم إلا يومي الأربعاء والسبت، لذا تمنحكم السيارة حريتكم. ومزارات خيفسوريتي
    لا تزال أماكن مقدسة يُتعبَّد فيها: تأمّلوا أي سياج حجري من الخارج ولا تدخلوه.
  route: >-
    من تبليسي خذوا طريق S3 (الطريق العسكري الجورجي) شمالًا مرورًا بمتسخيتا حتى جينفالي، نحو ساعة. عند
    الخزان انعطفوا إلى طريق Sh26 باتجاه باريساخو وشاتيلي واتبعوا نهر أراغفي صعودًا. المقطع الأول معبّد،
    أما الاقتراب من القرية فحصوي، مغبرّ صيفًا وزلق بعد المطر. خصصوا نحو ساعتين و30 دقيقة لمسافة 108 كم.
    املؤوا الخزان على S3 قبل المنعطف ولا تعوّلوا على الوقود في الأعلى. السيارة الرياضية متعددة الأغراض
    هي الخيار المعقول: يستطيع السائق الحذر أن يتدبّر أمره بسيارة صغيرة في الطقس الجاف، لكن الخلوص الأرضي
    العالي يساعد، وبعد باريساخو ستحتاجون إلى سيارة دفع رباعي حقيقية.
