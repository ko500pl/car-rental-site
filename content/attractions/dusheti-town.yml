ka:
  name: დუშეთი
  short: >-
    არაგვის ერისთავთა ძველი რეზიდენცია, სადაც ერთ დროს გიორგი სააკაძემ შეაფარა თავი — დღეს ხინკლით ცნობილი
    გაჩერება და ბენზინგასამართი მთებისკენ მიმავალ გზაზე.
  body: >-
    **დუშეთი ისტორიაში შენდობის თხოვნით შემოდის: 1215 წელს აქ განდეგილად მცხოვრებმა გადამწერმა სახარება
    დაასრულა და მკითხველს შეცდომებისთვის შენდობა სთხოვა.**


    ეს მინაწერი, რომელსაც მოგვიანებით მარი ბროსემ სამეგრელოს ერთ-ერთი მონასტრის ხელნაწერში მიაკვლია, ქალაქის
    პირველი წერილობითი ხსენებაა, თუმცა აქ ნაპოვნი თამარისა და ლაშა-გიორგის მონეტები მოწმობს, რომ ხეობაში
    გაცილებით ადრეც ცხოვრობდნენ. XIV საუკუნის მიწურულს თემურ-ლენგის ლაშქარმა არაგვის ხეობის სოფლები გადაწვა.


    დუშეთის დიდი ხანა XVII საუკუნეში დადგა, როცა იგი არაგვის ერისთავების — მეფეებთან არაერთხელ დაპირისპირებული
    მთიელი მთავრების — რეზიდენცია იყო. 1612 წელს ლუარსაბ II-ის მიერ სასიკვდილოდ განწირული გიორგი სააკაძე
    მკვლელებს დაუსხლტა, ნოსტედან ცოლ-შვილი წამოიყვანა და თავშესაფარი აქ, სიმამრთან, ნუგზარ არაგვის ერისთავთან
    ჰპოვა. ერისთავთა კარზე მწიგნობრობაც ყვაოდა — ამ ტრადიციაზე აღიზარდნენ კვიპრიანე სამთავნელი და ოთარ
    ერისთავი. ურჩობას კი საფასური ჰქონდა: 1635 წელს მეფე როსტომმა დუშეთი გადაწვა, 1688 წელს კი გიორგი
    XI-მ კვლავ დაარბია.


    1743 წელს საერისთავო გაუქმდა, 1756 წელს კი ერეკლე II-მ დუშეთი ქალაქად გამოაცხადა და არაგვის ხეობა
    თავის ძეს, ვახტანგ-ალმასხანს, ჩააბარა. ბატონიშვილი დუშეთში დასახლდა, სომეხი ვაჭრები მოიწვია და ბაღები
    გააშენა. რუსული მმართველობისას, 1802 წელს, დუშეთი მაზრის ცენტრი გახდა, 1846 წელს კი აქ დაიბადა ალექსანდრე
    როინაშვილი, პირველი ქართველი პროფესიონალი ფოტოგრაფი.


    საერისთავო ქალაქიდან ცოტა რამ შემორჩა. სამაგიეროდ, მოძებნეთ IX–X საუკუნეების პატარა წმინდა გიორგის
    ეკლესია ფრესკების ფრაგმენტებით, XVII საუკუნის ყარანგოზიშვილების კოშკი ქალაქის განაპირას და ჭილაშვილების
    ციხე-დარბაზი (1798–1801). მერე კი ის გააკეთეთ, რითაც დუშეთია ცნობილი — ხინკალი შეუკვეთეთ.
  tip: >-
    დუშეთი ცოცხალი მუნიციპალური ქალაქია და არა მუზეუმი; აქ სეირნობა უფასოა. მხარეთმცოდნეობის მუზეუმი 1949
    წელს დაარსდა და დუშეთის მხარეში ნაპოვნ ნივთებს ადრებრინჯაოს ხანიდან გვიან შუა საუკუნეებამდე ინახავს;
    სამუშაო საათები სჯობს ადგილზე გადაამოწმოთ. ცენტრალური პარკი თავადაა კულტურული მემკვიდრეობის ძეგლი
    და ზაფხულში ჩრდილიან შესვენებას გთავაზობთ. ბენზინგასამართი სადგურები, ბანკები, აფთიაქები და სასტუმრო
    სახლები დუშეთს ბუნებრივ ბაზად აქცევს ხევსურეთის გზის ან გუდაურის აღმართის წინ. ხინკალი ადგილობრივთა
    სიამაყეა — ცალობით შეუკვეთეთ და ხელით მიირთვით. ერთი საათი საკმარისია.
  route: >-
    55 კმ, დაახლოებით ერთი საათი, მთელ გზაზე ასფალტია. თბილისიდან ს1 მაგისტრალით გადით და მცხეთასთან ჩრდილოეთით,
    ს3-ზე — საქართველოს სამხედრო გზაზე გადაუხვიეთ. ს3-ზე დაახლოებით 19 კილომეტრის გავლის შემდეგ შ65 გზაზე
    გადადით: ქალაქის ცენტრამდე მთავარი გზიდან 5 კილომეტრამდეა. ეკონომ-კლასის ნებისმიერი მანქანა ნებისმიერ
    სეზონზე გამოდგება. გზას თუ აგრძელებთ, ისევ ს3-ს დაუბრუნდით: ხევსურეთის გზა (შ26 — ბარისახო, შატილი)
    ოდნავ ჩრდილოეთით, ჟინვალთან იწყება, ანანურის ციხე კი დაახლოებით 15 კილომეტრითაა მოშორებული. თუ ხევსურეთში
    მიდიხართ, ავზი აქ ან ჟინვალში აავსეთ.
en:
  name: Dusheti
  short: >-
    Old seat of the dukes of Aragvi, where Giorgi Saakadze once hid from assassins: today a khinkali and
    fuel stop on the road to the mountains.
  body: >-
    **Dusheti enters history with an apology: in 1215 a scribe living here as a recluse finished copying
    a Gospel book and asked his readers to forgive his mistakes.**


    That note, later found by the scholar Marie Brosset in a manuscript at a monastery in Samegrelo, is
    the town's first written mention, although coins of Queen Tamar and Lasha-Giorgi dug up here show
    that people lived in the valley long before. At the end of the 14th century Timur's armies burned
    the villages of the Aragvi.


    Dusheti's great age came in the 17th century, when it was the residence of the eristavis, or dukes,
    of Aragvi, highland lords who more than once defied the crown. In 1612 Giorgi Saakadze, condemned
    to death by King Luarsab II, slipped his assassins, collected his wife and children from Noste and
    found shelter here with his father-in-law, Duke Nugzar. The ducal court also nurtured letters: Kvipriane
    Samtavneli and Otar Eristavi grew up in its tradition. Defiance had its price. King Rostom burned
    the town in 1635, and George XI ravaged it again in 1688.


    The duchy was abolished in 1743. In 1756 Erekle II declared Dusheti a town and entrusted the Aragvi
    valley to his son Vakhtang-Almaskhan, who settled here, invited Armenian traders and planted gardens.
    Under Russian rule it became a district centre in 1802, and in 1846 it gave Georgia Alexander Roinashvili,
    the country's first professional photographer.


    Little of the ducal town survives. Look instead for the small 9th–10th-century Church of St George
    with its fresco fragments, the 17th-century Karangozishvili tower on the edge of town, and the Chilashvili
    family's fortified hall of 1798–1801. Then do what Dusheti is known for, and order khinkali.
  tip: >-
    Dusheti is a working municipal town, not a museum piece, and wandering it costs nothing. The local
    history museum, founded in 1949, keeps finds from the district ranging from the Early Bronze Age to
    the late Middle Ages; check opening hours locally. The central park is itself a listed heritage site
    and a shady break in summer. Fuel stations, banks, pharmacies and guesthouses make this the natural
    base before the Khevsureti road or the climb to Gudauri. Khinkali are the local pride: order them
    by the piece and eat them by hand. An hour is enough.
  route: >-
    55 km, about an hour, paved all the way. Leave Tbilisi on the S1 and turn north at Mtskheta onto the
    S3, the Georgian Military Highway. After about 19 km on the S3, take the Sh65 into town; the centre
    is up to 5 km off the main road. Any economy car will do, in any season. Heading on? Rejoin the S3:
    the Khevsureti road (Sh26, for Barisakho and Shatili) leaves it a little further north at Zhinvali,
    and Ananuri Fortress is about 15 km away. If you are bound for Khevsureti, fill the tank here or at
    Zhinvali.
ru:
  name: Душети
  short: >-
    Старая резиденция арагвских эриставов, где Георгий Саакадзе когда-то прятался от убийц, а сегодня
    — остановка, известная хинкали, и заправка по дороге в горы.
  body: >-
    **Душети входит в историю с извинением: в 1215 году переписчик, живший здесь отшельником, закончил
    копировать Евангелие и попросил читателей простить ему ошибки.**


    Эту приписку, позднее найденную учёным Мари Броссе в рукописи из монастыря в Самегрело, считают первым
    письменным упоминанием города, хотя найденные здесь монеты царицы Тамары и Лаши-Георгия говорят о
    том, что люди жили в долине задолго до того. В конце XIV века войска Тимура сожгли сёла Арагви.


    Расцвет Душети пришёлся на XVII век, когда здесь была резиденция эриставов, то есть герцогов, Арагви
    — горских владетелей, не раз бросавших вызов престолу. В 1612 году Георгий Саакадзе, приговорённый
    к смерти царём Луарсабом II, ускользнул от убийц, забрал жену и детей из Носте и нашёл приют здесь,
    у тестя, эристава Нугзара. При дворе эриставов процветала и книжность: в его традиции выросли Киприан
    Самтавнели и Отар Эристави. За непокорность приходилось платить. Царь Ростом сжёг город в 1635 году,
    а Георгий XI вновь разорил его в 1688-м.


    Арагвское эриставство упразднили в 1743 году. В 1756-м Ираклий II объявил Душети городом и поручил
    долину Арагви своему сыну Вахтангу-Алмасхану; тот поселился здесь, пригласил армянских купцов и разбил
    сады. Под российской властью Душети в 1802 году стал уездным центром, а в 1846-м подарил Грузии Александра
    Роинашвили — первого в стране профессионального фотографа.


    От города эриставов сохранилось немного. Ищите лучше маленькую церковь Святого Георгия IX–X веков
    с фрагментами фресок, башню Карангозишвили XVII века на окраине и крепость-дарбази рода Чилашвили
    1798–1801 годов. А потом сделайте то, чем славится Душети, — закажите хинкали.
  tip: >-
    Душети — живой районный город, а не музейный экспонат, и прогулка по нему ничего не стоит. Краеведческий
    музей, основанный в 1949 году, хранит находки со всего района — от ранней бронзы до позднего Средневековья;
    часы работы уточняйте на месте. Центральный парк сам числится памятником наследия, а летом дарит тень.
    Заправки, банки, аптеки и гостевые дома делают город естественной базой перед дорогой в Хевсурети
    или подъёмом в Гудаури. Хинкали — местная гордость: заказывайте их поштучно и ешьте руками. Хватит
    и часа.
  route: >-
    55 км, около часа, асфальт на всём пути. Выезжайте из Тбилиси по S1 и у Мцхеты сверните на север на
    S3 — Военно-Грузинскую дорогу. Примерно через 19 км по S3 уходите на Sh65 в город; центр — в пределах
    5 км от трассы. Подойдёт любая машина эконом-класса в любое время года. Едете дальше? Возвращайтесь
    на S3: дорога в Хевсурети (Sh26, на Барисахо и Шатили) отходит от неё чуть севернее, в Жинвали, а
    до крепости Ананури около 15 км. Если держите путь в Хевсурети, заправьтесь здесь или в Жинвали.
fa:
  name: دوشتی
  short: >-
    مقرّ دیرین دوک‌های آراگوی، جایی که گیورگی ساآکادزه روزگاری از دست آدمکشان پنهان شد؛ امروز توقفگاهی
    نامدار به خینکالی و جایگاه سوخت، سر راه کوهستان.
  body: >-
    **دوشتی با یک پوزش پا به تاریخ می‌گذارد: در سال ۱۲۱۵ کاتبی که این‌جا گوشه‌نشین بود، رونویسی یک انجیل
    را به پایان رساند و از خوانندگانش خواست خطاهایش را ببخشند.**


    این یادداشت، که بعدها ماری بروسهٔ دانشمند در دست‌نوشته‌ای در صومعه‌ای در سامگرلو یافت، نخستین یاد
    مکتوب از شهر است، هرچند سکه‌هایی از ملکه تامار و لاشا-گیورگی که این‌جا از خاک بیرون آمده، نشان می‌دهد
    مردم مدت‌ها پیش از آن در این دره می‌زیستند. در پایان سدهٔ چهاردهم، سپاهیان تیمور روستاهای آراگوی را
    به آتش کشیدند.


    دوران شکوه دوشتی در سدهٔ هفدهم رسید، هنگامی که این شهر اقامتگاه اریستاوها، یعنی دوک‌های آراگوی، بود؛
    فرمانروایان کوهستانی که بیش از یک بار از فرمان تاج و تخت سر پیچیدند. در سال ۱۶۱۲ گیورگی ساآکادزه،
    که شاه لوارساب دوم به مرگ محکومش کرده بود، از چنگ آدمکشان گریخت، همسر و فرزندانش را از نوسته برداشت
    و این‌جا نزد پدرزنش، دوک نوگزار، پناه یافت. دربار دوک‌ها پرورشگاه ادب و کتاب نیز بود: کویپریانه سامتاونلی
    و اوتار اریستاوی در سنت آن بالیدند. اما سرکشی بهایی داشت. شاه رستم در سال ۱۶۳۵ شهر را سوزاند و گیورگی
    یازدهم در ۱۶۸۸ بار دیگر آن را ویران کرد.


    دوک‌نشین در سال ۱۷۴۳ برچیده شد. در ۱۷۵۶ ارکلهٔ دوم دوشتی را شهر اعلام کرد و درهٔ آراگوی را به پسرش
    واختانگ-الماس‌خان سپرد که در همین‌جا ساکن شد، بازرگانان ارمنی را فراخواند و باغ‌ها کاشت. در دوران
    فرمانروایی روسیه، دوشتی در ۱۸۰۲ مرکز شهرستان شد و در ۱۸۴۶ الکساندر روئیناشویلی، نخستین عکاس حرفه‌ای
    گرجستان، را به این کشور هدیه کرد.


    از شهرِ دوک‌ها چیز زیادی بر جا نمانده است. به جایش سراغ کلیسای کوچک گیورگی مقدس از سده‌های نهم و دهم
    با پاره‌هایی از نقاشی‌های دیواری، برج کارانگوزیشویلی از سدهٔ هفدهم در حاشیهٔ شهر و تالار مستحکم خاندان
    چیلاشویلی از سال‌های ۱۷۹۸ تا ۱۸۰۱ بروید. سپس همان کاری را بکنید که دوشتی به آن شهره است: خینکالی سفارش
    دهید.
  tip: >-
    دوشتی شهری زنده و پرکار است، نه ویترین موزه، و گشتن در آن هزینه‌ای ندارد. موزهٔ تاریخ محلی، که در
    ۱۹۴۹ بنیان نهاده شد، یافته‌هایی از سراسر این ناحیه، از عصر مفرغ آغازین تا اواخر سده‌های میانه، را
    نگه می‌دارد؛ ساعات بازدید را همان‌جا بپرسید. پارک مرکزی خود اثری ثبت‌شده در فهرست میراث است و در تابستان
    پناهی سایه‌دار. جایگاه‌های سوخت، بانک‌ها، داروخانه‌ها و مهمان‌خانه‌ها این شهر را پایگاه طبیعیِ پیش
    از جادهٔ خوسورتی یا صعود به گودائوری می‌کنند. خینکالی مایهٔ مباهات محلی است: آن را دانه‌ای سفارش دهید
    و با دست بخورید. یک ساعت کافی است.
  route: >-
    ۵۵ کیلومتر، حدود یک ساعت، سراسر آسفالت. از تفلیس با S1 بیرون بروید و در متسختا به سوی شمال وارد S3،
    جادهٔ نظامی گرجستان، شوید. پس از حدود ۱۹ کیلومتر در S3، از راه Sh65 وارد شهر شوید؛ مرکز شهر حداکثر
    ۵ کیلومتر از جادهٔ اصلی فاصله دارد. هر خودروی اقتصادی، در هر فصلی، کار را راه می‌اندازد. قصد ادامهٔ
    مسیر دارید؟ به S3 برگردید: جادهٔ خوسورتی (Sh26، به سوی باریساخو و شاتیلی) کمی شمالی‌تر، در ژینوالی،
    از آن جدا می‌شود و قلعهٔ آنانوری حدود ۱۵ کیلومتر دورتر است. اگر مقصدتان خوسورتی است، باک را همین‌جا
    یا در ژینوالی پر کنید.
he:
  name: דושטי
  short: >-
    מושבם הישן של דוכסי אראגווי, שבו הסתתר פעם גיורגי סאאקדזה מפני מתנקשים; היום – עצירה הידועה בחינקלי
    שלה, ותחנת דלק בדרך להרים.
  body: >-
    **דושטי נכנסת להיסטוריה בהתנצלות: בשנת 1215 מעתיק שחי כאן כנזיר מתבודד סיים להעתיק ספר בשורות וביקש
    מקוראיו לסלוח לו על טעויותיו.**


    את ההערה הזאת מצא מאוחר יותר המלומד מארי ברוסה בכתב יד במנזר בסמגרלו, והיא האזכור הכתוב הראשון של
    העיירה, אף שמטבעות של המלכה תמר ושל לשה-גיורגי שנחשפו כאן מעידים שאנשים חיו בעמק זמן רב קודם לכן.
    בסוף המאה ה-14 שרפו צבאותיו של טימור את כפרי האראגווי.


    תור הזהב של דושטי הגיע במאה ה-17, כשהייתה מקום מושבם של האריסטאווים, כלומר הדוכסים, של אראגווי — שליטי
    הרים שיותר מפעם אחת התריסו נגד הכתר. בשנת 1612 גיורגי סאאקדזה, שהמלך לוארסאב השני דן אותו למוות, חמק
    מרוצחיו, אסף את אשתו וילדיו מנוסטה ומצא כאן מחסה אצל חותנו, הדוכס נוגזר. חצר הדוכסים טיפחה גם ספרות:
    קוויפריאנה סמטאוונלי ואותר אריסטאווי צמחו במסורת שלה. למרדנות היה מחיר. המלך רוסטום שרף את העיירה
    ב-1635, וגיורגי ה-11 החריב אותה שוב ב-1688.


    הדוכסות בוטלה ב-1743. ב-1756 הכריז ארקלה השני על דושטי כעיר והפקיד את עמק האראגווי בידי בנו, וחטנג-אלמסחאן,
    שהשתקע כאן, הזמין סוחרים ארמנים ונטע גנים. תחת השלטון הרוסי הפכה דושטי ב-1802 למרכז מחוז, וב-1846
    העניקה לגאורגיה את אלכסנדר רואינאשווילי, הצלם המקצועי הראשון במדינה.


    מן העיירה הדוכסית נותר מעט. חפשו במקום זאת את כנסיית גאורגיוס הקדוש הקטנה מהמאות ה-9–10, עם שרידי
    ציורי קיר, את מגדל קרנגוזישווילי מהמאה ה-17 בשולי העיירה, ואת האולם המבוצר של משפחת צ'ילשווילי מהשנים
    1798–1801. ואז עשו את מה שדושטי ידועה בו, והזמינו חינקלי.
  tip: >-
    דושטי היא עיירה מוניציפלית חיה ופעילה, לא מוצג מוזיאוני, ושיטוט בה אינו עולה דבר. המוזיאון להיסטוריה
    מקומית, שנוסד ב-1949, שומר ממצאים מרחבי המחוז, מתקופת הברונזה הקדומה ועד שלהי ימי הביניים; את שעות
    הפתיחה בררו במקום. הפארק המרכזי הוא בעצמו אתר מורשת רשום, ובקיץ מפלט מוצל. תחנות דלק, בנקים, בתי מרקחת
    ובתי הארחה הופכים את העיירה לבסיס טבעי לפני הדרך לחבסורתי או העלייה לגודאורי. החינקלי הם גאוות המקום:
    הזמינו אותם לפי יחידה ואכלו בידיים. שעה מספיקה.
  route: >-
    55 ק״מ, כשעה, סלול לכל אורכו. צאו מטביליסי בכביש S1 ובמצחטה פנו צפונה אל S3, הדרך הצבאית הגאורגית.
    אחרי כ-19 ק״מ על S3 פנו לכביש Sh65 אל העיירה; המרכז נמצא עד 5 ק״מ מהכביש הראשי. כל רכב חסכוני יספיק,
    בכל עונה. ממשיכים הלאה? חזרו ל-S3: הדרך לחבסורתי (Sh26, לבריסאחו ולשאטילי) מתפצלת ממנו מעט צפונה יותר,
    בז'ינוואלי, ומבצר אנאנורי נמצא כ-15 ק״מ משם. אם אתם בדרך לחבסורתי, תדלקו כאן או בז'ינוואלי.
ar:
  name: دوشيتي
  short: >-
    مقرّ دوقات أراغفي القديم، حيث اختبأ غيورغي ساآكادزه يوماً من القتلة؛ واليوم محطة استراحة تشتهر بالخينكالي
    ومحطة وقود على طريق الجبال.
  body: >-
    **تدخل دوشيتي التاريخ باعتذار: ففي عام 1215 أنهى ناسخ كان يعيش هنا ناسكاً نسخَ كتاب الأناجيل، وطلب
    من قرّائه أن يغفروا له أخطاءه.**


    هذه الحاشية، التي عثر عليها لاحقاً الباحث ماري بروسيه في مخطوط بأحد أديرة ساميغريلو، هي أول ذكر مكتوب
    للبلدة، مع أن نقوداً للملكة تامار ولاشا-غيورغي استُخرجت من هنا تدلّ على أن الناس سكنوا الوادي قبل
    ذلك بزمن طويل. وفي أواخر القرن الرابع عشر أحرقت جيوش تيمور قرى أراغفي.


    جاء عصر دوشيتي الذهبي في القرن السابع عشر، حين كانت مقرّ الإريستافات، أي دوقات أراغفي، وهم سادة جبليون
    تحدّوا العرش أكثر من مرة. ففي عام 1612 أفلت غيورغي ساآكادزه، الذي حكم عليه الملك لوارساب الثاني بالموت،
    من قاتليه، وأخذ زوجته وأولاده من نوستي، ووجد ملجأً هنا عند حميه، الدوق نوغزار. كما رعى البلاط الدوقي
    الأدب والكتابة: فقد نشأ كفيبريانه سامتافنيلي وأوتار إريستافي في تقاليده. غير أن للتمرّد ثمنه؛ فقد
    أحرق الملك روستوم البلدة عام 1635، ثم عاد غيورغي الحادي عشر فدمّرها عام 1688.


    أُلغيت الدوقية عام 1743. وفي عام 1756 أعلن إريكلي الثاني دوشيتي مدينة، وعهد بوادي أراغفي إلى ابنه
    فاختانغ-ألماسخان، الذي استقر هنا ودعا التجار الأرمن وغرس البساتين. وفي ظل الحكم الروسي صارت دوشيتي
    عام 1802 مركز قضاء، وفي عام 1846 أهدت جورجيا ألكسندر روئيناشفيلي، أول مصور فوتوغرافي محترف في البلاد.


    لم يبقَ من بلدة الدوقات إلا القليل. ابحث بدلاً من ذلك عن كنيسة القديس جاورجيوس الصغيرة من القرنين
    التاسع والعاشر وفيها بقايا جداريات، وعن برج كارانغوزيشفيلي من القرن السابع عشر عند طرف البلدة، وعن
    القاعة المحصّنة لعائلة تشيلاشفيلي (1798–1801). ثم افعل ما تشتهر به دوشيتي: اطلب الخينكالي.
  tip: >-
    دوشيتي بلدة بلدية نابضة بالحياة، لا قطعة متحفية، والتجول فيها لا يكلّف شيئاً. يضمّ متحف التاريخ المحلي،
    الذي تأسس عام 1949، مكتشفات من أنحاء المنطقة تمتد من العصر البرونزي المبكر حتى أواخر العصور الوسطى؛
    تحقّق من مواعيد فتحه في المكان. الحديقة المركزية نفسها موقع تراثي مسجّل، وملاذ ظليل في الصيف. محطات
    الوقود والمصارف والصيدليات وبيوت الضيافة تجعل البلدة قاعدة طبيعية قبل طريق خيفسوريتي أو الصعود إلى
    غوداوري. الخينكالي فخر المكان: اطلبه بالقطعة وكُله باليد. تكفي ساعة واحدة.
  route: >-
    55 كم، نحو ساعة، على الإسفلت طوال الطريق. اخرج من تبليسي على الطريق S1، وعند متسخيتا انعطف شمالاً
    إلى S3، الطريق العسكري الجورجي. بعد نحو 19 كم على S3 خذ الطريق Sh65 إلى البلدة؛ يقع المركز على بعد
    لا يزيد على 5 كم من الطريق الرئيسي. تكفي أي سيارة اقتصادية في أي فصل. هل تواصل الرحلة؟ عُد إلى S3:
    فطريق خيفسوريتي (Sh26، نحو باريساخو وشاتيلي) يتفرّع منه أبعد قليلاً شمالاً عند جينفالي، وقلعة أنانوري
    على بعد نحو 15 كم. وإن كنت متجهاً إلى خيفسوريتي فاملأ الخزان هنا أو في جينفالي.
