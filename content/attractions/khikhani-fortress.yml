ka:
  name: ხიხანის ციხე
  short: >-
    ნანგრეული ციხე-ქალაქი ორ ათას მეტრზე მაღლა, სხალთის ხეობის სათავეში, სადაც 1815 წელს ურჩი ფაშა სელიმ
    ხიმშიაშვილი უკანასკნელად გამაგრდა.
  body: >-
    **ხიხანი ისე ააშენეს, რომ მასთან მისვლა ძნელი ყოფილიყო — და საუკუნეების შემდეგაც ასეა.** ციხე, ძველ
    წყაროებში ხირხათად მოხსენიებული, ხიხანის მთის კალთაზე, სხალთის ხეობის სათავეში, სოფელ ზედა თხილვანას
    თავზე დგას, ხულოს მუნიციპალიტეტში. შიგნით მხოლოდ ერთი საცალფეხო ბილიკი შედიოდა, სამხრეთ-აღმოსავლეთიდან,
    და დღესაც ასეა.


    ზუსტად როდის აიგო, არავინ იცის; მეცნიერთა უმეტესობა X–XIII საუკუნეებს ასახელებს. ძველი საბუთები მშენებლობის
    დასრულებაში დიდ წვლილს ტბელ აბუსერისძის მეუღლე ბაგულას მიაწერენ, ხალხური გადმოცემა კი, როგორც საქართველოში
    ხშირად ხდება, ციხეს თამარ მეფეს უკავშირებს. XI–XVI საუკუნეებში აქ აჭარის ერისთავთ-ერისთავთა, აბუსერისძეების,
    მთავარი რეზიდენცია იყო. შემდეგ ციხე ოსმალებმა დაიკავეს და წყობის ზედა ფენები, XVII–XIX საუკუნეებისა,
    უკვე მათი ხელისაა.


    ყველაზე ცნობილი მისი ბოლო თავია. 1815 წელს ახალციხის ურჩი ფაშა, სელიმ ხიმშიაშვილი, თხუთმეტათასიან
    ოსმალურ ლაშქარს გამოექცა და ხიხანში გამაგრდა. ორ თვეს უძლებდა ალყას. ციხე 31 მაისს დაეცა — ქართული
    წყაროების თანახმად, ღალატით — 3 ივნისს კი სელიმს თავი მოჰკვეთეს. აჭარა მას დღესაც გმირად იხსენებს.


    მწვერვალზე ერთი ციხე კი არა, რამდენიმე ჰექტარზე გაბნეული ქვის ქალაქი გხვდებათ. დასავლეთის კოშკი სამსართულიანია,
    კარი მიწიდან 2,85 მეტრის სიმაღლეზე აქვს და მასთან მხოლოდ კიბით ადიოდნენ; შესასვლელ კოშკთან მიწაში
    დღესაც ხუთი ქვევრია ჩაფლული — ციხის მარანი; ხუთნახევარი მეტრის სიღრმის ვიწრო ჭას კი არქეოლოგები დილეგად
    მიიჩნევენ.


    ცოტა ხანს დასავლეთის კედლის ძირას ჩამოჯექით. სელიმს ამ ხედისთვის ორი თვე ჰქონდა, თქვენ — მხოლოდ ერთი
    ნაშუადღევი.
  tip: >-
    მთელი დღე დაუთმეთ: ხეობის გზიდან ციხემდე და უკან დაახლოებით ექვსი საათი დაგჭირდებათ. ბოლო მონაკვეთი
    ფეხით გაივლება — ერთი-ორი საათი ციცაბო, მოუნიშნავ ბალახიან ფერდობზე, სამხრეთ-აღმოსავლეთიდან. ადგილობრივი
    გამყოლი ხულოში დაიქირავეთ ან ტრეკი წინასწარ ჩამოტვირთეთ. ზემოთ ზაფხულშიც ქარი და სიცივეა: ქურთუკი,
    ქუდი და მყარი ფეხსაცმელი წაიღეთ, წყალი და საჭმელიც — მაღლა არაფერია. ყველაზე საიმედო თვეები ივლისიდან
    სექტემბრამდეა; უფრო ადრე მისასვლელზე შეიძლება თოვლი დაგხვდეთ. ნისლში უკან დაბრუნდით. ნანგრევები შემოღობილი
    არ არის — კოშკებზე ნუ აძვრებით.
  route: >-
    თბილისიდან 480 კილომეტრი და დაახლოებით რვა საათია — ერთ დღეში ამას ვერ მოასწრებთ. ჯერ ბათუმამდე იარეთ
    (ს1, ს12, ს2 — ბოლომდე ასფალტი), იქიდან კი შ1 ბათუმი–ახალციხის გზით აჭარისწყლის ხეობას აუყევით, ქედისა
    და შუახევის გავლით. შუახევსა და ხულოს შორის სამხრეთით, სხალთის ხეობაში გადაუხვიეთ, სხალთის მონასტერს
    ჩაუარეთ და ზედა თხილვანისკენ აიარეთ. ასფალტი მალე მთავრდება: შემდეგ ვიწრო, ციცაბო, ადგილ-ადგილ წყლისგან
    გარეცხილი ხრეშიანი გზაა, ამიტომ მაღალი კლირენსის ოთხწამყვანიანი მანქანა აუცილებელია. საწვავი ბოლოს
    ქედაში ან ხულოში ჩაასხით. ზაფხულში ახალციხიდან გოდერძის უღელტეხილის გზა უფრო მოკლეა (დაახლოებით 300
    კმ) და ახლა უმეტესად მოასფალტებულია, მაგრამ ქირავნობის ბევრი ხელშეკრულება მასზე გადასვლას კრძალავს.
    ღამე ხულოში ან ბეშუმში გაათიეთ.
en:
  name: Khikhani Fortress
  short: >-
    A ruined stronghold above 2,000 metres at the head of the Skhalta valley, where the rebel pasha Selim
    Khimshiashvili made his last stand in 1815.
  body: >-
    **Khikhani was built to be hard to reach, and centuries later it still is.** The fortress — Khirkhati
    in older sources — clings to a shoulder of Mount Khikhani at the head of the Skhalta valley, above
    the village of Zeda Tkhilvana in Khulo municipality. A single footpath from the south-east was the
    only way in, and it still is.


    No one knows exactly when it was built; most scholars say between the 10th and 13th centuries. Old
    documents credit Bagula, wife of Tbeli Abuserisdze, with a large part in finishing it, while folk
    memory, as so often in Georgia, hands the whole thing to Queen Tamar. From the 11th to the 16th century
    this was the main seat of the Abuserisdze, the eristavis of Adjara. Then the Ottomans took it, and
    the upper layers of masonry, from the 17th to the 19th century, are theirs.


    Its last chapter is its most famous. In 1815 Selim Khimshiashvili, the rebel pasha of Akhaltsikhe,
    fled an Ottoman army of 15,000 and shut himself up here. He held out for two months. Khikhani fell
    on 31 May — through betrayal, Georgian sources say — and on 3 June Selim was beheaded. Adjara remembers
    him as a hero.


    What waits at the top is less a castle than a scattered stone town, spread over several hectares.
    The west tower rises three storeys, its door set 2.85 metres above the ground and reachable only by
    ladder; before the entrance tower five qvevri, the fortress's wine cellar, are still sunk in the earth;
    and a narrow shaft five and a half metres deep is read by archaeologists as a dungeon.


    Sit for a while beneath the west wall. Selim had two months to look at this view; you have an afternoon.
  tip: >-
    Give it the whole day: from the valley road to the walls and back takes around six hours. The last
    stretch is on foot — one to two hours up a steep, unmarked grassy slope from the south-east. Hire
    a local guide in Khulo or download a track in advance. It is windy and cold at the top even in summer;
    bring a jacket, hat, proper boots and all your water and food — there is nothing up there. July to
    September is the safest window, as snow can linger on the approach earlier. In fog, turn back. The
    ruins are unfenced — do not climb the towers.
  route: >-
    Allow about eight hours for the 480 km from Tbilisi; this is not a day trip. Drive to Batumi on the
    S1, S12 and S2 (asphalt throughout), then turn inland on the Sh1 Batumi–Akhaltsikhe road up the Adjaristsqali
    valley through Keda and Shuakhevi. Between Shuakhevi and Khulo turn south into the Skhalta valley,
    pass Skhalta Monastery and climb towards Zeda Tkhilvana. The asphalt soon gives out: what follows
    is narrow gravel, steep and washed out in places, so an offroad-class 4x4 with real clearance is mandatory.
    The last reliable fuel is in Keda or Khulo. In summer the Goderdzi Pass road from Akhaltsikhe is shorter
    (about 300 km) and now mostly sealed, but many rental contracts forbid it. Sleep in Khulo or Beshumi.
ru:
  name: Крепость Хихани
  short: >-
    Разрушенная твердыня выше 2000 метров в верховьях долины Схалта, где мятежный паша Селим Химшиашвили
    дал свой последний бой в 1815 году.
  body: >-
    **Хихани строилась так, чтобы до неё было трудно добраться, и спустя века это всё ещё так.** Крепость
    — в старых источниках Хирхати — цепляется за плечо горы Хихани в верховьях долины Схалта, над селом
    Зеда Тхилвана в муниципалитете Хуло. Внутрь вела лишь одна тропа, с юго-востока, — так и сейчас.


    Никто точно не знает, когда её построили; большинство учёных называют период с X по XIII век. Старые
    документы отдают значительную долю в её завершении Багуле, жене Тбели Абусеридзе, а народная память,
    как это часто бывает в Грузии, приписывает всё целиком царице Тамар. С XI по XVI век это была главная
    резиденция Абусеридзе, эриставов Аджарии. Затем крепость взяли османы, и верхние слои каменной кладки,
    с XVII по XIX век, — их работа.


    Её последняя глава — самая знаменитая. В 1815 году Селим Химшиашвили, мятежный паша Ахалцихе, бежал
    от османской армии в 15 000 человек и заперся здесь. Он держался два месяца. Хихани пала 31 мая —
    по грузинским источникам, из-за предательства, — а 3 июня Селиму отрубили голову. В Аджарии его помнят
    как героя.


    Наверху ждёт скорее не замок, а рассыпанный по нескольким гектарам каменный городок. Западная башня
    поднимается на три этажа, и в её дверь, на высоте 2,85 метра над землёй, можно было попасть только
    по лестнице; перед входной башней до сих пор вкопаны в землю пять квеври — винный погреб крепости;
    а узкую шахту глубиной пять с половиной метров археологи считают тюремной ямой.


    Посидите немного у подножия западной стены. У Селима было два месяца, чтобы смотреть на этот вид;
    у вас — лишь полдня.
  tip: >-
    Отведите на это весь день: от дороги в долине до стен и обратно уходит около шести часов. Последний
    отрезок — пешком: один-два часа подъёма по крутому неразмеченному травяному склону с юго-востока.
    Наймите местного проводника в Хуло или заранее скачайте трек. Наверху ветрено и холодно даже летом
    — возьмите куртку, шапку, крепкие ботинки и всю воду и еду, какая может понадобиться: там ничего нет.
    Июль–сентябрь — самое безопасное время, раньше на подъёме может держаться снег. В тумане — разворачивайтесь.
    Руины не огорожены — не забирайтесь на башни.
  route: >-
    На 480 км от Тбилиси закладывайте около восьми часов — это не поездка на день. Доезжайте до Батуми
    по S1, S12 и S2 (асфальт на всём протяжении), затем сверните в глубь страны на дорогу Ш1 Батуми–Ахалцихе
    вдоль Аджарисцкали через Кеду и Шуахеви. Между Шуахеви и Хуло сверните на юг, в долину Схалта, минуйте
    Схалтский монастырь и поднимайтесь к Зеда Тхилвана. Скоро асфальт кончается: далее — узкий гравий,
    крутой и местами размытый, поэтому нужен настоящий внедорожник с хорошим клиренсом. Последняя надёжная
    заправка — в Кеде или Хуло. Летом дорога через Годердзский перевал от Ахалцихе короче (около 300 км)
    и теперь в основном заасфальтирована, но многие договоры аренды запрещают по ней ездить. Ночевать
    — в Хуло или Бешуми.
fa:
  name: قلعهٔ خیخانی
  short: >-
    دژی ویران بالاتر از ۲۰۰۰ متر در سرچشمهٔ درهٔ سخالتا، جایی که سلیم خیمشیاشویلی، پاشای شورشی، در سال
    ۱۸۱۵ آخرین ایستادگی خود را کرد.
  body: >-
    **خیخانی چنان ساخته شده بود که دسترسی به آن دشوار باشد، و سده‌ها بعد هنوز چنین است.** این قلعه — که
    در منابع کهن‌تر خیرخاتی نامیده می‌شود — بر شانهٔ کوه خیخانی در سرچشمهٔ درهٔ سخالتا، بالای روستای زدا
    تخیلوانا در شهرستان خولو، چنگ زده است. تنها راه ورود، کوره‌راهی پیاده از جنوب‌شرق بود — و هنوز هم
    هست.


    هیچ‌کس دقیقاً نمی‌داند چه زمانی ساخته شده؛ بیشتر پژوهشگران آن را میان سده‌های دهم و سیزدهم می‌دانند.
    اسناد کهن بخش بزرگی از تکمیل آن را به باگولا، همسر تبلی آبوسریدزه، نسبت می‌دهند، در حالی که حافظهٔ
    عامیانه، آن‌گونه که در گرجستان بسیار رخ می‌دهد، همه‌چیز را به ملکه تامار می‌سپارد. از سدهٔ یازدهم
    تا شانزدهم، این‌جا مقر اصلی آبوسریدزه‌ها، اریستاوهای آجارا، بود. سپس عثمانی‌ها آن را گرفتند، و لایه‌های
    بالایی سنگ‌کاری، از سدهٔ هفدهم تا نوزدهم، از آن‌هاست.


    آخرین فصلش مشهورترین است. در سال ۱۸۱۵ سلیم خیمشیاشویلی، پاشای شورشی آخالتسیخه، از سپاه پانزده‌هزار
    نفری عثمانی گریخت و در این‌جا سنگر گرفت. او دو ماه ایستادگی کرد. خیخانی در ۳۱ مه سقوط کرد — به گفتهٔ
    منابع گرجی، از راه خیانت — و در ۳ ژوئن سر سلیم از تن جدا شد. آجارا او را قهرمانی به یاد می‌آورد.


    آنچه در بالا انتظار می‌کشد، بیش از یک قلعه، شهرکی سنگی و پراکنده بر چند هکتار است. برج غربی سه طبقه
    دارد و درش در ارتفاع ۲٫۸۵ متری از زمین است و تنها با نردبان می‌شد به آن رسید؛ جلوی برج ورودی هنوز
    پنج خمرهٔ «کوِوری» در خاک فرو رفته‌اند که انبار شراب قلعه بوده‌اند؛ و چاهی باریک به عمق پنج‌ونیم متر
    را باستان‌شناسان سیاه‌چال می‌دانند.


    قدری پای دیوار غربی بنشینید. سلیم دو ماه فرصت داشت این چشم‌انداز را ببیند؛ شما یک بعدازظهر دارید.
  tip: >-
    تمام روز را برای آن در نظر بگیرید: از راه درّه تا دیوارها و بازگشت نزدیک شش ساعت طول می‌کشد. بخش پایانی
    پیاده است — یک تا دو ساعت بالارفتن از شیبی چمنی، تند و بی‌نشانه، از جنوب‌شرق. راهنمایی محلی در خولو
    بگیرید یا از پیش مسیر را دانلود کنید. حتی در تابستان بالای قلعه بادخیز و سرد است؛ کاپشن، کلاه، کفشی
    مناسب و همهٔ آب و غذایتان را همراه ببرید — آن بالا هیچ چیز نیست. ژوئیه تا سپتامبر امن‌ترین بازهٔ زمانی
    است، چون پیش از آن ممکن است برف روی مسیر مانده باشد. در مه، بازگردید. ویرانه‌ها محصور نیستند — از
    برج‌ها بالا نروید.
  route: >-
    برای ۴۸۰ کیلومتر از تفلیس نزدیک هشت ساعت در نظر بگیرید؛ این سفری یک‌روزه نیست. تا باتومی از راه S1،
    S12 و S2 (همه آسفالت) برانید، سپس به‌سوی داخل کشور در جادهٔ باتومی–آخالتسیخه در امتداد آجاریستسکالی
    از کدا و شوآخوی بگذرید. میان شوآخوی و خولو، رو به جنوب به درهٔ سخالتا بپیچید، از کنار صومعهٔ سخالتا
    بگذرید و به‌سوی زدا تخیلوانا بالا بروید. آسفالت زود پایان می‌یابد: از آن پس، راهی باریک و شنی، تند
    و جاهایی شسته‌شده است، پس خودرویی واقعاً آفرود و چهارچرخ‌محرک با فاصلهٔ کافی از زمین ضروری است. آخرین
    پمپ‌بنزین مطمئن در کدا یا خولو است. در تابستان، راه گذرگاه گودردزی از آخالتسیخه کوتاه‌تر است (حدود
    ۳۰۰ کیلومتر) و اکنون بیشترش آسفالت است، اما بسیاری از قراردادهای اجاره عبور از آن را ممنوع می‌کنند.
    شب را در خولو یا بشومی بمانید.
he:
  name: מבצר חיחני
  short: מצודה חרבה מעל 2,000 מטרים בראש עמק סחלטה, שבה עשה הפאשה המורד סלים חימשיאשווילי את עמידתו האחרונה
    ב-1815.
  body: >-
    **חיחני נבנתה כך שיהיה קשה להגיע אליה, ומאות שנים אחר כך זה עדיין המצב.** המצודה — חירחתי במקורות
    ישנים יותר — נצמדת לזרוע של הר חיחני בראש עמק סחלטה, מעל הכפר זדה תחילוואנה במחוז חולו. שביל בודד
    מדרום-מזרח היה הדרך היחידה להיכנס, וכך גם כיום.


    איש אינו יודע במדויק מתי היא נבנתה; רוב החוקרים אומרים בין המאה ה-10 למאה ה-13. מסמכים ישנים מייחסים
    לבאגולה, אשתו של טבלי אבוסרידזה, חלק גדול מהשלמתה, בעוד הזיכרון העממי, כפי שקורה כה רבות בגאורגיה,
    מעביר את הכול למלכה תמר. מהמאה ה-11 עד ה-16 היה זה מקום המושב הראשי של האבוסרידזה, האריסטאבים של אג'אריה.
    אחר כך תפסו אותה העות'מאנים, והשכבות העליונות של הבנייה באבן, מהמאה ה-17 עד ה-19, הן שלהם.


    הפרק האחרון שלה הוא המפורסם ביותר. ב-1815 נמלט סלים חימשיאשווילי, הפאשה המורד של אחלציחה, מצבא עות'מאני
    של 15,000 חיילים והסתגר כאן. הוא החזיק מעמד חודשיים. חיחני נפלה ב-31 במאי — בבגידה, לפי מקורות גאורגיים
    — וב-3 ביוני נערף ראשו של סלים. אג'אריה זוכרת אותו כגיבור.


    מה שמצפה בפסגה הוא פחות מצודה ויותר עיירת אבן מפוזרת, המשתרעת על פני כמה הקטרים. המגדל המערבי מתנשא
    לגובה שלוש קומות, ודלתו, 2.85 מטרים מעל הקרקע, הייתה נגישה רק בסולם; לפני מגדל הכניסה עדיין טמונים
    בקרקע חמישה כדי קווברי — מרתף היין של המצודה; ואת הפיר הצר, בעומק חמישה וחצי מטרים, מפרשים הארכיאולוגים
    כבור כלא.


    שבו קצת למרגלות החומה המערבית. לסלים היו חודשיים להתבונן בנוף הזה; לכם יש אחר צהריים אחד.
  tip: >-
    הקדישו לזה יום שלם: מכביש העמק אל החומות ובחזרה נמשך בערך שש שעות. הקטע האחרון הוא ברגל — שעה עד שעתיים
    במעלה מדרון עשבי תלול ולא מסומן מדרום-מזרח. שכרו מדריך מקומי בחולו או הורידו מסלול מראש. גם בקיץ יש
    רוח וקור בפסגה; הביאו מעיל, כובע, נעליים מתאימות ואת כל המים והאוכל שתצטרכו — אין שם כלום. יולי עד
    ספטמבר הם החלון הבטוח ביותר, שכן קודם לכן עלול להישאר שלג בדרך הגישה. בערפל, פנו לאחור. ההריסות לא
    גדורות — אל תטפסו על המגדלים.
  route: >-
    הקצו כשמונה שעות ל-480 הק"מ מטביליסי; זה לא טיול יום. סעו לבטומי ב-S1, S12 ו-S2 (אספלט לכל אורך הדרך),
    ואז פנו פנימה בכביש בטומי–אחלציחה במעלה עמק אג'אריסצקאלי דרך קדה ושואחווי. בין שואחווי לחולו פנו דרומה
    לעמק סחלטה, עברו את מנזר סחלטה וטפסו לכיוון זדה תחילוואנה. האספלט נגמר מהר: מה שממשיך הוא חצץ צר,
    תלול ושטוף במקומות, כך שרכב שטח 4×4 עם מרווח גחון אמיתי הוא חובה. הדלק האחרון המובטח נמצא בקדה או
    בחולו. בקיץ הדרך דרך מעבר גודרדזי מאחלציחה קצרה יותר (כ-300 ק"מ) וכיום סלולה ברובה, אך חוזי השכרה
    רבים אוסרים עליה. לינה: בחולו או בבשומי.
ar:
  name: قلعة خيخاني
  short: >-
    معقل مهدّم على ارتفاع يزيد على 2000 متر عند رأس وادي سخالتا، حيث خاض الباشا المتمرد سليم خيمشياشفيلي
    معركته الأخيرة عام 1815.
  body: >-
    **بُنيت خيخاني كي يصعب الوصول إليها، وحتى بعد قرون لا تزال كذلك.** تتعلّق القلعة — خيرخاتي في المصادر
    الأقدم — بكتف جبل خيخاني عند رأس وادي سخالتا، فوق قرية زيدا تخيلفانا في بلدية خولو. كان مسار واحد
    للمشي من الجنوب الشرقي الطريق الوحيد إليها، ولا يزال.


    لا يعرف أحد على وجه الدقة متى بُنيت؛ يرجّح معظم الباحثين أن ذلك كان بين القرنين العاشر والثالث عشر.
    تنسب الوثائق القديمة إلى باغولا، زوجة تبيلي أبوسريدزه، دورًا كبيرًا في إتمامها، بينما تُسند الذاكرة
    الشعبية، كما يحدث كثيرًا في جورجيا، كل الأمر إلى الملكة تامار. من القرن الحادي عشر إلى السادس عشر
    كانت هذه القلعة المقرَّ الرئيسي لأسرة أبوسريدزه، أمراء أدجاريا (إريستافي). ثم استولى عليها العثمانيون،
    والطبقات العلوية من البناء الحجري، من القرن السابع عشر إلى التاسع عشر، من صنعهم.


    فصلها الأخير هو الأشهر. في عام 1815 هرب سليم خيمشياشفيلي، باشا أخالتسيخه المتمرد، من جيش عثماني قوامه
    15 ألف جندي، وتحصّن هنا. صمد شهرين. سقطت خيخاني في 31 مايو — بالخيانة، بحسب المصادر الجورجية — وفي
    3 يونيو قُطع رأس سليم. تتذكره أدجاريا بطلًا.


    ما ينتظر في القمة أقرب إلى بلدة حجرية متناثرة على عدة هكتارات منه إلى قلعة واحدة. يرتفع البرج الغربي
    ثلاثة طوابق، وبابه على ارتفاع 2.85 متر عن الأرض لا يُبلغ إلا بسلّم؛ وأمام برج المدخل لا تزال خمس جرار
    «كفيفري» مدفونة في الأرض، هي قبو نبيذ القلعة؛ أما البئر الضيقة التي يبلغ عمقها خمسة أمتار ونصفًا فيرى
    فيها علماء الآثار زنزانة.


    اجلس قليلًا عند أسفل السور الغربي. كان لسليم شهران ليتأمل هذا المشهد؛ ولك بعد ظهر واحد.
  tip: >-
    خصّص اليوم كله: تستغرق الرحلة من طريق الوادي إلى الأسوار والعودة نحو ست ساعات. المرحلة الأخيرة تُقطع
    مشيًا — ساعة إلى ساعتين صعودًا في منحدر عشبي حاد وغير موسوم من الجنوب الشرقي. استأجر مرشدًا محليًا
    في خولو أو نزّل مسارًا مسبقًا. الجو عاصف وبارد في القمة حتى في الصيف، فاحمل سترة وقبعة وحذاءً مناسبًا
    وكل ما تحتاجه من ماء وطعام — لا يوجد شيء هناك. يوليو إلى سبتمبر هو الوقت الأكثر أمانًا، إذ قد يبقى
    الثلج على الطريق قبل ذلك. في الضباب، عُد من حيث أتيت. الآثار غير مسوّرة — لا تتسلّق الأبراج.
  route: >-
    خصّص نحو ثماني ساعات لمسافة 480 كم من تبليسي؛ فهذه ليست رحلة يوم واحد. قُد إلى باتومي عبر S1 و S12
    و S2 (معبّدة بالكامل)، ثم انحرف إلى الداخل على طريق باتومي–أخالتسيخه صعودًا في وادي أدجاريستسكالي
    عبر كِدا وشوآخيفي. بين شوآخيفي وخولو، انحرف جنوبًا إلى وادي سخالتا، مرورًا بدير سخالتا وصعودًا نحو
    زيدا تخيلفانا. ينتهي الإسفلت قريبًا: وما يليه طريق حصوي ضيق، حاد ومنجرف في مواضع، فسيارة رباعية الدفع
    حقيقية بخلوص أرضي كافٍ أمر لا بد منه. آخر محطة وقود موثوقة في كِدا أو خولو. في الصيف يكون طريق ممر
    غودردزي من أخالتسيخه أقصر (نحو 300 كم) وقد صار معبّدًا في معظمه، لكن كثيرًا من عقود التأجير تحظر عبوره.
    اقضِ الليل في خولو أو بشومي.
