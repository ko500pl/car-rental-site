ka:
  name: ხიხანის ციხე
  short: საქართველოს ერთ-ერთი ყველაზე მაღალი შუასაუკუნეების ციხე, ორ ათას მეტრზე მაღლა, ხულოს ზემოთ.
  body: >-
    **ხიხანი საქართველოს ყველაზე მაღლა მდებარე ციხეთაგანია** — ორ ათას მეტრზე მაღლა, კლდოვან ქიმზე, ხულოს
    მუნიციპალიტეტში. ის აჭარისწყლის ხეობის სამხრეთით, ქედის მიღმა დგას და ქვემოდან საერთოდ არ ჩანს; მისვლა
    უნდა გინდოდეს.

    ციხე შუა საუკუნეებით თარიღდება — ძირითადად X-XIII საუკუნეებით — და ერთი მკაფიო ფუნქცია ჰქონდა: აკონტროლებდა
    გადასასვლელს ზემო აჭარიდან სამხრეთით, შავშეთისა და ტაო-კლარჯეთის მიმართულებით. ეს იყო შუა საუკუნეების
    ქართული სამეფოს სასაზღვრო ხაზი და ხიხანი მისი ერთ-ერთი კვანძი.

    დღეს რაც შემორჩა:

    - **გარე გალავნის ფრაგმენტები**, კლდის კონტურს მიყოლებული — კედელი ბუნებრივ სიმაგრეს ავსებს, არ იმეორებს

    - **წყალსაცავის ნაშთი**, კლდეში ამოკვეთილი, ალყისთვის აუცილებელი

    - **კოშკის საძირკველი** უმაღლეს წერტილში

    ეს ნანგრევია და არა აღდგენილი ძეგლი. ვინც ანანურის ტიპის კედლებს ელოდება, იმედგაცრუებული დარჩება.
    სამაგიეროდ, ხედი აქედან აჭარის საუკეთესოა: ქედი ქედის მიღმა სამხრეთით, თურქეთის მთებამდე, და ჩრდილოეთით
    — გოდერძის მასივი.

    ასვლა ხულოდან ან სხალთის ხეობიდან ხდება, ბოლო მონაკვეთი ფეხით. ეს არაა შუადღის გასეირნება: ჯამში ოთხიდან
    ექვს საათამდე ჰგონია, ამინდი მაღლა სწრაფად იცვლება და ივნისამდე თოვლი დევს.
  tip: >-
    მთელი დღე დაუთმე. ბოლო აღმართი ფეხითაა — ერთი-ორი საათი, ბილიკი ბალახიანი და ციცაბო, მარკირების გარეშე;
    ადგილობრივი გამყოლი ან კარგი ტრეკი ტელეფონში აუცილებელია. მაღლა ქარია და ტემპერატურა ზაფხულშიც დაბალი
    — ქურთუკი და ქუდი. წყალი და საკვები თან წაიღე, ზემოთ არაფერია. ნისლში ასვლა არ ღირს: ორიენტირები იკარგება.
  route: >-
    ბათუმიდან აჭარისწყლის ხეობით ხულომდე, შემდეგ სამხრეთით მთის გზით ხიხაძირის მიმართულებით — თბილისიდან
    ჯამში 480 კმ, რვა საათამდე. ხეობის გზა ხულომდე ასფალტია, ზემოთ კი ხრეშიანი, ვიწრო და მაღალმთიანი,
    ადგილ-ადგილ გარეცხილი. ჯიპი ან ოთხბორბლიანი წევა სავალდებულოა, ჩვეულებრივი მანქანა არ ავა. საწვავი
    ბოლოს ხულოშია. ღამე ხულოში ან ბეშუმში გაათიე — ერთ დღეში თბილისიდან შეუძლებელია.
en:
  name: Khikhani Fortress
  short: One of the highest medieval fortresses in Georgia, above two thousand metres on a ridge beyond
    Khulo.
  body: >-
    **Khikhani is among the highest fortresses in Georgia,** standing above two thousand metres on a rocky
    crest in Khulo municipality. It lies south of the Adjaristsqali valley, beyond the ridge, and is invisible
    from below: you have to want to go.

    The fortress is medieval, mostly attributed to the 10th to 13th centuries, and had one clear purpose.
    It controlled the crossing from upper Adjara southwards towards Shavsheti and the old lands of Tao-Klarjeti.
    This was a frontier line of the medieval Georgian kingdom, and Khikhani was one of its knots.

    What survives:

    - **Fragments of the outer wall**, following the contour of the rock — the masonry completes the natural
    defence rather than repeating it

    - **The remains of a cistern** cut into the rock, essential for withstanding a siege

    - **The footing of a tower** at the highest point

    This is a ruin, not a restored monument. Anyone expecting Ananuri-style walls will be disappointed.
    What you get instead is the best view in Adjara: ridge behind ridge to the south as far as the Turkish
    mountains, and the Goderdzi massif to the north.

    The approach starts from Khulo or from the Skhalta valley, with the final stretch on foot. This is
    not an afternoon stroll — four to six hours in total, weather changes fast at that height, and snow
    lies on the approach into June.
  tip: >-
    Give it a whole day. The final climb is on foot, one to two hours on a steep grassy path with no waymarking,
    so a local guide or a good downloaded track is essential. It is windy at the top and cold even in
    summer — take a jacket and a hat. Carry water and food; there is nothing up there. Do not attempt
    it in fog, when every landmark disappears and the ridge becomes genuinely dangerous.
  route: >-
    From Batumi drive up the Adjaristsqali valley to Khulo, then south on the mountain track towards Khikhadziri
    — 480 km from Tbilisi in total, close to eight hours. The valley road is asphalt as far as Khulo;
    above that it is gravel, narrow, high and washed out in places. A four-wheel drive is mandatory and
    an ordinary car will not make it. The last fuel is in Khulo. Stay overnight in Khulo or Beshumi —
    this cannot be done from Tbilisi in a day.
ru:
  name: Крепость Хихани
  short: Одна из самых высокогорных средневековых крепостей Грузии, выше двух тысяч метров за хребтом
    от Хуло.
  body: >-
    **Хихани — из самых высоко расположенных крепостей Грузии:** выше двух тысяч метров, на скалистом
    гребне в Хулойском муниципалитете. Она лежит к югу от ущелья Аджарисцкали, за хребтом, и снизу не
    видна вовсе — сюда надо хотеть попасть.

    Крепость средневековая, её относят в основном к X-XIII векам, и назначение у неё было одно. Она контролировала
    перевал из верхней Аджарии на юг, в сторону Шавшети и старых земель Тао-Кларджети. Это была пограничная
    линия средневекового грузинского царства, а Хихани — один из её узлов.

    Что уцелело:

    - **Фрагменты внешней стены**, идущие по контуру скалы: кладка дополняет естественную защиту, а не
    повторяет её

    - **Остатки цистерны**, вырубленной в скале, — без неё осаду не выдержать

    - **Основание башни** в высшей точке

    Это руина, а не отреставрированный памятник. Тот, кто ждёт стен уровня Ананури, будет разочарован.
    Взамен здесь лучший вид в Аджарии: хребет за хребтом на юг до турецких гор и массив Годердзи на север.

    Подъём начинают из Хуло или из Схалтского ущелья, последний отрезок — пешком. Это не послеобеденная
    прогулка: четыре-шесть часов в сумме, погода наверху меняется быстро, а снег на подходах лежит до
    июня.
  tip: >-
    Отведите целый день. Последний подъём пеший — час-два по крутой травянистой тропе без маркировки,
    так что местный проводник или скачанный трек обязательны. Наверху ветер и холодно даже летом: куртка
    и шапка. Воду и еду берите с собой, там нет ничего. В туман не идите — ориентиры исчезают, и гребень
    становится по-настоящему опасным.
  route: >-
    Из Батуми вверх по ущелью Аджарисцкали до Хуло, затем на юг по горной дороге в сторону Хихадзири —
    от Тбилиси всего 480 км, около восьми часов. До Хуло дорога асфальтированная, выше гравийная, узкая,
    высокогорная и местами размытая. Полный привод обязателен, обычная машина не поднимется. Последняя
    заправка в Хуло. Ночуйте в Хуло или Бешуми — за один день из Тбилиси это невозможно.
fa:
  name: قلعهٔ خیخانی
  short: از بلندترین قلعه‌های سده‌های میانه در گرجستان، بالای دو هزار متر بر یالی آن‌سوی خولو.
  body: >-
    **خیخانی از بلندترین قلعه‌های گرجستان است،** بالای دو هزار متر بر تیغه‌ای صخره‌ای در شهرستان خولو.
    جنوب درهٔ آجاریسْتسقالی و آن‌سوی یال قرار دارد و از پایین اصلاً دیده نمی‌شود؛ باید بخواهید که بروید.

    قلعه از سده‌های میانه است و بیشتر به سده‌های دهم تا سیزدهم نسبت داده می‌شود، و یک کارکرد روشن داشت:
    گذرگاه آجارای بالا به سوی جنوب، به سمت شاوشتی و سرزمین‌های کهن تائو-کلارجتی را کنترل می‌کرد. اینجا
    خط مرزی پادشاهی گرجی سده‌های میانه بود و خیخانی یکی از گره‌های آن.

    آنچه مانده است:

    - **پاره‌های دیوار بیرونی** که خط صخره را دنبال می‌کند — بنّایی دفاع طبیعی را کامل می‌کند نه تکرار

    - **بازماندهٔ آب‌انباری** کنده در سنگ، که بدون آن تاب محاصره ممکن نبود

    - **پی برجی** در بلندترین نقطه

    این ویرانه است نه بنایی مرمت‌شده. هرکس دیوارهایی در حد آنانوری انتظار دارد سرخورده می‌شود. در عوض
    بهترین چشم‌انداز آجارا را دارید: یال پشت یال به سوی جنوب تا کوه‌های ترکیه، و تودهٔ گودردزی در شمال.

    صعود از خولو یا از درهٔ سخالتا آغاز می‌شود و بخش پایانی پیاده است. این گردش بعدازظهر نیست: روی‌هم
    چهار تا شش ساعت، هوا در آن ارتفاع تند عوض می‌شود و برف تا خرداد بر مسیر می‌ماند.
  tip: >-
    یک روز کامل بگذارید. صعود پایانی پیاده است، یک تا دو ساعت روی مسیری تند و علفی بدون نشانه‌گذاری، پس
    راهنمای محلی یا مسیر دانلودشدهٔ خوب ضروری است. بالا باد می‌آید و حتی تابستان سرد است — کاپشن و کلاه
    ببرید. آب و خوراک همراه ببرید؛ آن بالا هیچ نیست. در مه بالا نروید؛ نشانه‌ها گم می‌شوند و یال واقعاً
    خطرناک می‌شود.
  route: >-
    از باتومی در درهٔ آجاریسْتسقالی تا خولو، سپس به جنوب در جادهٔ کوهستانی به سوی خیخادزیری — از تفلیس
    روی‌هم ۴۸۰ کیلومتر، نزدیک هشت ساعت. جادهٔ دره تا خولو آسفالت است و بالاتر شنی و باریک و مرتفع و جابه‌جا
    شسته‌شده. خودروی دیفرانسیل چهار چرخ الزامی است و خودروی معمولی بالا نمی‌رود. آخرین سوخت در خولوست.
    شب را در خولو یا بشومی بمانید؛ یک‌روزه از تفلیس ممکن نیست.
he:
  name: מבצר חיחאני
  short: אחד המבצרים הגבוהים בגאורגיה מימי הביניים, מעל אלפיים מטר על רכס מעבר לחולו.
  body: >-
    **חיחאני הוא מן המבצרים הגבוהים בגאורגיה,** מעל אלפיים מטר על כתף סלע במחוז חולו. הוא שוכן מדרום לעמק
    אג׳ריסצקאלי, מעבר לרכס, ואינו נראה כלל מלמטה: צריך לרצות להגיע.

    המבצר הוא מימי הביניים, מיוחס בעיקר למאות ה-10 עד ה-13, והייתה לו מטרה אחת ברורה. הוא שלט על המעבר
    מאג׳ריה העילית דרומה, לכיוון שאבשתי ולארצות תאו-קלארג׳תי הישנות. זה היה קו הגבול של הממלכה הגאורגית
    של ימי הביניים, וחיחאני היה אחד מצומתיו.

    מה ששרד:

    - **שברי החומה החיצונית**, העוקבים אחר קו הסלע — הבנייה משלימה את ההגנה הטבעית ולא חוזרת עליה

    - **שרידי בור מים** חצוב בסלע, הכרחי לעמידה במצור

    - **יסוד מגדל** בנקודה הגבוהה ביותר

    זו חורבה ולא אתר משוחזר. מי שמצפה לחומות בסגנון אנאנורי יתאכזב. במקום זאת מקבלים את הנוף הטוב ביותר
    באג׳ריה: רכס אחרי רכס דרומה עד הרי טורקיה, ומסיב גודרדזי בצפון.

    העלייה מתחילה מחולו או מעמק סחאלטה, והקטע האחרון ברגל. זה אינו טיול של אחר הצהריים — ארבע עד שש שעות
    בסך הכול, מזג האוויר משתנה מהר בגובה הזה, והשלג נשאר על הדרך עד יוני.
  tip: >-
    הקדישו יום שלם. הטיפוס האחרון ברגל, שעה עד שעתיים בשביל עשבי ותלול ללא סימון, ולכן מדריך מקומי או
    מסלול מוריד טוב הכרחיים. למעלה נושבת רוח וקר גם בקיץ — קחו ז׳קט וכובע. שאו מים ואוכל; אין שם דבר.
    אל תעלו בערפל, כשכל נקודת ציון נעלמת והרכס נעשה מסוכן באמת.
  route: >-
    מבאטומי במעלה עמק אג׳ריסצקאלי עד חולו, ואז דרומה בדרך ההרים לכיוון חיחדזירי — 480 ק״מ מטביליסי בסך
    הכול, קרוב לשמונה שעות. הכביש בעמק סלול עד חולו; מעל זה חצץ, צר, גבוה ושטוף במקומות. הנעה כפולה הכרחית
    ורכב רגיל לא יעלה. התדלוק האחרון בחולו. לינו בחולו או בבשומי — מטביליסי ביום אחד זה בלתי אפשרי.
ar:
  name: قلعة خيخاني
  short: من أعلى قلاع جورجيا من العصور الوسطى، فوق ألفي متر على حافة جبلية خلف خولو.
  body: >-
    **خيخاني من أعلى قلاع جورجيا،** فوق ألفي متر على عرف صخري في بلدية خولو. تقع جنوب وادي أجاريستسقالي
    خلف السلسلة، ولا تُرى من الأسفل إطلاقاً: عليك أن تريد الوصول إليها.

    القلعة من العصور الوسطى، وتُنسب في معظمها إلى القرون العاشر إلى الثالث عشر، وكان لها غرض واحد واضح.
    كانت تتحكم في المعبر من أجاريا العليا جنوباً نحو شاوشيتي وأراضي تاو-كلارجيتي القديمة. كان هذا خط حدود
    المملكة الجورجية في العصور الوسطى، وخيخاني إحدى عقده.

    ما بقي منها:

    - **أجزاء من السور الخارجي** تتبع خط الصخر — فالبناء يكمل الدفاع الطبيعي ولا يكرره

    - **بقايا صهريج** محفور في الصخر، لا غنى عنه لاحتمال الحصار

    - **أساس برج** في أعلى نقطة

    هذه أطلال لا نصب مرمم. ومن يتوقع أسواراً بمستوى أنانوري سيخيب. لكنك تنال في المقابل أجمل منظر في أجاريا:
    سلسلة خلف سلسلة جنوباً حتى جبال تركيا، وكتلة غودردزي شمالاً.

    يبدأ الصعود من خولو أو من وادي سخالتا، والمقطع الأخير سيراً. وهذه ليست نزهة عصر: أربع إلى ست ساعات
    إجمالاً، والطقس يتغير سريعاً على هذا الارتفاع، والثلج يبقى على الطريق حتى يونيو.
  tip: >-
    امنحها يوماً كاملاً. الصعود الأخير سيراً، ساعة إلى ساعتين على درب عشبي حاد بلا علامات، فمرشد محلي
    أو مسار محمّل جيد ضروري. في الأعلى ريح وبرد حتى في الصيف — خذ سترة وقبعة. واحمل الماء والطعام؛ لا
    شيء هناك. ولا تصعد في الضباب، حين تختفي المعالم ويصير العرف خطراً حقاً.
  route: >-
    من باتومي صعوداً في وادي أجاريستسقالي حتى خولو، ثم جنوباً على درب الجبل نحو خيخادزيري — 480 كم من
    تبليسي إجمالاً، قرابة ثماني ساعات. طريق الوادي معبّد حتى خولو، وفوقه حصوي ضيق مرتفع ومجروف في مواضع.
    الدفع الرباعي إلزامي ولن تصعد سيارة عادية. آخر وقود في خولو. بت في خولو أو بيشومي — من تبليسي في يوم
    واحد أمر مستحيل.
