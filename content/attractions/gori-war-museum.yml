ka:
  name: გორის საბრძოლო დიდების მუზეუმი და ომის მემორიალი
  short: >-
    საბრძოლო დიდების პატარა მუზეუმი სტალინის გამზირზე და გიორგი ოჩიაურის ბრინჯაოს მეომრების წრე ციხის
    ძირას — გორის უფრო ჩუმი საუბარი ომზე.
  body: >-
    **გორში სტუმართა უმეტესობა სტალინის სანახავად ჩამოდის; იქვე, რამდენიმე ასეულ მეტრში, ქალაქი იმ ადამიანების
    ანგარიშს ინახავს, ომებმა რომ შთანთქა.**


    ფრონტი კავკასიონის უღელტეხილებზე შეაჩერეს და საქართველოს ქალაქებამდე არ მოსულა, მაგრამ მეორე მსოფლიო
    ომში რესპუბლიკამ წითელ არმიას თითქმის 700 000 მებრძოლი მისცა და მათგან დაახლოებით 350 000 დაიღუპა
    — ყოველი მეორე. ასეთი რიცხვის წარმოდგენა შეუძლებელია, ამიტომ გორი მასში შესასვლელად ორ პატარა კარს
    გთავაზობთ.


    პირველი საბრძოლო დიდების მუზეუმია სტალინის გამზირის მე-19 ნომერში, სტალინის მუზეუმიდან ფეხით რამდენიმე
    წუთში: ომში ნამყოფი ქართველებისადმი მიძღვნილი მოკრძალებული, ადგილობრივი მუზეუმი — ისეთი ადგილი, სადაც
    ერთი ფოტოს წინაც შეიძლება დიდხანს შეჩერდეთ.


    მეორე, უფრო ძლიერი, ციხის ბორცვის ძირას დგას: წრედ შემომსხდარი ბრინჯაოს მეომრები, გიორგი ოჩიაურის
    (1927–2017) ნამუშევარი. ოჩიაური საქართველოს სსრ სახალხო მხატვარი იყო, 1991 წელს კი საქართველოს სახელმწიფოებრივი
    დამოუკიდებლობის აღდგენის აქტს მოაწერა ხელი. ანსამბლი, სახელად „რექვიემი“, მან 1981–1985 წლებში თბილისის
    გამარჯვების პარკისთვის შექმნა; მოგვიანებით გორში გადმოიტანეს და ახლა შუა საუკუნეების ციხის ჩრდილში
    დგას. სახელშია მთელი აზრი: ეს ბრინჯაოში ჩამოსხმული პანაშვიდია და არა გამარჯვების აღლუმი; ფიგურები
    ადგილს კი არ დარაჯობენ — თითქოს მიცვალებულთან ღამეს ათენებენ.


    გორს ახლო წარსულშიც აქვს მიზეზი, რომ ყური მიუგდოს. 2008 წლის აგვისტოში რუსულმა ავიაციამ ქალაქი დაბომბა;
    „ჰიუმან რაითს ვოჩის“ ცნობით, 12 აგვისტოს ცენტრში კასეტურმა ჭურვებმა თერთმეტი მშვიდობიანი მოქალაქე
    იმსხვერპლა, რუსული და სამხრეთ ოსური ძალები კი გორში 22 აგვისტომდე იდგნენ.


    შემდეგ ციხის კედლებამდე ადით და ქვემოთ გადმოიხედეთ: ზემოდან ბრინჯაოს წრე ადამიანებს ჰგავს, რომლებიც
    ვიღაცის მოსალოდნელად ჩამოსხდნენ — ვინც აღარ მოვა.
  tip: >-
    ორივესთვის ერთი საათი საკმარისია. რუკის უახლესი მონაცემებით მუზეუმი ყოველდღე 10:00-დან 17:00-მდე მუშაობს,
    შესვლა რამდენიმე ლარი ღირს — ადგილზე გადაამოწმეთ, პროვინციულ მუზეუმებში საათები იცვლება. წარწერები
    ძირითადად ქართულად და რუსულადაა, ამიტომ უცხოელ თანამგზავრს წინასწარ მოუყევით ამბავი. მემორიალი ღია
    ცის ქვეშაა, უფასო და ყოველთვის ხელმისაწვდომი — იაკობ გოგებაშვილის ქუჩაზე, ციხის ძირას; ციხისკენ მიმავალი
    ბილიკიც იქვე იწყება. გორის ცენტრი ბრტყელია და ფეხით სავალად მოსახერხებელი, კაფეებიც ბევრია. სრული,
    მძიმე სურათისთვის სტალინის მუზეუმთან ერთად ნახეთ.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ გორის მონიშნულ გასასვლელამდე — დაახლოებით 86 კმ
    და საათი და ათი წუთი სწრაფი, ოთხზოლიანი გზით. მაჩვენებლებს ცენტრამდე გაჰყევით, შემდეგ სტალინის გამზირზე
    გადით: მუზეუმი მე-19 ნომერშია, მემორიალი კი რამდენიმე ასეულ მეტრში დასავლეთით, ციხის ბორცვის ძირას.
    ცენტრში ქუჩის პარკინგი ფასიანია და შუადღისთვის ივსება; გვერდით ქუჩებში ადგილის პოვნა უფრო ადვილია.
    საწვავი ქალაქში შესვლამდეა. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Gori War Museum and War Memorial
  short: >-
    A small Museum of Military Glory on Stalin Avenue and Giorgi Ochiauri's ring of bronze warriors below
    the fortress: Gori's quieter reckoning with war.
  body: >-
    **Most visitors come to Gori to look at Stalin; a few hundred metres away, the town keeps count of
    the people the wars consumed.**


    The front was stopped in the high Caucasus passes and never reached Georgia's towns, yet the republic
    sent almost 700,000 fighters to the Red Army in the Second World War, and some 350,000 of them were
    killed — roughly one in every two. Numbers of that size refuse to be imagined, so Gori offers two
    smaller doors into them.


    The first is the Museum of Military Glory at 19 Stalin Avenue, a short walk from the Stalin Museum:
    a modest, local museum of Georgians at war, the kind of place where you slow down in front of a single
    photograph.


    The second, and the stronger, stands at the foot of the fortress hill: a ring of seated bronze warriors
    by Giorgi Ochiauri (1927–2017), People's Artist of Soviet Georgia and, in 1991, a signatory of the
    Act of Restoration of Georgia's Independence. He made the ensemble, titled "Requiem", in 1981–85 for
    Victory Park in Tbilisi; it was later brought to Gori, and now sits in the shadow of the medieval
    citadel. The title is the key. This is a funeral mass cast in bronze, not a victory parade, and the
    figures seem less to guard the place than to keep a wake in it.


    Gori has its own recent reason to listen. In August 2008 Russian aircraft bombed the town; on 12 August,
    according to Human Rights Watch, cluster munitions fell in the centre and killed eleven civilians,
    and Russian and South Ossetian forces held Gori until 22 August.


    Climb afterwards to the fortress walls and look down: from above, the bronze circle looks like people
    who have sat down to wait for someone who is not coming.
  tip: >-
    An hour covers both. The museum was last mapped as open daily 10:00–17:00, with a small entry fee
    of a few lari — confirm locally, as provincial hours change. Labels are mostly in Georgian and Russian,
    so read up beforehand. The memorial is outdoors, free and always accessible, on Iakob Gogebashvili
    Street below the fortress; the path up to the citadel starts close by. Central Gori is flat and walkable,
    with plenty of cafés. Pair the visit with the Stalin Museum for the full, uncomfortable picture.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi to the signed Gori exit — about 86 km and 1 hour 10 minutes
    on fast dual carriageway. Follow the signs into the centre and on to Stalin Avenue: the museum is
    at No. 19, and the memorial lies a few hundred metres to the west, below the fortress hill. Street
    parking in the centre is paid and fills by midday; the side streets are easier. Fuel on the approach
    to town. An economy car is sufficient all year round.
ru:
  name: Военный музей и военный мемориал в Гори
  short: >-
    Небольшой Музей боевой славы на проспекте Сталина и кольцо бронзовых воинов Георгия Очиаури под крепостью:
    тихий разговор Гори о войне.
  body: >-
    **Большинство туристов приезжает в Гори посмотреть на Сталина; а в нескольких сотнях метров отсюда
    город ведёт счёт тем, кого поглотили войны.**


    Фронт остановили на перевалах Кавказа, до грузинских городов он не дошёл, и всё же республика отправила
    в Красную армию во Вторую мировую войну почти 700 000 бойцов, и около 350 000 из них погибли — примерно
    каждый второй. Числа такого масштаба отказываются укладываться в воображение, поэтому Гори предлагает
    войти в них через две двери поменьше.


    Первая — Музей боевой славы на проспекте Сталина, 19, в нескольких минутах ходьбы от музея Сталина:
    скромный местный музей о грузинах на войне, из тех мест, где замедляешь шаг перед одной-единственной
    фотографией.


    Вторая, и более сильная, — у подножия крепостного холма: кольцо сидящих бронзовых воинов работы Георгия
    Очиаури (1927–2017), народного художника Грузинской ССР, а в 1991 году — одного из подписавших Акт
    о восстановлении независимости Грузии. Ансамбль под названием «Реквием» он создал в 1981–85 годах
    для парка Победы в Тбилиси; позже его перевезли в Гори, и теперь он стоит в тени средневековой цитадели.
    Ключ — в названии. Это заупокойная служба, отлитая в бронзе, а не парад победы, и фигуры словно не
    столько охраняют это место, сколько несут здесь ночное бдение над усопшими.


    У Гори есть и своя, недавняя причина прислушаться. В августе 2008 года город бомбила российская авиация;
    12 августа, по данным Human Rights Watch, в центре упали кассетные боеприпасы, погибли одиннадцать
    мирных жителей, а российские и южноосетинские силы удерживали Гори до 22 августа.


    Потом поднимитесь на крепостную стену и посмотрите вниз: сверху бронзовый круг похож на людей, которые
    присели подождать того, кто уже не придёт.
  tip: >-
    На оба места хватит часа. По последним данным на картах, музей открыт ежедневно с 10:00 до 17:00,
    вход стоит несколько лари — уточняйте на месте: в провинции часы работы меняются. Подписи в основном
    на грузинском и русском, так что почитайте о музее заранее. Мемориал под открытым небом, бесплатный
    и доступный всегда, на улице Иакоба Гогебашвили под крепостью; тропа к цитадели начинается совсем
    рядом. Центр Гори ровный и удобный для прогулок, кафе хватает. Совместите визит с музеем Сталина —
    так картина будет полной и неуютной.
  route: >-
    Из Тбилиси езжайте на запад по автомагистрали S1 (E60) до съезда с указателем «Гори» — около 86 км
    и 1 час 10 минут по быстрой четырёхполосной дороге. Следуйте указателям в центр и дальше на проспект
    Сталина: музей в доме № 19, а мемориал — в нескольких сотнях метров к западу, под крепостным холмом.
    Уличная парковка в центре платная и к полудню заполняется; в боковых улицах проще. Заправиться можно
    на подъезде к городу. Машины эконом-класса достаточно круглый год.
fa:
  name: موزهٔ جنگ و یادمان جنگ گوری
  short: >-
    موزهٔ کوچک شکوه نظامی در خیابان استالین و حلقهٔ جنگاوران مفرغی گیورگی اوچیائوری در پای قلعه: حساب‌وکتاب
    آرام‌تر گوری با جنگ.
  body: >-
    **بیشتر بازدیدکنندگان برای دیدن استالین به گوری می‌آیند؛ چند صد متر آن‌سوتر، شهر حساب مردمانی را نگه
    می‌دارد که جنگ‌ها بلعیدند.**


    جبهه در گردنه‌های قفقاز متوقف شد و هرگز به شهرهای گرجستان نرسید، با این حال این جمهوری در جنگ جهانی
    دوم نزدیک به ۷۰۰٬۰۰۰ رزمنده به ارتش سرخ فرستاد و حدود ۳۵۰٬۰۰۰ تن از آنان کشته شدند، تقریباً از هر
    دو نفر یکی. عددهایی به این بزرگی به تصور درنمی‌آیند، پس گوری دو درِ کوچک‌تر به سوی آن‌ها می‌گشاید.


    درِ نخست موزهٔ شکوه نظامی است، در شمارهٔ ۱۹ خیابان استالین، چند قدم پیاده از موزهٔ استالین: موزه‌ای
    محلی و فروتن دربارهٔ گرجی‌ها در جنگ، از آن جاهایی که جلوی یک عکس تنها قدم‌هایتان کُند می‌شود.


    درِ دوم، و قوی‌تر، در پای تپهٔ قلعه است: حلقه‌ای از جنگاوران مفرغی نشسته، اثر گیورگی اوچیائوری (۱۹۲۷–۲۰۱۷)،
    هنرمند خلق گرجستان شوروی و در ۱۹۹۱ از امضاکنندگان سند اعادهٔ استقلال گرجستان. او این مجموعه را با
    نام «رکوئیم» در سال‌های ۱۹۸۱–۸۵ برای پارک پیروزی در تفلیس ساخت؛ بعدها به گوری آورده شد و اکنون در
    سایهٔ دژ قرون وسطایی نشسته است. کلید در همین نام است. این آیین سوگواری است که در مفرغ ریخته شده، نه
    رژهٔ پیروزی، و پیکره‌ها بیش از آنکه نگهبان این مکان باشند، گویی بر بالین مرده‌ای شب‌زنده‌داری می‌کنند.


    گوری دلیلی تازه‌تر و از آنِ خود نیز برای گوش سپردن دارد. در اوت ۲۰۰۸ هواپیماهای روسیه شهر را بمباران
    کردند؛ در ۱۲ اوت، به گزارش دیده‌بان حقوق بشر، مهمات خوشه‌ای در مرکز شهر فرو ریخت و یازده غیرنظامی
    را کشت، و نیروهای روسیه و اوستیای جنوبی تا ۲۲ اوت گوری را در دست داشتند.


    پس از آن تا باروهای قلعه بالا بروید و به پایین نگاه کنید: از آن بالا، حلقهٔ مفرغی به مردمانی می‌ماند
    که نشسته‌اند تا منتظر کسی بمانند که دیگر نمی‌آید.
  tip: >-
    یک ساعت برای هر دو کافی است. طبق آخرین اطلاعات نقشه‌ها، موزه هر روز از ۱۰:۰۰ تا ۱۷:۰۰ باز است و ورودیه‌ای
    اندک، چند لاری، دارد؛ در محل مطمئن شوید، چون ساعات کار در شهرستان‌ها تغییر می‌کند. برچسب‌ها بیشتر
    گرجی و روسی‌اند، پس از پیش دربارهٔ موزه بخوانید. یادمان در فضای باز است، رایگان و همیشه در دسترس،
    در خیابان یاکوب گوگباشویلی پایین قلعه؛ راه بالا رفتن به دژ از همان نزدیکی آغاز می‌شود. مرکز گوری هموار
    و مناسب پیاده‌روی است و کافه فراوان دارد. این بازدید را با موزهٔ استالین همراه کنید تا تصویر کامل
    و ناخوشایند را ببینید.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا خروجیِ دارای تابلوی «گوری» بروید؛ حدود ۸۶ کیلومتر و ۱ ساعت
    و ۱۰ دقیقه در جادهٔ دوبانده و سریع. تابلوها را تا مرکز شهر و سپس تا خیابان استالین دنبال کنید: موزه
    در پلاک ۱۹ است و یادمان چند صد متر به سمت غرب، پایین تپهٔ قلعه. پارک کنار خیابان در مرکز پولی است
    و تا ظهر پر می‌شود؛ کوچه‌های فرعی آسان‌ترند. سوخت را در ورودی شهر بزنید. خودروی اقتصادی در تمام سال
    کافی است.
he:
  name: מוזיאון המלחמה ואנדרטת המלחמה בגורי
  short: >-
    מוזיאון קטן לתהילה צבאית בשדרת סטלין ומעגל לוחמי הברונזה של גיורגי אוצ'יאורי למרגלות המבצר: חשבון
    הנפש השקט יותר של גורי עם המלחמה.
  body: >-
    **רוב המבקרים באים לגורי כדי להביט בסטלין; כמה מאות מטרים משם העיר סופרת את האנשים שהמלחמות בלעו.**


    החזית נעצרה במעברי הקווקז ולא הגיעה מעולם לערי גאורגיה, ובכל זאת שלחה הרפובליקה במלחמת העולם השנייה
    כמעט 700,000 לוחמים לצבא האדום, וכ-350,000 מהם נהרגו — בערך אחד מכל שניים. מספרים בגודל כזה מסרבים
    להצטייר בדמיון, ולכן גורי מציעה שתי דלתות קטנות יותר אליהם.


    הראשונה היא המוזיאון לתהילה צבאית בשדרת סטלין 19, הליכה קצרה ממוזיאון סטלין: מוזיאון מקומי וצנוע על
    גאורגים במלחמה, מן המקומות שבהם מאטים את הצעד מול תצלום אחד.


    השנייה, והחזקה יותר, עומדת למרגלות גבעת המבצר: מעגל של לוחמים יושבים עשויי ברונזה, מעשה ידיו של גיורגי
    אוצ'יאורי (1927–2017), אמן העם של גאורגיה הסובייטית, וב-1991 אחד החותמים על מסמך השבת העצמאות של גאורגיה.
    הוא יצר את המכלול, שנקרא "רקוויאם", ב-1981–85 עבור פארק הניצחון בטביליסי; מאוחר יותר הוא הועבר לגורי,
    והיום הוא יושב בצל המצודה מימי הביניים. השם הוא המפתח. זו מיסת אשכבה יצוקה בברונזה, לא מצעד ניצחון,
    והדמויות נראות לא כמי ששומרות על המקום אלא כמי שיושבות בו במשמרת אבל ליד מת.


    לגורי יש גם סיבה משלה, קרובה יותר בזמן, להקשיב. באוגוסט 2008 הפציצו מטוסים רוסיים את העיר; ב-12 באוגוסט,
    לפי ארגון זכויות האדם היומן רייטס ווטש, נפלה תחמושת מצרר במרכז העיר והרגה אחד-עשר אזרחים, וכוחות רוסיים
    ודרום-אוסטיים החזיקו בגורי עד 22 באוגוסט.


    אחר כך עלו אל חומות המבצר והביטו למטה: מלמעלה נראה מעגל הברונזה כמו אנשים שהתיישבו לחכות למישהו שלא
    יבוא.
  tip: >-
    שעה מספיקה לשניהם. לפי המיפוי האחרון, המוזיאון פתוח מדי יום 10:00–17:00, בדמי כניסה סמליים של כמה
    לארי — ודאו במקום, כי שעות הפתיחה בפריפריה משתנות. השילוט ברובו בגאורגית וברוסית, אז קראו על המקום
    מראש. האנדרטה נמצאת באוויר הפתוח, חינם ופתוחה תמיד, ברחוב יאקוב גוגבאשווילי שמתחת למבצר; השביל אל
    המצודה מתחיל ממש בסמוך. מרכז גורי שטוח ונוח להליכה, ויש בו בתי קפה בשפע. שלבו את הביקור עם מוזיאון
    סטלין כדי לקבל את התמונה המלאה, והלא נוחה.
  route: >-
    סעו מטביליסי מערבה בכביש המהיר S1 (E60) עד היציאה המשולטת לגורי — כ-86 ק"מ ושעה ו-10 דקות על כביש
    מהיר דו-מסלולי. עקבו אחר השלטים אל המרכז והלאה אל שדרת סטלין: המוזיאון במספר 19, והאנדרטה כמה מאות
    מטרים מערבה, מתחת לגבעת המבצר. החניה ברחובות המרכז בתשלום ומתמלאת עד הצהריים; ברחובות הצדדיים קל יותר.
    תדלקו בדרך הכניסה לעיר. רכב חסכוני מספיק כל השנה.
ar:
  name: متحف الحرب والنصب التذكاري للحرب في غوري
  short: >-
    متحف صغير للمجد العسكري في جادة ستالين، وحلقة المحاربين البرونزيين لغيورغي أوتشياوري تحت القلعة: وقفة
    غوري الأهدأ مع ذاكرة الحرب.
  body: >-
    **يأتي معظم الزوار إلى غوري ليتأملوا ستالين؛ وعلى بعد بضع مئات من الأمتار، تُحصي المدينة الناسَ الذين
    ابتلعتهم الحروب.**


    توقفت الجبهة عند ممرات القوقاز ولم تبلغ مدن جورجيا قط، ومع ذلك أرسلت الجمهورية إلى الجيش الأحمر في
    الحرب العالمية الثانية قرابة 700,000 مقاتل، قُتل منهم نحو 350,000 — أي واحد من كل اثنين تقريباً. أرقام
    بهذا الحجم تأبى أن تُتخيَّل، ولذلك تفتح غوري إليها بابين أصغر.


    الأول متحف المجد العسكري في الرقم 19 بجادة ستالين، على مسافة قصيرة سيراً من متحف ستالين: متحف محلي
    متواضع عن الجورجيين في الحرب، من تلك الأماكن التي تُبطئ فيها خطاك أمام صورة واحدة.


    والثاني، وهو الأقوى، يقوم عند سفح تل القلعة: حلقة من المحاربين البرونزيين الجالسين، من عمل غيورغي
    أوتشياوري (1927–2017)، فنان الشعب في جورجيا السوفييتية، وأحد الموقّعين في عام 1991 على وثيقة استعادة
    استقلال جورجيا. صنع هذه المجموعة، وعنوانها «قدّاس الموتى»، في 1981–85 لحديقة النصر في تبليسي؛ ثم نُقلت
    لاحقاً إلى غوري، وهي اليوم جالسة في ظل قلعة القرون الوسطى. العنوان هو المفتاح. هذا قدّاس جنائزي مصبوب
    في البرونز، لا استعراض نصر، وتبدو التماثيل وكأنها لا تحرس المكان بقدر ما تسهر فيه على ميت.


    ولغوري أيضاً سببٌ قريب خاصٌّ بها يدعوها إلى الإصغاء. ففي آب/أغسطس 2008 قصفت الطائرات الروسية المدينة؛
    وفي 12 آب/أغسطس، بحسب منظمة هيومن رايتس ووتش، سقطت ذخائر عنقودية في الوسط فقتلت أحد عشر مدنياً، وسيطرت
    القوات الروسية والأوسيتية الجنوبية على غوري حتى 22 آب/أغسطس.


    اصعد بعد ذلك إلى أسوار القلعة وانظر إلى الأسفل: من الأعلى تبدو الحلقة البرونزية كأناس جلسوا ينتظرون
    أحداً لن يأتي.
  tip: >-
    تكفي ساعة للمكانين. بحسب آخر ما سُجّل على الخرائط، يفتح المتحف يومياً من 10:00 إلى 17:00، برسم دخول
    زهيد من بضعة لاريات — تأكد في المكان، فمواعيد المتاحف في الأقاليم تتغير. الشروح في معظمها بالجورجية
    والروسية، فاقرأ عنه مسبقاً. النصب التذكاري في الهواء الطلق، مجاني ومتاح دائماً، في شارع ياكوب غوغيباشفيلي
    تحت القلعة؛ ويبدأ الدرب الصاعد إلى القلعة على مقربة منه. وسط غوري مستوٍ وسهل المشي، وفيه مقاهٍ كثيرة.
    اجمع هذه الزيارة مع متحف ستالين لترى الصورة كاملة، بكل ما فيها من حرج.
  route: >-
    خذ الطريق السريع S1 (E60) غرباً من تبليسي حتى مخرج غوري المعلَّم — نحو 86 كم وساعة و10 دقائق على طريق
    مزدوج سريع. اتبع اللافتات إلى الوسط ثم إلى جادة ستالين: المتحف في الرقم 19، والنصب التذكاري على بعد
    بضع مئات من الأمتار غرباً، تحت تل القلعة. الوقوف في شوارع الوسط مدفوع ويمتلئ بحلول الظهر؛ والشوارع
    الجانبية أسهل. تزوّد بالوقود عند مدخل المدينة. سيارة اقتصادية تكفي طوال العام.
