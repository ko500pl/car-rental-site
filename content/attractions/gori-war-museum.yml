ka:
  name: გორის საბრძოლო დიდების მუზეუმი და ომის მემორიალი
  short: >-
    პატარა მუზეუმი ომში დაღუპულ ქართველებზე და ციხის ძირას მდგარი ქვის მეომრების მემორიალი.
  body: >-
    **გორში ჩამოსული უმეტესობა სტალინის მუზეუმში მიდის, მაგრამ ქალაქს მეორე, უფრო ჩუმი ომის ისტორია
    აქვს.** სტალინის გამზირზე, მთავარი მუზეუმიდან რამდენიმე წუთის სავალზე, პატარა საბრძოლო დიდების
    მუზეუმია. ის მეორე მსოფლიო ომში მონაწილე ქართველებს ეძღვნება: სამხედრო ბილეთები, წერილები სახლში,
    ფოტოები, ორდენები, ფორმა და სოფლების სიები, საიდანაც ხალხი აღარ დაბრუნდა.


    ექსპოზიცია მოკრძალებული და ძველებურია — მინის ვიტრინები, ხელნაწერი ბარათები, თარგმანი ხშირად არ არის.
    სწორედ ეს სიმარტივე მუშაობს: ეს არ არის ეროვნული ნარატივი, ეს ერთი რაიონის აღრიცხვაა. საქართველოდან
    ომში დაახლოებით ნახევარი მილიონი ადამიანი წავიდა და დაახლოებით ნახევარი აღარ დაბრუნდა — ეს პროპორცია
    გორის დარბაზში ბევრად უფრო გასაგებია, ვიდრე სტატისტიკაში.


    მუზეუმზე მეტად ცნობილია **ქართველ მეომართა მემორიალი** ციხის ბორცვის ძირას: მოზრდილი ქვის ფიგურები,
    შემოსხდომილნი ნახევარწრეში, სახეებგარეშე, თითქოს დაშლილი და კვლავ აწყობილი. ისინი 1980-იან წლებში
    შექმნა მოქანდაკე გიორგი ოჩიაურმა და ომში დაღუპულ ქართველ ჯარისკაცებს ეძღვნება. მკაცრი, ჩუმი და
    საბჭოთა სამხედრო ძეგლისთვის უჩვეულოდ პირადი ნამუშევარია — უფრო გლოვა, ვიდრე ტრიუმფი.


    ორივე ერთად ნახევარ საათს იკავებს და გორის სურათს არსებითად ცვლის.
  tip: >-
    ერთი საათი ორივესთვის საკმარისია. მუზეუმი პატარაა და ხშირად ცარიელი; ეტიკეტები ძირითადად ქართულად და
    რუსულადაა, ინგლისური მწირია — ცოტა კონტექსტი წინასწარ ღირს. მემორიალი ღია ცის ქვეშაა, უფასო და
    ყოველთვის ხელმისაწვდომი; ციხეზე ასვლის ბილიკიდან ჩანს. ცენტრში ფასიანი პარკინგი და ბევრი კაფეა. გორის
    ცენტრი ბრტყელია და ფეხით სიარულისთვის მოსახერხებელი.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ — 86 კმ, დაახლოებით საათი და ათი წუთი სწრაფი ავტობანით. გორის
    აღმოსავლეთი შესასვლელი მკაფიოდ არის მონიშნული; ცენტრში სტალინის გამზირს გაჰყევით, სადაც ორივე ობიექტი
    ერთმანეთის ახლოსაა. ქუჩის პარკინგი ცენტრში ფასიანია და დღისით ივსება, უფრო თავისუფალია გვერდით
    ქუჩებში. საწვავი ქალაქის შესასვლელშია. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Gori War Museum and War Memorial
  short: >-
    A small museum of Georgians who died in the Second World War, and the stone warrior memorial below
    the fortress hill.
  body: >-
    **Almost everyone who comes to Gori goes to the Stalin Museum, but the town carries a second, quieter
    war history.** A few minutes' walk along Stalin Avenue from the main museum is the small Museum of
    Military Glory. It is devoted to Georgians who served in the Second World War: service books, letters
    home, photographs, medals, uniforms, and lists of the villages that men left and did not return to.


    The display is modest and old-fashioned — glass cases, handwritten cards, often no translation. That
    plainness is what makes it work. This is not a national narrative but one district's accounting.
    Roughly 700,000 people went to the war from Georgia and something close to half never came back; that
    proportion is far easier to grasp in this room than in a statistic.


    Better known than the museum is the **Memorial of Georgian War Heroes** at the foot of the fortress
    hill: large seated stone figures set in a half circle, faceless, looking as if they had been broken
    apart and reassembled. They were made in the 1980s by the sculptor Giorgi Ochiauri and commemorate
    Georgian soldiers killed in the war. The work is severe, silent and unusually personal for a Soviet
    military monument — closer to mourning than to triumph.


    Together the two take half an hour and change the shape of a visit to Gori considerably, especially
    for anyone who has just come out of the Stalin Museum.
  tip: >-
    An hour covers both. The museum is small and often empty; labels are mostly in Georgian and Russian
    with little English, so a bit of background beforehand helps. The memorial is outdoors, free and
    always accessible, and is visible from the path up to the fortress. There is paid street parking in
    the centre and plenty of cafes. Central Gori is flat and comfortable to cover on foot.
  route: >-
    Take the E60 west from Tbilisi — 86 km, about an hour and ten minutes on fast dual carriageway. The
    eastern entrance to Gori is clearly signed; in the centre follow Stalin Avenue, where both sites sit
    close together. Street parking in the centre is charged and fills during the day, but side streets
    are easier. Fuel is available at the edge of town. An economy car is sufficient all year round.
ru:
  name: Музей боевой славы и военный мемориал в Гори
  short: >-
    Небольшой музей грузин, погибших во Второй мировой войне, и мемориал каменных воинов под крепостным
    холмом.
  body: >-
    **Почти все, кто приезжает в Гори, идут в музей Сталина, но у города есть и вторая, более тихая
    военная история.** В нескольких минутах ходьбы по проспекту Сталина от главного музея стоит небольшой
    Музей боевой славы. Он посвящён грузинам, воевавшим во Второй мировой: военные билеты, письма домой,
    фотографии, награды, форма и списки сёл, откуда люди ушли и не вернулись.


    Экспозиция скромная и старомодная: стеклянные витрины, рукописные карточки, часто без перевода.
    Именно эта простота и работает. Это не национальный нарратив, а бухгалтерия одного района. Из Грузии
    на войну ушло около 700 тысяч человек, и примерно половина не вернулась; в этом зале такая пропорция
    понимается гораздо лучше, чем в статистике.


    Известнее музея **Мемориал грузинским воинам** у подножия крепостного холма: крупные сидящие каменные
    фигуры, поставленные полукругом, без лиц, будто разбитые и снова собранные. Их создал в 1980-х
    скульптор Георгий Очиаури в память о грузинских солдатах, погибших на войне. Работа суровая,
    молчаливая и необычно личная для советского военного памятника — ближе к скорби, чем к триумфу.


    Вдвоём они занимают полчаса и заметно меняют картину поездки в Гори, особенно если вы только что
    вышли из музея Сталина.
  tip: >-
    Часа хватит на оба места. Музей маленький и часто пустой; подписи в основном на грузинском и русском,
    английского мало, так что немного контекста заранее не помешает. Мемориал под открытым небом,
    бесплатный и доступен всегда, его видно с тропы к крепости. В центре платная уличная парковка и много
    кафе. Центр Гори ровный, удобно обойти пешком.
  route: >-
    Из Тбилиси на запад по E60 — 86 км, примерно час десять по скоростной трассе. Восточный въезд в Гори
    хорошо обозначен; в центре держитесь проспекта Сталина, где оба объекта рядом. Уличная парковка в
    центре платная и днём заполняется, на боковых улицах свободнее. Заправка есть на въезде в город.
    Машины эконом-класса достаточно круглый год.
fa:
  name: موزهٔ افتخارات نظامی و یادمان جنگ در گوری
  short: >-
    موزه‌ای کوچک دربارهٔ گرجیانی که در جنگ جهانی دوم کشته شدند، و یادمان جنگاوران سنگی زیر تپهٔ قلعه.
  body: >-
    **تقریباً هر که به گوری می‌آید به موزهٔ استالین می‌رود، اما شهر تاریخ جنگی دیگری هم دارد، آرام‌تر.**
    چند دقیقه پیاده در خیابان استالین از موزهٔ اصلی، موزهٔ کوچک افتخارات نظامی قرار دارد. این موزه به
    گرجیانی اختصاص دارد که در جنگ جهانی دوم خدمت کردند: دفترچه‌های خدمت، نامه‌های خانه، عکس‌ها، نشان‌ها،
    اونیفورم، و فهرست روستاهایی که مردان از آنها رفتند و بازنگشتند.


    نمایش، فروتنانه و قدیمی است: ویترین‌های شیشه‌ای، برگه‌های دست‌نویس و اغلب بدون ترجمه. همین سادگی است
    که کار می‌کند. اینجا روایتی ملی نیست، دفتر حساب یک شهرستان است. نزدیک ۷۰۰ هزار تن از گرجستان به جنگ
    رفتند و چیزی نزدیک به نیمی از آنان هرگز بازنگشتند؛ درک این نسبت در این اتاق بسیار آسان‌تر از خواندن
    آن در آمار است.


    شناخته‌تر از موزه، **یادمان قهرمانان جنگ گرجی** در پای تپهٔ قلعه است: پیکره‌های سنگی بزرگ نشسته در
    نیم‌دایره، بی‌چهره، چنان‌که گویی شکسته و دوباره کنار هم چیده شده‌اند. آنها را در دههٔ ۱۹۸۰ پیکرتراش
    گیورگی اوچیائوری ساخت به یاد سربازان گرجی کشته‌شده در جنگ. اثری است سخت، خاموش و برای یادمانی نظامی
    در دورهٔ شوروی به‌طرز غیرعادی شخصی؛ نزدیک‌تر به سوگ تا به پیروزی.


    این دو با هم نیم‌ساعت می‌گیرند و شکل سفر به گوری را به‌روشنی عوض می‌کنند، به‌ویژه برای کسی که تازه از
    موزهٔ استالین بیرون آمده است.
  tip: >-
    یک ساعت هر دو را می‌پوشاند. موزه کوچک است و اغلب خالی؛ برچسب‌ها بیشتر گرجی و روسی‌اند و انگلیسی کم
    است، پس اندکی پیش‌زمینه کمک می‌کند. یادمان در فضای باز، رایگان و همیشه در دسترس است و از مسیر بالا
    رفتن به قلعه دیده می‌شود. در مرکز شهر پارک خیابانی پولی و کافه‌های فراوان هست. مرکز گوری هموار است و
    پیاده‌گردی در آن راحت.
  route: >-
    از تفلیس به غرب روی E60 — ۸۶ کیلومتر، نزدیک یک ساعت و ده دقیقه در جادهٔ دوبانده و تند. ورودی شرقی
    گوری تابلوی روشن دارد؛ در مرکز، خیابان استالین را دنبال کنید که هر دو مکان نزدیک هم‌اند. پارک خیابانی
    در مرکز پولی است و در روز پر می‌شود، اما کوچه‌های فرعی آسان‌ترند. سوخت در ورودی شهر موجود است. خودروی
    اقتصادی در تمام سال کافی است.
he:
  name: מוזיאון המלחמה ואנדרטת הלוחמים בגורי
  short: >-
    מוזיאון קטן לגאורגים שנפלו במלחמת העולם השנייה, ואנדרטת לוחמי האבן שלמרגלות גבעת המבצר.
  body: >-
    **כמעט כל מי שמגיע לגורי הולך למוזיאון סטלין, אך לעיר יש היסטוריית מלחמה שנייה, שקטה יותר.** כמה דקות
    הליכה בשדרת סטלין מן המוזיאון הראשי עומד מוזיאון התהילה הצבאית הקטן. הוא מוקדש לגאורגים ששירתו במלחמת
    העולם השנייה: פנקסי שירות, מכתבים הביתה, תצלומים, עיטורים, מדים, ורשימות הכפרים שמהם יצאו גברים ולא
    שבו.


    התצוגה צנועה ומיושנת: ויטרינות זכוכית, כרטיסיות בכתב יד, ולעיתים קרובות בלי תרגום. הפשטות הזו היא
    שעושה את העבודה. אין כאן נרטיב לאומי אלא מאזן של מחוז אחד. כ-700 אלף איש יצאו מגאורגיה למלחמה וקרוב
    למחצית לא חזרו; את היחס הזה קל בהרבה לתפוס בחדר הזה מאשר בנתון סטטיסטי.


    מוכרת מן המוזיאון היא **אנדרטת גיבורי המלחמה הגאורגים** למרגלות גבעת המבצר: דמויות אבן גדולות היושבות
    בחצי מעגל, חסרות פנים, כאילו נשברו והורכבו מחדש. הן נוצרו בשנות השמונים בידי הפסל גיאורגי אוצ'יאורי
    לזכר חיילים גאורגים שנפלו במלחמה. העבודה חמורה, שותקת ואישית באופן חריג לאנדרטה צבאית סובייטית —
    קרובה לאבל יותר מאשר לניצחון.


    יחד הם דורשים חצי שעה ומשנים במידה ניכרת את צורת הביקור בגורי, במיוחד למי שזה עתה יצא ממוזיאון סטלין.
  tip: >-
    שעה מכסה את שניהם. המוזיאון קטן ולעיתים ריק; השילוט בעיקר בגאורגית וברוסית ומעט באנגלית, לכן קצת רקע
    מראש עוזר. האנדרטה בחוץ, בחינם ונגישה תמיד, ורואים אותה מן השביל העולה למבצר. במרכז יש חניה בתשלום
    ברחוב והרבה בתי קפה. מרכז גורי מישורי ונוח להליכה.
  route: >-
    צאו מטביליסי מערבה בכביש E60 — 86 ק״מ, כשעה ועשר דקות בכביש מהיר. הכניסה המזרחית לגורי משולטת היטב;
    במרכז לכו לפי שדרת סטלין, שם שני האתרים סמוכים. החניה ברחובות המרכז בתשלום ומתמלאת במשך היום, ברחובות
    הצדדיים קל יותר. דלק יש בכניסה לעיר. רכב חסכוני מספיק בכל ימות השנה.
ar:
  name: متحف المجد الحربي ونصب الحرب في غوري
  short: >-
    متحف صغير للجورجيين الذين قضوا في الحرب العالمية الثانية، ونصب المحاربين الحجريين أسفل تلة القلعة.
  body: >-
    **كل من يأتي غوري تقريباً يقصد متحف ستالين، لكن للمدينة تاريخ حرب ثانٍ أهدأ.** على بعد دقائق مشياً في
    جادة ستالين من المتحف الرئيسي يقوم متحف المجد الحربي الصغير. وهو مخصص للجورجيين الذين خدموا في الحرب
    العالمية الثانية: دفاتر خدمة، ورسائل إلى الأهل، وصور، وأوسمة، وبزّات، وقوائم بالقرى التي غادرها
    الرجال ولم يعودوا إليها.


    والعرض متواضع وقديم الطراز: خزائن زجاجية، وبطاقات بخط اليد، وغالباً بلا ترجمة. وهذه البساطة هي ما
    يجعله مؤثراً. فليست هنا رواية وطنية بل حساب منطقة واحدة. ذهب من جورجيا إلى الحرب نحو 700 ألف شخص، ولم
    يعد ما يقارب نصفهم؛ وإدراك هذه النسبة في هذه القاعة أسهل بكثير من إدراكها في رقم إحصائي.


    وأشهر من المتحف **نصب أبطال الحرب الجورجيين** عند سفح تلة القلعة: أشكال حجرية كبيرة جالسة في نصف
    دائرة، بلا وجوه، كأنها كُسّرت ثم أُعيد تركيبها. صنعها في ثمانينيات القرن الماضي النحات غيورغي
    أوتشياوري إحياءً لذكرى الجنود الجورجيين الذين سقطوا في الحرب. والعمل صارم صامت وشخصي على نحو غير
    مألوف في نصب عسكري سوفييتي؛ أقرب إلى الحداد منه إلى النصر.


    والاثنان معاً يستغرقان نصف ساعة ويغيّران شكل زيارة غوري تغييراً ملموساً، خصوصاً لمن خرج لتوّه من متحف
    ستالين.
  tip: >-
    ساعة تغطي الموقعين. المتحف صغير وخالٍ في الغالب؛ والبطاقات بالجورجية والروسية أساساً وقليل منها
    بالإنجليزية، فقليل من الخلفية المسبقة يساعد. والنصب في الهواء الطلق، مجاني ومتاح دائماً، ويُرى من درب
    الصعود إلى القلعة. وفي المركز وقوف مدفوع على الرصيف ومقاهٍ كثيرة. ووسط غوري مستوٍ ومريح للمشي.
  route: >-
    اتجه غرباً من تبليسي على الطريق E60 — 86 كم، نحو ساعة وعشر دقائق على طريق مزدوج سريع. ومدخل غوري
    الشرقي عليه لافتات واضحة؛ وفي المركز اتبع جادة ستالين حيث يقع الموقعان متجاورين. والوقوف على الرصيف
    في المركز مدفوع ويمتلئ نهاراً، أما الشوارع الجانبية فأيسر. والوقود متوفر عند مدخل المدينة. وسيارة
    اقتصادية تكفي على مدار السنة.
