ka:
  name: თრუსოს ხეობა
  short: >-
    თერგის აკვანი: ამოჩქეფილი მჟავე წყლები, ჟანგისფერი ტრავერტინი და ქართველთა და ოსთა ოდესღაც საერთო,
    დღეს დაცარიელებული კოშკიანი სოფლები.
  body: >-
    **თრუსოში მიწა თავად შიშინებს: მინერალური წყალი ხეობის ფსკერიდან ამოდის და ქვებს თეთრად, ნარინჯისფრად
    და ჟანგისფრად ღებავს.**


    ეს ის მაღალმთიანი, ღარისებრი ხეობაა, სადაც თერგი იბადება. იგი კობთან, ჯვრის უღელტეხილის ძირში იწყება
    და დასავლეთისკენ, კავკასიონის მთავარ ქედსა და ხოხის ქედს შორის მიემართება; ხეობა ყაზბეგის ეროვნული
    პარკის ნაწილია. ტყე აქ არ არის — მხოლოდ ბალახი, ნაშალი ქვა, მდინარის რუხი ტოტები და ქარი, რომელიც
    თითქმის არასოდეს წყდება.


    წყაროები ნახშირორჟანგით არის გაჯერებული. გაზი რომ გამოდის, წყალი თან წამოღებულ კირს ტოვებს და საუკუნეების
    განმავლობაში ტრავერტინს აგებს: დაბალ, მოთეთრო-რუხ საფეხურებსა და ბორცვებს, რომლებზეც რკინა ნარინჯისფერ
    ზოლებს ავლებს. საფოსტო ბარათის თეთრ კასკადს ნუ დაელოდებით — აქაური სურათი უფრო თავშეკავებული, უფრო
    უცნაური და სრულიად ნამდვილია. აბანოსთან პატარა მინერალური ტბა ბუყბუყებს; მისი ფერი ბალახის ფონზე თითქმის
    არაბუნებრივად კაშკაშებს.


    აქ ხალხი დიდი ხანია ცხოვრობს. 1771 წელს მოგზაურმა იოჰან ანტონ გიულდენშტედტმა ხეობაში 13 სოფელი დაითვალა,
    რომლებიც მაშინ არაგვის ერისთავებს ემორჩილებოდა. მოგვიანებით სოფლების რიცხვი 19-ს მიაღწია; ქართული
    და ოსური ოჯახები გვერდიგვერდ ცხოვრობდნენ, ქართულ ეკლესიებს შორის ოსური სალოცავებიც იდგა. 1991–1992
    წლების სამხრეთ ოსეთის ომმა და 2008 წლის ომმა ხეობა დააცარიელა. დღეს აქ სულ რამდენიმე ათეული ადამიანი
    ცხოვრობს, ისიც ძირითადად ზაფხულობით. ქეთრისში, აბანოსა და რესში ქვის კოშკები ჯერ კიდევ დგას უსახურავო
    სახლების თავზე, ხეობის დასავლეთ ბოლოსკენ კი, კლდის შვერილზე, ზაქაგორის ციხე გადმოჰყურებს. სამხრეთ
    ოსეთის დე ფაქტო ხელისუფლება ხეობაზე პრეტენზიას დღემდე აცხადებს — ამიტომაც დგას მის შესასვლელთან პოლიციის
    საგუშაგო.


    ნელა იარეთ. თრუსო მდუმარეა, მაგრამ ცარიელი არ არის: ყოველი უსახურავო სახლი ოდესღაც ვიღაცის ზამთარი
    იყო.
  tip: >-
    პასპორტი ან პირადობის მოწმობა თან იქონიეთ: ეს სასაზღვრო ზონაა, შესასვლელთან პოლიციის საგუშაგო დოკუმენტებს
    ამოწმებს და მათი მითითება საბოლოოა. სეზონი დაახლოებით ივნისიდან სექტემბრამდე გრძელდება; დანარჩენ დროს
    გზას თოვლი კეტავს. ხეობაში არც ჩრდილია, არც მაღაზია, არც ტუალეტი და არც საიმედო მობილური კავშირი —
    ქუდი, მზისგან დამცავი კრემი, ერთ კაცზე სულ მცირე ორი ლიტრი წყალი და საჭმელი სტეფანწმინდიდან წამოიღეთ.
    ბევრი მანქანას ხეობის შესასვლელთან ტოვებს და 10–12 კილომეტრს ფეხით გადის იქით-აქეთ — ადვილი, მაგრამ
    მთელი დღის გასეირნებაა. ახალ ეკლესიებსაც და ძველ სასაფლაოებსაც ერთნაირი მოწიწებით მოეპყარით.
  route: >-
    საქართველოს სამხედრო გზით (E117) ჯვრის უღელტეხილზე (2379 მ) გადადით და კობთან გადაუხვიეთ: თბილისიდან
    ხეობის შესასვლელამდე დაახლოებით 145 კილომეტრი და სამი საათია. იქიდან ხეობაში 10–15 კილომეტრიანი ხრეშიანი
    გზა მიდის — ქვიანი, ორმოიანი, რამდენიმე ფონით. სედანი ამ გზას ვერ გაივლის: საჭიროა მაღალი კლირენსი
    და, სასურველია, ოთხივე წამყვანი თვალი, ამიტომ ნამდვილი ჯიპი — ჩვენი ოფროუდ-კლასი — აირჩიეთ. ძლიერი
    წვიმის შემდეგ ფონებში წყალი სწრაფად მატულობს და გზა შეიძლება გაუვალი გახდეს. აბანოსა და ზაქაგორის
    მონაკვეთამდე მანქანით გაგრძელებას რეალურად 45–60 წუთი ემატება. ხეობაში ბენზინგასამართი არ არის — ავზი
    ფასანაურში ან გუდაურში შეავსეთ.
en:
  name: Truso Valley
  short: >-
    The treeless cradle of the Terek: fizzing mineral springs, rust-streaked travertine and the empty
    tower villages of a once-mixed Georgian and Ossetian valley.
  body: >-
    **In Truso the ground itself fizzes: mineral water wells up through the valley floor and stains the
    rocks white, orange and rust.**


    This is the high, U-shaped valley where the Terek is born. It opens near Kobi, just below the Jvari
    Pass, and runs west between the Main Caucasus and the Khokh Range, inside Kazbegi National Park. There
    is no forest here: only grass, scree, the grey braids of the river and a wind that rarely stops.


    The springs are rich in carbon dioxide. As the gas escapes, the water drops the lime it carries, and
    over centuries it has built travertine: low terraces and mounds of grey-white crust, striped orange
    with iron where the water runs off. Do not expect a white cascade from a postcard; this is subtler,
    stranger and entirely real. Near Abano a small mineral lake bubbles, its colour almost unnaturally
    bright against the grass.


    People have lived here for a long time. In 1771 the explorer Johann Anton Güldenstädt counted 13 villages,
    then ruled by the Eristavis of Aragvi. Later there were as many as 19, Georgian and Ossetian families
    side by side, with Ossetian shrines among the Georgian churches. The war in South Ossetia in 1991–92
    and the war of 2008 emptied them. Today only a few dozen people live in the valley, most of them just
    for the summer. In Ketrisi, Abano and Resi stone towers still stand over roofless houses, and Zakagori
    fortress watches from a rock spur towards the western end. The de facto South Ossetian authorities
    still claim the valley, which is why a police post guards its entrance.


    Walk it slowly. Truso is quiet, but it is not empty: every house without a roof was somebody's winter.
  tip: >-
    Carry a passport or ID: this is a border zone, the police post at the entrance checks documents, and
    their instructions are final. The season runs roughly from June to September; outside it, snow closes
    the track. There is no shade, shop, toilet or reliable phone signal anywhere in the valley, so bring
    a hat, sunscreen, at least two litres of water per person and food from Stepantsminda. Many visitors
    leave the car near the valley mouth and walk 10 to 12 km in and back, an easy but full day. Be respectful
    at the new churches and the old graveyards alike.
  route: >-
    Follow the Georgian Military Highway (E117) over the Jvari Pass (2,379 m) and turn off at Kobi: about
    145 km and three hours from Tbilisi to the mouth of the valley. From there a gravel track runs 10
    to 15 km up the valley, stony and rutted, with several river fords. A saloon car will not make it;
    you need real ground clearance and ideally four-wheel drive, so choose our offroad class. After heavy
    rain the fords rise fast and can become impassable. Driving on as far as the Abano and Zakagori section
    adds a realistic 45 to 60 minutes. There is no fuel in the valley: fill up in Pasanauri or Gudauri.
ru:
  name: Долина Трусо
  short: >-
    Безлесная колыбель Терека: шипучие минеральные источники, травертин в ржавых потёках и пустые башенные
    сёла, где бок о бок жили грузины и осетины.
  body: >-
    **В Трусо шипит сама земля: минеральная вода пробивается сквозь дно долины и окрашивает камни в белый,
    оранжевый и ржавый цвета.**


    Это высокая U-образная долина, где рождается Терек. Она открывается у Коби, чуть ниже Крестового перевала,
    и уходит на запад между Главным Кавказским и Хохским хребтами, в пределах Казбегского национального
    парка. Леса здесь нет: только трава, осыпи, серые рукава реки и ветер, который почти не стихает.


    Источники богаты углекислым газом. Когда газ улетучивается, вода отдаёт растворённую известь и за
    столетия выстроила из неё травертин: низкие террасы и бугры серо-белой корки, исполосованные оранжевым
    железом там, где стекает вода. Не ждите белого каскада с открытки: здесь всё тоньше, страннее и совершенно
    по-настоящему. У Абано бурлит маленькое минеральное озеро, почти неестественно яркое на фоне травы.


    Люди живут здесь давно. В 1771 году путешественник и исследователь Иоганн Антон Гюльденштедт насчитал
    13 сёл, которыми тогда владели арагвские эристави. Позже сёл было до 19: грузинские и осетинские семьи
    жили бок о бок, а среди грузинских церквей стояли осетинские святилища. Война в Южной Осетии 1991–92
    годов и война 2008 года опустошили их. Сегодня в долине живёт лишь несколько десятков человек, и большинство
    — только летом. В Кетриси, Абано и Реси каменные башни всё ещё стоят над домами без крыш, а ближе
    к западному концу долины со скального отрога смотрит крепость Закагори. Де-факто власти Южной Осетии
    по-прежнему претендуют на долину, поэтому у входа в неё стоит полицейский пост.


    Идите по ней медленно. Трусо тихая, но не пустая: каждый дом без крыши был чьей-то зимой.
  tip: >-
    Возьмите паспорт или удостоверение личности: это пограничная зона, полицейский пост у входа проверяет
    документы, и его указания не обсуждаются. Сезон — примерно с июня по сентябрь; в остальное время дорогу
    закрывает снег. Ни тени, ни магазина, ни туалета, ни надёжной связи в долине нет, так что возьмите
    шляпу, солнцезащитный крем, не меньше двух литров воды на человека и еду из Степанцминды. Многие оставляют
    машину у входа в долину и проходят 10–12 км вглубь и обратно — несложный, но полный день. Ведите себя
    уважительно и у новых церквей, и у старых кладбищ.
  route: >-
    По Военно-Грузинской дороге (E117) через Крестовый перевал (2379 м), затем поворот у Коби: около 145
    км и три часа от Тбилиси до входа в долину. Дальше 10–15 км вверх по долине идёт грунтовка — каменистая,
    в колеях, с несколькими бродами. Седан здесь не пройдёт: нужен настоящий клиренс и желательно полный
    привод, так что выбирайте наш класс «внедорожник». После сильного дождя вода в бродах быстро поднимается,
    и они могут стать непроходимыми. Если ехать дальше, до участка Абано — Закагори, прибавьте реалистичные
    45–60 минут. Заправок в долине нет: заправьтесь в Пасанаури или Гудаури.
fa:
  name: درهٔ تروسو
  short: >-
    گهوارهٔ بی‌درخت رود ترک: چشمه‌های معدنی جوشان، تراورتن رگه‌دار به رنگ زنگ و روستاهای برج‌دارِ خالی،
    جایی که روزی گرجی‌ها و اوستی‌ها کنار هم می‌زیستند.
  body: >-
    **در تروسو خودِ زمین می‌جوشد: آب معدنی از کف دره بیرون می‌زند و سنگ‌ها را سفید، نارنجی و به رنگ زنگ
    آهن درمی‌آورد.**


    اینجا درهٔ بلند و U شکلی است که رود ترک در آن زاده می‌شود. نزدیک کوبی، کمی پایین‌تر از گردنهٔ جواری،
    دهان می‌گشاید و میان رشته‌کوه اصلی قفقاز و رشته‌کوه خوخ رو به غرب کشیده می‌شود، در دل پارک ملی کازبگی.
    اینجا جنگلی نیست: تنها علف، سنگ‌ریزه‌های دامنه، رشته‌های خاکستری و درهم‌بافتهٔ رود و بادی که به‌ندرت
    از وزیدن می‌ایستد.


    چشمه‌ها سرشار از دی‌اکسید کربن‌اند. وقتی گاز آزاد می‌شود، آب، آهکِ همراهش را برجا می‌گذارد و در طول
    سده‌ها از آن تراورتن ساخته است: پله‌ها و پشته‌هایی کوتاه از پوسته‌ای سفید مایل به خاکستری که هرجا
    آب از رویشان سرازیر است، با آهن نارنجی خط خورده‌اند. انتظار آبشاری سپید مانند کارت‌پستال‌ها را نداشته
    باشید؛ این یکی ظریف‌تر، غریب‌تر و یکسره واقعی است. نزدیک آبانو دریاچهٔ معدنی کوچکی قُل‌قُل می‌کند
    که رنگش در برابر سبزی علف‌ها تقریباً به‌طرزی غیرطبیعی درخشان است.


    مردم از دیرباز اینجا زیسته‌اند. در ۱۷۷۱ یوهان آنتون گولدن‌اشتت، کاوشگر، ۱۳ روستا شمرد که آن زمان زیر
    فرمان اریستاوی‌های آراگوی بودند. بعدها شمارشان به ۱۹ رسید؛ خانواده‌های گرجی و اوستی کنار هم، با زیارتگاه‌های
    اوستی در میان کلیساهای گرجی. جنگ اوستیای جنوبی در ۱۹۹۱–۹۲ و جنگ ۲۰۰۸ این روستاها را خالی کرد. امروز
    تنها چند ده نفر در دره زندگی می‌کنند و بیشترشان فقط تابستان‌ها. در کتریسی، آبانو و رسی برج‌های سنگی
    هنوز بر فراز خانه‌های بی‌بام ایستاده‌اند و نزدیک انتهای غربی دره، دژ زاکاگوری از فراز دماغه‌ای سنگی
    دیده‌بانی می‌کند. مقام‌های بالفعلِ اوستیای جنوبی هنوز این دره را از آنِ خود می‌دانند و از همین رو
    پاسگاه پلیسی ورودی آن را می‌پاید.


    آرام در آن قدم بزنید. تروسو خاموش است، اما خالی نیست: هر خانهٔ بی‌بام زمستانِ کسی بوده است.
  tip: >-
    گذرنامه یا کارت شناسایی همراه داشته باشید: اینجا منطقهٔ مرزی است، پاسگاه پلیس در ورودی مدارک را بررسی
    می‌کند و دستورش حرف آخر است. فصل سفر تقریباً از ژوئن تا سپتامبر است؛ بیرون از آن، برف راه را می‌بندد.
    در سراسر دره نه سایه‌ای هست، نه مغازه، نه دستشویی و نه آنتن مطمئن، پس کلاه، کرم ضدآفتاب، دست‌کم دو
    لیتر آب برای هر نفر و خوراک از استپانتسمیندا بیاورید. بسیاری از بازدیدکنندگان خودرو را نزدیک دهانهٔ
    دره می‌گذارند و ۱۰ تا ۱۲ کیلومتر به درون دره می‌روند و برمی‌گردند؛ روزی آسان اما پر. هم کنار کلیساهای
    نو و هم در گورستان‌های کهن حرمت نگه دارید.
  route: >-
    جادهٔ نظامی گرجستان (E117) را دنبال کنید، از گردنهٔ جواری (۲,۳۷۹ متر) بگذرید و در کوبی از جاده جدا
    شوید: حدود ۱۴۵ کیلومتر و سه ساعت از تفلیس تا دهانهٔ دره. از آنجا راهی شنی ۱۰ تا ۱۵ کیلومتر دره را
    بالا می‌رود، سنگلاخ و شیارخورده، با چند گذر از رودخانه. سواری از پسش برنمی‌آید؛ ارتفاعی واقعی از سطح
    زمین و ترجیحاً چهارچرخ‌محرک لازم است، پس کلاس آفرود ما را برگزینید. پس از باران سنگین، آب در گذرگاه‌های
    رود زود بالا می‌آید و ممکن است عبور ناممکن شود. ادامهٔ رانندگی تا بخش آبانو و زاکاگوری، به‌طور واقع‌بینانه
    ۴۵ تا ۶۰ دقیقه به زمان سفر می‌افزاید. در دره سوختی نیست: در پاساناوری یا گودائوری باک را پر کنید.
he:
  name: עמק טרוסו
  short: >-
    עריסתו החשופה מעצים של נהר טרק: מעיינות מינרליים תוססים, טרוורטין מפוספס בגוני חלודה וכפרי מגדלים
    ריקים בעמק שבו חיו פעם גאורגים ואוסטים זה לצד זה.
  body: >-
    **בטרוסו האדמה עצמה תוססת: מים מינרליים מבעבעים מקרקעית העמק וצובעים את הסלעים בלבן, בכתום ובחלודה.**


    זהו העמק הגבוה, דמוי האות U, שבו נולד נהר טרק. הוא נפתח ליד קובי, מעט מתחת למעבר ג׳וארי, ונמשך מערבה
    בין רכס הקווקז הראשי לבין רכס חוך, בתחומי הפארק הלאומי קזבגי. אין כאן יער: רק עשב, מדרונות של אבנים
    מפולות, זרועותיו האפורות והקלועות של הנהר ורוח שכמעט אינה פוסקת.


    המעיינות עשירים בפחמן דו-חמצני. כשהגז משתחרר, המים משקיעים את הסיד שהם נושאים, ובמשך מאות שנים בנו
    ממנו טרוורטין: מדרגות ותלוליות נמוכות של קרום לבן-אפור, מפוספסות בכתום של ברזל במקומות שבהם המים זורמים.
    אל תצפו למפל לבן כמו בגלויה; זה עדין יותר, מוזר יותר ואמיתי לגמרי. ליד אבאנו מבעבע אגם מינרלי קטן,
    וצבעו בוהק על רקע העשב באופן שנראה כמעט לא טבעי.


    אנשים חיים כאן מזה זמן רב. ב-1771 מנה החוקר יוהאן אנטון גילדנשטט 13 כפרים, שנשלטו אז בידי האריסטאווים
    (השליטים) של אראגווי. מאוחר יותר היו כאן עד 19 כפרים: משפחות גאורגיות ואוסטיות זו לצד זו, ומקדשים
    אוסטיים בין הכנסיות הגאורגיות. המלחמה בדרום אוסטיה ב-1991–92 והמלחמה של 2008 רוקנו אותם. כיום חיים
    בעמק רק כמה עשרות אנשים, רובם בקיץ בלבד. בקטריסי, באבאנו וברסי עדיין עומדים מגדלי אבן מעל בתים חסרי
    גג, וסמוך לקצהו המערבי של העמק צופה מבצר זקגורי מראש שלוחת סלע. שלטונות הדה-פקטו של דרום אוסטיה עדיין
    תובעים את העמק, ולכן עמדת משטרה שומרת על הכניסה אליו.


    לכו בו לאט. טרוסו שקט, אבל אינו ריק: כל בית בלי גג היה פעם החורף של מישהו.
  tip: >-
    שאו איתכם דרכון או תעודת זהות: זה אזור גבול, עמדת המשטרה בכניסה בודקת מסמכים, והוראותיה סופיות. העונה
    נמשכת בערך מיוני עד ספטמבר; מחוצה לה השלג סוגר את הדרך. בשום מקום בעמק אין צל, חנות, שירותים או קליטה
    אמינה, אז הביאו כובע, קרם הגנה, לפחות שני ליטרים מים לאדם ואוכל מסטפנצמינדה. מבקרים רבים משאירים את
    הרכב ליד פתח העמק והולכים 10 עד 12 ק״מ פנימה וחזרה: יום קל אך מלא. שמרו על כבוד המקום, בכנסיות החדשות
    ובבתי הקברות הישנים כאחד.
  route: >-
    סעו בכביש הצבאי הגאורגי (E117) דרך מעבר ג׳וארי (2,379 מטר) ופנו בקובי: כ-145 ק״מ ושלוש שעות מטביליסי
    עד פתח העמק. משם עולה דרך עפר 10 עד 15 ק״מ במעלה העמק, אבנית ומלאת תלמים, עם כמה חציות נהר. רכב סדאן
    לא יעבור; צריך מרווח גחון אמיתי ורצוי הנעה כפולה, אז בחרו בקטגוריית השטח שלנו. אחרי גשם כבד מפלס המים
    בחציות הנהר עולה מהר, והן עלולות לחסום את הדרך. המשך הנסיעה עד קטע אבאנו וזקגורי מוסיף, באופן מציאותי,
    45 עד 60 דקות. אין דלק בעמק: תדלקו בפסנאורי או בגודאורי.
ar:
  name: وادي تروسو
  short: >-
    مهد نهر تيريك الخالي من الشجر: ينابيع معدنية فوّارة، وترافرتين مخطط بلون الصدأ، وقرى أبراج خاوية في
    وادٍ عاش فيه الجورجيون والأوسيتيون معاً ذات يوم.
  body: >-
    **في تروسو تفور الأرض نفسها: فالمياه المعدنية تنبثق من قاع الوادي وتصبغ الصخور بالأبيض والبرتقالي
    ولون الصدأ.**


    هذا هو الوادي العالي ذو المقطع على شكل حرف U، حيث يولد نهر تيريك. ينفتح قرب كوبي، أسفل ممر جفاري بقليل،
    ويمتد غرباً بين سلسلة القوقاز الرئيسية وسلسلة خوخ، داخل منتزه كازبيغي الوطني. لا غابة هنا: فقط العشب
    والركام الصخري وجدائل النهر الرمادية وريح قلّما تهدأ.


    الينابيع غنية بثاني أكسيد الكربون. وحين يفلت الغاز يُلقي الماء بما يحمله من كلس، وعلى مدى قرون بنى
    منه الترافرتين: مصاطب وروابي منخفضة من قشرة بيضاء رمادية، تخططها خيوط برتقالية من الحديد حيث يسيل
    الماء. لا تنتظر شلالاً أبيض كما في البطاقات البريدية؛ فهذا المشهد أرهف وأغرب، وحقيقي تماماً. وقرب
    أبانو تبقبق بحيرة معدنية صغيرة، لونها ساطع وسط العشب إلى حدّ يكاد يبدو غير طبيعي.


    سكن الناس هنا منذ زمن بعيد. ففي عام 1771 أحصى المستكشف يوهان أنطون غولدنشتيت 13 قرية كانت يومها تحت
    حكم إريستافي أراغفي. ثم بلغ عددها لاحقاً 19 قرية، تتجاور فيها العائلات الجورجية والأوسيتية، وتقوم
    المزارات الأوسيتية بين الكنائس الجورجية. ثم أفرغتها حرب أوسيتيا الجنوبية في 1991–92 وحرب 2008. واليوم
    لا يسكن الوادي سوى بضع عشرات من الناس، معظمهم في الصيف فقط. وفي كيتريسي وأبانو وريسي لا تزال أبراج
    حجرية قائمة فوق بيوت بلا سقوف، وقرب الطرف الغربي للوادي تحرس قلعة زاكاغوري المكان من فوق نتوء صخري.
    ولا تزال سلطات الأمر الواقع في أوسيتيا الجنوبية تطالب بالوادي، ولهذا يحرس مدخلَه مركزٌ للشرطة.


    امشِ فيه على مهل. تروسو هادئ، لكنه ليس خالياً: فكل بيت بلا سقف كان شتاءً لأحدهم.
  tip: >-
    احمل جواز سفرك أو بطاقة هويتك: هذه منطقة حدودية، ومركز الشرطة عند المدخل يفحص الوثائق، وتعليماته نهائية.
    يمتد الموسم تقريباً من يونيو إلى سبتمبر؛ وخارجه يغلق الثلج الطريق. لا ظلّ ولا متجر ولا مرحاض ولا تغطية
    هاتف موثوقة في أي مكان من الوادي، فأحضر قبعة وواقياً من الشمس ولترين من الماء على الأقل لكل شخص وطعاماً
    من ستيبانتسميندا. يترك كثير من الزوار السيارة قرب مدخل الوادي ويمشون 10 إلى 12 كم داخله ثم يعودون،
    في يوم سهل لكنه ممتلئ. واحترم المكان، عند الكنائس الجديدة والمقابر القديمة على السواء.
  route: >-
    اتبع الطريق العسكري الجورجي (E117) فوق ممر جفاري (2,379 متراً) وانعطف عند كوبي: نحو 145 كم وثلاث ساعات
    من تبليسي إلى مدخل الوادي. ومن هناك يصعد مسلك حصوي 10 إلى 15 كم في الوادي، حجري ومحفّر، مع عدة مخاضات
    في النهر. لن تجتازه سيارة سيدان؛ تحتاج إلى خلوص أرضي حقيقي ويُفضَّل دفع رباعي، فاختر فئة سيارات الطرق
    الوعرة لدينا. بعد المطر الغزير ترتفع المياه في المخاضات بسرعة وقد يتعذر عبورها. ومواصلة القيادة حتى
    مقطع أبانو وزاكاغوري تضيف بشكل واقعي 45 إلى 60 دقيقة. لا وقود في الوادي: تزوّد في باسانوري أو غوداوري.
