ka:
  name: დეზერტირების ბაზარი
  short: >-
    თბილისის უდიდესი აგრარული ბაზარი ცენტრალურ სადგურთან: ყველის რიგები, სუნელების გროვები, ჩამოკიდებული
    ჩურჩხელა და ხმამაღლა მოვაჭრე ქალაქი.
  body: >-
    **თუ გინდათ გაიგოთ, რას შეჭამს თბილისი დღეს საღამოს, დილის შვიდ საათზე აქ მოდით.** დეზერტირების ბაზარი
    ცენტრალური რკინიგზის სადგურის გვერდით რამდენიმე კვარტალზეა გაშლილი და ქალაქის უდიდესი აგრარული ბაზარია.
    სახელი, როგორც ამბობენ, პირველი ვაჭრებისგან შემორჩა: ჯარიდან გამოქცეული ჯარისკაცები აქ საკუთარ სამხედრო
    აღჭურვილობას ყიდდნენ. დეზერტირები დიდი ხანია გაქრნენ, სახელი კი დარჩა.


    მათ ადგილას ახლა მთელი საქართველოს საკუჭნაოა. დახლებს შორის ნახავთ:


    - **რძის ნაწარმს** — სულგუნს, ხაჭოს, არაჟანსა და მაწონს; თითქმის ყველა დახლთან ნაჭერს გასასინჯად გაგიწვდით

    - **სუნელებსა და მწვანილს** — უცხო სუნელს, ყვითელ ყვავილს, დაფნის ფოთოლს, აჯიკასა და მჟავე ტყემალს

    - **ჩურჩხელასა და ტყლაპს** — ძაფზე აცმულ, ფელამუშში ამოვლებულ კაკალს და თხლად გაშლილ ხილის ფენებს,
    სარეცხივით ჩამოკიდებულს


    ბაზარი ყველაზე ცოცხალი ზაფხულის ბოლოდან შემოდგომამდეა, როცა დედაქალაქის მიდამოების სოფლებიდან გამყიდველები
    მოსავლით ჩამოდიან. მის ირგვლივ მაღაზიები და ღია დახლებია, სადაც ყველაფერს იყიდით — ოქროდან ხალიჩამდე.


    ეს გაპრიალებული ადგილი არ არის. იატაკი სველია, მებარგულები ურიკებს ისეთ ღრიჭოებში აძვრენენ, სადაც
    გასასვლელი თითქოს არც არსებობს. სწორედ ესაა მთავარი. უბანს რეკონსტრუქციის გეგმები დაჰყურებს და ბაზრის
    ნაწილი შეიძლება ოდესმე დაანგრიონ — ამიტომ ნახეთ, სანამ ისევ ასე ჟღერს.
  tip: >-
    ნაღდი ფული წვრილი კუპიურებით წაიღეთ — ბევრი დახლი ბარათს არ იღებს. ზომიერი ვაჭრობა ჩვეულებრივი ამბავია,
    გასინჯვა კი უფასოა და არაფერს გავალდებულებთ. ყველაზე ცოცხალი და ყველაზე გრილი დილაა. ხალხმრავლობაში
    ჩანთა წინ დაიჭირეთ და ისეთი ფეხსაცმელი ჩაიცვით, რომლის დასველებაც არ დაგენანებათ. ყველი ვაკუუმში შეფუთული
    მგზავრობს საუკეთესოდ, სუნელები — დახურულ პარკებში: თუ თვითმფრინავით ბრუნდებით, გამყიდველს სწორედ ასე
    შეფუთვა სთხოვეთ. ხილისა და ბოსტნეულის ყველაზე დიდი არჩევანი ზაფხულის ბოლოს და შემოდგომაზეა.
  route: >-
    ბაზარი სადგურის მოედანთანაა, თავისუფლების მოედნიდან გზით დაახლოებით 5 კმ — თავისუფალ გზაზე 15 წუთი,
    პიკის საათებში ორჯერ მეტი. მისვლა ადვილია, გაჩერება — არა: ბაზრის ირგვლივ ქუჩები ურიკებით, მარშრუტკებითა
    და მეორე რიგში გაჩერებული მანქანებითაა გაჭედილი. ყველაზე მშვიდი ვარიანტია „თბილისი ცენტრალის“ ფასიანი
    პარკინგი სადგურთან, საიდანაც დახლებამდე ხუთიოდე წუთის სავალია. ნებისმიერი ეკონომ-კლასის მანქანა გამოდგება.
    გულახდილად, მეტრო უფრო მარტივია: სადგური „სადგურის მოედანი“ ბაზრის პირას გამოგიყვანთ.
en:
  name: Dezerter Bazaar
  short: >-
    Tbilisi's biggest farmers' market, beside the central station: rows of cheese, heaps of spices, strings
    of churchkhela and a city bargaining out loud.
  body: >-
    **If you want to know what Tbilisi will eat tonight, come here at seven in the morning.** Dezerter
    Bazaar, the Deserters' Market, spreads over several blocks beside the central railway station and
    is the largest agricultural market in the city. Its name, as the story goes, comes from its first
    traders: soldiers who had deserted and were selling off their army kit. The deserters are long gone;
    the name stayed.


    In their place is the whole of Georgia's larder. Between the stalls you will find:


    - **dairy**: sulguni, cottage cheese, sour cream and matsoni, with a sliver to taste offered at almost
    every counter

    - **spices and herbs**: blue fenugreek (utskho suneli), dried marigold, bay leaves, ajika and sour
    tkemali sauce

    - **churchkhela and tklapi**: walnuts threaded on string and dipped in thickened grape juice, and
    thin sheets of fruit leather hung up like washing


    The market is at its liveliest from late summer into autumn, when sellers come in from the villages
    around the capital with the harvest. Around its edges, shops and open stalls sell everything from
    gold to carpets.


    It is not a polished place. The floors are wet, and porters steer handcarts through gaps that do not
    seem to exist. That is the point. Redevelopment plans hang over the district, and part of the market
    may one day be torn down. See it while it still sounds like this.
  tip: >-
    Bring cash in small notes, as many stalls do not take cards. Gentle bargaining is normal; a taste
    costs nothing and commits you to nothing. Mornings are the liveliest and the coolest time to come.
    In the crush keep your bag in front of you, and wear shoes you don't mind getting wet. Cheese travels
    best vacuum-packed and spices in sealed bags, so if you are flying home, ask the vendor to pack them
    that way. Late summer and autumn bring the widest choice of fruit and vegetables.
  route: >-
    The market lies beside Station Square, about 5 km by road from Freedom Square: 15 minutes in clear
    traffic, twice that at rush hour. Getting there is easy; parking is not. The surrounding streets are
    clogged with handcarts, marshrutkas and double-parked cars. The calmest option is the paid car park
    of the Tbilisi Central complex at the railway station, about five minutes' walk from the stalls. Any
    economy car will do. Honestly, the metro is simpler: Station Square station brings you out practically
    at the market's edge.
ru:
  name: Дезертирский базар
  short: >-
    Крупнейший фермерский рынок Тбилиси у центрального вокзала: ряды сыра, горы специй, связки чурчхелы
    и город, торгующийся во весь голос.
  body: >-
    **Хотите знать, что Тбилиси будет есть сегодня вечером, — приходите сюда в семь утра.** Дезертирский
    базар раскинулся на несколько кварталов рядом с центральным железнодорожным вокзалом, и это самый
    большой продуктовый рынок города. Название, как гласит предание, пошло от первых торговцев: солдат-дезертиров,
    распродававших армейское снаряжение. Дезертиров давно нет, а имя осталось.


    Вместо них здесь вся кладовая Грузии. Между прилавками вы найдёте:


    - **молочные продукты**: сулугуни, творог, сметану и мацони, почти за каждым прилавком вам протянут
    ломтик на пробу

    - **специи и травы**: голубую пажитку (уцхо сунели), сушёные бархатцы, лавровый лист, аджику и кислый
    соус ткемали

    - **чурчхелу и тклапи**: грецкие орехи, нанизанные на нитку и обмакнутые в загущённый виноградный
    сок, и тонкие листы фруктовой пастилы, развешанные, как бельё


    Живее всего рынок с конца лета до осени, когда из сёл вокруг столицы съезжаются продавцы с урожаем.
    По его краям лавки и открытые прилавки торгуют всем подряд, от золота до ковров.


    Это не глянцевое место. Полы мокрые, а носильщики протискивают тележки в щели, которых, кажется, не
    существует. В этом весь смысл. Над кварталом нависают планы реконструкции, и когда-нибудь часть рынка
    могут снести. Посмотрите на него, пока он ещё звучит вот так.
  tip: >-
    Берите наличные мелкими купюрами: многие прилавки карты не принимают. Мягко торговаться здесь нормально;
    проба бесплатна и ни к чему не обязывает. Утро — самое оживлённое и прохладное время. В толчее держите
    сумку перед собой и надевайте обувь, которую не жалко промочить. Сыр лучше всего переносит дорогу
    в вакуумной упаковке, а специи — в запаянных пакетах, так что если летите домой, попросите продавца
    упаковать их именно так. Конец лета и осень дают самый широкий выбор фруктов и овощей.
  route: >-
    Рынок стоит у Вокзальной площади, примерно в 5 км по дороге от площади Свободы: 15 минут по свободным
    улицам и вдвое дольше в час пик. Доехать легко, припарковаться — нет. Окрестные улицы забиты тележками,
    маршрутками и машинами во втором ряду. Спокойнее всего встать на платную парковку комплекса «Тбилиси
    Сентрал» у вокзала, примерно в пяти минутах ходьбы от прилавков. Подойдёт любая машина эконом-класса.
    Но, по правде, на метро проще: станция «Вокзальная площадь» выводит практически к краю рынка.
fa:
  name: بازار دزرتیر
  short: >-
    بزرگ‌ترین بازار کشاورزان تفلیس، کنار ایستگاه مرکزی راه‌آهن: ردیف‌های پنیر، تپه‌های ادویه، رشته‌های
    چورچخلا و شهری که بلند بلند چانه می‌زند.
  body: >-
    **اگر می‌خواهید بدانید تفلیس امشب چه می‌خورد، ساعت هفت صبح به این‌جا بیایید.** بازار دزرتیر، یعنی
    «بازار فراریان»، کنار ایستگاه مرکزی راه‌آهن بر چند بلوک شهری گسترده است و بزرگ‌ترین بازار محصولات
    کشاورزی شهر به شمار می‌آید. به روایتی، نامش از نخستین فروشندگانش آمده: سربازانی که از خدمت گریخته
    بودند و تجهیزات نظامی‌شان را می‌فروختند. فراریان سال‌هاست رفته‌اند؛ نام مانده است.


    به جای آن‌ها، تمام آذوقه‌خانهٔ گرجستان این‌جاست. میان بساط‌ها این‌ها را پیدا می‌کنید:


    - **لبنیات**: پنیر سولوگونی، پنیر کاتیج، خامه ترش و ماتسونی، که تقریباً پشت هر پیشخوانی تکه‌ای برای
    چشیدن تعارفتان می‌کنند

    - **ادویه و سبزی‌های معطر**: شنبلیلهٔ آبی (اوتسخو سونلی)، گل جعفری خشک، برگ بو، آجیکا و سس ترش تکه‌مالی

    - **چورچخلا و تکلاپی**: گردوهایی که به نخ کشیده و در شیرهٔ غلیظ‌شدهٔ انگور فرو برده‌اند، و ورقه‌های
    نازک لواشک که مثل رخت روی بند آویخته‌اند


    بازار از اواخر تابستان تا پاییز از همیشه پرشورتر است، وقتی فروشندگان از روستاهای اطراف پایتخت با محصول
    تازه از راه می‌رسند. در حاشیه‌اش مغازه‌ها و بساط‌های روباز همه چیز می‌فروشند، از طلا تا فرش.


    این‌جا جای شسته‌رفته‌ای نیست. کف‌ها خیس است و باربرها گاری‌هایشان را از شکاف‌هایی رد می‌کنند که به
    نظر وجود ندارند. و اصل ماجرا همین است. طرح‌های نوسازی بر سر این محله سایه انداخته و شاید روزی بخشی
    از بازار تخریب شود. تا وقتی هنوز این هیاهو را دارد، ببینیدش.
  tip: >-
    پول نقد با اسکناس‌های خُرد همراه داشته باشید، چون بسیاری از بساط‌ها کارت نمی‌پذیرند. چانه‌زنیِ ملایم
    عادی است؛ چشیدن هزینه‌ای ندارد و شما را به چیزی متعهد نمی‌کند. صبح‌ها پرجنب‌وجوش‌ترین و خنک‌ترین وقت
    بازارند. در شلوغی کیفتان را جلوی خودتان نگه دارید و کفشی بپوشید که خیس شدنش برایتان مهم نباشد. پنیر
    در بسته‌بندی وکیوم و ادویه در کیسهٔ دربسته بهتر سفر می‌کنند؛ پس اگر با هواپیما برمی‌گردید، از فروشنده
    بخواهید همین‌طور بسته‌بندی کند. اواخر تابستان و پاییز بیشترین تنوع میوه و سبزی را دارد.
  route: >-
    بازار کنار میدان ایستگاه قرار دارد، حدود ۵ کیلومتر رانندگی از میدان آزادی: ۱۵ دقیقه در ترافیک روان
    و دو برابر آن در ساعت شلوغی. رسیدن آسان است؛ پارک کردن نه. خیابان‌های اطراف از گاری‌ها، مینی‌بوس‌های
    مارشروتکا و خودروهای دوبله‌پارک‌شده بند آمده‌اند. آرام‌ترین گزینه پارکینگ پولی مجموعهٔ «تفلیس سنترال»
    در ایستگاه راه‌آهن است، حدود پنج دقیقه پیاده تا بساط‌ها. هر خودروی اکونومی کار را راه می‌اندازد. راستش،
    مترو ساده‌تر است: ایستگاه «میدان ایستگاه» تقریباً شما را درست لب بازار پیاده می‌کند.
he:
  name: שוק דזרטר
  short: >-
    שוק האיכרים הגדול בטביליסי, ליד תחנת הרכבת המרכזית: שורות של גבינה, תלי תבלינים, מחרוזות צ'רצ'חלה
    ועיר שלמה שמתמקחת בקול רם.
  body: >-
    **אם אתם רוצים לדעת מה טביליסי תאכל הערב, בואו לכאן בשבע בבוקר.** שוק דזרטר, "שוק העריקים", משתרע
    על פני כמה בלוקים ליד תחנת הרכבת המרכזית, והוא שוק התוצרת החקלאית הגדול בעיר. לפי הסיפור, שמו בא מן
    הסוחרים הראשונים שלו: חיילים שערקו מן הצבא ומכרו את ציודם הצבאי. העריקים נעלמו מזמן; השם נשאר.


    במקומם עומד כאן כל המזווה של גאורגיה. בין הדוכנים תמצאו:


    - **מוצרי חלב**: גבינת סולוגוני, גבינת קוטג', שמנת חמוצה ומצוני, וכמעט בכל דוכן יציעו לכם פרוסה דקה
    לטעימה

    - **תבלינים ועשבי תיבול**: חילבה כחולה (אוצחו סונלי), פרחי טגטס מיובשים, עלי דפנה, אג'יקה ורוטב טקמלי
    חמוץ

    - **צ'רצ'חלה וטקלאפי**: אגוזי מלך המושחלים על חוט וטבולים במיץ ענבים מוסמך, ויריעות דקות של רסק פירות
    מיובש, מעין לדר, התלויות כמו כביסה


    השוק תוסס ביותר מסוף הקיץ ועד הסתיו, כשמוכרים מגיעים עם היבול מן הכפרים שסביב הבירה. בשוליו מוכרות
    חנויות ודוכנים פתוחים הכול, מזהב ועד שטיחים.


    זה אינו מקום מצוחצח. הרצפות רטובות, וסבלים מנווטים עגלות יד דרך מרווחים שנראה שאינם קיימים. בדיוק
    בזה העניין. תוכניות התחדשות עירונית מרחפות מעל הרובע, וייתכן שיום אחד ייהרס חלק מן השוק. ראו אותו
    כל עוד הוא נשמע כך.
  tip: >-
    הביאו מזומן בשטרות קטנים, כי דוכנים רבים אינם מקבלים כרטיסי אשראי. מיקוח עדין הוא דבר רגיל; טעימה
    לא עולה כלום ולא מחייבת לכלום. הבקרים הם הזמן התוסס והקריר ביותר. בצפיפות החזיקו את התיק לפניכם, ונעלו
    נעליים שלא אכפת לכם שיירטבו. גבינה נוסעת הכי טוב באריזת ואקום ותבלינים בשקיות אטומות, כך שאם אתם טסים
    הביתה, בקשו מהמוכר לארוז אותם כך. סוף הקיץ והסתיו מביאים את המבחר הרחב ביותר של פירות וירקות.
  route: >-
    השוק נמצא ליד כיכר התחנה, כ-5 ק"מ בכביש מכיכר החירות: 15 דקות כשהדרך פנויה, ופי שניים בשעות העומס.
    להגיע קל; לחנות לא. הרחובות מסביב חסומים בעגלות יד, במרשרוטקות (מיניבוסים) ובמכוניות שחונות בחניה
    כפולה. האפשרות הרגועה ביותר היא החניון בתשלום של מתחם "טביליסי סנטרל" בתחנת הרכבת, כחמש דקות הליכה
    מן הדוכנים. כל רכב חסכוני יתאים. בכנות, המטרו פשוט יותר: תחנת "כיכר התחנה" מוציאה אתכם כמעט בשולי
    השוק.
ar:
  name: سوق ديزيرتير
  short: >-
    أكبر سوق للمزارعين في تبليسي بجوار المحطة المركزية: صفوف من الأجبان، وأكوام من التوابل، وعناقيد من
    التشورتشخيلا، ومدينة تساوم بصوت عالٍ.
  body: >-
    **إن أردت أن تعرف ما ستأكله تبليسي الليلة، فتعالَ إلى هنا في السابعة صباحاً.** يمتد سوق ديزيرتير،
    أي "سوق الفارّين من الجندية"، على امتداد عدة شوارع بجوار محطة القطارات المركزية، وهو أكبر سوق للمنتجات
    الزراعية في المدينة. ويُروى أن اسمه جاء من أوائل تجّاره: جنود فرّوا من الخدمة وراحوا يبيعون عتادهم
    العسكري. رحل الفارّون منذ زمن طويل، وبقي الاسم.


    وقد حلّت محلّهم مؤونة جورجيا كلها. بين البسطات ستجد:


    - **الألبان**: جبن سولوغوني، والجبن القريش، والقشدة الحامضة، والماتسوني، ويُعرض عليك تقريباً عند كل
    منضدة شريحة رقيقة لتتذوقها

    - **التوابل والأعشاب**: الحلبة الزرقاء (أوتسخو سونيلي)، وزهر القطيفة المجفف، وورق الغار، والأجيكا،
    وصلصة التكيمالي الحامضة

    - **التشورتشخيلا والتكلابي**: جوز منظوم في خيط ومغموس في عصير عنب مكثّف، وصفائح رقيقة من هريس الفاكهة
    المجفف، تشبه قمر الدين، معلقة كالغسيل


    يبلغ السوق ذروة حيويته من أواخر الصيف حتى الخريف، حين يفد الباعة من القرى المحيطة بالعاصمة بمحاصيلهم.
    وعلى أطرافه تبيع المتاجر والبسطات المكشوفة كل شيء، من الذهب إلى السجاد.


    ليس مكاناً مصقولاً. الأرضيات مبللة، والحمّالون يدفعون عرباتهم عبر فجوات لا يبدو أنها موجودة. وهنا
    بيت القصيد. فخطط إعادة التطوير تحوم فوق الحي، وقد يُهدم جزء من السوق يوماً ما. فاذهب لتراه ما دام
    يضج بهذا الصوت.
  tip: >-
    احمل نقوداً بفئات صغيرة، فكثير من البسطات لا يقبل البطاقات. المساومة اللطيفة أمر عادي؛ والتذوق لا
    يكلّف شيئاً ولا يُلزمك بشيء. الصباح أكثر الأوقات حيوية وأبردها. في الزحام أبقِ حقيبتك أمامك، وانتعل
    حذاءً لا يضيرك أن يبتل. يسافر الجبن على أفضل وجه مفرّغاً من الهواء، والتوابل في أكياس محكمة الإغلاق،
    فإن كنت عائداً بالطائرة فاطلب من البائع أن يغلّفها كذلك. أواخر الصيف والخريف تأتي بأوسع تشكيلة من
    الفاكهة والخضار.
  route: >-
    يقع السوق بجوار ساحة المحطة، على بعد نحو 5 كم بالطريق من ساحة الحرية: 15 دقيقة حين تكون الطرق خالية،
    وضعفها في ساعة الذروة. الوصول سهل، أما الوقوف فلا. فالشوارع المحيطة مكتظة بعربات اليد وحافلات الماشروتكا
    الصغيرة والسيارات المركونة صفاً ثانياً. أهدأ الخيارات موقف مجمع "تبليسي سنترال" المدفوع عند محطة القطارات،
    على بعد نحو خمس دقائق مشياً من البسطات. تكفي أي سيارة اقتصادية. لكن المترو، بصراحة، أبسط: محطة "ساحة
    المحطة" تُخرجك عملياً عند طرف السوق.
