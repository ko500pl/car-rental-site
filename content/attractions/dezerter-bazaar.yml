ka:
  name: დეზერტირების ბაზარი
  short: >-
    თბილისის მთავარი სასურსათო ბაზარი ვაგზალთან — ჩურჩხელა, სუნელები, გუდის ყველი და ქალაქის ნამდვილი
    ყოველდღიურობა.
  body: >-
    **თბილისი საჭმელს აქ ყიდულობს და არა სუპერმარკეტში.** დეზერტირების ბაზარი ცენტრალურ რკინიგზის სადგურსა
    და წინამძღვრიშვილის ქუჩას შორის რამდენიმე კვარტალზეა გადაჭიმული. სახელი 1920-იანი წლებიდან მოდის,
    როცა ჯარიდან გამოქცეული დეზერტირები აქ საკუთარ აღჭურვილობას ჰყიდდნენ — მეტსახელი ისე მიეკრა, რომ ოფიციალურ
    სახელზე მეტად დამკვიდრდა.


    დღეს ეს ქალაქის მთავარი სასურსათო ბაზარია და საუკეთესო ადგილი ქართული სამზარეულოს ინგრედიენტების გასაცნობად:


    - **ყველის რიგები** — გუდის ყველი, სულგუნი, შებოლილი და შემწვარი ვერსიები, გასინჯვა თითქმის ყველგან
    შეიძლება

    - **სუნელების დახლები** — უცხო სუნელი, ყვითელი ყვავილი, აჯიკა და წონით დაფასოებული ნარევები

    - **ჩურჩხელა და ტყლაპი** — ფერადი მტევნებივით ჩამოკიდებული, გლეხური წარმოების

    - სეზონური ხილ-ბოსტნეული მთელი საქართველოდან, მაწონი, თაფლი, მწნილები


    ბაზრობა დილის შვიდიდან საღამოს ექვსამდე მუშაობს, ყოველდღე. ეს გაპრიალებული ტურისტული ატრაქცია არ არის
    — იატაკი სველია, დახლებს შორის ურიკები მოძრაობს და სწორედ ამიტომ ღირს ნახვად. დილაობით ყველაზე ცოცხალია.
    უბანს რეკონსტრუქცია ემუქრება, ასე რომ, ძველი ბაზრის ატმოსფერო შეიძლება დიდხანს აღარ დარჩეს.
  tip: >-
    ნაღდი ფული წამოიღე, წვრილი კუპიურებით — ბარათს დახლების უმეტესობა არ იღებს. ვაჭრობა ზომიერად მიღებულია.
    გასინჯვა შესთავაზე-თუ-არა ჩვეულებრივი პრაქტიკაა, მაგრამ ყიდვის ვალდებულებას არ ნიშნავს. ჩანთას თვალი
    ადევნე — ხალხმრავლობაა. ტუალეტი ბაზრის ტერიტორიაზეა, სიმბოლური საფასურით. სუვენირად ვაკუუმში შეფუთული
    ყველი და სუნელები კარგად მგზავრობს.
  route: >-
    ბაზარი ვაგზლის მოედანთანაა, ცენტრიდან (თავისუფლების მოედნიდან) 3–4 კმ — საცობის გარეშე 15 წუთი, პიკის
    საათებში ორჯერ მეტი. მანქანით მისვლის მთავარი თავსატეხი პარკინგია: ბაზრის ირგვლივ ქუჩები ურიკებით,
    მიკროავტობუსებითა და მეორე რიგში გაჩერებული მანქანებითაა გადაჭედილი. ყველაზე მშვიდი ვარიანტია „თბილისი
    ცენტრალის" სავაჭრო ცენტრის ფასიანი პარკინგი სადგურთან, იქიდან ბაზრამდე ხუთი წუთია ფეხით. ეკონომ-კლასის
    მანქანა საკმარისია; მეტრო „სადგურის მოედანი" პირდაპირ ბაზართან გადის — ხშირად ეს უმარტივესი გზაა.
en:
  name: Dezerter Bazaar
  short: >-
    Tbilisi's main food market by the railway station — churchkhela, spices, guda cheese and the city's
    real everyday life.
  body: >-
    **Tbilisi buys its food here, not at the supermarket.** The Dezerter Bazaar sprawls across several
    blocks between the central railway station and Tsinamdzghvrishvili Street. The name dates to the early
    1920s, when deserting soldiers sold off their kit here — the nickname stuck so hard it outlived every
    official name since.


    Today this is the city's main food market and the best single place to meet the ingredients of Georgian
    cooking:


    - **The cheese rows** — guda, sulguni, smoked and fried varieties, with tastings offered at almost
    every counter

    - **Spice stalls** — blue fenugreek (utskho suneli), dried marigold, ajika pastes and mixes sold by
    weight

    - **Churchkhela and tklapi** — hanging in coloured bunches, village-made

    - Seasonal fruit and vegetables from all over Georgia, matsoni, honey and pickles


    The market runs daily from about seven in the morning to six in the evening. It is not a polished
    tourist attraction — floors are wet, handcarts barge between stalls — and that is exactly why it is
    worth seeing. Mornings are liveliest. Redevelopment plans hang over the district, so the old-market
    atmosphere may not last forever.
  tip: >-
    Bring cash in small notes — most stalls do not take cards. Mild haggling is accepted. Tastings are
    offered freely and carry no obligation to buy. Watch your bag in the crush. There are toilets on the
    market grounds for a token fee. Vacuum-packed cheese and bagged spices travel well as souvenirs; ask
    vendors to seal them.
  route: >-
    The bazaar sits by Station Square, 3–4 km from Freedom Square — 15 minutes without traffic, double
    that at rush hour. Parking is the real puzzle: the surrounding streets are jammed with handcarts,
    marshrutkas and double-parked cars. The calmest option is the paid car park of the Tbilisi Central
    mall at the railway station, five minutes' walk from the stalls. An economy car is fine; the Station
    Square metro stop opens practically into the market, and is often the easiest way in.
ru:
  name: Дезертирский базар
  short: >-
    Главный продовольственный рынок Тбилиси у вокзала — чурчхела, специи, сыр гуда и настоящая повседневная
    жизнь города.
  body: >-
    **Тбилиси покупает еду здесь, а не в супермаркете.** Дезертирский базар раскинулся на несколько кварталов
    между центральным железнодорожным вокзалом и улицей Цинамдзгвришвили. Название идёт из начала 1920-х,
    когда дезертиры распродавали здесь армейское снаряжение, — прозвище прижилось так прочно, что пережило
    все официальные названия.


    Сегодня это главный продуктовый рынок города и лучшее место, чтобы познакомиться с ингредиентами грузинской
    кухни:


    - **сырные ряды** — гуда, сулугуни, копчёные и жареные варианты, попробовать дают почти у каждого
    прилавка

    - **лавки специй** — уцхо-сунели, сушёные бархатцы (имеретинский шафран), аджика и смеси на развес

    - **чурчхела и тклапи** — висят цветными гроздьями, деревенского производства

    - сезонные фрукты и овощи со всей Грузии, мацони, мёд, соленья


    Рынок работает ежедневно примерно с семи утра до шести вечера. Это не прилизанная туристическая достопримечательность
    — полы мокрые, между рядами протискиваются тележки, — и именно поэтому сюда стоит прийти. Живее всего
    по утрам. Над кварталом висят планы реконструкции, так что атмосфера старого базара может не продержаться
    долго.
  tip: >-
    Берите наличные мелкими купюрами — карты на большинстве прилавков не принимают. Умеренный торг уместен.
    Дегустации предлагают охотно, и они ни к чему не обязывают. В толчее следите за сумкой. Туалеты на
    территории рынка, за символическую плату. Сыр в вакууме и специи в пакетах отлично переносят дорогу
    — попросите продавца запаять.
  route: >-
    Базар стоит у Вокзальной площади, в 3–4 км от площади Свободы — 15 минут без пробок, в час пик вдвое
    дольше. Главная головоломка — парковка: окрестные улицы забиты тележками, маршрутками и машинами во
    втором ряду. Самый спокойный вариант — платный паркинг торгового центра «Тбилиси Централ» у вокзала,
    оттуда пять минут пешком до рядов. Машины эконом-класса достаточно; станция метро «Вокзальная площадь»
    выходит практически на рынок и часто оказывается самым простым способом добраться.
fa:
  name: بازار دزرتر
  short: بازار اصلی خوراک تفلیس کنار ایستگاه راه‌آهن — چورچخلا، ادویه، پنیر گودا و زندگی روزمرهٔ واقعی
    شهر.
  body: >-
    **تفلیس خوراکش را اینجا می‌خرد، نه در سوپرمارکت.** بازار دزرتر چند بلوک را میان ایستگاه مرکزی راه‌آهن
    و خیابان تسینامدزغوریشویلی پر کرده است. نام از اوایل دههٔ ۱۹۲۰ می‌آید، وقتی سربازان فراری تجهیزات
    خود را اینجا می‌فروختند — لقبی که چنان چسبید که از همهٔ نام‌های رسمی بعدی بیشتر عمر کرد.


    امروز این بازارِ اصلی مواد غذایی شهر است و بهترین جای آشنایی با مواد آشپزی گرجی:


    - **ردیف پنیرها** — گودا، سولگونی، دودی و سرخ‌شده؛ تقریباً هر پیشخوانی چشیدن تعارف می‌کند

    - **بساط ادویه** — شنبلیلهٔ آبی (اوتسخو سونلی)، گل جعفری خشک، آجیکا و مخلوط‌های کیلویی

    - **چورچخلا و تکلاپی** — خوشه‌خوشه و رنگارنگ آویزان، کار روستا

    - میوه و سبزی فصل از سراسر گرجستان، ماست ماتسونی، عسل و ترشی‌ها


    بازار هر روز از حدود هفت صبح تا شش عصر برپاست. جاذبه‌ای صیقل‌خورده و توریستی نیست — کف خیس است و چرخ‌دستی‌ها
    لابه‌لای بساط‌ها راه باز می‌کنند — و درست به همین دلیل دیدنی است. صبح‌ها زنده‌ترین وقت است. طرح‌های
    نوسازی بالای سر محله است؛ حال‌وهوای بازار قدیمی شاید چندان دوام نیاورد.
  tip: >-
    پول نقد و اسکناس خرد بیاورید — بیشتر بساط‌ها کارت نمی‌گیرند. چانه‌زدن ملایم پذیرفته است. چشیدن رایگان
    تعارف می‌شود و تعهدی به خرید نمی‌آورد. در شلوغی مواظب کیفتان باشید. سرویس بهداشتی در محوطهٔ بازار
    با بهای نمادین هست. پنیر وکیوم‌شده و ادویهٔ بسته‌بندی سوغات خوبی است و خوب سفر می‌کند — از فروشنده
    بخواهید ببندد.
  route: >-
    بازار کنار میدان ایستگاه است، ۳ تا ۴ کیلومتر از میدان آزادی — بی‌ترافیک ۱۵ دقیقه و در ساعت شلوغی دو
    برابر. معمای اصلی پارک است: خیابان‌های اطراف پر از چرخ‌دستی، مینی‌بوس و خودروهای دوبله‌پارک است. آرام‌ترین
    گزینه پارکینگ پولی مرکز خرید «تفلیس سنترال» کنار ایستگاه راه‌آهن است؛ از آنجا تا بساط‌ها پنج دقیقه
    پیاده است. خودروی اقتصادی کافی است؛ ایستگاه متروی «میدان ایستگاه» عملاً داخل بازار باز می‌شود و اغلب
    ساده‌ترین راه رسیدن است.
he:
  name: שוק דזרטר
  short: שוק המזון הראשי של טביליסי ליד תחנת הרכבת — צ'ורצ'חלה, תבלינים, גבינת גודה וחיי היומיום האמיתיים
    של העיר.
  body: >-
    **טביליסי קונה את האוכל שלה כאן, לא בסופרמרקט.** שוק דזרטר משתרע על פני כמה רחובות בין תחנת הרכבת
    המרכזית לרחוב צינמדזגברישווילי. השם נולד בראשית שנות העשרים של המאה הקודמת, כשחיילים עריקים מכרו כאן
    את הציוד שלהם — הכינוי נדבק כל כך חזק שהאריך ימים מכל שם רשמי שבא אחריו.


    היום זהו שוק המזון הראשי של העיר והמקום הטוב ביותר להכיר את חומרי הגלם של המטבח הגאורגי:


    - **שורות הגבינות** — גודה, סולגוני, מעושנות ומטוגנות; כמעט בכל דוכן מציעים לטעום

    - **דוכני התבלינים** — חילבה כחולה (אוצחו סונלי), ציפורני חתול מיובשות, אג'יקה ותערובות במשקל

    - **צ'ורצ'חלה וטקלאפי** — תלויים באשכולות צבעוניים, תוצרת כפרית

    - פירות וירקות עונתיים מכל גאורגיה, מצוני, דבש וחמוצים


    השוק פועל יום-יום משבע בבוקר בערך עד שש בערב. זו לא אטרקציה תיירותית מלוטשת — הרצפות רטובות ועגלות
    יד נדחפות בין הדוכנים — ובדיוק בגלל זה שווה לבוא. הבקרים הם השעות התוססות ביותר. מעל הרובע מרחפות
    תוכניות פיתוח, כך שאווירת השוק הישן אולי לא תישאר לנצח.
  tip: >-
    הביאו מזומן בשטרות קטנים — רוב הדוכנים לא מקבלים כרטיס. מיקוח מתון מקובל. טעימות מציעים בנדיבות והן
    לא מחייבות קנייה. שמרו על התיק בצפיפות. יש שירותים בשטח השוק בתשלום סמלי. גבינה בוואקום ותבלינים ארוזים
    נוסעים מצוין כמזכרות — בקשו מהמוכר לאטום.
  route: >-
    השוק שוכן ליד כיכר התחנה, 3–4 ק"מ מכיכר החירות — רבע שעה בלי פקקים, כפול בשעות העומס. החידה האמיתית
    היא החניה: הרחובות מסביב גדושים עגלות, מרשרוטקות ומכוניות בחניה כפולה. האפשרות הרגועה ביותר היא החניון
    בתשלום של קניון טביליסי סנטרל שליד תחנת הרכבת, חמש דקות הליכה מהדוכנים. רכב חסכוני מספיק בהחלט; תחנת
    המטרו "כיכר התחנה" נפתחת כמעט לתוך השוק, ולעיתים קרובות זו הדרך הקלה ביותר להגיע.
ar:
  name: سوق ديزيرتر
  short: سوق الطعام الرئيسي في تبليسي قرب محطة القطار — تشورتشخيلا وتوابل وجبن غودا وحياة المدينة اليومية
    الحقيقية.
  body: >-
    **تبليسي تشتري طعامها من هنا لا من السوبرماركت.** يمتد سوق ديزيرتر على عدة مربعات سكنية بين محطة القطار
    المركزية وشارع تسينامدزغفريشفيلي. والاسم يعود إلى مطلع عشرينيات القرن الماضي حين كان الجنود الفارّون
    من الخدمة يبيعون عتادهم هنا — ولصق اللقب حتى عمّر أطول من كل الأسماء الرسمية التي تلته.


    اليوم هذا هو سوق الغذاء الرئيسي في المدينة، وأفضل مكان واحد للتعرف على مكونات المطبخ الجورجي:


    - **صفوف الجبن** — غودا وسولغوني وأنواع مدخنة ومقلية، والتذوق معروض عند كل بسطة تقريباً

    - **بسطات التوابل** — الحلبة الزرقاء (أوتسخو سونيلي) والقطيفة المجففة ومعجون الأجيكا وخلطات تُباع
    وزناً

    - **التشورتشخيلا والتكلابي** — معلقة عناقيد ملونة من صنع القرى

    - فواكه وخضار الموسم من كل جورجيا، والماتسوني والعسل والمخللات


    يعمل السوق يومياً من نحو السابعة صباحاً حتى السادسة مساءً. ليس معلماً سياحياً مصقولاً — فالأرض مبتلة
    وعربات اليد تشق طريقها بين البسطات — ولهذا بالضبط يستحق الزيارة. الصباح أنشط الأوقات. وخطط إعادة التطوير
    تخيّم على الحي، فقد لا تدوم أجواء السوق القديم طويلاً.
  tip: >-
    خذ نقوداً بفئات صغيرة — أغلب البسطات لا تقبل البطاقات. المساومة الخفيفة مقبولة. التذوق يُعرض بسخاء
    ولا يلزمك بالشراء. انتبه لحقيبتك في الزحام. توجد دورات مياه داخل السوق برسم رمزي. الجبن المفرّغ من
    الهواء والتوابل المعبأة هدايا تسافر جيداً — اطلب من البائع إحكام إغلاقها.
  route: >-
    السوق عند ساحة المحطة، على بعد 3 إلى 4 كم من ساحة الحرية — ربع ساعة من دون زحام وضعفها في ساعة الذروة.
    اللغز الحقيقي هو الموقف: الشوارع المحيطة مكتظة بعربات اليد والميكروباصات وسيارات تقف في صف ثانٍ. الخيار
    الأهدأ هو الموقف المدفوع لمركز «تبليسي سنترال» التجاري عند محطة القطار، ومنه خمس دقائق مشياً إلى البسطات.
    سيارة اقتصادية تكفي؛ ومحطة مترو «ساحة المحطة» تفتح عملياً داخل السوق، وكثيراً ما تكون أسهل طريقة للوصول.
