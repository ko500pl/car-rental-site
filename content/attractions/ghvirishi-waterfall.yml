ka:
  name: ღვირიშის ჩანჩქერი
  short: >-
    ქვედა ღვირიშის ქვემოთ მთის ნაკადი მაღალი კლდიდან ვიწრო ხევში ეშვება — ცაგერის ირგვლივ ყველაზე ხმაურიანი
    და ადვილად მისადგომი გაჩერება.
  body: >-
    **სოფელ ქვედა ღვირიშის ქვემოთ მიწა უცებ წყდება და მთის ნაკადი კიდეზე გადადის.**


    წყალი მაღალი კლდიდან ღრმა, ვიწრო ხევში ეშვება და ძირში, კლდოვან ღრმულში ეცემა, სადაც პატარა აუზად
    გროვდება და შემდეგ გზას აგრძელებს. ორივე მხრიდან ციცაბო კლდეები გარს გერტყმით; ძირში რომ შემობრუნდებით,
    ხეობა იხსნება და ლეჩხუმის ფართო ველი მოჩანს. ჩანჩქერი ცაგერის მუნიციპალიტეტში, ზღვის დონიდან დაახლოებით
    625 მეტრზე მდებარეობს.


    მისი სიმაღლე სანდო წყაროში არსად წერია და ჩვენც არ მოვიგონებთ. სამაგიეროდ, ხმა შეგიძლიათ გაზომოთ.
    მაისსა და ივნისში, როცა ნაკადს თოვლის ნადნობი კვებავს, ჩანჩქერი ხევს გუგუნითა და ცივი შხეფებით ავსებს;
    ზაფხულის ბოლოს იგი თხელდება და წყნარდება, თუმცა მოკლე გასეირნებად მაინც ღირს.


    ღვირიშის ჩანჩქერს წელიწადში ათასობით ადამიანი სტუმრობს და ის პატარა ადგილობრივი მარშრუტის ღერძია:
    ლაჯანურის წყალსაცავი, დეხვირის ციხე და ქალაქი ცაგერი დაახლოებით ათი კილომეტრის რადიუსშია. მოდით ერთი
    საათით, დადექით იქ, სადაც ნისლი გწვდებათ, და წადით მხოლოდ მაშინ, როცა სახელო დაგისველდებათ.
  tip: >-
    შესვლა უფასოა და ჩანჩქერი მთელი წლის განმავლობაში მისადგომია, მაგრამ სოფლიდან დამავალი მიწის ბილიკი
    ზოგიერთ მონაკვეთზე სიფრთხილეს მოითხოვს: ჩაიცვით მოუცურებელი ფეხსაცმელი და არა სანდლები, ძირთან, სველ
    ქვებზე კი ბავშვებს თვალი არ მოაშოროთ. წყალი ყველაზე უხვად მაისსა და ივნისშია; მშრალ აგვისტოში შეიძლება
    წვრილ ზოლად იქცეს. ვიზიტს დაახლოებით ერთი საათი სჭირდება. ჩანჩქერთან კაფე და საპირფარეშო არ არის,
    ამიტომ ჭამა და საწვავის შევსება ცაგერში მოასწარით. შხეფები მოლოდინზე შორს აღწევს: ფოტოაპარატს გაუფრთხილდით
    და თბილ დღესაც თხელი ზედა სამოსი წაიღეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთით ქუთაისამდე იარეთ, შემდეგ Sh16-ით, ქუთაისი–ალპანის გზით, ჩრდილოეთით
    გაემართეთ. დაახლოებით 50 კილომეტრის შემდეგ, სოფელ ალპანაში, მარცხნივ, ქვედა ღვირიშისკენ მიმავალ ადგილობრივ
    გზაზე გადაუხვიეთ — სოფლამდე დაახლოებით 4 კილომეტრია, ბოლო მონაკვეთი კი შეიძლება ხრეშიანი იყოს. მანქანა
    სოფელში დატოვეთ და ბილიკით ჩანჩქერის ძირამდე ჩადით. მთელი გზა დაახლოებით 302 კილომეტრია და 4 საათსა
    და 40 წუთს გრძელდება. გზა ძირითადად მოასფალტებულია და ეკონომკლასის მანქანაც სრულიად საკმარისია. ახლომდებარე
    ცაგერში საწვავიც არის და საჭმელიც; ვიზიტი ლაჯანურის წყალსაცავსა და დეხვირის ციხეს შეუთავსეთ.
en:
  name: Ghvirishi Waterfall
  short: >-
    Below Lower Ghvirishi a stream leaps from a high rock into a narrow ravine: the loudest, easiest stop
    on a Tsageri day loop.
  body: >-
    **Below the village of Kveda Ghvirishi the ground simply stops, and a mountain stream goes over the
    edge.**


    The water falls from a high rock face into a deep, narrow ravine and lands in a rocky hollow at its
    foot, where it gathers into a small pool before running on. Steep cliffs close in on either side;
    turn round at the base and the gorge opens onto the wide valley of Lechkhumi. The falls lie at about
    625 metres, in Tsageri Municipality.


    No reliable height has ever been published, and we will not invent one. What you can measure is the
    sound. In May and June, when snowmelt feeds the stream, the fall fills the ravine with noise and cold
    spray; by late summer it thins to something gentler, still worth the short walk.


    Ghvirishi draws thousands of visitors a year and anchors a small local circuit: the Lajanuri reservoir,
    Dekhviri Fortress and the town of Tsageri all lie within about ten kilometres. Come for an hour, stand
    where the mist reaches you, and leave only once your sleeve is wet.
  tip: >-
    Entry is free and the site is open all year, but the path down from the village is unpaved and some
    sections need care: wear shoes with grip, not sandals, and keep children close on the wet rocks near
    the base. Flow is fullest in May and June; in a dry August it can be a thin ribbon. Allow about an
    hour. There are no cafés or toilets at the falls, so eat and refuel in Tsageri. Spray carries further
    than you expect: protect your camera, and bring a light layer even on a warm day.
  route: >-
    From Tbilisi take the E60/S1 west to Kutaisi, then head north on the Sh16, the Kutaisi–Alpana road.
    After about 50 km, at the village of Alpana, turn left onto the local road for Kveda (Lower) Ghvirishi,
    some 4 km on; the last stretch may be gravel. Park in the village and follow the footpath down to
    the base of the falls. The whole drive is about 302 km and takes roughly 4 hours 40 minutes. The road
    is mostly paved and an economy car is perfectly adequate. Nearby Tsageri has fuel and food; combine
    the stop with the Lajanuri reservoir and Dekhviri Fortress.
ru:
  name: Водопад Гвириши
  short: >-
    Под Нижним Гвириши ручей срывается с высокой скалы в узкое ущелье: самая шумная и самая лёгкая остановка
    в однодневной петле вокруг Цагери.
  body: >-
    **Под селом Кведа-Гвириши земля просто обрывается — и горный поток уходит за край.**


    Вода падает с высокой скалы в глубокое узкое ущелье и обрушивается в каменистую чашу у подножия, где
    собирается в небольшой омут и бежит дальше. С обеих сторон теснятся отвесные скалы; обернитесь внизу
    — и ущелье распахнётся на широкую долину Лечхуми. Водопад находится на высоте около 625 метров, в
    Цагерском муниципалитете.


    Достоверная высота самого водопада нигде не опубликована, и выдумывать её мы не станем. Измерить здесь
    можно другое — звук. В мае и июне, когда ручей питают талые снега, водопад наполняет ущелье грохотом
    и холодной водяной пылью; к концу лета он истончается и становится мягче, но и тогда стоит короткой
    прогулки.


    Гвириши каждый год привлекает тысячи гостей и служит центром небольшого местного маршрута: Ладжанурское
    водохранилище, крепость Дехвири и городок Цагери — всё примерно в десяти километрах. Приезжайте на
    час, встаньте там, куда долетает водяная пыль, и уезжайте, только когда промокнет рукав.
  tip: >-
    Вход свободный, место открыто круглый год, но тропа от села вниз немощёная, и на некоторых участках
    нужна осторожность: наденьте обувь с цепкой подошвой, а не сандалии, и держите детей рядом на мокрых
    камнях у подножия. Полноводнее всего водопад в мае и июне; в засушливом августе он может превратиться
    в тонкую ленточку. Заложите около часа. У водопада нет ни кафе, ни туалетов, так что поесть и заправиться
    лучше в Цагери. Брызги летят дальше, чем кажется: защитите камеру и захватите лёгкую кофту даже в
    тёплый день.
  route: >-
    Из Тбилиси по E60/S1 на запад до Кутаиси, затем на север по Sh16 — дороге Кутаиси–Алпана. Примерно
    через 50 км, в селе Алпана, сверните налево на местную дорогу к Кведа-Гвириши (Нижний Гвириши) — до
    села около 4 км, последний отрезок может оказаться гравийным. Оставьте машину в селе и спуститесь
    по тропе к подножию водопада. Весь путь — около 302 км, примерно 4 часа 40 минут. Дорога в основном
    асфальтированная, и машины эконом-класса вполне хватит. В соседнем Цагери есть заправка и еда; остановку
    удобно совместить с Ладжанурским водохранилищем и крепостью Дехвири.
fa:
  name: آبشار غویریشی
  short: >-
    زیر غویریشی سفلی، جویباری از صخره‌ای بلند به درون دره‌ای تنگ می‌جهد: پرخروش‌ترین و آسان‌ترین توقف
    در گشتی یک‌روزه در اطراف تساگری.
  body: >-
    **زیر روستای کوِدا غویریشی زمین ناگهان تمام می‌شود و جویباری کوهستانی از لبه فرو می‌ریزد.**


    آب از دیواره‌ای بلند از سنگ به درون دره‌ای ژرف و تنگ فرو می‌افتد و در گودالی سنگی در پای آن فرود می‌آید؛
    آنجا در برکه‌ای کوچک گرد می‌آید و سپس راهش را ادامه می‌دهد. صخره‌های پرشیب از دو سو تنگه را در بر
    گرفته‌اند؛ در پای آبشار که رو برگردانید، تنگه به درهٔ پهناور لچخومی گشوده می‌شود. آبشار در ارتفاع
    حدود ۶۲۵ متری، در شهرستان تساگری قرار دارد.


    هیچ ارتفاع قابل‌اعتمادی از خود آبشار تاکنون منتشر نشده و ما هم عددی از خود نمی‌سازیم. آنچه می‌توان
    سنجید صداست. در ماه‌های مه و ژوئن، که برفاب جویبار را سیراب می‌کند، آبشار دره را از غرش و غبار سرد
    آب پر می‌کند؛ تا اواخر تابستان باریک‌تر و آرام‌تر می‌شود، اما همچنان ارزش پیاده‌روی کوتاهش را دارد.


    غویریشی هر سال هزاران بازدیدکننده را به خود می‌کشد و محور گشتی کوچک و محلی است: دریاچهٔ سد لاجانوری،
    دژ دخویری و شهرک تساگری همه در شعاع حدود ده کیلومتری آن‌اند. یک ساعت بیایید، جایی بایستید که غبار
    آب به شما برسد، و تنها وقتی بروید که آستینتان خیس شده باشد.
  tip: >-
    ورود رایگان است و محل در تمام سال باز است، اما مسیر پیاده از روستا به پایین خاکی است و بخش‌هایی از
    آن احتیاط می‌خواهد: کفشی با زیرهٔ ضدلغزش بپوشید، نه صندل، و کودکان را روی سنگ‌های خیس پای آبشار نزدیک
    خود نگه دارید. آبشار در مه و ژوئن پرآب‌تر از همیشه است؛ در اوتِ خشک ممکن است به نواری باریک بدل شود.
    حدود یک ساعت وقت بگذارید. کنار آبشار نه کافه‌ای هست و نه سرویس بهداشتی، پس غذا و سوخت را در تساگری
    تأمین کنید. ترشح آب دورتر از آنچه فکر می‌کنید می‌رسد: از دوربینتان محافظت کنید و حتی در روز گرم لباس
    گرم سبکی همراه داشته باشید.
  route: >-
    از تفلیس با E60/S1 به سوی غرب تا کوتائیسی بروید، سپس از Sh16، جادهٔ کوتائیسی–آلپانا، به سمت شمال ادامه
    دهید. پس از حدود ۵۰ کیلومتر، در روستای آلپانا، به چپ و به جادهٔ محلیِ کوِدا غویریشی (غویریشی سفلی)
    بپیچید؛ تا روستا حدود ۴ کیلومتر راه است و آخرین تکهٔ آن ممکن است شنی باشد. خودرو را در روستا پارک
    کنید و از کوره‌راه پیاده تا پای آبشار پایین بروید. کل مسیر حدود ۳۰۲ کیلومتر است و تقریباً ۴ ساعت و
    ۴۰ دقیقه طول می‌کشد. جاده بیشتر آسفالت است و خودروی اقتصادی کاملاً کافی است. در شهرک تساگری در همان
    نزدیکی پمپ‌بنزین و غذا پیدا می‌شود؛ این توقف را با دریاچهٔ سد لاجانوری و دژ دخویری ترکیب کنید.
he:
  name: מפל גווירישי
  short: >-
    מתחת לכפר גווירישי התחתון פלג הררי מזנק מסלע גבוה אל ערוץ צר: העצירה הרועשת והקלה ביותר בטיול יום
    מעגלי סביב צאגרי.
  body: >-
    **מתחת לכפר קוודה גווירישי האדמה פשוט נגמרת, ופלג הררי גולש מעבר לשפה.**


    המים נופלים מקיר סלע גבוה אל ערוץ עמוק וצר ונוחתים בגומה סלעית שלמרגלותיו, שם הם מתכנסים לבריכה קטנה
    לפני שהם ממשיכים בדרכם. מצוקים תלולים סוגרים על הערוץ משני הצדדים; הסתובבו למטה, והערוץ נפתח אל העמק
    הרחב של לצ'חומי. המפל נמצא בגובה של כ-625 מטר, בתחום המוניציפליות של צאגרי.


    גובה אמין של המפל עצמו לא פורסם מעולם, ואנחנו לא נמציא אחד. מה שאפשר למדוד הוא הקול. במאי וביוני,
    כשמי השלגים הנמסים מזינים את הפלג, המפל ממלא את הערוץ בשאון וברסס קר; לקראת סוף הקיץ הוא מצטמק למשהו
    עדין יותר, ועדיין שווה את ההליכה הקצרה.


    גווירישי מושך אלפי מבקרים בשנה ומשמש עוגן למסלול מקומי קטן: מאגר לג'אנורי, מבצר דחווירי והעיירה צאגרי
    נמצאים כולם במרחק של כעשרה קילומטרים לכל היותר. בואו לשעה, עמדו במקום שהרסס מגיע אליו, ואל תלכו עד
    שהשרוול שלכם נרטב.
  tip: >-
    הכניסה חופשית והמקום פתוח כל השנה, אבל השביל היורד מהכפר אינו סלול וקטעים ממנו דורשים זהירות: נעלו
    נעליים עם אחיזה טובה, לא סנדלים, והחזיקו ילדים קרוב אליכם על הסלעים הרטובים למרגלות המפל. הזרימה בשיאה
    במאי וביוני; באוגוסט שחון המפל עלול להצטמק לסרט דק. הקצו כשעה. ליד המפל אין בתי קפה ואין שירותים,
    לכן אכלו ותדלקו בצאגרי. הרסס מגיע רחוק יותר ממה שנדמה: הגנו על המצלמה, וקחו שכבה קלה גם ביום חם.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד קוטאיסי, ומשם צפונה בכביש Sh16 — דרך קוטאיסי–אלפנה. אחרי כ-50 ק"מ,
    בכפר אלפנה, פנו שמאלה לדרך המקומית לקוודה גווירישי (גווירישי התחתון), כ-4 ק"מ; הקטע האחרון עשוי להיות
    דרך חצץ. חנו בכפר ורדו בשביל הרגלי עד למרגלות המפל. הנסיעה כולה כ-302 ק"מ ונמשכת כ-4 שעות ו-40 דקות.
    הכביש סלול ברובו, ורכב חסכוני מספיק לגמרי. בעיירה צאגרי הסמוכה יש דלק ואוכל; שלבו את העצירה עם מאגר
    לג'אנורי ומבצר דחווירי.
ar:
  name: شلال غفيريشي
  short: >-
    تحت قرية غفيريشي السفلى يقفز جدول جبلي من صخرة عالية إلى وادٍ ضيق: أعلى المحطات صوتاً وأسهلها في جولة
    يوم حول تساغيري.
  body: >-
    **تحت قرية كفيدا غفيريشي تنتهي الأرض فجأة، ويندفع جدول جبلي من فوق الحافة.**


    يهوي الماء من جدار صخري عالٍ إلى وادٍ عميق ضيق، ويسقط في جوف صخري عند قاعه حيث يتجمع في بركة صغيرة
    قبل أن يمضي في جريانه. تحفّ الجروف الشاهقة بالخانق من الجانبين؛ فإذا التفتّ عند القاع انفتح الخانق
    على وادي ليتشخومي الفسيح. يقع الشلال على ارتفاع نحو 625 متراً، في بلدية تساغيري.


    لم يُنشر قطّ رقم موثوق لارتفاع الشلال نفسه، ولن نخترع رقماً. ما يمكن قياسه هو الصوت. في مايو ويونيو،
    حين تغذّي الثلوج الذائبة الجدول، يملأ الشلال الوادي هديراً ورذاذاً بارداً؛ ومع أواخر الصيف يرقّ ويغدو
    ألطف، لكنه يظل جديراً بالمشي القصير.


    يجذب غفيريشي آلاف الزوار كل عام، ويشكّل محور جولة محلية صغيرة: خزان لاجانوري وقلعة ديخفيري وبلدة تساغيري
    كلها في دائرة لا تتجاوز عشرة كيلومترات تقريباً. تعالَ لساعة، وقف حيث يبلغك الرذاذ، ولا تغادر إلا وقد
    ابتلّ كمّك.
  tip: >-
    الدخول مجاني والموقع مفتوح طوال العام، لكن الممر النازل من القرية غير معبّد وبعض أجزائه يستدعي الحذر:
    البس حذاءً ذا نعل متماسك لا صندلاً، وأبقِ الأطفال قريبين منك على الصخور المبتلة عند القاع. يبلغ تدفق
    الماء ذروته في مايو ويونيو؛ وفي أغسطس الجاف قد يصير خيطاً رفيعاً. خصّص نحو ساعة. لا مقاهي ولا دورات
    مياه عند الشلال، فتناول طعامك وتزوّد بالوقود في تساغيري. يمتد الرذاذ أبعد مما تتوقع: احمِ الكاميرا،
    واحمل سترة خفيفة حتى في يوم دافئ.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى كوتايسي، ثم اتجه شمالاً على الطريق Sh16، طريق كوتايسي–ألبانا.
    وبعد نحو 50 كم، في قرية ألبانا، انعطف يساراً إلى الطريق المحلي المؤدي إلى كفيدا غفيريشي (غفيريشي السفلى)
    على بعد نحو 4 كم؛ وقد يكون الجزء الأخير منه حصوياً. اركن السيارة في القرية واتبع الممر نزولاً إلى
    قاع الشلال. تبلغ الرحلة كلها نحو 302 كم وتستغرق قرابة 4 ساعات و40 دقيقة. الطريق معبّد في معظمه، وتكفي
    تماماً سيارة اقتصادية. في بلدة تساغيري القريبة وقود وطعام؛ واجمع هذه المحطة مع خزان لاجانوري وقلعة
    ديخفيري.
