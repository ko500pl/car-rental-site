ka:
  name: გონიო-აფსაროსის ციხე
  short: >-
    ჭოროხის შესართავთან აღმართული რომაული ციხე: თლილი ლოდების კედლები, ოსმალური დაშენებები და ორი საფლავი,
    რომლებსაც ვერავინ დაამტკიცებს.
  body: >-
    **„მივედით აფსარში, სადაც ხუთი კოჰორტაა ჩაყენებული“ — ასე ლაკონიურად აღწერა ეს ადგილი რომაელმა მწერალმა
    არიანემ, და გონიოს კედლები მის სიტყვებს დღემდე ადასტურებს.**


    აფსაროსს პირველად პლინიუს უფროსი იხსენიებს I საუკუნეში; რომაელებმა ციხე ახალი წელთაღრიცხვის 70-იან
    წლებში ააგეს, ჭოროხის შავ ზღვასთან შესართავის მარცხენა მხარის დასაცავად. გეგმაში იგი თითქმის სწორკუთხედია,
    228 მეტრი 195-ზე; თავდაპირველად ოთხი კარიბჭე და 22 კოშკი ჰქონდა, აქედან 18 კოშკი დღემდეა შემორჩენილი.
    კედელს ახლოდან დააკვირდით და მისი ბიოგრაფია ფენებად წაიკითხება: ძირში უზარმაზარი, ფაქიზად თლილი კვადრებია,
    ზოგი 80 სანტიმეტრამდე სიმაღლისა; ზემოთ კი უსწორმასწორო რიყის ქვა, რომლითაც ციხე ოსმალებმა დააშენეს,
    1547 წელს რომ დაიკავეს. ოსმალები აქ 1878 წლამდე იდგნენ.


    გალავნის შიგნით ბალახიანი ეზოა, ეზოში კი — თხრილები. 1995 წლიდან მიმდინარე გათხრებმა გამოავლინა I
    საუკუნის მეორე ნახევრის აბანო, ყაზარმები, პრეტორიუმი, წყალსადენი და კანალიზაცია. 1994 წლიდან აქ მუზეუმ-ნაკრძალი
    მოქმედებს, სადაც ძველი წელთაღრიცხვიდან XIX საუკუნის 80-იან წლებამდე დათარიღებული ნივთები ინახება.


    ლეგენდაც ორი აქვს და ორივე საფლავს ეხება. არიანე წერს, რომ ოდესღაც ამ ადგილს აფსირტე ერქვა, რადგან
    თითქოს სწორედ აქ მოკლეს მედეამ და იასონმა ვერაგულად მედეას ძმა, აფსირტე, და რომ ადგილობრივები მის
    საფლავსაც აჩვენებდნენ. დღევანდელი გადმოცემით კი ციხის კედლებში მოციქული მატათიაა დაკრძალული; სავარაუდო
    საფლავის მახლობლად თხრა აკრძალულია, ამიტომ ამის შემოწმება შეუძლებელია.


    ორი საფლავი, არცერთი დამტკიცებული, და კედელი, რომელსაც ხელით შეეხებით — ეს არის გონიო ერთ წინადადებაში.
  tip: >-
    საათნახევარი საკმარისია. ეზოში ჩრდილი თითქმის არ არის, ზაფხულის შუადღე კი აქ ცხელი და ნოტიოა — დილით
    ან გვიან ნაშუადღევს მოდით; ქუდი და წყალი აუცილებელია. ბალახსა და თხრილებთან დახურული ფეხსაცმელი ჯობია.
    ბილეთი ჭიშკართან იყიდება, ფასი დროდადრო იცვლება. სარფის სასაზღვრო გამშვები პუნქტი სულ რამდენიმე კილომეტრშია,
    ამიტომ პასპორტი ან პირადობის მოწმობა თან იქონიეთ, თუმცა თავად ციხისთვის ნებართვა არ გჭირდებათ. მანქანა
    შესასვლელთან, გზისპირას დააყენეთ. კაფეები, მაღაზიები და ბანკომატი გონიოს დასახლებაშია, ზღვა კი ათიოდე
    წუთის სავალზე.
  route: >-
    თბილისიდან დაახლოებით 385 კილომეტრი და ხუთი საათი და ორმოცდაათი წუთია. E60-ით სამტრედიამდე მიდიხართ,
    შემდეგ ს12-ით ზღვაზე გადიხართ და ქობულეთის გავლით ბათუმამდე ჩადიხართ. ბათუმიდან სამხრეთით, სარფის
    გზას გაჰყევით: აეროპორტს ჩაუვლით, ჭოროხის ხიდს გადაკვეთთ და ცენტრიდან 12 კილომეტრში, 20-25 წუთში,
    ციხე გზის მარცხენა მხარეს, პირდაპირ გზისპირას ამოგეზრდებათ. გზა ბოლომდე კარგი ასფალტია, ეკონომ-კლასის
    მანქანა სავსებით საკმარისია. საწვავი ბათუმში ან გონიოში აიღეთ; სასაზღვრო პუნქტისკენ წასვლა არ დაგჭირდებათ.
en:
  name: Gonio-Apsaros Fortress
  short: >-
    A Roman fort at the mouth of the Chorokhi: walls of dressed blocks, Ottoman patching, and two graves
    no one can prove.
  body: >-
    **"We came to Apsaros, where five cohorts are stationed": the Roman writer Arrian gave this fort one
    dry line, and its walls still bear him out.**


    Pliny the Elder mentions Apsaros in the 1st century AD, and the Romans built the fort around the 70s
    AD to guard the left bank of the Chorokhi where it meets the Black Sea. It is a near-rectangle, 228
    by 195 metres, built with four gates and 22 towers, of which 18 survive. Look closely and the wall
    tells its own biography in layers: at the bottom, huge, finely dressed blocks, some around 80 centimetres
    high; higher up, rough river cobbles laid by the Ottomans after they took Gonio in 1547. They held
    it until 1878.


    Inside the circuit lies a grassy yard cut by trenches. Excavations running since 1995 have exposed
    a bath house from the second half of the 1st century, barracks, the praetorium, water pipes and drains.
    A museum-reserve has operated here since 1994, holding finds from before Christ to the 1880s.


    Gonio has two legends, and both are graves. Arrian recorded that the place was once called Apsyrtos,
    because Medea and Jason were said to have treacherously killed her brother Apsyrtus here, and that
    locals still pointed out his tomb. Today's tradition places another grave inside the walls: that of
    the Apostle Matthias. Digging near the supposed site is prohibited, so the claim cannot be tested.


    Two graves, neither provable, inside a wall you can lay your hand on: that is Gonio in a sentence.
  tip: >-
    An hour and a half is enough. There is almost no shade inside, and a summer midday here is hot and
    humid, so come in the morning or late afternoon with a hat and water. Closed shoes are better on the
    grass and around the trenches. Tickets are sold at the gate and prices change from time to time. The
    Sarpi border crossing is only a few kilometres away, so carry a passport or ID card, although the
    fortress itself needs no permit. Park at the roadside by the entrance. Cafés, shops and an ATM are
    in Gonio village, and the sea is about ten minutes' walk.
  route: >-
    From Tbilisi it is about 385 km, five hours fifty. Take the E60 to Samtredia, then the S12 to the
    coast and south through Kobuleti to Batumi. From Batumi follow the Sarpi road south, past the airport
    and across the Chorokhi bridge: 12 km from the centre, twenty to twenty-five minutes, and the fortress
    rises right beside the road on your left. It is good asphalt throughout and an economy car is entirely
    sufficient. Fill up in Batumi or Gonio; there is no need to drive on towards the border crossing itself.
ru:
  name: Крепость Гонио-Апсарос
  short: >-
    Римский форт у устья Чорохи: стены из тёсаных блоков, османские заплаты и две могилы, которые никто
    не может доказать.
  body: >-
    **«Мы прибыли в Апсар, где расположены пять когорт» — этой сухой строкой римский писатель Арриан описал
    крепость, и её стены до сих пор подтверждают его слова.**


    Плиний Старший упоминает Апсар уже в I веке н. э., а сами римляне возвели крепость примерно в 70-х
    годах н. э., чтобы охранять левый берег Чорохи у её впадения в Чёрное море. В плане она почти прямоугольная,
    228 на 195 метров, изначально с четырьмя воротами и 22 башнями, из которых сохранилось 18. Присмотритесь
    к стене — и её биография прочитается слоями: внизу огромные, тщательно тёсаные квадры, некоторые высотой
    около 80 сантиметров; выше — неровная речная галька, которой крепость надстроили османы после захвата
    Гонио в 1547 году. Они удерживали её до 1878 года.


    Внутри стен — заросший травой двор, изрытый траншеями. Раскопки, идущие с 1995 года, обнажили баню
    второй половины I века, казармы, преторий, водопровод и канализацию. С 1994 года здесь работает музей-заповедник,
    хранящий находки от эпохи до нашей эры до 1880-х годов.


    У Гонио две легенды, и обе — о могилах. Арриан писал, что это место когда-то называлось Апсирт, потому
    что именно здесь, по преданию, Медея и Ясон предательски убили её брата Апсирта, и что местные жители
    до сих пор показывали его могилу. Сегодняшнее предание помещает внутрь стен другую могилу — апостола
    Матфия. Копать возле предполагаемого места запрещено, так что проверить это невозможно.


    Две могилы, ни одна из которых не доказана, и стена, которую можно тронуть рукой, — вот Гонио в одном
    предложении.
  tip: >-
    Полутора часов достаточно. Тени внутри почти нет, а летний полдень здесь жаркий и влажный, так что
    приходите утром или под вечер, со шляпой и водой. На траве и у траншей удобнее закрытая обувь. Билеты
    продаются у ворот, цена время от времени меняется. Пограничный переход Сарпи всего в нескольких километрах,
    так что возьмите с собой паспорт или удостоверение личности, хотя для самой крепости разрешение не
    нужно. Машину оставьте у дороги при входе. Кафе, магазины и банкомат — в посёлке Гонио, а до моря
    отсюда около десяти минут пешком.
  route: >-
    От Тбилиси около 385 км и пяти часов пятидесяти минут. Двигайтесь по E60 до Самтредиа, затем по S12
    к побережью и на юг через Кобулети в Батуми. От Батуми поезжайте по дороге на Сарпи, на юг, минуя
    аэропорт и пересекая мост через Чорохи: через 12 км от центра, двадцать-двадцать пять минут, крепость
    встанет прямо у дороги слева от вас. Дорога хорошая, асфальтированная на всём протяжении, машины экономкласса
    вполне достаточно. Заправляйтесь в Батуми или Гонио — доезжать до самого пограничного перехода не
    нужно.
fa:
  name: قلعه گونیو-آپساروس
  short: >-
    دژی رومی در دهانه‌ی چوروخی: دیوارهایی از بلوک‌های تراش‌خورده، وصله‌های عثمانی، و دو گور که هیچ‌کس
    نمی‌تواند اثباتشان کند.
  body: >-
    **«به آپسار رسیدیم، جایی که پنج هنگ (کوهورت) مستقرند» - آریانِ رومی این قلعه را در همین یک جمله‌ی
    خشک توصیف کرد، و دیوارهایش هنوز گفته‌اش را تأیید می‌کنند.**


    پلینی بزرگ، در سده‌ی نخست میلادی، از آپسار یاد می‌کند، و رومیان خود این قلعه را در حدود دهه‌ی هفتاد
    میلادی برای پاسداری از ساحل چپ چوروخی در نقطه‌ی ریزش آن به دریای سیاه بنا کردند. نقشه‌ی آن تقریباً
    مستطیل است، ۲۲۸ در ۱۹۵ متر، که در آغاز چهار دروازه و ۲۲ برج داشت که هجده‌تایشان امروز برجاست. از نزدیک
    به دیوار بنگرید و زندگی‌نامه‌ی آن لایه‌به‌لایه پیش چشمتان می‌آید: در پایین، بلوک‌های عظیم و به‌دقت
    تراش‌خورده، برخی به بلندی حدود ۸۰ سانتی‌متر؛ و بالاتر، ریگ‌های ناهموار رودخانه‌ای که عثمانیان پس از
    تصرف گونیو در سال ۱۵۴۷ بر آن افزودند. آن‌ها تا سال ۱۸۷۸ آن‌جا ماندند.


    درون حصار، حیاطی پرچمن است که ترانشه‌ها آن را شکافته‌اند. کاوش‌هایی که از سال ۱۹۹۵ ادامه دارد، حمامی
    از نیمه‌ی دوم سده‌ی نخست، پادگان، دفتر فرمانده (پرایتوریوم)، لوله‌های آب و فاضلاب را بیرون آورده است.
    از سال ۱۹۹۴ یک موزه-قرقگاه در این‌جا دایر است که آثاری از پیش از میلاد تا دهه‌ی ۱۸۸۰ را در خود دارد.


    گونیو دو افسانه دارد و هر دو درباره‌ی گور است. آریان نوشته که این‌جا زمانی آپسورتوس نام داشت، زیرا
    گفته می‌شد مدئا و یاسون در همین‌جا برادر مدئا، آپسورتوس، را با نیرنگ کشتند، و مردم محلی هنوز گورش
    را نشان می‌دادند. روایت امروزی گور دیگری را درون این دیوارها می‌گذارد: گور متیاس حواری. کندن‌وکاو
    نزدیک محل احتمالی ممنوع است، پس این ادعا را نمی‌توان آزمود.


    دو گور، هیچ‌یک اثبات‌ناشده، درون دیواری که می‌توانید با دست لمسش کنید - این است گونیو در یک جمله.
  tip: >-
    یک ساعت و نیم کافی است. درون قلعه تقریباً هیچ سایه‌ای نیست و نیمروز تابستان این‌جا گرم و مرطوب است،
    پس صبح یا اواخر بعدازظهر بیایید، با کلاه و آب. کفشی بسته روی چمن و کنار ترانشه‌ها راحت‌تر است. بلیت
    در دروازه فروخته می‌شود و قیمتش گاه‌به‌گاه تغییر می‌کند. گذرگاه مرزی سارپی تنها چند کیلومتر دورتر
    است، پس گذرنامه یا کارت شناسایی همراه داشته باشید، هرچند برای خود قلعه اجازه‌ای لازم نیست. ماشین را
    کنار جاده نزدیک ورودی بگذارید. کافه، مغازه و دستگاه خودپرداز در روستای گونیو هست، و دریا حدود ده دقیقه
    پیاده‌روی فاصله دارد.
  route: >-
    از تفلیس حدود ۳۸۵ کیلومتر و پنج ساعت و پنجاه دقیقه است. از E60 تا سامترِدیا بروید، سپس از S12 به ساحل
    برسید و آن‌گاه به‌سوی جنوب، از میان کوبولتی، به باتومی برسید. از باتومی جاده‌ی سارپی را به‌سوی جنوب
    دنبال کنید: از کنار فرودگاه بگذرید، از پل چوروخی عبور کنید و در ۱۲ کیلومتری مرکز، در بیست تا بیست‌وپنج
    دقیقه، قلعه درست کنار جاده، سمت چپ، پیش چشمتان می‌آید. جاده تا انتها آسفالته و خوب است، خودروی اقتصادی
    کاملاً کافی است. در باتومی یا گونیو سوخت‌گیری کنید؛ نیازی نیست تا خود گذرگاه مرزی برانید.
he:
  name: מצודת גוניו-אפסרוס
  short: 'מצודה רומית בשפך נהר הצ''ורוחי: קירות מבלוקים מסותתים, טלאים עות''מאניים, ושני קברים שאיש אינו
    יכול לאמת.'
  body: >-
    **"הגענו לאפסרוס, שם חונות חמש קוהורטות" - כך תיאר הסופר הרומי אריאנוס את המצודה בשורה יבשה אחת, וקירותיה
    מאששים את דבריו עד היום.**


    פליניוס הזקן מזכיר את אפסרוס במאה הראשונה לספירה, והרומאים בנו את המצודה בסביבות שנות ה-70 לספירה,
    כדי להגן על הגדה השמאלית של הצ'ורוחי במקום שבו הוא נשפך לים השחור. תוכניתה כמעט מלבנית, 228 על 195
    מטרים, ונבנתה עם ארבעה שערים ו-22 מגדלים, מהם שרדו 18. התבוננו מקרוב בקיר ותגלו את קורות חייו בשכבות:
    בתחתית, בלוקים אדירים ומסותתים בקפידה, חלקם בגובה של כ-80 סנטימטרים; ומעליהם, חלוקי נחל גסים שהניחו
    העות'מאנים אחרי שכבשו את גוניו ב-1547. הם שלטו בה עד 1878.


    בתוך החומה חצר מכוסה עשב, חצויה בתעלות. חפירות המתקיימות מ-1995 חשפו בית מרחץ מהמחצית השנייה של המאה
    הראשונה, מגורי חיילים, את הפרטוריום, קווי מים וביוב. מ-1994 פועלת כאן שמורת-מוזיאון, המכילה ממצאים
    מלפני הספירה ועד שנות ה-80 של המאה ה-19.


    לגוניו שתי אגדות, ושתיהן על קברים. אריאנוס כתב שהמקום נקרא בעבר אפסירטוס, כי סיפרו שכאן רצחו מדיאה
    ויאסון בבגידה את אחיה של מדיאה, אפסירטוס, ושהתושבים המקומיים עדיין הראו את קברו. המסורת של היום ממקמת
    קבר נוסף בתוך החומות: קברו של השליח מתתיהו. חפירה בקרבת המקום המשוער אסורה, כך שאין אפשרות לבדוק את
    הטענה.


    שני קברים, שאף אחד מהם לא הוכח, בתוך קיר שאפשר להניח עליו יד - זהו גוניו במשפט אחד.
  tip: >-
    שעה וחצי מספיקה. אין כמעט צל בפנים, וצהרי קיץ כאן חמים ולחים, אז הגיעו בבוקר או בשעות אחר הצהריים
    המאוחרות, עם כובע ומים. נעליים סגורות נוחות יותר על הדשא ובקרבת התעלות. כרטיסים נמכרים בשער והמחיר
    משתנה מזמן לזמן. מעבר הגבול סרפי נמצא רק כמה קילומטרים משם, אז הביאו דרכון או תעודת זהות, אף שהמצודה
    עצמה אינה דורשת אישור. חנו את הרכב בצד הדרך סמוך לכניסה. בתי קפה, חנויות וכספומט נמצאים בכפר גוניו,
    והים במרחק הליכה של כעשר דקות.
  route: >-
    מטביליסי המרחק הוא כ-385 ק"מ וכחמש שעות וחמישים דקות. סעו בכביש E60 עד סמטרדיה, ואז ב-S12 לחוף ומשם
    דרומה דרך קובולטי לבטומי. מבטומי המשיכו דרומה בכביש לסרפי, חלפו על פני שדה התעופה וחצו את גשר הצ'ורוחי:
    12 ק"מ מהמרכז, עשרים עד עשרים וחמש דקות, והמצודה מתרוממת ממש בצד הכביש, משמאלכם. הכביש סלול היטב לכל
    אורכו ורכב אקונומי מספיק בהחלט. תדלקו בבטומי או בגוניו; אין צורך להמשיך עד מעבר הגבול עצמו.
ar:
  name: قلعة غونيو-أبساروس
  short: 'حصن روماني عند مصبّ نهر تشوروخي: جدران من كتل مشذّبة، وترقيعات عثمانية، وقبران لا يستطيع أحد
    إثباتهما.'
  body: >-
    **"وصلنا إلى أبساروس، حيث تتمركز خمس كتائب" - بهذه الجملة الجافة وصف الكاتب الروماني أريان هذا الحصن،
    وما زالت جدرانه تصدّق كلامه.**


    يذكر بليني الأكبر أبساروس في القرن الأول الميلادي، وقد بنى الرومان الحصن في نحو السبعينيات الميلادية
    لحماية الضفة اليسرى لنهر تشوروخي عند مصبّه في البحر الأسود. مخططه شبه مستطيل، 228 في 195 مترًا، وبُني
    بأربع بوابات و22 برجًا، نجا منها 18. تأمّل الجدار عن قرب فتقرأ سيرته على طبقات: في القاعدة، كتل هائلة
    مشذّبة بدقة، يبلغ ارتفاع بعضها نحو 80 سنتيمترًا؛ وفي الأعلى، حصى نهري خشن وضعه العثمانيون بعد أن استولوا
    على غونيو عام 1547. وبقوا فيها حتى عام 1878.


    داخل السور ساحة عشبية تخترقها خنادق. كشفت الحفريات الجارية منذ عام 1995 عن حمّام يعود إلى النصف الثاني
    من القرن الأول، وثكنات، ومقر القائد (البريتوريوم)، وأنابيب مياه ومجارٍ. وتعمل هنا منذ عام 1994 محمية-متحف
    تضمّ آثارًا من عصور ما قبل الميلاد حتى ثمانينيات القرن التاسع عشر.


    لغونيو أسطورتان، وكلتاهما عن قبر. كتب أريان أن المكان كان يُدعى قديمًا أبسورتوس، لأن ميديا وياسون،
    كما يُقال، قتلا هنا غدرًا أخا ميديا، أبسورتوس، وأن السكان المحليين كانوا لا يزالون يشيرون إلى قبره.
    أما التقليد الحالي فيضع قبرًا آخر داخل الأسوار: قبر الرسول متياس. والحفر قرب الموقع المفترض ممنوع،
    فلا يمكن التحقق من هذه الدعوى.


    قبران، لا يمكن إثبات أيّ منهما، داخل جدار تستطيع أن تضع يدك عليه - هذه هي غونيو في جملة واحدة.
  tip: >-
    تكفي ساعة ونصف. لا يوجد ظلّ يُذكر في الداخل، وظهيرة الصيف هنا حارة ورطبة، فتعالَ صباحًا أو في وقت
    متأخر من بعد الظهر، مع قبّعة وماء. الحذاء المغلق أفضل على العشب وحول الخنادق. تُباع التذاكر عند البوابة
    وتتغير أسعارها من وقت لآخر. معبر ساربي الحدودي على بُعد كيلومترات قليلة فقط، فاحمل جواز سفر أو بطاقة
    هوية، مع أن القلعة نفسها لا تتطلب أي إذن. اترك السيارة على جانب الطريق قرب المدخل. المقاهي والمحلات
    وجهاز الصراف الآلي في قرية غونيو، والبحر على بُعد نحو عشر دقائق مشيًا.
  route: >-
    من تبليسي نحو 385 كم وخمس ساعات وخمسون دقيقة. سِر على الطريق E60 حتى سامتريديا، ثم على S12 إلى الساحل،
    ثم جنوبًا عبر كوبوليتي إلى باتومي. ومن باتومي اتبع طريق ساربي جنوبًا، متجاوزًا المطار وعابرًا جسر
    تشوروخي: على 12 كم من وسط المدينة، أي عشرين إلى خمس وعشرين دقيقة، ترتفع القلعة مباشرة بجانب الطريق
    على يسارك. الطريق معبّد جيدًا بالكامل، وتكفي سيارة اقتصادية تمامًا. تزوّد بالوقود في باتومي أو غونيو؛
    ولا حاجة للاستمرار نحو المعبر الحدودي نفسه.
