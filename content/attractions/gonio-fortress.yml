ka:
  name: გონიო-აფსაროსის ციხე
  short: რომაული სამხედრო ციხესიმაგრე ბათუმის სამხრეთით — 18 კოშკი, გათხრები და მოციქულის სავარაუდო სამარხი.
  body: >-
    გონიოს ციხე ბათუმიდან სამხრეთით, თურქეთის საზღვართან ახლოს დგას და საქართველოს ტერიტორიაზე ერთ-ერთი
    ყველაზე კარგად შემონახული რომაული სამხედრო ნაგებობაა. ანტიკურ ხანაში ის აფსაროსის სახელით იყო ცნობილი
    და რომის იმპერიის აღმოსავლეთი საზღვრის მნიშვნელოვან საყრდენ პუნქტს წარმოადგენდა — აქ ლეგიონის გარნიზონი
    იდგა.


    ციხის გეგმა ტიპურად რომაულია: სწორკუთხა პერიმეტრი დაახლოებით 900 მეტრის კედლებით და 18 კოშკი. კედლების
    მნიშვნელოვანი ნაწილი დღემდე სრულ სიმაღლეზეა შემორჩენილი. მოგვიანებით ციხე ბიზანტიელებმა, შემდეგ კი
    ოსმალებმა გამოიყენეს, ამიტომ სხვადასხვა ეპოქის მშენებლობა ერთმანეთზეა დაშრევებული.


    ტერიტორიაზე შიგნით:


    - **არქეოლოგიური გათხრები** — რომაული აბანო, კაზარმები, წყალსადენის ნაშთები

    - **მცირე მუზეუმი** მონეტებით, კერამიკითა და ადგილზე ნაპოვნი ნივთებით

    - **სავარაუდო სამარხი**, რომელსაც ტრადიცია მოციქულ მატათას მიაწერს


    ციხის შიდა ეზო დღეს ღია, ბალახიანი სივრცეა და ვიზიტს დაახლოებით საათნახევარი სჭირდება. ეს ერთ-ერთი
    იმ ადგილთაგანია, სადაც აჭარის ისტორია ბათუმის თანამედროვე ფასადს მიღმა ჩანს და ცხადი ხდება, რომ ეს
    სანაპირო ორი ათასი წლის განმავლობაში სავაჭრო და სამხედრო გზების კვანძი იყო. ვიზიტი ბუნებრივად ერწყმის
    გონიოს პლაჟს, რომელიც პირდაპირ გზის მეორე მხარესაა, ან სამხრეთით კვარიათის სანაპიროს.
  tip: >-
    ჩრდილი ტერიტორიაზე თითქმის არ არის, ამიტომ ზაფხულის შუადღე აქ ძალიან ცხელი და ნოტიოა — დილა ან საღამო
    სჯობს. ქუდი და წყალი თან იქონიეთ. ბალახიან ეზოში ფეხსაცმელი დახურული ჯობია. ციხე საზღვართან ახლოსაა,
    ამიტომ პასპორტი ან პირადობა თან გქონდეთ. მანქანა შესასვლელთან, გზის პირას ტოვებთ. კაფეები და მაღაზიები
    გონიოს დასახლებაშია, ორ წუთში; ბანკომატი ასევე იქაა.
  route: >-
    თბილისიდან დაახლოებით 385 კმ და ხუთი საათი და 50 წუთია. E60-ით ჩადიხართ ბათუმამდე, შემდეგ სანაპირო
    გზით სამხრეთით აგრძელებთ ჭოროხის ხიდის გავლით — ბათუმიდან გონიომდე მხოლოდ 12 კმ-ია, 20-25 წუთი ტრაფიკის
    მიხედვით. გზა ბოლომდე კარგი ასფალტია და ეკონომ კლასის ავტომობილი სავსებით საკმარისია. ციხე პირდაპირ
    მაგისტრალის პირასაა და გვერდით ჩაუვლელია. საწვავი ბათუმში ან გონიოში აავსეთ; საზღვრისკენ გასვლა არ
    დაგჭირდებათ.
en:
  name: Gonio-Apsaros Fortress
  short: >-
    A Roman military fort south of Batumi — 18 towers, active excavations and a grave traditionally linked
    to an apostle.
  body: >-
    Gonio fortress stands south of Batumi, close to the Turkish border, and is one of the best-preserved
    Roman military structures on Georgian territory. In antiquity it was known as Apsaros and served as
    an important strongpoint on the eastern frontier of the Roman Empire, garrisoned by legionary troops.


    The plan is characteristically Roman: a rectangular perimeter of roughly 900 metres of wall with 18
    towers. Substantial stretches survive at close to full height. The fort was later used by the Byzantines
    and then by the Ottomans, so building work from several eras is layered on top of one another, which
    the excavation trenches make visible.


    Inside the walls:


    - **Archaeological excavations** — a Roman bath house, barracks, remains of the water supply

    - **A small museum** with coins, ceramics and other finds from the site

    - **A grave** which local tradition associates with the Apostle Matthias


    The interior courtyard is now an open grassy space, and a visit takes about an hour and a half. This
    is one of the places where the older history of Adjara becomes visible behind the modern facade of
    Batumi, and it pairs naturally with a stop at the nearby beach.
  tip: >-
    There is almost no shade inside, so midday in summer is hot and very humid — morning or early evening
    is much better. Bring a hat and water. Closed shoes are preferable on the grassy interior. The fortress
    is close to the border, so carry your passport or ID card. Park at the entrance by the roadside. Cafes,
    shops and an ATM are two minutes away in Gonio village, and the beach is directly across the road.
  route: >-
    It is about 385 km and five hours fifty from Tbilisi. Take the E60 down to Batumi, then continue south
    along the coast road across the Chorokhi bridge: Batumi to Gonio is only 12 km, twenty to twenty-five
    minutes depending on traffic. The road is good asphalt throughout and an economy car is entirely sufficient.
    The fortress sits directly beside the highway and is impossible to miss. Fill up in Batumi or Gonio;
    you do not need to drive toward the border crossing itself.
ru:
  name: Крепость Гонио-Апсарос
  short: Римский военный форт к югу от Батуми — 18 башен, действующие раскопки и могила, связываемая с
    апостолом.
  body: >-
    Крепость Гонио стоит к югу от Батуми, недалеко от турецкой границы, и является одним из лучше всего
    сохранившихся римских военных сооружений на территории Грузии. В античности она была известна как
    Апсарос и служила важным опорным пунктом на восточной границе Римской империи с легионным гарнизоном.


    План типично римский: прямоугольный периметр примерно из 900 метров стен и 18 башен. Значительные
    участки сохранились почти на полную высоту. Позже крепость использовали византийцы, а затем османы,
    поэтому строительство разных эпох наслаивается одно на другое, и раскопы это наглядно показывают.


    Внутри стен:


    - **Археологические раскопки** — римские бани, казармы, остатки водопровода

    - **Небольшой музей** с монетами, керамикой и другими находками

    - **Захоронение**, которое местная традиция связывает с апостолом Матфием


    Внутренний двор сегодня представляет собой открытое травяное пространство, на осмотр уходит около
    полутора часов. Это одно из мест, где старая история Аджарии проступает за современным фасадом Батуми,
    и оно естественно сочетается с остановкой на соседнем пляже.
  tip: >-
    Тени внутри почти нет, поэтому летний полдень здесь жаркий и очень влажный — утро или ранний вечер
    гораздо приятнее. Возьмите головной убор и воду. По травяному двору лучше ходить в закрытой обуви.
    Крепость близко к границе, паспорт или удостоверение держите при себе. Машину оставляйте у входа вдоль
    дороги. Кафе, магазины и банкомат — в двух минутах в посёлке Гонио, пляж прямо через дорогу.
  route: >-
    От Тбилиси около 385 км и пять часов пятьдесят минут. По трассе E60 вы спускаетесь к Батуми, затем
    продолжаете по прибрежной дороге на юг через мост над Чорохи: от Батуми до Гонио всего 12 км, двадцать-двадцать
    пять минут в зависимости от трафика. Дорога — хороший асфальт на всём протяжении, машины эконом-класса
    достаточно. Крепость стоит прямо у шоссе, мимо не проедете. Заправляйтесь в Батуми или Гонио; к самому
    пограничному переходу подъезжать не нужно.
fa:
  name: دژ گونیو-آپساروس
  short: پادگانی رومی در جنوب باتومی — 18 برج، کاوش‌های فعال و گوری که سنت آن را به یکی از حواریون نسبت
    می‌دهد.
  body: >-
    دژ گونیو در جنوب باتومی و نزدیک مرز ترکیه ایستاده است و یکی از سالم‌مانده‌ترین سازه‌های نظامی رومی
    در خاک گرجستان است. در دوران باستان آن را آپساروس می‌نامیدند و پایگاه مستحکم مهمی در مرز شرقی امپراتوری
    روم بود که نیروهای لژیونی در آن پادگان داشتند.


    نقشهٔ آن به‌روشنی رومی است: محیطی مستطیل با نزدیک 900 متر دیوار و 18 برج. بخش‌های قابل‌توجهی از آن
    تقریباً به بلندی کامل باقی مانده‌اند. دژ بعدها به دست بیزانسی‌ها و سپس عثمانی‌ها به کار رفت، بنابراین
    ساخت‌وسازهای چند دوره روی هم نشسته‌اند و گمانه‌های کاوش همین را قابل دیدن می‌کنند. درون دیوارها کاوش‌های
    باستان‌شناسی — گرمابهٔ رومی، سربازخانه و بازمانده‌های آبرسانی — یک موزهٔ کوچک با سکه، سفال و دیگر
    یافته‌های محوطه، و گوری قرار دارد که سنت محلی آن را به متیاس حواری نسبت می‌دهد.


    حیاط درونی امروز فضایی باز و چمن‌پوش است و بازدید حدود یک ساعت و نیم طول می‌کشد. اینجا یکی از جاهایی
    است که تاریخ کهن‌تر آجارا پشت نمای امروزی باتومی دیده می‌شود، و به‌طور طبیعی با توقفی در ساحل نزدیک
    جفت می‌شود.
  tip: >-
    داخل دژ تقریباً هیچ سایه‌ای نیست، پس ظهر تابستان گرم و بسیار شرجی است — صبح یا اوایل شب خیلی بهتر
    است. کلاه و آب همراه ببرید. روی چمن داخل، کفش بسته بهتر است. دژ به مرز نزدیک است، پس پاسپورت یا کارت
    شناسایی همراه داشته باشید. خودرو را کنار جاده و نزدیک ورودی پارک کنید. کافه، مغازه و خودپرداز دو دقیقه
    دورتر در روستای گونیو است و ساحل درست آن سوی جاده.
  route: >-
    از تفلیس حدود 385 کیلومتر و پنج ساعت و پنجاه دقیقه راه است. با E60 تا باتومی بروید و بعد در جادهٔ
    ساحلی به سمت جنوب و از روی پل چوروخی ادامه دهید: از باتومی تا گونیو فقط 12 کیلومتر است، بسته به ترافیک
    بیست تا بیست‌وپنج دقیقه. جاده در تمام طول آسفالت خوبی دارد و خودروی اقتصادی کاملاً کافی است. دژ درست
    کنار بزرگراه است و از دست دادنش ناممکن. باک را در باتومی یا گونیو پر کنید؛ لازم نیست به سمت خود گذرگاه
    مرزی برانید.
he:
  name: מבצר גוניו-אפסארוס
  short: מצודה צבאית רומית מדרום לבטומי — 18 מגדלים, חפירות פעילות וקבר שהמסורת מקשרת לשליח.
  body: >-
    מבצר גוניו ניצב מדרום לבטומי, סמוך לגבול הטורקי, והוא אחד המבנים הצבאיים הרומיים המשומרים ביותר בשטח
    גאורגיה. בעת העתיקה הוא נודע בשם אפסארוס ושימש מעוז חשוב בגבולה המזרחי של האימפריה הרומית, מאויש בכוחות
    לגיון קבועים.


    התוכנית רומית אופיינית: היקף מלבני של כ-900 מטרים של חומה עם 18 מגדלים. קטעים נרחבים שרדו כמעט בגובהם
    המלא. המבצר שימש אחר כך את הביזנטים ולאחריהם את העות'מאנים, ולכן בנייה מכמה תקופות מונחת כאן זו על
    גבי זו, ותעלות החפירה שנפתחו בשטח עושות את הרבדים האלה גלויים לעין. בתוך החומות נמצאים החפירות הארכיאולוגיות
    — בית מרחץ רומי, מגורי חיילים ושרידי מערכת המים — מוזיאון קטן ובו מטבעות, קרמיקה וממצאים נוספים מן
    האתר, וקבר שהמסורת המקומית מייחסת לשליח מתיא.


    החצר הפנימית היא כיום מרחב דשא פתוח, והביקור בו אורך כשעה וחצי. זהו אחד המקומות שבהם ההיסטוריה העתיקה
    של אג'ריה נעשית גלויה מאחורי החזית המודרנית של בטומי, והוא משתלב באופן טבעי עם עצירה בחוף הסמוך שממש
    ממול.
  tip: >-
    בפנים כמעט אין צל, ולכן שעות הצהריים בקיץ חמות ולחות מאוד — הבוקר או שעות הערב המוקדמות טובים בהרבה.
    קחו כובע ומים. על הדשא הפנימי עדיפות נעליים סגורות. המבצר קרוב לגבול, אז החזיקו דרכון או תעודת זהות.
    החנו בכניסה בצד הכביש. בתי קפה, חנויות וכספומט נמצאים שתי דקות משם בכפר גוניו, והחוף ממש מעבר לכביש.
  route: >-
    מטביליסי מדובר בכ-385 ק״מ וחמש שעות וחמישים. סעו בכביש E60 עד בטומי, ומשם המשיכו דרומה בכביש החוף
    מעל גשר צ'ורוחי: מבטומי לגוניו יש רק 12 ק״מ, עשרים עד עשרים וחמש דקות תלוי בתנועה. הכביש הוא אספלט
    טוב לכל אורכו ורכב חסכוני מספיק לחלוטין. המבצר יושב ממש לצד הכביש הראשי ואי אפשר לפספס אותו. תדלקו
    בבטומי או בגוניו; אין צורך לנסוע לכיוון מעבר הגבול עצמו.
ar:
  name: حصن غونيو-أبساروس
  short: حصن عسكري روماني جنوب باتومي — 18 برجاً وحفريات نشطة وقبر تربطه التقاليد بأحد الرسل.
  body: >-
    يقف حصن غونيو جنوب باتومي قرب الحدود التركية، وهو من أفضل المنشآت العسكرية الرومانية حفظاً على الأرض
    الجورجية. وقد عُرف في العصور القديمة باسم أبساروس، وكان معقلاً مهماً على التخوم الشرقية للإمبراطورية
    الرومانية تحرسه حامية من قوات الفيالق.


    ومخططه روماني نمطي: محيط مستطيل من نحو 900 متر من الأسوار مع 18 برجاً. وقد بقيت مقاطع كبيرة منه بارتفاعها
    الكامل تقريباً. واستُخدم الحصن لاحقاً على يد البيزنطيين ثم العثمانيين، فتراكمت هنا أعمال البناء من
    عصور عدة بعضها فوق بعض، وتجعل خنادق التنقيب المفتوحة في الموقع هذه الطبقات مرئية للعين. وداخل الأسوار
    تجد الحفريات الأثرية — حمّاماً رومانياً وثكنات وبقايا شبكة المياه — ومتحفاً صغيراً فيه نقود وخزف وسواها
    من لُقى الموقع، وقبراً تنسبه التقاليد المحلية إلى الرسول متياس.


    والفناء الداخلي اليوم مساحة عشبية مفتوحة، وتستغرق الزيارة نحو ساعة ونصف. وهذا من الأماكن التي يظهر
    فيها تاريخ أدجارا الأقدم خلف الواجهة الحديثة لباتومي، وهو ينسجم طبيعياً مع وقفة على الشاطئ القريب
    الواقع عبر الطريق.
  tip: >-
    لا ظل يُذكر في الداخل، فمنتصف النهار صيفاً حار وشديد الرطوبة — والصباح أو أول المساء أفضل بكثير. خذ
    قبعة وماءً. والحذاء المغلق أنسب على العشب في الداخل. والحصن قريب من الحدود، فاحمل جواز سفرك أو بطاقة
    هويتك. اترك السيارة عند المدخل على جانب الطريق. والمقاهي والمتاجر والصراف الآلي على بعد دقيقتين في
    قرية غونيو، والشاطئ عبر الطريق مباشرة.
  route: >-
    من تبليسي المسافة نحو 385 كم وخمس ساعات وخمسين دقيقة. اسلك E60 نزولاً إلى باتومي، ثم واصل جنوباً على
    الطريق الساحلي عابراً جسر تشوروخي: فمن باتومي إلى غونيو 12 كم فقط، عشرون إلى خمس وعشرون دقيقة بحسب
    الازدحام. والطريق إسفلت جيد على امتداده وسيارة اقتصادية تكفي تماماً. ويقع الحصن بجوار الطريق السريع
    مباشرة ولا يمكن أن يفوتك. املأ الخزان في باتومي أو غونيو؛ ولا حاجة للقيادة نحو المعبر الحدودي نفسه.
