ka:
  name: ჯუთა და ჭაუხის მასივი
  short: საქართველოს ერთ-ერთი ყველაზე მაღალი დასახლებული სოფელი 2150 მეტრზე, ჭაუხის კლდოვანი კედლის ქვეშ.
  body: >-
    **ჯუთა 2150 მეტრზე, სნოს ხეობის თავში დგას, კლდის იმ კედლის ქვეშ, რომელსაც ქართველები საკუთარ დოლომიტებს
    უწოდებენ.** ეს ქვეყნის ერთ-ერთი ყველაზე მაღალი მუდმივად დასახლებული სოფელია: ქვის სახლების მიმოფანტული
    ჯგუფი და, დღეს უკვე, საოჯახო სასტუმროების უფრო დიდი ჯგუფი, ხეობას წინ კი ჭაუხის მასივი კეტავს.


    ჭაუხი ერთი მწვერვალი არაა, არამედ ღია ფერის კოშკებისა და შპილების ქედი — უმაღლესი წერტილი 3842 მეტრს
    აღწევს — და მიზეზი, რის გამოც ის კავკასიის დანარჩენ ნაწილს არ ჰგავს, ქანია: მაგარი, ღია და ვერტიკალურ
    ხაზებად დანაპრალებული, მაშინ როცა ირგვლივ მუქი ფიქალი და ბალახია. სოფლიდან კარგად გავლილი ბილიკი დაახლოებით
    ორ საათში ჭაუხის ამფითეატრამდე და კედლის ქვეშ არსებულ პატარა ტბამდე ადის; ეს სტანდარტული ნახევარდღიანი
    გასეირნებაა და ტექნიკურ უნარს არ მოითხოვს, მხოლოდ ფიზიკურ მდგომარეობას.


    სერიოზული მარშრუტი ჭაუხის უღელტეხილზე, დაახლოებით 3340 მეტრზე გადადის და ხევსურეთში, როშკასთან ეშვება,
    სადაც აბუდელაურის ტბებია. ეს გრძელი და პასუხისმგებლიანი დღეა, უთოვლო დაახლოებით ივლისიდან, და მას
    გვიან ან მარტო არ იწყებენ.


    ჯუთა სწრაფად შეიცვალა. 2012 წლამდე აქ რამდენიმე ოჯახი და გრუნტის გზა იყო; ახლა კაფეები, სოფლის ზემოთ
    ლოჯი და საზაფხულო ხალხმრავლობაა. მოხევე ოჯახები, რომლებიც აქ ცხოვრობენ, კვლავ მეურნეობენ და ზამთრისთვის
    მაინც ჩადიან, სეზონის გარეთ კი შენობების უმეტესობა დარაბადახურულია.


    ხეობის ფსკერი ზაფხულის დასაწყისში ჭაობიანია, სინათლე კი მზის ამოსვლის შემდეგ ორ საათში საუკეთესოა,
    როცა ჭაუხი განათებულია და სოფელი ჯერ კიდევ ჩრდილშია.
  tip: >-
    ექვსი საათი ასვლას, ამფითეატრამდე გასეირნებასა და ჭამას ფარავს. სოფლის შემდეგ მიწა სველია და ბილიკი
    ნაკადულებს კვეთს — ჩექმა და არა კროსოვკები. ამ სიმაღლეზე ამინდი სწრაფად იცვლება: წაიღე წვიმის ქურთუკი
    და ადრე დაიწყე სიარული, რადგან ღრუბელი ჭაუხზე ჩვეულებრივ შუადღის შემდეგ გროვდება. საოჯახო სასტუმროებს
    ივლის-აგვისტოში ჯავშანი სჭირდება და ოქტომბრიდან მაისამდე უმეტესობა დაკეტილია. მაღაზია, აფთიაქი და
    საწვავი არ არის, მობილურის სიგნალი წყვეტილია. ჭაუხის უღელტეხილზე გადასვლას რუკისა და ადრეული გასვლის
    გარეშე ნუ დაიწყებ.
  route: >-
    სამხედრო გზით (E117) ჩრდილოეთით აჩხოტამდე მიდიხარ, სტეფანწმინდამდე ცოტა ადრე, დაახლოებით 148 კმ, შემდეგ
    სნოს ხეობაში უხვევ. ასფალტი სოფელ სნომდე, ხუთ კილომეტრზე გრძელდება; ამის შემდეგ ჯუთამდე ბოლო რვა კილომეტრი
    უხეში, ქვიანი და ციცაბოა, ნაკადულების ფონებითა და ფხვიერი მონაკვეთებით, და დაბალი მანქანისთვის არ
    არის. სულ 165 კმ და სამი საათი და ორმოცდახუთი წუთი. სწორი არჩევანი კარგკლირენსიანი ჯიპია; სხვა შემთხვევაში
    მანქანა სნოში დატოვე და სტეფანწმინდიდან ადგილობრივი ჯიპით ადი. ბოლო საწვავი სტეფანწმინდაშია. გვიან
    შემოდგომიდან გაზაფხულამდე გზას თოვლი კეტავს.
en:
  name: Juta and the Chaukhi Massif
  short: One of Georgia's highest inhabited villages at 2,150 metres, under the pale rock wall of the
    Chaukhi ridge.
  body: >-
    **Juta sits at 2,150 metres at the head of the Sno valley, under a wall of rock that Georgians call
    their Dolomites.** It is one of the highest permanently inhabited villages in the country: a scatter
    of stone houses and, these days, a rather larger scatter of guesthouses, with the Chaukhi massif closing
    the valley in front of it.


    Chaukhi is not a single peak but a ridge of pale towers and spires, its highest point reaching 3,842
    metres. The reason it looks so unlike the rest of the Caucasus here is the rock — hard, light-coloured
    and fractured into vertical lines, where the surrounding mountains are dark shale and grass. From
    the village a well-used path climbs for about two hours to the Chaukhi amphitheatre and a small lake
    below the wall. This is the standard half-day walk and it needs no technical skill, only fitness.


    The serious route continues over the Chaukhi Pass at roughly 3,340 metres and drops into Khevsureti
    at Roshka, where the Abudelauri lakes lie. That is a long, committing day, clear of snow only from
    about July, and not to be started late or alone.


    Juta has changed fast. Before 2012 it was a handful of families and a track; there are now cafés,
    a lodge above the village and a summer crowd. The Mokheve families who live here still farm and still
    go down for the winter, and outside the season most of the buildings are shuttered.


    The valley floor is boggy in early summer, and the light is best in the two hours after sunrise, when
    Chaukhi is lit and the village is still in shadow. Wild flowers peak in late June and early July,
    and the meadows below the amphitheatre are as good a reason to walk up as the rock wall itself.
  tip: >-
    Six hours covers the drive up, the walk to the amphitheatre and a meal. Beyond the village the ground
    is wet and the path crosses streams, so boots rather than trainers. Weather changes fast at this altitude:
    carry a shell layer and start walking early, because cloud usually builds on Chaukhi after midday.
    Guesthouses need booking in July and August and most close from October to May. There is no shop,
    no pharmacy and no fuel, and mobile signal is patchy. Do not attempt the Chaukhi Pass crossing without
    a map and an early start.
  route: >-
    Follow the Military Highway (E117) north to Achkhoti just before Stepantsminda, about 148 km, then
    turn up the Sno valley. Asphalt runs the five kilometres to Sno village; after that the last eight
    kilometres to Juta are rough, stony and steep, with stream crossings and loose sections, and they
    are not for a low car. Total 165 km, three and three-quarter hours. A proper 4x4 with clearance is
    the right choice; otherwise leave the car at Sno and take one of the local jeeps from Stepantsminda.
    Last fuel in Stepantsminda. From late autumn to spring snow closes the track.
ru:
  name: Джута и массив Чаухи
  short: Одно из самых высоких обитаемых сёл Грузии на 2150 метрах, под светлой скальной стеной хребта
    Чаухи.
  body: >-
    **Джута лежит на высоте 2150 метров в верховьях ущелья Сно, под скальной стеной, которую грузины называют
    своими Доломитами.** Это одно из самых высоких постоянно обитаемых сёл страны: россыпь каменных домов
    и, сегодня, куда более обширная россыпь гостевых домов, а долину впереди закрывает массив Чаухи.


    Чаухи — не одна вершина, а гребень светлых башен и шпилей, высшая точка достигает 3842 метров. Он
    так не похож на остальной Кавказ из-за породы: твёрдой, светлой, разбитой вертикальными трещинами,
    тогда как окрестные горы — тёмный сланец и трава. От села хорошо натоптанная тропа поднимается примерно
    за два часа к амфитеатру Чаухи и маленькому озеру под стеной. Это стандартная полудневная прогулка,
    техники она не требует, только формы.


    Серьёзный маршрут идёт дальше через перевал Чаухи на высоте около 3340 метров и спускается в Хевсурети
    к Рошке, где лежат Абуделаурские озёра. Это долгий и ответственный день, свободный от снега примерно
    с июля, и начинать его поздно или в одиночку нельзя.


    Джута изменилась быстро. До 2012 года здесь были несколько семей и колея; теперь есть кафе, лодж выше
    села и летняя толпа. Живущие тут мохевские семьи по-прежнему держат хозяйство и на зиму спускаются
    вниз, а вне сезона большинство строений стоит закрытыми.


    Дно долины в начале лета заболочено, а лучший свет — в первые два часа после восхода, когда Чаухи
    освещён, а село ещё в тени.
  tip: >-
    Шести часов хватает на подъём, прогулку к амфитеатру и еду. За селом земля мокрая, тропа пересекает
    ручьи — ботинки, а не кроссовки. На такой высоте погода меняется быстро: берите непромокаемую куртку
    и выходите рано, потому что облака на Чаухи обычно наползают после полудня. Гостевые дома в июле и
    августе нужно бронировать, а с октября по май большинство закрыто. Ни магазина, ни аптеки, ни заправки,
    связь прерывистая. Переход через перевал Чаухи без карты и раннего старта не начинайте.
  route: >-
    По Военно-Грузинской дороге (E117) на север до Ачхоти перед Степанцминдой, около 148 км, затем поворот
    вверх по ущелью Сно. Асфальт тянется пять километров до села Сно; дальше последние восемь километров
    до Джуты — разбитая каменистая крутая колея с бродами и сыпучими участками, для низкой машины непроходимая.
    Всего 165 км и три часа сорок пять минут. Правильный выбор — настоящий внедорожник с клиренсом; иначе
    оставьте машину в Сно и возьмите местный джип из Степанцминды. Последняя заправка в Степанцминде.
    С поздней осени до весны дорогу закрывает снег.
fa:
  name: جوتا و تودهٔ چاوخی
  short: یکی از بلندترین روستاهای مسکونی گرجستان در 2150 متر، زیر دیوارهٔ سنگی روشن یال چاوخی.
  body: >-
    **جوتا در ارتفاع 2150 متر و در سرِ درهٔ سنو نشسته است، زیر دیواره‌ای از سنگ که گرجی‌ها آن را دولومیت‌های
    خود می‌خوانند.** از بلندترین روستاهای دائماً مسکون کشور است: پراکنده‌ای از خانه‌های سنگی و امروز پراکنده‌ای
    بزرگ‌تر از خانه‌های مهمان، و تودهٔ چاوخی دره را پیش رویش می‌بندد.


    چاوخی یک قله نیست بلکه یالی از برج‌ها و مناره‌های سنگی روشن است که بلندترین نقطه‌اش به 3842 متر می‌رسد.
    دلیل اینکه اینجا این‌قدر با بقیهٔ قفقاز فرق دارد، جنس سنگ است: سخت، روشن و شکافته به خطوط عمودی، در
    حالی که کوه‌های پیرامون از سنگ لوح تیره و علف‌اند. از روستا مسیری پرتردد در حدود دو ساعت تا آمفی‌تئاتر
    چاوخی و دریاچه‌ای کوچک زیر دیواره بالا می‌رود. این پیاده‌روی نیم‌روزهٔ استاندارد است و مهارت فنی نمی‌خواهد،
    تنها آمادگی بدنی.


    مسیر جدی از گردنهٔ چاوخی در حدود 3340 متر می‌گذرد و به خوسورتی و روستای روشکا فرود می‌آید، همان‌جا
    که دریاچه‌های آبودلااوری است. این روزی دراز و پرتعهد است، تنها از حدود تیر بی‌برف، و نباید دیر یا
    تنها آغازش کرد.


    جوتا سریع دگرگون شده است. پیش از 2012 چند خانوار بود و یک راه خاکی؛ اکنون کافه دارد و اقامتگاهی بالای
    روستا و جمعیتی تابستانی. خانواده‌های موخوه که اینجا زندگی می‌کنند هنوز دامداری و کشت می‌کنند و برای
    زمستان پایین می‌روند، و بیرون از فصل بیشتر بناها کرکره‌بسته است.


    کف دره در اوایل تابستان باتلاقی است و بهترین نور دو ساعت پس از طلوع است، وقتی چاوخی روشن است و روستا
    هنوز در سایه.
  tip: >-
    شش ساعت رانندگی به بالا و پیاده‌روی تا آمفی‌تئاتر و یک وعده غذا را پوشش می‌دهد. پس از روستا زمین خیس
    است و مسیر از جویبارها می‌گذرد، پس پوتین بپوشید نه کفش ورزشی. در این ارتفاع هوا تند عوض می‌شود: بارانی
    همراه ببرید و زود راه بیفتید، چون ابر معمولاً بعدازظهر روی چاوخی جمع می‌شود. خانه‌های مهمان در تیر
    و مرداد رزرو می‌خواهد و بیشترشان از مهر تا اردیبهشت بسته‌اند. نه مغازه‌ای هست، نه داروخانه‌ای و نه
    سوختی، و آنتن‌دهی بریده‌بریده است. گذشتن از گردنهٔ چاوخی را بدون نقشه و بدون شروع زودهنگام آغاز نکنید.
  route: >-
    بزرگراه نظامی (E117) را به شمال تا آچخوتی، درست پیش از استپان‌تسمیندا، بروید، حدود 148 کیلومتر، سپس
    به درهٔ سنو بپیچید. آسفالت پنج کیلومتر تا روستای سنو ادامه دارد؛ پس از آن هشت کیلومتر پایانی تا جوتا
    ناهموار و سنگلاخ و تند است، با گدارهای آب و بخش‌های سست، و به درد خودروی کم‌ارتفاع نمی‌خورد. رویهم
    165 کیلومتر و سه ساعت و چهل‌وپنج دقیقه. انتخاب درست خودروی چهارچرخ‌محرک واقعی با خلوص کافی است؛ وگرنه
    ماشین را در سنو بگذارید و یکی از جیپ‌های محلی استپان‌تسمیندا را بگیرید. آخرین سوخت در استپان‌تسمینداست.
    از اواخر پاییز تا بهار برف مسیر را می‌بندد.
he:
  name: יוטה ומסיף צ׳אוחי
  short: אחד הכפרים המיושבים הגבוהים בגאורגיה בגובה 2,150 מטר, מתחת לחומת הסלע הבהירה של רכס צ׳אוחי.
  body: >-
    **יוטה שוכנת בגובה 2,150 מטר בראש עמק סנו, מתחת לחומת סלע שהגאורגים מכנים הדולומיטים שלהם.** זהו אחד
    הכפרים המיושבים בקביעות הגבוהים במדינה: פזורה של בתי אבן, וכיום פזורה גדולה עוד יותר של בתי הארחה,
    ומסיף צ׳אוחי חוסם את העמק לפניו.


    צ׳אוחי אינו פסגה אחת אלא רכס של מגדלים וצריחי סלע בהירים, ונקודתו הגבוהה מגיעה ל-3,842 מטר. הסיבה
    שהוא נראה כאן כל כך שונה משאר הקווקז היא הסלע: קשה, בהיר ומבוקע לקווים אנכיים, בעוד ההרים סביב הם
    צפחה כהה ועשב. מן הכפר עולה שביל סלול היטב בכשעתיים אל האמפיתאטרון של צ׳אוחי ואל אגם קטן מתחת לחומה.
    זו ההליכה הסטנדרטית של חצי יום, והיא אינה דורשת מיומנות טכנית אלא כושר בלבד.


    המסלול הרציני ממשיך מעל מעבר צ׳אוחי בגובה כ-3,340 מטר ויורד לחווסורתי בכפר רושקה, שם שוכנים אגמי אבודלאורי.
    זהו יום ארוך ומחייב, נקי משלג רק החל מיולי בערך, ואין להתחיל אותו מאוחר או לבד.


    יוטה השתנתה מהר. לפני 2012 היו כאן קומץ משפחות ודרך עפר; היום יש בתי קפה, אכסניה מעל הכפר וקהל קיץ.
    משפחות המוחווה החיות כאן עדיין מגדלות בקר ועדיין יורדות לחורף, ומחוץ לעונה רוב המבנים סגורים בתריסים.


    קרקעית העמק בוצית בתחילת הקיץ, והאור הטוב ביותר הוא בשעתיים שאחרי הזריחה, כשצ׳אוחי מואר והכפר עדיין
    בצל.
  tip: >-
    שש שעות מכסות את הנסיעה למעלה, ההליכה לאמפיתאטרון וארוחה. מעבר לכפר הקרקע רטובה והשביל חוצה נחלים,
    לכן נעלי הליכה ולא נעלי ספורט. בגובה הזה מזג האוויר משתנה מהר: קחו שכבה אטומה וצאו מוקדם, כי העננות
    על צ׳אוחי נבנית בדרך כלל אחרי הצהריים. בתי ההארחה דורשים הזמנה ביולי ובאוגוסט ורובם סגורים מאוקטובר
    עד מאי. אין חנות, אין בית מרקחת ואין דלק, והקליטה חלקית. אל תתחילו את חציית מעבר צ׳אוחי בלי מפה ובלי
    יציאה מוקדמת.
  route: >-
    סעו בכביש הצבא (E117) צפונה עד אצ׳חוטי ממש לפני סטפנצמינדה, כ-148 ק״מ, ואז פנו במעלה עמק סנו. האספלט
    נמשך חמישה קילומטרים עד הכפר סנו; אחריו שמונת הקילומטרים האחרונים ליוטה גסים, אבניים ותלולים, עם מעברי
    נחל וקטעים תחוחים, ואינם לרכב נמוך. בסך הכול 165 ק״מ ושלוש שעות ארבעים וחמש. הבחירה הנכונה היא רכב
    שטח אמיתי עם מרווח גחון; אחרת השאירו את הרכב בסנו וקחו ג׳יפ מקומי מסטפנצמינדה. תחנת הדלק האחרונה בסטפנצמינדה.
    מסוף הסתיו ועד האביב השלג סוגר את הדרך.
ar:
  name: جوتا وكتلة تشاوخي
  short: من أعلى القرى المأهولة في جورجيا عند 2150 متراً، تحت جدار الصخر الفاتح لسلسلة تشاوخي.
  body: >-
    **تقع جوتا على ارتفاع 2150 متراً في رأس وادي سنو، تحت جدار صخري يسميه الجورجيون دولوميتهم.** وهي من
    أعلى القرى المأهولة على مدار السنة في البلاد: بيوت حجرية متناثرة، واليوم عدد أكبر من بيوت الضيافة،
    وتسد كتلة تشاوخي الوادي أمامها.


    تشاوخي ليست قمة واحدة بل سلسلة من أبراج ونِصال صخرية فاتحة، تبلغ أعلى نقطة فيها 3842 متراً. وسبب اختلافها
    الشديد عن بقية القوقاز هنا هو الصخر: صلب فاتح مشقق إلى خطوط عمودية، بينما الجبال المحيطة صخر صفائحي
    داكن وعشب. ومن القرية يصعد درب مطروق نحو ساعتين إلى مدرج تشاوخي وإلى بحيرة صغيرة تحت الجدار. هذه هي
    نزهة نصف اليوم المعتادة، ولا تحتاج مهارة فنية بل لياقة فقط.


    أما المسار الجاد فيتابع فوق ممر تشاوخي عند نحو 3340 متراً وينزل إلى خيفسوريتي عند روشكا، حيث بحيرات
    أبودلااوري. وهذا يوم طويل ومُلزِم، خالٍ من الثلج من تموز تقريباً، ولا يُبدأ متأخراً ولا منفرداً.


    تغيرت جوتا بسرعة. قبل 2012 كانت حفنة أسر ومسلكاً ترابياً؛ وفيها اليوم مقاهٍ ونزل فوق القرية وحشد صيفي.
    وما تزال أسر الموخيفي التي تعيش هنا تزرع وترعى وتنزل في الشتاء، وخارج الموسم تُغلق أكثر المباني.


    قاع الوادي موحل في أوائل الصيف، وأفضل ضوء في الساعتين بعد الشروق، حين تُضاء تشاوخي وتبقى القرية في
    الظل.
  tip: >-
    ست ساعات تغطي الصعود بالسيارة والمشي إلى المدرج ووجبة طعام. بعد القرية تكون الأرض رطبة ويعبر الدرب
    جداول، فالبس حذاءً جبلياً لا حذاء رياضة. ويتبدل الطقس سريعاً على هذا الارتفاع: احمل طبقة واقية وابدأ
    المشي باكراً، فالغيوم تتراكم على تشاوخي عادةً بعد الظهر. وبيوت الضيافة تحتاج حجزاً في تموز وآب ويغلق
    أكثرها من تشرين الأول إلى أيار. لا متجر ولا صيدلية ولا وقود، وتغطية الهاتف متقطعة. ولا تشرع في عبور
    ممر تشاوخي بلا خريطة وبلا انطلاق مبكر.
  route: >-
    اتبع الطريق العسكري (E117) شمالاً حتى أتشخوتي قبيل ستيبانتسميندا، نحو 148 كم، ثم انعطف صاعداً في وادي
    سنو. يمتد الإسفلت خمسة كيلومترات حتى قرية سنو؛ وبعدها تكون الكيلومترات الثمانية الأخيرة إلى جوتا وعرة
    وحجرية وشديدة الانحدار، بمخاضات وأجزاء هشة، ولا تصلح لسيارة منخفضة. المجموع 165 كم وثلاث ساعات وخمس
    وأربعون دقيقة. الخيار الصحيح دفع رباعي حقيقي بخلوص أرضي؛ وإلا فاترك السيارة في سنو وخذ إحدى سيارات
    الجيب المحلية من ستيبانتسميندا. وآخر وقود في ستيبانتسميندا. ومن أواخر الخريف إلى الربيع يغلق الثلج
    المسلك.
