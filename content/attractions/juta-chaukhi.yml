ka:
  name: ჯუთა და ჭაუხის მასივი
  short: >-
    ხევის მაღალმთიანი სოფელი, 2200 მეტრზე, სადაც XVIII საუკუნეში ხევსურები ჩამოსახლდნენ; ზემოთ ჭაუხის
    ღია ფერის კოშკები 3842 მეტრამდე აზიდულა.
  body: >-
    **ჯუთა ბოლო სოფელია კლდემდე: 2200 მეტრზე, სნოს ხეობის თავში, მისი ქვის სახლები ჭაუხის ღია ფერის კოშკებს
    უყურებს — იმ ქედს, რომელსაც ქართველები სიამოვნებით უწოდებენ თავიანთ დოლომიტებს.**


    XVIII საუკუნეში აქ, ერეკლე II-ის ნებართვით, ხევსურები ჩამოსახლდნენ. დღეს ჯუთაში არაბულები ცხოვრობენ
    — გვარი, რომელიც ხევსურეთს დღესაც ახსოვს. 2014 წლის აღწერამ სოფელში სულ 26 მცხოვრები დაითვალა; სოფლის
    მიწაში მცირე რაოდენობით მთის ბროლიც გვხვდება. ზაფხულში საოჯახო სასტუმროები და კაფეები თითქმის ძველ
    სახლებს აჭარბებს, ზამთრისთვის კი სოფელი დარაბებს ხურავს.


    ჭაუხი ერთი მწვერვალი არ არის — ეს კბილანა გვირგვინია ხევის კავკასიონზე, ყაზბეგისა და დუშეთის მუნიციპალიტეტების
    საზღვარზე. მისი ძირითადი მწვერვალი 3688 მეტრია, ყველაზე მაღალი კი ჩრდილოეთის ჭაუხია — 3842,5 მეტრი;
    გვერდით აღმოსავლეთისა (3644 მ) და დასავლეთის (3496 მ) ჭაუხები დგას. აქვე, ქედის იქით, ბაკურხევი იწყება
    — გუდამაყრის არაგვის ერთ-ერთი სათავე.


    სოფლიდან კარგად გათელილი ბილიკი ხეობას მიუყვება და დაახლოებით ორ საათში კედლის ძირამდე, ყვავილიან
    მდელოებსა და პატარა ტბებამდე მიდის. ტექნიკური უნარი არ სჭირდება, მხოლოდ ფიზიკური მომზადება. სერიოზული
    გზა კი ქედზე გადადის: ჭაუხის უღელტეხილით აბუდელაურის ტბებისკენ და ხევსურეთის როშკამდე — გრძელი დღე
    ან ორი, თოვლით, რომელიც ზოგჯერ ივლისამდე ძლებს, და მხოლოდ გამოცდილთათვის.


    ჭაუხის ის მხარე, რომელსაც ჯუთა უყურებს, ჩრდილო-დასავლეთისკენაა მიქცეული, ამიტომ მისი საათი საღამოა:
    დაბალი მზე ნაცრისფერ კლდეს თაფლისფრად აანთებს, სოფელი კი უკვე ჩრდილში ეშვება.
  tip: >-
    მანქანით ასვლას, კედლის ძირამდე გასეირნებასა და სადილს ექვსი საათი სჭირდება. სოფლის შემდეგ ბილიკი
    სველია და ნაკადულებს კვეთს, ამიტომ მთის ფეხსაცმელი ჩაიცვით, არა კედები. ამინდი აქ სწრაფად იცვლება
    და ღრუბელი ჭაუხზე ჩვეულებრივ შუადღის შემდეგ იკრიბება — წვიმის ქურთუკი წაიღეთ და სიარული ადრე დაიწყეთ.
    ივლის-აგვისტოში სასტუმროები წინასწარ დაჯავშნეთ; ოქტომბრიდან მაისამდე უმეტესობა დაკეტილია. მაღაზია,
    აფთიაქი და საწვავი არ არის, ბანკომატიც, მობილური კავშირი წყვეტილია — ნაღდი ფული სტეფანწმინდიდან წამოიღეთ.
    როშკისკენ გადასვლას რუკის, ადრეული გასვლისა და გამოცდილების გარეშე ნუ დაიწყებთ.
  route: >-
    საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთისკენ, ჯვრის უღელტეხილისა და კობის გავლით აჩხოტამდე იარეთ,
    სტეფანწმინდამდე ცოტა ადრე — დაახლოებით 148 კილომეტრი, — და სნოს ხეობაში შეუხვიეთ. სოფელ სნომდე ხუთი
    კილომეტრი ასფალტია; მის შემდეგ დაახლოებით ათი კილომეტრი ქვიანი გრუნტის გზაა აღმართებით, ფხვიერი მონაკვეთებითა
    და ნაკადულების ფონებით. სულ დაახლოებით 165 კილომეტრი და ოთხი საათი. სწორი არჩევანი მაღალი კლირენსის
    ნამდვილი ოთხწამყვანიანი ჯიპია, მით უფრო წვიმის შემდეგ; თუ დაბალი მანქანა გაქვთ, სნოში დატოვეთ და სტეფანწმინდიდან
    ადგილობრივი ჯიპით ადით. ბოლო საწვავი სტეფანწმინდაშია. გვიანი შემოდგომიდან გაზაფხულამდე გზას თოვლი
    კეტავს.
en:
  name: Juta and the Chaukhi Massif
  short: >-
    A Khevi village at 2,200 m, settled by Khevsurs in the 18th century, under the pale towers of Chaukhi
    rising to 3,842 m.
  body: >-
    **Juta is the last village before the rock: at 2,200 metres, at the head of the Sno valley, its stone
    houses face the pale towers of Chaukhi, the ridge Georgians like to call their Dolomites.**


    In the 18th century Khevsurs settled here with the permission of King Erekle II. The families of Juta
    today are Arabulis, a Khevsur name still. The 2014 census counted just 26 residents, and a little
    rock crystal turns up in the village ground. In summer the guesthouses and cafés almost outnumber
    the old houses; in winter the village shutters up.


    Chaukhi is not a single peak but a jagged crown on the Khevi range, on the border between Kazbegi
    and Dusheti municipalities. Its main summit stands at 3,688 metres, and the highest point, North Chaukhi,
    at 3,842.5 metres, with East and West Chaukhi at 3,644 and 3,496. On its far side rises the Bakurkhevi,
    one of the sources of the Gudamakari Aragvi.


    From the village a well-trodden path follows the valley to the foot of the wall, meadows full of flowers
    and a few small lakes in about two hours. It asks for fitness, not technique. The serious route goes
    over the top: the Chaukhi Pass to the Abudelauri lakes and down to Roshka in Khevsureti, a long day
    or two, with snow that can linger into July, and for experienced hikers only.


    The side of Chaukhi that Juta looks at faces north-west, so its hour is the evening, when the low
    sun turns grey rock the colour of honey while the village below is already sinking into shadow.
  tip: >-
    Six hours covers the drive up, the walk to the foot of the wall and a meal. Beyond the village the
    path is wet and crosses streams, so wear boots, not trainers. Weather changes fast here and cloud
    usually builds on Chaukhi after midday: carry a rain shell and start walking early. Book guesthouses
    ahead for July and August; most close from October to May. There is no shop, pharmacy, fuel or ATM,
    and mobile signal is patchy, so bring cash from Stepantsminda. Do not set out for Roshka without a
    map, an early start and experience.
  route: >-
    Take the Georgian Military Highway (S3/E117) north over the Jvari Pass and through Kobi to Achkhoti,
    just short of Stepantsminda, about 148 km, and turn up the Sno valley. Five kilometres of asphalt
    take you to Sno village; after that come roughly ten kilometres of stony dirt road with steep pitches,
    loose sections and stream crossings. In all it is about 165 km and four hours. A proper high-clearance
    4x4 is the right choice, especially after rain; otherwise leave a low car at Sno and take a local
    jeep from Stepantsminda. Last fuel in Stepantsminda. From late autumn to spring snow closes the road.
ru:
  name: Джута и массив Чаухи
  short: >-
    Высокогорное село Хеви (2200 м), основанное хевсурами в XVIII веке, под светлыми башнями Чаухи высотой
    до 3842 м.
  body: >-
    **Джута — последнее село перед скалой: на высоте 2200 метров, в верховьях долины Сно, его каменные
    дома смотрят на светлые башни Чаухи — хребта, который грузины любят называть своими Доломитами.**


    В XVIII веке здесь с позволения царя Ираклия II поселились хевсуры. Нынешние семьи Джуты — Арабули,
    и это по сей день хевсурская фамилия. Перепись 2014 года насчитала всего 26 жителей, а в здешней земле
    попадается немного горного хрусталя. Летом гостевых домов и кафе тут едва ли не больше, чем старых
    домов; на зиму село закрывает ставни.


    Чаухи — не одна вершина, а зубчатая корона на Хевском хребте, на границе Казбегского и Душетского
    муниципалитетов. Главная вершина поднимается на 3688 метров, высшая точка, Северный Чаухи, — на 3842,5
    метра, Восточный и Западный Чаухи — на 3644 и 3496. На другой стороне массива берёт начало Бакурхеви,
    один из истоков Гудамакарской Арагви.


    Из села хорошо натоптанная тропа идёт по долине к подножию стены — через цветущие луга, мимо нескольких
    маленьких озёр, примерно за два часа. Здесь нужна выносливость, а не техника. Серьёзный маршрут ведёт
    через хребет: Чаухский перевал, Абуделаурские озёра и спуск в Рошку в Хевсурети — долгий день или
    два, снег может лежать до июля, и идти стоит только опытным.


    Сторона Чаухи, на которую смотрит Джута, обращена на северо-запад, поэтому её час — вечер, когда низкое
    солнце окрашивает серую скалу в цвет мёда, а село внизу уже тонет в тени.
  tip: >-
    Шести часов хватит на подъём на машине, прогулку к подножию стены и обед. За селом тропа мокрая и
    пересекает ручьи, так что нужны ботинки, а не кроссовки. Погода здесь меняется быстро, и после полудня
    на Чаухи обычно собираются облака: берите дождевик и выходите пораньше. Гостевые дома на июль и август
    бронируйте заранее; большинство закрыто с октября по май. Магазина, аптеки, заправки и банкомата нет,
    связь неустойчивая, так что наличные везите из Степанцминды. Не отправляйтесь в Рошку без карты, раннего
    выхода и опыта.
  route: >-
    По Военно-Грузинской дороге (S3/E117) на север через Крестовый перевал и Коби до Ачхоти, не доезжая
    Степанцминды, около 148 км, и сверните в долину Сно. Пять километров асфальта ведут до села Сно; дальше
    примерно десять километров каменистой грунтовки с крутыми подъёмами, осыпающимися участками и бродами
    через ручьи. Всего около 165 км и четыре часа. Правильный выбор — настоящий полноприводный внедорожник
    с высоким клиренсом, особенно после дождя; иначе оставьте низкую машину в Сно и возьмите местный джип
    из Степанцминды. Последняя заправка — в Степанцминде. С поздней осени до весны дорогу закрывает снег.
fa:
  name: جوتا و تودهٔ چائوخی
  short: >-
    روستایی کوهستانی در خه‌وی، در ارتفاع ۲٬۲۰۰ متر، که خوسورها در سدهٔ هجدهم در آن ساکن شدند، زیر برج‌های
    سنگیِ روشن چائوخی که تا ۳٬۸۴۲ متر بالا می‌روند.
  body: >-
    **جوتا آخرین روستا پیش از صخره است: در ارتفاع ۲٬۲۰۰ متر، در بالای درهٔ سنو، خانه‌های سنگی‌اش رو به
    برج‌های روشن چائوخی دارند؛ ستیغی که گرجی‌ها دوست دارند «دولومیت‌های» خودشان بنامندش.**


    در سدهٔ هجدهم خوسورها با اجازهٔ ارکلی دوم، پادشاه کارتلی-کاختی، اینجا ساکن شدند. خانواده‌های امروز
    جوتا آرابولی‌اند، نامی که هنوز نام خانوادگی خوسوری است. سرشماری ۲۰۱۴ تنها ۲۶ ساکن شمرد، و در خاک روستا
    اندکی بلور کوهی پیدا می‌شود. تابستان‌ها مهمان‌خانه‌ها و کافه‌ها کمابیش از خانه‌های قدیمی بیشترند؛
    زمستان روستا کرکره‌هایش را پایین می‌کشد.


    چائوخی یک قله نیست، بلکه تاجی دندانه‌دار بر رشته‌کوه خه‌وی است، بر مرز شهرستان‌های کازبگی و دوشتی.
    قلهٔ اصلی‌اش ۳٬۶۸۸ متر ارتفاع دارد و بلندترین نقطه، چائوخی شمالی، ۳٬۸۴۲٫۵ متر؛ چائوخی شرقی و غربی
    ۳٬۶۴۴ و ۳٬۴۹۶ مترند. در سوی دیگرش رود باکورخوی سر برمی‌آورد، یکی از سرچشمه‌های آراگوی گوداماکاری.


    از روستا کوره‌راهی کوبیده دره را دنبال می‌کند تا پای دیواره، از میان علفزارهای پرگل و از کنار چند
    دریاچهٔ کوچک، در حدود دو ساعت. آمادگی بدنی می‌خواهد، نه مهارت فنی. مسیر جدی از روی ستیغ می‌گذرد: گردنهٔ
    چائوخی تا دریاچه‌های آبودلائوری و فرود به روشکا در خوسورتی، یک روز طولانی یا دو روز، با برفی که ممکن
    است تا ژوئیه بماند، و تنها برای کوهنوردان باتجربه.


    آن رویِ چائوخی که جوتا به آن نگاه می‌کند رو به شمال‌غرب است، پس ساعتِ آن غروب است، وقتی خورشیدِ پایین
    سنگ خاکستری را به رنگ عسل درمی‌آورد و روستای پایین از پیش در سایه فرو رفته است.
  tip: >-
    شش ساعت برای رانندگی تا بالا، پیاده‌روی تا پای دیواره و یک وعده غذا کافی است. پس از روستا کوره‌راه
    خیس است و از نهرها می‌گذرد، پس پوتین بپوشید نه کفش ورزشی. هوا اینجا زود عوض می‌شود و ابرها معمولاً
    پس از نیمروز روی چائوخی جمع می‌شوند: بارانی همراه داشته باشید و زود راه بیفتید. مهمان‌خانه‌ها را برای
    ژوئیه و اوت از پیش رزرو کنید؛ بیشترشان از اکتبر تا مه بسته‌اند. مغازه، داروخانه، پمپ‌بنزین و خودپرداز
    نیست و آنتن موبایل گاه هست و گاه نیست، پس پول نقد را از استپانتسمیندا بیاورید. بی‌نقشه، بی‌آنکه سحرگاه
    راه بیفتید و بی‌تجربه راهی روشکا نشوید.
  route: >-
    جادهٔ نظامی گرجستان (S3/E117) را به سوی شمال بروید، از گردنهٔ جواری و کوبی بگذرید تا آچخوتی، کمی پیش
    از استپانتسمیندا، حدود ۱۴۸ کیلومتر، و به درهٔ سنو بپیچید. پنج کیلومتر آسفالت شما را به روستای سنو
    می‌رساند؛ پس از آن حدود ده کیلومتر جادهٔ خاکیِ سنگلاخ با شیب‌های تند، بخش‌های سست و گذر از نهرها در
    پیش است. روی‌هم حدود ۱۶۵ کیلومتر و چهار ساعت. انتخاب درست یک خودروی چهارچرخ‌محرکِ واقعی با فاصلهٔ
    زیاد از زمین است، به‌ویژه پس از باران؛ وگرنه خودروی کوتاه را در سنو بگذارید و از استپانتسمیندا جیپی
    محلی بگیرید. آخرین پمپ‌بنزین در استپانتسمینداست. از اواخر پاییز تا بهار برف جاده را می‌بندد.
he:
  name: ג'וטה ומסיף צ'אוחי
  short: >-
    כפר הררי בחבי, בגובה 2,200 מטר, שהתיישבו בו חבסורים במאה ה-18, למרגלות מגדלי הסלע הבהירים של צ'אוחי
    המתנשאים עד 3,842 מטר.
  body: >-
    **ג'וטה היא הכפר האחרון לפני הסלע: בגובה 2,200 מטר, בראש עמק סנו, בתי האבן שלה צופים אל המגדלים הבהירים
    של צ'אוחי, הרכס שהגאורגים אוהבים לכנות "הדולומיטים שלהם".**


    במאה ה-18 התיישבו כאן חבסורים ברשותו של המלך ארקלה השני. המשפחות בג'וטה כיום נושאות את שם המשפחה ארבולי,
    שם חבסורי עד היום. במפקד של 2014 נמנו כאן 26 תושבים בלבד, ובאדמת הכפר מתגלה מעט בדולח הרים. בקיץ בתי
    ההארחה ובתי הקפה כמעט עולים במספרם על הבתים הישנים; בחורף הכפר מגיף את תריסיו.


    צ'אוחי אינו פסגה אחת אלא כתר משונן על רכס חבי, על הגבול בין המוניציפליות של קזבגי ושל דושתי. פסגתו
    הראשית מתנשאת לגובה 3,688 מטר, והנקודה הגבוהה ביותר, צ'אוחי הצפוני, ל-3,842.5 מטר; צ'אוחי המזרחי והמערבי
    מגיעים ל-3,644 ול-3,496 מטר. בצדו השני נובע הבקורחבי, אחד ממקורות נהר גודמקרי אראגווי.


    מן הכפר עוקב שביל כבוש אחר העמק עד למרגלות החומה, דרך כרי דשא מלאי פרחים וכמה אגמים קטנים, בתוך כשעתיים.
    הוא דורש כושר, לא מיומנות טכנית. המסלול הרציני עובר מעל הרכס: מעבר צ'אוחי אל אגמי אבודלאורי וירידה
    לרושקה שבחבסורטי, יום ארוך או יומיים, עם שלג שעלול להישאר עד יולי, ולמטיילים מנוסים בלבד.


    הצד של צ'אוחי שג'וטה צופה אליו פונה צפון-מערבה, ולכן שעתו היא הערב, כשהשמש הנמוכה צובעת את הסלע האפור
    בגוון דבש, בעוד הכפר שלמטה כבר שוקע בצל.
  tip: >-
    שש שעות מספיקות לנסיעה למעלה, להליכה עד למרגלות החומה ולארוחה. מעבר לכפר השביל רטוב וחוצה פלגים, אז
    נעלו נעלי הליכה גבוהות ולא נעלי ספורט. מזג האוויר משתנה כאן במהירות, ועננים מצטברים בדרך כלל על צ'אוחי
    אחרי הצהריים: קחו מעיל גשם וצאו לדרך מוקדם. הזמינו בתי הארחה מראש ליולי ולאוגוסט; רובם סגורים מאוקטובר
    עד מאי. אין חנות, בית מרקחת, דלק או כספומט, והקליטה הסלולרית מקוטעת, אז הביאו מזומן מסטפנצמינדה. אל
    תצאו לרושקה בלי מפה, בלי יציאה מוקדמת ובלי ניסיון.
  route: >-
    סעו בדרך הצבאית הגאורגית (S3/E117) צפונה מעל מעבר ג'ווארי ודרך קובי עד אצ'חוטי, מעט לפני סטפנצמינדה,
    כ-148 ק"מ, ופנו אל עמק סנו. חמישה קילומטרים של אספלט מובילים לכפר סנו; אחריהם באים כעשרה קילומטרים
    של דרך עפר אבנית, עם עליות תלולות, קטעים של חצץ רופף וחציות פלגים. בסך הכול כ-165 ק"מ וארבע שעות.
    הבחירה הנכונה היא רכב שטח אמיתי בהנעה כפולה ועם מרווח גחון גבוה, במיוחד אחרי גשם; אחרת השאירו רכב
    נמוך בסנו וקחו ג'יפ מקומי מסטפנצמינדה. הדלק האחרון בסטפנצמינדה. מסוף הסתיו ועד האביב השלג סוגר את
    הדרך.
ar:
  name: جوتا وكتلة تشاوخي
  short: >-
    قرية جبلية في خيفي على ارتفاع 2,200 متر، استوطنها الخيفسوريون في القرن الثامن عشر، تحت أبراج تشاوخي
    الشاحبة التي تبلغ 3,842 متراً.
  body: >-
    **جوتا آخر قرية قبل الصخر: على ارتفاع 2,200 متر، في رأس وادي سنو، تطلّ بيوتها الحجرية على أبراج تشاوخي
    الشاحبة، السلسلة التي يحلو للجورجيين أن يسمّوها «دولوميتهم».**


    في القرن الثامن عشر استوطن الخيفسوريون هذا المكان بإذن الملك هرقل الثاني (إريكلي). وعائلات جوتا اليوم
    من آل أرابولي، وهو اسم خيفسوري حتى الآن. وأحصى تعداد 2014 هنا 26 ساكناً فقط، وفي تربة القرية يظهر
    قليل من البلّور الصخري. في الصيف تكاد بيوت الضيافة والمقاهي تفوق البيوت القديمة عدداً؛ وفي الشتاء
    تُغلق القرية مصاريع نوافذها.


    ليست تشاوخي قمة واحدة، بل هي تاج مسنّن على سلسلة خيفي الجبلية، على الحدود بين بلديتي كازبيغي ودوشيتي.
    تبلغ قمتها الرئيسية 3,688 متراً، وأعلى نقطة فيها، تشاوخي الشمالية، 3,842.5 متراً، أما تشاوخي الشرقية
    والغربية فتبلغان 3,644 و3,496 متراً. وعلى جانبها الآخر ينبع نهر باكورخيفي، أحد منابع نهر غوداماكاري
    أراغفي.


    ومن القرية يتبع درب مطروق الوادي حتى قاعدة الجدار، عبر مروج مزهرة وبضع بحيرات صغيرة، في نحو ساعتين.
    يتطلب لياقة لا مهارة تقنية. أما المسار الجادّ فيعبر السلسلة: ممر تشاوخي إلى بحيرات أبوديلاوري ثم نزولاً
    إلى روشكا في خيفسوريتي، يوم طويل أو يومان، مع ثلج قد يبقى حتى يوليو، وللمتنزهين المتمرسين فقط.


    الوجه الذي تطلّ عليه جوتا من تشاوخي يواجه الشمال الغربي، ولذا فساعته المساء، حين تصبغ الشمس المنخفضة
    الصخر الرمادي بلون العسل، بينما تغرق القرية في الأسفل في الظل.
  tip: >-
    تكفي ست ساعات للصعود بالسيارة والمشي إلى قاعدة الجدار وتناول وجبة. بعد القرية يصبح الدرب مبللاً ويعبر
    جداول، فانتعل حذاء مشي متيناً لا حذاءً رياضياً. يتغير الطقس هنا بسرعة، وتتجمع الغيوم عادة على تشاوخي
    بعد الظهر: احمل سترة واقية من المطر وابدأ المشي باكراً. احجز بيوت الضيافة مسبقاً في يوليو وأغسطس؛
    ومعظمها يُغلق من أكتوبر إلى مايو. لا متجر ولا صيدلية ولا وقود ولا صراف آلي، وتغطية الهاتف متقطعة،
    فأحضر النقود من ستيبانتسميندا. لا تنطلق إلى روشكا من دون خريطة وانطلاقة مبكرة وخبرة.
  route: >-
    اسلك الطريق العسكري الجورجي (S3/E117) شمالاً فوق ممر جواري وعبر كوبي إلى أتشخوتي، قبيل ستيبانتسميندا،
    نحو 148 كم، ثم انعطف صعوداً في وادي سنو. خمسة كيلومترات من الإسفلت توصلك إلى قرية سنو؛ وبعدها نحو
    عشرة كيلومترات من طريق ترابي حجري فيه منحدرات حادة ومقاطع رخوة وعبور جداول. المسافة الإجمالية نحو
    165 كم وأربع ساعات. الخيار الصحيح سيارة دفع رباعي حقيقية عالية الخلوص، ولا سيما بعد المطر؛ وإلا فاترك
    السيارة المنخفضة في سنو واستقل سيارة جيب محلية من ستيبانتسميندا. آخر محطة وقود في ستيبانتسميندا. ومن
    أواخر الخريف حتى الربيع يغلق الثلج الطريق.
