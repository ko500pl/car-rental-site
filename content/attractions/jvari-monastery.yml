ka:
  name: ჯვრის მონასტერი
  short: >-
    VI საუკუნის ტაძარი კლდის თავზე, საიდანაც არაგვისა და მტკვრის შეერთება იშლება — ქართული არქიტექტურის
    საწყისი წერტილი.
  body: >-
    **ჯვარი ის შენობაა, რომლითაც ქართული ხუროთმოძღვრება იწყება.** ის 586–605 წლებში აშენდა მცხეთის თავზე
    აღმართულ კლდოვან მთაზე, იმ ადგილას, სადაც გადმოცემით წმინდა ნინომ IV საუკუნეში პირველი ხის ჯვარი აღმართა.
    ტაძარი 1994 წელს იუნესკოს მსოფლიო მემკვიდრეობის სიაში შევიდა მცხეთის ისტორიული ძეგლების ჯგუფში.


    არქიტექტურულად ჯვარი გარდამტეხი ნაბიჯია: აქ პირველად ჩამოყალიბდა ე.წ. „ტეტრაკონქის" სქემა — ოთხივე
    მხრიდან აფსიდები, ცენტრში გუმბათი, სრული სიმეტრია. ამ მოდელს შემდეგ მთელი კავკასია იმეორებდა საუკუნეების
    განმავლობაში. შენობა თითქმის უსახური სიმარტივისაა: არც მოხატულობა, არც ოქრო — მხოლოდ ქვა, სინათლის
    სვეტი გუმბათიდან და პროპორცია.


    ჯვრის მთავარი ეფექტი მაინც ხედია. კლდის კიდიდან ქვემოთ ჩანს:


    - არაგვისა და მტკვრის შესართავი, სადაც ორი განსხვავებული ფერის წყალი ერთდება

    - მცხეთა სვეტიცხოვლის გუმბათით, თითქოს მაკეტი

    - ბაგრატიონების დროინდელი ველი და შორეული მთები


    ლერმონტოვის „მწირი" სწორედ აქ არის დაწერილი გარემოზე დაყრდნობით — ეს ის პეიზაჟია, რომელმაც რუსული
    რომანტიზმის ერთი მთავარი ტექსტი შვა. მონასტერი მოქმედია და ღამის განათებაში მცხეთიდანაც კარგად ჩანს.
  tip: >-
    მოდი დილით ადრე ან საღამოს — შუადღისას აქ ტურისტული ავტობუსების ნაკადია და კლდეზე ჩრდილი არ არის.
    ქარი წლის ნებისმიერ დროს ძლიერია, ზამთარში კი მოყინული მოედანი სახიფათოა. ჩაცმის კოდი მოქმედებს: ქალებს
    თავსაფარი და გრძელი კალთა, მამაკაცებს გრძელი შარვალი; შესასვლელთან უფასო ნიფხავებია. ერთი საათი სავსებით
    საკმარისია. ტუალეტი პარკინგთანაა, კაფე — არა; სუვენირების ჯიხურები ზაფხულში მუშაობს.
  route: >-
    თბილისიდან გახვალ ჩრდილოეთისკენ საქართველოს სამხედრო გზით (E117) და მცხეთის გასწვრივ არ გადაუხვევ
    ქალაქში — ჯვრის მისასვლელი ცალკე მოსახვევია, მდინარის მარცხენა მხარეს, ხიდის შემდეგ. იქიდან ვიწრო,
    მაგრამ სრულად ასფალტირებული სერპანტინი 7 კმ-ზე ადის კლდის თავამდე. სულ თბილისიდან ნახევარ საათზე ცოტა
    მეტი. ზემოთ დიდი უფასო პარკინგია. საწვავი აიღე მცხეთის შესასვლელთან. ეკონომ-კლასის ავტომობილი სავსებით
    საკმარისია, ზამთარში მხოლოდ ყინულზე სიფრთხილეა საჭირო.
en:
  name: Jvari Monastery
  short: >-
    A 6th-century church on a cliff above the meeting of the Aragvi and Mtkvari — the starting point of
    Georgian architecture.
  body: >-
    **Jvari is the building Georgian architecture starts from.** It was raised between 586 and 605 on
    the rocky hill above Mtskheta, on the spot where Saint Nino is said to have set up the first wooden
    cross in the 4th century. It was inscribed on the UNESCO World Heritage list in 1994 as part of the
    Historical Monuments of Mtskheta.


    Architecturally it is a turning point. Jvari established the tetraconch plan — four apses around a
    central domed space, fully symmetrical — and that model was copied across the Caucasus for the next
    several centuries. The building itself is almost aggressively plain: no frescoes, no gilding, only
    stone, proportion and a column of light falling from the dome.


    The other half of Jvari is the view. From the edge of the rock you look down on:


    - The confluence of the Aragvi and the Mtkvari, where two differently coloured rivers meet without
    mixing at first

    - Mtskheta laid out like a model, with the dome of Svetitskhoveli at its centre

    - The old royal plain and the first ridges of the Greater Caucasus behind it


    Lermontov wrote *Mtsyri* from this landscape, which makes the hilltop a minor pilgrimage for Russian
    readers as well as Orthodox ones. The monastery is active, and at night it is floodlit and visible
    from the town below.
  tip: >-
    Come early in the morning or towards evening; at midday coach parties arrive in waves and there is
    no shade at all on the rock. The wind here is strong in every season, and in winter the icy forecourt
    is genuinely slippery. The dress code is enforced: headscarf and long skirt for women, long trousers
    for men, with free wraps available at the entrance. An hour is enough. There are toilets by the car
    park but no café; souvenir stalls open in summer.
  route: >-
    Leave Tbilisi northwards on the Georgian Military Highway (E117) and do not turn off into Mtskheta
    itself — the Jvari access road is a separate turning on the left bank of the river, just after the
    bridge. From there a narrow but fully asphalted switchback climbs about seven kilometres to the top
    of the cliff. The whole trip takes a little over half an hour. There is a large free car park at the
    summit and fuel stations at the Mtskheta turn-off. An economy car is perfectly adequate; in winter
    the only issue is ice on the bends.
ru:
  name: Монастырь Джвари
  short: Храм VI века на скале над слиянием Арагви и Куры — точка отсчёта грузинской архитектуры.
  body: >-
    **Джвари — здание, с которого начинается грузинская архитектура.** Храм построен между 586 и 605 годами
    на скалистой горе над Мцхетой, на месте, где, по преданию, святая Нино в IV веке водрузила первый
    деревянный крест. В 1994 году он вошёл в список Всемирного наследия ЮНЕСКО в составе исторических
    памятников Мцхеты.


    Архитектурно это переломный момент. Именно в Джвари сложилась схема тетраконха — четыре апсиды вокруг
    центрального подкупольного пространства, полная симметрия. Эту модель потом повторяли по всему Кавказу
    несколько столетий. Само здание подчёркнуто аскетично: ни фресок, ни позолоты, только камень, пропорция
    и столб света из купола.


    Вторая половина Джвари — это вид. С края скалы внизу открываются:


    - Слияние Арагви и Куры, где две реки разного цвета некоторое время текут не смешиваясь

    - Мцхета, лежащая как макет, с куполом Светицховели в центре

    - Старая царская долина и первые хребты Большого Кавказа за ней


    Именно этот пейзаж стоит за лермонтовским «Мцыри», так что для русского читателя холм — отдельное
    место паломничества. Монастырь действующий, ночью он подсвечен и хорошо виден из города внизу.
  tip: >-
    Приезжайте рано утром или ближе к вечеру: днём сюда волнами подходят автобусы, а тени на скале нет
    совсем. Ветер здесь сильный в любое время года, зимой обледеневшая площадка по-настоящему скользкая.
    Дресс-код соблюдают: платок и длинная юбка женщинам, длинные брюки мужчинам, накидки выдают бесплатно
    у входа. Часа достаточно. Туалеты есть у парковки, кафе нет; сувенирные лавки работают летом.
  route: >-
    Из Тбилиси едете на север по Военно-Грузинской дороге (E117) и не сворачиваете в саму Мцхету — подъезд
    к Джвари отдельный, на левом берегу реки, сразу за мостом. Оттуда узкий, но полностью асфальтированный
    серпантин поднимается примерно на семь километров до вершины скалы. Вся дорога занимает чуть больше
    получаса. Наверху большая бесплатная парковка, заправки — у поворота на Мцхету. Машины эконом-класса
    вполне достаточно, зимой единственная проблема — лёд на поворотах.
fa:
  name: صومعهٔ جواری
  short: کلیسایی از سدهٔ ششم بر صخره‌ای مشرف به محل به‌هم‌پیوستن آراگوی و متکواری — نقطهٔ آغاز معماری
    گرجی.
  body: >-
    **جواری بنایی است که معماری گرجی از آن آغاز می‌شود.** میان 586 و 605 بر تپهٔ صخره‌ای بالای متسختا
    برپا شد، درست همان‌جا که می‌گویند نینوی قدیس در سدهٔ چهارم نخستین صلیب چوبی را برافراشت. در 1994 به‌عنوان
    بخشی از بناهای تاریخی متسختا در فهرست میراث جهانی یونسکو ثبت شد.


    از نظر معماری این یک نقطهٔ چرخش است. جواری نقشهٔ تتراکنک را تثبیت کرد — چهار شبستان نیم‌دایره پیرامون
    فضایی گنبددار در مرکز، کاملاً متقارن — و همین الگو در سده‌های بعد در سراسر قفقاز تکرار شد. خود بنا
    تقریباً به‌شکلی تهاجمی ساده است: نه نقاشی دیواری، نه زراندود، تنها سنگ، تناسب و ستونی از نور که از
    گنبد فرو می‌ریزد.


    نیمهٔ دیگر جواری منظره است. از لبهٔ صخره به اینها نگاه می‌کنید:


    - محل به‌هم‌پیوستن آراگوی و متکواری، جایی که دو رود با رنگ‌های متفاوت به هم می‌رسند و در آغاز درنمی‌آمیزند

    - متسختا که مثل ماکت گسترده شده، با گنبد سوتیتسخوولی در میانه‌اش

    - دشت کهن سلطنتی و نخستین ستیغ‌های قفقاز بزرگ در پس آن


    لرمانتوف *متسیری* را از دل همین چشم‌انداز نوشت، و همین قلهٔ تپه را برای خوانندگان روس هم به اندازهٔ
    مؤمنان ارتدکس به زیارتگاهی کوچک بدل کرده است. صومعه فعال است و شب‌ها نورافکن‌ها روشنش می‌کنند، چنان‌که
    از شهر پایین دیده می‌شود.
  tip: >-
    صبح زود بیایید یا نزدیک غروب؛ ظهرها اتوبوس‌های تور موج‌موج می‌رسند و روی صخره اصلاً سایه‌ای نیست.
    باد اینجا در همهٔ فصل‌ها تند است و زمستان‌ها محوطهٔ یخ‌زدهٔ جلوی کلیسا واقعاً لغزنده می‌شود. کد پوشش
    اجرا می‌شود: روسری و دامن بلند برای زنان، شلوار بلند برای مردان، با پارچه‌های رایگان در ورودی. یک
    ساعت کافی است. کنار پارکینگ سرویس بهداشتی هست اما کافه نه؛ دکه‌های سوغاتی در تابستان باز می‌شوند.
  route: >-
    از تفلیس به سوی شمال روی بزرگراه نظامی گرجستان (E117) بروید و به خود متسختا نپیچید — جادهٔ دسترسی
    جواری انحرافی جداگانه در کرانهٔ چپ رود است، درست پس از پل. از آنجا سرپیچی باریک اما کاملاً آسفالت
    حدود هفت کیلومتر تا نوک صخره بالا می‌رود. کل سفر کمی بیش از نیم ساعت طول می‌کشد. در قله پارکینگ بزرگ
    و رایگان هست و پمپ‌بنزین‌ها کنار انحراف متسختا. ماشین اقتصادی کاملاً کافی است؛ زمستان‌ها تنها مسئله
    یخ روی پیچ‌هاست.
he:
  name: מנזר ג'וארי
  short: כנסייה מן המאה ה-6 על צוק מעל מפגש האראגווי והמטקווארי — נקודת המוצא של האדריכלות הגאורגית.
  body: >-
    **ג'וארי הוא הבניין שממנו מתחילה האדריכלות הגאורגית.** הוא הוקם בין 586 ל-605 על הגבעה הסלעית שמעל
    מצחתה, במקום שבו לפי המסורת הציבה נינו הקדושה את הצלב העצי הראשון במאה ה-4. ב-1994 הוא נרשם ברשימת
    המורשת העולמית של אונסקו כחלק מן האנדרטאות ההיסטוריות של מצחתה.


    מבחינה אדריכלית זו נקודת מפנה. ג'וארי ביסס את תוכנית הטטרקונכה — ארבע אפסידות סביב חלל מרכזי מכוסה
    כיפה, בסימטריה מלאה — והדגם הזה הועתק ברחבי הקווקז במשך כמה מאות שנים. הבניין עצמו פשוט כמעט עד כדי
    תוקפנות: בלי ציורי קיר, בלי הזהבה, רק אבן, פרופורציה ועמוד אור שנופל מן הכיפה.


    החצי השני של ג'וארי הוא הנוף. מקצה הסלע משקיפים על:


    - מפגש האראגווי והמטקווארי, שם נפגשים שני נהרות בצבעים שונים ואינם מתערבבים בהתחלה

    - מצחתה הפרושה כמו דגם, ובמרכזה כיפת סווטיצחוולי

    - המישור המלכותי הישן ורכסיו הראשונים של הקווקז הגדול מאחוריו


    לרמונטוב כתב את *מציירי* מתוך הנוף הזה, מה שהופך את ראש הגבעה לעלייה לרגל קטנה גם עבור קוראים רוסים
    ולא רק עבור מאמינים אורתודוקסים. המנזר פעיל, ובלילה הוא מואר בזרקורים ונראה מן העיירה שלמטה.
  tip: >-
    הגיעו מוקדם בבוקר או לקראת ערב; בצהריים מגיעות קבוצות אוטובוסים בגלים ואין שום צל על הסלע. הרוח כאן
    חזקה בכל עונה, ובחורף הרחבה הקפואה שלפני הכנסייה חלקלקה באמת. קוד הלבוש נאכף: מטפחת ראש וחצאית ארוכה
    לנשים, מכנסיים ארוכים לגברים, וכיסויים חינם זמינים בכניסה. שעה מספיקה. יש שירותים ליד החניון אך אין
    בית קפה; דוכני מזכרות נפתחים בקיץ.
  route: >-
    צאו מטביליסי צפונה בכביש הצבא הגאורגי (E117) ואל תפנו אל תוך מצחתה עצמה — דרך הגישה לג'וארי היא פנייה
    נפרדת בגדה השמאלית של הנהר, מיד אחרי הגשר. משם עולה סרפנטינה צרה אך סלולה לחלוטין כשבעה קילומטרים
    אל ראש הצוק. כל הנסיעה אורכת מעט יותר מחצי שעה. בפסגה יש חניון גדול וחינם, ותחנות דלק נמצאות בצומת
    מצחתה. רכב אקונומי מספיק לחלוטין; בחורף הבעיה היחידה היא קרח על הסיבובים.
ar:
  name: دير جفاري
  short: كنيسة من القرن السادس على جرف فوق ملتقى أراغفي ومتكفاري — نقطة انطلاق العمارة الجورجية.
  body: >-
    **جفاري هو المبنى الذي تبدأ منه العمارة الجورجية.** أُقيم بين عامي 586 و605 على التل الصخري فوق متسخيتا،
    في الموضع الذي يُقال إن القديسة نينو نصبت فيه أول صليب خشبي في القرن الرابع. وقد أُدرج على قائمة التراث
    العالمي لليونسكو عام 1994 ضمن الآثار التاريخية لمتسخيتا.


    ومعمارياً هو نقطة تحول. فقد أرسى جفاري مخطط الحنيات الأربع — أربع حنيات حول فراغ مركزي مقبب، متناظر
    تماماً — ونُسخ هذا النموذج في أنحاء القوقاز طوال القرون التالية. والمبنى نفسه بسيط ببساطة تكاد تكون
    عدوانية: لا رسوم جدارية ولا تذهيب، بل حجر ونسب وعمود من الضوء ينزل من القبة.


    والنصف الآخر من جفاري هو الإطلالة. فمن حافة الصخر تنظر إلى:


    - ملتقى أراغفي ومتكفاري، حيث يلتقي نهران مختلفا اللون دون أن يمتزجا في البداية

    - متسخيتا ممتدة كالمجسم، وفي وسطها قبة سفيتيتسخوفيلي

    - السهل الملكي القديم وأولى سلاسل القوقاز الكبرى خلفه


    وقد كتب ليرمونتوف *متسيري* من وحي هذا المشهد، ما يجعل قمة التل مزاراً صغيراً للقراء الروس كما للمؤمنين
    الأرثوذكس. والدير عامل، وفي الليل تضيئه الكشافات فيُرى من البلدة في الأسفل.
  tip: >-
    تعال في الصباح الباكر أو نحو المساء؛ فعند الظهيرة تصل مجموعات الحافلات في موجات ولا ظل البتة على الصخر.
    والريح هنا قوية في كل الفصول، وفي الشتاء تصبح الساحة المتجمدة أمام الكنيسة زلقة فعلاً. وقواعد اللباس
    مطبقة: غطاء رأس وتنورة طويلة للنساء، وسراويل طويلة للرجال، مع أغطية مجانية عند المدخل. وساعة واحدة
    تكفي. توجد دورات مياه قرب الموقف لكن لا مقهى؛ وتفتح أكشاك الهدايا في الصيف.
  route: >-
    غادر تبليسي شمالاً على الطريق العسكري الجورجي (E117) ولا تنعطف إلى متسخيتا نفسها — فطريق الوصول إلى
    جفاري منعطف منفصل على الضفة اليسرى للنهر، بعد الجسر مباشرة. ومن هناك يصعد منعطف ضيق لكنه معبّد بالكامل
    نحو سبعة كيلومترات إلى قمة الجرف. وتستغرق الرحلة كلها أكثر قليلاً من نصف ساعة. وفي القمة موقف كبير
    مجاني، ومحطات الوقود عند مفرق متسخيتا. وسيارة اقتصادية كافية تماماً؛ والمشكلة الوحيدة في الشتاء هي
    الجليد على المنعطفات.
