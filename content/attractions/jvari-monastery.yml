ka:
  name: ჯვრის მონასტერი
  short: >-
    VI–VII საუკუნეების მიჯნაზე აგებული ტაძარი კლდის კიდეზე, არაგვისა და მტკვრის შესართავთან — კედლებზე
    ნაკვეთი მთავრებითა და ქვემოთ გაშლილი მცხეთით.
  body: >-
    **ჯვარი იქ დგას, სადაც მიწა თავდება: ნაცრისფერი ქვის ტაძარი კლდის ნაპირზე, ქვემოთ ორი მდინარის შესართავი,
    მიღმა კი საქართველოს ძველი დედაქალაქი.**


    გადმოცემით, IV საუკუნის დასაწყისში წმინდა ნინომ აქ, წარმართული სალოცავის ადგილას, დიდი ხის ჯვარი აღმართა,
    რომლის სასწაულებიც მთელი კავკასიიდან იზიდავდა მლოცველებს. დაახლოებით 545 წელს ჯვართან მცირე ეკლესია
    აშენდა — ის დღესაც დიდი ტაძრის ჩრდილოეთ კედელს ეკვრის. დიდი ტაძარი დაახლოებით 590–605 წლებში აიგო.
    ფასადის წარწერები ქტიტორებად სტეფანოზს, დემეტრესა და ადარნასეს ასახელებს, მშენებლად კი მკვლევართა
    უმეტესობა ერისმთავარ სტეფანოზ I-ს მიიჩნევს. თავად ჯვარი აღარ არსებობს, მაგრამ მისი თავდაპირველი ქვის
    კვარცხლბეკი გუმბათქვეშ დღესაც დგას და ახლა ახალ ხის ჯვარს ატარებს.


    ტაძრის გეგმა ოთხაფსიდიანი ჯვარია, მკლავებს შორის ღრმა ნიშებით. გუმბათი ბურჯებს კი არა, ტრომპების სამ
    იარუსს ეყრდნობა, რომლებიც 32-წახნაგიან რგოლად გადადის. ამიტომ შიგნით ერთიანი, განუყოფელი სივრცე იშლება
    და 25 მეტრზე დაბალი შენობა გაცილებით დიდი ჩანს. „ჯვრის ტიპის“ ტაძარი შემდეგ საქართველოსა და სომხეთში
    მრავალი ეკლესიის ნიმუშად იქცა.


    წასვლამდე ტაძარს გარედან შემოუარეთ. აღმოსავლეთ აფსიდზე, ასომთავრული წარწერების გვერდით, რელიეფზე სტეფანოზ
    I ქრისტეს წინაშე წარდგება, მის გვერდით კი დემეტრე და ადარნასე არიან — ეს უკანასკნელი შვილთან ერთად,
    მთავარანგელოზების ქვეშ. სამხრეთ კარის თავზე ორ ანგელოზს დიდებით აღმართული ჯვარი უჭირავს.


    ტაძარმა 914 წლის არაბთა ხანძარიც გადაიტანა და საბჭოთა ათწლეულებიც, როცა მახლობელი სამხედრო ბაზის გამო
    აქ მისვლა ძნელი იყო. დღეს ის მოქმედი მონასტერია და 1994 წლიდან იუნესკოს მსოფლიო მემკვიდრეობის ძეგლის
    — „მცხეთის ისტორიული ძეგლების“ — ნაწილია. ლერმონტოვის 1839 წლის „მწირიც“ სწორედ ამ შესართავიდან იწყება,
    სადაც არაგვი და მტკვარი ორი დასავით ეხვევა ერთმანეთს.
  tip: >-
    ამოდით დილით ადრე ან დღის ბოლო ორ საათში: გვიანი დილიდან ტურისტული ავტობუსები ტალღებად მოდის, კლდეზე
    კი ჩრდილი არ არის. ქარი აქ ყველა სეზონზე ქრის, ზამთარში კი ქვის ეზო შეიძლება მოყინული იყოს. ჩაიცვით
    ისე, როგორც მოქმედ მონასტერს შეეფერება: მხრები და მუხლები დაფარული, ქალებს — თავსაფარი და ქვედაბოლო;
    მოსასხამები შესასვლელთან, როგორც წესი, არის. ერთი საათი საკმარისია. ტუალეტი ავტოსადგომთანაა, ზაფხულში
    სუვენირების დახლებიც მუშაობს, კაფე კი არ არის — წყალი თან იქონიეთ.
  route: >-
    თბილისიდან ჩრდილოეთით, მცხეთის მიმართულებით გაემართეთ და ავჭალასთან ს9 შემოვლით გზაზე გადით. დაახლოებით
    ორ კილომეტრში მაჩვენებლით მონიშნულ შ152-ზე გადაუხვიეთ: ვიწრო, მაგრამ მთლიანად მოასფალტებული სერპანტინი
    ხუთიოდე კილომეტრში მწვერვალზე, ავტოსადგომთან ამოგიყვანთ. სულ 27 კმ, დაახლოებით 35 წუთი. მცხეთის ცენტრისკენ
    მიმავალ ნიშნებს ნუ გაჰყვებით — ჯვარი ქალაქის პირდაპირ, არაგვის გაღმა დგას. ბენზინგასამართი სადგურები
    მთავარ გზაზე ბევრია. ეკონომ-კლასის მანქანა სავსებით საკმარისია; ზამთარში მოსახვევებზე ყინულს გაუფრთხილდით.
en:
  name: Jvari Monastery
  short: >-
    A church of about 600 on a cliff above the meeting of the Aragvi and Mtkvari, with carved princes
    on its walls and Mtskheta spread out below.
  body: >-
    **Jvari stands where the land runs out: a grey stone church on the lip of a cliff, two rivers meeting
    below, Georgia's ancient capital laid out beyond them.**


    Tradition says that in the early 4th century Saint Nino raised a great wooden cross here, on the site
    of a pagan temple, and that its miracles drew pilgrims from across the Caucasus. Around 545 a small
    church was built beside the cross; it still stands against the north side of the main building. The
    Great Church followed in about 590–605. Its facade inscriptions name the patrons Stepanoz, Demetre
    and Adarnase, and most scholars credit the building to Erismtavari Stepanoz I. The cross itself is
    gone, but its original stone base remains under the dome, now carrying a new wooden cross.


    Inside, the plan is a four-apsed cross with deep niches between the arms. The dome rests not on pillars
    but on three tiers of squinches that rise to a ring of 32 facets, so the interior reads as one undivided
    space and feels far larger than a church under 25 metres high. This Jvari type became a model for
    churches across Georgia and Armenia.


    Before you leave, walk round the outside. On the eastern apse, beside inscriptions in Asomtavruli
    script, Stepanoz I appears in relief before Christ, flanked by Demetre and by Adarnase with his son
    beneath the archangels. Over the south door, two angels raise a cross in glory.


    The church survived an Arab fire in 914 and Soviet decades when a nearby military base made it hard
    to reach. Today it is an active monastery and, since 1994, part of UNESCO's Historical Monuments of
    Mtskheta. Lermontov's Mtsyri (1839) opens at this very confluence, where the Aragvi and the Kura meet,
    "embracing like two sisters".
  tip: >-
    Come early, or in the last two hours of daylight: from late morning coach groups arrive in waves,
    and there is no shade on the rock. The wind blows in every season, and in winter the stone forecourt
    can be icy. Dress for an active monastery: shoulders and knees covered, and headscarves and skirts
    for women; wraps are usually available at the entrance. An hour is enough. There are toilets by the
    car park and souvenir stalls in summer, but no café, so bring water.
  route: >-
    Head north out of Tbilisi towards Mtskheta and join the S9 bypass near Avchala. About two kilometres
    on, take the signposted turn onto the Sh152: some five kilometres of narrow but fully asphalted switchbacks
    climb to the car park on the summit. In total it is 27 km, around 35 minutes. Do not follow the signs
    into Mtskheta town: Jvari stands opposite it, across the Aragvi. Fuel stations line the main road.
    An economy car is perfectly adequate; in winter, watch for ice on the bends.
ru:
  name: Монастырь Джвари
  short: 'Храм около 600 года на утёсе над слиянием Арагви и Мтквари: на стенах — резные князья, внизу
    — вся Мцхета.'
  body: >-
    **Джвари стоит там, где кончается земля: серая каменная церковь на краю обрыва, внизу сливаются две
    реки, а за ними раскинулась древняя столица Грузии.**


    Предание гласит, что в начале IV века святая Нино воздвигла здесь, на месте языческого капища, большой
    деревянный крест и что его чудеса привлекали паломников со всего Кавказа. Около 545 года рядом с крестом
    построили Малую церковь; она и сейчас примыкает к главному храму с севера. Большая церковь появилась
    около 590–605 годов. Надписи на её фасадах называют ктиторов — Степаноза, Деметре и Адарнасе, и большинство
    исследователей приписывают постройку эрисмтавару Степанозу I. Самого креста больше нет, но его подлинное
    каменное основание сохранилось под куполом; теперь на нём стоит новый деревянный крест.


    Внутри — четырёхапсидный крест с глубокими нишами между рукавами. Купол опирается не на столбы, а
    на три яруса тромпов, переходящих в кольцо из 32 граней, поэтому интерьер читается как единое, ничем
    не разделённое пространство и кажется куда больше, чем положено церкви высотой меньше 25 метров. Этот
    «тип Джвари» стал образцом для храмов по всей Грузии и Армении.


    Перед уходом обойдите храм снаружи. На восточной апсиде, рядом с надписями асомтаврули, в рельефе
    изображён Степаноз I перед Христом, а по сторонам — Деметре и Адарнасе с сыном под архангелами. Над
    южной дверью два ангела возносят крест во славе.


    Церковь пережила пожар 914 года, устроенный арабами, и советские десятилетия, когда из-за соседней
    военной базы к ней было трудно попасть. Сегодня это действующий монастырь и с 1994 года часть объекта
    ЮНЕСКО «Исторические памятники Мцхеты». Лермонтовский «Мцыри» (1839) начинается именно у этого слияния,
    где, «обнявшись, будто две сестры», шумят струи Арагвы и Куры.
  tip: >-
    Приезжайте рано или в последние два часа светового дня: с позднего утра волнами прибывают туристические
    автобусы, а тени на скале нет. Ветер дует в любое время года, а зимой каменный двор бывает обледенелым.
    Одевайтесь как для действующего монастыря: плечи и колени закрыты, женщинам — платок и юбка; накидки
    обычно дают у входа. Часа достаточно. У парковки есть туалеты, летом работают сувенирные лотки, но
    кафе нет — возьмите воду.
  route: >-
    Выезжайте из Тбилиси на север, в сторону Мцхеты, и у Авчалы выходите на объездную S9. Примерно через
    два километра сверните по указателю на Sh152: около пяти километров узкого, но полностью асфальтированного
    серпантина поднимаются к парковке на вершине. Всего 27 км, около 35 минут. Не следуйте указателям
    в сам город Мцхета: Джвари стоит напротив него, на другом берегу Арагви. Заправок вдоль главной дороги
    много. Машины эконом-класса вполне хватит; зимой берегитесь льда на поворотах.
fa:
  name: صومعهٔ جواری
  short: >-
    کلیسایی از حدود سال ۶۰۰ بر صخره‌ای بالای پیوندگاه آراگوی و متکواری، با شاهزادگانی کنده‌کاری‌شده بر
    دیوارهایش و متسختا که در پای آن گسترده است.
  body: >-
    **جواری آن‌جا ایستاده که زمین به پایان می‌رسد: کلیسایی از سنگ خاکستری بر لبهٔ پرتگاه، دو رود که در
    پایین به هم می‌پیوندند، و پایتخت کهن گرجستان که آن سوی آن‌ها گسترده است.**


    روایت است که در آغاز سدهٔ چهارم، قدیسه نینو در این‌جا، بر جای پرستشگاهی بت‌پرستانه، صلیب چوبی بزرگی
    برافراشت و معجزه‌هایش زائرانی از سراسر قفقاز را به سوی خود کشید. حدود سال ۵۴۵ کلیسای کوچکی کنار آن
    صلیب ساخته شد که هنوز به ضلع شمالی بنای اصلی چسبیده است. کلیسای بزرگ حدود سال‌های ۵۹۰ تا ۶۰۵ از پی
    آن آمد. کتیبه‌های نمای آن از بانیانی به نام‌های استپانوز، دمتره و آدارناسه نام می‌برند، و بیشتر پژوهشگران
    ساخت بنا را به اریسمتاواری (شاهزادهٔ فرمانروا) استپانوز یکم نسبت می‌دهند. خود صلیب دیگر نیست، اما
    پایهٔ سنگی اصلی‌اش زیر گنبد برجاست و اکنون صلیب چوبی تازه‌ای بر آن استوار است.


    درون بنا، نقشه صلیبی است با چهار آپسید و کُنج‌های ژرف میان بازوها. گنبد نه بر ستون‌ها، که بر سه ردیف
    سکنج استوار است که به حلقه‌ای ۳۲ وجهی می‌رسند؛ از این‌رو فضای درون یکپارچه و ناگسسته دیده می‌شود و
    بسیار بزرگ‌تر از کلیسایی به بلندی کمتر از ۲۵ متر به نظر می‌آید. این «گونهٔ جواری» سرمشق کلیساهایی
    در سراسر گرجستان و ارمنستان شد.


    پیش از رفتن، بنا را از بیرون دور بزنید. بر آپسید شرقی، کنار کتیبه‌هایی به خط اسومتاورولی، استپانوز
    یکم در نقش برجسته در برابر مسیح دیده می‌شود، و در دو سویش دمتره و آدارناسه با پسرش، زیر فرشتگان مقرب.
    بالای در جنوبی، دو فرشته صلیبی را با شکوه بالا می‌برند.


    این کلیسا از آتش‌سوزی سال ۹۱۴ به دست اعراب جان به در برد، و نیز از دهه‌های شوروی که پایگاهی نظامی
    در همسایگی، رسیدن به آن را دشوار می‌کرد. امروز صومعه‌ای فعال است و از ۱۹۹۴ بخشی از میراث جهانی یونسکو
    با عنوان «بناهای تاریخی متسختا». منظومهٔ «متسیری» (۱۸۳۹) لرمانتوف درست در همین پیوندگاه آغاز می‌شود،
    جایی که آراگوی و کورا «همچون دو خواهر در آغوش هم» به هم می‌رسند.
  tip: >-
    زود بیایید، یا در دو ساعت پایانی روشنایی روز: از اواخر صبح گروه‌های اتوبوسی موج‌موج از راه می‌رسند
    و روی صخره هیچ سایه‌ای نیست. باد در همهٔ فصل‌ها می‌وزد و در زمستان حیاط سنگی ممکن است یخ‌زده باشد.
    همان‌گونه لباس بپوشید که برای صومعه‌ای فعال شایسته است: شانه‌ها و زانوها پوشیده، و برای بانوان روسری
    و دامن؛ معمولاً دمِ در پارچهٔ پوششی در دسترس است. یک ساعت کافی است. کنار پارکینگ دستشویی هست و در
    تابستان دکه‌های سوغات، اما کافه نیست، پس آب همراه داشته باشید.
  route: >-
    از تفلیس به سوی شمال، به طرف متسختا بروید و نزدیک آوچالا وارد کمربندی S9 شوید. حدود دو کیلومتر بعد،
    در انشعابِ تابلودار به جادهٔ Sh152 بپیچید: حدود پنج کیلومتر سربالایی پیچ‌درپیچ، باریک اما سراسر آسفالت،
    شما را به پارکینگ روی قله می‌رساند. روی هم ۲۷ کیلومتر، حدود ۳۵ دقیقه. تابلوهای ورود به شهر متسختا
    را دنبال نکنید: جواری روبه‌روی شهر، آن سوی رود آراگوی ایستاده است. پمپ بنزین در طول جادهٔ اصلی فراوان
    است. خودروی کلاس اقتصادی کاملاً کافی است؛ در زمستان مراقب یخ در پیچ‌ها باشید.
he:
  name: מנזר ג'וורי
  short: >-
    כנסייה מסביבות שנת 600 על צוק מעל מפגש הארגווי והמטקוורי, עם נסיכים מגולפים על קירותיה ומצחתה הפרושה
    למרגלותיה.
  body: >-
    **ג'וורי עומדת במקום שבו היבשה נגמרת: כנסיית אבן אפורה על שפת צוק, שני נהרות נפגשים למטה, והבירה העתיקה
    של גאורגיה פרושה מעבר להם.**


    לפי המסורת, בראשית המאה ה־4 הציבה כאן נינו הקדושה צלב עץ גדול, במקומו של מקדש פגאני, וניסיו משכו עולי
    רגל מכל רחבי הקווקז. בסביבות 545 נבנתה לצד הצלב כנסייה קטנה; היא עומדת עד היום צמודה לצדו הצפוני של
    המבנה הראשי. הכנסייה הגדולה באה אחריה בסביבות 590–605. הכתובות על חזיתותיה נוקבות בשמות הפטרונים שהקימו
    אותה — סטפנוז, דמטרה ואדרנסה — ורוב החוקרים מייחסים את הבניין לנסיך השליט (אריסמתאוורי) סטפנוז הראשון.
    הצלב עצמו איננו עוד, אבל בסיס האבן המקורי שלו נותר מתחת לכיפה, וכיום ניצב עליו צלב עץ חדש.


    בפנים, התוכנית היא צלב בעל ארבע אפסידות, ובין זרועותיו גומחות עמוקות. הכיפה נשענת לא על עמודים אלא
    על שלוש שורות של קשתות פינה (טרומפים), המתנשאות אל טבעת בת 32 פאות, ולכן חלל הפנים נקרא כמרחב אחד
    בלתי מחולק ונראה גדול בהרבה מכנסייה שגובהה פחות מ־25 מטר. "טיפוס ג'וורי" הזה הפך למודל לכנסיות ברחבי
    גאורגיה וארמניה.


    לפני שאתם עוזבים, הקיפו את המבנה מבחוץ. על האפסיס המזרחי, לצד כתובות בכתב אסומתאוורולי, מופיע סטפנוז
    הראשון בתבליט לפני ישו, ולצדדיו דמטרה ואדרנסה עם בנו, מתחת למלאכים הראשיים. מעל הדלת הדרומית מרימים
    שני מלאכים צלב בתהילה.


    הכנסייה שרדה שריפה שהציתו הערבים ב־914, וגם עשורים סובייטיים שבהם בסיס צבאי סמוך הקשה להגיע אליה.
    היום זהו מנזר פעיל, ומאז 1994 הוא חלק מאתר המורשת העולמית של אונסק"ו "המונומנטים ההיסטוריים של מצחתה".
    הפואמה "מצירי" (1839) של לרמונטוב נפתחת בדיוק במפגש הזה, שבו הארגווי והקורה נפגשים "חבוקים כשתי אחיות".
  tip: >-
    בואו מוקדם, או בשעתיים האחרונות של אור היום: משעות הבוקר המאוחרות מגיעות קבוצות אוטובוסים בגלים, ועל
    הסלע אין צל. הרוח נושבת בכל עונה, ובחורף חצר האבן עלולה להיות מכוסה קרח. התלבשו כנדרש במנזר פעיל:
    כתפיים וברכיים מכוסות, ולנשים כיסוי ראש וחצאית; בדרך כלל אפשר לקבל בכניסה בדים לעטיפה. שעה מספיקה.
    ליד החניון יש שירותים ובקיץ דוכני מזכרות, אבל אין בית קפה, אז הביאו מים.
  route: >-
    צאו מטביליסי צפונה לכיוון מצחתה והצטרפו לכביש העוקף S9 סמוך לאבצ'לה. כשני קילומטרים הלאה פנו בפנייה
    המשולטת לכביש Sh152: כחמישה קילומטרים של עיקולים חדים, צרים אך סלולים לגמרי, מטפסים אל החניון שבפסגה.
    בסך הכול 27 ק"מ, כ־35 דקות. אל תלכו אחרי השלטים אל העיר מצחתה: ג'וורי עומדת מולה, מעבר לארגווי. תחנות
    דלק פזורות לאורך הכביש הראשי. רכב בקטגוריית אקונומי מספיק בהחלט; בחורף היזהרו מקרח בעיקולים.
ar:
  name: دير جفاري
  short: >-
    كنيسة من نحو عام 600 على جرف فوق ملتقى نهري أراغفي ومتكفاري، على جدرانها أمراء منحوتون، ومتسخيتا ممتدة
    عند قدميها.
  body: >-
    **تقف جفاري حيث تنتهي الأرض: كنيسة من الحجر الرمادي على حافة جرف، ونهران يلتقيان في الأسفل، وعاصمة
    جورجيا القديمة ممتدة وراءهما.**


    يروي التقليد أن القديسة نينو نصبت هنا، في مطلع القرن الرابع، صليباً خشبياً عظيماً في موضع معبد وثني،
    وأن معجزاته اجتذبت الحجاج من أنحاء القوقاز كافة. ونحو عام 545 بُنيت كنيسة صغيرة إلى جانب الصليب، وما
    زالت قائمة ملاصقة للجانب الشمالي من المبنى الرئيسي. ثم تلتها الكنيسة الكبرى نحو 590–605. وتذكر النقوش
    على واجهاتها أسماء الرعاة ستيفانوز وديميتري وأدارناسي، ويعزو معظم الباحثين البناء إلى الأمير الحاكم
    (الإريسمتافاري) ستيفانوز الأول. أما الصليب نفسه فقد زال، لكن قاعدته الحجرية الأصلية باقية تحت القبة،
    وعليها اليوم صليب خشبي جديد.


    وفي الداخل، المخطط صليب رباعي الحنيات، بين أذرعه كوّات عميقة. ولا ترتكز القبة على أعمدة، بل على ثلاثة
    صفوف من الحنايا الركنية ترتفع حتى حلقة ذات 32 وجهاً، فيبدو الداخل فضاءً واحداً غير مجزّأ، وأرحب بكثير
    مما يُنتظر من كنيسة يقل ارتفاعها عن 25 متراً. وقد صار "طراز جفاري" هذا نموذجاً للكنائس في أنحاء جورجيا
    وأرمينيا.


    قبل أن تغادر، طُف حول المبنى من الخارج. على الحنية الشرقية، بجوار نقوش بخط الأسومتافرولي، يظهر ستيفانوز
    الأول في نقش بارز أمام المسيح، وعلى جانبيه ديميتري وأدارناسي مع ابنه تحت رئيسَي الملائكة. وفوق الباب
    الجنوبي يرفع ملاكان صليباً في مجد.


    نجت الكنيسة من حريق أشعله العرب عام 914، ومن عقود سوفييتية جعلت فيها قاعدةٌ عسكرية مجاورة الوصولَ
    إليها عسيراً. وهي اليوم دير عامر، ومنذ عام 1994 جزء من موقع اليونسكو "المعالم التاريخية في متسخيتا".
    وتبدأ قصيدة ليرمونتوف "متسيري" (1839) عند هذا الملتقى بالذات، حيث يلتقي أراغفي وكورا "متعانقين كأختين".
  tip: >-
    تعالَ باكراً، أو في آخر ساعتين من ضوء النهار: فمنذ أواخر الصباح تتوافد مجموعات الحافلات موجةً بعد
    موجة، ولا ظلّ على الصخرة. تهبّ الريح في كل الفصول، وقد يكسو الجليد الساحة الحجرية في الشتاء. البس
    ما يليق بدير عامر: الكتفان والركبتان مستورتان، وللنساء غطاء رأس وتنورة؛ وتتوفر عادةً أغطية عند المدخل.
    تكفي ساعة واحدة. هناك دورات مياه عند موقف السيارات وأكشاك تذكارات في الصيف، لكن لا مقهى، فاحمل الماء.
  route: >-
    اتجه شمالاً من تبليسي نحو متسخيتا، والتحق بالطريق الالتفافي S9 قرب أفتشالا. بعد نحو كيلومترين انعطف
    عند المنعطف المشار إليه باللافتات إلى الطريق Sh152: نحو خمسة كيلومترات من المنعطفات المتعرّجة، ضيقة
    لكنها معبّدة بالكامل، تصعد بك إلى موقف السيارات على القمة. المسافة كلها 27 كم، نحو 35 دقيقة. لا تتبع
    اللافتات إلى داخل مدينة متسخيتا: فجفاري تقف قبالتها على الضفة الأخرى من نهر أراغفي. محطات الوقود منتشرة
    على الطريق الرئيسي. تكفي السيارة الاقتصادية تماماً؛ وفي الشتاء احذر الجليد في المنعطفات.
