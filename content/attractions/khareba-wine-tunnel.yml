ka:
  name: ხარებას ღვინის გვირაბი
  short: >-
    კავკასიონის კალთაში გაჭრილი კილომეტრობით გვირაბი ყვარელთან, სადაც ღვინო მთელი წელი 12-14 გრადუსზე ინახება.
  body: >-
    **ეს ღვინის სარდაფი კი არა, მთაში გაჭრილი ტონელია.** ხარებას გვირაბი ყვარლის ჩრდილოეთით, კავკასიონის ფერდობშია გაჭრილი: მთავარი დერეფანი დაახლოებით 7,7 კილომეტრია, მისგან კი თხუთმეტამდე გვერდითი განშტოება გამოდის.


    გვირაბი 1950-იან წლებში გაითხარა და თავდაპირველად ღვინოსთან კავშირი არ ჰქონდა — ის სტრატეგიული ობიექტი იყო, თავშესაფრად და საწყობად განკუთვნილი. მოგვიანებით აღმოჩნდა, რომ კლდის სიღრმეში პირობები იდეალურია ღვინის დასაძველებლად: ტემპერატურა მთელი წლის განმავლობაში 12-14 გრადუსია, ტენიანობა 70 პროცენტის ახლოს, და არავითარი ხელოვნური კონდიცირება არ სჭირდება.


    ვიზიტი ერთ განშტოებაზე გავლას ნიშნავს. კედლების გასწვრივ ბოთლების თაროებია, ზოგი ხავსით და ობით დაფარული — ეს განზრახაა, რადგან ნესტიან კედელზე კორპი უკეთ ინახება. ჰაერი ცივი და უძრავია; ზაფხულში, როცა გარეთ 35 გრადუსია, შესვლისთანავე გცივა.


    ტურის ბოლოს დაგემოვნებაა. აქ ძირითადად კახური ჯიშებია: საფერავი, რქაწითელი, კინძმარაული, ხიხვი. კომპლექსში რესტორანიცაა, სადაც შოთის ცხობასა და ჩურჩხელის კეთებას აჩვენებენ — ეს ცოტა თეატრალურია, მაგრამ პური მართლაც კარგია.


    ღირს თუ არა? თუ ღვინის მარნები უკვე ნახე, გვირაბი მაინც სხვა შთაბეჭდილებაა — მასშტაბით და სიცივით. თუ ჩქარობ, დაგემოვნება ყვარელში უფრო იაფად და უფრო მშვიდადაც შეიძლება.
  tip: >-
    გვირაბში 12-14 გრადუსია მთელი წელი — ზაფხულშიც ქურთუკი წაიღე, თორემ ნახევარ საათში აცივდები. იატაკი ბეტონისაა და სველი, სრიალა ძირით არ იარო. ტური გიდით მიდის და ჯგუფებად, ამიტომ პიკის საათებში ლოდინი შესაძლებელია. თუ მართავ, დაგემოვნებაზე უარი თქვი ან თანამგზავრს გადააბარე საჭე — პორციები აქ მცირე არ არის. კომპლექსში ტუალეტი, პარკინგი და რესტორანია.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით ბადიაურსა და გურჯაანზე, შემდეგ ჩრდილოეთით ყვარლისკენ — 145 კმ ასფალტი, კარგ მდგომარეობაში. გვირაბი ყვარლიდან ჩრდილოეთით სამიოდე კილომეტრშია, მთის ძირში, და ნიშანი მკაფიოა. სულ 148 კმ, დაახლოებით ორი საათი და ოცდათხუთმეტი წუთი. თელავის გავლით ცოტა უფრო ხანგრძლივია, სამაგიეროდ უფრო ლამაზი. საწვავი გურჯაანსა და ყვარელში. ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Khareba Wine Tunnel
  short: >-
    Kilometres of tunnel cut into the Caucasus foothills at Kvareli, holding wine at a steady 12-14°C all year.
  body: >-
    **This is not a cellar but a tunnel driven into a mountain.** The Khareba tunnel runs north of Kvareli into the slope of the Greater Caucasus: the main gallery is about 7.7 kilometres long, with roughly fifteen side corridors branching off it.


    It was excavated in the 1950s and had nothing to do with wine. The original purpose was strategic — shelter and storage, cut deep enough to survive most things. Only later did anyone notice that conditions inside are close to ideal for ageing wine: the rock holds 12 to 14°C the year round and humidity sits near 70 per cent, without a single unit of refrigeration or humidity control.


    A visit means walking one branch and back. Racks line the walls, some of the bottles furred with mould, which is deliberate: a damp wall keeps corks in better condition than a dry one. The air is cold and completely still. In August, when it is 35°C in the car park, the first thirty seconds inside are a shock.


    The tour ends with a tasting, mostly of Kakhetian varieties — Saperavi, Rkatsiteli, the semi-sweet Kindzmarauli, and the less common Khikhvi. The complex also has a restaurant where shoti bread is baked in a tone oven and churchkhela is made in front of you. It is staged for visitors, but the bread is genuinely good.


    Is it worth it? If you have already seen several marani, the tunnel still gives you something different: scale and cold. If you are short of time, tasting in Kvareli itself is cheaper, quieter and just as instructive about the wine.


    The tunnel also explains something about the last century of Georgian wine. Storage on this state scale kept enormous volumes moving for the Soviet market while small family marani were pushed to the margins, and the revival of qvevri winemaking since the 1990s has been a deliberate reversal of exactly that.
  tip: >-
    The tunnel stays at 12-14°C all year, so take a jacket even in August; half an hour inside is enough to get cold. The floor is wet concrete, so avoid smooth soles. Tours run with a guide in groups, and at busy times you may wait for the next one. If you are driving, skip the tasting or hand over the keys — pours here are not museum-sized. There are toilets, free parking and a restaurant on site.
  route: >-
    Take the Kakheti highway from Tbilisi through Badiauri and Gurjaani, then north to Kvareli — 145 km of asphalt in good condition. The tunnel is about three kilometres north of the town at the foot of the mountains and is clearly signed. Total 148 km, roughly two hours thirty-five. The alternative route via the Gombori Pass and Telavi takes slightly longer but is a better drive. Fuel is available in Gurjaani and Kvareli. An economy car is sufficient.
ru:
  name: Винный тоннель Хареба
  short: >-
    Километры тоннеля, прорубленного в предгорьях Кавказа у Кварели, где вино круглый год лежит при 12-14 градусах.
  body: >-
    **Это не подвал, а тоннель, пробитый в горе.** Тоннель Хареба уходит на север от Кварели в склон Большого Кавказа: главная галерея около 7,7 километра длиной, от неё отходит примерно пятнадцать боковых коридоров.


    Его прорубили в 1950-х годах, и к вину он изначально отношения не имел. Назначение было стратегическим: укрытие и склад, заложенные достаточно глубоко. Лишь позже выяснилось, что условия внутри почти идеальны для выдержки вина — порода круглый год держит 12-14 градусов, влажность около 70 процентов, и всё это без единого кондиционера или увлажнителя.


    Экскурсия — это проход по одной ветке и обратно. Вдоль стен стоят стеллажи, часть бутылок покрыта плесенью, и это сделано намеренно: на влажной стене пробка сохраняется лучше, чем на сухой. Воздух холодный и абсолютно неподвижный. В августе, когда на парковке тридцать пять, первые полминуты внутри ощущаются как удар.


    Заканчивается всё дегустацией, в основном кахетинских сортов: саперави, ркацители, полусладкое киндзмараули и более редкий хихви. В комплексе есть ресторан, где при вас пекут шоти в тоне и делают чурчхелу. Это поставлено для гостей, но хлеб действительно хорош.


    Стоит ли ехать? Если несколько марани вы уже видели, тоннель всё же даёт другое — масштаб и холод. Если времени мало, дегустация в самой Кварели обойдётся дешевле, пройдёт спокойнее и расскажет о вине не меньше.
  tip: >-
    В тоннеле круглый год 12-14 градусов, так что куртку берите даже в августе: получаса хватает, чтобы замёрзнуть. Пол — мокрый бетон, гладкая подошва здесь ни к чему. Экскурсии идут с гидом и группами, в пик придётся подождать следующую. За рулём от дегустации откажитесь или передайте ключи спутнику: наливают тут не по-музейному. На месте есть туалеты, бесплатная парковка и ресторан.
  route: >-
    Из Тбилиси по кахетинской трассе через Бадиаури и Гурджаани, затем на север к Кварели — 145 км асфальта в хорошем состоянии. Тоннель примерно в трёх километрах севернее города, у подножия гор, указатель заметный. Всего 148 км, около двух часов тридцати пяти минут. Альтернатива через Гомборский перевал и Телави чуть дольше, но приятнее для водителя. Заправки есть в Гурджаани и Кварели. Машины эконом-класса достаточно.
fa:
  name: تونل شراب خارِبا
  short: >-
    کیلومترها تونل کنده‌شده در دامنه‌های قفقاز نزدیک کوارلی، که شراب را تمام سال در 12 تا 14 درجه نگه می‌دارد.
  body: >-
    **این سرداب نیست، تونلی است که در دل کوه رانده‌اند.** تونل خارِبا از شمال کوارلی به دامنهٔ قفقاز بزرگ فرو می‌رود: راهروی اصلی حدود 7.7 کیلومتر است و نزدیک پانزده دالان فرعی از آن منشعب می‌شود.


    این تونل در دههٔ 1950 کنده شد و در آغاز هیچ ربطی به شراب نداشت. هدف نخستین راهبردی بود: پناهگاه و انبار، آن‌قدر عمیق که از بیشتر چیزها جان به در ببرد. بعدها معلوم شد شرایط درون آن برای کهنه کردن شراب نزدیک به آرمانی است؛ سنگ تمام سال 12 تا 14 درجه را نگه می‌دارد و رطوبت نزدیک هفتاد درصد است، آن هم بی‌یک دستگاه سرمایش یا رطوبت‌ساز.


    بازدید یعنی رفتن و برگشتن در یکی از شاخه‌ها. قفسه‌ها کنار دیوارها چیده شده‌اند و روی برخی بطری‌ها کپک نشسته است، و این عمدی است: دیوار نمناک چوب‌پنبه را بهتر از دیوار خشک نگه می‌دارد. هوا سرد و کاملاً ساکن است. در مرداد که در پارکینگ سی و پنج درجه است، سی ثانیهٔ نخست درون تونل تکان‌دهنده است.


    گشت با نوشیدن آزمایشی پایان می‌یابد، بیشتر از انگورهای کاختی: ساپراوی، رکاتسیتلی، کیندزمارائولی نیمه‌شیرین و خیخوی کمیاب‌تر. در همین مجموعه رستورانی هست که نان شوتی را در تنور می‌پزند و چورچخلا را پیش چشم شما درست می‌کنند. صحنه‌آرایی برای مهمان است، اما نان واقعاً خوب است.


    آیا می‌ارزد؟ اگر پیش‌تر چند مارانی دیده‌اید، تونل باز چیز دیگری به شما می‌دهد: مقیاس و سرما. و اگر وقت کم دارید، نوشیدن در خود کوارلی ارزان‌تر و آرام‌تر است و به همان اندازه آموزنده.
  tip: >-
    تونل تمام سال 12 تا 14 درجه است، پس حتی در مرداد کاپشنی همراه ببرید؛ نیم ساعت درون آن برای سرد شدن کافی است. کف بتنی و خیس است، کفش با کف صاف نپوشید. گشت‌ها با راهنما و گروهی برگزار می‌شود و در ساعت‌های شلوغ باید منتظر گروه بعدی بمانید. اگر رانندگی می‌کنید از نوشیدن بگذرید یا سوئیچ را بسپارید؛ اندازهٔ پیمانه‌ها اینجا موزه‌ای نیست. سرویس بهداشتی، پارکینگ رایگان و رستوران در محل هست.
  route: >-
    از تفلیس بزرگراه کاختی را از بادیااوری و گورجانی بگیرید و سپس به شمال و به سوی کوارلی بروید؛ 145 کیلومتر آسفالت با وضعیت خوب. تونل حدود سه کیلومتری شمال شهر و در پای کوه است و تابلوی روشنی دارد. جمعاً 148 کیلومتر و نزدیک دو ساعت و سی و پنج دقیقه. مسیر جایگزین از گردنهٔ گومبوری و تلاوی اندکی طولانی‌تر اما دلپذیرتر است. سوخت در گورجانی و کوارلی موجود است. خودروی اقتصادی کافی است.
he:
  name: מנהרת היין חארבה
  short: >-
    קילומטרים של מנהרה חצובה במורדות הקווקז ליד קוורלי, שבה היין שוכן כל השנה ב-12 עד 14 מעלות.
  body: >-
    **זה אינו מרתף אלא מנהרה שנחפרה לתוך הר.** מנהרת חארבה נכנסת מצפון לקוורלי אל מדרון הקווקז הגדול: המסדרון הראשי באורך כ-7.7 קילומטרים, וממנו מסתעפים כחמישה עשר מסדרונות צד.


    היא נחפרה בשנות החמישים ולא היה לה שום קשר ליין. הייעוד המקורי היה אסטרטגי: מחסה ומחסן, עמוקים דיים כדי לשרוד כמעט הכול. רק מאוחר יותר שמו לב שהתנאים בפנים כמעט מושלמים להתיישנות יין — הסלע שומר 12 עד 14 מעלות כל השנה, והלחות עומדת סביב שבעים אחוז, בלי יחידת קירור או אדים אחת.


    הביקור הוא הליכה באחד הענפים וחזרה. מדפים ניצבים לאורך הקירות, וחלק מהבקבוקים מכוסים עובש, וזה מכוון: קיר לח שומר על הפקקים טוב יותר מקיר יבש. האוויר קר ודומם לחלוטין. באוגוסט, כשבחניון שלושים וחמש מעלות, שלושים השניות הראשונות בפנים הן הלם.


    הסיור מסתיים בטעימה, בעיקר של זנים קחתיים: ספראווי, רקאציטלי, קינדזמראולי החצי-מתוק וחיחווי הנדיר יותר. במתחם יש גם מסעדה שבה אופים לחם שוטי בתנור טונה ומכינים צ'ורצ'חלה מול העיניים. זה מבוים למבקרים, אבל הלחם באמת טוב.


    האם זה שווה? אם כבר ראיתם כמה מרני, המנהרה עדיין נותנת משהו אחר: קנה מידה וקור. ואם הזמן קצר, טעימה בקוורלי עצמה זולה יותר, שקטה יותר ומלמדת על היין לא פחות.
  tip: >-
    במנהרה 12 עד 14 מעלות כל השנה, אז קחו מעיל גם באוגוסט; חצי שעה בפנים מספיקה כדי לקרוא. הרצפה בטון רטוב, הימנעו מסוליות חלקות. הסיורים יוצאים עם מדריך ובקבוצות, ובשעות עמוסות תמתינו לקבוצה הבאה. אם אתם נוהגים, ותרו על הטעימה או מסרו את המפתחות — המנות כאן אינן מוזיאליות. יש שירותים, חניה חינם ומסעדה במקום.
  route: >-
    סעו מטביליסי בכביש קחתי דרך באדיאורי וגורג'אני, ואז צפונה לקוורלי — 145 ק״מ אספלט במצב טוב. המנהרה נמצאת כשלושה קילומטרים מצפון לעיירה למרגלות ההרים ומסומנת היטב. בסך הכול 148 ק״מ, כשעתיים ושלושים וחמש דקות. המסלול החלופי דרך מעבר גומבורי וטלאווי ארוך מעט יותר אך נעים יותר לנהיגה. דלק יש בגורג'אני ובקוורלי. רכב חסכוני מספיק.
ar:
  name: نفق خاريبا للخمر
  short: >-
    كيلومترات من نفق محفور في سفوح القوقاز قرب كفارلي، يحفظ الخمر طوال العام عند 12 إلى 14 درجة.
  body: >-
    **ليس هذا قبواً بل نفقاً حُفر في جوف جبل.** يمتد نفق خاريبا شمال كفارلي داخل منحدر القوقاز الكبرى: الرواق الرئيسي بطول 7.7 كيلومتر تقريباً، وتتفرع منه نحو خمسة عشر رواقاً جانبياً.


    حُفر في خمسينيات القرن الماضي ولم تكن له صلة بالخمر أصلاً. كان الغرض الأول استراتيجياً: ملجأ ومخزن، عميقان بما يكفي للنجاة من معظم الأشياء. ولم يُلاحظ إلا لاحقاً أن الظروف في الداخل شبه مثالية لتعتيق الخمر؛ فالصخر يحفظ 12 إلى 14 درجة طوال العام، والرطوبة نحو سبعين في المئة، دون أي جهاز تبريد أو ترطيب.


    والزيارة تعني السير في أحد الفروع ثم العودة. رفوف تصطف على الجدران، وبعض الزجاجات يكسوها العفن، وهذا مقصود: فالجدار الرطب يحفظ الفلين أفضل من الجاف. والهواء بارد وساكن تماماً. وفي آب، حين تبلغ الحرارة في الموقف خمساً وثلاثين، تكون الثلاثون ثانية الأولى في الداخل صدمة.


    وتنتهي الجولة بتذوق، معظمه من أصناف كاخيتي: سابيرافي ورقاتسيتيلي وكيندزماراولي نصف الحلو وخيخفي الأقل شيوعاً. وفي المجمع مطعم يُخبز فيه رغيف الشوتي في فرن التونه وتُصنع التشورتشخيلا أمامك. العرض معدّ للزوار، لكن الخبز جيد فعلاً.


    هل يستحق؟ إن كنت زرت عدة موارٍ من قبل، فالنفق يمنحك شيئاً مختلفاً: الحجم والبرد. وإن ضاق وقتك، فالتذوق في كفارلي نفسها أرخص وأهدأ ولا يقل إفادة عن الخمر.
  tip: >-
    يبقى النفق عند 12 إلى 14 درجة طوال العام، فخذ معطفاً حتى في آب؛ نصف ساعة في الداخل تكفي لتشعر بالبرد. والأرضية خرسانة مبللة، فتجنب النعال الملساء. والجولات بمرشد وبمجموعات، وفي أوقات الذروة قد تنتظر المجموعة التالية. وإن كنت تقود فاعتذر عن التذوق أو سلّم المفاتيح، فالكميات هنا ليست متحفية. وفي الموقع دورات مياه وموقف مجاني ومطعم.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر باديااوري وغورجاني ثم شمالاً إلى كفارلي، 145 كم من الإسفلت بحالة جيدة. والنفق على بعد نحو ثلاثة كيلومترات شمال البلدة عند سفح الجبال، ولافتته واضحة. المجموع 148 كم ونحو ساعتين وخمس وثلاثين دقيقة. أما المسار البديل عبر ممر غومبوري وتيلافي فأطول قليلاً لكنه أمتع في القيادة. والوقود متوفر في غورجاني وكفارلي. وسيارة اقتصادية تكفي.
