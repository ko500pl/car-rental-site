ka:
  name: ხარებას ღვინის გვირაბი
  short: >-
    ყვარელთან, კავკასიონის კლდეში გამოკვეთილი 7,7-კილომეტრიანი გვირაბების ქსელი, 1962 წელს გახსნილი, სადაც
    ღვინო 12–16 გრადუსზე ძველდება.
  body: >-
    **კახური სიცხიდან მთის წიაღში შედიხართ და რამდენიმე ნაბიჯში ზაფხული სადღაც უკან რჩება.**


    ყვარლის ღვინის გვირაბი, რომელსაც დღეს „მეღვინეობა ხარება“ განაგებს, კავკასიონის კლდის მასივშია გამოკვეთილი,
    იქ, სადაც ალაზნის ველიდან მთის კალთა იწყება. კომპანიის ცნობით, გვირაბი 1962 წელს გაიხსნა — სპეციალურად
    ვაზისა და ღვინის მსოფლიო კონგრესისთვის. მისი საერთო სიგრძე 7,7 კილომეტრია: ორი მთავარი გვირაბი და
    ცამეტი დამაკავშირებელი. სიგრილეს მთა თავად ინახავს — მთელი წლის განმავლობაში 12-დან 16 გრადუსამდე.


    სტუმრისთვის ორი შესასვლელიდან ერთია განკუთვნილი. შიგნით თეთრად შელესილი, კამაროვანი დერეფანია მოპირკეთებული
    იატაკით, კედლებზე კი წითელი აგურის თაღოვანი ნიშები მიჰყვება ერთმანეთს, მუქი ბოთლებით გადავსებული.
    ბოთლები გვერდულად წევს ან თავდაყირა დგას, რომ დავარგების წლებში საცობი მუდამ სველი დარჩეს. კომპანია
    აქ 26 000-მდე ბოთლს ინახავს; უძველესი საკოლექციო ღვინო ჩვიდმეტი წლისაა. მეორე შესასვლელის მიღმა, თვალს
    მოფარებული, ღვინო ლითონისა და მუხის ჭურჭელში მწიფდება.


    გარეთ კომპლექსი ღია ცის ქვეშ გაშლილ პატარა კახეთად იქცევა: წყლის წისქვილი, თონე, ჭაჭის სახდელი, ძველი
    მარანი საწნახლითა და ქვევრებით, საკალმახე და საკოლექციო ვენახი, სადაც საქართველოს სხვადასხვა კუთხის
    300-ზე მეტი ჯიშის ვაზია თავმოყრილი. შეგიძლიათ შოთი გამოაცხოთ, ჩურჩხელა ამოავლოთ ან რთველზე ყურძენი
    დაწუროთ; დასაგემოვნებლად კი „ხარებას“ ორმოცდაათამდე ღვინოა შეთავაზებული.


    ადგილი გაპრიალებული და აშკარად კომერციულია, მაგრამ თავად გვირაბი ნამდვილია: ცივი ქვა, უძრავი ჰაერი
    და სიბნელეში მარტო დატოვებული ღვინის მოთმინება. ნეკრესის მონასტერი კი, რომლის ეპისკოპოსებსაც საკუთარი
    მარანი და მიწაში ჩაფლული ქვევრები ჰქონდათ, სულ რამდენიმე კილომეტრშია, ქედზე.
  tip: >-
    აგვისტოშიც კი ქურთუკი წამოიღეთ: 12–16 გრადუსზე ნახევარ საათში აგცივდებათ. კომპანიის მონაცემებით, გვირაბი
    ყოველდღე 10:00-დან 20:00-მდეა ღია, რესტორანი — 22:00-მდე; გვიან მისვლამდე საათები გადაამოწმეთ. ტური
    გიდით მიდის, ამიტომ შაბათ-კვირას და რთველის სეზონზე შეიძლება შემდეგ ჯგუფს დაელოდოთ; მასტერკლასები
    (პური, ჩურჩხელა, ჭაჭა) სჯობს წინასწარ დაჯავშნოთ. ფასი დაგემოვნების პაკეტზეა დამოკიდებული. ვინც საჭესთან
    ზის, დაგემოვნება ან გამოტოვოს, ან საჭე სხვას გადააბაროს. ადგილზე რესტორანი და ავტოსადგომია, ნეკრესი
    კი მანქანით სულ ახლოსაა.
  route: >-
    თბილისიდან აღმოსავლეთით ს5 კახეთის გზატკეცილით საგარეჯოს გავლით ბაკურციხემდე იარეთ, შემდეგ შ207-ით
    გურჯაანზე გაიარეთ, შ69-ით კი მუკუზნის გავლით ალაზანი გადაკვეთეთ და ყვარელში შედით. გვირაბი ქალაქის
    ცენტრის ჩრდილოეთით, ილია ჭავჭავაძის გამზირის გაგრძელებაზე, მთის ძირშია. სულ დაახლოებით 148 კმ, ორი
    საათი და ოცდათხუთმეტი წუთი, მთლიანად ასფალტი; ეკონომ-კლასის მანქანა სავსებით საკმარისია. გომბორის
    უღელტეხილითა და თელავით უფრო ლამაზი, მაგრამ ნელი გზაა, ზამთარში კი თოვლმა შეიძლება ჩაკეტოს. საწვავი
    გურჯაანსა და ყვარელში შეავსეთ.
en:
  name: Khareba Wine Tunnel
  short: >-
    A 7.7-kilometre network of tunnels cut into the Caucasus rock at Kvareli, opened in 1962, where wine
    ages at a steady 12–16°C.
  body: >-
    **Step out of the Kakhetian heat into the mountain, and within a few paces summer is gone.**


    The Kvareli wine tunnel, run today by Winery Khareba, is cut into the rock of the Greater Caucasus
    just where the foothills rise from the Alazani valley. According to the company, it opened in 1962,
    made specifically for the World Congress of Vine and Wine. Its galleries add up to 7.7 kilometres:
    two main tunnels linked by thirteen connecting ones. The mountain does the cooling, holding the air
    between 12 and 16°C all year.


    Visitors use one of the two entrances. Inside is a whitewashed, vaulted gallery over a tiled floor,
    its walls a steady rhythm of red-brick arches packed with dark bottles. They lie on their sides or
    stand upside down, so that the corks stay wet through years of ageing. The company keeps up to 26,000
    bottles here; the oldest collection wine is seventeen years old. Beyond the second entrance, out of
    sight, more wine rests in steel and oak.


    Outside, the complex turns into a small open-air Kakheti: a watermill, a tone oven for bread, a chacha
    still, an old marani with its winepress and qvevri, a trout pond, and a collection vineyard of more
    than 300 Georgian grape varieties. You can bake shoti, dip churchkhela or crush grapes at harvest;
    tastings run to some fifty Khareba wines.


    It is polished and unapologetically commercial, but the tunnel itself is the real thing: cold stone,
    still air and the patience of wine left alone in the dark. And Nekresi, whose bishops kept their own
    cellar of buried qvevri, stands on its ridge only a few kilometres away.
  tip: >-
    Bring a jacket even in August: at 12–16°C the chill reaches you within half an hour. The company lists
    the tunnel as open daily 10:00–20:00 and the restaurant until 22:00; check before a late visit. Tours
    are guided, so at weekends and during the harvest you may wait for the next group, and master classes
    (bread, churchkhela, chacha) are best booked ahead. Prices depend on the tasting package. Whoever
    is driving should skip the tasting or hand over the keys. There is a restaurant and parking on site,
    and Nekresi is a short drive away.
  route: >-
    Leave Tbilisi eastwards on the S5 Kakheti highway past Sagarejo to Bakurtsikhe, then take the Sh207
    through Gurjaani and the Sh69 past Mukuzani, across the Alazani and into Kvareli. The tunnel lies
    at the foot of the mountains just north of the town centre, beyond Ilia Chavchavadze Avenue. Total
    about 148 km, roughly 2 hours 35 minutes, asphalt throughout; an economy car is all you need. The
    alternative over the Gombori Pass and Telavi is the more scenic drive but slower, and snow can close
    it in winter. Fuel is available in Gurjaani and Kvareli.
ru:
  name: Винный тоннель Хареба
  short: >-
    Открытая в 1962 году сеть тоннелей длиной 7,7 км в скале Кавказа у Кварели, где вино выдерживается
    при постоянных 12–16 °C.
  body: >-
    **Шагните из кахетинской жары в гору — и через пару шагов лета как не бывало.**


    Кварельский винный тоннель, которым сегодня управляет винодельня «Хареба», прорублен в скале Большого
    Кавказа именно там, где предгорья поднимаются от Алазанской долины. По данным компании, он был открыт
    в 1962 году и создавался специально к Всемирному конгрессу винограда и вина. Его галереи составляют
    в сумме 7,7 км: два главных тоннеля, соединённых тринадцатью боковыми. Охлаждение обеспечивает сама
    гора, удерживая воздух в пределах 12–16 °C весь год.


    Посетители входят через один из двух входов. Внутри — выбеленная сводчатая галерея над плиточным полом,
    стены которой держат ровный ритм красных кирпичных арок, забитых тёмными бутылками. Они лежат на боку
    или стоят донышком вверх, чтобы пробки оставались влажными все годы выдержки. Компания хранит здесь
    до 26 000 бутылок; старейшему коллекционному вину семнадцать лет. За вторым входом, вне поля зрения,
    отдыхает ещё больше вина — в стали и дубе.


    Снаружи комплекс превращается в маленькую Кахетию под открытым небом: водяная мельница, тонэ — печь
    для хлеба, чачный аппарат, старый марани с давильней и квеври, пруд с форелью и коллекционный виноградник,
    где собрано более 300 грузинских сортов. Здесь можно испечь шоти, сделать чурчхелу или давить виноград
    в сезон урожая; дегустации доходят до полусотни вин «Хареба».


    Место отлаженное и откровенно коммерческое, но сам тоннель — настоящий: холодный камень, застывший
    воздух и терпение вина, оставленного в темноте одному. А Некреси, чьи епископы держали собственный
    погреб закопанных квеври, стоит на своём хребте всего в нескольких километрах отсюда.
  tip: >-
    Возьмите куртку даже в августе: при 12–16 °C холод доберётся до вас в течение получаса. По данным
    компании, тоннель открыт ежедневно с 10:00 до 20:00, а ресторан — до 22:00; проверьте перед поздним
    визитом. Экскурсии с гидом, так что в выходные и во время сбора урожая можно подождать следующую группу,
    а мастер-классы (хлеб, чурчхела, чача) лучше бронировать заранее. Цены зависят от пакета дегустации.
    Тот, кто за рулём, пусть пропустит дегустацию или отдаст ключи. На месте есть ресторан и парковка,
    а до Некреси — несколько минут езды.
  route: >-
    Выезжайте из Тбилиси на восток по кахетинской трассе S5 через Сагареджо до Бакурцихе, затем по Sh207
    через Гурджаани и по Sh69 мимо Мукузани, через Алазани в Кварели. Тоннель лежит у подножия гор к северу
    от центра города, за проспектом Ильи Чавчавадзе. Всего около 148 км, около 2 часов 35 минут, полностью
    по асфальту; машины эконом-класса достаточно. Альтернатива через Гомборский перевал и Телави — более
    живописная дорога, но медленнее, и зимой снег может закрыть перевал. Заправка — в Гурджаани и Кварели.
fa:
  name: تونل شراب خارِبا
  short: >-
    شبکه‌ای ۷٫۷ کیلومتری از تونل‌های کنده‌شده در سنگ قفقاز نزدیک کوارلی، که در سال ۱۹۶۲ گشوده شد و شراب
    در آن در دمای ثابت ۱۲ تا ۱۶ درجه پیر می‌شود.
  body: >-
    **از گرمای کاختی به درون کوه گام بگذارید؛ پس از چند قدم تابستان رخت برمی‌بندد.**


    تونل شراب کوارلی، که امروز شرکت شراب‌سازی خارِبا آن را می‌گرداند، درست در جایی که کوهپایه‌ها از دشت
    آلازانی برمی‌خیزند، در سنگ قفقاز بزرگ کنده شده است. به گفتهٔ شرکت، در سال ۱۹۶۲، ویژهٔ کنگرهٔ جهانی
    تاک و شراب، گشوده شد. راهروهایش در مجموع ۷٫۷ کیلومتر می‌شود: دو تونل اصلی که به‌وسیلهٔ سیزده تونل
    رابط به هم پیوسته‌اند. خودِ کوه خنک می‌کند، و هوا را در همهٔ سال میان ۱۲ و ۱۶ درجه نگاه می‌دارد.


    بازدیدکنندگان از یکی از دو دروازه وارد می‌شوند. درون، راهرویی سفیدکاری‌شده و طاق‌دار بر کف کاشی‌کاری‌شده
    است، دیوارهایش ضربانی پیوسته از طاق‌های آجر سرخ که بطری‌های تیره‌رنگ در آن‌ها چیده شده‌اند. بطری‌ها
    به پهلو خفته‌اند یا سرنگون ایستاده‌اند، تا چوب‌پنبه‌ها در طول سال‌های پیرشدن مرطوب بمانند. شرکت تا
    ۲۶٬۰۰۰ بطری در این‌جا نگه می‌دارد؛ کهن‌ترین شراب مجموعه هفده سال عمر دارد. آن‌سوی دروازهٔ دوم، دور
    از دید، شراب بیشتری در فولاد و چوب بلوط آرام گرفته است.


    بیرون، مجموعه به کاختیِ کوچکی در فضای روباز بدل می‌شود: آسیاب آبی، تنوری برای نان، دستگاه چاچاسازی،
    سرداب شراب کهنی (مارانی) با چرخشت و کوِوری‌هایش، برکه‌ای برای قزل‌آلا، و تاکستان مجموعه‌ای با بیش
    از ۳۰۰ رقم انگور گرجی. می‌توانید شوتی بپزید، چورچخلا درست کنید یا در فصل برداشت انگور بفشارید؛ در
    چشش می‌توانید تا نزدیک پنجاه شراب خارِبا را بچشید.


    همه‌چیز صیقلی و بی‌پرده تجاری است، اما خودِ تونل چیزی راستین است: سنگ سرد، هوایی بی‌حرکت و شکیبایی
    شرابی که در تاریکی به تنهایی رها شده. و نکرسی، که اسقفانش سردابهٔ خودشان را با کوِوری‌های مدفون داشتند،
    تنها چند کیلومتر دورتر بر تیغهٔ خود ایستاده است.
  tip: >-
    حتی در اوت هم کاپشنی همراه ببرید: در دمای ۱۲ تا ۱۶ درجه، سرما در نیم‌ساعت به شما می‌رسد. شرکت تونل
    را روزانه از ۱۰:۰۰ تا ۲۰:۰۰ باز اعلام می‌کند و رستوران را تا ۲۲:۰۰؛ پیش از بازدیدی دیرهنگام بررسی
    کنید. گشت‌ها با راهنما همراه‌اند، پس در پایان هفته و در فصل برداشت ممکن است منتظر گروه بعدی بمانید،
    و کارگاه‌ها (نان، چورچخلا، چاچا) بهتر است پیشاپیش رزرو شوند. قیمت‌ها به بستهٔ چشیدن شراب بستگی دارد.
    هرکس رانندگی می‌کند بهتر است چشیدن را کنار بگذارد یا کلید را بسپارد. رستوران و پارکینگ در محل هست،
    و نکرسی با خودرو فاصلهٔ کوتاهی دارد.
  route: >-
    از تفلیس به سوی شرق، بر بزرگراه کاختی S5 از ساگارجو تا باکورتسیخه بروید، سپس از راه Sh207 از میان
    گورجانی و Sh69 از کنار موکوزانی، از آلازانی بگذرید و به کوارلی بروید. تونل در پای کوه‌ها، درست شمال
    مرکز شهر، آن‌سوی خیابان ایلیا چاوچاوادزه، جای دارد. مسافت کل حدود ۱۴۸ کیلومتر، نزدیک به ۲ ساعت و ۳۵
    دقیقه، همه آسفالت؛ خودرویی اقتصادی کافی است. راه دیگر از گذرگاه گومبوری و تلاوی زیباتر اما آهسته‌تر
    است، و برف زمستانی می‌تواند آن را ببندد. سوخت‌گیری در گورجانی و کوارلی.
he:
  name: מנהרת היין חארבה
  short: >-
    רשת מנהרות באורך 7.7 ק"מ חצובה בסלע הקווקז בקוואראלי, שנפתחה ב-1962, שבה היין מתיישן בטמפרטורה קבועה
    של 12–16 מעלות.
  body: >-
    **צאו מהחום הקאחתי אל תוך ההר, ותוך כמה פסיעות הקיץ נעלם.**


    מנהרת היין של קוואראלי, המנוהלת כיום בידי בית היין חארבה, חצובה בסלע הקווקז הגדול, ממש היכן שמדרונות
    ההר מתרוממים מעמק האלאזני. לפי החברה, היא נפתחה ב-1962 ונחצבה במיוחד לקונגרס העולמי לגפן וליין. המעברים
    שלה מסתכמים ב-7.7 ק"מ: שתי מנהרות מרכזיות המחוברות בשלוש-עשרה מנהרות מקשרות. ההר עצמו מקרר, ומחזיק
    את האוויר בין 12 ל-16 מעלות במשך כל השנה.


    מבקרים משתמשים באחת משתי הכניסות. בפנים גלריה מקומרת מסוידת בלבן על רצפת אריחים, קירותיה קצב עקבי
    של קשתות לבנים אדומות דחוסות בבקבוקים כהים. הם שוכבים על צדם או עומדים הפוכים, כדי שהפקקים יישארו
    לחים במשך שנות ההתיישנות. החברה שומרת כאן עד 26,000 בקבוקים; יין האוסף העתיק ביותר בן שבע-עשרה שנים.
    מעבר לכניסה השנייה, מחוץ לעין, עוד יין נח בפלדה ובעץ אלון.


    בחוץ, המתחם הופך לקאחתי קטנה תחת כיפת השמיים: טחנת מים, תנור לחם גאורגי (תונה), מבשלת צ'אצ'ה, מראני
    ישן עם מכבש היין והקוורי שלו, בריכת פורלים, וכרם אוסף של יותר מ-300 זני גפן גאורגיים. אפשר לאפות שוטי,
    לטבול צ'ורצחלה או לרסק ענבים בזמן הבציר; טעימות משתרעות על כחמישים יינות חארבה.


    המקום מלוטש ומסחרי בגלוי, אך המנהרה עצמה היא הדבר האמיתי: אבן קרה, אוויר דומם וסבלנותו של יין שהושאר
    לבדו באפלה. ונקרסי, שלבישופים שלה היה מרתף משלהם של קוורי טמון, עומדת על רכסה שלה רק כמה קילומטרים
    משם.
  tip: >-
    הביאו מעיל אפילו באוגוסט: בטמפרטורה של 12–16 מעלות, הקור מגיע אליכם תוך חצי שעה. החברה מציינת שהמנהרה
    פתוחה מדי יום 10:00–20:00 והמסעדה עד 22:00; בדקו לפני ביקור מאוחר. הסיורים מודרכים, כך שבסופי שבוע
    ובזמן הבציר תיתכן המתנה לקבוצה הבאה, וסדנאות (לחם, צ'ורצחלה, צ'אצ'ה) כדאי להזמין מראש. המחירים תלויים
    בחבילת הטעימה. מי שנוהג כדאי שיוותר על הטעימה או ימסור את המפתחות. יש מסעדה וחניה במקום, ונקרסי במרחק
    נסיעה קצרה.
  route: >-
    צאו מטביליסי מזרחה בכביש קאחתי S5, דרך סאגארג'ו אל בקורציחה, ואז בדרך Sh207 דרך גורג'אני ובדרך Sh69
    על פני מוקוזני, חצו את האלאזני והיכנסו לקוואראלי. המנהרה שוכנת למרגלות ההרים ממש מצפון למרכז העיר,
    מעבר לשדרת איליה צ'בצ'בדזה. בסך הכול כ-148 ק"מ, כשעתיים ו-35 דקות, אספלט כל הדרך; רכב אקונומי מספיק.
    החלופה דרך מעבר גומבורי וטלאווי היא הנסיעה היפה יותר אך האיטית יותר, ושלג יכול לסגור אותה בחורף. תדלוק
    בגורג'אני ובקוואראלי.
ar:
  name: نفق خاريبا للنبيذ
  short: >-
    شبكة أنفاق طولها 7.7 كم محفورة في صخر القوقاز عند كفاريلي، افتُتحت عام 1962، حيث يتعتّق النبيذ عند
    درجة حرارة ثابتة بين 12 و16 درجة.
  body: >-
    **اخرج من حرارة كاختي إلى داخل الجبل، وفي غضون خطوات قليلة يزول الصيف.**


    نفق النبيذ في كفاريلي، الذي تديره اليوم شركة خاريبا للنبيذ، محفور في صخر القوقاز الأكبر تمامًا حيث
    ترتفع سفوح التلال من وادي ألازاني. وفقًا للشركة، افتُتح عام 1962، وصُمم خصيصًا لمؤتمر الكرمة والنبيذ
    العالمي. تبلغ ممراته مجتمعة 7.7 كم: نفقان رئيسيان يربط بينهما ثلاثة عشر نفقًا فرعيًا. الجبل نفسه يوفر
    التبريد، محافظًا على الهواء بين 12 و16 درجة على مدار السنة.


    يستخدم الزوار أحد المدخلين. في الداخل ممر مقنطر مبيّض الجدران فوق أرض مبلطة، وجدرانه إيقاع ثابت من
    عقود آجر أحمر مكتظة بزجاجات داكنة. تستلقي الزجاجات على جوانبها أو تقف رأسًا على عقب، حتى تبقى الفلينات
    رطبة طوال سنوات التعتيق. تحتفظ الشركة بما يصل إلى 26,000 زجاجة هنا؛ أقدم نبيذ في المجموعة عمره سبعة
    عشر عامًا. خلف المدخل الثاني، بعيدًا عن الأنظار، يرقد نبيذ آخر في أوعية من الفولاذ والبلوط.


    في الخارج، يتحول المجمّع إلى كاختي مصغرة في الهواء الطلق: طاحونة مائية، فرن تونه للخبز، معمل تقطير
    تشاتشا، ماراني قديم بمعصرته وجرار كفيفري، بركة تربية أسماك السلمون المرقط، وكرم يضم أكثر من 300 صنف
    من العنب الجورجي. يمكنك خبز الشوتي، أو صنع التشورتشخيلا، أو عصر العنب في موسم الحصاد؛ تمتد جلسات التذوق
    إلى نحو خمسين نوعًا من نبيذ خاريبا.


    إنه مصقول وتجاري دون خجل، لكن النفق نفسه أصيل: حجر بارد، هواء ساكن، وصبر نبيذ تُرك وحيدًا في الظلام.
    ونيكريسي، التي كان لأساقفتها سرداب خاص بهم من جرار الكفيفري المدفونة، تقف على تلتها على بعد كيلومترات
    قليلة فقط.
  tip: >-
    احمل سترة حتى في أغسطس: عند درجة حرارة بين 12 و16، يصلك البرد في غضون نصف ساعة. تعلن الشركة أن النفق
    مفتوح يوميًا من 10:00 إلى 20:00 والمطعم حتى 22:00؛ تحقق قبل زيارة متأخرة. الجولات بصحبة مرشد، فقد
    تنتظر المجموعة التالية في عطلات نهاية الأسبوع وموسم الحصاد، ويُفضَّل حجز ورش العمل (الخبز، تشورتشخيلا،
    تشاتشا) مسبقًا. تختلف الأسعار بحسب باقة التذوق. من يقود السيارة يجدر به تجاوز التذوق أو تسليم المفاتيح.
    يوجد مطعم وموقف سيارات في الموقع، ودير نيكريسي على مسافة قصيرة بالسيارة.
  route: >-
    اخرج من تبليسي شرقًا على طريق كاختي السريع S5 متجاوزًا ساغاريجو إلى باكورتسيخه، ثم خذ الطريق Sh207
    عبر غورجاني والطريق Sh69 قرب موكوزاني، عابرًا ألازاني إلى كفاريلي. يقع النفق عند سفح الجبال شمال وسط
    البلدة مباشرة، خلف شارع إيليا تشافتشافادزه. المسافة الإجمالية نحو 148 كم، حوالي ساعتين و35 دقيقة،
    كلها إسفلت؛ سيارة اقتصادية كافية. البديل عبر ممر غومبوري وتيلافي أكثر جمالًا لكنه أبطأ، وقد يغلقه
    الثلج شتاءً. التزود بالوقود في غورجاني وكفاريلي.
