ka:
  name: სნოს ხეობა და კოშკი
  short: ფართო უტყეო ხეობა ყაზბეგის სამხრეთით, აღდგენილი შუასაუკუნეების კოშკითა და ქვაში ნაკვეთი პორტრეტებით.
  body: >-
    **სნოს ხეობა ის ადგილია, რომელსაც ჯუთისკენ მიმავალთა უმეტესობა უბრალოდ ჩაუვლის** — და რომელიც ცალკე
    გაჩერებას იმსახურებს. სტეფანწმინდის სამხრეთით რამდენიმე კილომეტრში მაგისტრალი სნოსწყალს კვეთს და ასფალტიანი
    გვერდითი გზა ფართო, უტყეო ხეობაში უხვევს, სადაც ნაცრისფერი მდინარის ხრეშია და სათიბები, ზურგს უკან
    კი ყაზბეგის მასივი დგას.


    სოფელ სნოში, ხუთი კილომეტრის შემდეგ, ორი რამ ღირს ფეხით შემოვლას. პირველი კოშკია: გვიანი შუასაუკუნეების
    კვადრატული, ოთხსართულიანი სათვალთვალო კოშკი, სოფლის შუაში, კლდოვან ამონაშვერზე მარტოდ მდგარი, აღდგენილი
    და ხევის ერთ-ერთი საუკეთესოდ შემონახული. ის პატარაა, უბრალო და იდეალურად დგას — ამონაშვერის თავიდან
    მთელი ხეობა ორივე მიმართულებით ჩანს, რაც სწორედ მიზანი იყო.


    მეორეს ადვილად ჩაუვლი. სოფლის ქვემოთ, მინდორზე, დიდი ლოდებია მიმოფანტული, რომლებშიც პორტრეტული თავებია
    ნაკვეთი: ქართველი მწერლები, პოეტები და საზოგადო მოღვაწეები, ბუნებრივ ქვაში მოჩუქურთმებული მოქანდაკე
    მერაბ ფირანიშვილის მიერ, წლების განმავლობაში. არც წარწერაა, არც ღობე და არც განმარტება. მძღოლების
    უმეტესობა შეუმჩნევლად ჩაივლის.


    სნო ილია II-ის, სრულიად საქართველოს კათოლიკოს-პატრიარქის, საგვარეულო სოფელიცაა — ეს ხსნის, რატომაა
    ამ ზომის დასახლებაში ასე ბევრი საეკლესიო მშენებლობა.


    სოფლის შემდეგ ასფალტი ცოტა ხანს გრძელდება და მთავრდება, იწყება ჯუთისკენ მიმავალი გრუნტი. თავად ხეობა
    სინათლესთან ერთად სრულიად იცვლება: შუადღისას ბრტყელი და ნაცრისფერი, მზის ჩასვლამდე ბოლო საათში კი
    ბალახი ოქროსფრდება და მოპირდაპირე ქედები იისფერი ხდება.
  tip: >-
    საათნახევარი კოშკს, ნაკვეთ თავებსა და მდინარის პირას გასეირნებას ფარავს. ტერიტორია ღიაა, ჩრდილი არ
    არის და ქარი შუადღის შემდეგ ხეობაში ჩამოდის — ივლისშიც კი წაიღე ზედა ტანსაცმელი. კოშკს გარედან უყურებ;
    შიგნით ყოველთვის არ არის ღია. სოფელში კაფე არ არის და მაღაზიაც სახელად — საჭმელი სტეფანწმინდაში იყიდე.
    ტუალეტები საოჯახო სასტუმროებისაა. პარკინგი გზისპირაა, გზისპირი კი წვიმის შემდეგ რბილია.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) ჩრდილოეთით მიდიხარ ჯვრის უღელტეხილზე და კობზე გავლით აჩხოტამდე,
    სტეფანწმინდამდე ცოტა ადრე — დაახლოებით 148 კმ. სნოს გასახვევი მარჯვნივ, ნიშნითაა; იქიდან სოფლამდე
    ხუთი კილომეტრი ვიწრო, მაგრამ ნორმალურად დაფარული გზაა, სულ 152 კმ და დაახლოებით სამი საათი. თავად
    სნომდე ეკონომ-კლასის მანქანა საკმარისია. საწვავი გუდაურში ან სტეფანწმინდაშია, ხეობაში არაფერია. ზამთარში
    გვერდით გზას მაგისტრალზე გვიან წმენდენ.
en:
  name: Sno Valley and Tower
  short: A broad treeless valley south of Kazbegi with a restored medieval tower and a field of carved
    stone portraits.
  body: >-
    **The Sno valley is what most people drive past on the way to Juta,** and it deserves a stop of its
    own. A few kilometres south of Stepantsminda the highway crosses the Snostskali, and a paved side
    road turns up a broad, treeless valley of grey river gravel and hay meadow, with the Kazbegi massif
    standing behind you.


    Sno village, five kilometres in, has two things worth the walk. The first is its tower: a square four-storey
    watchtower of the late medieval period, standing alone on a rock outcrop in the middle of the village,
    restored and one of the best preserved in Khevi. It is small, plain and perfectly placed — from the
    top of the outcrop the whole valley is visible in both directions, which was the entire idea.


    The second is easier to miss. In a field below the village lies a scatter of large boulders carved
    into portrait heads: Georgian writers, poets and public figures, cut into the natural stone by the
    sculptor Merab Piranishvili over many years. There are no labels, no fence and no explanation. Most
    drivers pass without noticing them.


    Sno is also the ancestral village of Ilia II, the Catholicos-Patriarch of Georgia, which explains
    the disproportionate amount of church building here for a settlement of this size.


    Beyond the village the asphalt runs on a short way and then gives out, and the track towards Juta
    begins. Sno is also where much of Khevi's hay is cut, and in August the meadows are full of stacked
    cocks and people working with hand scythes, which is worth ten minutes of anyone's time.


    The valley itself changes completely with the light: flat and grey at midday, while in the last hour
    before sunset the grass turns gold and the ridges opposite go violet.
  tip: >-
    An hour and a half covers the tower, the carved heads and a walk along the river. It is open ground
    with no shade, and the wind funnels down the valley most afternoons, so bring a layer even in July.
    The tower is looked at from outside; the interior is not always open. There is no café in the village
    and no shop worth the name, so buy food in Stepantsminda. Toilets are guesthouse toilets. Parking
    is on the verge, and the verge is soft after rain.
  route: >-
    Take the Georgian Military Highway (E117) north from Tbilisi over the Jvari Pass and down through
    Kobi to Achkhoti, just short of Stepantsminda — about 148 km. The Sno turning is signed on the right;
    from there it is five kilometres of narrow but properly surfaced road to the village, 152 km and around
    three hours in total. An economy car is enough as far as Sno itself. Fuel at Gudauri or in Stepantsminda,
    as there is none in the valley. In winter the side road is cleared less promptly than the highway.
ru:
  name: Ущелье Сно и башня
  short: Широкая безлесная долина южнее Казбеги с отреставрированной средневековой башней и полем каменных
    портретов.
  body: >-
    **Ущелье Сно — то, мимо чего большинство проезжает по дороге в Джуту,** и оно заслуживает отдельной
    остановки. В нескольких километрах южнее Степанцминды трасса пересекает Сностскали, и асфальтовая
    боковая дорога уходит вверх по широкой безлесной долине из серого речного галечника и сенокосов, а
    за спиной стоит массив Казбека.


    В селе Сно, в пяти километрах, есть две вещи, ради которых стоит пройтись. Первая — башня: квадратная
    четырёхъярусная сторожевая башня позднего средневековья, стоящая особняком на скальном выступе посреди
    села, отреставрированная и одна из лучше всего сохранившихся в Хеви. Она маленькая, простая и поставлена
    идеально: с верха выступа долина просматривается в обе стороны, ради чего всё и делалось.


    Вторую легко пропустить. На поле ниже села разбросаны крупные валуны с вырезанными в них портретными
    головами: грузинские писатели, поэты и общественные деятели, высеченные в природном камне скульптором
    Мерабом Пиранишвили за многие годы. Ни табличек, ни ограды, ни объяснений. Большинство водителей проезжает,
    не замечая их.


    Сно — ещё и родовое село Илии II, Католикоса-Патриарха всея Грузии, чем и объясняется несоразмерное
    для такого населённого пункта количество церковного строительства.


    За селом асфальт тянется ещё немного и обрывается, начинается грунтовка в сторону Джуты. Само ущелье
    полностью меняется от света: плоское и серое в полдень, а в последний час перед закатом трава становится
    золотой, а хребты напротив — фиолетовыми.
  tip: >-
    Полутора часов хватает на башню, каменные головы и прогулку вдоль реки. Место открытое, тени нет,
    и после полудня по ущелью почти всегда тянет ветер — берите кофту даже в июле. Башню осматривают снаружи,
    внутрь пускают не всегда. Кафе в селе нет, магазина в полном смысле слова тоже — еду покупайте в Степанцминде.
    Туалеты принадлежат гостевым домам. Парковка на обочине, а обочина после дождя мягкая.
  route: >-
    По Военно-Грузинской дороге (E117) на север от Тбилиси через Крестовый перевал и вниз через Коби до
    Ачхоти, чуть не доезжая Степанцминды, — около 148 км. Поворот на Сно обозначен справа; оттуда пять
    километров узкой, но нормально покрытой дороги до села, всего 152 км и примерно три часа. До самого
    Сно достаточно машины эконом-класса. Заправка в Гудаури или Степанцминде — в ущелье её нет. Зимой
    боковую дорогу чистят позже, чем трассу.
fa:
  name: درهٔ سنو و برج آن
  short: دره‌ای پهن و بی‌درخت در جنوب کازبگی، با برجی مرمت‌شده از سده‌های میانه و دشتی از سنگ‌های چهره‌تراش.
  body: >-
    **درهٔ سنو همان جایی است که بیشتر مردم در راه جوتا از کنارش رد می‌شوند،** و خودش ارزش یک توقف را دارد.
    چند کیلومتر جنوب استپان‌تسمیندا بزرگراه از رود سنوستسکالی می‌گذرد و جاده‌ای فرعی و آسفالته به درون
    دره‌ای پهن و بی‌درخت می‌پیچد، پر از شن خاکستری رودخانه و علفزارهای علوفه، در حالی که تودهٔ کازبگی
    پشت سرتان ایستاده است.


    روستای سنو، پنج کیلومتر آن‌سوتر، دو چیز دارد که پیاده‌روی برایش می‌ارزد. نخست برج آن است: برجی دیده‌بانی
    چهارگوش و چهارطبقه از اواخر سده‌های میانه، تنها بر برآمدگی سنگی در میان روستا، مرمت‌شده و از بهترین
    نمونه‌های سالم‌مانده در خوی. کوچک است و ساده و کاملاً درست جای‌گذاری شده؛ از بالای آن برآمدگی، تمام
    دره در هر دو سو دیده می‌شود، و مقصود هم دقیقاً همین بود.


    دومی را آسان‌تر می‌شود ندید. در دشتی پایین‌تر از روستا، سنگ‌های بزرگی پراکنده است که در آنها سرهای
    چهره‌نگاری تراشیده شده: نویسندگان و شاعران و چهره‌های عمومی گرجی، کنده‌شده در سنگ طبیعی به دست پیکرتراش
    مراب پیرانیشویلی در طول سال‌ها. نه برچسبی هست، نه حصاری و نه توضیحی. بیشتر رانندگان بی‌آنکه ببینند
    رد می‌شوند.


    سنو روستای اجدادی ایلیای دوم، کاتولیکوس-پاتریارک گرجستان، هم هست، و همین توضیح می‌دهد چرا در آبادی‌ای
    به این اندازه این‌همه ساخت‌وساز کلیسایی هست.


    پس از روستا آسفالت اندکی ادامه می‌یابد و تمام می‌شود و مسیر خاکی به سوی جوتا آغاز می‌گردد. خود دره
    با نور یکسره دگرگون می‌شود: در نیمروز مسطح و خاکستری، و در آخرین ساعت پیش از غروب علف طلایی می‌شود
    و یال‌های روبه‌رو بنفش.
  tip: >-
    یک ساعت و نیم برج و سرهای تراشیده و قدم زدن کنار رود را پوشش می‌دهد. زمین باز است و سایه ندارد و باد
    بیشتر بعدازظهرها در دره پایین می‌آید، پس حتی در تیر لباس گرم بردارید. برج را از بیرون می‌بینید و درونش
    همیشه باز نیست. در روستا کافه‌ای نیست و مغازه‌ای هم به معنای واقعی، پس خوراک را در استپان‌تسمیندا
    بخرید. سرویس‌های بهداشتی متعلق به خانه‌های مهمان است. پارک کنار جاده است و کنارهٔ جاده پس از باران
    نرم می‌شود.
  route: >-
    از تفلیس روی بزرگراه نظامی گرجستان (E117) به شمال و از گردنهٔ جواری و سپس پایین از کوبی تا آچخوتی،
    اندکی پیش از استپان‌تسمیندا — حدود 148 کیلومتر. انشعاب سنو سمت راست تابلو دارد؛ از آنجا پنج کیلومتر
    جادهٔ باریک اما درست‌روکش تا روستاست، رویهم 152 کیلومتر و نزدیک سه ساعت. تا خود سنو خودروی اقتصادی
    کافی است. سوخت در گودائوری یا استپان‌تسمینداست، چون در دره چیزی نیست. در زمستان جادهٔ فرعی دیرتر از
    بزرگراه برف‌روبی می‌شود.
he:
  name: עמק סנו והמגדל
  short: עמק רחב וחסר עצים מדרום לקזבגי, ובו מגדל שימור מימי הביניים ושדה סלעים מגולפים בדמויות.
  body: >-
    **עמק סנו הוא מה שרוב הנוסעים חולפים על פניו בדרך ליוטה,** והוא ראוי לעצירה בפני עצמו. כמה קילומטרים
    מדרום לסטפנצמינדה חוצה הכביש את נחל סנוסצקאלי, ודרך צדדית סלולה פונה במעלה עמק רחב וחסר עצים של חצץ
    נהר אפור ואחו שחת, כשמסיף קזבגי ניצב מאחוריכם.


    בכפר סנו, חמישה קילומטרים פנימה, יש שני דברים שכדאי ללכת אליהם. הראשון הוא המגדל: מגדל תצפית מרובע
    בן ארבע קומות מסוף ימי הביניים, עומד לבדו על גוש סלע במרכז הכפר, משוחזר ומן המשומרים ביותר בחווי.
    הוא קטן, פשוט וממוקם למופת — מראש הסלע נשקף כל העמק לשני הכיוונים, וזה בדיוק היה הרעיון.


    את השני קל יותר לפספס. בשדה מתחת לכפר פזורים סלעים גדולים שגולפו בהם ראשי דיוקן: סופרים, משוררים ואישי
    ציבור גאורגים, חצובים באבן הטבעית בידי הפסל מראב פיראנישווילי לאורך שנים. אין שילוט, אין גדר ואין
    הסבר. רוב הנהגים חולפים בלי לשים לב.


    סנו הוא גם כפר אבותיו של איליה השני, הקתוליקוס-פטריארך של גאורגיה, מה שמסביר את כמות הבנייה הכנסייתית
    החריגה ליישוב בגודל כזה.


    מעבר לכפר ממשיך האספלט מרחק קצר ונגמר, ומתחילה דרך העפר לכיוון יוטה. העמק עצמו משתנה כליל עם האור:
    שטוח ואפור בצהריים, ובשעה האחרונה לפני השקיעה העשב מזהיב והרכסים ממול נצבעים בסגול.
  tip: >-
    שעה וחצי מכסה את המגדל, את ראשי האבן והליכה לאורך הנהר. השטח פתוח ואין בו צל, והרוח מתעלת במורד העמק
    ברוב אחר הצהריים, אז קחו שכבה גם ביולי. את המגדל מביטים מבחוץ; הפנים אינו פתוח תמיד. אין בית קפה בכפר
    ואין חנות ראויה לשמה, אז קנו אוכל בסטפנצמינדה. השירותים שייכים לבתי הארחה. החניה בשולי הדרך, והשוליים
    רכים אחרי גשם.
  route: >-
    סעו צפונה מטביליסי בכביש הצבא הגאורגי (E117) מעל מעבר ג׳ווארי ובמורד דרך קובי עד אצ׳חוטי, מעט לפני
    סטפנצמינדה — כ-148 ק״מ. הפנייה לסנו משולטת מימין; משם חמישה קילומטרים של דרך צרה אך סלולה כהלכה עד
    הכפר, בסך הכול 152 ק״מ וכשלוש שעות. עד סנו עצמה רכב חסכוני מספיק. דלק בגודאורי או בסטפנצמינדה, שכן
    בעמק אין. בחורף מפנים את הדרך הצדדית מאוחר יותר מאשר את הכביש הראשי.
ar:
  name: وادي سنو وبرجه
  short: وادٍ عريض خالٍ من الشجر جنوبي كازبيغي، فيه برج مرمم من العصور الوسطى وحقل صخور منحوتة بوجوه.
  body: >-
    **وادي سنو هو ما يمر به معظم الناس مروراً في طريقهم إلى جوتا،** وهو يستحق وقفة خاصة. على بعد بضعة
    كيلومترات جنوبي ستيبانتسميندا يعبر الطريق نهر سنوستسكالي، وينعطف طريق جانبي معبّد صاعداً في وادٍ عريض
    خالٍ من الشجر، من حصى نهري رمادي ومروج حشيش، بينما تقف كتلة كازبيغي خلفك.


    في قرية سنو، على بعد خمسة كيلومترات، شيئان يستحقان المشي. الأول برجها: برج مراقبة مربع من أربع طبقات
    يعود إلى أواخر العصور الوسطى، قائم وحده على نتوء صخري في وسط القرية، مرمم ومن أفضل ما بقي في خيفي.
    صغير وبسيط وموضعه مثالي؛ فمن أعلى النتوء يُرى الوادي كله في الاتجاهين، وهذا هو المقصود كله.


    أما الثاني ففواته أسهل. في حقل أسفل القرية تتناثر صخور كبيرة نُحتت فيها رؤوس شخصيات: كتاب وشعراء ووجوه
    عامة من جورجيا، حفرها في الحجر الطبيعي النحات مراب بيرانيشفيلي على مدى سنوات. لا لافتات ولا سياج ولا
    شرح. ويمر أكثر السائقين دون أن ينتبهوا.


    وسنو كذلك قرية أجداد إيليا الثاني، كاثوليكوس بطريرك جورجيا، وهذا يفسر هذا القدر من البناء الكنسي غير
    المتناسب مع بلدة بهذا الحجم.


    وبعد القرية يمتد الإسفلت قليلاً ثم ينتهي، ويبدأ المسلك الترابي نحو جوتا. والوادي نفسه يتبدل تماماً
    مع الضوء: مسطح رمادي عند الظهيرة، وفي الساعة الأخيرة قبل الغروب يذهب العشب إلى الذهبي وتصير السلاسل
    المقابلة بنفسجية.
  tip: >-
    ساعة ونصف تغطي البرج والرؤوس المنحوتة ونزهة على ضفة النهر. الأرض مكشوفة بلا ظل، والريح تنساب في الوادي
    أكثر فترات ما بعد الظهر، فاحمل طبقة إضافية حتى في تموز. ويُشاهد البرج من الخارج، وداخله ليس مفتوحاً
    دائماً. لا مقهى في القرية ولا متجر يستحق الاسم، فاشترِ الطعام في ستيبانتسميندا. ودورات المياه تابعة
    لبيوت الضيافة. والوقوف على كتف الطريق، والكتف طرية بعد المطر.
  route: >-
    اسلك الطريق العسكري الجورجي (E117) شمالاً من تبليسي فوق ممر جواري ثم هبوطاً عبر كوبي حتى أتشخوتي،
    قبيل ستيبانتسميندا — نحو 148 كم. مفرق سنو عليه لافتة إلى اليمين؛ ومنه خمسة كيلومترات من طريق ضيق لكنه
    معبّد كما ينبغي حتى القرية، أي 152 كم ونحو ثلاث ساعات إجمالاً. وحتى سنو نفسها تكفي سيارة اقتصادية.
    الوقود في غودااوري أو ستيبانتسميندا، إذ لا وقود في الوادي. وفي الشتاء يتأخر كسح الطريق الجانبي عن
    الطريق الرئيسي.
