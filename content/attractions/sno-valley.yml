ka:
  name: სნოს ხეობა და კოშკი
  short: >-
    ხევის ძველი სამოურავოს ცენტრი, 1760 მეტრზე: კოშკი კლდოვან ამონაშვერზე და მერაბ ფირანიშვილის მიერ ლოდებში
    გამოკვეთილი უზარმაზარი სახეები.
  body: >-
    **ჯუთისკენ მიმავალი მძღოლების უმეტესობა სნოს მხოლოდ ფანჯრიდან ხედავს და ვერც ამჩნევს, რომ ოდესღაც
    ხევის ერთ-ერთი სამოურავოს ცენტრს ჩაუქროლა.**


    სოფელი სნოსწყლის ხეობაში, ზღვის დონიდან 1760 მეტრზე, სტეფანწმინდიდან რვა კილომეტრში დგას: ფართო, უტყეო
    ველი, მდინარის ნაცრისფერი ხრეში და სათიბები, ზურგს უკან კი ყაზბეგის მასივი. XVIII საუკუნეში ხევი ოთხ
    სამოურავოდ იყოფოდა და სნო ერთ-ერთის ცენტრი იყო; დღესაც აქ იკრიბება შვიდსოფლიანი თემი, რომელშიც ჯუთაც
    შედის.


    სოფლის შუაგულში, გალავნით შემოზღუდულ კლდოვან ამონაშვერზე, ხევური კოშკი დგას — ვიწრო, ქვის, დაბალი
    პირამიდული სახურავით. მისი თავიდან ხეობა ორივე მიმართულებით მოჩანს, და ამ ადგილზე სწორედ ამიტომ დადგეს.
    მთიდან სოფელს ეკლესია გადაჰყურებს, 1987 წელს ძველი ტაძრის საძირკველზე აგებული.


    მეორე სანახაობა უფრო ადვილად გამოგრჩებათ. მინდორში მოქანდაკე მერაბ ფირანიშვილს უზარმაზარი ადამიანის
    სახეები პირდაპირ ბუნებრივ ლოდებში გამოუკვეთავს: ზოგი გვერდზე წევს, ზოგი ცას შესცქერის. ღობე არ აკრავს
    და ბევრი მგზავრი ისე ჩაუვლის, რომ ვერც შეამჩნევს.


    1900 წელს „ქრისტიანობის აღმადგენელმა საზოგადოებამ“ სნოში საეკლესიო-სამრევლო სკოლა გახსნა; შენობისთვის
    სოფლელებმა ოთხ-ოთხი მანეთი შეაგროვეს, ორი წლის შემდეგ კი, მათივე თხოვნით, სკოლა ორკლასიანი გახდა.
    სნოდანაა ილია II-ის, სრულიად საქართველოს კათოლიკოს-პატრიარქის, გვარიც: ირაკლი ღუდუშაური-შიოლაშვილი
    1933 წელს ვლადიკავკაზში დაიბადა, მამისეული ფესვები კი აქ აქვს.


    შუადღისას ხეობა ბრტყელი და ნაცრისფერია. მზის ჩასვლამდე ბოლო საათში კი ბალახი ოქროსფერს იღებს, შორეული
    ქედები — იისფერს, და სნო აღარ არის ადგილი, რომელსაც სადღაც მიმავალნი გაივლიან.
  tip: >-
    საათნახევარი კოშკისთვის, ქვის სახეებისა და მდინარის პირას გასეირნებისთვის სავსებით საკმარისია. ველი
    ღიაა, ჩრდილი არსად არის, ნაშუადღევს კი ხეობას ქარი ჩამოუყვება, ამიტომ ივლისშიც წაიღეთ თბილი შრე. კოშკს
    ძირითადად გარედან ათვალიერებენ. ქვის სახეები თუ ვერ იპოვეთ, სოფელში ჰკითხეთ — გზას სიამოვნებით გიჩვენებენ.
    სოფელში კაფე არ არის და მაღაზიაც მწირია: საჭმელი სტეფანწმინდაში იყიდეთ. მანქანას გზისპირას აჩერებენ,
    წვიმის შემდეგ კი გზისპირა რბილდება — ბორბალი არ ჩაგეფლოთ.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზას (ს3/E117) ჩრდილოეთისკენ გაუყევით, ჯვრის უღელტეხილი გადაიარეთ
    და კობის გავლით აჩხოტამდე ჩადით, სტეფანწმინდამდე ცოტა ადრე — დაახლოებით 148 კილომეტრი. სნოს მოსახვევი
    მარჯვნივაა და მონიშნულია; იქიდან სოფლამდე ხუთი კილომეტრი ვიწრო, მაგრამ ასფალტიანი გზაა. სულ 152 კილომეტრი
    და დაახლოებით სამი საათი. სნომდე ეკონომკლასის მანქანაც უპრობლემოდ მოვა; სოფლის შემდეგ ასფალტი მალე
    თავდება და ჯუთისკენ გრუნტის გზა იწყება. ხეობაში საწვავი არ არის — ავზი გუდაურში ან სტეფანწმინდაში
    შეავსეთ. ზამთარში ამ გვერდით გზას თოვლისგან მაგისტრალზე გვიან წმენდენ.
en:
  name: Sno Valley and Tower
  short: >-
    A former seat of Khevi's governors at 1,760 m: a stone tower on a walled crag and giant faces carved
    into boulders by the sculptor Merab Piranishvili.
  body: >-
    **Most drivers see Sno only through a side window on the way to Juta, and never learn that they have
    just passed the old seat of one of Khevi's four governors.**


    The village stands at 1,760 metres on the Snostskali, eight kilometres from Stepantsminda, in a broad,
    treeless valley of grey river gravel and hay meadow with the Kazbegi massif at your back. In the 18th
    century Khevi was divided into four districts, each under a mouravi, or governor, and Sno was the
    seat of one of them. It is still the centre of a community of seven villages, Juta among them.


    In the middle of the village a Khevi tower rises from a walled outcrop of rock: slim, stone, with
    a low pyramidal roof. From its top the valley is visible in both directions, which is why it was put
    there. On the slope above, the church was rebuilt in 1987 on the foundations of an older one.


    The second sight is easier to miss. In a meadow the sculptor Merab Piranishvili has cut enormous human
    faces straight into the natural boulders, some lying on their sides, some staring at the sky. There
    is no fence, and plenty of travellers drive past without noticing them.


    In 1900 the Society for the Restoration of Christianity opened a parish school here; the villagers
    paid four roubles each towards the building and, two years later, asked for it to become a two-class
    school. The family of Ilia II, Catholicos-Patriarch of All Georgia, came from Sno too: he was born
    Irakli Gudushauri-Shiolashvili in Vladikavkaz in 1933.


    At midday the valley is flat and grey. In the last hour before sunset the grass turns gold, the far
    ridges go violet, and Sno stops being somewhere on the way to somewhere else.
  tip: >-
    An hour and a half covers the tower, the stone faces and a walk by the river. The valley is open,
    with no shade, and the wind funnels down it most afternoons, so bring a warm layer even in July. The
    tower is usually seen from outside. If you cannot find the carved heads, ask in the village: people
    are glad to point the way. There is no café and little in the way of a shop, so buy food in Stepantsminda.
    Parking is on the verge, which turns soft after rain.
  route: >-
    From Tbilisi take the Georgian Military Highway (S3/E117) north over the Jvari Pass and down through
    Kobi to Achkhoti, just short of Stepantsminda, about 148 km. The signed turning for Sno is on the
    right; from there five kilometres of narrow but asphalted road bring you to the village, 152 km and
    around three hours in all. An economy car is fine as far as Sno; soon after the village the asphalt
    ends and the dirt road to Juta begins. There is no fuel in the valley, so fill up at Gudauri or Stepantsminda.
    In winter this side road is cleared later than the highway.
ru:
  name: Долина Сно и башня
  short: >-
    Бывшая резиденция одного из правителей Хеви (1760 м): башня на обнесённой стеной скале и гигантские
    лица в валунах работы Мераба Пиранишвили.
  body: >-
    **Большинство водителей видят Сно лишь в боковое окно по пути в Джуту и так и не узнают, что только
    что проехали старую резиденцию одного из четырёх правителей Хеви.**


    Село стоит на высоте 1760 метров на реке Сноцкали, в восьми километрах от Степанцминды, в широкой
    безлесной долине серого речного галечника и сенокосов; за спиной — массив Казбеги. В XVIII веке Хеви
    делился на четыре округа, каждым управлял свой моурави, и Сно был резиденцией одного из них. Он и
    сейчас центр общины из семи сёл, среди которых и Джута.


    Посреди села на обнесённом стеной скальном выступе поднимается хевская башня: стройная, каменная,
    с низкой пирамидальной кровлей. С её верха долина просматривается в обе стороны — ради этого её здесь
    и поставили. Выше по склону стоит церковь, восстановленная в 1987 году на фундаменте более древней.


    Вторую достопримечательность пропустить ещё легче. На лугу скульптор Мераб Пиранишвили высек огромные
    человеческие лица прямо в природных валунах: одни лежат на боку, другие смотрят в небо. Ограды нет,
    и многие путешественники проезжают мимо, так их и не заметив.


    В 1900 году Общество восстановления христианства открыло здесь церковноприходскую школу; жители внесли
    на постройку по четыре рубля, а через два года попросили сделать её двухклассной. Из Сно происходит
    и семья Илии II, Католикоса-Патриарха всея Грузии: он родился Ираклием Гудушаури-Шиолашвили во Владикавказе
    в 1933 году.


    В полдень долина плоская и серая. Но в последний час перед закатом трава золотится, дальние хребты
    становятся фиолетовыми, и Сно перестаёт быть местом по дороге куда-то ещё.
  tip: >-
    На башню, каменные лица и прогулку вдоль реки хватит полутора часов. Долина открытая, тени нет, а
    после полудня по ней обычно тянет ветер, так что тёплая кофта пригодится даже в июле. Башню, как правило,
    осматривают снаружи. Если не найдёте каменные головы, спросите в селе — вам охотно покажут дорогу.
    Кафе нет, да и магазина почти нет, поэтому еду покупайте в Степанцминде. Парковаться придётся на обочине,
    которая после дождя раскисает.
  route: >-
    Из Тбилиси — на север по Военно-Грузинской дороге (S3/E117) через Крестовый перевал и вниз через Коби
    до Ачхоти, не доезжая Степанцминды, около 148 км. Поворот на Сно с указателем — справа; оттуда пять
    километров узкой, но асфальтированной дороги приводят в село: всего 152 км и около трёх часов. До
    Сно доедет и машина эконом-класса; вскоре за селом асфальт кончается и начинается грунтовка на Джуту.
    Заправок в долине нет — заправьтесь в Гудаури или Степанцминде. Зимой эту боковую дорогу расчищают
    позже, чем трассу.
fa:
  name: درهٔ سنو و برج آن
  short: >-
    مقر پیشین یکی از فرمانروایان خه‌وی در ارتفاع ۱,۷۶۰ متر: برجی سنگی بر صخره‌ای دیوارکشی‌شده و چهره‌های
    غول‌آسای مراب پیرانیشویلی بر تخته‌سنگ‌ها.
  body: >-
    **بیشتر رانندگان سنو را تنها از پنجرهٔ کناری خودرو در راه جوتا می‌بینند و هرگز نمی‌فهمند که همین حالا
    از کنار مقر قدیم یکی از چهار فرمانروای خه‌وی گذشته‌اند.**


    روستا در ارتفاع ۱,۷۶۰ متر کنار رود سنوستسکالی نشسته است، هشت کیلومتر دورتر از استپانتسمیندا، در دره‌ای
    پهن و بی‌درخت از ریگ خاکستری رودخانه و چمنزارهای علف‌چینی، و تودهٔ کوه کازبگی پشت سرتان. در سدهٔ هجدهم
    خه‌وی به چهار ناحیه تقسیم می‌شد که هرکدام زیر فرمان یک «موراوی»، یعنی فرماندار محلی، بود و سنو مقر
    یکی از آنان بود. سنو هنوز مرکز مجموعه‌ای از هفت روستاست که جوتا هم یکی از آن‌هاست.


    در میانهٔ روستا برجی به سبک خه‌وی از برآمدگی سنگیِ دیوارکشی‌شده‌ای سر برمی‌آورد: باریک، سنگی، با بامی
    کوتاه و هرمی. از بالای آن دره از هر دو سو پیداست و برای همین آنجا ساخته شده است. بالاتر روی شیب، کلیسایی
    ایستاده که در سال ۱۹۸۷ بر پی‌های کلیسایی کهن‌تر از نو ساخته شد.


    دیدنی دوم را آسان‌تر می‌شود از دست داد. در چمنزاری، مراب پیرانیشویلیِ پیکرتراش چهره‌های عظیم انسانی
    را مستقیم در دل تخته‌سنگ‌های طبیعی تراشیده است؛ برخی به پهلو خوابیده‌اند و برخی به آسمان خیره مانده‌اند.
    نرده‌ای در کار نیست و بسیاری از مسافران بی‌آنکه متوجه شوند از کنارشان می‌گذرند.


    در سال ۱۹۰۰ «انجمن احیای مسیحیت» اینجا مدرسه‌ای کلیسایی گشود؛ روستاییان هرکدام چهار روبل برای ساختمانش
    پرداختند و دو سال بعد خواستند که به مدرسه‌ای دوکلاسه تبدیل شود. خانوادهٔ ایلیای دوم، کاتولیکوس-پاتریارک
    سراسر گرجستان، نیز از سنو بود: او با نام ایراکلی گودوشائوری-شیولاشویلی در سال ۱۹۳۳ در ولادی‌قفقاز
    به دنیا آمد.


    نیمروز دره هموار و خاکستری است. اما در واپسین ساعت پیش از غروب، علف‌ها زرین می‌شوند، ستیغ‌های دوردست
    بنفش، و سنو دیگر فقط جایی سرِ راهِ جایی دیگر نیست.
  tip: >-
    یک ساعت و نیم برای برج، چهره‌های سنگی و قدم زدنی کنار رود کافی است. دره باز و بی‌سایه است و بیشتر
    بعدازظهرها باد در آن می‌پیچد، پس حتی در ژوئیه یک لایهٔ گرم بیاورید. برج را معمولاً از بیرون تماشا
    می‌کنند. اگر سرهای سنگی را پیدا نکردید، از اهالی بپرسید؛ با خوشرویی راه را نشانتان می‌دهند. کافه‌ای
    نیست و مغازهٔ درخور نامی هم نه، پس خوراک را در استپانتسمیندا بخرید. جای پارک کنار جاده است که پس از
    باران نرم و گِلی می‌شود.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (S3/E117) را به سوی شمال بروید، از گردنهٔ جواری بگذرید و از راه کوبی
    تا آچخوتی، کمی پیش از استپانتسمیندا، پایین بیایید؛ حدود ۱۴۸ کیلومتر. انشعاب سنو، با تابلو، در سمت
    راست است؛ از آنجا پنج کیلومتر جادهٔ باریک اما آسفالته شما را به روستا می‌رساند: روی‌هم ۱۵۲ کیلومتر
    و حدود سه ساعت. خودروی اقتصادی تا سنو مشکلی ندارد؛ کمی پس از روستا آسفالت تمام می‌شود و جادهٔ خاکی
    جوتا آغاز می‌شود. در دره پمپ‌بنزین نیست، پس در گودائوری یا استپانتسمیندا سوخت بگیرید. در زمستان برفِ
    این جادهٔ فرعی را دیرتر از بزرگراه پاک می‌کنند.
he:
  name: עמק סנו והמגדל
  short: >-
    מושבו לשעבר של אחד ממושלי חבי, בגובה 1,760 מטר: מגדל אבן על סלע מוקף חומה ופני ענק שחצב הפסל מרב פירנישווילי
    בסלעים.
  body: >-
    **רוב הנהגים רואים את סנו רק מבעד לחלון הצד בדרך לג'וטה, ולעולם אינם יודעים שזה עתה חלפו על פני מושבו
    הישן של אחד מארבעת מושלי חבי.**


    הכפר שוכן בגובה 1,760 מטר על נחל סנוסצקאלי, שמונה קילומטרים מסטפנצמינדה, בעמק רחב וחשוף מעצים של חצץ
    נהר אפור ואחו שחת, ומאחוריכם רכס קזבגי. במאה ה-18 חולקה חבי לארבעה מחוזות, כל אחד בידי מוראווי, כלומר
    מושל, וסנו היה מושבו של אחד מהם. עד היום הוא מרכזה של קהילה בת שבעה כפרים, וג'וטה ביניהם.


    במרכז הכפר מתנשא מגדל בסגנון חבי מתוך גוש סלע מוקף חומה: דקיק, עשוי אבן, ובראשו גג פירמידלי נמוך.
    מראשו נשקף העמק לשני הכיוונים, ובשביל זה בדיוק הוצב שם. במדרון שמעליו ניצבת הכנסייה, שנבנתה מחדש ב-1987
    על יסודותיה של כנסייה עתיקה יותר.


    את המראה השני קל עוד יותר להחמיץ. באחו חצב הפסל מרב פירנישווילי פני אדם ענקיים ישירות בסלעים הטבעיים;
    חלקם שוכבים על צדם, חלקם בוהים בשמיים. אין גדר, ומטיילים רבים חולפים על פניהם בלי לשים לב.


    ב-1900 פתחה כאן "החברה לשיקום הנצרות" בית ספר כנסייתי; כל אחד מתושבי הכפר תרם ארבעה רובל לבניין, וכעבור
    שנתיים ביקשו להפוך אותו לבית ספר בן שתי כיתות. גם משפחתו של איליה השני, הקתוליקוס-פטריארך של כל גאורגיה,
    באה מסנו: הוא נולד בשם איראקלי גודושאורי-שיולאשווילי בוולדיקבקז ב-1933.


    בצהריים העמק שטוח ואפור. אבל בשעה האחרונה לפני השקיעה העשב מזהיב, הרכסים הרחוקים מסגילים, וסנו חדל
    להיות עוד מקום בדרך למקום אחר.
  tip: >-
    שעה וחצי מספיקה למגדל, לפני האבן ולטיול לאורך הנהר. העמק פתוח ואין בו צל, וברוב שעות אחר הצהריים הרוח
    נושבת במורדו, לכן הביאו שכבה חמה גם ביולי. את המגדל רואים בדרך כלל מבחוץ. אם לא מצאתם את הראשים המגולפים,
    שאלו בכפר: אנשים ישמחו להראות לכם את הדרך. אין בית קפה וכמעט אין חנות, לכן קנו אוכל בסטפנצמינדה. החניה
    היא על השוליים, שנעשים רכים ובוציים אחרי גשם.
  route: >-
    מטביליסי סעו צפונה בכביש הצבאי הגאורגי (S3/E117) מעל מעבר ג'וארי ובמורד דרך קובי עד אצ'חוטי, מעט לפני
    סטפנצמינדה, כ-148 ק"מ. הפנייה המשולטת לסנו נמצאת מימין; משם חמישה קילומטרים של כביש צר אך סלול מביאים
    אתכם לכפר: בסך הכול 152 ק"מ וכשלוש שעות. רכב קטן וחסכוני יסתדר עד סנו; זמן קצר אחרי הכפר נגמר האספלט
    ומתחילה דרך העפר לג'וטה. אין תחנת דלק בעמק, לכן תדלקו בגודאורי או בסטפנצמינדה. בחורף מפנים את השלג
    מהכביש הצדדי הזה מאוחר יותר מאשר מהכביש הראשי.
ar:
  name: وادي سنو وبرجه
  short: >-
    مقرّ سابق لأحد حكّام خيفي على ارتفاع 1,760 متراً: برج حجري فوق صخرة مسوّرة، ووجوه عملاقة نحتها النحات
    ميراب بيرانيشفيلي في الجلاميد.
  body: >-
    **لا يرى معظم السائقين سنو إلا من النافذة الجانبية في طريقهم إلى جوتا، ولا يعرفون أبداً أنهم مرّوا
    للتوّ بالمقرّ القديم لأحد حكّام خيفي الأربعة.**


    تقع القرية على ارتفاع 1,760 متراً على نهر سنوستسكالي، على بعد ثمانية كيلومترات من ستيبانتسميندا، في
    وادٍ عريض خالٍ من الشجر، من حصى النهر الرمادي ومروج الكلأ، وكتلة كازبيغي من خلفك. في القرن الثامن
    عشر كانت خيفي مقسّمة إلى أربع نواحٍ، لكل منها «موراوي»، أي حاكم محلي، وكانت سنو مقرّ أحدهم. ولا تزال
    اليوم مركز جماعة من سبع قرى، منها جوتا.


    وفي وسط القرية يرتفع برج على طراز خيفي فوق نتوء صخري مسوّر: نحيل، من الحجر، يعلوه سقف هرمي منخفض.
    ومن قمته يُرى الوادي في الاتجاهين، ولهذا بالذات شُيّد هناك. وعلى المنحدر فوقه تقوم الكنيسة التي أعيد
    بناؤها عام 1987 على أسس كنيسة أقدم.


    أما المعلم الثاني فمن الأسهل أن يفوتك. ففي مرج نحت النحات ميراب بيرانيشفيلي وجوهاً بشرية هائلة مباشرة
    في الجلاميد الطبيعية، بعضها مستلقٍ على جنبه وبعضها يحدّق في السماء. لا سياج حولها، وكثير من المسافرين
    يمرّون بها دون أن ينتبهوا لها.


    وفي عام 1900 افتتحت «جمعية إحياء المسيحية» مدرسة كنسية هنا؛ ودفع كل قروي أربعة روبلات لبنائها، وبعد
    عامين طلبوا تحويلها إلى مدرسة من صفّين. ومن سنو أيضاً تنحدر أسرة إيليا الثاني، كاثوليكوس-بطريرك عموم
    جورجيا: فقد وُلد باسم إيراكلي غودوشاوري-شيولاشفيلي في فلاديقوقاز عام 1933.


    عند الظهيرة يبدو الوادي مسطحاً رمادياً. لكن في الساعة الأخيرة قبل الغروب يستحيل العشب ذهباً، وتصطبغ
    السلاسل البعيدة بالبنفسجي، وتكفّ سنو عن أن تكون مجرد محطة على الطريق إلى مكان آخر.
  tip: >-
    تكفي ساعة ونصف للبرج والوجوه الحجرية ونزهة على ضفة النهر. الوادي مكشوف بلا ظل، والريح تندفع فيه معظم
    فترات ما بعد الظهر، فاحمل طبقة دافئة حتى في يوليو. يُشاهَد البرج عادة من الخارج. وإن لم تعثر على الرؤوس
    المنحوتة فاسأل في القرية: سيدلّك الناس على الطريق عن طيب خاطر. لا مقهى ولا متجر يُعتدّ به، فاشترِ
    الطعام من ستيبانتسميندا. ركن السيارات على حافة الطريق، وهي تلين وتوحل بعد المطر.
  route: >-
    من تبليسي اتجه شمالاً على الطريق العسكري الجورجي (S3/E117) فوق ممر جفاري ونزولاً عبر كوبي إلى أتشخوتي،
    قبيل ستيبانتسميندا، نحو 148 كم. المنعطف المشار إليه بلافتة إلى سنو على اليمين؛ ومن هناك توصلك خمسة
    كيلومترات من طريق ضيق لكنه معبّد إلى القرية: 152 كم وقرابة ثلاث ساعات في المجمل. تكفي سيارة اقتصادية
    حتى سنو؛ وبعد القرية بقليل ينتهي الإسفلت ويبدأ الطريق الترابي إلى جوتا. لا وقود في الوادي، فتزوّد
    في غوداوري أو ستيبانتسميندا. وفي الشتاء يُزاح الثلج عن هذا الطريق الفرعي بعد الطريق الرئيسي.
