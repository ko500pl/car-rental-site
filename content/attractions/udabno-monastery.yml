ka:
  name: გურიის უდაბნოს მონასტერი
  short: >-
    იოანე ნათლისმცემლის ნახევრად კლდეში ნაკვეთი მონასტერი ამაღლების მთის ტყიან ფერდობზე, ოდესღაც გურიის
    სკოლა და წიგნსაცავი. არ აგერიოთ დავითგარეჯის უდაბნოში.
  body: >-
    **უდაბნო ჰქვია, მაგრამ აქ არაფერია უდაბნოსებრი: ფერდობზე წყაროები ჩამოდის, ტყე მჭიდროდ ერტყმის ირგვლივ,
    პატარა ეკლესია კი ნახევრად მთის წიაღშია შესული.**


    სახელი ცხოვრების წესს აღნიშნავს და არა პეიზაჟს: მეუდაბნოეობა განდეგილი ბერის განმარტოებული ცხოვრება
    იყო. იოანე ნათლისმცემლის სახელობის მონასტერი ამაღლების მთის ციცაბო ფერდობზე, სოფელ შუაგანახლების ჩრდილოეთით
    დგას და გურიის ერთ-ერთი უძველესი სავანეა. რამდენად ძველი, ზუსტად არავინ იცის: მკვლევართა ნაწილი კლდის
    ეკლესიას VI საუკუნით ათარიღებს, ნაწილი — IX–X საუკუნეებით, მრავალგზის გადაკეთებამ და ძველი ქვის ხელახლა
    გამოყენებამ კი კვალი აურია. ეკლესიის აღმოსავლეთი და სამხრეთი მხარე ცოცხალი კლდეა; მშენებლებს მხოლოდ
    დასავლეთის კედელი და ჩრდილოეთის კედლის ნახევარი აუგიათ — კარგად გათლილი, ღია ფერის კვადრებით, რელიეფებით
    შემკული. ფერდობის ქვემოთ კიდევ ოთხი გამოქვაბულია აფსიდისებრი ბოლოებით, სავარაუდოდ სამლოცველოები. ამიტომაც
    უწოდებდნენ უდაბნოს „გურიის ვარძიას“.


    ეს წიგნის სავანე იყო. წინამძღვარმა იოსებ ტუსკიამ აქ შემოქმედის გულანი გადაწერა, XIX საუკუნეში კი,
    როცა სოფლებში სკოლები არ იყო, ბიჭები აქ საღვთო სჯულს, ენებს, გალობასა და კალიგრაფიას სწავლობდნენ.
    დიმიტრი ბაქრაძემ აქ წერა-კითხვის შემსწავლელი ათამდე ბიჭი ნახა; მისივე ცნობით, მონასტრის დამაარსებელი
    XVIII საუკუნის წინამძღვარი იოსებ ტუსკია იყო, კლდის ეკლესია კი სხვა რამეს მოწმობს. უდიდესი განძი IX
    საუკუნის „უდაბნოს მრავალთავი“ გახლდათ, რომელიც 1920 წელს აკაკი შანიძემ აღმოაჩინა და რომელიც 864 წელს
    გადაწერილ სინურ მრავალთავს არ ჩამოუვარდება.


    1958 წელს ადგილობრივმა ხელისუფლებამ სამშენებლო ქვის მოსაპოვებლად დიდწილად დაანგრია კლდის ეკლესიიდან
    200 მეტრით ზემოთ მდგარი 1858 წლის ტაძარი. დაიღუპა ხელნაწერები, წიგნები, ხატები; გადარჩა მხოლოდ იოანე
    ნათლისმცემლის ვერცხლით მოჭედილი ხატი და ნაკლული „მრავალთავი“. 2006 წელს უკანასკნელი კედლები ახალ ეკლესიას
    შეეწირა, ძველი ქვებით კი საყრდენი კედელი ამოაშენეს. ეს ქვები დღესაც რაღაცას მხარს უჭერენ.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი მონასტერია: მამაკაცებს გრძელი შარვალი სჭირდებათ, ქალებს — კაბა და თავსაფარი,
    სენაკებთან კი ხმადაბლა ილაპარაკეთ. იქიდან, სადაც გზა მთავრდება, კლდის ეკლესიამდე მოკლე, მაგრამ ციცაბო
    ბილიკი ადის; წვიმის შემდეგ, გურიაში კი წვიმა ხშირია, ის სრიალებს, ამიტომ მყარი ფეხსაცმელი ჩაიცვით
    და გამოქვაბულებისთვის ფანარი წაიღეთ. მონასტერი მთელი წელი ღიაა, მაგრამ ზამთარში და ძლიერი წვიმის შემდეგ
    მოუასფალტებელი ბოლო მონაკვეთი შეიძლება ღრმა ტალახად იქცეს: ასვლამდე ჩოხატაურში გაიკითხეთ და მზად იყავით,
    რომ ბოლო ნაწილი ფეხით გაიაროთ. ერთი საათი გამოყავით. მაღაზია და კაფე არ არის — საჭმელი და წყალი ჩოხატაურში
    იყიდეთ. ნავიგატორთან სიფრთხილე გმართებთ: დაუფიქრებლად აკრეფილი „უდაბნო“ ქვეყნის მეორე ბოლოში, დავითგარეჯაში
    გაგგზავნით.
  route: >-
    თბილისიდან დაახლოებით 280 კილომეტრია, ოთხი საათი და თხუთმეტი წუთი საჭესთან. ს1-ით (E60) დასავლეთით,
    ქუთაისის გვერდით სამტრედიამდე იარეთ, ს12-ით სამხრეთით რამდენიმე კილომეტრი გაიარეთ, შემდეგ შ2-ზე გადაუხვიეთ
    და საჯავახოს გავლით ჩოხატაურამდე მიდით. ქალაქში შ83-ს დაადექით ზომლეთის მიმართულებით; დაახლოებით სამი
    კილომეტრის შემდეგ ჩრდილოეთით, ადგილობრივ გზაზე გადაუხვიეთ, რომელიც ფერდობს სოფელ შუა ამაღლების გავლით
    მონასტრამდე მიუყვება — ცენტრიდან სულ დაახლოებით ექვსნახევარი კილომეტრი. ბოლო მონაკვეთი მოუასფალტებელია
    და ცუდად არის აღწერილი, ამიტომ, განსაკუთრებით წვიმის შემდეგ, მაღალი გამავლობის მანქანა ჯობს. მანქანა
    იქ დატოვეთ, სადაც გზა მთავრდება, და ფეხით ადით. უკანასკნელი ბენზინგასამართი ჩოხატაურშია.
en:
  name: Udabno Monastery, Guria
  short: >-
    A half-cave monastery of St John the Baptist on the wooded slope of Mount Amaghleba, once Guria's
    school and library; not the Udabno of David Gareja.
  body: >-
    **Udabno means “desert”, yet nothing here is dry: springs run down the slope, the forest crowds in,
    and a small church sits half inside the mountain.**


    The name describes a way of life, not a landscape: the “desert” was the solitude a hermit chose. The
    monastery of St John the Baptist stands on the steep slope of Mount Amaghleba north of the village
    of Shuaganakhlebi, and it is among the oldest in Guria. How old, nobody can say: some scholars place
    the rock church in the 6th century, others in the 9th–10th, and rebuilding with reused stone has blurred
    the evidence. The rock church's east and south sides are living rock; the builders raised only the
    west wall and half the north one, in well-dressed pale ashlar carved with reliefs. Four more caves
    lower down have apse-shaped ends and were probably chapels, which is why people called Udabno “the
    Vardzia of Guria”.


    This was a place of books. Abbot Ioseb Tuskia copied the Shemokmedi Gulani here, and in the 19th century,
    when the villages had no schools, boys came to learn scripture, languages, chant and calligraphy.
    The historian Dimitri Bakradze saw about ten of them at their letters, and credited Tuskia, an 18th-century
    abbot, with founding the monastery; the rock church says otherwise. Its greatest treasure, the 9th-century
    Udabno Mravaltavi, was identified by Akaki Shanidze in 1920 and is ranked beside the Sinai Mravaltavi
    of 864.


    In 1958 local authorities pulled down most of the church of 1858, which stood 200 metres upslope,
    for building stone. Manuscripts, books and icons perished; only a silver-covered icon of St John and
    the incomplete Mravaltavi survived. In 2006 the last walls made way for a new church, and the old
    stones went into its retaining wall. They are still holding something up.
  tip: >-
    Entry is free. This is a working monastery: long trousers for men, a skirt and headscarf for women,
    and quiet voices near the cells. From where the track ends, a short but steep path climbs to the rock
    church; after rain, and Guria has plenty, it is slippery, so wear proper shoes and bring a torch for
    the caves. The monastery is open all year, but in winter and after heavy rain the unpaved final stretch
    can turn to deep mud, so ask in Chokhatauri before driving up and be ready to walk the last part.
    Allow an hour. There is no shop or café, so buy food and water in Chokhatauri. A warning for your
    navigator: type “Udabno” carelessly and it will send you to David Gareja on the far side of the country.
  route: >-
    From Tbilisi it is about 280 km, some four and a quarter hours of driving. Take the S1 (E60) west
    past Kutaisi to Samtredia, follow the S12 south for a few kilometres, then turn onto the Sh2 through
    Sajavakho to Chokhatauri. In town pick up the Sh83 towards Zomleti; after about three kilometres turn
    north onto a local road that climbs the slope past the village of Shua Amaghleba to the monastery,
    roughly six and a half kilometres from the centre. The last stretch is unpaved and poorly documented,
    so an SUV is the sensible choice, especially after rain. Park where the track ends and walk up. Chokhatauri
    has the last fuel.
ru:
  name: Монастырь Удабно, Гурия
  short: >-
    Полупещерный монастырь Иоанна Крестителя на лесистом склоне горы Амаглеба, некогда школа и библиотека
    Гурии; не путать с Удабно в Давид-Гареджи.
  body: >-
    **«Удабно» значит «пустыня», но сухого здесь нет ничего: по склону бегут родники, лес подступает вплотную,
    а маленькая церковь наполовину уходит в гору.**


    Название говорит об образе жизни, а не о пейзаже: «пустыней» было уединение, которое избирал отшельник.
    Монастырь Иоанна Крестителя стоит на крутом склоне горы Амаглеба к северу от села Шуаганахлеби и принадлежит
    к древнейшим в Гурии. Насколько он древний, не скажет никто: одни учёные относят скальную церковь
    к VI веку, другие — к IX–X векам, а перестройки с использованием старого камня размыли свидетельства.
    У скальной церкви восточная и южная стороны — живая скала; строители возвели лишь западную стену и
    половину северной — из хорошо отёсанных светлых квадров, украшенных рельефами. Ещё четыре пещеры ниже
    по склону заканчиваются апсидами и, вероятно, служили часовнями — поэтому в народе Удабно называли
    «гурийской Вардзией».


    Это было место книг. Настоятель Иосеб Тускиа переписал здесь Шемокмедский Гулани, а в XIX веке, когда
    в сёлах не было школ, сюда приходили мальчики учиться Писанию, языкам, церковному пению и каллиграфии.
    Историк Дмитрий Бакрадзе застал около десятка учеников за грамотой и приписал основание монастыря
    Тускиа, настоятелю XVIII века; скальная церковь говорит об ином. Величайшее сокровище монастыря —
    Мравалтави Удабно IX века — выявил Акакий Шанидзе в 1920 году; его ставят в один ряд с Синайским Мравалтави
    864 года.


    В 1958 году местные власти ради строительного камня разобрали большую часть церкви 1858 года, стоявшей
    в 200 метрах выше по склону. Погибли рукописи, книги и иконы; уцелели лишь икона святого Иоанна в
    серебряном окладе и неполный Мравалтави. В 2006 году последние стены уступили место новой церкви,
    а старые камни легли в её подпорную стену. Они и сейчас что-то держат.
  tip: >-
    Вход свободный. Это действующий монастырь: мужчинам — длинные брюки, женщинам — юбка и платок, у келий
    говорите тихо. От места, где кончается дорога, к скальной церкви поднимается короткая, но крутая тропа;
    после дождя — а в Гурии их хватает — она скользкая, так что наденьте хорошую обувь и возьмите фонарик
    для пещер. Монастырь открыт круглый год, но зимой и после сильных дождей грунтовый последний отрезок
    может превратиться в глубокую грязь: перед подъёмом узнайте об условиях в Чохатаури и будьте готовы
    пройти последнюю часть пешком. Заложите час. Магазина и кафе нет, еду и воду купите в Чохатаури. Предупреждение
    для навигатора: наберёте «Удабно» небрежно — и он отправит вас в Давид-Гареджи, на другой конец страны.
  route: >-
    От Тбилиси около 280 км, примерно четыре с четвертью часа за рулём. Следуйте по S1 (E60) на запад
    мимо Кутаиси до Самтредиа, несколько километров по S12 на юг, затем сверните на Sh2 и через Саджавахо
    доберитесь до Чохатаури. В городе выезжайте на Sh83 в сторону Зомлети; примерно через три километра
    сверните на север, на местную дорогу, которая поднимается по склону через село Шуа-Амаглеба к монастырю,
    — около шести с половиной километров от центра. Последний отрезок без покрытия и плохо описан, так
    что разумный выбор — внедорожник, особенно после дождя. Оставьте машину там, где кончается дорога,
    и поднимитесь пешком. В Чохатаури — последняя заправка.
fa:
  name: صومعهٔ اودابنو، گوریا
  short: >-
    صومعه‌ای نیمه‌غاری به نام یحیای تعمیددهنده بر دامنهٔ جنگلی کوه آماغلبا، که روزگاری مدرسه و کتابخانهٔ
    گوریا بود؛ با اودابنوی داوید گارجا اشتباهش نگیرید.
  body: >-
    **«اودابنو» یعنی «بیابان»، اما اینجا هیچ چیز خشک نیست: چشمه‌ها از دامنه سرازیرند، جنگل تنگ در برش
    گرفته، و کلیسایی کوچک نیمی در دل کوه نشسته است.**


    این نام شیوه‌ای از زندگی را وصف می‌کند، نه یک منظره را: «بیابان» همان خلوتی بود که زاهد گوشه‌نشین
    برمی‌گزید. صومعهٔ یحیای تعمیددهنده بر شیب تند کوه آماغلبا، در شمال روستای شواگاناخلبی، ایستاده و از
    کهن‌ترین صومعه‌های گوریاست. چقدر کهن، کسی نمی‌داند: برخی پژوهشگران کلیسای صخره‌ای را از سدهٔ ششم می‌دانند
    و برخی از سده‌های نهم و دهم، و بازسازی‌ها با سنگ‌های دوباره‌به‌کاررفته شواهد را مبهم کرده است. دیوارهای
    شرقی و جنوبی کلیسای صخره‌ای را خودِ صخرهٔ زنده تشکیل می‌دهد؛ سازندگان تنها دیوار غربی و نیمی از دیوار
    شمالی را برآوردند، با سنگ‌های تراشیدهٔ روشن و خوش‌تراش که نقش برجسته بر آنها کنده شده است. چهار غار
    دیگر در پایین‌تر انتهایی نیم‌دایره و محراب‌گونه (اَپسیس) دارند و احتمالاً نمازخانه بوده‌اند؛ از همین
    رو مردم اودابنو را «واردزیای گوریا» می‌خواندند.


    اینجا جای کتاب بود. رئیس صومعه، یوسب توسکیا، «گولانی شموکمدی» را در همین‌جا رونویسی کرد، و در سدهٔ
    نوزدهم، وقتی روستاها مدرسه نداشتند، پسران برای آموختن کتاب مقدس، زبان‌ها، سرود کلیسایی و خوشنویسی
    به اینجا می‌آمدند. مورخ، دیمیتری باکرادزه، حدود ده تن از آنان را سرگرم درس و مشق دید و بنیان صومعه
    را به توسکیا، رئیس صومعه در سدهٔ هجدهم، نسبت داد؛ اما کلیسای صخره‌ای خلاف این را می‌گوید. گرانبهاترین
    گنجینه‌اش، «مراوالتاوی اودابنو» از سدهٔ نهم، را آکاکی شانیدزه در ۱۹۲۰ شناسایی کرد و آن را هم‌پایهٔ
    «مراوالتاوی سینا» از سال ۸۶۴ می‌شمارند.


    در ۱۹۵۸ مقامات محلی بخش بیشتر کلیسای ساخته‌شده در ۱۸۵۸ را، که ۲۰۰ متر بالاتر روی شیب قرار داشت، برای
    برداشتن سنگ ساختمانی ویران کردند. دست‌نوشته‌ها، کتاب‌ها و شمایل‌ها نابود شدند؛ تنها شمایلی از یحیای
    قدیس با روکش نقره و مراوالتاویِ ناقص به جا ماند. در ۲۰۰۶ آخرین دیوارها جای خود را به کلیسایی نو دادند
    و سنگ‌های کهنه در دیوار حائل آن به کار رفتند. آنها هنوز چیزی را سر پا نگه داشته‌اند.
  tip: >-
    ورود رایگان است. این صومعه‌ای فعال است: مردان شلوار بلند، زنان دامن و روسری، و نزدیک حجره‌های راهبان
    صدای آهسته. از جایی که راه خودرو تمام می‌شود، کوره‌راهی کوتاه اما پرشیب تا کلیسای صخره‌ای بالا می‌رود؛
    پس از باران — و گوریا باران کم ندارد — لغزنده است، پس کفش مناسب بپوشید و برای غارها چراغ‌قوه بیاورید.
    صومعه در تمام سال باز است، اما در زمستان و پس از باران‌های شدید تکهٔ آخرِ خاکی ممکن است به گل‌ولای
    عمیق بدل شود: پیش از بالا رفتن در چوخاتائوری از وضع راه بپرسید و آماده باشید بخش پایانی را پیاده بروید.
    یک ساعت وقت بگذارید. نه فروشگاهی هست نه کافه‌ای، پس غذا و آب را در چوخاتائوری بخرید. هشداری برای مسیریابتان:
    اگر «اودابنو» را سرسری تایپ کنید، شما را به داوید گارجا در آن سوی کشور می‌فرستد.
  route: >-
    از تفلیس حدود ۲۸۰ کیلومتر، نزدیک به چهار ساعت و ربع رانندگی. با S1 (E60) به سمت غرب، از کنار کوتائیسی،
    تا سامتردیا بروید، چند کیلومتر با S12 به جنوب ادامه دهید، سپس به Sh2 بپیچید و از راه ساجاواخو به چوخاتائوری
    برسید. در شهر به Sh83 به سوی زوملتی بروید؛ پس از حدود سه کیلومتر به سمت شمال وارد جاده‌ای محلی شوید
    که از میان روستای شوا آماغلبا از دامنه تا صومعه بالا می‌رود، حدود شش و نیم کیلومتر از مرکز شهر. تکهٔ
    آخر خاکی است و اطلاعات چندانی از آن در دست نیست، پس شاسی‌بلند انتخاب عاقلانه‌ای است، به‌ویژه پس از
    باران. جایی که راه تمام می‌شود خودرو را پارک کنید و پیاده بالا بروید. چوخاتائوری آخرین پمپ‌بنزین مسیر
    است.
he:
  name: מנזר אודבנו, גוריה
  short: >-
    מנזר מערות-למחצה על שם יוחנן המטביל על מדרונו המיוער של הר אמאגלבה, שהיה פעם בית הספר והספרייה של
    גוריה; אין לבלבל עם אודבנו שבדוד גארג'ה.
  body: >-
    **"אודבנו" פירושו "מדבר", אבל שום דבר כאן אינו יבש: מעיינות זורמים במורד המדרון, היער מצטופף מסביב,
    וכנסייה קטנה יושבת חציה בתוך ההר.**


    השם מתאר אורח חיים, לא נוף: ה"מדבר" היה הבדידות שבחר בה הנזיר המתבודד. מנזר יוחנן המטביל עומד על המדרון
    התלול של הר אמאגלבה, מצפון לכפר שואגנאחלבי, והוא מן העתיקים בגוריה. עד כמה עתיק — איש אינו יודע: יש
    חוקרים המתארכים את כנסיית הסלע למאה ה-6, ויש המתארכים אותה למאות ה-9–10, ובנייה מחודשת באבנים ששימשו
    קודם לכן טשטשה את העדויות. צדיה המזרחי והדרומי של כנסיית הסלע הם סלע חי; הבונים הקימו רק את הקיר המערבי
    ומחצית מן הקיר הצפוני, מאבני גזית בהירות ומסותתות היטב, מעוטרות בתבליטים. ארבע מערות נוספות, נמוך
    יותר במדרון, מסתיימות בצורת אפסיס וכנראה שימשו קפלות — ולכן כינו בני המקום את אודבנו "הוורדזיה של
    גוריה".


    זה היה מקום של ספרים. אב המנזר יוסב טוסקיה העתיק כאן את הגולאני של שמוקמדי, ובמאה ה-19, כשבכפרים לא
    היו בתי ספר, באו לכאן נערים ללמוד כתבי קודש, שפות, זמרה כנסייתית וקליגרפיה. ההיסטוריון דימיטרי בקרדזה
    ראה כעשרה מהם עסוקים בקריאה ובכתיבה, וייחס את ייסוד המנזר לטוסקיה, אב מנזר מן המאה ה-18; כנסיית הסלע
    מעידה אחרת. אוצרו הגדול ביותר, המרוולתאווי של אודבנו מן המאה ה-9, זוהה בידי אקאקי שנידזה ב-1920, והוא
    נחשב שקול למרוולתאווי של סיני משנת 864.


    ב-1958 הרסו הרשויות המקומיות את רוב הכנסייה משנת 1858, שעמדה 200 מטר במעלה המדרון, כדי לנצל את אבניה
    לבנייה. כתבי יד, ספרים ואיקונות אבדו; שרדו רק איקונה של יוחנן הקדוש מצופה כסף והמרוולתאווי, שאינו
    שלם. ב-2006 פינו הקירות האחרונים את מקומם לכנסייה חדשה, והאבנים הישנות שולבו בקיר התומך שלה. הן עדיין
    תומכות במשהו.
  tip: >-
    הכניסה חופשית. זהו מנזר פעיל: מכנסיים ארוכים לגברים, חצאית וכיסוי ראש לנשים, וקול שקט ליד תאי הנזירים.
    מהמקום שבו הדרך נגמרת מטפס שביל קצר אך תלול אל כנסיית הסלע; אחרי גשם — ובגוריה יש הרבה — הוא חלקלק,
    לכן נעלו נעליים מתאימות והביאו פנס למערות. המנזר פתוח כל השנה, אבל בחורף ואחרי גשמים כבדים הקטע האחרון,
    שאינו סלול, עלול להפוך לבוץ עמוק: בררו בצ'וחאטאורי לפני העלייה, והיו מוכנים ללכת את החלק האחרון ברגל.
    הקצו שעה. אין חנות או בית קפה, לכן קנו אוכל ומים בצ'וחאטאורי. אזהרה לנווט: הקלידו "אודבנו" ברשלנות,
    והוא ישלח אתכם לדוד גארג'ה שבקצה השני של המדינה.
  route: >-
    מטביליסי כ-280 ק"מ, כארבע שעות ורבע של נסיעה. סעו מערבה בכביש S1 (E60), חלפו על פני קוטאיסי והמשיכו
    עד סמטרדיה, סעו כמה קילומטרים דרומה בכביש S12, ואז פנו לכביש Sh2 דרך סג'אוואחו עד צ'וחאטאורי. בעיר
    עלו על כביש Sh83 לכיוון זומלטי; אחרי כשלושה קילומטרים פנו צפונה לדרך מקומית העוברת בכפר שוּאַ-אמאגלבה
    ומטפסת במדרון אל המנזר, כשישה וחצי קילומטרים ממרכז העיר. הקטע האחרון אינו סלול והמידע עליו דל, לכן
    רכב שטח הוא הבחירה הנבונה, במיוחד אחרי גשם. חנו היכן שהדרך נגמרת ועלו ברגל. בצ'וחאטאורי נמצאת תחנת
    הדלק האחרונה.
ar:
  name: دير أودابنو، غوريا
  short: >-
    دير نصف كهفي على اسم القديس يوحنا المعمدان على السفح المشجّر لجبل أماغليبا، كان يوماً مدرسة غوريا
    ومكتبتها؛ وهو غير أودابنو في دير دافيد غاريجا.
  body: >-
    **«أودابنو» تعني «الصحراء»، ومع ذلك لا شيء هنا جاف: الينابيع تجري على المنحدر، والغابة تتزاحم من حوله،
    وكنيسة صغيرة يستقرّ نصفها داخل الجبل.**


    الاسم يصف طريقة حياة لا مشهداً طبيعياً: فـ«الصحراء» كانت العزلة التي يختارها الناسك. يقوم دير القديس
    يوحنا المعمدان على المنحدر الشديد لجبل أماغليبا شمال قرية شواغاناخليبي، وهو من أقدم أديرة غوريا. أما
    كم هو قديم فلا أحد يعرف: بعض الباحثين يرجع بالكنيسة الصخرية إلى القرن السادس، وآخرون إلى القرنين التاسع
    والعاشر، وقد طمست إعادة البناء بحجارة مستعملة من قبل معالم الأدلة. أما الكنيسة الصخرية فجانباها الشرقي
    والجنوبي من الصخر الحي؛ ولم يرفع البناؤون سوى الجدار الغربي ونصف الجدار الشمالي، من حجارة فاتحة محكمة
    النحت تزيّنها نقوش بارزة. وأسفل منها أربعة كهوف أخرى تنتهي بحنيات، وكانت على الأرجح مصلّيات، ولهذا
    سمّى الناس أودابنو «فاردزيا غوريا».


    كان هذا مكاناً للكتب. نسخ رئيس الدير يوسب توسكيا هنا «غولاني شيموكميدي»، وفي القرن التاسع عشر، حين
    لم تكن في القرى مدارس، كان الصبية يأتون ليتعلموا الكتاب المقدس واللغات والترتيل والخط. ورأى المؤرخ
    ديميتري باكرادزه نحو عشرة منهم منكبّين على القراءة والكتابة، ونسب تأسيس الدير إلى توسكيا، رئيس الدير
    في القرن الثامن عشر؛ لكن الكنيسة الصخرية تقول غير ذلك. وأثمن كنوزه، «مرافالتافي أودابنو» من القرن
    التاسع، تعرّف إليه أكاكي شانيدزه عام 1920، ويُوضع في منزلة «مرافالتافي سيناء» المؤرخ بعام 864.


    في عام 1958 هدمت السلطات المحلية معظم كنيسة عام 1858، التي كانت قائمة على بعد 200 متر أعلى المنحدر،
    لتأخذ حجارتها للبناء. فهلكت مخطوطات وكتب وأيقونات؛ ولم ينجُ سوى أيقونة للقديس يوحنا مكسوّة بالفضة
    و«المرافالتافي» الناقص. وفي عام 2006 أفسحت الجدران الأخيرة المجال لكنيسة جديدة، ودخلت الحجارة القديمة
    في جدارها الساند. وما زالت تسند شيئاً ما.
  tip: >-
    الدخول مجاني. هذا دير عامل تُقام فيه الصلوات: سراويل طويلة للرجال، وتنورة وغطاء رأس للنساء، وأصوات
    خافتة قرب القلالي. من حيث ينتهي المسلك يصعد ممر قصير لكنه شديد الانحدار إلى الكنيسة الصخرية؛ وبعد
    المطر — وما أكثره في غوريا — يصبح زلقاً، فالبس حذاءً مناسباً وأحضر مصباحاً يدوياً للكهوف. الدير مفتوح
    طوال العام، لكن المقطع الأخير غير المعبّد قد يتحول في الشتاء وبعد الأمطار الغزيرة إلى وحل عميق: فاسأل
    عن حال الطريق في تشوخاتاوري قبل الصعود، وكن مستعداً لقطع الجزء الأخير مشياً. خصّص ساعة. لا متجر ولا
    مقهى، فاشترِ الطعام والماء في تشوخاتاوري. وتنبيه بشأن نظام الملاحة: إن كتبت «أودابنو» على عجل فسيرسلك
    إلى دافيد غاريجا في الطرف الآخر من البلاد.
  route: >-
    من تبليسي نحو 280 كم، أي قرابة أربع ساعات وربع من القيادة. اسلك الطريق S1 (E60) غرباً متجاوزاً كوتايسي
    حتى سامتريديا، ثم الطريق S12 جنوباً لبضعة كيلومترات، ثم انعطف إلى Sh2 مروراً بساجافاخو حتى تشوخاتاوري.
    وفي البلدة خذ الطريق Sh83 باتجاه زومليتي؛ وبعد نحو ثلاثة كيلومترات انعطف شمالاً إلى طريق محلي يصعد
    المنحدر مروراً بقرية شوا أماغليبا إلى الدير، على بعد نحو ستة كيلومترات ونصف من المركز. المقطع الأخير
    غير معبّد وقليل التوثيق، لذا فسيارة الدفع الرباعي هي الخيار الحكيم، ولا سيما بعد المطر. اركن السيارة
    حيث ينتهي المسلك واصعد مشياً. وفي تشوخاتاوري آخر محطة وقود.
