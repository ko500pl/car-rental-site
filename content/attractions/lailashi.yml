ka:
  name: ლაილაში
  short: >-
    ლეჩხუმის ძველი ებრაული სოფელი ცხენისწყლის ხეობის ზემოთ — X საუკუნის "ლაილაშის ბიბლიის" სამშობლო და
    საიდუმლო აუზის მეზობელი.
  body: >-
    **ლაილაში ის სოფელია, სადაც ლეჩხუმის მთელი ისტორია ერთ გორაზეა შეკრებილი.** ცხენისწყლისა და ლაჯანურის
    ხეობების ზემოთ, 850 მეტრზე გაშლილ ამ პლატოზე საუკუნეების განმავლობაში ერთად ცხოვრობდნენ ქართველები,
    ებრაელები, ბერძნები და სომხები — და სოფელი ლეჩხუმის მთავარი სავაჭრო დაბაც კი იყო.


    ყველაზე ცნობილი აქაური რელიკვია X საუკუნის ხელნაწერი თორაა, "ლაილაშის ბიბლია", რომელიც დღეს თბილისში,
    ხელნაწერთა ეროვნულ ცენტრში ინახება. გადმოცემით, ებრაელი დევნილები აქ XVI საუკუნეში, ღამით, მთვარის
    შუქზე ამოვიდნენ — სახელს ხშირად ებრაულ "ლაილას" (ღამე) უკავშირებენ. ძველი ბაზრობის ადგილას სინაგოგის
    შენობა დგას, სოფლის განაპირას კი ებრაული სასაფლაოა შემორჩენილი. აქვეა XIX საუკუნის ეკლესია სამრეკლოთი
    და დაზიანებული სომხური ეკლესია. ლაილაშში ნაპოვნი ძვ.წ. XIV–XIII საუკუნეების ბრინჯაოს ცულები დღეს ერმიტაჟშია.


    ღირს "ოქრონიშის" წყაროსთან ასვლა — ებრაელი მოსახლეების ნაშენი აუზიდან ლაჯანურის წყალსაცავის მთელი
    ხეობა ჩანს. სოფლის ქვემოთ კი ის ხავსიანი ხეობაა, სადაც ცნობილი "საიდუმლო აუზი" იმალება — ზურმუხტისფერი
    გუბე, რომელიც ბოლო წლებში ლეჩხუმის ყველაზე გაზიარებული ფოტო გახდა.
  tip: >-
    სოფელში კაფე და სასტუმრო არ არის — საგზალი ცაგერში ან ალპანაში იყიდე. საიდუმლო აუზამდე ბილიკი სველ
    ამინდში მოლიპულია, ჩასვლისას ფეხსაცმელს დახედე. სასაფლაოზე და სინაგოგის ეზოში პატივისცემით იარე —
    ეს ცოცხალი მემკვიდრეობაა. ზაფხულის შუადღე ხვატიანია, დილა კი ხეობის ხედებს ბურუსისგან ათავისუფლებს.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ წყალტუბო–ალპანას გზით ლაჯანურის ხეობაში — ჯამში დაახლოებით 315
    კმ და 5 საათი. ალპანას შემდეგ ცაგერის გზიდან ლაილაშისკენ მოკლე, სერპენტინიანი ასასვლელი უხვევს; ასფალტი
    ადგილ-ადგილ დაზიანებულია, ამიტომ SUV უფრო მშვიდი არჩევანია, თუმცა მშრალ ამინდში ფრთხილი მძღოლი სედანითაც
    ავა. საწვავი ქუთაისში ან ცაგერში ჩაასხი.
en:
  name: Lailashi
  short: >-
    An old Jewish heritage village of Lechkhumi above the Tskhenistskali valley — home of the 10th-century
    "Lailashi Bible" and a famous secret pool.
  body: >-
    **Lailashi is the village where the whole history of Lechkhumi gathers on one hilltop.** On a plateau
    at about 850 m above the Tskhenistskali and Lajanuri valleys, Georgians, Jews, Greeks and Armenians
    lived side by side for centuries — and the village was once Lechkhumi's main market town.


    Its most famous relic is a 10th-century Torah manuscript, the "Lailashi Bible", now kept at the National
    Centre of Manuscripts in Tbilisi. Tradition says Jewish refugees settled here in the 16th century,
    arriving at night by moonlight — the name is often linked to the Hebrew "laila", night. A synagogue
    building still stands by the old bazaar site, and an old Jewish cemetery survives on the village edge,
    alongside an early 19th-century church with a bell tower and a damaged Armenian church. Bronze axes
    of the 14th–13th centuries BC found here are now in the Hermitage in St Petersburg.


    Climb to the Okronishi spring, where a small pool built by Jewish villagers looks out over the whole
    Lajanuri reservoir valley. Below the village hides the mossy gorge with the famous "secret pool" —
    an emerald basin that has become the most-shared photograph in Lechkhumi in recent years. Come for
    the layers of history, stay for the silence and the views.
  tip: >-
    There is no café or hotel in the village — buy provisions in Tsageri or Alpana. The path down to the
    secret pool is slippery after rain, so wear proper shoes. Walk respectfully in the cemetery and around
    the synagogue; this is living heritage, not a stage set. Summer middays are hot on the open plateau,
    while mornings give the clearest valley views.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then the Tskaltubo–Alpana road into the Lajanuri valley — about
    315 km and 5 hours in total. Past Alpana, a short serpentine side road climbs from the Tsageri road
    up to Lailashi; the asphalt is broken in places, so an SUV is the calmer choice, though a careful
    driver manages in a sedan in dry weather. Refuel in Kutaisi or Tsageri.
ru:
  name: Лайлаши
  short: >-
    Старинное еврейское село Лечхуми над долиной Цхенисцкали — родина «Лайлашской Библии» X века и соседка
    знаменитого секретного бассейна.
  body: >-
    **Лайлаши — село, где вся история Лечхуми собрана на одном холме.** На плато высотой около 850 м над
    долинами Цхенисцкали и Лажанури веками бок о бок жили грузины, евреи, греки и армяне, а само село
    было главным торговым местечком Лечхуми.


    Самая знаменитая здешняя реликвия — рукописная Тора X века, «Лайлашская Библия», хранящаяся ныне в
    Национальном центре рукописей в Тбилиси. По преданию, еврейские беженцы поселились здесь в XVI веке,
    придя ночью при свете луны, — название часто связывают с ивритским «лайла», «ночь». У места старого
    базара до сих пор стоит здание синагоги, на краю села сохранилось старое еврейское кладбище, рядом
    — церковь с колокольней начала XIX века и повреждённая армянская церковь. Найденные здесь бронзовые
    топоры XIV–XIII веков до н.э. хранятся в Эрмитаже.


    Поднимитесь к роднику Окрониши: от небольшого бассейна, построенного еврейскими жителями, открывается
    вся долина Лажанурского водохранилища. А ниже села прячется мшистое ущелье со знаменитым «секретным
    бассейном» — изумрудной купелью, ставшей за последние годы самым тиражируемым фото Лечхуми. Приезжайте
    ради слоёв истории, оставайтесь ради тишины и видов.
  tip: >-
    В селе нет ни кафе, ни гостиницы — запаситесь едой в Цагери или Альпане. Тропа к секретному бассейну
    после дождя скользкая, нужна нормальная обувь. На кладбище и у синагоги ведите себя уважительно: это
    живое наследие, а не декорация. Летом в полдень на открытом плато жарко, а утро дарит самые прозрачные
    виды на долину.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем по дороге Цхалтубо–Альпана в долину Лажанури — всего около 315
    км и 5 часов. За Альпаной от дороги на Цагери отходит короткий серпантин на Лайлаши; асфальт местами
    разбит, так что SUV — более спокойный выбор, хотя в сухую погоду аккуратный водитель проедет и на
    седане. Заправка — в Кутаиси или Цагери.
fa:
  name: لایلاشی
  short: >-
    روستای کهن میراث یهودی در لچخومی بر فراز درهٔ تسخنیس‌تسکالی — زادگاه «کتاب مقدس لایلاشی» از سدهٔ دهم
    و همسایهٔ استخر پنهان معروف.
  body: >-
    **لایلاشی روستایی است که همهٔ تاریخ لچخومی روی یک تپه جمع شده است.** بر فلاتی در حدود ۸۵۰ متری بالای
    دره‌های تسخنیس‌تسکالی و لاجانوری، قرن‌ها گرجی‌ها، یهودیان، یونانی‌ها و ارمنی‌ها در کنار هم زیستند
    — و این روستا زمانی بازار اصلی لچخومی بود.


    مشهورترین یادگار اینجا نسخهٔ خطی تورات از سدهٔ دهم است، «کتاب مقدس لایلاشی»، که امروز در مرکز ملی
    نسخ خطی در تفلیس نگهداری می‌شود. بنا بر روایت، پناهندگان یهودی در سدهٔ شانزدهم شبانه و در نور مهتاب
    به اینجا رسیدند — نام روستا را اغلب با واژهٔ عبری «لیلا» به معنی شب پیوند می‌دهند. کنار جای بازار
    قدیم هنوز ساختمان کنیسه برپاست و در حاشیهٔ روستا گورستان کهن یهودی باقی مانده؛ در کنارش کلیسایی با
    برج ناقوس از اوایل سدهٔ نوزدهم و کلیسای آسیب‌دیدهٔ ارمنی. تبرهای مفرغی سده‌های ۱۴–۱۳ پیش از میلاد
    که اینجا پیدا شد، اکنون در ارمیتاژ سن‌پترزبورگ است.


    تا چشمهٔ اوکرونیشی بالا بروید: از استخر کوچکی که یهودیان روستا ساختند، تمام درهٔ سد لاجانوری پیداست.
    و پایین روستا، درهٔ خزه‌پوشی است که «استخر پنهان» معروف در آن قایم شده — حوضچه‌ای زمردین که در سال‌های
    اخیر پربازدیدترین عکس لچخومی شده است.
  tip: >-
    در روستا نه کافه‌ای هست و نه اقامتگاهی — خوراکی را در تساگری یا آلپانا بخرید. مسیر پایین‌رفتن به استخر
    پنهان پس از باران لغزنده است؛ کفش مناسب بپوشید. در گورستان و اطراف کنیسه با احترام رفتار کنید؛ این
    میراثی زنده است، نه صحنهٔ نمایش. ظهر تابستان روی فلات باز گرم است و صبح‌ها شفاف‌ترین چشم‌انداز دره
    را دارند.
  route: >-
    از تفلیس با E60 تا کوتائیسی، سپس با جادهٔ تسخالتوبو–آلپانا به درهٔ لاجانوری — روی‌هم حدود ۳۱۵ کیلومتر
    و ۵ ساعت. پس از آلپانا، از جادهٔ تساگری راه فرعی کوتاه و پرپیچی به لایلاشی بالا می‌رود؛ آسفالت جابه‌جا
    خراب است، پس شاسی‌بلند انتخاب آرام‌تری است، هرچند در هوای خشک رانندهٔ محتاط با سدان هم می‌رسد. در
    کوتائیسی یا تساگری بنزین بزنید.
he:
  name: לאילאשי
  short: >-
    כפר מורשת יהודית עתיק בלצחומי מעל עמק הצחניסצקאלי — ביתו של "תנ"ך לאילאשי" מהמאה העשירית ושכנה של
    הבריכה הסודית המפורסמת.
  body: >-
    **לאילאשי הוא הכפר שבו כל ההיסטוריה של לצחומי מתכנסת על גבעה אחת.** על רמה בגובה כ-850 מ' מעל עמקי
    הצחניסצקאלי והלאז'אנורי חיו במשך מאות שנים זה לצד זה גאורגים, יהודים, יוונים וארמנים — והכפר אף שימש
    עיירת השוק הראשית של לצחומי.


    השריד המפורסם ביותר כאן הוא כתב יד של תורה מן המאה העשירית, "תנ"ך לאילאשי", השמור כיום במרכז הלאומי
    לכתבי יד בטביליסי. המסורת מספרת שפליטים יהודים התיישבו כאן במאה ה-16, כשהגיעו בלילה לאור הירח — ואת
    השם נוהגים לקשור למילה העברית "לילה". ליד אתר הבזאר הישן עדיין עומד מבנה בית הכנסת, בשולי הכפר שרד
    בית עלמין יהודי עתיק, ולידם כנסייה עם מגדל פעמונים מראשית המאה ה-19 וכנסייה ארמנית פגועה. גרזני ארד
    מן המאות ה-14–13 לפנה"ס שנמצאו כאן שמורים היום בהרמיטאז'.


    עלו אל מעיין אוקרונישי: מבריכה קטנה שבנו תושבי הכפר היהודים נשקף כל עמק מאגר הלאז'אנורי. ומתחת לכפר
    מסתתר קניון טחוב ובו "הבריכה הסודית" המפורסמת — אגן בצבע אזמרגד שהפך בשנים האחרונות לתצלום המשותף
    ביותר של לצחומי. בואו בשביל שכבות ההיסטוריה, הישארו בשביל השקט והנופים.
  tip: >-
    בכפר אין בית קפה או מלון — הצטיידו באוכל בצאגרי או באלפאנה. השביל היורד לבריכה הסודית חלקלק אחרי גשם,
    אז נעלו נעליים טובות. התהלכו בכבוד בבית העלמין וסביב בית הכנסת — זו מורשת חיה, לא תפאורה. בצהרי הקיץ
    חם על הרמה הפתוחה, והבוקר מעניק את הנופים הצלולים ביותר של העמק.
  route: >-
    מטביליסי ב-E60 עד קוטאיסי, ומשם בדרך צחאלטובו–אלפאנה אל עמק הלאז'אנורי — בסך הכול כ-315 ק"מ וכ-5 שעות.
    אחרי אלפאנה מתפצלת מדרך צאגרי עלייה מתפתלת קצרה ללאילאשי; האספלט שבור פה ושם, ולכן רכב שטח קל הוא
    הבחירה הרגועה יותר, אם כי במזג אוויר יבש נהג זהיר יעבור גם בסדאן. תדלקו בקוטאיסי או בצאגרי.
ar:
  name: لايلاشي
  short: >-
    قرية التراث اليهودي العريقة في ليتشخومي فوق وادي تسخنيستسكالي — موطن «إنجيل لايلاشي» من القرن العاشر
    وجارة البركة السرية الشهيرة.
  body: >-
    **لايلاشي قرية اجتمع فيها تاريخ ليتشخومي كله على تلة واحدة.** فوق هضبة على ارتفاع نحو 850 متراً تطل
    على واديي تسخنيستسكالي ولاجانوري، عاش الجورجيون واليهود واليونانيون والأرمن جنباً إلى جنب قروناً طويلة
    — بل كانت القرية يوماً سوق ليتشخومي الرئيسية.


    أشهر ذخائرها مخطوطة توراة من القرن العاشر تُعرف باسم «إنجيل لايلاشي»، وتُحفظ اليوم في المركز الوطني
    للمخطوطات في تبليسي. وتقول الرواية إن لاجئين يهوداً استقروا هنا في القرن السادس عشر ووصلوا ليلاً على
    ضوء القمر — ولذا يُربط الاسم غالباً بكلمة «ليلى» العبرية أي الليل. ما زال مبنى الكنيس قائماً عند موضع
    البازار القديم، وبقيت مقبرة يهودية قديمة على طرف القرية، وإلى جوارهما كنيسة ببرج أجراس من أوائل القرن
    التاسع عشر وكنيسة أرمنية متضررة. أما الفؤوس البرونزية من القرنين الرابع عشر والثالث عشر قبل الميلاد
    التي عُثر عليها هنا فهي اليوم في متحف الإرميتاج.


    اصعد إلى نبع أوكرونيشي: من البركة الصغيرة التي بناها سكان القرية اليهود يتكشف وادي خزان لاجانوري بأكمله.
    وتحت القرية يختبئ الوادي المطحلب حيث «البركة السرية» الشهيرة — حوض زمردي صار في السنوات الأخيرة أكثر
    صور ليتشخومي تداولاً.
  tip: >-
    لا مقهى في القرية ولا فندق — اشترِ مؤونتك من تساغيري أو ألبانا. الدرب النازل إلى البركة السرية زلق
    بعد المطر، فالبس حذاءً مناسباً. تجوّل باحترام في المقبرة وحول الكنيس؛ فهذا تراث حي لا ديكور مسرحي.
    ظهيرة الصيف حارة على الهضبة المكشوفة، والصباح يمنح أصفى إطلالات الوادي.
  route: >-
    من تبليسي عبر E60 حتى كوتايسي، ثم بطريق تسخالتوبو–ألبانا إلى وادي لاجانوري — نحو 315 كم و5 ساعات إجمالاً.
    بعد ألبانا يتفرع من طريق تساغيري مصعد قصير متعرج إلى لايلاشي؛ الأسفلت متكسر في مواضع، لذا فسيارة الدفع
    الرباعي خيار أهدأ، وإن كان سائق حذر يصل بسيارة عادية في الطقس الجاف. تزوّد بالوقود في كوتايسي أو تساغيري.
