ka:
  name: ლაილაში
  short: >-
    ლეჩხუმის სოფელი, სადაც ოდესღაც ქართველები, ებრაელები, ბერძნები და სომხები ერთ მოედანზე ვაჭრობდნენ
    და სადაც X საუკუნის თორის ებრაული ხელნაწერი იპოვეს.
  body: >-
    **ლაილაში ოდესღაც ვაჭართა დაბა იყო, სადაც ოთხი ხალხი ერთ მოედანზე ვაჭრობდა — და იმ მოედანს დღესაც
    „ბაზარს“ ეძახიან.**


    სოფელი ლაჯანურისა და ასკისწყლის წყალგამყოფი ქედის კალთაზე, ზღვის დონიდან დაახლოებით 850 მეტრზე დგას,
    ცაგერიდან 18 კილომეტრში. გადმოცემით, XVI საუკუნეში, როცა ოსმალებმა ახალქალაქი აიღეს, სამცხე-ჯავახეთიდან
    დევნილმა ებრაელებმა და სომხებმა ლეჩხუმის მთებს შეაფარეს თავი. ამბობენ, აქ ღამით მოაღწიესო, და ხალხური
    ეტიმოლოგია სოფლის სახელში ებრაულ „ლაილას“ — ღამეს — ისმენს. XIX საუკუნის პირველ ნახევარში ლაილაში
    ლეჩხუმის მთავარი სავაჭრო პუნქტი იყო: აქ გვერდიგვერდ ცხოვრობდნენ ქართველები, ებრაელები, ბერძნები და
    სომხები.


    სოფლის ყველაზე სახელოვანი შვილი წიგნია. XX საუკუნის 40-იან წლებში აქ თორის (ხუთწიგნეულის) ებრაული
    ხელნაწერი აღმოაჩინეს. „ლაილაშის ბიბლიად“ წოდებულ ამ კოდექსს ჩვეულებრივ X საუკუნით ათარიღებენ (ზოგი
    მკვლევარი IX საუკუნესაც ასახელებს); 1957 წლიდან იგი თბილისში ინახება, დღეს — ხელნაწერთა ეროვნულ ცენტრში.
    ლაილაშელმა ქრისტიანებმაც დატოვეს თავიანთი განძი — ადგილობრივი ეკლესიის მსახურთა გადაწერილი ოთხთავი,
    რომელიც ასევე თბილისის მუზეუმშია დაცული. მიწამ კი ძვ. წ. XIV–XIII საუკუნეების ბრინჯაოს ცულები შემოინახა;
    ისინი დღეს სანქტ-პეტერბურგში, ერმიტაჟში ინახება.


    ლაილაში აუჩქარებლად უნდა მოიაროთ. „ბაზარში“ სინაგოგა დგას; სასაფლაოს გორაზე — XIX საუკუნის დასაწყისის
    დარბაზული ეკლესია და სამრეკლო; სომხური ეკლესია ძლიერ დაზიანებულია. ბოლოს ოქრონიშის წყაროსთან ადით
    — ებრაელი მოსახლეობის ნაშენ აუზთან, საიდანაც ლაჯანურის წყალსაცავი ხელისგულივით მოჩანს. კინოს მოყვარულები
    აქაურ ქუჩებს იცნობენ: ქართული კინოკლასიკის, „მე, ბებია, ილიკო და ილარიონის“, დაახლოებით 30 პროცენტი
    ლაილაშშია გადაღებული.


    1904 წლის ზამთარში ერთმანეთზე მიჯრილ ხის სახლებს ხანძარი მოედო და 150 ოდა გადაიწვა. რვა წლის შემდეგ
    აკაკი წერეთელმა რაჭა-ლეჩხუმში მოგზაურობა სწორედ აქ დაასრულა, ლაილაშელებმა კი მოხუც პოეტს ვერცხლის
    ჯოხი მიართვეს. ამ სოფელმა ყოველთვის იცოდა, როგორ აღედგინა სახლი და როგორ დაეხვედრებინა სტუმარი.
  tip: >-
    ლაილაშში არც კაფეა, არც ბენზინგასამართი და არც ბანკომატი — წყალი და საგზალი ცაგერიდან წამოიღეთ. ზოგი
    ნაგებობა შეიძლება დაკეტილი დაგხვდეთ: კარს ნუ აწვალებთ, სოფელში თავაზიანად იკითხეთ. ებრაულ სასაფლაოზე
    წყნარად იარეთ, ეკლესიაში მხრები დაიფარეთ — ეს ხსოვნის ადგილია და არა დეკორაცია. ლაჯანურის ხეობა ყველაზე
    კარგად დილით ჩანს; ზაფხულის შუადღე ღია ფერდობზე ცხელია. ლაილაშს ბუნებრივად ერწყმის საირმის სვეტები
    და მურის ციხე — ორივე ახლოსაა და ერთად ლეჩხუმის სავსე დღეს შეადგენს.
  route: >-
    თბილისიდან E60-ით (ს-1) დასავლეთით ქუთაისამდე, იქიდან შ-16-ით ჩრდილოეთით, ალპანისკენ, მასთან მიახლოებისას
    კი შ-18-ზე — ცაგერის მიმართულებით გადადით; ამ გზიდან სოფლამდე მოკლე სერპანტინი ადის. სულ დაახლოებით
    315 კმ-ია — ხუთი საათი დაითვალეთ. ასფალტი ბოლომდეა, თუმცა ბოლო აღმართზე ადგილ-ადგილ დაზიანებულია:
    მშრალ ამინდში ეკონომკლასის მანქანაც ავა, წვიმის შემდეგ კი ჯიპი უფრო მშვიდი არჩევანია — ამიტომაც გირჩევთ
    მას. საწვავი ქუთაისში ან ცაგერში ჩაასხით; თავად ლაილაშში არაფერია.
en:
  name: Lailashi
  short: >-
    A Lechkhumi hill village where Georgians, Jews, Greeks and Armenians once traded in one square, and
    where a 10th-century Hebrew Torah codex was found.
  body: >-
    **Lailashi was once a market town where four peoples haggled in a single square — and that square
    is still called Bazari.**


    The village lies at about 850 metres on the slope of the ridge between the Lajanuri and Askistskali
    rivers, 18 km from Tsageri. Tradition says Jewish and Armenian refugees climbed up here in the 16th
    century, fleeing Samtskhe-Javakheti after the Ottomans took Akhalkalaki. They are said to have arrived
    at night, and local lore hears the Hebrew *laila*, "night", in the village's name. By the first half
    of the 19th century Lailashi was Lechkhumi's chief trading post, home to Georgians, Jews, Greeks and
    Armenians.


    Its most famous native is a book. In the 1940s a Hebrew Torah codex, the Five Books of Moses with
    their Masoretic notes, was found here; known as the Lailashi Bible, it is usually dated to the 10th
    century (some scholars argue for the 9th), has been in Tbilisi since 1957 and is now held by the National
    Centre of Manuscripts. The village's Christians left a treasure of their own, a Gospel book copied
    by local church servants, now in a Tbilisi museum. The soil gave up bronze axes of the 14th–13th centuries
    BC, now in the Hermitage in St Petersburg.


    Walk it slowly. The synagogue still stands at Bazari; on the cemetery hill a hall church and its bell
    tower date from the early 19th century; the Armenian church is badly damaged. Finish at Okronishi,
    the spring pool built by the Jewish villagers, with the Lajanuri reservoir spread out below. Film
    lovers may recognise the lanes: about 30 per cent of the Georgian classic *Me, Grandma, Iliko and
    Ilarion* was shot in Lailashi.


    In the winter of 1904 fire ran through the close-packed wooden houses and destroyed 150 of them. Eight
    years later Akaki Tsereteli ended his journey through Racha and Lechkhumi here, and the villagers
    presented the old poet with a silver walking stick. Lailashi has always known how to rebuild a house,
    and how to receive a guest.
  tip: >-
    Lailashi has no café, fuel station or cash machine, so bring water and a picnic from Tsageri. Some
    buildings may be locked: ask politely in the village rather than trying doors. Walk quietly in the
    Jewish cemetery and cover your shoulders in the church — this is a place of memory, not a film set.
    Mornings give the clearest view over the Lajanuri valley; summer middays are hot on the open slope.
    Lailashi pairs naturally with the Sairme pillars and Muri fortress, both a short drive away, for a
    full Lechkhumi day.
  route: >-
    From Tbilisi take the E60 (S1) west to Kutaisi, then the Sh16 north towards Alpana and, just before
    it, the Sh18 towards Tsageri; a short serpentine climbs from that road up to the village. It is about
    315 km — allow five hours. The asphalt runs all the way, but on the final climb it is broken in places:
    an economy car manages in dry weather, while after rain an SUV is the calmer choice, which is why
    we recommend one. Refuel in Kutaisi or Tsageri; there is nothing in Lailashi itself.
ru:
  name: Лаилаши
  short: >-
    Горное село Лечхуми, где грузины, евреи, греки и армяне когда-то торговали на одной площади и где
    нашли рукопись Торы X века.
  body: >-
    **Когда-то Лаилаши был торговым местечком, где четыре народа торговались на одной площади, — и эту
    площадь до сих пор называют Базари.**


    Село лежит на высоте около 850 метров, на склоне хребта между реками Ладжанури и Аскисцкали, в 18
    км от Цагери. Предание гласит, что в XVI веке сюда поднялись еврейские и армянские беженцы, бежавшие
    из Самцхе-Джавахети после того, как османы взяли Ахалкалаки. Говорят, пришли они ночью, и местная
    молва слышит в названии села ивритское *лайла* — «ночь». К первой половине XIX века Лаилаши стал главным
    торговым пунктом Лечхуми, где жили грузины, евреи, греки и армяне.


    Самый знаменитый уроженец села — книга. В 1940-х годах здесь нашли рукопись Торы (Пятикнижия) на иврите;
    Лаилашскую Библию, как её называют, обычно датируют X веком (некоторые учёные настаивают на IX), с
    1957 года она находится в Тбилиси и сейчас хранится в Национальном центре рукописей. Христиане села
    оставили своё сокровище — Евангелие, переписанное местными церковнослужителями, оно теперь в одном
    из тбилисских музеев. А земля отдала бронзовые топоры XIV–XIII веков до н. э., ныне хранящиеся в петербургском
    Эрмитаже.


    Гуляйте здесь не торопясь. На Базари по-прежнему стоит синагога; на кладбищенском холме — зальная
    церковь с колокольней начала XIX века; армянская церковь сильно разрушена. Закончите прогулку у Окрониши,
    родникового бассейна, построенного еврейскими жителями, — под ним раскинулось Ладжанурское водохранилище.
    Киноманы узнают здешние улочки: около 30 процентов грузинской классики «Я, бабушка, Илико и Илларион»
    снято в Лаилаши.


    Зимой 1904 года огонь прошёл по тесно стоящим деревянным домам и уничтожил 150 из них. Восемь лет
    спустя здесь завершил своё путешествие по Раче и Лечхуми Акакий Церетели, и сельчане подарили старому
    поэту серебряную трость. Лаилаши всегда умел отстроить дом заново — и принять гостя.
  tip: >-
    В Лаилаши нет ни кафе, ни заправки, ни банкомата, так что воду и еду для пикника везите из Цагери.
    Некоторые здания бывают заперты: вежливо спросите в селе, а не дёргайте двери. На еврейском кладбище
    ходите тихо, в церкви прикройте плечи — это место памяти, а не съёмочная площадка. Утром вид на долину
    Ладжанури самый ясный; летним полднем на открытом склоне жарко. Лаилаши естественно сочетается со
    столбами Саирме и крепостью Мури — до обоих недалеко, и вместе получается полный день в Лечхуми.
  route: >-
    Из Тбилиси по E60 (S1) на запад до Кутаиси, затем по Sh16 на север в сторону Алпаны и незадолго до
    неё — на Sh18 в сторону Цагери; от этой дороги к селу поднимается короткий серпантин. Это около 315
    км — закладывайте пять часов. Асфальт на всём пути, но на последнем подъёме местами разбит: машина
    эконом-класса справится в сухую погоду, а после дождя спокойнее на внедорожнике, поэтому мы его и
    рекомендуем. Заправляйтесь в Кутаиси или Цагери; в самом Лаилаши ничего нет.
fa:
  name: لایلاشی
  short: >-
    روستایی کوهستانی در لچخومی که گرجی‌ها، یهودیان، یونانی‌ها و ارمنی‌ها روزگاری در میدانش داد و ستد می‌کردند
    و تورات خطی عبری سدهٔ دهم در آن پیدا شد.
  body: >-
    **لایلاشی روزگاری شهرکی بازاری بود که در آن چهار قوم در یک میدان بر سر قیمت چانه می‌زدند؛ و آن میدان
    هنوز «بازاری» نام دارد.**


    روستا در ارتفاع حدود ۸۵۰ متری، بر دامنهٔ یالی میان رودهای لاجانوری و اسکیستسکالی، در ۱۸ کیلومتری تساگری
    قرار دارد. روایت است که در سدهٔ شانزدهم، پس از آنکه عثمانی‌ها آخالکالاکی را گرفتند، پناهندگانی یهودی
    و ارمنی از سامتسخه-جاواختی گریختند و به این بلندی آمدند. می‌گویند شبانه رسیدند، و زبان مردم در نام
    روستا واژهٔ عبری *لایلا*، یعنی «شب»، را می‌شنود. تا نیمهٔ نخست سدهٔ نوزدهم لایلاشی مهم‌ترین مرکز تجاری
    لچخومی شده بود و گرجی‌ها، یهودیان، یونانی‌ها و ارمنی‌ها در آن می‌زیستند.


    نامدارترین زادهٔ این روستا یک کتاب است. در دههٔ ۱۹۴۰ نسخهٔ خطی عبری تورات (اسفار پنجگانه) در اینجا
    پیدا شد؛ آن را که «کتاب مقدس لایلاشی» می‌نامند معمولاً از سدهٔ دهم می‌دانند (برخی پژوهشگران سدهٔ نهم
    را پیشنهاد می‌کنند). این نسخه از ۱۹۵۷ در تفلیس است و اکنون در مرکز ملی نسخ خطی نگهداری می‌شود. مسیحیان
    روستا هم گنج خود را به یادگار گذاشتند: انجیلی که خادمان کلیسای محلی رونویسی کرده بودند و امروز در
    موزه‌ای در تفلیس است. خاک هم تبرهای مفرغی سده‌های چهاردهم تا سیزدهم پیش از میلاد را بیرون داد که اکنون
    در موزهٔ ارمیتاژ سن‌پترزبورگ است.


    آهسته در روستا قدم بزنید. کنیسه هنوز در بازاری پابرجاست؛ بر تپهٔ گورستان کلیسایی تالاری با برج ناقوسش
    از آغاز سدهٔ نوزدهم برجا مانده است؛ کلیسای ارمنی سخت آسیب دیده است. گردش را در اوکرونیشی به پایان
    ببرید، آبگیر چشمه‌ای که یهودیان روستا ساختند و مخزن سد لاجانوری در پایینش گسترده است. دوستداران سینما
    کوچه‌های اینجا را خواهند شناخت: حدود ۳۰ درصد از فیلم کلاسیک گرجی «من، مادربزرگ، ایلیکو و ایلاریون»
    در لایلاشی فیلم‌برداری شده است.


    در زمستان ۱۹۰۴ آتش در خانه‌های چوبی تنگ‌هم‌چیده افتاد و ۱۵۰ خانه را نابود کرد. هشت سال بعد آکاکی تسرتلی
    سفرش در راچا و لچخومی را در همین‌جا به پایان برد و روستاییان به شاعر سالخورده عصایی نقره‌ای پیشکش
    کردند. لایلاشی همیشه می‌دانسته چگونه خانه را از نو بسازد و چگونه از مهمان پذیرایی کند.
  tip: >-
    لایلاشی نه کافه دارد، نه پمپ‌بنزین و نه خودپرداز؛ پس آب و خوراک پیک‌نیک را از تساگری بیاورید. برخی
    بناها ممکن است قفل باشند: به‌جای امتحان کردن درها، مؤدبانه از اهالی بپرسید. در گورستان یهودیان آرام
    قدم بزنید و در کلیسا شانه‌ها را بپوشانید؛ اینجا جای یادبود است، نه صحنهٔ فیلم‌برداری. صبح‌ها چشم‌انداز
    درهٔ لاجانوری از همیشه روشن‌تر است؛ نیمروزهای تابستان روی دامنهٔ باز داغ است. لایلاشی به‌طبع با ستون‌های
    سائیرمه و دژ موری جور می‌شود؛ هر دو با کمی رانندگی در دسترس‌اند و با هم یک روز کامل لچخومی را می‌سازند.
  route: >-
    از تفلیس جادهٔ E60 (S1) را به سمت غرب تا کوتایسی بروید، سپس با Sh16 به شمال به سوی آلپانا، و کمی پیش
    از آن به Sh18 به سوی تساگری بپیچید؛ از این جاده سربالایی پیچ‌درپیچ کوتاهی به روستا می‌رسد. حدود ۳۱۵
    کیلومتر است؛ پنج ساعت وقت بگذارید. تمام راه آسفالت است، اما در سربالایی آخر جابه‌جا خراب شده: خودروی
    اقتصادی در هوای خشک از پسش برمی‌آید، اما پس از باران شاسی‌بلند خیال آسوده‌تری می‌دهد و برای همین آن
    را توصیه می‌کنیم. در کوتایسی یا تساگری سوخت بگیرید؛ در خود لایلاشی هیچ پمپ‌بنزینی نیست.
he:
  name: לאילאשי
  short: >-
    כפר הררי בלצ'חומי שבו גאורגים, יהודים, יוונים וארמנים סחרו פעם בכיכר אחת, ושבו נמצא חומש (כתב יד של
    התורה) מן המאה ה-10.
  body: >-
    **לאילאשי הייתה פעם עיירת שוק שבה ארבעה עמים התמקחו בכיכר אחת – והכיכר הזאת נקראת עד היום בזארי.**


    הכפר שוכן בגובה של כ-850 מטר, על מדרון הרכס שבין הנהרות לג'אנורי ואסקיסצקלי, 18 ק"מ מצאגרי. המסורת
    מספרת שבמאה ה-16 עלו לכאן פליטים יהודים וארמנים, שנמלטו מסמצחה-ג'וואחתי אחרי שהעות'מאנים כבשו את אחלקלקי.
    אומרים שהגיעו בלילה, והפולקלור המקומי שומע בשם הכפר את המילה העברית "לילה". עד המחצית הראשונה של המאה
    ה-19 הפכה לאילאשי למרכז המסחר הראשי של לצ'חומי, וחיו בה גאורגים, יהודים, יוונים וארמנים.


    בן הכפר המפורסם ביותר הוא ספר. בשנות ה-40 של המאה ה-20 נמצא כאן כתב יד של חמשת חומשי התורה; כתב היד,
    המכונה "התנ"ך של לאילאשי", מתוארך בדרך כלל למאה ה-10 (יש חוקרים שמקדימים אותו למאה ה-9), הוא נמצא
    בטביליסי מאז 1957 ושמור כיום במרכז הלאומי לכתבי יד. גם הנוצרים של הכפר הותירו אוצר משלהם: ספר בשורות
    שהעתיקו משרתי הכנסייה המקומיים, וכיום הוא שמור במוזיאון בטביליסי. והאדמה הניבה גרזני ברונזה מן המאות
    ה-14–13 לפנה"ס, השמורים היום במוזיאון ההרמיטאז' בסנקט פטרבורג.


    טיילו כאן לאט. בית הכנסת עדיין עומד בבזארי; על גבעת בית הקברות ניצבות כנסייה אולמית ומגדל הפעמונים
    שלה מראשית המאה ה-19; הכנסייה הארמנית פגועה קשות. סיימו באוקרונישי, בריכת המעיין שבנו יהודי הכפר,
    ומתחתיה נפרש מאגר לג'אנורי. חובבי קולנוע יזהו את הסמטאות: כ-30 אחוז מן הקלאסיקה הגאורגית "אני, סבתא,
    איליקו ואילריון" צולמו בלאילאשי.


    בחורף 1904 עברה אש בין בתי העץ הצפופים והשמידה 150 מהם. שמונה שנים אחר כך סיים כאן אקקי צרטלי את מסעו
    ברצ'ה ובלצ'חומי, ובני הכפר העניקו למשורר הזקן מקל הליכה מכסף. לאילאשי תמיד ידעה לבנות בית מחדש – ולקבל
    אורח.
  tip: >-
    בלאילאשי אין בית קפה, תחנת דלק או כספומט, אז הביאו מים וארוחת פיקניק מצאגרי. חלק מהמבנים עשויים להיות
    נעולים: שאלו בנימוס בכפר ואל תנסו לפתוח דלתות. התהלכו בשקט בבית הקברות היהודי וכסו כתפיים בכנסייה
    – זה מקום של זיכרון, לא תפאורה לצילומים. בבוקר הנוף אל עמק הלג'אנורי צלול ביותר; בצהרי הקיץ חם מאוד
    על המדרון החשוף. לאילאשי משתלבת באופן טבעי עם עמודי סאירמה ומבצר מורי, שניהם במרחק נסיעה קצרה, ליום
    לצ'חומי מלא.
  route: >-
    מטביליסי סעו בכביש E60 (S1) מערבה עד קוטאיסי, משם בכביש Sh16 צפונה לכיוון אלפנה, וממש לפניה פנו לכביש
    Sh18 לכיוון צאגרי; מן הכביש הזה מטפסת אל הכפר דרך מתפתלת קצרה. זה כ-315 ק"מ – הקדישו חמש שעות. הכביש
    סלול לכל אורכו, אבל בעלייה האחרונה הוא שבור פה ושם: רכב אקונומי יסתדר במזג אוויר יבש, ואחרי גשם רכב
    שטח הוא הבחירה הרגועה יותר, ולכן אנחנו ממליצים עליו. תדלקו בקוטאיסי או בצאגרי; בלאילאשי עצמה אין שום
    שירותים.
ar:
  name: لايلاشي
  short: >-
    قرية جبلية في ليتشخومي كان الجورجيون واليهود واليونانيون والأرمن يتاجرون فيها يوماً في ساحة واحدة،
    وفيها عُثر على مخطوطة عبرية للتوراة من القرن العاشر.
  body: >-
    **كانت لايلاشي يوماً بلدة سوق تساوم فيها أربعة شعوب في ساحة واحدة، وما زالت تلك الساحة تُدعى «بازاري».**


    تقع القرية على ارتفاع نحو 850 متراً، على سفح السلسلة الفاصلة بين نهري لاجانوري وأسكيستسكالي، على بعد
    18 كم من تساغيري. وتقول الرواية إن لاجئين يهوداً وأرمناً صعدوا إلى هنا في القرن السادس عشر فارّين
    من سامتسخي-جافاخيتي بعد أن استولى العثمانيون على أخالكالاكي. ويقال إنهم وصلوا ليلاً، ويسمع الأهالي
    في اسم القرية الكلمة العبرية *لَيْلا*، أي «الليل». وبحلول النصف الأول من القرن التاسع عشر كانت لايلاشي
    أهم مركز تجاري في ليتشخومي، يسكنها الجورجيون واليهود واليونانيون والأرمن.


    وأشهر أبناء القرية كتاب. ففي أربعينيات القرن العشرين عُثر هنا على مخطوطة عبرية للتوراة (أسفار موسى
    الخمسة)؛ وتؤرَّخ هذه المخطوطة المعروفة بـ«كتاب لايلاشي المقدس» عادةً بالقرن العاشر (ويرى بعض الباحثين
    أنها من القرن التاسع)، وهي في تبليسي منذ عام 1957 ومحفوظة اليوم في المركز الوطني للمخطوطات. وترك مسيحيو
    القرية كنزهم الخاص أيضاً: إنجيلاً نسخه خدّام الكنيسة المحليون، وهو اليوم في أحد متاحف تبليسي. أما
    التربة فأخرجت فؤوساً برونزية من القرنين الرابع عشر والثالث عشر قبل الميلاد، محفوظة الآن في متحف الإرميتاج
    في سانت بطرسبورغ.


    تمشَّ فيها على مهل. ما زال الكنيس قائماً في بازاري؛ وعلى تلة المقبرة كنيسة بسيطة ذات قاعة واحدة مع
    برج أجراسها من مطلع القرن التاسع عشر؛ أما الكنيسة الأرمنية فمتضرّرة بشدة. واختم جولتك عند أوكرونيشي،
    حوض النبع الذي بناه يهود القرية، وتحته تنبسط بحيرة سدّ لاجانوري. وسيتعرّف محبّو السينما إلى أزقّتها:
    فنحو 30 في المئة من الفيلم الجورجي الكلاسيكي «أنا وجدّتي وإيليكو وإيلاريون» صُوّر في لايلاشي.


    في شتاء عام 1904 سرت النار بين البيوت الخشبية المتلاصقة فأتت على 150 منها. وبعد ثماني سنوات أنهى أكاكي
    تسيريتيلي هنا رحلته عبر راتشا وليتشخومي، فأهدى القرويون الشاعر الشيخ عصا مشي من فضة. لطالما عرفت لايلاشي
    كيف تعيد بناء البيت، وكيف تستقبل الضيف.
  tip: >-
    لا مقهى في لايلاشي ولا محطة وقود ولا صرّاف آلي، فاحمل الماء وزاد النزهة من تساغيري. قد تكون بعض المباني
    مغلقة: اسأل في القرية بلطف بدلاً من تجربة الأبواب. امشِ بهدوء في المقبرة اليهودية واستر كتفيك في الكنيسة،
    فهذا مكان ذاكرة لا موقع تصوير. الصباح يمنح أصفى إطلالة على وادي لاجانوري، أما ظهائر الصيف فحارّة على
    السفح المكشوف. وتقترن لايلاشي طبيعياً بأعمدة سايرمه وقلعة موري، وكلاهما على مسافة قصيرة بالسيارة،
    ليوم كامل في ليتشخومي.
  route: >-
    من تبليسي خذ الطريق E60 (S1) غرباً إلى كوتايسي، ثم الطريق Sh16 شمالاً باتجاه ألبانا، وقبلها بقليل
    انعطف إلى الطريق Sh18 باتجاه تساغيري؛ ومن هذا الطريق يصعد إلى القرية طريق متعرّج قصير. المسافة نحو
    315 كم، فخصّص خمس ساعات. الطريق معبّد على طوله، لكنه متكسّر في مواضع من الصعود الأخير: تجتازه سيارة
    اقتصادية في الطقس الجاف، أما بعد المطر فالسيارة رباعية الدفع أهدأ بالاً، ولذلك نوصي بها. تزوّد بالوقود
    في كوتايسي أو تساغيري؛ فلا شيء في لايلاشي نفسها.
