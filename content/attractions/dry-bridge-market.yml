ka:
  name: მშრალი ხიდის ბაზრობა
  short: |-
    ღია ცის ქვეშ გამართული ძველმანების ბაზრობა, სადაც ქვეყნის ორი საუკუნის ნივთები ერთ მაგიდაზეა გაშლილი.
  body: |-
    **მშრალი ხიდი ხიდია, რომლის ქვეშ წყალი აღარ მიედინება.** ის XIX საუკუნის შუა წლებში აშენდა მტკვრის ტოტზე, რომელიც მადათოვის კუნძულს გამოყოფდა; 1930-იან წლებში ეს ტოტი ამოავსეს და ხიდი მშრალი დარჩა.

    ბაზრობა 1990-იანი წლების დასაწყისში გაჩნდა და მისი წარმოშობა უსიამოვნოა: საბჭოთა კავშირის დაშლის შემდეგ, ხელფასების და პენსიების გაქრობის პირობებში, ხალხმა საკუთარი სახლის ნივთების გაყიდვა დაიწყო. ის, რაც დღეს ტურისტული ატრაქციაა, სინამდვილეში სასოწარკვეთის ბაზარი იყო.

    დღეს გაშლილია:

    - საბჭოთა ორდენები, ნიშნები, საათები და ფოტოაპარატები

    - ფაიფური, ვერცხლის ჭურჭელი, სამოვრები, ძველი ბანკნოტები და მონეტები

    - ქართული მინანქრის სამკაულები, ხანჯლები, ხალიჩები

    - ვინილის ფირფიტები, ძველი წიგნები და ოჯახური ფოტოები, რომლებიც უცხო ადამიანებმა გაყიდეს

    ხიდის მიღმა, დედაენის ბაღში, მხატვრები ტილოებს ყიდიან, ქვემოთ კი ავეჯისა და ხის ნაკეთობების რიგია.

    ორი პრაქტიკული სიმართლე. პირველი: „ანტიკვარიატის" დიდი ნაწილი რეპროდუქციაა — განსაკუთრებით ხანჯლები, ორდენები და ხატები. მეორე: ორმოცდაათ წელზე ძველი ნამდვილი ნივთის ქვეყნიდან გატანა კულტურის სამინისტროს ნებართვას მოითხოვს, რასაც გამყიდველი შენს მაგივრად არ მოაგვარებს. ვაჭრობა მოსალოდნელია და პირველი ფასი თითქმის ყოველთვის შემცირდება.

    თუ რამე ღირს ყიდვა, ეს ჩვეულებრივ პატარა და კონკრეტული ნივთია: ქართული მინანქრის ნამდვილი საყურე, საბჭოთა ფოტოაპარატი, რომელიც ჯერ კიდევ იღებს, ძველი ქართული კინოს აფიშა, ხელით მოხატული ფაიფურის ჭიქა. დიდი ავეჯი და ხალიჩა ჩვეულებრივ სახლში მისატანად რთულია და გატანაც ცალკე პრობლემაა. ბაზრობა ერთდროულად სამი რამაა: ბაზარი, ღია ცის ქვეშ მუზეუმი და ცხრაასოთხმოციანების ეკონომიკური ისტორიის დარბაზი.
  tip: |-
    ერთი საათი საკმარისია, თუ არაფერს ეძებ კონკრეტულად. საუკეთესო დროა შაბათ-კვირას, დილის 10-დან 14 საათამდე; ცუდ ამინდში ვაჭრობა ძალიან იკლებს და ზამთარში ნახევარი მაგიდაა გაშლილი. ნაღდი ფული აუცილებელია, წვრილი კუპიურებით — ტერმინალი თითქმის არავის აქვს. ჩანთა წინ დაიჭირე, ხალხმრავლობაშია. ფოტოს გადაღებამდე ჰკითხე გამყიდველს. ტუალეტი მიმდებარე კაფეებშია, ჩრდილი — მხოლოდ ხეების ქვეშ.
  route: |-
    ბაზრობა ცენტრშია, თავისუფლების მოედნიდან 10 წუთის სავალზე, ამიტომ ყველაზე გონივრული ფეხით ან მეტროთი მისვლაა. მანქანით მოსვლის შემთხვევაში: ნიკოლოზ ბარათაშვილის გასწვრივ ან ჩიტაძის ქუჩაზე ზონალური, ანაზღაურებადი ადგილებია, ხოლო თავისუფლების მოედნის ქვეშ არსებული მიწისქვეშა პარკინგიდან 8-10 წუთია ფეხით. თავად ხიდის მიმდებარე ქუჩები შაბათ-კვირას მთლიანად იკეტება ვაჭრობით და იქ შესვლა უაზროა. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Dry Bridge Market
  short: |-
    An open-air flea market where two centuries of the country's household objects are laid out on folding tables.
  body: |-
    **The Dry Bridge is a bridge with no water under it.** It was built in the mid-nineteenth century over a side channel of the Mtkvari that separated Madatov Island; the channel was filled in during the 1930s, leaving the bridge high and dry.

    The market appeared in the early 1990s, and its origin is not a cheerful one. After the collapse of the Soviet Union, with wages and pensions simply gone, people came here to sell the contents of their flats. What is now a tourist attraction began as a market of last resort, and a certain amount of what is on the tables still comes from someone's family cupboard.

    On offer today:

    - Soviet medals, badges, watches and cameras

    - porcelain, silverware, samovars, old banknotes and coins

    - Georgian cloisonné enamel jewellery, daggers, carpets

    - vinyl records, old books, and family photographs sold by strangers

    Beyond the bridge, in Dedaena Park, painters sell canvases, and below there is a row of furniture and woodwork.

    Two practical truths. First, a large share of the "antiques" are reproductions, particularly the daggers, the orders and the icons; buy because you like the object, not because you believe the story. Second, taking a genuinely old item out of Georgia requires a permit from the Ministry of Culture for anything over fifty years, and the seller will not sort that out for you. Bargaining is expected, and the first price is almost always reduced.

    If anything here is worth buying, it is usually something small and specific: a real pair of Georgian cloisonné earrings, a Soviet camera that still takes pictures, a poster from a Georgian film of the 1970s, a hand-painted porcelain cup. Large furniture and carpets are harder both to carry home and to export. The market works simultaneously as three things: a place to shop, an open-air museum of Soviet material culture, and a fairly blunt exhibit about what happened to household wealth in the 1990s.
  tip: |-
    An hour is enough unless you are hunting for something specific. The market is at its fullest at weekends between about ten and two; in bad weather trade collapses, and in winter half the tables never appear. Bring cash in small notes — almost no one takes cards. Keep your bag in front of you in the crowd. Ask before photographing a seller; many mind. Toilets are in the surrounding cafes, and the only shade is under the trees.
  route: |-
    The market is central, a ten-minute walk from Freedom Square, so the sensible approach is on foot or by metro. If you do drive, there are metered zone bays along Nikoloz Baratashvili and on Chitadze Street, and the underground car park at Freedom Square is eight to ten minutes' walk away. The lanes immediately around the bridge are taken over by stalls at weekends and driving into them is pointless. An economy car is enough.
ru:
  name: Блошиный рынок у Сухого моста
  short: |-
    Барахолка под открытым небом, где на раскладных столах лежат два века домашних вещей страны.
  body: |-
    **Сухой мост — мост, под которым нет воды.** Его построили в середине XIX века над рукавом Куры, отделявшим Мадатовский остров; в 1930-х этот рукав засыпали, и мост остался сухим.

    Рынок возник в начале 1990-х, и происхождение у него невесёлое. После распада Советского Союза, когда зарплаты и пенсии попросту исчезли, люди понесли сюда содержимое собственных квартир. То, что сегодня туристическая достопримечательность, начиналось как рынок отчаяния, и часть вещей на столах по-прежнему приходит из чьего-то семейного шкафа.

    Сегодня здесь продают:

    - советские ордена, значки, часы и фотоаппараты

    - фарфор, серебро, самовары, старые купюры и монеты

    - грузинские украшения перегородчатой эмали, кинжалы, ковры

    - виниловые пластинки, старые книги и семейные фотографии, которые продают посторонние люди

    За мостом, в парке Дедаэна, художники торгуют холстами, а ниже стоит ряд мебели и деревянных изделий.

    Две практические истины. Первая: значительная часть «антиквариата» — новоделы, особенно кинжалы, ордена и иконы; покупайте потому, что вещь нравится, а не потому, что верите легенде. Вторая: вывоз действительно старой вещи из Грузии требует разрешения министерства культуры для всего старше пятидесяти лет, и продавец за вас это не оформит. Торг уместен, первая цена почти всегда снижается.

    Если что-то и стоит здесь покупать, то обычно небольшое и конкретное: настоящие грузинские серьги перегородчатой эмали, советский фотоаппарат, который ещё снимает, афишу грузинского фильма 1970-х, расписанную вручную фарфоровую чашку. Крупную мебель и ковры сложнее и довезти, и вывезти. Рынок работает сразу как три вещи: как место покупок, как музей советской материальной культуры под открытым небом и как довольно прямолинейная выставка о том, что случилось с домашним достатком в девяностые.
  tip: |-
    Часа достаточно, если вы не ищете что-то конкретное. Рынок полнее всего в выходные примерно с десяти до двух; в плохую погоду торговля сходит на нет, а зимой половина столов не появляется вовсе. Берите наличные мелкими купюрами — карты почти никто не принимает. В толпе держите сумку перед собой. Прежде чем снимать продавца, спросите: многие против. Туалеты в окрестных кафе, тень только под деревьями.
  route: |-
    Рынок в центре, в десяти минутах ходьбы от площади Свободы, поэтому разумнее прийти пешком или на метро. Если всё же на машине: размеченные платные места есть вдоль улицы Николоза Бараташвили и на улице Читадзе, а от подземной парковки на площади Свободы идти восемь-десять минут. Переулки вплотную к мосту в выходные заняты торговлей, заезжать туда бессмысленно. Достаточно машины эконом-класса.
fa:
  name: بازار پل خشک
  short: |-
    بازار سمساری روبازی که دو سده وسایل خانگی این کشور را روی میزهای تاشو پهن کرده است.
  body: |-
    **پل خشک پلی است که زیرش آب نیست.** آن را در میانهٔ سدهٔ نوزدهم روی شاخه‌ای از متکواری ساختند که جزیرهٔ ماداتوف را جدا می‌کرد؛ در دههٔ ۱۹۳۰ آن شاخه را پر کردند و پل خشک ماند.

    بازار در آغاز دههٔ ۱۹۹۰ پیدا شد و خاستگاهش شاد نیست. پس از فروپاشی اتحاد شوروی، وقتی حقوق و مستمری‌ها یکسره ناپدید شد، مردم محتویات خانه‌هایشان را برای فروش به اینجا آوردند. آنچه امروز جاذبهٔ گردشگری است، در آغاز بازار ناچاری بود، و هنوز بخشی از آنچه روی میزهاست از گنجهٔ خانوادگی کسی می‌آید.

    امروز عرضه می‌شود:

    - نشان‌ها و مدال‌ها و ساعت‌ها و دوربین‌های دورهٔ شوروی

    - چینی، ظروف نقره، سماور، اسکناس و سکه‌های قدیمی

    - زیورهای میناکاری گرجی، خنجر، فرش

    - صفحه‌های گرامافون، کتاب‌های کهنه و عکس‌های خانوادگی که غریبه‌ها می‌فروشند

    آن‌سوی پل در پارک ددانا نقاشان بوم می‌فروشند و پایین‌تر ردیفی از مبل و کارهای چوبی هست.

    دو حقیقت عملی. نخست، بخش بزرگی از «عتیقه‌ها» بازساخته‌اند، به‌ویژه خنجرها و نشان‌ها و شمایل‌ها؛ بخرید چون شیء را دوست دارید، نه چون داستانش را باور کرده‌اید. دوم، بردن یک شیء واقعاً کهن از گرجستان برای هر چیز بالای پنجاه سال به مجوز وزارت فرهنگ نیاز دارد و فروشنده این کار را برای شما انجام نمی‌دهد. چانه زدن انتظار می‌رود و قیمت اول تقریباً همیشه پایین می‌آید.

    اگر چیزی اینجا ارزش خریدن داشته باشد، معمولاً چیزی کوچک و مشخص است: یک جفت گوشوارهٔ اصیل میناکاری گرجی، دوربینی از دورهٔ شوروی که هنوز عکس می‌گیرد، پوستری از یک فیلم گرجی دههٔ ۱۹۷۰، فنجانی چینی با نقاشی دست. مبل بزرگ و فرش هم بردن به خانه‌شان سخت‌تر است هم خارج کردنشان. این بازار همزمان سه چیز است: جایی برای خرید، موزه‌ای روباز از فرهنگ مادی شوروی، و نمایشگاهی صریح از آنچه در دههٔ نود بر دارایی خانه‌ها گذشت.
  tip: |-
    اگر دنبال چیز مشخصی نیستید یک ساعت کافی است. بازار در آخر هفته میان ساعت ده تا دو پرترین حالت را دارد؛ در هوای بد داد و ستد از رونق می‌افتد و در زمستان نیمی از میزها اصلاً برپا نمی‌شوند. پول نقد با اسکناس‌های خرد بیاورید، چون تقریباً کسی کارت نمی‌پذیرد. در ازدحام کیف را جلوی خود نگه دارید. پیش از عکس گرفتن از فروشنده بپرسید؛ بسیاری خوششان نمی‌آید. سرویس بهداشتی در کافه‌های اطراف است و تنها سایه زیر درختان.
  route: |-
    بازار در مرکز شهر و ده دقیقه پیاده از میدان آزادی است، پس منطقی‌ترین کار آمدن پیاده یا با مترو است. اگر با خودرو می‌آیید، جای‌های پولی خط‌کشی‌شده در امتداد خیابان نیکولوز باراتاشویلی و در خیابان چیتادزه هست، و از پارکینگ زیرزمینی میدان آزادی هشت تا ده دقیقه پیاده‌روی است. کوچه‌های چسبیده به پل در آخر هفته یکسره در اختیار بساط‌هاست و رانندگی در آنها بی‌فایده است. خودروی اقتصادی کافی است.
he:
  name: שוק הפשפשים בגשר היבש
  short: |-
    שוק פשפשים תחת כיפת השמיים, שבו פרושים על שולחנות מתקפלים מאתיים שנות חפצי בית של המדינה.
  body: |-
    **הגשר היבש הוא גשר שאין מתחתיו מים.** הוא נבנה באמצע המאה ה-19 מעל זרוע צדדית של המתקוורי שהפרידה את אי מאדאטוב; בשנות ה-30 מילאו את הזרוע, והגשר נותר יבש.

    השוק צמח בראשית שנות ה-90, ומקורו אינו עליז. אחרי התמוטטות ברית המועצות, כשמשכורות וקצבאות פשוט נעלמו, אנשים הביאו לכאן את תכולת דירותיהם למכירה. מה שהוא היום אטרקציה תיירותית התחיל כשוק של מוצא אחרון, וחלק ממה שמונח על השולחנות עדיין מגיע מארון של מישהו.

    מה שמוצע היום:

    - עיטורים סובייטיים, סמלים, שעונים ומצלמות

    - חרסינה, כלי כסף, סמוברים, שטרות ומטבעות ישנים

    - תכשיטי אמייל גאורגיים, פגיונות, שטיחים

    - תקליטי ויניל, ספרים ישנים ותצלומי משפחה שזרים מוכרים

    מעבר לגשר, בפארק דדאנה, מוכרים ציירים בדים, ולמטה משתרעת שורה של רהיטים ועבודות עץ.

    שתי אמיתות מעשיות. ראשית, חלק גדול מן ה"עתיקות" הוא שכפולים, במיוחד הפגיונות, העיטורים והאיקונות; קנו כי החפץ מוצא חן בעיניכם, לא כי אתם מאמינים לסיפור. שנית, הוצאת פריט עתיק באמת מגאורגיה מחייבת אישור ממשרד התרבות לכל דבר מעל חמישים שנה, והמוכר לא יסדר זאת עבורכם. מיקוח מקובל, והמחיר הראשון כמעט תמיד יורד.

    אם משהו כאן שווה קנייה, זה בדרך כלל דבר קטן ומסוים: זוג עגילי אמייל גאורגי אמיתי, מצלמה סובייטית שעדיין מצלמת, כרזה של סרט גאורגי משנות ה-70, ספל חרסינה מצויר ביד. רהיטים גדולים ושטיחים קשים גם לנשיאה הביתה וגם לייצוא. השוק פועל בו-זמנית כשלושה דברים: מקום לקניות, מוזיאון פתוח לתרבות החומרית הסובייטית, ותערוכה בוטה למדי על מה שקרה לרכוש הביתי בשנות התשעים.
  tip: |-
    שעה מספיקה אם אינכם מחפשים משהו מסוים. השוק במלוא היקפו בסופי שבוע בין עשר לשתיים בערך; במזג אוויר רע המסחר מתמוטט, ובחורף חצי מן השולחנות אינם מופיעים כלל. הביאו מזומן בשטרות קטנים — כמעט אף אחד אינו מקבל כרטיסים. בהמון החזיקו את התיק לפניכם. שאלו לפני שאתם מצלמים מוכר; רבים מקפידים. שירותים בבתי הקפה מסביב, והצל היחיד הוא מתחת לעצים.
  route: |-
    השוק מרכזי, עשר דקות הליכה מכיכר החירות, ולכן הגיוני להגיע ברגל או ברכבת התחתית. אם בכל זאת ברכב, יש מקומות מסומנים בתשלום לאורך רחוב ניקולוז בראטאשווילי וברחוב צ'יטאדזה, ומן החניון התת-קרקעי בכיכר החירות זו הליכה של שמונה עד עשר דקות. הסמטאות הצמודות לגשר תפוסות בסופי שבוע בדוכנים ואין טעם להיכנס אליהן ברכב. רכב חסכוני מספיק.
ar:
  name: سوق الجسر الجاف
  short: |-
    سوق للأشياء المستعملة في الهواء الطلق، تُفرش فيه على طاولات قابلة للطي قرنان من مقتنيات البيوت.
  body: |-
    **الجسر الجاف جسر لا ماء تحته.** بُني في منتصف القرن التاسع عشر فوق ذراع جانبية من نهر متكفاري كانت تفصل جزيرة ماداتوف؛ وردمت تلك الذراع في الثلاثينيات فبقي الجسر جافاً.

    ونشأ السوق في مطلع التسعينيات، ونشأته ليست مبهجة. فبعد انهيار الاتحاد السوفييتي، حين اختفت الرواتب والمعاشات ببساطة، حمل الناس إلى هنا محتويات شققهم للبيع. وما هو اليوم معلم سياحي بدأ سوقاً للضرورة القصوى، وما زال بعض ما على الطاولات يأتي من خزانة عائلة ما.

    ويُعرض اليوم:

    - أوسمة سوفييتية وشارات وساعات وآلات تصوير

    - خزف وأوانٍ فضية وسماورات وأوراق نقدية ومسكوكات قديمة

    - حلي المينا الجورجية وخناجر وسجاد

    - أسطوانات فينيل وكتب قديمة وصور عائلية يبيعها غرباء

    وخلف الجسر، في حديقة ديدَينا، يبيع الرسامون لوحاتهم، وفي الأسفل صف من الأثاث والأشغال الخشبية.

    وهناك حقيقتان عمليتان. الأولى أن قسماً كبيراً من «التحف» نسخ حديثة، وخاصة الخناجر والأوسمة والأيقونات؛ فاشترِ لأن القطعة أعجبتك لا لأنك صدّقت حكايتها. والثانية أن إخراج قطعة قديمة فعلاً من جورجيا يستلزم تصريحاً من وزارة الثقافة لكل ما يتجاوز خمسين عاماً، ولن يتولى البائع ذلك عنك. والمساومة متوقعة، والسعر الأول ينخفض دائماً تقريباً.

    إن كان شيء هنا يستحق الشراء فهو عادة صغير ومحدد: قرطان أصليان من المينا الجورجية، آلة تصوير سوفييتية ما زالت تلتقط الصور، ملصق لفيلم جورجي من السبعينيات، فنجان خزفي مرسوم باليد. أما الأثاث الكبير والسجاد فحمله إلى البيت وإخراجه من البلد أصعب. ويعمل السوق في آن واحد كثلاثة أشياء: مكان للتسوق، ومتحف مفتوح للثقافة المادية السوفييتية، ومعرض صريح عما حل بثروة البيوت في التسعينيات.
  tip: |-
    ساعة تكفي ما لم تكن تبحث عن شيء بعينه. والسوق في أوج امتلائه في عطلة نهاية الأسبوع بين العاشرة والثانية تقريباً؛ وفي الطقس السيئ يتوقف البيع، وفي الشتاء لا يظهر نصف الطاولات أصلاً. واحمل نقداً بفئات صغيرة، فالبطاقات لا تُقبل تقريباً. واحفظ حقيبتك أمامك في الزحام. واسأل قبل تصوير بائع، فكثيرون يمانعون. ودورات المياه في المقاهي المجاورة، والظل الوحيد تحت الأشجار.
  route: |-
    السوق في المركز، على بعد عشر دقائق مشياً من ميدان الحرية، فالأعقل المجيء سيراً أو بالمترو. وإن جئت بالسيارة فهناك أماكن مدفوعة مخططة على امتداد شارع نيكولوز باراتاشفيلي وفي شارع تشيتادزه، ومن المرآب الأرضي في ميدان الحرية تمشي ثماني إلى عشر دقائق. أما الأزقة الملاصقة للجسر فتشغلها البسطات في العطلة ولا جدوى من دخولها بالسيارة. وسيارة اقتصادية تكفي.
