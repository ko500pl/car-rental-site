ka:
  name: მშრალი ხიდის ბაზრობა
  short: >-
    ხიდი, რომელსაც 1930-იან წლებში მდინარე გამოეცალა და დღეს საბჭოთა ორდენებით, ფოტოაპარატებით, მინანქრითა
    და ოჯახური ცხოვრების ნამსხვრევებით არის მოფენილი.
  body: >-
    **მშრალი ხიდის ქვეშ მდინარე 1930-იანი წლებიდან აღარ მიედინება; სამაგიეროდ, უკვე ოცდაათ წელზე მეტია,
    მასზე თბილისური კარადების შიგთავსი მიედინება.**


    1840-იან წლებში მეფისნაცვალმა მიხეილ ვორონცოვმა იტალიელ არქიტექტორ ჯოვანი სკუდიერს აქ მტკვარზე ხიდის
    აშენება დაავალა. ჩანაფიქრიდან მხოლოდ ნაწილი განხორციელდა: თლილი ქვის ერთმალიანი თაღი, 32-მეტრიანი
    მალით — იმ დროს რუსეთის იმპერიაში ერთ-ერთი უდიდესი, — გადებული მდინარის მარჯვენა ტოტზე, რომელიც ჯერ
    ორბელიანების, მერე კი მადათოვების კუთვნილ კუნძულს გამოყოფდა. სკუდიერი 1851 წელს გარდაიცვალა. 1930-იან
    წლებში ტოტი დაშრა, კუნძული ნაპირს შეერწყა, ხიდი კი მშრალზე დარჩა. პარაპეტზე ქართულ-იტალიური დაფა დღესაც
    სკუდიერის სახელს ინახავს.


    ბაზრობა 1990-იანი წლების დასაწყისში დაიბადა, და არა სიხარულით. საბჭოთა კავშირის დაშლის შემდეგ, როცა
    ხელფასები და პენსიები გაქრა, ხალხი აქ სახლში არსებულის გასაყიდად მოდიოდა. ის, რაც დღეს ტურისტული ღირსშესანიშნაობაა,
    უკიდურესი გაჭირვების ბაზრად დაიწყო, და დახლებზე გაშლილის ნაწილი დღესაც ვიღაცის ოჯახური კარადიდანაა.


    დღეს დასაკეც მაგიდებსა და გაშლილ საბნებზე საბჭოთა ორდენები და სამკერდე ნიშნებია, საათები და ფოტოაპარატები,
    ფაიფური, ვერცხლის კოვზები და სამოვრები, ძველი ფული, ქართული ტიხრული მინანქარი, ხანჯლები, ხალიჩები,
    ვინილის ფირფიტები, წიგნები და უცნობი ადამიანების ქორწილის ფოტოები. ცოტა იქით, დედაენის ბაღის მოაჯირებზე,
    მხატვრები ტილოებს კიდებენ.


    ფხიზლად იყავით: „ანტიკვარული“ ხანჯლების, ორდენებისა და ხატების დიდი ნაწილი ასლია. ივაჭრეთ — პირველი
    ფასი მხოლოდ საუბრის დასაწყისია. საუკეთესო შენაძენი პატარა და კონკრეტულია: მინანქრის საყურეები, საბჭოთა
    ფოტოაპარატი, რომელიც ჯერ კიდევ იღებს, ძველი ქართული ფილმის აფიშა.


    იყიდეთ ის, რაც მართლა გულზე მოგეხატებათ, და გახსოვდეთ, რომ ოდესღაც ვიღაცამ მისი შენახვა ვეღარ შეძლო.
  tip: >-
    ერთი საათი საკმარისია, თუ რამე კონკრეტულს არ ეძებთ. დახლები თითქმის ყოველდღე იშლება, მაგრამ ბაზრობა
    ყველაზე ხალხმრავალი შაბათ-კვირის დილითაა, წვიმასა და ზამთრის სიცივეში კი თხელდება. თან იქონიეთ ნაღდი
    ფული, წვრილ კუპიურებად — ბარათს იშვიათად იღებენ, — და ხალხმრავლობაში ჩანთა წინ გეჭიროთ. გამყიდველის
    ან მისი დახლის გადაღებამდე ნებართვა ითხოვეთ. ნამდვილად ძველ ნივთებს, განსაკუთრებით ხატებს, ხალიჩებს
    და ყველაფერს, რასაც კულტურული ღირებულება აქვს, ქვეყნიდან გასატანად შესაძლოა კულტურის უწყების სერტიფიკატი
    დასჭირდეს; გამყიდველი ამას არ მოაგვარებს, ამიტომ გაფრენამდე გადაამოწმეთ. ტუალეტი მიმდებარე კაფეებშია,
    ჩრდილი — მხოლოდ ხეების ქვეშ.
  route: >-
    ბაზრობა ცენტრშია: სასტუმროების უმეტესობიდან მანქანით დაახლოებით 2 კილომეტრი და ათი წუთია, თავისუფლების
    მოედნიდან კი ფეხით ათი წუთი, ამიტომ ფეხით სიარული ან მეტრო „თავისუფლების მოედნამდე“ მანქანაზე უფრო
    გონივრულია. თუ მაინც მანქანით მოდიხართ, ფასიანი ადგილები მოძებნეთ ჩიტაძის ქუჩაზე და სანაპიროსკენ მიმავალ
    გვერდით ქუჩებში, ან ისარგებლეთ თავისუფლების მოედნის მიწისქვეშა ავტოსადგომით და რვა-ათ წუთში ფეხით
    მოდით. შაბათ-კვირას ხიდის მიმდებარე შუკები დახლებით ივსება და იქ შესვლას აზრი არ აქვს. ნებისმიერი
    ეკონომკლასის მანქანა გამოდგება.
en:
  name: Dry Bridge Market
  short: >-
    A stone bridge left high and dry in the 1930s, now spread with Soviet medals, cameras, enamel, samovars
    and the leftovers of family life.
  body: >-
    **No river has run under the Dry Bridge since the 1930s; for the last thirty-odd years it has carried
    the contents of Tbilisi's cupboards instead.**


    In the 1840s the viceroy Mikhail Vorontsov asked the Italian architect Giovanni Scudieri to bridge
    the Mtkvari here. Only one part was ever finished: a single cut-stone arch with a 32-metre span, among
    the largest in the Russian Empire, thrown across the river's right-hand channel, which cut off an
    island owned first by the Orbelianis and later by the Madatovs. Scudieri died in 1851. In the 1930s
    the channel dried up, the island vanished into the bank and the bridge was left high and dry. A plaque
    on the parapet, in Georgian and Italian, still carries Scudieri's name.


    The market was born in the early 1990s, and not happily. When the Soviet Union collapsed and wages
    and pensions melted away, people came here to sell what they had at home. What is now an attraction
    began as a market of last resort, and some of what lies on the tables still comes from someone's family
    cupboard.


    Today the folding tables and blankets hold Soviet medals and badges, watches and cameras, porcelain,
    silver spoons and samovars, old banknotes, Georgian cloisonné enamel, daggers, carpets, vinyl records,
    books, and photographs of strangers' weddings. Painters hang their canvases along the railings of
    Dedaena Park beyond.


    Be clear-eyed: many of the "antique" daggers, orders and icons are reproductions. Bargain, because
    the first price is only an opening line. The best buys are small and specific — a pair of enamel earrings,
    a Soviet camera that still works, an old Georgian film poster.


    Buy something you actually love, and remember that someone, once, could not afford to keep it.
  tip: >-
    An hour is enough unless you are hunting. Stalls are there most days, but the market is fullest on
    weekend mornings and thin in rain and deep winter. Bring cash in small notes — cards are rarely accepted
    — and keep your bag in front of you in the crowd. Ask before photographing a seller or their table.
    Genuinely old objects, especially icons, carpets and anything of heritage value, may need an export
    certificate from Georgia's culture authorities; the seller will not arrange it, so check before you
    fly. Toilets are in the nearby cafés; the only shade is under the trees.
  route: >-
    The market sits in the centre, about 2 km and ten minutes by car from most hotels and a ten-minute
    walk from Freedom Square, so walking or the metro to Freedom Square (Tavisuplebis Moedani) station
    makes more sense than driving. If you do come by car, look for metered bays on Chitadze Street and
    along the embankment side streets, or use the underground car park at Freedom Square and walk eight
    to ten minutes. At weekends the lanes right by the bridge fill with stalls and there is no point driving
    into them. Any economy car will do.
ru:
  name: Рынок на Сухом мосту
  short: >-
    Каменный мост, оставшийся посуху в 1930-х, а ныне уставленный советскими медалями, фотоаппаратами,
    эмалью, самоварами и остатками чужой семейной жизни.
  body: >-
    **Под Сухим мостом с 1930-х годов не течёт никакая река; последние тридцать с лишним лет он несёт
    вместо неё содержимое тбилисских шкафов.**


    В 1840-х годах наместник Михаил Воронцов поручил итальянскому архитектору Джованни Скудиери перекинуть
    здесь мост через Мтквари. Завершить удалось лишь одну часть: однопролётную арку из тёсаного камня
    с пролётом 32 метра, одну из крупнейших в Российской империи, над правой протокой реки, которая отделяла
    остров, принадлежавший сперва Орбелиани, а затем Мадатовым. Скудиери умер в 1851 году. В 1930-х протока
    пересохла, остров слился с берегом, и мост остался посуху. Табличка на парапете, на грузинском и итальянском,
    до сих пор хранит имя Скудиери.


    Рынок родился в начале 1990-х, и родился не от хорошей жизни. Когда Советский Союз рухнул, а зарплаты
    и пенсии растаяли, люди приходили сюда продавать то, что было дома. Нынешняя достопримечательность
    начиналась как рынок последней надежды, и кое-что на прилавках до сих пор попадает сюда из чьего-то
    семейного шкафа.


    Сегодня на складных столиках и расстеленных одеялах лежат советские медали и значки, часы и фотоаппараты,
    фарфор, серебряные ложки и самовары, старые банкноты, грузинская перегородчатая эмаль, кинжалы, ковры,
    виниловые пластинки, книги и фотографии чужих свадеб. Художники развешивают холсты вдоль ограды парка
    Дедаэна чуть дальше.


    Смотрите трезво: многие «старинные» кинжалы, ордена и иконы — копии. Торгуйтесь, потому что первая
    цена лишь начало разговора. Лучшие покупки небольшие и конкретные: пара эмалевых серёжек, советский
    фотоаппарат, который ещё работает, старый грузинский киноплакат.


    Покупайте то, что действительно полюбили, и помните, что кто-то когда-то не смог себе позволить это
    сохранить.
  tip: >-
    Хватит часа, если вы не охотитесь за чем-то конкретным. Прилавки стоят почти каждый день, но полнее
    всего рынок в выходные по утрам, а в дождь и глубокой зимой он редеет. Берите наличные мелкими купюрами,
    карты принимают редко, и в толпе держите сумку перед собой. Спрашивайте разрешения, прежде чем фотографировать
    продавца или его стол. Действительно старые вещи, особенно иконы, ковры и всё, что имеет культурную
    ценность, могут требовать разрешения на вывоз от грузинских органов культуры; продавец его не оформит,
    так что выясните всё до вылета. Туалеты — в соседних кафе; единственная тень — под деревьями.
  route: >-
    Рынок находится в центре, примерно в 2 км и десяти минутах езды от большинства гостиниц и в десяти
    минутах ходьбы от площади Свободы, так что пешком или на метро до станции «Площадь Свободы» разумнее,
    чем на машине. Если всё же едете на машине, ищите платные места на улице Читадзе и в боковых улочках
    у набережной или воспользуйтесь подземной парковкой на площади Свободы и пройдите восемь-десять минут
    пешком. По выходным переулки прямо у моста заставлены прилавками, и заезжать туда бессмысленно. Подойдёт
    любая машина эконом-класса.
fa:
  name: بازار پل خشک
  short: >-
    پلی سنگی که از دههٔ ۱۹۳۰ خشک ماند و حالا پر است از مدال‌های شوروی، دوربین، میناکاری، سماور و بازمانده‌های
    زندگی خانوادگی.
  body: >-
    **از دههٔ ۱۹۳۰ هیچ رودی از زیر پل خشک نگذشته است؛ در سی و چند سال اخیر، این پل به جای آب، محتویات
    گنجه‌های تفلیس را بر دوش کشیده است.**


    در دههٔ ۱۸۴۰ میخائیل وورونتسوف، نایب‌السلطنه، از معمار ایتالیایی جووانی اسکودیری خواست این‌جا پلی
    بر متکواری بزند. از این طرح تنها یک بخش به سرانجام رسید: طاقی یک‌دهانه از سنگ تراش‌خورده با دهانهٔ
    ۳۲ متری، از بزرگ‌ترین‌ها در امپراتوری روسیه، که بر شاخهٔ راست رود زده شد؛ شاخه‌ای که جزیره‌ای را جدا
    می‌کرد که نخست از آنِ خاندان اوربلیانی و بعدها از آنِ خاندان مداتوف بود. اسکودیری در ۱۸۵۱ درگذشت.
    در دههٔ ۱۹۳۰ آن شاخه خشکید، جزیره به کرانه پیوست و پل بی‌آب ماند. لوحی بر جان‌پناه، به گرجی و ایتالیایی،
    هنوز نام اسکودیری را بر خود دارد.


    بازار در آغاز دههٔ ۱۹۹۰ زاده شد، و نه در روزگاری خوش. وقتی اتحاد شوروی فروپاشید و دستمزدها و مستمری‌ها
    آب شدند، مردم به این‌جا می‌آمدند تا آنچه در خانه داشتند بفروشند. آنچه امروز جاذبه‌ای گردشگری است،
    به‌عنوان بازارِ آخرین چاره آغاز شد، و برخی از آنچه روی میزها می‌بینید هنوز از گنجهٔ خانوادگی کسی آمده
    است.


    امروز میزهای تاشو و پتوهای پهن‌شده پر است از مدال‌ها و نشان‌های شوروی، ساعت و دوربین، چینی، قاشق‌های
    نقره و سماور، اسکناس‌های قدیمی، میناکاری خانه‌بندی گرجی، خنجر، فرش، صفحه‌های گرامافون، کتاب و عکس
    عروسیِ غریبه‌ها. نقاشان بوم‌هایشان را کمی آن‌طرف‌تر، بر نرده‌های پارک دداینا می‌آویزند.


    واقع‌بین باشید: بسیاری از خنجرها، نشان‌ها و شمایل‌های «عتیقه» بدل‌اند. چانه بزنید، چون قیمت اول فقط
    سرآغاز گفت‌وگوست. بهترین خریدها کوچک و مشخص‌اند: یک جفت گوشوارهٔ میناکاری، دوربینی شوروی که هنوز کار
    می‌کند، پوستری قدیمی از یک فیلم گرجی.


    چیزی بخرید که واقعاً دوستش دارید، و به یاد داشته باشید که کسی، روزگاری، توان نگه داشتنش را نداشت.
  tip: >-
    اگر دنبال چیز خاصی نیستید، یک ساعت کافی است. بساط‌ها بیشتر روزها برپا هستند، اما بازار صبح‌های آخر
    هفته از همیشه پرتر است و در باران و زمستانِ سخت خلوت می‌شود. پول نقد با اسکناس خُرد بیاورید، چون کارت
    به‌ندرت پذیرفته می‌شود، و در شلوغی کیفتان را جلوی خود نگه دارید. پیش از عکس گرفتن از فروشنده یا میزش
    اجازه بگیرید. اشیای واقعاً قدیمی، به‌ویژه شمایل‌ها، فرش‌ها و هر چیزی با ارزش میراثی، ممکن است به گواهی
    خروج از مراجع فرهنگی گرجستان نیاز داشته باشند؛ فروشنده آن را برایتان نمی‌گیرد، پس پیش از پرواز پرس‌وجو
    کنید. سرویس بهداشتی در کافه‌های نزدیک است؛ تنها سایه زیر درختان است.
  route: >-
    بازار در مرکز شهر است، حدود ۲ کیلومتر و ده دقیقه رانندگی از بیشتر هتل‌ها و ده دقیقه پیاده از میدان
    آزادی؛ پس پیاده رفتن یا مترو تا ایستگاه «میدان آزادی» معقول‌تر از رانندگی است. اگر با خودرو می‌آیید،
    دنبال جای پارک پولی در خیابان چیتادزه و کوچه‌های فرعیِ نزدیک خیابان ساحلی بگردید، یا از پارکینگ زیرزمینی
    میدان آزادی استفاده کنید و هشت تا ده دقیقه پیاده بروید. آخر هفته‌ها کوچه‌های کنار پل پر از بساط است
    و راندن به داخلشان بی‌فایده است. هر خودروی اکونومی کافی است.
he:
  name: שוק הגשר היבש
  short: גשר אבן שנותר ביובש בשנות ה-30, ועליו היום מדליות סובייטיות, מצלמות, אמייל, סמוברים ושאריות של
    חיי משפחה.
  body: >-
    **שום נהר לא זרם מתחת לגשר היבש מאז שנות ה-30 של המאה ה-20; בשלושים ומשהו השנים האחרונות הוא נושא
    במקומו את תכולת הארונות של טביליסי.**


    בשנות ה-40 של המאה ה-19 ביקש המשנה למלך, מיכאיל וורונצוב, מן האדריכל האיטלקי ג'ובאני סקודיירי לגשר
    כאן על המטקווארי. רק חלק אחד הושלם אי פעם: קשת יחידה מאבן מסותתת, במפתח של 32 מטר, מן הגדולות באימפריה
    הרוסית, שנמתחה מעל הזרוע הימנית של הנהר, זו שהפרידה אי שהיה שייך תחילה למשפחת אורבליאני ומאוחר יותר
    למשפחת מדטוב. סקודיירי מת ב-1851. בשנות ה-30 של המאה ה-20 יבשה הזרוע, האי נבלע בגדה, והגשר נותר ביובש.
    לוח על המעקה, בגאורגית ובאיטלקית, עדיין נושא את שמו של סקודיירי.


    השוק נולד בראשית שנות ה-90, ולא מתוך שמחה. כשברית המועצות קרסה והמשכורות והפנסיות נמסו, אנשים באו
    לכאן למכור את מה שהיה להם בבית. מה שהוא היום אטרקציה התחיל כשוק של מוצא אחרון, וחלק ממה שמונח על השולחנות
    עדיין מגיע מארון משפחתי של מישהו.


    היום נושאים השולחנות המתקפלים והשמיכות הפרושות מדליות ותגים סובייטיים, שעונים ומצלמות, פורצלן, כפות
    כסף וסמוברים, שטרות ישנים, אמייל תאים גאורגי, פגיונות, שטיחים, תקליטי ויניל, ספרים ותמונות מחתונות
    של זרים. ציירים תולים את הבדים שלהם מעט הלאה, לאורך גדר פארק דדאנה.


    הביטו בעיניים פקוחות: רבים מן הפגיונות, העיטורים והאיקונות ה"עתיקים" הם העתקים. התמקחו, כי המחיר הראשון
    הוא רק פתיחת שיחה. הקניות הטובות ביותר קטנות וממוקדות: זוג עגילי אמייל, מצלמה סובייטית שעדיין עובדת,
    כרזת סרט גאורגי ישנה.


    קנו משהו שאתם באמת אוהבים, וזכרו שמישהו, פעם, לא יכול היה להרשות לעצמו לשמור אותו.
  tip: >-
    שעה מספיקה, אלא אם אתם מחפשים משהו מסוים. הדוכנים פתוחים ברוב הימים, אבל השוק מלא ביותר בבקרי סוף
    השבוע ודליל בגשם ובעומק החורף. הביאו מזומן בשטרות קטנים, כי כרטיסי אשראי מתקבלים לעתים רחוקות, ובהמולה
    החזיקו את התיק לפניכם. בקשו רשות לפני שאתם מצלמים מוכר או את השולחן שלו. חפצים עתיקים באמת, בייחוד
    איקונות, שטיחים וכל דבר בעל ערך מורשת, עשויים לחייב אישור ייצוא מרשויות התרבות של גאורגיה; המוכר לא
    יסדר אותו, אז בדקו לפני הטיסה. שירותים יש בבתי הקפה הסמוכים; הצל היחיד הוא מתחת לעצים.
  route: >-
    השוק נמצא במרכז, כ-2 ק"מ ועשר דקות נסיעה מרוב המלונות ועשר דקות הליכה מכיכר החירות, כך שהליכה או מטרו
    עד תחנת "כיכר החירות" הגיוניים יותר מנהיגה. אם בכל זאת באתם ברכב, חפשו מקומות חניה בתשלום ברחוב צ'יטדזה
    ובסמטאות הצדדיות ליד הטיילת, או השתמשו בחניון התת-קרקעי בכיכר החירות ולכו שמונה עד עשר דקות. בסופי
    שבוע הסמטאות שליד הגשר מלאות דוכנים, ואין טעם להיכנס אליהן ברכב. כל רכב חסכוני יתאים.
ar:
  name: سوق الجسر الجاف
  short: >-
    جسر حجري بقي على اليابسة منذ ثلاثينيات القرن العشرين، وتفترشه اليوم أوسمة سوفييتية وكاميرات ومينا
    وسماورات وبقايا حياة عائلية.
  body: >-
    **لم يجرِ نهر تحت الجسر الجاف منذ ثلاثينيات القرن العشرين؛ وفي السنوات الثلاثين ونيّف الأخيرة صار
    يحمل بدلاً منه محتويات خزائن تبليسي.**


    في أربعينيات القرن التاسع عشر طلب نائب الملك ميخائيل فورونتسوف من المعماري الإيطالي جوفاني سكوديري
    أن يمدّ جسراً فوق نهر متكفاري هنا. ولم يُنجز إلا جزء واحد: قوس وحيد من الحجر المنحوت بفتحة 32 متراً،
    من أكبر الفتحات في الإمبراطورية الروسية، أُلقي فوق الفرع الأيمن للنهر الذي كان يفصل جزيرة امتلكتها
    أولاً أسرة أوربيلياني ثم أسرة مادَتوف. مات سكوديري عام 1851. وفي الثلاثينيات جفّ الفرع، والتحمت الجزيرة
    بالضفة، وبقي الجسر على اليابسة. ولوحة على حاجزه، بالجورجية والإيطالية، ما زالت تحمل اسم سكوديري.


    وُلد السوق في مطلع التسعينيات، ولم تكن ولادته سعيدة. فحين انهار الاتحاد السوفييتي وذابت الأجور والمعاشات،
    جاء الناس إلى هنا ليبيعوا ما في بيوتهم. وما هو اليوم معلم سياحي بدأ سوقاً للملاذ الأخير، وبعض ما على
    الطاولات ما زال يأتي من خزانة عائلة ما.


    اليوم تحمل الطاولات القابلة للطي والبطانيات المفروشة أوسمة وشارات سوفييتية، وساعات وكاميرات، وخزفاً
    صينياً، وملاعق فضية وسماورات، وأوراقاً نقدية قديمة، ومينا جورجية مقسّمة، وخناجر، وسجاداً، وأسطوانات
    فينيل، وكتباً، وصوراً من أعراس غرباء. ويعلّق الرسامون لوحاتهم على سياج حديقة ديداينا أبعد قليلاً.


    كن واقعياً: كثير من الخناجر والأوسمة والأيقونات "الأثرية" نسخ مقلدة. ساوم، فالسعر الأول ليس إلا افتتاحية
    للحديث. أفضل المشتريات صغيرة ومحددة: زوج أقراط من المينا، كاميرا سوفييتية ما زالت تعمل، ملصق قديم
    لفيلم جورجي.


    اشترِ شيئاً تحبه حقاً، وتذكّر أن أحداً ما، ذات يوم، لم يكن بوسعه أن يحتفظ به.
  tip: >-
    تكفي ساعة ما لم تكن تبحث عن شيء بعينه. البسطات حاضرة معظم الأيام، لكن السوق يكون في أوج امتلائه صباح
    عطلة نهاية الأسبوع، ويخفّ في المطر وفي عمق الشتاء. احمل نقوداً بفئات صغيرة، فالبطاقات نادراً ما تُقبل،
    وأبقِ حقيبتك أمامك في الزحام. استأذن قبل تصوير البائع أو طاولته. الأشياء القديمة فعلاً، ولا سيما الأيقونات
    والسجاد وكل ما له قيمة تراثية، قد تحتاج إلى شهادة تصدير من جهات الثقافة في جورجيا؛ ولن يستخرجها البائع
    لك، فتحقق من الأمر قبل سفرك. دورات المياه في المقاهي القريبة، والظل الوحيد تحت الأشجار.
  route: >-
    يقع السوق في المركز، على بعد نحو 2 كم وعشر دقائق بالسيارة من معظم الفنادق وعشر دقائق مشياً من ساحة
    الحرية، لذا فالمشي أو المترو إلى محطة "ساحة الحرية" أعقل من القيادة. وإن جئت بالسيارة فابحث عن أماكن
    الوقوف المدفوعة في شارع تشيتادزه والشوارع الجانبية قرب الكورنيش، أو استخدم الموقف تحت الأرض في ساحة
    الحرية وامشِ ثماني إلى عشر دقائق. في عطلة نهاية الأسبوع تمتلئ الأزقة المجاورة للجسر بالبسطات، ولا
    جدوى من دخولها بالسيارة. تكفي أي سيارة اقتصادية.
