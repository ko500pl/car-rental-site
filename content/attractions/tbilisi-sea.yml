ka:
  name: თბილისის ზღვა
  short: 11.6 კმ²-იანი წყალსაცავი ქალაქის ჩრდილო-აღმოსავლეთ კიდეზე — თბილისელების მთავარი საზაფხულო სანაპირო,
    აკვაპარკით და იახტკლუბით, ცენტრიდან 25 წუთში.
  body: >-
    **თბილისის ზღვა ქალაქის მთავარი საზაფხულო თავშესაფარია.** 11.6 კმ²-იანი წყალსაცავი იორის პლატოზე,
    თბილისის ჩრდილო-აღმოსავლეთ კიდეზე, 1953 წელს შეიქმნა, როცა მდინარე იორის წყალი სამი ყოფილი მლაშე
    ტბის ქვაბულში გადმოიყვანეს. მასშტაბი ნამდვილად ზღვისებურია: სიგრძე თითქმის 8.75 კმ-ია, საშუალო სიღრმე
    კი 26.6 მეტრი — ამიტომაც უწოდეს თბილისელებმა ზღვა და არა ტბა.


    ცხელ თვეებში დასავლეთი სანაპირო ცოცხლდება: ქვიშა-ხრეშოვანი პლაჟები, გადახურული ადგილები, კაფეები და
    წყლის ატრაქციონები ერთმანეთს ენაცვლება. აქვეა „ჯინო პარადაისი" — ქალაქის ყველაზე დიდი აკვაპარკი —
    და იახტკლუბი; ტარდება ვინდსერფინგისა და ღია წყალში ცურვის შეჯიბრებებიც. აღმოსავლეთი ნაპირი კი პირიქით,
    ველური სტეპია — ვისაც სიმშვიდე და სივრცე უნდა, იქით წავიდეს.


    ჩრდილო-დასავლეთი ნაპირის ზემოთ, გორაკზე, საქართველოს მატიანის გრანდიოზული მონუმენტი აღიმართება —
    ზღვისა და მთელი ქალაქის საუკეთესო ხედით. ორი ადგილის ერთ ვიზიტში მოთავსება ყველაზე ბუნებრივი მარშრუტია:
    ჯერ მონუმენტი, მერე ჩასვლა წყალთან. ზამთარშიც ღირს გავლა — წყალსაცავზე გადამფრენი ფრინველები ჩერდებიან
    და სანაპირო ცარიელი და მშვიდია.
  tip: >-
    ბანაობის სეზონი ივნისიდან სექტემბრამდე გრძელდება — წყალი ივლის-აგვისტოში ყველაზე თბილია. შესვლა სანაპიროზე
    უფასოა, ფასიანი მხოლოდ ჯინო პარადაისი და ცალკეული პლაჟ-კლუბებია. კვირას საღამოს დასავლეთი ნაპირი
    გადატვირთულია — დილით ან სამუშაო დღეს ჩადი. ჩრდილი პლაჟებზე ცოტაა, ქუდი და მზისგან დამცავი აუცილებელია.
    აღმოსავლეთ ნაპირზე ინფრასტრუქტურა არ არის — წყალი და საკვები თან წაიღე.
  route: >-
    ცენტრიდან ჯორჯ ბუშის ქუჩით ჩრდილო-აღმოსავლეთისკენ და მიმართულების ნიშნებით ზღვისკენ — სულ 15 კმ და
    20–25 წუთი, მთლიანად ასფალტი. ნებისმიერი კლასის მანქანა გამოდგება, ეკონომ-სედანიც. სანაპირო გზაზე
    პარკინგი პლაჟებთან და აკვაპარკთანაა. საქართველოს მატიანესთან შესახვევი იმავე გზიდანაა — ჯერ მონუმენტთან
    ასვლა და მერე წყალთან ჩასვლა ლოგიკური წრეა.
en:
  name: Tbilisi Sea
  short: An 11.6 km² reservoir on the city's northeastern edge — Tbilisi's main summer beach escape, with
    an aqua park and yacht club 25 minutes from the center.
  body: >-
    **The Tbilisi Sea is the city's main summer escape.** The 11.6 km² reservoir on the Iori Plateau at
    Tbilisi's northeastern edge was created in 1953, when the water of the Iori River was channeled into
    the basins of three former saline lakes. The scale genuinely feels maritime: the reservoir stretches
    almost 8.75 km end to end with an average depth of 26.6 metres — which is why Tbilisians call it a
    sea rather than a lake.


    In the hot months the western shore comes alive: sand-and-gravel beaches, shaded terraces, cafés and
    water attractions follow one another along the shore road. Here too are Gino Paradise — the city's
    biggest aqua park — and the yacht club, and the reservoir hosts windsurfing and open-water swimming
    events. The eastern shore is the opposite: wild, empty steppe, for anyone who wants space and quiet
    rather than facilities.


    On the hill above the northwestern shore towers the monumental Chronicle of Georgia, with the best
    view over the water and the whole city. Combining the two is the most natural itinerary: the monument
    first, then down to the shore. Even in winter the sea is worth a detour — migrating birds stop over
    on the water and the shoreline is empty and calm.
  tip: >-
    The swimming season runs June to September, with the warmest water in July and August. Access to the
    shore is free; only Gino Paradise and individual beach clubs charge. Sunday afternoons the western
    shore gets crowded — come in the morning or on a weekday. There is little natural shade on the beaches,
    so bring a hat and sunscreen. The eastern shore has no facilities at all — carry your own water and
    food.
  route: >-
    From the center head northeast along George Bush Street and follow the signs to the sea — about 15
    km and 20–25 minutes, asphalt the whole way. Any class of car will do, including an economy sedan.
    Parking is along the shore road by the beaches and the aqua park. The turn-off for the Chronicle of
    Georgia is on the same road — climbing to the monument first and then dropping to the water makes
    a natural loop.
ru:
  name: Тбилисское море
  short: Водохранилище площадью 11,6 км² на северо-восточной окраине города — главный летний пляж Тбилиси
    с аквапарком и яхт-клубом в 25 минутах от центра.
  body: >-
    **Тбилисское море — главное летнее спасение города.** Водохранилище площадью 11,6 км² на Иорском плато
    у северо-восточной окраины Тбилиси создали в 1953 году, направив воду реки Иори в котловины трёх бывших
    солёных озёр. Масштаб действительно морской: длина почти 8,75 км, средняя глубина 26,6 метра — потому
    тбилисцы и зовут его морем, а не озером.


    В жаркие месяцы западный берег оживает: песчано-галечные пляжи, навесы, кафе и водные аттракционы
    сменяют друг друга вдоль береговой дороги. Здесь же «Джино Парадайз» — крупнейший аквапарк города
    — и яхт-клуб; на водохранилище проводят соревнования по виндсёрфингу и плаванию на открытой воде.
    Восточный берег — полная противоположность: дикая пустая степь для тех, кому нужны простор и тишина,
    а не инфраструктура.


    На холме над северо-западным берегом возвышается монументальная Летопись Грузии — с лучшим видом на
    воду и весь город. Совместить оба места — самый естественный маршрут: сначала монумент, потом спуск
    к берегу. Даже зимой сюда стоит заехать: на воде останавливаются перелётные птицы, а берег пуст и
    спокоен.
  tip: >-
    Купальный сезон длится с июня по сентябрь, самая тёплая вода — в июле и августе. Вход на берег бесплатный;
    платные только «Джино Парадайз» и отдельные пляжные клубы. В воскресенье после обеда западный берег
    переполнен — приезжайте утром или в будний день. Тени на пляжах мало, берите головной убор и солнцезащитный
    крем. На восточном берегу инфраструктуры нет совсем — воду и еду везите с собой.
  route: >-
    Из центра на северо-восток по улице Джорджа Буша и далее по указателям к морю — около 15 км и 20–25
    минут, весь путь по асфальту. Подойдёт машина любого класса, включая эконом-седан. Парковка — вдоль
    береговой дороги у пляжей и аквапарка. Поворот к Летописи Грузии на той же дороге: сначала подняться
    к монументу, затем спуститься к воде — получается естественное кольцо.
fa:
  name: دریای تفلیس
  short: مخزنی به وسعت 11.6 کیلومتر مربع در حاشیهٔ شمال شرقی شهر — ساحل اصلی تابستانی تفلیس با پارک آبی
    و باشگاه قایقرانی، 25 دقیقه از مرکز.
  body: >-
    **دریای تفلیس گریزگاه اصلی تابستانی شهر است.** این مخزن 11.6 کیلومتر مربعی روی فلات ایوری در حاشیهٔ
    شمال شرقی تفلیس در سال 1953 ساخته شد، وقتی آب رود ایوری را به حوضچهٔ سه دریاچهٔ شور پیشین هدایت کردند.
    ابعادش واقعاً دریایی است: طول آن نزدیک به 8.75 کیلومتر و ژرفای میانگین آن 26.6 متر است — برای همین
    اهالی تفلیس آن را دریا می‌نامند نه دریاچه.


    در ماه‌های گرم، کرانهٔ غربی جان می‌گیرد: سواحل ماسه‌ای-شنی، سایه‌بان‌ها، کافه‌ها و تفریحات آبی در
    امتداد جادهٔ ساحلی پشت هم می‌آیند. «جینو پارادایز» — بزرگ‌ترین پارک آبی شهر — و باشگاه قایقرانی نیز
    همین‌جاست و روی آب مسابقات موج‌سواری بادی و شنای آب‌های آزاد برگزار می‌شود. کرانهٔ شرقی درست برعکس
    است: استپی وحشی و خالی برای کسانی که به‌جای امکانات، سکوت و فضا می‌خواهند.


    بر تپهٔ بالای کرانهٔ شمال غربی، بنای عظیم «تاریخ‌نگاشت گرجستان» سر برافراشته — با بهترین چشم‌انداز
    به آب و تمام شهر. ترکیب این دو، طبیعی‌ترین برنامه است: نخست بنای یادبود، سپس پایین رفتن تا کنار آب.
    حتی در زمستان هم سری زدن می‌ارزد: پرندگان مهاجر روی آب فرود می‌آیند و ساحل خلوت و آرام است.
  tip: >-
    فصل شنا از ژوئن تا سپتامبر است و گرم‌ترین آب در ژوئیه و اوت. ورود به ساحل رایگان است؛ فقط جینو پارادایز
    و برخی باشگاه‌های ساحلی پولی‌اند. یکشنبه بعدازظهر کرانهٔ غربی شلوغ می‌شود — صبح یا روزهای کاری بروید.
    سایهٔ طبیعی در ساحل کم است، کلاه و کرم ضدآفتاب همراه داشته باشید. کرانهٔ شرقی هیچ امکاناتی ندارد —
    آب و خوراک با خود ببرید.
  route: >-
    از مرکز شهر به سمت شمال شرق از خیابان جورج بوش بروید و تابلوهای دریا را دنبال کنید — حدود 15 کیلومتر
    و 20 تا 25 دقیقه، سراسر آسفالت. هر کلاس خودرویی کافی است، حتی سدان اقتصادی. پارکینگ در امتداد جادهٔ
    ساحلی کنار سواحل و پارک آبی است. جدایی راه «تاریخ‌نگاشت گرجستان» روی همین جاده است — اول بالا رفتن
    به بنای یادبود و بعد پایین آمدن تا آب، حلقه‌ای طبیعی می‌سازد.
he:
  name: ים טביליסי
  short: מאגר בשטח 11.6 קמ״ר בקצה הצפון-מזרחי של העיר — החוף הקיצי המרכזי של טביליסי, עם פארק מים ומועדון
    יאכטות 25 דקות מהמרכז.
  body: >-
    **ים טביליסי הוא המפלט הקיצי המרכזי של העיר.** המאגר בשטח 11.6 קמ״ר על רמת איורי, בקצה הצפון-מזרחי
    של טביליסי, נוצר ב-1953, כשמי נהר האיורי הוזרמו אל אגני שלושה אגמים מלוחים לשעבר. הממדים באמת ימיים:
    אורכו כמעט 8.75 ק״מ ועומקו הממוצע 26.6 מטר — ולכן תושבי טביליסי קוראים לו ים ולא אגם.


    בחודשים החמים החוף המערבי מתעורר לחיים: חופי חול וחצץ, סככות צל, בתי קפה ואטרקציות מים נמשכים זה אחר
    זה לאורך כביש החוף. כאן נמצאים גם ג'ינו פרדייז — פארק המים הגדול בעיר — ומועדון היאכטות, ועל המים
    נערכות תחרויות גלשני רוח ושחייה במים פתוחים. החוף המזרחי הוא ההפך הגמור: ערבה פראית וריקה, למי שמחפש
    מרחב ושקט ולא מתקנים.


    על הגבעה מעל החוף הצפון-מערבי מתנשאת אנדרטת כרוניקת גאורגיה המונומנטלית — עם התצפית הטובה ביותר על
    המים ועל העיר כולה. לשלב את שני המקומות זה המסלול הטבעי ביותר: קודם האנדרטה, אחר כך ירידה למים. גם
    בחורף שווה לעצור כאן — ציפורים נודדות חונות על המים והחוף ריק ורגוע.
  tip: >-
    עונת הרחצה נמשכת מיוני עד ספטמבר, והמים החמים ביותר ביולי ואוגוסט. הכניסה לחוף חינם; רק ג'ינו פרדייז
    ומועדוני חוף בודדים גובים תשלום. בימי ראשון אחר הצהריים החוף המערבי עמוס — בואו בבוקר או ביום חול.
    צל טבעי כמעט שאין על החופים, קחו כובע וקרם הגנה. בחוף המזרחי אין שום מתקנים — הביאו מים ואוכל משלכם.
  route: >-
    מהמרכז נוסעים צפון-מזרחה ברחוב ג'ורג' בוש ועוקבים אחרי השילוט לים — כ-15 ק״מ ו-20–25 דקות, אספלט לכל
    האורך. כל סוג רכב מתאים, כולל סדאן חסכוני. חניה לאורך כביש החוף ליד החופים ופארק המים. הפנייה לכרוניקת
    גאורגיה נמצאת על אותו כביש — לעלות קודם לאנדרטה ואז לרדת למים יוצר לולאה טבעית.
ar:
  name: بحر تبليسي
  short: خزان مساحته 11.6 كم² على الطرف الشمالي الشرقي للمدينة — شاطئ تبليسي الصيفي الرئيسي، بمدينة ألعاب
    مائية وناد لليخوت على بعد 25 دقيقة من المركز.
  body: >-
    **بحر تبليسي هو المتنفس الصيفي الرئيسي للمدينة.** أُنشئ هذا الخزان البالغة مساحته 11.6 كم² على هضبة
    إيوري عند الطرف الشمالي الشرقي لتبليسي عام 1953، حين حُوِّلت مياه نهر إيوري إلى أحواض ثلاث بحيرات
    مالحة سابقة. والمقياس بحري حقاً: يمتد الخزان نحو 8.75 كم بعمق متوسط قدره 26.6 متراً — ولهذا يسميه
    أهل تبليسي بحراً لا بحيرة.


    في الأشهر الحارة تدبّ الحياة في الشاطئ الغربي: شواطئ من رمل وحصى ومظلات ومقاهٍ وألعاب مائية تتوالى
    على طول طريق الساحل. وهنا أيضاً «جينو باراديس» — أكبر مدينة ألعاب مائية في المدينة — ونادي اليخوت،
    وتقام على الماء سباقات ركوب الأمواج الشراعي والسباحة في المياه المفتوحة. أما الشاطئ الشرقي فنقيض ذلك
    تماماً: سهب برّي خالٍ لمن يريد الرحابة والهدوء لا الخدمات.


    وعلى التل فوق الشاطئ الشمالي الغربي يشمخ نصب «سجلّ جورجيا» الضخم — بأفضل إطلالة على الماء والمدينة
    كلها. والجمع بين الموقعين هو المسار الأنسب: النصب أولاً ثم النزول إلى الماء. وحتى في الشتاء يستحق
    المكان زيارة — فالطيور المهاجرة تحطّ على الماء والشاطئ خالٍ هادئ.
  tip: >-
    موسم السباحة من يونيو إلى سبتمبر، وأدفأ ماء في يوليو وأغسطس. الدخول إلى الشاطئ مجاني؛ المدفوع فقط
    جينو باراديس وبعض أندية الشاطئ. بعد ظهر الأحد يزدحم الشاطئ الغربي — تعال صباحاً أو في يوم عمل. الظل
    الطبيعي قليل على الشواطئ، فخذ قبعة وواقياً من الشمس. لا خدمات إطلاقاً على الشاطئ الشرقي — احمل ماءك
    وطعامك معك.
  route: >-
    من المركز اتجه شمالاً شرقاً عبر شارع جورج بوش واتبع لافتات البحر — نحو 15 كم و20 إلى 25 دقيقة، أسفلت
    طوال الطريق. تكفي سيارة من أي فئة، حتى سيدان اقتصادية. المواقف على طول طريق الساحل قرب الشواطئ ومدينة
    الألعاب المائية. ومفترق «سجلّ جورجيا» على الطريق نفسه — الصعود إلى النصب أولاً ثم النزول إلى الماء
    يشكّل حلقة طبيعية.
