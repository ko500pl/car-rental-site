ka:
  name: თბილისის ზღვა
  short: >-
    1953 წლის წყალსაცავი სამი მლაშე ტბის ადგილას, ივრის ზეგანზე — თბილისის საზაფხულო პლაჟი, სასმელი წყლის
    წყარო და ნაპირები, სადაც სამი ათასი წლის წინ ცხოვრობდნენ.
  body: >-
    **თბილისს ზღვა არ ჰქონდა, ამიტომ 1953 წელს თავად გაიჩინა.** ქალაქის ჩრდილო-აღმოსავლეთ კიდეზე, ივრის
    ზეგანზე, მდინარე ივრის წყალი სამი მლაშე ტბის — ავლაბრის, ილგუნიანისა და კუკიის — ქვაბულებში ჩაუშვეს.
    ოფიციალურად ეს თბილისის, ანუ სამგორის, წყალსაცავია, მაგრამ „ზღვა“ ჯერ კიდევ 1950-იან წლებში შეარქვეს
    და ასე შერჩა. ქარიან დღეს, როცა ნაპირს ტალღები ეხეთქება, ამ სახელს სავსებით იმსახურებს: დაახლოებით
    9 კმ სიგრძისაა, 2 კმ-მდე სიგანის, საპროექტო დონისას საშუალო სიღრმე 26,6 მეტრია, უდიდესი — 45.


    ეს სამუშაო წყალია და არა საფოსტო ბარათი. წყალსაცავი სამგორის სარწყავ სისტემას კვებავს და დედაქალაქს
    სასმელი წყლის ნაწილს აწვდის — 1985 წლიდან, ჟინვალის წყალსაცავის ამუშავების შემდეგ, უმეტესად არაგვის
    წყლით. ამიტომაც სუნთქავს მისი დონე წელიწადის დროებთან ერთად: გაზაფხულზე მატულობს, ზაფხულსა და შემოდგომაზე
    კი, როცა ქვემოთ მინდვრებს წყალი სწყურიათ, 7–10 მეტრით იკლებს.


    კეთილმოწყობილია ჩრდილოეთი და სამხრეთ-დასავლეთი ნაპირები: პლაჟები, იახტკლუბი და „ჯინო პარადაისი“ —
    აკვაპარკი ღია და დახურული აუზებით. სხვაგან ნაპირი შიშველ, ტალღოვან გორაკებად იშლება. ვარკეთილის მხარეს
    1950-იანი წლების ორი ობელისკი წყალსაცავის გახსნას იხსენებს, წყლის თავზე, გორაზე, კი ზურაბ წერეთლის
    „საქართველოს მატიანე“ თავის თექვსმეტ ბრინჯაოს სვეტს ცისკენ აღმართავს.


    ხალხი აქ ინჟინრებამდე დიდი ხნით ადრეც ცხოვრობდა. ჩრდილო-აღმოსავლეთ ნაპირზე არქეოლოგებმა გვიანი ბრინჯაოსა
    და ადრეული რკინის ხანის ნასახლარი და მისი სამაროვანი მიაკვლიეს, სამხრეთ-დასავლეთ ნაპირზე კი — ყორღანები.
    ზღვა ახალგაზრდაა; ნაპირი — სამი ათასი წლისა.
  tip: >-
    საბანაო სეზონი, დაახლოებით, ივნისიდან სექტემბრამდე გრძელდება. ყველაზე თბილი აგვისტოა — ნაპირთან წყლის
    საშუალო ტემპერატურა მაშინ 21,6 °C-ს აღწევს. სანაპიროს უმეტესი ნაწილი უფასოა, ფასიანია მხოლოდ „ჯინო
    პარადაისი“ და კერძო პლაჟ-კლუბები. პლაჟებზე ჩრდილი ცოტაა — ქუდი, მზისგან დამცავი კრემი და ბევრი წყალი
    თან იქონიეთ. ზაფხულის შაბათ-კვირის შუადღეებში კეთილმოწყობილი ნაპირები გადატვირთულია, ამიტომ დილით
    ან სამუშაო დღეს ჩადით. ქარი ტალღას სწრაფად აყენებს: ნაპირთან ახლოს იცურავეთ და უკაცრიელ ნაპირზე მარტო
    წყალში არასოდეს შეხვიდეთ. ზაფხულის ბოლოს, როცა დონე იკლებს, წყლამდე ფართო შიშველი ზოლის გავლა მოგიწევთ.
  route: >-
    თავისუფლების მოედნიდან მტკვარზე ბარათაშვილის ხიდით გადადით და მარცხენა სანაპიროს ჩრდილოეთისკენ გაჰყევით
    (შემდეგ კოსმონავტების სანაპიროდ იქცევა), მერე აღმოსავლეთისკენ აუხვიეთ, საცხოვრებელი ქუჩების გავლით
    შანავას ქუჩაზე გადით და მას წყლამდე ჩაჰყევით. სულ დაახლოებით 19 კმ-ია: თავისუფალ გზაზე 25 წუთი, პიკის
    საათებში ან ცხელ ზაფხულის კვირადღეს — 35–40. გზა მთლიანად ასფალტია, ნებისმიერი ეკონომკლასის მანქანა
    გამოდგება. მანქანას სანაპირო გზაზე, პლაჟებთან და აკვაპარკთან გააჩერებთ. „საქართველოს მატიანე“ ჩრდილო-დასავლეთი
    ნაპირის ზემოთ, გორაზე დგას: ჯერ ხედისთვის იქ ადით, მერე კი საბანაოდ ჩადით.
en:
  name: Tbilisi Sea
  short: >-
    A 1953 reservoir that drowned three salt lakes on the Iori Plateau: Tbilisi's summer beach, a working
    water supply and shores settled 3,000 years ago.
  body: >-
    **Tbilisi had no coast, so in 1953 it made itself a sea.** On the Iori Plateau, at the city's north-eastern
    edge, engineers channelled water from the Iori River into the basins of three salt lakes: Avlabari,
    Ilguniani and Kukia. Officially it is the Tbilisi, or Samgori, Reservoir, but people were calling
    it a sea by the 1950s and the name stuck. On a windy day, when waves run at the shore, it earns it:
    some 9 km long and up to 2 km wide and, at its full design level, 26.6 metres deep on average and
    45 at its deepest.


    This is working water, not a postcard. The reservoir feeds the Samgori irrigation system and supplies
    part of the capital's drinking water; since the Zhinvali reservoir came into service in 1985, most
    of that water has come from the Aragvi. So the level breathes with the seasons, rising in spring and
    falling by 7 to 10 metres through summer and autumn, when the fields below are thirsty.


    The northern and south-western shores are the developed ones, with beaches, a yacht club and Gino
    Paradise, an aqua park with indoor and open-air pools. Elsewhere the banks run out into bare, rolling
    hills. On the Varketili side, two obelisks from the 1950s mark the opening of the reservoir, and on
    a hill above the water Zurab Tsereteli's Chronicle of Georgia lifts its sixteen bronze pillars against
    the sky.


    People were here long before the engineers. On the north-eastern shore, archaeologists have found
    a Late Bronze to Early Iron Age settlement and its cemetery, and burial mounds on the south-western
    shore. The sea is young; the shore is some three thousand years old.
  tip: >-
    The swimming season runs roughly from June to September. August is the warmest month, with the water
    near the shore averaging about 21.6°C. Most of the shoreline is free; Gino Paradise and private beach
    clubs charge. Shade on the beaches is scarce, so bring a hat, sunscreen and plenty of water. Summer
    weekend afternoons crowd the developed shores, so come in the morning or on a weekday. Wind can raise
    waves quickly: swim close to shore and never alone on the empty banks. By late summer the falling
    water can leave a wide strip of bare bank.
  route: >-
    From Freedom Square cross the Mtkvari by the Baratashvili bridge and follow the left-bank embankment
    north (it becomes Kosmonavtebi Embankment), then turn east and wind through the residential streets
    to Shanava Street, which carries you down to the water. That is about 19 km: 25 minutes in light traffic,
    35–40 at rush hour or on a hot summer Sunday. It is asphalt all the way, and any economy car will
    do. Park along the shore road by the beaches and the aqua park. The Chronicle of Georgia stands on
    a hill above the north-western shore: go up first for the view, then drive down to swim.
ru:
  name: Тбилисское море
  short: >-
    Водохранилище 1953 года, поглотившее три солёных озера на Иорском плато: летний пляж Тбилиси, рабочий
    источник воды и берега, заселённые три тысячи лет назад.
  body: >-
    **У Тбилиси не было побережья — и в 1953 году город сделал себе море.** На Иорском плато, у северо-восточной
    окраины, инженеры направили воду реки Иори в котловины трёх солёных озёр — Авлабари, Илгуниани и Кукия.
    Официально это Тбилисское, или Самгорское, водохранилище, но морем его звали уже в 1950-е, и имя прижилось.
    В ветреный день, когда на берег бегут волны, оно его оправдывает: около 9 км в длину и до 2 км в ширину,
    при проектном уровне средняя глубина 26,6 метра, наибольшая — 45.


    Это рабочая вода, а не открытка. Водохранилище питает Самгорскую оросительную систему и снабжает часть
    столицы питьевой водой; с тех пор как в 1985 году заработало Жинвальское водохранилище, бо́льшая часть
    этой воды приходит из Арагви. Поэтому уровень дышит вместе с сезонами: весной поднимается, а летом
    и осенью, когда поля внизу просят пить, падает на 7–10 метров.


    Обжиты северный и юго-западный берега: пляжи, яхт-клуб и «Джино Парадайз» — аквапарк с крытыми и открытыми
    бассейнами. В остальных местах берега уходят в голые волнистые холмы. Со стороны Варкетили два обелиска
    1950-х годов отмечают открытие водохранилища, а на холме над водой шестнадцать бронзовых столпов «Летописи
    Грузии» Зураба Церетели поднимаются в небо.


    Люди жили здесь задолго до инженеров. На северо-восточном берегу археологи нашли поселение эпохи поздней
    бронзы — раннего железа и его могильник, а на юго-западном — курганы. Море молодо; берегу же около
    трёх тысяч лет.
  tip: >-
    Купальный сезон длится примерно с июня по сентябрь. Самый тёплый месяц — август: вода у берега в среднем
    около 21,6 °C. Бо́льшая часть берега бесплатна; платные — «Джино Парадайз» и частные пляжные клубы.
    Тени на пляжах мало, так что берите шляпу, солнцезащитный крем и побольше воды. В летние выходные
    после обеда обжитые берега переполнены — приезжайте утром или в будни. Ветер быстро поднимает волну:
    плавайте недалеко от берега и никогда не купайтесь в одиночку у пустынных берегов. К концу лета отступившая
    вода может обнажить широкую полосу голого берега.
  route: >-
    От площади Свободы переезжайте Мтквари по мосту Бараташвили и держите на север по левобережной набережной
    (дальше она становится набережной Космонавтов), затем сверните на восток и петляйте по жилым кварталам
    до улицы Шанава, которая и спустит вас к воде. Всего около 19 км: 25 минут при свободных дорогах,
    35–40 — в час пик или жарким летним воскресеньем. Асфальт на всём пути, подойдёт любая машина эконом-класса.
    Парковаться можно вдоль береговой дороги у пляжей и аквапарка. «Летопись Грузии» стоит на холме над
    северо-западным берегом: сначала поднимитесь туда ради вида, а потом спускайтесь купаться.
fa:
  name: دریای تفلیس
  short: >-
    مخزنی از ۱۹۵۳ که سه دریاچهٔ نمک فلات ایوری را در خود فرو برد: پلاژ تابستانی تفلیس، منبع آبی فعال،
    و کرانه‌هایی که سه هزار سال پیش مسکون بودند.
  body: >-
    **تفلیس ساحل نداشت؛ پس در ۱۹۵۳ برای خودش دریا ساخت.** در فلات ایوری، در لبهٔ شمال‌شرقی شهر، مهندسان
    آب رود ایوری را به گودال‌های سه دریاچهٔ نمک روانه کردند: آولابری، ایلگونیانی و کوکیا. نام رسمی‌اش
    مخزن تفلیس یا سامگوری است، اما مردم از همان دههٔ ۱۹۵۰ آن را دریا می‌خواندند و این نام ماندگار شد.
    در روزهای بادی، وقتی موج‌ها به سوی ساحل می‌دوند، سزاوار این نام است: حدود ۹ کیلومتر درازا و تا ۲ کیلومتر
    پهنا دارد، و در تراز طراحی‌شده، ژرفای میانگینش ۲۶٫۶ متر و بیشینه‌اش ۴۵ متر است.


    این آبی است که کار می‌کند، نه کارت‌پستال. مخزن شبکهٔ آبیاری سامگوری را سیراب می‌کند و بخشی از آب آشامیدنی
    پایتخت را تأمین می‌کند؛ از زمانی که مخزن ژینوالی در ۱۹۸۵ به کار افتاد، بیشتر این آب از رود آراگوی
    می‌آید. از این رو سطح آب با فصل‌ها نفس می‌کشد: در بهار بالا می‌آید و در تابستان و پاییز، که کشتزارهای
    پایین‌دست تشنه‌اند، ۷ تا ۱۰ متر پایین می‌رود.


    کرانه‌های شمالی و جنوب‌غربی آبادند: پلاژها، باشگاه قایق‌های بادبانی و جینو پارادایس، پارک آبی با استخرهای
    سرپوشیده و روباز. جاهای دیگر کرانه به تپه‌ماهورهای برهنه و موج‌دار می‌رسد. در سمت وارکتیلی دو اوبلیسک
    از دههٔ ۱۹۵۰ یادآور گشایش مخزن‌اند، و بر تپه‌ای بالای آب، «وقایع‌نامهٔ گرجستان» اثر زوراب تسرتلی شانزده
    ستون مفرغی‌اش را رو به آسمان برافراشته است.


    مردم مدت‌ها پیش از مهندسان این‌جا بودند. باستان‌شناسان در کرانهٔ شمال‌شرقی سکونتگاهی از اواخر عصر
    مفرغ تا اوایل عصر آهن و گورستان آن را یافته‌اند، و در کرانهٔ جنوب‌غربی گورپشته‌هایی را. دریا جوان
    است؛ کرانه حدود سه هزار سال عمر دارد.
  tip: >-
    فصل شنا کمابیش از ژوئن تا سپتامبر است. گرم‌ترین ماه اوت است و دمای آب نزدیک ساحل در آن به‌طور میانگین
    حدود ۲۱٫۶ درجهٔ سانتی‌گراد است. بیشتر ساحل رایگان است؛ جینو پارادایس و باشگاه‌های ساحلی خصوصی ورودیه
    می‌گیرند. سایه در پلاژها کم است، پس کلاه، کرم ضدآفتاب و آب فراوان همراه داشته باشید. بعدازظهرهای آخر
    هفته در تابستان کرانه‌های آباد شلوغ می‌شوند؛ صبح یا در روزهای کاری بیایید. باد می‌تواند به‌سرعت موج
    برپا کند: نزدیک ساحل شنا کنید و هرگز در کرانه‌های خلوت تنها به آب نزنید. در اواخر تابستان پایین رفتن
    آب ممکن است نواری پهن از کرانهٔ برهنه به جا بگذارد.
  route: >-
    از میدان آزادی با پل باراتاشویلی از رود متکواری بگذرید و خیابان ساحلی کرانهٔ چپ را به سوی شمال دنبال
    کنید (که در ادامه خیابان ساحلی کوسموناوتبی نام می‌گیرد)، سپس به سمت شرق بپیچید و از میان خیابان‌های
    مسکونی پیچ‌وتاب بخورید تا به خیابان شاناوا برسید که شما را تا کنار آب پایین می‌برد. روی‌هم حدود ۱۹
    کیلومتر: ۲۵ دقیقه در ترافیک سبک، و ۳۵ تا ۴۰ دقیقه در ساعت شلوغی یا در یک یکشنبهٔ داغ تابستانی. تمام
    راه آسفالت است و هر خودروی اقتصادی کافی است. در امتداد جادهٔ ساحلی کنار پلاژها و پارک آبی پارک کنید.
    «وقایع‌نامهٔ گرجستان» بر تپه‌ای بالای کرانهٔ شمال‌غربی ایستاده است: اول برای تماشای منظره بالا بروید،
    بعد برای شنا پایین بیایید.
he:
  name: הים של טביליסי
  short: >-
    מאגר משנת 1953 שבלע שלושה אגמי מלח ברמת איורי: חוף הקיץ של טביליסי, מקור מים פעיל וגדות שיושבו לפני
    שלושת אלפים שנה.
  body: >-
    **לטביליסי לא היה חוף, אז ב-1953 היא עשתה לעצמה ים.** ברמת איורי, בקצה הצפון-מזרחי של העיר, הטו מהנדסים
    מים מנהר איורי אל האגנים של שלושה אגמי מלח: אבלברי, אילגוניאני וקוקיה. רשמית זהו מאגר טביליסי, או
    מאגר סמגורי, אבל כבר בשנות ה-50 קראו לו אנשים ים, והשם דבק. ביום של רוח, כשגלים רצים אל החוף, הוא
    מצדיק את שמו: אורכו כ-9 ק״מ ורוחבו עד 2 ק״מ, ובמפלס התכנוני המלא עומקו הממוצע 26.6 מטרים ועומקו המרבי
    45.


    אלה מים עובדים, לא גלויה. המאגר מזין את מערכת ההשקיה של סמגורי ומספק חלק ממי השתייה של הבירה; מאז
    שמאגר ז'ינוואלי נכנס לשימוש ב-1985, רוב המים האלה מגיעים מנהר אראגווי. לכן המפלס נושם עם העונות: עולה
    באביב ויורד ב-7 עד 10 מטרים במהלך הקיץ והסתיו, כשהשדות שלמטה צמאים.


    הגדות הצפונית והדרום-מערבית הן המפותחות, עם חופי רחצה, מועדון יאכטות וג'ינו פרדייס — פארק מים עם בריכות
    מקורות ופתוחות. במקומות אחרים הגדות נמשכות אל גבעות חשופות וגליות. בצד של וארקטילי מציינים שני אובליסקים
    משנות ה-50 את פתיחת המאגר, ועל גבעה מעל המים מתנשאים אל השמיים שישה-עשר עמודי הברונזה של "כרוניקת
    גאורגיה" מאת זוראב צרתלי.


    אנשים היו כאן הרבה לפני המהנדסים. בגדה הצפון-מזרחית מצאו ארכאולוגים יישוב מתקופת הברונזה המאוחרת עד
    תקופת הברזל הקדומה ואת בית הקברות שלו, ובגדה הדרום-מערבית — תלי קבורה. הים צעיר; החוף בן כשלושת אלפים
    שנה.
  tip: >-
    עונת הרחצה נמשכת בערך מיוני עד ספטמבר. אוגוסט הוא החודש החם ביותר, וטמפרטורת המים ליד החוף בו היא
    בממוצע כ-21.6°C. רוב קו החוף פתוח בחינם; ג'ינו פרדייס ומועדוני החוף הפרטיים גובים תשלום. צל בחופים
    יש מעט, אז הביאו כובע, קרם הגנה והרבה מים. בקיץ, אחר הצהריים בסופי שבוע, הגדות המפותחות עמוסות, אז
    באו בבוקר או באמצע השבוע. הרוח יכולה להרים גלים במהירות: שחו קרוב לחוף ולעולם אל תשחו לבד ליד הגדות
    הריקות. לקראת סוף הקיץ המים הנסוגים עלולים להשאיר רצועה רחבה של גדה חשופה.
  route: >-
    מכיכר החירות חצו את המטקוורי בגשר ברטשווילי והמשיכו צפונה בכביש הטיילת של הגדה השמאלית (בהמשך הוא
    נקרא טיילת קוסמונבטבי), ואז פנו מזרחה והתפתלו בין רחובות המגורים עד רחוב שנאווה, שמוריד אתכם אל המים.
    בסך הכול כ-19 ק״מ: 25 דקות בתנועה דלילה, 35–40 בשעת העומס או ביום ראשון חם של קיץ. אספלט כל הדרך,
    וכל רכב חסכוני יתאים. חנו לאורך כביש החוף ליד חופי הרחצה ופארק המים. "כרוניקת גאורגיה" ניצבת על גבעה
    מעל הגדה הצפון-מערבית: עלו אליה קודם בשביל הנוף, ואז רדו לשחות.
ar:
  name: بحر تبليسي
  short: >-
    خزان مائي أُنشئ عام 1953 فابتلع ثلاث بحيرات مالحة على هضبة إيوري: شاطئ تبليسي الصيفي، ومصدر مياه ما
    زال في الخدمة، وضفاف سكنها البشر قبل ثلاثة آلاف عام.
  body: >-
    **لم يكن لتبليسي ساحل، فصنعت لنفسها بحراً عام 1953.** على هضبة إيوري، عند الطرف الشمالي الشرقي للمدينة،
    حوّل المهندسون مياه نهر إيوري إلى أحواض ثلاث بحيرات مالحة: أفلاباري وإيلغونياني وكوكيا. اسمه الرسمي
    خزان تبليسي أو خزان سامغوري، لكن الناس كانوا يسمّونه بحراً منذ خمسينيات القرن العشرين، فثبت الاسم.
    وفي يوم تشتد فيه الريح، حين تركض الأمواج نحو الشاطئ، يستحق هذا الاسم: فطوله نحو 9 كم، ويصل عرضه إلى
    2 كم، وعند منسوبه التصميمي الكامل يبلغ متوسط عمقه 26.6 متراً وأقصى عمقه 45 متراً.


    إنه ماء للعمل لا للبطاقات البريدية. يغذّي الخزان شبكة سامغوري للري ويمدّ جزءاً من العاصمة بمياه الشرب؛
    ومنذ دخول خزان جينفالي الخدمة عام 1985 صار معظم هذا الماء يأتي من نهر أراغفي. لذلك يتنفس منسوبه مع
    الفصول: يرتفع في الربيع، وينخفض بين 7 و10 أمتار خلال الصيف والخريف حين تعطش الحقول في الأسفل.


    والضفتان الشمالية والجنوبية الغربية هما العامرتان، ففيهما الشواطئ ونادٍ لليخوت وجينو بارادايس، وهي
    مدينة ألعاب مائية فيها مسابح مغطاة وأخرى مكشوفة. أما في سائر المواضع فتمتد الضفاف إلى تلال جرداء متموجة.
    وعلى جانب فاركيتيلي تخلّد مسلّتان من خمسينيات القرن العشرين افتتاح الخزان، وعلى تلة فوق الماء يرفع
    نصب «سجلّ جورجيا» لزوراب تسيريتيلي أعمدته البرونزية الستة عشر نحو السماء.


    وقد سكن الناس هنا قبل المهندسين بزمن طويل. فعلى الضفة الشمالية الشرقية عثر علماء الآثار على مستوطنة
    تعود إلى أواخر العصر البرونزي وبدايات العصر الحديدي مع مقبرتها، وعلى الضفة الجنوبية الغربية على تلال
    دفن. البحر فتيّ، أما الشاطئ فعمره نحو ثلاثة آلاف عام.
  tip: >-
    يمتد موسم السباحة تقريباً من يونيو إلى سبتمبر. أغسطس أدفأ الشهور، ويبلغ متوسط حرارة الماء قرب الشاطئ
    فيه نحو 21.6 درجة مئوية. معظم الشاطئ مجاني، أما جينو بارادايس ونوادي الشاطئ الخاصة فبرسوم. الظل على
    الشواطئ شحيح، فاحمل قبعة وواقياً من الشمس وماءً وفيراً. وتزدحم الضفاف العامرة بعد ظهر عطلات نهاية
    الأسبوع صيفاً، فتعالَ صباحاً أو في يوم عمل. قد ترفع الريح الأمواج بسرعة، فاسبح قريباً من الشاطئ ولا
    تسبح وحدك أبداً عند الضفاف الخالية. ومع أواخر الصيف قد يخلّف انحسار الماء شريطاً عريضاً من الضفة العارية.
  route: >-
    من ميدان الحرية اعبر نهر متكفاري على جسر باراتاشفيلي، واتبع كورنيش الضفة اليسرى شمالاً (ويصبح اسمه
    لاحقاً كورنيش كوسمونافتيبي)، ثم انعطف شرقاً وتعرّج بين شوارع الأحياء السكنية حتى شارع شانافا الذي
    ينزل بك إلى الماء. المسافة نحو 19 كم: 25 دقيقة في حركة مرور خفيفة، و35–40 في ساعة الذروة أو في يوم
    أحد صيفي حار. الطريق مرصوف بالإسفلت على طوله، وتكفي أي سيارة اقتصادية. اركن على امتداد الطريق الساحلي
    قرب الشواطئ ومدينة الألعاب المائية. ويقف «سجلّ جورجيا» على تلة فوق الضفة الشمالية الغربية: اصعد إليه
    أولاً من أجل المشهد، ثم انزل للسباحة.
