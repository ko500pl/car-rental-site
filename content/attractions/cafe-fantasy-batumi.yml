ka:
  name: კაფე „ფანტაზია“ (რვაფეხა)
  short: >-
    ბათუმის 1975 წლის „რვაფეხა“: მოზაიკით შემოსილი რკინის გარსი ზღვისპირას — 2000 წელს მიტოვებული, ქალაქის
    მიერ დაცული და 2020 წლიდან ძეგლი.
  body: >-
    **1975 წელს საბჭოთა ზღვისპირა ქალაქს რვაფეხა გაუჩნდა: რვა შედუღებული რკინის ფეხი, რვა თაღოვანი ღიობი
    და მოზაიკის დელფინებით დაფარული კანი — ბათუმი მასზე კამათობდა, მიატოვა, მისთვის იბრძოლა და ბოლოს დაიცვა.**


    კაფე „ფანტაზია“, ანუ, როგორც მას ბათუმში ყველა ეძახის, „რვაფეხა“, ზღვისპირა ბულვარზე, შოთა რუსთაველის
    სახელმწიფო უნივერსიტეტის გვერდით დგას. იგი არქიტექტორმა გიორგი ჩახავამ და თბილისის სახელმწიფო სამხატვრო
    აკადემიის პროფესორმა ზურაბ კაპანაძემ დააპროექტეს; ჯგუფში იყვნენ არქიტექტორი ზურაბ ჯალაღონია და სატირული
    ჟურნალ „ნიანგის“ მთავარი მხატვარი ნოდარ მალაზონია, კონსტრუქცია კი საგზაო ინჟინერმა პაატა დობორჯგინიძემ
    გათვალა. მშენებლობას რვა თვე დასჭირდა.


    ინჟინერია იმაზე თამამია, ვიდრე ერთი შეხედვით ჩანს. რკინის კარკასი ადგილზე მოხარეს, შეკრეს და შეადუღეს
    ორმაგ, ბადისებრ გარსად, შემდეგ ბადით დაფარეს, გალესეს და ლენინგრადში დაპატენტებული ტექნოლოგიით დამზადებული
    ფერადი სმალტით მოაპირკეთეს. გარსი შიგნით ღრუა და თავის ზომასთან შედარებით თხელი: ამიტომ ჩანს ასე მსუბუქად
    და ამიტომვე აღმოჩნდა მისი გადატანა პრაქტიკულად შეუძლებელი. ზედაპირზე დელფინები — ბათუმის სიმბოლო —
    ზღვის ცხენებთან, ზღვის ვარსკვლავებთან და ფერად თევზებთან ერთად დაცურავენ. აღფრთოვანებულები მას ხშირად
    გაუდის ბარსელონურ პარკ გუელს ადარებენ.


    საბჭოთა წლებში აქ ახლად მოხარშულ ყავას, ნაყინსა და გამაგრილებელ სასმელებს ყიდდნენ, ღამის ათ საათზე
    კი კაფე ყოველდღე იკეტებოდა: ახლოს გადიოდა საბჭოთა კავშირისა და ნატოს წევრი თურქეთის მკაცრად დაცული
    საზღვარი. 2000 წელს „რვაფეხამ“ მუშაობა შეწყვიტა და წლობით მიტოვებული იდგა; ბათუმელები ჩამოცვენილ სმალტს
    სამახსოვროდ აგროვებდნენ. როცა მოპირდაპირე მხარეს „ჰილტონი“ აშენდა, ხელმოწერები შეგროვდა, 2014 წლის
    დეკემბერში კი სასტუმრომ და დეველოპერმა ერთობლივად განაცხადეს, რომ „ფანტაზიის“ დანგრევას არასდროს აპირებდნენ.
    რესტავრაცია 2018 წელს დაიწყო; 2019 წლის 14 აგვისტოს „რვაფეხა“ ხელახლა გაიხსნა, 2020 წლის 27 ივლისს
    კი აჭარის კულტურული მემკვიდრეობის დაცვის სააგენტომ მას უძრავი კულტურული მემკვიდრეობის ძეგლის სტატუსი
    მიანიჭა.


    ნაყინის გასაყიდად აგებულმა პავილიონმა ბოლოს ბათუმს თავად დაანახა, რისი შენარჩუნება სურდა.
  tip: >-
    „რვაფეხის“ ნახვა უფასოა და ნებისმიერ საათზეა შესაძლებელი; მუშაობს თუ არა შიგნით კაფე, ადგილზე გაარკვიეთ
    და გეგმას ამაზე ნუ ააგებთ. სუფთა, უხალხო კადრისთვის დილით ადრე მოდით, ან მზის ჩასვლისას, როცა დახრილი
    სხივი მოზაიკას აალაპლაპებს. შენობაზე ნუ აძვრებით და სმალტს ნუ აფხაჭნით: გარსი თხელია, თანაც ეს დაცული
    ძეგლია. მანქანა სასტუმროსთან დატოვეთ და ბულვარით ფეხით მოდით — ანბანის კოშკიდან დაახლოებით ერთი კილომეტრია.
    ირგვლივ კაფეები და საზოგადოებრივი ტუალეტები ბულვარზე უხვადაა.
  route: >-
    თბილისიდან ს1-ით (E60) დასავლეთით იარეთ, ქუთაისის გავლით სამტრედიამდე, იქიდან ს12-ით (E692) ლანჩხუთის
    გავლით გრიგოლეთამდე, შემდეგ კი ს2-ით (E70) სამხრეთით, ქობულეთის გავლით, ბათუმამდე: 371 კილომეტრი და
    დაახლოებით 5 საათი და 30 წუთი, ბოლომდე ასფალტზე. „რვაფეხა“ ზღვისპირა ბულვარზე, შოთა რუსთაველის სახელმწიფო
    უნივერსიტეტთან, სასტუმრო „ჰილტონის“ პირდაპირ დგას. მიმდებარე ქუჩებში პარკირება ფასიანია, როგორც წესი,
    მობილური აპლიკაციით ან SMS-ით, ზაფხულში კი ადგილი ძნელად იშოვება, ამიტომ, თუ შეგიძლიათ, მანქანა სასტუმროსთან
    დატოვეთ. საწვავი მთელ გზაზეა. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Cafe Fantasy (The Octopus)
  short: >-
    Batumi's 1975 'Octopus': a mosaic-clad iron gridshell on the seafront, abandoned in 2000, defended
    by the city and listed as a monument in 2020.
  body: >-
    **In 1975 a Soviet seaside town acquired an octopus: eight welded-iron arms, eight arched openings
    and a skin of mosaic dolphins, which Batumi then argued over, abandoned, fought for and finally protected.**


    Café Fantasy, known to everyone in Batumi simply as the Octopus (rvapekha), stands on the seafront
    boulevard beside Shota Rustaveli State University. It was designed by the architect George Chakhava
    and Zurab Kapanadze, professor at the Tbilisi State Academy of Arts, with the architect Zurab Jalaghonia,
    Nodar Malazonia, chief illustrator of the satirical magazine Niangi, and the road engineer Paata Doborjginidze,
    who worked out the structure. It took eight months to build.


    The engineering is bolder than it looks. The iron frame was bent, pulled together and welded on site
    into a double-shell, or gridshell, structure, then wrapped in mesh, plastered and faced with coloured
    glass tesserae made by a process patented in Leningrad. The shell is hollow and thin for its size,
    which is why it looks so light, and why moving it proved all but impossible. Dolphins, the emblem
    of Batumi, swim across it with seahorses, starfish and bright fish. Admirers reach for Gaudí's Park
    Güell.


    In Soviet years it sold fresh coffee, ice cream and soft drinks, and shut at 10 pm every night because
    the closely guarded border with Turkey, a NATO member, lay just down the coast. It closed in 2000
    and stood derelict; locals pocketed fallen tesserae as keepsakes. When the Hilton rose opposite, petitions
    circulated, and in December 2014 the hotel and its developer declared that they had never meant to
    demolish it. Restoration began in 2018, the Octopus reopened on 14 August 2019, and on 27 July 2020
    Adjara's heritage agency listed it as an immovable cultural monument.


    Built to sell ice cream, it ended up showing a city what it wanted to keep.
  tip: >-
    Seeing the Octopus is free at any hour; whether the café inside is serving when you pass is worth
    checking on the spot rather than planning around. Come early in the morning for clean photographs
    without crowds, or at sunset, when the low light sets the mosaic glinting. Do not climb on it or pick
    at the tesserae: the shell is thin and it is a listed monument. Leave the car at your hotel and walk
    along the boulevard; the Alphabetic Tower is about a kilometre away. Cafés and public toilets are
    plentiful along the seafront.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, the S12 (E692) through Lanchkhuti to
    Grigoleti, and the S2 (E70) south through Kobuleti into Batumi: 371 km and about 5 hours 30 minutes,
    asphalt all the way. The Octopus stands on the seafront boulevard by Shota Rustaveli State University,
    opposite the Hilton Batumi. Parking on the surrounding streets is paid, usually through a phone app
    or by SMS, and spaces are scarce in summer, so leave the car at your hotel if you can. Fuel is easy
    to find along the whole route. An economy car is all you need.
ru:
  name: Кафе «Фантазия» («Осьминог»)
  short: >-
    Батумский «Осьминог» 1975 года: железная сетчатая оболочка в мозаике на набережной, заброшенная в
    2000-м, отстоянная городом и признанная памятником в 2020-м.
  body: >-
    **В 1975 году советский курортный город обзавёлся осьминогом: восемь сварных железных щупалец, восемь
    арочных проёмов и шкура из мозаичных дельфинов. Потом Батуми о нём спорил, бросил его, боролся за
    него и наконец взял под защиту.**


    Кафе «Фантазия», которое все в Батуми зовут просто «Осьминогом» (рвапеха), стоит на приморском бульваре
    рядом с Государственным университетом имени Шота Руставели. Его спроектировали архитектор Георгий
    Чахава и Зураб Капанадзе, профессор Тбилисской государственной академии художеств, вместе с архитектором
    Зурабом Джалагонией, Нодаром Малазонией, главным художником сатирического журнала «Нианги», и инженером-дорожником
    Паатой Доборджгинидзе, который рассчитал конструкцию. Построили его за восемь месяцев.


    Инженерная мысль здесь смелее, чем кажется. Железный каркас гнули, стягивали и сваривали прямо на
    месте в двойную сетчатую оболочку, затем обтягивали сеткой, штукатурили и облицовывали цветной стеклянной
    смальтой, изготовленной по технологии, запатентованной в Ленинграде. Оболочка полая и для своих размеров
    тонкая — поэтому она кажется такой лёгкой и поэтому же перенести её оказалось почти невозможно. По
    ней плывут дельфины, эмблема Батуми, а с ними морские коньки, морские звёзды и яркие рыбы. Поклонники
    вспоминают парк Гуэль Гауди.


    В советские годы здесь продавали свежий кофе, мороженое и прохладительные напитки и каждый вечер закрывались
    в 10 часов: чуть дальше по побережью проходила строго охраняемая граница с Турцией, членом НАТО. В
    2000 году кафе закрылось и пришло в запустение; местные уносили осыпавшиеся кусочки смальты на память.
    Когда напротив вырос «Хилтон», по городу пошли петиции, и в декабре 2014 года отель и его девелопер
    заявили, что никогда не собирались сносить «Осьминога». Реставрация началась в 2018 году, 14 августа
    2019 года «Осьминог» открылся вновь, а 27 июля 2020 года агентство культурного наследия Аджарии внесло
    его в список недвижимых памятников культуры.


    Построенный, чтобы продавать мороженое, он в итоге показал городу, что тот хочет сохранить.
  tip: >-
    Посмотреть на «Осьминога» можно бесплатно в любое время; работает ли кафе внутри, лучше выяснить на
    месте, а не строить на этом планы. Приходите рано утром за чистыми кадрами без толпы или на закате,
    когда низкое солнце зажигает в мозаике блики. Не залезайте на него и не отковыривайте смальту: оболочка
    тонкая, а сооружение — охраняемый памятник. Оставьте машину у отеля и пройдитесь по бульвару; до Башни
    алфавита около километра. Кафе и общественных туалетов вдоль набережной много.
  route: >-
    Из Тбилиси — по S1 (E60) на запад мимо Кутаиси до Самтредиа, по S12 (E692) через Ланчхути до Григолети
    и по S2 (E70) на юг через Кобулети в Батуми: 371 км, около 5 часов 30 минут, всё время по асфальту.
    «Осьминог» стоит на приморском бульваре у Государственного университета имени Шота Руставели, напротив
    отеля «Хилтон Батуми». Парковка на окрестных улицах платная, обычно через мобильное приложение или
    по SMS, а летом мест мало, так что по возможности оставьте машину у отеля. Заправки по всему маршруту
    найти легко. Машины эконом-класса вполне достаточно.
fa:
  name: کافه فانتزیا (هشت‌پا)
  short: >-
    «هشت‌پای» باتومی از سال ۱۹۷۵: پوسته‌ای شبکه‌ای از آهن با روکش موزاییک بر ساحل، که در ۲۰۰۰ رها شد،
    شهر از آن دفاع کرد و در ۲۰۲۰ به ثبت اثر تاریخی رسید.
  body: >-
    **در سال ۱۹۷۵ یک شهر ساحلی شوروی صاحب هشت‌پایی شد: هشت بازوی آهنیِ جوش‌خورده، هشت دهانهٔ طاق‌دار و
    پوستی از دلفین‌های موزاییکی؛ هشت‌پایی که باتومی سپس بر سرش بحث کرد، رهایش کرد، برایش جنگید و سرانجام
    از آن محافظت کرد.**


    کافه فانتزیا، که همهٔ اهالی باتومی آن را به سادگی «هشت‌پا» (رواپخا) می‌نامند، بر بلوار ساحلی، کنار
    دانشگاه دولتی شوتا روستاولی ایستاده است. طراحانش معمار گیورگی چاخاوا و زوراب کاپانادزه، استاد فرهنگستان
    دولتی هنرهای تفلیس، بودند و در کنارشان معمار زوراب جالاغونیا، نودار مالازونیا، تصویرگر ارشد مجلهٔ
    طنز «نیانگی»، و مهندس راه پاآتا دوبورجگینیدزه، که سازه را محاسبه کرد، با آنان همکاری داشتند. ساختش
    هشت ماه طول کشید.


    مهندسی‌اش از آنچه به چشم می‌آید جسورانه‌تر است. قاب آهنی را در همان محل خم کردند، به هم کشیدند و جوش
    دادند تا پوسته‌ای دولایه و شبکه‌ای پدید آید؛ سپس آن را با توری پوشاندند، گچ‌کاری کردند و با قطعه‌های
    ریز شیشهٔ رنگی روکش کردند که به روشی ساخته می‌شد که حق اختراعش در لنینگراد ثبت شده بود. پوسته توخالی
    است و نسبت به اندازه‌اش نازک؛ از همین رو این‌قدر سبک به نظر می‌رسد، و از همین رو جابه‌جا کردنش عملاً
    ناممکن از آب درآمد. دلفین‌ها، نماد باتومی، همراه اسب‌های دریایی، ستاره‌های دریایی و ماهی‌های رنگارنگ
    بر آن شنا می‌کنند. دوستدارانش به یاد پارک گوئل گائودی می‌افتند.


    در سال‌های شوروی اینجا قهوهٔ تازه، بستنی و نوشابه می‌فروختند و هر شب ساعت ۱۰ تعطیل می‌کردند، چون مرز
    به‌شدت نگهبانی‌شده با ترکیه، عضو ناتو، کمی پایین‌تر در امتداد ساحل بود. کافه در سال ۲۰۰۰ بسته شد و
    متروک ماند؛ اهالی قطعه‌های فروریختهٔ موزاییک را به یادگار به جیب می‌زدند. وقتی هتل هیلتون روبه‌رویش
    قد کشید، طومارهایی دست‌به‌دست شد و در دسامبر ۲۰۱۴ هتل و سازنده‌اش اعلام کردند که هرگز قصد تخریب آن
    را نداشته‌اند. مرمت در سال ۲۰۱۸ آغاز شد، هشت‌پا در ۱۴ اوت ۲۰۱۹ دوباره گشوده شد و در ۲۷ ژوئیهٔ ۲۰۲۰
    سازمان میراث فرهنگی آجارا آن را در فهرست آثار فرهنگی غیرمنقول ثبت کرد.


    ساخته شد تا بستنی بفروشد، و سرانجام به شهری نشان داد که چه چیزی را می‌خواهد نگه دارد.
  tip: >-
    تماشای هشت‌پا در هر ساعتی رایگان است؛ اینکه کافهٔ درونش هنگام گذر شما باز باشد یا نه، بهتر است همان‌جا
    معلوم شود تا اینکه برنامه‌تان را بر آن بچینید. برای عکس‌های تمیز و بی‌جمعیت صبح زود بیایید، یا هنگام
    غروب، وقتی نور مایل موزاییک را به درخشش درمی‌آورد. از آن بالا نروید و قطعه‌های موزاییک را نکنید: پوسته
    نازک است و بنا اثری ثبت‌شده. خودرو را در هتل بگذارید و در امتداد بلوار قدم بزنید؛ برج الفبا حدود یک
    کیلومتر آن‌طرف‌تر است. در طول ساحل کافه و سرویس بهداشتی عمومی فراوان است.
  route: >-
    از تفلیس با S1 (E60) رو به غرب از کنار کوتائیسی تا سامتردیا بروید، با S12 (E692) از راه لانچخوتی تا
    گریگولتی، و با S2 (E70) رو به جنوب از راه کوبولتی تا باتومی: ۳۷۱ کیلومتر و حدود ۵ ساعت و ۳۰ دقیقه،
    سراسر آسفالت. هشت‌پا بر بلوار ساحلی، کنار دانشگاه دولتی شوتا روستاولی و روبه‌روی هتل هیلتون باتومی
    ایستاده است. پارک در خیابان‌های اطراف پولی است، معمولاً با اپلیکیشن تلفن همراه یا پیامک، و تابستان
    جای خالی کم است؛ پس اگر می‌توانید خودرو را در هتل بگذارید. سوخت در سراسر مسیر به‌آسانی پیدا می‌شود.
    خودروی اقتصادی کاملاً کافی است.
he:
  name: קפה פנטזיה ('התמנון')
  short: >-
    'התמנון' של בטומי משנת 1975: קליפת רשת מברזל מצופה פסיפס בטיילת החוף, שננטשה ב-2000, זכתה להגנת העיר
    ונרשמה כנכס מורשת ב-2020.
  body: >-
    **בשנת 1975 קיבלה עיירת נופש סובייטית תמנון: שמונה זרועות מברזל מרותך, שמונה פתחים מקומרים ועור של
    דולפינים מפסיפס. אחר כך בטומי התווכחה עליו, נטשה אותו, נאבקה עליו ולבסוף הגנה עליו.**


    קפה פנטזיה, שכל תושבי בטומי קוראים לו פשוט 'התמנון' (רוואפחה), עומד בטיילת החוף ליד האוניברסיטה הממלכתית
    על שם שותא רוסתוולי. תכננו אותו האדריכל גיורגי צ'חאווה וזוראב קפנדזה, פרופסור באקדמיה הממלכתית לאמנויות
    בטביליסי, יחד עם האדריכל זוראב ג'לגוניה, נודר מלזוניה, המאייר הראשי של כתב העת הסאטירי 'ניאנגי', ומהנדס
    הכבישים פאטה דובורג'גינידזה, שחישב את המבנה. בנייתו ארכה שמונה חודשים.


    ההנדסה נועזת יותר ממה שנראה. את שלד הברזל כופפו, משכו זה אל זה וריתכו במקום לקליפת רשת כפולה, ואחר
    כך עטפו אותה ברשת, טייחו אותה וחיפו אותה באבני פסיפס מזכוכית צבעונית, שיוצרו בתהליך שנרשם עליו פטנט
    בלנינגרד. הקליפה חלולה ודקה ביחס לגודלה — ולכן היא נראית קלה כל כך, ולכן גם התברר שכמעט אי אפשר להזיז
    אותה. דולפינים, סמלה של בטומי, שוחים עליה לצד סוסוני ים, כוכבי ים ודגים בוהקים. מעריציה נזכרים בפארק
    גואל של גאודי.


    בשנים הסובייטיות מכרו כאן קפה טרי, גלידה ומשקאות קלים, והמקום נסגר בכל ערב ב-10 בלילה, כי הגבול השמור
    היטב עם טורקיה, חברת נאט״ו, עבר מעט דרומה לאורך החוף. ב-2000 הוא נסגר ועמד נטוש; מקומיים לקחו לכיסם
    אבני פסיפס שנשרו, למזכרת. כשמלון הילטון צמח ממולו, הופצו עצומות, ובדצמבר 2014 הודיעו המלון והיזם שלו
    שמעולם לא התכוונו להרוס אותו. השיקום החל ב-2018, התמנון נפתח מחדש ב-14 באוגוסט 2019, וב-27 ביולי 2020
    רשמה אותו סוכנות המורשת של אג'ריה כנכס מורשת תרבותית בלתי מיטלטל.


    הוא נבנה כדי למכור גלידה, ובסוף הראה לעיר מה היא רוצה לשמור.
  tip: >-
    אפשר לראות את התמנון בחינם בכל שעה; אם בית הקפה שבתוכו פועל כשאתם עוברים, כדאי לבדוק במקום ולא לבנות
    על זה תוכניות. בואו מוקדם בבוקר לתמונות נקיות בלי המון, או בשקיעה, כשהאור הנמוך מצית ניצוצות בפסיפס.
    אל תטפסו עליו ואל תתלשו אבני פסיפס: הקליפה דקה והמבנה הוא נכס מורשת רשום. השאירו את הרכב במלון ולכו
    לאורך הטיילת; מגדל האלפבית נמצא במרחק של כקילומטר. בתי קפה ושירותים ציבוריים יש בשפע לאורך החוף.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה על פני קוטאיסי עד סמטרדיה, בכביש S12 (E692) דרך לנצ'חוטי עד גריגולטי,
    ובכביש S2 (E70) דרומה דרך קובולטי אל בטומי: 371 ק״מ וכ-5 שעות ו-30 דקות, כל הדרך על אספלט. התמנון
    עומד בטיילת החוף ליד האוניברסיטה הממלכתית על שם שותא רוסתוולי, מול מלון הילטון בטומי. החניה ברחובות
    הסמוכים בתשלום, בדרך כלל באפליקציה או ב-SMS, ובקיץ המקומות מעטים, לכן אם אפשר השאירו את הרכב במלון.
    דלק קל למצוא לאורך כל הדרך. רכב חסכוני הוא כל מה שצריך.
ar:
  name: مقهى فانتازيا («الأخطبوط»)
  short: >-
    «أخطبوط» باتومي منذ 1975: قشرة شبكية من الحديد مكسوّة بالفسيفساء على الواجهة البحرية، هُجرت عام 2000
    ودافعت عنها المدينة ثم سُجّلت معلماً عام 2020.
  body: >-
    **في عام 1975 حظيت مدينة مصايف سوفييتية بأخطبوط: ثمانية أذرع من الحديد الملحوم، وثماني فتحات مقوّسة،
    وجلد من دلافين الفسيفساء. ثم اختلفت عليه باتومي، وهجرته، وناضلت من أجله، وأخيراً حمته.**


    يقف مقهى فانتازيا، الذي يسميه أهل باتومي جميعاً ببساطة «الأخطبوط» (رفابيخا)، على الكورنيش البحري بجوار
    جامعة شوتا روستافيلي الحكومية. صممه المعماري غيورغي تشاخافا وزوراب كابانادزه، الأستاذ في أكاديمية
    تبليسي الحكومية للفنون، بمشاركة المعماري زوراب جالاغونيا، ونودار مالازونيا، كبير رسامي مجلة «نيانغي»
    الساخرة، ومهندس الطرق باآتا دوبورجغينيدزه الذي وضع حسابات الهيكل. واستغرق بناؤه ثمانية أشهر.


    والهندسة هنا أجرأ مما تبدو. فقد حُني الهيكل الحديدي وشُدّ ولُحم في الموقع ليصير قشرة شبكية مزدوجة،
    ثم لُفّ بشبكة وكُسي بالجص ورُصّع بمكعبات فسيفساء من الزجاج الملوّن صُنعت بطريقة حاصلة على براءة اختراع
    في لينينغراد. القشرة جوفاء ورقيقة قياساً بحجمها، ولهذا تبدو خفيفة إلى هذا الحد، ولهذا أيضاً تبيّن
    أن نقلها شبه مستحيل. تسبح عليها الدلافين، رمز باتومي، مع أحصنة البحر ونجوم البحر والأسماك الزاهية.
    ويستحضر المعجبون بها حديقة غويل لغاودي.


    في السنوات السوفييتية كان المقهى يبيع القهوة الطازجة والمثلجات والمرطبات، ويغلق كل ليلة في الساعة
    10 مساءً، لأن الحدود الخاضعة لحراسة مشددة مع تركيا، العضو في حلف الناتو، كانت قريبة جنوباً على الساحل.
    أُغلق عام 2000 وبقي مهجوراً؛ وكان السكان يحتفظون بمكعبات الفسيفساء المتساقطة تذكاراً. وحين ارتفع فندق
    هيلتون قبالته، تداول الناس العرائض، وفي ديسمبر 2014 أعلن الفندق ومطوّره أنهما لم ينويا هدمه قط. بدأ
    الترميم عام 2018، وأُعيد افتتاح الأخطبوط في 14 أغسطس 2019، وفي 27 يوليو 2020 سجّلته وكالة التراث في
    أدجارا معلماً ثقافياً ثابتاً.


    بُني ليبيع المثلجات، فانتهى به الأمر إلى أن يُري مدينةً ما الذي تريد أن تحتفظ به.
  tip: >-
    مشاهدة الأخطبوط مجانية في أي ساعة؛ أما هل يعمل المقهى في داخله حين تمرّ، فالأفضل أن تتحقق منه في المكان
    بدل أن تبني خطتك عليه. تعال في الصباح الباكر لتلتقط صوراً نظيفة بلا زحام، أو عند الغروب حين يجعل الضوء
    المائل الفسيفساء تتلألأ. لا تتسلقه ولا تنتزع مكعبات الفسيفساء: فالقشرة رقيقة وهو معلم مسجّل. اترك
    السيارة في الفندق وتمشَّ على الكورنيش؛ برج الأبجدية على بعد نحو كيلومتر. المقاهي ودورات المياه العامة
    كثيرة على امتداد الواجهة البحرية.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى سامترديا، ثم S12 (E692) عبر لانتشخوتي حتى
    غريغوليتي، ثم S2 (E70) جنوباً عبر كوبوليتي إلى باتومي: 371 كم ونحو 5 ساعات و30 دقيقة، على طريق معبّد
    طوال الوقت. يقف الأخطبوط على الكورنيش البحري بجوار جامعة شوتا روستافيلي الحكومية، قبالة فندق هيلتون
    باتومي. المواقف في الشوارع المحيطة مدفوعة، وعادة ما يُدفع عبر تطبيق على الهاتف أو برسالة نصية، والأماكن
    شحيحة صيفاً، فاترك السيارة في فندقك إن استطعت. محطات الوقود سهلة المنال على امتداد الطريق كله. وتكفي
    سيارة اقتصادية.
