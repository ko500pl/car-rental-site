ka:
  name: შხარის მყინვარი და ლამარია
  short: ენგურის სათავე უშგულის ზემოთ, შხარის ყინულოვან კედელთან — საქართველოს უმაღლეს მწვერვალთან, 5193
    მეტრზე.
  body: >-
    **უშგულის ზემოთ ბილიკი ენგურის სათავემდე მიდის** — იმ ადგილამდე, სადაც მდინარე, რომელსაც ზუგდიდიდან
    მთელი გზა მიჰყვები, უბრალოდ ყინულიდან გამოდის. ეს ერთდღიანი ლაშქრობაა და სვანეთის საუკეთესო.


    მარშრუტი უშგულიდან აღმოსავლეთით მიემართება, ენგურის მარჯვენა ნაპირით. რვაიოდე კილომეტრია ერთი მიმართულებით,
    სამიდან ოთხ საათამდე, ნაბიჯი კი მსუბუქია: ხეობა ფართოა და აწევა მთლიანობაში ორას-სამასი მეტრი თუ იქნება.
    ბოლოს მდელო მორენად იქცევა და მყინვარის ენა უკვე ახლოსაა, დაახლოებით 2300-2400 მეტრზე.


    ზემოთ შხარაა — 5193 მეტრი, საქართველოს უმაღლესი წერტილი და ბეზენგის კედლის კულმინაცია. ეს კედელი თორმეტკილომეტრიანი
    ყინულოვანი ზღუდეა საქართველოსა და რუსეთის საზღვარზე და ალპინიზმის ისტორიაში ერთ-ერთი ყველაზე სერიოზული
    ობიექტია. მისი ძირიდან ყურება სრულიად სხვა შთაბეჭდილებაა, ვიდრე შორიდან.


    გზაზე, უშგულის ზედა უბანში, ჟიბიანში, ლამარიის ეკლესია დგას — ღვთისმშობლის სახელობის დარბაზული ეკლესია
    XI-XII საუკუნეებისა, საკუთარი კოშკითა და გალავნით. შიგნით კედლის მხატვრობის ფრაგმენტებია. ის ზუსტად
    ბილიკის დასაწყისშია და გვერდის ავლა არ ღირს.


    მყინვარის ენა სწრაფად იხევს უკან. ბოლო ათწლეულებში ის შესამჩნევად შემცირდა და დღეს ყინულის კიდე არამდგრადია:
    ლოდები ცვივა, ყინულის კამარები ინგრევა. ენის ქვეშ შესვლა ან ყინულზე ასვლა აღჭურვილობისა და გამცილებლის
    გარეშე არ ღირს — ეს რჩევა არაა, არამედ გაფრთხილება.


    ბილიკზე თითქმის არაფერია ხელოვნური: ერთი-ორი ხის ხიდი, მწყემსების დროებითი სადგომი და მორენაზე გაკეთებული
    კვალი. ზაფხულის შუაგულში აქ საქონელი და ცხენებია, ივნისში კი ჯერ კიდევ თოვლის ლაქები დევს ჩრდილოეთ
    კალთებზე.


    ჟიბიანიდან ხედი უკან, უშგულის კოშკებზე, ისეთივე კარგია, როგორც წინ, კედლისკენ — დაბრუნებისას ხშირად
    უფრო ლამაზიც, როცა საღამოს შუქი დასავლეთიდან მოდის.


    ამინდი ცალკე საკითხია. ხეობა ღრუბელს იჭერს და შუადღის შემდეგ წვიმა ჩვეულებრივია. ადრე გახვედი — არა
    მხოლოდ ხედისთვის, არამედ იმიტომაც, რომ ღრუბლიან დღეს კედელი საერთოდ არ ჩანს და მთელი აზრი იკარგება.


    უშგულში ცხენების დაქირავებაა შესაძლებელი, ჯიპებიც ნაწილობრივ ადიან — მაგრამ ბოლო მონაკვეთი მაინც ფეხითაა.
    წყალი გზაზეა, საკვები არა.


    სეზონი ივნისის შუიდან ოქტომბრის დასაწყისამდეა. მაისში ბილიკზე თოვლია და ენგური ადიდებულია.


    ექვსი საათი დაითვალე — ეს სრული დღეა, უშგულის ღამისთევასთან ერთად.
  tip: >-
    ექვსი საათი, ანუ პრაქტიკულად სრული დღე. დილით ადრე გახვედი: შუადღის შემდეგ ღრუბელი და წვიმა ჩვეულებრივია.
    მაგარი ფეხსაცმელი, ქარსაცავი და თბილი ფენა აუცილებელია — მყინვარიდან ცივი ჰაერი ჩამოდის. მყინვარის
    ენის ქვეშ ან ყინულზე ნუ ახვალ. წყალი ხეობაშია, საკვები არა — უშგულიდან წაიღე. ცხენი უშგულში ქირავდება.
    ღამის გასათევად უშგული ჯობია, რომ დილით ადრე დაიწყო. ბავშვებთან ერთადაც შესაძლებელია, თუ მყინვარამდე
    ბოლო კილომეტრს არ გაივლი.
  route: >-
    თბილისიდან E60-ით სენაკამდე, ზუგდიდისკენ, ჩრდილოეთით მესტიამდე და შემდეგ აღმოსავლეთით უშგულამდე —
    დაახლოებით 515 კმ და ათნახევარი საათი. მესტიამდე ასფალტია; მესტია-უშგულის მონაკვეთი ღორღიანი, ვიწრო
    და ღრმად დაღარულია, ორიოდე ღელის გადასასვლელით — ოთხთვალა ავტომობილი აუცილებელია. მანქანა უშგულში
    დატოვე; ბილიკი სოფლის აღმოსავლეთ ბოლოდან იწყება. საწვავი მესტიაში აიღე — უშგულში სადგური საერთოდ არ
    არის და მაღაზიებიც მცირეა. მესტიიდან უშგულამდე ორ-სამ საათს დაითვალე, თუმცა მანძილი მხოლოდ ორმოცდახუთი
    კილომეტრია.
en:
  name: Shkhara Glacier and Lamaria
  short: The source of the Enguri above Ushguli, below the ice wall of Shkhara, the highest summit in
    Georgia.
  body: >-
    **Above Ushguli a track runs to the source of the Enguri** — to the place where the river you have
    followed all the way from Zugdidi simply comes out of the ice. It is a day walk, and the best one
    in Svaneti.


    The route heads east from Ushguli along the right bank of the Enguri: about eight kilometres each
    way, three to four hours, and easy going, since the valley is broad and the total ascent is only two
    or three hundred metres. Towards the end the meadow gives way to moraine and the glacier snout appears,
    at roughly 2,300 metres.


    Above it stands Shkhara, 5,193 metres, the highest point in Georgia and the culminating summit of
    the Bezengi Wall. That wall is a twelve-kilometre rampart of ice on the Georgian–Russian border and
    one of the most serious objectives in Caucasian mountaineering. Seeing it from directly beneath is
    a different experience entirely.


    On the way, in Zhibiani at the top of Ushguli, stands the Lamaria church: an eleventh- or twelfth-century
    hall church dedicated to the Mother of God, with its own tower, an enclosure wall and fragments of
    painting inside. It sits where the path begins and should not be skipped.


    The glacier snout is retreating fast. It has shrunk noticeably in recent decades and the ice edge
    is unstable, with rockfall and collapsing arches. Walking under the tongue or onto the ice without
    equipment and a guide is a warning rather than a suggestion.


    There is almost nothing man-made along the path: a couple of plank bridges, a shepherds' camp and
    a line worn across the moraine. In high summer there are cattle and horses up here.


    The view back from Zhibiani towards the towers of Ushguli is as good as the view forward towards the
    wall, and often better on the way home, when the evening light comes from the west.


    Weather is a separate matter. The valley traps cloud and afternoon rain is normal. Start early, because
    on a cloudy day the wall is invisible and the point of the walk disappears.


    Horses can be hired in Ushguli and four-wheel drives get part of the way up, but the last stretch
    is on foot regardless. There is water along the valley and no food.


    The season runs from mid-June to early October; in May the path still holds snow and the Enguri is
    in flood. Allow six hours, which in practice means a full day with a night in Ushguli.
  tip: >-
    Six hours, which in practice is a full day. Start early: cloud and rain in the afternoon are normal
    here. Solid boots, a windproof layer and something warm are all necessary, because cold air pours
    off the glacier. Do not walk under the snout or climb onto the ice. There is water in the valley but
    no food, so carry it from Ushguli. Horses can be hired in Ushguli. Sleeping in the village is the
    only way to make an early start realistic.
  route: >-
    From Tbilisi take the E60 to Senaki, continue to Zugdidi, then north to Mestia and east to Ushguli
    — about 515 km and ten and a half hours. Asphalt runs to Mestia; the Mestia–Ushguli section is gravel,
    narrow and deeply rutted, with a couple of stream crossings, and four-wheel drive is genuinely necessary.
    Leave the car in Ushguli; the path starts at the eastern end of the village. Refuel in Mestia, since
    there is no station higher up and none at all in Ushguli.
ru:
  name: Ледник Шхара и Ламария
  short: Исток Ингури выше Ушгули, под ледяной стеной Шхары — высшей вершины Грузии.
  body: >-
    **Выше Ушгули тропа ведёт к истоку Ингури** — туда, где река, вдоль которой вы ехали от самого Зугдиди,
    попросту выходит изо льда. Это однодневная прогулка и лучшая в Сванетии.


    Маршрут идёт на восток от Ушгули по правому берегу Ингури. Около восьми километров в одну сторону,
    три-четыре часа, и идти легко: долина широкая, набор высоты всего двести-триста метров. Ближе к концу
    луг сменяется мореной, и появляется язык ледника — примерно на 2300–2400 метрах.


    Над ним стоит Шхара, 5193 метра, высшая точка Грузии и кульминация Безенгийской стены. Эта стена —
    двенадцатикилометровый ледяной вал на грузино-российской границе и один из самых серьёзных объектов
    в истории кавказского альпинизма. Видеть её прямо снизу — совсем не то же самое, что видеть издалека.


    По пути, в Жибиани, верхнем квартале Ушгули, стоит церковь Ламария, посвящённая Богородице: зальный
    храм XI–XII веков с собственной башней и оградой, внутри фрагменты стенописи. Она находится ровно
    там, где начинается тропа, и пропускать её не стоит.


    Язык ледника быстро отступает. За последние десятилетия он заметно сократился, а кромка льда нестабильна:
    сыплются камни, обрушиваются ледяные арки. Заходить под язык или подниматься на лёд без снаряжения
    и проводника не следует — это предупреждение, а не совет.


    На тропе почти нет ничего рукотворного: пара дощатых мостков, временная стоянка пастухов и набитая
    колея по морене. В разгар лета здесь пасутся коровы и лошади, а в июне на северных склонах ещё лежат
    пятна снега.


    Вид назад из Жибиани на башни Ушгули не хуже вида вперёд на стену, а на обратном пути часто и лучше,
    когда вечерний свет идёт с запада.


    Погода — отдельная тема. Долина собирает облака, и дождь после полудня здесь обычен. Выходите рано,
    и не только ради света: в облачный день стена не видна вовсе, и смысл прогулки исчезает.


    В Ушгули можно нанять лошадей, часть пути проезжают внедорожники, но последний отрезок в любом случае
    пешком. Вода в долине есть, еды нет.


    Сезон — с середины июня до начала октября. В мае на тропе ещё лежит снег, а Ингури в паводке.


    Закладывайте шесть часов, то есть практически целый день с ночёвкой в Ушгули.
  tip: >-
    Шесть часов, то есть фактически целый день. Выходите рано: облачность и дождь после полудня здесь
    обычное дело. Крепкие ботинки, ветрозащита и что-то тёплое необходимы — с ледника стекает холодный
    воздух. Не заходите под язык и не поднимайтесь на лёд. Вода в долине есть, еды нет, берите из Ушгули.
    Лошадей можно нанять в Ушгули. Ночёвка в селе — единственный способ реально выйти пораньше.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше до Зугдиди, затем на север до Местии и на восток до Ушгули — около
    515 км и десять с половиной часов. До Местии асфальт; участок Местиа — Ушгули гравийный, узкий, с
    глубокой колеёй и парой бродов, и полный привод здесь действительно нужен. Машину оставьте в Ушгули:
    тропа начинается у восточного края села. Заправляйтесь в Местии, выше заправок нет, а в Ушгули нет
    вовсе.
fa:
  name: یخچال شخارا و کلیسای لاماریا
  short: سرچشمهٔ رود اینگوری در بالای اوشگولی، زیر دیوار یخی شخارا، بلندترین قلهٔ گرجستان با ۵۱۹۳ متر
    ارتفاع.
  body: >-
    **بالای اوشگولی مسیری تا سرچشمهٔ اینگوری می‌رود** — تا جایی که رودخانه‌ای که از زوگدیدی تا اینجا دنبالش
    کرده‌اید به‌سادگی از دل یخ بیرون می‌آید. این پیاده‌روی یک‌روزه است و بهترین پیاده‌روی سوانتی.


    مسیر از اوشگولی به شرق و در ساحل راست اینگوری می‌رود. حدود هشت کیلومتر یک‌طرفه است، سه تا چهار ساعت،
    و راه رفتن آسان: دره پهن است و مجموع ارتفاع‌گیری تنها دویست تا سیصد متر. نزدیک پایان، چمنزار به یخرفت
    بدل می‌شود و زبانهٔ یخچال پیدا می‌شود، در ارتفاع تقریبی ۲۳۰۰ تا ۲۴۰۰ متر.


    بالای آن شخارا ایستاده است، ۵۱۹۳ متر، بلندترین نقطهٔ گرجستان و اوج دیوار بزنگی. آن دیوار سدی یخی به
    درازای دوازده کیلومتر بر مرز گرجستان و روسیه است و از جدی‌ترین هدف‌ها در تاریخ کوهنوردی قفقاز. دیدنش
    از درست زیر پایش تجربه‌ای یکسره متفاوت از دیدن آن از دور است.


    در راه، در ژیبیانی، محلهٔ بالایی اوشگولی، کلیسای لاماریا ایستاده است که به مادر خدا اهدا شده: کلیسایی
    تالاری از سدهٔ یازدهم یا دوازدهم با برج و حصار خودش و پاره‌هایی از نقاشی دیواری در درون. درست همان‌جا
    که مسیر آغاز می‌شود قرار دارد و نباید از آن گذشت.


    زبانهٔ یخچال به‌سرعت عقب می‌نشیند. در دهه‌های اخیر به‌روشنی کوچک شده و لبهٔ یخ ناپایدار است، با ریزش
    سنگ و فروریختن طاق‌های یخی. رفتن زیر زبانه یا بالا رفتن روی یخ بدون تجهیزات و راهنما درست نیست؛ این
    هشدار است نه پیشنهاد.


    هوا مسئلهٔ جداگانه‌ای است. دره ابر را نگه می‌دارد و باران بعدازظهر عادی است. زود راه بیفتید، نه فقط
    برای نور بلکه چون در روز ابری دیوار اصلاً دیده نمی‌شود و تمام معنای پیاده‌روی از میان می‌رود.


    در اوشگولی می‌توان اسب کرایه کرد و خودروهای چهارچرخ‌محرک بخشی از راه را بالا می‌روند، اما بخش پایانی
    در هر حال پیاده است. در دره آب هست و خوراک نیست.


    فصل از نیمهٔ خرداد تا اوایل مهر است. در اردیبهشت هنوز برف روی مسیر است و اینگوری طغیان دارد.


    شش ساعت در نظر بگیرید، که عملاً یعنی یک روز کامل با یک شب ماندن در اوشگولی.
  tip: >-
    شش ساعت، که عملاً یک روز کامل است. زود راه بیفتید: ابر و باران بعدازظهر اینجا عادی است. پوتین محکم،
    لایهٔ بادگیر و چیزی گرم همه لازم‌اند، چون هوای سرد از یخچال سرازیر می‌شود. زیر زبانهٔ یخ نروید و روی
    یخ بالا نروید. در دره آب هست اما خوراک نیست، پس از اوشگولی بردارید. اسب را می‌توان در اوشگولی کرایه
    کرد. خوابیدن در روستا تنها راه واقعی برای شروع زودهنگام است.
  route: >-
    از تفلیس با E60 تا سناکی، سپس زوگدیدی، آنگاه به شمال تا مستیا و به شرق تا اوشگولی — حدود ۵۱۵ کیلومتر
    و ده ساعت و نیم. تا مستیا آسفالت است؛ بخش مستیا تا اوشگولی شنی و باریک و عمیقاً شیاردار است و دو گذرِ
    جویبار دارد، و چهارچرخ‌محرک واقعاً لازم است. خودرو را در اوشگولی بگذارید؛ مسیر از انتهای شرقی روستا
    آغاز می‌شود. سوخت را در مستیا بگیرید، چون بالاتر پمپی نیست و در اوشگولی اصلاً وجود ندارد.
he:
  name: קרחון שכארה וכנסיית לאמריה
  short: מוצא האינגורי מעל אושגולי, תחת חומת הקרח של שכארה, הפסגה הגבוהה בגאורגיה.
  body: >-
    **מעל אושגולי מוליכה דרך אל מוצא האינגורי** — אל המקום שבו הנהר שליוויתם כל הדרך מזוגדידי פשוט יוצא
    מן הקרח. זו הליכה של יום, והטובה ביותר בסוונתי.


    המסלול פונה מזרחה מאושגולי לאורך הגדה הימנית של האינגורי. כשמונה קילומטרים לכל כיוון, שלוש עד ארבע
    שעות, וההליכה קלה: העמק רחב וההעפלה הכוללת היא רק מאתיים עד שלוש מאות מטרים. לקראת הסוף מתחלף האחו
    במורנה ולשון הקרחון נגלית, בגובה של כ-2,300 עד 2,400 מטרים.


    מעליה ניצבת שכארה, 5,193 מטרים, הנקודה הגבוהה ביותר בגאורגיה ופסגת השיא של חומת בזנגי. החומה הזאת
    היא סוללת קרח באורך שנים-עשר קילומטרים לאורך הגבול הגאורגי-רוסי, ואחת המטרות הרציניות בתולדות הטיפוס
    בקווקז. לראותה ממש מלמטה זו חוויה אחרת לגמרי מלראותה ממרחק.


    בדרך, בז׳יביאני שבחלקה העליון של אושגולי, עומדת כנסיית לאמריה המוקדשת לאם האלוהים: כנסיית אולם מן
    המאה האחת-עשרה או השתים-עשרה, עם מגדל וחומת היקף משלה ושברי ציורי קיר בפנים. היא נמצאת בדיוק במקום
    שבו מתחיל השביל ואין לוותר עליה.


    לשון הקרחון נסוגה במהירות. בעשורים האחרונים היא הצטמצמה באופן ניכר וקצה הקרח אינו יציב, עם מפולות
    אבנים וקשתות קרח מתמוטטות. ללכת מתחת ללשון או לעלות על הקרח בלי ציוד ובלי מדריך אינו מומלץ; זו אזהרה
    ולא הצעה.


    לאורך השביל כמעט אין דבר מעשה ידי אדם: שני גשרי קרשים, מאהל רועים זמני ותלם שנשחק על פני המורנה. בשיא
    הקיץ יש כאן בקר וסוסים, וביוני עדיין מונחים כתמי שלג במדרונות הפונים צפונה.


    הנוף לאחור מז׳יביאני אל מגדלי אושגולי טוב לא פחות מן הנוף קדימה אל החומה, ולעיתים קרובות טוב אף יותר
    בדרך חזרה, כשאור הערב מגיע מן המערב.


    מזג האוויר הוא עניין נפרד. העמק לוכד עננים וגשם אחר הצהריים הוא דבר רגיל. צאו מוקדם, לא רק בגלל האור
    אלא מפני שביום מעונן החומה אינה נראית כלל וכל הטעם בהליכה נעלם.


    באושגולי אפשר לשכור סוסים, ורכבי שטח עולים חלק מן הדרך, אך הקטע האחרון הוא ברגל בכל מקרה. מים יש לאורך
    העמק; אוכל אין.


    העונה נמשכת מאמצע יוני עד תחילת אוקטובר. במאי עדיין יש שלג על השביל והאינגורי גואה.


    הקצו שש שעות, שפירושן למעשה יום שלם עם לינה באושגולי.
  tip: >-
    שש שעות, שהן למעשה יום שלם. צאו מוקדם: עננים וגשם אחר הצהריים הם דבר רגיל כאן. נעליים חזקות, שכבה
    אטומה לרוח ומשהו חם כולם הכרחיים, כי אוויר קר יורד מן הקרחון. אל תלכו מתחת ללשון ואל תעלו על הקרח.
    יש מים בעמק אך אין אוכל, לכן שאו אותו מאושגולי. סוסים אפשר לשכור באושגולי. לינה בכפר היא הדרך היחידה
    לצאת באמת מוקדם.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי, ואז צפונה למסטיה ומזרחה לאושגולי — כ-515 ק״מ ועשר שעות
    וחצי. האספלט מגיע עד מסטיה; קטע מסטיה–אושגולי מחוצץ, צר ובעל תלמים עמוקים, ובו שתי חציות נחל, והנעה
    כפולה נחוצה באמת. השאירו את הרכב באושגולי; השביל מתחיל בקצה המזרחי של הכפר. תדלקו במסטיה, כי מעלה
    אין תחנה ובאושגולי אין כלל. הקצו שעתיים עד שלוש ממסטיה לאושגולי, אף שהמרחק הוא ארבעים וחמישה קילומטרים
    בלבד.
ar:
  name: نهر شخارا الجليدي وكنيسة لاماريا
  short: منبع نهر إنغوري فوق أوشغولي، تحت جدار شخارا الجليدي، أعلى قمة في جورجيا.
  body: >-
    **فوق أوشغولي يمتد درب إلى منبع نهر إنغوري** — إلى الموضع الذي يخرج فيه النهر الذي تبعته من زوغديدي
    كلها من الجليد ببساطة. إنها مسيرة يوم واحد، وأفضل مسيرة في سفانيتي.


    يتجه المسار شرقاً من أوشغولي على الضفة اليمنى لإنغوري. نحو ثمانية كيلومترات في الاتجاه الواحد، وثلاث
    إلى أربع ساعات، والسير سهل: الوادي عريض ومجموع الصعود مئتان أو ثلاثمئة متر فقط. وقرب النهاية يفسح
    المرج المكان للركام الجليدي فيظهر لسان النهر الجليدي، على ارتفاع 2300 إلى 2400 متر تقريباً.


    وفوقه تقوم شخارا، 5193 متراً، أعلى نقطة في جورجيا وذروة جدار بيزينغي. وذلك الجدار سور من الجليد طوله
    اثنا عشر كيلومتراً على الحدود الجورجية الروسية، وأحد أخطر الأهداف في تاريخ تسلق القوقاز. ورؤيته من
    تحته مباشرة تجربة مختلفة تماماً عن رؤيته من بعيد.


    وفي الطريق، في جيبياني بأعلى أوشغولي، تقوم كنيسة لاماريا المكرسة لوالدة الإله: كنيسة صحن من القرن
    الحادي عشر أو الثاني عشر، لها برجها وسورها، وفي داخلها شذرات من التصوير الجداري. وتقع تماماً حيث يبدأ
    الدرب ولا ينبغي تجاوزها.


    ولسان النهر الجليدي ينحسر بسرعة. فقد تقلص بوضوح في العقود الأخيرة، وحافة الجليد غير مستقرة، مع سقوط
    صخور وانهيار أقواس جليدية. والسير تحت اللسان أو الصعود على الجليد بغير معدات ومرشد ليس صواباً؛ وهذا
    تحذير لا اقتراح.


    ولا يكاد يوجد على الدرب شيء من صنع الإنسان: جسران من الألواح، ومخيم رعاة مؤقت، وخط محفور فوق الركام.
    وفي ذروة الصيف ترعى هنا الأبقار والخيول، وفي حزيران ما زالت بقع الثلج على المنحدرات الشمالية.


    والمنظر إلى الوراء من جيبياني نحو أبراج أوشغولي لا يقل جودة عن المنظر إلى الأمام نحو الجدار، وكثيراً
    ما يفوقه في طريق العودة حين يأتي ضوء المساء من الغرب.


    والطقس مسألة أخرى. فالوادي يحبس الغيم، ومطر بعد الظهر أمر معتاد. انطلق مبكراً، لا للضوء وحده بل لأن
    الجدار في يوم غائم لا يُرى إطلاقاً فيضيع مغزى المسيرة كله.


    ويمكن استئجار خيول في أوشغولي، وتصعد مركبات الدفع الرباعي جزءاً من الطريق، لكن المقطع الأخير سيراً
    على الأقدام في كل حال. الماء متوفر على طول الوادي؛ أما الطعام فلا.


    والموسم من منتصف حزيران إلى أوائل تشرين الأول. ففي أيار ما زال الثلج على الدرب وإنغوري في فيضانه.


    خصص ست ساعات، وهو ما يعني عملياً يوماً كاملاً مع مبيت في أوشغولي.
  tip: >-
    ست ساعات، وهي عملياً يوم كامل. انطلق مبكراً: الغيم والمطر بعد الظهر أمر معتاد هنا. الحذاء المتين وطبقة
    صادّة للريح وشيء دافئ كلها ضرورية، لأن الهواء البارد ينسكب من النهر الجليدي. لا تمشِ تحت اللسان ولا
    تصعد على الجليد. في الوادي ماء ولا طعام، فاحمله من أوشغولي. والخيول تُستأجر في أوشغولي. والمبيت في
    القرية هو السبيل الوحيد لانطلاقة مبكرة حقيقية.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم إلى زوغديدي، ثم شمالاً إلى مستيا وشرقاً إلى أوشغولي — نحو
    515 كم وعشر ساعات ونصف. الإسفلت يمتد حتى مستيا؛ ومقطع مستيا–أوشغولي حصوي ضيق عميق الأخاديد وفيه معبران
    لجداول، والدفع الرباعي ضروري فعلاً. اترك السيارة في أوشغولي؛ فالدرب يبدأ من الطرف الشرقي للقرية. تزوّد
    بالوقود في مستيا، فلا محطة في الأعلى ولا وجود لها في أوشغولي.
