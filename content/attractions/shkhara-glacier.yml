ka:
  name: შხარის მყინვარი და ლამარია
  short: >-
    რვაკილომეტრიანი გზა უშგულიდან ენგურის სათავემდე, შხარის ყინულის კედლის ძირში — 5203 მეტრი, საქართველოს
    უმაღლესი მწვერვალი.
  body: >-
    **უშგულის ზემოთ ენგური მდინარე აღარაა — ყინულია: ერთი დღის სავალი გზა იმ ადგილამდე მიგიყვანთ, სადაც
    ის იბადება, საქართველოს უმაღლესი კედლის ძირში.**


    ბილიკი უშგულის ზედა სოფლიდან, ჟიბიანიდან იწყება, ლამარიას — IX–X საუკუნეების ღვთისმშობლის პატარა ეკლესიას
    თავისი სვანური კოშკით — ჩაუვლის და ახალგაზრდა ენგურის მარჯვენა ნაპირს აღმოსავლეთით მიუყვება. ერთი
    მიმართულებით რვაიოდე კილომეტრია, სამიდან ოთხ საათამდე; ხეობა ფართოა, აღმართი — დამრეცი, სულ ორას-სამასი
    მეტრი. სათიბებს საძოვრები ცვლის, საძოვრებს — ნაცრისფერი მორენა, და ბოლოს, დაახლოებით 2300–2400 მეტრზე,
    მყინვარის ენა გამოჩნდება: წვეთავს, ღრჭიალებს და დნობის წყლით ხმაურობს.


    მის თავზე შხარაა — 5203 მეტრი, საქართველოს უმაღლესი წერტილი და ბეზენგის კედლის აღმოსავლეთი საყრდენი;
    ეს 11–12-კილომეტრიანი ყინულის ზღუდე რუსეთის საზღვარს მიუყვება. სამხრეთის კალთა მწვერვალიდან ძირამდე
    დაახლოებით 2300 მეტრით ეშვება. სვანურად სახელი, როგორც ამბობენ, „ცხრას“ ნიშნავს — ქედზე ამოზიდული
    მრავალი წვერის გამო. შხარაზე მარტივი გზა არც ერთი მხრიდან არ არსებობს. პირველად 1888 წელს ავიდნენ:
    ინგლისელი ჯონ გარფორთ კოკინი და შვეიცარიელი მეგზურები ულრიხ ალმერი და ქრისტიან როთი ჩრდილოეთიდან.


    ადრე გადით. შუადღისთვის ხეობა ღრუბელს აგროვებს და ნაცრისფერ ნაშუადღევს კედელი უბრალოდ ქრება — მორენისა
    და იდეის პირისპირ რჩებით.


    უკან საღამოს შუქისკენ მიდიხართ და უშგულის კოშკები თავად გამოგეგებებათ, ბნელ ფერდობებზე ოქროსფრად ანთებული.
    ეს დღის მეორე საუკეთესო ხედია — ზოგისთვის პირველიც.
  tip: >-
    ორმხრივ გზას ექვსი საათი დაუთმეთ — უშგულიდან გასვლით ეს სრული დღეა, ამიტომ სოფელში გაათიეთ ღამე და
    განთიადისას დაიძარით. მაგარი ფეხსაცმელი, ქარსაცავი და თბილი ტანსაცმელი აუცილებელია: ყინულიდან ცივი
    ჰაერი ივლისშიც ჩამოედინება. საგზალი უშგულიდან წამოიღეთ — გზაზე არაფერია. ცხენის დაქირავება სოფელშივე
    შეიძლება. მყინვარის ენას მოშორებით იყავით, ყინულზე ან მის ქვეშ არასოდეს შეხვიდეთ: ის არამდგრადია,
    ქვები ცვივა, კამარები ინგრევა. სეზონი ივნისის შუა რიცხვებიდან ოქტომბრის დასაწყისამდეა.
  route: >-
    ბილიკი უშგულიდან იწყება — თბილისიდან დაახლოებით 515 კმ და ათნახევარი საათი; უმეტესობა გზას მესტიაში
    ღამისთევით ყოფს. E60-ით (ს-1) ზუგდიდამდე, შემდეგ შ-7-ით ენგურის ხეობას ამოუყევით მესტიამდე — მთლიანად
    ასფალტზე. მესტიიდან უშგულამდე ბოლო 45 კმ, დაახლოებით ორი საათის სავალი, მხოლოდ ნაწილობრივ არის მოასფალტებული:
    რეკონსტრუქცია წლებია მიმდინარეობს, გრძელი მონაკვეთები კი ჯერ ისევ ვიწრო, დაღარული ხრეშიანი და ქვიანი
    გზაა, ღელის გადასასვლელებით, რომლებიც წვიმის შემდეგ დიდდება. მაღალკლირენსიანი 4x4 ძალიან გირჩევთ —
    ამიტომაც მივაკუთვნეთ ეს მარშრუტი ოფროუდის კატეგორიას. საწვავი მესტიაში ჩაასხით, უშგულში სადგური არ
    არის. მანქანა სოფელში დატოვეთ: ბილიკი მის ზედა, აღმოსავლეთ ბოლოში, ჟიბიანში იწყება.
en:
  name: Shkhara Glacier and Lamaria
  short: >-
    An eight-kilometre walk from Ushguli to the source of the Enguri, under the ice wall of Shkhara, at
    5,203 m the highest mountain in Georgia.
  body: >-
    **Above Ushguli the Enguri stops being a river and turns into ice: a day's walk takes you to the place
    where it is born, beneath the highest wall in Georgia.**


    The path leaves the top of Ushguli at Zhibiani, past Lamaria, the small 9th- or 10th-century church
    of the Mother of God with its own Svan tower, and heads east along the right bank of the young Enguri.
    It is about eight kilometres each way and three to four hours out; the valley is broad and the climb
    gentle, two or three hundred metres in all. Hay meadows give way to grazing, grazing to grey moraine,
    and then the snout of the glacier appears, at around 2,300–2,400 metres, dripping and grinding and
    loud with meltwater.


    Above it stands Shkhara, 5,203 metres, the highest point in Georgia and the eastern anchor of the
    Bezengi Wall, an 11–12-kilometre rampart of ice along the Russian border. Its southern face falls
    some 2,300 metres from summit to foot. In Svan the name is said to mean "nine", for the many summits
    along its crest. There is no easy route up any side of it. The first ascent came in 1888, when the
    Englishman John Garforth Cockin and the Swiss guides Ulrich Almer and Christian Roth reached the top
    from the north.


    Come early. The valley gathers cloud by midday, and on a grey afternoon the wall simply vanishes;
    you are left facing a moraine and an idea.


    Walk back towards the evening light and the towers of Ushguli come to meet you, gold against the dark
    slopes. It is the second-best view of the day, and some people prefer it.
  tip: >-
    Allow six hours for the return walk, which with a start from Ushguli makes a full day, so sleep in
    the village and set off at first light. Wear solid boots and bring a windproof and a warm layer: cold
    air pours off the ice even in July. Carry food from Ushguli, as there is nothing on the way. Horses
    can be hired in the village for the approach. Stay well back from the snout and never walk on or under
    the ice: it is unstable, with falling stones and collapsing arches. The season runs from mid-June
    to early October.
  route: >-
    The walk starts in Ushguli, about 515 km and ten and a half hours from Tbilisi; most people break
    the drive in Mestia. Take the E60 (S1) to Zugdidi and the Sh7 up the Enguri gorge to Mestia, all asphalt.
    The final 45 km from Mestia to Ushguli, roughly two hours, are only partly paved: reconstruction has
    been going on for years, and long stretches are still narrow, rutted gravel and stone, with stream
    crossings that swell after rain. A high-clearance 4x4 is strongly recommended, which is why we class
    this as an offroad trip. Refuel in Mestia; there is no fuel in Ushguli. Park in the village: the path
    begins at its upper, eastern end, in Zhibiani.
ru:
  name: Ледник Шхара и Ламария
  short: >-
    Восемь километров пешком от Ушгули до истока Ингури — под ледяной стеной Шхары, высочайшей горы Грузии
    (5203 м).
  body: >-
    **Выше Ушгули Ингури перестаёт быть рекой и становится льдом: за день пешком можно дойти до места,
    где она рождается, — к подножию самой высокой стены Грузии.**


    Тропа выходит из верхнего квартала Ушгули, Жибиани, минует Ламарию — маленькую церковь Богородицы
    IX или X века с собственной сванской башней — и уходит на восток по правому берегу молодой Ингури.
    В одну сторону около восьми километров и три-четыре часа ходу; долина широкая, подъём пологий, набор
    высоты всего двести-триста метров. Сенокосы сменяются пастбищами, пастбища — серой мореной, и наконец
    показывается язык ледника на высоте примерно 2300–2400 метров: он сочится водой, скрежещет и гудит
    талыми потоками.


    Над ним стоит Шхара, 5203 метра, — высшая точка Грузии и восточная опора Безенгийской стены, ледяного
    вала длиной 11–12 километров вдоль границы с Россией. Её южная стена обрывается от вершины к подножию
    примерно на 2300 метров. Говорят, что по-свански её имя означает «девять» — по множеству вершин на
    гребне. Лёгкого пути наверх нет ни с одной стороны. Впервые на вершину поднялись в 1888 году англичанин
    Джон Гарфорт Кокин и швейцарские проводники Ульрих Альмер и Кристиан Рот — с севера.


    Выходите рано. К полудню долина набирает облака, и в серый день стена попросту исчезает: перед вами
    остаются морена и одна только мысль о стене.


    Возвращайтесь к вечернему свету — и башни Ушгули сами выйдут вам навстречу, золотые на фоне тёмных
    склонов. Это второй по красоте вид за день, а кому-то он дороже первого.
  tip: >-
    Закладывайте шесть часов на дорогу туда и обратно: со стартом из Ушгули это целый день, поэтому ночуйте
    в селе и выходите с первым светом. Нужны крепкие ботинки, ветровка и что-нибудь тёплое — даже в июле
    с ледника стекает холодный воздух. Еду берите в Ушгули: по пути нет ничего. Для подхода в селе можно
    нанять лошадей. Держитесь подальше от языка ледника и ни в коем случае не выходите на лёд и не заходите
    под него: он неустойчив, сверху летят камни, рушатся ледяные арки. Сезон — с середины июня до начала
    октября.
  route: >-
    Тропа начинается в Ушгули — около 515 км и десяти с половиной часов от Тбилиси; большинство разбивает
    дорогу ночёвкой в Местии. По E60 (S1) до Зугдиди, затем по Sh7 вверх по ущелью Ингури до Местии —
    всё по асфальту. Последние 45 км от Местии до Ушгули, около двух часов пути, заасфальтированы лишь
    частично: реконструкция идёт уже несколько лет, и длинные участки по-прежнему — узкая разбитая колея
    из гравия и камня с бродами через ручьи, которые после дождя вздуваются. Настоятельно рекомендуем
    полноприводный автомобиль с высоким клиренсом — поэтому поездка и отнесена к классу «внедорожник».
    Заправляйтесь в Местии: в Ушгули заправки нет. Машину оставьте в селе — тропа начинается в его верхней,
    восточной части, в Жибиани.
fa:
  name: یخچال شخارا و لاماریا
  short: >-
    هشت کیلومتر پیاده‌روی از اوشگولی تا سرچشمهٔ اینگوری، زیر دیوار یخی شخارا که با ۵٬۲۰۳ متر بلندترین
    کوه گرجستان است.
  body: >-
    **بالاتر از اوشگولی، اینگوری دیگر رود نیست و به یخ بدل می‌شود: یک روز پیاده‌روی شما را به جایی می‌رساند
    که این رود از آن زاده می‌شود، پای بلندترین دیوار گرجستان.**


    راه از بالاترین محلهٔ اوشگولی، ژیبیانی، آغاز می‌شود، از کنار لاماریا می‌گذرد — کلیسای کوچک مادر خدا
    از سدهٔ نهم یا دهم با برج سوانیِ از آنِ خود — و در امتداد کرانهٔ راست اینگوریِ جوان رو به شرق پیش
    می‌رود. رفتن حدود هشت کیلومتر است و سه تا چهار ساعت؛ دره پهن است و شیب ملایم، روی هم رفته دویست تا
    سیصد متر صعود. علفزارهای درو جای خود را به چراگاه می‌دهند، چراگاه‌ها به یخرفت خاکستری، و آن‌گاه پیشانی
    یخچال در ارتفاع حدود ۲٬۳۰۰ تا ۲٬۴۰۰ متر پدیدار می‌شود: چکه‌کنان، ساینده و پرهیاهو از آب‌های ذوب‌شده.


    بر فراز آن شخارا ایستاده است، ۵٬۲۰۳ متر، بلندترین نقطهٔ گرجستان و ستون شرقی دیوار بزنگی، بارویی یخی
    به درازای ۱۱ تا ۱۲ کیلومتر در امتداد مرز روسیه. دیوارهٔ جنوبی‌اش از قله تا دامنه نزدیک به ۲٬۳۰۰ متر
    فرو می‌افتد. می‌گویند نامش در زبان سوانی به معنای «نُه» است، به سبب قله‌های بسیاری که بر ستیغش صف
    کشیده‌اند. از هیچ سو راه آسانی به قله‌اش نیست. نخستین صعود در سال ۱۸۸۸ انجام شد، هنگامی که جان گارفورث
    کاکینِ انگلیسی به همراه راهنمایان سوئیسی، اولریش آلمر و کریستیان روت، از سوی شمال به قله رسیدند.


    زود راه بیفتید. دره تا نیمروز ابر گرد می‌آورد و در بعدازظهری خاکستری دیوار یکسره ناپدید می‌شود؛ آن‌گاه
    شما می‌مانید و تلی از یخرفت و تصوری از کوه.


    در بازگشت که رو به نور غروب گام برمی‌دارید، برج‌های اوشگولی به پیشوازتان می‌آیند، زرین در برابر دامنه‌های
    تیره. این دومین منظرهٔ زیبای روز است و کسانی هستند که آن را بیشتر می‌پسندند.
  tip: >-
    برای رفت و برگشت شش ساعت در نظر بگیرید؛ با آغاز از اوشگولی این یعنی یک روز کامل، پس شب را در روستا
    بمانید و با نخستین روشنایی راه بیفتید. کفش محکم بپوشید و بادگیر و یک لایهٔ گرم همراه داشته باشید:
    حتی در ژوئیه هوای سرد از روی یخ سرازیر می‌شود. خوراک را از اوشگولی بردارید، چون در راه هیچ چیز نیست.
    برای پیمودن مسیر می‌توان در روستا اسب کرایه کرد. از پیشانی یخچال فاصلهٔ زیادی بگیرید و هرگز روی یخ
    یا زیر آن نروید: یخ ناپایدار است، سنگ فرو می‌ریزد و طاق‌های یخی می‌شکنند. فصل مناسب از میانهٔ ژوئن
    تا اوایل اکتبر است.
  route: >-
    پیاده‌روی از اوشگولی آغاز می‌شود، نزدیک به ۵۱۵ کیلومتر و ده ساعت و نیم از تفلیس؛ بیشتر مسافران راه
    را با یک شب ماندن در مستیا دو نیمه می‌کنند. از جادهٔ E60 (S1) تا زوگدیدی بروید و سپس از Sh7 درهٔ اینگوری
    را تا مستیا بالا بروید؛ همهٔ این راه آسفالت است. ۴۵ کیلومتر پایانی از مستیا تا اوشگولی، حدود دو ساعت
    راه، تنها بخشی‌اش آسفالت است: بازسازی جاده سال‌هاست ادامه دارد و تکه‌های درازی هنوز شنی و سنگلاخ،
    باریک و پرشیارند، با گذرهایی از میان جویبارها که پس از باران پرآب می‌شوند. خودروی دودیفرانسیل با فاصلهٔ
    زیاد از زمین اکیداً توصیه می‌شود و به همین دلیل این سفر در ردهٔ آفرود جای می‌گیرد. در مستیا باک را
    پر کنید؛ در اوشگولی پمپ بنزین نیست. خودرو را در روستا بگذارید: راه پیاده از انتهای بالایی و شرقی آن،
    در ژیبیانی، آغاز می‌شود.
he:
  name: קרחון שחארה ולאמריה
  short: >-
    הליכה של שמונה קילומטרים מאושגולי אל מקורו של האנגורי, מתחת לחומת הקרח של שחארה, ההר הגבוה בגאורגיה
    (5,203 מ׳).
  body: >-
    **מעל אושגולי חדל האנגורי להיות נהר והופך לקרח: יום של הליכה מביא אתכם אל המקום שבו הוא נולד, למרגלות
    החומה הגבוהה ביותר בגאורגיה.**


    השביל יוצא מקצהו העליון של אושגולי, ברובע ז׳יביאני, חולף על פני לאמריה — כנסייה קטנה לאם האלוהים מן
    המאה התשיעית או העשירית, ולה מגדל סוואני משלה — ופונה מזרחה לאורך הגדה הימנית של האנגורי הצעיר. כשמונה
    קילומטרים לכל כיוון ושלוש עד ארבע שעות הלוך; העמק רחב והעלייה מתונה, מאתיים עד שלוש מאות מטרים בסך
    הכול. אחו החציר מפנה את מקומו לשטחי מרעה, המרעה למורנה אפורה, ואז נגלית לשון הקרחון, בגובה של כ-2,300–2,400
    מטרים: מטפטפת, שוחקת והומה ממי הפשרה.


    מעליה מתנשא שחארה, 5,203 מטרים, הנקודה הגבוהה ביותר בגאורגיה והעוגן המזרחי של חומת בזנגי — סוללת קרח
    באורך 11–12 קילומטרים לאורך הגבול עם רוסיה. המצוק הדרומי שלו צונח כ-2,300 מטרים מן הפסגה ועד רגלי
    ההר. מספרים שבסוואנית פירוש שמו „תשע“, על שם הפסגות הרבות לאורך רכסו. אין אליו דרך קלה מאף צד. הטיפוס
    הראשון לפסגה נעשה ב-1888, כשהאנגלי ג׳ון גרפורת׳ קוקין והמדריכים השווייצרים אולריך אלמר וכריסטיאן רוט
    הגיעו אליה מצפון.


    צאו מוקדם. עד הצהריים העמק מתמלא עננים, ובאחר צהריים אפור החומה פשוט נעלמת; נשארים מול ערמת מורנה
    ורעיון.


    בדרך חזרה, כשאתם צועדים אל אור הערב, מגדלי אושגולי יוצאים לקראתכם, מוזהבים על רקע המדרונות הכהים.
    זהו הנוף השני ביופיו באותו יום, ויש מי שמעדיפים אותו.
  tip: >-
    הקציבו שש שעות להליכה הלוך ושוב; ביציאה מאושגולי זהו יום שלם, ולכן לנו בכפר וצאו עם אור ראשון. נעלו
    נעליים יציבות וקחו מעיל רוח ושכבה חמה: אוויר קר זורם מן הקרח גם ביולי. הביאו אוכל מאושגולי, כי בדרך
    אין דבר. בכפר אפשר לשכור סוסים לדרך. שמרו מרחק רב מלשון הקרחון ולעולם אל תלכו עליה או מתחתיה: הקרח
    אינו יציב, אבנים נופלות וקשתות קרח קורסות. העונה נמשכת מאמצע יוני עד תחילת אוקטובר.
  route: >-
    ההליכה מתחילה באושגולי, כ-515 ק״מ ועשר וחצי שעות נסיעה מטביליסי; רוב המטיילים מפצלים את הנסיעה ולנים
    במסטיה. סעו בכביש E60 (S1) עד זוגדידי ומשם בכביש Sh7 במעלה ערוץ האנגורי עד מסטיה, כולו סלול. 45 הק״מ
    האחרונים, ממסטיה לאושגולי – כשעתיים נסיעה – סלולים רק בחלקם: הדרך נמצאת בשיקום כבר שנים, וקטעים ארוכים
    בה עדיין עשויים חצץ ואבנים, צרים ומלאי תלמים, עם חציות נחלים שגואים אחרי גשם. אנו ממליצים בחום על
    רכב 4x4 עם מרווח גחון גבוה, ומשום כך הטיול מסווג בקטגוריית רכבי השטח. תדלקו במסטיה; באושגולי אין תחנת
    דלק. החנו בכפר: השביל מתחיל בקצהו העליון, המזרחי, בז׳יביאני.
ar:
  name: نهر شخارا الجليدي ولاماريا
  short: مسيرة ثمانية كيلومترات من أوشغولي إلى منبع إنغوري، تحت جدار شخارا الجليدي، أعلى جبال جورجيا بارتفاع
    5,203 م.
  body: >-
    **فوق أوشغولي يكفّ إنغوري عن أن يكون نهراً ويصير جليداً: مسيرة يوم واحد تأخذك إلى حيث يولد، عند قدم
    أعلى جدار في جورجيا.**


    يغادر الدرب أعلى أوشغولي من حيّ جيبياني، ويمرّ بلاماريا، كنيسة والدة الإله الصغيرة من القرن التاسع
    أو العاشر ولها برجها السفاني الخاص، ثم يتّجه شرقاً على الضفة اليمنى لإنغوري الفتيّ. المسافة نحو ثمانية
    كيلومترات في كل اتجاه، وثلاث إلى أربع ساعات ذهاباً؛ الوادي فسيح والصعود هيّن، مئتان إلى ثلاثمئة متر
    في المجموع. تُفسح مروج الحشائش المكان للمراعي، والمراعي للركام الجليدي الرمادي، ثم يظهر لسان النهر
    الجليدي على ارتفاع 2,300–2,400 متر تقريباً، يقطر ويطحن ويضجّ بمياه الذوبان.


    فوقه ينتصب شخارا، 5,203 أمتار، أعلى نقطة في جورجيا والركيزة الشرقية لجدار بيزينغي، وهو متراس من الجليد
    طوله 11–12 كيلومتراً على امتداد الحدود الروسية. وتهوي واجهته الجنوبية نحو 2,300 متر من القمة إلى السفح.
    ويُقال إن اسمه يعني بالسفانية "تسعة"، لكثرة القمم على حرفه. ولا طريق سهلاً إلى قمته من أي جانب. وكان
    أول صعود إليه عام 1888، حين بلغ قمته من الشمال الإنجليزي جون غارفورث كوكين مع الدليلين السويسريين
    أولريش ألمر وكريستيان روث.


    تعالَ باكراً. يتجمّع الغيم في الوادي مع اقتراب الظهيرة، وفي عصرٍ رماديّ يختفي الجدار ببساطة؛ فلا يبقى
    أمامك إلا ركامٌ وفكرة.


    وعُد نحو ضوء المساء، فتخرج أبراج أوشغولي لملاقاتك، ذهبيةً على خلفية المنحدرات الداكنة. إنه ثاني أجمل
    مشهد في ذلك اليوم، وثمة من يفضّله على الأول.
  tip: >-
    خصّص ست ساعات للذهاب والإياب، وهذا يعني يوماً كاملاً إذا انطلقت من أوشغولي، فبِتْ في القرية وانطلق
    مع أول الضوء. البس حذاءً متيناً واحمل سترة واقية من الريح وملابس دافئة: فالهواء البارد ينسكب من الجليد
    حتى في يوليو. خذ طعامك من أوشغولي، إذ لا شيء على الطريق. ويمكن استئجار الخيول في القرية لقطع المسافة.
    ابقَ بعيداً عن لسان الجليد، ولا تمشِ أبداً عليه أو تحته: فهو غير مستقر، والحجارة تتساقط والأقواس الجليدية
    تنهار. يمتد الموسم من منتصف يونيو إلى أوائل أكتوبر.
  route: >-
    تبدأ المسيرة في أوشغولي، على بعد نحو 515 كم وعشر ساعات ونصف من تبليسي؛ ويقسم معظم المسافرين الرحلة
    بمبيت في ميستيا. اسلك الطريق E60 (S1) إلى زوغديدي، ثم الطريق Sh7 صعوداً في مضيق إنغوري حتى ميستيا،
    وكله معبّد. أما الكيلومترات الخمسة والأربعون الأخيرة من ميستيا إلى أوشغولي، نحو ساعتين، فمعبّدة جزئياً
    فقط: إذ يجري إصلاح الطريق منذ سنوات، ولا تزال مقاطع طويلة منه حصى وحجارة، ضيقة ومليئة بالأخاديد، تعبرها
    جداول تفيض بعد المطر. لذا نوصي بشدة بسيارة دفع رباعي عالية الخلوص عن الأرض، ولهذا تُصنَّف الرحلة ضمن
    فئة الطرق الوعرة. تزوّد بالوقود في ميستيا، فلا محطة وقود في أوشغولي. اركن السيارة في القرية: يبدأ
    الدرب من طرفها الأعلى الشرقي، في جيبياني.
