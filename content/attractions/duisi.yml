ka:
  name: დუისი
  short: >-
    პანკისის ხეობის უდიდესი სოფელი და საქართველოს ქისტების გული: XX საუკუნის დასაწყისის მეჩეთი აგურის
    ორნამენტიანი მინარეთით და სტუმართმოყვარე ოჯახები.
  body: >-
    **ახმეტის ჩრდილოეთით ვენახებს სიმინდი და საძოვრები ცვლის, ალაზნის პირას მინარეთი აიმართება — და თქვენ
    დუისში ხართ, პანკისის ხეობის უდიდეს სოფელსა და საქართველოს ქისტების გულში.**


    ეს ადგილი ხეობის ერთ-ერთი უძველესი დასახლებაა. პირვანდელი მოსახლეობა აქედან XVIII საუკუნის მეორე ნახევარში,
    ლეკიანობის დროს აიყარა, XIX საუკუნის შუა წლებიდან კი დაცარიელებული მიწა ქისტებმა დაასახლეს — კავკასიონის
    მთავარი ქედის გადაღმიდან გადმოსულმა ჩეჩნურენოვანმა მუსლიმმა მთიელებმა. გადმოცემით, სოფელს სახელი ერთ-ერთი
    მოახალშენის, დუის, სახელიდან დაერქვა; ჩეჩნურად მას დუი-იურტი ჰქვია. 2014 წლის აღწერით აქ 2354 ადამიანი
    ცხოვრობდა, მათგან თითქმის 94 პროცენტი — ქისტი.


    ძველი მეჩეთი XX საუკუნის პირველ წლებში აშენდა — წყაროები 1901 ან 1902 წელს ასახელებენ. მისი მინარეთის
    ფასადი აგურით გამოყვანილი ორნამენტითაა შემკული, 2021 წელს კი შენობა განახლდა. გვერდით 2002 წელს აგებული
    ახალი, უფრო დიდი მეჩეთი დგას. სოფლის აღმოსავლეთით გვიანი შუა საუკუნეების ორი პატარა დარბაზული ეკლესია
    — საყდრისთავისა და ღვინეთის — უფრო ძველ, ქრისტიანულ დუისს გვახსენებს. სოფლის პირას კი ზემო ალაზნის
    სარწყავი სისტემის სათავე ნაგებობა მდინარის წყალს ბარის მინდვრებისთვის იღებს.


    ათასწლეულების მიჯნაზე ჩეჩნეთის ომს ათასობით ლტოლვილი ქედის გადაღმიდან ამ ხეობაში გამოექცა, და რამდენიმე
    წლის განმავლობაში პანკისს საზღვარგარეთ ძირითადად შემაშფოთებელი სათაურებით იცნობდნენ. ის წლები წარსულს
    ჩაბარდა და ხეობა დღეს მშვიდია. ოჯახები სტუმრებს საკუთარ სახლებში იღებენ და უხვ ქისტურ სუფრას უშლიან,
    სოფლის ქალები კი სუფიურ ზიქრს — წრიულ, სიმღერით აღსრულებულ ლოცვას — ინარჩუნებენ.


    დუისი ძეგლი არ არის, რომელსაც სურათს გადაუღებთ და წახვალთ. აქ უნდა დაჯდეთ, ჭამოთ და მოუსმინოთ.
  tip: >-
    სტუმრად მიდით და არა მაყურებლად; კიდევ უკეთესი — ღამე ოჯახში გაათიეთ, რადგან ერთდღიანი მოგზაურობისას
    ძირითადად გზას ნახავთ. ეს მუსლიმური სოფელია: საჯარო ადგილას ალკოჰოლს ნუ დალევთ და თავშეკავებულად ჩაიცვით,
    მხრებითა და მუხლებით დაფარული. მეჩეთში შესვლამდე ნებართვა ითხოვეთ, ფეხსაცმელი გაიხადეთ, ქალებს თავსაფარი
    დასჭირდებათ; პარასკევის შუადღის ლოცვის დროს მეჩეთს ნუ ესტუმრებით. ადამიანების, განსაკუთრებით ქალების,
    გადაღებამდე ყოველთვის იკითხეთ. შესვლის საფასური არსად არის; მეჩეთების ირგვლივ სასეირნოდ ერთი საათი
    კმარა, სუფრაზე თუ დაგპატიჟეს — მეტი. ნაღდი ფული თან იქონიეთ, ავზი კი ახმეტაში შეავსეთ.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით იარეთ, შემდეგ შ38-ით გომბორის უღელტეხილზე გადადით თელავის მიმართულებით,
    იქიდან დასავლეთით ახმეტისკენ გაუხვიეთ და ავზი იქ შეავსეთ. ახმეტიდან გზა ალაზანს ჩრდილოეთით, პანკისის
    ხეობაში მიუყვება; დუისი ქალაქიდან დაახლოებით 17 კილომეტრშია, ასფალტზე, რომელიც ხეობის შევიწროებასთან
    ერთად ვიწროვდება. სულ დაახლოებით 129 კილომეტრი და ორნახევარი საათი. თავად სოფლამდე ეკონომკლასის მანქანა
    სავსებით საკმარისია; ასფალტს მხოლოდ ბირკიანს იქით, ხეობის სიღრმეში, უხეში გრუნტის გზა ცვლის.
en:
  name: Duisi
  short: >-
    The largest village of the Pankisi Gorge and heart of Georgia's Kist community, with an early-20th-century
    mosque and its brick-patterned minaret.
  body: >-
    **North of Akhmeta the vineyards give way to maize and pasture, a minaret rises beside the Alazani,
    and you are in Duisi, the largest village of the Pankisi Gorge and the heart of Georgia's Kist community.**


    This is one of the oldest settled places in the gorge. Its first inhabitants left in the second half
    of the 18th century, during the raids from Dagestan that Georgians call the Lekianoba, and from the
    middle of the 19th century the empty land was resettled by Kists: Chechen-speaking Muslim highlanders
    who had crossed the main Caucasus range. Tradition says the village is named after one of those settlers,
    a man called Dui; in Chechen it is Dui-Yurt. At the 2014 census 2,354 people lived here, almost 94
    per cent of them Kists.


    The old mosque went up in the first years of the 20th century (sources give 1901 or 1902). Its minaret
    is dressed with ornament laid in brick, and the building was renovated in 2021. Beside it stands the
    larger new mosque, built in 2002. East of the village, two small late-medieval hall churches, Sakdristavi
    and Ghvineti, recall an older, Christian Duisi. And at the edge of the village the headworks of the
    Upper Alazani irrigation system draw off river water for the fields of the plain.


    Around the turn of the millennium thousands of refugees from the war in Chechnya crossed the ridge
    into the gorge, and for some years Pankisi was known abroad chiefly through anxious headlines. Those
    years are past, and the valley is calm. Families welcome guests into their homes and lay generous
    Kist tables, and the village women keep alive the Sufi zikr, a circling, chanted prayer.


    Duisi is not a monument to photograph and leave. It is a place to sit down, eat and listen.
  tip: >-
    Come as a guest, not a spectator, and better still stay the night with a family: a day trip shows
    you mostly the road. This is a Muslim village, so do not drink alcohol in public, and dress modestly,
    with shoulders and knees covered. Ask before entering either mosque, take off your shoes, and women
    will need a headscarf; avoid the Friday midday prayer. Always ask before photographing people, especially
    women. Nothing charges an entry fee; an hour covers a walk round the mosques, longer if you are asked
    to the table. Carry cash, and fill the tank in Akhmeta.
  route: >-
    From Tbilisi take the S5 east and the Sh38 over the Gombori Pass towards Telavi, then turn west to
    Akhmeta and fill the tank there. From Akhmeta a road runs north up the Alazani into the Pankisi Gorge;
    Duisi lies about 17 km from the town, on asphalt that narrows as the valley closes in. That makes
    about 129 km and two and a half hours in all. An economy car is perfectly adequate for the village
    itself; only beyond Birkiani, deeper in the gorge, does the asphalt give way to a rough track.
ru:
  name: Дуиси
  short: >-
    Крупнейшее село Панкисского ущелья и сердце кистинской общины Грузии — со старой мечетью начала XX
    века и минаретом в кирпичном узоре.
  body: >-
    **К северу от Ахметы виноградники уступают место кукурузе и пастбищам, у Алазани поднимается минарет
    — и вы в Дуиси, крупнейшем селе Панкисского ущелья и сердце кистинской общины Грузии.**


    Это одно из старейших поселений ущелья. Первые его жители ушли во второй половине XVIII века, во время
    набегов из Дагестана, которые грузины называют Лекианоба, а с середины XIX века опустевшие земли заново
    заселили кистинцы — чеченоязычные горцы-мусульмане, перешедшие Главный Кавказский хребет. По преданию,
    село названо в честь одного из этих переселенцев, человека по имени Дуи; по-чеченски оно зовётся Дуи-Юрт.
    По переписи 2014 года здесь жили 2354 человека, почти 94 процента из них — кистинцы.


    Старая мечеть построена в первые годы XX века (источники называют 1901 или 1902 год). Её минарет украшен
    орнаментом, выложенным кирпичом, а в 2021 году здание обновили. Рядом стоит более просторная новая
    мечеть, построенная в 2002 году. К востоку от села две небольшие позднесредневековые зальные церкви,
    Сакдристави и Гвинети, напоминают о прежнем, христианском Дуиси. А на краю села головные сооружения
    Верхнеалазанской оросительной системы отводят речную воду на поля равнины.


    На рубеже тысячелетий тысячи беженцев от войны в Чечне перешли хребет и спустились в ущелье, и несколько
    лет Панкиси знали за рубежом главным образом по тревожным заголовкам. Те годы позади, в долине спокойно.
    Семьи принимают гостей у себя дома и накрывают щедрые кистинские столы, а женщины села хранят суфийский
    зикр — молитву, которую поют, двигаясь по кругу.


    Дуиси — не памятник, который фотографируют и покидают. Сюда приезжают, чтобы сесть за стол, поесть
    и послушать.
  tip: >-
    Приезжайте как гость, а не как зритель, а лучше останьтесь на ночь в семье: за однодневную поездку
    вы увидите в основном дорогу. Это мусульманское село, поэтому не пейте алкоголь на людях и одевайтесь
    скромно, закрыв плечи и колени. Прежде чем войти в любую из мечетей, спросите разрешения и снимите
    обувь; женщинам понадобится платок. Не приходите во время пятничной полуденной молитвы. Всегда спрашивайте,
    прежде чем фотографировать людей, особенно женщин. Платы за вход нигде нет; на прогулку по мечетям
    хватит часа, дольше — если позовут к столу. Возьмите наличные и заправьтесь в Ахмете.
  route: >-
    Из Тбилиси поезжайте на восток по S5 и по Sh38 через Гомборский перевал в сторону Телави, затем сверните
    на запад к Ахмете и заправьтесь там. От Ахметы дорога идёт на север вверх по Алазани в Панкисское
    ущелье; Дуиси — примерно в 17 км от города, по асфальту, который сужается вместе с долиной. Всего
    около 129 км и два с половиной часа. До самого села вполне доедет машина эконом-класса; лишь за Биркиани,
    глубже в ущелье, асфальт сменяется разбитой грунтовкой.
fa:
  name: دوئیسی
  short: >-
    بزرگ‌ترین روستای درهٔ پانکیسی و قلب جامعهٔ کیست گرجستان، با مسجدی از آغاز سدهٔ بیستم و منارهٔ آن با
    نقش‌های آجری.
  body: >-
    **در شمال آخمِتا تاکستان‌ها جای خود را به ذرت و چراگاه می‌دهند، مناره‌ای کنار آلازانی قد می‌کشد، و
    شما در دوئیسی هستید: بزرگ‌ترین روستای درهٔ پانکیسی و قلب جامعهٔ کیست گرجستان.**


    این یکی از کهن‌ترین سکونتگاه‌های دره است. نخستین ساکنانش در نیمهٔ دوم سدهٔ هجدهم، در دوران یورش‌هایی
    از داغستان که گرجی‌ها «لکیانوبا» می‌نامند، آن را ترک کردند، و از میانهٔ سدهٔ نوزدهم کیست‌ها در زمین
    خالی‌مانده ساکن شدند: کوه‌نشینان مسلمان و چچنی‌زبانی که از رشته‌کوه اصلی قفقاز گذشته بودند. به روایت
    سنت، روستا نامش را از یکی از همین مهاجران، مردی به نام دوئی، گرفته است؛ به چچنی آن را دوئی‌یورت می‌خوانند.
    در سرشماری ۲۰۱۴، ۲,۳۵۴ نفر اینجا زندگی می‌کردند که نزدیک به ۹۴ درصدشان کیست بودند.


    مسجد قدیمی در نخستین سال‌های سدهٔ بیستم ساخته شد (منابع ۱۹۰۱ یا ۱۹۰۲ را ذکر می‌کنند). مناره‌اش با
    نقش‌هایی آراسته است که با آجر چیده شده‌اند، و بنا در ۲۰۲۱ نوسازی شد. کنارش مسجد نوی بزرگ‌تری ایستاده
    که در ۲۰۰۲ ساخته شد. در شرق روستا، دو کلیسای کوچک تک‌تالاری از اواخر سده‌های میانه، ساکدریستاوی و
    غوینتی، دوئیسیِ کهن‌تر و مسیحی را به یاد می‌آورند. و در لبهٔ روستا، سازه‌های سرآبگیر سامانهٔ آبیاری
    آلازانی علیا آب رود را به سوی کشتزارهای دشت برمی‌گردانند.


    نزدیک به آغاز هزارهٔ نو، هزاران پناهجو از جنگ چچن از ستیغ کوه گذشتند و به دره آمدند، و چند سالی پانکیسی
    را در بیرون از گرجستان بیشتر با تیترهای نگران‌کننده می‌شناختند. آن سال‌ها گذشته و دره آرام است. خانواده‌ها
    مهمان را در خانه‌هایشان می‌پذیرند و سفره‌های کیستیِ پربرکت می‌گسترند، و زنان روستا ذکر صوفیانه را
    زنده نگه می‌دارند: نیایشی آوازی که در حلقه‌ای چرخان خوانده می‌شود.


    دوئیسی یادمانی نیست که از آن عکس بگیرید و بروید. جایی است برای نشستن، خوردن و گوش سپردن.
  tip: >-
    به‌عنوان مهمان بیایید، نه تماشاگر، و بهتر از آن، شب را نزد خانواده‌ای بمانید: سفر یک‌روزه بیشتر خود
    جاده را نشانتان می‌دهد. این روستایی مسلمان است، پس در ملأ عام الکل ننوشید و لباس محجوب بپوشید، به‌گونه‌ای
    که شانه‌ها و زانوها پوشیده باشد. پیش از ورود به هر یک از دو مسجد اجازه بگیرید و کفش‌هایتان را درآورید؛
    زنان به روسری نیاز دارند. از هنگام نماز ظهر جمعه پرهیز کنید. همیشه پیش از عکس گرفتن از مردم، به‌ویژه
    زنان، اجازه بخواهید. هیچ‌جا ورودیه نمی‌گیرند؛ برای گشتی دور مسجدها یک ساعت بس است، و اگر به سر سفره
    دعوت شوید بیشتر. پول نقد همراه داشته باشید و در آخمِتا باک را پر کنید.
  route: >-
    از تفلیس مسیر S5 را به سوی شرق و سپس Sh38 را از گردنهٔ گومبوری به سمت تلاوی بگیرید، آنگاه به غرب به
    سوی آخمِتا بپیچید و همان‌جا باک را پر کنید. از آخمِتا جاده‌ای در امتداد آلازانی رو به بالادست، به
    شمال و به درون درهٔ پانکیسی می‌رود؛ دوئیسی حدود ۱۷ کیلومتر از شهر فاصله دارد، روی آسفالتی که با تنگ‌تر
    شدن دره باریک‌تر می‌شود. روی هم حدود ۱۲۹ کیلومتر و دو ساعت و نیم. برای خود روستا خودروی اقتصادی کاملاً
    کافی است؛ تنها پس از بیرکیانی، در عمق دره، آسفالت جای خود را به راهی خاکی و ناهموار می‌دهد.
he:
  name: דואיסי
  short: >-
    הכפר הגדול ביותר בגיא פנקיסי ולב הקהילה הקיסטית בגאורגיה, עם מסגד מראשית המאה ה-20 וצריחו המעוטר בדוגמאות
    לבנים.
  body: >-
    **מצפון לאחמטה הכרמים מפנים מקום לתירס ולמרעה, צריח מסגד מתנשא לצד האלאזני, ואתם בדואיסי, הכפר הגדול
    ביותר בגיא פנקיסי ולב הקהילה הקיסטית בגאורגיה.**


    זהו אחד היישובים העתיקים ביותר בגיא. תושביו הראשונים עזבו במחצית השנייה של המאה ה-18, בימי הפשיטות
    מדאגסטן שהגאורגים מכנים "לקיאנובה", ומאמצע המאה ה-19 יושבה האדמה הריקה מחדש בידי קיסטים: בני הרים
    מוסלמים דוברי צ'צ'נית שחצו את רכס הקווקז הראשי. לפי המסורת, הכפר נקרא על שם אחד המתיישבים האלה, אדם
    בשם דואי; בצ'צ'נית שמו דואי-יורט. במפקד 2014 חיו כאן 2,354 בני אדם, כמעט 94 אחוז מהם קיסטים.


    המסגד הישן נבנה בשנים הראשונות של המאה ה-20 (המקורות נוקבים ב-1901 או ב-1902). הצריח שלו מעוטר בדגמים
    שנבנו בלבנים, והמבנה שופץ ב-2021. לצדו עומד המסגד החדש והגדול יותר, שנבנה ב-2002. ממזרח לכפר, שתי
    כנסיות אולם קטנות מסוף ימי הביניים, סקדריסטבי וע'ווינטי, מזכירות את דואיסי אחרת, קדומה יותר ונוצרית.
    ובקצה הכפר, מתקני ההטיה של מערכת ההשקיה של האלאזני העליון מטים ממי הנהר אל שדות המישור.


    סביב מפנה האלף חצו אלפי פליטים ממלחמת צ'צ'ניה את הרכס אל הגיא, ובמשך כמה שנים הכירו את פנקיסי בעולם
    בעיקר דרך כותרות מודאגות. השנים ההן חלפו, והעמק שקט. משפחות מארחות אורחים בבתיהן ועורכות שולחנות קיסטיים
    נדיבים, ונשות הכפר משמרות את טקס הזיכר הסופי, תפילה מושרת הנעה במעגל.


    דואיסי אינה אתר שמצלמים וממשיכים הלאה. זה מקום לשבת, לאכול ולהקשיב.
  tip: >-
    בואו כאורחים, לא כצופים, ועדיף אף ללון אצל משפחה: ביקור של יום מראה בעיקר את הדרך. זהו כפר מוסלמי,
    ולכן אל תשתו אלכוהול בפומבי והתלבשו בצניעות, עם כתפיים וברכיים מכוסות. בקשו רשות לפני הכניסה לכל אחד
    מהמסגדים וחלצו נעליים; נשים יזדקקו לכיסוי ראש. הימנעו משעת תפילת הצהריים של יום שישי. בקשו תמיד רשות
    לפני שמצלמים אנשים, ובמיוחד נשים. אין דמי כניסה בשום מקום; שעה מספיקה לסיבוב בין המסגדים, ויותר אם
    מזמינים אתכם לשולחן. הצטיידו במזומן ותדלקו באחמטה.
  route: >-
    מטביליסי סעו מזרחה בכביש S5 ובכביש Sh38 דרך מעבר גומבורי לכיוון טלאווי, ואז פנו מערבה לאחמטה ותדלקו
    שם. מאחמטה עולה כביש צפונה במעלה האלאזני אל גיא פנקיסי; דואיסי נמצאת כ-17 ק"מ מהעיר, על אספלט שהולך
    ומצטמצם ככל שהעמק נסגר. בסך הכול כ-129 ק"מ ושעתיים וחצי. רכב חסכוני מספיק בהחלט לכפר עצמו; רק מעבר
    לבירקיאני, עמוק יותר בגיא, האספלט מתחלף בדרך עפר משובשת.
ar:
  name: دويسي
  short: >-
    أكبر قرى وادي بانكيسي وقلب مجتمع الكيست في جورجيا، وفيها مسجد من مطلع القرن العشرين بمئذنته المزخرفة
    بنقوش الطوب.
  body: >-
    **شمال أخميتا تُفسح الكروم المجال للذرة والمراعي، وترتفع مئذنة بجانب نهر ألازاني، فإذا أنت في دويسي،
    أكبر قرى وادي بانكيسي وقلب مجتمع الكيست في جورجيا.**


    هذه من أقدم المستوطنات في الوادي. غادرها سكانها الأوائل في النصف الثاني من القرن الثامن عشر، إبّان
    الغارات القادمة من داغستان التي يسميها الجورجيون «ليكيانوبا»، ومنذ منتصف القرن التاسع عشر أعاد الكيست
    إعمار الأرض الخالية، وهم أهل جبال مسلمون ناطقون بالشيشانية عبروا سلسلة القوقاز الرئيسية. وتقول الرواية
    المتوارثة إن القرية سُمّيت باسم أحد هؤلاء المستوطنين، رجل يُدعى دوي؛ واسمها بالشيشانية دوي-يورت. وفي
    تعداد 2014 كان يعيش فيها 2,354 شخصًا، قرابة 94 في المئة منهم من الكيست.


    شُيّد المسجد القديم في السنوات الأولى من القرن العشرين (تذكر المصادر 1901 أو 1902). مئذنته مكسوّة
    بزخارف مرصوفة بالطوب، وقد جُدّد المبنى عام 2021. وإلى جانبه يقوم المسجد الجديد الأكبر، المبني عام
    2002. وشرق القرية تذكّر كنيستان صغيرتان من طراز القاعة من أواخر العصور الوسطى، ساكدريستافي وغفينيتي،
    بدويسي أقدم، مسيحية. وعند طرف القرية تحوّل منشآت رأس نظام ري ألازاني الأعلى مياه النهر نحو حقول السهل.


    قرابة مطلع الألفية عبر آلاف اللاجئين من حرب الشيشان السلسلة إلى الوادي، وظلّ بانكيسي سنواتٍ يُعرف
    في الخارج أساسًا من خلال عناوين صحفية مقلقة. مضت تلك السنوات، والوادي هادئ. تستقبل العائلات الضيوف
    في بيوتها وتمدّ موائد كيستية سخية، وتحافظ نساء القرية على الذكر الصوفي، صلاةً منشَدة في حلقة تدور.


    ليست دويسي معلمًا تلتقط صورته وتمضي. إنها مكان تجلس فيه، وتأكل، وتُصغي.
  tip: >-
    تعالَ ضيفًا لا متفرجًا، والأفضل أن تبيت ليلة لدى عائلة: فرحلة اليوم الواحد لا تُريك في الغالب سوى
    الطريق. هذه قرية مسلمة، فلا تشرب الكحول في الأماكن العامة، وارتدِ ملابس محتشمة تغطي الكتفين والركبتين.
    استأذن قبل دخول أيٍّ من المسجدين، واخلع حذاءك؛ وستحتاج النساء إلى غطاء للرأس. وتجنّب وقت صلاة الظهر
    يوم الجمعة. استأذن دائمًا قبل تصوير الناس، ولا سيما النساء. لا رسوم دخول في أي مكان؛ تكفي ساعة للتجول
    حول المسجدين، وأكثر إن دُعيت إلى المائدة. احمل نقودًا، واملأ خزان الوقود في أخميتا.
  route: >-
    من تبليسي خذ الطريق S5 شرقًا ثم Sh38 عبر ممر غومبوري نحو تيلافي، ثم انعطف غربًا إلى أخميتا واملأ الخزان
    هناك. من أخميتا يمتد طريق شمالًا بمحاذاة ألازاني صعودًا نحو منبعه إلى وادي بانكيسي؛ تقع دويسي على
    بعد نحو 17 كم من البلدة، على أسفلت يضيق كلما انغلق الوادي. المجموع نحو 129 كم وساعتان ونصف. السيارة
    الاقتصادية كافية تمامًا للوصول إلى القرية نفسها؛ ولا يتحول الأسفلت إلى مسار ترابي وعر إلا بعد بيركياني،
    في عمق الوادي.
