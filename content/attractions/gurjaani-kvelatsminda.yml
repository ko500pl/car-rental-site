ka:
  name: გურჯაანის ყველაწმინდა
  short: საქართველოს ერთადერთი ორგუმბათიანი ეკლესია, VIII-IX საუკუნეების, გურჯაანის ზემოთ ტყიან ფერდობზე.
  body: >-
    **ყველაწმინდა ერთადერთი ორგუმბათიანი ეკლესიაა საქართველოში** — და სწორედ ეს ხდის მას სავალდებულო გაჩერებად
    ყველასთვის, ვისაც არქიტექტურა აინტერესებს. ის გურჯაანიდან ორიოდე კილომეტრში, ტყიან ფერდობზე დგას,
    ჩვეულებრივი გზიდან მოშორებით.


    ეკლესია VIII-IX საუკუნეებით თარიღდება და სამნავიანი ბაზილიკაა, რომლის ცენტრალურ ნავზე ორი გუმბათი
    ერთმანეთის მიყოლებით დგას. ეს გადაწყვეტა ქართულ ხუროთმოძღვრებაში სხვაგან არ მეორდება და მისი წარმომავლობა
    ბოლომდე ახსნილი არ არის — ზოგი მკვლევარი სომხურ და სირიულ პარალელებს ეძებს, ზოგი კი ადგილობრივ ექსპერიმენტად
    თვლის.


    შენობა რიყის ქვისა და აგურისაა, დაბალი და მძიმე პროპორციებით. გუმბათები პატარაა და გარედან თითქმის
    უჩინარი, სანამ სამხრეთიდან არ შემოხვალ; ინტერიერში კი მათი ორმაგი სივრცე მაშინვე იგრძნობა. კედლებზე
    შემორჩა XI-XII საუკუნეების მოხატულობის ფრაგმენტები, ძლიერ დაზიანებული, მაგრამ ადგილ-ადგილ ფიგურები
    ჯერ კიდევ იკითხება.


    ეზოში სამრეკლო და გვიანი მინაშენებია, ირგვლივ კი მუხნარია. ეკლესია მოქმედია, თუმცა ყოველდღიური მრევლი
    მცირეა; ხშირად კარი ღიაა და შიგნით არავინაა.


    გურჯაანი თავად სამკურნალო ტალახითა და ღვინით არის ცნობილი, თუმცა ქალაქი თავისთავად უსახურია. ყველაწმინდა
    კი ის მიზეზია, რის გამოც აქ შემობრუნება ღირს.
  tip: >-
    ორმოცდაათი წუთი სავსებით საკმარისია. ბოლო კილომეტრი ტყეში ვიწრო, ხრეშიანი გზაა და წვიმის შემდეგ ლაფიანი
    — ჩვეულებრივი მანქანა გაივლის, ოღონდ ნელა. ჩაცმის წესები მოქმედებს; თავსაფარი შესაძლოა კართან იყოს,
    მაგრამ იმედი ნუ გექნება. შიგნით ბნელია, ფრესკების დასათვალიერებლად ტელეფონის ფარანი გამოგადგება, ოღონდ
    პირდაპირ ფრესკაზე არ მიმართო. ტუალეტი და კაფე გურჯაანშია.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით საგარეჯოსა და ბადიაურის გავლით გურჯაანისკენ — 100 კმ კარგი ასფალტი,
    დაახლოებით საათნახევარი. გურჯაანში ჩრდილო-აღმოსავლეთით მოუხვიე და მიჰყევი ყველაწმინდის მიმანიშნებელს;
    ბოლო ორი-სამი კილომეტრი ფერდობზე ადის და ნაწილობრივ ხრეშია. სულ 105 კმ, დაახლოებით საათი და ორმოცდახუთი-ორმოცდაათი
    წუთი. საწვავი გურჯაანში. ეკონომ-კლასის მანქანა საკმარისია მშრალ ამინდში.
en:
  name: Gurjaani Kvelatsminda
  short: The only two-domed church in Georgia, built in the 8th or 9th century on a wooded slope above
    Gurjaani.
  body: >-
    **Kvelatsminda is the only church in Georgia with two domes,** and that single fact makes it a compulsory
    stop for anyone who cares about architecture. It stands a couple of kilometres above the town of Gurjaani
    on a wooded slope, well off the main road and easy to miss.


    The church dates from the 8th or 9th century. It is a three-nave basilica, but over the central nave
    sit two domes, one behind the other. Nothing else in Georgian architecture repeats the arrangement,
    and its origin is still argued about: some scholars look for Armenian and Syrian parallels, others
    treat it as a local experiment that was tried once and never repeated.


    The fabric is river cobble and brick, and the proportions are low and heavy, closer to a fortified
    hall than to the tall, sharp churches of the later medieval period. From outside the domes are almost
    invisible until you come round to the south; inside, the doubled vertical space registers immediately
    and is genuinely disorienting. Fragments of 11th and 12th-century wall painting survive, badly damaged,
    though figures can still be read in places.


    A bell tower and later additions share the yard, with oak forest all around. The church is in use,
    but the daily congregation is small; more often than not the door is open and there is nobody inside.


    Gurjaani itself is known for wine and for a mud-treatment spa, though the town is unremarkable to
    look at. Kvelatsminda is the reason to turn off here, and half an hour on this slope explains more
    about early Georgian building than a whole day in the valley below.


    One further oddity is worth noticing as you walk out. The two domes are not identical twins — the
    eastern one sits slightly higher and is a little wider, which suggests they were not planned in a
    single stroke.
  tip: >-
    Fifty minutes is plenty. The last kilometre is a narrow gravel road through forest that turns muddy
    after rain; an ordinary car manages it if you go slowly. Dress rules apply, and although headscarves
    are sometimes left by the door you should not count on it. The interior is dark and a phone torch
    helps with the frescoes, but do not shine it directly on the painted surface. Toilets and cafes are
    down in Gurjaani. There is no ticket and no guide on site.
  route: >-
    Take the Kakheti highway from Tbilisi through Sagarejo and Badiauri towards Gurjaani, roughly 100
    km of good asphalt and about an hour and a half. In Gurjaani turn north-east and follow the sign for
    Kvelatsminda; the last two or three kilometres climb the slope and are partly gravel. Total 105 km
    and about an hour and fifty minutes. Fuel is available in Gurjaani. An economy car is sufficient in
    dry weather, and the church pairs well with Tsinandali or with continuing to Sighnaghi.
ru:
  name: Гурджаани Квелацминда
  short: Единственный в Грузии двухкупольный храм VIII-IX веков, стоящий на лесистом склоне над Гурджаани.
  body: >-
    **Квелацминда — единственная в Грузии церковь с двумя куполами,** и одного этого достаточно, чтобы
    она стала обязательной остановкой для всех, кому интересна архитектура. Храм стоит в паре километров
    выше города Гурджаани, на лесистом склоне, в стороне от трассы, и проехать мимо очень легко.


    Церковь датируют VIII-IX веками. Это трёхнефная базилика, но над центральным нефом поставлены два
    купола, один за другим. Больше нигде в грузинском зодчестве это решение не повторяется, и о его происхождении
    до сих пор спорят: одни исследователи ищут армянские и сирийские параллели, другие считают его местным
    экспериментом, который поставили один раз и не повторили.


    Кладка — речной булыжник и кирпич, пропорции низкие и тяжёлые, ближе к укреплённому залу, чем к высоким
    и острым храмам позднего Средневековья. Снаружи купола почти не видны, пока не обойдёшь здание с юга;
    внутри же удвоенное вертикальное пространство ощущается сразу и слегка сбивает с толку. Сохранились
    фрагменты росписи XI-XII веков, сильно повреждённые, но местами фигуры ещё читаются.


    Во дворе стоят колокольня и поздние пристройки, вокруг — дубовый лес. Храм действующий, но повседневного
    прихода почти нет: чаще всего дверь открыта, а внутри пусто.


    Сам Гурджаани известен вином и грязелечебницей, хотя смотреть в городе особо нечего. Ради Квелацминды
    сюда и сворачивают, и полчаса на этом склоне объясняют о раннем грузинском строительстве больше, чем
    целый день в долине.
  tip: >-
    Пятидесяти минут вполне хватает. Последний километр — узкая гравийная дорога через лес, после дождя
    грязная; обычная машина проходит, если не спешить. Действуют правила одежды; платки у входа иногда
    лежат, но рассчитывать на это не стоит. Внутри темно, фонарик телефона помогает разглядеть фрески,
    но светить прямо на красочный слой не надо. Туалеты и кафе — внизу, в Гурджаани. Билета и гида на
    месте нет.
  route: >-
    Из Тбилиси по кахетинской трассе через Сагареджо и Бадиаури в сторону Гурджаани — около 100 км хорошего
    асфальта, примерно полтора часа. В Гурджаани поверните на северо-восток и следуйте указателю на Квелацминду;
    последние два-три километра поднимаются по склону и частично гравийные. Всего 105 км, около часа пятидесяти.
    Заправка есть в Гурджаани. Машины эконом-класса достаточно в сухую погоду, а храм хорошо сочетается
    с Цинандали или с дальнейшей дорогой в Сигнахи.
fa:
  name: کولاتسمیندای گورجانی
  short: تنها کلیسای دوگنبدی گرجستان از سدهٔ هشتم یا نهم، بر دامنه‌ای جنگلی بالای گورجانی.
  body: >-
    **کولاتسمیندا تنها کلیسای گرجستان با دو گنبد است،** و همین یک نکته آن را برای هرکه به معماری علاقه
    دارد توقفی ناگزیر می‌کند. کلیسا دو کیلومتری بالای شهر گورجانی بر دامنه‌ای جنگلی ایستاده، دور از جادهٔ
    اصلی و به‌آسانی از دید می‌افتد.


    بنا به سدهٔ هشتم یا نهم بازمی‌گردد. بازیلیکایی سه‌شبستانی است، اما بر شبستان میانی دو گنبد پشت سر
    هم نشسته‌اند. این ترتیب در هیچ جای دیگر معماری گرجی تکرار نشده و دربارهٔ خاستگاهش هنوز بحث است: برخی
    پژوهشگران دنبال نمونه‌های ارمنی و سوری می‌گردند و برخی آن را آزمونی محلی می‌دانند که یک بار انجام
    شد و دیگر تکرار نشد.


    مصالح، قلوه‌سنگ رودخانه و آجر است و تناسبات کوتاه و سنگین‌اند، نزدیک‌تر به تالاری مستحکم تا به کلیساهای
    بلند و تیز اواخر سده‌های میانه. از بیرون، گنبدها تا وقتی از سمت جنوب دور نزنید تقریباً دیده نمی‌شوند؛
    اما در درون، فضای عمودی دوگانه بی‌درنگ حس می‌شود و کمی گیج‌کننده است. پاره‌هایی از نقاشی دیواری سده‌های
    یازدهم و دوازدهم مانده که سخت آسیب دیده، هرچند جاهایی پیکره‌ها هنوز خوانده می‌شوند.


    برج ناقوس و افزوده‌های متأخر در همان حیاط‌اند و جنگل بلوط گرداگرد آن. کلیسا فعال است اما جماعت روزانه‌اش
    اندک؛ بیشتر اوقات در باز است و کسی داخل نیست.


    خود گورجانی به شراب و آبگرم گِل‌درمانی شهرت دارد، هرچند شهر دیدنی خاصی ندارد. کولاتسمیندا دلیل پیچیدن
    به این سمت است، و نیم ساعت روی این دامنه دربارهٔ ساخت‌وساز کهن گرجی بیش از یک روز کامل در درّه به
    شما می‌آموزد.
  tip: >-
    پنجاه دقیقه کاملاً کافی است. یک کیلومتر پایانی راهی باریک و شنی از میان جنگل است که پس از باران گِلی
    می‌شود؛ خودروی معمولی با سرعت کم از آن می‌گذرد. قواعد پوشش برقرار است و گرچه گاهی روسری کنار در گذاشته‌اند،
    بر آن حساب نکنید. داخل تاریک است و چراغ‌قوهٔ تلفن برای دیدن فرسک‌ها کمک می‌کند، اما نور را مستقیم
    روی لایهٔ رنگ نیندازید. سرویس بهداشتی و کافه پایین در گورجانی است. بلیت و راهنمایی در محل نیست.
  route: >-
    از تفلیس بزرگراه کاختی را از ساگارجو و بادیااوری به سوی گورجانی بگیرید، حدود 100 کیلومتر آسفالت خوب
    و نزدیک یک ساعت و نیم. در گورجانی به شمال شرق بپیچید و تابلوی کولاتسمیندا را دنبال کنید؛ دو سه کیلومتر
    آخر از دامنه بالا می‌رود و بخشی از آن شنی است. جمعاً 105 کیلومتر و حدود یک ساعت و پنجاه دقیقه. سوخت
    در گورجانی هست. خودروی اقتصادی در هوای خشک کافی است و این کلیسا با تسیناندالی یا با ادامهٔ راه به
    سیغناغی خوب جفت می‌شود.
he:
  name: קוולאצמינדה שבגורג'אני
  short: הכנסייה היחידה בגאורגיה בעלת שתי כיפות, מן המאה השמינית או התשיעית, על מדרון מיוער מעל גורג'אני.
  body: >-
    **קוולאצמינדה היא הכנסייה היחידה בגאורגיה בעלת שתי כיפות,** ועובדה אחת זו הופכת אותה לעצירת חובה לכל
    מי שמתעניין באדריכלות. היא עומדת כשני קילומטרים מעל העיירה גורג'אני, על מדרון מיוער, הרחק מן הכביש
    הראשי וקל מאוד לפספס אותה.


    הכנסייה מתוארכת למאה השמינית או התשיעית. זו בזיליקה בת שלושה אולמות, אך מעל האולם המרכזי יושבות שתי
    כיפות, אחת מאחורי השנייה. שום מבנה אחר באדריכלות הגאורגית אינו חוזר על הסידור הזה, ועל מקורו עדיין
    מתווכחים: חוקרים אחדים מחפשים מקבילות ארמניות וסוריות, אחרים רואים בו ניסוי מקומי שנעשה פעם אחת ולא
    חזר.


    חומרי הבנייה הם חלוקי נהר ולבנים, והפרופורציות נמוכות וכבדות, קרובות יותר לאולם מבוצר מאשר לכנסיות
    הגבוהות והחדות של סוף ימי הביניים. מבחוץ הכיפות כמעט אינן נראות עד שמקיפים לצד דרום; מבפנים החלל האנכי
    הכפול נרשם מיד ומבלבל באמת. שרדו שברי ציור קיר מן המאות ה-11 וה-12, פגועים קשות, אך במקומות עוד אפשר
    לקרוא דמויות.


    בחצר עומדים מגדל פעמונים ותוספות מאוחרות, ומסביב יער אלונים. הכנסייה פעילה, אך הקהילה היומיומית קטנה;
    לרוב הדלת פתוחה ואין איש בפנים.


    גורג'אני עצמה ידועה ביין ובמרחץ בוץ טיפולי, אף שאין בעיירה הרבה לראות. קוולאצמינדה היא הסיבה לפנות
    לכאן, וחצי שעה על המדרון הזה מלמדת על הבנייה הגאורגית הקדומה יותר מיום שלם בעמק.
  tip: >-
    חמישים דקות מספיקות בהחלט. הקילומטר האחרון הוא דרך חצץ צרה ביער שנעשית בוצית אחרי גשם; רכב רגיל מתמודד
    איתה בנסיעה איטית. חלים כללי לבוש, ולמרות שלעתים מונחות מטפחות ליד הדלת אין לסמוך על כך. הפנים חשוך
    ופנס טלפון עוזר לראות את ציורי הקיר, אך אל תכוונו אותו ישירות אל שכבת הצבע. שירותים ובתי קפה נמצאים
    למטה בגורג'אני. אין כרטיס ואין מדריך במקום.
  route: >-
    סעו מטביליסי בכביש קחתי דרך סגרג'ו ובאדיאורי לכיוון גורג'אני, כ-100 ק״מ אספלט טוב וכשעה וחצי. בגורג'אני
    פנו צפונה-מזרחה ועקבו אחר השילוט לקוולאצמינדה; שניים-שלושה הקילומטרים האחרונים מטפסים במדרון וחלקם
    חצץ. בסך הכול 105 ק״מ וכשעה וחמישים. דלק יש בגורג'אני. רכב חסכוני מספיק במזג אוויר יבש, והכנסייה משתלבת
    היטב עם צינאנדאלי או עם המשך הנסיעה לסיגנאגי.
ar:
  name: كفيلاتسميندا في غورجاني
  short: الكنيسة الوحيدة في جورجيا بقبتين، من القرن الثامن أو التاسع، على سفح مشجّر فوق غورجاني.
  body: >-
    **كفيلاتسميندا هي الكنيسة الوحيدة في جورجيا ذات القبتين،** وهذه الحقيقة وحدها تجعلها محطة لازمة لكل
    مهتم بالعمارة. تقوم على بعد كيلومترين فوق بلدة غورجاني على سفح مشجّر، بعيداً عن الطريق الرئيسي، ويسهل
    جداً تجاوزها دون انتباه.


    يعود البناء إلى القرن الثامن أو التاسع. وهو بازيليكا بثلاثة صحون، غير أن فوق الصحن الأوسط قبتين، واحدة
    خلف الأخرى. ولا يتكرر هذا الترتيب في أي مكان آخر من العمارة الجورجية، ولا يزال أصله موضع جدل: فباحثون
    يبحثون عن نظائر أرمنية وسورية، وآخرون يعدّونه تجربة محلية جُرّبت مرة ولم تُعَد.


    مادة البناء حصى النهر والآجر، والنسب منخفضة ثقيلة، أقرب إلى قاعة محصنة منها إلى كنائس أواخر العصور
    الوسطى العالية الحادة. ومن الخارج لا تكاد القبتان تُريان حتى تدور إلى الجنوب؛ أما في الداخل فالفراغ
    الرأسي المزدوج يُحس فوراً ويربك الحواس فعلاً. وبقيت شذرات من تصوير جداري من القرنين الحادي عشر والثاني
    عشر، شديدة التلف، وإن ظلت بعض الأشكال مقروءة.


    ويشاركها الفناء برج أجراس وإضافات متأخرة، وغابة بلوط تحيط بالجميع. الكنيسة عاملة لكن رعيّتها اليومية
    قليلة؛ وغالباً ما يكون الباب مفتوحاً ولا أحد في الداخل.


    وغورجاني نفسها معروفة بالخمر وبمنتجع العلاج بالطين، وإن لم يكن في البلدة كثير مما يُرى. كفيلاتسميندا
    هي سبب الانعطاف إلى هنا، ونصف ساعة على هذا السفح تشرح عن البناء الجورجي المبكر أكثر من يوم كامل في
    السهل.
  tip: >-
    خمسون دقيقة تكفي تماماً. الكيلومتر الأخير طريق حصوي ضيق في الغابة يصير طينياً بعد المطر؛ وتتدبره سيارة
    عادية بسرعة منخفضة. وتُطبق قواعد اللباس، ورغم أن الأغطية تُترك أحياناً عند الباب فلا تعوّل عليها.
    والداخل معتم ويساعد ضوء الهاتف على رؤية الرسوم، لكن لا توجّهه مباشرة إلى طبقة اللون. ودورات المياه
    والمقاهي في غورجاني أسفل الطريق. ولا تذكرة ولا مرشد في الموقع.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر ساغاريجو وباديااوري نحو غورجاني، نحو 100 كم من الإسفلت الجيد وقرابة
    ساعة ونصف. وفي غورجاني انعطف شمالاً شرقاً واتبع لافتة كفيلاتسميندا؛ آخر كيلومترين أو ثلاثة تصعد السفح
    وبعضها حصى. المجموع 105 كم ونحو ساعة وخمسين دقيقة. والوقود متوفر في غورجاني. سيارة اقتصادية تكفي في
    الجو الجاف، والكنيسة تنسجم جيداً مع تسيناندالي أو مع متابعة الطريق إلى سيغناغي.
