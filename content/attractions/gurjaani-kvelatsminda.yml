ka:
  name: გურჯაანის ყველაწმინდა
  short: >-
    საქართველოს ერთადერთი შემორჩენილი ორგუმბათიანი ეკლესია — VIII–IX საუკუნეების რიყისა და აგურის ბაზილიკა
    გურჯაანთან, წყნარ კახთუბნის ხეობაში.
  body: >-
    **საქართველოში გუმბათოვანი ეკლესია ურიცხვია, ორგუმბათიანი კი მხოლოდ ერთი — და ის გურჯაანიდან ორ კილომეტრში,
    წყნარ ხეობაში დგას.**


    ყველაწმინდის აგების თარიღი არავის ჩაუწერია. სტილით ის VIII–IX საუკუნეებს ეკუთვნის — „გარდამავალ ხანას“,
    როცა ქართველმა ხუროთმოძღვრებმა კლასიკურ ფორმებს გადაუხვიეს და ისეთ შეხამებებს ეძებდნენ, რაც მანამდე
    არავის უცდია. აქ მათ სამნავიანი ბაზილიკა აიღეს და გუმბათოვანი ტაძარივით გადახურეს. მაღალი შუა ნავი
    სამ კვადრატად იყოფა; პირველსა და მესამეზე, ტრომპებზე, ორი რვაწახნაგა გუმბათი აღმართეს. დააკვირდით
    და დაინახავთ, რომ ტყუპები ერთნაირი არ არიან: დასავლეთის გუმბათი აღმოსავლეთისაზე ოდნავ მაღალი და განიერია.


    კედლები ოსტატის უბის წიგნაკივით იკითხება. გარეთა კედლები, აფსიდა და გვერდითი ნავები ფორმით შერჩეული
    რიყის ქვისაა, კუთხეები შირიმითაა გამაგრებული, მთელი შუა ნავი კი — კედლებით, კამარებითა და გუმბათებით
    — აგურისაა; სვეტისთავებისთვის აგური საგანგებოდ ჩამოუსხამთ. სამივე ნავი ორსართულიანია, დასავლეთით კი
    სამ იარუსად განლაგებული თაღები პატრონიკეზე იხსნება, საიდანაც დიდებულები ლიტურგიას ისმენდნენ. ტაძარი
    ღვთისმშობლის მიძინებას ეძღვნება; სამხრეთ ფასადზე, ნალისებრი თაღის ქვეშ, რიყის ნაცრისფერ წყობაში შირიმის
    ყვითელი ჯვარია ჩასმული.


    ამ ტაძარს თავისი გადმოცემაც აქვს. 1615 წლის შემოდგომაზე, როცა შაჰ-აბასის ლაშქარი ახლოვდებოდა, წინამძღვარ
    იოანეს, როგორც ამბობენ, სიზმარში ღვთისმშობელი გამოეცხადა და უბრძანა, ივერიის ღვთისმშობლის ხატი ახლომახლო
    ეკლესიის სვეტში ამოექოლა. ბერები დაიხოცნენ, ხატი ორ საუკუნეს დაკარგული იყო, სანამ 1820–1822 წლებში
    სხვა წინამძღვარმა, გაბრიელმა, სიზმრად არ იხილა, სად ეძებნა, და ხატი შინ არ დააბრუნა. დღეს მისი ადგილსამყოფელი
    კვლავ უცნობია.


    1845 წელს ბერები ხირსის მონასტერში გადავიდნენ. ორი გუმბათი დარჩა — თითოეული თავის დროზე იჭერს სინათლეს.
  tip: >-
    ნახევარი საათიდან ერთ საათამდე სავსებით საკმარისია. შესვლა უფასოა, ბილეთის სალარო და გიდი არ არის,
    ეკლესია კი შეიძლება დაკეტილი დაგხვდეთ. ისე ჩაიცვით, როგორც ნებისმიერ ქართულ ტაძარში: მხრები და მუხლები
    დაფარული, ქალებს — თავსაფარი. ეკლესიას გარშემო შემოუარეთ: აღმოსავლეთ ფასადი ყველაზე მდიდრულადაა მორთული,
    ყვითელჯვრიან სამხრეთ ფასადს კი ნაშუადღევის მზე ანათებს. შიგნით ბინდია, ამიტომ თვალს ერთი წუთი აცალეთ,
    სანამ გუმბათებს დაინახავს. კაფე, მაღაზია და საწვავი გურჯაანშია, სადაც ახტალის ძველი სამკურნალო ტალახის
    აბანოებიც მდებარეობს.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) აღმოსავლეთით წადით, საგარეჯოს გავლით ბაკურციხემდე, შემდეგ შ42-ით
    ჩრდილოეთით გურჯაანში შედით. ქალაქიდან ორიოდე კილომეტრიანი ვიწრო გზა სამხრეთ-დასავლეთით, კახთუბნის
    ხეობაში ჩადის ეკლესიამდე; ნაწილობრივ გრუნტისაა და წვიმის შემდეგ ნელა სავალი, მაგრამ მშრალ ამინდში
    ეკონომ-კლასის მანქანაც უპრობლემოდ გაივლის. სულ დაახლოებით 112 კილომეტრი და ორ საათამდე, ბოლო მონაკვეთის
    გარდა ასფალტი. საწვავი გურჯაანშია. აქედან წინანდალი და თელავი ჩრდილოეთითაა, სიღნაღი და ბოდბე კი —
    სამხრეთ-აღმოსავლეთით.
en:
  name: Gurjaani Kvelatsminda
  short: >-
    Georgia's only surviving two-domed church: an 8th–9th-century basilica of river cobble and brick in
    the quiet Kakhtubani valley outside Gurjaani.
  body: >-
    **Georgia has countless domed churches, but only one with two domes, and it stands in a quiet valley
    two kilometres from Gurjaani.**


    No one wrote down when Kvelatsminda was built. Its style places it in the 8th or 9th century, the
    "transitional period" when Georgian builders broke with classical forms and experimented. Here they
    took a three-aisled basilica and roofed it like a domed church. The tall central nave is divided into
    three squares, and over the first and third rise two octagonal domes set on squinches. Look closely
    and the twins are not identical: the western dome is slightly taller and wider than the eastern.


    The walls read like a builder's notebook. Outer walls, apse and side aisles are river cobble picked
    for shape; the corners are stiffened with shirimi; and the whole central nave, walls, vaults and domes,
    is brick, with bricks specially moulded for the capitals. All three aisles rise two storeys, and at
    the west end arches open in three tiers onto a gallery from which the nobility followed the liturgy.
    The church is dedicated to the Dormition of the Mother of God, and on the south front a yellow stone
    cross is set into the grey cobble beneath a horseshoe arch.


    The church also has its legend. In the autumn of 1615, as Shah Abbas's army approached, Abbot Ioane
    is said to have dreamt that the Virgin told him to wall up the monastery's icon of the Iberian Mother
    of God inside a pillar of a nearby church. The monks were killed and the icon lost until around 1820–22,
    when another abbot, Gabriel, dreamt where to look and brought it home. Where it is today, no one knows.


    In 1845 the monks left for Khirsa. The two domes stayed, each catching the light in its own time.
  tip: >-
    Half an hour to an hour is plenty. Entry is free, there is no ticket office or guide, and the church
    may be locked. Dress as for any Georgian church: shoulders and knees covered, and a headscarf for
    women. Walk right round the outside; the east front is the most richly decorated, and the south front
    with its yellow cross takes the afternoon sun. The nave is dim, so give your eyes a minute to find
    the domes. Cafés, shops and fuel are back in Gurjaani, which is also home to the old Akhtala mud baths.
  route: >-
    Take the S5 Kakheti highway east past Sagarejo to Bakurtsikhe, then turn north on the Sh42 into Gurjaani.
    From the town a narrow road of about two kilometres runs south-west into the Kakhtubani valley to
    the church; it is partly unsurfaced and slow after rain, but fine for an economy car in dry weather.
    The whole trip is about 112 km and just under two hours, asphalt apart from that last stretch. Fuel
    is in Gurjaani. From here Tsinandali and Telavi lie to the north, and Sighnaghi and Bodbe to the south-east.
ru:
  name: Гурджаанская Квелацминда
  short: >-
    Единственная сохранившаяся в Грузии двухкупольная церковь: базилика VIII–IX века из речного булыжника
    и кирпича в тихой долине Кахтубани у Гурджаани.
  body: >-
    **В Грузии бессчётное множество купольных церквей, но лишь одна с двумя куполами, и она стоит в тихой
    долине в двух километрах от Гурджаани.**


    Никто не записал, когда была построена Квелацминда. По стилю её относят к VIII или IX веку — к «переходному
    периоду», когда грузинские зодчие отошли от классических форм и начали экспериментировать. Здесь они
    взяли трёхнефную базилику и перекрыли её, как купольную церковь. Высокий центральный неф разделён
    на три квадрата, а над первым и третьим поднимаются два восьмигранных купола на тромпах. Присмотритесь
    — близнецы не одинаковы: западный купол чуть выше и шире восточного.


    Стены читаются как записная книжка строителя. Наружные стены, апсида и боковые нефы — из речного булыжника,
    подобранного по форме; углы укреплены камнем ширими; а весь центральный неф — стены, своды и купола
    — из кирпича, причём кирпичи для капителей отливали особо. Все три нефа поднимаются на два этажа,
    а на западном конце три яруса арок открываются на галерею, откуда знать следила за литургией. Церковь
    посвящена Успению Богородицы, а на южном фасаде под подковообразной аркой в серый булыжник вставлен
    жёлтый каменный крест.


    Есть у церкви и своя легенда. Осенью 1615 года, когда войско шаха Аббаса приближалось, настоятелю
    Иоанну, по преданию, приснилось, что Богородица велела ему заложить в столб соседней церкви монастырскую
    икону Иверской Богоматери. Монахов убили, а икона считалась утраченной, пока около 1820–22 годов другому
    настоятелю, Гавриилу, не приснилось, где искать, и он не вернул её. Где она сейчас — неизвестно.


    В 1845 году монахи ушли в Хирсу. Два купола остались, и каждый ловит свет в свой час.
  tip: >-
    Получаса-часа вполне достаточно. Вход бесплатный, кассы или экскурсовода нет, а церковь может быть
    заперта. Одевайтесь как в любую грузинскую церковь: плечи и колени закрыты, женщинам — платок на голову.
    Пройдите вокруг снаружи; восточный фасад украшен богаче всего, а южный, с жёлтым крестом, ловит послеполуденное
    солнце. Внутри темно, дайте глазам минуту, чтобы разглядеть купола. Кафе, магазины и заправка — в
    Гурджаани, где также находятся старые грязевые ванны Ахтала.
  route: >-
    Езжайте по кахетинской трассе S5 на восток через Сагареджо до Бакурцихе, затем на север по Sh42 в
    Гурджаани. От города узкая дорога протяжённостью около двух километров ведёт на юго-запад в долину
    Кахтубани к церкви; местами она без покрытия и после дождя по ней едешь медленно, но в сухую погоду
    проедет и машина эконом-класса. Весь путь — около 112 км и чуть меньше двух часов, асфальт везде,
    кроме последнего отрезка. Заправка — в Гурджаани. Отсюда Цинандали и Телави лежат к северу, а Сигнахи
    и Бодбе — к юго-востоку.
fa:
  name: کوِلاتسمیندای گورجانی
  short: >-
    تنها کلیسای دوگنبدیِ باقی‌مانده در گرجستان: بازیلیکایی از قلوه‌سنگ رودخانه‌ای و آجر، از سدهٔ هشتم
    یا نهم، در درهٔ آرام کاختوبانی نزدیک گورجانی.
  body: >-
    **گرجستان کلیساهای گنبددار بی‌شماری دارد، اما تنها یکی با دو گنبد، و آن در دره‌ای آرام، دو کیلومتر
    دورتر از گورجانی، برپاست.**


    هیچ‌کس زمان ساخت کوِلاتسمیندا را ثبت نکرده است. سبک آن به سدهٔ هشتم یا نهم بازمی‌گردد، «دوران گذار»
    که در آن معماران گرجی از شکل‌های کلاسیک گسستند و به آزمایش پرداختند. در این‌جا آنان بازیلیکایی سه‌ناوی
    را برگزیدند و آن را چون کلیسایی گنبددار سرپوشیده کردند. ناوِ مرکزی بلند به سه بخش مربع تقسیم شده،
    و بر فراز بخش نخست و سوم دو گنبد هشت‌ضلعی بر سکنج‌ها برخاسته‌اند. با دقت بنگرید: این دو همزاد یکسان
    نیستند؛ گنبد غربی اندکی بلندتر و پهن‌تر از گنبد شرقی است.


    دیوارها چون دفترچهٔ یادداشت معمار خوانده می‌شوند. دیوارهای بیرونی، آپسید و ناوهای کناری از قلوه‌سنگ
    رودخانه‌ای برگزیده به شکل ساخته شده‌اند؛ گوشه‌ها با سنگ شیریمی استحکام یافته‌اند؛ و تمامی ناوِ مرکزی
    - دیوارها، طاق‌ها و گنبدها - از آجر است، با آجرهایی که ویژهٔ سرستون‌ها قالب‌ریزی شده‌اند. هر سه ناو
    دو طبقه بالا می‌روند، و در انتهای غربی، طاق‌هایی در سه ردیف به رواقی گشوده می‌شوند که اشراف از آن‌جا
    مراسم عبادت را می‌نگریستند. کلیسا به رقاد مریم مقدس تقدیم شده، و بر نمای جنوبی، صلیبی از سنگ زرد در
    میان قلوه‌سنگ‌های خاکستری، زیر طاقی نعل‌اسبی جای گرفته است.


    این کلیسا افسانهٔ خود را نیز دارد. در پاییز سال ۱۶۱۵، هنگامی که سپاه شاه‌عباس نزدیک می‌شد، گفته می‌شود
    ایوانه، رئیس صومعه، خوابی دید که در آن مریم مقدس به او فرمود شمایلِ مادرِ خدای ایبری را، که از آنِ
    صومعه بود، درون ستونی از کلیسایی نزدیک پنهان کند و رویش را دیوار بکشد. راهبان کشته شدند و شمایل گم
    ماند تا حدود سال‌های ۱۸۲۰-۲۲، که رئیس صومعهٔ دیگری، گابریل، در خواب دید کجا باید جست و آن را بازگرداند.
    امروز کجاست، کسی نمی‌داند.


    در سال ۱۸۴۵ راهبان به سوی خیرسا رفتند. دو گنبد ماندند، هرکدام به وقت خویش نور را در خود می‌گیرند.
  tip: >-
    نیم تا یک ساعت کافی است. ورود رایگان است، دفتر بلیت یا راهنمایی نیست، و کلیسا ممکن است قفل باشد. مانند
    هر کلیسای گرجی بپوشید: شانه‌ها و زانوها پوشیده، و برای زنان روسری. دورتادور بیرون کلیسا بگردید؛ نمای
    شرقی بیش از همه تزیین شده، و نمای جنوبی با صلیب زردش نور بعدازظهر را می‌گیرد. درون ناو تاریک است،
    چند لحظه به چشمانتان فرصت دهید تا گنبدها را بیابند. کافه‌ها، مغازه‌ها و سوخت‌گیری در گورجانی است،
    جایی که حمام‌های گِلی کهنِ آختالا نیز در آن قرار دارد.
  route: >-
    بزرگراه کاختی، مسیر S5، را به سوی شرق بگیرید و از ساگارجو گذشته تا باکورتسیخه بروید، سپس در Sh42 به
    شمال، به سوی گورجانی بپیچید. از شهر، راهی باریک به طول حدود دو کیلومتر به سوی جنوب غرب، به درهٔ کاختوبانی
    و کلیسا می‌رود؛ بخشی از آن بدون آسفالت و پس از باران کند است، اما در روز خشک با خودرویی اقتصادی قابل
    عبور است. مسافت کل حدود ۱۱۲ کیلومتر و کمی کمتر از دو ساعت، همه آسفالت جز آن بخش پایانی. سوخت‌گیری
    در گورجانی. از این‌جا تسیناندالی و تلاوی در شمال قرار دارند، و سیقناقی و بودبه در جنوب‌شرق.
he:
  name: קוולצמינדה שבגורג'אני
  short: >-
    הכנסייה הדו-כיפתית היחידה שנותרה בגאורגיה: בזיליקה מהמאה ה-8 או ה-9 מצרור נחל ולבנים, בעמק קחטובני
    השקט מחוץ לגורג'אני.
  body: >-
    **לגאורגיה כנסיות כיפה בלי ספור, אך רק אחת עם שתי כיפות, והיא עומדת בעמק שקט שני קילומטרים מגורג'אני.**


    איש לא רשם מתי נבנתה קוולצמינדה. סגנונה מציב אותה במאה ה-8 או ה-9, “התקופה המעברית” שבה בנאים גאורגים
    פרצו מהצורות הקלאסיות והתנסו בחדשות. כאן הם לקחו בזיליקה תלת-ספינתית וקירו אותה כמו כנסיית כיפה. הספן
    המרכזי הגבוה מחולק לשלושה ריבועים, ומעל הראשון והשלישי מתרוממות שתי כיפות מתומנות הנשענות על קשתות
    פינה (טרומפים). הביטו מקרוב, והתאומות אינן זהות: הכיפה המערבית גבוהה ורחבה במקצת יותר מהמזרחית.


    הקירות נקראים כפנקס של בנאי. הקירות החיצוניים, האפסיס והספינות הצדדיות הם צרור נחל שנבחר לפי צורתו;
    הפינות מחוזקות באבן שירימי; וכל הספן המרכזי, קירות, כיפות ותקרות מקומרות, בנוי לבנים, עם לבנים שנוצקו
    במיוחד לכותרות. שלוש הספינות מתרוממות לשתי קומות, ובקצה המערבי נפתחות קשתות בשלוש שורות אל גלריה שממנה
    עקבו האצילים אחר הליטורגיה. הכנסייה מוקדשת להירדמות אם האלוהים, ועל החזית הדרומית שקוע צלב אבן צהוב
    בצרור האפור מתחת לקשת פרסה.


    לכנסייה יש גם אגדה משלה. בסתיו 1615, כשצבאו של השאה עבאס התקרב, נאמר שראש המנזר יואנה חלם שהבתולה
    אמרה לו להטמין את האיקונה של אם האלוהים האיברית, השייכת למנזר, בתוך עמוד של כנסייה קרובה. הנזירים
    נהרגו והאיקונה נעלמה עד סביבות 1820–1822, אז חלם ראש מנזר אחר, גבריאל, היכן לחפש, והביא אותה הביתה.
    איפה היא היום, איש אינו יודע.


    ב-1845 עזבו הנזירים לחירסה. שתי הכיפות נותרו, כל אחת קולטת את האור בזמנה שלה.
  tip: >-
    חצי שעה עד שעה מספיקה. הכניסה חינם, אין דוכן כרטיסים או מדריך, והכנסייה עשויה להיות נעולה. התלבשו
    כמו לכל כנסייה גאורגית: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש. הקיפו את הכנסייה ברגל מבחוץ; החזית
    המזרחית היא המעוטרת ביותר, והחזית הדרומית עם הצלב הצהוב קולטת את שמש אחר הצהריים. הספן חשוך, אז תנו
    לעיניכם דקה למצוא את הכיפות. בתי קפה, חנויות ותדלוק בגורג'אני, שם נמצאים גם מרחצאות הבוץ הוותיקים
    של אחטלה.
  route: >-
    סעו מזרחה בכביש הראשי של קאחתי (S5), דרך סאגארג'ו אל בקורציחה, ואז פנו צפונה בדרך Sh42 לגורג'אני.
    מהעיר דרך צרה של כשני קילומטרים מובילה דרום-מערבה לעמק קחטובני ולכנסייה; חלקה לא סלולה ואיטית לאחר
    גשם, אך במזג אוויר יבש עבירה גם לרכב חסכוני. הנסיעה כולה כ-112 ק"מ ופחות משעתיים במקצת, אספלט מלבד
    הקטע האחרון. תדלוק בגורג'אני. מכאן ציננדלי וטלאווי שוכנות בצפון, וסיגנאגי ובודבה בדרום-מזרח.
ar:
  name: كفيلاتسميندا في غورجاني
  short: >-
    الكنيسة الوحيدة ذات القبتين الباقية في جورجيا: بازيليكا من الحصى النهري والآجر تعود إلى القرن الثامن
    أو التاسع، في وادي كاختوباني الهادئ خارج غورجاني.
  body: >-
    **تضم جورجيا كنائس ذات قباب لا حصر لها، لكن واحدة فقط بقبتين، وهي قائمة في وادٍ هادئ على بعد كيلومترين
    من غورجاني.**


    لم يسجل أحد متى بُنيت كفيلاتسميندا. يضعها أسلوبها في القرن الثامن أو التاسع، «المرحلة الانتقالية»
    التي خرج فيها البناؤون الجورجيون عن الأشكال الكلاسيكية وجرّبوا أشكالًا جديدة. هنا أخذوا بازيليكا ثلاثية
    الأروقة وسقفوها كأنها كنيسة ذات قبة. يُقسَّم الصحن المركزي المرتفع إلى ثلاثة مربعات، وترتفع فوق الأول
    والثالث قبتان ثمانيتا الأضلاع مرتكزتان على حنايا ركنية. انظر بدقة، فالقبتان لا تتماثلان: القبة الغربية
    أطول وأعرض قليلًا من الشرقية.


    تُقرأ الجدران كدفتر ملاحظات البنّاء. الجدران الخارجية والحنية والأروقة الجانبية من حصى نهري مختار
    بحسب شكله؛ والزوايا مقوّاة بحجر شيريمي؛ وكل الصحن المركزي - الجدران والأقبية والقباب - من الآجر، مع
    آجر مصبوب خصيصًا للتيجان. ترتفع الأروقة الثلاثة إلى طابقين، وفي الطرف الغربي تنفتح عقود في ثلاثة مستويات
    على شرفة كان النبلاء يتابعون منها القداس. الكنيسة مكرّسة لرقاد والدة الإله، وعلى الواجهة الجنوبية
    يُثبَّت صليب حجري أصفر في الحصى الرمادي تحت عقد حدوي (على شكل حدوة حصان).


    وللكنيسة أسطورتها أيضًا. في خريف عام 1615، حين اقترب جيش الشاه عباس، يُقال إن رئيس الدير يوانه رأى
    في المنام أن السيدة العذراء طلبت منه أن يخبّئ أيقونة والدة الإله الإيبيرية الخاصة بالدير داخل عمود
    في كنيسة قريبة ويسدّ عليها. قُتل الرهبان وضاعت الأيقونة حتى نحو 1820–1822، عندما رأى رئيس دير آخر،
    غابرييل، في المنام أين يبحث، فأعادها إلى الدير. لا أحد يعرف مكانها اليوم.


    في عام 1845 غادر الرهبان إلى خيرسا. بقيت القبتان، كل واحدة تلتقط الضوء في وقتها.
  tip: >-
    نصف ساعة إلى ساعة تكفي تمامًا. الدخول مجاني، لا يوجد شباك تذاكر أو مرشد، وقد تكون الكنيسة مغلقة. البس
    كما تفعل في أي كنيسة جورجية: الكتفان والركبتان مستورتان، وعلى النساء ارتداء غطاء رأس. تجوّل حول الكنيسة
    من الخارج؛ الواجهة الشرقية هي الأكثر زخرفة، والواجهة الجنوبية بصليبها الأصفر تلتقط شمس بعد الظهر.
    الصحن معتم، فأعطِ عينيك دقيقة لتتبين القبتين. المقاهي والمحلات والوقود في غورجاني، التي تضم أيضًا
    حمامات الطين القديمة في أختالا.
  route: >-
    خذ طريق كاختي السريع S5 شرقًا متجاوزًا ساغاريجو إلى باكورتسيخه، ثم انحرف شمالًا على الطريق Sh42 إلى
    غورجاني. من البلدة، يمتد طريق ضيق طوله نحو كيلومترين جنوب غربًا إلى وادي كاختوباني والكنيسة؛ جزء منه
    غير معبّد وبطيء بعد المطر، لكنه مناسب لسيارة اقتصادية في الطقس الجاف. الرحلة كلها نحو 112 كم وأقل
    من ساعتين بقليل، إسفلت باستثناء ذلك المقطع الأخير. التزود بالوقود في غورجاني. من هنا تقع تسيناندالي
    وتيلافي شمالًا، وسيغناغي وبودبه إلى الجنوب الشرقي.
