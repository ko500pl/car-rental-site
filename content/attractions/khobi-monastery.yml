ka:
  name: ხობის ღვთისმშობლის მიძინების მონასტერი
  short: >-
    დადიანების საგვარეულო სავანე ხობთან: XIII საუკუნის ჩუქურთმიანი ეკლესია ღია გალერეით, მთავრების პორტრეტებითა
    და ზიხეთიდან ჩამოტანილი მარმარილოთი.
  body: >-
    **სამეგრელოს მთავრებს ხობში სამი რამ მოჰქონდათ: თავიანთი მიცვალებულები, სიწმინდეები და ომის ნადავლი.**
    ეკლესია სოფელ ნოჯიხევში, ხობიდან სამ-ოთხ კილომეტრში ჩრდილოეთით, ხობისწყლის მარცხენა ნაპირზე დგას,
    თხილის ბაღებით გარშემორტყმული.


    ხობი — მაშინ ხოპი — პირველად 1212-1222 წლებით დათარიღებულ ჩანაწერში ჩნდება, იერუსალიმის ჯვრის მონასტრის
    აღაპებში, სადაც მისი ეპისკოპოსი ეგნატე იხსენიება. ღვთისმშობლის მიძინების ეკლესია, რომელსაც დღეს ხედავთ,
    უგუმბათო დარბაზია ჯვრული კამარებით; ზუსტი თარიღი დაკარგულია, თუმცა ვახტანგ ბერიძის დათარიღება — XIII
    საუკუნის მეორე ნახევარი — ფართოდაა გაზიარებული. დასავლეთისა და სამხრეთის ფასადებს ღია გალერეა გასდევს,
    კედლებზე კი ამოკვეთილი ჯვრები, წნული და მცენარეული ორნამენტი ნამდვილი ოსტატის ხელს ამჟღავნებს.


    შიგნით მხატვრობის ორი ფენაა: XIII-XIV საუკუნეებისა, გვიანბიზანტიური, პალეოლოგოსური ხელოვნების გავლენით,
    და XVII საუკუნისა. ქტიტორები მოძებნეთ: ჩრდილოეთ კედელზე გიორგი დადიანს ეკლესიის მოდელი უჭირავს და
    წარწერა მას „საყდრის აღმაშენებელს“ უწოდებს; აქვე არიან შერგილ დადიანი, მისი მეუღლე ნათელა და ყმაწვილი
    ცოტნე. სამხრეთის ეკვდერში ასომთავრული წარწერა მოგვითხრობს, რომ ვამეყ I დადიანმა (გარდ. 1396) ზიხეთზე
    გამარჯვების შემდეგ მარმარილოს სვეტები, კაპიტელები და ამბიონის ნატეხები ჩამოიტანა; ზოგი მათგანი V საუკუნის
    ბიზანტიური ნაკვეთია და კედლებში ორდენებივით არის ჩასმული.


    XVII საუკუნის მოგზაურები აქ ღვთისმშობლის კვართის თაყვანისცემას აღწერდნენ, წმინდა მარინესა და კვირიკეს
    ნაწილებთან ერთად; კვართი დღეს ზუგდიდში, დადიანების სასახლის მუზეუმში ინახება. აკაკი წერეთელმა ხობის
    მონასტერს პოემა „ნათელა“ მიუძღვნა.


    საბჭოთა წლებში დახურული ხობი დღეს კვლავ დედათა მონასტერია; გალავნიან ეზოში XIV–XVII საუკუნეების გუმბათიანი
    ქვის სამრეკლო დგას. გვიან ნაშუადღევს მოდით, როცა ჩუქურთმიანი ფასადები თბება და ზარის ხმა თხილის ბაღებს
    გადაუვლის.
  tip: >-
    ერთი საათი საკმარისია. ეს მოქმედი დედათა მონასტერია: ქალებს თავსაფარი და მუხლს ქვემოთ კაბა სჭირდებათ,
    მამაკაცებს გრძელი შარვალი. ეკლესიაში ფოტოს გადაღებაზე ჩვეულებრივ უარს გეტყვიან — კამერის აწევამდე
    ეზოშიც იკითხეთ. ხმადაბლა ილაპარაკეთ: მონაზვნები აქ ცხოვრობენ. ეზოში მარტივი საპირფარეშოა, კაფე კი
    არა; მაღაზიები და საცხობები ხობშია. ქვის ინტერიერი გაზაფხულამდე ცივი და ნესტიანია, ამიტომ თბილი ტანსაცმელი
    იქონიეთ. სექტემბერში მისასვლელ გზაზე ეზოებში გასაშრობად გაშლილ თხილსაც შეამჩნევთ.
  route: >-
    თბილისიდან დაახლოებით 308 კმ და 4 საათი და 35 წუთია. E60 მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის
    გავლით სენაკამდე იარეთ, შემდეგ ზუგდიდის მიმართულებით გააგრძელეთ და ხობის შესახვევს აიღეთ. ქალაქიდან
    მონასტრამდე 3–4 კილომეტრია ჩრდილოეთით, სოფელ ნოჯიხევისკენ, ვიწრო, ადგილ-ადგილ დაკერებულ ასფალტზე —
    დაბალი მანქანაც უპრობლემოდ გაივლის. ნიშნები მოკრძალებულია; მაღალი სამრეკლო უკეთესი ორიენტირია. კარიბჭესთან
    მანქანის დაყენება უფასოა. საწვავი სენაკში ან ზუგდიდში ჩაასხით. ეკონომ-კლასის ავტომობილი მთელი წლის
    განმავლობაში საკმარისია.
en:
  name: Khobi Monastery
  short: >-
    The Dadiani family abbey near Khobi: a carved 13th-century church with an open gallery, princely portraits
    and Byzantine marble won in a medieval war.
  body: >-
    **The princes of Mingrelia brought three things to Khobi: their dead, their relics and their trophies.**
    The church stands in the village of Nojikhevi, three or four kilometres north of Khobi town, on the
    left bank of the Khobistskali, ringed by hazelnut orchards.


    Khobi — then Khopi — first appears in a record dated 1212–1222, a memorial list from the Georgian
    Monastery of the Cross in Jerusalem naming its bishop Egnate. The church of the Dormition is a domeless
    hall with cross vaults; its exact date is lost, but Vakhtang Beridze's dating to the second half of
    the 13th century is widely accepted. An open gallery runs along the west and south façades, and the
    walls carry carved crosses, interlace and leafwork of real finesse.


    Inside are two layers of painting: 13th–14th-century work touched by late Byzantine Palaiologan art,
    and a 17th-century layer. Look for the donors. On the north wall Giorgi Dadiani holds a model of the
    church, and the inscription calls him its builder; nearby are Shergil Dadiani, his wife Natela and
    the young Tsotne. In the southern chapel an asomtavruli inscription records that Vameq I Dadiani (d.
    1396) brought marble columns, capitals and pieces of an ambo home from his victory over Zichia; some
    are Byzantine carvings as old as the 5th century, set into the walls like medals.


    Seventeenth-century travellers saw the Virgin's robe venerated here, with relics of Saints Marina
    and Kvirike (Cyricus); the robe is kept today in the Dadiani Palace museum in Zugdidi. Akaki Tsereteli
    dedicated his poem "Natela" to the monastery.


    Closed in Soviet times, Khobi is a convent again, and a domed stone bell tower of the 14th–17th centuries
    rises in its walled yard. Come in the late afternoon, when the carved façades warm and the bell carries
    over the nut orchards.
  tip: >-
    An hour is enough. This is a working convent: women need a headscarf and a skirt below the knee, men
    long trousers. Photography inside the church is usually refused, and it is polite to ask even in the
    yard. Keep voices low; the nuns live here. There is a basic toilet in the grounds but no café; shops
    and bakeries are in Khobi. The stone interior stays cold and damp until well into spring, so bring
    a warm layer. In September you may see hazelnuts spread out to dry in the yards along the approach.
  route: >-
    About 308 km and 4 hours 35 minutes from Tbilisi. Take the E60 motorway west past Kutaisi and Samtredia
    to Senaki, continue towards Zugdidi and take the Khobi turning. From the town the monastery is 3–4
    km north, towards the village of Nojikhevi, on a narrow, patched asphalt lane that low cars manage
    without trouble. Signs are modest; the tall bell tower is the better landmark. Parking by the gate
    is free. Refuel in Senaki or Zugdidi. An economy car is fine all year.
ru:
  name: Хобский монастырь
  short: >-
    Родовая обитель Дадиани у Хоби: резная церковь XIII века с открытой галереей, портретами князей и
    византийским мрамором — трофеем средневековой войны.
  body: >-
    **Мегрельские владетельные князья приносили в Хоби три вещи: своих мёртвых, свои святыни и свои трофеи.**
    Церковь стоит в селе Ноджихеви, в трёх-четырёх километрах к северу от города Хоби, на левом берегу
    Хобисцкали, в кольце ореховых садов.


    Хоби — тогда Хопи — впервые упоминается в записи, датированной 1212–1222 годами: в поминальном списке
    грузинского Крестового монастыря в Иерусалиме назван его епископ Эгнатэ. Церковь Успения Богородицы
    — бескупольный зальный храм с крестовыми сводами; точная дата постройки утрачена, но датировка Вахтанга
    Беридзе — вторая половина XIII века — принята большинством исследователей. Вдоль западного и южного
    фасадов тянется открытая галерея, а стены покрыты резными крестами, плетёнкой и растительным орнаментом
    настоящей тонкости.


    Внутри два слоя росписи: работы XIII–XIV веков, отмеченные влиянием поздневизантийского палеологовского
    искусства, и слой XVII века. Найдите ктиторов. На северной стене Георгий Дадиани держит модель храма,
    и надпись называет его строителем; рядом — Шергил Дадиани, его жена Натела и юный Цотне. В южном приделе
    надпись, выполненная асомтаврули, сообщает, что Вамек I Дадиани (ум. 1396) привёз домой после победы
    над Зихией мраморные колонны, капители и фрагменты амвона; среди них есть византийская резьба, восходящая
    к V веку, — её вставили в стены, словно ордена.


    Путешественники XVII века видели, как здесь почитали ризу Богородицы, а вместе с ней мощи святых Марины
    и Квирике; сегодня риза хранится в музее Дворца Дадиани в Зугдиди. Акакий Церетели посвятил монастырю
    поэму «Натела».


    Закрытый в советское время, Хоби снова стал женским монастырём, и в его обнесённом стеной дворе поднимается
    каменная колокольня с куполом, построенная в XIV–XVII веках. Приезжайте ближе к вечеру, когда резные
    фасады теплеют, а звон колокола плывёт над ореховыми садами.
  tip: >-
    Часа достаточно. Это действующий женский монастырь: женщинам нужны платок и юбка ниже колена, мужчинам
    — длинные брюки. Снимать внутри церкви обычно не разрешают, и даже во дворе стоит вежливо спросить
    разрешения. Говорите вполголоса: здесь живут монахини. На территории есть простой туалет, но кафе
    нет; магазины и пекарни — в Хоби. В каменном храме холодно и сыро ещё долго после прихода весны, так
    что захватите что-нибудь тёплое. В сентябре во дворах вдоль дороги можно увидеть фундук, рассыпанный
    для просушки.
  route: >-
    Около 308 км и 4 часа 35 минут от Тбилиси. Езжайте по автомагистрали E60 на запад мимо Кутаиси и Самтредиа
    до Сенаки, продолжайте в сторону Зугдиди и сверните на Хоби. От города до монастыря 3–4 км на север,
    в сторону села Ноджихеви, по узкой латаной асфальтовой дороге, с которой низкие машины справляются
    без труда. Указатели скромные; высокая колокольня — ориентир понадёжнее. Парковка у ворот бесплатная.
    Заправьтесь в Сенаки или Зугдиди. Машины эконом-класса хватит круглый год.
fa:
  name: صومعهٔ خوبی
  short: >-
    صومعهٔ خاندانی دادیانی‌ها نزدیک شهر خوبی: کلیسای کنده‌کاری‌شدهٔ سدهٔ سیزدهم با رواقی باز، چهرهٔ شاهزادگان
    و مرمر بیزانسی که غنیمت جنگی سده‌های میانه بود.
  body: >-
    **شاهزادگان مگرلیا سه چیز را به صومعهٔ خوبی می‌آوردند: مردگانشان، اشیای متبرکشان و غنیمت‌هایشان.**
    کلیسا در روستای نوجیخوی، سه چهار کیلومتری شمال شهر خوبی، بر کرانهٔ چپ رود خوبیستسقالی ایستاده و باغ‌های
    فندق گرداگردش را گرفته‌اند.


    نام خوبی — که آن زمان خوپی بود — نخستین بار در سندی از سال‌های ۱۲۱۲–۱۲۲۲ پیدا می‌شود: فهرست یادبودی
    در صومعهٔ گرجی صلیب در اورشلیم که از اسقف آن، اگناته، نام می‌برد. کلیسای خفتن مریم مقدس تالاری بی‌گنبد
    با طاق‌های متقاطع است؛ تاریخ دقیق ساختش از دست رفته، اما تاریخ‌گذاری واختانگ بریدزه — نیمهٔ دوم سدهٔ
    سیزدهم — به‌طور گسترده پذیرفته شده است. رواقی باز در امتداد نماهای غربی و جنوبی کشیده شده و دیوارها
    صلیب‌های کنده‌کاری‌شده، نقش‌های درهم‌بافته و برگ‌نگاره‌هایی با ظرافتی راستین دارند.


    در درون دو لایه نقاشی دیواری هست: آثار سده‌های سیزدهم و چهاردهم که از هنر بیزانسی متأخر دوران پالئولوگ‌ها
    اثر پذیرفته‌اند، و لایه‌ای از سدهٔ هفدهم. بانیان را پیدا کنید. بر دیوار شمالی گیورگی دادیانی ماکت
    کلیسا را در دست دارد و کتیبه او را سازندهٔ آن می‌خواند؛ نزدیک او شرگیل دادیانی، همسرش ناتلا و تسوتنهٔ
    جوان دیده می‌شوند. در نمازخانهٔ جنوبی کتیبه‌ای به خط آسومتاورولی می‌گوید که وامق یکم دادیانی (درگذشته
    به سال ۱۳۹۶) ستون‌های مرمرین، سرستون‌ها و تکه‌هایی از یک منبر کلیسایی را پس از پیروزی بر زیخیا به
    خانه آورد؛ برخی از آن‌ها کنده‌کاری‌های بیزانسی‌اند که قدمتشان به سدهٔ پنجم می‌رسد و همچون نشان‌های
    افتخار در دیوارها نشانده شده‌اند.


    مسافران سدهٔ هفدهم دیدند که اینجا ردای مریم مقدس را همراه با بقایای متبرک قدیسان مارینا و کویریکه
    گرامی می‌دارند؛ این ردا امروز در موزهٔ کاخ دادیانی در زوگدیدی نگهداری می‌شود. آکاکی تسرتلی منظومهٔ
    «ناتلا» را به این صومعه پیشکش کرد.


    صومعهٔ خوبی که در دوران شوروی بسته شده بود، اکنون دوباره صومعهٔ زنان است و در حیاط محصورش ناقوس‌خانه‌ای
    سنگی و گنبددار از سده‌های چهاردهم تا هفدهم سر برافراشته است. نزدیک غروب بیایید، وقتی نماهای کنده‌کاری‌شده
    گرم می‌شوند و صدای ناقوس بر فراز باغ‌های فندق می‌پیچد.
  tip: >-
    یک ساعت کافی است. اینجا صومعهٔ زنانهٔ فعالی است: بانوان به روسری و دامنی بلندتر از زانو نیاز دارند
    و آقایان به شلوار بلند. عکاسی درون کلیسا معمولاً مجاز نیست و ادب حکم می‌کند حتی در حیاط هم اجازه بگیرید.
    آهسته سخن بگویید؛ راهبه‌ها اینجا زندگی می‌کنند. در محوطه سرویس بهداشتی ساده‌ای هست اما کافه نیست؛
    مغازه‌ها و نانوایی‌ها در شهر خوبی‌اند. درون سنگی کلیسا تا مدت‌ها پس از آمدن بهار سرد و نمور می‌ماند،
    پس یک لایه لباس گرم همراه داشته باشید. در سپتامبر شاید ببینید فندق‌ها را در حیاط‌های کنار راه برای
    خشک شدن پهن کرده‌اند.
  route: >-
    از تفلیس حدود ۳۰۸ کیلومتر و ۴ ساعت و ۳۵ دقیقه راه است. بزرگراه E60 را به سوی غرب بگیرید، از کنار کوتائیسی
    و سامتردیا تا سناکی بروید، به سمت زوگدیدی ادامه دهید و در دوراهیِ شهر خوبی بپیچید. صومعه ۳ تا ۴ کیلومتر
    شمال شهر است، به سوی روستای نوجیخوی، در جاده‌ای آسفالتهٔ باریک و وصله‌پینه که خودروهای کف‌کوتاه هم
    بی‌دردسر از آن می‌گذرند. تابلوها کم‌پیدایند؛ ناقوس‌خانهٔ بلند نشانهٔ بهتری است. پارکینگ کنار دروازه
    رایگان است. در سناکی یا زوگدیدی سوخت بزنید. خودروی کلاس اقتصادی در تمام سال کافی است.
he:
  name: מנזר חובי
  short: >-
    מנזר משפחת דדיאני סמוך לחובי: כנסייה מגולפת מהמאה ה-13 עם גלריה פתוחה, דיוקנאות נסיכים ושיש ביזנטי
    שנלקח כשלל במלחמה בימי הביניים.
  body: >-
    **נסיכי מגרליה הביאו לחובי שלושה דברים: את מתיהם, את שרידי הקודש שלהם ואת שלל המלחמה שלהם.** הכנסייה
    עומדת בכפר נוג'יחווי, שלושה-ארבעה קילומטרים צפונית לעיירה חובי, על הגדה השמאלית של החוביסצקלי, מוקפת
    מטעי אגוזי לוז.


    חובי – אז חופי – מופיעה לראשונה ברישום מן השנים 1212–1222, רשימת הזכרה של המנזר הגאורגי של המצלבה
    בירושלים, הנוקבת בשם הבישוף של חובי, אגנטה. כנסיית הדורמיציון (הירדמותה של מרים) היא כנסיית אולם ללא
    כיפה ובה קמרונות מצטלבים; תאריך בנייתה המדויק אבד, אך תיארוכו של וחטנג ברידזה – המחצית השנייה של המאה
    ה-13 – מקובל על רוב החוקרים. גלריה פתוחה נמשכת לאורך החזיתות המערבית והדרומית, ועל הקירות מגולפים
    צלבים, עיטורי שזירה ועיטורי עלווה בעדינות של ממש.


    בפנים שתי שכבות של ציורי קיר: עבודות מהמאות ה-13–14 שניכרת בהן השפעת האמנות הביזנטית המאוחרת של תקופת
    הפלאיולוגים, ושכבה מהמאה ה-17. חפשו את התורמים. על הקיר הצפוני מחזיק גיורגי דדיאני דגם של הכנסייה,
    והכתובת מכנה אותו בונה הכנסייה; לידו שרגיל דדיאני, אשתו נאטלה וצוטנה הצעיר. בקפלה הדרומית מספרת כתובת
    בכתב אסומטברולי שוואמק הראשון דדיאני (מת ב-1396) הביא הביתה מניצחונו על זיכיה עמודי שיש, כותרות ושברי
    אמבו (בימת קריאה); יש ביניהם גילופים ביזנטיים עתיקים כבני המאה ה-5, המשובצים בקירות כמו עיטורי כבוד.


    נוסעים מהמאה ה-17 ראו כאן כיצד נערצת גלימתה של מרים הבתולה, יחד עם שרידי הקדושים מרינה וקוויריקה;
    הגלימה שמורה כיום במוזיאון ארמון דדיאני בזוגדידי. אקאקי צרתלי הקדיש למנזר את הפואמה שלו "נאטלה".


    המנזר בחובי, שנסגר בתקופה הסובייטית, חזר להיות מנזר נשים, ובחצרו המוקפת חומה מתנשא מגדל פעמונים מאבן
    בעל כיפה, מהמאות ה-14–17. בואו בשעות אחר הצהריים המאוחרות, כשהחזיתות המגולפות מתחממות וצליל הפעמון
    נישא מעל מטעי אגוזי הלוז.
  tip: >-
    שעה מספיקה. זהו מנזר נשים פעיל: נשים צריכות כיסוי ראש וחצאית שמכסה את הברכיים, גברים מכנסיים ארוכים.
    צילום בתוך הכנסייה בדרך כלל אסור, ומנומס לשאול גם בחצר. דברו בשקט; הנזירות גרות כאן. בשטח יש שירותים
    בסיסיים אך אין בית קפה; חנויות ומאפיות יש בחובי. חלל האבן בפנים נשאר קר ולח עד עמוק לתוך האביב, אז
    הביאו שכבה חמה. בספטמבר אולי תראו אגוזי לוז פרושים לייבוש בחצרות שלאורך הדרך.
  route: >-
    כ-308 ק"מ ו-4 שעות ו-35 דקות מטביליסי. סעו מערבה בכביש המהיר E60 על פני קוטאיסי וסמטרדיה עד סנאקי,
    המשיכו לכיוון זוגדידי ופנו בפנייה לחובי. מהעיירה המנזר נמצא 3–4 ק"מ צפונה, לכיוון הכפר נוג'יחווי,
    בדרך אספלט צרה ומטולאת שרכבים נמוכים עוברים בלי בעיה. השילוט צנוע; מגדל הפעמונים הגבוה הוא נקודת ציון
    טובה יותר. החניה ליד השער חינם. תדלקו בסנאקי או בזוגדידי. רכב אקונומי מתאים כל השנה.
ar:
  name: دير خوبي
  short: >-
    دير آل دادياني قرب خوبي: كنيسة منحوتة من القرن الثالث عشر برواق مفتوح وصور للأمراء ورخام بيزنطي غُنم
    في حرب من العصور الوسطى.
  body: >-
    **حمل أمراء ميغريليا إلى خوبي ثلاثة أشياء: موتاهم، وذخائرهم المقدسة، وغنائمهم.** تقوم الكنيسة في قرية
    نوجيخيفي، على بعد ثلاثة إلى أربعة كيلومترات شمال بلدة خوبي، على الضفة اليسرى لنهر خوبيستسكالي، تحيط
    بها بساتين البندق.


    يظهر اسم خوبي — وكان يُنطق آنذاك بباءٍ مهموسة — لأول مرة في سجلّ مؤرخ بين 1212 و1222، هو قائمة تذكارية
    من دير المصلّبة الجورجي في القدس تذكر أسقفها إغناتي. كنيسة رقاد السيدة العذراء كنيسة قاعة بلا قبة
    ذات أقبية متقاطعة؛ ضاع تاريخها الدقيق، غير أن تأريخ فاختانغ بيريدزه لها بالنصف الثاني من القرن الثالث
    عشر مقبول على نطاق واسع. يمتد رواق مفتوح على طول الواجهتين الغربية والجنوبية، وتحمل الجدران صلبانًا
    منحوتة وزخارف مضفورة ونقوشًا نباتية بالغة الرهافة.


    في الداخل طبقتان من الرسوم الجدارية: أعمال من القرنين الثالث عشر والرابع عشر يلوح فيها أثر الفن البيزنطي
    المتأخر في عهد آل باليولوج، وطبقة من القرن السابع عشر. ابحث عن الواهبين. على الجدار الشمالي يحمل غيورغي
    دادياني نموذجًا للكنيسة، وتصفه الكتابة بأنه بانيها؛ وبالقرب منه شيرغيل دادياني وزوجته ناتيلا والفتى
    تسوتني. وفي المصلى الجنوبي تروي كتابة بخط الأسومتافرولي أن فامق الأول دادياني (توفي 1396) جلب إلى
    دياره من انتصاره على زيخيا أعمدة رخامية وتيجانًا وقطعًا من منبر كنسي (أمبون)؛ وبينها منحوتات بيزنطية
    يرقى عهدها إلى القرن الخامس، مثبّتة في الجدران كالأوسمة.


    رأى رحالة القرن السابع عشر هنا ثوب السيدة العذراء موضع تبجيل، ومعه ذخائر القديسين مارينا وكفيريكي؛
    ويُحفظ الثوب اليوم في متحف قصر دادياني في زوغديدي. وقد أهدى أكاكي تسيريتيلي قصيدته «ناتيلا» إلى الدير.


    أُغلق الدير في الحقبة السوفييتية، ثم عاد ديرًا للراهبات، وفي فنائه المسوّر يرتفع برج أجراس حجري ذو
    قبة يعود إلى القرون من الرابع عشر إلى السابع عشر. تعالَ في آخر العصر، حين تدفأ الواجهات المنحوتة ويسري
    صوت الجرس فوق بساتين البندق.
  tip: >-
    تكفي ساعة. هذا دير راهبات عامر: تحتاج النساء إلى غطاء رأس وتنورة تتجاوز الركبة، والرجال إلى سراويل
    طويلة. غالبًا ما يُمنع التصوير داخل الكنيسة، ومن اللياقة الاستئذان حتى في الفناء. اخفض صوتك، فالراهبات
    يعشن هنا. في الأرض المحيطة مرحاض بسيط ولا مقهى؛ المتاجر والمخابز في خوبي. يبقى الداخل الحجري باردًا
    رطبًا حتى وقت متأخر من الربيع، فاحمل معك طبقة دافئة. وفي سبتمبر قد ترى البندق مفروشًا ليجفّ في الأفنية
    على طول الطريق المؤدي إلى الدير.
  route: >-
    نحو 308 كم و4 ساعات و35 دقيقة من تبليسي. اسلك الطريق السريع E60 غربًا مرورًا بكوتايسي وسامتريديا حتى
    سيناكي، وتابع نحو زوغديدي ثم انعطف عند مفترق خوبي. من البلدة يقع الدير على بعد 3–4 كم شمالًا، باتجاه
    قرية نوجيخيفي، على طريق إسفلتي ضيق مرقّع تجتازه السيارات المنخفضة دون عناء. اللافتات متواضعة، وبرج
    الأجراس العالي علامة أهدى. الوقوف عند البوابة مجاني. تزوّد بالوقود في سيناكي أو زوغديدي. تكفي سيارة
    اقتصادية طوال العام.
