ka:
  name: ხობის ღვთისმშობლის მიძინების მონასტერი
  short: XIII საუკუნის უგუმბათო ეკლესია დადიანების საძვალით, ქვის კვეთით და ღია გალერეით, ხობის ჩრდილოეთით.
  body: >-
    **ხობის მონასტერი დადიანების საგვარეულო სავანე და საძვალე იყო** — და დღემდე სამეგრელოს ერთ-ერთი ყველაზე
    დახვეწილი შუასაუკუნეების ნაგებობაა. ის სოფელ ნოჯიხევში, ხობის ჩრდილოეთით სამიოდე კილომეტრში დგას.


    ღვთისმშობლის მიძინების ეკლესია უგუმბათო დარბაზული ტიპისაა, ჯვრული კამარებით. ზუსტი თარიღი უცნობია,
    თუმცა ხელოვნებათმცოდნე ვახტანგ ბერიძის დათარიღება — XIII საუკუნის მეორე ნახევარი — დღეს საყოველთაოდ
    მიღებულია. მონასტერი პირველად 1212-1222 წლების ქართულ საბუთშია ნახსენები, სადაც ეპისკოპოსი ეგნატე
    იხსენიება.


    დასავლეთისა და სამხრეთის ფასადებს ღია გალერეა უვლის, ჩრდილო-დასავლეთსა და სამხრეთ-დასავლეთ კუთხეებში
    კი ცალკე სამლოცველოებია. ფასადები ქვის კვეთითაა შემკული — ჯვრები, გეომეტრიული ორნამენტი და მცენარეული
    მოტივები. ვამეყ I დადიანმა, რომელიც 1396 წელს გარდაიცვალა, ზიხეთის ლაშქრობიდან ბიზანტიური მარმარილოს
    ფრაგმენტები ჩამოიტანა და შენობაში ჩააშენა; ისინი დღემდე ჩანს.


    შიგნით კედლის მხატვრობის ორი ფენაა: XIII-XIV საუკუნეების, პალეოლოგოსური გავლენით, და XVII საუკუნის.
    ორივე ფრაგმენტულია — კედლის დიდი ნაწილი შელესილია და გამურული, — თუმცა ადგილ-ადგილ სახეები, ნიმბები
    და ბერძნულ-ქართული წარწერები კარგად იკითხება. საკურთხევლის მხარეს მხატვრობა ყველაზე უკეთ არის შემორჩენილი.


    ხობი განსაკუთრებით რელიქვიებით იყო ცნობილი. XVII საუკუნის მოგზაურები აქ ღვთისმშობლის კვართს და წმინდა
    მარინესა და კვირიკეს ნაწილებს ხედავდნენ. კვართი მოგვიანებით ზუგდიდში გადაიტანეს, სადაც დღეს ინახება.


    ღია გალერეა მეგრული ჩვევაა ისევე, როგორც არქიტექტურული ხერხი: დაბლობის ეკლესიებში ის დაკრძალვისა და
    იმ ადამიანების ადგილი იყო, ვისაც შიგნით შესვლა არ შეეძლო. სწორედ აქ ასაფლავებდნენ დადიანებს — გავლისას
    იატაკის ფილებს დახედე, წარწერები ჯერ კიდევ იკითხება.


    გარშემო თხილის ბაღებია. ხობის მუნიციპალიტეტი საქართველოს მთავარი თხილის რაიონებშია და სექტემბერში
    მისასვლელი გზის ეზოებში გამომშრალი გულები აქვთ დაფენილი. ეს დეტალი კარგი გასახსენებელია: მონასტერი
    უდაბნოში არასოდეს მდგარა — ის ყოველთვის დამუშავებული, ჩუმი დაბლობის შუაგულში იყო.


    საბჭოთა პერიოდში მონასტერი დაიხურა; დღეს აქ დედათა მონასტერია. ეზოში XIX საუკუნის სამრეკლო და ძველი
    გალავნის ნაშთებია, ირგვლივ კი ბაღი, ბზა და მაღალი ხეები. ზაფხულში აქ ისეთი ჩრდილია, რომ ჰაერიც კი
    გრილია. ვიზიტორი ცოტაა, სიჩუმე კი სრული და ეკლესიაშიც ხშირად მარტო რჩები. ერთი საათი საკმარისია, მაგრამ
    ეს ის ადგილია, სადაც ადამიანი უნებურად ნელა დადის.
  tip: >-
    ერთი საათი კმარა. მოქმედი დედათა მონასტერია: ჩაცმის წესები მკაცრად მოქმედებს, ქალებისთვის თავსაფარი
    და გრძელი კალთა, მამაკაცებისთვის გრძელი შარვალი. ხმამაღლა ლაპარაკი და ფოტოს გადაღება ეზოში მაინც შეთანხმებით
    ჯობია, შიგნით კი ხშირად აკრძალულია. ტუალეტი ეზოშია მარტივი. მაღაზია და კაფე ხობის ცენტრშია, სამ კილომეტრში;
    მონასტერთან არაფერი იყიდება. ზაფხულში ჩრდილი უხვია, ზამთარში კი ეკლესია ცივი და ნესტიანია — თბილად
    ჩაიცვი, რადგან ქვა მთელი დღე სიცივეს ინარჩუნებს.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით და ხობის შესახვევამდე — დაახლოებით 308 კმ
    და ოთხ საათ ნახევარზე ცოტა მეტი. ხობიდან მონასტრამდე კიდევ სამიოდე კილომეტრია ჩრდილოეთით, სოფელ ნოჯიხევისკენ;
    გზა ვიწრო ასფალტია, ორმოებით, მაგრამ დაბალი მანქანისთვისაც გასავლელი. ნიშანი მოკრძალებულია, ორიენტირად
    სამრეკლო გამოგადგება. პარკირება კარიბჭესთან უფასოა და ჩრდილშია. საწვავი სენაკში ან ზუგდიდში აიღე,
    ხობში სადგური ყოველთვის არ მუშაობს. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში სავსებით საკმარისია.
en:
  name: Khobi Monastery
  short: >-
    A 13th-century domeless church with carved facades, an open gallery and the burial vault of the Dadiani
    princes.
  body: >-
    **Khobi was the family abbey and burial ground of the Dadiani,** and it remains one of the most refined
    medieval buildings in Mingrelia. It stands in the village of Nojikhevi, some three kilometres north
    of the town of Khobi.


    The church of the Dormition of the Virgin is a domeless hall church with cross vaults. Its exact date
    is not recorded, but the art historian Vakhtang Beridze's dating to the second half of the thirteenth
    century is generally accepted. The monastery first appears in a Georgian document of 1212–1222, which
    names a bishop called Egnate.


    An open gallery runs along the western and southern facades, and there are separate chapels in the
    north-western and south-western corners. The facades carry carved stonework — crosses, geometric bands
    and plant motifs — of a quality you rarely see on a provincial church. Vameq I Dadiani, who died in
    1396, brought back fragments of Byzantine marble from a campaign against Zichia and had them built
    into the fabric; they are still visible.


    Inside there are two layers of wall painting: thirteenth- and fourteenth-century work showing Palaiologan
    influence, and a seventeenth-century layer. Both are fragmentary, but in places faces and inscriptions
    read clearly.


    Khobi was best known for its relics. Seventeenth-century travellers recorded the Robe of the Virgin
    here, together with relics of Saints Marina and Cyriacus. The robe was later moved to Zugdidi, where
    it is kept today, which is one good reason to see the two places on the same day.


    The open gallery is a Mingrelian habit as much as an architectural device. In the lowland churches
    it gave covered space for burials and for people who could not go inside, and here it is where the
    Dadiani laid their dead; look down at the floor slabs as you pass; some inscriptions can still be
    read.


    The land around is hazelnut. Khobi is one of the main nut-growing districts in Georgia, and in September
    the yards along the approach road are spread with drying kernels. The monastery has never stood in
    a wilderness, only in a quiet piece of farmed lowland worked for as long as the church has stood.


    The monastery was closed in the Soviet period and now houses a community of nuns. In the yard stand
    a bell tower and stretches of the old enclosure wall, with a garden and tall trees around them. Visitors
    are few and the quiet is complete; this is a place where people find themselves walking slowly.
  tip: >-
    An hour is enough. This is a working convent, so dress rules are taken seriously: headscarf and long
    skirt for women, long trousers for men. Keep your voice down, ask before photographing in the yard,
    and expect photography inside to be refused. There is a simple toilet in the grounds. Shops and cafés
    are in Khobi town, three kilometres away. In summer there is plenty of shade; in winter the church
    is cold and damp, so dress warmly, as the stone holds the chill all day.
  route: >-
    From Tbilisi take the E60 to Senaki, continue towards Zugdidi and take the Khobi turning — about 308
    km and a little over four and a half hours. From Khobi the monastery is another three kilometres north,
    towards the village of Nojikhevi. That last stretch is narrow asphalt with potholes, but a low car
    will manage it without trouble. Signposting is modest, so navigate by the bell tower. Parking at the
    gate is free. Refuel in Senaki or Zugdidi. An economy car is entirely sufficient.
ru:
  name: Хобский монастырь
  short: Бескупольная церковь XIII века с резными фасадами, открытой галереей и родовой усыпальницей князей
    Дадиани.
  body: >-
    **Хоби был родовой обителью и усыпальницей Дадиани** и остаётся одной из самых тонких средневековых
    построек Мегрелии. Монастырь стоит в селе Ноджихеви, примерно в трёх километрах к северу от города
    Хоби.


    Церковь Успения Богородицы — бескупольный зальный храм с крестовыми сводами. Точная дата не записана,
    но датировка искусствоведа Вахтанга Беридзе — вторая половина XIII века — принята сегодня повсеместно.
    Впервые монастырь упоминается в грузинском документе 1212–1222 годов, где назван епископ Эгнате.


    Вдоль западного и южного фасадов идёт открытая галерея, а в северо-западном и юго-западном углах устроены
    отдельные приделы. Фасады украшены каменной резьбой — кресты, геометрические полосы, растительные
    мотивы — качества, редкого для провинциального храма. Вамек I Дадиани, умерший в 1396 году, привёз
    из похода на Зихию куски византийского мрамора и вставил их в кладку; они видны до сих пор.


    Внутри два слоя стенописи: XIII–XIV веков, с палеологовским влиянием, и XVII века. Оба фрагментарны,
    но местами лица и надписи читаются отчётливо.


    Больше всего Хоби был известен реликвиями. Путешественники XVII века видели здесь ризу Богородицы,
    а также частицы мощей святых Марины и Кирика. Ризу позже перенесли в Зугдиди, где она хранится и сегодня,
    — хороший повод осмотреть оба места в один день.


    Открытая галерея — привычка мегрельская не меньше, чем архитектурный приём. В низинных храмах она
    давала крытое место для погребений и для тех, кто не мог войти внутрь; здесь в ней хоронили Дадиани.
    Посмотрите под ноги на плиты пола: часть надписей ещё читается.


    Вокруг — фундук. Хобский муниципалитет один из главных ореховых районов Грузии, и в сентябре дворы
    вдоль подъездной дороги застелены сохнущими ядрами. Об этом стоит помнить: монастырь никогда не стоял
    в пустыне, только среди тихой обработанной низины, которую возделывают ровно столько, сколько стоит
    церковь.


    В советское время монастырь закрыли; сейчас здесь женская обитель. Во дворе стоят колокольня и участки
    старой ограды, вокруг сад и высокие деревья. Посетителей мало, тишина полная. Часа на осмотр хватает,
    но здесь люди сами собой начинают ходить медленно.
  tip: >-
    Часа достаточно. Это действующий женский монастырь, и правила одежды соблюдаются строго: платок и
    длинная юбка для женщин, длинные брюки для мужчин. Говорите тише, во дворе спрашивайте разрешение
    на съёмку, а внутри снимать, скорее всего, не разрешат. Простой туалет есть на территории. Магазины
    и кафе — в городе Хоби, в трёх километрах. Летом здесь много тени, зимой в церкви холодно и сыро,
    так что оденьтесь теплее.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше в сторону Зугдиди и поворот на Хоби — около 308 км и чуть больше
    четырёх с половиной часов. От Хоби до монастыря ещё три километра на север, в сторону села Ноджихеви.
    Последний отрезок — узкий асфальт с ямами, но низкая машина проходит его без проблем. Указатели скромные,
    ориентируйтесь на колокольню. Парковка у ворот бесплатная. Заправляйтесь в Сенаки или Зугдиди. Машины
    эконом-класса вполне достаточно.
fa:
  name: صومعهٔ خوبی
  short: کلیسایی بی‌گنبد از سدهٔ سیزدهم با نمای کنده‌کاری‌شده، ایوانی باز و آرامگاه خاندان داديانی.
  body: >-
    **خوبی صومعهٔ خانوادگی و آرامگاه داديانی‌ها بود** و هنوز یکی از ظریف‌ترین بناهای سده‌های میانه در
    مینگرلیا است. در روستای نوجیخِوی، حدود سه کیلومتری شمال شهر خوبی، ایستاده است.


    کلیسای خوابیدگی مریم تالاری بی‌گنبد با طاق‌های چلیپایی است. تاریخ دقیقش ثبت نشده، اما تاریخ‌گذاری
    واختانگ بریدزهٔ هنرشناس به نیمهٔ دوم سدهٔ سیزدهم امروز عمومی پذیرفته شده است. نخستین یادکرد صومعه
    در سندی گرجی از سال‌های ۱۲۱۲ تا ۱۲۲۲ است که از اسقفی به نام اِگناته نام می‌برد.


    ایوانی باز در امتداد نمای غربی و جنوبی کشیده شده و در گوشه‌های شمال غربی و جنوب غربی نمازخانه‌های
    جداگانه هست. نماها کنده‌کاری سنگی دارند — صلیب‌ها، نوارهای هندسی و نقش‌های گیاهی — با کیفیتی که بر
    کلیسایی ولایتی کمتر می‌بینید. وامِک یکم داديانی که در ۱۳۹۶ درگذشت، پاره‌های مرمر بیزانسی را از لشکرکشی
    به زیخیا آورد و در بدنهٔ بنا کار گذاشت؛ هنوز دیده می‌شوند.


    در درون دو لایه نقاشی دیواری هست: کار سده‌های سیزدهم و چهاردهم با تأثیر پالئولوگ، و لایه‌ای از سدهٔ
    هفدهم. هر دو پاره‌پاره‌اند، اما جاهایی چهره‌ها و کتیبه‌ها روشن خوانده می‌شوند.


    خوبی بیش از همه به یادگارهای مقدسش شناخته می‌شد. مسافران سدهٔ هفدهم جامهٔ مریم را اینجا دیده‌اند،
    همراه با پاره‌هایی از پیکر قدیسان مارینا و کیریاکوس. جامه بعدها به زوگدیدی برده شد و امروز آنجا نگهداری
    می‌شود؛ دلیلی خوب برای دیدن هر دو جا در یک روز.


    ایوان باز به همان اندازه که شگرد معماری است، عادتی مینگرلی هم هست. در کلیساهای جلگه‌ای فضایی سرپوشیده
    برای خاکسپاری و برای کسانی فراهم می‌کرد که اجازهٔ ورود نداشتند، و همین‌جا بود که داديانی‌ها مردگانشان
    را می‌گذاشتند؛ هنگام گذر به سنگ‌فرش کف نگاه کنید، برخی کتیبه‌ها هنوز خواندنی است.


    زمین پیرامون فندق است. شهرستان خوبی از مهم‌ترین نواحی فندق‌خیز گرجستان است و در شهریور حیاط‌های کنار
    جادهٔ ورودی از مغزهای در حال خشک شدن پوشیده می‌شود. یادآوری این نکته سودمند است: صومعه هرگز در بیابان
    نایستاده، بلکه همیشه در دل جلگه‌ای آرام و کشت‌شده بوده است.


    صومعه در دورهٔ شوروی بسته شد و امروز جامعه‌ای از راهبه‌ها در آن است. در حیاط برج ناقوس و بخش‌هایی
    از حصار کهن مانده و گرداگردشان باغ و درختان بلند است. بازدیدکننده کم است و سکوت کامل. یک ساعت کافی
    است، اما اینجا آدم ناخودآگاه آهسته راه می‌رود.
  tip: >-
    یک ساعت بس است. اینجا صومعه‌ای فعال است و قواعد پوشش جدی گرفته می‌شود: روسری و دامن بلند برای زنان
    و شلوار بلند برای مردان. صدایتان را پایین نگه دارید، برای عکاسی در حیاط اجازه بگیرید و انتظار داشته
    باشید که عکاسی در داخل ممنوع باشد. سرویس بهداشتی ساده‌ای در محوطه هست. مغازه و کافه در شهر خوبی و
    در سه کیلومتری است. تابستان سایه فراوان است و زمستان کلیسا سرد و نمناک، پس گرم بپوشید.
  route: >-
    از تفلیس با E60 تا سناکی، سپس به سوی زوگدیدی و انشعاب خوبی — حدود ۳۰۸ کیلومتر و کمی بیش از چهار ساعت
    و نیم. از خوبی تا صومعه سه کیلومتر دیگر به شمال، به سوی روستای نوجیخِوی است. این بخش پایانی آسفالت
    باریک و چاله‌دار است، اما خودروی کم‌ارتفاع هم بی‌دردسر از آن می‌گذرد. تابلوها کم‌رنگ‌اند، پس برج ناقوس
    را نشانه بگیرید. پارک کردن کنار دروازه رایگان است. سوخت را در سناکی یا زوگدیدی بگیرید. خودروی اقتصادی
    کاملاً کافی است.
he:
  name: מנזר חובי
  short: כנסייה מן המאה ה-13 בלי כיפה, עם חזיתות מגולפות, גלריה פתוחה ומקום קבורתם של נסיכי דאדיאני.
  body: >-
    **חובי היה המנזר המשפחתי ומקום הקבורה של בית דאדיאני,** והוא נותר אחד המבנים המעודנים ביותר של ימי
    הביניים במינגרליה. הוא עומד בכפר נוג׳יחווי, כשלושה קילומטרים מצפון לעיירה חובי.


    כנסיית הירדמות הבתולה היא כנסיית אולם ללא כיפה, עם קמרונות צולבים. תאריכה המדויק לא נרשם, אך תיארוכו
    של חוקר האמנות ואחטנג ברידזה למחצית השנייה של המאה השלוש-עשרה מקובל היום על הכול. המנזר מופיע לראשונה
    במסמך גאורגי משנות 1212–1222, שבו נזכר בישוף בשם אגנטה.


    גלריה פתוחה נמשכת לאורך החזיתות המערבית והדרומית, ובפינות הצפונית-מערבית והדרומית-מערבית יש קפלות
    נפרדות. החזיתות נושאות גילופי אבן — צלבים, רצועות גיאומטריות ומוטיבים צמחיים — באיכות שנדיר לראות
    בכנסייה כפרית. ואמק הראשון דאדיאני, שמת ב-1396, הביא שברי שיש ביזנטי ממסע מלחמה נגד זיכיה ושיקע אותם
    בבנייה; הם נראים עד היום.


    בפנים שתי שכבות של ציורי קיר: עבודה מן המאות השלוש-עשרה והארבע-עשרה בהשפעה פליאולוגית, ושכבה מן המאה
    השבע-עשרה. שתיהן מקוטעות, אך במקומות מסוימים פנים וכתובות נקראות היטב.


    חובי נודע בעיקר בשל שרידי הקדושים שבו. נוסעים מן המאה השבע-עשרה תיארו כאן את גלימת הבתולה ולצדה שרידים
    של הקדושות מרינה וקיריאקוס. הגלימה הועברה לימים לזוגדידי, שם היא נשמרת כיום, וזו סיבה טובה לראות את
    שני המקומות באותו יום.


    הגלריה הפתוחה היא הרגל מינגרלי לא פחות משהיא אמצעי אדריכלי. בכנסיות המישור היא סיפקה מקום מקורה לקבורה
    ולאנשים שלא יכלו להיכנס פנימה, וכאן קברו בה בני דאדיאני את מתיהם; הביטו למטה בלוחות הרצפה בעוברכם,
    שכן חלק מן הכתובות עדיין ניתנות לקריאה.


    הקרקע מסביב היא אגוזי לוז. חובי הוא אחד ממחוזות גידול האגוזים המרכזיים בגאורגיה, ובספטמבר החצרות לאורך
    דרך הגישה מכוסות בגרעינים מתייבשים. כדאי לזכור זאת: המנזר מעולם לא עמד בשממה, אלא בפיסת מישור מעובד
    ושקט.


    בתקופה הסובייטית נסגר המנזר, וכיום שוכנת בו קהילת נזירות. בחצר עומדים מגדל פעמונים וקטעים מחומת ההיקף
    הישנה, ומסביבם גן ועצים גבוהים. המבקרים מעטים והשקט מוחלט. שעה מכסה את האתר, אך זה מקום שבו אנשים
    מוצאים את עצמם הולכים לאט.
  tip: >-
    שעה מספיקה. זהו מנזר נזירות פעיל, וכללי הלבוש נשמרים בקפידה: מטפחת וחצאית ארוכה לנשים, מכנסיים ארוכים
    לגברים. דברו בשקט, בקשו רשות לצלם בחצר, וצפו שבפנים לא יאפשרו לצלם. יש שירותים פשוטים בשטח. חנויות
    ובתי קפה נמצאים בעיירה חובי, שלושה קילומטרים משם. בקיץ יש כאן צל בשפע, ובחורף הכנסייה קרה ולחה, לכן
    התלבשו בהתאם, שכן האבן שומרת על הקור לאורך כל היום. שאלו לפני שנכנסים, מפני שלעיתים מתקיימת תפילה.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לכיוון זוגדידי ובפנייה לחובי — כ-308 ק״מ וקצת יותר מארבע וחצי שעות.
    מחובי עוד שלושה קילומטרים צפונה, לכיוון הכפר נוג׳יחווי. הקטע האחרון הוא אספלט צר עם בורות, אך גם רכב
    נמוך עובר בו בלי קושי. השילוט צנוע, לכן נווטו לפי מגדל הפעמונים. החניה ליד השער חינם. תדלקו בסנאקי
    או בזוגדידי. רכב חסכוני מספיק לחלוטין.
ar:
  name: دير خوبي
  short: كنيسة من القرن الثالث عشر بلا قبة، بواجهات منقوشة ورواق مفتوح ومدفن أمراء داديياني.
  body: >-
    **كان خوبي ديراً لآل داديياني ومدفناً لهم،** وما زال من أرهف مباني العصور الوسطى في مينغريليا. يقوم
    في قرية نوجيخيفي، على نحو ثلاثة كيلومترات شمال بلدة خوبي.


    كنيسة رقاد العذراء كنيسة صحن بلا قبة، بأقبية متصالبة. ولم يُسجَّل تاريخها الدقيق، غير أن تأريخ مؤرخ
    الفن فاختانغ بيريدزه لها بالنصف الثاني من القرن الثالث عشر مقبول اليوم على نطاق واسع. وأول ذكر للدير
    في وثيقة جورجية من سنوات 1212–1222 تسمي أسقفاً يدعى إغناتي.


    يمتد رواق مفتوح على طول الواجهتين الغربية والجنوبية، وفي الركنين الشمالي الغربي والجنوبي الغربي مصليان
    منفصلان. وتحمل الواجهات نقشاً حجرياً — صلباناً وأشرطة هندسية وزخارف نباتية — بجودة نادرة على كنيسة
    ريفية. وقد جلب فامِك الأول داديياني، المتوفى سنة 1396، شذرات من الرخام البيزنطي من حملة على زيخيا
    وأدخلها في البناء؛ وهي ظاهرة إلى اليوم.


    وفي الداخل طبقتان من التصوير الجداري: عمل من القرنين الثالث عشر والرابع عشر بتأثير پالايولوغي، وطبقة
    من القرن السابع عشر. وكلتاهما مجزأة، غير أن الوجوه والكتابات تُقرأ بوضوح في مواضع.


    اشتهر خوبي أكثر ما اشتهر بذخائره. فقد سجّل رحالة القرن السابع عشر وجود ثوب العذراء هنا، ومعه رفات
    القديستين مارينا وكيرياكوس. ونُقل الثوب لاحقاً إلى زوغديدي حيث يُحفظ اليوم، وهذا سبب وجيه لزيارة الموضعين
    في يوم واحد.


    الرواق المفتوح عادة مينغريلية بقدر ما هو حيلة معمارية. ففي كنائس السهل كان يوفر مكاناً مسقوفاً للدفن
    ولمن لا يستطيع الدخول، وفيه وضع آل داديياني موتاهم؛ فانظر إلى بلاطات الأرض وأنت تمر، فبعض الكتابات
    ما زال يُقرأ.


    والأرض من حول الدير بندق. فبلدية خوبي من أهم مناطق زراعة البندق في جورجيا، وفي أيلول تُفرش أفنية الطريق
    المؤدي إليه بالحبات المجففة. وهي ملاحظة نافعة: لم يقم هذا الدير يوماً في برية، بل في بقعة سهلية هادئة
    مزروعة منذ أن قامت الكنيسة.


    أُغلق الدير في العهد السوفييتي، وتقيم فيه اليوم جماعة من الراهبات. وفي الفناء برج أجراس وبقايا من
    السور القديم، وحولهما حديقة وأشجار عالية. الزوار قليلون والسكون تام. ساعة تكفي للموقع، لكنه مكان يجد
    المرء نفسه فيه يمشي على مهل.
  tip: >-
    ساعة تكفي. هذا دير راهبات عامل، وقواعد اللباس تُراعى بجدية: غطاء رأس وتنورة طويلة للنساء، وسروال طويل
    للرجال. اخفض صوتك، واستأذن قبل التصوير في الفناء، وتوقع منع التصوير في الداخل. في المحيط دورة مياه
    بسيطة. أما المتاجر والمقاهي ففي بلدة خوبي على بعد ثلاثة كيلومترات. في الصيف ظل وافر، وفي الشتاء تكون
    الكنيسة باردة رطبة، فالبس ثياباً دافئة لأن الحجر يحتفظ بالبرد طوال النهار. واسأل قبل الدخول، فقد تكون
    هناك صلاة قائمة.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم باتجاه زوغديدي ومنعطف خوبي — نحو 308 كم وأكثر قليلاً من أربع
    ساعات ونصف. ومن خوبي إلى الدير ثلاثة كيلومترات أخرى شمالاً نحو قرية نوجيخيفي. هذا المقطع الأخير إسفلت
    ضيق فيه حفر، لكن السيارة المنخفضة تجتازه دون عناء. اللافتات متواضعة، فاهتدِ ببرج الأجراس. الوقوف عند
    البوابة مجاني. تزوّد بالوقود في سيناكي أو زوغديدي. والسيارة الاقتصادية كافية تماماً.
