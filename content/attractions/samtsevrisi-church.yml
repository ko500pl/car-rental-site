ka:
  name: სამწევრისის წმინდა გიორგის ეკლესია
  short: VII საუკუნის პატარა თავისუფალი ჯვრის ტიპის ეკლესია ბორცვზე მტკვრის ველის თავზე, უჩვეულოდ სუფთა
    გეომეტრიით.
  body: >-
    **სამწევრისი პატარაა და სწორედ ამიტომ ისწავლება.** ეს VII საუკუნის ეკლესია ქარელის მუნიციპალიტეტში,
    დაბალ ბორცვზე დგას მტკვრის ველის თავზე და ქართული „თავისუფალი ჯვრის" ტიპის ერთ-ერთი უსუფთაესი ნიმუშია:
    ოთხივე მკლავი გარედან ცალკე იკითხება, გუმბათი კი მათ გადაკვეთაზე ზის, ყოველგვარი დამატებითი მოცულობის
    გარეშე.


    ტიპი მარტივი ჩანს, მაგრამ არ არის. ქვის მასა და სიცარიელე აქ ისეა გაწონასწორებული, რომ შენობა ბევრად
    დიდი ჩანს, ვიდრე რეალურად არის. ფასადებზე თითქმის არ არის დეკორი — არც ორნამენტული ჯვრები, არც კვეთილი
    ჩარჩოები. მთელი ეფექტი პროპორციასა და ქვის ხარისხზეა აგებული. სწორედ ამიტომ დადიან აქ არქიტექტურის
    სტუდენტები და ფოტოგრაფები, მაშინაც კი, როცა შიგნით ფაქტობრივად არაფერია.


    შიგნით მართლაც მინიმალურია: თეთრი კედლები, ვიწრო სარკმლები, გუმბათიდან ჩამომავალი სინათლე. მოხატულობა
    არ შემორჩენილა. ბორცვზე გარშემო კიდევ არის ძველი ნაგებობების კვალი და საფლავის ქვები.


    ხედი ცალკე ღირს: ჩრდილოეთით კავკასიონის ქედი ჩანს, სამხრეთით ტრიალეთის მთები, შორეთში კი მტკვრის ველი
    ხეხილის ბაღებით. საუკეთესო დროა გვიანი შემოდგომა და ადრეული გაზაფხული, როცა ჰაერი გამჭვირვალეა და
    მთები კარგად ჩანს; ზაფხულში ხშირად ნისლიანი სიცხეა და ხედი იკარგება.
  tip: >-
    ორმოცი წუთი საკმარისია. ბორცვზე ასასვლელი მოკლეა, მაგრამ ბილიკი მიწისაა და წვიმის შემდეგ სრიალდება;
    დახურული ფეხსაცმელი ჯობია. ეკლესია ხშირად დაკეტილია — გარედან ნახვა მაინც ღირს, რადგან მთელი აზრი
    გარე მოცულობაშია. ჩრდილი არ არის, ზაფხულში წყალი წამოიღეთ. ტუალეტი და კაფე ახლოს არ არის; უახლოესი
    გორსა და ქარელშია. ბალახში ეკლიანი ბუჩქებია, გრძელი შარვალი გამოგადგებათ.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით, გორის შემდეგ ძველ გორი-ქარელის გზაზე გადადით და სამწევრისის
    მაჩვენებელს გაჰყევით. სულ 111 კმ, დაახლოებით საათნახევარი. მაგისტრალი კარგია, ბოლო სამი კილომეტრი
    კი ხრეშისა და დაზიანებული ასფალტის ნაზავია; მშრალ ამინდში ეკონომ-კლასის მანქანა გაივლის, წვიმის შემდეგ
    კი ბორცვის ძირში დატოვება და ფეხით ასვლა სჯობს. საწვავი გორსა და ქარელშია.
en:
  name: Samtsevrisi Church of St George
  short: >-
    A small 7th-century free-cross church on a hill above the Mtkvari plain, remarkable for the purity
    of its geometry.
  body: >-
    **Samtsevrisi is small, and that is exactly why it is taught.** This 7th-century church in Kareli
    municipality stands on a low hill above the Mtkvari plain and is one of the cleanest surviving examples
    of the Georgian free-cross plan: all four arms read separately from outside, with the dome sitting
    at their crossing and nothing else added.


    The type looks simple but is not. Mass and void are balanced so carefully that the building appears
    much larger than its actual size. The facades carry almost no decoration — no ornamental crosses,
    no carved window frames. The entire effect rests on proportion and on the quality of the cut stone.
    That is why architecture students and photographers keep coming, even though there is effectively
    nothing inside.


    Inside really is minimal: white walls, narrow windows, light dropping from the dome. No wall painting
    has survived. Around the church on the hill are traces of older structures and scattered gravestones.


    The view earns the trip on its own. The Greater Caucasus range shows to the north, the Trialeti mountains
    to the south, and between them the Mtkvari plain with its orchards. Late autumn and early spring are
    best, when the air is clear and the mountains stand out; in high summer the plain is often hazy and
    the distance disappears.
  tip: >-
    Forty minutes is enough. The climb is short but the path is bare earth and slippery after rain, so
    closed shoes are better. The church is often locked, though that matters less here than elsewhere:
    the point of the building is its exterior volume. There is no shade, so carry water in summer. No
    toilets or cafe nearby — the nearest are in Gori and Kareli. Thorny scrub grows in the grass, and
    long trousers help.
  route: >-
    Take the E60 west from Tbilisi towards Gori, then move onto the old Gori-Kareli road and follow the
    sign for Samtsevrisi. One hundred and eleven kilometres in total, around an hour and a half. The main
    road is good; the last three kilometres are a mixture of gravel and broken asphalt. In dry weather
    an economy car manages it; after rain, leave the car at the foot of the hill and walk up. Fuel is
    available in Gori and Kareli.
ru:
  name: Церковь Святого Георгия в Самцеврисе
  short: Маленькая церковь VII века типа свободного креста на холме над Мтквари, замечательная чистотой
    геометрии.
  body: >-
    **Самцеврис мал, и именно поэтому его изучают.** Эта церковь VII века в Карельском муниципалитете
    стоит на невысоком холме над долиной Мтквари и остаётся одним из самых чистых сохранившихся примеров
    грузинского плана свободного креста: все четыре рукава читаются снаружи по отдельности, купол сидит
    на их пересечении, и ничего лишнего не добавлено.


    Тип кажется простым, но таковым не является. Масса и пустота уравновешены так точно, что здание выглядит
    значительно крупнее своих реальных размеров. На фасадах почти нет декора — ни орнаментальных крестов,
    ни резных обрамлений окон. Весь эффект держится на пропорциях и качестве тёсаного камня. Поэтому сюда
    продолжают ездить студенты-архитекторы и фотографы, хотя внутри фактически ничего нет.


    Внутри действительно минимум: белые стены, узкие окна, свет, падающий из купола. Роспись не сохранилась.
    Вокруг церкви на холме — следы более старых построек и разбросанные надгробия.


    Вид оправдывает поездку сам по себе. На севере виден Главный Кавказский хребет, на юге — Триалетские
    горы, между ними долина Мтквари с садами. Лучшее время — поздняя осень и ранняя весна, когда воздух
    прозрачен и горы читаются; в разгар лета над долиной висит дымка и даль пропадает.
  tip: >-
    Сорока минут достаточно. Подъём короткий, но тропа земляная и после дождя скользкая, лучше закрытая
    обувь. Церковь часто заперта, но здесь это менее важно, чем в других местах: смысл здания — в его
    внешнем объёме. Тени нет, летом берите воду. Туалетов и кафе поблизости нет, ближайшие в Гори и Карели.
    В траве растёт колючий кустарник, длинные брюки пригодятся.
  route: >-
    Из Тбилиси на запад по E60 в сторону Гори, затем перейдите на старую дорогу Гори — Карели и следуйте
    указателю на Самцеврис. Всего 111 км, около полутора часов. Магистраль хорошая; последние три километра
    — смесь гравия и разбитого асфальта. В сухую погоду машина эконом-класса пройдёт, после дождя лучше
    оставить её у подножия холма и подняться пешком. Заправки есть в Гори и Карели.
fa:
  name: کلیسای مقدس گئورگی در سامتسورسی
  short: کلیسایی کوچک از سدهٔ هفتم با نقشهٔ صلیب آزاد بر تپه‌ای مشرف بر دشت مْتکواری، با هندسه‌ای به‌غایت
    پاکیزه.
  body: >-
    **سامتسورسی کوچک است و درست به همین سبب تدریس می‌شود.** این کلیسای سدهٔ هفتم در شهرستان کارلی بر تپه‌ای
    کوتاه بالای دشت مْتکواری ایستاده و یکی از پاکیزه‌ترین نمونه‌های برجای‌ماندهٔ نقشهٔ صلیب آزاد گرجی
    است: هر چهار بازو از بیرون جداگانه خوانده می‌شوند، گنبد بر تقاطع آنها می‌نشیند و چیز دیگری افزوده
    نشده است.


    این گونه ساده می‌نماید اما ساده نیست. توده و تهی چنان سنجیده متعادل شده‌اند که بنا بسیار بزرگ‌تر از
    اندازهٔ واقعی‌اش به چشم می‌آید. نماها تقریباً هیچ تزیینی ندارند؛ نه صلیب آرایه‌ای و نه قاب کنده‌کاری‌شدهٔ
    پنجره. تمام تأثیر بر تناسب و بر کیفیت سنگ تراشیده استوار است. به همین سبب دانشجویان معماری و عکاسان
    همچنان به اینجا می‌آیند، هرچند درون بنا عملاً چیزی نیست.


    درون به‌راستی کمینه است: دیوارهای سفید، پنجره‌های باریک و نوری که از گنبد فرو می‌ریزد. نقاشی دیواری
    برجای نمانده است. پیرامون کلیسا بر تپه، ردهایی از بناهای کهن‌تر و سنگ‌قبرهایی پراکنده دیده می‌شود.


    چشم‌انداز به‌تنهایی ارزش این سفر را دارد. رشتهٔ قفقاز بزرگ در شمال پیداست، کوه‌های تریالتی در جنوب،
    و میان آن دو دشت مْتکواری با باغ‌های میوه. اواخر پاییز و اوایل بهار بهترین زمان‌اند، وقتی هوا صاف
    است و کوه‌ها جدا می‌ایستند؛ در اوج تابستان دشت اغلب غبارآلود است و دوردست گم می‌شود.
  tip: >-
    چهل دقیقه کافی است. بالا رفتن کوتاه است اما مسیر خاکی است و پس از باران لغزنده می‌شود، پس کفش بسته
    بهتر است. کلیسا اغلب قفل است، هرچند اینجا کمتر از جاهای دیگر اهمیت دارد: جانِ این بنا در حجم بیرونی
    آن است. سایه‌ای نیست، پس در تابستان آب همراه ببرید. سرویس بهداشتی و کافه‌ای در نزدیکی نیست؛ نزدیک‌ترین‌ها
    در گوری و کارلی‌اند. در علف بوته‌های خاردار می‌رویند و شلوار بلند به کار می‌آید.
  route: >-
    از تفلیس به غرب روی E60 به سوی گوری بروید، سپس به جادهٔ قدیم گوری-کارلی بروید و تابلوی سامتسورسی را
    دنبال کنید. صد و یازده کیلومتر روی‌هم، حدود یک ساعت و نیم. جادهٔ اصلی خوب است؛ سه کیلومتر پایانی آمیزه‌ای
    از شن و آسفالت شکسته است. در هوای خشک خودروی اقتصادی از پس آن برمی‌آید؛ پس از باران خودرو را پای تپه
    بگذارید و پیاده بالا بروید. سوخت در گوری و کارلی موجود است.
he:
  name: כנסיית גאורגיוס הקדוש בסמצוורסי
  short: כנסייה קטנה מן המאה ה-7 בתוכנית צלב חופשי על גבעה מעל מישור המטקווארי, מיוחדת בטוהר הגיאומטריה
    שלה.
  body: >-
    **סמצוורסי קטנה, ובדיוק בשל כך מלמדים אותה.** הכנסייה הזו מן המאה ה-7 במחוז קארלי עומדת על גבעה נמוכה
    מעל מישור המטקווארי, והיא אחת הדוגמאות הנקיות ביותר ששרדו לתוכנית הצלב החופשי הגאורגית: כל ארבע הזרועות
    נקראות בנפרד מבחוץ, הכיפה יושבת בהצטלבותן, ודבר אינו מתווסף.


    הטיפוס נראה פשוט אך אינו כזה. המסה והחלל מאוזנים בקפידה כזו שהמבנה נראה גדול בהרבה מגודלו בפועל. החזיתות
    כמעט נטולות עיטור: אין צלבים דקורטיביים ואין מסגרות חלון מגולפות. כל האפקט נשען על היחסים ועל איכות
    האבן המהוקצעת. משום כך ממשיכים לבוא לכאן סטודנטים לאדריכלות וצלמים, אף שבפנים אין למעשה דבר.


    בפנים באמת מינימלי: קירות לבנים, חלונות צרים ואור היורד מן הכיפה. ציורי קיר לא שרדו. סביב הכנסייה
    על הגבעה נראים שרידי מבנים קדומים יותר ומצבות פזורות.


    הנוף מצדיק את הנסיעה בפני עצמו. רכס הקווקז הגדול נראה בצפון, הרי טריאלטי בדרום, וביניהם מישור המטקווארי
    ובו מטעים. סוף הסתיו וראשית האביב הם הזמן הטוב ביותר, כשהאוויר צלול וההרים בולטים; באמצע הקיץ אובך
    תלוי מעל המישור והמרחק נעלם.
  tip: >-
    ארבעים דקות מספיקות. הטיפוס קצר אך השביל אדמה חשופה והוא חלקלק אחרי גשם, לכן עדיף נעליים סגורות. הכנסייה
    נעולה לעיתים קרובות, אך כאן זה פחות חשוב מבמקומות אחרים: עיקרו של המבנה הוא הנפח החיצוני. אין צל,
    לכן קחו מים בקיץ. אין שירותים או בית קפה בסביבה; הקרובים ביותר בגורי ובקארלי. בעשב גדלים שיחים קוצניים
    ומכנסיים ארוכים עוזרים.
  route: >-
    סעו מטביליסי מערבה בכביש E60 לכיוון גורי, ואז עברו לדרך הישנה גורי-קארלי ועקבו אחרי השילוט לסמצוורסי.
    111 ק״מ בסך הכול, כשעה וחצי. הכביש הראשי טוב; שלושת הקילומטרים האחרונים הם תערובת של חצץ ואספלט שבור.
    במזג אוויר יבש רכב חסכוני מסתדר; אחרי גשם עדיף להשאיר את הרכב למרגלות הגבעה ולעלות ברגל. דלק יש בגורי
    ובקארלי.
ar:
  name: كنيسة القديس جيورجي في سامتسفريسي
  short: كنيسة صغيرة من القرن السابع على مخطط الصليب الحر فوق تلة تشرف على سهل متكفاري، لافتة بنقاء هندستها.
  body: >-
    **سامتسفريسي صغيرة، ولهذا بالضبط تُدرَّس.** تقوم هذه الكنيسة من القرن السابع في بلدية كاريلي على تلة
    منخفضة فوق سهل متكفاري، وهي من أنقى الأمثلة الباقية على مخطط الصليب الحر الجورجي: تُقرأ الأذرع الأربع
    منفصلة من الخارج، وتجلس القبة عند تقاطعها، ولا شيء آخر أُضيف.


    يبدو هذا النمط بسيطاً وليس كذلك. فالكتلة والفراغ موزونان بعناية تجعل البناء يبدو أكبر بكثير من حجمه
    الفعلي. والواجهات تكاد تخلو من الزخرفة: لا صلبان زخرفية ولا أطر نوافذ منقوشة. والأثر كله قائم على
    النسب وعلى جودة الحجر المنحوت. ولهذا يواصل طلاب العمارة والمصورون المجيء إلى هنا، رغم أن الداخل خالٍ
    فعلياً.


    والداخل بالفعل في حده الأدنى: جدران بيضاء، ونوافذ ضيقة، وضوء ينزل من القبة. ولم يبقَ تصوير جداري.
    وحول الكنيسة على التلة آثار أبنية أقدم وشواهد قبور متناثرة.


    والمنظر وحده يستحق الرحلة. تظهر سلسلة القوقاز الكبرى في الشمال، وجبال تريالتي في الجنوب، وبينهما سهل
    متكفاري ببساتينه. وأواخر الخريف وأوائل الربيع أفضل الأوقات، حين يصفو الهواء وتنفصل الجبال؛ أما في
    عز الصيف فيعلق الضباب فوق السهل ويختفي البعد.
  tip: >-
    أربعون دقيقة تكفي. الصعود قصير لكن الدرب تراب عارٍ ويصير زلقاً بعد المطر، فالحذاء المغلق أفضل. والكنيسة
    مغلقة في الغالب، وهذا هنا أقل أهمية منه في غيرها: فجوهر البناء في كتلته الخارجية. ولا ظل، فاحمل ماءً
    في الصيف. ولا دورات مياه ولا مقهى قريباً؛ أقربها في غوري وكاريلي. وتنمو في العشب شجيرات شائكة، والبنطال
    الطويل يساعد.
  route: >-
    خذ الطريق E60 غرباً من تبليسي نحو غوري، ثم انتقل إلى طريق غوري-كاريلي القديم واتبع لافتة سامتسفريسي.
    مئة وأحد عشر كيلومتراً إجمالاً، نحو ساعة ونصف. الطريق الرئيسي جيد؛ والكيلومترات الثلاثة الأخيرة خليط
    من الحصى والإسفلت المتكسر. وفي الطقس الجاف تتدبر سيارة اقتصادية الأمر؛ وبعد المطر اترك السيارة عند
    سفح التلة واصعد سيراً. والوقود متوفر في غوري وكاريلي.
