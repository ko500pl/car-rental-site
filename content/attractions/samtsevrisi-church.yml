ka:
  name: სამწევრისის წმინდა გიორგის ეკლესია
  short: >-
    VII საუკუნის თავისუფალი ჯვრის ეკლესია, ათ მეტრზე ოდნავ მაღალი, რომელიც ძამისა და მტკვრის შესაყარის
    ველს დღემდე დაჰყურებს.
  body: >-
    **სამწევრისი ათ მეტრზე ოდნავ მაღალია, მაგრამ მთელ ველს დაჰყურებს — ხუროთმოძღვრებაში ზომას პროპორცია
    სჯობს.**


    წმინდა გიორგის ეკლესია დაბალ ბორცვზე დგას, მდინარე ძამის მარცხენა ნაპირზე, ძამისა და მტკვრის ხეობებს
    შორის გადაჭიმული ზეგნის აღმოსავლეთ ბოლოში; ჩრდილოეთით გამავალი მაგისტრალიდან და რკინიგზიდანაც კარგად
    ჩანს. სტილის მიხედვით VII საუკუნის პირველ ნახევარს განეკუთვნება და თავისუფალი ჯვრის ტიპის სახელმძღვანელო
    ნიმუშია: ცენტრალური კვადრატის გარშემო ოთხი მოკლე მკლავი, აღმოსავლეთით ნალისებრი აფსიდი — მეტი არაფერი.
    მთელი შენობა 9,6 × 8,8 მეტრია, სიმაღლით კი 10,6 მეტრი.


    მთავარი აქ გუმბათია. ოთხი დიდი და რვა მცირე ტრომპი კვადრატს საფეხურ-საფეხურ რვაწახნაგად აქცევს, მასზე
    კი ყელი დგას. მონაცრისფრო-მოწითალო ქვიშაქვა თითქმის შიშველია; ერთადერთი მორთულობა სარკმლების ჩუქურთმიანი
    საპირეებია.


    კედლებს ორი ასომთავრული წარწერაც შემორჩა. აღმოსავლეთ ფასადზე ნათქვამია, რომ აფხაზთა მეფე კონსტანტინე
    III-ის მეფობის მეოცე წელს, დაახლოებით 914 წელს, დომნისოსმა და გიორგი ტუალაისძემ სარწყავი არხი გაიყვანეს.
    სამხრეთისა ადგილობრივ დიდებულს, მერაბ ფანასკერტელს იხსენიებს, რომელმაც ეკლესია XV–XVI საუკუნეების
    მიჯნაზე განაახლა; მისი აკლდამა ეკლესიის გვერდით დგას და რელიეფზე მერაბი მეუღლითა და შვილით არის გამოსახული.
    1940 წლის 8 მაისის მიწისძვრამ ეკლესია დააზიანა, 1950–1953 წლებში კი ქართველმა სპეციალისტებმა შეაკეთეს.


    ბორცვის თხემიდან, ჩრდილო-დასავლეთით, ქვემოთ სამწევრისის ციხის ნანგრევები მოჩანს, მოწმენდილ დღეს კი
    ჩრდილოეთის ჰორიზონტს კავკასიონი გასდევს. ეკლესიას მარტოხელა ფიჭვი უდგას გვერდით. დღის ბოლო საათზე
    მოდით, როცა დაბალი მზე ქვიშაქვას ათბობს და პატარა შენობა გრძელ ჩრდილს აგდებს.
  tip: >-
    ორმოცი წუთიდან საათამდე საკმარისია. ბორცვზე ასასვლელი ბილიკი მიწისაა და წვიმის შემდეგ სრიალებს — დახურული
    ფეხსაცმელი ჩაიცვით, ბუჩქნარში კი გრძელი შარვალი გამოგადგებათ. ეკლესია შეიძლება დაკეტილი დაგხვდეთ,
    მაგრამ აქ მთავარი გარე სახეა: ბოლომდე შემოუარეთ წარწერებისა და აკლდამის სანახავად. ჩრდილი, კაფე და
    ტუალეტი არ არის — წყალი თან იქონიეთ, სადილი ქარელში სჯობს. მთების ხედისთვის საუკეთესოა შემოდგომისა
    და გაზაფხულის მოწმენდილი დღეები; ზაფხულის ბურუსი ხშირად ფარავს. ახლოსაა წრომი და ქინწვისიც.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ, გორის გავლით ქარელის გასასვლელამდე — დაახლოებით
    99 კმ. ქარელში გაიარეთ და ძველი გზით (შ29) დასავლეთისკენ დაახლოებით 4 კმ იარეთ, შემდეგ ბორცვისკენ
    მიმავალ შარაზე გადაუხვიეთ. სულ დაახლოებით 111 კმ და საათნახევარი. ბოლო მონაკვეთი ხრეშისა და დაზიანებული
    ასფალტის ნაზავია: მშრალ ამინდში ეკონომკლასის მანქანა გაივლის, წვიმის შემდეგ კი ბორცვის ძირში დატოვეთ
    და ფეხით ადით. საწვავი გორსა და ქარელშია.
en:
  name: Samtsevrisi Church of St George
  short: >-
    A 7th-century free-cross church barely eleven metres tall that still commands the plain where the
    Dzama meets the Mtkvari.
  body: >-
    **Samtsevrisi stands barely eleven metres tall, yet it commands a whole plain — proof that in architecture
    proportion beats size.**


    The church of St George stands on a low hill on the left bank of the Dzama, at the eastern tip of
    the plateau between the Dzama and Mtkvari valleys, and you can pick it out from the motorway and railway
    to the north. It is dated by its style to the first half of the 7th century and is a textbook free
    cross: four short arms around a central square, a horseshoe apse to the east, nothing more. The whole
    building is 9.6 by 8.8 metres and 10.6 metres tall.


    What makes it sing is the dome. Four large squinches and eight smaller ones step the square up into
    an octagon, and the drum rides on them. The greyish-red sandstone is left almost bare; the only ornament
    is the carved framing round the windows.


    The walls also carry two messages in asomtavruli script. One, on the east façade, records a water
    channel built around 914, in the twentieth year of King Constantine III of Abkhazia, by Domnisos and
    Giorgi Tualaisdze. The other, on the south, names Merab Panaskerteli, the local lord who renewed the
    church in the late 15th or early 16th century; his mausoleum beside it shows him carved with his wife
    and son. The earthquake of 8 May 1940 damaged the church, and Georgian specialists repaired it in
    1950–53.


    From the top, the ruins of Samtsevrisi castle lie below you to the north-west, and on a clear day
    the Greater Caucasus lines the northern horizon. A lone pine keeps the church company. Come in the
    last hour of daylight, when the low sun warms the sandstone and the small building throws a long shadow.
  tip: >-
    Forty minutes to an hour is enough. The path up the hill is bare earth and slick after rain, so wear
    closed shoes, and long trousers help against the scrub. The church may be locked, but here the exterior
    is the point — walk all the way round for the inscriptions and the carved mausoleum. There is no shade,
    café or toilet; bring water and eat in Kareli. Clear autumn and spring days give the best mountain
    views; summer haze often swallows them. Tsromi and Kintsvisi are close by.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi past Gori to the Kareli exit, about 99 km. Drive through
    Kareli and west along the old road (Sh29) for about 4 km, then turn off on the lane to the hill. Around
    111 km and 1 hour 30 minutes in all. The last stretch is a mix of gravel and broken asphalt: in dry
    weather an economy car manages it, but after rain leave the car at the foot of the hill and walk up.
    Fuel in Gori or Kareli.
ru:
  name: Церковь Святого Георгия в Самцевриси
  short: >-
    Церковь VII века типа «свободный крест» высотой едва одиннадцать метров, которая и сегодня властвует
    над равниной у слияния Дзамы и Куры.
  body: >-
    **Церковь в Самцевриси едва достигает одиннадцати метров, но властвует над целой равниной — лучшее
    доказательство того, что в архитектуре пропорция сильнее размера.**


    Церковь Святого Георгия стоит на невысоком холме на левом берегу Дзамы, на восточной оконечности плато
    между долинами Дзамы и Куры, и её легко различить с автомагистрали и железной дороги, проходящих севернее.
    По стилю её относят к первой половине VII века, и это хрестоматийный «свободный крест»: четыре коротких
    рукава вокруг центрального квадрата, подковообразная апсида на востоке — и ничего сверх того. Всё
    здание — 9,6 на 8,8 метра при высоте 10,6 метра.


    Главное здесь — купол. Четыре больших тромпа и восемь малых ступенями переводят квадрат в восьмигранник,
    и на них покоится барабан. Серовато-красный песчаник оставлен почти нетронутым; единственное украшение
    — резные обрамления окон.


    На стенах сохранились и две надписи, сделанные древнегрузинским письмом асомтаврули. Одна, на восточном
    фасаде, сообщает о водоводе, построенном около 914 года, на двадцатом году правления Константина III,
    царя Абхазского, Домнисосом и Гиорги Туалаисдзе. Другая, на южном, называет Мераба Панаскертели —
    местного владетеля, обновившего церковь в конце XV или начале XVI века; в его усыпальнице рядом он
    высечен в камне вместе с женой и сыном. Землетрясение 8 мая 1940 года повредило храм, и в 1950–1953
    годах его восстановили грузинские специалисты.


    С вершины видно, как к северо-западу внизу лежат руины Самцеврисской крепости, а в ясный день северный
    горизонт замыкает хребет Большого Кавказа. Компанию церкви составляет одинокая сосна. Приходите в
    последний час перед закатом, когда низкое солнце согревает песчаник и маленький храм отбрасывает длинную
    тень.
  tip: >-
    Сорока минут — часа достаточно. Тропа на холм — голая земля, после дождя она скользкая, так что наденьте
    закрытую обувь, а длинные брюки защитят от колючего кустарника. Церковь может оказаться запертой,
    но здесь главное снаружи: обойдите её целиком, чтобы увидеть надписи и резную усыпальницу. Ни тени,
    ни кафе, ни туалета нет; возьмите воду, а пообедать можно в Карели. Лучшие виды на горы бывают в ясные
    дни осенью и весной; летом их часто съедает дымка. Рядом — Цроми и Кинцвиси.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад, мимо Гори, до съезда на Карели — около 99 км. Проезжайте
    через Карели и дальше на запад по старой дороге (Sh29) ещё около 4 км, затем сворачивайте на просёлок
    к холму. Всего примерно 111 км и 1 час 30 минут. Последний участок — смесь гравия и разбитого асфальта:
    в сухую погоду машина эконом-класса справится, но после дождя оставьте её у подножия холма и поднимитесь
    пешком. Заправиться можно в Гори или Карели.
fa:
  name: کلیسای گئورگیِ قدیس در سامتسوریسی
  short: >-
    کلیسایی از سدهٔ هفتم با نقشهٔ صلیب آزاد و بلندیِ به‌زحمت یازده متر که هنوز بر دشتِ محل پیوستن دزاما
    به کورا فرمان می‌راند.
  body: >-
    **سامتسوریسی به‌زحمت یازده متر بلندی دارد، اما بر دشتی تمام فرمان می‌راند؛ گواهی بر این‌که در معماری،
    تناسب بر اندازه چیره است.**


    کلیسای گئورگیِ قدیس بر تپه‌ای کم‌ارتفاع در کرانهٔ چپ رود دزاما ایستاده، در منتهای شرقی فلاتی که میان
    درهٔ دزاما و درهٔ کورا (متکواری) کشیده شده است، و از بزرگراه و راه‌آهنی که از شمال آن می‌گذرند به‌خوبی
    پیداست. بر پایهٔ سبک، آن را به نیمهٔ نخست سدهٔ هفتم نسبت می‌دهند و نمونهٔ درسیِ «صلیب آزاد» است: چهار
    بازوی کوتاه گرد یک مربع مرکزی، محرابی نعلی‌شکل در شرق، و دیگر هیچ. کل بنا ۹٫۶ در ۸٫۸ متر است و ۱۰٫۶
    متر ارتفاع دارد.


    نگین این بنا گنبد آن است. چهار سکنج بزرگ و هشت سکنج کوچک‌تر، پله‌پله مربع را به هشت‌ضلعی بدل می‌کنند
    و گریوِ گنبد بر آن‌ها سوار است. ماسه‌سنگ سرخِ مایل به خاکستری تقریباً عریان مانده است؛ تنها تزیین،
    قاب‌های کنده‌کاری‌شدهٔ گرداگرد پنجره‌هاست.


    دیوارها دو پیام به خط کهن گرجی آسومتاورولی نیز بر خود دارند. یکی، بر نمای شرقی، از آبراهه‌ای خبر می‌دهد
    که حدود سال ۹۱۴، در بیستمین سال پادشاهی کنستانتین سوم، شاه آبخازیا، به دست دومنیسوس و گیورگی توالائیسدزه
    ساخته شد. دیگری، بر نمای جنوبی، از مراب پاناسکرتلی نام می‌برد، فرمانروای محلی که در اواخر سدهٔ پانزدهم
    یا اوایل سدهٔ شانزدهم کلیسا را نوسازی کرد؛ در آرامگاهش در کنار کلیسا، پیکر او همراه همسر و پسرش بر
    سنگ تراشیده شده است. زلزلهٔ ۸ مه ۱۹۴۰ به کلیسا آسیب زد و متخصصان گرجی در سال‌های ۱۹۵۰ تا ۱۹۵۳ آن را
    مرمت کردند.


    از بالای تپه، ویرانه‌های دژ سامتسوریسی را در شمال غربی، پایین پای خود می‌بینید و در روزهای صاف، رشته‌کوه
    قفقاز بزرگ سراسر افق شمالی را می‌پوشاند. کاجی تنها همدم کلیساست. در واپسین ساعت روز بیایید، وقتی آفتاب
    کم‌ارتفاع ماسه‌سنگ را گرم می‌کند و بنای کوچک سایه‌ای بلند می‌افکند.
  tip: >-
    چهل دقیقه تا یک ساعت کافی است. راهِ بالا رفتن از تپه خاکی است و پس از باران لغزنده، پس کفش بسته بپوشید؛
    شلوار بلند هم در برابر بوته‌های خاردار به کار می‌آید. ممکن است در کلیسا بسته باشد، اما این‌جا اصل
    کار بیرون بناست: یک دور کامل بزنید تا کتیبه‌ها و آرامگاه سنگ‌تراشی‌شده را ببینید. نه سایه‌ای هست،
    نه کافه و نه سرویس بهداشتی؛ آب همراه داشته باشید و در کارلی غذا بخورید. روزهای صاف پاییز و بهار بهترین
    منظرهٔ کوه‌ها را دارند؛ مه‌غبار تابستان اغلب آن‌ها را می‌بلعد. تسرومی و کینتسویسی در همین نزدیکی‌اند.
  route: >-
    از تفلیس بزرگراه S1 (E60) را رو به غرب بگیرید، از گوری بگذرید و تا خروجی کارلی بروید، حدود ۹۹ کیلومتر.
    از کارلی عبور کنید و حدود ۴ کیلومتر در امتداد جادهٔ قدیمی (Sh29) به غرب بروید، سپس به راه باریکی بپیچید
    که به تپه می‌رسد. روی هم حدود ۱۱۱ کیلومتر و یک ساعت و نیم. تکهٔ آخر آمیزه‌ای از شن و آسفالت شکسته
    است: در هوای خشک خودروی کلاس اکونومی از پسش برمی‌آید، اما پس از باران خودرو را پای تپه بگذارید و پیاده
    بالا بروید. سوخت را در گوری یا کارلی بزنید.
he:
  name: כנסיית גאורגיוס הקדוש בסמצווריסי
  short: >-
    כנסייה מן המאה ה-7 בתוכנית צלב חופשי, שגובהה בקושי אחד-עשר מטרים, ועדיין היא שולטת במישור שבו הדזמה
    נפגשת עם המטקוורי.
  body: >-
    **גובהה של סמצווריסי בקושי אחד-עשר מטרים, ובכל זאת היא שולטת במישור שלם – הוכחה לכך שבאדריכלות הפרופורציה
    גוברת על הגודל.**


    כנסיית גאורגיוס הקדוש עומדת על גבעה נמוכה בגדה השמאלית של נהר הדזמה, בקצה המזרחי של הרמה שבין עמק
    הדזמה לעמק המטקוורי (הכורה), ואפשר לזהות אותה מן הכביש המהיר וממסילת הרכבת שמצפון לה. לפי סגנונה היא
    מתוארכת למחצית הראשונה של המאה ה-7, והיא דוגמה קלאסית לצלב חופשי: ארבע זרועות קצרות סביב ריבוע מרכזי,
    אפסיס בצורת פרסה במזרח, ותו לא. המבנה כולו 9.6 על 8.8 מטרים, וגובהו 10.6 מטרים.


    גולת הכותרת היא הכיפה. ארבע קשתות פינה (טרומפים) גדולות ושמונה קטנות מעבירות את הריבוע, שלב אחר שלב,
    למתומן, ועליהן נשען התוף. אבן החול האפרפרה-אדמדמה נותרה כמעט חשופה; העיטור היחיד הוא המסגרות המגולפות
    סביב החלונות.


    על הקירות חקוקות גם שתי כתובות בכתב הגאורגי העתיק אסומתאוורולי. האחת, בחזית המזרחית, מתעדת תעלת מים
    שנבנתה בסביבות שנת 914, בשנה העשרים למלכות קונסטנטינוס השלישי מלך אבחזיה, בידי דומניסוס וגיאורגי טואלאיסדזה.
    השנייה, בחזית הדרומית, מזכירה את מרב פנסקרטלי, האדון המקומי שחידש את הכנסייה בסוף המאה ה-15 או בראשית
    המאה ה-16; במאוזוליאום שלו, הסמוך לכנסייה, הוא מגולף באבן יחד עם אשתו ובנו. רעידת האדמה של 8 במאי
    1940 פגעה בכנסייה, ומומחים גאורגים שיקמו אותה בשנים 1950–1953.


    מראש הגבעה נשקפות מתחתיכם, בצפון-מערב, חורבות מבצר סמצווריסי, וביום בהיר רכס הקווקז הגדול משתרע לאורך
    האופק הצפוני. אורן בודד מחזיק לכנסייה חברה. בואו בשעת האור האחרונה, כשהשמש הנמוכה מחממת את אבן החול
    והמבנה הקטן מטיל צל ארוך.
  tip: >-
    ארבעים דקות עד שעה מספיקות. השביל במעלה הגבעה הוא עפר חשוף, חלקלק אחרי גשם, לכן נעלו נעליים סגורות;
    מכנסיים ארוכים יגנו מפני השיחים הדוקרניים. ייתכן שהכנסייה תהיה נעולה, אבל כאן העיקר נמצא בחוץ – הקיפו
    אותה עד הסוף כדי לראות את הכתובות ואת המאוזוליאום המגולף. אין צל, בית קפה או שירותים; הביאו מים ואכלו
    בקארלי. ימים בהירים בסתיו ובאביב מעניקים את הנוף הטוב ביותר אל ההרים; אובך הקיץ בולע אותם לא פעם.
    צרומי וקינצוויסי קרובות.
  route: >-
    צאו מטביליסי מערבה בכביש המהיר S1 (E60), עברו את גורי והמשיכו עד היציאה לקארלי, כ-99 ק״מ. חצו את קארלי
    והמשיכו מערבה בדרך הישנה (Sh29) כ-4 ק״מ, ואז פנו לדרך הצרה המובילה אל הגבעה. בסך הכול כ-111 ק״מ ושעה
    וחצי נסיעה. הקטע האחרון משלב חצץ ואספלט שבור: במזג אוויר יבש רכב אקונומי יעבור בו, אבל אחרי גשם השאירו
    את הרכב למרגלות הגבעה ועלו ברגל. דלק יש בגורי ובקארלי.
ar:
  name: كنيسة القديس جيورجي في سامتسفريسي
  short: >-
    كنيسة من القرن السابع على مخطط الصليب الحر، لا يكاد ارتفاعها يبلغ أحد عشر متراً، وما زالت تهيمن على
    السهل حيث يلتقي نهر دزاما بنهر كورا.
  body: >-
    **لا يكاد ارتفاع سامتسفريسي يبلغ أحد عشر متراً، ومع ذلك تهيمن على سهل بأكمله، شاهدةً على أن التناسب
    في العمارة يغلب الحجم.**


    تقوم كنيسة القديس جيورجي على تلة منخفضة على الضفة اليسرى لنهر دزاما، عند الطرف الشرقي للهضبة الممتدة
    بين واديي دزاما وكورا (متكفاري)، ويمكنك تمييزها من الطريق السريع وسكة الحديد الواقعين شمالها. يؤرّخها
    طرازها بالنصف الأول من القرن السابع، وهي مثال نموذجي للصليب الحر: أربعة أذرع قصيرة حول مربع مركزي،
    وحنية على شكل حدوة حصان في الشرق، ولا شيء سوى ذلك. أبعاد المبنى كله 9.6 × 8.8 متر، وارتفاعه 10.6 متر.


    أما درّة المبنى فهي القبة. أربع حنايا ركنية كبيرة وثماني صغيرة تنقل المربع درجةً بعد درجة إلى مثمّن،
    وعليها ترتكز رقبة القبة. وتُرك الحجر الرملي الأحمر المائل إلى الرمادي عارياً تقريباً، والزينة الوحيدة
    هي الأطر المنحوتة حول النوافذ.


    وتحمل الجدران أيضاً نقشين بالخط الجورجي القديم الأسومتافرولي. الأولى على الواجهة الشرقية وتسجّل قناة
    ماء شُيّدت نحو عام 914، في السنة العشرين من حكم الملك قسطنطين الثالث ملك أبخازيا، على يد دومنيسوس
    وغيورغي توالايسدزه. والثانية على الواجهة الجنوبية وتذكر ميراب باناسكيرتيلي، السيد المحلي الذي جدّد
    الكنيسة في أواخر القرن الخامس عشر أو أوائل السادس عشر؛ وفي ضريحه المجاور يظهر منحوتاً في الحجر مع
    زوجته وابنه. وقد ألحق زلزال 8 مايو 1940 أضراراً بالكنيسة، فرمّمها مختصون جورجيون بين عامي 1950 و1953.


    ومن أعلى التلة تمتد تحتك إلى الشمال الغربي أطلال قلعة سامتسفريسي، وفي اليوم الصافي تصطفّ جبال القوقاز
    الكبير على الأفق الشمالي. وصنوبرة وحيدة تؤنس الكنيسة. تعالَ في الساعة الأخيرة من النهار، حين تدفئ
    الشمس المنخفضة الحجر الرملي ويلقي البناء الصغير ظلاً طويلاً.
  tip: >-
    تكفي أربعون دقيقة إلى ساعة. الممر الصاعد إلى التلة تراب عارٍ يصبح زلقاً بعد المطر، فانتعل حذاءً مغلقاً،
    والسراويل الطويلة تقيك الشجيرات الشائكة. قد تكون الكنيسة مقفلة، لكن الأهم هنا هو الخارج: دُر حولها
    كاملةً لترى الكتابات والضريح المنحوت. لا ظل ولا مقهى ولا دورة مياه؛ احمل الماء وتناول طعامك في كاريلي.
    تمنح أيام الخريف والربيع الصافية أجمل مشاهد الجبال، أما غبش الصيف فكثيراً ما يبتلعها. وتسرومي وكينتسفيسي
    قريبتان.
  route: >-
    اسلك الطريق السريع S1 (E60) غرباً من تبليسي متجاوزاً غوري حتى مخرج كاريلي، نحو 99 كم. اعبر كاريلي
    واتجه غرباً على الطريق القديم (Sh29) نحو 4 كم، ثم انعطف إلى الدرب المؤدي إلى التلة. المجموع نحو 111
    كم وساعة ونصف. المقطع الأخير خليط من الحصى والأسفلت المتكسر: في الطقس الجاف تتدبّر السيارة الاقتصادية
    أمرها، أما بعد المطر فاترك السيارة عند سفح التلة واصعد سيراً. الوقود متوفر في غوري أو كاريلي.
