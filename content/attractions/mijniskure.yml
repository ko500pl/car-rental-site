ka:
  name: მიჯნისყურე
  short: >-
    ალაზნის ნალისებრი მოსახვევი ვაშლოვანის სიღრმეში, სადაც მდინარე აზერბაიჯანთან საზღვარია: კლდეები, მუქი,
    სწრაფი წყალი და სასაზღვრო საგუშაგო.
  body: >-
    **მიჯნისყურესთან ალაზანი, კავკასიონის თოვლებში რომ იღებს სათავეს, მკვეთრ ნალისებრ მოსახვევს აკეთებს
    — და მდინარე, რომელსაც უყურებთ, საზღვარია აზერბაიჯანთან.**


    ეს ვაშლოვანის შორეული სამხრეთ-აღმოსავლეთი კიდეა. მშრალი, ნახევრადუდაბნოს ნათელი ტყეები აქ 1935 წლიდან
    არის დაცული, 2003 წელს კი ტერიტორია გაფართოვდა და ვაშლოვანის დაცულ ტერიტორიებად ჩამოყალიბდა — ნაკრძალით,
    ეროვნული პარკითა და ბუნების ძეგლებით, სულ დაახლოებით 440 კვადრატული კილომეტრი. ქართველისთვის სახელი
    თავისთავად ლაპარაკობს: მიჯნა საზღვარია. ნანგრევებსა და მატიანეებს აქ ნუ ეძებთ — ამ ადგილის ამბავი
    საზღვარი და მის ირგვლივ ბუნების დაცვაა.


    გზა თავადაა თავგადასავლის ნახევარი: დედოფლისწყაროდან საათობით თიხიანი გრუნტით, შიშველ, გამოფიტულ ხრიოკებზე.
    მერე მდინარე გამოჩნდება — მუქი და სწრაფი, მაღალ ბალახსა და ციცაბო კლდის კედლებს შორის; ზემოდან, კლდის
    თავიდან, მთელი მოსახვევი ერთი შეხედვით მოჩანს. წყალთან რამდენიმე კოტეჯი და საკემპინგე ადგილია — ვაშლოვანის
    ერთდღიანი მარშრუტების ჩვეული შესასვენებელი და შემობრუნების წერტილი, — იქვე კი ქართული სასაზღვრო საგუშაგოა,
    სადაც საბუთებს ამოწმებენ. აქედან ბილიკები შავი მთისკენ მიდის, პარკი კი ამ მოსახვევს ფლაი-ფიშინგისა
    და ფრინველებზე დაკვირვებისთვის გვთავაზობს.


    ვაშლოვანი ისიც არის, სადაც კავკასიური ლეოპარდი დაბრუნდა: 2003 წელს მისი ნაკვალევი იპოვეს, 2004 წელს
    კი ფოტოხაფანგის ობიექტივში მოხვდა. ამ მიწაზე მგელი, მურა დათვი, ლელიანის კატა და ტურაც ბინადრობს.
    თითქმის დანამდვილებით ვერცერთს ვერ ნახავთ; დაბინდების შემდეგ ხეობა მათია.


    საქართველოში ცოტა გზა მთავრდება ასე სიტყვასიტყვით.
  tip: >-
    ჯერ დედოფლისწყაროში, ვაშლოვანის ვიზიტორთა ცენტრში გაიარეთ რეგისტრაცია და პასპორტი თან იქონიეთ: ეს
    სასაზღვრო ზოლია და მიჯნისყურესთან მესაზღვრეები საბუთს შეამოწმებენ. საფასური ცენტრშივე იხდება; ერთი
    ბოლოდროინდელი მოგზაურის ცნობით, კოტეჯში ღამე დაახლოებით 40 ლარი ღირდა, კარვით დაბანაკება კი ერთ კაცზე
    5 ლარი — მიმდინარე ფასები ადგილზე დააზუსტეთ. ყველაფერი თან წაიღეთ — საწვავი, საჭმელი და ერთ კაცზე
    დღეში სამი ლიტრი წყალი მაინც: დედოფლისწყაროს იქით არაფერი იყიდება. ზაფხულში სიცხე შეიძლება 40 °C-ს
    გადასცდეს, ამიტომ მაის-ივნისი და სექტემბერ-ოქტომბერი უფრო მოწყალეა. მონიშნულ ადგილებს ნუ გასცდებით,
    სასაზღვრო საგუშაგოს უნებართვოდ ნუ გადაიღებთ, ძლიერი წვიმის შემდეგ კი საერთოდ ნუ წახვალთ.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით, საგარეჯოს გავლით იარეთ, შ40-ზე სიღნაღისკენ გადაუხვიეთ, შემდეგ შ41-ით
    ბოდბის გავლით შ39-მდე და დედოფლისწყარომდე — დაახლოებით 130 კმ ასფალტი, ორიოდე საათი. ავზი აქ შეავსეთ.
    ქალაქის იქით ნამდვილი გზა აღარ არის: პარკის გავლით ალაზნამდე დაახლოებით 75 კილომეტრი გრუნტისა და თიხის
    სავალია, ამიტომ რეინჯერებს ჰკითხეთ, რომელი მიმართულებაა გასავალი. სულ დაახლოებით 205 კმ და ხუთი საათი
    ერთი მიმართულებით. ნავიგაციის აპლიკაციები ამ მონაკვეთს ვერ ითვლიან, ამიტომ მათ შეფასებებს ნუ ენდობით.
    მხოლოდ ოფროუდ კლასი, სასურველია — მეორე მანქანასთან ერთად; უმჯობესია, ღამე მოსახვევთან გაათიოთ და
    იმავე დღეს უკან არ გამობრუნდეთ.
en:
  name: Mijniskure
  short: >-
    A horseshoe bend of the Alazani deep in Vashlovani, where the river is the border with Azerbaijan:
    cliffs, fast dark water and a border post.
  body: >-
    **At Mijniskure the Alazani, which rises in the snows of the Greater Caucasus, swings through a tight
    horseshoe — and the river you are looking at is the frontier with Azerbaijan.**


    This is the remote south-eastern edge of Vashlovani, protected since 1935 for its dry, semi-desert
    woodland and enlarged in 2003 into the Vashlovani protected areas: a strict reserve, a national park
    and several natural monuments, some 440 square kilometres in all. To a Georgian ear the name speaks
    plainly: mijna means a boundary. Do not come looking for ruins or chronicles. The story of this place
    is the border and the protection of the land around it.


    Getting here is half the experience: hours of clay track from Dedoplistskaro across bare, eroded badlands.
    Then the river appears, dark and fast between tall grass and sheer rock walls, and from the cliffs
    above you can take in the whole loop at once. By the water stand a few cottages and a campground,
    the usual lunch stop and turning point of a Vashlovani day, and a Georgian border post where documents
    are checked. Trails lead off towards Shavi Mta, the Black Mountain, and the park promotes the bend
    for fly-fishing and birdwatching.


    Vashlovani is also where the Caucasian leopard came back: a track was found in 2003, and in 2004 the
    cat walked in front of a camera trap. Wolves, brown bears, jungle cats and golden jackals share the
    land. You will almost certainly see none of them; after dark, the valley is theirs.


    Few roads in Georgia end quite so literally.
  tip: >-
    Register first at the Vashlovani visitor centre in Dedoplistskaro and carry your passport: this is
    a border zone, and the guards at Mijniskure will check it. Fees are settled at the centre; one recent
    trip report gave about 40 GEL a night for a cottage and 5 GEL per person for camping, so confirm current
    prices. Take everything with you — fuel, food and at least three litres of water per person a day
    — as nothing is sold beyond Dedoplistskaro. Summer can pass 40 °C, so May–June and September–October
    are kinder. Keep to marked areas, do not photograph the border post without asking, and never go after
    heavy rain.
  route: >-
    From Tbilisi take the S5 east past Sagarejo, turn onto the Sh40 for Sighnaghi, then follow the Sh41
    via Bodbe to the Sh39 and Dedoplistskaro: about 130 km of asphalt, roughly two hours. Fill the tank
    here. Beyond town there are no real roads, only some 75 km of dirt and clay track across the park
    to the Alazani, so ask the rangers which line is passable. Reckon on about 205 km and five hours one
    way. Navigation apps cannot route this stretch, so do not trust their estimates. Offroad class only,
    ideally with a second vehicle; plan to sleep at the bend rather than drive back the same day.
ru:
  name: Миджнискуре
  short: >-
    Подкова Алазани в глубине Вашловани, где по реке проходит граница с Азербайджаном: обрывы, быстрая
    тёмная вода и пограничный пост.
  body: >-
    **У Миджнискуре Алазани, рождённая в снегах Большого Кавказа, выписывает крутую подкову — и река,
    на которую вы смотрите, и есть граница с Азербайджаном.**


    Это глухой юго-восточный край Вашловани: его охраняют с 1935 года ради засушливого полупустынного
    редколесья, а в 2003-м территорию расширили до Вашлованских охраняемых территорий — строгого заповедника,
    национального парка и нескольких памятников природы, в общей сложности около 440 квадратных километров.
    Грузинскому уху название говорит без обиняков: «миджна» значит «граница». Не ищите здесь руин и летописей.
    История этого места — сама граница и охрана земли вокруг неё.


    Дорога сюда — половина впечатлений: долгие часы глинистой колеи от Дедоплисцкаро через голые, изъеденные
    эрозией бедленды. Потом появляется река, тёмная и быстрая, между высокой травой и отвесными скальными
    стенами, и с обрывов над ней вся петля видна разом. У воды стоят несколько домиков и кемпинг — привычное
    место обеда и точка разворота вашлованского дня — и грузинский пограничный пост, где проверяют документы.
    Отсюда расходятся тропы к Шави-Мта, Чёрной горе, а парк предлагает излучину для нахлыстовой рыбалки
    и наблюдения за птицами.


    Вашловани — ещё и то место, куда вернулся кавказский леопард: в 2003 году нашли его след, а в 2004-м
    зверь прошёл перед фотоловушкой. Эту землю делят с ним волки, бурые медведи, камышовые коты и шакалы.
    Вы почти наверняка никого из них не увидите; после заката долина принадлежит им.


    Мало какие дороги в Грузии заканчиваются настолько буквально.
  tip: >-
    Сначала зарегистрируйтесь в визит-центре Вашловани в Дедоплисцкаро и возьмите паспорт: это пограничная
    зона, и на посту в Миджнискуре его проверят. Сборы оплачиваются в центре; по одному недавнему отчёту
    о поездке, домик стоил около 40 лари за ночь, а кемпинг — 5 лари с человека, так что уточните актуальные
    цены. Везите с собой всё — топливо, еду и не меньше трёх литров воды на человека в день: за Дедоплисцкаро
    ничего не продают. Летом бывает за 40 °C, поэтому май–июнь и сентябрь–октябрь милосерднее. Держитесь
    отведённых мест, не снимайте пограничный пост без разрешения и никогда не отправляйтесь сюда после
    сильного дождя.
  route: >-
    Из Тбилиси по S5 на восток мимо Сагареджо, затем поворот на Sh40 к Сигнаги, дальше по Sh41 через Бодбе
    до Sh39 и Дедоплисцкаро: около 130 км по асфальту, примерно два часа. Здесь заправьтесь до полного
    бака. За городом настоящих дорог нет — только около 75 км грунтовой и глинистой колеи через парк до
    Алазани, так что спросите у рейнджеров, какой вариант проезжий. В одну сторону закладывайте около
    205 км и пяти часов. Навигаторы этот участок не прокладывают, так что их оценкам не доверяйте. Только
    внедорожник, в идеале — вторая машина в связке; планируйте ночёвку у излучины, а не обратный путь
    в тот же день.
fa:
  name: میجنیسکوره
  short: >-
    قوسی نعل‌اسبی از آلازانی در دل واشلوانی، جایی که رود مرز با جمهوری آذربایجان است: صخره‌ها، آبی تیره
    و تند و یک پاسگاه مرزی.
  body: >-
    **در میجنیسکوره، آلازانی که از برف‌های قفقاز بزرگ سرچشمه می‌گیرد، قوسی تنگ و نعل‌اسبی می‌زند؛ و رودی
    که پیش چشم دارید، مرز با جمهوری آذربایجان است.**


    اینجا لبهٔ دورافتادهٔ جنوب‌شرقی واشلوانی است؛ سرزمینی که از سال ۱۹۳۵ به خاطر بیشه‌زارهای خشک و نیمه‌بیابانی‌اش
    حفاظت می‌شود و در سال ۲۰۰۳ به مجموعهٔ مناطق حفاظت‌شدهٔ واشلوانی گسترش یافت: یک ذخیره‌گاه طبیعیِ حفاظت
    مطلق، یک پارک ملی و چند اثر طبیعی، روی هم حدود ۴۴۰ کیلومتر مربع. برای گوش گرجی، نام این مکان صریح
    سخن می‌گوید: «میجنا» یعنی مرز. به دنبال ویرانه و وقایع‌نامه نیایید. داستان اینجا خودِ مرز است و حفاظت
    از زمین پیرامون آن.


    رسیدن به اینجا نیمی از تجربه است: ساعت‌ها راه خاکی و رسی از ددوپلیس‌تسکارو، از میان زمین‌های بایر،
    برهنه و فرسوده. آنگاه رود پدیدار می‌شود، تیره و تند، میان علف‌های بلند و دیواره‌های صخره‌ای عمودی،
    و از بالای صخره‌ها می‌توان تمام قوس را یکجا دید. کنار آب چند کلبه و یک اردوگاه هست، که استراحتگاه
    همیشگیِ ناهار و نقطهٔ بازگشتِ یک روز گشت در واشلوانی است، و یک پاسگاه مرزی گرجستان که مدارک را بررسی
    می‌کند. کوره‌راه‌هایی از اینجا به سوی شاوی‌مْتا، یعنی کوه سیاه، می‌روند و پارک این قوس رود را برای
    ماهیگیری با قلاب مگسی و پرنده‌نگری معرفی می‌کند.


    واشلوانی همچنین جایی است که پلنگ قفقازی به آن بازگشت: در سال ۲۰۰۳ ردپایی از آن پیدا شد و در سال ۲۰۰۴
    این گربه‌سان از برابر یک دوربین تله‌ای گذشت. گرگ‌ها، خرس‌های قهوه‌ای، گربه‌های جنگلی و شغال‌های طلایی
    نیز در این سرزمین شریک‌اند. به احتمال بسیار زیاد هیچ‌یک را نخواهید دید؛ پس از تاریکی، دره از آنِ آن‌هاست.


    کمتر جاده‌ای در گرجستان این‌چنین به معنای واقعی کلمه به پایان می‌رسد.
  tip: >-
    نخست در مرکز بازدیدکنندگان واشلوانی در ددوپلیس‌تسکارو ثبت‌نام کنید و گذرنامه‌تان را همراه داشته باشید:
    اینجا منطقهٔ مرزی است و مرزبانان در میجنیسکوره آن را بررسی می‌کنند. هزینه‌ها در همان مرکز پرداخت می‌شود؛
    یک سفرنامهٔ تازه برای هر شب در کلبه حدود ۴۰ لاری و برای کمپینگ نفری ۵ لاری ذکر کرده است، پس قیمت‌های
    روز را بپرسید. همه‌چیز را با خود ببرید، سوخت، غذا و دست‌کم سه لیتر آب برای هر نفر در روز، زیرا پس
    از ددوپلیس‌تسکارو چیزی فروخته نمی‌شود. تابستان ممکن است دما از ۴۰ درجهٔ سانتی‌گراد بگذرد، پس مه تا
    ژوئن و سپتامبر تا اکتبر ملایم‌ترند. در محدوده‌های مشخص بمانید، بی‌اجازه از پاسگاه مرزی عکس نگیرید
    و هرگز پس از باران سنگین راه نیفتید.
  route: >-
    از تفلیس جادهٔ S5 را به سمت شرق و از کنار ساگارجو بگیرید، به جادهٔ Sh40 به سوی سیغناغی بپیچید، سپس
    از راه بودبه جادهٔ Sh41 را تا Sh39 و ددوپلیس‌تسکارو ادامه دهید: حدود ۱۳۰ کیلومتر آسفالت، تقریباً دو
    ساعت. همین‌جا باک را پر کنید. پس از شهر جادهٔ واقعی وجود ندارد، فقط حدود ۷۵ کیلومتر راه خاکی و رسی
    از میان پارک تا آلازانی؛ پس از محیط‌بانان بپرسید کدام مسیر قابل عبور است. برای یک طرف حدود ۲۰۵ کیلومتر
    و پنج ساعت در نظر بگیرید. برنامه‌های مسیریابی این بخش را نمی‌شناسند، پس به برآوردهایشان اعتماد نکنید.
    فقط خودروی آفرود، و بهتر است با یک خودروی دوم همراه؛ برنامه بریزید که شب را کنار قوس رود بمانید، نه
    اینکه همان روز برگردید.
he:
  name: מיג'ניסקורה
  short: 'פרסה של נהר האלזאני בלב ושלובאני, במקום שבו הנהר הוא הגבול עם אזרבייג''ן: צוקים, מים כהים ומהירים
    ועמדת גבול.'
  body: >-
    **במיג'ניסקורה האלזאני, שנובע בשלגי הקווקז הגדול, מתעקל בפרסה הדוקה — והנהר שאתם מביטים בו הוא הגבול
    עם אזרבייג'ן.**


    זהו הקצה הדרום-מזרחי הנידח של ושלובאני, שמוגן מאז 1935 בזכות חורש צחיח ומדברי-למחצה, ובשנת 2003 הורחב
    למכלול השטחים המוגנים של ושלובאני — שמורת טבע קפדנית, פארק לאומי וכמה אתרי טבע מוגנים, כ-440 קמ"ר
    בסך הכול. לאוזן גאורגית השם מדבר בפשטות: "מיג'נה" פירושה גבול. אל תבואו לחפש חורבות או כרוניקות. סיפורו
    של המקום הזה הוא הגבול וההגנה על האדמה שסביבו.


    הדרך לכאן היא חצי מהחוויה: שעות של דרך עפר חרסיתית מדדופליסצקארו, דרך שטחי בתרונות חשופים ושחוקים.
    ואז מופיע הנהר, כהה ומהיר, בין עשב גבוה לקירות סלע תלולים, ומהצוקים שמעליו אפשר לראות את כל הלולאה
    בבת אחת. לצד המים עומדים כמה בקתות ואתר קמפינג — תחנת הצהריים הקבועה ונקודת הסיבוב של יום בושלובאני
    — ועמדת גבול גאורגית שבה בודקים מסמכים. שבילים יוצאים מכאן לעבר שאווי מטה, ההר השחור, והפארק מציע
    את העיקול לדיג בחכת זבוב ולצפרות.


    ושלובאני היא גם המקום שאליו חזר הנמר הקווקזי: ב-2003 נמצאו עקבותיו, וב-2004 חלף החתול הגדול מול מצלמת
    מלכודת. זאבים, דובים חומים, חתולי ביצות ותנים חולקים איתו את השטח. כמעט בוודאות לא תראו אף אחד מהם;
    אחרי רדת החשכה, העמק שייך להם.


    מעט דרכים בגאורגיה מגיעות לסופן באופן מילולי כל כך.
  tip: >-
    הירשמו קודם במרכז המבקרים של ושלובאני בדדופליסצקארו והביאו דרכון: זה אזור גבול, ובעמדה במיג'ניסקורה
    יבדקו אותו. התשלומים מוסדרים במרכז; לפי דיווח טיול עדכני אחד, בקתה עלתה כ-40 לארי ללילה וקמפינג 5
    לארי לאדם, אז ודאו את המחירים הנוכחיים. קחו איתכם הכול — דלק, אוכל ולפחות שלושה ליטרים מים לאדם ליום
    — כי אחרי דדופליסצקארו לא נמכר דבר. בקיץ החום עלול לעבור 40 מעלות, ולכן מאי–יוני וספטמבר–אוקטובר נעימים
    יותר. הישארו באזורים המסומנים, אל תצלמו את עמדת הגבול בלי לבקש רשות, ולעולם אל תצאו אחרי גשם כבד.
  route: >-
    מטביליסי סעו מזרחה בכביש S5 על פני סגרג'ו, פנו לכביש Sh40 לכיוון סיגנאגי, והמשיכו בכביש Sh41 דרך בודבה
    עד Sh39 ודדופליסצקארו: כ-130 ק"מ של אספלט, בערך שעתיים. כאן מלאו את המכל. אחרי העיירה אין דרכים של
    ממש, רק כ-75 ק"מ של דרך עפר וחרסית דרך הפארק עד האלזאני, אז שאלו את הפקחים איזה נתיב עביר. חשבו על
    כ-205 ק"מ וחמש שעות לכל כיוון. אפליקציות ניווט אינן יודעות לנתב את הקטע הזה, לכן אל תסמכו על ההערכות
    שלהן. רק רכב שטח, ורצוי עם רכב שני בשיירה; תכננו ללון ליד העיקול ולא לחזור באותו יום.
ar:
  name: ميجنيسكوري
  short: >-
    منعطف على هيئة حدوة حصان لنهر ألازاني في عمق فاشلوفاني، حيث النهر هو الحدود مع أذربيجان: جروف ومياه
    داكنة سريعة ومخفر حدودي.
  body: >-
    **في ميجنيسكوري يرسم نهر ألازاني، النابع من ثلوج القوقاز الكبير، حدوة ضيقة في مجراه، والنهر الذي تنظرون
    إليه هو نفسه الحدّ الفاصل مع أذربيجان.**


    هذا هو الطرف الجنوبي الشرقي النائي من فاشلوفاني، المحمي منذ عام 1935 لأجل أحراجه الجافة شبه الصحراوية،
    والذي وُسِّع عام 2003 ليصير مجمّع فاشلوفاني للمناطق المحمية: محمية طبيعية صارمة ومنتزهًا وطنيًا وعدة
    معالم طبيعية، بمساحة نحو 440 كيلومترًا مربعًا في المجموع. وللأذن الجورجية يقول الاسم معناه صراحة:
    «ميجنا» تعني الحدّ. لا تأتوا بحثًا عن أطلال أو حوليات. حكاية هذا المكان هي الحدود نفسها وحماية الأرض
    من حولها.


    الوصول إلى هنا نصف التجربة: ساعات من المسالك الطينية انطلاقًا من ديدوبليستسكارو عبر أراضٍ جرداء عارية
    نحتها التعرية. ثم يظهر النهر، داكنًا سريعًا بين العشب الطويل وجدران الصخر العمودية، ومن الجروف فوقه
    ترون الانعطافة كلها دفعة واحدة. عند الماء بضعة أكواخ ومخيم، هو محطة الغداء المعتادة ونقطة العودة في
    يوم فاشلوفاني، ومخفر حدود جورجي تُفحص فيه الوثائق. ومن هنا تتفرع دروب نحو شافي متا، الجبل الأسود،
    ويروّج المنتزه للانعطافة مكانًا لصيد الأسماك بالذباب الاصطناعي ولمراقبة الطيور.


    وفاشلوفاني أيضًا حيث عاد النمر القوقازي: ففي عام 2003 عُثر على أثره، وفي عام 2004 مرّ الحيوان أمام
    كاميرا مصيدة. وتشاركه الأرض الذئاب والدببة البنية وقطط الأدغال وبنات آوى الذهبية. وعلى الأرجح لن تروا
    أيًّا منها؛ فبعد حلول الظلام يصير الوادي لها.


    قليلة هي الطرق في جورجيا التي تنتهي بهذا المعنى الحرفي.
  tip: >-
    سجّلوا أولًا في مركز زوار فاشلوفاني في ديدوبليستسكارو واحملوا جوازات سفركم: هذه منطقة حدودية، وسيفحصها
    الحرس في ميجنيسكوري. تُدفع الرسوم في المركز؛ وقد ذكر تقرير رحلة حديث نحو 40 لاري لليلة في كوخ و5 لاري
    للشخص للتخييم، فتحققوا من الأسعار الحالية. احملوا كل شيء معكم: الوقود والطعام وثلاثة لترات ماء على
    الأقل للشخص يوميًا، إذ لا يُباع شيء بعد ديدوبليستسكارو. قد تتجاوز الحرارة 40 درجة مئوية صيفًا، لذا
    فمايو ويونيو وسبتمبر وأكتوبر أرحم. التزموا بالمناطق المحددة، ولا تصوّروا المخفر الحدودي دون استئذان،
    ولا تنطلقوا أبدًا بعد مطر غزير.
  route: >-
    من تبليسي خذوا طريق S5 شرقًا مرورًا بساغاريجو، ثم انعطفوا إلى طريق Sh40 نحو سيغناغي، واتبعوا طريق
    Sh41 عبر بودبي حتى طريق Sh39 وديدوبليستسكارو: نحو 130 كم معبّدة، قرابة ساعتين. هنا املؤوا الخزان.
    بعد البلدة لا طرق حقيقية، بل نحو 75 كم من المسالك الترابية والطينية عبر المنتزه حتى نهر ألازاني، فاسألوا
    الحراس عن المسار السالك. احسبوا نحو 205 كم وخمس ساعات في الاتجاه الواحد. تطبيقات الملاحة لا تعرف هذا
    المقطع، فلا تثقوا بتقديراتها. لسيارات الطرق الوعرة فقط، ويُفضَّل مع سيارة ثانية؛ وخططوا للمبيت عند
    الانعطافة لا للعودة في اليوم نفسه.
