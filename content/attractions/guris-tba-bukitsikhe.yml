ka:
  name: გურის ტბა
  short: >-
    სუფსის ნელი, თავთხელი გუბე სოფლის ხიდის ქვეშ, ბუკისციხეში, სადაც ახლომახლო სოფლების ბავშვები ზაფხულს
    ატარებენ; ნაპირზე მაღაზია და სასაუზმეა.
  body: >-
    **გურის ტბა, სახელის მიუხედავად, სულაც არ არის ტბა — ეს სუფსის მონაკვეთია, რომელიც ბუკისციხესა და
    იანეულს შორის, ხიდის ქვეშ, დინებას ანელებს, და ირგვლივ მდებარე სოფლებს ეს ყოველთვის ჰყოფნიდათ.**


    ტრადიციულად აქ ატარებენ ზაფხულს ჩოხატაურის მუნიციპალიტეტის ამ კუთხის ახალგაზრდები და ბავშვები: ბანაობენ
    ნელ წყალში, ნაპირზე კი ფრენბურთს თამაშობენ. ეს უწინარეს ყოვლისა ადგილობრივების ადგილია და მხოლოდ მერე
    — სანახაობა. სწორედ ამიტომ ღირს აქ გაჩერება.


    მოლოდინი გონივრული იქონიეთ. გუბე თავთხელია და, როგორც ამბობენ, წყალი ახლა წინანდელზე დაბალია; სიღრმე
    სეზონსა და წვიმებზეა დამოკიდებული. სამაგიეროდ ნაპირი გამოცოცხლდა: დღეს აქ პატარა მაღაზიაა, ბარი, სადაც
    ჰოთ-დოგსა და პიცას ყიდიან, და სასტუმრო სახლი „გურისტბა“, რომელიც მდინარეს გადაჰყურებს.


    რატომ შეარქვეს მდინარის გუბეს ტბა, არსად არის ჩაწერილი, და ვარაუდებს არ გამოვთქვამთ. ცხელ შუადღეს,
    მეზობელ დაბლაციხეში ნიკო მარის სახლ-მუზეუმის ნახვის შემდეგ მოდით, სხვებთან ერთად შედით მდინარეში და
    ერთი საათით ჩვეულებრივი გურული ზაფხულის ნაწილი გახდით.
  tip: >-
    საბანაოდ საუკეთესოა ივლისი და აგვისტო, როცა წყალი თბილია და დინება — წყნარი; სეზონი დაახლოებით მაისიდან
    ოქტომბრამდე გრძელდება. წყალში შესვლამდე სიღრმე და დინება თავად შეამოწმეთ და ბავშვებს თვალი არ მოაშოროთ:
    მაშველის იმედი ნუ გექნებათ. ძლიერი წვიმის შემდეგ სუფსა დიდდება და იმღვრევა, ამიტომ მაშინ ბანაობას
    თავი აარიდეთ. მაღაზია და ბარი უბრალოა. პირსახოცი არ დაგავიწყდეთ, ქვებზე სასიარულოდ კი წყლის ფეხსაცმელი
    გამოგადგებათ. შაბათ-კვირას აქ ადგილობრივი ოჯახები იკრიბებიან. ეს სოფლის საბანაოა და არა ტურისტული
    პლაჟი: მუსიკას ხმას დაუწიეთ, ნაგავი კი თან წაიღეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის, ხაშურისა და ქუთაისის გავლით, სამტრედიამდე იარეთ, იქიდან
    S12-ით ლანჩხუთის მიმართულებით დაახლოებით 7 კილომეტრი. საჯავახოსთან სამხრეთით, შ2-ზე გადაუხვიეთ და
    ჩოხატაურამდე დაახლოებით 18 კილომეტრი გაიარეთ. ჩოხატაურიდან აღმოსავლეთით სუფსის ხეობის გზას გაჰყევით,
    დაბლაციხის გავლით ბუკისციხემდე; გუბე ბუკისციხესა და იანეულს შორის, ხიდის ქვეშაა. სულ დაახლოებით 278
    კმ და 4 საათი და 30 წუთი. გზა თითქმის ბოლომდე მოასფალტებულია, მდინარის პირამდე კი მოკლე ბილიკით ფეხით
    ჩახვალთ. ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავი ჩოხატაურში ჩაასხით.
en:
  name: Guris Tba natural pool (Bukitsikhe)
  short: >-
    A slow, shallow pool of the Supsa under a village bridge in Bukitsikhe, where local children have
    long spent their summers; a shop and snack bar sit above.
  body: >-
    **Guris Tba is not a lake at all, whatever its name says (tba is Georgian for "lake"): it is a stretch
    of the Supsa that slows down under a bridge between the villages of Bukitsikhe and Ianeuli, and for
    the villages around it that has always been enough.**


    Traditionally this is where the young people and children of this corner of Chokhatauri municipality
    spend their summer, swimming in the slow water and playing volleyball on the bank. It is a local place
    first and a sight second, and that is exactly why it is worth the stop.


    Keep your expectations honest. The pool is shallow, and the water is said to be lower now than it
    used to be; its depth changes with the season and the rain. What has grown is the bank. There is now
    a small shop, a bar selling hot dogs and pizza, and a guesthouse, Guristba, that looks out over the
    river.


    Why a river pool came to be called a lake is not recorded anywhere we could find, and we will not
    guess. Come on a hot afternoon, after the Niko Marr house-museum in neighbouring Dablatsikhe. Wade
    into the river with everyone else, and for an hour become part of an ordinary Gurian summer.
  tip: >-
    The swimming is best in July and August, when the water is warm and the current gentle; the wider
    season runs roughly from May to October. Check the depth and the flow yourself before going in, and
    keep an eye on children, because you should not expect a lifeguard. After heavy rain the Supsa rises
    and turns muddy, so skip the swim then. The shop and bar are simple. Bring a towel, and water shoes
    help on the river stones. Weekends bring local families. This is a village's swimming hole, not a
    tourist beach: keep the music down and take your rubbish home.
  route: >-
    From Tbilisi take the E60/S1 west past Gori, Khashuri and Kutaisi to Samtredia, then the S12 towards
    Lanchkhuti for about 7 km. At Sajavakho turn south onto the Sh2 and follow it some 18 km to Chokhatauri.
    From Chokhatauri take the Supsa valley road east through Dablatsikhe to Bukitsikhe; the pool lies
    under the bridge between Bukitsikhe and Ianeuli. Allow about 278 km and 4 hours 30 minutes. The road
    is paved almost to the end, and a short path leads down to the riverbank on foot. An economy car is
    fine. Refuel in Chokhatauri.
ru:
  name: Природная купальня Гурис-Тба (Букицихе)
  short: >-
    Тихий мелкий плёс Супсы под сельским мостом в Букицихе, где местные дети издавна проводят лето; наверху
    — магазинчик и закусочная.
  body: >-
    **Гурис-Тба — вовсе не озеро, что бы ни обещало название («тба» по-грузински значит «озеро»): это
    участок Супсы, где река замедляется под мостом между сёлами Букицихе и Иануели, и окрестным сёлам
    этого всегда хватало.**


    По традиции именно здесь проводят лето подростки и дети этого уголка Чохатаурского муниципалитета:
    купаются в медленной воде и играют в волейбол на берегу. Это прежде всего место для своих и лишь потом
    — достопримечательность, и именно поэтому здесь стоит остановиться.


    Не ждите лишнего. Здесь мелко, и, говорят, воды теперь меньше, чем прежде; глубина меняется в зависимости
    от сезона и дождей. Зато обжился берег: появились маленький магазин, бар с хот-догами и пиццей и гостевой
    дом «Гуристба» с видом на реку.


    Почему речной плёс назвали озером, нигде не записано — по крайней мере, мы таких сведений не нашли,
    — и гадать мы не станем. Приезжайте жарким днём, после дома-музея Нико Марра в соседнем Даблацихе.
    Зайдите в реку вместе со всеми — и на час станьте частью обычного гурийского лета.
  tip: >-
    Лучше всего купаться в июле и августе, когда вода тёплая, а течение спокойное; в целом сезон длится
    примерно с мая по октябрь. Прежде чем заходить в воду, сами проверьте глубину и течение и не спускайте
    глаз с детей: спасателя здесь не ждите. После сильных дождей Супса поднимается и мутнеет — тогда от
    купания лучше отказаться. Магазин и бар самые простые. Возьмите полотенце; на речных камнях пригодится
    обувь для воды. По выходным приезжают местные семьи. Это сельская купальня, а не туристический пляж:
    не включайте музыку громко и увозите мусор с собой.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори, Хашури и Кутаиси до Самтредиа, затем около 7 км по S12 в
    сторону Ланчхути. У Саджавахо сверните на юг на Sh2 и через 18 км доедете до Чохатаури. Из Чохатаури
    поезжайте на восток дорогой по долине Супсы через Даблацихе до Букицихе; купальня — под мостом между
    Букицихе и Иануели. Рассчитывайте примерно на 278 км и 4 часа 30 минут. Асфальт почти до самого конца,
    а к берегу ведёт короткая пешеходная тропа. Хватит машины эконом-класса. Заправьтесь в Чохатаури.
fa:
  name: استخر طبیعی گوریس تبا (بوکیتسیخه)
  short: >-
    آبگیری آرام و کم‌عمق از رود سوپسا زیر پل روستای بوکیتسیخه، که بچه‌های محلی از دیرباز تابستان‌هایشان
    را آنجا می‌گذرانند؛ بالای آن مغازه و بوفه‌ای هست.
  body: >-
    **گوریس تبا، برخلاف آنچه نامش می‌گوید («تبا» در گرجی یعنی دریاچه)، اصلاً دریاچه نیست: تکه‌ای از رود
    سوپساست که زیر پلی میان روستاهای بوکیتسیخه و یانئولی آرام می‌گیرد، و برای روستاهای اطراف همین همیشه
    کافی بوده است.**


    به رسم دیرین، جوانان و کودکان این گوشه از شهرداری چوخاتائوری تابستان را همین‌جا می‌گذرانند: در آب
    آرام شنا می‌کنند و کنار رود والیبال بازی می‌کنند. اینجا پیش از هر چیز جایی برای اهالی است و در درجهٔ
    دوم دیدنی، و درست به همین دلیل ارزش توقف دارد.


    انتظارتان را واقع‌بینانه نگه دارید. آبگیر کم‌عمق است و می‌گویند آبش اکنون از گذشته کمتر است؛ عمقش
    با فصل و باران تغییر می‌کند. در عوض، کرانهٔ رود رونق گرفته است: اکنون مغازهٔ کوچکی هست، باری که هات‌داگ
    و پیتزا می‌فروشد، و مهمان‌خانه‌ای به نام «گوریستبا» که رو به رود است.


    اینکه چرا آبگیری رودخانه‌ای را دریاچه نامیده‌اند در هیچ منبعی که یافتیم ثبت نشده، و ما هم حدس نمی‌زنیم.
    در بعدازظهری گرم، پس از دیدن خانه‌موزهٔ نیکو مار در دابلاتسیخهٔ همسایه، بیایید. همراه با دیگران به
    آب بزنید و یک ساعت بخشی از تابستانی معمولی در گوریا شوید.
  tip: >-
    بهترین زمان شنا ژوئیه و اوت است، که آب گرم و جریان ملایم است؛ فصل گسترده‌تر تقریباً از مه تا اکتبر
    است. پیش از رفتن به آب، عمق و جریان را خودتان بسنجید و مراقب بچه‌ها باشید، چون نجات‌غریقی در کار نیست.
    پس از باران‌های سنگین، سوپسا بالا می‌آید و گل‌آلود می‌شود؛ آن وقت از شنا بگذرید. مغازه و بار ساده‌اند.
    حوله بیاورید؛ کفش مخصوص آب هم روی سنگ‌های رود به کار می‌آید. آخر هفته‌ها خانواده‌های محلی می‌آیند.
    اینجا آب‌تنی‌گاه یک روستاست، نه ساحلی توریستی: صدای موسیقی را پایین نگه دارید و زباله‌تان را با خود
    ببرید.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب بروید و از کنار گوری، خاشوری و کوتایسی تا سامترِدیا پیش بروید،
    سپس حدود ۷ کیلومتر با S12 به سوی لانچخوتی. در ساجاواخو به جنوب و به جادهٔ Sh2 بپیچید و حدود ۱۸ کیلومتر
    تا چوخاتائوری ادامه دهید. از چوخاتائوری جادهٔ درهٔ سوپسا را رو به شرق، از راه دابلاتسیخه، تا بوکیتسیخه
    بگیرید؛ آبگیر زیر پلی است که بوکیتسیخه را به یانئولی وصل می‌کند. حدود ۲۷۸ کیلومتر و ۴ ساعت و ۳۰ دقیقه
    در نظر بگیرید. جاده تقریباً تا انتها آسفالت است و کوره‌راهی کوتاه شما را پیاده به کنار رود می‌رساند.
    خودروی اقتصادی کافی است. در چوخاتائوری سوخت بزنید.
he:
  name: בריכת הטבע גוריס טבה (בוקיציחה)
  short: >-
    בריכה שקטה ורדודה בנהר סופסה, מתחת לגשר כפרי בבוקיציחה, שבה מבלים ילדי המקום את הקיץ מזה דורות; מעליה
    חנות ודוכן מזון מהיר.
  body: >-
    **גוריס טבה איננה אגם כלל, למרות מה שאומר שמה ("טבה" בגאורגית פירושו אגם): זהו קטע של נהר סופסה שבו
    הזרם מאט מתחת לגשר בין הכפרים בוקיציחה ויאנאולי, ולכפרים שמסביב זה תמיד הספיק.**


    לפי המסורת, כאן מבלים את הקיץ בני הנוער והילדים של הפינה הזאת במוניציפליטת צ׳וחאטאורי: שוחים במים
    האיטיים ומשחקים כדורעף על הגדה. זה קודם כול מקום של המקומיים ורק אחר כך אתר, ובדיוק בגלל זה כדאי לעצור
    בו.


    שמרו על ציפיות מציאותיות. הבריכה רדודה, ואומרים שהמים נמוכים היום משהיו בעבר; העומק משתנה עם העונה
    והגשמים. הגדה, לעומת זאת, התפתחה: יש בה עכשיו חנות קטנה, בר שמוכר נקניקיות בלחמנייה ופיצה, ובית הארחה
    בשם "גוריסטבה" הצופה אל הנהר.


    מדוע נקראה בריכת נהר בשם אגם אינו מתועד בשום מקום שמצאנו, ואנחנו לא ננחש. בואו אחר צהריים חם, אחרי
    בית-המוזיאון של ניקו מאר בדבלציחה השכנה. היכנסו לנהר עם כולם, ולשעה אחת היו חלק מקיץ גוריאני רגיל.
  tip: >-
    הרחצה הטובה ביותר היא ביולי ובאוגוסט, כשהמים חמימים והזרם עדין; העונה הרחבה נמשכת בערך ממאי עד אוקטובר.
    בדקו בעצמכם את העומק ואת הזרם לפני שנכנסים, ושימו עין על הילדים, כי אין לצפות למציל. אחרי גשם כבד
    הסופסה עולה ונעשית עכורה, ואז עדיף לוותר על הרחצה. החנות והבר פשוטים. הביאו מגבת; נעלי מים עוזרות
    על אבני הנהר. בסופי שבוע מגיעות משפחות מקומיות. זה מקום הרחצה של כפר, לא חוף תיירותי: הנמיכו את המוזיקה
    וקחו את האשפה איתכם.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני גורי, חשורי וקוטאיסי עד סמטרדיה, ואז כ-7 ק״מ בכביש S12 לכיוון
    לנצ׳חותי. בסג'אווחו פנו דרומה לכביש Sh2 והמשיכו בו כ-18 ק״מ עד צ׳וחאטאורי. מצ׳וחאטאורי סעו מזרחה בכביש
    עמק הסופסה, דרך דבלציחה, עד בוקיציחה; הבריכה נמצאת מתחת לגשר בין בוקיציחה ליאנאולי. חשבו על כ-278
    ק״מ ו-4 שעות ו-30 דקות. הדרך סלולה כמעט עד הסוף, ושביל קצר יורד ברגל אל גדת הנהר. רכב אקונומי מספיק.
    תדלקו בצ׳וחאטאורי.
ar:
  name: مسبح «غوريس تبا» الطبيعي (بوكيتسيخه)
  short: >-
    بركة هادئة ضحلة من نهر سوبسا تحت جسر قروي في بوكيتسيخه، يقضي فيها أطفال المكان صيفهم منذ زمن؛ وفوقها
    دكان ومقصف للوجبات الخفيفة.
  body: >-
    **«غوريس تبا» ليست بحيرة على الإطلاق، مهما قال اسمها («تبا» بالجورجية تعني بحيرة): إنها مقطع من نهر
    سوبسا يتباطأ جريانه تحت جسر بين قريتي بوكيتسيخه ويانيولي، وهذا كان دائماً كافياً للقرى من حوله.**


    جرت العادة أن يقضي فتيان هذه الزاوية من بلدية تشوخاتاوري وأطفالها الصيف هنا، يسبحون في الماء البطيء
    ويلعبون الكرة الطائرة على الضفة. إنه مكان لأهله أولاً ومَعلم ثانياً، ولهذا بالذات يستحق التوقف.


    اجعل توقعاتك واقعية. البركة ضحلة، ويُقال إن الماء اليوم أقل مما كان؛ ويتغير عمقه مع الفصل والمطر.
    أما الضفة فقد عمرت: فيها الآن دكان صغير، وبار يبيع النقانق والبيتزا، وبيت ضيافة اسمه «غوريستبا» يطل
    على النهر.


    لم نجد في أي مصدر سبباً مدوّناً لتسمية بركة نهرية بحيرةً، ولن نخمّن. تعالَ في عصر يوم حار، بعد زيارة
    البيت-المتحف لنيكو مار في دابلاتسيخه المجاورة. ادخل النهر مع الجميع، وكن لساعة جزءاً من صيف غوري عادي.
  tip: >-
    أفضل السباحة في يوليو وأغسطس، حين يكون الماء دافئاً والتيار لطيفاً؛ أما الموسم الأوسع فيمتد تقريباً
    من مايو إلى أكتوبر. تحقّق بنفسك من العمق والتيار قبل النزول، وراقب الأطفال، فلا تتوقع وجود منقذ. بعد
    الأمطار الغزيرة يرتفع نهر سوبسا ويتعكّر، فتجنّب السباحة حينها. الدكان والبار بسيطان. أحضر منشفة؛ وتفيد
    أحذية الماء على حجارة النهر. في عطلات نهاية الأسبوع تأتي العائلات المحلية. هذا مسبح قرية لا شاطئ سياحي:
    اخفض صوت الموسيقى وخذ نفاياتك معك.
  route: >-
    من تبليسي اسلك E60/S1 غرباً مروراً بغوري وخاشوري وكوتايسي حتى سامتريديا، ثم S12 نحو 7 كم باتجاه لانتشخوتي.
    عند ساجافاخو انعطف جنوباً إلى Sh2 واتبعها نحو 18 كم حتى تشوخاتاوري. ومن تشوخاتاوري خذ طريق وادي سوبسا
    شرقاً عبر دابلاتسيخه حتى بوكيتسيخه؛ البركة تحت الجسر بين بوكيتسيخه ويانيولي. احسب نحو 278 كم و4 ساعات
    و30 دقيقة. الطريق معبّد حتى نهايته تقريباً، ويهبط درب قصير سيراً إلى ضفة النهر. تكفي سيارة اقتصادية.
    تزوّد بالوقود في تشوخاتاوري.
