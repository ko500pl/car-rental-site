ka:
  name: ბათუმის მოცეკვავე შადრევნები
  short: არდაგანის ტბის მომღერალი შადრევნები ახალ ბულვარზე — წყლის, ლაზერისა და მუსიკის უფასო შოუ ზაფხულის
    საღამოებში.
  body: >-
    **ზაფხულის საღამოს ბათუმში ხალხის ნაკადი ერთი მიმართულებით მიედინება — არდაგანის ტბისკენ.** ახალი
    ბულვარის ეს ხელოვნური ტბა თბილ სეზონზე ყოველ საღამოს ქალაქის მთავარ უფასო სანახაობად იქცევა: წყლის
    ჭავლები მუსიკის რიტმში ცეკვავენ, ფერადი განათება და ლაზერები კი მთელ ტბას სცენად აქცევს.


    შოუ დაბინდებისას, დაახლოებით 21:00 საათზე იწყება და შესვენებებით გვიან ღამემდე გრძელდება — თითო პროგრამა
    30 წუთამდეა. რეპერტუარი მოულოდნელად ფართოა:


    - საოპერო კლასიკა — პავაროტიდან დაწყებული

    - მსოფლიო ესტრადა — სტინგი, დაიანა როსი, ბარი უაიტი

    - ქართული სიმღერები, რომლებზეც ადგილობრივები ერთად მღერიან


    ტბის ირგვლივ სასეირნო ბილიკი და სკამებია, ისე რომ შოუს ნებისმიერი წერტილიდან უყურებ. ეს ადგილი განსაკუთრებით
    კარგად ბავშვიან ოჯახებზე მუშაობს — შადრევნების, ველოსიპედების და ნაყინის კომბინაცია უგებელია.


    ზამთარში შადრევნები ჩვეულებრივ გამორთულია, ტბა და ბულვარი კი მაინც სასიამოვნო გასასეირნებელი რჩება.
    მთავარი სეზონი მაისიდან ოქტომბრამდეა.
  tip: >-
    შოუ უფასოა და ბილეთი არ სჭირდება. მისვლა 21:00-ისთვის აჯობებს — საუკეთესო სკამები დაბინდებამდე იკავებენ.
    წყლის ჭავლებთან ახლოს ქარიან საღამოს დასველდები, ფოტოსთვის კი ეს ყველაზე ეფექტური წერტილია. ივლის-აგვისტოში
    ირგვლივ ხალხმრავლობაა; ველოსიპედის ბილიკს მიხედე. კაფეები და ტუალეტები ბულვარზეა. ზუსტი განრიგი სეზონზეა
    დამოკიდებული — ადგილზე გადაამოწმე.
  route: >-
    თბილისიდან ბათუმამდე E60/S1 მაგისტრალით: რიკოთის გვირაბები, ქუთაისის შემოვლითი, შემდეგ სანაპირო გზა
    ქობულეთის გავლით — დაახლოებით 373 კმ, 5:30 სთ, მთლიანად ასფალტი, საწვავი მთელ გზაზე. არდაგანის ტბა
    ახალ ბულვარზეა, ლეხ და მარია კაჩინსკების ქუჩის მხრიდან; ნავიგატორში „Ardagani Lake" აკრიფე. პარკინგი
    ბულვარის პარალელურ ქუჩებზეა, საღამოს ადგილი ძნელად იძებნება — 15 წუთით ადრე მიდი. ეკონომ-კლასის მანქანა
    სრულიად საკმარისია.
en:
  name: Batumi Dancing Fountains
  short: >-
    The singing fountains of Ardagani Lake on the New Boulevard — a free water, laser and music show on
    summer evenings.
  body: >-
    **On a summer evening in Batumi the crowd drifts in one direction — towards Ardagani Lake.** In the
    warm season this artificial lake on the New Boulevard becomes the city's main free spectacle every
    night: jets of water dance in time with the music while coloured lights and lasers turn the whole
    lake into a stage.


    The show starts around dusk, roughly at 21:00, and runs with breaks late into the night — each programme
    lasts up to 30 minutes. The repertoire is unexpectedly broad:


    - Opera classics, Pavarotti included

    - International pop — Sting, Diana Ross, Barry White

    - Georgian songs that get the locals singing along


    A walking path with benches circles the lake, so the show works from any vantage point. It is especially
    good with children — the combination of fountains, bike rides and ice cream is unbeatable.


    In winter the fountains are normally switched off, though the lake and the Boulevard remain a pleasant
    walk. The real season runs from May to October, peaking in July and August when the seafront stays
    busy past midnight.
  tip: >-
    The show is free and needs no ticket. Arrive by 21:00 — the best benches go before dark. Close to
    the jets you will get sprayed on a windy evening, but that is also the most dramatic photo spot. In
    July-August the whole area is crowded; mind the bike lane behind the benches. Cafes and toilets are
    along the Boulevard. Exact timings shift with the season, so double-check locally.
  route: >-
    From Tbilisi take the E60/S1 highway west: Rikoti tunnels, the Kutaisi bypass, then the coast road
    through Kobuleti — about 373 km and 5:30 of driving, asphalt throughout, with fuel stations the whole
    way. Ardagani Lake sits on the New Boulevard near Lech and Maria Kaczynski Street; put "Ardagani Lake"
    into the navigator. Parking is on the streets parallel to the Boulevard and fills up in the evening,
    so arrive 15 minutes early. An economy car is completely sufficient.
ru:
  name: Танцующие фонтаны Батуми
  short: Поющие фонтаны озера Ардагани на Новом бульваре — бесплатное шоу воды, лазеров и музыки летними
    вечерами.
  body: >-
    **Летним вечером толпа в Батуми стекается в одну сторону — к озеру Ардагани.** В тёплый сезон это
    искусственное озеро на Новом бульваре каждый вечер превращается в главное бесплатное зрелище города:
    струи воды танцуют в такт музыке, а цветная подсветка и лазеры делают сценой всё озеро.


    Шоу начинается в сумерках, около 21:00, и с перерывами идёт до поздней ночи — каждая программа длится
    до 30 минут. Репертуар неожиданно широкий:


    - Оперная классика, включая Паваротти

    - Мировая эстрада — Стинг, Дайана Росс, Барри Уайт

    - Грузинские песни, которые местные подпевают хором


    Вокруг озера идёт прогулочная дорожка со скамейками, так что шоу видно с любой точки. Особенно хорошо
    здесь с детьми: сочетание фонтанов, велосипедов и мороженого работает безотказно.


    Зимой фонтаны обычно выключены, но озеро и бульвар остаются приятным местом для прогулки. Настоящий
    сезон — с мая по октябрь, пик — июль и август, когда набережная не пустеет и за полночь.
  tip: >-
    Шоу бесплатное, билетов нет. Приходите к 21:00 — лучшие скамейки занимают до темноты. Вблизи струй
    в ветреный вечер вас обдаст брызгами, зато это самая эффектная точка для фото. В июле-августе вокруг
    многолюдно; следите за велодорожкой за скамейками. Кафе и туалеты — вдоль бульвара. Точное расписание
    меняется по сезону — уточняйте на месте.
  route: >-
    Из Тбилиси — по трассе E60/S1 на запад: Рикотские тоннели, объезд Кутаиси, затем прибрежная дорога
    через Кобулети — около 373 км и 5:30 езды, асфальт на всём протяжении, заправки по всему пути. Озеро
    Ардагани находится на Новом бульваре у улицы Леха и Марии Качиньских; в навигатор вбивайте «Ardagani
    Lake». Парковка — на улицах, параллельных бульвару; вечером места заканчиваются, приезжайте минут
    на 15 раньше. Машины эконом-класса вполне достаточно.
fa:
  name: فواره‌های رقصان باتومی
  short: فواره‌های آوازخوان دریاچهٔ آرداگانی در بلوار نو — نمایش رایگان آب و لیزر و موسیقی در شب‌های تابستان.
  body: >-
    **در شب‌های تابستان باتومی، جمعیت به یک سو روان می‌شود — به سوی دریاچهٔ آرداگانی.** در فصل گرم، این
    دریاچهٔ مصنوعی در بلوار نو هر شب به تماشایی‌ترین برنامهٔ رایگان شهر بدل می‌شود: فواره‌ها با ریتم موسیقی
    می‌رقصند و نورهای رنگی و لیزر کل دریاچه را به صحنه تبدیل می‌کنند.


    نمایش با تاریک شدن هوا، حدود ساعت 21:00 آغاز می‌شود و با وقفه‌هایی تا پاسی از شب ادامه دارد — هر برنامه
    تا 30 دقیقه طول می‌کشد. تنوع موسیقی غافلگیرکننده است:


    - کلاسیک‌های اپرا، از جمله پاواروتی

    - پاپ جهانی — استینگ، دایانا راس، بری وایت

    - ترانه‌های گرجی که اهالی با آن‌ها هم‌خوانی می‌کنند


    دور دریاچه مسیر پیاده‌روی و نیمکت هست و نمایش از هر نقطه دیدنی است. برای خانواده‌های بچه‌دار جای فوق‌العاده‌ای
    است — ترکیب فواره، دوچرخه و بستنی شکست‌ناپذیر است.


    در زمستان فواره‌ها معمولاً خاموش‌اند، هرچند دریاچه و بلوار همچنان برای قدم زدن دلپذیرند. فصل اصلی
    از مه تا اکتبر است و اوج آن ژوئیه و اوت، وقتی ساحل تا بعد از نیمه‌شب زنده است.
  tip: >-
    نمایش رایگان است و بلیت نمی‌خواهد. تا ساعت 21:00 برسید — بهترین نیمکت‌ها پیش از تاریکی پر می‌شوند.
    نزدیک فواره‌ها در شب بادخیز خیس می‌شوید، اما همان‌جا بهترین نقطهٔ عکاسی است. در ژوئیه و اوت همه‌جا
    شلوغ است؛ مراقب مسیر دوچرخه پشت نیمکت‌ها باشید. کافه‌ها و سرویس بهداشتی در طول بلوار هستند. ساعت دقیق
    برنامه با فصل عوض می‌شود — در محل بپرسید.
  route: >-
    از تفلیس با بزرگراه E60/S1 به غرب: تونل‌های ریکوتی، کمربندی کوتایسی و سپس جادهٔ ساحلی از کوبولتی —
    حدود 373 کیلومتر و 5:30 ساعت رانندگی، سراسر آسفالت با پمپ‌بنزین در تمام مسیر. دریاچهٔ آرداگانی در
    بلوار نو نزدیک خیابان لخ و ماریا کاچینسکی است؛ در مسیریاب «Ardagani Lake» را بزنید. پارکینگ در خیابان‌های
    موازی بلوار است و شب‌ها زود پر می‌شود — 15 دقیقه زودتر برسید. خودروی اقتصادی کاملاً کافی است.
he:
  name: המזרקות הרוקדות של בתומי
  short: המזרקות המזמרות של אגם ארדגני על הטיילת החדשה — מופע חינם של מים, לייזר ומוזיקה בערבי הקיץ.
  body: >-
    **בערב קיץ בבתומי הקהל זורם לכיוון אחד — אל אגם ארדגני.** בעונה החמה האגם המלאכותי הזה שעל הטיילת
    החדשה הופך מדי ערב למופע החינמי המרכזי של העיר: סילוני מים רוקדים בקצב המוזיקה, ותאורה צבעונית ולייזרים
    הופכים את האגם כולו לבמה.


    המופע מתחיל עם רדת החשכה, בסביבות 21:00, ונמשך בהפסקות עד שעה מאוחרת — כל תוכנית אורכת עד 30 דקות.
    הרפרטואר רחב במפתיע:


    - קלאסיקות אופרה, כולל פוורוטי

    - פופ עולמי — סטינג, דיאנה רוס, בארי וייט

    - שירים גאורגיים שהמקומיים מצטרפים אליהם בשירה


    סביב האגם שביל הליכה עם ספסלים, כך שהמופע נראה היטב מכל נקודה. המקום מצוין במיוחד לילדים — השילוב
    של מזרקות, אופניים וגלידה פשוט מנצח.


    בחורף המזרקות בדרך כלל כבויות, אבל האגם והטיילת נשארים מקום נעים לטיול. העונה האמיתית היא ממאי עד
    אוקטובר, והשיא ביולי-אוגוסט, כשהחוף הומה גם אחרי חצות.
  tip: >-
    המופע חינם ואין צורך בכרטיס. הגיעו עד 21:00 — הספסלים הטובים נתפסים לפני החשכה. קרוב לסילונים תירטבו
    בערב סוער, אבל זו גם נקודת הצילום הדרמטית ביותר. ביולי-אוגוסט צפוף; היזהרו משביל האופניים שמאחורי
    הספסלים. בתי קפה ושירותים לאורך הטיילת. לוח הזמנים המדויק משתנה לפי עונה — בדקו במקום.
  route: >-
    מטביליסי בכביש E60/S1 מערבה: מנהרות ריקוטי, עוקף כותאיסי, ואז כביש החוף דרך קובולטי — כ-373 ק"מ ו-5:30
    שעות נהיגה, אספלט לכל האורך ותחנות דלק בכל הדרך. אגם ארדגני נמצא על הטיילת החדשה ליד רחוב לך ומריה
    קצ'ינסקי; הקלידו בניווט "Ardagani Lake". החניה ברחובות המקבילים לטיילת ומתמלאת בערב — הגיעו רבע שעה
    מוקדם. רכב חסכוני מספיק לחלוטין.
ar:
  name: نوافير باتومي الراقصة
  short: النوافير الغنائية لبحيرة أرداغاني على الكورنيش الجديد — عرض مجاني للماء والليزر والموسيقى في
    أمسيات الصيف.
  body: >-
    **في أمسيات الصيف يتدفق الناس في باتومي باتجاه واحد — نحو بحيرة أرداغاني.** في الموسم الدافئ تتحول
    هذه البحيرة الاصطناعية على الكورنيش الجديد كل مساء إلى أهم فرجة مجانية في المدينة: نوافذ الماء ترقص
    على إيقاع الموسيقى، والأضواء الملونة والليزر تجعل من البحيرة كلها مسرحاً.


    يبدأ العرض مع الغسق، نحو الساعة 21:00، ويستمر مع فترات توقف حتى وقت متأخر من الليل — كل برنامج يمتد
    حتى 30 دقيقة. والذخيرة الموسيقية واسعة على نحو مفاجئ:


    - كلاسيكيات الأوبرا، ومنها بافاروتي

    - البوب العالمي — ستينغ وديانا روس وباري وايت

    - أغانٍ جورجية يشدو معها أهل المدينة


    يحيط بالبحيرة ممشى بمقاعد، فالعرض يُرى جيداً من أي نقطة. والمكان ممتاز خصوصاً للعائلات — فمزيج النوافير
    والدراجات والمثلجات لا يُقاوم.


    في الشتاء تُطفأ النوافير عادة، لكن البحيرة والكورنيش يبقيان مكاناً لطيفاً للنزهة. الموسم الحقيقي من
    مايو إلى أكتوبر، وذروته في يوليو وأغسطس حين يظل الشاطئ عامراً بعد منتصف الليل.
  tip: >-
    العرض مجاني ولا يحتاج تذكرة. احرص على الوصول قبل 21:00 — أفضل المقاعد تُحجز قبل حلول الظلام. قرب النوافير
    سيبللك الرذاذ في المساء العاصف، لكنها أيضاً أفضل نقطة للتصوير. في يوليو وأغسطس يشتد الزحام؛ وانتبه
    لمسار الدراجات خلف المقاعد. المقاهي ودورات المياه على طول الكورنيش. المواعيد الدقيقة تتغير بتغير الموسم
    — تحقق منها في المكان.
  route: >-
    من تبليسي عبر الطريق السريع E60/S1 غرباً: أنفاق ريكوتي، التفافية كوتايسي، ثم طريق الساحل عبر كوبوليتي
    — نحو 373 كم و5:30 ساعة قيادة، أسفلت كامل ومحطات وقود طوال الطريق. تقع بحيرة أرداغاني على الكورنيش
    الجديد قرب شارع ليخ وماريا كاتشينسكي؛ اكتب في الملاح «Ardagani Lake». المواقف في الشوارع الموازية
    للكورنيش وتمتلئ مساءً، فاحضر قبل الموعد بربع ساعة. سيارة اقتصادية تكفي تماماً.
