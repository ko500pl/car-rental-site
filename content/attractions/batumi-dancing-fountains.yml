ka:
  name: ბათუმის მოცეკვავე შადრევნები
  short: >-
    ძველი და ახალი ბულვარის შესაყართან არდაგანის ტბა ზაფხულის ღამეებში სცენად იქცევა: ფრანგული შადრევნები,
    მუსიკა და ლაზერი წყლის ფარდაზე.
  body: >-
    **ზაფხულის ღამეებში, ცხრა საათს ცოტა გადაცილებულს, არდაგანის ტბა სცენად იქცევა.** ჭავლები მუსიკის
    რიტმში აიწევა, წყლის მტვერი ფარდასავით შესქელდება და ლაზერი ჩამომავალ წყალზე სურათებს ხატავს — ქალაქის
    გზამკვლევ In Your Pocket-ის ცნობით, პროგრამის ნაწილი ბათუმისა და საქართველოს ისტორიას ჰყვება.


    ტბა ხელოვნურია. დღევანდელი სახე მას 2009 წელს მიეცა, როცა ძველი და ახალი ბულვარის შესაყარზე საფრანგეთში
    დამზადებული მუსიკალური შადრევნები დაამონტაჟეს. ტურიზმის ეროვნული ადმინისტრაცია მათ ევროპის ერთ-ერთ
    უდიდეს მოცეკვავე შადრევნად მოიხსენიებს; ნაპირზე მდგომს, როცა ჭავლები ბალეტის დასივით ერთად ირხევა,
    შედავების სურვილი ნამდვილად არ გიჩნდებათ.


    რეპერტუარი თამამად ჭრელია: პავაროტი, ბარი უაითი, დაიანა როსი, სტინგი, ქართული სიმღერები, რომლებსაც
    სკამებზე მსხდომნი ერთხმად აჰყვებიან, ზოგ ღამით კი AC/DC-ის „Highway to Hell“-იც. ბავშვები მოაჯირს
    მიკვრიან და ნაყინი მაჯებზე ჩამოსდით, წყვილები კი ნელა მიუყვებიან ანბანის კოშკისა და თამარ კვესიტაძის
    მოძრავი ლითონის ფიგურების, „ალისა და ნინოს“, მიმართულებით — ორივე ფეხით ახლოსაა.


    ბათუმს შადრევნები დიდი ხანია უყვარს. ბულვარის გაშენება 1881 წელს დაიწყო, ქალაქის პორტო-ფრანკოდ გამოცხადებიდან
    სამი წლის შემდეგ, 1977 წელს კი არქიტექტორმა გიორგი ერქომაიშვილმა ბულვარის მთავარ შესასვლელთან სამი
    ფერადი შადრევანი მოაწყო, გარშემო მუსიკოსი ბიჭების ქანდაკებებით. არდაგანი იმავე ძველი ზღვისპირა სიამოვნების
    ახალი საუკუნის მასშტაბია.


    თუ აქ ადგილი ვერ იშოვეთ, უფრო მცირე შოუები ძველ ბულვარზე და ევროპის მოედანზეც იმართება. მაგრამ სანახავი
    მაინც ეს არის: თბილი ჰაერი, ზღვის მარილი, მუსიკა და ტბა, რომელსაც ნახევარი საათით სჯერა, რომ ცეკვა
    შეუძლია.
  tip: >-
    შოუ უფასოა. სეზონზე პროგრამა ჩვეულებრივ 21:00-ის ახლოს იწყება და დაახლოებით ყოველ საათში მეორდება
    — ტურიზმის ადმინისტრაცია შოუებს 02:00-მდე უთითებს, — თუმცა თარიღები და საათები იცვლება, ამიტომ ადგილზე
    გადაამოწმეთ. სკამისთვის ნახევარი საათით ადრე მიდით, ან ტბის ზღვის მხარეს დადექით, საიდანაც სანახაობა
    პირდაპირ ჩანს. ჭავლებთან ახლოს ზღვის ნიავი წყლით დაგასხამთ — კამერას გაუფრთხილდით. სკამების უკან ველობილიკს
    მიხედეთ. კაფეები და ტუალეტები ბულვარზეა, ტბის ნაპირებზე რესტორნები და სასტუმროები დგას. ზამთარში შადრევნები,
    როგორც წესი, გამორთულია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის გვირაბებისა და ქუთაისის გავლით სამტრედიამდე
    იარეთ, შემდეგ ს12-ით (E692) ლანჩხუთის გავლით გრიგოლეთამდე, ზღვის პირას, იქიდან კი ს2-ით სამხრეთით,
    ქობულეთის გავლით, ბათუმამდე — დაახლოებით 373 კმ და ხუთნახევარი საათი, მთელ გზაზე ასფალტი და ბენზინგასამართი
    სადგურები. არდაგანის ტბა შერიფ ხიმშიაშვილის ქუჩაზეა, ძველი და ახალი ბულვარის შესაყარზე; ნავიგატორში
    „Ardagani Lake“ აკრიფეთ. მიმდებარე ქუჩებზე პარკინგი დაბნელების შემდეგ ივსება, ამიტომ მანქანა 20:30-მდე
    დააყენეთ. ნებისმიერი ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Batumi Dancing Fountains
  short: >-
    Where Batumi's Old and New Boulevards meet, Ardagani Lake becomes a stage on summer nights: French-built
    fountains, music and lasers on a curtain of spray.
  body: >-
    **On summer nights, a little after nine, Ardagani Lake stops being a lake and becomes a stage.** The
    jets rise in time with the music, the spray thickens into a curtain, and lasers paint pictures onto
    the falling water — part of the programme, according to In Your Pocket's city guide, retells the history
    of Batumi and Georgia.


    The lake is man-made. It was given its present form in 2009, when French-built musical fountains were
    installed where Batumi's Old Boulevard meets the New. The national tourism board calls them one of
    the largest dancing fountains in Europe; standing on the shore as the jets sway together like a corps
    de ballet, you are not inclined to argue.


    The playlist is gloriously indiscriminate: Pavarotti, Barry White, Diana Ross, Sting, Georgian songs
    that set whole benches singing along — and, on some nights, AC/DC's "Highway to Hell". Children press
    against the railing with ice cream running down their wrists, while couples drift off towards the
    Alphabet Tower and Tamar Kvesitadze's moving metal figures of Ali and Nino, both a short walk away.


    Batumi has loved its fountains for a long time. The Boulevard was laid out from 1881, three years
    after the city became a free port, and in 1977 the architect Giorgi Erkomaishvili gave its main entrance
    three coloured fountains ringed by statues of boys playing music. Ardagani is that old seaside pleasure
    scaled up for a new century.


    If you cannot find a seat here, smaller shows play on the Old Boulevard and in Europe Square. But
    this is the one to see: warm air, salt, music, and a lake that for half an hour believes it can dance.
  tip: >-
    The show is free. In season the programme usually starts around 21:00 and repeats roughly every hour
    — the tourism board lists shows until 02:00 — but dates and times shift, so check locally. Arrive
    half an hour early for a bench, or stand on the sea side of the lake to see the show head-on. Close
    to the jets a sea breeze will soak you, so guard your camera. Mind the cycle lane behind the benches.
    Cafés and toilets line the Boulevard, and restaurants and hotels sit on the lake's banks. In winter
    the fountains are usually switched off.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnels and past Kutaisi to Samtredia, then
    the S12 (E692) through Lanchkhuti to the coast at Grigoleti, and the S2 south through Kobuleti into
    Batumi: about 373 km and roughly 5½ hours, asphalt all the way, with fuel stations throughout. Ardagani
    Lake lies on Sherif Khimshiashvili Street, where the Old and New Boulevards meet; type "Ardagani Lake"
    into the navigator. Parking on the surrounding streets fills up after dark, so aim to park by 20:30.
    Any economy car will do.
ru:
  name: Танцующие фонтаны Батуми
  short: >-
    Там, где встречаются Старый и Новый бульвары Батуми, озеро Ардагани летними ночами становится сценой:
    французские фонтаны, музыка и лазеры на завесе брызг.
  body: >-
    **Летними ночами, чуть позже девяти, озеро Ардагани перестаёт быть озером и становится сценой.** Струи
    взлетают в такт музыке, водяная пыль густеет в завесу, а лазеры рисуют на падающей воде картины —
    часть программы, по данным путеводителя In Your Pocket, пересказывает историю Батуми и Грузии.


    Озеро искусственное. Свой нынешний облик оно получило в 2009 году, когда на стыке Старого и Нового
    бульваров Батуми установили музыкальные фонтаны французского производства. Национальная туристическая
    администрация называет их одними из крупнейших танцующих фонтанов Европы; стоя на берегу, когда струи
    раскачиваются вместе, как кордебалет, спорить с этим совсем не хочется.


    Плейлист восхитительно разношёрстный: Паваротти, Барри Уайт, Дайана Росс, Стинг, грузинские песни,
    под которые поют целые ряды скамеек, — а в некоторые вечера и AC/DC с «Highway to Hell». Дети прижимаются
    к ограде, и мороженое течёт по их запястьям, а пары медленно уходят в сторону Алфавитной башни и движущихся
    металлических фигур Тамар Квеситадзе — «Али и Нино», обе достопримечательности в двух шагах.


    Батуми давно любит свои фонтаны. Бульвар начали разбивать в 1881 году, через три года после того,
    как город стал вольным портом, а в 1977 году архитектор Гиорги Эркомаишвили украсил его главный вход
    тремя цветными фонтанами, окружёнными статуями мальчиков-музыкантов. Ардагани — это то же старое приморское
    удовольствие, только в масштабе нового века.


    Если здесь не найдётся места, меньшие представления идут на Старом бульваре и на площади Европы. Но
    смотреть стоит именно здесь: тёплый воздух, соль, музыка и озеро, которое на полчаса верит, что умеет
    танцевать.
  tip: >-
    Шоу бесплатное. В сезон программа обычно начинается около 21:00 и повторяется примерно раз в час —
    туристическая администрация указывает представления до 02:00, — но даты и время меняются, так что
    уточняйте на месте. Приходите за полчаса, чтобы занять скамейку, или встаньте с морской стороны озера
    — оттуда фонтаны видны прямо напротив. Рядом со струями морской ветер вас обязательно обрызгает —
    берегите камеру. Следите за велодорожкой позади скамеек. Кафе и туалеты — вдоль Бульвара, рестораны
    и отели — на берегах озера. Зимой фонтаны обычно выключены.
  route: >-
    От Тбилиси по S1 (E60) на запад через Рикотские тоннели и Кутаиси до Самтредиа, затем по S12 (E692)
    через Ланчхути до побережья у Григолети, а по S2 на юг через Кобулети в Батуми: около 373 км и примерно
    5,5 часа, всё по асфальту, заправки на всём пути. Озеро Ардагани находится на улице Шерифа Химшиашвили,
    там, где встречаются Старый и Новый бульвары; введите в навигаторе «Ardagani Lake». Парковка на соседних
    улицах заполняется с наступлением темноты, так что постарайтесь встать до 20:30. Хватит любой машины
    экономкласса.
fa:
  name: فواره‌های رقصان باتومی
  short: >-
    جایی که بلوار قدیم و بلوار جدید باتومی به هم می‌رسند، دریاچهٔ آرداگانی در شب‌های تابستان صحنه‌ای می‌شود:
    فواره‌هایی فرانسوی، موسیقی و لیزر بر پرده‌ای از آب.
  body: >-
    **در شب‌های تابستان، اندکی پس از ساعت نه، دریاچهٔ آرداگانی از دریاچه‌بودن دست می‌کشد و به صحنه بدل
    می‌شود.** فواره‌ها هم‌زمان با موسیقی برمی‌خیزند، پاشش آب به پرده‌ای ضخیم بدل می‌شود، و لیزرها بر آب
    فروریزنده تصویر می‌کشند — بخشی از برنامه، به گفتهٔ راهنمای شهری In Your Pocket، تاریخ باتومی و گرجستان
    را بازمی‌گوید.


    دریاچه ساخت انسان است. شکل کنونی خود را در سال ۲۰۰۹ یافت، آن‌گاه که فواره‌های موسیقایی ساخت فرانسه
    در نقطه‌ای که بلوار قدیم باتومی به بلوار جدید می‌رسد نصب شدند. سازمان گردشگری ملی آن‌ها را یکی از
    بزرگ‌ترین فواره‌های رقصان اروپا می‌نامد؛ و وقتی بر ساحل ایستاده‌اید و فواره‌ها چون دستهٔ رقص باله
    با هم می‌رقصند، میلی به مخالفت نمی‌یابید.


    فهرست آهنگ‌ها به‌شکل دلپذیری متنوع است: پاواروتی، بری وایت، دایانا راس، استینگ، ترانه‌های گرجی که
    کل نیمکت‌ها را به همراهی‌خوانی می‌کشانند — و در برخی شب‌ها حتی «Highway to Hell» از AC/DC. کودکان
    به نرده تکیه می‌دهند و بستنی روی مچ‌شان می‌چکد، و زوج‌ها آرام به‌سوی برج الفبا و پیکره‌های فلزی متحرک
    تامار کوسیتادزه — علی و نینو — می‌روند، هر دو تنها چند قدم دورتر.


    باتومی مدت‌هاست که فواره‌هایش را دوست دارد. بلوار از سال ۱۸۸۱، سه سال پس از آن‌که شهر بندر آزاد شد،
    شکل گرفت، و در سال ۱۹۷۷ معمار گیورگی ارکومایشویلی ورودی اصلی آن را با سه فوارهٔ رنگی، محصور در مجسمه‌های
    پسران نوازنده، آراست. آرداگانی همان لذت دیرینهٔ کنار دریاست، تنها در مقیاسی برای قرنی تازه.


    اگر اینجا جایی نیافتید، نمایش‌های کوچک‌تری در بلوار قدیم و میدان اروپا برگزار می‌شود. اما دیدنی اصلی
    همین‌جاست: هوای گرم، نمک، موسیقی، و دریاچه‌ای که نیم‌ساعت باور دارد می‌تواند برقصد.
  tip: >-
    نمایش رایگان است. در فصل، برنامه معمولاً حدود ساعت ۲۱:۰۰ شروع می‌شود و تقریباً هر ساعت تکرار می‌شود
    — سازمان گردشگری نمایش‌ها را تا ساعت ۰۲:۰۰ فهرست می‌کند — اما تاریخ‌ها و ساعت‌ها تغییر می‌کنند، پس
    در محل بررسی کنید. نیم‌ساعت زودتر بیایید تا نیمکتی بیابید، یا در سمت دریاییِ دریاچه بایستید تا نمایش
    را روبه‌رو ببینید. نزدیک فواره‌ها نسیم دریا شما را خیس می‌کند، پس مراقب دوربینتان باشید. مراقب مسیر
    دوچرخه پشت نیمکت‌ها باشید. کافه‌ها و سرویس‌های بهداشتی در طول بلوارند، و رستوران‌ها و هتل‌ها بر کناره‌های
    دریاچه. در زمستان فواره‌ها معمولاً خاموش‌اند.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب، از تونل‌های ریکوتی و کنار کوتایسی تا سامتردیا، سپس با S12 (E692)
    از میان لانچخوتی تا ساحل در گریگولتی، و با S2 به سوی جنوب از میان کوبولتی تا باتومی: حدود ۳۷۳ کیلومتر
    و نزدیک به پنج ساعت و نیم، همه بر آسفالت، با پمپ بنزین در تمام طول مسیر. دریاچهٔ آرداگانی در خیابان
    شریف خیمشیاشویلی است، همان‌جا که بلوار قدیم و بلوار جدید به هم می‌رسند؛ در مسیریاب «Ardagani Lake»
    را وارد کنید. پارکینگ خیابان‌های اطراف پس از تاریکی پر می‌شود، پس بکوشید پیش از ساعت ۲۰:۳۰ پارک کنید.
    یک خودروی اقتصادی کاملاً کافی است.
he:
  name: המזרקות הרוקדות של בטומי
  short: >-
    במקום שבו נפגשים הטיילת הישנה והחדשה של בטומי, אגם ארדגני הופך בלילות הקיץ לבמה: מזרקות שנבנו בצרפת,
    מוזיקה ולייזרים על מסך של רסס.
  body: >-
    **בלילות קיץ, זמן קצר לאחר תשע, אגם ארדגני מפסיק להיות אגם והופך לבמה.** סילוני המים עולים בקצב המוזיקה,
    הרסס מתעבה למסך, ולייזרים מציירים תמונות על המים הנופלים — חלק מהתוכנית, לפי מדריך העיר In Your Pocket,
    מספר מחדש את סיפורה של בטומי ושל גאורגיה.


    האגם מעשה ידי אדם. הוא קיבל את צורתו הנוכחית ב-2009, אז הותקנו מזרקות מוזיקליות שנבנו בצרפת בנקודה
    שבה הטיילת הישנה של בטומי פוגשת את החדשה. רשות התיירות הלאומית מכנה אותן אחת מהמזרקות הרוקדות הגדולות
    באירופה; כשעומדים על החוף בזמן שהסילונים מתנועעים יחד כמו להקת בלט, אין נטייה להתווכח.


    רשימת השירים מגוונת בלי שום עכבות: פבארוטי, בארי וייט, דיאנה רוס, סטינג, שירים גאורגיים שסוחפים ספסלים
    שלמים לשיר בקול — ובלילות מסוימים גם "Highway to Hell" של AC/DC. ילדים נצמדים למעקה וגלידה נוטפת על
    פרקי ידיהם, בעוד זוגות נודדים לעבר מגדל האלף-בית והפסלים המתכתיים הנעים של תמר קווסיטדזה, "עלי ונינו",
    שני המקומות במרחק הליכה קצרה.


    בטומי אוהבת את מזרקותיה כבר זמן רב. את הטיילת החלו להתוות ב-1881, שלוש שנים אחרי שהעיר הפכה לנמל חופשי,
    וב-1977 האדריכל גיאורגי ארקומאישווילי עיטר את הכניסה הראשית שלה בשלוש מזרקות צבעוניות המוקפות בפסלי
    נערים מנגנים. ארדגני הוא אותה הנאה ישנה על שפת הים, בקנה מידה של מאה חדשה.


    אם לא תמצאו מקום לשבת כאן, הצגות קטנות יותר מתקיימות בטיילת הישנה ובכיכר אירופה. אבל את ההצגה הזאת
    צריך לראות: אוויר חמים, מלח, מוזיקה, ואגם שלמשך חצי שעה מאמין שהוא יכול לרקוד.
  tip: >-
    ההצגה חינם. בעונה, התוכנית מתחילה בדרך כלל בסביבות 21:00 וחוזרת בערך כל שעה — רשות התיירות מציינת
    הצגות עד 02:00 — אבל תאריכים ושעות משתנים, אז בדקו במקום. הגיעו חצי שעה מוקדם כדי לתפוס ספסל, או עמדו
    בצד הים של האגם לראות את המופע חזיתית. קרוב לסילונים, רוח הים תרטיב אתכם, אז הגנו על המצלמה. שימו
    לב לשביל האופניים מאחורי הספסלים. בתי קפה ושירותים לאורך הטיילת, ומסעדות ומלונות על גדות האגם. בחורף
    המזרקות בדרך כלל כבויות.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה, דרך מנהרות ריקוטי ולצד קוטאיסי עד סמטרדיה, אחר כך S12 (E692) דרך לנצ'חוטי
    עד לחוף בגריגולטי, ו-S2 דרומה דרך קובולטי לבטומי: כ-373 ק"מ וכחמש שעות וחצי, כולה באספלט, ותחנות דלק
    לאורך כל הדרך. אגם ארדגני נמצא ברחוב שריף חימשיאשווילי, במקום שבו נפגשות הטיילת הישנה והחדשה; הזינו
    בניווט "Ardagani Lake". החניה ברחובות הסמוכים מתמלאת עם רדת החשכה, אז נסו להגיע עד 20:30. כל רכב חסכוני
    רגיל יספיק בהחלט.
ar:
  name: النوافير الراقصة في باتومي
  short: >-
    حيث يلتقي الكورنيش القديم والجديد في باتومي، تتحول بحيرة أرداغاني في ليالي الصيف إلى مسرح: نوافير
    فرنسية، وموسيقى، وأشعة ليزر على ستارة من الرذاذ.
  body: >-
    **في ليالي الصيف، بعد التاسعة بقليل، تتوقف بحيرة أرداغاني عن كونها بحيرة وتتحول إلى مسرح.** ترتفع
    النفاثات متزامنة مع الموسيقى، ويتكاثف الرذاذ إلى ستارة، وترسم أشعة الليزر صورًا على الماء المتساقط
    — جزء من البرنامج، وفق دليل المدينة In Your Pocket، يروي من جديد تاريخ باتومي وجورجيا.


    البحيرة من صنع الإنسان. اتخذت شكلها الحالي في عام 2009، حين نُصبت نوافير موسيقية فرنسية الصنع عند
    نقطة التقاء كورنيش باتومي القديم بالجديد. تصفها هيئة السياحة الوطنية بأنها من أكبر النوافير الراقصة
    في أوروبا؛ وحين تقف على الضفة والنفاثات تتمايل معًا كفرقة باليه، لا تجد ما يدفعك للجدال.


    قائمة الأغاني متنوعة بسخاء بديع: بافاروتي، باري وايت، دايانا روس، ستينغ، وأغانٍ جورجية تجعل صفوف المقاعد
    بأكملها تشدو معها — وفي بعض الليالي أغنية «Highway to Hell» لفريق AC/DC. يقف الأطفال ملتصقين بالدرابزين
    والآيس كريم يسيل على معاصمهم، بينما ينساب العشاق نحو برج الأبجدية وتمثالي تامار كفيسيتادزه المعدنيين
    المتحركين، «علي ونينو»، وكلاهما على مسافة خطوات قليلة.


    تعشق باتومي نوافيرها منذ زمن طويل. بدأ تخطيط الكورنيش عام 1881، بعد ثلاث سنوات من إعلان المدينة ميناءً
    حرًا، وفي عام 1977 زيّن المهندس المعماري غيورغي إركومايشفيلي مدخله الرئيسي بثلاث نوافير ملونة تحيط
    بها تماثيل صبية عازفين. أرداغاني هي تلك المتعة البحرية القديمة نفسها، لكن بمقياس قرن جديد.


    إذا لم تجد مكانًا هنا، تُقدَّم عروض أصغر على الكورنيش القديم وفي ساحة أوروبا. لكن هذا هو المكان الذي
    يستحق المشاهدة: هواء دافئ، وملح، وموسيقى، وبحيرة تصدّق لنصف ساعة أنها تستطيع الرقص.
  tip: >-
    العرض مجاني. في الموسم يبدأ البرنامج عادة نحو الساعة 21:00 ويتكرر تقريبًا كل ساعة — تسرد هيئة السياحة
    عروضًا حتى الساعة 02:00 — لكن المواعيد والأوقات تتغير، فتحقق منها محليًا. تعال قبل نصف ساعة لتحجز
    مقعدًا، أو قف على جانب البحر من البحيرة لترى العرض مباشرة في مواجهتك. قرب النفاثات ستبلّلك نسمة البحر،
    فاحمِ كاميرتك. احذر مسار الدراجات خلف المقاعد. المقاهي والمرافق الصحية منتشرة على طول الكورنيش، والمطاعم
    والفنادق على ضفتي البحيرة. في الشتاء تكون النوافير متوقفة عادة.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا عبر أنفاق ريكوتي وبمحاذاة كوتايسي حتى سامتريديا، ثم S12 (E692)
    عبر لانتشخوتي إلى الساحل عند غريغوليتي، ثم S2 جنوبًا عبر كوبوليتي إلى باتومي: نحو 373 كم وحوالي 5
    ساعات ونصف، كلها على أسفلت، مع محطات وقود طوال الطريق. تقع بحيرة أرداغاني في شارع شريف خيمشياشفيلي،
    عند ملتقى الكورنيش القديم والجديد؛ أدخل في جهاز التوجيه «Ardagani Lake». تمتلئ مواقف الشوارع المجاورة
    بعد حلول الظلام، فحاول ركن سيارتك قبل الساعة 20:30. سيارة اقتصادية عادية كافية تمامًا.
