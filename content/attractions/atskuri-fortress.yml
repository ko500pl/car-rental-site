ka:
  name: აწყურის ციხე
  short: >-
    ციხე ციცაბო კლდეზე, იქ, სადაც მტკვრის ხეობა ბორჯომსა და ახალციხეს შორის ვიწროვდება, ძირას კი იმ ტაძრის
    ნანგრევები, სადაც სასწაულთმოქმედი ხატი ესვენა.
  body: >-
    **ათასი წლის განმავლობაში ბორჯომიდან ახალციხისკენ მიმავალ ყველა მგზავრს ამ კლდის ძირში უწევდა გავლა.**
    აწყურის ციხე მტკვრის მარჯვენა ნაპირზე, ციცაბო კლდეზე დგას, ბორჯომიდან დაახლოებით 30 კილომეტრში, იქ,
    სადაც ხეობა ყელივით ვიწროვდება. მატიანეები მას XI საუკუნიდან იხსენიებენ (ზოგი წყარო IX საუკუნეს ასახელებს).
    XVI საუკუნის ბოლოს ციხე ოსმალებმა დაიკავეს, 1770 წელს კი ქართველთა და რუსთა გაერთიანებული ლაშქარი
    შემოერტყა, მაგრამ აღება ვერ შეძლო. მხოლოდ 1828–1829 წლების ომის შემდეგ, როცა საზღვარი სამხრეთით გადაიწია,
    დატოვა გარნიზონმა ციხე და ის ქარს შერჩა.


    მშენებლებმა შრომის ნახევარი კლდეს მიანდეს. ციხეში კლდეში გამოკვეთილი ვიწრო გვირაბით შედიოდნენ, მეორე
    გვირაბი კი წყლისთვის მდინარემდე ეშვებოდა. კედლები საფეხურებად ადის ციტადელამდე, რომელიც კლდის უმაღლეს
    წერტილს აზის. რასაც დღეს ხედავთ, სხვადასხვა საუკუნის წყობაა, აშენებული, ჩამოქცეული და ისევ დაკერებული:
    2009 წლის აგვისტოში კედლის ნაწილი ჩამოინგრა და მას შემდეგ გამაგრებითი სამუშაოები აქ არაერთხელ ჩატარდა.


    ქვემოთ, დაბალი ბორცვის ძირას, ღვთისმშობლის მიძინების საკათედრო ტაძრის ნანგრევებია. აქ იჯდა მაწყვერელი,
    აწყურის ეპისკოპოსი, რომელიც XV საუკუნეში იმდენად გაძლიერდა, რომ საპატრიარქოსგან დამოუკიდებლობასაც
    კი ესწრაფოდა. შუა საუკუნეების მატიანე გადმოგვცემს, რომ აქაური ღვთისმშობლის ხატი თავად ანდრია მოციქულმა
    მოაბრძანა, 627 წელს სპარსეთთან საომრად მიმავალმა ჰერაკლე კეისარმა მას თაყვანი სცა, 1283 წლის მიწისძვრისას
    კი, როცა გუმბათი ჩამოიქცა, ხატი ნანგრევების ქვეშ უვნებელი იპოვეს. XVI საუკუნის ბოლოს იგი გელათში გადაასვენეს,
    1952 წლიდან კი საქართველოს ეროვნულ მუზეუმში ინახება. ტაძრის აღდგენის სახელმწიფო პროექტი 2016 წელს
    დაიწყო.


    ციხეზე გვიან ნაშუადღევს ადით, როცა დაბალი მზე ქვას ათბობს. ზემოდან გზა ძაფივით მოჩანს და მაშინვე მიხვდებით,
    რატომ ეპყრა სამცხე მას, ვისაც ეს კლდე ეპყრა.
  tip: >-
    ციხისა და ტაძრის ნანგრევების სანახავად საათნახევარი გამოყავით. აღმართი ციცაბო, ქვიანი და თითქმის უჩრდილოა,
    ამიტომ კარგი ფეხსაცმელი ჩაიცვით, წვიმასა და ყინვაში კი ზედა კედლებზე ნუ ახვალთ: ქვა სრიალებს. გამაგრებითი
    სამუშაოები პერიოდულად მიმდინარეობს, ზოგჯერ ხარაჩოებს ან შემოღობილ მონაკვეთებს წააწყდებით და ღობე უმიზეზოდ
    არ დგას. კლდის პირას ბავშვებს თვალი არ მოაშოროთ. ბილეთი, ჯიხური და ტუალეტი არ არის, წყალი ბორჯომში
    ან ახალციხეში შეიძინეთ. გვიან გაზაფხულზე ბალახი მაღალია, ფეხი ფრთხილად დადგით.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია. იქიდან S8-ით
    სამხრეთისკენ შეუხვიეთ, ბორჯომი გაიარეთ და მტკვრის ხეობას კიდევ დაახლოებით 30 კილომეტრი მიჰყევით სოფელ
    აწყურამდე: სულ 188 კმ, დაახლოებით 2 საათი და 55 წუთი. გზა ბოლომდე ასფალტია, მაგრამ ხეობაში ვიწრო და
    მიხვეულ-მოხვეულია, დეკემბრიდან მარტამდე კი ყინულიცა და ნისლიც იცის, ამიტომ ზამთრის საბურავები აუცილებელია.
    ციხე სოფლის თავზე, კლდეზე, შორიდანვე ჩანს; მანქანა სოფლის ქუჩაზე ან ტაძრის ნანგრევებთან მოწესრიგებულად
    დააყენეთ და ფეხით ადით. საწვავი ხაშურში, ბორჯომში ან ახალციხეში ჩაასხით. ეკონომ-კლასის მანქანა სავსებით
    საკმარისია.
en:
  name: Atskuri Fortress
  short: >-
    A fortress on a sheer cliff where the Mtkvari gorge narrows between Borjomi and Akhaltsikhe, above
    the ruins of a cathedral that once held a famous icon.
  body: >-
    **For a thousand years, anyone travelling up the Mtkvari from Borjomi towards Akhaltsikhe had to pass
    beneath this rock.** The fortress stands on a sheer cliff on the right bank, about 30 km beyond Borjomi,
    where the gorge pinches tight. The chronicles name it from the 11th century (some sources say the
    9th). The Ottomans took it in the late 16th century; in 1770 a Georgian and Russian army besieged
    it and failed. Only after the war of 1828–29 pushed the frontier south was it left to the wind.


    Its builders let the cliff do half the work. The way in led through a narrow passage cut in the rock,
    and a second tunnel ran down to the river for water. The walls climb in tiers to a citadel on the
    highest point. What you see is masonry of many centuries, built, fallen and patched again: a stretch
    of wall collapsed in August 2009, and it has been strengthened more than once since.


    Below lie the ruins of the cathedral of the Dormition, seat of the bishops of Atskuri, who in the
    15th century grew powerful enough to claim independence from the Patriarch. The medieval annals say
    that the Apostle Andrew himself brought the icon of the Virgin kept here, that Emperor Heraclius came
    to venerate it in 627 on his way to war with Persia, and that when the dome fell in the earthquake
    of 1283 the icon was found unharmed beneath the rubble. It went to Gelati in the late 16th century
    and has been in the Georgian National Museum since 1952. A state project to rebuild the church began
    in 2016.


    Climb in the late afternoon, when the low sun warms the stone. From the top the road below is a thread,
    and you understand at once why whoever held this rock held Samtskhe.
  tip: >-
    Allow an hour and a half for the fortress and the cathedral ruins together. The path up is steep,
    stony and mostly unshaded, so wear proper shoes, and skip the upper walls in rain or ice, when the
    stone turns slick. Conservation work comes and goes: some years there is scaffolding or fenced-off
    sections, and the barriers are there for a reason. Keep children close near the drops. There is no
    ticket, kiosk or toilet, so bring water from Borjomi or Akhaltsikhe. In late spring the grass is long;
    watch where you step.
  route: >-
    From Tbilisi take the E60/S1 west past Gori to Khashuri, about 130 km, then turn south onto the S8
    through Borjomi and follow the Mtkvari gorge for roughly another 30 km to Atskuri village: 188 km
    and about 2 hours 55 minutes in all. It is asphalt the whole way, but the gorge road is narrow and
    winding, and from December to March it can carry ice and fog, so fit winter tyres. The fortress is
    unmistakable on its cliff above the village; park considerately on a village street or near the cathedral
    ruins and walk up. Refuel in Khashuri, Borjomi or Akhaltsikhe. An economy car is enough.
ru:
  name: Крепость Ацкури
  short: >-
    Крепость на отвесной скале там, где ущелье Куры сжимается между Боржоми и Ахалцихе, над руинами собора,
    где когда-то хранилась знаменитая икона.
  body: >-
    **Тысячу лет всякий, кто шёл вверх по Куре от Боржоми к Ахалцихе, проходил под этой скалой.** Крепость
    стоит на отвесном утёсе правого берега, примерно в 30 км за Боржоми, там, где ущелье сжимается особенно
    тесно. Летописи упоминают её с XI века (некоторые источники — с IX). В конце XVI века её взяли османы;
    в 1770 году грузинские и русские войска осаждали её, но безуспешно. Лишь когда война 1828–1829 годов
    отодвинула границу на юг, крепость оставили ветрам.


    Строители поручили скале половину работы. Вход вёл через узкий проход, вырубленный в камне, а второй
    тоннель спускался к реке за водой. Стены поднимаются уступами к цитадели на самой вершине. Перед вами
    кладка многих веков — возведённая, рухнувшая и снова залатанная: в августе 2009 года обвалился участок
    стены, и с тех пор её не раз укрепляли.


    Ниже лежат руины Успенского собора, кафедры ацкурских епископов, которые в XV веке набрали такую силу,
    что добивались независимости от патриарха. Средневековые летописи рассказывают, что здешнюю икону
    Богоматери принёс сам апостол Андрей, что в 627 году ей поклонился император Ираклий, шедший войной
    на Персию, и что, когда при землетрясении 1283 года рухнул купол, икону нашли под обломками невредимой.
    В конце XVI века её перенесли в Гелати, а с 1952 года она находится в Национальном музее Грузии. В
    2016 году началось государственное восстановление храма.


    Поднимайтесь ближе к вечеру, когда низкое солнце прогревает камень. Сверху дорога внизу кажется ниткой,
    и сразу понимаешь, почему тот, кто владел этой скалой, владел Самцхе.
  tip: >-
    На крепость и руины собора закладывайте полтора часа. Тропа наверх крутая, каменистая и почти без
    тени, так что наденьте нормальную обувь, а в дождь или гололёд не лезьте на верхние стены — камень
    становится скользким. Реставрационные работы то начинаются, то затихают: в иные годы здесь стоят леса
    или огорожены участки, и ограждения поставлены не зря. Держите детей рядом у обрывов. Ни билетной
    кассы, ни киоска, ни туалета нет, поэтому воду везите из Боржоми или Ахалцихе. В конце весны трава
    высокая — смотрите под ноги.
  route: >-
    Из Тбилиси — на запад по E60/S1 мимо Гори до Хашури, около 130 км, затем на юг по S8 через Боржоми
    и ещё примерно 30 км вдоль ущелья Куры до села Ацкури: всего 188 км и около 2 часов 55 минут. Асфальт
    на всём пути, но дорога по ущелью узкая и извилистая, а с декабря по март на ней бывают гололёд и
    туман, так что нужна зимняя резина. Крепость на скале над селом не спутаешь ни с чем; аккуратно припаркуйтесь
    на сельской улице или у руин собора и поднимайтесь пешком. Заправиться можно в Хашури, Боржоми или
    Ахалцихе. Машины эконом-класса достаточно.
fa:
  name: قلعهٔ آتسکوری
  short: >-
    قلعه‌ای بر صخره‌ای عمودی، آنجا که درهٔ متکواری میان بورجومی و آخالتسیخه تنگ می‌شود، بالای ویرانه‌های
    کلیسای جامعی که روزگاری شمایلی نامدار را نگه می‌داشت.
  body: >-
    **هزار سال، هر کس که از بورجومی رو به آخالتسیخه در امتداد رود متکواری بالا می‌رفت، ناگزیر از زیر این
    صخره می‌گذشت.** قلعه بر صخره‌ای عمودی در کرانهٔ راست ایستاده است، حدود ۳۰ کیلومتر آن‌سوی بورجومی،
    جایی که دره سخت تنگ می‌شود. سالنامه‌ها از سدهٔ یازدهم از آن نام می‌برند (برخی منابع از سدهٔ نهم).
    عثمانی‌ها در اواخر سدهٔ شانزدهم آن را گرفتند؛ در ۱۷۷۰ سپاهی گرجی و روس آن را محاصره کرد و ناکام ماند.
    تنها پس از جنگ ۱۸۲۸–۱۸۲۹، که مرز را به جنوب راند، قلعه به دست باد سپرده شد.


    سازندگانش نیمی از کار را به خود صخره واگذاشتند. راه ورود از گذرگاهی تنگ می‌گذشت که در سنگ کنده شده
    بود، و تونلی دیگر برای آوردن آب تا رود پایین می‌رفت. دیوارها پله‌پله تا ارگی بر بلندترین نقطه بالا
    می‌روند. آنچه می‌بینید سنگ‌چینی سده‌های بسیار است: ساخته شده، فرو ریخته و باز وصله شده؛ در اوت ۲۰۰۹
    بخشی از دیوار فرو ریخت و از آن پس بیش از یک بار استوارش کرده‌اند.


    پایین‌تر ویرانه‌های کلیسای جامع خفتن مریم قرار دارد، مقر اسقفان آتسکوری، که در سدهٔ پانزدهم چنان قدرتمند
    شدند که دعوی استقلال از پاتریارک کردند. سالنامه‌های سده‌های میانه می‌گویند که شمایل مریم باکره‌ای
    را که اینجا نگهداری می‌شد، خودِ آندریاس حواری آورده بود؛ که امپراتور هراکلیوس در ۶۲۷، در راه جنگ با
    ایران، به زیارتش آمد؛ و که وقتی در زمین‌لرزهٔ ۱۲۸۳ گنبد فرو ریخت، شمایل را زیر آوار سالم یافتند. این
    شمایل در اواخر سدهٔ شانزدهم به گلاتی برده شد و از ۱۹۵۲ در موزهٔ ملی گرجستان است. طرح دولتی بازسازی
    کلیسا در ۲۰۱۶ آغاز شد.


    اواخر بعدازظهر بالا بروید، وقتی خورشیدِ پایین سنگ را گرم می‌کند. از بالا جادهٔ پایین نخی باریک است
    و بی‌درنگ می‌فهمید چرا هر که این صخره را داشت، سامتسخه را داشت.
  tip: >-
    برای قلعه و ویرانه‌های کلیسای جامع روی‌هم یک ساعت و نیم وقت بگذارید. راه بالا تند و سنگلاخ است و بیشترش
    بی‌سایه؛ کفش مناسب بپوشید و در باران یا یخبندان سراغ دیوارهای بالایی نروید، چون سنگ لغزنده می‌شود.
    کارهای مرمتی گاه هست و گاه نیست: برخی سال‌ها داربست برپاست یا بخش‌هایی حصارکشی شده، و این مانع‌ها
    بی‌دلیل نیستند. کودکان را نزدیک پرتگاه‌ها کنار خود نگه دارید. نه بلیتی هست، نه دکه‌ای، نه سرویس بهداشتی؛
    آب را از بورجومی یا آخالتسیخه بیاورید. اواخر بهار علف‌ها بلندند؛ مراقب جای پایتان باشید.
  route: >-
    از تفلیس از مسیر E60/S1 به سوی غرب، از کنار گوری تا خاشوری بروید، حدود ۱۳۰ کیلومتر؛ سپس به جادهٔ S8
    به سمت جنوب بپیچید، از بورجومی بگذرید و حدود ۳۰ کیلومتر دیگر در درهٔ متکواری تا روستای آتسکوری برانید:
    روی‌هم ۱۸۸ کیلومتر و حدود ۲ ساعت و ۵۵ دقیقه. تمام راه آسفالت است، اما جادهٔ دره باریک و پرپیچ است
    و از دسامبر تا مارس ممکن است یخ و مه داشته باشد؛ پس لاستیک زمستانی بگذارید. قلعه بر صخرهٔ بالای روستا
    را نمی‌شود ندید؛ با رعایت حال اهالی در کوچه‌ای از روستا یا نزدیک ویرانه‌های کلیسا پارک کنید و پیاده
    بالا بروید. در خاشوری، بورجومی یا آخالتسیخه سوخت بگیرید. خودروی اکونومی کافی است.
he:
  name: מבצר אצקורי
  short: >-
    מבצר על צוק זקוף, במקום שבו ערוץ המטקוורי מצטמצם בין בורג'ומי לאחלציחה, מעל חורבות קתדרלה שבה נשמרה
    פעם איקונה מפורסמת.
  body: >-
    **במשך אלף שנה, כל מי שעלה לאורך המטקוורי מבורג'ומי לכיוון אחלציחה נאלץ לעבור מתחת לסלע הזה.** המבצר
    עומד על צוק זקוף בגדה הימנית, כ-30 ק״מ אחרי בורג'ומי, במקום שבו הערוץ מצטמצם מאוד. הכרוניקות מזכירות
    אותו מן המאה ה-11 (יש מקורות האומרים מן המאה ה-9). העות'מאנים כבשו אותו בסוף המאה ה-16; ב-1770 צר
    עליו צבא גאורגי ורוסי ונכשל. רק אחרי שמלחמת 1828–1829 דחקה את הגבול דרומה, ננטש המבצר לרוחות.


    בוניו הניחו לצוק לעשות חצי מן העבודה. הכניסה עברה במעבר צר שנחצב בסלע, ומנהרה שנייה ירדה אל הנהר כדי
    להביא מים. החומות מטפסות בטרסות אל מצודה בנקודה הגבוהה ביותר. מה שרואים הוא בנייה של מאות שנים: נבנתה,
    קרסה ותוקנה שוב. באוגוסט 2009 התמוטט קטע חומה, ומאז חיזקו אותה יותר מפעם אחת.


    למטה שוכבות חורבות קתדרלת ההירדמות (הדורמיציון), מושבם של הבישופים של אצקורי, שבמאה ה-15 התחזקו עד
    כדי כך שתבעו עצמאות מן הפטריארך. לפי כרוניקות מימי הביניים, את איקונת הבתולה שנשמרה כאן הביא השליח
    אנדראס בעצמו; הקיסר הרקליוס בא להשתחוות לה ב-627 בדרכו למלחמה בפרס; וכאשר קרסה הכיפה ברעידת האדמה
    של 1283, נמצאה האיקונה שלמה מתחת להריסות. בסוף המאה ה-16 הועברה לגלאתי, ומאז 1952 היא במוזיאון הלאומי
    של גאורגיה. ב-2016 החל פרויקט ממשלתי לבנייה מחדש של הכנסייה.


    עלו בשעות אחר הצהריים המאוחרות, כשהשמש הנמוכה מחממת את האבן. מלמעלה הכביש שבתחתית הוא חוט דק, ומבינים
    מיד מדוע מי שהחזיק בסלע הזה החזיק בסמצחה.
  tip: >-
    הקציבו שעה וחצי למבצר ולחורבות הקתדרלה יחד. השביל למעלה תלול, סלעי וכמעט בלי צל, אז נעלו נעליים מתאימות,
    ובגשם או בקרה ותרו על החומות העליונות, כי האבן נעשית חלקלקה. עבודות השימור באות והולכות: בחלק מן השנים
    יש פיגומים או קטעים מגודרים, והגדרות עומדות שם מסיבה טובה. החזיקו ילדים קרוב ליד המצוקים. אין כרטיסים,
    אין קיוסק ואין שירותים, אז הביאו מים מבורג'ומי או מאחלציחה. בסוף האביב העשב גבוה; שימו לב היכן אתם
    דורכים.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי, עד חשורי — כ-130 ק״מ — ואז פנו דרומה לכביש S8 דרך בורג'ומי
    והמשיכו עוד כ-30 ק״מ בערוץ המטקוורי עד הכפר אצקורי: בסך הכול 188 ק״מ וכשעתיים ו-55 דקות. הדרך סלולה
    לכל אורכה, אבל הכביש בערוץ צר ומפותל, ומדצמבר עד מרץ עלולים להיות בו קרח וערפל, לכן התקינו צמיגי חורף.
    אי אפשר לפספס את המבצר על הצוק שמעל הכפר; חנו בהתחשבות ברחוב בכפר או ליד חורבות הקתדרלה ועלו ברגל.
    תדלקו בחשורי, בבורג'ומי או באחלציחה. רכב חסכוני מספיק.
ar:
  name: قلعة أتسكوري
  short: قلعة على جرف شاهق حيث يضيق وادي متكفاري بين بورجومي وأخالتسيخه، فوق أطلال كاتدرائية حفظت يوماً
    أيقونة شهيرة.
  body: >-
    **طوال ألف عام، كان على كل من يصعد مع نهر متكفاري من بورجومي نحو أخالتسيخه أن يمرّ تحت هذه الصخرة.**
    تقوم القلعة على جرف شاهق عند الضفة اليمنى، على بعد نحو 30 كم بعد بورجومي، حيث يضيق الوادي أشد الضيق.
    تذكرها الحوليات منذ القرن الحادي عشر (وتقول بعض المصادر منذ التاسع). استولى عليها العثمانيون في أواخر
    القرن السادس عشر، وفي عام 1770 حاصرها جيش جورجي وروسي فأخفق. ولم تُترك للريح إلا بعد أن دفعت حرب 1828–1829
    الحدود جنوباً.


    ترك بُناتها للجرف نصف المهمة. كان المدخل يمرّ عبر ممر ضيق منحوت في الصخر، ونفق ثانٍ ينحدر إلى النهر
    لجلب الماء. وتتسلق الأسوار في مدرّجات حتى قلعة داخلية على أعلى نقطة. وما تراه بناءٌ من قرون كثيرة:
    شُيّد وانهار ورُمّم من جديد؛ ففي أغسطس 2009 انهار جزء من السور، ومنذ ذلك الحين دُعّم أكثر من مرة.


    وفي الأسفل أطلال كاتدرائية رقاد السيدة العذراء، مقر أساقفة أتسكوري الذين بلغوا في القرن الخامس عشر
    من القوة ما جعلهم يطالبون بالاستقلال عن البطريرك. وتروي حوليات العصور الوسطى أن الرسول أندراوس نفسه
    جاء بأيقونة العذراء التي كانت محفوظة هنا، وأن الإمبراطور هرقل زارها متبرّكاً عام 627 وهو في طريقه
    إلى الحرب مع الفرس، وأن القبة حين سقطت في زلزال عام 1283 وُجدت الأيقونة سالمة تحت الركام. نُقلت إلى
    غيلاتي في أواخر القرن السادس عشر، وهي منذ عام 1952 في المتحف الوطني الجورجي. وفي عام 2016 بدأ مشروع
    حكومي لإعادة بناء الكنيسة.


    اصعد في آخر العصر، حين تدفئ الشمس المنخفضة الحجر. من الأعلى يبدو الطريق في الأسفل خيطاً رفيعاً، وتفهم
    على الفور لماذا كان من ملك هذه الصخرة يملك سامتسخه.
  tip: >-
    خصص ساعة ونصفاً للقلعة وأطلال الكاتدرائية معاً. الدرب صاعد بشدة، كثير الحجارة، وأغلبه بلا ظل، فالبس
    حذاءً مناسباً، وتجنّب الأسوار العليا في المطر أو الجليد، حين يصير الحجر زلقاً. أعمال الترميم تأتي
    وتذهب: في بعض السنوات تجد سقالات أو أجزاء مسيّجة، وللحواجز سبب وجيه. أبقِ الأطفال قريبين منك عند الحافات.
    لا تذاكر ولا كشك ولا دورة مياه، فاحمل الماء من بورجومي أو أخالتسيخه. وفي أواخر الربيع يطول العشب،
    فانتبه لموضع قدميك.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً مروراً بغوري حتى خاشوري، نحو 130 كم، ثم انعطف جنوباً إلى الطريق
    S8 عبر بورجومي، وتابع قرابة 30 كم أخرى في وادي متكفاري حتى قرية أتسكوري: 188 كم إجمالاً ونحو ساعتين
    و55 دقيقة. الطريق معبّد على طوله، لكن طريق الوادي ضيق كثير المنعطفات، وقد يغطيه الجليد والضباب من
    ديسمبر إلى مارس، فركّب إطارات شتوية. لا يمكن أن تخطئ القلعة على جرفها فوق القرية؛ أوقف سيارتك بلباقة
    في أحد شوارع القرية أو قرب أطلال الكاتدرائية واصعد سيراً. تزوّد بالوقود في خاشوري أو بورجومي أو أخالتسيخه.
    تكفي سيارة اقتصادية.
