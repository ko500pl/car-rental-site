ka:
  name: აწყურის ციხე
  short: მტკვრის ხეობის ყველაზე ვიწრო ადგილას, კლდეზე აღმართული დაუნგრეველი ციხე ბორჯომსა და ახალციხეს
    შორის.
  body: >-
    **აწყური იმ ადგილას დგას, სადაც მტკვრის ხეობა ისე ვიწროვდება, რომ გვერდის ავლა შეუძლებელია.** ეს ისტორიულად
    ქართლიდან სამცხეში შესასვლელი კარიბჭე იყო, და ვინც ამ კლდეს ფლობდა, გზასაც აკონტროლებდა. ციხე მდინარის
    ზემოთ, ციცაბო კონცხზეა და გზიდანაც შთამბეჭდავად ჩანს.


    სიმაგრე ადრეულ შუასაუკუნეებში იხსენიება, დღეს შემორჩენილი კედლები და კოშკები კი ძირითადად XIV-XVI
    საუკუნეებისაა — ჯერ ჯაყელთა, შემდეგ ოსმალური გარნიზონის მიერ გადაკეთებული. სტრუქტურა რთულია: ქვედა
    გალავანი, შუა ტერასა და ზედა ციტადელი, რომლებიც კლდის ფორმას მიჰყვება.


    აწყური მარტო სამხედრო პუნქტი არ იყო. აქ იჯდა აწყურის ეპისკოპოსი — სამხრეთ საქართველოს ერთ-ერთი უმნიშვნელოვანესი
    საეპისკოპოსოს მეთაური. ციხის ქვემოთ დგას ღვთისმშობლის საკათედრო ტაძრის ნანგრევები, ხოლო **აწყურის
    ღვთისმშობლის ხატი**, რომელიც გადმოცემით ანდრია პირველწოდებულს მოჰქონდა, დღეს საქართველოს ეროვნულ მუზეუმში
    ინახება.


    სიმაგრემ დანიშნულება 1828 წლის შემდეგ დაკარგა, როცა ახალციხე რუსეთის იმპერიამ აიღო და საზღვარი სამხრეთით
    გადაინაცვლა. მას შემდეგ სოფელი ციხის ქვას სამშენებლოდ იყენებდა და სწორედ ამიტომაა ქვედა კედლები უფრო
    დაზიანებული, ვიდრე კოშკები.


    ციხე არ არის აღდგენილი და არც ტურისტულად მოწყობილი: ბილიკები, მოაჯირი, ბილეთი და ინფორმაციული დაფები
    არ არსებობს. კედლების ნაწილი ჩამონგრეულია, ქვა ფხვიერია და ზოგან ნამდვილად სახიფათოა. სამაგიეროდ,
    ზემოდან ხედი ხეობაზე და მესხეთის ქედზე გამორჩეულია, და გარშემო თითქმის ყოველთვის მარტო ხარ — ახალციხისკენ
    მიმავალი ნაკადი ქვემოთ, ასფალტზე მიდის და აქ თითქმის არავინ ადის.
  tip: >-
    ციხემდე ასვლას ოციდან ოცდაათ წუთამდე სჭირდება ციცაბო, ქვიან ბილიკზე, უმეტესად უჩრდილოდ. სპორტული ფეხსაცმელი
    აუცილებელია, სანდლებით ნუ სცდი. სველ ან მოყინულ ამინდში ზედა ნაწილში ნუ ახვალ — ქვა სრიალებს და დასაჭერი
    არაფერია. ბავშვებთან ერთად ქვედა გალავანით შემოიფარგლე. წყალი თან წაიღე, ადგილზე არაფერი იყიდება.
    ტუალეტი და კაფე სოფელშია, გზისპირას. გაზაფხულზე ბალახი მაღალია და გველიც შეიძლება შეგხვდეს.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომამდე და ბორჯომიდან ახალციხის მიმართულებით კიდევ დაახლოებით
    ოცდაათი კილომეტრი. სულ 188 კმ, დაახლოებით სამი საათი. მთავარი გზა ასფალტია და კარგ მდგომარეობაშია.
    აწყურის სოფელში ციხე მარჯვნივ, კლდეზე ჩანს; მანქანა სოფლის ქუჩაზე ან ეკლესიის ნანგრევებთან ტოვე და
    ბილიკს ფეხით აჰყევი. საწვავი ბორჯომსა და ახალციხეშია. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Atskuri Fortress
  short: An unrestored fortress on a rock at the narrowest point of the Mtkvari gorge, between Borjomi
    and Akhaltsikhe.
  body: >-
    **Atskuri stands where the Mtkvari gorge narrows so tightly that nothing can pass unseen.** Historically
    this was the gateway from Kartli into Samtskhe, and whoever held the rock held the road. The fortress
    rises on a steep spur above the river and is impressive even from the car.


    A stronghold is mentioned here in the early Middle Ages, but the walls and towers standing today are
    largely 14th to 16th century, remodelled first by the Jaqeli princes and later by an Ottoman garrison.
    The layout is complicated, following the shape of the rock: a lower enceinte, a middle terrace and
    an upper citadel.


    Atskuri was more than a military post. It was the seat of the Bishop of Atskuri, one of the most important
    sees in southern Georgia. The ruins of the cathedral of the Dormition lie below the fortress, and
    the **Atskuri icon of the Virgin**, which tradition says was brought by the Apostle Andrew, is now
    kept in the Georgian National Museum in Tbilisi.


    The stronghold lost its purpose after 1828, when the Russian empire took Akhaltsikhe and the frontier
    moved south. From then on the villagers took stone from it for their own building, which is a large
    part of why the lower walls are so much more broken than the towers.


    The site has been neither restored nor arranged for visitors: there are no made paths, no railings,
    no ticket and no information boards. Parts of the wall have collapsed, the stone is loose and in places
    the ground is genuinely dangerous. In exchange, the view from the top along the gorge and across the
    Meskheti range is exceptional, and you will almost certainly have it to yourself, because the traffic
    heading for Akhaltsikhe stays on the asphalt below and hardly anyone climbs up.
  tip: >-
    The climb takes twenty to thirty minutes on a steep stony path with little shade. Proper shoes are
    essential; do not attempt it in sandals. Skip the upper section in wet or icy weather, where the stone
    is slick and there is nothing to hold on to. With children, stay in the lower enclosure. Carry water,
    since nothing is sold on site; the village on the main road has a shop and a toilet. In spring the
    grass is high and snakes are possible.
  route: >-
    From Tbilisi take the E60 to Khashuri, continue to Borjomi, and then follow the Akhaltsikhe road for
    about another thirty kilometres. The total is 188 km, roughly three hours. The main road is asphalt
    and in good condition. In Atskuri village the fortress is clearly visible on the rock to the right;
    leave the car on the village street or by the ruined church and continue on foot. Fuel is available
    in Borjomi and Akhaltsikhe. An economy car is sufficient.
ru:
  name: Крепость Ацкури
  short: Неотреставрированная крепость на скале в самом узком месте ущелья Куры, между Боржоми и Ахалцихе.
  body: >-
    **Ацкури стоит там, где ущелье Куры сужается так, что мимо не пройти незамеченным.** Исторически это
    были ворота из Картли в Самцхе, и кто владел скалой, тот владел дорогой. Крепость поднимается на крутом
    мысу над рекой и выглядит внушительно даже из машины.


    Укрепление упоминается здесь ещё в раннем средневековье, но стены и башни, стоящие сегодня, относятся
    в основном к XIV-XVI векам: их перестраивали сначала князья Джакели, затем османский гарнизон. Планировка
    сложная и следует форме скалы: нижняя ограда, средняя терраса и верхняя цитадель.


    Ацкури был не только военным пунктом. Здесь находилась кафедра ацкурского епископа — одной из важнейших
    епархий Южной Грузии. Ниже крепости лежат руины Успенского собора, а **Ацкурская икона Богородицы**,
    которую предание связывает с апостолом Андреем, хранится теперь в Национальном музее Грузии в Тбилиси.


    Крепость утратила смысл после 1828 года, когда Российская империя взяла Ахалцихе и граница ушла на
    юг. С тех пор жители разбирали её на камень для собственных построек, и во многом поэтому нижние стены
    разрушены сильнее, чем башни.


    Памятник не отреставрирован и никак не приспособлен для посетителей: нет ни устроенных троп, ни перил,
    ни билета, ни информационных щитов. Часть стен обрушилась, камень осыпается, местами по-настоящему
    опасно. Зато вид сверху вдоль ущелья и на Месхетский хребет исключительный, и почти наверняка вы будете
    здесь одни: поток на Ахалцихе идёт внизу по асфальту, наверх поднимаются единицы.
  tip: >-
    Подъём занимает двадцать-тридцать минут по крутой каменистой тропе, тени почти нет. Нормальная обувь
    обязательна, в сандалиях не суйтесь. В сырую или морозную погоду верхнюю часть лучше пропустить: камень
    скользит, держаться не за что. С детьми ограничьтесь нижней оградой. Воду берите с собой, на месте
    ничего не продают; магазин и туалет есть в селе у трассы. Весной трава высокая, возможны змеи.
  route: >-
    Из Тбилиси по E60 до Хашури, дальше до Боржоми, а от Боржоми по дороге на Ахалцихе ещё около тридцати
    километров. Всего 188 км, примерно три часа. Основная дорога асфальтированная и в хорошем состоянии.
    В селе Ацкури крепость хорошо видна на скале справа; оставьте машину на сельской улице или у руин
    церкви и идите дальше пешком. Заправки есть в Боржоми и Ахалцихе. Достаточно машины эконом-класса.
fa:
  name: قلعهٔ آتسکوری
  short: قلعه‌ای مرمت‌نشده بر صخره‌ای در باریک‌ترین نقطهٔ درهٔ متکواری، میان بورجومی و آخالتسیخه.
  body: >-
    **آتسکوری آنجاست که درهٔ متکواری چنان تنگ می‌شود که هیچ‌چیز بی‌دیده‌شدن نمی‌گذرد.** این در تاریخ دروازهٔ
    ورود از کارتلی به سامتسخه بود، و هر که صخره را داشت جاده را داشت. قلعه بر زبانه‌ای تند بالای رود برمی‌خیزد
    و حتی از داخل خودرو هم چشمگیر است.


    از استحکاماتی در اینجا در اوایل سده‌های میانه یاد شده، اما دیوارها و برج‌های امروزی عمدتاً از سدهٔ
    چهاردهم تا شانزدهم‌اند و نخست به دست شاهزادگان جاقلی و سپس پادگانی عثمانی بازسازی شده‌اند. طرح بنا
    پیچیده است و شکل صخره را دنبال می‌کند: حصار پایینی، ایوان میانی و ارگ بالایی.


    آتسکوری تنها پایگاهی نظامی نبود. اینجا کرسی اسقف آتسکوری بود، از مهم‌ترین اسقف‌نشین‌های جنوب گرجستان.
    ویرانه‌های کلیسای جامع خوابیدگی مریم پایین قلعه‌اند، و **شمایل مریم آتسکوری** که روایت آن را به آندریاس
    حواری نسبت می‌دهد امروز در موزهٔ ملی گرجستان در تفلیس نگهداری می‌شود.


    این دژ پس از ۱۸۲۸ کارکرد خود را از دست داد، آنگاه که امپراتوری روسیه آخالتسیخه را گرفت و مرز به جنوب
    رفت. از آن پس اهالی سنگ آن را برای ساختمان‌های خود بردند، و همین بخش بزرگی از دلیل آن است که دیوارهای
    پایینی بسیار بیش از برج‌ها ویران‌اند.


    این محوطه نه مرمت شده و نه برای بازدیدکننده آماده: نه مسیر ساخته‌شده‌ای هست، نه نرده، نه بلیت، نه
    تابلوی راهنما. بخشی از دیوار فرو ریخته، سنگ‌ها سست است و جاهایی زمین واقعاً خطرناک. در عوض چشم‌انداز
    از بالا در امتداد دره و بر رشته‌کوه مسختی کم‌نظیر است و تقریباً حتماً تنها خواهید بود، چون ترافیک
    آخالتسیخه پایین روی آسفالت می‌ماند و کمتر کسی بالا می‌آید.
  tip: >-
    صعود بیست تا سی دقیقه روی مسیری تند و سنگی و کم‌سایه طول می‌کشد. کفش مناسب ضروری است و با صندل تلاش
    نکنید. در هوای بارانی یا یخبندان از بخش بالایی بگذرید، چون سنگ لیز است و جای گرفتن نیست. با کودکان
    به حصار پایینی بسنده کنید. آب همراه ببرید چون در محوطه چیزی فروخته نمی‌شود؛ مغازه و سرویس بهداشتی
    در روستای کنار جاده هست. بهار علف بلند است و احتمال مار وجود دارد.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری، سپس تا بورجومی، و از بورجومی حدود سی کیلومتر دیگر در جادهٔ آخالتسیخه.
    مجموع ۱۸۸ کیلومتر و نزدیک سه ساعت. جادهٔ اصلی آسفالت و در وضعیت خوب است. در روستای آتسکوری قلعه به‌روشنی
    بر صخرهٔ سمت راست دیده می‌شود؛ خودرو را در خیابان روستا یا کنار ویرانهٔ کلیسا بگذارید و پیاده ادامه
    دهید. سوخت در بورجومی و آخالتسیخه موجود است. خودروی اقتصادی کافی است.
he:
  name: מבצר אצקורי
  short: מבצר לא משוחזר על סלע בנקודה הצרה ביותר של ערוץ המטקוורי, בין בורג'ומי לאחלציחה.
  body: >-
    **אצקורי עומד במקום שבו ערוץ המטקוורי מצטמצם עד שדבר אינו עובר בו בלי שיראו אותו.** מבחינה היסטורית
    זה היה השער מקרתלי אל סמצחה, ומי שהחזיק בסלע החזיק בדרך. המבצר מתנשא על לשון סלע תלולה מעל הנהר ומרשים
    אפילו מבעד לחלון המכונית.


    מוזכר כאן ביצור כבר בראשית ימי הביניים, אך החומות והמגדלים העומדים היום הם ברובם מן המאות ה-14 עד
    ה-16, לאחר שנבנו מחדש תחילה בידי נסיכי ג'קלי ואחר כך בידי חיל מצב עות'מאני. המתאר מסובך ונוהה אחרי
    צורת הסלע: חומת היקף תחתונה, מדרגה אמצעית ומצודה עליונה.


    אצקורי לא היה רק עמדה צבאית. כאן ישב הבישוף של אצקורי, אחת הכהונות החשובות בדרום גאורגיה. חורבות קתדרלת
    ההירדמות שוכנות מתחת למבצר, ו**איקונת הבתולה מאצקורי**, שהמסורת מייחסת את הבאתה לאנדראס השליח, נשמרת
    כיום במוזיאון הלאומי של גאורגיה בטביליסי.


    המבצר איבד את תפקידו אחרי 1828, כשהאימפריה הרוסית כבשה את אחלציחה והגבול נדד דרומה. מאז נטלו התושבים
    ממנו אבן לבנייה משלהם, וזו סיבה נכבדה לכך שהחומות התחתונות הרוסות הרבה יותר מן המגדלים.


    האתר לא שוחזר ולא הותאם למבקרים: אין שבילים סלולים, אין מעקות, אין כרטיס ואין שלטי הסבר. חלק מן החומה
    קרס, האבן מתפוררת, ובמקומות מסוימים הקרקע מסוכנת ממש. בתמורה, הנוף מלמעלה לאורך הערוץ ואל רכס מסחתי
    יוצא דופן, וכמעט בוודאות תהיו כאן לבדכם, שכן התנועה לאחלציחה נשארת למטה על האספלט וכמעט איש אינו מטפס.
  tip: >-
    הטיפוס אורך עשרים עד שלושים דקות בשביל תלול ואבני שכמעט אין בו צל. נעליים ראויות הן הכרח, ואל תנסו
    בסנדלים. במזג אוויר רטוב או קפוא ותרו על החלק העליון, שם האבן חלקה ואין במה לאחוז. עם ילדים הישארו
    במתחם התחתון. קחו מים, שכן באתר לא נמכר דבר; בכפר שעל הכביש יש חנות ושירותים. באביב העשב גבוה וייתכנו
    נחשים.
  route: >-
    מטביליסי בכביש E60 עד חשורי, משם לבורג'ומי, ומבורג'ומי בדרך לאחלציחה עוד כשלושים קילומטרים. בסך הכול
    188 ק״מ, כשלוש שעות. הדרך הראשית סלולה ובמצב טוב. בכפר אצקורי המבצר נראה היטב על הסלע מימין; השאירו
    את הרכב ברחוב הכפר או ליד חורבת הכנסייה והמשיכו ברגל. דלק יש בבורג'ומי ובאחלציחה. רכב חסכוני מספיק.
ar:
  name: قلعة أتسكوري
  short: قلعة غير مرممة على صخرة عند أضيق نقطة في وادي متكفاري، بين بورجومي وأخالتسيخه.
  body: >-
    **تقوم أتسكوري حيث يضيق وادي متكفاري حتى لا يمر فيه شيء دون أن يُرى.** كان هذا تاريخياً باب العبور
    من كارتلي إلى سامتسخه، ومن ملك الصخرة ملك الطريق. تنهض القلعة على نتوء حاد فوق النهر وتبدو مهيبة حتى
    من داخل السيارة.


    ذُكر حصن هنا منذ مطلع العصور الوسطى، لكن الأسوار والأبراج القائمة اليوم تعود في معظمها إلى القرون
    الرابع عشر والسادس عشر، أعاد بناءها أمراء جاقلي أولاً ثم حامية عثمانية. والتخطيط معقد يتبع شكل الصخرة:
    سور سفلي، ومصطبة وسطى، وقلعة داخلية عليا.


    ولم تكن أتسكوري موقعاً عسكرياً فحسب. فهنا كان كرسي أسقف أتسكوري، وهو من أهم الأبرشيات في جنوب جورجيا.
    وتقع أطلال كاتدرائية رقاد العذراء أسفل القلعة، أما **أيقونة العذراء الأتسكورية**، التي تنسب الرواية
    مجيئها إلى الرسول أندراوس، فتُحفظ اليوم في المتحف الوطني الجورجي بتبليسي.


    فقد الحصن غرضه بعد عام 1828، حين أخذت الإمبراطورية الروسية أخالتسيخه وانتقلت الحدود جنوباً. ومنذ ذلك
    الحين أخذ الأهالي حجارته لبناء بيوتهم، وهذا سبب كبير في أن الأسوار السفلى أشد خراباً من الأبراج.


    ولم يُرمم الموقع ولم يُهيأ للزوار: لا مسارات ممهدة ولا درابزين ولا تذكرة ولا لوحات تعريفية. انهار
    جزء من السور، والحجارة مفككة، والأرض في مواضع خطرة فعلاً. في المقابل، المنظر من الأعلى على امتداد
    الوادي وعلى سلسلة مسخيتي استثنائي، وستكون على الأرجح وحدك، لأن السائرين إلى أخالتسيخه يبقون في الأسفل
    على الإسفلت ولا يكاد أحد يصعد.
  tip: >-
    يستغرق الصعود عشرين إلى ثلاثين دقيقة على درب حاد حجري بلا ظل تقريباً. الحذاء المناسب ضروري، ولا تحاول
    بالصندل. وفي الطقس الرطب أو المتجمد تجاوز القسم الأعلى، فالحجر زلق ولا شيء تتمسك به. ومع الأطفال اكتفِ
    بالسور السفلي. واحمل الماء فلا شيء يُباع في الموقع؛ وفي القرية على الطريق متجر ودورة مياه. وفي الربيع
    يعلو العشب وتحتمل مصادفة الأفاعي.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري، ثم إلى بورجومي، ومن بورجومي على طريق أخالتسيخه نحو ثلاثين كيلومتراً
    أخرى. المجموع 188 كم ونحو ثلاث ساعات. الطريق الرئيسي معبّد وبحالة جيدة. وفي قرية أتسكوري تُرى القلعة
    بوضوح على الصخرة إلى اليمين؛ اترك السيارة في شارع القرية أو عند خراب الكنيسة وتابع سيراً. الوقود متوفر
    في بورجومي وأخالتسيخه. وسيارة اقتصادية تكفي.
