ka:
  name: სტეფანწმინდა (ყაზბეგი)
  short: >-
    მთიანი ხევის მთავარი დაბა მყინვარწვერის ძირში — ხევის მოგზაურობის საწყისი წერტილი და ყველაზე ცნობილი
    მთის ხედი საქართველოში.
  body: >-
    **სტეფანწმინდა ის ადგილია, სადაც კავკასიონი პირველად მთელი სიმაღლით დაგადგება თავზე.** დაბა 1740 მეტრზე
    ზის, საქართველოს სამხედრო გზის ბოლო მონაკვეთზე, და მოწმენდილ დილას მთავარ მოედანზე ყავის დალევისას
    პირდაპირ მყინვარწვერის 5054-მეტრიან თეთრ კონუსს უყურებ — გერგეთის სამების ეკლესიით წინა პლანზე.


    სახელი XVIII საუკუნეში აქ დაყუდებული ბერის, სტეფანეს, სახელს უკავშირდება. 1925 წელს საბჭოთა ხელისუფლებამ
    დაბას ყაზბეგი დაარქვა — აქვე დაბადებული მწერლის, ალექსანდრე ყაზბეგის პატივსაცემად — და ისტორიული სახელი
    მხოლოდ 2006 წელს დაუბრუნდა. ორივე სახელი დღემდე პარალელურად ისმის.


    დაბა მთელი ხევის ბაზაა:


    - **გერგეთის სამების ხედი** — ეკლესია დაბის თავზე კლდეზე დგას, გზა ასფალტირებულია

    - **ალექსანდრე ყაზბეგის მუზეუმი** — მწერლის სახლ-მუზეუმი და საგვარეულო საფლავები

    - **კაფეები და სასტუმროს ტერასები** მთის პირდაპირი ხედით

    - საწყისი წერტილი ჯუთის, თრუსოსა და დარიალისკენ


    ზაფხულში აქ ხალხმრავლობაა და საღამოს მაგიდას ვერ იშოვი, ზამთარში კი დაბა თითქმის ცარიელი და თოვლიანია
    — ხედი კი ორივე სეზონზე ერთნაირად მუშაობს. მთა ყველაზე ხშირად დილით ჩანს; შუადღისას წვერს ღრუბელი
    ეფარება.
  tip: >-
    ივლის-აგვისტოში საოჯახო სასტუმროები წინასწარ დაჯავშნე — ბოლო მომენტში ძვირი და მწირი არჩევანია. მყინვარწვერის
    სანახავად ადრე ადექი: დილის ცხრამდე ცა ყველაზე სუფთაა. მოედანთან ბანკომატები, აფთიაქი და სუპერმარკეტია
    — ხეობებში წასვლამდე ყველაფერი აქ შეიძინე. ტაქსისტები გერგეთამდე ფიქსირებულ ფასს ამბობენ, ივაჭრე.
    ამინდი სწრაფად იცვლება — ზაფხულშიც თბილი ქურთუკი წამოიღე.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) ჩრდილოეთისკენ: მცხეთა, ანანური, ფასანაური, გუდაური, ჯვრის
    უღელტეხილი (2395 მ) და დაღმართი სტეფანწმინდამდე — 157 კმ, სუფთა გზაზე დაახლოებით სამი საათი. გზა ბოლომდე
    ასფალტია, მაგრამ ლარსის საზღვრისკენ მიმავალი სატვირთოების კოლონები ტემპს ანელებს. საწვავი ფასანაურში
    ან გუდაურში აიღე. ზაფხულში ეკონომ-კლასი სავსებით საკმარისია; ზამთარში უღელტეხილზე ჯაჭვები ან მაღალი
    განივლობის ავტომობილი გჭირდება და გუდაურთან გზა დროებით შეიძლება დაიკეტოს.
en:
  name: Stepantsminda (Kazbegi)
  short: >-
    The mountain town at the foot of Mount Kazbek — base camp for the whole Kazbegi area and home to Georgia's
    most famous view.
  body: >-
    **Stepantsminda is where the Caucasus finally towers directly over you.** The town sits at 1,740 m
    on the last stretch of the Georgian Military Highway, and on a clear morning you can drink coffee
    on the main square while staring straight up at the 5,054 m white cone of Mount Kazbek, with Gergeti
    Trinity Church perched in the foreground.


    The name comes from Stepan, a monk who built a hermitage here in the 18th century. In 1925 the Soviets
    renamed the town Kazbegi after the writer Alexander Kazbegi, who was born here; the historic name
    only returned in 2006, and locals still use both interchangeably.


    The town is the base for everything in Khevi:


    - **The Gergeti Trinity view** — the church stands on a bluff right above town, now reached by asphalt
    road

    - **The Alexander Kazbegi Museum**, the writer's house with the family graves

    - **Cafe and hotel terraces** aimed squarely at the mountain

    - Jumping-off point for Juta, Truso and the Dariali gorge


    Summer brings crowds and full guesthouses; winter leaves the town snowy and nearly empty, though the
    view works just as hard in both. The peak shows itself most reliably at dawn — by midday a cloud cap
    usually forms over the summit.
  tip: >-
    Book guesthouses well ahead for July and August; last-minute options are thin and overpriced. For
    the Kazbek view, get up early — the sky is clearest before nine. ATMs, a pharmacy and proper supermarkets
    cluster near the square, so stock up here before heading into the valleys. Taxi drivers quote fixed
    prices to Gergeti; bargain politely. Weather flips fast at 1,740 m, so pack a warm layer even in August.
  route: >-
    Take the Georgian Military Highway (E117) north from Tbilisi: Mtskheta, Ananuri, Pasanauri, Gudauri,
    over the Jvari Pass at 2,395 m and down to Stepantsminda — 157 km, about three hours on a clear road.
    The asphalt is good the whole way, but truck convoys heading for the Larsi border crossing slow things
    down. Refuel in Pasanauri or Gudauri. An economy car is fine in summer; in winter the pass demands
    chains or a higher-clearance vehicle and closes temporarily after heavy snowfall.
ru:
  name: Степанцминда (Казбеги)
  short: Горный посёлок у подножия Казбека — база для всего района Казбеги и самый знаменитый горный вид
    Грузии.
  body: >-
    **Степанцминда — то место, где Кавказ впервые нависает прямо над тобой.** Посёлок лежит на высоте
    1740 м на последнем участке Военно-Грузинской дороги, и ясным утром можно пить кофе на главной площади,
    глядя прямо на белый конус Казбека высотой 5054 м, с церковью Гергети Самеба на переднем плане.


    Название связано с монахом Степаном, основавшим здесь скит в XVIII веке. В 1925 году советская власть
    переименовала посёлок в Казбеги — в честь родившегося здесь писателя Александра Казбеги; историческое
    имя вернулось только в 2006-м, и оба названия до сих пор в ходу.


    Посёлок — база для всего Хеви:


    - **Вид на Гергети Самеба** — церковь стоит на утёсе прямо над посёлком, дорога к ней теперь асфальтированная

    - **Музей Александра Казбеги** — дом писателя с семейными захоронениями

    - **Террасы кафе и отелей**, развёрнутые точно на гору

    - Отправная точка в Джуту, Трусо и Дарьяльское ущелье


    Летом здесь многолюдно и гестхаусы забиты; зимой посёлок заснежен и почти пуст, но вид работает одинаково
    в любой сезон. Вершина надёжнее всего показывается на рассвете — к полудню над ней обычно встаёт облачная
    шапка.
  tip: >-
    На июль-август бронируйте жильё заранее — в последний момент выбор скудный и дорогой. Ради вида на
    Казбек вставайте рано: до девяти небо чище всего. У площади есть банкоматы, аптека и нормальные супермаркеты
    — закупайтесь здесь перед выездом в ущелья. Таксисты называют фиксированную цену до Гергети, торгуйтесь.
    Погода на 1740 м меняется быстро, тёплая куртка нужна даже в августе.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге (E117) на север: Мцхета, Ананури, Пасанаури, Гудаури, Крестовый
    перевал (2395 м) и спуск к Степанцминде — 157 км, около трёх часов по свободной дороге. Асфальт хороший
    на всём протяжении, но колонны фур к погранпереходу Ларс сбивают темп. Заправляйтесь в Пасанаури или
    Гудаури. Летом достаточно машины эконом-класса; зимой на перевале нужны цепи или машина с высоким
    клиренсом, после сильных снегопадов дорогу временно закрывают.
fa:
  name: استپانتسمیندا (کازبگی)
  short: شهرک کوهستانی پای کوه کازبک — پایگاه تمام منطقهٔ کازبگی و مشهورترین منظرهٔ کوهستانی گرجستان.
  body: >-
    **استپانتسمیندا جایی است که قفقاز سرانجام درست بالای سرت قد می‌کشد.** شهرک در ارتفاع 1740 متری، در
    واپسین بخش بزرگراه نظامی گرجستان نشسته و در یک صبح صاف می‌توان در میدان اصلی قهوه نوشید و مستقیم به
    مخروط سفید 5054 متری کوه کازبک خیره شد، با کلیسای ترینیتی گرگتی در پیش‌زمینه.


    نام شهرک از استپان، راهبی که در سدهٔ هجدهم اینجا خلوتگاهی ساخت، گرفته شده است. در 1925 شوروی‌ها آن
    را به افتخار نویسندهٔ زادهٔ همین‌جا، الکساندر کازبگی، «کازبگی» نامیدند؛ نام تاریخی تنها در 2006 بازگشت
    و مردم هنوز هر دو نام را به کار می‌برند.


    شهرک پایگاه همهٔ منطقهٔ خِوی است:


    - **منظرهٔ کلیسای گرگتی** — کلیسا بر صخره‌ای درست بالای شهرک ایستاده و جاده‌اش اکنون آسفالت است

    - **موزهٔ الکساندر کازبگی** — خانهٔ نویسنده با آرامگاه خانوادگی

    - **تراس کافه‌ها و هتل‌ها** رو به کوه

    - نقطهٔ شروع سفر به جوتا، تروسو و درهٔ داریالی


    تابستان اینجا شلوغ است و مهمان‌خانه‌ها پر؛ زمستان شهرک برفی و تقریباً خالی است، اما منظره در هر دو
    فصل به یک اندازه کار می‌کند. قله بیش از همه سپیده‌دم پیداست — تا ظهر معمولاً کلاهکی از ابر رویش می‌نشیند.
  tip: >-
    برای ژوئیه و اوت اقامتگاه را از پیش رزرو کنید؛ در لحظهٔ آخر گزینه‌ها کم و گران‌اند. برای دیدن کازبک
    زود بیدار شوید: آسمان پیش از ساعت نه صاف‌تر است. نزدیک میدان خودپرداز، داروخانه و سوپرمارکت هست —
    پیش از رفتن به دره‌ها همین‌جا خرید کنید. راننده‌های تاکسی برای گرگتی قیمت مقطوع می‌گویند؛ چانه بزنید.
    هوا در 1740 متری سریع برمی‌گردد، حتی در اوت لباس گرم بیاورید.
  route: >-
    از تفلیس با بزرگراه نظامی گرجستان (E117) به شمال: متسختا، آنانوری، پاسانائوری، گودائوری، گردنهٔ جواری
    (2395 متر) و سرازیری تا استپانتسمیندا — 157 کیلومتر، حدود سه ساعت در جادهٔ خلوت. آسفالت سراسر خوب
    است، اما کاروان کامیون‌های مرز لارس سرعت را می‌گیرد. سوخت را در پاسانائوری یا گودائوری بزنید. تابستان
    خودروی اقتصادی کافی است؛ زمستان گردنه زنجیر چرخ یا خودروی شاسی‌بلند می‌خواهد و پس از برف سنگین موقتاً
    بسته می‌شود.
he:
  name: סטפנצמינדה (קזבגי)
  short: עיירת הרים למרגלות הר קזבק — בסיס לכל אזור קזבגי וביתו של הנוף המפורסם ביותר בגאורגיה.
  body: >-
    **סטפנצמינדה היא המקום שבו הקווקז מתנשא סוף-סוף ישר מעל הראש.** העיירה יושבת בגובה 1,740 מ' בקטע האחרון
    של כביש הצבא הגאורגי, ובבוקר בהיר אפשר לשתות קפה בכיכר המרכזית ולהביט היישר בחרוט הלבן של הר קזבק,
    5,054 מ', עם כנסיית גרגטי סמבה בקדמת התמונה.


    השם בא מסטפן, נזיר שהקים כאן מנזר בודדים במאה ה-18. ב-1925 שינו הסובייטים את שם העיירה לקזבגי, על
    שם הסופר אלכסנדר קזבגי שנולד בה; השם ההיסטורי חזר רק ב-2006, והמקומיים משתמשים עד היום בשני השמות.


    העיירה היא הבסיס לכל חבל חווי:


    - **הנוף אל גרגטי סמבה** — הכנסייה עומדת על מצוק ממש מעל העיירה, והדרך אליה סלולה כיום

    - **מוזיאון אלכסנדר קזבגי** — בית הסופר עם קברי המשפחה

    - **מרפסות בתי קפה ומלונות** המכוונות היישר אל ההר

    - נקודת יציאה לג'וטה, לטרוסו ולערוץ דריאלי


    בקיץ צפוף כאן וחדרי האירוח מלאים; בחורף העיירה מושלגת וכמעט ריקה, אבל הנוף עובד באותה עוצמה בשתי העונות.
    הפסגה נגלית בצורה האמינה ביותר עם שחר — עד הצהריים נוצר מעליה בדרך כלל כובע עננים.
  tip: >-
    ליולי-אוגוסט הזמינו לינה הרבה מראש — ברגע האחרון ההיצע דל ויקר. בשביל הנוף אל קזבק קומו מוקדם: השמיים
    הכי נקיים לפני תשע. ליד הכיכר יש כספומטים, בית מרקחת וסופרמרקטים — הצטיידו כאן לפני היציאה לעמקים.
    נהגי המוניות נוקבים מחיר קבוע לגרגטי; התמקחו בנימוס. מזג האוויר בגובה 1,740 מ' מתהפך מהר, קחו שכבה
    חמה גם באוגוסט.
  route: >-
    מטביליסי צפונה בכביש הצבא הגאורגי (E117): מצחתה, אנאנורי, פסנאורי, גודאורי, מעבר ג'ווארי בגובה 2,395
    מ' וירידה לסטפנצמינדה — 157 ק"מ, כשלוש שעות בכביש פנוי. האספלט טוב לכל האורך, אבל שיירות משאיות למעבר
    הגבול לארס מאטות את הקצב. תדלקו בפסנאורי או בגודאורי. בקיץ מספיק רכב חסכוני; בחורף המעבר דורש שרשראות
    או רכב גבוה, ואחרי שלגים כבדים הכביש נסגר זמנית.
ar:
  name: ستيبانتسميندا (كازبيغي)
  short: بلدة جبلية عند سفح جبل كازبيك — قاعدة منطقة كازبيغي كلها وموطن أشهر إطلالة جبلية في جورجيا.
  body: >-
    **ستيبانتسميندا هي المكان الذي يعلوك فيه القوقاز أخيراً بكامل قامته.** تجلس البلدة على ارتفاع 1740
    متراً في آخر مقطع من الطريق العسكري الجورجي، وفي صباح صافٍ يمكنك شرب القهوة في الساحة الرئيسية وأنت
    تحدّق مباشرة في المخروط الأبيض لجبل كازبيك البالغ 5054 متراً، وكنيسة غيرغيتي للثالوث في مقدمة المشهد.


    يعود الاسم إلى الراهب ستيبان الذي أقام هنا صومعة في القرن الثامن عشر. وفي عام 1925 غيّر السوفيت اسم
    البلدة إلى كازبيغي تكريماً للكاتب ألكسندر كازبيغي المولود فيها؛ ولم يعد الاسم التاريخي إلا في 2006،
    وما زال الأهالي يستخدمون الاسمين معاً.


    البلدة قاعدة لكل منطقة خيفي:


    - **إطلالة غيرغيتي** — تقف الكنيسة على جرف فوق البلدة مباشرة، والطريق إليها معبّد اليوم

    - **متحف ألكسندر كازبيغي** — بيت الكاتب مع مقابر العائلة

    - **شرفات المقاهي والفنادق** الموجهة نحو الجبل تماماً

    - نقطة الانطلاق إلى جوتا وتروسو ووادي داريالي


    في الصيف تزدحم البلدة وتمتلئ بيوت الضيافة؛ وفي الشتاء تصبح مثلجة وشبه خالية، لكن الإطلالة تعمل بالقوة
    نفسها في الموسمين. وتظهر القمة غالباً عند الفجر — فبحلول الظهيرة تعتمر عادةً قبعة من الغيوم.
  tip: >-
    احجز الإقامة مسبقاً لشهري يوليو وأغسطس؛ الخيارات المتأخرة قليلة وغالية. لرؤية كازبيك انهض باكراً:
    السماء أصفى ما تكون قبل التاسعة. قرب الساحة صرافات آلية وصيدلية وسوبرماركت — تزوّد هنا قبل التوجه
    إلى الوديان. سائقو التاكسي يحددون سعراً ثابتاً إلى غيرغيتي؛ فاوض بلطف. الطقس على ارتفاع 1740 متراً
    يتقلب بسرعة، فخذ سترة دافئة حتى في أغسطس.
  route: >-
    من تبليسي شمالاً على الطريق العسكري الجورجي (E117): متسخيتا، أنانوري، باسانوري، غودوري، ثم ممر جفاري
    على ارتفاع 2395 متراً والنزول إلى ستيبانتسميندا — 157 كم، نحو ثلاث ساعات على طريق سالك. الإسفلت جيد
    طوال المسافة، لكن قوافل الشاحنات المتجهة إلى معبر لارس تبطئ السير. تزوّد بالوقود في باسانوري أو غودوري.
    في الصيف تكفي سيارة اقتصادية؛ وفي الشتاء يتطلب الممر سلاسل أو سيارة مرتفعة، وقد يُغلق مؤقتاً بعد الثلوج
    الكثيفة.
