ka:
  name: სტეფანწმინდა (ყაზბეგი)
  short: >-
    თერგისპირა დაბა 1740 მეტრზე, ალექსანდრე ყაზბეგის სამშობლო: სახურავებს ზემოთ მყინვარწვერის თეთრი კონუსი
    დგას, ხევის ყველა გზა კი აქედან იწყება.
  body: >-
    **სტეფანწმინდაში მყინვარწვერს არ ეძებთ — ის თავად გპოულობთ, როგორც კი კარს გამოაღებთ.**


    დაბა თერგის ნაპირას, ზღვის დონიდან 1740 მეტრზე დგას, თბილისიდან 157 კილომეტრში, საქართველოს სამხედრო
    გზაზე, რუსეთის საზღვრამდე დაახლოებით 12 კილომეტრით ადრე. მოწმენდილ დილას მთავარი მოედნიდან დასავლეთით
    გაიხედეთ და დაინახავთ, როგორ მიიწევს მიწა ზემოთ ერთი მოქნევით, სამ კილომეტრზე მეტად: ჯერ კლდოვანი
    გორა გერგეთის სამებით, მერე მყინვარები და ბოლოს 5054-მეტრიანი წვერი.


    სახელი „წმინდა სტეფანეს“ ნიშნავს. გადმოცემით, ბერმა სტეფანემ აქ, გზის პირას, სავანე ააშენა და სოფლელებს
    ურჩია, ცოტა სამხრეთით გადასახლებულიყვნენ, რომ ზვავებს მოშორებოდნენ. XVIII საუკუნის ბოლოს გზაზე გამვლელებისგან
    ბაჟს ჩოფიკაშვილები კრეფდნენ. როცა რუსეთმა ქართლ-კახეთის სამეფო შემოიერთა და მთიელები აჯანყდნენ, ადგილობრივი
    ბატონი, გაბრიელ ჩოფიკაშვილი, იმპერიის მხარეს დადგა, რუსი ოფიცრის ჩინი მიიღო და გვარად ყაზბეგი დაირქვა;
    სოფელსაც ყაზბეგს უწოდებდნენ. 1925 წელს საბჭოთა ხელისუფლებამ ეს სახელი ოფიციალურად დაამტკიცა, 2006
    წელს კი დაბას ძველი სახელი დაუბრუნდა. ადგილობრივები დღემდე ორივეს ხმარობენ.


    გაბრიელის შვილიშვილი, ალექსანდრე ყაზბეგი, აქ დაიბადა. თბილისში, პეტერბურგსა და მოსკოვში ისწავლა, შინ
    დაბრუნებულმა კი მწყემსობა აირჩია, რომ მთიელთა ცხოვრება შიგნიდან გაეცნო. მისმა რომანმა „მამის მკვლელმა“
    შექმნა კობა, მთის აბრაგი, რომლის სახელიც ახალგაზრდა იოსებ ჯუღაშვილმა, მომავალმა სტალინმა, რევოლუციურ
    ფსევდონიმად აიღო. მწერალი თბილისში გარდაიცვალა; მისი კუბო ჯვრის უღელტეხილზე გადმოასვენეს მშობლიურ
    დაბაში, სადაც მისი ბავშვობის სახლი დღეს მუზეუმია.


    დღეს სტეფანწმინდა მთელი ხევის ბაზაა. ოღონდ ადრე ადექით. შუადღისთვის მთა, როგორც წესი, ღრუბელს წაიფარებს
    და სტეფანწმინდა ისევ ჩვეულებრივ მთის დაბად იქცევა.
  tip: >-
    ღამე აქ გაათიეთ და ერთდღიანი ვიზიტით ნუ დაკმაყოფილდებით: მწვერვალი მზის ამოსვლიდან პირველ საათებში
    ჩანს ყველაზე კარგად, შუადღისთვის კი ხშირად იმალება. ივლის-აგვისტოსთვის საოჯახო სასტუმრო დიდი ხნით
    ადრე დაჯავშნეთ. ბანკომატები, აფთიაქი და სუპერმარკეტები მთავარი მოედნის ირგვლივაა; მარაგი აქ შეავსეთ,
    რადგან ჯუთაში, სნოსა და თრუსოში თითქმის არაფერია. ალექსანდრე ყაზბეგის სახლ-მუზეუმი ბოლო წლებში რესტავრაციაზე
    იყო, ამიტომ წინასწარ გადაამოწმეთ, ღიაა თუ არა. 1740 მეტრზე ამინდი საათში იცვლება: აგვისტოშიც თბილი
    ტანსაცმელი წაიღეთ, ტაქსის ფასზე კი გერგეთამდე ან ჯუთამდე ჩაჯდომამდე შეთანხმდით.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117, შიდა ნომრით ს3) ჩრდილოეთისკენ გაემართეთ — მცხეთის, ჟინვალის,
    ანანურის, ფასანაურისა და გუდაურის გავლით, ჯვრის უღელტეხილზე (2379 მ) გადასვლით და კობის გავლით სტეფანწმინდამდე:
    157 კილომეტრი, დაახლოებით სამი საათი. გზა ბოლომდე ასფალტია; ტემპს ძირითადად ლარსის გამშვები პუნქტისკენ
    მიმავალი სატვირთოები ანელებს — პუნქტი დაბიდან დაახლოებით 12 კილომეტრშია ჩრდილოეთით. საწვავი ფასანაურში
    ან გუდაურში ჩაასხით. გვიანი გაზაფხულიდან შემოდგომამდე ეკონომკლასის ავტომობილი სავსებით საკმარისია.
    ზამთარში ზამთრის საბურავები და საბარგულში ჯაჭვები აუცილებელია: ძლიერი თოვლის შემდეგ უღელტეხილი შეიძლება
    საათობით ან რამდენიმე დღით დაიკეტოს, ამიტომ გზის მდგომარეობა თბილისიდან გასვლამდე გადაამოწმეთ.
en:
  name: Stepantsminda (Kazbegi)
  short: >-
    A high town on the Terek, birthplace of the writer Alexander Kazbegi, where Kazbek's white cone rises
    over the rooftops and every road into Khevi begins.
  body: >-
    **In Stepantsminda you do not go looking for Kazbek; it finds you the moment you step outside.**


    The town sits at 1,740 m on the Terek, 157 km north of Tbilisi, on the Georgian Military Highway,
    about 12 km short of the Russian border. Look west from the main square on a clear morning and the
    land climbs more than three kilometres in a single sweep: first the bluff of Gergeti Trinity Church,
    then the glaciers, then the 5,054 m summit.


    The name means "Saint Stephen". Tradition says a monk called Stephan built a hermitage here beside
    the road and urged the villagers to move a little to the south, out of the path of the avalanches.
    By the late 18th century the Chopikashvilis were taking tolls from travellers. When Russia absorbed
    the Georgian kingdom and the highlanders rose against it, the local lord, Gabriel Chopikashvili, stood
    with the empire, was made a Russian officer and took the surname Kazbegi, and the village came to
    be called Kazbegi too. The Soviets made that name official in 1925; the old one returned in 2006,
    and people here still use both.


    Gabriel's grandson, Alexander Kazbegi, was born in the town. After studying in Tbilisi, St Petersburg
    and Moscow, he came home and worked as a shepherd to learn highland life first-hand. His novel *The
    Patricide* created Koba, a mountain outlaw whose name the young Ioseb Jughashvili, the future Stalin,
    borrowed as a revolutionary alias. When the writer died in Tbilisi, his coffin was carried back over
    the Jvari Pass to Stepantsminda, where his childhood home is kept as a museum.


    Today the town is the base for all of Khevi. Come early. By midday the mountain has usually pulled
    a cloud over its head, and Stepantsminda goes back to being an ordinary town.
  tip: >-
    Sleep here rather than day-tripping: the summit is clearest in the first hours after sunrise and often
    hidden by noon. Book guesthouses well ahead for July and August. ATMs, a pharmacy and supermarkets
    are grouped around the main square, so stock up before Juta, Sno or Truso, which have little or nothing.
    The Alexander Kazbegi house-museum has been under restoration in recent years; check that it is open
    before building a day around it. At 1,740 m the weather can turn within the hour, so pack a warm layer
    even in August, and agree taxi fares to Gergeti or Juta before you get in.
  route: >-
    Take the Georgian Military Highway (E117, national route S3) north from Tbilisi through Mtskheta,
    Zhinvali, Ananuri, Pasanauri and Gudauri, over the Jvari Pass at 2,379 m and down through Kobi to
    Stepantsminda: 157 km, about three hours. It is asphalt all the way; the real brake is the lorry traffic
    heading for the Larsi border crossing, about 12 km north of town. Fill up in Pasanauri or Gudauri.
    From late spring to autumn an economy car is fine. In winter you need winter tyres and chains in the
    boot: heavy snow can close the pass for hours or days, so check the road status before leaving Tbilisi.
ru:
  name: Степанцминда (Казбеги)
  short: >-
    Высокогорный посёлок на Тереке, родина Александра Казбеги: над крышами встаёт белый конус Казбека,
    а отсюда начинаются все дороги Хеви.
  body: >-
    **В Степанцминде не нужно искать Казбек: он сам находит вас, стоит только выйти за порог.**


    Посёлок стоит на высоте 1740 м на Тереке, в 157 км к северу от Тбилиси, на Военно-Грузинской дороге,
    примерно в 12 км от российской границы. Посмотрите ясным утром с главной площади на запад: земля одним
    махом поднимается больше чем на три километра — сначала уступ с Гергетской Троицей, потом ледники,
    потом вершина высотой 5054 м.


    Название означает «Святой Степан». Предание говорит, что монах по имени Степан устроил здесь у дороги
    скит и уговорил жителей переселиться чуть южнее, подальше от лавин. К концу XVIII века Чопикашвили
    брали с путников пошлину. Когда Россия поглотила Грузинское царство и горцы восстали против неё, местный
    владетель Габриэл Чопикашвили встал на сторону империи, получил чин русского офицера и взял фамилию
    Казбеги, а следом и село стали звать Казбеги. Советская власть сделала это имя официальным в 1925
    году; прежнее вернулось в 2006-м, но местные до сих пор пользуются обоими.


    Внук Габриэла, Александр Казбеги, родился здесь же. Выучившись в Тбилиси, Петербурге и Москве, он
    вернулся домой и пошёл в пастухи, чтобы узнать горскую жизнь изнутри. В его романе «Отцеубийца» появился
    Коба, горный абрек, чьё имя молодой Иосиф Джугашвили, будущий Сталин, взял себе революционным псевдонимом.
    Когда писатель умер в Тбилиси, его гроб повезли обратно через Крестовый перевал в Степанцминду, где
    дом его детства сохраняется как музей.


    Сегодня посёлок — база для всего Хеви. Приезжайте пораньше: к полудню гора обычно натягивает на голову
    облако, и Степанцминда снова становится обычным городком.
  tip: >-
    Ночуйте здесь, а не приезжайте на один день: вершина лучше всего видна в первые часы после рассвета
    и к полудню часто скрывается. Гостевые дома на июль и август бронируйте заблаговременно. Банкоматы,
    аптека и супермаркеты собраны вокруг главной площади, так что закупитесь перед поездкой в Джуту, Сно
    или Трусо, где почти ничего или вовсе ничего нет. Дом-музей Александра Казбеги в последние годы был
    на реставрации; прежде чем планировать вокруг него день, уточните, открыт ли он. На высоте 1740 м
    погода может перемениться за час, поэтому тёплая одежда нужна даже в августе, а цену такси до Гергети
    или Джуты оговаривайте до посадки.
  route: >-
    Из Тбилиси на север по Военно-Грузинской дороге (E117, национальная трасса S3) через Мцхету, Жинвали,
    Ананури, Пасанаури и Гудаури, через Крестовый перевал (2379 м) и вниз через Коби до Степанцминды:
    157 км, около трёх часов. Асфальт на всём пути; главный тормоз — фуры, идущие к погранпереходу Ларс,
    примерно в 12 км к северу от посёлка. Заправьтесь в Пасанаури или Гудаури. С поздней весны до осени
    хватит машины эконом-класса. Зимой нужны зимние шины и цепи в багажнике: сильный снегопад может закрыть
    перевал на часы или дни, поэтому перед выездом из Тбилиси проверьте, открыта ли дорога.
fa:
  name: استپانتسمیندا (کازبگی)
  short: >-
    شهرکی مرتفع کنار رود ترک و زادگاه الکساندر کازبگی، با مخروط سپید کازبک بر فراز بام‌ها؛ همهٔ راه‌های
    خه‌وی از اینجا آغاز می‌شود.
  body: >-
    **در استپانتسمیندا لازم نیست دنبال کازبک بگردید؛ همین که پا از در بیرون بگذارید، خودش شما را پیدا
    می‌کند.**


    شهر در ارتفاع ۱,۷۴۰ متر کنار رود ترک نشسته است، ۱۵۷ کیلومتر شمال تفلیس، بر جادهٔ نظامی گرجستان و حدود
    ۱۲ کیلومتر مانده به مرز روسیه. در صبحی صاف از میدان اصلی به غرب نگاه کنید: زمین در یک خیز بیش از سه
    کیلومتر بالا می‌رود؛ نخست بلندیِ کلیسای تثلیث گرگتی، سپس یخچال‌ها و آنگاه قلهٔ ۵,۰۵۴ متری.


    نام شهر یعنی «استپان قدیس». روایت است که راهبی به نام استپان اینجا کنار جاده خلوتگاهی ساخت و روستاییان
    را ترغیب کرد کمی به جنوب کوچ کنند، دور از مسیر بهمن‌ها. در اواخر سدهٔ هجدهم، خاندان چوپیکاشویلی از
    مسافران باج راه می‌گرفتند. وقتی روسیه پادشاهی گرجستان را در خود فرو برد و کوه‌نشینان بر آن شوریدند،
    ارباب محلی، گابریل چوپیکاشویلی، جانب امپراتوری را گرفت، افسر روس شد و نام خانوادگی کازبگی را برگزید،
    و روستا هم کازبگی خوانده شد. شوروی‌ها این نام را در ۱۹۲۵ رسمی کردند؛ نام کهن در ۲۰۰۶ بازگشت و مردم
    اینجا هنوز هر دو را به کار می‌برند.


    نوهٔ گابریل، الکساندر کازبگی، در همین شهر به دنیا آمد. پس از تحصیل در تفلیس، سن‌پترزبورگ و مسکو به
    زادگاهش بازگشت و چوپانی پیشه کرد تا زندگی کوهستان را از نزدیک بشناسد. رمان او «پدرکش» شخصیت کوبا را
    آفرید، یاغی کوهستانی‌ای که یوسف جوگاشویلی جوان، استالینِ آینده، نامش را نام مستعار انقلابی خود کرد.
    وقتی نویسنده در تفلیس درگذشت، تابوتش را از گردنهٔ جواری به استپانتسمیندا بازگرداندند؛ خانهٔ کودکی‌اش
    امروز موزه است.


    امروز این شهر پایگاه سراسر خه‌وی است. زود بیایید. تا نیمروز کوه معمولاً ابری بر سر کشیده است و استپانتسمیندا
    دوباره شهری معمولی می‌شود.
  tip: >-
    به‌جای سفر یک‌روزه، شب را اینجا بمانید: قله در نخستین ساعت‌های پس از طلوع از همه وقت واضح‌تر دیده
    می‌شود و اغلب تا ظهر پنهان می‌شود. مهمان‌خانه‌ها را برای ژوئیه و اوت از مدت‌ها پیش رزرو کنید. خودپردازها،
    داروخانه و سوپرمارکت‌ها گرداگرد میدان اصلی‌اند، پس پیش از رفتن به جوتا، سنو یا تروسو، که امکانات اندکی
    دارند یا هیچ ندارند، خرید کنید. خانه‌موزهٔ الکساندر کازبگی در سال‌های اخیر در دست مرمت بوده است؛ پیش
    از آنکه برنامهٔ روزتان را بر آن بچینید، مطمئن شوید باز است. در ارتفاع ۱,۷۴۰ متر هوا ظرف یک ساعت دگرگون
    می‌شود، پس حتی در اوت یک لایهٔ گرم بردارید، و کرایهٔ تاکسی تا گرگتی یا جوتا را پیش از سوار شدن طی
    کنید.
  route: >-
    جادهٔ نظامی گرجستان (E117، راه ملی S3) را از تفلیس به سوی شمال بروید، از متسختا، ژینوالی، آنانوری،
    پاساناوری و گودائوری بگذرید، گردنهٔ جواری را در ارتفاع ۲,۳۷۹ متر پشت سر بگذارید و از راه کوبی به استپانتسمیندا
    پایین بیایید: ۱۵۷ کیلومتر، حدود سه ساعت. سراسر راه آسفالت است؛ آنچه واقعاً سرعت را می‌گیرد، کامیون‌هایی
    است که به گذرگاه مرزی لارسی، حدود ۱۲ کیلومتر شمال شهر، می‌روند. در پاساناوری یا گودائوری باک را پر
    کنید. از اواخر بهار تا پاییز خودروی اقتصادی کافی است. در زمستان لاستیک زمستانی و زنجیر در صندوق لازم
    است: برف سنگین می‌تواند گردنه را ساعت‌ها یا روزها ببندد، پس پیش از ترک تفلیس وضعیت جاده را بررسی کنید.
he:
  name: סטפנצמינדה (קזבגי)
  short: >-
    עיירה גבוהה על נהר הטרק, עיר הולדתו של הסופר אלכסנדר קזבגי: מעל גגותיה מתנשא החרוט הלבן של קזבק, וממנה
    יוצאות כל הדרכים בחבי.
  body: >-
    **בסטפנצמינדה אין צורך לחפש את קזבק; הוא מוצא אתכם ברגע שאתם יוצאים מהדלת.**


    העיירה שוכנת בגובה 1,740 מטר על נהר הטרק, 157 ק"מ צפונית לטביליסי, על הכביש הצבאי הגאורגי, כ-12 ק"מ
    לפני גבול רוסיה. הביטו מערבה מהכיכר המרכזית בבוקר בהיר, והקרקע מטפסת יותר משלושה קילומטרים בתנופה
    אחת: תחילה הגבעה התלולה של כנסיית השילוש בגרגטי, אחר כך הקרחונים, ולבסוף הפסגה בגובה 5,054 מטר.


    השם פירושו "סטפן הקדוש". לפי המסורת, נזיר בשם סטפן הקים כאן תא התבודדות לצד הדרך ושכנע את בני הכפר
    לעבור מעט דרומה, הרחק מנתיב מפולות השלגים. בסוף המאה ה-18 גבו בני משפחת צ'ופיקשווילי מכס מעוברי הדרך.
    כשרוסיה בלעה את הממלכה הגאורגית ובני ההרים מרדו בה, האדון המקומי, גבריאל צ'ופיקשווילי, צידד באימפריה,
    מונה לקצין רוסי ואימץ את שם המשפחה קזבגי, וגם הכפר נקרא מאז קזבגי. הסובייטים הפכו את השם לרשמי ב-1925;
    השם הישן חזר ב-2006, והמקומיים משתמשים עד היום בשניהם.


    נכדו של גבריאל, אלכסנדר קזבגי, נולד בעיירה. אחרי לימודים בטביליסי, בסנקט פטרבורג ובמוסקבה חזר הביתה
    ועבד כרועה צאן כדי להכיר את חיי ההרים ממקור ראשון. ברומן שלו "רוצח האב" ברא את קובה, פורע חוק מן ההרים,
    שאת שמו אימץ הצעיר יוסף ג'וגשווילי, לימים סטלין, ככינוי מחתרתי. כשהסופר מת בטביליסי, הובא ארונו בחזרה
    מעל מעבר ג'וארי אל סטפנצמינדה, ובית ילדותו שמור בה כיום כמוזיאון.


    כיום העיירה היא הבסיס לכל חבי. בואו מוקדם. עד הצהריים ההר בדרך כלל כבר מושך ענן על ראשו, וסטפנצמינדה
    חוזרת להיות עיירה רגילה.
  tip: >-
    לינו כאן במקום לבוא לטיול יום: הפסגה נראית בבירור הרב ביותר בשעות הראשונות אחרי הזריחה, ועד הצהריים
    היא מוסתרת לעיתים קרובות. הזמינו בתי הארחה ליולי ולאוגוסט זמן רב מראש. הכספומטים, בית המרקחת והסופרמרקטים
    מרוכזים סביב הכיכר המרכזית, לכן הצטיידו לפני שאתם יוצאים לג'וטה, לסנו או לטרוסו, שבהן יש מעט מאוד
    או כלום. בית-המוזיאון של אלכסנדר קזבגי היה בשיפוץ בשנים האחרונות; ודאו שהוא פתוח לפני שאתם מתכננים
    סביבו יום שלם. בגובה 1,740 מטר מזג האוויר יכול להתהפך בתוך שעה, לכן קחו שכבה חמה גם באוגוסט, וסכמו
    את מחיר המונית לגרגטי או לג'וטה לפני שאתם עולים.
  route: >-
    סעו מטביליסי צפונה בכביש הצבאי הגאורגי (E117, כביש לאומי S3) דרך מצחתה, ז'ינוואלי, אנאנורי, פסנאורי
    וגודאורי, מעל מעבר ג'וארי בגובה 2,379 מטר ובמורד דרך קובי אל סטפנצמינדה: 157 ק"מ, כשלוש שעות. הכביש
    סלול לכל אורכו; מה שמאט באמת הוא תנועת המשאיות אל מעבר הגבול לרסי, כ-12 ק"מ צפונית לעיירה. תדלקו בפסנאורי
    או בגודאורי. מסוף האביב ועד הסתיו רכב קטן וחסכוני מספיק. בחורף צריך צמיגי חורף ושרשראות בתא המטען:
    שלג כבד עלול לסגור את המעבר לשעות או לימים, לכן בדקו את מצב הדרך לפני שאתם יוצאים מטביליסי.
ar:
  name: ستيبانتسميندا (كازبيغي)
  short: >-
    بلدة عالية على نهر تيريك، مسقط رأس الكاتب ألكسندر كازبيغي، يطلّ مخروط كازبك الأبيض على سطوحها، ومنها
    تبدأ كل طرق خيفي.
  body: >-
    **في ستيبانتسميندا لا حاجة إلى البحث عن كازبك؛ فهو من يجدك لحظة تخطو خارج الباب.**


    تقع البلدة على ارتفاع 1,740 متراً على نهر تيريك، على بعد 157 كم شمال تبليسي، على الطريق العسكري الجورجي،
    وقبل الحدود الروسية بنحو 12 كم. انظر غرباً من الساحة الرئيسية في صباح صافٍ، وسترى الأرض ترتفع أكثر
    من ثلاثة كيلومترات في اندفاعة واحدة: أولاً الربوة التي تعلوها كنيسة الثالوث في غيرغيتي، ثم الأنهار
    الجليدية، ثم القمة البالغة 5,054 متراً.


    ومعنى الاسم «القديس ستيفان». وتقول الرواية إن راهباً يُدعى ستيفان بنى هنا صومعة بجانب الطريق وحثّ
    القرويين على الانتقال قليلاً نحو الجنوب، بعيداً عن مسار الانهيارات الثلجية. وبحلول أواخر القرن الثامن
    عشر كانت أسرة تشوبيكاشفيلي تجبي المكوس من المسافرين. وحين ابتلعت روسيا المملكة الجورجية وثار عليها
    أهل الجبال، وقف السيد المحلي غابرييل تشوبيكاشفيلي إلى جانب الإمبراطورية، فصار ضابطاً روسياً واتخذ
    اسم العائلة كازبيغي، وصارت القرية تُسمّى كازبيغي أيضاً. وجعل السوفييت هذا الاسم رسمياً عام 1925؛ ثم
    عاد الاسم القديم عام 2006، وما زال الناس هنا يستعملون الاسمين.


    وُلد حفيد غابرييل، ألكسندر كازبيغي، في البلدة. وبعد أن درس في تبليسي وسانت بطرسبرغ وموسكو عاد إلى
    دياره وعمل راعياً ليعرف حياة الجبل عن كثب. وفي روايته «قاتل الأب» ابتكر شخصية كوبا، الخارج على القانون
    في الجبال، الذي استعار الشاب يوسف جوغاشفيلي، ستالين لاحقاً، اسمه اسماً حركياً ثورياً. وحين توفي الكاتب
    في تبليسي، حُمل نعشه عائداً عبر ممر جفاري إلى ستيبانتسميندا، حيث يُحفظ بيت طفولته متحفاً.


    واليوم البلدة قاعدة خيفي كلها. تعالَ باكراً. فبحلول الظهيرة يكون الجبل في العادة قد سحب غيمة فوق رأسه،
    وتعود ستيبانتسميندا بلدة عادية.
  tip: >-
    بِتْ هنا بدلاً من الاكتفاء برحلة يوم: فالقمة أصفى ما تكون في الساعات الأولى بعد الشروق، وكثيراً ما
    تختفي بحلول الظهر. احجز بيوت الضيافة لشهري يوليو وأغسطس قبل وقت طويل. تتجمع أجهزة الصراف الآلي والصيدلية
    والمتاجر الكبرى حول الساحة الرئيسية، فتزوّد بما تحتاجه قبل التوجه إلى جوتا أو سنو أو تروسو، حيث لا
    يتوفر إلا القليل أو لا شيء. خضع البيت المتحف لألكسندر كازبيغي للترميم في السنوات الأخيرة؛ فتأكد من
    أنه مفتوح قبل أن تبني يومك حوله. على ارتفاع 1,740 متراً قد يتبدّل الطقس في غضون ساعة، فاحمل طبقة دافئة
    حتى في أغسطس، واتفق على أجرة سيارة الأجرة إلى غيرغيتي أو جوتا قبل الركوب.
  route: >-
    اتجه شمالاً من تبليسي على الطريق العسكري الجورجي (E117، الطريق الوطني S3) عبر متسخيتا وجينفالي وأنانوري
    وباسانوري وغوداوري، ثم فوق ممر جفاري على ارتفاع 2,379 متراً ونزولاً عبر كوبي إلى ستيبانتسميندا: 157
    كم، نحو ثلاث ساعات. الطريق معبّد على طوله؛ وما يبطئك حقاً هو حركة الشاحنات المتجهة إلى معبر لارسي
    الحدودي، على بعد نحو 12 كم شمال البلدة. تزوّد بالوقود في باسانوري أو غوداوري. من أواخر الربيع حتى
    الخريف تكفي سيارة اقتصادية. أما في الشتاء فتحتاج إلى إطارات شتوية وسلاسل في صندوق السيارة: فقد يغلق
    الثلج الكثيف الممر لساعات أو أيام، لذا تحقّق من حالة الطريق قبل مغادرة تبليسي.
