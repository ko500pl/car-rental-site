ka:
  name: აჯამეთის აღკვეთილი
  short: რელიქტური მუხნარი და ძელქვის ტყე ბაღდათსა და ზესტაფონს შორის, დაცული 1935 წლიდან.
  body: >-
    **აჯამეთი იმ ტყის ნაშთია, რომელიც ოდესღაც მთელ კოლხეთის დაბლობს ფარავდა.** აღკვეთილი ბაღდათისა და
    ზესტაფონის მუნიციპალიტეტებში, ქუთაისიდან თხუთმეტიოდე კილომეტრში, რიონის მარცხენა შენაკადებს — ყვირილასა
    და ხანისწყალს — შორისაა.


    დაცვა 1935 წელს დაიწყო; 1946 წელს დაემატა ვარციხის მასივი, სპეციალურად ორი მესამეული პერიოდის რელიქტის
    შესანარჩუნებლად:


    - **იმერული მუხა** — საქართველოს წითელ ნუსხაშია შეტანილი, ბუნებაში მხოლოდ ამ დაბლობზეა შემორჩენილი


    - **ძელქვა** — ნელა მზარდი, უკიდურესად მაგარმერქნიანი ხე, რომლის დიდი მასივები კავკასიაში თითქმის
    აღარსად დარჩა


    ტყის საერთო ფართობი ხუთი ათას ჰექტარს უახლოვდება; დენდროფლორაში სამოცამდე სახეობაა, ქვეტყეში კი შქერი,
    ზღმარტლი, ასკილი და კუნელი. წითელ ნუსხაშია აგრეთვე ფასტუხოვის სუროსი, კოლხური თხილი და ლაფანი.


    ფაუნა დაბლობის ტიპურია: შველი, მელა, კვერნა, მაჩვი, ციყვი და ძილგუდა; ჩაწერილია სამოცზე მეტი ფრინველის
    სახეობა, თუმცა მათგან მხოლოდ ოცდაერთი ბუდობს აქ — დანარჩენი გადამფრენი ან მოზამთრეა. ღამურები და თახვი
    ცალკე დაცვის ობიექტია.


    რას ნახავ პრაქტიკულად: ბრტყელი, ჩრდილიანი ტყე მარკირებული ბილიკით, ძალიან მსხვილი მუხის ღეროებით და
    სრული სიჩუმით. ჩანჩქერი, კლდე ან პანორამა აქ არ არის — ეს ბოტანიკური და არა სანახაობრივი ადგილია.
    გაზაფხულზე ქვეტყე ყვავის, შემოდგომაზე კი მუხისა და ძელქვის ფოთოლი განსაკუთრებით ლამაზად წითლდება.


    იმის ახსნა, თუ რატომ იმსახურებს მუხნარი აღკვეთილს, ცალკე უნდა. კოლხეთის დაბლობი ოდესღაც სწორედ ასეთი
    ტყით იყო დაფარული; მისი თითქმის მთელი ფართობი XIX და XX საუკუნეებში სახნავად გაიჩეხა, დაშრობილი ან
    ხე-ტყედ გამოყენებული იქნა, აჯამეთი კი ყველაზე დიდი შემორჩენილი მასივია. იმერული მუხა უბრალოდ ადგილობრივი
    ფორმა არაა — ეს ცალკე ქვესახეობაა ძალიან მცირე გავრცელების არეალით. ძელქვის მერქანი კი იმდენად ფასობდა
    იარაღისა და მშენებლობისთვის, რომ ხე თავისი ისტორიული არეალის უმეტესობიდან ამოიჭრა.
  tip: >-
    ორი საათი ბილიკზე საკმარისია. მიწის ბილიკები ბრტყელია, მაგრამ წვიმის შემდეგ დიდხანს რჩება ტალახი —
    წყალგაუმტარი ფეხსაცმელი გამოგადგება. ზაფხულში ტკიპა და კოღოა: გრძელი შარვალი, დახურული ფეხსაცმელი
    და რეპელენტი. ჩრდილის გამო სიცხეშიც კომფორტულია. ტუალეტი და საინფორმაციო დაფა შესასვლელთანაა, კაფე
    არა — სასმელი და საჭმელი თან წაიღე. ბილიკიდან გადახვევა არ ღირს, ტყე ერთგვაროვანია და ორიენტირი მცირე.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ ზესტაფონამდე, შემდეგ ბაღდათის მიმართულებით — სულ დაახლოებით 205 კმ
    და სამი საათი. აღკვეთილის შესასვლელი მაგისტრალიდან რამდენიმე კილომეტრშია, სოფელ დიმისკენ მიმავალ გზაზე;
    მაჩვენებელი დაფები დაცული ტერიტორიების სააგენტოსია. გზა ბოლომდე ასფალტიანია, ბოლო მონაკვეთი ვიწრო.
    საწვავი ზესტაფონსა და ბაღდათში აიღე. პარკინგი შესასვლელთან უფასოა. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Ajameti Managed Reserve
  short: A relict oak and zelkova forest between Baghdati and Zestaponi, protected since 1935.
  body: >-
    **Ajameti is a remnant of the forest that once covered the whole Colchic lowland.** The reserve lies
    in Baghdati and Zestaponi municipalities, some fifteen kilometres from Kutaisi, between the Kvirila
    and the Khanistskali, both left tributaries of the Rioni.


    Protection began in 1935. The Vartsikhe massif was added in 1946 specifically to preserve two Tertiary
    relicts:


    - the **Imeretian oak**, on the Red List of Georgia and surviving in the wild essentially only on
    this lowland


    - the **Caucasian zelkova**, a slow-growing tree with exceptionally hard timber, whose large stands
    have almost vanished from the Caucasus


    The forest covers close to five thousand hectares. Around sixty woody species have been recorded,
    with an understorey of rhododendron, medlar, sweetbriar and hawthorn. Pastukhov's ivy, Colchic hazel
    and wingnut are also on the Red List.


    The fauna is typical lowland: roe deer, fox, pine marten, badger, squirrel and dormouse. More than
    sixty bird species have been logged, though only twenty-one nest here — the rest are passing through
    or wintering. Bats and the Caucasian otter are separately protected.


    What you actually see: flat, shaded woodland with a marked trail, some very thick oak trunks, and
    complete silence. There is no waterfall, no cliff and no panorama; this is a botanical site rather
    than a scenic one. In spring the understorey flowers, and in autumn the oak and zelkova colour unusually
    well.


    Why a forest of oaks deserves a reserve takes some explaining. The Colchic lowland was once covered
    in exactly this kind of woodland; nearly all of it was cleared for farming, drained, or cut for timber
    during the 19th and 20th centuries, and Ajameti is the largest block left. The Imeretian oak is not
    simply a local form but a distinct subspecies with a very small world range. Zelkova timber, meanwhile,
    was so prized for tools and building that the tree was cut out of most of its historical territory.
  tip: >-
    Two hours on the trail is enough. The earth paths are level but hold mud for a long time after rain,
    so waterproof shoes help. In summer there are ticks and mosquitoes: long trousers, closed shoes and
    repellent. The shade makes it comfortable even in heat. There is a toilet and an information board
    at the entrance but no cafe, so bring food and water. Do not wander off the trail — the forest is
    uniform and there are few landmarks.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then follow signs towards Baghdati — about 205 km in
    all, three hours. The reserve entrance is a few kilometres off the main road, on the way to the village
    of Dimi, and is marked with the boards of the Agency of Protected Areas. The road is asphalt throughout,
    narrowing on the last stretch. Refuel in Zestaponi or Baghdati. Parking at the entrance is free. An
    economy car is sufficient.
ru:
  name: Аджаметский заказник
  short: Реликтовый лес из имеретинского дуба и дзелквы между Багдати и Зестафони, охраняемый с 1935 года.
  body: >-
    **Аджамети — остаток леса, который когда-то покрывал всю Колхидскую низменность.** Заказник расположен
    в Багдатском и Зестафонском муниципалитетах, километрах в пятнадцати от Кутаиси, между Квирилой и
    Ханисцкали — левыми притоками Риони.


    Охрана началась в 1935 году. В 1946-м добавили Варцихский массив, специально ради двух третичных реликтов:


    - **имеретинский дуб** — в Красном списке Грузии, в дикой природе сохранился по сути только на этой
    низменности


    - **дзелква** — медленно растущее дерево с исключительно твёрдой древесиной, крупные массивы которого
    на Кавказе почти исчезли


    Лес занимает около пяти тысяч гектаров. Зафиксировано порядка шестидесяти древесных видов, подлесок
    — рододендрон, мушмула, шиповник, боярышник. В Красный список входят также плющ Пастухова, колхидская
    лещина и лапина.


    Фауна типично низменная: косуля, лиса, лесная куница, барсук, белка, соня. Отмечено больше шестидесяти
    видов птиц, но гнездится здесь только двадцать одна — остальные пролётные или зимующие. Летучие мыши
    и кавказская выдра охраняются отдельно.


    Что вы увидите на деле: ровный тенистый лес с размеченной тропой, очень толстые дубовые стволы и полную
    тишину. Ни водопада, ни скалы, ни панорамы — это ботаническое место, а не видовое. Весной цветёт подлесок,
    осенью дуб и дзелква окрашиваются особенно красиво.


    Почему дубовый лес заслуживает заказника, стоит объяснить отдельно. Колхидская низменность когда-то
    была покрыта именно таким лесом; почти всё это в XIX и XX веках распахали, осушили или вырубили на
    древесину, и Аджамети — самый крупный сохранившийся массив. Имеретинский дуб не просто местная форма,
    а отдельный подвид с очень небольшим мировым ареалом. Древесина же дзелквы так ценилась для инструментов
    и строительства, что дерево вырубили почти на всей его исторической территории.
  tip: >-
    Двух часов на тропе достаточно. Грунтовые дорожки ровные, но после дождя долго держат грязь, так что
    непромокаемая обувь пригодится. Летом есть клещи и комары: длинные брюки, закрытая обувь, репеллент.
    Благодаря тени комфортно даже в жару. У входа есть туалет и информационный щит, кафе нет — еду и воду
    берите с собой. С тропы лучше не сходить: лес однообразный, ориентиров мало.
  route: >-
    Из Тбилиси по E60 на запад до Зестафони, затем по указателям на Багдати — всего около 205 км, три
    часа. Вход в заказник в нескольких километрах от трассы, по дороге к селу Дими, отмечен щитами Агентства
    защищённых территорий. Дорога асфальтированная на всём протяжении, на последнем отрезке узкая. Заправляйтесь
    в Зестафони или Багдати. Парковка у входа бесплатная. Машины эконом-класса достаточно.
fa:
  name: قرقگاه آجامتی
  short: جنگل بازماندهٔ بلوط و زلکوا میان باغداتی و زستافونی، که از ۱۹۳۵ حفاظت می‌شود.
  body: >-
    **آجامتی بازمانده‌ای از جنگلی است که زمانی تمام پست‌دشت کلخی را می‌پوشاند.** قرقگاه در شهرستان‌های
    باغداتی و زستافونی و در حدود پانزده کیلومتری کوتایسی، میان رودهای کویریلا و خانیس‌تسکالی — هر دو شاخهٔ
    چپ ریونی — قرار دارد.


    حفاظت از ۱۹۳۵ آغاز شد. در ۱۹۴۶ تودهٔ وارتسیخه افزوده شد، به‌ویژه برای نگهداری دو بازماندهٔ دوران سوم
    زمین‌شناسی:


    - **بلوط ایمرتی**، در فهرست سرخ گرجستان، که در طبیعت عملاً تنها در همین پست‌دشت مانده است


    - **زلکوای قفقازی**، درختی کندرشد با چوبی به‌غایت سخت، که توده‌های بزرگش از قفقاز تقریباً ناپدید شده‌اند


    جنگل نزدیک پنج هزار هکتار را می‌پوشاند. حدود شصت گونهٔ چوبی ثبت شده و زیراشکوب آن از خرزهره‌سان کوهی،
    ازگیل، نسترن وحشی و زالزالک است. پیچک پاستوخوف، فندق کلخی و لرگ نیز در فهرست سرخ‌اند.


    جانوران، جانوران معمول پست‌دشت‌اند: شوکا، روباه، سمور جنگلی، گورکن، سنجاب و خوابگرد. بیش از شصت گونهٔ
    پرنده ثبت شده، اما تنها بیست‌ویک گونه اینجا لانه می‌سازد و بقیه در گذر یا زمستان‌گذران‌اند. خفاش‌ها
    و سمور آبی قفقازی جداگانه حفاظت می‌شوند.


    آنچه واقعاً می‌بینید: جنگلی هموار و سایه‌دار با مسیری علامت‌گذاری‌شده، تنه‌های بسیار ستبر بلوط، و
    سکوتی کامل. نه آبشاری هست، نه صخره‌ای، نه چشم‌اندازی؛ اینجا جایی گیاه‌شناختی است نه منظره‌ای. بهار
    زیراشکوب گل می‌دهد و پاییز رنگ بلوط و زلکوا به‌طور غیرمعمول زیبا می‌شود.


    اینکه چرا جنگلی از بلوط سزاوار قرقگاه است، توضیح می‌خواهد. پست‌دشت کلخی زمانی دقیقاً از همین نوع جنگل
    پوشیده بود؛ تقریباً همه‌اش در سده‌های نوزدهم و بیستم برای کشاورزی پاک شد یا زهکشی گردید یا برای الوار
    بریده شد، و آجامتی بزرگ‌ترین تودهٔ باقی‌مانده است. بلوط ایمرتی صرفاً گونه‌ای محلی نیست، بلکه زیرگونه‌ای
    متمایز با گسترهٔ جهانی بسیار کوچک است. چوب زلکوا نیز چنان برای ابزار و ساختمان ارزشمند بود که درخت
    را از بیشتر قلمرو تاریخی‌اش بریدند.
  tip: >-
    دو ساعت روی مسیر کافی است. راه‌های خاکی هموارند اما پس از باران مدتی طولانی گِل نگه می‌دارند، پس کفش
    ضدآب کمک می‌کند. تابستان کنه و پشه هست: شلوار بلند، کفش بسته و دورکننده. سایه باعث می‌شود حتی در گرما
    راحت باشید. کنار ورودی سرویس بهداشتی و تابلوی اطلاعات هست اما کافه نه، پس خوراک و آب همراه ببرید.
    از مسیر بیرون نروید؛ جنگل یکدست است و نشانهٔ راهنما کم.
  route: >-
    از تفلیس با بزرگراه E60 به غرب تا زستافونی، سپس تابلوهای باغداتی را دنبال کنید — روی‌هم حدود ۲۰۵ کیلومتر
    و سه ساعت. ورودی قرقگاه چند کیلومتر با جادهٔ اصلی فاصله دارد، در راه روستای دیمی، و با تابلوهای سازمان
    مناطق حفاظت‌شده مشخص است. جاده تا انتها آسفالت است و در بخش پایانی باریک می‌شود. سوخت را در زستافونی
    یا باغداتی بگیرید. پارکینگ ورودی رایگان است. خودروی اقتصادی کافی است.
he:
  name: שמורת אג'אמטי
  short: יער אלון וזלקובה שריד בין בגדאטי לזסטפוני, מוגן מאז 1935.
  body: >-
    **אג'אמטי הוא שריד היער שכיסה פעם את כל השפלה הקולכית.** השמורה נמצאת בנפות בגדאטי וזסטפוני, כחמישה־עשר
    ק״מ מקוטאיסי, בין נהרות הקווירילה והחניסצקאלי, שניהם יובלים שמאליים של הריוני.


    ההגנה החלה ב-1935. ב-1946 נוסף גוש וארציחה, במיוחד כדי לשמר שני שרידים מן העידן השלישוני:


    - **אלון אימרתי**, שברשימה האדומה של גאורגיה ושורד בטבע כמעט רק בשפלה הזאת


    - **זלקובה קווקזית**, עץ אטי־גדילה בעל עץ קשה במיוחד, שחורשותיו הגדולות כמעט נעלמו מן הקווקז


    היער משתרע על כמעט חמשת אלפים הקטרים. תועדו כשישים מיני עץ, ותת־היער כולל רודודנדרון, שסק, ורד בר
    ועוזרר. גם קיסוס פסטוחוב, לוז קולכי ואגוזית נמצאים ברשימה האדומה.


    בעלי החיים אופייניים לשפלה: יעל אירופי, שועל, נמייה, גירית, סנאי ונמנמן. תועדו יותר משישים מיני ציפורים,
    אך רק עשרים ואחד מקננים כאן — היתר חולפים או חורפים. עטלפים ולוטרה קווקזית מוגנים בנפרד.


    מה באמת רואים: יער שטוח ומוצל עם שביל מסומן, גזעי אלון עבים מאוד ושקט מוחלט. אין מפל, אין מצוק ואין
    פנורמה; זהו אתר בוטני ולא נופי. באביב פורח תת־היער, ובסתיו האלון והזלקובה מצהיבים ומאדימים יפה במיוחד.


    מדוע יער אלונים ראוי לשמורה — זה דורש הסבר. השפלה הקולכית הייתה מכוסה פעם בדיוק ביער כזה; כמעט כולו
    נכרת לחקלאות, יובש או נגדע לעצים במאות ה-19 וה-20, ואג'אמטי הוא הגוש הגדול ביותר שנותר. אלון אימרתי
    אינו סתם צורה מקומית אלא תת־מין נבדל בעל תפוצה עולמית זעירה. עץ הזלקובה, מצדו, היה יקר ערך כל כך לכלים
    ולבנייה עד שהעץ נכרת מרוב שטח תפוצתו ההיסטורי.
  tip: >-
    שעתיים על השביל מספיקות. שבילי העפר מישוריים אך מחזיקים בוץ זמן רב אחרי גשם, ולכן נעליים אטומות עוזרות.
    בקיץ יש קרציות ויתושים: מכנסיים ארוכים, נעליים סגורות ותכשיר הרחקה. הצל הופך את המקום נוח גם בחום.
    בכניסה יש שירותים ולוח מידע אך אין בית קפה, אז קחו אוכל ומים. אל תסטו מן השביל — היער אחיד ונקודות
    ציון מעטות.
  route: >-
    מטביליסי בכביש E60 מערבה עד זסטפוני, ואז לפי השילוט לבגדאטי — כ-205 ק״מ בסך הכול, שלוש שעות. הכניסה
    לשמורה כמה ק״מ מן הכביש הראשי, בדרך לכפר דימי, ומסומנת בשלטי רשות השטחים המוגנים. הכביש סלול לכל אורכו
    ומצטמצם במקטע האחרון. תדלקו בזסטפוני או בבגדאטי. החניה בכניסה חינם. רכב חסכוני מספיק.
ar:
  name: محمية أجاميتي
  short: غابة بلوط وزلكوفا متبقية بين باغداتي وزستافوني، محمية منذ عام 1935.
  body: >-
    **أجاميتي بقية من الغابة التي كانت تغطي سهل كولخيس المنخفض كله.** تقع المحمية في بلديتي باغداتي وزستافوني
    على بعد نحو خمسة عشر كيلومتراً من كوتايسي، بين نهري كفيريلا وخانيستسكالي، وكلاهما رافد أيسر لنهر ريوني.


    بدأت الحماية عام 1935. وفي 1946 أُضيفت كتلة فارتسيخه خصيصاً لحفظ بقيتين من العصر الثلاثي:


    - **بلوط إيميريتي**، المدرج في القائمة الحمراء لجورجيا، ولم يبقَ في البرية عملياً إلا في هذا السهل


    - **الزلكوفا القوقازية**، شجرة بطيئة النمو بخشب بالغ الصلابة، اختفت مجاميعها الكبيرة من القوقاز تقريباً


    تغطي الغابة قرابة خمسة آلاف هكتار. وسُجل نحو ستين نوعاً خشبياً، وطبقة الشجيرات فيها الرودودندرون والزعرور
    والنسرين والزعرور الشائك. كما يُدرج لبلاب باستوخوف والبندق الكولخي وشجر الجناح في القائمة الحمراء.


    والحيوانات نموذجية لسهول المنطقة: الوعل الأوروبي والثعلب ودلق الصنوبر والغرير والسنجاب والزغبة. وسُجّل
    أكثر من ستين نوعاً من الطيور، لكن واحداً وعشرين فقط يعشش هنا، والبقية عابرة أو مشتّية. أما الخفافيش
    وقضاعة القوقاز فمحميتان على حدة.


    ما تراه فعلاً: غابة مستوية ظليلة بمسار مُعلَّم، وجذوع بلوط بالغة الغلظ، وصمت تام. لا شلال ولا جرف
    ولا بانوراما؛ فهذا موقع نباتي لا مشهدي. في الربيع تزهر الشجيرات، وفي الخريف يتلون البلوط والزلكوفا
    بجمال غير معتاد.


    لماذا تستحق غابة بلوط محمية؟ الأمر يحتاج إلى شرح. كان سهل كولخيس المنخفض مغطى ذات يوم بهذا النوع من
    الغابات تحديداً؛ ثم أُزيل معظمه للزراعة أو جُفّف أو قُطع خشباً خلال القرنين التاسع عشر والعشرين، وأجاميتي
    أكبر كتلة متبقية. وبلوط إيميريتي ليس مجرد صورة محلية بل نويع متمايز بمدى عالمي ضيق جداً. أما خشب الزلكوفا
    فكان مرغوباً للأدوات والبناء إلى حد أن الشجرة اقتُلعت من معظم نطاقها التاريخي.
  tip: >-
    ساعتان على المسار تكفيان. الدروب الترابية مستوية لكنها تحتفظ بالطين طويلاً بعد المطر، فالحذاء المقاوم
    للماء مفيد. وفي الصيف قراد وبعوض: سروال طويل وحذاء مغلق وطارد حشرات. ويجعل الظل المكان مريحاً حتى
    في الحر. عند المدخل دورة مياه ولوحة معلومات لكن لا مقهى، فاحمل طعاماً وماءً. ولا تخرج عن المسار، فالغابة
    متشابهة والمعالم قليلة.
  route: >-
    من تبليسي على الطريق E60 غرباً حتى زستافوني، ثم اتبع لافتات باغداتي — نحو 205 كم إجمالاً وثلاث ساعات.
    مدخل المحمية على بعد كيلومترات قليلة من الطريق الرئيسي في اتجاه قرية ديمي، وعليه لافتات وكالة المناطق
    المحمية. الطريق معبّد على امتداده ويضيق في مقطعه الأخير. تزوّد بالوقود في زستافوني أو باغداتي. والوقوف
    عند المدخل مجاني. وتكفي سيارة اقتصادية.
