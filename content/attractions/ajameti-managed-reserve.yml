ka:
  name: აჯამეთის აღკვეთილი
  short: >-
    დაბლობის დიდი მუხნარი ბაღდათსა და ზესტაფონს შორის — 1935 წლიდან დაცული, რელიქტური იმერული მუხისა და
    ძელქვის თავშესაფარი.
  body: >-
    **აჯამეთი ის მუხნარია, რომელსაც 1935 წელს ცული ჩამოაშორეს.**


    ქუთაისიდან თხუთმეტიოდე კილომეტრში, ბაღდათისა და ზესტაფონის მუნიციპალიტეტებში, აღკვეთილი დაბლობის ტყის
    ორ მასივს აერთიანებს. უფრო დიდი, თვითონ აჯამეთის მუხნარი, 3742 ჰექტარზე ყვირილასა და ხანისწყალს —
    რიონის ორ მარცხენა შენაკადს — შორის გადაჭიმულა. ვარციხის მასივი, 1106 ჰექტარი ხანისწყლის მარცხენა
    ნაპირზე, 1946 წელს დაემატა, რათა მესამეული პერიოდის ორი რელიქტი გადაერჩინათ: იმერული მუხა და ძელქვა.
    ორივე დღეს საქართველოს წითელ ნუსხაშია.


    აქ თითქმის ყველაფერს მუხა განაგებს: 4723 ჰექტარი მუხნარია, რცხილნარი კი სულ რამდენიმე ნაკვეთს იკავებს.
    ზოგი ხე 120–200 წლისაა — ნაცრისფერი, ღრმად დაღარული ტანით, ვარჯი კი სადღაც მაღლა იკვრება. ქვეშ სამოცამდე
    მერქნიანი სახეობა ხარობს — შქერი, ზღმარტლი, ასკილი, კუნელი, — იშვიათთა შორის კი პასტუხოვის სურო, კოლხური
    თხილი, თელადუმა და ლაფანია.


    ტყე უფრო მდუმარეა, ვიდრე ცარიელი. აქ შველი, მელა, კვერნა, მაჩვი, ციყვი და ძილგუდა ბინადრობს. სამოცზე
    მეტი ფრინველის სახეობაა აღრიცხული, თუმცა მუხნარში მხოლოდ 21 ბუდობს — დანარჩენი გადამფრენი ან მოზამთრეა.
    ნესტიან კიდეებზე ჩვეულებრივი და წყლის ანკარა ნადირობს, წითური მეღამურა და კავკასიური წავი კი ცალკე
    დაცვის ქვეშაა.


    ხედს ნუ ელით. აქ არც ჩანჩქერია, არც კლდე, არც მწვერვალი — მხოლოდ სწორი მიწა, შუქ-ჩრდილით აჭრელებული,
    და მუხების დიდი მოთმინება. აჯამეთი არაფერს თამაშობს. ის უბრალოდ ტყედ რჩება — იმერეთის დაბლობზე კი
    ეს დღეს იშვიათი რამაა.
  tip: >-
    ფეხით ორი საათი საკმარისია. მიწა სწორია, მაგრამ წვიმის შემდეგ ბილიკებზე ტალახი დიდხანს დგას — წყალგაუმტარი
    ფეხსაცმელი ჩაიცვით. გვიანი გაზაფხულიდან ტკიპა და კოღო ჩნდება: გრძელი შარვალი, დახურული ფეხსაცმელი,
    რეპელენტი. ვარჯის ჩრდილში ივლისშიც გრილა. წყალი და საჭმელი თან იქონიეთ — ტყისპირას კაფესა და მაღაზიას
    ნუ დაეყრდნობით. ბილიკიდან ნუ გადაუხვევთ: მუხა მუხას ჰგავს და ორიენტირი ცოტაა. ჩიტების გალობისა და
    ველობების კიდეებთან შველის სანახავად საუკეთესო დრო ადრიანი დილაა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონამდე (დაახლოებით 186 კმ), იქიდან კი შ54-ით
    ბაღდათის მიმართულებით. ტყე ამ გზიდან რამდენიმე კილომეტრში იწყება; ვიწრო სოფლის გზებზე დაცული ტერიტორიების
    სააგენტოს მაჩვენებლებს მიჰყევით. სულ დაახლოებით 205 კმ და სამი საათია. გზა ბოლომდე ასფალტიანია, ბოლო
    მონაკვეთზე — ვიწრო და დაკერებული. საწვავი ზესტაფონში ან ბაღდათში ჩაასხით. მანქანას ტყისპირას, სადაც
    ადგილს იპოვით, დააყენებთ. ეკონომ-კლასი სრულიად საკმარისია; ძლიერი წვიმის შემდეგ ბოლო მონაკვეთზე ნელა
    იარეთ.
en:
  name: Ajameti Managed Reserve
  short: >-
    A great lowland oak wood between Baghdati and Zestaponi, protected since 1935 and a refuge for the
    relict Imeretian oak and zelkova.
  body: >-
    **Ajameti is the oak wood from which, in 1935, Georgia took the axe away.**


    Fifteen kilometres from Kutaisi, in the municipalities of Baghdati and Zestaponi, the reserve joins
    two blocks of lowland forest. The larger, the Ajameti oak wood proper, covers 3,742 hectares between
    the Kvirila and the Khanistskali, both left-bank tributaries of the Rioni. The Vartsikhe massif, 1,106
    hectares on the left bank of the Khanistskali, was added in 1946 to save two survivors of the Tertiary:
    the Imeretian oak and the zelkova, both now on Georgia's Red List.


    Oak rules almost everything here: some 4,723 hectares are oak forest, with only small patches of hornbeam.
    Some trees are 120 to 200 years old, their trunks grey and deeply furrowed, the canopy closing high
    overhead. Beneath them grow about sixty woody species, among them rhododendron, medlar, sweetbriar
    and hawthorn, while the rarities include Pastukhov's ivy, Colchic hazel, wych elm and wingnut.


    The wood is quieter than it is empty. Roe deer, foxes, pine martens, badgers, squirrels and dormice
    live here. More than sixty bird species have been recorded, though only 21 nest in the oaks; the rest
    pass through or come for the winter. Grass snakes and dice snakes hunt along the damp margins, and
    noctule bats and the Caucasian otter are protected in their own right.


    Do not come for a view. There is no waterfall, no cliff, no summit: only level ground, dappled light
    and the long patience of oaks. Ajameti performs nothing. It simply goes on being a forest, and in
    lowland Imereti that has become a rare thing.
  tip: >-
    Two hours on foot is plenty. The ground is flat, but earth paths hold mud long after rain, so wear
    waterproof shoes. From late spring ticks and mosquitoes are out: long trousers, closed shoes and repellent.
    The canopy keeps it cool even in July. Bring water and food, and do not count on a café or shop at
    the forest edge. Stay on the paths: one oak looks much like the next, and landmarks are few. Early
    morning is best for birdsong and for roe deer at the edges of clearings.
  route: >-
    From Tbilisi follow the S1 (E60) west to Zestaponi (about 186 km), then take the Sh54 towards Baghdati.
    The forest begins a few kilometres off this road; follow the Agency of Protected Areas signs along
    narrow local lanes. In all it is about 205 km and three hours. The road is asphalt all the way, narrowing
    and patched on the final stretch. Fill up in Zestaponi or Baghdati. Parking is informal, wherever
    there is room at the forest edge. An economy car is quite enough; after heavy rain, take the last
    lane slowly.
ru:
  name: Аджаметский заказник
  short: >-
    Огромный низинный дубовый лес между Багдади и Зестафони, охраняемый с 1935 года — приют для реликтовых
    имеретинского дуба и дзельквы.
  body: >-
    **Аджамети — тот самый дубовый лес, от которого в 1935 году Грузия отвела топор.**


    В пятнадцати километрах от Кутаиси, в муниципалитетах Багдади и Зестафони, заказник объединяет два
    массива низинного леса. Больший из них — собственно Аджаметская дубрава — занимает 3742 гектара между
    Квирилой и Ханисцкали, левыми притоками Риони. Массив Варцихе, 1106 гектаров на левом берегу Ханисцкали,
    был добавлен в 1946 году, чтобы спасти двух третичных реликтов — имеретинский дуб и дзелькву, оба
    сегодня в Красной книге Грузии.


    Здесь почти всем распоряжается дуб: около 4723 гектаров — дубовый лес, а на граб приходятся лишь небольшие
    участки. Некоторым деревьям 120–200 лет, их стволы серые и глубоко изборождены, а кроны смыкаются
    высоко над головой. Под ними растёт около шестидесяти видов деревьев и кустарников, среди них рододендрон,
    мушмула, шиповник и боярышник, а к редкостям относятся плющ Пастухова, колхидская лещина, вяз горный
    и лапина.


    Лес не пуст — он просто тих. Здесь живут косули, лисы, лесные куницы, барсуки, белки и лесные сони.
    Отмечено более шестидесяти видов птиц, хотя гнездятся в дубняке лишь 21 из них — остальные пролетают
    или зимуют. Обыкновенные и водяные ужи охотятся по влажным окраинам, а рыжая вечерница и кавказская
    выдра охраняются отдельно.


    Не приезжайте сюда за видами. Здесь нет ни водопада, ни скалы, ни вершины — только ровная земля, пятнистый
    свет и долготерпение дубов. Аджамети ничего не разыгрывает. Он просто остаётся лесом, а в низинной
    Имеретии это стало редкостью.
  tip: >-
    Двух часов пешком вполне достаточно. Земля плоская, но грунтовые тропы долго держат грязь после дождя,
    так что наденьте непромокаемую обувь. С конца весны появляются клещи и комары: длинные брюки, закрытая
    обувь и репеллент. Под кроной прохладно даже в июле. Возьмите воду и еду и не рассчитывайте на кафе
    или магазин на краю леса. Держитесь тропы: один дуб очень похож на другой, а ориентиров мало. Ранним
    утром лучше всего слышится птичье пение и виднеются косули на краю полян.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад до Зестафони (около 186 км), затем по трассе Ш54 в сторону
    Багдади. Лес начинается в нескольких километрах от этой дороги; следуйте указателям Агентства охраняемых
    территорий по узким местным дорогам. Всего около 205 км и три часа. Дорога асфальтирована на всём
    протяжении, но на последнем отрезке она сужается и покрыта заплатками. Заправляйтесь в Зестафони или
    Багдади. Парковка неформальная, где найдётся место на краю леса. Машины эконом-класса вполне достаточно;
    после сильного дождя последний участок проезжайте медленно.
fa:
  name: منطقهٔ حفاظت‌شدهٔ آجامتی
  short: >-
    جنگل بلوطِ بزرگی در دشت، میان باغداتی و زستافونی، از سال ۱۹۳۵ حفاظت‌شده و پناهگاه بلوط ایمرتی و درخت
    آزاد، بازماندگان دوران‌های کهن.
  body: >-
    **آجامتی همان جنگل بلوطی است که در سال ۱۹۳۵ گرجستان تبر را از آن دور کرد.**


    پانزده کیلومتر دورتر از کوتایسی، در بخش‌های باغداتی و زستافونی، این منطقهٔ حفاظت‌شده دو بخش از جنگل
    دشتی را به هم می‌پیوندد. بزرگ‌تر آن، خود بلوطستان آجامتی، ۳۷۴۲ هکتار میان کویریلا و خانیستسکالی، دو
    شاخهٔ چپ رود ریونی، را در بر می‌گیرد. توده‌ی وارتسیخه، ۱۱۰۶ هکتار بر کناره‌ی چپ خانیستسکالی، در سال
    ۱۹۴۶ افزوده شد تا دو بازماندهٔ دوران سوم زمین‌شناسی نجات یابند: بلوط ایمرتی و درخت آزاد، که هر دو
    امروز در فهرست سرخ گرجستان جای دارند.


    این‌جا تقریباً همه‌چیز را بلوط فرمان می‌دهد: نزدیک به ۴۷۲۳ هکتار جنگل بلوط است، و ممرز تنها لکه‌های
    کوچکی را در بر می‌گیرد. برخی درختان ۱۲۰ تا ۲۰۰ سال عمر دارند، تنه‌هایشان خاکستری و به‌عمق شیاردار،
    و تاجشان بلند بالای سر به هم می‌پیوندد. زیر آن‌ها نزدیک به شصت گونهٔ چوبی رشد می‌کند، از جمله رودودندرون،
    ازگیل، نسترن وحشی و زالزالک؛ و از میان گونه‌های نادر، پیچک پاستوخوف، فندق کلخیدی، ملچ و لرگ را می‌توان
    یافت.


    این جنگل بیش از آن‌که خالی باشد، آرام است. شوکا، روباه، سمور جنگلی، گورکن، سنجاب و خوابک این‌جا زندگی
    می‌کنند. بیش از شصت گونهٔ پرنده ثبت شده است، اگرچه تنها ۲۱ گونه در بلوطستان آشیانه می‌سازند - باقی
    می‌گذرند یا زمستان را در این‌جا می‌گذرانند. مار چمنی و مار آبیِ شطرنجی در کناره‌های نمناک شکار می‌کنند،
    و خفاش جنگلی معمولی و شنگ قفقازی هر دو به‌طور جداگانه حفاظت می‌شوند.


    به‌قصد چشم‌انداز نیایید. این‌جا نه آبشاری هست، نه صخره‌ای، نه قله‌ای - تنها زمینی هموار، نوری خال‌خال،
    و بردباری دیرینهٔ بلوط‌ها. آجامتی هیچ نمایشی برپا نمی‌کند. تنها به جنگل‌بودن ادامه می‌دهد، و در دشت‌های
    ایمرتی این خود چیزی نادر شده است.
  tip: >-
    دو ساعت پیاده‌روی کاملاً کافی است. زمین هموار است، اما مسیرهای خاکی مدت‌ها پس از باران گِلی می‌مانند،
    پس کفش ضدآب بپوشید. از اواخر بهار کنه و پشه پیدا می‌شوند: شلوار بلند، کفش بسته و دافع حشرات. زیر تاج
    درختان حتی در ژوئیه هم خنک است. آب و غذا همراه داشته باشید و روی کافه یا مغازه‌ای در حاشیهٔ جنگل حساب
    نکنید. در مسیر بمانید: بلوط‌ها بسیار شبیه هم‌اند و نشانه‌ها کم. صبح زود بهترین زمان برای شنیدن آواز
    پرندگان و دیدن شوکاها در حاشیهٔ فضاهای باز جنگل است.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب تا زستافونی بروید (نزدیک به ۱۸۶ کیلومتر)، سپس از راه Sh54
    به سوی باغداتی ادامه دهید. جنگل چند کیلومتر آن‌سوتر از این راه آغاز می‌شود؛ تابلوهای آژانس مناطق حفاظت‌شده
    را در راه‌های محلی و باریک دنبال کنید. در کل نزدیک به ۲۰۵ کیلومتر و سه ساعت راه است. جاده سراسر آسفالت
    است و در بخش آخر باریک‌تر و وصله‌دار می‌شود. در زستافونی یا باغداتی سوخت‌گیری کنید. پارکینگ غیررسمی
    است؛ هر جا در حاشیهٔ جنگل جایی یافتید. یک خودروی اقتصادی کاملاً کافی است؛ پس از باران سخت، بخش آخر
    را آهسته برانید.
he:
  name: שמורת אג'מטי המנוהלת
  short: יער אלונים אדיר בשפלה, בין בגדאטי לזסטפוני, מוגן מ-1935 ומקום מפלט לאלון האימרתי ולזלקובה השרידיים.
  body: >-
    **אג'מטי הוא יער האלונים שממנו, ב-1935, הרחיקה גאורגיה את הגרזן.**


    חמישה-עשר קילומטרים מקוטאיסי, במחוזות בגדאטי וזסטפוני, מאחדת השמורה שני מקטעים של יער שפלה. הגדול
    מהם, יער האלונים של אג'מטי עצמו, משתרע על 3,742 הקטרים בין קווירילה לחניסצקלי, שניהם יובלי גדה שמאלית
    של ריוני. מסיף וארציחה, 1,106 הקטרים על הגדה השמאלית של חניסצקלי, נוסף ב-1946 כדי להציל שני שרידים
    מהתקופה השלישונית: האלון האימרתי והזלקובה, ששניהם נמצאים כיום ברשימה האדומה של גאורגיה.


    כאן שולט האלון על הכול, כמעט: כ-4,723 הקטרים הם יער אלונים, ולקרפינוס יש רק כתמים קטנים. חלק מהעצים
    בני 120-200 שנה, גזעיהם אפורים ומחורצים לעומק, וצמרתם נסגרת גבוה מעל. תחתיהם צומחים כשישים מיני עצים
    ושיחים, בהם רודודנדרון, שסק גרמני, ורד הכלב ועוזרר, ואילו בין הנדירים - קיסוס פסטוחוב, אלסר קולכי,
    בוקיצה הררית ופטרוקריה.


    היער שקט יותר משהוא ריק. כאן חיים אייל הכרמל, שועל, דלק יער, גירית, סנאי ונמנמן. יותר משישים מיני
    ציפורים תועדו, אף שרק 21 מקננים ביער האלונים; השאר עוברים או באים לחורף. נחשי מים אירופיים ונחשי מים
    משובצים צדים בשוליים הלחים, ועטלפי רמשן לילי והלוטרה הקווקזית מוגנים כל אחד בפני עצמו.


    אל תבואו לכאן בשביל נוף. אין כאן מפל, אין צוק, אין פסגה - רק קרקע מישורית, אור מנוקד, וסבלנותם הרבה
    של האלונים. אג'מטי אינו מעלה שום מופע. הוא פשוט ממשיך להיות יער, ובשפלת אימרתי זה הפך לדבר נדיר.
  tip: >-
    שעתיים הליכה מספיקות בהחלט. הקרקע ישרה, אך השבילים העפריים מחזיקים בוץ זמן רב אחרי גשם, כך שנעלו נעליים
    אטומות למים. מסוף האביב מופיעות קרציות ויתושים: מכנסיים ארוכים, נעליים סגורות ותרסיס דוחה. הצמרת שומרת
    על צל קריר אפילו ביולי. הביאו מים ואוכל, ואל תסמכו על בית קפה או חנות בשולי היער. הישארו בשביל: אלון
    אחד דומה מאוד לאחר, ונקודות ציון מעטות. הבוקר המוקדם הוא הזמן הטוב ביותר לשירת ציפורים ולאיילי הכרמל
    בשולי הקרחות.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה עד זסטפוני (כ-186 ק"מ), ואז בדרך Sh54 לכיוון בגדאטי. היער מתחיל כמה
    קילומטרים מהכביש הזה; עקבו אחר שילוט סוכנות השטחים המוגנים בדרכי כפר צרות. בסך הכול כ-205 ק"מ ושלוש
    שעות. הכביש סלול לכל אורכו, ובמקטע האחרון הוא נעשה צר ומטולא. תדלקו בזסטפוני או בבגדאטי. החניה בלתי-רשמית,
    בכל מקום שיש בו מרחב בשולי היער. רכב חסכוני מספיק בהחלט; אחרי גשם חזק נהגו לאט במקטע האחרון.
ar:
  name: محمية أجاميتي المدارة
  short: >-
    غابة بلّوط عظيمة في السهل بين باغداتي وزستافوني، محمية منذ 1935 وملجأ لبلّوط إيميريتي والزيلكوفا المتبقّيين
    من عصور سحيقة.
  body: >-
    **أجاميتي هي غابة البلّوط التي أبعدت جورجيا الفأس عنها عام 1935.**


    على خمسة عشر كيلومتراً من كوتايسي، في بلديتي باغداتي وزستافوني، تجمع المحمية بين قطعتين من غابات السهل.
    الأكبر، غابة أجاميتي للبلّوط نفسها، تمتد على 3,742 هكتاراً بين نهري كفيريلا وخانيستسكالي، وكلاهما
    رافدان لريوني من الضفة اليسرى. أُضيفت كتلة فارتسيخه، 1,106 هكتارات على الضفة اليسرى لخانيستسكالي،
    عام 1946 لإنقاذ بقيّتين من العصر الثالث: بلّوط إيميريتي والزيلكوفا، وكلاهما اليوم في القائمة الحمراء
    لجورجيا.


    يحكم البلّوط هنا كل شيء تقريباً: نحو 4,723 هكتاراً غابة بلّوط، ولا يحتلّ شجر الشرد إلا بقعاً صغيرة.
    بعض الأشجار يبلغ عمرها 120 إلى 200 سنة، جذوعها رمادية ومحفورة بعمق، وتلتحم تيجانها عالياً فوق الرأس.
    تحتها ينمو نحو ستين نوعاً من الأشجار والشجيرات، منها الرودودندرون والمشملة والنسرين البري والزعرور،
    وتشمل النادرة منها لبلاب باستوخوف والبندق الكولخيدي والدردار الجبلي والجوز المجنّح القوقازي.


    الغابة ليست فارغة، بل هادئة فحسب. يعيش فيها اليحمور والثعلب ودُلَق الغابة والغرير والسنجاب والزغبة.
    سُجّل فيها أكثر من ستين نوعاً من الطيور، مع أن 21 نوعاً فقط تعشّش في غابة البلّوط - أما البقية فتعبر
    أو تأتي للتشتية. يصطاد ثعبانُ العشب وثعبانُ النرد على الحواف الرطبة، بينما يحظى خفاش نوكتيولا وقضاعة
    القوقاز بحماية خاصة كلٌّ على حدة.


    لا تأتِ هنا من أجل المشهد. لا شلال هنا، ولا صخرة، ولا قمة - فقط أرض مستوية، وضوء متبقّع، وصبر البلّوط
    الطويل. أجاميتي لا تؤدّي أي عرض. إنها فقط تستمر في كونها غابة، وفي سهول إيميريتي المنخفضة أصبح هذا
    أمراً نادراً.
  tip: >-
    ساعتان سيراً على الأقدام تكفيان تماماً. الأرض مستوية، لكن المسارات الترابية تحتفظ بالطين طويلاً بعد
    المطر، فارتدِ حذاءً مضاداً للماء. من أواخر الربيع يظهر القراد والبعوض: بنطال طويل، وحذاء مغلق، وطارد
    حشرات. يبقى الظلّ تحت الأشجار بارداً حتى في يوليو. احمل الماء والطعام، ولا تعتمد على مقهى أو متجر
    عند حافة الغابة. التزم المسار: فشجرة البلّوط تشبه الأخرى كثيراً، والمعالم قليلة. الصباح الباكر أفضل
    وقت لسماع تغريد الطيور ورؤية اليحامير عند حواف المروج.
  route: >-
    من تبليسي على الطريق السريع S1 (E60) غرباً إلى زستافوني (نحو 186 كم)، ثم على طريق Sh54 نحو باغداتي.
    تبدأ الغابة على بُعد كيلومترات قليلة من هذا الطريق؛ اتبع لافتات وكالة المناطق المحمية على طرق محلية
    ضيقة. الإجمالي نحو 205 كم وثلاث ساعات. الطريق معبّد بكامله، ويضيق في المقطع الأخير وتكثر فيه الرُّقع.
    عبّئ الوقود في زستافوني أو باغداتي. المواقف غير رسمية، حيثما وجدت مساحة عند حافة الغابة. سيارة اقتصادية
    تكفي تماماً؛ وبعد مطر غزير، سِر ببطء في المقطع الأخير.
