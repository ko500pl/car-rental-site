ka:
  name: ანჩისხატის ბაზილიკა
  short: >-
    თბილისის უძველესი შემორჩენილი ეკლესია: VI საუკუნის დაბალი, ბინდიანი ბაზილიკა შავთელის ქუჩაზე, სადაც
    ქვას დღესაც ქართული მრავალხმიანობა ავსებს.
  body: >-
    **თბილისის უძველეს შემორჩენილ ეკლესიას ადვილად ჩაუვლით: შავთელის ქუჩაში ჩაჭედილი დაბალი, განიერი ქვის
    ტანი, არც გუმბათი აქვს და არც კოშკი, რომ თავი გამოიჩინოს.**


    ძველი ქართული მატიანეები მის აგებას მეფე დაჩის, ვახტანგ გორგასლის ძეს მიაწერენ, რომელიც დაახლოებით
    522–534 წლებში მეფობდა და თბილისი სატახტო ქალაქად აქცია. ეკლესია ღვთისმშობელს ეძღვნებოდა. მის სიძველეზე
    გეგმა მეტყველებს: სამი ნავი, ბურჯებით გაყოფილი, ნალისებრი აფსიდებით. თავდაპირველი კედლები ყვითელი
    ტუფისა იყო; აგურის დიდი ნაწილი, რომელსაც დღეს ხედავთ, გვიანდელ აღდგენებს ეკუთვნის.


    სახელი 1675 წელს შეიძინა. იმ წელს კლარჯეთის ანჩის მონასტრიდან, ოსმალთაგან გადასარჩენად, აქ გადმოასვენეს
    მაცხოვრის ხატი, XII საუკუნის ოქრომჭედლის, ბექა ოპიზრის, ჭედური მოჭედილობით შემკული, და ეკლესიას ანჩისხატი
    ეწოდა. იმავე წელს კათოლიკოსმა დომენტიმ კარიბჭესთან აგურის სამრეკლო ააგო. თავად ხატი დღეს საქართველოს
    ხელოვნების მუზეუმში ინახება.


    ისტორია შენობას გამუდმებით აკეთებდა და ანგრევდა. XV–XVII საუკუნეებში სპარსელებთან და თურქებთან ომებში
    არაერთხელ დაზიანდა; 1870-იან წლებში გუმბათი დაადგეს; საბჭოთა ხელისუფლებამ დახურა და ჯერ ხელოსნობის
    მუზეუმად, შემდეგ კი სამხატვრო სახელოსნოდ აქცია. 1958–1964 წლების რესტავრაციამ, თბილისის 1500 წლისთავისთვის
    ჩატარებულმა, გუმბათი მოხსნა და XVII საუკუნის სილუეტი დაუბრუნა, მაგრამ წირვა-ლოცვა მხოლოდ 1991 წელს
    განახლდა.


    შიგნით ბინდი და სიმშვიდეა. საკურთხევლის მოხატულობა 1683 წლისაა, კათოლიკოს ნიკოლოზ ამილახვრის დაკვეთით
    შესრულებული; დანარჩენი მხატვრობა XIX საუკუნეს ეკუთვნის. და ბოლოს — ხმა. აქ მოღვაწე ანჩისხატის გუნდი
    ქართული მრავალხმიანობის ერთ-ერთი წამყვანი შემსრულებელია — ტრადიციისა, რომელიც იუნესკომ 2001 წელს კაცობრიობის
    არამატერიალური მემკვიდრეობის შედევრად აღიარა. როცა სამი ხმა ასე დაბალ თაღქვეშ ერთმანეთს ხვდება, თითქოს
    ბანს ძველი ქვაც აყოლებს.
  tip: >-
    ოცი-ოცდაათი წუთი, წირვის დროს — მეტი. შესვლა უფასოა, სანთლის დანთება კი ჩვეულებაა. ჩაიცვით ისე, როგორც
    ნებისმიერ ქართულ ეკლესიაში: ქალებს თავსაბურავი და ქვედაბოლო, კაცებს გრძელი შარვალი. წირვისას ჩუმად
    შედით, უკან დადექით და კამერა ჩანთაში შეინახეთ. გუნდი სტუმრების განრიგით არ გალობს — მისი მოსმენა
    იღბალია, თუმცა კვირისა და დღესასწაულის ლიტურგიაზე შანსი მეტია. შესასვლელი დაბალია. ტუალეტი არ არის;
    კაფეები შავთელის ქუჩას მიუყვება, გაბრიაძის საათიანი კოშკი კი ერთი წუთის სავალზეა.
  route: >-
    თავისუფლების მოედნიდან სულ რაღაც ერთი კილომეტრია — ფეხით ათი წუთი, რაც, მართალი გითხრათ, მანქანით
    მგზავრობაზე ადვილია; მანქანით კი მთავარი ბოლო რამდენიმე ასეული მეტრია: შავთელის ქუჩა ვიწრო და ფაქტობრივად
    საფეხმავლოა, მიმდებარე შუკები კი ჩიხით ან ჯარიმით მთავრდება. მოდით ბარათაშვილის ან ერეკლე II-ის ქუჩით
    და დააყენეთ მანქანა ბარათაშვილის აღმართის ფასიან ადგილზე, ან დატოვეთ რიყის პარკის ავტოსადგომზე მდინარის
    გაღმა და მშვიდობის ხიდით გადმოდით — ეკლესიის კარამდე შვიდი-რვა წუთია. მანქანით, ჩვეულებრივ მოძრაობაში,
    ცენტრიდან ხუთი-ათი წუთი იანგარიშეთ. ეკონომკლასის მანქანა და ცოტაოდენი მოთმინება სრულიად საკმარისია.
en:
  name: Anchiskhati Basilica
  short: >-
    Tbilisi's oldest surviving church: a sixth-century basilica on Shavteli Street, low and dim, where
    Georgian polyphony still fills the stone.
  body: >-
    **The oldest surviving church in Tbilisi is easy to walk past: a low, broad stone hull wedged into
    Shavteli Street, with no dome and no tower to announce it.**


    The old Georgian annals credit it to King Dachi of Iberia, son of Vakhtang Gorgasali, who reigned
    around 522–534 and made Tbilisi his capital. It was dedicated to the Virgin. Its age shows in the
    plan: three aisles divided by piers, with horseshoe-shaped apses. The first walls were of yellow tuff;
    much of the brick you see comes from later rebuildings.


    The name arrived in 1675. That year the icon of the Saviour from Ancha monastery in Klarjeti, in its
    chased cover by the twelfth-century goldsmith Beka Opizari, was carried here to keep it from the Ottomans,
    and the church became Anchiskhati, "the icon of Ancha". The same year Catholicos Domenti built the
    brick belfry by the gate. The icon itself now sits in the Art Museum of Georgia.


    History kept rearranging the building. Wars with Persians and Turks damaged it again and again between
    the fifteenth and seventeenth centuries; in the 1870s it was given a dome; the Soviets shut it and
    turned it into a handicrafts museum, then an artists' studio. The 1958–1964 restoration, made for
    the city's 1,500th jubilee, took the dome away and returned the seventeenth-century silhouette, but
    services resumed only in 1991.


    Inside, it is dim and low. The altar painting dates from 1683, commissioned by Catholicos Nikoloz
    Amilakhvari; the rest of the murals are nineteenth-century. Then there is the sound. The Anchiskhati
    Choir, based here, is among the leading voices of Georgian polyphony, which UNESCO proclaimed a masterpiece
    of humanity's intangible heritage in 2001. When three lines of voices meet under a roof this close,
    the old stone seems to sing the bass.
  tip: >-
    Twenty to thirty minutes, longer if a service is on. Entry is free; lighting a candle is the custom.
    Dress as for any Georgian church: headscarf and skirt for women, long trousers for men. During services
    step in quietly, stay near the back and put the camera away. The choir does not perform to a visitor
    timetable, so treat hearing it as luck — Sunday and feast-day liturgies give you the best chance.
    The doorway is low. There are no toilets; cafés line Shavteli Street, and the Gabriadze clock tower
    is a minute's walk away.
  route: >-
    It is barely a kilometre from Freedom Square — a ten-minute walk, frankly easier than driving — and
    by car the last few hundred metres are the whole story: Shavteli Street is narrow and effectively
    pedestrian, and the lanes around it end in dead ends or fines. Come along Baratashvili Street or Erekle
    II Street and take a metered bay on the Baratashvili rise, or park in the car park at Rike Park across
    the river and walk over the Bridge of Peace — seven or eight minutes to the church door. By car, allow
    five to ten minutes from the centre in normal traffic. An economy car and a little patience are all
    you need.
ru:
  name: Базилика Анчисхати
  short: >-
    Старейшая сохранившаяся церковь Тбилиси: низкая сумрачная базилика VI века на улице Шавтели, где до
    сих пор звучит грузинское многоголосие.
  body: >-
    **Мимо старейшей сохранившейся церкви Тбилиси легко пройти, не заметив её: низкий широкий каменный
    корпус, втиснутый в улицу Шавтели, — ни купола, ни башни, которые возвестили бы о ней.**


    Древние грузинские летописи приписывают её постройку царю Иберии Дачи, сыну Вахтанга Горгасали, который
    правил примерно в 522–534 годах и сделал Тбилиси своей столицей. Церковь была посвящена Богородице.
    Возраст выдаёт её план: три нефа, разделённые столбами, и подковообразные апсиды. Первые стены сложили
    из жёлтого туфа; большая часть кирпича, который вы видите, появилась при более поздних перестройках.


    Своё название церковь получила в 1675 году. Тогда из монастыря Анча в Кларджети сюда перенесли, спасая
    от османов, икону Спаса в чеканном окладе работы золотых дел мастера XII века Беки Опизари, и церковь
    стала Анчисхати — «иконой Анчи». В том же году католикос Доменти построил у ворот кирпичную колокольню.
    Сама икона сейчас хранится в Художественном музее Грузии.


    История снова и снова перекраивала здание. Войны с персами и турками раз за разом разрушали его между
    XV и XVII веками; в 1870-х церковь получила купол; советская власть закрыла её и превратила в музей
    ремёсел, затем в мастерскую художников. Реставрация 1958–1964 годов, приуроченная к 1500-летию города,
    убрала купол и вернула силуэт XVII века, но богослужения возобновились лишь в 1991 году.


    Внутри сумрачно и низко. Алтарная роспись датирована 1683 годом и заказана католикосом Николозом Амилахвари;
    остальные росписи — XIX века. И наконец — звук. Хор Анчисхати, который базируется в этой церкви, —
    один из ведущих голосов грузинского многоголосия, провозглашённого ЮНЕСКО в 2001 году шедевром нематериального
    наследия человечества. Когда три голосовые линии сходятся под такими низкими сводами, кажется, что
    басовую партию поёт сам старый камень.
  tip: >-
    Двадцать-тридцать минут, дольше — если идёт служба. Вход свободный; принято зажечь свечу. Одевайтесь,
    как в любую грузинскую церковь: женщинам — платок и юбка, мужчинам — длинные брюки. Во время службы
    входите тихо, оставайтесь у входа и уберите камеру. Хор не поёт по расписанию для туристов, так что
    услышать его — удача; больше всего шансов на воскресной и праздничной литургии. Дверной проём низкий.
    Туалетов нет; кафе тянутся вдоль улицы Шавтели, а часовая башня Габриадзе — в минуте ходьбы.
  route: >-
    От площади Свободы всего около километра — десять минут пешком, и это, честно говоря, проще, чем на
    машине; а за рулём вся суть — в последних нескольких сотнях метров: улица Шавтели узкая и фактически
    пешеходная, а переулки вокруг заканчиваются тупиками или штрафами. Подъезжайте по улице Бараташвили
    или улице Эрекле II и встаньте на платное место на подъёме Бараташвили либо оставьте машину на парковке
    у парка Рике за рекой и перейдите по Мосту Мира — семь-восемь минут до дверей церкви. На машине от
    центра при обычном движении — пять-десять минут. Нужны лишь машина эконом-класса и немного терпения.
fa:
  name: باسیلیکای آنچیسخاتی
  short: >-
    کهن‌ترین کلیسای برجای‌ماندهٔ تفلیس: باسیلیکایی از سدهٔ ششم در خیابان شاوتلی، کوتاه و نیمه‌تاریک، که
    آواز چندصدایی گرجی هنوز سنگ‌هایش را پر می‌کند.
  body: >-
    **از کنار کهن‌ترین کلیسای برجای‌ماندهٔ تفلیس به آسانی می‌توان گذشت: بدنه‌ای سنگی، کوتاه و پهن، که
    در خیابان شاوتلی جا گرفته، بی‌گنبد و بی‌برجی که از حضورش خبر دهد.**


    وقایع‌نامه‌های کهن گرجی ساخت آن را به داچی، شاه ایبریا و پسر واختانگ گورگاسالی، نسبت می‌دهند که حدود
    ۵۲۲ تا ۵۳۴ فرمان راند و تفلیس را پایتخت خود کرد. کلیسا به مریم باکره تقدیم شده بود. قدمتش از نقشه‌اش
    پیداست: سه شبستان که با جرزها از هم جدا شده‌اند و آبسیدهایی نعلی‌شکل. نخستین دیوارها از توف زرد بود؛
    بیشتر آجرهایی که می‌بینید از بازسازی‌های بعدی به جا مانده است.


    نام کلیسا در ۱۶۷۵ از راه رسید. در آن سال شمایل منجی از صومعهٔ آنچا در کلارجتی، با روکش قلم‌زنی‌شده‌ای
    کار بکا اوپیزاری، زرگر سدهٔ دوازدهم، را برای در امان ماندن از عثمانیان به اینجا آوردند و کلیسا «آنچیسخاتی»،
    یعنی «شمایل آنچا»، نام گرفت. در همان سال جاثلیق دومنتی برج ناقوس آجری را کنار دروازه ساخت. خود شمایل
    اکنون در موزهٔ هنر گرجستان نگهداری می‌شود.


    تاریخ بارها ساختمان را دگرگون کرد. جنگ‌ها با ایرانیان و ترکان میان سده‌های پانزدهم و هفدهم پیاپی به
    آن آسیب زدند؛ در دههٔ ۱۸۷۰ گنبدی بر آن افزودند؛ شوروی‌ها آن را بستند و به موزهٔ صنایع‌دستی و سپس کارگاه
    نقاشان بدل کردند. مرمت ۱۹۵۸–۱۹۶۴، که برای جشن ۱۵۰۰ سالگی شهر انجام شد، گنبد را برداشت و نیم‌رخ سدهٔ
    هفدهمی را بازگرداند، اما آیین‌های دینی تنها در ۱۹۹۱ از سر گرفته شد.


    درون کلیسا نیمه‌تاریک و کوتاه است. نقاشی محراب از ۱۶۸۳ است و به سفارش جاثلیق نیکولوز آمیلاخواری کشیده
    شده؛ دیگر دیوارنگاره‌ها از سدهٔ نوزدهم‌اند. و آن‌گاه صدا. گروه کُر آنچیسخاتی که پایگاهش همین‌جاست،
    از صداهای برجستهٔ آواز چندصدایی گرجی است؛ آوازی که یونسکو در ۲۰۰۱ آن را شاهکار میراث ناملموس بشری
    اعلام کرد. وقتی سه خط آوازی زیر سقفی چنین کوتاه به هم می‌رسند، گویی سنگ کهن خود بخش بم را می‌خواند.
  tip: >-
    بیست تا سی دقیقه، و اگر مراسمی برپا باشد بیشتر. ورود رایگان است؛ روشن کردن شمع رسم است. مانند هر کلیسای
    گرجی لباس بپوشید: برای زنان روسری و دامن، برای مردان شلوار بلند. هنگام مراسم آرام وارد شوید، در عقب
    بایستید و دوربین را کنار بگذارید. گروه کر بر پایهٔ برنامه‌ای برای بازدیدکنندگان نمی‌خواند، پس شنیدن
    آوازشان را بخت بدانید؛ آیین‌های نیایش یکشنبه‌ها و روزهای عید بهترین فرصت‌اند. درگاه کوتاه است. سرویس
    بهداشتی ندارد؛ کافه‌ها در امتداد خیابان شاوتلی‌اند و برج ساعت گابریادزه یک دقیقه پیاده فاصله دارد.
  route: >-
    فاصله‌اش از میدان آزادی حدود یک کیلومتر است — ده دقیقه پیاده، که راستش آسان‌تر از رانندگی است؛ و با
    خودرو همهٔ ماجرا در چند صد متر آخر است: خیابان شاوتلی باریک و در عمل پیاده‌راه است، و کوچه‌های اطرافش
    به بن‌بست یا جریمه ختم می‌شوند. از خیابان باراتاشویلی یا خیابان ارکلی دوم بیایید و در یکی از جاهای
    پارک پولی سربالایی باراتاشویلی بایستید، یا در پارکینگ پارک ریکه در آن سوی رود پارک کنید و از پل صلح
    پیاده بگذرید — هفت هشت دقیقه تا در کلیسا. با خودرو از مرکز شهر در ترافیک عادی پنج تا ده دقیقه در نظر
    بگیرید. خودرویی اقتصادی و کمی حوصله همهٔ آن چیزی است که لازم دارید.
he:
  name: בזיליקת אנצ'יסחאטי
  short: >-
    הכנסייה העתיקה ביותר ששרדה בטביליסי: בזיליקה מהמאה השישית ברחוב שבתלי, נמוכה ואפלולית, שבה השירה הרב-קולית
    הגאורגית עדיין ממלאת את האבן.
  body: >-
    **את הכנסייה העתיקה ביותר ששרדה בטביליסי קל לעבור בלי לשים לב: גוף אבן נמוך ורחב, דחוק לתוך רחוב שבתלי,
    בלי כיפה ובלי מגדל שיכריזו על קיומו.**


    הכרוניקות הגאורגיות העתיקות מייחסות את בנייתה למלך דאצ'י מאיבריה, בנו של וחטנג גורגסלי, שמלך בערך
    בשנים 522–534 והפך את טביליסי לבירתו. היא הוקדשה למרים הבתולה. גילה ניכר בתוכנית: שלוש ספינות המופרדות
    בעמודים, ואפסיסים בצורת פרסה. הקירות הראשונים נבנו מטוף צהוב; רוב הלבנים שרואים היום מקורן בשיקומים
    מאוחרים יותר.


    השם הגיע ב-1675. באותה שנה הובאה לכאן, כדי להצילה מידי העות'מאנים, איקונת המושיע ממנזר אנצ'ה שבקלרג'תי,
    בכיסוי המרוקע שהוא מעשה ידיו של הצורף בן המאה ה-12 בקה אופיזרי, והכנסייה נעשתה לאנצ'יסחאטי – "האיקונה
    של אנצ'ה". באותה שנה בנה הקתוליקוס דומנטי את מגדל הפעמונים מלבנים ליד השער. האיקונה עצמה נמצאת כיום
    במוזיאון האמנות של גאורגיה.


    ההיסטוריה שבה ועיצבה את הבניין מחדש. מלחמות עם הפרסים והטורקים פגעו בו שוב ושוב בין המאה ה-15 למאה
    ה-17; בשנות ה-70 של המאה ה-19 נוספה לו כיפה; הסובייטים סגרו אותו והפכו אותו למוזיאון למלאכות יד, ואחר
    כך לסטודיו של אמנים. השיקום של 1958–1964, שנעשה לקראת יובל ה-1,500 של העיר, הסיר את הכיפה והחזיר את
    קו המתאר של המאה ה-17, אך התפילות בכנסייה חודשו רק ב-1991.


    בפנים אפלולי ונמוך. ציור המזבח מתוארך ל-1683 והוזמן בידי הקתוליקוס ניקולוז אמילחווארי; שאר ציורי הקיר
    הם מהמאה ה-19. ואז – הצליל. מקהלת אנצ'יסחאטי, שמשכנה כאן, היא מהקולות המובילים של השירה הרב-קולית
    הגאורגית, שאונסק"ו הכריז עליה ב-2001 כיצירת מופת של המורשת הבלתי מוחשית של האנושות. כששלושה קווים
    קוליים נפגשים תחת תקרה נמוכה כל כך, נדמה שהאבן העתיקה עצמה שרה את קול הבס.
  tip: >-
    עשרים עד שלושים דקות, יותר אם מתקיימת תפילה. הכניסה חופשית; נהוג להדליק נר. התלבשו כמו לכל כנסייה
    גאורגית: כיסוי ראש וחצאית לנשים, מכנסיים ארוכים לגברים. בזמן תפילה היכנסו בשקט, עמדו בחלק האחורי והניחו
    את המצלמה. המקהלה אינה שרה לפי לוח זמנים למבקרים, כך שאם תשמעו אותה – זה מזל; הסיכוי הטוב ביותר הוא
    בליטורגיה של יום ראשון ושל ימי חג. הפתח נמוך. אין שירותים; בתי קפה פזורים לאורך רחוב שבתלי, ומגדל
    השעון של גבריאדזה במרחק דקת הליכה.
  route: >-
    זה כקילומטר אחד מכיכר החירות – עשר דקות הליכה, ולמען האמת קל יותר מנסיעה ברכב; ברכב, כל הסיפור הוא
    מאות המטרים האחרונים: רחוב שבתלי צר ולמעשה מיועד להולכי רגל, והסמטאות סביבו נגמרות במבוי סתום או בקנס.
    הגיעו דרך רחוב ברטשווילי או רחוב ארקלה השני וחנו במקום חניה בתשלום בעלייה של ברטשווילי, או חנו בחניון
    של פארק ריקה מעבר לנהר וחצו ברגל את גשר השלום – שבע-שמונה דקות עד דלת הכנסייה. ברכב, קחו בחשבון חמש
    עד עשר דקות מהמרכז בתנועה רגילה. רכב מקטגוריית אקונומי וקצת סבלנות – זה כל מה שצריך.
ar:
  name: بازيليكا أنتشيسخاتي
  short: >-
    أقدم كنيسة باقية في تبليسي: بازيليكا من القرن السادس في شارع شافتيلي، منخفضة معتمة، ما زال الغناء
    الجورجي متعدد الأصوات يملأ حجارتها.
  body: >-
    **من السهل أن تمرّ بأقدم كنيسة باقية في تبليسي دون أن تنتبه إليها: هيكل حجري منخفض عريض، محشور في
    شارع شافتيلي، بلا قبة ولا برج يعلن عن وجوده.**


    تنسب الحوليات الجورجية القديمة بناءها إلى داتشي ملك إيبيريا، ابن فاختانغ غورغاسالي، الذي حكم نحو 522–534
    وجعل تبليسي عاصمته. وقد كُرّست للسيدة العذراء. ويشي تصميمها بقِدمها: ثلاثة أروقة تفصل بينها دعامات،
    وحنايا على شكل حدوة الفرس. شُيّدت الجدران الأولى من الطوف الأصفر؛ أما معظم الآجرّ الذي تراه فيعود
    إلى عمليات إعادة بناء لاحقة.


    جاء الاسم عام 1675. ففي تلك السنة نُقلت إلى هنا أيقونة المخلّص من دير أنتشا في كلارجيتي، في غلافها
    المزخرف بالطَّرق من صنع الصائغ بيكا أوبيزاري في القرن الثاني عشر، لحمايتها من العثمانيين، فصارت الكنيسة
    «أنتشيسخاتي»، أي «أيقونة أنتشا». وفي العام نفسه بنى الجاثليق دومينتي برج الأجراس الآجري عند البوابة.
    أما الأيقونة نفسها فمحفوظة اليوم في متحف جورجيا للفنون.


    ظل التاريخ يعيد تشكيل المبنى مرة بعد مرة. فقد ألحقت به الحروب مع الفرس والترك أضراراً متكررة بين القرنين
    الخامس عشر والسابع عشر؛ وفي سبعينيات القرن التاسع عشر أُضيفت إليه قبة؛ ثم أغلقه السوفييت وحوّلوه إلى
    متحف للحِرف اليدوية، ثم إلى مرسم للفنانين. وأزال ترميم 1958–1964، الذي أُجري احتفالاً بالذكرى الـ1500
    لتأسيس المدينة، القبةَ وأعاد إليه هيئته في القرن السابع عشر، لكن الصلوات لم تُستأنف فيه إلا عام 1991.


    في الداخل عتمة وسقف منخفض. تعود لوحة المذبح إلى عام 1683، وقد أمر بها الجاثليق نيكولوز أميلاخفاري؛
    أما بقية الجداريات فمن القرن التاسع عشر. ثم هناك الصوت. فجوقة أنتشيسخاتي، التي تتخذ من الكنيسة مقراً
    لها، من أبرز أصوات الغناء الجورجي متعدد الأصوات، الذي أعلنته اليونسكو عام 2001 من روائع التراث غير
    المادي للبشرية. وحين تلتقي ثلاثة خطوط من الأصوات تحت سقف بهذا الانخفاض، يبدو كأن الحجر العتيق نفسه
    يغني بصوت الجهير.
  tip: >-
    عشرون إلى ثلاثين دقيقة، وأكثر إن صادفت قدّاساً. الدخول مجاني؛ ومن العادة إشعال شمعة. البس كما في أي
    كنيسة جورجية: غطاء رأس وتنورة للنساء، وسراويل طويلة للرجال. أثناء القداس ادخل بهدوء، وابقَ في المؤخرة،
    وأبعد الكاميرا. الجوقة لا تغني وفق جدول للزوار، فاعتبر سماعها حظاً؛ وأفضل فرصة في قداس الأحد وأيام
    الأعياد. المدخل منخفض. لا توجد دورات مياه؛ وتصطف المقاهي على طول شارع شافتيلي، وبرج ساعة غابريادزه
    على بعد دقيقة سيراً.
  route: >-
    تبعد الكنيسة نحو كيلومتر واحد عن ساحة الحرية — عشر دقائق سيراً، وهذا بصراحة أيسر من القيادة؛ أما بالسيارة
    فالقصة كلها في المئات الأخيرة من الأمتار: شارع شافتيلي ضيق ومخصص للمشاة عملياً، والأزقة حوله تنتهي
    بطرق مسدودة أو بمخالفات. تعالَ عبر شارع باراتاشفيلي أو شارع إريكلي الثاني وخذ مكاناً مدفوعاً على منحدر
    باراتاشفيلي، أو اركن في موقف حديقة ريكي على الضفة الأخرى من النهر واعبر جسر السلام سيراً — سبع أو
    ثماني دقائق حتى باب الكنيسة. وبالسيارة احسب خمس إلى عشر دقائق من المركز في حركة المرور العادية. سيارة
    اقتصادية وقليل من الصبر هما كل ما تحتاج إليه.
