ka:
  name: ანჩისხატის ბაზილიკა
  short: თბილისის უძველესი შემორჩენილი ეკლესია — VI საუკუნის სამნავიანი ბაზილიკა შავთელის ქუჩაზე.
  body: >-
    **ეს არის ყველაზე ძველი შენობა, რომელიც თბილისში დღემდე იმავე მიზნით გამოიყენება.** ანჩისხატი VI საუკუნეში
    ააგო მეფე დაჩიმ, ვახტანგ გორგასლის ძემ, მას შემდეგ რაც დედაქალაქი მცხეთიდან თბილისში გადმოიტანა. მისი
    მოცულობა თითქმის შეუმჩნეველია — შავთელის ვიწრო ქუჩაზე მას ადვილად ჩაუვლი, თუ არ იცი, რომ იქ არის.


    შენობა სამნავიანი ბაზილიკაა, გუმბათის გარეშე, ქვისა და აგურის რიგებით. თავდაპირველად ღვთისმშობლის
    სახელობის იყო; ახლანდელი სახელი XVII საუკუნეში მიიღო, როცა კლარჯეთის ანჩის მონასტრიდან, ოსმალთა ხელში
    მოქცეული ტერიტორიიდან, აქ გადმოასვენეს მაცხოვრის ხატი — ანჩისხატი. თავად ხატი დღეს ხელოვნების მუზეუმის
    ფონდშია, ეკლესიაში კი ასლი დგას.


    კარიბჭესთან აგურის სამრეკლოა, აშენებული 1675 წელს კათოლიკოს დომენტის მიერ; ის თითქმის ისეთივე საინტერესოა,
    როგორც თავად ეკლესია. XIX საუკუნეში ბაზილიკას გუმბათი მიაშენეს, რომელიც 1950–60-იანი წლების რესტავრაციისას
    ჩამოხსნეს და შენობას საწყისი ფორმა დაუბრუნეს.


    შიგნით დაბალი, ბნელი და ძალიან წყნარი სივრცეა, კედლებზე XIX საუკუნის მოხატულობის ფრაგმენტებით. მთავარი
    მიზეზი, რის გამოც აქ ბევრი ბრუნდება, ხმაა: ანჩისხატის გუნდი, რომელიც ძველ ქართულ მრავალხმიან საგალობლებს
    ასრულებს, სწორედ ამ ეკლესიაში მღერის. ჩვეულებრივ წირვაზე მოხვედრა შემთხვევითი ბედია, მაგრამ თუ მოხვდი,
    ეს თბილისში მოსასმენი ერთ-ერთი საუკეთესო რამაა.


    ის მრავალხმიანობა, რომელსაც აქ მოისმენ, უფრო ძველია, ვიდრე თავად შენობა: ქართული ხალხური და საეკლესიო
    მრავალხმიანი სიმღერა 2001 წელს იუნესკომ კაცობრიობის ზეპირი და არამატერიალური მემკვიდრეობის შედევრად
    აღიარა. ბაზილიკის ინტერიერი ამისთვის იდეალურია — დაბალი, ქვის, სწორკუთხა სივრცე, სადაც ხმა კედლებს
    ეხება და არ იფანტება, როგორც დიდ, გუმბათოვან ტაძრებში.
  tip: >-
    ოციდან ოცდაათ წუთამდე. ეკლესია პატარაა და ღვთისმსახურების დროს სავსე — მაშინ შესვლა შესაძლებელია,
    მაგრამ მოძრაობა და ფოტო არა. ჩაცმის წესები მოქმედებს: ქალებს თავსაფარი და გრძელი კაბა, კაცებს გრძელი
    შარვალი. შესასვლელი დაბალია, თავს უფრთხილდი. ტუალეტი არ არის; უახლოესი კაფეებში, შავთელისა და იოსებიძის
    მიმართულებით. ხმაურიან ძველ ქალაქში ეს ერთ-ერთი ყველაზე მშვიდი წერტილია და კარგად ერწყმის გაბრიაძის
    კოშკს, რომელიც ორ ნაბიჯშია.
  route: >-
    შავთელის ქუჩა ვიწროა და პრაქტიკულად საფეხმავლო — მანქანით მასზე შესვლა არ ღირს. ბარათაშვილის ხიდიდან
    ან ერეკლე II-ის ქუჩიდან მოდი და დატოვე მანქანა ბარათაშვილის აღმართის ზონალურ ადგილებში ან რიყის პარკის
    ქვედა პარკინგში, საიდანაც მშვიდობის ხიდი გადმოგიყვანს პირდაპირ ეკლესიასთან — 7-8 წუთის სავალი. ძველი
    ქალაქის შიდა ქუჩებში ჩაძრომა თითქმის ყოველთვის ჩიხით ან ჯარიმით მთავრდება. ეკონომკლასის მანქანა და
    მოთმინება საკმარისია.
en:
  name: Anchiskhati Basilica
  short: The oldest surviving church in Tbilisi — a sixth-century three-nave basilica on Shavteli Street.
  body: >-
    **This is the oldest building in Tbilisi still doing the job it was built for.** Anchiskhati was raised
    in the sixth century by King Dachi, son of Vakhtang Gorgasali, after the capital moved from Mtskheta
    to Tbilisi. It is easy to walk past: a low, broad shape wedged into narrow Shavteli Street, with none
    of the height that later Georgian churches use to announce themselves.


    The plan is a three-nave basilica with no dome, built in courses of stone and brick. It was originally
    dedicated to the Virgin. The present name arrived in the seventeenth century, when the icon of the
    Saviour from Ancha monastery in Klarjeti — territory by then under Ottoman control — was brought here
    for safety. The icon itself is now in the state art collection; the church holds a copy.


    At the gate stands a brick bell tower built in 1675 by Catholicos Domenti, and it is nearly as interesting
    as the church. In the nineteenth century a dome was added to the basilica; the restoration of the
    1950s and 60s removed it and returned the building to its original form.


    Inside is a low, dark, very quiet space with fragments of nineteenth-century painting on the walls.
    The reason many people come back, though, is sound. The Anchiskhati Choir, which sings the old Georgian
    polyphonic liturgy, is based in this church. Catching them at an ordinary service is a matter of luck,
    but if you do, it is one of the best things to hear in the city.


    The polyphony you may hear here is older than the building itself: Georgian folk and liturgical polyphonic
    singing was proclaimed by UNESCO in 2001 a masterpiece of the oral and intangible heritage of humanity.
    The basilica is an ideal container for it. A low, rectangular stone room lets the voices press against
    the walls and stay dense, instead of dispersing upward the way they do under a large dome. Even a
    few singers rehearsing in an empty church fill it completely.
  tip: >-
    Twenty to thirty minutes. The church is small and fills up during services; you can go in, but not
    move around or photograph. Dress rules apply — headscarf and long skirt for women, long trousers for
    men. The doorway is low, so mind your head. There are no toilets; the nearest are in the cafes along
    Shavteli. In a noisy old town this is one of the few genuinely quiet corners, and it pairs naturally
    with the Gabriadze clock tower a few steps away.
  route: >-
    Shavteli Street is narrow and effectively pedestrian, so do not try to drive into it. Approach from
    Baratashvili Bridge or Erekle II Street and leave the car in the metered bays on Baratashvili rise,
    or in the lower car park at Rike Park, from where the Bridge of Peace brings you straight across to
    the church in seven or eight minutes. Pushing into the inner lanes of the old town almost always ends
    in a dead end or a fine. An economy car and some patience are all you need.
ru:
  name: Базилика Анчисхати
  short: Древнейшая сохранившаяся церковь Тбилиси — трёхнефная базилика VI века на улице Шавтели.
  body: >-
    **Это старейшее здание Тбилиси, которое до сих пор используется по назначению.** Анчисхати построил
    в VI веке царь Дачи, сын Вахтанга Горгасали, после переноса столицы из Мцхеты в Тбилиси. Мимо неё
    легко пройти: низкий широкий объём, втиснутый в узкую улицу Шавтели, без той высоты, которой позже
    грузинские храмы заявляли о себе.


    План — трёхнефная базилика без купола, кладка из рядов камня и кирпича. Изначально церковь была освящена
    в честь Богородицы. Нынешнее имя появилось в XVII веке, когда сюда ради сохранности перенесли икону
    Спаса из монастыря Анчи в Кларджети, к тому времени отошедшей к османам. Сама икона теперь в государственном
    художественном собрании, в церкви стоит список.


    У ворот стоит кирпичная колокольня 1675 года, построенная католикосом Доменти, — она едва ли не интереснее
    самой церкви. В XIX веке базилике надстроили купол; реставрация 1950–60-х его сняла и вернула зданию
    первоначальный облик.


    Внутри низкое, тёмное и очень тихое пространство с фрагментами росписи XIX века. Но многие возвращаются
    сюда ради звука: именно в этой церкви поёт хор Анчисхати, исполняющий старинное грузинское многоголосие.
    Попасть на обычную службу с их участием — дело случая, но если повезёт, это одно из лучших звучаний
    в городе.


    Многоголосие, которое здесь можно услышать, старше самого здания: грузинское народное и церковное
    многоголосное пение в 2001 году признано ЮНЕСКО шедевром устного и нематериального наследия человечества.
    Базилика для него идеальна. Низкий прямоугольный каменный зал прижимает голоса к стенам и сохраняет
    их плотность, вместо того чтобы рассеивать вверх, как это происходит под большим куполом. Даже несколько
    поющих на репетиции заполняют пустую церковь целиком.
  tip: >-
    Двадцать-тридцать минут. Церковь маленькая и во время службы заполняется; войти можно, ходить и снимать
    — нет. Действуют правила одежды: платок и длинная юбка для женщин, длинные брюки для мужчин. Дверной
    проём низкий, берегите голову. Туалетов нет, ближайшие в кафе вдоль Шавтели. В шумном старом городе
    это один из немногих по-настоящему тихих углов, и он хорошо соединяется с башней Габриадзе в двух
    шагах отсюда.
  route: >-
    Улица Шавтели узкая и фактически пешеходная, заезжать в неё не стоит. Подъезжайте от моста Бараташвили
    или по улице Ираклия II и оставляйте машину на размеченных местах на подъёме Бараташвили либо на нижней
    парковке парка Рике, откуда Мост мира выводит прямо к церкви за семь-восемь минут. Попытка углубиться
    во внутренние переулки старого города почти всегда заканчивается тупиком или штрафом. Достаточно машины
    эконом-класса и терпения.
fa:
  name: کلیسای آنچیسخاتی
  short: کهن‌ترین کلیسای بازماندهٔ تفلیس؛ بازیلیکایی سه‌شبستانی از سدهٔ ششم در خیابان شاوتلی.
  body: >-
    **این کهن‌ترین بنای تفلیس است که هنوز همان کاری را می‌کند که برایش ساخته شد.** آنچیسخاتی را در سدهٔ
    ششم شاه داچی، پسر واختانگ گورگاسالی، پس از انتقال پایتخت از متسختا به تفلیس برپا کرد. به‌آسانی می‌شود
    از کنارش گذشت: حجمی کوتاه و پهن که در کوچهٔ باریک شاوتلی جا خوش کرده، بی‌آن بلندایی که کلیساهای گرجی
    بعدی با آن خود را اعلام می‌کنند.


    نقشه یک بازیلیکای سه‌شبستانی بدون گنبد است، با رگه‌های متناوب سنگ و آجر. کلیسا در آغاز به نام مریم
    مقدس بود. نام کنونی در سدهٔ هفدهم آمد، وقتی شمایل منجی را از صومعهٔ آنچی در کلارجتی، سرزمینی که آن
    زمان به دست عثمانی افتاده بود، برای حفظ به اینجا آوردند. خود شمایل اکنون در مجموعهٔ هنری دولتی است
    و در کلیسا نسخه‌ای از آن نگه داشته می‌شود.


    کنار دروازه برج ناقوسی آجری ایستاده که کاتولیکوس دومنتی در ۱۶۷۵ ساخت، و کمابیش به اندازهٔ خود کلیسا
    جالب است. در سدهٔ نوزدهم گنبدی به بازیلیکا افزودند؛ مرمت دهه‌های ۱۹۵۰ و ۱۹۶۰ آن را برداشت و بنا را
    به شکل نخستینش بازگرداند.


    درون، فضایی کوتاه و تاریک و بسیار آرام است با پاره‌هایی از نقاشی سدهٔ نوزدهم بر دیوارها. اما آنچه
    بسیاری را بازمی‌گرداند صداست: گروه سرود آنچیسخاتی که چندصدایی کهن گرجی را می‌خواند در همین کلیسا مستقر
    است. رسیدن به مراسمی با حضور آنان بخت‌واقبال می‌خواهد، اما اگر پیش بیاید یکی از بهترین شنیدنی‌های
    شهر است.


    چندصدایی که ممکن است اینجا بشنوید از خود بنا کهن‌تر است: آواز چندصدایی مردمی و آیینی گرجی در سال ۲۰۰۱
    از سوی یونسکو شاهکار میراث شفاهی و ناملموس بشریت اعلام شد. و این بازیلیکا ظرف آرمانی آن است. تالاری
    کوتاه و مستطیل از سنگ، صداها را به دیوارها می‌فشارد و متراکم نگه می‌دارد، به‌جای آنکه مانند زیر گنبدی
    بزرگ رو به بالا پراکنده کند. حتی چند خواننده در تمرین، کلیسای خالی را پر می‌کنند.
  tip: >-
    بیست تا سی دقیقه. کلیسا کوچک است و هنگام مراسم پر می‌شود؛ می‌توانید وارد شوید اما جابه‌جا شدن و عکاسی
    نه. قواعد پوشش برقرار است: روسری و دامن بلند برای زنان و شلوار بلند برای مردان. سردر کوتاه است، مواظب
    سرتان باشید. سرویس بهداشتی ندارد و نزدیک‌ترین در کافه‌های امتداد شاوتلی است. در شهر قدیمِ پرهیاهو
    این یکی از معدود گوشه‌های واقعاً آرام است و به‌خوبی با برج ساعت گابریادزه در چند قدمی جفت می‌شود.
  route: >-
    کوچهٔ شاوتلی باریک و عملاً پیاده‌رو است، پس با خودرو واردش نشوید. از پل باراتاشویلی یا خیابان ارکله
    دوم نزدیک شوید و خودرو را در جای‌های خط‌کشی‌شدهٔ سربالایی باراتاشویلی یا در پارکینگ پایین پارک ریکه
    بگذارید؛ از آنجا پل صلح شما را در هفت‌هشت دقیقه درست کنار کلیسا می‌رساند. فرو رفتن در کوچه‌های درونی
    شهر قدیم تقریباً همیشه به بن‌بست یا جریمه می‌رسد. خودروی اقتصادی و کمی صبر کافی است.
he:
  name: בזיליקת אנצ'יסחאטי
  short: הכנסייה העתיקה ביותר ששרדה בטביליסי — בזיליקה תלת-אולמית מן המאה השישית ברחוב שאווטלי.
  body: >-
    **זהו המבנה העתיק ביותר בטביליסי שעדיין ממלא את התפקיד שלשמו נבנה.** אנצ'יסחאטי הוקמה במאה השישית
    בידי המלך דאצ'י, בנו של וכטנג גורגסאלי, לאחר שהבירה עברה ממצחתה לטביליסי. קל לחלוף על פניה: גוש נמוך
    ורחב הדחוק ברחוב שאווטלי הצר, בלי הגובה שבו הכריזו על עצמן כנסיות גאורגיות מאוחרות יותר.


    התוכנית היא בזיליקה בת שלושה אולמות בלי כיפה, בנויה בשורות מתחלפות של אבן ולבנים. במקור הוקדשה למרים.
    השם הנוכחי הגיע במאה ה-17, כשהובאה לכאן לשם שמירה איקונת המושיע ממנזר אנצ'י שבקלארג'תי, שטח שכבר היה
    בידי העות'מאנים. האיקונה עצמה נמצאת היום באוסף האמנות הממלכתי, ובכנסייה עומד העתק.


    בשער עומד מגדל פעמונים מלבנים שבנה הקתוליקוס דומנטי ב-1675, והוא מעניין כמעט כמו הכנסייה עצמה. במאה
    ה-19 הוסיפו לבזיליקה כיפה; שחזור שנות ה-50 וה-60 הסיר אותה והחזיר למבנה את צורתו המקורית.


    בפנים חלל נמוך, חשוך ושקט מאוד, ועל הקירות שרידי ציור מן המאה ה-19. אבל מה שמחזיר לכאן אנשים הוא הצליל:
    מקהלת אנצ'יסחאטי, ששרה את הליטורגיה הפוליפונית הגאורגית העתיקה, יושבת בכנסייה הזאת. להיתקל בהם בתפילה
    רגילה זה עניין של מזל, אבל אם זה קורה, זה אחד הדברים היפים ביותר לשמוע בעיר.


    הפוליפוניה שאפשר לשמוע כאן עתיקה מן המבנה עצמו: השירה הפוליפונית הגאורגית, העממית והליטורגית, הוכרזה
    ב-2001 בידי אונסק"ו כיצירת מופת של המורשת שבעל פה והבלתי מוחשית של האנושות. הבזיליקה היא כלי מושלם
    עבורה. חלל אבן נמוך ומלבני צמוד את הקולות אל הקירות ושומר אותם דחוסים, במקום לפזרם כלפי מעלה כפי שקורה
    תחת כיפה גדולה. גם כמה זמרים בחזרה ממלאים כנסייה ריקה לגמרי.
  tip: >-
    עשרים עד שלושים דקות. הכנסייה קטנה ומתמלאת בזמן תפילה; אפשר להיכנס, אך לא להסתובב ולא לצלם. חלים כללי
    לבוש: מטפחת וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים. הפתח נמוך, שימו לב לראש. אין שירותים, והקרובים
    ביותר בבתי הקפה לאורך שאווטלי. בעיר עתיקה רועשת זו אחת הפינות השקטות באמת, והיא משתלבת היטב עם מגדל
    השעון של גבריאדזה במרחק כמה צעדים.
  route: >-
    רחוב שאווטלי צר ולמעשה להולכי רגל, אז אל תנסו להיכנס אליו ברכב. הגיעו מגשר בראטאשווילי או מרחוב ארקלה
    השני והשאירו את הרכב במקומות המסומנים במעלה בראטאשווילי, או בחניון התחתון של פארק ריקה, שממנו גשר
    השלום מוביל ישירות אל הכנסייה בשבע-שמונה דקות. ניסיון להידחק לסמטאות הפנימיות של העיר העתיקה מסתיים
    כמעט תמיד במבוי סתום או בדוח. רכב חסכוני ומעט סבלנות מספיקים.
ar:
  name: بازيليكا أنتشيسخاتي
  short: أقدم كنيسة باقية في تبليسي؛ بازيليكا ثلاثية الصحون من القرن السادس في شارع شافتيلي.
  body: >-
    **هذا أقدم مبنى في تبليسي ما زال يؤدي الغرض الذي بُني له.** شيّد أنتشيسخاتي في القرن السادس الملك
    داتشي بن واختانغ غورغاسالي بعد نقل العاصمة من متسخيتا إلى تبليسي. ومن السهل أن تمر بها دون أن تنتبه:
    كتلة واطئة عريضة محشورة في شارع شافتيلي الضيق، بلا ذلك الارتفاع الذي أعلنت به الكنائس الجورجية اللاحقة
    عن نفسها.


    والمخطط بازيليكا بثلاثة صحون بلا قبة، مبنية بمداميك متناوبة من الحجر والآجر. وكانت في الأصل مكرسة
    للعذراء. أما الاسم الحالي فجاء في القرن السابع عشر حين نُقلت إليها للحفظ أيقونة المخلص من دير أنتشي
    في كلارجيتي، وكانت تلك الأرض قد صارت بيد العثمانيين. والأيقونة نفسها اليوم في المجموعة الفنية للدولة،
    وفي الكنيسة نسخة عنها.


    وعند البوابة يقوم برج أجراس من الآجر بناه الكاثوليكوس دومنتي عام 1675، وهو لا يقل طرافة عن الكنيسة
    ذاتها. وفي القرن التاسع عشر أُضيفت قبة إلى البازيليكا، فأزالها ترميم الخمسينيات والستينيات وأعاد البناء
    إلى شكله الأول.


    والداخل فضاء واطئ معتم وهادئ جداً، على جدرانه بقايا رسوم من القرن التاسع عشر. غير أن ما يعيد كثيرين
    إلى هنا هو الصوت: فجوقة أنتشيسخاتي التي تؤدي الترتيل الجورجي متعدد الأصوات مقرها هذه الكنيسة. وأن
    تصادفهم في قداس عادي مسألة حظ، لكنك إن صادفتهم فذلك من أجمل ما يُسمع في المدينة.


    التعدد الصوتي الذي قد تسمعه هنا أقدم من المبنى نفسه: فقد أعلنت اليونسكو عام 2001 الغناء الجورجي المتعدد
    الأصوات، الشعبي والطقسي، تحفة من التراث الشفهي وغير المادي للبشرية. والبازيليكا وعاء مثالي له. فقاعة
    حجرية واطئة مستطيلة تضغط الأصوات على الجدران وتبقيها كثيفة بدل أن تبددها إلى الأعلى كما يحدث تحت قبة
    كبيرة. وحتى بضعة مرتلين في تمرين يملأون الكنيسة الخالية تماماً.
  tip: >-
    عشرون إلى ثلاثون دقيقة. الكنيسة صغيرة وتمتلئ أثناء القداس؛ يمكنك الدخول لا التنقل ولا التصوير. وتُطبّق
    قواعد اللباس: غطاء رأس وتنورة طويلة للنساء وسروال طويل للرجال. والمدخل منخفض فانتبه لرأسك. ولا توجد
    دورات مياه، وأقربها في مقاهي شافتيلي. وفي مدينة قديمة صاخبة هي واحدة من الزوايا الهادئة فعلاً، وتنسجم
    مع برج ساعة غابريادزه على بعد خطوات.
  route: >-
    شارع شافتيلي ضيق وللمشاة عملياً، فلا تحاول دخوله بالسيارة. اقترب من جسر باراتاشفيلي أو من شارع إيريكلي
    الثاني، واترك السيارة في الأماكن المخططة على صعود باراتاشفيلي أو في الموقف السفلي لحديقة ريكه، ومنه
    يوصلك جسر السلام مباشرة إلى الكنيسة في سبع أو ثماني دقائق. والتوغل في أزقة المدينة القديمة ينتهي غالباً
    بطريق مسدود أو مخالفة. وسيارة اقتصادية وقليل من الصبر يكفيان.
