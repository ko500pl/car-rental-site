ka:
  name: წინანდლის მამული და პარკი
  short: ალექსანდრე ჭავჭავაძის სასახლე, ინგლისური სტილის პარკი და საქართველოს პირველი ევროპული ტიპის მარანი.
  body: >-
    წინანდალი თელავიდან რვა კილომეტრში, ყვარლის გზაზეა და კახეთის ყველაზე მოწესრიგებული სამუზეუმო კომპლექსია.
    მამული პოეტ **ალექსანდრე ჭავჭავაძეს** ეკუთვნოდა — რომანტიზმის ერთ-ერთ ფუძემდებელს ქართულ ლიტერატურაში,
    რომელიც პეტერბურგში აღიზარდა და თან წამოღებული ევროპული გემოვნება მამულის მოწყობაში ჩადო. სახლი XIX
    საუკუნის პირველ ნახევარშია აშენებული და ინტერიერი იმდროინდელი ავეჯით, საოჯახო პორტრეტებითა და ბიბლიოთეკით
    არის აღდგენილი.


    სახლის უკან თორმეტჰექტრიანი დეკორატიული პარკია, სადაც ჭავჭავაძემ ევროპიდან და ახლო აღმოსავლეთიდან
    ჩამოტანილი სახეობები დარგო; ბილიკები, გაზონები და ხედი ალაზნის ველზე დღემდე შენარჩუნებულია. სწორედ
    აქ იმართებოდა მიღებები, რომლებზეც ალექსანდრე დიუმაც კი მოხვდა.


    ცალკე დათვალიერების ღირსია მარანი. 1835 წელს ჭავჭავაძემ აქ საქართველოში პირველი ევროპული ტიპის ღვინის
    საწარმო მოაწყო — ქვევრის ნაცვლად კასრებში დაძველება და ბოთლში ჩამოსხმა. მარნის კოლექციაში დღემდე ინახება
    მეცხრამეტე საუკუნის ბოთლები. ბილეთი ჩვეულებრივ სახლს და პარკს მოიცავს, დეგუსტაცია კი ცალკე ფასდება;
    ზაფხულში პარკში კლასიკური მუსიკის ფესტივალი ტარდება. ტერიტორიაზე ასევე მოქმედებს სასტუმრო და რამდენიმე
    რესტორანი, ამიტომ წინანდალი კარგი ადგილია სადილისთვის თელავისა და ყვარლის შუალედში. ვინც მუზეუმებით
    არ ინტერესდება, პარკის ბილეთსაც აიღებს და უბრალოდ ჩრდილში გაისეირნებს — ესეც სავსებით ღირებული გაჩერებაა.
  tip: >-
    წინანდალი კარგი გაჩერებაა შუადღისას, როცა ეკლესიების დათვალიერებისგან დაისვენებთ — პარკში ჩრდილია,
    ბენჩები და კაფე. ბილეთი სახლისა და პარკისთვისაა; მხოლოდ პარკში სეირნობა უფრო იაფია. დეგუსტაციაზე გაითვალისწინეთ,
    ვინ ატარებს მანქანას — საქართველოში ალკოჰოლის ზღვარი ძალიან მკაცრია. მანქანა შესასვლელთან, უფასო სადგომზე
    დგება. ორი საათი საკმარისია, ტუალეტი და ბანკომატი ტერიტორიაზეა.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე (95 კმ), შემდეგ ყვარლის მიმართულებით კიდევ რვა კილომეტრი
    — სულ დაახლოებით 100 კმ და ორ საათამდე. მამული პირდაპირ გზის პირასაა, დიდი სადგომითა და მითითებული
    შესასვლელით. მთელი მარშრუტი ასფალტიანია, ეკონომ კლასის მანქანა სავსებით საკმარისია. საწვავს თელავში
    ავსებთ. ზამთარში, გომბორის დაკეტვის შემთხვევაში, გამოიყენეთ კახეთის გზატკეცილი საგარეჯოსა და გურჯაანის
    გავლით — დაახლოებით ოცდახუთი კილომეტრით მეტი.
en:
  name: Tsinandali Estate
  short: The Chavchavadze family house, a landscaped English-style park and the first European-style winery
    in Georgia.
  body: >-
    Tsinandali lies eight kilometres from Telavi on the Kvareli road and is the most polished museum complex
    in Kakheti. The estate belonged to **Alexander Chavchavadze**, a founding figure of Georgian romanticism
    who was raised in St Petersburg and poured the European taste he brought back into the design of his
    property. The house dates from the first half of the nineteenth century, and the interiors have been
    restored with period furniture, family portraits and the library.


    Behind the house lies a twelve-hectare ornamental park in which Chavchavadze planted species brought
    from Europe and the Near East. The paths, lawns and the long view over the Alazani Valley survive,
    and it was here that the estate held the receptions that drew visitors as far afield as Alexandre
    Dumas, who wrote about his stay.


    The cellar deserves separate attention. In 1835 Chavchavadze set up the first European-style wine
    production in Georgia here — ageing in oak barrels and bottling, instead of the traditional qvevri.
    The cellar's library still holds bottles from the nineteenth century, and the estate lent its name
    to the dry white Tsinandali blend of Rkatsiteli and Mtsvane. A ticket normally covers the house and
    park, with tastings priced separately; in summer the park hosts a classical music festival.
  tip: >-
    Tsinandali works well in the middle of the day, when you want a break from churches — there is shade,
    benches and a café in the park. The standard ticket covers house and park; a park-only ticket is cheaper.
    If you plan to taste, decide in advance who drives: the drink-driving limit in Georgia is very strict
    and checks are frequent. Parking at the entrance is free. Two hours is enough, and there are toilets
    and an ATM on site.
  route: >-
    From Tbilisi cross the Gombori Pass to Telavi (95 km), then continue eight kilometres towards Kvareli
    — about 100 km and just under two hours in total. The estate sits directly on the road with a large
    car park and a signed entrance. The whole route is asphalt and an economy car is entirely adequate.
    Fill up in Telavi. In winter, if Gombori closes, take the Kakheti Highway through Sagarejo and Gurjaani
    instead, which adds roughly twenty-five kilometres.
ru:
  name: Усадьба Цинандали
  short: Дом Чавчавадзе, парк в английском стиле и первая в Грузии винодельня европейского типа.
  body: >-
    Цинандали находится в восьми километрах от Телави по дороге на Кварели и представляет собой самый
    ухоженный музейный комплекс Кахетии. Усадьба принадлежала **Александру Чавчавадзе** — одному из основоположников
    грузинского романтизма, выросшему в Петербурге и вложившему привезённый оттуда европейский вкус в
    устройство своего имения. Дом относится к первой половине XIX века, интерьеры восстановлены с мебелью
    эпохи, семейными портретами и библиотекой.


    За домом раскинулся декоративный парк площадью двенадцать гектаров, где Чавчавадзе высадил виды, привезённые
    из Европы и с Ближнего Востока. Дорожки, лужайки и длинный вид на Алазанскую долину сохранились до
    сих пор. Именно здесь проходили приёмы, о которых писал гостивший в усадьбе Александр Дюма.


    Отдельного внимания заслуживает винный погреб. В 1835 году Чавчавадзе устроил здесь первое в Грузии
    винодельческое производство европейского типа — выдержку в дубовых бочках и розлив в бутылки вместо
    традиционных квеври. В коллекции до сих пор хранятся бутылки XIX века, а имя усадьбы носит сухое белое
    «Цинандали» из ркацители и мцване. Билет обычно включает дом и парк, дегустации оплачиваются отдельно;
    летом в парке проходит фестиваль классической музыки.
  tip: >-
    Цинандали удобно ставить в середину дня, когда хочется передышки от храмов: в парке тень, скамейки
    и кафе. Обычный билет включает дом и парк, только парк стоит дешевле. Если планируете дегустацию,
    заранее решите, кто за рулём: допустимый уровень алкоголя в Грузии очень строгий, проверки частые.
    Парковка у входа бесплатная. Двух часов достаточно, туалет и банкомат есть на территории.
  route: >-
    Из Тбилиси через Гомборский перевал до Телави (95 км), затем ещё восемь километров в сторону Кварели
    — всего около 100 км и чуть меньше двух часов. Усадьба стоит прямо у дороги, с большой парковкой и
    обозначенным въездом. Весь маршрут асфальтовый, машины эконом-класса вполне достаточно. Заправляйтесь
    в Телави. Зимой, если Гомбори закрыт, поезжайте по Кахетинскому шоссе через Сагареджо и Гурджаани
    — это добавит примерно двадцать пять километров.
fa:
  name: ملک تسیناندالی
  short: خانهٔ خاندان چاوچاوادزه، پارکی آراسته به سبک انگلیسی و نخستین شراب‌سازی به شیوهٔ اروپایی در گرجستان.
  body: >-
    تسیناندالی هشت کیلومتر از تلاوی روی جادهٔ کوارلی قرار دارد و پرداخته‌ترین مجموعهٔ موزه‌ای کاختی است.
    این ملک از آنِ **الکساندر چاوچاوادزه** بود، از بنیان‌گذاران رمانتیسم گرجی که در سن‌پترزبورگ بزرگ شد
    و ذوق اروپایی خود را در طراحی این ملک ریخت. خانه به نیمهٔ نخست سدهٔ نوزدهم بازمی‌گردد و درون آن با
    اثاث همان دوره، تصاویر خانوادگی و کتابخانه بازسازی شده است.


    پشت خانه پارکی آذینی به وسعت دوازده هکتار گسترده است که چاوچاوادزه در آن گونه‌های آورده‌شده از اروپا
    و خاور نزدیک را کاشت. مسیرها، چمن‌ها و چشم‌انداز بلند رو به درهٔ آلازانی برجا مانده‌اند، و همین‌جا
    بود که ملک میهمانی‌هایی برپا می‌کرد که میهمانانی از دوردست مانند الکساندر دوما را می‌کشاند؛ دوما دربارهٔ
    اقامت خود نوشته است.


    سردابه توجه جداگانه می‌طلبد. در 1835 چاوچاوادزه نخستین تولید شراب به شیوهٔ اروپایی را در گرجستان اینجا
    راه انداخت — کهنه‌کردن در بشکه‌های بلوط و بطری‌کردن، به جای کوِوری سنتی. کتابخانهٔ سردابه هنوز بطری‌هایی
    از سدهٔ نوزدهم دارد، و نام ملک بر شراب سفید خشک تسیناندالی، ترکیبی از رکاتسیتلی و متسوانه، نشسته است.
    بلیت معمولاً خانه و پارک را پوشش می‌دهد و مزه‌کردن جداگانه قیمت دارد؛ تابستان‌ها پارک میزبان جشنوارهٔ
    موسیقی کلاسیک است.
  tip: >-
    تسیناندالی برای میانهٔ روز خوب جواب می‌دهد، وقتی از کلیساها استراحتی می‌خواهید — در پارک سایه، نیمکت
    و کافه هست. بلیت استاندارد خانه و پارک را در بر می‌گیرد؛ بلیت فقط‌پارک ارزان‌تر است. اگر قصد مزه‌کردن
    دارید، از پیش روشن کنید چه کسی رانندگی می‌کند: حد الکل رانندگی در گرجستان بسیار سخت‌گیرانه است و کنترل‌ها
    مکرر. پارک خودرو در ورودی رایگان است. دو ساعت کافی است و سرویس بهداشتی و خودپرداز در محل هست.
  route: >-
    از تفلیس از گردنهٔ گومبوری به تلاوی بروید (95 کیلومتر) و سپس هشت کیلومتر به سوی کوارلی ادامه دهید
    — روی‌هم حدود 100 کیلومتر و اندکی کمتر از دو ساعت. ملک درست کنار جاده است، با پارکینگ بزرگ و ورودی
    تابلودار. تمام مسیر آسفالت است و خودروی اقتصادی کاملاً کافی است. باک را در تلاوی پر کنید. در زمستان
    اگر گومبوری بسته شود، به جای آن بزرگراه کاختی را از ساگارجو و گورجانی بگیرید که حدود بیست‌وپنج کیلومتر
    اضافه می‌کند.
he:
  name: אחוזת צינאנדלי
  short: בית משפחת צ'אבצ'אוודזה, גן נוי בסגנון אנגלי והיקב הראשון בגאורגיה בסגנון אירופי.
  body: >-
    צינאנדלי שוכנת שמונה קילומטרים מטלאווי על הכביש לקווארלי, והיא מתחם המוזיאון המלוטש ביותר בקחתי. האחוזה
    הייתה שייכת ל**אלכסנדר צ'אבצ'אוודזה**, מאבות הרומנטיקה הגאורגית, שגדל בסנקט פטרבורג ויצק את הטעם האירופי
    שהביא עמו לתוך עיצוב נכסיו. הבית הוא מן המחצית הראשונה של המאה ה-19, והפנים שוחזר עם רהיטי התקופה,
    דיוקנאות המשפחה והספרייה.


    מאחורי הבית משתרע גן נוי בן שנים עשר הקטר, שבו שתל צ'אבצ'אוודזה מינים שהובאו מאירופה ומהמזרח הקרוב.
    השבילים, המדשאות והמבט הארוך אל עמק אלאזני שרדו, וכאן ערכה האחוזה את קבלות הפנים שמשכו אורחים רחוקים
    כמו אלכסנדר דיומא, שכתב על שהותו.


    המרתף ראוי לתשומת לב נפרדת. ב-1835 הקים כאן צ'אבצ'אוודזה את ייצור היין הראשון בגאורגיה בסגנון אירופי
    — יישון בחביות אלון ובקבוק, במקום הקווברי המסורתי. ספריית המרתף עדיין שומרת בקבוקים מן המאה ה-19,
    והאחוזה השאילה את שמה ליין הלבן היבש צינאנדלי, תערובת של רקאציטלי ומצוואנה. הכרטיס מכסה בדרך כלל את
    הבית ואת הגן, והטעימות מתומחרות בנפרד; בקיץ מתקיים בגן פסטיבל מוזיקה קלאסית.
  tip: >-
    צינאנדלי עובדת היטב באמצע היום, כשרוצים הפסקה מכנסיות — יש בגן צל, ספסלים ובית קפה. הכרטיס הרגיל מכסה
    בית וגן; כרטיס לגן בלבד זול יותר. אם בכוונתכם לטעום, החליטו מראש מי נוהג: סף השתייה בנהיגה בגאורגיה
    נוקשה מאוד והבדיקות תכופות. החניה בכניסה חינם. שעתיים מספיקות, ויש במקום שירותים וכספומט.
  route: >-
    מטביליסי חצו את מעבר גומבורי לטלאווי (95 ק"מ), ואז המשיכו שמונה קילומטרים לכיוון קווארלי — כ-100 ק"מ
    ומעט פחות משעתיים בסך הכול. האחוזה יושבת ישירות על הכביש, עם חניון גדול וכניסה מסומנת. כל המסלול אספלט
    ורכב חסכוני מספיק לחלוטין. תדלקו בטלאווי. בחורף, אם גומבורי נסגר, סעו במקום זאת בכביש קחתי דרך סאגארג'ו
    וגורג'אני, שמוסיף כעשרים וחמישה קילומטרים.
ar:
  name: ضيعة تسيناندالي
  short: بيت أسرة تشافتشافادزي وحديقة منسقة على الطراز الإنجليزي وأول إنتاج نبيذ أوروبي الطراز في جورجيا.
  body: >-
    تقع تسيناندالي على بعد ثمانية كيلومترات من تيلافي على طريق كفاريلي، وهي أكثر المجمعات المتحفية صقلاً
    في كاخيتي. كانت الضيعة ملكاً لـ**ألكسندر تشافتشافادزي**، أحد مؤسسي الرومانسية الجورجية، الذي نشأ في
    سان بطرسبرغ وصبّ الذوق الأوروبي الذي حمله معه في تصميم عقاره. يعود البيت إلى النصف الأول من القرن
    التاسع عشر، وقد رُمّمت داخليته بأثاث الحقبة وصور الأسرة والمكتبة.


    وخلف البيت تمتد حديقة زينة مساحتها اثنا عشر هكتاراً غرس فيها تشافتشافادزي أنواعاً جُلبت من أوروبا
    والشرق الأدنى. وقد بقيت الممرات والمروج والإطلالة الطويلة على وادي ألازاني، وهنا أقامت الضيعة حفلات
    الاستقبال التي اجتذبت زواراً من بعيد مثل ألكسندر دوما، الذي كتب عن إقامته.


    ويستحق القبو انتباهاً خاصاً. ففي عام 1835 أنشأ تشافتشافادزي هنا أول إنتاج نبيذ على الطراز الأوروبي
    في جورجيا — تعتيق في براميل البلوط وتعبئة في زجاجات، بدلاً من الكفيفري التقليدي. ولا تزال مكتبة القبو
    تحتفظ بزجاجات من القرن التاسع عشر، وقد أعارت الضيعة اسمها للنبيذ الأبيض الجاف تسيناندالي، وهو مزيج
    من ركاتسيتيلي ومتسفاني. وتشمل التذكرة عادة البيت والحديقة، أما التذوق فيُسعَّر منفصلاً؛ وفي الصيف
    تستضيف الحديقة مهرجاناً للموسيقى الكلاسيكية.
  tip: >-
    تصلح تسيناندالي لمنتصف النهار حين تريد استراحة من الكنائس — ففي الحديقة ظل ومقاعد ومقهى. التذكرة العادية
    تشمل البيت والحديقة، وتذكرة الحديقة وحدها أرخص. وإن كنت تنوي التذوق فاحسم مسبقاً من سيقود: حد الكحول
    أثناء القيادة في جورجيا صارم جداً والفحوص متكررة. الوقوف عند المدخل مجاني. ساعتان تكفيان، وفي الموقع
    دورات مياه وجهاز صراف.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي (95 كم)، ثم واصل ثمانية كيلومترات نحو كفاريلي — نحو 100 كم وأقل
    قليلاً من ساعتين إجمالاً. تقع الضيعة على الطريق مباشرة، بموقف كبير ومدخل معلَّم بلافتة. الطريق كله
    إسفلت والسيارة الاقتصادية كافية تماماً. تزود بالوقود في تيلافي. وفي الشتاء، إن أُغلق غومبوري، اسلك
    بدلاً منه طريق كاخيتي السريع عبر ساغاريجو وغورجاني، وهو يضيف نحو خمسة وعشرين كيلومتراً.
