ka:
  name: წინანდლის მამული და პარკი
  short: >-
    ალექსანდრე ჭავჭავაძის სასახლე, ინგლისური ყაიდის პარკი და მარანი, სადაც ქართული ღვინო პირველად ჩამოასხეს
    ბოთლში ევროპული წესით.
  body: >-
    **1854 წლის 2 ივლისს შამილის რაზმი წინანდალს შემოესია, სასახლე გაძარცვა, ცეცხლს მისცა და მეფე გიორგი
    XII-ის ორი შვილიშვილი დაღესტნის მთებში გაიტაცა.**


    შამილის ძის, ღაზი-მუჰამედის, რაზმმა ტყვედ წაიყვანა დავით ჭავჭავაძის მეუღლე ანა და მისი დაქვრივებული
    და ვარვარა ორბელიანი, შვილებითა და ნათესავებით, სულ ოცდაოთხი ადამიანი. ტყვეები 1855 წლის 22 მარტს
    დაბრუნდნენ: ისინი შამილის ტყვე ვაჟზე, ჯამალ ედ-დინზე, და ორმოცი ათას ვერცხლის მანეთზე გაცვალეს. გამოსასყიდის
    შესაგროვებლად დავითმა წინანდალი, მუკუზანი და ნაფარეული დააგირავა.


    გადამწვარი სასახლე კავკასიაში ერთ-ერთი ყველაზე ევროპული სახლი იყო. ალექსანდრე ჭავჭავაძე (1786–1846)
    პეტერბურგში დაიბადა და ეკატერინე II-ის ნათლული იყო. მამული მამისგან, გარსევანისგან, მიიღო, რომელსაც
    ეს მიწები ერეკლე II-მ უბოძა. 1818 წლიდან ალექსანდრემ აქ ფართოაივნიანი იტალიური სასახლე ააგო და საქართველოში
    პირველი ევროპული ყაიდის ბაღი გააშენა. პოეტი, გენერალი და ქართული რომანტიზმის ფუძემდებელი ალექსანდრე
    სახლს სტუმრებით, მუსიკითა და საკუთარი ღვინით ავსებდა; მისი უფროსი ქალიშვილი ნინო ალექსანდრე გრიბოედოვის
    მეუღლე გახდა.


    XIX საუკუნის 30-იან წლებში ჭავჭავაძემ მარანი გამართა და საქართველოში პირველმა ჩამოასხა ბოთლში ევროპული
    წესით დაყენებული ქართული ღვინო. დღეს ენოთეკაში 16 500-ზე მეტი ბოთლი ინახება, 1814 წლიდან მოყოლებული;
    მათ შორისაა 1861 წლის „შატო დ’იკემი“ და 1841 წლის საფერავი — ბოთლში ჩამოსხმული უძველესი ცნობილი ქართული
    ღვინო.


    ვალები ჭავჭავაძეებს აღარ მოშორებია. 1886 წლიდან მამული საიმპერატორო საუფლისწულო მამულების უწყებას
    ეკუთვნოდა და რომანოვების საზაფხულო რეზიდენციად გადაკეთდა; 1946 წელს, გიორგი ლეონიძის თაოსნობით, სახლ-მუზეუმი
    გაიხსნა. 2007 წლის რესტავრაციამ შენობა საბჭოური ჩანართებისგან გაათავისუფლა და ალექსანდრეს დროინდელი
    კედლები გამოაჩინა.


    პარკში გინკგო, იაპონური კრიპტომერია, მაგნოლია და ხნიერი ურთხელები ფრანგული რიგებით კი არა, თავისუფალი
    ინგლისური ჯგუფებით დგას, მათ მიღმა კი ალაზნის ველი იშლება. 2019 წლიდან აქ წინანდლის ფესტივალი იმართება
    — და სახლი ისევ სტუმრებით ივსება.
  tip: >-
    ორი საათი საკმარისია. ბილეთები რამდენიმე სახისაა: მხოლოდ პარკი ან პარკი მუზეუმთან ერთად, დეგუსტაცია
    კი ცალკე ღირს — ფასები ადგილზე გადაამოწმეთ. წინანდალი შუადღისთვის კარგი გაჩერებაა, როცა ეკლესიებით
    დაიღლებით: პარკში ჩრდილია, სკამები და კაფე, ტუალეტი და ბანკომატი ტერიტორიაზეა, სადგომი შესასვლელთან
    უფასოა. დეგუსტაციამდე გადაწყვიტეთ, ვინ დაჯდება საჭესთან — საქართველოში ნასვამ მძღოლს მკაცრად სჯიან
    და კახეთის გზებზე პოლიცია ხშირად ამოწმებს. ფესტივალის დღეებში სადგომი და ახლომახლო სასტუმროები წინასწარ
    ივსება.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) აღმოსავლეთისკენ გადით, ვაზიანთან შ38-ზე გადაუხვიეთ და გომბორის
    უღელტეხილით თელავამდე იარეთ — დაახლოებით 95 კმ; იქიდან ყვარლის გზას კიდევ რვა კილომეტრი გაუყევით.
    სულ დაახლოებით 100 კმ და ორ საათზე ცოტა ნაკლები. მამული პირდაპირ გზის პირასაა, მითითებული შესასვლელითა
    და დიდი სადგომით. გზა ბოლომდე ასფალტიანია, ეკონომ-კლასის მანქანა სავსებით საკმარისია; საწვავი თელავში
    ჩაასხით. ზამთარში, თუ გომბორი თოვლმა ჩაკეტა, კახეთის გზატკეცილით საგარეჯოსა და გურჯაანის გავლით იარეთ
    — ეს დაახლოებით 25 კილომეტრს მოგიმატებთ.
en:
  name: Tsinandali Estate
  short: >-
    Alexander Chavchavadze's palace, an English-style park and the cellar where Georgian wine was first
    bottled the European way, 8 km from Telavi.
  body: >-
    **On 2 July 1854 a raiding party sent by Imam Shamil broke into Tsinandali, looted the palace, set
    it on fire and carried two of King George XII's granddaughters off into the mountains of Dagestan.**


    Led by Shamil's son Ghazi-Muhammad, the raiders took Anna, wife of David Chavchavadze, her widowed
    sister Varvara Orbeliani and their children and relatives: 24 people in all. They came home on 22
    March 1855, exchanged for Shamil's captive son Jamal al-Din and 40,000 silver roubles. To raise the
    money David mortgaged Tsinandali, Mukuzani and Napareuli.


    The burned house had been among the most European in the Caucasus. Alexander Chavchavadze (1786–1846)
    was born in St Petersburg, a godson of Catherine the Great, and inherited the estate from his father
    Garsevan, to whom Erekle II had granted these lands. From 1818 Alexander built an Italianate palace
    with broad verandas here and laid out Georgia's first European-style garden. Poet, general and father
    of Georgian Romanticism, he filled the house with guests, music and his own wine; his eldest daughter,
    Nino, married the Russian playwright and diplomat Alexander Griboyedov.


    In the 1830s he built a cellar and became the first in Georgia to bottle Georgian wine the European
    way. The oenotheque now holds more than 16,500 bottles going back to 1814, among them an 1861 Château
    d'Yquem and an 1841 Saperavi, the oldest bottled Georgian wine known.


    The debts never went away. From 1886 the estate belonged to the imperial Crown and became a Romanov
    summer residence; in 1946, at the urging of the poet Giorgi Leonidze, the house opened as a museum,
    and a 2007 restoration stripped out Soviet additions to bare Alexander's original walls.


    In the park, ginkgo, Japanese cryptomeria, magnolia and old yews stand in loose English groups rather
    than French rows, with the Alazani valley opening beyond. Since 2019 the Tsinandali Festival has filled
    the grounds with music, and the house is full of guests again.
  tip: >-
    Two hours is enough. Tickets come in tiers: park only, or park with the museum, with tastings charged
    separately, so check prices at the gate. Tsinandali is a good midday stop when you have had enough
    of churches: the park has shade, benches and a café, there are toilets and an ATM on site, and parking
    at the entrance is free. Settle who is driving before the tasting, because Georgian police take drink-driving
    seriously and checks on Kakheti roads are frequent. During the festival, parking and nearby hotels
    fill up well in advance.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) east, branch onto the Sh38 near Vaziani and cross the Gombori
    Pass to Telavi, about 95 km, then continue eight kilometres along the Kvareli road. That makes about
    100 km and just under two hours. The estate sits right on the road, with a signed entrance and a large
    car park. It is asphalt all the way, so an economy car is perfectly adequate; fill up in Telavi. If
    snow closes Gombori in winter, take the Kakheti Highway through Sagarejo and Gurjaani instead, which
    adds roughly 25 km.
ru:
  name: Усадьба Цинандали
  short: >-
    Дворец Александра Чавчавадзе, парк в английском стиле и погреб, где грузинское вино впервые разлили
    по-европейски, — в 8 км от Телави.
  body: >-
    **2 июля 1854 года отряд, посланный имамом Шамилем, врывается в Цинандали, грабит дворец, поджигает
    его и увозит в горы Дагестана двух внучек царя Георгия XII.**


    Во главе с сыном Шамиля Гази-Мухаммадом налётчики захватили Анну, жену Давида Чавчавадзе, её овдовевшую
    сестру Варвару Орбелиани и их детей и родственников — всего 24 человека. 22 марта 1855 года их обменяли
    на пленного сына Шамиля Джамалуддина и 40 000 серебряных рублей, и они вернулись домой. Чтобы собрать
    эту сумму, Давид заложил Цинандали, Мукузани и Напареули.


    Сгоревший дом был одним из самых европейских на Кавказе. Александр Чавчавадзе (1786–1846) родился
    в Петербурге, был крестником Екатерины Великой и унаследовал усадьбу от отца Гарсевана, которому эти
    земли пожаловал Ираклий II. С 1818 года Александр строил здесь дворец в итальянском стиле с широкими
    верандами и заложил первый в Грузии сад в европейском стиле. Поэт, генерал и отец грузинского романтизма,
    он наполнял дом гостями, музыкой и собственным вином; его старшая дочь Нино вышла замуж за русского
    драматурга и дипломата Александра Грибоедова.


    В 1830-х годах он построил погреб и первым в Грузии стал разливать грузинское вино по-европейски.
    Энотека сегодня хранит более 16 500 бутылок, начиная с 1814 года, среди них шато д’Икем 1861 года
    и саперави 1841 года — самое старое известное грузинское вино в бутылках.


    Долги не отступили. С 1886 года усадьба принадлежала императорскому двору и стала летней резиденцией
    Романовых; в 1946 году, по настоянию поэта Георгия Леонидзе, дом открылся как музей, а реставрация
    2007 года удалила советские наслоения, обнажив первоначальные стены Александра.


    В парке гинкго, японская криптомерия, магнолии и старые тисы стоят свободными группами в английском
    духе, а не французскими рядами, а за ними открывается долина Алазани. С 2019 года усадьбу заполняет
    музыкой Цинандалийский фестиваль, и дом снова полон гостей.
  tip: >-
    Двух часов достаточно. Билеты бывают нескольких видов: только парк или парк с музеем, дегустации оплачиваются
    отдельно — цены уточняйте у входа. Цинандали — хорошая остановка в середине дня, когда церкви уже
    приелись: в парке есть тень, скамьи и кафе, на месте туалеты и банкомат, а парковка у входа бесплатная.
    Определите, кто за рулём, до дегустации: грузинская полиция серьёзно относится к вождению в пьяном
    виде, а проверки на кахетинских дорогах часты. Во время фестиваля парковка и близлежащие отели заполняются
    заранее.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) на восток, у Вазиани сверните на Sh38 и через Гомборский перевал
    доезжайте до Телави — около 95 км, затем ещё восемь километров по дороге на Кварели. Итого около 100
    км и чуть менее двух часов. Усадьба стоит прямо у дороги, с указателем и большой парковкой. Дорога
    асфальтирована на всём пути, так что машины эконом-класса вполне достаточно; заправьтесь в Телави.
    Если зимой Гомбори закрыт снегом, поезжайте по Кахетинской трассе через Сагареджо и Гурджаани — это
    добавит примерно 25 км.
fa:
  name: ملک تسیناندالی
  short: >-
    کاخ الکساندر چاوچاوادزه، باغی به سبک انگلیسی و سرداب شرابی که شراب گرجی نخستین‌بار به شیوهٔ اروپایی
    در آن بطری شد، هشت کیلومتر از تلاوی.
  body: >-
    **در دوم ژوئیهٔ ۱۸۵۴، گروهی از سوی امام شامیل به تسیناندالی یورش برد، کاخ را غارت کرد، آتش زد و دو
    نوهٔ پادشاه گئورگی دوازدهم را به کوهستان‌های داغستان برد.**


    به فرماندهی غازی‌محمد، پسر شامیل، یغماگران آنا، همسر داوید چاوچاوادزه، خواهر بیوهٔ او واروارا اوربلیانی
    و فرزندان و خویشاوندانشان را ربودند: در کل ۲۴ نفر. آن‌ها در ۲۲ مارس ۱۸۵۵ به خانه بازگشتند، در ازای
    جمال‌الدین، پسر اسیر شامیل، و چهل‌هزار روبل نقره‌ای. برای فراهم‌کردن این پول، داوید تسیناندالی، موکوزانی
    و ناپارئولی را در رهن گذاشت.


    خانهٔ سوخته یکی از اروپایی‌ترین خانه‌های قفقاز بود. الکساندر چاوچاوادزه (۱۷۸۶-۱۸۴۶) در سن‌پترزبورگ
    زاده شد، پسرِ تعمیدیِ کاترین کبیر، و ملک را از پدرش گارسِوان به میراث برد، که اِرِکله دوم این زمین‌ها
    را به او بخشیده بود. الکساندر از سال ۱۸۱۸ کاخی به سبک ایتالیایی با ایوان‌های گسترده در این‌جا ساخت
    و نخستین باغ به سبک اروپایی گرجستان را پی افکند. او که شاعر، ژنرال و پدر رمانتیسم گرجی بود، خانه را
    از میهمان، موسیقی و شراب خود پُر می‌کرد؛ دخترش نینو، بزرگ‌ترین فرزندش، با الکساندر گریبایدوف، نمایشنامه‌نویس
    و دیپلمات روسی، ازدواج کرد.


    او در دههٔ ۱۸۳۰ سرداب شرابی ساخت و نخستین کسی در گرجستان شد که شراب گرجی را به شیوهٔ اروپایی بطری
    کرد. اکنون گنجینهٔ شراب این ملک بیش از ۱۶٬۵۰۰ بطری از سال ۱۸۱۴ به بعد نگه می‌دارد، از جمله یک شاتو
    دیکم ۱۸۶۱ و یک ساپراوی ۱۸۴۱، کهن‌ترین شراب بطری‌شدهٔ گرجی که شناخته شده است.


    بدهی‌ها هرگز از میان نرفت. از سال ۱۸۸۶ این ملک به دربار امپراتوری تعلق داشت و اقامتگاه تابستانی رومانوف‌ها
    شد؛ در سال ۱۹۴۶، به درخواست شاعر گیورگی لئونیدزه، این خانه به موزه‌ای بدل شد، و بازسازی سال ۲۰۰۷ افزوده‌های
    شوروی را از میان برد تا دیوارهای اصلی الکساندر آشکار شود.


    در باغ، گینکو، سرو ژاپنی، ماگنولیا و سرخدارهای کهن به شیوهٔ آزادِ انگلیسی، نه ردیف‌های فرانسوی، ایستاده‌اند،
    و پس‌پشتشان درهٔ آلازانی گشوده می‌شود. از سال ۲۰۱۹ فستیوال تسیناندالی زمین‌های ملک را از موسیقی پر
    کرده، و خانه دوباره پر از میهمان است.
  tip: >-
    دو ساعت کافی است. بلیت‌ها چند نوع است: تنها باغ، یا باغ همراه با موزه، و چشیدن شراب جدا حساب می‌شود،
    پس قیمت‌ها را دم دروازه بپرسید. تسیناندالی توقفی خوب برای میانهٔ روز است، وقتی از کلیساها خسته شده‌اید:
    باغ سایه، نیمکت و کافه دارد، سرویس بهداشتی و دستگاه خودپرداز در محل هست، و پارکینگ کنار ورودی رایگان
    است. پیش از چشیدن شراب مشخص کنید چه کسی رانندگی می‌کند، چون پلیس گرجستان با رانندگی مستی جدی برخورد
    می‌کند و بازرسی در راه‌های کاختی معمول است. در ایام فستیوال، پارکینگ و هتل‌های نزدیک از پیش پُر می‌شوند.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق بگیرید، نزدیک وازیانی به Sh38 بپیچید و از گذرگاه گومبوری
    تا تلاوی بروید، حدود ۹۵ کیلومتر، سپس هشت کیلومتر دیگر در مسیر کوارلی ادامه دهید. این مجموعاً حدود
    ۱۰۰ کیلومتر و کمی کمتر از دو ساعت می‌شود. ملک درست کنار راه است، با ورودیِ دارای تابلو و پارکینگی
    بزرگ. راه تا انتها آسفالته است، پس خودروی اقتصادی کاملاً کافی است؛ در تلاوی سوخت‌گیری کنید. اگر زمستان
    گومبوری با برف بسته شود، از بزرگراه کاختی از راه ساگارِجو و گورجانی بگذرید، که حدود ۲۵ کیلومتر بیشتر
    می‌شود.
he:
  name: אחוזת צינאנדלי
  short: >-
    ארמונו של אלכסנדר צ׳בצ׳בדזה, פארק בסגנון אנגלי והמרתף שבו יין גאורגי בוקבק לראשונה בשיטה האירופית,
    שמונה ק״מ מטלאווי.
  body: >-
    **ב-2 ביולי 1854 פשטה חבורה שנשלחה בידי האימאם שאמיל על צינאנדלי, שדדה את הארמון, הציתה אותו וגררה
    שתי נכדות של המלך גאורגי השנים־עשר להרי דאגסטן.**


    בהנהגת בנו של שאמיל, גאזי-מוחמד, לקחו הפושטים את אנה, אשתו של דוד צ׳בצ׳בדזה, את אחותה האלמנה ורוורה
    אורבליאני ואת ילדיהן וקרוביהן: 24 בני אדם בסך הכול. הם חזרו הביתה ב-22 במרץ 1855, בתמורה לבנו השבוי
    של שאמיל, ג׳מאל אל-דין, ו-40,000 רובל כסף. כדי לגייס את הכסף משכן דוד את צינאנדלי, מוקוזני ונפאראולי.


    הבית שנשרף היה בין האירופיים ביותר בקווקז. אלכסנדר צ׳בצ׳בדזה (1786-1846) נולד בסנט פטרסבורג, וקתרינה
    הגדולה הייתה סנדקיתו. את האחוזה קיבל בירושה מאביו גרסבן, שארקלה השני העניק לו את האדמות הללו. מ-1818
    בנה אלכסנדר כאן ארמון בסגנון איטלקי עם מרפסות רחבות ונטע את הגן הראשון בסגנון אירופי בגאורגיה. משורר,
    גנרל ואבי הרומנטיקה הגאורגית, הוא מילא את הבית באורחים, במוזיקה וביין שלו; בתו הבכורה, נינו, נישאה
    למחזאי ולדיפלומט הרוסי אלכסנדר גריבויידוב.


    בשנות ה-1830 בנה מרתף והיה הראשון בגאורגיה שבקבק יין גאורגי בשיטה האירופית. האנותקה מחזיקה כיום למעלה
    מ-16,500 בקבוקים, הוותיקים שבהם משנת 1814, בהם שאטו ד׳איקם משנת 1861 וסאפראווי משנת 1841, היין הגאורגי
    המבוקבק העתיק ביותר הידוע.


    החובות לא נעלמו. מ-1886 השתייכה האחוזה לחצר הקיסרית והפכה למעון הקיץ של בית רומנוב; ב-1946, ביוזמת
    המשורר גיורגי לאונידזה, נפתח הבית כמוזיאון, ושיפוץ ב-2007 פירק את התוספות הסובייטיות וחשף את קירותיו
    המקוריים של אלכסנדר.


    בפארק עומדים גינקו, קריפטומריה יפנית, מגנוליה וטקסוסים עתיקים בקבוצות רפויות בנוסח אנגלי ולא בשורות
    צרפתיות, ומעֵבר להם נפתח עמק האלזני. מאז 2019 ממלא פסטיבל צינאנדלי את השטח במוזיקה, והבית מלא אורחים
    מחדש.
  tip: >-
    שעתיים מספיקות. הכרטיסים נמכרים בכמה דרגות: פארק בלבד, או פארק עם מוזיאון, וטעימות בתשלום נפרד, אז
    בדקו מחירים בשער. צינאנדלי היא תחנת צהריים טובה כשנמאס לכם מכנסיות: לפארק יש צל, ספסלים ובית קפה,
    יש שירותים וכספומט במקום, והחניה בכניסה חינם. החליטו מי נוהג לפני הטעימה, כי המשטרה הגאורגית מתייחסת
    בחומרה לנהיגה בשכרות ובדיקות בכבישי קאחתי שכיחות. בזמן הפסטיבל, החניה והמלונות הקרובים מתמלאים מוקדם.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) מזרחה, פנו לכביש Sh38 סמוך לוואזיאני וחצו את מעבר גומבורי לטלאווי,
    כ-95 ק״מ, ואז המשיכו עוד שמונה קילומטרים בכביש קוורלי. זה מסתכם בכ-100 ק״מ ומעט פחות משעתיים. האחוזה
    נמצאת ממש על הכביש, עם כניסה מסומנת וחניה גדולה. הכביש אספלט לכל אורכו, כך שרכב אקונומי מתאים בהחלט;
    תדלקו בטלאווי. אם שלג סוגר את גומבורי בחורף, סעו במקום זאת בכביש קאחתי דרך סאגארג׳ו וגורג׳אני, מה
    שמוסיף כ-25 ק״מ.
ar:
  name: ضيعة تسيناندالي
  short: >-
    قصر ألكسندر تشافتشافادزه، وحديقة على الطراز الإنجليزي، والقبو الذي عُبّئ فيه النبيذ الجورجي أول مرة
    بالطريقة الأوروبية، على بعد 8 كم من تيلافي.
  body: >-
    **في 2 يوليو 1854 هاجمت فرقة أرسلها الإمام شامل تسيناندالي، ونهبت القصر، وأحرقته، وأخذت حفيدتين للملك
    جورجي الثاني عشر إلى جبال داغستان.**


    بقيادة ابن شامل غازي-محمد، أسر الغزاة آنا، زوجة دافيد تشافتشافادزه، وأختها الأرملة فارفارا أوربيلياني،
    وأطفالهما وأقرباءهما: 24 شخصًا في المجموع. عادوا إلى ديارهم في 22 مارس 1855، مقابل تحرير جمال الدين،
    ابن شامل الأسير، و40,000 روبل فضي. ولجمع هذا المال، رهن دافيد تسيناندالي وموكوزاني ونابارئولي.


    كان البيت الذي احترق من أكثر البيوت أوروبية في القوقاز. وُلد ألكسندر تشافتشافادزه (1786-1846) في سانت
    بطرسبرغ، وكان ابنًا بالمعمودية لكاترين العظيمة، ووَرِث الضيعة عن والده غارسِفان، الذي منحه إيريكله
    الثاني هذه الأراضي. ومنذ 1818 بنى ألكسندر هنا قصرًا على الطراز الإيطالي بشرفات واسعة، وأنشأ أول حديقة
    على الطراز الأوروبي في جورجيا. وكان شاعرًا وجنرالًا وأبا الرومانسية الجورجية، فملأ البيت بالضيوف والموسيقى
    ونبيذه الخاص؛ وتزوجت ابنته الكبرى نينو من الكاتب المسرحي والدبلوماسي الروسي ألكسندر غريبايدوف.


    وفي الثلاثينيات من القرن التاسع عشر بنى قبوًا وكان أول من عبّأ النبيذ الجورجي بالطريقة الأوروبية في
    جورجيا. ويضم متحف النبيذ اليوم أكثر من 16,500 قنينة تعود إلى عام 1814 فصاعدًا، من بينها شاتو ديكم
    من عام 1861 وسابيرافي من عام 1841، وهو أقدم نبيذ جورجي معبّأ في قنانٍ معروف.


    لم تختفِ الديون أبدًا. ومنذ 1886 صارت الضيعة ملكًا للبلاط الإمبراطوري ومقرًا صيفيًا لعائلة رومانوف؛
    وفي 1946، بناءً على إصرار الشاعر جيورجي ليونيدزه، افتُتح البيت متحفًا، وأزالت ترميمات عام 2007 الإضافات
    السوفيتية لتكشف جدران ألكسندر الأصلية.


    في الحديقة، تقف أشجار الجنكة والسرو الياباني والماغنوليا وأشجار الطقسوس العتيقة في مجموعات فضفاضة
    على الطراز الإنجليزي لا في صفوف فرنسية، ويتّسع خلفها وادي ألازاني. ومنذ 2019 يملأ مهرجان تسيناندالي
    الأرض بالموسيقى، وعاد البيت مكتظًا بالضيوف من جديد.
  tip: >-
    ساعتان كافيتان. تُباع التذاكر بعدة فئات: الحديقة فقط، أو الحديقة مع المتحف، بينما تُحسب التذوقات بشكل
    منفصل، فتحقق من الأسعار عند البوابة. تسيناندالي محطة نهارية جيدة عندما تكتفي من الكنائس: في الحديقة
    ظل ومقاعد ومقهى، وتتوفر مرافق صحية وصرّاف آلي في الموقع، والموقف عند المدخل مجاني. حدّد من سيقود قبل
    التذوق، فالشرطة الجورجية تتعامل بجدية مع القيادة تحت تأثير الكحول والتفتيش على طرق كاختي معتاد. خلال
    المهرجان، تمتلئ مواقف السيارات والفنادق القريبة مسبقًا.
  route: >-
    من تبليسي، خذ طريق كاختي السريع (S5) شرقًا، وانحرف إلى Sh38 قرب فازياني، واعبر ممر غومبوري إلى تيلافي،
    نحو 95 كم، ثم تابع ثمانية كيلومترات أخرى على طريق كفاريلي. يصبح هذا نحو 100 كم وأقل من ساعتين بقليل.
    تقع الضيعة على الطريق مباشرة، ولها مدخل واضح وموقف سيارات كبير. الطريق مُعبَّد بالكامل، فسيارة اقتصادية
    كافية تمامًا؛ تزوّد بالوقود في تيلافي. إذا أغلق الثلج ممر غومبوري شتاءً، خذ طريق كاختي السريع عبر
    ساغاريجو وغورجاني بدلًا منه، وهذا يضيف نحو 25 كم.
