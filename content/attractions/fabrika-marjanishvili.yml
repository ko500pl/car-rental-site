ka:
  name: ფაბრიკა და მარჯანიშვილის უბანი
  short: >-
    საბჭოთა სამკერვალო ფაბრიკა, რომელიც ეზოდ, ჰოსტელად და ბარების ქუჩად იქცა, გარშემო კი ჩუღურეთი — ძველი,
    ხმაურიანი და ჯერ კიდევ გაუპრიალებელი.
  body: >-
    **საკერავი მანქანები დიდი ხანია გაჩუმდა, „ფაბრიკა“ კი ისევ ცვლებში მუშაობს: დღისით — ლეპტოპებით, ღამით
    — ჭიქებით.** ეგნატე ნინოშვილის ქუჩაზე მდგარი საბჭოთა სამკერვალო ფაბრიკა 2016 წელს ხელახლა გაიხსნა
    — ჰოსტელად, საერთო სამუშაო სივრცედ და ეზოდ, სავსე ბარებით, კაფეებით, სახელოსნოებითა და პატარა მაღაზიებით.
    რამდენიმე წელიწადში მან თბილისს ასწავლა, რა ექნა დაცარიელებული ქარხნებისთვის.


    მთავარი აქ ეზოა. შესვლა უფასოა, კედლები მოხატულია და დასაჯდომად არავინ გაიძულებთ, რამე იყიდოთ — ქალაქის
    ცენტრისთვის იშვიათი ფუფუნება. სამუშაო დღის შუადღეს ეზო მშვიდად ზუზუნებს, პარასკევ შუაღამისას კი ხმაურიანი,
    ახალგაზრდული და გადავსებულია. ბინადრებს შორის შეხვდებით „ვოდკასტს“, რომელიც თავს საქართველოს პირველ
    ფირფიტების მაღაზიას უწოდებს, და სამაგიდო თამაშების კლუბს 150-ზე მეტი თამაშით.


    გარშემო ჩუღურეთია — ბევრად უფრო ძველი, ვიდრე მისი დღევანდელი იერი გაფიქრებინებთ. 1707 წლის წყალობის
    სიგელი აქ სოფელ ჩუხურს იხსენიებს; სახელი თურქული სიტყვიდან მოდის და ორმოს, ღრმულს ნიშნავს. ქალაქს
    ჩუღურეთი 1824 წელს შეუერთდა. მის მთავარ ქუჩას, აღმაშენებლის გამზირს, პირველად გერმანული სახელი ერქვა
    — ალექსანდერდორფი, ამ ნაპირზე დასახლებული გერმანელი კოლონისტების ნაკვალევი; მერე მიხეილის ქუჩა გახდა,
    შემდეგ პლეხანოვისა, 1988 წლიდან კი დავით აღმაშენებლის სახელს ატარებს. 2010 წლიდან გამზირზე სამოცდაათამდე
    შენობა აღადგინეს.


    სიმართლე ისაა, რომ აღდგენა ძირითადად ფასადებზე შეჩერდა. ერთი კვარტლის იქით აივნები ხის საყრდენებს
    ეყრდნობა, ეზოები კი — ერთმანეთს. სწორედ ამიტომ ღირს აქ სიარული: უბანი დეკორაციად ჯერ არ გაუპრიალებიათ.


    ხუთ წუთში მარჯანიშვილის თეატრია, საარბრიუკენის მოედნიდან მდინარის გაღმა კი მშრალი ხიდის ბაზრობა. გვერდით
    ქუჩებში საცხობებში პურს ისევ ისე აკრავენ თონის კედლებს, როგორც მაშინ, როცა სიტყვა „ქოვორქინგი“ ჯერ
    არავის სმენოდა.
  tip: >-
    ეზოსა და უბანში ნელი სეირნობისთვის ორი საათი საკმარისია. ფაბრიკის ეზო მთელი დღე ღიაა და ტუალეტიც აქვს.
    პარასკევ-შაბათს საღამოობით ხალხმრავალი და ხმაურიანია; მშვიდი დროა სამუშაო დღის შუადღე. ბარები ბარათით
    ანგარიშსწორებას იღებს, პატარა დახლები და დროებითი ბაზრობები კი ნაღდ ფულს ამჯობინებს. აღმაშენებლის
    რესტორნები რვის შემდეგ ივსება — თუ კონკრეტულ ადგილს მიზნად ისახავთ, მაგიდა წინასწარ დაჯავშნეთ. უბანი
    ბრტყელია და ეტლითაც ძირითადად გასავლელია, თუმცა ტროტუარები ადგილ-ადგილ დაზიანებულია. გამზირიდან ერთი
    კვარტლით გადაუხვიეთ — უბანს ნამდვილი სახით მაშინ დაინახავთ.
  route: >-
    ფაბრიკა ცენტრიდან დაახლოებით 3 კილომეტრშია, საცობის მიხედვით 10–15 წუთის სავალზე: მარცხენა სანაპიროზე
    ბარათაშვილის ხიდით ან საარბრიუკენის მოედნის მხრიდან გადადით და აღმაშენებლის გამზირს ნინოშვილის ქუჩამდე
    გაჰყევით. საკუთარი სადგომი ფაბრიკას არ აქვს. ნინოშვილისა და ჯავახიშვილის ქუჩებზე ფასიან ადგილებს დღისით
    ჩვეულებრივ იპოვით, საღამოს — იშვიათად; უკეთესი შანსია მარჯანიშვილის მეტროს მიმდებარე ქუჩებში, საიდანაც
    ხუთი წუთის სავალია. ვიწრო ეზოებში ნუ შეხვალთ — გამოსვლა შესვლაზე ძნელია. ეკონომკლასის მანქანა საკმარისია,
    საღამოს ვიზიტისთვის კი სჯობს, მანქანა სასტუმროსთან დატოვოთ და რუსთაველიდან მეტროთი ერთი გაჩერება გაიაროთ.
en:
  name: Fabrika and the Marjanishvili District
  short: >-
    A Soviet sewing factory turned into a courtyard of bars, studios and a hostel, set in Chughureti —
    an old left-bank district not yet polished into a set.
  body: >-
    **The sewing machines fell silent long ago, but Fabrika still works in shifts: laptops by day, glasses
    by night.** The Soviet-era sewing factory on Egnate Ninoshvili Street reopened in 2016 as a hostel,
    a co-working space and a courtyard of bars, cafés, studios and small shops, and soon showed Tbilisi
    what to do with its empty factories.


    The courtyard is the point. Entry is free, the walls are painted, and nobody makes you buy anything
    to sit down — rare in a city centre. On a weekday afternoon it hums quietly; by Friday midnight it
    is loud, young and packed. Among the residents are Vodkast, which calls itself Georgia's first record
    shop, and a board-game club with more than 150 games.


    Around it lies Chughureti, far older than its present look suggests. A royal charter of 1707 mentions
    a village called Chukhuri here — the name comes from a Turkic word for a pit or hollow — and it was
    joined to the city in 1824. Its main street, Aghmashenebeli Avenue, first carried a German name, Alexanderdorf,
    a trace of the colonists who settled this bank; then it was Mikheil Street, then Plekhanov, and since
    1988 it has honoured King David the Builder. Since 2010 some seventy of its buildings have been restored.


    The honest part: the restoration mostly stopped at the façades. One block back, balconies lean on
    timber props and courtyards lean on each other. That is exactly why the district is worth walking
    — it has not been polished into a stage set.


    Five minutes away stands the Marjanishvili Theatre; across the river from Saarbrücken Square is the
    Dry Bridge flea market. And in the side streets the bakeries still slap tonis puri onto the walls
    of clay ovens, as they did long before anyone said "co-working".
  tip: >-
    Two hours covers the courtyard and a slow loop of the district. The yard is open all day and has toilets.
    Friday and Saturday nights are crowded and loud; weekday afternoons are the calm window. Bars take
    cards, but small stalls and pop-up markets prefer cash. Restaurants along Aghmashenebeli fill up after
    eight, so book if you have one in mind. The area is flat and mostly manageable with a wheelchair,
    though pavements break up in places. Step one block off the avenue to see the district as it really
    is.
  route: >-
    Fabrika is about 3 km from the centre, 10–15 minutes in traffic: cross to the left bank by Baratashvili
    Bridge or via Saarbrücken Square and follow Aghmashenebeli Avenue to Ninoshvili Street. There is no
    car park of its own. Paid bays on Ninoshvili and Javakhishvili streets usually have space by day and
    rarely in the evening; the streets around Marjanishvili metro, five minutes' walk away, are the better
    bet. Don't nose into the narrow courtyards — getting out is harder than getting in. An economy car
    is plenty; for an evening visit, leave it at the hotel and ride the metro one stop from Rustaveli.
ru:
  name: Фабрика и район Марджанишвили
  short: >-
    Советская швейная фабрика, ставшая двором с барами, мастерскими и хостелом, — в старом левобережном
    Чугурети, который ещё не отполировали до декорации.
  body: >-
    **Швейные машины давно замолчали, но Фабрика по-прежнему работает в две смены: днём — ноутбуки, ночью
    — бокалы.** Советская швейная фабрика на улице Эгнате Ниношвили открылась заново в 2016 году — хостелом,
    коворкингом и двором с барами, кафе, мастерскими и маленькими магазинами — и быстро показала Тбилиси,
    что делать с его опустевшими заводами.


    Главное здесь — двор. Вход свободный, стены расписаны, и никто не заставляет ничего покупать, чтобы
    присесть, — для центра города редкость. В будний день после обеда тут негромко гудит; к полуночи пятницы
    становится шумно, молодо и тесно. Среди обитателей — «Водкаст», называющий себя первым в Грузии магазином
    пластинок, и клуб настольных игр, где их больше 150.


    Вокруг лежит Чугурети, куда более старый, чем кажется по его нынешнему виду. Царская грамота 1707
    года упоминает здесь село Чухури — название восходит к тюркскому слову «яма, впадина», — а в 1824
    году его присоединили к городу. Главная улица района, проспект Агмашенебели, сначала носила немецкое
    имя Александердорф — след колонистов, осевших на этом берегу; потом была Михайловской, затем улицей
    Плеханова, а с 1988 года названа в честь царя Давида Строителя. С 2010 года здесь отреставрировали
    около семидесяти зданий.


    Если честно, реставрация в основном остановилась на фасадах. Шаг в соседний квартал — и балконы опираются
    на деревянные подпорки, а дворы — друг на друга. Именно поэтому по району и стоит гулять: его ещё
    не отполировали до театральной декорации.


    В пяти минутах — театр Марджанишвили; через реку от Саарбрюккенской площади — блошиный рынок у Сухого
    моста. А в переулках пекарни по-прежнему лепят тонис пури к стенкам глиняных печей — так же, как задолго
    до того, как кто-то произнёс слово «коворкинг».
  tip: >-
    Двух часов хватит на двор и неспешную прогулку по району. Двор открыт весь день, туалеты есть. Вечера
    пятницы и субботы людные и шумные; спокойное время — будние дни после обеда. Бары принимают карты,
    а маленькие прилавки и временные маркеты предпочитают наличные. Рестораны на Агмашенебели заполняются
    после восьми, так что, если присмотрели какой-то, забронируйте столик. Район ровный, на инвалидной
    коляске в основном проехать можно, хотя тротуары местами разбиты. Сверните на квартал в сторону от
    проспекта — и увидите район таким, какой он есть.
  route: >-
    Фабрика примерно в 3 км от центра, 10–15 минут с учётом пробок: переезжайте на левый берег по мосту
    Бараташвили или через Саарбрюккенскую площадь и следуйте по проспекту Агмашенебели до улицы Ниношвили.
    Своей парковки нет. Платные места на улицах Ниношвили и Джавахишвили днём обычно свободны, вечером
    — редко; надёжнее искать место на улицах у метро «Марджанишвили», в пяти минутах пешком. В узкие дворы
    не заезжайте: выбраться оттуда труднее, чем въехать. Машины эконом-класса вполне достаточно, а вечером
    лучше оставить её у гостиницы и проехать одну остановку на метро от «Руставели».
fa:
  name: فابریکا و محلهٔ مارجانیشویلی
  short: >-
    کارخانهٔ خیاطی دوران شوروی که حیاطی از بار و کارگاه و هاستل شده، در دل چوغورتی؛ محله‌ای کهن در کرانهٔ
    چپ که هنوز به دکور صحنه بدل نشده.
  body: >-
    **چرخ‌های خیاطی دیری است خاموش شده‌اند، اما فابریکا هنوز دو نوبته کار می‌کند: روزها لپ‌تاپ، شب‌ها
    جام.** کارخانهٔ خیاطی دوران شوروی در خیابان اگناته نینوشویلی در ۲۰۱۶ دوباره گشوده شد، این بار در قامت
    هاستل، فضای کار اشتراکی و حیاطی از بار و کافه و کارگاه و مغازه‌های کوچک، و خیلی زود به تفلیس نشان
    داد با کارخانه‌های خالی‌اش چه کند.


    اصل ماجرا همین حیاط است. ورود رایگان است، دیوارها نقاشی شده‌اند و کسی مجبورتان نمی‌کند برای نشستن
    چیزی بخرید؛ چیزی که در مرکز شهر کمیاب است. بعدازظهرِ روزهای کاری آرام زمزمه می‌کند؛ نیمه‌شب جمعه پرسروصدا،
    جوان و لبریز است. در میان ساکنانش «وودکاست» است که خود را نخستین فروشگاه صفحهٔ گرامافون گرجستان می‌داند،
    و باشگاهی با بیش از ۱۵۰ بازی رومیزی.


    پیرامونش چوغورتی گسترده است، بسیار کهن‌تر از آنچه ظاهر امروزش نشان می‌دهد. فرمانی شاهانه از سال ۱۷۰۷
    از روستایی به نام چوخوری در همین‌جا یاد می‌کند، نامی برگرفته از واژه‌ای ترکی به معنای گودال یا فرورفتگی،
    و این روستا در ۱۸۲۴ به شهر پیوست. خیابان اصلی‌اش، خیابان آغماشنبلی، نخست نامی آلمانی داشت، آلکساندردورف،
    یادگار مهاجرانی که در این کرانه ساکن شدند؛ سپس خیابان میخائیل شد، بعد پلخانف، و از ۱۹۸۸ به نام شاه
    داوود سازنده است. از ۲۰۱۰ تاکنون حدود هفتاد بنای آن مرمت شده است.


    حقیقت این است که مرمت بیشتر در حد نماها ماند. یک بلوک عقب‌تر، بالکن‌ها به شمع‌های چوبی تکیه داده‌اند
    و حیاط‌ها به یکدیگر. درست به همین دلیل قدم زدن در این محله می‌ارزد: هنوز صیقلش نداده‌اند تا دکور صحنه
    شود.


    پنج دقیقه آن‌سوتر تئاتر مارجانیشویلی ایستاده است؛ آن سوی رود، روبه‌روی میدان زاربروکن، بازار دست‌دوم
    پل خشک. و در کوچه‌های فرعی نانوایی‌ها هنوز نان تونیس‌پوری را به دیوارهٔ تنورهای گلی می‌چسبانند، درست
    مثل روزگاری که هنوز کسی از «کار اشتراکی» حرفی نزده بود.
  tip: >-
    دو ساعت برای حیاط و گشتی آرام در محله کافی است. حیاط تمام روز باز است و سرویس بهداشتی دارد. شب‌های
    جمعه و شنبه شلوغ و پرسروصداست؛ بعدازظهرِ روزهای کاری وقت آرامش است. بارها کارت می‌پذیرند، اما بساط‌های
    کوچک و بازارچه‌های موقت پول نقد را ترجیح می‌دهند. رستوران‌های خیابان آغماشنبلی بعد از ساعت هشت پر
    می‌شوند؛ اگر جای خاصی در نظر دارید، رزرو کنید. محله هموار است و بیشترش با ویلچر پیمودنی، هرچند پیاده‌روها
    جابه‌جا شکسته‌اند. یک بلوک از خیابان اصلی فاصله بگیرید تا محله را همان‌طور که واقعاً هست ببینید.
  route: >-
    فابریکا حدود ۳ کیلومتر از مرکز شهر فاصله دارد، بسته به ترافیک ۱۰ تا ۱۵ دقیقه: از پل باراتاشویلی یا
    از راه میدان زاربروکن به کرانهٔ چپ بروید و خیابان آغماشنبلی را تا خیابان نینوشویلی دنبال کنید. پارکینگ
    اختصاصی ندارد. جای پارک پولی در خیابان‌های نینوشویلی و جاواخیشویلی روزها معمولاً پیدا می‌شود و شب‌ها
    به‌ندرت؛ کوچه‌های اطراف ایستگاه متروی مارجانیشویلی، پنج دقیقه پیاده، گزینهٔ مطمئن‌تری‌اند. با خودرو
    وارد حیاط‌های تنگ نشوید؛ بیرون آمدن سخت‌تر از وارد شدن است. خودروی اکونومی کاملاً کافی است؛ برای شب‌گردی،
    ماشین را در هتل بگذارید و از ایستگاه روستاولی یک ایستگاه با مترو بیایید.
he:
  name: פבריקה ורובע מרג'נישווילי
  short: >-
    מפעל תפירה סובייטי שהפך לחצר של ברים, סטודיואים והוסטל, בלב צ'וגורטי — רובע ותיק בגדה השמאלית שעוד
    לא לוטש לכדי תפאורה.
  body: >-
    **מכונות התפירה השתתקו מזמן, אבל פבריקה עדיין עובדת במשמרות: ביום מחשבים ניידים, בלילה כוסות.** מפעל
    התפירה הסובייטי ברחוב אגנטה נינושווילי נפתח מחדש ב-2016 כהוסטל, כמתחם עבודה משותף וכחצר של ברים, בתי
    קפה, סטודיואים וחנויות קטנות, ומהר מאוד הראה לטביליסי מה אפשר לעשות במפעלים הנטושים שלה.


    החצר היא העיקר. הכניסה חופשית, הקירות מצוירים, ואיש לא מחייב אתכם לקנות משהו כדי לשבת — דבר נדיר במרכז
    עיר. בצהרי יום חול היא מזמזמת בשקט; בחצות של יום שישי היא רועשת, צעירה וגדושה. בין הדיירים: "וודקאסט",
    שמציגה את עצמה כחנות התקליטים הראשונה בגאורגיה, ומועדון משחקי קופסה עם יותר מ-150 משחקים.


    מסביב משתרע צ'וגורטי, ותיק בהרבה ממה שמראהו היום מרמז. כתב מלכותי משנת 1707 מזכיר כאן כפר בשם צ'וחורי
    — השם בא ממילה טורקית שפירושה בור או שקע — וב-1824 הוא סופח לעיר. הרחוב הראשי שלו, שדרות אגמשנבלי,
    נשא תחילה שם גרמני, אלכסנדרדורף, זכר למתיישבים שהשתקעו בגדה הזאת; אחר כך נקרא רחוב מיכאיל, אחר כך
    פלחאנוב, ומאז 1988 הוא נושא את שמו של המלך דוד הבונה. מאז 2010 שוחזרו בו כשבעים בניינים.


    האמת היא שהשחזור נעצר ברובו בחזיתות. רחוב אחד פנימה המרפסות נשענות על תמוכות עץ והחצרות נשענות זו
    על זו. ובדיוק בגלל זה כדאי להסתובב ברובע: עוד לא ליטשו אותו לכדי תפאורה.


    חמש דקות משם עומד תיאטרון מרג'נישווילי; מעבר לנהר, מול כיכר זארבריקן, שוק הפשפשים של הגשר היבש. ובסמטאות
    הצדדיות המאפיות עדיין מטיחות את לחם הטוניס פורי אל דפנות תנורי החמר, בדיוק כפי שעשו הרבה לפני שמישהו
    אמר "עבודה משותפת".
  tip: >-
    שעתיים מספיקות לחצר ולסיבוב איטי ברובע. החצר פתוחה כל היום ויש בה שירותים. בלילות שישי ושבת צפוף ורועש;
    צהרי ימי החול הם החלון השקט. הברים מקבלים כרטיסי אשראי, אבל דוכנים קטנים ושווקים זמניים מעדיפים מזומן.
    המסעדות בשדרות אגמשנבלי מתמלאות אחרי שמונה, אז אם יש לכם מקום מסוים בראש, הזמינו מראש. האזור שטוח
    וברובו נגיש בכיסא גלגלים, אף שהמדרכות שבורות פה ושם. התרחקו רחוב אחד מהשדרה כדי לראות את הרובע כפי
    שהוא באמת.
  route: >-
    פבריקה נמצאת כ-3 ק"מ מהמרכז, 10–15 דקות בתנועה: עברו לגדה השמאלית בגשר ברטשווילי או דרך כיכר זארבריקן,
    והמשיכו בשדרות אגמשנבלי עד רחוב נינושווילי. אין חניון משלה. במקומות החניה בתשלום ברחובות נינושווילי
    וג'אווחישווילי יש בדרך כלל מקום ביום ולעתים רחוקות בערב; הרחובות סביב תחנת המטרו מרג'נישווילי, חמש
    דקות הליכה, הם הימור טוב יותר. אל תיכנסו ברכב לחצרות הצרות — לצאת משם קשה יותר מלהיכנס. רכב חסכוני
    מספיק בהחלט; לביקור ערב השאירו אותו במלון וסעו במטרו תחנה אחת מרוסתוולי.
ar:
  name: فابريكا وحي مارجانيشفيلي
  short: >-
    مصنع خياطة سوفييتي صار فناءً من الحانات والمراسم ونُزُلاً للشباب، وسط تشوغوريتي، الحي العريق على الضفة
    اليسرى الذي لم يُصقَل بعد ليصير ديكوراً.
  body: >-
    **سكتت آلات الخياطة منذ زمن بعيد، لكن فابريكا ما زالت تعمل بنوبتين: الحواسيب المحمولة نهاراً والكؤوس
    ليلاً.** أُعيد افتتاح مصنع الخياطة السوفييتي في شارع إغناتي نينوشفيلي عام 2016 نُزُلاً للشباب ومساحة
    عمل مشتركة وفناءً من الحانات والمقاهي والمراسم والمتاجر الصغيرة، وسرعان ما أظهر لتبليسي ما يمكن أن
    تصنعه بمصانعها الخاوية.


    الفناء هو بيت القصيد. الدخول مجاني، والجدران مرسومة، ولا أحد يلزمك بشراء شيء كي تجلس، وهذا نادر في
    قلب مدينة. في عصر يوم من أيام الأسبوع يدندن المكان بهدوء؛ وعند منتصف ليل الجمعة يصير صاخباً شاباً
    مكتظاً. ومن بين قاطنيه متجر "فودكاست"، الذي يقدّم نفسه على أنه أول متجر للأسطوانات في جورجيا، ونادٍ
    لألعاب الطاولة يضم أكثر من 150 لعبة.


    وحوله يمتد حي تشوغوريتي، وهو أقدم بكثير مما يوحي به مظهره اليوم. فبراءة ملكية تعود إلى عام 1707 تذكر
    هنا قرية تُدعى تشوخوري — والاسم مأخوذ من كلمة تركية تعني الحفرة أو المنخفض — وقد ضُمّت إلى المدينة
    عام 1824. وشارعه الرئيسي، جادة أغماشينيبيلي، حمل أولاً اسماً ألمانياً هو ألكسندردورف، أثراً من المستوطنين
    الذين استقروا على هذه الضفة؛ ثم صار شارع ميخائيل، ثم شارع بليخانوف، ومنذ عام 1988 يحمل اسم الملك داود
    البنّاء. ومنذ عام 2010 رُمّم فيه نحو سبعين مبنى.


    والحق يقال إن الترميم توقف في معظمه عند الواجهات. فعلى بعد شارع واحد إلى الداخل تستند الشرفات إلى
    دعامات خشبية، وتستند الأفنية بعضها إلى بعض. ولهذا بالذات يستحق الحي أن تمشي فيه: فهو لم يُصقَل بعد
    ليصير ديكور مسرح.


    على بعد خمس دقائق يقوم مسرح مارجانيشفيلي؛ وعلى الضفة المقابلة، قبالة ساحة زاربروكن، سوق الأغراض المستعملة
    عند الجسر الجاف. وفي الأزقة الجانبية ما زالت المخابز تلصق خبز التونيس بوري على جدران أفران الطين،
    كما كانت تفعل قبل أن ينطق أحد بعبارة «العمل المشترك» بزمن طويل.
  tip: >-
    تكفي ساعتان للفناء ولجولة متمهلة في الحي. الفناء مفتوح طوال اليوم وفيه دورات مياه. ليالي الجمعة والسبت
    مزدحمة وصاخبة؛ أما عصر أيام الأسبوع فهو النافذة الهادئة. تقبل الحانات البطاقات، لكن الأكشاك الصغيرة
    والأسواق المؤقتة تفضّل النقد. وتمتلئ مطاعم جادة أغماشينيبيلي بعد الثامنة، فاحجز إن كان في بالك مطعم
    بعينه. المنطقة مستوية ويمكن التنقل فيها بالكرسي المتحرك في الغالب، وإن كانت الأرصفة متكسرة في بعض
    المواضع. ابتعد شارعاً واحداً عن الجادة لترى الحي على حقيقته.
  route: >-
    تبعد فابريكا نحو 3 كم عن المركز، أي 10–15 دقيقة بحسب الازدحام: اعبر إلى الضفة اليسرى من جسر باراتاشفيلي
    أو عبر ساحة زاربروكن، ثم اتبع جادة أغماشينيبيلي حتى شارع نينوشفيلي. لا موقف سيارات خاصاً بها. وفي
    أماكن الوقوف المدفوعة في شارعي نينوشفيلي وجافاخيشفيلي متسع عادة في النهار، ونادراً في المساء؛ والشوارع
    المحيطة بمحطة مترو مارجانيشفيلي، على بعد خمس دقائق سيراً، رهان أفضل. لا تدخل بسيارتك الأفنية الضيقة،
    فالخروج منها أصعب من الدخول. تكفي سيارة اقتصادية تماماً، وفي الزيارة المسائية اتركها في الفندق واركب
    المترو محطة واحدة من روستافيلي.
