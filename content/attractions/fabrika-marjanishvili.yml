ka:
  name: ფაბრიკა და მარჯანიშვილის უბანი
  short: საბჭოთა სამკერვალო ფაბრიკა, რომელიც ეზოიან საზოგადოებრივ სივრცედ გადაკეთდა, და მის გარშემო არსებული
    ჩუღურეთი.
  body: >-
    **ფაბრიკა ის ადგილია, სადაც თბილისმა საბჭოთა შენობის ხელახლა გამოყენება ისწავლა.** ეგნატე ნინოშვილის
    ქუჩაზე მდგარი სამკერვალო ფაბრიკა 2016 წელს გადაკეთდა: შენობის კორპუსში ჰოსტელი და საერთო სამუშაო სივრცე
    შევიდა, შუა ეზო კი გაიხსნა ბარებით, კაფეებით, სახელოსნოებით და პატარა მაღაზიებით.


    ეზოში შესვლა უფასოა და ეს არსებითია — თბილისში ცოტაა ადგილი, სადაც უბრალოდ ჯდომა შეიძლება ისე, რომ
    არაფერი შეიძინო. დღისით აქ მშვიდია და ბევრი ლეპტოპია, საღამოს ხმაურიანი ხდება; ღამის ორის შემდეგ მეზობლებს
    ეს არ უხარიათ.


    გარშემო ჩუღურეთია — უბანი, რომელიც 1817 წელს გერმანელმა კოლონისტებმა დაარსეს და რომელსაც დიდხანს „ახალი
    ტფილისი" ერქვა. მისი ბადისებრი გეგმა სწორედ იმ დროიდან მოდის.


    ორ ნაბიჯში:


    - მარჯანიშვილის მოედანი და კოტე მარჯანიშვილის დრამატული თეატრი, რომელიც თბილისში 1930 წლიდან მუშაობს


    - აღმაშენებლის გამზირის აღდგენილი მონაკვეთი მარჯანიშვილიდან საარბრიუკენის მოედნამდე, სადაც XIX საუკუნის
    ფასადები 2016 წელს განახლდა


    - საარბრიუკენის ხიდი და მისგან გახსნილი ხედი მდინარეზე


    სიმართლე ისაა, რომ აღდგენა ფასადებზე შეჩერდა: ერთი კვარტლის იქით სახლები ჯერ კიდევ ბოძებით არის შეკავებული
    და ეზოები დანგრეულია. სწორედ ეს კონტრასტი ხდის უბანს საინტერესოს — ის ჯერ არ არის „მოწესრიგებული".


    ფაბრიკის შემდეგ თბილისში საბჭოთა შენობების ხელახალი გამოყენება მოდად იქცა და კიდევ რამდენიმე ქარხანა
    და საწყობი გადაკეთდა. თუმცა უბნის საუკეთესო ნაწილი მაინც ის არის, რაც ფაბრიკამდე იყო: ჩუღურეთის პატარა
    სასადილოები, ხინკლის სახლები და საცხობები, სადაც თონის პური დღეში სამჯერ ცხვება. საღამოს რვის შემდეგ
    ეს ქუჩები ცენტრზე ცოცხალია და ფასებიც შესამჩნევად დაბალი.
  tip: >-
    ორი საათი საკმარისია ეზოსთვის და უბანში სეირნობისთვის. ფაბრიკის ეზო მთელი დღე ღიაა და ტუალეტიც აქვს;
    საღამოს, განსაკუთრებით პარასკევს და შაბათს, ხალხმრავალია და ხმაურიანი. ბარები ტერმინალით მუშაობს,
    ბაზრობებზე კი ნაღდი გჭირდება. აღმაშენებლის რესტორნები საღამოს ივსება — მაგიდის დაჯავშნა სჯობს. უბანი
    ბრტყელია და სიარულისთვის კომფორტული, ეტლითაც გასავლელი, თუმცა ტროტუარები ადგილ-ადგილ დაზიანებულია.
  route: >-
    ცენტრიდან ბარათაშვილის ან საარბრიუკენის ხიდით მარცხენა ნაპირზე გადადი და აღმაშენებლის გამზირს გაჰყევი
    — 4 კმ, 15 წუთი. ფაბრიკას საკუთარი პარკინგი არ აქვს. ნინოშვილისა და ჯავახიშვილის ქუჩებზე ზონალური
    ადგილებია, დღისით ჩვეულებრივ მოიძებნება, საღამოს — არა. კარგი ალტერნატივა მარჯანიშვილის მეტროსადგურის
    მიმდებარე ქუჩებია, საიდანაც 5 წუთის სავალია. ვიწრო ეზოებში შესვლა არ ღირს — გამოსვლა უფრო რთულია,
    ვიდრე შესვლა. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Fabrika and the Marjanishvili District
  short: A Soviet sewing factory turned into a courtyard of bars and studios, and the old German quarter
    around it.
  body: >-
    **Fabrika is where Tbilisi learned what to do with a Soviet building.** The sewing factory on Egnate
    Ninoshvili Street was converted in 2016: a hostel and co-working floors went into the block, and the
    central yard was opened up with bars, cafes, workshops and small independent shops.


    Walking into the yard is free, and that matters. There are few places in Tbilisi where you can simply
    sit for an hour without buying anything. By day it is calm and full of laptops; by evening it fills
    up and gets loud, and after two in the morning the neighbours are not enthusiastic.


    Around it lies Chughureti, a district founded in 1817 by German colonists and long known as New Tiflis.
    Its regular grid of streets dates from that settlement, which is why this part of the left bank looks
    nothing like the old town.


    Within a few minutes' walk:


    - Marjanishvili Square and the Kote Marjanishvili Drama Theatre, working in Tbilisi since 1930


    - the restored stretch of Agmashenebeli Avenue between Marjanishvili and Saarbrücken squares, where
    nineteenth-century facades were renovated in 2016


    - Saarbrücken Bridge, named for the twin city, with a good view along the river


    The honest note is that the restoration stopped at the facades. One block back, houses are still held
    up by timber props and the courtyards are in poor shape. That contrast is much of what makes the district
    interesting: it has not been tidied into a set.


    Fabrika started a wave: since 2016 several other Soviet factories and warehouses in Tbilisi have been
    converted the same way. Still, the best part of the district is what was here before Fabrika arrived
    — the small canteens of Chughureti, the khinkali houses, and the bakeries where tonis puri comes out
    of the clay oven three times a day. After eight in the evening these streets are livelier than the
    centre, and noticeably cheaper.
  tip: >-
    Two hours covers the yard and a walk around the district. The Fabrika courtyard is open all day and
    has toilets. Evenings, especially Friday and Saturday, are crowded and loud. Bars take cards; small
    market stalls in the yard want cash. Restaurants along Agmashenebeli fill up after eight, so book
    a table if you have somewhere in mind. The district is flat and comfortable to walk, and mostly manageable
    with a wheelchair, though the pavements are broken in places.
  route: >-
    From the centre cross to the left bank by Baratashvili or Saarbrücken bridge and follow Agmashenebeli
    Avenue — 4 km, fifteen minutes. Fabrika has no car park of its own. There are metered bays on Ninoshvili
    and Javakhishvili streets, usually findable by day and not in the evening. A good alternative is the
    streets around Marjanishvili metro station, five minutes' walk away. Do not drive into the narrow
    courtyards; getting out is harder than getting in. An economy car is enough.
ru:
  name: Фабрика и район Марджанишвили
  short: Советская швейная фабрика, ставшая двором с барами и мастерскими, и старый немецкий квартал вокруг.
  body: >-
    **Фабрика — место, где Тбилиси научился обращаться с советским зданием.** Швейную фабрику на улице
    Эгнате Ниношвили переоборудовали в 2016 году: в корпус въехали хостел и коворкинг, а внутренний двор
    раскрыли, разместив там бары, кафе, мастерские и маленькие независимые магазины.


    Войти во двор бесплатно, и это существенно: в Тбилиси мало мест, где можно просто просидеть час, ничего
    не покупая. Днём здесь спокойно и много ноутбуков, вечером людно и шумно, а после двух ночи соседи
    этому не рады.


    Вокруг лежит Чугурети — район, основанный в 1817 году немецкими колонистами и долго называвшийся Новым
    Тифлисом. Его регулярная сетка улиц идёт от того поселения, поэтому эта часть левого берега совсем
    не похожа на старый город.


    В нескольких минутах ходьбы:


    - площадь Марджанишвили и Драматический театр имени Коте Марджанишвили, работающий в Тбилиси с 1930
    года


    - отреставрированный отрезок проспекта Агмашенебели между площадями Марджанишвили и Саарбрюккен, где
    фасады XIX века обновили в 2016 году


    - Саарбрюккенский мост, названный в честь города-побратима, с хорошим видом вдоль реки


    Честно говоря, реставрация остановилась на фасадах. Через квартал дома по-прежнему стоят на деревянных
    подпорках, а дворы в плохом состоянии. Именно этот контраст и делает район интересным: его ещё не
    превратили в декорацию.


    Фабрика запустила волну: с 2016 года в Тбилиси таким же образом переделали ещё несколько советских
    заводов и складов. И всё же лучшее в районе — то, что было здесь до Фабрики: маленькие столовые Чугурети,
    хинкальные и пекарни, где тонис пури достают из глиняной печи трижды в день. После восьми вечера эти
    улицы живее центра и заметно дешевле.
  tip: >-
    Двух часов хватает на двор и прогулку по кварталу. Двор Фабрики открыт весь день, туалеты есть. Вечера,
    особенно пятница и суббота, шумные и людные. Бары принимают карты, мелкие прилавки во дворе хотят
    наличные. Рестораны на Агмашенебели заполняются после восьми, столик лучше забронировать. Район ровный
    и удобный для ходьбы, в основном проходим и в кресле-коляске, хотя тротуары местами разбиты.
  route: >-
    Из центра переезжайте на левый берег по мосту Бараташвили или Саарбрюккенскому и следуйте по проспекту
    Агмашенебели — 4 км, пятнадцать минут. Собственной парковки у Фабрики нет. Размеченные места есть
    на улицах Ниношвили и Джавахишвили: днём обычно находятся, вечером нет. Хороший вариант — улицы у
    станции метро «Марджанишвили», оттуда пять минут пешком. Во внутренние дворы заезжать не стоит: выехать
    сложнее, чем въехать. Достаточно машины эконом-класса.
fa:
  name: فابریکا و محلهٔ مارجانیشویلی
  short: کارخانهٔ خیاطی دورهٔ شوروی که به حیاطی از بارها و کارگاه‌ها بدل شد، و محلهٔ آلمانی‌نشین کهن پیرامونش.
  body: >-
    **فابریکا جایی است که تفلیس آموخت با یک ساختمان شوروی چه کند.** کارخانهٔ خیاطی خیابان اگناته نینوشویلی
    در ۲۰۱۶ بازسازی شد: هاستل و طبقه‌های کار اشتراکی به بدنهٔ ساختمان آمدند و حیاط میانی با بارها و کافه‌ها
    و کارگاه‌ها و مغازه‌های کوچک مستقل باز شد.


    ورود به حیاط رایگان است و همین مهم است. در تفلیس جاهای کمی هست که بتوان یک ساعت نشست بی‌آنکه چیزی
    بخری. روزها آرام است و پر از لپ‌تاپ؛ عصرها شلوغ و پرصدا می‌شود، و پس از ساعت دو بامداد همسایه‌ها چندان
    راضی نیستند.


    پیرامون آن چوغورتی است، محله‌ای که در ۱۸۱۷ مهاجران آلمانی بنیاد نهادند و مدت‌ها «تفلیس نو» خوانده
    می‌شد. شبکهٔ منظم کوچه‌هایش از همان سکونتگاه می‌آید، و به همین سبب این بخش از کرانهٔ چپ هیچ شباهتی
    به شهر قدیم ندارد.


    در چند دقیقه پیاده‌روی:


    - میدان مارجانیشویلی و تئاتر درام کوته مارجانیشویلی که از ۱۹۳۰ در تفلیس کار می‌کند


    - تکهٔ مرمت‌شدهٔ خیابان آغماشنبلی میان میدان‌های مارجانیشویلی و زاربروکن، که نماهای سدهٔ نوزدهم آن
    در ۲۰۱۶ نو شد


    - پل زاربروکن، نام‌گرفته از شهر خواهرخوانده، با منظره‌ای خوب در امتداد رود


    نکتهٔ صادقانه آنکه مرمت در حد نما متوقف شد. یک بلوک آن‌سوتر خانه‌ها هنوز با شمع چوبی نگه داشته می‌شوند
    و حیاط‌ها خراب‌اند. همین تضاد است که محله را جالب می‌کند: هنوز به دکور بدل نشده.


    فابریکا موجی راه انداخت: از ۲۰۱۶ چند کارخانه و انبار شوروی دیگر در تفلیس به همین شیوه بازآفرینی شده‌اند.
    با این حال بهترین بخش محله همان چیزی است که پیش از فابریکا اینجا بود: غذاخوری‌های کوچک چوغورتی، خانه‌های
    خینکالی، و نانوایی‌هایی که نان تندیری را روزی سه بار از تنور بیرون می‌آورند. پس از ساعت هشت شب این
    کوچه‌ها از مرکز شهر زنده‌ترند و آشکارا ارزان‌تر.
  tip: >-
    دو ساعت برای حیاط و گشتی در محله کافی است. حیاط فابریکا تمام روز باز است و سرویس بهداشتی دارد. عصرها،
    به‌ویژه جمعه و شنبه، شلوغ و پرصداست. بارها کارت می‌پذیرند و بساط‌های کوچک حیاط پول نقد می‌خواهند.
    رستوران‌های آغماشنبلی بعد از ساعت هشت پر می‌شوند، پس اگر جایی در نظر دارید میز رزرو کنید. محله هموار
    و برای پیاده‌روی راحت است و بیشتر مسیرها با ویلچر شدنی، هرچند پیاده‌روها جابه‌جا شکسته‌اند.
  route: >-
    از مرکز شهر با پل باراتاشویلی یا پل زاربروکن به کرانهٔ چپ بروید و خیابان آغماشنبلی را دنبال کنید؛
    ۴ کیلومتر، پانزده دقیقه. فابریکا پارکینگ اختصاصی ندارد. در خیابان‌های نینوشویلی و جاواخیشویلی جای‌های
    خط‌کشی‌شده هست که روزها معمولاً پیدا می‌شود و عصرها نه. گزینهٔ خوب دیگر کوچه‌های اطراف ایستگاه مترو
    مارجانیشویلی است، پنج دقیقه پیاده. وارد حیاط‌های تنگ نشوید؛ بیرون آمدن سخت‌تر از رفتن است. خودروی
    اقتصادی کافی است.
he:
  name: פבריקה ורובע מרג'נישווילי
  short: בית חרושת סובייטי לתפירה שהפך לחצר של ברים וסדנאות, והרובע הגרמני הישן שסביבו.
  body: >-
    **פבריקה היא המקום שבו טביליסי למדה מה לעשות עם מבנה סובייטי.** מפעל התפירה ברחוב אגנטה נינושווילי
    הוסב ב-2016: הוסטל וקומות עבודה משותפת נכנסו למבנה, והחצר המרכזית נפתחה עם ברים, בתי קפה, סדנאות וחנויות
    עצמאיות קטנות.


    הכניסה לחצר חינם, וזה חשוב. יש בטביליסי מעט מקומות שאפשר פשוט לשבת בהם שעה בלי לקנות דבר. ביום שקט
    שם ומלא מחשבים ניידים; בערב מתמלא ונעשה רועש, ואחרי שתיים בלילה השכנים פחות נלהבים.


    סביבה משתרע צ'וגורטי, רובע שייסדו ב-1817 מתיישבים גרמנים והיה ידוע זמן רב כטיפליס החדשה. רשת הרחובות
    הישרה שלו מגיעה מאותה התיישבות, ולכן חלק זה של הגדה השמאלית אינו דומה כלל לעיר העתיקה.


    במרחק דקות הליכה:


    - כיכר מרג'נישווילי ותיאטרון הדרמה על שם קוטה מרג'נישווילי, הפועל בטביליסי מאז 1930


    - הקטע המשוחזר של שדרות אגמשנבלי בין כיכר מרג'נישווילי לכיכר זארבריקן, שחזיתותיו מן המאה ה-19 חודשו
    ב-2016


    - גשר זארבריקן, הקרוי על שם עיר התאומה, ובו נוף טוב לאורך הנהר


    ההערה הכנה היא שהשחזור נעצר בחזיתות. בלוק אחד אחורה הבתים עדיין נתמכים בקורות עץ והחצרות במצב רע.
    הניגוד הזה הוא חלק גדול ממה שמעניין ברובע: הוא עדיין לא סודר לכדי תפאורה.


    פבריקה פתחה גל: מאז 2016 הוסבו בטביליסי באותה דרך עוד כמה מפעלים ומחסנים סובייטיים. ובכל זאת, החלק
    הטוב ביותר ברובע הוא מה שהיה כאן לפני פבריקה — מסעדות הפועלים הקטנות של צ'וגורטי, בתי החינקלי, והמאפיות
    שבהן לחם התנור יוצא מן התנור שלוש פעמים ביום. אחרי שמונה בערב הרחובות האלה תוססים יותר מן המרכז, וזולים
    בהרבה.
  tip: >-
    שעתיים מכסות את החצר וסיבוב ברובע. חצר פבריקה פתוחה כל היום ויש בה שירותים. הערבים, במיוחד שישי ושבת,
    צפופים ורועשים. הברים מקבלים כרטיסים; דוכנים קטנים בחצר רוצים מזומן. המסעדות לאורך אגמשנבלי מתמלאות
    אחרי שמונה, אז הזמינו שולחן אם יש לכם מקום בראש. הרובע מישורי ונוח להליכה, ורובו עביר גם בכיסא גלגלים,
    אף שהמדרכות שבורות במקומות.
  route: >-
    מן המרכז חצו לגדה השמאלית בגשר בראטאשווילי או בגשר זארבריקן והמשיכו בשדרות אגמשנבלי — 4 ק״מ, חמש-עשרה
    דקות. לפבריקה אין חניון משלה. יש מקומות מסומנים ברחובות נינושווילי וג'אווכישווילי, שנמצאים בדרך כלל
    ביום ולא בערב. חלופה טובה היא הרחובות סביב תחנת הרכבת התחתית מרג'נישווילי, חמש דקות הליכה. אל תיכנסו
    ברכב לחצרות הצרות; לצאת קשה יותר מלהיכנס. רכב חסכוני מספיק.
ar:
  name: فابريكا وحي مارجانيشفيلي
  short: مصنع خياطة سوفييتي تحوّل إلى فناء من الحانات والمشاغل، والحي الألماني القديم من حوله.
  body: >-
    **فابريكا هي المكان الذي تعلمت فيه تبليسي ماذا تفعل بمبنى سوفييتي.** فقد حُوّل مصنع الخياطة في شارع
    إغناتي نينوشفيلي عام 2016: دخل إلى الكتلة نُزل وطوابق للعمل المشترك، وفُتح الفناء الأوسط بحانات ومقاهٍ
    ومشاغل ومتاجر صغيرة مستقلة.


    والدخول إلى الفناء مجاني، وهذا مهم. فقليلة هي الأماكن في تبليسي التي يمكنك الجلوس فيها ساعة دون أن
    تشتري شيئاً. نهاراً هادئ ومليء بالحواسيب المحمولة؛ ومساءً يمتلئ ويعلو صوته، وبعد الثانية فجراً لا
    يكون الجيران متحمسين.


    ومن حوله يمتد حي تشوغوريتي، وقد أسسه عام 1817 مستوطنون ألمان وعُرف طويلاً باسم تفليس الجديدة. وشبكته
    المستقيمة من الشوارع تعود إلى تلك المستوطنة، ولهذا لا يشبه هذا الجزء من الضفة اليسرى المدينة القديمة
    في شيء.


    وعلى بعد دقائق مشياً:


    - ميدان مارجانيشفيلي ومسرح كوته مارجانيشفيلي للدراما، العامل في تبليسي منذ 1930


    - المقطع المرمم من جادة أغماشينيبيلي بين ميداني مارجانيشفيلي وزاربروكن، حيث جُددت واجهات القرن التاسع
    عشر عام 2016


    - جسر زاربروكن، المسمى باسم المدينة التوأم، وفيه إطلالة جيدة على امتداد النهر


    والملاحظة الصادقة أن الترميم توقف عند الواجهات. فعلى بعد بناية واحدة ما زالت البيوت مسنودة بدعائم
    خشبية والأفنية في حال سيئة. وهذا التناقض جزء كبير مما يجعل الحي مثيراً للاهتمام: فهو لم يُرتّب بعد
    ليصير ديكوراً.


    أطلقت فابريكا موجة: فمنذ 2016 حُوّل في تبليسي بالطريقة نفسها عدد من المصانع والمخازن السوفييتية الأخرى.
    ومع ذلك يبقى أفضل ما في الحي هو ما كان هنا قبل فابريكا: مطاعم تشوغوريتي الصغيرة، وبيوت الخينكالي،
    والأفران التي يخرج منها خبز التنور ثلاث مرات في اليوم. وبعد الثامنة مساءً تكون هذه الشوارع أكثر حيوية
    من المركز، وأرخص بوضوح.
  tip: >-
    ساعتان تغطيان الفناء وجولة في الحي. وفناء فابريكا مفتوح طوال اليوم وفيه دورات مياه. والأمسيات، وخاصة
    الجمعة والسبت، مزدحمة وصاخبة. والحانات تقبل البطاقات، أما البسطات الصغيرة في الفناء فتريد نقداً. ومطاعم
    أغماشينيبيلي تمتلئ بعد الثامنة، فاحجز طاولة إن كان لديك مكان بعينه. والحي مستوٍ ومريح للمشي، ومعظمه
    صالح للكرسي المتحرك، وإن كانت الأرصفة مكسورة في مواضع.
  route: >-
    من وسط المدينة اعبر إلى الضفة اليسرى عبر جسر باراتاشفيلي أو جسر زاربروكن وتابع جادة أغماشينيبيلي؛
    4 كم وخمس عشرة دقيقة. ولا موقف خاصاً لفابريكا. وهناك أماكن مخططة في شارعي نينوشفيلي وجاواخيشفيلي،
    تُوجد نهاراً عادة ولا تُوجد مساءً. وبديل جيد شوارع محطة مترو مارجانيشفيلي على بعد خمس دقائق مشياً.
    ولا تدخل بالسيارة إلى الأفنية الضيقة، فالخروج أصعب من الدخول. وسيارة اقتصادية تكفي.
