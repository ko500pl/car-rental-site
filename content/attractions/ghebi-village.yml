ka:
  name: ღები
  short: >-
    მაღალმთიანი ქვის სოფელი რიონის ზემო წელზე, 1503 წლიდან ცნობილი, სადაც ბატონების წინააღმდეგ აჯანყების
    თქმულებას დღემდე ტაბლით იხსენიებენ.
  body: >-
    **1901 წელს ღებში თითქმის ორი ათასი კაცი ცხოვრობდა, 2014 წლის აღწერამ კი 296 დაითვალა.**


    სოფელი ზღვის დონიდან 1350 მეტრზე, რიონის მარცხენა ნაპირზე, ონიდან გზით დაახლოებით 30 კილომეტრზე, მთიანი
    რაჭის სიღრმეში დგას. წერილობით წყაროებში 1503 წლიდან იხსენიება. XVIII საუკუნეში ვახუშტი ბატონიშვილი
    წერდა: „ღები, ...დაბა მოზღუდვილი და კოშკოვანი გოდლოვანი“, ამ მხარეს კი მაგარ, ვიწრო და მტრისთვის მიუვალ
    ადგილად ახასიათებდა.


    სახელს ორგვარად ხსნიან. სვანურად „ღებ“ ჩაღრმავებულ ადგილს ნიშნავს. ხალხური თქმულება კი ლტოლვილზე მოგვითხრობს:
    ერთ მღებავს ლეჩხუმში კაცი შემოაკვდა, მთის რაჭას შეეხიზნა და აქ თავის ხელობას განაგრძობდა — მისი ღებვიდან
    წარმოსდგა სოფლის სახელიც. პირველ მოსახლედ ჩვეშოდან გადმოსული ხოშიტა ლობჯანიძე ითვლება, რომელმაც რიონის
    მარჯვენა ნაპირზე თავისი კოშკი ააგო.


    ყველაზე ხშირად ღებში სხვა, უფრო მძიმე ამბავს ყვებიან. გადმოცემით, თავისუფალი ღებელები ბატონყმობას
    ვერ შეურიგდნენ და თავიანთი ბატონების, არიშიძეების, წინააღმდეგ შეითქვნენ; შეთქმულებას ზვიადა ლობჯანიძე
    მეთაურობდა. მოსყიდული მოურავის დახმარებით ნადირობიდან დაბრუნებული ორი ძმა არიშიძე მოკლეს. მესამემ
    რიონზე ცხენით გასვლა განიზრახა; ქალმა, სახელად დოდუკმა, სთხოვა, წყალში გაეყვანა. შუა მდინარეში დოდუკმა
    ბატონი ცხენიდან გადმოათრია და ორივე დაიღუპა. დოდუკს წინასწარ ჰქონდა დაბარებული: არიშიძის სიკვდილის
    შემდეგ მისთვის ერთი ტაბლა გამოეცხოთ. ეს ანდერძი დღემდე სრულდება — როცა ღებში ვინმე კვდება, ჭირისუფალი
    ორ ტაბლას დოდუკის მოსახსენიებლადაც აცხობს.


    ღებიდან 11 კილომეტრით ზემოთ, რიონის ხეობაში, ბრილში, 1939–1961 წლების გათხრებმა ლითონის დამუშავების
    კვალი გამოავლინა — ძვ. წ. XVIII საუკუნიდან ახ. წ. IV საუკუნემდე, ანუ ბევრად ადრე, ვიდრე ღების სახელს
    ვინმე დაწერდა.


    ღებმა ხალხის დიდი ნაწილი დაკარგა. დოდუკი — არა.
  tip: >-
    ღებს ფეხით ერთი-ორი საათი დაუთმეთ. კოშკები და ძველი ქვის სახლები უმეტესად კერძოა: ქუჩიდან დაათვალიერეთ,
    ეზოში შესვლამდე ან ვინმეს გადაღებამდე კი ნებართვა ითხოვეთ. ონის იქით ბანკომატი, აფთიაქი და ბენზინგასამართი
    აღარ არის — ნაღდი ფული და მარაგი თან იქონიეთ. ღამის გასათევი წინასწარ მოძებნეთ; 17 კილომეტრში, გლოლაში,
    საოჯახო სასტუმროებია. მობილური კავშირი საიმედო არ არის, 1350 მეტრზე კი ივლისის საღამოებიც გრილია.
    ღებიდან მთების გადაღმა, ქვემო სვანეთში, ზესხომდე, სასვანოს ტბების გავლით რამდენიმედღიანი ლაშქრობა
    მიდის — ის მხოლოდ აღჭურვილი მოლაშქრეებისთვისაა და ადგილობრივ გიდს მოითხოვს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ქუთაისამდე, შემდეგ შ17-ით ჩრდილოეთით, ტყიბულისა და ნაქერალას
    უღელტეხილის გავლით ამბროლაურამდე, იქიდან კი შ16-ით რიონის ხეობას ონამდე აუყევით. შ16-ზე დარჩით და
    უწერა გაიარეთ; საგლოლოში, ონიდან დაახლოებით 19 კილომეტრში, მარცხნივ შ121-ზე გადაუხვიეთ და ჭიორის გავლით
    ბოლო 11 კილომეტრი ღებამდე გაიარეთ. სულ დაახლოებით 390 კმ და შვიდიოდე საათია. ონამდე ასფალტი კარგია,
    შემდეგ გზა ვიწრო და დაკერებულია, ბოლო მონაკვეთი კი ნაწილობრივ ხრეშიანია, მდინარეს გაუყვება და ძლიერი
    წვიმის შემდეგ შეიძლება ჩამოირეცხოს. ჯიპი ან კროსოვერი ჯობია. საწვავის ჩასხმის ბოლო შესაძლებლობა ონშია.
en:
  name: Ghebi
  short: >-
    A stone village high on the Rioni, recorded since 1503, where a legend of revolt against the lords
    is still honoured with funeral bread.
  body: >-
    **In 1901 nearly two thousand people lived in Ghebi; the 2014 census found 296.**


    The village stands at 1,350 metres on the left bank of the Rioni, about 30 km by road above Oni, deep
    in upper Racha. Written sources mention it from 1503. In the 18th century Prince Vakhushti described
    Ghebi as a walled township of towers and battlements, in country he called strong, narrow and hard
    for any enemy to reach.


    Its name has two explanations. In Svan, gheb means a hollow, a sunken place. Local tradition prefers
    a fugitive: a dyer who killed a man in Lechkhumi, fled into the Racha mountains and carried on his
    trade here, so that the village took its name from ghebva, 'to dye'. The first settler, it is said,
    was Khoshita Lobjanidze from Chvesho, who built his tower on the right bank.


    The story Ghebi tells most is harder. According to tradition the villagers, free men who would not
    accept serfdom, rose against their lords, the Arishidzes, under Zviada Lobjanidze. With the help of
    a bribed steward they killed two Arishidze brothers as they rode home from the hunt. The third set
    out to ford the Rioni on horseback, and a woman named Doduk begged him to carry her across. In midstream
    she dragged him from the saddle, and both drowned. She had asked beforehand that, once Arishidze was
    dead, a ritual loaf be baked for her. The wish is still kept: when someone in Ghebi dies, the family
    bakes two loaves in Doduk's memory.


    Eleven kilometres higher up the Rioni, at Brili, excavations between 1939 and 1961 found traces of
    metalworking from the 18th century BC to the 4th century AD, long before anyone wrote Ghebi's name
    down.


    Ghebi has lost most of its people. It has not lost Doduk.
  tip: >-
    Give Ghebi an hour or two on foot. The towers and old stone houses are mostly private, so admire them
    from the lanes and ask before stepping into a yard or photographing anyone. There is no ATM, pharmacy
    or fuel beyond Oni: bring cash and supplies. Arrange a bed in advance; Glola, 17 km away, has guesthouses.
    Mobile signal is unreliable, and even in July the evenings at 1,350 metres are cool. The multi-day
    trek from Ghebi over the mountains to Zeskho in Lower Svaneti, past the Sasvano lakes, is for equipped
    hikers with a local guide.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, the Sh17 north through Tkibuli and over the Nakerala
    pass to Ambrolauri, then the Sh16 up the Rioni to Oni. Stay on the Sh16 through Utsera; at Saglolo,
    about 19 km beyond Oni, turn left onto the Sh121 and follow it through Chiora for the last 11 km to
    Ghebi. In all it is about 390 km and some seven hours. The asphalt is good as far as Oni; beyond it
    the road is narrow and patched, and the final stretch is partly gravel, running beside the river and
    prone to washouts after heavy rain. An SUV is the sensible class. Oni has the last fuel.
ru:
  name: Геби
  short: >-
    Каменное село в верховьях Риони, известное с 1503 года, где легенду о восстании против господ до сих
    пор чтят поминальным хлебом.
  body: >-
    **В 1901 году в Геби жили почти две тысячи человек; перепись 2014 года насчитала 296.**


    Село стоит на высоте 1350 метров на левом берегу Риони, примерно в 30 км по дороге выше Они, в самой
    глубине Верхней Рачи. Письменные источники упоминают его с 1503 года. В XVIII веке царевич Вахушти
    описал Геби как обнесённое стеной местечко с башнями и зубчатыми укреплениями — в краю, который он
    назвал крепким, тесным и труднодоступным для любого врага.


    Названию дают два объяснения. По-свански «геб» — впадина, низина. Местное предание предпочитает историю
    беглеца: красильщик, убивший человека в Лечхуми, скрылся в рачинских горах и продолжил здесь своё
    ремесло, так что село получило имя от слова «гебва» — «красить». Первым поселенцем, говорят, был Хошита
    Лобжанидзе из Чвешо, поставивший свою башню на правом берегу.


    Историю, которую в Геби рассказывают чаще всего, слушать тяжелее. По преданию, сельчане — свободные
    люди, не желавшие мириться с крепостной зависимостью, — восстали против своих господ Аришидзе под
    предводительством Звиады Лобжанидзе. С помощью подкупленного управляющего они убили двух братьев Аришидзе,
    когда те возвращались верхом с охоты. Третий решил перейти Риони вброд на коне, и женщина по имени
    Додук упросила его перевезти её на другой берег. Посреди потока она стащила его с седла, и оба утонули.
    Заранее она попросила, чтобы после гибели Аришидзе в её честь испекли обрядовый хлеб. Эту волю исполняют
    до сих пор: когда в Геби кто-то умирает, семья печёт два хлеба в память о Додук.


    В одиннадцати километрах выше по Риони, у Брили, раскопки 1939–1961 годов обнаружили следы металлообработки
    с XVIII века до н. э. по IV век н. э. — задолго до того, как кто-то записал имя Геби.


    Большую часть своих людей Геби потеряло. Додук — нет.
  tip: >-
    Отведите Геби час-другой пешей прогулки. Башни и старые каменные дома в основном частные, поэтому
    любуйтесь ими с улочек и спрашивайте разрешения, прежде чем зайти во двор или сфотографировать кого-то.
    Дальше Они нет ни банкомата, ни аптеки, ни заправки: запаситесь наличными и всем необходимым. О ночлеге
    договоритесь заранее; в Глоле, в 17 км отсюда, есть гостевые дома. Мобильная связь ненадёжна, и даже
    в июле вечера на высоте 1350 метров прохладные. Многодневный переход из Геби через горы в Зесхо в
    Нижней Сванетии, мимо озёр Сасвано, — только для хорошо экипированных туристов с местным проводником.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh17 на север через Ткибули и перевал Накерала
    до Амбролаури, а оттуда по Sh16 вверх по Риони до Они. Оставайтесь на Sh16 и проезжайте Уцеру; в Саглоло,
    примерно в 19 км за Они, сверните налево на Sh121 и последние 11 км езжайте по ней через Чиору до
    Геби. Всего около 390 км и примерно семь часов. До Они асфальт хороший; дальше дорога узкая и латаная,
    а последний участок частично гравийный: он идёт вдоль реки, и после сильных дождей его нередко размывает.
    Разумный выбор — внедорожник. Последняя заправка — в Они.
fa:
  name: غبی
  short: >-
    روستایی سنگی در بالادست ریونی که از سال ۱۵۰۳ در اسناد آمده و هنوز افسانهٔ شورش بر اربابان را با نانِ
    سوگ گرامی می‌دارد.
  body: >-
    **در سال ۱۹۰۱ نزدیک به دو هزار نفر در غبی زندگی می‌کردند؛ سرشماری ۲۰۱۴ تنها ۲۹۶ نفر را ثبت کرد.**


    روستا در ارتفاع ۱۳۵۰ متری، بر کرانهٔ چپ ریونی و حدود ۳۰ کیلومتر جاده‌ای بالاتر از اونی، در ژرفای راچای
    علیا قرار دارد. منابع مکتوب از سال ۱۵۰۳ از آن یاد می‌کنند. در سدهٔ هجدهم، شاهزاده واخوشتی غبی را شهرکی
    حصاردار با برج‌ها و باروهای کنگره‌دار توصیف کرد، در سرزمینی که به گفتهٔ او استوار و تنگ بود و دست
    هیچ دشمنی به‌آسانی به آن نمی‌رسید.


    برای نام روستا دو توضیح هست. در زبان سوانی «غب» به معنای گودی و جای فرورفته است. اما روایت محلی داستان
    یک فراری را ترجیح می‌دهد: رنگرزی که در لچخومی مردی را کشته بود، به کوه‌های راچا گریخت و در اینجا به
    پیشهٔ خود ادامه داد؛ و روستا نامش را از «غبوا»، یعنی «رنگ کردن»، گرفت. می‌گویند نخستین ساکن آن خوشیتا
    لوبژانیدزه از چوشو بود که برجش را بر کرانهٔ راست ساخت.


    داستانی که غبی بیش از همه بازمی‌گوید تلخ‌تر است. به روایت سنت، روستاییان — مردمانی آزاد که زیر بار
    رعیتی نمی‌رفتند — به رهبری زویادا لوبژانیدزه بر اربابان خود، خاندان اریشیدزه، شوریدند. با همدستی مباشری
    که رشوه گرفته بود، دو برادر اریشیدزه را هنگامی که سواره از شکار به خانه بازمی‌گشتند کشتند. برادر سوم
    سوار بر اسب راه افتاد تا از گدار ریونی بگذرد، و زنی به نام دودوک به التماس از او خواست که او را هم
    به آن سوی رود ببرد. در میانهٔ رود، زن او را از زین به زیر کشید و هر دو غرق شدند. دودوک از پیش خواسته
    بود که چون اریشیدزه کشته شد، برایش نانی آیینی بپزند. این خواسته هنوز پاس داشته می‌شود: هرگاه کسی در
    غبی از دنیا می‌رود، خانواده‌اش به یاد دودوک دو قرص نان می‌پزد.


    یازده کیلومتر بالاتر در امتداد ریونی، در بریلی، کاوش‌های سال‌های ۱۹۳۹ تا ۱۹۶۱ آثار فلزکاری از سدهٔ
    هجدهم پیش از میلاد تا سدهٔ چهارم میلادی را آشکار کرد؛ دیرزمانی پیش از آنکه کسی نام غبی را بر کاغذ
    بیاورد.


    غبی بیشتر مردمانش را از دست داده است. اما دودوک را نه.
  tip: >-
    یکی دو ساعت را به گشتن پیاده در غبی بدهید. برج‌ها و خانه‌های سنگی قدیمی بیشتر ملک خصوصی‌اند؛ پس از
    کوچه‌ها تماشایشان کنید و پیش از پا گذاشتن به حیاطی یا عکس گرفتن از کسی اجازه بخواهید. پس از اونی نه
    خودپردازی هست، نه داروخانه‌ای، نه پمپ‌بنزینی: پول نقد و آذوقه همراه بیاورید. جای خواب را از پیش هماهنگ
    کنید؛ در گلولا، ۱۷ کیلومتر دورتر، مهمان‌خانه هست. آنتن موبایل قابل اعتماد نیست و حتی در ژوئیه شامگاهان
    در ارتفاع ۱۳۵۰ متری خنک است. پیمایش چندروزه از غبی از میان کوه‌ها تا زسخو در سوانتی سفلی، از کنار
    دریاچه‌های ساسوانو، ویژهٔ کوهنوردان مجهز و همراه با راهنمای محلی است.
  route: >-
    از تفلیس از S1 (E60) به سمت غرب تا کوتائیسی بروید، سپس از Sh17 به سمت شمال از تکیبولی و گردنهٔ ناکرالا
    تا آمبرولائوری، و آنگاه از Sh16 در امتداد ریونی بالا تا اونی. روی Sh16 بمانید و از اوتسرا بگذرید؛
    در ساگلولو، حدود ۱۹ کیلومتر پس از اونی، به چپ به Sh121 بپیچید و ۱۱ کیلومتر پایانی را از راه چیورا
    تا غبی بروید. روی هم حدود ۳۹۰ کیلومتر و نزدیک به هفت ساعت راه است. آسفالت تا اونی خوب است؛ پس از آن
    جاده باریک و وصله‌پینه‌ای است و بخش پایانی تا اندازه‌ای شنی است، در کنار رود پیش می‌رود و پس از باران‌های
    تند گاه آب بخش‌هایی از آن را می‌شوید. خودروی شاسی‌بلند انتخاب معقولی است. آخرین پمپ‌بنزین در اونی
    است.
he:
  name: גבי
  short: כפר אבן גבוה על הריוני, הנזכר מאז 1503, שבו אגדה על מרד באדונים נשמרת עד היום בלחם שאופים בימי
    אבל.
  body: >-
    **ב-1901 חיו בגבי כמעט אלפיים איש; מפקד 2014 מצא בו 296.**


    הכפר ניצב בגובה 1,350 מטר על הגדה השמאלית של הריוני, כ-30 ק״מ בכביש במעלה העמק מאוני, עמוק ברצ'ה העילית.
    מקורות כתובים מזכירים אותו מאז 1503. במאה ה-18 תיאר הנסיך ואחושטי את גבי כעיירה מוקפת חומה, עם מגדלים
    וביצורים משוננים, בארץ שלדבריו הייתה איתנה, צרה וקשה לכל אויב להגיע אליה.


    לשם יש שני הסברים. בסוואנית, "גב" (gheb) פירושו שקע, מקום נמוך ושקוע. המסורת המקומית מעדיפה סיפור
    על נמלט: צובע בדים שהרג אדם בלצ'חומי ברח אל הרי רצ'ה והמשיך כאן במלאכתו, וכך קיבל הכפר את שמו מן המילה
    "גבווה", "לצבוע". המתיישב הראשון, כך מספרים, היה חושיטה לובז'אנידזה מצ'בשו, שבנה את מגדלו על הגדה
    הימנית.


    הסיפור שגבי מספרת יותר מכול קשה יותר. על פי המסורת, בני הכפר, אנשים חופשיים שסירבו לקבל עליהם צמיתות,
    מרדו באדוניהם, בני משפחת ארישידזה, בהנהגת זוויאדה לובז'אנידזה. בעזרת מנהל אחוזה שקיבל שוחד הם הרגו
    שניים מן האחים ארישידזה כשרכבו הביתה מן הציד. השלישי יצא לחצות את הריוני רכוב על סוסו במעבר רדוד,
    ואישה בשם דודוק התחננה שיעביר אותה לגדה השנייה. באמצע הזרם היא משכה אותו מן האוכף, ושניהם טבעו. מראש
    ביקשה שאחרי מותו של ארישידזה ייאפה עבורה לחם טקסי. משאלתה נשמרת עד היום: כשמישהו מת בגבי, המשפחה אופה
    שתי כיכרות לזכרה של דודוק.


    אחד-עשר קילומטרים במעלה הריוני, בברילי, חשפו חפירות שנערכו בין 1939 ל-1961 עקבות של עיבוד מתכות מן
    המאה ה-18 לפנה״ס ועד המאה ה-4 לספירה, הרבה לפני שמישהו העלה את שמה של גבי על הכתב.


    גבי איבדה את רוב אנשיה. את דודוק היא לא איבדה.
  tip: >-
    הקדישו לגבי שעה או שעתיים של הליכה. המגדלים ובתי האבן הישנים הם ברובם פרטיים, אז התבוננו בהם מן הסמטאות
    ובקשו רשות לפני שאתם נכנסים לחצר או מצלמים מישהו. אחרי אוני אין כספומט, בית מרקחת או תחנת דלק: הביאו
    מזומן וציוד. סדרו לינה מראש; בגלולה, במרחק 17 ק״מ, יש בתי הארחה. הקליטה הסלולרית אינה אמינה, וגם ביולי
    הערבים בגובה 1,350 מטר קרירים. המסע הרב-יומי מגבי דרך ההרים לזסחו שבסוואנטי התחתונה, על פני אגמי סאסוואנו,
    מיועד למטיילים מצוידים היטב ובליווי מדריך מקומי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד קותאיסי, משם בכביש Sh17 צפונה דרך טקיבולי ומעבר נקראלה עד אמברולאורי,
    ואז בכביש Sh16 במעלה הריוני עד אוני. המשיכו ב-Sh16 דרך אוצרה; בסגלולו, כ-19 ק״מ אחרי אוני, פנו שמאלה
    לכביש Sh121 וסעו בו דרך צ'יורה את 11 הקילומטרים האחרונים עד גבי. בסך הכול כ-390 ק״מ וכשבע שעות. האספלט
    טוב עד אוני; אחריה הכביש צר ומטולא, והקטע האחרון עשוי בחלקו חצץ, עובר לצד הנהר ונוטה להיסחף אחרי גשמים
    כבדים. רכב שטח הוא הבחירה הנבונה. תחנת הדלק האחרונה נמצאת באוני.
ar:
  name: غيبي
  short: >-
    قرية حجرية عالية على نهر ريوني، مذكورة منذ عام 1503، ما زال أهلها يُحيون أسطورة تمرّد على الأسياد
    بخبزٍ يُخبَز في المآتم.
  body: >-
    **في عام 1901 كان يعيش في غيبي قرابة ألفي نسمة؛ أما إحصاء 2014 فلم يجد فيها سوى 296.**


    تقع القرية على ارتفاع 1350 متراً على الضفة اليسرى لنهر ريوني، على بعد نحو 30 كم بالطريق أعلى الوادي
    من أوني، في عمق راتشا العليا. وتذكرها المصادر المكتوبة منذ عام 1503. وفي القرن الثامن عشر وصف الأمير
    فاخوشتي غيبي بأنها بلدة مسوّرة ذات أبراج وشُرفات محصّنة، في بلادٍ قال عنها إنها منيعة ضيقة يصعب على
    أي عدو بلوغها.


    لاسمها تفسيران. في اللغة السفانية تعني «غيب» الوهدة، أي الموضع المنخفض الغائر. غير أن الرواية المحلية
    تؤثر حكاية هارب: صبّاغ قتل رجلاً في ليتشخومي ففرّ إلى جبال راتشا وواصل صنعته هنا، فأخذت القرية اسمها
    من «غيبفا»، أي «الصَّبْغ». ويُروى أن أول من استوطنها خوشيتا لوبجانيدزه القادم من تشفيشو، وقد بنى برجه
    على الضفة اليمنى.


    أما الحكاية التي ترويها غيبي أكثر من سواها فأقسى. تقول الرواية إن أهل القرية، وكانوا رجالاً أحراراً
    يأبون القنانة، ثاروا على أسيادهم آل أريشيدزه بقيادة زفيادا لوبجانيدزه. وبمساعدة وكيلٍ مرتشٍ قتلوا
    اثنين من الإخوة أريشيدزه وهما عائدان على ظهور الخيل من الصيد. وانطلق الثالث ليخوض نهر ريوني على صهوة
    جواده، فتوسّلت إليه امرأة تُدعى دودوك أن يحملها إلى الضفة الأخرى. وفي منتصف التيار جذبته عن السرج،
    فغرقا معاً. وكانت قد طلبت مسبقاً أن يُخبز لها رغيف طقسي متى مات أريشيدزه. وما زالت وصيتها تُرعى إلى
    اليوم: كلما مات أحد في غيبي، خبزت عائلته رغيفين إحياءً لذكرى دودوك.


    وعلى بعد أحد عشر كيلومتراً أعلى نهر ريوني، في بريلي، كشفت حفريات جرت بين 1939 و1961 عن آثار لتشغيل
    المعادن تمتد من القرن الثامن عشر قبل الميلاد إلى القرن الرابع الميلادي، قبل زمن طويل من أن يدوّن أحدٌ
    اسم غيبي.


    فقدت غيبي معظم أهلها. لكنها لم تفقد دودوك.
  tip: >-
    امنح غيبي ساعة أو ساعتين من المشي. الأبراج والبيوت الحجرية القديمة ملكيات خاصة في معظمها، فتأمّلها
    من الأزقة واستأذن قبل أن تدخل فناءً أو تصوّر أحداً. لا صرّاف آلياً ولا صيدلية ولا وقود بعد أوني: احمل
    نقوداً ومؤونة. رتّب مكان المبيت مسبقاً؛ ففي غلولا، على بعد 17 كم، بيوت ضيافة. تغطية الهاتف المحمول
    غير موثوقة، وحتى في يوليو تبرد الأمسيات على ارتفاع 1350 متراً. أما الرحلة الجبلية الممتدة عدة أيام
    من غيبي عبر الجبال إلى زيسخو في سفانيتي السفلى، مروراً ببحيرات ساسفانو، فهي للمشّائين الجبليين المجهّزين
    وبرفقة دليل محلي.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً إلى كوتايسي، ثم Sh17 شمالاً عبر تكيبولي وممر ناكيرالا إلى أمبرولاوري،
    ثم Sh16 صعوداً مع نهر ريوني حتى أوني. ابقَ على Sh16 مروراً بأوتسيرا؛ وفي ساغلولو، على بعد نحو 19 كم
    بعد أوني، انعطف يساراً إلى Sh121 وتابعه عبر تشيورا في الكيلومترات الأحد عشر الأخيرة حتى غيبي. المسافة
    الإجمالية نحو 390 كم وقرابة سبع ساعات. الأسفلت جيد حتى أوني؛ وبعدها يضيق الطريق وتكثر فيه الرقع، والمقطع
    الأخير حصوي في جزء منه، يسير بمحاذاة النهر وهو عرضة للانجراف بعد الأمطار الغزيرة. سيارة الدفع الرباعي
    هي الخيار المعقول. آخر محطة وقود في أوني.
