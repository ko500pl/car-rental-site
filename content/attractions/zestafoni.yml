ka:
  name: ზესტაფონი
  short: >-
    ყვირილას ქალაქი მანგანუმის ღუმლებითა და ცოლიკოურის ვენახებით — E60-ის ბუნებრივი გაჩერება ხმაურიანი
    ბაზრითა და შორაპნის ციხით მეზობლად.
  body: >-
    **მძღოლთა უმეტესობა ზესტაფონს მხოლოდ რიკოთის გვირაბსა და ქუთაისს შორის თვალწინ გაელვებული ქარხნის
    მილებითა და ვენახებით იცნობს — და ამით ბევრს კარგავს.**


    ქალაქი ყვირილას ორივე ნაპირზეა გაშენებული და სახელიც თავისი არსებობის მიზეზს გვიმხელს: „ზედა ფონი“
    — მდინარის ზემო გადასასვლელი, რომლის ირგვლივაც ქალაქი გაიზარდა. წერილობით წყაროებში ზესტაფონი 1560-იანი
    წლებიდან იხსენიება. XIX საუკუნის 20-იან წლებში მას მდინარის სახელი, ყვირილა, ერქვა, 1920 წელს ჯუღელად
    გადაარქვეს, ერთი წლის შემდეგ კი ძველი სახელი დაუბრუნდა. დღეს აქ დაახლოებით 20 000 ადამიანი ცხოვრობს.


    ზესტაფონი ორი ხელობით ცხოვრობს და ორივე გზიდანვე იგრძნობა. 1933 წლიდან ფეროშენადნობთა ქარხანა ჭიათურიდან
    ჩამოტანილ მანგანუმის მადანს ადნობს და მისი მილები დღემდე ქალაქის სილუეტს ხატავს, თუმცა 2024 წლის ოქტომბრიდან
    წარმოება დაახლოებით ნახევარი წლით შეჩერდა. მეორე ხელობა უფრო ძველი და უფრო ნაზია: ეს ცოლიკოურისა და
    ციცქის, იმერეთის თეთრი ჯიშების, სამკვიდროა, მეზობელი სოფელი სვირი კი საქართველოს ადგილწარმოშობის დაცულ
    ღვინოებს შორის საკუთარი სახელით დგას.


    სამი მიზეზი, რომ მაგისტრალიდან გადაუხვიოთ:


    - **ბაზარი**, სადაც იმერული ყველის თავები მწვანილის გროვებისა და ნახმარ ბოთლებში ჩამოსხმული სოფლის
    ღვინის გვერდით აწყვია

    - **საოჯახო მარანი** სვირის მხარეს — წინასწარ დარეკეთ და სადეგუსტაციო დარბაზის ნაცვლად სამზარეულოს
    მაგიდას ელოდეთ

    - **შორაპნის ციხე**, ოთხიოდე კილომეტრში, ძირულისა და ყვირილას შესართავთან — სტრაბონის სარაპანა


    აქ 1956 წელს დაიბადა გრიგოლ ჩხარტიშვილი, მსოფლიოში ბორის აკუნინის სახელით ცნობილი მწერალი. ზესტაფონს
    ერთი საათი აჩუქეთ — ყველის ნაჭერი, ჭიქა გრილი ცოლიკოური, ხიდქვეშ მოჩქეფარე ყვირილა — და ქარხნის მილები
    უკვე პეიზაჟის ნაწილად მოგეჩვენებათ და არა გზის გაგრძელების მიზეზად.
  tip: >-
    ბაზარი დილაადრიან იღება და ყველაზე ცოცხალი შუადღემდეა; საღამოსკენ დახლები თანდათან ცარიელდება. საოჯახო
    მარნებს სამუშაო საათები არ აქვს, ამიტომ სტუმრობა სასტუმროს მასპინძლის ან ნაცნობის მეშვეობით ერთი დღით
    ადრე შეათანხმეთ — და თუ ღვინოს გასინჯავთ, საჭესთან სხვა დასვით: საქართველოში ალკოჰოლის დასაშვები ზღვარი
    ძალიან დაბალია. ცენტრში მოძრაობა გადატვირთულია და ადგილის პოვნა ძნელია — მანქანა ბაზრის სიახლოვეს
    პირველივე თავისუფალ ადგილას დატოვეთ და ფეხით გაისეირნეთ. ქალაქში ბანკომატები, აფთიაქები და უბრალო
    სასადილოებია; კომფორტული ღამისთევისთვის ქუთაისი დასავლეთით ორმოციოდე წუთის სავალზეა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ გაემართეთ — გორისა და ხაშურის გავლით, რიკოთის გვირაბით
    და ძირულას ხეობის ჩაყოლებით, შემდეგ კი ზესტაფონის გასასვლელით ჩამოდით მაგისტრალიდან. სულ დაახლოებით
    190 კილომეტრია, ორ საათსა და ნახევარს უნდება. გზა მთლიანად ასფალტიანია და დიდი ნაწილი უკვე თანამედროვე
    ავტობანია, თუმცა რიკოთის მონაკვეთზე სამუშაოები ზოგჯერ კვლავ აფერხებს მოძრაობას. საწვავს ხაშურშიც იპოვით
    და თავად ზესტაფონშიც. ნებისმიერ სეზონში ეკონომ-კლასის ავტომობილიც საკმარისია; ზამთარში გამგზავრებამდე
    რიკოთის ამინდს გადახედეთ.
en:
  name: Zestafoni
  short: >-
    A Kvirila river town of manganese furnaces and Tsolikouri vines — the natural pause on the E60, with
    a loud market and Shorapani fortress next door.
  body: >-
    **Most drivers know Zestafoni only as a blur of factory chimneys and vineyards between the Rikoti
    tunnel and Kutaisi — and they are the poorer for it.**


    The town straddles the Kvirila, and its name explains why it is here at all: *zeda poni*, the upper
    ford — the crossing the town grew up around. Written records mention it from the 1560s. In the 1820s
    it went by the name of the river itself, Kvirila; in 1920 it was renamed Jugeli, and a year later
    it took back its old name. Some 20,000 people live here today.


    Zestafoni lives by two trades, and you sense both from the road. Since 1933 the ferroalloy works has
    smelted manganese ore brought down from Chiatura, and its stacks still draw the town's skyline, even
    after production was halted for about six months from October 2024. The second trade is older and
    gentler. This is the home ground of Tsolikouri and Tsitska, the white grapes of Imereti, and the nearby
    village of Sviri gives its name to one of Georgia's protected wine appellations.


    Three reasons to leave the motorway:


    - **The market**, where wheels of Imeretian cheese sit beside heaps of herbs and village wine in second-hand
    bottles

    - **A family cellar** out towards Sviri — call ahead, and expect a kitchen table rather than a tasting
    room

    - **Shorapani fortress**, four kilometres away where the Dzirula meets the Kvirila — the Sarapana
    of Strabo


    The novelist Boris Akunin was born here in 1956 as Grigori Chkhartishvili. Give Zestafoni an hour
    — a wedge of cheese, a glass of cold Tsolikouri, the Kvirila hurrying under the bridge — and the chimneys
    start to look like part of the landscape rather than a reason to drive on.
  tip: >-
    The market opens early and is at its busiest before noon; by late afternoon the stalls thin out. Family
    wineries keep no opening hours, so ask your guesthouse or a local contact to arrange a visit a day
    ahead — and if you taste, let someone else drive, because Georgia's drink-driving limit is very low.
    The centre is congested and parking is a scramble: leave the car in the first free space near the
    market and walk. The town has ATMs, pharmacies and simple canteens; for a comfortable night, Kutaisi
    is about forty minutes further west.
  route: >-
    From Tbilisi follow the S1 (E60) west past Gori and Khashuri, through the Rikoti tunnel and down the
    Dzirula gorge, then leave the motorway for Zestafoni — about 190 km, roughly two and a half hours.
    It is asphalt all the way, and much of it is now modern motorway, though works around the Rikoti section
    can still slow things down. Fuel is plentiful in Khashuri and in Zestafoni itself. An economy car
    is all you need in any season; in winter, check the Rikoti forecast before you set off.
ru:
  name: Зестафони
  short: >-
    Городок на реке Квирила среди марганцевых печей и лоз цоликоури — естественная остановка на трассе
    E60, с шумным рынком и крепостью Шорапани рядом.
  body: >-
    **Большинству водителей Зестафони знаком лишь как мелькание заводских труб и виноградников между Рикотским
    тоннелем и Кутаиси — и они многого себя лишают.**


    Город стоит на Квириле, и само его имя объясняет, почему он здесь: *зеда пони* — «верхний брод», переправа,
    вокруг которой и вырос город. Письменные упоминания о нём известны с 1560-х годов. В 1820-х он носил
    имя самой реки — Квирила; в 1920 году был переименован в Джугели, а год спустя вернул себе старое
    название. Сегодня здесь живёт около 20 000 человек.


    Зестафони живёт двумя промыслами, и оба чувствуются с дороги. С 1933 года ферросплавный завод плавит
    марганцевую руду, привозимую из Чиатуры, и его трубы до сих пор определяют силуэт города — даже после
    того, как производство было остановлено примерно на полгода, с октября 2024 года. Второй промысел
    старше и мягче. Здесь родина цоликоури и цицка, белых сортов винограда Имерети, а соседнее село Свири
    дало имя одному из защищённых винных наименований Грузии.


    Три причины съехать с трассы:


    - **Рынок**, где круги имеретинского сыра лежат рядом с горами трав и домашним вином в бутылках из-под
    чего угодно

    - **Семейный погреб** в стороне Свири — позвоните заранее и ждите не дегустационный зал, а кухонный
    стол

    - **Крепость Шорапани**, в четырёх километрах, где Дзирула впадает в Квирилу — та самая Сарапана Страбона


    Писатель Борис Акунин родился здесь в 1956 году как Григорий Чхартишвили. Дайте Зестафони час — кусок
    сыра, стакан холодного цоликоури, Квирила, спешащая под мостом — и трубы начнут казаться частью пейзажа,
    а не поводом ехать дальше.
  tip: >-
    Рынок открывается рано и наиболее люден до полудня; к вечеру прилавки пустеют. У семейных виноделен
    нет часов работы — попросите хозяев гостевого дома или местных знакомых договориться о визите заранее,
    за день. А если будете пробовать вино, за руль пусть сядет кто-то другой: допустимая норма алкоголя
    за рулём в Грузии очень мала. Центр перегружен, а с парковкой сложно: оставьте машину на первом свободном
    месте у рынка и идите пешком. В городе есть банкоматы, аптеки и простые столовые; для ночёвки с комфортом
    Кутаиси — ещё около сорока минут на запад.
  route: >-
    Из Тбилиси двигайтесь по трассе S1 (E60) на запад, минуя Гори и Хашури, через Рикотский тоннель и
    вниз по ущелью Дзирулы, затем сверните с трассы к Зестафони — около 190 км, примерно два с половиной
    часа. Дорога асфальтирована на всём протяжении, и большая её часть теперь современная автомагистраль,
    хотя работы в районе Рикоти могут ещё замедлять движение. Заправиться можно в Хашури и в самом Зестафони.
    В любое время года достаточно автомобиля эконом-класса; зимой перед выездом проверьте прогноз для
    Рикоти.
fa:
  name: زستافونی
  short: >-
    شهری بر کنار رود کویریلا، در میان کوره‌های منگنز و تاک‌های تسولیکوری — توقف‌گاهی طبیعی بر مسیر E60،
    با بازاری پرهیاهو و دژ شوراپانی در همان نزدیکی.
  body: >-
    **بیشتر رانندگان زستافونی را فقط چون گذرگاهی محو از دودکش‌های کارخانه و تاکستان‌ها میان تونل ریکوتی
    و کوتایسی می‌شناسند — و بدین‌سان خود را از چیزهای بسیاری محروم می‌کنند.**


    این شهر بر دو کرانه‌ی کویریلا نشسته و نامش خود دلیل بودنش را بازمی‌گوید: *زدا پونی*، یعنی «گدار بالا»
    — گذرگاهی که شهر گرداگرد آن بالید. اسناد نوشتاری از دهه‌ی ۱۵۶۰ نام آن را ثبت کرده‌اند. در دهه‌ی ۱۸۲۰
    به نام خود رود، کویریلا، خوانده می‌شد؛ در سال ۱۹۲۰ به جوگِلی تغییر نام یافت و یک سال بعد نام کهن خود
    را بازپس گرفت. امروز نزدیک به ۲۰٬۰۰۰ نفر در آن زندگی می‌کنند.


    زستافونی از دو پیشه روزی می‌خورد، و هر دو را می‌توان از همان جاده حس کرد. از سال ۱۹۳۳ کارخانه‌ی فروآلیاژ،
    سنگ منگنزِ آورده‌شده از چیاتورا را می‌گدازد و دودکش‌هایش هنوز خط افق شهر را می‌کشند — حتی پس از آنکه
    تولید از اکتبر ۲۰۲۴ برای نزدیک به شش ماه متوقف شد. پیشه‌ی دوم کهن‌تر و ملایم‌تر است. اینجا خانه‌ی
    تسولیکوری و تسیتسکا، انگورهای سفید ایمرتی، است و روستای نزدیک سویری نام خود را به یکی از نشان‌های
    جغرافیایی حمایت‌شدهٔ شراب گرجستان داده است.


    سه دلیل برای بیرون زدن از بزرگراه:


    - **بازار**، جایی که چرخ‌های پنیر ایمرتی کنار توده‌های سبزی‌های معطر و شراب روستایی در بطری‌های دست‌دوم
    می‌نشینند

    - **یک انبار شراب خانگی** در راه سویری — پیشاپیش تلفن بزنید، و به جای سالن شراب‌چشی، انتظار میز آشپزخانه‌ای
    را داشته باشید

    - **دژ شوراپانی**، در چهار کیلومتری، جایی که رود دزیرولا به کویریلا می‌پیوندد — همان ساراپانای استرابون


    رمان‌نویس بوریس آکونین در سال ۱۹۵۶ در همین‌جا با نام گریگوری چخارتیشویلی زاده شد. یک ساعت به زستافونی
    بدهید — تکه‌ای پنیر، جامی تسولیکوری خنک، و کویریلایی که شتابان زیر پل می‌گذرد — و دودکش‌ها دیگر بهانه‌ای
    برای رانندگی به سوی جای دیگر نخواهند بود، بلکه بخشی از منظره می‌شوند.
  tip: >-
    بازار زود باز می‌شود و پیش از ظهر شلوغ‌ترین زمانش است؛ اواخر بعدازظهر غرفه‌ها کم‌رونق می‌شوند. شراب‌سازی‌های
    خانگی ساعت کاری ثابتی ندارند، پس از میزبان خود یا آشنایی محلی بخواهید یک روز پیش‌تر بازدید را ترتیب
    دهد — و اگر چشیدید، رانندگی را به کسی دیگر بسپارید، چون حد مجاز الکل برای رانندگی در گرجستان بسیار
    پایین است. مرکز شهر شلوغ است و پارک‌کردن دشوار؛ ماشین را در نخستین جای خالی نزدیک بازار بگذارید و
    پیاده بروید. شهر دستگاه‌های خودپرداز، داروخانه و رستوران‌های ساده دارد؛ برای شبی آسوده، کوتایسی حدود
    چهل دقیقه دورتر به سوی غرب است.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب بگیرید، از گوری و خاشوری بگذرید، از تونل ریکوتی و دره‌ی دزیرولا
    پایین بروید، سپس از بزرگراه به سوی زستافونی خارج شوید — حدود ۱۹۰ کیلومتر، در حدود دو ساعت و نیم. تمام
    راه آسفالت است و بخش بزرگی از آن اکنون بزرگراهی مدرن است، هرچند کارهای عمرانی در محدوده‌ی ریکوتی هنوز
    می‌تواند سفر را کند کند. سوخت در خاشوری و در خودِ زستافونی به‌فراوانی یافت می‌شود. در هر فصلی یک خودروی
    اقتصادی کافی است؛ در زمستان پیش از حرکت وضعیت جاده‌ی ریکوتی را بررسی کنید.
he:
  name: זסטפוני
  short: >-
    עיירה על נהר קווירילה בין כבשני מנגן וגפני צוליקורי — תחנת מנוחה טבעית על ה-E60, עם שוק רועש ומצודת
    שוראפני בקרבת מקום.
  body: >-
    **רוב הנהגים מכירים את זסטפוני רק כטשטוש של ארובות מפעל וכרמים בין מנהרת ריקותי לקוטאיסי — וההפסד
    הוא שלהם.**


    העיירה שוכנת על שתי גדות הקווירילה, ושמה מסביר מדוע היא נמצאת בדיוק כאן: *זדה פוני*, המעברה העליונה
    — מעבר הנהר שסביבו צמחה העיירה. מקורות כתובים מזכירים אותה מאז שנות ה-1560. בשנות ה-1820 נשאה את שם
    הנהר עצמו, קווירילה; ב-1920 שונה שמה לג'וגלי, ושנה לאחר מכן חזרה לשמה הישן. כיום חיים בה כ-20,000
    תושבים.


    זסטפוני מתקיימת משני עיסוקים, וניתן לחוש בשניהם מהכביש. מאז 1933 מתיך מפעל סגסוגות הברזל עפרות מנגן
    שמובאות מצ'יאטורה, וארובותיו עדיין מעצבות את קו הרקיע של העיירה — גם לאחר שהייצור הופסק לכשישה חודשים
    מאוקטובר 2024. העיסוק השני עתיק ורגוע יותר. כאן ביתם של צוליקורי וציצקה, זני הענבים הלבנים של אימרתי,
    והכפר הסמוך סוירי מעניק את שמו לאחד מכינויי המקור המוגנים של יין גאורגי.


    שלוש סיבות לרדת מהכביש הראשי:


    - **השוק**, שבו גלגלי גבינת אימרתי שוכבים לצד תלי עשבי תיבול ויין כפרי בבקבוקים ממוחזרים

    - **מרתף משפחתי** בדרך לסוירי — התקשרו מראש, וצפו לשולחן מטבח ולא לחדר טעימות

    - **מצודת שוראפני**, במרחק ארבעה קילומטרים, במקום שבו הדזירולה נפגשת עם הקווירילה — הסאראפנה של סטראבון


    הסופר בוריס אקונין נולד כאן ב-1956, בשמו המקורי גריגורי צח'רטישווילי. הקדישו לזסטפוני שעה — פרוסת
    גבינה, כוס צוליקורי צונן, קווירילה נחפזת מתחת לגשר — והארובות יתחילו להיראות כחלק מהנוף, ולא כתירוץ
    להמשיך לנסוע.
  tip: >-
    השוק נפתח מוקדם והוא הומה ביותר לפני הצהריים; לפנות ערב הדוכנים מתרוקנים. ליקבים המשפחתיים אין שעות
    פתיחה קבועות, לכן בקשו מבעלי האכסניה או ממכר מקומי לתאם ביקור יום מראש — ואם אתם מתכננים לטעום, תנו
    למישהו אחר לנהוג, כי רף האלכוהול המותר בנהיגה בגאורגיה נמוך מאוד. המרכז עמוס ומציאת חניה קשה: השאירו
    את הרכב במקום הפנוי הראשון סמוך לשוק והמשיכו ברגל. בעיירה יש כספומטים, בתי מרקחת ומזללות פשוטות; ללינה
    נוחה, קוטאיסי נמצאת כארבעים דקות נסיעה נוספות מערבה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, דרך גורי וחשורי, עברו במנהרת ריקותי וירדו בערוץ הדזירולה, ואז צאו
    מהכביש הראשי לכיוון זסטפוני — כ-190 ק"מ, כשעתיים וחצי. הדרך אספלט מתחילתה ועד סופה, וחלק גדול ממנה
    כביש מהיר מודרני, אם כי עבודות באזור ריקותי עדיין עשויות לעכב את הנסיעה. דלק זמין בשפע בחשורי ובזסטפוני
    עצמה. רכב אקונומי מספיק בכל עונה; בחורף, בדקו את תחזית ריקותי לפני היציאה.
ar:
  name: زيستافوني
  short: >-
    بلدة على نهر كفيريلا بين أفران المنغنيز وكروم تسوليكوري — محطة استراحة طبيعية على طريق E60، بسوق صاخب
    وقلعة شوراباني القريبة.
  body: >-
    **لا يعرف معظم السائقين زيستافوني إلا ومضةً من مداخن المصانع والكروم بين نفق ريكوتي وكوتايسي — وهم
    بذلك يفوّتون على أنفسهم الكثير.**


    تمتد البلدة على ضفتي نهر كفيريلا، واسمها نفسه يفسّر سبب وجودها هنا: *زيدا بوني*، أي «المخاضة العليا»
    — المعبر الذي نشأت البلدة حوله. تذكرها السجلات المكتوبة منذ الستينيات من القرن السادس عشر. في العشرينيات
    من القرن التاسع عشر حملت اسم النهر نفسه، كفيريلا؛ وفي عام 1920 أُعيدت تسميتها جوغيلي، وبعد عام واحد
    استعادت اسمها القديم. يعيش فيها اليوم نحو 20,000 نسمة.


    تعيش زيستافوني على حرفتين، ويمكن استشعارهما من الطريق نفسه. منذ عام 1933 يقوم مصنع سبائك الحديد بصهر
    خام المنغنيز المنقول من تشياتورا، ولا تزال مداخنه ترسم خط سماء البلدة، حتى بعد توقف الإنتاج لنحو ستة
    أشهر منذ أكتوبر 2024. والحرفة الثانية أقدم وأرقّ. فهنا الموطن الأصلي لتسوليكوري وتسيتسكا، صنفي العنب
    الأبيض في إيميريتي، وقرية سفيري القريبة تُعطي اسمها لواحدة من تسميات المنشأ المحمية للنبيذ في جورجيا.


    ثلاثة أسباب للخروج من الطريق السريع:


    - **السوق**، حيث تتراصّ عجلات جبن إيميريتي إلى جانب أكوام من الأعشاب ونبيذ القرى في زجاجات مستعملة

    - **قبو عائلي** في اتجاه سفيري — اتصل مسبقًا، وتوقّع طاولة مطبخ لا قاعة تذوّق

    - **قلعة شوراباني**، على أربعة كيلومترات، حيث يلتقي نهر دزيرولا بكفيريلا — وهي سارابانا التي ذكرها
    سترابون


    وُلد فيها الروائي بوريس أكونين عام 1956 باسم غريغوري تشخارتيشفيلي. أعطِ زيستافوني ساعة من وقتك — قطعة
    جبن، وكأس من نبيذ تسوليكوري البارد، ونهر كفيريلا يمرّ مستعجلًا تحت الجسر — وستبدأ المداخن تبدو جزءًا
    من المشهد لا مجرد سبب للمضي قدمًا.
  tip: >-
    يفتح السوق باكرًا ويكون في أشد ازدحامه قبل الظهر؛ وبحلول أواخر بعد الظهر تخفّ الأكشاك. لا تلتزم معاصر
    النبيذ العائلية بساعات عمل ثابتة، فاطلب من نُزلك أو من معارف محليين ترتيب زيارة قبل يوم على الأقل
    — وإن تذوّقت النبيذ، فاترك القيادة لشخص آخر، لأن الحد المسموح للكحول عند القيادة في جورجيا منخفض جدًا.
    وسط البلدة مزدحم وإيجاد موقف صعب: اترك السيارة في أول مكان شاغر قرب السوق وتابع سيرًا على الأقدام.
    تضم البلدة صرافات آلية وصيدليات ومطاعم بسيطة؛ ولليلة مريحة، تبعد كوتايسي نحو أربعين دقيقة إضافية غربًا.
  route: >-
    من تبليسي، اتبع الطريق S1 (E60) غربًا متجاوزًا غوري وخاشوري، عبر نفق ريكوتي ونزولًا في وادي دزيرولا،
    ثم اخرج من الطريق السريع نحو زيستافوني — نحو 190 كم، أي حوالي ساعتين ونصف. الطريق مُعبّد بالكامل،
    ومعظمه الآن طريق سريع حديث، رغم أن أعمال الإنشاء حول قطاع ريكوتي قد تُبطئ السير أحيانًا. الوقود متوفر
    بكثرة في خاشوري وفي زيستافوني نفسها. تكفي سيارة اقتصادية في أي فصل؛ وفي الشتاء، تحقق من حالة طريق
    ريكوتي قبل الانطلاق.
