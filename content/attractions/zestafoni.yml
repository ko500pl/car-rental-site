ka:
  name: ზესტაფონი
  short: >-
    იმერული ღვინის ქალაქი ყვირილას ნაპირებზე — ცოლიკოურის სამშობლო, ცოცხალი ბაზარი და E60-ის მოსახერხებელი
    გაჩერება.
  body: >-
    **ზესტაფონი ის ქალაქია, რომელსაც ყველა ჩაუქროლებს — და ამაოდ.** ყვირილას ორივე ნაპირზე გაშენებული
    ქალაქი წყაროებში 1560-იანი წლებიდან იხსენიება; სახელი „ზედა ფონს“, მდინარის ზემო გადასასვლელს უკავშირდება.
    დღეს აქ 20 000-მდე ადამიანი ცხოვრობს.


    ქალაქს ორი სახე აქვს. ერთი ინდუსტრიულია — 1933 წლიდან აქ მუშაობს ფეროშენადნობთა ქარხანა, რომელიც ჭიათურის
    მარგანეცს ამუშავებს და ქალაქის სიმბოლოდ იქცა. მეორე კი ღვინისაა: ზესტაფონის მუნიციპალიტეტი იმერული
    მევენახეობის გულია, ცოლიკოურისა და ციცქის მთავარი მხარე, სოფელ სვირში კი საქართველოს ერთ-ერთი დაცული
    ადგილწარმოშობის ღვინო „სვირი“ იბადება.


    რად ღირს გაჩერება:


    - **ცოცხალი ბაზარი** — იმერული ყველი, მწვანილი და სოფლის ღვინო ბოთლებში

    - **საოჯახო მარნები** სვირისა და შორაპნის მიმართულებით — დეგუსტაცია ტურისტული ბრბოს გარეშე

    - **შორაპნის ციხის ნანგრევები** ქალაქის კიდეზე, ანტიკური სარაპანისის ადგილას


    ზესტაფონი დიდ დროს არ ითხოვს, მაგრამ თბილისი-ქუთაისის გზაზე ბუნებრივი შესვენებაა — ბაზრით და ჭიქა
    ცოლიკოურით.
  tip: >-
    ბაზარი დილიდან ბოლო შუადღემდე მუშაობს და კვირა დილით ყველაზე ცოცხალია. მარნებში სტუმრობა წინასწარ
    შეათანხმე — ოფიციალური სადეგუსტაციო დარბაზები ცოტაა, უმეტესობა საოჯახოა. ქალაქში ბანკომატები, აფთიაქები
    და რამდენიმე მარტივი სასადილოა; ღამის გასათევად ქუთაისი უკეთესი არჩევანია, აქამდე ნახევარი საათია.
    მოძრაობა ცენტრში ქაოტურია — მანქანა ბაზრის მოედნის მახლობლად გააჩერე.
  route: >-
    თბილისიდან E60 (S1) ავტომაგისტრალით დასავლეთისკენ: ხაშურის, რიკოთის გვირაბისა და ძირულას ხეობის გავლით
    ზესტაფონამდე დაახლოებით 190 კილომეტრია, ორ-საათნახევარი. გზა თითქმის მთლიანად ახალი მაგისტრალია; რიკოთის
    მონაკვეთზე სამუშაოები ხანდახან ნელა მოძრავ რიგებს ქმნის. საწვავი ხაშურში ან თავად ზესტაფონში აიღე.
    ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში სავსებით საკმარისია.
en:
  name: Zestafoni
  short: >-
    An Imeretian wine town on the banks of the Kvirila — home of Tsolikouri, a lively market and a handy
    stop on the E60.
  body: >-
    **Zestafoni is the town everyone speeds past — mistakenly.** Built on both banks of the Kvirila river,
    it appears in written sources from the 1560s; the name comes from "zeda poni", the upper ford. Around
    20,000 people live here today.


    The town has two faces. One is industrial: a ferroalloy plant has run here since 1933, smelting manganese
    from nearby Chiatura and long serving as the town's symbol. The other is wine. Zestafoni municipality
    is the heart of Imeretian viticulture, the main country of the Tsolikouri and Tsitska grapes, and
    the village of Sviri gives its name to one of Georgia's protected appellation wines.


    Why pull over:


    - **The lively market** — Imeretian cheese, mountains of greens and village wine in reused bottles

    - **Family cellars** towards Sviri and Shorapani — tastings without a single tour bus

    - **The ruins of Shorapani fortress** on the town's edge, site of ancient Sarapanis


    Zestafoni does not ask for much of your time, but on the Tbilisi-Kutaisi run it is the natural leg
    stretch — a market browse and a glass of Tsolikouri.
  tip: >-
    The market runs from morning to late afternoon and is liveliest on Sunday mornings. Arrange cellar
    visits in advance — formal tasting rooms are few and most winemaking is family-scale. The town has
    ATMs, pharmacies and simple canteens; for an overnight stay Kutaisi, half an hour on, is the better
    base. Traffic in the centre is chaotic — park near the market square and walk.
  route: >-
    From Tbilisi take the E60 (S1) west: past Khashuri, through the Rikoti tunnel and down the Dzirula
    gorge to Zestafoni — about 190 km, two and a half hours. The route is almost entirely new motorway
    now; occasional roadworks on the Rikoti section can slow things down. Refuel in Khashuri or in Zestafoni
    itself. An economy car is entirely sufficient all year round.
ru:
  name: Зестафони
  short: >-
    Имеретинский винный город на берегах Квирилы — родина Цоликоури, живой рынок и удобная остановка на
    трассе E60.
  body: >-
    **Зестафони — город, мимо которого все проносятся. И зря.** Раскинувшийся по обоим берегам реки Квирила,
    он упоминается в источниках с 1560-х годов; имя происходит от "зеда пони" — верхнего брода. Сегодня
    здесь живёт около 20 000 человек.


    У города два лица. Первое индустриальное: с 1933 года здесь работает завод ферросплавов, переплавляющий
    марганец из соседней Чиатуры и давно ставший символом города. Второе — винное. Муниципалитет Зестафони
    — сердце имеретинского виноградарства, главная земля сортов Цоликоури и Цицка, а село Свири дало имя
    одному из защищённых аппелласьонов Грузии.


    Зачем свернуть с трассы:


    - **Живой рынок** — имеретинский сыр, горы зелени и деревенское вино в разномастных бутылках

    - **Семейные марани** в сторону Свири и Шорапани — дегустации без единого туравтобуса

    - **Руины крепости Шорапани** на окраине, на месте античного Сарапаниса


    Зестафони не требует много времени, но на пути Тбилиси-Кутаиси это естественная разминка — пройтись
    по рынку и выпить бокал Цоликоури.
  tip: >-
    Рынок работает с утра до конца дня и оживлённее всего воскресным утром. Визиты в марани договаривайте
    заранее — официальных дегустационных залов мало, почти всё виноделие семейное. В городе есть банкоматы,
    аптеки и простые столовые; для ночёвки лучше Кутаиси, до него полчаса. Движение в центре хаотичное
    — оставьте машину у рыночной площади и идите пешком.
  route: >-
    Из Тбилиси по трассе E60 (S1) на запад: мимо Хашури, через Рикотский тоннель и вниз по ущелью Дзирулы
    до Зестафони — около 190 км, два с половиной часа. Маршрут почти целиком проходит по новой автомагистрали;
    дорожные работы на рикотском участке иногда замедляют поток. Заправляйтесь в Хашури или в самом Зестафони.
    Машины эконом-класса достаточно круглый год.
fa:
  name: زستافونی
  short: شهر شراب ایمرتی بر کرانه‌های کویریلا — خانهٔ انگور تسولیکوری، بازاری زنده و توقفگاهی به‌جا در
    جادهٔ E60.
  body: >-
    **زستافونی شهری است که همه با سرعت از کنارش می‌گذرند — و اشتباه می‌کنند.** این شهر بر دو کرانهٔ رود
    کویریلا نشسته و از دههٔ 1560 در اسناد آمده است؛ نامش از «زدا پونی» یعنی گدار بالایی می‌آید. امروز
    حدود 20 هزار نفر اینجا زندگی می‌کنند.


    شهر دو چهره دارد. یکی صنعتی است: از 1933 کارخانهٔ فروآلیاژ اینجا کار می‌کند که منگنز چیاتورا را ذوب
    می‌کند و دیرزمانی نماد شهر بوده است. دیگری شراب است: شهرستان زستافونی قلب تاکداری ایمرتی و سرزمین
    اصلی انگورهای تسولیکوری و تسیتسکاست، و روستای سویری نامش را به یکی از شراب‌های ثبت‌شدهٔ گرجستان داده
    است.


    چرا بایستید:


    - **بازار زنده** — پنیر ایمرتی، کوهی از سبزی و شراب روستایی در بطری‌های دست‌دوم

    - **سرداب‌های خانوادگی** به سمت سویری و شوراپانی — تست شراب بی‌هیچ اتوبوس توریستی

    - **ویرانه‌های قلعهٔ شوراپانی** در حاشیهٔ شهر، بر جای ساراپانیس باستان


    زستافونی وقت زیادی نمی‌خواهد، اما در مسیر تفلیس-کوتائیسی توقف طبیعی است — گشتی در بازار و جامی تسولیکوری.
  tip: >-
    بازار از صبح تا عصر برپاست و یکشنبه‌ها صبح از همیشه زنده‌تر است. دیدار از سرداب‌ها را از پیش هماهنگ
    کنید — سالن تست رسمی کم است و بیشترِ شراب‌سازی خانوادگی است. در شهر عابربانک، داروخانه و غذاخوری‌های
    ساده هست؛ برای شب‌مانی کوتائیسی بهتر است، نیم ساعت جلوتر. ترافیک مرکز شلوغ و بی‌نظم است — ماشین را
    نزدیک میدان بازار بگذارید و پیاده بروید.
  route: >-
    از تفلیس با آزادراه E60 (S1) به غرب: از خاشوری، تونل ریکوتی و درهٔ دزیرولا تا زستافونی — حدود 190
    کیلومتر، دو ساعت و نیم. مسیر تقریباً سراسر آزادراه نوساز است؛ گاهی تعمیرات در قطعهٔ ریکوتی سرعت را
    می‌گیرد. در خاشوری یا خود زستافونی سوخت بزنید. خودروی اقتصادی در تمام سال کاملاً کافی است.
he:
  name: זסטפוני
  short: עיר יין אימרתית על גדות הקווירילה — ביתו של ענב הצוליקאורי, שוק תוסס ועצירה נוחה על ה-E60.
  body: >-
    **זסטפוני היא העיר שכולם חולפים על פניה במהירות — ובטעות.** העיר, הבנויה על שתי גדות נהר קווירילה,
    מוזכרת במקורות מאז שנות ה-1560; שמה בא מ"זדה פוני" — המעבורת העליונה בנהר. כיום חיים בה כ-20,000 תושבים.


    לעיר שני פנים. האחד תעשייתי: מאז 1933 פועל כאן מפעל סגסוגות ברזל, שמתיך מנגן ממכרות צ'יאטורה הסמוכה
    והפך מזמן לסמל העיר. השני הוא יין: נפת זסטפוני היא לב גידול הגפנים של אימרתי, ארץ הענבים צוליקאורי
    וציצקה, והכפר סווירי העניק את שמו לאחד מאזורי היין המוגנים של גאורגיה.


    למה בכל זאת לרדת מהכביש:


    - **השוק התוסס** — גבינה אימרתית, הרים של ירק ויין כפרי בבקבוקים ממוחזרים

    - **מרתפים משפחתיים** לכיוון סווירי ושוראפאני — טעימות בלי אף אוטובוס תיירים

    - **חורבות מבצר שוראפאני** בקצה העיר, אתרה של סאראפאניס העתיקה


    זסטפוני לא דורשת הרבה זמן, אבל בדרך טביליסי-קוטאיסי היא ההפסקה הטבעית — סיבוב בשוק וכוס צוליקאורי.
  tip: >-
    השוק פועל מהבוקר עד אחר הצהריים המאוחרים, והכי חי בבקרי יום ראשון. ביקורים במרתפים תאמו מראש — חדרי
    טעימות רשמיים מעטים ורוב היין משפחתי. בעיר יש כספומטים, בתי מרקחת ומזנונים פשוטים; ללינה עדיפה קוטאיסי,
    חצי שעה נסיעה. התנועה במרכז כאוטית — החנו ליד כיכר השוק ולכו ברגל.
  route: >-
    מטביליסי בכביש E60 (S1) מערבה: דרך חשורי, מנהרת ריקוטי וערוץ הדזירולה עד זסטפוני — כ-190 ק״מ, שעתיים
    וחצי. המסלול עובר כמעט כולו על כביש מהיר חדש; עבודות בקטע ריקוטי מאטות לפעמים את הזרימה. תדלקו בחשורי
    או בזסטפוני עצמה. רכב חסכוני מספיק לחלוטין כל השנה.
ar:
  name: زيستافوني
  short: مدينة نبيذ إيميريتية على ضفتي نهر كفيريلا — موطن عنب تسوليكوري وسوق حيّ ومحطة مريحة على طريق
    E60.
  body: >-
    **زيستافوني هي المدينة التي يمرّ بها الجميع مسرعين — وهم مخطئون.** المدينة المبنية على ضفتي نهر كفيريلا
    مذكورة في المصادر منذ ستينيات القرن السادس عشر؛ واسمها من «زيدا بوني» أي المخاضة العليا. ويسكنها اليوم
    نحو 20 ألف نسمة.


    للمدينة وجهان. الأول صناعي: فمنذ 1933 يعمل هنا مصنع السبائك الحديدية الذي يصهر منغنيز تشياتورا المجاورة
    وصار رمز المدينة منذ زمن. والثاني هو النبيذ: بلدية زيستافوني قلب كرْم إيميريتي وأرض عنبي تسوليكوري
    وتسيتسكا الأولى، وقرية سفيري أعطت اسمها لأحد نبيذات جورجيا المحمية المنشأ.


    لماذا تتوقف:


    - **السوق الحي** — جبن إيميريتي وجبال من الخضار ونبيذ القرى في قوارير مستعملة

    - **أقبية عائلية** باتجاه سفيري وشورافاني — تذوق بلا حافلة سياح واحدة

    - **أطلال قلعة شورافاني** على طرف المدينة، موضع سارابانيس القديمة


    لا تطلب زيستافوني كثيراً من وقتك، لكنها على طريق تبليسي-كوتايسي هي الاستراحة الطبيعية — جولة في السوق
    وكأس من تسوليكوري.
  tip: >-
    يعمل السوق من الصباح حتى آخر العصر وهو أنشط ما يكون صباح الأحد. رتّب زيارات الأقبية مسبقاً — قاعات
    التذوق الرسمية قليلة ومعظم الصناعة عائلية. في المدينة صرافات وصيدليات ومطاعم بسيطة؛ وللمبيت كوتايسي
    أفضل، على نصف ساعة. حركة الوسط فوضوية — أوقف السيارة قرب ساحة السوق وامشِ.
  route: >-
    من تبليسي عبر طريق E60 (S1) غرباً: بعد خاشوري، عبر نفق ريكوتي ونزولاً في وادي دزيرولا إلى زيستافوني
    — نحو 190 كم في ساعتين ونصف. الطريق يمر الآن بكامله تقريباً على أوتوستراد جديد؛ وأعمال الصيانة على
    مقطع ريكوتي تبطئ السير أحياناً. تزود بالوقود في خاشوري أو في زيستافوني نفسها. سيارة اقتصادية تكفي
    تماماً على مدار السنة.
