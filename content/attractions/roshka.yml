ka:
  name: როშკა
  short: >-
    პირაქეთა ხევსურეთის ქვის სოფელი 2000 მეტრზე, ჭაუხის კბილების ძირში: ზემოთ სახლის ხელა მყინვარული ლოდები,
    იქით კი აბუდელაურის ტბები.
  body: >-
    **როშკის თავზე ბალახში სახლის ხელა ლოდები ყრია — თითქოს მყინვარმა აქ დააწყო ისინი და თავად გზა განაგრძო.**


    ეს მოხეტიალე ლოდებია. ისინი პლეისტოცენში მყინვარმა ჩამოიტანა, რომლის ენაც ერთ დროს სოფელ ლეღვამდე,
    დაახლოებით 1450 მეტრამდე ეშვებოდა. ლოდნარი 2067 მეტრზეა, სოფლიდან ერთი კილომეტრის, ათიოდე წუთის სავალზე,
    და ბუნების ძეგლად არის დაცული. ყველაზე დიდი ლოდი დაახლოებით 25×10×11 მეტრია — სამსართულიანი სახლის
    სიმაღლისა; სხვები 22×20×8 მეტრს აღწევს, ზოგი კი შუაზეა გაპობილი. ნაშუადღევს ლოდებს შორის გაიარეთ და
    ნახავთ, როგორ ეფინება მათი ჩრდილი მდელოს, თითქოს შენობების ჩრდილები იყოს.


    თავად როშკა პირაქეთა ხევსურეთის — ქედის აქეთა მხარის ხევსურეთის — პატარა, ქვით ნაგები სოფელია, დაახლოებით
    2000 მეტრზე, ჭაუხის კლდოვანი კოშკების ძირში. დიდი ადგილი არასოდეს ყოფილა: რუსეთის იმპერიის 1873 წლის
    აღწერამ მთელ როშკის თემში შვიდი სოფელი და 145 კომლი დაითვალა. ხევსურები ამაყი ხალხი იყო: თავიანთ წინამძღოლებს
    — ხევისბერებსა და უხუცესთა საბჭოს — თავად ირჩევდნენ, ბატონს არავის ცნობდნენ ქართული გვირგვინის გარდა
    და მეფეებს მცველებად ემსახურებოდნენ. XIX საუკუნეში რუსმა ოფიცერმა არნოლდ ზისერმანმა გაავრცელა აზრი,
    თითქოს ხევსურები ჯვაროსნების შთამომავლები იყვნენ; მეცნიერებმა ეს თეორია დიდი ხანია უარყვეს.


    აქედან რეგიონის ორი საუკეთესო ლაშქრობა იწყება:


    - **აბუდელაურის ტბები** — მწვანე, ლურჯი და თეთრი, 2500–2800 მეტრზე, ჭაუხის კედლების ქვეშ

    - **ჯუთაში, ხევში გადასვლა** ჭაუხის უღელტეხილით — ამ მთების კლასიკური მაღალმთიანი მარშრუტი


    ივნისში ფერდობებს დეკა აჭრელებს; სექტემბერში კი ჰაერი ისე გამჭვირვალეა, რომ ჭაუხის ქიმზე ყოველი კბილის
    დათვლა შეგიძლიათ.
  tip: >-
    აბუდელაურის ტბებამდე ფეხით მთელი დღე გჭირდებათ: ადრე გადით და წყალი თან იქონიეთ, ბილიკზე წყარო ცოტაა.
    ჭაუხის უღელტეხილით ჯუთაში გადასვლა სერიოზული მაღალმთიანი მარშრუტია — გზის მცოდნე მეგზურით იარეთ და
    ცუდი ხილვადობისას არ დაიძრათ. როშკაში რამდენიმე საოჯახო სასტუმროა, ძირითადად ზაფხულში ღია; წინასწარ
    დარეკეთ. ბანკომატი და მაღაზია აქ არ არის — ნაღდი ფული და საჭმელი თან წამოიღეთ. 2000 მეტრზე ამინდი
    სწრაფად იცვლება: აგვისტოშიც ლაბადა გჭირდებათ. მობილური მხოლოდ შემაღლებულ ადგილებში იჭერს. ზამთარში
    სოფელს თოვლი კეტავს.
  route: >-
    საქართველოს სამხედრო გზით (E117) ჟინვალამდე იარეთ, შემდეგ შ26-ზე — ჟინვალი-ბარისახო-შატილის გზაზე
    — გადაუხვიეთ, რომელიც ფშავისა და ხევსურეთის არაგვის ხეობებს აუყვება; ეს გზა ბოლო წლებში განახლდა.
    ბარისახოს შემდეგ როშკისკენ მიმავალ გვერდით გზაზე გადადით: ციცაბო, ქვიანი ხრეშია, ყველაზე ძნელი კი
    ბოლო კილომეტრებია. სულ თბილისიდან დაახლოებით 119 კილომეტრი და სამი საათია. მაღალი კლირენსის ჯიპი ნამდვილად
    გჭირდებათ, სველ ამინდში — მით უმეტეს. ავზი ჟინვალში შეავსეთ; იქით საიმედო ბენზინგასამართს ვერ ნახავთ.
en:
  name: Roshka
  short: >-
    A stone village of Khevsureti at 2,000 m under the teeth of Chaukhi, with house-sized glacial boulders
    above it and the Abudelauri lakes beyond.
  body: >-
    **Above Roshka, boulders the size of houses lie in the grass where a glacier set them down and walked
    away.**


    They are glacial erratics, carried here in the Pleistocene by a glacier whose tongue once reached
    down as far as the village of Leghvi, at about 1,450 m. The field sits at 2,067 m, a ten-minute, one-kilometre
    walk above the village, and is protected as a natural monument. The largest block measures roughly
    25 by 10 by 11 metres, the height of a three-storey house; others run to 22 by 20 by 8, and some have
    split clean in two. Walk between them in the late afternoon and their shadows reach across the meadow
    like the shadows of buildings.


    Roshka itself is a small stone village of Piraketa Khevsureti, the Khevsureti on this side of the
    main ridge, at about 2,000 m, under the jagged towers of the Chaukhi massif. It was never a big place:
    the Russian census of 1873 counted seven villages and 145 households in the whole Roshka community.
    The Khevsurs were a proud people who chose their own leaders, the khevisberi, and councils of elders,
    answered to no lord but the Georgian crown, and served the kings as bodyguards. In the 19th century
    the Russian officer Arnold Zisserman spread the idea that they descended from Crusaders; scholars
    have long since dismissed it.


    Two of the finest walks in the region begin here:


    - **The Abudelauri lakes**, green, blue and white, at 2,500 to 2,800 m under the Chaukhi walls

    - **The crossing to Juta** in Khevi over the Chaukhi pass, the classic high traverse of these mountains


    In June the slopes are lit with rhododendron; by September the air is clear enough to count the teeth
    on Chaukhi's crest.
  tip: >-
    The Abudelauri lakes make a full day on foot: start early and carry water, as springs are scarce on
    the trail. The Chaukhi pass crossing to Juta is a serious high-mountain route; go with a guide or
    someone who knows it, and not in poor visibility. Roshka has a handful of family guesthouses, mostly
    open in summer, so phone ahead. There is no ATM or shop, so bring cash and food. Weather turns fast
    at 2,000 m: pack a rain shell even in August. Mobile signal works only from higher ground. In winter
    snow shuts the village in.
  route: >-
    Take the Georgian Military Highway (E117) north to Zhinvali, then turn onto the Sh26, the Zhinvali–Barisakho–Shatili
    road, which climbs up the Aragvi valleys of Pshavi and Khevsureti; it has been rehabilitated in recent
    years. Beyond Barisakho, take the side road up to Roshka: steep, stony gravel, with the roughest going
    in the last kilometres. In all it is about 119 km and three hours from Tbilisi. You genuinely need
    a high-clearance SUV, more so in the wet. Fill the tank in Zhinvali; there is no reliable fuel beyond.
ru:
  name: Рошка
  short: >-
    Каменное село Хевсурети на высоте 2000 м под зубцами Чаухи: над ним ледниковые валуны величиной с
    дом, за ним Абуделаурские озёра.
  body: >-
    **Над Рошкой в траве лежат валуны величиной с дом — там, где их опустил ледник, прежде чем уйти.**


    Это эрратические валуны: их принёс сюда в плейстоцене ледник, язык которого когда-то спускался до
    села Легви, на высоту около 1450 м. Поле лежит на высоте 2067 м, в километре, то есть в десяти минутах
    ходьбы, выше села, и охраняется как памятник природы. Самая крупная глыба — примерно 25 на 10 на 11
    метров, высотой с трёхэтажный дом; другие достигают 22 на 20 на 8 метров, а некоторые раскололись
    ровно надвое. Пройдитесь между ними ближе к вечеру — и их тени лягут через луг, как тени зданий.


    Сама Рошка — маленькое каменное село Пиракетской Хевсурети, то есть Хевсурети по эту сторону Главного
    хребта, на высоте около 2000 м, под зубчатыми башнями массива Чаухи. Большим оно не было никогда:
    российская перепись 1873 года насчитала во всей Рошкинской общине семь сёл и 145 дворов. Хевсуры были
    гордым народом: сами выбирали своих предводителей, хевисбери, и советы старейшин, не признавали над
    собой иного господина, кроме грузинской короны, и служили царям телохранителями. В XIX веке русский
    офицер Арнольд Зиссерман распространил версию об их происхождении от крестоносцев; учёные давно её
    отвергли.


    Отсюда начинаются два лучших маршрута края:


    - **Абуделаурские озёра** — зелёное, синее и белое, на высоте 2500–2800 м под стенами Чаухи

    - **Переход в Джуту** в Хеви через перевал Чаухи — классический высокогорный траверс этих гор


    В июне склоны горят рододендроном; к сентябрю воздух так прозрачен, что можно пересчитать зубцы на
    гребне Чаухи.
  tip: >-
    Абуделаурские озёра — это полный день пешком: выходите рано и несите воду, родников на тропе мало.
    Переход через перевал Чаухи в Джуту — серьёзный высокогорный маршрут: идите с гидом или с тем, кто
    его знает, и не выходите при плохой видимости. В Рошке несколько семейных гестхаусов, работают они
    в основном летом — звоните заранее. Банкомата и магазина нет, так что берите наличные и еду. На высоте
    2000 м погода меняется быстро: дождевик нужен даже в августе. Мобильная связь ловит только на возвышенностях.
    Зимой снег отрезает село от мира.
  route: >-
    По Военно-Грузинской дороге (E117) поезжайте на север до Жинвали, затем сверните на Sh26 — дорогу
    Жинвали — Барисахо — Шатили, которая поднимается по долинам Арагви через Пшави и Хевсурети; в последние
    годы её отремонтировали. За Барисахо сверните на боковую дорогу к Рошке: крутая каменистая гравийная
    дорога, тяжелее всего на последних километрах. Всего от Тбилиси около 119 км и три часа. Здесь действительно
    нужен внедорожник с высоким клиренсом, а в сырость — тем более. Заправьтесь в Жинвали: дальше надёжной
    заправки нет.
fa:
  name: روشکا
  short: >-
    روستایی سنگی در خوسورتی در ۲۰۰۰ متری، زیر دندانه‌های چائوخی، با تخته‌سنگ‌های یخچالی به اندازهٔ خانه
    بر فرازش و دریاچه‌های آبودلائوری در آن سو.
  body: >-
    **بالای روشکا، تخته‌سنگ‌هایی به اندازهٔ خانه در میان علف‌ها افتاده‌اند؛ همان‌جا که یخچالی آن‌ها را
    بر زمین گذاشت و رفت.**


    این‌ها سنگ‌های سرگردان یخچالی‌اند که در دوران پلیستوسن یخچالی آن‌ها را به اینجا آورد؛ یخچالی که زبانه‌اش
    روزگاری تا روستای لِغوی، در حدود ۱۴۵۰ متری، پایین می‌آمد. این میدان سنگی در ۲۰۶۷ متری است، ده دقیقه
    و یک کیلومتر پیاده بالاتر از روستا، و به عنوان اثر طبیعی حفاظت می‌شود. بزرگ‌ترین قطعه حدود ۲۵ در ۱۰
    در ۱۱ متر است، به بلندی خانه‌ای سه‌طبقه؛ برخی دیگر به ۲۲ در ۲۰ در ۸ متر می‌رسند و بعضی درست از میان
    دو نیم شده‌اند. در واپسین ساعت‌های بعدازظهر میانشان قدم بزنید تا ببینید سایه‌هایشان مثل سایهٔ ساختمان‌ها
    بر چمنزار دراز می‌شود.


    خود روشکا روستای سنگی کوچکی در پیراکتا خوسورتی است، یعنی خوسورتیِ این سوی رشته‌کوه اصلی، در حدود ۲۰۰۰
    متری و زیر برج‌های دندانه‌دار تودهٔ چائوخی. هرگز جای بزرگی نبوده است: سرشماری روسیه در ۱۸۷۳ در کل
    جامعهٔ روشکا هفت روستا و ۱۴۵ خانوار شمرد. خوسورها مردمی سربلند بودند که رهبرانشان، خِویسبِری‌ها، و
    شوراهای ریش‌سفیدان را خود برمی‌گزیدند، جز تاج و تخت گرجستان به هیچ اربابی گردن نمی‌نهادند و پاسداران
    شخصی پادشاهان بودند. در سدهٔ نوزدهم، افسر روس آرنولد زیسرمن این پندار را رواج داد که آنان از تبار
    صلیبیان‌اند؛ پژوهشگران مدت‌هاست آن را رد کرده‌اند.


    دو تا از بهترین پیاده‌روی‌های منطقه از همین‌جا آغاز می‌شود:


    - **دریاچه‌های آبودلائوری**، سبز، آبی و سفید، در ۲۵۰۰ تا ۲۸۰۰ متری زیر دیواره‌های چائوخی

    - **گذر به جوتا** در خِوی از گردنهٔ چائوخی، پیمایش کلاسیک و مرتفع این کوهستان


    در ژوئن دامنه‌ها از گل‌های رودودندرون روشن‌اند؛ و تا سپتامبر هوا چنان زلال است که می‌توان دندانه‌های
    ستیغ چائوخی را یکی‌یکی شمرد.
  tip: >-
    دریاچه‌های آبودلائوری یک روز کامل پیاده‌روی می‌طلبند: زود راه بیفتید و آب همراه ببرید، چون چشمه در
    مسیر کم است. گذر از گردنهٔ چائوخی به جوتا مسیری جدی و مرتفع است؛ با راهنما یا کسی که راه را می‌شناسد
    بروید، و هنگام دید کم راه نیفتید. روشکا چند مهمان‌خانهٔ خانوادگی دارد که بیشترشان فقط تابستان باز
    است؛ از پیش تماس بگیرید. خودپرداز و مغازه نیست، پس پول نقد و خوراک همراه بیاورید. در ۲۰۰۰ متری هوا
    زود تغییر می‌کند: حتی در اوت بارانی بردارید. آنتن موبایل فقط از نقاط بلندتر می‌آید. زمستان برف راه
    روستا را می‌بندد.
  route: >-
    از جادهٔ نظامی گرجستان (E117) به سوی شمال تا ژینوالی بروید، سپس به Sh26، جادهٔ ژینوالی–باریساخو–شاتیلی،
    بپیچید که در دره‌های آراگوی از فشاوی و خوسورتی بالا می‌رود و در سال‌های اخیر بازسازی شده است. پس از
    باریساخو، راه فرعی رو به روشکا را بگیرید: شنی، سنگلاخ و پرشیب، با دشوارترین بخش در کیلومترهای پایانی.
    روی هم حدود ۱۱۹ کیلومتر و سه ساعت از تفلیس است. به‌راستی به شاسی‌بلندی با فاصلهٔ زیاد از زمین نیاز
    دارید، و در هوای خیس بیش از همیشه. در ژینوالی باک را پر کنید؛ پس از آن نمی‌توان روی سوخت‌گیری حساب
    کرد.
he:
  name: רושקה
  short: כפר אבן בחבסורתי בגובה 2,000 מ' מתחת לשיני הצ'אוחי, ומעליו סלעי קרחון בגודל של בתים ואגמי אבודלאורי
    מעבר להם.
  body: >-
    **מעל רושקה מוטלים בעשב סלעים בגודל של בתים, במקום שבו הניח אותם קרחון והלך לדרכו.**


    אלה סלעים נודדים: קרחון הביא אותם לכאן בתקופת הפלייסטוקן, ולשונו הגיעה פעם עד הכפר לגווי, בגובה של
    כ־1,450 מ'. השדה שוכן בגובה 2,067 מ', עשר דקות וקילומטר אחד של הליכה מעל הכפר, והוא מוגן כמונומנט
    טבע. הגוש הגדול ביותר מגיע לכ־25 על 10 על 11 מטרים, גובהו של בית בן שלוש קומות; אחרים מגיעים ל־22
    על 20 על 8, וכמה מהם נבקעו לשניים בקו חלק. טיילו ביניהם בשעות אחר הצהריים המאוחרות, והצללים שלהם יימתחו
    על פני האחו כמו צללים של בניינים.


    רושקה עצמו הוא כפר אבן קטן בפיראקטה חבסורתי – חבסורתי שבצד הזה של הרכס הראשי – בגובה של כ־2,000 מ',
    למרגלות המגדלים המשוננים של מאסיב צ'אוחי. הוא מעולם לא היה מקום גדול: מפקד האוכלוסין הרוסי של 1873
    מנה בכל קהילת רושקה שבעה כפרים ו־145 משקי בית. החבסורים היו עם גאה שבחר בעצמו את מנהיגיו, החביסברי,
    ואת מועצות הזקנים, לא קיבל עליו שום אדון מלבד הכתר הגאורגי, ושירת את המלכים כשומרי ראש. במאה ה־19
    הפיץ הקצין הרוסי ארנולד ציסרמן את הרעיון שהם צאצאי הצלבנים; החוקרים דחו אותו מזמן.


    שניים מהמסלולים הטובים ביותר באזור יוצאים מכאן:


    - **אגמי אבודלאורי** – ירוק, כחול ולבן, בגובה 2,500 עד 2,800 מ' מתחת לקירות צ'אוחי

    - **המעבר לג'וטה** שבחווי דרך מעבר צ'אוחי, החצייה הגבוהה הקלאסית של ההרים האלה


    ביוני המדרונות בוערים ברודודנדרון; עד ספטמבר האוויר צלול כל כך שאפשר לספור את השיניים ברכס של צ'אוחי.
  tip: >-
    אגמי אבודלאורי הם יום הליכה מלא: צאו מוקדם וקחו מים, כי מעיינות בשביל מעטים. החצייה דרך מעבר צ'אוחי
    לג'וטה היא מסלול הררי גבוה ורציני; לכו עם מדריך או עם מי שמכיר את הדרך, ואל תצאו בראות לקויה. ברושקה
    יש קומץ בתי הארחה משפחתיים, רובם פתוחים בקיץ, אז התקשרו מראש. אין כספומט ואין חנות, אז הביאו מזומן
    ואוכל. בגובה 2,000 מ' מזג האוויר מתהפך מהר: קחו מעיל גשם גם באוגוסט. קליטה סלולרית יש רק מנקודות גבוהות.
    בחורף השלג סוגר את הכפר.
  route: >-
    סעו צפונה בכביש הצבאי הגאורגי (E117) עד ז'ינוואלי, ואז פנו לכביש Sh26, כביש ז'ינוואלי–בריסאחו–שאטילי,
    שמטפס במעלה עמקי האראגווי של פשאווי וחבסורתי; הוא שוקם בשנים האחרונות. אחרי בריסאחו פנו לדרך הצדדית
    שעולה לרושקה: דרך חצץ תלולה וסלעית, והקטע הקשה ביותר הוא בקילומטרים האחרונים. בסך הכול כ־119 ק"מ ושלוש
    שעות מטביליסי. באמת צריך כאן רכב שטח גבוה, ובמזג אוויר רטוב – על אחת כמה וכמה. תדלקו בז'ינוואלי; מעבר
    לה אין תחנת דלק שאפשר לסמוך עליה.
ar:
  name: روشكا
  short: >-
    قرية حجرية في خيفسوريتي على ارتفاع 2000 متر تحت أسنان تشاوخي، تعلوها صخور جليدية بحجم البيوت، وخلفها
    بحيرات أبوديلاوري.
  body: >-
    **فوق روشكا ترقد في العشب صخور بحجم البيوت، حيث وضعها نهر جليدي ثم مضى في طريقه.**


    إنها صخور شاردة جليدية حملها إلى هنا في عصر البليستوسين نهر جليدي كان لسانه يمتد يوماً حتى قرية ليغفي،
    على ارتفاع نحو 1450 متراً. يقع حقل الصخور على ارتفاع 2067 متراً، على بعد كيلومتر واحد، أي عشر دقائق
    سيراً، أعلى القرية، وهو محمي بوصفه معلماً طبيعياً. تبلغ أكبر كتلة فيه نحو 25 في 10 في 11 متراً، أي
    بارتفاع بيت من ثلاثة طوابق؛ وتصل أخرى إلى 22 في 20 في 8، وبعضها انشق نصفين انشقاقاً نظيفاً. تجوّل
    بينها في أواخر العصر، فترى ظلالها تمتد عبر المرج كظلال المباني.


    وروشكا نفسها قرية حجرية صغيرة في خيفسوريتي بيراكيتا، أي خيفسوريتي الواقعة على هذا الجانب من السلسلة
    الرئيسية، على ارتفاع نحو 2000 متر، تحت الأبراج المسنّنة لكتلة تشاوخي. لم تكن يوماً مكاناً كبيراً:
    فقد أحصى التعداد الروسي لعام 1873 سبع قرى و145 أسرة في جماعة روشكا كلها. كان الخيفسوريون شعباً أبيّاً
    يختار زعماءه بنفسه، الخيفيسبيري، ومجالس شيوخه، ولا يدين لسيّد غير التاج الجورجي، وخدم رجاله الملوكَ
    حرّاساً شخصيين. وفي القرن التاسع عشر أشاع الضابط الروسي أرنولد زيسرمان فكرة أنهم يتحدرون من الصليبيين؛
    وقد رفضها الباحثون منذ زمن بعيد.


    ومن هنا يبدأ اثنان من أجمل مسارات المشي في المنطقة:


    - **بحيرات أبوديلاوري**، الخضراء والزرقاء والبيضاء، على ارتفاع 2500 إلى 2800 متر تحت جدران تشاوخي

    - **العبور إلى جوتا** في خيفي عبر ممر تشاوخي، وهو الاجتياز الجبلي العالي الكلاسيكي في هذه الجبال


    في يونيو تتوهّج السفوح بأزهار الرودودندرون؛ وبحلول سبتمبر يصفو الهواء حتى لتستطيع أن تعدّ أسنان قمة
    تشاوخي واحدة واحدة.
  tip: >-
    تستغرق بحيرات أبوديلاوري يوماً كاملاً سيراً على الأقدام: انطلق باكراً واحمل الماء، فالينابيع نادرة
    على الدرب. أما العبور إلى جوتا عبر ممر تشاوخي فمسار جبلي عالٍ وجدّي؛ اسلكه مع دليل أو مع من يعرفه،
    ولا تسلكه حين تسوء الرؤية. في روشكا بضعة بيوت ضيافة عائلية تفتح في الصيف غالباً، فاتصل مسبقاً. لا
    صراف آلي ولا متجر، فأحضر النقود والطعام. على ارتفاع 2000 متر يتقلب الطقس بسرعة: احمل سترة واقية من
    المطر حتى في أغسطس. لا تلتقط إشارة الهاتف إلا من المرتفعات. وفي الشتاء يعزل الثلج القرية تماماً.
  route: >-
    اسلك الطريق العسكري الجورجي (E117) شمالاً حتى جينفالي، ثم انعطف إلى الطريق Sh26، طريق جينفالي–باريساخو–شاتيلي،
    الذي يصعد في وديان أراغفي عبر بشافي وخيفسوريتي، وقد أُعيد تأهيله في السنوات الأخيرة. بعد باريساخو
    خذ الطريق الفرعي الصاعد إلى روشكا: حصوي صخري شديد الانحدار، وأصعب ما فيه كيلومتراته الأخيرة. المسافة
    الإجمالية نحو 119 كم وثلاث ساعات من تبليسي. تحتاج فعلاً إلى سيارة دفع رباعي مرتفعة عن الأرض، ولا سيما
    في الطقس الماطر. املأ الخزان في جينفالي؛ فبعدها لا يمكن التعويل على وجود وقود.
