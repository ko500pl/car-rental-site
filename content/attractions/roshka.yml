ka:
  name: როშკა
  short: ხევსურული სოფელი გიგანტური ლოდებით და აბუდელაურის ფერადი ტბებისკენ მიმავალი ბილიკის სათავე —
    2000 მეტრზე.
  body: >-
    **როშკას პეიზაჟი ისეთია, თითქოს ვიღაცამ მთებში უზარმაზარი კენჭები მიმოფანტა.** სოფლის თავზე, 2067
    მეტრზე, გიგანტური ლოდები ყრია — ყველაზე დიდი დაახლოებით 25×10×11 მეტრია, ანუ სამსართულიანი სახლის
    ზომის ქვა. ეს მოხეტიალე ლოდები პლეისტოცენის მყინვარმა ჩამოიტანა, რომლის ენაც ოდესღაც სოფელ ლეღვამდე,
    1450 მეტრამდე, ჩადიოდა; დღეს ლოდები ბუნების ძეგლად არის გამოცხადებული და ფშავ-ხევსურეთის დაცული ტერიტორიების
    ნაწილია.


    თავად როშკა პირაქეთა ხევსურეთის პატარა, ქვის სახლებიანი სოფელია 2000 მეტრზე, ჭაუხების კბილანა მასივის
    ძირში. აქედან იწყება რეგიონის ორი საუკეთესო ლაშქრობა:


    - **აბუდელაურის სამი ტბა** — მწვანე, ლურჯი და თეთრი, თითოეული თავისი ფერით, 2500-2800 მეტრზე

    - **ჯუთა-როშკის გადასასვლელი** ჭაუხის უღელტეხილით — ხევსურეთსა და ხევს შორის კლასიკური ორდღიანი მარშრუტი

    - **ლოდებამდე გასეირნება** — სოფლიდან სულ 1 კმ, 10 წუთი


    ივნისში ფერდობები როდოდენდრონით ყვავის, სექტემბერში ჰაერი მინასავით გამჭვირვალეა. ზამთარში სოფელი
    თოვლით იკეტება და მასპინძლების უმეტესობა ბარში ჩადის.
  tip: >-
    ტბებამდე ლაშქრობა მთელი დღის საქმეა — ადრე დაიძარი და წყალი აიღე, გზად წყარო ცოტაა. სოფელში რამდენიმე
    საოჯახო სასტუმროა, ზაფხულში წინასწარ დარეკე. ბანკომატი და მაღაზია აქ არ არის — ნაღდი ფული და საგზალი
    ბარისახომდე მოიმარაგე. ამინდი სწრაფად იცვლება: ლაბადა ზაფხულშიც გჭირდება. მობილური მხოლოდ შემაღლებულ
    ადგილებში იჭერს.
  route: >-
    თბილისიდან ჟინვალამდე სამხედრო გზით (E117), შემდეგ ბარისახოს მიმართულებით ფშავის არაგვის ხეობაში —
    ჯამში 119 კმ და დაახლოებით სამი საათი. ჟინვალის შემდეგ ასფალტი თანდათან ორმოიან ბეტონსა და გრუნტს
    უთმობს ადგილს; ბოლო ასახვევი როშკისკენ ციცაბო და ქვიანია, ბოლო კილომეტრები კი განსაკუთრებით უსწორმასწოროა.
    მაღალი განივლობის SUV რეალურად გჭირდება, სველ ამინდში მეტადაც. საწვავი ჟინვალში ან ბარისახოში ჩაასხი
    — წინ ბენზინგასამართი აღარ იქნება.
en:
  name: Roshka
  short: >-
    A Khevsur village of giant boulders and the trailhead for the coloured Abudelauri lakes — at 2,000
    m under the Chaukhi massif.
  body: >-
    **Roshka looks as if someone scattered enormous pebbles across the mountains.** Above the village,
    at 2,067 m, lie gigantic boulders — the largest measures roughly 25×10×11 m, a stone the size of a
    three-storey house. These glacial erratics were carried here by a Pleistocene glacier whose tongue
    once reached down to the village of Leghvi at 1,450 m; today the rocks are a designated natural monument
    within the Pshav-Khevsureti protected areas.


    Roshka itself is a small stone-built village of Piraketa Khevsureti at about 2,000 m, sitting under
    the jagged towers of the Chaukhi massif. Two of the region's best hikes start here:


    - **The three Abudelauri lakes** — green, blue and white, each a different colour, at 2,500–2,800
    m

    - **The Juta–Roshka traverse** over the Chaukhi pass — the classic two-day route linking Khevsureti
    and Khevi

    - **The stroll to the boulders** — just 1 km and 10 minutes from the village


    In June the slopes bloom with rhododendron; in September the air is glass-clear. In winter snow shuts
    the village in, and most hosts move down to the lowlands.
  tip: >-
    The lake hike is a full-day affair — start early and carry water, as springs are scarce on the trail.
    The village has a handful of family guesthouses; call ahead in summer. There is no ATM and no shop,
    so stock up on cash and food no later than Barisakho. Weather turns fast: pack a rain shell even in
    August. Mobile signal only works from higher ground.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117) to Zhinvali, then turn towards Barisakho up
    the Pshavi Aragvi valley — 119 km and about three hours in total. Beyond Zhinvali the asphalt gradually
    gives way to potholed concrete and dirt; the final turn-off to Roshka is steep and stony, and the
    last kilometres are properly rough. You genuinely need a high-clearance SUV, more so in wet weather.
    Refuel in Zhinvali or Barisakho — there are no petrol stations further on.
ru:
  name: Рошка
  short: >-
    Хевсурское село гигантских валунов и старт тропы к цветным Абуделаурским озёрам — на высоте 2000 м
    под массивом Чаухи.
  body: >-
    **Рошка выглядит так, будто кто-то рассыпал по горам огромную гальку.** Над селом, на высоте 2067
    м, лежат гигантские валуны — самый большой около 25×10×11 м, камень размером с трёхэтажный дом. Эти
    ледниковые эрратические глыбы принёс плейстоценовый ледник, язык которого когда-то спускался до села
    Легви на 1450 м; сегодня валуны объявлены памятником природы в составе охраняемых территорий Пшав-Хевсурети.


    Сама Рошка — маленькое каменное село Пиракетской Хевсурети на высоте около 2000 м, под зубчатыми башнями
    массива Чаухи. Отсюда начинаются два лучших похода региона:


    - **Три Абуделаурских озера** — зелёное, синее и белое, каждое своего цвета, на 2500-2800 м

    - **Переход Джута–Рошка** через перевал Чаухи — классический двухдневный маршрут между Хевсурети и
    Хеви

    - **Прогулка к валунам** — всего 1 км и 10 минут от села


    В июне склоны цветут рододендроном, в сентябре воздух прозрачен как стекло. Зимой село отрезано снегом,
    и большинство хозяев спускается в долину.
  tip: >-
    Поход к озёрам — дело на целый день: выходите рано и берите воду, родников на тропе мало. В селе несколько
    семейных гестхаусов, летом звоните заранее. Банкомата и магазина нет — наличные и еду запасайте не
    позже Барисахо. Погода меняется быстро, дождевик нужен даже в августе. Мобильная связь ловит только
    на возвышенностях.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге (E117) до Жинвали, затем поворот на Барисахо вверх по долине
    Пшавской Арагви — всего 119 км и около трёх часов. После Жинвали асфальт постепенно сменяется разбитым
    бетоном и грунтовкой; финальный съезд на Рошку крутой и каменистый, а последние километры по-настоящему
    разбиты. Реально нужен SUV с высоким клиренсом, в дождь — тем более. Заправляйтесь в Жинвали или Барисахо:
    дальше АЗС не будет.
fa:
  name: روشکا
  short: >-
    روستای خوسورتی با تخته‌سنگ‌های غول‌پیکر و آغازگاه مسیر دریاچه‌های رنگی آبودلائوری — در 2000 متری زیر
    تودهٔ چائوخی.
  body: >-
    **روشکا چنان است که انگار کسی ریگ‌هایی عظیم را روی کوه‌ها پاشیده باشد.** بالای روستا، در 2067 متری،
    تخته‌سنگ‌هایی غول‌پیکر افتاده‌اند — بزرگ‌ترینشان حدود 25×10×11 متر است؛ سنگی به اندازهٔ خانه‌ای سه‌طبقه.
    این سنگ‌های سرگردان را یخچالی از دورهٔ پلیستوسن آورده که زبانه‌اش زمانی تا روستای لِغوی در 1450 متری
    پایین می‌رفت؛ امروز این سنگ‌ها بنای یادبود طبیعی در دل مناطق حفاظت‌شدهٔ فشاو-خوسورتی‌اند.


    خود روشکا روستایی کوچک و سنگ‌ساخت در پیراکتا خوسورتی است، در حدود 2000 متری، زیر برج‌های دندانه‌دار
    تودهٔ چائوخی. دو تا از بهترین پیاده‌روی‌های منطقه از همین‌جا آغاز می‌شود:


    - **سه دریاچهٔ آبودلائوری** — سبز، آبی و سفید، هر یک به رنگی، در 2500 تا 2800 متری

    - **گذر جوتا–روشکا** از گردنهٔ چائوخی — مسیر کلاسیک دوروزه میان خوسورتی و خِوی

    - **قدم‌زدن تا تخته‌سنگ‌ها** — فقط 1 کیلومتر و 10 دقیقه از روستا


    در ژوئن دامنه‌ها از رودودندرون گل می‌کنند و در سپتامبر هوا مثل شیشه شفاف است. زمستان برف روستا را
    می‌بندد و بیشتر میزبانان به پایین‌دست کوچ می‌کنند.
  tip: >-
    پیاده‌روی دریاچه‌ها یک روز کامل وقت می‌برد — زود راه بیفتید و آب بردارید؛ چشمه در مسیر کم است. روستا
    چند مهمان‌خانهٔ خانوادگی دارد؛ تابستان از پیش تماس بگیرید. خودپرداز و مغازه نیست — پول نقد و خوراک
    را دیرترین جا در باریساخو تهیه کنید. هوا سریع برمی‌گردد: حتی در اوت بارانی بیاورید. آنتن موبایل فقط
    در بلندی‌ها هست.
  route: >-
    از تفلیس با بزرگراه نظامی (E117) تا ژینوالی، سپس به سوی باریساخو در درهٔ آراگویِ فشاوی — روی هم 119
    کیلومتر و حدود سه ساعت. پس از ژینوالی آسفالت کم‌کم جایش را به بتن چاله‌دار و خاکی می‌دهد؛ فرعی آخر
    به روشکا تند و سنگلاخ است و کیلومترهای پایانی حسابی ناهموار. به‌راستی شاسی‌بلند با ارتفاع مناسب لازم
    دارید، در هوای خیس بیشتر. سوخت را در ژینوالی یا باریساخو بزنید — جلوتر پمپ بنزینی نیست.
he:
  name: רושקה
  short: כפר חבסורי של סלעי ענק ונקודת הזינוק לאגמי אבודלאורי הצבעוניים — בגובה 2,000 מ' מתחת למאסיב צ'אוחי.
  body: >-
    **רושקה נראה כאילו מישהו פיזר חלוקי אבן עצומים על פני ההרים.** מעל הכפר, בגובה 2,067 מ', מוטלים סלעי
    ענק — הגדול שבהם כ-25×10×11 מ', אבן בגודל בית בן שלוש קומות. את הבולדרים הסחופים האלה הביא קרחון מתקופת
    הפלייסטוקן, שלשונו ירדה פעם עד הכפר לגווי בגובה 1,450 מ'; כיום הסלעים מוכרזים אתר טבע מוגן בתחומי
    השמורות של פשאב-חבסורתי.


    רושקה עצמו הוא כפר אבן קטן של חבל פיראקטה חבסורתי בגובה כ-2,000 מ', למרגלות המגדלים המשוננים של מאסיב
    צ'אוחי. שניים מהמסלולים הטובים באזור מתחילים כאן:


    - **שלושת אגמי אבודלאורי** — ירוק, כחול ולבן, כל אחד בצבע משלו, בגובה 2,500–2,800 מ'

    - **חציית ג'וטה–רושקה** דרך מעבר צ'אוחי — מסלול קלאסי של יומיים בין חבסורתי לחווי

    - **הליכה קצרה אל הסלעים** — רק ק"מ אחד ו-10 דקות מהכפר


    ביוני המדרונות פורחים ברודודנדרון; בספטמבר האוויר צלול כזכוכית. בחורף השלג סוגר את הכפר, ורוב המארחים
    יורדים לעמקים.
  tip: >-
    המסלול לאגמים הוא עניין ליום שלם — צאו מוקדם וקחו מים, מעיינות בדרך מעטים. בכפר קומץ בתי הארחה משפחתיים;
    בקיץ התקשרו מראש. אין כספומט ואין חנות — הצטיידו במזומן ובאוכל לכל המאוחר בבריסאחו. מזג האוויר מתהפך
    מהר: קחו מעיל גשם גם באוגוסט. קליטה סלולרית יש רק מנקודות גבוהות.
  route: >-
    מטביליסי בכביש הצבא הגאורגי (E117) עד ז'ינוואלי, ואז פנייה לכיוון בריסאחו במעלה עמק האראגווי הפשאווי
    — 119 ק"מ וכשלוש שעות בסך הכול. אחרי ז'ינוואלי האספלט מפנה בהדרגה את מקומו לבטון מחורר ולדרך עפר;
    הפנייה האחרונה לרושקה תלולה וסלעית, והקילומטרים האחרונים משובשים באמת. צריך רכב שטח גבוה, ובגשם על
    אחת כמה וכמה. תדלקו בז'ינוואלי או בבריסאחו — הלאה אין תחנות דלק.
ar:
  name: روشكا
  short: >-
    قرية خيفسورية ذات صخور عملاقة ونقطة انطلاق درب بحيرات أبوديلاوري الملونة — على ارتفاع 2000 متر تحت
    كتلة تشاوخي.
  body: >-
    **تبدو روشكا وكأن أحداً نثر حصى هائلة فوق الجبال.** فوق القرية، على ارتفاع 2067 متراً، ترقد صخور عملاقة
    — أكبرها نحو 25×10×11 متراً؛ حجر بحجم بيت من ثلاثة طوابق. حملت هذه الصخورَ الجوالة مثلجةٌ من عصر البليستوسين
    كان لسانها ينزل يوماً حتى قرية ليغفي على 1450 متراً؛ واليوم أُعلنت الصخور نُصباً طبيعياً ضمن محميات
    بشاف-خيفسوريتي.


    روشكا نفسها قرية حجرية صغيرة في خيفسوريتي الأمامية على نحو 2000 متر، تحت الأبراج المسننة لكتلة تشاوخي.
    ومن هنا يبدأ اثنان من أفضل مسارات المنطقة:


    - **بحيرات أبوديلاوري الثلاث** — خضراء وزرقاء وبيضاء، لكل واحدة لونها، على 2500–2800 متر

    - **عبور جوتا–روشكا** عبر ممر تشاوخي — المسار الكلاسيكي ذو اليومين بين خيفسوريتي وخيفي

    - **نزهة إلى الصخور** — كيلومتر واحد فقط و10 دقائق من القرية


    في يونيو تزهر السفوح بالرودودندرون، وفي سبتمبر يكون الهواء صافياً كالزجاج. وفي الشتاء يحاصر الثلج
    القرية فينزل معظم المضيفين إلى السهول.
  tip: >-
    مسير البحيرات يستغرق يوماً كاملاً — انطلق باكراً واحمل الماء، فالينابيع قليلة على الدرب. في القرية
    بضعة بيوت ضيافة عائلية؛ اتصل مسبقاً في الصيف. لا صراف آلي ولا متجر — تزوّد بالنقد والطعام في باريساخو
    على أبعد تقدير. الطقس يتقلب بسرعة: خذ معطف مطر حتى في أغسطس. إشارة الهاتف لا تلتقط إلا من المرتفعات.
  route: >-
    من تبليسي على الطريق العسكري الجورجي (E117) حتى جينفالي، ثم انعطف نحو باريساخو صعوداً في وادي أراغفي
    البشاوية — 119 كم ونحو ثلاث ساعات إجمالاً. بعد جينفالي يفسح الإسفلت المجال تدريجياً لخرسانة محفّرة
    وطريق ترابي؛ والمنعطف الأخير إلى روشكا شديد الانحدار وصخري، والكيلومترات الأخيرة وعرة فعلاً. تحتاج
    حقاً إلى دفع رباعي مرتفع، وفي الطقس الرطب أكثر. تزوّد بالوقود في جينفالي أو باريساخو — فلا محطات بعدهما.
