ka:
  name: რუხის ციხე
  short: >-
    ლევან II დადიანის სასაზღვრო სიმაგრე ენგურის თავზე: სუროთი შეკრული ციტადელი, რომელმაც ოსმალთა გარნიზონიც
    ნახა და 1779 წლის გამარჯვებაც.
  body: >-
    **რუხის ციხე მდინარის სადარაჯოდ აშენდა და ორი საუკუნის მანძილზე ამ მდინარეს მისთვის მშვიდობა არ მოუტანია.**


    ციხე სოფელ რუხის თავზე, ტყით დაფარულ ბორცვზე დგას, ენგურის მარცხენა ნაპირას, ზუგდიდიდან რვაიოდე კილომეტრზე
    ჩრდილო-დასავლეთით. ის ააგო ლევან II დადიანმა — სასტიკმა და ცბიერმა მთავარმა, რომელიც სამეგრელოს 1611-დან
    1657 წლამდე განაგებდა. ვახუშტი ბატონიშვილი მშენებლობას 1647 წლით ათარიღებს, თუმცა მკვლევართა ნაწილი
    ფიქრობს, რომ ციხე ათიოდე წლით ადრე აშენდა. გაღმა ნაპირის ლევანს ტყუილად არ ეშინოდა: აფხაზ მეუღლეს
    ცხვირ-ყური დააჭრა და მამის სახლში დააბრუნა, შემდეგ კი აფხაზეთი თავად აიკლო.


    გეგმაც ომისთვისაა ნაფიქრი. ბორცვის ჩრდილოეთ ნაწილს ციტადელი აგვირგვინებს, სამხრეთ ფერდობზე ქვედა ეზო
    ეშვება, ყველაფერს კი 10–12 მეტრი სიმაღლის გალავანი ერტყმის. გალავნის ქვედა რვა-ათი მეტრი ყრუა, ღიობის
    გარეშე: ბრძოლა ზემოდან, საბრძოლო ბილიკებიდან იმართებოდა. შიგნით დღესაც ისე შეხვალთ, როგორც მაშინ შედიოდნენ
    — გალავანში ჩაშენებული კოშკის პირველი სართულიდან. ჩრდილო-აღმოსავლეთით დონჟონი, ციხის უკანასკნელი თავშესაფარი
    აღმართულა, სამხრეთ-დასავლეთის კოშკზე კი ოდესღაც ზარბაზნები იდგა.


    ციხემ თავისი საქმე დიდხანს აკეთა. 1672 წელს აქ ოსმალებს ლევან III დადიანი აფარებდა თავს; 1723 წლისთვის
    ციხე თავად ოსმალებს ეჭირათ, 1770 წელს კი ქართულ-რუსულმა ლაშქარმა ისინი აქედან განდევნა. 1779 წელს
    რუხსა და ზუგდიდს შორის იმერეთის, ოდიშისა და გურიის გაერთიანებულმა ჯარმა ოსმალეთის წაქეზებით შემოსეული
    ლაშქარი სასტიკად დაამარცხა — ამ გამარჯვებამ ჩრდილო-დასავლეთიდან თურქთა შემოტევა დიდი ხნით შეაჩერა.


    ლევანის კარის წარმოსადგენად კრისტოფორო კასტელის თვალს მიენდეთ. ამ იტალიელმა თეატინელმა მისიონერმა
    საქართველოში ოცდაორი წელი გაატარა და შვიდი ტომი ჩანაწერებითა და კალმით შესრულებული ჩანახატებით აავსო.
    ხელნაწერი 1878 წელს პალერმოში აღმოაჩინეს, ქართველოლოგებმა კი მის შესახებ მხოლოდ 1910 წელს შეიტყვეს.


    დღეს კედლებს სურო ფლობს. ზემოდან ენგური ჩანს, რომელიც ისევ იმ სადავო გაღმა ნაპირს ჩაუდის, ლევანი რომ
    უყურებდა; შეიცვალა მხოლოდ დავის სახელი.
  tip: >-
    ნახევარი საათიდან ერთ საათამდე საკმარისია და რუხი ზუგდიდის დღეს კარგად ერწყმის. აქ არაფერია მოწყობილი:
    არც ბილეთი, არც დარაჯი, არც ტუალეტი, არც წყალი, არც ნამდვილი ბილიკი. ბალახი მაღალია, ქვა მოშლილი,
    ორმოები ბარდებშია დამალული, ამიტომ დახურული ფეხსაცმელი და გრძელი შარვალი აუცილებელია; ბალახში ფეხი
    ხმაურით დადგით, გველი შეიძლება შეგხვდეთ. ბავშვებთან ერთად კოშკებზე ასვლა არ ღირს. კედლების გეგმა ყველაზე
    კარგად გვიან შემოდგომაზე და ადრე გაზაფხულზე იკითხება, როცა ეკალბარდი ჩამოწოლილია. ენგურის გამშვები
    პუნქტი ახლოსაა: სამხედროებს, პოლიციასა და საგუშაგოებს ნუ გადაუღებთ. კაფე და მაღაზია ზუგდიდშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით იარეთ, გორისა და ქუთაისის გავლით სამტრედიამდე, შემდეგ ისევ
    ს1-ით, სენაკის გავლით, ზუგდიდამდე. ზუგდიდიდან იმავე გზას ჩრდილო-დასავლეთით, ენგურის ხიდის მიმართულებით
    გაჰყევით და რვაიოდე კილომეტრში სოფელ რუხში შეხვალთ. სულ დაახლოებით 330 კილომეტრი და ხუთ საათზე ცოტა
    ნაკლები სავალია, ბოლომდე ასფალტით. სოფლიდან ბორცვისკენ მოკლე შესახვევი ადის; მისი ბოლო რამდენიმე ასეული
    მეტრი მოუასფალტებელია და წვიმის შემდეგ ტალახიანი, ამიტომ მანქანა გზისპირას დატოვეთ და ფეხით აუყევით.
    საწვავი ზუგდიდში ჩაასხით. მშრალ ამინდში ეკონომ-კლასის მანქანა სავსებით საკმარისია. ხიდის საგუშაგომდე
    წასვლა საჭირო არ არის — ციხე მის აქეთაა.
en:
  name: Rukhi Fortress
  short: >-
    Levan II Dadiani's frontier stronghold above the Enguri: an ivy-bound citadel that housed Ottoman
    garrisons and saw the victory of 1779.
  body: >-
    **Rukhi was built to watch a river, and for two centuries that river brought it nothing but trouble.**


    The fortress stands on a wooded hill above the village of Rukhi, on the left bank of the Enguri, some
    eight kilometres north-west of Zugdidi. It was raised by Levan II Dadiani, the ruthless, cunning prince
    who ruled Mingrelia from 1611 to 1657; Prince Vakhushti dates it to 1647, others a decade earlier.
    Levan had good reason to fear the far bank: he had cut off the nose and ears of his Abkhaz wife, sent
    her home to her father, and then looted Abkhazia.


    The plan was drawn for war. A citadel crowns the north of the hill and a lower yard falls away down
    the southern slope, all ringed by a curtain wall 10–12 metres high. Its lowest eight to ten metres
    are blind; the fighting was done from wall-walks along the top. You still enter as the garrison did,
    through a tower set into the wall. At the north-east corner rises the donjon, the last refuge; a south-western
    tower once carried cannon.


    Levan III sheltered here from the Ottomans in 1672; by 1723 the Turks held the place themselves, until
    a Georgian and Russian force drove them out in 1770. In 1779 the combined armies of Imereti, Mingrelia
    and Guria routed an Ottoman-backed invasion between Rukhi and Zugdidi, halting the Turkish advance
    from the north-west for years.


    To picture Levan's court, borrow the eyes of Cristoforo Castelli, a Theatine missionary who spent
    twenty-two years in Georgia and filled seven volumes with notes and pen-and-ink drawings; the manuscript
    surfaced in Palermo only in 1878.


    Ivy holds the walls now. From the top the Enguri still slides past the contested far bank Levan watched;
    only the name of the quarrel has changed.
  tip: >-
    Half an hour to an hour is plenty, and Rukhi slots neatly into a Zugdidi day. Nothing here is organised:
    no ticket, no guard, no toilet, no water, no path worth the name. The grass is tall, the stone loose
    and holes hide in the brambles, so wear closed shoes and long trousers, and tread heavily in case
    of snakes. Skip the towers with children. The plan of the walls reads best in late autumn and early
    spring, when the undergrowth is down. The Enguri crossing is close: do not photograph soldiers, police
    or checkpoints. Cafés and shops are in Zugdidi.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Kutaisi to Samtredia, then stay on the S1 through
    Senaki to Zugdidi. From Zugdidi follow the same road north-west towards the Enguri bridge for about
    eight kilometres to the village of Rukhi. In all it is about 330 km and just under five hours, on
    asphalt the whole way. In the village a short lane climbs towards the hill; its last few hundred metres
    are unsurfaced and muddy after rain, so park at the roadside and walk up. Fuel in Zugdidi. An economy
    car is enough in dry weather. There is no need to drive on to the bridge checkpoint: the fortress
    is on this side of it.
ru:
  name: Крепость Рухи
  short: >-
    Пограничная твердыня Левана II Дадиани над Ингури: увитая плющом цитадель, где стояли османские гарнизоны,
    свидетельница победы 1779 года.
  body: >-
    **Рухи построили, чтобы стеречь реку, — и два столетия эта река не приносила крепости ничего, кроме
    бед.**


    Крепость стоит на лесистом холме над селом Рухи, на левом берегу Ингури, примерно в восьми километрах
    к северо-западу от Зугдиди. Её возвёл Леван II Дадиани — безжалостный и хитроумный владетель, правивший
    Мегрелией с 1611 по 1657 год. Царевич Вахушти датирует крепость 1647 годом, другие авторы — на десятилетие
    раньше. У Левана были веские причины опасаться противоположного берега: он отрезал своей жене-абхазке
    нос и уши, отослал её к отцу, а затем разграбил Абхазию.


    План чертили для войны. Северную часть холма венчает цитадель, нижний двор сбегает по южному склону,
    и всё это опоясано стеной высотой 10–12 метров. Нижние восемь–десять метров у неё глухие: сражались
    с боевых ходов, проложенных по гребню. Входят сюда и сейчас так же, как входил гарнизон, — через башню,
    встроенную в стену. В северо-восточном углу поднимается донжон, последнее убежище; на юго-западной
    башне когда-то стояли пушки.


    В 1672 году здесь укрывался от османов Леван III; к 1723 году крепостью владели уже сами турки, пока
    в 1770-м грузинско-русский отряд не выбил их отсюда. В 1779 году объединённые войска Имерети, Мегрелии
    и Гурии разгромили между Рухи и Зугдиди нашествие, за которым стояли османы, и на годы остановили
    турецкий натиск с северо-запада.


    Чтобы представить себе двор Левана, взгляните на него глазами Кристофоро Кастелли — миссионера-театинца,
    который прожил в Грузии двадцать два года и заполнил семь томов записями и рисунками пером; рукопись
    нашлась в Палермо лишь в 1878 году.


    Теперь стены держит плющ. Сверху видно, как Ингури по-прежнему скользит мимо спорного берега, за которым
    следил Леван; сменилось лишь имя раздора.
  tip: >-
    Хватит от получаса до часа, и Рухи легко вписывается в день, проведённый в Зугдиди. Здесь ничего не
    обустроено: ни билета, ни сторожа, ни туалета, ни воды, ни тропы, достойной этого слова. Трава высокая,
    камни шатаются, в колючих зарослях прячутся ямы, так что надевайте закрытую обувь и длинные брюки
    и ступайте погромче, чтобы спугнуть змей. С детьми на башни лучше не подниматься. План стен лучше
    всего читается поздней осенью и ранней весной, когда заросли редеют. Переправа через Ингури совсем
    рядом: не фотографируйте военных, полицию и блокпосты. Кафе и магазины — в Зугдиди.
  route: >-
    Из Тбилиси поезжайте на запад по трассе S1 (E60) мимо Гори и Кутаиси до Самтредиа, затем по той же
    S1 через Сенаки до Зугдиди. От Зугдиди держитесь той же дороги на северо-запад, к Ингурскому мосту,
    и примерно через восемь километров окажетесь в селе Рухи. Всего около 330 км и чуть меньше пяти часов,
    всё время по асфальту. В селе к холму поднимается короткий проезд; последние несколько сотен метров
    у него без покрытия и после дождя раскисают, поэтому оставьте машину у обочины и поднимитесь пешком.
    Заправка — в Зугдиди. В сухую погоду хватит машины эконом-класса. К блокпосту у моста ехать незачем:
    крепость стоит по эту сторону от него.
fa:
  name: دژ روخی
  short: >-
    دژ مرزی لوان دوم دادیانی بر فراز انگوری: ارگی پیچک‌پوش که پادگان‌های عثمانی را در خود جا داد و پیروزی
    ۱۷۷۹ را به چشم دید.
  body: >-
    **روخی را ساختند تا رودی را بپاید، و آن رود دو سده برایش جز دردسر چیزی نیاورد.**


    دژ بر تپه‌ای جنگلی بالای روستای روخی ایستاده است، بر کرانهٔ چپ انگوری و حدود هشت کیلومتری شمال غربی
    زوگدیدی. سازنده‌اش لوان دوم دادیانی بود، فرمانروای بی‌رحم و زیرکی که از ۱۶۱۱ تا ۱۶۵۷ بر مگرلیا حکم
    راند؛ شاهزاده واخوشتی ساخت آن را سال ۱۶۴۷ می‌داند و دیگران یک دهه زودتر. لوان دلیل خوبی داشت که از
    کرانهٔ روبه‌رو بترسد: بینی و گوش‌های همسر آبخازش را بریده، او را نزد پدرش پس فرستاده و سپس آبخازیا
    را غارت کرده بود.


    نقشهٔ دژ را برای جنگ کشیده‌اند. ارگ بر بخش شمالی تپه نشسته و حیاط پایینی در دامنهٔ جنوبی سرازیر می‌شود،
    و همه را دیواری ۱۰ تا ۱۲ متری در بر گرفته است. هشت تا ده متر پایینی این دیوار یکپارچه و بی‌روزن است؛
    نبرد از راهروهای نگهبانی بر فراز دیوار انجام می‌شد. امروز هم مانند سربازان پادگان از راه برجی وارد
    می‌شوید که در دل دیوار جای گرفته است. در گوشهٔ شمال شرقی، برج اصلی، آخرین پناهگاه، سر برمی‌آورد؛ برج
    جنوب غربی روزگاری توپ بر دوش داشت.


    در ۱۶۷۲ لوان سوم از دست عثمانی‌ها به اینجا پناه آورد؛ تا ۱۷۲۳ خود ترک‌ها دژ را در دست گرفته بودند،
    تا آنکه در ۱۷۷۰ نیرویی از گرجی‌ها و روس‌ها بیرونشان راند. در ۱۷۷۹ سپاهیان متحد ایمرتی، مگرلیا و گوریا
    میان روخی و زوگدیدی هجومی را که عثمانی پشتیبانش بود درهم شکستند و پیشروی ترک‌ها از شمال غرب را برای
    سال‌ها متوقف کردند.


    برای آنکه دربار لوان را پیش چشم آورید، از چشمان کریستوفورو کاستلی یاری بگیرید؛ مبلّغی تئاتینی که بیست‌ودو
    سال در گرجستان ماند و هفت جلد را از یادداشت و طراحی با قلم و مرکب پر کرد. این دست‌نوشته تازه در ۱۸۷۸
    در پالرمو پیدا شد.


    اکنون پیچک دیوارها را نگه داشته است. از بالا انگوری هنوز از کنار همان کرانهٔ مورد مناقشه‌ای می‌لغزد
    که لوان می‌پایید؛ تنها نام نزاع عوض شده است.
  tip: >-
    نیم ساعت تا یک ساعت بس است و روخی به‌راحتی در برنامهٔ یک روز در زوگدیدی جا می‌گیرد. اینجا هیچ چیز
    سامان داده نشده است: نه بلیت، نه نگهبان، نه سرویس بهداشتی، نه آب و نه کوره‌راهی که بتوان نامش را راه
    گذاشت. علف بلند است، سنگ‌ها لق‌اند و گودال‌ها زیر بوته‌های خاردار پنهان‌اند؛ پس کفش بسته و شلوار بلند
    بپوشید و محکم قدم بردارید تا مارها دور شوند. با کودکان از برج‌ها بالا نروید. نقشهٔ دیوارها اواخر پاییز
    و اوایل بهار، وقتی گیاهان فرونشسته‌اند، بهتر خوانده می‌شود. گذرگاه انگوری نزدیک است: از سربازان، پلیس
    و ایست‌های بازرسی عکس نگیرید. کافه و مغازه در زوگدیدی است.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید و از کنار گوری و کوتائیسی بگذرید تا سامتردیا، سپس روی
    همان S1 از سناکی تا زوگدیدی بروید. از زوگدیدی همین جاده را به سمت شمال غرب، رو به پل انگوری، حدود
    هشت کیلومتر ادامه دهید تا به روستای روخی برسید. رویهم حدود ۳۳۰ کیلومتر و کمی کمتر از پنج ساعت راه
    است، سراسر آسفالت. در روستا راهی کوتاه به سوی تپه بالا می‌رود؛ چند صد متر پایانی‌اش خاکی است و پس
    از باران گِل‌آلود، پس خودرو را کنار جاده بگذارید و پیاده بالا بروید. سوخت را در زوگدیدی بزنید. در
    هوای خشک خودروی کلاس اکونومی کافی است. لازم نیست تا ایست بازرسی پل بروید: دژ این سوی آن است.
he:
  name: מבצר רוחי
  short: >-
    מעוז הגבול של לוואן השני דאדיאני מעל האינגורי: מצודה עטופת קיסוס, שבה ישבו חילות מצב עות׳מאניים ושהייתה
    עדה לניצחון של 1779.
  body: >-
    **רוחי נבנה כדי לשמור על נהר, ובמשך מאתיים שנה לא הביא לו הנהר הזה אלא צרות.**


    המבצר עומד על גבעה מיוערת מעל הכפר רוחי, על הגדה השמאלית של האינגורי, כשמונה קילומטרים מצפון-מערב
    לזוגדידי. הקים אותו לוואן השני דאדיאני, הנסיך האכזר והערמומי ששלט במגרליה מ-1611 עד 1657. הנסיך ואחושטי
    מתארך את המבצר ל-1647, ואחרים – לעשור קודם לכן. ללוואן היו סיבות טובות לחשוש מן הגדה שממול: הוא כרת
    את אפה ואת אוזניה של אשתו האבחזית, שלח אותה בחזרה לבית אביה, ואחר כך בזז את אבחזיה.


    התוכנית שורטטה למלחמה. מצודה מכתירה את צפון הגבעה, חצר תחתונה משתפלת במדרון הדרומי, והכול מוקף חומה
    בגובה 10–12 מטרים. שמונה עד עשרה המטרים התחתונים שלה אטומים, בלי שום פתח; הלחימה התנהלה ממשעולי השמירה
    שלאורך ראש החומה. גם היום נכנסים כמו שנכנס חיל המצב, דרך מגדל המשולב בחומה. בפינה הצפונית-מזרחית מתנשא
    מגדל העוז, המפלט האחרון; המגדל הדרום-מערבי נשא פעם תותחים.


    ב-1672 מצא כאן לוואן השלישי מחסה מפני העות׳מאנים; ב-1723 כבר החזיקו התורכים עצמם במבצר, עד שכוח גאורגי-רוסי
    גירש אותם ב-1770. ב-1779 הביסו צבאותיהן המאוחדים של אימרתי, מגרליה וגוריה, בין רוחי לזוגדידי, פלישה
    שהעות׳מאנים עמדו מאחוריה, ובלמו לשנים את התקדמות התורכים מצפון-מערב.


    כדי לדמיין את חצרו של לוואן, השאילו את עיניו של כריסטופורו קסטלי, מיסיונר מן המסדר התיאטיני שחי עשרים
    ושתיים שנים בגאורגיה ומילא שבעה כרכים ברשימות וברישומי עט ודיו; כתב היד התגלה בפלרמו רק ב-1878.


    עכשיו הקיסוס הוא שמחזיק את החומות. מלמעלה עדיין נראה האינגורי גולש לצד הגדה השנויה במחלוקת שלוואן
    צפה בה; רק שמו של הסכסוך התחלף.
  tip: >-
    חצי שעה עד שעה מספיקות, ורוחי משתלב בקלות ביום בזוגדידי. שום דבר כאן אינו מוסדר: אין כרטיס, אין שומר,
    אין שירותים, אין מים ואין שביל הראוי לשמו. העשב גבוה, האבנים רופפות ובורות מסתתרים בין השיחים הקוצניים,
    לכן נעלו נעליים סגורות, לבשו מכנסיים ארוכים ודרכו בכבדות, למקרה שיש נחשים. עם ילדים ותרו על המגדלים.
    מתאר החומות נקרא בבירור בסוף הסתיו ובתחילת האביב, כשהצמחייה נמוכה. מעבר האינגורי קרוב: אל תצלמו חיילים,
    שוטרים או מחסומים. בתי קפה וחנויות יש בזוגדידי.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), על פני גורי וקוטאיסי, עד סמטרדיה, והמשיכו ב-S1 דרך סנאקי עד זוגדידי.
    מזוגדידי המשיכו באותו כביש צפונה-מערבה, לכיוון גשר האינגורי, כשמונה קילומטרים עד הכפר רוחי. בסך הכול
    כ-330 ק״מ ומעט פחות מחמש שעות, על אספלט לאורך כל הדרך. בכפר מטפסת דרך קצרה אל הגבעה; מאות המטרים האחרונים
    שלה אינם סלולים והופכים בוציים אחרי גשם, לכן החנו בצד הכביש ועלו ברגל. תדלקו בזוגדידי. במזג אוויר
    יבש מספיק רכב מקטגוריית אקונומי. אין צורך להמשיך עד המחסום שעל הגשר: המבצר נמצא בצד הזה שלו.
ar:
  name: قلعة روخي
  short: >-
    حصن ليفان الثاني دادياني على تخوم نهر إنغوري: قلعة يلفّها اللبلاب، أقامت فيها حاميات عثمانية وشهدت
    نصر عام 1779.
  body: >-
    **بُنيت روخي لتحرس نهراً، وطوال قرنين لم يجلب لها ذلك النهر سوى المتاعب.**


    تقوم القلعة على تلّ تكسوه الغابات فوق قرية روخي، على الضفة اليسرى لنهر إنغوري، على بعد نحو ثمانية
    كيلومترات شمال غربي زوغديدي. شيّدها ليفان الثاني دادياني، الأمير القاسي الداهية الذي حكم ميغريليا
    من 1611 إلى 1657. ويؤرّخها الأمير فاخوشتي بعام 1647، فيما يجعلها آخرون أقدم بعقد. وكان لليفان ما يدعوه
    إلى الخوف من الضفة المقابلة: فقد جدع أنف زوجته الأبخازية وقطع أذنيها وردّها إلى أبيها، ثم نهب أبخازيا.


    رُسم مخطط القلعة للحرب. تتوّج قلعةٌ داخلية شمال التل، وينحدر فناء سفلي على السفح الجنوبي، ويطوّق ذلك
    كله سور يبلغ ارتفاعه 10–12 متراً. الأمتار الثمانية إلى العشرة السفلى منه صمّاء بلا أي فتحة، إذ كان
    القتال يدور من ممرات الحراسة الممتدة على قمته. وما زال الزائر يدخل كما كانت الحامية تدخل، عبر برج
    مدمج في السور. وفي الركن الشمالي الشرقي يرتفع البرج الرئيسي، الملاذ الأخير؛ أما البرج الجنوبي الغربي
    فكان يحمل المدافع ذات يوم.


    في 1672 احتمى هنا ليفان الثالث من العثمانيين؛ وبحلول 1723 كان الأتراك أنفسهم يمسكون بالقلعة، إلى أن
    طردتهم قوة جورجية روسية مشتركة في 1770. وفي 1779 هزمت الجيوش المتحدة لإيميريتي وميغريليا وغوريا، بين
    روخي وزوغديدي، غزواً يقف العثمانيون وراءه، فأوقفت الزحف التركي من الشمال الغربي سنواتٍ.


    ولكي تتخيّل بلاط ليفان، استعر عينَي كريستوفورو كاستيلي، المبشّر من رهبنة الثياتيين الذي أمضى اثنين
    وعشرين عاماً في جورجيا وملأ سبعة مجلدات بالملاحظات والرسوم بالقلم والحبر؛ ولم تظهر المخطوطة في باليرمو
    إلا عام 1878.


    اللبلاب هو الذي يمسك بالأسوار الآن. ومن الأعلى ما زال إنغوري ينساب بمحاذاة الضفة المتنازع عليها التي
    كان ليفان يراقبها؛ لم يتغيّر إلا اسم النزاع.
  tip: >-
    تكفي نصف ساعة إلى ساعة، وتندرج روخي بسهولة في يوم تقضيه في زوغديدي. لا شيء هنا منظّم: لا تذاكر ولا
    حارس ولا دورة مياه ولا ماء ولا ممرّ يستحق هذا الاسم. العشب طويل والحجارة مفككة، والحفر تختبئ بين الشجيرات
    الشائكة، فالبس حذاءً مغلقاً وسروالاً طويلاً، واضرب الأرض بقدميك وأنت تمشي تحسّباً للأفاعي. تجنّب الأبراج
    إن كان معك أطفال. يُقرأ مخطط الأسوار على أفضل وجه في أواخر الخريف وأوائل الربيع، حين تنحسر النباتات.
    معبر إنغوري قريب: لا تصوّر الجنود أو الشرطة أو نقاط التفتيش. المقاهي والمتاجر في زوغديدي.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بغوري وكوتايسي حتى سامتريديا، ثم تابع على S1 عبر سيناكي
    إلى زوغديدي. ومن زوغديدي واصل على الطريق نفسه باتجاه الشمال الغربي، نحو جسر إنغوري، قرابة ثمانية كيلومترات
    حتى قرية روخي. المسافة الإجمالية نحو 330 كم وأقل بقليل من خمس ساعات، على الأسفلت طوال الطريق. في القرية
    يصعد درب قصير نحو التل، والمئات القليلة الأخيرة من أمتاره غير معبّدة وتتحوّل وحلاً بعد المطر، فاركن
    السيارة على جانب الطريق واصعد سيراً. التزوّد بالوقود في زوغديدي. تكفي سيارة اقتصادية في الطقس الجاف.
    لا حاجة إلى مواصلة القيادة حتى نقطة التفتيش عند الجسر، فالقلعة على هذا الجانب منها.
