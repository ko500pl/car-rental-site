ka:
  name: რუხის ციხე
  short: ლევან II დადიანის XVII საუკუნის ციხე ენგურის ნაპირზე, მრგვალი კოშკებით და ველზე გადმოსახედით.
  body: >-
    **რუხის ციხე ლევან II დადიანის ხელისუფლების ნიშანია** — ის, რაც ერთი ადამიანის ამბიციისგან სამეგრელოს
    დაბლობზე დარჩა. ციხე დაბალ ბორცვზე დგას, ენგურის მარცხენა ნაპირზე, ზუგდიდიდან რვაიოდე კილომეტრში ჩრდილო-დასავლეთით.


    ლევან II დადიანმა, რომელიც სამეგრელოს 1611 წლიდან 1657 წლამდე მართავდა, ციხე XVII საუკუნის შუა ხანებში
    ააგო. მიზანი მკაფიო იყო: ენგურის გადასასვლელის კონტროლი — ერთი მხრივ აფხაზეთის მთავრებისგან, მეორე
    მხრივ იმერეთის მეფეებისგან. ეს იმ პერიოდში ხდებოდა, როცა სამეგრელო პრაქტიკულად დამოუკიდებელი იყო და
    ლევანი ურთიერთობებს ოსმალეთთან და რუსეთთანაც დამოუკიდებლად აწარმოებდა.


    ნაგებობა მართკუთხაა, კუთხეებში მრგვალი კოშკებით. კედლები მდინარის რიყის ქვისა და აგურის მორიგე რიგებითაა
    ნაწყობი — ეს დაბლობის მეგრული ტექნიკაა და მთის ციხეების ხისტ, ფლეთილქვიან წყობას სულ სხვანაირად გამოიყურება.
    შიგნით ორსართულიანი საცხოვრებელი შენობისა და პატარა ეკლესიის ნაშთებია.


    ციხე დანგრეულია და ზაფხულში ეკალბარდით არის დაფარული. არავითარი ინფრასტრუქტურა არ არსებობს: არც ბილეთი,
    არც დაცვა, არც მოაჯირი. სწორედ ამიტომ ჯობია აქ გვიან შემოდგომაზე ან ადრე გაზაფხულზე მიხვიდე, როცა
    მცენარეულობა ჩამოწოლილია და კედლების გეგმა კარგად იკითხება. კოშკებში ასვლა შესაძლებელია, მაგრამ ქვა
    ფხვიერია — ფრთხილად.


    რისთვის იყო რუხი, უფრო ადვილად წარმოსადგენია, თუ იტალიელები წაიკითხე. ლევანის კარზე 1630-1640-იან
    წლებში ორი თეატინელი მისიონერი ცხოვრობდა — კრისტოფორო კასტელი და არქანჯელო ლამბერტი. ლამბერტიმ სამეგრელოს
    აღწერა დაწერა, კასტელიმ კი ასობით ჩანახატი დატოვა, მათ შორის თავად ლევანის პორტრეტები. ერთად ისინი
    პატარა, ძალადობრივ და ცერემონიულ სახელმწიფოს აღწერენ: ოსმალო და იტალიელი სტუმრები, ტყვეებით ვაჭრობა
    და მთავარი, რომელიც როგორც უნდოდა, ისე იქცეოდა.


    ამ ფონზე ციხე უფრო გასაგები ხდება. ის სასაზღვრო სიმაგრეც იყო და რეზიდენციაც — ადგილი, სადაც მთავარს
    ჯარიც ჰყავდა და სტუმრებსაც იღებდა.


    ზემოდან ენგურის ჭალა და შორს, ნათელ ამინდში, სვანეთის მთები ჩანს. ეს ხედი აქაური ვიზიტის ნახევარია.


    უნდა იცოდე ისიც, რომ რუხი აფხაზეთის დე-ფაქტო საზღვართან ახლოსაა: ენგურის ხიდი და გამშვები პუნქტი რამდენიმე
    კილომეტრშია, 2020 წელს კი აქვე დიდი საავადმყოფო აშენდა. ეს სამხედრო ზონა არ არის, მაგრამ საგუშაგოებისა
    და პატრულების ფოტოს გადაღება არ ღირს და ჯობია ციხის ბორცვს არ გასცდე.
  tip: >-
    ნახევარი საათი კმარა და ის ზუგდიდის მარშრუტში ბუნებრივად ჯდება. მოვლილი ბილიკი არ არსებობს: ბალახი
    მაღალია, ქვა მოშლილი, ორმოები დაფარული — დახურული ფეხსაცმელი აუცილებელია და შორტებში სიარული ზაფხულში
    არ გირჩევ. გველიც შესაძლებელია, ამიტომ ბალახში ფეხს ხმაურით დგამ. ინფრასტრუქტურა არაფერია: არც ტუალეტი,
    არც წყალი, არც ჩრდილი. ბავშვებთან ერთად კოშკებში ასვლა არ ღირს. ზუგდიდი მახლობლადაა, სადაც კაფე და
    მაღაზიაა. ფოტოსთვის საუკეთესო დროა დილა, როცა მზე ველიდან ამოდის და კედლებს გვერდიდან ანათებს.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით და ზუგდიდიდან ჩრდილო-დასავლეთით ენგურის
    ხიდის გზაზე — სულ დაახლოებით 330 კმ და ხუთ საათამდე. მთავარი გზა ასფალტია და კარგ მდგომარეობაშია.
    სოფელ რუხში მოკლე შესახვევს აიღებ ბორცვისკენ; ბოლო რამდენიმე ასეული მეტრი უასფალტოა და წვიმის შემდეგ
    ტალახიანი. მანქანა გზის პირას ან სოფლის ბოლოს დატოვე. საწვავი ზუგდიდში აიღე. მშრალ ამინდში ეკონომ-კლასის
    ავტომობილი საკმარისია; ხანგრძლივი წვიმის შემდეგ კი ბოლო მონაკვეთი ჯიპისთვისაც უსიამოვნო ხდება.
en:
  name: Rukhi Fortress
  short: >-
    Levan II Dadiani’s 17th-century fortress above the Enguri, with round towers and a wide view over
    the floodplain.
  body: >-
    **Rukhi is what one man's ambition left standing on the Mingrelian plain.** The fortress sits on a
    low hill on the left bank of the Enguri, some eight kilometres north-west of Zugdidi.


    Levan II Dadiani, who ruled Mingrelia from 1611 to 1657, built it in the middle of the seventeenth
    century. The purpose was plain: to hold the crossing of the Enguri against the princes of Abkhazia
    on one side and the kings of Imereti on the other. This was the period when Mingrelia was effectively
    independent and Levan conducted his own dealings with the Ottomans and with Russia.


    The plan is rectangular with round corner towers. The walls are built in alternating courses of river
    cobbles and brick, the standard lowland Mingrelian technique, and they look quite unlike the hard
    rubble masonry of the mountain fortresses. Inside are the remains of a two-storey residential block
    and a small church.


    The place is ruined and, in summer, largely swallowed by brambles. There is no infrastructure whatever:
    no ticket, no guard, no railing, no path worth the name. That is a reason to come in late autumn or
    early spring, when the vegetation is down and the plan of the walls can actually be read. The towers
    can be climbed, but the stone is loose and the stairs are gone.


    What Rukhi was for is easier to picture if you have read the Italians. Two Theatine missionaries,
    Cristoforo Castelli and Arcangelo Lamberti, lived at Levan's court in the 1630s and 1640s. Lamberti
    wrote a description of Mingrelia, and Castelli left hundreds of sketches, including portraits of Levan
    himself. Between them they record a small, violent, ceremonious state with Ottoman and Italian visitors,
    a trade in captives, and a ruler who did much as he pleased. Against that background the fortress
    makes sense as both a frontier work and a residence.


    From the top you look out over the Enguri floodplain and, on a clear day, to the mountains of Svaneti
    in the distance. That view is half the reason for the visit.


    It is worth knowing that Rukhi is close to the de facto boundary with Abkhazia. The Enguri bridge
    and the crossing point are a few kilometres away, and a large hospital was built here in 2020. This
    is not a military zone, but photographing checkpoints or patrols is a bad idea, and it is sensible
    to stay on the fortress hill.
  tip: >-
    Half an hour is plenty, and it slots naturally into a Zugdidi day. There is no maintained path: the
    grass is high, the stone is loose and holes are hidden, so closed shoes are essential and shorts are
    a poor idea in summer. Snakes are possible, so walk heavily through long grass. There are no facilities
    at all — no toilet, no water, no shade. Climbing the towers with children is not worth the risk. Zugdidi
    is close by for a café and a shop.
  route: >-
    From Tbilisi take the E60 to Senaki, continue to Zugdidi, then head north-west on the road towards
    the Enguri bridge — about 330 km in all and just under five hours. The main road is asphalt and in
    good condition. In the village of Rukhi a short lane turns off towards the hill; the last few hundred
    metres are unsurfaced and muddy after rain. Leave the car at the roadside or at the end of the village
    and walk up. Refuel in Zugdidi. In dry weather an economy car is enough.
ru:
  name: Крепость Рухи
  short: Крепость Левана II Дадиани XVII века над Ингури, с круглыми башнями и широким видом на пойму.
  body: >-
    **Рухи — это то, что осталось на мегрельской равнине от честолюбия одного человека.** Крепость стоит
    на невысоком холме на левом берегу Ингури, километрах в восьми к северо-западу от Зугдиди.


    Леван II Дадиани, правивший Мегрелией с 1611 по 1657 год, построил её в середине XVII века. Задача
    была очевидной: держать переправу через Ингури против абхазских владетелей с одной стороны и имеретинских
    царей с другой. Это было время, когда Мегрелия фактически была самостоятельной, а Леван вёл собственные
    дела и с османами, и с Россией.


    План прямоугольный, с круглыми угловыми башнями. Стены сложены чередующимися рядами речной гальки
    и кирпича — обычная низинная мегрельская техника, совсем не похожая на жёсткую бутовую кладку горных
    крепостей. Внутри сохранились остатки двухэтажного жилого корпуса и небольшой церкви.


    Место разрушено и летом почти целиком заросло ежевикой. Инфраструктуры нет никакой: ни билета, ни
    охраны, ни перил, ни тропы в настоящем смысле слова. Поэтому лучше приезжать поздней осенью или ранней
    весной, когда растительность полегла и план стен читается. На башни можно подняться, но камень осыпается,
    а лестниц не осталось.


    Для чего был нужен Рухи, легче представить, если читать итальянцев. При дворе Левана в 1630-е и 1640-е
    годы жили два миссионера-театинца, Кристофоро Кастелли и Арканджело Ламберти. Ламберти написал описание
    Мегрелии, а Кастелли оставил сотни зарисовок, включая портреты самого Левана. Вместе они рисуют маленькое,
    жестокое и церемонное государство с османскими и итальянскими гостями, торговлей пленниками и владетелем,
    поступавшим как ему вздумается. На этом фоне крепость понятна и как пограничное сооружение, и как
    резиденция.


    Сверху открывается пойма Ингури, а в ясный день вдали видны горы Сванетии. Этот вид — половина смысла
    поездки.


    Стоит знать, что Рухи находится недалеко от фактической границы с Абхазией. Ингурский мост и пропускной
    пункт в нескольких километрах, а в 2020 году здесь построили большую больницу. Это не военная зона,
    но снимать блокпосты и патрули не стоит, и разумнее не уходить с крепостного холма.
  tip: >-
    Получаса вполне достаточно, и он естественно вписывается в зугдидский день. Ухоженной тропы нет: трава
    высокая, камень шатается, ямы скрыты, так что закрытая обувь обязательна, а шорты летом — плохая идея.
    Возможны змеи, поэтому в высокой траве ступайте тяжело. Никаких удобств здесь нет — ни туалета, ни
    воды, ни тени. Лезть на башни с детьми не стоит. Зугдиди рядом, там есть кафе и магазины.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше до Зугдиди, затем на северо-запад по дороге к Ингурскому мосту
    — всего около 330 км и чуть меньше пяти часов. Основная дорога асфальтированная и в хорошем состоянии.
    В селе Рухи короткий съезд ведёт к холму; последние несколько сотен метров без покрытия и после дождя
    грязные. Машину оставьте у обочины или в конце села и поднимайтесь пешком. Заправляйтесь в Зугдиди.
    В сухую погоду хватает машины эконом-класса.
fa:
  name: دژ روخی
  short: دژ سدهٔ هفدهمی لوان دوم داديانی بر فراز اینگوری، با برج‌های گرد و چشم‌اندازی گشوده بر دشت سیلابی.
  body: >-
    **روخی همان چیزی است که بلندپروازی یک مرد بر دشت مینگرلی بر جای گذاشته است.** دژ بر تپه‌ای کوتاه در
    ساحل چپ اینگوری، حدود هشت کیلومتری شمال غربی زوگدیدی، ایستاده است.


    لوان دوم داديانی که از ۱۶۱۱ تا ۱۶۵۷ بر مینگرلیا فرمان راند، آن را در میانهٔ سدهٔ هفدهم ساخت. هدف روشن
    بود: نگاه داشتن گذرگاه اینگوری در برابر امیران آبخازیا از یک سو و پادشاهان ایمرتی از سوی دیگر. این
    روزگاری بود که مینگرلیا عملاً مستقل بود و لوان با عثمانی و روسیه به‌تنهایی داد و ستد می‌کرد.


    طرح مستطیل است با برج‌های گرد در گوشه‌ها. دیوارها از ردیف‌های متناوب قلوه‌سنگ رودخانه و آجر چیده شده‌اند؛
    این شیوهٔ رایج جلگهٔ مینگرلی است و به‌کلی با سنگ‌چین درشت و سخت دژهای کوهستانی فرق دارد. در درون،
    بازمانده‌های ساختمانی مسکونی دو طبقه و کلیسایی کوچک هست.


    جا ویران است و در تابستان تقریباً یکسره زیر خارها گم می‌شود. هیچ زیرساختی وجود ندارد: نه بلیتی، نه
    نگهبانی، نه نرده‌ای و نه مسیری که بتوان نامش را راه گذاشت. به همین سبب بهتر است اواخر پاییز یا اوایل
    بهار بیایید، وقتی پوشش گیاهی خوابیده و نقشهٔ دیوارها خوانده می‌شود. می‌توان از برج‌ها بالا رفت، اما
    سنگ سست است و پلکان‌ها از میان رفته‌اند.


    اینکه روخی برای چه بود، اگر ایتالیایی‌ها را خوانده باشید آسان‌تر تصور می‌شود. در دههٔ ۱۶۳۰ و ۱۶۴۰
    دو مبلغ تئاتینی، کریستوفورو کاستلی و آرکانجلو لامبرتی، در دربار لوان زیستند. لامبرتی وصفی از مینگرلیا
    نوشت و کاستلی صدها طرح بر جای گذاشت، از جمله چهره‌نگاری‌هایی از خود لوان. آن دو با هم دولتی کوچک و
    خشن و پرتشریفات را ثبت کرده‌اند، با مهمانان عثمانی و ایتالیایی، داد و ستد اسیران، و فرمانروایی که
    هرچه می‌خواست می‌کرد. در چنین زمینه‌ای دژ هم به‌عنوان بنایی مرزی و هم به‌عنوان اقامتگاه معنا پیدا
    می‌کند.


    از بالا دشت سیلابی اینگوری پیداست و در روز صاف کوه‌های سوانتی در دوردست. همین منظره نیمی از ارزش سفر
    است.


    خوب است بدانید که روخی به مرز عملی با آبخازیا نزدیک است. پل اینگوری و گذرگاه در چند کیلومتری‌اند و
    در ۲۰۲۰ بیمارستانی بزرگ همین‌جا ساخته شد. اینجا منطقهٔ نظامی نیست، اما عکس گرفتن از پاسگاه‌ها و گشت‌ها
    کار درستی نیست و عاقلانه است که از تپهٔ دژ بیرون نروید.
  tip: >-
    نیم ساعت بس است و به‌آسانی در برنامهٔ یک روز زوگدیدی جا می‌گیرد. راه نگهداری‌شده‌ای نیست: علف بلند
    است، سنگ‌ها لق‌اند و گودال‌ها پنهان، پس کفش بسته ضروری است و شلوارک در تابستان فکر بدی است. احتمال
    مار هست، پس در علفزار محکم قدم بردارید. هیچ امکاناتی موجود نیست: نه سرویس بهداشتی، نه آب و نه سایه.
    بالا رفتن از برج‌ها همراه کودک به خطرش نمی‌ارزد. زوگدیدی نزدیک است و کافه و مغازه دارد.
  route: >-
    از تفلیس با E60 تا سناکی، سپس تا زوگدیدی و از آنجا به شمال غربی در جادهٔ پل اینگوری — رویهم حدود ۳۳۰
    کیلومتر و کمی کمتر از پنج ساعت. جادهٔ اصلی آسفالت و در وضعیت خوبی است. در روستای روخی راهی کوتاه به
    سوی تپه جدا می‌شود؛ چند صد متر پایانی بی‌آسفالت است و پس از باران گِلی. خودرو را کنار جاده یا در انتهای
    روستا بگذارید و پیاده بالا بروید. سوخت را در زوگدیدی بگیرید. در هوای خشک خودروی اقتصادی کافی است.
he:
  name: מבצר רוחי
  short: מבצרו של לוואן השני דאדיאני מן המאה ה-17 מעל האינגורי, עם מגדלים עגולים ונוף רחב אל המישור.
  body: >-
    **רוחי הוא מה שהשאירה שאפתנותו של אדם אחד על מישור מינגרליה.** המבצר יושב על גבעה נמוכה בגדה השמאלית
    של האינגורי, כשמונה קילומטרים מצפון-מערב לזוגדידי.


    לוואן השני דאדיאני, ששלט במינגרליה בין 1611 ל-1657, בנה אותו באמצע המאה השבע-עשרה. המטרה הייתה ברורה:
    להחזיק את מעבר האינגורי מול נסיכי אבחזיה מצד אחד ומלכי אימרתי מן הצד האחר. זו הייתה התקופה שבה מינגרליה
    הייתה עצמאית למעשה, ולוואן ניהל מגעים משלו עם העות׳מאנים ועם רוסיה.


    התוכנית מלבנית ובפינותיה מגדלים עגולים. החומות בנויות בשורות מתחלפות של חלוקי נהר ולבנים, הטכניקה
    המינגרלית המקובלת במישור, והן נראות אחרת לגמרי מן הבנייה הגסה של מבצרי ההרים. בפנים שרידי מבנה מגורים
    דו-קומתי וכנסייה קטנה.


    המקום הרוס ובקיץ בלוע כמעט כולו בסבכי פטל. אין כאן שום תשתית: אין כרטיס, אין שומר, אין מעקה ואין שביל
    הראוי לשמו. זו סיבה טובה לבוא בסוף הסתיו או בתחילת האביב, כשהצמחייה שוכבת ואפשר באמת לקרוא את מתאר
    החומות. אפשר לטפס במגדלים, אך האבן רופפת והמדרגות אינן.


    לשם מה נבנה רוחי קל יותר לדמיין אם קראתם את האיטלקים. בחצרו של לוואן חיו בשנות השלושים והארבעים של
    המאה השבע-עשרה שני מיסיונרים תיאטינים, כריסטופורו קסטלי וארקנג׳לו למברטי. למברטי כתב תיאור של מינגרליה,
    וקסטלי הותיר מאות רישומים ובהם דיוקנאות של לוואן עצמו. יחד הם מתעדים מדינה קטנה, אלימה ורבת טקסים,
    עם אורחים עות׳מאנים ואיטלקים, מסחר בשבויים ושליט שעשה פחות או יותר כרצונו. על רקע זה המבצר מובן גם
    כמעוז גבול וגם כמשכן.


    מלמעלה נשקף מישור ההצפה של האינגורי, וביום בהיר גם הרי סוונתי במרחק. הנוף הזה הוא חצי מן הסיבה לביקור.


    כדאי לדעת שרוחי סמוך לגבול השליטה בפועל עם אבחזיה. גשר האינגורי ונקודת המעבר במרחק כמה קילומטרים,
    וב-2020 נבנה כאן בית חולים גדול. אין זה שטח צבאי, אך צילום מחסומים או סיורים אינו רעיון טוב, וכדאי
    להישאר על גבעת המבצר.
  tip: >-
    חצי שעה די והותר, והיא משתלבת בטבעיות ביום בזוגדידי. אין שביל מתוחזק: העשב גבוה, האבן רופפת והבורות
    מוסתרים, לכן נעליים סגורות הן הכרח ומכנסיים קצרים בקיץ הם רעיון גרוע. ייתכנו נחשים, אז דרכו בכבדות
    בעשב הגבוה. אין כאן שום מתקנים — לא שירותים, לא מים ולא צל. טיפוס במגדלים עם ילדים אינו שווה את הסיכון.
    זוגדידי קרובה, ובה בית קפה וחנויות.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי, ואז צפונה-מערבה בדרך אל גשר האינגורי — כ-330 ק״מ בסך הכול
    וקצת פחות מחמש שעות. הכביש הראשי סלול ובמצב טוב. בכפר רוחי נפרדת דרך קצרה אל הגבעה; מאות המטרים האחרונים
    אינם סלולים ובוציים אחרי גשם. השאירו את הרכב בצד הדרך או בקצה הכפר ועלו ברגל. תדלקו בזוגדידי. במזג
    אוויר יבש רכב חסכוני מספיק.
ar:
  name: قلعة روخي
  short: قلعة ليفان الثاني داديياني من القرن السابع عشر فوق نهر إنغوري، بأبراج مستديرة وإطلالة واسعة على
    السهل.
  body: >-
    **روخي هي ما تركه طموح رجل واحد قائماً على سهل مينغريليا.** تجلس القلعة على تل منخفض في الضفة اليسرى
    لنهر إنغوري، على نحو ثمانية كيلومترات شمال غربي زوغديدي.


    بناها ليفان الثاني داديياني، الذي حكم مينغريليا من 1611 إلى 1657، في منتصف القرن السابع عشر. وكان
    الغرض واضحاً: الإمساك بمعبر إنغوري في وجه أمراء أبخازيا من جهة وملوك إيميريتي من جهة أخرى. وكان ذلك
    زمن استقلال مينغريليا فعلياً، حين كان ليفان يدير معاملاته مع العثمانيين ومع روسيا بنفسه.


    المخطط مستطيل بأبراج مستديرة في الأركان. والأسوار مبنية بمداميك متناوبة من حصى النهر والآجر، وهي التقنية
    المينغريلية المألوفة في السهل، وتبدو مختلفة تماماً عن البناء الحجري الخشن في قلاع الجبال. وفي الداخل
    بقايا مبنى سكني من طابقين وكنيسة صغيرة.


    الموقع خرب، وفي الصيف يبتلعه العليق كله تقريباً. ولا بنية تحتية هنا إطلاقاً: لا تذكرة ولا حارس ولا
    درابزين ولا ممر يستحق الاسم. ولهذا يُستحسن المجيء في أواخر الخريف أو أوائل الربيع حين ينحسر النبات
    ويمكن قراءة مخطط الأسوار فعلاً. ويمكن صعود الأبراج، لكن الحجر مفكك والدرج زال.


    ويسهل تخيل الغرض من روخي إذا قرأت الإيطاليين. فقد أقام في بلاط ليفان في ثلاثينيات وأربعينيات القرن
    السابع عشر مبشران من الرهبنة التياتينية، كريستوفورو كاستيلي وأركانجيلو لامبرتي. كتب لامبرتي وصفاً
    لمينغريليا، وترك كاستيلي مئات الرسوم ومنها صور لليفان نفسه. وهما معاً يوثقان دولة صغيرة عنيفة كثيرة
    المراسم، فيها ضيوف عثمانيون وإيطاليون، وتجارة في الأسرى، وحاكم يفعل ما يشاء تقريباً. وعلى هذه الخلفية
    تصير القلعة مفهومة بوصفها عملاً حدودياً ومقراً في آنٍ معاً.


    من الأعلى يمتد سهل إنغوري الفيضي، وفي يوم صافٍ تظهر جبال سفانيتي بعيدة. وهذا المنظر نصف سبب الزيارة.


    ومن المفيد معرفة أن روخي قريبة من خط الفصل الفعلي مع أبخازيا. فجسر إنغوري ونقطة العبور على بعد كيلومترات،
    وفي 2020 بُني هنا مستشفى كبير. وليست هذه منطقة عسكرية، لكن تصوير نقاط التفتيش أو الدوريات فكرة سيئة،
    ومن الحكمة البقاء على تل القلعة.
  tip: >-
    نصف ساعة تكفي وتزيد، وتندرج طبيعياً في يوم زوغديدي. لا يوجد ممر مصان: العشب عالٍ والحجر مفكك والحفر
    مخفية، فالحذاء المغلق ضرورة والسروال القصير فكرة سيئة في الصيف. والأفاعي ممكنة، فامشِ بثقل في العشب
    الطويل. ولا مرافق هنا مطلقاً: لا دورة مياه ولا ماء ولا ظل. وصعود الأبراج مع الأطفال لا يستحق المخاطرة.
    وزوغديدي قريبة وفيها مقاهٍ ومتاجر. وأفضل وقت للتصوير هو الصباح حين تشرق الشمس من جهة السهل فتضيء الأسوار
    من الجانب.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم إلى زوغديدي، ومنها شمالاً غرباً على طريق جسر إنغوري — نحو
    330 كم إجمالاً وأقل قليلاً من خمس ساعات. الطريق الرئيسي معبّد وبحالة جيدة. وفي قرية روخي يتفرع درب
    قصير نحو التل؛ والمئات الأخيرة من الأمتار غير معبّدة وموحلة بعد المطر. اترك السيارة على جانب الطريق
    أو في آخر القرية واصعد سيراً. تزوّد بالوقود في زوغديدي. وفي الجو الجاف تكفي السيارة الاقتصادية.
