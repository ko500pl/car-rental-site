ka:
  name: კოლხეთის ეროვნული პარკი და პალიასტომის ტბა
  short: >-
    საქართველოს დიდი სანაპირო ჭაობი ფოთის სამხრეთით — ტორფნარები, დატბორილი მურყნარი და ფრინველებით სავსე
    მლაშე ლაგუნა.
  body: >-
    **კოლხეთი ის არის, რასაც შავი ზღვის მთელი ქართული სანაპირო ჰგავდა მანამ, სანამ დამშრობი ინჟინრები
    მოვიდოდნენ.** ეროვნული პარკი ამ ლანდშაფტის თითქმის ოცდაათ ათას ჰექტარს იცავს: მხოლოდ წვიმით კვებად
    ტორფნარებს, დატბორილ მურყნის ტყეს, ქვიშის დიუნებს, რიონისა და ფიჩორის ქვემო დინებას და პალიასტომის
    ტბას — ზღვასთან არხით დაკავშირებულ, დაახლოებით თვრამეტკვადრატულკილომეტრიან მლაშე ლაგუნას, ფოთის სამხრეთით.


    სწორედ ტორფნარების გამო შეიტანა იუნესკომ პარკი 2021 წელს მსოფლიო მემკვიდრეობის ნუსხაში, კოლხეთის წვიმის
    ტყეებისა და ჭარბტენიანი ტერიტორიების შემადგენლობაში. ეს გუმბათისებრი სფაგნუმის ჭაობებია, რომლებსაც
    მიწისქვეშა წყალი კი არ კვებავს, არამედ მხოლოდ ატმოსფერული ნალექი; ზოგი მათგანი ათ მეტრზე ღრმაა და
    ამ განედზე მსგავსი მეორე არსად მოიძებნება. ტორფი აქ დაახლოებით ათი ათასი წელია გროვდება — მას შემდეგ,
    რაც ზღვამ უკან დაიხია. იმნათის ბოგირზე სიარულისას გრძნობ, როგორ იღუნება მთელი ზედაპირი ფეხქვეშ.


    კოლხეთის დაბლობის უმეტესობა დღეს ასეთი აღარაა. ოცდაათიან წლებში ჭაობების დაშრობა დაიწყეს და მალარიის
    წინააღმდეგ ევკალიპტი დარგეს; თავდაპირველი ჭარბტენიანი ტერიტორიის დაახლოებით ორი მესამედი დაიკარგა.
    ის, რასაც პარკი იცავს, ნარჩენია — და კიდეებზე დღესაც იკლებს, სადაც ტორფს ჭრიან და არხებს თხრიან.


    თავად პალიასტომი მტკნარი ტბა იყო მანამ, სანამ ზღვასთან დამაკავშირებელი არხი გააღრმავეს; დღეს მისი
    წყალი მლაშეა, სიღრმე სამ მეტრს იშვიათად აღემატება, ზაფხულში კი ტბა თბება. ლელიანები და ფიჩორის ნაპირის
    მურყნარი აქაური ვიზიტის საუკეთესო ნაწილია. ნავები ჩრდილოეთ ნაპირის ბაქნიდან გადის და მდინარეზე მიიწევს
    იმ ხეებს შორის, რომლებიც პირდაპირ წყალში დგანან; გზად ჩანს ჩვამების სამოსახლოები, სეზონზე კი ვარდისფერი
    ვარხვები, ყარყატები და ყანჩები.


    კოლხეთი ევრაზიის ერთ-ერთი ყველაზე დატვირთული მიგრაციული დერეფნის ქვეშ დგას. სექტემბერსა და ოქტომბერში
    თავზე გადაივლის ის მტაცებელი ფრინველების ნაკადი, რომელმაც ბათუმის ხეობას სახელი გაუთქვა, ჭაობები კი
    წყალმცურავებით ივსება. გაზაფხული ბუდობის სეზონია და ისეთი ბაყაყების გუნდი, რომელსაც ვერსად მოისმენ.


    ზაფხული ცხელი, ნოტიო და კოღოებით სავსეა; ლელი მაღალია, ფრინველი კი ჩუმად არის. თუ შეგიძლია, შუალედურ
    სეზონებზე ჩამოდი. გვიან შემოდგომაზე, დილის ნათელ ამინდში, ტბის ზედაპირზე დაცემული სინათლე და შორს,
    ჩრდილო-აღმოსავლეთით მოჩანდი კავკასიონი აქაური ყველაზე ძვირფასი სანახავია.
  tip: >-
    სამი საათი დაგჭირდება: ერთი — ვიზიტორთა ცენტრსა და ბოგირებზე, დანარჩენი — ნავით სასეირნოდ. ნავი მთავარია:
    მის გარეშე პარკის მცირე ნაწილს თუ ნახავ. ჯობია ბაქანზე ადგილზე შეთანხმდე, ვიდრე ქალაქში. მაისიდან
    სექტემბრამდე აუცილებლად წაიღე კოღოს საწინააღმდეგო საშუალება და ქუდი — წყალზე ჩრდილი არსად არის. ბინოკლი
    უფრო გამოგადგება, ვიდრე ფოტოაპარატი. ტუალეტი და პატარა კაფე ვიზიტორთა ცენტრშია; ტბაზე გასვლის შემდეგ
    არაფერია. გაზაფხულზე ბოგირები სველი და მოლიპულია, ამიტომ წყალგაუმტარი ფეხსაცმელი ჯობია. ბავშვებთან
    ერთად სიარული უსაფრთხოა, რადგან მთელი ბილიკი ბრტყელია და მოაჯირიანი.
  route: >-
    თბილისიდან გახვალ E60-ით გორზე, ქუთაისსა და სამტრედიაზე გავლით, სენაკთან კი ფოთის მიმართულებას აიღებ
    — დაახლოებით 325 კმ და ხუთ საათამდე დრო, თითქმის მთელ მონაკვეთზე ორზოლიანი გზით. პარკის ადმინისტრაცია
    და ძირითადი ბაქანი პალიასტომის ჩრდილოეთ ნაპირზეა, ფოთის ცენტრიდან რამდენიმე კილომეტრში; შესახვევი
    ფოთი-ქობულეთის გზიდანაა მითითებული. ბოლო მონაკვეთი ვიწრო ასფალტია ჭაობში, ორმოებით, მაგრამ დაბალი
    მანქანისთვისაც გასავლელი. პარკირება ვიზიტორთა ცენტრთან უფასოა და ჩრდილში. საწვავი და საკვები სამტრედიაში
    ან ფოთში აიღე — შემდეგ გზაზე არაფერია. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Kolkheti National Park and Lake Paliastomi
  short: >-
    Georgia’s great coastal wetland south of Poti — peat bogs, flooded alder forest and a brackish lagoon
    full of birds.
  body: >-
    **Kolkheti is what the whole Georgian Black Sea coast looked like before the drainage engineers arrived.**
    The national park protects a little under thirty thousand hectares of it: rain-fed peat bogs, flooded
    alder swamp, sand dunes, the lower Rioni and Pichori rivers, and Lake Paliastomi, a shallow brackish
    lagoon of roughly eighteen square kilometres just south of Poti.


    The bogs are why UNESCO added the park to the World Heritage list in 2021, as part of the Colchic
    Rainforests and Wetlands. They are domed sphagnum bogs fed only by rainfall rather than groundwater,
    some of them more than ten metres deep, and there is nothing quite like them at this latitude anywhere
    else. Peat has been accumulating here for something like ten thousand years, since the sea last drew
    back. On the Imnati boardwalk you can feel the entire surface flex under your feet.


    Most of the Colchis lowland no longer looks like this. From the 1930s the marshes were drained and
    planted with eucalyptus to drive out malaria, and something close to two-thirds of the original wetland
    was lost. What the park holds is the remainder, and it still shrinks at the edges wherever peat is
    cut and channels are dug.


    Paliastomi was a freshwater lake until the channel to the sea was deepened. It is brackish now, nowhere
    much more than three metres deep, and warm by late summer. Its reed beds and the alder woods along
    the Pichori are the best part of a visit. Boats leave from the landing on the north shore and run
    upriver between trees standing in water, past cormorant roosts and, in the right months, pelicans,
    glossy ibis and squacco herons.


    The park lies under one of the busiest migration corridors in Eurasia. In September and October the
    stream of raptors that made the Batumi bottleneck famous passes overhead, and the marshes fill with
    waders. Spring brings breeding birds and the loudest frog chorus you are ever likely to hear.


    Summer is hot, humid and full of mosquitoes; the reeds are high and the birds are quiet. Come in the
    shoulder seasons if you have the choice. Late autumn is the best of it, when the light lies flat on
    the lake and, on a clear morning, the main Caucasus range shows far off to the north-east.
  tip: >-
    Allow three hours: an hour for the visitor centre and boardwalks, the rest for a boat trip. The boat
    is the point — without it you see very little of the park. Arrange it at the landing rather than in
    town. Take insect repellent from May to September, and a hat, because there is no shade at all on
    the water. Binoculars matter more here than a camera. Toilets and a small café are at the visitor
    centre; once you are on the lake there is nothing.
  route: >-
    From Tbilisi take the E60 west through Gori, Kutaisi and Samtredia, then follow the Poti signs at
    Senaki — about 325 km and a little under five hours, dual carriageway for most of the way. The park
    administration and the main boat landing sit on the northern shore of Paliastomi, a few kilometres
    south of central Poti, and the turning is signposted from the Poti–Kobuleti road. The final stretch
    is narrow asphalt across the marsh. Refuel in Samtredia or Poti. An economy car is entirely enough.
ru:
  name: Колхетский национальный парк и озеро Палиастоми
  short: >-
    Большое приморское болото Грузии к югу от Поти — торфяники, затопленный ольшаник и солоноватая лагуна,
    полная птиц.
  body: >-
    **Колхети — это то, как выглядело всё грузинское побережье Чёрного моря до прихода инженеров-осушителей.**
    Национальный парк охраняет почти тридцать тысяч гектаров такого ландшафта: торфяники, питаемые только
    дождём, затопленный ольховый лес, песчаные дюны, низовья Риони и Пичори и озеро Палиастоми — мелководную
    солоноватую лагуну примерно в восемнадцать квадратных километров сразу к югу от Поти.


    Именно из-за болот ЮНЕСКО включила парк в список Всемирного наследия в 2021 году, в составе «Колхидских
    дождевых лесов и водно-болотных угодий». Это выпуклые сфагновые болота, которые кормит не грунтовая
    вода, а исключительно осадки; некоторые из них глубже десяти метров, и ничего подобного на этой широте
    больше нет. Торф накапливается здесь около десяти тысяч лет — с тех пор как море в последний раз отступило.
    На настиле в Имнати чувствуешь, как вся поверхность прогибается под ногами.


    Большая часть Колхидской низменности сегодня выглядит иначе. С тридцатых годов болота осушали и засаживали
    эвкалиптом, чтобы вытеснить малярию, и около двух третей исходных водно-болотных угодий было потеряно.
    То, что хранит парк, — остаток, и он продолжает подтаивать по краям всюду, где режут торф и роют каналы.


    Палиастоми был пресным озером, пока не углубили канал к морю. Теперь вода солоноватая, глубина почти
    нигде не превышает трёх метров, а к концу лета озеро прогревается. Тростниковые заросли и ольшаники
    по берегам Пичори — лучшая часть поездки. Лодки уходят от причала на северном берегу и поднимаются
    по реке между деревьями, стоящими прямо в воде, мимо колоний бакланов, а в свои месяцы — мимо пеликанов,
    каравайки и жёлтой цапли.


    Парк лежит под одним из самых оживлённых миграционных коридоров Евразии. В сентябре и октябре над
    головой идёт тот самый поток хищных птиц, что прославил батумское «бутылочное горлышко», а болота
    заполняются куликами. Весна приносит гнездящихся птиц и такой лягушачий хор, какого вы, скорее всего,
    больше нигде не услышите.


    Лето жаркое, влажное и комариное: тростник высок, птицы молчат. Если есть выбор, приезжайте в межсезонье.
    Лучше всего поздняя осень, когда свет ложится плашмя на воду, а ясным утром далеко на северо-востоке
    проступает Главный Кавказский хребет.
  tip: >-
    Закладывайте три часа: час на визит-центр и настилы, остальное — на лодку. Лодка здесь главное: без
    неё вы почти ничего не увидите. Договариваться проще прямо на причале, а не в городе. С мая по сентябрь
    обязательно возьмите средство от комаров и головной убор — тени на воде нет вовсе. Бинокль тут полезнее
    фотоаппарата. Туалет и небольшое кафе есть при визит-центре; на озере нет ничего.
  route: >-
    Из Тбилиси на запад по E60 через Гори, Кутаиси и Самтредиа, у Сенаки — по указателям на Поти: около
    325 км и чуть меньше пяти часов, почти всюду по двухполосной скоростной дороге. Администрация парка
    и главный причал — на северном берегу Палиастоми, в нескольких километрах южнее центра Поти; поворот
    обозначен с дороги Поти–Кобулети. Последний отрезок — узкий асфальт через болото. Заправляться удобнее
    в Самтредиа или в самом Поти. Машины эконом-класса вполне достаточно.
fa:
  name: پارک ملی کولخِتی و دریاچهٔ پالیاستومی
  short: تالاب بزرگ ساحلی گرجستان در جنوب پوتی — باتلاق‌های تورب، جنگل توسکای زیر آب و مردابی شور و پرپرنده.
  body: >-
    **کولخِتی همان چیزی است که تمام ساحل گرجی دریای سیاه پیش از آمدن مهندسان زهکشی بود.** پارک ملی نزدیک
    به سی هزار هکتار از این چشم‌انداز را نگه داشته است: باتلاق‌های تورب که تنها از باران تغذیه می‌شوند،
    جنگل توسکای زیر آب، تپه‌های شنی، پایین‌دست ریونی و پیچوری، و دریاچهٔ پالیاستومی — مردابی کم‌ژرفا و
    شور به وسعت حدود هجده کیلومتر مربع، درست در جنوب پوتی.


    همین باتلاق‌ها سبب شد یونسکو در ۲۰۲۱ پارک را در فهرست میراث جهانی، در قالب جنگل‌های بارانی و تالاب‌های
    کولخیس، ثبت کند. اینها باتلاق‌های گنبدی اسفاگنوم‌اند که نه از آب زیرزمینی بلکه تنها از بارش سیراب
    می‌شوند؛ برخی بیش از ده متر ژرفا دارند و در این عرض جغرافیایی نمونهٔ دیگری ندارند. تورب اینجا نزدیک
    ده هزار سال است انباشته می‌شود، از آخرین باری که دریا پس نشست. روی گذرگاه چوبی ایمناتی می‌توان خم
    شدن کل سطح زمین را زیر پا حس کرد.


    بیشتر جلگهٔ کولخیس دیگر چنین چهره‌ای ندارد. از دههٔ ۱۹۳۰ مرداب‌ها را زهکشی کردند و برای راندن مالاریا
    اکالیپتوس کاشتند، و نزدیک دو سوم تالاب اصلی از دست رفت. آنچه پارک نگه داشته باقی‌ماندهٔ آن است و هنوز
    هم در حاشیه‌ها آب می‌رود، هرجا که تورب می‌بُرند و کانال می‌کَنند.


    پالیاستومی تا پیش از ژرف‌تر شدن کانال ارتباطی با دریا آب شیرین داشت. حالا آبش شور است، ژرفایش کمتر
    از سه متر و تا اواخر تابستان گرم می‌شود. نیزارها و بیشهٔ توسکا در کنارهٔ پیچوری بهترین بخش سفر است.
    قایق‌ها از اسکلهٔ ساحل شمالی راه می‌افتند و در میان درختانی که پایشان در آب است رودخانه را بالا می‌روند،
    از کنار آشیانه‌های باکلان و در ماه‌های مناسب از کنار پلیکان، اکراس و حواصیل زرد.


    پارک زیر یکی از پرترددترین دالان‌های کوچ در اوراسیا قرار دارد. در سپتامبر و اکتبر همان رود پرندگان
    شکاری که گلوگاه باتومی را نامدار کرده از بالای سر می‌گذرد و مرداب‌ها از پرندگان کرانه‌زی پر می‌شود.
    بهار پرندگان لانه‌ساز را می‌آورد و بلندترین همسرایی قورباغه‌ای که به گوشتان خواهد رسید.


    تابستان گرم و شرجی و پر از پشه است؛ نی بلند است و پرنده خاموش. اگر دستتان باز است، در فصل‌های میانی
    بیایید. اواخر پاییز از همه بهتر است: نور روی آب پهن می‌شود و صبح‌های صاف، رشته‌کوه بزرگ قفقاز دوردست
    در شمال شرقی پیدا می‌شود.
  tip: >-
    سه ساعت در نظر بگیرید: یک ساعت برای مرکز بازدیدکنندگان و گذرگاه‌های چوبی و باقی برای قایق. قایق اصل
    کار است؛ بدون آن بخش اندکی از پارک را می‌بینید. هماهنگی را در خود اسکله انجام دهید نه در شهر. از اردیبهشت
    تا مهر حتماً مادهٔ دورکنندهٔ پشه و کلاه بردارید، چون روی آب هیچ سایه‌ای نیست. دوربین دوچشمی اینجا
    از دوربین عکاسی مهم‌تر است. سرویس بهداشتی و کافه‌ای کوچک در مرکز بازدیدکنندگان هست؛ روی دریاچه هیچ
    چیز نیست.
  route: >-
    از تفلیس با بزرگراه E60 به سمت غرب از گوری، کوتایسی و سامترِدیا بروید و در سناکی تابلوهای پوتی را
    دنبال کنید — حدود ۳۲۵ کیلومتر و کمی کمتر از پنج ساعت، بیشتر مسیر بزرگراه دوبانده. اداره پارک و اسکلهٔ
    اصلی در ساحل شمالی پالیاستومی، چند کیلومتر جنوب مرکز پوتی است و انشعاب از جادهٔ پوتی به کوبولتی تابلو
    دارد. واپسین بخش آسفالتی باریک از میان مرداب است. سوخت را در سامترِدیا یا خود پوتی بگیرید. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: הפארק הלאומי קולחתי ואגם פליאסטומי
  short: ביצת החוף הגדולה של גאורגיה מדרום לפוטי — כבול, יער אלמון מוצף ולגונה מליחה מלאת ציפורים.
  body: >-
    **קולחתי הוא מה שכל חוף הים השחור הגאורגי היה לפני שהגיעו מהנדסי הניקוז.** הפארק הלאומי משמר קרוב
    לשלושים אלף הקטרים מן הנוף הזה: כרי כבול הניזונים מגשם בלבד, יער אלמון מוצף, דיונות חול, מורד הריוני
    והפיצ׳ורי, ואגם פליאסטומי — לגונה רדודה ומליחה של כשמונה עשר קילומטרים רבועים ממש מדרום לפוטי.


    בגלל כרי הכבול הכניסה אונסק״ו את הפארק ב-2021 לרשימת המורשת העולמית, כחלק מיערות הגשם והביצות של קולכיס.
    אלה כרי כבול כיפתיים של אזוב הכבול, שאינם ניזונים ממי תהום אלא מן המשקעים בלבד; אחדים מהם עמוקים מעשרה
    מטרים, ואין להם מקבילה בקו הרוחב הזה בשום מקום. הכבול נערם כאן כעשרת אלפים שנה, מאז שהים נסוג בפעם
    האחרונה. על שביל העץ באימנתי אפשר לחוש כיצד כל פני השטח מתגמשים תחת הרגליים.


    רוב מישור קולכיס כבר אינו נראה כך. משנות השלושים ואילך ייבשו את הביצות ונטעו בהן אקליפטוס כדי לגרש
    את המלריה, וכשני שלישים מן הביצה המקורית אבדו. מה שהפארק מחזיק הוא השארית, והיא ממשיכה להצטמק בשוליים
    בכל מקום שבו חוצבים כבול וחופרים תעלות.


    פליאסטומי היה אגם מים מתוקים עד שהעמיקו את התעלה אל הים. היום מימיו מליחים, עומקם כמעט בשום מקום אינו
    עולה על שלושה מטרים, ובשלהי הקיץ הם מתחממים. קני הסוף וחורשות האלמון לאורך הפיצ׳ורי הם החלק הטוב ביותר
    בביקור. סירות יוצאות מן המזח שבחוף הצפוני ועולות במעלה הנהר בין עצים העומדים במים, על פני מושבות קורמורנים,
    ובחודשים המתאימים גם שקנאים, מגלנים ואנפות.


    הפארק שוכן תחת אחד ממסדרונות הנדידה העמוסים באירואסיה. בספטמבר ובאוקטובר עובר מעל הראש אותו זרם דורסים
    שהקנה שם לצוואר הבקבוק של בטומי, והביצות מתמלאות חופמאים. האביב מביא את הציפורים המקננות ואת מקהלת
    הצפרדעים הרועשת ביותר שתשמעו.


    הקיץ חם, לח ומלא יתושים; הסוף גבוה והציפורים שותקות. אם יש לכם ברירה, בואו בעונות המעבר. סוף הסתיו
    הוא הטוב מכול: האור נשכב שטוח על המים, ובבוקר בהיר נגלה הרכס הראשי של הקווקז הרחק בצפון-מזרח.
  tip: >-
    הקצו שלוש שעות: שעה למרכז המבקרים ולשבילי העץ, והשאר לשיט. הסירה היא העיקר — בלעדיה תראו מעט מאוד
    מן הפארק. סכמו עליה במזח עצמו ולא בעיר. ממאי עד ספטמבר קחו דוחה יתושים וכובע, כי על המים אין צל כלל.
    משקפת חשובה כאן יותר ממצלמה. שירותים ובית קפה קטן יש במרכז המבקרים; ברגע שאתם על האגם אין דבר. באביב
    שבילי העץ רטובים וחלקלקים, ולכן נעליים אטומות למים עדיפות. המסלול כולו שטוח ומגודר, כך שהוא נוח גם
    עם ילדים קטנים.
  route: >-
    מטביליסי מערבה בכביש E60 דרך גורי, קוטאיסי וסמטרדיה, ובסנאקי לפנות לפי השילוט לפוטי — כ-325 ק״מ וקצת
    פחות מחמש שעות, ברובן בכביש מהיר דו-מסלולי. הנהלת הפארק והמזח הראשי נמצאים בחוף הצפוני של פליאסטומי,
    כמה קילומטרים מדרום למרכז פוטי, והפנייה משולטת מכביש פוטי–קובולטי. הקטע האחרון הוא אספלט צר החוצה
    את הביצה, מחורר מעט אך עביר גם לרכב נמוך. החניה ליד מרכז המבקרים חינם ומוצלת. תדלקו בסמטרדיה או בפוטי
    עצמה, כי אחר כך אין תחנות. רכב חסכוני מספיק לחלוטין.
ar:
  name: حديقة كولخيتي الوطنية وبحيرة بالياستومي
  short: أكبر أرض رطبة ساحلية في جورجيا جنوب بوتي — مستنقعات خث وغابة جار غارقة وبحيرة شاطئية مالحة مليئة
    بالطيور.
  body: >-
    **كولخيتي هي صورة الساحل الجورجي للبحر الأسود كله قبل أن يصل مهندسو التجفيف.** تحمي الحديقة الوطنية
    نحو ثلاثين ألف هكتار من هذا المشهد: مستنقعات خث لا يغذيها سوى المطر، وغابة جار غارقة في الماء، وكثباناً
    رملية، ومصبّي نهري ريوني وبيتشوري، وبحيرة بالياستومي، وهي بحيرة شاطئية ضحلة مالحة تبلغ نحو ثمانية
    عشر كيلومتراً مربعاً جنوب بوتي مباشرة.


    بسبب هذه المستنقعات أدرجت اليونسكو الحديقة عام 2021 على لائحة التراث العالمي ضمن غابات كولخيس المطيرة
    وأراضيها الرطبة. إنها مستنقعات خث قبابية من طحلب السفاغنوم لا تتغذى من المياه الجوفية بل من الأمطار
    وحدها؛ بعضها يزيد عمقه على عشرة أمتار، ولا نظير لها على هذا العرض في أي مكان. يتراكم الخث هنا منذ
    نحو عشرة آلاف سنة، منذ انحسر البحر آخر مرة. وعلى ممر إمناتي الخشبي تشعر بالسطح كله ينثني تحت قدميك.


    لم يعد معظم سهل كولخيس على هذه الصورة. فمنذ الثلاثينيات جُففت المستنقعات وزُرع فيها الكافور لطرد الملاريا،
    وضاع ما يقارب ثلثي الأرض الرطبة الأصلية. وما تحفظه الحديقة هو البقية الباقية، وهي تتقلص عند الأطراف
    كلما قُطع الخث وحُفرت القنوات.


    كانت بالياستومي بحيرة عذبة إلى أن جرى تعميق القناة الموصلة إلى البحر. ماؤها اليوم مالح قليلاً، وعمقها
    لا يكاد يتجاوز ثلاثة أمتار، وتدفأ في أواخر الصيف. أجمل ما في الزيارة هو أحراش القصب وغابات الجار على
    ضفاف بيتشوري. تنطلق القوارب من الرصيف في الشاطئ الشمالي وتصعد النهر بين أشجار قائمة في الماء، بمحاذاة
    أعشاش الغاق، وفي أشهرها المناسبة بمحاذاة البجع وأبي منجل اللماع والبلشون.


    تقع الحديقة تحت واحد من أكثر ممرات الهجرة ازدحاماً في أوراسيا. في أيلول وتشرين الأول يمر فوق الرؤوس
    تيار الجوارح نفسه الذي أشهر عنق زجاجة باتومي، وتمتلئ المستنقعات بطيور الخوض. ويجلب الربيع الطيور المعشِّشة
    وأعلى جوقة ضفادع يمكن أن تسمعها.


    الصيف حار رطب مليء بالبعوض؛ القصب عالٍ والطيور صامتة. إن كان لك خيار فتعال في الفصلين الوسطيين. وأواخر
    الخريف أفضلها، حين ينبسط الضوء على الماء ويظهر في صباح صافٍ سلسلة القوقاز الكبرى بعيدة في الشمال الشرقي.
  tip: >-
    خصص ثلاث ساعات: ساعة لمركز الزوار والممرات الخشبية، والباقي لجولة القارب. القارب هو جوهر الزيارة،
    فمن دونه لن ترى إلا القليل. رتّب الأمر عند الرصيف لا في المدينة. من أيار إلى أيلول خذ طارداً للبعوض
    وقبعة، فلا ظل مطلقاً على الماء. المنظار هنا أهم من آلة التصوير. دورات المياه ومقهى صغير عند مركز الزوار؛
    أما على البحيرة فلا شيء إطلاقاً. في الربيع تكون الممرات الخشبية مبللة زلقة، فالحذاء العازل للماء أفضل.
    والمسار كله مستوٍ وله درابزين، فهو مريح مع الأطفال الصغار أيضاً.
  route: >-
    من تبليسي غرباً على الطريق E60 عبر غوري وكوتايسي وسامتريديا، ثم اتبع لافتات بوتي عند سيناكي — نحو
    325 كم وأقل قليلاً من خمس ساعات، معظمها طريق مزدوج. إدارة الحديقة والرصيف الرئيسي على الشاطئ الشمالي
    لبالياستومي، على بعد كيلومترات جنوب وسط بوتي، والمنعطف مُعلَّم من طريق بوتي–كوبوليتي. المقطع الأخير
    إسفلت ضيق يعبر المستنقع. تزوّد بالوقود في سامتريديا أو في بوتي نفسها. السيارة الاقتصادية كافية تماماً.
