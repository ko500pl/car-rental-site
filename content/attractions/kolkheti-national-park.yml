ka:
  name: კოლხეთის ეროვნული პარკი და პალიასტომის ტბა
  short: >-
    ტორფნარები, დატბორილი მურყნარი და პალიასტომის არაღრმა ტბა ფოთის სამხრეთით — ძველი კოლხეთის სველი,
    მწვანე გული, რომელსაც ნავით ათვალიერებთ.
  body: >-
    **ფოთის სამხრეთით ხმელეთი ხმელეთობას ივიწყებს: ტორფი, ლელი და ნელი, მუქი წყალი შავი ზღვისკენ მიიწევს
    — ასე გამოიყურებოდა ეს სანაპირო, სანამ მას სადრენაჟო არხები დაღარავდა.**


    კოლხეთის ეროვნული პარკი ამ სამყაროს 28 940 ჰექტარს იცავს სამეგრელოსა და გურიაში. ის 1947 წელს შექმნილი
    500-ჰექტრიანი ნაკრძალიდან გაიზარდა; იმ დროისთვის საბჭოთა დაშრობას, რომელიც განსაკუთრებით 1920-იან
    წლებში გაჩაღდა, კოლხეთის ჭაობების დიდი ნაწილი უკვე ამოეშრო. 1996 წელს ჭარბტენიანმა ტერიტორიებმა რამსარის
    სტატუსი მიიღო, პარკი 1998–1999 წლებში შეიქმნა, 2021 წელს კი იუნესკოს მსოფლიო მემკვიდრეობის ძეგლის
    — „კოლხური ტყეებისა და ჭარბტენიანი ტერიტორიების“ — ნაწილი გახდა.


    მიზეზი ტორფნარებია. ბოლო ოთხიდან ექვს ათას წლამდე აქ თიხა, ლამი და ტორფი ფენა-ფენა ილექებოდა და ადგილ-ადგილ
    ეს ფენები თორმეტ მეტრზე მეტ სისქეს აღწევს. მათ ზედაპირზე სფაგნუმის ხავსი და მრგვალფოთოლა ცვარნამი
    იზრდება — პატარა მცენარე, რომელიც დაჭერილ მწერებს ინელებს.


    სტუმრების უმეტესობა პარკს ნავიდან ეცნობა. ტურები ფოთის ვიზიტორთა ცენტრიდან გადის პალიასტომზე — 17,3
    კვადრატული კილომეტრის ტბაზე, რომლის საშუალო სიღრმე 2,6 მეტრია, უდიდესი კი 6 — და მდინარე ფიჩორში შედის,
    სადაც მურყანი და ლაპანი პირდაპირ დინებაში დგას, ყურეებში კი თეთრი დუმფარა ტივტივებს. ტბის ბერძნული
    სახელი „ძველ შესართავს“ ნიშნავს. არქეოლოგებმა ტბაში და მის ნაპირებთან კოლხური ხანის ნივთები იპოვეს,
    ზოგი მკვლევარი კი აქაურ წყლებში ანტიკურ ფასისს ეძებდა.


    პარკში ფრინველის 194 სახეობაა აღრიცხული, მათ შორის შავი ყარყატი, წერო, დიდი თეთრი ყანჩა, ყვითელი ყანჩა
    და კოვზისნისკარტა; ბინოკლის დრო გაზაფხული და შემოდგომაა.


    ადრე მოდით, როცა წყალი ჯერ კიდევ უძრავია და ერთადერთი ძრავის ხმა თქვენი ნავისაა. ოქროს საწმისის კოლხეთი
    აქ ოქროსფერი არასოდეს ყოფილა — მწვანე იყო, სველი და ცოცხალი. ამ კუთხეში დღესაც ასეთია.
  tip: >-
    სამი საათი გამოყავით: მოკლედ — ვიზიტორთა ცენტრი, დანარჩენი დრო — ნავით გასეირნება, რომელიც, ფაქტობრივად,
    პარკში შესვლის ერთადერთი გზაა. ტური ფოთში, გურიის ქუჩაზე მდებარე ვიზიტორთა ცენტრში დაჯავშნეთ; ნავით
    ტურები მთელი წლის განმავლობაში ტარდება, დაახლოებით 3-დან 10 კილომეტრზე მეტი სიგრძის მარშრუტებზე. მაისიდან
    სექტემბრამდე წაიღეთ კოღოს საწინააღმდეგო საშუალება, ქუდი და მზისგან დამცავი კრემი — ტბაზე ჩრდილი არ
    არის. ბინოკლი უფრო გამოგადგებათ, ვიდრე გრძელფოკუსიანი ობიექტივი. ზაფხული ცხელი და ნოტიოა; გაზაფხული
    და შემოდგომა უფრო სასიამოვნოა და ფრინველებისთვისაც უკეთესი. ტუალეტი ვიზიტორთა ცენტრშია, წყალზე — არა.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით, ქუთაისის გავლით, სამტრედიამდე იარეთ, შემდეგ ს12-ით ლანჩხუთის გავლით
    ზღვამდე, გრიგოლეთამდე, იქიდან კი ს2-ით ჩრდილოეთით, ფოთისკენ. ვიზიტორთა ცენტრი ფოთის სამხრეთ ნაწილში,
    გურიის ქუჩაზეა, პალიასტომის ჩრდილოეთ ნაპირთან ახლოს: სულ დაახლოებით 326 კმ და 4 საათი და 35 წუთი.
    გზა ბოლომდე ასფალტია, დიდწილად სწრაფი მაგისტრალი, ამიტომ ეკონომ-კლასის ავტომობილი ნებისმიერ სეზონზე
    სავსებით საკმარისია. საწვავს სამტრედიაში, ლანჩხუთსა და ფოთში უპრობლემოდ იპოვით. ავტოსადგომი ვიზიტორთა
    ცენტრთანაა.
en:
  name: Kolkheti National Park and Lake Paliastomi
  short: >-
    Peat bogs, flooded alder forest and the shallow lagoon of Paliastomi, explored by boat from Poti:
    the wet green heart of ancient Colchis.
  body: >-
    **South of Poti the land forgets to be land: peat, reed and slow dark water run on towards the Black
    Sea, the way this coast looked before the drainage ditches came.**


    Kolkheti National Park protects 28,940 hectares of that world across Samegrelo and Guria. It grew
    out of a 500-hectare nature reserve created in 1947, by which time Soviet drainage, pushed hardest
    in the 1920s, had already dried out much of the Colchis marsh. The wetlands won Ramsar status in 1996,
    the park followed in 1998–99, and in 2021 it became part of UNESCO's Colchic Rainforests and Wetlands
    World Heritage site.


    The bogs are the reason. Over the last four to six thousand years clay, silt and peat have settled
    here in layers that in places run more than twelve metres deep. On their surface grow sphagnum moss
    and the round-leaved sundew, a small plant that digests the insects it traps.


    Most visitors meet the park from a boat. Tours leave from the visitor centre in Poti onto Lake Paliastomi,
    17.3 square kilometres of water, 2.6 metres deep on average and 6 at most, and into the Pichori river,
    where alder and Caucasian wingnut stand in the current and white water lilies float in the backwaters.
    The lake's Greek name means 'old mouth'. Archaeologists have found Colchian-era objects in and around
    it, and some have searched these waters for ancient Phasis.


    194 bird species have been recorded, among them the black stork, crane, great white egret, squacco
    heron and Eurasian spoonbill; spring and autumn are the seasons for binoculars.


    Come early, when the water is still and the only engine is your own boat's. The Colchis of the Golden
    Fleece was never golden here. It was green, wet and alive, and in this corner it still is.
  tip: >-
    Allow three hours: a short look round the visitor centre, then a boat trip, which is really the only
    way into the park. Book at the visitor centre on Guria Street in Poti; boat tours run all year on
    routes from about 3 km to more than 10 km. From May to September bring repellent, a hat and sunscreen,
    as there is no shade on the lake. Binoculars matter more than a long lens. Summer is hot and humid;
    spring and autumn are kinder and better for birds. Toilets are at the visitor centre, not on the water.
  route: >-
    From Tbilisi follow the E60/S1 west past Kutaisi to Samtredia, then take the S12 through Lanchkhuti
    to the coast at Grigoleti and turn north on the S2 towards Poti. The visitor centre is on Guria Street
    in southern Poti, near the north shore of Paliastomi: about 326 km and 4 h 35 min in all. It is asphalt
    all the way and much of it is fast highway, so an economy car is plenty, whatever the season. Fuel
    is easy to find in Samtredia, Lanchkhuti and Poti. Parking is at the visitor centre.
ru:
  name: Колхетский национальный парк и озеро Палиастоми
  short: >-
    Торфяные болота, затопленный ольшаник и мелководная лагуна Палиастоми, куда плывут на лодке из Поти:
    влажное зелёное сердце древней Колхиды.
  body: >-
    **К югу от Поти земля забывает быть землёй: торф, тростник и медленная тёмная вода тянутся к Чёрному
    морю — таким было это побережье, пока сюда не пришли мелиоративные канавы.**


    Колхетский национальный парк охраняет 28 940 гектаров этого мира в Самегрело и Гурии. Он вырос из
    заповедника площадью 500 гектаров, созданного в 1947 году, — к тому времени советская мелиорация,
    особенно рьяная в 1920-е, уже осушила значительную часть колхидских болот. В 1996 году водно-болотные
    угодья получили рамсарский статус, в 1998–1999 годах появился парк, а в 2021-м он вошёл в объект Всемирного
    наследия ЮНЕСКО «Колхидские влажные леса и водно-болотные угодья».


    Всё дело в болотах. За последние четыре–шесть тысяч лет здесь слоями оседали глина, ил и торф, местами
    на глубину более двенадцати метров. На их поверхности растут сфагнум и росянка круглолистная — маленькое
    растение, которое переваривает пойманных насекомых.


    Большинство гостей знакомится с парком с лодки. Прогулки начинаются у визит-центра в Поти и ведут
    на озеро Палиастоми — 17,3 квадратного километра воды, в среднем 2,6 метра глубиной и не глубже 6,
    — и в реку Пичори, где в самом течении стоят ольха и лапина, а в заводях покачиваются белые кувшинки.
    Греческое название озера означает «старое устье». Археологи находили в озере и вокруг него предметы
    колхской эпохи, а кое-кто искал в этих водах древний Фасис.


    Здесь отмечено 194 вида птиц, среди них чёрный аист, серый журавль, большая белая цапля, жёлтая цапля
    и колпица; весна и осень — время для бинокля.


    Приезжайте рано, пока вода неподвижна и единственный мотор — у вашей лодки. Колхида Золотого руна
    здесь никогда не была золотой. Она была зелёной, влажной и живой — и в этом уголке такой и осталась.
  tip: >-
    Отведите три часа: короткий осмотр визит-центра, а затем прогулка на лодке — по сути, единственный
    способ попасть внутрь парка. Бронируйте в визит-центре на улице Гурия в Поти; лодочные туры ходят
    круглый год по маршрутам от 3 до более чем 10 км. С мая по сентябрь возьмите репеллент, шляпу и солнцезащитный
    крем: на озере нет тени. Бинокль важнее длиннофокусного объектива. Лето жаркое и влажное; весна и
    осень мягче и лучше для птиц. Туалеты — в визит-центре, а не на воде.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Кутаиси до Самтредиа, затем по S12 через Ланчхути к побережью у
    Григолети и на север по S2 в сторону Поти. Визит-центр стоит на улице Гурия в южной части Поти, у
    северного берега Палиастоми: всего около 326 км и 4 ч 35 мин. Всюду асфальт, большая часть пути —
    скоростная трасса, так что машины эконом-класса хватит в любое время года. Заправки легко найти в
    Самтредиа, Ланчхути и Поти. Парковка — у визит-центра.
fa:
  name: پارک ملی کلخِتی و دریاچهٔ پالیاستومی
  short: >-
    باتلاق‌های توربی، جنگل توسکای غرقاب و مرداب کم‌ژرفای پالیاستومی که با قایق از پوتی کاوش می‌شود: قلب
    سبز و خیسِ کلخیس باستان.
  body: >-
    **در جنوب پوتی، خشکی از یاد می‌برد که خشکی است: تورب، نیزار و آبی تیره و کندرو تا دریای سیاه پیش می‌روند
    — همان چهره‌ای که این ساحل پیش از رسیدن آبراهه‌های زهکشی داشت.**


    پارک ملی کلخِتی ۲۸۹۴۰ هکتار از این جهان را در سامگرلو و گوریا پاس می‌دارد. این پارک از ذخیره‌گاهی
    طبیعی به وسعت ۵۰۰ هکتار برآمد که در ۱۹۴۷ پدید آمد؛ تا آن زمان زهکشی شوروی، که در دههٔ ۱۹۲۰ با بیشترین
    شدت پیش رفته بود، بخش بزرگی از مرداب کلخیس را خشکانده بود. تالاب‌ها در ۱۹۹۶ جایگاه رامسر گرفتند، پارک
    در ۱۹۹۸–۱۹۹۹ تأسیس شد، و در ۲۰۲۱ بخشی از میراث جهانی یونسکو با نام «جنگل‌های بارانی و تالاب‌های کلخیس»
    شد.


    راز کار در باتلاق‌هاست. در چهار تا شش هزار سال گذشته، رس و لای و تورب لایه‌لایه اینجا ته‌نشین شده‌اند
    و ژرفای این لایه‌ها در جاهایی از دوازده متر فراتر می‌رود. بر رویشان خزهٔ اسفاگنوم و گیاه حشره‌خوارِ
    دروسرای گردبرگ می‌روید، گیاهی کوچک که حشره‌هایی را که به دام می‌اندازد هضم می‌کند.


    بیشتر بازدیدکنندگان پارک را از روی قایق می‌شناسند. گشت‌ها از مرکز بازدیدکنندگان در پوتی به دریاچهٔ
    پالیاستومی می‌روند — ۱۷٫۳ کیلومتر مربع آب، با ژرفای میانگین ۲٫۶ متر و بیشینهٔ ۶ متر — و به رود پیچوری،
    جایی که درختان توسکا و لرگ در میان جریان آب ایستاده‌اند و نیلوفرهای آبی سفید در آب‌های آرام کناری
    شناورند. نام یونانی دریاچه به معنای «دهانهٔ کهن» است. باستان‌شناسان در دریاچه و پیرامونش اشیایی از
    روزگار کلخیس یافته‌اند و برخی در همین آب‌ها به جست‌وجوی فاسیس باستان برآمده‌اند.


    ۱۹۴ گونه پرنده اینجا ثبت شده است، از جمله لک‌لک سیاه، درنا، اگرت بزرگ، حواصیل زرد و کفچه‌نوک؛ بهار
    و پاییز فصل دوربین دوچشمی است.


    صبح زود بیایید، وقتی آب هنوز آرام است و تنها موتوری که می‌شنوید موتور قایق خودتان است. کلخیسِ پشم
    زرین اینجا هرگز زرین نبود. سبز بود و خیس و زنده — و در این گوشه هنوز هم هست.
  tip: >-
    سه ساعت وقت بگذارید: نگاهی کوتاه به مرکز بازدیدکنندگان، سپس گشت با قایق که در واقع تنها راه ورود به
    پارک است. در مرکز بازدیدکنندگان در خیابان گوریای پوتی رزرو کنید؛ گشت‌های قایقی در تمام سال در مسیرهایی
    از حدود ۳ تا بیش از ۱۰ کیلومتر برگزار می‌شوند. از مه تا سپتامبر دافع حشرات، کلاه و کرم ضدآفتاب بیاورید،
    چون روی دریاچه سایه‌ای نیست. دوربین دوچشمی از لنز بلند مهم‌تر است. تابستان گرم و شرجی است؛ بهار و
    پاییز دلپذیرترند و برای پرنده‌نگری بهتر. سرویس بهداشتی در مرکز بازدیدکنندگان است، نه روی آب.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب، از کنار کوتائیسی تا سامتردیا بروید، سپس جادهٔ S12 را از لانچخوتی
    تا ساحل در گریگولتی بگیرید و در جادهٔ S2 به شمال، به سوی پوتی بپیچید. مرکز بازدیدکنندگان در خیابان
    گوریا در جنوب پوتی، نزدیک کرانهٔ شمالی پالیاستومی است: روی هم حدود ۳۲۶ کیلومتر و ۴ ساعت و ۳۵ دقیقه.
    همهٔ راه آسفالت است و بخش بزرگی از آن بزرگراه سریع، پس در هر فصلی یک خودروی اقتصادی بس است. سوخت در
    سامتردیا، لانچخوتی و پوتی به‌آسانی پیدا می‌شود. پارکینگ کنار مرکز بازدیدکنندگان است.
he:
  name: הפארק הלאומי קולחתי ואגם פליאסטומי
  short: >-
    ביצות כבול, יער אלמון מוצף והלגונה הרדודה של פליאסטומי, שאותם חוקרים בסירה מפוטי: הלב הירוק והרטוב
    של קולכיס העתיקה.
  body: >-
    **מדרום לפוטי שוכחת היבשה להיות יבשה: כבול, קנה ומים כהים ואיטיים נמשכים אל הים השחור — כך נראה החוף
    הזה לפני שהגיעו תעלות הניקוז.**


    הפארק הלאומי קולחתי מגן על 28,940 הקטרים מן העולם הזה, בסמגרלו ובגוריה. הוא צמח משמורת טבע בשטח 500
    הקטרים שהוכרזה ב-1947, ועד אז כבר ייבש הניקוז הסובייטי, שהגיע לשיאו בשנות ה-20, חלק גדול מביצות קולכיס.
    אזורי הביצות קיבלו מעמד של אתר רמסר ב-1996, הפארק הוקם ב-1998–1999, וב-2021 נכלל באתר המורשת העולמית
    של אונסק״ו "יערות הגשם והביצות של קולכיס".


    הסיבה היא הביצות. במהלך ארבעת עד ששת אלפי השנים האחרונות שקעו כאן חרסית, סחף וכבול בשכבות שעומקן במקומות
    מסוימים עולה על שנים-עשר מטר. על פניהן צומחים אזוב כבול (ספגנום) וטללית עגולת-עלים, צמח קטן המעכל
    את החרקים שהוא לוכד.


    רוב המבקרים פוגשים את הפארק מסירה. השיטים יוצאים ממרכז המבקרים בפוטי אל אגם פליאסטומי — 17.3 קמ״ר
    של מים, בעומק ממוצע של 2.6 מטר ומרבי של 6 — ואל נהר פיצ'ורי, שבו עומדים עצי אלמון ופטרוקריה קווקזית
    בתוך הזרם, ונימפאות לבנות צפות במפרצונים השקטים. שמו היווני של האגם פירושו "השפך הישן". ארכאולוגים
    מצאו באגם ובסביבתו חפצים מן התקופה הקולכית, והיו שחיפשו במים האלה את פאסיס העתיקה.


    נרשמו כאן 194 מיני ציפורים, ביניהם חסידה שחורה, עגור, אנפה לבנה גדולה, אנפית סוף וכפן; האביב והסתיו
    הם העונות למשקפת.


    בואו מוקדם, כשהמים עוד שקטים והמנוע היחיד הוא זה של הסירה שלכם. קולכיס של גיזת הזהב מעולם לא הייתה
    כאן זהובה. היא הייתה ירוקה, רטובה וחיה — ובפינה הזאת היא עדיין כזאת.
  tip: >-
    הקצו שלוש שעות: סיור קצר במרכז המבקרים ואחריו שיט בסירה, שהוא למעשה הדרך היחידה להיכנס לפארק. הזמינו
    במרכז המבקרים ברחוב גוריה בפוטי; שיטי הסירות פועלים כל השנה, במסלולים שאורכם בין כ-3 ק״מ ליותר מ-10
    ק״מ. ממאי עד ספטמבר הביאו דוחה יתושים, כובע וקרם הגנה, כי על האגם אין צל. משקפת חשובה יותר מעדשת טלה.
    הקיץ חם ולח; האביב והסתיו נעימים יותר וטובים יותר לציפורים. שירותים יש במרכז המבקרים, לא על המים.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני קוטאיסי עד סמטרדיה, ומשם בכביש S12 דרך לנצ'חותי אל החוף בגריגולטי,
    ופנו צפונה בכביש S2 לכיוון פוטי. מרכז המבקרים נמצא ברחוב גוריה שבדרום פוטי, סמוך לחוף הצפוני של פליאסטומי:
    בסך הכול כ-326 ק״מ ו-4 שעות ו-35 דקות. הדרך כולה סלולה ורובה כביש מהיר, כך שרכב מקטגוריית אקונומי
    מספיק בכל עונה. תחנות דלק קל למצוא בסמטרדיה, בלנצ'חותי ובפוטי. החניה ליד מרכז המבקרים.
ar:
  name: حديقة كولخيتي الوطنية وبحيرة بالياستومي
  short: >-
    مستنقعات خُثّية، وغابة جار ماء مغمورة، وبحيرة بالياستومي الضحلة التي تُستكشف بالقارب من بوتي: القلب
    الأخضر الرطب لكولخيس القديمة.
  body: >-
    **جنوب بوتي تنسى الأرض أنها أرض: خُثٌّ وقصب وماء داكن بطيء يمتد نحو البحر الأسود — هكذا كان هذا الساحل
    قبل أن تصله قنوات التجفيف.**


    تحمي حديقة كولخيتي الوطنية 28940 هكتارًا من هذا العالم في ساميغريلو وغوريا. وقد نشأت من محمية طبيعية
    مساحتها 500 هكتار أُنشئت عام 1947، وكان التجفيف السوفييتي، الذي بلغ أشدّه في عشرينيات القرن العشرين،
    قد جفّف حينها قسمًا كبيرًا من مستنقعات كولخيس. ونالت الأراضي الرطبة صفة موقع رامسار عام 1996، وتلتها
    الحديقة في 1998–1999، وفي عام 2021 صارت جزءًا من موقع التراث العالمي لليونسكو «الغابات المطيرة والأراضي
    الرطبة الكولخية».


    المستنقعات هي السبب. فعلى مدى أربعة إلى ستة آلاف عام ترسّب هنا الطين والغرين والخُثّ طبقاتٍ يزيد عمقها
    في بعض المواضع على اثني عشر مترًا. وعلى سطحها ينمو طحلب السفاغنوم ونبات الندية مستديرة الأوراق، وهو
    نبات صغير يهضم الحشرات التي يصطادها.


    يلتقي معظم الزوار بالحديقة من على متن قارب. تنطلق الجولات من مركز الزوار في بوتي إلى بحيرة بالياستومي
    — 17.3 كيلومتر مربع من الماء، بعمق متوسطه 2.6 متر وأقصاه 6 أمتار — وإلى نهر بيتشوري، حيث تقف أشجار
    جار الماء والجوز المجنّح القوقازي وسط التيار، وتطفو زنابق الماء البيضاء في الخلجان الساكنة. ويعني
    اسم البحيرة اليوناني «المصبّ القديم». وقد عثر علماء الآثار في البحيرة وحولها على لُقى من العصر الكولخي،
    وبحث بعضهم في هذه المياه عن فاسيس القديمة.


    سُجّل هنا 194 نوعًا من الطيور، منها اللقلق الأسود والكركي والبلشون الأبيض الكبير والبلشون الأصفر وأبو
    ملعقة؛ والربيع والخريف موسما المنظار.


    تعالَ باكرًا، حين يكون الماء ساكنًا ولا محرّك سوى محرّك قاربك. لم تكن كولخيس الجزة الذهبية ذهبية هنا
    قط. كانت خضراء رطبة نابضة بالحياة، وما زالت كذلك في هذه الزاوية.
  tip: >-
    خصّص ثلاث ساعات: جولة قصيرة في مركز الزوار، ثم رحلة بالقارب، وهي في الحقيقة السبيل الوحيد إلى داخل
    الحديقة. احجز في مركز الزوار في شارع غوريا في بوتي؛ تعمل جولات القوارب طوال العام على مسارات تتراوح
    بين نحو 3 كم وأكثر من 10 كم. من أيار إلى أيلول احمل طاردًا للحشرات وقبعة وواقيًا من الشمس، فلا ظل
    على البحيرة. المنظار أهم من العدسة الطويلة. الصيف حار ورطب؛ والربيع والخريف ألطف وأفضل لمشاهدة الطيور.
    دورات المياه في مركز الزوار، لا على الماء.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا مرورًا بكوتايسي حتى سامتريديا، ثم خذ الطريق S12 عبر لانتشخوتي إلى
    الساحل عند غريغوليتي، وانعطف شمالًا على الطريق S2 نحو بوتي. يقع مركز الزوار في شارع غوريا جنوب بوتي،
    قرب الشاطئ الشمالي لبالياستومي: نحو 326 كم و4 ساعات و35 دقيقة إجمالًا. الطريق معبّد بالكامل ومعظمه
    طريق سريع، فسيارة اقتصادية تكفي في أي فصل. محطات الوقود متوفرة في سامتريديا ولانتشخوتي وبوتي. موقف
    السيارات عند مركز الزوار.
