ka:
  name: კვირიკეს ჯამე
  short: >-
    1861 წლის ხის სოფლური მეჩეთი ქობულეთის ზემოთ, მთისწინეთში: კედლები, მიჰრაბი და მინბარი ლაზი ოსტატის
    ორიგინალი ჩუქურთმითაა დაფარული.
  body: >-
    **1861 წელს არქაბელმა ლაზმა ოსტატმა ქობულეთის ზემოთ, მთისწინეთის სოფელში ხის მეჩეთი ააგო და მისი კედლები
    შიგნიდანაც და გარედანაც ჩუქურთმით დაფარა.**


    კვირიკეს ჯამე აჭარის უძველეს შემორჩენილ მეჩეთებს შორისაა და ეროვნული მნიშვნელობის უძრავი კულტურული
    ძეგლის სტატუსი აქვს. მხარე მაშინ ოსმალეთის იმპერიის შემადგენლობაში იყო, შენობა კი სტამბოლს იმდენივე
    ეკუთვნის, რამდენიც ქართულ სოფელს: ოსმალური ფორმები აქ გარშემო სოფლების ხალხურ ხის ხუროთმოძღვრებას
    ერწყმის.


    სრული გუმბათი მეჩეთს არ აქვს. მის ნაცვლად ღრმულში ჩასმული ჩუქურთმიანი მედალიონია, მის გარშემო კი ჩუქურთმა
    ყველგანაა: გარე და შიდა კედლებზე, მიჰრაბსა და მინბარზე, სვეტებსა და აივანზე. წყაროების მიხედვით, ეს
    ყველაფერი XIX საუკუნის 60-იანი წლების ორიგინალი ამოკვეთილი ნამუშევარია.


    1920-იან წლებში საბჭოთა ხელისუფლებამ მეჩეთს ის წაართვა, რაც გვერდით ედგა: დაანგრია მინარეთიც და მედრესეც,
    მისი სასულიერო სკოლა. სალოცავი დარბაზი გადარჩა, 2013 წელს განაახლეს და დღესაც ივსება პარასკევისა და
    დღესასწაულების ლოცვებზე.


    წყაროებს ოსტატის სახელი არ შემოუნახავს — მხოლოდ ის, რომ არქაბიდან (დღევანდელი არჰავი, თურქეთი) იყო.
    მისი ხელი კი კედლებმა შემოინახა.
  tip: >-
    კვირიკეს ჯამე მოქმედი სოფლის მეჩეთია: ძირითადად პარასკევისა და დღესასწაულების ლოცვებზე იღება, სხვა
    დროს კი შეიძლება დაკეტილი დაგხვდეთ. ღიას ყველაზე სავარაუდოდ პარასკევს ნახავთ: მიდით შუადღის ლოცვის
    დამთავრების შემდეგ და ჰკითხეთ მას, ვინც კარს კეტავს, შეიძლება თუ არა შიგნით შეხედვა. შესვლა უფასოა,
    ნახევარი საათიც საკმარისია. მოკრძალებულად ჩაიცვით; ქალებმა თავი დაიფარონ, შიგნით კი ფეხსაცმელს იხდიან.
    ვინმეს გადაღებამდე ნებართვა ითხოვეთ. მეჩეთთან არც კაფეა და არც საპირფარეშო; ზღვისპირა ქობულეთში ყველაფერია.
    გზა ახლომდებარე პეტრას ციხესთან ან მთირალას ეროვნულ პარკთან ერთად დაგეგმეთ.
  route: >-
    დაახლოებით 355 კილომეტრი და ხუთი საათი და ოცდათხუთმეტი წუთი. ს1 (E60) მაგისტრალით ქუთაისის გავლით
    სამტრედიამდე იარეთ, ს12-ით ლანჩხუთის გავლით გრიგოლეთამდე, შემდეგ კი ზღვისპირა ს2-ით (E70) სამხრეთით
    ქობულეთამდე. იქ მაგისტრალიდან გადაუხვიეთ და ადგილობრივი გზებით მთისწინეთში, სოფელ კვირიკემდე ადით.
    გზები მეტწილად მოასფალტებულია, მაგრამ ვიწრო და კლაკნილი; მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის.
    მანიშნებლები ცოტაა, ამიტომ კოორდინატებით იარეთ. საწვავი და საჭმელი ქობულეთშია — სოფელში მსგავსი არაფერია.
en:
  name: Kvirike Mosque
  short: >-
    A timber village mosque of 1861 in the hills behind Kobuleti, its walls, mihrab and minbar covered
    in original incised carving by a Laz master.
  body: >-
    **In 1861 a Laz craftsman from Arhavi, now across the Turkish border, built a timber mosque in the
    hills behind Kobuleti and covered its walls, inside and out, with carving.**


    Kvirike Mosque is among the oldest surviving mosques in Adjara and a listed Immovable Cultural Monument
    of National Significance. The region then belonged to the Ottoman Empire, yet the building owes as
    much to the Georgian village as to Istanbul: Ottoman forms blend here with the vernacular timber architecture
    of the surrounding hills.


    There is no full dome. In its place a recess holds an inset carved medallion, and around it the woodwork
    runs everywhere: across the outer and inner walls, over the mihrab and the minbar, up the columns
    and along the balcony. The sources describe all of it as original incised work of the 1860s.


    The Soviet 1920s took away what stood beside it: its minaret and its madrasa, the Islamic school,
    were both demolished. The prayer hall survived, was renovated in 2013 and still fills for Friday and
    holiday prayers.


    The sources remember the builder only as a craftsman from Arhavi. The walls remember his hand.
  tip: >-
    Kvirike is a working village mosque that opens mainly for Friday and holiday prayers and may be locked
    at other times. The surest time to find it open is Friday: arrive after the midday prayer has ended
    and ask whoever is locking up whether you may look inside. Entry is free and half an hour is enough.
    Dress modestly; women should cover their hair, and shoes come off inside. Ask before photographing
    anyone. There are no cafés or toilets at the mosque; Kobuleti, down on the coast, has everything.
    Combine the drive with Petra Fortress or Mtirala National Park, both close by.
  route: >-
    About 355 km and five hours thirty-five minutes. Take the S1 (E60) past Kutaisi to Samtredia, the
    S12 through Lanchkhuti to Grigoleti and the coastal S2 (E70) south to Kobuleti. There, leave the highway
    and head inland on local roads up into the hills to Kvirike village. They are mostly paved but narrow
    and winding, and an economy car manages in dry weather. Signs are sparse, so navigate by coordinates.
    Fuel and food in Kobuleti; there is nothing of the kind in the village.
ru:
  name: Мечеть Квирике
  short: >-
    Деревянная сельская мечеть 1861 года в холмах за Кобулети: её стены, михраб и минбар покрыты подлинной
    резьбой лазского мастера.
  body: >-
    **В 1861 году лазский мастер из Архави — городка, который сегодня лежит по ту сторону турецкой границы,
    — построил в холмах за Кобулети деревянную мечеть и покрыл её стены резьбой, снаружи и изнутри.**


    Мечеть в Квирике — одна из старейших уцелевших мечетей Аджарии; она внесена в список недвижимых памятников
    культуры национального значения. Край тогда принадлежал Османской империи, но здание обязано грузинской
    деревне не меньше, чем Стамбулу: османские формы сливаются здесь с народным деревянным зодчеством
    окрестных холмов.


    Настоящего купола нет. Вместо него в углублении помещён резной медальон, а вокруг резьба повсюду:
    на наружных и внутренних стенах, на михрабе и минбаре, по колоннам и вдоль балкона. По данным источников,
    всё это — подлинная врезная резьба 1860-х годов.


    Советские 1920-е отняли у мечети то, что стояло рядом: снесли и минарет, и медресе — исламскую школу.
    Молельный зал уцелел, в 2013 году его обновили, и по пятницам и в праздники он по-прежнему наполняется
    молящимися.


    Источники запомнили строителя лишь как мастера из Архави. Стены запомнили его руку.
  tip: >-
    Квирике — действующая сельская мечеть: открывают её в основном к пятничной и праздничной молитве,
    в другое время она может быть заперта. Вернее всего застать её открытой в пятницу: приезжайте, когда
    полуденная молитва уже закончилась, и спросите того, кто запирает двери, можно ли заглянуть внутрь.
    Вход свободный, получаса хватит. Одевайтесь скромно; женщинам нужно покрыть волосы, обувь внутри снимают.
    Прежде чем кого-то фотографировать, спрашивайте разрешения. Ни кафе, ни туалета у мечети нет; всё
    это есть внизу, в приморском Кобулети. Поездку удобно совместить с крепостью Петра или национальным
    парком Мтирала — оба совсем рядом.
  route: >-
    Около 355 км и пять часов тридцать пять минут. По трассе S1 (E60) мимо Кутаиси до Самтредиа, затем
    по S12 через Ланчхути до Григолети и по прибрежной S2 (E70) на юг до Кобулети. Там сверните с трассы
    и поднимайтесь местными дорогами вглубь, в холмы, к селу Квирике. Дороги в основном асфальтированы,
    но узкие и извилистые; в сухую погоду справится и машина эконом-класса. Указателей мало, поэтому ориентируйтесь
    по координатам. Заправка и еда — в Кобулети; в селе ничего подобного нет.
fa:
  name: مسجد کویریکه
  short: >-
    مسجدی چوبی و روستایی از سال ۱۸۶۱ در تپه‌های پشت کوبولتی، که دیوارها، محراب و منبرش با کنده‌کاری اصیلِ
    استادکاری لاز پوشیده شده است.
  body: >-
    **در سال ۱۸۶۱ استادکاری لاز از آرهاوی، شهری که امروز آن سوی مرز ترکیه است، در تپه‌های پشت کوبولتی
    مسجدی چوبی ساخت و دیوارهایش را، از درون و بیرون، با کنده‌کاری پوشاند.**


    مسجد کویریکه از کهن‌ترین مسجدهای برجامانده در آجاراست و در فهرست آثار فرهنگی غیرمنقولِ دارای اهمیت
    ملی ثبت شده است. این سرزمین در آن روزگار بخشی از امپراتوری عثمانی بود، با این همه بنا همان‌قدر وام‌دار
    روستای گرجی است که وام‌دار استانبول: فرم‌های عثمانی در اینجا با معماری چوبی بومی تپه‌های پیرامون درآمیخته‌اند.


    گنبد کاملی در کار نیست. به جای آن، در یک فرورفتگی مدالیونی کنده‌کاری‌شده نشانده‌اند و گرداگرد آن کار
    چوب همه‌جا را فرا گرفته است: دیوارهای بیرونی و درونی، محراب و منبر، ستون‌ها و بالکن. به گفتهٔ منابع،
    همهٔ این‌ها کنده‌کاری اصیل دههٔ ۱۸۶۰ است.


    دههٔ ۱۹۲۰ و حکومت شوروی آنچه را در کنار مسجد ایستاده بود از آن گرفت: مناره و مدرسه‌اش، یعنی مکتب دینی،
    هر دو ویران شدند. شبستان نماز بر جا ماند، در سال ۲۰۱۳ نوسازی شد و هنوز در نماز جمعه و نماز عیدها پر
    از نمازگزار می‌شود.


    منابع از سازنده تنها با عنوان استادکاری از آرهاوی یاد می‌کنند. اما دیوارها دست او را به یاد دارند.
  tip: >-
    کویریکه مسجدی روستایی و دایر است که بیشتر برای نماز جمعه و نماز عیدها باز می‌شود و ممکن است در دیگر
    اوقات بسته باشد. مطمئن‌ترین زمان برای یافتن درِ باز، روز جمعه است: پس از پایان نماز ظهر برسید و از
    کسی که در را می‌بندد بپرسید آیا می‌توانید نگاهی به درون بیندازید. ورود رایگان است و نیم ساعت کافی
    است. پوشیده لباس بپوشید؛ بانوان موی سر را بپوشانند و درون مسجد کفش‌ها را درمی‌آورند. پیش از عکس گرفتن
    از کسی اجازه بخواهید. کنار مسجد نه کافه‌ای هست و نه سرویس بهداشتی؛ در کوبولتی، پایین در ساحل، همه‌چیز
    پیدا می‌شود. این سفر را با دژ پترا یا پارک ملی متیرالا، که هر دو نزدیک‌اند، یکجا کنید.
  route: >-
    حدود ۳۵۵ کیلومتر و پنج ساعت و سی‌وپنج دقیقه. با S1 (E60) از کنار کوتائیسی تا سامتردیا بروید، سپس با
    S12 از راه لانچخوتی تا گریگولتی و با جادهٔ ساحلی S2 (E70) رو به جنوب تا کوبولتی. آنجا از بزرگراه خارج
    شوید و از جاده‌های محلی رو به خشکی، در دل تپه‌ها، تا روستای کویریکه بالا بروید. این جاده‌ها بیشتر
    آسفالت‌اند اما باریک و پرپیچ‌وخم؛ در هوای خشک خودروی اقتصادی از پسشان برمی‌آید. تابلوها کم‌اند، پس
    با مختصات جغرافیایی مسیریابی کنید. سوخت و غذا در کوبولتی؛ در روستا چیزی از این دست نیست.
he:
  name: מסגד קוויריקה
  short: מסגד כפרי מעץ משנת 1861 בגבעות שמאחורי קובולטי; קירותיו, המחראב והמינבר מכוסים בגילופים המקוריים
    של אומן לאזי.
  body: >-
    **בשנת 1861 בנה אומן לאזי מארהאבי, עיירה השוכנת היום מעבר לגבול הטורקי, מסגד מעץ בגבעות שמאחורי קובולטי,
    וכיסה את קירותיו, מבפנים ומבחוץ, בגילופים.**


    מסגד קוויריקה הוא מן המסגדים העתיקים ביותר ששרדו באג'ריה, והוא רשום כנכס מורשת תרבותית בלתי מיטלטל
    בעל חשיבות לאומית. האזור היה אז חלק מהאימפריה העות'מאנית, ובכל זאת הבניין חב לכפר הגאורגי לא פחות
    מאשר לאיסטנבול: צורות עות'מאניות מתמזגות כאן עם אדריכלות העץ העממית של הגבעות שמסביב.


    כיפה של ממש אין כאן. במקומה משובץ בתוך שקע מדליון מגולף, ומסביבו הגילופים נמשכים לכל עבר: על הקירות
    החיצוניים והפנימיים, על המחראב והמינבר, במעלה העמודים ולאורך המרפסת. לפי המקורות, כל זה עבודת חריטה
    מקורית משנות ה-60 של המאה ה-19.


    שנות ה-20 הסובייטיות לקחו מהמסגד את מה שעמד לצדו: המינרט והמדרסה, בית הספר הדתי המוסלמי, נהרסו שניהם.
    אולם התפילה שרד, שופץ ב-2013, ועדיין מתמלא מתפללים בימי שישי ובחגים.


    המקורות זוכרים את הבונה רק כאומן מארהאבי. הקירות זוכרים את ידו.
  tip: >-
    קוויריקה הוא מסגד כפרי פעיל, שנפתח בעיקר לתפילות יום שישי ולתפילות החגים, ובשעות אחרות הוא עלול להיות
    נעול. הסיכוי הטוב ביותר למצוא אותו פתוח הוא ביום שישי: הגיעו אחרי שתפילת הצהריים הסתיימה, ושאלו את
    מי שנועל את הדלת אם מותר להציץ פנימה. הכניסה חופשית, וחצי שעה מספיקה. התלבשו בצניעות; נשים צריכות
    לכסות את שערן, ובפנים חולצים נעליים. בקשו רשות לפני שאתם מצלמים מישהו. ליד המסגד אין בית קפה ולא שירותים;
    בקובולטי, למטה על החוף, יש הכול. שלבו את הנסיעה עם מבצר פטרה או עם הפארק הלאומי מטירלה, ששניהם קרובים.
  route: >-
    כ-355 ק״מ וחמש שעות ושלושים וחמש דקות. סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, בכביש S12 דרך
    לנצ'חוטי עד גריגולטי, ובכביש החוף S2 (E70) דרומה עד קובולטי. שם צאו מהכביש הראשי והמשיכו פנימה, בדרכים
    מקומיות, במעלה הגבעות אל הכפר קוויריקה. הדרכים סלולות ברובן אך צרות ומתפתלות, ורכב חסכוני מסתדר בהן
    במזג אוויר יבש. השילוט דל, ולכן נווטו לפי קואורדינטות. דלק ואוכל יש בקובולטי; בכפר אין דבר מכל אלה.
ar:
  name: مسجد كفيريكي
  short: >-
    مسجد قروي من الخشب يعود إلى عام 1861 في التلال خلف كوبوليتي، تكسو جدرانه ومحرابه ومنبره نقوش محفورة
    أصلية أبدعها معلّم لازي.
  body: >-
    **في عام 1861 شيّد حِرفيّ لازي من أرهافي، البلدة التي تقع اليوم وراء الحدود التركية، مسجداً من الخشب
    في التلال خلف كوبوليتي، وكسا جدرانه بالنقوش من الداخل والخارج.**


    مسجد كفيريكي من أقدم المساجد الباقية في أدجارا، وهو مسجّل معلماً ثقافياً ثابتاً ذا أهمية وطنية. كانت
    المنطقة يومها جزءاً من الدولة العثمانية، ومع ذلك يدين المبنى للقرية الجورجية بقدر ما يدين لإسطنبول:
    فالأشكال العثمانية تمتزج هنا بعمارة الخشب الشعبية في التلال المحيطة.


    لا قبة كاملة هنا. في مكانها تجويف تستقر فيه ميدالية منقوشة، ومن حولها يمتد العمل الخشبي في كل مكان:
    على الجدران الخارجية والداخلية، وعلى المحراب والمنبر، صعوداً على الأعمدة وعلى امتداد الشرفة. وتصف
    المصادر ذلك كله بأنه نقش محفور أصلي من ستينيات القرن التاسع عشر.


    وفي عشرينيات القرن العشرين انتزع الحكم السوفييتي من المسجد ما كان قائماً إلى جانبه: فقد هُدمت مئذنته
    ومدرسته الدينية كلتاهما. أما قاعة الصلاة فنجت، ورُمّمت عام 2013، ولا تزال تمتلئ بالمصلين في صلاة الجمعة
    وصلوات الأعياد.


    لا تذكر المصادر البنّاء إلا بوصفه حِرفياً من أرهافي. أما الجدران فتذكر يده.
  tip: >-
    كفيريكي مسجد قروي عامر يُفتح أساساً لصلاة الجمعة وصلوات الأعياد، وقد تجده مغلقاً في غير هذه الأوقات.
    وأضمن وقت لتجده مفتوحاً هو يوم الجمعة: احضر بعد انتهاء صلاة الجمعة، واسأل من يُغلق الباب إن كان بوسعك
    إلقاء نظرة في الداخل. الدخول مجاني، ونصف ساعة تكفي. البس ثياباً محتشمة؛ وعلى النساء تغطية الشعر، وتُخلع
    الأحذية في الداخل. واستأذن قبل تصوير أي شخص. لا مقاهي ولا دورات مياه عند المسجد؛ ففي كوبوليتي، في
    الأسفل على الساحل، تجد كل شيء. واجمع الرحلة مع حصن بيترا أو منتزه متيرالا الوطني، فكلاهما قريب.
  route: >-
    نحو 355 كم وخمس ساعات وخمس وثلاثون دقيقة. اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامترديا، ثم S12
    عبر لانتشخوتي حتى غريغوليتي، ثم الطريق الساحلي S2 (E70) جنوباً حتى كوبوليتي. هناك غادر الطريق السريع
    واتجه نحو الداخل عبر طرق محلية صعوداً في التلال حتى قرية كفيريكي. ومعظم هذه الطرق معبّد لكنها ضيقة
    ومتعرجة، وتكفي سيارة اقتصادية في الطقس الجاف. اللافتات قليلة، فاعتمد على الإحداثيات. الوقود والطعام
    في كوبوليتي؛ ولا شيء من ذلك في القرية.
