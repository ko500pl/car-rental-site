ka:
  name: ნავენახევის მღვიმე
  short: >-
    250-მეტრიანი კარსტული მღვიმე თერჯოლასთან — ოთხი დარბაზი ორ სართულზე და შვიდმეტრიანი ქვის სვეტი, რომელიც
    გზას ბოლოში კეტავს.
  body: >-
    **ნავენახევი საუკეთესოს ბოლოსთვის ინახავს: შვიდი მეტრის სისქის ქვის სვეტს, რომელიც მღვიმეს არასდროს
    გაღებული კარივით კეტავს.**


    მღვიმე თერჯოლის მუნიციპალიტეტში, ზღვის დონიდან 235 მეტრზე, იმ სოფლის ქვეშ მდებარეობს, რომლის სახელიც,
    როგორც ჩანს, ძველ ვენახზე მიგვანიშნებს. შესასვლელი ძაბრისებრი ქვაბულის ფსკერზე იხსნება. შიგნით ჭერი
    ჯერ ხუთიოდე მეტრზე ადის, ოცდაათი მეტრის შემდეგ მთავარი დერეფანი ორად იყოფა, მოკლე საფეხურები კი მეორე
    სართულზე, ვრცელ დარბაზში აგიყვანთ, რომლის ჭერიც თხუთმეტ მეტრზე მაღლა იკარგება. სულ დაახლოებით 250
    მეტრი სავალი, ოთხი დარბაზი ორ სართულზე — ყველაფერი ცარცულ კირქვაში გამოტვიფრული.


    რას დააკვირდეთ:


    - **სტალაქტიტებსა და სტალაგმიტებს**, რომელთა ზოგიერთი ხუთ მეტრს აღწევს — წვეთ-წვეთად, წარმოუდგენლად
    დიდი დროის განმავლობაში ნაზარდს

    - **თიხის ორ-სამმეტრიან ფენებს**, რომლებიც ოდესღაც მღვიმის წინა ნაწილში შემოჭრილმა ღვარებმა დატოვა

    - **სტალაგნატს ბოლოში** — იატაკიდან ჭერამდე აღმართულ სვეტს, რომელსაც სავალი მთლიანად ამოუქოლავს


    ჰაერის ტემპერატურა მთელი წლის განმავლობაში დაახლოებით 13,5 გრადუსია. მღვიმე უმეტესწილად მშრალია და
    სადღაც ნახევარბნელში ერთადერთი წვეთი დროს ითვლის.


    მეცნიერებამ მას XX საუკუნის 30-იან წლებში მიაპყრო ყურადღება, როცა გეოგრაფმა ლევან მარუაშვილმა შეისწავლა.
    სტუმრებისთვის გახსნის ბიძგი კი თავად ადგილობრივებმა მისცეს: 1981 წელს ადგილობრივმა დებმა, ხუჯაძეებმა,
    მღვიმეზე დაწერეს და ამით ხანგრძლივ საქმეს დაუდეს სათავე, რომელიც 2018 წელს ოფიციალური გახსნით დასრულდა.
    დღეს ნავენახევი დაცული ბუნების ძეგლია — ბეტონის ბილიკებით, სამზერი მოედნებითა და რკინის კარით.


    შესასვლელი ერთადერთია და ის გასასვლელიც არის. უკან იმავე ქვებს ჩაუვლით — და მეორედ მათ სულ სხვაგვარად
    დაინახავთ.
  tip: >-
    მღვიმეში მხოლოდ გიდთან ერთად, მცირე ჯგუფებით შედიან. სამუშაო საათები სეზონის მიხედვით იცვლება — დაახლოებით
    10:00–18:00 გაზაფხულზე, 10:00–19:00 ზაფხულში და 10:00–17:00 შემოდგომა-ზამთარში; ბილეთის მიმდინარე
    ფასი წასვლამდე nationalparks.ge-ზე გადაამოწმეთ. შიგნით დაახლოებით 13,5 გრადუსია, ამიტომ ივლისშიც თბილი
    ზედა ჩაიცვით. ბეტონის ბილიკი შეიძლება ნოტიო იყოს — ფეხსაცმელი მოუცურებელი ძირით აირჩიეთ; საფეხურების
    გამო ეტლით ან საბავშვო ურიკით შესვლა შეუძლებელია. ვიზიტორთა ცენტრში კაფე და სუვენირების მაღაზიაა.
    მღვიმე ცუცხვათს, გელათის მონასტერს ან ტყიბულის წყალსაცავს შეუთავსეთ — ყველა პირდაპირი ხაზით დაახლოებით
    ათ კილომეტრშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ რიკოთის გვირაბისა და ზესტაფონის გავლით იარეთ და მაგისტრალიდან
    თერჯოლის კვანძთან, დაახლოებით 200-ე კილომეტრზე, გადაუხვიეთ. იქიდან რამდენიმე კილომეტრი სასოფლო გზით
    ჩრდილოეთისკენ სოფელ ნავენახევამდე; დაცული ტერიტორიების სააგენტოს მაჩვენებლებს მიჰყევით. სულ დაახლოებით
    210 კილომეტრია, სამ საათზე ცოტა მეტი. გზა მთლიანად ასფალტიანია, ბოლო მონაკვეთი ვიწრო, მაგრამ მოწესრიგებულია.
    საწვავი ზესტაფონში ან თერჯოლაში ჩაასხით. ვიზიტორთა ცენტრთან ავტოსადგომია და ნებისმიერ სეზონში ეკონომკლასის
    ავტომობილიც საკმარისია.
en:
  name: Navenakhevi Cave
  short: >-
    A 250-metre karst cave near Terjola, four halls over two floors, ending in a seven-metre-thick column
    of stone that seals the way on.
  body: >-
    **Navenakhevi saves its best moment for the end: a column of stone seven metres thick, closing the
    cave like a door that has never been opened.**


    The cave lies at 235 metres in Terjola municipality, under a village whose name seems to recall a
    vineyard that once grew here. You enter at the bottom of a funnel-shaped hollow. Inside, the ceiling
    first rises to about five metres; thirty metres in, the main passage splits in two, and short flights
    of steps lead up to a second level and a hall whose roof soars above fifteen metres. Some 250 metres
    of passages, four halls on two floors, all dissolved out of Cretaceous limestone.


    What to look for:


    - **Stalactites and stalagmites** up to five metres long, grown drop by drop over an unimaginable
    span of time

    - **Banks of clay two to three metres deep**, laid down by floods that once poured through the front
    of the cave

    - **The stalagnate at the end** — a floor-to-ceiling column that has sealed the passage completely


    The air holds at about 13.5 °C all year. The cave is mostly dry, and somewhere in the half-dark a
    single drip keeps time.


    Science first took notice in the 1930s, when the geographer Levan Maruashvili studied it. The push
    to open it to visitors came from closer to home: in 1981 two local sisters, the Khujadzes, wrote about
    the cave, and their writing set in motion the long work that ended with its official opening in 2018.
    Today it is a protected natural monument, fitted with concrete paths, viewing platforms and an iron
    door.


    There is only one way in, and it is also the only way out. You retrace your steps past the same stones
    — and see them differently the second time.
  tip: >-
    Visits are guided and run in small groups. Opening hours shift with the season — roughly 10:00–18:00
    in spring, 10:00–19:00 in summer and 10:00–17:00 in autumn and winter — and it is worth checking the
    current ticket price on nationalparks.ge before you go. It is about 13.5 °C inside, so bring a fleece
    even in July. The concrete paths can be damp, so wear shoes with grip; the steps rule out wheelchairs
    and pushchairs. The visitor centre has a café and a souvenir shop. Combine the cave with Tsutskhvati,
    Gelati Monastery or the Tkibuli reservoir, all within about ten kilometres as the crow flies.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnel and past Zestafoni, and leave the motorway
    at the Terjola junction, about 200 km out. From there it is a few kilometres of country road north
    to the village of Navenakhevi; follow the signs of the Agency of Protected Areas. About 210 km in
    all, just over three hours. The road is asphalt throughout; the last stretch is narrow but well kept.
    Refuel in Zestafoni or Terjola. There is parking at the visitor centre, and an economy car is all
    you need, in any season.
ru:
  name: Пещера Навенахеви
  short: >-
    Карстовая пещера длиной 250 метров близ Терджолы, четыре зала на двух уровнях, заканчивающаяся семиметровой
    каменной колонной, запечатавшей проход дальше.
  body: >-
    **Навенахеви оставляет самое яркое впечатление на конец: колонну из камня толщиной семь метров, закрывающую
    пещеру, как дверь, которую никогда не открывали.**


    Пещера лежит на высоте 235 метров в Терджольском муниципалитете, под селом, чьё название, судя по
    всему, напоминает о былом винограднике. Вход открывается на дне воронкообразной впадины. Внутри потолок
    сперва поднимается до примерно пяти метров; через тридцать метров главный ход разделяется на два,
    а короткие лестницы ведут на второй уровень, в зал, чей свод возносится выше пятнадцати метров. Около
    250 метров ходов, четыре зала на двух уровнях — всё это растворено в меловых известняках.


    На что обратить внимание:


    - **Сталактиты и сталагмиты** длиной до пяти метров, выросшие капля за каплей за немыслимо долгий
    срок

    - **Пласты глины толщиной два-три метра**, отложенные потоками, что когда-то заливали переднюю часть
    пещеры

    - **Сталагнат в конце** — колонна от пола до потолка, полностью запечатавшая ход


    Воздух держится около 13,5 °C весь год. Пещера в основном сухая, и где-то в полумраке одна-единственная
    капля отмеряет время.


    Наука впервые обратила на неё внимание в 1930-х, когда её изучил географ Леван Маруашвили. Толчок
    к открытию для посетителей дали сами местные жители: в 1981 году две местные сестры, Худжадзе, написали
    о пещере, и их текст запустил долгую работу, которая завершилась официальным открытием в 2018 году.
    Сегодня это охраняемый природный памятник, оборудованный бетонными дорожками, смотровыми площадками
    и железной дверью.


    Сюда есть лишь один вход, и он же единственный выход. Вы возвращаетесь тем же путём мимо тех же камней
    — и во второй раз видите их иначе.
  tip: >-
    Посещение проходит с гидом, небольшими группами. Часы работы меняются по сезону — примерно 10:00–18:00
    весной, 10:00–19:00 летом и 10:00–17:00 осенью и зимой — стоит заранее проверить актуальную цену билета
    на nationalparks.ge. Внутри около 13,5 °C, так что берите флис даже в июле. Бетонные дорожки могут
    быть влажными, наденьте обувь с хорошим сцеплением; ступени делают пещеру недоступной для инвалидных
    колясок и колясок с детьми. При визит-центре есть кафе и лавка сувениров. Совместите пещеру с Цуцхвати,
    монастырём Гелати или Ткибульским водохранилищем — все они лежат в пределах примерно десяти километров
    по прямой.
  route: >-
    Из Тбилиси возьмите трассу S1 (E60) на запад через Рикотский тоннель, минуя Зестафони, и сверните
    с трассы на повороте на Терджолу, примерно через 200 км. Оттуда несколько километров сельской дороги
    ведут на север к селу Навенахеви; следуйте указателям Агентства охраняемых территорий. Всего около
    210 км, чуть больше трёх часов. Дорога асфальтирована на всём протяжении; последний отрезок узкий,
    но в хорошем состоянии. Заправляйтесь в Зестафони или Терджоле. У визит-центра есть парковка, и в
    любой сезон достаточно автомобиля эконом-класса.
fa:
  name: غار ناوِناخِوی
  short: >-
    غاری کارستی به طول ۲۵۰ متر نزدیک ترجولا، چهار سالن در دو طبقه، که به ستونی سنگی به ضخامت هفت متر می‌رسد
    و راه پیشِ رو را می‌بندد.
  body: >-
    **ناوِناخِوی بهترین لحظه‌ی خود را برای پایان نگه می‌دارد: ستونی سنگی به ضخامت هفت متر، که غار را چون
    دری می‌بندد که هرگز گشوده نشده است.**


    این غار در ارتفاع ۲۳۵ متری در شهرستان ترجولا قرار دارد، زیر روستایی که نامش گویا به تاکستانی کهن اشاره
    دارد. ورودی در کف گودالی قیف‌مانند آغاز می‌شود. در درون، سقف نخست تا نزدیک پنج متر بالا می‌رود؛ سی
    متر جلوتر، گذرگاه اصلی به دو راه تقسیم می‌شود، و پله‌های کوتاهی به طبقه‌ی دوم و سالنی می‌رسند که سقفش
    بیش از پانزده متر اوج می‌گیرد. نزدیک به ۲۵۰ متر گذرگاه، چهار سالن در دو طبقه، همه در سنگ آهک دوران
    کرتاسه حل شده‌اند.


    آنچه باید دید:


    - **استالاکتیت‌ها و استالاگمیت‌هایی** تا پنج متر، که قطره‌به‌قطره در بازه‌ای غیرقابل‌تصور از زمان
    رشد کرده‌اند

    - **لایه‌های رسی به ضخامت دو تا سه متر**، نشسته از سیلاب‌هایی که زمانی از دهانه‌ی غار سرازیر می‌شدند

    - **استالاگنات در انتها** — ستونی از کف تا سقف که گذرگاه را به‌تمامی بسته است


    هوا در سراسر سال نزدیک به ۱۳٫۵ درجه‌ی سلسیوس می‌ماند. غار بیشتر خشک است، و جایی در نیمه‌تاریکی، قطره‌ای
    تنها زمان را می‌شمارد.


    علم نخستین‌بار در دهه‌ی ۱۹۳۰ به آن توجه کرد، هنگامی که جغرافی‌دان لوان مارواشویلی آن را بررسی کرد.
    اما جرقه‌ی گشودن آن به روی بازدیدکنندگان از خود مردم محل آمد: در سال ۱۹۸۱، دو خواهر محلی به نام خوجادزه
    درباره‌ی غار نوشتند، و نوشته‌شان کاری دراز را به راه انداخت که با گشایش رسمی آن در سال ۲۰۱۸ به پایان
    رسید. امروز این غار یادمانی طبیعی حفاظت‌شده است، آراسته به راه‌های سیمانی، سکوهای تماشا و دری از آهن.


    تنها یک راه ورود هست، و همان تنها راه خروج نیز هست. از همان راه، در کنار همان سنگ‌ها بازمی‌گردید —
    و بار دوم آن‌ها را جور دیگری می‌بینید.
  tip: >-
    بازدیدها با راهنما و در گروه‌های کوچک انجام می‌شود. ساعات کاری با فصل تغییر می‌کند — تقریباً ۱۰:۰۰
    تا ۱۸:۰۰ در بهار، ۱۰:۰۰ تا ۱۹:۰۰ در تابستان و ۱۰:۰۰ تا ۱۷:۰۰ در پاییز و زمستان — و بهتر است پیش از
    رفتن قیمت بلیت را در nationalparks.ge بررسی کنید. درون غار نزدیک به ۱۳٫۵ درجه است، پس حتی در ژوئیه
    ژاکت گرم بیاورید. راه‌های سیمانی می‌توانند مرطوب باشند، کفشی با کف ضدلغزش بپوشید؛ پله‌ها استفاده از
    ویلچر و کالسکه‌ی کودک را ناممکن می‌سازند. مرکز بازدیدکنندگان کافه و مغازه‌ی سوغات دارد. غار را با
    تسوتسخواتی، صومعه‌ی گلاتی یا مخزن آب تکیبولی یکجا ببینید، همگی در فاصله‌ی نزدیک به ده کیلومتری به
    خط مستقیم.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب از میان تونل ریکوتی و از کنار زستافونی بگیرید، و در تقاطع ترجولا،
    نزدیک به ۲۰۰ کیلومتر جلوتر، از بزرگراه خارج شوید. از آنجا چند کیلومتر راه روستایی به سوی شمال به روستای
    ناوِناخِوی می‌رسد؛ تابلوهای آژانس مناطق حفاظت‌شده را دنبال کنید. در مجموع نزدیک به ۲۱۰ کیلومتر، کمی
    بیش از سه ساعت. راه در سراسر مسیر آسفالت است؛ آخرین بخش تنگ اما نگه‌داری‌شده است. در زستافونی یا ترجولا
    سوخت‌گیری کنید. در مرکز بازدیدکنندگان جای پارک هست، و در هر فصلی یک خودروی اقتصادی کافی است.
he:
  name: מערת נבנחווי
  short: >-
    מערת קארסט באורך 250 מטרים סמוך לטרג'ולה, ארבעה אולמות בשתי קומות, המסתיימת בעמוד אבן בעובי שבעה מטרים
    החותם את הדרך.
  body: >-
    **נבנחווי משמרת את הרגע הטוב ביותר שלה לסוף: עמוד אבן בעובי שבעה מטרים, הסוגר את המערה כמו דלת שלא
    נפתחה מעולם.**


    המערה שוכנת בגובה 235 מטרים במחוז טרג'ולה, מתחת לכפר ששמו, כך נראה, רומז לכרם שהיה כאן פעם. נכנסים
    בתחתית שקע בצורת משפך. בפנים, התקרה מתרוממת בתחילה לכ-5 מטרים; שלושים מטרים בהמשך, המעבר המרכזי מתפצל
    לשניים, וגרמי מדרגות קצרים מובילים לקומה שנייה ולאולם שגגו מתנשא מעל 15 מטרים. כ-250 מטרים של מעברים,
    ארבעה אולמות בשתי קומות, כולם נחצבו בידי המים באבן גיר מהתקופה הקרטיקונית.


    מה לחפש:


    - **נטיפים וזקיפים** באורך של עד חמישה מטרים, שגדלו טיפה אחר טיפה במשך פרק זמן בלתי נתפס

    - **שכבות חרסית בעומק של שניים עד שלושה מטרים**, שהותירו שיטפונות שזרמו בעבר בחלקה הקדמי של המערה

    - **עמוד הנטיפים בקצה** — עמוד מהרצפה עד התקרה שחתם את המעבר לחלוטין


    האוויר נשאר סביב 13.5°C במשך כל השנה. המערה יבשה ברובה, ואי שם באפלולית טיפה אחת בודדת סופרת את הזמן.


    המדע שם לה לב לראשונה בשנות ה-1930, כשהגאוגרף לוואן מרואשווילי חקר אותה. הדחיפה לפתוח אותה למבקרים
    הגיעה מבני המקום עצמם: ב-1981 שתי אחיות מקומיות, האחיות חוג'אדזה, כתבו על המערה, וכתיבתן הפעילה תהליך
    ארוך שהסתיים בפתיחתה הרשמית ב-2018. כיום היא אתר טבע מוגן, מצוידת בשבילי בטון, נקודות תצפית ודלת ברזל.


    יש רק דרך אחת להיכנס, וזו גם הדרך היחידה לצאת. אתם חוזרים על עקבותיכם על פני אותן אבנים עצמן — ורואים
    אותן שונות בפעם השנייה.
  tip: >-
    הביקורים מודרכים ומתקיימים בקבוצות קטנות. שעות הפתיחה משתנות לפי העונה — בערך 10:00–18:00 באביב, 10:00–19:00
    בקיץ ו-10:00–17:00 בסתיו ובחורף — וכדאי לבדוק את מחיר הכרטיס העדכני באתר nationalparks.ge לפני היציאה.
    הטמפרטורה בפנים כ-13.5°C, אז הביאו סוודר פליז גם ביולי. שבילי הבטון עשויים להיות לחים, לכן נעלו נעליים
    עם אחיזה טובה; המדרגות פוסלות כניסת כיסאות גלגלים ועגלות תינוקות. במרכז המבקרים יש בית קפה וחנות מזכרות.
    שלבו את המערה עם צוצחואטי, מנזר גלאתי או מאגר טקיבולי, כולם במרחק של כעשרה קילומטרים בקו אווירי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה דרך מנהרת ריקותי, אל מעבר לזסטפוני, ורדו מהכביש הראשי בצומת טרג'ולה,
    כ-200 ק"מ בהמשך הדרך. משם כמה קילומטרים של כביש כפרי צפונה מובילים לכפר נבנחווי; עקבו אחר שילוט הרשות
    לשטחים מוגנים. בסך הכול כ-210 ק"מ, קצת יותר משלוש שעות. הדרך אספלט לכל אורכה; הקטע האחרון צר אך מתוחזק
    היטב. תדלקו בזסטפוני או בטרג'ולה. יש חניה במרכז המבקרים, ורכב אקונומי מספיק בכל עונה.
ar:
  name: كهف نافيناخيفي
  short: كهف كارستي يمتد 250 مترًا قرب تيرجولا، أربع قاعات على طابقين، ينتهي بعمود حجري بثخانة سبعة أمتار
    يسدّ الطريق.
  body: >-
    **يدّخر نافيناخيفي أفضل لحظاته للنهاية: عمود من الحجر بثخانة سبعة أمتار، يغلق الكهف كباب لم يُفتح
    أبدًا.**


    يقع الكهف على ارتفاع 235 مترًا في بلدية تيرجولا، تحت قرية يبدو أن اسمها يشير إلى كرمٍ كان هنا في الماضي.
    يُدخَل إليه من قاع منخفض على شكل قمع. في الداخل، يرتفع السقف أولاً إلى نحو خمسة أمتار؛ وبعد ثلاثين
    مترًا، ينقسم الممر الرئيسي إلى قسمين، وتقود درجات قصيرة إلى طابق ثانٍ وقاعة يعلو سقفها فوق خمسة عشر
    مترًا. نحو 250 مترًا من الممرات، أربع قاعات على طابقين، تشكّلت كلها بالذوبان في الحجر الجيري من العصر
    الطباشيري.


    ما يجدر البحث عنه:


    - **صواعد وهوابط** يصل طولها إلى خمسة أمتار، نمت قطرة بعد قطرة على مدى زمني يتجاوز الخيال

    - **طبقات من الطين بعمق مترين إلى ثلاثة**، ترسّبت من فيضانات كانت تتدفق عبر مدخل الكهف

    - **العمود الكلسي في النهاية**، حيث التقت الصواعد بالهوابط — عمود من الأرض إلى السقف أغلق الممر إغلاقًا
    كاملاً


    يبقى الهواء عند نحو 13.5 درجة مئوية طوال العام. الكهف جافّ في معظمه، وفي مكان ما وسط شبه الظلام، تُحصي
    قطرة واحدة الزمن.


    التفت العلم إليه أول مرة في الثلاثينيات، حين درسه الجغرافي ليفان مارواشفيلي. أما الدافع لفتحه للزوار
    فجاء من أهل المكان أنفسهم: في عام 1981 كتبت شقيقتان محليتان، الأختان خوجادزه، عن الكهف، وأطلقت كتابتهما
    العمل الطويل الذي انتهى بافتتاحه الرسمي عام 2018. وهو اليوم معلم طبيعي محمي، مجهّز بممرات خرسانية
    ومنصات مراقبة وباب حديدي.


    لا يوجد سوى طريق واحد للدخول، وهو نفسه الطريق الوحيد للخروج. تعودون من حيث أتيتم مارّين بالصخور نفسها
    — وترونها هذه المرة مختلفة.
  tip: >-
    الزيارات مصحوبة بمرشد وتتم في مجموعات صغيرة. تتغيّر ساعات العمل بحسب الفصل — نحو 10:00–18:00 في الربيع،
    و10:00–19:00 في الصيف، و10:00–17:00 في الخريف والشتاء — ويُستحسن التحقق من سعر التذكرة الحالي على
    nationalparks.ge قبل الذهاب. درجة الحرارة الداخلية نحو 13.5 مئوية، فاحملوا سترة صوفية خفيفة حتى في
    يوليو. قد تكون الممرات الخرسانية رطبة، فارتدوا أحذية مانعة للانزلاق؛ والدرجات تحول دون دخول الكراسي
    المتحركة وعربات الأطفال. يضم مركز الزوار مقهى ومتجر هدايا تذكارية. اجمعوا بين الكهف وتسوتسخفاتي أو
    دير غيلاتي أو خزان تكيبولي، وجميعها على مسافة نحو عشرة كيلومترات في خط مستقيم.
  route: >-
    من تبليسي، خذوا الطريق S1 (E60) غربًا عبر نفق ريكوتي وتجاوزوا زيستافوني، واخرجوا من الطريق السريع
    عند مفرق تيرجولا، بعد نحو 200 كم. من هناك، يقود طريق ريفي شمالًا لبضعة كيلومترات إلى قرية نافيناخيفي؛
    اتبعوا لافتات وكالة المناطق المحمية. المسافة الإجمالية نحو 210 كم، أي أكثر بقليل من ثلاث ساعات. الطريق
    مُعبّد بالكامل؛ والمقطع الأخير ضيق لكنه بحالة جيدة. تزوّدوا بالوقود في زيستافوني أو تيرجولا. يوجد
    موقف سيارات عند مركز الزوار، وتكفي سيارة اقتصادية في أي فصل.
