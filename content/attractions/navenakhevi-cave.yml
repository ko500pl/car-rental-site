ka:
  name: ნავენახევის მღვიმე
  short: >-
    პატარა, განათებული კარსტული მღვიმე თერჯოლის მუნიციპალიტეტში, შვიდმეტრიანი სტალაქტიტით გასასვლელთან.
  body: >-
    **ნავენახევი ის მღვიმეა, სადაც პრომეთეს რიგში დგომა არ გიწევს.** ის თერჯოლის მუნიციპალიტეტში, ოქრიბის
    კარსტულ მასივში, დაახლოებით 235 მეტრზეა და დაცული ტერიტორიების სააგენტოს ექვემდებარება — იმერეთის
    მღვიმეების დაცული ტერიტორიების ნაწილია, სათაფლიასა და პრომეთესთან ერთად.


    ბუნების ძეგლის სტატუსი 2007 წელს მიენიჭა, ტურისტული მოწყობა კი 2017 წელს დასრულდა: ბეტონის ბილიკი,
    მოაჯირი და განათება. მღვიმე ცარცული კირქვაშია გამოკვეთილი, ორსართულიანია და ოთხ დიდ დარბაზს მოიცავს.
    შესასვლელი განზრახ ვიწროა — სულ სამოცი სანტიმეტრი სიმაღლისა და ორი მეტრი სიგანის ხვრელი, რომლის მიღმაც
    სივრცე მოულოდნელად იშლება.


    შიგნით სტანდარტული, მაგრამ კარგად შემონახული კარსტული ფორმებია: სტალაქტიტები, სტალაგმიტები, ფარდები
    და გაქვავებული ჩანჩქერები. მთავარი ეფექტი გასასვლელთანაა — შვიდი მეტრის სისქის სტალაქტიტური სვეტი,
    რომელიც სახურავიდან იატაკამდე ჩამოდის.


    გულწრფელად შედარება: ნავენახევი პრომეთეზე ბევრად პატარაა, ნავი და მუსიკალური განათება არ აქვს, ერთი
    სავალი წრე ორმოცდაათ წუთს იკავებს. სამაგიეროდ ჯგუფები მცირეა, ხმაური არ არის და გიდი ხშირად პირადად
    გატარებს. თუ პრომეთე ავტობუსებით სავსეა ან უკვე ნანახი გაქვს, ეს გონივრული ალტერნატივაა — მითუმეტეს
    გელათიდან ოციოდე წუთშია.


    ტემპერატურა მთელი წლის განმავლობაში 13–15 გრადუსია, ტენიანობა კი მაღალი — ზაფხულის სიცხეში ეს სასიამოვნო
    კონტრასტია.


    მღვიმე ოქრიბის მასივშია — კირქვის ბლოკში, რომელიც ღრმულებით არის დაცხრილული. სათაფლია, პრომეთე, ცუცხვათი
    და ნავენახევი ერთი და იმავე გახსნილი ქანის სისტემას ეკუთვნის; სწორედ ამიტომაა საქართველოს მოწყობილი
    მღვიმეების უმეტესობა იმერეთის ამ პატარა კუთხეში თავმოყრილი. მიწისზედა მისადგომი კაკლისა და ვენახის
    ნაკვეთებში მიდის, ავტოსადგომიდან შესასვლელამდე კი ხუთიოდე წუთის სავალია მოწესრიგებულ ბილიკზე.
  tip: >-
    ერთი საათი ყველაფერზე. შესვლა მხოლოდ გიდთან ერთადაა, ჯგუფები რიგრიგობით მიდის — ზაფხულში მცირე ლოდინი
    შესაძლებელია. შიგნით 13–15 გრადუსია, ამიტომ ქურთუკი ან ჟილეტი აიღე მაშინაც კი, როცა გარეთ ოცდაათია.
    ბილიკი ბეტონისაა და მოაჯირიანი, მაგრამ სველი და სრიალა — გლუვძირიანი ფეხსაცმელი არ გამოდგება. საფეხურების
    გამო ეტლით ან ურიკით არ გამოვა. პარკინგი, ტუალეტი და პატარა ჯიხური შესასვლელთანაა.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ თერჯოლის მიმართულებით და ჩრდილოეთით ქვედა სიმონეთისკენ — სულ
    დაახლოებით 210 კმ და სამი საათი და ხუთი წუთი. გზა ბოლომდე ასფალტიანია, ბოლო რამდენიმე კილომეტრი ვიწრო
    სასოფლო გზაა, მაგრამ მოწესრიგებული. მაჩვენებელი ნიშნები დაცული ტერიტორიების სააგენტოსია, მწვანე ფერის.
    საწვავი ზესტაფონსა და თერჯოლაში აიღე. მღვიმის შესასვლელთან უფასო პარკინგია. ეკონომ-კლასის ავტომობილი
    სავსებით საკმარისია.
en:
  name: Navenakhevi Cave
  short: >-
    A small lit karst cave in Terjola municipality, with a seven-metre-thick stalactite column near the
    exit.
  body: >-
    **Navenakhevi is the cave where you do not queue.** It lies in Terjola municipality in the Okriba karst
    massif at about 235 metres, and is run by the Agency of Protected Areas as part of the Imereti Caves
    Protected Areas, together with Sataplia and Prometheus.


    It was declared a natural monument in 2007, and the visitor works were finished in 2017: a concrete
    path, a handrail and lighting. The cave is cut into Cretaceous limestone, has two levels and takes
    in four large halls. The entrance is deliberately tight — an opening about sixty centimetres high and
    two metres wide, beyond which the space suddenly opens out.


    Inside are the standard karst forms, but well preserved: stalactites, stalagmites, curtains and petrified
    waterfalls. The set piece is near the exit, a stalactite column seven metres thick running from roof
    to floor.


    An honest comparison: Navenakhevi is far smaller than Prometheus, has no boat and no music-and-colour
    lighting, and one circuit takes about fifty minutes. In return the groups are small, there is no noise,
    and the guide often takes you round personally. If Prometheus is full of coaches or you have already
    seen it, this is a sensible alternative — and it is twenty minutes from Gelati.


    The temperature holds at 13–15 °C all year with high humidity, which in the summer heat of the Rioni
    lowland is a welcome contrast.


    The cave sits in the Okriba massif, a block of limestone riddled with cavities. Sataplia, Prometheus,
    Tsutskhvati and Navenakhevi all belong to the same system of dissolved rock, which is why so many of
    Georgia's accessible caves are concentrated in this small corner of Imereti. Above ground the approach
    runs between walnut trees and vine plots, and the walk from the car park to the entrance takes about
    five minutes on a made path.
  tip: >-
    An hour covers everything. Entry is only with a guide and groups go in turn, so expect a short wait
    in summer. It is 13–15 °C inside, so take a jacket or fleece even when it is thirty degrees outside.
    The path is concrete with a handrail but wet and slippery; smooth soles are a bad idea. Steps make
    it impossible with a wheelchair or pushchair. Parking, toilets and a small kiosk stand at the entrance.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then follow signs for Terjola and turn north towards Kveda
    Simoneti — about 210 km in all, three hours five. The road is asphalt throughout; the last few kilometres
    are a narrow but well-kept country road. The signs are the green boards of the Agency of Protected
    Areas. Refuel in Zestaponi or Terjola. There is free parking at the cave entrance. An economy car is
    entirely sufficient.
ru:
  name: Пещера Навенахеви
  short: >-
    Небольшая освещённая карстовая пещера в Тержольском муниципалитете, со сталактитовой колонной семи
    метров в толщину.
  body: >-
    **Навенахеви — пещера, в которую не нужно стоять в очереди.** Она находится в Тержольском муниципалитете,
    в Окрибском карстовом массиве, на высоте около 235 метров, и относится к Агентству защищённых территорий
    как часть Имеретинских пещер вместе с Сатаплиа и Прометеевой пещерой.


    Статус памятника природы она получила в 2007 году, а обустройство для посетителей завершили в 2017-м:
    бетонная дорожка, перила, освещение. Пещера выработана в меловом известняке, имеет два яруса и включает
    четыре больших зала. Вход намеренно узкий — отверстие высотой около шестидесяти сантиметров и шириной
    два метра, за которым пространство внезапно раскрывается.


    Внутри стандартные, но хорошо сохранившиеся карстовые формы: сталактиты, сталагмиты, драпировки, окаменевшие
    водопады. Главный эффект ближе к выходу — сталактитовая колонна семи метров в толщину, идущая от свода
    до пола.


    Честное сравнение: Навенахеви заметно меньше Прометеевой пещеры, здесь нет лодки и цветомузыки, а один
    круг занимает минут пятьдесят. Зато группы небольшие, шума нет, и гид часто ведёт вас лично. Если Прометей
    забит автобусами или вы его уже видели, это разумная замена — тем более что от Гелати сюда двадцать
    минут.


    Температура держится 13–15 градусов круглый год при высокой влажности, что в летнюю жару Рионской низменности
    приятно.


    Пещера находится в Окрибском массиве — известняковом блоке, изрешечённом полостями. Сатаплиа,
    Прометеева, Цуцхвати и Навенахеви принадлежат одной и той же системе растворённой породы, поэтому
    столько доступных пещер Грузии собрано в этом небольшом уголке Имеретии. На поверхности подход идёт
    между ореховыми деревьями и виноградниками, а от парковки до входа минут пять по обустроенной дорожке.
  tip: >-
    Часа хватает на всё. Вход только с гидом, группы идут по очереди, так что летом возможно небольшое
    ожидание. Внутри 13–15 градусов, поэтому берите куртку или флиску, даже если снаружи тридцать. Дорожка
    бетонная, с перилами, но мокрая и скользкая — гладкая подошва не годится. Из-за ступеней с коляской
    или в кресле не пройти. Парковка, туалет и небольшой киоск — у входа.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем по указателям на Тержолу и на север к Квемо Симонети — всего
    около 210 км, три часа пять минут. Дорога асфальтированная на всём протяжении, последние несколько
    километров — узкая, но ухоженная сельская трасса. Указатели зелёные, Агентства защищённых территорий.
    Заправляйтесь в Зестафони или Тержоле. У входа в пещеру бесплатная парковка. Машины эконом-класса
    вполне достаточно.
fa:
  name: غار ناوناخوی
  short: >-
    غاری کارستی، کوچک و روشن، در شهرستان ترجولا، با ستون چکنده‌ای به ضخامت هفت متر نزدیک خروجی.
  body: >-
    **ناوناخوی غاری است که برای دیدنش در صف نمی‌ایستید.** در شهرستان ترجولا و در تودهٔ کارستی اوکریبا،
    در ارتفاع حدود ۲۳۵ متر قرار دارد و سازمان مناطق حفاظت‌شده آن را همراه با ساتاپلیا و پرومته، در قالب
    مناطق حفاظت‌شدهٔ غارهای ایمرتی، اداره می‌کند.


    در ۲۰۰۷ اثر طبیعی ملی اعلام شد و کار آماده‌سازی برای بازدید در ۲۰۱۷ به پایان رسید: مسیر بتنی، نرده
    و روشنایی. غار در سنگ آهک کرتاسه کنده شده، دو طبقه دارد و چهار تالار بزرگ را در بر می‌گیرد. دهانه عمداً
    تنگ است؛ روزنه‌ای به بلندی حدود شصت سانتی‌متر و پهنای دو متر که پشتش فضا ناگهان باز می‌شود.


    درون آن شکل‌های معمول کارستی اما خوش‌حفظ‌شده است: چکنده و چکیده، پرده‌های سنگی و آبشارهای سنگ‌شده.
    نقطهٔ اوج نزدیک خروجی است: ستونی چکنده به ضخامت هفت متر که از سقف تا کف کشیده شده.


    مقایسه‌ای صادقانه: ناوناخوی بسیار کوچک‌تر از پرومته است، قایق و نورپردازی موسیقایی ندارد و یک دور آن
    نزدیک پنجاه دقیقه طول می‌کشد. در عوض گروه‌ها کوچک‌اند، سروصدا نیست و راهنما اغلب شخصاً شما را می‌گرداند.
    اگر پرومته پر از اتوبوس است یا پیش‌تر دیده‌اید، این جایگزین معقولی است — به‌ویژه که تا گلاتی بیست دقیقه
    راه است.


    دما تمام سال میان ۱۳ تا ۱۵ درجه می‌ماند و رطوبت بالاست، که در گرمای تابستان پست‌دشت ریونی تضادی خوشایند
    است.


    غار در تودهٔ اوکریبا قرار دارد؛ بلوکی از سنگ آهک که پر از حفره است. ساتاپلیا، پرومته، تسوتسخواتی و
    ناوناخوی همه به یک سامانهٔ سنگِ حل‌شده تعلق دارند، و به همین سبب است که این‌همه از غارهای در دسترس
    گرجستان در همین گوشهٔ کوچک ایمرتی جمع شده‌اند. روی زمین مسیر از میان درختان گردو و تاکستان‌ها می‌گذرد و
    از پارکینگ تا دهانه حدود پنج دقیقه راه ساخته‌شده است.
  tip: >-
    یک ساعت همه‌چیز را پوشش می‌دهد. ورود فقط با راهنماست و گروه‌ها به نوبت می‌روند، پس در تابستان انتظار
    کوتاهی محتمل است. داخل ۱۳ تا ۱۵ درجه است، پس حتی وقتی بیرون سی درجه است کاپشن یا پولار بردارید. مسیر
    بتنی و نرده‌دار اما خیس و لغزنده است و کفش با کف صاف انتخاب بدی است. پله‌ها عبور با ویلچر یا کالسکه
    را ناممکن می‌کند. پارکینگ، سرویس بهداشتی و دکه‌ای کوچک کنار ورودی است.
  route: >-
    از تفلیس با بزرگراه E60 تا زستافونی، سپس تابلوهای ترجولا را دنبال کنید و به شمال، به سوی کودا سیمونتی
    بپیچید — روی‌هم حدود ۲۱۰ کیلومتر و سه ساعت و پنج دقیقه. جاده تا انتها آسفالت است و چند کیلومتر آخر
    راهی روستایی، باریک اما مرتب. تابلوها سبزرنگ و متعلق به سازمان مناطق حفاظت‌شده‌اند. سوخت را در زستافونی
    یا ترجولا بگیرید. کنار ورودی غار پارکینگ رایگان هست. خودروی اقتصادی کاملاً کافی است.
he:
  name: מערת נאוונאחווי
  short: >-
    מערת קרסט קטנה ומוארת בנפת טרז'ולה, ובה עמוד נטיפים בעובי שבעה מטרים סמוך ליציאה.
  body: >-
    **נאוונאחווי היא המערה שאין בה תור.** היא נמצאת בנפת טרז'ולה, בגוש הקרסט של אוקריבה, בגובה כ-235 מטר,
    ומנוהלת בידי רשות השטחים המוגנים כחלק ממערות אימרתי, יחד עם סטפליה ופרומתאוס.


    ב-2007 הוכרזה כאתר טבע, וב-2017 הושלמו עבודות ההנגשה: שביל בטון, מעקה ותאורה. המערה חצובה באבן גיר
    מן הקרטיקון, יש בה שני מפלסים והיא כוללת ארבעה אולמות גדולים. הפתח צר במכוון — פרצה בגובה כשישים סנטימטרים
    וברוחב שני מטרים, שמעברה החלל נפתח בבת אחת.


    בפנים נמצאות הצורות הקרסטיות הרגילות אך במצב שימור טוב: נטיפים, זקיפים, וילונות ומפלים מאובנים. שיא
    הביקור סמוך ליציאה — עמוד נטיפים בעובי שבעה מטרים היורד מן התקרה עד הרצפה.


    השוואה כנה: נאוונאחווי קטנה בהרבה מפרומתאוס, אין בה סירה ואין תאורה מוזיקלית, וסיבוב אחד אורך כחמישים
    דקות. בתמורה הקבוצות קטנות, אין רעש, והמדריך לא פעם מלווה אתכם אישית. אם פרומתאוס מלאה באוטובוסים או
    שכבר ראיתם אותה, זו חלופה הגיונית — ומגלאתי הדרך לכאן עשרים דקות.


    הטמפרטורה נשמרת על 13–15 מעלות כל השנה בלחות גבוהה, ובחום הקיץ של שפלת הריוני זה ניגוד מבורך.


    המערה יושבת בגוש אוקריבה, בלוק אבן גיר מנוקב חללים. סטפליה, פרומתאוס, צוצחוואטי ונאוונאחווי שייכות כולן
    לאותה מערכת של סלע מומס, ולכן כה הרבה מן המערות הנגישות בגאורגיה מרוכזות בפינה קטנה זו של אימרתי. מעל
    פני הקרקע עוברת הגישה בין עצי אגוז וחלקות גפן, וההליכה מן החניון אל הפתח אורכת כחמש דקות בשביל סלול.
  tip: >-
    שעה מכסה הכול. הכניסה רק עם מדריך והקבוצות נכנסות בתורן, לכן בקיץ ייתכן המתנה קצרה. בפנים 13–15 מעלות,
    אז קחו מעיל או פליז גם כשבחוץ שלושים. השביל מבטון ובעל מעקה אך רטוב וחלקלק, וסוליה חלקה היא רעיון רע.
    המדרגות הופכות את המקום לבלתי אפשרי עם כיסא גלגלים או עגלה. חניה, שירותים ודוכן קטן נמצאים בכניסה.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז לפי השילוט לטרז'ולה וצפונה לכיוון קוודה סימונטי — כ-210 ק״מ בסך
    הכול, שלוש שעות וחמש דקות. הכביש סלול לכל אורכו, והקילומטרים האחרונים הם דרך כפרית צרה אך מתוחזקת.
    השלטים ירוקים, של רשות השטחים המוגנים. תדלקו בזסטפוני או בטרז'ולה. בכניסה למערה יש חניה חינם. רכב חסכוני
    מספיק לחלוטין.
ar:
  name: كهف نافيناخيفي
  short: >-
    كهف كارستي صغير ومضاء في بلدية ترجولا، وفيه عمود صواعد وهوابط بسماكة سبعة أمتار قرب المخرج.
  body: >-
    **نافيناخيفي هو الكهف الذي لا تنتظر عند بابه في طابور.** يقع في بلدية ترجولا ضمن كتلة أوكريبا الكارستية
    على ارتفاع نحو 235 متراً، وتديره وكالة المناطق المحمية بوصفه جزءاً من محميات كهوف إيميريتي إلى جانب
    ساتابليا وبروميثيوس.


    أُعلن معلماً طبيعياً عام 2007، واكتملت أعمال تهيئته للزوار في 2017: ممر خرساني ودرابزين وإضاءة. والكهف
    محفور في حجر جيري من العصر الطباشيري، وله مستويان ويضم أربع قاعات كبيرة. أما المدخل فضيّق عن قصد: فتحة
    بارتفاع نحو ستين سنتيمتراً وعرض مترين، وخلفها ينفتح الفراغ فجأة.


    في الداخل الأشكال الكارستية المعتادة لكن بحالة حفظ جيدة: هوابط وصواعد وستائر حجرية وشلالات متحجرة.
    وذروة الزيارة قرب المخرج: عمود من الهوابط بسماكة سبعة أمتار يمتد من السقف إلى الأرض.


    مقارنة صريحة: نافيناخيفي أصغر كثيراً من بروميثيوس، وليس فيه قارب ولا إضاءة موسيقية، وتستغرق الجولة
    الواحدة نحو خمسين دقيقة. في المقابل المجموعات صغيرة ولا ضجيج، والمرشد يرافقك شخصياً في الغالب. فإن
    كان بروميثيوس مزدحماً بالحافلات أو سبق أن زرته، فهذا بديل معقول — ولا يبعد عن غيلاتي أكثر من عشرين
    دقيقة.


    تظل الحرارة بين 13 و15 درجة طوال العام مع رطوبة عالية، وهو تباين محبب في حر الصيف بسهل ريوني.


    يقع الكهف في كتلة أوكريبا، وهي كتلة من الحجر الجيري مثقوبة بالتجاويف. وتنتمي ساتابليا وبروميثيوس
    وتسوتسخفاتي ونافيناخيفي جميعاً إلى منظومة الصخر المذاب نفسها، ولهذا تتركز هذه الأعداد من كهوف جورجيا
    المتاحة في هذه الزاوية الصغيرة من إيميريتي. وفوق الأرض يمر الطريق بين أشجار الجوز وقطع الكروم، ويستغرق
    المشي من الموقف إلى المدخل نحو خمس دقائق على ممر مهيأ.
  tip: >-
    ساعة تغطي كل شيء. الدخول بمرافقة مرشد فقط والمجموعات تدخل بالتناوب، فتوقّع انتظاراً قصيراً صيفاً. الحرارة
    في الداخل 13–15 درجة، فخذ سترة أو صوفية حتى لو كانت في الخارج ثلاثين. الممر خرساني وفيه درابزين لكنه
    مبلل وزلق، والنعل الأملس فكرة سيئة. والدرجات تجعل المرور بكرسي متحرك أو عربة أطفال متعذراً. الموقف
    ودورات المياه وكشك صغير عند المدخل.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم اتبع لافتات ترجولا وانعطف شمالاً نحو كفيدا سيمونيتي — نحو
    210 كم إجمالاً وثلاث ساعات وخمس دقائق. الطريق معبّد على امتداده، والكيلومترات الأخيرة طريق ريفي ضيق
    لكنه جيد الصيانة. واللافتات خضراء تابعة لوكالة المناطق المحمية. تزوّد بالوقود في زستافوني أو ترجولا.
    وعند مدخل الكهف موقف مجاني. وتكفي سيارة اقتصادية تماماً.
