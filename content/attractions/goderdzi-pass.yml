ka:
  name: გოდერძის უღელტეხილი და ნამარხი ტყე
  short: >-
    2025 მეტრზე მდებარე უღელტეხილი ნესტიან აჭარასა და მშრალ სამცხეს შორის, აღმოსავლეთ კალთაზე კი პალმებისა
    და დაფნის გაქვავებული ტყე.
  body: >-
    **გოდერძის 2025-მეტრიანი უნაგირის ქვემოთ, გვიანი თოვლისა და ზაფხულის ქოხების ქვეშ, პალმების, დაფნებისა
    და მაგნოლიების ტყე განისვენებს. ის ქვად ადამიანის გაჩენამდე დიდი ხნით ადრე იქცა.**


    გოდერძი არსიანის ქედის უნაგირია, სადაც აჭარა მთავრდება და სამცხე იწყება. აქ გადის შ1, ბათუმი–ახალციხის
    გზა, ერთადერთი, რომელიც აჭარისწყლის ნესტიან ხეობას ადიგენის მიდამოების მაღლობებთან აკავშირებს. დასავლეთ
    კალთაზე ამინდი შავი ზღვიდან ამოდის, აღმოსავლეთით კი ფერდობები იშლება და სინათლე მშრალდება.


    უღელტეხილი ვულკანური ქანებითაა აგებული და ეს ქანები მატიანეს ინახავს. მილიონობით წლის წინ ამოფრქვევებმა
    და ფერფლიანმა ღვარცოფებმა თბილი, შერეული ტყე დამარხა: მარადმწვანე პალმები, ქაფურის ხე, დაფნა და მაგნოლია,
    მათ გვერდით კი ლეღვი, ნეკერჩხალი, მუხა და რცხილა. მერქანი ოპალად, კვარცად და ქალცედონად იქცა. ზოგიერთ
    ღეროს ვერტიკალური მდებარეობა და წლიური რგოლები დღემდე შერჩენია. „გოდერძის ფლორაზე“ მეცნიერები XIX
    საუკუნის 80-იანი წლებიდან წერენ, 365 ჰექტარი კი დღეს ბუნების ძეგლად არის დაცული. ეძებეთ აღმოსავლეთ
    კალთაზე, ძინძისწყლის ხეობაში, დაახლოებით 1600–2100 მეტრზე, ანუ ადიგენის მხარეს და არა ხულოსას.


    უღელტეხილის თხემი გაცილებით ახალგაზრდაა. სათხილამურო კურორტი აქ 2012–2015 წლებში აშენდა; საბაგიროები
    დაახლოებით 2350 მეტრამდე ადის, ჩვეულებრივ ზამთარში კი თოვლის საფარი სამ-ოთხ მეტრს აღწევს. ზაფხულში
    კოტეჯები და სამი კილომეტრით დაშორებული დანისპარაულის საოჯახო სასტუმროები მოთხილამურეების ნაცვლად ფეხით
    მოსიარულეებს მასპინძლობენ, სუბალპური მდელოები კი მიმოფანტული ქოხების ირგვლივ მწვანედ იფერება.


    გოდერძი ამინდის გავლებული საზღვარია: ზურგს უკან ზღვის ნისლი გრჩებათ, წინ კი შიდა ქვეყნის პირველი მშრალი
    სინათლე გხვდებათ.
  tip: >-
    სამი საათი უღელტეხილს და ნამარხ კალთას ეყოფა. გადასვლა მეტ-ნაკლებად საიმედოა ივნისიდან სექტემბრამდე;
    ზამთარში კურორტამდე ხულოს მხრიდან ადიან, ადიგენისკენ დაშვების იმედი კი ნუ გექნებათ, ამიტომ გზაზე გასვლამდე
    ადგილობრივებს ჰკითხეთ. გზისპირა თოვლი შეიძლება ივნისამდე იდოს, თხემზე კი ივლისშიც ცივა და ქარია: თბილი
    სამოსი თან იქონიეთ. საჭმელი და ტუალეტი კურორტზე და დანისპარაულშია, საწვავი უღელტეხილზე არ არის. ნისლი
    ხილვადობას წუთებში შთანთქავს: ფარები ჩართეთ და არავის გაუსწროთ. ნამარხები დაცულია: გადაიღეთ, მაგრამ
    ჯიბეში ნუ ჩაიდებთ.
  route: >-
    თბილისიდან ს1-ით დასავლეთით ხაშურამდე წადით, იქიდან ს8-ით ბორჯომის ხეობის გავლით ახალციხემდე, შემდეგ
    შ1-ით დასავლეთით, ადიგენის გავლით, უღელტეხილამდე: დაახლოებით 300 კილომეტრი და რეალისტურად ექვსნახევარი
    საათი. ადიგენის იქით გზა უარესდება; ბოლო 50-იოდე კილომეტრი ვიწრო, მეტწილად მოუკირწყლავი და მკვეთრი
    მოსახვევებითაა სავსე, გასავლელი მხოლოდ უთოვლო თვეებში. აიღეთ 4x4, ან, სულ მცირე, მაღალი კლირენსის
    მანქანა. საწვავი ახალციხეში ჩაასხით. ალტერნატივა ბათუმისა და ხულოს გავლით გადის, სულ დაახლოებით 480
    კილომეტრი; ბათუმიდან კურორტამდე 109 კილომეტრია, ზაფხულში სამ საათამდე.
en:
  name: Goderdzi Pass and the Petrified Forest
  short: >-
    A 2,025-metre saddle between sea-damp Adjara and dry Samtskhe, where a forest of palms and laurels
    lies turned to stone on the eastern slope.
  body: >-
    **Below the 2,025-metre saddle, beneath late snowdrifts and summer huts, lies a forest of palms, laurels
    and magnolias, turned to stone long before there were people to see it.**


    Goderdzi is the saddle of the Arsiani Range where Adjara ends and Samtskhe begins. The Sh1 from Batumi
    to Akhaltsikhe crosses it, the one road between the wet Adjaristsqali valley and the uplands around
    Adigeni. On the western side the weather rolls in off the Black Sea; to the east the slopes open out
    and the light turns drier.


    The pass is built of volcanic rock, and the rock keeps a record. Millions of years ago eruptions and
    torrents of ash-laden mud buried a warm, mixed forest: evergreens such as palms, camphor trees, laurels
    and magnolias alongside fig, maple, oak and hornbeam. The wood turned to opal, quartz and chalcedony.
    Some trunks still stand upright, their growth rings intact. Scientists have written about the "Goderdzi
    flora" since the 1880s, and 365 hectares are now protected as a natural monument. Look for it on the
    eastern slope, in the valley of the Dzindzistskali between about 1,600 and 2,100 metres: the Adigeni
    side, not the Khulo one.


    The top of the pass is much younger. A ski resort was built here between 2012 and 2015; its lifts
    climb to about 2,350 metres, and snow lies three to four metres deep in an ordinary winter. In summer
    the chalets, and the guesthouses of Danisparauli three kilometres away, take in walkers instead of
    skiers, and the subalpine meadows turn green around the scattered huts.


    Goderdzi is a border drawn by weather. Behind you, sea mist; ahead, the first dry light of the interior.
  tip: >-
    Allow three hours for the pass and the fossil slope. The crossing is dependable roughly from June
    to September; in winter the resort is reached from the Khulo side, while the descent to Adigeni cannot
    be counted on, so ask locally before committing. Snow can linger by the road into June, and the top
    is cold and windy even in July: bring a warm layer. Food and toilets at the resort and in Danisparauli;
    no fuel on the pass. Fog can cut visibility in minutes, so use your lights and never overtake. The
    fossils are protected: photograph them, don't pocket them.
  route: >-
    From Tbilisi take the S1 west to Khashuri, the S8 through the Borjomi gorge to Akhaltsikhe, then the
    Sh1 west past Adigeni and up to the pass: about 300 km and a realistic six and a half hours. West
    of Adigeni the road deteriorates; the last 50 km or so are narrow, largely unpaved and full of tight
    hairpins, passable only in the snow-free months. Take a 4x4, or at the very least a high-clearance
    car. Fill up in Akhaltsikhe. The alternative runs via Batumi and Khulo, about 480 km in all; the resort
    is 109 km from Batumi, up to three hours in summer.
ru:
  name: Годердзский перевал и Окаменевший лес
  short: >-
    Седловина на высоте 2025 метров между влажной морской Аджарией и сухой Самцхе, где на восточном склоне
    окаменел лес пальм и лавров.
  body: >-
    **Ниже седловины высотой 2025 метров, под поздними сугробами и летними хижинами, лежит лес из пальм,
    лавров и магнолий, обратившийся в камень задолго до того, как на земле появился человек.**


    Годердзи — седловина Арсианского хребта, где кончается Аджария и начинается Самцхе. Через неё проходит
    Sh1, дорога из Батуми в Ахалцихе, — единственная, что связывает влажную долину Аджарисцкали с нагорьями
    вокруг Адигени. На западном склоне погода приходит с Чёрного моря; к востоку склоны раскрываются,
    и свет становится суше.


    Перевал сложен из вулканических пород, а эти породы хранят летопись. Миллионы лет назад извержения
    и потоки пепельной грязи погребли тёплый смешанный лес: вечнозелёные пальмы, камфорные деревья, лавры
    и магнолии вместе с инжиром, кленом, дубом и грабом. Древесина обратилась в опал, кварц и халцедон.
    Некоторые стволы до сих пор стоят вертикально, с сохранившимися годичными кольцами. Учёные пишут о
    «годердзской флоре» с 1880-х годов, а 365 гектаров сегодня охраняются как памятник природы. Ищите
    окаменевший лес на восточном склоне, в долине Дзиндзисцкали, между примерно 1600 и 2100 метрами: со
    стороны Адигени, а не Хуло.


    Вершина перевала намного моложе. Горнолыжный курорт построили здесь в 2012–2015 годах; его подъёмники
    поднимаются примерно до 2350 метров, а обычной зимой снег лежит слоем в три-четыре метра. Летом шале
    и гостевые дома Даниспараули, в трёх километрах отсюда, принимают вместо лыжников пеших туристов,
    а субальпийские луга зеленеют вокруг разбросанных хижин.


    Годердзи — это граница, прочерченная погодой. За спиной — морской туман, впереди — первый сухой свет
    внутренних областей.
  tip: >-
    На перевал и склон с окаменелостями хватит трёх часов. Проезд надёжен примерно с июня по сентябрь;
    зимой к курорту поднимаются со стороны Хуло, а на спуск к Адигени рассчитывать не стоит, так что перед
    выездом спросите у местных. Снег у дороги может лежать до июня, а на вершине холодно и ветрено даже
    в июле: возьмите тёплую одежду. Еда и туалеты — на курорте и в Даниспараули; заправки на перевале
    нет. Туман за считанные минуты может свести видимость к нулю, поэтому включайте фары и никого не обгоняйте.
    Окаменелости охраняются: фотографируйте, но не берите с собой.
  route: >-
    Из Тбилиси по S1 на запад до Хашури, по S8 через Боржомское ущелье до Ахалцихе, затем по Sh1 на запад,
    через Адигени и вверх к перевалу: около 300 км и реально шесть с половиной часов. За Адигени дорога
    портится; последние примерно 50 км узкие, в основном без покрытия и полны крутых серпантинов, проезжие
    только в бесснежные месяцы. Возьмите внедорожник или хотя бы машину с высоким клиренсом. Заправьтесь
    в Ахалцихе. Альтернативный путь идёт через Батуми и Хуло, около 480 км в общей сложности; от Батуми
    до курорта 109 км, летом до трёх часов.
fa:
  name: گذرگاه گودردزی و جنگل سنگ‌شده
  short: >-
    زینی به بلندای ۲۰۲۵ متر میان آجارای مرطوب و ساحلی و سامتسخهٔ خشک، جایی که در دامنهٔ شرقی جنگلی از
    نخل و برگ‌بو به سنگ بدل شده است.
  body: >-
    **پایین‌تر از زینِ ۲۰۲۵ متری، زیر واپسین برف‌های بهاری و کلبه‌های تابستانی، جنگلی از نخل، برگ‌بو و
    ماگنولیا خفته است؛ جنگلی که مدت‌ها پیش از پیدایش انسان به سنگ بدل شده بود.**


    گودردزی زینِ رشته‌کوه ارسیانی است، جایی که آجارا به پایان می‌رسد و سامتسخه آغاز می‌شود. راه Sh1 از
    باتومی به آخالتسیخه از همین‌جا می‌گذرد؛ تنها راهی که درهٔ مرطوب آجاریستسکالی را با بلندی‌های اطراف
    آدیگنی پیوند می‌دهد. در دامنهٔ غربی، هوا از دریای سیاه می‌آید؛ به سوی شرق دامنه‌ها می‌گشایند و روشنایی
    خشک‌تر می‌شود.


    گذرگاه از سنگ‌های آتشفشانی ساخته شده، و این سنگ‌ها خود گزارشگرند. میلیون‌ها سال پیش، فوران‌ها و گِل‌روانه‌های
    آمیخته با خاکستر آتشفشانی، جنگلی گرم و آمیخته را زیر خود دفن کردند: همیشه‌سبزهایی چون نخل، درخت کافور،
    برگ‌بو و ماگنولیا، در کنار انجیر، افرا، بلوط و ممرز. چوب آن‌ها به اوپال، کوارتز و کالسدونی بدل شده
    است. برخی تنه‌ها هنوز ایستاده‌اند، با حلقه‌های رشد سالم. از دههٔ ۱۸۸۰ دانشمندان درباره‌ی «فلور گودردزی»
    نوشته‌اند، و امروز ۳۶۵ هکتار از آن به‌عنوان یادمان طبیعی حفاظت می‌شود. آن را در دامنهٔ شرقی، در درهٔ
    دزیندزیستسکالی، میان تقریباً ۱۶۰۰ تا ۲۱۰۰ متر بجویید: سمت آدیگنی، نه سمت خولو.


    بلندترین نقطهٔ گذرگاه بسیار جوان‌تر است. استراحتگاه اسکی میان سال‌های ۲۰۱۲ تا ۲۰۱۵ ساخته شد؛ تله‌کابین‌هایش
    تا نزدیک ۲۳۵۰ متر بالا می‌روند، و در زمستانی معمولی برف به عمق سه تا چهار متر می‌رسد. در تابستان،
    کلبه‌ها و نیز خانه‌های میهمان دانیسپاراولی در سه کیلومتری آن، به‌جای اسکی‌بازان از کوهپیمایان میزبانی
    می‌کنند، و چمنزارهای زیرکوهستانی گرداگرد کلبه‌های پراکنده سبز می‌شوند.


    گودردزی مرزی است که هوا کشیده است: پشت سرتان مه دریا می‌ماند، پیش رویتان نخستین روشنایی خشک سرزمین
    داخلی.
  tip: >-
    برای گذرگاه و دامنهٔ فسیل‌ها سه ساعت بگذارید. عبور از این مسیر تقریباً از ژوئن تا سپتامبر قابل‌اعتماد
    است؛ در زمستان به استراحتگاه از سمت خولو می‌رسند، اما روی فرود به سوی آدیگنی حساب نکنید، پس پیش از
    حرکت از مردم محل بپرسید. برف کنار راه ممکن است تا ژوئن بماند، و بالای گذرگاه حتی در ژوئیه سرد و بادخیز
    است: لباسی گرم همراه داشته باشید. غذا و سرویس بهداشتی در استراحتگاه و دانیسپاراولی هست؛ در خود گذرگاه
    سوخت‌رسانی نیست. مه می‌تواند دید را در چند دقیقه از بین ببرد، پس چراغ‌ها را روشن کنید و از کسی سبقت
    نگیرید. فسیل‌ها حفاظت‌شده‌اند: عکس بگیرید، اما با خود نبرید.
  route: >-
    از تفلیس مسیر S1 را به سوی غرب تا خاشوری بروید، سپس S8 را از میان درهٔ بورجومی تا آخالتسیخه، و آن‌گاه
    Sh1 را به سوی غرب، از کنار آدیگنی، تا بالای گذرگاه: نزدیک ۳۰۰ کیلومتر و به‌طور واقع‌بینانه شش ساعت
    و نیم. از آدیگنی به بعد راه بدتر می‌شود؛ حدود ۵۰ کیلومتر پایانی باریک، بیشتر بدون آسفالت و پر از پیچ‌های
    تند است، و تنها در ماه‌های بدون برف قابل عبور. خودرویی ۴×۴ بردارید یا دست‌کم خودرویی شاسی‌بلند. در
    آخالتسیخه سوخت‌گیری کنید. مسیر جایگزین از راه باتومی و خولو می‌گذرد، در کل نزدیک ۴۸۰ کیلومتر؛ از باتومی
    تا استراحتگاه ۱۰۹ کیلومتر است، در تابستان تا سه ساعت.
he:
  name: מעבר גודרדזי והיער המאובן
  short: אוכף בגובה 2,025 מטרים בין אג'ריה הימית והלחה לסמצחה היבשה, ובמדרון המזרחי יער שלם של דקלים ועצי
    דפנה שהתאבן.
  body: >-
    **מתחת לאוכף שבגובה 2,025 מטרים, תחת שלגי האביב המאוחרים ובקתות הקיץ, שוכן יער של דקלים, עצי דפנה
    ומגנוליות, שהתאבן הרבה לפני שהיה מי שיראה אותו.**


    גודרדזי הוא האוכף ברכס ארסיאני שבו נגמרת אג'ריה ומתחילה סמצחה. דרך Sh1 מבטומי לאחלציחה חוצה אותו —
    הדרך היחידה בין עמק אג'ריסצקלי הלח לרמות שסביב אדיגני. במדרון המערבי מגיע מזג האוויר מהים השחור; מזרחה
    נפתחים המדרונות והאור נעשה יבש יותר.


    המעבר בנוי מסלע וולקני, והסלע הזה שומר תיעוד. לפני מיליוני שנים, התפרצויות וזרמי בוץ עמוסי אפר קברו
    יער חמים ומעורב: עצים ירוקי-עד כמו דקלים, עצי קמפור, דפנה ומגנוליה, ולצדם תאנה, אדר, אלון וקרפינוס.
    העץ הפך לאופל, לקוורץ ולכלצדון. כמה גזעים עדיין עומדים זקופים, עם טבעות הצמיחה שלהם על מקומן. מדענים
    כותבים על "הצומח של גודרדזי" מאז שנות ה-1880, ו-365 הקטרים מוגנים כיום כאתר טבע. חפשו את היער המאובן
    במדרון המזרחי, בעמק דזינדזיסצקלי, בגובה שבין 1,600 ל-2,100 מטרים בערך: הצד של אדיגני, לא של חולו.


    פסגת המעבר צעירה בהרבה. אתר סקי נבנה כאן בין 2012 ל-2015; המעליות מגיעות לגובה של כ-2,350 מטרים, ובחורף
    רגיל השלג מגיע לעומק של שלושה עד ארבעה מטרים. בקיץ, הבקתות, ובתי האירוח של דניספראולי במרחק שלושה
    קילומטרים, מקבלים מטיילים במקום גולשים, והאחו התת-אלפיני מוריק סביב הבקתות המפוזרות.


    גודרדזי הוא גבול שמזג האוויר צייר: מאחוריכם ערפילי הים, ולפניכם האור היבש הראשון של פנים הארץ.
  tip: >-
    הקדישו שלוש שעות למעבר ולמדרון המאובנים. החציה אמינה בערך מיוני עד ספטמבר; בחורף מגיעים לאתר מכיוון
    חולו, ואילו על הירידה לכיוון אדיגני אי אפשר לסמוך, אז שאלו את המקומיים לפני שתחליטו. שלג יכול להישאר
    בצידי הדרך עד יוני, ובפסגה קר וסוער אפילו ביולי: הביאו בגד חם. אוכל ושירותים נמצאים באתר ובדניספראולי;
    אין תחנת דלק במעבר. ערפל עלול לצמצם את הראות תוך דקות, ולכן הדליקו אורות ואל תעקפו. המאובנים מוגנים:
    צלמו אותם, אל תיקחו אותם.
  route: >-
    מטביליסי סעו ב-S1 מערבה עד חשורי, אחר כך ב-S8 דרך גיא בורג'ומי עד אחלציחה, ומשם ב-Sh1 מערבה, דרך אדיגני,
    ועד המעבר: כ-300 ק"מ ובאופן ריאלי שש שעות וחצי. ממערב לאדיגני הדרך מתדרדרת; כ-50 הקילומטרים האחרונים
    צרים, לרוב לא סלולים ומלאים בעיקולים חדים, וניתן לעבור בהם רק בחודשים ללא שלג. סעו ברכב 4X4, או לפחות
    ברכב עם גחון גבוה. תדלקו באחלציחה. המסלול החלופי עובר דרך בטומי וחולו, כ-480 ק"מ בסך הכול; מרחק האתר
    מבטומי הוא 109 ק"מ, עד שלוש שעות בקיץ.
ar:
  name: ممر غودردزي والغابة المتحجّرة
  short: >-
    سرج على ارتفاع 2,025 مترًا بين أدجارا الرطبة المطلة على البحر وسامتسخه الجافة، حيث تحجّرت على المنحدر
    الشرقي غابة من النخيل والغار.
  body: >-
    **أسفل السرج البالغ ارتفاعه 2,025 مترًا، تحت آخر بقايا ثلوج الربيع وأكواخ الصيف، تكمن غابة من النخيل
    والغار والماغنوليا، تحجّرت زمنًا طويلاً قبل أن يكون هناك بشر يرونها.**


    غودردزي هو السرج في سلسلة أرسياني حيث تنتهي أدجارا وتبدأ سامتسخه. يعبره طريق Sh1 من باتومي إلى أخالتسيخه،
    وهو الطريق الوحيد بين وادي أدجاريستسكالي الرطب والمرتفعات المحيطة بأديغيني. على المنحدر الغربي يأتي
    الطقس من البحر الأسود؛ وشرقًا تنفتح المنحدرات ويصبح الضوء أكثر جفافًا.


    الممر مبني من صخور بركانية، وهذه الصخور تحتفظ بسجل. منذ ملايين السنين، دفنت الثورانات وتيارات الطين
    المحمّلة بالرماد غابة دافئة مختلطة: أشجارًا دائمة الخضرة كالنخيل والكافور والغار والماغنوليا، إلى
    جانب التين والقيقب والسنديان والزان الأبيض. تحوّل الخشب إلى أوبال وكوارتز وكلسيدون. ما تزال بعض الجذوع
    واقفة، وحلقات نموّها سليمة. يكتب العلماء عن "فلورا غودردزي" منذ ثمانينيات القرن التاسع عشر، واليوم
    تُحمى 365 هكتارًا منه بصفتها معلمًا طبيعيًا. ابحثوا عن الغابة المتحجّرة على المنحدر الشرقي، في وادي
    دزيندزيستسكالي، على ارتفاع يتراوح بين 1,600 و2,100 متر تقريبًا: جانب أديغيني، لا جانب خولو.


    قمة الممر أحدث بكثير. بُني منتجع للتزلج هنا بين عامي 2012 و2015؛ تصل مصاعده إلى نحو 2,350 مترًا، وفي
    شتاء عادي يبلغ عمق الثلج ثلاثة إلى أربعة أمتار. في الصيف، تستقبل الأكواخ، وبيوت الضيافة في دانيسبراولي
    على بعد ثلاثة كيلومترات، مشّائين بدل المتزلجين، وتخضرّ المروج شبه الألبية حول الأكواخ المتناثرة.


    غودردزي حدّ رسمه الطقس نفسه: خلفكم ضباب البحر، وأمامكم أول ضوء جافّ من الداخل.
  tip: >-
    خصّصوا ثلاث ساعات للممر ومنحدر المتحجرات. العبور موثوق تقريبًا من يونيو إلى سبتمبر؛ وفي الشتاء يُوصَل
    إلى المنتجع من جهة خولو، أما النزول نحو أديغيني فلا يمكن الاعتماد عليه، فاستفسروا من السكان المحليين
    قبل أن تقرروا. قد تبقى الثلوج على جانب الطريق حتى يونيو، وتكون قمة الممر باردة وعاصفة حتى في يوليو:
    خذوا معكم طبقة دافئة. الطعام والمراحيض متوفران في المنتجع وفي دانيسبراولي؛ لا وقود في الممر. يمكن
    للضباب أن يمحو الرؤية في دقائق، فاستخدموا الأنوار ولا تتجاوزوا أي سيارة. المتحجرات محمية: صوّروها،
    لكن لا تأخذوها معكم.
  route: >-
    من تبليسي خذوا S1 غربًا إلى خاشوري، ثم S8 عبر وادي بورجومي إلى أخالتسيخه، ثم Sh1 غربًا، عبر أديغيني،
    وصولًا إلى قمة الممر: نحو 300 كم وستّ ساعات ونصف بشكل واقعي. غرب أديغيني تتدهور حالة الطريق؛ فالكيلومترات
    الخمسون الأخيرة تقريبًا ضيقة، وغير مُعبّدة في معظمها، ومليئة بمنحنيات حادة، ولا يمكن عبورها إلا في
    الأشهر الخالية من الثلوج. استعملوا سيارة دفع رباعي، أو على الأقل سيارة ذات ارتفاع عالٍ عن الأرض. عبّئوا
    الوقود في أخالتسيخه. يمر الطريق البديل عبر باتومي وخولو، بمجموع نحو 480 كم؛ والمسافة من باتومي إلى
    المنتجع 109 كم، حتى ثلاث ساعات في الصيف.
