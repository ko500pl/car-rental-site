ka:
  name: გოდერძის უღელტეხილი და ნამარხი ტყე
  short: 2025 მეტრზე მდებარე უღელტეხილი, რომელიც აჭარას სამცხეს უკავშირებს, გვერდით კი მილიონწლოვანი ნამარხი
    ტყეა.
  body: >-
    **გოდერძი ის ადგილია, სადაც აჭარა მთავრდება და საქართველოს შიდა მხარე იწყება.** უღელტეხილი 2025 მეტრზეა
    და ხულოს (დასავლეთით) და ადიგენს (აღმოსავლეთით) აკავშირებს. კლიმატი ზუსტად აქ იტეხება: დასავლეთ მხარეს
    ნისლი, წვიმა და მუქი ტყეა, აღმოსავლეთით კი მშრალი, ღია ფერდობები და ბევრად მეტი მზე.

    გეოლოგიურად ეს ადგილი განსაკუთრებულია. უღელტეხილის მიდამოებში **ნამარხი ტყე** გვხვდება — მიოცენური
    ხანის, დაახლოებით რვა-ათი მილიონი წლის წინანდელი ხის ნაშთები, რომლებიც ვულკანურმა ფერფლმა დაფარა და
    გაქვავებულ ხე-ტანებად შემოგვინახა. ზოგი ნატეხი გზის პირასაა, ზოგი კი ფერდობის ეროზირებულ ჭრილებში.
    ეს არაა მოწესრიგებული, ღობით შემოსაზღვრული ძეგლი — ის უბრალოდ იქაა, და ადგილობრივები გაჩვენებენ.

    გზაზე რასაც ნახავ:

    - **ალპური მდელოები** ივნისიდან აგვისტომდე, სავსე ყვავილით — ეს ის საძოვრებია, სადაც ზაფხულობით პირუტყვს
    ერეკებიან

    - **გოდერძის სათხილამურო კურორტი** უღელტეხილთან ახლოს, მოკრძალებული, რამდენიმე ტრასით

    - სოფლები ხის სახლებით, რომლებიც მხოლოდ ზაფხულში ცოცხლდება

    გზა უღელტეხილზე ზამთარში იკეტება — ჩვეულებრივ ნოემბრიდან მაისამდე, ზუსტი თარიღი წელიწადზეა დამოკიდებული.
    ზაფხულშიც ეს არაა მარტივი მარშრუტი: მონაკვეთები ხრეშიანია, სერპანტინი მკვეთრი და ნისლი ხშირად ხილვადობას
    ორმოც მეტრამდე ამცირებს.
  tip: >-
    სამი საათი უღელტეხილზე და ნამარხი ტყის მიდამოებში. ივნისამდე თოვლი დევს, ოქტომბრის ბოლოს კი უკვე შეიძლება
    მოვიდეს — ამინდი წინასწარ შეამოწმე. მაღლა ცივა და ქარია ზაფხულშიც: ქურთუკი აუცილებელია. ტუალეტი და
    კაფე მხოლოდ კურორტთან და ბეშუმშია. ბენზინი ხულოსა და ადიგენში აიღე, უღელტეხილზე არაფერია. ნისლში ნელა
    იარე, გამოსწრება არ ღირს.
  route: >-
    ყველაზე მოკლე გზა თბილისიდან სამხრეთით ხაშურზე და ახალციხეზე გადის, შემდეგ ადიგენზე და მთაში ზემოთ
    — ჯამში 300 კმ, დაახლოებით ექვსნახევარი საათი. ბოლო ორმოცდაათი კილომეტრი ხრეშია, ვიწრო, სერპანტინიანი
    და მხოლოდ ზაფხულში გასავლელი; ჯიპი ან მაღალი კლირენსი აუცილებელია. ალტერნატივა ბათუმის მხრიდანაა —
    ხეობით ხულომდე და ზემოთ, დაახლოებით 480 კმ. საწვავი ახალციხესა და ადიგენში აიღე.
en:
  name: Goderdzi Pass and the Petrified Forest
  short: A 2,025-metre pass linking Adjara to Samtskhe, with a fossil forest of trees millions of years
    old beside it.
  body: >-
    **Goderdzi is where Adjara ends and inland Georgia begins.** The pass stands at 2,025 metres and connects
    Khulo to the west with Adigeni to the east. The climate breaks exactly here: fog, rain and dark forest
    on the western side, dry open slopes and far more sun on the eastern.

    Geologically the place is unusual. Around the pass lies a **petrified forest** — Miocene wood roughly
    eight to ten million years old, buried by volcanic ash and preserved as stone trunks. Some pieces
    sit beside the road, others show in eroded cuts on the slopes. This is not a fenced, labelled monument.
    It is simply there, and local people will point it out.

    What you will see on the way:

    - **Alpine meadows** from June to August, thick with flowers — these are the summer pastures that
    cattle are driven up to

    - The modest **Goderdzi ski resort** near the pass, with a handful of pistes

    - Villages of wooden houses that come alive only in summer

    The road over the pass closes in winter, usually from November to May, though the exact dates vary
    year to year. Even in summer this is not an easy route: sections are gravel, the hairpins are tight,
    and fog regularly reduces visibility to forty metres. Drive it in the morning, when the cloud has
    not yet built, and treat any estimate of driving time as optimistic.
  tip: >-
    Three hours covers the pass and the fossil wood area. Snow lies into June and can return by late October,
    so check the forecast before committing. It is cold and windy at the top even in midsummer — a jacket
    is not optional. Toilets and cafes exist only at the resort and at Beshumi. Refuel at Khulo or Adigeni;
    there is nothing on the pass. In fog drive slowly and do not overtake.
  route: >-
    The shortest route from Tbilisi runs south-west via Khashuri to Akhaltsikhe, then Adigeni and up into
    the mountains — 300 km in total, about six and a half hours. The last fifty kilometres are gravel,
    narrow, full of hairpins and passable only in summer; a high-clearance vehicle or a four-wheel drive
    is necessary. The alternative approach is from Batumi, up the valley through Khulo, roughly 480 km.
    Take fuel at Akhaltsikhe and Adigeni.
ru:
  name: Перевал Годердзи и окаменелый лес
  short: Перевал на 2025 метрах, соединяющий Аджарию с Самцхе, а рядом окаменелый лес возрастом в миллионы
    лет.
  body: >-
    **Годердзи — там, где заканчивается Аджария и начинается внутренняя Грузия.** Перевал лежит на 2025
    метрах и соединяет Хуло на западе с Адигени на востоке. Климат ломается ровно здесь: с западной стороны
    туман, дождь и тёмный лес, с восточной — сухие открытые склоны и куда больше солнца.

    Геологически это место необычное. Вокруг перевала лежит **окаменелый лес** — миоценовая древесина
    возрастом примерно восемь-десять миллионов лет, засыпанная вулканическим пеплом и сохранившаяся каменными
    стволами. Часть обломков лежит у дороги, часть выходит в размывах на склонах. Это не огороженный памятник
    с табличкой: он просто есть, и местные его показывают.

    Что увидите по дороге:

    - **Альпийские луга** с июня по август, густо цветущие: это летние пастбища, куда поднимают скот

    - Скромный **горнолыжный курорт Годердзи** у перевала, с несколькими трассами

    - Деревни деревянных домов, оживающие только летом

    Дорога через перевал зимой закрыта — обычно с ноября по май, точные даты меняются от года к году.
    Даже летом маршрут не из лёгких: участки гравийные, серпантин тугой, а туман регулярно снижает видимость
    до сорока метров. Ехать лучше утром, пока облако не поднялось, а любую оценку времени в пути считайте
    оптимистичной.
  tip: >-
    Три часа на перевал и окрестности с окаменелой древесиной. Снег лежит до июня и может вернуться к
    концу октября, так что смотрите прогноз заранее. Наверху холодно и ветрено даже в разгар лета: куртка
    не обсуждается. Туалеты и кафе есть только у курорта и в Бешуми. Заправляйтесь в Хуло или Адигени,
    на перевале нет ничего. В тумане езжайте медленно и не обгоняйте.
  route: >-
    Кратчайший путь из Тбилиси идёт на юго-запад через Хашури на Ахалцихе, затем Адигени и вверх в горы
    — всего 300 км, около шести с половиной часов. Последние пятьдесят километров гравийные, узкие, со
    сплошными шпильками и проезжие только летом; нужен высокий клиренс или полный привод. Альтернатива
    — со стороны Батуми, вверх по ущелью через Хуло, примерно 480 км. Заправляйтесь в Ахалцихе и Адигени.
fa:
  name: گردنهٔ گودردزی و جنگل سنگ‌شده
  short: گردنه‌ای در ۲۰۲۵ متری که آجارا را به سامتسخه می‌پیوندد، و کنارش جنگلی سنگ‌شده به قدمت میلیون‌ها
    سال.
  body: >-
    **گودردزی جایی است که آجارا پایان می‌یابد و گرجستان درونی آغاز می‌شود.** گردنه در ۲۰۲۵ متری است و
    خولو در غرب را به آدیگنی در شرق می‌پیوندد. آب‌وهوا دقیقاً همین‌جا می‌شکند: در سوی غربی مه و باران
    و جنگل تیره، و در سوی شرقی دامنه‌های خشک و باز و آفتاب بسیار بیشتر.

    از نظر زمین‌شناسی این جا کم‌نظیر است. پیرامون گردنه **جنگلی سنگ‌شده** خفته است؛ چوب دورهٔ میوسن به
    قدمت حدود هشت تا ده میلیون سال که خاکستر آتشفشانی آن را پوشاند و به تنه‌های سنگی بدل کرد. برخی تکه‌ها
    کنار جاده‌اند و برخی در بریدگی‌های فرسایشی دامنه پیدا می‌شوند. این بنای محصور و برچسب‌دار نیست؛ همان‌جاست
    و مردم محلی نشانتان می‌دهند.

    آنچه در راه می‌بینید:

    - **چمنزارهای کوهستانی** از خرداد تا شهریور، انبوه از گل — همان چراگاه‌های تابستانی که دام را به آن‌ها
    می‌برند

    - **پیست اسکی گودردزی** نزدیک گردنه، ساده و با چند مسیر

    - روستاهایی از خانه‌های چوبی که تنها در تابستان جان می‌گیرند

    جادهٔ گردنه در زمستان بسته است، معمولاً از آبان تا اردیبهشت، هرچند تاریخ‌ها سال‌به‌سال فرق می‌کند.
    حتی در تابستان هم مسیر آسانی نیست: بخش‌هایی شنی است، پیچ‌ها تنگ‌اند و مه مرتب دید را به چهل متر می‌رساند.
    صبح برانید، پیش از آنکه ابر بالا بیاید.
  tip: >-
    سه ساعت برای گردنه و محدودهٔ چوب سنگ‌شده کافی است. برف تا خرداد می‌ماند و از اواخر مهر بازمی‌گردد،
    پس پیش‌بینی هوا را ببینید. بالا حتی وسط تابستان سرد و بادخیز است؛ کاپشن انتخابی نیست. سرویس بهداشتی
    و کافه تنها نزد پیست و در بشومی هست. در خولو یا آدیگنی سوخت بگیرید؛ روی گردنه هیچ نیست. در مه آهسته
    برانید و سبقت نگیرید.
  route: >-
    کوتاه‌ترین راه از تفلیس به جنوب غربی از خاشوری به آخالتسیخه می‌رود، سپس آدیگنی و بالا به کوهستان —
    روی‌هم ۳۰۰ کیلومتر، حدود شش ساعت و نیم. پنجاه کیلومتر آخر شنی و باریک و پر از پیچ تند است و تنها در
    تابستان قابل عبور؛ خودروی بلند یا دیفرانسیل چهار چرخ لازم است. راه جایگزین از سمت باتومی است، بالا
    در دره از خولو، حدود ۴۸۰ کیلومتر. سوخت را در آخالتسیخه و آدیگنی بگیرید.
he:
  name: מעבר גודרדזי והיער המאובן
  short: מעבר בגובה 2,025 מטר המחבר את אג׳ריה לסמצחה, ולצדו יער מאובן בן מיליוני שנים.
  body: >-
    **גודרדזי הוא המקום שבו נגמרת אג׳ריה ומתחילה גאורגיה הפנימית.** המעבר עומד בגובה 2,025 מטר ומחבר את
    חולו במערב עם אדיגני במזרח. האקלים נשבר בדיוק כאן: ערפל, גשם ויער כהה בצד המערבי, מדרונות יבשים ופתוחים
    והרבה יותר שמש במזרחי.

    מבחינה גיאולוגית זהו מקום חריג. סביב המעבר שוכן **יער מאובן** — עץ מתקופת המיוקן, בן כשמונה עד עשרה
    מיליון שנה, שנקבר תחת אפר וולקני ונשמר כגזעי אבן. חלק מן השברים מונחים לצד הכביש, אחרים נחשפים בחתכי
    סחף במדרונות. זה אינו אתר מגודר עם שילוט: הוא פשוט שם, והמקומיים יצביעו עליו.

    מה תראו בדרך:

    - **אחו אלפיני** מיוני עד אוגוסט, עמוס פרחים — אלה מרעה הקיץ שאליו מעלים את הבקר

    - **אתר הסקי הצנוע של גודרדזי** ליד המעבר, עם קומץ מסלולים

    - כפרים של בתי עץ הקמים לתחייה רק בקיץ

    הכביש מעל המעבר נסגר בחורף, בדרך כלל מנובמבר עד מאי, אם כי התאריכים משתנים משנה לשנה. גם בקיץ זה אינו
    מסלול קל: קטעים בחצץ, הסיבובים חדים, והערפל מוריד את הראות לארבעים מטר. סעו בבוקר, לפני שהענן מתרומם.
  tip: >-
    שלוש שעות מכסות את המעבר ואת אזור העץ המאובן. שלג נשאר עד יוני ועשוי לחזור בסוף אוקטובר, אז בדקו תחזית
    מראש. למעלה קר ורוחני גם באמצע הקיץ — מעיל אינו בגדר בחירה. שירותים ובתי קפה יש רק באתר הסקי ובבשומי.
    תדלקו בחולו או באדיגני; במעבר אין דבר. בערפל סעו לאט ואל תעקפו.
  route: >-
    הדרך הקצרה מטביליסי יורדת דרום-מערבה דרך חשורי לאחלציחה, ואז אדיגני ומעלה אל ההרים — 300 ק״מ בסך הכול,
    כשש שעות וחצי. חמישים הקילומטרים האחרונים בחצץ, צרים, מלאי סיבובי סיכה ועבירים רק בקיץ; דרוש רכב גבוה
    או הנעה כפולה. הגישה החלופית היא מצד באטומי, במעלה העמק דרך חולו, כ-480 ק״מ. תדלקו באחלציחה ובאדיגני.
ar:
  name: ممر غودردزي والغابة المتحجرة
  short: ممر على ارتفاع 2025 متراً يصل أجاريا بسامتسخه، وإلى جانبه غابة متحجرة عمرها ملايين السنين.
  body: >-
    **غودردزي هو حيث تنتهي أجاريا وتبدأ جورجيا الداخلية.** يقوم الممر على 2025 متراً ويصل خولو غرباً بأديغيني
    شرقاً. والمناخ ينكسر هنا بالضبط: ضباب ومطر وغابة داكنة في الجانب الغربي، ومنحدرات جافة مكشوفة وشمس
    أوفر في الشرقي.

    وجيولوجياً هذا مكان غير عادي. حول الممر تمتد **غابة متحجرة**: خشب من عصر الميوسين عمره نحو ثمانية
    إلى عشرة ملايين سنة، دفنه الرماد البركاني فحُفظ جذوعاً حجرية. بعض القطع على جانب الطريق وبعضها يظهر
    في شقوق الانجراف على المنحدرات. وهذا ليس معلماً مسيّجاً بلافتات؛ إنه هناك ببساطة، وأهل المكان يدلونك
    عليه.

    ما ستراه في الطريق:

    - **مروج جبلية** من يونيو إلى أغسطس، كثيفة الزهر — وهي مراعي الصيف التي تُساق إليها الماشية

    - **منتجع غودردزي للتزلج** المتواضع قرب الممر، بحفنة مسارات

    - قرى من بيوت خشبية لا تدب فيها الحياة إلا صيفاً

    يُغلق الطريق فوق الممر شتاءً، عادة من نوفمبر إلى مايو، وإن اختلفت المواعيد من سنة لأخرى. وحتى في الصيف
    ليس مساراً سهلاً: مقاطع حصوية ومنعطفات ضيقة وضباب يخفض الرؤية إلى أربعين متراً. قُد صباحاً قبل أن
    يرتفع الغيم.
  tip: >-
    ثلاث ساعات تغطي الممر ومنطقة الخشب المتحجر. الثلج يبقى حتى يونيو وقد يعود أواخر أكتوبر، فراجع النشرة
    الجوية مسبقاً. في الأعلى برد وريح حتى في عز الصيف؛ والسترة ليست خياراً. دورات المياه والمقاهي عند
    المنتجع وفي بيشومي فقط. تزود بالوقود في خولو أو أديغيني؛ لا شيء على الممر. وفي الضباب قُد ببطء ولا
    تتجاوز.
  route: >-
    أقصر طريق من تبليسي يتجه جنوباً غرباً عبر خاشوري إلى أخالتسيخه، ثم أديغيني وصعوداً إلى الجبال — 300
    كم إجمالاً، نحو ست ساعات ونصف. آخر خمسين كيلومتراً حصوية ضيقة كثيرة المنعطفات ولا تُعبر إلا صيفاً؛
    وتلزم سيارة مرتفعة أو دفع رباعي. والطريق البديل من جهة باتومي صعوداً في الوادي عبر خولو، نحو 480 كم.
    تزود بالوقود في أخالتسيخه وأديغيني.
