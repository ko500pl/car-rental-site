ka:
  name: თბილისის სახელმწიფო ცირკი
  short: >-
    გმირთა მოედნის თავზე, 1939 წლის სტალინური როტონდა — ორიათასადგილიანი ცირკი, რომელიც 1990-იან წლებში
    მიტოვებული იყო და 2011 წლიდან კვლავ მუშაობს.
  body: >-
    **გმირთა მოედნის თავზე აღმართულ ბორცვს ოდესღაც თუჯის ჯვარი ამშვენებდა, იმპერატორის გადარჩენის ნიშნად
    დადგმული; 1939 წლიდან კი აქ გუმბათიანი როტონდა დგას, სადაც ორი ათასი მაყურებელი ერთდროულად იკავებს
    სუნთქვას.**


    თბილისის ცირკის ისტორია 1888 წელს, რუსეთის იმპერიის დროს იწყება. პირველი შენობა 1911 წელს ხანძარმა
    შთანთქა და დასი დროებით ყოფილ ღვინის ქარხანაში გადაბარგდა, ვიდრე 1939 წელს ახალი დარბაზი არ გაიხსნა
    — სტალინური ეპოქის ნეოკლასიკური როტონდა, არქიტექტორების ნიკოლაი ნეპრინცევის, ვლადიმერ ურუშაძისა და
    სტეფანე სატუნცის პროექტით. ორიათასადგილიანი თბილისის ცირკი მოსკოვის, კიევისა და ბაქოს ცირკებთან ერთად
    საბჭოთა კავშირის უდიდეს ცირკებს შორის მოიაზრებოდა.


    ადგილსაც თავისი ამბავი აქვს. აქ ვერის უბნის კიდე იყო, სადაც იმპერიის დროს საქართველოს სამხედრო გზა
    ქალაქში შემოდიოდა. 1847 წელს ბორცვზე თუჯის ჯვარი — ე. წ. ვერის ჯვარი — აღმართეს იმის აღსანიშნავად,
    რომ ნიკოლოზ I 1837 წლის კავკასიური მოგზაურობისას საგზაო შემთხვევას გადაურჩა. 1930-იან წლებში, ლავრენტი
    ბერიას მმართველობისას, ჯვარი დაანგრიეს, ირგვლივ კი გმირთა მოედანი მოაწყვეს.


    შემდეგ მძიმე წლები დადგა. საბჭოთა კავშირის დაშლის შემდეგ შენობა ნელ-ნელა იშლებოდა, მიდამოებმა კი ღამით
    ცუდი სახელი გაითქვა. 2003 წელს ცირკი ბიზნესმენმა ბადრი პატარკაციშვილმა შეიძინა და მისი აღდგენა დაიწყო,
    თუმცა 2007 წლის პოლიტიკურ კრიზისში მისმა მონაწილეობამ და მალევე მოსულმა სიკვდილმა საქმე შეაფერხა.
    ცირკის კარი მაყურებელს 2011 წელს მისმა დამ, მზია თორთლაძემ გაუღო.


    ქვემოდან, გმირთა მოედნის მანქანების მორევიდან, როტონდა და მისი გუმბათი დღესაც მთელ მიდამოს დაჰყურებს.
    ჯვარი იმპერატორისთვის, მანეჟი საბჭოთა აკრობატებისთვის, ნანგრევი, გადარჩენა — თბილისში იშვიათია ადგილი,
    რომელსაც ამდენჯერ შეეცვალა აზრი ისე, რომ ერთი მტკაველითაც არ დაძრულა.
  tip: >-
    ბილეთი კონკრეტულ წარმოდგენაზე წინასწარ შეიძინეთ — ცირკის ოფიციალურ საიტზე (circus.ge) ან სალაროში;
    ფასი პროგრამისა და სეზონის მიხედვით იცვლება და ფიქსირებული სახით გამოქვეყნებული არ არის. წარმოდგენა
    შესვენებით დაახლოებით ორ-ორნახევარ საათს გრძელდება; ყველაზე ხალხმრავალი საახალწლო პროგრამებია. მაყურებელთა
    ცნობით, პროგრამაში გაწვრთნილი ცხოველებიც — ცხენები, კატები, ძაღლები — ყოფილა; თუ ეს თქვენთვის მნიშვნელოვანია,
    მიმდინარე აფიშა გადაამოწმეთ. შენობის გარედან დათვალიერება და გადაღება ნებისმიერ დროს, ბილეთის გარეშეც
    შეიძლება. წარმოდგენის საღამოს გმირთა მოედნის მიდამოებში პარკირება ჭირს — ნახევარი საათით ადრე მიდით
    ან ტაქსით იმგზავრეთ.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 5 კმ და 15 წუთია ჩვეულებრივი ქალაქის ქუჩებით. პუშკინის ქუჩითა და
    ბარათაშვილის გამზირით ჩადით მარჯვენა სანაპიროზე და ზვიად გამსახურდიას სანაპიროთი ჩრდილოეთით თითქმის
    3 კმ იარეთ გმირთა მოედნამდე. იქიდან თამარ მეფის გამზირზე გადადით და მარჯვნივ, ცირკის აღმართზე აუხვიეთ
    — ის პირდაპირ შენობამდე ამოგიყვანთ. ნებისმიერი ეკონომ-კლასის მანქანა გამოდგება; მთავარი სირთულე გმირთა
    მოედნის მრავალზოლიანი, დატვირთული კვანძია, ამიტომ საჭირო ზოლი დროულად დაიკავეთ. გაითვალისწინეთ: ზოგი
    წყაროს მიუხედავად, გმირთა მოედანზე მეტროს სადგური არ არის — უმანქანოდ ყველაზე მარტივი ტაქსია.
en:
  name: Tbilisi State Circus
  short: >-
    A 1939 Stalin-era rotunda on the hill above Heroes' Square: Tbilisi's 2,000-seat circus, left to decay
    in the 1990s and back in business since 2011.
  body: >-
    **The hill above Heroes' Square once carried a cast-iron cross raised for a tsar's lucky escape; since
    1939 it has carried a domed rotunda where two thousand people at a time hold their breath.**


    Tbilisi's circus story begins in 1888, when the city belonged to the Russian Empire. The first circus
    building burnt down in 1911, and the troupes decamped to a former wine factory until the present hall
    opened in 1939: a Stalin-era Neoclassical rotunda by Nikolay Neprintsev, Vladimer Urushadze and Stepan
    Satunts. With 2,000 seats it ranked among the largest circuses in the Soviet Union, alongside those
    of Moscow, Kyiv and Baku.


    The ground has a story of its own. This was the edge of the Vera quarter, where the Georgian Military
    Road entered the city in imperial times, and in 1847 a cast-iron cross — the Vera Cross — was raised
    here to mark Emperor Nicholas I's survival of a road accident on his Caucasus journey of 1837. In
    the 1930s, under Lavrenti Beria, the cross came down and the area around it was remodelled as Heroes'
    Square.


    Then came the lean years. After the Soviet collapse the building decayed and its surroundings earned
    a grim after-dark reputation. In 2003 the tycoon Badri Patarkatsishvili bought the circus and began
    rebuilding it; his part in the 2007 political crisis and his death soon afterwards stalled the work,
    and it was his sister, Mzia Tortladze, who finally reopened the doors in 2011.


    Seen from the traffic swirling round Heroes' Square below, the drum and dome still preside over the
    whole district. A cross for a tsar, a ring for Soviet acrobats, a ruin, a rescue: few spots in Tbilisi
    have changed their meaning so often without moving an inch.
  tip: >-
    Buy tickets for a specific show in advance, through the circus's own website (circus.ge) or at the
    box office; prices change with the programme and season and are not published as a fixed list. Allow
    two to two and a half hours including an interval; New Year shows are the busiest. Visitors report
    that programmes have included trained animals — horses, cats, dogs — so check the current bill if
    that matters to you. The building can be seen and photographed from outside at any hour without a
    ticket. On show nights parking around Heroes' Square is tight: arrive half an hour early or come by
    taxi.
  route: >-
    About 5 km and 15 minutes from Freedom Square on ordinary city streets. Drop down Pushkin Street and
    Baratashvili Avenue to the right-bank embankment, then follow Zviad Gamsakhurdia Embankment north
    for nearly 3 km to Heroes' Square. Bear onto Tamar Mepe Avenue and turn right up Tsirkis Aghmarti
    (Circus Rise), which climbs straight to the building. Any economy car will do; the real test is the
    busy multi-lane interchange at Heroes' Square, so pick your lane early. Note that, despite some listings,
    there is no metro station at Heroes' Square — without a car, a taxi is simplest.
ru:
  name: Тбилисский государственный цирк
  short: >-
    Сталинская ротонда 1939 года на холме над площадью Героев: цирк на 2000 мест, заброшенный в 1990-е
    и снова работающий с 2011 года.
  body: >-
    **Холм над площадью Героев когда-то нёс чугунный крест, воздвигнутый в честь чудесного спасения царя;
    с 1939 года на нём стоит купольная ротонда, где две тысячи человек разом затаивают дыхание.**


    История тбилисского цирка начинается в 1888 году, когда город принадлежал Российской империи. Первое
    здание цирка сгорело в 1911 году, и труппы перебрались в здание бывшего винного завода, пока в 1939
    году не открылся нынешний зал — сталинская неоклассическая ротонда по проекту Николая Непринцева,
    Владимера Урушадзе и Степана Сатунца. Рассчитанный на 2000 зрителей, он входил в число крупнейших
    цирков Советского Союза наряду с московским, киевским и бакинским.


    У этого места — своя история. Здесь была окраина района Вере, где в имперские времена в город входила
    Военно-Грузинская дорога, и в 1847 году тут поставили чугунный крест — Верийский крест — в память
    о том, что император Николай I уцелел в дорожной аварии во время своего кавказского путешествия 1837
    года. В 1930-х, при Лаврентии Берии, крест снесли, а окрестности перестроили в площадь Героев.


    Потом настали трудные годы. После распада СССР здание ветшало, а его окрестности приобрели дурную
    славу после наступления темноты. В 2003 году магнат Бадри Патаркацишвили купил цирк и начал его восстанавливать;
    его роль в политическом кризисе 2007 года и смерть вскоре после этого остановили работы, и лишь его
    сестра Мзия Тортладзе в 2011 году вновь открыла двери.


    Если смотреть снизу, из водоворота машин на площади Героев, барабан и купол по-прежнему царят над
    всем районом. Крест для царя, манеж для советских акробатов, руина, спасение: немногие места в Тбилиси
    так часто меняли смысл, не сдвинувшись ни на шаг.
  tip: >-
    Билеты на конкретное представление покупайте заранее — на сайте цирка (circus.ge) или в кассе; цены
    меняются вместе с программой и сезоном и не публикуются единым прейскурантом. Закладывайте два — два
    с половиной часа с антрактом; больше всего зрителей на новогодних представлениях. По отзывам посетителей,
    в программах бывали дрессированные животные — лошади, кошки, собаки, — так что, если это для вас важно,
    проверьте текущую афишу. Здание можно осмотреть и сфотографировать снаружи в любое время и без билета.
    В дни представлений с парковкой у площади Героев туго: приезжайте за полчаса или берите такси.
  route: >-
    Около 5 км и 15 минут от площади Свободы по обычным городским улицам. Спуститесь по улице Пушкина
    и проспекту Бараташвили к правобережной набережной, затем почти 3 км следуйте по набережной Звиада
    Гамсахурдия на север до площади Героев. Уйдите на проспект Тамар Мепе и сверните направо на Циркис
    Агмарти (Цирковой подъём), который ведёт прямо к зданию. Подойдёт любая машина эконом-класса; настоящее
    испытание — оживлённая многополосная развязка на площади Героев, так что занимайте ряд заранее. Учтите:
    вопреки некоторым справочникам, станции метро на площади Героев нет — без машины проще всего взять
    такси.
fa:
  name: سیرک دولتی تفلیس
  short: >-
    روتوندایی استالینی از سال ۱۹۳۹ بر تپه بالای میدان قهرمانان: سیرک ۲۰۰۰ نفری تفلیس که در دهه ۱۹۹۰ رو
    به ویرانی رفت و از ۲۰۱۱ دوباره برپاست.
  body: >-
    **تپه بالای میدان قهرمانان روزگاری صلیبی چدنی بر دوش داشت که به شکرانه جان به در بردن یک تزار برافراشته
    شده بود؛ از ۱۹۳۹ روتوندایی گنبددار بر آن ایستاده که در آن دو هزار نفر یک‌جا نفس در سینه حبس می‌کنند.**


    داستان سیرک تفلیس در ۱۸۸۸ آغاز می‌شود، هنگامی که شهر از آنِ امپراتوری روسیه بود. نخستین ساختمان سیرک
    در ۱۹۱۱ سوخت و گروه‌های نمایش به یک کارخانه شراب‌سازی سابق کوچ کردند، تا آن‌که در ۱۹۳۹ تالار کنونی
    گشوده شد: روتوندایی نوکلاسیک از دوران استالین، اثر نیکلای نپرینتسف، ولادیمر اوروشادزه و استپان ساتونتس.
    این سیرک با ۲۰۰۰ صندلی در شمار بزرگ‌ترین سیرک‌های اتحاد شوروی بود، در کنار سیرک‌های مسکو، کی‌یف و
    باکو.


    خودِ زمین هم داستانی دارد. این‌جا لبه محله وِرا بود، جایی که در دوران امپراتوری جاده نظامی گرجستان
    به شهر می‌رسید، و در ۱۸۴۷ صلیبی چدنی — صلیب ورا — این‌جا برافراشتند تا جان به در بردن امپراتور نیکلای
    یکم از یک سانحه جاده‌ای را در سفر قفقازش به سال ۱۸۳۷ گرامی بدارند. در دهه ۱۹۳۰، در دوران لاورنتی بریا،
    صلیب برچیده شد و پیرامونش به میدان قهرمانان بدل شد.


    سپس سال‌های تنگ‌دستی رسید. پس از فروپاشی شوروی ساختمان فرسوده شد و اطرافش پس از تاریکی شهرتی شوم یافت.
    در ۲۰۰۳ سرمایه‌دار بزرگ، بدری پاتارکاتسیشویلی، سیرک را خرید و بازسازی‌اش را آغاز کرد؛ نقش او در بحران
    سیاسی ۲۰۰۷ و مرگش اندکی بعد، کار را متوقف کرد، و سرانجام خواهرش، مزیا تورتلادزه، بود که در ۲۰۱۱ درها
    را دوباره گشود.


    از میان ترافیکی که در پایین، در میدان قهرمانان، می‌چرخد، استوانه و گنبد ساختمان هنوز بر سراسر محله
    فرمان می‌رانند. صلیبی برای یک تزار، صحنه‌ای گرد برای آکروبات‌های شوروی، ویرانه‌ای، نجاتی: کمتر جایی
    در تفلیس این‌قدر معنایش را عوض کرده بی‌آن‌که یک وجب جابه‌جا شود.
  tip: >-
    بلیت یک اجرای مشخص را از پیش بخرید، از وب‌سایت خود سیرک (circus.ge) یا از باجه بلیت‌فروشی؛ قیمت‌ها
    با برنامه و فصل تغییر می‌کنند و فهرست ثابتی از آن‌ها منتشر نمی‌شود. با احتساب میان‌پرده دو تا دو ساعت
    و نیم وقت بگذارید؛ اجراهای سال نو شلوغ‌ترین‌اند. به گفته بازدیدکنندگان، در برنامه‌ها حیوانات تربیت‌شده
    — اسب، گربه، سگ — هم بوده‌اند، پس اگر این موضوع برایتان مهم است، برنامه جاری را بررسی کنید. ساختمان
    را در هر ساعتی و بی‌بلیت می‌توان از بیرون دید و از آن عکس گرفت. در شب‌های اجرا جای پارک در اطراف میدان
    قهرمانان تنگ است: نیم ساعت زودتر برسید یا با تاکسی بیایید.
  route: >-
    حدود ۵ کیلومتر و ۱۵ دقیقه از میدان آزادی، از خیابان‌های معمولی شهر. از خیابان پوشکین و بلوار باراتاشویلی
    به خیابان ساحلی کرانه راست سرازیر شوید، سپس نزدیک ۳ کیلومتر در امتداد خیابان ساحلی زویاد گامساخوردیا
    به‌سوی شمال تا میدان قهرمانان بروید. به بلوار تامار مپه بروید و به راست، به تسیرکیس آغمارتی (سربالایی
    سیرک) بپیچید که مستقیم تا ساختمان بالا می‌رود. هر خودروی سواری معمولی کافی است؛ آزمون واقعی تقاطع
    شلوغ و چندبانده میدان قهرمانان است، پس زود در باند درست قرار بگیرید. توجه کنید که برخلاف برخی فهرست‌ها،
    در میدان قهرمانان ایستگاه مترو وجود ندارد — بی‌خودرو، تاکسی ساده‌ترین راه است.
he:
  name: הקרקס הממלכתי של טביליסי
  short: >-
    רוטונדה מתקופת סטלין משנת 1939 על הגבעה שמעל כיכר הגיבורים: קרקס בן 2,000 מושבים, שהוזנח בשנות ה-90
    ופועל שוב מאז 2011.
  body: >-
    **הגבעה שמעל כיכר הגיבורים נשאה פעם צלב מברזל יצוק שהוקם לכבוד הינצלותו של צאר; מאז 1939 עומדת עליה
    רוטונדה בעלת כיפה, שבה אלפיים איש עוצרים את נשימתם בבת אחת.**


    סיפור הקרקס של טביליסי מתחיל ב-1888, כשהעיר השתייכה לאימפריה הרוסית. בניין הקרקס הראשון עלה באש ב-1911,
    והלהקות עברו למפעל יין לשעבר עד שנפתח האולם הנוכחי ב-1939: רוטונדה ניאו-קלאסית מתקופת סטלין, מעשה
    ידיהם של ניקולאי נפרינצב, ולדימר אורושדזה וסטפן סאטונץ. עם 2,000 מושבים הוא נמנה עם הקרקסים הגדולים
    בברית המועצות, לצד אלה של מוסקבה, קייב ובאקו.


    גם לקרקע עצמה יש סיפור. כאן היה קצה רובע ורה, שבו נכנסה דרך הצבא הגאורגית לעיר בימי האימפריה, וב-1847
    הוקם כאן צלב מברזל יצוק — צלב ורה — לציון הינצלותו של הקיסר ניקולאי הראשון מתאונת דרכים במסעו לקווקז
    ב-1837. בשנות ה-30, בימי לברנטי בריה, הוסר הצלב והסביבה עוצבה מחדש ככיכר הגיבורים.


    אחר כך באו השנים הרזות. אחרי התפרקות ברית המועצות הבניין התפורר, וסביבתו קנתה לה שם רע בשעות החשכה.
    ב-2003 קנה את הקרקס איל ההון בדרי פטרקצישווילי והחל לשקם אותו; חלקו במשבר הפוליטי של 2007 ומותו זמן
    קצר אחר כך עצרו את העבודות, ואחותו, מזיה טורטלדזה, היא שפתחה מחדש את הדלתות ב-2011.


    מתוך התנועה הסואנת שמסתחררת למטה בכיכר הגיבורים, התוף והכיפה עדיין שולטים במראה הרובע כולו. צלב לצאר,
    זירה לאקרובטים סובייטים, חורבה, הצלה: מעט מקומות בטביליסי שינו את משמעותם פעמים רבות כל כך בלי לזוז
    סנטימטר.
  tip: >-
    קנו מראש כרטיסים למופע מסוים, באתר הקרקס עצמו (circus.ge) או בקופה; המחירים משתנים לפי התוכנית והעונה
    ואינם מתפרסמים כמחירון קבוע. הקדישו שעתיים עד שעתיים וחצי כולל הפסקה; מופעי השנה החדשה הם העמוסים
    ביותר. מבקרים מדווחים שבתוכניות השתתפו בעלי חיים מאולפים — סוסים, חתולים, כלבים — אז אם זה חשוב לכם,
    בדקו את התוכנייה הנוכחית. אפשר לראות ולצלם את הבניין מבחוץ בכל שעה ובלי כרטיס. בערבי מופעים החניה
    סביב כיכר הגיבורים דחוקה: הגיעו חצי שעה מוקדם או בואו במונית.
  route: >-
    כ-5 ק"מ ו-15 דקות מכיכר החירות, ברחובות עירוניים רגילים. רדו ברחוב פושקין ובשדרות ברטשווילי אל הכביש
    שעל הגדה הימנית, ואז סעו צפונה כמעט 3 ק"מ לאורך סוללת זביאד גמסחורדיה עד כיכר הגיבורים. עלו על שדרות
    תמר מפה ופנו ימינה לצירקיס אגמרטי (עליית הקרקס), שמטפסת ישר אל הבניין. כל רכב פרטי רגיל יתאים; המבחן
    האמיתי הוא המחלף הסואן רב-הנתיבים בכיכר הגיבורים, אז בחרו נתיב מוקדם. שימו לב: בניגוד לכמה רשימות,
    אין תחנת מטרו בכיכר הגיבורים — בלי רכב, מונית היא הפתרון הפשוט ביותר.
ar:
  name: سيرك تبليسي الحكومي
  short: >-
    روتوندا من الحقبة الستالينية تعود إلى 1939 على التلة فوق ساحة الأبطال: سيرك تبليسي ذو الألفي مقعد،
    أُهمل في التسعينيات وعاد إلى العمل منذ 2011.
  body: >-
    **حملت التلة المطلة على ساحة الأبطال يومًا صليبًا من الحديد الزهر أُقيم احتفاءً بنجاة قيصر؛ ومنذ 1939
    تحمل روتوندا ذات قبة يحبس فيها ألفا شخص أنفاسهم في آن واحد.**


    تبدأ حكاية السيرك في تبليسي عام 1888، حين كانت المدينة تابعة للإمبراطورية الروسية. احترق أول مبنى
    للسيرك عام 1911، فانتقلت الفرق إلى مصنع نبيذ سابق إلى أن افتُتحت القاعة الحالية عام 1939: روتوندا
    كلاسيكية جديدة من الحقبة الستالينية صممها نيكولاي نيبرينتسيف وفلاديمير أوروشادزه وستيبان ساتونتس.
    وبمقاعدها الألفين كانت من أكبر سيركات الاتحاد السوفيتي، إلى جانب سيركات موسكو وكييف وباكو.


    وللأرض نفسها حكايتها. فهنا كان طرف حي فيرا، حيث كان الطريق العسكري الجورجي يدخل المدينة في العهد الإمبراطوري،
    وفي عام 1847 أُقيم هنا صليب من الحديد الزهر — صليب فيرا — تخليدًا لنجاة الإمبراطور نيقولا الأول من
    حادث طريق خلال رحلته القوقازية عام 1837. وفي الثلاثينيات، في عهد لافرينتي بيريا، أُزيل الصليب وأُعيد
    تشكيل محيطه ليصبح ساحة الأبطال.


    ثم جاءت السنوات العجاف. بعد انهيار الاتحاد السوفيتي تداعى المبنى، واكتسب محيطه سمعة قاتمة بعد حلول
    الظلام. وفي عام 2003 اشترى رجل الأعمال الثري بدري باتاركاتسيشفيلي السيرك وبدأ في إعادة بنائه؛ لكن
    دوره في الأزمة السياسية عام 2007 ثم وفاته بعدها بقليل أوقفا الأعمال، وكانت أخته مزيا تورتلادزه هي
    من أعادت فتح الأبواب أخيرًا عام 2011.


    ومن زحمة السير الدائرة في ساحة الأبطال في الأسفل، لا يزال المبنى الأسطواني بقبته يهيمن على الحي كله.
    صليب لقيصر، وحلبة للبهلوانيين السوفييت، وأطلال، ثم إنقاذ: قلّما غيّر مكان في تبليسي معناه بهذه الكثرة
    دون أن يتزحزح شبرًا.
  tip: >-
    اشترِ التذاكر لعرض محدد مسبقًا، عبر موقع السيرك نفسه (circus.ge) أو من شباك التذاكر؛ فالأسعار تتغير
    مع البرنامج والموسم ولا تُنشر في قائمة ثابتة. خصّص ساعتين إلى ساعتين ونصف مع الاستراحة؛ وعروض رأس
    السنة هي الأكثر ازدحامًا. يذكر الزوار أن البرامج تضمنت حيوانات مدرّبة — خيولًا وقططًا وكلابًا — فراجع
    البرنامج الحالي إن كان ذلك يهمك. يمكن مشاهدة المبنى وتصويره من الخارج في أي ساعة ومن دون تذكرة. وفي
    ليالي العروض تضيق مواقف السيارات حول ساحة الأبطال: احضر قبل نصف ساعة أو تعالَ بسيارة أجرة.
  route: >-
    نحو 5 كم و15 دقيقة من ساحة الحرية عبر شوارع المدينة العادية. انزل عبر شارع بوشكين وجادة باراتاشفيلي
    إلى طريق الضفة اليمنى، ثم اتبع كورنيش زفياد غامساخورديا شمالًا قرابة 3 كم حتى ساحة الأبطال. انتقل
    إلى جادة تامار ميبي وانعطف يمينًا إلى تسيركيس أغمارتي (طلعة السيرك)، التي تصعد مباشرة إلى المبنى.
    أي سيارة عادية تفي بالغرض؛ أما الاختبار الحقيقي فهو التقاطع المزدحم متعدد المسارات في ساحة الأبطال،
    فاختر مسارك مبكرًا. ولاحظ أنه، خلافًا لبعض القوائم، لا توجد محطة مترو في ساحة الأبطال؛ ومن دون سيارة،
    فسيارة الأجرة هي الخيار الأسهل.
