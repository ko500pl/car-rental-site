ka:
  name: ჭიორა
  short: >-
    ღებამდე ბოლო სოფელი რიონის სათავეებში: 116 მცხოვრები, ქვის სახლები და სახელი, რომელსაც თქმულება ჭალის
    მელიებსა და კვერნებს უკავშირებს.
  body: >-
    **1901 წელს ჭიორაში 1125 კაცი ცხოვრობდა, 2014 წლის აღწერამ კი 116 დაითვალა — და წყნარ შუადღეს სოფელში
    ყველაზე ხმამაღლა რიონი ლაპარაკობს.**


    ჭიორა რიონის სათავეებში, ზღვის დონიდან დაახლოებით 1330 მეტრზე დგას, მთის რაჭაში — ღებამდე ბოლო სოფელია.
    ზემოთ ხეობა ვიწროვდება, ტყიანი ფერდობები ორივე მხრიდან ახლოვდება, ჩრდილოეთით კი ხედს კავკასიონის მთავარი
    ქედი კედელივით კეტავს.


    სოფლის სახელს თავისი თქმულება ახლავს. გადმოცემით, ჭიორელები ოდესღაც ფასის მთის იქით ცხოვრობდნენ, მაგრამ
    ჩრდილოელი მომხდურები მოსვენებას აღარ აძლევდნენ. ღებელებს დასასახლებელი მიწა სთხოვეს, ღებელებმა კი
    ადგილის არჩევა თავად მიანდეს. ჭიორელებმა ის ჭალა ამოირჩიეს, სადაც ბევრი „მწიორი“ ბუდობდა — ასე ეძახიან
    აქ მელას, კვერნას, კურდღელს, თრითინას — და სოფელსაც სახელი აქედან შერჩა.


    ქვის სახლები და ხის აივნები დღესაც დგას, თუმცა ბევრი მათგანი კარს მხოლოდ ზაფხულობით აღებს. 1991 წლის
    29 აპრილის მიწისძვრამ, კავკასიაში ოდესმე დაფიქსირებულთაგან ყველაზე ძლიერმა, მთელი ზემო რაჭა შეაზანზარა,
    მოსახლეობა კი მას შემდეგაც კლებულობდა: 2002 წელს სოფელში 235 კაცი ცხოვრობდა, თორმეტი წლის შემდეგ —
    ნახევარი.


    მოლაშქრისთვის ჭიორა ზღურბლია. ბილიკები ალპურ ზონაში ადის და ხეობას ზემოთ, ხუთიოდე კილომეტრში მდებარე
    ღებისკენ მიდის; ძველი მწყემსური გზები კი დასავლეთით, ქედს გადაღმა, ქვემო სვანეთისკენ გადადის. ეს მრავალდღიანი
    გასვლაა აღჭურვილი და გამოცდილი მოგზაურისთვის, უმჯობესია ადგილობრივ გამყოლთან ერთად.


    თოვლი რომ მოვა, ჭიორა მათ რჩებათ, ვინც აქ ზამთრობს.
  tip: >-
    თავად სოფელს ორი საათი ეყოფა — აქ ჩამოსვლის მიზეზი ის არის, რაც მის იქით იწყება. მომსახურება მინიმალურია:
    მაღაზიის იმედად ნუ იქნებით, საკვები თან წამოიღეთ, ღამის გასათევი კი წინასწარ მოძებნეთ ჭიორაში, ღებში,
    გლოლაში ან ონში. მობილური კავშირი ხან არის, ხან — არა. ამ ხეობებში ღრუბელი და წვიმა ჩვეულებრივ დღის
    მეორე ნახევარში მოდის, ამიტომ ლაშქრობა დილით დაიწყეთ და პროგნოზი წინასწარ ნახეთ. გზაზე ხშირად საქონელია
    — ნელა იარეთ. ქედის გადაღმა ნებისმიერ მარშრუტზე ადგილობრივი გამყოლი აიყვანეთ და მასპინძელს გეგმა დაუტოვეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, შ19-ით თერჯოლის გავლით ტყიბულამდე, შ17-ით ნაქერალას
    უღელტეხილზე გადავლით ამბროლაურამდე, შემდეგ შ16-ით აღმოსავლეთით ონამდე და იქიდან ხეობას ზემოთ, გლოლამდე.
    გლოლიდან ჭიორამდე დაახლოებით 13 კილომეტრი, ნახევარი საათია; სულ დაახლოებით 320 კმ და ექვსიოდე საათი.
    გლოლის იქით ასფალტს ნუ ელით: ხრეში და ფხვიერი ქვაა, ღრმა ნაკვალევით და ღელეების გადასასვლელებით, რომლებიც
    წვიმის შემდეგ დიდდება. ეს ოფროუდის კლასის გზაა — მაღალი კლირენსი და ოთხივე თვლის წამყვანი აუცილებელია.
    საწვავი ამბროლაურში ჩაასხით; ზემოთ მის იმედად ნუ იქნებით.
en:
  name: Chiora
  short: >-
    The last village before Ghebi on the upper Rioni: 116 people, stone houses, and a name that legend
    traces to the foxes and martens of a riverside meadow.
  body: >-
    **In 1901 Chiora had 1,125 inhabitants. The 2014 census counted 116, and on a quiet afternoon the
    Rioni is the loudest voice in the village.**


    Chiora stands at about 1,330 metres in the headwaters of the Rioni, in Mountain Racha, and it is the
    last village before Ghebi. Above it the valley tightens, forested slopes close in from both sides,
    and to the north the main ridge of the Caucasus shuts the view like a wall.


    The village's name comes with a legend. The first Chiorans, the story goes, lived beyond the mountain
    of Pasi until raiders from the north gave them no peace. They asked the people of Ghebi for land,
    and the Ghebians let them choose where. They chose a riverside meadow where mtsiori made their dens,
    mtsiori being the local word for foxes, martens, hares and weasels, and the village has carried the
    animals' name ever since.


    Stone houses and wooden balconies still line the lanes, though many open their doors only in summer.
    The earthquake of 29 April 1991, the strongest ever recorded in the Caucasus, shook the whole of upper
    Racha, and the numbers kept falling after it: 235 people in 2002, half that twelve years later.


    For walkers, Chiora is a threshold. Paths climb into the alpine zone and lead on to Ghebi, about five
    kilometres up the valley. Old shepherds' routes cross the ridge to the west towards Lower Svaneti.
    That crossing takes several days and is only for equipped, experienced walkers, ideally with a local
    guide.


    When the snow comes, Chiora belongs to the people who stay the winter.
  tip: >-
    Two hours are enough for the village itself; the reason to come is what starts beyond it. Services
    are minimal. Don't count on finding a shop: bring your food and book a bed in advance in Chiora, Ghebi,
    Glola or Oni. The mobile signal comes and goes. Cloud and rain usually build up in the afternoon in
    these valleys, so start walks early and check the forecast first. Cattle often wander the road, so
    drive slowly. For any route over the ridge, hire a local guide and leave your plan with your host.
  route: >-
    From Tbilisi take the S1 (E60) west, the Sh19 through Terjola to Tkibuli and the Sh17 over the Nakerala
    pass to Ambrolauri. From there take the Sh16 east to Oni and carry on up the valley to Glola. Chiora
    is about 13 km beyond Glola, roughly half an hour, which makes about 320 km and roughly six hours
    in all. There is no asphalt past Glola, only gravel and loose stone with deep ruts and stream crossings
    that swell after rain. This is offroad-class driving, and high clearance and 4x4 are essential. Fill
    up in Ambrolauri and don't count on fuel higher up.
ru:
  name: Чиора
  short: >-
    Последнее село перед Геби в верховьях Риони: 116 жителей, каменные дома и имя, которое легенда связывает
    с лисами и куницами приречного луга.
  body: >-
    **В 1901 году в Чиоре жили 1125 человек. Перепись 2014 года насчитала 116, и тихим днём громче всех
    в селе говорит Риони.**


    Чиора стоит примерно на 1330 метрах в верховьях Риони, в Горной Раче, и это последнее село перед Геби.
    Выше долина сужается, лесистые склоны сходятся с обеих сторон, а на севере Главный Кавказский хребет
    закрывает горизонт, как стена.


    С названием села связана легенда. Первые чиорцы, как рассказывают, жили за горой Паси, пока набеги
    с севера не лишили их покоя. Они попросили земли у жителей Геби, и те позволили им самим выбрать место.
    Переселенцы выбрали приречный луг, где рыли норы мциори — так здесь называют лис, куниц, зайцев и
    ласок, — и с тех пор село носит имя этих зверей.


    Каменные дома с деревянными балконами по-прежнему тянутся вдоль улочек, хотя многие открывают двери
    только летом. Землетрясение 29 апреля 1991 года, сильнейшее из когда-либо зарегистрированных на Кавказе,
    потрясло всю Верхнюю Рачу, и после него население продолжало таять: 235 человек в 2002 году и вдвое
    меньше двенадцать лет спустя.


    Для любителей пеших походов Чиора — порог. Тропы поднимаются в альпийский пояс и ведут дальше, к Геби,
    примерно в пяти километрах вверх по долине. Старые пастушьи пути пересекают хребет на запад, в сторону
    Нижней Сванетии. Такой переход занимает несколько дней и под силу лишь хорошо снаряжённым и опытным
    ходокам, лучше с местным проводником.


    Когда приходит снег, Чиора принадлежит тем, кто остаётся зимовать.
  tip: >-
    На само село хватит двух часов; приезжают сюда ради того, что начинается за ним. Инфраструктура минимальна.
    Не рассчитывайте на магазин, везите еду с собой и заранее бронируйте ночлег в Чиоре, Геби, Глоле или
    Они. Мобильная связь то появляется, то пропадает. Облака и дождь в этих долинах обычно собираются
    после полудня, поэтому выходите рано и сначала проверьте прогноз. На дороге часто бродит скот — езжайте
    медленно. Для любого маршрута через хребет наймите местного проводника и оставьте свой план хозяевам.
  route: >-
    Из Тбилиси — по S1 (E60) на запад, по Sh19 через Терджолу до Ткибули и по Sh17 через перевал Накерала
    в Амбролаури. Оттуда по Sh16 на восток до Они и дальше вверх по долине до Глолы. Чиора — примерно
    в 13 км за Глолой, около получаса езды; всего выходит около 320 км и примерно шесть часов. За Глолой
    асфальта нет — только гравий и сыпучий камень, глубокие колеи и броды через ручьи, которые вздуваются
    после дождя. Это настоящее бездорожье: высокий клиренс и полный привод обязательны. Заправьтесь в
    Амбролаури и не рассчитывайте на топливо выше.
fa:
  name: چیورا
  short: >-
    آخرین روستا پیش از غبی در سرچشمه‌های ریونی: ۱۱۶ نفر، خانه‌های سنگی و نامی که افسانه آن را به روباه‌ها
    و سمورهای چمنزاری کنار رود می‌رساند.
  body: >-
    **در سال ۱۹۰۱ چیورا ۱۱۲۵ ساکن داشت. سرشماری ۲۰۱۴ تنها ۱۱۶ نفر شمرد، و در بعدازظهری آرام بلندترین صدای
    روستا صدای ریونی است.**


    چیورا در ارتفاع حدود ۱۳۳۰ متر در سرچشمه‌های ریونی، در راچای کوهستانی، ایستاده و آخرین روستا پیش از
    غبی است. بالاتر از آن دره تنگ‌تر می‌شود، دامنه‌های جنگلی از دو سو نزدیک می‌آیند و در شمال، رشته‌کوه
    اصلی قفقاز چون دیواری افق را می‌بندد.


    نام روستا با افسانه‌ای همراه است. می‌گویند نخستین چیورایی‌ها آن سوی کوه پاسی زندگی می‌کردند تا آنکه
    تاخت‌وتاز مهاجمان شمالی آرامش را از آنان گرفت. از مردم غبی زمین خواستند و غبی‌ها گذاشتند خودشان جا
    را برگزینند. آنان چمنزاری کنار رود را انتخاب کردند که «متسیوری»ها در آن لانه داشتند — واژه‌ای محلی
    برای روباه، سمور، خرگوش و راسو — و روستا از آن پس نام این جانوران را بر خود دارد.


    خانه‌های سنگی با ایوان‌های چوبی هنوز در امتداد کوچه‌ها صف کشیده‌اند، هرچند بسیاری فقط تابستان‌ها درهایشان
    را می‌گشایند. زمین‌لرزهٔ ۲۹ آوریل ۱۹۹۱، نیرومندترین زمین‌لرزه‌ای که تا کنون در قفقاز ثبت شده، سراسر
    راچای بالا را لرزاند و شمار ساکنان پس از آن همچنان کاهش یافت: ۲۳۵ نفر در سال ۲۰۰۲ و نیمی از آن دوازده
    سال بعد.


    برای کوه‌پیمایان، چیورا آستانه است. کوره‌راه‌ها به کمربند آلپی بالا می‌روند و تا غبی ادامه می‌یابند
    که حدود پنج کیلومتر بالاتر در دره است. راه‌های قدیمی چوپانان از رشته‌کوه به سوی غرب، به سمت سوانتی
    پایین، می‌گذرند. این گذر چند روز طول می‌کشد و تنها برای کوه‌پیمایان مجهز و باتجربه است، ترجیحاً با
    راهنمای محلی.


    وقتی برف می‌بارد، چیورا از آنِ کسانی است که زمستان را همان‌جا می‌مانند.
  tip: >-
    برای خود روستا دو ساعت کافی است؛ دلیل آمدن چیزی است که از پس آن آغاز می‌شود. امکانات بسیار اندک است.
    روی مغازه حساب نکنید، غذایتان را همراه بیاورید و تخت را از پیش در چیورا، غبی، گلولا یا اونی رزرو کنید.
    آنتن تلفن همراه گاهی هست و گاهی نیست. در این دره‌ها ابر و باران معمولاً بعدازظهر جمع می‌شود، پس پیاده‌روی
    را زود آغاز کنید و پیش از آن پیش‌بینی هوا را ببینید. دام‌ها اغلب در جاده پرسه می‌زنند، پس آهسته برانید.
    برای هر مسیری که از رشته‌کوه می‌گذرد راهنمای محلی بگیرید و برنامه‌تان را نزد میزبان بگذارید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب بروید، سپس Sh19 را از میان ترجولا تا تکیبولی و Sh17 را از گردنهٔ
    ناکرالا تا آمبرولائوری. از آنجا Sh16 را به سوی شرق تا اونی بگیرید و در امتداد دره تا گلولا ادامه دهید.
    چیورا حدود ۱۳ کیلومتر آن‌سوی گلولاست، نزدیک به نیم ساعت، که روی‌هم حدود ۳۲۰ کیلومتر و نزدیک به شش
    ساعت می‌شود. پس از گلولا آسفالتی نیست، فقط شن و سنگ‌ریزهٔ لغزان با شیارهای عمیق و گذرگاه‌هایی از میان
    جویبارها که پس از باران طغیان می‌کنند. این رانندگی در ردهٔ آفرود است و ارتفاع زیاد از زمین و دیفرانسیل
    چهارچرخ ضروری است. در آمبرولائوری سوخت بزنید و در بالادست روی سوخت حساب نکنید.
he:
  name: צ'יורה
  short: 'הכפר האחרון לפני גבי במעלה הריוני: 116 תושבים, בתי אבן, ושם שהאגדה קושרת לשועלים ולדלקים של
    אחו על שפת הנהר.'
  body: >-
    **ב-1901 חיו בצ'יורה 1,125 בני אדם. מפקד 2014 מנה 116, ובאחר צהריים שקט הריוני הוא הקול הרם ביותר
    בכפר.**


    צ'יורה שוכנת בגובה של כ-1,330 מטר באזור מקורות הריוני, בראצ'ה ההררית, והיא הכפר האחרון לפני גבי. מעליה
    העמק הולך ומצר, מדרונות מיוערים נסגרים משני הצדדים, ובצפון הרכס הראשי של הקווקז חוסם את הנוף כמו חומה.


    לשם הכפר נלווית אגדה. לפי המסופר, בני צ'יורה הראשונים ישבו מעבר להר פאסי, עד שפשיטות מן הצפון לא הניחו
    להם. הם ביקשו אדמה מאנשי גבי, ואלה הניחו להם לבחור את המקום בעצמם. הם בחרו אחו על שפת הנהר שבו חפרו
    את מאורותיהם ה"מציורי" – כך מכנים כאן בלשון המקום שועלים, דלקים, ארנבות וסמורים – ומאז נושא הכפר את
    שמן של החיות.


    בתי אבן עם מרפסות עץ עדיין עומדים לאורך הסמטאות, אף שרבים מהם פותחים את דלתותיהם רק בקיץ. רעידת האדמה
    של 29 באפריל 1991, החזקה ביותר שנרשמה אי-פעם בקווקז, הרעידה את כל ראצ'ה העליונה, והמספרים המשיכו לרדת
    אחריה: 235 תושבים ב-2002, ומחצית מזה שתים-עשרה שנה אחר כך.


    למטיילים צ'יורה היא סף. שבילים מטפסים אל החגורה האלפינית וממשיכים לגבי, כחמישה קילומטרים במעלה העמק.
    דרכי רועים עתיקות חוצות את הרכס מערבה, לכיוון סוואנטי התחתונה. המעבר הזה נמשך כמה ימים ומתאים רק למטיילים
    מצוידים ומנוסים, רצוי עם מדריך מקומי.


    כשהשלג מגיע, צ'יורה שייכת למי שנשארים בה לחורף.
  tip: >-
    שעתיים מספיקות לכפר עצמו; הסיבה לבוא היא מה שמתחיל מעבר לו. השירותים מינימליים. אל תסמכו על חנות,
    הביאו אוכל משלכם, והזמינו מראש לינה בצ'יורה, בגבי, בגלולה או באוני. הקליטה הסלולרית באה והולכת. עננים
    וגשם מצטברים בעמקים האלה בדרך כלל אחר הצהריים, אז צאו להליכות מוקדם ובדקו קודם את התחזית. בקר משוטט
    לעתים קרובות על הכביש, אז סעו לאט. לכל מסלול שחוצה את הרכס שכרו מדריך מקומי והשאירו את התוכנית שלכם
    אצל המארחים.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60), משם ב-Sh19 דרך טרג'ולה עד טקיבולי וב-Sh17 דרך מעבר נקרלה עד אמברולאורי.
    משם קחו את Sh16 מזרחה עד אוני, והמשיכו במעלה העמק עד גלולה. צ'יורה נמצאת כ-13 ק"מ אחרי גלולה, כחצי
    שעה נסיעה, ובסך הכול כ-320 ק"מ וכשש שעות. אחרי גלולה אין אספלט, רק חצץ ואבנים רופפות, תלמים עמוקים
    וחציות נחלים שמתנפחים אחרי גשם. זו נהיגת שטח לכל דבר: מרווח גחון גבוה והנעה כפולה הכרחיים. תדלקו באמברולאורי
    ואל תסמכו על דלק בהמשך הדרך למעלה.
ar:
  name: تشيورا
  short: >-
    آخر قرية قبل غيبي في أعالي ريوني: 116 نسمة، وبيوت من حجر، واسمٌ تنسبه الأسطورة إلى ثعالب ودلوق كانت
    تسكن مرجاً على ضفة النهر.
  body: >-
    **في عام 1901 كان في تشيورا 1125 نسمة. أما إحصاء 2014 فعدّ 116، وفي عصرٍ هادئ يكون ريوني أعلى الأصوات
    في القرية.**


    تقع تشيورا على ارتفاع نحو 1330 متراً عند منابع ريوني، في راتشا الجبلية، وهي آخر قرية قبل غيبي. وفوقها
    يضيق الوادي، وتنطبق المنحدرات المشجّرة من الجانبين، وفي الشمال تسدّ سلسلة القوقاز الرئيسية الأفق كالجدار.


    ولاسم القرية أسطورة. تقول الحكاية إن أوائل أهل تشيورا عاشوا وراء جبل باسي حتى سلبتهم غارات القادمين
    من الشمال كل سكينة. فطلبوا أرضاً من أهل غيبي، فتركهم هؤلاء يختارون الموضع بأنفسهم. فاختاروا مرجاً
    على ضفة النهر كانت «المتسيوري» تحفر فيه جحورها، وهي الكلمة المحلية للثعالب والدلوق والأرانب وبنات
    عرس، ومنذ ذلك الحين تحمل القرية اسم هذه الحيوانات.


    ما زالت البيوت الحجرية ذات الشرفات الخشبية تصطفّ على الأزقّة، وإن كان كثير منها لا يفتح أبوابه إلا
    صيفاً. وقد هزّ زلزال 29 أبريل 1991، أقوى زلزال سُجّل في القوقاز على الإطلاق، راتشا العليا كلها، وواصلت
    الأعداد انحدارها بعده: 235 نسمة عام 2002، ونصف ذلك بعد اثني عشر عاماً.


    وبالنسبة إلى المشّائين، تشيورا عتبة. فالدروب تصعد إلى النطاق الألبي وتمضي إلى غيبي، على بعد نحو خمسة
    كيلومترات أعلى الوادي. ودروب الرعاة القديمة تعبر السلسلة غرباً نحو سفانيتي السفلى. ويستغرق هذا العبور
    عدة أيام، ولا يصلح إلا لمشّائين مجهّزين ذوي خبرة، ويُفضّل أن يكون معهم مرشد محلي.


    وحين يأتي الثلج، تصبح تشيورا ملكاً لمن يبقون فيها الشتاء.
  tip: >-
    ساعتان تكفيان للقرية نفسها؛ أما سبب المجيء فما يبدأ بعدها. الخدمات شحيحة. لا تعوّل على وجود متجر،
    واحمل طعامك، واحجز مبيتك مسبقاً في تشيورا أو غيبي أو غلولا أو أوني. تغطية الهاتف المحمول تحضر وتغيب.
    وعادةً ما تتجمّع الغيوم والأمطار في هذه الأودية بعد الظهر، فابدأ المشي باكراً وتحقّق من النشرة الجوية
    أولاً. كثيراً ما تهيم الماشية على الطريق، فقُد ببطء. ولأي مسار يعبر السلسلة استأجر مرشداً محلياً واترك
    خطتك لدى مُضيفك.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً، ثم Sh19 عبر ترجولا إلى تكيبولي، ثم Sh17 عبر ممر ناكيرالا إلى أمبرولاوري.
    ومن هناك خذ Sh16 شرقاً إلى أوني وواصل صعود الوادي حتى غلولا. تقع تشيورا على بعد نحو 13 كم بعد غلولا،
    نحو نصف ساعة بالسيارة، فيصبح المجموع نحو 320 كم وقرابة ست ساعات. لا إسفلت بعد غلولا، بل حصى وحجارة
    سائبة وأخاديد عميقة ومخاضات جداول تفيض بعد المطر. إنها قيادة على طرق وعرة حقاً، والخلوص الأرضي العالي
    والدفع الرباعي ضروريان. تزوّد بالوقود في أمبرولاوري ولا تعوّل على وجوده في الأعلى.
