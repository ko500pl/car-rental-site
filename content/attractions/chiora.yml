ka:
  name: ჭიორა
  short: >-
    ღების წინა სოფელი რიონის სათავეებში — ლაშქრობების საწყისი წერტილი და ზემო სვანეთისკენ მიმავალი ძველი
    გადასასვლელი.
  body: >-
    **ჭიორა რიონის სათავეების ბოლო წინა სოფელია.** ის გლოლასა და ღებს შორის, დაახლოებით ათას სამას მეტრზე
    დგას, იმ მონაკვეთზე, სადაც ხეობა უკვე მკვეთრად ვიწროვდება და ორივე მხრიდან ტყით დაფარული ფერდობები
    ეშვება.


    სოფელი პატარაა: რამდენიმე ათეული კომლი, ქვის სახლები, ხის აივნები, ძველი ეკლესია და სასაფლაო ფერდობზე.
    მუდმივი მოსახლეობა მცირეა და ძირითადად ხანდაზმული — ახალგაზრდები ონსა და თბილისში წავიდნენ, ზაფხულში
    კი ბევრი ბრუნდება. 1991 წლის მიწისძვრამ ჭიორასაც ბევრი სახლი დაუნგრია და ზოგი დღემდე ისე დგას.


    ჭიორის მთავარი მნიშვნელობა გეოგრაფიულია. აქედან იწყება ბილიკები, რომლებიც ჩრდილოეთით ალპურ ზონაში
    და აღმოსავლეთით ღებისკენ მიდის, ხოლო დასავლეთით — ძველი გადასასვლელი ქვემო სვანეთისკენ, ზესხოსა და
    ლენტეხის მიმართულებით. ეს მრავალდღიანი მარშრუტია, საკუთარი კარვით და გამოცდილებით; მარტივი გასეირნება
    არ არის.


    ჭიორას ზემოთ ხედი იხსნება: ჩრდილოეთით კავკასიონის მთავარი ქედია, ბუბისა და ჩიუხის მასივებით, ხოლო
    აღმოსავლეთით ღების ხეობის ბოლო, საიდანაც ბუბისა და ჭანჭახის მყინვარებისკენ მიდიან. ღები აქედან ხუთიოდე
    კილომეტრშია.


    სოფელი ივნისიდან სექტემბრამდე ცოცხლობს. ოქტომბრიდან გზა თოვლის ქვეშ ექცევა და ჭიორა პრაქტიკულად იზოლირდება;
    ზამთარში აქ ჩასვლა არ არის დაგეგმვის საგანი.


    ჭიორა, ღები და გლოლა ერთად ცალკე ერთეულს ქმნიან, რომელსაც მთარაჭა ჰქვია — „მთის რაჭა“. სამივე სოფელი
    მეცხვარეობით ცხოვრობდა და ერთმანეთთან უფრო ახლოს იყო, ვიდრე ქვემოთ მდებარე ონთან: საკუთარი კილო, საკუთარი
    ჩვეულებები, საკუთარი საზაფხულო საძოვრები ქედის იქით. ეს დღემდე ისმის — აქაური მეტყველება ამბროლაურულისგან
    შესამჩნევად განსხვავდება. ცხვრის ფარები ივნისში ადის ალპურ ზონაში და სექტემბრის ბოლოს ჩამოდის; თუ
    ამ დღეებში მოხვდი, გზაზე ფარებს დაელოდები.
  tip: >-
    ორი საათი თავად სოფლისთვის საკმარისია — მთავარი აქ ის არის, რაც შემდეგ იწყება. ღამის გასათევი და კვება
    წინასწარ შეათანხმე: ჭიორაში ორიოდე ოჯახია, რომელიც სტუმარს იღებს, მაღაზია კი არ არსებობს. სასმელი
    წყალი წყაროსია და კარგი, საკვები კი თან უნდა გქონდეს. მობილური კავშირი ადგილ-ადგილ არის. ლაშქრობის
    დაწყებამდე ამინდი შეამოწმე — ხეობაში დღის მეორე ნახევარში ხშირად წვიმს.
  route: >-
    გლოლიდან ჩრდილო-დასავლეთით რიონის ხეობით — ცამეტიოდე კილომეტრი, ოცდაათი წუთი. თბილისიდან სულ 398 კმ,
    დაახლოებით შვიდი საათი და ათი წუთი. გლოლის შემდეგ ასფალტი მთავრდება: მოხრეშილი და ქვიანი გზაა, ღრმა
    ღარებით და რამდენიმე ღელის გადასასვლელით, რომლებიც წვიმის შემდეგ იზრდება. მაღალი კლირენსი და 4x4 აუცილებელია
    — ეს რჩევა არ არის. ბოლო საწვავი ამბროლაურში აიღე, ონში ხანდახან მუშაობს.
en:
  name: Chiora
  short: >-
    The village before Ghebi in the headwaters of the Rioni — a trailhead, and the start of an old crossing
    towards Lower Svaneti.
  body: >-
    **Chiora is the last village but one in the headwaters of the Rioni.** It stands between Glola and
    Ghebi at about 1,300 metres, on the stretch where the valley narrows sharply and wooded slopes come
    down from both sides.


    The village is small: a few dozen households, stone houses with wooden balconies, an old church and
    a cemetery on the slope. The permanent population is tiny and mostly elderly — the young left for
    Oni and Tbilisi, though many come back for the summer. The 1991 earthquake brought down a number of
    houses here too, and some still stand as they fell.


    Chiora's importance is geographical. Trails start here: north into the alpine zone, east towards Ghebi,
    and west over an old pass towards Lower Svaneti in the direction of Zeskho and Lentekhi. That last
    is a multi-day route requiring a tent, navigation and real experience; it is not a day walk.


    Above the village the view opens out. To the north stands the main ridge of the Greater Caucasus with
    the Buba and Chiukhi massifs; to the east, the closing section of the Ghebi valley, from where walkers
    set out for the Buba and Chanchakhi glaciers. Ghebi itself is about five kilometres further on.


    The village is alive from June to September. From October the road goes under snow and Chiora becomes
    effectively isolated; getting here in winter is not something to plan around.


    Chiora, Ghebi and Glola together form a distinct unit known as Mtaracha, "mountain Racha". All three
    villages lived by sheep, and they were closer to one another than to Oni below: their own speech,
    their own customs, their own summer pastures over the ridge. You can still hear it — the dialect here
    is noticeably different from that of Ambrolauri. The flocks go up to the alpine zone in June and come
    down at the end of September; if you arrive on those days you will spend some time waiting behind
    sheep on the road.
  tip: >-
    Two hours covers the village itself — what matters here is what begins after it. Arrange a bed and
    meals in advance: two or three families take guests and there is no shop at all. Spring water is good
    and drinkable, but bring your food with you. Mobile coverage comes and goes. Check the forecast before
    starting any walk; in these valleys rain usually arrives in the afternoon.
  route: >-
    From Glola head north-west up the Rioni — about thirteen kilometres, thirty minutes. From Tbilisi
    the total is 398 km, roughly seven hours and ten minutes. Beyond Glola the asphalt ends: the road
    is gravel and loose stone, deeply rutted, with several stream crossings that swell after rain. High
    clearance and four-wheel drive are necessary, not merely advisable. Take your last fuel at Ambrolauri;
    the station in Oni works only intermittently.
ru:
  name: Чиора
  short: Предпоследнее село в верховьях Риони — начало троп и старого перехода в Нижнюю Сванетию.
  body: >-
    **Чиора — предпоследнее село в верховьях Риони.** Оно стоит между Глолой и Геби примерно на 1300 метрах,
    на участке, где ущелье резко сужается и лесистые склоны спускаются с обеих сторон.


    Село маленькое: несколько десятков дворов, каменные дома с деревянными балконами, старая церковь и
    кладбище на склоне. Постоянных жителей мало, в основном пожилые — молодёжь уехала в Они и Тбилиси,
    хотя летом многие возвращаются. Землетрясение 1991 года обрушило и здесь немало домов, и часть их
    так и стоит.


    Значение Чиоры — географическое. Отсюда начинаются тропы: на север в альпийскую зону, на восток к
    Геби и на запад через старый перевал в Нижнюю Сванетию, в сторону Зесхо и Лентехи. Последний маршрут
    — многодневный, с палаткой, навигацией и реальным опытом; это не прогулка на день.


    Выше села открывается вид: на севере Главный Кавказский хребет с массивами Буба и Чиухи, на востоке
    — замыкающая часть ущелья Геби, откуда идут к ледникам Буба и Чанчахи. До самого Геби отсюда около
    пяти километров.


    Село живёт с июня по сентябрь. С октября дорога уходит под снег, и Чиора оказывается практически отрезанной;
    зимой планировать сюда поездку не стоит.


    Чиора, Геби и Глола вместе образуют особую единицу, известную как Мтарача — «горная Рача». Все три
    села жили овцами и были ближе друг к другу, чем к лежащему ниже Они: своя речь, свои обычаи, свои
    летние пастбища за хребтом. Это слышно и сейчас — местный говор заметно отличается от амбролаурского.
    Отары уходят в альпийскую зону в июне и спускаются в конце сентября; если попадёте в эти дни, придётся
    постоять на дороге за овцами.
  tip: >-
    Двух часов на само село достаточно — главное здесь то, что начинается за ним. Ночлег и питание оговаривайте
    заранее: гостей принимают две-три семьи, магазина нет вовсе. Родниковая вода хорошая и питьевая, а
    еду везите с собой. Мобильная связь появляется и пропадает. Перед выходом на тропу смотрите прогноз:
    в этих ущельях дождь обычно приходит после полудня.
  route: >-
    Из Глолы на северо-запад вверх по Риони — около тринадцати километров, тридцать минут. От Тбилиси
    всего 398 км, примерно семь часов десять минут. За Глолой асфальт кончается: дорога гравийная и каменистая,
    с глубокой колеёй и несколькими бродами, которые после дождя вздуваются. Высокий клиренс и полный
    привод здесь необходимы, а не желательны. Последняя заправка — в Амбролаури, в Они она работает не
    всегда.
fa:
  name: چیورا
  short: روستای پیش از غبی در سرچشمه‌های ریونی — سرآغاز مسیرهای پیاده و گذرگاهی کهن به سوی سوانتی پایین.
  body: >-
    **چیورا یکی مانده به آخرین روستای سرچشمه‌های ریونی است.** میان گلولا و غبی در حدود ۱۳۰۰ متری ایستاده،
    در بخشی که درّه به‌تندی تنگ می‌شود و دامنه‌های جنگلی از هر دو سو فرود می‌آیند.


    روستا کوچک است: چند ده خانوار، خانه‌های سنگی با ایوان چوبی، کلیسایی کهن و گورستانی بر دامنه. ساکنان
    دائمی اندک و بیشتر سالخورده‌اند؛ جوان‌ها به اونی و تفلیس رفته‌اند، هرچند بسیاری تابستان بازمی‌گردند.
    زمین‌لرزهٔ ۱۹۹۱ اینجا هم شماری خانه را فرو ریخت و برخی هنوز به همان حال مانده‌اند.


    اهمیت چیورا جغرافیایی است. مسیرهای پیاده از اینجا آغاز می‌شوند: به شمال به منطقهٔ آلپی، به شرق به
    سوی غبی، و به غرب از گردنه‌ای کهن به سوی سوانتی پایین، در جهت زسخو و لنتخی. این آخری مسیری چندروزه
    است و چادر و مسیریابی و تجربهٔ واقعی می‌خواهد؛ پیاده‌روی یک‌روزه نیست.


    بالای روستا چشم‌انداز باز می‌شود. در شمال ستیغ اصلی قفقاز بزرگ با تودهٔ بوبا و چیوخی ایستاده و در
    شرق انتهای درّهٔ غبی، جایی که پیاده‌روها به سوی یخچال‌های بوبا و چانچاخی راه می‌افتند. خود غبی حدود
    پنج کیلومتر آن‌سوتر است.


    روستا از خرداد تا شهریور زنده است. از مهر جاده زیر برف می‌رود و چیورا عملاً منزوی می‌شود؛ رسیدن به
    اینجا در زمستان چیزی نیست که بتوان بر آن برنامه ریخت.


    چیورا و غبی و گلولا با هم واحدی جداگانه می‌سازند که آن را متاراچا می‌نامند، یعنی «راچای کوهستانی».
    هر سه روستا با گوسفند زندگی می‌کردند و به یکدیگر نزدیک‌تر بودند تا به اونیِ پایین‌دست: گویش خود، رسوم
    خود، و چراگاه‌های تابستانی خود آن‌سوی ستیغ. این را هنوز می‌توان شنید؛ لهجهٔ اینجا با لهجهٔ آمبرولائوری
    تفاوتی محسوس دارد. گله‌ها در خرداد به منطقهٔ آلپی بالا می‌روند و در اواخر شهریور پایین می‌آیند؛ اگر
    آن روزها برسید، مدتی پشت گوسفندها در جاده خواهید ماند.
  tip: >-
    دو ساعت برای خود روستا کافی است؛ آنچه اهمیت دارد از پس آن آغاز می‌شود. جا و غذا را از پیش هماهنگ کنید:
    دو سه خانواده مهمان می‌پذیرند و مغازه‌ای اصلاً نیست. آب چشمه خوب و آشامیدنی است اما خوراک را همراه
    ببرید. آنتن موبایل می‌آید و می‌رود. پیش از آغاز هر پیاده‌روی پیش‌بینی هوا را ببینید؛ در این درّه‌ها
    باران معمولاً بعدازظهر می‌آید.
  route: >-
    از گلولا به شمال‌غرب در درّهٔ ریونی — حدود سیزده کیلومتر، سی دقیقه. از تفلیس در مجموع ۳۹۸ کیلومتر،
    تقریباً هفت ساعت و ده دقیقه. پس از گلولا آسفالت تمام می‌شود: جاده شنی و سنگلاخ است، با شیارهای عمیق
    و چند گذر آب که پس از باران بالا می‌آید. ارتفاع بالای شاسی و چهارچرخ‌محرک اینجا ضروری است، نه صرفاً
    توصیه. آخرین سوخت را در آمبرولائوری بگیرید؛ پمپ اونی گاه‌به‌گاه کار می‌کند.
he:
  name: צ'יורה
  short: הכפר שלפני גבי במעלה הריוני — נקודת פתיחה למסלולים ולמעבר עתיק אל סוונטי התחתונה.
  body: >-
    **צ'יורה היא הכפר האחד לפני האחרון במעלה הריוני.** היא עומדת בין גלולה לגבי בגובה כ-1,300 מטר, בקטע
    שבו העמק מצטמצם בחדות ומדרונות מיוערים יורדים משני עבריו.


    הכפר קטן: כמה עשרות משקי בית, בתי אבן עם מרפסות עץ, כנסייה ישנה ובית קברות במדרון. האוכלוסייה הקבועה
    זעירה וברובה מבוגרת — הצעירים עברו לאוני ולטביליסי, אם כי רבים חוזרים לקיץ. רעידת האדמה של 1991 הפילה
    גם כאן בתים אחדים, וחלקם עומדים עד היום כפי שנפלו.


    חשיבותה של צ'יורה גיאוגרפית. מכאן יוצאים שבילים: צפונה אל החגורה האלפינית, מזרחה לגבי, ומערבה במעבר
    עתיק אל סוונטי התחתונה, לכיוון זסחו ולנטחי. האחרון הוא מסלול רב-יומי שדורש אוהל, ניווט וניסיון של
    ממש; זו אינה טיילת יומית.


    מעל הכפר הנוף נפתח. מצפון ניצב הרכס הראשי של הקווקז הגדול עם גושי בובה וצ'יוחי, וממזרח קצה עמק גבי,
    שממנו יוצאים אל קרחוני בובה וצ'אנצ'אחי. גבי עצמה במרחק כחמישה קילומטרים.


    הכפר חי מיוני עד ספטמבר. מאוקטובר הדרך נכנסת תחת שלג וצ'יורה מנותקת למעשה; להגיע לכאן בחורף אינו דבר
    שכדאי לתכנן.


    צ'יורה, גבי וגלולה מרכיבות יחד יחידה נבדלת הידועה בשם מתאראצ'ה, "ראצ'ה של ההר". שלושת הכפרים התפרנסו
    מצאן, והיו קרובים זה לזה יותר מאשר לאוני שלמטה: ניב משלהם, מנהגים משלהם, מרעה קיץ משלהם מעבר לרכס.
    עדיין אפשר לשמוע את זה — הדיבור כאן שונה במידה ניכרת מזה שבאמברולאורי. העדרים עולים אל החגורה האלפינית
    ביוני ויורדים בסוף ספטמבר; מי שמגיע באותם ימים ימצא את עצמו ממתין על הכביש מאחורי כבשים.
  tip: >-
    שעתיים מספיקות לכפר עצמו — העיקר כאן הוא מה שמתחיל אחריו. תאמו מראש לינה וארוחות: שתיים-שלוש משפחות
    מקבלות אורחים, וחנות אין כלל. מי המעיין טובים וראויים לשתייה, אבל את האוכל הביאו אתכם. הקליטה הסלולרית
    באה והולכת. לפני יציאה לשביל בדקו תחזית; בעמקים האלה הגשם מגיע בדרך כלל אחר הצהריים.
  route: >-
    מגלולה צפון-מערבה במעלה הריוני — כשלושה עשר קילומטרים, שלושים דקות. מטביליסי הסך הכול 398 ק״מ, כשבע
    שעות ועשר דקות. מעבר לגלולה נגמר האספלט: הדרך חצץ ואבן, חרושה תלמים עמוקים, ובה כמה מעברי נחל שמתנפחים
    אחרי גשם. מרווח גחון גבוה והנעה כפולה הכרחיים כאן, לא רק מומלצים. תדלקו בפעם האחרונה באמברולאורי;
    התחנה באוני פועלת לסירוגין.
ar:
  name: تشيورا
  short: القرية السابقة لغيبي في منابع ريوني — مبدأ الدروب الجبلية ومَعبر قديم نحو سوانيتي السفلى.
  body: >-
    **تشيورا هي ما قبل آخر قرية في منابع نهر ريوني.** تقف بين غلولا وغيبي عند نحو 1300 متر، في المقطع
    الذي يضيق فيه الوادي بحدّة وتنحدر المنحدرات المشجّرة من الجانبين.


    القرية صغيرة: بضع عشرات من البيوت الحجرية بشرفات خشبية، وكنيسة قديمة، ومقبرة على المنحدر. السكان الدائمون
    قلّة ومعظمهم مسنّون؛ رحل الشباب إلى أوني وتبليسي، وإن كان كثيرون يعودون في الصيف. وقد أسقط زلزال 1991
    هنا أيضاً عدداً من البيوت، وبعضها ما زال على حاله.


    أهمية تشيورا جغرافية. من هنا تبدأ الدروب: شمالاً إلى النطاق الألبي، وشرقاً نحو غيبي، وغرباً عبر ممر
    قديم إلى سوانيتي السفلى باتجاه زيسخو ولنتيخي. وهذا الأخير مسار يستغرق أياماً ويستلزم خيمة وملاحة وخبرة
    حقيقية؛ ليس نزهة يوم واحد.


    وفوق القرية ينفتح المشهد. في الشمال تنتصب السلسلة الرئيسية للقوقاز الكبير بكتلتَي بوبا وتشيوخي، وفي
    الشرق نهاية وادي غيبي حيث ينطلق المشاة نحو نهرَي بوبا وتشانتشاخي الجليديين. وغيبي نفسها على بُعد خمسة
    كيلومترات.


    تحيا القرية من حزيران إلى أيلول. ومن تشرين الأول يغيب الطريق تحت الثلج وتصير تشيورا معزولة عملياً؛
    والوصول إليها شتاءً ليس أمراً يُخطَّط له.


    تشكّل تشيورا وغيبي وغلولا معاً وحدة متمايزة تُعرف باسم متاراتشا، أي «راتشا الجبلية». عاشت القرى الثلاث
    على الغنم، وكانت أقرب بعضها إلى بعض منها إلى أوني في الأسفل: لهجة خاصة، وعادات خاصة، ومراعٍ صيفية
    خاصة وراء السلسلة. وما زال ذلك يُسمع؛ فالكلام هنا يختلف اختلافاً ملحوظاً عن كلام أمبرولاوري. تصعد
    القطعان إلى النطاق الألبي في حزيران وتنزل في أواخر أيلول؛ ومن يصل في تلك الأيام سيقف على الطريق منتظراً
    خلف الغنم.
  tip: >-
    ساعتان تكفيان للقرية نفسها؛ فالمهم هنا ما يبدأ بعدها. رتّب المبيت والطعام مسبقاً: أسرتان أو ثلاث تستقبل
    الضيوف، ولا دكان البتة. ماء النبع طيب وصالح للشرب، أما الطعام فاحمله معك. تغطية الهاتف تأتي وتذهب.
    وقبل البدء بأي مسير راجع حالة الطقس؛ ففي هذه الأودية يأتي المطر عادة بعد الظهر.
  route: >-
    من غلولا شمالاً غرباً صعوداً مع ريوني — نحو ثلاثة عشر كيلومتراً، ثلاثون دقيقة. ومن تبليسي المجموع
    398 كم، أي نحو سبع ساعات وعشر دقائق. بعد غلولا ينتهي الإسفلت: الطريق حصى وحجر مفكك بأخاديد عميقة وعدة
    مخاضات تنتفخ بعد المطر. الخلوص العالي والدفع الرباعي ضروريان هنا لا مستحبَّين فحسب. خذ آخر وقود في
    أمبرولاوري، فمحطة أوني تعمل على فترات.
