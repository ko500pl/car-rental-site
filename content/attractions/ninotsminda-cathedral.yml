ka:
  name: ნინოწმინდის ტაძარი
  short: VI საუკუნის უგუმბათოდ დარჩენილი ტეტრაკონქი საგარეჯოსთან — საქართველოს ერთ-ერთი უძველესი დიდი
    ეკლესია.
  body: >-
    **ნინოწმინდა იმ იშვიათ ძეგლთაგანია, რომელიც ნანგრევადაც უფრო შთამბეჭდავია, ვიდრე ბევრი მთელი ეკლესია.**
    ის საგარეჯოდან რამდენიმე კილომეტრში, ამავე სახელწოდების სოფელშია, კახეთის მთავარი გზიდან ხედვის მანძილზე.


    ტაძარი VI საუკუნის მეორე ნახევრით თარიღდება და ტეტრაკონქია: ოთხი აფსიდი ცენტრალური სივრცის გარშემო,
    კუთხეებში ნიშებით. ეს იგივე არქიტექტურული აზრია, რაც მცხეთის ჯვარშია განხორციელებული, ოღონდ ნინოწმინდა
    უფრო დიდია და ერთი-ორი ათწლეულით ადრეული. ქართული გუმბათოვანი ხუროთმოძღვრებისთვის ეს საწყისი წერტილია.


    გუმბათი 1824 წლის მიწისძვრამ ჩამოაქცია და აღარ აღუდგენიათ. დღეს დგას აფსიდების მაღალი კედლები, ღია
    ცისკენ, ქვის კვეთის ფრაგმენტებით და XVI საუკუნის მოხატულობის ლაქებით, რომლებიც წვიმისგან სწრაფად ქრება.
    სივრცეში შესვლა უცნაური გამოცდილებაა: კედლები ეკლესიისაა, ჭერი კი ცა.


    ეზოში კიდევ ორი რამ არის:


    - **სამრეკლო** — XVI საუკუნის სამსართულიანი კოშკი, რომელიც ეპისკოპოსის სასახლედაც გამოიყენებოდა


    - **გალავანი და საეპისკოპოსო კორპუსის ნაშთები** — ნინოწმინდა ეპისკოპოსის კათედრა იყო საუკუნეების განმავლობაში


    ადგილი მოვლილია, მაგრამ არა გადაკეთებული. ტურისტული ავტობუსები აქ იშვიათად ჩერდება, რადგან უმეტესობა
    პირდაპირ თელავს ან სიღნაღს მიაშურებს. საღამოს მზე კედლების შიგნით შემოდის და ქვას თბილ ფერს აძლევს
    — ეს საუკეთესო დროა.
  tip: >-
    ერთი საათი ეზოსთვისაც და სამრეკლოსთვისაც საკმარისია. ნანგრევებში მიწა არათანაბარია და ქვები ეყრება,
    ამიტომ დახურული ფეხსაცმელი ეცვი. ტაძარი ღიაა და უფასო, ბილეთი არ არის, მაგრამ ეზოს კარი ხანდახან ჩაკეტილია
    — ამ შემთხვევაში სოფელში კლიტის მცველს ეძებენ. ჩრდილი ცოტაა. ტუალეტი და მაღაზია საგარეჯოშია, ხუთი
    კილომეტრით დასავლეთით. საკურთხეველთან ლოცვა ხდება, ხმამაღლა ნუ ისაუბრებ.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით აღმოსავლეთით საგარეჯოსკენ — 52 კმ სწრაფი ასფალტი. საგარეჯოს გავლის
    შემდეგ კიდევ ოთხიოდე კილომეტრი და მარცხნივ სოფელ ნინოწმინდაში შეუხვევ; ტაძრის კედლები გზიდანვე ჩანს.
    სულ 56 კმ, დაახლოებით ერთი საათი და ხუთი წუთი. ბოლო მონაკვეთი ვიწრო სასოფლო ასფალტია, უსწორმასწორო,
    მაგრამ გავლადი. საწვავი საგარეჯოშია. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Ninotsminda Cathedral
  short: >-
    A roofless 6th-century tetraconch near Sagarejo — one of the oldest large churches in Georgia and
    a ruin worth the detour.
  body: >-
    **Ninotsminda is one of those rare monuments that is more impressive as a ruin than many churches
    are intact.** It stands in the village of the same name a few kilometres east of Sagarejo, within
    sight of the main Kakheti road, and most travellers drive straight past it.


    The cathedral dates from the second half of the 6th century and is a tetraconch: four apses arranged
    around a central space, with niches in the corners. This is the same architectural idea realised at
    Jvari above Mtskheta, but Ninotsminda is larger and a decade or two earlier. For the history of the
    Georgian domed church, this is close to the starting point.


    The dome came down in the earthquake of 1824 and was never rebuilt. What stands now are the tall apse
    walls, open to the sky, with fragments of carving on the exterior and patches of 16th-century painting
    inside that weather a little further every winter. Walking into the space is a strange experience:
    the walls are unmistakably a church, the ceiling is weather.


    Two other things share the enclosure:


    - The **bell tower**, a three-storey structure of the 16th century that doubled as the bishop's residence


    - The **enclosure wall and remains of the episcopal buildings** — Ninotsminda was a bishop's seat
    for centuries, and its bishops carried real political weight in Kakheti


    The site is maintained but not made over. Coaches rarely stop, since most groups head straight for
    Telavi or Sighnaghi. Late afternoon is the time to come: the sun drops inside the shell of the apses
    and turns the stone warm, and the swallows nesting in the wall cavities come out to feed.


    The stone is a warm local tuff that holds late light unusually well, which is part of why the ruin
    photographs better than it has any right to.
  tip: >-
    An hour covers the enclosure and the bell tower. The ground among the ruins is uneven and strewn with
    fallen stone, so wear closed shoes. Entry is free and there is no ticket desk, but the gate is occasionally
    locked, in which case someone in the village holds the key and will open it. Shade is limited. Toilets
    and shops are in Sagarejo, five kilometres west. Services are still held at the altar on some days,
    so keep your voice down if you find people praying.
  route: >-
    Take the Kakheti highway east from Tbilisi towards Sagarejo, 52 km of fast asphalt. Continue about
    four kilometres past the town and turn left into Ninotsminda village; the cathedral walls are visible
    from the road. Total 56 km, roughly an hour and five minutes. The final stretch is narrow village
    asphalt, patched and uneven but perfectly passable. Fuel is available in Sagarejo. An economy car
    is sufficient, and the site combines easily with Manavi or with the drive on to David Gareja.
ru:
  name: Собор Ниноцминда
  short: >-
    Тетраконх VI века без купола близ Сагареджо — один из древнейших больших храмов Грузии и руина, ради
    которой стоит свернуть.
  body: >-
    **Ниноцминда — из тех редких памятников, что в виде руины впечатляют сильнее, чем многие уцелевшие
    храмы.** Собор стоит в одноимённом селе в нескольких километрах восточнее Сагареджо, в прямой видимости
    от кахетинской трассы, мимо которой почти все проезжают не останавливаясь.


    Храм датируется второй половиной VI века и представляет собой тетраконх: четыре апсиды вокруг центрального
    пространства с нишами по углам. Это та же архитектурная идея, что воплощена в мцхетском Джвари, но
    Ниноцминда крупнее и на десять-двадцать лет старше. Для истории грузинского купольного зодчества это
    почти исходная точка.


    Купол рухнул при землетрясении 1824 года и восстановлен не был. Сегодня стоят высокие стены апсид,
    открытые небу, с фрагментами резьбы снаружи и пятнами росписи XVI века внутри, которые каждую зиму
    убывают. Войти в это пространство — странный опыт: стены безошибочно церковные, а потолком служит
    погода.


    В ограде есть ещё два объекта:


    - **Колокольня** — трёхъярусное сооружение XVI века, служившее и резиденцией епископа


    - **Ограда и остатки епископских построек** — Ниноцминда веками была кафедрой, и её епископы имели
    в Кахетии реальный политический вес


    Место поддерживают, но не переделывают. Автобусы здесь почти не останавливаются: группы едут прямиком
    в Телави или Сигнахи. Приезжать лучше ближе к вечеру — солнце заходит внутрь раковины апсид, камень
    теплеет, а ласточки, гнездящиеся в кладке, вылетают на кормёжку.
  tip: >-
    Часа хватает на ограду и колокольню. Земля среди руин неровная, повсюду упавшие камни, так что обувь
    нужна закрытая. Вход свободный, кассы нет, но калитку иногда запирают — тогда ключ у кого-то в селе,
    и её откроют. Тени мало. Туалет и магазины — в Сагареджо, в пяти километрах западнее. У алтаря по
    некоторым дням служат, поэтому если застали молящихся, говорите тише.
  route: >-
    Из Тбилиси по кахетинской трассе на восток в сторону Сагареджо — 52 км быстрого асфальта. Проехав
    город, через четыре километра поверните налево в село Ниноцминда; стены собора видны прямо с дороги.
    Всего 56 км, примерно час пять. Последний участок — узкий сельский асфальт, латаный и неровный, но
    вполне проезжий. Заправка есть в Сагареджо. Машины эконом-класса достаточно, а осмотр легко совмещается
    с Манави или с дальнейшей дорогой в Давид-Гареджи.
fa:
  name: کلیسای جامع نینوتسمیندا
  short: بنایی چهارلختی از سدهٔ ششم و بی‌گنبد نزدیک ساگارجو — از کهن‌ترین کلیساهای بزرگ گرجستان و ویرانه‌ای
    ارزشمند.
  body: >-
    **نینوتسمیندا از آن یادمان‌های کمیاب است که در ویرانی از بسیاری کلیساهای سالم گیراتر است.** در روستایی
    به همین نام، چند کیلومتری شرق ساگارجو و در دید جادهٔ اصلی کاختی ایستاده است، و بیشتر مسافران بی‌توقف
    از کنارش می‌گذرند.


    این کلیسا به نیمهٔ دوم سدهٔ ششم بازمی‌گردد و نقشه‌اش چهارلختی است: چهار نیم‌دایره پیرامون فضایی مرکزی
    با طاقچه‌هایی در گوشه‌ها. همان اندیشهٔ معماری که در کلیسای جواری بالای متسختا اجرا شده، اما نینوتسمیندا
    بزرگ‌تر است و یکی دو دهه کهن‌تر. برای تاریخ کلیسای گنبددار گرجی، این تقریباً نقطهٔ آغاز است.


    گنبد در زمین‌لرزهٔ 1824 فرو ریخت و هرگز بازسازی نشد. آنچه امروز برپاست دیوارهای بلند نیم‌دایره‌هاست،
    رو به آسمان باز، با پاره‌های کنده‌کاری در بیرون و لکه‌هایی از نقاشی سدهٔ شانزدهم در درون که هر زمستان
    اندکی کم‌تر می‌شود. ورود به این فضا تجربه‌ای غریب است: دیوارها بی‌تردید کلیسا هستند و سقف، آسمان.


    درون محوطه دو چیز دیگر هم هست:


    - **برج ناقوس**، بنایی سه‌طبقه از سدهٔ شانزدهم که اقامتگاه اسقف نیز بوده است


    - **دیوار محوطه و بازمانده‌های ساختمان‌های اسقفی** — نینوتسمیندا قرن‌ها کرسی اسقف بود و اسقفانش در
    کاختی وزن سیاسی واقعی داشتند


    محوطه نگهداری می‌شود اما دستکاری نشده است. اتوبوس‌ها به‌ندرت اینجا می‌ایستند چون گروه‌ها یکراست به
    تلاوی یا سیغناغی می‌روند. بهترین زمان اواخر بعدازظهر است: آفتاب به درون کاسهٔ نیم‌دایره‌ها می‌افتد،
    سنگ گرم‌رنگ می‌شود و پرستوهایی که در حفره‌های دیوار لانه دارند برای شکار بیرون می‌آیند.
  tip: >-
    یک ساعت برای محوطه و برج ناقوس کافی است. زمین میان ویرانه‌ها ناهموار و پر از سنگ‌های فروریخته است،
    پس کفش بسته بپوشید. ورود رایگان است و گیشه‌ای در کار نیست، اما گاه دروازه قفل است و در آن صورت کلید
    نزد کسی در روستاست و باز می‌کند. سایه کم است. سرویس بهداشتی و مغازه در ساگارجو، پنج کیلومتری غرب،
    هست. برخی روزها کنار محراب مراسم برگزار می‌شود، پس اگر نمازگزاران را دیدید صدایتان را پایین بیاورید.
  route: >-
    از تفلیس بزرگراه کاختی را به شرق تا ساگارجو بگیرید، 52 کیلومتر آسفالت روان. حدود چهار کیلومتر پس از
    شهر به چپ و به روستای نینوتسمیندا بپیچید؛ دیوارهای کلیسا از جاده پیداست. جمعاً 56 کیلومتر و نزدیک
    یک ساعت و پنج دقیقه. بخش پایانی آسفالت باریک روستایی است، وصله‌دار و ناهموار اما کاملاً قابل عبور.
    سوخت در ساگارجو هست. خودروی اقتصادی کافی است و این توقف به‌آسانی با مانافی یا با ادامهٔ راه به داویت
    گارجا ترکیب می‌شود.
he:
  name: קתדרלת נינוצמינדה
  short: מבנה ארבע-קונכיות מן המאה השישית שאיבד את כיפתו, ליד סגרג'ו — מהכנסיות הגדולות העתיקות בגאורגיה.
  body: >-
    **נינוצמינדה היא אחד מאותם מונומנטים נדירים שכחורבה הם מרשימים יותר מכנסיות שלמות רבות.** היא עומדת
    בכפר בעל אותו שם, כמה קילומטרים ממזרח לסגרג'ו ובטווח ראייה מכביש קחתי הראשי, ורוב הנוסעים חולפים על
    פניה.


    הקתדרלה מתוארכת למחצית השנייה של המאה השישית ותוכניתה ארבע-קונכיות: ארבע אפסידות סביב חלל מרכזי, עם
    גומחות בפינות. זהו אותו רעיון אדריכלי שמומש בג'ווארי שמעל מצחתה, אלא שנינוצמינדה גדולה יותר ומוקדמת
    בעשור או שניים. עבור תולדות הכנסייה המקומרת בגאורגיה זו כמעט נקודת ההתחלה.


    הכיפה קרסה ברעידת האדמה של 1824 ומעולם לא נבנתה מחדש. מה שעומד היום הוא קירות האפסידות הגבוהים, פתוחים
    לשמים, עם שברי גילוף בחוץ וכתמי ציור מן המאה ה-16 בפנים שנשחקים עוד קצת בכל חורף. הכניסה אל החלל הזה
    היא חוויה מוזרה: הקירות הם ללא ספק כנסייה, והתקרה היא מזג האוויר.


    בתוך המתחם עומדים עוד שני דברים:


    - **מגדל הפעמונים**, מבנה תלת-קומתי מן המאה ה-16 ששימש גם כמעון הבישוף


    - **חומת המתחם ושרידי מבני הבישופות** — נינוצמינדה הייתה מושב בישוף במשך מאות שנים, ולבישופיה היה
    משקל פוליטי ממשי בקחתי


    האתר מתוחזק אך לא עוצב מחדש. אוטובוסים כמעט אינם עוצרים כאן, שכן קבוצות ממהרות לטלאווי או לסיגנאגי.
    שעת אחר הצהריים המאוחרת היא הזמן הנכון: השמש נכנסת אל תוך קליפת האפסידות, האבן מתחממת בגוון, והסנוניות
    המקננות בחללי הקיר יוצאות לצוד.
  tip: >-
    שעה מכסה את המתחם ואת מגדל הפעמונים. הקרקע בין ההריסות אינה אחידה ומפוזרות בה אבנים שנפלו, לכן נעלו
    נעליים סגורות. הכניסה חינם ואין קופה, אך השער נעול לפעמים ואז המפתח מוחזק אצל מישהו בכפר שיפתח. הצל
    מועט. שירותים וחנויות נמצאים בסגרג'ו, חמישה קילומטרים ממערב. בימים מסוימים מתקיימת תפילה ליד המזבח,
    אז אם נתקלתם במתפללים הנמיכו קול.
  route: >-
    סעו מטביליסי מזרחה בכביש קחתי לכיוון סגרג'ו, 52 ק״מ אספלט מהיר. המשיכו כארבעה קילומטרים אחרי העיירה
    ופנו שמאלה אל הכפר נינוצמינדה; קירות הקתדרלה נראים מהכביש. בסך הכול 56 ק״מ, כשעה וחמש דקות. הקטע האחרון
    הוא אספלט כפרי צר, מטולא ולא אחיד אך עביר לגמרי. דלק יש בסגרג'ו. רכב חסכוני מספיק, והאתר משתלב בקלות
    עם מנאווי או עם המשך הנסיעה לדוד גארג'ה.
ar:
  name: كاتدرائية نينوتسميندا
  short: بناء رباعي الحنايا من القرن السادس فقد قبته قرب ساغاريجو — من أقدم الكنائس الكبرى في جورجيا.
  body: >-
    **نينوتسميندا من تلك الآثار النادرة التي تبقى في خرابها أشد وقعاً من كنائس كثيرة سليمة.** تقوم في
    قرية تحمل الاسم نفسه على بعد كيلومترات شرق ساغاريجو وفي مرمى البصر من طريق كاخيتي الرئيسي، ومعظم المسافرين
    يمرون بها دون توقف.


    تعود الكاتدرائية إلى النصف الثاني من القرن السادس ومخططها رباعي الحنايا: أربع حنايا حول فراغ مركزي
    مع كوّات في الأركان. وهي الفكرة المعمارية نفسها التي تحققت في كنيسة جواري فوق متسخيتا، غير أن نينوتسميندا
    أكبر وأسبق بعقد أو عقدين. وهي في تاريخ الكنيسة المقبّبة الجورجية قريبة من نقطة البداية.


    سقطت القبة في زلزال عام 1824 ولم يُعد بناؤها قط. وما يقف اليوم جدران الحنايا العالية مفتوحة على السماء،
    وعليها من الخارج بقايا نقش، ومن الداخل بقع تصوير من القرن السادس عشر تتآكل قليلاً كل شتاء. والدخول
    إلى هذا الفراغ تجربة غريبة: الجدران كنيسة بلا شك، والسقف طقس.


    وفي المحوطة أمران آخران:


    - **برج الأجراس**، بناء من ثلاث طبقات من القرن السادس عشر كان يُستعمل مقراً للأسقف أيضاً


    - **السور وبقايا مباني الأسقفية** — كانت نينوتسميندا كرسياً أسقفياً قروناً، وكان لأساقفتها ثقل سياسي
    حقيقي في كاخيتي


    الموقع مصان لكنه لم يُعَد تشكيله. ونادراً ما تتوقف الحافلات هنا لأن المجموعات تقصد تيلافي أو سيغناغي
    مباشرة. وأفضل وقت هو آخر النهار: تدخل الشمس داخل صدفة الحنايا فيدفأ لون الحجر، وتخرج السنونوات التي
    تعشش في تجاويف الجدار للصيد.
  tip: >-
    ساعة تكفي للمحوطة وبرج الأجراس. الأرض بين الأنقاض غير مستوية ومتناثر عليها حجر ساقط، فالبس حذاءً مغلقاً.
    الدخول مجاني ولا شباك تذاكر، لكن البوابة تُقفل أحياناً، والمفتاح عندئذ لدى أحد أهل القرية ويفتحها.
    والظل قليل. ودورات المياه والمتاجر في ساغاريجو على بعد خمسة كيلومترات غرباً. وتُقام صلوات عند المذبح
    في بعض الأيام، فإن وجدت مصلين فاخفض صوتك.
  route: >-
    اسلك طريق كاخيتي شرقاً من تبليسي نحو ساغاريجو، 52 كم من الإسفلت السريع. تابع نحو أربعة كيلومترات بعد
    البلدة ثم انعطف يساراً إلى قرية نينوتسميندا؛ وجدران الكاتدرائية تُرى من الطريق. المجموع 56 كم ونحو
    ساعة وخمس دقائق. آخر مقطع إسفلت قروي ضيق مرقّع وغير مستوٍ لكنه سالك تماماً. والوقود متوفر في ساغاريجو.
    سيارة اقتصادية تكفي، ويسهل ضم الموقع إلى مانافي أو إلى متابعة الطريق نحو دافيت غاريجا.
