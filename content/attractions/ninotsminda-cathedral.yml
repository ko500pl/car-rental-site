ka:
  name: ნინოწმინდის ტაძარი
  short: >-
    VI საუკუნის ტაძარი, ჯვარზე ადრე აგებული და მიწისძვრებისგან დანგრეული — დღეს დედათა მონასტერია გალავნის
    შიგნით, საგარეჯოს დასავლეთ კიდეზე.
  body: >-
    **ჯვარი მცხეთის თავზე ჯერ არ აღმართულიყო, როცა მისი ჩანაფიქრი აქ, საგარეჯოს დასავლეთ კიდეზე, უკვე
    ქვად იდგა.**


    ნინოწმინდის ტაძარი დაახლოებით 575 წელს აიგო და ქართული ხუროთმოძღვრების ერთ-ერთი პირველი დიდი ცდაა:
    ცენტრული გეგმა, კუთხის ნიშებით შემოსაზღვრული რვაწახნაგა გული — ის ოთხაფსიდიანი ჩანაფიქრი, რომელიც
    ერთი თაობის შემდეგ ჯვარმა განადიდა. ტაძარი X–XI საუკუნეებში შეაკეთეს, მერე კიდევ — 1671 და 1774 წლებში.
    ბოლოს მიწამ თქვა თავისი: 1824 და 1848 წლების მიწისძვრებმა ის დაანგრია და მას შემდეგ აღარავის აუშენებია.


    ბევრს ნუ მოელით. სრულ სიმაღლეზე მხოლოდ აღმოსავლეთის აფსიდა დგას — მოხრილი კედელი, რომელსაც კამარის
    ნაცვლად ცა ახურავს, — მის პირისპირ კი, ბალახის გადაღმა, დასავლეთის კედლის ნაწილი. მათ შორის ფეხქვეშ
    დაიხედეთ: საძირკვლის ნაკვალევი დღესაც ხაზავს იმ რვაწახნაგას, რომელსაც ოდესღაც გუმბათი ეყრდნობოდა.


    ეზოს დანარჩენი ნაწილი სხვა, უფრო მკაცრ ეპოქას ეკუთვნის. აგურის დიდი სამრეკლო კახთა მეფე ლევანის (1520–1574)
    დროს აიგო; მისი ქვედა სამი სართული საცხოვრებელი იყო და თითოეულ სართულს თავისი ბუხარი ჰქონდა. ფასადზე
    აგური კიბისებრად, გეომეტრიულ ორნამენტად აწყვია, კარს კი შეისრული თაღი ადგას — სეფიანთა ირანის გემოვნება,
    იმ იმპერიისა, რომლის ჩრდილიც XVI საუკუნის კახეთს თავზე ადგა. ყველაფერს XVI–XVII საუკუნეების გალავანი
    ერტყმის, კუთხის კოშკებითა და ქონგურებით; ჭიშკრის თავზე ფუტკრის სკასავით მომრგვალებული სალოდეები დღესაც
    მტერს ელოდება.


    დღეს ნინოწმინდა დედათა მონასტერია. მონაზვნები ეზოს უვლიან, აღდგენითი სამუშაოები მიმდინარეობს და ნანგრევი
    კვლავ ცოცხალი ცხოვრების ნაწილი გახდა.


    დღის ბოლოს აფსიდაში დადექით. VI საუკუნის კედელი, ცის ქვეშ დარჩენილი, დღესაც იმას აკეთებს, რისთვისაც
    ააშენეს: სინათლეს აგროვებს.
  tip: >-
    აფსიდის, სამრეკლოსა და გალავნის დასათვალიერებლად ერთი საათი საკმარისია. ეს მოქმედი დედათა მონასტერია,
    ამიტომ ისე ჩაიცვით, როგორც ნებისმიერ ქართულ მონასტერში: მხრები და მუხლები დაფარული უნდა იყოს, ქალებს
    კი კაბა და თავსაფარი გამოადგებათ. ხმადაბლა ისაუბრეთ და მონაზვნების გადაღებამდე ნებართვა ითხოვეთ. შესვლა
    უფასოა. ნანგრევებს შორის მიწა უსწორმასწოროა და ქვით მოფენილი, ამიტომ დახურული ფეხსაცმელი აჯობებს;
    აღდგენითი სამუშაოების გამო ტერიტორიის ნაწილი შეიძლება შემოღობილი დაგხვდეთ. კაფე, მაღაზია და ტუალეტი
    საგარეჯოშია, სამი კილომეტრით აღმოსავლეთით. საუკეთესო დრო მზის ჩასვლის წინაა, როცა დახრილი სხივები
    აფსიდაში შედის.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) გადით. ვაზიანის გავლით, დაახლოებით 26-ე კილომეტრზე, მარჯვნივ,
    გასასვლელით, საგარეჯოს ძველ გზაზე (შ212) გადაუხვიეთ — ის სოფლებს გვერდს კი არ უვლის, შუაგულში გადის.
    ცოტა ხანში მარცხნივ გომბორის გზა (შ38) გაიყოფა; თქვენ შ212-ს გაჰყევით. ნინოწმინდა საგარეჯომდე ბოლო
    სოფელია, ორიენტირი კი აგურის მაღალი სამრეკლოა. სულ 46 კილომეტრი, დაახლოებით 50 წუთი, მთელ გზაზე ასფალტი.
    საწვავი საგარეჯოშია, სამი კილომეტრით წინ. ეკონომ-კლასის მანქანა სავსებით საკმარისია. მანავის ციხე
    აქედან აღმოსავლეთით ოციოდე წუთის სავალზეა.
en:
  name: Ninotsminda Cathedral
  short: >-
    A 6th-century cathedral older than Jvari, felled by earthquakes, now kept by nuns inside a fortified
    wall on the western edge of Sagarejo.
  body: >-
    **Before Jvari rose above Mtskheta, its idea was already standing here, on the western edge of Sagarejo.**


    Ninotsminda, whose name honours Saint Nino, was built around 575 and is one of the first great experiments
    of Georgian church building: a centralised plan, an octagonal core ringed by corner niches, the four-apsed
    scheme that Jvari would make famous a generation later. Masons repaired it in the 10th and 11th centuries,
    and again in 1671 and 1774. Then the earth had its say. Earthquakes in 1824 and 1848 brought the church
    down, and no one rebuilt it.


    Be ready for how little is left. Only the eastern apse still stands to its full height, a curved wall
    with open sky where the vault should be, and a stretch of the western wall faces it across the grass.
    Between them, look at your feet: the outline of the old foundations still traces the octagon that
    once carried the dome.


    The rest of the enclosure belongs to a later, harder age. The great brick bell tower went up in the
    reign of King Levan of Kakheti (1520–1574), and its lower three storeys were a house, each floor with
    its own fireplace. Its bricks are staggered into geometric patterns and its doorway ends in a pointed
    arch: the taste of Safavid Persia, the empire whose shadow lay across sixteenth-century Kakheti. Around
    everything runs a 16th–17th-century fortified wall with corner towers and battlements, and above the
    gate, beehive-shaped machicolations still wait for attackers.


    Today Ninotsminda is a convent. Nuns keep the yard, restoration is under way, and the ruin belongs
    once more to a working life.


    Stand in the apse at the end of the day. A sixth-century wall, open to the weather, still does what
    it was built to do: it gathers the light.
  tip: >-
    An hour is enough for the apse, the bell tower and a slow circuit of the walls. This is a working
    convent, so dress as for any Georgian monastery: shoulders and knees covered, and women will be most
    comfortable in a skirt and headscarf. Keep your voice low and ask before photographing the nuns. Entry
    is free. Among the ruins the ground is uneven and littered with stone, so wear closed shoes, and expect
    parts of the site to be fenced off while restoration continues. Cafés, shops and toilets are in Sagarejo,
    three kilometres east. Come late in the afternoon, when the low sun reaches into the apse.
  route: >-
    Leave Tbilisi on the S5 Kakheti highway. Just past Vaziani, about 26 km out, take the exit on the
    right for the old Sagarejo road (Sh212), which runs through the villages instead of bypassing them.
    Soon afterwards the Sh38 to Gombori branches off to the left; stay on the Sh212. Ninotsminda is the
    last village before Sagarejo, and the tall brick bell tower is your landmark. The trip is 46 km, about
    50 minutes, on asphalt all the way. Fuel is in Sagarejo, three kilometres further on. An economy car
    is all you need. Manavi fortress is about twenty minutes further east.
ru:
  name: Ниноцминдский собор
  short: >-
    Собор VI века, старше Джвари, разрушенный землетрясениями, ныне под опекой монахинь за крепостной
    стеной на западной окраине Сагареджо.
  body: >-
    **Прежде чем Джвари поднялся над Мцхетой, его замысел уже стоял здесь, на западной окраине Сагареджо.**


    Ниноцминда, чьё имя чтит святую Нино, была построена около 575 года и является одним из первых великих
    экспериментов грузинского храмового зодчества: центрический план, восьмигранное ядро, окружённое угловыми
    нишами, — четырёхапсидная схема, которую поколением позже сделает знаменитой Джвари. Каменщики ремонтировали
    её в X и XI веках, и снова в 1671 и 1774 годах. Затем своё слово сказала земля. Землетрясения 1824
    и 1848 годов обрушили церковь, и её больше не восстановили.


    Будьте готовы к тому, как мало здесь осталось. Лишь восточная апсида стоит во всю свою высоту — изогнутая
    стена с открытым небом там, где должен быть свод, — а напротив неё через траву тянется отрезок западной
    стены. Между ними взгляните себе под ноги: по очертаниям старых фундаментов до сих пор читается восьмиугольник,
    некогда несший купол.


    Остальная часть ограды принадлежит более поздней и более жёсткой эпохе. Огромная кирпичная колокольня
    возведена в правление кахетинского царя Левана (1520–1574), и её нижние три этажа служили жильём,
    у каждого этажа был свой камин. Кирпичи выложены уступами в геометрические узоры, а её дверной проём
    завершается стрельчатой аркой — вкус сефевидской Персии, империи, чья тень лежала на Кахетии XVI века.
    Всё это окружено крепостной стеной XVI–XVII веков с угловыми башнями и зубцами, а над воротами до
    сих пор ждут врагов машикули в форме улья.


    Сегодня Ниноцминда — женский монастырь. Монахини следят за двором, реставрация продолжается, и руины
    снова живут обычной монастырской жизнью.


    Постойте в апсиде на закате дня. Стена VI века, открытая всем ветрам, до сих пор делает то, для чего
    была построена: она собирает свет.
  tip: >-
    Часа достаточно на апсиду, колокольню и неспешный обход стен. Это действующий женский монастырь, так
    что одевайтесь так, как принято в любом грузинском монастыре: плечи и колени закрыты, а женщинам удобнее
    всего будет в юбке и платке. Говорите тише и спрашивайте разрешения, прежде чем фотографировать монахинь.
    Вход бесплатный. Среди руин земля неровная и завалена камнями, так что наденьте закрытую обувь, и
    учтите, что часть территории может быть огорожена во время реставрации. Кафе, магазины и туалеты —
    в Сагареджо, в трёх километрах к востоку. Приезжайте под вечер, когда низкое солнце заглядывает в
    апсиду.
  route: >-
    Выезжайте из Тбилиси по Кахетинскому шоссе S5. Сразу за Вазиани, примерно через 26 км, съезжайте направо
    на старую дорогу на Сагареджо (Sh212), которая идёт через сёла, а не в обход них. Немного дальше слева
    отходит Sh38 на Гомбори; оставайтесь на Sh212. Ниноцминда — последнее село перед Сагареджо, и высокая
    кирпичная колокольня служит ориентиром. Весь путь — 46 км, около 50 минут, дорога асфальтирована на
    всём протяжении. Заправка — в Сагареджо, в трёх километрах дальше. Машины эконом-класса вполне достаточно.
    Крепость Манави — примерно двадцать минут дальше на восток.
fa:
  name: کلیسای جامع نینوتسمیندا
  short: >-
    کلیسای جامعی از سده‌ی ششم، کهن‌تر از جواری، ویران‌شده در زمین‌لرزه‌ها؛ اکنون راهبه‌ها درون باروی آن
    در کناره‌ی باختری ساگارجو نگاهبانش هستند.
  body: >-
    **پیش از آن‌که جواری بر فراز متسختا سر برافرازد، اندیشه‌ی آن پیش‌تر همین‌جا، بر کناره‌ی باختریِ ساگارجو،
    برپا بود.**


    نینوتسمیندا، که نامش یادآورِ قدیسه نینو است، در حدود سال ۵۷۵ ساخته شد و یکی از نخستین آزمایش‌های بزرگ
    معماری کلیسایی گرجی است: طرحی متمرکز، هسته‌ای هشت‌ضلعی که با طاق‌نماهای گوشه احاطه شده — همان شیوه‌ی
    چهارآپسه‌ای که جواری یک نسل بعد آن را نامدار خواهد کرد. سنگ‌تراشان آن را در سده‌های دهم و یازدهم و
    دوباره در سال‌های ۱۶۷۱ و ۱۷۷۴ بازساختند. سپس زمین سخن خود را گفت. زمین‌لرزه‌های ۱۸۲۴ و ۱۸۴۸ کلیسا
    را فروریختند، و کسی آن را بازنساخت.


    آماده باشید: از آن بسیار اندک باقی مانده است. تنها آپسِ خاوری هنوز به بلندای کامل خود ایستاده، دیواری
    خمیده با آسمانی باز در جایی که باید طاق می‌بود، و پاره‌ای از دیوار باختری روبه‌رویش، آن‌سوی چمن‌ها.
    میان آن‌ دو، به زیر پا نگاه کنید: هنوز خطِ بنیادهای کهن، هشت‌ضلعی‌ای را نشان می‌دهد که روزگاری گنبد
    را بر دوش داشت.


    باقیِ حصار به دورانی دیرتر و سخت‌تر تعلق دارد. برجِ ناقوسیِ بزرگِ آجری در دورانِ پادشاهیِ لوان، شاه
    کاختی (۱۵۲۰–۱۵۷۴)، برافراشته شد، و سه طبقه‌ی زیرینش خانه‌ای بود، هر طبقه با بخاریِ خود. آجرهایش به‌شکلی
    پله‌ای در نقش‌های هندسی چیده شده‌اند و درگاهش به طاقی نوک‌تیز می‌رسد: ذوقِ ایرانِ صفوی، امپراتوری‌ای
    که سایه‌اش بر کاختیِ سده‌ی شانزدهم افتاده بود. گرداگردِ همه، دیواری استوار از سده‌های شانزدهم و هفدهم
    با برج‌های گوشه و کنگره‌ها می‌گذرد، و بالای دروازه، روزن‌های دفاعیِ کندومانند (ماشیکولی) هنوز به انتظارِ
    هجومگرانند.


    امروز نینوتسمیندا صومعه‌ای زنانه است. راهبه‌ها به حیاط رسیدگی می‌کنند، بازسازی در جریان است، و ویرانه
    دوباره با زندگیِ روزمره‌ی صومعه جان گرفته است.


    در پایانِ روز در آپس بایستید. دیواری از سده‌ی ششم، باز به هوای آزاد، هنوز همان کاری را می‌کند که برایش
    ساخته شد: نور را می‌گیرد.
  tip: >-
    یک ساعت برای آپس، برج ناقوسی و گشتی آرام گردِ دیوارها کافی است. این صومعه‌ای فعال است، پس همان‌گونه
    بپوشید که برای هر صومعه‌ی گرجی: شانه و زانو پوشیده، و زنان در دامن و روسری راحت‌ترند. آهسته سخن بگویید
    و پیش از عکس‌گرفتن از راهبه‌ها اجازه بخواهید. ورود رایگان است. میانِ ویرانه‌ها زمین ناهموار و پر از
    سنگ است، پس کفشِ بسته بپوشید، و انتظار داشته باشید بخش‌هایی از محل تا زمانی که بازسازی ادامه دارد
    محصور باشد. کافه، مغازه و سرویس بهداشتی در ساگارجو، سه کیلومتر خاورتر، هستند. اواخر بعدازظهر بیایید،
    وقتی خورشیدِ مایلِ عصر به درونِ آپس می‌رسد.
  route: >-
    از تفلیس در بزرگراه کاختی S5 حرکت کنید. اندکی پس از وازیانی، حدود ۲۶ کیلومتر آن‌سوتر، از خروجیِ سمتِ
    راست به راه کهنِ ساگارجو (Sh212) بروید که از میانِ روستاها می‌گذرد و نه در دورِ آن‌ها. اندکی پس از
    آن، Sh38 به‌سوی گومبوری از چپ جدا می‌شود؛ بر Sh212 بمانید. نینوتسمیندا آخرین روستا پیش از ساگارجو
    است، و برجِ بلندِ آجری نشانه‌ی شماست. سفر ۴۶ کیلومتر است، حدود ۵۰ دقیقه، تمامِ راه آسفالته. سوخت در
    ساگارجو، سه کیلومتر آن‌سوتر است. یک خودروی معمولی کافی است. دژِ ماناوی حدود بیست دقیقه دیگر به سوی
    خاور است.
he:
  name: קתדרלת נינוצמינדה
  short: >-
    קתדרלה מהמאה השישית, עתיקה מג'וורי, שנהרסה ברעידות אדמה, ונשמרת כיום בידי נזירות בתוך חומה מבוצרת
    בקצה המערבי של סאגארג'ו.
  body: >-
    **לפני שג'וורי התנשא מעל מצחתה, הרעיון שלו כבר עמד כאן, בקצה המערבי של סאגארג'ו.**


    נינוצמינדה, ששמה מכבד את הקדושה נינו, נבנתה בסביבות שנת 575 והיא אחד הניסויים הגדולים הראשונים באדריכלות
    הכנסייתית הגאורגית: תכנית מרכזית, גרעין תמניוני מוקף בגומחות פינה — תבנית ארבע האפסידות שג'וורי יפרסם
    דור אחר כך. בנאים תיקנוה במאות ה-10 וה-11, ושוב ב-1671 וב-1774. ואז האדמה אמרה את דברה. רעידות האדמה
    של 1824 ו-1848 הפילו את הכנסייה, ואיש לא שיקם אותה.


    דעו מראש: נותר כאן מעט מאוד. רק האפסיס המזרחי עדיין עומד בגובהו המלא, קיר מעוקל עם שמיים פתוחים במקום
    שבו היה אמור להיות הקמרון, וקטע מהקיר המערבי פונה אליו מעבר לדשא. ביניהם, הביטו למרגלותיכם: קווי היסודות
    הישנים עדיין משרטטים את התמניון שנשא פעם את הכיפה.


    שאר המתחם משתייך לתקופה מאוחרת וקשוחה יותר. מגדל הפעמונים הגדול מלבנים נבנה בתקופת שלטונו של לבאן,
    מלך קאחתי (1520–1574), ושלוש קומותיו התחתונות שימשו כבית מגורים, כל קומה עם אח משלה. לבניו מסודרות
    בדירוג ליצירת דגמים גאומטריים, ופתחו מסתיים בקשת מחודדת: הטעם של פרס הצפווית, האימפריה שצלה היה מוטל
    על קאחתי של המאה ה-16. הכול מוקף בחומה מבוצרת מהמאות ה-16–17 עם מגדלי פינה ושיני חומה, ומעל השער,
    מזחלות בצורת כוורת עדיין מצפות לתוקפים.


    כיום נינוצמינדה היא מנזר נשים. הנזירות שומרות על החצר, שיקום נמשך, וההריסות שבות לחיות את חיי המנזר
    היומיומיים.


    עמדו באפסיס בסוף היום. קיר מהמאה השישית, חשוף לשמש ולרוח, עדיין עושה את מה שנבנה לעשות: הוא אוסף את
    האור.
  tip: >-
    שעה אחת מספיקה לאפסיס, למגדל הפעמונים ולסיבוב איטי לאורך החומות. זה מנזר נשים פעיל, אז התלבשו כמו
    בכל מנזר גאורגי: כתפיים וברכיים מכוסות, ונשים ירגישו הכי בנוח בחצאית ובכיסוי ראש. שמרו על קול נמוך
    ובקשו רשות לפני צילום הנזירות. הכניסה חופשית. בין ההריסות הקרקע משובשת וזרועה אבנים, אז נעלו נעליים
    סגורות, וצפו שחלקים מהאתר יהיו מגודרים בזמן שהשיקום ממשיך. בתי קפה, חנויות ושירותים נמצאים בסאגארג'ו,
    שלושה קילומטרים מזרחה. הגיעו לפנות ערב, כשהשמש הנמוכה מגיעה לתוך האפסיס.
  route: >-
    צאו מטביליסי בכביש קאחתי S5. מעט אחרי וואזיאני, כ-26 ק"מ, צאו ביציאה הימנית לכביש סאגארג'ו הישן (Sh212),
    העובר בין הכפרים ולא עוקף אותם. קצת אחר כך מסתעף שמאלה Sh38 לגומבורי; הישארו על Sh212. נינוצמינדה
    הוא הכפר האחרון לפני סאגארג'ו, ומגדל הפעמונים הגבוה מלבנים הוא נקודת הציון שלכם. הנסיעה היא 46 ק"מ,
    כ-50 דקות, סלולה לכל אורכה. דלק נמצא בסאגארג'ו, שלושה קילומטרים נוספים. רכב רגיל מספיק בהחלט. מצודת
    מנאווי היא כעשרים דקות נוספות מזרחה.
ar:
  name: كاتدرائية نينوتسميندا
  short: >-
    كاتدرائية من القرن السادس أقدم من جفاري، هدمتها الزلازل، وترعاها اليوم راهبات داخل سور محصّن على الحافة
    الغربية لساغاريجو.
  body: >-
    **قبل أن يرتفع جفاري فوق متسخيتا، كانت فكرته قائمة هنا من قبل، على الحافة الغربية لساغاريجو.**


    بُنيت نينوتسميندا، التي يكرّم اسمها القديسة نينو، نحو عام 575، وهي واحدة من أوائل التجارب الكبرى في
    العمارة الكنسية الجورجية: مخطط مركزي، ونواة مثمنة تحيط بها حنايا زاوية — نظام الحنيات الأربع الذي
    سيجعله جفاري مشهورًا بعد جيل. رمّمها البنّاؤون في القرنين العاشر والحادي عشر، ومرة أخرى في 1671 و1774.
    ثم قالت الأرض كلمتها. هدمت الكنيسةَ زلازلُ عامي 1824 و1848، ولم يُعِد بناءها أحد.


    لا تتوقّع الكثير، فما تبقّى قليل. لم تبقَ إلا الحنية الشرقية واقفة بارتفاعها الكامل، جدار منحن مع
    سماء مفتوحة حيث كان ينبغي أن يكون العقد (نصف القبة)، وامتداد من الجدار الغربي يقابلها عبر العشب. بينهما،
    انظر إلى قدميك: لا يزال مخطط الأساسات القديمة يرسم المثمّن الذي حمل القبة يومًا.


    وينتمي باقي المجمّع إلى عصر أحدث وأقسى. أُقيم برج الجرس الكبير من الآجر في عهد ملك كاخيتي ليفان (1520–1574)،
    وكانت طبقاته الثلاث السفلى بيتًا، لكل طبقة مِدفأتها الخاصة. آجره مصفوف بتدرّج في أنماط هندسية، وينتهي
    بابه بقوس مدبّب: طابع فارس الصفوية، الإمبراطورية التي امتد ظلها على كاخيتي في القرن السادس عشر. ويحيط
    بكل ذلك سور محصّن من القرنين السادس عشر والسابع عشر بأبراج زاوية وشرافات، وفوق البوابة لا تزال فتحات
    دفاعية على شكل خلية نحل تنتظر المهاجمين.


    نينوتسميندا اليوم دير للراهبات. تعتني الراهبات بالساحة، والترميم مستمر، وعادت الأطلال تنبض بحياة الدير
    من جديد.


    قف في الحنية عند نهاية اليوم. جدار من القرن السادس، مكشوف للطبيعة، ما زال يفعل ما بُني من أجله: يجمع
    الضوء.
  tip: >-
    تكفي ساعة واحدة للحنية وبرج الجرس ودورة هادئة حول الأسوار. هذا دير عامر للراهبات، فارتدِ ما ترتديه
    في أي دير جورجي: الكتفان والركبتان مغطاتان، وستكون النساء أكثر راحة بتنورة وغطاء رأس. تحدّث بصوت خفيض
    واطلب الإذن قبل تصوير الراهبات. الدخول مجاني. بين الأنقاض الأرض غير مستوية ومليئة بالحجارة، فارتدِ
    حذاءً مغلقًا، وتوقّع أن تكون أجزاء من الموقع مسيّجة أثناء استمرار الترميم. المقاهي والمتاجر ودورات
    المياه في ساغاريجو، على ثلاثة كيلومترات شرقًا. تعال في أواخر بعد الظهر، حين تصل الشمس المنخفضة إلى
    داخل الحنية.
  route: >-
    اخرج من تبليسي على طريق كاخيتي السريع S5. بعد فازياني بقليل، على نحو 26 كم، اسلك المخرج الأيمن إلى
    طريق ساغاريجو القديم (Sh212)، الذي يمر عبر القرى بدلًا من الالتفاف حولها. بعد ذلك بقليل يتفرّع Sh38
    نحو غومبوري يسارًا؛ تابع على Sh212. نينوتسميندا هي آخر قرية قبل ساغاريجو، وبرج الجرس الآجري العالي
    هو معلمك. الرحلة 46 كم، نحو 50 دقيقة، معبّدة بالكامل. الوقود في ساغاريجو، على ثلاثة كيلومترات أخرى.
    تكفي سيارة اقتصادية. تقع قلعة مانافي على نحو عشرين دقيقة أخرى شرقًا.
