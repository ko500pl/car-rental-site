ka:
  name: აბასთუმანი
  short: >-
    ფიჭვნარიანი ხეობის ძველი კურორტი 1 340 მეტრზე: ცხელი წყაროები, დიდი მთავრის ნაკვალევი და ნესტეროვის
    მოხატული „ახალი ზარზმა“.
  body: >-
    **აბასთუმანი დიაგნოზზე აშენდა: ამ ვიწრო, ფიჭვნარიან ხეობაში მშრალ ჰაერსა და ცხელ წყაროებს ექიმები
    მანამდე უწერდნენ ავადმყოფებს, სანამ აქ ვინმე ტელესკოპში ჩაიხედავდა.**


    დაბა ზღვის დონიდან 1 340 მეტრზე, მდინარე ოცხის ხეობაში, მესხეთის ქედის სამხრეთ კალთაზე მდებარეობს.
    ქართული გადმოცემა მის დასაბამს ოძრახოსს, ქართლოსის შთამომავალს, უკავშირებს, შუა საუკუნეების ოძრხის
    მხარემ კი სახელი ციხისგან მიიღო, რომლის ნანგრევებიც დღესაც ახლომახლო დგას. XVI საუკუნიდან, ოსმალთა
    ბატონობისას, ხეობა დაცარიელდა, თუმცა ადგილობრივები წყაროებზე საბანაოდ მაინც დადიოდნენ.


    თანამედროვე კურორტი რუსეთის იმპერიის ნაშენია. XIX საუკუნის 50-იან წლებში, კავკასიის მეფისნაცვლის მიხეილ
    ვორონცოვის მფარველობით, აქ ახალმოსახლეები ჩამოვიდნენ, 1879–1881 წლებში კი ექიმმა ადოლფ რემერტმა წყაროებზე
    აბანო ააშენა. სამივე წყარო მიწიდან 39–48,5 °C-ზე ამოდის და დიდხანს ტუბერკულოზის სამკურნალოდ იყენებდნენ.
    დიდება კი პაციენტმა მოუტანა: დიდმა მთავარმა გიორგი ალექსანდრეს ძემ, ნიკოლოზ II-ის უმცროსმა ძმამ, სნეული
    ფილტვებით აქ დაიდო ბინა, მდინარის ორსავე ნაპირზე ზამთრისა და ზაფხულის სასახლეები ააშენებინა და აქვე
    გარდაიცვალა 1899 წელს, 28 წლისა.


    მისი ყველაზე მტკიცე დანატოვარი დღესაც დაბაში დგას: 1902 წელს დასრულებული წმინდა ალექსანდრე ნეველის
    ეკლესია XIV საუკუნის ზარზმის ტაძრის მცირე ასლია — აქედანაა მისი სახელიც, „ახალი ზარზმა“. შიგნით ის
    რუსმა მხატვარმა მიხაილ ნესტეროვმა მოხატა. მოძებნეთ წმინდა გიორგის პატარა ეკლესიაც, სადაც 2008 წელს
    დაწყებული რესტავრაციისას XIV საუკუნის ფრესკები — ნათლისღება და განკითხვის დღე — გამოჩნდა, და თამარ
    მეფის სახელით ცნობილი ერთთაღიანი ქვის ხიდიც.


    დიდი მთავრის ხის საზაფხულო სასახლე, მოგვიანებით დედათა მონასტერი, 2008 წელს დაიწვა. ფიჭვები, წყაროები
    და თხელი, მშრალი ჰაერი კი დარჩა — ის, რისთვისაც აქ ავადმყოფებს თავიდანვე აგზავნიდნენ.
  tip: >-
    დაბაში სეირნობა უფასოა; სანატორიუმებსა და აბანოებში პროცედურები ცალკე ფასიანია, ამიტომ დეტალები სასტუმროში
    იკითხეთ. ეკლესიებში მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაბური სჭირდებათ. დრონი სახლში
    დატოვეთ: 2026 წლიდან აბასთუმანს ფრენებისთვის დახურული ვრცელი ზონა ფარავს ობსერვატორიის დასაცავად.
    საღამოები აგვისტოშიც გრილია, ივლისის საშუალო ტემპერატურა 17 °C-ია, ამიტომ თბილი ზედა ტანსაცმელი წაიღეთ.
    აბასთუმნიდან ბორჯომ-ხარაგაულის ეროვნული პარკის ბილიკებიც იწყება, ასე რომ, აქ ღამის გათევა ღირს. მთა
    ყანობილზე მდგარ ობსერვატორიას ცალკე გვერდი აქვს და იქამდე ცალკე, უფრო ციცაბო გზა ადის.
  route: >-
    თბილისიდან E60/ს1-ით დასავლეთით ხაშურამდე იარეთ, იქიდან ს8-ით სამხრეთით, ბორჯომისა და მისი ტყიანი
    ხეობის გავლით, ახალციხემდე. ახალციხიდან ადგილობრივი გზა ოცხის ხეობას დასავლეთით 30-იოდე კილომეტრზე
    აუყვება კურორტამდე: სულ დაახლოებით 235 კილომეტრი და 3 საათი და 40 წუთი. ასფალტი ბოლომდეა, თუმცა ადგილ-ადგილ
    დაზიანებულია. საწვავი ახალციხეში ჩაასხით. ეკონომკლასი სავსებით საკმარისია; ზამთარში ზამთრის საბურავები
    აუცილებელია, ხეობაში თოვლი დიდხანს დევს. ობსერვატორიის ნიშნებს ნუ გაჰყვებით, თუ იქ არ მიდიხართ: ბოლო
    აღმართი ციცაბო, ვიწრო სერპანტინია და კროსოვერს უფრო შეეფერება.
en:
  name: Abastumani Resort
  short: >-
    An old imperial-era spa in a pine valley at 1,340 m: hot springs, a grand duke's legacy and a copy
    of Zarzma painted by Mikhail Nesterov.
  body: >-
    **Abastumani was built on a diagnosis: in this narrow pine valley, doctors prescribed the dry air
    and hot springs long before anyone looked through a telescope here.**


    The town sits at 1,340 metres in the valley of the Otskhe, on the southern flank of the Meskheti Range.
    Georgian tradition traces its beginnings to Odzrakhos, a descendant of Kartlos, and the medieval district
    of Odzrkhe took its name from a fortress whose ruins still stand nearby. Under Ottoman rule, from
    the sixteenth century, the valley emptied, yet locals kept coming to bathe in the springs.


    The modern resort is an imperial Russian creation. Settlers arrived in the 1850s under the patronage
    of Viceroy Mikhail Vorontsov, and between 1879 and 1881 the physician Adolf Remmert built a bathhouse
    over the springs. The three springs rise at 39–48.5°C and were long used against tuberculosis. Fame
    came with a patient. Grand Duke George Alexandrovich, younger brother of Nicholas II, retired here
    with failing lungs, had winter and summer residences built on either bank of the river, and died here
    in 1899, aged 28.


    His most lasting commission still stands in the town. The church of St Alexander Nevsky, completed
    in 1902, is a small copy of the fourteenth-century cathedral at Zarzma, hence its local name, New
    Zarzma; its interior was painted by the Russian artist Mikhail Nesterov. Look too for the little church
    of St George, where restoration begun in 2008 uncovered fourteenth-century frescoes of the Baptism
    and the Last Judgement, and for the single-arched stone bridge that carries Queen Tamar's name.


    The grand duke's wooden summer palace, later a nunnery, burned in 2008. The pines, the springs and
    the thin, dry air remain: the very things patients were first sent here for.
  tip: >-
    Wandering the town costs nothing; treatments at the sanatoria and baths are paid separately, so ask
    at your hotel. Churches expect covered shoulders and knees, and a headscarf for women. Leave the drone
    at home: since 2026 a wide no-fly zone has covered Abastumani to protect the observatory. Evenings
    are cool even in August (the July average is 17°C), so pack a warm layer. Trails into Borjomi-Kharagauli
    National Park also start here, which makes the town worth an overnight stay. The observatory on Mount
    Kanobili above town has its own page and its own, steeper road.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, then the S8 south through Borjomi and its wooded gorge
    to Akhaltsikhe. From there a local road climbs roughly 30 km west up the Otskhe valley to the resort,
    making about 235 km and 3 hours 40 minutes in all. It is asphalt throughout, though patchy in places.
    Fill up in Akhaltsikhe. An economy car is perfectly adequate; in winter fit winter tyres, as the valley
    holds snow. Do not follow the signs up to the observatory unless you mean to go there: that last climb
    is a steep, narrow serpentine better suited to a crossover.
ru:
  name: Курорт Абастумани
  short: >-
    Старый курорт имперской эпохи в сосновой долине на высоте 1340 м: горячие источники, наследие великого
    князя и копия Зарзмы, расписанная Михаилом Нестеровым.
  body: >-
    **Абастумани начался с диагноза: в эту узкую сосновую долину врачи отправляли больных за сухим воздухом
    и горячими источниками задолго до того, как кто-то заглянул здесь в телескоп.**


    Городок лежит на высоте 1340 метров в долине реки Оцхе, на южном склоне Месхетского хребта. Грузинское
    предание возводит его начало к Одзрахосу, потомку Картлоса, а средневековый край Одзрхе получил имя
    от крепости, руины которой и теперь видны неподалёку. Под османским владычеством, с XVI века, долина
    опустела, но местные жители всё равно приходили купаться в источниках.


    Современный курорт — творение Российской империи. Переселенцы появились здесь в 1850-х годах под покровительством
    наместника Михаила Воронцова, а в 1879–1881 годах врач Адольф Реммерт выстроил над источниками купальню.
    Все три источника выходят на поверхность с температурой 39–48,5 °C, и их долго использовали против
    туберкулёза. Славу курорту принёс пациент. Великий князь Георгий Александрович, младший брат Николая
    II, удалился сюда с больными лёгкими, построил зимнюю и летнюю резиденции на двух берегах реки и умер
    здесь в 1899 году, в 28 лет.


    Самое долговечное из того, что он заказал, и сегодня стоит в городе. Церковь Святого Александра Невского,
    законченная в 1902 году, — уменьшенная копия собора XIV века в Зарзме, отсюда её местное имя — Новая
    Зарзма; интерьер расписал русский художник Михаил Нестеров. Найдите и маленькую церковь Святого Георгия,
    где реставрация, начатая в 2008 году, открыла фрески XIV века с Крещением и Страшным судом, и однопролётный
    каменный мост, носящий имя царицы Тамары.


    Деревянный летний дворец великого князя, позднее ставший женским монастырём, сгорел в 2008 году. Остались
    сосны, источники и разреженный сухой воздух — ровно то, ради чего сюда когда-то и посылали больных.
  tip: >-
    Гулять по городу можно бесплатно; процедуры в санаториях и купальнях оплачиваются отдельно — спросите
    в своей гостинице. В церковь входят с покрытыми плечами и коленями, женщинам нужен платок. Дрон оставьте
    дома: с 2026 года над Абастумани действует обширная бесполётная зона, призванная защитить обсерваторию.
    Вечера прохладны даже в августе (средняя температура июля — 17 °C), так что захватите тёплую одежду.
    Отсюда же начинаются тропы в Боржоми-Харагаульский национальный парк, поэтому в городе стоит остаться
    на ночь. Обсерватории на горе Канобили над городом посвящена отдельная страница, и дорога к ней своя
    — круче.
  route: >-
    Из Тбилиси езжайте по E60/S1 на запад до Хашури, затем по S8 на юг через Боржоми и его лесистое ущелье
    до Ахалцихе. Оттуда местная дорога поднимается примерно на 30 км на запад по долине Оцхе к курорту
    — всего около 235 км и 3 часа 40 минут. Асфальт на всём пути, хотя местами латаный. Заправьтесь в
    Ахалцихе. Машины эконом-класса вполне достаточно; зимой ставьте зимнюю резину — снег в долине держится.
    Не сворачивайте по указателям к обсерватории, если не собираетесь туда: последний подъём — крутой
    узкий серпантин, для которого лучше подойдёт кроссовер.
fa:
  name: استراحتگاه آباستومانی
  short: >-
    آب‌درمانگاهی کهن از روزگار تزارها در دره‌ای کاج‌پوش در ارتفاع ۱۳۴۰ متری: چشمه‌های آب گرم، میراث یک
    گراندوک و نسخه‌ای از زارزما با نقاشی‌های میخائیل نستروف.
  body: >-
    **آباستومانی بر پایهٔ یک تشخیص پزشکی ساخته شد: مدت‌ها پیش از آنکه کسی در این درهٔ باریک و کاج‌پوش
    از تلسکوپ به آسمان بنگرد، پزشکان هوای خشک و چشمه‌های آب گرمش را تجویز می‌کردند.**


    این شهرک در ارتفاع ۱۳۴۰ متری، در درهٔ رود اوتسخه و بر دامنهٔ جنوبی رشته‌کوه مسختی قرار دارد. روایت
    گرجی آغاز آن را به اُدزراخوس، از نوادگان کارتلوس، می‌رساند و ناحیهٔ قرون‌وسطایی اُدزرخه نامش را از
    دژی گرفته که ویرانه‌هایش هنوز در همین نزدیکی پیداست. در دوران سلطهٔ عثمانی، از سدهٔ شانزدهم، دره از
    سکنه خالی شد، اما مردم محل همچنان برای آب‌تنی به چشمه‌ها می‌آمدند.


    استراحتگاه امروزی ساختهٔ روسیهٔ تزاری است. مهاجران در دههٔ ۱۸۵۰ با حمایت نایب‌السلطنه میخائیل ورونتسوف
    به اینجا آمدند و در سال‌های ۱۸۷۹ تا ۱۸۸۱ پزشکی به نام آدولف رمرت بر روی چشمه‌ها گرمابه‌ای ساخت. آب
    هر سه چشمه با دمای ۳۹ تا ۴۸٫۵ درجهٔ سانتی‌گراد از زمین بیرون می‌آید و مدت‌ها برای درمان سل به کار
    می‌رفت. شهرت را یک بیمار آورد: گراندوک گئورگی آلکساندرویچ، برادر کوچک‌تر نیکلای دوم، با ریه‌هایی بیمار
    به اینجا پناه آورد، اقامتگاه‌های زمستانی و تابستانی‌اش را در دو سوی رود ساخت و در ۱۸۹۹، در ۲۸ سالگی،
    همین‌جا درگذشت.


    ماندگارترین سفارش او هنوز در شهر پابرجاست. کلیسای قدیس الکساندر نِفسکی که در ۱۹۰۲ به پایان رسید، نسخهٔ
    کوچکی از کلیسای جامع سدهٔ چهاردهمی زارزماست و از همین رو مردم محل آن را «زارزمای نو» می‌نامند؛ نقاشی‌های
    درونش کار میخائیل نستروف، هنرمند روس، است. سراغ کلیسای کوچک قدیس گئورگی را هم بگیرید که مرمتِ آغازشده
    در ۲۰۰۸ در آن دیوارنگاره‌هایی از سدهٔ چهاردهم با صحنه‌های تعمید و داوری واپسین را آشکار کرد، و نیز
    پل سنگیِ تک‌دهانه‌ای که نام ملکه تامار را بر خود دارد.


    کاخ چوبی تابستانی گراندوک، که بعدها صومعهٔ زنانه شد، در ۲۰۰۸ در آتش سوخت. اما کاج‌ها، چشمه‌ها و هوای
    رقیق و خشک مانده‌اند: همان چیزهایی که بیماران نخستین بار به خاطرشان به اینجا فرستاده می‌شدند.
  tip: >-
    گشت‌وگذار در شهر هزینه‌ای ندارد؛ درمان در آسایشگاه‌ها و گرمابه‌ها جداگانه پرداخت می‌شود، پس از هتل‌تان
    بپرسید. در کلیساها شانه‌ها و زانوها باید پوشیده باشد و بانوان روسری سر کنند. پهپاد را در خانه بگذارید:
    از ۲۰۲۶ منطقهٔ پرواز ممنوعِ گسترده‌ای آباستومانی را در بر گرفته است تا از رصدخانه حفاظت شود. شب‌ها
    حتی در ماه اوت خنک است (میانگین دمای ژوئیه ۱۷ درجه است)، پس لباس گرم همراه داشته باشید. مسیرهای پیاده‌روی
    به پارک ملی بورجومی-خاراگائولی هم از همین‌جا آغاز می‌شوند و همین، یک شب ماندن در شهر را می‌ارزد. رصدخانهٔ
    روی کوه کانوبیلی، بالای شهر، صفحهٔ جداگانهٔ خود را دارد و جادهٔ خودش را، که پرشیب‌تر است.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب تا خاشوری بروید، سپس با S8 به سمت جنوب از بورجومی و درهٔ جنگلی‌اش
    بگذرید تا به آخالتسیخه برسید. از آنجا جاده‌ای محلی حدود ۳۰ کیلومتر رو به غرب در درهٔ اوتسخه بالا می‌رود
    تا به استراحتگاه برسد؛ روی هم حدود ۲۳۵ کیلومتر و ۳ ساعت و ۴۰ دقیقه. تمام راه آسفالت است، هرچند جابه‌جا
    وصله‌پینه دارد. در آخالتسیخه باک را پر کنید. خودروی اقتصادی کاملاً کافی است؛ در زمستان از لاستیک زمستانی
    استفاده کنید، چون برف در دره می‌ماند. تابلوهای رصدخانه را دنبال نکنید، مگر آنکه قصد رفتن به آنجا را
    دارید: سربالایی آخر، پیچ‌درپیچی تند و باریک است که برای خودروی کراس‌اوور مناسب‌تر است.
he:
  name: עיירת המרפא אבסתומני
  short: >-
    עיירת מרפא ותיקה מימי האימפריה הרוסית בעמק אורנים בגובה 1,340 מ׳: מעיינות חמים, מורשת של דוכס גדול
    והעתק של זרזמה שאת פנימו צייר מיכאיל נסטרוב.
  body: >-
    **אבסתומני נבנתה על סמך אבחנה רפואית: הרבה לפני שמישהו הציץ כאן בטלסקופ, רופאים כבר רשמו לחולים את
    האוויר היבש והמעיינות החמים של עמק האורנים הצר הזה.**


    העיירה שוכנת בגובה 1,340 מטרים בעמק נהר אוצחה, על המדרון הדרומי של רכס מסחתי. המסורת הגאורגית מייחסת
    את ראשיתה לאודזרחוס, מצאצאי קרתלוס, והמחוז של ימי הביניים, אודזרחה, קיבל את שמו ממבצר שחורבותיו עדיין
    עומדות בקרבת מקום. תחת השלטון העות׳מאני, מהמאה ה-16, העמק התרוקן מתושביו, אך המקומיים המשיכו לבוא
    ולרחוץ במעיינות.


    אתר המרפא המודרני הוא יציר האימפריה הרוסית. מתיישבים הגיעו לכאן בשנות ה-50 של המאה ה-19 בחסות המשנה
    למלך מיכאיל וורונצוב, ובין 1879 ל-1881 הקים הרופא אדולף רמרט בית מרחץ מעל המעיינות. שלושת המעיינות
    נובעים בטמפרטורה של 39–48.5 מעלות צלזיוס, ובמשך שנים רבות שימשו לטיפול בשחפת. את התהילה הביא מטופל
    אחד: הדוכס הגדול גאורגי אלכסנדרוביץ׳, אחיו הצעיר של ניקולאי השני, פרש לכאן כשריאותיו חולות, בנה לעצמו
    מעון חורף ומעון קיץ משני צדי הנהר, ומת כאן ב-1899, בן 28.


    מכל מה שהזמין, הדבר שהחזיק מעמד יותר מכול עומד בעיירה עד היום. כנסיית אלכסנדר נבסקי הקדוש, שהושלמה
    ב-1902, היא העתק מוקטן של הקתדרלה מהמאה ה-14 בזרזמה, ומכאן שמה המקומי, ״זרזמה החדשה״; את פנימה צייר
    האמן הרוסי מיכאיל נסטרוב. חפשו גם את כנסיית גאורגיוס הקדוש הקטנה, שבה חשף שיקום שהחל ב-2008 ציורי
    קיר מהמאה ה-14 המתארים את הטבילה ואת יום הדין, ואת גשר האבן בעל הקשת האחת, הנושא את שמה של המלכה תמר.


    ארמון הקיץ של הדוכס הגדול, שנבנה מעץ והפך לימים למנזר נשים, עלה באש ב-2008. האורנים, המעיינות והאוויר
    הדליל והיבש נשארו — בדיוק הדברים שבגללם נשלחו לכאן החולים מלכתחילה.
  tip: >-
    הטיול ברחובות העיירה אינו עולה דבר; טיפולים בסנטוריומים ובבתי המרחץ משולמים בנפרד, לכן שאלו במלון.
    בכנסיות נדרש לכסות כתפיים וברכיים, ונשים מתבקשות לכסות את הראש במטפחת. השאירו את הרחפן בבית: מאז 2026
    אבסתומני נמצאת בתוך אזור רחב האסור לטיסה, כדי להגן על המצפה. הערבים קרירים גם באוגוסט (הטמפרטורה הממוצעת
    ביולי היא 17 מעלות), אז קחו שכבה חמה. מכאן יוצאים גם שבילים אל הפארק הלאומי בורג׳ומי-חרגאולי, ולכן
    כדאי ללון בעיירה לילה אחד. למצפה שעל הר קנובילי, מעל העיירה, יש עמוד משלו ודרך משלו, תלולה יותר.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, ומשם דרומה בכביש S8 דרך בורג׳ומי והערוץ המיוער שלה עד אחלציחה.
    משם עולה דרך מקומית כ-30 ק״מ מערבה במעלה עמק אוצחה עד העיירה — בסך הכול כ-235 ק״מ ו-3 שעות ו-40 דקות.
    הדרך סלולה לכל אורכה, אם כי במקומות מסוימים האספלט מטולא. תדלקו באחלציחה. רכב קטן מקטגוריית אקונומי
    מספיק בהחלט; בחורף הרכיבו צמיגי חורף, כי השלג נשאר בעמק. אל תפנו בעקבות השלטים למצפה אלא אם אתם מתכוונים
    להגיע אליו: העלייה האחרונה היא דרך מתפתלת, תלולה וצרה, שמתאימה יותר לקרוסאובר.
ar:
  name: منتجع أباستوماني
  short: >-
    منتجع علاجي قديم من الحقبة الإمبراطورية الروسية في وادٍ من الصنوبر على ارتفاع 1340 م: ينابيع حارة،
    وإرث دوق أكبر، ونسخة من زارزما رسم داخلها ميخائيل نيستيروف.
  body: >-
    **قامت أباستوماني على تشخيص طبي: ففي هذا الوادي الضيق المكسوّ بالصنوبر وصف الأطباء الهواء الجاف والينابيع
    الحارة قبل زمن طويل من أن ينظر أحد هنا في تلسكوب.**


    تقع البلدة على ارتفاع 1340 متراً في وادي نهر أوتسخه، على السفح الجنوبي لسلسلة جبال ميسخيتي. ويردّ
    التراث الجورجي نشأتها إلى أودزراخوس، أحد أحفاد كارتلوس، وقد أخذت ناحية أودزرخه في العصور الوسطى اسمها
    من قلعة لا تزال أطلالها قائمة على مقربة. وفي ظل الحكم العثماني، منذ القرن السادس عشر، خلا الوادي من
    سكانه، غير أن أهل المنطقة ظلوا يقصدون الينابيع للاستحمام.


    أما المنتجع الحديث فمن صنع روسيا القيصرية. فقد وصل المستوطنون في خمسينيات القرن التاسع عشر برعاية
    نائب الملك ميخائيل فورونتسوف، وبين عامي 1879 و1881 شيّد الطبيب أدولف ريمرت حمّاماً فوق الينابيع. وتتدفق
    الينابيع الثلاثة بحرارة تتراوح بين 39 و48.5 درجة مئوية، واستُخدمت طويلاً في علاج السل. وجاءت الشهرة
    مع مريض: فالدوق الأكبر غيورغي ألكسندروفيتش، الأخ الأصغر لنيقولا الثاني، اعتزل هنا وقد أنهك المرض رئتيه،
    وبنى لنفسه مقرّاً شتوياً وآخر صيفياً على ضفتي النهر، وتُوفي هنا عام 1899 عن 28 عاماً.


    وأبقى ما أمر ببنائه لا يزال قائماً في البلدة. فكنيسة القديس ألكسندر نيفسكي، التي اكتمل بناؤها عام
    1902، نسخة مصغّرة عن كاتدرائية زارزما التي تعود إلى القرن الرابع عشر، ومن هنا اسمها المحلي «زارزما
    الجديدة»؛ وقد رسم جدرانها الداخلية الفنان الروسي ميخائيل نيستيروف. وابحث أيضاً عن كنيسة القديس جاورجيوس
    الصغيرة، حيث كشف ترميم بدأ عام 2008 عن جداريات من القرن الرابع عشر تصوّر المعمودية والدينونة الأخيرة،
    وعن الجسر الحجري ذي القنطرة الواحدة الذي يحمل اسم الملكة تامار.


    أما قصر الدوق الأكبر الصيفي الخشبي، الذي صار لاحقاً ديراً للراهبات، فقد التهمته النار عام 2008. وبقيت
    أشجار الصنوبر والينابيع والهواء الرقيق الجاف: الأشياء نفسها التي أُرسل المرضى إلى هنا من أجلها أول
    مرة.
  tip: >-
    التجول في البلدة مجاني؛ أما العلاجات في المصحّات والحمّامات فتُدفع على حدة، فاسأل في فندقك. وتتطلب
    الكنائس تغطية الكتفين والركبتين، وغطاء رأس للنساء. اترك الطائرة المسيّرة في البيت: فمنذ 2026 تقع أباستوماني
    ضمن منطقة واسعة يُحظر فيها الطيران، وذلك لحماية المرصد. الأمسيات باردة حتى في أغسطس (متوسط حرارة يوليو
    17 درجة مئوية)، فاحمل معك طبقة دافئة. ومن هنا أيضاً تبدأ مسارات إلى منتزه بورجومي-خاراغاولي الوطني،
    ما يجعل المبيت ليلة في البلدة أمراً يستحق. وللمرصد القائم على جبل كانوبيلي فوق البلدة صفحته الخاصة
    وطريقه الخاص، وهو أشد انحداراً.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، ثم الطريق S8 جنوباً عبر بورجومي وواديها المشجّر إلى
    أخالتسيخه. ومن هناك يصعد طريق محلي نحو 30 كم غرباً في وادي أوتسخه حتى المنتجع، فيبلغ المجموع نحو 235
    كم و3 ساعات و40 دقيقة. الطريق معبّد بالكامل، وإن كان مرقّعاً في بعض المواضع. املأ الخزان في أخالتسيخه.
    تكفي سيارة من الفئة الاقتصادية تماماً؛ وفي الشتاء ركّب إطارات شتوية، فالثلج يبقى في الوادي. لا تتبع
    اللافتات الصاعدة إلى المرصد إلا إن كنت تقصده: فالصعود الأخير طريق متعرج ضيق شديد الانحدار، تناسبه
    سيارة كروس أوفر أكثر.
