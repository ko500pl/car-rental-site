ka:
  name: წილკნის ღვთისმშობლის ტაძარი
  short: >-
    IV საუკუნეში დაარსებული, შუა საუკუნეებში თლილი ქვიშაქვით განახლებული ტაძარი XVIII საუკუნის გალავანში
    — მცხეთის ჩრდილოეთით, წყნარ სოფელში.
  body: >-
    **ამ ტაძარს მეფეებიც ახსოვს, ეპისკოპოსებიც და ანტიოქიიდან მოსული ბერიც — გალავნის მიღმა კი სოფელი
    თავის ჩვეულ ცხოვრებას განაგრძობს.**


    ქართული მატიანეები აქ პირველი ეკლესიის აგებას მეფე ბაქარს მიაწერენ — მირიან III-ის, ქართლის პირველი
    ქრისტიანი მეფის ძეს, რომელიც დაახლოებით 365–380 წლებში მეფობდა. თავდაპირველად ეს უბრალო დარბაზული
    ეკლესია იყო; V ან VI საუკუნეში სამნავიან ბაზილიკად გადააკეთეს, XII ან XIII საუკუნეში კი გუმბათით დააგვირგვინეს.
    ოსტატები აქ XVI–XVII საუკუნეებშიც დაბრუნდნენ. წილკნელი ეპისკოპოსი წყაროებში პირველად 506 წელს იხსენიება,
    რაც ამ კათედრას საქართველოს უძველეს დადასტურებულ საეპისკოპოსოებს შორის აყენებს.


    დღევანდელი ტაძარი ჯვარ-გუმბათოვანი ნაგებობაა, 28 × 24 მეტრი, თლილი ქვიშაქვის კვადრებით ნაშენი. გუმბათს
    ოთხი თავისუფლად მდგომი ბოძი ეყრდნობა, ყელში გაჭრილი თორმეტი სარკმლიდან კი სინათლე ირიბ სვეტებად ეშვება
    იატაკზე. კედლებს კარგად დააკვირდით: ზოგან XV–XVIII საუკუნეების უხეში მოხატულობის კვალი შემორჩა — ნაფლეთები
    და არა სრული ციკლი, მაგრამ ნამდვილი.


    გადმოცემით, რომელსაც XIII საუკუნის სასულიერო მოღვაწის, არსენ ბულმაისიმისძის საგალობლებიც ეხმიანება,
    აქ განისვენებს იესე წილკნელი — ანტიოქიელი ბერი, ცამეტ ასურელ მამათაგანი, რომლებიც ქართლში დაახლოებით
    545 წელს მოვიდნენ. საუკუნეების განმავლობაში ტაძარში ინახებოდა წილკნის ღვთისმშობლის ხატიც — IX საუკუნის
    ოდიგიტრია, ღვთისმშობელი ყრმითა და მთავარანგელოზებით. 1926 წელს ხატი დასაცავად თბილისში გადაიტანეს
    და დღეს ის საქართველოს ეროვნული მუზეუმის კოლექციაშია.


    ეზოს XVIII საუკუნის ბოლოს აგებული გალავანი არტყია — 58 × 72 მეტრი, მრგვალი კოშკებით კუთხეებში და აგურის
    თაღოვანი ჭიშკრით. XIX საუკუნეში სამხრეთ-აღმოსავლეთ კოშკს პატარა ექვსწახნაგა სამრეკლო დაადგეს: თავდაცვისთვის
    აგებულმა კოშკმა ბოლოს ზარების რეკვა ისწავლა.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი ტაძარია, ამიტომ მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი
    დასჭირდებათ. კვირა დილით წირვაა — ჯობს მის შემდეგ მიხვიდეთ, ან უკან ჩუმად დადგეთ და მსახურების დროს
    კამერა არ ამოიღოთ. ნახევარი საათი სავსებით საკმარისია: ჯერ ტაძრის შიგნით, მერე ნელა შემოუარეთ გალავანს
    გარედან — კოშკები და სამრეკლო ეზოდან გაცილებით ნაკლებად ჩანს. სახელგანთქმულ ხატს აქ ვერ ნახავთ: ის
    თბილისშია, საქართველოს ეროვნული მუზეუმის კოლექციაში. ძალისი (5 კმ) და შატო მუხრანი (6 კმ) ისე ახლოსაა,
    რომ სამივე ერთ მშვიდ ნახევარდღიან მარშრუტში ეტევა.
  route: >-
    თბილისის ცენტრიდან ს1 (E60) მაგისტრალს ჩრდილო-დასავლეთით გაჰყევით მცხეთის კვანძამდე. იქ ს3-ზე — საქართველოს
    სამხედრო გზაზე — გადადით, ნატახტრის მიმართულებით დაახლოებით 3 კმ იარეთ და მარცხნივ, შ151-ზე გადაუხვიეთ:
    სოფლის გზა ღია ველს კვეთს და 6 კილომეტრში წილკანში შეგიყვანთ. სულ 38 კმ-ია, დაახლოებით 40 წუთი. ასფალტი
    ტაძრის ჭიშკრამდე მიდის, ამიტომ ნებისმიერი ეკონომ-კლასის მანქანა გამოდგება, წლის ნებისმიერ დროს; მანქანის
    დასაყენებელი ადგილიდან გალავნამდე მოკლე, სწორი სავალია. საწვავი ს1-სა და ს3-ზე ბევრია. იგივე შ151
    კიდევ 5 კილომეტრში ძალისამდე მიდის — იქიდან ს1-ზე დაბრუნებით მარშრუტს წრედ შეკრავთ.
en:
  name: Tsilkani Cathedral
  short: >-
    A 4th-century foundation remade in dressed sandstone and ringed by an 18th-century fortress wall,
    in a quiet village just north of Mtskheta.
  body: >-
    **Kings, bishops and a monk from Antioch have all left their mark on this sandstone church, while
    an ordinary village goes about its day around the walls.**


    Medieval Georgian chronicles credit the first church here to King Bakar, who ruled Kartli around 365–380
    and was the son of Mirian III, the kingdom's first Christian king. It began as a simple hall church,
    became a three-nave basilica in the 5th or 6th century and was rebuilt with a dome in the 12th or
    13th; masons came back again in the 16th–17th. The bishops of Tsilkani are first heard of in 506,
    which makes this one of the oldest attested sees in the country.


    What stands today is a cross-in-square church, 28 by 24 metres, built of dressed sandstone blocks.
    Four free-standing piers carry the dome, and twelve windows in its drum drop the daylight onto the
    floor in slanting shafts. Look closely at the walls: here and there survive coarse paintings from
    the 15th to the 18th centuries — fragments rather than a cycle, but honest ones.


    Tradition, sung in the hymns of the 13th-century cleric Arsen Bulmaisimisdze, holds that Jesse of
    Antioch — one of the Thirteen Syrian Fathers who arrived in Kartli around 545 — lies buried here.
    For centuries the church also kept the Tsilkani Hodegetria, a 9th-century icon of the Virgin and Child
    attended by archangels; in 1926 it was taken to Tbilisi for safekeeping and now belongs to the Georgian
    National Museum.


    Around it all runs a late-18th-century curtain wall, 58 by 72 metres, with round corner towers and
    an arched brick gate. In the 19th century the south-east tower was crowned with a small hexagonal
    belfry: a tower built for defence that, in the end, learned to ring bells.
  tip: >-
    Entry is free. This is a working church, so cover shoulders and knees; women should bring a headscarf.
    Sunday morning brings the liturgy — arrive after it, or stand quietly at the back and keep the camera
    away during the service. Half an hour is enough: first the interior, then a slow circuit outside the
    enclosure, where the towers and the belfry read far better than from the courtyard. Do not expect
    the famous icon — it is in Tbilisi, in the Georgian National Museum's collection. Dzalisi (5 km) and
    Chateau Mukhrani (6 km) are close enough to make a relaxed half-day loop.
  route: >-
    From central Tbilisi follow the S1 (E60) north-west to the Mtskheta junction. There switch to the
    S3, the Georgian Military Road, and drive about 3 km north towards Natakhtari, then turn left onto
    the Sh151, a country road that crosses the open plain for some 6 km into Tsilkani. In all it is 38
    km, around 40 minutes. The road is asphalt to the church gate, so any economy car will do, in any
    season; parking is a short, flat walk from the enclosure. Fuel is plentiful on the S1 and S3. The
    same Sh151 carries on to Dzalisi, 5 km further, from where you can rejoin the S1 and close a loop.
ru:
  name: Цилканский собор
  short: >-
    Храм, основанный в IV веке, перестроенный из тёсаного песчаника и обнесённый крепостной стеной XVIII
    века, — в тихом селе чуть севернее Мцхеты.
  body: >-
    **Цари, епископы и монах из Антиохии оставили свой след в этой песчаниковой церкви, а вокруг её стен
    обычное село живёт своей обычной жизнью.**


    Средневековые грузинские летописи приписывают первую церковь на этом месте царю Бакару, правившему
    Картли примерно в 365–380 годах, — сыну Мириана III, первого христианского царя страны. Сначала это
    была простая зальная церковь; в V или VI веке она стала трёхнефной базиликой, в XII или XIII веке
    её перестроили с куполом, а в XVI–XVII веках каменщики возвращались сюда снова. Цилканские епископы
    впервые упоминаются в 506 году — это одна из старейших засвидетельствованных кафедр страны.


    Сегодня здесь стоит крестово-купольный храм размером 28 на 24 метра, сложенный из тёсаных блоков песчаника.
    Купол несут четыре свободно стоящих столпа, а двенадцать окон барабана роняют дневной свет на пол
    косыми лучами. Приглядитесь к стенам: местами сохранились грубоватые росписи XV–XVIII веков — фрагменты,
    а не цикл, но фрагменты честные.


    Предание, воспетое в гимнах церковного писателя XIII века Арсена Булмаисимисдзе, гласит, что здесь
    похоронен Иессей Цилканский, выходец из Антиохии, — один из Тринадцати сирийских отцов, пришедших
    в Картли около 545 года. Веками церковь хранила и Цилканскую Одигитрию — икону IX века, Богородицу
    с Младенцем в окружении архангелов; в 1926 году её увезли на хранение в Тбилиси, и теперь она принадлежит
    Национальному музею Грузии.


    Всё это окружает крепостная ограда конца XVIII века, 58 на 72 метра, с круглыми угловыми башнями и
    арочными кирпичными воротами. В XIX веке юго-восточную башню увенчала небольшая шестигранная звонница:
    башня, построенная для обороны, в конце концов научилась звонить в колокола.
  tip: >-
    Вход свободный. Это действующая церковь: плечи и колени должны быть закрыты, женщинам стоит взять
    платок. Воскресное утро — время литургии: приезжайте после неё или тихо постойте сзади, убрав камеру
    на время службы. Получаса достаточно: сначала интерьер, потом неспешный круг снаружи ограды — башни
    и звонница оттуда читаются куда лучше, чем со двора. Знаменитую икону здесь не ищите: она в Тбилиси,
    в собрании Национального музея Грузии. Дзалиси (5 км) и Шато Мухрани (6 км) достаточно близко, чтобы
    сложить неторопливую поездку на полдня.
  route: >-
    Из центра Тбилиси езжайте по S1 (E60) на северо-запад до развязки у Мцхеты. Там перейдите на S3, Военно-Грузинскую
    дорогу, проедьте около 3 км на север в сторону Натахтари и сверните налево на Sh151 — сельскую дорогу,
    которая примерно 6 км пересекает открытую равнину до Цилкани. Всего 38 км, около 40 минут. Асфальт
    до самых ворот церкви, так что подойдёт любая машина эконом-класса в любое время года; от парковки
    до ограды — короткий путь по ровному. Заправок на S1 и S3 предостаточно. Та же Sh151 ведёт дальше,
    к Дзалиси, ещё 5 км, откуда можно вернуться на S1 и замкнуть петлю.
fa:
  name: کلیسای جامع تسیلکانی
  short: >-
    بنایی با بنیادی از سدهٔ چهارم که با ماسه‌سنگ تراشیده از نو ساخته شد و دیوار قلعه‌ای از سدهٔ هجدهم
    گردش را گرفته است، در روستایی آرام کمی شمال متسختا.
  body: >-
    **پادشاهان، اسقف‌ها و راهبی از انطاکیه همه ردی بر این کلیسای ماسه‌سنگی گذاشته‌اند، و در همان حال روستایی
    معمولی پیرامون دیوارهایش روزش را می‌گذراند.**


    وقایع‌نامه‌های گرجی سده‌های میانه ساخت نخستین کلیسای این‌جا را به شاه باکار نسبت می‌دهند که حدود سال‌های
    ۳۶۵ تا ۳۸۰ بر کارتلی فرمان راند و پسر میریان سوم، نخستین پادشاه مسیحی این سرزمین، بود. بنا ابتدا کلیسایی
    تالاری و ساده بود، در سدهٔ پنجم یا ششم به باسیلیکایی سه‌شبستانی بدل شد و در سدهٔ دوازدهم یا سیزدهم
    با گنبد بازسازی شد؛ در سده‌های شانزدهم و هفدهم هم بنّاها دوباره به سراغش آمدند. نخستین یادکرد از اسقفان
    تسیلکانی به سال ۵۰۶ برمی‌گردد و همین، این‌جا را یکی از کهن‌ترین اسقف‌نشین‌های مستند کشور می‌کند.


    آنچه امروز برپاست کلیسایی با نقشهٔ صلیب در مربع است، به ابعاد ۲۸ در ۲۴ متر، از قطعه‌های ماسه‌سنگ تراشیده.
    چهار پایهٔ مستقل گنبد را نگه می‌دارند و دوازده پنجرهٔ ساقهٔ گنبد، نور روز را به شکل پرتوهایی مورب
    روی کف فرو می‌ریزند. به دیوارها دقیق نگاه کنید: این‌جا و آن‌جا نقاشی‌های زمختی از سده‌های پانزدهم
    تا هجدهم به جا مانده است — تکه‌هایی پراکنده و نه یک چرخهٔ کامل، اما تکه‌هایی صادق.


    روایتی سنتی که در سرودهای آرسن بولمایسیمیسدزه، روحانی سدهٔ سیزدهم، آمده است می‌گوید یسای انطاکی —
    یکی از سیزده پدر سوری که حدود سال ۵۴۵ به کارتلی آمدند — در این‌جا به خاک سپرده شده است. کلیسا سده‌ها
    «هودگتریای تسیلکانی» را هم نگه می‌داشت، شمایلی از سدهٔ نهم که مریم و کودک را در میان فرشتگان مقرب
    نشان می‌دهد؛ این شمایل در ۱۹۲۶ برای نگهداری به تفلیس برده شد و اکنون به موزهٔ ملی گرجستان تعلق دارد.


    گرداگرد همهٔ این‌ها بارویی از اواخر سدهٔ هجدهم کشیده شده است، به ابعاد ۵۸ در ۷۲ متر، با برج‌های گرد
    در گوشه‌ها و دروازه‌ای آجری و طاق‌دار. در سدهٔ نوزدهم بر برج جنوب‌شرقی ناقوس‌خانه‌ای کوچک و شش‌ضلعی
    نشاندند: برجی که برای دفاع ساخته شده بود و سرانجام ناقوس نواختن آموخت.
  tip: >-
    ورود رایگان است. این کلیسا فعال است، پس شانه‌ها و زانوها را بپوشانید؛ زنان روسری همراه داشته باشند.
    صبح یکشنبه زمان آیین عشای ربانی است — پس از آن بیایید، یا آرام در ردیف‌های عقب بایستید و در طول مراسم
    دوربین را کنار بگذارید. نیم ساعت کافی است: اول فضای درون، بعد گشتی آهسته بیرون از حصار، جایی که برج‌ها
    و ناقوس‌خانه بسیار بهتر از درون حیاط دیده می‌شوند. انتظار دیدن آن شمایل مشهور را نداشته باشید؛ در
    تفلیس و در مجموعهٔ موزهٔ ملی گرجستان است. دزالیسی (۵ کیلومتر) و شاتو موخرانی (۶ کیلومتر) آن‌قدر نزدیک‌اند
    که با هم یک گشت آرام نیم‌روزه بسازند.
  route: >-
    از مرکز تفلیس از جادهٔ S1 (E60) رو به شمال‌غرب تا تقاطع متسختا بروید. آن‌جا به S3، جادهٔ نظامی گرجستان،
    بروید و حدود ۳ کیلومتر به سمت شمال و ناتاختاری برانید؛ سپس به چپ، به Sh151 بپیچید، جاده‌ای روستایی
    که حدود ۶ کیلومتر از دشت باز می‌گذرد تا به تسیلکانی برسد. روی هم ۳۸ کیلومتر و حدود ۴۰ دقیقه راه است.
    جاده تا دروازهٔ کلیسا آسفالت است، پس هر خودروی اقتصادی در هر فصلی از پسش برمی‌آید؛ از پارکینگ تا حصار
    چند قدمی بیشتر روی زمین هموار نیست. در S1 و S3 پمپ بنزین فراوان است. همین Sh151 پنج کیلومتر دیگر تا
    دزالیسی ادامه دارد و از آن‌جا می‌توانید به S1 برگردید و حلقه را کامل کنید.
he:
  name: קתדרלת צילקני
  short: מקום פולחן שנוסד במאה ה־4, נבנה מחדש מאבן חול מסותתת והוקף חומת מבצר מהמאה ה־18, בכפר שקט מעט
    צפונית למצחתה.
  body: >-
    **מלכים, בישופים ונזיר מאנטיוכיה הותירו כולם את חותמם על כנסיית אבן החול הזאת, בעוד כפר רגיל ממשיך
    בשגרת יומו סביב חומותיה.**


    כרוניקות גאורגיות מימי הביניים מייחסות את הכנסייה הראשונה במקום למלך בקאר, ששלט בקרתלי בערך בשנים
    365–380 והיה בנו של מיריאן השלישי, המלך הנוצרי הראשון של הממלכה. בתחילה הייתה זו כנסיית אולם פשוטה;
    במאה ה־5 או ה־6 היא הפכה לבזיליקה בת שלוש ספינות, ובמאה ה־12 או ה־13 נבנתה מחדש עם כיפה; במאות ה־16–17
    שבו אליה הבנאים פעם נוספת. בישופי צילקני נזכרים לראשונה בשנת 506, ובכך זו אחת הבישופויות המתועדות
    העתיקות ביותר בארץ.


    מה שעומד כאן היום הוא כנסייה בתכנית צלב בתוך ריבוע, במידות 28 על 24 מטרים, בנויה מגושי אבן חול מסותתים.
    ארבעה פילונים עומדים חופשיים נושאים את הכיפה, ושנים־עשר חלונות בתוף שלה מפילים את אור היום על הרצפה
    באלומות אלכסוניות. הביטו היטב בקירות: פה ושם שרדו ציורים גסים מן המאות ה־15 עד ה־18 — שברים ולא מחזור
    שלם, אבל שברים כנים.


    המסורת, שהושרה במזמוריו של איש הכנסייה בן המאה ה־13 ארסן בולמאיסימיסדזה, גורסת כי ישי מאנטיוכיה —
    אחד משלושה־עשר האבות הסורים שהגיעו לקרתלי בסביבות שנת 545 — קבור כאן. במשך מאות שנים שמרה הכנסייה
    גם על ההודגטריה של צילקני, איקונה מהמאה ה־9 של הבתולה והילד ולצידם מלאכים עליונים; ב־1926 הועברה לטביליסי
    לשמירה, וכיום היא שייכת למוזיאון הלאומי הגאורגי.


    סביב כל זה נמשכת חומת מבצר מסוף המאה ה־18, במידות 58 על 72 מטרים, עם מגדלי פינה עגולים ושער לבנים
    מקושת. במאה ה־19 הוכתר המגדל הדרום־מזרחי במגדל פעמונים קטן ומשושה: מגדל שנבנה להגנה, ולבסוף למד לצלצל
    בפעמונים.
  tip: >-
    הכניסה חינם. זו כנסייה פעילה, ולכן יש לכסות כתפיים וברכיים; נשים כדאי שיביאו כיסוי ראש. בבוקר יום
    ראשון מתקיימת הליטורגיה — הגיעו אחריה, או עמדו בשקט מאחור והרחיקו את המצלמה בזמן התפילה. חצי שעה מספיקה:
    קודם הפנים, ואחר כך סיבוב איטי מחוץ לחומה, משם המגדלים ומגדל הפעמונים נראים הרבה יותר טוב מאשר מהחצר.
    אל תצפו לראות את האיקונה המפורסמת — היא בטביליסי, באוסף המוזיאון הלאומי הגאורגי. דזאליסי (5 ק"מ) ושאטו
    מוחרני (6 ק"מ) קרובים מספיק כדי להרכיב מהם סיבוב נינוח של חצי יום.
  route: >-
    ממרכז טביליסי סעו בכביש S1 (E60) צפון־מערבה עד מחלף מצחתה. שם עברו לכביש S3, כביש הצבא הגאורגי, סעו
    כ־3 ק"מ צפונה לכיוון נטחטרי, ופנו שמאלה לכביש Sh151, דרך כפרית שחוצה את המישור הפתוח לאורך כ־6 ק"מ
    עד צילקני. בסך הכול 38 ק"מ, כארבעים דקות. הדרך סלולה עד שער הכנסייה, כך שכל רכב חסכוני יתאים בכל עונה;
    מהחניה לחומה הליכה קצרה ושטוחה. תחנות דלק יש בשפע בכבישים S1 ו־S3. אותו כביש Sh151 ממשיך עוד 5 ק"מ
    עד דזאליסי, ומשם אפשר לחזור לכביש S1 ולסגור מעגל.
ar:
  name: كاتدرائية تسيلكاني
  short: >-
    كنيسة تعود أسسها إلى القرن الرابع، أُعيد بناؤها بالحجر الرملي المنحوت، ويطوّقها سور حصين من القرن
    الثامن عشر، في قرية هادئة شمال متسخيتا بقليل.
  body: >-
    **ملوك وأساقفة وراهب من أنطاكية تركوا جميعًا بصماتهم على هذه الكنيسة المبنية من الحجر الرملي، بينما
    تمضي قرية عادية في يومها حول أسوارها.**


    تنسب الحوليات الجورجية الوسيطة أولى الكنائس هنا إلى الملك باكار، الذي حكم كارتلي نحو 365–380 وكان
    ابن ميريان الثالث، أول ملوك المملكة المسيحيين. بدأت كنيسةَ قاعة بسيطة، ثم صارت بازيليكا ثلاثية الأروقة
    في القرن الخامس أو السادس، وأُعيد بناؤها بقبة في القرن الثاني عشر أو الثالث عشر، ثم عاد إليها البنّاؤون
    مرة أخرى في القرنين السادس عشر والسابع عشر. ويَرِد أول ذكر لأساقفة تسيلكاني عام 506، ما يجعلها من
    أقدم الأسقفيات الموثّقة في البلاد.


    القائم اليوم كنيسة على مخطط الصليب داخل المربع، أبعادها 28 في 24 مترًا، مشيّدة من كتل الحجر الرملي
    المنحوت. تحمل القبةَ أربع دعامات قائمة بذاتها، وتُسقط نوافذ الأسطوانة الاثنتا عشرة ضوء النهار على
    الأرض في حزم مائلة. تأمّل الجدران جيدًا: هنا وهناك بقيت رسوم خشنة من القرون الخامس عشر إلى الثامن
    عشر — شذرات لا دورة كاملة، لكنها شذرات صادقة.


    ويقول تقليدٌ تغنّت به ترانيم رجل الدين أرسين بولمايسيميسدزه من القرن الثالث عشر إن يسّى الأنطاكي —
    أحد الآباء السريان الثلاثة عشر الذين وصلوا إلى كارتلي نحو عام 545 — مدفون هنا. وعلى مدى قرون احتفظت
    الكنيسة كذلك بأيقونة «الهوديجيتريا» التسيلكانية، وهي أيقونة من القرن التاسع للعذراء والطفل يحفّ بهما
    رؤساء الملائكة؛ وفي عام 1926 نُقلت إلى تبليسي لحفظها، وهي اليوم من مقتنيات المتحف الوطني الجورجي.


    ويلتفّ حول ذلك كله سور حصين من أواخر القرن الثامن عشر، أبعاده 58 في 72 مترًا، بأبراج ركنية مستديرة
    وبوابة مقوّسة من الآجر. وفي القرن التاسع عشر تُوِّج البرج الجنوبي الشرقي ببرج أجراس صغير سداسي الأضلاع:
    برجٌ بُني للدفاع، تعلّم في النهاية أن يقرع الأجراس.
  tip: >-
    الدخول مجاني. هذه كنيسة عاملة، فاستر كتفيك وركبتيك؛ ويُستحسن أن تحمل النساء غطاء رأس. صباح الأحد وقت
    القداس — فتعالَ بعده، أو قف بهدوء في الخلف وأبعد الكاميرا أثناء الصلاة. تكفي نصف ساعة: الداخل أولًا،
    ثم جولة متمهّلة خارج السور، حيث تبدو الأبراج وبرج الأجراس أوضح بكثير مما تبدو من الفناء. لا تتوقع
    رؤية الأيقونة الشهيرة — فهي في تبليسي ضمن مجموعة المتحف الوطني الجورجي. ودزاليسي (5 كم) وشاتو موخراني
    (6 كم) قريبتان بما يكفي لتكوين جولة هادئة لنصف يوم.
  route: >-
    من وسط تبليسي اسلك الطريق S1 (E60) باتجاه الشمال الغربي حتى تقاطع متسخيتا. هناك انتقل إلى الطريق S3،
    الطريق العسكري الجورجي، وسِر نحو 3 كم شمالًا باتجاه ناتاختاري، ثم انعطف يسارًا إلى الطريق Sh151، وهو
    طريق ريفي يعبر السهل المفتوح نحو 6 كم حتى تسيلكاني. المسافة الإجمالية 38 كم، وقرابة 40 دقيقة. الطريق
    معبّد حتى بوابة الكنيسة، فتصلح أي سيارة اقتصادية في أي فصل؛ والمسافة من الموقف إلى السور مشي قصير
    على أرض مستوية. محطات الوقود كثيرة على الطريقين S1 وS3. ويستمر الطريق Sh151 نفسه 5 كم أخرى إلى دزاليسي،
    ومنها يمكنك العودة إلى الطريق S1 وإغلاق الحلقة.
