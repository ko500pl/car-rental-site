ka:
  name: ხანჩალის ტბა
  short: >-
    ზეგნის თხელი ტბა, რომელიც 1968–1980 წლებში ბოლომდე დააშრეს, 1997 წელს ისევ აავსეს და დღეს წეროების,
    ყარყატებისა და ვარხვების გაჩერებაა.
  body: >-
    **ხანჩალი ის ტბაა, რომელიც ერთხელ რუკიდან წაშალეს, მერე კი დაბრუნების ნება მისცეს.**


    ჯავახეთის ზეგანზე, ზღვის დონიდან 1 931 მეტრზე, ნინოწმინდის დასავლეთ განაპირას გაწოლილი მოყავისფრო,
    მტკნარი წყალი იმდენად თხელია, რომ უმეტეს ადგილას ზრდასრულ ადამიანს წელამდეც არ სწვდება. ფსკერზე კი
    ოცდაათ მეტრზე მეტი სისქის შლამი დევს — იმ ქვაბულის ნელ-ნელა დაგროვილი ნალექი, რომელიც ოდესღაც ლავის
    ნაკადმა გადაგუბა.


    1968 წელს ტბის დაშრობა სასოფლო-სამეურნეო მიწისთვის დაიწყეს და 1980 წლისთვის ხანჩალი აღარ არსებობდა.
    წყალი მხოლოდ 1997 წელს დაბრუნდა. დღეს ქვაბულს დამბა ორად ყოფს: ერთ ნაწილში ტბაა, მეორე კი თითქმის
    დაშრა და საძოვრად და სათიბად იქცა — დიდი და პატარა ხანჩალის მცხოვრებნი საქონელს იქ აძოვებენ, სადაც
    ოდესღაც ტბის ფსკერი იყო. ტბა თავისი ძველი ზომის ნახევარიღაა.


    რაც გადარჩა, სწორედ ის არის, რაც ფრინველებს სჭირდებათ. თბილი, თხელი წყალი თითქმის მთლიანად წყლის მცენარეებითაა
    დაფარული და გადაფრენის დროს ტბა დასასვენებელ სადგურად იქცევა: აქ ჩერდებიან რუხი წეროები, რუხი ყანჩები
    და თეთრი ყარყატები, ვარდისფერი და ქოჩორა ვარხვები, წითელი იხვები. ტბა ხანჩალის აღკვეთილის სახელით
    ჯავახეთის დაცული ტერიტორიების ნაწილია.


    ნოემბრის ბოლოდან აპრილის ბოლომდე ზედაპირი იყინება და ზეგანი ჰორიზონტამდე თეთრდება. ზაფხულში სურათი
    უფრო უბრალო და უფრო უცნაურია: დაბალი, მწვანედ შემოსაზღვრული სარკე, ძველ ფსკერზე მოძოვარი საქონელი
    და ცა, რომელიც თითქოს ფეხებთან იწყება.
  tip: >-
    შესვლა უფასოა. საქართველოს ტურიზმის ეროვნული ადმინისტრაცია გირჩევთ, გზა პატარა ხანჩალიდან დაიწყოთ:
    სოფელი ტბაზე ოდნავ მაღლაა და დაახლოებით სამკილომეტრიანი ბილიკი წყლისკენ ეშვება; ნაპირზე მარცხნივ გაუხვიეთ
    და დამბამდე გაჰყევით. წყალგაუმტარი ფეხსაცმელი ჩაიცვით — ნაპირები ჭაობიანია. ბინოკლი წაიღეთ და ტბას
    ადრე დილით ან მზის ჩასვლისას ესტუმრეთ, სასურველია — ფრინველთა გადაფრენის პერიოდში. მაღაზიები და კაფეები
    ნინოწმინდაშია, ტბასთან არაფერია. თევზაობა ნებადართულია. ნოემბრის ბოლოდან აპრილის ბოლომდე ტბა გაყინულია;
    ზაფხულშიც ქარი არ წყდება, ამიტომ თბილი ტანსაცმელი თან იქონიეთ.
  route: >-
    თბილისიდან შ36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ შ31-ით ზეგნის გადაღმა წალკამდე იარეთ, იქიდან
    კი სამხრეთით, ფარავნის ტბის გასწვრივ, ნინოწმინდამდე: დაახლოებით 172 კილომეტრი და 3 საათი და 20 წუთი.
    გზა ბოლომდე ასფალტია, მაგრამ ზეგანზე მისი ხარისხი ცვალებადია და საშუალო სიჩქარე დაბალი რჩება. ტბა
    ქალაქის დასავლეთით მდებარეობს; მოკლე ადგილობრივი გზა პატარა ხანჩალამდე მიდის, მანქანა სოფელში დატოვეთ
    — წყლამდე გზა არ ჩადის. საწვავი წალკაში ან ნინოწმინდაში ჩაასხით. გონივრული არჩევანი მაღალი გამავლობის
    (SUV კლასის) მანქანაა: წვიმის შემდეგ გვერდითი გზები ღრმად იჭრება, ნოემბრიდან კი ქარი მათზე თოვლს ახვეტს.
en:
  name: Khanchali Lake
  short: >-
    A shallow plateau lake drained completely in 1968–1980, refilled in 1997, and now a migration stop
    for cranes, storks and pelicans.
  body: >-
    **Khanchali is a lake that was once erased from the map and then allowed to come back.**


    It lies at 1,931 metres on the Javakheti plateau, on the western edge of Ninotsminda: a sheet of brownish
    fresh water so shallow that across most of it the water would not reach an adult's waist. Beneath
    it lies silt more than thirty metres thick, the slow sediment of a basin dammed long ago by a flow
    of lava.


    In 1968 the lake began to be drained for farmland, and by 1980 Khanchali was gone. Water returned
    only in 1997. Today a dam divides the basin in two: one part holds the lake, while the other has all
    but dried out and turned to pasture and hay meadow, where people from Didi and Patara Khanchali graze
    their animals on what was once the lake bed. The lake is about half its former size.


    What survived is exactly what birds need. The warm, shallow water is almost entirely covered with
    aquatic plants, and during migration it becomes a resting stage on the flyway: common cranes, grey
    herons and white storks, great white and Dalmatian pelicans, ruddy shelducks. The lake is protected
    as the Khanchali Managed Reserve, part of the Javakheti Protected Areas.


    From late November to late April the surface freezes and the plateau turns white to the horizon. In
    summer the picture is simpler and stranger: a low, green-rimmed mirror, cattle grazing on the old
    lake floor, and a sky that seems to begin at your feet.
  tip: >-
    Entry is free. The national tourism administration suggests starting in Patara Khanchali: the village
    sits a little above the water, and a path of about three kilometres leads down to it; at the shore,
    turn left and follow it to the dam. Wear waterproof boots, as the margins are boggy. Bring binoculars
    and come in the first or last hours of light, ideally during migration. Shops and cafés are in Ninotsminda;
    there is nothing at the lake. Fishing is permitted. The lake is frozen from late November to late
    April, and even in summer the wind never stops, so pack a warm layer.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi, then the Sh31 over the plateau to Tsalka,
    and head south along Lake Paravani to Ninotsminda: about 172 km and 3 hours 20 minutes. It is asphalt
    all the way, but the surface on the plateau varies and average speeds stay low. The lake lies just
    west of the town; a short local road leads to Patara Khanchali, where you leave the car, since no
    road goes down to the water. Fill up in Tsalka or Ninotsminda. An SUV is the sensible choice: side
    roads rut after rain, and from November the wind drifts snow across them.
ru:
  name: Озеро Ханчали
  short: >-
    Мелкое озеро на нагорье: осушено в 1968–1980 годах, вновь наполнено в 1997-м, теперь — остановка журавлей,
    аистов и пеликанов.
  body: >-
    **Ханчали — озеро, которое однажды стёрли с карты, а потом позволили ему вернуться.**


    Оно лежит на высоте 1931 метр на Джавахетском нагорье, у западной окраины Ниноцминды: гладь бурой
    пресной воды, такой мелкой, что почти на всём её протяжении взрослому человеку не будет и по пояс.
    Под водой — слой ила толщиной более тридцати метров, медленный осадок котловины, которую давным-давно
    перегородил лавовый поток.


    В 1968 году озеро начали осушать под сельхозугодья, и к 1980 году Ханчали не стало. Вода вернулась
    лишь в 1997 году. Сегодня котловину делит надвое дамба: в одной части стоит озеро, другая почти пересохла
    и превратилась в пастбище и сенокос, где жители Диди-Ханчали и Патара-Ханчали пасут скот на бывшем
    дне. Озеро теперь примерно вдвое меньше прежнего.


    Уцелело ровно то, что нужно птицам. Тёплая мелкая вода почти сплошь покрыта водной растительностью,
    и во время миграции озеро становится местом отдыха на пролётном пути: серые журавли, серые цапли и
    белые аисты, розовые и кудрявые пеликаны, огари. Озеро охраняется как заказник Ханчали — часть Джавахетских
    охраняемых территорий.


    С конца ноября до конца апреля поверхность замерзает, и нагорье белеет до самого горизонта. Летом
    картина проще и страннее: низкое зеркало в зелёной кайме, коровы на старом дне и небо, которое словно
    начинается у вас под ногами.
  tip: >-
    Вход свободный. Национальная администрация туризма советует начинать с Патара-Ханчали: село стоит
    чуть выше воды, и к ней спускается тропа длиной около трёх километров; у берега поверните налево и
    идите вдоль воды до дамбы. Наденьте непромокаемую обувь — края озера топкие. Возьмите бинокль и приходите
    в первые или последние часы светового дня, лучше всего во время миграции. Магазины и кафе — в Ниноцминде;
    у озера нет ничего. Рыбалка разрешена. С конца ноября до конца апреля озеро сковано льдом, а ветер
    не стихает даже летом, так что возьмите тёплую одежду.
  route: >-
    Из Тбилиси — по Sh36 через Коджори и Манглиси, затем по Sh31 через нагорье до Цалки и на юг вдоль
    озера Паравани до Ниноцминды: около 172 км и 3 часа 20 минут. Асфальт на всём пути, но на нагорье
    покрытие неровное, и средняя скорость остаётся низкой. Озеро лежит сразу к западу от города; короткая
    местная дорога ведёт в Патара-Ханчали, где машину придётся оставить: к воде дороги нет. Заправьтесь
    в Цалке или Ниноцминде. Разумный выбор — кроссовер или внедорожник (SUV): второстепенные дороги после
    дождя разбиты колеёй, а с ноября ветер наметает на них снег.
fa:
  name: دریاچهٔ خانچالی
  short: >-
    دریاچه‌ای کم‌عمق بر فلات که ۱۹۶۸ تا ۱۹۸۰ خشکانده شد، در ۱۹۹۷ دوباره پر شد و اکنون منزلگاه کوچ درناها،
    لک‌لک‌ها و پلیکان‌هاست.
  body: >-
    **خانچالی دریاچه‌ای است که روزگاری از نقشه پاک شد و سپس اجازه یافت بازگردد.**


    این دریاچه در ارتفاع ۱٬۹۳۱ متری بر فلات جاواختی، در لبهٔ غربی نینوتسمیندا جای دارد: پهنه‌ای از آب
    شیرین قهوه‌ای‌رنگ، چنان کم‌عمق که در بیشتر جاهایش آب حتی به کمر آدمی بزرگسال نمی‌رسد. زیر آن لایه‌ای
    از لای به ضخامت بیش از سی متر خفته است؛ ته‌نشست آرام حوضه‌ای که دیرزمانی پیش جریانی از گدازه راهش
    را بست.


    در سال ۱۹۶۸ خشکاندن دریاچه برای کشاورزی آغاز شد و تا ۱۹۸۰ خانچالی دیگر نبود. آب تنها در ۱۹۹۷ بازگشت.
    امروز سدی حوضه را دو نیم می‌کند: یک بخش دریاچه را در خود نگه داشته، و بخش دیگر تقریباً خشکیده و به
    چراگاه و علفزار بدل شده است؛ جایی که مردم دیدی خانچالی و پاتارا خانچالی دام‌هایشان را بر بستر پیشین
    دریاچه می‌چرانند. دریاچه اکنون حدود نیمی از اندازهٔ پیشینش است.


    آنچه ماند، درست همان است که پرندگان نیاز دارند. آب گرم و کم‌عمق تقریباً سراسر پوشیده از گیاهان آبزی
    است، و در فصل کوچ به منزلگاهی در مسیر پرواز بدل می‌شود: درناهای خاکستری، حواصیل‌های خاکستری و لک‌لک‌های
    سفید، پلیکان‌های سفید بزرگ و پلیکان‌های خاکستری، و آنقوت‌ها. دریاچه با نام ذخیره‌گاه مدیریت‌شدهٔ خانچالی،
    بخشی از مناطق حفاظت‌شدهٔ جاواختی، حفاظت می‌شود.


    از اواخر نوامبر تا اواخر آوریل رویهٔ آب یخ می‌بندد و فلات تا افق سفید می‌شود. در تابستان تصویر ساده‌تر
    و غریب‌تر است: آینه‌ای هم‌سطح زمین با حاشیه‌ای سبز، گاوهایی که بر کف کهن دریاچه می‌چرند، و آسمانی
    که گویی از زیر پای شما آغاز می‌شود.
  tip: >-
    ورود رایگان است. سازمان ملی گردشگری پیشنهاد می‌کند از پاتارا خانچالی آغاز کنید: روستا اندکی بالاتر
    از آب است و راهی پیاده به طول حدود سه کیلومتر تا دریاچه پایین می‌رود؛ در کرانه به چپ بپیچید و در امتداد
    آن تا سد بروید. کفش ضدآب بپوشید، چون حاشیه‌ها باتلاقی‌اند. دوربین دوچشمی بیاورید و در نخستین یا واپسین
    ساعت‌های روشنایی روز بیایید، و بهتر از همه در فصل کوچ. مغازه‌ها و کافه‌ها در نینوتسمیندا هستند؛ کنار
    دریاچه هیچ چیز نیست. ماهیگیری مجاز است. دریاچه از اواخر نوامبر تا اواخر آوریل یخ‌بسته است، و حتی در
    تابستان هم باد هرگز نمی‌ایستد، پس لایه‌ای گرم همراه بیاورید.
  route: >-
    از تفلیس با جادهٔ Sh36 از کوجوری و مانگلیسی بگذرید، سپس با Sh31 از روی فلات به تسالکا بروید و در امتداد
    دریاچهٔ پاراوانی به سوی جنوب تا نینوتسمیندا برانید: حدود ۱۷۲ کیلومتر و ۳ ساعت و ۲۰ دقیقه. سراسر راه
    آسفالت است، اما کیفیت رویه بر فلات یکسان نیست و میانگین سرعت پایین می‌ماند. دریاچه درست در غرب شهر
    است؛ جاده‌ای محلی و کوتاه به پاتارا خانچالی می‌رود، جایی که باید خودرو را بگذارید، چون هیچ جاده‌ای
    تا لب آب نمی‌رود. در تسالکا یا نینوتسمیندا باک را پر کنید. خودروی شاسی‌بلند (SUV) انتخاب معقولی است:
    راه‌های فرعی پس از باران شیار می‌افتند، و از نوامبر باد برف را بر آن‌ها انباشته می‌کند.
he:
  name: אגם חנצ'לי
  short: >-
    אגם רדוד ברמה, שיובש כליל בין 1968 ל-1980, התמלא שוב ב-1997, והיום הוא תחנת עצירה לעגורים, לחסידות
    ולשקנאים בנתיב הנדידה.
  body: >-
    **חנצ'לי הוא אגם שנמחק פעם מן המפה, ואחר כך הורשה לחזור.**


    הוא שוכן בגובה 1,931 מטר ברמת ג'אווחטי, בקצה המערבי של נינוצמינדה: משטח של מים מתוקים חומחמים, רדודים
    כל כך שברוב שטחו המים לא יגיעו למבוגר אפילו עד המותניים. מתחתיו שכבת סחף בעובי של יותר משלושים מטר
    – משקע איטי של אגן שזרם לבה חסם לפני זמן רב.


    ב-1968 החלו לייבש את האגם לטובת חקלאות, ועד 1980 חנצ'לי כבר לא היה. המים חזרו רק ב-1997. היום סוללה
    מחלקת את האגן לשניים: בחלק אחד נמצא האגם, והחלק האחר כמעט התייבש לגמרי והפך לשטח מרעה ולאחו של חציר,
    שבו תושבי דידי חנצ'לי ופטרה חנצ'לי רועים את בהמותיהם על מה שהיה פעם קרקעית האגם. האגם הוא היום בערך
    מחצית מגודלו המקורי.


    מה שנשאר הוא בדיוק מה שהציפורים צריכות. המים החמים והרדודים מכוסים כמעט כולם בצמחיית מים, ובעונת הנדידה
    האגם הופך לתחנת מנוחה בנתיב המעוף: עגורים אפורים, אנפות אפורות וחסידות לבנות, שקנאים מצויים ושקנאים
    מסולסלים, קזרקות חלודיות. האגם מוגן כשמורה המנוהלת חנצ'לי, חלק מהשטחים המוגנים של ג'אווחטי.


    מסוף נובמבר ועד סוף אפריל פני המים קופאים, והרמה מלבינה עד האופק. בקיץ התמונה פשוטה ומוזרה יותר: מראה
    נמוכה עם שוליים ירוקים, בקר שרועה על קרקעית האגם הישנה, ושמיים שנדמה כי הם מתחילים לרגליכם.
  tip: >-
    הכניסה חינם. מִנהלת התיירות הלאומית ממליצה להתחיל בפטרה חנצ'לי: הכפר יושב מעט מעל המים, ושביל של כשלושה
    קילומטרים יורד אליהם; בשפת האגם פנו שמאלה והלכו לאורכו עד הסוללה. נעלו נעליים עמידות למים, כי השוליים
    ביצתיים. הביאו משקפת ובואו בשעות האור הראשונות או האחרונות, ובמיוחד בעונת הנדידה. חנויות ובתי קפה
    יש בנינוצמינדה; ליד האגם אין כלום. מותר לדוג. האגם קפוא מסוף נובמבר ועד סוף אפריל, וגם בקיץ הרוח לא
    נחה לרגע, אז קחו שכבה חמה.
  route: >-
    מטביליסי נוסעים בכביש Sh36 דרך קוג'ורי ומנגליסי, אחר כך בכביש Sh31 מעל הרמה עד צלקה, ומשם דרומה לאורך
    אגם פרוואני עד נינוצמינדה: כ-172 ק"מ ו-3 שעות ו-20 דקות. כל הדרך אספלט, אבל איכות הכביש ברמה משתנה
    והמהירות הממוצעת נשארת נמוכה. האגם נמצא ממש ממערב לעיר; דרך מקומית קצרה מובילה לפטרה חנצ'לי, ושם משאירים
    את הרכב, כי אין דרך שיורדת עד המים. תדלקו בצלקה או בנינוצמינדה. רכב SUV הוא הבחירה הנבונה: הדרכים
    הצדדיות נחרשות בתלמים אחרי גשם, ומנובמבר הרוח מערימה עליהן שלג.
ar:
  name: بحيرة خانتشالي
  short: >-
    بحيرة ضحلة على الهضبة جُفّفت تماماً بين 1968 و1980، ثم امتلأت من جديد عام 1997، وهي اليوم محطة للكراكي
    واللقالق والبجع على طريق الهجرة.
  body: >-
    **خانتشالي بحيرة مُحيت ذات يوم من الخريطة، ثم أُذن لها بأن تعود.**


    تقع على ارتفاع 1,931 متراً فوق هضبة جافاخيتي، عند الطرف الغربي لنينوتسميندا: صفحة من الماء العذب المائل
    إلى السمرة، ضحلة إلى حدّ أن الماء في معظمها لا يبلغ خصر رجل بالغ. وتحتها طبقة من الطمي يزيد سُمكها
    على ثلاثين متراً، هي الرواسب البطيئة لحوض سدّه تدفّق من الحمم منذ زمن بعيد.


    في عام 1968 بدأ تجفيف البحيرة لأغراض الزراعة، وبحلول 1980 كانت خانتشالي قد اختفت. ولم يعد الماء إلا
    في 1997. واليوم يقسم سدّ الحوض قسمين: أحدهما يحتضن البحيرة، والآخر جفّ تقريباً وصار مرعى ومرجاً للتبن،
    يرعى فيه أهالي ديدي خانتشالي وباتارا خانتشالي ماشيتهم على ما كان يوماً قاع البحيرة. وحجم البحيرة الآن
    نحو نصف ما كان عليه.


    وما بقي هو بالضبط ما تحتاج إليه الطيور. فالماء الدافئ الضحل مغطّى بالنباتات المائية كلّه تقريباً،
    وفي مواسم الهجرة تغدو البحيرة محطة استراحة على مسار الطيران: الكراكي الشائعة، ومالك الحزين الرمادي،
    واللقالق البيضاء، والبجع الأبيض الكبير والبجع الدلماسي، والشهرمان الأمغر. والبحيرة محمية بوصفها محمية
    خانتشالي المُدارة، ضمن المناطق المحمية في جافاخيتي.


    من أواخر نوفمبر حتى أواخر أبريل يتجمّد سطح الماء، وتبيضّ الهضبة حتى الأفق. أما في الصيف فالمشهد أبسط
    وأغرب: مرآة منخفضة بإطار أخضر، وأبقار ترعى في قاع البحيرة القديم، وسماء تبدو كأنها تبدأ عند قدميك.
  tip: >-
    الدخول مجاني. تنصح الهيئة الوطنية للسياحة بالبدء من باتارا خانتشالي: فالقرية تقع أعلى الماء بقليل،
    ويهبط منها إليه درب طوله نحو ثلاثة كيلومترات؛ وعند الشاطئ انعطف يساراً وسِر بمحاذاته حتى السد. البس
    حذاءً مقاوماً للماء، فالحواف موحلة. احمل منظاراً ثنائياً وتعالَ في أولى ساعات الضوء أو آخرها، ويُستحسن
    في موسم الهجرة. المتاجر والمقاهي في نينوتسميندا؛ ولا شيء عند البحيرة. الصيد مسموح. تتجمّد البحيرة
    من أواخر نوفمبر حتى أواخر أبريل، والريح لا تهدأ حتى في الصيف، فاحمل طبقة دافئة.
  route: >-
    من تبليسي خذ الطريق Sh36 عبر كوجوري ومانغليسي، ثم الطريق Sh31 عبر الهضبة إلى تسالكا، واتجه جنوباً
    على امتداد بحيرة بارافاني حتى نينوتسميندا: نحو 172 كم و3 ساعات و20 دقيقة. الطريق معبّد بالإسفلت كله،
    لكن جودته على الهضبة متفاوتة، فيبقى متوسط السرعة منخفضاً. تقع البحيرة غرب البلدة مباشرة؛ ويقود طريق
    محلي قصير إلى باتارا خانتشالي، حيث تترك السيارة، إذ لا طريق ينزل إلى الماء. املأ خزان الوقود في تسالكا
    أو نينوتسميندا. السيارة الرياضية متعددة الاستخدامات (SUV) هي الخيار المعقول: فالطرق الفرعية تتخدّد
    بعد المطر، ومن نوفمبر تكدّس الريح الثلج فوقها.
