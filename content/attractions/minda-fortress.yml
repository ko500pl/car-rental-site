ka:
  name: მინდა ციხე
  short: >-
    რაჭული ციხის ნანგრევი სოფელ წესთან, კლდის კონცხზე: XVI საუკუნეში მეფის წყალობა, დღეს საქართველოს ერთ-ერთი
    ყველაზე ძნელად მისადგომი ციხე.
  body: >-
    **მინდა ციხე იქ ააგეს, სადაც მტერი ვერ მიაღწევდა — და საუკუნეების შემდეგაც მთა სტუმარს ხედს უბრალოდ
    არ ჩუქნის.**


    ზუსტად არავინ იცის, როდის დაიდო პირველი ქვა სოფელ წესის მახლობლად აღმართულ ამ კლდეზე, თუმცა ვარაუდობენ,
    რომ ციხე აქ უკვე X საუკუნეში იდგა. მისი დოკუმენტური ისტორია XVI საუკუნის 30-იან წლებში იწყება: იმერთა
    მეფე ბაგრატ III-მ მინდა ციხე-დარბაზი ჩხეტიძეთა სახლს გადასცა და მასთან ერთად რაჭის სადროშოს მეთაურობაც
    უწყალობა. ჩხეტიძეები რაჭას ერისთავებად 1789 წლამდე განაგებდნენ.


    დღეს ციხე ნანგრევია, რომელიც თითქოს კლდიდან ამოზრდილა: გალავანი, სამი კოშკი და ოთახი, რომელსაც სარკმელი
    ჯერაც შემორჩა. ვარაუდობენ, რომ გვერდით მეორე ოთახიცაა, მაგრამ ჩამოქცეულ კედელს მისასვლელი ჩაუხშავს.
    აღმოსავლეთ ნაწილში პატარა, დაზიანებული ადრეული შუა საუკუნეების ეკლესია დგას. შორიდან მთელი კომპლექსი
    მუქ ქარაფს ერწყმის; ქვის წყობას კლდისგან მხოლოდ ახლოს მისული გაარჩევს.


    რაჭა ღვინის მხარეა და მინდა ციხესაც თავისი ღვინის ამბავი აქვს. ერთი წყაროს მიხედვით, აქ ოდესღაც რეკორდული
    ზომის, რვატონიანი ქვევრი ინახებოდა. მისი კვალი არსად ჩანს, ამიტომ ეს ამბავი ხეობის საყვარელ თქმულებად
    მიიღეთ. დადასტურებული კავშირი უფრო მოკრძალებულია: საბჭოთა წლებში ციხის გამოსახულება ღვინო „ბარაკონის“
    ეტიკეტზე იბეჭდებოდა — იმ ღვინისა, რომელიც ორი კილომეტრით დაშორებული ტაძრის სახელს ატარებს.


    ციხეს არც მცველი სჭირდება და არც ბილეთი: ზედმეტ სტუმარს ბილიკი დღესაც თავად ცრის.
  tip: >-
    ციხესთან არც ბილეთია, არც მცველი, არც კაფე და არც ტუალეტი — წყალი და საჭმელი ამბროლაურიდან წამოიღეთ.
    წესიდან ამავალი ბილიკი ვიწროა და მოუნიშნავი; საქართველოს ტურიზმის ეროვნული ადმინისტრაცია ამ ციხეს
    ქვეყნის ერთ-ერთ ყველაზე ძნელად მისადგომ ციხედ მოიხსენიებს. ადით მხოლოდ მშრალ ამინდში, კარგი ძირის
    მქონე ფეხსაცმლით; მცირეწლოვან ბავშვებთან ან სიმაღლის შიშის მქონე თანამგზავრთან ერთად ეს ასვლა არ ღირს.
    ბილიკის დასაწყისი სოფელში იკითხეთ. კედლებზე ნუ აძვრებით — კომპლექსის ნაწილი უკვე ჩამოშლილია. ასვლასა
    და დათვალიერებას საათნახევარი დაუთმეთ, ორი კილომეტრით დაშორებული ბარაკონის ტაძარიც დაამატეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ თერჯოლის გადასახვევამდე, შემდეგ შ19-ით თერჯოლის გავლით
    ტყიბულამდე და შ17-ით, ნაქერალას უღელტეხილზე გადავლით, ამბროლაურამდე. ამბროლაურიდან შ16-ით აღმოსავლეთით,
    ონის მიმართულებით, წესამდე ათიოდე წუთია. სულ დაახლოებით 274 კმ და ოთხი საათი და ოცი წუთი. მთავარი
    გზები ასფალტიანია; სოფლამდე ბოლო მონაკვეთი შეიძლება გრუნტი იყოს და წვიმის შემდეგ ტალახიანდება — ამიტომ
    გირჩევთ მაღალი გამავლობის მანქანას (ჯიპს), თუმცა ყველაზე რთული ნაწილი მაინც ფეხით გასავლელია. საწვავი,
    ნაღდი ფული და საკვები ამბროლაურშია. ნავიგატორში „მინდაციხე“ ჩაწერეთ.
en:
  name: Minda Fortress
  short: >-
    A ruined Racha stronghold on a crag near Tsesi, granted by a king of Imereti in the 1530s and still
    one of the hardest castles in Georgia to reach.
  body: >-
    **Minda was built where no enemy could reach it, and centuries on the mountain still makes visitors
    earn the view.**


    Nobody knows exactly when the first stones went up on this crag near the village of Tsesi, but a fortress
    is thought to have stood here by the 10th century. Its documented story begins in the 1530s, when
    Bagrat III, King of Imereti, granted Minda to the house of Chkhetidze, and with it command of Racha's
    sadrosho, the military district that marched under one banner. The Chkhetidze went on ruling Racha
    as its dukes until 1789.


    What survives looks as if it grew out of the rock: a curtain wall, three towers and a room that still
    keeps its window. A second room is thought to lie beyond it, sealed off by a collapsed wall. In the
    eastern part stands a small early medieval church, damaged but recognisable. From a distance the whole
    complex dissolves into the dark crag; only up close does the masonry separate from the cliff.


    Racha is wine country, and Minda has a wine story of its own. One source claims that a qvevri of record
    size, weighing eight tonnes, was once kept inside the walls. No trace of it has ever been found, so
    treat it as the valley's favourite tall tale. The documented link is humbler: in Soviet times the
    fortress appeared on the label of Barakoni wine, which shares its name with the church two kilometres
    away.


    The fortress needs no guard and no ticket office. The path still does the sifting.
  tip: >-
    There is no fee, guard, café or toilet, so bring water and food from Ambrolauri. The path up from
    Tsesi is narrow and unmarked, and Georgia's National Tourism Administration lists Minda among the
    hardest fortresses in the country to reach. Go only in dry weather, in boots with a good grip, and
    leave it out if you have small children or anyone uneasy with heights. Ask in the village where the
    path starts. Keep off the walls, because part of the complex has already collapsed. Allow an hour
    and a half for the climb and the ruins, and add Barakoni church, two kilometres away.
  route: >-
    From Tbilisi take the S1 (E60) west to the Terjola turn-off, then the Sh19 through Terjola to Tkibuli
    and the Sh17 over the Nakerala pass down to Ambrolauri. There turn east on the Sh16 towards Oni; Tsesi
    is about ten minutes on. The whole trip is about 274 km and four hours twenty minutes. The main roads
    are asphalt. The last lane into the village may be unpaved and turns muddy after rain, which is why
    we recommend an SUV, though the hardest part is on foot anyway. Fuel, cash and food are in Ambrolauri.
    Set your navigator to Mindatsikhe (მინდაციხე).
ru:
  name: Крепость Минда
  short: >-
    Руины рачинской твердыни на утёсе у Цеси: в 1530-х её пожаловал имеретинский царь, и сегодня это одна
    из самых труднодоступных крепостей Грузии.
  body: >-
    **Минду строили там, куда не мог добраться ни один враг, и спустя столетия гора по-прежнему заставляет
    гостей заслужить этот вид.**


    Никто точно не знает, когда на этом утёсе у села Цеси легли первые камни, но считается, что крепость
    стояла здесь уже к X веку. Её документированная история начинается в 1530-х годах, когда имеретинский
    царь Баграт III пожаловал Минду дому Чхетидзе, а вместе с ней — командование рачинским садрошо, военным
    округом, выступавшим под одним знаменем. Чхетидзе затем правили Рачей как её эриставы вплоть до 1789
    года.


    То, что уцелело, словно выросло из скалы: участок крепостной стены, три башни и помещение, в котором
    до сих пор сохранилось окно. Считается, что за ним есть второе, отрезанное обрушившейся стеной. В
    восточной части стоит маленькая раннесредневековая церковь — повреждённая, но узнаваемая. Издали весь
    комплекс растворяется в тёмном утёсе; лишь вблизи кладка отделяется от скалы.


    Рача — край вина, и у Минды есть своя винная история. Один источник утверждает, что когда-то в стенах
    крепости хранился квеври рекордного размера весом восемь тонн. Никаких его следов так и не нашли,
    так что считайте это любимой байкой долины. Задокументированная связь скромнее: в советское время
    крепость изображали на этикетке вина «Баракони», которое носит имя церкви в двух километрах отсюда.


    Крепости не нужны ни сторож, ни касса. Отбор по-прежнему проводит тропа.
  tip: >-
    Ни платы за вход, ни сторожа, ни кафе, ни туалета — воду и еду везите из Амбролаури. Тропа от Цеси
    узкая и не размечена, а Национальная администрация туризма Грузии относит Минду к самым труднодоступным
    крепостям страны. Идите только в сухую погоду, в ботинках с хорошим сцеплением, и откажитесь от подъёма,
    если с вами маленькие дети или кто-то, кому неуютно на высоте. Где начинается тропа, спросите в селе.
    На стены не забирайтесь: часть комплекса уже обрушилась. На подъём и руины заложите полтора часа и
    добавьте церковь Баракони в двух километрах отсюда.
  route: >-
    Из Тбилиси по S1 (E60) на запад до поворота на Терджолу, затем по Sh19 через Терджолу до Ткибули и
    по Sh17 через перевал Накерала вниз, в Амбролаури. Там сверните на восток на Sh16 в сторону Они; до
    Цеси около десяти минут. Весь путь — около 274 км и четыре часа двадцать минут. Основные дороги асфальтированы.
    Последний проезд к селу может быть грунтовым и после дождя раскисает, поэтому мы советуем кроссовер,
    хотя самое трудное всё равно придётся пройти пешком. Топливо, наличные и еда — в Амбролаури. В навигаторе
    ищите Миндацихе (მინდაციხე).
fa:
  name: قلعهٔ میندا
  short: >-
    ویرانهٔ دژی راچایی بر صخره‌ای نزدیک تسسی که در دههٔ ۱۵۳۰ پادشاه ایمرتی آن را واگذار کرد و هنوز از
    دشوارگذرترین قلعه‌های گرجستان است.
  body: >-
    **میندا را جایی ساختند که هیچ دشمنی به آن نرسد، و سده‌ها بعد، کوه هنوز این منظره را تنها به بهای عرق
    ریختن به بازدیدکننده می‌دهد.**


    کسی دقیق نمی‌داند نخستین سنگ‌ها کی بر این صخره نزدیک روستای تسسی نهاده شد، اما گمان می‌رود تا سدهٔ
    دهم دژی اینجا برپا بوده است. تاریخ مستندش از دههٔ ۱۵۳۰ آغاز می‌شود، هنگامی که باگرات سوم، پادشاه ایمرتی،
    میندا را به خاندان چختیدزه بخشید و همراه آن فرماندهی «سادروشو»ی راچا را، یعنی ناحیهٔ نظامی‌ای که زیر
    یک پرچم به میدان می‌رفت. چختیدزه‌ها از آن پس تا سال ۱۷۸۹ در مقام اریستاوها (فرمانروایان موروثی) بر
    راچا حکم راندند.


    آنچه مانده گویی از دل صخره روییده است: پاره‌ای از بارو، سه برج و اتاقی که هنوز پنجره‌اش را دارد. گمان
    می‌رود اتاق دیگری پشت آن باشد که دیواری فروریخته راهش را بسته است. در بخش شرقی، کلیسای کوچکی از اوایل
    سده‌های میانه ایستاده، آسیب‌دیده اما بازشناختنی. از دور تمام مجموعه در صخرهٔ تیره حل می‌شود؛ تنها
    از نزدیک است که سنگ‌چینِ دیوارها از تن کوه جدا می‌شود.


    راچا سرزمین شراب است و میندا هم داستان شرابی خودش را دارد. یک منبع ادعا می‌کند که روزگاری کوِوری‌ای
    (خمرهٔ سفالی شراب) با اندازه‌ای بی‌سابقه و هشت تن وزن درون باروها نگهداری می‌شده است. هیچ نشانی از
    آن یافت نشده، پس آن را قصهٔ پرآب‌وتابِ محبوب دره بدانید. پیوند مستند فروتنانه‌تر است: در دوران شوروی
    تصویر قلعه بر برچسب شراب «باراکونی» نقش بسته بود، شرابی هم‌نام کلیسایی که دو کیلومتر آن‌سوتر است.


    این دژ نه نگهبان می‌خواهد و نه باجهٔ بلیت. غربال را هنوز خودِ کوره‌راه انجام می‌دهد.
  tip: >-
    نه ورودیه‌ای هست، نه نگهبان، نه کافه و نه دست‌شویی؛ آب و غذا را از آمبرولائوری بیاورید. کوره‌راهی
    که از تسسی بالا می‌رود باریک و بی‌نشانه است و ادارهٔ ملی گردشگری گرجستان میندا را در شمار دشوارگذرترین
    قلعه‌های کشور آورده است. فقط در هوای خشک و با پوتینِ کف‌چسبنده بروید، و اگر کودک خردسال یا همراهی
    دارید که از ارتفاع می‌هراسد، از خیرش بگذرید. سرآغاز کوره‌راه را در روستا بپرسید. از دیوارها بالا نروید،
    چون بخشی از مجموعه پیش‌تر فروریخته است. برای بالا رفتن و گشتن در ویرانه‌ها یک ساعت و نیم در نظر بگیرید
    و کلیسای باراکونی را هم، که دو کیلومتر آن‌سوتر است، به برنامه بیفزایید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا خروجی ترجولا بروید، سپس از Sh19 و از میان ترجولا تا تکیبولی،
    و با Sh17 از گردنهٔ ناکرالا به آمبرولائوری سرازیر شوید. آنجا به شرق، به Sh16 به سوی اونی بپیچید؛ تسسی
    حدود ده دقیقه جلوتر است. کل مسیر حدود ۲۷۴ کیلومتر و چهار ساعت و بیست دقیقه است. جاده‌های اصلی آسفالت‌اند.
    آخرین راهِ ورودی به روستا شاید خاکی باشد و پس از باران گِلی می‌شود؛ از همین رو خودروی شاسی‌بلند را
    توصیه می‌کنیم، هرچند سخت‌ترین بخش به هر حال پیاده است. سوخت، پول نقد و غذا در آمبرولائوری است. در
    مسیریاب Mindatsikhe (მინდაციხე) را وارد کنید.
he:
  name: מצודת מינדה
  short: >-
    חורבות מבצר בראצ'ה על צוק ליד צסי, שמלך אימרתי העניק בשנות ה-30 של המאה ה-16, ועדיין אחד המבצרים הקשים
    ביותר להגעה בגאורגיה.
  body: >-
    **מינדה נבנתה במקום שאף אויב לא יכול היה להגיע אליו, וכעבור מאות שנים ההר עדיין גובה מהמבקרים מחיר
    על הנוף.**


    איש אינו יודע בדיוק מתי הונחו האבנים הראשונות על הצוק הזה ליד הכפר צסי, אבל מקובל שכבר במאה ה-10 עמד
    כאן מבצר. ההיסטוריה המתועדת שלו מתחילה בשנות ה-30 של המאה ה-16, כאשר בגרט השלישי, מלך אימרתי, העניק
    את מינדה לבית צ'חטידזה, ויחד איתה את הפיקוד על הסדרושו של ראצ'ה – המחוז הצבאי שיצא לקרב תחת דגל אחד.
    בני צ'חטידזה המשיכו לשלוט בראצ'ה כדוכסים (אריסטאווים) שלה עד 1789.


    מה ששרד נראה כאילו צמח מתוך הסלע: קטע חומה, שלושה מגדלים וחדר שעדיין שמר על חלונו. משערים שמאחוריו
    יש חדר נוסף, שנחסם בקיר שקרס. בחלק המזרחי עומדת כנסייה קטנה מימי הביניים המוקדמים, פגועה אך ניתנת
    לזיהוי. ממרחק כל המתחם נמס בתוך הצוק הכהה; רק מקרוב הבנייה נפרדת מן הסלע.


    ראצ'ה היא ארץ יין, ולמינדה יש סיפור יין משלה. מקור אחד טוען שבין חומותיה נשמר פעם קוורי – כד יין גאורגי
    מחרס – בגודל שיא, במשקל שמונה טונות. שום זכר לו לא נמצא מעולם, אז התייחסו לזה כאל המעשייה האהובה על
    העמק. הקשר המתועד צנוע יותר: בתקופה הסובייטית הופיע המבצר על תווית היין "ברקוני", הנושא את שמה של
    הכנסייה שבמרחק שני קילומטרים.


    למבצר אין צורך בשומר או בקופה. השביל עדיין עושה את הסינון.
  tip: >-
    אין דמי כניסה, שומר, בית קפה או שירותים, אז הביאו מים ואוכל מאמברולאורי. השביל העולה מצסי צר ואינו
    מסומן, והרשות הלאומית לתיירות של גאורגיה מונה את מינדה בין המבצרים הקשים ביותר להגעה במדינה. צאו רק
    במזג אוויר יבש, בנעליים עם אחיזה טובה, וותרו אם יש איתכם ילדים קטנים או מישהו שלא נוח לו בגובה. שאלו
    בכפר היכן מתחיל השביל. אל תטפסו על החומות, כי חלק מהמתחם כבר קרס. הקצו שעה וחצי לטיפוס ולחורבות, והוסיפו
    את כנסיית ברקוני, שני קילומטרים משם.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) עד הפנייה לטרג'ולה, משם בכביש Sh19 דרך טרג'ולה עד טקיבולי ובכביש Sh17
    דרך מעבר נקרלה ובירידה לאמברולאורי. שם פנו מזרחה לכביש Sh16 לכיוון אוני; צסי נמצאת כעשר דקות נסיעה
    משם. כל הדרך כ-274 ק"מ, ארבע שעות ועשרים דקות. הכבישים הראשיים סלולים. הדרך האחרונה אל הכפר עשויה
    להיות לא סלולה, ואחרי גשם היא הופכת בוצית, ולכן אנו ממליצים על רכב פנאי-שטח, אף שהחלק הקשה ביותר נעשה
    ממילא ברגל. דלק, מזומנים ואוכל – באמברולאורי. בניווט הקלידו Mindatsikhe (მინდაციხე).
ar:
  name: قلعة ميندا
  short: >-
    أطلال معقل في راتشا فوق جرف قرب تسيسي، منحه ملك إيميريتي في ثلاثينيات القرن السادس عشر، ولا يزال من
    أصعب قلاع جورجيا بلوغاً.
  body: >-
    **بُنيت ميندا حيث لا يبلغها عدو، وبعد قرون ما زال الجبل لا يمنح منظره إلا لمن يتعب في الصعود.**


    لا أحد يعرف على وجه الدقة متى وُضعت الحجارة الأولى على هذا الجرف قرب قرية تسيسي، لكن يُعتقد أن حصناً
    كان قائماً هنا بحلول القرن العاشر. أما تاريخها الموثّق فيبدأ في ثلاثينيات القرن السادس عشر، حين منح
    باغرات الثالث، ملك إيميريتي، ميندا لآل تشخيتيدزه، ومعها قيادة «سادروشو» راتشا، أي الدائرة العسكرية
    التي كانت تسير تحت راية واحدة. وظلّ آل تشخيتيدزه يحكمون راتشا دوقاتٍ لها حتى عام 1789.


    وما بقي يبدو كأنه نبت من الصخر: جزء من السور، وثلاثة أبراج، وغرفة ما زالت تحتفظ بنافذتها. ويُعتقد
    أن وراءها غرفة ثانية أغلقها جدار منهار. وفي الجزء الشرقي تقوم كنيسة صغيرة من أوائل العصور الوسطى،
    متضرّرة لكن يمكن تمييزها. من بعيد يذوب المجمّع كله في الجرف الداكن؛ ولا ينفصل البناء عن الصخر إلا
    عن قرب.


    راتشا بلاد نبيذ، ولميندا حكايتها مع النبيذ أيضاً. يزعم أحد المصادر أن جرّة «كفيري» قياسية الحجم، تزن
    ثمانية أطنان، حُفظت يوماً داخل الأسوار. لم يُعثر لها على أثر قط، فاعتبرها الحكاية المبالَغ فيها الأثيرة
    لدى أهل الوادي. أما الصلة الموثّقة فأكثر تواضعاً: ففي العهد السوفييتي ظهرت القلعة على ملصق نبيذ «باراكوني»،
    الذي يحمل اسم الكنيسة القائمة على بعد كيلومترين.


    لا تحتاج القلعة إلى حارس ولا إلى شبّاك تذاكر. فالدرب ما زال يتولّى الغربلة.
  tip: >-
    لا رسوم ولا حارس ولا مقهى ولا دورة مياه، فأحضر الماء والطعام من أمبرولاوري. الدرب الصاعد من تسيسي
    ضيق وغير مُعلَّم، وتُدرج الإدارة الوطنية للسياحة في جورجيا ميندا بين أصعب قلاع البلاد بلوغاً. لا تذهب
    إلا في طقس جاف، وبحذاء ذي نعل لا ينزلق، وتخلَّ عن الفكرة إن كان معك أطفال صغار أو من يرهب المرتفعات.
    اسأل في القرية عن بداية الدرب. ولا تتسلّق الأسوار، فجزء من المجمّع قد انهار فعلاً. خصّص ساعة ونصفاً
    للصعود والأطلال، وأضف كنيسة باراكوني على بعد كيلومترين.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً حتى مخرج ترجولا، ثم Sh19 عبر ترجولا إلى تكيبولي، ثم Sh17 عبر ممر
    ناكيرالا نزولاً إلى أمبرولاوري. وهناك انعطف شرقاً إلى Sh16 باتجاه أوني؛ تبعد تسيسي نحو عشر دقائق.
    تبلغ الرحلة كلها نحو 274 كم وأربع ساعات وعشرين دقيقة. الطرق الرئيسية مُعبّدة. قد يكون الطريق الأخير
    إلى القرية غير معبّد، ويصير موحلاً بعد المطر، ولذلك نوصي بسيارة رياضية متعددة الاستخدامات، وإن كان
    أصعب جزء يُقطع مشياً على أي حال. الوقود والنقود والطعام في أمبرولاوري. اكتب في جهاز الملاحة Mindatsikhe
    (მინდაციხე).
