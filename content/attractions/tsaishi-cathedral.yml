ka:
  name: ცაიშის ღვთისმშობლის მიძინების ტაძარი
  short: >-
    საქართველოს ერთ-ერთი უძველესი საეპისკოპოსო ზუგდიდის სამხრეთ-დასავლეთით: XIII–XIV საუკუნეების გუმბათოვანი
    ტაძარი XVII საუკუნის მხატვრობით.
  body: >-
    **ცაიშის სამრეკლოს კედელში ჩატანებულ საფლავის ქვაზე იგივე ფსალმუნია ამოკვეთილი, რაც გელათში, დავით
    აღმაშენებლის საფლავზე: „ესე არს განსასუენებელი ჩემი... რამეთუ მთნავს“.**


    ვისი საფლავი იყო, არავინ იცის — და ეს ცაიშისთვის ჩვეულებრივია: საქართველოს ერთ-ერთი უძველესი საეპისკოპოსოს
    ისტორია ნამსხვრევებად შემოგვრჩა. 602–610 წლებში შედგენილ საეპისკოპოსო კათედრების ნუსხაში ლაზიკის ეპარქიებს
    შორის უკვე იხსენიება „საისის“ ეპისკოპოსი, X–XI საუკუნეთა მიჯნის საწინამძღვრო ჯვრის წარწერაში კი „ბაგრატ
    აფხაზთა მეფისა და კურაპალატის“ გვერდით ეფრემ ცაიშელია მოხსენიებული. ვახუშტი ბატონიშვილი ტაძარს ასე
    ახასიათებდა: „დიდი, გუმბათიანი, კეთილშენი და შემკული“.


    დღევანდელი გუმბათოვანი ტაძარი XIII–XIV საუკუნეთა მიჯნაზე, ადრინდელი დარბაზული ეკლესიის ადგილას აშენდა.
    1614 წლის დიდი მიწისძვრის შემდეგ, ეპისკოპოს მალაქიას წარწერის თქმით, ყველაფერი „სრულიად დაიქცა გალავანითა
    და შინაგან გარ-შენობითა და სამრეკლოთა“. მალაქიამ ტაძარი აღადგინა და მოახატვინა; ცილინდრული გუმბათი
    და შიდა მხატვრობის დიდი ნაწილი ამ აღორძინებას ეკუთვნის. ეპისკოპოს გრიგოლ ჩიქოვანს (1777–1823) სამრეკლოს
    აგება და გალავნის შემოვლება მიეწერება; მისი სიკვდილის შემდეგ საეპისკოპოსო გაუქმდა. სამხრეთ გალავანში
    ჩაშენებული ორსართულიანი სამრეკლო კი უთარიღოა, რამდენიმე სამშენებლო ფენით და ძველი ტაძრის ნატეხებით.


    შიგნით საკურთხევლის კონქს ახედეთ: ფეხზე მდგომი ღვთისმშობელი ყრმით, მთავარანგელოზებს შორის. სამხრეთ
    ნავში, ბოძის ქვედა რეგისტრზე, ორი ქტიტორია წაშლილი წარწერებით: გვირგვინოსანი ქალი ორი გრძელი ნაწნავით
    და მამაკაცი მაღალი აღმოსავლური ქუდით. მკვლევრები ვარაუდობენ, რომ აქ ლევან II დადიანი და დედოფალი ნესტან-დარეჯანია
    გამოსახული. XIV საუკუნეში ცაიში დადიანთა საძვალე იყო; ტაძარში დღესაც ექვსი საფლავია შემორჩენილი.


    გალავნის დასავლეთით, მის გარეთ, კომპლექსის უძველესი ნაგებობა, ე. წ. „პალატი“ დგას თაღოვანი ბოძებით.
    საბჭოთა წლებში შეწყვეტილი ღვთისმსახურება 1989 წელს აღდგა.


    წასვლამდე ეზოში უზარმაზარ ცაცხვს მიადექით, რომელსაც დაახლოებით ექვსასი წლისად მიიჩნევენ: მიწისძვრასაც
    გადაურჩა, საეპისკოპოსოს გაუქმებასაც და საბჭოთა დაკეტვასაც, და ცაიშში ჩრდილი ისევ მას აქვს საუკეთესო.
  tip: >-
    ნახევარი საათი საკმარისია და ცაიში ზუგდიდის დღეს ადვილად ერწყმის. ტაძარი მოქმედია: მხრები და მუხლები
    დაფარული უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ, წირვის დროს კი სიჩუმე დაიცავით. თუ კარი ჩაკეტილია,
    ეზოში იკითხეთ; შიგნით გადაღებამდე ნებართვა ითხოვეთ. საკურთხევლის მხატვრობისთვის ბინოკლი გამოგადგებათ.
    ჭიშკართან პარკირება უფასოა, მაგრამ ზაფხულში ჩრდილი თითქმის არ არის. კაფე აქ არ არის, უახლოესი ზუგდიდშია.
    თუ დრო გაქვთ, ცაიში თავად ბალნეოლოგიური კურორტიცაა, მინერალური წყლებით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ ისევ ს1-ით, სენაკის გავლით,
    ზუგდიდის მიმართულებით. ზუგდიდამდე ცოტა ადრე სამხრეთ-დასავლეთით, ცაიშისკენ გადაუხვიეთ — სოფელი მდინარე
    ჯუმის ნაპირას, ქალაქიდან ათიოდე კილომეტრზეა. სულ დაახლოებით 320 კილომეტრი და ოთხი საათი და ორმოცდახუთი
    წუთია. გზა ბოლომდე ასფალტია; ბოლო მონაკვეთი ვიწრო, ორმოიანი სოფლის გზაა, მაგრამ დაბალი მანქანაც უპრობლემოდ
    გაივლის. ნიშნები ცოტაა, ამიტომ ნავიგატორში თავად ტაძარი მონიშნეთ. საწვავი სენაკში ან ზუგდიდში ჩაასხით.
    ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში საკმარისია.
en:
  name: Tsaishi Cathedral
  short: >-
    One of Georgia's oldest bishoprics, south-west of Zugdidi: a domed church of around 1300, rebuilt
    after the 1614 earthquake, with 17th-century murals.
  body: >-
    **Set into Tsaishi's bell tower is a tombstone carved with the same psalm as David the Builder's grave
    at Gelati: "This is my rest for ever... for I have desired it."**


    Nobody knows whose grave it was. That is typical of Tsaishi, one of Georgia's oldest bishoprics, whose
    history survives in fragments. A list of sees compiled between 602 and 610 already names a bishop
    of "Saisi" in Lazica; a processional cross from around 1000 names Bishop Ephrem of Tsaishi beside
    "Bagrat, king of the Abkhazians". Prince Vakhushti called the church "great, domed, well built and
    adorned".


    The domed church you see went up around 1300 on the site of an earlier hall church. The great earthquake
    of 1614 left it, in Bishop Malakia's words, "wholly ruined, with its enclosure, the buildings within
    and the bell towers". Malakia rebuilt and repainted it; the plain cylindrical drum and most murals
    date from then. Bishop Grigol Chikovani (1777–1823) is recorded as building a bell tower and the enclosure;
    after his death the see was abolished. The two-storey tower in the southern wall, undated and rebuilt
    in several phases, reuses fragments of the older church.


    Inside, look up at the apse: a standing Virgin holds the Child between the archangels. On a south-aisle
    pier two donors survive, their inscriptions erased: a crowned woman with two long braids, and a man
    in a tall eastern hat. Scholars suggest Levan II Dadiani and Queen Nestan-Darejan. In the 14th century
    this was a Dadiani burial church, and six graves remain inside.


    Just outside the west wall stands the oldest building, the arched palati. Services, stopped under
    Soviet rule, resumed in 1989.


    Before you leave, find the huge linden in the yard, reckoned to be some six hundred years old. It
    has outlived the earthquake, the abolition and the Soviet closure, and it still gives the best shade
    in Tsaishi.
  tip: >-
    Half an hour is enough, and Tsaishi fits easily into a Zugdidi day. This is a working cathedral: shoulders
    and knees covered, a headscarf for women, and quiet during services. If the door is locked, ask in
    the yard, and ask before photographing inside. Binoculars help with the apse painting. Parking by
    the gate is free but shadeless in summer. There is no café; the nearest are in Zugdidi. With time
    to spare, note that Tsaishi is also a small spa village with mineral springs.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then stay on the S1 through Senaki
    towards Zugdidi. Shortly before Zugdidi turn south-west for Tsaishi, which lies on the Jumi river
    about ten kilometres from the town: roughly 320 km and four hours forty-five in all. The road is asphalt
    throughout; the final stretch is a narrow, potholed village road, perfectly passable in a low car.
    Signs are few, so set the navigator to the cathedral itself. Fuel in Senaki or Zugdidi. An economy
    car is fine all year.
ru:
  name: Цаишский собор
  short: >-
    Одна из древнейших епархий Грузии, юго-западнее Зугдиди: купольный храм около 1300 года, отстроенный
    после землетрясения 1614-го, с росписями XVII века.
  body: >-
    **В колокольню Цаиши вмурована надгробная плита с тем же псалмом, что и на могиле Давида Строителя
    в Гелати: «Это покой Мой навеки… ибо Я возжелал его».**


    Чья это была могила, никто не знает. Для Цаиши это обычное дело: история одной из древнейших епископских
    кафедр Грузии дошла до нас обрывками. Уже в перечне епархий, составленном между 602 и 610 годами,
    среди кафедр Лазики упомянут епископ «Саиси»; на выносном кресте около 1000 года епископ Ефрем Цаишский
    назван рядом с «Багратом, царём абхазов». Царевич Вахушти писал о храме: «великий, купольный, хорошо
    построенный и украшенный».


    Нынешний купольный храм возвели около 1300 года на месте более ранней зальной церкви. Великое землетрясение
    1614 года оставило его, по словам епископа Малакии, «совершенно разрушенным вместе с оградой, строениями
    внутри неё и колокольнями». Малакия восстановил и заново расписал собор; гладкий цилиндрический барабан
    и бо́льшая часть росписей относятся к этому времени. Епископу Григолу Чиковани (1777–1823) приписывают
    постройку колокольни и ограды; после его смерти кафедру упразднили. Двухэтажная колокольня в южной
    стене ограды не датирована, перестраивалась в несколько этапов и включает фрагменты старого храма.


    Внутри поднимите глаза к апсиде: стоящая Богоматерь держит Младенца, по сторонам — архангелы. На столбе
    южного нефа сохранились два ктитора с затёртыми надписями: женщина в короне с двумя длинными косами
    и мужчина в высокой восточной шапке. Исследователи полагают, что это Леван II Дадиани и царица Нестан-Дареджан.
    В XIV веке собор служил усыпальницей Дадиани, и внутри до сих пор шесть захоронений.


    Сразу за западной стеной ограды стоит самая древняя постройка комплекса — арочный палати. Богослужения,
    прерванные при советской власти, возобновились в 1989 году.


    Перед уходом отыщите во дворе огромную липу, которой, по оценкам, около шестисот лет. Она пережила
    и землетрясение, и упразднение кафедры, и советское закрытие — и по-прежнему даёт лучшую тень в Цаиши.
  tip: >-
    Хватит получаса, и Цаиши легко вписывается в день в Зугдиди. Это действующий собор: плечи и колени
    должны быть закрыты, женщинам нужен платок, а во время службы — тишина. Если дверь заперта, спросите
    во дворе; прежде чем фотографировать внутри, тоже спросите разрешения. Бинокль поможет разглядеть
    роспись апсиды. Парковка у ворот бесплатная, но летом без тени. Кафе здесь нет, ближайшие — в Зугдиди.
    Если остаётся время, имейте в виду: Цаиши ещё и маленький курортный посёлок с минеральными источниками.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) мимо Кутаиси до Самтредиа, затем по той же S1 через Сенаки
    в сторону Зугдиди. Незадолго до Зугдиди сверните на юго-запад к Цаиши: село стоит на реке Джуми примерно
    в десяти километрах от города. Всего около 320 км и четыре часа сорок пять минут. Асфальт на всём
    пути; последний отрезок — узкая сельская дорога с выбоинами, вполне проходимая и для низкой машины.
    Указателей мало, поэтому задайте в навигаторе сам собор. Заправка — в Сенаки или Зугдиди. Машины эконом-класса
    хватит в любое время года.
fa:
  name: کلیسای جامع تسایشی
  short: >-
    یکی از کهن‌ترین اسقف‌نشین‌های گرجستان در جنوب غربی زوگدیدی: کلیسایی گنبددار از حدود ۱۳۰۰ که پس از
    زلزلهٔ ۱۶۱۴ از نو ساخته شد، با نقاشی‌های دیواری سدهٔ هفدهم.
  body: >-
    **در برج ناقوس تسایشی سنگ گوری کار گذاشته‌اند که بر آن همان آیه‌ای از مزامیر کنده شده که بر آرامگاه
    داوود سازنده در گلاتی آمده است: «این است آرامگاه من تا ابدالآباد... زیرا که در این رغبت دارم.»**


    کسی نمی‌داند این گور از آنِ که بوده است. و این برای تسایشی عجیب نیست؛ تاریخ یکی از کهن‌ترین اسقف‌نشین‌های
    گرجستان تکه‌تکه به ما رسیده است. در فهرست اسقف‌نشین‌هایی که میان ۶۰۲ و ۶۱۰ گردآوری شد، از اسقف «سایسی»
    در لازیکا نام رفته است؛ و بر صلیبی آیینی از حدود سال ۱۰۰۰، نام اسقف افرم تسایشی در کنار «باگرات، پادشاه
    آبخازان» آمده است. شاهزاده واخوشتی کلیسا را «بزرگ، گنبددار، خوش‌ساخت و آراسته» خوانده است.


    کلیسای گنبددار کنونی حدود ۱۳۰۰ بر جای کلیسای تالاری کهن‌تری برپا شد. زلزلهٔ بزرگ ۱۶۱۴ آن را، به گفتهٔ
    اسقف مالاکیا، «یکسره ویران، با حصار و بناهای درون آن و برج‌های ناقوس» بر جای گذاشت. مالاکیا کلیسا
    را از نو ساخت و دوباره نقاشی کرد؛ ساقهٔ استوانه‌ای و سادهٔ گنبد و بیشتر نقاشی‌های دیواری از همان دوره
    است. ساختن یک برج ناقوس و حصار را به اسقف گریگول چیکووانی (۱۷۷۷–۱۸۲۳) نسبت می‌دهند؛ پس از مرگ او اسقف‌نشین
    برچیده شد. برج ناقوس دوطبقه در دیوار جنوبی حصار تاریخ مشخصی ندارد، در چند مرحله ساخته و بازسازی شده
    و پاره‌هایی از کلیسای قدیمی در آن به کار رفته است.


    درون کلیسا به محراب نگاه کنید: مریم عذرا ایستاده و کودک را در آغوش دارد، میان فرشتگان مقرب. بر ستونی
    در راهروی جنوبی دو بانی با کتیبه‌های پاک‌شده بر جای مانده‌اند: زنی تاج‌بر سر با دو گیسوی بلند بافته،
    و مردی با کلاهی بلند به شیوهٔ شرقی. پژوهشگران گمان می‌برند که اینان لوان دوم دادیانی و ملکه نستان‌دارجان‌اند.
    در سدهٔ چهاردهم اینجا آرامگاه خاندان دادیانی بود و شش گور هنوز درون کلیسا باقی است.


    درست بیرون دیوار غربی، کهن‌ترین بنای مجموعه ایستاده است: «پالاتی» با طاق‌هایش. آیین‌های کلیسایی که
    در دوران شوروی متوقف شده بود، در ۱۹۸۹ از سر گرفته شد.


    پیش از رفتن، زیزفون عظیم حیاط را پیدا کنید که عمرش را حدود ششصد سال می‌دانند. این درخت از زلزله، برچیده
    شدن اسقف‌نشین و بسته شدن کلیسا در دوران شوروی جان به در برده و هنوز بهترین سایهٔ تسایشی را دارد.
  tip: >-
    نیم ساعت بس است و تسایشی به‌آسانی در برنامهٔ یک روز در زوگدیدی جا می‌گیرد. این کلیسای جامع فعال است:
    شانه‌ها و زانوها پوشیده، روسری برای بانوان و سکوت در هنگام نیایش. اگر در بسته بود، در حیاط بپرسید،
    و پیش از عکاسی از درون کلیسا اجازه بگیرید. دوربین دوچشمی برای دیدن نقاشی محراب به کار می‌آید. پارکینگ
    کنار دروازه رایگان است، اما در تابستان بی‌سایه. کافه‌ای نیست؛ نزدیک‌ترین‌ها در زوگدیدی‌اند. اگر وقت
    دارید، بدانید که تسایشی روستای آب‌درمانی کوچکی با چشمه‌های آب معدنی هم هست.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید و از کنار کوتائیسی تا سامتردیا بروید، سپس روی همان
    S1 از سناکی به سوی زوگدیدی ادامه دهید. کمی پیش از زوگدیدی به سمت جنوب غرب به طرف تسایشی بپیچید که
    کنار رود جومی و حدود ده کیلومتری شهر است: روی‌هم نزدیک ۳۲۰ کیلومتر و چهار ساعت و چهل‌وپنج دقیقه. همهٔ
    راه آسفالت است؛ پارهٔ پایانی جاده‌ای روستایی، باریک و پر از چاله است، اما با خودروی کف‌کوتاه هم به‌خوبی
    پیمودنی است. تابلو کم است، پس خود کلیسا را در مسیریاب وارد کنید. سوخت در سناکی یا زوگدیدی. خودروی
    اقتصادی در همهٔ فصل‌ها کافی است.
he:
  name: קתדרלת צאישי
  short: >-
    מושב בישוף מן העתיקים בגאורגיה, מדרום-מערב לזוגדידי: כנסיית כיפה מסביבות 1300, שנבנתה מחדש אחרי רעידת
    האדמה של 1614, ובה ציורי קיר מן המאה ה-17.
  body: >-
    **במגדל הפעמונים של צאישי משוקעת מצבה שחקוק עליה אותו פסוק מתהילים שעל קברו של דוד הבונה בגלאטי: "זאת
    מנוחתי עדי עד... כי אויתיה".**


    איש אינו יודע של מי היה הקבר. זה אופייני לצאישי, אחד ממושבי הבישוף העתיקים בגאורגיה, שתולדותיו שרדו
    רק בשברים. כבר ברשימת מושבי הבישופים שנערכה בין 602 ל-610 נזכר בישוף "סאיסי" שבלאזיקה; ועל צלב תהלוכות
    מסביבות שנת 1000 מופיע שמו של הבישוף אפרם מצאישי לצד "בגרט, מלך האבחזים". הנסיך וחושטי תיאר את הכנסייה
    כ"גדולה, בעלת כיפה, בנויה היטב ומקושטת".


    כנסיית הכיפה שלפניכם נבנתה בסביבות 1300 במקומה של כנסיית אולם קדומה יותר. רעידת האדמה הגדולה של 1614
    הותירה אותה, כלשונו של הבישוף מלאכיה, "הרוסה כליל, עם חומתה, הבניינים שבתוכה ומגדלי הפעמונים". מלאכיה
    שיקם את הכנסייה וצייר אותה מחדש; תוף הכיפה הגלילי והפשוט ורוב ציורי הקיר הם מאותה תקופה. לבישוף גריגול
    צ׳יקובאני (1777–1823) מיוחסות בניית מגדל פעמונים והקמת החומה; אחרי מותו בוטלה הבישופות. מגדל הפעמונים
    הדו-קומתי שבחומה הדרומית אינו מתוארך, נבנה בכמה שלבים ומשולבים בו שברים מן הכנסייה הישנה.


    בפנים הרימו את העיניים אל האפסיס: מרים הבתולה עומדת ובזרועותיה הילד, בין המלאכים הראשיים. על אחד העמודים
    בספינה הדרומית שרדו שני תורמים, וכתובותיהם נמחקו: אישה עטורת כתר ולה שתי צמות ארוכות, וגבר בכובע מזרחי
    גבוה. חוקרים משערים שאלה לוואן השני דדיאני והמלכה נסטן-דרג׳אן. במאה ה-14 שימשה הכנסייה מקום קבורה
    לבית דדיאני, ושישה קברים נותרו בה עד היום.


    ממש מחוץ לחומה המערבית עומד המבנה העתיק ביותר, ה"פאלאטי" המקומר. התפילות, שנפסקו תחת השלטון הסובייטי,
    התחדשו ב-1989.


    לפני שאתם עוזבים, חפשו בחצר את עץ התרזה הענק, שגילו מוערך בשש מאות שנה בקירוב. הוא שרד את רעידת האדמה,
    את ביטול הבישופות ואת הסגירה הסובייטית, ועדיין מעניק את הצל הטוב ביותר בצאישי.
  tip: >-
    חצי שעה מספיקה, וצאישי משתלבת בקלות ביום בזוגדידי. זו קתדרלה פעילה: כתפיים וברכיים מכוסות, כיסוי ראש
    לנשים ושקט בזמן התפילות. אם הדלת נעולה, שאלו בחצר, ובקשו רשות לפני שאתם מצלמים בפנים. משקפת תעזור
    לראות את הציור שבאפסיס. החניה ליד השער חינמית, אך בקיץ אין בה צל. אין כאן בית קפה; הקרובים ביותר בזוגדידי.
    אם נשאר זמן, דעו שצאישי היא גם כפר מרפא קטן עם מעיינות מינרליים.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, והמשיכו ב-S1 דרך סנאקי לכיוון זוגדידי.
    מעט לפני זוגדידי פנו דרום-מערבה אל צאישי, השוכנת על נהר ג׳ומי כעשרה קילומטרים מן העיר: בסך הכול כ-320
    ק״מ וארבע שעות וארבעים וחמש דקות. הדרך סלולה לכל אורכה; הקטע האחרון הוא כביש כפרי צר ומחורר, אך עביר
    לגמרי גם ברכב נמוך. השילוט דל, לכן הזינו בניווט את הקתדרלה עצמה. תדלוק בסנאקי או בזוגדידי. רכב אקונומי
    מתאים בכל עונות השנה.
ar:
  name: كاتدرائية تسايشي
  short: >-
    من أقدم الأسقفيات في جورجيا، جنوب غربي زوغديدي: كنيسة ذات قبة من نحو عام 1300، أُعيد بناؤها بعد زلزال
    1614، وفيها جداريات من القرن السابع عشر.
  body: >-
    **في برج أجراس تسايشي شاهدة قبر مُدمجة في الجدار، نُقش عليها المزمور نفسه الذي على قبر داود البنّاء
    في جيلاتي: «هذه هي راحتي إلى الأبد... لأني اشتهيتها».**


    لا أحد يعرف لمن كان القبر. وهذا شأن تسايشي، إحدى أقدم الأسقفيات في جورجيا، التي لم يصلنا من تاريخها
    إلا شذرات. ففي قائمة بالأسقفيات وُضعت بين 602 و610 يرد ذكر أسقف «سايسي» في لازيكا؛ وعلى صليب للمواكب
    من نحو عام 1000 يظهر اسم الأسقف أفرام التسايشي إلى جانب «باغرات، ملك الأبخاز». ووصف الأمير فاخوشتي
    الكنيسة بأنها «عظيمة، ذات قبة، حسنة البناء ومزيّنة».


    شُيّدت الكنيسة ذات القبة القائمة اليوم نحو عام 1300 في موضع كنيسة أقدم ذات قاعة واحدة. وتركها الزلزال
    الكبير عام 1614، بعبارة الأسقف مالاكيا، «خراباً تاماً، بسورها والمباني التي في داخله وأبراج الأجراس».
    فأعاد مالاكيا بناءها وتزيينها بالرسوم من جديد؛ ومن ذلك العهد رقبة القبة الأسطوانية البسيطة ومعظم الجداريات.
    ويُنسب إلى الأسقف غريغول تشيكواني (1777–1823) بناء برج للأجراس وإقامة السور؛ وبعد وفاته أُلغيت الأسقفية.
    أما برج الأجراس ذو الطابقين المدمج في السور الجنوبي فتاريخه غير معروف، وقد بُني على مراحل عدة، وفيه
    قطع من الكنيسة الأقدم.


    في الداخل ارفع بصرك إلى الحنية: العذراء واقفة تحمل الطفل بين رؤساء الملائكة. وعلى دعامة في الجناح
    الجنوبي بقيت صورتا واهبَين مُحيت نقوشهما: امرأة متوّجة بضفيرتين طويلتين، ورجل يعتمر قبعة شرقية عالية.
    ويرجّح الباحثون أنهما ليفان الثاني دادياني والملكة نستان-داريجان. وفي القرن الرابع عشر كانت هذه الكنيسة
    مدفناً لآل دادياني، ولا تزال فيها ستة قبور.


    وخارج السور الغربي مباشرة يقوم أقدم مباني المجمّع، «البالاتي» ذو العقود. أما الصلوات التي توقفت في
    العهد السوفيتي فاستؤنفت عام 1989.


    وقبل أن تغادر ابحث في الفناء عن شجرة الزيزفون الضخمة التي يُقدَّر عمرها بنحو ستمئة عام. لقد صمدت أمام
    الزلزال وإلغاء الأسقفية والإغلاق السوفيتي، وما زالت تمنح أفضل ظلّ في تسايشي.
  tip: >-
    تكفي نصف ساعة، وتندرج تسايشي بسهولة في يوم تقضيه في زوغديدي. إنها كاتدرائية تُقام فيها الصلوات: الأكتاف
    والركب مستورة، وغطاء رأس للنساء، والهدوء أثناء الصلوات. إن وجدت الباب مقفلاً فاسأل في الفناء، واستأذن
    قبل التصوير في الداخل. يساعدك المنظار على رؤية رسم الحنية. الموقف عند البوابة مجاني لكنه بلا ظل في
    الصيف. لا مقهى هنا؛ أقرب المقاهي في زوغديدي. وإن كان لديك متّسع من الوقت، فاعلم أن تسايشي أيضاً قرية
    استشفاء صغيرة فيها ينابيع معدنية.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى سامتريديا، ثم تابع على S1 عبر سيناكي باتجاه
    زوغديدي. وقبيل زوغديدي انعطف نحو الجنوب الغربي إلى تسايشي، الواقعة على نهر جومي على بعد نحو عشرة كيلومترات
    من المدينة: قرابة 320 كم وأربع ساعات وخمس وأربعون دقيقة إجمالاً. الطريق معبّد كله؛ والمقطع الأخير
    طريق قروي ضيق كثير الحفر، لكنه صالح تماماً حتى لسيارة منخفضة. اللافتات قليلة، فأدخل الكاتدرائية نفسها
    في جهاز الملاحة. الوقود في سيناكي أو زوغديدي. تكفي سيارة اقتصادية في كل الفصول.
