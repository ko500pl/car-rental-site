ka:
  name: ცაიშის ღვთისმშობლის მიძინების ტაძარი
  short: >-
    შუასაუკუნეების საეპისკოპოსო კათედრა ზუგდიდის სამხრეთ-დასავლეთით, მაღალი სამრეკლოთი და თითქმის ხელახლა
    აშენებული, მძიმედ აღდგენილი ეკლესიით.
  body: >-
    **ცაიში სამეგრელოს ერთ-ერთი მთავარი საეპისკოპოსო კათედრა იყო** — და დღეს ერთ-ერთი ყველაზე საკამათო
    აღდგენილი ძეგლიცაა. სოფელი ზუგდიდიდან თორმეტიოდე კილომეტრში, სამხრეთ-დასავლეთით, ბრტყელ სასოფლო-სამეურნეო
    ველზეა.


    ცაიშის საეპისკოპოსო კათედრა XIII საუკუნის ბოლოს ჩამოყალიბდა, როცა ოდიშის ეკლესიური მოწყობა გადაისინჯა.
    ეპისკოპოსი — ცაიშელი — სამეგრელოს ერთ-ერთი ყველაზე გავლენიანი იერარქი იყო და დადიანების კარს უახლოვდებოდა.


    თავად ნაგებობას რთული ისტორია აქვს. ქვედა ფენებში X-XI საუკუნეების ბაზილიკის კვალია; დღევანდელი ჯვარგუმბათოვანი
    მოცულობა ძირითადად XIV საუკუნეს განეკუთვნება, როცა ტაძარი დადიანების დროს გადააკეთეს. შემდეგ საუკუნეებში
    ის არაერთხელ დაზიანდა და შეაკეთეს.


    ბოლო ათწლეულების აღდგენამ ძეგლი მკვეთრად შეცვალა: ახალი ქვა, ახალი სახურავი, აღდგენილი გუმბათის ყელი.
    შორიდან ეკლესია დღეს თითქმის ახალ ნაგებობას ჰგავს და ეს ბევრ ხელოვნებათმცოდნეს არ მოსწონს. ნამდვილი
    შუასაუკუნეების ქსოვილი ქვედა წყობებში, ხელახლა გამოყენებულ კვეთილ ბლოკებში და კედლის მხატვრობის ფრაგმენტებში
    უნდა ეძებო: შემორჩენილია როგორც XIV, ისე XVI-XVII საუკუნეების ფენები, თუმცა ორივე მცირე ნაწილად.


    ყველაზე ავთენტური აქ სამრეკლოა — XVI-XVII საუკუნეების მაღალი, სამსართულიანი კოშკი ღია ზარის სართულით.
    მისი პროპორციები და აგურის წყობა ის დეტალია, რომლისთვისაც ღირს გაჩერება.


    თავად აღდგენა ცალკე დოკუმენტია. ის იმ წლებში ჩატარდა, როცა საქართველოში ბევრს და სწრაფად აღადგენდნენ
    — უფრო ენთუზიაზმით, ვიდრე არქეოლოგიით. კარგად ჩანს, სად ხვდება ახალი თლილი ქვა ძველ რიყის წყობას და
    სად შეცვალა სწორმა ახალმა თაღმა ჩამოღუნული შუასაუკუნეებისა. გადარჩენაა ეს თუ დანაკარგი — სწორედ ეს
    არის კამათის საგანი.


    ეპარქია დღესაც არსებობს: 1995 წელს ის ზუგდიდისა და ცაიშის ეპარქიად აღდგა, ისე რომ ცაიშის სახელი კვლავ
    ცოცხალ ტიტულში დარჩა. ეზოში XIX საუკუნის საფლავებია ადგილობრივი გვარებით და რამდენიმე ძველი, ხელახლა
    გამოყენებული კვეთილი ქვა კედლებში ჩაშენებული.


    ეზო ვრცელი და მშვიდია, გარშემო სიმინდისა და თხილის ნაკვეთები. აქ თითქმის არავინ ჩერდება, ავტობუსები
    არ დადის, ბილეთი არ იყიდება. ნახევარი საათი სავსებით საკმარისია.


    მოკლედ: თუ ხელუხლებელ შუასაუკუნეების არქიტექტურას ეძებ, ჯობია დრო წალენჯიხასა და ხობს დაუთმო. თუ გინდა
    დაინახო, როგორ ცხოვრობს ქართული ძეგლი XXI საუკუნეში — ცაიში სწორედ ის ადგილია, სადაც ეს კითხვა ყველაზე
    მკაფიოდ დგას.
  tip: >-
    ნახევარი საათი კმარა და ის ზუგდიდის მარშრუტში ბუნებრივად ჯდება. ეკლესია მოქმედია; ჩაცმის წესები მოქმედებს,
    თავსაფრები კართან დევს. კარი ყოველთვის ღია არ არის — თუ ჩაკეტილია, ეზოში ან მეზობელ სახლში იკითხე.
    ფოტოსთვის ნებართვა ჰკითხე, შიგნით ხშირად არ შეიძლება. პარკირება ეზოსთან უფასოა, ჩრდილი კი ცოტაა —
    ზაფხულში მანქანა გაცხელდება. ტუალეტი და კაფე აქ არ არის, უახლოესი ზუგდიდშია. ზამთარში ეზო ტალახიანია,
    ამიტომ მაგარი ფეხსაცმელი გამოგადგება.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით; ზუგდიდამდე რამდენიმე კილომეტრით ადრე აიღე
    ცაიშის შესახვევი სამხრეთ-დასავლეთით — სულ დაახლოებით 320 კმ და ოთხი საათი ორმოცდახუთი წუთი. გზა ბოლომდე
    ასფალტია, ბოლო მონაკვეთი ვიწრო სასოფლო გზაა, ორმოებით, მაგრამ დაბალი მანქანისთვისაც გასავლელი. ორიენტირად
    სამრეკლო გამოგადგება: ის ველზე შორიდან ჩანს. საწვავი ზუგდიდში ან სენაკში აიღე. ბოლო შესახვევი ნიშნით
    არ არის კარგად აღნიშნული, ამიტომ ნავიგატორი ან სოფელში კითხვა გამოგადგება. ეკონომ-კლასის ავტომობილი
    მთელი წლის განმავლობაში საკმარისია.
en:
  name: Tsaishi Cathedral
  short: >-
    A medieval bishop’s seat south-west of Zugdidi, with a fine bell tower and a church rebuilt almost
    out of recognition.
  body: >-
    **Tsaishi was one of the principal bishoprics of Mingrelia,** and it is now one of the country's more
    argued-over restorations. The village lies about twelve kilometres south-west of Zugdidi on flat farmed
    ground.


    The see of Tsaishi took shape at the end of the thirteenth century, when the church organisation of
    Odishi was revised. The bishop, known as the Tsaisheli, was among the most powerful clerics in Mingrelia
    and stood close to the Dadiani court.


    The building itself has a tangled history. In the lower courses there are traces of a basilica of
    the tenth or eleventh century; the present domed cross-in-square volume is largely fourteenth century,
    from the rebuilding carried out under the Dadiani. It was damaged and patched repeatedly in the centuries
    that followed.


    Restoration in recent decades changed it sharply: new stone, a new roof, a reconstructed drum. From
    a distance the church now reads as a new building, which many art historians dislike. The genuinely
    medieval fabric has to be looked for in the lower walls, in reused carved blocks set into the masonry,
    and in the surviving fragments of painting, which include both fourteenth-century and sixteenth- to
    seventeenth-century layers, neither of them extensive.


    The most authentic thing on the site is the bell tower: a tall three-stage structure of the sixteenth
    or seventeenth century with an open belfry at the top. Its proportions and brickwork are the detail
    that justifies the stop.


    The restoration is itself a document. It was done in years when Georgia was rebuilding many churches
    quickly and with more enthusiasm than archaeology, and you can see where new ashlar meets old cobble,
    and where a straight new arch has replaced a sagging medieval one. Whether that counts as rescue or
    loss is precisely the argument. The diocese, meanwhile, still exists: it was revived in 1995 as the
    eparchy of Zugdidi and Tsaishi, so the name survives in a living title.


    The yard is large and calm, with maize plots and hazelnut orchards around it. Almost nobody stops
    here. There are no coaches, no ticket desk and no signage to speak of. Half an hour covers it.


    Put plainly: if you want untouched medieval architecture, give your time to Tsalenjikha and Khobi
    instead. If you want to see how a Georgian monument lives in the twenty-first century, and what restoration
    can do both for and to a building, Tsaishi is where the question is posed most clearly.
  tip: >-
    Half an hour is enough and it fits neatly into a Zugdidi day. The church is in use, so dress rules
    apply and scarves are left by the door. It is not always open; if the door is locked, ask in the yard
    or at the nearest house. Ask before photographing, and expect a refusal inside. Parking by the gate
    is free but there is little shade, so a car left there in summer will get hot. There are no toilets
    and no café; the nearest are in Zugdidi.
  route: >-
    From Tbilisi take the E60 to Senaki and continue towards Zugdidi; a few kilometres before Zugdidi
    take the signposted turn south-west for Tsaishi — about 320 km in all and four hours forty-five. The
    road is asphalt throughout, with the last stretch a narrow country lane, potholed but perfectly passable
    in a low car. Navigate by the bell tower, which is visible across the fields from some distance. Refuel
    in Senaki or Zugdidi. An economy car is sufficient in every season, and parking is directly at the
    gate.
ru:
  name: Цаишский собор
  short: >-
    Средневековая епископская кафедра к юго-западу от Зугдиди, с прекрасной колокольней и почти заново
    отстроенным храмом.
  body: >-
    **Цаиши был одной из главных епископских кафедр Мегрелии,** а сегодня это ещё и одна из самых спорных
    реставраций страны. Село лежит примерно в двенадцати километрах к юго-западу от Зугдиди, на ровной
    возделанной равнине.


    Цаишская кафедра сложилась в конце XIII века, когда пересматривалось церковное устройство Одиши. Епископ,
    которого называли цаишели, был среди самых влиятельных иерархов Мегрелии и держался близко ко двору
    Дадиани.


    У самого здания запутанная история. В нижних рядах кладки видны следы базилики X или XI века; нынешний
    крестово-купольный объём в основном относится к XIV веку, к перестройке при Дадиани. В последующие
    столетия храм не раз повреждали и чинили.


    Реставрация последних десятилетий изменила его резко: новый камень, новая кровля, восстановленный
    барабан. Издали церковь читается как новая постройка, и многим искусствоведам это не нравится. Подлинно
    средневековую ткань приходится искать в нижних рядах, в повторно использованных резных блоках и в
    уцелевших фрагментах живописи — есть слои и XIV, и XVI–XVII веков, но оба невелики.


    Самое подлинное здесь — колокольня: высокое трёхъярусное сооружение XVI–XVII веков с открытым звоном
    наверху. Её пропорции и кирпичная кладка и есть та деталь, ради которой стоит остановиться.


    Сама реставрация — тоже документ. Её делали в годы, когда в Грузии восстанавливали много и быстро,
    с большим энтузиазмом, чем археологией, и хорошо видно, где новый тёсаный камень встречается со старой
    галечной кладкой и где ровная новая арка заменила просевшую средневековую. Спасение это или потеря
    — ровно об этом и спорят. Епархия при этом существует до сих пор: в 1995 году её возобновили как Зугдидскую
    и Цаишскую, так что имя сохранилось в живом титуле.


    Двор большой и спокойный, вокруг кукурузные участки и ореховые сады. Здесь почти никто не тормозит:
    ни автобусов, ни кассы, ни указателей. Полчаса покрывают всё.


    Если коротко: за нетронутой средневековой архитектурой лучше ехать в Цаленджиху и Хоби. А если хочется
    увидеть, как грузинский памятник живёт в XXI веке и что реставрация способна сделать для здания и
    с ним, — именно в Цаиши этот вопрос поставлен яснее всего.
  tip: >-
    Получаса достаточно, и он хорошо укладывается в зугдидский день. Храм действующий: правила одежды
    соблюдаются, платки лежат у входа. Открыт не всегда; если дверь заперта, спросите во дворе или в ближайшем
    доме. Перед съёмкой спросите разрешение, внутри чаще всего откажут. Парковка у ворот бесплатная, но
    тени мало, и летом машина сильно нагреется. Ни туалета, ни кафе здесь нет — ближайшие в Зугдиди.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше в сторону Зугдиди; за несколько километров до города возьмите
    указатель на Цаиши на юго-запад — всего около 320 км и четыре часа сорок пять минут. Дорога асфальтированная,
    последний участок — узкий просёлок с ямами, но низкая машина проходит его спокойно. Ориентируйтесь
    на колокольню: её видно через поля издалека. Заправляйтесь в Сенаки или Зугдиди. Машины эконом-класса
    достаточно в любой сезон, парковка прямо у ворот.
fa:
  name: کلیسای جامع تسایشی
  short: کرسی اسقفی سده‌های میانه در جنوب غربی زوگدیدی، با برج ناقوسی زیبا و کلیسایی که تقریباً از نو
    ساخته شده است.
  body: >-
    **تسایشی یکی از کرسی‌های اسقفی اصلی مینگرلیا بود** و امروز یکی از پرمناقشه‌ترین مرمت‌های کشور هم هست.
    روستا حدود دوازده کیلومتری جنوب غربی زوگدیدی، بر زمینی هموار و کشت‌شده قرار دارد.


    کرسی تسایشی در پایان سدهٔ سیزدهم شکل گرفت، هنگامی که سازمان کلیسایی اودیشی بازنگری شد. اسقف، که او
    را تسایشلی می‌خواندند، از پرنفوذترین روحانیان مینگرلیا بود و به دربار داديانی نزدیک می‌ایستاد.


    خود بنا تاریخی درهم دارد. در ردیف‌های پایینی نشانه‌هایی از بازیلیکایی از سدهٔ دهم یا یازدهم هست؛ حجم
    کنونی چلیپایی گنبددار بیشتر به سدهٔ چهاردهم بازمی‌گردد، به بازسازی روزگار داديانی. در سده‌های پس از
    آن بارها آسیب دید و وصله شد.


    مرمت دهه‌های اخیر آن را به‌سختی دگرگون کرد: سنگ نو، بام نو و ساقهٔ گنبد بازسازی‌شده. از دور کلیسا
    امروز مانند بنایی نوساز خوانده می‌شود و بسیاری از هنرشناسان این را نمی‌پسندند. بافت راستین سده‌های
    میانه را باید در ردیف‌های پایینی، در بلوک‌های کنده‌کاری‌شدهٔ بازاستفاده و در پاره‌های بازماندهٔ نقاشی
    جست؛ لایه‌هایی از سدهٔ چهاردهم و نیز سده‌های شانزدهم و هفدهم مانده، اما هیچ‌کدام گسترده نیست.


    اصیل‌ترین چیز در این محوطه برج ناقوس است: بنایی بلند و سه‌طبقه از سدهٔ شانزدهم یا هفدهم با ناقوس‌خانهٔ
    باز در بالا. تناسب‌ها و آجرچینی‌اش همان جزئی است که توقف را توجیه می‌کند.


    خود مرمت هم سندی است. در سال‌هایی انجام شد که گرجستان بسیار و شتابان کلیسا بازسازی می‌کرد، با شوقی
    بیش از باستان‌شناسی، و به‌روشنی می‌بینید سنگ تراش‌خوردهٔ نو کجا به قلوه‌سنگ کهنه می‌رسد و کجا طاق
    راست تازه جای طاق فرورفتهٔ سده‌های میانه را گرفته است. اینکه این نجات است یا زیان، دقیقاً موضوع همان
    مناقشه است. اسقف‌نشین هنوز برجاست: در ۱۹۹۵ به نام اسقف‌نشین زوگدیدی و تسایشی احیا شد، پس این نام در
    عنوانی زنده مانده است.


    حیاط بزرگ و آرام است و گرداگردش کرت‌های ذرت و باغ‌های فندق. تقریباً کسی اینجا نمی‌ایستد: نه اتوبوسی،
    نه گیشه‌ای و نه تابلویی درخور. نیم ساعت همه چیز را می‌پوشاند.


    روشن بگوییم: اگر معماری دست‌نخوردهٔ سده‌های میانه می‌خواهید، وقتتان را به تسالنجیخا و خوبی بدهید.
    اما اگر می‌خواهید ببینید یک بنای تاریخی گرجی در سدهٔ بیست‌ویکم چگونه زندگی می‌کند و مرمت چه می‌تواند
    برای بنا و بر سر بنا بیاورد، این پرسش در تسایشی از هرجا روشن‌تر مطرح است.
  tip: >-
    نیم ساعت کافی است و به‌خوبی در برنامهٔ یک روز زوگدیدی جا می‌گیرد. کلیسا فعال است، پس قواعد پوشش برقرار
    است و شال‌ها کنار در گذاشته شده. همیشه باز نیست؛ اگر در بسته بود در حیاط یا نزدیک‌ترین خانه بپرسید.
    پیش از عکاسی اجازه بگیرید و انتظار داشته باشید در داخل پاسخ منفی بشنوید. پارک کنار دروازه رایگان است
    اما سایه کم دارد و خودرو در تابستان داغ می‌شود. سرویس بهداشتی و کافه اینجا نیست؛ نزدیک‌ترینشان در
    زوگدیدی است.
  route: >-
    از تفلیس با E60 تا سناکی و سپس به سوی زوگدیدی؛ چند کیلومتر پیش از شهر، انشعاب تابلودار تسایشی را به
    جنوب غربی بگیرید — رویهم حدود ۳۲۰ کیلومتر و چهار ساعت و چهل و پنج دقیقه. جاده تا انتها آسفالت است
    و بخش پایانی راهی روستایی و باریک و چاله‌دار، اما خودروی کم‌ارتفاع بی‌دردسر از آن می‌گذرد. برج ناقوس
    را نشانه بگیرید که از دوردست میان کشتزارها پیداست. سوخت را در سناکی یا زوگدیدی بگیرید. خودروی اقتصادی
    در هر فصل کافی است و پارک درست کنار دروازه است.
he:
  name: קתדרלת צאישי
  short: מושב בישוף מימי הביניים מדרום-מערב לזוגדידי, עם מגדל פעמונים יפה וכנסייה שנבנתה כמעט מחדש.
  body: >-
    **צאישי הייתה אחת מכהונות הבישוף המרכזיות של מינגרליה,** והיום היא גם אחד השחזורים השנויים ביותר במחלוקת
    בגאורגיה. הכפר שוכן כשנים-עשר קילומטרים מדרום-מערב לזוגדידי, על קרקע חקלאית שטוחה.


    מושב צאישי התגבש בסוף המאה השלוש-עשרה, כאשר נערך מחדש הארגון הכנסייתי של אודישי. הבישוף, שכונה צאישלי,
    היה מן הכמרים רבי ההשפעה במינגרליה ועמד קרוב לחצר דאדיאני.


    למבנה עצמו היסטוריה סבוכה. בשורות התחתונות נראים עקבות של בזיליקה מן המאה העשירית או האחת-עשרה; הנפח
    הנוכחי, כנסייה מכופפת בעלת כיפה, שייך בעיקרו למאה הארבע-עשרה, לבנייה מחדש בימי דאדיאני. במאות שלאחר
    מכן נפגע ותוקן שוב ושוב.


    השחזור בעשורים האחרונים שינה אותו בחדות: אבן חדשה, גג חדש ותוף משוחזר. ממרחק נקראת הכנסייה היום כמבנה
    חדש, ורבים מחוקרי האמנות אינם אוהבים זאת. את הרקמה של ימי הביניים ממש צריך לחפש בשורות התחתונות, באבנים
    מגולפות ששימשו שנית, ובשברי הציור ששרדו — יש שכבות מן המאה הארבע-עשרה וגם מן המאות השש-עשרה והשבע-עשרה,
    אך שתיהן מצומצמות.


    הדבר האותנטי ביותר באתר הוא מגדל הפעמונים: מבנה גבוה בן שלוש קומות מן המאה השש-עשרה או השבע-עשרה,
    ובראשו קומת פעמונים פתוחה. הפרופורציות והלבנים שלו הם הפרט שמצדיק את העצירה.


    השחזור עצמו הוא מסמך. הוא נעשה בשנים שבהן בנתה גאורגיה מחדש כנסיות רבות במהירות ובהתלהבות שעלתה על
    הארכיאולוגיה, ואפשר לראות היכן פוגשת אבן מסותתת חדשה חלוקים ישנים, והיכן החליפה קשת ישרה חדשה קשת
    שקועה מימי הביניים. אם זו הצלה או אובדן — על כך בדיוק הוויכוח. הבישופות, בינתיים, עדיין קיימת: היא
    חודשה ב-1995 כבישופות זוגדידי וצאישי, כך שהשם שרד בתואר חי.


    החצר גדולה ורגועה, וסביבה חלקות תירס ומטעי לוז. כמעט איש אינו עוצר כאן: אין אוטובוסים, אין קופה ואין
    שילוט של ממש. חצי שעה מכסה הכול.


    בפשטות: אם אתם מחפשים אדריכלות של ימי הביניים שלא נגעו בה, הקדישו את זמנכם לצאלנג׳יחה ולחובי. אם אתם
    רוצים לראות כיצד חי אתר גאורגי במאה העשרים ואחת ומה שחזור מסוגל לעשות למבנה וגם בו, בצאישי השאלה מוצגת
    בבהירות רבה מכל מקום אחר.
  tip: >-
    חצי שעה מספיקה, והיא משתלבת בקלות ביום בזוגדידי. הכנסייה פעילה, ולכן חלים כללי לבוש ומטפחות מונחות
    ליד הדלת. היא אינה פתוחה תמיד; אם הדלת נעולה, שאלו בחצר או בבית הסמוך. בקשו רשות לפני צילום, וצפו
    לסירוב בפנים. החניה ליד השער חינם, אך הצל מועט ורכב שיישאר שם בקיץ יתחמם מאוד. אין כאן שירותים ואין
    בית קפה; הקרובים ביותר נמצאים בזוגדידי.
  route: >-
    מטביליסי בכביש E60 עד סנאקי והלאה לכיוון זוגדידי; כמה קילומטרים לפני העיר פנו בשילוט דרומה-מערבה לצאישי
    — כ-320 ק״מ בסך הכול וארבע שעות וארבעים וחמש. הכביש סלול לכל אורכו, והקטע האחרון הוא דרך כפרית צרה
    ומחוררת אך עבירה לחלוטין ברכב נמוך. נווטו לפי מגדל הפעמונים, הנראה מעל השדות ממרחק. תדלקו בסנאקי או
    בזוגדידי. רכב חסכוני מספיק בכל עונה, והחניה ממש ליד השער.
ar:
  name: كاتدرائية تسايشي
  short: كرسي أسقفي من العصور الوسطى جنوب غربي زوغديدي، ببرج أجراس جميل وكنيسة أُعيد بناؤها حتى كادت تتغير.
  body: >-
    **كانت تسايشي من أبرز الكراسي الأسقفية في مينغريليا،** وهي اليوم أيضاً من أكثر عمليات الترميم إثارة
    للجدل في البلاد. تقع القرية على نحو اثني عشر كيلومتراً جنوب غربي زوغديدي في سهل مزروع مستوٍ.


    تشكّل كرسي تسايشي في أواخر القرن الثالث عشر حين أُعيد تنظيم الكنيسة في أوديشي. وكان الأسقف، الذي يُدعى
    التسايشيلي، من أشد رجال الدين نفوذاً في مينغريليا، وكان قريباً من بلاط داديياني.


    أما البناء نفسه فتاريخه متشابك. في المداميك السفلى آثار بازيليكا من القرن العاشر أو الحادي عشر؛ والكتلة
    الحالية المتصالبة ذات القبة ترجع في معظمها إلى القرن الرابع عشر، إلى إعادة البناء في عهد داديياني.
    وقد تضرر ورُمّم مراراً في القرون التالية.


    غيّره ترميم العقود الأخيرة تغييراً حاداً: حجر جديد وسقف جديد ورقبة قبة معاد بناؤها. ومن بعيد تبدو
    الكنيسة اليوم بناءً حديثاً، وهو ما لا يرضي كثيراً من مؤرخي الفن. أما النسيج الوسيط الأصيل فيجب البحث
    عنه في المداميك السفلى، وفي الكتل المنقوشة المعاد استعمالها، وفي شذرات التصوير الباقية، وفيها طبقات
    من القرن الرابع عشر وأخرى من القرنين السادس عشر والسابع عشر، وكلتاهما محدودة.


    وأصدق ما في الموقع برج الأجراس: بناء عالٍ من ثلاث طبقات يعود إلى القرن السادس عشر أو السابع عشر، وفي
    أعلاه طابق أجراس مفتوح. ونسبه وآجره هما التفصيل الذي يبرر التوقف.


    والترميم نفسه وثيقة. فقد جرى في سنوات كانت جورجيا تعيد فيها بناء كنائس كثيرة بسرعة وبحماسة تفوق الأثريات،
    ويمكنك أن ترى أين يلتقي الحجر المنحوت الجديد بالحصى القديم، وأين حلّ قوس مستقيم حديث محل قوس وسيط
    متهدل. وهل هذا إنقاذ أم خسارة؟ ذاك هو الجدل بعينه. أما الأبرشية فما زالت قائمة: أُحييت عام 1995 باسم
    أبرشية زوغديدي وتسايشي، فبقي الاسم في لقب حي.


    الفناء واسع هادئ، وحوله حقول ذرة وبساتين بندق. لا يكاد أحد يقف هنا: لا حافلات ولا شباك تذاكر ولا لافتات
    تُذكر. نصف ساعة تغطي كل شيء.


    وبصراحة: إن كنت تريد عمارة وسيطة لم تُمسّ فامنح وقتك لتسالنجيخا وخوبي. أما إن أردت أن ترى كيف يعيش
    أثر جورجي في القرن الحادي والعشرين، وما الذي يفعله الترميم للمبنى وبه، ففي تسايشي يُطرح هذا السؤال
    بأوضح صورة.
  tip: >-
    نصف ساعة تكفي، وتندرج بسهولة في يوم زوغديدي. الكنيسة عاملة، فقواعد اللباس مطبقة والأوشحة عند الباب.
    وهي ليست مفتوحة دائماً؛ فإن وجدت الباب مغلقاً فاسأل في الفناء أو في أقرب بيت. استأذن قبل التصوير وتوقع
    الرفض في الداخل. الوقوف عند البوابة مجاني لكن الظل قليل، والسيارة المتروكة هناك صيفاً تسخن كثيراً.
    لا دورات مياه هنا ولا مقهى؛ أقربها في زوغديدي.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي ثم باتجاه زوغديدي؛ وقبل المدينة ببضعة كيلومترات خذ المنعطف المُعلَّم
    جنوباً غرباً إلى تسايشي — نحو 320 كم إجمالاً وأربع ساعات وخمس وأربعين دقيقة. الطريق معبّد بكامله،
    والمقطع الأخير درب ريفي ضيق فيه حفر لكنه سالك تماماً لسيارة منخفضة. اهتدِ ببرج الأجراس فهو ظاهر فوق
    الحقول من مسافة بعيدة. تزوّد بالوقود في سيناكي أو زوغديدي. والسيارة الاقتصادية كافية في كل فصل، والوقوف
    عند البوابة مباشرة.
