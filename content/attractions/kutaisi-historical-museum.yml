ka:
  name: ქუთაისის სახელმწიფო ისტორიული მუზეუმი
  short: >-
    კოლხური ბრინჯაო, 2500 წლის ვერცხლის მონეტა, დასავლეთ საქართველოს საეკლესიო ჭედურობა და „ვეფხისტყაოსნის“
    რვა ხელნაწერი პუშკინის ქუჩაზე.
  body: >-
    **ორიათასხუთასი წლის წინ მოჭრილი კოლხური ვერცხლის მონეტა, შორაპნისა და მოწამეთის საეკლესიო ვერცხლი,
    „ვეფხისტყაოსნის“ რვა ხელნაწერი: ქუთაისი დასავლეთ საქართველოს მეხსიერებას ყოფილ ბანკში ინახავს.**


    მუზეუმი 1912 წელს კერძო სახლში დაიწყო: კოლექციას მისი გამგე, გრიგოლ გველესიანი, საკუთარ ჭერქვეშ ინახავდა.
    სწორედ იმ წელს დაარსდა საქართველოს საისტორიო და საეთნოგრაფიო საზოგადოების ქუთაისის განყოფილება. 1921–1922
    წლებში მისი კოლექციის საფუძველზე მუზეუმი შეიქმნა, პირველ დირექტორად ტრიფონ ჯაფარიძე დაინიშნა, მოგვიანებით
    კი მუზეუმი პუშკინის ქუჩაზე, ეროვნული ბანკის ყოფილ შენობაში დაბინავდა. დღეს ის ისტორიკოს ნიკო ბერძენიშვილის
    სახელს ატარებს და 200 000-ზე მეტ ნივთს ინახავს — ძვ. წ. IX საუკუნიდან გვიან შუა საუკუნეებამდე; აქვეა
    40 000-ზე მეტი ტომის ბიბლიოთეკაც.


    დაიწყეთ ქუთაისისა და მისი შემოგარენის არქეოლოგიით: კოლხური ცულები, სტილიზებული ცხოველებით შემკული
    ბრინჯაოს ბალთები, ძვ. წ. VII–VI საუკუნეების მამაკაცის ბრინჯაოს ქანდაკება სოფელ ფერსათიდან, ქალის ბრინჯაოს
    ფიგურა გეგუთიდან. ნუმიზმატიკურ კოლექციაში უნიკუმი ინახება — ძვ. წ. V საუკუნის კოლხური ვერცხლის დიდრაქმა;
    მის გვერდით კოლხური დრაქმები, ალექსანდრე მაკედონელის გამოსახულებიანი ოქროს სტატერი და გიორგი III-ისა
    და თამარის მონეტებია.


    სახლის გული ოქროს ფონდია, დასავლეთ საქართველოს საეკლესიო ჭედურობა: X საუკუნის ვერცხლის სტავროთეკა,
    შორაპნიდან და მოწამეთადან ჩამოტანილი XI საუკუნის ლორფინები ამაღლებისა და შობის გამოსახულებით, XII–XIII
    საუკუნეების მაცხოვრის ხატი მოწამეთადან. ბევრი ნივთი აქ მას შემდეგ მოხვდა, რაც საბჭოთა ხელისუფლებამ
    ბაგრატის ტაძარი დახურა.


    მერე ხელნაწერები — დასავლეთ საქართველოს ეკლესია-მონასტრებიდან შემოსული 800-მდე წიგნი: XI საუკუნის
    დასაწყისის ეტრატზე გადაწერილი სახარება-სამოციქულო, იოანე ოქროპირის თხზულებები, 1047–1053 წლებში კაცხის
    მონასტრისთვის გადაწერილი, „ვეფხისტყაოსნის“ რვა ხელნაწერი.


    მუზეუმში ბაგრატის ნახვის შემდეგ მოდით: იქ ტაძარს ნახავთ, რომელმაც საგანძური დაკარგა, აქ — თავად საგანძურს.
  tip: >-
    საათნახევარი გამოყავით და პირველ რიგში ოქროს ფონდს მიაშურეთ; თუ დაკეტილია, მოლარეს ჰკითხეთ — თანამშრომლებს
    მისი გაღება სტუმრებისთვის შეუძლიათ. ინგლისური წარწერები ნაწილობრივია, ამიტომ გიდი ბევრს შეგმატებთ.
    ზოგ დარბაზში ფოტოს გადაღება შეზღუდულია. ტუალეტი შენობაშია. ბილეთი დაახლოებით 7 ლარი ღირს. სადილისთვის
    მწვანე ბაზარი რამდენიმე წუთის სავალზეა, ბაგრატის ტაძარი კი რიონის გაღმა, გორაზე დგას — ორივე ერთად
    ნახევარ დღეს ბუნებრივად ავსებს.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით
    და ზესტაფონის გავლით ქუთაისში შეხვალთ: დაახლოებით 230 კმ, სამი საათი და ოცი წუთი. ცენტრის ნიშნებს
    მიჰყევით; მუზეუმი პუშკინის ქუჩაზეა, ცენტრალური მოედნიდან და რიონზე გადებული თეთრი ხიდიდან რამდენიმე
    კვარტალში. ცენტრში ქუჩის პარკინგი დღისით ივსება, ამიტომ ხშირად ჯობია მანქანა ერთი-ორი კვარტლით მოშორებით
    დატოვოთ და ფეხით გაიაროთ. საწვავს ქალაქის შესასვლელთან ადვილად იპოვით. ეკონომკლასის მანქანა ნებისმიერ
    სეზონში საკმარისია.
en:
  name: Kutaisi State Historical Museum
  short: >-
    Colchian bronzes, a 2,500-year-old silver coin, church silver of western Georgia and eight manuscripts
    of Rustaveli, on Pushkin Street.
  body: >-
    **A Colchian silver coin struck 2,500 years ago, church silver from Shorapani and Motsameta, eight
    manuscripts of Rustaveli: Kutaisi keeps western Georgia's memory in a former bank.**


    The museum began in 1912 in a private house, where Grigol Gvelesiani, the man in charge of the collection,
    kept it under his own roof. That year the Kutaisi branch of the Georgian Historical and Ethnographic
    Society was founded. In 1921–22 its collection became a museum, with Tripon Japaridze as first director,
    and the museum later settled in the former National Bank building on Pushkin Street. It now bears
    the name of the historian Niko Berdzenishvili and holds more than 200,000 objects, from the 9th century
    BC to the late Middle Ages, along with a library of over 40,000 volumes.


    Start with the archaeology of Kutaisi and the country around it: Colchian axes, bronze belt buckles
    alive with stylised animals, a bronze male figure of the 7th–6th century BC from the village of Persati,
    a bronze woman from Geguti. The coin cabinet keeps a rarity, a Colchian silver didrachm of the 5th
    century BC, alongside Colchian drachms, a gold stater bearing Alexander the Great and coins of Giorgi
    III and Tamar.


    The heart of the house is the Gold Treasury, the church metalwork of western Georgia: a 10th-century
    silver staurotheke, 11th-century patens from Shorapani and Motsameta chased with the Ascension and
    the Nativity, a 12th–13th-century icon of the Saviour from Motsameta. Many of its pieces arrived after
    Soviet rule closed Bagrati Cathedral.


    Then the manuscripts, some 800 books from the churches and monasteries of the west: a Gospel and Apostolos
    on parchment from the early 11th century, John Chrysostom's commentaries copied for Katskhi in 1047–1053,
    eight manuscripts of The Knight in the Panther's Skin.


    Come after Bagrati: there you see the cathedral that lost its treasure, here the treasure itself.
  tip: >-
    Allow an hour and a half, and make for the Gold Treasury first; if it is locked, ask at the desk,
    since staff can open it for visitors. English labelling is patchy, so a guide adds a great deal. Photography
    is restricted in some rooms. There is a toilet inside. Tickets are around 7 lari. For lunch, the Green
    Bazaar is a few minutes' walk away, and Bagrati Cathedral stands on the hill across the Rioni, so
    the two make a natural half-day together.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri, over the Rikoti Pass and past Zestaponi
    into Kutaisi: about 230 km, three hours twenty. Follow signs for the centre; the museum is on Pushkin
    Street, a few blocks from the central square and the White Bridge over the Rioni. Street parking in
    the centre fills up during the day, so it is often easier to leave the car a block or two away and
    walk. Fuel is easy to find on the approach to the city. An economy car is all you need, in any season.
ru:
  name: Кутаисский государственный исторический музей
  short: >-
    Колхидская бронза, серебряная монета возрастом 2500 лет, церковное серебро Западной Грузии и восемь
    списков «Витязя в тигровой шкуре» — на Пушкинской улице.
  body: >-
    **Колхидская серебряная монета, отчеканенная 2500 лет назад, церковное серебро из Шорапани и Моцамета,
    восемь списков поэмы Руставели: Кутаиси хранит память Западной Грузии в здании бывшего банка.**


    Музей начинался в 1912 году в частном доме — там, под собственной крышей, хранил коллекцию заведующий
    ею Григол Гвелесиани. В том же году в Кутаиси открылось отделение Грузинского историко-этнографического
    общества. В 1921–1922 годах на основе его коллекции создали музей — первым директором стал Трифон
    Джапаридзе, — а позже музей обосновался в бывшем здании Национального банка на Пушкинской улице. Сегодня
    он носит имя историка Нико Бердзенишвили и хранит более 200 000 предметов, от IX века до н. э. до
    позднего Средневековья, а также библиотеку из более чем 40 000 томов.


    Начните с археологии Кутаиси и его окрестностей: колхидские топоры, бронзовые поясные пряжки со стилизованными
    животными, бронзовая мужская фигурка VII–VI веков до н. э. из села Персати, бронзовая женская фигурка
    из Гегути. В монетном кабинете хранится редкость — колхидская серебряная дидрахма V века до н. э.,
    а рядом с ней колхидские драхмы, золотой статер с изображением Александра Македонского и монеты Георгия
    III и Тамары.


    Сердце музея — Золотой фонд, церковная утварь Западной Грузии: серебряная ставротека X века, литургические
    дискосы XI века из Шорапани и Моцамета с чеканными сценами Вознесения и Рождества, икона Спаса XII–XIII
    веков из Моцамета. Многие из этих вещей попали сюда после того, как советская власть закрыла Баграти.


    Затем рукописи — около 800 книг из церквей и монастырей запада Грузии: Евангелие и Апостол на пергамене
    начала XI века, толкования Иоанна Златоуста, переписанные для Кацхи в 1047–1053 годах, восемь списков
    «Витязя в тигровой шкуре».


    Приходите сюда после Баграти: там вы увидите собор, лишившийся своей казны, здесь — саму эту казну.
  tip: >-
    Отведите на музей полтора часа и начните с Золотого фонда; если он закрыт, спросите на входе — сотрудники
    открывают его по просьбе посетителей. Подписи на английском неполные, так что гид будет очень кстати.
    В некоторых залах фотосъёмка ограничена. Внутри есть туалет. Билет стоит около 7 лари. На обед в нескольких
    минутах ходьбы — Зелёный базар, а собор Баграти стоит на холме за Риони, так что музей и собор вместе
    — готовый план на полдня.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Гори и Хашури, через Рикотский перевал и Зестафони —
    в Кутаиси: около 230 км, три часа двадцать минут. Следуйте указателям на центр; музей находится на
    Пушкинской улице, в нескольких кварталах от центральной площади и Белого моста через Риони. Уличная
    парковка в центре днём заполняется, поэтому машину часто удобнее оставить за квартал-два и пройти
    пешком. Заправки легко найти на подъезде к городу. Машины эконом-класса достаточно в любое время года.
fa:
  name: موزه دولتی تاریخ کوتایسی
  short: >-
    برنزهای کولخیدی، سکه‌ای نقره‌ای به قدمت ۲۵۰۰ سال، نقره‌های کلیسایی غرب گرجستان و هشت نسخهٔ خطی از
    «پلنگینه‌پوش»، در خیابان پوشکین.
  body: >-
    **سکه‌ای نقره‌ای از کولخیس که ۲۵۰۰ سال پیش ضرب شد، نقره‌های کلیسایی شوراپنی و موتسامتا، هشت نسخهٔ
    خطی از روستاولی: کوتایسی حافظهٔ غرب گرجستان را در ساختمان بانکی قدیمی نگه می‌دارد.**


    موزه سال ۱۹۱۲ در خانه‌ای شخصی آغاز شد؛ گریگول گِوِلسیانی، مسئول این مجموعه، آن را زیر سقف خود نگه
    می‌داشت. همان سال شاخهٔ کوتایسی انجمن تاریخ و قوم‌نگاری گرجستان بنیاد گذاشته شد. در سال‌های ۱۹۲۱ تا
    ۱۹۲۲ این مجموعه به موزه بدل شد و تریفون جاپاریدزه نخستین مدیر آن گشت؛ بعدها موزه در ساختمان پیشین
    بانک ملی در خیابان پوشکین جای گرفت. امروز این موزه نام تاریخ‌نگار نیکو بردزنیشویلی را بر خود دارد
    و بیش از ۲۰۰٬۰۰۰ شیء را، از سدهٔ نهم پیش از میلاد تا اواخر سده‌های میانه، در خود جای داده است؛ کتابخانه‌اش
    نیز بیش از ۴۰٬۰۰۰ جلد کتاب دارد.


    کار را از باستان‌شناسی کوتایسی و پیرامونش آغاز کنید: تبرهای کولخیدی، سگک‌های برنزی کمربند که نقش جانوران
    استیلیزه به آن‌ها جان داده است، پیکرکی برنزی از مردی در سده‌های هفتم تا ششم پیش از میلاد از روستای
    پرساتی، و پیکرکی برنزی از زنی از گِگوتی. در گنجینهٔ سکه‌ها، اثری نادر نگاه می‌دارند: یک دیدراخم نقرهٔ
    کولخیدی از سدهٔ پنجم پیش از میلاد، در کنار دراخم‌های کولخیدی، استاتری زرین با نقش اسکندر مقدونی و
    سکه‌هایی از گیورگی سوم و تامار.


    قلب این خانه گنجینهٔ زرین است، فلزکاری کلیسایی غرب گرجستان: صندوقچهٔ نقره‌ای یادگار صلیب مقدس (ستاوروتکا)
    از سدهٔ دهم، بشقاب‌های نان عشای ربانی (دیسکوس) سدهٔ یازدهم از شوراپنی و موتسامتا با نقش‌های قلم‌زدهٔ
    عروج و میلاد مسیح، و شمایلی از مسیح ناجی از سده‌های دوازدهم و سیزدهم از موتسامتا. بسیاری از این اشیا
    پس از آن به این‌جا رسیدند که حکومت شوروی کلیسای باگراتی را بست.


    سپس نسخه‌های خطی می‌رسند، نزدیک به هشتصد کتاب از کلیساها و صومعه‌های غرب گرجستان: انجیل و رسائل حواریون
    بر پوست از آغاز سدهٔ یازدهم، تفسیرهای یوحنا زرین‌دهان که برای کاتسخی در سال‌های ۱۰۴۷ تا ۱۰۵۳ رونویسی
    شده، و هشت نسخهٔ خطی از «پلنگینه‌پوش».


    پس از دیدن باگراتی به این‌جا بیایید: آن‌جا کلیسایی را می‌بینید که گنجینه‌اش را از دست داده، این‌جا
    خود آن گنجینه را.
  tip: >-
    یک ساعت و نیم وقت بگذارید؛ نخست به سوی گنجینهٔ زرین بروید و اگر بسته بود، از کارکنان بپرسید، چون می‌توانند
    آن را برای بازدیدکنندگان باز کنند. برچسب‌های انگلیسی ناقص‌اند، پس یک راهنما کمک بسیاری می‌کند. در
    برخی تالارها عکاسی محدود است. سرویس بهداشتی در داخل موزه هست. بلیت حدود ۷ لاری است. برای ناهار، بازار
    سبز چند دقیقه پیاده‌روی فاصله دارد و کلیسای باگراتی هم بر تپه‌ای در آن‌سوی ریونی ایستاده است، پس این
    دو در کنار هم نیمی از یک روز را به‌خوبی پر می‌کنند.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب، از کنار گوری و خاشوری، از گذرگاه ریکوتی و از کنار زستافونی
    بگذرید تا به کوتایسی برسید: نزدیک به ۲۳۰ کیلومتر و سه ساعت و بیست دقیقه. تابلوهای مرکز شهر را دنبال
    کنید؛ موزه در خیابان پوشکین است، چند بلوک با میدان مرکزی و پل سفید روی ریونی فاصله دارد. پارکینگ خیابانی
    در مرکز شهر در طول روز پر می‌شود، پس بهتر است ماشین را یک یا دو بلوک دورتر بگذارید و پیاده بروید.
    سوخت‌گیری در مسیر ورود به شهر آسان است. یک خودروی اقتصادی در هر فصلی کافی است.
he:
  name: המוזיאון ההיסטורי הממלכתי של קוטאיסי
  short: >-
    ברונזה קולכית, מטבע כסף בן 2,500 שנה, כלי כסף כנסייתיים ממערב גאורגיה ושמונה כתבי יד של "האביר בעור
    הנמר" - ברחוב פושקין.
  body: >-
    **מטבע כסף קולכי שנטבע לפני 2,500 שנה, כלי כסף כנסייתיים משוראפני וממוצמתא, שמונה כתבי יד של רוסתאוולי:
    קוטאיסי שומרת את זיכרונה של מערב גאורגיה בבניין שהיה פעם בנק.**


    המוזיאון נולד ב-1912 בבית פרטי, שם החזיק גריגול גוולסיאני, האיש שהיה מופקד על האוסף, את הפריטים מתחת
    לגג שלו עצמו. באותה שנה נוסד סניף קוטאיסי של האגודה הגאורגית להיסטוריה ואתנוגרפיה. בשנים 1921–1922
    הפך האוסף למוזיאון, עם טריפון ג'אפרידזה כמנהל הראשון, ובהמשך התמקם המוזיאון בבניין הבנק הלאומי הישן
    שברחוב פושקין. כיום הוא נושא את שמו של ההיסטוריון ניקו ברדזנישווילי, ומחזיק למעלה מ-200,000 פריטים,
    מהמאה התשיעית לפני הספירה ועד סוף ימי הביניים, לצד ספרייה של למעלה מ-40,000 כרכים.


    התחילו מהארכיאולוגיה של קוטאיסי וסביבותיה: גרזנים קולכיים, אבזמי חגורה מברונזה שבעלי חיים מסוגננים
    מפיחים בהם חיים, פסלון גברי מברונזה מהמאות השביעית-השישית לפני הספירה מהכפר פרסאטי, ופסלון אישה מברונזה
    מגגוטי. בקבינט המטבעות שמור פריט נדיר: דידרכמה קולכית מכסף מהמאה החמישית לפני הספירה, ולצדה דרכמות
    קולכיות, סטטר זהב הנושא את דמותו של אלכסנדר הגדול, ומטבעות של גיאורגי השלישי ותמר.


    לב הבית הוא אוצר הזהב, כלי המתכת הכנסייתיים של מערב גאורגיה: סטאורותקה מכסף מהמאה העשירית, צלחות לחם
    הקודש (דיסקוסים) מהמאה האחת-עשרה משוראפני וממוצמתא, מעוטרות בתבליטי העלייה השמימה והמולד, ואיקונה
    של המושיע מהמאות השתיים-עשרה עד השלוש-עשרה ממוצמתא. פריטים רבים הגיעו לכאן לאחר שהשלטון הסובייטי סגר
    את קתדרלת בגרטי.


    ואז כתבי היד, כשמונה מאות ספרים מהכנסיות והמנזרים של המערב: ספר בשורות ואיגרות השליחים על קלף מתחילת
    המאה האחת-עשרה, פירושי יוחנן זהב-הפה שהועתקו למנזר קאצחי בשנים 1047–1053, ושמונה כתבי יד של "האביר
    בעור הנמר".


    בואו לכאן אחרי בגרטי: שם תראו את הקתדרלה שאיבדה את אוצרותיה, וכאן - את האוצרות עצמם.
  tip: >-
    הקדישו שעה וחצי, ופנו קודם לאוצר הזהב; אם הוא נעול, שאלו בקופה - הצוות יכול לפתוח אותו לביקור. השילוט
    באנגלית חלקי, כך שמדריך יתרום רבות. בחלק מהחדרים הצילום מוגבל. יש שירותים בתוך הבניין. הכרטיס עולה
    כ-7 לארי. לארוחת צהריים, השוק הירוק במרחק דקות הליכה, וקתדרלת בגרטי עומדת על הגבעה מעברו השני של נהר
    ריוני - כך ששני האתרים ממלאים יחד חצי יום באופן טבעי.
  route: >-
    מטביליסי קחו את כביש S1 (E60) מערבה, דרך גורי וחשורי, דרך מעבר ריקותי ודרך זסטפוני עד קוטאיסי: כ-230
    ק"מ, שלוש שעות ועשרים דקות. עקבו אחר השילוט למרכז; המוזיאון ברחוב פושקין, כמה רחובות מהכיכר המרכזית
    ומהגשר הלבן שמעל ריוני. חניית רחוב במרכז מתמלאת במהלך היום, לכן לרוב קל יותר להשאיר את הרכב רחוב או
    שניים משם וללכת ברגל. דלק זמין בקלות בכניסה לעיר. רכב חסכוני מספיק, בכל עונה.
ar:
  name: متحف كوتايسي التاريخي الحكومي
  short: >-
    برونزيات كولخيدية، وعملة فضية عمرها 2500 عام، وفضة كنسية من غرب جورجيا، وثماني نسخ مخطوطة من "الفارس
    في جلد النمر"، في شارع بوشكين.
  body: >-
    **عملة فضية كولخيدية سُكّت قبل 2500 عام، وفضة كنسية من شورابني وموتسامتا، وثماني مخطوطات من ملحمة
    روستافيلي: تحفظ كوتايسي ذاكرة غرب جورجيا في مبنى مصرف سابق.**


    بدأ المتحف عام 1912 في بيت خاص، حيث كان غريغول غفيليسياني، المسؤول عن المجموعة، يحتفظ بها تحت سقفه
    هو نفسه. في تلك السنة تأسس فرع كوتايسي للجمعية الجورجية التاريخية والإثنوغرافية. وفي 1921–1922 تحوّلت
    مجموعته إلى متحف، وكان تريفون جافاريدزه أول مدير له، ثم استقر المتحف لاحقاً في مبنى البنك الوطني السابق
    بشارع بوشكين. ويحمل اليوم اسم المؤرخ نيكو بيردزنيشفيلي، ويضم أكثر من 200,000 قطعة، من القرن التاسع
    قبل الميلاد إلى أواخر العصور الوسطى، إلى جانب مكتبة تضم أكثر من 40,000 مجلد.


    ابدأ بآثار كوتايسي وضواحيها: فؤوس كولخيدية، وإبزيمات أحزمة برونزية نابضة بحيوانات مُحوَّرة الأشكال،
    وتمثال برونزي لرجل من القرنين السابع والسادس قبل الميلاد من قرية بيرساتي، وتمثال برونزي لامرأة من
    غيغوتي. وفي خزانة العملات قطعة نادرة: ديدراخمة فضية كولخيدية من القرن الخامس قبل الميلاد، إلى جانب
    دراخمات كولخيدية، وستاتير من الذهب يحمل صورة الإسكندر المقدوني، وعملات لجورجي الثالث وتامار.


    قلب البيت هو خزانة الذهب، المشغولات المعدنية الكنسية لغرب جورجيا: ذخيرة فضية لخشبة الصليب (ستاوروثيكا)
    من القرن العاشر، وصحون قربان من القرن الحادي عشر من شورابني وموتسامتا نُقشت عليها مشاهد الصعود والميلاد،
    وأيقونة المخلّص من القرنين الثاني عشر والثالث عشر من موتسامتا. وقد وصل كثير من هذه القطع إلى هنا بعد
    أن أغلقت السلطة السوفيتية كاتدرائية باغراتي.


    ثم المخطوطات، نحو 800 كتاب من كنائس غرب جورجيا وأديرتها: إنجيل وكتاب رسائل الرسل على رَقّ من أوائل
    القرن الحادي عشر، وتفاسير يوحنا الذهبي الفم المنسوخة لدير كاتسخي بين 1047 و1053، وثماني نسخ مخطوطة
    من "الفارس في جلد النمر".


    تعالَ إلى هنا بعد باغراتي: هناك ترى الكاتدرائية التي خسرت خزانتها، وهنا ترى الخزانة نفسها.
  tip: >-
    خصص ساعة ونصف، وابدأ بخزانة الذهب؛ فإن كانت مغلقة فاسأل عند الاستقبال، فالموظفون يمكنهم فتحها للزوار.
    الشروحات بالإنجليزية غير كاملة، لذا يضيف المرشد الكثير. التصوير محدود في بعض القاعات. توجد دورة مياه
    داخل المبنى. سعر التذكرة نحو 7 لاري. لتناول الغداء، يقع السوق الأخضر على بعد دقائق سيراً، وتقف كاتدرائية
    باغراتي على التلة عبر نهر ريوني، فيملأ الموقعان معاً نصف يوم بسهولة.
  route: >-
    من تبليسي خذ الطريق السريع S1 (E60) غرباً، مروراً بغوري وخاشوري، ثم عبر ممر ريكوتي وزستافوني إلى كوتايسي:
    نحو 230 كم، ثلاث ساعات وعشرين دقيقة. اتبع لافتات وسط المدينة؛ يقع المتحف في شارع بوشكين، على بعد بضعة
    شوارع من الساحة المركزية والجسر الأبيض فوق ريوني. تمتلئ مواقف الشوارع في وسط المدينة نهاراً، فغالباً
    يكون أسهل أن تترك السيارة على بعد شارع أو اثنين وتمشي. الوقود متوفر بسهولة عند مدخل المدينة. سيارة
    اقتصادية تكفي في أي فصل.
