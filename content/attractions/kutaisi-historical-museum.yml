ka:
  name: ქუთაისის სახელმწიფო ისტორიული მუზეუმი
  short: >-
    ნიკო ბერძენიშვილის სახელობის მუზეუმი, სადაც გელათისა და ბაგრატის ოქრომჭედლობა ინახება.
  body: >-
    **ეს არის ის ადგილი, სადაც დასავლეთ საქართველოს ეკლესიების საგანძური აღმოჩნდა.** მუზეუმი 1921–22 წლებში
    დაარსდა და ქართული ბანკის ყოფილ შენობაშია, პუშკინის ქუჩაზე, ცენტრიდან ხუთი წუთის სავალზე. ფონდი 200
    000 ერთეულს აღემატება, ექსპოზიცია კი ორ სართულზე, ათ დარბაზშია განლაგებული.


    ქრონოლოგია ძვ. წ. IX საუკუნიდან გვიან შუა საუკუნეებამდე გრძელდება. კოლხური ბრინჯაო, ანტიკური კერამიკა,
    ბიზანტიური და რომაული მონეტები, ხელნაწერები, ქსოვილი, ტყავი და ხის ნაკეთობა — ჩვეულებრივი რეგიონული
    მუზეუმის სტანდარტული ნაკრები, კარგად შერჩეული, თუმცა უცხოენოვანი ეტიკეტები ყველგან არაა.


    მთავარი კი ოქროს ფონდია. საბჭოთა პერიოდში, როცა ბაგრატისა და გელათის ეკლესიები დაიხურა, მათი ჭედური
    ხატები, ჯვრები, ყდები და საეკლესიო ჭურჭელი აქ გადმოიტანეს. შედეგად ერთ დარბაზში თავმოყრილია ქართული
    ოქრომჭედლობის რამდენიმე საუკუნე: X–XII საუკუნეების ჭედური ხატები ემალით, მინანქრის ფრაგმენტები, წარწერიანი
    ჯვრები. ეს კოლექცია გელათის მონახულებას ავსებს — იქ არქიტექტურა და მოზაიკაა, აქ კი ის, რაც ტაძრის შიგნით
    იდგა.


    შენობაშივეა კვლევითი ბიბლიოთეკა ორმოცი ათასი ტომით და ხელნაწერებით; მუზეუმი საქართველოს სერიოზულ სამეცნიერო
    ინსტიტუციად ითვლება, ტურისტულ ობიექტზე მეტად.


    ერთი გულწრფელი შენიშვნა: ექსპოზიციის დიდი ნაწილი ძველი ტიპისაა — შუშის ვიტრინა, დაბეჭდილი ბარათი,
    სუსტი განათება. ვინც მხოლოდ „საუკეთესოს“ ეძებს, ოცდაათ წუთში ოქროს დარბაზით შემოიფარგლება; ვისაც რეგიონის
    ისტორია აინტერესებს, ორ საათსაც გაატარებს.


    ორი მცირე განყოფილება ცალკე ღირს ყურადღებას. ნუმიზმატიკური კაბინეტი დასავლეთ საქართველოს ფულად
    მიმოქცევას ბერძნული მონეტებიდან ბიზანტიურ და სასანურ ნიმუშებამდე და შემდეგ ქართულ შუასაუკუნეობრივ
    მოჭრილობამდე მიჰყვება — ეს კომპაქტური გაკვეთილია იმაზე, ვინ და როდის ვაჭრობდა აქ. ეთნოგრაფიულ დარბაზებში
    კი იმერული სახლის ინტერიერი, ღვინის ჭურჭელი და სამეურნეო იარაღებია, რომლებიც სოფლებიდან ბოლო ორ თაობაში
    გაქრა.
  tip: >-
    საათნახევარი ნორმალური დროა. ოქროს ფონდი ცალკე ინახება და მას თანამშრომელი გიხსნის — ჯობია შესვლისთანავე
    სთხოვო. ინგლისურენოვანი ეტიკეტები ნაწილობრივია, ამიტომ გიდი ან აუდიოგიდი განსხვავებას ქმნის. ფოტოს
    გადაღება ზოგ დარბაზში აკრძალულია. შენობა ორსართულიანია, ლიფტის გარეშე. ტუალეტი შიგნითაა. კაფეები და
    პარკინგი უახლოეს კვარტალშია, ცენტრალური მოედნიდან ხუთი წუთის სავალზე.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ — გორი, ხაშური, რიკოთი, ზესტაფონი — 230 კმ და დაახლოებით სამი საათი
    და ოცი წუთი. ქუთაისში ცენტრისკენ, რიონის მარცხენა ნაპირზე გაუყევი; მუზეუმი პუშკინის ქუჩაზეა, თეთრი
    ხიდიდან რამდენიმე კვარტალში. ცენტრში ქუჩის პარკინგი უფასოა, მაგრამ დღისით ივსება — ჯობია ერთი კვარტლით
    შორს დააყენო. საწვავი ზესტაფონსა და ქუთაისის შესასვლელშია. ეკონომ-კლასის ავტომობილი მთელი წელი საკმარისია.
en:
  name: Kutaisi State Historical Museum
  short: >-
    The Niko Berdzenishvili museum, which holds the goldsmiths' work taken from Gelati and Bagrati.
  body: >-
    **This is where the treasure of the western Georgian churches ended up.** The museum was founded in
    1921–22 and occupies the former Bank of Georgia building on Pushkin Street, five minutes from the central
    square. The collection runs to more than 200,000 items, shown across ten rooms on two floors.


    The chronology reaches from the 9th century BC to the late medieval period: Colchian bronzes, classical
    pottery, Roman and Byzantine coins, manuscripts, textiles, leather and woodwork. That is the ordinary
    content of a good regional museum, well chosen, though labelling in foreign languages is patchy.


    The reason to come is the Gold Treasury. When Bagrati and Gelati were closed under Soviet rule, their
    repoussé icons, processional crosses, book covers and liturgical vessels were brought here. The result
    is several centuries of Georgian goldsmithing gathered in one room: 10th to 12th-century icons in beaten
    silver and gold, fragments of cloisonné enamel, crosses with donor inscriptions. It completes a visit
    to Gelati — there you see the architecture and the mosaic, here you see what once stood inside.


    The same building holds a research library of some forty thousand volumes and manuscripts. The institution
    is taken seriously in Georgia as a scholarly centre rather than as a tourist stop.


    One honest note: much of the display is old-fashioned — glass cases, typed cards, weak lighting. A
    visitor after highlights only will spend thirty minutes in the treasury and leave; anyone interested
    in the history of the region can easily stay two hours.


    Two smaller sections repay attention. The numismatic cabinet follows the currency of western Georgia
    from Greek issues through Byzantine and Sasanian pieces to medieval Georgian minting, which is a compact
    lesson in who was trading here and when. The ethnographic rooms hold Imeretian house interiors, wine
    vessels and farm tools of a kind that has disappeared from the villages within the last two generations.
  tip: >-
    An hour and a half is a fair allowance. The Gold Treasury is kept separately and a member of staff
    unlocks it for you, so ask at the desk as you arrive rather than at the end. English labels are partial,
    so a guide or audio guide makes a real difference. Photography is restricted in some rooms. The building
    has two floors and no lift. There is a toilet inside. Cafes and parking are in the surrounding blocks,
    a five-minute walk from the central square.
  route: >-
    Take the E60 west from Tbilisi through Gori, Khashuri, the Rikoti section and Zestaponi — 230 km, about
    three hours twenty. In Kutaisi follow signs to the centre and stay on the left bank of the Rioni; the
    museum is on Pushkin Street, a few blocks from the White Bridge. Street parking in the centre is free
    but fills up during the day, so it is easier to stop a block away. Fuel is available in Zestaponi and
    at the entrance to Kutaisi. An economy car is enough all year.
ru:
  name: Кутаисский государственный исторический музей
  short: >-
    Музей имени Нико Бердзенишвили, где хранится золото и чеканка из Гелати и Баграти.
  body: >-
    **Именно сюда попала сокровищница западногрузинских храмов.** Музей основан в 1921–22 годах и занимает
    бывшее здание Банка Грузии на улице Пушкина, в пяти минутах от центральной площади. В фондах больше
    200 000 предметов, экспозиция размещена в десяти залах на двух этажах.


    Хронология тянется от IX века до н. э. до позднего средневековья: колхидская бронза, античная керамика,
    римские и византийские монеты, рукописи, ткани, кожа и дерево. Обычный набор хорошего краеведческого
    музея, отобранный со вкусом, хотя этикетки на иностранных языках есть не везде.


    Ради чего стоит идти — это Золотая кладовая. Когда при советской власти Баграти и Гелати закрыли, их
    чеканные иконы, выносные кресты, оклады и литургическую утварь перевезли сюда. В итоге в одном зале
    собрано несколько веков грузинского златокузнечества: иконы X–XII веков в чеканном серебре и золоте,
    фрагменты перегородчатой эмали, кресты с вкладными надписями. Это дополняет поездку в Гелати: там —
    архитектура и мозаика, здесь — то, что когда-то стояло внутри храма.


    В том же здании находится научная библиотека примерно на сорок тысяч томов и рукописей. В Грузии музей
    воспринимают скорее как исследовательский центр, чем как туристическую точку.


    Одно честное замечание: значительная часть экспозиции устроена по-старому — стеклянные витрины, машинописные
    подписи, слабый свет. Тот, кто хочет только «главное», проведёт полчаса в золотом зале и уйдёт; тому,
    кто интересуется историей края, легко хватит и двух часов.


    Два небольших раздела стоят отдельного внимания. Нумизматический кабинет прослеживает денежное обращение
    Западной Грузии от греческих монет через византийские и сасанидские образцы к грузинской средневековой
    чеканке — короткий урок о том, кто и когда здесь торговал. В этнографических залах — интерьеры
    имеретинского дома, винная посуда и хозяйственные орудия, которые исчезли из сёл за последние два
    поколения.
  tip: >-
    Полтора часа — разумный запас. Золотую кладовую держат отдельно, и сотрудник открывает её для посетителей,
    так что просите об этом сразу на входе, а не в конце. Английские подписи неполные, поэтому гид или
    аудиогид заметно помогает. В части залов съёмка ограничена. Здание двухэтажное, лифта нет. Туалет внутри.
    Кафе и парковка — в соседних кварталах, пять минут пешком от центральной площади.
  route: >-
    Из Тбилиси по E60 на запад через Гори, Хашури, участок Рикоти и Зестафони — 230 км, около трёх часов
    двадцати минут. В Кутаиси держитесь указателей на центр и левого берега Риони; музей стоит на улице
    Пушкина, в нескольких кварталах от Белого моста. Парковка вдоль улиц в центре бесплатная, но днём заполняется,
    так что проще встать кварталом дальше. Заправки есть в Зестафони и на въезде в Кутаиси. Машины эконом-класса
    достаточно круглый год.
fa:
  name: موزهٔ تاریخی دولتی کوتایسی
  short: >-
    موزهٔ نیکو بردزنیشویلی، که زرگری و شمایل‌های برداشته‌شده از گلاتی و باگراتی را نگه می‌دارد.
  body: >-
    **گنجینهٔ کلیساهای گرجستان غربی سر از اینجا درآورد.** موزه در ۱۹۲۱–۱۹۲۲ بنیاد گذاشته شد و در ساختمان
    پیشین بانک گرجستان در خیابان پوشکین، پنج دقیقه از میدان مرکزی، جای دارد. مجموعه بیش از ۲۰۰ هزار شیء
    دارد که در ده تالار و دو طبقه نمایش داده می‌شود.


    گاه‌شماری از سدهٔ نهم پیش از میلاد تا اواخر قرون میانه کشیده می‌شود: مفرغ کلخی، سفال دورهٔ کلاسیک،
    سکه‌های رومی و بیزانسی، دست‌نوشته‌ها، پارچه، چرم و چوب. این محتوای معمول یک موزهٔ منطقه‌ای خوب است،
    با انتخابی سنجیده، هرچند برچسب‌های غیرگرجی همه‌جا نیست.


    اما دلیل آمدن، گنجینهٔ زر است. وقتی باگراتی و گلاتی در دورهٔ شوروی بسته شدند، شمایل‌های کوبیده، صلیب‌های
    تشریفاتی، جلدهای فلزی کتاب و ظروف عبادی‌شان به اینجا آورده شد. نتیجه آن است که چند سده زرگری گرجی در
    یک تالار گرد آمده: شمایل‌های سده‌های دهم تا دوازدهم در نقره و زر کوبیده، پاره‌های میناکاری خانه‌بندی،
    و صلیب‌هایی با کتیبهٔ واقفان. این مجموعه دیدار گلاتی را کامل می‌کند؛ آنجا معماری و موزاییک را می‌بینید
    و اینجا آنچه را زمانی درون کلیسا ایستاده بود.


    در همین ساختمان کتابخانه‌ای پژوهشی با نزدیک چهل هزار جلد و دست‌نویس هست. در گرجستان این نهاد را بیشتر
    مرکزی علمی می‌دانند تا توقفگاهی گردشگری.


    یک نکتهٔ صادقانه: بخش بزرگی از نمایش به سبک قدیم است — ویترین شیشه‌ای، کارت تایپ‌شده، نور کم. کسی که
    فقط دنبال شاخص‌هاست نیم ساعت در تالار زر می‌ماند و می‌رود؛ کسی که به تاریخ منطقه علاقه دارد به‌راحتی
    دو ساعت می‌ماند.


    دو بخش کوچک‌تر ارزش توجه دارند. کابینت سکه‌شناسی گردش پول در غرب گرجستان را از سکه‌های یونانی تا
    نمونه‌های بیزانسی و ساسانی و سپس ضرب گرجی قرون میانه دنبال می‌کند؛ درسی فشرده در اینکه چه کسی و کی اینجا
    داد و ستد می‌کرد. تالارهای مردم‌شناسی نیز فضای خانهٔ ایمرتی، ظروف شراب و ابزار کشاورزی را نگه داشته‌اند
    که در دو نسل اخیر از روستاها ناپدید شده است.
  tip: >-
    یک ساعت و نیم مقدار منصفانه‌ای است. گنجینهٔ زر جدا نگهداری می‌شود و کارمندی آن را برایتان باز می‌کند،
    پس همان اول در باجه بخواهید نه در پایان. برچسب‌های انگلیسی ناقص است، بنابراین راهنما یا راهنمای صوتی
    تفاوت واقعی می‌سازد. عکاسی در بعضی تالارها محدود است. ساختمان دو طبقه و بدون آسانسور است. سرویس بهداشتی
    داخل هست. کافه و پارکینگ در بلوک‌های اطراف‌اند، پنج دقیقه پیاده تا میدان مرکزی.
  route: >-
    از تفلیس بزرگراه E60 را به غرب بگیرید: گوری، خاشوری، مقطع ریکوتی و زستافونی — ۲۳۰ کیلومتر، حدود سه
    ساعت و بیست دقیقه. در کوتایسی تابلوهای مرکز را دنبال کنید و در کرانهٔ چپ ریونی بمانید؛ موزه در خیابان
    پوشکین و چند بلوک با پل سفید فاصله دارد. پارک کنار خیابان در مرکز رایگان است اما در روز پر می‌شود، پس
    یک بلوک دورتر ایستادن آسان‌تر است. سوخت در زستافونی و ورودی کوتایسی هست. خودروی اقتصادی تمام سال کافی
    است.
he:
  name: המוזיאון ההיסטורי הממלכתי של קוטאיסי
  short: >-
    מוזיאון ניקו ברדזנישווילי, שבו נשמרת מלאכת הזהב שהובאה מגלאתי ומבגראטי.
  body: >-
    **לכאן הגיע אוצרן של כנסיות גאורגיה המערבית.** המוזיאון נוסד ב-1921–22 ושוכן בבניין הבנק הגאורגי לשעבר
    ברחוב פושקין, חמש דקות מן הכיכר המרכזית. האוסף מונה יותר מ-200 אלף פריטים, המוצגים בעשרה חדרים בשתי
    קומות.


    ציר הזמן נמתח מן המאה ה-9 לפני הספירה ועד שלהי ימי הביניים: ברונזות קולכיות, קרמיקה קלאסית, מטבעות
    רומיים וביזנטיים, כתבי יד, טקסטיל, עור ועץ. זהו התוכן הרגיל של מוזיאון אזורי טוב, בבחירה מוקפדת, אם
    כי השילוט בשפות זרות חלקי.


    הסיבה לבוא היא אוצר הזהב. כשנסגרו בגראטי וגלאתי בתקופה הסובייטית, הועברו לכאן איקוני הכסף המוקשים,
    צלבי התהלוכה, כריכות המתכת וכלי הפולחן שלהם. התוצאה היא כמה מאות שנים של צורפות גאורגית שנאספו לחדר
    אחד: איקונים מן המאות ה-10 עד ה-12 בכסף ובזהב מוקשים, שברי אמייל תאים וצלבים עם כתובות מקדישים. זה
    משלים ביקור בגלאתי — שם רואים את האדריכלות והפסיפס, כאן את מה שעמד פעם בתוך הכנסייה.


    באותו בניין נמצאת ספריית מחקר של כארבעים אלף כרכים וכתבי יד. בגאורגיה נחשב המוסד מרכז מדעי יותר מאשר
    אתר תיירות.


    הערה כנה אחת: חלק ניכר מן התצוגה מיושן — ויטרינות זכוכית, כרטיסים מודפסים, תאורה חלשה. מי שמחפש רק
    את השיאים ישהה חצי שעה באולם הזהב וילך; מי שמתעניין בהיסטוריה של האזור יישאר בקלות שעתיים.


    שני חלקים קטנים יותר ראויים לתשומת לב. ארון המטבעות עוקב אחר המטבע של מערב גאורגיה מן ההנפקות היווניות
    דרך פריטים ביזנטיים וסאסאניים ועד הטבעה גאורגית של ימי הביניים — שיעור תמציתי בשאלה מי סחר כאן ומתי.
    חדרי האתנוגרפיה מציגים פנים של בית אימרתי, כלי יין וכלי משק שנעלמו מן הכפרים בשני הדורות האחרונים.
  tip: >-
    שעה וחצי היא הקצאה סבירה. אוצר הזהב נשמר בנפרד ואיש צוות פותח אותו עבורכם, לכן בקשו זאת בקופה עם ההגעה
    ולא בסוף. השילוט באנגלית חלקי, ולכן מדריך או מדריך שמע עושים הבדל אמיתי. הצילום מוגבל בחלק מן החדרים.
    בבניין שתי קומות ואין מעלית. שירותים נמצאים בפנים. בתי קפה וחניה ברחובות הסמוכים, חמש דקות הליכה מן
    הכיכר המרכזית.
  route: >-
    מטביליסי נוסעים מערבה בכביש E60 דרך גורי, חשורי, מקטע ריקוטי וזסטפוני — 230 ק״מ, כשלוש שעות ועשרים
    דקות. בקוטאיסי עוקבים אחרי השילוט למרכז ונשארים בגדה השמאלית של הריוני; המוזיאון ברחוב פושקין, כמה
    בלוקים מן הגשר הלבן. החניה ברחוב במרכז חינם אך מתמלאת במשך היום, ולכן נוח לעצור בלוק אחד הלאה. דלק
    יש בזסטפוני ובכניסה לקוטאיסי. רכב חסכוני מספיק כל השנה.
ar:
  name: متحف كوتايسي التاريخي الحكومي
  short: >-
    متحف نيكو بردزينيشفيلي، الذي يحفظ أعمال الصياغة الذهبية المنقولة من غيلاتي وباغراتي.
  body: >-
    **إلى هنا انتهى كنز كنائس غرب جورجيا.** أُسّس المتحف عامي 1921–1922 ويشغل مبنى مصرف جورجيا السابق في
    شارع بوشكين، على بعد خمس دقائق من الساحة المركزية. تضم المجموعة أكثر من 200 ألف قطعة تُعرض في عشر قاعات
    على طابقين.


    يمتد التسلسل الزمني من القرن التاسع قبل الميلاد إلى أواخر العصر الوسيط: برونزيات كولخية، وفخار كلاسيكي،
    وعملات رومانية وبيزنطية، ومخطوطات، ومنسوجات وجلود وأخشاب. هذا هو المحتوى المعتاد لمتحف إقليمي جيد، منتقى
    بعناية، وإن كانت البطاقات باللغات الأجنبية غير مكتملة.


    أما سبب الزيارة فهو خزانة الذهب. فحين أُغلقت باغراتي وغيلاتي في العهد السوفييتي، نُقلت إلى هنا أيقوناتها
    المطروقة وصلبان المواكب وأغلفة الكتب المعدنية والأواني الطقسية. والنتيجة أن قروناً عدة من الصياغة الجورجية
    اجتمعت في قاعة واحدة: أيقونات من القرنين العاشر والثاني عشر في فضة وذهب مطروقين، وشذرات من المينا المقصورة،
    وصلبان تحمل نقوش الواقفين. وهذا يكمل زيارة غيلاتي: هناك ترى العمارة والفسيفساء، وهنا ترى ما كان يقف
    داخل الكنيسة.


    وفي المبنى نفسه مكتبة بحثية تضم نحو أربعين ألف مجلد ومخطوط. ويُنظر إلى المؤسسة في جورجيا بوصفها مركزاً
    علمياً أكثر منها محطة سياحية.


    ملاحظة صريحة: جزء كبير من العرض بأسلوب قديم — خزائن زجاجية وبطاقات مطبوعة وإضاءة ضعيفة. من يريد أبرز
    المقتنيات فقط سيقضي نصف ساعة في قاعة الذهب ويمضي؛ ومن يهتم بتاريخ المنطقة يبقى ساعتين بسهولة.


    قسمان أصغر يستحقان الوقوف. خزانة المسكوكات تتتبع نقد غرب جورجيا من الإصدارات اليونانية مروراً بالقطع
    البيزنطية والساسانية وصولاً إلى الضرب الجورجي الوسيط، وهو درس مركّز في من كان يتاجر هنا ومتى. أما قاعات
    الإثنوغرافيا فتضم داخل البيت الإيميريتي وأواني النبيذ وأدوات الزراعة التي اختفت من القرى خلال جيلين.
  tip: >-
    ساعة ونصف تخصيص معقول. تُحفظ خزانة الذهب على حدة ويفتحها لك أحد الموظفين، فاطلب ذلك عند شباك التذاكر
    فور وصولك لا في النهاية. البطاقات الإنجليزية جزئية، لذا يحدث المرشد أو الدليل الصوتي فرقاً حقيقياً.
    والتصوير مقيّد في بعض القاعات. المبنى من طابقين وبلا مصعد. توجد دورة مياه في الداخل. والمقاهي ومواقف
    السيارات في المربعات المجاورة، على بعد خمس دقائق سيراً من الساحة المركزية.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً عبر غوري وخاشوري ومقطع ريكوتي وزستافوني — 230 كم، نحو ثلاث ساعات وعشرين
    دقيقة. في كوتايسي اتبع لافتات المركز والزم الضفة اليسرى لنهر ريوني؛ فالمتحف في شارع بوشكين على بعد
    مربعات قليلة من الجسر الأبيض. الوقوف على جانب الشارع في المركز مجاني لكنه يمتلئ نهاراً، فالأسهل التوقف
    في مربع أبعد. الوقود متوفر في زستافوني وعند مدخل كوتايسي. وسيارة اقتصادية تكفي طوال العام.
