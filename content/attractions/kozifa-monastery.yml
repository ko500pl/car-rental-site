ka:
  name: ქოზიფის მონასტერი
  short: >-
    ძამის ხეობაში, მაღალ მთაზე, ერთ გალავანში ჩატეული VIII–XVI საუკუნეების ხუთი დარბაზული ეკლესია XIII
    საუკუნის მოხატულობით.
  body: >-
    **ხუთი ეკლესია, შვიდიოდე საუკუნე და ერთი მთა: ქოზიფის მონასტრის მშენებლებს ძველი არაფერი დაუნგრევიათ
    — ყოველ ახალ ეკლესიას წინა თაობის ნაშენს მიადგამდნენ.**


    კომპლექსი, რომელსაც ტყემლოვანისა და გუგომის სახელითაც იცნობენ, ძამის ხეობის ზემო წელში, სოფელ ტყემლოვანიდან
    დაახლოებით სამ კილომეტრზე, მაღალ მთაზე დგას. ყინწვისის შემდეგ ეს ხეობის უდიდესი სავანეა — და გაცილებით
    ნაკლებად ნანახი.


    კომპლექსი საგვარეულო ხესავით იკითხება. ორი უძველესი ეკლესია მის სამხრეთ ნაწილში დგას და სტილის მიხედვით
    VIII–IX საუკუნეებით თარიღდება: პატარებია, უხეშად დამუშავებული ქვით ნაგები, შიგნით დაბალი და ბნელი
    — მეორე ეკლესიას არც აფსიდის კონქი აქვს და არც სატრიუმფო თაღი. დიდი სამშენებლო ხანა XIII საუკუნეში
    დადგა: მაშინ აიგო ღვთისმშობლის ეკლესია — 17,85 × 7,85 მეტრი, კარგად გათლილი ბაზალტის კვადრებით — ხოლო
    საუკუნის ბოლო ათწლეულებში ნატეხი ქვის გალავანი შემოავლეს. XV–XVI საუკუნეებში კიდევ ორი ეკლესია ჩაეტია:
    ერთი ღვთისმშობლის ტაძრის მთელ დასავლეთ ფასადს ფარავს, მეორე ძველ კედლებს შორის კუთხეშია შეყუჟული.


    ღვთისმშობლის ეკლესიაში XIII საუკუნის მხატვრობაა შემორჩენილი: აფსიდის კონქში ვედრებაა — ქრისტე ღვთისმშობელსა
    და იოანე ნათლისმცემელს შორის, კედლებზე კი სრული ტანით გამოსახული მოციქულები და ეკლესიის მამები, რომელთა
    გრაგნილებზე ასომთავრული წარწერებია.


    ქოზიფის ნაწილი დღეს თბილისშია. ღვთისმშობლის ეკლესიის კანკელის ორი ჩუქურთმიანი ფილა და გალავნის აღმოსავლეთ
    „გარე ბჭის“ თაღი, რომლის ასომთავრული წარწერა მთავარი ტაძრის აშენებასა და შემკობაზე მოგვითხრობს, საქართველოს
    ეროვნულ მუზეუმში ინახება. რჩეული ნაწილები დედაქალაქში წავიდა; მთაზე კი ის დარჩა, რასაც ვერცერთი მუზეუმი
    ვერ დაიტევს — ხუთი ეკლესია, ერთმანეთზე მიყრდნობილი ისე, როგორც მათი ამშენებელი თაობები.
  tip: >-
    შესვლა უფასოა, მაგრამ მთაზე არაფერია — არც კაფე, არც მაღაზია, არც სასმელი წყალი. საჭმელი, წყალი და
    ფანარი თან წაიღეთ: უძველესი ეკლესიები შიგნით დაბალი და ბნელია. ავზი ქარელში აავსეთ — ძამის ხეობაში
    ბენზინგასამართი არ არის. მონასტერი დაახლოებით 1360 მეტრზე დგას, ამიტომ ზამთარში თოვლსა და ჩაკეტილ
    გზას მოელოდეთ; გონივრული სეზონი მაისიდან ოქტომბრამდეა, წვიმის შემდეგ კი ხრეში სრიალა ხდება. ვერ დავადასტურეთ,
    ცხოვრობენ თუ არა აქ ბერები, ამიტომ მოეპყარით მას, როგორც მოქმედ ეკლესიას, და შესაბამისად ჩაიცვით.
    საათნახევარი დაუთმეთ და იმავე გზაზე მძოვრეთის ციხეც ნახეთ.
  route: >-
    137 კმ, დაახლოებით 2 საათი და 30 წუთი. ს1 (E60) მაგისტრალით დასავლეთისკენ, მცხეთისა და გორის გავლით,
    ქარელის გასასვლელამდე იარეთ — მაგისტრალზე დაახლოებით 100 კილომეტრია. ქარელი გაიარეთ და შ134 გზას,
    ყინწვისის მონასტრის მიმართულებით, სამხრეთით, ძამის ხეობაში გაჰყევით. ახალი ასფალტი ხეობის დაახლოებით
    30-კილომეტრიანი გზის დიდ ნაწილს ფარავს; ბოლო რამდენიმე კილომეტრი ტყემლოვანამდე და მთამდე ხრეშიანი
    და გრუნტის გზაა. იქირავეთ მაღალი გამავლობის მანქანა: ბოლო მონაკვეთზე სიმძლავრეზე მეტად მანქანის ძირის
    სიმაღლე (კლირენსი) გადაწყვეტს. იმავე გზაზეა მძოვრეთის ციხეც, ასე რომ, ორივე ერთ დღეს მოინახულეთ. ხეობაში
    შესვლამდე ავზი სავსე უნდა გქონდეთ.
en:
  name: Kozifa Monastery
  short: >-
    Five hall churches from the 8th to the 16th century, packed inside one wall on a mountain in the Dzama
    gorge, with 13th-century frescoes.
  body: >-
    **Five churches, some seven centuries, one mountain: at Kozifa nobody tore anything down, each generation
    simply built its church against the last.**


    The complex, also called Tkemlovani or Gugomi, stands on a high mountain about three kilometres from
    the village of Tkemlovana, in the upper Dzama gorge south of Kareli. After Kintsvisi it is the largest
    religious site in the valley, and it sees far fewer visitors.


    Read it like a family tree. The two oldest churches, in the southern part of the complex, are dated
    by style to the 8th–9th century: small, built of roughly dressed stone, low and dark inside; the second
    has neither an apse conch nor a triumphal arch. The great building phase came in the 13th century
    with the Church of the Virgin, 17.85 by 7.85 metres of well-dressed basalt ashlar, and a rubble enclosure
    wall raised in that century's final decades. In the 15th–16th century two more churches were squeezed
    in: one covers the entire west façade of the Virgin church, the other is tucked into a corner between
    older walls.


    Inside the Church of the Virgin, 13th-century painting survives: a Deesis in the apse conch, Christ
    between the Virgin and John the Baptist, and full-length apostles and church fathers holding scrolls
    lettered in Asomtavruli.


    Part of Kozifa now lives in Tbilisi. Two carved chancel-screen slabs from the Virgin church and the
    inscribed arch of the eastern gate, whose text speaks of building and adorning the main church, are
    held by the Georgian National Museum. The finest pieces went to the capital; what stays on the mountain
    is the thing no museum could carry, five churches leaning on one another like the generations who
    built them.
  tip: >-
    Entry is free, but up on the mountain there is nothing: no café, shop or drinking water. Bring food,
    water and a torch, because the oldest churches are low and dark inside. Fill the tank in Kareli; there
    is no fuel in the Dzama valley. Kozifa stands at about 1,360 metres, so expect snow and a closed track
    in winter; May to October is the sensible window, and the gravel turns greasy after rain. We could
    not confirm whether monks live here, so treat it as a working church and dress modestly. Allow an
    hour and a half, and add Mdzovreti Fortress on the same road.
  route: >-
    137 km, about 2 hours 30 minutes. Take the S1 (E60) west past Mtskheta and Gori to the Kareli exit,
    about 100 km of motorway. Cross Kareli and follow the Sh134, the road towards Kintsvisi Monastery,
    south into the Dzama gorge. New asphalt now covers most of the roughly 30 km up the valley; the final
    few kilometres to Tkemlovana and the mountain are gravel and dirt track. Hire an SUV: on the last
    stretch ground clearance matters more than power. Mdzovreti Fortress lies on the same road, so the
    two make one day. Enter the valley with a full tank.
ru:
  name: Монастырь Козифа
  short: Пять зальных церквей VIII–XVI веков, собранных в одной ограде на горе в ущелье Дзамы, и росписи
    XIII века.
  body: >-
    **Пять церквей, около семи столетий, одна гора: в Козифе никто ничего не сносил — каждое поколение
    просто пристраивало свою церковь к предыдущей.**


    Комплекс, который называют также Ткемловани или Гугоми, стоит на высокой горе примерно в трёх километрах
    от села Ткемлована, в верховьях ущелья Дзамы к югу от Карели. После Кинцвиси это крупнейшая святыня
    долины, а гостей здесь куда меньше.


    Читайте его как родословное древо. Две древнейшие церкви в южной части комплекса по стилю датируют
    VIII–IX веками: маленькие, из грубо отёсанного камня, низкие и тёмные внутри; у второй нет ни конхи
    апсиды, ни триумфальной арки. Большой строительный этап пришёлся на XIII век — это церковь Богородицы,
    17,85 на 7,85 метра, из хорошо отёсанных базальтовых блоков, и ограда из бутового камня, возведённая
    в последние десятилетия того же столетия. В XV–XVI веках втиснули ещё две церкви: одна закрывает весь
    западный фасад церкви Богородицы, другая прячется в углу между старыми стенами.


    Внутри церкви Богородицы сохранилась живопись XIII века: Деисус в конхе апсиды — Христос между Богоматерью
    и Иоанном Крестителем — и апостолы и отцы церкви в полный рост со свитками, надписанными асомтаврули.


    Часть Козифы теперь живёт в Тбилиси. Две резные плиты алтарной преграды из церкви Богородицы и арка
    восточных ворот с надписью, говорящей о строительстве и украшении главного храма, хранятся в Национальном
    музее Грузии. Лучшее увезли в столицу; на горе осталось то, чего не унесёт ни один музей, — пять церквей,
    опирающихся друг на друга, как поколения, которые их строили.
  tip: >-
    Вход свободный, но на горе нет ничего: ни кафе, ни магазина, ни питьевой воды. Возьмите еду, воду
    и фонарик — древнейшие церкви внутри низкие и тёмные. Заправьтесь в Карели: в долине Дзамы бензина
    нет. Козифа стоит примерно на высоте 1360 метров, так что зимой ждите снега и закрытой дороги; разумное
    окно — с мая по октябрь, а после дождя гравий становится скользким. Мы не смогли выяснить, живут ли
    здесь монахи, поэтому относитесь к месту как к действующему храму и одевайтесь скромно. Заложите полтора
    часа и добавьте крепость Мдзоврети на той же дороге.
  route: >-
    137 км, около 2 часов 30 минут. Езжайте по S1 (E60) на запад мимо Мцхеты и Гори до съезда на Карели
    — это примерно 100 км по магистрали. Проезжайте через Карели и следуйте по Sh134, дороге к монастырю
    Кинцвиси, на юг в ущелье Дзамы. Бо́льшую часть примерно 30 км вверх по долине теперь покрывает новый
    асфальт; последние несколько километров до Ткемлованы и к горе — гравий и грунтовка. Берите внедорожник:
    на последнем отрезке клиренс важнее мощности. Крепость Мдзоврети стоит на той же дороге, так что оба
    места укладываются в один день. Въезжайте в долину с полным баком.
fa:
  name: صومعهٔ کوزیفا
  short: >-
    پنج کلیسای تک‌ناوه از سدهٔ هشتم تا شانزدهم، فشرده درون یک حصار بر کوهی در درهٔ دزاما، با نقاشی‌های
    دیواری سدهٔ سیزدهم.
  body: >-
    **پنج کلیسا، حدود هفت سده، یک کوه: در کوزیفا هیچ‌کس چیزی را ویران نکرد؛ هر نسل کلیسای خود را به کلیسای
    نسل پیش تکیه داد.**


    این مجموعه که تکملوانی یا گوگومی هم خوانده می‌شود، بر کوهی بلند در حدود سه کیلومتری روستای تکملوانا،
    در بالادست درهٔ دزاما و جنوب کارلی، ایستاده است. پس از کینتسویسی، بزرگ‌ترین مکان مذهبی این دره است
    و بازدیدکنندگانش بسیار کمترند.


    آن را مانند شجره‌نامه‌ای بخوانید. دو کلیسای کهن‌تر، در بخش جنوبی مجموعه، از روی سبک به سده‌های هشتم
    و نهم نسبت داده می‌شوند: کوچک، از سنگ زبر تراش‌خورده، کوتاه و تاریک در درون؛ دومی نه نیم‌گنبد محراب
    دارد و نه طاق نصرت. دورهٔ بزرگ ساخت‌وساز در سدهٔ سیزدهم فرا رسید، با کلیسای حضرت مریم به ابعاد ۱۷٫۸۵
    در ۷٫۸۵ متر از سنگ‌های بازالتی خوش‌تراش، و حصاری از سنگ‌لاشه که در دهه‌های پایانی همان سده برپا شد.
    در سده‌های پانزدهم و شانزدهم دو کلیسای دیگر هم به زور در این میان جا داده شد: یکی تمام نمای غربی کلیسای
    حضرت مریم را می‌پوشاند و دیگری در کنجی میان دیوارهای کهن‌تر جا گرفته است.


    درون کلیسای حضرت مریم، نقاشی‌های سدهٔ سیزدهم برجا مانده است: دئیسیس در نیم‌گنبد محراب، یعنی مسیح میان
    مریم عذرا و یحیای تعمیددهنده، و حواریون و پدران کلیسا در قامت کامل که طومارهایی با نوشته‌های آسومتاورولی
    در دست دارند.


    بخشی از کوزیفا اکنون در تفلیس است. دو تخته‌سنگ کنده‌کاری‌شده از دیوارهٔ محراب کلیسای حضرت مریم و طاق
    کتیبه‌دار دروازهٔ شرقی، که متنش از ساختن و آراستن کلیسای اصلی سخن می‌گوید، در موزهٔ ملی گرجستان نگهداری
    می‌شوند. بهترین قطعه‌ها به پایتخت رفتند؛ آنچه بر کوه مانده چیزی است که هیچ موزه‌ای نمی‌توانست ببرد:
    پنج کلیسا که همچون نسل‌هایی که آن‌ها را ساختند، به یکدیگر تکیه داده‌اند.
  tip: >-
    ورود رایگان است، اما بر کوه هیچ چیز نیست: نه کافه، نه مغازه و نه آب آشامیدنی. خوراک، آب و چراغ‌قوه
    بیاورید، چون کلیساهای کهن‌تر درونشان کوتاه و تاریک است. در کارلی باک را پر کنید؛ در درهٔ دزاما پمپ‌بنزین
    نیست. کوزیفا در ارتفاع حدود ۱۳۶۰ متری است، پس در زمستان منتظر برف و راهِ بسته باشید؛ از ماه مه تا
    اکتبر زمان معقول است، و شن‌ها پس از باران لیز می‌شوند. نتوانستیم تأیید کنیم که راهبانی اینجا زندگی
    می‌کنند یا نه، پس آن را کلیسایی فعال بدانید و پوشش مناسب داشته باشید. یک ساعت و نیم وقت بگذارید و
    قلعهٔ مدزوورتی را هم که بر همین جاده است بیفزایید.
  route: >-
    ۱۳۷ کیلومتر، حدود ۲ ساعت و ۳۰ دقیقه. جادهٔ S1 (E60) را به سمت غرب، از کنار متسختا و گوری تا خروجی
    کارلی بروید، حدود ۱۰۰ کیلومتر بزرگراه. از کارلی بگذرید و جادهٔ Sh134، راه صومعهٔ کینتسویسی، را رو
    به جنوب به درون درهٔ دزاما دنبال کنید. آسفالت نو اکنون بیشتر حدود ۳۰ کیلومترِ بالای دره را پوشانده
    است؛ چند کیلومتر آخر تا تکملوانا و کوه، شنی و خاکی است. خودروی شاسی‌بلند کرایه کنید: در تکهٔ آخر،
    فاصلهٔ کف خودرو از زمین مهم‌تر از قدرت موتور است. قلعهٔ مدزوورتی بر همین جاده است، پس هر دو در یک
    روز جا می‌گیرند. با باک پر وارد دره شوید.
he:
  name: מנזר קוזיפה
  short: >-
    חמש כנסיות אולם מן המאה השמינית עד המאה ה-16, צפופות בתוך חומה אחת על הר בערוץ הדזאמה, ובהן ציורי
    קיר מן המאה ה-13.
  body: >-
    **חמש כנסיות, כשבע מאות שנה, הר אחד: בקוזיפה איש לא הרס דבר; כל דור פשוט בנה את הכנסייה שלו צמוד לזו
    שקדמה לה.**


    המכלול, המכונה גם טקמלובני או גוגומי, עומד על הר גבוה כשלושה קילומטרים מן הכפר טקמלובנה, בערוץ הדזאמה
    העליון שמדרום לקארלי. אחרי קינצוויסי זהו האתר הדתי הגדול ביותר בעמק, ומבקרים בו הרבה פחות.


    קראו אותו כמו אילן יוחסין. שתי הכנסיות העתיקות ביותר, בחלקו הדרומי של המכלול, מתוארכות על פי סגנונן
    למאות השמינית והתשיעית: קטנות, בנויות אבן מסותתת בגסות, נמוכות וחשוכות מבפנים; לשנייה אין לא קונכיית
    אפסיס ולא קשת ניצחון. שלב הבנייה הגדול הגיע במאה ה-13 עם כנסיית מריה הבתולה, 17.85 על 7.85 מטרים של
    אבני גזית מבזלת מסותתת היטב, ועם חומת אבני גוויל שהוקמה בעשורים האחרונים של אותה מאה. במאות ה-15 וה-16
    נדחקו לכאן עוד שתי כנסיות: אחת מכסה את כל החזית המערבית של כנסיית הבתולה, והשנייה תקועה בפינה בין
    קירות ישנים יותר.


    בתוך כנסיית מריה הבתולה שרדו ציורי קיר מן המאה ה-13: דאיסיס בקונכיית האפסיס, ישו בין מריה ליוחנן המטביל,
    ושליחים ואבות הכנסייה בקומה מלאה, אוחזים מגילות כתובות באותיות אסומטוורולי.


    חלק מקוזיפה חי היום בטביליסי. שני לוחות מגולפים ממחיצת המזבח של כנסיית הבתולה והקשת נושאת הכתובת של
    השער המזרחי, שהטקסט שלה מספר על בנייתה ועיטורה של הכנסייה הראשית, שמורים במוזיאון הלאומי של גאורגיה.
    הפריטים הנאים ביותר הלכו לבירה; מה שנשאר על ההר הוא הדבר ששום מוזיאון לא יכול היה לשאת: חמש כנסיות
    הנשענות זו על זו, כמו הדורות שבנו אותן.
  tip: >-
    הכניסה חופשית, אבל על ההר אין כלום: לא בית קפה, לא חנות ולא מי שתייה. הביאו אוכל, מים ופנס, כי הכנסיות
    העתיקות נמוכות וחשוכות מבפנים. תדלקו בקארלי; בעמק הדזאמה אין דלק. קוזיפה נמצא בגובה של כ-1,360 מטרים,
    אז צפו לשלג ולדרך חסומה בחורף; מאי עד אוקטובר הם החלון הסביר, והחצץ נעשה חלקלק אחרי גשם. לא הצלחנו
    לברר אם חיים כאן נזירים, אז התייחסו למקום ככנסייה פעילה והתלבשו בצניעות. הקדישו שעה וחצי, והוסיפו
    את מבצר מדזוורטי שעל אותה דרך.
  route: >-
    137 ק"מ, כשעתיים וחצי. סעו מערבה בכביש S1 (E60) על פני מצחתה וגורי עד היציאה לקארלי, כ-100 ק"מ של
    כביש מהיר. חצו את קארלי והמשיכו בכביש Sh134, הדרך למנזר קינצוויסי, דרומה אל ערוץ הדזאמה. אספלט חדש
    מכסה היום את רוב כ-30 הקילומטרים במעלה העמק; הקילומטרים האחרונים עד טקמלובנה ואל ההר הם חצץ ודרך עפר.
    שכרו רכב שטח: בקטע האחרון מרווח הגחון חשוב יותר מכוח המנוע. מבצר מדזוורטי נמצא על אותה דרך, כך ששניהם
    נכנסים ליום אחד. היכנסו לעמק עם מיכל מלא.
ar:
  name: دير كوزيفا
  short: >-
    خمس كنائس ذات صحن واحد من القرن الثامن إلى السادس عشر، متراصّة داخل سور واحد على جبل في مضيق دزاما،
    بجداريات من القرن الثالث عشر.
  body: >-
    **خمس كنائس، ونحو سبعة قرون، وجبل واحد: في كوزيفا لم يهدم أحد شيئًا، بل بنى كل جيل كنيسته مستندة إلى
    كنيسة من سبقه.**


    يقوم المجمّع، المعروف أيضًا باسم تكيملوفاني أو غوغومي، على جبل عالٍ على بُعد نحو ثلاثة كيلومترات من
    قرية تكيملوفانا، في أعالي مضيق دزاما جنوبي كاريلي. وهو بعد كينتسفيسي أكبر موقع ديني في الوادي، غير
    أن زواره أقل بكثير.


    اقرأه كما تقرأ شجرة عائلة. فالكنيستان الأقدم، في الجزء الجنوبي من المجمّع، تُؤرَّخان بحسب طرازهما
    بالقرنين الثامن والتاسع: صغيرتان، مبنيّتان من حجر منحوت نحتًا خشنًا، منخفضتان ومعتمتان من الداخل؛
    وليس للثانية نصف قبة للحنية ولا قوس نصر. وجاءت مرحلة البناء الكبرى في القرن الثالث عشر بكنيسة السيدة
    العذراء، بأبعاد 17.85 في 7.85 متر من كتل البازلت المنحوتة بإتقان، وبسور من الحجر الغشيم أُقيم في العقود
    الأخيرة من ذلك القرن. وفي القرنين الخامس عشر والسادس عشر حُشرت كنيستان أخريان: إحداهما تغطي الواجهة
    الغربية لكنيسة العذراء بكاملها، والأخرى مدسوسة في زاوية بين جدران أقدم.


    وفي داخل كنيسة السيدة العذراء بقيت رسوم من القرن الثالث عشر: مشهد الديسيس في نصف قبة الحنية، أي المسيح
    بين العذراء ويوحنا المعمدان، ورسل وآباء كنيسة بكامل قاماتهم يحملون لفائف مكتوبة بخط الأسومتافرولي.


    وجزء من كوزيفا يعيش الآن في تبليسي. فلوحان منحوتان من حاجز الهيكل في كنيسة العذراء، وقوس البوابة الشرقية
    المنقوش الذي يتحدث نصّه عن بناء الكنيسة الرئيسية وتزيينها، محفوظة في المتحف الوطني الجورجي. ذهبت أنفس
    القطع إلى العاصمة؛ وما بقي على الجبل هو ما لا يستطيع متحف أن يحمله: خمس كنائس يتكئ بعضها على بعض،
    كالأجيال التي بنتها.
  tip: >-
    الدخول مجاني، لكن الجبل خالٍ من كل شيء: لا مقهى ولا متجر ولا ماء للشرب. احمل الطعام والماء ومصباحًا
    يدويًّا، فالكنائس الأقدم منخفضة ومعتمة من الداخل. املأ خزان الوقود في كاريلي؛ فلا وقود في وادي دزاما.
    تقع كوزيفا على ارتفاع نحو 1,360 مترًا، فتوقّع الثلج وطريقًا مغلقًا في الشتاء؛ والفترة المعقولة من
    أيار/مايو إلى تشرين الأول/أكتوبر، والحصى يصبح زلقًا بعد المطر. لم نتمكن من التأكد مما إذا كان يسكنه
    رهبان، فتعامل معه ككنيسة تُقام فيها الصلوات والبس لباسًا محتشمًا. خصّص ساعة ونصفًا، وأضِف قلعة مدزوفريتي
    الواقعة على الطريق نفسه.
  route: >-
    137 كم، نحو ساعتين و30 دقيقة. اسلك الطريق S1 (E60) غربًا متجاوزًا متسخيتا وغوري حتى مخرج كاريلي، أي
    نحو 100 كم على الطريق السريع. اعبر كاريلي واتبع الطريق Sh134، طريق دير كينتسفيسي، جنوبًا إلى مضيق
    دزاما. يغطّي الإسفلت الجديد الآن معظم الثلاثين كيلومترًا تقريبًا صعودًا في الوادي؛ أما الكيلومترات
    القليلة الأخيرة حتى تكيملوفانا والجبل فحصى ومسلك ترابي. استأجر سيارة دفع رباعي: ففي المقطع الأخير
    يهمّ ارتفاع الهيكل عن الأرض أكثر من قوة المحرك. قلعة مدزوفريتي على الطريق نفسه، فيجتمع الموقعان في
    يوم واحد. ادخل الوادي بخزان ممتلئ.
