ka:
  name: დიდი აბული
  short: >-
    3 301 მეტრის ჩამქრალი ვულკანი ფარავნის ტბის დასავლეთით: ჯიპის ბილიკის ბოლოდან ორსაათიანი სვლა და მწვერვალიდან
    ტბებით მოფენილი ზეგანი.
  body: >-
    **3 301 მეტრის სიმაღლის ჩამქრალი ვულკანი, დიდი აბული, სამხრეთ საქართველოს სახურავია.**


    მას დიდი ხნით ადრე დაინახავთ, ვიდრე მიუახლოვდებით: ფართო, შიშველი კონუსი ფარავნის ტბის დასავლეთით,
    ლავურ ზეგანზე აღმართულა. „დიდი“ იმიტომ ჰქვია, რომ დაბალ მეზობელს, პატარა აბულს, არ აერიოს — იმ მთას,
    რომლის კალთაზეც ბრინჯაოს ხანის კიკლოპური ციხე დგას. სომხურად მთას აბულს უწოდებენ.


    დიდი აბული მცირე კავკასიონის დიდი ხნის წინ ჩამქრალი სტრატოვულკანი და აბულ-სამსარის ქედის უმაღლესი
    მწვერვალია. ასვლა ტექნიკურ მომზადებას არ მოითხოვს: საქართველოს ტურიზმის ეროვნული ადმინისტრაციის ცნობით,
    მთის ძირამდე მაღალი გამავლობის მანქანით მიხვალთ, იქიდან კი მწვერვალამდე დაახლოებით ორი საათის სავალია.
    ჯილდოდ ისეთ ხედს მიიღებთ, რომელსაც საქართველოში ცოტა ადგილი შეედრება: ფარავანი, ტაბაწყური და უამრავი
    პატარა ტბა ზეგანზე ერთბაშად მოჩანს, დამსხვრეული სარკის ნატეხებივით.


    ეს მკაცრი მაღალმთაა. საშუალო წლიური ტემპერატურა 5,3 °C-ია; ზაფხულში წვიმა იშვიათია, მაგრამ თუ მოვიდა,
    ჭექა-ქუხილითა და სეტყვით მოდის, ამინდი კი დღეში რამდენჯერმე იცვლება. ზამთარი ქარბუქს, ნისლს, გაყინულ
    ტბებსა და მგლების ყმუილს მოიტანს.


    ივლისის მოწმენდილ დილით ამოდით — შუადღისთვის ქვემოთ ტბები ვერცხლისფრიდან ტყვიისფრად იქცევა, კონუსზე
    კი ღრუბლები შეიკრიბება.
  tip: >-
    მარტო და უმზადებლად ნუ წახვალთ. ჩვენ ვერ დავადასტურეთ, არსებობს თუ არა აქ მონიშნული ბილიკი ან საყოველთაოდ
    ცნობილი საწყისი წერტილი, ამიტომ ნინოწმინდაში ან ახალქალაქში ჯიპიანი ადგილობრივი მძღოლი დაიქირავეთ,
    ან გზის მცოდნე გიდს გაჰყევით. გზას ადრე დაადექით: ზაფხულის ქარიშხალი სწრაფად მოდის, სეტყვითა და ელვით,
    შიშველი მწვერვალი კი მასთან შესახვედრად ყველაზე ცუდი ადგილია. წყალი, საჭმელი, ქარგაუმტარი და თბილი
    ტანსაცმელი, ოფლაინ რუკა წაიღეთ და ვინმეს თქვენი გეგმა აცნობეთ. მხოლოდ ივნისიდან სექტემბრამდე; დანარჩენ
    დროს მთაზე თოვლია.
  route: >-
    თბილისიდან შ36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ შ31-ით ზეგნის გადაღმა წალკამდე იარეთ, იქიდან
    კი სამხრეთით, ფარავნის ტბის გასწვრივ, ნინოწმინდისკენ — თითქმის მთელ გზაზე განახლებული ასფალტია. მთის
    ძირამდე ბოლო მონაკვეთი სოფლის ხრეშიან გზებსა და ოღროჩოღრო ჯიპის ბილიკზე გადის; სულ, იქამდე, სადაც
    საჭეს ფეხით სვლა ცვლის, დაახლოებით 190 კილომეტრი და 4 საათი და 15 წუთია. ეს მაღალი გამავლობის მანქანის
    ტერიტორიაა: ბოლო ბილიკს კროსოვერი ვერ გაუძლებს, წვიმაში კი ის ტალახად იქცევა. საწვავი წალკაში ან ნინოწმინდაში
    ჩაასხით — შემდეგ არაფერია.
en:
  name: Didi Abuli
  short: >-
    The extinct 3,301 m volcano west of Lake Paravani: two hours on foot from the end of a 4x4 track to
    a summit above a plateau scattered with lakes.
  body: >-
    **At 3,301 metres, the extinct volcano of Didi Abuli is the roof of southern Georgia.**


    You see it long before you reach it: a broad, bare cone rising above the lava plateau west of Lake
    Paravani. It is called Didi, 'great', to tell it apart from its lower neighbour, Patara Abuli, on
    whose slope stands a Bronze Age cyclopean fortress. In Armenian the mountain is simply Abul.


    Didi Abuli is a long-extinct stratovolcano of the Lesser Caucasus and the highest summit of the Abul-Samsari
    range. The ascent is not technical: according to the national tourism administration, an off-road
    vehicle can reach the foot of the mountain, and from there the summit is about two hours on foot.
    The reward is a view few places in Georgia can match, with Paravani, Tabatskuri and a crowd of smaller
    lakes spread across the plateau at once, like pieces of a broken mirror.


    This is hard high country. The average annual temperature is 5.3°C; summer rain is rare, but when
    it comes it brings thunder and hail, and the weather can turn several times a day. Winter brings blizzards,
    fog, frozen lakes and the howling of wolves.


    Come on a clear July morning, and by noon the lakes below may have turned from silver to slate as
    the clouds build over the cone.
  tip: >-
    Do not go alone or on a whim. We have not been able to confirm a waymarked trail or a standard trailhead,
    so hire a local driver with a 4x4 in Ninotsminda or Akhalkalaki, or go with a guide who knows the
    tracks. Start early: summer storms arrive fast with hail and lightning, and a bare summit is the worst
    place to meet one. Carry water, food, a windproof, a warm layer and an offline map, and tell someone
    your plan. June to September only; the rest of the year the mountain is under snow.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi, then the Sh31 over the plateau to Tsalka,
    and continue south along Lake Paravani towards Ninotsminda, on rebuilt asphalt nearly all the way.
    The final stretch to the foot of the mountain runs on gravel village roads and a rough 4x4 track;
    reckon on about 190 km and 4 hours 15 minutes to the point where driving gives way to walking. This
    is off-road territory: a crossover will not cope with the last track, which turns to mud in rain.
    Fill up in Tsalka or Ninotsminda; there is nothing beyond.
ru:
  name: Диди-Абули
  short: >-
    Потухший вулкан высотой 3301 м к западу от озера Паравани: два часа пешком от конца внедорожной колеи
    до вершины над плато, усыпанным озёрами.
  body: >-
    **Потухший вулкан Диди-Абули высотой 3301 метр — крыша южной Грузии.**


    Его видно задолго до того, как вы к нему подъедете: широкий голый конус над лавовым плато к западу
    от озера Паравани. Его называют Диди, «большой», чтобы отличать от более низкого соседа, Патара-Абули,
    на склоне которого стоит циклопическая крепость бронзового века. По-армянски гора зовётся просто Абул.


    Диди-Абули — давно потухший стратовулкан Малого Кавказа и высшая точка Абул-Самсарского хребта. Восхождение
    не требует альпинистской техники: по данным Национальной администрации туризма Грузии, внедорожник
    доезжает до подножия, а оттуда до вершины около двух часов пешком. Награда — вид, с которым мало что
    в Грузии может сравниться: Паравани, Табацкури и множество озёр поменьше разом раскинуты по плато,
    словно осколки разбитого зеркала.


    Это суровое высокогорье. Среднегодовая температура — 5,3°C; летние дожди редки, но если уж приходят,
    то с грозой и градом, а погода может меняться по нескольку раз за день. Зима приносит метели, туманы,
    замёрзшие озёра и вой волков.


    Приезжайте ясным июльским утром — к полудню озёра внизу из серебряных станут свинцовыми, а над конусом
    соберутся облака.
  tip: >-
    Не ходите в одиночку и не отправляйтесь сюда по наитию. Нам не удалось подтвердить ни маркированную
    тропу, ни стандартную точку старта, поэтому наймите в Ниноцминде или Ахалкалаки местного водителя
    с внедорожником или идите с проводником, который знает дороги. Выходите рано: летние грозы налетают
    быстро, с градом и молниями, а голая вершина — худшее место, чтобы встретить грозу. Возьмите воду,
    еду, ветровку, тёплый слой одежды и офлайн-карту и сообщите кому-нибудь свой план. Только с июня по
    сентябрь; в остальное время гора под снегом.
  route: >-
    Из Тбилиси поезжайте по Sh36 через Коджори и Манглиси, затем по Sh31 через плато до Цалки и дальше
    на юг вдоль озера Паравани в сторону Ниноцминды — почти везде по обновлённому асфальту. Последний
    отрезок до подножия горы идёт по гравийным сельским дорогам и разбитой внедорожной колее; до точки,
    где езда сменяется ходьбой, закладывайте около 190 км и 4 часа 15 минут. Это территория бездорожья:
    кроссовер не справится с последней колеёй, которая в дождь превращается в грязь. Заправьтесь в Цалке
    или Ниноцминде — дальше ничего нет.
fa:
  name: دیدی آبولی
  short: >-
    آتشفشان خاموش ۳,۳۰۱ متری در غرب دریاچهٔ پاراوانی: دو ساعت پیاده‌روی از انتهای راه خاکیِ ۴×۴ تا قله‌ای
    بر فراز فلاتی که دریاچه‌ها در آن پراکنده‌اند.
  body: >-
    **آتشفشان خاموش دیدی آبولی، با ۳,۳۰۱ متر بلندی، بام جنوب گرجستان است.**


    پیش از آنکه به آن برسید، از دور پیداست: مخروطی پهن و برهنه که بر فراز فلات گدازه‌ای غرب دریاچهٔ پاراوانی
    سر برافراشته است. آن را «دیدی» یعنی «بزرگ» می‌نامند تا از همسایهٔ کوتاه‌ترش، پاتارا آبولی، متمایز
    شود؛ کوهی که بر دامنه‌اش دژی سیکلوپی از عصر مفرغ ایستاده است. در ارمنی این کوه را تنها «آبول» می‌خوانند.


    دیدی آبولی آتشفشانی چینه‌ای (استراتوولکان) از قفقاز کوچک است که دیرزمانی است خاموش شده، و بلندترین
    قلهٔ رشته‌کوه آبول-سامساری است. صعود فنی نیست: به گفتهٔ سازمان ملی گردشگری گرجستان، خودروی آفرود تا
    پای کوه می‌رسد و از آنجا تا قله حدود دو ساعت پیاده‌روی است. پاداش، منظره‌ای است که کمتر جایی در گرجستان
    همتای آن است: پاراوانی، تاباتسکوری و انبوهی از دریاچه‌های کوچک‌تر، همه با هم بر پهنهٔ فلات گسترده‌اند،
    چون تکه‌های آینه‌ای شکسته.


    این سرزمینی مرتفع و سخت است. میانگین دمای سالانه ۵٫۳ درجهٔ سانتی‌گراد است؛ باران تابستانی کمیاب است،
    اما وقتی می‌بارد رعد و تگرگ می‌آورد، و هوا ممکن است چند بار در روز دگرگون شود. زمستان کولاک، مه، دریاچه‌های
    یخ‌زده و زوزهٔ گرگ‌ها را با خود می‌آورد.


    در صبحی صاف از ماه ژوئیه بیایید؛ تا نیمروز دریاچه‌های پایین از نقره‌ای به سربی می‌گرایند و ابرها بر
    فراز مخروط گرد می‌آیند.
  tip: >-
    تنها و بی‌برنامه نروید. ما نتوانسته‌ایم وجود مسیری نشانه‌گذاری‌شده یا نقطهٔ شروعی مشخص را تأیید کنیم،
    پس در نینوتسمیندا یا آخالکالاکی رانندهٔ محلی با خودروی ۴×۴ کرایه کنید یا با راهنمایی بروید که راه‌ها
    را می‌شناسد. زود راه بیفتید: توفان‌های تابستانی با تگرگ و آذرخش سریع از راه می‌رسند، و قلهٔ برهنه
    بدترین جا برای رویارویی با آنهاست. آب، خوراک، بادگیر، یک لایهٔ لباس گرم و نقشهٔ آفلاین بردارید و برنامه‌تان
    را به کسی بگویید. فقط از ژوئن تا سپتامبر؛ باقی سال کوه زیر برف است.
  route: >-
    از تفلیس Sh36 را از راه کوجوری و مانگلیسی بگیرید، سپس Sh31 را از روی فلات تا تسالکا، و در امتداد دریاچهٔ
    پاراوانی به جنوب، به سوی نینوتسمیندا ادامه دهید؛ تقریباً سراسر روی آسفالت نوسازی‌شده. بخش پایانی تا
    پای کوه از جاده‌های شنی روستایی و راهی ناهموار ویژهٔ ۴×۴ می‌گذرد؛ تا جایی که رانندگی جای خود را به
    پیاده‌روی می‌دهد، حدود ۱۹۰ کیلومتر و ۴ ساعت و ۱۵ دقیقه حساب کنید. اینجا قلمرو آفرود است: کراس‌اوور
    از پس آخرین تکهٔ راه، که در باران به گل‌ولای بدل می‌شود، برنمی‌آید. در تسالکا یا نینوتسمیندا باک را
    پر کنید؛ پس از آن هیچ نیست.
he:
  name: דידי אבולי
  short: 'הר הגעש הכבוי בגובה 3,301 מ'' ממערב לאגם פרוואני: שעתיים ברגל מקצה דרך רכבי השטח אל פסגה מעל
    רמה זרועה אגמים.'
  body: >-
    **בגובה 3,301 מטר, הר הגעש הכבוי דידי אבולי הוא גג דרום גאורגיה.**


    רואים אותו הרבה לפני שמגיעים אליו: חרוט רחב וחשוף המתנשא מעל רמת הלבה שממערב לאגם פרוואני. הוא נקרא
    "דידי", "הגדול", כדי להבדילו משכנו הנמוך יותר, פטרה אבולי, שעל מדרונו עומד מבצר קיקלופי מתקופת הברונזה.
    בארמנית ההר נקרא פשוט אבול.


    דידי אבולי הוא הר געש שכבתי בקווקז הקטן, כבוי מזה זמן רב, והפסגה הגבוהה ביותר ברכס אבול-סמסרי. העלייה
    אינה טכנית: לפי רשות התיירות הלאומית של גאורגיה, רכב שטח יכול להגיע עד רגלי ההר, ומשם הפסגה במרחק
    של כשעתיים הליכה. הגמול הוא תצפית שמעט מקומות בגאורגיה משתווים לה: פרוואני, טבאצקורי והמון אגמים קטנים
    יותר פרושים על פני הרמה בבת אחת, כמו רסיסי מראה שבורה.


    זהו אזור גבוה וקשוח. הטמפרטורה השנתית הממוצעת היא 5.3°C; גשמי קיץ נדירים, אבל כשהם באים הם מביאים
    רעמים וברד, ומזג האוויר יכול להתהפך כמה פעמים ביום. החורף מביא סופות שלג, ערפל, אגמים קפואים ויללות
    זאבים.


    בואו בבוקר בהיר של יולי, ועד הצהריים יהפכו האגמים שלמטה מכסופים לאפורים כעופרת, כשהעננים מצטברים מעל
    החרוט.
  tip: >-
    אל תצאו לבד או מתוך גחמה. לא הצלחנו לאמת שיש שביל מסומן או נקודת מוצא מקובלת, לכן שכרו נהג מקומי עם
    רכב שטח בנינוצמינדה או באחלקלקי, או צאו עם מדריך שמכיר את הדרכים. צאו מוקדם: סופות קיץ מגיעות מהר
    עם ברד וברקים, ופסגה חשופה היא המקום הגרוע ביותר להיתקל באחת כזו. קחו מים, אוכל, מעיל רוח, שכבת לבוש
    חמה ומפה לא מקוונת, וספרו למישהו על התוכנית שלכם. רק מיוני עד ספטמבר; בשאר השנה ההר מכוסה שלג.
  route: >-
    מטביליסי קחו את כביש Sh36 דרך קוג'ורי ומנגליסי, ואז את Sh31 על פני הרמה עד צלקה, והמשיכו דרומה לאורך
    אגם פרוואני לכיוון נינוצמינדה, על אספלט משודרג כמעט כל הדרך. הקטע האחרון עד רגלי ההר עובר בדרכי חצץ
    כפריות ובדרך משובשת לרכבי שטח; חשבו על כ-190 ק"מ ו-4 שעות ורבע עד הנקודה שבה הנהיגה מפנה מקום להליכה.
    זהו שטח לרכבי שטח: קרוסאובר לא יעמוד בדרך האחרונה, שהופכת לבוץ בגשם. תדלקו בצלקה או בנינוצמינדה; מעבר
    להן אין כלום.
ar:
  name: ديدي أبولي
  short: >-
    البركان الخامد بارتفاع 3,301 م غرب بحيرة بارافاني: ساعتان سيرًا من نهاية مسار الدفع الرباعي إلى قمة
    تشرف على هضبة تتناثر فيها البحيرات.
  body: >-
    **على ارتفاع 3,301 متر، البركان الخامد ديدي أبولي هو سقف جنوب جورجيا.**


    تراه قبل أن تبلغه بزمن طويل: مخروطًا عريضًا أجرد يرتفع فوق هضبة الحمم غرب بحيرة بارافاني. يُسمّى «ديدي»،
    أي «الكبير»، تمييزًا له عن جاره الأدنى باتارا أبولي، الذي تقوم على سفحه قلعة سيكلوبية من العصر البرونزي.
    وفي الأرمنية يُدعى الجبل ببساطة أبول.


    ديدي أبولي بركان طبقي من القوقاز الصغير خمد منذ زمن بعيد، وهو أعلى قمة في سلسلة أبول-سامساري. الصعود
    لا يتطلب مهارات تسلق تقنية: فبحسب الإدارة الوطنية للسياحة في جورجيا، تستطيع سيارة الطرق الوعرة بلوغ
    سفح الجبل، ومن هناك تبعد القمة نحو ساعتين سيرًا. والمكافأة مشهد قلّما يضاهيه مكان في جورجيا: بارافاني
    وتاباتسكوري وحشد من البحيرات الأصغر منبسطة على الهضبة دفعة واحدة، كشظايا مرآة مكسورة.


    هذه أرض مرتفعة قاسية. متوسط الحرارة السنوي 5.3°C؛ أمطار الصيف نادرة، لكنها حين تهطل تأتي بالرعد والبَرَد،
    وقد يتقلب الطقس مرات عدة في اليوم الواحد. ويجلب الشتاء العواصف الثلجية والضباب والبحيرات المتجمدة
    وعواء الذئاب.


    تعالَ في صباح صافٍ من يوليو، وبحلول الظهيرة ستكون البحيرات في الأسفل قد تحوّلت من الفضي إلى لون الرصاص،
    فيما تتجمّع الغيوم فوق المخروط.
  tip: >-
    لا تذهب وحدك ولا بدافع نزوة عابرة. لم نتمكن من التحقق من وجود درب معلَّم أو نقطة انطلاق معتادة، فاستأجر
    سائقًا محليًا بسيارة دفع رباعي في نينوتسميندا أو أخالكالاكي، أو اصطحب دليلًا يعرف المسالك. انطلق باكرًا:
    عواصف الصيف تصل سريعًا بالبَرَد والبرق، والقمة الجرداء أسوأ مكان لملاقاتها. احمل الماء والطعام وسترة
    واقية من الريح وطبقة ملابس دافئة وخريطة تعمل دون اتصال، وأخبر أحدًا بخطتك. من يونيو إلى سبتمبر فقط؛
    ففي بقية العام يكسو الثلج الجبل.
  route: >-
    من تبليسي خذ Sh36 عبر كوجوري ومانغليسي، ثم Sh31 عبر الهضبة إلى تسالكا، وتابع جنوبًا بمحاذاة بحيرة
    بارافاني نحو نينوتسميندا، على أسفلت مُجدَّد في معظم الطريق. أما المقطع الأخير حتى سفح الجبل فيمر بطرق
    قروية حصوية ومسار وعر للدفع الرباعي؛ احسب نحو 190 كم و4 ساعات و15 دقيقة حتى النقطة التي تُفسح فيها
    القيادة المجال للمشي. هذه أرض الطرق الوعرة: لن تقوى سيارة الكروس أوفر على المسار الأخير الذي يتحول
    إلى وحل في المطر. تزوّد بالوقود في تسالكا أو نينوتسميندا؛ فلا شيء بعدهما.
