ka:
  name: ვალეს ღვთისმშობლის ეკლესია
  short: >-
    X საუკუნის ტაძარი, XVI საუკუნეში ბაზილიკად გადაკეთებული, ორი დამწერლობის ქართული წარწერებით — სასაზღვრო
    ქალაქის მშვიდი გული.
  body: >-
    **ვალეში ერთსა და იმავე ღვთისმშობელს ორი ეკლესია ეძღვნება, ერთმანეთისგან სულ რამდენიმე ნაბიჯზე — და
    უფროსი მათგანი ამ სასაზღვრო ხეობაში ათას წელზე მეტია დგას.**


    ქალაქის დასავლეთ ნაწილში მდგარი ღვთისმშობლის ტაძარი X საუკუნის ბოლო მეოთხედში აუგიათ, XVI საუკუნეში
    კი სამნავიან ბაზილიკად გადაუკეთებიათ — სწორედ ეს სახე აქვს დღესაც. ტაძარი ეროვნული მნიშვნელობის ძეგლია;
    მის კედლებზე ასომთავრული და მხედრული წარწერებია შემორჩენილი — ორი დამწერლობა, ორი ეპოქის ხელწერა ერთ
    შენობაზე.


    სიდიადეს ნუ მოელით. ეს პატარა, ყოფილი სამთო ქალაქის ეკლესიაა და მისი ხიბლი მშვიდია: ქვის წყობა, წარწერები
    და ისტორია, რომელიც ირგვლივ ტრიალებს. XVI საუკუნის ბოლოდან 1829 წლამდე სამცხე ოსმალეთის ხელში იყო.
    1595 წლის ოსმალურ დავთარში ვალე ნაჰიეს ცენტრად არის ჩაწერილი, 59 ქართული კომლით — ზოგიერთი მათგანის
    სახელიც კია შემონახული: ვარძელა ილარიონისძე, რევაზა დათუნასძე, აზარია მღვდელი. თესდნენ ხორბალს, ქერს,
    ფეტვს, მუხუდოსა და ოსპს, ედგათ ვენახი, უვლიდნენ ფუტკარსა და ცხვარს.


    XVII საუკუნეში აქ კათოლიკე ქართველთა თემი ჩამოყალიბდა; 1757 წელს ვალეში 150 კათოლიკე და ერთი მღვდელი
    ცხოვრობდა. მათი ღვთისმშობლის შობის ეკლესია, 1862 წელს აგებული, ძველ ტაძართან ახლოს დგას, ქალაქში კი
    XIX–XX საუკუნეების მიჯნაზე აგებული მეჩეთიც შემორჩა. საბჭოთა ხანაში სოფელი მურა ნახშირის მოპოვებამ
    გაზარდა და 1962 წელს ქალაქის სტატუსიც მიიღო, მაგრამ მაღაროები 1980-იან წლებში დაიხურა.


    ვალეს მთელი ისტორია ერთ მოკლე სეირნობაში ეტევა — ოღონდ ნელა უნდა იაროთ.
  tip: >-
    შესვლა უფასოა. შესაძლოა, კარი დაკეტილი დაგხვდეთ — ასეთ შემთხვევაშიც ღირს ტაძრისთვის აუჩქარებლად შემოვლა
    და წარწერების დათვალიერება. ჩაიცვით ისე, როგორც ნებისმიერ მართლმადიდებლურ ტაძარში: მხრები და მუხლები
    დაფარული, ქალებს — თავსაფარი. ნახევარი საათი საკმარისია, მეტი — თუ ახლომდებარე კათოლიკურ ეკლესიასაც
    მოძებნით. ვალეში სოფლური მაღაზიების მეტი არაფერია, ამიტომ ისადილეთ და საწვავი ჩაასხით თორმეტი კილომეტრის
    მოშორებით, ახალციხეში, და იმავე დღეს რაბათის ციხე ან საფარის მონასტერიც მოინახულეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დაახლოებით 120 კილომეტრი იარეთ ხაშურის გასაყრელამდე, შემდეგ ს8 გზით
    ბორჯომის ხეობის გავლით ახალციხემდე. იგივე ს8 ახალციხიდან სამხრეთ-დასავლეთისკენ კიდევ 12 კილომეტრით
    გრძელდება ვალემდე — სულ 218 კილომეტრი და დაახლოებით 3 საათი და 30 წუთი. მთელ გზაზე ასფალტია, თუმცა
    ახალციხის შემდეგ გზა ვიწროვდება და მოძრაობა ნელდება. საწვავი ახალციხეში ჩაასხით. ეკონომკლასის ნებისმიერი
    მანქანა გამოდგება. გზა ქალაქის იქით, თურქეთის საზღვრის გამშვებ პუნქტამდე გრძელდება — ის არ დაგჭირდებათ:
    ტაძარი ვალეს დასავლეთ ნაწილშია და, სადაც არ უნდა გააჩეროთ, ფეხით ახლოა.
en:
  name: Church of the Theotokos, Vale
  short: >-
    A 10th-century church remade as a basilica in the 16th, its walls carrying Georgian inscriptions in
    two scripts — the quiet core of a border town.
  body: >-
    **In Vale two churches honour the same Mother of God a short walk apart, and the older one has stood
    in this border valley for more than a thousand years.**


    The Church of the Theotokos, in the western part of town, was founded in the last quarter of the 10th
    century and remodelled in the 16th as a three-nave basilica — the shape that still stands today. It
    is listed as a monument of national significance, and its walls keep inscriptions in two Georgian
    scripts, the old capital asomtavruli and the later mkhedruli: two alphabets, two eras' handwriting
    on a single building.


    Don't expect grandeur. This is the church of a small former mining town, and its interest is quiet:
    the stonework, the letters, and the history pressing in around it. From the late 16th century until
    1829 Samtskhe was Ottoman land. An Ottoman register of 1595 records Vale as the centre of a district
    with 59 Georgian households, and even keeps some of their names — Vardzela son of Ilarion, Revaza
    son of Datuna, Azaria the priest. They sowed wheat, barley, millet, chickpeas and lentils, tended
    vines, and kept bees and sheep.


    In the 17th century a community of Catholic Georgians took root here; by 1757 Vale had 150 Catholics
    and a priest. Their Church of the Nativity of the Theotokos, built in 1862, stands close to the old
    church, and a mosque from the turn of the 20th century also survives in town. In Soviet times lignite
    mining turned the village into a town — it gained town status in 1962 — but the mines closed in the
    1980s.


    Vale's whole history fits into one short walk, provided you walk it slowly.
  tip: >-
    Entry is free. You may find the door locked; if so, the walls and their inscriptions still repay an
    unhurried circuit outside. Dress as for any Orthodox church: shoulders and knees covered, a headscarf
    for women. Half an hour is enough — longer if you also look for the Catholic church nearby. Vale offers
    little beyond village shops, so eat and refuel in Akhaltsikhe, twelve kilometres back, and pair the
    stop with Rabati Castle or Sapara Monastery the same day.
  route: >-
    From Tbilisi take the S1 (E60) west for about 120 km to the Khashuri junction, then the S8 south through
    the Borjomi gorge to Akhaltsikhe. The same S8 carries on 12 km south-west to Vale — 218 km and about
    3 h 30 min in all, asphalt the whole way, though narrower and slower after Akhaltsikhe. Fuel up in
    Akhaltsikhe. Any economy car will do. The road continues beyond the town to the Turkish border crossing;
    you won't need it — the church stands in Vale's western part, a short walk from wherever you park.
ru:
  name: Церковь Богородицы, Вале
  short: >-
    Храм X века, перестроенный в XVI веке в базилику, с грузинскими надписями на стенах, выполненными
    двумя видами письма — тихое сердце приграничного городка.
  body: >-
    **В Вале две церкви в нескольких шагах друг от друга посвящены одной и той же Богородице, и старшая
    из них стоит в этой приграничной долине больше тысячи лет.**


    Церковь Богородицы в западной части города основана в последней четверти X века, а в XVI веке перестроена
    в трёхнефную базилику — такой вы её и видите сегодня. Она внесена в список памятников национального
    значения, а на её стенах сохранились надписи двумя видами грузинского письма — древним уставным асомтаврули
    и более поздним мхедрули: два алфавита, почерк двух эпох на одном здании.


    Не ждите величия. Это церковь маленького бывшего шахтёрского городка, и интерес её негромкий: каменная
    кладка, буквы и история, обступившая храм со всех сторон. С конца XVI века до 1829 года Самцхе была
    османской землёй. Османский реестр 1595 года называет Вале центром округа с 59 грузинскими дворами
    и даже сохраняет некоторые имена — Вардзела, сын Илариона; Реваза, сын Датуны; священник Азария. Они
    сеяли пшеницу, ячмень, просо, нут и чечевицу, растили виноград, держали пчёл и овец.


    В XVII веке здесь укоренилась община грузин-католиков; к 1757 году в Вале насчитывалось 150 католиков
    и был свой священник. Их церковь Рождества Богородицы, построенная в 1862 году, стоит неподалёку от
    старой, а в городе сохранилась и мечеть рубежа XIX–XX веков. В советское время добыча бурого угля
    превратила село в город — статус города Вале получил в 1962 году, — но в 1980-х шахты закрылись.


    Вся история Вале умещается в одну короткую прогулку — если идти не спеша.
  tip: >-
    Вход свободный. Дверь может оказаться запертой; тогда просто неспешно обойдите храм снаружи — стены
    и надписи того стоят. Одевайтесь как для любой православной церкви: плечи и колени закрыты, женщинам
    — платок. Получаса хватит, чуть больше — если захотите разыскать и католическую церковь поблизости.
    В Вале, кроме сельских магазинов, почти ничего нет, так что поешьте и заправьтесь в Ахалцихе, в двенадцати
    километрах позади, а в тот же день загляните в крепость Рабати или монастырь Сапара.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 120 км до развязки у Хашури, затем по S8 на юг через Боржомское
    ущелье до Ахалцихе. Та же S8 уходит дальше, на 12 км к юго-западу, до Вале — всего 218 км и около
    3 ч 30 мин, асфальт на всём пути, хотя после Ахалцихе дорога уже и медленнее. Заправьтесь в Ахалцихе.
    Подойдёт любой автомобиль эконом-класса. За городом дорога продолжается к пункту пропуска на турецкой
    границе; он вам не понадобится — церковь стоит в западной части Вале, в нескольких минутах ходьбы
    от любого места, где вы оставите машину.
fa:
  name: کلیسای مادر خدا (تئوتوکوس)، واله
  short: >-
    کلیسایی از سدهٔ ۱۰ که در سدهٔ ۱۶ به بازیلیکا بدل شد و بر دیوارهایش کتیبه‌هایی گرجی به دو خط مانده
    است؛ هستهٔ آرامِ شهری مرزی.
  body: >-
    **در واله دو کلیسا، تنها چند قدم دور از هم، به همان مادر خدا تقدیم شده‌اند، و کهن‌ترِ آن دو بیش از
    هزار سال است که در این درهٔ مرزی ایستاده است.**


    کلیسای مادر خدا، در بخش غربی شهر، در ربع آخر سدهٔ ۱۰ بنیان نهاده شد و در سدهٔ ۱۶ به شکل بازیلیکایی
    سه‌شبستانی بازسازی شد؛ همان شکلی که امروز پیداست. این بنا اثری با اهمیت ملی شناخته شده و بر دیوارهایش
    کتیبه‌هایی به دو خط گرجی برجا مانده است: آسومتاورولی، خط کهنِ حروف درشت، و مخدرولیِ متأخرتر؛ دو الفبا،
    دستخط دو دوران بر یک بنا.


    انتظار شکوه نداشته باشید. این کلیسای شهرکی کوچک است که روزگاری معدنی بود، و جذابیتش آرام است: سنگ‌کاری،
    حروف، و تاریخی که از هر سو گردش را گرفته است. از اواخر سدهٔ ۱۶ تا سال ۱۸۲۹، سامتسخه سرزمینی عثمانی
    بود. دفتری عثمانی از سال ۱۵۹۵ واله را مرکز ناحیه‌ای با ۵۹ خانوار گرجی ثبت کرده و حتی نام برخی از آنان
    را نگه داشته است: واردزلا پسر ایلاریون، رِوازا پسر داتونا، آزاریای کشیش. آنان گندم و جو و ارزن و نخود
    و عدس می‌کاشتند، تاک پرورش می‌دادند و زنبور عسل و گوسفند نگه می‌داشتند.


    در سدهٔ ۱۷ جامعه‌ای از گرجیان کاتولیک در اینجا ریشه دواند؛ تا سال ۱۷۵۷ واله ۱۵۰ کاتولیک و یک کشیش
    داشت. کلیسای آنان، کلیسای میلاد مادر خدا که در سال ۱۸۶۲ ساخته شد، نزدیک کلیسای کهن ایستاده است، و
    مسجدی از حدود آغاز سدهٔ ۲۰ نیز در شهر برجا مانده است. در دوران شوروی، استخراج لیگنیت (زغال‌سنگ قهوه‌ای)
    این روستا را به شهر بدل کرد — واله در سال ۱۹۶۲ عنوان شهر گرفت — اما معدن‌ها در دههٔ ۱۹۸۰ بسته شدند.


    همهٔ تاریخ واله در یک پیاده‌روی کوتاه جا می‌گیرد، به شرط آنکه آهسته قدم بردارید.
  tip: >-
    ورود رایگان است. ممکن است در را بسته بیابید؛ در این صورت، دیوارها و کتیبه‌هایشان باز هم ارزش یک دور
    آرام گرداگرد بنا را دارند. مانند هر کلیسای ارتدوکس لباس بپوشید: شانه‌ها و زانوها پوشیده، و برای بانوان
    روسری. نیم ساعت کافی است — و اگر بخواهید کلیسای کاتولیک نزدیک را هم پیدا کنید، کمی بیشتر. در واله
    جز چند مغازهٔ روستایی چیز چندانی نیست، پس غذا و سوخت را در آخالتسیخه، دوازده کیلومتر عقب‌تر، تأمین
    کنید و در همان روز قلعهٔ رباط یا صومعهٔ ساپارا را هم ببینید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۲۰ کیلومتر به سمت غرب تا تقاطع خاشوری بروید، سپس با S8 به سمت جنوب،
    از میان تنگهٔ بورجومی، تا آخالتسیخه برانید. همین S8، ۱۲ کیلومتر دیگر به سوی جنوب‌غربی تا واله ادامه
    دارد؛ روی‌هم ۲۱۸ کیلومتر و حدود ۳ ساعت و ۳۰ دقیقه، سراسر آسفالت، هرچند پس از آخالتسیخه باریک‌تر و
    کندتر. در آخالتسیخه باک را پر کنید. هر خودروی اقتصادی کافی است. جاده پس از شهر تا گذرگاه مرزی ترکیه
    ادامه می‌یابد؛ به آن نیازی ندارید — کلیسا در بخش غربی واله است و از هر جا که خودرو را پارک کنید، پیاده
    فاصلهٔ کوتاهی دارد.
he:
  name: כנסיית אם האלוהים (תאוטוקוס), ואלה
  short: >-
    כנסייה מהמאה ה-10 שנבנתה מחדש כבזיליקה במאה ה-16, ועל קירותיה כתובות גאורגיות בשני כתבים — הלב השקט
    של עיירת גבול.
  body: >-
    **בעיירה ואלה, במרחק הליכה קצר זו מזו, ניצבות שתי כנסיות המוקדשות לאותה אם האלוהים, והוותיקה שבהן
    עומדת בעמק הגבול הזה כבר יותר מאלף שנה.**


    כנסיית אם האלוהים, בחלקה המערבי של העיירה, נוסדה ברבע האחרון של המאה ה-10 ונבנתה מחדש במאה ה-16 כבזיליקה
    בת שלוש ספינות — הצורה שבה היא עומדת עד היום. היא רשומה כאתר מורשת בעל חשיבות לאומית, ועל קירותיה
    שרדו כתובות בשני כתבים גאורגיים: אסומטברולי העתיק, כתב האותיות הגדולות, ומחדרולי המאוחר ממנו — שני
    אלפביתים, כתב ידן של שתי תקופות על מבנה אחד.


    אל תצפו להדר. זוהי כנסייה של עיירת כורים קטנה לשעבר, וקסמה שקט: מלאכת האבן, האותיות, וההיסטוריה הסוגרת
    עליה מכל עבר. מסוף המאה ה-16 ועד 1829 הייתה סמצחה אדמה עות'מאנית. פנקס מפקד עות'מאני משנת 1595 מתעד
    את ואלה כמרכזו של מחוז ובו 59 משקי בית גאורגיים, ואף משמר את שמותיהם של כמה מהם — ורדזלה בן אילריון,
    רוואזה בן דאטונה, הכומר אזריה. הם זרעו חיטה, שעורה, דוחן, חומוס ועדשים, טיפחו גפנים, וגידלו דבורים
    וצאן.


    במאה ה-17 השתרשה כאן קהילה של גאורגים קתולים; עד 1757 מנתה ואלה 150 קתולים וכומר. כנסייתם, כנסיית
    הולדת אם האלוהים, שנבנתה ב-1862, עומדת סמוך לכנסייה הישנה, ובעיירה שרד גם מסגד ממפנה המאה ה-20. בתקופה
    הסובייטית הפכה כריית הליגניט (פחם חום) את הכפר לעיר — ואלה קיבלה מעמד של עיר ב-1962 — אבל המכרות נסגרו
    בשנות ה-1980.


    כל תולדותיה של ואלה נכנסות בהליכה קצרה אחת — בתנאי שתלכו לאט.
  tip: >-
    הכניסה חופשית. ייתכן שתמצאו את הדלת נעולה; במקרה כזה, הקירות והכתובות שעליהם שווים הקפה איטית מבחוץ.
    התלבשו כמו לכל כנסייה אורתודוקסית: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש. חצי שעה מספיקה — קצת יותר
    אם תרצו לחפש גם את הכנסייה הקתולית הסמוכה. בעיירה עצמה אין הרבה מלבד חנויות מכולת, אז אכלו ותדלקו
    באחלציחה, שנים-עשר קילומטרים לאחור, ושלבו באותו יום ביקור במצודת רבאטי או במנזר ספארה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) כ-120 ק"מ עד צומת חשורי, ומשם בכביש S8 דרומה דרך ערוץ בורג'ומי עד
    אחלציחה. אותו כביש S8 ממשיך עוד 12 ק"מ דרום-מערבה עד ואלה — 218 ק"מ וכ-3 שעות ו-30 דקות בסך הכול,
    אספלט לכל האורך, אם כי אחרי אחלציחה הכביש צר ואיטי יותר. תדלקו באחלציחה. כל רכב אקונומי יתאים. מעבר
    לעיירה הכביש ממשיך אל מעבר הגבול לטורקיה; לא תזדקקו לו — הכנסייה עומדת בחלקה המערבי של ואלה, במרחק
    הליכה קצר מכל מקום שבו תחנו.
ar:
  name: كنيسة والدة الإله، فالي
  short: >-
    كنيسة من القرن العاشر أُعيد بناؤها بازيليكا في القرن السادس عشر، تحمل جدرانها نقوشًا جورجية بخطّين
    — القلب الهادئ لبلدة حدودية.
  body: >-
    **في فالي كنيستان مكرّستان لوالدة الإله نفسها على بُعد خطوات إحداهما من الأخرى، وأقدمهما قائمة في
    هذا الوادي الحدودي منذ أكثر من ألف عام.**


    تأسست كنيسة والدة الإله، في الجزء الغربي من البلدة، في الربع الأخير من القرن العاشر، وأُعيد تشكيلها
    في القرن السادس عشر بازيليكا ذات ثلاثة أروقة — وهو الشكل القائم اليوم. وهي مدرجة معلمًا ذا أهمية وطنية،
    وتحفظ جدرانها نقوشًا بخطّين جورجيين: الأسومتافرولي القديم ذي الحروف الكبيرة، والمخيدرولي الأحدث عهدًا
    — أبجديتان، وخطّا يدِ عصرين على بناء واحد.


    لا تتوقّع فخامة. إنها كنيسة بلدة صغيرة كانت يومًا بلدة مناجم، وجاذبيتها هادئة: البناء الحجري، والحروف،
    والتاريخ الذي يحيط بها من كل جانب. فمن أواخر القرن السادس عشر حتى عام 1829 كانت سامتسخه أرضًا عثمانية.
    ويسجّل دفتر عثماني يعود إلى عام 1595 فالي مركزًا لناحية تضم 59 أسرة جورجية، بل يحفظ أسماء بعض أفرادها:
    فاردزيلا بن إيلاريون، وريفازا بن داتونا، وعازاريا الكاهن. كانوا يزرعون القمح والشعير والدُّخن والحمّص
    والعدس، ويعتنون بالكروم، ويربّون النحل والأغنام.


    في القرن السابع عشر ترسّخت هنا جماعة من الجورجيين الكاثوليك؛ وبحلول عام 1757 كان في فالي 150 كاثوليكيًا
    وكاهن. وتقوم كنيستهم، كنيسة ميلاد والدة الإله التي بُنيت عام 1862، قرب الكنيسة القديمة، كما بقي في
    البلدة مسجد يعود إلى مطلع القرن العشرين تقريبًا. وفي الحقبة السوفيتية حوّل تعدين الليغنيت (الفحم البني)
    القرية إلى بلدة — نالت صفة المدينة عام 1962 — لكن المناجم أُغلقت في ثمانينيات القرن العشرين.


    تاريخ فالي كلّه يتّسع لنزهة قصيرة واحدة، شرط أن تمشيها على مهل.
  tip: >-
    الدخول مجاني. قد تجد الباب مغلقًا؛ وحينها تستحق الجدران ونقوشها جولة متأنية حول الكنيسة من الخارج.
    التزم باللباس المعتاد في أي كنيسة أرثوذكسية: مع تغطية الكتفين والركبتين، وغطاء رأس للنساء. نصف ساعة
    تكفي — وأكثر قليلًا إن أردت البحث أيضًا عن الكنيسة الكاثوليكية القريبة. لا تقدّم فالي سوى متاجر قروية
    قليلة، فتناول طعامك وتزوّد بالوقود في أخالتسيخه، على بعد اثني عشر كيلومترًا خلفك، واجمع الزيارة في
    اليوم نفسه مع قلعة رباطي أو دير سابارا.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا نحو 120 كم حتى تقاطع خاشوري، ثم الطريق S8 جنوبًا عبر مضيق بورجومي
    حتى أخالتسيخه. ويمضي الطريق S8 نفسه 12 كم أخرى نحو الجنوب الغربي حتى فالي — 218 كم ونحو 3 ساعات و30
    دقيقة إجمالًا، معبّد بالأسفلت طوال المسافة، وإن كان أضيق وأبطأ بعد أخالتسيخه. تزوّد بالوقود في أخالتسيخه.
    أي سيارة اقتصادية تفي بالغرض. ويستمر الطريق بعد البلدة إلى معبر الحدود مع تركيا؛ لن تحتاج إليه — فالكنيسة
    تقوم في الجزء الغربي من فالي، على مسافة قصيرة سيرًا من أي مكان تركن فيه سيارتك.
