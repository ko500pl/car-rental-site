ka:
  name: ბათუმის ბოტანიკური ბაღი
  short: >-
    მწვანე კონცხზე ზღვის თავზე გაშენებული ცხრა ფლორისტული სამყარო — ბაღი, საიდანაც საქართველოს ჩაი, ციტრუსი
    და ევკალიპტი დაიწყო.
  body: >-
    **ანდრეი კრასნოვმა ანდერძად დატოვა, ისე დაემარხათ, რომ საფლავიდან თავისი პირველი ნარგავები დაენახა:
    „ჩემი საფლავიდან ტყეში ღია ზოლი გაჭერით, რომ ჩაქვი მიჩანდეს, მის გარშემო თოვლიანი მთები და ზღვის ნაფლეთები.“**


    ხარკოვის უნივერსიტეტის პროფესორმა კრასნოვმა (1862–1914) XIX საუკუნის 90-იან წლებში ინდოეთი, ცეილონი,
    ჩინეთი და იაპონია მოიარა და ჩაი და აღმოსავლეთ აზიის სხვა მცენარეები ჩაქვის სანერგეში ჩამოიტანა. ბაღის
    დაარსების ნებართვა მხოლოდ 1912 წელს მიიღო, როცა უკვე მძიმედ იყო ავად. ბაღი 1912 წლის 3 ნოემბერს მწვანე
    კონცხზე გაიხსნა და კრასნოვმა, ბოტანიკოსმა და გეოგრაფმა, იგი მსოფლიოს რუკასავით დაგეგმა: ცხრა ფლორისტული
    განყოფილება — ჰიმალაიდან და აღმოსავლეთ აზიიდან მექსიკამდე, ახალ ზელანდიამდე და ხმელთაშუაზღვისპირეთამდე.
    1914 წლის ბოლოს, გახსნიდან სულ ორი წლის შემდეგ, გარდაიცვალა — გეგმა უკვე მიწაზე იყო გადატანილი.


    ბაღს პრაქტიკული ამოცანა ჰქონდა: „აღმოსავლეთის თორმეტი ძღვენის“ — ბამბუკის, ბანანის, ჩაის, ციტრუსის,
    ქაფურის ხის, ხურმის, ტუნგისა და სხვათა — შეგუება ახალ კლიმატთან. სწორედ აქედან წავიდა ბევრი ის, რასაც
    სანაპიროზე გზად ხედავთ: ჩაის პლანტაციები, ციტრუსის ბაღები, ჭაობების დასაშრობად დარგული ევკალიპტები.
    1925 წლიდან ბაღი სუბტროპიკული კულტურების მთავარ საკავშირო ცენტრად იქცა, ხოლო იასონ გორდეზიანმა — იმავე
    კაცმა, ვინც ბათუმის ბულვარს სახე მისცა — იაპონური, მექსიკური, ავსტრალიური და ახალზელანდიური განყოფილებები
    გააშენა.


    დღეს ეს დაახლოებით 110 ჰექტარი და ორი ათასზე მეტი მერქნიანი ტაქსონია: ბილიკები ხევებში ეშვება და ზღვისპირა
    ციცაბო კლდეზე წყდება. ზედა და ქვედა პარკები, რევოლუციამდე კერძო მამულები, ყველაზე ძველ ეგზოტებს ინახავს
    — გინკგოს, დიდყვავილა მაგნოლიას, კორპის მუხას, ჰიმალაურ კედარს. აქვეა კრასნოვის საფლავიც, რომელზეც
    1962 წელს, ბაღის ორმოცდაათი წლის იუბილეზე, მისი შვილიშვილის შექმნილი ბიუსტი დადგეს.


    დადექით მასთან და ჩრდილოეთისკენ, ჩაქვისკენ გაიხედეთ — იქით, საითაც მას თვითონ უნდოდა ყურება.
  tip: >-
    ჩაიცვით კომფორტული ფეხსაცმელი: ბაღი ციცაბო ფერდობზეა და სრული წრე ხუთ კილომეტრზე მეტია, ორიდან სამ
    საათამდე. თუ ბევრი სიარული არ გსურთ, შედით ზედა შესასვლელით, ჩაუყევით ქვემოთ და ზემოთ შიდა ტრანსპორტით
    ამობრუნდით. მაგნოლიები და აზალიები გაზაფხულზე ყვავის, თუმცა ბაღი მწვანეა მთელი წელი. ზაფხულში წყალი
    და ქუდი აუცილებელია, წვიმის ქურთუკი — ნებისმიერ სეზონზე: აჭარაში ამინდი სწრაფად იცვლება და ბილიკები
    სრიალა ხდება. შესვლის საფასური დროდადრო იცვლება, ამიტომ ჭიშკართან გადაამოწმეთ; კაფე და ტუალეტი შესასვლელებთანაა,
    ავტოსადგომი ტერიტორიის გარეთაა და ცალკე ფასიანია.
  route: >-
    თბილისიდან დაახლოებით 360 კილომეტრი და ხუთი საათი და თხუთმეტი წუთია. E60-ით სამტრედიამდე მიდიხართ,
    შემდეგ S12-ით ლანჩხუთის გავლით ზღვაზე გადიხართ და სანაპიროს გაყოლებით სამხრეთით, ქობულეთისა და ჩაქვის
    გავლით, აგრძელებთ. ბაღი ბათუმის ცენტრიდან 9 კილომეტრით ჩრდილოეთით, მწვანე კონცხზეა, ამიტომ მას ქალაქამდე
    მიაღწევთ — მიჰყევით ნიშნებს „მწვანე კონცხი“. ბოლო მონაკვეთი ასფალტიანია, მაგრამ ვიწრო და მოსახვევიანი,
    ორი მანქანა ძლივს ცდება ერთმანეთს. ეკონომ-კლასი სავსებით საკმარისია. საწვავი ქობულეთში აიღეთ. ზაფხულში
    ავტოსადგომი ადრე ივსება — დილით მოდით.
en:
  name: Batumi Botanical Garden
  short: >-
    Nine floristic worlds on Green Cape above the sea, in the garden where Georgia's tea, citrus and eucalyptus
    began.
  body: >-
    **Andrey Krasnov asked to be buried where he could still see his first plantings: "Cut a clearing
    from my grave so that I can see Chakvi, with its snowy mountains around it and pieces of the sea."**


    A Kharkiv professor, Krasnov (1862–1914) spent the 1890s travelling through India, Ceylon, China and
    Japan, bringing tea and other East Asian plants back to a nursery at Chakvi. Permission for a garden
    came only in 1912, when he was already gravely ill. It opened on 3 November that year on Mtsvane Kontskhi,
    Green Cape, and Krasnov, a geographer as much as a botanist, laid it out like a map of the world:
    nine floristic sections, from the Himalaya and East Asia to Mexico, New Zealand and the Mediterranean.
    He died at the end of 1914, two years after the opening, with the plan already in the ground.


    The garden had a practical task: to acclimatise twelve "gifts of the East", among them bamboo, banana,
    tea, citrus, camphor, persimmon and tung. Much of what you pass on the coast began here: tea terraces,
    citrus groves, eucalyptus planted to drain the swamps. From 1925 it was the Soviet Union's main centre
    for subtropical crops, and Jason Gordeziani, the gardener who also shaped Batumi Boulevard, built
    up its Japanese, Mexican, Australian and New Zealand sections.


    Today it covers about 110 hectares with more than two thousand woody taxa, the paths dropping through
    ravines to a cliff above the sea. The Upper and Lower Parks, private estates before the revolution,
    hold the oldest exotics: ginkgo, southern magnolia, cork oak and deodar. Krasnov's grave is here too,
    with a bust by his granddaughter set on it in 1962, the garden's fiftieth year.


    Stand beside it and look north towards Chakvi, where he wanted his gaze to rest.
  tip: >-
    Wear proper shoes: the garden is a steep hillside and the full loop is more than five kilometres,
    two to three hours. If you would rather not climb, enter at the upper gate, walk down and ride the
    internal shuttle back up. Magnolias and azaleas flower in spring, but the garden is green all year.
    Take water and a hat in summer and a rain shell in any season: Adjaran weather turns fast and the
    paths get slippery. The entry fee changes from time to time, so check it at the gate. Cafés and toilets
    are by the entrances; parking is outside the grounds and charged separately.
  route: >-
    From Tbilisi it is about 360 km, roughly five and a quarter hours. Take the E60 to Samtredia, then
    the S12 through Lanchkhuti to the coast and head south through Kobuleti and Chakvi. The garden sits
    on Green Cape (Mtsvane Kontskhi), 9 km north of central Batumi, so you reach it before the city; follow
    the signs for Mtsvane Kontskhi. The last stretch is asphalt but narrow and winding, barely wide enough
    for two cars to pass. An economy car is entirely sufficient. Fill up in Kobuleti. On summer days the
    car park fills early, so come in the morning.
ru:
  name: Батумский ботанический сад
  short: >-
    Девять флористических миров на Зелёном мысу над морем — сад, откуда началась грузинская чайная, цитрусовая
    и эвкалиптовая история.
  body: >-
    **Андрей Краснов завещал похоронить себя так, чтобы с могилы были видны его первые посадки: «Сделайте
    от моей могилы просеку, чтобы мне видна была Чаква с окружающими её снеговыми горами, кусочками моря».**


    Профессор Харьковского университета Краснов (1862–1914) в 1890-х годах проехал через Индию, Цейлон,
    Китай и Японию и привёз чай и другие растения Восточной Азии в питомник в Чакве. Разрешение на устройство
    сада он получил лишь в 1912 году, когда был уже тяжело болен. Сад открылся 3 ноября того же года на
    Зелёном мысу, и Краснов — географ не меньше, чем ботаник — спланировал его как карту мира: девять
    флористических отделов, от Гималаев и Восточной Азии до Мексики, Новой Зеландии и Средиземноморья.
    Он умер в конце 1914 года, всего через два года после открытия, когда его план уже был высажен в землю.


    У сада была практическая задача: приучить к новому климату двенадцать «даров Востока» — бамбук, банан,
    чай, цитрусы, камфорное дерево, хурму, тунговое дерево и другие. Отсюда пошло многое из того, что
    вы видите вдоль побережья: чайные плантации, цитрусовые сады, эвкалипты, посаженные для осушения болот.
    С 1925 года сад стал главным всесоюзным центром субтропических культур, а Ясон Гордезиани — тот самый,
    кто придал облик Батумскому бульвару, — заложил здесь японский, мексиканский, австралийский и новозеландский
    отделы.


    Сегодня это около 110 гектаров и более двух тысяч видов древесных растений: тропы спускаются по ущельям
    и обрываются на прибрежной скале. Верхний и Нижний парки, до революции частные усадьбы, хранят самые
    старые экзоты — гинкго, крупноцветковую магнолию, пробковый дуб, гималайский кедр. Здесь же могила
    Краснова, на которой в 1962 году, к пятидесятилетию сада, установили бюст работы его внучки.


    Встаньте рядом и посмотрите на север, в сторону Чаквы — туда, куда он сам хотел смотреть.
  tip: >-
    Наденьте удобную обувь: сад стоит на крутом склоне, а полный круг — больше пяти километров, два-три
    часа. Если не хотите много ходить, войдите через верхние ворота, спуститесь пешком и поднимитесь обратно
    на внутреннем транспорте. Магнолии и азалии цветут весной, но сад зелёный весь год. Летом берите воду
    и шляпу, а в любой сезон — дождевик: погода в Аджарии меняется быстро, и тропы становятся скользкими.
    Плата за вход время от времени меняется, уточняйте у ворот; кафе и туалеты — у входов, парковка за
    территорией и оплачивается отдельно.
  route: >-
    От Тбилиси около 360 км — примерно пять часов с четвертью. Двигайтесь по E60 до Самтредиа, затем по
    S12 через Ланчхути к побережью и на юг через Кобулети и Чакву. Сад расположен на Зелёном мысу (Мцване-Концхи),
    в 9 км севернее центра Батуми, так что вы доберётесь до него раньше, чем до города — следуйте указателям
    «Мцване-Концхи». Последний участок заасфальтирован, но узкий и извилистый, две машины на нём с трудом
    расходятся. Машины экономкласса вполне достаточно. Заправляйтесь в Кобулети. Летом парковка заполняется
    рано — приезжайте утром.
fa:
  name: باغ گیاه‌شناسی باتومی
  short: نه دنیای گیاهی بر دماغهٔ سبز بالای دریا، در باغی که چای، مرکبات و اکالیپتوس گرجستان از آن‌جا
    آغاز شد.
  body: >-
    **آندری کراسنوف چنان وصیت کرد که او را جایی به خاک بسپارند که از روی گورش بتواند نخستین نهال‌هایش
    را ببیند: «از گور من در جنگل، مسیری روشن باز کنید تا چاکوی پیدا باشد، با کوه‌های پربرفش گرداگردش و
    پاره‌هایی از دریا.»**


    کراسنوف (۱۸۶۲–۱۹۱۴)، استاد دانشگاه خارکف، در دههٔ ۱۸۹۰ به هند، سیلان، چین و ژاپن سفر کرد و چای و دیگر
    گیاهان آسیای شرقی را به نهالستانی در چاکوی آورد. اجازهٔ تأسیس باغ را تنها در سال ۱۹۱۲، زمانی که سخت
    بیمار بود، به دست آورد. باغ در سوم نوامبر همان سال بر دماغهٔ سبز گشوده شد، و کراسنوف، که جغرافی‌دان
    بود همان‌قدر که گیاه‌شناس، آن را چون نقشه‌ای از جهان طرح‌ریزی کرد: نه بخش گیاهی، از هیمالیا و آسیای
    شرقی تا مکزیک، نیوزیلند و مدیترانه. او در پایان سال ۱۹۱۴، تنها دو سال پس از افتتاح، درگذشت؛ زمانی
    که نقشه‌اش دیگر در زمین نشسته بود.


    باغ هدفی کاربردی داشت: سازگارکردن دوازده «هدیهٔ شرق» - از جمله بامبو، موز، چای، مرکبات، درخت کافور،
    خرمالو و تونگ - با آب‌وهوایی تازه. بسیاری از آن‌چه امروز در راه ساحل می‌بینید از همین‌جا آغاز شد:
    مزارع چای، باغ‌های مرکبات، اکالیپتوس‌هایی که برای خشک‌کردن باتلاق‌ها کاشته شدند. از سال ۱۹۲۵ این باغ
    مرکز اصلی گیاهان نیمه‌گرمسیری اتحاد جماهیر شوروی شد، و یاسون گوردزیانی - همان کسی که چهرهٔ بلوار باتومی
    را نیز شکل داد - بخش‌های ژاپنی، مکزیکی، استرالیایی و نیوزیلندی را در آن بنا کرد.


    امروز این باغ نزدیک به ۱۱۰ هکتار مساحت دارد و بیش از دو هزار گونهٔ درختی را در خود جای داده است: مسیرها
    از دره‌ها پایین می‌روند و به صخره‌ای بر فراز دریا می‌رسند. پارک بالا و پارک پایین، که پیش از انقلاب
    املاک خصوصی بودند، کهن‌ترین گیاهان غیربومی را نگه داشته‌اند: جینکو، ماگنولیای بزرگ‌گل، بلوط چوب‌پنبه
    و سدر هیمالیایی. گور کراسنوف نیز همین‌جاست، با نیم‌تنه‌ای ساختهٔ نوه‌اش که در سال ۱۹۶۲، به‌مناسبت
    پنجاهمین سالگرد باغ، بر آن نصب شد.


    کنارش بایستید و به شمال، به‌سوی چاکوی بنگرید - همان‌جا که خود او می‌خواست نگاهش بماند.
  tip: >-
    کفشی راحت بپوشید: باغ بر دامنه‌ای پرشیب قرار دارد و یک دور کامل بیش از پنج کیلومتر است، دو تا سه ساعت.
    اگر پیاده‌روی زیاد نمی‌خواهید، از دروازهٔ بالا وارد شوید، پیاده پایین بروید و با وسیلهٔ نقلیهٔ داخلی
    بالا برگردید. ماگنولیا و آزالیا در بهار گل می‌دهند، اما باغ در تمام سال سبز است. در تابستان آب و کلاه
    با خود ببرید، و در هر فصل بارانی نازک: آب‌وهوای آجارا سریع تغییر می‌کند و مسیرها لیز می‌شوند. هزینهٔ
    ورودی گاه‌به‌گاه تغییر می‌کند، پس در دروازه بپرسید. کافه و سرویس بهداشتی نزدیک ورودی‌هاست؛ پارکینگ
    بیرون از محوطه است و هزینه‌ای جدا دارد.
  route: >-
    از تفلیس حدود ۳۶۰ کیلومتر و نزدیک به پنج ساعت و ربع است. از E60 تا سامترِدیا بروید، سپس از S12 از
    میان لانچخوتی به ساحل برسید و به‌سوی جنوب، از میان کوبولتی و چاکوی، ادامه دهید. باغ بر دماغهٔ سبز
    (متسوانه کونتسخی)، ۹ کیلومتر شمال مرکز باتومی، قرار دارد، پس پیش از شهر به آن می‌رسید - علائم «متسوانه
    کونتسخی» را دنبال کنید. مسیر پایانی آسفالته اما تنگ و پرپیچ است و به‌سختی جای دو ماشین را می‌دهد.
    خودروی اقتصادی کاملاً کافی است. در کوبولتی سوخت‌گیری کنید. در روزهای تابستان پارکینگ زود پر می‌شود
    - صبح بیایید.
he:
  name: הגן הבוטני של בטומי
  short: תשעה עולמות פלוריסטיים על הכף הירוק מעל הים, בגן שממנו יצאו התה, ההדרים והאיקליפטוס של גאורגיה.
  body: >-
    **אנדריי קרסנוב ציווה להיקבר במקום שממנו יוכל לראות את שתיליו הראשונים: "פלסו מקברי שביל פתוח ביער,
    כדי שאוכל לראות את צ'אקווי, ומסביבו הרים מושלגים ופיסות ים."**


    קרסנוב (1862-1914), פרופסור מאוניברסיטת חרקוב, נסע בשנות ה-90 של המאה ה-19 בהודו, בציילון, בסין וביפן,
    והביא תה וצמחים נוספים ממזרח אסיה למשתלה בצ'אקווי. את האישור להקמת הגן קיבל רק ב-1912, כשהיה כבר חולה
    קשה. הגן נפתח ב-3 בנובמבר של אותה שנה על הכף הירוק, וקרסנוב, גאוגרף לא פחות משהיה בוטנאי, תכנן אותו
    כמפת עולם: תשע מחלקות פלוריסטיות, מההימלאיה ומזרח אסיה ועד מקסיקו, ניו זילנד וחופי הים התיכון. הוא
    נפטר בסוף 1914, רק שנתיים אחרי הפתיחה, כשהתכנית שלו הייתה כבר נטועה באדמה.


    לגן היה תפקיד מעשי: לאקלם שתים-עשרה "מתנות המזרח" - במבוק, בננה, תה, הדרים, עץ קמפור, אפרסמון, עץ
    טונג ועוד - באקלים חדש. הרבה ממה שרואים היום בדרך לאורך החוף נולד כאן: מטעי תה, חלקות הדרים, עצי איקליפטוס
    שנשתלו לניקוז הביצות. מ-1925 היה הגן המרכז הראשי בברית המועצות לגידולים סוב-טרופיים, ויאסון גורדזיאני
    - אותו אדם שעיצב גם את הטיילת של בטומי - הקים בו את המחלקות היפנית, המקסיקנית, האוסטרלית והניו-זילנדית.


    היום משתרע הגן על כ-110 הקטרים ובו יותר מאלפיים מיני עצים: השבילים יורדים לתוך ערוצים ומסתיימים על
    צוק מעל הים. הפארק העליון והפארק התחתון, שהיו אחוזות פרטיות לפני המהפכה, שומרים על העצים האקזוטיים
    העתיקים ביותר - גינקו, מגנוליה גדולת-פרחים, אלון שעם וארז ההימלאיה. שם גם קברו של קרסנוב, שעליו הוצב
    ב-1962, לחגיגות היובל החמישים של הגן, פסל חצי-גוף שיצרה נכדתו.


    עמדו לצדו והביטו צפונה, לעבר צ'אקווי - לשם רצה הוא עצמו שמבטו יישאר.
  tip: >-
    לבשו נעליים נוחות: הגן נמצא על מדרון תלול והמסלול המעגלי המלא הוא יותר מחמישה קילומטרים, שעתיים עד
    שלוש. אם אינכם רוצים ללכת הרבה, היכנסו מהשער העליון, רדו ברגל ועלו בחזרה בתחבורה הפנימית. מגנוליות
    ואזלאות פורחות באביב, אבל הגן ירוק כל השנה. בקיץ הביאו מים וכובע, ובכל עונה - מעיל גשם קל: מזג האוויר
    באג'ריה משתנה במהירות והשבילים מחליקים. דמי הכניסה משתנים מזמן לזמן, בדקו בשער. בתי קפה ושירותים נמצאים
    לצד הכניסות; החנייה מחוץ לשטח ובתשלום נפרד.
  route: >-
    מטביליסי המרחק הוא כ-360 ק"מ וכחמש שעות ורבע. סעו בכביש E60 עד סמטרדיה, ואז ב-S12 דרך לנצ'חוטי לחוף
    ומשם דרומה דרך קובולטי וצ'אקווי. הגן נמצא על הכף הירוק (מצוואנה קונצחי), 9 ק"מ צפונית ממרכז בטומי,
    כך שתגיעו אליו לפני העיר - עקבו אחר השילוט "מצוואנה קונצחי". הקטע האחרון סלול אך צר ומתפתל, וכמעט
    אין בו מקום לשתי מכוניות לעבור זו על פני זו. רכב אקונומי מספיק בהחלט. תדלקו בקובולטי. בימי קיץ החנייה
    מתמלאת מוקדם - הגיעו בבוקר.
ar:
  name: حديقة باتومي النباتية
  short: تسعة عوالم نباتية على الرأس الأخضر فوق البحر، في الحديقة التي بدأ منها الشاي والحمضيات والأوكالبتوس
    في جورجيا.
  body: >-
    **أوصى أندريه كراسنوف بأن يُدفن في مكان يستطيع من قبره أن يرى مغروساته الأولى: "افتحوا من قبري في
    الغابة ممرًا واضحًا، حتى تظهر تشاكفي، وحولها الجبال المكسوّة بالثلج وقطع من البحر."**


    قضى كراسنوف (1862-1914)، أستاذ جامعة خاركيف، عقد التسعينيات من القرن التاسع عشر متنقلًا بين الهند
    وسيلان والصين واليابان، وأتى بالشاي ونباتات أخرى من شرق آسيا إلى مشتل في تشاكفي. لم يحصل على إذن إنشاء
    الحديقة إلا في عام 1912، وكان مريضًا مرضًا شديدًا حينها. افتُتحت الحديقة في 3 نوفمبر من تلك السنة
    على الرأس الأخضر، وصمّمها كراسنوف - وهو جغرافي بقدر ما هو نباتي - كخريطة للعالم: تسعة أقسام نباتية،
    من الهيمالايا وشرق آسيا إلى المكسيك ونيوزيلندا وحوض المتوسط. توفي في نهاية عام 1914، بعد الافتتاح
    بعامين فقط، وكانت خطته قد استقرت في الأرض.


    كانت للحديقة مهمة عملية: تكييف اثنتي عشرة "هبة من الشرق" - منها الخيزران والموز والشاي والحمضيات وشجرة
    الكافور والكاكي وشجرة التونغ - مع مناخ جديد. ومن هنا انطلق كثير مما تراه اليوم على طول الساحل: مزارع
    الشاي وبساتين الحمضيات وأشجار الأوكالبتوس التي زُرعت لتجفيف المستنقعات. ومنذ عام 1925 صارت الحديقة
    المركز السوفييتي الرئيسي للمحاصيل شبه المدارية، وأنشأ فيها ياسون غورديزياني - الرجل نفسه الذي أسهم
    في تشكيل بولفار باتومي - أقسامها اليابانية والمكسيكية والأسترالية والنيوزيلندية.


    تمتد الحديقة اليوم على نحو 110 هكتارات وتضم أكثر من ألفي نوع من النباتات الخشبية: تنحدر الممرات عبر
    الأخاديد وتنتهي عند صخرة فوق البحر. وتحتفظ الحديقتان العلوية والسفلى، وكانتا ضياعًا خاصة قبل الثورة،
    بأقدم النباتات الغريبة: الجنكة والماغنوليا كبيرة الأزهار وسنديان الفلين وأرز الهيمالايا. وهناك أيضًا
    قبر كراسنوف، الذي وُضع عليه في عام 1962، بمناسبة اليوبيل الخمسيني للحديقة، تمثال نصفي صنعته حفيدته.


    قِف إلى جانبه وانظر شمالًا، نحو تشاكفي - إلى حيث أراد هو نفسه أن يبقى نظره.
  tip: >-
    ارتد حذاءً مريحًا: الحديقة على منحدر شديد، والدورة الكاملة أكثر من خمسة كيلومترات، أي ساعتان إلى ثلاث
    ساعات. إن كنت لا تريد مشيًا كثيرًا، فادخل من البوابة العلوية، وانزل سيرًا، وارجع بواسطة النقل الداخلي.
    تُزهر الماغنوليا والأزاليا في الربيع، لكن الحديقة خضراء طوال السنة. خذ ماءً وقبعة في الصيف، وواقي
    مطر خفيفًا في أي فصل: يتغير الطقس في أدجارا بسرعة وتصبح الممرات زلقة. تتغير رسوم الدخول من وقت لآخر،
    فاسأل عند البوابة. المقاهي والمرافق الصحية عند المداخل، والمواقف خارج الحديقة وبرسم مستقل.
  route: >-
    من تبليسي نحو 360 كم، أي قرابة خمس ساعات وربع. سِر على الطريق E60 حتى سامتريديا، ثم على S12 عبر لانتشخوتي
    إلى الساحل، ثم جنوبًا عبر كوبوليتي وتشاكفي. تقع الحديقة على الرأس الأخضر (متسفانه كونتسخي)، على 9
    كم شمال وسط باتومي، فتصلها قبل المدينة - اتبع لافتات "متسفانه كونتسخي". المقطع الأخير معبّد لكنه ضيق
    ومتعرّج، وبالكاد يتّسع لمرور سيارتين معًا. تكفي سيارة اقتصادية تمامًا. تزوّد بالوقود في كوبوليتي.
    في أيام الصيف تمتلئ المواقف باكرًا - تعالَ صباحًا.
