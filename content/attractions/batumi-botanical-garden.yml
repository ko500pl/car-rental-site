ka:
  name: ბათუმის ბოტანიკური ბაღი
  short: ასზე მეტ ჰექტარზე გაშენებული ბაღი მწვანე კონცხზე, ზღვის თავზე — მსოფლიოს ცხრა ფლორისტული ზონა
    ერთ ტერიტორიაზე.
  body: >-
    ბათუმის ბოტანიკური ბაღი ქალაქიდან ჩრდილოეთით, მწვანე კონცხზეა გაშენებული და პირდაპირ ზღვის თავზე,
    ფერდობზე ეშვება. ის 1912 წელს დაარსა რუსმა ბოტანიკოსმა და გეოგრაფმა ანდრეი კრასნოვმა და დღეს ასზე
    მეტ ჰექტარს იკავებს — ეს რეგიონის ერთ-ერთი ყველაზე დიდი ბოტანიკური კოლექციაა.


    ბაღის სტრუქტურა უჩვეულოა: ის ფლორისტულ განყოფილებებადაა დაყოფილი, სადაც თითოეული მსოფლიოს კონკრეტულ
    რეგიონს წარმოადგენს. აღმოსავლეთ აზიის, ჩრდილოეთ ამერიკის, ავსტრალიის, ხმელთაშუაზღვისპირეთის, ჰიმალაების,
    მექსიკისა და კოლხეთის სექციები ერთმანეთს ბილიკებით უკავშირდება. სუბტროპიკული, ნოტიო კლიმატის წყალობით
    აქ იზრდება ისეთი მცენარეები, რომლებიც საქართველოს სხვა არცერთ ნაწილში არ გადარჩებოდა — ბამბუკის კორომები,
    ევკალიპტები, პალმები და მაგნოლიები.


    პრაქტიკულად:


    - **ტერიტორია დიდი და დაქანებულია** — სრული მარშრუტი ორ-სამ საათს ითხოვს

    - **მთავარი ხედი** ზედა ბილიკებიდან იშლება ზღვასა და მწვანე კონცხის სანაპიროზე

    - **შიდა ტრანსპორტი** მოძრაობს ზედა და ქვედა შესასვლელს შორის


    საუკეთესო პერიოდია გაზაფხული, როცა მაგნოლიები და აზალიები ყვავის, თუმცა ბაღი მთელი წელი ღიაა და ზამთარშიც
    მწვანე რჩება. მოღრუბლულ დღესაც კი აქ სასიამოვნოა — ხეების ქვეშ შუქი რბილია და გადაღებისთვის კარგი,
    რაც მნიშვნელოვანია იმის გათვალისწინებით, თუ რამდენად ხშირად იფარება აჭარის სანაპირო ღრუბლით. ბაღი
    ასევე მშვიდი ალტერნატივაა ზაფხულის ბათუმის ხმაურისა და ხალხმრავლობის შემდეგ.
  tip: >-
    ჩაიცვით მოსახერხებელი ფეხსაცმელი — ბაღი ფერდობზეა და აღმართ-დაღმართი ბევრია; საშუალოდ ხუთ კილომეტრზე
    მეტს გაივლით. თუ სიარული არ გინდათ, შედით ზედა შესასვლელით და ქვედაზე გამოდით, შიდა ტრანსპორტით დაბრუნებით.
    წყალი და ქუდი ზაფხულში საჭიროა, წვიმის ქურთუკი კი წლის ნებისმიერ დროს — აჭარაში ავდარი სწრაფად იცვლება
    და ბილიკები სრიალა ხდება. კაფე და ტუალეტი ორივე შესასვლელთანაა. პარკინგი ტერიტორიის გარეთაა, ცალკე
    საფასურით.
  route: >-
    თბილისიდან დაახლოებით 380 კმ და ხუთი საათი და 45 წუთია. E60-ით ჩადიხართ ბათუმამდე, შემდეგ სანაპირო
    გზით ჩრდილოეთით აგრძელებთ მწვანე კონცხის მიმართულებით — ბათუმის ცენტრიდან ბაღამდე მხოლოდ 9 კმ-ია,
    20 წუთი. გზა ბოლომდე ასფალტია, თუმცა ბოლო მონაკვეთი ვიწრო და მოხვევებიანი. ეკონომ კლასის ავტომობილი
    სავსებით საკმარისია. საწვავი ბათუმში აავსეთ. ზაფხულის დღეებში პარკინგი ივსება — ადრე ჩამოსვლა ჯობია.
en:
  name: Batumi Botanical Garden
  short: Over a hundred hectares on a cape above the sea, with nine floristic zones of the world laid
    out side by side.
  body: >-
    The Batumi Botanical Garden lies north of the city on Green Cape, dropping down a hillside directly
    above the sea. It was founded in 1912 by the Russian botanist and geographer Andrey Krasnov and now
    covers more than a hundred hectares, making it one of the largest botanical collections in the region.


    Its structure is unusual. The garden is divided into floristic sections, each representing a specific
    part of the world: East Asia, North America, Australia, the Mediterranean, the Himalayas, Mexico and
    Colchis are all connected by paths. Thanks to the humid subtropical climate, plants grow here that
    would not survive anywhere else in Georgia — bamboo groves, eucalyptus, palms and magnolias.


    In practical terms:


    - **The site is large and steep** — the full circuit takes two to three hours

    - **The main view** opens from the upper paths across the sea and the Green Cape shoreline

    - **A shuttle** runs between the upper and lower entrances


    Spring is the best season, when the magnolias and azaleas flower, but the garden is open all year
    and stays green through winter. Even on a grey day the light under the canopy suits photography, which
    is useful given how often the Adjaran coast is overcast.
  tip: >-
    Wear comfortable shoes: the garden is on a slope with constant climbs and descents, and you will typically
    cover more than five kilometres. If you would rather not walk it all, enter at the upper gate, exit
    at the lower one and take the shuttle back. Water and a hat matter in summer, a rain shell in any
    season — Adjaran weather turns quickly and the paths get slippery. Cafes and toilets are at both entrances.
    Parking is outside the grounds and charged separately.
  route: >-
    It is roughly 380 km and about five and three quarter hours from Tbilisi. Take the E60 down to Batumi,
    then continue north along the coast road toward Green Cape: from the city centre to the garden is
    only 9 km, about twenty minutes. The road is paved all the way, though the last section is narrow
    and winding with limited overtaking. An economy car is entirely sufficient. Fill up in Batumi. On
    summer days the car park fills up, so arriving early is worthwhile.
ru:
  name: Батумский ботанический сад
  short: Более ста гектаров на мысу над морем, где девять флористических зон мира разбиты рядом друг с
    другом.
  body: >-
    Батумский ботанический сад расположен к северу от города на Зелёном мысу и спускается по склону прямо
    над морем. Его основал в 1912 году российский ботаник и географ Андрей Краснов; сегодня сад занимает
    более ста гектаров и остаётся одной из крупнейших ботанических коллекций региона.


    Структура здесь необычная. Сад разделён на флористические отделы, каждый из которых представляет конкретную
    часть света: Восточная Азия, Северная Америка, Австралия, Средиземноморье, Гималаи, Мексика и Колхида
    связаны между собой дорожками. Благодаря влажному субтропическому климату тут растут виды, которые
    не выжили бы больше нигде в Грузии — бамбуковые рощи, эвкалипты, пальмы и магнолии.


    С практической стороны:


    - **Территория большая и крутая** — полный круг занимает два-три часа

    - **Главный вид** открывается с верхних дорожек на море и побережье Зелёного мыса

    - **Внутренний транспорт** ходит между верхним и нижним входами


    Лучший сезон — весна, когда цветут магнолии и азалии, но сад открыт круглый год и зимой остаётся зелёным.
    Даже в пасмурный день свет под пологом хорош для съёмки, что важно с учётом того, как часто аджарское
    побережье бывает затянуто облаками.
  tip: >-
    Обувь берите удобную: сад расположен на склоне, подъёмы и спуски постоянны, обычно набегает больше
    пяти километров. Если ходить пешком не хочется, заходите через верхний вход, выходите через нижний
    и возвращайтесь на внутреннем транспорте. Вода и головной убор нужны летом, дождевик — в любой сезон:
    аджарская погода меняется быстро, дорожки становятся скользкими. Кафе и туалеты есть у обоих входов.
    Парковка находится за территорией и оплачивается отдельно.
  route: >-
    От Тбилиси примерно 380 км и около пяти часов сорока пяти минут. По трассе E60 вы спускаетесь к Батуми,
    затем продолжаете по прибрежной дороге на север в сторону Зелёного мыса: от центра города до сада
    всего 9 км, около двадцати минут. Дорога асфальтированная на всём протяжении, но последний отрезок
    узкий и извилистый, с ограниченным обгоном. Машины эконом-класса вполне достаточно. Заправляйтесь
    в Батуми. Летом парковка заполняется, поэтому приезжать лучше пораньше.
fa:
  name: باغ گیاه‌شناسی باتومی
  short: بیش از صد هکتار روی دماغه‌ای بالای دریا، با نه پهنهٔ گیاهی جهان که کنار هم چیده شده‌اند.
  body: >-
    باغ گیاه‌شناسی باتومی شمال شهر روی دماغهٔ سبز قرار دارد و از دامنه‌ای مستقیم بالای دریا پایین می‌آید.
    آن را در 1912 آندری کراسنوف، گیاه‌شناس و جغرافی‌دان روس، بنیاد نهاد و امروز بیش از صد هکتار را می‌پوشاند،
    یعنی یکی از بزرگ‌ترین مجموعه‌های گیاهی منطقه است.


    ساختار آن غیرمعمول است. باغ به بخش‌های گیاهی تقسیم شده که هر یک نمایندهٔ جایی از جهان است: آسیای شرقی،
    آمریکای شمالی، استرالیا، مدیترانه، هیمالیا، مکزیک و کلخیس همه با مسیرهای پیاده به هم وصل‌اند. به‌لطف
    اقلیم نیمه‌گرمسیری مرطوب، گیاهانی اینجا رشد می‌کنند که هیچ جای دیگر گرجستان دوام نمی‌آورند — بیشه‌های
    بامبو، اکالیپتوس، نخل و ماگنولیا.


    از نظر عملی:


    - **محوطه بزرگ و شیب‌دار است** — دور کامل دو تا سه ساعت طول می‌کشد

    - **منظرهٔ اصلی** از مسیرهای بالایی رو به دریا و ساحل دماغهٔ سبز باز می‌شود

    - **یک سرویس رفت‌وبرگشت** میان ورودی بالا و پایین کار می‌کند


    بهار بهترین فصل است، وقتی ماگنولیاها و آزالیاها گل می‌دهند، اما باغ تمام سال باز است و در زمستان هم
    سبز می‌ماند. حتی در روز ابری، نور زیر تاج درختان برای عکاسی مناسب است، که با توجه به ابری بودن مکرر
    ساحل آجارا نکتهٔ مفیدی است.
  tip: >-
    کفش راحت بپوشید: باغ روی شیب است، مدام بالا و پایین می‌روید و معمولاً بیش از پنج کیلومتر راه خواهید
    رفت. اگر نمی‌خواهید همه‌اش را پیاده بروید، از دروازهٔ بالا وارد شوید، از دروازهٔ پایین بیرون بیایید
    و با سرویس برگردید. آب و کلاه در تابستان مهم است و بارانی در هر فصل — هوای آجارا زود عوض می‌شود و
    مسیرها لغزنده می‌شوند. کافه و سرویس بهداشتی در هر دو ورودی هست. پارکینگ بیرون محوطه و جداگانه پولی
    است.
  route: >-
    حدود 380 کیلومتر و نزدیک پنج ساعت و سه‌ربع از تفلیس فاصله دارد. E60 را تا باتومی بروید، سپس در امتداد
    جادهٔ ساحلی به شمال به سوی دماغهٔ سبز ادامه دهید: از مرکز شهر تا باغ فقط 9 کیلومتر است، حدود بیست
    دقیقه. جاده تا انتها آسفالت است، هرچند بخش آخر باریک و پرپیچ با امکان سبقت محدود. خودروی اقتصادی کاملاً
    کافی است. در باتومی سوخت‌گیری کنید. در روزهای تابستان پارکینگ پر می‌شود، پس زود رسیدن می‌ارزد.
he:
  name: הגן הבוטני של בטומי
  short: יותר ממאה הקטרים על כף מעל הים, ובהם תשעה אזורי צומח של העולם זה לצד זה.
  body: >-
    הגן הבוטני של בטומי שוכן מצפון לעיר בכף הירוק ויורד במדרון היישר מעל הים. הוא נוסד ב-1912 בידי הבוטנאי
    והגיאוגרף הרוסי אנדריי קרסנוב, וכיום הוא משתרע על יותר ממאה הקטרים והוא מן האוספים הבוטניים הגדולים
    באזור.


    המבנה שלו יוצא דופן. הגן מחולק למקטעים פלוריסטיים, וכל אחד מהם מייצג חלק מסוים בעולם: מזרח אסיה, צפון
    אמריקה, אוסטרליה, אגן הים התיכון, ההימלאיה, מקסיקו וקולכיס מחוברים כולם בשבילים. הודות לאקלים הסובטרופי
    הלח גדלים כאן צמחים שלא היו שורדים בשום מקום אחר בגאורגיה — חורשות במבוק, איקליפטוסים, דקלים ומגנוליות.


    מבחינה מעשית:


    - **השטח גדול ותלול** — הסיבוב המלא נמשך שעתיים עד שלוש

    - **הנוף המרכזי** נפתח מן השבילים העליונים אל הים ואל קו החוף של הכף הירוק

    - **שאטל** נוסע בין הכניסה העליונה לתחתונה


    האביב הוא העונה הטובה ביותר, כשהמגנוליות והאזליות פורחות, אבל הגן פתוח כל השנה ונשאר ירוק גם בחורף.
    גם ביום אפור האור מתחת לצמרות מתאים לצילום, וזה שימושי בהתחשב בכמות הימים המעוננים בחוף אג'ריה.
  tip: >-
    נעלו נעליים נוחות: הגן על מדרון עם עליות וירידות מתמידות, ובדרך כלל תעברו יותר מחמישה קילומטרים. אם
    אתם מעדיפים לא ללכת את הכול, היכנסו בשער העליון, צאו בתחתון וחזרו בשאטל. מים וכובע חשובים בקיץ, ומעיל
    גשם בכל עונה — מזג האוויר באג'ריה מתהפך מהר והשבילים נעשים חלקלקים. בתי קפה ושירותים יש בשתי הכניסות.
    החניה מחוץ לשטח הגן ובתשלום נפרד.
  route: >-
    מדובר בכ-380 ק״מ ובכחמש שעות ושלושת רבעי מטביליסי. סעו בכביש E60 עד בטומי, ומשם המשיכו צפונה בכביש
    החוף לכיוון הכף הירוק: ממרכז העיר אל הגן 9 ק״מ בלבד, כעשרים דקות. הכביש סלול לכל אורכו, אם כי הקטע
    האחרון צר ומתפתל עם אפשרויות עקיפה מוגבלות. רכב חסכוני מספיק לחלוטין. תדלקו בבטומי. בימי הקיץ החניון
    מתמלא, ולכן כדאי להגיע מוקדם.
ar:
  name: حديقة باتومي النباتية
  short: أكثر من مئة هكتار على رأس يعلو البحر، وفيها تسع مناطق نباتية من العالم متجاورة.
  body: >-
    تقع حديقة باتومي النباتية شمال المدينة على الرأس الأخضر، وتنحدر على سفح يطل مباشرة على البحر. أسسها
    عام 1912 عالم النبات والجغرافي الروسي أندريه كراسنوف، وهي اليوم تغطي أكثر من مئة هكتار، ما يجعلها
    من أكبر المجموعات النباتية في المنطقة.


    وبنيتها غير مألوفة. تنقسم الحديقة إلى أقسام نباتية يمثل كل منها جزءاً محدداً من العالم: شرق آسيا وأمريكا
    الشمالية وأستراليا وحوض المتوسط والهيمالايا والمكسيك وكولخيس، وكلها موصولة بممرات. وبفضل المناخ شبه
    المداري الرطب تنمو هنا نباتات ما كانت لتصمد في أي مكان آخر في جورجيا — أحراج الخيزران والكافور والنخيل
    والماغنوليا.


    ومن الناحية العملية:


    - **الموقع واسع وشديد الانحدار** — والجولة الكاملة تستغرق ساعتين إلى ثلاث

    - **الإطلالة الرئيسية** تنفتح من الممرات العليا على البحر وعلى ساحل الرأس الأخضر

    - **حافلة نقل** تعمل بين المدخلين العلوي والسفلي


    الربيع أفضل المواسم، حين تزهر الماغنوليا والأزاليا، لكن الحديقة مفتوحة طوال العام وتبقى خضراء في الشتاء.
    وحتى في يوم رمادي يكون الضوء تحت الظلة مناسباً للتصوير، وهذه فائدة حقيقية بالنظر إلى كثرة الغيوم على
    ساحل أدجارا.
  tip: >-
    البس حذاءً مريحاً: الحديقة على منحدر بصعود وهبوط متواصلين، وستقطع عادة أكثر من خمسة كيلومترات. وإن
    كنت تفضل ألا تمشيها كلها، فادخل من البوابة العليا واخرج من السفلى وعد بحافلة النقل. الماء والقبعة
    مهمان صيفاً، وواقي المطر في أي فصل — فطقس أدجارا يتبدل بسرعة وتصبح الممرات زلقة. المقاهي ودورات المياه
    عند المدخلين. والوقوف خارج الحديقة وبرسم منفصل.
  route: >-
    تبعد نحو 380 كم وقرابة خمس ساعات وثلاثة أرباع عن تبليسي. اسلك الطريق E60 نزولاً إلى باتومي، ثم تابع
    شمالاً على طريق الساحل نحو الرأس الأخضر: من وسط المدينة إلى الحديقة 9 كم فقط، أي نحو عشرين دقيقة.
    الطريق معبّد على امتداده، وإن كان المقطع الأخير ضيقاً وكثير المنعطفات مع فرص تجاوز محدودة. وسيارة
    اقتصادية تكفي تماماً. املأ الخزان في باتومي. وفي أيام الصيف يمتلئ الموقف، فالوصول مبكراً يستحق العناء.
