ka:
  name: ჯაჯის ტბა
  short: >-
    მარტოსული მთის ტბა დაახლოებით 2650 მეტრზე, გურიისა და სამცხე-ჯავახეთის საზღვარზე; აქამდე გრძელი ჯიპის
    გზა და ბოლოს ფეხით სავალი ბილიკი მიდის.
  body: >-
    **ჯაჯის ტბას არც წერილობითი ისტორია აქვს, არც ნაპირზე სამლოცველო და არც ჩაწერილი ლეგენდა — მხოლოდ
    წყალია, ქედის ჩაღრმავებაში ჩაწოლილი, ზღვის დონიდან დაახლოებით 2650 მეტრზე.**


    ტბა წყალგამყოფზე დევს, იქ, სადაც გურიის ჩოხატაურის მთიანეთი სამცხე-ჯავახეთის ადიგენის მუნიციპალიტეტს
    ესაზღვრება. დასავლეთით მიწა სუფსისა და გურიის ძველი საზაფხულო საძოვრებისკენ ეშვება — იმ მხარისკენ,
    სადაც ბახმარო და გომისმთა მდებარეობს, ორივე რამდენიმე ასეული მეტრით დაბლა. მეორე მხარეს ფერდობი ადიგენისა
    და მესხეთისკენ იხრება. ადგილობრივი გიდები აღნიშნავენ, რომ ჩოხატაურის მუნიციპალიტეტში ბუნებრივი ტბა
    თითქმის არ არის, ამიტომ ეს მოკრძალებული აუზი უფრო იშვიათი მოვლენაა, ვიდრე მისი ზომა გვაფიქრებინებს.


    აქ მთავარი თავად ასვლაა. ადიგენის მუნიციპალიტეტის სოფელ დერცელიდან გრუნტის გზა ჯერ ტყით, მერე კი ღია
    მდელოებით 800-იოდე მეტრით მაღლა მიიკლაკნება, ბოლო კილომეტრი კი ციცაბო სავალია, დაახლოებით 350 მეტრის
    აღმართით. ტყის ზოლს რომ გასცდებით, ყოველ მოსახვევთან ჰორიზონტი ფართოვდება, ზემოთ კი ადამიანის ნაშენი
    აღარაფერია: ბალახი, კლდე, ქარი და წყალი, რომელიც ცის ფერს იღებს.


    არც ერთი სანდო წყარო არ ასახელებს ტბის სიღრმეს და არც მისი სახელის მნიშვნელობას ხსნის, ამიტომ ამ გვერდზე
    არც ერთს არ მოვიგონებთ. აქ სიმაღლისთვის, სიჩუმისა და შორეული ქედებისთვის ამოდიან. ტბა კი დარჩეს ისეთი
    უბრალო, როგორიც არის.
  tip: >-
    ჯაჯის ტბაზე მხოლოდ ივნისიდან სექტემბრამდე და მხოლოდ მშვიდ ამინდში წადით: ამ სიმაღლეზე თოვლი გზას გვიან
    გაზაფხულამდე კეტავს და ოქტომბრიდან ისევ ხურავს, ზაფხულის შუადღეც კი სწრაფად ცივდება და ღრუბლდება.
    ტბასთან არაფერია — არც წყალი, არც საჭმელი, არც ტუალეტი ან თავშესაფარი; არც მობილური კავშირის იმედი
    გქონდეთ. წაიღეთ საკვები, წყალი, თბილი ტანსაცმელი და პორტატული დამტენი, და ვინმეს უთხარით, სად მიდიხართ.
    გზის შესახებ ცნობები მწირია: ადიგენში იკითხეთ ან ადგილობრივი მძღოლი დაიქირავეთ, რომელმაც ეს გზა კარგად
    იცის. შესვლა უფასოა. თბილისიდან ერთ დღეში ვერ მოასწრებთ: ღამე ახალციხეში ან ადიგენში გაათიეთ, იქიდან
    ტბას მთელი დღე დაუთმეთ, უკან დაბრუნებისას კი ზარზმის მონასტერსაც ესტუმრეთ.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთით ხაშურამდე იარეთ, იქიდან S8-ით სამხრეთით, ბორჯომის გავლით, ახალციხემდე.
    ახალციხიდან შ1-ს ადიგენისა და ბათუმის მიმართულებით ზარზმამდე გაჰყევით; იქ სოფლის გზა ციხისუბნის გავლით
    სოფელ დერცელამდე, დაახლოებით 1500 მეტრამდე, ადის. დერცელიდან დაახლოებით 15-კილომეტრიანი მთის გრუნტის
    გზა 2300 მეტრამდე მიიკლაკნება, ნაპირამდე კი დაახლოებით ერთკილომეტრიანი ციცაბო სავალი რჩება, დაახლოებით
    350 მეტრის აღმართით. სულ დაახლოებით 271 კმ და 7 საათია ცალ მხარეს. საჭიროა ოფროუდ კლასის ნამდვილი
    4x4, მაღალი კლირენსით — ამ გზაზე სხვა მანქანას არაფერი ესაქმება. ავზი ახალციხეში შეავსეთ.
en:
  name: Jaji Lake
  short: >-
    A small, lonely lake at about 2,650 metres on the ridge where Guria meets Samtskhe-Javakheti, reached
    by a long 4x4 track and a final walk.
  body: >-
    **Jaji Lake keeps no written history, no chapel on its shore and no recorded legend: only water, lying
    in a hollow of the ridge some 2,650 metres above the sea.**


    It sits on the watershed where the Chokhatauri highlands of Guria meet Adigeni municipality in Samtskhe-Javakheti.
    To the west the land falls away towards the Supsa and the old summer pastures of Guria, the same country
    that holds the resorts of Bakhmaro and Gomismta, both several hundred metres lower. On the other side
    the slopes lean down towards Adigeni and Meskheti. Local guides note that Chokhatauri municipality
    has almost no natural lakes, which makes this modest basin rarer than its size suggests.


    The climb is the real experience. From Dertseli, a village in Adigeni municipality, a track winds
    some 800 metres upwards, first through forest and then across open meadow, and the last kilometre
    or so is a steep walk with some 350 metres of ascent. Once you clear the trees the horizon widens
    at every bend, and at the top nothing is built at all: grass, rock, wind, and water that takes its
    colour from the sky.


    No reliable source gives the lake's depth or explains its name, and this page will not invent either.
    People come up here for the height, the silence and the long ridgelines. Let the lake be as plain
    as it is.
  tip: >-
    Go only between June and September, and only in settled weather: at this height snow can close the
    track well into spring and again from October, and even a summer afternoon can turn cold and cloudy
    fast. There is nothing at the lake, no water, food, toilets or shelter, and you should not count on
    phone signal. Carry food, water, warm layers and a power bank, and tell someone your plan. The access
    is poorly documented, so ask in Adigeni or hire a local driver who knows the track. Entry is free.
    This is not a day trip from Tbilisi: stay overnight in Akhaltsikhe or Adigeni, give the lake a whole
    day from there and stop at Zarzma Monastery on the way back.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, then the S8 south through Borjomi to Akhaltsikhe. From
    Akhaltsikhe follow the Sh1 towards Adigeni and Batumi as far as Zarzma, where a village road turns
    off through Tsikhisubani to Dertseli, at about 1,500 metres. From Dertseli a mountain track of roughly
    15 km climbs to about 2,300 metres, and the final kilometre or so to the shore is a steep walk with
    some 350 metres of ascent. Allow about 271 km and 7 hours one way. Rent an offroad-class 4x4 with
    real ground clearance; nothing less belongs on this track. Fill the tank in Akhaltsikhe.
ru:
  name: Озеро Джаджи
  short: >-
    Маленькое уединённое озеро на высоте около 2650 м, на хребте между Гурией и Самцхе-Джавахети: долгий
    путь на внедорожнике и пешком в конце.
  body: >-
    **У озера Джаджи нет ни письменной истории, ни часовни на берегу, ни записанной легенды — только вода,
    лежащая в чаше хребта примерно в 2650 метрах над морем.**


    Оно расположено на водоразделе, где Чохатаурское высокогорье Гурии сходится с Адигенским муниципалитетом
    Самцхе-Джавахети. К западу земля уходит к Супсе и старым летним пастбищам Гурии — это те же края,
    где находятся курорты Бахмаро и Гомисмта, оба на несколько сотен метров ниже. С другой стороны склоны
    спускаются к Адигени и Месхети. Местные гиды замечают, что естественных озёр в Чохатаурском муниципалитете
    почти нет, и потому эта скромная котловина — куда бо́льшая редкость, чем подсказывают её размеры.


    Главное здесь — сам подъём. От Дерцели, села в Адигенском муниципалитете, дорога петляет вверх примерно
    на 800 метров, сначала лесом, потом открытым лугом, а последний километр — крутой подъём пешком с
    набором примерно 350 метров. Когда лес остаётся позади, горизонт с каждым поворотом раздвигается шире,
    а наверху нет никаких построек: трава, камень, ветер и вода, которая берёт свой цвет у неба.


    Ни один надёжный источник не называет глубину озера и не объясняет его имени, и эта страница не станет
    выдумывать ни того, ни другого. Сюда поднимаются ради высоты, тишины и долгих линий хребтов. Пусть
    озеро остаётся таким же простым, какое оно есть.
  tip: >-
    Ехать стоит только с июня по сентябрь и только в устойчивую погоду: на такой высоте снег может закрывать
    дорогу до поздней весны и снова с октября, а даже летний день способен быстро стать холодным и пасмурным.
    У озера нет ничего — ни воды, ни еды, ни туалетов, ни укрытия, — и на мобильную связь рассчитывать
    не стоит. Возьмите еду, воду, тёплые вещи и пауэрбанк и оставьте кому-нибудь свой маршрут. Подъезд
    почти не описан, поэтому расспросите в Адигени или наймите местного водителя, который знает дорогу.
    Вход свободный. Это не однодневная поездка из Тбилиси: переночуйте в Ахалцихе или Адигени, отведите
    озеру целый день и на обратном пути заезжайте в монастырь Зарзма.
  route: >-
    Из Тбилиси — по E60/S1 на запад до Хашури, затем по S8 на юг через Боржоми до Ахалцихе. От Ахалцихе
    держитесь Sh1 в сторону Адигени и Батуми до Зарзмы, где сельская дорога сворачивает через Цихисубани
    к Дерцели, на высоту около 1500 метров. От Дерцели горная грунтовка длиной около 15 км поднимается
    примерно до 2300 метров, а последний отрезок до берега — крутой подъём пешком около километра, с набором
    примерно 350 м. Рассчитывайте примерно на 271 км и 7 часов в одну сторону. Берите полноприводный автомобиль
    класса «внедорожник» с настоящим клиренсом: ничему меньшему на этой дороге не место. Заправьтесь в
    Ахалцихе.
fa:
  name: دریاچهٔ جاجی
  short: >-
    دریاچه‌ای کوچک و تنها در ارتفاع حدود ۲۶۵۰ متر، بر یال کوهی که گوریا را از سامتسخه-جاواختی جدا می‌کند؛
    با راهی طولانی برای خودروی 4x4 و پیاده‌رویِ پایانی.
  body: >-
    **دریاچهٔ جاجی نه تاریخ مکتوبی دارد، نه کلیسای کوچکی بر کرانه‌اش و نه افسانه‌ای ثبت‌شده: فقط آب است
    که در گودیِ یال کوه، حدود ۲۶۵۰ متر بالاتر از سطح دریا، آرمیده است.**


    دریاچه بر خط آب‌پخشان قرار دارد، جایی که ارتفاعات چوخاتائوری در گوریا به شهرداری آدیگنی در سامتسخه-جاواختی
    می‌رسد. در غرب، زمین به سوی رود سوپسا و ییلاق‌های کهن گوریا پایین می‌رود؛ همان سرزمینی که تفرجگاه‌های
    باخمارو و گومیسمتا را در خود دارد، هر دو چند صد متر پایین‌تر. در سوی دیگر، دامنه‌ها به سمت آدیگنی
    و مسختی سرازیر می‌شوند. راهنمایان محلی یادآوری می‌کنند که شهرداری چوخاتائوری تقریباً هیچ دریاچهٔ طبیعی
    ندارد، و همین این حوضهٔ کوچک و بی‌ادعا را کمیاب‌تر از آن می‌کند که اندازه‌اش نشان می‌دهد.


    تجربهٔ اصلی خودِ صعود است. از درتسلی، روستایی در شهرداری آدیگنی، راهی پیچ‌درپیچ حدود ۸۰۰ متر بالا
    می‌رود، نخست از میان جنگل و سپس از میان مرغزاری باز، و حدود یک کیلومتر پایانی پیاده‌رویِ تندی است
    با نزدیک ۳۵۰ متر صعود. همین که از درختان بیرون می‌زنید، افق در هر پیچ گشاده‌تر می‌شود، و در بالا هیچ
    بنایی نیست: علف، سنگ، باد، و آبی که رنگش را از آسمان می‌گیرد.


    هیچ منبع معتبری عمق دریاچه را نمی‌گوید یا نامش را توضیح نمی‌دهد، و این صفحه هم هیچ‌کدام را از خود
    نمی‌سازد. مردم برای ارتفاع، سکوت و خط‌الرأس‌های دوردست به اینجا می‌آیند. بگذارید دریاچه همان‌قدر ساده
    بماند که هست.
  tip: >-
    فقط از ژوئن تا سپتامبر و فقط در هوای پایدار بروید: در این ارتفاع برف می‌تواند راه را تا اواخر بهار
    و دوباره از اکتبر ببندد، و حتی بعدازظهری تابستانی هم ممکن است ناگهان سرد و ابری شود. کنار دریاچه هیچ‌چیز
    نیست، نه آب، نه غذا، نه سرویس بهداشتی و نه سرپناه، و روی آنتن تلفن همراه هم حساب نکنید. غذا، آب، لباس
    گرم و پاوربانک همراه ببرید و برنامه‌تان را به کسی بگویید. اطلاعات دربارهٔ راه دسترسی اندک است، پس
    در آدیگنی پرس‌وجو کنید یا راننده‌ای محلی بگیرید که مسیر را می‌شناسد. ورود رایگان است. این سفری یک‌روزه
    از تفلیس نیست: شب را در آخالتسیخه یا آدیگنی بمانید، از آنجا یک روز کامل برای دریاچه بگذارید و در راه
    بازگشت به صومعهٔ زارزما سر بزنید.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب تا خاشوری بروید، سپس با S8 به جنوب و از راه بورجومی تا آخالتسیخه.
    از آخالتسیخه جادهٔ Sh1 را به سوی آدیگنی و باتومی تا زارزما دنبال کنید؛ آنجا جاده‌ای روستایی از تسیخیسوبانی
    به سمت درتسلی، در ارتفاع حدود ۱۵۰۰ متر، جدا می‌شود. از درتسلی راهی کوهستانی به طول تقریبی ۱۵ کیلومتر
    تا حدود ۲۳۰۰ متر بالا می‌رود و حدود یک کیلومتر پایانی تا کنار آب پیاده‌رویِ تندی است با نزدیک ۳۵۰
    متر صعود. برای هر طرف حدود ۲۷۱ کیلومتر و ۷ ساعت در نظر بگیرید. خودروی 4x4 از ردهٔ آفرود با فاصلهٔ
    واقعی کف از زمین اجاره کنید؛ خودرویی کمتر از این در این راه جایی ندارد. باک را در آخالتسیخه پر کنید.
he:
  name: אגם ג'אג'י
  short: >-
    אגם קטן ובודד בגובה של כ-2,650 מטר, על הרכס שבו גוריה נפגשת עם סמצחה-ג'וואחתי; מגיעים אליו בדרך ארוכה
    ברכב 4x4 ובהליכה בקטע האחרון.
  body: >-
    **לאגם ג'אג'י אין היסטוריה כתובה, אין קפלה על גדתו ואין אגדה מתועדת: רק מים, השוכנים בשקע שברכס כ-2,650
    מטר מעל פני הים.**


    הוא שוכן על קו פרשת המים, במקום שבו הרמות של צ'וחאטאורי שבגוריה פוגשות את מוניציפליטת אדיגני שבסמצחה-ג'וואחתי.
    ממערב יורדת הקרקע לעבר נהר סופסה ואל שטחי המרעה הקייציים הוותיקים של גוריה – אותו חבל ארץ שבו נמצאים
    אתרי הנופש בחמארו וגומיסמטה, שניהם נמוכים ממנו בכמה מאות מטרים. מהצד השני נוטים המדרונות אל אדיגני
    ומסחתי. מדריכים מקומיים מציינים שבמוניציפליטת צ'וחאטאורי כמעט אין אגמים טבעיים, ולכן האגן הצנוע הזה
    נדיר יותר ממה שגודלו מרמז.


    העלייה עצמה היא החוויה האמיתית. מדרצלי, כפר במוניציפליטת אדיגני, מתפתלת דרך כ-800 מטר כלפי מעלה, תחילה
    דרך יער ואחר כך על פני אחו פתוח, והקילומטר האחרון בערך הוא הליכה תלולה עם כ-350 מטר טיפוס. ברגע שיוצאים
    מן העצים האופק מתרחב בכל עיקול, ולמעלה אין שום מבנה: עשב, סלע, רוח, ומים ששואלים את צבעם מן השמיים.


    שום מקור אמין אינו מציין את עומק האגם או מסביר את שמו, והעמוד הזה לא ימציא לא את זה ולא את זה. אנשים
    עולים לכאן בשביל הגובה, השקט וקווי הרכס הארוכים. תנו לאגם להישאר פשוט כמו שהוא.
  tip: >-
    סעו רק בין יוני לספטמבר, ורק במזג אוויר יציב: בגובה הזה שלג עלול לחסום את הדרך עד מאוחר באביב ושוב
    החל מאוקטובר, וגם אחר צהריים של קיץ יכול להפוך במהירות לקר ומעונן. ליד האגם אין דבר – לא מים, לא אוכל,
    לא שירותים ולא מחסה – ואל תסמכו על קליטה סלולרית. קחו אוכל, מים, בגדים חמים וסוללה ניידת, וספרו למישהו
    על התוכנית שלכם. הדרך מתועדת בצורה דלה, לכן שאלו באדיגני או שכרו נהג מקומי שמכיר אותה. הכניסה חופשית.
    זה לא טיול של יום מטביליסי: לינו באחלציחה או באדיגני, הקדישו לאגם יום שלם משם ועצרו במנזר זרזמה בדרך
    חזרה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, ואז דרומה בכביש S8 דרך בורג'ומי עד אחלציחה. מאחלציחה המשיכו
    בכביש Sh1 לכיוון אדיגני ובטומי עד זרזמה, שם מתפצלת דרך כפרית העוברת בציחיסובאני אל דרצלי, בגובה של
    כ-1,500 מטר. מדרצלי מטפסת דרך הררית באורך של כ-15 ק״מ עד לגובה של כ-2,300 מטר, והקילומטר האחרון בערך
    עד שפת האגם הוא הליכה תלולה עם כ-350 מטר טיפוס. חשבו על כ-271 ק״מ ו-7 שעות לכל כיוון. שכרו רכב 4x4
    מקבוצת רכבי השטח עם מרווח גחון אמיתי; לרכב פחות מזה אין מה לחפש בדרך הזאת. תדלקו באחלציחה.
ar:
  name: بحيرة جاجي
  short: >-
    بحيرة صغيرة منعزلة على ارتفاع نحو 2,650 متراً فوق الحافة الجبلية التي تلتقي عندها غوريا بسامتسخه-جافاخيتي،
    تُبلغ بمسلك طويل للدفع الرباعي ثم مشياً.
  body: >-
    **لا تاريخ مكتوباً لبحيرة جاجي، ولا كنيسة صغيرة على شاطئها، ولا أسطورة مدوّنة: ماء فحسب، يرقد في تجويف
    من الحافة الجبلية على ارتفاع نحو 2,650 متراً فوق سطح البحر.**


    تقع البحيرة على خط تقسيم المياه حيث تلتقي مرتفعات تشوخاتاوري في غوريا ببلدية أديغيني في سامتسخه-جافاخيتي.
    غرباً تنحدر الأرض نحو نهر سوبسا والمراعي الصيفية القديمة لغوريا، وهي المنطقة نفسها التي تضم منتجعي
    باخمارو وغوميسمتا، وكلاهما أدنى منها ببضع مئات من الأمتار. وعلى الجانب الآخر تميل المنحدرات نحو أديغيني
    ومسخيتي. ويلاحظ الأدلّاء المحليون أن بلدية تشوخاتاوري تكاد تخلو من البحيرات الطبيعية، وهذا ما يجعل
    هذا الحوض المتواضع أندر مما يوحي به حجمه.


    الصعود هو التجربة الحقيقية. من ديرتسيلي، وهي قرية في بلدية أديغيني، يتلوّى مسلك صاعداً نحو 800 متر،
    أولاً عبر الغابة ثم عبر مرج مكشوف، ويبقى نحو كيلومتر أخير مشياً على منحدر شديد بصعود قرابة 350 متراً.
    وما إن تخلّف الأشجار وراءك حتى يتسع الأفق عند كل منعطف، وفي الأعلى لا شيء مبنيّ على الإطلاق: عشب وصخر
    وريح، وماء يستعير لونه من السماء.


    لا يذكر أي مصدر موثوق عمق البحيرة ولا يفسّر اسمها، ولن تخترع هذه الصفحة شيئاً من ذلك. يصعد الناس إلى
    هنا من أجل الارتفاع والسكون وخطوط الحواف الممتدة. فلتبقَ البحيرة بسيطة كما هي.
  tip: >-
    لا تذهب إلا بين يونيو وسبتمبر، وفي طقس مستقر فقط: على هذا الارتفاع قد يغلق الثلج المسلك حتى أواخر
    الربيع ثم مجدداً منذ أكتوبر، وحتى ظهيرة صيفية قد تنقلب باردة غائمة بسرعة. لا شيء عند البحيرة: لا ماء
    ولا طعام ولا دورات مياه ولا مأوى، ولا تعوّل على إشارة الهاتف. احمل طعاماً وماءً وملابس دافئة وبطارية
    متنقلة، وأخبر أحداً بخطتك. المعلومات عن الطريق شحيحة، فاسأل في أديغيني أو استأجر سائقاً محلياً يعرف
    المسلك. الدخول مجاني. ليست رحلة يوم واحد من تبليسي: بِت ليلتك في أخالتسيخه أو أديغيني، وخصّص للبحيرة
    يوماً كاملاً انطلاقاً من هناك، وتوقّف عند دير زارزما في طريق العودة.
  route: >-
    من تبليسي اسلك E60/S1 غرباً حتى خاشوري، ثم S8 جنوباً عبر بورجومي إلى أخالتسيخه. ومن أخالتسيخه اتبع
    Sh1 باتجاه أديغيني وباتومي حتى زارزما، حيث يتفرّع طريق قروي عبر تسيخيسوباني إلى ديرتسيلي، على ارتفاع
    نحو 1,500 متر. ومن ديرتسيلي يصعد مسلك جبلي بطول 15 كم تقريباً حتى نحو 2,300 متر، ثم يبقى نحو كيلومتر
    حتى الشاطئ مشياً على منحدر شديد بصعود قرابة 350 متراً. احسب نحو 271 كم و7 ساعات في الاتجاه الواحد.
    استأجر سيارة دفع رباعي من فئة الطرق الوعرة بخلوص أرضي حقيقي؛ فلا مكان لما هو أقل منها على هذا المسلك.
    املأ الخزان في أخالتسيخه.
