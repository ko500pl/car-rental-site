ka:
  name: ლენტეხი
  short: >-
    ქვემო სვანეთის ცენტრი ცხენისწყლის ხეობაში — მწვანე, ტყიანი და თითქმის უტურისტო.
  body: >-
    **ლენტეხი ქვემო სვანეთის ცენტრია და საქართველოს ერთ-ერთი ყველაზე ნაკლებად მონახულებადი მუნიციპალური ცენტრი.** ის მდინარე ცხენისწყლის ხეობაში, დაახლოებით შვიდას სამოც მეტრზე დგას; დაბაში ათასნახევარამდე კაცი ცხოვრობს.


    ვინც ზემო სვანეთს იცნობს, აქ სხვას ნახავს. ლენტეხი და მისი გარშემო სოფლები ბევრად დაბლაა, ვიდრე მესტია, კლიმატი უფრო რბილი და ნოტიოა, ხეობა კი ტყით სავსე — წიფელი, რცხილა, მურყანი. კოშკები აქაც არის, მაგრამ ბევრად ნაკლები და მიმოფანტული: ხელედში, ჩიხარეშში, მელეში, ხოლო ზოგი მათგანი ნახევრად ჩამონგრეული. ეს არ არის უშგულის ღია ბარათი, არამედ სვანური არქიტექტურის უფრო ჩუმი და დაუმუშავებელი ვერსია.


    ისტორიულად ქვემო სვანეთი დადიანების, შემდეგ კი დადეშქელიანების გავლენის ქვეშ იყო და მუდამ ცალკე რჩებოდა როგორც ზემო სვანეთისგან, ისე ლეჩხუმისგან. ენა ისევ სვანურია, თუმცა ლენტეხურ დიალექტზე.


    დაბაში სანახავი ცოტაა — ცენტრალური მოედანი, პატარა მუზეუმი, საბჭოთა შენობები და ცხენისწყალზე გადებული ხიდი. ღირებულება იმაშია, რაც გარშემოა: ხეობა აღმოსავლეთით ვიწროვდება და ცანასა და ზესხოს გავლით ზაგარის უღელტეხილისკენ ადის, საიდანაც ზაფხულში უშგულში გადადიან. ეს გზა მხოლოდ 4x4-ისთვისაა და მხოლოდ ივლის-სექტემბერში.


    ტურისტული ინფრასტრუქტურა მინიმალურია: რამდენიმე გესტჰაუსი, ორიოდე მაღაზია, ბანკომატი. სამაგიეროდ, ხალხმრავლობა არსად არის და ეს მთელი კავკასიის მასშტაბით იშვიათი გახდა.


    ხეობის სახელი — ცხენისწყალი — სიტყვასიტყვით „ცხენის წყალს“ ნიშნავს და ეს მდინარე ლენტეხის მთელ ცხოვრებას განსაზღვრავს: ის ზაგარის ქვეშ იწყება, ლენტეხს ჩამოუყვება და ცაგერთან რიონს უერთდება. ლეჩხუმისგან განსხვავებით, აქ ვაზი თითქმის აღარ არის — ძალიან ნოტიოა. სამაგიეროდ თაფლი, ბოსტნეული და ტყის ნაყოფია. მუნიციპალიტეტის მოსახლეობა ბოლო ოცდაათ წელიწადში რამდენჯერმე შემცირდა და ბევრი სოფელი ზაფხულის თვეებში ცოცხლდება მხოლოდ, როცა თბილისიდან ჩამოდიან.
  tip: >-
    ორი საათი დაბისთვის საკმარისია; ღირს ერთი ღამის გაჩერება, რომ ხეობაში ზემოთ ან კოშკებიან სოფლებში ახვიდე. ბანკომატი აქ ბოლოა — ზესხოს მიმართულებით არაფერია. საკვები მარტივი და შეზღუდულია, ვეგეტარიანულ ვარიანტს წინასწარ შეათანხმე. ამინდი ნოტიოა: წვიმა ზაფხულშიც ხშირია, წყალგაუმტარი ქურთუკი გამოგადგება. ზაგარის უღელტეხილზე გასვლამდე ადგილობრივებთან გადაამოწმე მდგომარეობა — გზა ივლისამდე ხშირად დახურულია.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ წყალტუბოზე, ალპანასა და ცაგერზე — 367 კმ, დაახლოებით ექვსი საათი. ცაგერამდე გზა ასფალტია, ცაგერიდან ლენტეხამდე ორმოცდაათიოდე კილომეტრი კი ცხენისწყლის ხეობას მიუყვება: ვიწრო, ადგილ-ადგილ დაზიანებული საფარით და ჩამონაშალის მონაკვეთებით. კროსოვერი ან SUV უფრო კომფორტულია, თუმცა კარგ ამინდში ჩვეულებრივი მანქანაც ჩადის. საწვავი ქუთაისსა და ცაგერში აიღე.
en:
  name: Lentekhi
  short: >-
    The centre of Lower Svaneti in the Tskhenistskali valley — green, heavily wooded and almost untouched
    by tourism.
  body: >-
    **Lentekhi is the centre of Lower Svaneti and one of the least visited municipal towns in Georgia.** It stands in the valley of the Tskhenistskali at about 760 metres, with a population of roughly fifteen hundred.


    Anyone who knows Upper Svaneti will find something different here. Lentekhi and the villages around it lie far lower than Mestia, the climate is milder and much wetter, and the valley is filled with forest — beech, hornbeam, alder. There are towers, but fewer and scattered: at Kheledi, Chikhareshi and Mele, some of them half collapsed. This is not the postcard of Ushguli but a quieter, unrestored version of the same architecture.


    Historically Lower Svaneti fell under the influence of the Dadiani and later the Dadeshkeliani, and it always stood apart both from Upper Svaneti and from Lechkhumi. The language spoken is still Svan, in the Lentekhi dialect.


    In the town itself there is little to see: a central square, a small museum, Soviet buildings and a bridge over the Tskhenistskali. The value lies in what surrounds it. Eastwards the valley narrows and climbs through Tsana and Zeskho towards the Zagari pass, the summer crossing into Ushguli. That road is for four-wheel drive only and only from July to September.


    Tourist infrastructure is minimal: a few guesthouses, a couple of shops, an ATM. In exchange there are no crowds anywhere, which across the Caucasus has become a rare commodity.


    The name of the valley, Tskhenistskali, means literally "horse water", and the river governs everything here: it rises below the Zagari, runs past Lentekhi and joins the Rioni near Tsageri. Unlike Lechkhumi downstream there is almost no vine — it is simply too wet. What there is instead is honey, vegetables and what the forest gives. The population of the municipality has fallen several times over in the last thirty years, and many of its villages come alive only in the summer months, when families drive up from Tbilisi.
  tip: >-
    Two hours covers the town; it is worth staying a night in order to go further up the valley or out to the tower villages. This is the last ATM — there is nothing at all in the direction of Zeskho. Food is simple and limited, and vegetarian options need arranging in advance. The weather is wet: rain is frequent even in summer, so a waterproof jacket earns its place. Before attempting the Zagari pass, check conditions locally; the road is often shut until July.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head north via Tskaltubo, Alpana and Tsageri — 367 km, about six hours. The road is asphalt as far as Tsageri; the remaining fifty kilometres to Lentekhi follow the Tskhenistskali through a narrow gorge, with a broken surface in places and stretches subject to rockfall. A crossover or SUV is more comfortable, though an ordinary car gets through in good weather. Fuel at Kutaisi and Tsageri.
ru:
  name: Лентехи
  short: >-
    Центр Нижней Сванетии в долине Цхенисцкали — зелёный, сплошь лесистый и почти не тронутый туризмом.
  body: >-
    **Лентехи — центр Нижней Сванетии и один из самых редко посещаемых муниципальных центров Грузии.** Он стоит в долине реки Цхенисцкали примерно на 760 метрах, живёт здесь около полутора тысяч человек.


    Тот, кто знает Верхнюю Сванетию, найдёт тут другое. Лентехи и окрестные сёла лежат намного ниже Местии, климат мягче и заметно влажнее, а ущелье залито лесом — бук, граб, ольха. Башни есть и здесь, но их меньше и они рассеяны: в Хеледи, Чихареши, Меле, часть полуразрушена. Это не открытка Ушгули, а более тихая и нереставрированная версия той же архитектуры.


    Исторически Нижняя Сванетия находилась под влиянием Дадиани, а затем Дадешкелиани и всегда держалась особняком и от Верхней Сванетии, и от Лечхуми. Язык по-прежнему сванский, лентехский диалект.


    В самом городке смотреть почти нечего: центральная площадь, небольшой музей, советская застройка и мост через Цхенисцкали. Ценность в том, что вокруг. На восток ущелье сужается и через Цану и Зесхо поднимается к перевалу Загари — летнему переходу в Ушгули. Эта дорога только для полного привода и только с июля по сентябрь.


    Туристической инфраструктуры минимум: несколько гостевых домов, пара магазинов, банкомат. Взамен — полное отсутствие толп, что на Кавказе стало редкостью.


    Название долины, Цхенисцкали, буквально значит «конская вода», и река определяет здесь всё: она начинается под Загари, проходит мимо Лентехи и впадает в Риони у Цагери. В отличие от Лечхуми ниже по течению, виноградника тут почти нет — слишком влажно. Зато есть мёд, овощи и то, что даёт лес. Население муниципалитета за последние тридцать лет сократилось в несколько раз, и многие сёла оживают только в летние месяцы, когда семьи приезжают из Тбилиси.
  tip: >-
    Двух часов на городок достаточно; ночевать стоит ради того, чтобы уйти выше по ущелью или к башенным сёлам. Это последний банкомат — в сторону Зесхо нет ничего. Еда простая и небогатая, вегетарианские варианты оговаривайте заранее. Погода влажная: дождь частый и летом, непромокаемая куртка себя оправдает. Перед выездом на перевал Загари уточняйте обстановку у местных — дорога нередко закрыта до июля.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на север через Цхалтубо, Алпану и Цагери — 367 км, около шести часов. До Цагери асфальт; оставшиеся пятьдесят километров до Лентехи идут вдоль Цхенисцкали по узкому ущелью, покрытие местами разбито, есть участки камнепада. Кроссовер или внедорожник комфортнее, хотя в хорошую погоду проезжает и обычная машина. Заправки в Кутаиси и Цагери.
fa:
  name: لنتخی
  short: >-
    مرکز سوانتی پایین در درّهٔ تسخنیستسکالی — سرسبز، پوشیده از جنگل و تقریباً دست‌نخورده از گردشگری.
  body: >-
    **لنتخی مرکز سوانتی پایین و یکی از کم‌بازدیدترین مراکز شهرستانی گرجستان است.** در درّهٔ رود تسخنیستسکالی در ارتفاع حدود ۷۶۰ متری ایستاده و نزدیک هزار و پانصد نفر در آن زندگی می‌کنند.


    هر که سوانتی بالا را می‌شناسد اینجا چیز دیگری می‌یابد. لنتخی و روستاهای پیرامونش بسیار پایین‌تر از مستیا هستند، آب‌وهوا ملایم‌تر و به‌مراتب مرطوب‌تر است و درّه پر از جنگل: راش، ممرز و توسکا. برج هم هست، اما کمتر و پراکنده: در خلدی، چیخارشی و مله، و برخی نیمه‌فروریخته. اینجا کارت‌پستال اوشگولی نیست، بلکه روایتی آرام‌تر و مرمت‌نشده از همان معماری است.


    از نظر تاریخی سوانتی پایین زیر نفوذ خاندان دادیانی و سپس دادشکلیانی بود و همواره هم از سوانتی بالا و هم از لچخومی جدا ماند. زبان هنوز سوانی است، به گویش لنتخی.


    در خود شهر دیدنی چندانی نیست: میدان مرکزی، موزه‌ای کوچک، ساختمان‌های دورهٔ شوروی و پلی بر تسخنیستسکالی. ارزش کار در پیرامون آن است. درّه به سمت شرق تنگ می‌شود و از تسانا و زسخو به سوی گردنهٔ زاگاری بالا می‌رود، همان گذر تابستانی به اوشگولی. آن جاده فقط برای چهارچرخ‌محرک است و فقط از تیر تا شهریور.


    زیرساخت گردشگری در کمترین حد است: چند خانهٔ مهمان، دو مغازه، یک خودپرداز. در عوض هیچ‌جا ازدحامی نیست، و این در سراسر قفقاز کالایی کمیاب شده است.


    نام درّه، تسخنیستسکالی، تحت‌اللفظی یعنی «آب اسب»، و رودخانه اینجا همه چیز را تعیین می‌کند: زیر زاگاری سرچشمه می‌گیرد، از کنار لنتخی می‌گذرد و نزدیک تساگری به ریونی می‌ریزد. برخلاف لچخومیِ پایین‌دست، اینجا تاک تقریباً نیست، چون هوا بیش از حد مرطوب است. در عوض عسل هست و سبزی و آنچه جنگل می‌دهد. جمعیت شهرستان در سی سال گذشته چند برابر کاهش یافته و بسیاری از روستاها تنها در ماه‌های تابستان جان می‌گیرند، وقتی خانواده‌ها از تفلیس بالا می‌آیند.
  tip: >-
    دو ساعت برای شهر کافی است؛ اما یک شب ماندن می‌ارزد تا بتوانید بالاتر در درّه یا به روستاهای برج‌دار بروید. این آخرین خودپرداز است؛ به سمت زسخو هیچ چیز نیست. غذا ساده و محدود است و گزینهٔ گیاهی را باید از پیش هماهنگ کرد. هوا مرطوب است: باران حتی در تابستان زیاد می‌بارد و کاپشن ضدآب به کار می‌آید. پیش از رفتن به گردنهٔ زاگاری وضعیت را از اهالی بپرسید؛ جاده اغلب تا تیرماه بسته است.
  route: >-
    از تفلیس با E60 تا کوتائیسی، سپس به شمال از تسخالتوبو، آلپانا و تساگری — ۳۶۷ کیلومتر، حدود شش ساعت. تا تساگری جاده آسفالت است؛ پنجاه کیلومتر باقی‌مانده تا لنتخی در تنگه‌ای باریک کنار تسخنیستسکالی می‌رود، با روکش جابه‌جا شکسته و بخش‌هایی در معرض ریزش سنگ. کراس‌اور یا شاسی‌بلند راحت‌تر است، هرچند در هوای خوب خودروی معمولی هم می‌گذرد. سوخت در کوتائیسی و تساگری.
he:
  name: לנטחי
  short: >-
    מרכזה של סוונטי התחתונה בעמק הצחניסצקאלי — ירוקה, מיוערת מאוד וכמעט לא נגועה בתיירות.
  body: >-
    **לנטחי היא מרכזה של סוונטי התחתונה ואחת מעיירות המחוז הפחות מבוקרות בגאורגיה.** היא עומדת בעמק נהר הצחניסצקאלי בגובה כ-760 מטר, ומונה כאלף וחמש מאות תושבים.


    מי שמכיר את סוונטי העליונה ימצא כאן משהו אחר. לנטחי והכפרים סביבה נמוכים בהרבה ממסטיה, האקלים מתון ולח הרבה יותר, והעמק מלא יער — אשור, גרגרן ואלמון. יש גם מגדלים, אך פחות ומפוזרים: בחלדי, בצ'יחארשי ובמלה, וחלקם קרוסים למחצה. זו אינה גלויית הנוף של אושגולי אלא גרסה שקטה ולא משוחזרת של אותה אדריכלות.


    היסטורית הייתה סוונטי התחתונה תחת השפעת בית דאדיאני ואחר כך דאדשקליאני, ותמיד עמדה בנפרד הן מסוונטי העליונה והן מלצ'חומי. השפה עודנה סוואנית, בניב לנטחי.


    בעיירה עצמה אין הרבה לראות: כיכר מרכזית, מוזיאון קטן, בנייה סובייטית וגשר על הצחניסצקאלי. הערך הוא במה שסביב. מזרחה מצטמצם העמק ומטפס דרך צאנה וזסחו אל מעבר זאגארי, המעבר הקיצי אל אושגולי. הדרך הזאת מיועדת להנעה כפולה בלבד ורק מיולי עד ספטמבר.


    התשתית התיירותית מזערית: כמה בתי הארחה, שתי חנויות וכספומט. בתמורה אין המונים בשום מקום, וזה הפך ברחבי הקווקז למצרך נדיר.


    שם העמק, צחניסצקאלי, פירושו המילולי "מי סוס", והנהר קובע כאן הכול: הוא נובע מתחת לזאגארי, חולף על פני לנטחי ונשפך אל הריוני ליד צאגרי. בשונה מלצ'חומי שבמורד, כמעט אין כאן גפן — פשוט לח מדי. במקום זאת יש דבש, ירקות ומה שהיער נותן. אוכלוסיית המחוז ירדה פי כמה בשלושים השנים האחרונות, ורבים מכפריו מתעוררים רק בחודשי הקיץ, כשמשפחות עולות לכאן מטביליסי.
  tip: >-
    שעתיים מכסות את העיירה; שווה ללון כדי להמשיך במעלה העמק או אל כפרי המגדלים. זהו הכספומט האחרון — לכיוון זסחו אין דבר. האוכל פשוט ומוגבל, ואפשרויות צמחוניות דורשות תיאום מראש. מזג האוויר לח: גשם יורד לעיתים קרובות גם בקיץ, ומעיל אטום למים מצדיק את מקומו. לפני יציאה למעבר זאגארי בררו את מצב הדרך אצל מקומיים; היא סגורה לא פעם עד יולי.
  route: >-
    מטביליסי בכביש E60 עד קותאיסי, ומשם צפונה דרך צחלטובו, אלפאנה וצאגרי — 367 ק״מ, כשש שעות. עד צאגרי הכביש סלול; חמישים הקילומטרים הנותרים ללנטחי עוברים בנקיק צר לאורך הצחניסצקאלי, עם מיסעה שבורה במקומות וקטעים החשופים לנפילת אבנים. רכב פנאי או ג'יפ נוחים יותר, אם כי במזג אוויר טוב עוברת גם מכונית רגילה. דלק בקותאיסי ובצאגרי.
ar:
  name: لنتيخي
  short: >-
    مركز سوانيتي السفلى في وادي تسخينيستسكالي — خضراء كثيفة الغابات وشبه خالية من السياحة.
  body: >-
    **لنتيخي مركز سوانيتي السفلى، وواحدة من أقل بلدات جورجيا الإدارية زيارةً.** تقف في وادي نهر تسخينيستسكالي عند نحو 760 متراً، ويسكنها قرابة ألف وخمسمائة نسمة.


    من يعرف سوانيتي العليا سيجد هنا شيئاً آخر. فلنتيخي والقرى حولها أخفض بكثير من مستيا، والمناخ ألطف وأشد رطوبة، والوادي مغمور بالغابات: زان وغرب وحور. والأبراج موجودة، لكنها أقل ومتفرقة: في خيليدي وتشيخاريشي وميلي، وبعضها منهار إلى النصف. هذه ليست بطاقة أوشغولي البريدية بل نسخة أهدأ وغير مرمّمة من العمارة نفسها.


    تاريخياً وقعت سوانيتي السفلى تحت نفوذ آل دادياني ثم آل داديشكيلياني، وظلت دوماً منفصلة عن سوانيتي العليا وعن لتشخومي معاً. واللغة ما زالت السوانية بلهجة لنتيخي.


    في البلدة ذاتها قليل مما يُرى: ساحة مركزية ومتحف صغير وعمارة سوفييتية وجسر على تسخينيستسكالي. والقيمة فيما حولها. فإلى الشرق يضيق الوادي ويصعد عبر تسانا وزيسخو نحو ممر زاغاري، وهو المعبر الصيفي إلى أوشغولي. وذلك الطريق للدفع الرباعي وحده ومن تموز إلى أيلول فقط.


    البنية السياحية في أدنى حدودها: بضعة بيوت ضيافة ودكانان وصراف آلي. وفي المقابل لا ازدحام في أي موضع، وهذه سلعة صارت نادرة في القوقاز كله.


    اسم الوادي، تسخينيستسكالي، يعني حرفياً «ماء الحصان»، والنهر يحكم كل شيء هنا: ينبع تحت زاغاري، ويمرّ بلنتيخي، ويصبّ في ريوني قرب تساغيري. وخلافاً للتشخومي في الأسفل لا تكاد توجد هنا كروم، فالجو مفرط الرطوبة. وما يوجد بدلاً منها عسل وخضار وما تعطيه الغابة. وقد تراجع عدد سكان البلدية عدة أضعاف في الثلاثين سنة الأخيرة، ولا تدبّ الحياة في كثير من قراها إلا في شهور الصيف حين تصعد العائلات من تبليسي.
  tip: >-
    ساعتان تغطيان البلدة؛ ويستحق المبيت ليلة كي تصعد أعلى في الوادي أو تقصد قرى الأبراج. هذا آخر صراف آلي، ولا شيء البتة في اتجاه زيسخو. الطعام بسيط ومحدود، وخيارات النباتيين تحتاج ترتيباً مسبقاً. الطقس رطب: المطر متكرر حتى في الصيف، والسترة الواقية تستحق حملها. وقبل قصد ممر زاغاري تحقق من الحال لدى الأهالي؛ فالطريق يبقى مغلقاً كثيراً حتى تموز.
  route: >-
    من تبليسي على الطريق E60 إلى كوتايسي، ثم شمالاً عبر تسخالتوبو وألبانا وتساغيري — 367 كم، نحو ست ساعات. الطريق معبّد حتى تساغيري؛ أما الخمسون كيلومتراً المتبقية إلى لنتيخي فتتبع تسخينيستسكالي في مضيق ضيق، بسطح متكسر في مواضع ومقاطع معرّضة لسقوط الصخور. سيارة العبور أو الدفع الرباعي أريح، وإن كانت السيارة العادية تمرّ في الطقس الجيد. الوقود في كوتايسي وتساغيري.
