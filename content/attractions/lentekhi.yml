ka:
  name: ლენტეხი
  short: >-
    ქვემო სვანეთის მშვიდი ცენტრი ცხენისწყლის ხეობაში: სვანური კოშკები, წიფლნარი და შადრევანი, რომელზეც
    ქალღმერთი ვერ მოხვდა.
  body: >-
    **ლენტეხი სვანეთია სარეკლამო ბარათების გარეშე: იგივე კოშკები და იგივე უძველესი ენა, ოღონდ მყინვარების
    ნაცვლად წიფლის ტყით გარშემორტყმული — და თითქმის ტურისტის გარეშე.**


    დაბა ქვემო სვანეთის ცენტრია და ზღვის დონიდან დაახლოებით 760 მეტრზე, ცხენისწყლის შენაკადზე, მდინარე
    ლასკადურაზე დგას; 2014 წლის აღწერით აქ 947 კაცი ცხოვრობდა. რაიონული ცენტრი 1930 წელს გახდა, 1953 წლამდე
    კი ლექსურა ერქვა. სოფელ ლექსურაში დღესაც დგას ის სვანური კოშკები, რომლებითაც ეს კუთხე განთქმულია,
    ირგვლივ კი IX–XI საუკუნეების მცირე ეკლესიები და დადიანებთან დაკავშირებული ციხის ნაშთებია.


    ისტორიას აქ სხვები წერდნენ. ქვემო სვანეთს თავდაპირველად გელოვანები ფლობდნენ, შემდეგ კი იგი დროებით
    სამეგრელოს მთავრებმა, დადიანებმა, დაიმორჩილეს, მაშინ როცა ზემო სვანეთი საკუთარ გზას ადგა. აქაურები
    მაინც დღემდე სვანურად ლაპარაკობენ — ლენტეხურ კილოზე.


    ეს მესტიისაზე მწვანე და ნოტიო სვანეთია: წელიწადში 1240 მილიმეტრი ნალექი, ივლისის საშუალო ტემპერატურა
    20 გრადუსი, ფერდობებზე წიფლნარი. ცხენისწყალი მუნიციპალიტეტის აღმოსავლეთით, კავკასიონის მთავარი ქედის
    ქვეშ იწყება და 176 კილომეტრის შემდეგ, სამტრედიასთან, რიონს ერთვის.


    2019 წელს დაბის მთავარ მოედანზე შადრევნის აშენება დაიგეგმა, რომელზეც დალი — ნადირობის ქალღმერთი სვანურ
    მითოლოგიაში — უნდა ყოფილიყო გამოსახული. ცაგერისა და ლენტეხის მიტროპოლიტმა ეს კერპთაყვანისმცემლობად
    შეაფასა, მერმა კი განაცხადა, რომ პროექტი შადრევნის ეფექტიანობისა და იერის გამო შეიცვალა. შადრევანი
    დალის გარეშე აშენდა.


    დალი მოედანზე ვერ ჩამოვიდა. მაგრამ ის ხომ ყოველთვის მთის ქალღმერთი იყო.
  tip: >-
    დაბას საათი-ორი ეყოფა; სჯობს, ღამე აქ გაათიოთ და ლენტეხი ბაზად გამოიყენოთ: ლექსურის კოშკები, გვერდითი
    ხეობები, ზაფხულში კი გზა აღმოსავლეთით, ზაგარის უღელტეხილისკენ. ლენტეხში საოჯახო სასტუმროები, მაღაზიები
    და ბანკომატია; აღმოსავლეთით, ცანასა და ზესხოსკენ, ამათგან არაფრის იმედი არ იქონიოთ. წყალგაუმტარი ქურთუკი
    წამოიღეთ — აქ ივლისიც წვიმიანია. ზაგარის გზა უშგულამდე მხოლოდ ოთხწამყვანიანი მანქანებისთვისაა და,
    საუკეთესო შემთხვევაში, ივნისიდან სექტემბრამდეა გახსნილი; გასვლამდე ადგილობრივებს ჰკითხეთ. გაზაფხულობით
    დაბის თავზე, მთაზე მდგარ ეკლესიასთან დღესასწაული იმართება — თარიღი მასპინძელს ჰკითხეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ16-ით ჩრდილოეთით, რიონის ხეობით, ტვიშის გავლით
    ალპანამდე, შ18-ით ცაგერამდე და ბოლოს შ15-ით, ცხენისწყლის აყოლებით, დაახლოებით 21 კილომეტრი ლენტეხამდე.
    სულ დაახლოებით 345 კმ და ხუთნახევარი საათის სავალია. გზა თითქმის მთლიანად ასფალტიანია, მაგრამ ცაგერის
    შემდეგ ვიწროა, ადგილ-ადგილ დაზიანებული, ძლიერი წვიმის შემდეგ კი ქვაცვენა იშვიათი არ არის. მშრალ ამინდში
    ეკონომ-კლასის მანქანაც ჩავა, თუმცა ჯიპი — ჩვენ მიერ რეკომენდებული კლასი — უფრო კომფორტულია. საწვავი
    ქუთაისში ჩაასხით; ცაგერში ბენზინგასამართი არის, მაგრამ არჩევანი მცირეა.
en:
  name: Lentekhi
  short: >-
    The quiet centre of Lower Svaneti in the Tskhenistskali valley: Svan towers, beech forest, and a town
    fountain that never got its goddess.
  body: >-
    **Lentekhi is Svaneti without the postcards: the same towers and the same ancient language, ringed
    by beech forest instead of glaciers, and hardly a tourist to share them with.**


    The town is the centre of Lower Svaneti. It stands at about 760 metres on the Laskadura, a tributary
    of the Tskhenistskali, and the 2014 census counted 947 people. It became a district centre in 1930
    and was called Leksura until 1953. The village of Leksura still keeps the Svan towers the district
    is known for, and the country around holds small churches of the 9th to 11th centuries and the remains
    of a castle linked to the Dadiani.


    History here was written by others. Lower Svaneti was first held by the Gelovani princes, then taken
    for a time by the Dadiani of Mingrelia, while Upper Svaneti went its own way. Yet people here still
    speak Svan, in its Lentekhi dialect.


    This is a greener, wetter Svaneti than Mestia's, with 1,240 mm of precipitation a year, July averaging
    20 °C and beech on the slopes. The river's name, Tskhenistskali, means 'horse water'. It rises under
    the main ridge in the east of the municipality and runs 176 km to join the Rioni near Samtredia.


    In 2019 the town planned a fountain for its main square with a figure of Dali, the goddess of the
    hunt in Svan mythology. The Metropolitan of Tsageri and Lentekhi called it idolatry; the mayor said
    the design had changed for efficiency and looks. The fountain was built without her.


    Dali never came down to the square. She was always a goddess of the high ground.
  tip: >-
    Give the town an hour or two, then stay the night and use it as a base for the towers of Leksura,
    the side valleys and, in summer, the road east towards the Zagari pass. Lentekhi has guesthouses,
    shops and an ATM. Further east, towards Tsana and Zeskho, you will find none of them. Pack a waterproof,
    because even July is wet here. The Zagari road to Ushguli is for 4x4s only and is open from June to
    September at best, so ask locally before you set out. Each spring a festival is held at the church
    on the mountain above town; ask your host for the date.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh16 north up the Rioni gorge through Tvishi
    to Alpana. The Sh18 takes you on to Tsageri, and from there the Sh15 follows the Tskhenistskali for
    about 21 km to Lentekhi. In all it is about 345 km and five and a half hours. The road is almost all
    asphalt, but above Tsageri it is narrow and patched, and rockfall is not unusual after heavy rain.
    An economy car gets through in dry weather, though an SUV, our recommended class, is more comfortable.
    Fill up in Kutaisi. Tsageri has a station, but little choice.
ru:
  name: Лентехи
  short: >-
    Тихий центр Нижней Сванетии в долине Цхенисцкали: сванские башни, буковый лес и городской фонтан,
    так и не дождавшийся своей богини.
  body: >-
    **Лентехи — это Сванетия без открыток: те же башни и тот же древний язык, только вокруг буковый лес
    вместо ледников и почти ни одного туриста рядом.**


    Посёлок — центр Нижней Сванетии. Он стоит на высоте около 760 метров на реке Ласкадуре, притоке Цхенисцкали;
    перепись 2014 года насчитала здесь 947 человек. Районным центром он стал в 1930 году и до 1953-го
    назывался Лексура. Село Лексура по-прежнему хранит сванские башни, которыми славится этот край, а
    в окрестностях стоят маленькие церкви IX–XI веков и остатки замка, связанного с Дадиани.


    Историю здесь писали другие. Нижней Сванетией сначала владели князья Геловани, затем её на время подчинили
    мегрельские Дадиани, тогда как Верхняя Сванетия шла своим путём. И всё же здесь до сих пор говорят
    по-свански, на лентехском диалекте.


    Это более зелёная и влажная Сванетия, чем местийская: 1240 мм осадков в год, в июле в среднем 20 °C,
    на склонах — бук. Название реки Цхенисцкали значит «конская вода». Она берёт начало под Главным хребтом
    на востоке муниципалитета и течёт 176 км, прежде чем влиться в Риони у Самтредиа.


    В 2019 году город задумал поставить на главной площади фонтан с фигурой Дали — богини охоты в сванской
    мифологии. Митрополит Цагерский и Лентехский назвал это идолопоклонством; мэр объяснил, что проект
    изменили ради практичности и внешнего вида. Фонтан построили без неё.


    Дали так и не спустилась на площадь. Она всегда была богиней высокогорья.
  tip: >-
    Дайте городу час-два, а потом останьтесь на ночь и сделайте его базой для поездок к башням Лексуры,
    в боковые долины и, летом, по дороге на восток, к перевалу Загари. В Лентехи есть гостевые дома, магазины
    и банкомат. Дальше на восток, к Цане и Зесхо, ничего этого не будет. Возьмите дождевик: здесь сыро
    даже в июле. Дорога через Загари в Ушгули — только для полноприводных машин и открыта в лучшем случае
    с июня по сентябрь, так что перед выездом расспросите местных. Каждую весну у церкви на горе над городом
    проходит праздник; дату узнайте у хозяев.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh16 на север вверх по ущелью Риони через Твиши
    до Алпаны. Sh18 ведёт дальше, в Цагери, а оттуда Sh15 около 21 км идёт вдоль Цхенисцкали до Лентехи.
    Всего около 345 км и пять с половиной часов. Дорога почти целиком асфальтирована, но выше Цагери она
    узкая и в заплатах, а после сильных дождей камнепады здесь не редкость. В сухую погоду проедет и машина
    эконом-класса, но внедорожник — рекомендуемый нами класс — удобнее. Заправьтесь в Кутаиси: в Цагери
    заправка есть, но выбор невелик.
fa:
  name: لنتخی
  short: >-
    مرکز آرام سوانتی پایین در درهٔ تسخنیستسکالی: برج‌های سوانی، جنگل راش و فواره‌ای در شهر که هرگز به
    الههٔ خود نرسید.
  body: >-
    **لنتخی سوانتیِ بی‌کارت‌پستال است: همان برج‌ها و همان زبان کهن، این بار در حلقهٔ جنگل راش به جای یخچال‌ها،
    و تقریباً بی‌هیچ گردشگری که آن را با شما قسمت کند.**


    این شهرک مرکز سوانتی پایین است. در ارتفاع حدود ۷۶۰ متر بر رود لاسکادورا، شاخابه‌ای از تسخنیستسکالی،
    قرار دارد و سرشماری ۲۰۱۴ در آن ۹۴۷ نفر شمرد. در سال ۱۹۳۰ مرکز بخش شد و تا ۱۹۵۳ لکسورا نام داشت. روستای
    لکسورا هنوز برج‌های سوانی‌ای را که این ناحیه به آن‌ها شناخته می‌شود نگه داشته است، و در پیرامون، کلیساهای
    کوچکی از سده‌های نهم تا یازدهم و بقایای قلعه‌ای وابسته به خاندان دادیانی دیده می‌شود.


    تاریخ اینجا را دیگران نوشتند. سوانتی پایین نخست در دست شاهزادگان گلوانی بود، سپس مدتی به تصرف دادیانی‌های
    مگرلی درآمد، حال آنکه سوانتی بالا راه خود را می‌رفت. با این همه، مردم اینجا هنوز به زبان سوانی، با
    گویش لنتخی، سخن می‌گویند.


    این سوانتی‌ای سبزتر و مرطوب‌تر از سوانتیِ مستیاست: ۱۲۴۰ میلی‌متر بارش در سال، میانگین دمای ژوئیه ۲۰
    درجهٔ سانتی‌گراد و راش بر دامنه‌ها. نام رود تسخنیستسکالی یعنی «آبِ اسب». این رود زیر رشته‌کوه اصلی
    در شرق شهرستان سرچشمه می‌گیرد و ۱۷۶ کیلومتر می‌پیماید تا نزدیک سامتردیا به ریونی بپیوندد.


    در سال ۲۰۱۹ شهر قصد داشت در میدان اصلی‌اش فواره‌ای با پیکرهٔ دالی، الههٔ شکار در اسطوره‌های سوانی،
    بسازد. متروپولیت تساگری و لنتخی آن را بت‌پرستی خواند؛ شهردار گفت طرح برای کارایی و زیبایی تغییر کرده
    است. فواره بی او ساخته شد.


    دالی هرگز به میدان پایین نیامد. او همیشه الههٔ بلندی‌ها بود.
  tip: >-
    یکی دو ساعت به شهر وقت بدهید، سپس شب را بمانید و آن را پایگاهی کنید برای برج‌های لکسورا، دره‌های فرعی
    و، در تابستان، جاده‌ای که به شرق، به سوی گردنهٔ زاگاری، می‌رود. لنتخی مهمان‌خانه، مغازه و خودپرداز
    دارد. دورتر به شرق، به سوی تسانا و زسخو، هیچ‌کدام از این‌ها نیست. بارانی همراه داشته باشید، چون اینجا
    حتی ژوئیه هم نمناک است. جادهٔ زاگاری به اوشگولی فقط برای خودروهای چهارچرخ محرک است و در بهترین حالت
    از ژوئن تا سپتامبر باز است، پس پیش از راه افتادن از اهالی بپرسید. هر بهار در کلیسای روی کوهِ بالای
    شهر جشنی برگزار می‌شود؛ تاریخش را از میزبانتان بپرسید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا کوتائیسی بروید، سپس Sh16 را به شمال در امتداد تنگهٔ ریونی
    از میان تویشی تا آلپانا. Sh18 شما را به تساگری می‌برد و از آنجا Sh15 حدود ۲۱ کیلومتر در امتداد تسخنیستسکالی
    تا لنتخی می‌رود. روی‌هم حدود ۳۴۵ کیلومتر و پنج ساعت و نیم. جاده تقریباً سراسر آسفالت است، اما بالاتر
    از تساگری باریک و وصله‌پینه‌شده است و پس از باران‌های سنگین ریزش سنگ غیرعادی نیست. در هوای خشک خودروی
    اقتصادی هم از پسش برمی‌آید، هرچند خودروی شاسی‌بلند، ردهٔ پیشنهادی ما، راحت‌تر است. در کوتائیسی سوخت
    بزنید؛ تساگری پمپ‌بنزین دارد، اما انتخاب اندک است.
he:
  name: לנטחי
  short: 'המרכז השקט של סוואנטי התחתונה בעמק הצחניסצקאלי: מגדלים סוואניים, יער אשור, ומזרקה עירונית שלא
    זכתה לאלה שלה.'
  body: >-
    **לנטחי היא סוואנטי בלי הגלויות: אותם מגדלים ואותה שפה עתיקה, מוקפים יער אשור במקום קרחונים, וכמעט
    בלי תיירים לחלוק איתם.**


    העיירה היא מרכזה של סוואנטי התחתונה. היא שוכנת בגובה של כ-760 מטר על נהר הלסקדורה, יובל של הצחניסצקאלי,
    ומפקד 2014 מנה בה 947 תושבים. ב-1930 הפכה למרכז מחוז, ועד 1953 נקראה לקסורה. הכפר לקסורה עדיין שומר
    על המגדלים הסוואניים שבזכותם נודע האזור, ובסביבה עומדות כנסיות קטנות מן המאות ה-9 עד ה-11 ושרידי טירה
    הקשורה לבית דדיאני.


    את ההיסטוריה כאן כתבו אחרים. סוואנטי התחתונה הייתה תחילה בידי נסיכי גלובני, ואחר כך נכבשה לזמן מה
    בידי בית דדיאני של מגרליה, בעוד סוואנטי העליונה הלכה בדרכה שלה. ועם זאת, האנשים כאן עדיין מדברים סוואנית,
    בניב של לנטחי.


    זו סוואנטי ירוקה ורטובה יותר מזו של מסטיה: 1,240 מ"מ משקעים בשנה, ממוצע של 20 מעלות ביולי, ואשור על
    המדרונות. שם הנהר, צחניסצקאלי, פירושו "מי הסוס". הוא נובע מתחת לרכס הראשי במזרח המוניציפליטה וזורם
    176 ק"מ עד שהוא מצטרף לריוני ליד סמטרדיה.


    ב-2019 תכננה העיירה מזרקה לכיכר המרכזית ובה פסל של דאלי, אלת הציד במיתולוגיה הסוואנית. המטרופוליט
    של צגרי ולנטחי כינה זאת עבודת אלילים; ראש העירייה אמר שהתכנון שונה משיקולי יעילות ומראה. המזרקה נבנתה
    בלעדיה.


    דאלי מעולם לא ירדה אל הכיכר. היא תמיד הייתה אלה של הגבהים.
  tip: >-
    הקדישו לעיירה שעה או שעתיים, ואז הישארו ללון והפכו אותה לבסיס למגדלי לקסורה, לעמקי הצד, ובקיץ לדרך
    מזרחה אל מעבר זגרי. בלנטחי יש בתי הארחה, חנויות וכספומט. הלאה מזרחה, לכיוון צאנה וזסחו, לא תמצאו אף
    אחד מהם. קחו מעיל גשם, כי גם ביולי רטוב כאן. הדרך העוברת בזגרי אל אושגולי מיועדת לרכבי שטח בעלי הנעה
    כפולה בלבד, ופתוחה לכל היותר מיוני עד ספטמבר, אז שאלו את המקומיים לפני שאתם יוצאים. בכל אביב נערך
    חג בכנסייה שעל ההר מעל העיירה; שאלו את המארחים מתי.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) עד קוטאיסי, ומשם ב-Sh16 צפונה במעלה ערוץ הריוני דרך טווישי עד אלפנה.
    כביש Sh18 ממשיך לצגרי, ומשם Sh15 מלווה את הצחניסצקאלי כ-21 ק"מ עד לנטחי. בסך הכול כ-345 ק"מ וחמש שעות
    וחצי. הכביש סלול כמעט כולו, אבל מעל צגרי הוא צר ומטולא, ואחרי גשמים כבדים מפולות סלעים אינן נדירות.
    ביובש גם רכב אקונומי יעבור, אבל רכב שטח, הקטגוריה שאנו ממליצים עליה, נוח יותר. תדלקו בקוטאיסי; בצגרי
    יש תחנה, אבל המבחר דל.
ar:
  name: لنتيخي
  short: >-
    المركز الهادئ لسفانيتي السفلى في وادي تسخينيستسكالي: أبراج سفانية، وغابات زان، ونافورة في البلدة لم
    تحظَ قط بإلهتها.
  body: >-
    **لنتيخي هي سفانيتي بلا بطاقات بريدية: الأبراج نفسها واللغة العتيقة نفسها، تحيط بها غابات الزان بدل
    الأنهار الجليدية، ويكاد لا يشاركك فيها سائح.**


    البلدة مركز سفانيتي السفلى. تقع على ارتفاع نحو 760 متراً على نهر لاسكادورا، أحد روافد تسخينيستسكالي،
    وقد أحصى تعداد 2014 فيها 947 نسمة. صارت مركزاً للمقاطعة عام 1930، وكانت تُسمّى ليكسورا حتى عام 1953.
    ولا تزال قرية ليكسورا تحتفظ بالأبراج السفانية التي تشتهر بها المنطقة، وفي الجوار كنائس صغيرة من القرون
    التاسع إلى الحادي عشر وبقايا قلعة مرتبطة بآل دادياني.


    التاريخ هنا كتبه آخرون. فقد كانت سفانيتي السفلى أولاً في يد أمراء غيلوفاني، ثم أخضعها آل دادياني حكّام
    ميغريليا مدةً من الزمن، بينما مضت سفانيتي العليا في طريقها الخاص. ومع ذلك لا يزال الناس هنا يتكلّمون
    السفانية بلهجة لنتيخي.


    إنها سفانيتي أكثر خضرة ورطوبة من سفانيتي ميستيا: 1240 ملم من الهطول سنوياً، ومتوسط 20 درجة مئوية في
    يوليو، والزان على المنحدرات. واسم النهر، تسخينيستسكالي، يعني «ماء الحصان». ينبع من تحت السلسلة الرئيسية
    في شرق البلدية، ويجري 176 كم حتى يلتقي بريوني قرب سامتريديا.


    في عام 2019 خطّطت البلدة لنافورة في ساحتها الرئيسية يعلوها تمثال لدالي، إلهة الصيد في الأساطير السفانية.
    فوصف مطران تساغيري ولنتيخي ذلك بعبادة الأوثان، وقال رئيس البلدية إن التصميم تغيّر لاعتبارات الكفاءة
    والمظهر. وبُنيت النافورة من دونها.


    لم تنزل دالي قط إلى الساحة. لقد كانت دائماً إلهة المرتفعات.
  tip: >-
    امنح البلدة ساعة أو ساعتين، ثم بِت فيها واجعلها قاعدة لزيارة أبراج ليكسورا والأودية الجانبية، وفي
    الصيف الطريق شرقاً نحو ممر زاغاري. في لنتيخي بيوت ضيافة ومتاجر وصراف آلي. أما شرقاً، نحو تسانا وزيسخو،
    فلن تجد شيئاً من ذلك. احمل معطفاً واقياً من المطر، فحتى يوليو رطب هنا. طريق زاغاري إلى أوشغولي لسيارات
    الدفع الرباعي فقط، ومفتوح في أحسن الأحوال من يونيو إلى سبتمبر، فاسأل الأهالي قبل الانطلاق. وفي كل
    ربيع يُقام احتفال عند الكنيسة القائمة على الجبل فوق البلدة؛ اسأل مضيفك عن موعده.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً حتى كوتايسي، ثم Sh16 شمالاً في خانق ريوني عبر تفيشي حتى ألبانا.
    ويقودك Sh18 إلى تساغيري، ومنها يتبع Sh15 نهر تسخينيستسكالي نحو 21 كم حتى لنتيخي. المجموع نحو 345 كم
    وخمس ساعات ونصف. الطريق مُعبَّد كله تقريباً، لكنه فوق تساغيري ضيق ومرقّع، والانهيارات الصخرية ليست
    نادرة بعد الأمطار الغزيرة. في الطقس الجاف تعبره سيارة اقتصادية، لكن سيارة الدفع الرباعي، وهي الفئة
    التي نوصي بها، أكثر راحة. تزوّد بالوقود في كوتايسي؛ ففي تساغيري محطة، لكن الخيارات قليلة.
