ka:
  name: თბილისის ბოტანიკური ბაღი
  short: >-
    ნარიყალას კედლებს მიღმა, წავკისისწყლის ხეობაში გაშენებული ბაღი: ქალაქის ხმაური წუთებში ქრება, ბილიკი
    კი ჩანჩქერამდე მიგიყვანს.
  body: >-
    **ჭიშკრიდან ორასიოდე ნაბიჯში თბილისი უბრალოდ დუმდება.** ბაღი წავკისისწყლის ხეობას ავსებს, სოლოლაკის
    ქედის სამხრეთ კალთაზე, ნარიყალას კედლების ძირას, და კლდეები ქალაქს ზურგს უკან კარივით მოგიხურავთ.


    აქ მცენარეებს „ბოტანიკურის“ სახელამდე დიდი ხნით ადრე უვლიდნენ. 1671 წელს ფრანგმა მოგზაურმა ჟან შარდენმა
    ამ ადგილას სამეფო ბაღები აღწერა; 1795 წელს, სპარსელთა შემოსევისას, ბაღი აოხრდა, XIX საუკუნის დასაწყისში
    კვლავ გაცოცხლდა, 1845 წელს კი ოფიციალურად ტფილისის ბოტანიკურ ბაღად დაფუძნდა. დღეს, უკვე საქართველოს
    ეროვნული ბოტანიკური ბაღის სახელით, ის ასზე მეტ ჰექტარზეა გადაჭიმული და 4 500-ზე მეტ ტაქსონს ინახავს
    — კავკასიური მუხიდან ბამბუკამდე.


    ბაღი ხაზია და არა წრე. მთავარი ბილიკი ნაკადულს მიჰყვება, პატარა ხიდებით ხან ერთ ნაპირზე გადადის, ხან
    მეორეზე, ქვის თაღოვან ხიდთან კი ორად იყოფა: ერთი განშტოება ციხის კედლებისკენ მიიწევს, მეორე — ჩანჩქერისკენ,
    რომელიც აგვისტოში თეთრ ძაფს ჰგავს, აპრილში კი, თოვლის დნობისას, ხმაურიან ფარდად იშლება.


    ზედა ბილიკიდან ნარიყალა გვერდიდან ჩანს — ჟანგისფერი ქვა ბუჩქნარის ფონზე, ხედი, რომელსაც სტუმართა უმეტესობა
    ვერასდროს პოულობს. ბაღის ნაწილი ოდესღაც მუსლიმური სასაფლაო იყო; იქ დღესაც განისვენებს აზერბაიჯანელი
    მწერალი და დრამატურგი მირზა ფათალი ახუნდოვი (1812–1878). ბაღის მეორე შესასვლელი, 1909–1914 წლებში
    კლდეში გაჭრილი გვირაბი, 2000-იანი წლების შუა ხანებამდე გამოიყენებოდა; დღეს იქ ღამის კლუბი „გვირაბია“.


    აპრილში მაგნოლიებისა და ზამბახებისთვის მოდით, მაის-ივნისში — ვარდებისთვის, ოქტომბრის ბოლოს — ფოთლების
    ფერისთვის. აგვისტოშიც კი ხეობა ჩრდილს ინახავს. ქვედა კარიდან რომ გამოხვალთ, აბანოთუბნის გოგირდის სუნი
    ქალაქის ხმაურზე ადრე შემოგეგებებათ.
  tip: >-
    ჩანჩქერამდე და უკან სასეირნოდ ორი საათი გეყოფათ. მთავარი ბილიკი მარტივია, მაგრამ ჩანჩქერთან ბოლო მონაკვეთი
    ქვიანი და უსწორმასწოროა — სანდლები არა, სპორტული ფეხსაცმელი ჩაიცვით. ეტლით მხოლოდ პირველი მონაკვეთია
    გასავლელი. ბილეთი რამდენიმე ლარი ღირს და შესასვლელთან იყიდება; ბოლო ბილეთებს დაკეტვამდე დაახლოებით
    ერთი საათით ადრე ყიდიან. შესასვლელთან პატარა კაფეა, შიგნით კი საჭმელ-სასმელი არსად იშოვება, ამიტომ
    წყალი თან იქონიეთ. ტუალეტი სალაროსთანაა. დილით აქ ყველაზე გრილა და მშვიდა; ზაფხულის შუადღესაც კი ხეობაში
    გავარვარებულ ქუჩებზე ბევრად სასიამოვნოა.
  route: >-
    ბაღი ცენტრიდან 4 კილომეტრშია, მანქანით დაახლოებით 15 წუთში: აბანოთუბნისკენ, გორგასლის მოედნისკენ ჩადით
    და ბოტანიკურის ქუჩას აუყევით ქვედა შესასვლელამდე. იქ პარკირების იმედი ნუ გექნებათ — ქუჩა ბოლოს ერთი
    მანქანის სიგანეა, შაბათ-კვირას კი სავსეა. მანქანა მდინარის გაღმა, რიყის პარკის ფასიან სადგომზე ან
    გორგასლის მოედნის მიდამოებში დატოვეთ და 10–12 წუთი ფეხით გაიარეთ. კიდევ უკეთესი: რიყის პარკიდან საბაგიროთი
    ნარიყალამდე ადით, ბაღში ზედა კარიდან შედით, მთელი ბაღი დაღმართზე ჩაიარეთ და აბანოებთან გამოდით. ეკონომკლასის
    მანქანა საკმარისია, პატარა კი ამ ვიწრო ქუჩებში უფრო მოხერხებულია.
en:
  name: Tbilisi Botanical Garden
  short: >-
    A gorge garden behind the walls of Narikala, where the city falls silent within minutes and one path
    follows a stream to a waterfall.
  body: >-
    **Two hundred paces past the gate, Tbilisi simply stops making a sound.** The garden fills the gorge
    of the Tsavkisis-Tskali stream on the southern flank of the Sololaki ridge, right under the walls
    of Narikala, and the cliffs close behind you like a door.


    People were growing things here long before anyone called it botanical. In 1671 the French traveller
    Jean Chardin described royal gardens on this spot; they were laid waste in the Persian invasion of
    1795, revived in the early nineteenth century and formally refounded as the Tiflis Botanical Garden
    in 1845. Today, as the National Botanical Garden of Georgia, it spreads over more than a hundred hectares
    and keeps over 4,500 plant taxa, from Caucasian oak to bamboo.


    The garden is a line, not a circle. One path follows the stream, hopping from bank to bank on small
    bridges, until a stone arch bridge splits it in two: one branch climbs towards the fortress walls,
    the other runs on to the waterfall — a white thread in August, a loud curtain in April, when the snowmelt
    comes down.


    From the upper path you see Narikala side-on, rust-coloured stone above the scrub, a view most visitors
    never find. Part of the garden was once a Muslim cemetery, and the Azerbaijani writer and playwright
    Mirza Fatali Akhundov (1812–1878) still lies there. A second entrance, a tunnel cut through the rock
    in 1909–14, served until the mid-2000s; today it is a nightclub called Gvirabi — "the tunnel".


    Come in April for magnolias and irises, in May and June for roses, in late October for the turning
    leaves. Even in August the gorge keeps its shade. And when you leave by the lower gate, the sulphur
    of Abanotubani reaches you before the traffic does.
  tip: >-
    Allow two hours for the walk to the waterfall and back. The main path is easy, but the last stretch
    to the falls is stony and uneven — trainers, not sandals. Only the first section works with a wheelchair.
    Tickets cost a few lari at the entrance; the last ones are sold about an hour before closing. There
    is a small café by the gate and nothing to eat or drink further in, so carry water. Toilets are by
    the ticket desk. Mornings are coolest and quietest; even on a summer afternoon the gorge is far kinder
    than the baking streets outside.
  route: >-
    The garden is 4 km from the centre, about 15 minutes by car: drop down to Gorgasali Square by the
    sulphur baths and turn up Botanikuri Street to the lower gate. Don't count on parking there — the
    street narrows to one car's width and is full at weekends. Leave the car in the paid car park at Rike
    Park across the river or in the bays around Gorgasali Square, then walk 10–12 minutes. Better still,
    ride the cable car from Rike Park up to Narikala, enter by the upper gate and walk the whole garden
    downhill, coming out by the baths. Any economy car will do; a small one is easier in these lanes.
ru:
  name: Тбилисский ботанический сад
  short: 'Сад в ущелье за стенами Нарикалы: город смолкает через несколько минут, а тропа ведёт вдоль
    ручья к водопаду.'
  body: >-
    **В двухстах шагах за воротами Тбилиси просто перестаёт звучать.** Сад занимает ущелье ручья Цавкисисцкали
    на южном склоне Сололакского хребта, прямо под стенами Нарикалы, и скалы смыкаются за спиной, как
    закрывшаяся дверь.


    Здесь выращивали растения задолго до того, как место назвали ботаническим. В 1671 году французский
    путешественник Жан Шарден описал на этом месте царские сады; их разорили во время персидского нашествия
    1795 года, в начале XIX века возродили, а в 1845-м официально учредили заново как Тифлисский ботанический
    сад. Сегодня это Национальный ботанический сад Грузии: он раскинулся более чем на сотне гектаров и
    хранит свыше 4500 таксонов растений — от кавказского дуба до бамбука.


    Сад — это линия, а не круг. Главная тропа идёт вдоль ручья, перескакивая с берега на берег по мостикам,
    пока каменный арочный мост не делит её надвое: одна ветка поднимается к крепостным стенам, другая
    ведёт дальше, к водопаду — белой нити в августе и шумному занавесу в апреле, когда сходят талые воды.


    С верхней тропы Нарикала видна сбоку: ржавый камень над кустарником — ракурс, который большинство
    гостей так и не находит. Часть сада когда-то была мусульманским кладбищем, и здесь до сих пор покоится
    азербайджанский писатель и драматург Мирза Фатали Ахундов (1812–1878). Второй вход — тоннель, пробитый
    в скале в 1909–1914 годах, — служил до середины 2000-х; теперь в нём ночной клуб «Гвираби», что по-грузински
    и значит «тоннель».


    Приезжайте в апреле ради магнолий и ирисов, в мае и июне — ради роз, в конце октября — ради осенней
    листвы. Даже в августе ущелье хранит тень. А когда выйдете через нижние ворота, серный дух Абанотубани
    встретит вас раньше, чем шум машин.
  tip: >-
    Прогулка до водопада и обратно занимает около двух часов. Главная тропа лёгкая, но последний отрезок
    к водопаду каменистый и неровный — нужны кроссовки, а не сандалии. На кресле-коляске доступен лишь
    первый участок. Билет стоит несколько лари и продаётся у входа; последние билеты продают примерно
    за час до закрытия. У ворот есть маленькое кафе, дальше ни еды, ни питья не будет, так что возьмите
    воду с собой. Туалеты — у кассы. Утром прохладнее и тише всего, но даже летним днём в ущелье куда
    приятнее, чем на раскалённых улицах снаружи.
  route: >-
    Сад в 4 км от центра, около 15 минут на машине: спуститесь к площади Горгасали у серных бань и сверните
    вверх по улице Ботаникури к нижним воротам. На парковку там не рассчитывайте: улица сужается до ширины
    одной машины, а в выходные забита. Оставьте автомобиль на платной стоянке в парке Рике на другом берегу
    или на местах вокруг площади Горгасали и пройдите 10–12 минут пешком. А ещё лучше — поднимитесь по
    канатной дороге из парка Рике к Нарикале, войдите через верхние ворота и пройдите весь сад под горку,
    выйдя к баням. Подойдёт любая машина эконом-класса; маленькой в этих переулках проще.
fa:
  name: باغ گیاه‌شناسی تفلیس
  short: >-
    باغی در دره‌ای پشت دیوارهای ناریکالا؛ جایی که شهر در چند دقیقه خاموش می‌شود و راهی در کنار نهر تا
    آبشار می‌رود.
  body: >-
    **دویست قدم که از دروازه بگذرید، تفلیس به‌سادگی از صدا می‌افتد.** باغ درهٔ نهر تساوکیسیس‌تسکالی را
    بر دامنهٔ جنوبی رشته‌کوه سولولاکی پر کرده است، درست زیر دیوارهای ناریکالا، و صخره‌ها مثل دری پشت سرتان
    بسته می‌شوند.


    مردم مدت‌ها پیش از آنکه کسی این‌جا را «باغ گیاه‌شناسی» بنامد، در آن گیاه می‌پروراندند. در سال ۱۶۷۱
    ژان شاردن، جهانگرد فرانسوی، باغ‌های شاهی همین مکان را وصف کرد؛ این باغ‌ها در یورش ایرانیان در سال
    ۱۷۹۵ ویران شدند، در آغاز سدهٔ نوزدهم دوباره جان گرفتند و در ۱۸۴۵ رسماً با نام باغ گیاه‌شناسی تفلیس
    از نو بنیاد نهاده شدند. امروز، با نام باغ ملی گیاه‌شناسی گرجستان، بیش از صد هکتار وسعت دارد و بیش
    از ۴۵۰۰ تاکسون گیاهی را نگه می‌دارد، از بلوط قفقازی تا خیزران.


    این باغ یک خط است، نه یک دایره. راه اصلی‌اش نهر را دنبال می‌کند و بر پل‌های کوچک از این کرانه به آن
    کرانه می‌جهد، تا جایی که پلی سنگی و طاق‌دار آن را دو شاخه می‌کند: یک شاخه به سوی دیوارهای قلعه بالا
    می‌رود و دیگری تا آبشار پیش می‌رود؛ آبشاری که در اوت رشته‌ای سپید است و در آوریل، هنگامی که آب برف‌ها
    فرود می‌آید، پرده‌ای پرخروش.


    از راه بالایی ناریکالا را از پهلو می‌بینید: سنگ‌هایی به رنگ زنگ آهن بر فراز بوته‌زار؛ منظره‌ای که
    بیشتر بازدیدکنندگان هرگز پیدایش نمی‌کنند. بخشی از باغ روزگاری گورستان مسلمانان بود و میرزا فتحعلی
    آخوندزاده (۱۸۱۲–۱۸۷۸)، نویسنده و نمایشنامه‌نویس آذربایجانی، هنوز همان‌جا آرمیده است. ورودی دوم، تونلی
    که در سال‌های ۱۹۰۹ تا ۱۹۱۴ در دل صخره کنده شد، تا میانهٔ دههٔ ۲۰۰۰ به کار می‌رفت؛ امروز باشگاهی شبانه
    به نام «گویرابی» است، یعنی «تونل».


    در آوریل برای ماگنولیا و زنبق بیایید، در مه و ژوئن برای گل‌های سرخ، و در اواخر اکتبر برای برگ‌های
    رنگ‌گرفتهٔ پاییزی. حتی در اوت دره سایه‌اش را نگه می‌دارد. و وقتی از دروازهٔ پایینی بیرون می‌روید،
    بوی گوگرد آبانوتوبانی زودتر از هیاهوی خیابان به شما می‌رسد.
  tip: >-
    برای پیاده‌روی تا آبشار و بازگشت دو ساعت وقت بگذارید. راه اصلی آسان است، اما تکهٔ آخر تا آبشار سنگلاخ
    و ناهموار است؛ کفش ورزشی بپوشید، نه صندل. تنها بخش نخست با ویلچر پیمودنی است. بلیت چند لاری است و
    دم در فروخته می‌شود؛ آخرین بلیت‌ها حدود یک ساعت پیش از بسته شدن فروش می‌روند. کنار دروازه کافهٔ کوچکی
    هست و جلوتر نه خوراکی پیدا می‌شود نه نوشیدنی، پس آب همراه داشته باشید. سرویس بهداشتی کنار گیشهٔ بلیت
    است. صبح‌ها خنک‌ترین و آرام‌ترین ساعت‌هاست؛ اما حتی در بعدازظهر تابستان، دره بسیار مهربان‌تر از خیابان‌های
    تفتیدهٔ بیرون است.
  route: >-
    باغ ۴ کیلومتر با مرکز شهر فاصله دارد، حدود ۱۵ دقیقه با خودرو: به میدان گورگاسالی کنار حمام‌های گوگردی
    پایین بیایید و به خیابان بوتانیکوری بپیچید و تا دروازهٔ پایینی بالا بروید. روی پارکینگ آنجا حساب نکنید؛
    خیابان به پهنای یک خودرو باریک می‌شود و آخر هفته‌ها پر است. خودرو را در پارکینگ پولی پارک ریکه، آن
    سوی رودخانه، یا در جاهای پارک اطراف میدان گورگاسالی بگذارید و ۱۰ تا ۱۲ دقیقه پیاده بروید. بهتر از
    آن: از پارک ریکه با تله‌کابین تا ناریکالا بالا بروید، از دروازهٔ بالایی وارد شوید و تمام باغ را در
    سراشیبی بپیمایید تا کنار حمام‌ها بیرون بیایید. هر خودروی اقتصادی کافی است؛ در این کوچه‌ها خودروی کوچک
    راحت‌تر است.
he:
  name: הגן הבוטני של טביליסי
  short: גן בערוץ שמאחורי חומות נריקאלה, שבו העיר משתתקת תוך דקות ושביל אחד מלווה נחל עד למפל.
  body: >-
    **מאתיים צעדים אחרי השער, טביליסי פשוט מפסיקה להשמיע קול.** הגן ממלא את ערוץ הנחל צאווקיסיס-צקאלי
    במורדו הדרומי של רכס סולולאקי, ממש מתחת לחומות נריקאלה, והצוקים נסגרים מאחוריכם כמו דלת.


    אנשים גידלו כאן צמחים הרבה לפני שמישהו קרא למקום "בוטני". ב-1671 תיאר הנוסע הצרפתי ז'אן שרדן גני מלוכה
    בנקודה הזאת; הם נחרבו בפלישה הפרסית של 1795, קמו לתחייה בראשית המאה ה-19 ונוסדו מחדש באופן רשמי ב-1845
    כגן הבוטני של טיפליס. כיום, תחת השם הגן הבוטני הלאומי של גאורגיה, הוא משתרע על יותר ממאה הקטרים ומחזיק
    למעלה מ-4,500 טקסונים של צמחים, מאלון קווקזי ועד במבוק.


    הגן הוא קו, לא מעגל. שביל אחד צמוד לנחל ומדלג מגדה לגדה על גשרונים, עד שגשר אבן מקומר מפצל אותו לשניים:
    ענף אחד מטפס אל חומות המבצר, והשני ממשיך אל המפל — חוט לבן באוגוסט, וילון רועם באפריל, כשמי השלגים
    הנמסים יורדים.


    מן השביל העליון רואים את נריקאלה מן הצד: אבן בצבע חלודה מעל השיחים, תצפית שרוב המבקרים לעולם אינם
    מוצאים. חלק מן הגן היה פעם בית קברות מוסלמי, והסופר והמחזאי האזרבייג'ני מירזא פתאלי אחונדוב (1812–1878)
    קבור בו עד היום. כניסה שנייה, מנהרה שנחצבה בסלע ב-1909–1914, שימשה עד אמצע שנות ה-2000; היום פועל
    בה מועדון לילה בשם גווירבי — "המנהרה".


    בואו באפריל בשביל המגנוליות והאירוסים, במאי וביוני בשביל הוורדים, ובסוף אוקטובר בשביל עלי השלכת. גם
    באוגוסט הערוץ שומר על צילו. וכשתצאו בשער התחתון, ריח הגופרית של אבנוטובאני יגיע אליכם לפני רעש התנועה.
  tip: >-
    הקציבו שעתיים להליכה אל המפל ובחזרה. השביל הראשי קל, אבל הקטע האחרון אל המפל אבני ומשובש — נעלי ספורט,
    לא סנדלים. רק הקטע הראשון נגיש לכיסא גלגלים. הכרטיסים עולים כמה לארי ונמכרים בכניסה; האחרונים נמכרים
    כשעה לפני הסגירה. ליד השער יש בית קפה קטן, והלאה אין מה לאכול או לשתות, אז קחו מים. השירותים ליד הקופה.
    הבקרים הם הקרירים והשקטים ביותר; אבל גם אחר צהריים של קיץ הערוץ נעים הרבה יותר מן הרחובות הלוהטים
    שבחוץ.
  route: >-
    הגן נמצא 4 ק״מ מן המרכז, כ-15 דקות נסיעה: רדו אל כיכר גורגסאלי ליד מרחצאות הגופרית ופנו במעלה רחוב
    בוטניקורי אל השער התחתון. אל תסמכו על חניה שם — הרחוב מצטמצם לרוחב של מכונית אחת ובסופי שבוע הוא מלא.
    השאירו את הרכב בחניון בתשלום בפארק ריקה שמעבר לנהר או במקומות החניה סביב כיכר גורגסאלי, והמשיכו 10–12
    דקות ברגל. עוד יותר טוב: עלו ברכבל מפארק ריקה אל נריקאלה, היכנסו בשער העליון ועברו את כל הגן בירידה,
    עד שתצאו ליד המרחצאות. כל רכב חסכוני יתאים; בסמטאות האלה קל יותר עם רכב קטן.
ar:
  name: حديقة تبليسي النباتية
  short: حديقة في وادٍ خلف أسوار ناريكالا، تصمت فيها المدينة خلال دقائق، ويرافق فيها درب واحد جدولاً حتى
    الشلال.
  body: >-
    **على بُعد مئتي خطوة من البوابة، تكفّ تبليسي ببساطة عن إصدار أي صوت.** تملأ الحديقة وادي جدول تسافكيسيس-تسكالي
    على السفح الجنوبي لسلسلة سولولاكي، تحت أسوار ناريكالا مباشرة، وتنغلق المنحدرات الصخرية خلفك كأنها
    باب.


    زُرعت الأرض هنا قبل زمن طويل من أن يسمّيها أحد حديقة نباتية. ففي عام 1671 وصف الرحّالة الفرنسي جان
    شاردان حدائق ملكية في هذا الموضع؛ ثم خُرّبت خلال الغزو الفارسي عام 1795، وأُحييت مطلع القرن التاسع
    عشر، وأُعيد تأسيسها رسمياً عام 1845 باسم حديقة تفليس النباتية. وهي اليوم، بصفتها الحديقة النباتية
    الوطنية لجورجيا، تمتد على أكثر من مئة هكتار وتحفظ ما يزيد على 4500 وحدة تصنيفية من النباتات، من البلوط
    القوقازي إلى الخيزران.


    الحديقة خطّ لا دائرة. الدرب الرئيسي يتبع الجدول، يقفز من ضفة إلى ضفة فوق جسور صغيرة، حتى يشطره جسر
    حجري معقود إلى شطرين: فرع يصعد نحو أسوار القلعة، وآخر يمضي إلى الشلال، خيطاً أبيض في أغسطس، وستارةً
    هادرة في أبريل حين تنحدر مياه الثلوج الذائبة.


    ومن الدرب الأعلى ترى ناريكالا من جانبها: حجارة بلون الصدأ فوق الأحراش، في مشهد لا يعثر عليه معظم الزوار.
    وكان جزء من الحديقة في ما مضى مقبرة إسلامية، ولا يزال الكاتب والمسرحي الأذربيجاني ميرزا فتح علي آخوندوف
    (1812–1878) يرقد فيها. أما المدخل الثاني، وهو نفق نُحت في الصخر بين عامي 1909 و1914، فقد ظل مستخدماً
    حتى منتصف العقد الأول من القرن الحادي والعشرين؛ واليوم يشغله ملهى ليلي اسمه «غفيرابي»، أي «النفق».


    تعالَ في أبريل من أجل الماغنوليا والسوسن، وفي مايو ويونيو من أجل الورود، وفي أواخر أكتوبر من أجل أوراق
    الخريف المتلوّنة. وحتى في أغسطس يحتفظ الوادي بظلّه. وحين تغادر من البوابة السفلى، تبلغك رائحة كبريت
    أبانوتوباني قبل ضجيج السيارات.
  tip: >-
    خصّص ساعتين للمشي إلى الشلال والعودة. الدرب الرئيسي سهل، لكن المقطع الأخير نحو الشلال حجري وغير مستوٍ،
    فالبس حذاءً رياضياً لا صندلاً. والقسم الأول وحده يصلح للكرسي المتحرك. تُباع التذاكر عند المدخل ببضعة
    لاريات، وآخرها يُباع قبل الإغلاق بنحو ساعة. وعند البوابة مقهى صغير، ولا طعام ولا شراب بعده، فاحمل
    ماءك معك. ودورات المياه بجوار شباك التذاكر. الصباح أبرد الأوقات وأهدؤها؛ لكن الوادي حتى في عصر يوم
    صيفي أرحم بكثير من الشوارع اللاهبة في الخارج.
  route: >-
    تبعد الحديقة 4 كم عن وسط المدينة، أي نحو 15 دقيقة بالسيارة: انزل إلى ميدان غورغاسالي عند حمامات الكبريت،
    ثم انعطف صعوداً في شارع بوتانيكوري حتى البوابة السفلى. ولا تعوّل على الوقوف هناك، فالشارع يضيق حتى
    لا يتسع إلا لسيارة واحدة، ويمتلئ في عطلة نهاية الأسبوع. اترك السيارة في الموقف المدفوع في حديقة ريكه
    على الضفة المقابلة من النهر أو في أماكن الوقوف حول ميدان غورغاسالي، ثم امشِ 10–12 دقيقة. والأفضل من
    ذلك أن تركب التلفريك من حديقة ريكه صعوداً إلى ناريكالا، وتدخل من البوابة العليا، وتقطع الحديقة كلها
    نزولاً حتى تخرج عند الحمامات. تكفي أي سيارة اقتصادية، والصغيرة أيسر في هذه الأزقة.
