ka:
  name: თბილისის ბოტანიკური ბაღი
  short: ნარიყალას უკან, ხეობაში გაშენებული ბაღი ჩანჩქერით — ცენტრიდან ათი წუთის სავალზე მდებარე სრული
    სიჩუმე.
  body: >-
    **ბოტანიკური ბაღი ნარიყალას მეორე მხარესაა და ქალაქს მთლიანად მალავს.** ის ცავკისისწყლის ვიწრო ხეობაშია
    გაშენებული, ციხის კედლების ქვეშ, და საკმარისია ორასი მეტრი შესასვლელიდან, რომ ტრანსპორტის ხმა სრულიად
    გაქრეს.


    ადგილს გრძელი ისტორია აქვს: აქ სამეფო ბაღები სულ მცირე XVII საუკუნიდან იყო, ხოლო ოფიციალურად ბოტანიკური
    ბაღი 1845 წელს დაარსდა. დღეს ის დაახლოებით ასი ჰექტარია და რამდენიმე ათასი სახეობის მცენარეს ითვლის
    — კავკასიური მუხნარიდან ბამბუკამდე და კაქტუსების კოლექციამდე.


    ბაღი წრფივია და არა კონცენტრული: ერთი მთავარი ბილიკი მიჰყვება ხეობას, ხიდებით ერთი ნაპირიდან მეორეზე
    გადადის და დაახლოებით ოცდახუთი წუთის სიარულის შემდეგ ჩანჩქერთან ამთავრებს — მაღალი, ვიწრო, ზაფხულში
    წვრილი, გაზაფხულზე კი შესამჩნევად ძლიერი.


    სეზონურობა აქ რეალურია. აპრილში ყვავის მაგნოლიები, იაპონური ალუბალი და ირისები; მაისსა და ივნისში
    ვარდების კოლექციაა; აგვისტოში ხეობა მშრალი და მოყვითალოა, თუმცა ჩრდილი მაინც რჩება; ოქტომბერში კი
    ფოთოლი იცვლის ფერს და ეს ალბათ საუკეთესო თვეა. ზამთარში ბაღი ღიაა, მაგრამ თითქმის ცარიელი.


    ბაღის აღმოსავლეთ კიდეს ძველი მუსლიმური სასაფლაო ესაზღვრება, სადაც XIX საუკუნის მწერალი მირზა ფათალი
    ახუნდოვია დაკრძალული.


    მთავარი შესასვლელი ბოტანიკურის ქუჩაზეა, აბანოთუბნიდან ხუთი წუთის სავალზე. მეორე, ზედა კარი პირდაპირ
    ნარიყალას ბილიკიდან შემოგიშვებს — ბევრი ზემოდან შემოდის და ქვემოთ, აბანოთუბანში გამოდის.


    ხეობაზე გადებული ქვის თაღოვანი ხიდი ბაღის ერთ-ერთი ყველაზე ლამაზი წერტილია და კარგი ორიენტირიც: აქედან
    ბილიკი ორად იყოფა — ერთი ჩანჩქერისკენ მიდის, მეორე ზემოთ, ნარიყალას კედლებისკენ ადის. ზედა ბილიკიდან
    ციხე ქვემოდან კი არა, გვერდიდან ჩანს, ხოლო ქალაქის ხმა ისევ იმ სიმაღლიდან ბრუნდება, საიდანაც ერთი
    საათის წინ გამოხვედი.
  tip: >-
    ორი საათი სრული მარშრუტისთვის ჩანჩქერამდე და უკან. ბილიკი ძირითადად კარგია, მაგრამ ჩანჩქერთან ბოლო
    მონაკვეთი ქვიანი და არათანაბარია — სპორტული ფეხსაცმელი გამოგადგება. ეტლით მხოლოდ პირველი მონაკვეთია
    გასავლელი. ზაფხულის შუადღეს ხეობაში ცხელა, თუმცა ჩრდილი უფრო მეტია, ვიდრე ქალაქში. წყალი თან იქონიე:
    შიგნით მხოლოდ ერთი პატარა კაფეა შესასვლელთან. ტუალეტი კასასთანაა. ბოლო ბილეთი დაკეტვამდე დაახლოებით
    ერთი საათით ადრე იყიდება.
  route: >-
    ცენტრიდან გორგასლის მოედნისკენ ჩამოდი და იქიდან ბოტანიკურის ქუჩაზე ახვიე — 4 კმ, დაახლოებით 15 წუთი.
    თავად შესასვლელთან პარკინგი ძალიან მცირეა და ვიწრო ქუჩაზეა, ორ მანქანას ძლივს ცილებს; შაბათ-კვირას
    იქ ადგილი პრაქტიკულად არ არის. ყველაზე საიმედოა გორგასლის მოედნის ანაზღაურებადი პარკინგი ან რიყის
    პარკის სადგომი, საიდანაც ბაღამდე 10-12 წუთის სავალია. ალტერნატივა: საბაგიროთი ნარიყალამდე და ზედა
    კარიდან შესვლა. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Tbilisi Botanical Garden
  short: A garden in the ravine behind Narikala, ending at a waterfall — complete silence ten minutes
    from the centre.
  body: >-
    **The Botanical Garden lies on the far side of Narikala and hides the city completely.** It fills
    the narrow gorge of the Tsavkisis-Tskali stream, directly under the fortress walls, and two hundred
    metres past the gate the traffic noise is simply gone.


    The site has a long history. Royal gardens existed here from at least the seventeenth century, and
    the botanical garden was formally established in 1845. Today it covers around a hundred hectares and
    holds several thousand plant taxa, from Caucasian oak woodland to bamboo and a collection of cacti
    under glass.


    The layout is linear rather than concentric: one main path follows the gorge, crossing from bank to
    bank on small bridges, and after about twenty-five minutes of walking it ends at the waterfall — tall,
    narrow, thin in late summer and noticeably heavier in spring, when snowmelt comes down off the Trialeti
    ridge.


    Seasons matter here more than in most city parks. April brings magnolia, Japanese cherry and irises;
    May and June belong to the rose collection; by August the gorge is dry and yellowed, though it still
    holds shade; October, when the leaves turn, is probably the best month of all. The garden stays open
    in winter but is nearly empty, and much of it is bare.


    Along the eastern edge of the garden lies the old Muslim cemetery, where the nineteenth-century writer
    Mirza Fatali Akhundov is buried.


    The main gate is on Botanikuri Street, five minutes' walk from the sulphur baths. A second, upper
    gate opens directly onto the Narikala path, and many visitors come in from the top and walk down,
    which turns the whole garden into a gentle descent and saves the climb back.


    The stone arched bridge over the stream is the prettiest single point in the garden and a useful landmark:
    from it the path divides, one branch going on to the waterfall and the other climbing towards the
    walls of Narikala. From the upper path the fortress is seen side-on rather than from below, which
    is a view very few visitors bother to find, and the sound of the city comes back at exactly the height
    where you left it an hour earlier.
  tip: >-
    Two hours covers the full walk to the waterfall and back. The path is decent for most of the way,
    but the last stretch to the falls is stony and uneven, so trainers help. Only the first section is
    manageable with a wheelchair. Summer afternoons are hot in the gorge, though there is more shade than
    in the city. Carry water: there is one small cafe near the entrance and nothing further in. Toilets
    are by the ticket desk. The last tickets are sold about an hour before closing.
  route: >-
    From the centre drop down to Gorgasali Square and turn up Botanikuri Street — 4 km, about fifteen
    minutes. Parking at the gate itself is minimal and sits on a narrow street where two cars barely pass;
    at weekends there is effectively nothing. The reliable answer is the paid parking at Gorgasali Square
    or the car park in Rike Park, ten to twelve minutes' walk away. The alternative is to ride the cable
    car to Narikala and enter through the upper gate. An economy car is enough, and a small one is easier
    on Botanikuri Street.
ru:
  name: Тбилисский ботанический сад
  short: Сад в ущелье за Нарикалой, заканчивающийся водопадом, — полная тишина в десяти минутах от центра.
  body: >-
    **Ботанический сад лежит по другую сторону Нарикалы и полностью прячет город.** Он занимает узкое
    ущелье речки Цавкисисцкали прямо под крепостными стенами, и уже через двести метров от входа шум транспорта
    исчезает начисто.


    У места длинная история: царские сады существовали здесь по меньшей мере с XVII века, а ботанический
    сад официально основан в 1845 году. Сегодня он занимает около ста гектаров и содержит несколько тысяч
    таксонов — от кавказской дубравы до бамбука и коллекции кактусов под стеклом.


    Планировка линейная, а не кольцевая: одна главная дорожка идёт вдоль ущелья, переходя с берега на
    берег по мостикам, и примерно через двадцать пять минут ходьбы упирается в водопад — высокий и узкий,
    тонкий в конце лета и заметно более полноводный весной, когда с Триалетского хребта сходит снег.


    Сезонность здесь важнее, чем в обычном городском парке. В апреле цветут магнолии, японская вишня и
    ирисы; май и июнь — время розария; к августу ущелье сухое и пожелтевшее, хотя тень остаётся; октябрь
    с его листвой, пожалуй, лучший месяц. Зимой сад открыт, но почти пуст и во многом гол.


    Вдоль восточного края сада тянется старое мусульманское кладбище, где похоронен писатель XIX века
    Мирза Фатали Ахундов.


    Главный вход на улице Ботаникури, в пяти минутах от серных бань. Второй, верхний вход открывается
    прямо с тропы у Нарикалы, и многие заходят сверху и спускаются: тогда весь сад превращается в плавный
    спуск и подниматься обратно не нужно.


    Каменный арочный мост через ручей — самая красивая точка сада и удобный ориентир: от него дорожка
    раздваивается, одна ветка идёт к водопаду, другая поднимается к стенам Нарикалы. С верхней тропы крепость
    видна сбоку, а не снизу, и этот ракурс мало кто ищет; звук города возвращается ровно на той высоте,
    на которой вы его оставили часом раньше.
  tip: >-
    Двух часов хватает на весь маршрут до водопада и обратно. Дорожка почти везде приличная, но последний
    участок к водопаду каменистый и неровный, так что кроссовки не помешают. В кресле-коляске проходим
    только первый отрезок. Летом в ущелье жарко после полудня, хотя тени больше, чем в городе. Берите
    воду: внутри лишь одно небольшое кафе у входа. Туалеты у кассы. Последние билеты продают примерно
    за час до закрытия.
  route: >-
    Из центра спуститесь к площади Горгасали и сверните на улицу Ботаникури — 4 км, около пятнадцати минут.
    Парковка у самого входа крошечная и стоит на узкой улице, где две машины едва расходятся; в выходные
    её фактически нет. Надёжный ответ — платная стоянка на площади Горгасали или парковка в парке Рике,
    оттуда идти десять-двенадцать минут. Альтернатива: подняться канатной дорогой на Нарикалу и войти
    через верхние ворота. Машины эконом-класса достаточно, а маленькая удобнее на Ботаникури.
fa:
  name: باغ گیاه‌شناسی تفلیس
  short: باغی در درهٔ پشت ناریکالا که به آبشاری ختم می‌شود؛ سکوت کامل در ده دقیقه‌ای مرکز شهر.
  body: >-
    **باغ گیاه‌شناسی در آن‌سوی ناریکالا است و شهر را یکسره پنهان می‌کند.** درهٔ باریک رود تساوکیسیس‌تسکالی
    را درست زیر دیوارهای قلعه پر کرده، و دویست متر پس از دروازه صدای خیابان به‌کلی از میان می‌رود.


    این جا تاریخی دراز دارد. باغ‌های شاهی دست‌کم از سدهٔ هفدهم اینجا بودند و باغ گیاه‌شناسی رسماً در ۱۸۴۵
    بنیاد گرفت. امروز نزدیک صد هکتار وسعت دارد و چند هزار گونه و رقم گیاه در آن نگهداری می‌شود، از جنگل
    بلوط قفقازی تا خیزران و مجموعه‌ای از کاکتوس‌ها زیر شیشه.


    طرح باغ خطی است نه دایره‌ای: یک راه اصلی درّه را دنبال می‌کند، با پل‌های کوچک از این کرانه به آن کرانه
    می‌رود و پس از حدود بیست‌وپنج دقیقه پیاده‌روی به آبشار می‌رسد؛ بلند و باریک، در اواخر تابستان کم‌آب
    و در بهار که برف ستیغ تریالتی آب می‌شود بسیار پرتوان‌تر.


    فصل‌ها اینجا بیش از هر پارک شهری دیگر اهمیت دارند. آوریل ماه ماگنولیا و گیلاس ژاپنی و زنبق است؛ مه
    و ژوئن از آنِ گلستان رز؛ تا اوت درّه خشک و زردرنگ می‌شود هرچند سایه‌اش می‌ماند؛ و اکتبر با برگ‌های
    رنگ‌گرفته شاید بهترین ماه سال باشد. زمستان باغ باز است اما تقریباً خالی.


    در کنارهٔ شرقی باغ گورستان کهن مسلمانان قرار دارد که میرزا فتحعلی آخوندزاده، نویسندهٔ سدهٔ نوزدهم،
    در آن به خاک سپرده شده است.


    دروازهٔ اصلی در خیابان بوتانیکوری و پنج دقیقه پیاده از حمام‌های گوگردی است. دروازهٔ دوم و بالایی مستقیم
    به راه ناریکالا باز می‌شود، و بسیاری از بالا وارد می‌شوند و پایین می‌آیند تا کل باغ به سرازیری ملایمی
    بدل شود.


    پل سنگی طاق‌دار روی جویبار زیباترین نقطهٔ باغ و نشانه‌ای کارآمد است: از آنجا راه دو شاخه می‌شود، یکی
    به آبشار می‌رود و دیگری به سوی دیوارهای ناریکالا بالا می‌رود. از راه بالایی قلعه را از پهلو می‌بینید
    نه از پایین، منظره‌ای که کمتر کسی به سراغش می‌رود، و صدای شهر درست در همان ارتفاعی بازمی‌گردد که یک
    ساعت پیش آن را جا گذاشته بودید.
  tip: >-
    دو ساعت برای رفتن تا آبشار و بازگشت کافی است. راه در بیشتر مسیر خوب است، اما تکهٔ آخر تا آبشار سنگی
    و ناهموار است و کفش ورزشی کمک می‌کند. تنها بخش نخست با ویلچر شدنی است. بعدازظهرهای تابستان در درّه
    گرم است، هرچند سایه‌اش از شهر بیشتر است. آب همراه ببرید: تنها یک کافهٔ کوچک نزدیک ورودی هست و جلوتر
    هیچ. سرویس بهداشتی کنار گیشه است. آخرین بلیت حدود یک ساعت پیش از بسته شدن فروخته می‌شود.
  route: >-
    از مرکز شهر به میدان گورگاسالی پایین بیایید و از آنجا به خیابان بوتانیکوری بپیچید؛ ۴ کیلومتر، حدود
    پانزده دقیقه. پارکینگ کنار خود دروازه بسیار کوچک است و در کوچه‌ای تنگ قرار دارد که دو خودرو به‌زحمت
    از هم می‌گذرند؛ آخر هفته عملاً جایی نیست. پاسخ مطمئن پارکینگ پولی میدان گورگاسالی یا پارکینگ پارک
    ریکه است که ده تا دوازده دقیقه پیاده فاصله دارد. گزینهٔ دیگر رفتن با تله‌کابین به ناریکالا و ورود
    از دروازهٔ بالایی است. خودروی اقتصادی کافی است.
he:
  name: הגן הבוטני של טביליסי
  short: גן בערוץ שמאחורי נריקאלה, המסתיים במפל — שקט מוחלט בעשר דקות מן המרכז.
  body: >-
    **הגן הבוטני שוכן בצדו האחר של נריקאלה ומסתיר את העיר לחלוטין.** הוא ממלא את הערוץ הצר של נחל צאווקיסיס-צקאלי,
    ממש מתחת לחומות המבצר, ומאתיים מטר אחרי השער רעש התנועה נעלם כליל.


    למקום היסטוריה ארוכה. גני מלוכה היו כאן לפחות מן המאה ה-17, והגן הבוטני נוסד רשמית ב-1845. כיום הוא
    משתרע על כמאה הקטרים ומחזיק כמה אלפי מיני צמחים, מחורש אלונים קווקזי ועד במבוק ואוסף קקטוסים תחת זכוכית.


    התכנון קווי ולא מעגלי: שביל ראשי אחד עוקב אחר הערוץ, עובר מגדה לגדה על גשרונים, ואחרי כעשרים וחמש
    דקות הליכה מגיע אל המפל — גבוה, צר, דק בשלהי הקיץ וחזק בהרבה באביב, כשההפשרה יורדת מרכס טריאלטי.


    העונות חשובות כאן יותר מבכל פארק עירוני. אפריל מביא מגנוליה, דובדבן יפני ואירוסים; מאי ויוני שייכים
    לגן הוורדים; באוגוסט הערוץ יבש ומצהיב אף שהצל נשמר; ואוקטובר, כשהעלים מתחלפים, הוא כנראה החודש הטוב
    ביותר. בחורף הגן פתוח אך כמעט ריק וחלקים גדולים ממנו חשופים.


    לאורך שוליו המזרחיים של הגן משתרע בית הקברות המוסלמי הישן, שבו קבור הסופר בן המאה ה-19 מירזא פתחעלי
    אחונדוב.


    השער הראשי ברחוב בוטניקורי, חמש דקות הליכה ממרחצאות הגופרית. שער עליון שני נפתח היישר אל שביל נריקאלה,
    ורבים נכנסים מלמעלה ויורדים, וכך הגן כולו הופך לירידה מתונה בלי טיפוס חזרה.


    גשר האבן המקומר מעל הנחל הוא הנקודה היפה ביותר בגן וגם ציון דרך שימושי: ממנו מתפצל השביל, ענף אחד
    ממשיך אל המפל והשני מטפס אל חומות נריקאלה. מן השביל העליון רואים את המבצר מן הצד ולא מלמטה, זווית
    שמעטים טורחים לחפש, וקול העיר חוזר בדיוק בגובה שבו עזבתם אותו שעה קודם לכן.
  tip: >-
    שעתיים מספיקות למסלול המלא עד המפל וחזרה. השביל סביר ברוב הדרך, אך הקטע האחרון אל המפל אבני ולא אחיד,
    ונעלי ספורט עוזרות. רק החלק הראשון עביר בכיסא גלגלים. אחר הצהריים בקיץ חם בערוץ, אם כי יש בו יותר
    צל מאשר בעיר. קחו מים: יש בית קפה קטן אחד ליד הכניסה ומעבר לו כלום. שירותים ליד הקופה. הכרטיסים האחרונים
    נמכרים כשעה לפני הסגירה.
  route: >-
    מן המרכז רדו אל כיכר גורגסאלי ופנו במעלה רחוב בוטניקורי — 4 ק״מ, כחמש-עשרה דקות. החניה ליד השער עצמו
    מזערית ונמצאת ברחוב צר שבו שני רכבים בקושי חולפים; בסופי שבוע אין שם למעשה כלום. התשובה האמינה היא
    החניון בתשלום בכיכר גורגסאלי או החניון בפארק ריקה, עשר עד שתים-עשרה דקות הליכה. חלופה: לעלות ברכבל
    לנריקאלה ולהיכנס דרך השער העליון. רכב חסכוני מספיק, וקטן נוח יותר ברחוב בוטניקורי.
ar:
  name: حديقة تبليسي النباتية
  short: حديقة في الوادي خلف ناريكالا تنتهي عند شلال؛ صمت تام على بعد عشر دقائق من وسط المدينة.
  body: >-
    **تقع الحديقة النباتية في الجهة الأخرى من ناريكالا وتحجب المدينة تماماً.** تملأ الوادي الضيق لنهير
    تسافكيسيس تسكالي تحت أسوار القلعة مباشرة، وبعد مئتي متر من البوابة يختفي ضجيج السيارات كلياً.


    وللموقع تاريخ طويل. فقد قامت هنا حدائق ملكية منذ القرن السابع عشر على الأقل، وأُسست الحديقة النباتية
    رسمياً عام 1845. وهي اليوم تمتد على نحو مئة هكتار وتضم عدة آلاف من أصناف النبات، من غابة البلوط القوقازي
    إلى الخيزران ومجموعة من الصبّار تحت الزجاج.


    والتخطيط خطي لا دائري: درب رئيسي واحد يتبع الوادي وينتقل بين ضفتيه على جسور صغيرة، وبعد نحو خمس وعشرين
    دقيقة سيراً ينتهي عند الشلال؛ عالٍ ضيق، ضعيف في أواخر الصيف وأقوى بوضوح في الربيع حين ينزل ذوبان الثلج
    من حافة تريالتي.


    والفصول هنا أهم منها في أي متنزه مدني آخر. فأبريل موسم الماغنوليا والكرز الياباني والسوسن؛ ومايو ويونيو
    لمجموعة الورود؛ وفي أغسطس يجف الوادي ويصفرّ وإن بقي ظله؛ وأكتوبر حين تتبدل ألوان الورق هو أفضل الشهور
    غالباً. وتبقى الحديقة مفتوحة شتاءً لكنها شبه خالية.


    وعلى حافتها الشرقية تمتد المقبرة الإسلامية القديمة، حيث يُدفن الكاتب ميرزا فتح علي آخوندوف من القرن
    التاسع عشر.


    البوابة الرئيسية في شارع بوتانيكوري على خمس دقائق مشياً من حمامات الكبريت. وثمة بوابة ثانية عليا تفتح
    مباشرة على درب ناريكالا، وكثيرون يدخلون من الأعلى وينزلون، فتصير الحديقة كلها هبوطاً هيّناً بلا صعود
    للعودة.


    والجسر الحجري المعقود فوق الجدول أجمل نقطة في الحديقة وعلامة مفيدة أيضاً: فمنه ينقسم الدرب، فرع يمضي
    إلى الشلال وآخر يصعد نحو أسوار ناريكالا. ومن الدرب الأعلى تُرى القلعة من الجانب لا من الأسفل، وهي
    زاوية قلّ من يتكبد البحث عنها، ويعود صوت المدينة عند الارتفاع نفسه الذي تركته فيه قبل ساعة.
  tip: >-
    ساعتان تكفيان للمسار الكامل إلى الشلال والعودة. الدرب مقبول في معظمه، لكن القطعة الأخيرة نحو الشلال
    حجرية غير مستوية، والحذاء الرياضي يساعد. والقسم الأول وحده صالح للكرسي المتحرك. وبعد ظهر الصيف حار
    في الوادي، وإن كان ظله أوفر من المدينة. واحمل ماء: فهناك مقهى صغير واحد قرب المدخل ولا شيء بعده. ودورات
    المياه عند شباك التذاكر. وآخر التذاكر تُباع قبل الإغلاق بنحو ساعة.
  route: >-
    من وسط المدينة انزل إلى ميدان غورغاسالي ثم اصعد شارع بوتانيكوري؛ 4 كم ونحو خمس عشرة دقيقة. والوقوف
    عند البوابة نفسه ضئيل، وهو في شارع ضيق تتجاوز فيه سيارتان بعضهما بصعوبة؛ وفي العطلة لا مكان فيه عملياً.
    والجواب الموثوق هو الموقف المدفوع في ميدان غورغاسالي أو موقف حديقة ريكه، وكلاهما على عشر إلى اثنتي
    عشرة دقيقة مشياً. والبديل الصعود بالتلفريك إلى ناريكالا والدخول من البوابة العليا. وسيارة اقتصادية
    تكفي، والصغيرة أيسر في شارع بوتانيكوري.
