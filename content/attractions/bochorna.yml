ka:
  name: ბოჭორნა
  short: >-
    რამდენიმე სახლი 2345 მეტრზე, თუშეთის გომეწრის ხეობაში: ოფიციალურად ევროპის უმაღლესი მუდმივად დასახლებული
    სოფელი, მხოლოდ ზაფხულში და მხოლოდ 4x4-ით.
  body: >-
    **2345 მეტრზე, თუშეთის გომეწრის ხეობაში მდებარე ბოჭორნა საქართველოს მთავრობის შეფასებით ევროპის ყველაზე
    მაღალი მუდმივად დასახლებული პუნქტია — თუმცა წლების განმავლობაში „დასახლებული“ ერთ კაცს ნიშნავდა.**


    ძველ წყაროებში ბოჭორმად მოხსენიებული სოფელი კავკასიონის განშტოების, მაკრატელას ქედის, სამხრეთ კალთებზე,
    თუშეთის ეროვნულ პარკში მდებარეობს. თუშეთის ბევრი სოფლის მსგავსად, ისიც ნელ-ნელა დაიცალა: XIX საუკუნის
    პირველი ნახევრიდან თუშური ოჯახები ბარში, ალვნის მიდამოებში სახლდებოდნენ, 2002 წლის აღწერამ კი ბოჭორნა
    მიტოვებულად დააფიქსირა. 2014 წლის აღწერისას აქ ერთი მუდმივი მცხოვრები იყო, ზაფხულობით — რამდენიმე
    მეტი. ამის საფუძველზე სახელმწიფომ ბოჭორნას სოფლის სტატუსი დაუბრუნა და ის ევროპის უმაღლეს მუდმივად
    დასახლებულ ადგილად გამოაცხადა — ეს წოდება მანამდე სვანეთის უშგულს ეკუთვნოდა.


    2020-იანი წლების სამოგზაურო გზამკვლევები ამ ამბავს ადამიანურ შტრიხს უმატებს: კაცი, რომელიც ახლა აქ
    ზამთარსაც ატარებს, ექიმია — თუშეთის ერთადერთი ადგილობრივი ექიმი.


    ჩვეული გაგებით აქ სანახაობა არ არის: რამდენიმე სახლი, ხეობა და ჰაერი. თუშები დღესაც ყოველ ზაფხულს
    ცხვარს მთის საძოვრებზე არეკავენ, ზამთრობით კი ალვანში ჩამორეკავენ. აქ სიმაღლისთვის და სიჩუმისთვის
    ამოდიხართ — და იმისთვის, რომ ერთი წამით ევროპის დასახლებული სამყაროს ზედა კიდეზე დადგეთ.
  tip: >-
    ბოჭორნა თუშეთის მოგზაურობის ხანმოკლე გაჩერებად აღიქვით და არა ცალკე მიზნად — ერთი საათი სავსებით საკმარისია.
    შესვლა უფასოა და საყიდელიც არაფერია: ომალოს იქით არც მაღაზიაა, არც კაფე, არც საპირფარეშო და არც საწვავი,
    მობილური კავშირი კი უკეთეს შემთხვევაში წყვეტილია. წაიღეთ წყალი, საჭმელი და თბილი ტანსაცმელი — ამ სიმაღლეზე
    აგვისტოშიც ცივი ღამეებია, ნაღდი ფული კი ბარიდანვე იქონიეთ, რადგან თუშეთში ბანკომატი არ არის. სახლებში
    ხალხი ცხოვრობს: ადამიანების გადაღებამდე ან ეზოში შესვლამდე ნებართვა ითხოვეთ. წასვლამდე ომალოში გზის
    მდგომარეობა გაიგეთ, განსაკუთრებით წვიმის შემდეგ.
  route: >-
    თბილისიდან გომბორის უღელტეხილით (შ38) თელავამდე იარეთ, გააგრძელეთ ახმეტამდე და ალაზანს ჩრდილოეთით
    აუყევით ფშაველამდე; ავზი ახმეტაში შეავსეთ — თუშეთამდე ეს ბოლო ბენზინგასამართია. ფშაველიდან გრუნტის
    გზა აბანოს უღელტეხილზე ადის და ომალოში ჩადის: ვიწრო სერპანტინი, ჩამოცვენილი ქვა და მოსახვევები, სადაც
    შეიძლება უკუსვლით მოგიწიოთ მანევრირება. გზა, როგორც წესი, მხოლოდ ივნისის დასაწყისიდან სექტემბრის ბოლომდეა
    გახსნილი. ომალოდან დაახლოებით 10 კილომეტრი ცუდი გრუნტის გზა ჩრდილო-დასავლეთით, ჯვარბოსელის მიმართულებით,
    გომეწრის ხეობაში შედის. სულ დაახლოებით 210 კილომეტრია; რვანახევარი საათი გაითვალისწინეთ და გზა ომალოში
    ღამის გათევით გაყავით. მხოლოდ ოფროუდ კლასი; წინასწარ დარწმუნდით, რომ გაქირავების პირობები აბანოს უღელტეხილს
    უშვებს.
en:
  name: Bochorna
  short: >-
    A few houses at 2,345 m in Tusheti's Gometsari gorge: officially Europe's highest permanently inhabited
    village, reached only in summer and only by 4x4.
  body: >-
    **At 2,345 metres in Tusheti's Gometsari gorge, Bochorna is, by the Georgian government's reckoning,
    the highest permanently inhabited place in Europe, though for years "inhabited" meant one man.**


    Recorded in older sources as Bochorma, the village lies on the southern slopes of the Makratela range,
    a spur of the Greater Caucasus, inside Tusheti National Park. Like many Tush hamlets it emptied slowly
    as families settled in the lowlands around Alvani from the first half of the 19th century onward,
    and the 2002 census found it abandoned. By the 2014 census it had one permanent resident, with a few
    more in summer. On that basis the state restored Bochorna's village status and declared it Europe's
    highest permanently inhabited place, a title previously claimed by Ushguli in Svaneti.


    Travel guides from the 2020s add a human footnote: the man who now winters here is a doctor, Tusheti's
    only resident physician.


    There is nothing to tour here in the usual sense: a few houses, the gorge and the air. The Tush still
    drive their sheep up to the high pastures each summer and down to Alvani for the winter. You come
    for the altitude and the silence, and to stand for a moment at the upper edge of Europe's settled
    world.
  tip: >-
    Treat Bochorna as a short stop within a Tusheti trip, not a destination on its own; an hour is plenty.
    It is free, and there is nothing to buy: no shop, café, toilet or fuel beyond Omalo, and mobile signal
    is patchy at best. Bring water, food and warm layers, because at this height nights are cold even
    in August, and carry cash from the lowlands, as Tusheti has no ATMs. The houses are homes, so ask
    before photographing people or stepping into a yard, and check the state of the track in Omalo first,
    especially after rain.
  route: >-
    From Tbilisi cross the Gombori Pass (Sh38) to Telavi, continue to Akhmeta and follow the Alazani north
    to Pshaveli; fill up in Akhmeta, the last fuel before Tusheti. From Pshaveli an unpaved road climbs
    over the Abano Pass to Omalo: tight hairpins, falling rock and bends where you may have to reverse.
    It is usually open only from early June to late September. From Omalo about 10 km of rough track leads
    north-west towards Jvarboseli into the Gometsari gorge. That makes about 210 km in all; budget eight
    and a half hours and break the journey with a night in Omalo. Offroad class only, and check that your
    rental terms allow the Abano Pass.
ru:
  name: Бочорна
  short: >-
    Несколько домов на высоте 2345 м в ущелье Гомецари: официально самое высокое постоянно обитаемое село
    Европы. Только летом и только на 4x4.
  body: >-
    **На высоте 2345 метров, в тушетском ущелье Гомецари, стоит Бочорна — по оценке грузинского правительства,
    самое высокое постоянно обитаемое место в Европе. Правда, долгие годы слово «обитаемое» означало одного-единственного
    человека.**


    В старых источниках село значится как Бочорма. Оно лежит на южных склонах хребта Макратела, отрога
    Большого Кавказа, в границах Тушетского национального парка. Как и многие тушинские сёла, Бочорна
    пустела медленно: с первой половины XIX века семьи одна за другой оседали на равнине, в окрестностях
    Алвани, и перепись 2002 года застала село заброшенным. К переписи 2014 года в нём жил один постоянный
    житель, а летом — ещё несколько человек. На этом основании государство вернуло Бочорне статус села
    и объявило её самым высоким постоянно обитаемым местом Европы — титул, который прежде приписывали
    Ушгули в Сванетии.


    Путеводители 2020-х годов добавляют к этой истории человеческую деталь: тот, кто теперь остаётся здесь
    на зиму, — врач, единственный доктор, постоянно живущий в Тушети.


    Осматривать здесь в привычном смысле нечего: несколько домов, ущелье и воздух. Тушины по-прежнему
    каждое лето поднимают отары на высокогорные пастбища, а на зиму сгоняют их вниз, в Алвани. Сюда едут
    ради высоты и тишины — и чтобы на минуту встать у верхней кромки обжитой Европы.
  tip: >-
    Считайте Бочорну короткой остановкой в поездке по Тушети, а не самостоятельной целью: часа здесь вполне
    достаточно. Посещение бесплатное, да и купить нечего: за Омало нет ни магазина, ни кафе, ни туалета,
    ни заправки, а мобильная связь в лучшем случае неустойчива. Возьмите воду, еду и тёплые вещи — на
    такой высоте ночи холодные даже в августе, — а наличными запаситесь ещё внизу: банкоматов в Тушети
    нет. Дома здесь жилые, поэтому спрашивайте разрешения, прежде чем фотографировать людей или заходить
    во двор, а о состоянии дороги сначала узнайте в Омало, особенно после дождя.
  route: >-
    Из Тбилиси — через Гомборский перевал (Sh38) до Телави, дальше до Ахметы и вдоль Алазани на север
    до Пшавели; заправьтесь в Ахмете — это последняя заправка перед Тушети. От Пшавели грунтовая дорога
    поднимается через перевал Абано к Омало: крутые серпантины, камнепады и повороты, где, возможно, придётся
    сдавать назад. Обычно она открыта лишь с начала июня до конца сентября. От Омало около 10 км разбитой
    колеи ведут на северо-запад, в сторону Джварбосели, в ущелье Гомецари. Всего выходит около 210 км;
    закладывайте восемь с половиной часов и разбейте путь ночёвкой в Омало. Только внедорожный класс;
    заранее убедитесь, что условия аренды допускают поездку через перевал Абано.
fa:
  name: بوچورنا
  short: >-
    چند خانه در ۲٬۳۴۵ متری درهٔ گومتساری توشتی: رسماً بلندترین روستای دائماً مسکونی اروپا؛ فقط تابستان
    و فقط با ۴×۴.
  body: >-
    **بوچورنا، در ارتفاع ۲٬۳۴۵ متری و در درهٔ گومتساریِ توشتی، به اعلام دولت گرجستان بلندترین نقطهٔ اروپاست
    که ساکنان دائمی دارد؛ هرچند سال‌ها «ساکنان» تنها به معنای یک مرد بود.**


    این روستا که در منابع کهن‌تر «بوچورما» ثبت شده، بر دامنه‌های جنوبی رشته‌کوه ماکراتلا، شاخه‌ای از قفقاز
    بزرگ، و درون پارک ملی توشتی جای دارد. بوچورنا نیز مانند بسیاری از آبادی‌های توشی آرام‌آرام خالی شد:
    از نیمهٔ نخست سدهٔ ۱۹ به این سو، خانواده‌ها یکی‌یکی در دشت‌های پیرامون آلوانی ساکن شدند، و سرشماری
    ۲۰۰۲ روستا را متروک یافت. در سرشماری ۲۰۱۴ یک ساکن دائمی داشت و در تابستان چند نفر دیگر. بر همین پایه،
    دولت عنوان روستا را به بوچورنا بازگرداند و آن را بلندترین مکان اروپا با سکونت دائمی اعلام کرد؛ عنوانی
    که پیش‌تر به اوشگولی در سوانتی نسبت داده می‌شد.


    راهنماهای سفرِ دههٔ ۲۰۲۰ پانوشتی انسانی بر این داستان افزوده‌اند: مردی که اکنون زمستان را اینجا می‌گذراند
    پزشک است، تنها پزشکی که در توشتی ساکن است.


    اینجا به معنای معمول چیزی برای گشت‌وگذار نیست: چند خانه، دره و هوا. توش‌ها هنوز هر تابستان گله‌های
    گوسفندشان را به چراگاه‌های بلند می‌برند و برای زمستان به آلوانی پایین می‌آورند. به اینجا برای ارتفاع
    و سکوت می‌آیید، و برای آنکه لحظه‌ای بر لبهٔ بالاییِ جهانِ آبادِ اروپا بایستید.
  tip: >-
    بوچورنا را توقفی کوتاه در دل سفر توشتی بدانید، نه مقصدی مستقل؛ یک ساعت کاملاً بس است. بازدید رایگان
    است و چیزی هم برای خریدن نیست: آن سوی اومالو نه مغازه‌ای هست، نه کافه‌ای، نه دستشویی و نه سوخت، و
    آنتن موبایل در بهترین حالت بریده‌بریده است. آب، خوراک و لباس گرم همراه داشته باشید، چون در این ارتفاع
    شب‌ها حتی در اوت سرد است، و پول نقد را از پایین با خود بیاورید، زیرا در توشتی هیچ خودپردازی نیست.
    این خانه‌ها خانهٔ مردم‌اند؛ پیش از عکس گرفتن از کسی یا پا گذاشتن به حیاطی اجازه بگیرید، و نخست در
    اومالو از وضع راه باخبر شوید، به‌ویژه پس از باران.
  route: >-
    از تفلیس از گذرگاه گومبوری (Sh38) به تلاوی بروید، سپس تا آخمِتا ادامه دهید و در امتداد آلازانی به
    سوی شمال تا پشاولی برانید؛ در آخمِتا، آخرین جایگاه سوخت پیش از توشتی، باک را پر کنید. از پشاولی جاده‌ای
    خاکی از گذرگاه آبانو بالا می‌رود و به اومالو می‌رسد: پیچ‌های تنگ و تند، ریزش سنگ و قوس‌هایی که شاید
    ناچار شوید در آن‌ها دنده‌عقب بروید. این راه معمولاً تنها از اوایل ژوئن تا اواخر سپتامبر باز است. از
    اومالو حدود ۱۰ کیلومتر راه ناهموار به سوی شمال‌غرب، در جهت جواربوسلی، به درهٔ گومتساری می‌رود. روی‌هم
    حدود ۲۱۰ کیلومتر می‌شود؛ هشت ساعت و نیم در نظر بگیرید و سفر را با یک شب اقامت در اومالو دو نیم کنید.
    تنها کلاس آفرود؛ و بررسی کنید که شرایط اجاره‌تان عبور از گذرگاه آبانو را مجاز بداند.
he:
  name: בוצ'ורנה
  short: >-
    כמה בתים בגובה 2,345 מ' בערוץ גומצרי שבתושטי: רשמית, הכפר הגבוה ביותר באירופה שיש בו תושבי קבע. מגיעים
    אליו רק בקיץ ורק ברכב 4x4.
  body: >-
    **בגובה 2,345 מטר, בערוץ גומצרי שבתושטי, שוכנת בוצ'ורנה – לפי הכרזת ממשלת גאורגיה, המקום הגבוה ביותר
    באירופה שמיושב דרך קבע. אלא שבמשך שנים, "מיושב" פירושו היה אדם אחד.**


    במקורות ישנים יותר נקרא הכפר בוצ'ורמה. הוא יושב על המדרונות הדרומיים של רכס מקרטלה, שלוחה של הקווקז
    הגדול, בתוך הפארק הלאומי תושטי. כמו כפרים קטנים רבים בתושטי, הוא התרוקן לאט: החל מהמחצית הראשונה של
    המאה ה-19 השתקעו המשפחות בזו אחר זו בשפלה שסביב אלוואני, ומפקד האוכלוסין של 2002 מצא אותו נטוש. במפקד
    2014 נמנה בו תושב קבע אחד, ובקיץ עוד כמה אנשים. על סמך זה החזירה המדינה לבוצ'ורנה את מעמד הכפר והכריזה
    עליה כמקום הגבוה ביותר באירופה שמיושב דרך קבע – תואר שקודם לכן יוחס לאושגולי שבסוואנטי.


    מדריכי טיולים משנות ה-2020 מוסיפים לסיפור הערת שוליים אנושית: האיש שנשאר כאן כיום לאורך החורף הוא
    רופא, הרופא היחיד שגר דרך קבע בתושטי.


    אין כאן מה לראות במובן הרגיל של המילה: כמה בתים, הערוץ והאוויר. התושים עדיין מעלים בכל קיץ את עדרי
    הכבשים שלהם אל כרי המרעה הגבוהים, ובחורף מורידים אותם לאלוואני. באים לכאן בשביל הגובה והשקט, וכדי
    לעמוד לרגע בקצה העליון של אירופה המיושבת.
  tip: >-
    ראו בבוצ'ורנה עצירה קצרה במסגרת טיול בתושטי, לא יעד בפני עצמו; שעה אחת מספיקה בהחלט. הביקור חינם,
    וממילא אין מה לקנות: אחרי אומאלו אין חנות, בית קפה, שירותים או דלק, והקליטה הסלולרית חלקית במקרה הטוב.
    הביאו מים, אוכל ושכבות חמות, כי בגובה הזה הלילות קרים גם באוגוסט, והצטיידו במזומנים עוד בשפלה, כי
    בתושטי אין כספומטים. הבתים הם בתים של אנשים, לכן בקשו רשות לפני שאתם מצלמים מישהו או נכנסים לחצר,
    ובררו באומאלו מה מצב הדרך לפני שיוצאים, במיוחד אחרי גשם.
  route: >-
    מטביליסי חוצים את מעבר גומבורי (Sh38) אל טלאווי, ממשיכים לאחמטה ועולים צפונה לאורך נהר האלזני עד פשאוולי;
    תדלקו באחמטה – תחנת הדלק האחרונה לפני תושטי. מפשאוולי מטפסת דרך עפר אל מעבר אבאנו ויורדת לאומאלו:
    סיבובי פרסה צפופים, נפילות סלעים ועיקולים שבהם ייתכן שתצטרכו לנסוע לאחור. בדרך כלל היא פתוחה רק מתחילת
    יוני עד סוף ספטמבר. מאומאלו מובילה דרך עפר משובשת של כ-10 ק"מ צפון-מערבה, לכיוון ג'ווארבוסלי, אל ערוץ
    גומצרי. בסך הכול כ-210 ק"מ; הקצו שמונה שעות וחצי ופצלו את הנסיעה בלינה באומאלו. רכבי שטח בלבד, ובדקו
    שתנאי ההשכרה שלכם מתירים נסיעה במעבר אבאנו.
ar:
  name: بوتشورنا
  short: >-
    بضعة بيوت على ارتفاع 2,345 م في مضيق غوميتساري بتوشيتي: رسمياً أعلى قرية مأهولة بصورة دائمة في أوروبا،
    ولا سبيل إليها إلا صيفاً وبسيارة دفع رباعي (4x4).
  body: >-
    **على ارتفاع 2,345 متراً، في مضيق غوميتساري بإقليم توشيتي، تقع بوتشورنا، وهي بحسب الحكومة الجورجية
    أعلى مكان مأهول بصورة دائمة في أوروبا، وإن ظلّت كلمة "مأهول" تعني طوال سنوات رجلاً واحداً.**


    تَرِد القرية في مصادر أقدم باسم بوتشورما، وتقع على المنحدرات الجنوبية لسلسلة ماكراتيلا، وهي فرع من
    القوقاز الكبير، داخل منتزه توشيتي الوطني. وكحال كثير من قرى التوش الصغيرة، فرغت ببطء، إذ راحت العائلات
    منذ النصف الأول من القرن التاسع عشر تستقر في السهول المحيطة بألفاني، حتى وجدها تعداد 2002 مهجورة.
    وبحلول تعداد 2014 صار فيها ساكن دائم واحد، يزيد عليه بضعة أشخاص في الصيف. وعلى هذا الأساس أعادت الدولة
    إلى بوتشورنا صفة القرية وأعلنتها أعلى مكان مأهول بصورة دائمة في أوروبا، وهو لقب كان يُنسب من قبلُ
    إلى أوشغولي في سفانيتي.


    وتضيف أدلة السفر الصادرة في عشرينيات هذا القرن إلى الحكاية حاشية إنسانية: الرجل الذي يقضي الشتاء هنا
    اليوم طبيب، وهو الطبيب الوحيد المقيم في توشيتي.


    لا شيء هنا يُزار بالمعنى المألوف: بضعة بيوت، والمضيق، والهواء. وما زال التوش يسوقون قطعان أغنامهم
    كل صيف إلى المراعي العالية، ثم ينزلون بها إلى ألفاني لقضاء الشتاء. تأتي إلى هنا من أجل الارتفاع والسكون،
    ولتقف لحظةً عند الحافة العليا لأوروبا المأهولة.
  tip: >-
    اعتبر بوتشورنا محطة قصيرة ضمن رحلة إلى توشيتي، لا وجهة قائمة بذاتها؛ فساعة واحدة تكفي. الزيارة مجانية،
    ولا شيء هنا يُشترى أصلاً: فبعد أومالو لا متجر ولا مقهى ولا دورة مياه ولا وقود، وتغطية الهاتف المحمول
    متقطعة في أحسن الأحوال. احمل الماء والطعام وطبقات من الملابس الدافئة، فالليالي على هذا الارتفاع باردة
    حتى في أغسطس، وخذ ما يلزمك من نقد من الأراضي المنخفضة، إذ لا توجد في توشيتي أجهزة صراف آلي. البيوت
    مساكن أهلها، فاستأذن قبل تصوير الناس أو دخول أي فناء، واسأل في أومالو أولاً عن حال الطريق، ولا سيما
    بعد المطر.
  route: >-
    من تبليسي اعبر ممر غومبوري (Sh38) إلى تيلافي، ثم تابع إلى أخميتا وسِر شمالاً بمحاذاة نهر ألازاني حتى
    بشافيلي؛ املأ خزان الوقود في أخميتا، فهي آخر محطة وقود قبل توشيتي. من بشافيلي يصعد طريق غير معبّد
    عبر ممر أبانو إلى أومالو: منعطفات حادة متلاحقة، وتساقط صخور، ومنحنيات قد تضطر فيها إلى الرجوع بالسيارة
    إلى الخلف. ولا يُفتح عادةً إلا من أوائل يونيو حتى أواخر سبتمبر. ومن أومالو يمتد مسار وعر طوله نحو
    10 كم باتجاه الشمال الغربي، نحو جفاربوسيلي، حتى مضيق غوميتساري. فتبلغ المسافة الإجمالية نحو 210 كم؛
    احسب لها ثماني ساعات ونصفاً، وقسّم الرحلة بمبيت ليلة في أومالو. للسيارات من فئة الطرق الوعرة فقط،
    وتحقّق من أن شروط الاستئجار تسمح بعبور ممر أبانو.
