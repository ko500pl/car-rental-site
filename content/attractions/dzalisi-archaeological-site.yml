ka:
  name: ძალისის არქეოლოგიური ძეგლი
  short: >-
    პტოლემაიოსის მიერ მოხსენიებული იბერიული ქალაქი ზალისა — სასახლეები, რომაული ყაიდის აბანოები და კავკასიის
    ერთ-ერთი უძველესი მოზაიკა.
  body: >-
    **ახ. წ. II საუკუნეში გეოგრაფმა პტოლემაიოსმა იბერიის მთავარ ქალაქებს შორის ზალისა ჩაწერა; არქეოლოგების
    აზრით, ის მუხრანის ველის ყანების ქვეშ იპოვეს.**


    ძალისში ხალხი დაახლოებით ძვ. წ. II საუკუნიდან ახ. წ. VIII საუკუნემდე ცხოვრობდა, ქალაქის აყვავების
    ხანა კი ახ. წ. I–III საუკუნეებზე მოდის; ანტიკური ფენების ქვემოთ ბრინჯაოს ხანის რამდენიმე ფენაც გამოვლინდა.
    ზოგი მკვლევარი უფრო შორსაც მიდის და ძალისს მცხეთის გვერდით ქართლის მეფეთა მეორე რეზიდენციად მიიჩნევს.
    პირველი სისტემური გათხრები 1972–1977 წლებში ჩატარდა და მას შემდეგ გრძელდება.


    აღმოჩენილის ჩამონათვალი რომაული სამყაროს კიდეზე მდებარე პატარა დედაქალაქის გეგმას ჰგავს: ოთხი სასახლე,
    აკროპოლისი, ტაძარი, ყაზარმები, ადმინისტრაციული ნაგებობები, სამაროვნები და წყალსადენის სისტემა. უდიდესი
    სასახლე 2 500 კვადრატულ მეტრზე მეტს იკავებს და შადრევნიან ეზოს გარს აკრავს — მას საქართველოში გათხრილ
    სასახლეთა შორის უდიდესად მიიჩნევენ; ზოგ ოთახს, მათ შორის საძინებლებსაც, საკუთარი წყალგაყვანილობა ჰქონდა.
    აბანო იატაკქვეშა ჰიპოკაუსტით თბებოდა, რომაული წესით — ცხელი, თბილი და ცივი განყოფილებებით, — და მას
    საცურაო აუზიც ახლდა, რომლის მსგავსი აღმოჩენის დროს საქართველოში არაფერი იყო ცნობილი.


    მთავარი საგანძური ერთ-ერთ ვილაშია: იატაკის მოზაიკა, რომლის ცენტრში დიონისე და არიადნე ნადიმზე არიან
    გამოსახული. სტილის მიხედვით ის დაახლოებით ახ. წ. 300 წლით თარიღდება და ბიჭვინთის (პიტიუნტის) მოზაიკებთან
    ერთად კავკასიაში აღმოჩენილ უძველეს მოზაიკებს შორისაა.


    დღეს აქ ცის ქვეშ გაშლილ დაბალ კედლებსა და საძირკვლებს შორის დადიხართ; ძეგლს ფიცრული ბილიკი კვეთს საინფორმაციო
    დაფებით, გათხრების ნაწილს კი გრძელი დამცავი გადახურვა იცავს. აბანოს კიდესთან შეჩერდით და ერთი მარტივი
    ანგარიში გააკეთეთ: როცა რომი ჯერ კიდევ რომი იყო, ამ ველზე ვიღაც ზამთრის დილით თბილ წყალში ეშვებოდა.
  tip: >-
    ჩვენ მიერ შემოწმებული არც ერთი წყარო სამუშაო საათებსა და შესვლის საფასურს არ ასახელებს, ამიტომ ორივე
    ადგილზე დააზუსტეთ. ეს ღია ცის ქვეშ მდებარე გათხრებია: ჩაიცვით ფეხსაცმელი, რომელიც არ სრიალებს, ზაფხულში
    წყალი და ქუდი წაიღეთ, წვიმის მერე კი თხრილებს შორის ტალახს ელოდეთ. კედლებსა და გაშიშვლებულ იატაკებზე
    ნუ ადიხართ — ისინი თავად არიან ექსპონატი. გათხრებზე მოზაიკას ხშირად დაცვის მიზნით ფარავენ ან გადახურავენ,
    ამიტომ თუ დიონისესა და არიადნესთვის მოდიხართ, ადგილზე მყოფს ჰკითხეთ, ღიაა თუ არა გადახურული ნაწილი
    და შეიძლება თუ არა მოზაიკის ნახვა. დაახლოებით ერთი საათი დაგჭირდებათ. დღის დასასრულად წილკნის ტაძარი
    (5 კმ) და შატო მუხრანი თავისი რესტორნით გამოგადგებათ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ჩრდილო-დასავლეთით წადით, მცხეთის კვანძს გასცდით და გორის მიმართულებით
    კიდევ დაახლოებით 20 კმ იარეთ. შემდეგ მაგისტრალიდან შ28-ზე — ახალგორის გზაზე — გადადით და დაახლოებით
    3 კილომეტრში შ151-ზე გადაუხვიეთ: ის რამდენიმე კილომეტრს ყანებს შორის მიუყვება, ძალისში შედის და გათხრებამდე
    მიდის. სულ 47 კმ-ია, დაახლოებით 50 წუთი. თითქმის მთელი გზა ასფალტიანია; მხოლოდ ძეგლთან ბოლო მისასვლელი
    შეიძლება იყოს გრუნტის — მშრალ ამინდში ეკონომ-კლასის მანქანისთვის პრობლემა არ არის, წვიმის შემდეგ კი
    ნელა იარეთ. საწვავი ს1-ზე ჩაასხით. შ151 კიდევ 5 კილომეტრში წილკანამდე მიდის.
en:
  name: Dzalisi Archaeological Site
  short: >-
    The excavated remains of Zalissa, a town Ptolemy listed among Iberia's chief cities: palaces, Roman-style
    baths and one of the Caucasus's oldest mosaics.
  body: >-
    **In the 2nd century AD the geographer Ptolemy wrote the name Zalissa into his list of Iberia's principal
    towns; under the fields of the Mukhrani valley, archaeologists believe they have found it.**


    People lived at Dzalisi from roughly the 2nd century BC to the 8th century AD, and the town was at
    its height in the 1st–3rd centuries AD; beneath the classical layers lie several Bronze Age strata.
    Some scholars go further and see it as a second seat of the kings of Kartli, beside Mtskheta. The
    first systematic campaign ran from 1972 to 1977, and excavation has continued since.


    The finds read like the plan of a small capital on the edge of the Roman world: four palaces, an acropolis,
    a temple, barracks, administrative buildings, burial grounds and a water-supply system. The largest
    palace spreads over more than 2,500 square metres around a courtyard with a fountain — described as
    the largest palace yet excavated in Georgia — and some of its rooms, bedchambers included, had their
    own water supply. The bath-house was heated from below by a hypocaust, with hot, warm and cold rooms
    in the Roman manner and a swimming pool that had no known parallel in Georgia when it came to light.


    The treasure lies in one of the villas: a floor mosaic whose centre shows Dionysus and Ariadne at
    a banquet. Its style points to around AD 300, and together with the mosaics of Pitiunt on the Black
    Sea coast it ranks among the oldest ever found in the Caucasus.


    What you walk through today are low walls and foundations open to the sky; a boardwalk with information
    boards crosses the site, and a long shelter protects part of the excavation. Stand at the edge of
    the baths and consider the arithmetic: while Rome was still Rome, someone in this valley was stepping
    into warm water on a winter morning.
  tip: >-
    None of the sources we checked publishes opening hours or an entrance fee, so treat both as something
    to confirm on arrival. This is an open-air excavation: wear shoes with grip, bring water and a hat
    in summer, and after rain expect mud between the trenches. Stay off the walls and exposed floors —
    they are the exhibit. Mosaics at excavations are often covered or sheltered for protection, so if
    you have come for Dionysus and Ariadne, ask whoever is on site whether the shelter is open and the
    floor can be seen. Allow about an hour. Tsilkani Cathedral (5 km) and Chateau Mukhrani, with its restaurant,
    round off the day.
  route: >-
    From Tbilisi take the S1 (E60) north-west past the Mtskheta junction and stay on the motorway towards
    Gori for roughly another 20 km. Leave it for the Sh28, the Akhalgori road, and after about 3 km turn
    onto the Sh151, which runs a few kilometres through farmland into Dzalisi village and on to the excavation.
    Allow 47 km and about 50 minutes. Asphalt covers almost all of it; only the final approach to the
    site may be a dirt track, fine for an economy car when dry — take it slowly after rain. Fill up on
    the S1; there are no stations in the valley villages we can vouch for. The Sh151 continues 5 km to
    Tsilkani.
ru:
  name: Археологический памятник Дзалиси
  short: >-
    Раскопанные остатки Залиссы, города, который Птолемей числил среди главных городов Иберии: дворцы,
    бани римского типа и одна из древнейших мозаик Кавказа.
  body: >-
    **Во II веке н. э. географ Птолемей вписал имя Залисса в список главных городов Иберии; под полями
    Мухранской долины, как считают археологи, этот город и нашёлся.**


    Люди жили в Дзалиси примерно со II века до н. э. до VIII века н. э., а расцвет города пришёлся на
    I–III века н. э.; под античными слоями лежат ещё несколько слоёв бронзового века. Некоторые учёные
    идут дальше и видят здесь вторую резиденцию царей Картли — рядом с Мцхетой. Первая систематическая
    кампания раскопок прошла в 1972–1977 годах, и с тех пор работы продолжаются.


    Находки складываются в план маленькой столицы на окраине римского мира: четыре дворца, акрополь, храм,
    казармы, административные здания, некрополи и водопровод. Самый большой дворец занимает более 2500
    квадратных метров вокруг двора с фонтаном — его называют крупнейшим дворцом, раскопанным в Грузии
    на сегодняшний день, — и в некоторые его покои, включая спальни, был подведён собственный водопровод.
    Баню отапливал снизу гипокауст; в ней, как у римлян, были горячий, тёплый и холодный залы, а бассейну
    для плавания на момент открытия не знали аналогов в Грузии.


    Главное сокровище — в одной из вилл: напольная мозаика, в центре которой Дионис и Ариадна на пиру.
    По стилю её относят примерно к 300 году н. э., и вместе с мозаиками Питиунта на черноморском побережье
    она входит в число древнейших, когда-либо найденных на Кавказе.


    Сегодня вы идёте среди невысоких стен и фундаментов под открытым небом; через памятник проложен деревянный
    настил с информационными щитами, а часть раскопа укрыта длинным защитным павильоном. Встаньте на краю
    бань и просто прикиньте: пока Рим ещё был Римом, кто-то в этой долине зимним утром опускался в тёплую
    воду.
  tip: >-
    Ни в одном из проверенных нами источников не указаны часы работы и плата за вход — и то и другое уточняйте
    на месте. Это раскопки под открытым небом: нужна обувь с хорошим протектором, летом — вода и шляпа,
    а после дождя между раскопами будет грязь. Не вставайте на стены и открытые полы — они и есть экспонат.
    Мозаики на раскопках часто укрывают или ставят под навес для сохранности, так что если вы приехали
    ради Диониса и Ариадны, спросите у того, кто окажется на месте, открыт ли павильон и можно ли увидеть
    пол. Закладывайте около часа. День удачно дополнят собор Цилкани (5 км) и Шато Мухрани с его рестораном.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на северо-запад мимо поворота на Мцхету и держитесь трассы в сторону
    Гори ещё примерно 20 км. Сверните с неё на Sh28, дорогу на Ахалгори, и примерно через 3 км уйдите
    на Sh151: несколько километров она бежит через поля к селу Дзалиси и дальше к раскопкам. Всего 47
    км и около 50 минут. Почти всё время асфальт; лишь последний подъезд к памятнику может оказаться грунтовым
    — в сухую погоду машина эконом-класса проедет спокойно, после дождя двигайтесь медленно. Заправьтесь
    на S1: за заправки в сёлах долины мы поручиться не можем. Та же Sh151 ведёт дальше, ещё 5 км до Цилкани.
fa:
  name: محوطهٔ باستانی دزالیسی
  short: >-
    بقایای کاوش‌شدهٔ زالیسا، شهری که بطلمیوس در شمار شهرهای اصلی ایبریا آورده بود: کاخ‌ها، گرمابه‌هایی
    به سبک رومی و یکی از کهن‌ترین موزاییک‌های قفقاز.
  body: >-
    **در سدهٔ دوم میلادی، بطلمیوسِ جغرافی‌دان نام زالیسا را در فهرست شهرهای اصلی ایبریا نوشت؛ باستان‌شناسان
    بر این باورند که آن را زیر کشتزارهای درهٔ موخرانی یافته‌اند.**


    در دزالیسی تقریباً از سدهٔ دوم پیش از میلاد تا سدهٔ هشتم میلادی مردم زندگی می‌کردند و اوج شکوفایی
    شهر در سده‌های یکم تا سوم میلادی بود؛ زیر لایه‌های دوران کلاسیک نیز چند لایه از عصر مفرغ نهفته است.
    برخی پژوهشگران فراتر می‌روند و این‌جا را دومین مقر پادشاهان کارتلی، در کنار متسختا، می‌دانند. نخستین
    فصل کاوش‌های منظم از ۱۹۷۲ تا ۱۹۷۷ انجام شد و کاوش از آن زمان ادامه دارد.


    یافته‌ها به نقشهٔ پایتختی کوچک در حاشیهٔ جهان رومی می‌مانند: چهار کاخ، یک ارگ (آکروپولیس)، یک معبد،
    سربازخانه‌ها، ساختمان‌های اداری، گورستان‌ها و شبکه‌ای برای آب‌رسانی. بزرگ‌ترین کاخ بیش از ۲۵۰۰ متر
    مربع وسعت دارد و گرد حیاطی با فواره ساخته شده — آن را بزرگ‌ترین کاخی می‌دانند که تاکنون در گرجستان
    از زیر خاک بیرون آمده است — و برخی اتاق‌هایش، از جمله اتاق‌های خواب، آب‌رسانی ویژهٔ خود را داشتند.
    گرمابه با هیپوکاست، یعنی گرمایش از زیر کف، گرم می‌شد و به شیوهٔ رومی تالارهای گرم، نیم‌گرم و سرد داشت،
    با استخری برای شنا که هنگام کشفش در گرجستان همتایی برایش شناخته نبود.


    گنج اصلی در یکی از ویلاهاست: موزاییکی بر کف که در مرکز آن دیونوسوس و آریادنه بر سر سفرهٔ ضیافت دیده
    می‌شوند. سبک آن به حدود سال ۳۰۰ میلادی اشاره دارد و همراه با موزاییک‌های پیتیونت در کرانهٔ دریای سیاه،
    در شمار کهن‌ترین موزاییک‌هایی است که تاکنون در قفقاز یافته شده‌اند.


    آنچه امروز در میانش قدم می‌زنید دیوارهای کوتاه و پی‌هایی زیر آسمان باز است؛ گذرگاهی چوبی با تابلوهای
    اطلاعات از میان محوطه می‌گذرد و سایبانی بلند از بخشی از کاوش محافظت می‌کند. بر لبهٔ گرمابه بایستید
    و حساب کنید: در روزگاری که رم هنوز رم بود، کسی در همین دره، در صبحی زمستانی، پا در آب گرم می‌گذاشت.
  tip: >-
    هیچ‌یک از منابعی که بررسی کردیم ساعات بازدید یا بهای ورودی را اعلام نکرده است، پس هر دو را در محل
    جویا شوید. این‌جا محوطهٔ کاوشی در فضای باز است: کفشی با کف محکم بپوشید، در تابستان آب و کلاه همراه
    داشته باشید و پس از باران میان ترانشه‌ها منتظر گِل باشید. روی دیوارها و کف‌های نمایان پا نگذارید؛
    خودِ آن‌ها همان چیزی‌اند که به نمایش گذاشته شده است. موزاییک‌های محوطه‌های کاوش اغلب برای حفاظت پوشانده
    یا زیر سایبان نگهداری می‌شوند؛ پس اگر برای دیونوسوس و آریادنه آمده‌اید، از کسی که در محل حضور دارد
    بپرسید آیا سایبان باز است و می‌توان کف را دید. حدود یک ساعت وقت بگذارید. کلیسای جامع تسیلکانی (۵ کیلومتر)
    و شاتو موخرانی با رستورانش روز را کامل می‌کنند.
  route: >-
    از تفلیس از جادهٔ S1 (E60) رو به شمال‌غرب بروید، از دوراهی متسختا بگذرید و حدود ۲۰ کیلومتر دیگر در
    بزرگراه به سوی گوری ادامه دهید. سپس به Sh28، جادهٔ آخالگوری، بپیچید و پس از حدود ۳ کیلومتر وارد Sh151
    شوید که چند کیلومتر از میان کشتزارها تا روستای دزالیسی و از آن‌جا تا محوطهٔ کاوش پیش می‌رود. روی هم
    ۴۷ کیلومتر و حدود ۵۰ دقیقه راه است. تقریباً همهٔ مسیر آسفالت است؛ فقط راه دسترسی پایانی به محوطه ممکن
    است خاکی باشد که در هوای خشک برای خودروی اقتصادی مشکلی ندارد — پس از باران آهسته برانید. در S1 سوخت‌گیری
    کنید؛ برای روستاهای دره پمپ بنزینی نمی‌شناسیم که بتوانیم از آن مطمئن باشیم. همین Sh151 پنج کیلومتر
    دیگر تا تسیلکانی ادامه می‌یابد.
he:
  name: האתר הארכאולוגי דזאליסי
  short: >-
    שרידיה החפורים של זליסה, עיר שתלמי מנה בין הערים הראשיות של איבריה: ארמונות, מרחצאות בסגנון רומי ואחד
    הפסיפסים העתיקים בקווקז.
  body: >-
    **במאה ה־2 לספירה רשם הגאוגרף תלמי את השם זליסה ברשימת הערים הראשיות של איבריה; מתחת לשדות עמק מוחרני,
    כך סבורים הארכאולוגים, הם מצאו אותה.**


    בדזאליסי חיו בני אדם בערך מן המאה ה־2 לפני הספירה ועד המאה ה־8 לספירה, ושיאה של העיר היה במאות ה־1
    עד ה־3 לספירה; מתחת לשכבות התקופה הקלאסית מונחות עוד כמה שכבות מתקופת הברונזה. יש חוקרים שהולכים רחוק
    יותר ורואים בה מושב שני של מלכי קרתלי, לצד מצחתה. עונת החפירות השיטתית הראשונה נערכה בשנים 1972–1977,
    והחפירות נמשכות מאז.


    הממצאים נקראים כמו תוכנית של בירה קטנה בשולי העולם הרומי: ארבעה ארמונות, אקרופוליס, מקדש, מגורי חיילים,
    מבני מִנהל, בתי קברות ומערכת אספקת מים. הארמון הגדול ביותר משתרע על יותר מ־2,500 מטרים רבועים סביב
    חצר ובה מזרקה — הוא מתואר כארמון הגדול ביותר שנחפר עד כה בגאורגיה — ולכמה מחדריו, ובהם חדרי שינה,
    הייתה אספקת מים משלהם. בית המרחץ חומם מלמטה באמצעות היפוקאוסט, ובו, כמנהג הרומאים, חדרים חמים, פושרים
    וקרים, וכן בריכת שחייה שבעת גילויה לא היה לה אח ורע בגאורגיה.


    האוצר נמצא באחת הווילות: פסיפס רצפה שבמרכזו דיוניסוס ואריאדנה בסעודה. סגנונו מצביע על סביבות שנת 300
    לספירה, ויחד עם הפסיפסים של פיטיונט שעל חוף הים השחור הוא נמנה עם העתיקים ביותר שנמצאו אי פעם בקווקז.


    היום אתם מהלכים בין קירות נמוכים ויסודות תחת כיפת השמיים; שביל קרשים עם שלטי מידע חוצה את האתר, ומבנה
    הגנה ארוך מקרה חלק מן החפירה. עמדו על שפת בית המרחץ ועשו את החשבון: בזמן שרומא עוד הייתה רומא, מישהו
    בעמק הזה נכנס למים חמימים בבוקר של חורף.
  tip: >-
    אף אחד מהמקורות שבדקנו אינו מפרסם שעות פתיחה או דמי כניסה, ולכן כדאי לברר את שניהם במקום. זוהי חפירה
    פתוחה: נעלו נעליים עם אחיזה טובה, הביאו מים וכובע בקיץ, ואחרי גשם צפו לבוץ בין התעלות. אל תעלו על
    הקירות ועל הרצפות החשופות — הם המוצג עצמו. פסיפסים באתרי חפירה מכוסים או מוצלים לעיתים קרובות לשם
    שימורם, כך שאם באתם בשביל דיוניסוס ואריאדנה, שאלו את מי שנמצא באתר אם מבנה ההגנה פתוח ואם אפשר לראות
    את הרצפה. הקדישו כשעה. קתדרלת צילקני (5 ק"מ) ושאטו מוחרני עם המסעדה שלו משלימים את היום.
  route: >-
    מטביליסי סעו בכביש S1 (E60) צפון־מערבה, עברו את צומת מצחתה והמשיכו בכביש המהיר לכיוון גורי עוד כ־20
    ק"מ. צאו ממנו לכביש Sh28, הדרך לאחלגורי, ואחרי כ־3 ק"מ פנו לכביש Sh151, שעובר כמה קילומטרים בין שדות
    אל הכפר דזאליסי והלאה אל החפירות. בסך הכול 47 ק"מ וכ־50 דקות. כמעט כל הדרך סלולה; רק הגישה האחרונה
    לאתר עשויה להיות דרך עפר, שרכב חסכוני עובר בה בקלות כשיבש — אחרי גשם סעו לאט. תדלקו בכביש S1; בכפרי
    העמק אין תחנות דלק שנוכל להמליץ עליהן בביטחון. אותו כביש Sh151 ממשיך עוד 5 ק"מ עד צילקני.
ar:
  name: موقع دزاليسي الأثري
  short: >-
    البقايا المكتشفة لزاليسا، المدينة التي عدّها بطليموس بين كبرى مدن إيبيريا: قصور، وحمّامات على الطراز
    الروماني، وواحدة من أقدم الفسيفساء في القوقاز.
  body: >-
    **في القرن الثاني للميلاد دوّن الجغرافي بطليموس اسم زاليسا في قائمته لكبرى مدن إيبيريا؛ وتحت حقول
    وادي موخراني، يعتقد علماء الآثار أنهم عثروا عليها.**


    عاش الناس في دزاليسي تقريبًا من القرن الثاني قبل الميلاد حتى القرن الثامن الميلادي، وبلغت المدينة
    ذروتها بين القرنين الأول والثالث للميلاد؛ وتحت الطبقات الكلاسيكية تقبع عدة طبقات من العصر البرونزي.
    ويذهب بعض الباحثين أبعد من ذلك، فيرون فيها مقرًّا ثانيًا لملوك كارتلي إلى جانب متسخيتا. جرت أول حملة
    تنقيب منهجية بين عامي 1972 و1977، ولا تزال التنقيبات مستمرة منذ ذلك الحين.


    تبدو المكتشفات كمخطط عاصمة صغيرة على تخوم العالم الروماني: أربعة قصور، وأكروبوليس، ومعبد، وثكنات،
    ومبانٍ إدارية، ومقابر، وشبكة لإمداد المياه. يمتد أكبر القصور على أكثر من 2500 متر مربع حول فناء فيه
    نافورة — ويوصف بأنه أكبر قصر كُشف عنه في جورجيا حتى اليوم — وكان لبعض غرفه، ومنها غرف النوم، إمداد
    خاص بالمياه. أما الحمّام فكان يُدفّأ من الأسفل بنظام الهيبوكوست، وفيه على الطريقة الرومانية قاعات
    ساخنة ودافئة وباردة، وحوض للسباحة لم يكن له نظير معروف في جورجيا حين اكتُشف.


    والكنز في إحدى الفيلات: أرضية من الفسيفساء يتوسطها ديونيسوس وأريادني في مأدبة. يشير أسلوبها إلى نحو
    عام 300 للميلاد، وهي مع فسيفساء بيتيونت على ساحل البحر الأسود من أقدم ما عُثر عليه في القوقاز على
    الإطلاق.


    ما تمشي بينه اليوم جدران منخفضة وأساسات تحت السماء المكشوفة؛ ويعبر الموقعَ ممشى خشبي مزوّد بلوحات
    إرشادية، بينما تحمي مظلة طويلة جزءًا من التنقيب. قف عند حافة الحمّام وأجرِ الحساب: حين كانت روما لا
    تزال روما، كان أحدهم في هذا الوادي ينزل إلى الماء الدافئ في صباح شتوي.
  tip: >-
    لا يذكر أيٌّ من المصادر التي راجعناها ساعات العمل أو رسم الدخول، فاعتبر الأمرين مما يجب التحقق منه
    عند الوصول. هذا موقع تنقيب مكشوف: انتعل حذاءً ثابت القبضة، واحمل الماء وقبعة في الصيف، وتوقّع الوحل
    بين الخنادق بعد المطر. لا تصعد على الجدران ولا على الأرضيات المكشوفة — فهي المعروضات نفسها. كثيرًا
    ما تُغطّى الفسيفساء في مواقع التنقيب أو تُظلَّل لحمايتها، فإن جئت من أجل ديونيسوس وأريادني فاسأل من
    تجده في الموقع إن كانت المظلة مفتوحة وكان بالإمكان رؤية الأرضية. خصّص نحو ساعة. وتكمل كاتدرائية تسيلكاني
    (5 كم) وشاتو موخراني بمطعمه اليوم على نحو جميل.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) باتجاه الشمال الغربي متجاوزًا مفترق متسخيتا، وابقَ على الطريق السريع
    نحو غوري قرابة 20 كم أخرى. ثم اتركه إلى الطريق Sh28، طريق أخالغوري، وبعد نحو 3 كم انعطف إلى الطريق
    Sh151 الذي يمر بضعة كيلومترات بين الحقول إلى قرية دزاليسي ثم إلى موقع التنقيب. المسافة الإجمالية 47
    كم، ونحو 50 دقيقة. الطريق معبّد في معظمه؛ وقد يكون المدخل الأخير إلى الموقع ترابيًا، وهو مناسب لسيارة
    اقتصادية في الطقس الجاف — أما بعد المطر فتمهّل. تزوّد بالوقود على الطريق S1، فلا نستطيع أن نضمن وجود
    محطات في قرى الوادي. ويستمر الطريق Sh151 نفسه 5 كم أخرى حتى تسيلكاني.
