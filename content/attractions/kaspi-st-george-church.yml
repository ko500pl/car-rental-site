ka:
  name: კასპის წმინდა გიორგის ეკლესია
  short: >-
    მოქმედი სამრევლო ეკლესია კასპის ცენტრში — საქართველოს ერთ-ერთ უძველეს ქალაქში, რომელიც V საუკუნეში
    სპასალარის საჯდომი იყო.
  body: >-
    **კასპის წმინდა გიორგი მუზეუმის ექსპონატი კი არა, მოქმედი სამრევლო ეკლესიაა 26 მაისის ქუჩაზე — საქართველოს
    ერთ-ერთი უძველესი ქალაქის ყოველდღიური სალოცავი.**


    კასპის ფესვები ღრმაა. არქეოლოგებმა აქ დასახლება ბრინჯაოს ხანიდან დაადასტურეს, XI საუკუნის მემატიანე
    ლეონტი მროველი კი ქალაქის დაარსებას მცხეთოსის ძე უფლოსს მიაწერდა — ეს თქმულებაა და არა დოკუმენტური
    ცნობა. V საუკუნეში კასპი სპასალარის, ანუ სამხედრო მმართველის, საჯდომი იყო, გადმოცემით კი აქ იზრდებოდნენ
    ყრმა ვახტანგ გორგასალი და მისი და მირანდუხტი. VIII საუკუნის 30-იან წლებში არაბთა სარდალმა მარვან იბნ
    მუჰამადმა — ქართველებისთვის მურვან ყრუმ — ქალაქი ისე გააპარტახა, რომ იქ საქალაქო ცხოვრება შეწყდა.
    ათასი წლის შემდეგ ვახუშტი ბაგრატიონი ამას ერთი ფრაზით შეაჯამა: „და იყო ქალაქი ყრუმდე, ხოლო აწ არს
    დაბა დიდი“. ქალაქის სტატუსი კასპმა მხოლოდ 1959 წელს დაიბრუნა.


    წმინდა გიორგის ეკლესია ცოცხალ ქალაქს ეკუთვნის და არა დანგრეულს. ის ცენტრის სამ მოქმედ ეკლესიათაგან
    ერთ-ერთია — წმინდა ვახტანგ გორგასლის სახელობის საკათედრო ტაძართან და წმინდა თევდორე ტირონის ეკლესიასთან
    ერთად. როდის ან ვინ ააშენა, სანდო წყაროში ვერ ვიპოვეთ და თარიღს არ მოვიგონებთ.


    შემოიარეთ სანთლის დასანთებად და ერთი წუთის სიჩუმისთვის — ქალაქში, რომელიც „ყრუმდე“ ქალაქი იყო და ქალაქობის
    დასაბრუნებლად თორმეტი საუკუნე დასჭირდა.
  tip: >-
    შესვლა უფასოა. ჩაიცვით მხრებისა და მუხლების დამფარავი ტანსაცმელი, ქალებს თავსაფარი გამოადგებათ. წირვის
    დროს ხმადაბლა იყავით და ფოტოს გადაღებამდე ნებართვა ითხოვეთ; ყველაზე ხალხმრავლად კვირა დილის ლიტურგიაზეა.
    მანქანას ქუჩაში უპრობლემოდ გააჩერებთ. კასპი ჩვეულებრივი, ცოცხალი ქალაქია: მაღაზიები და კაფეები ცენტრშია,
    ბენზინგასამართი სადგურები — მაგისტრალზე, ამიტომ ციხეებისკენ გადახვევამდე აქ გაჩერება პრაქტიკულიცაა.
    ნახევარი საათი საკმარისია; დღე ჯავახაანთ ციხით ან სამთავისის ტაძრით შეავსეთ.
  route: >-
    თბილისიდან დასავლეთისკენ ს1 (E60) მაგისტრალით იარეთ და მცხეთას გაუარეთ. გზა მთლიანად ასფალტიანია:
    დაახლოებით 64 კმ და 55 წუთი. კასპის მოსახვევთან მაგისტრალიდან გადადით და ქალაქის ცენტრისკენ მიმავალ
    ნიშნებს გაჰყევით; ეკლესია 26 მაისის ქუჩაზე დგას, ახლოს ჩვეულებრივი ქუჩის პარკირებაა. ბენზინგასამართი
    სადგურები მაგისტრალის გასწვრივ ხშირია. ეკონომ კლასის ნებისმიერი მანქანა საკმარისია — არც აღმართია,
    არც ხრეში. თუ ჯავახაანთ ციხისკენ გაგრძელებას აპირებთ, გაითვალისწინეთ, რომ იქ ბოლო მონაკვეთი გრუნტის
    გზაა და მაღალი კლირენსი გამოგადგებათ.
en:
  name: Kaspi Church of St George
  short: >-
    A working parish church in the centre of Kaspi, one of Georgia's oldest towns and once the seat of
    a 5th-century military governor.
  body: >-
    **Kaspi's St George's is no museum piece but a working parish church on 26 May Street — where one
    of Georgia's oldest towns says its everyday prayers.**


    The town's roots go deep. Archaeologists have traced settlement here to the Bronze Age, and the 11th-century
    chronicler Leonti Mroveli credited its founding to Uplos, son of Mtskhetos — a legend, not a record.
    In the 5th century Kaspi was the seat of a *spasalari*, a military governor, and tradition says the
    young Vakhtang Gorgasali and his sister Mirandukht grew up here. Then, in the 730s, the Arab commander
    Marwan ibn Muhammad — "Murvan the Deaf" to Georgians — laid the town so thoroughly waste that urban
    life ended. A thousand years later the historian Vakhushti Bagrationi summed it up in one line: it
    "was a city until the Deaf One, and is now a large village." Kaspi regained city status only in 1959.


    St George's belongs to the living town, not the ruined one. It is one of three active churches in
    the centre, alongside the cathedral of St Vakhtang Gorgasali and the church of St Theodore Tiron.
    We found no reliable record of when it was built, or by whom, and we will not invent one.


    Come for a candle and a quiet minute, in a town that was a city until the Deaf One and took twelve
    centuries to become one again.
  tip: >-
    Entry is free. Cover shoulders and knees; women will want a headscarf. During a service keep your
    voice low and ask before taking photographs; Sunday-morning liturgy is the busiest time. Street parking
    is easy. Kaspi is a working town, so shops and cafés are in the centre and filling stations on the
    highway — a practical stop before you turn off towards the fortresses. Half an hour is plenty; pair
    it with Javakhaant Castle or Samtavisi Cathedral.
  route: >-
    Head west from Tbilisi on the S1 (E60) highway past Mtskheta. It is paved the whole way: about 64
    km and 55 minutes. Leave the highway at the Kaspi turn-off and follow the signs to the town centre;
    the church stands on 26 May Street, with ordinary street parking nearby. Filling stations are frequent
    along the highway. Any economy car will do — no climbs, no gravel. If you plan to continue to Javakhaant
    Castle, remember that its final stretch is a dirt track where extra ground clearance helps.
ru:
  name: Церковь Святого Георгия в Каспи
  short: >-
    Действующая приходская церковь в центре Каспи — одного из древнейших городов Грузии, в V веке резиденции
    военного наместника.
  body: >-
    **Церковь Святого Георгия в Каспи — не музейный экспонат, а действующий приходской храм на улице 26
    Мая, где один из древнейших городов Грузии молится каждый день.**


    Корни у города глубокие. Археологи прослеживают здесь поселение с бронзового века, а летописец XI
    века Леонти Мровели приписывал его основание Уплосу, сыну Мцхетоса, — это легенда, а не документ.
    В V веке Каспи был резиденцией *спасалара*, военного наместника, и, по преданию, здесь выросли юный
    Вахтанг Горгасали и его сестра Мирандухт. Затем, в 730-х годах, арабский полководец Марван ибн Мухаммад
    — у грузин «Мурван Глухой» — опустошил город так основательно, что городская жизнь здесь прекратилась.
    Тысячу лет спустя историк Вахушти Багратиони подытожил это одной фразой: «был городом до Глухого,
    а ныне — большое село». Статус города Каспи вернул себе лишь в 1959 году.


    Святой Георгий принадлежит живому городу, а не разрушенному. Это одна из трёх действующих церквей
    в центре — наряду с собором Святого Вахтанга Горгасали и церковью Святого Феодора Тирона. Надёжных
    сведений о том, когда и кем она построена, мы не нашли — и выдумывать не станем.


    Приходите ради свечи и минуты тишины — в город, который был городом до Глухого и лишь через двенадцать
    веков снова им стал.
  tip: >-
    Вход свободный. Плечи и колени должны быть закрыты; женщинам пригодится платок. Во время службы говорите
    вполголоса и спрашивайте разрешения, прежде чем фотографировать; больше всего людей на воскресной
    утренней литургии. Припарковаться на улице легко. Каспи — обычный рабочий город: магазины и кафе в
    центре, заправки на трассе, так что это удобная остановка перед тем, как свернуть к крепостям. Получаса
    вполне достаточно; совместите визит с крепостью Джавахаант или собором Самтависи.
  route: >-
    Из Тбилиси на запад по трассе S1 (E60) мимо Мцхеты. Асфальт на всём пути: около 64 км и 55 минут.
    Съезжайте с трассы на повороте на Каспи и следуйте указателям к центру города; церковь стоит на улице
    26 Мая, рядом обычная уличная парковка. Заправки на трассе встречаются часто. Подойдёт любая машина
    эконом-класса — ни подъёмов, ни гравия. Если собираетесь дальше, к крепости Джавахаант, помните: её
    последний отрезок — грунтовка, где пригодится увеличенный клиренс.
fa:
  name: کلیسای گئورگی مقدس کاسپی
  short: کلیسای محله‌ای فعال در مرکز کاسپی، یکی از کهن‌ترین شهرهای گرجستان که در سدهٔ پنجم مقر یک فرماندار
    نظامی بود.
  body: >-
    **کلیسای گئورگی مقدس کاسپی نه اثری موزه‌ای، که کلیسای محله‌ای فعالی در خیابان ۲۶ مه است؛ جایی که یکی
    از کهن‌ترین شهرهای گرجستان هر روز در آن نیایش می‌کند.**


    ریشه‌های شهر عمیق است. باستان‌شناسان سکونت در اینجا را تا عصر مفرغ پی گرفته‌اند، و وقایع‌نگار سدهٔ
    یازدهم، لئونتی مروولی، بنیاد آن را به اوپلوس پسر متسختوس نسبت داده است؛ افسانه‌ای، نه سندی. در سدهٔ
    پنجم کاسپی مقر یک *سپاسالار*، یعنی فرماندار نظامی، بود و روایت است که واختانگ گورگاسالیِ جوان و خواهرش
    میراندوخت در همین‌جا بزرگ شدند. سپس در دههٔ ۷۳۰ میلادی، مروان بن محمد، سردار عرب، که گرجی‌ها «مروانِ
    کر» می‌خوانندش، شهر را چنان ویران کرد که زندگی شهری در آن پایان یافت. هزار سال بعد، تاریخ‌نگار واخوشتی
    باگراتیونی آن را در یک جمله خلاصه کرد: «تا [مروانِ] کر شهر بود و اکنون روستایی بزرگ است». کاسپی تنها
    در ۱۹۵۹ دوباره عنوان شهر گرفت.


    کلیسای گئورگی مقدس از آنِ شهر زنده است، نه شهر ویران. یکی از سه کلیسای فعال مرکز شهر است، در کنار
    کلیسای جامع واختانگ گورگاسالی مقدس و کلیسای تئودور تیرون مقدس. هیچ سند معتبری دربارهٔ زمان ساخت یا
    سازنده‌اش نیافتیم، و چیزی هم از خود نمی‌سازیم.


    برای روشن کردن شمعی و دمی آرامش بیایید؛ به شهری که تا مروانِ کر شهر بود و دوازده قرن طول کشید تا دوباره
    شهر شود.
  tip: >-
    ورود رایگان است. شانه‌ها و زانوها پوشیده باشد؛ بانوان بهتر است روسری داشته باشند. هنگام مراسم آهسته
    سخن بگویید و پیش از عکاسی اجازه بگیرید؛ شلوغ‌ترین زمان، آیین عشای ربانی صبح یکشنبه است. پارک کنار
    خیابان آسان است. کاسپی شهری معمولی و پرکار است: مغازه‌ها و کافه‌ها در مرکزند و پمپ‌بنزین‌ها کنار بزرگراه؛
    توقفی کاربردی پیش از آنکه به سوی قلعه‌ها بپیچید. نیم ساعت کافی است؛ آن را با قلعهٔ جاواخاآنت یا کلیسای
    جامع سامتاویسی همراه کنید.
  route: >-
    از تفلیس در بزرگراه S1 (E60) رو به غرب از کنار متسختا بگذرید. تمام راه آسفالت است: حدود ۶۴ کیلومتر
    و ۵۵ دقیقه. در خروجی کاسپی از بزرگراه خارج شوید و تابلوها را تا مرکز شهر دنبال کنید؛ کلیسا در خیابان
    ۲۶ مه است و پارک معمولی کنار خیابان در نزدیکی‌اش ممکن است. در طول بزرگراه پمپ‌بنزین فراوان است. هر
    خودروی اقتصادی کار را راه می‌اندازد؛ نه سربالایی دارد، نه شن. اگر قصد دارید تا قلعهٔ جاواخاآنت ادامه
    دهید، به یاد داشته باشید که تکهٔ آخرش راهی خاکی است که در آن فاصلهٔ بیشتر خودرو از زمین به کار می‌آید.
he:
  name: כנסיית גאורגיוס הקדוש בקאספי
  short: כנסיית קהילה פעילה במרכז קאספי, מן הערים העתיקות בגאורגיה, שבמאה ה-5 שימשה מושב למושל צבאי.
  body: >-
    **כנסיית גאורגיוס הקדוש בקאספי אינה מוצג מוזיאוני אלא כנסיית קהילה פעילה ברחוב 26 במאי – המקום שבו
    אחת הערים העתיקות בגאורגיה מתפללת מדי יום.**


    שורשי העיר עמוקים. ארכאולוגים איתרו כאן יישוב כבר מתקופת הברונזה, וכותב הכרוניקות בן המאה ה-11 לאונטי
    מרוולי ייחס את ייסודה לאופלוס בן מצחתוס – אגדה, לא תיעוד. במאה ה-5 הייתה קאספי מושבו של *ספאסאלארי*,
    מושל צבאי, ולפי המסורת גדלו כאן וחטנג גורגסלי הצעיר ואחותו מירנדוכת. ואז, בשנות ה-730 לספירה, החריב
    המצביא הערבי מרואן אבן מוחמד – "מורוואן החירש" בפי הגאורגים – את העיר ביסודיות כזאת, שחיי העיר בה
    פסקו. אלף שנה מאוחר יותר סיכם זאת ההיסטוריון וחושטי בגרטיוני במשפט אחד: "הייתה עיר עד בוא החירש, ועתה
    היא כפר גדול". מעמד של עיר חזר לקאספי רק ב-1959.


    כנסיית גאורגיוס הקדוש שייכת לעיר החיה, לא לזו החרבה. זוהי אחת משלוש כנסיות פעילות במרכז, לצד קתדרלת
    וחטנג גורגסלי הקדוש וכנסיית תאודורוס טירון הקדוש. לא מצאנו תיעוד מהימן למועד בנייתה או לזהות בוניה,
    ולא נמציא כזה.


    בואו בשביל נר ורגע של שקט – בעיר שהייתה עיר עד בוא החירש, ונזקקה לשתים-עשרה מאות שנה כדי לשוב ולהיות
    עיר.
  tip: >-
    הכניסה חופשית. יש לכסות כתפיים וברכיים; לנשים כדאי להביא מטפחת ראש. בזמן תפילה דברו בשקט ובקשו רשות
    לפני שמצלמים; הליטורגיה של יום ראשון בבוקר היא השעה העמוסה ביותר. קל למצוא חניה ברחוב. קאספי היא עיר
    רגילה ועובדת: חנויות ובתי קפה יש במרכז, ותחנות דלק על הכביש המהיר – עצירה מעשית לפני שפונים לעבר המבצרים.
    חצי שעה מספיקה בהחלט; שלבו את הביקור עם טירת ג'אוואחאאנט או עם קתדרלת סמתאוויסי.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) על פני מצחתה. הדרך סלולה לכל אורכה: כ-64 ק"מ ו-55 דקות. צאו
    מהכביש המהיר ביציאה לקאספי והמשיכו לפי השלטים למרכז העיר; הכנסייה ניצבת ברחוב 26 במאי, ובקרבתה חניה
    רגילה ברחוב. תחנות דלק מצויות בשפע לאורך הכביש המהיר. כל רכב חסכוני יתאים – אין עליות ואין חצץ. אם
    אתם מתכננים להמשיך לטירת ג'אוואחאאנט, זכרו שהקטע האחרון בדרך אליה הוא דרך עפר, ושם מרווח גחון גבוה
    יותר עוזר.
ar:
  name: كنيسة القديس جاورجيوس في كاسبي
  short: كنيسة رعية عاملة في وسط كاسبي، إحدى أقدم مدن جورجيا، التي كانت في القرن الخامس مقراً لحاكم عسكري.
  body: >-
    **ليست كنيسة القديس جاورجيوس في كاسبي قطعة متحفية، بل كنيسة رعية عاملة في شارع 26 مايو، حيث تصلّي
    كل يوم إحدى أقدم مدن جورجيا.**


    جذور المدينة ضاربة في القدم. فقد تتبّع علماء الآثار الاستيطان هنا حتى العصر البرونزي، ونسب مدوّن الحوليات
    ليونتي مروفيلي، من القرن الحادي عشر، تأسيسها إلى أوبلوس بن متسخيتوس، وهي أسطورة لا وثيقة. وفي القرن
    الخامس كانت كاسبي مقراً لـ*سباسالار*، أي حاكم عسكري، وتقول الرواية إن فاختانغ غورغاسالي في صباه وأخته
    ميراندوخت نشآ هنا. ثم في ثلاثينيات القرن الثامن الميلادي، خرّب القائد العربي مروان بن محمد، «مروان
    الأصم» كما يسميه الجورجيون، المدينة تخريباً شاملاً أنهى الحياة الحضرية فيها. وبعد ألف عام لخّص المؤرخ
    فاخوشتي باغراتيوني ذلك في جملة واحدة: «كانت مدينة حتى [مروان] الأصم، وهي الآن قرية كبيرة». ولم تستعد
    كاسبي صفة المدينة إلا عام 1959.


    تنتمي كنيسة القديس جاورجيوس إلى المدينة الحية لا المدمَّرة. فهي واحدة من ثلاث كنائس عاملة في الوسط،
    إلى جانب كاتدرائية القديس فاختانغ غورغاسالي وكنيسة القديس ثيودوروس التيروني. لم نجد سجلاً موثوقاً
    بتاريخ بنائها أو بانيها، ولن نخترع واحداً.


    تعالوا من أجل شمعة ودقيقة هادئة، في بلدة كانت مدينة حتى الأصم، واحتاجت اثني عشر قرناً لتعود مدينة
    من جديد.
  tip: >-
    الدخول مجاني. غطّوا الأكتاف والركب؛ وستحتاج النساء إلى غطاء للرأس. أثناء الصلاة اخفضوا أصواتكم واستأذنوا
    قبل التصوير؛ وأكثر الأوقات ازدحاماً قداس صباح الأحد. الركن في الشارع سهل. كاسبي مدينة عادية عاملة،
    فالمتاجر والمقاهي في الوسط ومحطات الوقود على الطريق السريع، ما يجعلها محطة عملية قبل الانعطاف نحو
    القلاع. تكفي نصف ساعة؛ واجمعوا الزيارة مع قلعة جافاخاانت أو كاتدرائية سامتافيسي.
  route: >-
    اتجهوا غرباً من تبليسي على الطريق السريع S1 (E60) مروراً بمتسخيتا. الطريق معبّد طوال المسافة: نحو
    64 كم و55 دقيقة. غادروا الطريق السريع عند مخرج كاسبي واتبعوا اللافتات إلى وسط المدينة؛ تقع الكنيسة
    في شارع 26 مايو، وبقربها مواقف عادية على جانب الشارع. محطات الوقود كثيرة على امتداد الطريق السريع.
    أي سيارة اقتصادية تفي بالغرض، فلا منحدرات ولا حصى. وإن كنتم تنوون متابعة الطريق إلى قلعة جافاخاانت،
    فتذكروا أن مقطعها الأخير طريق ترابي يفيد فيه خلوص أرضي أعلى.
