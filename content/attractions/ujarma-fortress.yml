ka:
  name: უჯარმის ციხე
  short: >-
    ციხე-ქალაქი ივრის თავზე, სადაც, მატიანის თქმით, დაჭრილი ვახტანგ გორგასალი აღესრულა — თბილისიდან 45
    კმ, გომბორის გზაზე.
  body: >-
    **სანამ თბილისი საქართველოს დედაქალაქი გახდებოდა, ივრის თავზე, ამ ქედზე, მეფე კარს იმართავდა — და,
    მატიანის თქმით, სასიკვდილოდაც აქ დაბრუნდა.**


    ლეონტი მროველი უჯარმის ციხის პირველ ქვებს მეფე ასფაგურს მიაწერს, III–IV საუკუნეთა მიჯნაზე. V საუკუნეში
    ვახტანგ გორგასალმა და მისმა ძემ, დაჩიმ, აქ მძლავრი კოშკებით, სასახლეებითა და ეკლესიებით გამაგრებული
    ციტადელი ააგეს. „ვახტანგ გორგასლის ცხოვრება“ მოგვითხრობს, როგორ დაჭრა მეფე ირანელ დამპყრობლებთან ბრძოლაში
    მოღალატე მონამ — ისარი აბჯრის ნაპრალში, იღლიაში მოახვედრა, — როგორ მოასვენეს იგი უჯარმის ციხეში და
    როგორ აღესრულა აქ; დაკრძალეს მცხეთაში.


    914 წელს უჯარმა არაბებმა აიღეს და დაარბიეს, X საუკუნეში კი აბულ-კასიმმა ზედა ციხე დაანგრია. გიორგი
    III-მ (1156–1184) ციხე აღადგინა და საგანძურად აქცია. მერე მონღოლები მოვიდნენ, XV საუკუნის მიწურულს
    ერთიანი სამეფო დაიშალა, და ოდესღაც აყვავებული ქალაქი ნელ-ნელა დაბად იქცა.


    ციტადელზე ადით. მის აღმოსავლეთ კუთხეში ოდესღაც ორსართულიანი სასახლე იდგა, მთავარი კარი კი დასავლეთით
    იყო. გალავანი ჩრდილოეთიდან, კლდოვან ფერდობზე, მდინარემდე ეშვებოდა და თანაბარ მანძილზე ცხრა კოშკი ჰქონდა
    ჩაშენებული — მათ ზედა სართულებზე მეციხოვნეები ცხოვრობდნენ. შიგნით ჯვარპატიოსნის ორსართულიანი ეკლესია
    დგას: ქვედა სართული უფრო ძველია, მაღალი ცალნავიანი ეკლესია კი ზემოთ X–XI საუკუნეებში დააშენეს, სარკმლებით
    აღმოსავლეთითა და დასავლეთით. ივრის პირას კვირაცხოვლის ეკლესიაა — ქვიშაქვითა და აგურით ნაგები, რომბული
    წყობის ლავგარდნით.


    არქეოლოგებმა აქ მინისა და ბრინჯაოს სამაჯურები, ბეჭდები და ღილები, საზედაშე ქვევრები და თონე იპოვეს
    — სამეფო კარი იყო, მაგრამ პურიც აქვე ცხვებოდა.


    ქვემოთ გამავალ გზას დღესაც სხვა გამოსავალი არ აქვს — კედლების ძირში უნდა გაიაროს.
  tip: >-
    ერთი საათი საკმარისია. ციტადელამდე ბილიკი ფხვიერი ხრეშითაა მოფენილი და ადგილ-ადგილ ციცაბოა — დაახლოებით
    ათი წუთის აღმართი, ოღონდ კარგი ფეხსაცმლით და არა სანდლებით. კედლებზე მოაჯირი დაბალია ან საერთოდ არ
    არის, ამიტომ ბავშვებს თვალი არ მოაშოროთ. ჩრდილი თითქმის არ არის, წყალიც არა — თან იქონიეთ, ივლისსა
    და აგვისტოში კი დილით ადრე ან საღამოს მოდით, როცა ქვა გაგრილდება. შესვლა უფასოა, სალარო არ არსებობს.
    ყველაზე ლამაზი გაზაფხულია, როცა ქვებს შორის ბალახი მწვანდება და ყაყაჩო ყვავის; წვიმისა და თოვლის შემდეგ
    ბილიკი სრიალა ხდება.
  route: >-
    თბილისიდან გადით კახეთის გზატკეცილზე (ს5) და დაახლოებით 20 კილომეტრში, ვაზიანთან, გადაუხვიეთ შ38-ზე
    გომბორისა და თელავის მიმართულებით. სოფელ უჯარმიდან დაახლოებით 4 კილომეტრში, ჩრდილოეთით, გზის პირას,
    ქედზე ციხის კედლები გამოჩნდება. ქალაქის ცენტრიდან დაახლოებით 45 კმ და 55 წუთია, გზა ბოლომდე ასფალტიანია
    და ეკონომ-კლასის მანქანა ნებისმიერ სეზონზე საკმარისია. საწვავი თბილისშივე ჩაასხით — გომბორის გზა მიყრუებულია.
    უჯარმა ბუნებრივად უკავშირდება გომბორის უღელტეხილს: ორივე შუამთა დაახლოებით 45 კილომეტრით შორსაა, თელავი
    კი — მათ იქით, ცოტა მოშორებით.
en:
  name: Ujarma Fortress
  short: >-
    The ridge-top fortress-town above the Iori where, the chronicle says, Vakhtang Gorgasali died of his
    wounds — 45 km from Tbilisi on the Gombori road.
  body: >-
    **Before Tbilisi became Georgia's capital, a king held court on this ridge above the Iori — and, the
    chronicle says, came back here to die.**


    The chronicler Leonti Mroveli credits King Aspagur (Aspacures I) with laying Ujarma's first stones
    at the turn of the 3rd and 4th centuries. In the 5th century Vakhtang Gorgasali and his son Dachi
    gave it a citadel with strong towers, palaces and churches. The Life of Vakhtang tells how the king,
    fighting an invading Persian army, was shot through a gap in his armour by a renegade slave, carried
    to his castle at Ujarma, and died here; he was buried at Mtskheta.


    Arabs took the town in 914, and in the 10th century Abul-Kasim wrecked the upper fortress. George
    III (1156–1184) rebuilt it and kept his treasury here. Then came the Mongols, the break-up of the
    kingdom at the end of the 15th century, and the slow shrinking of a city into a village.


    Climb to the citadel. A two-storey palace once filled its eastern corner, and the main gate faced
    west. The curtain wall ran from the north down the rocky slope to the river, with nine towers at even
    intervals whose upper floors housed the garrison. Inside stands the two-storey Jvarpatiosani church:
    the lower level older, the tall single-nave church above added in the 10th–11th centuries, lit from
    east and west. Down by the Iori, the church of Kviratskhoveli is built of sandstone and brick under
    a diamond-patterned cornice.


    Excavators have found glass and bronze bracelets, rings and buttons, wine qvevri and a bread oven
    — a royal court, but also a kitchen.


    The road below still has no choice but to pass beneath the walls.
  tip: >-
    An hour is enough. The path up to the citadel is loose gravel and steep in places — about ten minutes
    in proper shoes, not sandals. Parapets along the walls are low or missing, so keep children close.
    There is almost no shade and no water on site: carry your own, and in July and August come early or
    late in the day, when the stone has cooled. Entry is free and there is no ticket office. Spring is
    the kindest season, with green grass and poppies between the stones; after rain or snow the path turns
    slippery.
  route: >-
    Leave Tbilisi on the S5 Kakheti highway and, about 20 km out near Vaziani, branch onto the Sh38 towards
    Gombori and Telavi. About 4 km north of Ujarma village the walls appear on the ridge beside the road.
    It is roughly 45 km and 55 minutes from the city centre, asphalt all the way, and an economy car is
    fine in any season. Fill up before you leave Tbilisi, as the Gombori road is a quiet one. Ujarma pairs
    naturally with the Gombori pass beyond it: the two Shuamta monasteries lie about 45 km further on,
    and Telavi a little beyond them.
ru:
  name: Крепость Уджарма
  short: >-
    Крепость-город на гребне над Иори, где, по летописи, скончался от ран Вахтанг Горгасали — 45 км от
    Тбилиси по гомборской дороге.
  body: >-
    **Ещё до того как Тбилиси стал столицей Грузии, на этом гребне над Иори царь держал двор — и, по летописи,
    вернулся сюда, чтобы умереть.**


    Летописец Леонти Мровели приписывает царю Аспагуру I закладку первых камней Уджармы на рубеже III
    и IV веков. В V веке Вахтанг Горгасали и его сын Дачи возвели здесь цитадель с мощными башнями, дворцами
    и церквями. «Житие Вахтанга» рассказывает, как царь, сражаясь с вторгшимся персидским войском, был
    ранен стрелой, которую пустил ему сквозь щель в доспехах раб-перебежчик; царя доставили в его замок
    в Уджарме, где он и умер; похоронен он в Мцхете.


    В 914 году город взяли арабы, а в X веке Абул-Касим разрушил верхнюю крепость. Георгий III (1156–1184)
    отстроил её и держал здесь свою казну. Затем пришли монголы, царство распалось к концу XV века, и
    город медленно съёжился до деревни.


    Поднимитесь к цитадели. Некогда её восточный угол занимал двухэтажный дворец, а главные ворота смотрели
    на запад. Крепостная стена шла с севера вниз по скалистому склону к реке, с девятью башнями на равном
    расстоянии друг от друга, чьи верхние этажи вмещали гарнизон. Внутри стоит двухэтажная церковь Джварпатиосани:
    нижний ярус древнее, высокий однонефный храм над ним пристроен в X–XI веках и освещён с востока и
    запада. У самой Иори стоит церковь Квирацховели, сложенная из песчаника и кирпича под карнизом с ромбическим
    узором.


    Археологи нашли здесь стеклянные и бронзовые браслеты, кольца и пуговицы, винные квеври и хлебную
    печь — царский двор, но и кухню тоже.


    У дороги внизу до сих пор нет выбора, кроме как пройти под этими стенами.
  tip: >-
    Часа достаточно. Тропа к цитадели — рассыпчатый гравий, местами крутая: около десяти минут в подходящей
    обуви, не в сандалиях. Парапеты на стенах низкие или вовсе отсутствуют, так что держите детей рядом.
    Тени почти нет, воды на месте тоже нет: берите свою, а в июле и августе приезжайте рано утром или
    под вечер, когда камень остыл. Вход свободный, билетной кассы нет. Лучшее время — весна, когда между
    камнями зелёная трава и маки; после дождя или снега тропа становится скользкой.
  route: >-
    Выезжайте из Тбилиси по Кахетинскому шоссе S5 и примерно через 20 км, у Вазиани, сверните на Ш38 в
    сторону Гомбори и Телави. Примерно в 4 км севернее села Уджарма на гребне у дороги появляются стены.
    Это около 45 км и 55 минут от центра города, дорога асфальтирована целиком, и машина эконом-класса
    подойдёт в любое время года. Заправьтесь перед выездом из Тбилиси — гомборская дорога малолюдна. Уджарму
    естественно совместить с Гомборским перевалом: два монастыря Шуамта лежат примерно 45 км дальше, а
    Телави — немного за ними.
fa:
  name: دژ اوجارما
  short: >-
    شهر-دژی بر تیغه‌ی بالای ایوری که، به‌گفته‌ی وقایع‌نگار، واختانگ گورگاسالی از زخم‌هایش در آن درگذشت
    — ۴۵ کیلومتری تفلیس بر راه گومبوری.
  body: >-
    **پیش از آن‌که تفلیس پایتخت گرجستان شود، پادشاهی بر این تیغه‌ی بالای ایوری دربار داشت — و به‌گفته‌ی
    وقایع‌نگار، برای مردن به همین‌جا بازگشت.**


    وقایع‌نگار لئونتی مروِلی نخستین سنگ‌های اوجارما را به پادشاه آسپاگور یکم، در گذار از سده‌ی سوم به
    چهارم، نسبت می‌دهد. در سده‌ی پنجم، واختانگ گورگاسالی و پسرش داچی ارگی با برج‌های نیرومند، کاخ‌ها و
    کلیساها در آن ساختند. «زندگی‌نامه‌ی واختانگ» می‌گوید که پادشاه، در نبرد با سپاه ایرانی مهاجم، از رخنه‌ی
    زرهش با تیرِ برده‌ای که به دشمن پیوسته بود، هدف قرار گرفت، به قلعه‌اش در اوجارما برده شد و همان‌جا
    درگذشت؛ او را در متسختا به خاک سپردند.


    عرب‌ها شهر را در سال ۹۱۴ گرفتند، و در سده‌ی دهم ابوالقاسم دژ بالایی را ویران کرد. گئورگی سوم (۱۱۵۶–۱۱۸۴)
    آن را بازساخت و خزانه‌اش را در آن‌جا نگه داشت. سپس مغولان آمدند، پادشاهی در پایان سده‌ی پانزدهم فروپاشید،
    و شهر به‌تدریج به روستایی فروکاست.


    به دژ بالا بروید. کاخی دوطبقه زمانی گوشه‌ی خاوری آن را پر می‌کرد، و دروازه‌ی اصلی رو به باختر داشت.
    باروی دژ از شمال، پایین شیب سنگی، تا رودخانه می‌رفت، با نه برج در فاصله‌های برابر که طبقه‌های بالایی‌شان
    پادگان را در خود جای می‌داد. درون آن، کلیسای دوطبقه‌ی جوارپاتیوسانی برپاست: طبقه‌ی پایینی کهن‌تر،
    و کلیسای بلندِ تک‌ناوِ بالایی در سده‌های دهم و یازدهم افزوده شده و از خاور و باختر روشن می‌شود. کنارِ
    ایوری، کلیسای کویراتسخووِلی از ماسه‌سنگ و آجر زیر قرنیزی با نقش لوزی برپاست.


    باستان‌شناسان دستبندهای شیشه‌ای و برنزی، حلقه‌ها و دکمه‌ها، خمره‌های شراب و تنوری برای نان یافته‌اند
    — دربار شاهانه‌ای، اما آشپزخانه‌ای هم.


    راهِ پایین‌دست هنوز چاره‌ای ندارد جز گذر از زیرِ همان دیوارها.
  tip: >-
    یک ساعت کافی است. مسیر بالا به دژ پوشیده از سنگریزه‌های لق است و جایی‌جایی تند است: با کفشی مناسب،
    نه صندل، حدود ده دقیقه راه دارد. نرده‌های دیوارها کوتاه‌اند یا وجود ندارند، پس کودکان را نزدیک خود
    نگه دارید. تقریباً هیچ سایه یا آبی در محل نیست: آب خودتان را بیاورید، و در ژوئیه و اوت صبح زود یا
    اواخر روز بیایید، وقتی سنگ خنک شده. ورود رایگان است و باجه‌ی بلیت وجود ندارد. بهار مهربان‌ترین فصل
    است، با علف سبز و شقایق میان سنگ‌ها؛ پس از باران یا برف مسیر لیز می‌شود.
  route: >-
    از تفلیس در بزرگراه کاختی S5 حرکت کنید و پس از حدود ۲۰ کیلومتر، نزدیک وازیانی، به Sh38 به‌سوی گومبوری
    و تلاوی بپیچید. حدود ۴ کیلومتر شمال روستای اوجارما، دیوارها بر تیغه کنار راه پدیدار می‌شوند. این حدود
    ۴۵ کیلومتر و ۵۵ دقیقه از مرکز شهر است، تمام مسیر آسفالته، و خودرویی معمولی در هر فصلی کارساز است.
    پیش از خروج از تفلیس باک را پر کنید، چون راه گومبوری کم‌رفت‌وآمد است. اوجارما به‌طور طبیعی با گذرگاه
    گومبوری همراه می‌شود: دو صومعه‌ی شوآمتا حدود ۴۵ کیلومتر آن‌سوتر قرار دارند، و تلاوی اندکی پس از آن‌ها.
he:
  name: מצודת אוג'רמה
  short: >-
    עיר-מצודה על רכס מעל האיורי, שבה, כפי שמספרת הכרוניקה, מת ווחטנג גורגסאלי מפצעיו — 45 ק"מ מטביליסי
    בדרך גומבורי.
  body: >-
    **לפני שטביליסי הפכה לבירת גאורגיה, מלך ניהל את חצרו על רכס זה מעל האיורי — ולפי הכרוניקה, חזר לכאן
    כדי למות.**


    הכרוניקן לאונטי מרוולי מייחס למלך אספגור הראשון את הנחת אבניה הראשונות של אוג'רמה בתפר שבין המאה השלישית
    לרביעית. במאה החמישית ווחטנג גורגסאלי ובנו דאצ'י הקנו לה מצודה עם מגדלים חזקים, ארמונות וכנסיות. 'חיי
    ווחטנג' מספר כיצד המלך, בקרב עם צבא פרסי פולש, נורה מבעד לפרצה בשריונו בידי עבד שערק, הובא למבצרו
    באוג'רמה, ומת בה; הוא נקבר במצחתה.


    הערבים כבשו את העיר ב-914, ובמאה העשירית החריב אבו אל-קאסים את המצודה העילית. גיאורגי השלישי (1156–1184)
    שיקם אותה ושמר בה את אוצרו. אחר כך הגיעו המונגולים, הממלכה התפרקה בסוף המאה החמש-עשרה, והעיר התכווצה
    בהדרגה לכפר.


    עלו למצודה. פעם מילא ארמון בן שתי קומות את פינתה המזרחית, והשער הראשי פנה מערבה. חומת המגן ירדה מצפון
    במדרון הסלעי עד לנהר, ובה תשעה מגדלים במרווחים שווים, שקומותיהם העליונות שיכנו את החיל. בפנים עומדת
    כנסיית ג'ווארפטיוסאני בעלת שתי הקומות: הקומה התחתונה עתיקה יותר, והכנסייה החד-ספינתית הגבוהה מעליה
    נוספה במאות העשירית-אחת-עשרה, ומוארת ממזרח וממערב. לצד האיורי עומדת כנסיית קווירצחוולי, בנויה מאבן
    חול ולבנים תחת כרכוב מעוטר בדוגמת מעוינים.


    ארכאולוגים מצאו כאן צמידי זכוכית וברונזה, טבעות וכפתורים, קנקני יין (קְוֶוְרי) וטבון לחם — חצר מלכות,
    אך גם מטבח.


    לדרך שלמטה אין עדיין ברירה אלא לעבור מתחת לחומות אלה.
  tip: >-
    שעה אחת מספיקה. השביל למצודה מכוסה חצץ רופף ותלול במקומות מסוימים: כעשר דקות בנעליים מתאימות, לא בסנדלים.
    המעקות על החומות נמוכים או חסרים, כך שהשגיחו על הילדים מקרוב. אין כמעט צל ואין מים באתר: הביאו מים
    משלכם, וביולי ובאוגוסט הגיעו מוקדם בבוקר או בשעות הערב, כשהאבן התקררה. הכניסה חופשית ואין קופת כרטיסים.
    האביב הוא העונה הנעימה ביותר, עם דשא ירוק ופרגים בין האבנים; אחרי גשם או שלג השביל הופך לחלקלק.
  route: >-
    צאו מטביליסי בכביש קאחתי S5, ואחרי כ-20 ק"מ, סמוך לוואזיאני, פנו לכביש Sh38 לכיוון גומבורי וטלאווי.
    כ-4 ק"מ מצפון לכפר אוג'רמה, החומות מופיעות על הרכס לצד הדרך. זה כ-45 ק"מ ו-55 דקות ממרכז העיר, סלול
    לכל אורכו, ורכב רגיל מתאים בכל עונה. תדלקו לפני שתעזבו את טביליסי, שכן דרך גומבורי שקטה. אוג'רמה משתלבת
    באופן טבעי עם מעבר גומבורי: שני מנזרי שואמטה נמצאים כ-45 ק"מ נוספים, וטלאווי מעט מעבר להם.
ar:
  name: قلعة أوجارما
  short: >-
    مدينة-حصن على تلة فوق نهر إيوري، مات فيها، بحسب المؤرخ، واختانغ غورغاسالي متأثرًا بجراحه — على 45
    كم من تبليسي على طريق غومبوري.
  body: >-
    **قبل أن تصبح تبليسي عاصمة جورجيا، عقد ملك بلاطه على هذا التل المرتفع فوق إيوري — وبحسب المؤرخ، عاد
    إليه ليموت.**


    يعزو المؤرخ ليونتي مروِلي إلى الملك أسباغور الأول وضع أولى حجارة أوجارما عند الانتقال من القرن الثالث
    إلى الرابع. وفي القرن الخامس أعطاها واختانغ غورغاسالي وابنه داتشي قلعةً بأبراج قوية وقصور وكنائس.
    وتروي «سيرة واختانغ» كيف أن الملك، في قتاله جيشًا فارسيًا غازيًا، أُصيب بسهم عبر ثغرة في درعه أطلقه
    عبد منشقّ، فحُمل إلى قلعته في أوجارما ومات فيها؛ ودُفن في متسخيتا.


    استولى العرب على المدينة عام 914، وفي القرن العاشر خرّب أبو القاسم القلعة العليا. أعاد جيورجي الثالث
    (1156–1184) بناءها وأبقى فيها خزانته. ثم جاء المغول، وتفككت المملكة في أواخر القرن الخامس عشر، وتقلّصت
    المدينة تدريجيًا إلى قرية.


    اصعد إلى القلعة. كان قصر من طبقتين يشغل زاويتها الشرقية، وكانت البوابة الرئيسية تواجه الغرب. امتد
    سور الدفاع من الشمال نازلًا على السفح الصخري حتى النهر، بتسعة أبراج على مسافات متساوية كانت طبقاتها
    العليا تأوي الحرس. في الداخل تقوم كنيسة جفارباتيوساني ذات الطبقتين: الطبقة السفلى أقدم، والكنيسة العليا
    المرتفعة ذات الصحن الواحد أُضيفت في القرنين العاشر والحادي عشر، وتُضاء من الشرق والغرب. وعلى ضفة إيوري،
    تقوم كنيسة كفيراتسخوفيلي المبنية من الحجر الرملي والآجر تحت إفريز بنمط معيّني.


    عثر المنقّبون هنا على أساور زجاجية وبرونزية وخواتم وأزرار، وجرار خمر (كفيفري) وفرن خبز — بلاط ملكي،
    ولكن مطبخًا أيضًا.


    وما زال الطريق أسفلها لا يملك خيارًا سوى المرور تحت هذه الأسوار.
  tip: >-
    تكفي ساعة واحدة. الممر الصاعد إلى القلعة مغطى بحصى رخو وشديد الانحدار في بعض الأماكن: نحو عشر دقائق
    بحذاء مناسب، لا بالصنادل. حواجز الأسوار منخفضة أو غائبة، فاحرص على إبقاء الأطفال قريبين منك. لا يوجد
    ظل يُذكر ولا ماء في الموقع: احمل ماءك الخاص، وفي يوليو وأغسطس تعال باكرًا أو في وقت متأخر من اليوم،
    حين يكون الحجر قد برد. الدخول مجاني ولا يوجد شباك تذاكر. الربيع ألطف الفصول، بعشب أخضر وخشخاش بين
    الحجارة؛ وبعد المطر أو الثلج يصبح الممر زلقًا.
  route: >-
    اخرج من تبليسي على طريق كاختي السريع S5، وبعد نحو 20 كم قرب فازياني، انحرف إلى Sh38 نحو غومبوري وتيلافي.
    على مسافة نحو 4 كم شمال قرية أوجارما، تظهر الأسوار على التلة قرب الطريق. تلك مسافة نحو 45 كم وحوالي
    55 دقيقة من وسط المدينة، معبّدة بالكامل، وتصلح لها سيارة اقتصادية في أي فصل. عبّئ الوقود قبل مغادرة
    تبليسي، فطريق غومبوري قليل الحركة. وتقترن زيارة أوجارما طبيعيًا بعبور ممر غومبوري: يقع ديرا شوامتا
    على نحو 45 كم أخرى، وتيلافي بعدهما بقليل.
