ka:
  name: უჯარმის ციხე
  short: ივრის ხეობის თავზე მდგარი სამეფო ციხე, სადაც ვახტანგ გორგასალი გარდაიცვალა — თბილისიდან მხოლოდ
    45 კმ.
  body: >-
    **უჯარმა კახეთის პირველი სერიოზული გაჩერებაა, თბილისიდან ერთი საათის ნაკლებ მანძილზე.** ციხე გრძელ
    კლდოვან ქედზეა, პირდაპირ მდინარე ივრის ზემოთ, და გზიდან ისე ჩანს, თითქოს ბორცვს კედლების გვირგვინი
    ეხურა.


    ადგილი ძველია. ქართული მატიანეები უჯარმას III საუკუნიდან იხსენიებენ, ხოლო V საუკუნეში ვახტანგ გორგასალმა
    ის სამეფო რეზიდენციად აქცია — თბილისის დაარსებამდე აქ იყო ერთ-ერთი მთავარი კარი. სწორედ უჯარმაში,
    გადმოცემით, გარდაიცვალა მეფე ბრძოლაში მიღებული ჭრილობისგან. მოგვიანებით ციხემ კახეთის სამეფოს აღმოსავლეთი
    საზღვარი დაიცვა და არაერთხელ დაინგრა.


    დღეს ნანახია:


    - **გრძელი გალავანი** კოშკებით, რომელიც ქედს ორივე მხრიდან უვლის


    - **ციტადელი** ყველაზე მაღალ წერტილში, საიდანაც ხეობა ორივე მიმართულებით იკვეთება


    - **ჯვარპატიოსნის ეკლესია** — მცირე გუმბათოვანი ტაძარი, X საუკუნის, ნაწილობრივ აღდგენილი


    აღდგენა ბოლო ათწლეულებში ჩატარდა და ზოგან ძალიან შესამჩნევია: ახალი ქვის რიგები ძველისგან ფერით გამოირჩევა.
    ეს ცოტას აღიზიანებს, მაგრამ სამაგიეროდ კედლებზე უსაფრთხოდ ასვლა შეიძლება.


    ხედი ქვევით მშრალი და ღია ლანდშაფტია — ივრის ხეობის ნაცრისფერი ფერდობები, იშვიათი ხეები, შორს ცივ-გომბორის
    ქედი. გაზაფხულზე ბალახი მოკლედ მწვანდება და მაკი ყვავის; ზაფხულში ყველაფერი გაცვეთილ-ყვითელია და შუადღისას
    ცხელა.
  tip: >-
    ერთი საათი საკმარისია. აღმართი პარკინგიდან ციტადელამდე ხრეშიანი ბილიკია, დაახლოებით ათი წუთი, ადგილ-ადგილ
    ციცაბო — ნორმალური ფეხსაცმელი გჭირდება, ჩუსტი არა. მოაჯირები ყველგან არ არის, ბავშვს კედლის კიდესთან
    თვალი ადევნე. ჩრდილი მინიმალურია, წყალი თან იქონიე. შესვლა უფასოა და კარიბჭე ღიაა; ბილეთის ჯიხური
    არ არსებობს. ტუალეტი და კაფე გზის პირას, სოფელშია.
  route: >-
    თბილისიდან გამოდი აღმოსავლეთით ვაზიანისა და სართიჭალის გავლით და გაუყევი კახეთის ძველ გზას გომბორის
    მიმართულებით. 45 კმ, დაახლოებით 55 წუთი. გზა მთლიანად ასფალტია და კარგ მდგომარეობაშია. ციხე მარცხნივ,
    გზის თავზე ჩანს, შესახვევი მკაფიოდაა მონიშნული და ბოლოს პატარა უფასო პარკინგია. საწვავი სართიჭალაში
    აიღე. ეკონომ-კლასის მანქანა სავსებით საკმარისია მთელი წლის განმავლობაში.
en:
  name: Ujarma Fortress
  short: A royal fortress on a ridge above the Iori river where King Vakhtang Gorgasali died — only 45
    km from Tbilisi.
  body: >-
    **Ujarma is the first serious stop in Kakheti, less than an hour from Tbilisi.** The fortress runs
    along a rocky ridge directly above the Iori, and from the road below it looks as though the hill has
    been given a crown of walls.


    The site is old. Georgian chronicles mention Ujarma from the 3rd century, and in the 5th King Vakhtang
    Gorgasali turned it into a royal residence — one of the principal courts of the kingdom before Tbilisi
    was founded. Tradition holds that Vakhtang died here of a wound taken in battle. Later the fortress
    guarded the eastern approaches of the Kakhetian kingdom and was destroyed and rebuilt more than once.


    What survives is easy to walk:


    - The **long curtain wall** with towers, following the ridge on both flanks


    - The **citadel** at the highest point, from which the valley reads clearly in both directions


    - The **Jvarpatiosani church**, a small domed building of the 10th century, partly reconstructed


    Restoration in recent decades is very visible in places: new courses of stone sit against old ones
    in a different colour, and purists find it heavy-handed. The practical result is that you can walk
    the walls without risk, which is rarely true of Georgian fortresses this size.


    The landscape below is dry and open — grey slopes above the Iori, scattered trees, and the Tsiv-Gombori
    range in the distance. Spring brings a short flush of green and poppies among the stones; by July
    everything is bleached and the middle of the day is genuinely hot. Late afternoon light on the east-facing
    walls is the best of the day.


    Ujarma is also a good first lesson in how Georgian fortresses were sited. Not on a summit, where water
    is impossible and supply worse, but on a spur with a river below and a road that has no choice but
    to pass underneath it.
  tip: >-
    An hour is enough. The path from the car park up to the citadel is gravel, about ten minutes, and
    steep in places — proper shoes rather than sandals. There are no railings along the wall tops, so
    keep children well back from the edges. Shade is minimal and there is no water on site, so carry your
    own. Entry is free and the gate stands open; there is no ticket office and no guide. Toilets and a
    cafe are down at the roadside in the village below.
  route: >-
    Leave Tbilisi eastwards past Vaziani and Sartichala and follow the old Kakheti road towards Gombori.
    It is 45 km and about 55 minutes. The road is asphalt throughout and in good condition. The fortress
    appears on the left, standing above the road, and the turning is clearly marked with a small free
    car park at the end of it. Fuel is available in Sartichala. An economy car is entirely sufficient
    all year round, and the site can be combined with the Gombori Pass on the way to Telavi.
ru:
  name: Крепость Уджарма
  short: Царская крепость на гребне над рекой Иори, где умер Вахтанг Горгасали, — всего в 45 км от Тбилиси.
  body: >-
    **Уджарма — первая по-настоящему интересная остановка в Кахетии, меньше часа от Тбилиси.** Крепость
    тянется по скалистому гребню прямо над Иори, и снизу кажется, что холму надели корону из стен.


    Место древнее. Грузинские хроники упоминают Уджарму с III века, а в V столетии Вахтанг Горгасали превратил
    её в царскую резиденцию — один из главных дворов государства ещё до основания Тбилиси. Предание относит
    сюда и смерть Вахтанга от раны, полученной в бою. Позже крепость прикрывала восточные подступы Кахетинского
    царства и не раз разрушалась и отстраивалась.


    Сохранившееся легко обойти пешком:


    - **Длинная стена** с башнями, идущая по гребню в обе стороны


    - **Цитадель** на высшей точке, откуда долина читается в обоих направлениях


    - **Церковь Джварпатиосани** — небольшой купольный храм X века, частично восстановленный


    Реставрация последних десятилетий местами очень заметна: новые ряды камня отличаются от старых по
    цвету, и знатоки считают вмешательство грубоватым. Практический итог — по стенам можно ходить без
    опаски, что для грузинской крепости такого размера редкость.


    Пейзаж внизу сухой и открытый: серые склоны над Иори, редкие деревья, вдали хребет Цив-Гомбори. Весной
    ненадолго пробивается зелень и среди камней цветут маки; к июлю всё выгорает, а в середине дня по-настоящему
    жарко. Лучший свет — во второй половине дня, на обращённых к востоку стенах.
  tip: >-
    Часа достаточно. Тропа от парковки к цитадели гравийная, минут десять, местами крутая — нужна нормальная
    обувь, не сандалии. Перил по верху стен нет, детей держите подальше от краёв. Тени почти нет, воды
    на месте не купить — берите с собой. Вход свободный, ворота открыты, кассы и гида нет. Туалет и кафе
    — внизу у дороги, в селе.
  route: >-
    Из Тбилиси на восток мимо Вазиани и Сартичалы, дальше по старой кахетинской дороге в сторону Гомбори.
    45 км, около 55 минут. Асфальт на всём протяжении, состояние хорошее. Крепость видна слева, над дорогой;
    поворот обозначен, в конце небольшая бесплатная парковка. Заправиться можно в Сартичале. Машины эконом-класса
    достаточно круглый год, а саму крепость удобно совмещать с Гомборским перевалом по пути в Телави.
fa:
  name: قلعهٔ اوجارما
  short: قلعه‌ای شاهی بر یال سنگی بالای رود ایوری، جایی که واختانگ گورگاسالی درگذشت — تنها 45 کیلومتر
    از تفلیس.
  body: >-
    **اوجارما نخستین توقف جدی کاختی است، کمتر از یک ساعت از تفلیس.** قلعه بر یالی سنگی درست بالای رود
    ایوری کشیده شده و از جاده چنان می‌نماید که بر سر تپه تاجی از دیوار گذاشته‌اند.


    محوطه کهن است. تواریخ گرجی از سدهٔ سوم اوجارما را نام برده‌اند و در سدهٔ پنجم واختانگ گورگاسالی آن
    را به اقامتگاه شاهی بدل کرد؛ یکی از دربارهای اصلی پادشاهی پیش از بنیاد تفلیس. روایت می‌گوید واختانگ
    همین‌جا از زخمی که در نبرد برداشته بود درگذشت. بعدها این قلعه راه‌های شرقی پادشاهی کاختی را پاسداری
    کرد و بارها ویران و بازسازی شد.


    آنچه برجاست به‌آسانی قابل پیمودن است:


    - **دیوار بلند حصار** با برج‌ها که یال را از دو سو دنبال می‌کند


    - **ارگ** بر بلندترین نقطه، که از آن درّه در هر دو جهت خوانده می‌شود


    - **کلیسای جوارپاتیوسانی**، بنایی کوچک و گنبددار از سدهٔ دهم که بخشی از آن بازسازی شده است


    مرمت دهه‌های اخیر جاهایی بسیار پیداست: رج‌های تازهٔ سنگ در کنار سنگ کهنه رنگ دیگری دارند و سخت‌گیران
    آن را دست‌درازی می‌دانند. نتیجهٔ عملی‌اش این است که می‌توان بی‌خطر روی دیوارها راه رفت، و این در قلعه‌ای
    گرجی به این اندازه کم پیش می‌آید.


    چشم‌انداز پایین خشک و باز است: دامنه‌های خاکستری بالای ایوری، درختان پراکنده و رشتهٔ تسیو-گومبوری
    در دوردست. بهار سبزی کوتاهی می‌آورد و شقایق میان سنگ‌ها می‌روید؛ تا تیرماه همه‌چیز رنگ باخته و میانهٔ
    روز واقعاً گرم است. بهترین نور بعدازظهر روی دیوارهای رو به شرق است.
  tip: >-
    یک ساعت کافی است. مسیر از پارکینگ تا ارگ شنی است و حدود ده دقیقه، جاهایی تند؛ کفش مناسب لازم است نه
    صندل. بالای دیوارها نرده ندارد، پس کودکان را از لبه‌ها دور نگه دارید. سایه ناچیز است و آبی برای خرید
    نیست، پس همراه ببرید. ورود رایگان است و دروازه باز؛ نه گیشه‌ای هست نه راهنمایی. سرویس بهداشتی و کافه
    پایین کنار جاده در روستاست.
  route: >-
    از تفلیس به شرق از وازیانی و سارتیچالا بگذرید و جادهٔ قدیم کاختی را به سوی گومبوری دنبال کنید. 45
    کیلومتر و حدود 55 دقیقه. جاده تا انتها آسفالت و در وضعیت خوبی است. قلعه سمت چپ و بالای جاده دیده می‌شود،
    انحراف تابلو دارد و در انتهایش پارکینگ کوچک رایگان است. سوخت در سارتیچالا موجود است. خودروی اقتصادی
    در تمام سال کافی است و می‌توان این توقف را با گردنهٔ گومبوری در راه تلاوی ترکیب کرد.
he:
  name: מבצר אוג'רמה
  short: מבצר מלכותי על רכס מעל נהר היורי, שם מת המלך וכטנג גורגסלי — 45 ק״מ בלבד מטביליסי.
  body: >-
    **אוג'רמה היא העצירה הרצינית הראשונה בקחתי, פחות משעה מטביליסי.** המבצר משתרע לאורך רכס סלעי ממש מעל
    היורי, ומן הכביש למטה נדמה שההר קיבל כתר של חומות.


    האתר עתיק. הכרוניקות הגאורגיות מזכירות את אוג'רמה מן המאה השלישית, ובמאה החמישית הפך אותה המלך וכטנג
    גורגסלי למשכן מלכותי, אחד מחצרות הממלכה המרכזיות עוד לפני שנוסדה טביליסי. המסורת גורסת שוכטנג מת כאן
    מפצע שנפצע בקרב. מאוחר יותר שמר המבצר על גישות המזרח של ממלכת קחתי, ונהרס ונבנה מחדש לא פעם.


    את מה ששרד קל להקיף ברגל:


    - **חומת ההיקף הארוכה** ובה מגדלים, העוקבת אחר הרכס לשני עבריו


    - **המצודה** בנקודה הגבוהה ביותר, שממנה נקרא העמק לשני הכיוונים


    - **כנסיית ג'ווארפטיוסני**, מבנה מקומר קטן מן המאה העשירית, ששוחזר בחלקו


    השחזור של העשורים האחרונים בולט מאוד במקומות מסוימים: נדבכי אבן חדשים יושבים מול ישנים בגוון אחר,
    ומקפידים רואים בכך יד כבדה. התוצאה המעשית היא שאפשר לצעוד על החומות בלי סיכון, וזה נדיר במבצר גאורגי
    בסדר גודל כזה.


    הנוף למטה יבש ופתוח: מדרונות אפורים מעל היורי, עצים מפוזרים ורכס ציב-גומבורי במרחק. באביב עולה ירק
    קצר ופרגים בין האבנים; עד יולי הכול מולבן ואמצע היום חם באמת. האור הטוב ביותר הוא אחר הצהריים על החומות
    הפונות מזרחה.
  tip: >-
    שעה מספיקה. השביל מהחניון אל המצודה חצץ, כעשר דקות, ותלול במקומות — נעליים סבירות ולא סנדלים. אין
    מעקות בראש החומות, אז החזיקו ילדים הרחק מהקצוות. הצל מועט ואין מים למכירה, לכן הביאו משלכם. הכניסה
    חינם והשער פתוח, אין קופה ואין מדריך. שירותים ובית קפה נמצאים למטה בכפר לצד הכביש.
  route: >-
    צאו מטביליסי מזרחה דרך וזיאני וסרטיצ'לה והמשיכו בכביש קחתי הישן לכיוון גומבורי. 45 ק״מ וכ-55 דקות.
    הכביש סלול לכל אורכו ובמצב טוב. המבצר נראה משמאל מעל הכביש, הפנייה מסומנת ובסופה חניון קטן וחינמי.
    דלק יש בסרטיצ'לה. רכב חסכוני מספיק בכל ימות השנה, ונוח לשלב את האתר עם מעבר גומבורי בדרך לטלאווי.
ar:
  name: قلعة أوجارما
  short: قلعة ملكية على حيد صخري فوق نهر إيوري، حيث توفي الملك واختانغ غورغاسالي — على بعد 45 كم من تبليسي.
  body: >-
    **أوجارما أول محطة جادة في كاخيتي، على أقل من ساعة من تبليسي.** تمتد القلعة على حيد صخري فوق نهر إيوري
    مباشرة، وتبدو من الطريق أسفلها كأن التل توّج بأسوار.


    والموقع قديم. تذكر الحوليات الجورجية أوجارما منذ القرن الثالث، وفي القرن الخامس حوّلها الملك واختانغ
    غورغاسالي إلى مقر ملكي، وكانت من بلاطات المملكة الرئيسية قبل تأسيس تبليسي. وتقول الرواية إن واختانغ
    مات هنا من جرح أصابه في معركة. ثم حرست القلعة مداخل مملكة كاخيتي الشرقية ودُمرت وأُعيد بناؤها أكثر
    من مرة.


    وما بقي منها يسهل السير فيه:


    - **السور الطويل** بأبراجه، يتبع الحيد على جانبيه


    - **القلعة الداخلية** في أعلى نقطة، ومنها يُقرأ الوادي في الاتجاهين


    - **كنيسة جفارباتيوساني**، بناء صغير مقبّب من القرن العاشر أُعيد بناء جزء منه


    وترميم العقود الأخيرة ظاهر جداً في مواضع: مداميك حجرية جديدة تجاور القديمة بلون مختلف، ويراه المتشددون
    تدخلاً ثقيلاً. لكن نتيجته العملية أن بإمكانك المشي على الأسوار دون خطر، وهذا نادر في قلعة جورجية بهذا
    الحجم.


    والمشهد في الأسفل جاف مفتوح: منحدرات رمادية فوق إيوري، وأشجار متفرقة، وسلسلة تسيف-غومبوري في البعد.
    يأتي الربيع بخضرة قصيرة وشقائق نعمان بين الحجارة؛ ومع تموز يبيضّ كل شيء ويصير منتصف النهار حاراً فعلاً.
    وأفضل ضوء بعد الظهر على الأسوار المتجهة شرقاً.
  tip: >-
    ساعة تكفي. الدرب من الموقف إلى القلعة الداخلية حصوي ويستغرق نحو عشر دقائق، وهو حاد في مواضع؛ فالبس
    حذاءً مناسباً لا صندلاً. ولا درابزين على أعالي الأسوار، فأبقِ الأطفال بعيداً عن الحواف. والظل قليل
    ولا ماء يُشترى في الموقع، فاحمل ماءك. الدخول مجاني والبوابة مفتوحة، ولا شباك تذاكر ولا مرشد. ودورات
    المياه والمقهى في الأسفل عند الطريق في القرية.
  route: >-
    غادر تبليسي شرقاً عبر فازياني وسارتيتشالا والزم طريق كاخيتي القديم نحو غومبوري. المسافة 45 كم ونحو
    55 دقيقة. الطريق معبّد كله وبحالة جيدة. تظهر القلعة على اليسار فوق الطريق، والمنعطف عليه لافتة وفي
    نهايته موقف صغير مجاني. والوقود متوفر في سارتيتشالا. سيارة اقتصادية تكفي طوال السنة، ويسهل ضم الموقع
    إلى ممر غومبوري في الطريق إلى تيلافي.
