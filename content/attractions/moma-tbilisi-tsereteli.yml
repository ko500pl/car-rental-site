ka:
  name: ზურაბ წერეთლის თანამედროვე ხელოვნების მუზეუმი
  short: >-
    ოპერის გვერდით, რუსთაველზე, წერეთლის სამი სართული: ესკიზები, დიდი ფერადი ტილოები და ქანდაკებები ავტორისა,
    რომლის ძეგლებზე დავა დღემდე არ წყდება.
  body: >-
    **ზურაბ წერეთელმა ძეგლები მოსკოვში, ნიუ-იორკსა და სევილიაში აღმართა, 2012 წელს კი თავისი ნამუშევრები
    შინ, რუსთაველის გამზირზე ჩამოიტანა და ოპერის გვერდით სამი სართული აავსო ყველაფრით, რაც კვარცხლბეკზე
    არ დაეტია.**


    წერეთელი თბილისში 1934 წლის 4 იანვარს დაიბადა და 1958 წელს თბილისის სამხატვრო აკადემია დაამთავრა.
    1964 წელს სამი თვე პარიზში გაატარა და პაბლო პიკასოს სახელოსნოს ესტუმრა, მოგვიანებით მარკ შაგალსაც
    გაეცნო; მის ფერწერაში მათი, ისევე როგორც იმპრესიონისტებისა და პოსტიმპრესიონისტების, კვალი ჩანს. საჯარო
    ნამუშევრებმა მას საერთაშორისო სახელიც მოუტანა და დაუსრულებელი კამათიც: „სიკეთე ამარცხებს ბოროტებას“
    (1990) გაეროს შტაბბინასთან ნიუ-იორკში — მშვიდობის ალეგორიად ქცეული წმინდა გიორგი, რომელიც გველეშაპს
    განგმირავს; 98-მეტრიანი პეტრე დიდი მოსკოვში (1996–1997); „მწუხარების ცრემლი“ (2006) ბაიონში, ნიუ-ჯერსის
    შტატში — რუსეთის საჩუქარი 11 სექტემბრის ტერაქტების შემდეგ. 1997 წლიდან 2025 წლის 22 აპრილს გარდაცვალებამდე
    ის რუსეთის სამხატვრო აკადემიის პრეზიდენტი იყო.


    თბილისის მუზეუმი, რომელიც მან რუსთაველის გამზირის №27-ში დააარსა, შიგნიდან გადმობრუნებულ სახელოსნოს
    ჰგავს: პირველ სართულზე ესკიზებია, მეორეზე — დიდი, ფერადოვანი ტილოები, მესამეზე — ბიოგრაფიული ექსპოზიცია,
    ქანდაკებები კი ყველა სართულზე გხვდებათ. აქვე წერეთელი ქართველი და უცხოელი მხატვრების გამოფენებსაც
    მართავდა.


    მისი ძეგლების თაყვანისმცემელი არ უნდა იყოთ, რომ აქ გატარებული საათი არ ინანოთ. ტილოსთან ერთი ნაბიჯის
    მანძილზე, როცა თქვენსა და ნამუშევარს შორის მთელი მოედანი აღარ ძევს, ფერზე საკუთარ დასკვნას თავად გამოიტანთ
    — მისი ქანდაკებების უმეტესობა ამის საშუალებას იშვიათად იძლევა.
  tip: >-
    მუზეუმი ყოველდღე მუშაობს, ორშაბათის გარდა; მუზეუმების ოფიციალური ნუსხა 11:00–18:00 საათს ასახელებს,
    ზოგი გზამკვლევი კი 10:00-ს, ამიტომ ჯობს შუადღისკენ მიხვიდეთ. ზრდასრულის ბილეთი 5 ლარია, სტუდენტებისა
    და მოსწავლეების — 1 ლარი, ექვს წლამდე ბავშვებისთვის შესვლა უფასოა. სამივე სართულის მშვიდად დასათვალიერებლად
    საათი საკმარისია. თავად რუსთაველზე პარკირება ჭირს — ისარგებლეთ გვერდითა ქუჩების ფასიანი ავტოსადგომებით
    ან თავისუფლების მოედნიდან ფეხით ამოდით, დაახლოებით 20 წუთში. ოპერა კედლის მეზობელია, ეროვნული გალერეა
    იმავე გამზირზე, ცოტა ქვემოთაა, ასე რომ, მუზეუმი რუსთაველზე სასეირნო ნაშუადღევს იოლად ერგება.
  route: >-
    თავისუფლების მოედნიდან 2 კმ-იც არ არის — მანქანით დაახლოებით 10 წუთი, ფეხით კი 20, პირდაპირ რუსთაველის
    გამზირზე, და ეს უკეთესი არჩევანია. თუ მაინც მანქანით მიდიხართ, პუშკინის ქუჩით ბარათაშვილის გამზირზე
    ჩადით, ორბელიანის მოედანთან მობრუნდით და რუსთაველის პარალელურად გამავალი რევაზ თაბუკაშვილის ქუჩით
    რევაზ ლაღიძის ქუჩამდე იარეთ — იქიდან მუზეუმის კარამდე, ოპერის გვერდით, სულ რამდენიმე ნაბიჯია. ნებისმიერი
    ეკონომ-კლასის მანქანა გამოდგება. ნამდვილი გამოწვევა პარკირებაა: გამზირი გადატვირთულია, ტროტუარის პირას
    ადგილი ცოტაა, ამიტომ პირდაპირ გვერდითა ქუჩების ფასიანი ავტოსადგომისკენ აიღეთ გეზი.
en:
  name: Zurab Tsereteli Museum of Modern Art (MoMA Tbilisi)
  short: >-
    Three floors beside the Opera given to Zurab Tsereteli: sketches, big bright canvases and sculpture
    by the maker of some famously argued-over monuments.
  body: >-
    **Zurab Tsereteli raised monuments in Moscow, New York and Seville; in 2012 he brought his work home
    to Rustaveli Avenue and filled three floors beside the Opera with everything that would not fit on
    a plinth.**


    Born in Tbilisi on 4 January 1934, Tsereteli graduated from the Tbilisi Academy of Arts in 1958. In
    1964 he spent three months in Paris and visited Pablo Picasso in his studio; later he came to know
    Marc Chagall, and their influence, like that of the Impressionists and Post-Impressionists, runs through
    his painting. His public works brought him world fame and endless argument: Good Defeats Evil (1990)
    at the United Nations in New York, St George slaying the dragon as an allegory of peace; the 98-metre
    Peter the Great in Moscow (1996–97); the Tear of Grief (2006) in Bayonne, New Jersey, Russia's gift
    after the 11 September attacks. From 1997 until his death on 22 April 2025 he was President of the
    Russian Academy of Arts.


    The Tbilisi museum he founded at 27 Rustaveli Avenue reads like a studio turned inside out. Sketches
    fill the ground floor, large and vivid paintings the first, a biographical exhibition the top; sculpture
    turns up on every level. Tsereteli also used the rooms to show other Georgian and international artists.


    You need not admire the monuments to find an hour here well spent. A step away from the canvas, with
    no city square between you and the work, you can judge his colour for yourself — something most of
    his statues rarely allow.
  tip: >-
    Open daily except Monday. The official museums listing gives 11:00–18:00, though some guides say 10:00,
    so aim for late morning. Adults pay 5 GEL, students and schoolchildren 1 GEL, and children under six
    go free. An hour covers all three floors comfortably. Parking on Rustaveli Avenue itself is scarce:
    use a paid lot or garage in the side streets, or simply walk up from Freedom Square in about 20 minutes.
    The Opera House is next door and the National Gallery a short way down the same avenue, so the museum
    slots easily into a Rustaveli afternoon.
  route: >-
    Barely 2 km from Freedom Square: about 10 minutes by car, or 20 on foot straight up Rustaveli Avenue,
    which is the better choice. If you do drive, go down Pushkin Street to Baratashvili Avenue, turn back
    at Orbeliani Square and follow Revaz Tabukashvili Street, which runs parallel to Rustaveli, as far
    as Revaz Laghidze Street; from there the museum door beside the Opera is a few steps away. Any economy
    car will do. The real challenge is parking: the avenue is busy and kerbside spaces are few, so head
    straight for a paid lot in the side streets.
ru:
  name: Музей современного искусства Зураба Церетели (MoMA Тбилиси)
  short: >-
    Три этажа рядом с Оперой, отданные Зурабу Церетели: эскизы, большие яркие полотна и скульптура от
    автора нескольких знаменитых и спорных монументов.
  body: >-
    **Зураб Церетели ставил памятники в Москве, Нью-Йорке и Севилье, а в 2012 году привёз своё искусство
    домой, на проспект Руставели, и заполнил три этажа рядом с Оперой всем, что не поместилось бы на постаменте.**


    Церетели родился в Тбилиси 4 января 1934 года и в 1958 году окончил Тбилисскую академию художеств.
    В 1964-м он провёл три месяца в Париже и побывал в мастерской Пабло Пикассо; позже познакомился с
    Марком Шагалом, и их влияние, как и влияние импрессионистов и постимпрессионистов, проходит через
    всю его живопись. Монументальные работы принесли ему мировую славу и нескончаемые споры: «Добро побеждает
    зло» (1990) у ООН в Нью-Йорке — святой Георгий, поражающий дракона, как аллегория мира; 98-метровый
    Пётр Великий в Москве (1996–97); «Слеза скорби» (2006) в Байонне, штат Нью-Джерси, — дар России после
    терактов 11 сентября. С 1997 года и до своей смерти 22 апреля 2025 года он был президентом Российской
    академии художеств.


    Тбилисский музей, который он основал на проспекте Руставели, 27, похож на мастерскую, вывернутую наизнанку.
    Эскизы заполняют первый этаж, крупные яркие полотна — второй, биографическая экспозиция — верхний;
    скульптура встречается на каждом уровне. Церетели также отдавал залы под выставки других грузинских
    и зарубежных художников.


    Не обязательно восхищаться его монументами, чтобы провести здесь час с пользой. В шаге от холста,
    когда между вами и работой нет городской площади, вы сами можете судить о его цвете — чего большинство
    его статуй почти не позволяет.
  tip: >-
    Открыто ежедневно, кроме понедельника. Официальный перечень музеев указывает 11:00–18:00, хотя некоторые
    путеводители пишут 10:00, так что приходите ближе к полудню. Взрослый билет — 5 лари, для студентов
    и школьников — 1 лари, дети до шести лет проходят бесплатно. Часа хватит, чтобы спокойно обойти все
    три этажа. На самом проспекте Руставели парковаться почти негде: воспользуйтесь платной стоянкой или
    гаражом в боковых улицах либо просто пройдитесь от площади Свободы — около 20 минут. Оперный театр
    по соседству, Национальная галерея чуть ниже по тому же проспекту, так что музей легко вписывается
    в послеобеденную прогулку по Руставели.
  route: >-
    Всего около 2 км от площади Свободы: примерно 10 минут на машине или 20 пешком прямо по проспекту
    Руставели — и это лучший вариант. Если всё же едете, спуститесь по улице Пушкина к проспекту Бараташвили,
    развернитесь у площади Орбелиани и поезжайте по улице Реваза Табукашвили, идущей параллельно Руставели,
    до улицы Реваза Лагидзе; оттуда до входа в музей рядом с Оперой — несколько шагов. Подойдёт любая
    машина эконом-класса. Главная трудность — парковка: проспект загружен, мест у тротуара мало, поэтому
    сразу направляйтесь на платную стоянку в боковых улицах.
fa:
  name: موزهٔ هنر مدرن زوراب تسرتلی (MoMA تفلیس)
  short: >-
    سه طبقه کنار اپرا، سپرده به زوراب تسرتلی: طرح‌ها، بوم‌های بزرگ و پررنگ و پیکره‌هایی از سازندهٔ چند
    بنای یادبود مشهور و پرمناقشه.
  body: >-
    **زوراب تسرتلی بناهای یادبود را در مسکو، نیویورک و سویل برافراشت؛ در ۲۰۱۲ آثارش را به خانه، به خیابان
    روستاولی، آورد و سه طبقه در کنار اپرا را با هر آنچه بر هیچ پایه‌ای جا نمی‌گرفت پر کرد.**


    تسرتلی در ۴ ژانویهٔ ۱۹۳۴ در تفلیس به دنیا آمد و در ۱۹۵۸ از آکادمی هنرهای تفلیس دانش‌آموخته شد. در
    ۱۹۶۴ سه ماه را در پاریس گذراند و به کارگاه پابلو پیکاسو رفت؛ بعدها با مارک شاگال آشنا شد، و تأثیر
    آن دو، همچون تأثیر امپرسیونیست‌ها و پست‌امپرسیونیست‌ها، در سراسر نقاشی‌اش جاری است. آثار عمومی‌اش
    برایش شهرت جهانی و بحث‌هایی بی‌پایان آورد: «خیر بر شر پیروز می‌شود» (۱۹۹۰) در مقر سازمان ملل در نیویورک،
    گئورگی مقدس در حال کشتن اژدها به‌عنوان تمثیلی از صلح؛ پتر کبیرِ ۹۸ متری در مسکو (۱۹۹۶–۹۷)؛ و «اشک
    اندوه» (۲۰۰۶) در بایون، نیوجرسی، هدیهٔ روسیه پس از حملات ۱۱ سپتامبر. از ۱۹۹۷ تا درگذشتش در ۲۲ آوریل
    ۲۰۲۵ رئیس فرهنگستان هنرهای روسیه بود.


    موزهٔ تفلیس، که خود او در خیابان روستاولی شمارهٔ ۲۷ بنیاد نهاد، به کارگاهی می‌ماند که درونش را بیرون
    ریخته باشند. طرح‌ها طبقهٔ همکف را پر کرده‌اند، نقاشی‌های بزرگ و پرشور طبقهٔ اول را و نمایشگاهی زندگی‌نامه‌ای
    طبقهٔ بالا را؛ پیکره‌ها در هر طبقه سر برمی‌آورند. تسرتلی این تالارها را برای نمایش آثار دیگر هنرمندان
    گرجی و بین‌المللی نیز به کار می‌گرفت.


    لازم نیست ستایشگر بناهای یادبودش باشید تا ساعتی را اینجا به‌خوبی سپری کنید. یک قدم دورتر از بوم، بی
    آنکه میدانی شهری میان شما و اثر فاصله بیندازد، می‌توانید دربارهٔ رنگ‌هایش خودتان داوری کنید؛ چیزی
    که بیشتر مجسمه‌هایش به‌ندرت اجازه می‌دهند.
  tip: >-
    همه‌روزه جز دوشنبه باز است. فهرست رسمی موزه‌ها ساعت ۱۱:۰۰ تا ۱۸:۰۰ را اعلام می‌کند، هرچند برخی راهنماها
    ۱۰:۰۰ می‌گویند؛ پس اواخر صبح بروید. بزرگسالان ۵ لاری می‌پردازند، دانشجویان و دانش‌آموزان ۱ لاری، و
    ورود کودکان زیر شش سال رایگان است. یک ساعت برای دیدن هر سه طبقه با آسودگی کافی است. در خود خیابان
    روستاولی جای پارک کم است: از پارکینگ یا گاراژ پولی در خیابان‌های فرعی استفاده کنید، یا به‌سادگی از
    میدان آزادی حدود ۲۰ دقیقه پیاده بیایید. تالار اپرا درست در همسایگی است و گالری ملی کمی پایین‌تر در
    همین خیابان، پس موزه به‌راحتی در یک بعدازظهر روستاولی جا می‌گیرد.
  route: >-
    تنها حدود ۲ کیلومتر از میدان آزادی: نزدیک به ۱۰ دقیقه با خودرو، یا ۲۰ دقیقه پیاده مستقیم در خیابان
    روستاولی، که انتخاب بهتری است. اگر با خودرو می‌روید، از خیابان پوشکین به خیابان باراتاشویلی پایین
    بروید، در میدان اوربلیانی دور بزنید و خیابان رواز تابوکاشویلی را، که موازی روستاولی است، تا خیابان
    رواز لاگیدزه دنبال کنید؛ از آنجا تا در موزه کنار اپرا چند قدم بیشتر نیست. هر خودروی اقتصادی کافی است.
    چالش واقعی پارکینگ است: خیابان شلوغ است و جای پارک کنار پیاده‌رو کم، پس مستقیم به سراغ پارکینگی پولی
    در خیابان‌های فرعی بروید.
he:
  name: המוזיאון לאמנות מודרנית ע"ש זוראב צרתלי (MoMA טביליסי)
  short: >-
    שלוש קומות לצד האופרה המוקדשות לזוראב צרתלי: סקיצות, בדים גדולים ועזי צבע ופיסול, מאת יוצרן של כמה
    אנדרטאות מפורסמות ושנויות במחלוקת.
  body: >-
    **זוראב צרתלי הקים אנדרטאות במוסקבה, בניו יורק ובסביליה; ב-2012 הביא את יצירתו הביתה, לשדרות רוסתאוולי,
    ומילא שלוש קומות לצד האופרה בכל מה שלא היה לו מקום על שום בסיס של פסל.**


    צרתלי נולד בטביליסי ב-4 בינואר 1934 וסיים ב-1958 את האקדמיה לאמנויות של טביליסי. ב-1964 בילה שלושה
    חודשים בפריז וביקר את פבלו פיקאסו בסטודיו שלו; מאוחר יותר הכיר את מארק שאגאל, והשפעתם, כמו השפעת האימפרסיוניסטים
    והפוסט-אימפרסיוניסטים, עוברת כחוט השני בציוריו. עבודותיו במרחב הציבורי הביאו לו תהילה עולמית וויכוחים
    אינסופיים: "הטוב מנצח את הרע" (1990) באו"ם בניו יורק – גאורגיוס הקדוש קוטל את הדרקון, כאלגוריה לשלום;
    פטר הגדול בגובה 98 מטרים במוסקבה (1996–97); ו"דמעת היגון" (2006) בביון שבניו ג'רזי, מתנת רוסיה לאחר
    פיגועי ה-11 בספטמבר. מ-1997 ועד מותו ב-22 באפריל 2025 כיהן כנשיא האקדמיה הרוסית לאמנויות.


    המוזיאון בטביליסי, שייסד בשדרות רוסתאוולי 27, נראה כמו סטודיו שהפכו את פנימו החוצה. סקיצות ממלאות
    את קומת הקרקע, ציורים גדולים ותוססים את הקומה הראשונה, ותערוכה ביוגרפית את הקומה העליונה; פסלים מופיעים
    בכל מפלס. צרתלי גם העמיד את האולמות לרשות אמנים גאורגים ובינלאומיים אחרים.


    לא צריך להתפעל מהאנדרטאות כדי שהשעה כאן תהיה שווה. צעד אחד מהבד, בלי כיכר עירונית ביניכם לבין היצירה,
    אפשר לשפוט בעצמכם את השימוש שלו בצבע – דבר שרוב פסליו כמעט אינם מאפשרים.
  tip: >-
    פתוח מדי יום, למעט ימי שני. הרשימה הרשמית של המוזיאונים מציינת 11:00–18:00, אף שכמה מדריכים כותבים
    10:00, לכן כדאי להגיע בשעות הבוקר המאוחרות. מבוגרים משלמים 5 לארי, סטודנטים ותלמידים 1 לארי, וילדים
    מתחת לגיל שש נכנסים חינם. שעה מספיקה לכל שלוש הקומות בנחת. חניה בשדרות רוסתאוולי עצמן כמעט אין: השתמשו
    בחניון בתשלום או בחניון מקורה ברחובות הצדדיים, או פשוט בואו ברגל מכיכר החירות, כעשרים דקות. בית האופרה
    ממש בשכנות, והגלריה הלאומית קצת במורד אותן שדרות, כך שהמוזיאון משתלב בקלות באחר צהריים ברוסתאוולי.
  route: >-
    כ-2 ק"מ בלבד מכיכר החירות: כ-10 דקות ברכב, או 20 ברגל ישר במעלה שדרות רוסתאוולי, וזו הבחירה הטובה
    יותר. אם בכל זאת נוסעים, רדו ברחוב פושקין אל שדרות ברתאשווילי, הסתובבו בכיכר אורבליאני והמשיכו ברחוב
    רוואז טבוקשווילי, המקביל לרוסתאוולי, עד רחוב רוואז לגידזה; משם דלת המוזיאון לצד האופרה במרחק כמה צעדים.
    כל רכב חסכוני יתאים. האתגר האמיתי הוא חניה: השדרה עמוסה ומקומות החניה לצד המדרכה מעטים, לכן סעו ישר
    לחניון בתשלום ברחובות הצדדיים.
ar:
  name: متحف زوراب تسيريتيلي للفن الحديث (MoMA تبليسي)
  short: >-
    ثلاثة طوابق بجوار دار الأوبرا مكرّسة لزوراب تسيريتيلي: رسوم تحضيرية ولوحات كبيرة زاهية ومنحوتات لصانع
    نُصب شهيرة أثارت جدلاً واسعاً.
  body: >-
    **أقام زوراب تسيريتيلي نُصباً في موسكو ونيويورك وإشبيلية، ثم أعاد أعماله في عام 2012 إلى موطنه، إلى
    جادة روستافيلي، وملأ ثلاثة طوابق بجوار الأوبرا بكل ما لا تتسع له قاعدة تمثال.**


    وُلد تسيريتيلي في تبليسي في 4 يناير 1934، وتخرج في أكاديمية تبليسي للفنون عام 1958. وفي عام 1964 أمضى
    ثلاثة أشهر في باريس وزار بابلو بيكاسو في مرسمه؛ ثم تعرّف لاحقاً إلى مارك شاغال، ويسري تأثيرهما، كتأثير
    الانطباعيين وما بعد الانطباعيين، في لوحاته كلها. وجلبت له أعماله في الفضاء العام شهرة عالمية وجدلاً
    لا ينتهي: «الخير يهزم الشر» (1990) في مقر الأمم المتحدة بنيويورك، القديس جاورجيوس يصرع التنين رمزاً
    للسلام؛ وتمثال بطرس الأكبر بارتفاع 98 متراً في موسكو (1996–97)؛ و«دمعة الحزن» (2006) في بايون بولاية
    نيوجيرسي، هدية روسيا بعد هجمات 11 سبتمبر. ومن عام 1997 حتى وفاته في 22 أبريل 2025 شغل منصب رئيس الأكاديمية
    الروسية للفنون.


    ويبدو المتحف الذي أسسه في تبليسي، في جادة روستافيلي رقم 27، كمرسم انقلب باطنه إلى ظاهره. تملأ الرسوم
    التحضيرية الطابق الأرضي، واللوحات الكبيرة الزاهية الطابق الأول، ومعرض لسيرته الطابق الأعلى؛ وتظهر
    المنحوتات في كل طابق. كما خصص تسيريتيلي القاعات لعرض أعمال فنانين جورجيين ودوليين آخرين.


    لستم بحاجة إلى الإعجاب بنُصبه كي تقضوا هنا ساعة مجدية. على خطوة من اللوحة، ومن دون ساحة مدينة تفصل
    بينكم وبين العمل، يمكنكم أن تحكموا بأنفسكم على ألوانه، وهو ما لا تكاد تتيحه معظم تماثيله.
  tip: >-
    مفتوح يومياً ما عدا الاثنين. تذكر القائمة الرسمية للمتاحف الساعات 11:00–18:00، وإن كانت بعض الأدلة
    تقول 10:00، فاقصدوه في أواخر الصباح. يدفع البالغون 5 لاري، والطلاب وتلاميذ المدارس 1 لاري، ويدخل الأطفال
    دون السادسة مجاناً. تكفي ساعة لجولة مريحة في الطوابق الثلاثة. المواقف في جادة روستافيلي نفسها شحيحة:
    استخدموا موقفاً مدفوعاً أو مرآباً في الشوارع الجانبية، أو امشوا ببساطة من ساحة الحرية في نحو 20 دقيقة.
    دار الأوبرا في الجوار، والمعرض الوطني على مسافة قصيرة في الجادة نفسها، فيندرج المتحف بسهولة في عصرية
    على روستافيلي.
  route: >-
    نحو 2 كم فقط من ساحة الحرية: قرابة 10 دقائق بالسيارة، أو 20 دقيقة سيراً مباشرة في جادة روستافيلي،
    وهو الخيار الأفضل. وإن قدتم فعلاً، فانزلوا في شارع بوشكين إلى جادة باراتاشفيلي، ثم استديروا عند ساحة
    أوربلياني واتبعوا شارع ريفاز تابوكاشفيلي الموازي لروستافيلي حتى شارع ريفاز لاغيدزه؛ ومن هناك يبعد
    باب المتحف بجوار الأوبرا خطوات قليلة. أي سيارة اقتصادية تفي بالغرض. التحدي الحقيقي هو الركن: فالجادة
    مزدحمة ومواقف الرصيف قليلة، لذا توجهوا مباشرة إلى موقف مدفوع في الشوارع الجانبية.
