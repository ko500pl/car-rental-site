ka:
  name: ნაკიფარის წმინდა გიორგის ეკლესია
  short: >-
    ბორცვზე მდგარი წმინდა გიორგი ზემო სვანეთში: შიგნით თევდორეს 1130 წლის ფრესკები, გარეთ — თაღები, ფერწერა
    და ქვაში ნაკვეთი ცხოველები.
  body: >-
    **სვანური ეკლესიები საუკეთესოს, ჩვეულებრივ, შიგნით ინახავენ; ნაკიფარის წმინდა გიორგი კი მას აღმოსავლეთ
    ფასადზე გამოაჩენს — თაღებით, მოხატული წმინდანებითა და ქვაში ნაკვეთი ცხოველებით.**


    ეკლესია ნაკიფარში, იფარის თემის პატარა სოფელში, ბორცვზე დგას, სოფლის სასაფლაოს შუაგულში, რომელსაც
    ნახევრად დანგრეული ქვის გალავანი ერტყმის. სვანები მას „ჯგრაგს“ ეძახიან — ასე ჰქვია სვანურად წმინდა
    გიორგის. აშენების ზუსტი თარიღი უცნობია; სტილით X–XI საუკუნეებს მიაკუთვნებენ. ეს კირქვის თლილი ქვით
    ნაგები დარბაზული ეკლესიაა, მაღალი ორფერდა სახურავითა და სამხრეთითა და დასავლეთით მიშენებული ცალფერდა
    გალერეით. აღმოსავლეთ ფასადზე სამნაწილიანი დეკორატიული თაღედია, მასიურ პილასტრებს შორის ჩასმული: მისი
    ფრესკები სვანეთში გარე კედლის უადრეს მოხატულობათა შორისაა, რელიეფური ცხოველები კი ამ მხარის ხუროთმოძღვრებისთვის
    იშვიათობაა.


    კანკელის კარნიზზე ასომთავრული წარწერა მოგვითხრობს, რომ 1130 წელს ადგილობრივმა აზნაურებმა ეკლესიის
    მოხატვა სამეფო მხატვარს, თევდორეს დაუკვეთეს. ეს უკანასკნელი ეკლესიაა, რომელიც უდავოდ მისი მოხატულია
    — იფრარისა (1096) და ლაგურკის (1112) შემდეგ. ტაძრის პატრონი, წმინდა გიორგი, აქ ყველგანაა: დასავლეთ
    კედელზე მისი სასწაულით კერპები ემხობა, ქვემოთ კი მას ბორბალზე აწამებენ; ჩრდილოეთით ცხენოსანი გიორგი
    მიწაზე დამხობილ დიოკლეტიანეს განგმირავს, პირისპირ კი თევდორე გველს შუბს ასობს; სამხრეთ კედელზე, სულთმოფენობისა
    და ჯვარცმის ქვეშ, გიორგის წამების კიდევ სამი სცენაა. აფსიდის კონქში ტახტზე მჯდომი ქრისტეა ღვთისმშობელსა
    და იოანე ნათლისმცემელს შორის.


    აქედან მომდინარეობს იფარის წმინდა გიორგიც — XI საუკუნის ვერცხლის ჭედური ხატი, რომელზეც ცხენოსანი წმინდანი
    დიოკლეტიანეს კლავს. წარწერის თანახმად, ის ვინმე მარუშანმა ოქრომჭედელ ასანს შეუკვეთა: ორი სახელი, დამკვეთისა
    და ოსტატისა, ნაჭედ ვერცხლზე ცხრაას წელზე მეტხანს შემორჩა.


    იფრარში თევდორე გზას იწყებს; აქ, ოცდათოთხმეტი წლის შემდეგ, წარწერებით დადასტურებული მისი გზა სრულდება.
  tip: >-
    ეკლესია ხშირად დაკეტილია — სოფელში ჰკითხეთ, ვისთანაა გასაღები, ან მესტიიდანვე შეათანხმეთ გიდის მეშვეობით.
    შესვლა უფასოა, შემოწირულობის ყუთი კი, როგორც წესი, იქვე დგას. ბილიკიდან ბორცვამდე მოკლე, მაგრამ ციცაბო
    აღმართია; ეკლესიას სასაფლაო აკრავს, ამიტომ წყნარად იარეთ და საფლავებზე ნუ გადააბიჯებთ. მხრები და მუხლები
    დაიფარეთ, ქალებს თავსაფარი დასჭირდებათ. აღმოსავლეთ ფასადს დილის მზე ანათებს — ფოტოსთვის ეს საუკეთესო
    დროა. ვერცხლის ხატის ნახვის იმედი ნუ გექნებათ. თუ თევდორეს ეკლესიებს რიგით ნახვა გინდათ, ჯერ იფრარამდე
    ჩადით და მესტიისკენ დაბრუნებისას ლაგურკასა და ნაკიფარში შეიარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ზუგდიდამდე, შემდეგ შ7-ით ენგურის ხეობით მესტიამდე — დაახლოებით 470
    კმ და რვანახევარი საათი; გზაში ან მესტიაში ღამის გათევა ბევრად ჯობია. მესტიიდან უშგულის გზას დაახლოებით
    20 კილომეტრი გაჰყევით იფარის თემამდე, საიდანაც მოკლე შესახვევი და ფეხით რამდენიმე წუთი ბორცვზე ეკლესიამდე
    მიგიყვანთ. ეს მონაკვეთი ახლა უმეტესად მოასფალტებულია, თუმცა ვიწრო, ცუდი ხრეშიანი უბნებიც გვხვდება
    — დაახლოებით ორმოცდაათი წუთი. სულ 490-მდე კმ და ცხრა საათი და ოცი წუთი. ამ უბნებისა და კლირენსის გამო
    მაღალი გამავლობის მანქანას (კროსოვერს ან ჯიპს) გირჩევთ; მშრალ ამინდში სრული ამძრავი აუცილებელი არ
    არის. ბოლო ბენზინგასამართი და ბანკომატი მესტიაშია; მაისიდან ოქტომბრამდე იარეთ.
en:
  name: Nakipari Church of St George
  short: >-
    A hilltop St George in Upper Svaneti: inside, Tevdore's frescoes of 1130; outside, an east wall of
    arches, painted saints and carved animals.
  body: >-
    **Most Svan churches keep their best face indoors; Nakipari's St George turns it outwards, to an east
    wall of arches, painted saints and animals carved in stone.**


    The church stands on a hill in the hamlet of Nakipari, part of the Ipari community, in the middle
    of the village cemetery, inside a half-ruined stone wall. Svans call it Jgrag, from their name for
    St George. Its building date is unknown; its style suggests the 10th or 11th century. It is a hall
    church of limestone blocks under a steep gable roof, with a lean-to gallery along the south and west
    sides. The east façade is set with a triple arcade between massive pilasters; its frescoes are among
    the earliest exterior paintings in Svaneti, and its animal reliefs are rare in the region's architecture.


    An inscription in asomtavruli script on the altar-screen cornice records that in 1130 local nobles
    commissioned the interior from Tevdore, the royal painter. It is the last church he certainly painted,
    after Iprari (1096) and Lagurka (1112). The patron saint is everywhere. On the west wall George makes
    idols topple, and below he is broken on the wheel. On the north wall the mounted George transfixes
    the prostrate Diocletian with his lance, while Theodore, opposite, spears a serpent. Three more scenes
    of his martyrdom fill the south wall beneath the Pentecost and the Crucifixion. In the apse, Christ
    sits enthroned between Mary and John the Baptist.


    From this church comes St George of Ipari, an 11th-century repoussé silver icon of the mounted saint
    killing Diocletian. Its inscription says a man named Marushan ordered it from a goldsmith called Asan:
    patron and craftsman, two names still legible on beaten silver after more than nine hundred years.


    At Iprari you see Tevdore beginning; here, thirty-four years on, his documented work ends.
  tip: >-
    The church is often locked: ask in the village who holds the key, or arrange it through a guide in
    Mestia. Entry is free, and there is usually a donation box. The climb from the lane is short but steep,
    and the church sits among graves, so walk quietly and keep to the paths. Cover shoulders and knees;
    women will need a headscarf. The east façade catches the morning sun, the best hour for photographs.
    Do not count on seeing the silver icon. To see Tevdore's churches in order, drive to Iprari first
    and stop at Lagurka and Nakipari on the way back to Mestia.
  route: >-
    From Tbilisi take the E60 (S1) west to Zugdidi and the Sh7 up the Enguri gorge to Mestia: about 470
    km and eight and a half hours, so break the journey. From Mestia follow the Ushguli road for about
    20 km to the Ipari community. A short lane and a few minutes' walk bring you to the hilltop church.
    This stretch is now mostly asphalt, with narrow, rough gravel patches, and takes about fifty minutes.
    In all, about 490 km and nine hours twenty minutes. We recommend an SUV for the rough patches and
    the clearance; a 4x4 is not essential in dry weather. The last fuel and cash machine are in Mestia.
    Go between May and October.
ru:
  name: Церковь Святого Георгия в Накипари
  short: >-
    Святой Георгий на холме в Верхней Сванетии: внутри — фрески Тевдоре 1130 года, снаружи — восточная
    стена с арками, расписными святыми и резными зверями.
  body: >-
    **Большинство сванских церквей прячет лучшее внутри; церковь Святого Георгия в Накипари обращает его
    наружу — к восточной стене с арками, расписными святыми и высеченными в камне зверями.**


    Церковь стоит на холме в селении Накипари, входящем в общину Ипари, посреди сельского кладбища, в
    кольце полуразрушенной каменной ограды. Сваны называют её Джграг — по своему имени святого Георгия.
    Дата постройки неизвестна; по стилю её относят к X или XI веку. Это зальная церковь из известняковых
    блоков под крутой двускатной крышей, с пристроенной галереей под односкатной кровлей вдоль южной и
    западной сторон. В восточный фасад вписана тройная аркада между массивными пилястрами; её фрески —
    одни из самых ранних наружных росписей в Сванетии, а рельефы с животными редки для архитектуры края.


    Надпись асомтаврули на карнизе алтарной преграды сообщает, что в 1130 году местные знатные люди заказали
    роспись интерьера царскому живописцу Тевдоре. Это последняя церковь, которую он достоверно расписал,
    — после Ипрари (1096) и Лагурки (1112). Святой покровитель здесь повсюду. На западной стене Георгий
    низвергает идолов, а ниже его колесуют. На северной стене всадник Георгий пронзает копьём поверженного
    Диоклетиана, а напротив Феодор разит копьём змея. Ещё три сцены его мученичества заполняют южную стену
    под Сошествием Святого Духа и Распятием. В апсиде — Христос на престоле между Богоматерью и Иоанном
    Крестителем.


    Из этой церкви происходит «Георгий Ипарский» — чеканная серебряная икона XI века, где всадник-святой
    убивает Диоклетиана. Надпись на ней сообщает, что некий Марушан заказал её золотых дел мастеру по
    имени Асан: заказчик и мастер, два имени, которые спустя более девятисот лет всё ещё читаются на кованом
    серебре.


    В Ипрари виден Тевдоре в начале пути; здесь, тридцать четыре года спустя, обрывается его документально
    подтверждённая работа.
  tip: >-
    Церковь часто заперта: спросите в селе, у кого ключ, или договоритесь через гида в Местиа. Вход бесплатный,
    обычно стоит ящик для пожертвований. Подъём от проезда короткий, но крутой, а церковь стоит среди
    могил — ходите тихо и держитесь тропинок. Плечи и колени должны быть закрыты, женщинам понадобится
    платок. Восточный фасад освещает утреннее солнце — это лучшее время для снимков. На то, что увидите
    серебряную икону, не рассчитывайте. Чтобы посмотреть церкви Тевдоре по порядку, поезжайте сначала
    в Ипрари, а на обратном пути в Местиа остановитесь в Лагурке и Накипари.
  route: >-
    Из Тбилиси езжайте по E60 (S1) на запад до Зугдиди и по Sh7 вверх по ущелью Ингури до Местиа: около
    470 км и восемь с половиной часов, так что поездку лучше разбить на два дня. Из Местиа следуйте по
    дороге на Ушгули около 20 км до общины Ипари. Короткий проезд и несколько минут пешком выводят к церкви
    на холме. Этот отрезок теперь по большей части асфальтирован, но с узкими разбитыми гравийными участками,
    и занимает около пятидесяти минут. Всего около 490 км и девять часов двадцать минут. Из-за этих участков
    и ради клиренса мы рекомендуем кроссовер или внедорожник; полный привод в сухую погоду не обязателен.
    Последняя заправка и банкомат — в Местиа. Лучшее время — с мая по октябрь.
fa:
  name: کلیسای قدیس گئورگی در ناکیپاری
  short: >-
    کلیسای گئورگی قدیس بر تپه‌ای در سوانتی علیا: درونش دیوارنگاره‌های تئودوره از ۱۱۳۰؛ بیرونش دیوار شرقی
    با طاق‌ها، قدیسان نقاشی‌شده و جانوران سنگی.
  body: >-
    **بیشتر کلیساهای سوانی زیباترین چهره‌شان را در درون نگه می‌دارند؛ کلیسای قدیس گئورگی در ناکیپاری آن
    را رو به بیرون می‌گرداند، به دیوار شرقی‌ای با طاق‌ها، قدیسان نقاشی‌شده و جانورانی که در سنگ کنده شده‌اند.**


    کلیسا بر تپه‌ای در آبادی ناکیپاری، از آبادی‌های دهستان ایپاری، در میان گورستان روستا و درون دیواری
    سنگی و نیمه‌ویران ایستاده است. سوان‌ها آن را جگراگ می‌نامند، از نامی که خود بر قدیس گئورگی نهاده‌اند.
    تاریخ ساختش روشن نیست؛ سبک آن به سدهٔ دهم یا یازدهم اشاره دارد. کلیسایی تک‌تالاری است از بلوک‌های
    سنگ آهک، زیر بامی دوشیبه و پرشیب، با رواقی الحاقی و یک‌شیبه در امتداد ضلع‌های جنوبی و غربی. در نمای
    شرقی، طاق‌بندی سه‌دهانه‌ای میان ستون‌نماهای ستبر نشسته است؛ دیوارنگاره‌های آن از نخستین نقاشی‌های
    بیرونی در سوانتی‌اند و نقش‌برجسته‌های جانورانش در معماری این منطقه کم‌یاب است.


    کتیبه‌ای به خط آسومتاورولی بر قرنیز دیوارهٔ جداکنندهٔ محراب گواهی می‌دهد که در ۱۱۳۰ بزرگان محلی نقاشی
    درون کلیسا را به تئودوره، نقاش دربار، سفارش دادند. این آخرین کلیسایی است که با اطمینان می‌دانیم او
    نقاشی کرده، پس از ایپراری (۱۰۹۶) و لاگورکا (۱۱۱۲). قدیس نگهبان کلیسا همه‌جا حاضر است. بر دیوار غربی،
    گئورگی بت‌ها را سرنگون می‌کند و پایین‌تر بر چرخ شکنجه می‌شود. بر دیوار شمالی، گئورگیِ سواره دیوکلتیانِ
    به خاک افتاده را با نیزه می‌زند و در برابرش تئودورِ قدیس نیزه در ماری فرو می‌کند. سه صحنهٔ دیگر از
    شهادت او دیوار جنوبی را، زیر صحنه‌های نزول روح‌القدس و به صلیب کشیدن مسیح، پر کرده‌اند. در شاه‌نشین
    شرقی کلیسا، مسیح میان مریم و یحیای تعمیددهنده بر تخت نشسته است.


    از همین کلیساست «گئورگی ایپاری»، شمایلی نقره‌ای با برجسته‌کاری از سدهٔ یازدهم که قدیسِ سواره را در
    حال کشتن دیوکلتیان نشان می‌دهد. کتیبهٔ آن می‌گوید مردی به نام ماروشان آن را به زرگری به نام آسان سفارش
    داده است: سفارش‌دهنده و سازنده، دو نامی که پس از بیش از نهصد سال هنوز بر نقرهٔ چکش‌خورده خواناست.


    در ایپراری تئودوره را در آغاز راه می‌بینید؛ اینجا، سی‌وچهار سال بعد، کارنامهٔ مستند او به پایان می‌رسد.
  tip: >-
    کلیسا اغلب قفل است: در روستا بپرسید کلید دست کیست، یا از طریق راهنمایی در مستیا هماهنگ کنید. ورود
    رایگان است و معمولاً صندوق نذوراتی هست. سربالایی از راه فرعی کوتاه اما تند است و کلیسا میان گورها
    قرار دارد، پس آرام قدم بردارید و از مسیرها بیرون نروید. شانه‌ها و زانوها را بپوشانید؛ بانوان به روسری
    نیاز دارند. نمای شرقی آفتاب صبح را می‌گیرد، که بهترین زمان برای عکاسی است. روی دیدن شمایل نقره‌ای
    حساب نکنید. برای دیدن کلیساهای تئودوره به ترتیب، نخست به ایپراری بروید و در راه بازگشت به مستیا در
    لاگورکا و ناکیپاری توقف کنید.
  route: >-
    از تفلیس جادهٔ E60 (S1) را رو به غرب تا زوگدیدی بروید و سپس با Sh7 در تنگهٔ انگوری تا مستیا بالا بروید:
    حدود ۴۷۰ کیلومتر و هشت ساعت و نیم، پس سفر را دو بخش کنید. از مستیا جادهٔ اوشگولی را حدود ۲۰ کیلومتر
    تا دهستان ایپاری دنبال کنید. راهی فرعی کوتاه و چند دقیقه پیاده‌روی شما را به کلیسای روی تپه می‌رساند.
    این بخش اکنون بیشترش آسفالت است، اما تکه‌هایی شنی، باریک و ناهموار هم دارد و حدود پنجاه دقیقه طول
    می‌کشد. روی هم حدود ۴۹۰ کیلومتر و نه ساعت و بیست دقیقه. به خاطر این تکه‌ها و فاصلهٔ کف خودرو از زمین،
    خودروی شاسی‌بلند را توصیه می‌کنیم؛ در هوای خشک، خودروی دودیفرانسیل ضروری نیست. آخرین جایگاه سوخت و
    خودپرداز در مستیاست. بین ماه مه و اکتبر بروید.
he:
  name: כנסיית גאורגיוס הקדוש בנקיפארי
  short: >-
    כנסיית גאורגיוס הקדוש על גבעה בסוואנטי עילית: בפנים, ציורי הקיר של טוודורה משנת 1130; בחוץ, קיר מזרחי
    של קשתות, קדושים מצוירים וחיות מגולפות.
  body: >-
    **רוב הכנסיות הסוואניות שומרות את היפה שבהן בפנים; כנסיית גאורגיוס הקדוש בנקיפארי מפנה אותו החוצה,
    אל קיר מזרחי של קשתות, קדושים מצוירים וחיות מגולפות באבן.**


    הכנסייה עומדת על גבעה בכפרון נקיפארי, שהוא חלק מקהילת איפארי, באמצע בית הקברות של הכפר, בתוך חומת
    אבן הרוסה למחצה. הסוואנים קוראים לה ג׳גראג, על שם הכינוי שלהם לגאורגיוס הקדוש. מועד בנייתה אינו ידוע;
    סגנונה מרמז על המאה ה-10 או ה-11. זוהי כנסיית אולם מגושי אבן גיר תחת גג גמלון תלול, ולאורך הצד הדרומי
    והמערבי צמודה אליה גלריה בעלת גג חד-שיפועי. בחזית המזרחית משולבת קשתייה משולשת בין פילסטרים מסיביים;
    ציורי הקיר שבה הם מציורי החוץ המוקדמים ביותר בסוואנטי, ותבליטי החיות שלה נדירים באדריכלות האזור.


    כתובת בכתב אסומתאוורולי על כרכוב מחיצת המזבח מתעדת שב-1130 הזמינו אצילים מקומיים את ציורי הפנים מטוודורה,
    הצייר המלכותי. זוהי הכנסייה האחרונה שידוע בוודאות שהוא צייר, אחרי איפרארי (1096) ולגורקה (1112). הקדוש
    הפטרון נוכח בכל מקום. על הקיר המערבי גאורגיוס מפיל את האלילים, ומתחת לכך מענים אותו על גלגל העינויים.
    על הקיר הצפוני גאורגיוס הרכוב נועץ את חניתו בדיוקלטיאנוס השרוע על הארץ, ואילו מולו תאודורוס הקדוש
    דוקר בחניתו נחש. שלוש סצנות נוספות מסיפור מות הקדושים של גאורגיוס ממלאות את הקיר הדרומי, מתחת לתמונות
    ירידת רוח הקודש והצליבה. באפסיס ישו יושב על כס מלכות בין מרים ליוחנן המטביל.


    מכנסייה זו מגיעה ״גאורגיוס מאיפארי״, איקונת כסף מרוקע מהמאה ה-11, המתארת את הקדוש הרכוב כשהוא הורג
    את דיוקלטיאנוס. הכתובת עליה מספרת שאדם בשם מרושאן הזמין אותה מצורף בשם אסאן: מזמין ואומן, שני שמות
    שעדיין אפשר לקרוא על הכסף המרוקע אחרי יותר מתשע מאות שנה.


    באיפרארי רואים את טוודורה בראשית דרכו; כאן, שלושים וארבע שנים אחר כך, מסתיימת עבודתו המתועדת.
  tip: >-
    הכנסייה נעולה לעיתים קרובות: שאלו בכפר אצל מי המפתח, או תאמו דרך מדריך במסטיה. הכניסה חופשית, ובדרך
    כלל יש תיבת תרומות. העלייה מהדרך הצרה קצרה אך תלולה, והכנסייה ניצבת בין קברים, לכן לכו בשקט והקפידו
    ללכת בשבילים. כסו כתפיים וברכיים; נשים יזדקקו למטפחת ראש. החזית המזרחית מוארת בשמש הבוקר, השעה הטובה
    ביותר לצילום. אל תסמכו על כך שתראו את איקונת הכסף. כדי לראות את כנסיות טוודורה לפי הסדר, סעו קודם
    לאיפרארי, ועצרו בלגורקה ובנקיפארי בדרך חזרה למסטיה.
  route: >-
    מטביליסי סעו מערבה בכביש E60 (S1) עד זוגדידי, ומשם בכביש Sh7 במעלה ערוץ האנגורי עד מסטיה: כ-470 ק״מ
    ושמונה שעות וחצי, ולכן כדאי לפצל את הנסיעה. ממסטיה המשיכו בדרך לאושגולי כ-20 ק״מ עד קהילת איפארי.
    דרך צרה קצרה וכמה דקות הליכה מביאות אתכם אל הכנסייה שעל הגבעה. הקטע הזה סלול כיום ברובו, אך יש בו
    קטעי חצץ צרים ומשובשים, והוא נמשך כחמישים דקות. בסך הכול כ-490 ק״מ ותשע שעות ועשרים דקות. אנו ממליצים
    על רכב פנאי-שטח בגלל הקטעים האלה ומרווח הגחון; הנעה כפולה אינה הכרחית במזג אוויר יבש. תחנת הדלק והכספומט
    האחרונים נמצאים במסטיה. סעו בין מאי לאוקטובר.
ar:
  name: كنيسة القديس جاورجيوس في ناكيباري
  short: >-
    كنيسة القديس جاورجيوس على تلّة في سفانيتي العليا: في الداخل جداريات تيفدوره من عام 1130، وفي الخارج
    جدار شرقي بأقواس وقديسين مرسومين وحيوانات منحوتة.
  body: >-
    **معظم كنائس سفانيتي تخبّئ أجمل ما فيها في الداخل؛ أما كنيسة القديس جاورجيوس في ناكيباري فتُبرزه إلى
    الخارج، نحو جدار شرقي من الأقواس والقديسين المرسومين والحيوانات المنحوتة في الحجر.**


    تقوم الكنيسة على تلّة في قرية ناكيباري الصغيرة، التابعة لتجمّع إيباري الريفي، وسط مقبرة القرية، داخل
    سور حجري نصف متهدّم. ويسمّيها السفان «جغراغ»، من اسمهم للقديس جاورجيوس. تاريخ بنائها مجهول؛ ويرجّح
    طرازها القرن العاشر أو الحادي عشر. وهي كنيسة ذات قاعة واحدة من كتل الحجر الجيري، تحت سقف جملوني شديد
    الانحدار، ويمتد على جانبيها الجنوبي والغربي رواق ملحق بسقف أحادي الميل. وفي الواجهة الشرقية بائكة
    ثلاثية بين دعامات جدارية ضخمة؛ وجدارياتها من أقدم الرسوم الخارجية في سفانيتي، أما نقوشها البارزة للحيوانات
    فنادرة في عمارة المنطقة.


    ويشهد نقش بخط الأسومتافرولي على إفريز حاجز الهيكل أن وجهاء محليين كلّفوا عام 1130 الرسامَ الملكي تيفدوره
    برسم داخل الكنيسة. وهي آخر كنيسة يُعرف يقيناً أنه رسمها، بعد إيبراري (1096) ولاغوركا (1112). والقديس
    شفيع الكنيسة حاضر في كل مكان. فعلى الجدار الغربي يُسقط جاورجيوس الأصنام، وتحته يُعذَّب على الدولاب.
    وعلى الجدار الشمالي يطعن جاورجيوس الفارس ديوكلتيانوس الصريع برمحه، بينما يصرع القديس ثيودوروس في الجهة
    المقابلة ثعباناً بالرمح. وتملأ ثلاثة مشاهد أخرى من استشهاده الجدار الجنوبي تحت مشهدي حلول الروح القدس
    والصلب. وفي الحنية يجلس المسيح على العرش بين مريم ويوحنا المعمدان.


    ومن هذه الكنيسة جاءت أيقونة «جاورجيوس من إيباري»، وهي أيقونة فضية مطروقة من القرن الحادي عشر تصوّر
    القديس الفارس يقتل ديوكلتيانوس. ويذكر نقشها أن رجلاً يُدعى ماروشان طلب صنعها من صائغ يُدعى أسان: صاحب
    الطلب والصانع، اسمان لا يزالان مقروءين على الفضة المطروقة بعد أكثر من تسعمئة عام.


    في إيبراري ترى تيفدوره في بداياته؛ وهنا، بعد أربعة وثلاثين عاماً، ينتهي عمله الموثّق.
  tip: >-
    الكنيسة مغلقة في أحيان كثيرة: اسأل في القرية عمّن يحمل المفتاح، أو رتّب الأمر عبر مرشد في ميستيا.
    الدخول مجاني، وعادةً ما يوجد صندوق للتبرعات. الصعود من الدرب قصير لكنه شديد الانحدار، والكنيسة قائمة
    بين القبور، فامشِ بهدوء والزم الممرات. غطِّ الكتفين والركبتين؛ وستحتاج النساء إلى غطاء للرأس. تتلقى
    الواجهة الشرقية شمس الصباح، وهو أفضل وقت للتصوير. لا تعوّل على رؤية الأيقونة الفضية. ولكي ترى كنائس
    تيفدوره بترتيبها، اذهب إلى إيبراري أولاً، ثم توقّف في لاغوركا وناكيباري في طريق العودة إلى ميستيا.
  route: >-
    من تبليسي اسلك الطريق E60 (S1) غرباً إلى زوغديدي، ثم الطريق Sh7 صعوداً في مضيق إنغوري حتى ميستيا:
    نحو 470 كم وثماني ساعات ونصف، فقسّم الرحلة على مرحلتين. ومن ميستيا اتبع طريق أوشغولي نحو 20 كم حتى
    تجمّع إيباري. درب قصير وبضع دقائق من المشي يوصلانك إلى الكنيسة على التلّة. هذا المقطع معبّد في معظمه
    اليوم، لكن فيه أجزاء حصوية ضيقة ووعرة، ويستغرق نحو خمسين دقيقة. والمجموع نحو 490 كم وتسع ساعات وعشرون
    دقيقة. نوصي بسيارة رياضية متعددة الاستخدامات بسبب هذه الأجزاء وارتفاع الهيكل عن الأرض؛ أما الدفع الرباعي
    فليس ضرورياً في الطقس الجاف. آخر محطة وقود وآخر صرّاف آلي في ميستيا. اذهب بين مايو وأكتوبر.
