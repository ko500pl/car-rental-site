ka:
  name: ჯვრის უღელტეხილი და მეგობრობის მონუმენტი
  short: >-
    1983 წლის ბეტონის რკალი ეშმაკის ხეობის თავზე, შიგნით ფერადი მოზაიკით, და მის ზემოთ ჯვრის უღელტეხილი
    — სამხედრო გზის უმაღლესი წერტილი, 2379 მეტრი.
  body: >-
    **სამხედრო გზის უმაღლეს წერტილამდე ცოტა ადრე ეშმაკის ხეობის თავზე ბეტონის რკალი გადმოკიდებულა, მის
    შიდა კედელზე კი ორი ქვეყნის ისტორია ფერადი კაფელით ელვარებს.**


    რუსეთ-საქართველოს მეგობრობის მონუმენტი 1983 წელს, გეორგიევსკის ტრაქტატის ორასი წლისთავზე აიგო. 1783
    წლის ამ შეთანხმებით ქართლ-კახეთის სამეფო რუსეთის მფარველობაში შევიდა, თვრამეტი წლის შემდეგ კი, 1801
    წელს, რუსეთის იმპერიამ იგი საერთოდ შეიერთა — ამიტომაც უყურებს ქართველი ამ კედელს ორგვარი გრძნობით.
    მოზაიკა მრგვალი ნაგებობის მთელ წრეს მიუყვება და საქართველოსა და რუსეთის ისტორიის სცენებს გვიხატავს.
    პარაპეტს მიღმა კი მიწა უცებ წყდება: ქვემოთ ეშმაკის ხეობის მწვანე ჯამია, ზაფხულში პარაპლანები თვალის
    სიმაღლეზე დაცურავენ.


    თავად ჯვრის უღელტეხილი, 2379 მეტრი, რამდენიმე კილომეტრით ჩრდილოეთითაა — ფართო უნაგირი, რომლის სამხრეთით
    არაგვი მიედინება, ჩრდილოეთით კი თერგი. ამ გადასასვლელს ანტიკური ხანიდან იცნობდნენ: მას სტრაბონიც იხსენიებს
    და პლინიუს უფროსიც. რუსული ჯარი აქ პირველად 1769 წელს გამოიარა, 1783 წლის ოქტომბერში პავლე პოტიომკინი
    ტფილისში რვაცხენიანი ეტლით ჩამოვიდა, დღევანდელი გზის გაყვანა კი 1799 წელს დაიწყეს. 1914 წელს ბედეკერის
    გზამკვლევი მას მსოფლიოს ერთ-ერთ ყველაზე ლამაზ მთის გზად ასახელებდა და წერდა, რომ ავტობუსები ტფილისიდან
    ვლადიკავკაზამდე ათ საათში ჩადიოდნენ.


    კობისკენ დაშვებისას მინერალურ წყაროებს ფერდები ჟანგისფრად შეუღებავს. ზამთარში სწორედ ეს მონაკვეთი
    იკეტება: თოვლი გზას ზოგჯერ საათობით, ზოგჯერ დღეობით ხურავს და სატვირთოები გუდაურსა და კობთან რიგში
    დგებიან. 2021 წელს კვეშეთსა და კობს შორის 23-კილომეტრიანი შემოვლითი გზის მშენებლობა დაიწყო ხადის ხეობით
    და საძელის მთის ქვეშ გაყვანილი ცხრაკილომეტრიანი გვირაბით, კავკასიაში ყველაზე გრძელით. როცა სატვირთოები
    მთის გულში ჩაეშვებიან, უღელტეხილი მათ დარჩებათ, ვინც აქ ხედისთვის ჩერდება.
  tip: >-
    მონუმენტთან ნახევარი საათი საკმარისია, საათი — თუ უკანა ქედზეც გაივლით. კიდეებს ზოგან მოაჯირი არ აქვს
    და მიწა ფხვიერია: შორს დადექით და ბავშვს ხელი მაგრად მოკიდეთ. ქარგაუმტარი ქურთუკი ნებისმიერ თვეში
    წაიღეთ — აქ თბილისზე გაცილებით ცივა და ქარი თითქმის არ ჩერდება. ავტოსადგომთან ცხენებით, სუვენირებითა
    და პარაპლანის ფრენებით ვაჭრობენ; ტუალეტი მარტივია და ფასიანი. ტურისტული მიკროავტობუსები გვიანი დილიდან
    მოდის, ამიტომ დილით ან საღამოს უფრო მშვიდადაა. ნოემბრიდან აპრილამდე გზის მდგომარეობა გასვლამდე გადაამოწმეთ.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზას (ს3/E117) ჩრდილოეთისკენ გაუყევით ჟინვალის, ანანურის, ფასანაურისა
    და მლეთის გავლით, მერე სერპანტინით გუდაურში ადით; მონუმენტი გუდაურის შემდეგ, უღელტეხილამდე ცოტა ადრე
    დაგხვდებათ. სულ 125 კილომეტრი და კარგ ამინდში დაახლოებით ორი საათი და ოცი წუთი. გზა მთლიანად ასფალტია,
    მაგრამ მლეთა-გუდაურის აღმართზე მძიმე სატვირთოები მიდიან და გასწრების ადგილი ცოტაა. საწვავი ფასანაურსა
    და გუდაურშია. მაისიდან ოქტომბრამდე ეკონომკლასის მანქანა სავსებით საკმარისია; ზამთარში ზამთრის საბურავები,
    საბარგულში ჯაჭვები და მობრუნების მზადყოფნა გჭირდებათ.
en:
  name: Jvari Pass and the Friendship Monument
  short: >-
    A 1983 concrete arc lined with tiled history above the Devil's Valley, just below Jvari Pass, the
    Military Highway's high point at 2,379 metres.
  body: >-
    **Just short of the top of the Georgian Military Highway, a concrete arc hangs over the Devil's Valley,
    and its inner wall blazes with two nations' history in tile.**


    The Russia–Georgia Friendship Monument went up in 1983 for the bicentenary of the Treaty of Georgievsk,
    the 1783 agreement that put the kingdom of Kartli-Kakheti under Russian protection. Eighteen years
    later, in 1801, the Russian Empire annexed the kingdom outright, which is why Georgians regard this
    wall with mixed feelings. The mural runs round the whole circumference of the structure, scenes from
    Georgian and Russian history in bright tile. Step to the parapet and the ground simply stops: below
    lies the green bowl of the valley, and in summer paragliders drift past at eye level.


    Jvari Pass itself, 2,379 metres, lies a few kilometres further north, a broad saddle with the Aragvi
    draining south and the Tergi north. The crossing is ancient: Strabo and Pliny the Elder both knew
    it. Russian troops first marched this way in 1769; by October 1783 Pavel Potemkin could drive into
    Tiflis in a carriage drawn by eight horses; the road you are on was begun in 1799. In 1914 Baedeker
    called it one of the most beautiful mountain roads in the world and reported motor buses making Tiflis
    to Vladikavkaz in ten hours.


    On the descent towards Kobi, mineral springs have stained the slopes rust-orange. This is also the
    stretch that closes in winter, sometimes for hours, sometimes for days, while lorries queue at Gudauri
    and Kobi. In 2021 work began on a 23-kilometre bypass between Kvesheti and Kobi, through the Khada
    valley and a nine-kilometre tunnel under Mount Sadzele, the longest in the Caucasus. When the lorries
    go into the mountain, the pass will be left to the people who stop for the view.
  tip: >-
    Half an hour at the monument is enough, an hour if you also walk the ridge behind it. Some edges have
    no railing and the ground is loose, so keep well back and hold children's hands. Bring a windproof
    jacket in any month: it is far colder than Tbilisi and the wind rarely drops. Horses, souvenir stalls
    and tandem paragliding flights wait by the car park; toilets are basic and paid. Tour minibuses arrive
    from late morning, so early or late in the day is calmer. Between November and April, check the road
    status before you leave.
  route: >-
    From Tbilisi follow the Georgian Military Highway (S3/E117) north through Zhinvali, Ananuri, Pasanauri
    and Mleta, then up the hairpins to Gudauri; the monument is just beyond the resort, short of the pass.
    That is 125 km, about 2 hours 20 minutes in good conditions. The road is asphalt throughout, but the
    Mleta–Gudauri climb carries heavy lorries and offers few places to overtake. Fuel at Pasanauri and
    Gudauri. An economy car is fine from May to October; in winter you need winter tyres, chains in the
    boot and the willingness to turn round.
ru:
  name: Крестовый перевал и монумент Дружбы
  short: >-
    Бетонная арка 1983 года с изразцовой историей над Чёртовой долиной, чуть ниже Крестового перевала
    — высшей точки Военно-Грузинской дороги (2379 м).
  body: >-
    **Не доезжая до высшей точки Военно-Грузинской дороги, над Чёртовой долиной нависает бетонная арка,
    и её внутренняя стена пылает историей двух народов, выложенной в изразцах.**


    Монумент Дружбы России и Грузии поставили в 1983 году к двухсотлетию Георгиевского трактата — соглашения
    1783 года, по которому Картли-Кахетинское царство перешло под протекторат России. Через восемнадцать
    лет, в 1801 году, Российская империя окончательно аннексировала царство, и потому грузины смотрят
    на эту стену со смешанными чувствами. Мозаичное панно тянется по всей окружности сооружения: сцены
    из грузинской и русской истории в ярких изразцах. Подойдите к парапету — и земля просто обрывается:
    внизу лежит зелёная чаша долины, а летом парапланы проплывают мимо на уровне глаз.


    Сам Крестовый перевал, или Джвари, 2379 метров, лежит на несколько километров севернее — широкая седловина,
    с которой Арагви стекает на юг, а Терек (Терги) — на север. Переход этот древний: его знали и Страбон,
    и Плиний Старший. Русские войска впервые прошли здесь в 1769 году; к октябрю 1783-го Павел Потёмкин
    уже мог въехать в Тифлис в карете, запряжённой восьмёркой лошадей; дорогу, по которой вы едете, начали
    строить в 1799 году. В 1914 году Бедекер назвал её одной из красивейших горных дорог мира и сообщал,
    что моторные автобусы проходят путь от Тифлиса до Владикавказа за десять часов.


    На спуске к Коби минеральные источники окрасили склоны в ржаво-оранжевый цвет. Это и есть тот участок,
    который зимой закрывают — иногда на часы, иногда на дни, — пока фуры стоят в очередях в Гудаури и
    Коби. В 2021 году начали строить 23-километровый обход между Квешети и Коби через ущелье Хада и девятикилометровый
    тоннель под горой Садзеле — самый длинный на Кавказе. Когда фуры уйдут в гору, перевал останется тем,
    кто останавливается ради вида.
  tip: >-
    Полчаса у монумента достаточно, час — если пройти ещё и по гребню за ним. Кое-где на краях нет ограждения,
    а грунт осыпается, так что держитесь подальше и не отпускайте руку ребёнка. Ветровку берите в любой
    месяц: здесь гораздо холоднее, чем в Тбилиси, и ветер почти не стихает. У парковки ждут лошади, сувенирные
    лотки и тандемные полёты на параплане; туалеты простые и платные. Туристические микроавтобусы подъезжают
    с конца утра, поэтому рано утром или ближе к вечеру спокойнее. С ноября по апрель проверяйте состояние
    дороги перед выездом.
  route: >-
    Из Тбилиси поезжайте по Военно-Грузинской дороге (S3/E117) на север через Жинвали, Ананури, Пасанаури
    и Млету, затем вверх по серпантину к Гудаури; монумент — сразу за курортом, не доезжая перевала. Это
    125 км, около 2 часов 20 минут в хороших условиях. Асфальт на всём пути, но на подъёме Млета — Гудаури
    много тяжёлых фур и мало мест для обгона. Заправки — в Пасанаури и Гудаури. С мая по октябрь хватит
    машины эконом-класса; зимой нужны зимняя резина, цепи в багажнике и готовность развернуться.
fa:
  name: گردنهٔ جواری و بنای دوستی
  short: >-
    کمانی بتنی از ۱۹۸۳ با تاریخی کاشی‌کاری‌شده بر فراز درهٔ شیطان، اندکی پایین‌تر از گردنهٔ جواری، بلندترین
    نقطهٔ جادهٔ نظامی در ۲۳۷۹ متری.
  body: >-
    **کمی پیش از رسیدن به بلندترین نقطهٔ جادهٔ نظامی گرجستان، کمانی بتنی بر فراز درهٔ شیطان آویخته است
    و دیوار درونی‌اش از تاریخ دو ملت که با کاشی نقش بسته شعله‌ور است.**


    بنای یادبود دوستی روسیه و گرجستان در ۱۹۸۳ به مناسبت دویستمین سالگرد پیمان گئورگیفسک برپا شد، قرارداد
    ۱۷۸۳ که پادشاهی کارتلی-کاختی را زیر حمایت روسیه قرار داد. هجده سال بعد، در ۱۸۰۱، امپراتوری روسیه این
    پادشاهی را یکسره ضمیمهٔ خاک خود کرد، و از همین روست که گرجی‌ها با احساساتی دوگانه به این دیوار می‌نگرند.
    نگاره سراسر پیرامون بنا را در بر می‌گیرد: صحنه‌هایی از تاریخ گرجستان و روسیه با کاشی‌های پررنگ. تا
    کنار جان‌پناه بروید و زمین ناگهان تمام می‌شود: پایین، کاسهٔ سبز دره گسترده است و در تابستان پاراگلایدرها
    هم‌تراز چشمانتان از کنارتان می‌گذرند.


    خود گردنهٔ جواری، با ۲۳۷۹ متر، چند کیلومتر شمالی‌تر است: زینی پهن که آراگوی از آن به جنوب و ترگی به
    شمال سرازیر می‌شود. این گذرگاه کهن است: استرابون و پلینی بزرگ هر دو آن را می‌شناختند. سپاهیان روس
    نخستین بار در ۱۷۶۹ از اینجا گذشتند؛ تا اکتبر ۱۷۸۳ پاول پوتمکین می‌توانست با کالسکه‌ای هشت‌اسبه وارد
    تفلیس شود؛ و ساخت جاده‌ای که بر آن می‌رانید در ۱۷۹۹ آغاز شد. در ۱۹۱۴ راهنمای بدکر آن را یکی از زیباترین
    جاده‌های کوهستانی جهان خواند و گزارش داد که اتوبوس‌های موتوری راه تفلیس تا ولادی‌قفقاز را در ده ساعت
    می‌پیمایند.


    در سرازیری به سوی کوبی، چشمه‌های معدنی دامنه‌ها را به رنگ نارنجیِ زنگ‌زده درآورده‌اند. این همان بخشی
    است که در زمستان بسته می‌شود، گاه چند ساعت و گاه چند روز، و کامیون‌ها در گودائوری و کوبی صف می‌کشند.
    در ۲۰۲۱ ساخت راه کمربندی ۲۳ کیلومتری میان کوِشِتی و کوبی آغاز شد که از درهٔ خادا و تونلی نه‌کیلومتری
    زیر کوه سادزله می‌گذرد، درازترین تونل قفقاز. وقتی کامیون‌ها به دل کوه بروند، گردنه برای کسانی می‌ماند
    که برای تماشا می‌ایستند.
  tip: >-
    نیم ساعت کنار بنا کافی است، و اگر یال پشت آن را هم پیاده بروید یک ساعت. برخی لبه‌ها نرده ندارند و
    زمین سست است، پس فاصلهٔ زیادی نگه دارید و دست کودکان را بگیرید. در هر ماهی بادگیر همراه داشته باشید:
    اینجا بسیار سردتر از تفلیس است و باد به‌ندرت آرام می‌گیرد. کنار پارکینگ اسب‌ها، بساط سوغات‌فروشان
    و پروازهای دونفرهٔ پاراگلایدر منتظرند؛ سرویس‌های بهداشتی ساده و پولی‌اند. مینی‌بوس‌های تور از اواخر
    صبح می‌رسند، پس صبح زود یا اواخر روز آرام‌تر است. میان نوامبر و آوریل، پیش از حرکت وضعیت جاده را بررسی
    کنید.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (S3/E117) را به سوی شمال دنبال کنید، از ژینوالی، آنانوری، پاسانائوری
    و ملتا بگذرید و سپس از پیچ‌های تند تا گودائوری بالا بروید؛ بنای یادبود درست پس از تفرجگاه اسکی و پیش
    از گردنه است. این راه ۱۲۵ کیلومتر است، در شرایط خوب حدود ۲ ساعت و ۲۰ دقیقه. تمام راه آسفالت است، اما
    سربالایی ملتا تا گودائوری پر از کامیون‌های سنگین است و جای سبقت کم دارد. سوخت در پاسانائوری و گودائوری.
    از مه تا اکتبر خودروی کلاس اقتصادی کافی است؛ در زمستان لاستیک زمستانی، زنجیر در صندوق عقب و آمادگی
    برای دور زدن و بازگشتن لازم است.
he:
  name: מעבר ג׳ווארי ואנדרטת הידידות
  short: >-
    קשת בטון משנת 1983 ועליה היסטוריה באריחים, מעל עמק השטן, ממש מתחת למעבר ג׳ווארי, הנקודה הגבוהה ביותר
    של הדרך הצבאית הגאורגית בגובה 2,379 מטר.
  body: >-
    **רגע לפני הנקודה הגבוהה ביותר של הדרך הצבאית הגאורגית, קשת בטון תלויה מעל עמק השטן, וקירה הפנימי
    בוער בהיסטוריה של שני עמים, עשויה אריחים.**


    אנדרטת הידידות רוסיה–גאורגיה הוקמה ב-1983 לציון מאתיים שנה לאמנת גאורגייבסק, ההסכם מ-1783 שהעמיד את
    ממלכת קרתלי-קאחתי תחת חסות רוסית. שמונה-עשרה שנה לאחר מכן, ב-1801, סיפחה האימפריה הרוסית את הממלכה
    לחלוטין, ולכן הגאורגים מביטים בקיר הזה ברגשות מעורבים. פסיפס האריחים מקיף את כל היקף המבנה: סצנות
    מן ההיסטוריה הגאורגית והרוסית באריחים עזי צבע. צעדו אל המעקה והקרקע פשוט נגמרת: למטה משתרעת הקערה
    הירוקה של העמק, ובקיץ מצנחי רחיפה חולפים על פניכם בגובה העיניים.


    מעבר ג׳ווארי עצמו, 2,379 מטר, נמצא כמה קילומטרים צפונה, אוכף רחב שממנו האראגווי מתנקז דרומה והטרגי
    צפונה. המעבר עתיק: סטראבון ופליניוס הזקן הכירו אותו שניהם. כוחות רוסיים עברו כאן לראשונה ב-1769; עד
    אוקטובר 1783 יכול היה פאבל פוטיומקין להיכנס לטיפליס בכרכרה רתומה לשמונה סוסים; והכביש שאתם נוסעים
    בו החל להיבנות ב-1799. ב-1914 כינה אותו מדריך בדקר אחד מכבישי ההרים היפים בעולם, ודיווח על אוטובוסים
    ממונעים שעושים את הדרך מטיפליס לוולדיקבקז בעשר שעות.


    בירידה לכיוון קובי צבעו מעיינות מינרליים את המדרונות בכתום חלוד. זה גם הקטע שנסגר בחורף, לפעמים לשעות
    ולפעמים לימים, בזמן שמשאיות עומדות בתור בגודאורי ובקובי. ב-2021 החלה בניית כביש עוקף באורך 23 קילומטרים
    בין קווישתי לקובי, דרך עמק חאדה ודרך מנהרה של תשעה קילומטרים מתחת להר סאדזלה, הארוכה ביותר בקווקז.
    כשהמשאיות ייכנסו אל תוך ההר, המעבר יישאר לאלה שעוצרים בשביל הנוף.
  tip: >-
    חצי שעה באנדרטה מספיקה, שעה אם תלכו גם לאורך הרכס שמאחוריה. בחלק מן השוליים אין מעקה והקרקע מתפוררת,
    לכן התרחקו מן הקצה והחזיקו ילדים ביד. קחו מעיל חוסם רוח בכל חודש: כאן קר בהרבה מבטביליסי, והרוח כמעט
    אינה שוככת. ליד החניון ממתינים סוסים, דוכני מזכרות וטיסות מצנח רחיפה בזוגות עם מדריך; השירותים בסיסיים
    ובתשלום. מיניבוסים של סיורים מגיעים משעות הבוקר המאוחרות, כך שמוקדם בבוקר או לקראת ערב שקט יותר. בין
    נובמבר לאפריל בדקו את מצב הכביש לפני שאתם יוצאים.
  route: >-
    מטביליסי סעו צפונה בדרך הצבאית הגאורגית (S3/E117) דרך ז׳ינוואלי, אנאנורי, פסנאורי ומלטה, ואז במעלה
    הסרפנטינות לגודאורי; האנדרטה נמצאת מעט אחרי אתר הנופש, לפני המעבר. בסך הכול 125 ק״מ, כשעתיים ועשרים
    דקות בתנאים טובים. הכביש סלול לכל אורכו, אבל בעלייה ממלטה לגודאורי נוסעות משאיות כבדות ויש מעט מקומות
    לעקוף. דלק בפסנאורי ובגודאורי. ממאי עד אוקטובר רכב מקטגוריית אקונומי מספיק; בחורף צריך צמיגי חורף,
    שרשראות בתא המטען ונכונות להסתובב ולחזור.
ar:
  name: ممر جواري ونصب الصداقة
  short: >-
    قوس خرساني من عام 1983 يكسوه تاريخ من البلاط فوق وادي الشيطان، أسفل ممر جواري بقليل، أعلى نقطة في
    الطريق العسكري على ارتفاع 2379 متراً.
  body: >-
    **قبيل أعلى نقطة في الطريق العسكري الجورجي، يتدلّى قوس خرساني فوق وادي الشيطان، وجداره الداخلي يتوهّج
    بتاريخ شعبين مرسوم بالبلاط.**


    أُقيم نصب الصداقة الروسي الجورجي عام 1983 في الذكرى المئوية الثانية لمعاهدة غيورغييفسك، اتفاق عام
    1783 الذي وضع مملكة كارتلي-كاخيتي تحت الحماية الروسية. وبعد ثمانية عشر عاماً، في 1801، ضمّت الإمبراطورية
    الروسية المملكة ضمّاً صريحاً، ولهذا ينظر الجورجيون إلى هذا الجدار بمشاعر متضاربة. تمتد الجدارية على
    محيط البناء كله: مشاهد من التاريخين الجورجي والروسي ببلاط زاهي الألوان. تقدّم إلى الحاجز فتجد الأرض
    تنقطع فجأة: في الأسفل يمتد حوض الوادي الأخضر، وفي الصيف تنساب المظلات الشراعية أمامك على مستوى العين.


    أما ممر جواري نفسه، على ارتفاع 2379 متراً، فيقع على بعد بضعة كيلومترات إلى الشمال، وهو سرج عريض ينحدر
    منه أراغفي جنوباً وتيرغي شمالاً. والعبور هنا قديم: عرفه سترابون وبلينيوس الأكبر كلاهما. وقد سارت القوات
    الروسية في هذا الطريق أول مرة عام 1769؛ وبحلول أكتوبر 1783 كان بوسع بافل بوتيومكين أن يدخل تفليس في
    عربة تجرّها ثمانية خيول؛ أما الطريق الذي تسير عليه فقد بدأ شقّه عام 1799. وفي عام 1914 وصفه دليل بيديكر
    بأنه من أجمل الطرق الجبلية في العالم، وذكر أن حافلات بمحركات تقطع المسافة من تفليس إلى فلاديقوقاز
    في عشر ساعات.


    وفي النزول نحو كوبي، صبغت الينابيع المعدنية المنحدرات بلون برتقالي كلون الصدأ. وهذا أيضاً هو المقطع
    الذي يُغلق في الشتاء، ساعاتٍ أحياناً وأياماً أحياناً أخرى، بينما تصطف الشاحنات في غوداوري وكوبي. وفي
    عام 2021 بدأ العمل على طريق التفافي طوله 23 كيلومتراً بين كفيشيتي وكوبي، يمر عبر وادي خادا وعبر نفق
    طوله تسعة كيلومترات تحت جبل سادزيلي، هو الأطول في القوقاز. وحين تدخل الشاحنات إلى جوف الجبل، سيبقى
    الممر لمن يتوقفون من أجل المنظر.
  tip: >-
    تكفي نصف ساعة عند النصب، وساعة إن مشيت أيضاً على الحَيد الجبلي خلفه. بعض الحواف بلا درابزين والتربة
    مفككة، فابقَ بعيداً عنها وأمسك أيدي الأطفال. احمل سترة واقية من الريح في أي شهر: فالجو هنا أبرد بكثير
    من تبليسي، ونادراً ما تهدأ الريح. عند الموقف تنتظر الخيول وأكشاك التذكارات ورحلات الطيران المظلي المزدوج؛
    ودورات المياه بسيطة وبمقابل. تصل حافلات الجولات الصغيرة من أواخر الصباح، فالهدوء أكبر في الصباح الباكر
    أو آخر النهار. وبين نوفمبر وأبريل، تحقّق من حال الطريق قبل الانطلاق.
  route: >-
    من تبليسي اتبع الطريق العسكري الجورجي (S3/E117) شمالاً عبر جينفالي وأنانوري وباسانائوري ومليتا، ثم
    اصعد المنعطفات الملتوية إلى غوداوري؛ يقع النصب بعد المنتجع مباشرة، قبل بلوغ الممر. المسافة 125 كم،
    نحو ساعتين وعشرين دقيقة في الأحوال الجيدة. الطريق معبّد بالكامل، لكن صعود مليتا–غوداوري تكثر فيه الشاحنات
    الثقيلة وتقلّ أماكن التجاوز. الوقود في باسانائوري وغوداوري. من مايو إلى أكتوبر تكفي سيارة اقتصادية؛
    أما في الشتاء فتحتاج إلى إطارات شتوية، وسلاسل في صندوق السيارة، واستعداد للعودة أدراجك.
