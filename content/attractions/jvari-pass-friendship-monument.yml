ka:
  name: ჯვრის უღელტეხილი და მეგობრობის მონუმენტი
  short: სამხედრო გზის უმაღლესი წერტილი 2379 მეტრზე და 1983 წლის მოზაიკური როტონდა უფსკრულის პირას.
  body: >-
    **გუდაურიდან შვიდი კილომეტრით ზემოთ სამხედრო გზა თავის უმაღლეს წერტილს აღწევს,** უღელტეხილის ქვემოთ
    კი გზის ყველაზე უცნაური ნაგებობა დგას: ნახევარწრიული ბეტონის ტერასა, რომელიც ეშმაკის ხეობის კიდეზეა
    გადმოკიდებული და რომლის შიდა კედელიც მოზაიკითაა დაფარული.


    რუსეთ-საქართველოს მეგობრობის მონუმენტი 1983 წელს აშენდა გეორგიევსკის ტრაქტატის, 1783 წლის ხელშეკრულების,
    ორასი წლისთავზე, რომლითაც ქართლ-კახეთის სამეფო რუსეთის მფარველობაში გადავიდა. თბილისელ მხატვართა ჯგუფის
    მიერ შესრულებული პანო რკალის მთელ სიგრძეზე გადის, ნათელი კრამიტით, და ორი ქვეყნის ისტორიის სცენებს
    გვიჩვენებს, რუსთაველისა და პუშკინის ციტატებით. პოლიტიკურად მონუმენტი ცუდად დაბერდა და ქართველების
    დამოკიდებულება მისდამი რთულია; ვიზუალურად კი მუშაობს, რადგან პარაპეტს მიღმა რამდენიმე ასეული მეტრი
    პირდაპირ მწვანე ხეობის თასში ეშვება.


    თავად ჯვრის უღელტეხილი, 2379 მეტრი, რამდენიმე კილომეტრით ჩრდილოეთითაა და ბევრად ნაკლებად ეფექტურია
    — ფართო უნაგირი მიმანიშნებელი ქვით, წყალგამყოფი სამხრეთით მიმავალ არაგვსა და ჩრდილოეთით მიმავალ თერგს
    შორის. ირგვლივ ის დგას, რაც უღელტეხილს ამუშავებს: საბჭოთა პერიოდის ბეტონის ზვავსაცავი გალერეები, თოვლის
    ბოძები და კობისკენ დაშვებაზე ტრავერტინის ტერასები და მინერალური წყაროები, სადაც რკინიანმა წყალმა მთელი
    ფერდობები ნარინჯისფრად შეღება.


    სწორედ ეს მონაკვეთი იკეტება. ნოემბრიდან აპრილამდე უღელტეხილზე გზა ძლიერი თოვის დროს გაფრთხილების გარეშე
    იხურება, ზოგჯერ საათებით, ზოგჯერ ორი-სამი დღით, ტვირთმზიდები კი გუდაურსა და კობში რიგებში დგანან.
    აქვე იცვლება ამინდიც: თბილისში მზეა, ფასანაურში წვიმს, აქ კი თეთრი ბურუსია. ამჟამად მშენებარე გვირაბი
    სწორედ ამ მონაკვეთის შემოსავლელადაა ჩაფიქრებული.
  tip: >-
    მონუმენტთან ოცი წუთი საკმარისია, ერთი საათი — თუ უკან ქედზეც გაივლი. ზოგან კიდეზე ბარიერი არ არის
    და გრუნტი ფხვიერია: შორს დადექი და ბავშვს ხელი უჭირე. ქარგაუმტარი ქურთუკი ნებისმიერ თვეში წაიღე —
    აქ თბილისზე თხუთმეტი გრადუსით ცივი შეიძლება იყოს და ქარი მუდმივია. პარკინგის გვერდიდან პარაპლანები
    ფრინავენ, ფოტოსთვის კი ცხენები და სუვენირების ფურგონები დგას. ტუალეტი მარტივია და ფასიანი. ზამთარში
    თბილისიდან გამოსვლამდე გზის სტატუსი გადაამოწმე.
  route: >-
    საქართველოს სამხედრო გზა (E117) თბილისიდან მცხეთაზე, ანანურზე, ფასანაურსა და მლეთაზე გადის, შემდეგ
    სერპანტინით გუდაურამდე და უღელტეხილამდე ადის — 125 კმ, კარგ პირობებში დაახლოებით ორი საათი და ოცი
    წუთი. გზა ასფალტია და საკმარისად განიერი, მაგრამ მლეთა-გუდაურის მონაკვეთი უწყვეტი აღმართია მძიმე ტვირთმზიდებით
    და გამოსასწრები ადგილის გარეშე. საწვავი ფასანაურსა და გუდაურშია. მაისიდან ოქტომბრამდე ეკონომ-კლასის
    მანქანა საკმარისია; ზამთარში საჭიროა ზამთრის საბურავები, ჯაჭვები საბარგულში და მზადყოფნა, რომ უკან
    გამობრუნდე.
en:
  name: Jvari Pass and the Friendship Monument
  short: The high point of the Military Highway at 2,379 metres, with a 1983 mosaic rotunda hung over
    a sheer drop.
  body: >-
    **Seven kilometres above Gudauri the Military Highway reaches its top,** and just below the summit
    stands the strangest structure on the road: a semicircular concrete terrace hanging over the edge
    of the Devil's Valley, its inner wall covered in a tiled mural.


    The Russia–Georgia Friendship Monument was built in 1983 for the two-hundredth anniversary of the
    Treaty of Georgievsk, the 1783 agreement that placed the kingdom of Kartli-Kakheti under Russian protection.
    The mural, by a team of Tbilisi artists, runs the length of the curve in bright tile and shows scenes
    from the two countries' histories with quotations from Rustaveli and Pushkin. Politically the monument
    has aged badly and Georgians have complicated feelings about it; visually it works, because behind
    the parapet the ground falls several hundred metres straight into a green bowl of a valley.


    Jvari Pass itself, 2,379 metres, is a few kilometres further north and far less dramatic: a broad
    saddle with a marker, the watershed between the Aragvi running south and the Tergi running north.
    Around it stand the things that make the pass function — concrete avalanche galleries from the Soviet
    period, snow poles, and on the descent towards Kobi the travertine terraces and mineral springs, where
    iron-rich water has stained whole slopes orange.


    This is the section of the Military Highway that closes. Between November and April the road over
    the pass is shut without warning in heavy snow, sometimes for hours, sometimes for two or three days,
    and lorries queue at Gudauri and Kobi. It is also where the weather changes: sun in Tbilisi, rain
    at Pasanauri and a whiteout here. A tunnel scheme now under construction is intended to bypass this
    stretch.
  tip: >-
    Twenty minutes at the monument is enough, an hour if you also walk the ridge behind it. Some of the
    edges have no barrier and the ground is loose, so keep well back and keep children in hand. Bring
    a windproof jacket in any month; it can be fifteen degrees colder than Tbilisi and the wind is constant.
    Paragliders launch from beside the car park, and horses and souvenir vans wait for photographs. Toilets
    are basic and paid. In winter, check the road status before you leave Tbilisi.
  route: >-
    The Georgian Military Highway (E117) runs from Tbilisi through Mtskheta, Ananuri, Pasanauri and Mleta,
    then climbs the switchbacks to Gudauri and on to the pass — 125 km, about two hours twenty in good
    conditions. The road is asphalt and wide enough, but the Mleta–Gudauri section is a sustained climb
    with heavy lorry traffic and no room to overtake. Fuel at Pasanauri and Gudauri. An economy car is
    fine from May to October; in winter you want winter tyres, chains in the boot and a willingness to
    turn around.
ru:
  name: Крестовый перевал и монумент Дружбы
  short: Высшая точка Военно-Грузинской дороги на 2379 метрах и мозаичная ротонда 1983 года, повисшая
    над обрывом.
  body: >-
    **В семи километрах выше Гудаури Военно-Грузинская дорога выходит на свою вершину,** и чуть ниже перевала
    стоит самое странное сооружение на всей трассе: полукруглая бетонная терраса, нависшая над краем Чёртовой
    долины, с мозаикой на внутренней стене.


    Монумент дружбы России и Грузии построен в 1983 году к двухсотлетию Георгиевского трактата — договора
    1783 года, по которому Картли-Кахетинское царство перешло под российское покровительство. Панно, сделанное
    группой тбилисских художников, идёт по всей дуге яркой плиткой и показывает сцены из истории обеих
    стран с цитатами из Руставели и Пушкина. Политически памятник состарился плохо, и отношение грузин
    к нему непростое; визуально он работает, потому что за парапетом земля обрывается на несколько сотен
    метров прямо в зелёную чашу ущелья.


    Сам Крестовый перевал, 2379 метров, находится в нескольких километрах севернее и куда менее эффектен:
    широкое седло с указателем, водораздел между Арагви, текущей на юг, и Тереком, текущим на север. Вокруг
    стоит то, что заставляет перевал работать, — бетонные противолавинные галереи советского времени,
    снегомерные вехи, а на спуске к Коби травертиновые террасы и минеральные источники, где железистая
    вода окрасила целые склоны в оранжевый.


    Именно этот участок и закрывается. С ноября по апрель дорогу через перевал перекрывают без предупреждения
    при сильном снегопаде — иногда на часы, иногда на два-три дня, а фуры стоят в очередях в Гудаури и
    Коби. Здесь же меняется погода: в Тбилиси солнце, в Пасанаури дождь, а тут белая мгла. Строящийся
    сейчас тоннель как раз и должен обойти этот отрезок.
  tip: >-
    Двадцати минут у монумента достаточно, часа — если пройтись и по хребту за ним. Кое-где у края нет
    ограждения, а грунт сыпучий: держитесь подальше и не отпускайте детей. Ветровку берите в любой месяц
    — здесь бывает на пятнадцать градусов холоднее, чем в Тбилиси, и ветер постоянный. Рядом со стоянкой
    стартуют парапланы, для фотографий ждут лошади и фургоны с сувенирами. Туалеты простые и платные.
    Зимой уточняйте состояние дороги ещё до выезда из Тбилиси.
  route: >-
    Военно-Грузинская дорога (E117) идёт из Тбилиси через Мцхету, Ананури, Пасанаури и Млету, затем поднимается
    серпантином к Гудаури и дальше на перевал — 125 км, около двух часов двадцати при хороших условиях.
    Покрытие асфальтовое и достаточно широкое, но участок Млета–Гудаури — сплошной подъём с тяжёлыми фурами
    и без места для обгона. Заправки в Пасанаури и Гудаури. С мая по октябрь хватит машины эконом-класса;
    зимой нужны зимние шины, цепи в багажнике и готовность развернуться.
fa:
  name: گردنهٔ جواری و بنای دوستی
  short: بلندترین نقطهٔ بزرگراه نظامی در 2379 متر، با روتوندی موزاییکی از 1983 که بر پرتگاهی آویخته است.
  body: >-
    **هفت کیلومتر بالاتر از گودائوری، بزرگراه نظامی به بلندترین نقطهٔ خود می‌رسد،** و اندکی زیر گردنه
    عجیب‌ترین سازهٔ این جاده ایستاده است: مصطبه‌ای نیم‌دایره از بتن که بر لبهٔ درهٔ شیطان آویخته و دیوار
    درونی‌اش را موزاییک پوشانده است.


    بنای دوستی روسیه و گرجستان در 1983 برای دویستمین سالگرد پیمان گئورگیفسک ساخته شد، همان قرارداد 1783
    که پادشاهی کارتلی-کاختی را زیر حمایت روسیه برد. نگارهٔ کاشی، کار گروهی از هنرمندان تفلیس، تمام درازای
    قوس را با رنگ‌های روشن می‌پوشاند و صحنه‌هایی از تاریخ دو کشور را با نقل‌قول‌هایی از روستاولی و پوشکین
    نشان می‌دهد. از نظر سیاسی این بنا بد کهنه شده و احساس گرجی‌ها نسبت به آن پیچیده است؛ اما از نظر دیداری
    کار می‌کند، چون پشت جان‌پناه، زمین چند صد متر یکراست در کاسه‌ای سبز از دره فرو می‌ریزد.


    خود گردنهٔ جواری با 2379 متر چند کیلومتر شمالی‌تر است و بسیار کم‌نمایش‌تر: زینی پهن با نشانه‌ای سنگی،
    آبخیزگاه میان آراگوی که به جنوب می‌رود و ترگی که به شمال. پیرامون آن چیزهایی است که گردنه را کار می‌اندازد:
    دالان‌های بتنی ضدبهمن از دورهٔ شوروی، تیرک‌های برف، و در سرازیری به سوی کوبی، مصطبه‌های تراورتن و
    چشمه‌های معدنی که آب آهن‌دار دامنه‌های کامل را نارنجی کرده است.


    همین مقطع است که بسته می‌شود. از آبان تا فروردین، جادهٔ روی گردنه در برف سنگین بی‌هیچ هشداری بسته
    می‌شود، گاه چند ساعت و گاه دو سه روز، و کامیون‌ها در گودائوری و کوبی صف می‌کشند. هوا هم همین‌جا عوض
    می‌شود: آفتاب در تفلیس، باران در پاسانائوری و سفیدی مطلق در اینجا. طرح تونلی که اکنون در دست ساخت
    است قرار است همین بخش را دور بزند.
  tip: >-
    بیست دقیقه کنار بنا کافی است و یک ساعت اگر یال پشت آن را هم قدم بزنید. برخی لبه‌ها حفاظ ندارد و زمین
    سست است، پس فاصله نگه دارید و دست کودکان را رها نکنید. در هر ماهی کاپشن بادگیر بردارید؛ اینجا می‌تواند
    پانزده درجه از تفلیس سردتر باشد و باد پیوسته است. کنار پارکینگ چترهای پروازی برمی‌خیزند و برای عکس،
    اسب‌ها و وانت‌های سوغات ایستاده‌اند. سرویس بهداشتی ساده است و پولی. در زمستان پیش از خروج از تفلیس
    وضعیت جاده را بپرسید.
  route: >-
    بزرگراه نظامی گرجستان (E117) از تفلیس و از متسختا و آنانوری و پاسانائوری و ملتا می‌گذرد، سپس با پیچ‌های
    تند تا گودائوری و از آنجا تا گردنه بالا می‌رود — 125 کیلومتر و در شرایط خوب نزدیک دو ساعت و بیست دقیقه.
    جاده آسفالت است و به قدر کافی پهن، اما مقطع ملتا تا گودائوری سربالایی پیوسته‌ای است با کامیون‌های
    سنگین و بدون فضای سبقت. سوخت در پاسانائوری و گودائوری هست. از اردیبهشت تا مهر خودروی اقتصادی بس است؛
    در زمستان لاستیک زمستانی و زنجیر در صندوق و آمادگی برای بازگشت لازم است.
he:
  name: מעבר ג׳ווארי ואנדרטת הידידות
  short: הנקודה הגבוהה של כביש הצבא בגובה 2,379 מטר, ולידה רוטונדת פסיפס מ-1983 התלויה מעל תהום.
  body: >-
    **שבעה קילומטרים מעל גודאורי מגיע כביש הצבא לשיאו,** ומעט מתחת למעבר ניצב המבנה המוזר ביותר על הכביש:
    מרפסת בטון חצי-עגולה התלויה מעל שפת עמק השטן, וקירה הפנימי מכוסה פסיפס.


    אנדרטת הידידות בין רוסיה לגאורגיה הוקמה ב-1983 לציון מאתיים שנה לאמנת גאורגייבסק, ההסכם מ-1783 שהעביר
    את ממלכת קרתלי-קאחתי לחסות רוסית. ציור הקיר, מעשה קבוצת אמנים מטביליסי, נמתח לאורך כל הקשת באריחים
    בהירים ומציג סצנות מתולדות שתי המדינות עם ציטוטים מרוסתאוולי ומפושקין. מבחינה פוליטית האנדרטה הזדקנה
    רע ורגשות הגאורגים כלפיה מורכבים; מבחינה חזותית היא עובדת, כי מאחורי המעקה צונחת הקרקע כמה מאות מטרים
    היישר אל קערה ירוקה של עמק.


    מעבר ג׳ווארי עצמו, 2,379 מטר, נמצא כמה קילומטרים צפונה והוא דרמטי הרבה פחות: אוכף רחב עם שלט, קו פרשת
    המים בין האראגווי הזורם דרומה לבין הטרגי הזורם צפונה. סביבו עומדים הדברים שמאפשרים למעבר לתפקד: מנהרות
    בטון נגד מפולות שלג מן התקופה הסובייטית, מוטות שלג, ובמורד לכיוון קובי מדרגות טרוורטין ומעיינות מינרליים,
    שבהם צבעו מים עתירי ברזל מדרונות שלמים בכתום.


    זהו הקטע של כביש הצבא שנסגר. בין נובמבר לאפריל נחסם הכביש מעל המעבר בלי התראה בשלג כבד, לפעמים לשעות
    ולפעמים ליומיים-שלושה, ומשאיות עומדות בתורים בגודאורי ובקובי. כאן גם מתחלף מזג האוויר: שמש בטביליסי,
    גשם בפסנאורי ולבן מוחלט כאן. פרויקט מנהרה שנמצא כעת בבנייה נועד לעקוף את הקטע הזה.
  tip: >-
    עשרים דקות באנדרטה מספיקות, שעה אם תלכו גם על הרכס שמאחוריה. בחלק מן השוליים אין מעקה והקרקע תחוחה,
    אז הישארו מרחוק והחזיקו ילדים ביד. קחו מעיל אטום לרוח בכל חודש; כאן יכול להיות קר בחמש עשרה מעלות
    מטביליסי והרוח קבועה. גלשני רחיפה ממריאים ליד החניון, וסוסים ורכבי מזכרות ממתינים לצילומים. השירותים
    בסיסיים ובתשלום. בחורף בררו את מצב הכביש עוד לפני היציאה מטביליסי.
  route: >-
    כביש הצבא הגאורגי (E117) עובר מטביליסי דרך מצחתה, אנאנורי, פסנאורי ומלטה, ואז מטפס בסיבובים לגודאורי
    ומשם למעבר — 125 ק״מ, כשעתיים ועשרים בתנאים טובים. הכביש סלול ורחב דיו, אך קטע מלטה-גודאורי הוא עלייה
    רצופה עם משאיות כבדות ובלי מקום לעקוף. דלק בפסנאורי ובגודאורי. ממאי עד אוקטובר רכב חסכוני מספיק; בחורף
    דרושים צמיגי חורף, שרשראות בתא המטען ונכונות לחזור לאחור.
ar:
  name: ممر جواري ونصب الصداقة
  short: أعلى نقطة في الطريق العسكري عند 2379 متراً، وإلى جانبها رواق فسيفسائي من 1983 معلق فوق هاوية.
  body: >-
    **على بعد سبعة كيلومترات فوق غودااوري يبلغ الطريق العسكري ذروته،** وتحت الممر بقليل يقوم أغرب بناء
    على هذا الطريق: مصطبة خرسانية نصف دائرية معلقة على حافة وادي الشيطان، جدارها الداخلي مكسوّ بالفسيفساء.


    أُقيم نصب الصداقة بين روسيا وجورجيا عام 1983 بمناسبة مرور مئتي عام على معاهدة غيورغييفسك، اتفاق 1783
    الذي وضع مملكة كارتلي-كاخيتي تحت الحماية الروسية. والجدارية، وهي عمل مجموعة من فناني تبليسي، تمتد
    على طول القوس ببلاط زاهٍ وتعرض مشاهد من تاريخ البلدين مع اقتباسات من روستافيلي وبوشكين. سياسياً شاخ
    النصب شيخوخة سيئة ومشاعر الجورجيين نحوه معقدة؛ أما بصرياً فهو ناجح، لأن الأرض خلف الحاجز تهوي مئات
    الأمتار مباشرة في جوف أخضر من الوادي.


    أما ممر جواري نفسه، على 2379 متراً، فيقع شمالاً ببضعة كيلومترات وهو أقل إثارة بكثير: سرج عريض عليه
    علامة، وخط تقسيم المياه بين أراغفي الجاري جنوباً وتيرغي الجاري شمالاً. وحوله ما يجعل الممر صالحاً
    للعمل: أروقة خرسانية مضادة للانهيارات الثلجية من الحقبة السوفييتية، وأعمدة قياس الثلج، وفي الهبوط
    نحو كوبي مصاطب الترافرتين والينابيع المعدنية حيث صبغ الماء الغني بالحديد منحدرات كاملة بالبرتقالي.


    وهذا هو المقطع الذي يُغلق من الطريق العسكري. فبين تشرين الثاني ونيسان يُقفل الطريق فوق الممر دون إنذار
    عند تساقط الثلج الكثيف، ساعاتٍ أحياناً ويومين أو ثلاثة أحياناً أخرى، وتصطف الشاحنات في غودااوري وكوبي.
    وهنا أيضاً يتبدل الطقس: شمس في تبليسي، ومطر في باسانائوري، وبياض تام هنا. ومشروع النفق الجاري تنفيذه
    الآن يهدف إلى تجاوز هذا القسم.
  tip: >-
    عشرون دقيقة عند النصب تكفي، وساعة إن مشيت أيضاً على السلسلة خلفه. بعض الحواف بلا حاجز والتربة هشة،
    فابقَ بعيداً وأمسك أيدي الأطفال. واحمل سترة صادّة للريح في أي شهر؛ فقد تكون الحرارة هنا أقل بخمس عشرة
    درجة من تبليسي والريح لا تهدأ. وتنطلق الطائرات الشراعية من جانب الموقف، وتنتظر الخيول وعربات التذكارات
    من أجل الصور. ودورات المياه بسيطة وبمقابل. وفي الشتاء تحقق من حال الطريق قبل مغادرة تبليسي.
  route: >-
    يمتد الطريق العسكري الجورجي (E117) من تبليسي عبر متسخيتا وأنانوري وباسانائوري ومليتا، ثم يصعد بالمنعطفات
    إلى غودااوري ومنها إلى الممر — 125 كم، ونحو ساعتين وعشرين دقيقة في الأحوال الجيدة. الطريق معبّد وعريض
    بما يكفي، لكن مقطع مليتا-غودااوري صعود متواصل بشاحنات ثقيلة وبلا مجال للتجاوز. الوقود في باسانائوري
    وغودااوري. ومن أيار إلى تشرين الأول تكفي سيارة اقتصادية؛ أما في الشتاء فتلزم إطارات شتوية وسلاسل في
    الصندوق واستعداد للعودة أدراجك.
