ka:
  name: ოზურგეთის ალ. წუწუნავას სახელობის სახელმწიფო დრამატული თეატრი
  short: >-
    ქალაქის ბაღში აღმართული თეთრი ნეოკლასიკური გიგანტი: დაიწყეს 1934-ში, დაასრულეს 1962-ში, აღადგინეს
    2020-ში — 750-ადგილიანი დარბაზით და მბრუნავი სცენით.
  body: >-
    **ოზურგეთს თავისი თეატრის აშენებას ოცდარვა წელი, ორი ხანგრძლივი შეჩერება და ერთი შეცვლილი გეგმა დასჭირდა
    — სამაგიეროდ, ქალაქმა საქართველოს ერთ-ერთი უდიდესი სათეატრო შენობა მიიღო.**


    ქალაქის სცენა შენობაზე გაცილებით ძველია. ოზურგეთის თეატრი თავის ისტორიას 1868 წლის მარტში გამართული
    საქველმოქმედო წარმოდგენიდან ითვლის. 1893 წელს ქალაქში ამერიკული ცირკი ჩამოვიდა და მთელი წელი დარჩა.
    სანახაობამ თორმეტი წლის ალექსანდრე წუწუნავა ისე მოხიბლა, რომ მან და მისმა მეგობრებმა არტისტობა გადაწყვიტეს;
    1895 წელს ის უკვე ადგილობრივ სცენისმოყვარეთა წრეს ედგა სათავეში. 1881 წელს ახლომდებარე ლიხაურში დაბადებულმა
    წუწუნავამ რეჟისურა მოსკოვში, სტანისლავსკისთან შეისწავლა, 1919 წელს თბილისში ზაქარია ფალიაშვილის ახალი
    ოპერა „აბესალომ და ეთერი“ დადგა და ქართული კინოს ერთ-ერთი ფუძემდებელი გახდა — მისმა მუნჯმა ფილმმა
    „ჯანყი გურიაში“ (1928) გურია ეკრანზე გამოიყვანა. თეატრი 1968 წლიდან მის სახელს ატარებს.


    ახლანდელი შენობის მშენებლობა 1934–1935 წლებში, ქალაქის ბაღში, ვანო ქადიეშვილის პროექტით დაიწყო. 1937
    წელს სამუშაოები შეწყდა, 1949 წელს კოტე ჩხეიძის გადამუშავებული პროექტით განახლდა, 1952 წელს ისევ შეჩერდა,
    1955 წელს კი უკვე ჩაის მრეწველობის მუშაკთა კულტურის სახლად გაგრძელდა. შენობა 1962 წელს დასრულდა. გარედან
    ის საბჭოთა სამოსში გამოწყობილ ბერძნულ ტაძარს ჰგავს: მაღალი თაღები, გრანიტის ზეძირკველზე აყვანილი თეთრი
    ქვის კედლები. შიგნით 750-ადგილიანი დარბაზი ნახევარწრიული პარტერიდან ლოჟებიან ორ იარუსად ადის, აპოლონ
    ქუთათელაძის მოხატული ჭერისკენ; ოცი მეტრი სიგრძისა და სიგანის, თვრამეტი მეტრი სიმაღლის სცენის შუაგულში
    კი 13-მეტრიანი მბრუნავი წრეა ჩაშენებული.


    2017 წელს შენობას კულტურის ძეგლის სტატუსი მიენიჭა; 2016–2020 წლებში ის ფონდ „ქართუს“ დაფინანსებით,
    18 მილიონ ლარად აღადგინეს. თუ შეძლებთ, სპექტაკლზე მოდით: დარბაზი, რომელიც ამდენ ხანს ელოდა, ანთებული
    შუქით უნდა ნახოთ.
  tip: >-
    ფასადისა და წუწუნავას ძეგლის ნახვა ნებისმიერ დროს, უფასოდ შეიძლება; შიგნით კი, როგორც წესი, მხოლოდ
    სპექტაკლზე შეხვალთ, ამიტომ რეპერტუარი წინასწარ ნახეთ და, თუ რამე იდგმება, ბილეთი იყიდეთ — დარბაზი
    ამად ნამდვილად ღირს. სპექტაკლებს შორის დამთვალიერებლისთვის აქ არაფერია მოწყობილი. მანქანა ახლომდებარე
    ქუჩებში გააჩერეთ. ისტორიული მუზეუმი ორიოდე წუთის სავალზეა; თეატრის პირდაპირ, პოლიციის ავტოსადგომის
    უკან, უწარწერო, ძლივს შესამჩნევი საძირკვლებია — აბანოსი, რომელიც, როგორც ფიქრობენ, გურიელ მთავრებს
    ემსახურებოდა. ერთი კვარტლით ჩრდილოეთით პლატანების ბაღია.
  route: >-
    ოზურგეთამდე თბილისიდან 300 კილომეტრია, დაახლოებით 4 საათი და 50 წუთი, მთელ გზაზე ასფალტით. E60-ით
    (ს1) დასავლეთისკენ იარეთ — ხაშურის, რიკოთის მონაკვეთისა და ზესტაფონის გავლით, ქუთაისის გვერდის ავლით
    სამტრედიამდე. იქ ს12-ზე ლანჩხუთისკენ გადადით, ლანჩხუთის შემდეგ კი ადგილობრივი გზებით და შ2-ით ოზურგეთამდე
    ჩადით — სამტრედიიდან დაახლოებით 50 კილომეტრია, გურიის მწვანე, თხილით დაფარული დაბლობის გავლით. თეატრი
    ცენტრში, რუსთაველის ქუჩაზე დგას — მის თაღებს ვერ გამოტოვებთ. საწვავი ხაშურში, ზესტაფონში, სამტრედიაში
    ან თავად ოზურგეთში ჩაასხით. ნებისმიერი ეკონომ კლასის მანქანა გამოგადგებათ.
en:
  name: Ozurgeti Drama Theatre (Alexandre Tsutsunava State Drama Theatre)
  short: >-
    A white neoclassical giant in the town garden — begun in 1934, finished in 1962, restored in 2020
    — with a 750-seat hall and a revolving stage.
  body: >-
    **It took Ozurgeti twenty-eight years, two long halts and a change of plan to finish its theatre —
    and the town got one of the largest stage houses in Georgia.**


    The town's stage is older than its building. Ozurgeti dates its theatre from a charity performance
    in March 1868. In 1893 an American circus came to town and stayed a whole year; it so dazzled a twelve-year-old
    named Alexandre Tsutsunava that he and his friends resolved to become performers, and by 1895 he was
    leading the local amateur troupe. Born in nearby Likhauri in 1881, Tsutsunava learnt directing from
    Stanislavski in Moscow, staged Zakaria Paliashvili's new opera *Abesalom and Eteri* in Tbilisi in
    1919 and became one of the founders of Georgian cinema — his silent *Revolt in Guria* (1928) put this
    province on screen. The theatre has carried his name since 1968.


    The present building was begun in 1934–35 in the town garden, to a design by Vano Kadieshvili. Work
    stopped in 1937, resumed in 1949 on a revised design by Kote Chkheidze, stopped again in 1952 and
    restarted in 1955 — now as a house of culture for the tea industry's workers. It was finished in 1962.
    Outside, it is a Greek temple in Soviet dress: tall arches, white stone walls on a granite base. Inside,
    750 seats rise from semicircular stalls into two tiers of boxes beneath a ceiling painted by Apollon
    Kutateladze, and set into the stage — twenty metres by twenty, eighteen high — is a revolving circle
    13 metres across.


    Listed as a cultural monument in 2017, the building was restored between 2016 and 2020 for 18 million
    lari, paid by the Cartu Foundation. Come for a performance if you can: a hall that waited this long
    deserves to be seen with the lights on.
  tip: >-
    The façade and Tsutsunava's statue are free to see at any hour; the interior normally opens only for
    performances, so check the programme and buy a ticket if anything is on — the hall is worth it even
    without a word of Georgian. Between shows there are no visitor facilities. Park in the side streets.
    The History Museum is a couple of minutes' walk away; directly opposite the theatre, behind the police
    car park, lie the unsigned, easily missed foundations of a bathhouse thought to have served the Gurieli
    princes, and the Platanus Garden is a block further north.
  route: >-
    Ozurgeti is 300 km from Tbilisi, about 4 hours 50 minutes, on asphalt all the way. Take the E60 (S1)
    west past Khashuri, through the Rikoti section and past Zestaponi and Kutaisi to Samtredia. There
    switch to the S12 towards Lanchkhuti, and beyond Lanchkhuti follow local roads and the Sh2 into Ozurgeti
    — about 50 km from Samtredia across Guria's green, hazel-planted lowland. The theatre stands on Rustaveli
    Street in the centre; you cannot miss its arches. Fuel up at Khashuri, Zestaponi, Samtredia or in
    Ozurgeti itself. Any economy car will do.
ru:
  name: Озургетский драматический театр (Государственный драматический театр имени Александра Цуцунава)
  short: >-
    Белый неоклассический гигант в городском саду — начат в 1934-м, достроен в 1962-м, отреставрирован
    в 2020-м — с залом на 750 мест и вращающейся сценой.
  body: >-
    **Чтобы достроить свой театр, Озургети понадобилось двадцать восемь лет, две долгие остановки и один
    пересмотренный проект — зато город получил одно из самых больших театральных зданий Грузии.**


    Сцена в городе старше здания. Свой театр Озургети отсчитывает от благотворительного спектакля в марте
    1868 года. В 1893 году в город приехал американский цирк и задержался на целый год; двенадцатилетнего
    Александра Цуцунава он так поразил, что мальчик с друзьями решили стать артистами, а к 1895 году он
    уже возглавлял местную любительскую труппу. Цуцунава, родившийся в 1881 году в соседнем Лихаури, учился
    режиссуре у Станиславского в Москве, в 1919 году поставил в Тбилиси новую оперу Захария Палиашвили
    «Абесалом и Этери» и стал одним из основателей грузинского кино — его немой фильм «Восстание в Гурии»
    (1928) вывел этот край на экран. Театр носит его имя с 1968 года.


    Нынешнее здание начали строить в 1934–1935 годах в городском саду по проекту Вано Кадиешвили. В 1937
    году работы остановились, в 1949-м возобновились по переработанному проекту Коте Чхеидзе, в 1952-м
    снова замерли и в 1955-м пошли дальше — теперь уже как дом культуры работников чайной промышленности.
    Закончили его в 1962 году. Снаружи это греческий храм в советском костюме: высокие арки, белые каменные
    стены на гранитном цоколе. Внутри 750 мест поднимаются от полукруглого партера к двум ярусам лож,
    под плафон, расписанный Аполлоном Кутателадзе, а в сцену — двадцать на двадцать метров и восемнадцать
    в высоту — встроен поворотный круг диаметром 13 метров.


    В 2017 году здание получило статус памятника культуры; в 2016–2020 годах его отреставрировали за 18
    миллионов лари на средства фонда «Карту». Если получится, приходите на спектакль: зал, который так
    долго ждал, нужно увидеть при зажжённом свете.
  tip: >-
    Фасад и памятник Цуцунава можно посмотреть бесплатно в любое время; внутрь обычно пускают только на
    спектакли, так что загляните в афишу и, если что-то идёт, купите билет — зал того стоит, даже если
    вы не знаете ни слова по-грузински. Между спектаклями никакой инфраструктуры для посетителей нет.
    Машину оставьте на соседних улицах. Исторический музей — в паре минут ходьбы; прямо напротив театра,
    за парковкой полиции, лежат не отмеченные табличкой, легко ускользающие от взгляда фундаменты бани,
    которая, как считается, служила князьям Гуриели, а кварталом севернее — Платановый сад.
  route: >-
    Озургети — в 300 км от Тбилиси, около 4 часов 50 минут, асфальт на всём пути. Поезжайте по E60 (S1)
    на запад мимо Хашури, через Рикотский участок, мимо Зестафони и Кутаиси до Самтредиа. Там переходите
    на S12 в сторону Ланчхути, а за Ланчхути по местным дорогам и Sh2 доберётесь до Озургети — около 50
    км от Самтредиа через зелёную, засаженную фундуком низменность Гурии. Театр стоит в центре, на улице
    Руставели; его арки не пропустите. Заправиться можно в Хашури, Зестафони, Самтредиа или в самом Озургети.
    Подойдёт любой автомобиль эконом-класса.
fa:
  name: تئاتر درام اوزورگتی (تئاتر دولتی درام الکساندر تسوتسوناوا)
  short: >-
    غولی سفید و نئوکلاسیک در باغ شهر — آغاز در ۱۹۳۴، پایان در ۱۹۶۲، مرمت در ۲۰۲۰ — با تالاری ۷۵۰ نفره
    و صحنه‌ای گردان.
  body: >-
    **اوزورگتی برای به پایان رساندن تئاترش بیست و هشت سال، دو توقف طولانی و یک طرح دگرگون‌شده را از سر
    گذراند — و در عوض یکی از بزرگ‌ترین ساختمان‌های تئاتر گرجستان نصیبش شد.**


    صحنه‌ی شهر از ساختمانش قدیمی‌تر است. اوزورگتی آغاز تئاترش را اجرایی خیریه در مارس ۱۸۶۸ می‌داند. در
    ۱۸۹۳ سیرکی آمریکایی به شهر آمد و یک سال تمام ماند؛ و الکساندر تسوتسوناوای دوازده‌ساله را چنان مسحور
    کرد که او و دوستانش تصمیم گرفتند بازیگر شوند، و تا ۱۸۹۵ او سرپرستی گروه آماتور محلی را بر عهده داشت.
    تسوتسوناوا که در ۱۸۸۱ در لیخائوری، روستایی در همان نزدیکی، به دنیا آمده بود، کارگردانی را در مسکو
    نزد استانیسلاوسکی آموخت، در ۱۹۱۹ اپرای تازه‌ی زاکاریا پالیاشویلی، «آبسالوم و اتری»، را در تفلیس به
    صحنه برد و از بنیان‌گذاران سینمای گرجستان شد — فیلم صامتش، «شورش در گوریا» (۱۹۲۸)، این ولایت را به
    پرده‌ی سینما آورد. تئاتر از ۱۹۶۸ نام او را بر خود دارد.


    ساخت بنای کنونی در ۱۹۳۴–۱۹۳۵ در باغ شهر و بر پایه‌ی طرح وانو قادیشویلی آغاز شد. کار در ۱۹۳۷ متوقف
    شد، در ۱۹۴۹ با طرح بازنگری‌شده‌ی کوته چخیدزه از سر گرفته شد، در ۱۹۵۲ دوباره ایستاد و در ۱۹۵۵ باز ادامه
    یافت — این بار به‌عنوان خانه‌ی فرهنگ کارگران صنعت چای. بنا در ۱۹۶۲ تمام شد. از بیرون معبدی یونانی
    است در جامه‌ای شوروی: طاق‌های بلند، دیوارهای سنگی سفید بر پایه‌ای از گرانیت. درون، ۷۵۰ صندلی از پارترِ
    نیم‌دایره‌ای به سوی دو طبقه لژ بالا می‌روند، زیر سقفی که آپولون کوتاتلادزه نقاشی‌اش کرده، و در دل
    صحنه — بیست متر در بیست متر و هجده متر بلندا — دایره‌ای گردان به قطر ۱۳ متر کار گذاشته شده است.


    بنا در ۲۰۱۷ در فهرست آثار فرهنگی ثبت شد و میان ۲۰۱۶ و ۲۰۲۰ با هزینه‌ی ۱۸ میلیون لاری که بنیاد «کارتو»
    پرداخت، مرمت شد. اگر می‌توانید برای دیدن یک اجرا بیایید: تالاری که این‌همه انتظار کشیده، سزاوار است
    با چراغ‌های روشن دیده شود.
  tip: >-
    نمای بیرونی و تندیس تسوتسوناوا را هر ساعتی می‌توان رایگان دید؛ درون ساختمان معمولاً فقط هنگام اجراها
    باز است، پس برنامه را بررسی کنید و اگر نمایشی روی صحنه است بلیت بخرید — تالار ارزشش را دارد، حتی اگر
    یک کلمه گرجی ندانید. میان اجراها هیچ امکاناتی برای بازدیدکنندگان نیست. در خیابان‌های فرعی پارک کنید.
    موزه‌ی تاریخ چند دقیقه پیاده راه است؛ درست روبه‌روی تئاتر، پشت پارکینگ پلیس، پی‌های بی‌نشان و به‌آسانی
    نادیده‌ماندنیِ گرمابه‌ای دیده می‌شود که گمان می‌رود از آن امیران گوریلی بوده، و یک بلوک آن‌سوتر به
    سمت شمال، باغ چنارهاست.
  route: >-
    اوزورگتی ۳۰۰ کیلومتر از تفلیس فاصله دارد، حدود ۴ ساعت و ۵۰ دقیقه، و سراسر راه آسفالت است. از E60 (S1)
    به سمت غرب بروید، از کنار خاشوری، از بخش ریکوتی و از کنار زستافونی و کوتائیسی بگذرید تا به سامتردیا
    برسید. آن‌جا به S12 به سوی لانچخوتی بپیچید و پس از لانچخوتی از راه‌های محلی و Sh2 به اوزورگتی بروید
    — حدود ۵۰ کیلومتر از سامتردیا، از میان دشت سرسبز گوریا که پوشیده از باغ‌های فندق است. تئاتر در مرکز
    شهر، در خیابان روستاولی است؛ طاق‌هایش را نمی‌شود ندید. در خاشوری، زستافونی، سامتردیا یا خود اوزورگتی
    سوخت بگیرید. هر خودروی اکونومی از پس این راه برمی‌آید.
he:
  name: התיאטרון הדרמטי של אוזורגטי (התיאטרון הדרמטי הממלכתי על שם אלכסנדר צוצונאווה)
  short: >-
    ענק לבן ניאו-קלאסי בגן העירוני — נבנה החל מ-1934, הושלם ב-1962 ושוחזר ב-2020 — עם אולם של 750 מושבים
    ובמה מסתובבת.
  body: >-
    **לאוזורגטי נדרשו עשרים ושמונה שנים, שתי עצירות ארוכות ושינוי תוכנית אחד כדי להשלים את התיאטרון שלה
    — והעיר קיבלה אחד מבנייני התיאטרון הגדולים בגאורגיה.**


    הבמה של העיר ותיקה מהבניין. אוזורגטי מונה את ראשית התיאטרון שלה מהצגת צדקה במרץ 1868. ב-1893 הגיע
    לעיר קרקס אמריקאי ונשאר שנה שלמה; הוא כל כך הקסים ילד בן שתים עשרה בשם אלכסנדר צוצונאווה, שהוא וחבריו
    החליטו להיות שחקנים, וב-1895 הוא כבר עמד בראש להקת החובבים המקומית. צוצונאווה, שנולד ב-1881 בכפר הסמוך
    ליכאורי, למד בימוי אצל סטניסלבסקי במוסקבה, העלה ב-1919 בטביליסי את האופרה החדשה של זכריה פליאשווילי,
    "אבסלום ואתרי", והיה לאחד ממייסדי הקולנוע הגאורגי — סרטו האילם "מרד בגוריה" (1928) הביא את המחוז הזה
    אל המסך. התיאטרון נושא את שמו מאז 1968.


    הבניין הנוכחי החל להיבנות ב-1934–1935 בגן העירוני, לפי תכנון של ואנו קדיאשווילי. העבודות נעצרו ב-1937,
    חודשו ב-1949 לפי תכנון מתוקן של קוטה צ'חאידזה, נעצרו שוב ב-1952 והתחדשו ב-1955 — הפעם כבית תרבות לעובדי
    תעשיית התה. הבניין הושלם ב-1962. מבחוץ זהו מקדש יווני בתלבושת סובייטית: קשתות גבוהות, קירות אבן לבנים
    על בסיס גרניט. בפנים עולים 750 מושבים מן האולם התחתון, בצורת חצי עיגול, אל שתי קומות של תאים (לוז'ות),
    תחת תקרה שצייר אפולון קוטטלדזה; ובתוך הבמה — עשרים על עשרים מטר ובגובה שמונה עשר מטר — משובץ עיגול
    מסתובב בקוטר 13 מטר.


    ב-2017 הוכרז הבניין אתר מורשת תרבותית, ובין 2016 ל-2020 שוחזר בעלות של 18 מיליון לארי, במימון קרן
    קרטו. אם תוכלו, בואו להצגה: אולם שחיכה כל כך הרבה זמן ראוי להיראות כשהאורות דולקים.
  tip: >-
    את החזית ואת פסלו של צוצונאווה אפשר לראות בחינם בכל שעה; הפנים נפתח בדרך כלל רק להצגות, לכן בדקו את
    התוכנייה, ואם משהו עולה — קנו כרטיס. האולם שווה את זה גם בלי מילה של גאורגית. בין ההצגות אין שום שירותים
    למבקרים. החנו ברחובות הצדדיים. המוזיאון ההיסטורי במרחק שתי דקות הליכה; ממש מול התיאטרון, מאחורי חניון
    המשטרה, שוכנים יסודות לא מסומנים וקלים לפספוס של בית מרחץ שלפי ההערכה שירת את נסיכי בית גוריאלי, וגוש
    בניינים אחד צפונה משם נמצא גן הדולבים.
  route: >-
    אוזורגטי נמצאת 300 ק"מ מטביליסי, כארבע שעות וחמישים דקות, בכביש סלול לכל אורכו. סעו מערבה בכביש E60
    (S1) על פני חשורי, דרך קטע ריקוטי ועל פני זסטפוני וקוטאיסי עד סמטרדיה. שם עברו לכביש S12 לכיוון לנצ'חוטי,
    ואחרי לנצ'חוטי המשיכו בדרכים מקומיות ובכביש Sh2 עד אוזורגטי — כ-50 ק"מ מסמטרדיה, דרך השפלה הירוקה
    של גוריה, הנטועה עצי לוז. התיאטרון עומד במרכז, ברחוב רוסתאוולי; את הקשתות שלו אי אפשר לפספס. תדלקו
    בחשורי, בזסטפוני, בסמטרדיה או באוזורגטי עצמה. כל רכב אקונומי יתאים.
ar:
  name: مسرح أوزورغيتي الدرامي (مسرح ألكسندر تسوتسونافا الدرامي الحكومي)
  short: >-
    عملاق أبيض على الطراز الكلاسيكي المحدث في حديقة المدينة — بدأ بناؤه عام 1934 واكتمل عام 1962 ورُمّم
    عام 2020 — بقاعة تتسع لـ750 مقعدًا ومسرح دوّار.
  body: >-
    **احتاجت أوزورغيتي إلى ثمانية وعشرين عامًا وتوقّفين طويلين وتعديلٍ في المخطط كي تُتمّ بناء مسرحها
    — فنالت المدينة واحدًا من أكبر المباني المسرحية في جورجيا.**


    خشبة المدينة أقدم من مبناها. تؤرّخ أوزورغيتي مسرحها بعرضٍ خيري أُقيم في مارس 1868. وفي عام 1893 حلّ
    بالمدينة سيرك أمريكي وبقي فيها عامًا كاملًا، فبهر صبيًّا في الثانية عشرة اسمه ألكسندر تسوتسونافا حتى
    عزم هو ورفاقه على أن يصبحوا ممثلين، وبحلول عام 1895 كان يقود الفرقة المحلية للهواة. وُلد تسوتسونافا
    عام 1881 في قرية ليخاوري القريبة، ودرس الإخراج على يد ستانيسلافسكي في موسكو، وأخرج في تبليسي عام 1919
    أوبرا زكريا بالياشفيلي الجديدة «أبيسالوم وإيتيري»، وصار أحد مؤسسي السينما الجورجية — إذ حمل فيلمه
    الصامت «تمرّد في غوريا» (1928) هذه المقاطعة إلى الشاشة. ويحمل المسرح اسمه منذ عام 1968.


    بدأ تشييد المبنى الحالي في 1934–1935 في حديقة المدينة وفق تصميم فانو قادييشفيلي. توقّف العمل عام 1937،
    واستُؤنف عام 1949 بتصميم معدّل لكوتي تشخيدزه، ثم توقّف ثانيةً عام 1952، وعاد عام 1955 — وقد صار هذه
    المرة دارًا للثقافة لعمّال صناعة الشاي. واكتمل عام 1962. من الخارج يبدو معبدًا إغريقيًا في زيٍّ سوفييتي:
    أقواس عالية، وجدران من الحجر الأبيض فوق قاعدة من الغرانيت. وفي الداخل تتدرّج المقاعد الـ750 من صالة
    أرضية نصف دائرية إلى طابقين من المقصورات، تحت سقفٍ رسمه أبولون كوتاتيلادزه، وفي قلب الخشبة — عشرون
    مترًا في عشرين، بارتفاع ثمانية عشر مترًا — دائرة دوّارة قطرها 13 مترًا.


    أُدرج المبنى معلمًا ثقافيًا عام 2017، ورُمّم بين عامي 2016 و2020 بكلفة 18 مليون لاري دفعتها مؤسسة
    «كارتو». إن استطعتم فاحضروا عرضًا: قاعة انتظرت كل هذا الوقت تستحق أن تُرى وأنوارها مضاءة.
  tip: >-
    يمكن مشاهدة الواجهة وتمثال تسوتسونافا مجانًا في أي ساعة؛ أما الداخل فلا يُفتح عادةً إلا للعروض، فراجعوا
    البرنامج واشتروا تذكرة إن كان هناك عرض — فالقاعة تستحق ذلك حتى لو لم تكونوا تعرفون كلمة واحدة من الجورجية.
    بين العروض لا توجد أي مرافق للزوّار. أوقفوا السيارة في الشوارع الجانبية. متحف التاريخ على بُعد دقيقتين
    سيرًا؛ وقبالة المسرح مباشرة، خلف موقف سيارات الشرطة، تقع أساسات بلا لافتة يسهل أن تفوتكم، لحمّامٍ
    يُعتقد أنه كان يخدم أمراء غورييلي، وعلى بُعد مربّع سكني واحد شمالًا تمتد حديقة الدُّلب.
  route: >-
    تبعد أوزورغيتي 300 كم عن تبليسي، نحو 4 ساعات و50 دقيقة، على طريق معبّد بالكامل. اسلكوا الطريق E60
    ‏(S1) غربًا متجاوزين خاشوري، ثم مقطع ريكوتي، مرورًا بزيستافوني وكوتايسي حتى سامتريديا. هناك انتقلوا
    إلى الطريق S12 باتجاه لانتشخوتي، وبعد لانتشخوتي تابعوا عبر الطرق المحلية والطريق Sh2 حتى أوزورغيتي
    — نحو 50 كم من سامتريديا عبر سهل غوريا الأخضر المزروع بالبندق. يقع المسرح في الوسط، في شارع روستافيلي؛
    ولن تخطئوا أقواسه. تزوّدوا بالوقود في خاشوري أو زيستافوني أو سامتريديا أو في أوزورغيتي نفسها. أي سيارة
    اقتصادية تفي بالغرض.
