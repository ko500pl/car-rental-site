ka:
  name: შატო ვარციხე
  short: >-
    ახალგაზრდა მამული-მარანი ანტიკური როდოპოლისის ადგილას, რომელსაც ბიზანტია და ირანი ეცილებოდნენ: საკუთარი
    ღვინის დეგუსტაცია აჯამეთის ტყის პირას.
  body: >-
    **პირველი ვაზი აქ 2016 წელს დარგეს, ამ იმერულ ვაკეზე კი ბიზანტიელები და სპარსელები ჯერ კიდევ VI საუკუნეში
    იბრძოდნენ; ბერძენი ავტორები მას როდოპოლისს — ვარდის ქალაქს — უწოდებდნენ.**


    ქართული სახელი, ვარციხე — „ვარდის ციხე“ — ამ მეხსიერებას ინახავს. სოფელი ხანისწყლისა და რიონის შესართავთან
    მდებარეობს და გრძელი წარსული აქვს: IV საუკუნიდან გამაგრებული დასახლება ლაზიკის ომის დროს ბიზანტიასა
    და სასანიანთა ირანს შორის ხელიდან ხელში გადადიოდა. XVII საუკუნიდან აქ იმერეთის მეფეთა ციხე და საზაფხულო
    რეზიდენცია იყო — მეფეები მეზობელ აჯამეთის ტყეში ნადირობდნენ. სწორედ აქ გამაგრდა სოლომონ II რუსეთის
    წინააღმდეგ და აქვე, 1810 წლის 6 მარტს, რუსულმა ჯარმა ციხე აიღო; იმავე წელს რუსეთმა იმერეთი შემოიერთა.
    XX საუკუნის დასაწყისში ქუთაისელმა ოჯახმა, ანანოვებმა, სოფელში ღვინის ქარხანა ააშენა და ადგილობრივ
    კონიაკს ჩამოასხამდა.


    შატო ვარციხე ამ ამბის ახალი თავია და იმ ძველ ქარხანასთან კავშირს არ იჩემებს. პირველი ვენახი 2016 წელს
    გაშენდა, პირველი სტუმრები კი მამულმა 2022 წელს მიიღო. დღეს დაახლოებით 120 ჰექტარი ვენახი, ტყე და ღია
    მიწა აჯამეთის ტყემდე აღწევს, რომლის ნაწილიც 1946 წლიდან იმერული მუხისა და ძელქვის რელიქტური კორომების
    გამო დაცულია. ღვინო მამულის საკუთარი მარნიდან მოდის; დეგუსტაციაზე ოთხ ან ხუთ ღვინოს ასხამენ, ბოლოს
    კი — ჭაჭას.


    ჭიქისთვის ჩამოდით, მაგრამ გარემოსაც მიაგეთ პატივი: ტყის პირს, ტბას და სოფლის ციხის ნანგრევებს, რომელთა
    ქვეშაც გვიანანტიკური კედლები დღემდე მიწაშია ჩამარხული. ვაზი აქ ათი წლისაც არ არის; მიწისთვის, რომელზეც
    ის დგას, თხუთმეტი საუკუნის წინ იბრძოდნენ.
  tip: >-
    ვიზიტი წინასწარ შეათანხმეთ, ნუ მიხვალთ მოულოდნელად. ჩვენი შემოწმებისას მამული ოთხი ღვინისა და ჭაჭის
    დეგუსტაციას 60 ლარად სთავაზობდა, ხუთი ღვინისა და ჭაჭისას — 90 ლარად; ასევე ცხენით სეირნობას აჯამეთის
    ტყეში და კულინარიულ მასტერკლასებს. ფასები იცვლება, ამიტომ დააზუსტეთ. რესტორანი 13:00-დან იხსნება,
    პარკინგი უფასოა. საათნახევარი დაუთმეთ, მერე კი სოფლის ციხის ნანგრევებამდე გაისეირნეთ. საქართველოში
    ნასვამ მდგომარეობაში მართვის წესები მკაცრია: მძღოლმა ხედით დატკბეს, ან ღამე აქ გაათიეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთით გაუყევით — გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე
    გადასვლით და ზესტაფონის გვერდით; ბენზინგასამართი სადგურები მთელ გზაზეა. იქ, სადაც მაგისტრალი ქუთაისს
    სამხრეთიდან უვლის, სამხრეთით შ14-ზე, ქუთაისი–ბაღდათის გზაზე, გადაუხვიეთ, შემდეგ კი შ51-ით ვარციხეში
    შედით. სულ დაახლოებით 220 კილომეტრია და გაჩერებების გარეშე სამ საათზე ოდნავ ნაკლები (2 სთ 55 წთ) სჭირდება;
    გზა ბოლომდე ასფალტიანია, ამიტომ ეკონომ კლასის მანქანაც საკმარისია. ქუთაისის ცენტრიდან მამულამდე დაახლოებით
    15 წუთის სავალია — ქალაქიდან ნახევარდღიანი გასვლისთვის ან დასავლეთისკენ მიმავალ გზაზე პირველი ღამისთვის
    კარგი არჩევანია.
en:
  name: Chateau Vartsikhe Winery
  short: >-
    A young estate winery on the site of ancient Rhodopolis, fought over by Byzantium and Persia: tastings
    from its own cellar at the edge of Ajameti forest.
  body: >-
    **Long before the first vines went in here in 2016, Byzantine and Persian armies were fighting over
    this stretch of Imeretian plain, and Greek writers called it Rhodopolis, the city of the rose.**


    The Georgian name, Vartsikhe, "fortress of the rose", keeps the memory. The village lies where the
    Khanistskali meets the Rioni, and its record is long: a fortified settlement from the 4th century,
    it changed hands between Byzantium and Sasanian Persia during the Lazic War. From the 17th century
    it was a castle and summer residence of the kings of Imereti, who hunted in the neighbouring Ajameti
    forest. Here King Solomon II dug in against Russia, and here, on 6 March 1810, Russian troops took
    the castle; Imereti was annexed later that year. In the early 1900s the Ananovs, a Kutaisi family,
    built a winery in the village and bottled a local brandy.


    Chateau Vartsikhe is a newer chapter with no claimed link to that one. Its first vineyard was planted
    in 2016 and the estate welcomed its first guests in 2022; today some 120 hectares of vines, forest
    and open land run up to the Ajameti forest, part of which has been protected since 1946 for its relict
    Imeretian oak and zelkova. The wine comes from the estate's own cellar and is poured at tastings of
    four or five wines, finished with chacha.


    Come for the glass, but give the setting its due: the forest edge, the lake, and the ruined castle
    in the village, beneath which walls of late antiquity still lie buried. The vines are barely a decade
    old; people were fighting over the ground beneath them fifteen centuries ago.
  tip: >-
    Arrange your visit in advance rather than dropping in. When we checked, the estate listed a tasting
    of four wines and chacha at 60 GEL and one of five wines and chacha at 90 GEL, plus horse riding in
    the Ajameti forest and cooking masterclasses; prices change, so confirm them. The restaurant opens
    at 13:00 and parking is free. Allow an hour and a half, then walk over to the castle ruins in the
    village. Georgia's drink-driving rules are strict: let the driver enjoy the view, or stay the night.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri, through the Rikoti Pass and past Zestaponi;
    there are fuel stations the whole way. Where the highway skirts the south of Kutaisi, turn south onto
    the Sh14, the Kutaisi–Baghdati road, then follow the Sh51 into Vartsikhe. It is about 220 km and just
    under three hours without stops (2 h 55 min), paved all the way, so an economy car is enough. From
    central Kutaisi the estate is about a 15-minute drive, which makes it an easy half-day from the city
    or a first night on the way west.
ru:
  name: Шато Варцихе
  short: >-
    Молодое винодельческое имение на месте древнего Родополиса, за который спорили Византия и Персия:
    дегустации из собственного погреба у кромки Аджаметского леса.
  body: >-
    **Задолго до того, как здесь в 2016 году посадили первые лозы, за этот участок Имеретинской равнины
    бились византийские и персидские армии, а греческие авторы называли его Родополисом — городом розы.**


    Грузинское название, Варцихе — «крепость розы», хранит эту память. Село стоит там, где Ханисцкали
    впадает в Риони, и летопись у него долгая: укреплённое поселение с IV века, во время Лазской войны
    оно переходило из рук в руки между Византией и Сасанидской Персией. С XVII века здесь были замок и
    летняя резиденция имеретинских царей, охотившихся в соседнем Аджаметском лесу. Здесь царь Соломон
    II держал оборону против России, и здесь 6 марта 1810 года русские войска взяли замок; позже в том
    же году Имеретию присоединили к империи. В начале 1900-х кутаисская семья Анановых построила в селе
    винодельню и разливала местный бренди.


    Шато Варцихе — новая глава, которая не претендует на родство с той. Первый виноградник заложен в 2016
    году, первых гостей имение приняло в 2022-м; сегодня около 120 гектаров лоз, леса и открытой земли
    тянутся до Аджаметского леса, часть которого охраняется с 1946 года ради реликтового имеретинского
    дуба и дзельквы. Вино делают в собственном погребе имения и наливают на дегустациях из четырёх или
    пяти вин, которые завершает чача.


    Приезжайте ради бокала, но отдайте должное и месту: опушке леса, озеру и руинам замка в селе, под
    которыми до сих пор скрыты стены поздней античности. Лозам здесь нет и десяти лет; за землю под ними
    сражались пятнадцать веков назад.
  tip: >-
    Договоритесь о визите заранее, а не заезжайте наудачу. Когда мы проверяли, имение предлагало дегустацию
    четырёх вин с чачей за 60 лари и пяти вин с чачей за 90 лари, а также конные прогулки по Аджаметскому
    лесу и кулинарные мастер-классы; цены меняются, так что уточняйте. Ресторан открывается в 13:00, парковка
    бесплатная. Заложите полтора часа, а потом прогуляйтесь к руинам замка в селе. Законы Грузии о вождении
    в нетрезвом виде строги: пусть водитель наслаждается видом — или оставайтесь на ночь.
  route: >-
    Из Тбилиси по S1 (E60) на запад мимо Гори и Хашури, через Рикотский перевал и мимо Зестафони; заправки
    есть на всём пути. Там, где трасса огибает Кутаиси с юга, сверните на юг на Sh14 — дорогу Кутаиси
    — Багдати, а затем по Sh51 въезжайте в Варцихе. Это около 220 км и чуть меньше трёх часов без остановок
    (2 ч 55 мин), всё по асфальту, так что хватит и машины эконом-класса. От центра Кутаиси до имения
    около 15 минут езды: удобная поездка на полдня из города или первая ночёвка по дороге на запад.
fa:
  name: شاتو وارتسیخه
  short: >-
    شراب‌سازی و تاکستانی جوان بر جای رودوپولیسِ کهن که بیزانس و ایران بر سرش جنگیدند: چشیدن شراب از سرداب
    خودِ ملک، در لبهٔ جنگل آجامتی.
  body: >-
    **مدت‌ها پیش از آنکه نخستین تاک‌ها در سال ۲۰۱۶ اینجا کاشته شوند، سپاهیان بیزانس و ایران بر سر این
    پاره از دشت ایمرتی می‌جنگیدند و نویسندگان یونانی آن را رودوپولیس، یعنی شهر گل سرخ، می‌نامیدند.**


    نام گرجی، وارتسیخه، یعنی «دژ گل سرخ»، این خاطره را نگه داشته است. روستا در جایی است که خانیستسکالی
    به ریونی می‌پیوندد و پیشینه‌ای دراز دارد: سکونتگاهی مستحکم از قرن چهارم که در جنگ لازیکا میان بیزانس
    و ایران ساسانی دست‌به‌دست شد. از قرن هفدهم، دژ و اقامتگاه تابستانی شاهان ایمرتی بود که در جنگل همسایه،
    آجامتی، به شکار می‌رفتند. همین‌جا سلیمان دوم در برابر روسیه سنگر گرفت، و همین‌جا، در ۶ مارس ۱۸۱۰،
    سپاهیان روس دژ را گرفتند؛ ایمرتی در ادامهٔ همان سال به روسیه ضمیمه شد. در آغاز دههٔ ۱۹۰۰، خاندان آنانوف
    از کوتائیسی در این روستا شراب‌سازی‌ای ساختند و براندی محلی را بطری می‌کردند.


    شاتو وارتسیخه فصلی تازه است که هیچ پیوندی با آن گذشته ادعا نمی‌کند. نخستین تاکستانش در سال ۲۰۱۶ کاشته
    شد و ملک در سال ۲۰۲۲ نخستین مهمانانش را پذیرفت؛ امروز حدود ۱۲۰ هکتار تاک، جنگل و زمین باز تا جنگل
    آجامتی امتداد دارد، که بخشی از آن از سال ۱۹۴۶ به خاطر بلوط ایمرتی و زلکوای بازمانده از روزگاران کهن
    حفاظت می‌شود. شراب در سرداب خودِ ملک ساخته می‌شود و در جلسه‌های چشیدنِ چهار یا پنج شراب سرو می‌شود
    که با چاچا به پایان می‌رسد.


    برای جام بیایید، اما حق این محیط را هم ادا کنید: لبهٔ جنگل، دریاچه، و ویرانهٔ دژ در روستا که دیوارهایی
    از اواخر دوران باستان هنوز زیر آن مدفون است. تاک‌ها هنوز ده‌ساله هم نشده‌اند؛ پانزده قرن پیش، مردم
    بر سر زمینِ زیر آن‌ها می‌جنگیدند.
  tip: >-
    بازدیدتان را از پیش هماهنگ کنید و سرزده نروید. هنگامی که ما بررسی کردیم، ملک یک جلسهٔ چشیدن چهار شراب
    و چاچا به قیمت ۶۰ لاری و یک جلسهٔ پنج شراب و چاچا به قیمت ۹۰ لاری عرضه می‌کرد، به‌علاوهٔ اسب‌سواری
    در جنگل آجامتی و کلاس‌های آشپزی؛ قیمت‌ها تغییر می‌کنند، پس آن‌ها را بپرسید. رستوران ساعت ۱۳:۰۰ باز
    می‌شود و پارکینگ رایگان است. یک ساعت و نیم وقت بگذارید، سپس پیاده تا ویرانه‌های دژ در روستا بروید.
    قوانین گرجستان دربارهٔ رانندگی پس از نوشیدن الکل سخت‌گیرانه است: بگذارید راننده از منظره لذت ببرد،
    یا شب را بمانید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب بگیرید و از کنار گوری و خاشوری بگذرید، از گردنهٔ ریکوتی عبور
    کنید و از کنار زستافونی رد شوید؛ در سراسر راه پمپ‌بنزین هست. جایی که بزرگراه از جنوب کوتائیسی می‌گذرد،
    به سمت جنوب وارد Sh14، جادهٔ کوتائیسی–باغداتی، شوید و سپس با Sh51 به وارتسیخه بروید. مسافت حدود ۲۲۰
    کیلومتر و بدون توقف کمی کمتر از سه ساعت (۲ ساعت و ۵۵ دقیقه) است و سراسر آسفالت، پس خودروی اقتصادی
    کافی است. از مرکز کوتائیسی تا ملک حدود ۱۵ دقیقه رانندگی است؛ گردشی آسان برای نیمی از روز از شهر، یا
    نخستین شب اقامت در راه غرب.
he:
  name: שאטו וארציחה
  short: >-
    יקב אחוזה צעיר במקומה של רודופוליס העתיקה, שעליה נאבקו ביזנטיון ופרס: טעימות מהמרתף של האחוזה, בשולי
    יער אג'אמטי.
  body: >-
    **הרבה לפני שנשתלו כאן הגפנים הראשונות ב-2016, נלחמו צבאות ביזנטיון ופרס על רצועת המישור האימרתי הזאת,
    וסופרים יוונים כינו אותה רודופוליס — עיר הוורד.**


    השם הגאורגי, וארציחה — "מבצר הוורד" — משמר את הזיכרון. הכפר שוכן במקום שבו החניסצקאלי נשפך לריוני,
    ותולדותיו ארוכות: יישוב מבוצר מהמאה ה-4, שעבר מיד ליד בין ביזנטיון לפרס הסאסאנית במלחמה הלאזית. מהמאה
    ה-17 שימש מבצר ומעון קיץ למלכי אימרתי, שצדו ביער אג'אמטי הסמוך. כאן התבצר המלך סולומון השני מול רוסיה,
    וכאן, ב-6 במרץ 1810, כבשו חיילים רוסים את המבצר; אימרתי סופחה מאוחר יותר באותה שנה. בראשית המאה ה-20
    הקימה בכפר משפחת אננוב מקוטאיסי יקב, ובקבקה בו ברנדי מקומי.


    שאטו וארציחה הוא פרק חדש שאינו טוען לקשר כלשהו לקודם. הכרם הראשון שלו ניטע ב-2016, והאחוזה קיבלה את
    אורחיה הראשונים ב-2022; כיום משתרעים כ-120 הקטאר של גפנים, יער ושטח פתוח עד יער אג'אמטי, שחלקו מוגן
    מאז 1946 בזכות אלון אימרתי וזלקובה שרידיים. היין מיוצר במרתף של האחוזה עצמה ונמזג בטעימות של ארבעה
    או חמישה יינות, שמסתיימות בצ'אצ'ה.


    בואו בשביל הכוס, אבל תנו לסביבה את המגיע לה: שולי היער, האגם, וחורבות המבצר בכפר, שמתחתיהן עדיין קבורות
    חומות מסוף העת העתיקה. הגפנים כאן עוד לא בנות עשר; על האדמה שמתחתיהן נלחמו אנשים לפני אלף וחמש מאות
    שנה.
  tip: >-
    תאמו את הביקור מראש ואל תקפצו בלי הודעה. כשבדקנו, האחוזה הציעה טעימה של ארבעה יינות וצ'אצ'ה ב-60 לארי
    ושל חמישה יינות וצ'אצ'ה ב-90 לארי, וגם רכיבה על סוסים ביער אג'אמטי וסדנאות בישול; המחירים משתנים,
    אז ודאו אותם. המסעדה נפתחת ב-13:00 והחניה חינם. הקצו שעה וחצי, ואחר כך לכו ברגל אל חורבות המבצר בכפר.
    החוקים בגאורגיה נגד נהיגה בשכרות נוקשים: תנו לנהג ליהנות מהנוף, או הישארו ללילה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי וחשורי, דרך מעבר ריקוטי ועל פני זסטפוני; יש תחנות דלק
    לאורך כל הדרך. במקום שבו הכביש המהיר עוקף את קוטאיסי מדרום, פנו דרומה לכביש Sh14, כביש קוטאיסי–בגדאתי,
    ומשם המשיכו בכביש Sh51 אל וארציחה. המרחק כ-220 ק"מ, קצת פחות משלוש שעות בלי עצירות (2 שעות ו-55 דקות),
    סלול לכל אורכו, כך שרכב חסכוני מספיק. ממרכז קוטאיסי האחוזה במרחק כ-15 דקות נסיעה, ולכן היא חצי יום
    קל מהעיר או לילה ראשון בדרך מערבה.
ar:
  name: شاتو فارتسيخي
  short: >-
    مزرعة نبيذ فتية في موضع رودوبوليس القديمة التي تنازعتها بيزنطة وفارس: تذوّق من قبو الضيعة الخاص عند
    حافة غابة أجاميتي.
  body: >-
    **قبل أن تُغرس أولى الكروم هنا عام 2016 بزمن طويل، كانت جيوش بيزنطة وفارس تتقاتل على هذه الرقعة من
    سهل إيميريتي، وكان الكتّاب الإغريق يسمّونها رودوبوليس، أي مدينة الورد.**


    والاسم الجورجي فارتسيخي، «قلعة الورد»، يحفظ هذه الذكرى. تقع القرية حيث يلتقي نهر خانيستسكالي بنهر
    ريوني، ولها سجل طويل: مستوطنة محصّنة منذ القرن الرابع، تناقلتها بيزنطة وفارس الساسانية خلال الحرب
    اللازية. ومنذ القرن السابع عشر كانت قلعة ومقرًّا صيفيًا لملوك إيميريتي الذين كانوا يصطادون في غابة
    أجاميتي المجاورة. هنا تحصّن الملك سليمان الثاني في وجه روسيا، وهنا، في 6 مارس 1810، استولت القوات
    الروسية على القلعة؛ ثم ضُمّت إيميريتي إلى روسيا في وقت لاحق من ذلك العام. وفي مطلع القرن العشرين أقامت
    عائلة أنانوف من كوتايسي معملًا للنبيذ في القرية وكانت تعبّئ براندي محليًا.


    أما شاتو فارتسيخي ففصل أحدث لا يدّعي أي صلة بذلك الفصل. غُرس أول كرومه عام 2016، واستقبلت الضيعة أول
    ضيوفها عام 2022؛ واليوم تمتد نحو 120 هكتارًا من الكروم والغابات والأرض المفتوحة حتى غابة أجاميتي،
    التي يُحمى جزء منها منذ عام 1946 لأجل البلوط الإيميريتي والزلكوفا الباقيين من عصور غابرة. يُصنع النبيذ
    في قبو الضيعة الخاص ويُقدَّم في جلسات تذوّق لأربعة أنواع أو خمسة، تُختتم بالتشاتشا.


    تعالوا من أجل الكأس، لكن أعطوا المكان حقه: حافة الغابة، والبحيرة، وأطلال القلعة في القرية، التي لا
    تزال تحتها أسوار من أواخر العصور القديمة مدفونة. لم تبلغ الكروم هنا عشر سنوات بعد؛ أما الأرض التي
    تحتها فقد تقاتل الناس عليها قبل خمسة عشر قرنًا.
  tip: >-
    رتّبوا زيارتكم مسبقًا ولا تأتوا دون موعد. حين تحققنا، كانت الضيعة تعرض تذوّق أربعة أنواع من النبيذ
    مع التشاتشا بسعر 60 لاري، وخمسة أنواع مع التشاتشا بسعر 90 لاري، إلى جانب ركوب الخيل في غابة أجاميتي
    ودروس الطبخ؛ الأسعار تتغير، فتأكدوا منها. يفتح المطعم في 13:00 والموقف مجاني. خصصوا ساعة ونصفًا، ثم
    امشوا إلى أطلال القلعة في القرية. قوانين جورجيا بشأن القيادة تحت تأثير الكحول صارمة: دعوا السائق يستمتع
    بالمنظر، أو ابقوا للمبيت.
  route: >-
    من تبليسي خذوا طريق S1 (E60) غربًا مرورًا بغوري وخاشوري، عبر ممر ريكوتي ومرورًا بزستافوني؛ محطات الوقود
    متوفرة على طول الطريق. حيث يلتف الطريق السريع جنوب كوتايسي، انعطفوا جنوبًا إلى طريق Sh14، طريق كوتايسي–باغداتي،
    ثم اتبعوا طريق Sh51 إلى فارتسيخي. المسافة نحو 220 كم وأقل بقليل من ثلاث ساعات دون توقف (ساعتان و55
    دقيقة)، والطريق معبّد بالكامل، فتكفي سيارة اقتصادية. ومن وسط كوتايسي تبعد الضيعة نحو 15 دقيقة بالسيارة،
    ما يجعلها نصف يوم سهلًا من المدينة أو أول مبيت في الطريق غربًا.
