ka:
  name: ხანის ჩანჩქერი
  short: >-
    ნაკლებად ცნობილი ჩანჩქერი ხანისწყლის ზემო ხეობაში, ბაღდათის ზემოთ: სოფლის გზა, ტყის ბილიკი და წყალი,
    რომელსაც ცოტა ვინმე თუ ნახულობს.
  body: >-
    **ხანის ჩანჩქერთან შემთხვევით ვერ მოხვდებით: მანქანით სოფელ ხანის ბოლო სახლამდე უნდა მიხვიდეთ, მერე
    კი მდინარეს ტყეში აუყვეთ, სანამ ჩანჩქერის ხმას არ გაიგონებთ.**


    ჩანჩქერი ბაღდათის მუნიციპალიტეტში, ხანისწყლის ზემო ხეობაშია, ზღვის დონიდან დაახლოებით 790 მეტრზე,
    სოფელ ხანის ზემოთ. ხანისწყალი მესხეთის ქედიდან ჩამოედინება, ბაღდათს ჩაუვლის და რიონს უერთდება. ჩანჩქერის
    სიმაღლე არსად გამოქვეყნებულა.


    რისი დაპირებაც შეგვიძლია, ეს გზაა: მანქანით სოფლამდე, იქიდან კი ტყიანი ხეობის ბილიკებით ფეხით — რუკაზე
    ჩანჩქერი სოფლიდან დაახლოებით ორ-სამ კილომეტრშია. ეს გასეირნებაა, ბოლოს ჩანჩქერით, და არა ჩანჩქერი
    ავტოსადგომით. ამ მხარეში წყალი საერთოდ სახელოვანია: დასავლეთით, პირდაპირი ხაზით დაახლოებით 20 კილომეტრზე,
    საირმის მინერალური წყაროებია, გზად კი ბაღდათი და მაიაკოვსკის სახლ-მუზეუმი დაგხვდებათ.


    ჩამოდით ცნობისმოყვარეობით და არა სანახაობების სიით ხელში — და ეს ხეობა გულს არ გატკენთ.
  tip: >-
    ადგილზე არც ნიშნებია დადასტურებული და არც ინფრასტრუქტურა; შესვლა უფასოა. სოფელ ხანში ადგილობრივებს
    ჰკითხეთ, რომელი ბილიკით წახვიდეთ და ტყის გზაზე მანქანით რამდენის გავლა შეიძლება. ჩაიცვით ლანჩიანი
    ფეხსაცმელი, წაიღეთ წყალი და საჭმელი — სოფლის ზემოთ მაღაზია არ გეგულებათ. წვიმის შემდეგ ბილიკი მოლიპულია;
    საუკეთესო პერიოდი მაისიდან ოქტომბრამდეა, წყალი კი ჩვეულებრივ გაზაფხულზე, თოვლის დნობისას, უხვია. ფეხით
    მისვლა-მოსვლას საათზე ბევრად მეტი დასჭირდება — მთლიანად ორ-სამ საათს გაითვალისწინეთ, — ამიტომ დღის
    მეორე ნახევარში ნუ დააგვიანებთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით გორისა და ხაშურის გავლით ზესტაფონამდე იარეთ (დაახლოებით 185 კილომეტრი),
    იქიდან შ54 გზით სამხრეთ-დასავლეთით ბაღდათში ჩადით. ბაღდათიდან შ14-ს აბასთუმნის მიმართულებით გაჰყევით
    დაახლოებით 10 კილომეტრი, შემდეგ ადგილობრივ გზაზე გადაუხვიეთ და დაახლოებით 6 კილომეტრი სოფელ ხანამდე
    აიარეთ, სადაც სავალი გზა მთავრდება. სულ დაახლოებით 232 კილომეტრი და 3 საათი და 40 წუთი. ბოლო მონაკვეთი
    ხრეშიანია, მაგრამ მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის. საწვავი ზესტაფონში ან ბაღდათში ჩაასხით.
en:
  name: Khani Waterfall
  short: >-
    A little-known waterfall in the upper Khanistskali valley above Baghdati: a village road, a forest
    path and water few visitors ever see.
  body: >-
    **Khani Waterfall is not on the way to anywhere: you drive to the last house in Khani, leave the car
    and follow the river into the woods until you hear it.**


    It lies in Baghdati municipality, in the upper valley of the Khanistskali, at about 790 metres above
    sea level, upstream of the village of Khani. The river comes down from the Meskheti Range, runs through
    Baghdati and joins the Rioni. Its height has never been published.


    What we can promise is the approach: by car to the village, then on foot along the paths of a wooded
    gorge — on the map the fall lies some two to three kilometres beyond the houses. This is a walk with
    a waterfall at the end, not a waterfall with a car park. Water is the theme of this whole district:
    Sairme's mineral springs lie about 20 km to the west as the crow flies, and on the way you pass Baghdati
    and its Mayakovsky house-museum.


    Come with curiosity rather than a checklist, and the valley will not let you down.
  tip: >-
    No signage or facilities are confirmed at the site; entry is free. In Khani, ask locals which path
    to take and how far a car can go on the forest track. Wear shoes with grip and carry water and food
    — do not count on a shop above the village. The path is slippery after rain; May to October is the
    best window, and the flow is usually strongest in spring snowmelt. The walk there and back takes well
    over an hour — allow two to three hours for the visit — so do not set out late in the afternoon.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri to Zestaponi (about 185 km), then the Sh54
    south-west to Baghdati. From Baghdati follow the Sh14 towards Abastumani for about 10 km, then turn
    onto the local road and climb about 6 km to Khani village, where the drivable road ends. In all, about
    232 km and 3 hours 40 minutes. The last stretch is gravel, but in dry weather an economy car will
    manage. Fill up in Zestaponi or Baghdati.
ru:
  name: Водопад Хани
  short: >-
    Малоизвестный водопад в верховьях долины Ханисцкали над Багдати: сельская дорога, лесная тропа и вода,
    которую видят немногие.
  body: >-
    **Водопад Хани не попадётся вам по дороге: доедьте до последнего дома в селе Хани, оставьте машину
    и идите вдоль реки в лес, пока не услышите шум воды.**


    Он находится в Багдатском муниципалитете, в верхней части долины Ханисцкали, на высоте около 790 метров
    над уровнем моря, выше села Хани. Река стекает с Месхетского хребта, проходит через Багдати и впадает
    в Риони. Высота водопада нигде не опубликована.


    Зато мы можем обещать дорогу: на машине до села, а дальше пешком по тропам лесистого ущелья — на карте
    водопад лежит примерно в двух-трёх километрах за последними домами. Это прогулка, в конце которой
    ждёт водопад, а не водопад с парковкой. Вода — главная тема всего края: минеральные источники Саирме
    лежат примерно в 20 км к западу по прямой, а по пути вы проедете Багдати с домом-музеем Маяковского.


    Приезжайте с любопытством, а не со списком галочек, — и долина вас не разочарует.
  tip: >-
    Указатели и какая-либо инфраструктура на месте не подтверждены; вход свободный. В Хани спросите у
    местных, по какой тропе идти и докуда можно доехать по лесной дороге. Наденьте обувь с цепкой подошвой,
    возьмите воду и еду — на магазин выше села не рассчитывайте. После дождя тропа скользкая; лучшее время
    — с мая по октябрь, а полноводнее всего водопад обычно весной, когда тает снег. Дорога туда и обратно
    займёт заметно больше часа — закладывайте на всё два-три часа, — так что не выходите во второй половине
    дня слишком поздно.
  route: >-
    Из Тбилиси езжайте по трассе S1 (E60) на запад мимо Гори и Хашури до Зестафони (около 185 км), затем
    по Sh54 на юго-запад до Багдати. Из Багдати около 10 км по Sh14 в сторону Абастумани, затем сверните
    на местную дорогу и поднимитесь примерно на 6 км до села Хани, где проезжая дорога заканчивается.
    Всего около 232 км и 3 часа 40 минут. Последний участок гравийный, но в сухую погоду справится и автомобиль
    эконом-класса. Заправьтесь в Зестафони или Багдати.
fa:
  name: آبشار خانی
  short: >-
    آبشاری کم‌شناخته در بالادست درهٔ خانیستسکالی، بالای باغداتی: جاده‌ای روستایی، کوره‌راهی جنگلی و آبی
    که کمتر مسافری آن را دیده است.
  body: >-
    **آبشار خانی سر راه هیچ جایی نیست: تا آخرین خانهٔ روستای خانی می‌رانید، خودرو را می‌گذارید و رود را
    در جنگل دنبال می‌کنید تا صدایش را بشنوید.**


    آبشار در شهرستان باغداتی، در بالادست درهٔ خانیستسکالی، در ارتفاع حدود ۷۹۰ متری از سطح دریا و بالاتر
    از روستای خانی قرار دارد. این رود از رشته‌کوه مسختی سرازیر می‌شود، از باغداتی می‌گذرد و به ریونی می‌پیوندد.
    بلندی آبشار هرگز جایی منتشر نشده است.


    آنچه می‌توانیم وعده دهیم، راه رسیدن است: با خودرو تا روستا، سپس پیاده در کوره‌راه‌های یک درهٔ جنگلی
    — روی نقشه، آبشار حدود دو تا سه کیلومتر آن سوی خانه‌ها قرار دارد. این پیاده‌روی‌ای است که به آبشار
    ختم می‌شود، نه آبشاری با پارکینگ. آب مضمون اصلی این ناحیه است: چشمه‌های آب معدنی سایرمه حدود ۲۰ کیلومتر
    در خط مستقیم به سمت غرب قرار دارند و در راه از باغداتی و خانه‌موزهٔ مایاکوفسکی می‌گذرید.


    با کنجکاوی بیایید، نه با فهرستی برای تیک زدن، و دره ناامیدتان نخواهد کرد.
  tip: >-
    وجود تابلو یا امکانات در محل تأیید نشده است؛ ورود رایگان است. در خانی از اهالی بپرسید کدام مسیر را
    بروید و خودرو تا کجای جادهٔ جنگلی می‌تواند پیش برود. کفشی با کف چسبنده بپوشید و آب و غذا همراه داشته
    باشید — روی مغازه‌ای بالاتر از روستا حساب نکنید. مسیر پس از باران لغزنده است؛ بهترین زمان از ماه مه
    تا اکتبر است و آب آبشار معمولاً در فصل آب شدن برف‌ها در بهار از همیشه پرتر است. رفت و برگشت به‌مراتب
    بیش از یک ساعت طول می‌کشد — روی‌هم دو تا سه ساعت در نظر بگیرید — پس دیرهنگام در بعدازظهر راه نیفتید.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب و از کنار گوری و خاشوری تا زستافونی بروید (حدود ۱۸۵ کیلومتر)،
    سپس از جادهٔ Sh54 به سمت جنوب‌غرب تا باغداتی. از باغداتی جادهٔ Sh14 را حدود ۱۰ کیلومتر به سوی آبستومانی
    دنبال کنید، سپس به جادهٔ محلی بپیچید و حدود ۶ کیلومتر تا روستای خانی بالا بروید؛ جادهٔ خودرورو همان‌جا
    به پایان می‌رسد. روی‌هم حدود ۲۳۲ کیلومتر و ۳ ساعت و ۴۰ دقیقه. آخرین بخش شنی است، اما در هوای خشک یک
    خودروی اقتصادی از پسش برمی‌آید. در زستافونی یا باغداتی باک را پر کنید.
he:
  name: מפל חאני
  short: 'מפל שמעטים מכירים בעמק העליון של החאניסצקאלי, מעל בגדאתי: דרך כפרית, שביל יער ומים שמעטים המטיילים
    שראו אותם.'
  body: >-
    **מפל חאני אינו בדרך לשום מקום: נוסעים עד הבית האחרון בכפר חאני, משאירים את הרכב והולכים לאורך הנהר
    אל תוך היער, עד שהמפל נשמע.**


    המפל נמצא במחוז בגדאתי, בעמק העליון של נהר החאניסצקאלי, בגובה של כ-790 מטר מעל פני הים, מעל הכפר חאני.
    הנהר יורד מרכס מסחתי, עובר דרך בגדאתי ונשפך אל הריוני. גובהו של המפל מעולם לא פורסם.


    מה שאנחנו כן יכולים להבטיח הוא הדרך: ברכב עד הכפר, ומשם ברגל בשבילי ערוץ מיוער — על המפה המפל נמצא
    כשניים-שלושה קילומטרים מעבר לבתים. זו הליכה שבסופה מפל, לא מפל עם חניון. המים הם הנושא של כל האזור:
    מעיינות המינרלים של סאירמה נמצאים כ-20 ק"מ מערבה בקו אווירי, ובדרך עוברים בבגדאתי ובבית-המוזיאון של
    מאיאקובסקי.


    בואו עם סקרנות ולא עם רשימת וי, והעמק לא יאכזב אתכם.
  tip: >-
    לא אושר שיש במקום שילוט או מתקנים; הכניסה חופשית. בחאני שאלו את המקומיים באיזה שביל ללכת ועד היכן
    אפשר לנסוע ברכב בדרך היער. נעלו נעליים עם אחיזה טובה והביאו מים ואוכל — אל תסמכו על חנות מעל הכפר.
    השביל חלקלק אחרי גשם; החלון הטוב ביותר הוא מאי עד אוקטובר, והזרימה חזקה בדרך כלל באביב, בעונת הפשרת
    השלגים. ההליכה הלוך וחזור נמשכת הרבה יותר משעה — הקצו לביקור כולו שעתיים-שלוש — לכן אל תצאו מאוחר
    אחר הצהריים.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) על פני גורי וחשורי עד זסטפוני (כ-185 ק"מ), ומשם בכביש Sh54 דרום-מערבה
    עד בגדאתי. מבגדאתי סעו כ-10 ק"מ בכביש Sh14 לכיוון אבסטומני, ואז פנו לדרך המקומית וטפסו כ-6 ק"מ עד
    הכפר חאני, שם מסתיימת הדרך העבירה לרכב. בסך הכול כ-232 ק"מ ו-3 שעות ו-40 דקות. הקטע האחרון הוא דרך
    חצץ, אבל במזג אוויר יבש רכב אקונומי יסתדר. תדלקו בזסטפוני או בבגדאתי.
ar:
  name: شلال خاني
  short: 'شلال قليل الشهرة في أعالي وادي خانيستسكالي فوق باغداتي: طريق قروي، ودرب في الغابة، وماء قلّما
    يراه الزائرون.'
  body: >-
    **شلال خاني ليس على طريق أي مكان: تقود سيارتك حتى آخر بيت في قرية خاني، ثم تتركها وتتبع النهر إلى
    داخل الغابة حتى تسمع هديره.**


    يقع الشلال في بلدية باغداتي، في الوادي الأعلى لنهر خانيستسكالي، على ارتفاع نحو 790 مترًا فوق سطح البحر،
    أعلى قرية خاني. ينحدر النهر من سلسلة جبال مسخيتي، ويمر عبر باغداتي، ثم يصبّ في ريوني. لم يُنشر ارتفاع
    الشلال في أي مكان قط.


    ما يمكننا أن نعد به هو الطريق إليه: بالسيارة حتى القرية، ثم سيرًا على الأقدام في دروب وادٍ مشجّر؛
    وعلى الخريطة يقع الشلال على بعد كيلومترين إلى ثلاثة بعد آخر البيوت. إنها نزهة في نهايتها شلال، لا
    شلال بموقف سيارات. والماء هو سمة هذه الناحية كلها: فينابيع سايرمه المعدنية تقع على بعد نحو 20 كم غربًا
    في خط مستقيم، وفي الطريق تمرّ بباغداتي ومتحف بيت ماياكوفسكي.


    تعالَ بفضول لا بقائمة مهام، ولن يخيّب الوادي ظنك.
  tip: >-
    لا لافتات ولا مرافق مؤكدة في الموقع، والدخول مجاني. في خاني اسأل السكان عن الدرب الذي تسلكه وإلى أي
    حد يمكن للسيارة أن تمضي في طريق الغابة. ارتدِ حذاءً مانعًا للانزلاق واحمل الماء والطعام، ولا تعوّل
    على وجود متجر فوق القرية. يصبح الدرب زلقًا بعد المطر؛ وأفضل فترة من مايو إلى أكتوبر، وعادة ما يبلغ
    التدفق ذروته في الربيع مع ذوبان الثلوج. يستغرق المشي ذهابًا وإيابًا أكثر من ساعة بكثير، فخصّص للزيارة
    كلها ساعتين إلى ثلاث، ولا تنطلق في وقت متأخر بعد الظهر.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا مرورًا بغوري وخاشوري حتى زيستافوني (نحو 185 كم)، ثم الطريق Sh54
    باتجاه الجنوب الغربي إلى باغداتي. ومن باغداتي تابع الطريق Sh14 نحو أباستوماني لمسافة 10 كم تقريبًا،
    ثم انعطف إلى الطريق المحلي واصعد نحو 6 كم حتى قرية خاني، حيث ينتهي الطريق الصالح للسيارات. المسافة
    الإجمالية نحو 232 كم و3 ساعات و40 دقيقة. المقطع الأخير حصوي، لكن السيارة الاقتصادية تتدبّر أمرها في
    الطقس الجاف. املأ الخزان في زيستافوني أو باغداتي.
