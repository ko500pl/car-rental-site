ka:
  name: დიმიტრი შევარდნაძის სახელობის ეროვნული გალერეა
  short: >-
    ფიროსმანის 54 ნამუშევარი ოთხ დარბაზში, რუსთაველის გამზირზე — გალერეაში, რომლის დაარსებაშიც ბერიას
    წინააღმდეგ გამოსულმა მხატვარმა მიიღო მონაწილეობა.
  body: >-
    **1917 წელს მხატვარმა დიმიტრი შევარდნაძემ ნიკო ფიროსმანის სურათები საკუთარ ბინაში გამოფინა; სამი წლის
    შემდეგ საქართველოს პირველი ეროვნული გალერეის დაარსებას შეუწყო ხელი, დღეს კი ფიროსმანს ამ გალერეაში
    ოთხი დარბაზი უჭირავს.**


    შენობა გალერეაზე ძველია. ის 1888 წელს, რუსეთის იმპერატორის გადაწყვეტილებით, რუსული სამხედრო-ისტორიული
    მუზეუმისთვის — „დიდების ტაძრისთვის“ — აშენდა მაშინდელ გოლოვინის, ახლანდელ რუსთაველის გამზირზე. პირველი
    სამხატვრო გამოფენა აქ 1920 წლის ოქტომბერში გაიხსნა. თბილისელები დღემდე „ცისფერ გალერეას“ ეძახიან —
    ფასადის ოდინდელი მოლურჯო-მომწვანო შეღებვის გამო, თუმცა კედლები ახლა ნაცრისფერია. 2007 წლიდან გალერეა
    საქართველოს ეროვნული მუზეუმის ნაწილია; განახლების შემდეგ ორ დარბაზს შუშის ჭერიდან ეფინება დღის შუქი.


    აქ მოსვლის მთავარი მიზეზი ფიროსმანის დარბაზებია: ორმოცდათოთხმეტი ნამუშევარი, მათ შორის „მსახიობი მარგარიტა“
    და „ჟირაფი“. რეპროდუქცია მას აპატარავებს. ორიგინალებში ფიგურები შავი მუშამბიდან ამოიზრდებიან, ცხოველები
    უცნაური გულწრფელობით გიყურებენ, სუფრები კი თითქოს ნამდვილი სტუმრებისთვისაა გაშლილი. თუ ექსპოზიციაში
    XX საუკუნის მხატვრებიც — ლადო გუდიაშვილი, დავით კაკაბაძე — დაგხვდებათ, მათთანაც შეჩერდით: ისინი გიჩვენებენ,
    საით წავიდა ქართული მხატვრობა შემდეგ.


    შევარდნაძის აღსასრულიც ამ ამბის ნაწილია. 1937 წელს ლავრენტი ბერიამ შუა საუკუნეების მეტეხის ტაძრის
    დანგრევა განიზრახა; მის წინააღმდეგ გამოსულ ინტელიგენციას შევარდნაძე მეთაურობდა. ბერიამ მას შესთავაზა,
    მომავალი მუზეუმის დირექტორი გამხდარიყო, სადაც ტაძრის მაკეტი შეინახებოდა — ოღონდ ბრძოლაზე ხელი აეღო.
    მხატვარმა უარი თქვა, დააპატიმრეს და დახვრიტეს. ტაძარი დღემდე დგას.


    მოგვიანებით, როცა მტკვრის თავზე, კლდეზე შემდგარ მეტეხს დაინახავთ, გაიხსენეთ, ვინ გადაიხადა ამ ხედის
    ფასი.
  tip: >-
    ღიაა სამშაბათიდან კვირამდე, 10:00–18:00; ორშაბათს დაკეტილია. ზრდასრულის ბილეთი ბოლო დროს საგრძნობლად
    გაძვირდა — 2026 წლის ცნობებით დაახლოებით 40 ლარია, ცოტა ხნის წინ კი 25 ლარი ღირდა, — ამიტომ წასვლამდე
    museum.ge გადაამოწმეთ და შეღავათებზეც იკითხეთ. დათვალიერებას საათნახევარი დაუთმეთ და პირდაპირ ფიროსმანის
    დარბაზებისკენ წადით, სანამ თვალი არ დაგღლიათ; პირველი სართული დროებით გამოფენებს ეთმობა. შუადღისას,
    ტურისტულ ჯგუფებს შორის, დარბაზები ხშირად თითქმის ცარიელია.
  route: >-
    გალერეა რუსთაველის გამზირის №11-შია, 9 აპრილის ბაღის გვერდით, თავისუფლების მოედანსა და ოპერას შორის
    — ცენტრიდან სულ რაღაც კილომეტრზე, ცენტრალური სასტუმროების უმეტესობიდან მანქანით 10–15 წუთში. მთავარი
    საკითხი პარკინგია: რუსთაველზე გაჩერება აკრძალულია, ამიტომ ისარგებლეთ თავისუფლების მოედნის მიწისქვეშა
    ავტოსადგომით ან ორბელიანის მოედნის მიმდებარე ფასიანი ზონით (Tbilisi Parking-ის აპლიკაცია) და ხუთი
    წუთი ფეხით გაიარეთ. 18:00-ის შემდეგ გამზირი იჭედება — დილა ჯობია. ნებისმიერი ეკონომკლასის მანქანა
    გამოდგება, თუმცა თუ ცენტრში ცხოვრობთ, მეტრო — სადგურები „რუსთაველი“ ან „თავისუფლების მოედანი“ — მანქანას
    ნამდვილად სჯობს.
en:
  name: National Gallery (Blue Gallery)
  short: >-
    Fifty-four Pirosmanis in four rooms on Rustaveli Avenue, in a gallery co-founded by a painter who
    died for defying Beria.
  body: >-
    **In 1917 the painter Dimitri Shevardnadze hung Niko Pirosmani's pictures in his own apartment; three
    years later he helped open Georgia's first national gallery, and today Pirosmani fills four of its
    rooms.**


    The building is older than the gallery. It went up in 1888, by decision of the Russian emperor, for
    the Russian Military History Museum, the "Temple of Glory", on what was then Golovin Street and is
    now Rustaveli Avenue. The first art exhibition opened here in October 1920. Tbilisians still call
    it the Blue Gallery, after the blue-green paint that once covered the façade, although the walls are
    grey today. Since 2007 it has belonged to the Georgian National Museum, and after the renovation that
    followed, two of its halls are lit from above through glass ceilings.


    The Pirosmani rooms are the reason to come: fifty-four works, "Actress Margarita" and "Giraffe" among
    them. Reproductions shrink him. In the originals his figures rise out of black oilcloth, the animals
    look back at you with unsettling frankness, and the feasts seem laid for real guests. If twentieth-century
    painters such as Lado Gudiashvili and David Kakabadze are on show, stay with them too: they show where
    Georgian painting went next.


    Shevardnadze's own ending belongs to this story. In 1937 Lavrentiy Beria set out to demolish the medieval
    Metekhi church, and Shevardnadze led the intellectuals who stood against him. Beria offered him the
    directorship of a future museum that would keep a scale model of the church, if only he would let
    the matter go. He refused, and was arrested and executed. The church still stands.


    Later, when you see Metekhi on its cliff above the Mtkvari, remember who paid for that view.
  tip: >-
    Open Tuesday to Sunday, 10:00–18:00; closed on Mondays. Adult tickets have risen steeply, to about
    40 GEL in 2026 reports against 25 GEL not long before, so check museum.ge before you go and ask about
    concessions. Allow ninety minutes and head straight for the Pirosmani rooms while your eyes are fresh;
    the ground floor is given over to temporary exhibitions. Midday, between tour groups, is often the
    quietest time.
  route: >-
    The gallery is at 11 Rustaveli Avenue, beside 9 April Park, between Freedom Square and the Opera:
    barely a kilometre from the centre and 10–15 minutes by car from most central hotels. Parking is the
    real question. Rustaveli is a no-stopping zone, so use the Freedom Square underground car park or
    the paid street zone around Orbeliani Square (Tbilisi Parking app) and walk five minutes. After 18:00
    the avenue jams, so mornings are easier. Any economy car will do, though if you are staying centrally,
    the metro to Rustaveli or Liberty Square station honestly beats driving.
ru:
  name: Национальная галерея (Голубая галерея)
  short: >-
    Пятьдесят четыре Пиросмани в четырёх залах на проспекте Руставели — в галерее, которую помог основать
    художник, поплатившийся жизнью за вызов Берии.
  body: >-
    **В 1917 году художник Димитрий Шеварднадзе развесил картины Нико Пиросмани у себя в квартире; через
    три года он помог открыть первую национальную галерею Грузии, и сегодня Пиросмани занимает в ней четыре
    зала.**


    Здание старше галереи. Его возвели в 1888 году по решению российского императора для Русского военно-исторического
    музея — «Храма славы» — на тогдашнем Головинском проспекте, нынешнем проспекте Руставели. Первая художественная
    выставка открылась здесь в октябре 1920 года. Тбилисцы до сих пор называют галерею Голубой — по сине-зелёной
    краске, когда-то покрывавшей фасад, хотя сегодня стены серые. С 2007 года галерея входит в Национальный
    музей Грузии, и после последовавшей реконструкции два её зала освещаются сверху, через стеклянные
    потолки.


    Ради залов Пиросмани сюда и стоит идти: пятьдесят четыре работы, среди них «Актриса Маргарита» и «Жираф».
    Репродукции его уменьшают. В подлинниках фигуры проступают из чёрной клеёнки, звери смотрят на вас
    с тревожащей прямотой, а пиршественные столы будто накрыты для настоящих гостей. Если в экспозиции
    окажутся художники XX века — например, Ладо Гудиашвили и Давид Какабадзе, — задержитесь и у них: они
    показывают, куда грузинская живопись двинулась дальше.


    Собственный финал Шеварднадзе — часть этой истории. В 1937 году Лаврентий Берия задумал снести средневековую
    церковь Метехи, и Шеварднадзе возглавил интеллигенцию, выступившую против. Берия предложил ему пост
    директора будущего музея, где хранился бы макет церкви, — лишь бы тот отступился. Он отказался, был
    арестован и расстрелян. Церковь стоит до сих пор.


    Когда потом увидите Метехи на скале над Курой, вспомните, кто заплатил за этот вид.
  tip: >-
    Галерея открыта со вторника по воскресенье, 10:00–18:00; понедельник — выходной. Взрослый билет резко
    подорожал: по сообщениям 2026 года — около 40 лари, тогда как незадолго до этого стоил 25, так что
    перед визитом проверьте цену на museum.ge и спросите о льготах. Отведите на осмотр полтора часа и
    идите прямо в залы Пиросмани, пока глаз не устал; первый этаж отдан под временные выставки. Спокойнее
    всего обычно в полдень, между туристическими группами.
  route: >-
    Галерея находится на проспекте Руставели, 11, рядом с парком 9 Апреля, между площадью Свободы и Оперой:
    едва километр от центра и 10–15 минут на машине от большинства центральных отелей. Главный вопрос
    — парковка. На Руставели остановка запрещена, поэтому воспользуйтесь подземной парковкой на площади
    Свободы или платной уличной зоной у площади Орбелиани (приложение Tbilisi Parking) и пройдите пять
    минут пешком. После 18:00 проспект встаёт в пробках, так что утром проще. Подойдёт любая машина эконом-класса,
    но если вы живёте в центре, метро до станции «Руставели» или «Площадь Свободы», честно говоря, удобнее
    машины.
fa:
  name: گالری ملی تفلیس (گالری آبی)
  short: >-
    پنجاه‌وچهار اثر پیروسمانی در چهار تالار در خیابان روستاولی، در گالری‌ای که یکی از بنیان‌گذارانش نقاشی
    بود که بر سر ایستادگی در برابر بریا جان باخت.
  body: >-
    **در ۱۹۱۷ دیمیتری شواردنادزهٔ نقاش تابلوهای نیکو پیروسمانی را در آپارتمان خودش به دیوار آویخت؛ سه
    سال بعد در گشایش نخستین گالری ملی گرجستان سهم داشت، و امروز آثار پیروسمانی چهار تالار آن را پر کرده
    است.**


    ساختمان از گالری کهن‌تر است. این بنا در ۱۸۸۸ به فرمان امپراتور روسیه برای موزهٔ تاریخ نظامی روسیه،
    «معبد افتخار»، در خیابانی ساخته شد که آن زمان گالووین نام داشت و امروز خیابان روستاولی است. نخستین
    نمایشگاه هنری در اکتبر ۱۹۲۰ در این‌جا گشوده شد. مردم تفلیس هنوز آن را «گالری آبی» می‌نامند، به یاد
    رنگ آبی‌سبزی که زمانی نمای ساختمان را می‌پوشاند، هرچند دیوارها امروز خاکستری‌اند. از ۲۰۰۷ گالری به
    موزهٔ ملی گرجستان تعلق دارد و پس از نوسازی‌ای که در پی آن آمد، دو تالارش از بالا و از میان سقف‌های
    شیشه‌ای روشن می‌شوند.


    تالارهای پیروسمانی دلیل آمدن به این‌جایند: پنجاه‌وچهار اثر، از جمله «مارگاریتای بازیگر» و «زرافه».
    نسخه‌های چاپی او را کوچک می‌کنند. در اصل آثار، پیکره‌ها از دل مشمع سیاه سر برمی‌آورند، جانوران با
    صراحتی نگران‌کننده به شما خیره می‌شوند و سفره‌های ضیافت گویی برای مهمانانی واقعی گسترده شده‌اند. اگر
    آثار نقاشان سدهٔ بیستم، چون لادو گودیاشویلی و داوید کاکابادزه، در معرض دید باشد، کنار آن‌ها هم درنگ
    کنید: نشان می‌دهند نقاشی گرجی پس از او به کجا رفت.


    پایان کار خود شواردنادزه هم بخشی از این داستان است. در ۱۹۳۷ لاورنتی بریا بر آن شد که کلیسای سده‌های
    میانهٔ متخی را ویران کند و شواردنادزه پیشاپیش روشنفکرانی ایستاد که در برابرش قد علم کردند. بریا به
    او پیشنهاد داد مدیر موزه‌ای آینده شود که ماکتی از کلیسا را نگه می‌داشت، به این شرط که از این ماجرا
    دست بکشد. او نپذیرفت، بازداشت و اعدام شد. کلیسا هنوز پابرجاست.


    بعدها که متخی را بر صخره‌اش بالای رود کورا دیدید، به یاد آورید چه کسی بهای این منظره را پرداخت.
  tip: >-
    سه‌شنبه تا یکشنبه، ۱۰:۰۰ تا ۱۸:۰۰ باز است؛ دوشنبه‌ها تعطیل. بلیت بزرگسالان به‌شدت گران شده است: بنا
    بر گزارش‌های ۲۰۲۶ حدود ۴۰ لاری، در برابر ۲۵ لاری اندکی پیش از آن؛ پس پیش از رفتن museum.ge را ببینید
    و دربارهٔ تخفیف‌ها بپرسید. نود دقیقه وقت بگذارید و تا چشمانتان خسته نشده یک‌راست به تالارهای پیروسمانی
    بروید؛ طبقهٔ همکف به نمایشگاه‌های موقت اختصاص دارد. نیمروز، میان گروه‌های تور، اغلب آرام‌ترین زمان
    است.
  route: >-
    گالری در شمارهٔ ۱۱ خیابان روستاولی است، کنار پارک ۹ آوریل، میان میدان آزادی و ساختمان اپرا: کمتر از
    یک کیلومتر از مرکز و ۱۰ تا ۱۵ دقیقه با خودرو از بیشتر هتل‌های مرکزی. پرسش اصلی پارکینگ است. توقف در
    روستاولی ممنوع است، پس از پارکینگ زیرزمینی میدان آزادی یا منطقهٔ پارک پولی کنار خیابان در اطراف میدان
    اوربلیانی (با اپلیکیشن Tbilisi Parking) استفاده کنید و پنج دقیقه پیاده بروید. پس از ساعت ۱۸:۰۰ خیابان
    بند می‌آید، پس صبح آسان‌تر است. هر خودروی اقتصادی کافی است، اما اگر در مرکز شهر اقامت دارید، راستش
    مترو تا ایستگاه روستاولی یا میدان آزادی از رانندگی بهتر است.
he:
  name: הגלריה הלאומית (הגלריה הכחולה)
  short: >-
    חמישים וארבע יצירות של פירוסמני בארבעה אולמות בשדרות רוסתוולי, בגלריה שבייסודה השתתף צייר ששילם בחייו
    על שעמד מול בריה.
  body: >-
    **ב־1917 תלה הצייר דימיטרי שוורדנאדזה את ציוריו של ניקו פירוסמני בדירתו שלו; שלוש שנים אחר כך עזר
    לפתוח את הגלריה הלאומית הראשונה של גאורגיה, והיום פירוסמני ממלא ארבעה מאולמותיה.**


    הבניין ותיק מן הגלריה. הוא הוקם ב־1888, בהחלטת הקיסר הרוסי, עבור המוזיאון הרוסי להיסטוריה צבאית, "היכל
    התהילה", ברחוב שנקרא אז רחוב גולובין וכיום הוא שדרות רוסתוולי. התערוכה האמנותית הראשונה נפתחה כאן
    באוקטובר 1920. תושבי טביליסי עדיין קוראים לה הגלריה הכחולה, על שם הצבע הכחול־ירקרק שכיסה פעם את החזית,
    אף שהקירות אפורים היום. מאז 2007 היא שייכת למוזיאון הלאומי של גאורגיה, ואחרי השיפוץ שבא בעקבות זאת,
    שניים מאולמותיה מוארים מלמעלה דרך תקרות זכוכית.


    אולמות פירוסמני הם הסיבה לבוא: חמישים וארבע יצירות, ביניהן "השחקנית מרגריטה" ו"ג'ירפה". הרפרודוקציות
    מקטינות אותו. במקור, הדמויות שלו עולות מתוך שעוונית שחורה, החיות מביטות בכם בגילוי לב מטריד, והשולחנות
    הערוכים נראים כאילו נערכו לאורחים של ממש. אם מוצגים ציירים מן המאה העשרים, כמו לאדו גודיאשווילי ודוד
    קקבדזה, התעכבו גם לידם: הם מראים לאן הלך הציור הגאורגי אחר כך.


    גם סופו של שוורדנאדזה עצמו שייך לסיפור הזה. ב־1937 ביקש לברנטי בריה להרוס את כנסיית מטחי מימי הביניים,
    ושוורדנאדזה עמד בראש אנשי הרוח שהתייצבו נגדו. בריה הציע לו לעמוד בראש מוזיאון עתידי שישמור דגם מוקטן
    של הכנסייה, ובלבד שירפה מן העניין. הוא סירב, נעצר והוצא להורג. הכנסייה עדיין עומדת.


    אחר כך, כשתראו את מטחי על צוקה מעל המטקווארי, זכרו מי שילם על הנוף הזה.
  tip: >-
    פתוח בימים שלישי עד ראשון, 10:00–18:00; סגור בימי שני. מחיר הכרטיס למבוגרים זינק: כ־40 לארי לפי דיווחים
    מ־2026, לעומת 25 לארי זמן לא רב קודם לכן, לכן בדקו ב־museum.ge לפני הביקור ושאלו על הנחות. הקדישו
    שעה וחצי ולכו ישר לאולמות פירוסמני כל עוד העיניים רעננות; קומת הקרקע מוקדשת לתערוכות מתחלפות. בצהריים,
    בין קבוצות התיירים, בדרך כלל הכי שקט.
  route: >-
    הגלריה נמצאת בשדרות רוסתוולי 11, ליד פארק 9 באפריל, בין כיכר החירות לבית האופרה: בקושי קילומטר מהמרכז
    ו־10–15 דקות נסיעה מרוב המלונות המרכזיים. השאלה האמיתית היא חנייה. ברוסתוולי העצירה אסורה, לכן השתמשו
    בחניון התת־קרקעי של כיכר החירות או באזור החנייה בתשלום ברחוב סביב כיכר אורבליאני (אפליקציית Tbilisi
    Parking) ולכו חמש דקות ברגל. אחרי 18:00 השדרה נפקקת, כך שבבוקר קל יותר. כל רכב בקטגוריית אקונומי יתאים,
    אבל אם אתם לנים במרכז, האמת היא שהמטרו לתחנת רוסתוולי או כיכר החירות עדיף על נהיגה.
ar:
  name: المعرض الوطني في تبليسي (المعرض الأزرق)
  short: >-
    أربع وخمسون لوحة لبيروسماني في أربع قاعات بجادة روستافيلي، في معرض شارك في تأسيسه رسام دفع حياته ثمنًا
    لتحدّي بيريا.
  body: >-
    **في عام 1917 علّق الرسام ديميتري شيفاردنادزه لوحات نيكو بيروسماني في شقته الخاصة؛ وبعد ثلاث سنوات
    أسهم في افتتاح أول معرض وطني في جورجيا، واليوم يملأ بيروسماني أربعًا من قاعاته.**


    المبنى أقدم من المعرض. فقد شُيّد عام 1888، بقرار من الإمبراطور الروسي، ليكون متحفًا روسيًا للتاريخ
    العسكري أُطلق عليه «معبد المجد»، في ما كان يُعرف آنذاك بشارع غولوفين، وهو اليوم جادة روستافيلي. وافتُتح
    فيه أول معرض فني في أكتوبر 1920. وما زال أهل تبليسي يسمّونه المعرض الأزرق، نسبةً إلى الطلاء الأزرق
    المخضرّ الذي كان يكسو الواجهة ذات يوم، مع أن الجدران رمادية اليوم. ومنذ 2007 يتبع المعرضُ المتحفَ
    الوطني الجورجي، وبعد التجديد الذي تلا ذلك باتت قاعتان من قاعاته تُضاءان من الأعلى عبر أسقف زجاجية.


    قاعات بيروسماني هي سبب المجيء: أربعة وخمسون عملًا، منها «الممثلة مارغريتا» و«الزرافة». النسخ المطبوعة
    تصغّره. أما في الأصل فتنبثق شخوصه من قماش مشمّع أسود، وتبادلكم الحيوانات النظر بصراحة مقلقة، وتبدو
    الموائد كأنها مُدّت لضيوف حقيقيين. وإن كانت أعمال رسامي القرن العشرين، مثل لادو غودياشفيلي ودافيد
    كاكابادزه، معروضة، فتمهّلوا عندها أيضًا: فهي تكشف إلى أين مضى الرسم الجورجي بعده.


    ونهاية شيفاردنادزه نفسه جزء من هذه الحكاية. ففي عام 1937 عزم لافرنتي بيريا على هدم كنيسة ميتيخي التي
    تعود إلى العصور الوسطى، فتصدّر شيفاردنادزه المثقفين الذين وقفوا في وجهه. وعرض عليه بيريا إدارة متحف
    مستقبلي يحفظ مجسّمًا مصغرًا للكنيسة، شرط أن يتخلى عن القضية. فرفض، واعتُقل وأُعدم. والكنيسة ما زالت
    قائمة.


    وحين ترون لاحقًا ميتيخي على جرفها فوق نهر كورا، تذكّروا من دفع ثمن هذا المشهد.
  tip: >-
    يفتح من الثلاثاء إلى الأحد، 10:00–18:00، ويُغلق أيام الاثنين. ارتفع سعر تذكرة البالغين ارتفاعًا حادًا:
    نحو 40 لاري بحسب تقارير 2026، مقابل 25 لاري قبل ذلك بقليل، فتحقّقوا من museum.ge قبل الذهاب واسألوا
    عن التخفيضات. خصّصوا تسعين دقيقة، وتوجّهوا مباشرةً إلى قاعات بيروسماني ما دامت أعينكم منتعشة؛ فالطابق
    الأرضي مخصص للمعارض المؤقتة. وكثيرًا ما يكون منتصف النهار، بين المجموعات السياحية، أهدأ الأوقات.
  route: >-
    يقع المعرض في الرقم 11 بجادة روستافيلي، بجوار حديقة 9 أبريل، بين ساحة الحرية ودار الأوبرا: على بعد
    كيلومتر بالكاد من المركز، و10–15 دقيقة بالسيارة من معظم الفنادق المركزية. المسألة الحقيقية هي الموقف.
    فالتوقف ممنوع في جادة روستافيلي، لذا استخدموا الموقف تحت الأرض في ساحة الحرية أو منطقة الوقوف المدفوع
    في الشارع حول ساحة أوربيلياني (تطبيق Tbilisi Parking)، ثم امشوا خمس دقائق. بعد 18:00 تختنق الجادة
    بالزحام، فالصباح أيسر. تكفي أي سيارة من الفئة الاقتصادية، لكن إن كنتم تقيمون في المركز فالمترو إلى
    محطة روستافيلي أو ساحة الحرية، بصراحة، أفضل من القيادة.
