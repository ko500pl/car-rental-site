ka:
  name: დიმიტრი შევარდნაძის სახელობის ეროვნული გალერეა
  short: მთავარი სამხატვრო გალერეა რუსთაველზე — ფიროსმანის უდიდესი კოლექცია, გუდიაშვილი და კაკაბაძე ერთ
    ჭერქვეშ.
  body: >-
    **ფიროსმანის ნახატებს რეპროდუქციებით ყველა იცნობს — აქ კი ორიგინალები ჰკიდია, ერთ დარბაზში, ერთმანეთის
    გვერდით.** ეროვნული გალერეა რუსთაველის გამზირზე, 9 აპრილის ბაღის პირას დგას. შენობა 1888 წელს რუსული
    სამხედრო-ისტორიული მუზეუმისთვის აშენდა და „დიდების ტაძარი" ერქვა; 1920 წელს მხატვარმა დიმიტრი შევარდნაძემ
    აქ პირველი ეროვნული სამხატვრო გალერეა გახსნა, ხალხი კი დღემდე „ცისფერ გალერეას" ეძახის. 2007 წლიდან
    საქართველოს ეროვნული მუზეუმის ნაწილია და სრულად განახლდა — ზედა დარბაზებს შუშის ჭერიდან ბუნებრივი
    შუქი ეფინება.


    მუდმივ ექსპოზიციაში სამი სახელი დომინირებს:


    - **ნიკო ფიროსმანი** — „მსახიობი მარგარიტა", ლომები, ირმები და სუფრები; ორიგინალების ზომა და შავი
    ფონი რეპროდუქციაზე მეტად გაოცებს

    - **ლადო გუდიაშვილი** — ფანტასმაგორიული ქეიფები და მოლივლივე ქალის ფიგურები

    - **დავით კაკაბაძე** — იმერეთის პეიზაჟები და 1920-იანი წლების ავანგარდი


    თავად შევარდნაძის ბედი, რომელმაც ამ კოლექციის დიდი ნაწილი გადაარჩინა, ცალკე ისტორიაა — ის 1937 წელს
    სტალინურ რეპრესიებს ემსხვერპლა. პირველი სართული დროებით გამოფენებს ეთმობა. დათვალიერებას საათ-ნახევარი
    ჰყოფნის; შუადღისას, ჯგუფებს შორის, დარბაზები თითქმის ცარიელია.
  tip: >-
    ორშაბათს დაკეტილია; სამუშაო დროა სამშაბათი–კვირა 10:00–18:00, ბოლო შესვლა 17:30. ბილეთი ბოლო წლებში
    გაძვირდა — ზრდასრულისთვის 25 ლარამდე, სტუდენტებს სოლიდური ფასდაკლება აქვთ; ბარათით გადახდა შესაძლებელია.
    ფიროსმანის დარბაზში აუდიოსადგურებია. რუსთაველზე გაჩერება აკრძალულია — მანქანა თავისუფლების მოედნის
    მიწისქვეშა პარკინგზე ან ორბელიანის მოედანთან დატოვე და ხუთი წუთი ფეხით იარე.
  route: >-
    გალერეა რუსთაველის გამზირის 11 ნომერშია, ოპერის თეატრსა და თავისუფლების მოედანს შორის — ქალაქის ცენტრის
    ნებისმიერი წერტილიდან მანქანით 10–15 წუთია. მთავარი საკითხი პარკინგია: თავად გამზირზე გაჩერება იკრძალება,
    ამიტომ მიდი თავისუფლების მოედნის მიწისქვეშა ავტოსადგომზე ან ორბელიანის მოედნის ირგვლივ ფასიან ზონაში
    (Tbilisi Parking-ის აპი). საღამოს 18:00-ის შემდეგ რუსთაველი იჭედება — დილა ჯობია. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია; ცენტრში მცხოვრებთათვის მეტრო „რუსთაველი" ან „თავისუფლების მოედანი" ხშირად მანქანაზე
    სწრაფია.
en:
  name: National Gallery (Blue Gallery)
  short: >-
    Georgia's main picture gallery on Rustaveli Avenue — the biggest Pirosmani collection anywhere, plus
    Gudiashvili and Kakabadze.
  body: >-
    **Everyone knows Pirosmani from reproductions — here the originals hang side by side in a single hall.**
    The National Gallery stands on Rustaveli Avenue at the edge of 9 April Park. The building went up
    in 1888 as the "Temple of Glory", a Russian military-history museum; in 1920 the painter Dimitri Shevardnadze
    opened Georgia's first national art gallery here, and locals still call it the Blue Gallery after
    its old facade colour. Since 2007 it has been part of the Georgian National Museum and was thoroughly
    renovated — the upper halls get natural light through glass ceilings.


    Three names dominate the permanent display:


    - **Niko Pirosmani** — "Actress Margarita", the lions, deer and feast scenes; the sheer size and black
    backgrounds of the originals surprise more than any print

    - **Lado Gudiashvili** — phantasmagorical feasts and drifting female figures

    - **David Kakabadze** — Imereti landscapes and 1920s avant-garde experiments


    The fate of Shevardnadze himself, who saved much of this collection, belongs to the story too: he
    perished in Stalin's purges in 1937. The ground floor rotates temporary shows. An hour and a half
    covers it comfortably, and at midday, between tour groups, you often have the halls almost to yourself.
  tip: >-
    Closed Mondays; open Tuesday–Sunday 10:00–18:00, last entry 17:30. Tickets have climbed sharply in
    recent years — around 25 GEL for adults at last report, with big student discounts; cards are accepted.
    Audio stations explain the Pirosmani rooms. There is no parking on Rustaveli itself: leave the car
    in the Freedom Square underground garage or the paid zone around Orbeliani Square and walk five minutes.
  route: >-
    The gallery is at 11 Rustaveli Avenue, between the Opera House and Freedom Square — a 10–15 minute
    drive from anywhere central in Tbilisi. Parking is the real question: Rustaveli is a no-stopping zone,
    so aim for the Freedom Square underground car park or the metered streets near Orbeliani Square and
    pay through the Tbilisi Parking app. After 6 pm the avenue jams solid, so mornings are easier. Any
    economy rental handles this; if your hotel is central, the metro (Rustaveli or Liberty Square stations)
    honestly beats driving.
ru:
  name: Национальная галерея им. Д. Шеварднадзе
  short: >-
    Главная картинная галерея Грузии на Руставели — крупнейшая коллекция Пиросмани, а также Гудиашвили
    и Какабадзе.
  body: >-
    **Пиросмани все знают по репродукциям — здесь подлинники висят рядом, в одном зале.** Национальная
    галерея стоит на проспекте Руставели, у парка 9 Апреля. Здание построили в 1888 году как «Храм славы»
    — музей русской военной истории; в 1920-м художник Дмитрий Шеварднадзе открыл здесь первую национальную
    картинную галерею, и горожане до сих пор зовут её «Голубой галереей» по старому цвету фасада. С 2007
    года она входит в Грузинский национальный музей и полностью отреставрирована — верхние залы освещены
    естественным светом через стеклянные потолки.


    В постоянной экспозиции доминируют три имени:


    - **Нико Пиросмани** — «Актриса Маргарита», львы, олени и застолья; размер подлинников и чёрный фон
    впечатляют сильнее любой репродукции

    - **Ладо Гудиашвили** — фантасмагорические пиры и плывущие женские фигуры

    - **Давид Какабадзе** — имеретинские пейзажи и авангард 1920-х


    Судьба самого Шеварднадзе, спасшего значительную часть коллекции, — отдельная глава: в 1937 году он
    погиб в сталинских репрессиях. Первый этаж отдан временным выставкам. На осмотр хватает полутора часов;
    в середине дня, между экскурсионными группами, залы почти пусты.
  tip: >-
    Понедельник — выходной; часы работы вторник–воскресенье 10:00–18:00, последний вход в 17:30. Билеты
    в последние годы заметно подорожали — около 25 лари для взрослых, студентам большие скидки; карты
    принимают. В залах Пиросмани есть аудиостанции. На самом Руставели парковки нет: оставьте машину на
    подземной стоянке у площади Свободы или в платной зоне у площади Орбелиани и пройдите пять минут пешком.
  route: >-
    Галерея находится на проспекте Руставели, 11, между Оперным театром и площадью Свободы — из любой
    точки центра Тбилиси 10–15 минут на машине. Главный вопрос — парковка: на Руставели остановка запрещена,
    поэтому цельтесь на подземный паркинг у площади Свободы или платные улицы у площади Орбелиани (оплата
    через приложение Tbilisi Parking). После 18:00 проспект намертво стоит в пробке — утром проще. Машины
    эконом-класса более чем достаточно; если отель в центре, метро («Руставели» или «Площадь Свободы»)
    честно выигрывает у автомобиля.
fa:
  name: گالری ملی تفلیس (گالری آبی)
  short: >-
    گالری اصلی نقاشی گرجستان در خیابان روستاولی — بزرگ‌ترین مجموعهٔ آثار پیروسمانی، به‌علاوهٔ گودیاشویلی
    و کاکابادزه.
  body: >-
    **پیروسمانی را همه از روی چاپ‌ها می‌شناسند — اینجا اصل تابلوها کنار هم در یک تالار آویخته‌اند.** گالری
    ملی در خیابان روستاولی، کنار پارک ۹ آوریل ایستاده است. ساختمان در ۱۸۸۸ به‌عنوان «معبد افتخار»، موزهٔ
    تاریخ نظامی روسیه، بالا رفت؛ در ۱۹۲۰ نقاش دیمیتری شواردنادزه نخستین گالری ملی هنر گرجستان را در آن
    گشود و مردم شهر هنوز به یاد رنگ قدیمی نما آن را «گالری آبی» می‌نامند. از ۲۰۰۷ بخشی از موزهٔ ملی گرجستان
    است و پس از بازسازی کامل، تالارهای بالایی از سقف‌های شیشه‌ای نور طبیعی می‌گیرند.


    در نمایش دائمی سه نام برجسته‌اند:


    - **نیکو پیروسمانی** — «بازیگر مارگاریتا»، شیرها، گوزن‌ها و صحنه‌های ضیافت؛ ابعاد اصل آثار و زمینه‌های
    سیاهشان بیش از هر چاپی غافلگیر می‌کند

    - **لادو گودیاشویلی** — ضیافت‌های وهم‌آلود و پیکرهای شناور زنانه

    - **داویت کاکابادزه** — چشم‌اندازهای ایمرتی و تجربه‌های آوانگارد دههٔ ۱۹۲۰


    سرنوشت خود شواردنادزه، که بخش بزرگی از این مجموعه را نجات داد، هم بخشی از داستان است: او در ۱۹۳۷ قربانی
    تصفیه‌های استالین شد. طبقهٔ همکف به نمایشگاه‌های موقت اختصاص دارد. یک ساعت و نیم برای بازدید کافی
    است و میانهٔ روز، بین گروه‌های تور، تالارها تقریباً در اختیار خودتان است.
  tip: >-
    دوشنبه‌ها تعطیل است؛ سه‌شنبه تا یکشنبه ۱۰:۰۰ تا ۱۸:۰۰ باز است و آخرین ورود ۱۷:۳۰ است. بهای بلیت در
    سال‌های اخیر بالا رفته — برای بزرگسالان حدود ۲۵ لاری، با تخفیف چشمگیر برای دانشجویان؛ پرداخت با کارت
    ممکن است. در تالارهای پیروسمانی ایستگاه‌های صوتی هست. در خود روستاولی پارکینگ نیست: خودرو را در پارکینگ
    زیرزمینی میدان آزادی یا محدودهٔ پولی اطراف میدان اوربلیانی بگذارید و پنج دقیقه پیاده بروید.
  route: >-
    گالری در شمارهٔ ۱۱ خیابان روستاولی، میان تئاتر اپرا و میدان آزادی است — از هر نقطهٔ مرکزی تفلیس ۱۰
    تا ۱۵ دقیقه رانندگی. مسئلهٔ اصلی پارک است: توقف در روستاولی ممنوع است، پس سراغ پارکینگ زیرزمینی میدان
    آزادی یا خیابان‌های پارکومتردار نزدیک میدان اوربلیانی بروید و با اپلیکیشن Tbilisi Parking بپردازید.
    بعد از ساعت ۱۸ خیابان کاملاً قفل می‌شود — صبح راحت‌تر است. خودروی اقتصادی کاملاً کافی است؛ اگر هتل‌تان
    مرکزی است، مترو (ایستگاه روستاولی یا میدان آزادی) به‌راستی از رانندگی بهتر است.
he:
  name: הגלריה הלאומית של טביליסי
  short: גלריית הציור הראשית של גאורגיה בשדרת רוסתוולי — אוסף פירוסמני הגדול בעולם, לצד גודיאשווילי וקקבאדזה.
  body: >-
    **את פירוסמני כולם מכירים מרפרודוקציות — כאן המקוריים תלויים זה לצד זה באולם אחד.** הגלריה הלאומית
    עומדת על שדרת רוסתוולי, בשולי פארק 9 באפריל. הבניין הוקם ב-1888 כ"מקדש התהילה", מוזיאון להיסטוריה
    צבאית רוסית; ב-1920 פתח בו הצייר דימיטרי שוורדנדזה את הגלריה הלאומית הראשונה של גאורגיה, ובעיר עדיין
    קוראים לה "הגלריה הכחולה" על שם צבע החזית הישן. מאז 2007 היא חלק מהמוזיאון הלאומי הגאורגי, ואחרי שיפוץ
    יסודי האולמות העליונים מוארים באור טבעי מבעד לתקרות זכוכית.


    בתצוגה הקבועה שולטים שלושה שמות:


    - **ניקו פירוסמני** — "השחקנית מרגריטה", האריות, האיילים וסצנות המשתה; גודל המקוריים והרקעים השחורים
    מפתיעים יותר מכל הדפס

    - **לאדו גודיאשווילי** — משתאות פנטסמגוריים ודמויות נשים מרחפות

    - **דוד קקבאדזה** — נופי אימרתי והאוונגרד של שנות העשרים


    גם גורלו של שוורדנדזה עצמו, שהציל חלק ניכר מהאוסף, שייך לסיפור: הוא נספה בטיהורים של סטלין ב-1937.
    קומת הקרקע מוקדשת לתערוכות מתחלפות. שעה וחצי מספיקה בנוחות, ובצהריים, בין קבוצות מודרכות, האולמות
    כמעט כולם שלכם.
  tip: >-
    סגור בימי שני; פתוח שלישי–ראשון 10:00–18:00, כניסה אחרונה 17:30. מחירי הכרטיסים עלו מאוד בשנים האחרונות
    — כ-25 לארי למבוגר לפי הדיווחים האחרונים, עם הנחות משמעותיות לסטודנטים; מקבלים כרטיסי אשראי. באולמות
    פירוסמני יש עמדות שמע. אין חניה ברוסתוולי עצמה: השאירו את הרכב בחניון התת-קרקעי בכיכר החירות או באזור
    בתשלום סביב כיכר אורבליאני, והליכה של חמש דקות.
  route: >-
    הגלריה נמצאת בשדרת רוסתוולי 11, בין בית האופרה לכיכר החירות — נסיעה של 10–15 דקות מכל מקום מרכזי בטביליסי.
    השאלה האמיתית היא החניה: ברוסתוולי אסור לעצור, אז כוונו לחניון התת-קרקעי של כיכר החירות או לרחובות
    בתשלום ליד כיכר אורבליאני, עם תשלום באפליקציית Tbilisi Parking. אחרי 18:00 השדרה נתקעת בפקק כבד —
    בבוקר קל יותר. כל רכב שכור חסכוני מספיק; אם המלון שלכם במרכז, המטרו (תחנת רוסתוולי או כיכר החירות)
    פשוט עדיף על נהיגה.
ar:
  name: المعرض الوطني في تبليسي (المعرض الأزرق)
  short: أهم معرض للفنون في جورجيا على جادة روستافيلي — أكبر مجموعة لأعمال بيروسماني، مع غودياشفيلي وكاكابادزه.
  body: >-
    **الجميع يعرف بيروسماني من النسخ المطبوعة — أما هنا فالأصول معلقة جنباً إلى جنب في قاعة واحدة.** يقع
    المعرض الوطني على جادة روستافيلي عند طرف حديقة 9 أبريل. شُيّد المبنى عام 1888 باسم «معبد المجد» متحفاً
    للتاريخ العسكري الروسي؛ وفي عام 1920 افتتح فيه الرسام ديميتري شيفرنادزه أول معرض وطني للفنون في جورجيا،
    وما زال أهل المدينة يسمونه «المعرض الأزرق» نسبة إلى لون واجهته القديم. ومنذ 2007 صار جزءاً من متحف
    جورجيا الوطني وجُدد بالكامل — فالقاعات العلوية تتلقى ضوءاً طبيعياً عبر سقوف زجاجية.


    ثلاثة أسماء تهيمن على العرض الدائم:


    - **نيكو بيروسماني** — «الممثلة مارغريتا» والأسود والغزلان ومشاهد الولائم؛ حجم الأصول وخلفياتها السوداء
    يدهشان أكثر من أي نسخة مطبوعة

    - **لادو غودياشفيلي** — ولائم وهمية الطابع ونساء كأنهن يطفون

    - **دافيت كاكابادزه** — مناظر إميريتي الطبيعية وتجارب طليعية من عشرينيات القرن الماضي


    ولمصير شيفرنادزه نفسه، الذي أنقذ جزءاً كبيراً من هذه المجموعة، فصلٌ موجع: فقد قضى في تصفيات ستالين
    عام 1937. الطابق الأرضي مخصص للمعارض المؤقتة. ساعة ونصف تكفي للزيارة بارتياح، وفي منتصف النهار، بين
    المجموعات السياحية، تكاد القاعات تكون لك وحدك.
  tip: >-
    مغلق أيام الاثنين؛ مفتوح من الثلاثاء إلى الأحد 10:00–18:00، وآخر دخول 17:30. ارتفعت أسعار التذاكر
    كثيراً في السنوات الأخيرة — نحو 25 لاري للبالغين وفق آخر التقارير، مع خصومات كبيرة للطلاب؛ الدفع بالبطاقة
    متاح. في قاعات بيروسماني محطات صوتية للشرح. لا يوجد موقف على روستافيلي نفسها: اترك السيارة في الموقف
    تحت الأرض عند ساحة الحرية أو في المنطقة المدفوعة قرب ساحة أوربلياني وامشِ خمس دقائق.
  route: >-
    المعرض في رقم 11 جادة روستافيلي، بين دار الأوبرا وساحة الحرية — 10 إلى 15 دقيقة بالسيارة من أي نقطة
    وسط تبليسي. السؤال الحقيقي هو الموقف: التوقف ممنوع على روستافيلي، فاقصد الموقف تحت الأرض عند ساحة
    الحرية أو الشوارع المدفوعة قرب ساحة أوربلياني، والدفع عبر تطبيق Tbilisi Parking. بعد السادسة مساءً
    تختنق الجادة بالزحام — الصباح أسهل. سيارة اقتصادية تكفي تماماً؛ وإن كان فندقك وسط المدينة فالمترو
    (محطة روستافيلي أو ساحة الحرية) أفضل من القيادة بصراحة.
