ka:
  name: მუაშის მინერალური წყლების კურორტი
  short: >-
    ტყიანი უბანი ლენტეხის აღმოსავლეთით, სადაც მინერალურ წყალს სვამენ და მასში ბანაობენ — პატარა, შორეული
    და მოუპრანჭავი კურორტი.
  body: >-
    **მუაში უფრო სახელგანთქმული წყაროა, ვიდრე კურორტი: სოფელ მებეცის ტყიანი უბანი ლენტეხის აღმოსავლეთით,
    სადაც ხალხი წყლის დასალევად და მასში საბანაოდ ადის.**


    საქართველოს ტურიზმის ეროვნული ადმინისტრაცია მუაშს კლიმატურ-ბალნეოლოგიურ კურორტად მოიხსენიებს და მის
    წყალს საჭმლის მომნელებელი სისტემის, პერიფერიული ნერვული სისტემისა და სახსრების დაავადებების სამკურნალოდ
    ასახელებს. ჰაერი ნოტიოა, ზამთარი ცივი, ზაფხული კი ხანგრძლივი და გრილი. უბანი დაახლოებით 1350 მეტრზე
    მდებარეობს.


    წყლის შემადგენლობა პირველად მხოლოდ 2022 წელს გამოიკვლიეს — ქუთაისის აკაკი წერეთლის სახელმწიფო უნივერსიტეტის
    ქიმიკოსებმა. აღმოჩნდა, რომ ის სუსტად მჟავეა (pH დაახლოებით 5,2), მასში კალციუმი და ჰიდროკარბონატი
    ჭარბობს, სულფიდი კი საერთოდ ვერ აღმოაჩინეს.


    რა დაგხვდებათ დღეს — მოქმედი სააბაზანო და კოტეჯები თუ მხოლოდ წყარო ტყეში — ლენტეხში იკითხეთ. ამიტომ
    მუაში გზიდან პატარა გადახვევად აღიქვით და არა სანატორიუმის ჯავშნად: წამოიღეთ ცარიელი ბოთლი და ზომიერი
    მოლოდინი, დანარჩენს ტყე მოგცემთ.
  tip: >-
    წასვლამდე ლენტეხში იკითხეთ, მუშაობს თუ არა სააბაზანო და კოტეჯები და შეიძლება თუ არა მხოლოდ დღით სტუმრობა
    — ფასები არსად ქვეყნდება. წყაროსთვის ცარიელი ბოთლი წაიღეთ. თუ წყლით მკურნალობას აპირებთ, ჯერ ექიმს
    ჰკითხეთ: სამკურნალო თვისებები აქ კურორტის რეპუტაციაა და არა სამედიცინო რეკომენდაცია. საუკეთესო დრო
    მაისიდან ოქტომბრამდეა; ზამთარი ცივია და ბოლო მონაკვეთი შეიძლება ჩაიკეტოს. ნაღდი ფული, წამლები და სურსათი
    ლენტეხში შეიძინეთ. ნოტიო ჰავის გამო წყალგაუმტარი ქურთუკი არ დაგავიწყდეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, იქიდან ჩრდილოეთით ცაგერამდე და შ15-ით ცხენისწყლის ხეობით
    ლენტეხამდე იარეთ. ლენტეხიდან იმავე შ15-ს აღმოსავლეთით, ლასდილის მიმართულებით, დაახლოებით 28 კილომეტრი
    გაჰყევით და მებეცთან მუაშისკენ გადაუხვიეთ — ბოლო ორი კილომეტრი ვიწრო ადგილობრივი გზაა, რომლის საფარიც
    შეიძლება ხრეში აღმოჩნდეს. სულ დაახლოებით 350 კმ და ექვს საათზე ცოტა მეტი. გირჩევთ მაღალი გამავლობის
    მანქანას, განსაკუთრებით წვიმის შემდეგ. საწვავი ქუთაისში ან ცაგერში ჩაასხით; ლენტეხი ბოლო ადგილია ბანკომატითა
    და მაღაზიებით.
en:
  name: Muashi Mineral Water Resort
  short: >-
    A forested hamlet east of Lentekhi where people drink the mineral water and bathe in it: small, remote
    and far from polished.
  body: >-
    **Muashi is less a spa than a spring with a reputation: a forested hamlet of the village of Mebetsi,
    east of Lentekhi, where people come to drink the water and bathe in it.**


    Georgia's national tourism administration calls it a climatic and balneological resort, and credits
    its waters with easing disorders of the digestive system, the peripheral nerves and the joints. The
    air is humid, the winters cold, the summers long and cool. The hamlet sits at roughly 1,350 metres.


    The water was analysed for the first time only in 2022, by chemists from Akaki Tsereteli State University
    in Kutaisi. They found it weakly acidic (pH about 5.2), led by calcium and bicarbonate, and with no
    detectable sulphide.


    Whether you will find a working bathhouse and cottages or only a spring in the trees is something
    to ask in Lentekhi. So treat Muashi as a detour rather than a booking at a sanatorium. Bring an empty
    bottle and modest expectations, and let the forest supply the rest.
  tip: >-
    Before driving up, ask in Lentekhi whether the bathhouse and cottages are open and whether day visitors
    are welcome; no prices are published anywhere. Take an empty bottle for the spring. If you are thinking
    of a proper cure, talk to a doctor first: the healing claims are the resort's reputation, not medical
    advice. May to October is the season; winters are cold and the last stretch may be closed. Get cash,
    medicines and food in Lentekhi. The climate is damp, so pack a waterproof.
  route: >-
    From Tbilisi take the E60 (S1) to Kutaisi, head north to Tsageri and follow the Sh15 up the Tskhenistskali
    gorge to Lentekhi. Carry on east along the same Sh15, towards Lasdili, for about 28 km, and turn off
    for Muashi at Mebetsi. The last two kilometres are a narrow local road, which may be gravel. In all
    it is about 350 km and just over six hours. We recommend an SUV, especially after rain. Fill up in
    Kutaisi or Tsageri; Lentekhi is the last place with a cash machine and shops.
ru:
  name: Курорт минеральных вод Муаши
  short: >-
    Лесной уголок к востоку от Лентехи, где минеральную воду пьют и в ней купаются: маленький, далёкий
    и совсем не глянцевый.
  body: >-
    **Муаши — не столько курорт, сколько источник с репутацией: затерянная в лесу часть села Мебеци к
    востоку от Лентехи, куда приезжают пить здешнюю воду и купаться в ней.**


    Национальная администрация туризма Грузии называет Муаши климатическим и бальнеологическим курортом
    и приписывает его водам способность облегчать болезни органов пищеварения, периферической нервной
    системы и суставов. Воздух здесь влажный, зимы холодные, лето долгое и прохладное. Лежит это место
    примерно на высоте 1350 метров.


    Впервые воду проанализировали лишь в 2022 году — химики Кутаисского государственного университета
    имени Акакия Церетели. Она оказалась слабокислой (pH около 5,2), с преобладанием кальция и гидрокарбонатов,
    а сульфидов в ней не обнаружилось.


    Что вы найдёте там сегодня — действующую купальню с домиками или просто родник среди деревьев, — лучше
    спросить в Лентехи. Поэтому считайте Муаши скорее крюком по пути, чем бронью в санатории. Возьмите
    пустую бутылку и скромные ожидания, а остальное дополнит лес.
  tip: >-
    Прежде чем ехать наверх, спросите в Лентехи, работают ли купальня и домики и принимают ли гостей на
    один день: цены нигде не опубликованы. Возьмите пустую бутылку для источника. Если задумали настоящий
    курс лечения, сначала посоветуйтесь с врачом: целебная сила — это репутация курорта, а не медицинская
    рекомендация. Сезон — с мая по октябрь; зимы холодные, и последний участок дороги может быть закрыт.
    Наличные, лекарства и продукты запасите в Лентехи. Климат сырой, так что возьмите непромокаемую куртку.
  route: >-
    Из Тбилиси по E60 (S1) до Кутаиси, затем на север до Цагери и по Sh15 вверх по ущелью Цхенисцкали
    до Лентехи. Дальше продолжайте по той же Sh15 на восток, в сторону Ласдили, около 28 км и у Мебеци
    сверните на Муаши. Последние два километра — узкая местная дорога, возможно, гравийная. Всего около
    350 км и немногим больше шести часов. Мы советуем внедорожник, особенно после дождя. Заправьтесь в
    Кутаиси или Цагери; Лентехи — последнее место с банкоматом и магазинами.
fa:
  name: استراحتگاه آب معدنی مواشی
  short: >-
    آبادی‌ای جنگلی در شرق لنتخی که مردم آب معدنی‌اش را می‌نوشند و در آن تن می‌شویند: کوچک، دورافتاده و
    بی‌هیچ زرق‌وبرق.
  body: >-
    **مواشی بیش از آنکه آبگرم باشد، چشمه‌ای است صاحب‌آوازه: بخشی جنگلی از روستای مبتسی در شرق لنتخی، که
    مردم برای نوشیدن آبش و آب‌تنی در آن به آنجا می‌آیند.**


    ادارهٔ ملی گردشگری گرجستان آن را استراحتگاهی اقلیمی و آب‌درمانی می‌خواند و آب‌هایش را در تسکین ناخوشی‌های
    دستگاه گوارش، اعصاب محیطی و مفاصل مؤثر می‌داند. هوا مرطوب است، زمستان‌ها سرد و تابستان‌ها طولانی و
    خنک. این آبادی در ارتفاع حدود ۱۳۵۰ متری قرار دارد.


    آبِ آن نخستین بار تنها در سال ۲۰۲۲ تجزیه شد، به دست شیمی‌دانان دانشگاه دولتی آکاکی تسرتلی در کوتائیسی.
    آن را اندکی اسیدی یافتند (pH حدود ۵٫۲)، با غلبهٔ کلسیم و بی‌کربنات، و بی‌آنکه سولفیدی در آن قابل تشخیص
    باشد.


    اینکه امروز آنجا گرمابه‌ای فعال با کلبه‌ها خواهید یافت یا تنها چشمه‌ای میان درختان، چیزی است که باید
    در لنتخی پرسید. پس مواشی را گریزی کوتاه از مسیر بدانید، نه اقامتی رزروشده در آسایشگاه. بطری خالی و
    انتظاری فروتنانه با خود بیاورید و بقیه را به جنگل بسپارید.
  tip: >-
    پیش از بالا رفتن، در لنتخی بپرسید که گرمابه و کلبه‌ها باز هستند یا نه و آیا بازدیدکنندگان یک‌روزه
    را می‌پذیرند؛ هیچ قیمتی در هیچ‌جا منتشر نشده است. یک بطری خالی برای چشمه ببرید. اگر به دورهٔ درمانی
    جدی فکر می‌کنید، اول با پزشک مشورت کنید: خواص درمانی آوازهٔ این استراحتگاه است، نه توصیهٔ پزشکی. فصل
    آن از ماه مه تا اکتبر است؛ زمستان‌ها سرد است و ممکن است تکهٔ پایانی جاده بسته باشد. پول نقد، دارو
    و خوراک را در لنتخی تهیه کنید. هوا نمناک است، پس بارانی بردارید.
  route: >-
    از تفلیس با E60 (S1) تا کوتائیسی بروید، سپس به شمال تا تساگری و از Sh15 در درّهٔ تسخنیستسکالی بالا
    تا لنتخی. در همان Sh15 به سوی شرق، به طرف لاسدیلی، حدود ۲۸ کیلومتر ادامه دهید و در مبتسی به سمت مواشی
    بپیچید. دو کیلومتر پایانی جاده‌ای محلی و باریک است که شاید شنی باشد. روی‌هم حدود ۳۵۰ کیلومتر و کمی
    بیش از شش ساعت راه است. خودروی شاسی‌بلند را توصیه می‌کنیم، به‌ویژه پس از باران. در کوتائیسی یا تساگری
    سوخت‌گیری کنید؛ لنتخی آخرین جایی است که خودپرداز و مغازه دارد.
he:
  name: אתר המרפא של מי המינרלים במואשי
  short: 'פינה מיוערת ממזרח ללנטחי שבה שותים את מי המינרלים וטובלים בהם: קטנה, מרוחקת ורחוקה מכל ליטוש.'
  body: >-
    **מואשי היא פחות אתר מרפא ויותר מעיין בעל מוניטין: חלק מיוער של הכפר מבצי, ממזרח ללנטחי, שאליו באים
    כדי לשתות את המים ולטבול בהם.**


    רשות התיירות הלאומית של גאורגיה מגדירה את מואשי אתר נופש אקלימי ובלנאולוגי (של מרפא במים), ומייחסת
    למימיו הקלה במחלות של מערכת העיכול, של מערכת העצבים ההיקפית ושל המפרקים. האוויר לח, החורפים קרים,
    והקיצים ארוכים וקרירים. המקום שוכן בגובה של כ-1,350 מטר.


    המים נבדקו לראשונה רק ב-2022, בידי כימאים מהאוניברסיטה הממלכתית על שם אקאקי צרתלי בקוטאיסי. הם מצאו
    שהמים חומציים מעט (pH של כ-5.2), שהסידן והביקרבונט הם המרכיבים העיקריים בהם, ושלא ניתן לגלות בהם סולפיד.


    אם תמצאו שם היום בית מרחץ פעיל ובקתות, או רק מעיין בין העצים – את זה כדאי לשאול בלנטחי. לכן ראו במואשי
    סטייה קצרה מהדרך ולא הזמנה בבית הבראה. הביאו בקבוק ריק וציפיות צנועות, ואת השאר ישלים היער.
  tip: >-
    לפני שאתם עולים, שאלו בלנטחי אם בית המרחץ והבקתות פתוחים ואם מקבלים מבקרים ליום אחד; מחירים לא פורסמו
    בשום מקום. קחו בקבוק ריק למעיין. אם אתם שוקלים טיפול של ממש, התייעצו קודם עם רופא: סגולות המרפא הן
    המוניטין של המקום, לא עצה רפואית. העונה היא ממאי עד אוקטובר; החורפים קרים והקטע האחרון של הדרך עלול
    להיות סגור. הצטיידו במזומן, בתרופות ובאוכל בלנטחי. האקלים לח, אז ארזו מעיל גשם.
  route: >-
    מטביליסי סעו בכביש E60 (S1) עד קוטאיסי, משם צפונה עד צאגרי, ובכביש Sh15 במעלה ערוץ הצחניסצקאלי עד
    לנטחי. המשיכו מזרחה באותו כביש Sh15, לכיוון לסדילי, כ-28 ק״מ, ובמבצי פנו למואשי. שני הקילומטרים האחרונים
    הם דרך מקומית צרה, שייתכן שהיא דרך חצץ. בסך הכול כ-350 ק״מ וקצת יותר משש שעות נסיעה. אנו ממליצים על
    רכב פנאי-שטח, במיוחד אחרי גשם. תדלקו בקוטאיסי או בצאגרי; לנטחי היא המקום האחרון עם כספומט וחנויות.
ar:
  name: منتجع مواشي للمياه المعدنية
  short: 'بقعة في الغابة شرقي لنتيخي يشرب الناس ماءها المعدني ويغتسلون فيه: صغيرة ونائية وبعيدة كل البعد
    عن البريق.'
  body: >-
    **مواشي ليست منتجعاً بقدر ما هي نبع ذائع الصيت: طرفٌ من قرية ميبيتسي تكسوه الغابة شرقي لنتيخي، يقصده
    الناس ليشربوا ماءه ويغتسلوا فيه.**


    تصفها الإدارة الوطنية للسياحة في جورجيا بأنها منتجع مناخي وعلاجي بالمياه، وتنسب إلى مياهها تخفيف اضطرابات
    الجهاز الهضمي والأعصاب الطرفية والمفاصل. الهواء رطب، والشتاء بارد، والصيف طويل معتدل البرودة. ويقع
    المكان على ارتفاع نحو 1350 متراً.


    لم تُحلَّل المياه للمرة الأولى إلا في عام 2022، على يد كيميائيين من جامعة أكاكي تسيريتيلي الحكومية
    في كوتايسي. وجدوها ضعيفة الحموضة (pH نحو 5.2)، يغلب عليها الكالسيوم والبيكربونات، ولم يرصدوا فيها
    أي كبريتيد.


    أما هل ستجد هناك اليوم حمّاماً يعمل وأكواخاً أم مجرد نبع بين الأشجار، فذلك ما ينبغي أن تسأل عنه في
    لنتيخي. لذا عُدَّ مواشي انعطافةً جانبية لا حجزاً في مصحّة. احمل قنينة فارغة وتوقعات متواضعة، ودع الغابة
    تتكفل بالباقي.
  tip: >-
    قبل الصعود اسأل في لنتيخي هل الحمّام والأكواخ مفتوحة وهل يُستقبل زوار اليوم الواحد؛ فلا أسعار منشورة
    في أي مكان. خذ قنينة فارغة للنبع. وإن كنت تفكر في علاج حقيقي فاستشر طبيباً أولاً: فالخصائص الشفائية
    هي سمعة المنتجع لا نصيحة طبية. الموسم من أيار/مايو إلى تشرين الأول/أكتوبر؛ الشتاء بارد وقد يُغلق المقطع
    الأخير من الطريق. تزوّد بالنقد والأدوية والطعام في لنتيخي. المناخ رطب، فاحمل سترة واقية من المطر.
  route: >-
    من تبليسي خذ الطريق E60 (S1) إلى كوتايسي، ثم اتجه شمالاً إلى تساغيري واتبع الطريق Sh15 صعوداً في وادي
    تسخينيستسكالي حتى لنتيخي. تابع شرقاً على الطريق Sh15 نفسه باتجاه لاسديلي نحو 28 كم، وعند ميبيتسي انعطف
    نحو مواشي. الكيلومتران الأخيران طريق محلي ضيق قد يكون مفروشاً بالحصى. المجموع نحو 350 كم وما يزيد
    قليلاً على ست ساعات. ننصح بسيارة دفع رباعي، ولا سيما بعد المطر. تزوّد بالوقود في كوتايسي أو تساغيري؛
    فلنتيخي آخر مكان فيه صراف آلي ومتاجر.
