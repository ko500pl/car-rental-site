ka:
  name: საბადურის ტყე
  short: >-
    საქართველოს უძველესი ეროვნული პარკი თბილისიდან ერთ საათში: წიფლისა და მუხის გვირაბი, იანვარში თეთრი,
    ოქტომბერში სპილენძისფერი, პიონერთა ბანაკის ნანგრევებით.
  body: >-
    **თბილისის კორპუსებიდან ერთ საათში თიანეთის გზა ტყეში შედის, რომელიც თავზე სახურავივით ეხურება.**


    საბადურის ტყე თბილისი-თიანეთის გზას თბილისის ეროვნული პარკის ფარგლებში მიუყვება. ეს საქართველოს უძველესი
    ეროვნული პარკია: იგი 1973 წელს შეიქმნა 1946 წელს დაარსებული საგურამოს ნაკრძალის ბაზაზე. პარკი არაგვის
    აღმოსავლეთით, საგურამოს ქედზე 243 კვადრატულ კილომეტრს მოიცავს, მისი უმაღლესი წერტილი კი 1385 მეტრია.
    თავად ტყე სოფლებს, მამკოდასა და ღულელებს შორის გადაჭიმულა. აქ მუხა, წიფელი და რცხილა იზრდება — სამივე
    ფოთოლმცვენი, ამიტომაც აქვს ტყეს ოთხი სრულიად განსხვავებული სახე.


    იანვრიდან მარტამდე თოვლი თითქმის გარანტირებულია. ის ტოტებს ისე ამძიმებს, რომ ისინი ასფალტზე იხრებიან,
    ერთმანეთს ხვდებიან და გზა თეთრ გვირაბად იქცევა — ის კადრი, თბილისის ნახევარს რომ აქვს გადაღებული.
    ოქტომბერში იგივე ხეები სპილენძისფრად და ოქროსფრად იფერება, ჰაერს კი ნესტიანი ფოთლის სუნი უდგას. პარკში
    ირემი, ფოცხვერი, მურა დათვი, მელა და ტურა ბინადრობს, თუმცა დათვს აქ გაცილებით ნაკლებად შეხვდებით,
    ვიდრე სხვის მანქანას.


    აქაური ისტორია მხოლოდ ბუნებას არ ეკუთვნის. გზის პირას საბჭოთა პიონერთა საზაფხულო ბანაკის, „ცისკრის“,
    ნანგრევები დგას. მისი ბეტონი ბრუტალისტურია, ფერები კი — სულაც არა: 50-მეტრიან კედელზე ათეულობით კერამიკული
    პანოა ზღაპრებისა და საბჭოთა რესპუბლიკების პერსონაჟებით, ძველ ავტობუსის გაჩერებაზე კი ოთხი მოზაიკა
    დღემდე აჩვენებს ბავშვებს პიონერის ფორმითა და წითელი ყელსახვევებით.


    მონიშნული ბილიკები საბადურში არ არის. ტყეს აუჩქარებლად უნდა მიუდგეთ: გზის პირას გაჩერდით, ძრავა ჩააქრეთ
    და ტყის სიჩუმეს მიაყურადეთ.
  tip: >-
    ყველაზე ლამაზი დრო თოვლის შემდეგ პირველი მზიანი დილაა — და სწორედ მაშინ მოდის ყველა; ამიტომ სამუშაო
    დღე აირჩიეთ და დღესასწაულებს მოერიდეთ. ინფრასტრუქტურა მწირია: ვიზიტორთა ცენტრი არ არის, ერთადერთი
    კაფე და ტუალეტი მთელ მონაკვეთზე ცხვარიჭამიაშია, „კაფე ნებულაში“, რომელიც 11:00-დან მუშაობს. რამდენიმე
    საპიკნიკე ადგილზე მაგიდები და მწვადის შესაწვავი ადგილებია, ამიტომ საჭმელი და წყალი თან წამოიღეთ. ტყის
    დაწყებამდე, ცხვარიჭამიაში, ზოოლოგიური ცენტრი ტყვეობიდან გადარჩენილ მურა დათვებს უვლის; იგი ყოველდღე
    11:00-დან მზის ჩასვლამდეა ღია, მცირე საფასურით (ბოლო ცნობით 5 ლარი). მობილური კავშირი ხან ქრება, ხან
    ჩნდება.
  route: >-
    თბილისიდან გლდანის გავლით თბილისი-თიანეთის გზას (შ30) დაადექით და ცხვარიჭამიისკენ გაემართეთ; ყველაზე
    ფოტოგენური მონაკვეთი სოფლის შემდეგ იწყება, ცენტრიდან დაახლოებით 45 კილომეტრსა და ერთ საათში. გზა ასფალტიანია,
    ალაგ-ალაგ ორმოებით; ზამთარში კი, გაწმენდის შემდეგაც, თოვლიანი და მოლიპულია. მშრალ ამინდში ეკონომკლასის
    ავტომობილიც გაუმკლავდება, მაგრამ დეკემბრიდან მარტამდე ზამთრის საბურავებიანი ჯიპი აიღეთ; ოთხივე წამყვანი
    თვალი აქ ნამდვილი შვებაა. ტყეში ბენზინგასამართი არ არის — ავზი თბილისში შეავსეთ. წრიული მარშრუტისთვის
    თიანეთამდე გააგრძელეთ და შ27-ით ჟინვალში, საქართველოს სამხედრო გზაზე დაბრუნდით.
en:
  name: Sabaduri Forest
  short: >-
    Georgia's oldest national park, an hour from Tbilisi: a road-tunnel of beech and oak, white in January,
    copper in October, beside a ruined Soviet pioneer camp.
  body: >-
    **An hour from Tbilisi's apartment blocks, the Tianeti road slips into a forest that closes over it
    like a roof.**


    Sabaduri lines the Tbilisi–Tianeti road inside Tbilisi National Park, the oldest national park in
    Georgia, created in 1973 from the Saguramo reserve of 1946. The park spreads over 243 km² of the Saguramo
    Range east of the Aragvi and tops out at 1,385 m; the forest itself runs between the villages of Mamkoda
    and Ghulelebi. It is oak, beech and hornbeam, all deciduous, which is why it has four entirely different
    faces.


    From January to March snow is all but certain. It loads the branches until they bow across the asphalt
    and meet, and the road becomes a white tunnel that half of Tbilisi seems to have photographed. In
    October the same trees turn copper and gold, and the air smells of wet leaves. Red deer, lynx, brown
    bears, foxes and jackals live in the park, though you are far more likely to meet another car than
    a bear.


    Not all the history here is natural. Beside the road stand the ruins of Tsiskari, "Dawn", a Soviet
    Young Pioneers' summer camp. Its concrete is Brutalist and its colours are not: a 50-metre wall is
    set with dozens of ceramic panels of fairy tales and figures from the Soviet republics, and an old
    bus stop still shows four mosaic panels of children in pioneer uniform and red neckerchiefs.


    There are no marked trails in Sabaduri. The best way to take it is slowly: pull over, switch off the
    engine and let the silence of the forest settle.
  tip: >-
    The finest hour is the first sunny morning after a snowfall, which is exactly when everyone else comes;
    go on a weekday and avoid public holidays. Facilities are thin: there is no visitor centre, and the
    only café and toilets on the stretch are at Cafe Nebula in Tskhvarichamia, open from 11:00. A couple
    of picnic areas have tables and barbecue spots, so bring food and water. Just before the forest, the
    Zoological Centre in Tskhvarichamia shelters rescued brown bears; it opens daily from 11:00 until
    sunset for a small fee (5 GEL when last checked). Phone signal comes and goes.
  route: >-
    Leave Tbilisi through Gldani on the Tbilisi–Tianeti road (Sh30) towards Tskhvarichamia; the most photogenic
    section begins just past the village, about 45 km and an hour from the centre. The road is sealed
    with some potholes, and in winter it is snowy and slippery even after ploughing. In dry weather an
    economy car copes, but from December to March take an SUV on winter tyres; four-wheel drive is a real
    comfort. There is no fuel in the forest, so fill up in Tbilisi. To make a loop, continue to Tianeti
    and return via the Sh27 to Zhinvali and the Georgian Military Highway.
ru:
  name: Лес Сабадури
  short: >-
    Старейший нацпарк Грузии в часе от Тбилиси: тоннель из бука и дуба над дорогой, белый в январе, медный
    в октябре, и руины советского пионерлагеря.
  body: >-
    **В часе езды от тбилисских многоэтажек дорога на Тианети ныряет в лес, который смыкается над ней,
    как крыша.**


    Сабадури тянется вдоль дороги Тбилиси — Тианети в Тбилисском национальном парке, старейшем национальном
    парке Грузии: его создали в 1973 году на основе Сагурамского заповедника 1946 года. Парк занимает
    243 км² Сагурамского хребта к востоку от Арагви, его высшая точка — 1385 м; сам лес тянется между
    сёлами Мамкода и Гулелеби. Это дуб, бук и граб — сплошь листопадные породы, и потому у леса четыре
    совершенно разных лица.


    С января по март снег здесь почти гарантирован. Он нагружает ветви, пока те не склонятся над асфальтом
    и не сомкнутся, и дорога превращается в белый тоннель, который, кажется, сфотографировала половина
    Тбилиси. В октябре те же деревья становятся медными и золотыми, а воздух пахнет мокрой листвой. В
    парке водятся благородные олени, рыси, бурые медведи, лисы и шакалы, хотя встретить здесь другую машину
    куда вероятнее, чем медведя.


    Не вся здешняя история — природная. У дороги стоят руины «Цискари» («Заря»), советского летнего пионерского
    лагеря. Бетон у него бруталистский, а краски — нет: 50-метровую стену украшают десятки керамических
    панно с сюжетами из сказок и фигурами из советских республик, а на старой автобусной остановке до
    сих пор сохранились четыре мозаичных панно с детьми в пионерской форме и красных галстуках.


    Маркированных троп в Сабадури нет. Воспринимать его лучше всего неспешно: съехать на обочину, заглушить
    мотор и дать лесной тишине опуститься на вас.
  tip: >-
    Лучший час — первое солнечное утро после снегопада, и ровно тогда же сюда съезжаются все остальные;
    выбирайте будний день и избегайте праздников. С удобствами негусто: визит-центра нет, а единственные
    кафе и туалеты на всём участке — в кафе «Небула» в Цхваричамии, открытом с 11:00. На паре пикниковых
    площадок есть столы и места для мангала, так что берите еду и воду. Сразу перед лесом, в Цхваричамии,
    Зоологический центр приютил спасённых бурых медведей; он открыт ежедневно с 11:00 до заката, вход
    стоит недорого (5 лари на момент последней проверки). Мобильная связь то появляется, то пропадает.
  route: >-
    Выезжайте из Тбилиси через Глдани на дорогу Тбилиси — Тианети (Sh30) в сторону Цхваричамии; самый
    фотогеничный участок начинается сразу за селом, примерно в 45 км и часе езды от центра. Дорога асфальтирована,
    местами с ямами, а зимой заснежена и скользкая даже после расчистки. В сухую погоду справится и машина
    эконом-класса, но с декабря по март берите внедорожник на зимней резине; полный привод будет очень
    кстати. В лесу заправок нет — заправьтесь в Тбилиси. Чтобы сделать петлю, поезжайте дальше до Тианети
    и возвращайтесь по Sh27 на Жинвали и Военно-Грузинскую дорогу.
fa:
  name: جنگل سابادوری
  short: >-
    کهن‌ترین پارک ملی گرجستان، یک ساعت از تفلیس: تونلی از راش و بلوط، سپید در ژانویه و مسی در اکتبر، کنار
    ویرانه‌های اردوگاه پیونیرهای شوروی.
  body: >-
    **یک ساعت دورتر از آپارتمان‌های تفلیس، جادهٔ تیانتی به درون جنگلی می‌خزد که چون سقفی بر سرش بسته می‌شود.**


    سابادوری در امتداد جادهٔ تفلیس–تیانتی و در دل پارک ملی تفلیس کشیده شده است؛ کهن‌ترین پارک ملی گرجستان
    که در ۱۹۷۳ بر پایهٔ ذخیره‌گاه ساگورامو (تأسیس ۱۹۴۶) پدید آمد. پارک ۲۴۳ کیلومتر مربع از رشته‌کوه ساگورامو
    را در شرق رود آراگوی در بر می‌گیرد و بلندترین نقطه‌اش به ۱۳۸۵ متر می‌رسد؛ خودِ جنگل میان روستاهای
    مامکودا و غولِلِبی امتداد دارد. درختانش بلوط، راش و ممرزند، همه برگ‌ریز، و از همین روست که چهار چهرهٔ
    یکسره متفاوت دارد.


    از ژانویه تا مارس برف تقریباً حتمی است. شاخه‌ها را چنان سنگین می‌کند که بر آسفالت خم می‌شوند و به
    هم می‌رسند، و جاده تونلی سپید می‌شود که گویی نیمی از تفلیس از آن عکس گرفته است. در اکتبر همان درختان
    مسی و طلایی می‌شوند و هوا بوی برگ خیس می‌دهد. گوزن قرمز، وشق، خرس قهوه‌ای، روباه و شغال در پارک زندگی
    می‌کنند، هرچند احتمال برخورد با خودرویی دیگر بسیار بیشتر از دیدن خرس است.


    همهٔ تاریخ اینجا طبیعی نیست. کنار جاده ویرانه‌های «تسیسکاری» («سپیده‌دم») ایستاده است، اردوگاه تابستانی
    پیونیرهای جوان شوروی. بتنش بروتالیستی است و رنگ‌هایش نه: بر دیواری ۵۰ متری ده‌ها تابلوی سرامیکی از
    قصه‌های پریان و چهره‌هایی از جمهوری‌های شوروی نشانده‌اند، و ایستگاه اتوبوسی قدیمی هنوز چهار تابلوی
    موزاییکی از کودکانی با اونیفرم پیونیری و دستمال گردن سرخ را به نمایش می‌گذارد.


    در سابادوری هیچ مسیر علامت‌گذاری‌شده‌ای نیست. بهترین راه تجربه‌اش آهستگی است: کنار جاده بایستید، موتور
    را خاموش کنید و بگذارید سکوت جنگل آرام‌آرام بر شما بنشیند.
  tip: >-
    بهترین ساعت، نخستین صبح آفتابی پس از بارش برف است، و درست همان وقتی که همه می‌آیند؛ پس وسط هفته بیایید
    و از تعطیلات رسمی بپرهیزید. امکانات اندک است: مرکز بازدیدکنندگان وجود ندارد و تنها کافه و سرویس بهداشتی
    این مسیر در «کافه نبولا» در تسخواریچامیاست که از ساعت ۱۱:۰۰ باز می‌شود. چند محوطهٔ پیک‌نیک میز و جای
    کباب‌پزی دارند، پس خوراک و آب همراه بیاورید. درست پیش از جنگل، مرکز جانورشناسی تسخواریچامیا به خرس‌های
    قهوه‌ای نجات‌یافته پناه داده است؛ هر روز از ۱۱:۰۰ تا غروب باز است و بلیتش ارزان است (در آخرین بررسی
    ۵ لاری). آنتن موبایل می‌آید و می‌رود.
  route: >-
    از راه گلدانی از تفلیس بیرون بروید و جادهٔ تفلیس–تیانتی (Sh30) را به سوی تسخواریچامیا بگیرید؛ خوش‌عکس‌ترین
    بخش درست پس از روستا آغاز می‌شود، حدود ۴۵ کیلومتر و یک ساعت از مرکز شهر. جاده آسفالت است با چند چاله،
    و در زمستان حتی پس از برف‌روبی برفی و لغزنده است. در هوای خشک خودروی کلاس اکونومی از پسِ راه برمی‌آید،
    اما از دسامبر تا مارس شاسی‌بلند با لاستیک زمستانی بگیرید؛ چهارچرخ‌محرک به‌راستی آسودگی می‌آورد. در
    جنگل پمپ بنزین نیست، پس در تفلیس باک را پر کنید. برای مسیری حلقوی، تا تیانتی ادامه دهید و از راه Sh27
    به ژینوالی و جادهٔ نظامی گرجستان بازگردید.
he:
  name: יער סבדורי
  short: >-
    הפארק הלאומי הוותיק בגאורגיה, שעה מטביליסי: מנהרת אשורים ואלונים מעל הכביש, לבנה בינואר ונחושתית באוקטובר,
    וחורבות מחנה פיונרים סובייטי.
  body: >-
    **שעה אחת מבנייני הדירות של טביליסי, כביש טיאנטי חומק אל יער שנסגר מעליו כמו גג.**


    סבדורי משתרע לאורך כביש טביליסי–טיאנטי בתוך הפארק הלאומי של טביליסי, הפארק הלאומי הוותיק ביותר בגאורגיה,
    שהוקם ב־1973 על בסיס שמורת סגוראמו מ־1946. הפארק משתרע על פני 243 קמ"ר של רכס סגוראמו ממזרח לנהר אראגווי,
    ונקודתו הגבוהה ביותר מגיעה ל־1,385 מ'; היער עצמו נמשך בין הכפרים מאמקודה וע'וללבי. אלה אלונים, אשורים
    וקרפינוסים, כולם נשירים, ולכן יש ליער ארבעה פרצופים שונים לגמרי.


    מינואר עד מרץ השלג כמעט מובטח. הוא מעמיס על הענפים עד שהם מתכופפים מעל האספלט ונפגשים, והכביש הופך
    למנהרה לבנה שנדמה שחצי טביליסי כבר צילמה. באוקטובר אותם עצים מתלבשים נחושת וזהב, והאוויר מדיף ריח
    של עלים רטובים. בפארק חיים איילים אדומים, שונרים, דובים חומים, שועלים ותנים, אם כי הסיכוי לפגוש כאן
    מכונית אחרת גבוה בהרבה מהסיכוי לפגוש דוב.


    לא כל ההיסטוריה כאן היא של הטבע. לצד הכביש עומדות חורבותיו של "ציסקרי" ("שחר"), מחנה קיץ סובייטי של
    הפיונרים הצעירים. הבטון שלו ברוטליסטי, הצבעים – ממש לא: קיר באורך 50 מטר משובץ בעשרות לוחות קרמיקה
    ובהם אגדות ודמויות מהרפובליקות הסובייטיות, ותחנת אוטובוס ישנה עדיין מציגה ארבעה לוחות פסיפס של ילדים
    במדי פיונרים ובמטפחות צוואר אדומות.


    אין בסבדורי שבילים מסומנים. הדרך הטובה ביותר לחוות אותו היא לאט: לעצור בשוליים, לכבות את המנוע ולתת
    לשקט של היער לשקוע סביבכם.
  tip: >-
    השעה היפה ביותר היא הבוקר השמשי הראשון אחרי שלג – בדיוק הזמן שבו כולם מגיעים; בואו ביום חול והימנעו
    מחגים. התשתיות דלות: אין מרכז מבקרים, ובית הקפה והשירותים היחידים לאורך הקטע נמצאים ב"קפה נבולה" בצחווריצ'מיה,
    הפתוח מ־11:00. בכמה חניוני פיקניק יש שולחנות ומקום למנגל, אז הביאו אוכל ומים. ממש לפני היער, המרכז
    הזואולוגי בצחווריצ'מיה מעניק מחסה לדובים חומים שחולצו; הוא פתוח מדי יום מ־11:00 עד השקיעה, בתשלום
    קטן (5 לארי בבדיקה האחרונה). הקליטה הסלולרית באה והולכת.
  route: >-
    צאו מטביליסי דרך גלדני אל כביש טביליסי–טיאנטי (Sh30) לכיוון צחווריצ'מיה; הקטע הפוטוגני ביותר מתחיל
    מיד אחרי הכפר, כ־45 ק"מ ושעת נסיעה מהמרכז. הכביש סלול, עם כמה בורות, ובחורף הוא מושלג וחלקלק גם אחרי
    פינוי השלג. במזג אוויר יבש רכב מקטגוריית אקונומי מסתדר, אבל מדצמבר עד מרץ קחו רכב שטח עם צמיגי חורף;
    הנעה כפולה היא נוחות של ממש. ביער אין דלק, אז תדלקו בטביליסי. כדי לסגור מעגל, המשיכו עד טיאנטי וחזרו
    בכביש Sh27 לז'ינוואלי ולכביש הצבאי הגאורגי.
ar:
  name: غابة سابادوري
  short: >-
    أقدم حديقة وطنية في جورجيا على بعد ساعة من تبليسي: نفق من الزان والبلوط فوق الطريق، أبيض في يناير
    ونحاسي في أكتوبر، وأطلال مخيم سوفييتي للروّاد.
  body: >-
    **على بعد ساعة من عمارات تبليسي السكنية، ينسلّ طريق تيانيتي إلى غابة تنغلق فوقه كالسقف.**


    تمتد سابادوري على جانبي طريق تبليسي–تيانيتي داخل حديقة تبليسي الوطنية، أقدم حديقة وطنية في جورجيا،
    أُنشئت عام 1973 انطلاقاً من محمية ساغورامو التي تأسست عام 1946. تشغل الحديقة 243 كم² من سلسلة ساغورامو
    شرقي نهر أراغفي، وتبلغ أعلى نقطة فيها 1385 متراً؛ أما الغابة نفسها فتمتد بين قريتي مامكودا وغوليليبي.
    أشجارها بلوط وزان وشَرَد، كلها متساقطة الأوراق، ولهذا لها أربعة وجوه مختلفة تماماً.


    من يناير إلى مارس يكاد الثلج يكون مضموناً. يُثقل الأغصان حتى تنحني فوق الإسفلت وتتلاقى، فيغدو الطريق
    نفقاً أبيض يبدو أن نصف تبليسي قد صوّره. وفي أكتوبر تكتسي الأشجار نفسها بالنحاس والذهب، ويعبق الهواء
    برائحة الأوراق المبتلة. تعيش في الحديقة الأيائل الحمراء والوشق والدببة البنية والثعالب وبنات آوى،
    وإن كان احتمال أن تصادف سيارة أخرى أكبر بكثير من أن تصادف دباً.


    ليس كل تاريخ المكان من صنع الطبيعة. فعلى جانب الطريق تقوم أطلال «تسيسكاري» («الفجر»)، وهو مخيم صيفي
    سوفييتي للروّاد الشباب. خرسانته على الطراز الوحشي، أما ألوانه فلا: جدار طوله 50 متراً ترصّعه عشرات
    اللوحات الخزفية لحكايات خرافية وشخصيات من الجمهوريات السوفييتية، وما زالت محطة حافلات قديمة تعرض أربع
    لوحات فسيفساء لأطفال بزيّ الروّاد ومناديل عنق حمراء.


    لا توجد في سابادوري دروب معلّمة. وأفضل طريقة لتذوّقها هي التمهّل: توقّف على جانب الطريق، وأطفئ المحرك،
    ودع صمت الغابة يستقرّ من حولك.
  tip: >-
    أجمل الساعات صباح أول يوم مشمس بعد تساقط الثلج، وهو بالضبط حين يأتي الجميع؛ فتعالَ في يوم عمل وتجنّب
    العطل الرسمية. المرافق شحيحة: لا مركز للزوار، والمقهى ودورات المياه الوحيدة على هذا المقطع هي في «مقهى
    نيبولا» في تسخفاريتشاميا، ويفتح من الساعة 11:00. في بضع مناطق للنزهات طاولات وأماكن للشواء، فأحضر
    طعامك وماءك. وقبيل الغابة مباشرة يؤوي المركز الزوولوجي في تسخفاريتشاميا دببة بنية أُنقذت؛ يفتح يومياً
    من 11:00 حتى الغروب برسم زهيد (5 لاري عند آخر تحقق). وإشارة الهاتف تأتي وتذهب.
  route: >-
    اخرج من تبليسي عبر غلداني إلى طريق تبليسي–تيانيتي (Sh30) باتجاه تسخفاريتشاميا؛ يبدأ أجمل مقطع للتصوير
    بعد القرية مباشرة، على بعد نحو 45 كم وساعة من وسط المدينة. الطريق معبّد مع بعض الحفر، ويكون في الشتاء
    مثلجاً وزلقاً حتى بعد جرف الثلج. في الطقس الجاف تكفي سيارة اقتصادية، لكن من ديسمبر إلى مارس خذ سيارة
    دفع رباعي بإطارات شتوية؛ فالدفع الرباعي يمنحك راحة حقيقية. لا وقود داخل الغابة، فاملأ الخزان في تبليسي.
    ولتجعل رحلتك دائرية، تابع إلى تيانيتي وعُد عبر الطريق Sh27 إلى جينفالي ثم الطريق العسكري الجورجي.
