ka:
  name: საბადურის ტყე
  short: >-
    თბილისის ეროვნული პარკის ზღაპრული ტყე — გზა, რომელიც ზამთარში თოვლიან ხეთა გვირაბად იქცევა, ქალაქიდან
    ერთ საათში.
  body: >-
    **საბადური ის ტყეა, რომლის ზამთრის ფოტოებსაც ალბათ უკვე გინახავს** — თოვლით დახუნძლული ტოტები გზის
    ორივე მხრიდან იხრება და თეთრ გვირაბს კრავს. ყველაზე კარგი კი ის არის, რომ ეს ზღაპარი თბილისიდან სულ
    რაღაც ერთი საათის სავალზეა.


    ტყე თბილისის ეროვნული პარკის ნაწილია — საქართველოს პირველი ეროვნული პარკისა, რომელიც 1973 წელს დაარსდა
    — და საგურამოს ქედის ფერდობებზე, 600-დან 1700 მეტრამდე, 5000 ჰექტარზე მეტ ფართობს ფარავს. მუხა, წიფელი
    და რცხილა აქ სეზონების მიხედვით იცვლის სცენას: ოქტომბერში ფერადი ხავერდი, იანვარ-მარტში კი გარანტირებული
    თოვლი.


    რას ნახავ:


    - **ცნობილი ტყის გზა** ცხვარიჭამიასა და უღელტეხილს შორის — ყველაზე ფოტოგენური მონაკვეთი

    - **საპიკნიკე ადგილები** მაგიდებით, საკარვე ადგილები და საინფორმაციო დაფები

    - შემოდგომაზე სოკოს მაძიებლები და წაბლისფერ-წითელი ფერდობები


    სპეციალურად მონიშნული საფეხმავლო ბილიკები აქ ცოტაა — მთავარი განცდა თავად გზაა, გაჩერებებით და ხეტიალით.
    თოვლიან დღეებში საბადური თბილისელების საყვარელი გასეირნების ადგილია, ამიტომ შაბათ-კვირას მისასვლელი
    გადატვირთულია.
  tip: >-
    ყველაზე ლამაზი დღე თოვლის შემდეგ პირველი მზიანი დილაა — და სწორედ მაშინ მოდის ყველა, ამიტომ სამუშაო
    დღე აირჩიე. ზამთარში საბურავები სავალდებულოა და გზას თოვლის შემდეგ წმენდენ, მაგრამ ჯობია არ ჩქარობდე.
    ინფრასტრუქტურა მინიმალურია — საკვები და წყალი თან წამოიღე, კაფე მხოლოდ ერთია მთელ მონაკვეთზე. შესვლა
    უფასოა. ტელეფონი ზოგან არ იჭერს.
  route: >-
    თბილისიდან გლდანის გავლით თბილისი-თიანეთის გზას (შ-30) დაადექი — წოდორეთისა და ცხვარიჭამიას მიმართულებით.
    ტყის ულამაზეს მონაკვეთამდე დაახლოებით 45 კმ და ერთი საათია. გზა ძირითადად ასფალტირებულია, ორმოებითა
    და ხრეშიანი ჩანართებით; ზამთარში თოვლიანი და მოლიპულია. მშრალ ამინდში ეკონომ-კლასიც ავა, მაგრამ თოვლში
    ზამთრის საბურავიანი SUV აშკარად მშვიდი ვარიანტია. საწვავი გლდანში ჩაასხი — ტყეში ბენზინგასამართი არ
    არის. უკან საგურამოზე ჩამოვლით სამხედრო გზას შეუერთდები.
en:
  name: Sabaduri Forest
  short: >-
    The fairy-tale forest of Tbilisi National Park — a road that turns into a snowy tunnel of trees in
    winter, one hour from the city.
  body: >-
    **Sabaduri is the forest whose winter photos you have probably already seen** — snow-laden branches
    arching over the road from both sides until they close into a white tunnel. The best part is that
    this fairy tale sits barely an hour's drive from Tbilisi.


    The forest belongs to Tbilisi National Park, Georgia's first, established in 1973, and drapes the
    slopes of the Saguramo Range between roughly 600 and 1,700 m, covering more than 5,000 hectares. Oak,
    beech and hornbeam change the scenery by season: velvet autumn colours in October, guaranteed snow
    from January to March.


    What you get:


    - **The famous forest road** between Tskhvarichamia and the pass — the most photogenic stretch

    - **Picnic spots** with tables, camping areas and information boards

    - Mushroom foragers and copper-red hillsides in autumn


    There are few marked hiking trails; the real experience is the drive itself, with frequent stops and
    slow wandering under the trees. On snowy days Sabaduri is a favourite escape for half of Tbilisi,
    so the approach road clogs up badly on weekends and public holidays.
  tip: >-
    The most beautiful day is the first sunny morning after snowfall — which is exactly when everyone
    else comes, so aim for a weekday. Winter tyres are mandatory in season and the road is ploughed after
    heavy snow, but take it slowly anyway. Infrastructure is minimal: bring food and water, as there is
    only one cafe along the whole stretch. Entry is free. Phone signal drops out in places.
  route: >-
    Leave Tbilisi through Gldani and follow the Tbilisi–Tianeti road (Sh-30) towards Tsodoreti and Tskhvarichamia;
    the prettiest forest section starts after the village — about 45 km and one hour in total. The road
    is mostly asphalt with potholes and short gravel patches, snowy and slippery in winter. In dry weather
    an economy car copes, but in snow an SUV on winter tyres is clearly the calmer option. Fill up in
    Gldani — there are no petrol stations in the forest. On the way back you can loop via Saguramo to
    join the Georgian Military Highway.
ru:
  name: Лес Сабадури
  short: >-
    Сказочный лес Тбилисского национального парка — дорога, зимой превращающаяся в снежный тоннель из
    деревьев, в часе от города.
  body: >-
    **Сабадури — тот лес, чьи зимние фотографии вы наверняка уже видели**: гружёные снегом ветви смыкаются
    над дорогой с двух сторон в белый тоннель. И самое приятное — эта сказка находится всего в часе езды
    от Тбилиси.


    Лес входит в Тбилисский национальный парк — первый в Грузии, основанный в 1973 году, — и покрывает
    склоны Сагурамского хребта на высотах примерно от 600 до 1700 м, занимая более 5000 гектаров. Дуб,
    бук и граб меняют декорации по сезонам: бархатные краски в октябре, гарантированный снег с января
    по март.


    Что здесь есть:


    - **Знаменитая лесная дорога** между Цхваричамией и перевалом — самый фотогеничный участок

    - **Пикниковые площадки** со столами, места для кемпинга и информационные стенды

    - Грибники и медно-красные склоны осенью


    Размеченных пешеходных троп мало — главное впечатление сама дорога, с остановками и неспешными прогулками
    под деревьями. В снежные дни Сабадури — любимый маршрут тбилисцев, поэтому по выходным подъезд плотно
    забит.
  tip: >-
    Самый красивый день — первое солнечное утро после снегопада, но именно тогда приезжают все, так что
    выбирайте будний день. Зимой обязательны зимние шины; дорогу чистят после сильного снега, но ехать
    всё равно стоит не спеша. Инфраструктура минимальна: берите еду и воду, кафе на всём участке одно.
    Вход бесплатный. Связь местами пропадает.
  route: >-
    Из Тбилиси через Глдани выезжайте на дорогу Тбилиси–Тианети (Ш-30) в сторону Цодорети и Цхваричамии;
    самый красивый лесной участок начинается за селом — всего около 45 км и час пути. Дорога в основном
    асфальтовая, с ямами и короткими гравийными вставками, зимой заснеженная и скользкая. В сухую погоду
    справится и эконом-класс, но по снегу SUV на зимней резине — заметно спокойнее. Заправьтесь в Глдани:
    в лесу АЗС нет. Обратно можно вернуться через Сагурамо и выйти на Военно-Грузинскую дорогу.
fa:
  name: جنگل سابادوری
  short: جنگل افسانه‌ای پارک ملی تفلیس — جاده‌ای که در زمستان به تونلی برفی از درختان بدل می‌شود، یک ساعت
    از شهر.
  body: >-
    **سابادوری همان جنگلی است که عکس‌های زمستانی‌اش را احتمالاً دیده‌اید** — شاخه‌های سنگین از برف از
    دو سو بر جاده خم می‌شوند و تونلی سفید می‌سازند. بهترین بخش ماجرا این است که این افسانه فقط یک ساعت
    رانندگی از تفلیس فاصله دارد.


    جنگل بخشی از پارک ملی تفلیس است — نخستین پارک ملی گرجستان، بنیان‌گذاری‌شده در 1973 — و دامنه‌های رشته‌کوه
    ساگورامو را میان حدود 600 تا 1700 متر می‌پوشاند؛ بیش از 5000 هکتار. بلوط، راش و ممرز صحنه را فصل به
    فصل عوض می‌کنند: مخمل رنگارنگ در اکتبر و برف تضمینی از ژانویه تا مارس.


    آنچه در انتظار شماست:


    - **جادهٔ مشهور جنگلی** میان تسخواریچامیا و گردنه — عکاسانه‌ترین بخش مسیر

    - **محوطه‌های پیک‌نیک** با میز، جای چادر و تابلوهای اطلاعاتی

    - قارچ‌چین‌ها و دامنه‌های مسی‌رنگ در پاییز


    مسیر پیاده‌روی علامت‌گذاری‌شده کم است؛ تجربهٔ اصلی خودِ جاده است، با توقف‌ها و پرسه‌زدن آرام زیر درختان.
    در روزهای برفی سابادوری تفریح محبوب تفلیسی‌هاست، پس آخر هفته‌ها جادهٔ ورودی حسابی شلوغ می‌شود.
  tip: >-
    زیباترین روز، نخستین صبح آفتابی پس از بارش برف است — و دقیقاً همان وقت همه می‌آیند؛ پس روزی در میانهٔ
    هفته را انتخاب کنید. در زمستان لاستیک زمستانی اجباری است و جاده پس از برف سنگین پاک می‌شود، اما باز
    هم آهسته برانید. امکانات حداقلی است: خوراکی و آب بیاورید؛ در کل مسیر فقط یک کافه هست. ورود رایگان
    است. آنتن موبایل جاهایی قطع می‌شود.
  route: >-
    از تفلیس از راه گلدانی وارد جادهٔ تفلیس–تیانتی (Sh-30) شوید، به سوی تسودورتی و تسخواریچامیا؛ زیباترین
    بخش جنگل بعد از روستا آغاز می‌شود — روی هم حدود 45 کیلومتر و یک ساعت. جاده عمدتاً آسفالت است با چاله
    و تکه‌های کوتاه شنی؛ زمستان برفی و لغزنده. در هوای خشک خودروی اقتصادی هم می‌رسد، اما در برف، شاسی‌بلند
    با لاستیک زمستانی آشکارا آرام‌تر است. در گلدانی بنزین بزنید — در جنگل پمپ بنزین نیست. در بازگشت می‌توانید
    از ساگورامو به بزرگراه نظامی گرجستان بپیوندید.
he:
  name: יער סבדורי
  short: יער האגדות של הפארק הלאומי טביליסי — דרך שהופכת בחורף למנהרת עצים מושלגת, שעה מהעיר.
  body: >-
    **סבדורי הוא היער שאת תמונות החורף שלו כנראה כבר ראיתם** — ענפים עמוסי שלג מתקמרים מעל הדרך משני הצדדים
    עד שהם נסגרים למנהרה לבנה. והחלק הטוב ביותר: האגדה הזאת נמצאת בקושי שעת נסיעה מטביליסי.


    היער שייך לפארק הלאומי טביליסי — הראשון בגאורגיה, שהוקם ב-1973 — ועוטף את מדרונות רכס סגוראמו בגבהים
    של כ-600 עד 1,700 מ', על פני יותר מ-5,000 הקטרים. אלון, אשור ומילה מחליפים תפאורה לפי עונה: קטיפה
    צבעונית באוקטובר, שלג מובטח מינואר עד מרץ.


    מה מחכה לכם:


    - **דרך היער המפורסמת** בין צחווריצ'מיה למעבר — הקטע הפוטוגני ביותר

    - **פינות פיקניק** עם שולחנות, אזורי קמפינג ולוחות מידע

    - מלקטי פטריות ומדרונות בגוני נחושת בסתיו


    שבילי הליכה מסומנים כמעט שאין; החוויה העיקרית היא הדרך עצמה, עם עצירות ושיטוט איטי מתחת לעצים. בימים
    מושלגים סבדורי הוא בילוי אהוב על תושבי טביליסי, ולכן בסופי שבוע דרך הגישה נסתמת.
  tip: >-
    היום היפה ביותר הוא הבוקר השמשי הראשון אחרי שלג — וזה בדיוק הזמן שבו כולם באים, אז כוונו ליום חול.
    בחורף צמיגי חורף הם חובה; את הדרך מפנים אחרי שלג כבד, אבל סעו לאט בכל מקרה. התשתיות מינימליות: קחו
    אוכל ומים, יש רק בית קפה אחד לכל אורך הקטע. הכניסה חינם. הקליטה נעלמת פה ושם.
  route: >-
    צאו מטביליסי דרך גלדני אל כביש טביליסי–טיאנטי (Sh-30) לכיוון צודורטי וצחווריצ'מיה; קטע היער היפה ביותר
    מתחיל אחרי הכפר — בסך הכול כ-45 ק"מ ושעה. הכביש ברובו אספלט עם בורות וקטעי חצץ קצרים, מושלג וחלקלק
    בחורף. במזג אוויר יבש גם רכב חסכוני מסתדר, אבל בשלג רכב שטח עם צמיגי חורף רגוע בהרבה. תדלקו בגלדני
    — ביער אין תחנות דלק. בחזרה אפשר להקיף דרך סגוראמו ולהתחבר לכביש הצבא הגאורגי.
ar:
  name: غابة سابادوري
  short: الغابة الخرافية في حديقة تبليسي الوطنية — طريق يتحول شتاءً إلى نفق ثلجي من الأشجار، على بعد ساعة
    من المدينة.
  body: >-
    **سابادوري هي الغابة التي رأيت صورها الشتوية على الأرجح** — أغصان مثقلة بالثلج تنحني فوق الطريق من
    الجانبين حتى تنغلق نفقاً أبيض. وأجمل ما في الأمر أن هذه الحكاية تبعد عن تبليسي ساعة قيادة بالكاد.


    تتبع الغابة حديقة تبليسي الوطنية — أول حديقة وطنية في جورجيا، أُسست عام 1973 — وتكسو سفوح سلسلة ساغورامو
    بين نحو 600 و1700 متر، على مساحة تتجاوز 5000 هكتار. يغيّر البلوط والزان والبَقّيصة المشهدَ بتبدل الفصول:
    مخمل ملون في أكتوبر، وثلج مضمون من يناير إلى مارس.


    ما ينتظرك:


    - **طريق الغابة الشهير** بين تسخفاريتشاميا والممر — المقطع الأكثر جاذبية للتصوير

    - **مواقع نزهات** بطاولات، وأماكن تخييم، ولوحات معلومات

    - جامعو الفطر والسفوح النحاسية الحمراء في الخريف


    مسارات المشي المعلّمة قليلة؛ التجربة الأساسية هي الطريق نفسه، بتوقفاته والتجوال البطيء تحت الأشجار.
    في الأيام المثلجة تصبح سابادوري متنفَّس أهل تبليسي المفضل، فيزدحم طريق الوصول بشدة في عطلات نهاية
    الأسبوع.
  tip: >-
    أجمل يوم هو أول صباح مشمس بعد تساقط الثلج — وهو بالضبط حين يأتي الجميع، فاختر يوماً من وسط الأسبوع.
    إطارات الشتاء إلزامية في موسمها، ويُجرف الطريق بعد الثلج الكثيف، لكن سِر ببطء على أي حال. البنية التحتية
    في حدها الأدنى: أحضر طعاماً وماء، فعلى المقطع كله مقهى واحد فقط. الدخول مجاني. وإشارة الهاتف تنقطع
    في مواضع.
  route: >-
    اخرج من تبليسي عبر غلداني إلى طريق تبليسي–تيانيتي (Sh-30) باتجاه تسودوريتي وتسخفاريتشاميا؛ يبدأ أجمل
    مقطع من الغابة بعد القرية — نحو 45 كم وساعة واحدة إجمالاً. الطريق معبّد في معظمه مع حفر ومقاطع حصوية
    قصيرة، ويكون شتاءً مثلجاً زلقاً. في الطقس الجاف تكفي سيارة اقتصادية، أما في الثلج فسيارة دفع رباعي
    بإطارات شتوية أهدأ بوضوح. تزوّد بالوقود في غلداني — فلا محطات في الغابة. وفي العودة يمكنك المرور بساغورامو
    والالتحاق بالطريق العسكري الجورجي.
