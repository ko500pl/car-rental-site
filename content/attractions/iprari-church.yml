ka:
  name: იფრარის მთავარანგელოზთა ეკლესია
  short: >-
    გარედან — უბრალო ქვის სამლოცველო, შიგნით — 1096 წლის ფრესკები: პირველი იმ სამი სვანური ეკლესიიდან,
    რომლებიც თევდორემ მოხატა.
  body: >-
    **გარედან იფრარი არაფერს ამხელს: მოყვითალო პემზის თლილი ქვით ნაგები ოთახი, ხუთ მეტრზე ნაკლები სიგრძისა
    და სამზე ნაკლები სიგანისა, ერთი კარითა და ორი სარკმლით.**


    საკურთხევლის ქვის კანკელზე შემორჩენილი ქართული წარწერა გვამცნობს, რომ 1096 წელს სოფლის თემმა ეკლესიის
    მოხატვა სამეფო კარის მხატვარს, თევდორეს დაუკვეთა. თექვსმეტი წლის შემდეგ, 1112 წელს, იგივე ოსტატი ლაგურკის
    კვირიკესა და ივლიტას ეკლესიას მოხატავს, 1130 წელს კი — ნაკიფარის წმინდა გიორგისას. სამი დათარიღებული
    ეკლესია ერთმანეთისგან სულ რამდენიმე კილომეტრზე დგას: მხატვრის ოცდათოთხმეტწლიანი გზა, რომელსაც დღეს
    მანქანით გაჰყვებით. ეკლესია მთავარანგელოზებს ეძღვნება და ეროვნული მნიშვნელობის კულტურის უძრავი ძეგლია.


    შიგნით სინათლე მხოლოდ ორი სარკმლიდან შემოდის და თვალს დრო სჭირდება. აფსიდაში ვედრებაა, მის ქვემოთ
    — მღვდელმთავრები ორ ანთებულ სასანთლეს შორის. ჩრდილოეთ კედელზე წმინდა გიორგი მიაქროლებს ცხენს, იესო
    ნავეს ძე კი მთავარანგელოზ მიქაელის წინაშე მუხლს იდრეკს; სამხრეთით ცხენოსანი თევდორე შობისა და მთავარანგელოზ
    გაბრიელის გვერდით არის გამოსახული. დასავლეთ კედელზე წმინდა ბარბარე და ეკატერინე არიან, რომლებიც სვანეთში
    განსაკუთრებით უყვარდათ. კედლებს XI–XV საუკუნეების ამოკაწრული მოსახსენებელი წარწერები მიუყვება. გარეთ,
    სოფლისკენ მიქცეული სამხრეთის ფასადი XII საუკუნეში უცნობმა ადგილობრივმა მხატვარმა მოხატა: ვედრება და
    წმინდა ევსტათი პლაკიდას ნადირობა დღეს თითქმის გაცრეცილია.


    1910 წელს ექვთიმე თაყაიშვილმა, რომელიც სვანეთს ექსპედიციით მოივლიდა, აქ სულ მცირე თორმეტი ძველი საეკლესიო
    ნივთი აღრიცხა. მათ შორის იყო XIII საუკუნის სამკარედი ხატი ღვთისმშობლითა და ყრმით, რომელზეც ქტიტორი
    დავითი იყო გამოსახული, წარწერაში კი დავითი და მისი მეუღლე გვანცა იხსენიებოდნენ — როგორც ჩანს, მეფე
    დავით VII. ხატი დაკარგულია და მხოლოდ დიმიტრი ერმაკოვის ფოტოზე შემორჩა, რომელიც თაყაიშვილს ექსპედიციაში
    ახლდა.


    სიშორემ ეს სიმდიდრე ცხრა საუკუნე შეინახა — და სწორედ ამიტომ გჭირდებათ დღესაც გასაღები.
  tip: >-
    ეკლესია ჩვეულებრივ დაკეტილია; გასაღები სოფელში მცხოვრებ მომვლელს აქვს. სპეციალურად წამოსვლამდე მესტიაში,
    სასტუმროს მასპინძლის ან გიდის მეშვეობით შეათანხმეთ, ადგილზე კი მეზობლებს ჰკითხეთ. შესვლა უფასოა, შემოწირულობას
    სიამოვნებით მიიღებენ. შიგნით ბნელა — პატარა ფარანი გამოგადგებათ, ფრესკებს კი ფოტოს ფლეში არ აკადრეთ.
    მხრები და მუხლები დაიფარეთ, ქალებს თავსაფარი დასჭირდებათ. იფრარი ლაგურკიდან ორიოდე კილომეტრშია, ნაკიფარი
    მესტიის გზაზე დაგხვდებათ: სამივე ერთ დღეში ჩაეტევა, თევდორეს მოხატვის რიგითაც — იფრარი, ლაგურკა, ნაკიფარი.
    მაისიდან ოქტომბრამდე მოდით; ახლოს არც კაფეა, არც ტუალეტი.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ ზუგდიდამდე, იქიდან შ7-ით ენგურის ხეობით მესტიამდე —
    დაახლოებით 470 კმ და რვანახევარი საათი, ამიტომ ღამე მესტიაში გაათიეთ. მესტიიდან უშგულის გზას დაახლოებით
    35 კილომეტრი გაჰყევით: გზა ახლა უმეტესად მოასფალტებულია, თუმცა ენგურის თავზე ვიწრო, ცუდი ხრეშიანი
    მონაკვეთებიც გვხვდება. კალასთან მოკლე შესახვევიდან ეკლესიამდე რამდენიმე წუთის სავალია. თბილისიდან
    სულ დაახლოებით 505 კმ და ათი საათი საჭესთან. გირჩევთ მაღალი გამავლობის მანქანას (კროსოვერს ან ჯიპს):
    ცუდ მონაკვეთებზე კლირენსი გჭირდებათ, თუმცა მშრალ ზაფხულში ეს გზა მხოლოდ სრულამძრავიანი მანქანებისთვის
    არ არის; ძლიერი წვიმის შემდეგ ნელა იარეთ. ბოლო ბენზინგასამართი მესტიაშია.
en:
  name: Iprari Church of the Archangels (Tarngzel)
  short: >-
    A plain stone box in Upper Svaneti holding frescoes dated 1096: the first of the three Svan churches
    painted by the master Tevdore.
  body: >-
    **From the outside Iprari gives nothing away: a room of yellowish hewn pumice, less than five metres
    long and under three wide, with one door and two windows.**


    A Georgian inscription on its stone altar screen records that in 1096 the village community commissioned
    the interior from Tevdore, the royal painter. Sixteen years later, in 1112, the same master painted
    the church of Saints Cyricus and Julitta at Lagurka; in 1130, St George at Nakipari. Three dated churches
    a few kilometres apart: a thirty-four-year career you can follow by car. The church, known locally
    as Tarngzel, is dedicated to the Archangels and listed as a Cultural Monument of National Significance.


    Inside, light enters through just two windows, and your eyes need time. The apse holds the Deesis
    above church fathers flanked by burning candelabra. On the north wall St George rides and Joshua kneels
    before the Archangel Michael; on the south, Theodore rides beside the Nativity and the Archangel Gabriel.
    Saints Barbara and Catherine, much loved in Svaneti, stand on the west wall. Memorial graffiti, scratched
    between the 11th and 15th centuries, run across the plaster. Outside, the south façade facing the
    village was painted by an unknown local artist in the 12th century; its Deesis and hunting St Eustace
    have largely faded.


    In 1910 the scholar Ekvtime Taqaishvili, touring Svaneti, recorded at least a dozen old church objects
    here. Among them was a 13th-century triptych of the Virgin and Child showing a donor named David,
    with David and his wife Gvantsa named in an inscription, most likely King David VII. The triptych
    is lost; it survives only in a photograph by Dmitri Yermakov, who travelled with Taqaishvili.


    Remoteness kept all this safe for nine centuries, which is also why you will need to find the key.
  tip: >-
    The church is normally locked, and the key is kept by a caretaker in the village. Arrange access through
    your guesthouse or a guide in Mestia before a special trip, then ask the neighbours on arrival. Entry
    is free; a donation is welcome. It is dark inside, so bring a small torch, and please keep the flash
    off the frescoes. Cover shoulders and knees; women will need a headscarf. Lagurka is a couple of kilometres
    away and Nakipari is on the way back to Mestia, so one day covers all three in the order Tevdore painted
    them. Come between May and October; there is no café or toilet nearby.
  route: >-
    From Tbilisi take the E60 (S1) west to Zugdidi and the Sh7 up the Enguri gorge to Mestia: about 470
    km and eight and a half hours, so plan a night there. From Mestia follow the Ushguli road for about
    35 km. It is now mostly asphalt, with some narrow, rough gravel sections high above the Enguri. A
    short turning near Kala brings you within a few minutes' walk of the church. In all it is about 505
    km and ten hours at the wheel. We recommend an SUV for the clearance on the rough sections, though
    in dry summer weather this is not a 4x4-only road; go slowly after heavy rain. The last fuel is in
    Mestia.
ru:
  name: Ипрарская церковь Архангелов (Тарнгзел)
  short: >-
    Скромная каменная коробка в Верхней Сванетии, а внутри — фрески 1096 года: первая из трёх сванских
    церквей, расписанных мастером Тевдоре.
  body: >-
    **Снаружи Ипрари ничем себя не выдаёт: комната из желтоватой тёсаной пемзы длиной меньше пяти метров
    и шириной меньше трёх, с одной дверью и двумя окнами.**


    Грузинская надпись на каменной алтарной преграде сообщает, что в 1096 году сельская община заказала
    роспись интерьера Тевдоре, царскому художнику. Шестнадцать лет спустя, в 1112-м, тот же мастер расписал
    церковь святых Кирика и Иулитты в Лагурке, а в 1130-м — церковь Святого Георгия в Накипари. Три датированные
    церкви в нескольких километрах друг от друга: тридцатичетырёхлетний путь художника можно проследить
    на машине. Церковь, которую местные называют Тарнгзел, посвящена Архангелам и внесена в список памятников
    культуры национального значения.


    Свет проникает внутрь всего через два окна, и глазам нужно время, чтобы привыкнуть. В апсиде — Деисус,
    под ним святители между горящими светильниками. На северной стене скачет святой Георгий, а Иисус Навин
    преклоняет колени перед архангелом Михаилом; на южной рядом с Рождеством и архангелом Гавриилом едет
    верхом святой Феодор. На западной стене стоят святые Варвара и Екатерина, особенно любимые в Сванетии.
    По штукатурке тянутся поминальные граффити, процарапанные между XI и XV веками. Снаружи южный фасад,
    обращённый к селу, в XII веке расписал неизвестный местный художник; его Деисус и Евстафий на охоте
    почти стёрлись.


    В 1910 году учёный Эквтиме Такайшвили, объезжая Сванетию, описал здесь не меньше дюжины старинных
    церковных предметов. Среди них был триптих XIII века с Богоматерью и Младенцем и донатором по имени
    Давид; надпись называла Давида и его жену Гванцу — скорее всего, это царь Давид VII. Триптих утрачен
    и сохранился лишь на фотографии Дмитрия Ермакова, путешествовавшего вместе с Такайшвили.


    Девять веков всё это берегла удалённость — и именно поэтому вам придётся искать ключ.
  tip: >-
    Церковь обычно заперта, ключ хранится у смотрителя в селе. Прежде чем ехать сюда специально, договоритесь
    о доступе через свой гостевой дом или гида в Местиа, а по приезде спросите у соседей. Вход бесплатный,
    пожертвование приветствуется. Внутри темно — возьмите небольшой фонарик и, пожалуйста, не снимайте
    фрески со вспышкой. Плечи и колени должны быть закрыты, женщинам понадобится платок. Лагурка в паре
    километров, а Накипари по дороге обратно в Местиа, так что за один день можно увидеть все три церкви
    в том порядке, в каком их расписывал Тевдоре. Приезжайте с мая по октябрь; поблизости нет ни кафе,
    ни туалета.
  route: >-
    Из Тбилиси поезжайте по E60 (S1) на запад до Зугдиди, а затем по Sh7 вверх по ущелью Ингури до Местиа:
    около 470 км и восемь с половиной часов, так что запланируйте там ночёвку. Из Местиа следуйте по дороге
    на Ушгули примерно 35 км. Сейчас она в основном асфальтирована, но высоко над Ингури попадаются узкие
    разбитые гравийные участки. Короткий съезд у Калы приводит на расстояние нескольких минут ходьбы от
    церкви. Всего около 505 км и десять часов за рулём. Мы рекомендуем внедорожник — ради клиренса на
    разбитых участках, хотя в сухую летнюю погоду эта дорога проходима не только для полноприводных машин;
    после сильного дождя езжайте медленно. Последняя заправка — в Местиа.
fa:
  name: کلیسای فرشتگان مقرب ایپراری (تارنگزل)
  short: >-
    اتاقکی ساده از سنگ در سوانتی علیا با نقاشی‌های دیواری مورخ ۱۰۹۶؛ نخستین کلیسا از سه کلیسای سوانی که
    استاد تئودوره نقاشی کرد.
  body: >-
    **ایپراری از بیرون هیچ رازی را فاش نمی‌کند: اتاقی از پوکه‌سنگ تراشیدهٔ زردفام، با درازای کمتر از پنج
    متر و پهنای کمتر از سه متر، با یک در و دو پنجره.**


    کتیبه‌ای گرجی بر پردهٔ سنگی محراب گواهی می‌دهد که در سال ۱۰۹۶ جامعهٔ روستا نقاشی درون کلیسا را به
    تئودوره، نقاش دربار شاهی، سفارش داد. شانزده سال بعد، در ۱۱۱۲، همین استاد کلیسای قدیسان کوریکوس و ژولیتا
    را در لاگورکا نقاشی کرد و در ۱۱۳۰ کلیسای گئورگی قدیس را در ناکیپاری. سه کلیسای تاریخ‌دار که تنها چند
    کیلومتر از هم فاصله دارند: کارنامهٔ سی‌وچهارسالهٔ یک نقاش را می‌توان پشت فرمان دنبال کرد. این کلیسا
    که مردم محل تارنگزل می‌نامندش، به فرشتگان مقرب تقدیم شده و در فهرست آثار فرهنگی با اهمیت ملی ثبت است.


    نور تنها از دو پنجره به درون می‌تابد و چشم‌ها زمان می‌خواهند تا به تاریکی خو بگیرند. در شاه‌نشین محراب
    صحنهٔ دیسیس (شفاعت) نقش بسته و زیر آن پدران کلیسا میان شمعدان‌های فروزان ایستاده‌اند. بر دیوار شمالی
    گئورگی قدیس سوار بر اسب است و یوشع در برابر میکائیلِ فرشتهٔ مقرب زانو زده؛ بر دیوار جنوبی تئودور قدیس
    سواره در کنار صحنهٔ میلاد مسیح و جبرئیلِ فرشتهٔ مقرب دیده می‌شود. قدیسه باربارا و قدیسه کاترین، که
    در سوانتی بسیار محبوب‌اند، بر دیوار غربی ایستاده‌اند. یادنوشته‌هایی که میان سده‌های یازدهم و پانزدهم
    بر گچ خراشیده شده‌اند، سراسر دیوارها را پوشانده‌اند. در بیرون، نمای جنوبیِ رو به روستا را نقاشی محلی
    و ناشناس در سدهٔ دوازدهم نقاشی کرده است؛ صحنهٔ دیسیس آن و تصویر قدیس یوستاس در حال شکار تا حد زیادی
    رنگ باخته‌اند.


    در سال ۱۹۱۰ اکوتیمه تکایشویلی، پژوهشگری که در سوانتی سفر می‌کرد، دست‌کم دوازده شیء کهن کلیسایی را
    در اینجا ثبت کرد. در میان آن‌ها سه‌لتی (تریپتیک) از سدهٔ سیزدهم بود با تصویر مریم و کودک و بانی‌ای
    به نام داوید؛ کتیبه‌ای نام داوید و همسرش گوانتسا را آورده بود و به احتمال زیاد مقصود شاه داوید هفتم
    است. این سه‌لتی گم شده و تنها در عکسی از دمیتری یرماکوف، همسفر تکایشویلی، باقی مانده است.


    دورافتادگی نُه سده این همه را سالم نگه داشت — و به همین دلیل است که باید کلید را پیدا کنید.
  tip: >-
    کلیسا معمولاً قفل است و کلیدش نزد نگهبانی در روستاست. پیش از آنکه تنها برای دیدن آن راهی شوید، از
    طریق مهمان‌خانه یا راهنمایتان در مستیا ترتیب ورود را بدهید و هنگام رسیدن از همسایه‌ها بپرسید. ورود
    رایگان است و کمک نقدی با سپاس پذیرفته می‌شود. درون کلیسا تاریک است؛ چراغ‌قوهٔ کوچکی همراه داشته باشید
    و لطفاً فلاش را روی نقاشی‌ها روشن نکنید. شانه‌ها و زانوها باید پوشیده باشد و بانوان به روسری نیاز
    دارند. لاگورکا دو سه کیلومتر آن‌طرف‌تر است و ناکیپاری سر راه بازگشت به مستیا؛ پس در یک روز می‌توان
    هر سه را به همان ترتیبی دید که تئودوره نقاشی‌شان کرد. از ماه مه تا اکتبر بیایید؛ در آن نزدیکی نه کافه‌ای
    هست و نه سرویس بهداشتی.
  route: >-
    از تفلیس جادهٔ E60 (S1) را به سمت غرب تا زوگدیدی بروید و سپس از راه Sh7 درهٔ انگوری را تا مستیا بالا
    بروید: حدود ۴۷۰ کیلومتر و هشت ساعت و نیم، پس یک شب اقامت در آنجا را در برنامه بگذارید. از مستیا حدود
    ۳۵ کیلومتر جادهٔ اوشگولی را دنبال کنید. جاده اکنون بیشترش آسفالت است، اما بر فراز رود انگوری تکه‌هایی
    باریک، شنی و ناهموار هم دارد. انشعابی کوتاه نزدیک کالا شما را تا چند دقیقه پیاده‌روی از کلیسا می‌رساند.
    روی هم حدود ۵۰۵ کیلومتر و ده ساعت پشت فرمان. خودروی شاسی‌بلند را به خاطر فاصلهٔ بیشترش از زمین روی
    این تکه‌های ناهموار توصیه می‌کنیم، هرچند در هوای خشک تابستان این جاده فقط مخصوص خودروهای چهارچرخ‌محرک
    نیست؛ پس از باران شدید آهسته برانید. آخرین جایگاه سوخت در مستیاست.
he:
  name: כנסיית המלאכים הראשיים באיפרארי (טרנגזל)
  short: >-
    קופסת אבן צנועה בסוואנטי העילית, ובתוכה ציורי קיר מ-1096: הראשונה מבין שלוש הכנסיות הסוואניות שצייר
    האמן טוודורה.
  body: >-
    **מבחוץ איפרארי אינה מסגירה דבר: חדר מאבן ספוג מסותתת בגוון צהבהב, שאורכו פחות מחמישה מטרים ורוחבו
    פחות משלושה, עם דלת אחת ושני חלונות.**


    כתובת גאורגית על מחיצת המזבח העשויה אבן מתעדת כי ב-1096 הזמינה קהילת הכפר את ציורי הפנים מטוודורה,
    צייר המלך. שש עשרה שנה מאוחר יותר, ב-1112, צייר אותו אמן את כנסיית הקדושים קיריקוס ויוליטה בלגורקה,
    וב-1130 את כנסיית גאורגיוס הקדוש בנקיפארי. שלוש כנסיות מתוארכות, במרחק קילומטרים ספורים זו מזו: קריירה
    של שלושים וארבע שנים שאפשר לעקוב אחריה ברכב. הכנסייה, המכונה בפי המקומיים טרנגזל, מוקדשת למלאכים הראשיים
    ורשומה כאתר מורשת תרבותית בעל חשיבות לאומית.


    האור נכנס פנימה דרך שני חלונות בלבד, והעיניים זקוקות לזמן כדי להסתגל. באפסיס מופיע הדאיסיס – ישו ולצדו
    מרים ויוחנן המטביל בתפילת השתדלות – ומתחתיו אבות הכנסייה, ומשני צדיהם מנורות דולקות. על הקיר הצפוני
    רוכב גאורגיוס הקדוש, ויהושע כורע ברך לפני המלאך הראשי מיכאל; על הקיר הדרומי רוכב תאודורוס הקדוש לצד
    סצנת המולד והמלאך הראשי גבריאל. הקדושות ברברה וקתרינה, האהובות במיוחד בסוואנטי, ניצבות על הקיר המערבי.
    כתובות זיכרון שנחרטו בטיח בין המאה ה-11 למאה ה-15 משתרעות על פני הקירות. בחוץ, את החזית הדרומית הפונה
    אל הכפר צייר במאה ה-12 אמן מקומי אלמוני; הדאיסיס שלו ודמותו של אוסטתיוס הקדוש בציד דהו ברובם.


    ב-1910 תיעד כאן החוקר אקבתימה תקאישווילי, במסעו בסוואנטי, לפחות תריסר חפצי כנסייה עתיקים. ביניהם היה
    טריפטיכון מהמאה ה-13 ובו הבתולה מריה עם הילד ודמות תורם בשם דוד; כתובת נקבה בשמם של דוד ורעייתו גוונצה,
    וככל הנראה מדובר במלך דוד השביעי. הטריפטיכון אבד, והוא שרד רק בתצלום של דמיטרי ירמקוב, שנלווה לתקאישווילי
    במסעו.


    הריחוק שמר על כל זה במשך תשע מאות שנה — ובגללו גם תצטרכו למצוא את המפתח.
  tip: >-
    הכנסייה נעולה בדרך כלל, והמפתח נמצא אצל שומר בכפר. לפני שאתם יוצאים לכאן במיוחד, תאמו כניסה דרך בית
    ההארחה שלכם או מדריך במסטיה, ובהגיעכם שאלו את השכנים. הכניסה חינם; תרומה תתקבל בברכה. בפנים חשוך,
    אז הביאו פנס קטן, ובבקשה אל תפעילו פלאש מול ציורי הקיר. יש לכסות כתפיים וברכיים; נשים יזדקקו למטפחת
    ראש. לגורקה נמצאת במרחק קילומטרים ספורים, ונקיפארי שוכנת בדרך חזרה למסטיה, כך שביום אחד אפשר לראות
    את שלושתן לפי הסדר שבו צייר אותן טוודורה. בואו בין מאי לאוקטובר; אין בסביבה בית קפה או שירותים.
  route: >-
    מטביליסי סעו מערבה בכביש E60 (S1) עד זוגדידי, ומשם בכביש Sh7 במעלה ערוץ האנגורי עד מסטיה: כ-470 ק"מ
    ושמונה שעות וחצי, אז תכננו לינה שם. ממסטיה המשיכו בדרך לאושגולי כ-35 ק"מ. הדרך סלולה כיום ברובה, אך
    גבוה מעל האנגורי יש בה קטעי חצץ צרים ומשובשים. פנייה קצרה ליד קאלה מביאה אתכם למרחק הליכה של דקות
    ספורות מהכנסייה. בסך הכול כ-505 ק"מ ועשר שעות נהיגה. אנו ממליצים על רכב פנאי-שטח בזכות מרווח הגחון
    בקטעים המשובשים, אף שבמזג אוויר קיצי יבש זו אינה דרך לרכבי הנעה כפולה בלבד; אחרי גשם כבד סעו לאט.
    תחנת הדלק האחרונה נמצאת במסטיה.
ar:
  name: كنيسة رؤساء الملائكة في إيبراري (تارنغزل)
  short: >-
    صندوق حجري بسيط في سفانيتي العليا يحتضن جداريات مؤرخة بعام 1096، وهي أولى الكنائس السفانية الثلاث
    التي رسمها المعلّم تيفدوره.
  body: >-
    **لا تبوح إيبراري من الخارج بشيء: غرفة من حجر الخفاف المنحوت المائل إلى الصفرة، طولها أقل من خمسة
    أمتار وعرضها دون ثلاثة، لها باب واحد ونافذتان.**


    يسجّل نقش جورجي على حاجز المذبح الحجري أن جماعة القرية كلّفت عام 1096 رسّامَ الملك تيفدوره بتزيين
    الداخل. وبعد ستة عشر عامًا، في 1112، رسم المعلّم نفسه كنيسة القديسين قرياقوس ويوليطة في لاغوركا، وفي
    1130 كنيسة القديس جاورجيوس في ناكيباري. ثلاث كنائس مؤرخة لا تفصل بينها سوى بضعة كيلومترات: مسيرة فنية
    امتدت أربعة وثلاثين عامًا يمكنك أن تتتبعها وأنت خلف المقود. هذه الكنيسة، التي يسميها أهل المكان تارنغزل،
    مكرّسة لرؤساء الملائكة ومدرجة معلمًا ثقافيًا ذا أهمية وطنية.


    في الداخل لا يدخل الضوء إلا من نافذتين، وتحتاج العين إلى وقت لتعتاد العتمة. في الحنية مشهد الديسيس
    (الشفاعة)، وتحته آباء الكنيسة تحفّ بهم شمعدانات مشتعلة. على الجدار الشمالي يمتطي القديس جاورجيوس جواده،
    ويجثو يشوع أمام رئيس الملائكة ميخائيل؛ وعلى الجدار الجنوبي يمتطي القديس ثيودوروس جواده إلى جانب مشهد
    الميلاد ورئيس الملائكة جبرائيل. وعلى الجدار الغربي تقف القديستان بربارة وكاترين، وهما محبوبتان على
    نحو خاص في سفانيتي. وتمتد على الجص نقوش تذكارية حُفرت بين القرنين الحادي عشر والخامس عشر. وفي الخارج،
    رسم فنان محلي مجهول في القرن الثاني عشر الواجهة الجنوبية المطلة على القرية؛ وقد بهت معظم ما فيها من
    مشهد الشفاعة وصورة القديس أوسطاثيوس في رحلة الصيد.


    في عام 1910 سجّل الباحث إكفتيمه تاكايشفيلي، خلال جولته في سفانيتي، ما لا يقل عن اثنتي عشرة قطعة كنسية
    قديمة هنا. ومن بينها لوحة ثلاثية (تريبتيك) من القرن الثالث عشر تصوّر العذراء والطفل ومعهما واهبٌ يُدعى
    داود، وقد ذكر نقشٌ اسمَ داود وزوجته غفانتسا، والأرجح أنه الملك داود السابع. ضاعت اللوحة الثلاثية،
    ولم يبقَ منها سوى صورة فوتوغرافية التقطها دميتري يرماكوف الذي رافق تاكايشفيلي في رحلته.


    حفظت العزلةُ كل ذلك تسعة قرون، ولهذا السبب نفسه ستحتاج إلى البحث عن المفتاح.
  tip: >-
    تكون الكنيسة عادةً مقفلة، والمفتاح لدى حارس في القرية. قبل أن تخصّها برحلة، رتّب الدخول عبر دار الضيافة
    التي تنزل فيها أو عبر مرشد في ميستيا، ثم اسأل الجيران عند وصولك. الدخول مجاني والتبرع موضع ترحيب.
    الداخل مظلم، فاحمل مصباحًا يدويًا صغيرًا، ورجاءً لا تستخدم الفلاش على الجداريات. غطِّ الكتفين والركبتين،
    وتحتاج النساء إلى غطاء للرأس. تقع لاغوركا على بعد كيلومترين تقريبًا، وناكيباري على طريق العودة إلى
    ميستيا، فيكفي يوم واحد لرؤية الكنائس الثلاث بالترتيب الذي رسمها به تيفدوره. تعالَ بين مايو وأكتوبر؛
    لا يوجد مقهى ولا دورة مياه في الجوار.
  route: >-
    من تبليسي اسلك الطريق E60 (S1) غربًا حتى زوغديدي، ثم الطريق Sh7 صعودًا في وادي إنغوري حتى ميستيا:
    نحو 470 كم وثماني ساعات ونصف، لذا خطّط للمبيت هناك. من ميستيا اتبع طريق أوشغولي نحو 35 كم. الطريق
    معبّد بالإسفلت في معظمه اليوم، لكن فيه مقاطع حصوية ضيقة ووعرة عاليًا فوق نهر إنغوري. منعطف قصير قرب
    كالا يوصلك إلى مسافة دقائق سيرًا من الكنيسة. المجموع نحو 505 كم وعشر ساعات خلف المقود. ننصح بسيارة
    رياضية متعددة الاستخدامات لخلوصها الأرضي على المقاطع الوعرة، وإن كان الطريق في طقس الصيف الجاف لا
    يقتصر على سيارات الدفع الرباعي؛ وبعد المطر الغزير قُد ببطء. آخر محطة وقود في ميستيا.
