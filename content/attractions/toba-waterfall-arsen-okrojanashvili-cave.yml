ka:
  name: ტობის ჩანჩქერი და არსენ ოქროჯანაშვილის მღვიმე
  short: >-
    234-მეტრიანი ტობა, საქართველოს უმაღლესი კასკადი, სამიარუსიანი მღვიმიდან გამოდის; პირველი ბალდიდან
    მონიშნული ბილიკით 5,6 კილომეტრია.
  body: >-
    **სანამ საქართველოს უმაღლეს კასკადად 234 მეტრიდან ჩამოვარდება, ამ წყალს უკვე გავლილი აქვს ოთხი ტბა,
    სადაც დღის სინათლე ვერასოდეს აღწევს.**


    ჩანჩქერი და მისი მკვებავი მღვიმე ერთ ბუნების ძეგლს ქმნის, რომელიც 2013 წელს გამოცხადდა. ის მარტვილის
    მუნიციპალიტეტში, მეორე ბალდის ჩრდილო-აღმოსავლეთით, ტობის ხეობაში, ზღვის დონიდან დაახლოებით 707 მეტრზე
    მდებარეობს. დაცული ტერიტორიების სააგენტოს მონაცემით, კასკადის სიმაღლე 234 მეტრია — საქართველოში ყველაზე
    მაღალი. ეს ერთი ვარდნა კი არა, წყლის გრძელი კიბეა, რომელიც იქ იწყება, სადაც მდინარე არსენ ოქროჯანაშვილის
    მღვიმიდან — იგივე ტობა II-დან — გამოდის.


    მღვიმე შრეებრივ ზედაცარცულ კირქვაშია გამომუშავებული. მისი 15 მეტრი სიმაღლისა და 20 მეტრი სიგანის შესასვლელი
    ქარაფის გასწვრივ იხსნება; შიგნით 1300 მეტრი სავალი სამ იარუსად განშტოვდება — დარბაზებით, რომელთაც
    „ნონას დარბაზი“, „ნანას დარბაზი“, „სალონი“, „უნივერსიტეტი 50“ და „ტბიანი“ ჰქვია, და მრავალნაირი ფორმის
    ნაღვენთებით, რომელთა შორის ერთი სტალაგმიტი შვიდ მეტრს აღწევს. მღვიმეში სამოგზაუროდ გასაბერი ნავია
    საჭირო, სააგენტო კი სპეციალური აღჭურვილობის გარეშე შესასვლელამდე ასვლასაც არ გირჩევთ.


    სახელები ერთმანეთში ნუ აგერევათ. აქედან კილომეტრზე ნაკლებ მანძილზე ონიორეს ჩანჩქერი და ტობის პირველი
    მღვიმეა — ცალკე ძეგლი, რომლის ჩანჩქერი 67 მეტრისაა. 234-მეტრიანი კი ტობაა.


    სტუმართა უმეტესობისთვის მიზანი ჩანჩქერია: პირველი ბალდიდან 5,6 კილომეტრი მონიშნული ბილიკით, სააგენტოს
    თქმით, ცალ მხარეს დაახლოებით ერთი საათი და ათი წუთი.


    მღვიმე სპელეოლოგებს ეკუთვნის, კასკადი კი — ყველას, ვისაც სიარული არ ეზარება.
  tip: >-
    ნახევარი დღე გამოყავით: პირველი ბალდიდან მონიშნული ბილიკი ცალ მხარეს 5,6 კილომეტრია. მშრალ ამინდში
    წადით — ტყის თიხა წვიმის შემდეგ სრიალებს; არასრიალა ძირიანი ფეხსაცმელი და ტრეკინგის ჯოხები დაგეხმარებათ.
    მღვიმე მხოლოდ აღჭურვილი სპელეოლოგებისთვისაა, გამცილებლით — შესასვლელისკენ დამოუკიდებლად ნუ წახვალთ.
    გზაზე არც წყალია, არც ტუალეტი, არც კაფე, კავშირიც სუსტია, ამიტომ მარაგი მარტვილიდან წაიღეთ და ოფლაინ
    რუკა ჩამოტვირთეთ. ყველაზე უხვი წყალი გაზაფხულსა და ზაფხულის დასაწყისშია. საფასური, თუ არსებობს, დადასტურებული
    არ არის — სააგენტოში გადაამოწმეთ. 67-მეტრიანი ონიორე ამ ჩანჩქერში ნუ შეგეშლებათ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის მიმართულებით იარეთ, აბაშისკენ
    გააგრძელეთ და ჩრდილოეთით, მარტვილისკენ გადაუხვიეთ. მარტვილიდან ჩრდილო-აღმოსავლეთით 9,4 კილომეტრი,
    დაახლოებით ოცი წუთი, სოფელ პირველ ბალდამდე, სადაც მონიშნული ბილიკი იწყება. სულ დაახლოებით 290 კმ და
    ხუთი საათი. მარტვილამდე ასფალტია, მის იქით სოფლის გზა ვიწრო და ადგილ-ადგილ უხეშია, ამიტომ მაღალი გამავლობის
    მანქანა (კროსოვერი ან ჯიპი) ყველაზე საიმედოა, განსაკუთრებით წვიმის შემდეგ. მანქანა პირველ ბალდაში
    დატოვეთ და ბოლო 5,6 კილომეტრი ფეხით გაიარეთ. საწვავი სამტრედიაში ან მარტვილში ჩაასხით — შემდეგ გასამართი
    აღარ არის.
en:
  name: Toba Waterfall and Arsen Okrojanashvili Cave
  short: >-
    Toba, at 234 metres Georgia's highest cascade, pours from a three-level cave; a marked 5.6 km trail
    leads to it from First Balda.
  body: >-
    **Before it falls 234 metres as Georgia's highest cascade, this water has already passed through four
    lakes that daylight never reaches.**


    The waterfall and the cave that feeds it form a single natural monument, designated in 2013, in the
    Toba valley north-east of Second Balda in Martvili municipality, about 707 metres above sea level.
    The Agency of Protected Areas gives the cascade's height as 234 metres, the highest in Georgia. It
    is not one plunge but a long staircase of water, and it begins where a river leaves the Arsen Okrojanashvili
    Cave, also known as Toba II.


    The cave is cut into layered Upper Cretaceous limestone. Its mouth, 15 metres high and 20 wide, opens
    along the cliff face; inside, 1,300 metres of passages branch across three levels, through halls with
    names such as Nona's Hall, Nana's Hall, the Salon, University 50 and Tbiani, past formations of every
    shape, one stalagmite reaching seven metres. Travelling through it takes an inflatable boat, and the
    Agency advises against climbing even to the entrance without special equipment.


    Keep the names straight. Less than a kilometre away lies the Oniore waterfall with the Toba First
    Cave, a separate monument whose fall is 67 metres. Toba is the tall one.


    For most visitors the waterfall is the destination: 5.6 kilometres on a marked footpath from First
    Balda, about an hour and ten minutes each way by the Agency's reckoning.


    The cave belongs to speleologists; the cascade belongs to anyone willing to walk.
  tip: >-
    Set aside half a day: the marked trail from First Balda is 5.6 km each way. Go in dry weather, as
    the forest clay turns slick after rain; boots with grip and trekking poles help. The cave is for equipped
    speleologists with a guide only, so do not head for the entrance on your own. There is no water, toilet
    or café on the way and the signal is weak: bring supplies from Martvili and an offline map. Spring
    and early summer give the fullest flow. Any fee is unconfirmed; check with the Agency. Do not mistake
    the 67-metre Oniore fall nearby for this one.
  route: >-
    From Tbilisi take the S1 west towards Kutaisi and Samtredia, continue towards Abasha and turn north
    to Martvili. From Martvili it is 9.4 km, about twenty minutes, north-east to First Balda, where the
    marked trail begins. In all about 290 km and five hours. The road is asphalt to Martvili; the village
    road beyond is narrow and rough in places, so an SUV is the safe choice, especially after rain. Leave
    the car in First Balda and walk the last 5.6 km. Refuel in Samtredia or Martvili; there is nothing
    further on.
ru:
  name: Водопад Тоба и пещера Арсена Окроджанашвили
  short: >-
    Тоба высотой 234 метра — самый высокий каскад Грузии — вытекает из трёхъярусной пещеры; к нему ведёт
    маркированная тропа длиной 5,6 км от Первой Балды.
  body: >-
    **Прежде чем упасть с высоты 234 метров самым высоким каскадом Грузии, эта вода успевает пройти через
    четыре озера, куда никогда не проникает дневной свет.**


    Водопад и питающая его пещера составляют единый памятник природы, учреждённый в 2013 году, — в долине
    Тоба к северо-востоку от Второй Балды, в Мартвильском муниципалитете, примерно в 707 метрах над уровнем
    моря. Агентство охраняемых территорий указывает высоту каскада в 234 метра: это самый высокий каскад
    в Грузии. Здесь не один отвесный прыжок, а длинная водяная лестница, и начинается она там, где река
    выходит из пещеры Арсена Окроджанашвили, известной также как Тоба II.


    Пещера вырезана в слоистом верхнемеловом известняке. Её вход высотой 15 метров и шириной 20 открывается
    в стене обрыва; внутри 1300 метров ходов ветвятся на трёх ярусах — через залы с такими названиями,
    как Зал Ноны, Зал Наны, Салон, «Университет 50» и Тбиани, мимо натёчных образований всех форм; один
    сталагмит достигает семи метров. Чтобы пройти пещеру, нужна надувная лодка, а Агентство не советует
    даже подниматься ко входу без специального снаряжения.


    Не перепутайте названия. Меньше чем в километре отсюда находится водопад Ониоре с Первой пещерой Тоба
    — отдельный памятник, высота водопада которого 67 метров. Высокий из двух — Тоба.


    Для большинства посетителей цель — водопад: 5,6 километра по маркированной тропе от Первой Балды,
    около часа десяти минут в одну сторону по расчётам Агентства.


    Пещера принадлежит спелеологам; каскад — всякому, кто готов идти пешком.
  tip: >-
    Выделите полдня: маркированная тропа от Первой Балды — 5,6 км в одну сторону. Идите в сухую погоду:
    после дождя лесная глина становится скользкой; помогут ботинки с цепкой подошвой и треккинговые палки.
    Пещера — только для экипированных спелеологов с проводником, так что не пытайтесь добраться до входа
    самостоятельно. По пути нет ни воды, ни туалета, ни кафе, связь слабая: возьмите всё необходимое в
    Мартвили и скачайте офлайн-карту. Самый полноводный сезон — весна и начало лета. Есть ли плата, не
    подтверждено; уточните в Агентстве. Не примите соседний 67-метровый водопад Ониоре за этот.
  route: >-
    Из Тбилиси поезжайте по S1 на запад, в сторону Кутаиси и Самтредиа, продолжайте в направлении Абаши
    и сверните на север к Мартвили. От Мартвили 9,4 км, около двадцати минут, на северо-восток до Первой
    Балды, где начинается маркированная тропа. Всего около 290 км и пять часов. До Мартвили — асфальт;
    дальше сельская дорога местами узкая и разбитая, так что надёжнее взять внедорожник, особенно после
    дождя. Оставьте машину в Первой Балде и пройдите последние 5,6 км пешком. Заправьтесь в Самтредиа
    или Мартвили: дальше заправок нет.
fa:
  name: آبشار توبا و غار آرسن اوکروجاناشویلی
  short: >-
    توبا، با ۲۳۴ متر بلندترین آبشار پلکانی گرجستان، از غاری سه‌طبقه بیرون می‌ریزد؛ مسیری نشانه‌گذاری‌شده
    به طول ۵٫۶ کیلومتر از بالدای اول به آن می‌رسد.
  body: >-
    **این آب پیش از آنکه از ارتفاع ۲۳۴ متری در قالب بلندترین آبشار پلکانی گرجستان فرو بریزد، از چهار دریاچه
    گذشته است که نور روز هرگز به آن‌ها نمی‌رسد.**


    آبشار و غاری که آن را تغذیه می‌کند یک اثر طبیعی واحدند که در سال ۲۰۱۳ ثبت شد؛ در درهٔ توبا، شمال‌شرقِ
    بالدای دوم، در شهرستان مارتویلی و در ارتفاع حدود ۷۰۷ متری از سطح دریا. آژانس مناطق حفاظت‌شده بلندی
    این آبشار پلکانی را ۲۳۴ متر اعلام می‌کند که بلندترین در گرجستان است. این آبشار یک ریزش یکباره نیست،
    بلکه پلکانی دراز از آب است که از جایی آغاز می‌شود که رودی از غار آرسن اوکروجاناشویلی، معروف به توبا
    ۲، بیرون می‌آید.


    غار در آهک لایه‌لایهٔ کرتاسهٔ بالایی کنده شده است. دهانه‌اش به بلندی ۱۵ متر و پهنای ۲۰ متر در دیوارهٔ
    صخره گشوده می‌شود؛ در درون، ۱۳۰۰ متر راهرو در سه طبقه شاخه‌شاخه می‌شود و از تالارهایی با نام‌هایی
    چون تالار نونا، تالار نانا، سالن، «دانشگاه ۵۰» و تبیانی می‌گذرد، از کنار سنگ‌سازه‌های آهکی به هر شکلی؛
    یکی از استالاگمیت‌ها به هفت متر می‌رسد. پیمودن غار به قایق بادی نیاز دارد و آژانس توصیه می‌کند که
    حتی تا دهانهٔ غار هم بدون تجهیزات ویژه بالا نروید.


    نام‌ها را با هم اشتباه نگیرید. کمتر از یک کیلومتر آن‌سوتر آبشار اونیوره با غار اول توبا قرار دارد،
    اثر طبیعی جداگانه‌ای که آبشارش ۶۷ متر است. بلندتر، توباست.


    برای بیشتر بازدیدکنندگان، مقصد خود آبشار است: ۵٫۶ کیلومتر در مسیری نشانه‌گذاری‌شده از بالدای اول،
    که به حساب آژانس حدود یک ساعت و ده دقیقه در هر مسیر طول می‌کشد.


    غار از آنِ غارشناسان است؛ آبشار از آنِ هر کسی که حاضر باشد پیاده برود.
  tip: >-
    نیم روز کنار بگذارید: مسیر نشانه‌گذاری‌شده از بالدای اول در هر طرف ۵٫۶ کیلومتر است. در هوای خشک بروید،
    چون گِل رس جنگل پس از باران لغزنده می‌شود؛ پوتینی با کف چسبنده و باتوم کوه‌پیمایی کمک می‌کند. غار
    فقط برای غارشناسان مجهز و همراه راهنماست، پس خودسرانه به سمت دهانه نروید. در مسیر آب، سرویس بهداشتی
    و کافه نیست و آنتن ضعیف است: توشه را از مارتویلی بیاورید و نقشهٔ آفلاین همراه داشته باشید. بهار و
    اوایل تابستان پرآب‌ترین فصل است. دربارهٔ ورودیه اطلاعات تأییدشده‌ای نیست؛ از آژانس بپرسید. آبشار ۶۷
    متری اونیوره در همان نزدیکی را با این یکی اشتباه نگیرید.
  route: >-
    از تفلیس جادهٔ S1 را به سمت غرب، به سوی کوتائیسی و سامتردیا، بگیرید، به سمت آباشا ادامه دهید و به
    سوی شمال به مارتویلی بپیچید. از مارتویلی ۹٫۴ کیلومتر، حدود بیست دقیقه، به سمت شمال‌شرق تا بالدای اول
    راه است، جایی که مسیر نشانه‌گذاری‌شده آغاز می‌شود. روی هم حدود ۲۹۰ کیلومتر و پنج ساعت. تا مارتویلی
    آسفالت است؛ جادهٔ روستایی پس از آن جابه‌جا باریک و ناهموار است، پس خودروی شاسی‌بلند انتخاب مطمئنی
    است، به‌ویژه پس از باران. خودرو را در بالدای اول بگذارید و ۵٫۶ کیلومتر پایانی را پیاده بروید. در سامتردیا
    یا مارتویلی سوخت بگیرید؛ پس از آن جایگاهی نیست.
he:
  name: מפל טובה ומערת ארסן אוקרוג'נשווילי
  short: >-
    טובה, המפל המדורג הגבוה בגאורגיה (234 מטרים), נשפך ממערה בת שלוש קומות; שביל מסומן באורך 5.6 ק"מ מוביל
    אליו מבאלדה הראשונה.
  body: >-
    **לפני שהם צונחים 234 מטרים במפל המדורג הגבוה ביותר בגאורגיה, המים האלה כבר עברו דרך ארבעה אגמים שאור
    היום אינו מגיע אליהם לעולם.**


    המפל והמערה המזינה אותו הם אתר טבע מוגן אחד, שהוכרז ב-2013, בעמק טובה מצפון-מזרח לבאלדה השנייה, במוניציפליטת
    מרטווילי, בגובה של כ-707 מטרים מעל פני הים. הסוכנות לשטחים מוגנים מציינת את גובה המפל כ-234 מטרים,
    הגבוה ביותר בגאורגיה. אין כאן צניחה אחת אלא גרם מדרגות ארוך של מים, והוא מתחיל במקום שבו נהר יוצא
    ממערת ארסן אוקרוג'נשווילי, הידועה גם בשם טובה 2.


    המערה חצובה באבן גיר שכבתית מהקרטיקון העליון. פתחה, בגובה 15 מטרים וברוחב 20, נפער בדופן המצוק; בפנים
    מתפצלים 1,300 מטרים של מעברים על פני שלוש קומות, דרך אולמות בעלי שמות כמו אולם נונה, אולם ננה, הסלון,
    "אוניברסיטה 50" וטביאני, לצד תצורות נטיפים וזקיפים מכל צורה — זקיף אחד מתנשא לגובה שבעה מטרים. המעבר
    במערה מחייב סירה מתנפחת, והסוכנות ממליצה שלא לטפס אפילו אל הפתח בלי ציוד מיוחד.


    אל תתבלבלו בשמות. במרחק של פחות מקילומטר נמצאים מפל אוניורה ומערת טובה הראשונה, אתר מוגן נפרד שגובה
    המפל שלו 67 מטרים. טובה הוא הגבוה.


    לרוב המבקרים המפל הוא היעד: 5.6 קילומטרים בשביל מסומן מבאלדה הראשונה, כשעה ועשר דקות לכל כיוון לפי
    חישוב הסוכנות.


    המערה שייכת לחוקרי המערות; המפל — לכל מי שמוכן ללכת.
  tip: >-
    הקדישו חצי יום: השביל המסומן מבאלדה הראשונה אורכו 5.6 ק"מ לכל כיוון. צאו במזג אוויר יבש, כי החימר
    ביער נעשה חלקלק אחרי גשם; נעליים עם אחיזה טובה ומקלות הליכה יעזרו. המערה מיועדת רק לחוקרי מערות מצוידים
    בליווי מדריך, אז אל תצאו לבדכם אל הפתח. בדרך אין מים, שירותים או בית קפה, והקליטה חלשה: הביאו ציוד
    ממרטווילי ומפה לא מקוונת. באביב ובתחילת הקיץ הזרימה במיטבה. לא אומת אם נגבים דמי כניסה; בדקו עם הסוכנות.
    אל תתבלבלו בין מפל אוניורה הסמוך, בגובה 67 מטרים, לבין המפל הזה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 לכיוון קוטאיסי וסמטרדיה, המשיכו לכיוון אבשה ופנו צפונה למרטווילי. ממרטווילי
    9.4 ק"מ, כעשרים דקות, צפון-מזרחה עד באלדה הראשונה, שם מתחיל השביל המסומן. בסך הכול כ-290 ק"מ וחמש
    שעות. עד מרטווילי הדרך סלולה; דרך הכפר שאחריה צרה ומשובשת במקומות, ולכן רכב פנאי-שטח הוא הבחירה הבטוחה,
    במיוחד אחרי גשם. השאירו את הרכב בבאלדה הראשונה ולכו ברגל את 5.6 הק"מ האחרונים. תדלקו בסמטרדיה או במרטווילי;
    בהמשך אין תחנות דלק.
ar:
  name: شلال توبا وكهف أرسين أوكروجاناشفيلي
  short: >-
    ينساب شلال توبا، أعلى شلال متدرّج في جورجيا بارتفاع 234 مترًا، من كهف ذي ثلاثة مستويات؛ ويقود إليه
    درب مُعلَّم طوله 5.6 كم من بالدا الأولى.
  body: >-
    **قبل أن يهوي هذا الماء 234 مترًا في أعلى شلال متدرّج في جورجيا، يكون قد عبر أربع بحيرات لا يبلغها
    ضوء النهار أبدًا.**


    يشكّل الشلال والكهف الذي يغذّيه معلمًا طبيعيًا واحدًا أُعلن عام 2013، في وادي توبا شمال شرق بالدا
    الثانية، ضمن بلدية مارتفيلي، على ارتفاع نحو 707 أمتار فوق سطح البحر. وتحدد وكالة المناطق المحمية ارتفاع
    الشلال بـ234 مترًا، وهو الأعلى في جورجيا. ليس الشلال سقطة واحدة، بل درجًا طويلًا من الماء يبدأ حيث
    يخرج نهر من كهف أرسين أوكروجاناشفيلي، المعروف أيضًا باسم توبا 2.


    الكهف محفور في حجر جيري طبقي من العصر الطباشيري الأعلى. وتنفتح فوهته، بارتفاع 15 مترًا وعرض 20 مترًا،
    في واجهة الجرف؛ وفي الداخل تتشعب ممرات طولها 1300 متر على ثلاثة مستويات، عبر قاعات تحمل أسماء مثل
    قاعة نونا وقاعة نانا والصالون و«الجامعة 50» وتبياني، مرورًا بتكوينات كلسية من كل الأشكال، ومنها صاعدة
    يبلغ ارتفاعها سبعة أمتار. والتنقل داخله يتطلب قاربًا مطاطيًا، وتنصح الوكالة بعدم الصعود حتى إلى المدخل
    من دون معدات خاصة.


    لا تخلط بين الأسماء. فعلى بعد أقل من كيلومتر يقع شلال أونيوري مع كهف توبا الأول، وهو معلم منفصل يبلغ
    ارتفاع شلاله 67 مترًا. توبا هو الأعلى بينهما.


    أما معظم الزوار فوجهتهم الشلال: 5.6 كيلومتر على درب مُعلَّم من بالدا الأولى، نحو ساعة وعشر دقائق في
    كل اتجاه بحساب الوكالة.


    الكهف لعلماء الكهوف؛ أما الشلال فلكل من هو مستعد للمشي.
  tip: >-
    خصّص نصف يوم: الدرب المعلَّم من بالدا الأولى طوله 5.6 كم في كل اتجاه. اذهب في طقس جاف، فطين الغابة
    يصبح زلقًا بعد المطر؛ ويفيدك حذاء ذو قبضة جيدة وعصيّ المشي. الكهف مخصص لمستكشفي الكهوف المجهّزين برفقة
    مرشد فقط، فلا تتوجه إلى مدخله بمفردك. لا ماء ولا دورة مياه ولا مقهى على الطريق، والتغطية ضعيفة: أحضر
    مؤونتك من مارتفيلي وخريطة للاستخدام دون اتصال. يبلغ التدفق ذروته في الربيع وأوائل الصيف. لم نتحقق
    من وجود رسوم؛ راجع الوكالة. ولا تحسب شلال أونيوري القريب، بارتفاعه البالغ 67 مترًا، هو هذا الشلال.
  route: >-
    من تبليسي اسلك الطريق S1 غربًا باتجاه كوتايسي وسامتريديا، وتابع نحو أباشا ثم انعطف شمالًا إلى مارتفيلي.
    من مارتفيلي 9.4 كم، نحو عشرين دقيقة، شمالًا شرقيًا حتى بالدا الأولى حيث يبدأ الدرب المعلَّم. المجموع
    نحو 290 كم وخمس ساعات. الطريق معبّد حتى مارتفيلي؛ أما طريق القرية بعدها فضيق ووعر في بعض المواضع،
    لذا فالسيارة الرياضية متعددة الاستخدامات هي الخيار الآمن، خصوصًا بعد المطر. اترك السيارة في بالدا
    الأولى وامشِ آخر 5.6 كم. تزوّد بالوقود في سامتريديا أو مارتفيلي؛ فلا محطات وقود بعدهما.
