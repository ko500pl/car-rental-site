ka:
  name: ცაგერი და ლეჩხუმი
  short: >-
    ლეჩხუმის მშვიდი ცენტრი ცხენისწყალზე: საეპისკოპოსო ქალაქი, წმინდანის საფლავი მურის ციხის ძირში და უსახელოური
    — ღვინო, რომელსაც სახელი არ აქვს.
  body: >-
    **ცაგერში ათასიოდე კაცი ცხოვრობს, მაგრამ ცხენისწყლის ეს მოსახვევი ანტიკური ხანიდან მოყოლებული ლეჩხუმის
    გულია.** ქალაქი მდინარის მარჯვენა ნაპირზე, ზღვის დონიდან 475 მეტრზე დგას; აქ ძვ. წ. X–IX საუკუნეების
    ბრინჯაოს ნივთების განძიც აღმოაჩინეს. ცაგერში ლეჩხუმის მმართველები ცხოვრობდნენ, რუსეთის იმპერიის დროს
    ის მაზრის ცენტრი იყო, ქალაქის სტატუსი კი მხოლოდ 1968 წელს მიიღო. დღესაც აქაა ცაგერისა და ლენტეხის
    ეპარქიის კათედრა.


    ძველი საკათედრო ტაძარი კარგად გვასწავლის, რისი წართმევა შეუძლია აღდგენას. XVIII საუკუნეში ვახუშტი
    ბატონიშვილი მას დიდებულად ნაშენ ტაძრად მოიხსენიებდა; XIX საუკუნის ბოლოს კი რესტავრატორებმა თავდაპირველი
    სამნავიანი ბაზილიკის სახე შეცვალეს და კედლის მხატვრობაც დაიკარგა — მათ შორის თამარ მეფისა და მისი
    ძის, გიორგი IV ლაშას, პორტრეტები.


    ქალაქის პირას მურის ციხე აღმართულა. გვიანანტიკური ხანიდან 1867 წლამდე ის ხეობის პოლიტიკური ცენტრი
    იყო და მოპირდაპირე, კლდოვან ნაპირზე მდგარ რაგვის კოშკთან ერთად ხეობიდან ბარისკენ მიმავალ გზას კეტავდა.
    ციხის დასავლეთი კოშკის ძირში მონასტერია, სადაც, გადმოცემით, წმინდა მაქსიმე აღმსარებლის — 662 წელს
    გადასახლებაში გარდაცვლილი ბიზანტიელი ღვთისმეტყველის — საფლავია. ეს გადმოცემა XII საუკუნის ხელნაწერის
    არშიაზე გაკეთებულ მინაწერს ეყრდნობა.


    ლეჩხუმის მეორე საგანძურს ჭიქაში ასხამენ. უსახელოური — სახელი „უსახელოს“ ნიშნავს, ანუ იმას, რასაც სიტყვით
    ვერ გამოთქვამ — მხოლოდ რამდენიმე ფერდობზე, ოხურეშისა და ზუბის მიდამოებში მოჰყავთ და კარგ წელიწადსაც
    სულ რამდენიმე ტონა ყურძენს იძლევა. ქალაქის სამხრეთ-აღმოსავლეთით კი ლაჯანურის წყალსაცავი ვიწრო ხეობას
    ავსებს: მაღალი თაღოვანი კაშხლით შეკავებული წყალი 3,2 კილომეტრზეა გაწოლილი და 70 მეტრ სიღრმეს აღწევს.


    ცაგერიდან წაიღებთ ღვინოს, რომელსაც „უსახელო“ ჰქვია, და წმინდანის სახელს, რომელიც აქამდე შეიძლება არც
    გსმენიათ — პატარა ქალაქისთვის სამართლიანი გაცვლაა.
  tip: >-
    უსახელოურის დეგუსტაცია წინასწარ შეათანხმეთ: მარნები პატარა, ოჯახურია და ცუდ წელიწადს დასასხმელი შეიძლება
    არც ჰქონდეთ. პირველ ჭიქამდე გადაწყვიტეთ, ვინ დაჯდება საჭესთან — საქართველოში ნასვამ მძღოლს მკაცრად
    სჯიან. ნაღდი ფული თან იქონიეთ: ცენტრში ბანკომატია, მაგრამ ბარათს ყველგან არ იღებენ. მურის ციხემდე
    ცენტრიდან ფეხითაც მიხვალთ, ოღონდ ფერდი ციცაბოა; მის ძირში მოქმედი მონასტერია, ამიტომ მხრები და მუხლები
    დაიფარეთ. მხარეთმცოდნეობის მუზეუმში ლეჩხუმისა და ქვემო სვანეთის ათასობით არქეოლოგიური ნივთი ინახება
    — სამუშაო საათები ადგილზე დააზუსტეთ. ზაფხული თბილია: აგვისტოს საშუალო ტემპერატურა 22 გრადუსია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისამდე იარეთ. იქიდან შ16-ით ჩრდილოეთით, რიონის
    ხეობით ალპანამდე, ალპანაში კი შ18-ზე გადაუხვიეთ, რომელიც ლაჯანურის წყალსაცავის გავლით ქედს გადადის
    და ცაგერში ეშვება: სულ დაახლოებით 325 კმ და ხუთი საათი, აქედან ქუთაისის შემდეგ — 80-მდე კილომეტრი.
    ასფალტი უმეტესწილად ვარგისია, მაგრამ ადგილ-ადგილ დაზიანებულია, სოფლებისა და მარნებისკენ შესახვევები
    კი ხშირად ხრეშიანია — ამიტომაც ჯიპი ან კროსოვერი ჯობია. საწვავი ქუთაისში ჩაასხით, სადაც არჩევანი ბევრად
    მეტია; ცაგერშიც არის ბენზინგასამართი, მაგრამ არჩევანი მწირია. ზამთარში გზა ღიაა, თუმცა შეიძლება მოყინული
    იყოს. ლენტეხისა და სვანეთისკენ გზა შ15-ით გრძელდება და ცალკე დაგეგმვას მოითხოვს.
en:
  name: Tsageri and Lechkhumi
  short: >-
    Lechkhumi's quiet capital on the Tskhenistskali: a bishop's town, a saint's grave beneath Muri fortress,
    and Usakhelouri, the wine called 'nameless'.
  body: >-
    **Barely a thousand people live in Tsageri, yet this bend of the Tskhenistskali has been the heart
    of Lechkhumi since antiquity.** The town stands at 475 metres on the right bank, where a hoard of
    bronze objects from the 10th–9th centuries BC was found. Lechkhumi's rulers lived here and the Russian
    Empire made it a district centre, yet it became a town only in 1968. The bishops of Tsageri and Lentekhi
    still sit here.


    The old cathedral is a lesson in what restoration can take away. In the 18th century Prince Vakhushti
    called it superbly built; in the late 19th century restorers reshaped its original three-nave plan,
    and its wall paintings were lost — among them portraits of Queen Tamar and her son, George IV.


    Muri fortress rises at the edge of town. From late antiquity until 1867 it was the political heart
    of the valley, and, with the Ragvi tower on the rocky bank opposite, it closed the road from the gorge
    to the lowlands. At the foot of its western tower stands a monastery that, by tradition, keeps the
    grave of Maximus the Confessor, the Byzantine theologian who died in exile in 662. The tradition rests
    on a margin note in a 12th-century manuscript.


    Lechkhumi's other treasure is poured, not visited. Usakhelouri — the name means 'nameless', in the
    sense of beyond words — grows on a few slopes around Okhureshi and Zubi, and even a good year yields
    only a few tonnes of grapes. South-east of town, the Lajanuri reservoir, 3.2 km long and up to 70
    metres deep, fills a narrow valley behind a high arch dam.


    You leave with a bottle of wine called 'nameless' and the grave of a saint you may never have heard
    of — a fair exchange for one small town.
  tip: >-
    Arrange Usakhelouri tastings in advance: the cellars are small family affairs, and in a lean year
    there may be nothing to pour. Settle who drives before the first glass — Georgia punishes drink-driving
    severely. Carry cash; there is an ATM in the centre, but cards are not accepted everywhere. Muri fortress
    is within walking distance of the centre, though the ground is steep; the monastery below it is active,
    so cover shoulders and knees. The local museum holds thousands of archaeological finds from Lechkhumi
    and Lower Svaneti — check opening hours on the spot. Summers are warm: August averages 22 °C.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi. There pick up the Sh16 north up the Rioni gorge to
    Alpana and turn onto the Sh18, which crosses the ridge past the Lajanuri reservoir and drops to Tsageri:
    about 325 km and five hours, some 80 km of it after Kutaisi. The asphalt holds for most of the way
    but is broken in places, and the lanes to villages and cellars are often gravel — which is why an
    SUV is the recommended class. Fill up in Kutaisi, where the choice is far better; Tsageri has fuel,
    but little of it. In winter the road stays open but can ice. Onward to Lentekhi and Svaneti, the Sh15
    needs its own plan.
ru:
  name: Цагери и Лечхуми
  short: >-
    Тихая столица Лечхуми на Цхенисцкали: епископский город, могила святого под крепостью Мури и Усахелоури
    — вино по имени «безымянное».
  body: >-
    **В Цагери живёт едва тысяча человек, и всё же эта излучина Цхенисцкали с древности остаётся сердцем
    Лечхуми.** Город стоит на высоте 475 метров на правом берегу; здесь нашли клад бронзовых предметов
    X–IX веков до н. э. Здесь жили правители Лечхуми, Российская империя сделала его уездным центром,
    но городом он стал лишь в 1968 году. И сегодня здесь находится кафедра епископов Цагерских и Лентехских.


    Старый собор — наглядный урок того, что способна отнять реставрация. В XVIII веке царевич Вахушти
    называл его превосходно построенным; в конце XIX века реставраторы переделали его изначальный трёхнефный
    план, а росписи были утрачены — в том числе портреты царицы Тамар и её сына, Георгия IV.


    На краю города высится крепость Мури. С поздней античности до 1867 года она была политическим центром
    долины и вместе с башней Рагви на скалистом противоположном берегу запирала дорогу из ущелья в низины.
    У подножия её западной башни стоит монастырь, где, по преданию, находится могила Максима Исповедника
    — византийского богослова, умершего в ссылке в 662 году. Предание опирается на заметку на полях рукописи
    XII века.


    Другое сокровище Лечхуми не осматривают, а наливают. Усахелоури — название значит «безымянное», в
    смысле «невыразимое словами» — растёт на нескольких склонах вокруг Охуреши и Зуби, и даже удачный
    год даёт лишь несколько тонн винограда. К юго-востоку от города Ладжанурское водохранилище длиной
    3,2 км и глубиной до 70 метров заполняет узкую долину за высокой арочной плотиной.


    Вы уезжаете с бутылкой вина по имени «безымянное» и с могилой святого, о котором, возможно, никогда
    не слышали, — честный обмен за один маленький город.
  tip: >-
    О дегустации Усахелоури договаривайтесь заранее: погреба здесь маленькие, семейные, и в скудный год
    наливать может быть нечего. Решите, кто за рулём, до первого бокала — в Грузии за вождение в нетрезвом
    виде наказывают строго. Возьмите наличные: банкомат в центре есть, но карты принимают не везде. До
    крепости Мури можно дойти пешком от центра, хотя подъём крутой; монастырь под ней действующий, так
    что плечи и колени должны быть закрыты. В местном музее хранятся тысячи археологических находок из
    Лечхуми и Нижней Сванетии — часы работы уточняйте на месте. Лето тёплое: средняя температура августа
    — 22 °C.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси. Там выезжайте на Sh16, поднимайтесь на север по ущелью
    Риони до Алпаны и сворачивайте на Sh18, которая переваливает через хребет мимо Ладжанурского водохранилища
    и спускается к Цагери: всего около 325 км и пять часов, из них около 80 км после Кутаиси. Асфальт
    держится почти всю дорогу, хотя местами разбит, а подъезды к сёлам и погребам часто гравийные — поэтому
    рекомендуем кроссовер или внедорожник. Заправьтесь в Кутаиси, где выбор гораздо лучше; в Цагери топливо
    есть, но немного. Зимой дорога открыта, но может обледенеть. Дальше, в Лентехи и Сванетию, по Sh15
    — это уже отдельный план.
fa:
  name: تساگری و لچخومی
  short: >-
    پایتخت آرام لچخومی بر کرانهٔ تسخنیستسکالی: شهر اسقف‌نشین، گور یک قدیس پای دژ موری، و اوساخلوری، شرابی
    که «بی‌نام» خوانده می‌شود.
  body: >-
    **در تساگری به‌زحمت هزار نفر زندگی می‌کنند، اما این پیچ رود تسخنیستسکالی از روزگار باستان قلب لچخومی
    بوده است.** شهر در ارتفاع ۴۷۵ متری بر کرانهٔ راست رود ایستاده، و در همین‌جا گنجینه‌ای از اشیای مفرغی
    از سده‌های دهم و نهم پیش از میلاد پیدا شده است. فرمانروایان لچخومی اینجا می‌زیستند و امپراتوری روسیه
    آن را مرکز بخش کرد، اما تنها در ۱۹۶۸ عنوان شهر گرفت. اسقف‌های تساگری و لنتخی هنوز در اینجا مستقرند.


    کلیسای جامع قدیمی درسی است دربارهٔ آنچه مرمت می‌تواند از بنا بگیرد. در سدهٔ هجدهم، شاهزاده واخوشتی
    آن را بنایی عالی خوانده بود؛ در اواخر سدهٔ نوزدهم مرمتگران نقشهٔ سه‌شبستانی اصلی‌اش را دگرگون کردند
    و دیوارنگاره‌هایش از میان رفت — از جمله چهره‌های ملکه تامار و پسرش گیورگی چهارم.


    دژ موری در کنارهٔ شهر سر برافراشته است. از اواخر دوران باستان تا ۱۸۶۷ کانون سیاسی دره بود و همراه
    با برج راگوی بر کرانهٔ صخره‌ای روبه‌رو، راه تنگه به دشت‌ها را می‌بست. پای برج غربی آن صومعه‌ای است
    که بنا بر روایت، گور ماکسیموس معترف را در خود دارد، الهی‌دان بیزانسی که در ۶۶۲ در تبعید درگذشت. این
    روایت بر یادداشتی در حاشیهٔ دست‌نوشته‌ای از سدهٔ دوازدهم تکیه دارد.


    گنج دیگر لچخومی را نه تماشا، که در جام می‌ریزند. اوساخلوری — نامی به معنای «بی‌نام»، یعنی آنچه در
    وصف نمی‌گنجد — تنها بر چند دامنه در پیرامون اوخورشی و زوبی می‌روید، و حتی سالی خوب تنها چند تن انگور
    به بار می‌آورد. در جنوب‌شرقی شهر، مخزن لاجانوری، به طول ۳٫۲ کیلومتر و ژرفای تا ۷۰ متر، دره‌ای تنگ
    را پشت سدی قوسی و بلند پر کرده است.


    با بطری شرابی به نام «بی‌نام» و گور قدیسی که شاید هرگز نامش را نشنیده بودید از اینجا می‌روید — داد
    و ستدی منصفانه برای یک شهر کوچک.
  tip: >-
    چشیدن اوساخلوری را از پیش هماهنگ کنید: سرداب‌ها کوچک و خانوادگی‌اند و در سالی کم‌بار شاید چیزی برای
    ریختن نباشد. پیش از نخستین جام روشن کنید چه کسی رانندگی می‌کند — گرجستان رانندگی در حال مستی را سخت
    مجازات می‌کند. پول نقد همراه داشته باشید؛ در مرکز شهر خودپرداز هست، اما همه‌جا کارت نمی‌پذیرند. دژ
    موری از مرکز پیاده در دسترس است، هرچند زمینش پرشیب است؛ صومعهٔ پای آن فعال است، پس شانه‌ها و زانوها
    را بپوشانید. موزهٔ محلی هزاران یافتهٔ باستان‌شناختی از لچخومی و سوانتی سفلی را نگه می‌دارد — ساعت
    کارش را همان‌جا جویا شوید. تابستان‌ها گرم است: میانگین دمای اوت ۲۲ درجه است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا کوتائیسی بروید. آنجا Sh16 را بگیرید و در تنگهٔ ریونی به سمت
    شمال تا آلپانا بالا بروید، سپس به Sh18 بپیچید که از کنار مخزن لاجانوری از روی یال کوه می‌گذرد و به
    تساگری سرازیر می‌شود: حدود ۳۲۵ کیلومتر و پنج ساعت، که حدود ۸۰ کیلومترش پس از کوتائیسی است. آسفالت
    بیشتر راه سالم است اما جابه‌جا شکسته، و راه‌های فرعی به روستاها و سرداب‌ها اغلب شنی‌اند — از همین
    رو خودروی شاسی‌بلند توصیه می‌شود. در کوتائیسی باک را پر کنید، که گزینه‌ها بسیار بیشترند؛ تساگری سوخت
    دارد، اما اندک. در زمستان جاده باز می‌ماند اما ممکن است یخ بزند. ادامهٔ راه به لنتخی و سوانتی از طریق
    Sh15 برنامه‌ای جداگانه می‌خواهد.
he:
  name: צאגרי ולצ׳חומי
  short: >-
    בירתה השקטה של לצ׳חומי על נהר הצחניסצקאלי: עיר של בישוף, קבר של קדוש למרגלות מבצר מורי, ואוסחלאורי
    — היין שנקרא "חסר שם".
  body: >-
    **בצאגרי חיים בקושי אלף איש, ובכל זאת העיקול הזה של הצחניסצקאלי הוא לבה של לצ׳חומי מאז העת העתיקה.**
    העיר עומדת בגובה 475 מטר על הגדה הימנית, ובה נמצא מטמון של חפצי ברונזה מן המאות ה-10 וה-9 לפני הספירה.
    שליטי לצ׳חומי ישבו כאן, והאימפריה הרוסית הפכה אותה למרכז מחוז, אבל מעמד של עיר קיבלה רק ב-1968. הבישופים
    של צאגרי ולנטחי יושבים כאן עד היום.


    הקתדרלה הישנה היא שיעור במה ששיקום יכול לקחת. במאה ה-18 תיאר אותה הנסיך וחושטי כבנויה להפליא; בסוף
    המאה ה-19 שינו המשקמים את תוכניתה המקורית, בזיליקה תלת-ספינתית, וציורי הקיר שלה אבדו — ביניהם דיוקנאות
    של המלכה תמר ובנה, גיורגי הרביעי.


    מבצר מורי מתנשא בקצה העיר. מסוף העת העתיקה ועד 1867 היה המרכז הפוליטי של העמק, ויחד עם מגדל רגווי
    שעל הגדה הסלעית שממול חסם את הדרך מן הערוץ אל השפלה. למרגלות המגדל המערבי שלו עומד מנזר שלפי המסורת
    נמצא בו קברו של מקסימוס המוודה, התאולוג הביזנטי שמת בגלות ב-662. המסורת נשענת על הערת שוליים בכתב
    יד מן המאה ה-12.


    את האוצר השני של לצ׳חומי לא מבקרים — מוזגים אותו. אוסחלאורי — פירוש השם "חסר שם", במובן של מה שאין
    מילים לתארו — גדל על מדרונות ספורים סביב אוחורשי וזובי, ואפילו שנה טובה מניבה רק טונות ספורים של ענבים.
    מדרום-מזרח לעיר, מאגר לג׳אנורי, באורך 3.2 ק״מ ובעומק של עד 70 מטר, ממלא עמק צר מאחורי סכר קשת גבוה.


    אתם עוזבים עם בקבוק יין שנקרא "חסר שם" ועם קברו של קדוש שאולי מעולם לא שמעתם עליו — עסקה הוגנת תמורת
    עיר קטנה אחת.
  tip: >-
    תאמו טעימות אוסחלאורי מראש: המרתפים הם עסקים משפחתיים קטנים, ובשנה דלה ייתכן שלא יהיה מה למזוג. החליטו
    מי נוהג לפני הכוס הראשונה — בגאורגיה מענישים בחומרה על נהיגה בשכרות. הצטיידו במזומן: יש כספומט במרכז,
    אבל לא בכל מקום מקבלים כרטיסי אשראי. אל מבצר מורי אפשר ללכת ברגל מן המרכז, אם כי השטח תלול; המנזר
    שלמרגלותיו פעיל, אז כסו כתפיים וברכיים. במוזיאון המקומי שמורים אלפי ממצאים ארכאולוגיים מלצ׳חומי ומסוואנטי
    התחתונה — את שעות הפתיחה בדקו במקום. הקיץ חמים: הממוצע באוגוסט הוא 22 מעלות.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד קוטאיסי. שם עלו על כביש Sh16 צפונה במעלה ערוץ הריוני עד אלפנה,
    ופנו לכביש Sh18, החוצה את הרכס על פני מאגר לג׳אנורי ויורד אל צאגרי: כ-325 ק״מ וחמש שעות, מהם כ-80
    ק״מ אחרי קוטאיסי. האספלט מחזיק ברוב הדרך אבל משובש במקומות, והדרכים לכפרים ולמרתפים הן לרוב דרכי חצץ
    — ולכן מומלץ רכב פנאי-שטח. תדלקו בקוטאיסי, שם הבחירה רחבה בהרבה; בצאגרי יש דלק, אבל מעט. בחורף הכביש
    נשאר פתוח אך עלול להתכסות בקרח. ההמשך אל לנטחי וסוואנטי בכביש Sh15 דורש תכנון נפרד.
ar:
  name: تساغيري وليتشخومي
  short: >-
    عاصمة ليتشخومي الهادئة على نهر تسخينيستسكالي: مدينة أسقفية، وقبر قديس تحت قلعة موري، وأوساخيلوري،
    النبيذ الذي يُدعى «بلا اسم».
  body: >-
    **لا يسكن تساغيري سوى نحو ألف نسمة، ومع ذلك ظل هذا المنعطف من نهر تسخينيستسكالي قلبَ ليتشخومي منذ
    العصور القديمة.** تقوم المدينة على ارتفاع 475 متراً على الضفة اليمنى، وفيها عُثر على كنز من القطع
    البرونزية يعود إلى القرنين العاشر والتاسع قبل الميلاد. هنا عاش حكّام ليتشخومي، وجعلتها الإمبراطورية
    الروسية مركز قضاء، لكنها لم تصبح مدينة إلا عام 1968. ولا يزال أساقفة تساغيري ولينتيخي يتخذونها مقراً.


    الكاتدرائية القديمة درسٌ فيما يمكن أن ينتزعه الترميم. ففي القرن الثامن عشر وصفها الأمير فاخوشتي بأنها
    بديعة البناء؛ وفي أواخر القرن التاسع عشر غيّر المرمّمون مخططها البازيليكي الأصلي ذا الأروقة الثلاثة،
    وضاعت رسومها الجدارية — ومنها صورتا الملكة تامار وابنها غيورغي الرابع.


    وعلى طرف المدينة ترتفع قلعة موري. كانت من أواخر العصر القديم حتى 1867 المركز السياسي للوادي، وكانت
    مع برج راغفي على الضفة الصخرية المقابلة تسدّ الطريق من المضيق إلى السهول. وعند سفح برجها الغربي يقوم
    دير يُقال في التقليد إنه يضم قبر مكسيموس المعترف، اللاهوتي البيزنطي الذي مات منفياً عام 662. ويستند
    هذا التقليد إلى حاشية في مخطوط من القرن الثاني عشر.


    أما كنز ليتشخومي الآخر فيُصبّ ولا يُزار. أوساخيلوري — ومعنى الاسم «بلا اسم»، أي ما يعجز عنه الوصف
    — ينمو على بضعة منحدرات حول أوخوريشي وزوبي، وحتى السنة الجيدة لا تعطي إلا بضعة أطنان من العنب. وإلى
    الجنوب الشرقي من المدينة يملأ خزان لاجانوري، بطول 3.2 كم وعمق يصل إلى 70 متراً، وادياً ضيقاً خلف سدّ
    قوسي عالٍ.


    تغادر ومعك زجاجة نبيذ يُدعى «بلا اسم» وقبر قديس ربما لم تسمع به من قبل — مقايضة عادلة مقابل بلدة صغيرة
    واحدة.
  tip: >-
    رتّب تذوّق أوساخيلوري مسبقاً: فالأقبية صغيرة عائلية، وفي سنة شحيحة قد لا يكون هناك ما يُصبّ. واتفق
    مع رفاقك على من سيقود قبل الكأس الأولى — فجورجيا تعاقب القيادة تحت تأثير الكحول بصرامة. احمل نقداً؛
    ففي الوسط صراف آلي، لكن البطاقات لا تُقبل في كل مكان. قلعة موري على مسافة مشي من الوسط وإن كانت الأرض
    شديدة الانحدار؛ والدير تحتها عامل تُقام فيه الصلوات، فغطِّ الكتفين والركبتين. يضم المتحف المحلي آلاف
    اللقى الأثرية من ليتشخومي وسفانيتي السفلى — تحقّق من مواعيده في المكان. والصيف دافئ: متوسط أغسطس 22
    درجة.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً إلى كوتايسي. وهناك اسلك Sh16 شمالاً صعوداً في مضيق ريوني حتى ألبانا،
    ثم انعطف إلى Sh18 الذي يعبر الحافة الجبلية مروراً بخزان لاجانوري وينحدر إلى تساغيري: نحو 325 كم وخمس
    ساعات، منها قرابة 80 كم بعد كوتايسي. يصمد الإسفلت معظم الطريق لكنه متكسّر في مواضع، والطرق الفرعية
    إلى القرى والأقبية كثيراً ما تكون من الحصى — ولهذا يُنصح بسيارة رياضية متعددة الاستخدامات. املأ الخزان
    في كوتايسي حيث الخيارات أوفر بكثير؛ ففي تساغيري وقود لكنه قليل. وفي الشتاء يبقى الطريق مفتوحاً لكن
    قد يكسوه الجليد. أما مواصلة الرحلة إلى لينتيخي وسفانيتي عبر Sh15 فتحتاج إلى خطة خاصة بها.
