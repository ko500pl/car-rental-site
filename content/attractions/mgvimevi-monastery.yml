ka:
  name: მღვიმევის მონასტერი
  short: >-
    XIII საუკუნის მონასტერი ჭიათურის აღმოსავლეთ კიდეზე, კლდის ქვეშ, ვიწრო საკიდარი ბილიკის ბოლოს.
  body: >-
    **მღვიმევი კლდის ქვეშაა შეფარებული და შორიდან ვერც შეამჩნევ.** მონასტერი ჭიათურის აღმოსავლეთ ბოლოს,
    ყვირილას ხეობის ზემოთ დგას; ბოლო მონაკვეთი ვიწრო, კლდეში ჩაჭრილი ბილიკია, რომელიც კლდის ქიმს მიუყვება
    და პირდაპირ ეზოში გამოგიყვანს.


    სახელი „მღვიმევი“ მღვიმეს უკავშირდება: მთავარი ეკლესია კლდის ბუნებრივ ღრმულში ჩაშენდა და მისი ჩრდილოეთი
    კედლის ნაწილს თვით კლდე ქმნის. კომპლექსი XIII საუკუნის მეორე ნახევრით თარიღდება; ეს ორნავიანი ბაზილიკაა,
    გვერდით კი წმინდა ეკატერინეს პატარა დარბაზული ეკლესია დგას. სამრეკლო და საცხოვრებელი კორპუსები XIX
    საუკუნისაა, დედათა მონასტერი კი 2014 წელს აღდგა.


    ინტერიერში ფრესკის ფრაგმენტები შემორჩა. ჩრდილოეთ კედელზე მაშენებელთა პორტრეტებია — რაჭის ერისთავი
    რატი, მისი მეუღლე რუსუდანი და ძმა ნიანია. სამხრეთ კედელი XVI საუკუნეში ხელახლა მოიხატა, ამიტომ ორი
    სხვადასხვა ეპოქის ხელი ერთმანეთის გვერდითაა. წმინდა ეკატერინეს ეკლესიის გარე სამხრეთ კედელზეც შემორჩა
    მხატვრობა, უკვე გამოფიტული, მაგრამ ჯერ კიდევ იკითხება.


    ადგილის ეფექტი არქიტექტურაზე მეტად სწორედ მდებარეობაშია: კლდის ჭერი ეკლესიის სახურავზე ორიოდე მეტრით
    მაღლაა, წვიმის წყალი კედელზე ჩამოდის და ეზოდან ხეობა და მაღაროს ნაყარი ერთდროულად ჩანს. ჭიათურის ინდუსტრიულ
    ხმაურს აქ, ას მეტრზე მაღლა, თითქმის ვეღარ გაიგონებ.


    სწორედ ეს დაპირისპირება ქმნის ადგილის ხასიათს: ეზოდან საბაგიროს ბოძები და საბჭოთა სამთო ქალაქის
    სახურავები ჩანს, ზურგს უკან კი XIII საუკუნის ეკლესიაა კლდეში ჩაშენებული. დილის შუქი ფასადამდე აღწევს,
    შუადღის შემდეგ კი კლდის ქიმი მთელ ტერასას ჩრდილში ტოვებს — ფრესკებისთვის ეს კარგია, ფოტოსთვის კი
    ნაკლებად.
  tip: >-
    ერთი საათი სავსებით საკმარისია. ბილიკი ბოლო ას მეტრზე ვიწროა და კლდის კიდეზე გადის — მოაჯირი ნაწილობრივ
    არის, სველ ამინდში კი ქვა სრიალა ხდება; მაღალქუსლიანი ან გლუვძირიანი ფეხსაცმელი არ გამოდგება. მოქმედი
    დედათა მონასტერია: ჩაცმის წესი მკაცრია, ფოტოს გადაღება ეკლესიაში აკრძალულია. ტუალეტი ეზოშია, კაფე
    კი — ჭიათურის ცენტრში, სამი კილომეტრის მანძილზე. მცირეწლოვან ბავშვთან ერთად ბილიკზე ხელი მაგრად დაიჭირე.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ჩრდილოეთით ჭიათურისკენ — სულ დაახლოებით 218 კმ და სამი საათი
    და თხუთმეტი წუთი. ჭიათურაში ყვირილას გადაკვეთ და აღმოსავლეთით, მღვიმევის უბნისკენ გაუყვები; ბოლო კილომეტრი
    ვიწრო, ციცაბო, მაგრამ ასფალტიანი ქუჩაა. მანქანას ბილიკის დასაწყისში, პატარა მოედანთან დატოვებ — შემდეგ
    მხოლოდ ფეხითაა. საწვავი ზესტაფონსა და ჭიათურაში აიღე. ეკონომ-კლასი საკმარისია, თუმცა ზამთარში ბოლო
    აღმართზე ფრთხილად.
en:
  name: Mgvimevi Monastery
  short: >-
    A 13th-century monastery tucked under a cliff at the eastern edge of Chiatura, at the end of a narrow
    ledge path.
  body: >-
    **Mgvimevi hides under an overhanging rock and is easy to miss from a distance.** The monastery stands
    at the eastern end of Chiatura, high above the Kvirila gorge, and the last stretch of the approach
    is a narrow path cut into the cliff that follows the rim straight into the courtyard.


    The name comes from the Georgian word for cave: the main church was built into a natural hollow in
    the limestone, and part of its north wall is the rock itself. The complex dates from the second half
    of the 13th century. The main church is a two-nave basilica, with a small hall church of St Catherine
    beside it; the bell-tower and the monastic dwellings are 19th-century additions, and a community of
    nuns was re-established here in 2014.


    Fragments of fresco survive inside. On the north wall of the nave are portraits of the founders — Rati,
    eristavi of Racha, his wife Rusudan and his brother Niania — a rare medieval group portrait of a provincial
    ruling family. The south wall was repainted in the 16th century, so two very different hands sit side
    by side. The outer south wall of St Catherine's also keeps painting, weathered but still legible.


    The effect of the place owes more to its position than to its architecture. The rock ceiling hangs
    a couple of metres above the church roof, rainwater runs down the face in wet weather, and from the
    yard you look out over the gorge and the mine spoil at the same time. A hundred metres higher than
    the town, the industrial noise of Chiatura barely reaches you.


    The juxtaposition is much of the appeal. From the courtyard you can see ropeway pylons and the roofs of
    a Soviet mining town, and immediately behind you a 13th-century church built into a cliff. Morning light
    reaches the facade; from early afternoon the overhang throws the whole terrace into shade, which suits
    the frescoes and frustrates photographers.
  tip: >-
    An hour is plenty. The last hundred metres of path are narrow and run along the cliff edge; there is
    a railing in places, and the stone becomes slippery in the wet, so smooth soles are a bad idea. This
    is a working convent: dress rules are enforced and photography inside the church is not allowed. There
    is a toilet in the yard; the nearest cafe is in central Chiatura, three kilometres away. Hold small
    children firmly on the ledge section.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then head north to Chiatura — about 218 km in all, three
    hours fifteen. In Chiatura cross the Kvirila and follow the road east towards the Mgvimevi district;
    the final kilometre is a narrow, steep but paved street. Leave the car at the small turning area where
    the path begins — from there it is on foot only. Fuel is available in Zestaponi and Chiatura. An economy
    car is sufficient, though take the last climb carefully in winter.
ru:
  name: Монастырь Мгвимеви
  short: >-
    Монастырь XIII века под скальным навесом на восточной окраине Чиатуры, в конце узкой карнизной тропы.
  body: >-
    **Мгвимеви прячется под скальным козырьком, и издали его легко не заметить.** Монастырь стоит на восточном
    краю Чиатуры, высоко над ущельем Квирилы, а последний отрезок подхода — узкая тропа, вырубленная в
    скале, которая идёт по кромке прямо во двор.


    Название происходит от грузинского слова «пещера»: главный храм встроен в естественную нишу в известняке,
    и часть его северной стены образует сама скала. Комплекс относится ко второй половине XIII века. Главная
    церковь — двухнефная базилика, рядом стоит маленькая зальная церковь Святой Екатерины; колокольня
    и жилые корпуса появились в XIX веке, а женская обитель возобновлена в 2014 году.


    Внутри сохранились фрагменты фресок. На северной стене нефа — портреты ктиторов: рачинского эристава
    Рати, его жены Русудан и брата Ниании. Это редкий средневековый групповой портрет провинциальной правящей
    семьи. Южную стену переписали в XVI веке, так что две очень разные манеры оказались рядом. На наружной
    южной стене церкви Святой Екатерины тоже осталась живопись — выветренная, но ещё читаемая.


    Впечатление здесь создаёт не столько архитектура, сколько положение. Скальный потолок нависает в паре
    метров над кровлей храма, в дождь по нему стекает вода, а со двора одновременно видны ущелье и отвалы
    рудников. Отсюда, на сотню метров выше города, промышленный шум Чиатуры почти не доносится.


    Именно это соседство и создаёт характер места. Со двора видны опоры канатной дороги и крыши советского
    шахтёрского города, а прямо за спиной — храм XIII века, встроенный в скалу. Утренний свет доходит до
    фасада, а с начала второй половины дня скальный козырёк оставляет всю террасу в тени: фрескам это на
    пользу, фотографу нет.
  tip: >-
    Часа вполне достаточно. Последние сто метров тропы узкие и идут по краю обрыва; перила есть не везде,
    а камень в сырость становится скользким, так что гладкая подошва — плохая идея. Это действующий женский
    монастырь: правила одежды соблюдаются, съёмка внутри храма запрещена. Туалет во дворе, ближайшее кафе
    — в центре Чиатуры, в трёх километрах. Маленьких детей на карнизе держите крепко за руку.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем на север к Чиатуре — всего около 218 км, три часа пятнадцать
    минут. В Чиатуре переезжаете Квирилу и едете на восток в сторону района Мгвимеви; последний километр
    — узкая крутая, но асфальтированная улица. Машину оставляют на маленькой площадке в начале тропы, дальше
    только пешком. Заправки есть в Зестафони и Чиатуре. Машины эконом-класса достаточно, но зимой последний
    подъём проходите аккуратно.
fa:
  name: صومعهٔ مگویمِوی
  short: >-
    صومعه‌ای از سدهٔ سیزدهم زیر یک صخرهٔ آویخته در لبهٔ شرقی چیاتورا، در انتهای مسیری باریک بر لبهٔ پرتگاه.
  body: >-
    **مگویمِوی زیر پیش‌آمدگی یک صخره پنهان شده و از دور به‌سادگی از چشم می‌افتد.** صومعه در انتهای شرقی
    چیاتورا و بالای درهٔ کویریلا ایستاده، و بخش پایانی راه مسیری باریک است که در صخره بریده شده و درست
    از لبه به حیاط می‌رسد.


    نام آن از واژهٔ گرجی به معنای غار می‌آید: کلیسای اصلی در حفره‌ای طبیعی در سنگ آهک ساخته شده و بخشی
    از دیوار شمالی‌اش را خود صخره تشکیل می‌دهد. مجموعه به نیمهٔ دوم سدهٔ سیزدهم بازمی‌گردد. کلیسای اصلی
    بازیلیکایی دوشبستانی است و کنارش کلیسای کوچک تالاری سنت کاترین قرار دارد؛ برج ناقوس و ساختمان‌های مسکونی
    افزوده‌های سدهٔ نوزدهم‌اند و جماعتی از راهبه‌ها در ۲۰۱۴ دوباره اینجا مستقر شدند.


    پاره‌هایی از نقاشی دیواری در داخل مانده است. روی دیوار شمالی شبستان تصویر بانیان دیده می‌شود: راتی،
    فرمانروای راچا، همسرش روسودان و برادرش نیانیا — نمونه‌ای کمیاب از پرترهٔ گروهی یک خاندان حاکم ولایتی
    در قرون میانه. دیوار جنوبی در سدهٔ شانزدهم دوباره نقاشی شد، پس دو دست بسیار متفاوت کنار هم نشسته‌اند.
    بر دیوار جنوبی بیرونی کلیسای سنت کاترین نیز نقاشی مانده، فرسوده اما هنوز خوانا.


    تأثیر این جا بیش از معماری‌اش از موقعیتش می‌آید. سقف صخره‌ای دو متری بالای بام کلیساست، در هوای بارانی
    آب از آن پایین می‌آید، و از حیاط هم‌زمان دره و تپه‌های باطلهٔ معدن دیده می‌شود. صد متر بالاتر از شهر،
    هیاهوی صنعتی چیاتورا تقریباً به گوش نمی‌رسد.


    همین کنار هم نشستن دو چیز است که فضای اینجا را می‌سازد. از حیاط پایه‌های تله‌کابین و بام‌های یک شهر
    معدنی شوروی پیداست و درست پشت سرتان کلیسایی از سدهٔ سیزدهم که در صخره ساخته شده. نور صبح به نما می‌رسد و
    از اوایل بعدازظهر پیش‌آمدگی صخره تمام تراس را در سایه می‌گذارد؛ برای نقاشی‌های دیواری خوب است و برای
    عکاسی نه.
  tip: >-
    یک ساعت کافی است. صد متر آخر مسیر باریک است و کنار پرتگاه می‌گذرد؛ نرده جاهایی هست و سنگ در هوای مرطوب
    لغزنده می‌شود، پس کفش با کف صاف انتخاب بدی است. اینجا صومعه‌ای فعال است: قواعد پوشش اجرا می‌شود و عکاسی
    داخل کلیسا مجاز نیست. سرویس بهداشتی در حیاط است و نزدیک‌ترین کافه در مرکز چیاتورا، سه کیلومتر آن‌سوتر.
    در بخش لبه‌ای دست کودکان را محکم بگیرید.
  route: >-
    از تفلیس با E60 تا زستافونی و سپس شمال به سوی چیاتورا — روی‌هم حدود ۲۱۸ کیلومتر و سه ساعت و ربع. در
    چیاتورا از کویریلا بگذرید و به شرق، به سمت محلهٔ مگویمِوی برانید؛ کیلومتر آخر کوچه‌ای باریک و تند اما
    آسفالته است. خودرو را در میدانگاهی کوچک آغاز مسیر بگذارید؛ از آنجا فقط پیاده است. سوخت در زستافونی
    و چیاتورا موجود است. خودروی اقتصادی کافی است، اما سربالایی آخر را در زمستان با احتیاط بروید.
he:
  name: מנזר מגווימבי
  short: >-
    מנזר מן המאה ה-13 מתחת לגג סלע בקצה המזרחי של צ'יאטורה, בסופו של שביל מדף צר.
  body: >-
    **מגווימבי מסתתר מתחת לגג סלע ומרחוק קל לפספס אותו.** המנזר עומד בקצה המזרחי של צ'יאטורה, גבוה מעל
    גיא הקווירילה, והמקטע האחרון של הגישה הוא שביל צר החצוב בסלע, שהולך על שפת המצוק ישר אל החצר.


    השם בא מן המילה הגאורגית למערה: הכנסייה המרכזית נבנתה בתוך חלל טבעי באבן הגיר, וחלק מקירה הצפוני הוא
    הסלע עצמו. המכלול מתוארך למחצית השנייה של המאה ה-13. הכנסייה הראשית היא בזיליקה דו־אולמית, ולצדה כנסייה
    קטנה של קתרינה הקדושה; מגדל הפעמונים ומבני המגורים הם תוספות מן המאה ה-19, וקהילת נזירות שבה והתיישבה
    כאן ב-2014.


    בפנים שרדו שברי ציורי קיר. על הקיר הצפוני של האולם מצוירים המייסדים — ראטי, שליט ראצ'ה, אשתו רוסודן
    ואחיו ניאניה — דיוקן קבוצתי נדיר של משפחה שלטת אזורית מימי הביניים. הקיר הדרומי צויר מחדש במאה ה-16,
    ולכן שתי ידיים שונות מאוד יושבות זו לצד זו. גם על הקיר הדרומי החיצוני של כנסיית קתרינה נשמר ציור, שחוק
    אך עדיין קריא.


    הרושם כאן נובע מן המיקום יותר מן האדריכלות. תקרת הסלע תלויה כשני מטרים מעל גג הכנסייה, בגשם המים זולגים
    על פניה, ומן החצר נשקפים בבת אחת הגיא וערמות פסולת המכרות. מאה מטר מעל העיירה, הרעש התעשייתי של צ'יאטורה
    כמעט אינו מגיע.


    הניגוד הזה הוא חלק גדול מן הקסם. מן החצר נראים עמודי הרכבל וגגות עיירת מכרות סובייטית, ומיד מאחוריכם
    כנסייה מן המאה ה-13 הבנויה בתוך המצוק. אור הבוקר מגיע אל החזית, ומראשית אחר הצהריים משליך גג הסלע צל על
    כל המרפסת — טוב לציורי הקיר, פחות טוב לצלמים.
  tip: >-
    שעה מספיקה בהחלט. מאה המטרים האחרונים של השביל צרים ועוברים על שפת המצוק; מעקה יש רק בחלקים, והאבן
    נעשית חלקלקה ברטיבות, כך שסוליה חלקה היא רעיון רע. זהו מנזר נזירות פעיל: כללי הלבוש נאכפים ואסור לצלם
    בתוך הכנסייה. שירותים בחצר, ובית הקפה הקרוב במרכז צ'יאטורה, שלושה ק״מ משם. במקטע המדף החזיקו ילדים
    קטנים חזק ביד.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז צפונה לצ'יאטורה — כ-218 ק״מ בסך הכול, שלוש שעות ורבע. בצ'יאטורה
    חוצים את הקווירילה ונוסעים מזרחה לכיוון רובע מגווימבי; הקילומטר האחרון הוא רחוב צר ותלול אך סלול. משאירים
    את הרכב במפרץ הקטן בתחילת השביל, ומשם ברגל בלבד. דלק יש בזסטפוני ובצ'יאטורה. רכב חסכוני מספיק, אך בחורף
    יש לעלות בזהירות במקטע האחרון.
ar:
  name: دير مغفيميفي
  short: >-
    دير من القرن الثالث عشر يستكن تحت صخرة نافرة في الطرف الشرقي لتشياتورا، في نهاية ممر ضيق على حافة الجرف.
  body: >-
    **يختبئ مغفيميفي تحت صخرة نافرة ويسهل ألا تلحظه من بعيد.** يقوم الدير في الطرف الشرقي من تشياتورا،
    عالياً فوق وادي كفيريلا، والجزء الأخير من الطريق ممر ضيق محفور في الجرف يسير على الحافة حتى الفناء
    مباشرة.


    الاسم مشتق من الكلمة الجورجية التي تعني الكهف: فالكنيسة الرئيسية بُنيت داخل تجويف طبيعي في الحجر الجيري،
    وجزء من جدارها الشمالي هو الصخر نفسه. ويعود المجمع إلى النصف الثاني من القرن الثالث عشر. الكنيسة الرئيسية
    بازيليكا ذات صحنين، وإلى جانبها كنيسة صغيرة للقديسة كاترين؛ أما برج الأجراس ومساكن الرهبان فإضافات
    من القرن التاسع عشر، وأُعيد تأسيس جماعة من الراهبات هنا عام 2014.


    بقيت في الداخل شذرات من الرسوم الجدارية. على الجدار الشمالي للصحن صور المؤسسين: راتي حاكم راتشا، وزوجته
    روسودان، وأخوه نيانيا — وهو بورتريه جماعي نادر لأسرة حاكمة إقليمية في العصر الوسيط. وأُعيد رسم الجدار
    الجنوبي في القرن السادس عشر، فاجتمعت يدان مختلفتان تماماً جنباً إلى جنب. وعلى الجدار الجنوبي الخارجي
    لكنيسة القديسة كاترين رسوم أيضاً، متآكلة لكنها ما تزال مقروءة.


    أثر المكان يأتي من موقعه أكثر مما يأتي من عمارته. فسقف الصخر يعلو سطح الكنيسة بمترين، وينساب الماء
    على وجهه في المطر، ومن الفناء يُرى الوادي وتلال مخلفات المناجم في آن واحد. وعلى ارتفاع مئة متر فوق
    البلدة يكاد ضجيج تشياتورا الصناعي لا يصل.


    هذا التجاور هو جانب كبير من جاذبية المكان. فمن الفناء ترى أعمدة التلفريك وسطوح بلدة تعدين سوفييتية،
    وخلفك مباشرة كنيسة من القرن الثالث عشر مبنية داخل الجرف. يبلغ ضوء الصباح الواجهة، ومن أوائل بعد الظهر
    يلقي نتوء الصخر ظلاً على المصطبة كلها؛ وهو ما يناسب الجداريات ويزعج المصورين.
  tip: >-
    ساعة تكفي تماماً. المئة متر الأخيرة من الممر ضيقة وتسير على حافة الجرف؛ والدرابزين موجود في مواضع فقط،
    والحجر يصير زلقاً عند الرطوبة، فالنعل الأملس فكرة سيئة. المكان دير راهبات عامل: قواعد اللباس مطبّقة
    والتصوير داخل الكنيسة ممنوع. توجد دورة مياه في الفناء، وأقرب مقهى في وسط تشياتورا على بعد ثلاثة كيلومترات.
    أمسك أيدي الأطفال الصغار بإحكام في مقطع الحافة.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني ثم شمالاً إلى تشياتورا — نحو 218 كم إجمالاً وثلاث ساعات وربع.
    في تشياتورا اعبر نهر كفيريلا واتجه شرقاً نحو حي مغفيميفي؛ الكيلومتر الأخير شارع ضيق شديد الانحدار لكنه
    معبّد. اترك السيارة في الساحة الصغيرة عند بداية الممر، وما بعدها سيراً فقط. الوقود متوفر في زستافوني
    وتشياتورا. وتكفي سيارة اقتصادية، مع الانتباه في الصعود الأخير شتاءً.
