ka:
  name: მღვიმევის მონასტერი
  short: >-
    XIII საუკუნის მონასტერი კირქვის ქარაფის ქვეშ, ყვირილის ხეობის თავზე — ჭიათურიდან აქ გრძელი კიბე და
    თაღოვანი გვირაბი ამოგიყვანთ.
  body: >-
    **მღვიმევში ტაძარს ცად თვითონ კლდე გადაჰფარებია.**


    სახელი მღვიმიდან მოდის და სიტყვასიტყვით უნდა გაიგოთ. XIII საუკუნეში ჭიათურის აღმოსავლეთ კიდეზე, ყვირილის
    ხეობის თავზე, კირქვის ბუნებრივ ღრმულში მაცხოვრის სახელობის მონასტერი დაფუძნდა. მთავარი ტაძრის ზურგს
    უკან თვითონ მღვიმე იხსნება და დიდ დღესასწაულებზე წირვა სწორედ იქ, კლდის წიაღში აღევლინება.


    მისვლაც ამბის ნაწილია. ქუჩიდან ვიწრო, გრძელი კიბე ადის, მერე ხელოვნური გვირაბი იწყება, რომლის ჭერსაც
    საყრდენი თაღები იჭერს, და ბოლოს ეზოში გამოდიხართ. წინ მაცხოვრის ორნავიანი ბაზილიკა დგას, ფასადი ჩუქურთმით
    აქვს მოქარგული: სარკმლის სახვევები, მონუმენტური ჯვრები, ერთმანეთზე გადაბმული რომბები, მაქმანივით ნაკვეთი
    კარნიზი. გვერდით პატარა დარბაზული ეკლესიაა — ჭერიც და დასავლეთი კედელიც აქ დაუმუშავებელი კლდეა; აღმოსავლეთ
    კედელზე ვერძის თავის ბარელიეფი მოძებნეთ.


    ბაზილიკაში XIII საუკუნის მხატვრობაა შემორჩენილი, მათ შორის — მონასტრის მაშენებელთა პორტრეტები: რაჭის
    ერისთავი რატი, მისი მეუღლე და ძმა, ნიანია კახაბერისძე. შუა საუკუნეების საერისთავო ოჯახი დღესაც ბათქაშიდან
    გადმოგყურებთ. ყურადღება მიაქციეთ ხის კანკელსაც — მთლიანად მოხატულს, ჭედური ფირფიტებით შემკული კარითა
    და ზემოთ მაცხოვრისა და თორმეტი მოციქულის გამოსახულებით. მონასტრის უდიდესი განძი კი აქ აღარ არის: უნიკალური
    ჭედური ხატები და ხეზე კვეთის ბრწყინვალე ნიმუში, ვაზის კარი, საქართველოს ხელოვნების სახელმწიფო მუზეუმის
    ფონდებში ინახება. 2006 წელს კომპლექსს ეროვნული მნიშვნელობის ძეგლის კატეგორია მიენიჭა; დღეს აქ მოქმედი
    დედათა მონასტერია.


    ეზოდან ქვემოთ საბაგიროების ანძები და საბჭოთა სამთო ქალაქის სახურავები მოჩანს. დაბლა ჭიათურა მთებს
    მანგანუმს აცლის; აქ, მაღლა, შვიდი საუკუნეა, რაც ეკლესია მთას შეჰფარებია.
  tip: >-
    ერთი საათი დაუთმეთ, კიბისთვის — ცოტა მეტიც. საფეხურები და გვირაბი ვიწრო და უსწორმასწოროა, წვიმის შემდეგ
    კი სრიალებს: ჩაიცვით ფეხსაცმელი მოუცურებელი ძირით; ბავშვის ეტლისთვის აქ ადგილი არ არის. ეს მოქმედი
    დედათა მონასტერია — ქალებს კაბა და თავსაფარი სჭირდებათ, მამაკაცებს გრძელი შარვალი, და ჯობს, საკუთარი
    წამოიღოთ, რომ ჭიშკართან უხერხულობა აიცილოთ. ტაძარში გადაღებამდე ნებართვა ითხოვეთ და უარი მშვიდად მიიღეთ.
    გვირაბში ხმადაბლა ილაპარაკეთ — ხმა შორს მიდის. კაფე და მაღაზია ჭიათურის ცენტრშია, ქალაქის საბაგიროები
    კი კილომეტრნახევარში, ასე რომ, ორივე ერთ დილას იოლად ეტევა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონამდე, იქიდან კი შ22-ით ჩრდილოეთისკენ აუყევით
    ყვირილის ხეობას და კაცხის გავლით ჭიათურაში ჩადით — სულ დაახლოებით 218 კმ და 3 სთ 15 წთ. მღვიმევი ქალაქის
    აღმოსავლეთ კიდეზეა, შ22-ზე, იქ, სადაც გზა საჩხერისკენ გადის. არსებობს უფრო მოკლე გზაც: S1-დან გომთან,
    ქარელის დასავლეთით, გადაუხვიეთ და შ22-ს მეორე ბოლოდან, საჩხერის გავლით ჩამოუყევით — დაახლოებით 184
    კმ. ორივე გზა ასფალტიანია; ჭიათურის ქუჩები ვიწრო, ციცაბო და სამთო ტრანსპორტისგან ნაცვეთია. მანქანა
    კიბის ძირთან ახლოს დააყენეთ. საწვავს ზესტაფონში, საჩხერესა და ჭიათურაში იშოვით. ეკონომ-კლასი სავსებით
    საკმარისია.
en:
  name: Mgvimevi Monastery
  short: >-
    A 13th-century monastery set beneath a limestone overhang above the Kvirila gorge, reached from Chiatura
    by a long stair and an arched tunnel.
  body: >-
    **At Mgvimevi the roof over the church is the mountain itself.**


    The name comes from *mghvime*, "cave", and it is meant literally. In the 13th century a monastery
    of the Saviour was set into a natural hollow of the limestone on the eastern edge of Chiatura, high
    above the Kvirila gorge. Behind the main church the cave still opens into the rock, and on great feast
    days the liturgy is sung inside it.


    Getting in is part of the story. From the street a long, narrow stairway climbs the slope, then a
    man-made tunnel, its roof braced by arches, delivers you into the courtyard. Ahead stands the two-nave
    basilica of the Saviour, its facade crowded with carving: framed windows, monumental crosses, chains
    of interlocking lozenges, a cornice worked like lace. Beside it a small hall church uses raw rock
    for its ceiling and west wall; look on its east wall for a ram's head cut in low relief.


    Inside the basilica, 13th-century frescoes include the founders: Rati, eristavi (duke) of Racha, his
    wife, and his brother Niania Kakhaberisdze, a medieval ruling family still watching from the plaster.
    Look too for the wooden chancel screen, painted all over, its door clad in repoussé plates and crowned
    by Christ and the Twelve Apostles. The monastery's greatest treasures, though, are no longer here.
    Its repoussé icons and the Vine Door, a masterpiece of wood carving, are kept in the collections of
    the State Art Museum of Georgia in Tbilisi. In 2006 the complex was listed as a monument of national
    significance; today it is a working convent.


    From the courtyard you look down on ropeway pylons and the roofs of a Soviet mining town. Below, Chiatura
    digs manganese out of the hills; up here, for seven centuries, a church has been sheltering inside
    one.
  tip: >-
    Allow an hour, plus a little extra for the stairs. Steps and tunnel are narrow and uneven and turn
    slick after rain, so wear shoes with real grip; this is no place for a pushchair. It is a working
    convent: women need a skirt and headscarf, men long trousers, and bringing your own spares you an
    awkward moment at the gate. Ask before photographing inside the church, and take a no gracefully.
    Keep your voice low in the tunnel, where sound carries. Cafés and shops are in central Chiatura, and
    the town's ropeways are barely a kilometre and a half away, so the two fit neatly into one morning.
  route: >-
    From Tbilisi follow the S1 (E60) west to Zestaponi, then the Sh22 north up the Kvirila valley, past
    Katskhi, into Chiatura: about 218 km and 3 h 15 min. Mgvimevi sits on the eastern edge of town, on
    the Sh22 where it leaves for Sachkhere. There is a shorter alternative: leave the S1 at Gomi, west
    of Kareli, and take the Sh22 from the other end, through Sachkhere, for around 184 km. Both routes
    are paved; Chiatura's own streets are narrow, steep and worn by mining traffic. Park near the foot
    of the stairway. Fuel is available in Zestaponi, Sachkhere and Chiatura. An economy car is all you
    need.
ru:
  name: Монастырь Мгвимеви
  short: >-
    Монастырь XIII века под известняковым навесом над ущельем Квирилы; из Чиатуры к нему ведут длинная
    лестница и сводчатый тоннель.
  body: >-
    **В Мгвимеви крышей над храмом служит сама гора.**


    Название происходит от «мгвиме» — «пещера», и это надо понимать буквально. В XIII веке в естественной
    впадине известняка, на восточной окраине Чиатуры, высоко над ущельем Квирилы, был основан монастырь
    Спасителя. За главным храмом до сих пор открывается пещера в скале, и в великие праздники литургия
    совершается прямо в ней.


    Дойти сюда — уже часть истории. От улицы вверх по склону поднимается длинная узкая лестница, затем
    начинается рукотворный тоннель со сводчатым потолком, который выводит вас во двор. Впереди стоит двухнефная
    базилика Спасителя, фасад которой сплошь покрыт резьбой: обрамления окон, монументальные кресты, цепочки
    сплетённых ромбов, карниз, вырезанный, словно кружево. Рядом — небольшая зальная церковь, у которой
    потолок и западная стена — необработанная скала; на восточной стене поищите барельеф бараньей головы.


    Внутри базилики сохранились фрески XIII века с портретами ктиторов: Рати, эристави (правителя) Рачи,
    его жены и его брата Ниании Кахаберисдзе — средневековая правящая семья до сих пор смотрит со штукатурки.
    Обратите внимание и на деревянную алтарную преграду, расписанную целиком: её дверь обита чеканными
    пластинами, а вверху изображены Спаситель и двенадцать апостолов. А вот главные сокровища монастыря
    давно не здесь. Его чеканные иконы и Виноградные врата, шедевр резьбы по дереву, хранятся в собраниях
    Государственного музея искусств Грузии в Тбилиси. В 2006 году комплекс получил статус памятника национального
    значения; сегодня здесь действующий женский монастырь.


    Со двора видны опоры канатных дорог и крыши советского шахтёрского города. Внизу Чиатура выбирает
    марганец из этих гор; наверху уже семь веков церковь укрывается внутри одной из них.
  tip: >-
    Отведите час, плюс немного времени на лестницу. Ступени и тоннель узкие, неровные и становятся скользкими
    после дождя, так что наденьте обувь с нескользкой подошвой; для детской коляски здесь не место. Это
    действующий женский монастырь: женщинам нужна юбка и платок, мужчинам — длинные брюки, и, взяв всё
    с собой, вы избежите неловкости у ворот. Спрашивайте разрешения перед съёмкой внутри храма и спокойно
    принимайте отказ. Говорите тише в тоннеле — там звук разносится далеко. Кафе и магазины — в центре
    Чиатуры, а городские канатные дороги — едва в полутора километрах, так что и то и другое легко уместить
    в одно утро.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад до Зестафони, затем по трассе Ш22 на север, вверх по долине
    Квирилы, минуя Кацхи, в Чиатуру: около 218 км и 3 ч 15 мин. Мгвимеви расположен на восточной окраине
    города, на Ш22, где дорога уходит на Сачхере. Есть более короткий вариант: свернуть с S1 у Гоми, западнее
    Карели, и ехать по Ш22 с другого конца, через Сачхере, — около 184 км. Обе дороги асфальтированы;
    улицы самой Чиатуры узкие, крутые и разбиты горнорудным транспортом. Оставьте машину у подножия лестницы.
    Заправки есть в Зестафони, Сачхере и Чиатуре. Машины эконом-класса достаточно.
fa:
  name: صومعهٔ مگویمِوی
  short: >-
    صومعه‌ای از سدهٔ سیزدهم زیر برآمدگی آهکی بر فراز تنگهٔ کویریلا؛ راه رسیدن به آن از چیاتورا با پله‌ای
    طولانی و تونلی طاق‌دار می‌گذرد.
  body: >-
    **در مگویمِوی، سقف کلیسا خود کوه است.**


    نام این‌جا از «مغویمه»، به معنای «غار»، می‌آید و باید آن را به‌معنای واقعی گرفت. در سدهٔ سیزدهم، در
    گودالی طبیعی از سنگ آهک، در حاشیهٔ شرقی چیاتورا، بر بلندی‌ای مشرف بر تنگهٔ کویریلا، صومعهٔ ناجی بنیاد
    گذاشته شد. پشت کلیسای اصلی، غار هنوز به دل سنگ باز می‌شود، و در جشن‌های بزرگ، آیین عشای ربانی درست
    در دل آن برگزار می‌شود.


    رسیدن به این‌جا نیز بخشی از داستان است. از خیابان، پله‌ای باریک و طولانی بر شیب کوه بالا می‌رود، سپس
    تونلی دست‌ساز، که سقفش را طاق‌ها نگه داشته‌اند، شما را به حیاط می‌رساند. پیش رو بازیلیکای دوشبستانیِ
    ناجی ایستاده و نمای آن سراسر با کنده‌کاری پوشیده است: قاب پنجره‌ها، صلیب‌های بزرگ، زنجیرهایی از لوزی‌های
    به‌هم‌بافته، و قرنیزی که چون تور کنده‌کاری شده. کنارش کلیسایی کوچک و تک‌شبستانی است که سقف و دیوار
    غربی‌اش سنگ خام است؛ بر دیوار شرقی‌اش دنبال نقش برجستهٔ سر یک قوچ بگردید.


    درون کلیسای اصلی، نقاشی‌های دیواری سدهٔ سیزدهم بانیان را در خود دارد: راتی، اریستاوی (دوک) راچا، همسرش،
    و برادرش نیانیا کاخابریسدزه - خانواده‌ای حکمران از سده‌های میانه که هنوز از دل گچ به شما نگاه می‌کنند.
    به دیوار محراب چوبی (کانکل) هم که سراسر نقاشی شده توجه کنید: درِ آن با صفحه‌های قلم‌زده پوشیده شده
    و در بالایش مسیح و دوازده حواری نقش شده‌اند. اما بزرگ‌ترین گنجینه‌های صومعه دیگر این‌جا نیستند. شمایل‌های
    قلم‌زدهٔ آن و «درِ تاک»، شاهکار کنده‌کاری روی چوب، در مجموعه‌های موزهٔ دولتی هنر گرجستان در تفلیس
    نگه‌داری می‌شوند. در سال ۲۰۰۶ این مجموعه به‌عنوان یادمانی با اهمیت ملی ثبت شد؛ امروز این‌جا صومعهٔ
    زنانهٔ فعالی است.


    از حیاط، ستون‌های تله‌کابین و بام‌های شهری معدنی از دوران شوروی به چشم می‌آید. در پایین، چیاتورا از
    این کوه‌ها منگنز بیرون می‌کشد؛ در بالا، هفت سده است که کلیسایی درون یکی از همین کوه‌ها پناه گرفته
    است.
  tip: >-
    یک ساعت در نظر بگیرید، به‌همراه کمی زمان بیشتر برای پله‌ها. پله‌ها و تونل باریک و ناهموارند و پس از
    باران لیز می‌شوند، پس کفشی با زیرهٔ ضدلغزش بپوشید؛ این‌جا جای کالسکهٔ کودک نیست. این‌جا صومعه‌ای فعال
    است: زنان نیاز به دامن و روسری دارند، مردان به شلوار بلند، و اگر خودتان همراه داشته باشید از لحظه‌ای
    ناخوشایند دم دروازه پرهیز می‌کنید. پیش از عکاسی در داخل کلیسا اجازه بگیرید، و اگر پاسخ منفی بود، آن
    را بپذیرید. در تونل آرام صحبت کنید، چون صدا در آن دور می‌رود. کافه و مغازه در مرکز چیاتورا هستند،
    و تله‌کابین‌های شهر تنها یک‌ونیم کیلومتر فاصله دارند، پس این دو به‌آسانی در یک صبح جای می‌گیرند.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب تا زستافونی بروید، سپس از راه Sh22 به سوی شمال، در دره‌ی کویریلا
    بالا بروید و از کنار کاتسخی به چیاتورا برسید: نزدیک به ۲۱۸ کیلومتر و ۳ ساعت و ۱۵ دقیقه. مگویمِوی در
    حاشیهٔ شرقی شهر است، بر Sh22، جایی که راه به سوی ساچخره می‌رود. مسیر کوتاه‌تری هم هست: از S1 در گومی،
    غرب کارِلی، بپیچید و از سوی دیگر Sh22، از میان ساچخره، پیش بروید - نزدیک به ۱۸۴ کیلومتر. هر دو راه
    آسفالت‌اند؛ خیابان‌های خود چیاتورا باریک، پرشیب و از رفت‌وآمد کامیون‌های معدنی فرسوده‌اند. ماشین را
    نزدیک پای پله‌ها پارک کنید. سوخت در زستافونی، ساچخره و چیاتورا در دسترس است. یک خودروی اقتصادی کافی
    است.
he:
  name: מנזר מגווימווי
  short: מנזר מהמאה ה-13 השכון תחת מצוק גיר נטוי מעל ערוץ קווירילה; מגיעים אליו מצ'יאטורה במדרגות ארוכות
    ומנהרה מקומרת.
  body: >-
    **במגווימווי הגג שמעל הכנסייה הוא ההר עצמו.**


    השם בא מ-"מגווימה", "מערה", והכוונה מילולית. במאה ה-13 נוסד בגומחת גיר טבעית, בקצה המזרחי של צ'יאטורה,
    גבוה מעל ערוץ קווירילה, מנזר המושיע. מאחורי הכנסייה הראשית עדיין נפערת המערה בסלע, ובחגים הגדולים
    מושרת בה הליטורגיה עצמה.


    ההגעה לשם היא חלק מהסיפור. מהרחוב עולות במעלה ההר מדרגות צרות וארוכות, ואז מתחילה מנהרה מעשה ידי אדם,
    שגגה נתמך בקשתות, המובילה אתכם לחצר. לפניכם עומדת הבזיליקה הדו-ספינתית של המושיע, שחזיתה עמוסה בפיתוחים:
    מסגרות חלונות, צלבים מונומנטליים, שרשראות של מעוינים שלובים, וכרכוב מגולף כתחרה. לצדה כנסיית אולם
    קטנה שגגה וקירה המערבי הם סלע טבעי; על קירה המזרחי חפשו ראש איל מגולף בתבליט נמוך.


    בתוך הבזיליקה שרדו פרסקאות מהמאה ה-13 המציגות את המקימים: ראטי, אריסטאווי (דוכס) של ראצ'ה, אשתו, ואחיו
    ניאניה קחבריסדזה - משפחה שלטת מימי הביניים שממשיכה להשקיף מהטיח עד היום. שימו לב גם למחיצת המזבח (איקונוסטזיס)
    מעץ, המצוירת כולה: דלתה מצופה לוחות רפוסה, ומעליה מתוארים ישו ושנים-עשר השליחים. אבל אוצרותיו הגדולים
    ביותר של המנזר אינם עוד כאן. איקונות הרפוסה שלו והדלת המגולפת "שער הגפן", יצירת מופת בגילוף עץ, נמצאים
    באוסף המוזיאון הממלכתי לאמנות של גאורגיה בטביליסי. ב-2006 הוכרז המתחם כאתר בעל חשיבות לאומית; כיום
    זהו מנזר נזירות פעיל.


    מהחצר משקיפים למטה על עמודי הרכבל ועל גגות עיירת כרייה סובייטית. מתחת, צ'יאטורה חופרת מנגן מההרים;
    מעל, כבר שבע מאות שנה כנסייה מסתופפת בתוך אחד מהם.
  tip: >-
    הקדישו שעה, ועוד קצת זמן למדרגות. המדרגות והמנהרה צרות ולא אחידות ומחליקות אחרי גשם, כך שכדאי לנעול
    נעליים עם אחיזה טובה; זה לא מקום לעגלת תינוק. זהו מנזר נזירות פעיל: נשים צריכות חצאית וכיסוי ראש,
    גברים מכנסיים ארוכים, וכדאי להביא משלכם כדי לחסוך אי-נעימות בשער. בקשו רשות לפני צילום בתוך הכנסייה,
    וקבלו סירוב בחן. דברו בשקט במנהרה, שם הקול נישא למרחק. בתי קפה וחנויות נמצאים במרכז צ'יאטורה, ורכבלי
    העיר במרחק קילומטר וחצי בלבד, כך שהשניים משתלבים בקלות בבוקר אחד.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה עד זסטפוני, ואז בדרך Sh22 צפונה, במעלה עמק קווירילה, דרך קאצחי, עד צ'יאטורה:
    כ-218 ק"מ ו-3 שעות ו-15 דקות. מגווימווי נמצא בקצה המזרחי של העיר, על Sh22, במקום שממנו הדרך פונה לסצ'חרה.
    יש חלופה קצרה יותר: לרדת מ-S1 בגומי, ממערב לקרלי, ולקחת את Sh22 מהכיוון השני, דרך סצ'חרה - כ-184 ק"מ.
    שתי הדרכים סלולות; רחובות צ'יאטורה עצמה צרים, תלולים ובלויים מתעבורת הכרייה. השאירו את הרכב סמוך לתחתית
    המדרגות. דלק זמין בזסטפוני, בסצ'חרה ובצ'יאטורה. רכב חסכוני מספיק.
ar:
  name: دير مغفيميفي
  short: دير من القرن الثالث عشر يقوم تحت نتوء كلسي فوق وادي كفيريلا؛ يُقصَد من تشياتورا بسلّم طويل ونفق
    مقنطر.
  body: >-
    **في مغفيميفي، سقف الكنيسة هو الجبل نفسه.**


    يأتي الاسم من كلمة "مغفيمِه"، أي "كهف"، وينبغي أخذها حرفياً. في القرن الثالث عشر، تأسّس دير المخلّص
    في تجويف طبيعي من الحجر الكلسي، عند الحافة الشرقية لتشياتورا، عالياً فوق وادي كفيريلا. وخلف الكنيسة
    الرئيسية لا يزال الكهف مفتوحاً في الصخر، وفي الأعياد الكبرى يُقام القداس داخله.


    الوصول إلى هناك جزء من الحكاية. من الشارع يصعد سلّم طويل وضيق على المنحدر، ثم يبدأ نفق من صنع الإنسان،
    تدعم سقفه أقواس، يقودك إلى الساحة. أمامك تقف بازيليكا المخلّص ذات الصحنين، وواجهتها مكتظة بالنقوش:
    أطر النوافذ، الصلبان الضخمة، سلاسل من المعينات المتشابكة، وإفريز منحوت كالدانتيل. وإلى جانبها كنيسة
    صغيرة ذات قاعة واحدة، سقفها وجدارها الغربي من الصخر الخام؛ وعلى جدارها الشرقي ابحث عن رأس كبش بنقش
    بارز.


    داخل البازيليكا، تبقى جداريات من القرن الثالث عشر تضمّ صور المؤسّسين: راتي، إريستافي (دوق) راتشا،
    وزوجته، وأخوه نيانيا كاخابيريسدزه - عائلة حاكمة من العصور الوسطى لا تزال تنظر من الجص. وانظر أيضاً
    إلى حاجز الهيكل الخشبي المرسوم بكامله: بابه مكسوّ بصفائح مطروقة، وفي أعلاه صورة المسيح والرسل الاثني
    عشر. أما أعظم كنوز الدير فلم تعد هنا. فأيقوناته المطروقة و"باب الكرمة"، تحفة النقش على الخشب، محفوظة
    في مجموعات المتحف الحكومي للفنون في جورجيا بتبليسي. وفي 2006 صُنّف المجمّع أثراً ذا أهمية وطنية؛ واليوم
    هو دير راهبات عامر.


    من الساحة تنظر إلى أسفل فترى أعمدة التلفريك وأسطح مدينة تعدين سوفيتية. تحتك، تنتزع تشياتورا المنغنيز
    من هذه التلال؛ وهنا، فوق، منذ سبعة قرون، تحتمي كنيسة داخل واحدة منها.
  tip: >-
    خصص ساعة، مع وقت إضافي قليل للسلالم. الدرجات والنفق ضيقة وغير مستوية وتصبح زلقة بعد المطر، فارتدِ
    حذاءً بنعل غير زلق؛ هذا ليس مكاناً لعربة طفل. هذا دير راهبات عامر: على النساء تنّورة وغطاء رأس، وعلى
    الرجال بنطال طويل، وحمل ما يلزم معك يوفّر عليك حرجاً عند البوابة. اطلب الإذن قبل التصوير داخل الكنيسة،
    وتقبّل الرفض بلطف إن حدث. تحدّث بصوت خفيض في النفق، فالصوت يصل بعيداً هناك. المقاهي والمتاجر في وسط
    تشياتورا، وتلفريك المدينة على بعد كيلومتر ونصف بالكاد، فيجتمع الاثنان بسهولة في صباح واحد.
  route: >-
    من تبليسي على الطريق السريع S1 (E60) غرباً إلى زستافوني، ثم على طريق Sh22 شمالاً، صعوداً في وادي كفيريلا،
    مروراً بكاتسخي، إلى تشياتورا: نحو 218 كم و3 ساعات و15 دقيقة. يقع مغفيميفي عند الحافة الشرقية للمدينة،
    على طريق Sh22 حيث يتجه الطريق إلى ساتشخيري. وثمّة بديل أقصر: اترك S1 عند غومي، غرب كاريلي، وخذ Sh22
    من الطرف الآخر، عبر ساتشخيري - نحو 184 كم. كلا الطريقين معبّد؛ أما شوارع تشياتورا نفسها فضيقة ومنحدرة
    ومهترئة من حركة نقل التعدين. اترك السيارة قرب أسفل السلّم. الوقود متوفر في زستافوني وساتشخيري وتشياتورا.
    سيارة اقتصادية تكفي.
