ka:
  name: ენგურის კაშხალი და ჯვრის წყალსაცავი
  short: >-
    მსოფლიოში სიმაღლით მეორე ბეტონის თაღოვანი კაშხალი — 271,5 მეტრი მოხრილი ბეტონი სვანეთის გზაზე და მის
    უკან გაწოლილი მყინვარული წყლის ტბა.
  body: >-
    **271,5 მეტრის სიმაღლის თხელი ბეტონის რკალი ენგურის ხეობას ისე კეტავს, რომ სვანეთის გზა ერთი წამით
    თითქოს უზარმაზარი თასის კიდეზე მიგიყვანთ.** ეს მსოფლიოში სიმაღლით მეორე ბეტონის თაღოვანი კაშხალია
    და ეს ეტყობა კიდეც: ორ კლდოვან კედელს შორის ჩაჭედილი ღია ფერის ნიჟარა, რომლის ქვემოთ ჩახედვისას მოაჯირზე
    ხელის გული გეოფლებათ.


    ამბავი კურორტით იწყება. ნიკიტა ხრუშჩოვს დიდი კაშხალი თავდაპირველად ბზიფზე სურდა, თავის საყვარელ კურორტთან,
    ბიჭვინთასთან ახლოს, სანამ სპეციალისტებმა არ გააფრთხილეს, რომ ასეთი კაშხალი ბიჭვინთის პლაჟებს ეროზიით
    გაანადგურებდა. პროექტი ენგურზე გადმოვიდა. მშენებლობა 1961 წელს დაიწყო, ტურბინები დროებით 1978 წელს
    აამუშავეს, კაშხალი კი 1987 წელს დასრულდა.


    მერე ქვეყანა გაიხლიჩა. კაშხალი ჯვრის ჩრდილოეთით, ქართული ხელისუფლების კონტროლქვეშ მყოფ მიწაზე დგას,
    ელექტროსადგური კი, რომელსაც ის წყალს აწვდის, აფხაზეთის გალის რაიონშია. 1992 წლის შეთანხმებით ენერგია
    ორ მხარეს შორის იყოფა — დაახლოებით 60 პროცენტი საქართველოს ერგება, 40 — აფხაზეთს; ეს ერთ-ერთი იმ იშვიათ
    საქმეთაგანია, რომელიც გამყოფი ხაზის ორივე მხარეს დღემდე მუშაობს. 1994 წელს კანადური „ჰიდრო-კებეკის“
    ინჟინრებმა ნაგებობა „იშვიათად მძიმე, ავარიულ მდგომარეობაში“ ნახეს; მის აღდგენას საერთაშორისო სესხებით
    დაახლოებით 116 მილიონი ევრო მოხმარდა. 2015 წელს კაშხალი კულტურული მემკვიდრეობის ძეგლად გამოცხადდა.


    კაშხლის უკან ჯვრის წყალსაცავი ხეობას მყინვარული წყლის რძისფერ-მომწვანო ლურჯით ავსებს; მისი დონე სეზონისა
    და ენერგოსისტემის მოთხოვნის მიხედვით ხან იწევს, ხან იკლებს.


    ოცი წუთით გაჩერდით აქ — და წინ მდებარე გრძელი ხეობა აზრს შეიძენს: აი, რა ძალის მდინარეს მიჰყვებით
    მესტიამდე.
  tip: >-
    ოცი წუთიდან ერთ საათამდე სავსებით საკმარისია. კაშხალთან გასაჩერებელი ადგილი პატარაა, გზაზე კი სვანეთისკენ
    მძიმე სატვირთოები დადიან — მანქანა ბოლომდე გაიყვანეთ სავალი ნაწილიდან და გზის გადაკვეთისას ფრთხილად
    იყავით. ეს სტრატეგიული ენერგეტიკული ობიექტია: დრონს ნუ აუშვებთ, დაცვამ კი ზოგი ხედის წერტილიდან შეიძლება
    გაგაბრუნოთ — ადგილზე მითითებებს მიჰყევით. საპირფარეშო, კაფე და სასმელი წყალი ჯვარშია, რამდენიმე წუთის
    სავალზე ქვემოთ. საუკეთესო შუქი დილის შუა საათებიდან შუადღემდეა, სანამ ხეობას ჩრდილი დაფარავს. წყალსაცავის
    დონე წლის განმავლობაში საგრძნობლად მერყეობს, ამიტომ ხედი ყოველ სეზონზე სხვაა.
  route: >-
    თბილისიდან დაახლოებით 350 კმ და 5 საათი და 10 წუთია. E60 მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის
    გავლით, სენაკამდე და შემდეგ ზუგდიდამდე იარეთ, იქიდან კი ჩრდილო-აღმოსავლეთით, ჯვრისა და მესტიის მიმართულებით
    გაუხვიეთ. ზუგდიდიდან კაშხლამდე დაახლოებით 30 კმ-ია — ორმოციოდე წუთი ენგურის ხეობაში, კარგ ასფალტზე,
    დამრეცი აღმართით. საწვავი ზუგდიდში ჩაასხით: ჯვრის შემდეგ მესტიამდე სადგურები სულ უფრო იშვიათდება.
    ეკონომ-კლასის ავტომობილი აქ მთელი წლის განმავლობაში საკმარისია; თუ ზამთარში სვანეთისკენ აგრძელებთ,
    ზამთრის საბურავები ან ჯაჭვები აუცილებლად იქონიეთ.
en:
  name: Enguri Dam and Jvari Reservoir
  short: >-
    The world's second-highest concrete arch dam: 271.5 metres of curved concrete on the road to Svaneti,
    holding back a long lake of glacier water.
  body: >-
    **A thin curve of concrete 271.5 metres high seals the Enguri gorge, and for a moment the road to
    Svaneti seems to run along the rim of a giant bowl.** It is the second-highest concrete arch dam in
    the world, and it looks it: a pale shell wedged between two walls of rock, with a drop below that
    makes your palms sweat at the parapet.


    The story begins with a holiday. Nikita Khrushchev first wanted his great dam on the Bzyb, near his
    favourite resort at Pitsunda, until experts warned that it would erode the Pitsunda beaches. The project
    moved to the Enguri. Work began in 1961; the turbines turned for the first time, temporarily, in 1978,
    and the dam was finished in 1987.


    Then the country broke. The dam stands on Georgian-controlled ground just north of Jvari, but the
    power station it feeds lies in Abkhazia's Gali district. Under a 1992 agreement the electricity is
    shared — roughly 60 per cent to Georgia, 40 to Abkhazia — one of the few things that still works across
    the ceasefire line. In 1994 engineers from Canada's Hydro-Québec found the structure "in a rare state
    of dilapidation"; around €116 million in international loans went into its repair. In 2015 the dam
    was declared a cultural heritage monument.


    Behind it, the Jvari reservoir fills the valley with the milky green-blue of glacier melt, its level
    rising and falling with the seasons and the demands of the grid.


    Stop here for twenty minutes and the long gorge ahead begins to make sense: this is the strength of
    the river you are about to follow all the way to Mestia.
  tip: >-
    Twenty minutes to an hour is plenty. The pull-off by the dam is small and the road carries heavy lorries
    to Svaneti, so get fully off the tarmac and take care crossing. This is a strategic energy site: keep
    your drone packed, and expect guards to wave you away from some viewpoints — follow the signs on the
    spot. Toilets, cafés and drinking water are in Jvari, a few minutes back down the road. Light is best
    from mid-morning to early afternoon, before the gorge falls into shadow. The reservoir level swings
    noticeably through the year, so the view changes with the season.
  route: >-
    About 350 km and 5 hours 10 minutes from Tbilisi. Follow the E60 highway west past Kutaisi and Samtredia
    to Senaki and on to Zugdidi, then turn north-east for Jvari and Mestia. From Zugdidi it is roughly
    30 km — some forty minutes — to the dam, climbing gently up the Enguri valley on good asphalt. Fill
    the tank in Zugdidi: beyond Jvari, stations thin out fast on the way to Mestia. An economy car is
    entirely adequate here all year; if you are continuing to Svaneti in winter, make sure you have winter
    tyres or chains.
ru:
  name: Ингурская плотина и Джварское водохранилище
  short: >-
    Вторая по высоте бетонная арочная плотина в мире: 271,5 метра изогнутого бетона на пути в Сванетию,
    а за ней — длинное озеро ледниковой воды.
  body: >-
    **Тонкая бетонная дуга высотой 271,5 метра запирает ущелье Ингури, и на миг кажется, что дорога в
    Сванетию бежит по краю гигантской чаши.** Это вторая по высоте бетонная арочная плотина в мире, и
    выглядит она соответственно: бледная скорлупа, втиснутая между двумя каменными стенами, а под ней
    такая пропасть, что у парапета потеют ладони.


    История начинается с отпуска. Никита Хрущёв сперва хотел поставить свою великую плотину на Бзыби,
    рядом с любимым курортом в Пицунде, пока специалисты не предупредили, что она приведёт к размыву пицундских
    пляжей. Проект перенесли на Ингури. Работы начались в 1961 году; турбины впервые, временно, закрутились
    в 1978-м, а достроили плотину в 1987 году.


    Потом страна раскололась. Плотина стоит на подконтрольной Грузии земле, чуть севернее Джвари, а электростанция,
    которую она питает, — в Гальском районе Абхазии. По соглашению 1992 года электроэнергию делят — примерно
    60 процентов Грузии, 40 Абхазии, — и это одна из немногих вещей, которые по-прежнему работают через
    линию прекращения огня. В 1994 году инженеры канадской компании «Гидро-Квебек» нашли сооружение «в
    редкостно запущенном состоянии»; на ремонт ушло около 116 миллионов евро международных кредитов. В
    2015 году плотину объявили памятником культурного наследия.


    За ней Джварское водохранилище наполняет долину молочной зелёно-голубой талой водой ледников; его
    уровень поднимается и опускается вместе с сезонами и запросами энергосистемы.


    Остановитесь здесь минут на двадцать — и долгое ущелье впереди обретёт смысл: перед вами сила той
    самой реки, вдоль которой вы поедете до самой Местии.
  tip: >-
    Двадцати минут, от силы часа, вполне достаточно. Площадка у плотины маленькая, а по дороге в Сванетию
    идут тяжёлые грузовики, поэтому съезжайте с асфальта полностью и осторожно переходите дорогу. Это
    стратегический энергетический объект: дрон не доставайте и будьте готовы, что охрана попросит уйти
    с некоторых смотровых точек, — следуйте указателям на месте. Туалеты, кафе и питьевая вода — в Джвари,
    в нескольких минутах езды назад. Лучший свет — с середины утра до начала второй половины дня, пока
    ущелье не ушло в тень. Уровень водохранилища заметно меняется в течение года, а вместе с ним и вид.
  route: >-
    Около 350 км и 5 часов 10 минут от Тбилиси. Езжайте по трассе E60 на запад мимо Кутаиси и Самтредиа
    до Сенаки и дальше до Зугдиди, затем сверните на северо-восток, на Джвари и Местию. От Зугдиди до
    плотины примерно 30 км — минут сорок — плавного подъёма по долине Ингури по хорошему асфальту. Заправьтесь
    в Зугдиди: за Джвари по пути в Местию заправки быстро редеют. Машины эконом-класса здесь хватает круглый
    год; если зимой едете дальше в Сванетию, позаботьтесь о зимней резине или цепях.
fa:
  name: سد انگوری و آبگیر جواری
  short: >-
    دومین سد قوسی بتنی بلند جهان: ۲۷۱٫۵ متر بتن خمیده در راه سوانتی که دریاچه‌ای دراز از آب یخچال‌ها را
    پشت خود نگه داشته است.
  body: >-
    **قوسی باریک از بتن به بلندی ۲۷۱٫۵ متر تنگهٔ انگوری را بسته است و لحظه‌ای چنین می‌نماید که جادهٔ سوانتی
    بر لبهٔ کاسه‌ای غول‌پیکر پیش می‌رود.** این دومین سد قوسی بتنی بلند جهان است و ظاهرش هم گواه همین است:
    پوسته‌ای رنگ‌پریده که میان دو دیوارهٔ سنگی جا خوش کرده، و پرتگاهی زیر پا که کنار جان‌پناه کف دست را
    خیس عرق می‌کند.


    ماجرا از یک تفرجگاه آغاز می‌شود. نیکیتا خروشچف نخست می‌خواست سد بزرگش را روی رود بزیب، نزدیک استراحتگاه
    محبوبش پیتسوندا، بسازد، تا آنکه کارشناسان هشدار دادند سد ساحل‌های پیتسوندا را فرسایش خواهد داد. پروژه
    به انگوری منتقل شد. کار در ۱۹۶۱ آغاز شد؛ توربین‌ها نخستین بار، به‌طور موقت، در ۱۹۷۸ به گردش درآمدند
    و سد در ۱۹۸۷ به پایان رسید.


    سپس کشور از هم گسست. سد بر خاکی زیر کنترل گرجستان، کمی شمال جواری، ایستاده است، اما نیروگاهی که از
    آن آب می‌گیرد در ناحیهٔ گالی در آبخازیا قرار دارد. بر پایهٔ توافقی در ۱۹۹۲ برق تقسیم می‌شود — حدود
    ۶۰ درصد برای گرجستان و ۴۰ درصد برای آبخازیا — و این از معدود چیزهایی است که هنوز از دو سوی خط آتش‌بس
    کار می‌کند. در ۱۹۹۴ مهندسان شرکت کانادایی هیدرو-کبک سازه را «در وضعی از فرسودگی که کمتر دیده می‌شود»
    یافتند؛ حدود ۱۱۶ میلیون یورو وام بین‌المللی صرف تعمیرش شد. در ۲۰۱۵ سد اثر میراث فرهنگی اعلام شد.


    پشت آن، آبگیر جواری دره را از رنگ سبز-آبی شیری آب ذوب یخچال‌ها پر می‌کند؛ سطح آب با فصل‌ها و نیاز
    شبکهٔ برق بالا و پایین می‌رود.


    بیست دقیقه اینجا بمانید تا تنگهٔ طولانی پیش رو معنا پیدا کند: این نیروی همان رودی است که تا خود مستیا
    در کنارش خواهید راند.
  tip: >-
    بیست دقیقه تا یک ساعت کاملاً بس است. توقفگاه کنار سد کوچک است و کامیون‌های سنگین در این جاده به سوانتی
    رفت‌وآمد می‌کنند، پس خودرو را کاملاً از آسفالت بیرون ببرید و هنگام عبور از جاده مراقب باشید. اینجا
    تأسیسات راهبردی انرژی است: پهپاد را در کوله نگه دارید و انتظار داشته باشید که نگهبانان شما را از برخی
    نقاط دید دور کنند — از تابلوهای محل پیروی کنید. سرویس بهداشتی، کافه و آب آشامیدنی در جواری است، چند
    دقیقه عقب‌تر در همین جاده. بهترین نور از میانهٔ صبح تا اوایل بعدازظهر است، پیش از آنکه تنگه در سایه
    فرو رود. سطح آبگیر در طول سال محسوس تغییر می‌کند، پس منظره با هر فصل دگرگون می‌شود.
  route: >-
    از تفلیس حدود ۳۵۰ کیلومتر و ۵ ساعت و ۱۰ دقیقه راه است. جادهٔ E60 را به سوی غرب بگیرید، از کنار کوتائیسی
    و سامتردیا بگذرید تا سناکی و از آنجا تا زوگدیدی بروید، سپس به سمت شمال‌شرقی، به سوی جواری و مستیا،
    بپیچید. از زوگدیدی تا سد حدود ۳۰ کیلومتر — نزدیک به چهل دقیقه — راه است که با شیبی ملایم در درهٔ انگوری
    و روی آسفالتی خوب بالا می‌رود. در زوگدیدی باک را پر کنید: پس از جواری، در راه مستیا پمپ‌بنزین‌ها به‌سرعت
    کم می‌شوند. خودروی اکونومی در تمام سال کاملاً کافی است؛ اگر زمستان به سوی سوانتی ادامه می‌دهید، لاستیک
    زمستانی یا زنجیر چرخ همراه داشته باشید.
he:
  name: סכר אנגורי ומאגר ג'וארי
  short: >-
    סכר הקשת מבטון השני בגובהו בעולם: 271.5 מטרים של בטון מעוקל בדרך לסוואנטי, העוצרים מאחוריהם אגם ארוך
    של מי קרחונים.
  body: >-
    **קשת בטון דקה בגובה 271.5 מטרים חוסמת את ערוץ האנגורי, ולרגע נדמה שהדרך לסוואנטי עוברת על שפתה של
    קערה ענקית.** זהו סכר הקשת מבטון השני בגובהו בעולם, וזה ניכר בו: קליפה חיוורת תקועה בין שני קירות
    סלע, ומתחתיה תהום שגורמת לכפות הידיים להזיע ליד המעקה.


    הסיפור מתחיל בחופשה. ניקיטה חרושצ'וב רצה תחילה להקים את הסכר הגדול שלו על נהר הבזיב, ליד אתר הנופש
    האהוב עליו בפיצונדה, עד שמומחים הזהירו שהסכר יגרום לסחיפת חופי פיצונדה. הפרויקט עבר לאנגורי. העבודות
    החלו ב-1961; הטורבינות הסתובבו לראשונה, באופן זמני, ב-1978, והסכר הושלם ב-1987.


    ואז המדינה התפרקה. הסכר עומד על שטח שבשליטת גאורגיה, מעט צפונית לג'וארי, אך תחנת הכוח שהוא מזין נמצאת
    במחוז גלי שבאבחזיה. לפי הסכם מ-1992 החשמל מתחלק – כ-60 אחוז לגאורגיה ו-40 לאבחזיה – וזה אחד הדברים
    המעטים שעדיין עובדים מעבר לקו הפסקת האש. ב-1994 מצאו מהנדסים מחברת הידרו-קוויבק הקנדית את המבנה "במצב
    נדיר של הזנחה"; כ-116 מיליון אירו בהלוואות בינלאומיות הושקעו בשיקומו. ב-2015 הוכרז הסכר כאתר מורשת
    תרבות.


    מאחוריו ממלא מאגר ג'וארי את העמק בירוק-תכלת חלבי של מי קרחונים מופשרים; מפלסו עולה ויורד עם העונות
    ועם צורכי רשת החשמל.


    עצרו כאן לעשרים דקות, והערוץ הארוך שלפניכם יתחיל להיות מובן: זה כוחו של הנהר שלאורכו תיסעו כל הדרך
    עד מסטיה.
  tip: >-
    עשרים דקות עד שעה בהחלט מספיקות. מפרץ החניה ליד הסכר קטן, ובכביש נוסעות משאיות כבדות לסוואנטי, אז
    ירדו לגמרי מהאספלט והיזהרו בחציית הכביש. זהו מתקן אנרגיה אסטרטגי: השאירו את הרחפן ארוז, וצפו לכך שהשומרים
    ירחיקו אתכם מחלק מנקודות התצפית – פעלו לפי השלטים במקום. שירותים, בתי קפה ומי שתייה יש בג'וארי, כמה
    דקות נסיעה אחורה בכביש. האור הטוב ביותר הוא מאמצע הבוקר ועד תחילת אחר הצהריים, לפני שהערוץ שוקע בצל.
    מפלס המאגר משתנה במידה ניכרת במהלך השנה, כך שהנוף מתחלף עם העונות.
  route: >-
    כ-350 ק"מ ו-5 שעות ו-10 דקות מטביליסי. סעו מערבה בכביש E60, על פני קוטאיסי וסמטרדיה עד סנאקי והלאה
    עד זוגדידי, ואז פנו צפון-מזרחה לכיוון ג'וארי ומסטיה. מזוגדידי זה כ-30 ק"מ – ארבעים דקות בערך – עד
    הסכר, בעלייה מתונה במעלה עמק האנגורי על אספלט טוב. מלאו את המכל בזוגדידי: אחרי ג'וארי תחנות הדלק מתדלדלות
    במהירות בדרך למסטיה. רכב מקטגוריית אקונומי מספיק כאן לגמרי כל השנה; אם אתם ממשיכים לסוואנטי בחורף,
    ודאו שיש לכם צמיגי חורף או שרשראות.
ar:
  name: سد إنغوري وخزان جفاري
  short: >-
    ثاني أعلى سد قوسي خرساني في العالم: 271.5 مترًا من الخرسانة المقوّسة على طريق سفانيتي، تحبس خلفها
    بحيرة طويلة من مياه الأنهار الجليدية.
  body: >-
    **قوسٌ رقيق من الخرسانة ارتفاعه 271.5 مترًا يسدّ مضيق إنغوري، فيبدو لبرهة أن طريق سفانيتي يمضي على
    حافة وعاء عملاق.** إنه ثاني أعلى سد قوسي خرساني في العالم، ومظهره يشي بذلك: قشرة شاحبة محشورة بين
    جدارين من الصخر، وتحتها هوّة تتعرّق لها الكفّان عند الحاجز.


    تبدأ الحكاية بعطلة. أراد نيكيتا خروتشوف أولًا أن يقيم سدّه العظيم على نهر بزيب، قرب منتجعه المفضل
    في بيتسوندا، إلى أن حذّر الخبراء من أنه سيؤدي إلى تآكل شواطئ بيتسوندا. فانتقل المشروع إلى إنغوري.
    بدأ العمل عام 1961، ودارت التوربينات لأول مرة، مؤقتًا، عام 1978، واكتمل السد عام 1987.


    ثم تصدّعت البلاد. يقف السد على أرض تسيطر عليها جورجيا، شمال جفاري مباشرة، لكن محطة الكهرباء التي يغذّيها
    تقع في مقاطعة غالي في أبخازيا. وبموجب اتفاق عام 1992 تُقتسم الكهرباء — نحو 60 في المئة لجورجيا و40
    لأبخازيا — وهو من الأشياء القليلة التي ما زالت تعمل عبر خط وقف إطلاق النار. في عام 1994 وجد مهندسون
    من شركة «هيدرو-كيبيك» الكندية المنشأةَ «في حالة نادرة من التداعي»، فأُنفق على إصلاحها نحو 116 مليون
    يورو من القروض الدولية. وفي عام 2015 أُعلن السد معلمًا من معالم التراث الثقافي.


    خلفه يملأ خزان جفاري الوادي بلون أخضر مزرقّ حليبيّ هو لون مياه ذوبان الأنهار الجليدية، ويرتفع منسوبه
    وينخفض مع الفصول ومع حاجة شبكة الكهرباء.


    توقّف هنا عشرين دقيقة، وسيبدأ المضيق الطويل أمامك في الإفصاح عن معناه: هذه قوة النهر الذي ستسير بمحاذاته
    حتى ميستيا.
  tip: >-
    تكفي عشرون دقيقة إلى ساعة. موقف السيارات بجانب السد صغير، والطريق تسلكه شاحنات ثقيلة متجهة إلى سفانيتي،
    فابتعد بسيارتك تمامًا عن الإسفلت واحذر عند عبور الطريق. هذا موقع طاقة استراتيجي: أبقِ طائرتك المسيّرة
    في حقيبتها، وتوقّع أن يصرفك الحراس عن بعض نقاط المشاهدة، والتزم باللافتات في المكان. المراحيض والمقاهي
    ومياه الشرب في جفاري، على بُعد دقائق قليلة عائدًا على الطريق. أفضل ضوء من منتصف الصباح حتى أول الظهيرة،
    قبل أن يغرق المضيق في الظل. يتبدّل منسوب الخزان تبدّلًا ملحوظًا على مدار السنة، فيتغير المشهد مع كل
    فصل.
  route: >-
    نحو 350 كم و5 ساعات و10 دقائق من تبليسي. اسلك الطريق E60 غربًا مرورًا بكوتايسي وسامتريديا حتى سيناكي
    ثم إلى زوغديدي، ومنها انعطف باتجاه الشمال الشرقي نحو جفاري وميستيا. من زوغديدي إلى السد نحو 30 كم
    — قرابة أربعين دقيقة — في صعود لطيف عبر وادي إنغوري على إسفلت جيد. املأ خزان الوقود في زوغديدي، فبعد
    جفاري تتناقص المحطات سريعًا على طريق ميستيا. السيارة الاقتصادية كافية تمامًا هنا طوال العام؛ وإن كنت
    ستواصل إلى سفانيتي شتاءً فتأكد من وجود إطارات شتوية أو سلاسل.
