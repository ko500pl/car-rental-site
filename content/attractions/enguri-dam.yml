ka:
  name: ენგურის კაშხალი და ჯვრის წყალსაცავი
  short: 271 მეტრის სიმაღლის თაღოვანი კაშხალი მესტიის გზაზე და მის უკან გაწოლილი ფირუზისფერი წყალსაცავი.
  body: >-
    ენგურის კაშხალი ზუგდიდიდან მესტიისკენ მიმავალი გზის პირველი დიდი შთაბეჭდილებაა. მისი სიმაღლე დაახლოებით
    271 მეტრია, რაც მას მსოფლიოს ყველაზე მაღალ თაღოვან კაშხლებს შორის აყენებს. მშენებლობა 1960-იან წლებში
    დაიწყო და საბოლოო სახე მან 1980-იანებში მიიღო; დღემდე ეს საქართველოს ენერგოსისტემის ერთ-ერთი ყველაზე
    მნიშვნელოვანი ობიექტია.


    ვიზუალურად ორი სრულიად განსხვავებული სანახავია. ერთი მხრივ, თავად კონსტრუქცია — თხელი, მოხრილი ბეტონის
    კედელი, რომელიც ვიწრო კანიონს ორ კლდეს შორის კეტავს; ქვემოთ გახედვა შთამბეჭდავია. მეორე მხრივ, ჯვრის
    წყალსაცავი — გრძელი, ტოტებიანი ტბა კაშხლის ზემოთ, რომლის წყალი კირქვის სილის გამო ზაფხულში ინტენსიურად
    ფირუზისფერია.


    პრაქტიკულად რას ნახავთ:


    - **გადასახედი კაშხლის თხემზე** — მთავარი კადრი, გზიდან პირდაპირ ხელმისაწვდომი

    - **წყალსაცავის სანაპირო გზა** მესტიის მიმართულებით, სადაც ხედი მუდმივად იცვლება

    - **ჯვრის დასახლება** მცირე კაფეებითა და გასამართი სადგურით


    ეს არ არის ობიექტი, სადაც ნახევარ დღეს ატარებთ — ჩვეულებრივ საკმარისია 30–60 წუთი. სამაგიეროდ, სვანეთისკენ
    მიმავალ გზაზე ეს ბუნებრივი და ლოგიკური პირველი გაჩერებაა: სწორედ აქედან იწყება ხეობა, რომელშიც შემდეგი
    სამი საათი გექნებათ გასავლელი, და მასშტაბი მაშინვე ცხადი ხდება. წყალსაცავის დონე სეზონურად იცვლება,
    ამიტომ ერთი და იგივე ხედი გაზაფხულსა და შემოდგომაზე საგრძნობლად განსხვავებულია.
  tip: >-
    საუკეთესო შუქი დილიდან შუადღემდეა, როცა მზე კანიონში ჯერ კიდევ აღწევს. კაშხლის თხემზე გაჩერება ვიწრო
    ადგილას გიწევთ — მანქანა მთლიანად გაიყვანეთ სავალი ნაწილიდან და ავარიული სიგნალი ჩართეთ, რადგან აქ
    დატვირთული ტრანზიტული მოძრაობაა. ობიექტი სტრატეგიულია, ამიტომ დრონით ფრენა და ზოგი რაკურსი შეიძლება
    აკრძალული იყოს — ადგილზე მითითებებს დაუკვირდით. სასმელი წყალი და საპირფარეშო ჯვრის დასახლებაშია, კაშხალთან
    პირდაპირ არა.
  route: >-
    თბილისიდან დაახლოებით 350 კმ და ხუთი საათია. E60-ით მიდიხართ ქუთაისისა და სამტრედიის გავლით ზუგდიდამდე,
    შემდეგ ჩრდილო-აღმოსავლეთით უხვევთ ჯვრის მიმართულებით — ზუგდიდიდან კაშხალამდე მხოლოდ 30 კმ-ია, დაახლოებით
    40 წუთი. გზა ბოლომდე ასფალტია და ეკონომ კლასის ავტომობილს სრულიად ეყოფა. საწვავი ზუგდიდში აავსეთ —
    ეს ბოლო ადგილია, სადაც არჩევანი ნორმალურია. თუ სვანეთში მიდიხართ, კაშხალი გზაზეა და გვერდის ავლა არ
    დაგჭირდებათ.
en:
  name: Enguri Dam and Jvari Reservoir
  short: A 271-metre arch dam on the road to Mestia, with a long turquoise reservoir stretching behind
    it.
  body: >-
    The Enguri dam is the first genuinely large thing you meet on the road from Zugdidi up to Mestia.
    It stands roughly 271 metres high, which places it among the tallest arch dams in the world. Construction
    began in the 1960s and the structure reached its final form in the 1980s; it remains one of the most
    important elements of Georgia's power system.


    There are two quite different things to look at. First, the structure itself — a thin curved concrete
    wall plugging a narrow gorge between two rock faces, with a genuinely vertiginous drop below. Second,
    the Jvari reservoir: a long, branching lake behind the dam whose water turns intensely turquoise in
    summer because of suspended limestone silt.


    In practice you will see:


    - **The viewpoint on the dam crest** — the main shot, reachable straight from the road

    - **The shore road toward Mestia**, where the view over the water keeps changing

    - **Jvari settlement** with small cafes and a fuel station


    This is not a half-day destination; thirty to sixty minutes is normal. But as a first stop on the
    long drive into Svaneti it is natural and well placed, and it gives a sense of the scale of the gorge
    you are about to spend three hours driving through.
  tip: >-
    The best light is from morning to early afternoon, while the sun still reaches into the gorge. Stopping
    on the dam crest means parking in a tight spot: pull fully off the carriageway and put your hazards
    on, because this is a busy transit road with trucks. The dam is a strategic facility, so drone flights
    and some viewpoints may be restricted — read the signs on site rather than assuming. Drinking water
    and toilets are in Jvari settlement, not at the dam itself.
  route: >-
    It is about 350 km and five hours from Tbilisi. Take the E60 west through Kutaisi and Samtredia to
    Zugdidi, then turn north-east toward Jvari: from Zugdidi to the dam is only 30 km, roughly forty minutes.
    The road is paved throughout and an economy car is entirely sufficient. Fill up in Zugdidi, the last
    place with a proper choice of stations before the mountains. If you are heading to Mestia the dam
    is directly on your route, so no detour is needed — simply build in a short stop.
ru:
  name: Ингурская ГЭС и Джварское водохранилище
  short: Арочная плотина высотой 271 метр на дороге в Местиа и вытянутое бирюзовое водохранилище за ней.
  body: >-
    Ингурская плотина — первое по-настоящему крупное сооружение на дороге из Зугдиди в сторону Местиа.
    Её высота составляет около 271 метра, что ставит её в ряд самых высоких арочных плотин мира. Строительство
    началось в 1960-х, окончательный вид сооружение приобрело в 1980-х; до сих пор это один из ключевых
    объектов энергосистемы Грузии.


    Смотреть здесь стоит на две совершенно разные вещи. Первая — сама конструкция: тонкая изогнутая бетонная
    стена, перекрывающая узкое ущелье между двумя скалами, с внушительным обрывом вниз. Вторая — Джварское
    водохранилище: длинное разветвлённое озеро выше плотины, вода которого летом становится насыщенно-бирюзовой
    из-за взвеси известняка.


    Что вы увидите на практике:


    - **Смотровую на гребне плотины** — главный кадр, доступный прямо с дороги

    - **Прибрежную дорогу в сторону Местиа**, где вид на воду постоянно меняется

    - **Посёлок Джвари** с небольшими кафе и заправкой


    Это не место на полдня: обычно хватает тридцати-шестидесяти минут. Зато как первая остановка на длинном
    пути в Сванетию плотина расположена идеально и сразу задаёт масштаб ущелья, по которому вам предстоит
    ехать ещё три часа.
  tip: >-
    Лучший свет — с утра до начала дня, пока солнце ещё достаёт до дна ущелья. Остановка на гребне плотины
    означает парковку в тесном месте: полностью съезжайте с проезжей части и включайте аварийку, здесь
    плотное транзитное движение с грузовиками. Объект стратегический, поэтому полёты дронов и отдельные
    ракурсы могут быть ограничены — читайте таблички на месте. Питьевая вода и туалеты есть в посёлке
    Джвари, у самой плотины их нет.
  route: >-
    От Тбилиси около 350 км и пять часов. По трассе E60 на запад через Кутаиси и Самтредиа до Зугдиди,
    затем поворот на северо-восток в сторону Джвари: от Зугдиди до плотины всего 30 км, примерно сорок
    минут. Дорога асфальтирована на всём протяжении, машины эконом-класса полностью достаточно. Заправляйтесь
    в Зугдиди — это последнее место с нормальным выбором станций перед горами. Если вы едете в Местиа,
    плотина лежит прямо на маршруте, крюк делать не нужно, достаточно заложить короткую остановку.
fa:
  name: سد انگوری و آبگیر جواری
  short: سدی قوسی به بلندی 271 متر در راه مستیا، با آبگیری فیروزه‌ای و کشیده در پشت آن.
  body: >-
    سد انگوری نخستین چیز واقعاً بزرگی است که در جادهٔ زوگدیدی به مستیا با آن روبه‌رو می‌شوید. بلندی آن
    حدود 271 متر است و همین آن را در شمار بلندترین سدهای قوسی جهان می‌گذارد. ساخت آن در دههٔ 1960 آغاز
    شد و سازه در دههٔ 1980 شکل نهایی خود را گرفت؛ هنوز یکی از مهم‌ترین اجزای شبکهٔ برق گرجستان است.


    دو چیز کاملاً متفاوت برای دیدن هست. نخست خود سازه — دیواره‌ای نازک و منحنی از بتن که تنگه‌ای باریک
    را میان دو دیوارهٔ سنگی می‌بندد، با سقوطی به‌راستی سرگیجه‌آور در پایین. دوم آبگیر جواری: دریاچه‌ای
    دراز و شاخه‌شاخه پشت سد که آبش در تابستان به‌سبب گِل آهکی معلق فیروزه‌ای پررنگ می‌شود. در عمل نقطهٔ
    دید روی تاج سد را می‌بینید که تصویر اصلی است و مستقیم از جاده به آن می‌رسید، جادهٔ ساحلی به سوی مستیا
    را که منظرهٔ روی آب مدام عوض می‌شود، و آبادی جواری را با چند کافهٔ کوچک و یک پمپ‌بنزین.


    این مقصد نیم‌روزه نیست؛ سی تا شصت دقیقه معمول است. اما به‌عنوان نخستین توقف در رانندگی طولانی به سوی
    سوانتی طبیعی و خوش‌جا است و حسی از مقیاس همان تنگه‌ای می‌دهد که قرار است سه ساعت در آن برانید.
  tip: >-
    بهترین نور از صبح تا اوایل بعدازظهر است، تا وقتی خورشید هنوز به داخل تنگه می‌رسد. توقف روی تاج سد
    یعنی پارک در جای تنگ: کاملاً از سواره‌رو بیرون بروید و فلاشر بزنید، چون این جادهٔ ترانزیتی شلوغی با
    کامیون است. سد تأسیساتی راهبردی است، بنابراین پرواز پهپاد و بعضی نقاط دید ممکن است محدود باشد — به
    جای حدس زدن، تابلوهای محل را بخوانید. آب آشامیدنی و سرویس بهداشتی در آبادی جواری است، نه کنار خود
    سد.
  route: >-
    از تفلیس حدود 350 کیلومتر و پنج ساعت راه است. با E60 به سمت غرب از کوتایسی و سامتردیا تا زوگدیدی بروید
    و بعد به شمال‌شرق به سوی جواری بپیچید: از زوگدیدی تا سد فقط 30 کیلومتر است، تقریباً چهل دقیقه. جاده
    در تمام طول آسفالت است و خودروی اقتصادی کاملاً کافی. باک را در زوگدیدی پر کنید، آخرین جایی که پیش
    از کوهستان انتخاب درستی از پمپ‌بنزین دارد. اگر مقصدتان مستیا است، سد درست سر راه شماست و انحراف مسیر
    لازم نیست — فقط یک توقف کوتاه در برنامه بگنجانید.
he:
  name: סכר אנגורי ומאגר ג'וארי
  short: סכר קשתי בגובה 271 מטר בדרך למסטיה, ומאחוריו מאגר טורקיז ארוך.
  body: >-
    סכר אנגורי הוא הדבר הגדול באמת הראשון שפוגשים בכביש מזוגדידי במעלה למסטיה. גובהו כ-271 מטרים, מה שמציב
    אותו בין הסכרים הקשתיים הגבוהים בעולם. הבנייה החלה בשנות ה-1960 והמבנה קיבל את צורתו הסופית בשנות
    ה-1980; הוא נותר אחד המרכיבים החשובים ביותר במערך החשמל של גאורגיה.


    יש כאן שני דברים שונים לגמרי להסתכל עליהם. ראשית המבנה עצמו — קיר בטון דק ומעוגל הפוקק ערוץ צר בין
    שני קירות סלע, ומתחתיו צניחה מסחררת באמת. שנית מאגר ג'וארי: אגם ארוך ומסועף מאחורי הסכר, שמימיו נעשים
    בקיץ טורקיז עז בגלל סחף גיר תלוי. בפועל תראו את נקודת התצפית על כתר הסכר, שהיא הצילום המרכזי ומגיעים
    אליה ישר מהכביש; את כביש הגדה לכיוון מסטיה, שבו הנוף על המים משתנה כל הזמן; ואת היישוב ג'וארי עם כמה
    בתי קפה קטנים ותחנת דלק.


    זה אינו יעד של חצי יום; שלושים עד שישים דקות הן הנורמה. אבל כעצירה ראשונה בנסיעה הארוכה אל סוואנטי
    הוא טבעי וממוקם היטב, והוא נותן תחושה של קנה המידה של אותו ערוץ שבו אתם עומדים לנסוע שלוש שעות.
  tip: >-
    האור הטוב ביותר הוא מהבוקר ועד שעות אחר הצהריים המוקדמות, כל עוד השמש עדיין מגיעה אל תוך הערוץ. עצירה
    על כתר הסכר פירושה חניה במקום צר: רדו לגמרי מהכביש והדליקו אורות חירום, כי זהו ציר תנועה עמוס עם משאיות.
    הסכר הוא מתקן אסטרטגי, ולכן הטסת רחפנים וחלק מנקודות התצפית עשויות להיות מוגבלות — קראו את השילוט
    במקום במקום להניח. מי שתייה ושירותים יש ביישוב ג'וארי, לא ליד הסכר עצמו.
  route: >-
    מטביליסי מדובר בכ-350 ק״מ וחמש שעות. סעו מערבה בכביש E60 דרך קוטאיסי וסמטרדיה עד זוגדידי, ומשם פנו
    צפונה-מזרחה לכיוון ג'וארי: מזוגדידי אל הסכר יש רק 30 ק״מ, כארבעים דקות. הכביש סלול לכל אורכו ורכב
    חסכוני מספיק לחלוטין. תדלקו בזוגדידי, המקום האחרון עם בחירה אמיתית של תחנות לפני ההרים. אם אתם ממשיכים
    למסטיה, הסכר נמצא ישירות על המסלול שלכם ואין צורך בעיקוף — פשוט שלבו עצירה קצרה.
ar:
  name: سد إنغوري وخزان جفاري
  short: سد قوسي بارتفاع 271 متراً على الطريق إلى ميستيا، يمتد خلفه خزان فيروزي طويل.
  body: >-
    سد إنغوري هو أول شيء ضخم فعلاً تصادفه على الطريق الصاعد من زوغديدي إلى ميستيا. يبلغ ارتفاعه نحو 271
    متراً، وهو ما يضعه بين أعلى السدود القوسية في العالم. بدأ البناء في عقد 1960 وبلغت المنشأة شكلها النهائي
    في عقد 1980؛ ولا تزال من أهم عناصر منظومة الطاقة في جورجيا.


    وهناك أمران مختلفان تماماً للنظر إليهما. أولهما المنشأة نفسها — جدار خرساني رفيع منحنٍ يسد مضيقاً
    ضيقاً بين وجهي صخر، وتحته هبوط يصيب بالدوار فعلاً. وثانيهما خزان جفاري: بحيرة طويلة متشعبة خلف السد،
    يتحول ماؤها في الصيف إلى فيروزي كثيف بسبب الغرين الكلسي العالق. وعملياً سترى مطل قمة السد، وهو اللقطة
    الرئيسية ويُوصل إليه من الطريق مباشرة؛ وطريق الضفة نحو ميستيا حيث يتبدل المنظر على الماء باستمرار؛
    وبلدة جفاري بمقاهيها الصغيرة ومحطة وقودها.


    وهذه ليست وجهة نصف يوم؛ فثلاثون إلى ستين دقيقة هي المعتاد. لكنها كمحطة أولى في الطريق الطويل إلى سفانيتي
    طبيعية وحسنة الموقع، وتمنحك إحساساً بحجم المضيق الذي ستقضي في قيادته ثلاث ساعات.
  tip: >-
    أفضل ضوء من الصباح حتى بداية بعد الظهر، ما دامت الشمس تصل إلى داخل المضيق. والتوقف على قمة السد يعني
    الوقوف في مكان ضيق: انزل بالسيارة كلياً عن مسار السير وشغّل أضواء التحذير، فهذا محور عبور مزدحم بالشاحنات.
    والسد منشأة استراتيجية، لذا قد تكون تحليقات الطائرات المسيّرة وبعض المطلات مقيدة — اقرأ اللافتات في
    الموقع بدل الافتراض. ومياه الشرب ودورات المياه في بلدة جفاري لا عند السد نفسه.
  route: >-
    من تبليسي المسافة نحو 350 كم وخمس ساعات. اسلك E60 غرباً عبر كوتايسي وسامتريديا إلى زوغديدي، ثم انعطف
    شمالاً شرقاً نحو جفاري: فمن زوغديدي إلى السد 30 كم فقط، نحو أربعين دقيقة. والطريق معبّد على امتداده
    وسيارة اقتصادية تكفي تماماً. املأ الخزان في زوغديدي، آخر مكان فيه خيارات حقيقية من المحطات قبل الجبال.
    وإن كنت متجهاً إلى ميستيا فالسد على مسارك مباشرة ولا يلزم أي التفاف — اكتفِ بإدراج وقفة قصيرة.
