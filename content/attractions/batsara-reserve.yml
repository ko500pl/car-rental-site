ka:
  name: ბაწარის ნაკრძალი
  short: მსოფლიოში ყველაზე დიდი ბუნებრივი უთხოვრის კორომი, ახმეტის ჩრდილოეთით, ვიწრო მდინარის ხეობაში
    დამალული.
  body: >-
    **ბაწარაში მსოფლიოში ყველაზე დიდი ბუნებრივი უთხოვრის კორომია** — და ეს არ არის ადგილობრივი გაზვიადება,
    არამედ ბოტანიკოსების მიერ არაერთხელ დადასტურებული ფაქტი. ნაკრძალი ახმეტიდან ჩრდილოეთით, მდინარე ბაწარის
    ვიწრო ხეობაშია და 1935 წლიდან იცავენ.


    უთხოვარი (Taxus baccata) ნელა იზრდება და დიდხანს ცოცხლობს. აქ ზოგიერთი ხე 1500-2000 წლისაა, სიმაღლით
    25-30 მეტრს აღწევს და ღეროს დიამეტრი ორ მეტრს უახლოვდება. ევროპაში ასეთი ზომის უთხოვრები თითქმის აღარსად
    შემორჩა — მას საუკუნეების განმავლობაში ჭრიდნენ მშვილდისა და ავეჯისთვის.


    კორომში შესვლა უცნაური შეგრძნებაა. უთხოვარი მუქ, თითქმის შავ ჩრდილს ქმნის; ქვეშ თითქმის არაფერი ხარობს,
    ნიადაგი წიწვითაა დაფარული და ხმა ისრუტება. მზიან დღესაც შიგნით ბინდია.


    ხეობაში სხვა რამაც არის: წაბლი, რცხილა, კავკასიური ჯილდო, გვიმრები და ბრჭყვიალა ხავსი. ცხოველებიდან
    — შველი, ჯიხვი მაღლა, დათვი (იშვიათად ჩანს), ხოლო ფრინველებიდან შავი ყანჩა და არწივები.


    ეს მკაცრი ნაკრძალია და არა პარკი: ბილიკები მინიმალურია, ინფრასტრუქტურა თითქმის არ არსებობს, თავისუფლად
    სიარული აკრძალულია. შესვლა მხოლოდ ნებართვითა და რეინჯერის თანხლებით შეიძლება. სწორედ ეს ხსნის, რატომ
    დარჩა კორომი ხელუხლებელი.
  tip: >-
    ნებართვა წინასწარ, დაცული ტერიტორიების ადმინისტრაციაში ან ახმეტის ოფისში უნდა აიღო — უბრალოდ მისვლა
    არ გამოდის. მარშრუტი ხეობის სიღრმეში 8-10 კმ-ია და მთელ დღეს მოითხოვს; ბილიკი მდინარის კალაპოტს მიჰყვება
    და რამდენჯერმე ფონზე გადადის, ამიტომ სველი ფეხი გარანტირებულია. ტკიპები აპრილიდან ივლისამდე აქტიურია.
    მობილური კავშირი ხეობაში არ არის. მარტო არ შეხვიდე.
  route: >-
    თბილისიდან გომბორის უღელტეხილით თელავამდე, შემდეგ დასავლეთით ახმეტამდე — 125 კმ ასფალტი. ახმეტიდან
    ჩრდილოეთით ხეობის შესასვლელამდე კიდევ 15 კმ, ბოლო მონაკვეთი ხრეშისა და მიწისაა და მდინარის ფონებს
    კვეთს. სულ 140 კმ, დაახლოებით ორი საათი და ორმოცდაათი წუთი. მაღალი კლირენსი აუცილებელია, წვიმის შემდეგ
    კი გზა შეიძლება საერთოდ არ იყოს გავლადი. საწვავი თელავსა და ახმეტაში.
en:
  name: Batsara Reserve
  short: The largest natural yew grove in the world, hidden in a narrow river gorge north of Akhmeta.
  body: >-
    **Batsara holds the largest natural yew grove on earth,** and that is not a local boast but a claim
    confirmed by botanists more than once. The reserve lies north of Akhmeta in the tight gorge of the
    Batsara river and has been protected since 1935.


    Yew, Taxus baccata, grows slowly and lives a very long time. Some trees here are between 1,500 and
    2,000 years old, reach 25 to 30 metres and approach two metres in trunk diameter. Almost nowhere in
    Europe survives at that scale, because yew was cut for centuries to make bows and furniture and was
    never given time to recover.


    Walking into the grove is genuinely strange. Yew casts a dark, almost black shade; nothing much grows
    underneath, the ground is a mat of needles, and sound is absorbed rather than reflected. Even on a
    bright day the interior is dim, and the temperature drops a few degrees as you step in.


    The gorge holds more than yew: sweet chestnut, hornbeam, Caucasian lime, ferns and thick moss on every
    fallen trunk. Roe deer are common, bear tracks turn up regularly, black stork nest along the water,
    and eagles work the ridges above.


    This is a strict nature reserve rather than a park. Paths are minimal, there is essentially no infrastructure,
    and walking freely is not permitted. Entry is only with a permit and in the company of a ranger. That
    restriction is exactly why the grove is still intact, and it is worth accepting rather than resenting.


    Numbers give some sense of what is being protected. The strict reserve covers roughly three thousand
    hectares, of which the yew occupies several hundred, and a single mature tree may carry well over
    a thousand growth rings. When a storm brings one down it is recorded as an event, not written off
    as ordinary loss.
  tip: >-
    Arrange the permit in advance through the protected areas administration or the office in Akhmeta;
    simply arriving does not work. The route into the gorge runs 8 to 10 km each way and fills a full
    day. The path follows the riverbed and crosses it several times, so wet feet are guaranteed and boots
    that drain are better than boots that keep water out. Ticks are active from April to July. There is
    no mobile signal in the gorge. Do not go in alone.
  route: >-
    From Tbilisi drive over the Gombori Pass to Telavi and then west to Akhmeta — 125 km of asphalt. From
    Akhmeta head north about 15 km to the mouth of the gorge; the last section is gravel and dirt and
    crosses the river at several fords. Total 140 km, about two hours fifty. High clearance is necessary,
    and after heavy rain the track may not be passable at all, so check locally before setting out. Fuel
    is available in Telavi and Akhmeta.
ru:
  name: Заповедник Бацара
  short: Крупнейшая в мире естественная тисовая роща, укрытая в узком речном ущелье севернее Ахметы.
  body: >-
    **В Бацаре растёт крупнейшая на земле естественная тисовая роща,** и это не местное преувеличение,
    а факт, не раз подтверждённый ботаниками. Заповедник лежит к северу от Ахметы, в тесном ущелье реки
    Бацара, и охраняется с 1935 года.


    Тис ягодный растёт медленно и живёт очень долго. Отдельным деревьям здесь от 1500 до 2000 лет, они
    достигают 25-30 метров, а диаметр ствола подходит к двум метрам. В Европе почти нигде не сохранилось
    тиса такого размера: его веками рубили на луки и мебель, не давая восстановиться.


    Войти в рощу — по-настоящему странное ощущение. Тис даёт тёмную, почти чёрную тень; внизу почти ничего
    не растёт, земля укрыта хвойным войлоком, звук поглощается, а не отражается. Даже в ясный день внутри
    сумерки, а температура на входе падает на несколько градусов.


    В ущелье есть и другое: каштан, граб, кавказская липа, папоротники и толстый мох на каждом упавшем
    стволе. Обычна косуля, регулярно попадаются следы медведя, у воды гнездится чёрный аист, над гребнями
    работают орлы.


    Это строгий заповедник, а не парк. Троп минимум, инфраструктуры практически нет, свободное хождение
    запрещено. Вход только по разрешению и в сопровождении рейнджера. Именно это ограничение и сохранило
    рощу нетронутой, так что принять его проще, чем оспаривать.
  tip: >-
    Разрешение оформляйте заранее через администрацию заповедных территорий или офис в Ахмете: приехать
    наудачу не получится. Маршрут вглубь ущелья — 8-10 км в одну сторону, это полный день. Тропа идёт
    по руслу и несколько раз переходит реку вброд, так что мокрые ноги гарантированы, и обувь лучше та,
    из которой вода вытекает, а не та, что её держит. Клещи активны с апреля по июль. Связи в ущелье нет.
    Одному сюда не ходить.
  route: >-
    Из Тбилиси через Гомборский перевал в Телави, затем на запад до Ахметы — 125 км асфальта. От Ахметы
    на север около 15 км до входа в ущелье; последний отрезок гравийно-грунтовый и пересекает реку в нескольких
    бродах. Всего 140 км, примерно два часа пятьдесят минут. Высокий клиренс обязателен, а после сильного
    дождя дорога может стать непроезжей вовсе — уточняйте на месте. Заправки есть в Телави и Ахмете.
fa:
  name: قرقگاه باتسارا
  short: بزرگ‌ترین بیشهٔ طبیعی سرخدار در جهان، پنهان در تنگه‌ای باریک شمال آخمتا.
  body: >-
    **باتسارا بزرگ‌ترین بیشهٔ طبیعی سرخدار روی زمین را در خود دارد،** و این ادعای محلی نیست بلکه گیاه‌شناسان
    بارها آن را تأیید کرده‌اند. قرقگاه در شمال آخمتا و در تنگهٔ باریک رود باتسارا قرار دارد و از 1935
    حفاظت می‌شود.


    سرخدار کند می‌روید و بسیار دیر می‌میرد. برخی درختان اینجا میان 1500 تا 2000 سال عمر دارند، به 25 تا
    30 متر می‌رسند و قطر تنه‌شان به دو متر نزدیک می‌شود. در اروپا تقریباً هیچ‌جا سرخداری در این ابعاد
    نمانده است، چون قرن‌ها آن را برای ساخت کمان و مبل بریدند و هرگز فرصت بازیابی ندادند.


    ورود به بیشه حس عجیبی دارد. سرخدار سایه‌ای تیره و نزدیک به سیاه می‌اندازد؛ زیر آن چیزی نمی‌روید، زمین
    از سوزن پوشیده است و صدا به‌جای بازتاب جذب می‌شود. حتی در روز روشن، درون بیشه گرگ‌ومیش است و دما با
    ورود چند درجه پایین می‌آید.


    تنگه جز سرخدار چیزهای دیگری هم دارد: شاه‌بلوط، ممرز، نمدار قفقازی، سرخس و خزهٔ ضخیم روی هر تنهٔ افتاده.
    آهوی اروپایی فراوان است، رد خرس مرتب دیده می‌شود، لک‌لک سیاه کنار آب لانه می‌گذارد و عقاب‌ها بر یال‌های
    بالا می‌گردند.


    اینجا قرقگاه سخت‌گیرانه است نه پارک. مسیرها اندک‌اند، تقریباً هیچ زیرساختی نیست و گشتن آزادانه مجاز
    نیست. ورود فقط با مجوز و همراهی جنگلبان ممکن است. همین محدودیت است که بیشه را دست‌نخورده نگه داشته،
    و پذیرفتنش از اعتراض به آن آسان‌تر است.
  tip: >-
    مجوز را از پیش از ادارهٔ مناطق حفاظت‌شده یا دفتر آخمتا بگیرید؛ سرزده رفتن جواب نمی‌دهد. مسیر تا عمق
    تنگه هشت تا ده کیلومتر یک‌طرفه است و یک روز کامل می‌برد. راه بستر رود را دنبال می‌کند و چند بار از
    آن می‌گذرد، پس خیس شدن پا حتمی است و کفشی که آب را بیرون بدهد بهتر از کفشی است که آن را نگه دارد.
    کنه از فروردین تا تیر فعال است. در تنگه آنتن نیست. تنها وارد نشوید.
  route: >-
    از تفلیس از گردنهٔ گومبوری تا تلاوی و سپس به غرب تا آخمتا برانید؛ 125 کیلومتر آسفالت. از آخمتا حدود
    15 کیلومتر به شمال تا دهانهٔ تنگه؛ بخش پایانی شنی و خاکی است و چند بار از گدارهای رود می‌گذرد. جمعاً
    140 کیلومتر و حدود دو ساعت و پنجاه دقیقه. ارتفاع مناسب خودرو ضروری است و پس از باران سنگین ممکن است
    راه اصلاً باز نباشد، پس پیش از حرکت در محل بپرسید. سوخت در تلاوی و آخمتا هست.
he:
  name: שמורת בצארה
  short: חורשת הטקסוס הטבעית הגדולה בעולם, נסתרת בערוץ נהר צר מצפון לאחמטה.
  body: >-
    **בבצארה נמצאת חורשת הטקסוס הטבעית הגדולה בעולם,** וזו אינה התפארות מקומית אלא קביעה שאושרה בידי בוטנאים
    לא פעם. השמורה שוכנת מצפון לאחמטה בערוץ הצר של נהר בצארה ומוגנת מאז 1935.


    הטקסוס גדל לאט וחי זמן רב מאוד. אחדים מן העצים כאן בני 1,500 עד 2,000 שנה, מגיעים ל-25 עד 30 מטרים
    וקוטר גזעם מתקרב לשני מטרים. כמעט בשום מקום באירופה לא שרד טקסוס בסדר גודל כזה, שכן כרתו אותו במשך
    מאות שנים לקשתות ולרהיטים ולא נתנו לו להתאושש.


    הכניסה לחורשה היא חוויה מוזרה באמת. הטקסוס מטיל צל כהה, כמעט שחור; מתחתיו כמעט לא צומח דבר, הקרקע
    מכוסה מחטים, והקול נבלע ולא מוחזר. גם ביום בהיר הפנים אפלולי, והטמפרטורה יורדת בכמה מעלות ברגע הכניסה.


    בערוץ יש עוד: ערמון, גרביל, טיליה קווקזית, שרכים וטחב עבה על כל גזע שנפל. הצבי האירופי מצוי, עקבות
    דוב מופיעות בקביעות, חסידה שחורה מקננת לאורך המים, ועיטים חגים מעל הרכסים.


    זו שמורת טבע קפדנית ולא פארק. השבילים מעטים, אין כמעט תשתית, וההליכה החופשית אסורה. הכניסה רק באישור
    ובליווי פקח. דווקא ההגבלה הזו היא ששמרה על החורשה שלמה, וקל יותר לקבל אותה מלהתווכח איתה.
  tip: >-
    סדרו את האישור מראש דרך רשות השטחים המוגנים או המשרד באחמטה; הגעה ספונטנית לא תעבוד. המסלול אל תוך
    הערוץ הוא 8 עד 10 ק״מ לכיוון וממלא יום שלם. השביל עוקב אחר אפיק הנהר וחוצה אותו כמה פעמים, כך שרגליים
    רטובות מובטחות, ונעליים שמנקזות מים עדיפות על נעליים שאוטמות אותם. קרציות פעילות מאפריל עד יולי. אין
    קליטה סלולרית בערוץ. אל תיכנסו לבד.
  route: >-
    מטביליסי סעו מעל מעבר גומבורי לטלאווי ואז מערבה לאחמטה — 125 ק״מ אספלט. מאחמטה צפונה כ-15 ק״מ עד פתח
    הערוץ; הקטע האחרון חצץ ועפר וחוצה את הנהר בכמה מעברות. בסך הכול 140 ק״מ, כשעתיים וחמישים. מרווח גחון
    גבוה הכרחי, ואחרי גשם כבד ייתכן שהדרך אינה עבירה כלל, אז בררו במקום לפני היציאה. דלק יש בטלאווי ובאחמטה.
ar:
  name: محمية باتسارا
  short: أكبر بستان طقسوس طبيعي في العالم، مختبئ في مضيق نهري ضيق شمال أخميتا.
  body: >-
    **تضم باتسارا أكبر بستان طقسوس طبيعي على وجه الأرض،** وليس هذا افتخاراً محلياً بل أمراً أكده علماء
    النبات أكثر من مرة. تقع المحمية شمال أخميتا في مضيق نهر باتسارا الضيق، وهي محمية منذ عام 1935.


    والطقسوس بطيء النمو طويل العمر جداً. وبعض الأشجار هنا بين 1500 و2000 سنة، وتبلغ خمسة وعشرين إلى ثلاثين
    متراً، ويقارب قطر جذعها مترين. ولم يبقَ في أوروبا تقريباً طقسوس بهذا الحجم، لأنه قُطع قروناً لصنع
    الأقواس والأثاث ولم يُمهل ليتعافى.


    والدخول إلى البستان إحساس غريب فعلاً. يلقي الطقسوس ظلاً داكناً يكاد يكون أسود؛ ولا ينمو تحته شيء يُذكر،
    والأرض بساط من الإبر، والصوت يُمتص ولا يرتد. وحتى في يوم مشمس يظل الداخل معتماً، وتهبط الحرارة درجات
    بمجرد أن تخطو فيه.


    وفي المضيق أكثر من الطقسوس: كستناء وزان وزيزفون قوقازي وسراخس وطحلب كثيف على كل جذع ساقط. والغزال
    الأوروبي شائع، وآثار الدببة تظهر بانتظام، ويعشش اللقلق الأسود على الماء، وتحلق العقبان فوق الحيود.


    وهذه محمية صارمة لا حديقة. المسالك قليلة، ولا بنية تحتية تقريباً، والتجول الحر ممنوع. والدخول لا يكون
    إلا بتصريح وبصحبة حارس. وهذا القيد بالذات هو ما أبقى البستان سليماً، وقبوله أيسر من الاعتراض عليه.
  tip: >-
    رتّب التصريح مسبقاً عبر إدارة المناطق المحمية أو مكتب أخميتا؛ فالحضور دون موعد لا ينجح. والمسار إلى
    عمق المضيق ثمانية إلى عشرة كيلومترات في الاتجاه الواحد ويستغرق يوماً كاملاً. ويتبع الدرب مجرى النهر
    ويعبره مرات، فبلل القدمين مؤكد، وحذاء يصرّف الماء أفضل من حذاء يحبسه. والقُراد نشط من نيسان إلى تموز.
    ولا تغطية هاتف في المضيق. ولا تدخل وحدك.
  route: >-
    من تبليسي اعبر ممر غومبوري إلى تيلافي ثم غرباً إلى أخميتا، 125 كم من الإسفلت. ومن أخميتا شمالاً نحو
    15 كم إلى فم المضيق؛ المقطع الأخير حصى وتراب ويقطع النهر عند عدة مخاضات. المجموع 140 كم ونحو ساعتين
    وخمسين دقيقة. والارتفاع العالي عن الأرض ضروري، وبعد المطر الغزير قد لا يكون المسلك سالكاً إطلاقاً،
    فاسأل في المكان قبل الانطلاق. والوقود متوفر في تيلافي وأخميتا.
