ka:
  name: ბაწარის ნაკრძალი
  short: პანკისის გვერდით ხეობაში დედამიწაზე ყველაზე დიდი უთხოვრის ტყე დგას — ზოგი ხე აქ დაახლოებით ათასხუთასი
    წლისაა.
  body: >-
    **პანკისის ერთ-ერთ გვერდით ხეობაში დედამიწაზე ყველაზე დიდი უთხოვრის ტყე დგას — ასობით ჰექტარი ხე,
    რომელთა ნაწილი უკვე ხნიერი იყო, როცა თამარი ტახტზე ავიდა.**


    მდინარე ბაწარა, ალაზნის მარჯვენა შენაკადი, აქ კავკასიონის წინამთებიდან ეშვება, ზღვის დონიდან 700-დან
    2000 მეტრამდე. ხეობის მნიშვნელობა ადრევე დააფასეს: ნაკრძალი 1935 წელს დაარსდა, 2003 წლიდან კი ბაწარა-ბაბანეურის
    დაცული ტერიტორიების მკაცრი ბირთვია, ბაბანეურის ნაკრძალთან და ილტოს აღკვეთილთან ერთად. უთხოვარი (Taxus
    baccata) აქ 240–270 ჰექტარს ფარავს. საქართველოს წითელ ნუსხაში ის გადაშენების საფრთხის ქვეშ მყოფ სახეობად
    არის შეტანილი, ზოგიერთი ხის ასაკი კი, მეცნიერთა შეფასებით, 1500 წელს აღწევს.


    კორომში შესვლა ჩამქრალ ოთახში შესვლას ჰგავს. უთხოვარი ისეთ მკვრივ ჩრდილს აფენს, რომ ქვეშ თითქმის არაფერი
    ხარობს: მიწას ჩამოცვენილი წიწვის მურა ფენა ფარავს, დაღარული ღეროები მოწითალო ქერქშია გახვეული, ჰაერი
    კი გარე ბილიკთან შედარებით შესამჩნევად გრილია. უთხოვარს ნეკერჩხალი, იფანი და ცაცხვი ერევა — მეცნიერთა
    აზრით, იმ ტყის ნაშთი, რომელიც ამ ხეობაში მესამეული პერიოდიდან შემორჩა.


    ცხოველები თავს იშვიათად გამოაჩენენ. აქ ბინადრობენ მურა დათვი, ციცაბო ფერდობებზე — არჩვი, ტყეში — შველი,
    კვერნა და მაჩვი; ქედებს ზემოთ ორბები და არწივები ტრიალებენ, ბუჩქნარში კი როჭო იმალება.


    ეს მკაცრი დაცვის ნაკრძალია: შესვლა მხოლოდ ნებართვითა და რეინჯერის თანხლებით შეიძლება. ევროპის დიდ
    ნაწილში უთხოვარი მშვილდისა და ძვირფასი ავეჯისთვის საუკუნეების განმავლობაში ჩეხეს. ბაწარაში მას ზრდა
    აცალეს — ნელა, წლიური რგოლი რგოლზე.
  tip: >-
    ნებართვა წინასწარ მოაგვარეთ დაცული ტერიტორიების სააგენტოში ან ბაწარა-ბაბანეურის ადმინისტრაციაში ახმეტაში
    — უნებართვოდ ადგილზე არავინ შეგიშვებთ. ხეობაში მხოლოდ რეინჯერთან ერთად შედიხართ და ამას მთელი დღე
    სჭირდება. ბილიკი მდინარეს მიუყვება და რამდენჯერმე ფონს გადის, ამიტომ ისეთი ფეხსაცმელი ჩაიცვით, რომელიც
    სწრაფად შრება. აპრილიდან ივლისამდე ტკიპა აქტიურია; მობილური კავშირი ხეობაში არ არის. უთხოვრის ყველა
    ნაწილი, წითელი ნაყოფის რბილობის გარდა, შხამიანია — წიწვსა და თესლს ნუ შეეხებით, ბავშვებს კი თვალი
    ადევნეთ.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) ვაზიანამდე, შემდეგ გომბორის უღელტეხილით (შ38) თელავამდე და იქიდან
    ახმეტამდე — დაახლოებით 125 კმ, მთლიანად ასფალტი. ახმეტიდან ალაზანს ჩრდილოეთით, პანკისის ხეობისკენ
    აუყევით; ნაკრძალის კიდემდე დარჩენილი დაახლოებით 15 კილომეტრის ბოლო ნაწილი ხრეშიანი და გრუნტიანია და
    მდინარეს რამდენჯერმე ფონით კვეთს. სულ დაახლოებით 140 კმ, ორი საათი და ორმოცდაათი წუთი. საჭიროა მაღალი
    კლირენსის ჯიპი — ფონებისა და ორმოებისთვის; ძლიერი წვიმის შემდეგ გზა შეიძლება არც ჯიპისთვის იყოს გასავლელი,
    ამიტომ რეინჯერებს წინასწარ დაურეკეთ. საწვავი ბოლოს ახმეტაში. ზამთარში, თუ გომბორი თოვლს დაუხურავს,
    გურჯაანის გზით წადით.
en:
  name: Batsara Reserve
  short: >-
    A side gorge of Pankisi shelters the largest yew forest on earth, where a few trees are thought to
    be some 1,500 years old.
  body: >-
    **In a side gorge of the Pankisi valley stands the largest yew forest on earth: hundreds of hectares
    of trees, some of which were already old when Queen Tamar took the throne.**


    The Batsara river, a right-bank tributary of the Alazani, drops here out of the Caucasus foothills,
    between 700 and 2,000 metres above sea level. Its value was recognised early. A reserve was declared
    in 1935, and since 2003 Batsara has formed the strict core of the Batsara-Babaneuri Protected Areas,
    together with the Babaneuri reserve and the Ilto Managed Reserve. Yew (Taxus baccata) covers some
    240 to 270 hectares of the gorge; the species is on Georgia's Red List as endangered, and scientists
    estimate a few individual trees at around 1,500 years old.


    Walking into the grove feels like stepping into a room with the lights off. Yew throws a shade so
    dense that almost nothing grows beneath it: the floor is a brown mat of fallen needles, the fluted
    trunks are wrapped in reddish bark, and the air is noticeably cooler than on the track outside. Maple,
    ash and lime mingle with the yew, remnants, botanists say, of a forest type that has survived in this
    gorge since the Tertiary.


    The animals keep out of sight. Brown bears live here, chamois on the steep ground, roe deer, martens
    and badgers in the woods; vultures and eagles ride the ridges, and grouse keep to the undergrowth.


    This is a strict nature reserve, and you enter only with a permit and a ranger. Across most of Europe,
    yew was felled for centuries for longbows and fine furniture. At Batsara it has been left to grow
    at its own pace, one thin ring a year.
  tip: >-
    Arrange the permit in advance with the Agency of Protected Areas or the Batsara-Babaneuri administration
    in Akhmeta; turning up unannounced will get you nowhere. You go in only with a ranger, and the walk
    takes a full day. The path follows the river and fords it several times, so wear shoes that drain
    and dry quickly. Ticks are active from April to July, and there is no mobile signal in the gorge.
    Every part of the yew except the red flesh around the seed is poisonous: leave the needles and seeds
    alone and keep an eye on children.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) as far as Vaziani, cross the Gombori Pass (Sh38) to Telavi
    and continue to Akhmeta: about 125 km, all asphalt. From Akhmeta follow the Alazani north towards
    the Pankisi Gorge. The last part of the remaining 15 km or so to the reserve's edge is gravel and
    dirt, with several river fords. Allow about 140 km and two hours fifty minutes in all. Rent an SUV,
    since the fords and ruts need ground clearance. After heavy rain the track may defeat any vehicle,
    so ring the rangers before you set off. Last fuel is in Akhmeta. If snow closes Gombori in winter,
    go round via Gurjaani.
ru:
  name: Заповедник Бацара
  short: >-
    В боковом ущелье Панкиси прячется самый большой тисовый лес на земле — несколько деревьев здесь, как
    считается, живут около 1500 лет.
  body: >-
    **В боковом ущелье Панкисской долины стоит самый большой тисовый лес на земле: сотни гектаров деревьев,
    некоторые из которых были уже стары, когда на престол взошла царица Тамар.**


    Река Бацара, правый приток Алазани, спускается сюда из предгорий Кавказа, на высоте от 700 до 2000
    метров. Ценность ущелья признали рано. Заповедник учредили в 1935 году, а с 2003 года Бацара составляет
    строгое ядро охраняемых территорий Бацара-Бабанеури, вместе с заповедником Бабанеури и управляемым
    заказником Илто. Тис (Taxus baccata) занимает здесь около 240–270 гектаров ущелья; вид внесён в Красную
    книгу Грузии как находящийся под угрозой, а возраст отдельных деревьев учёные оценивают примерно в
    1500 лет.


    Войти в рощу — всё равно что переступить порог комнаты, где выключили свет. Тис бросает такую густую
    тень, что под ним почти ничего не растёт: землю устилает бурый ковёр опавшей хвои, ребристые стволы
    укутаны в красноватую кору, а воздух заметно холоднее, чем на тропе снаружи. С тисом соседствуют клён,
    ясень и липа — остатки, говорят ботаники, того типа леса, что сохранился в этом ущелье со времён третичного
    периода.


    Звери стараются не попадаться на глаза. Здесь живут бурые медведи, серны на крутых склонах, косули,
    куницы и барсуки в лесу; грифы и орлы парят над хребтами, а тетерева держатся в подлеске.


    Это заповедник строгого режима, и войти в него можно только по разрешению и с рейнджером. Почти по
    всей Европе тис веками рубили на длинные луки и дорогую мебель. В Бацаре ему дали расти в собственном
    темпе — по одному тонкому кольцу в год.
  tip: >-
    Разрешение оформляйте заранее в Агентстве охраняемых территорий или в администрации Бацара-Бабанеури
    в Ахмете; явившись без предупреждения, вы ничего не добьётесь. Входить можно только с рейнджером,
    и на поход уходит целый день. Тропа идёт вдоль реки и несколько раз пересекает её вброд, так что нужна
    обувь, которая быстро сохнет. Клещи активны с апреля по июль, а мобильной связи в ущелье нет. Все
    части тиса, кроме красной мякоти вокруг семени, ядовиты: не трогайте хвою и семена и следите за детьми.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) до Вазиани, через Гомборский перевал (Sh38) до Телави и далее
    до Ахметы: около 125 км, всё асфальт. Из Ахметы следуйте вдоль Алазани на север, в сторону Панкисского
    ущелья. Последняя часть оставшихся 15 км до края заповедника — гравий и грунт с несколькими бродами
    через реку. Всего около 140 км и два часа пятьдесят минут. Возьмите внедорожник: броды и рытвины требуют
    клиренса. После сильных дождей дорога может стать непроходимой для любой машины, так что позвоните
    рейнджерам перед выездом. Последняя заправка — в Ахмете. Если зимой Гомбори закрыт снегом, объезжайте
    через Гурджаани.
fa:
  name: ذخیره‌گاه باتسارا
  short: >-
    در تنگه‌ای فرعی از پانکیسی، بزرگ‌ترین جنگل سرخدار روی زمین پنهان است؛ چند درخت آن را نزدیک به ۱۵۰۰
    سال کهن می‌دانند.
  body: >-
    **در تنگه‌ای فرعی از دره پانکیسی بزرگ‌ترین جنگل سرخدار روی زمین ایستاده است: صدها هکتار درخت، که برخی
    از آن‌ها هنگام تاج‌گذاری ملکه تامار نیز پیر بودند.**


    رود باتسارا، از شاخه‌های سمت راست آلازانی، از دامنه‌های قفقاز در ارتفاع ۷۰۰ تا ۲۰۰۰ متری سرازیر می‌شود.
    ارزش آن زود شناخته شد. ذخیره‌گاهی در سال ۱۹۳۵ اعلام شد، و از سال ۲۰۰۳ باتسارا هستهٔ سخت‌گیرانهٔ مناطق
    حفاظت‌شدهٔ باتسارا-بابانئوری را، در کنار ذخیره‌گاه بابانئوری و منطقهٔ مدیریت‌شدهٔ ایلتو، تشکیل می‌دهد.
    سرخدار (Taxus baccata) نزدیک به ۲۴۰ تا ۲۷۰ هکتار از تنگه را می‌پوشاند؛ این گونه در فهرست سرخ گرجستان
    در خطر انقراض ثبت شده، و دانشمندان سن چند درخت را نزدیک به ۱۵۰۰ سال برآورد می‌کنند.


    ورود به این بیشه مانند گام گذاشتن به اتاقی است که چراغش خاموش شده. سایهٔ سرخدار چنان انبوه است که
    تقریباً هیچ‌چیز زیر آن نمی‌روید: کف زمین را حصیری قهوه‌ای از سوزن‌های ریخته پوشانده، تنه‌های شیاردار
    در پوستی سرخ‌گون پیچیده شده، و هوا به‌مراتب خنک‌تر از مسیر بیرون است. افرا، زبان‌گنجشک و نمدار با
    سرخدار درمی‌آمیزند — بازمانده‌هایی، به گفتهٔ گیاه‌شناسان، از گونه‌ای جنگل که از دورهٔ ترشیری در این
    تنگه دوام آورده است.


    جانوران از دید پنهان می‌مانند. خرس قهوه‌ای این‌جا زندگی می‌کند، شامواه بر شیب‌های تند، شوکا، دله و
    گورکن در جنگل؛ کرکس‌ها و عقاب‌ها بر فراز خطوط کوهستانی می‌چرخند، و سیاه‌خروس در بوته‌زارها پنهان می‌ماند.


    این ذخیره‌گاهی با حفاظت سخت‌گیرانه است، و ورود تنها با مجوز و همراهی یک نگهبان امکان دارد. در بیشتر
    اروپا، سرخدار قرن‌ها برای کمان‌های بلند و مبلمان فاخر قطع می‌شد. اما در باتسارا گذاشته‌اند به آهنگ
    خود رشد کند، حلقه‌ای باریک در هر سال.
  tip: >-
    مجوز را پیش از سفر با آژانس مناطق حفاظت‌شده یا مدیریت باتسارا-بابانئوری در آخمِتا هماهنگ کنید؛ آمدن
    بدون هماهنگی راه به جایی نمی‌برد. ورود تنها با نگهبان است و پیاده‌روی یک روز کامل طول می‌کشد. مسیر
    رود را دنبال می‌کند و چند بار از آن عبور می‌کند، پس کفشی بپوشید که زود آب را رد کند و خشک شود. کنه‌ها
    از آوریل تا ژوئیه فعال‌اند، و در تنگه آنتن تلفن نیست. تمام اجزای سرخدار به‌جز گوشت سرخ اطراف دانه
    سمّی است: به سوزن‌ها و دانه‌ها دست نزنید و کودکان را زیر نظر بگیرید.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را تا وازیانی بگیرید، از گذرگاه گومبوری (Sh38) بگذرید تا تلاوی و سپس تا
    آخمِتا ادامه دهید: حدود ۱۲۵ کیلومتر، همه آسفالت. از آخمِتا در مسیر آلازانی به سوی شمال، به‌سوی تنگهٔ
    پانکیسی بروید. بخش پایانی حدود ۱۵ کیلومتر باقی‌مانده تا کنارهٔ ذخیره‌گاه، شنی و خاکی است و چند بار
    از رود می‌گذرد. در کل حدود ۱۴۰ کیلومتر و دو ساعت و پنجاه دقیقه زمان بگذارید. خودرویی شاسی‌بلند کرایه
    کنید، چون گذر از آب و چاله‌ها به فاصلهٔ زیاد از زمین نیاز دارد. پس از باران سنگین، ممکن است هیچ خودرویی
    از پس این مسیر برنیاید، پس پیش از حرکت با نگهبانان تماس بگیرید. آخرین سوخت‌گیری در آخمِتا است. اگر
    گذرگاه گومبوری زمستان با برف بسته شود، از راه گورجانی دور بزنید.
he:
  name: שמורת בצארה
  short: בערוץ צד של פנקיסי מסתתר יער הטקסוס הגדול בעולם, ובו כמה עצים שגילם מוערך בכ-1,500 שנה.
  body: >-
    **בערוץ צד של עמק פנקיסי עומד יער הטקסוס הגדול בעולם: מאות הקטרים של עצים, שחלקם היו זקנים כבר כשהמלכה
    תמר עלתה לכס.**


    נהר בצארה, יובל בגדה הימנית של האלזני, יורד כאן ממרגלות הקווקז, בגובה של 700 עד 2,000 מטרים. ערכו
    הוכר מוקדם. השמורה הוכרזה ב-1935, ומאז 2003 בצארה מהווה את הליבה המחמירה של שטחי בצארה-בבנאורי המוגנים,
    לצד שמורת בבנאורי והשמורה המנוהלת אילטו. הטקסוס (Taxus baccata) מכסה כ-240 עד 270 הקטרים בערוץ; המין
    רשום ברשימה האדומה של גאורגיה כמצוי בסכנת הכחדה, ומדענים מעריכים את גילם של כמה עצים בודדים בכ-1,500
    שנה.


    הכניסה לחורש מרגישה כמו כניסה לחדר שכיבו בו את האור. הטקסוס מטיל צל כבד כל כך עד שכמעט שום דבר לא
    צומח מתחתיו: הקרקע מכוסה מחצלת חומה של מחטים שנשרו, הגזעים המחורצים עטופים בקליפה אדמדמה, והאוויר
    קריר בהרבה מאשר בשביל שבחוץ. אדר, מילה וטיליה מתערבבים עם הטקסוס — שרידים, אומרים הבוטנאים, מסוג יער
    ששרד בערוץ הזה מאז התקופה השלישונית.


    בעלי החיים מתחמקים מהעין. דובים חומים חיים כאן, שמואות על השטח התלול, איילי כרמל, דלקים וגיריות ביער;
    נשרים ועיטים חגים מעל הרכסים, ותרנגולי בר מסתתרים בסבך.


    זו שמורת טבע מחמירה, ואפשר להיכנס אליה רק עם אישור ועם פקח. ברוב אירופה כרתו את הטקסוס במשך מאות שנים
    לקשתות אורך ולרהיטים משובחים. בבצארה הניחו לו לגדול בקצב שלו, טבעת דקה אחת בשנה.
  tip: >-
    סדרו את האישור מראש עם הסוכנות לשטחים מוגנים או עם הנהלת בצארה-בבנאורי באחמטה; הגעה בלי תיאום לא תוביל
    לשום מקום. נכנסים רק עם פקח, וההליכה נמשכת יום שלם. השביל עוקב אחר הנהר וחוצה אותו כמה פעמים, אז לבשו
    נעליים שמנקזות מים ומתייבשות במהירות. קרציות פעילות מאפריל עד יולי, ואין קליטה סלולרית בערוץ. כל חלקי
    הטקסוס מלבד הבשר האדום שסביב הזרע רעילים: הימנעו ממחטים וזרעים ופקחו עין על ילדים.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) עד ואזיאני, חצו את מעבר גומבורי (Sh38) לטלאווי והמשיכו לאחמטה: כ-125
    ק"מ, הכול אספלט. מאחמטה עקבו אחר האלזני צפונה, לעבר ערוץ פנקיסי. החלק האחרון מתוך כ-15 הק"מ הנותרים
    לקצה השמורה הוא חצץ ועפר, והוא חוצה את הנהר כמה פעמים. הקצו בסך הכול כ-140 ק"מ ושעתיים וחמישים דקות.
    השכירו רכב שטח, כי המעברים והתלמים דורשים מרווח גחון. אחרי גשם כבד הדרך עלולה להיות בלתי עבירה לכל
    רכב, אז התקשרו לפקחים לפני שאתם יוצאים. תדלוק אחרון באחמטה. אם שלג סוגר את גומבורי בחורף, עקפו דרך
    גורג'אני.
ar:
  name: محمية باتسارا
  short: في واد جانبي من بانكيسي تكمن أكبر غابة طقسوس على وجه الأرض، حيث يُقدَّر عمر بعض أشجارها بنحو
    1500 سنة.
  body: >-
    **في واد جانبي من وادي بانكيسي تقف أكبر غابة طقسوس على وجه الأرض: مئات الهكتارات من الأشجار، كان بعضها
    عتيقًا حين تربّعت الملكة تامار على العرش.**


    ينحدر نهر باتسارا، أحد روافد الضفة اليمنى لألازاني، من سفوح القوقاز على ارتفاع بين 700 و2000 متر.
    عُرفت قيمته مبكرًا، فأُعلنت فيه محمية عام 1935، ومنذ 2003 يشكّل باتسارا النواة الصارمة لمناطق باتسارا-بابانِئوري
    المحمية، إلى جانب محمية بابانِئوري ومحمية إيلتو المُدارة. تغطي شجرة الطقسوس (Taxus baccata) نحو 240
    إلى 270 هكتارًا من الوادي؛ وهي مصنّفة في القائمة الحمراء الجورجية بأنها مهدّدة بالانقراض، ويقدّر العلماء
    عمر بعض الأشجار بنحو 1500 سنة.


    الدخول إلى الغابة يشعرك بأنك تدخل غرفة أُطفئت أنوارها. يبسط الطقسوس ظلًا كثيفًا حتى إن شيئًا يكاد
    لا ينبت تحته: الأرض حصيرة بنية من إبر متساقطة، والجذوع المضلّعة ملفوفة بلحاء محمرّ، والهواء أبرد بوضوح
    من المسار الخارجي. تختلط أشجار القيقب والدردار والزيزفون بالطقسوس، وهي بقايا، كما يقول علماء النبات،
    لنوع من الغابات صمد في هذا الوادي منذ العصر الثلاثي.


    تبقى الحيوانات بعيدة عن الأعين. يعيش هنا الدب البني، والشامواه على السفوح الوعرة، واليحمور، والدلق
    والغرير في الغابة؛ وتحوم النسور والعقبان فوق الحيود، ويختبئ الطيهوج في الأجمات.


    هذه محمية طبيعية صارمة، ولا يُسمح بدخولها إلا بترخيص وبمرافقة حارس. في معظم أوروبا قُطع الطقسوس قرونًا
    لصنع الأقواس الطويلة والأثاث الفاخر. أما في باتسارا فقد تُرك يكبر بوتيرته الخاصة، حلقة رفيعة واحدة
    كل سنة.
  tip: >-
    رتّب الترخيص مسبقًا مع وكالة المناطق المحمية أو إدارة باتسارا-بابانِئوري في آخميتا؛ الحضور من دون
    ترتيب مسبق لن يُجديك نفعًا. لا يُسمح بالدخول إلا مع حارس، وتستغرق الجولة يومًا كاملًا. يتبع المسار
    النهر ويعبره خوضًا عدة مرات، فانتعل حذاءً يُصرّف الماء ويجفّ بسرعة. القُراد نشط من أبريل إلى يوليو،
    ولا توجد تغطية للهاتف المحمول في الوادي. كل جزء من الطقسوس سام إلا اللحم الأحمر المحيط بالبذرة: لا
    تلمس الإبر والبذور وراقب الأطفال عن كثب.
  route: >-
    من تبليسي، خذ طريق كاختي السريع (S5) حتى فازياني، واعبر ممر غومبوري (Sh38) إلى تيلافي وتابع إلى آخميتا:
    نحو 125 كم، كلها أسفلت. من آخميتا اتبع نهر ألازاني شمالًا نحو وادي بانكيسي. الجزء الأخير من الكيلومترات
    الخمسة عشر المتبقية إلى حدود المحمية حصوي وترابي، مع عدة معابر نهرية. خصص نحو 140 كم وساعتين وخمسين
    دقيقة إجمالًا. استأجر سيارة دفع رباعي، لأن المعابر والحُفر تتطلّب خلوصًا أرضيًا عاليًا. بعد الأمطار
    الغزيرة قد يصبح المسار عصيًّا على أي سيارة، فاتصل بالحراس قبل الانطلاق. آخر محطة وقود في آخميتا. إذا
    أغلق الثلج ممر غومبوري شتاءً، فالتفّ عبر غورجاني.
