ka:
  name: ოზურგეთი
  short: გურიის ადმინისტრაციული ცენტრი — მშვიდი პროვინციული ქალაქი პარკით, ბაზრით და ერთი კარგი მუზეუმით.
  body: >-
    **ოზურგეთი ის ქალაქია, სადაც სტუმრები ჩვეულებრივ არ ჩერდებიან — და უსაფუძვლოდ.** ის ურეკის პლაჟებსა
    და ბახმაროს მთებს შორისაა და უმეტესობა უბრალოდ გაივლის. სამაგიეროდ, ვინც გაჩერდება, ნახავს დასავლეთ
    საქართველოს პროვინციულ ქალაქს ისეთს, როგორიც ის ნამდვილად არის: ნელი, მწვანე და დაუტვირთავი.

    ქალაქი XIX საუკუნეშია ჩამოყალიბებული, როცა გურიის სამთავრო რუსეთის იმპერიამ გააუქმა და აქ საოლქო ცენტრი
    დაარსდა. სწორედ ამ დროისაა ქუჩების ბადე, ცენტრალური პარკი ჭადრებით და რამდენიმე აგურის შენობა გუბერნიის
    სტილში.

    რაც ღირს ნახვად:

    - **გურიის მხარეთმცოდნეობის მუზეუმი** — გურიის სამთავროს ისტორია, ეთნოგრაფიული კოლექცია და ადგილობრივი
    არქეოლოგია; მცირე, მაგრამ სერიოზულად აწყობილი

    - **ცენტრალური პარკი** — ქალაქის სოციალური ცენტრი, საღამოს სავსე

    - **ბაზარი** — გურული ჩაი, თხილი, თაფლი და, სექტემბერში, ადგილობრივი ხურმა

    - **ალექსანდრე წუწუნავას თეატრი**, საქართველოს ერთ-ერთი უძველესი პროვინციული თეატრი

    გურული სამზარეულო თბილისურისგან განსხვავებულია: ნაკლები ცხარე, მეტი კაკალი და ბოსტნეული. აქ ეძებე
    გურული ღვეზელი — ხახვიანი და კვერცხიანი, ნახევარმთვარისებრი პური, რომელიც ტრადიციულად საახალწლოა,
    მაგრამ დღეს მთელი წელი ცხვება.

    ქალაქი ლოგიკური ბაზაა ერთი-ორი დღით: შემოქმედი და ლიხაური ოციოდე წუთშია, ურეკი — ორმოცში, ბახმარო
    კი შორია, მაგრამ იმავე გზაზეა.
  tip: >-
    სამი საათი ქალაქს ჰყოფნის, ღამის გათევა კი ლოგიკურია, თუ გურიაში ორ დღეს ატარებ. მუზეუმი ცენტრში,
    პარკთანაა; ორშაბათს დახურულია. პარკინგი ცენტრში უფასოა და ადგილიც არის. კაფეები და სასტუმროები ცოტაა,
    მაგრამ საკმარისი. ბანკომატები და აფთიაქები ცენტრში მუშაობს. ზაფხულში ტენიანობა მაღალია — ღია საღამო
    უფრო კომფორტულია, ვიდრე შუადღე.
  route: >-
    თბილისიდან E60-ით დასავლეთით ხაშურზე, ზესტაფონსა და ქუთაისზე გავლით სამტრედიამდე, შემდეგ სამხრეთით
    ლანჩხუთის გავლით — 325 კმ, დაახლოებით ხუთი საათი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია; სამტრედიის
    შემდეგ ორზოლიანი და ნელი. საწვავი ხაშურში, ქუთაისსა და ლანჩხუთშია. ცენტრში პარკინგი უფასოა. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია მთელი წლის განმავლობაში.
en:
  name: Ozurgeti
  short: The administrative centre of Guria — a quiet provincial town with a park, a market and one good
    museum.
  body: >-
    **Ozurgeti is a town visitors usually do not stop in, and that is a mistake.** It sits between the
    beaches at Ureki and the mountains at Bakhmaro, and most people drive straight through. Those who
    stop find a western Georgian provincial town exactly as it is: slow, green and unpressured.

    The town took its present shape in the 19th century, after the Russian Empire abolished the Principality
    of Guria and made this the district centre. The grid of streets, the central park with its plane trees
    and a handful of brick buildings in imperial provincial style all date from then.

    Worth your time:

    - The **Guria Regional Museum** — the history of the principality, an ethnographic collection and
    local archaeology; small, but seriously arranged

    - The **central park**, the town's social centre and busy every evening

    - The **market** — Gurian tea, hazelnuts, honey and, in September, local persimmon

    - The **Alexandre Tsutsunava Theatre**, one of the oldest provincial theatres in Georgia

    Gurian cooking differs from what you eat in Tbilisi: less chilli, more walnut and vegetables. Look
    for Gurian ghvezeli, a half-moon pie of onion and egg that is traditionally a New Year dish but is
    now baked all year.

    The town works as a base for a day or two. Shemokmedi and Likhauri are twenty minutes away, Ureki
    forty, and Bakhmaro is far but on the same road east.
  tip: >-
    Three hours covers the town itself, and an overnight makes sense if you are giving Guria two days.
    The museum is central, beside the park, and closed on Mondays. Parking in the centre is free and available.
    Cafes and hotels are few but adequate. Cash machines and pharmacies work in the centre. Humidity is
    high in summer, so an evening walk is far more comfortable than midday.
  route: >-
    From Tbilisi take the E60 west through Khashuri, Zestaponi and Kutaisi to Samtredia, then turn south
    through Lanchkhuti — 325 km, about five hours. The road is asphalt throughout and in good condition;
    after Samtredia it is two lanes and slower. Fuel is available at Khashuri, Kutaisi and Lanchkhuti.
    Parking in the centre is free. An economy car is entirely sufficient all year round.
ru:
  name: Озургети
  short: Административный центр Гурии — тихий провинциальный город с парком, рынком и одним хорошим музеем.
  body: >-
    **Озургети — город, в котором приезжие обычно не останавливаются, и напрасно.** Он лежит между пляжами
    Уреки и горами Бахмаро, и большинство просто проезжает насквозь. Те, кто останавливается, видят западногрузинский
    провинциальный город таким, какой он есть: медленный, зелёный и ненапряжённый.

    Нынешний облик город получил в XIX веке, после того как Российская империя упразднила Гурийское княжество
    и сделала это место уездным центром. Сетка улиц, центральный парк с платанами и несколько кирпичных
    зданий в губернском стиле — всё оттуда.

    На что стоит потратить время:

    - **Гурийский краеведческий музей** — история княжества, этнографическая коллекция и местная археология;
    небольшой, но собран всерьёз

    - **Центральный парк**, общественный центр города, по вечерам полный людей

    - **Рынок** — гурийский чай, фундук, мёд, а в сентябре местная хурма

    - **Театр имени Александра Цуцунавы**, один из старейших провинциальных театров Грузии

    Гурийская кухня отличается от тбилисской: меньше острого, больше ореха и овощей. Ищите гурийский гвезели
    — пирог-полумесяц с луком и яйцом, традиционно новогодний, а сегодня его пекут круглый год.

    Город удобен как база на день-два. Шемокмеди и Лихаури в двадцати минутах, Уреки в сорока, Бахмаро
    далеко, но по той же дороге на восток.
  tip: >-
    Три часа хватает на сам город, а ночёвка имеет смысл, если вы отводите Гурии два дня. Музей в центре,
    рядом с парком, по понедельникам закрыт. Парковка в центре бесплатная, места есть. Кафе и гостиниц
    немного, но достаточно. Банкоматы и аптеки в центре работают. Летом высокая влажность, так что вечерняя
    прогулка гораздо комфортнее полуденной.
  route: >-
    Из Тбилиси по E60 на запад через Хашури, Зестафони и Кутаиси до Самтредиа, затем на юг через Ланчхути
    — 325 км, около пяти часов. Дорога асфальтированная и в хорошем состоянии; после Самтредиа двухполосная
    и медленнее. Заправки в Хашури, Кутаиси и Ланчхути. Парковка в центре бесплатная. Машины эконом-класса
    вполне достаточно круглый год.
fa:
  name: اوزورگتی
  short: مرکز اداری گوریا — شهری آرام و ولایتی با پارک و بازار و یک موزهٔ خوب.
  body: >-
    **اوزورگتی شهری است که مسافران معمولاً در آن نمی‌ایستند، و این اشتباه است.** میان ساحل‌های اورکی و
    کوه‌های باخمارو نشسته و بیشتر مردم از آن رد می‌شوند. آن‌که می‌ایستد شهری ولایتی از غرب گرجستان را
    می‌بیند، درست همان‌گونه که هست: کند، سبز و بی‌فشار.

    شهر شکل امروزی‌اش را در سدهٔ نوزدهم گرفت، پس از آنکه امپراتوری روسیه امیرنشین گوریا را برچید و اینجا
    را مرکز ناحیه کرد. شبکهٔ خیابان‌ها، پارک مرکزی با درختان چنار و چند ساختمان آجری به سبک ولایتی روسی
    همه از همان دوره‌اند.

    آنچه ارزش وقت دارد:

    - **موزهٔ منطقه‌ای گوریا** — تاریخ امیرنشین، مجموعه‌ای مردم‌شناختی و باستان‌شناسی محلی؛ کوچک اما جدی
    چیده شده

    - **پارک مرکزی**، قلب اجتماعی شهر که غروب‌ها شلوغ است

    - **بازار** — چای گوریایی، فندق، عسل و در شهریور خرمالوی محلی

    - **تئاتر الکساندره تسوتسوناوا**، از کهن‌ترین تئاترهای ولایتی گرجستان

    آشپزی گوریا با آنچه در تفلیس می‌خورید فرق دارد: فلفل کمتر، گردو و سبزی بیشتر. دنبال غْوِزلی گوریایی
    بگردید؛ نانی نیم‌هلالی با پیاز و تخم‌مرغ که به‌سنت خوراک سال نو بود و امروز تمام سال پخته می‌شود.

    شهر پایگاه خوبی برای یکی دو روز است. شموکمدی و لیخائوری بیست دقیقه فاصله دارند، اورکی چهل دقیقه، و
    باخمارو دور است اما در همان جادهٔ شرقی.
  tip: >-
    سه ساعت برای خود شهر کافی است، و اگر دو روز به گوریا می‌دهید ماندن یک شب منطقی است. موزه در مرکز و
    کنار پارک است و دوشنبه‌ها تعطیل. پارکینگ مرکز رایگان است و جا هست. کافه و هتل کم است اما کافی. خودپرداز
    و داروخانه در مرکز کار می‌کند. رطوبت تابستان بالاست، پس قدم‌زدن غروب بسیار راحت‌تر از ظهر است.
  route: >-
    از تفلیس با بزرگراه E60 به غرب از خاشوری، زستافونی و کوتایسی تا سامترِدیا، سپس به جنوب از لانچخوتی
    — ۳۲۵ کیلومتر، حدود پنج ساعت. جاده سرتاسر آسفالت و در وضعیت خوب است؛ پس از سامترِدیا دوبانده و کندتر
    می‌شود. سوخت در خاشوری، کوتایسی و لانچخوتی. پارکینگ مرکز رایگان است. خودروی اقتصادی در تمام سال کاملاً
    کافی است.
he:
  name: אוזורגטי
  short: המרכז המנהלי של גוריה — עיירה פרובינציאלית שקטה עם פארק, שוק ומוזיאון אחד טוב.
  body: >-
    **אוזורגטי היא עיירה שמבקרים בדרך כלל אינם עוצרים בה, וזו טעות.** היא יושבת בין חופי אורקי להרי באחמארו,
    ורוב האנשים חולפים דרכה. מי שעוצר מוצא עיירה פרובינציאלית מערב-גאורגית בדיוק כפי שהיא: איטית, ירוקה
    ולא לחוצה.

    העיירה קיבלה את צורתה הנוכחית במאה ה-19, אחרי שהאימפריה הרוסית ביטלה את נסיכות גוריה והפכה את המקום
    למרכז מחוזי. רשת הרחובות, הפארק המרכזי עם עצי הדולב וכמה מבני לבנים בסגנון פרובינציאלי אימפריאלי —
    כולם משם.

    מה שראוי לזמנכם:

    - **מוזיאון גוריה האזורי** — תולדות הנסיכות, אוסף אתנוגרפי וארכיאולוגיה מקומית; קטן, אך מסודר ברצינות

    - **הפארק המרכזי**, מוקד החיים החברתיים של העיירה, הומה בכל ערב

    - **השוק** — תה גוריאני, אגוזי לוז, דבש, ובספטמבר אפרסמון מקומי

    - **תיאטרון אלכסנדרה צוצונאווה**, מן התיאטראות הפרובינציאליים הוותיקים בגאורגיה

    הבישול הגוריאני שונה ממה שאוכלים בטביליסי: פחות חריף, יותר אגוז וירקות. חפשו גווזלי גוריאני — מאפה
    בצורת חצי סהר במילוי בצל וביצה, שבמסורת הוא מאכל ראש השנה ואילו היום אופים אותו כל השנה.

    העיירה מתפקדת היטב כבסיס ליום או יומיים. שמוקמדי וליחאורי במרחק עשרים דקות, אורקי ארבעים, ובאחמארו
    רחוקה אך על אותו כביש מזרחה.
  tip: >-
    שלוש שעות מכסות את העיירה עצמה, ולינה הגיונית אם אתם נותנים לגוריה יומיים. המוזיאון מרכזי, ליד הפארק,
    וסגור בימי שני. החניה במרכז חינם וזמינה. בתי קפה ומלונות מעטים אך מספיקים. כספומטים ובתי מרקחת פועלים
    במרכז. הלחות בקיץ גבוהה, ולכן טיול ערב נוח בהרבה מטיול צהריים.
  route: >-
    מטביליסי בכביש E60 מערבה דרך חשורי, זסטאפוני וקוטאיסי עד סמטרדיה, ואז דרומה דרך לנצ׳חותי — 325 ק״מ,
    כחמש שעות. הכביש סלול לכל אורכו ובמצב טוב; אחרי סמטרדיה הוא דו-נתיבי ואיטי יותר. תדלוק בחשורי, בקוטאיסי
    ובלנצ׳חותי. החניה במרכז חינם. רכב חסכוני מספיק לחלוטין בכל ימות השנה.
ar:
  name: أوزورغيتي
  short: المركز الإداري لغوريا — بلدة ريفية هادئة بحديقة وسوق ومتحف واحد جيد.
  body: >-
    **أوزورغيتي بلدة لا يتوقف فيها الزوار عادة، وهذا خطأ.** تقع بين شواطئ أوريكي وجبال باخمارو، ويمر معظم
    الناس بها مروراً. ومن يتوقف يجد بلدة ريفية من غرب جورجيا كما هي تماماً: بطيئة وخضراء وبلا ضغط.

    اتخذت البلدة شكلها الحالي في القرن التاسع عشر، بعدما ألغت الإمبراطورية الروسية إمارة غوريا وجعلت هذا
    المكان مركز المقاطعة. شبكة الشوارع والحديقة المركزية بأشجار الدلب وبضعة مبانٍ من الطوب بأسلوب الولايات
    الإمبراطوري كلها من ذلك العهد.

    ما يستحق وقتك:

    - **متحف غوريا الإقليمي** — تاريخ الإمارة ومجموعة إثنوغرافية وآثار محلية؛ صغير لكنه مرتب بجدية

    - **الحديقة المركزية**، قلب البلدة الاجتماعي، وتزدحم كل مساء

    - **السوق** — شاي غوريا والبندق والعسل، وفي سبتمبر الكاكا المحلية

    - **مسرح ألكسندره تسوتسونافا**، من أقدم المسارح الريفية في جورجيا

    والمطبخ الغوري يختلف عما تأكله في تبليسي: فلفل أقل وجوز وخضار أكثر. ابحث عن الغفيزيلي الغوري، فطيرة
    نصف هلالية بالبصل والبيض، تقليدها طعام رأس السنة وتُخبز اليوم طوال العام.

    والبلدة قاعدة مناسبة ليوم أو يومين. شيموكميدي وليخاوري على بعد عشرين دقيقة، وأوريكي أربعين، وباخمارو
    بعيدة لكنها على الطريق نفسه شرقاً.
  tip: >-
    ثلاث ساعات تغطي البلدة نفسها، والمبيت معقول إن كنت تمنح غوريا يومين. المتحف في الوسط بجوار الحديقة
    ويغلق يوم الاثنين. الوقوف في الوسط مجاني ومتاح. المقاهي والفنادق قليلة لكنها تكفي. الصرافات والصيدليات
    تعمل في الوسط. الرطوبة عالية صيفاً، فالمشي مساءً أريح بكثير من الظهيرة.
  route: >-
    من تبليسي غرباً على الطريق E60 عبر خاشوري وزستافوني وكوتايسي حتى سامتريديا، ثم جنوباً عبر لانتشخوتي
    — 325 كم، نحو خمس ساعات. الطريق معبّد كله وبحالة جيدة؛ وبعد سامتريديا يصير مسارين وأبطأ. الوقود في
    خاشوري وكوتايسي ولانتشخوتي. الوقوف في الوسط مجاني. وسيارة اقتصادية تكفي تماماً على مدار السنة.
