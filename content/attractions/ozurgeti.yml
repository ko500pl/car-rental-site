ka:
  name: ოზურგეთი
  short: >-
    გურიელების დროიდან გურიის დედაქალაქი: სამ ტერასაზე გაშლილი მწვანე ქალაქი და თეატრი, რომელიც 1868 წლიდან
    დგამს სპექტაკლებს.
  body: >-
    **ოზურგეთი ოთხ საუკუნეზე მეტია გურიის გულია და ამ როლს უბრალოდ, ყოველგვარი პომპეზურობის გარეშე ატარებს.**
    ქალაქი პირველად „ახალ ქართლის ცხოვრებაში“ იხსენიება, 1578 წლის ამბების აღწერისას, და მალე გურიის მთავრების,
    გურიელების, რეზიდენციად იქცა. XVIII საუკუნეში ვახუშტი ბატონიშვილი წერდა: „ოზურგეთს არის სასახლე დიდშენი
    და კეთილ-პალატოვანი გურიელისა“. 1630-იან წლებში აქ მცხოვრებ იტალიელ მისიონერებს ქალაქში სკოლა და ეკლესია
    ჰქონდათ. ოზურგეთში აღმოჩენილი 270 ვერცხლის მონეტის განძი მის ძველ ვაჭრობაზე მეტყველებს.


    რუსეთის იმპერიამ გურიის სამთავრო 1829 წელს გააუქმა, 1846 წელს კი ოზურგეთი ოფიციალურად ქალაქად გამოცხადდა
    — მაშინ აქ სამასიოდე კაცი ცხოვრობდა. 1934 წლიდან 1989 წლამდე მას სხვა სახელი, მახარაძე, ერქვა — ქართველი
    ბოლშევიკის პატივსაცემად.


    ქალაქი მდინარეებს — ბჟუჟსა და ნატანებს — შორის სამ ტერასად ადის. ქვედა ტერასაზე ბაზარია, ძველი საპარასკევოს
    ადგილას, სადაც პარასკეობით ბაზრობა იმართებოდა; ეს ჩაისა და თხილის მხარეა. შუა ტერასაზე საზოგადოებრივი
    შენობები დგას: 1936 წელს დაარსებული ისტორიული მუზეუმი, ექვს ათასზე მეტი ნივთით, მათ შორის ხმლით, რომელიც,
    როგორც ამბობენ, ნაპოლეონს ეკუთვნოდა, და დრამატული თეატრი, რომლის დასიც 1868 წლიდან თამაშობს, ახლანდელ
    შენობაში კი 1962 წლიდან მოღვაწეობს. თეატრი ალექსანდრე წუწუნავას სახელს ატარებს — თეატრისა და კინოს
    პიონერისა, რომელსაც გურიის ტურისტული სამსახური მიაწერს, რომ სწორედ აქ, გერმანე გოგიტიძესთან ერთად,
    გადაიღო „ქრისტინე“, ერთ-ერთი პირველი ქართული მხატვრული ფილმი; გოგიტიძემ ქალაქში კინოთეატრი ჯერ კიდევ
    1910 წელს გახსნა.


    ზამთარში თუ ჩამოხვალთ, გურული საშობაო ღვეზელი იკითხეთ — ნახევარმთვარის ფორმის ცომი, ყველითა და დაჭრილი
    მოხარშული კვერცხით. ოზურგეთი სტუმრებისთვის სპექტაკლს არ დგამს — უბრალოდ, კარს გიღებთ.
  tip: >-
    ცენტრის დასათვალიერებლად სამი საათი საკმარისია; თუ გურიას ორ დღეს უთმობთ, ღამე აქ გაათიეთ. მუზეუმი
    და თეატრი შუა ტერასაზეა, ერთმანეთისგან რამდენიმე წუთის სავალზე — მუზეუმის სამუშაო დღეები წინასწარ
    გადაამოწმეთ. ცენტრში პარკინგი, როგორც წესი, ადვილად იშოვება. ზაფხული ცხელი და ნოტიოა, ამიტომ დილით
    ან საღამოს ისეირნეთ. კაფეები და საოჯახო სასტუმროები მოკრძალებული, მაგრამ საკმარისია; ბანკომატები და
    აფთიაქები ცენტრშია. აქედან შემოქმედი და ლიხაური ახლოსაა, ურეკი კი ზღვის პირას, 24 კილომეტრშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის გვირაბებისა და ქუთაისის გავლით სამტრედიამდე
    იარეთ, შემდეგ ს12-ით (E692) ლანჩხუთის მიმართულებით. ლანჩხუთთან შ208-ზე გადადით, შემდეგ კი შ2-ით სამხრეთით
    ოზურგეთამდე — დაახლოებით 325 კმ და 4 საათი და 50 წუთი. მთელ გზაზე ასფალტია; ბოლო 30-ოდე კილომეტრი
    სოფლებზე გამავალი ორზოლიანი გზაა და მაგისტრალთან შედარებით ნელა გაივლით. საწვავს ხაშურში, ქუთაისსა
    და ლანჩხუთში ადვილად იპოვით. ეკონომ-კლასის მანქანა ნებისმიერ სეზონზე საკმარისია.
en:
  name: Ozurgeti
  short: >-
    Guria's capital since the days of the Gurieli princes: a green town on three terraces, with a drama
    theatre that has played since 1868.
  body: >-
    **Ozurgeti has been the heart of Guria for more than four centuries, and it wears the role lightly.**
    The town first appears in the chronicle Akhali Kartlis Tskhovreba, in its account of the events of
    1578, and soon became the seat of the Gurieli, the princes of Guria. The eighteenth-century geographer
    Vakhushti Bagrationi found here "a great and well-chambered palace of the Gurieli"; Italian missionaries
    who lived in the town in the 1630s kept a school and a church. A hoard of 270 silver coins dug up
    in the town speaks of its old trade.


    The Russian Empire abolished the principality in 1829, and in 1846 Ozurgeti was formally declared
    a town, with barely three hundred inhabitants. From 1934 to 1989 it carried another name, Makharadze,
    after a Georgian Bolshevik.


    The town climbs three terraces between the Bzhuzhi and Natanebi rivers. On the lowest is the market,
    on the site of the old Friday fair; this is a centre of tea and hazelnut country. The middle terrace
    holds the public buildings: the History Museum, founded in 1936, with more than 6,000 objects, among
    them a sword said to have belonged to Napoleon; and the Drama Theatre, whose company has performed
    since 1868 and has occupied its present building since 1962. It bears the name of Aleksandre Tsutsunava,
    the theatre and film pioneer whom Guria's tourism office credits with shooting Kristine, one of the
    first Georgian feature films, here with Germane Gogitidze, who opened a cinema in the town in 1910.


    If you come in winter, ask for the Gurian Christmas pie, a crescent of dough filled with cheese and
    chopped boiled egg. Ozurgeti does not perform for visitors; it simply lets them in.
  tip: >-
    Three hours cover the centre; stay the night if you are giving Guria two days. The museum and the
    theatre are on the middle terrace, a few minutes' walk apart — check the museum's opening days before
    you go. Parking in the centre is usually easy. Summers are hot and humid, so walk in the morning or
    evening. Cafés and guesthouses are modest but adequate; ATMs and pharmacies are in the centre. From
    here Shemokmedi and Likhauri are short drives, and Ureki is 24 km away on the coast.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnels and past Kutaisi to Samtredia, then
    the S12 (E692) towards Lanchkhuti. Near Lanchkhuti leave it for the Sh208, then follow the Sh2 south
    into Ozurgeti: about 325 km, roughly 4 hours 50 minutes. It is asphalt all the way; the last 30 km
    or so are two-lane country road through villages, slower than the motorway. Fuel is easy to find at
    Khashuri, Kutaisi and Lanchkhuti. An economy car is enough in any season.
ru:
  name: Озургети
  short: >-
    Столица Гурии со времён князей Гуриели — зелёный город на трёх террасах, где драматический театр играет
    с 1868 года.
  body: >-
    **Озургети уже больше четырёх веков остаётся сердцем Гурии — и несёт эту роль без всякой торжественности.**
    Город впервые упомянут в хронике «Новая жизнь Картли», в рассказе о событиях 1578 года, и вскоре стал
    резиденцией Гуриели, князей Гурии. Географ XVIII века Вахушти Багратиони застал здесь «большой и благоустроенный
    дворец Гуриели»; итальянские миссионеры, жившие в городе в 1630-х годах, держали здесь школу и церковь.
    Клад из 270 серебряных монет, найденный в городе, говорит о его давней торговле.


    Российская империя упразднила княжество в 1829 году, а в 1846-м Озургети официально получил статус
    города — тогда в нём жило едва три сотни человек. С 1934 по 1989 год он носил другое имя, Махарадзе,
    в честь грузинского большевика.


    Город поднимается на трёх террасах между реками Бжужи и Натанеби. На нижней расположен рынок — на
    месте старой пятничной ярмарки; здесь центр чайного и фундучного края. На средней террасе стоят общественные
    здания: Исторический музей, основанный в 1936 году, с более чем 6000 экспонатов, среди которых меч,
    который, как говорят, принадлежал Наполеону; и драматический театр, чья труппа играет с 1868 года,
    а в нынешнем здании — с 1962-го. Он носит имя Александре Цуцунавы, пионера театра и кино, которому
    туристическое управление Гурии приписывает съёмки здесь «Кристине», одного из первых грузинских художественных
    фильмов, вместе с Германе Гогитидзе, открывшим в городе кинотеатр в 1910 году.


    Если приедете зимой, спросите гурийский рождественский пирог — полумесяц из теста с начинкой из сыра
    и рубленого варёного яйца. Озургети не устраивает представлений для гостей — он просто впускает их.
  tip: >-
    Трёх часов хватит на центр; если посвящаете Гурии два дня, останьтесь на ночь. Музей и театр находятся
    на средней террасе, в нескольких минутах ходьбы друг от друга — уточните дни работы музея заранее.
    Парковка в центре обычно не проблема. Летом здесь жарко и влажно, так что гулять лучше утром или вечером.
    Кафе и гостевые дома скромные, но вполне приличные; банкоматы и аптеки в центре. Отсюда недалеко до
    Шемокмеди и Лихаури, а Уреки на побережье — 24 км.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Рикотские тоннели и Кутаиси до Самтредиа, затем по S12
    (E692) в сторону Ланчхути. Возле Ланчхути сверните на Sh208, а затем следуйте по Sh2 на юг до Озургети:
    около 325 км, примерно 4 часа 50 минут. Дорога асфальтирована на всём протяжении; последние 30 км
    — двухполосная сельская дорога через деревни, здесь скорость ниже, чем на трассе. Заправиться легко
    в Хашури, Кутаиси и Ланчхути. Машины эконом-класса хватит в любое время года.
fa:
  name: اوزورگتی
  short: 'پایتخت گوریا از روزگار شاهزادگان گوریِلی: شهری سرسبز بر سه سطح، با تئاتری که از سال ۱۸۶۸ روی
    صحنه مانده است.'
  body: >-
    **اوزورگتی بیش از چهار قرن است که قلب گوریا بوده، و این نقش را بدون هیچ تظاهری بر دوش می‌کشد.** این
    شهر برای نخستین‌بار در تاریخ‌نامهٔ «آخالی کارتلیس تسخووربا»، در روایت حوادث سال ۱۵۷۸، ذکر شده و به‌زودی
    مقر گوریِلی‌ها، شاهزادگان گوریا، گردید. واخوشتی باگراتیونی، جغرافی‌دان سدهٔ هجدهم، در اینجا «کاخی
    بزرگ و پرتالار از آنِ گوریِلی» یافت؛ مبلغان ایتالیایی که در دههٔ ۱۶۳۰ در شهر می‌زیستند، مدرسه و کلیسایی
    داشتند. گنجینه‌ای از ۲۷۰ سکهٔ نقره که در شهر یافت شده، از تجارت دیرینه‌اش حکایت می‌کند.


    امپراتوری روسیه این شاهزاده‌نشین را در سال ۱۸۲۹ برانداخت، و در ۱۸۴۶ اوزورگتی رسماً به شهر تبدیل شد،
    در حالی که تنها نزدیک به سیصد نفر در آن ساکن بودند. از ۱۹۳۴ تا ۱۹۸۹ این شهر نام دیگری داشت، ماخارادزه،
    به یاد یک بلشویک گرجی.


    این شهر بر سه سطح میان رودهای بژوژی و ناتانبی بالا می‌رود. در پایین‌ترین سطح بازار قرار دارد، بر جای
    بازار جمعهٔ کهن؛ اینجا مرکز سرزمین چای و فندق است. سطح میانی ساختمان‌های عمومی را در خود دارد: موزهٔ
    تاریخ، بنیان‌گذاری‌شده در ۱۹۳۶، با بیش از ۶۰۰۰ شیء، از جمله شمشیری که گفته می‌شود از آنِ ناپلئون بوده؛
    و تئاتر دراماتیک، که گروه بازیگرانش از ۱۸۶۸ بر صحنه بوده و از ۱۹۶۲ در بنای کنونی‌اش جای دارد. این
    تئاتر نام الکساندره تسوتسوناوا را بر خود دارد، پیشگام تئاتر و سینما که دفتر گردشگری گوریا به او نسبت
    می‌دهد که «کریستینه»، یکی از نخستین فیلم‌های داستانی گرجی را، در همین‌جا با گرمانه گوگیتیدزه، که در
    ۱۹۱۰ سینمایی در شهر گشود، فیلم‌برداری کرد.


    اگر در زمستان بیایید، پای کریسمسِ گوریایی را بخواهید — نیم‌ماهی از خمیر، پر از پنیر و تخم‌مرغ آب‌پز
    خردشده. اوزورگتی برای بازدیدکنندگان نمایشی برپا نمی‌کند؛ فقط درش را به رویشان می‌گشاید.
  tip: >-
    سه ساعت برای مرکز شهر کافی است؛ اگر دو روز به گوریا اختصاص می‌دهید، شب را همین‌جا بمانید. موزه و تئاتر
    در سطح میانی‌اند، چند دقیقه پیاده از هم فاصله دارند — پیش از رفتن روزهای بازگشایی موزه را بررسی کنید.
    پارک کردن در مرکز شهر معمولاً آسان است. تابستان‌ها گرم و مرطوب است، پس بهتر است صبح یا عصر پیاده‌روی
    کنید. کافه‌ها و اقامتگاه‌ها ساده اما کافی‌اند؛ دستگاه‌های خودپرداز و داروخانه‌ها در مرکز شهرند. از
    اینجا شمکمدی و لیخائوری فاصلهٔ کوتاهی دارند، و اورکی در ساحل، ۲۴ کیلومتر دورتر است.
  route: >-
    از تفلیس از راه S1 (E60) به سوی غرب، از تونل‌های ریکوتی و کوتایسی گذشته، تا سامتردیا برانید، سپس از
    S12 (E692) به سوی لانچخوتی. نزدیک لانچخوتی از آن جدا شوید و به Sh208 بروید، سپس از Sh2 به سوی جنوب
    تا اوزورگتی ادامه دهید: نزدیک به ۳۲۵ کیلومتر، حدود ۴ ساعت و ۵۰ دقیقه. تمام راه آسفالت است؛ حدود ۳۰
    کیلومتر پایانی راهی روستایی دوخطه است که از میان روستاها می‌گذرد و کندتر از بزرگراه است. سوخت‌گیری
    در خاشوری، کوتایسی و لانچخوتی آسان است. خودرویی اقتصادی در هر فصلی کافی است.
he:
  name: אוזורגטי
  short: 'בירת גוריה מימי נסיכי בית גוריאלי: עיר ירוקה הבנויה על שלוש מדרגות, ותיאטרון דרמטי שלא ירד מהבמה
    מ־1868.'
  body: >-
    **אוזורגטי היא לב גוריה כבר יותר מארבע מאות שנה, ונושאת את התפקיד הזה בלי שום גינונים.** העיר מוזכרת
    לראשונה בכרוניקה "אחלי קרתליס צחוברבה", בתיאור מאורעות 1578, ועד מהרה הפכה למקום מושבם של הגוריאלי,
    נסיכי גוריה. הגאוגרף בן המאה השמונה־עשרה וחושטי בגרטיוני מצא כאן "ארמון גדול ומחולק היטב של הגוריאלי";
    מיסיונרים איטלקים שחיו בעיר בשנות ה־1630 קיימו בה בית ספר וכנסייה. מטמון של 270 מטבעות כסף שנחפר בעיר
    מעיד על מסחרה העתיק.


    האימפריה הרוסית חיסלה את הנסיכות ב־1829, וב־1846 הוכרזה אוזורגטי רשמית כעיר, כשמנו בה רק כשלוש מאות
    תושבים. בין 1934 ל־1989 נשאה שם אחר, מאחרדזה, לזכר בולשביק גאורגי.


    העיר מתרוממת על שלוש מדרגות בין הנהרות בז'וז'י ונטנבי. במדרגה התחתונה שוק, במקום שבו התקיים בעבר שוק
    יום שישי; זהו מרכזה של ארץ התה ואגוזי הלוז. במדרגה האמצעית עומדים המבנים הציבוריים: מוזיאון ההיסטוריה,
    שנוסד ב־1936, ובו יותר מ־6,000 חפצים, ובהם חרב שלפי המסופר הייתה של נפוליאון; והתיאטרון הדרמטי, שחבורתו
    מופיעה מ־1868 ובבניינו הנוכחי מ־1962. הוא נושא את שמו של אלכסנדר צוצונאווה, חלוץ התיאטרון והקולנוע,
    שלשכת התיירות של גוריה מייחסת לו את הצילומים כאן של "כריסטינה", אחד הסרטים העלילתיים הראשונים בגאורגיה,
    לצד גרמנה גוגיטידזה, שפתח בעיר בית קולנוע ב־1910.


    אם תגיעו בחורף, בקשו את פשטידת חג המולד הגוריאנית — בצק בצורת סהר, ממולא בגבינה וביצה קשה קצוצה. אוזורגטי
    לא מציגה מופע לאורחים — היא פשוט נותנת להם להיכנס.
  tip: >-
    שלוש שעות מספיקות למרכז; אם מקדישים לגוריה יומיים, כדאי ללון כאן. המוזיאון והתיאטרון נמצאים במדרגה
    האמצעית, כמה דקות הליכה זה מזה — בדקו מראש את ימי הפתיחה של המוזיאון. חניה במרכז בדרך כלל קלה. הקיץ
    חם ולח, אז כדאי לטייל בבוקר או בערב. בתי הקפה והאכסניות פשוטים אך מספקים; כספומטים ובתי מרקחת נמצאים
    במרכז. מכאן שמוקמדי וליחאורי במרחק קצר, ואורקי על החוף במרחק 24 ק"מ.
  route: >-
    מטביליסי סעו ב-S1 (E60) מערבה, דרך מנהרות ריקוטי וליד קוטאיסי עד סמטרדיה, ואז ב-S12 (E692) לכיוון
    לנצ'חוטי. סמוך ללנצ'חוטי עברו ל-Sh208, ואז המשיכו ב-Sh2 דרומה לתוך אוזורגטי: כ-325 ק"מ, כ-4 שעות ו-50
    דקות. כל הדרך אספלט; כ-30 הק"מ האחרונים הם דרך כפרית דו-נתיבית שחוצה כפרים, איטית יותר מהכביש המהיר.
    תדלוק זמין בקלות בחשורי, קוטאיסי ולנצ'חוטי. רכב חסכוני מספיק בכל עונה.
ar:
  name: أوزورغيتي
  short: >-
    عاصمة غوريا منذ أيام أمراء غورييلي: مدينة خضراء تمتد على ثلاث مصاطب، ومسرح دراما لم يغب عن الخشبة
    منذ عام 1868.
  body: >-
    **ما زالت أوزورغيتي، منذ أكثر من أربعة قرون، قلبَ غوريا، وهي تحمل هذا الدور دون أي تباهٍ.** ذُكرت
    المدينة لأول مرة في السجل التاريخي «أخالي كارتليس تسخوفريبا»، في سرده لأحداث عام 1578، وسرعان ما أصبحت
    مقرّ الغورييلي، أمراء غوريا. وجد الجغرافي فاخوشتي باغراتيوني، في القرن الثامن عشر، هنا «قصرًا عظيمًا
    ذا حجرات كثيرة للغورييلي»؛ وكان مبشرون إيطاليون عاشوا في المدينة في العقد الرابع من القرن السابع عشر
    يديرون فيها مدرسة وكنيسة. وكنزٌ من 270 عملة فضية استُخرج من المدينة يشهد على تجارتها القديمة.


    ألغت الإمبراطورية الروسية هذه الإمارة عام 1829، وفي عام 1846 أُعلنت أوزورغيتي مدينة رسميًا، ولم يكن
    يقطنها سوى نحو ثلاثمائة نسمة. ومن 1934 إلى 1989 حملت اسمًا آخر، ماخارادزه، تخليدًا لبلشفي جورجي.


    ترتقي المدينة على ثلاث مصاطب بين نهري بجوجي وناتانيبي. في أدنى مصطبة يقع السوق، في موضع سوق الجمعة
    القديم؛ وهذه بلاد الشاي والبندق. وتضمّ المصطبة الوسطى المباني العامة: متحف التاريخ، الذي تأسس عام
    1936، ويحوي أكثر من 6000 قطعة، من بينها سيف يُقال إنه كان لنابليون؛ ومسرح الدراما، الذي تؤدي فرقته
    منذ عام 1868 وتشغل مبناه الحالي منذ عام 1962. يحمل المسرح اسم ألكسندره تسوتسونافا، رائد المسرح والسينما،
    الذي ينسب إليه مكتبُ السياحة في غوريا تصويرَ «كريستينه»، أحد أوائل الأفلام الروائية الجورجية، هنا
    مع غيرمانه غوغيتيدزه، الذي افتتح دار سينما في المدينة عام 1910.


    إن أتيت في الشتاء، فاطلب فطيرة عيد الميلاد الغورية، وهي هلالٌ من العجين محشوٌّ بالجبن والبيض المسلوق
    المفروم. لا تقدّم أوزورغيتي عرضًا لزائريها؛ إنها فقط تفتح لهم بابها.
  tip: >-
    تكفي ثلاث ساعات لزيارة المركز؛ وإن كنت تخصص يومين لغوريا، فامكث ليلة هنا. يقع المتحف والمسرح على المصطبة
    الوسطى، على بعد دقائق سيرًا بينهما — تحقق من أيام فتح المتحف قبل الذهاب. ركن السيارة في المركز سهل
    عادة. الصيف هنا حار ورطب، فمن الأفضل التنزّه صباحًا أو مساءً. المقاهي والنُّزل متواضعة لكنها كافية؛
    وأجهزة الصراف الآلي والصيدليات في المركز. من هنا تبعد شيموكمدي وليخاوري مسافة قصيرة، وتبعد أوريكي
    على الساحل 24 كم.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر أنفاق ريكوتي ومرورًا بكوتايسي حتى سامتريديا، ثم الطريق S12
    (E692) نحو لانتشخوتي. قرب لانتشخوتي، غادره إلى الطريق Sh208، ثم اتبع الطريق Sh2 جنوبًا إلى أوزورغيتي:
    نحو 325 كم، أي حوالي 4 ساعات و50 دقيقة. الطريق مُعبَّد بالكامل؛ وآخر نحو 30 كم طريق ريفي بمسارين يعبر
    القرى، وهو أبطأ من الطريق السريع. الوقود متوفر بسهولة في خاشوري وكوتايسي ولانتشخوتي. تكفي سيارة اقتصادية
    في أي فصل.
