ka:
  name: ორბელიანის მოედანი
  short: >-
    თბილისის ძველი სავაჭრო მოედანი, 2019 წელს განახლებული: ყვავილების დახლები, შადრევნიანი სკვერი და სოლოლაკის
    ქუჩების კარიბჭე.
  body: >-
    **ორი საუკუნეა, თბილისი ამ პატარა მოედანზე საყიდლებზე მოდის: ოდესღაც — სოფლის ხილ-ბოსტნეულისთვის,
    ჯარისკაცების გამოტანილი ნივთებისთვის და, როგორც ამბობენ, ქალაქის პირველი ნაძვის ხისთვისაც, დღეს კი
    — ყვავილებისთვის.**


    XIX საუკუნის დასაწყისში აქ სოფლებიდან ჩამოტანილ ხილსა და ბოსტნეულს ყიდდნენ. 1828 წლიდან ადგილს „ფოსტის
    მოედანი“ ერქვა, 1876–1903 წლებში — „სალდათის ბაზარი“: კვირაობით ჯარისკაცები აქ სამხედრო ნივთებს ასაღებდნენ.
    შემდეგ, 1930-იან წლებამდე, მას „რუსების ბაზარს“ ეძახდნენ. ამბობენ, თბილისში პირველი ნაძვის ხეც სწორედ
    აქ გაიყიდა. საბჭოთა წლებმა კოლმეურნეობის ბაზარი და ახალი სახელი — „კოლმეურნეობის მოედანი“ — მოიტანა.
    დღეს მოედანი ქართული რომანტიზმის პოეტის, თავად გრიგოლ ორბელიანის (1804–1883) სახელს ატარებს.


    2019 წლის რეაბილიტაციისას მოედნის გარშემო ოცი შენობა განახლდა, მათგან ცამეტი კულტურული მემკვიდრეობის
    ძეგლია. გავლისას ზემოთ აიხედეთ: ატონელის ქუჩის კუთხის სახლს ფიქლის კოშკურა ადგას, ტროტუარებს ნაჭედი
    რკინის აივნები დაჰყურებს. მოედნის კიდეზე ქალაქის ძველი გალავნის ნაშთი მოჩანს — თბილისის სიმაგრე ოდესღაც
    სწორედ აქ გადიოდა. შუაში პატარა სკვერი და შადრევანია, ქვედა მხარეს კი, სადაც ოდესღაც კოლმეურნეები
    ვაჭრობდნენ, მინის ფასადიანი ბაზრის შენობა დაბრუნდა — კვების დარბაზით და სუპერმარკეტით.


    და მაინც, მოედნის მაჯისცემა ყვავილების დახლებია. მეყვავილეები ვედროებს დილით ადრე აწყობენ და შუადღემდე
    თბილისელებს აქედან ვარდები და სეზონური თაიგულები მიაქვთ — დაბადების დღეზე, სტუმრად წასასვლელად თუ
    ბოდიშის მოსახდელად. სოლოლაკის არტ-ნუვოს სადარბაზოები აქედან რამდენიმე წუთის აღმართზეა.


    სანამ წახვალთ, სეზონური ყვავილების თაიგული იყიდეთ: ამ ქალაქში ეს ყველაზე ადგილობრივი რამაა, რისი წაღებაც
    შეგიძლიათ.
  tip: >-
    თუ ყვავილები გაინტერესებთ, დილით მოდით — ვაჭრობა ადრე იწყება და შუადღემდე არჩევანიც მეტია. თავად მოედანს
    ნახევარი საათი ჰყოფნის, სოლოლაკის შესახვევებთან ერთად კი საათნახევარი დაგჭირდებათ. გარშემო კაფეებში
    ფასები ზომიერია; ყავის, წასახემსებლისა და ტუალეტისთვის ყველაზე მარტივი გაჩერება ბაზრის შენობაა. ფოტოსთვისაც
    დილა სჯობს, სანამ მოედანი ჩრდილში შევა. ოქტომბერში, თბილისობაზე, და ახალი წლის წინა კვირებში მოედანი
    ხშირად დახლებითა და განათებით ივსება.
  route: >-
    ორბელიანის მოედანი თავისუფლების მოედნიდან დაახლოებით ნახევარ კილომეტრშია, ატონელის, ვეკუას, ტაბუკაშვილისა
    და ფურცელაძის ქუჩებს შორის. ფეხით შვიდი წუთია, ასე რომ, თუ ნაქირავები მანქანა უკვე ცენტრში გიდგათ,
    იქვე დატოვეთ. თუ მაინც მანქანით მოდიხართ, მოედნის ქვედა მხარეს, სუპერმარკეტის ქვეშ, მიწისქვეშა ავტოსადგომია,
    მიმდებარე ქუჩებზე კი ზონალური ფასიანი პარკინგი (Tbilisi Parking-ის აპლიკაცია). სამუშაო დღეებში, პიკის
    საათებში, ატონელისა და ვეკუას ქუჩები იჭედება, შესახვევები კი ვიწროა — კომპაქტური ეკონომკლასი აქ ზუსტად
    ის არის, რაც გჭირდებათ. გზა მთლიანად ასფალტიანია.
en:
  name: Orbeliani Square
  short: >-
    Tbilisi's old market square, restored in 2019: flower stalls, a small fountain garden and the doorway
    into the lanes of Sololaki.
  body: >-
    **For two hundred years this small square has been where Tbilisi comes to shop: once for village produce,
    soldiers' surplus and, reportedly, the city's very first Christmas tree; today for armfuls of flowers.**


    In the early nineteenth century villagers sold fresh produce here. From 1828 the place was called
    Post Square; from 1876 to 1903 it was the Soldiers' Market, where on Sundays soldiers sold off their
    military kit; after that, until the 1930s, it was the Russians' Market. It is said that the first
    Christmas tree ever sold in Tbilisi changed hands here. The Soviet years brought a collective-farm
    market and a new name, Kolkhoz Square. Today the square carries the name of Grigol Orbeliani (1804–1883),
    the prince and poet of Georgian Romanticism.


    The 2019 rehabilitation renovated twenty buildings around it, thirteen of them listed cultural heritage
    monuments. Look up as you cross: a corner house on Atoneli Street wears a slate turret, and wrought-iron
    balconies lean over the pavements. At the edge of the square a fragment of the old city wall shows
    through, a reminder that Tbilisi's fortifications once ran right here. In the middle sits a small
    garden with a fountain; on the lower side, where the collective farmers once traded, a glass-fronted
    market hall has returned, with a food hall and a supermarket.


    Still, the pulse of the place is the flower stalls. The florists set out their buckets early, and
    by mid-morning Tbilisians are carrying away roses and seasonal bunches for birthdays, visits and apologies.
    Sololaki's Art Nouveau entrance halls are a few minutes' climb away.


    Leave with a bunch of whatever is in season: in this city it is the most local thing you can carry.
  tip: >-
    Come in the morning if the flowers matter to you: trade starts early and the choice is best before
    noon. The square itself takes half an hour; with Sololaki's side streets, allow ninety minutes. Cafés
    around it are moderately priced, and the market hall is the easiest stop for coffee, a snack and a
    toilet. Morning is also the best time for photographs, before the square falls into shade. At Tbilisoba
    in October and in the weeks before New Year, stalls and lights often fill the square.
  route: >-
    Orbeliani Square lies about half a kilometre from Freedom Square, framed by Atoneli, Vekua, Tabukashvili
    and Purtseladze streets. On foot it is seven minutes, so if your rental is already parked in the centre,
    leave it where it is. If you do drive, there is an underground car park beneath the supermarket on
    the square's lower side, plus zonal paid parking in the surrounding streets (Tbilisi Parking app).
    On weekdays Atoneli and Vekua streets clog at rush hour and the lanes are narrow, so a compact economy
    car is exactly the right tool. Asphalt all the way.
ru:
  name: Площадь Орбелиани
  short: >-
    Старая рыночная площадь Тбилиси, обновлённая в 2019 году: цветочные ряды, сквер с фонтаном и вход
    в переулки Сололаки.
  body: >-
    **Двести лет на эту маленькую площадь Тбилиси ходит за покупками: когда-то за деревенской снедью,
    солдатским скарбом и, говорят, за самой первой в городе рождественской ёлкой, а сегодня — за охапками
    цветов.**


    В начале XIX века крестьяне продавали здесь свежие продукты. С 1828 года место называлось Почтовой
    площадью, с 1876 по 1903 год здесь шумел Солдатский базар, где по воскресеньям солдаты сбывали казённое
    снаряжение, а потом, до 1930-х, — Русский базар. Рассказывают, что именно здесь продали первую рождественскую
    ёлку в Тбилиси. Советская эпоха принесла колхозный рынок и новое имя — Колхозная площадь. Сегодня
    площадь носит имя Григола Орбелиани (1804–1883), князя и поэта грузинского романтизма.


    При реабилитации 2019 года обновили двадцать окрестных зданий, тринадцать из них — памятники культурного
    наследия. Переходя площадь, поднимите глаза: угловой дом на улице Атонели увенчан башенкой под сланцевой
    кровлей, над тротуарами нависают кованые балконы. На краю площади проступает фрагмент старой городской
    стены — напоминание о том, что укрепления Тбилиси проходили прямо здесь. В центре разбит небольшой
    сквер с фонтаном, а на нижней стороне, где когда-то торговали колхозники, снова вырос рыночный павильон
    со стеклянным фасадом — с фуд-холлом и супермаркетом.


    И всё же пульс площади — цветочные ряды. Цветочницы выставляют вёдра с утра пораньше, и к середине
    утра тбилисцы уже уносят розы и сезонные букеты — на дни рождения, в гости, в знак примирения. До
    парадных Сололаки в стиле модерн отсюда несколько минут подъёма.


    Уходя, возьмите букет того, что сейчас в сезоне: в этом городе ничего более местного в руках не унесёшь.
  tip: >-
    Если вам важны цветы, приходите утром: торговля начинается рано, и лучший выбор — до полудня. На саму
    площадь хватит получаса, вместе с боковыми улочками Сололаки закладывайте полтора часа. Цены в окрестных
    кафе умеренные, а проще всего выпить кофе, перекусить и найти туалет в рыночном павильоне. Утро —
    и лучшее время для фотографий, пока площадь не ушла в тень. На Тбилисобу в октябре и в последние недели
    перед Новым годом площадь нередко заполняют прилавки и гирлянды.
  route: >-
    Площадь Орбелиани лежит примерно в полукилометре от площади Свободы, в кольце улиц Атонели, Векуа,
    Табукашвили и Пурцеладзе. Пешком — семь минут, так что если арендованная машина уже припаркована в
    центре, пусть там и стоит. Если всё же едете, под супермаркетом на нижней стороне площади есть подземный
    паркинг, а на соседних улицах — зональная платная парковка (приложение Tbilisi Parking). В будни в
    час пик Атонели и Векуа встают в пробках, переулки узкие, так что компактный автомобиль эконом-класса
    — именно то, что нужно. Асфальт на всём пути.
fa:
  name: میدان اوربلیانی
  short: >-
    میدان قدیمی بازار تفلیس که در ۲۰۱۹ نوسازی شد: بساط گل‌فروشان، باغچه‌ای کوچک با فواره و درگاه ورود
    به کوچه‌های سولولاکی.
  body: >-
    **دویست سال است که تفلیس برای خرید به این میدان کوچک می‌آید: روزگاری برای محصولات روستایی، خرت‌وپرت
    سربازان و، به روایتی، نخستین درخت کریسمس شهر؛ و امروز برای دسته‌دسته گل.**


    در آغاز سدهٔ نوزدهم روستاییان اینجا محصولات تازه می‌فروختند. از ۱۸۲۸ نام این مکان «میدان پست» بود؛
    از ۱۸۷۶ تا ۱۹۰۳ «بازار سربازان» شد، جایی که سربازان روزهای یکشنبه لوازم نظامی‌شان را می‌فروختند؛ و
    پس از آن، تا دههٔ ۱۹۳۰، «بازار روس‌ها» نام داشت. می‌گویند نخستین درخت کریسمسی که در تفلیس فروخته شد،
    همین‌جا دست‌به‌دست شد. دوران شوروی بازار کلخوزی را آورد و نامی تازه: «میدان کلخوز». امروز میدان به
    نام گریگول اوربلیانی (۱۸۰۴–۱۸۸۳) است، شاهزاده و شاعر مکتب رمانتیسم گرجی.


    در بازسازی سال ۲۰۱۹ بیست ساختمان پیرامون میدان نوسازی شد که سیزده‌تای آن‌ها از آثار ثبت‌شدهٔ میراث
    فرهنگی‌اند. هنگام گذر از میدان سر بلند کنید: خانه‌ای نبش خیابان آتونلی برجکی با پوشش سنگ لوح بر سر
    دارد و بالکن‌های آهن فرفورژه بر پیاده‌روها خم شده‌اند. در لبهٔ میدان پاره‌ای از حصار کهن شهر پیداست؛
    یادآور اینکه باروهای تفلیس روزگاری درست از همین‌جا می‌گذشتند. در میانهٔ میدان باغچه‌ای کوچک با فواره
    است و در ضلع پایینی، همان‌جا که کشاورزان کلخوز روزگاری داد‌وستد می‌کردند، سالن بازاری با نمای شیشه‌ای
    دوباره برپا شده که فودکورت و سوپرمارکت دارد.


    با این همه، نبض میدان بساط گل‌فروشان است. گل‌فروش‌ها سطل‌هایشان را از صبح زود می‌چینند و تا میانهٔ
    صبح اهالی تفلیس بغل‌بغل رز و دسته‌گل‌های فصلی می‌برند؛ برای تولد، برای مهمانی، برای عذرخواهی. سرسراهای
    ورودی آرت‌نووی سولولاکی چند دقیقه سربالایی آن‌طرف‌تر است.


    موقع رفتن دسته‌ای از گل‌های همان فصل بخرید: در این شهر، بومی‌تر از این چیزی نمی‌توانید با خود ببرید.
  tip: >-
    اگر گل برایتان مهم است صبح بیایید: خرید و فروش زود شروع می‌شود و بهترین انتخاب پیش از ظهر است. خود
    میدان نیم ساعت وقت می‌گیرد؛ با کوچه‌های فرعی سولولاکی یک ساعت و نیم در نظر بگیرید. کافه‌های اطراف
    قیمت معقولی دارند و سالن بازار ساده‌ترین جا برای قهوه، خوراکی سبک و سرویس بهداشتی است. صبح بهترین
    وقت عکاسی هم هست، پیش از آنکه میدان به سایه برود. در جشن تفلیسوبا در ماه اکتبر و هفته‌های پیش از سال
    نو، اغلب غرفه‌ها و چراغ‌ها میدان را پر می‌کنند.
  route: >-
    میدان اوربلیانی حدود نیم کیلومتر با میدان آزادی فاصله دارد و خیابان‌های آتونلی، وکوا، تابوکاشویلی
    و پورتسلادزه دورش را گرفته‌اند. پیاده هفت دقیقه راه است؛ پس اگر خودروی اجاره‌ای‌تان همین حالا در مرکز
    پارک است، همان‌جا بماند. اگر با ماشین می‌آیید، زیر سوپرمارکتِ ضلع پایینی میدان پارکینگ زیرزمینی هست
    و در خیابان‌های اطراف پارک پولیِ منطقه‌بندی‌شده (اپلیکیشن Tbilisi Parking). روزهای کاری خیابان‌های
    آتونلی و وکوا در ساعت اوج ترافیک قفل می‌شوند و کوچه‌ها باریک‌اند؛ پس یک خودروی جمع‌وجور اقتصادی دقیقاً
    همان چیزی است که لازم دارید. تمام مسیر آسفالت است.
he:
  name: כיכר אורבליאני
  short: 'כיכר השוק הוותיקה של טביליסי, ששוקמה ב-2019: דוכני פרחים, גינה קטנה עם מזרקה והפתח אל סמטאות
    סולולאקי.'
  body: >-
    **כבר מאתיים שנה טביליסי באה לכיכר הקטנה הזאת לקנות: פעם תוצרת כפרית, ציוד עודף של חיילים ולפי הסיפור
    גם את עץ חג המולד הראשון בעיר; היום — זרועות מלאות פרחים.**


    בראשית המאה ה-19 מכרו כאן בני הכפרים תוצרת טרייה. מ-1828 נקרא המקום "כיכר הדואר"; בשנים 1876 עד 1903
    פעל כאן "שוק החיילים", שבו מכרו החיילים בימי ראשון את ציודם הצבאי; ואחר כך, עד שנות ה-30 של המאה ה-20,
    "שוק הרוסים". מספרים שעץ חג המולד הראשון שנמכר אי פעם בטביליסי החליף ידיים כאן. השנים הסובייטיות הביאו
    שוק קולחוזי ושם חדש: "כיכר הקולחוז". היום נושאת הכיכר את שמו של גריגול אורבליאני (1804–1883), נסיך
    ומשורר של הרומנטיקה הגאורגית.


    בשיקום של 2019 חודשו עשרים בניינים סביב הכיכר, שלושה עשר מהם אתרי מורשת תרבות מוכרזים. כשאתם חוצים
    אותה, הרימו את העיניים: בית פינתי ברחוב אטונלי חובש צריח מכוסה צפחה, ומרפסות ברזל מחושל נוטות מעל
    המדרכות. בשולי הכיכר מציץ קטע מחומת העיר הישנה, תזכורת לכך שביצורי טביליסי עברו בדיוק כאן. במרכז יש
    גינה קטנה עם מזרקה, ובצד התחתון, היכן שסחרו פעם אנשי הקולחוז, חזר לעמוד אולם שוק בעל חזית זכוכית,
    ובו מתחם אוכל וסופרמרקט.


    ובכל זאת, הדופק של המקום הוא דוכני הפרחים. המוכרות מוציאות את הדליים מוקדם, ועד אמצע הבוקר תושבי טביליסי
    כבר נושאים משם ורדים וזרים עונתיים — לימי הולדת, לביקורים ולבקשות סליחה. אולמות הכניסה בסגנון אר נובו
    של סולולאקי נמצאים במרחק כמה דקות עלייה ברגל.


    צאו משם עם זר ממה שפורח בעונה: בעיר הזאת אין דבר מקומי יותר שאפשר לשאת בידיים.
  tip: >-
    אם הפרחים חשובים לכם, בואו בבוקר: המסחר מתחיל מוקדם והמבחר הטוב ביותר הוא לפני הצהריים. הכיכר עצמה
    דורשת חצי שעה; עם הרחובות הצדדיים של סולולאקי הקצו שעה וחצי. בבתי הקפה מסביב המחירים סבירים, ואולם
    השוק הוא המקום הנוח ביותר לקפה, לנשנוש ולשירותים. הבוקר הוא גם הזמן הטוב ביותר לצילום, לפני שהכיכר
    נכנסת לצל. בטביליסובה באוקטובר ובשבועות שלפני השנה החדשה הכיכר מתמלאת לעיתים קרובות בדוכנים ובאורות.
  route: >-
    כיכר אורבליאני נמצאת כחצי ק"מ מכיכר החירות, מוקפת ברחובות אטונלי, וקואה, טבוקשווילי ופורצלאדזה. ברגל
    זה שבע דקות, כך שאם הרכב השכור כבר חונה במרכז, השאירו אותו במקומו. אם בכל זאת נוסעים, יש חניון תת-קרקעי
    מתחת לסופרמרקט שבצד התחתון של הכיכר, וחניה אזורית בתשלום ברחובות הסמוכים (אפליקציית Tbilisi Parking).
    בימי חול אטונלי ווקואה נסתמים בשעות העומס והסמטאות צרות, ולכן רכב קומפקטי מקטגוריית אקונומי הוא בדיוק
    הכלי הנכון. כביש סלול לכל אורך הדרך.
ar:
  name: ساحة أوربلياني
  short: 'ساحة السوق القديمة في تبليسي، رُمِّمت عام 2019: أكشاك الزهور، وحديقة صغيرة بنافورة، وبوابة إلى
    أزقّة سولولاكي.'
  body: >-
    **منذ مئتي عام وتبليسي تقصد هذه الساحة الصغيرة للتسوّق: كانت تأتيها قديماً من أجل غلال القرى وفائض
    عُدّة الجنود، ويُروى أنها اشترت منها أول شجرة عيد ميلاد في المدينة؛ واليوم تأتيها من أجل باقات الزهور.**


    في مطلع القرن التاسع عشر كان القرويون يبيعون هنا منتجاتهم الطازجة. ومنذ عام 1828 عُرف المكان باسم
    «ساحة البريد»، ثم صار من 1876 إلى 1903 «سوق الجنود»، حيث كان الجنود يبيعون أيام الأحد عتادهم العسكري،
    وبعد ذلك، حتى ثلاثينيات القرن العشرين، «سوق الروس». ويُقال إن أول شجرة عيد ميلاد بيعت في تبليسي انتقلت
    من يد إلى يد هنا. وجاءت الحقبة السوفييتية بسوق الكولخوز وباسم جديد: «ساحة الكولخوز». أما اليوم فتحمل
    الساحة اسم غريغول أوربلياني (1804–1883)، الأمير وشاعر الرومانسية الجورجية.


    في أعمال التأهيل عام 2019 جُدِّد عشرون مبنى حول الساحة، ثلاثة عشر منها معالم مسجّلة في التراث الثقافي.
    ارفع بصرك وأنت تعبرها: بيت على ناصية شارع أتونيلي يعتمر برجاً صغيراً مكسوّاً بألواح الأردواز، وشرفات
    من الحديد المطاوع تنحني فوق الأرصفة. وعند طرف الساحة يطلّ جزء من سور المدينة القديم، يذكّر بأن تحصينات
    تبليسي كانت تمرّ من هنا تماماً. وفي الوسط حديقة صغيرة بنافورة، وعلى الجانب السفلي، حيث كان فلاحو الكولخوز
    يتاجرون، عادت قاعة سوق بواجهة زجاجية تضم ردهة طعام ومتجراً كبيراً.


    ومع ذلك يبقى نبض المكان في أكشاك الزهور. تصفّ البائعات دلاءهن منذ الصباح الباكر، وما إن ينتصف الصباح
    حتى يكون أهل تبليسي قد حملوا الورود والباقات الموسمية: لأعياد الميلاد، وللزيارات، ولطلب الصفح. أما
    مداخل سولولاكي المزيّنة على طراز الآرت نوفو فعلى بُعد دقائق من الصعود.


    غادِر وفي يدك باقة مما يزهر في موسمه: ففي هذه المدينة لا شيء أكثر محلّية منها يمكنك أن تحمله.
  tip: >-
    إن كانت الزهور تهمّك فتعالَ صباحاً: يبدأ البيع مبكراً وأفضل الخيارات قبل الظهر. الساحة نفسها تحتاج
    إلى نصف ساعة، ومع الشوارع الجانبية في سولولاكي خصِّص ساعة ونصفاً. أسعار المقاهي المحيطة معتدلة، وقاعة
    السوق أسهل مكان لفنجان قهوة ووجبة خفيفة ودورة مياه. والصباح أيضاً أفضل وقت للتصوير قبل أن يغمر الظل
    الساحة. وفي مهرجان تبليسوبا في أكتوبر وفي الأسابيع السابقة لرأس السنة كثيراً ما تمتلئ الساحة بالأكشاك
    والأضواء.
  route: >-
    تقع ساحة أوربلياني على بُعد نحو نصف كيلومتر من ساحة الحرية، وتحيط بها شوارع أتونيلي وفيكوا وتابوكاشفيلي
    وبورتسيلادزه. المسافة سيراً سبع دقائق، فإن كانت سيارتك المستأجرة مركونة في الوسط فاتركها حيث هي. وإن
    قُدتَ إليها فهناك موقف تحت الأرض أسفل المتجر الكبير في الجانب السفلي من الساحة، ومواقف مدفوعة ضمن
    نظام المناطق في الشوارع المجاورة (تطبيق Tbilisi Parking). في أيام العمل يختنق شارعا أتونيلي وفيكوا
    في ساعات الذروة والأزقة ضيقة، لذا فالسيارة الاقتصادية الصغيرة هي الأداة المناسبة تماماً. الطريق معبّد
    حتى النهاية.
