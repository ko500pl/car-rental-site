ka:
  name: ორბელიანის მოედანი
  short: >-
    ფერადი, 2019 წელს განახლებული კვარტალი ყვავილების ბაზრით — სოლოლაკის კარიბჭე თავისუფლების მოედნიდან
    ორ ნაბიჯში.
  body: >-
    **ორბელიანის მოედანი თბილისის ყველაზე ფერადი კუთხეა** — პასტელისფრად შეღებილი, აივნებიანი სახლების
    კვარტალი, რომელიც 2019 წლის განახლების შემდეგ ქალაქის ერთ-ერთ ყველაზე ფოტოგენურ ადგილად იქცა.


    მოედანს ორსაუკუნოვანი სავაჭრო ისტორია აქვს: XIX საუკუნის დასაწყისში აქ პროდუქტის ბაზარი იყო, 1828
    წლიდან ადგილს „ფოსტის მოედანი“ ერქვა, 1876–1903 წლებში კი „სალდათის ბაზარი“. 2019 წლის რეაბილიტაციისას
    ოცი შენობა აღდგა, მათგან ცამეტი კულტურული მემკვიდრეობის ძეგლია. მოედნის ცენტრში პატარა სკვერი და შადრევანია,
    კიდეზე კი ქალაქის ძველი გალავნის ნაშთები ჩანს.


    რითაც მოედანი ცოცხლობს:


    - ყვავილების ბაზარი თაღოვან პავილიონებში — თბილისელები საჩუქრად ყვავილს დღემდე აქ ყიდულობენ

    - განახლებული ბაზრის შენობა კვების დარბაზითა და ადგილობრივი პროდუქტით

    - ფერადი ფასადები, რომელთა უკან სოლოლაკის უბანი იწყება


    აქედან იოლად გადაინაცვლებ სოლოლაკის არტ-ნუვოს სადარბაზოებისკენ ან რუსთაველისკენ. საღამოს კაფეები და
    ბარები ივსება და მოედანი გვიანობამდე ფხიზლობს; დეკემბერში აქ საშობაო ბაზრობაც იმართება — განათებითა
    და ცხელი ღვინით.
  tip: >-
    დილით მოდი, თუ ყვავილების ბაზრის ნახვა გინდა — ვაჭრობა ადრე იწყება და არჩევანიც მაშინაა. მოედანი მცირეა,
    ნახევარი საათი ჰყოფნის, მაგრამ სოლოლაკის შესახვევებთან ერთად ადვილად საათნახევრად იქცევა. კაფეებში
    ფასები ზომიერია, ტუალეტი ბაზრის შენობაშია. ფოტოებისთვის საუკეთესო შუქი დილის საათებშია, სანამ მოედანი
    ჩრდილში არ შევა.
  route: >-
    თავისუფლების მოედნიდან ორბელიანამდე მანქანით ხუთი წუთია, ფეხით — შვიდი, ასე რომ, ცენტრში მდგომი მანქანა
    ჯობია ადგილზე დატოვო. თუ მაინც მიდიხარ, მოედნის ქვედა დონეზე სუპერმარკეტის მიწისქვეშა პარკინგია, გარშემო
    ქუჩებზე კი ზონალური ფასიანი დგომა (Tbilisi Parking-ის აპი). სამუშაო დღეებში პიკის საათებში ატონელისა
    და ვეკუას ქუჩები იტვირთება. გზა მთლიანად ასფალტია და ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Orbeliani Square
  short: >-
    A colourful quarter renovated in 2019, with a flower market and pastel facades — the gateway to Sololaki,
    steps from Freedom Square.
  body: >-
    **Orbeliani Square is the most colourful corner of Tbilisi** — a quarter of pastel-painted, balconied
    houses that the 2019 renovation turned into one of the city's most photogenic spots.


    The square has two centuries of trading history: in the early 19th century a produce market stood
    here, from 1828 the place was known as Post Square, and in 1876–1903 as the Soldier's Bazaar. The
    2019 rehabilitation restored twenty buildings, thirteen of them listed cultural heritage monuments.
    A small garden and fountain occupy the centre, and remnants of the old city fortification wall show
    at the edge.


    What keeps the square alive:


    - The flower market in its arched pavilions — Tbilisians still buy their bouquets here

    - The reborn covered bazaar with a food hall and local produce

    - Pastel facades behind which the Sololaki district begins


    From here it's an easy drift into Sololaki's Art Nouveau hallways or up to Rustaveli. In the evening
    the cafés and bars fill up and the square stays awake late; in December a Christmas market usually
    adds lights and mulled wine to the mix.
  tip: >-
    Come in the morning if the flower market matters to you — trade starts early and that's when the choice
    is best. The square itself is small, half an hour covers it, but with Sololaki's side lanes it easily
    stretches to ninety minutes. Café prices are moderate; toilets are in the market building. The best
    light for photos is in the morning hours, before the square falls into shade.
  route: >-
    From Freedom Square it's five minutes by car and seven on foot, so if your rental is already parked
    in the centre, just walk. If you do drive, there's an underground car park beneath the supermarket
    on the square's lower level, and zonal paid street parking around (Tbilisi Parking app). On weekdays
    Atoneli and Vekua streets clog at rush hour. Asphalt all the way; an economy car is entirely sufficient.
ru:
  name: Площадь Орбелиани
  short: >-
    Разноцветный квартал, обновлённый в 2019 году, с цветочным рынком и пастельными фасадами — ворота
    Сололаки в двух шагах от площади Свободы.
  body: >-
    **Площадь Орбелиани — самый разноцветный уголок Тбилиси:** квартал пастельных домов с балконами, который
    после реновации 2019 года стал одним из самых фотогеничных мест города.


    У площади два века торговой истории: в начале XIX века здесь стоял продуктовый рынок, с 1828 года
    место называлось Почтовой площадью, а в 1876–1903 годах — Солдатским базаром. При реабилитации 2019
    года восстановили двадцать зданий, тринадцать из них — памятники культурного наследия. В центре —
    небольшой сквер с фонтаном, а с краю видны остатки старой городской крепостной стены.


    Чем живёт площадь:


    - Цветочный рынок в арочных павильонах — тбилисцы до сих пор покупают букеты именно здесь

    - Возрождённый крытый базар с фуд-холлом и местными продуктами

    - Пастельные фасады, за которыми начинается район Сололаки


    Отсюда легко перетечь в парадные ар-нуво Сололаки или подняться к Руставели. Вечером кафе и бары заполняются
    — площадь бодрствует допоздна.
  tip: >-
    Приходите утром, если вам важен цветочный рынок: торговля начинается рано, и выбор лучше всего именно
    тогда. Сама площадь невелика, получаса хватит, но вместе с переулками Сололаки прогулка легко растягивается
    на полтора часа. Цены в кафе умеренные; туалет — в здании базара. Лучший свет для фотографий утром,
    пока площадь не ушла в тень.
  route: >-
    От площади Свободы сюда пять минут на машине и семь пешком, так что если арендованный автомобиль уже
    стоит в центре — просто прогуляйтесь. Если всё же едете, под супермаркетом на нижнем уровне площади
    есть подземный паркинг, а вокруг — зональная платная парковка (приложение Tbilisi Parking). В будни
    улицы Атонели и Векуа забиваются в час пик. Асфальт на всём пути; эконом-класса вполне достаточно.
fa:
  name: میدان اربلیانی
  short: محله‌ای رنگارنگ و نوسازی‌شده در ۲۰۱۹ با بازار گل و نماهای پاستلی — دروازهٔ سولولاکی، چند قدم
    از میدان آزادی.
  body: >-
    **میدان اربلیانی رنگارنگ‌ترین گوشهٔ تفلیس است** — محله‌ای از خانه‌های بالکن‌دارِ پاستلی‌رنگ که پس
    از نوسازی ۲۰۱۹ به یکی از عکاسانه‌ترین نقاط شهر بدل شد.


    این میدان دو قرن پیشینهٔ بازرگانی دارد: اوایل سدهٔ نوزدهم اینجا بازار تره‌بار بود، از ۱۸۲۸ «میدان
    پست» نام داشت و در ۱۸۷۶–۱۹۰۳ «بازار سربازان». در بازسازی ۲۰۱۹ بیست ساختمان مرمت شد که سیزده‌تای آن‌ها
    بناهای ثبت‌شدهٔ میراث فرهنگی‌اند. در میانهٔ میدان باغچه‌ای کوچک و فواره‌ای است و در حاشیه بقایای حصار
    قدیمی شهر دیده می‌شود.


    میدان با این‌ها زنده است:


    - بازار گل در غرفه‌های طاق‌دار — اهالی تفلیس هنوز دسته‌گل‌شان را از اینجا می‌خرند

    - بازار سرپوشیدهٔ احیاشده با سالن غذا و محصولات محلی

    - نماهای پاستلی که پشت‌شان محلهٔ سولولاکی آغاز می‌شود


    از اینجا به‌آسانی می‌توان به راهروهای آرت‌نووی سولولاکی سر کشید یا به روستاولی رفت. شب‌ها کافه‌ها
    و بارها پر می‌شوند — میدان تا دیروقت بیدار است.
  tip: >-
    اگر بازار گل برایتان مهم است صبح بیایید — خرید و فروش زود آغاز می‌شود و بهترین انتخاب همان وقت است.
    خود میدان کوچک است و نیم ساعت بس است، اما با کوچه‌های سولولاکی به‌راحتی به یک ساعت و نیم می‌رسد. قیمت
    کافه‌ها معتدل است؛ سرویس بهداشتی در ساختمان بازار است. بهترین نور عکاسی ساعات صبح است، پیش از آنکه
    میدان در سایه فرو رود.
  route: >-
    از میدان آزادی تا اینجا با خودرو پنج دقیقه و پیاده هفت دقیقه است؛ پس اگر خودروی اجاره‌ای‌تان در مرکز
    پارک است، پیاده بیایید. اگر با خودرو می‌روید، زیر سوپرمارکتِ سطح پایینی میدان پارکینگ زیرزمینی هست
    و در خیابان‌های اطراف پارک حاشیه‌ای پولی منطقه‌ای (اپلیکیشن Tbilisi Parking). روزهای کاری خیابان‌های
    آتونلی و وکوا در ساعات شلوغی بند می‌آیند. تمام مسیر آسفالت است و خودروی اقتصادی کاملاً کافی.
he:
  name: כיכר אורבליאני
  short: רובע צבעוני ששופץ ב-2019, עם שוק פרחים וחזיתות פסטל — שער לסולולאקי, צעדים ספורים מכיכר החירות.
  body: >-
    **כיכר אורבליאני היא הפינה הצבעונית ביותר של טביליסי** — רובע של בתים בצבעי פסטל עם מרפסות, שהשיפוץ
    של 2019 הפך לאחד המקומות המצטלמים ביותר בעיר.


    לכיכר מאתיים שנות היסטוריה של מסחר: בראשית המאה ה-19 עמד כאן שוק תוצרת, מ-1828 נקרא המקום «כיכר הדואר»,
    ובשנים 1876–1903 «בזאר החיילים». בשיקום של 2019 שוחזרו עשרים בניינים, שלושה עשר מהם אתרי מורשת תרבות
    מוכרזים. במרכז גינה קטנה ומזרקה, ובשוליים נראים שרידי חומת הביצורים הישנה של העיר.


    ממה חיה הכיכר:


    - שוק הפרחים בביתנים המקומרים — תושבי טביליסי עדיין קונים כאן את הזרים שלהם

    - הבזאר המקורה שקם לתחייה, עם אולם אוכל ותוצרת מקומית

    - חזיתות פסטל שמאחוריהן מתחיל רובע סולולאקי


    מכאן קל להיסחף אל חדרי המדרגות בסגנון אר-נובו של סולולאקי או לעלות לרוסתוולי. בערב בתי הקפה והברים
    מתמלאים — הכיכר ערה עד שעה מאוחרת.
  tip: >-
    בואו בבוקר אם שוק הפרחים חשוב לכם — המסחר מתחיל מוקדם ואז המבחר במיטבו. הכיכר עצמה קטנה, חצי שעה מספיקה,
    אבל עם סמטאות סולולאקי הטיול מתארך בקלות לשעה וחצי. מחירי בתי הקפה סבירים; שירותים בבניין הבזאר. האור
    הטוב ביותר לצילום בשעות הבוקר, לפני שהכיכר נכנסת לצל.
  route: >-
    מכיכר החירות מגיעים לכאן בחמש דקות נסיעה או שבע דקות הליכה, כך שאם הרכב השכור כבר חונה במרכז — פשוט
    לכו ברגל. אם בכל זאת נוסעים, יש חניון תת-קרקעי מתחת לסופרמרקט במפלס התחתון של הכיכר, וחניה אזורית
    בתשלום ברחובות שמסביב (אפליקציית Tbilisi Parking). בימי חול רחובות אטונלי ווקואה נסתמים בשעות העומס.
    אספלט לכל הדרך; רכב חסכוני מספיק בהחלט.
ar:
  name: ساحة أوربلياني
  short: حي ملوّن جُدد عام 2019 بسوق زهور وواجهات باستيلية — بوابة سولولاكي على خطوات من ساحة الحرية.
  body: >-
    **ساحة أوربلياني أكثر أركان تبليسي تلوناً** — حي من البيوت الباستيلية ذات الشرفات، حوّله تجديد عام
    2019 إلى واحد من أكثر أماكن المدينة جاذبية للتصوير.


    للساحة قرنان من تاريخ التجارة: في مطلع القرن التاسع عشر قام هنا سوق للمنتجات، ومنذ 1828 عُرف المكان
    بـ«ساحة البريد»، وبين 1876 و1903 بـ«بازار الجنود». وفي إعادة تأهيل 2019 رُمم عشرون مبنى، ثلاثة عشر
    منها معالم تراث ثقافي مسجلة. في الوسط حديقة صغيرة ونافورة، وتظهر عند الطرف بقايا سور المدينة القديم.


    بماذا تنبض الساحة:


    - سوق الزهور في أجنحته المقوسة — ما زال أهل تبليسي يشترون باقاتهم من هنا

    - البازار المسقوف المُحيا من جديد بقاعة طعام ومنتجات محلية

    - واجهات باستيلية يبدأ خلفها حي سولولاكي


    من هنا يسهل الانسياب إلى مداخل سولولاكي بطراز الآر نوفو أو الصعود إلى روستافيلي. وفي المساء تمتلئ
    المقاهي والحانات — فالساحة تسهر حتى وقت متأخر.
  tip: >-
    تعال صباحاً إن كان سوق الزهور يهمك — فالبيع يبدأ باكراً وحينها يكون الخيار في أفضله. الساحة نفسها
    صغيرة ونصف ساعة تكفيها، لكن مع أزقة سولولاكي تمتد الجولة بسهولة إلى ساعة ونصف. أسعار المقاهي معتدلة؛
    ودورات المياه في مبنى البازار. أفضل ضوء للتصوير في ساعات الصباح قبل أن تدخل الساحة في الظل.
  route: >-
    من ساحة الحرية إلى هنا خمس دقائق بالسيارة وسبع سيراً، فإن كانت سيارتك المستأجرة مركونة في الوسط فامشِ
    ببساطة. وإن قدت، فثمة موقف تحت الأرض أسفل السوبرماركت في المستوى السفلي للساحة، وحولها مواقف مدفوعة
    بالمناطق (تطبيق Tbilisi Parking). في أيام العمل يزدحم شارعا أتونيلي وفيكوا في ساعات الذروة. الطريق
    معبّد بالكامل؛ وسيارة اقتصادية تكفي تماماً.
