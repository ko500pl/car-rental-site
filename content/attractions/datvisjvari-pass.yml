ka:
  name: დათვისჯვრის უღელტეხილი
  short: >-
    2680-მეტრიანი ხრეშიანი უღელტეხილი კავკასიონის წყალგამყოფზე, რომელიც ხევსურეთს შუაზე ყოფს — შატილის
    ერთადერთი გზა, მხოლოდ თბილ თვეებში ღია.
  body: >-
    **დათვისჯვარზე კავკასიონი წყალს გზას უნაწილებს: ერთ მხარეს ნაკადულები სამხრეთით, არაგვისკენ მიედინება,
    მეორე მხარეს — ჩრდილოეთით, არღუნისკენ, და საქართველოს სცილდება.**


    უღელტეხილი ზღვის დონიდან დაახლოებით 2680 მეტრზეა (ქართული ენციკლოპედიით — 2677 მ) და კავკასიონის მთავარ
    წყალგამყოფ ქედს კვეთს. ის თავად ხევსურეთსაც შუაზე ყოფს: უკან პირაქეთა ხევსურეთი რჩება, ხევსურეთის
    არაგვის ხეობა, წინ კი პირიქითა ხევსურეთი იშლება — არღუნის ხეობა შატილითა და მუცოთი. გზა აქ 1970-იან
    წლებში გაიყვანეს, დღემდე არ მოუასფალტებიათ და პირიქითა ხევსურეთს სხვა სამანქანო გზა დღესაც არ უკავშირდება.


    რასაც აქ ხედავთ, უმეტესად თავად მთის მასალაა: გზისპირას იურული თიხაფიქალი იფშვნება, ფერდობებს ალპური
    მდელო ფარავს, გზა კი სერპანტინებით მიიკლაკნება, ადგილ-ადგილ ათპროცენტიანი ქანობით. ჩრდილოეთის დაღმართზე
    გზას ნაკადულები და ჩანჩქერები კვეთს, წვიმის შემდეგ კი ისინი მოულოდნელად ადიდდებიან. მოწმენდილ დილას
    ქედები ყოველი მხრიდან ერთმანეთს ეფინება; შუადღისთვის ღრუბელი ხშირად უღელტეხილზე წამოწვება და მთელი
    სამყარო მანქანის წინ რამდენიმე მეტრ ხრეშად იკუმშება.


    გადმოცემით, სახელი — „დათვისჯვარი“ — იმ დიდ მარმარილოს ჯვარს უკავშირდება, რომელიც რუსეთის იმპერიის
    დროს ამ წყალგამყოფს აღნიშნავდა. დათვი რა შუაშია, დღეს აღარავინ იცის.


    თოვლი უღელტეხილს ჩვეულებრივ ოქტომბერში კეტავს და მხოლოდ გაზაფხულის ბოლოს უშვებს. წლის უდიდეს ნაწილს
    დათვისჯვარი დაკეტილი კარია; იმ რამდენიმე თვეში კი, როცა იღება, გაღმა გადასასვლელი სხვა გზა არ არსებობს.
  tip: >-
    გასვლამდე გადაამოწმეთ, ღიაა თუ არა გზა: გაზაფხულის ბოლოს და შემოდგომით უღელტეხილი შეიძლება მოულოდნელად
    დაიკეტოს. გადადით დილით — შუადღისთვის ღრუბელი ხშირად ქედზე ჯდება და ხედსაც თან წაიღებს. ზემოთ მანქანა
    გზიდან კარგად გადაიყვანეთ, მოსახვევებს მოშორებით; ბრმა სერპანტინზე არასოდეს გაჩერდეთ. ამ სიმაღლეზე
    ივლისშიც ცივა და ქრის, ამიტომ თბილი ტანსაცმელი თან იქონიეთ. ბოლო მაღაზია და ბენზინგასამართი ბარისახოშია,
    24 კილომეტრით ქვემოთ. ძლიერი წვიმის შემდეგ ჩრდილოეთ მხარეს ნაკადულის გადასასვლელთან ჯერ მანქანიდან
    გადმოდით, დაათვალიერეთ და მერე გადადით.
  route: >-
    თბილისიდან ს1 (E60) გზით მცხეთისკენ გადით და საქართველოს სამხედრო გზით (ს3/E117) ჩრდილოეთით ჟინვალამდე
    იარეთ — დაახლოებით 53 კმ. იქ შ26 გზაზე (ჟინვალი — ბარისახო — შატილი) გადადით, რომელიც არაგვის ხეობას
    ბარისახომდე მიუყვება (თბილისიდან დაახლოებით 105 კმ) — ასფალტითა და დაკერებული ბეტონით. ბარისახოს შემდეგ
    ხრეში იწყება: დაახლოებით 24 კმ სერპანტინი, ათ პროცენტამდე ქანობით, უღელტეხილამდე — სულ დაახლოებით
    129 კმ. გაითვალისწინეთ ოთხი საათი. საჭიროა მაღალი კლირენსის ჯიპი (სასურველია 4x4); წვიმის შემდეგ ოთხივე
    წამყვანი თვალი აუცილებელია. რეალური სეზონი: ივნისიდან ოქტომბრის დასაწყისამდე.
en:
  name: Datvisjvari Pass
  short: >-
    The 2,680-metre gravel pass on the Caucasus watershed that splits Khevsureti in two: the only road
    to Shatili, open only in the warm months.
  body: >-
    **On Datvisjvari the Caucasus decides where the water goes: streams on one side run south to the Aragvi,
    on the other north to the Argun and out of Georgia.**


    The pass, about 2,680 metres high (the Georgian Encyclopaedia gives 2,677 m), crosses the main watershed
    ridge of the Greater Caucasus — and it divides Khevsureti itself. Behind you lies Piraketa Khevsureti,
    "this side", in the valley of the Khevsureti Aragvi; ahead opens Pirikita Khevsureti, "the far side",
    with Shatili and Mutso in the gorge of the Argun. The road over the top was cut in the 1970s, has
    never been paved, and is still the only road into that far side.


    What you see up here is mostly what the mountain is made of. Dark Jurassic shale crumbles along the
    verge, alpine meadow covers the slopes, and the track climbs in switchbacks with ramps of up to 10
    per cent. On the northern descent, streams and waterfalls cross the road and can swell without warning
    after rain. On a clear morning the ridges stack up in every direction; by afternoon cloud often settles
    on the crest, and the whole world shrinks to a few metres of gravel in front of the bonnet.


    Tradition says the name — "Bear's Cross" — goes back to a great marble cross that marked this watershed
    in the days of the Russian Empire. What the bear has to do with it, no one now can say.


    Snow usually shuts the pass in October and lets go only in late spring. For most of the year Datvisjvari
    is a closed door; for the few months it opens, it is the only way through.
  tip: >-
    Before setting out, check that the road is open: in late spring and autumn the pass can close at short
    notice. Cross in the morning — cloud tends to settle on the crest by afternoon and takes the view
    with it. On the top, pull well off the track and clear of the bends; never stop on a blind switchback.
    Even in July it can be cold and windy at this height, so bring a warm layer. The last shop and fuel
    are at Barisakho, 24 km below. After heavy rain, get out and look at the stream crossings on the northern
    side before you drive through.
  route: >-
    Leave Tbilisi on the S1 (E60) towards Mtskheta and follow the Georgian Military Highway (S3/E117)
    north to Zhinvali, about 53 km. There turn onto the Sh26, the Zhinvali–Barisakho–Shatili road, which
    runs up the Aragvi valley to Barisakho, roughly 105 km from Tbilisi, on asphalt and patched concrete.
    Beyond Barisakho the gravel begins: about 24 km of switchbacks, with ramps of up to 10 per cent, to
    the crest — some 129 km in all. Allow about four hours. Take a high-clearance SUV, ideally 4x4; after
    rain the 4x4 becomes essential. Realistic season: June to early October.
ru:
  name: Перевал Датвисджвари
  short: >-
    Гравийный перевал высотой 2680 м на водоразделе Кавказа, разрезающий Хевсурети надвое: единственная
    дорога в Шатили, открытая лишь в тёплые месяцы.
  body: >-
    **На Датвисджвари Кавказ решает, куда течь воде: ручьи по одну сторону бегут на юг, к Арагви, по другую
    — на север, к Аргуну и прочь из Грузии.**


    Перевал высотой около 2680 метров (Грузинская энциклопедия даёт 2677 м) пересекает Главный водораздельный
    хребет Большого Кавказа — и делит надвое саму Хевсурети. За спиной у вас Пиракетская Хевсурети, «по
    эту сторону», в долине Хевсурской Арагви; впереди открывается Пирикитская Хевсурети, «по ту сторону»,
    с Шатили и Муцо в ущелье Аргуна. Дорогу через перевал проложили в 1970-х годах; её так и не заасфальтировали,
    и она по-прежнему остаётся единственным путём на ту сторону.


    То, что вы видите наверху, — в основном то, из чего сложена сама гора. Вдоль обочины крошится тёмный
    юрский сланец, склоны покрыты альпийскими лугами, а дорога взбирается серпантином с участками уклона
    до 10 процентов. На северном спуске дорогу пересекают ручьи и водопады, которые после дождя могут
    внезапно вздуться. Ясным утром хребты громоздятся во все стороны; после полудня на гребень часто ложится
    облако, и весь мир сжимается до нескольких метров гравия перед капотом.


    Предание гласит, что название — «Медвежий крест» — восходит к большому мраморному кресту, отмечавшему
    этот водораздел во времена Российской империи. При чём здесь медведь, сегодня уже никто не скажет.


    Снег обычно закрывает перевал в октябре и отпускает лишь в конце весны. Большую часть года Датвисджвари
    — запертая дверь; в те немногие месяцы, когда она открыта, это единственный проход.
  tip: >-
    Перед выездом убедитесь, что дорога открыта: поздней весной и осенью перевал могут закрыть почти без
    предупреждения. Переезжайте утром — после полудня на гребень обычно ложится облако и забирает с собой
    вид. Наверху съезжайте с дороги подальше от поворотов; никогда не останавливайтесь на слепом витке
    серпантина. Даже в июле на такой высоте бывает холодно и ветрено, так что возьмите тёплую одежду.
    Последние магазин и заправка — в Барисахо, в 24 км ниже. После сильного дождя выйдите из машины и
    осмотрите броды на северной стороне, прежде чем их проезжать.
  route: >-
    Выезжайте из Тбилиси по S1 (E60) в сторону Мцхеты и следуйте по Военно-Грузинской дороге (S3/E117)
    на север до Жинвали, около 53 км. Там сверните на Sh26, дорогу Жинвали — Барисахо — Шатили, которая
    идёт вверх по долине Арагви до Барисахо, примерно в 105 км от Тбилиси, по асфальту и латаному бетону.
    За Барисахо начинается гравий: около 24 км серпантина с уклонами до 10 процентов до гребня — всего
    около 129 км. Закладывайте около четырёх часов. Берите внедорожник с высоким клиренсом, лучше полноприводный;
    после дождя полный привод становится необходимым. Реальный сезон — с июня до начала октября.
fa:
  name: گردنهٔ داتویسجواری
  short: >-
    گردنه‌ای شنی در ۲۶۸۰ متری بر آبپخشان قفقاز که خوسورتی را دو نیم می‌کند: تنها جادهٔ شاتیلی، که فقط
    در ماه‌های گرم باز است.
  body: >-
    **بر داتویسجواری، قفقاز تصمیم می‌گیرد آب به کجا برود: جویبارهای یک سو به جنوب، به سوی آراگوی، روان‌اند
    و جویبارهای سوی دیگر به شمال، به سوی آرگون و بیرون از گرجستان.**


    این گردنه، به بلندی حدود ۲۶۸۰ متر (دانشنامهٔ گرجی ۲۶۷۷ متر آورده است)، از خط‌الرأس اصلی آبپخشان قفقاز
    بزرگ می‌گذرد و خودِ خوسورتی را دو پاره می‌کند. پشت سرتان پیراکتا خوسورتی است، «این سو»، در درهٔ آراگوی
    خوسوری؛ و پیش رویتان پیریکیتا خوسورتی، «آن سو»، با شاتیلی و موتسو در درهٔ آرگون گشوده می‌شود. جادهٔ
    روی گردنه در دههٔ ۱۹۷۰ کشیده شد، هرگز آسفالت نشد و هنوز تنها راهی است که به آن سو می‌رود.


    آنچه این بالا می‌بینید بیشتر همان چیزی است که کوه از آن ساخته شده. شیلِ تیرهٔ ژوراسیک کنار جاده خرد
    می‌شود، چمنزارهای آلپی دامنه‌ها را پوشانده‌اند و جاده با پیچ‌های پیاپی و شیب‌هایی تا ۱۰ درصد بالا
    می‌رود. در سرازیری شمالی، جویبارها و آبشارها از روی جاده می‌گذرند و ممکن است پس از باران بی‌خبر طغیان
    کنند. در صبحی صاف، رشته‌کوه‌ها از هر سو پشت هم صف می‌کشند؛ تا بعدازظهر ابر اغلب بر ستیغ می‌نشیند و
    همهٔ جهان به چند متر شن جلوی کاپوت خودرو کوچک می‌شود.


    روایت‌ها می‌گویند این نام، «صلیب خرس»، به صلیب مرمرین بزرگی بازمی‌گردد که در روزگار امپراتوری روسیه
    این آبپخشان را نشان می‌داد. اما خرس را با این نام چه کار؟ امروز دیگر کسی نمی‌داند.


    برف معمولاً در اکتبر گردنه را می‌بندد و تنها در اواخر بهار رهایش می‌کند. داتویسجواری بیشتر سال دری
    بسته است؛ و در چند ماهی که باز می‌شود، تنها راه گذر است.
  tip: >-
    پیش از راه افتادن، از باز بودن جاده مطمئن شوید: در اواخر بهار و پاییز گردنه ممکن است بی‌خبر بسته شود.
    صبح از گردنه بگذرید؛ ابر معمولاً تا بعدازظهر بر ستیغ می‌نشیند و منظره را با خود می‌برد. در بالای گردنه،
    خودرو را کاملاً بیرون از جاده و دور از پیچ‌ها نگه دارید؛ هرگز در پیچ کور توقف نکنید. حتی در ژوئیه
    در این ارتفاع هوا می‌تواند سرد و بادخیز باشد، پس لباس گرم بیاورید. آخرین مغازه و پمپ بنزین در باریساخو،
    ۲۴ کیلومتر پایین‌تر، است. پس از باران سنگین، پیش از گذشتن از گذرگاه‌های آبی سمت شمال، پیاده شوید و
    آن‌ها را وارسی کنید.
  route: >-
    از تفلیس با جادهٔ S1 (E60) به سوی متسختا بروید و جادهٔ نظامی گرجستان (S3/E117) را به سمت شمال تا ژینوالی،
    حدود ۵۳ کیلومتر، دنبال کنید. آنجا به Sh26، جادهٔ ژینوالی–باریساخو–شاتیلی، بپیچید که در درهٔ آراگوی
    بالا می‌رود تا باریساخو، حدود ۱۰۵ کیلومتری تفلیس، روی آسفالت و بتن وصله‌خورده. پس از باریساخو جادهٔ
    شنی آغاز می‌شود: حدود ۲۴ کیلومتر پیچ‌درپیچ با شیب‌هایی تا ۱۰ درصد تا ستیغ، روی هم حدود ۱۲۹ کیلومتر.
    حدود چهار ساعت وقت بگذارید. شاسی‌بلندی با فاصلهٔ زیاد از زمین بگیرید، ترجیحاً چهارچرخ‌محرک؛ پس از
    باران چهارچرخ‌محرک ضروری می‌شود. فصل واقعی: ژوئن تا اوایل اکتبر.
he:
  name: מעבר דטוויסג'ווארי
  short: >-
    מעבר חצץ בגובה 2,680 מ' על קו פרשת המים של הקווקז, שחוצה את חבסורתי לשניים: הדרך היחידה לשאטילי, פתוחה
    רק בחודשים החמים.
  body: >-
    **בדטוויסג'ווארי הקווקז מחליט לאן ילכו המים: הנחלים בצד אחד זורמים דרומה אל האראגווי, ובצד השני צפונה
    אל נהר הארגון ואל מחוץ לגאורגיה.**


    המעבר, בגובה של כ־2,680 מטרים (האנציקלופדיה הגאורגית נותנת 2,677 מ'), חוצה את רכס פרשת המים הראשי
    של הקווקז הגדול – ומחלק את חבסורתי עצמה. מאחוריכם פיראקטה חבסורתי, "הצד הזה", בעמק האראגווי החבסורי;
    לפניכם נפתחת פיריקיטה חבסורתי, "הצד שמנגד", ובה שאטילי ומוצו בערוץ נהר הארגון. הדרך שחוצה את המעבר
    נפרצה בשנות ה־70, מעולם לא נסללה, ועדיין היא הדרך היחידה אל הצד שמנגד.


    מה שרואים כאן למעלה הוא בעיקר החומר שממנו עשוי ההר. פצלי חרסית כהים מתקופת היורה מתפוררים לאורך השוליים,
    אחו אלפיני מכסה את המדרונות, והדרך מטפסת בעיקולים עם שיפועים של עד 10 אחוזים. בירידה הצפונית חוצים
    את הדרך פלגים ומפלים, שעלולים לתפוח בלי אזהרה אחרי גשם. בבוקר בהיר הרכסים נערמים זה מאחורי זה לכל
    עבר; עד אחר הצהריים ענן מתיישב לא פעם על הרכס, וכל העולם מצטמק לכמה מטרים של חצץ מול מכסה המנוע.


    המסורת מספרת שהשם – "צלב הדוב" – מקורו בצלב שיש גדול שסימן את פרשת המים הזאת בימי האימפריה הרוסית.
    ומה הקשר לדוב? את זה כבר איש אינו יודע היום.


    השלג סוגר בדרך כלל את המעבר באוקטובר ומרפה ממנו רק בסוף האביב. רוב השנה דטוויסג'ווארי הוא דלת נעולה;
    בחודשים הספורים שבהם הוא נפתח, זו הדרך היחידה לעבור.
  tip: >-
    לפני היציאה ודאו שהדרך פתוחה: בסוף האביב ובסתיו המעבר עלול להיסגר בהתראה קצרה. חצו בבוקר – אחר הצהריים
    ענן נוטה להתיישב על הרכס ולוקח איתו את הנוף. למעלה, ירדו לגמרי מהדרך וחנו הרחק מהעיקולים; לעולם אל
    תעצרו בעיקול עיוור. גם ביולי יכול להיות קר ונושבות רוחות עזות בגובה הזה, אז הביאו שכבה חמה. החנות
    ותחנת הדלק האחרונות נמצאות בבריסאחו, 24 ק"מ למטה. אחרי גשם כבד, צאו מהרכב ובדקו את מעברי הנחלים בצד
    הצפוני לפני שאתם חוצים אותם.
  route: >-
    צאו מטביליסי בכביש S1 (E60) לכיוון מצחתה והמשיכו בכביש הצבאי הגאורגי (S3/E117) צפונה עד ז'ינוואלי,
    כ־53 ק"מ. שם פנו לכביש Sh26, כביש ז'ינוואלי–בריסאחו–שאטילי, שעולה במעלה עמק האראגווי עד בריסאחו, כ־105
    ק"מ מטביליסי, על אספלט ובטון מטולא. אחרי בריסאחו מתחיל החצץ: כ־24 ק"מ של עיקולים עם שיפועים של עד
    10 אחוזים עד לראש המעבר – בסך הכול כ־129 ק"מ. הקציבו כארבע שעות. קחו רכב שטח גבוה, רצוי 4x4; אחרי
    גשם ההנעה הכפולה הופכת להכרח. העונה המציאותית: יוני עד תחילת אוקטובר.
ar:
  name: ممر داتفيسجفاري
  short: >-
    ممر حصوي على ارتفاع 2680 متراً فوق خط تقسيم المياه في القوقاز، يشطر خيفسوريتي نصفين: الطريق الوحيد
    إلى شاتيلي، ولا يُفتح إلا في الأشهر الدافئة.
  body: >-
    **على داتفيسجفاري يقرّر القوقاز أين تمضي المياه: جداول أحد الجانبين تجري جنوباً إلى أراغفي، وجداول
    الجانب الآخر شمالاً إلى أرغون وإلى خارج جورجيا.**


    يعبر الممر، على ارتفاع نحو 2680 متراً (تذكر الموسوعة الجورجية 2677 متراً)، خطَّ تقسيم المياه الرئيسي
    في القوقاز الكبير، ويقسم خيفسوريتي نفسها. خلفك خيفسوريتي بيراكيتا، أي «هذا الجانب»، في وادي أراغفي
    الخيفسوري؛ وأمامك تنفتح خيفسوريتي بيريكيتا، أي «الجانب الآخر»، وفيها شاتيلي وموتسو في مضيق أرغون.
    شُقّ الطريق فوق الممر في سبعينيات القرن العشرين، ولم يُعبَّد قط، وما زال الطريق الوحيد إلى ذلك الجانب
    البعيد.


    ما تراه هنا في الأعلى هو في معظمه المادة التي صُنع منها الجبل. طَفَل صفحي جوراسي داكن يتفتّت على حافة
    الطريق، ومروج ألبية تكسو السفوح، والمسلك يصعد في منعطفات متعرجة بانحدارات تصل إلى 10 في المئة. وفي
    النزول الشمالي تعبر الطريقَ جداولُ وشلالات قد تفيض فجأة بعد المطر. في صباح صافٍ تتراكب السلاسل الجبلية
    في كل اتجاه؛ وبحلول العصر كثيراً ما تستقر غيمة على القمة، فينكمش العالم كله إلى بضعة أمتار من الحصى
    أمام غطاء المحرك.


    تقول الرواية المتوارثة إن الاسم، «صليب الدب»، يعود إلى صليب رخامي كبير كان يعلّم خط تقسيم المياه هذا
    في زمن الإمبراطورية الروسية. أما ما شأن الدب بالأمر، فلا أحد يستطيع اليوم أن يقول.


    يغلق الثلج الممر عادة في أكتوبر ولا يُطلقه إلا في أواخر الربيع. معظم العام يظل داتفيسجفاري باباً موصداً؛
    وفي الأشهر القليلة التي يُفتح فيها، يكون المعبر الوحيد.
  tip: >-
    قبل الانطلاق تأكد من أن الطريق مفتوح: ففي أواخر الربيع وفي الخريف قد يُغلق الممر دون إنذار يُذكر.
    اعبر في الصباح، فالغيوم تميل إلى الاستقرار على القمة بعد الظهر وتأخذ المشهد معها. في الأعلى، أوقف
    سيارتك بعيداً عن المسلك تماماً وعن المنعطفات؛ ولا تتوقف أبداً عند منعطف أعمى. حتى في يوليو قد يكون
    الجو بارداً وعاصفاً على هذا الارتفاع، فاحمل طبقة دافئة. آخر متجر ومحطة وقود في باريساخو، على بعد 24
    كم في الأسفل. وبعد المطر الغزير، انزل من السيارة وافحص مخاضات الجداول في الجانب الشمالي قبل أن تعبرها.
  route: >-
    اخرج من تبليسي على الطريق S1 (E60) باتجاه متسخيتا، واتبع الطريق العسكري الجورجي (S3/E117) شمالاً حتى
    جينفالي، نحو 53 كم. هناك انعطف إلى الطريق Sh26، طريق جينفالي–باريساخو–شاتيلي، الذي يصعد في وادي أراغفي
    حتى باريساخو، على بعد نحو 105 كم من تبليسي، على الإسفلت والخرسانة المرقّعة. بعد باريساخو يبدأ الحصى:
    نحو 24 كم من المنعطفات المتعرجة بانحدارات تصل إلى 10 في المئة حتى القمة، أي نحو 129 كم في المجمل.
    خصّص قرابة أربع ساعات. خذ سيارة مرتفعة عن الأرض، ويُفضَّل أن تكون رباعية الدفع؛ وبعد المطر يصبح الدفع
    الرباعي ضرورياً. الموسم الواقعي: من يونيو إلى أوائل أكتوبر.
