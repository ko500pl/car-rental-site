ka:
  name: დათვისჯვრის უღელტეხილი
  short: >-
    2676-მეტრიანი უღელტეხილი შატილის გზაზე — ხევსურეთის კარიბჭე და საქართველოს ერთ-ერთი ყველაზე შთამბეჭდავი
    მთის გზა.
  body: >-
    **დათვისჯვარი ის წერტილია, სადაც ბარი მთავრდება და ხევსურეთი იწყება.** 2676 მეტრზე გრუნტის გზა ქედს
    გადადის და ორივე მხარეს უსასრულო მთის ზღვა იშლება: უკან ფშავის ხეობები რჩება, წინ კი არღუნის ხეობა
    და შატილისკენ დაშვება იწყება. სახელი — „დათვის ჯვარი" — გადმოცემით იმ ჯვარს უკავშირდება, რომელიც ამ
    წყალგამყოფს ჯერ კიდევ რუსეთის იმპერიის დროიდან აღნიშნავდა.


    თავად გზა 1970-იან წლებში გაიყვანეს და დღემდე დაუასფალტებელი დარჩა — და სწორედ ეს არის მისი ხიბლი:


    - **სერპანტინები 10%-იან ქანობებამდე** და ვიწრო მოსახვევები კლდის პირას

    - **პანორამა უღელტეხილიდან** — მოწმენდილ დღეს ხედი კავკასიონის მთავარ ქედამდე მიდის

    - გზად ლებაისკარის კოშკი და ჩანჩქერები დაშვებისას


    ეს საქართველოს ერთ-ერთი ყველაზე ცნობილი „საშიში გზაა", თუმცა მშრალ ამინდში, აუჩქარებლად, ჩვეულებრივი
    მაღალი განივლობის მანქანით სავსებით შესაძლებელია. თოვლი უღელტეხილს წელიწადის დიდ ნაწილს კეტავს — გზა
    რეალურად მხოლოდ ივნისიდან ოქტომბრამდეა გახსნილი. ღრუბლებში მოხვედრისას ხილვადობა რამდენიმე მეტრამდე
    ეცემა.
  tip: >-
    გამგზავრებამდე გზის მდგომარეობა გადაამოწმე — გაზაფხულის ბოლოს და შემოდგომაზე უღელტეხილი მოულოდნელად
    იკეტება. დილით გადადი: შუადღისას ღრუბლები წამოწვება ხოლმე და ხედს კარგავ. უღელტეხილზე გაჩერებისას
    მანქანა მოსახვევს მოარიდე. წყალი, საკვები და თბილი ტანსაცმელი თან იქონიე — 2676 მეტრზე ზაფხულშიც ცივა.
    ბოლო საწვავი და მაღაზია ბარისახოშია.
  route: >-
    თბილისიდან ჟინვალამდე სამხედრო გზით (E117), შემდეგ ბარისახოსკენ — აქამდე ასფალტი და ორმოიანი ბეტონია.
    ბარისახოდან გრუნტი იწყება და გზა სერპანტინებით უღელტეხილისკენ მიიწევს: ჯამში დაახლოებით 125 კმ და
    ოთხი საათი. მაღალი განივლობის SUV აუცილებელია, სველ ამინდში — განსაკუთრებით; ეკონომ-კლასი მხოლოდ კორშამდე
    თუ მივა. საწვავი ჟინვალში ან ბარისახოში ჩაასხი — წინ გასამართი აღარ არის. გზა ივნისიდან ოქტომბრამდეა
    ღია.
en:
  name: Datvisjvari Pass
  short: >-
    The 2,676 m pass on the Shatili road — the gateway to Khevsureti and one of Georgia's most dramatic
    mountain drives.
  body: >-
    **Datvisjvari is the point where the lowlands end and Khevsureti begins.** At 2,676 m the dirt road
    crests the ridge and an endless sea of mountains opens on both sides: behind you lie the Pshavi valleys,
    ahead the Argun gorge and the long descent to Shatili. The name — "Bear's Cross" — is traced to a
    cross that marked this watershed as far back as the Russian Empire era.


    The road itself was built in the 1970s and has never been paved — which is precisely its charm:


    - **Switchbacks with gradients up to 10%** and narrow bends along sheer drops

    - **The panorama from the crest** — on a clear day the view runs to the main Caucasus ridge

    - Lebaiskari tower and roadside waterfalls on the way down


    It ranks among Georgia's most famous "dangerous roads", yet in dry weather, taken unhurried, it is
    entirely feasible in an ordinary high-clearance vehicle. Snow seals the pass for much of the year
    — in practice the road is open only from June to October. When cloud rolls in, visibility can drop
    to a few metres.
  tip: >-
    Check the road status before setting out — in late spring and autumn the pass closes at short notice.
    Cross in the morning: cloud tends to settle in by afternoon and steals the view. If you stop on the
    crest, park well clear of the bends. Carry water, food and warm layers — at 2,676 m it is cold even
    in summer. The last fuel and shops are in Barisakho.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117) to Zhinvali, then head for Barisakho — asphalt
    and potholed concrete this far. Beyond Barisakho the gravel begins and the road climbs the switchbacks
    to the pass: about 125 km and four hours in total. A high-clearance SUV is essential, doubly so in
    wet weather; an economy car gets you no further than Korsha. Refuel in Zhinvali or Barisakho — there
    is nothing beyond. The road is open from June to October.
ru:
  name: Перевал Датвисджвари
  short: Перевал высотой 2676 м на дороге в Шатили — ворота Хевсурети и одна из самых впечатляющих горных
    дорог Грузии.
  body: >-
    **Датвисджвари — точка, где заканчивается равнина и начинается Хевсурети.** На высоте 2676 м грунтовая
    дорога переваливает через хребет, и по обе стороны раскрывается бескрайнее море гор: позади остаются
    долины Пшави, впереди — ущелье Аргуна и долгий спуск к Шатили. Название — «Медвежий крест» — связывают
    с крестом, отмечавшим этот водораздел ещё со времён Российской империи.


    Сама дорога построена в 1970-е годы и так и не была заасфальтирована — в этом и есть её обаяние:


    - **Серпантины с уклонами до 10%** и узкие повороты над обрывами

    - **Панорама с седловины** — в ясный день видно до Главного Кавказского хребта

    - Башня Лебаискари и придорожные водопады на спуске


    Это одна из самых известных «опасных дорог» Грузии, но в сухую погоду, без спешки, она вполне проходима
    на обычной машине с высоким клиренсом. Снег запирает перевал большую часть года — фактически дорога
    открыта только с июня по октябрь. Когда наползают облака, видимость падает до нескольких метров.
  tip: >-
    Перед выездом проверьте состояние дороги — поздней весной и осенью перевал закрывается внезапно. Переваливайте
    утром: после полудня обычно садятся облака и вид пропадает. Останавливаясь на седловине, паркуйтесь
    подальше от поворотов. Возьмите воду, еду и тёплые вещи — на 2676 м холодно даже летом. Последняя
    заправка и магазины — в Барисахо.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге (E117) до Жинвали, дальше на Барисахо — до этого места асфальт
    и разбитый бетон. За Барисахо начинается гравийка, и дорога серпантинами поднимается к перевалу: всего
    около 125 км и четыре часа. SUV с высоким клиренсом обязателен, в дождь — вдвойне; эконом-класс доедет
    максимум до Корши. Заправляйтесь в Жинвали или Барисахо — дальше ничего нет. Дорога открыта с июня
    по октябрь.
fa:
  name: گردنهٔ داتویسجواری
  short: گردنهٔ 2676 متری در جادهٔ شاتیلی — دروازهٔ خوسورتی و یکی از نفس‌گیرترین جاده‌های کوهستانی گرجستان.
  body: >-
    **داتویسجواری همان نقطه‌ای است که دشت تمام می‌شود و خوسورتی آغاز.** در 2676 متری، جادهٔ خاکی از خط‌الرأس
    می‌گذرد و از دو سو دریایی بی‌پایان از کوه گشوده می‌شود: پشت سر دره‌های فشاوی می‌ماند و پیش رو درهٔ
    آرگون و سراشیبی بلند به سوی شاتیلی. نام آن — «صلیب خرس» — به صلیبی بازمی‌گردد که از روزگار امپراتوری
    روسیه این آبریزگاه را نشان می‌کرد.


    خود جاده در دههٔ 1970 ساخته شد و هرگز آسفالت نشد — و جذابیتش دقیقاً در همین است:


    - **پیچ‌های پیاپی با شیب تا 10 درصد** و گردنه‌های باریک بر لبهٔ پرتگاه

    - **چشم‌انداز از فراز گردنه** — در روز صاف نگاه تا خط‌الرأس اصلی قفقاز می‌رود

    - برج لبائیسکاری و آبشارهای کنارجاده در سرازیری


    این جاده در شمار مشهورترین «جاده‌های خطرناک» گرجستان است، اما در هوای خشک و بی‌شتاب، با یک شاسی‌بلند
    معمولی کاملاً شدنی است. برف بیشترِ سال گردنه را می‌بندد — عملاً جاده تنها از ژوئن تا اکتبر باز است.
    وقتی ابر می‌نشیند، دید تا چند متر پایین می‌آید.
  tip: >-
    پیش از حرکت وضعیت جاده را بپرسید — اواخر بهار و در پاییز گردنه بی‌خبر بسته می‌شود. صبح عبور کنید:
    بعدازظهر معمولاً ابر می‌نشیند و منظره را می‌برد. اگر بر فراز گردنه توقف می‌کنید، خودرو را دور از پیچ‌ها
    نگه دارید. آب، خوراک و لباس گرم بردارید — در 2676 متری حتی تابستان سرد است. آخرین سوخت و مغازه در
    باریساخوست.
  route: >-
    از تفلیس با بزرگراه نظامی (E117) تا ژینوالی، سپس به سوی باریساخو — تا اینجا آسفالت و بتن چاله‌دار
    است. بعد از باریساخو شن‌راه آغاز می‌شود و جاده با پیچ‌های پیاپی به گردنه می‌رسد: روی هم حدود 125 کیلومتر
    و چهار ساعت. شاسی‌بلند با ارتفاع مناسب ضروری است، در هوای خیس دوچندان؛ خودروی اقتصادی حداکثر تا کورشا
    می‌رسد. سوخت را در ژینوالی یا باریساخو بزنید — جلوتر هیچ چیز نیست. جاده از ژوئن تا اکتبر باز است.
he:
  name: מעבר דטוויסג'ווארי
  short: מעבר הרים בגובה 2,676 מ' בדרך לשאטילי — השער לחבסורתי ואחת מדרכי ההרים הדרמטיות ביותר בגאורגיה.
  body: >-
    **דטוויסג'ווארי הוא הנקודה שבה נגמרת השפלה ומתחיל חבל חבסורתי.** בגובה 2,676 מ' דרך העפר חוצה את קו
    הרכס, וים אינסופי של הרים נפתח משני הצדדים: מאחור נשארים עמקי פשאווי, ולפנים — ערוץ הארגון והירידה
    הארוכה לשאטילי. השם — "צלב הדוב" — מיוחס לצלב שסימן את קו פרשת המים הזה עוד מימי האימפריה הרוסית.


    הדרך עצמה נסללה בשנות ה-70 של המאה העשרים ומעולם לא כוסתה אספלט — וזה בדיוק קסמה:


    - **פיתולים בשיפועים של עד 10%** ועיקולים צרים מעל מצוקים

    - **הפנורמה מהאוכף** — ביום בהיר המבט מגיע עד רכס הקווקז הראשי

    - מגדל לבאיסקארי ומפלים לצד הדרך בירידה


    היא נמנית עם "הדרכים המסוכנות" המפורסמות של גאורגיה, אבל במזג אוויר יבש, בנסיעה רגועה, היא בהחלט עבירה
    ברכב רגיל בעל מרווח גחון גבוה. השלג נועל את המעבר במשך רוב השנה — בפועל הדרך פתוחה רק מיוני עד אוקטובר.
    כשעננים יורדים, הראות צונחת לכמה מטרים.
  tip: >-
    בדקו את מצב הדרך לפני היציאה — בסוף האביב ובסתיו המעבר נסגר בהתראה קצרה. חצו בבוקר: אחר הצהריים העננים
    נוטים להתיישב וגונבים את הנוף. אם אתם עוצרים על האוכף, חנו רחוק מהעיקולים. קחו מים, אוכל ושכבות חמות
    — בגובה 2,676 מ' קר גם בקיץ. הדלק והחנויות האחרונים בבריסאחו.
  route: >-
    מטביליסי בכביש הצבא הגאורגי (E117) עד ז'ינוואלי, משם לכיוון בריסאחו — עד כאן אספלט ובטון מחורר. אחרי
    בריסאחו מתחיל החצץ, והדרך מטפסת בפיתולים אל המעבר: בסך הכול כ-125 ק"מ וארבע שעות. רכב שטח גבוה הכרחי,
    בגשם שבעתיים; רכב חסכוני יגיע לכל היותר עד קורשה. תדלקו בז'ינוואלי או בבריסאחו — הלאה אין כלום. הדרך
    פתוחה מיוני עד אוקטובר.
ar:
  name: ممر داتفيسجفاري
  short: ممر جبلي على ارتفاع 2676 متراً على طريق شاتيلي — بوابة خيفسوريتي وأحد أكثر طرق الجبال إثارة في
    جورجيا.
  body: >-
    **داتفيسجفاري هو النقطة التي تنتهي عندها السهول وتبدأ خيفسوريتي.** على ارتفاع 2676 متراً يعبر الطريق
    الترابي خط القمم، فينفتح على الجانبين بحر لا ينتهي من الجبال: خلفك تبقى وديان بشافي، وأمامك وادي أرغون
    والانحدار الطويل نحو شاتيلي. الاسم — «صليب الدب» — يُنسب إلى صليب كان يعلّم هذا الحد الفاصل للمياه
    منذ عهد الإمبراطورية الروسية.


    شُقّ الطريق نفسه في سبعينيات القرن العشرين ولم يُعبّد قط — وهنا سحره بالضبط:


    - **منعطفات متعرجة بميول تصل إلى 10%** ومنحنيات ضيقة فوق هاويات سحيقة

    - **البانوراما من أعلى الممر** — في يوم صافٍ يمتد البصر حتى سلسلة القوقاز الرئيسية

    - برج ليبايسكاري وشلالات على جانب الطريق عند النزول


    يُعدّ من أشهر «الطرق الخطرة» في جورجيا، لكنه في الطقس الجاف، وبقيادة متأنية، ممكن تماماً بسيارة عادية
    مرتفعة القاعدة. يقفل الثلج الممر معظم السنة — فالطريق عملياً مفتوح من يونيو إلى أكتوبر فقط. وحين يهبط
    الغيم، تنخفض الرؤية إلى أمتار قليلة.
  tip: >-
    تحقق من حالة الطريق قبل الانطلاق — في أواخر الربيع وفي الخريف يُغلق الممر دون إنذار طويل. اعبر صباحاً:
    فبعد الظهر تستقر الغيوم عادةً وتسرق المشهد. إن توقفت على أعلى الممر، فأوقف السيارة بعيداً عن المنعطفات.
    احمل ماء وطعاماً وملابس دافئة — على 2676 متراً البرد قارس حتى صيفاً. آخر وقود ومتاجر في باريساخو.
  route: >-
    من تبليسي على الطريق العسكري الجورجي (E117) حتى جينفالي، ثم باتجاه باريساخو — حتى هنا إسفلت وخرسانة
    محفّرة. بعد باريساخو يبدأ الحصى ويتسلق الطريق بمنعطفاته نحو الممر: نحو 125 كم وأربع ساعات إجمالاً.
    سيارة دفع رباعي مرتفعة ضرورية، وفي الطقس الرطب ضرورتها مضاعفة؛ السيارة الاقتصادية تصل إلى كورشا على
    الأكثر. تزوّد بالوقود في جينفالي أو باريساخو — فلا شيء بعدهما. الطريق مفتوح من يونيو إلى أكتوبر.
