ka:
  name: ბირთვისის ციხე და კანიონი
  short: >-
    კირქვის კოშკებისა და ვიწრო ხეობების ლაბირინთი თბილისიდან საათში — შუა საუკუნეების აუღებელი ციხე ბუნებრივ
    კლდეებში.
  body: >-
    ბირთვისი ქვემო ქართლის ყველაზე უჩვეულო ადგილია: კირქვის კლდეების მასივი, რომელიც მილიონობით წლის ეროზიამ
    ვიწრო ხეობებად, კოშკებად და ბუნებრივ კარიბჭეებად დაშალა. ტერიტორია სულ რამდენიმე კვადრატულ კილომეტრს
    იკავებს, მაგრამ შიგნით ორიენტაცია მართლაც რთულია — ბილიკები კლდეებს შორის იკლაკნება და ხშირად საკუთარი
    კვალი აღარ ჩანს.


    შუა საუკუნეებში ამ ბუნებრივმა რელიეფმა ციხე-სიმაგრე შექმნა. ბირთვისი XI საუკუნიდან იხსენიება და აუღებლად
    ითვლებოდა: მისი გალავანი ბუნებრივ კლდეებს აერთებდა და თავდაცვისთვის მინიმალური მშენებლობა კმაროდა.
    1403 წელს იგი თემურლენგმა აიღო — ეს იმდენად უჩვეულო მოვლენა იყო, რომ ცალკე აღინიშნა მისი ლაშქრობის
    ქრონიკებში. დღეს შემორჩენილია კედლების ფრაგმენტები და კლდის თხემზე ამართული „სვეტი“ — შორიდან შესამჩნევი
    კოშკი.


    ბირთვისი უპირველესად სალაშქრო ადგილია და არა სამუზეუმო ობიექტი. სტანდარტული მარშრუტი სამიდან ხუთ საათამდე
    გრძელდება, მოიცავს ვიწრო ხეობებში გავლას, პატარა მდინარის კალაპოტს და მოკლე, მაგრამ ციცაბო ასვლებს.
    მონიშვნა სუსტია, ამიტომ გიდის ან GPS-ტრეკის გარეშე ჯგუფის ნაწილი ხშირად იკარგება. ტერიტორია ფორმალურად
    დაცული ბუნების ძეგლია და ბოლო წლებში აქ ხალხის ნაკადი გაიზარდა, თუმცა ინფრასტრუქტურა თითქმის არ განვითარებულა.
    სწორედ ამიტომ ბირთვისი ჯერ კიდევ „ველური“ მარშრუტია და დამოუკიდებელ მომზადებას მოითხოვს.
  tip: >-
    წვიმის დროს და მის შემდეგ კლდე მოლიპულია და ხეობებში წყალი ადის — ასეთ დღეს ბირთვისი გადადეთ. საჭიროა
    ნამდვილი სალაშქრო ფეხსაცმელი, გრძელი შარვალი, ორი ლიტრი წყალი და დატენილი ტელეფონი გადმოწერილი ოფლაინ
    რუკით; ზოგან ხელებით ასვლაც გიწევთ. ბოლო სოფელში მანქანა უფასოდ დგება. ინფრასტრუქტურა არ არის: არც
    კაფე, არც ტუალეტი, არც ბანკომატი — ყველაფერი თან წაიღეთ.
  route: >-
    თბილისიდან გადით რუსთავის გზაზე და შემდეგ თეთრიწყაროს მიმართულებით, სოფელ ტბისამდე — სულ დაახლოებით
    55 კმ და საათი და ოცი წუთი. ძირითადი მონაკვეთი მოასფალტებულია, ბოლო ხუთიოდე კილომეტრი კი გრუნტია,
    ორმოებით და მშრალ ამინდშიც უხეში. ეკონომ კლასის მანქანა აქ არასასურველია — მაღალი კლირენსის კროსოვერი
    ბევრად უსაფრთხოა. ბოლო ბენზინგასამართი და მაღაზია თეთრიწყაროშია, ამიტომ წყალი და საწვავი წინასწარ
    შეავსეთ.
en:
  name: Birtvisi
  short: >-
    A labyrinth of limestone towers and narrow gorges an hour from Tbilisi, with a medieval fortress built
    into natural rock.
  body: >-
    Birtvisi is the strangest piece of terrain in Kvemo Kartli: a massif of limestone that erosion has
    broken into narrow gorges, freestanding towers and natural gateways. The whole area covers only a
    few square kilometres, yet orientation inside it is genuinely difficult — the paths wind between rock
    walls, sightlines close down to a few metres, and people regularly lose track of the way they came
    in.


    In the Middle Ages this natural relief made a fortress. Birtvisi is mentioned from the eleventh century
    and was considered impregnable: its walls simply linked existing cliffs, so very little construction
    was needed to hold it. Timur took it in 1403, an event unusual enough that the chronicles of his campaign
    singled it out. What survives today are fragments of curtain wall and the tower known as **Sveti**,
    the "Pillar", perched on a rock spire and visible from a distance.


    Birtvisi is a hiking destination rather than a monument to be looked at. The standard route takes
    three to five hours and includes squeezing through slot gorges, walking a small stream bed and short
    but steep scrambles. Waymarking is poor, and groups without a guide or a downloaded GPS track routinely
    take wrong turnings.
  tip: >-
    Skip Birtvisi during and just after rain: the limestone turns slippery and water rises in the gorges.
    You need proper hiking shoes, long trousers, two litres of water and a charged phone with an offline
    map, since some sections require using your hands. Park for free in the last village. There is no
    infrastructure at all — no café, no toilet, no ATM and no reliable phone signal inside the canyon
    — so carry everything you will need.
  route: >-
    Leave Tbilisi on the Rustavi road, then head towards Tetritskaro and the village of Tbisi — roughly
    55 km and an hour and twenty. Most of it is paved, but the last five kilometres or so are gravel,
    rutted and rough even in dry weather. An economy car is not advisable here; a crossover with real
    ground clearance is much safer, and after rain the track can become impassable in a low car. The final
    fuel station and shop are in Tetritskaro, so stock up before turning off.
ru:
  name: Биртвиси
  short: Лабиринт известняковых башен и узких ущелий в часе от Тбилиси со средневековой крепостью, встроенной
    в скалы.
  body: >-
    Биртвиси — самый странный рельеф во всей Квемо-Картли: известняковый массив, который эрозия разбила
    на узкие ущелья, отдельно стоящие башни и природные ворота. Вся территория занимает всего несколько
    квадратных километров, но ориентироваться внутри по-настоящему трудно: тропы петляют между скальными
    стенами, обзор сокращается до нескольких метров, и люди регулярно теряют путь, которым вошли.


    В средние века этот природный рельеф превратился в крепость. Биртвиси упоминается с XI века и считался
    неприступным: стены просто соединяли существующие скалы, так что строить приходилось совсем немного.
    В 1403 году крепость взял Тимур — событие настолько необычное, что хроники его похода отметили это
    отдельно. Сегодня сохранились фрагменты стен и башня **Свети**, «Столп», стоящая на скальной игле
    и заметная издалека.


    Биртвиси — это прежде всего маршрут для похода, а не объект для осмотра. Стандартный круг занимает
    от трёх до пяти часов и включает проходы по узким щелям, русло небольшой речки и короткие, но крутые
    подъёмы. Разметка слабая, и группы без проводника или загруженного GPS-трека регулярно уходят не туда.
  tip: >-
    В дождь и сразу после него Биртвиси лучше отложить: известняк становится скользким, а в ущельях поднимается
    вода. Нужны настоящие треккинговые ботинки, длинные брюки, два литра воды и заряженный телефон с офлайн-картой
    — местами придётся подниматься с помощью рук. В последнем селе машину оставляют бесплатно. Инфраструктуры
    нет вообще: ни кафе, ни туалета, ни банкомата, ни устойчивой связи внутри каньона.
  route: >-
    Из Тбилиси выезжайте по дороге на Рустави, затем сворачивайте в сторону Тетрицкаро и села Тбиси —
    всего около 55 км и час двадцать. Большая часть пути асфальтирована, но последние пять километров
    — грунт с колеями, жёсткий даже в сухую погоду. Машина эконом-класса здесь нежелательна, кроссовер
    с реальным клиренсом заметно безопаснее, а после дождя низкий автомобиль может просто не пройти. Последняя
    заправка и магазин — в Тетрицкаро, запасайтесь заранее.
fa:
  name: بیرتویسی
  short: >-
    هزارتویی از برج‌های آهکی و تنگه‌های باریک در یک ساعتی تفلیس، با دژی از سده‌های میانه که در صخرهٔ طبیعی
    ساخته شده است.
  body: >-
    بیرتویسی غریب‌ترین تکه‌زمین کومو کارتلی است: تودهٔ آهکی که فرسایش آن را به تنگه‌های باریک، برج‌های
    تک‌افتاده و دروازه‌های طبیعی شکسته است. تمام منطقه فقط چند کیلومتر مربع است، اما جهت‌یابی درون آن
    واقعاً دشوار است — مسیرها میان دیواره‌های سنگی می‌پیچند، خط دید تا چند متر بسته می‌شود و مردم مرتب
    راه ورودشان را گم می‌کنند.


    در سده‌های میانه همین ناهمواری طبیعی دژی ساخت. بیرتویسی از سدهٔ یازدهم ذکر شده و تسخیرناپذیر شمرده
    می‌شد: دیوارهایش صرفاً صخره‌های موجود را به هم وصل می‌کردند، پس برای نگه داشتنش ساخت‌وساز اندکی لازم
    بود. تیمور در 1403 آن را گرفت، رویدادی چنان غیرعادی که وقایع‌نگاران لشکرکشی او آن را جداگانه برجسته
    کردند. آنچه امروز مانده پاره‌هایی از حصار است و برجی که به **سوتی** یعنی «ستون» شناخته می‌شود، بر
    نوک صخره‌ای نشسته و از دور دیده می‌شود.


    بیرتویسی مقصدی برای پیاده‌روی است نه بنایی برای تماشا. مسیر استاندارد سه تا پنج ساعت طول می‌کشد و
    شامل عبور از شکاف‌های تنگ، راه رفتن در بستر جویباری کوچک و صعودهای کوتاه اما تند است. علامت‌گذاری
    ضعیف است و گروه‌های بدون راهنما یا بدون ترک GPS دانلودشده مرتب راه را اشتباه می‌روند.
  tip: >-
    بیرتویسی را در باران و بلافاصله پس از آن کنار بگذارید: سنگ آهک لغزنده می‌شود و آب در تنگه‌ها بالا
    می‌آید. کفش کوهنوردی مناسب، شلوار بلند، دو لیتر آب و گوشی شارژشده با نقشهٔ آفلاین لازم دارید، چون
    در بعضی بخش‌ها باید از دست کمک بگیرید. در آخرین روستا رایگان پارک کنید. هیچ زیرساختی نیست — نه کافه،
    نه سرویس بهداشتی، نه خودپرداز و نه آنتن قابل‌اتکا درون دره — پس هر چه لازم دارید همراه ببرید.
  route: >-
    از تفلیس جادهٔ روستاوی را بگیرید، سپس به سوی تتریتسکارو و روستای تبیسی بروید — حدود 55 کیلومتر و یک
    ساعت و بیست دقیقه. بیشتر مسیر آسفالت است، اما حدود پنج کیلومتر آخر شنی، شیاردار و حتی در هوای خشک
    ناهموار است. خودروی اقتصادی اینجا توصیه نمی‌شود؛ کراس‌اوور با ارتفاع کف واقعی بسیار مطمئن‌تر است و
    پس از باران این مسیر با خودروی کم‌ارتفاع می‌تواند غیرقابل عبور شود. آخرین پمپ‌بنزین و مغازه در تتریتسکارو
    است، پس پیش از انشعاب ذخیره کنید.
he:
  name: בירתוויסי
  short: מבוך של מגדלי גיר וערוצים צרים במרחק שעה מטביליסי, ובתוכו מבצר מימי הביניים הבנוי בסלע טבעי.
  body: >-
    בירתוויסי הוא פיסת השטח המוזרה ביותר בקוומו קרתלי: גוש גיר שהסחיפה פירקה אותו לערוצים צרים, למגדלים
    עצמאיים ולשערים טבעיים. כל האזור משתרע על כמה קילומטרים רבועים בלבד, ובכל זאת ההתמצאות בתוכו קשה באמת
    — השבילים מתפתלים בין קירות סלע, קווי הראייה נסגרים לכמה מטרים, ואנשים מאבדים באופן קבוע את הדרך שבה
    נכנסו.


    בימי הביניים יצר התבליט הטבעי הזה מבצר. בירתוויסי מוזכר מן המאה ה-11 ונחשב בלתי כביש: החומות שלו פשוט
    חיברו צוקים קיימים, כך שנדרשה בנייה מועטה מאוד כדי להחזיק בו. טימור כבש אותו ב-1403, אירוע חריג דיו
    כדי שכרוניקות מסעו יציינו אותו במיוחד. מה ששרד היום הוא שברי חומת היקף והמגדל המכונה **סווטי**, "העמוד",
    הנטוע על צריח סלע ונראה מרחוק.


    בירתוויסי הוא יעד הליכה ולא מונומנט להתבונן בו. המסלול המקובל אורך שלוש עד חמש שעות וכולל מעבר בסדקי
    סלע צרים, הליכה באפיק נחל קטן וטיפוסים קצרים אך תלולים. הסימון גרוע, וקבוצות בלי מדריך או בלי מסלול
    GPS שהורד מראש טועות בדרך באופן שגרתי.
  tip: >-
    דלגו על בירתוויסי בזמן גשם ומיד אחריו: הגיר נעשה חלקלק והמים עולים בערוצים. אתם צריכים נעלי הליכה
    ראויות, מכנסיים ארוכים, שני ליטר מים וטלפון טעון עם מפה לא מקוונת, מפני שחלק מהקטעים דורשים שימוש
    בידיים. החניה חינם בכפר האחרון. אין כאן שום תשתית — לא בית קפה, לא שירותים, לא כספומט ואין קליטה אמינה
    בתוך הקניון — לכן קחו איתכם כל מה שתצטרכו.
  route: >-
    צאו מטביליסי בכביש רוסתאווי, ומשם המשיכו לכיוון טטריצקארו ואל הכפר טביסי — כ-55 ק״מ ושעה ועשרים. רובו
    סלול, אבל כחמשת הקילומטרים האחרונים הם חצץ, מתולם ומחוספס גם במזג אוויר יבש. רכב חסכוני אינו מומלץ
    כאן; קרוסאובר עם גובה גחון אמיתי בטוח הרבה יותר, ואחרי גשם הדרך עלולה להפוך לבלתי עבירה ברכב נמוך.
    תחנת הדלק והחנות האחרונות נמצאות בטטריצקארו, אז הצטיידו לפני הפנייה.
ar:
  name: بيرتفيسي
  short: >-
    متاهة من الأبراج الكلسية والأخاديد الضيقة على بعد ساعة من تبليسي، وفيها حصن من العصور الوسطى مبني
    في الصخر الطبيعي.
  body: >-
    بيرتفيسي أغرب تضاريس كفيمو كارتلي: كتلة من الحجر الكلسي فتّتها التعرية إلى أخاديد ضيقة وأبراج قائمة
    بذاتها وبوابات طبيعية. لا تتجاوز مساحتها كلها بضعة كيلومترات مربعة، ومع ذلك فالتوجّه داخلها صعب فعلاً
    — تلتوي المسالك بين جدران الصخر، وتنغلق مديات الرؤية إلى أمتار قليلة، ويفقد الناس بانتظام أثر الطريق
    الذي دخلوا منه.


    وفي العصور الوسطى صنعت هذه التضاريس الطبيعية حصناً. تُذكر بيرتفيسي منذ القرن الحادي عشر وكانت تُعد
    منيعة: فأسوارها كانت تصل بين الجروف القائمة أصلاً، فلم يلزم من البناء إلا القليل جداً للاحتفاظ بها.
    وقد استولى عليها تيمورلنك عام 1403، وهو حدث بلغ من الغرابة أن أفردته حوليات حملته بالذكر. وما بقي
    اليوم شذرات من السور والبرج المعروف باسم **سفيتي**، أي «العمود»، القائم على قمة صخرية والظاهر من بعيد.


    وبيرتفيسي وجهة للمشي لا معلم يُنظر إليه. يستغرق المسار المعتاد ثلاث إلى خمس ساعات ويشمل التسلل بين
    شقوق ضيقة والسير في مجرى جدول صغير وتسلقات قصيرة لكنها حادة. والعلامات رديئة، والمجموعات التي تمضي
    بلا مرشد أو بلا مسار GPS محمّل مسبقاً تضل الطريق باستمرار.
  tip: >-
    تجنب بيرتفيسي أثناء المطر وبعده مباشرة: إذ يصبح الحجر الكلسي زلقاً ويرتفع الماء في الأخاديد. تحتاج
    إلى حذاء مشي جبلي مناسب وسروال طويل ولترين من الماء وهاتف مشحون بخريطة تعمل دون اتصال، لأن بعض المقاطع
    تتطلب الاستعانة باليدين. الوقوف مجاني في القرية الأخيرة. ولا توجد أي بنية خدمية على الإطلاق — لا مقهى
    ولا دورة مياه ولا صراف ولا تغطية هاتفية موثوقة داخل الوادي — فاحمل معك كل ما تحتاجه.
  route: >-
    اخرج من تبليسي على طريق روستافي، ثم اتجه نحو تيتريتسكارو وقرية تبيسي — نحو 55 كم وساعة وعشرين دقيقة.
    معظم الطريق معبّد، لكن الكيلومترات الخمسة الأخيرة تقريباً حصوية ومحفّرة ووعرة حتى في الجو الجاف. والسيارة
    الاقتصادية غير مستحسنة هنا؛ فالكروس أوفر بخلوص أرضي حقيقي أكثر أماناً بكثير، وبعد المطر قد يتعذر سلوك
    المسلك بسيارة منخفضة. وآخر محطة وقود ومتجر في تيتريتسكارو، فتزود قبل الانعطاف.
