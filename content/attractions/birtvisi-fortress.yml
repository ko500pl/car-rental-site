ka:
  name: ბირთვისის ციხე და კანიონი
  short: >-
    ვულკანური კლდის წვეტების ლაბირინთი ალგეთის ხეობაში, გალავნით შეკრული ციხე, რომელიც თემურლენგმა მხოლოდ
    ღამით, თოკის კიბით აიღო.
  body: >-
    **ბირთვისი ციხეა, რომელიც ნახევრად ბუნებამ ააშენა: კლდის წვეტების ლაბირინთი ალგეთის ხეობის თავზე,
    სადაც შუა საუკუნეების ოსტატებს მხოლოდ ღრიჭოების ამოშენება დასჭირდათ.**


    მასივი თრიალეთის ქედის სამხრეთ კალთებზე აღმართულა; თავად ციხე ზღვის დონიდან დაახლოებით 950 მეტრზე
    დგას. რასაც არ უნდა ამბობდნენ გზამკვლევები, ეს კირქვა არ არის: აქ ძველი ვულკანური ქანებია, ეოცენური
    პორფირიტები და ტუფობრექჩიები, რომლებიც დროს წვეტებად, ბუნებრივ კარიბჭეებად და ისეთ ღრმა ხევებად უქცევია,
    რომ მათი ძირი ზემოდან ძლივს ჩანს. მშენებლებმა ყოველი გასასვლელი და სუსტი ადგილი კედლით ამოქოლეს, დანარჩენი
    კლდეებმა თავად იკისრეს. ვისაც ბირთვისი ეჭირა, ალგეთის ხეობაზეც ის ბატონობდა.


    წყაროებში ციხე პირველად თბილისის არაბი ამირას კუთვნილებად იხსენიება, რომელსაც ის 1038 წელს კლდეკარის
    ერისთავმა ლიპარიტმა და ივანე აბაზას ძემ წაართვეს. 1403 წელს აქ თემურლენგი მოვიდა. მემატიანე წერს,
    რომ მისი ლაშქარი ციხეს შიშით უყურებდა, რადგან აქ ადრეც მწარედ ევნო; მეციხოვნეები გამოუხდნენ და პირველი
    იერიში მოიგერიეს, თემურმა კი კლდეს ირგვლივ საალყო სიმაგრეები შემოავლო. ბოლოს მისმა მეომრებმა ციხის
    სუსტი ადგილი გაიგეს და ღამით თოკის კიბით შეიპარნენ. გადარჩენილი დამცველები დახოცეს. მოგვიანებით ციხე
    ბარათაშვილებს ეკუთვნოდა; სათანადოდ არქეოლოგიურად დღემდე არ შესწავლილა.


    ჩვეული გზა სოფელ ტბისთან იწყება და კლდის გასასვლელით, ე. წ. „დევის ნაკვალევით“ ციხის ვიწრო კარამდე
    მიდის. შიგნით ხელოვნურად მოსწორებული პატარა ეზოა, წყალსაცავი, კლდეში გამოკაფული საფეხურები, ტუფში
    ამოკვეთილი სანათლავი, ყველაზე მაღალ კლდეზე კი სათოფურებიანი ცილინდრული კოშკი — „შეუპოვარი“. ხევებში
    კოლხური ფლორის ყველაზე აღმოსავლეთი ფორპოსტია მცირე კავკასიონზე.


    ხევში, გალავნის ქვემოთ, ერთხელ დაიძახეთ და კლდე გიპასუხებთ. ეს ერთადერთი გარნიზონია, რომელიც ბირთვისს
    დღესაც ჰყავს.
  tip: >-
    წვიმაში ან წვიმის შემდეგ ნუ წახვალთ: კლდე მოლიპულია, ხევებში კი წყალი მოდის. ჩაიცვით ნამდვილი სალაშქრო
    ფეხსაცმელი და გრძელი შარვალი, წაიღეთ ორი ლიტრი წყალი და დატენილი ტელეფონი ოფლაინ რუკით ან GPS-ტრეკით
    — მონიშვნა სუსტია, ზოგან კი ხელების დახმარებაც დაგჭირდებათ. სამიდან ხუთ საათამდე გამოყავით. მანქანა
    ტბისში უფასოდ დააყენეთ. ადგილზე არაფერია — არც კაფე, არც საპირფარეშო, არც საიმედო კავშირი, — ამიტომ
    ყველაფერი თან იქონიეთ. ბირთვისი დაბლაა და თბილისთან ახლოს, ამიტომ მშრალ დღეებში ზამთარშიც ივლება,
    როცა შიშველი ხეები ხედებს ხსნის.
  route: >-
    მანძილი დაახლოებით 55 კილომეტრია, დრო — საათი და ოცი წუთი. თბილისიდან მტკვარს სამხრეთით, ფონიჭალამდე
    მიუყევით და მარნეულის გზატკეცილზე (ს6) გადით; დაახლოებით 15 კილომეტრის შემდეგ დასავლეთით, შ31-ზე —
    კოდა–ფარცხისი–მანგლისის გზაზე გადაუხვიეთ, ალგეთის ხეობას აუყევით და სოფელ ტბისისკენ ჩაუხვიეთ. სოფლამდე
    ასფალტი კარგია, ბილიკის დასაწყისამდე ბოლო მონაკვეთი კი ორმოიანი ხრეშია, მშრალ ამინდშიც მოუხერხებელი.
    სწორი არჩევანია კროსოვერი ან ჯიპი ნამდვილი კლირენსით; წვიმის შემდეგ დაბალი მანქანა შეიძლება ვერც კი
    გავიდეს. ავზი შეავსეთ და წყალი იყიდეთ თბილისში ან ს6-ზე — შემდეგ გზაზე ბევრს ვერაფერს იპოვით.
en:
  name: Birtvisi
  short: >-
    A maze of volcanic rock needles in the Algeti valley, walled into a fortress that Timur could take
    only by rope ladder at night.
  body: >-
    **Birtvisi is a fortress that nature half-built: a maze of rock needles above the Algeti valley, where
    medieval masons had only to wall up the gaps.**


    The massif rises on the southern slopes of the Trialeti Range; the fortress itself stands at about
    950 metres. Despite what many guides say, the rock is not limestone but ancient volcanic stone, Eocene
    porphyrite and tuff breccia, weathered into spires, gateways and chasms so deep that their floors
    are hard to see from above. The builders sealed every passage and weak point with walls; the cliffs
    did the rest. Whoever held Birtvisi held the Algeti valley.


    It first appears in the written sources as a possession of the Arab emir of Tbilisi, from whom the
    Georgian lords Liparit of Kldekari and Ivane Abazasdze took it in 1038. In 1403 Timur arrived. The
    chronicle says his soldiers dreaded the place, having been mauled there before; the defenders sallied
    out and drove the first assault back, and Timur ringed the rock with siege forts. In the end his men
    learned of a weak spot and climbed in at night on rope ladders. The survivors were executed. Later
    the fortress passed to the Baratashvili princes; it has never been properly excavated.


    The usual approach starts near the village of Tbisi and threads a rock passage called the Devi's Footprint
    (a devi is an ogre of Georgian folklore) to a narrow gate. Inside are a small levelled courtyard,
    a reservoir, stairs cut into the rock, a baptismal font carved into the tuff and, on the highest crag,
    Sheupovari, "the Dauntless", a round watchtower pierced with gun loops. The ravines shelter the easternmost
    outpost of Colchic, Black Sea-type, vegetation in the Lesser Caucasus.


    Call out once in the gorge below the walls and the rock answers. It is the only garrison Birtvisi
    still keeps.
  tip: >-
    Do not go in rain or just after it: the rock turns slick and the gorges run with water. Wear proper
    hiking shoes and long trousers, carry two litres of water and a charged phone with an offline map
    or GPS track, because waymarking is poor and some sections need hands as well as feet. Allow three
    to five hours. Park for free in Tbisi. There is nothing on site, no café, toilet or reliable signal,
    so bring what you need. Being low and close to Tbilisi, Birtvisi can be walked on dry days even in
    winter, when the bare trees open up the views.
  route: >-
    It is about 55 km and an hour and twenty minutes. Leave Tbilisi southwards along the Mtkvari to Ponichala
    and take the Marneuli highway (S6); after about 15 km turn west onto the Sh31, the Koda–Partskhisi–Manglisi
    road, and follow it up the Algeti valley before turning off for the village of Tbisi. The asphalt
    is good as far as the village; the last stretch to the trailhead is rough, rutted gravel, awkward
    even when dry. A crossover or SUV with real ground clearance is the right choice, and after rain a
    low car may not make it at all. Fill the tank and buy water in Tbilisi or on the S6, as there is little
    further on.
ru:
  name: Биртвиси
  short: >-
    Лабиринт вулканических скальных игл в долине Алгети, превращённый стенами в крепость, которую Тимур
    смог взять лишь ночью, по верёвочным лестницам.
  body: >-
    **Биртвиси — крепость, которую наполовину построила природа: лабиринт скальных игл над долиной Алгети,
    где средневековым каменщикам оставалось лишь заложить промежутки.**


    Массив поднимается на южных склонах Триалетского хребта; сама крепость стоит на высоте около 950 метров.
    Вопреки тому, что пишут многие путеводители, это не известняк, а древняя вулканическая порода — эоценовые
    порфириты и туфобрекчии, выветренные в шпили, арки и расселины такой глубины, что их дно трудно разглядеть
    сверху. Строители перекрыли стенами каждый проход и каждое уязвимое место; остальное сделали скалы.
    Кто владел Биртвиси, тот владел долиной Алгети.


    В письменных источниках крепость впервые появляется как владение арабского эмира Тбилиси, у которого
    в 1038 году её отняли грузинские феодалы Липарит Клдекарский и Иване Абазасдзе. В 1403 году пришёл
    Тимур. Летопись говорит, что его воины боялись этого места, где им уже прежде крепко досталось; защитники
    сделали вылазку и отбили первый штурм, и Тимур окружил скалу осадными укреплениями. В конце концов
    его люди узнали о слабом месте и ночью взобрались внутрь по верёвочным лестницам. Уцелевших казнили.
    Позже крепость перешла к князьям Бараташвили; как следует её так и не раскопали.


    Обычный путь начинается у села Тбиси и через скальный проход, называемый «Следом дэва» (дэв — великан
    грузинского фольклора), выводит к узким воротам. Внутри — небольшой выровненный двор, водоём, вырубленные
    в скале лестницы, купель, высеченная в туфе, а на самом высоком утёсе — Шеуповари, «Неустрашимая»,
    круглая сторожевая башня с бойницами. В ущельях укрылся самый восточный на Малом Кавказе форпост колхидской,
    черноморской по типу, растительности.


    Крикните один раз в ущелье под стенами — и скала ответит. Это единственный гарнизон, который Биртвиси
    держит до сих пор.
  tip: >-
    Не ходите в дождь и сразу после него: скала становится скользкой, а по ущельям бежит вода. Нужны настоящие
    треккинговые ботинки и длинные брюки, два литра воды и заряженный телефон с офлайн-картой или GPS-треком:
    маркировка плохая, а на некоторых участках придётся помогать себе руками. Закладывайте три-пять часов.
    Парковка в Тбиси бесплатная. На месте нет ничего — ни кафе, ни туалета, ни надёжной связи, так что
    берите с собой всё нужное. Биртвиси лежит невысоко и недалеко от Тбилиси, поэтому в сухие дни сюда
    можно ходить даже зимой, когда голые деревья открывают виды.
  route: >-
    Дорога — около 55 км и час двадцать. Выезжайте из Тбилиси на юг вдоль Куры до Поничалы и берите Марнеульское
    шоссе (S6); примерно через 15 км сверните на запад, на Sh31, дорогу Кода — Парцхиси — Манглиси, и
    поднимайтесь по ней долиной Алгети до поворота на село Тбиси. До села асфальт хороший; последний отрезок
    до начала тропы — грубый, разбитый колеями гравий, неудобный даже в сухую погоду. Правильный выбор
    — кроссовер или внедорожник с настоящим клиренсом, а после дождя низкая машина может и вовсе не проехать.
    Заправьтесь и купите воду в Тбилиси или на S6: дальше почти ничего нет.
fa:
  name: بیرتویسی
  short: >-
    هزارتویی از سوزن‌های سنگ آتشفشانی در درهٔ آلگتی که با دیوار به دژی بدل شده و تیمور تنها شبانه و با
    نردبان طنابی توانست آن را بگیرد.
  body: >-
    **بیرتویسی دژی است که نیمی از آن را طبیعت ساخته: هزارتویی از سوزن‌های سنگی بر فراز درهٔ آلگتی، که
    بنایان سده‌های میانه تنها باید شکاف‌هایش را با دیوار می‌بستند.**


    این توده بر دامنه‌های جنوبی رشته‌کوه تریالتی سر برآورده است؛ خود دژ در ارتفاع حدود ۹۵۰ متری قرار دارد.
    برخلاف آن‌چه بسیاری از راهنماها می‌گویند، سنگش آهک نیست، بلکه سنگ آتشفشانی کهنی است، پورفیریت و برش
    توفیِ دوران ائوسن، که فرسایش آن را به مناره‌ها، دروازه‌ها و شکاف‌هایی چنان ژرف تراشیده که کفشان از
    بالا به‌سختی دیده می‌شود. سازندگان هر گذرگاه و هر نقطهٔ آسیب‌پذیر را با دیوار بستند؛ باقی کار را صخره‌ها
    کردند. هر که بیرتویسی را در دست داشت، درهٔ آلگتی را در دست داشت.


    این دژ نخستین بار در منابع مکتوب به‌عنوان ملک امیر عرب تفلیس پدیدار می‌شود، که فئودال‌های گرجی، لیپاریت
    کلدکاری و ایوانه آبازاسدزه، در ۱۰۳۸ آن را از او گرفتند. در ۱۴۰۳ تیمور رسید. به روایت وقایع‌نامه، سربازانش
    از این مکان، که پیش‌تر در آن سخت گوشمالی خورده بودند، هراس داشتند؛ مدافعان بیرون تاختند و نخستین یورش
    را پس زدند و تیمور صخره را با دژهای محاصره در میان گرفت. سرانجام مردانش از نقطه‌ای آسیب‌پذیر خبر یافتند
    و شبانه با نردبان‌های طنابی به درون راه یافتند. بازماندگان اعدام شدند. بعدها دژ به شاهزادگان باراتاشویلی
    رسید؛ و تاکنون هرگز به‌درستی کاوش نشده است.


    راه معمول از نزدیکی روستای تبیسی آغاز می‌شود و از گذرگاهی سنگی به نام «ردپای دیو» تا دروازه‌ای باریک
    پیش می‌رود. درون آن حیاطی کوچک و هموارشده، آب‌انباری، پلکان‌هایی تراشیده در صخره، حوض غسل تعمیدی کنده
    در توف و، بر بلندترین صخره، شئوپوواری، «بی‌باک»، برج دیدبانیِ مدوّری با روزنه‌های تیراندازی قرار دارد.
    دره‌ها شرقی‌ترین پایگاه پوشش گیاهی کلخیدی، از گونهٔ دریای سیاه، را در قفقاز کوچک در پناه خود دارند.


    یک بار در درهٔ زیر دیوارها فریاد بزنید تا صخره پاسخ دهد. این تنها پادگانی است که بیرتویسی هنوز نگه
    داشته است.
  tip: >-
    در باران یا درست پس از آن نروید: صخره لغزنده می‌شود و در دره‌ها آب جاری می‌شود. کفش کوهپیمایی درست
    و شلوار بلند بپوشید، دو لیتر آب و تلفنی شارژشده با نقشهٔ آفلاین یا مسیر GPS همراه داشته باشید، چون
    نشانه‌گذاری ضعیف است و در برخی بخش‌ها دست‌ها هم باید به کمک پاها بیایند. سه تا پنج ساعت وقت بگذارید.
    پارک در تبیسی رایگان است. در محل هیچ چیز نیست، نه کافه، نه سرویس بهداشتی و نه آنتن مطمئن، پس هرچه
    لازم دارید بیاورید. بیرتویسی کم‌ارتفاع و نزدیک تفلیس است، پس در روزهای خشک حتی در زمستان هم می‌توان
    در آن پیاده‌روی کرد، وقتی درختان عریان چشم‌اندازها را می‌گشایند.
  route: >-
    مسافت حدود ۵۵ کیلومتر و یک ساعت و بیست دقیقه است. از تفلیس در امتداد رود کورا به سوی جنوب تا پونیچالا
    بروید و بزرگراه مارنئولی (S6) را بگیرید؛ پس از حدود ۱۵ کیلومتر به غرب، به جادهٔ Sh31، یعنی جادهٔ کودا–پارتسخیسی–مانگلیسی،
    بپیچید و از درهٔ آلگتی بالا بروید تا به انشعاب روستای تبیسی برسید. آسفالت تا روستا خوب است؛ تکهٔ پایانی
    تا سر مسیر پیاده‌روی شنیِ ناهموار و پر از شیار است و حتی در هوای خشک دردسرساز. کراس‌اوور یا شاسی‌بلندی
    با فاصلهٔ واقعی از زمین انتخاب درست است و پس از باران خودروی کوتاه شاید اصلاً نتواند برسد. باک را
    پر کنید و آب را در تفلیس یا کنار S6 بخرید، چون پس از آن چیز زیادی نیست.
he:
  name: בירטביסי
  short: מבוך של מחטי סלע געשי בעמק אלגטי, שחומות הפכו למבצר — וטימור הצליח לכבוש אותו רק בלילה, בסולמות
    חבלים.
  body: >-
    **בירטביסי הוא מבצר שהטבע בנה חציו: מבוך של מחטי סלע מעל עמק אלגטי, שבו כל מה שנותר לבנאים של ימי
    הביניים היה לחסום בחומות את הפרצות.**


    גוש הסלע מתנשא במדרונות הדרומיים של רכס טריאלטי; המבצר עצמו עומד בגובה של כ-950 מטרים. בניגוד למה
    שכתוב במדריכים רבים, הסלע אינו גיר אלא אבן געשית עתיקה, פורפיריט וברקציה טופית מתקופת האאוקן, שבליה
    עיצבה לצריחים, לשערים ולנקיקים עמוקים כל כך שקשה לראות את תחתיתם מלמעלה. הבונים אטמו בחומות כל מעבר
    וכל נקודת תורפה; את השאר עשו הצוקים. מי שהחזיק בבירטביסי החזיק בעמק אלגטי.


    המבצר מופיע לראשונה במקורות הכתובים כנחלתו של האמיר הערבי של טביליסי, שממנו לקחו אותו ב-1038 האצילים
    הגאורגים ליפריט מקלדקרי ואיוואנה אבזסדזה. ב-1403 הגיע טימור. לפי הכרוניקה, חייליו פחדו מן המקום, שבו
    כבר ספגו מכה קשה בעבר; המגינים יצאו בגיחה והדפו את ההסתערות הראשונה, וטימור כיתר את הסלע בביצורי מצור.
    לבסוף נודע לאנשיו על נקודת תורפה, והם טיפסו פנימה בלילה בסולמות חבלים. הניצולים הוצאו להורג. מאוחר
    יותר עבר המבצר לנסיכי בית ברטשווילי; הוא מעולם לא נחפר כראוי.


    הגישה הרגילה מתחילה ליד הכפר טביסי ומשתחלת במעבר סלעי המכונה "טביעת הרגל של הדווי" (ענק מן הפולקלור
    הגאורגי) עד לשער צר. בפנים יש חצר קטנה מיושרת, מאגר מים, מדרגות חצובות בסלע, אגן טבילה חצוב בטוף,
    ועל הצוק הגבוה ביותר — שאופובארי, "הבלתי נרתע", מגדל שמירה עגול מחורר בחרכי ירי. בנקיקים שורד המאחז
    המזרחי ביותר בקווקז הקטן של צמחייה קולכית, מן הטיפוס של הים השחור.


    קראו פעם אחת בנקיק שמתחת לחומות, והסלע יענה. זהו חיל המצב היחיד שבירטביסי עדיין מחזיק.
  tip: >-
    אל תלכו בגשם או מיד אחריו: הסלע נעשה חלקלק ובנקיקים זורמים מים. נעלו נעלי הליכה של ממש ומכנסיים ארוכים,
    קחו שני ליטרים מים וטלפון טעון עם מפה לא מקוונת או מסלול GPS, כי הסימון דל ובקטעים מסוימים צריך גם
    ידיים ולא רק רגליים. הקדישו שלוש עד חמש שעות. החניה בטביסי חינם. באתר עצמו אין כלום — לא בית קפה,
    לא שירותים ולא קליטה אמינה — אז הביאו כל מה שצריך. בירטביסי נמוך וקרוב לטביליסי, כך שבימים יבשים אפשר
    לטייל בו גם בחורף, כשהעצים החשופים פותחים את הנופים.
  route: >-
    המרחק כ-55 ק"מ, שעה ועשרים דקות. צאו מטביליסי דרומה לאורך נהר המטקוורי (כורה) עד פוניצ'לה ועלו על
    כביש מרנאולי (S6); אחרי כ-15 ק"מ פנו מערבה לכביש Sh31, דרך קודה–פרצחיסי–מנגליסי, ועלו בו במעלה עמק
    אלגטי עד הפנייה לכפר טביסי. האספלט טוב עד הכפר; הקטע האחרון עד תחילת השביל הוא חצץ גס ומחורץ, לא נוח
    גם כשיבש. קרוסאובר או רכב שטח עם מרווח גחון של ממש הם הבחירה הנכונה, ואחרי גשם מכונית נמוכה עלולה
    לא לעבור בכלל. תדלקו וקנו מים בטביליסי או על כביש S6, כי בהמשך אין כמעט דבר.
ar:
  name: بيرتفيسي
  short: >-
    متاهة من الإبر الصخرية البركانية في وادي ألغيتي، سُدّت بالأسوار فصارت قلعة لم يأخذها تيمور إلا ليلاً
    بسلالم الحبال.
  body: >-
    **بيرتفيسي قلعة بنت الطبيعةُ نصفها: متاهة من الإبر الصخرية فوق وادي ألغيتي، لم يكن على بنّائي العصور
    الوسطى فيها إلا أن يسدّوا الفجوات بالأسوار.**


    ترتفع الكتلة الصخرية على السفوح الجنوبية لسلسلة تريالتي، وتقوم القلعة نفسها على ارتفاع نحو 950 متراً.
    وخلافاً لما تقوله أدلة كثيرة، ليست الصخور كلسية بل بركانية قديمة، من البورفيريت وبريشيا التوف العائدة
    إلى العصر الإيوسيني، نحتتها عوامل التعرية أبراجاً وبوابات وشقوقاً عميقة يصعب أن تُرى قيعانها من فوق.
    وسدّ البناؤون بالأسوار كل ممر وكل نقطة ضعف، وتكفّلت الجروف بالباقي. ومن ملك بيرتفيسي ملك وادي ألغيتي.


    تظهر القلعة أول مرة في المصادر المكتوبة ملكاً لأمير تبليسي العربي، وقد انتزعها منه عام 1038 النبيلان
    الجورجيان ليباريت الكلديكاري وإيفانه أبازاسدزه. وفي عام 1403 وصل تيمور. تقول الحولية إن جنوده كانوا
    يهابون المكان، إذ أصابهم فيه من قبل أذى شديد؛ فخرج المدافعون وصدّوا الهجوم الأول، ثم طوّق تيمور الصخرة
    بتحصينات الحصار. وفي النهاية علم رجاله بنقطة ضعف، فتسلّقوا إلى الداخل ليلاً بسلالم من الحبال. وأُعدم
    الناجون. وانتقلت القلعة لاحقاً إلى أمراء باراتاشفيلي، ولم تُنقَّب قط تنقيباً وافياً.


    يبدأ الطريق المعتاد قرب قرية تبيسي، ويتسلّل عبر ممر صخري يسمّى «أثر قدم الديو» (عملاق في الحكايات
    الجورجية) حتى بوابة ضيقة. وفي الداخل فناء صغير مسوّى، وخزان للماء، ودرجات منحوتة في الصخر، وجرن معمودية
    محفور في التوف، وعلى أعلى الجروف برج شيوبوفاري، أي «الذي لا يهاب»، وهو برج مراقبة دائري تخترقه فتحات
    للرمي. وتؤوي الأخاديد أقصى امتداد شرقي في القوقاز الصغير للغطاء النباتي الكولخيدي، من طراز البحر الأسود.


    اصرخ مرة واحدة في الأخدود تحت الأسوار، وستجيبك الصخرة. إنها الحامية الوحيدة التي ما زالت بيرتفيسي
    تحتفظ بها.
  tip: >-
    لا تذهب في المطر أو بعده مباشرة: يصير الصخر زلقاً وتجري المياه في الأخاديد. ارتدِ حذاء مشي جبلي حقيقياً
    وسروالاً طويلاً، واحمل لترين من الماء وهاتفاً مشحوناً عليه خريطة دون اتصال أو مسار GPS، فالعلامات
    ضعيفة وبعض المقاطع يحتاج إلى اليدين مع القدمين. خصّص من ثلاث إلى خمس ساعات. الوقوف مجاني في تبيسي.
    لا شيء في الموقع، لا مقهى ولا دورة مياه ولا تغطية يُعتمد عليها، فأحضر ما تحتاجه. ولأن بيرتفيسي منخفضة
    وقريبة من تبليسي، يمكن المشي فيها في الأيام الجافة حتى في الشتاء، حين تكشف الأشجار العارية المناظر.
  route: >-
    المسافة نحو 55 كم وساعة وعشرون دقيقة. غادر تبليسي جنوباً بمحاذاة نهر متكفاري (كورا) حتى بونيتشالا،
    واسلك طريق مارنيولي السريع (S6)؛ وبعد نحو 15 كم انعطف غرباً إلى الطريق Sh31، طريق كودا–بارتسخيسي–مانغليسي،
    واتبعه صعوداً في وادي ألغيتي حتى المنعطف المؤدي إلى قرية تبيسي. الإسفلت جيد حتى القرية؛ أما المقطع
    الأخير حتى بداية الدرب فحصى خشن كثير الأخاديد، مزعج حتى في الطقس الجاف. الاختيار الصحيح سيارة كروس
    أوفر أو دفع رباعي بخلوص أرضي حقيقي، وبعد المطر قد لا تصل السيارة المنخفضة أبداً. املأ الخزان واشترِ
    الماء في تبليسي أو على الطريق S6، فلا يكاد يوجد شيء بعد ذلك.
