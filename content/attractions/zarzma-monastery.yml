ka:
  name: ზარზმის მონასტერი
  short: ადიგენთან, კვაბლიანის ხეობაში მდგარი XIV საუკუნის ტაძარი ჯაყელთა პორტრეტებითა და ადრეული სამრეკლოთი.
  body: >-
    **ზარზმა სამცხის დასავლეთ კუთხის მთავარი სავანეა** — ადიგენის ზემოთ, კვაბლიანის ხეობაში, ტყისა და
    სათიბების საზღვარზე, დაახლოებით 1250 მეტრზე.


    გადმოცემით მონასტერი IX საუკუნეში დააარსა წმინდა სერაპიონ ზარზმელმა. მისი ცხოვრება X საუკუნეში ბასილი
    ზარზმელმა აღწერა და ეს ტექსტი ქართული ჰაგიოგრაფიის ერთ-ერთი მნიშვნელოვანი ძეგლია — იშვიათი შემთხვევაა,
    როცა სავანის დაარსების ისტორია თანადროული წყაროთი ვიცით.


    დღევანდელი ფერისცვალების ტაძარი XIV საუკუნის დასაწყისისაა და ბექა ჯაყელის, სამცხის ათაბაგის, ქტიტორობით
    აშენდა. ის ჯვარგუმბათოვანი ნაგებობაა, გარედან სუფთა, თითქმის მკაცრი ქვის ზედაპირით. შიგნით XIV-XVI
    საუკუნეების ფრესკებია, მათ შორის ჯაყელთა საგვარეულოს პორტრეტები — ის ხალხი, რომელიც სამცხეს ორ საუკუნეზე
    მეტხანს განაგებდა.


    ეზოში ცალკე დგას **სამრეკლო** — ერთ-ერთი უადრესი შემორჩენილი ქართული სამრეკლო, XIV საუკუნისა, მდიდრული
    ქვის კვეთით სარკმლების გარშემო. ბევრი ჩამოსული სწორედ მას იმახსოვრებს ტაძარზე მეტად.


    ზარზმიდან წარმოშობილი ფერისცვალების ხატი, IX საუკუნის ბოლოსი, დღეს საქართველოს ეროვნულ მუზეუმშია —
    ქართული ხატწერის უძველეს ნიმუშთა შორის.


    ხეობის დღევანდელი სახე ერთ კონკრეტულ თარიღს უკავშირდება: 1944 წელს კვაბლიანის ხეობიდან მესხი მუსლიმები
    დეპორტირებულ იქნენ და ათეულობით სოფელი ერთ ღამეში დაიცალა. მოგვიანებით აქ იმერეთიდან, რაჭიდან და აჭარიდან
    ჩამოასახლეს ხალხი. ამიტომაა, რომ ძველი ქვის სახლები და შედარებით ახალი სასოფლო არქიტექტურა აქ ერთმანეთის
    გვერდით დგას.


    ოსმალური ბატონობის საუკუნეებში მონასტერი დაცარიელდა და მხოლოდ XIX-XX საუკუნეების მიჯნაზე აღდგა; დღეს
    ის ისევ მოქმედია. ადგილი ძალიან მშვიდია — ახალციხის ტურისტული ნაკადი აქამდე თითქმის არ აღწევს და შაბათ-კვირასაც
    კი ხშირად მარტო რჩები ეზოში.
  tip: >-
    ერთი საათი და ნახევარი კომფორტულია. ეზო ბალახიანია და ციცაბოდ ეშვება, წვიმის შემდეგ სრიალა — მაგარძირიანი
    ფეხსაცმელი ჯობია. ინტერიერი ბუნებრივი შუქითაა განათებული, ამიტომ ფრესკებისთვის მოწმენდილი შუადღე აირჩიე.
    ჩაცმის წესები მოქმედებს: ქალებს თავსაფარი და გრძელი კალთა, კაცებს გრძელი შარვალი; კართან ჩვეულებრივ
    დევს. საჭმელი და წყალი ადიგენში იყიდე, მონასტერთან არაფერია. ტუალეტი მარტივია.
  route: >-
    თბილისიდან ბორჯომისა და ახალციხის გავლით (E60 ხაშურამდე, შემდეგ სამხრეთით) ახალციხემდე 205 კმ, იქიდან
    დასავლეთით ადიგენის მიმართულებით კიდევ დაახლოებით ოცდაათი კილომეტრი. სულ 235 კმ, დაახლოებით ოთხი საათი.
    ახალციხე-ადიგენის გზა ასფალტია, ბოლო რამდენიმე კილომეტრი მონასტრამდე კი ვიწრო და მოხრეშილია, ადგილ-ადგილ
    ორმოებით. მშრალ ამინდში ჩვეულებრივი მანქანაც ავა, მაგრამ წვიმის ან თოვლის შემდეგ კლირენსი მნიშვნელოვანია.
    საწვავი ახალციხეში აიღე.
en:
  name: Zarzma Monastery
  short: >-
    A 14th-century church in the Kvabliani valley above Adigeni, with Jaqeli family portraits and an early
    bell tower.
  body: >-
    **Zarzma is the principal monastery of the western corner of Samtskhe,** above Adigeni in the Kvabliani
    valley, at about 1,250 metres on the line where forest gives way to hay meadow.


    Tradition places its foundation in the 9th century by St Serapion of Zarzma. His Life was written
    in the 10th century by Basil of Zarzma, and the text is a significant work of Georgian hagiography:
    it is unusual to know a monastery's founding story from a source so close to the event.


    The church of the Transfiguration standing today dates from the early 14th century and was built under
    the patronage of Beka Jaqeli, atabeg of Samtskhe. It is a domed cross-plan building with a clean,
    almost severe stone exterior. Inside are wall paintings of the 14th to 16th centuries, among them
    portraits of the Jaqeli family, the people who governed this province for more than two hundred years.


    In the yard stands a separate **bell tower**, one of the earliest surviving in Georgia, dating from
    the 14th century and carrying rich carving around its openings. Many visitors remember it better than
    the church itself.


    A Transfiguration icon of the late 9th century that came from Zarzma is now in the Georgian National
    Museum, among the oldest surviving works of Georgian icon painting.


    The look of the valley today goes back to one specific date. In 1944 the Muslim Meskhetians were deported
    from the Kvabliani valley and dozens of villages emptied in a single night; the district was later
    resettled with families from Imereti, Racha and Adjara. That is why old stone houses and much newer
    village architecture stand side by side along the road.


    The monastery emptied during the Ottoman centuries and was only re-established around the turn of
    the 20th century; it is active again today. The place is very quiet. Almost none of the traffic that
    reaches Akhaltsikhe comes this far, and even at weekends you are often alone in the yard.
  tip: >-
    An hour and a half is comfortable. The yard is grassy and slopes steeply, and it gets slippery after
    rain, so shoes with grip are better than smooth soles. The interior is lit by daylight only, so pick
    a clear middle of the day if you want to see the frescoes. Dress rules apply: headscarf and long skirt
    for women, long trousers for men, with wraps usually by the door. Buy food and water in Adigeni, as
    there is nothing at the monastery. The toilet is basic.
  route: >-
    Drive from Tbilisi via Borjomi and Akhaltsikhe — the E60 to Khashuri, then south — 205 km to Akhaltsikhe,
    and from there roughly another thirty kilometres west towards Adigeni. The total is 235 km, close
    to four hours. The Akhaltsikhe-Adigeni road is asphalt, but the last few kilometres up to the monastery
    are narrow gravel with potholes in places. In dry weather an ordinary car will manage; after rain
    or snow, ground clearance matters. Refuel in Akhaltsikhe.
ru:
  name: Монастырь Зарзма
  short: Храм XIV века в Кваблианском ущелье над Адигени, с портретами рода Джакели и ранней колокольней.
  body: >-
    **Зарзма — главная обитель западного угла Самцхе,** выше Адигени, в Кваблианском ущелье, на высоте
    около 1250 метров, там, где лес сменяется сенокосами.


    Предание относит основание монастыря к IX веку и связывает его со святым Серапионом Зарзмским. Его
    житие написал в X веке Василий Зарзмский, и этот текст — заметный памятник грузинской агиографии:
    редкий случай, когда историю основания обители мы знаем из источника, близкого по времени.


    Стоящий сегодня храм Преображения относится к началу XIV века и построен при ктиторстве Беки Джакели,
    атабага Самцхе. Это крестово-купольное здание с чистой, почти суровой каменной поверхностью снаружи.
    Внутри — росписи XIV-XVI веков, среди них портреты рода Джакели, правившего этой провинцией более
    двухсот лет.


    Во дворе отдельно стоит **колокольня** — одна из самых ранних сохранившихся в Грузии, XIV века, с
    богатой резьбой вокруг проёмов. Многие приезжие запоминают именно её, а не церковь.


    Икона Преображения конца IX века, происходящая из Зарзмы, находится сегодня в Национальном музее Грузии
    и относится к древнейшим образцам грузинской иконописи.


    Нынешний облик ущелья восходит к одной конкретной дате. В 1944 году мусульман-месхетинцев депортировали
    из Кваблианского ущелья, и десятки сёл опустели за одну ночь; позже район заселили семьями из Имерети,
    Рачи и Аджарии. Поэтому вдоль дороги старые каменные дома стоят рядом с гораздо более поздней сельской
    застройкой.


    В османские столетия монастырь опустел и был возобновлён только на рубеже XX века; сейчас он снова
    действует. Здесь очень тихо: поток, доезжающий до Ахалцихе, сюда почти не добирается, и даже в выходные
    во дворе нередко оказываешься один.
  tip: >-
    Полутора часов достаточно. Двор травяной и круто уходит вниз, после дождя скользит, так что обувь
    с рифлёной подошвой предпочтительнее гладкой. Интерьер освещён только дневным светом, поэтому для
    фресок выбирайте ясную середину дня. Действуют правила одежды: женщинам платок и длинная юбка, мужчинам
    длинные брюки, накидки обычно лежат у входа. Еду и воду купите в Адигени, у монастыря ничего нет.
    Туалет простой.
  route: >-
    Из Тбилиси через Боржоми и Ахалцихе: по E60 до Хашури, затем на юг, 205 км до Ахалцихе, а оттуда ещё
    примерно тридцать километров на запад в сторону Адигени. Всего 235 км, около четырёх часов. Дорога
    Ахалцихе — Адигени асфальтированная, но последние несколько километров к монастырю — узкий гравий,
    местами с ямами. В сухую погоду проедет и обычная машина, после дождя или снега важен клиренс. Заправляйтесь
    в Ахалцихе.
fa:
  name: صومعهٔ زارزما
  short: کلیسایی از سدهٔ چهاردهم در درهٔ کوابلیانی بالای آدیگنی، با تصاویر خاندان جاقلی و برج ناقوسی کهن.
  body: >-
    **زارزما صومعهٔ اصلی گوشهٔ غربی سامتسخه است،** بالای آدیگنی در درهٔ کوابلیانی و در ارتفاع حدود ۱۲۵۰
    متر، آنجا که جنگل به علفزار درو می‌رسد.


    روایت، بنیاد آن را به سدهٔ نهم و به سراپیون زارزمایی قدیس نسبت می‌دهد. زندگی‌نامهٔ او را در سدهٔ دهم
    باسیل زارزمایی نوشت و این متن از آثار مهم قدیس‌نامه‌نویسی گرجی است: کم پیش می‌آید که داستان بنیاد
    یک صومعه را از منبعی چنین نزدیک به زمان رویداد بدانیم.


    کلیسای تجلی که امروز برپاست از اوایل سدهٔ چهاردهم است و به حمایت بکا جاقلی، اتابک سامتسخه، ساخته شد.
    بنایی صلیبی‌گنبدی است با نمای سنگی تمیز و تقریباً سخت‌گیرانه. در درون نقاشی‌های دیواری سده‌های چهاردهم
    تا شانزدهم هست، از جمله تصاویر خاندان جاقلی، همان کسانی که بیش از دویست سال بر این ولایت فرمان راندند.


    در حیاط **برج ناقوسی** جداگانه ایستاده است، از کهن‌ترین برج‌های ناقوس بازمانده در گرجستان، متعلق به
    سدهٔ چهاردهم و با کنده‌کاری پرکار گرد بازشوها. بسیاری از بازدیدکنندگان آن را بهتر از خود کلیسا به
    یاد می‌آورند.


    شمایل تجلی از اواخر سدهٔ نهم که از زارزما آمده امروز در موزهٔ ملی گرجستان است، در شمار کهن‌ترین آثار
    بازماندهٔ شمایل‌نگاری گرجی.


    چهرهٔ امروزی این دره به یک تاریخ مشخص بازمی‌گردد. در سال ۱۹۴۴ مسلمانان مسختی از درهٔ کوابلیانی تبعید
    شدند و ده‌ها روستا در یک شب خالی شد؛ بعدها خانواده‌هایی از ایمرتی و راچا و آجارا در آنجا اسکان یافتند.
    برای همین است که در کنار جاده خانه‌های سنگی کهن و معماری روستایی بسیار تازه‌تر دوشادوش هم ایستاده‌اند.


    صومعه در سده‌های عثمانی خالی شد و تنها در آستانهٔ سدهٔ بیستم دوباره برپا گشت؛ امروز باز عامر است.
    جای بسیار آرامی است: تقریباً هیچ‌یک از مسافرانی که تا آخالتسیخه می‌آیند تا اینجا نمی‌رسند و حتی آخر
    هفته‌ها اغلب در حیاط تنهایید.
  tip: >-
    یک ساعت و نیم راحت است. حیاط پوشیده از علف و شیب‌دار است و پس از باران لیز می‌شود، پس کفش آج‌دار بهتر
    از کف صاف است. فضای داخل تنها با نور روز روشن می‌شود، پس برای دیدن نقاشی‌ها میانهٔ روزی صاف را انتخاب
    کنید. قواعد پوشش برقرار است: روسری و دامن بلند برای زنان و شلوار بلند برای مردان، و پوشش‌ها معمولاً
    کنار در. خوراکی و آب را در آدیگنی بخرید چون نزد صومعه چیزی نیست. سرویس بهداشتی ساده است.
  route: >-
    از تفلیس از راه بورجومی و آخالتسیخه برانید: بزرگراه E60 تا خاشوری و سپس جنوب، ۲۰۵ کیلومتر تا آخالتسیخه،
    و از آنجا حدود سی کیلومتر دیگر به غرب به سوی آدیگنی. مجموع ۲۳۵ کیلومتر و نزدیک چهار ساعت. جادهٔ آخالتسیخه-آدیگنی
    آسفالت است، اما چند کیلومتر پایانی تا صومعه شنی و باریک و جابه‌جا چاله‌دار. در هوای خشک خودروی معمولی
    هم بالا می‌رود، اما پس از باران یا برف ارتفاع کف خودرو اهمیت دارد. سوخت را در آخالتسیخه بگیرید.
he:
  name: מנזר זרזמה
  short: כנסייה מן המאה ה-14 בעמק קוובליאני מעל אדיגני, ובה דיוקנאות בית ג'קלי ומגדל פעמונים קדום.
  body: >-
    **זרזמה הוא המנזר המרכזי של הפינה המערבית של סמצחה,** מעל אדיגני בעמק קוובליאני, בגובה של כ-1,250
    מטר, בקו שבו היער מתחלף בשדות מספוא.


    המסורת מייחסת את הקמתו למאה ה-9 ולסרפיון הקדוש מזרזמה. את קורות חייו כתב במאה ה-10 בסיל מזרזמה, והטקסט
    הזה הוא יצירה חשובה בהגיוגרפיה הגאורגית: נדיר שסיפור ייסודו של מנזר ידוע ממקור כה קרוב בזמן לאירוע.


    כנסיית ההשתנות העומדת היום היא מראשית המאה ה-14 ונבנתה בחסות בקה ג'קלי, האטבג של סמצחה. זהו מבנה צלב
    מכופף עם חזית אבן נקייה וכמעט חמורה. בפנים ציורי קיר מן המאות ה-14 עד ה-16, ובהם דיוקנאות בית ג'קלי,
    אותם אנשים ששלטו במחוז הזה יותר ממאתיים שנה.


    בחצר עומד **מגדל פעמונים** נפרד, מן המוקדמים ששרדו בגאורגיה, מן המאה ה-14, ובו גילוף עשיר סביב הפתחים.
    מבקרים רבים זוכרים אותו טוב יותר מן הכנסייה עצמה.


    איקונת ההשתנות מסוף המאה ה-9 שהגיעה מזרזמה נמצאת כיום במוזיאון הלאומי של גאורגיה, מן העתיקות שבין
    יצירות ציור האיקונות הגאורגי.


    מראה העמק כיום נעוץ בתאריך אחד מסוים. ב-1944 גורשו המסחתים המוסלמים מעמק קוובליאני ועשרות כפרים התרוקנו
    בלילה אחד; המחוז יושב מחדש במשפחות מאימרתי, מראצ'ה ומאג'ריה. משום כך עומדים לאורך הדרך בתי אבן ישנים
    לצד בנייה כפרית חדשה בהרבה.


    בתקופה העות'מאנית התרוקן המנזר, והוקם מחדש רק בסביבות ראשית המאה ה-20; כיום הוא פעיל שוב. המקום שקט
    מאוד: כמעט אף אחד מן הנוסעים המגיעים לאחלציחה אינו ממשיך עד לכאן, וגם בסופי שבוע נשארים לא פעם לבד
    בחצר.
  tip: >-
    שעה וחצי היא זמן נוח. החצר מכוסה עשב ויורדת בתלילות, ואחרי גשם היא מחליקה, ולכן נעליים עם אחיזה עדיפות
    על סוליה חלקה. הפנים מואר באור יום בלבד, אז בחרו אמצע יום בהיר אם ברצונכם לראות את ציורי הקיר. חלים
    כללי לבוש: מטפחת וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים, וכיסויים מונחים בדרך כלל ליד הדלת. קנו
    אוכל ומים באדיגני, כי במנזר אין דבר. השירותים בסיסיים.
  route: >-
    סעו מטביליסי דרך בורג'ומי ואחלציחה: בכביש E60 עד חשורי ואז דרומה, 205 ק״מ עד אחלציחה, ומשם עוד כשלושים
    קילומטרים מערבה לכיוון אדיגני. בסך הכול 235 ק״מ, קרוב לארבע שעות. הכביש אחלציחה-אדיגני סלול, אך הקילומטרים
    האחרונים אל המנזר הם חצץ צר עם בורות במקומות. במזג אוויר יבש גם רכב רגיל יעלה; אחרי גשם או שלג מרווח
    הגחון חשוב. תדלקו באחלציחה.
ar:
  name: دير زارزما
  short: كنيسة من القرن الرابع عشر في وادي كوابلياني فوق أديغيني، فيها صور آل جاقلي وبرج أجراس مبكر.
  body: >-
    **زارزما هو الدير الرئيسي في الركن الغربي من سامتسخه،** فوق أديغيني في وادي كوابلياني، على ارتفاع
    نحو 1250 متراً عند الخط الذي تتحول عنده الغابة إلى مروج حشيش.


    تنسب الرواية تأسيسه إلى القرن التاسع وإلى القديس سرابيون الزارزمي. وقد كتب سيرته في القرن العاشر باسيل
    الزارزمي، وهذا النص من أعمال السير القديسية الجورجية المهمة: ومن النادر أن نعرف قصة تأسيس دير من مصدر
    بهذا القرب من الحدث.


    أما كنيسة التجلي القائمة اليوم فتعود إلى أوائل القرن الرابع عشر وبُنيت برعاية بكا جاقلي أتابك سامتسخه.
    وهي بناء صليبي مقبب بواجهة حجرية نظيفة تكاد تكون صارمة. وفي الداخل رسوم جدارية من القرن الرابع عشر
    إلى السادس عشر، منها صور آل جاقلي، أولئك الذين حكموا هذه الولاية أكثر من مئتي سنة.


    وفي الفناء **برج أجراس** قائم بذاته، من أقدم ما بقي في جورجيا، يعود إلى القرن الرابع عشر ويحمل نقشاً
    غنياً حول فتحاته. ويتذكره كثير من الزوار أكثر مما يتذكرون الكنيسة نفسها.


    أما أيقونة التجلي من أواخر القرن التاسع التي جاءت من زارزما فهي اليوم في المتحف الوطني الجورجي، من
    أقدم ما بقي من التصوير الأيقوني الجورجي.


    ويعود مظهر الوادي اليوم إلى تاريخ بعينه. ففي عام 1944 رُحّل المسخيتيون المسلمون من وادي كوابلياني
    وخلت عشرات القرى في ليلة واحدة؛ ثم أُسكنت الناحية لاحقاً بأسر من إيميريتي وراتشا وأدجارا. ولهذا تقف
    على جانب الطريق بيوت حجرية قديمة إلى جوار عمارة قروية أحدث بكثير.


    خلا الدير في القرون العثمانية ولم يُعَد إحياؤه إلا مع مطلع القرن العشرين؛ وهو اليوم عامر من جديد.
    والمكان هادئ جداً: فلا يكاد أحد ممن يصلون أخالتسيخه يتابع إلى هنا، وحتى في العطل تبقى وحدك في الفناء
    غالباً.
  tip: >-
    ساعة ونصف وقت مريح. والفناء عشبي ينحدر بشدة ويصير زلقاً بعد المطر، فالحذاء ذو النعل المحزز أفضل من
    الأملس. ولا يضيء الداخل إلا ضوء النهار، فاختر منتصف يوم صافٍ إن أردت رؤية الرسوم. وتُطبق قواعد اللباس:
    غطاء رأس وتنورة طويلة للنساء وبنطال طويل للرجال، والأغطية عادة عند الباب. اشترِ الطعام والماء في أديغيني
    فليس عند الدير شيء. ودورة المياه بسيطة.
  route: >-
    سر من تبليسي عبر بورجومي وأخالتسيخه: الطريق E60 حتى خاشوري ثم جنوباً، 205 كم إلى أخالتسيخه، ومنها
    نحو ثلاثين كيلومتراً غرباً باتجاه أديغيني. المجموع 235 كم ونحو أربع ساعات. طريق أخالتسيخه-أديغيني
    معبّد، لكن الكيلومترات الأخيرة صعوداً إلى الدير حصوية ضيقة وفيها حفر في مواضع. وفي الطقس الجاف تصعدها
    سيارة عادية، أما بعد المطر أو الثلج فارتفاع الهيكل مهم. تزوّد بالوقود في أخالتسيخه.
