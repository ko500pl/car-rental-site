ka:
  name: ზარზმის მონასტერი
  short: >-
    XIV საუკუნის სავანე ახალციხის დასავლეთით, კვაბლიანის ტყიან ხეობაში, ჯაყელთა პორტრეტებითა და საქართველოს
    ერთ-ერთი უდიდესი სამრეკლოთი.
  body: >-
    **ზარზმაში, სამლოცველოს შესასვლელის თაღზე, ქართული წარწერა 979 წელს იხსენებს, როცა ქართველმა დიდებულებმა
    ბიზანტიის კეისარს, ბასილი II-ს, ლაშქარი მიაშველეს აჯანყებული სარდლის, ბარდა სკლიაროსის, დასამარცხებლად.**
    ეს იმ მცირეთაგანია, რაც პირველი მონასტრიდან შემორჩა. ის ბერმა სერაპიონმა დააარსა, წყაროების მიხედვით
    VIII ან IX საუკუნეში, მისი ცხოვრება კი ბასილი ზარზმელმა აღწერა და ეს თხზულება ძველი ქართული ჰაგიოგრაფიის
    ერთ-ერთ კლასიკურ ძეგლად ითვლება.


    მონასტერი კვაბლიანისა და მისი შენაკადის, ძინძეს, ტყიან ხეობაში დგას, ახალციხიდან დაახლოებით 30 კილომეტრზე
    დასავლეთით, ზღვის დონიდან დაახლოებით 1250 მეტრზე. ფერისცვალების ტაძარი XIV საუკუნის დასაწყისში სამცხის
    მთავრის, ბექა I ჯაყელის, ქტიტორობით აშენდა; გადმოცემა მის ხუროთმოძღვრად გარბანელს ასახელებს. ეს ჯვარგუმბათოვანი
    ტაძარია, გუმბათის ყელში თორმეტი სარკმელია, მათგან ნახევარი ყრუ, კარ-სარკმლებს კი ჩუქურთმიანი ჯვრები
    შემოუყვება, ყველაზე უხვად აღმოსავლეთ ფასადზე.


    შიგნით მოხატულობა დაზიანებულია, სახეები კი ჯერაც ცოცხლობს. სამხრეთ კედელზე ოთხი ჯაყელი დგას: სარგის
    I, ბექა I, სარგის II და ყვარყვარე I; ჩრდილოეთ კედელზე უფრო გვიანდელი პირები არიან, მათ შორის იმერეთის
    მეფე ბაგრატ III, გიორგი ჭორჭანელი და სიმონ გურიელი.


    სამრეკლო, საქართველოში ერთ-ერთი უდიდესი, თავდაპირველად გალავნის ნაწილი იყო და მისი ქვედა სართული მონასტრის
    შესასვლელს წარმოადგენდა; ზემოთ რვათაღიანი რვაწახნაგა ზარებს ატარებს. 1577 წელს ხურციძეებმა, რომლებიც
    მონასტერს 1544 წლიდან პატრონობდნენ, იგი ეკლესიადაც აქციეს.


    ოსმალთა დაპყრობის შემდეგ ბერებმა მონასტერი დატოვეს. XIX-XX საუკუნეების მიჯნაზე ტაძარი არქიტექტორმა
    ვ. სვინინმა და მხატვარმა ა. სლავცევმა აღადგინეს, თუმცა ძველი დეტალების ნაწილი დაიკარგა; დღეს აქ კვლავ
    ძმობა მოღვაწეობს. დილით მოდით, როცა მზე აღმოსავლეთ ფასადს ეფინება და ქვის ჯვრები ისე გამოიკვეთება,
    თითქოს ახლახან ამოუკვეთიათ.
  tip: >-
    საათნახევარი გამოყავით. ეს მოქმედი მონასტერია: ქალებს თავსაფარი და კაბა სჭირდებათ, კაცებს გრძელი შარვალი,
    მოსასხამები კი, როგორც წესი, კართან ჰკიდია. შიგნით გადაღებამდე ნებართვა ითხოვეთ, წირვის დროს ხმადაბლა
    ილაპარაკეთ. ინტერიერი მხოლოდ დღის სინათლითაა განათებული, ამიტომ პორტრეტები ნათელ, გვიან დილას ყველაზე
    კარგად ჩანს. კაფე არ არის, საჭმელი და წყალი ადიგენში ან ახალციხეში იყიდეთ. ეზო დაქანებულია და წვიმის
    შემდეგ სრიალებს. თუ დრო გაქვთ, აბასთუმანშიც აიარეთ, ახალ ზარზმაში: ეს ზარზმის შემცირებული ასლია, 1899–1902
    წლებში აგებული და მიხეილ ნესტეროვის მოხატული.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ ხაშურამდე დაახლოებით 130 კილომეტრია, შემდეგ S8-ით სამხრეთისკენ,
    ბორჯომის გავლით ახალციხემდე, სულ 205 კილომეტრი. ახალციხიდან ბათუმის გზას დასავლეთისკენ მიჰყევით, ადიგენს
    გაივლით და დაახლოებით 30 კილომეტრში სოფელ ზარზმაში მიხვალთ: სულ 235 კმ და თითქმის ოთხი საათი. სოფლამდე
    გზა ასფალტია, კვაბლიანის ხეობაში მიხვეულ-მოხვეული; მონასტრის ჭიშკრამდე ბოლო მოკლე აღმართი ვიწროა და
    ზოგჯერ დაზიანებული. მშრალ ამინდში ნებისმიერი მანქანა ავა, წვიმის ან თოვლის შემდეგ კი ჯიპის კლირენსი
    და გამავლობა გამოგადგებათ. საწვავი ახალციხეში ჩაასხით.
en:
  name: Zarzma Monastery
  short: >-
    A 14th-century monastery in the forested Kvabliani valley west of Akhaltsikhe, with portraits of the
    Jaqeli princes and one of Georgia's largest bell towers.
  body: >-
    **Over a chapel doorway at Zarzma, a Georgian inscription remembers the year 979, when Georgian nobles
    sent troops to help the Byzantine emperor Basil II put down the rebel general Bardas Sclerus.** It
    is one of the few stones left from the first monastery, founded by the monk Serapion in the 8th or
    9th century, depending on the source. His life, written by Basil of Zarzma, is one of the early classics
    of Georgian hagiography.


    The monastery stands in the forested valley of the Kvabliani and its tributary the Dzindze, about
    30 km west of Akhaltsikhe, at around 1,250 metres. The Church of the Transfiguration rose in the early
    14th century under Beka I Jaqeli, prince of Samtskhe; tradition names its builder as Garbaneli. It
    is a cross-in-square church whose dome drum has twelve windows, half of them blind, and carved crosses
    frame its doors and windows, most richly on the east front.


    Inside, the frescoes are damaged, but the faces hold. On the south wall stand four Jaqeli rulers,
    Sargis I, Beka I, Sargis II and Qvarqvare I; on the north wall a later company, among them Bagrat
    III of Imereti, Giorgi Chorchaneli and Simon Gurieli.


    The bell tower, one of the largest in Georgia, began as part of the defensive wall, and its ground
    floor was the monastery gate; above, an octagon of eight arches carries the bells. In 1577 the Khurtsidze
    family, patrons since 1544, turned it into a church as well.


    After the Ottoman conquest the monks left. Around 1900 the architect V. Svinyin and the artist A.
    Slavtsev rebuilt the church, losing some original detail on the way, and today a brotherhood lives
    here again. Come in the morning, when the sun reaches the east front and the carved crosses stand
    out as if freshly cut.
  tip: >-
    Allow an hour and a half. This is a living monastery: women need a headscarf and a skirt, men long
    trousers, and wraps usually hang by the door. Ask before photographing inside, and keep your voice
    low during services. The interior relies on daylight, so a bright late morning shows the portraits
    best. There is no café; buy food and water in Adigeni or Akhaltsikhe. The yard slopes and turns slippery
    after rain. If you have time, drive on to Abastumani to see Akhali Zarzma, a smaller copy built in
    1899–1902 and painted by Mikhail Nesterov.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south through Borjomi to
    Akhaltsikhe, 205 km in all. From there follow the Batumi road west through Adigeni for about 30 km
    to Zarzma village: 235 km and close to four hours altogether. The road is asphalt to the village,
    with bends through the Kvabliani valley; the last short climb to the monastery gate is narrow and
    can be rough. In dry weather any car manages; after rain or snow, an SUV's clearance and grip are
    worth having. Refuel in Akhaltsikhe.
ru:
  name: Монастырь Зарзма
  short: >-
    Монастырь XIV века в лесистой долине Кваблиани к западу от Ахалцихе — с портретами князей Джакели
    и одной из самых больших колоколен Грузии.
  body: >-
    **Над входом в часовню Зарзмы грузинская надпись хранит память о 979 годе, когда грузинские вельможи
    послали войско на помощь византийскому императору Василию II, подавлявшему мятеж полководца Варды
    Склира.** Это один из немногих камней, уцелевших от первого монастыря: его основал монах Серапион
    в VIII или IX веке — источники здесь расходятся. Житие Серапиона, написанное Василием Зарзмским, —
    один из ранних классических памятников грузинской агиографии.


    Монастырь стоит в лесистой долине Кваблиани и её притока Дзиндзе, примерно в 30 км к западу от Ахалцихе,
    на высоте около 1250 метров. Церковь Преображения поднялась в начале XIV века при Беке I Джакели,
    владетеле Самцхе; зодчим её предание называет Гарбанели. Это крестово-купольный храм: барабан купола
    прорезан двенадцатью окнами, половина из которых глухие, а двери и окна обрамлены резными крестами
    — богаче всего на восточном фасаде.


    Росписи внутри пострадали, но лица уцелели. На южной стене стоят четыре правителя из рода Джакели
    — Саргис I, Бека I, Саргис II и Кваркваре I; на северной — фигуры более позднего времени, среди них
    Баграт III Имеретинский, Гиорги Чорчанели и Симон Гуриели.


    Колокольня, одна из самых больших в Грузии, изначально входила в оборонительную стену, а в её нижнем
    ярусе были ворота монастыря; выше восьмигранник из восьми арок несёт колокола. В 1577 году род Хурцидзе,
    покровительствовавший обители с 1544 года, превратил колокольню ещё и в церковь.


    После османского завоевания монахи ушли. Около 1900 года архитектор В. Свиньин и художник А. Славцев
    восстановили храм, не сохранив часть подлинных деталей, и сегодня здесь снова живёт братия. Приезжайте
    утром, когда солнце выходит на восточный фасад и резные кресты проступают так, будто их высекли только
    что.
  tip: >-
    Заложите полтора часа. Монастырь действующий: женщинам нужны платок и юбка, мужчинам — длинные брюки;
    накидки обычно висят у входа. Прежде чем фотографировать внутри, спросите разрешения, а во время службы
    говорите вполголоса. Интерьер освещается только дневным светом, поэтому портреты лучше всего видны
    ясным поздним утром. Кафе здесь нет — еду и воду купите в Адигени или Ахалцихе. Двор идёт под уклон
    и после дождя становится скользким. Если остаётся время, съездите в Абастумани и посмотрите Ахали-Зарзму
    — уменьшенную копию, построенную в 1899–1902 годах и расписанную Михаилом Нестеровым.
  route: >-
    Из Тбилиси поезжайте по E60/S1 на запад до Хашури, около 130 км, затем по S8 на юг через Боржоми до
    Ахалцихе — всего 205 км. Оттуда держитесь батумской дороги на запад через Адигени ещё примерно 30
    км до села Зарзма: в сумме 235 км и почти четыре часа пути. До села лежит асфальт, петляющий по долине
    Кваблиани; последний короткий подъём к воротам монастыря узкий и местами неровный. В сухую погоду
    справится любая машина; после дождя или снега клиренс и сцепление внедорожника очень пригодятся. Заправьтесь
    в Ахалцихе.
fa:
  name: صومعهٔ زارزما
  short: >-
    صومعه‌ای از سدهٔ چهاردهم در درهٔ جنگلی کوابلیانی در غرب آخالتسیخه، با چهره‌نگاره‌های امیران خاندان
    جاقلی و یکی از بزرگ‌ترین برج‌های ناقوس گرجستان.
  body: >-
    **بر سرِ درِ نمازخانه‌ای در زارزما، کتیبه‌ای گرجی یاد سال ۹۷۹ را نگه داشته است؛ سالی که بزرگان گرجی
    سپاه فرستادند تا باسیل دوم، امپراتور بیزانس، را در سرکوب شورش سردار بیزانسی، بارداس اسکلروس، یاری
    کنند.** این سنگ از معدود بازمانده‌های نخستین صومعه است که راهبی به نام سراپیون، بسته به منبع، در سدهٔ
    هشتم یا نهم بنیاد نهاد. زندگی‌نامهٔ او به قلم باسیل زارزمایی از نخستین آثار کلاسیک قدیس‌نامه‌نویسی
    گرجی است.


    صومعه در درهٔ جنگلی رود کوابلیانی و شاخابهٔ آن، دزیندزه، برپاست؛ حدود ۳۰ کیلومتری غرب آخالتسیخه و
    در ارتفاع نزدیک به ۱۲۵۰ متر. کلیسای تجلی در اوایل سدهٔ چهاردهم، در روزگار بکای یکم جاقلی، فرمانروای
    سامتسخه، سر برآورد؛ روایت، سازندهٔ آن را گاربانلی می‌داند. بنا کلیسایی با نقشهٔ صلیب در مربع است؛
    گریو گنبدش دوازده پنجره دارد که نیمی از آن‌ها کورند، و صلیب‌های کنده‌کاری‌شده درها و پنجره‌ها را قاب
    گرفته‌اند؛ پرکارتر از همه در نمای شرقی.


    درون کلیسا نقاشی‌های دیواری آسیب دیده‌اند، اما چهره‌ها برجا مانده‌اند. بر دیوار جنوبی چهار فرمانروای
    خاندان جاقلی ایستاده‌اند: سرگیس یکم، بکای یکم، سرگیس دوم و قورقوره یکم؛ و بر دیوار شمالی گروهی از
    روزگاری دیرتر، از جمله باگرات سوم ایمرتی، گیورگی چورچانلی و سیمون گوریلی.


    برج ناقوس، که از بزرگ‌ترین برج‌های ناقوس گرجستان است، در آغاز بخشی از دیوار دفاعی بود و طبقهٔ همکفش
    دروازهٔ صومعه به شمار می‌رفت؛ در بالا، هشت‌ضلعی‌ای با هشت طاق ناقوس‌ها را بر دوش دارد. در سال ۱۵۷۷
    خاندان خورتسیدزه، که از ۱۵۴۴ حامی صومعه بودند، برج را افزون بر کارکرد پیشینش به کلیسا نیز بدل کردند.


    پس از چیرگی عثمانی، راهبان صومعه را ترک کردند. حدود سال ۱۹۰۰ معمار و. سوینین و نقاش آ. اسلاوتسف کلیسا
    را بازسازی کردند و در این کار برخی جزئیات اصیل از دست رفت؛ امروز باز جمعی از راهبان اینجا زندگی می‌کنند.
    صبح بیایید، وقتی آفتاب بر نمای شرقی می‌تابد و صلیب‌های کنده‌کاری‌شده چنان برجسته می‌شوند که گویی همین
    حالا تراشیده شده‌اند.
  tip: >-
    یک ساعت و نیم وقت بگذارید. این صومعه هنوز فعال است: زنان به روسری و دامن نیاز دارند و مردان به شلوار
    بلند؛ معمولاً کنار در پوشش‌هایی آویخته است. پیش از عکاسی در داخل اجازه بگیرید و هنگام مراسم نیایش
    آهسته سخن بگویید. فضای درون تنها با نور روز روشن می‌شود، پس چهره‌نگاره‌ها در اواخر صبحی آفتابی بهتر
    از هر وقت دیگر دیده می‌شوند. کافه‌ای در کار نیست؛ خوراک و آب را از آدیگنی یا آخالتسیخه بخرید. حیاط
    شیب دارد و پس از باران لیز می‌شود. اگر وقت دارید، تا آباستومانی برانید و آخالی زارزما را ببینید؛ نسخه‌ای
    کوچک‌تر که در سال‌های ۱۸۹۹–۱۹۰۲ ساخته شد و میخائیل نستروف آن را نقاشی کرد.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب تا خاشوری بگیرید، حدود ۱۳۰ کیلومتر؛ سپس با جادهٔ S8 به جنوب بپیچید
    و از راه بورجومی به آخالتسیخه بروید: روی هم ۲۰۵ کیلومتر. از آنجا جادهٔ باتومی را به سمت غرب دنبال
    کنید و از آدیگنی بگذرید تا پس از حدود ۳۰ کیلومتر به روستای زارزما برسید: در مجموع ۲۳۵ کیلومتر و نزدیک
    به چهار ساعت. جاده تا روستا آسفالت است و پیچ‌وتاب‌خوران از درهٔ کوابلیانی می‌گذرد؛ سربالایی کوتاه
    پایانی تا دروازهٔ صومعه باریک است و ممکن است ناهموار باشد. در هوای خشک هر خودرویی از پسش برمی‌آید؛
    پس از باران یا برف، ارتفاع از زمین و چسبندگی یک شاسی‌بلند بسیار به کار می‌آید. در آخالتسیخه سوخت‌گیری
    کنید.
he:
  name: מנזר זרזמה
  short: >-
    מנזר מן המאה ה-14 בעמק המיוער של הקוובליאני, מערבית לאחאלציחה, ובו דיוקנאות נסיכי בית ג'קלי ואחד ממגדלי
    הפעמונים הגדולים בגאורגיה.
  body: >-
    **מעל פתחה של קפלה בזרזמה, כתובת גאורגית מנציחה את שנת 979, שבה שלחו אצילים גאורגים כוחות לסייע לקיסר
    הביזנטי בסיליוס השני לדכא את מרדו של המצביא ברדס סקלרוס.** זו אחת האבנים הבודדות שנותרו מן המנזר הראשון,
    שייסד הנזיר סרפיון במאה ה-8 או ה-9 – תלוי במקור. תולדות חייו, שכתב בסיליוס מזרזמה, הם מיצירות המופת
    המוקדמות של ההגיוגרפיה הגאורגית.


    המנזר ניצב בעמק המיוער של נהר הקוובליאני ויובלו הדזינדזה, כ-30 ק"מ מערבית לאחאלציחה, בגובה של כ-1,250
    מטר. כנסיית ההשתנות הוקמה בראשית המאה ה-14, בימי בקה הראשון ג'קלי, נסיך סמצחה; לפי המסורת, בנה אותה
    גרבנלי. זו כנסייה בתכנית "צלב בתוך ריבוע": בתוף הכיפה שנים-עשר חלונות, מחציתם עיוורים, וצלבים מגולפים
    ממסגרים את הדלתות והחלונות – בעושר הרב ביותר בחזית המזרחית.


    ציורי הקיר שבתוך הכנסייה ניזוקו, אבל פני הדמויות שרדו. על הקיר הדרומי עומדים ארבעה שליטים מבית ג'קלי:
    סרגיס הראשון, בקה הראשון, סרגיס השני וקוורקווארה הראשון; על הקיר הצפוני – קבוצה מתקופה מאוחרת יותר,
    ובה בגרט השלישי מאימרתי, גיורגי צ'ורצ'נלי וסימון גוריאלי.


    מגדל הפעמונים, מן הגדולים בגאורגיה, היה בתחילה חלק מחומת ההגנה, וקומת הקרקע שלו שימשה שער המנזר; מעליה
    נושא מתומן בן שמונה קשתות את הפעמונים. משפחת חורצידזה, פטרונית המנזר מאז 1544, הפכה ב-1577 את המגדל
    גם לכנסייה.


    לאחר הכיבוש העות'מאני עזבו הנזירים. בסביבות שנת 1900 שחזרו את הכנסייה האדריכל ו' סביניין והצייר א'
    סלבצב, ובדרך אבדו כמה מפרטיה המקוריים; כיום חיה כאן שוב קהילת נזירים. בואו בבוקר, כשהשמש מגיעה לחזית
    המזרחית והצלבים המגולפים בולטים כאילו נחצבו זה עתה.
  tip: >-
    הקדישו לביקור שעה וחצי. זהו מנזר פעיל: נשים צריכות כיסוי ראש וחצאית, וגברים – מכנסיים ארוכים; בדרך
    כלל תלויים ליד הדלת בדים להתכסות בהם. בקשו רשות לפני שאתם מצלמים בפנים, ודברו בשקט בזמן התפילות. חלל
    הכנסייה מואר באור יום בלבד, ולכן הדיוקנאות נראים במיטבם בשעות הבוקר המאוחרות של יום בהיר. אין כאן
    בית קפה; קנו אוכל ומים באדיגני או באחאלציחה. החצר משופעת ונעשית חלקלקה אחרי גשם. אם נשאר לכם זמן,
    המשיכו לאבסטומני כדי לראות את אחלי זרזמה – העתק קטן יותר, שנבנה ב-1899–1902 ואת ציורי הקיר שלו צייר
    מיכאיל נסטרוב.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק"מ, ומשם דרומה בכביש S8 דרך בורג'ומי עד אחאלציחה
    – 205 ק"מ מטביליסי. משם המשיכו מערבה בכביש לבטומי, דרך אדיגני, עוד כ-30 ק"מ עד הכפר זרזמה: בסך הכול
    235 ק"מ וקרוב לארבע שעות נסיעה. הכביש סלול עד הכפר ומתפתל לאורך עמק הקוובליאני; העלייה הקצרה האחרונה
    אל שער המנזר צרה ועלולה להיות משובשת. במזג אוויר יבש כל רכב יעבור; אחרי גשם או שלג, מרווח הגחון והאחיזה
    של רכב שטח בהחלט יועילו. תדלקו באחאלציחה.
ar:
  name: دير زارزما
  short: >-
    دير من القرن الرابع عشر في وادي كوابلياني الحرجيّ غربيّ أخالتسيخي، فيه صور أمراء آل جاقلي وأحد أكبر
    أبراج الأجراس في جورجيا.
  body: >-
    **فوق مدخل كنيسة صغيرة في زارزما، يحفظ نقش جورجي ذكرى عام 979، حين أرسل نبلاء جورجيون جنودًا لمساعدة
    الإمبراطور البيزنطي باسيل الثاني على إخماد تمرّد القائد بارداس سكليروس.** وهو من الحجارة القليلة الباقية
    من الدير الأول الذي أسّسه الراهب سرابيون في القرن الثامن أو التاسع، بحسب المصدر. أما سيرة حياته التي
    كتبها باسيل الزارزمي فتُعدّ من الأعمال الكلاسيكية المبكرة في أدب سِيَر القديسين الجورجي.


    يقوم الدير في الوادي الحرجيّ لنهر كوابلياني ورافده دزيندزي، على بُعد نحو 30 كم غربيّ أخالتسيخي، وعلى
    ارتفاع يقارب 1250 مترًا. شُيّدت كنيسة التجلّي في مطلع القرن الرابع عشر في عهد بيكا الأول جاقلي، أمير
    سامتسخه، ويذكر التقليد أن بانيها يُدعى غاربانيلي. وهي كنيسة على مخطط الصليب داخل المربع، في أسطوانة
    قبّتها اثنتا عشرة نافذة نصفها صمّاء، وتؤطّر الصلبانُ المنحوتة أبوابها ونوافذها، وأغنى ما تكون على
    الواجهة الشرقية.


    في الداخل تضرّرت الجداريات، لكن الوجوه صمدت. على الجدار الجنوبي يقف أربعة من حكّام آل جاقلي: سركيس
    الأول، وبيكا الأول، وسركيس الثاني، وقوارقواري الأول؛ وعلى الجدار الشمالي جمعٌ من عهد لاحق، منهم باغرات
    الثالث الإيميريتي، وغيورغي تشورتشانيلي، وسيمون غورييلي.


    برج الأجراس، وهو من أكبر أبراج الأجراس في جورجيا، كان في الأصل جزءًا من السور الدفاعي، وكان طابقه
    الأرضي بوابة الدير؛ وفي أعلاه مثمّن من ثمانية أقواس يحمل الأجراس. وفي عام 1577 حوّلته أسرة خورتسيدزي،
    راعية الدير منذ 1544، إلى كنيسة أيضًا.


    بعد استيلاء العثمانيين على المنطقة هجر الرهبان الدير. ونحو عام 1900 أعاد المعماري ف. سفينين والرسام
    أ. سلافتسيف بناء الكنيسة، فضاعت في أثناء ذلك بعض تفاصيلها الأصلية، واليوم تسكنه جماعة رهبانية من جديد.
    تعالوا في الصباح، حين تبلغ الشمس الواجهة الشرقية فتبرز الصلبان المنحوتة كأنها نُقشت للتوّ.
  tip: >-
    خصّصوا للزيارة ساعة ونصف الساعة. هذا دير عامر بالرهبان: على النساء غطاء للرأس وتنّورة، وعلى الرجال
    سراويل طويلة، وعادةً ما تُعلَّق عند الباب أغطية يُلتفّ بها. استأذنوا قبل التصوير في الداخل، واخفضوا
    أصواتكم أثناء الصلوات. يعتمد الداخل على ضوء النهار وحده، لذا تظهر الصور الجدارية على أفضل وجه في ضحى
    يوم مشرق. لا يوجد مقهى؛ اشتروا الطعام والماء من أديغيني أو أخالتسيخي. الفناء منحدر ويصبح زلقًا بعد
    المطر. وإن اتّسع وقتكم فتابعوا إلى أباستوماني لتروا أخالي زارزما، وهي نسخة أصغر بُنيت بين 1899 و1902
    ورسم جدارياتها ميخائيل نيستيروف.
  route: >-
    من تبليسي خذوا الطريق E60/S1 غربًا حتى خاشوري، نحو 130 كم، ثم اتجهوا جنوبًا على الطريق S8 عبر بورجومي
    حتى أخالتسيخي: 205 كم في المجمل. ومن هناك اتبعوا طريق باتومي غربًا مرورًا بأديغيني نحو 30 كم حتى قرية
    زارزما: 235 كم وما يقارب أربع ساعات من تبليسي. الطريق معبّد حتى القرية ويتلوّى في وادي كوابلياني،
    أما الصعود القصير الأخير إلى بوابة الدير فضيّق وقد يكون وعرًا. في الطقس الجاف تجتازه أي سيارة، أما
    بعد المطر أو الثلج فارتفاع سيارة الدفع الرباعي عن الأرض وتماسكها على الطريق مفيدان حقًّا. تزوّدوا
    بالوقود في أخالتسيخي.
