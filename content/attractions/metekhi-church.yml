ka:
  name: მეტეხის ღვთისმშობლის ეკლესია
  short: კლდის თავზე მდგარი XIII საუკუნის ეკლესია გორგასლის ძეგლთან — ძველი თბილისის საუკეთესო ხედი მდინარეზე.
  body: >-
    **მეტეხი იმ ადგილას დგას, სადაც თბილისი დაიწყო.** კლდე მტკვრის მარცხენა ნაპირზე მეფის რეზიდენციას
    იტევდა ჯერ კიდევ ვახტანგ გორგასლის დროს, V საუკუნეში, და ტრადიცია სწორედ მას მიაწერს პირველი ეკლესიის
    აშენებას აქ.


    დღევანდელი შენობა გაცილებით გვიანდელია: ის 1278–1289 წლებში, დემეტრე II თავდადებულის დროს აშენდა,
    ჯვარგუმბათოვანი გეგმით და სამი გამოშვერილი აფსიდით. მისი შემდგომი ისტორია იმაზე მეტყველებს, თუ როგორ
    ეპყრობოდნენ ქალაქს ხელისუფლებები: 1819 წელს რუსულმა ადმინისტრაციამ ეკლესია ყაზარმად აქცია, მოგვიანებით
    კი ციხედ. აქ პატიმრებს შორის მაქსიმ გორკიც იყო. საბჭოთა პერიოდში ის ჯერ ციხედ დარჩა, 1930-იან წლებში
    კი თეატრად გადააკეთეს. ღვთისმსახურება მხოლოდ 1980-იანი წლების ბოლოს დაბრუნდა.


    ტრადიციის თანახმად, ეკლესიაში დაკრძალულია წმინდა შუშანიკი — V საუკუნის მოწამე, ქართული ლიტერატურის
    პირველი შემორჩენილი თხზულების გმირი.


    ტერასაზე, ეკლესიის გვერდით, 1967 წელს დაიდგა ვახტანგ გორგასლის ცხენოსანი ქანდაკება — ელგუჯა ამაშუკელის
    ნამუშევარი, ქალაქის ერთ-ერთი ყველაზე ხშირად ფოტოგადაღებული სილუეტი.


    სიმართლე ისაა, რომ ეკლესიის ინტერიერი მოკრძალებულია — ძველი მოხატულობა თითქმის არ შემორჩა. აქ იმისთვის
    მოდიან, რაც გარეთაა: ხედი კლდიდან აბანოთუბნის გუმბათებზე, ნარიყალაზე, მშვიდობის ხიდსა და მდინარის
    მოსახვევზე. საღამოს, როცა განათება ინთება, ეს თბილისის ყველაზე ცნობადი პანორამაა.


    ტერასიდან პირდაპირ ჩანს ის ადგილი, საიდანაც ქალაქის სახელი მოდის. გადმოცემით, ვახტანგ გორგასალი აქ
    ნადირობდა, დაჭრილი ხოხობი ცხელ წყალში ჩავარდა და მეფემ ბრძანა ქალაქის აშენება — „თბილი" ნიშნავს თბილს,
    და გოგირდის თბილი წყარო დღემდე იმავე ადგილას მოდის. ეს ლეგენდაა, მაგრამ არქეოლოგია ადასტურებს, რომ
    დასახლება აქ ლეგენდაზე ბევრად ადრეც იყო.
  tip: >-
    ოცდაათი წუთი სავსებით საკმარისია. ეკლესიამდე რამდენიმე საფეხურია, ტერასა კი ბრტყელია და ეტლისთვისაც
    გამოსადეგი. ჩაცმის წესები მოქმედებს, თავსაფრები კართან დევს. ტერასაზე მოაჯირი დაბალია — ბავშვს თვალი
    ადევნე. საუკეთესო შუქი დილითაა ან მზის ჩასვლისას; შუადღისას ხედი პირდაპირ მზეშია და ფოტო ცუდად გამოდის.
    ტუალეტი და კაფეები ქვემოთ, გორგასლის მოედანთანაა. ზამთარში კლდეზე ქარია.
  route: >-
    მარცხენა ნაპირზე ხარ: ცენტრიდან ბარათაშვილის ან მეტეხის ხიდით გადმოდი და ავალ მეტეხის აღმართზე. თავად
    ეკლესიის წინ პატარა მოედანია, სადაც რამდენიმე მანქანა ჩერდება, მაგრამ ის თითქმის ყოველთვის სავსეა
    და ტურისტული ავტობუსებიც აქ ჩერდება. უფრო საიმედოა რიყის პარკის ქვედა პარკინგი, საიდანაც აღმართზე
    10 წუთია ფეხით, ან ზონალური ადგილები გულუას და ავლაბრის მიმართულებით. ავლაბრის მეტროსადგურიდან ეკლესიამდე
    ასევე 10 წუთია. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Metekhi Church
  short: A thirteenth-century church on the cliff beside the Gorgasali statue, with the best view of old
    Tbilisi.
  body: >-
    **Metekhi stands where Tbilisi began.** The rock above the left bank of the Mtkvari held a royal residence
    as early as the fifth century, in the time of Vakhtang Gorgasali, and tradition credits him with building
    the first church on the spot.


    What stands now is much later: it was built between 1278 and 1289 under King Demetre II, on a cross-in-square
    plan with three projecting apses. Its later history says a good deal about how successive rulers treated
    the city. In 1819 the Russian administration turned the church into a barracks and then a prison;
    Maxim Gorky was among those held here. Under Soviet rule it stayed a prison and was converted into
    a theatre in the 1930s. Services only returned at the end of the 1980s.


    By tradition, St Shushanik is buried in the church — the fifth-century martyr who is the subject of
    the oldest surviving work of Georgian literature.


    On the terrace beside it stands the equestrian statue of Vakhtang Gorgasali, put up in 1967 by the
    sculptor Elguja Amashukeli; it is one of the most photographed silhouettes in the country.


    The honest assessment is that the interior is plain — almost no old wall painting survives, and there
    is not much to detain you. People come for what is outside: the view from the cliff edge over the
    brick domes of the sulphur baths, Narikala on the opposite ridge, the Bridge of Peace and the bend
    of the river. In the evening, when the floodlights come on, this is the postcard of Tbilisi.


    From the terrace you look straight down at the place the city is named after. By tradition Vakhtang
    Gorgasali was hunting here when a wounded pheasant fell into a hot spring, and the king ordered a
    town to be built on the spot — tbili means warm, and the sulphur water still surfaces in the same
    place below. The story is a legend, but archaeology confirms that people were settled on this bend
    of the river long before it.
  tip: >-
    Half an hour is plenty. A few steps lead up to the church, but the terrace itself is flat and manageable
    with a wheelchair. Dress rules apply and scarves are kept by the door. The parapet on the terrace
    is low — keep hold of small children. The light is best in the morning or at sunset; at midday you
    are shooting straight into the sun and the photographs come out flat. Toilets and cafes are down at
    Gorgasali Square. The cliff is windy in winter.
  route: >-
    You are on the left bank: from the centre cross by Baratashvili or Metekhi bridge and climb the Metekhi
    rise. There is a small square in front of the church where a handful of cars fit, but it is almost
    always full and tour coaches use it too. More reliable is the lower car park at Rike Park, ten minutes'
    walk up from there, or metered bays towards Gulua Street and Avlabari. Avlabari metro station is also
    ten minutes away on foot. An economy car is enough.
ru:
  name: Церковь Метехи
  short: Храм XIII века на скале рядом с памятником Горгасали и лучший вид на старый Тбилиси.
  body: >-
    **Метехи стоит там, где начался Тбилиси.** Скала над левым берегом Куры несла царскую резиденцию ещё
    в V веке, при Вахтанге Горгасали, и предание приписывает именно ему постройку первой церкви на этом
    месте.


    Нынешнее здание значительно позднее: его возвели между 1278 и 1289 годами при царе Деметре II, в форме
    крестово-купольного храма с тремя выступающими апсидами. Дальнейшая история многое говорит о том,
    как власти обращались с городом. В 1819 году российская администрация превратила церковь в казарму,
    затем в тюрьму; среди заключённых здесь был Максим Горький. В советское время она оставалась тюрьмой,
    а в 1930-х её переделали в театр. Богослужения вернулись только в конце 1980-х.


    По преданию, в церкви погребена святая Шушаник — мученица V века, героиня древнейшего сохранившегося
    произведения грузинской литературы.


    На террасе рядом стоит конная статуя Вахтанга Горгасали работы Элгуджи Амашукели, установленная в
    1967 году, — один из самых снимаемых силуэтов страны.


    Честно говоря, интерьер скромен: старой росписи почти не сохранилось, и задерживаться внутри незачем.
    Сюда приходят ради того, что снаружи: вид с обрыва на кирпичные купола серных бань, Нарикалу на противоположном
    гребне, Мост мира и излучину реки. Вечером, когда включают подсветку, это и есть открыточный Тбилиси.


    С террасы видно прямо то место, от которого пошло имя города. По преданию, Вахтанг Горгасали охотился
    здесь, раненый фазан упал в горячий источник, и царь велел строить город — тбили значит тёплый, а
    серная вода до сих пор выходит на поверхность в том же месте внизу. Это легенда, но археология подтверждает,
    что на этой излучине реки жили задолго до неё.
  tip: >-
    Получаса вполне хватит. К церкви ведёт несколько ступеней, но сама терраса ровная и проходима с коляской.
    Действуют правила одежды, платки лежат у входа. Парапет на террасе низкий — детей держите за руку.
    Лучший свет утром и на закате; в полдень вы снимаете против солнца и кадр выходит плоским. Туалеты
    и кафе внизу, у площади Горгасали. Зимой на скале сильный ветер.
  route: >-
    Вы на левом берегу: из центра переезжайте по мосту Бараташвили или Метехскому и поднимайтесь по Метехскому
    подъёму. Перед церковью есть небольшая площадка на несколько машин, но она почти всегда занята, и
    туда же становятся туристические автобусы. Надёжнее нижняя парковка парка Рике — оттуда десять минут
    пешком вверх, либо размеченные места в сторону улицы Гулуа и Авлабари. От станции метро «Авлабари»
    тоже десять минут пешком. Достаточно машины эконом-класса.
fa:
  name: کلیسای متخی
  short: کلیسایی از سدهٔ سیزدهم بر لبهٔ صخره کنار مجسمهٔ گورگاسالی، با بهترین منظره از تفلیس قدیم.
  body: >-
    **متخی همان‌جایی ایستاده که تفلیس از آن آغاز شد.** صخرهٔ بالای کرانهٔ چپ متکواری از سدهٔ پنجم و در
    زمان واختانگ گورگاسالی اقامتگاه شاهی را در خود داشت، و روایت ساخت نخستین کلیسا در این نقطه را به او
    نسبت می‌دهد.


    آنچه امروز برپاست بسیار متأخرتر است: میان ۱۲۷۸ و ۱۲۸۹ در دورهٔ شاه دمتره دوم ساخته شد، با نقشهٔ صلیب‌در‌مربع
    و سه محراب بیرون‌زده. تاریخ بعدی‌اش دربارهٔ رفتار حاکمان با این شهر بسیار می‌گوید. در ۱۸۱۹ اداره روسی
    کلیسا را به سربازخانه و سپس به زندان بدل کرد؛ ماکسیم گورکی از زندانیان همین‌جا بود. در دورهٔ شوروی
    زندان ماند و در دههٔ ۱۹۳۰ به تئاتر تبدیل شد. مراسم دینی تنها در پایان دههٔ ۱۹۸۰ بازگشت.


    بنا بر روایت، سنت شوشانیک در این کلیسا به خاک سپرده شده است؛ شهیدی از سدهٔ پنجم که موضوع کهن‌ترین
    اثر بازماندهٔ ادبیات گرجی است.


    بر مهتابی کنار کلیسا مجسمهٔ سوارهٔ واختانگ گورگاسالی، کار الگوجا آماشوکلی از سال ۱۹۶۷، ایستاده است؛
    یکی از پرعکس‌ترین نقش‌های شهر.


    داوری منصفانه این است که درون کلیسا ساده است و از نقاشی کهن چیزی نمانده. مردم برای بیرون می‌آیند:
    منظرهٔ لبهٔ صخره بر گنبدهای آجری حمام‌های گوگردی، ناریکالا بر ستیغ روبه‌رو، پل صلح و خم رودخانه. عصرها
    که نورافکن‌ها روشن می‌شوند، این همان تصویر شناخته‌شدهٔ تفلیس است.


    از مهتابی درست به همان جایی نگاه می‌کنید که نام شهر از آن آمده است. بنا بر روایت، واختانگ گورگاسالی
    اینجا شکار می‌کرد که قرقاولی زخمی در چشمه‌ای گرم افتاد و شاه فرمان داد شهری در همان نقطه بسازند؛ تبیلی
    یعنی گرم، و آب گوگردی هنوز در همان جای پایین از زمین بیرون می‌زند. این افسانه است، اما باستان‌شناسی
    تأیید می‌کند که مردم بسیار پیش از آن نیز در این خم رود ساکن بوده‌اند.
  tip: >-
    نیم ساعت بیش از کافی است. چند پله به کلیسا می‌رسد، اما خود مهتابی صاف است و با ویلچر هم شدنی. قواعد
    پوشش برقرار است و شال‌ها کنار در گذاشته شده‌اند. جان‌پناه مهتابی کوتاه است، دست کودکان را نگه دارید.
    بهترین نور صبح یا هنگام غروب است؛ نیمروز رو به خورشید عکس می‌گیرید و تصویر بی‌روح می‌شود. سرویس بهداشتی
    و کافه‌ها پایین، نزدیک میدان گورگاسالی است. زمستان روی صخره باد تندی می‌وزد.
  route: >-
    شما در کرانهٔ چپ هستید: از مرکز شهر از پل باراتاشویلی یا پل متخی بگذرید و از سربالایی متخی بالا بروید.
    جلوی کلیسا میدانچه‌ای هست که چند خودرو در آن جا می‌گیرد، اما تقریباً همیشه پر است و اتوبوس‌های گردشگری
    هم همان‌جا می‌ایستند. مطمئن‌تر پارکینگ پایین پارک ریکه است که ده دقیقه پیاده تا بالا فاصله دارد، یا
    جای‌های خط‌کشی‌شده به سمت خیابان گولوا و آولابری. از ایستگاه مترو آولابری هم ده دقیقه پیاده است. خودروی
    اقتصادی کافی است.
he:
  name: כנסיית מטחי
  short: כנסייה מן המאה ה-13 על הצוק ליד פסל גורגסאלי, ובה הנוף הטוב ביותר על טביליסי העתיקה.
  body: >-
    **מטחי עומדת במקום שבו החלה טביליסי.** הסלע שמעל הגדה השמאלית של המתקוורי נשא מעון מלכותי כבר במאה
    החמישית, בימי וכטנג גורגסאלי, והמסורת מייחסת לו את בניית הכנסייה הראשונה כאן.


    המבנה הנוכחי מאוחר בהרבה: הוא נבנה בין 1278 ל-1289 בימי המלך דמטרה השני, בתוכנית צלב-בריבוע עם שלוש
    אפסידות בולטות. תולדותיו המאוחרות מספרות הרבה על יחסם של השלטונות אל העיר. ב-1819 הפך המנהל הרוסי
    את הכנסייה לקסרקטין ואחר כך לבית כלא; מקסים גורקי היה בין הכלואים כאן. בתקופה הסובייטית נותרה כלא,
    ובשנות ה-30 הוסבה לתיאטרון. התפילות חזרו רק בסוף שנות ה-80.


    על פי המסורת קבורה בכנסייה שושאניק הקדושה, מרטירית מן המאה החמישית שהיא נושא היצירה העתיקה ביותר ששרדה
    בספרות הגאורגית.


    על המרפסת שלצדה ניצב פסל הפרש של וכטנג גורגסאלי, מעשה ידי אלגוג'ה אמאשוקלי משנת 1967 — אחת הסילואטות
    המצולמות ביותר במדינה.


    ההערכה הכנה היא שהפנים פשוט; כמעט לא שרדו ציורי קיר עתיקים. באים לכאן בשביל מה שבחוץ: הנוף משפת הצוק
    אל כיפות הלבנים של מרחצאות הגופרית, אל נריקאלה שברכס ממול, אל גשר השלום ואל סיבוב הנהר. בערב, כשהתאורה
    נדלקת, זו גלויית הנוף של טביליסי.


    מן המרפסת מביטים היישר אל המקום שהעיר קרויה על שמו. לפי המסורת צד כאן וכטנג גורגסאלי, פסיון פצוע נפל
    אל מעיין חם, והמלך ציווה להקים עיר במקום — תבילי פירושו חם, ומי הגופרית עולים עד היום באותו מקום למטה.
    זו אגדה, אך הארכיאולוגיה מאשרת שאנשים ישבו בסיבוב הנהר הזה הרבה לפניה.
  tip: >-
    חצי שעה מספיקה בהחלט. כמה מדרגות מובילות אל הכנסייה, אך המרפסת עצמה מישורית ועבירה גם בכיסא גלגלים.
    חלים כללי לבוש, ומטפחות מונחות ליד הדלת. המעקה במרפסת נמוך — החזיקו ילדים קטנים ביד. האור הטוב ביותר
    בבוקר או בשקיעה; בצהריים מצלמים אל תוך השמש והתמונה יוצאת שטוחה. שירותים ובתי קפה נמצאים למטה, בכיכר
    גורגסאלי. בחורף נושבת על הצוק רוח חזקה.
  route: >-
    אתם בגדה השמאלית: מן המרכז חצו בגשר בראטאשווילי או בגשר מטחי ועלו במעלה מטחי. לפני הכנסייה יש כיכר
    קטנה שנכנסות אליה כמה מכוניות, אך היא כמעט תמיד מלאה ואוטובוסי תיירים עומדים בה גם כן. אמין יותר החניון
    התחתון של פארק ריקה, ומשם עשר דקות הליכה במעלה, או מקומות מסומנים לכיוון רחוב גולואה ואוולברי. גם
    מתחנת הרכבת התחתית אוולברי זו הליכה של עשר דקות. רכב חסכוני מספיק.
ar:
  name: كنيسة ميتيخي
  short: كنيسة من القرن الثالث عشر على حافة الصخر قرب تمثال غورغاسالي، وفيها أفضل إطلالة على تبليسي القديمة.
  body: >-
    **تقوم ميتيخي حيث بدأت تبليسي.** فقد حملت الصخرة المشرفة على الضفة اليسرى لنهر متكفاري مقراً ملكياً
    منذ القرن الخامس في زمن واختانغ غورغاسالي، وتنسب الرواية إليه بناء أول كنيسة في هذا الموضع.


    أما القائم اليوم فمتأخر كثيراً: بُني بين 1278 و1289 في عهد الملك دمتري الثاني، على مخطط الصليب داخل
    المربع بثلاث حنيات بارزة. وتاريخه اللاحق يقول الكثير عن معاملة الحكام لهذه المدينة. ففي 1819 حوّلت
    الإدارة الروسية الكنيسة إلى ثكنة ثم إلى سجن، وكان مكسيم غوركي بين من حُبسوا فيها. وفي العهد السوفييتي
    بقيت سجناً، ثم صارت مسرحاً في الثلاثينيات. ولم تعد الصلوات إلا في أواخر الثمانينيات.


    وبحسب التقليد تُدفن في الكنيسة القديسة شوشانيك، شهيدة القرن الخامس التي هي موضوع أقدم أثر باقٍ في
    الأدب الجورجي.


    وعلى الشرفة المجاورة يقوم تمثال واختانغ غورغاسالي على فرسه، من عمل إلغوجا أماشوكيلي عام 1967، وهو
    من أكثر الظلال المصورة في البلاد.


    والتقدير الصادق أن الداخل بسيط، ولم يبق من الرسوم القديمة شيء يُذكر. والناس يأتون لما في الخارج: المنظر
    من حافة الصخر على قباب حمامات الكبريت الآجرية، وناريكالا على الحافة المقابلة، وجسر السلام، ومنعطف
    النهر. وفي المساء حين تُضاء الكشافات تكون هذه صورة تبليسي المعروفة.


    من الشرفة تنظر مباشرة إلى الموضع الذي أخذت المدينة اسمها منه. تقول الرواية إن واختانغ غورغاسالي كان
    يصيد هنا فسقط تدرج جريح في نبع حار، فأمر الملك ببناء مدينة في المكان؛ و«تبيلي» تعني دافئاً، وما زال
    ماء الكبريت يخرج في الموضع نفسه في الأسفل. هذه أسطورة، لكن الأركيولوجيا تؤكد أن الناس سكنوا منعطف
    النهر هذا قبلها بزمن طويل.
  tip: >-
    نصف ساعة يكفي تماماً. تصعد بضع درجات إلى الكنيسة، لكن الشرفة نفسها مستوية ويمكن اجتيازها بكرسي متحرك.
    وتُطبّق قواعد اللباس، والأغطية موضوعة عند الباب. وحاجز الشرفة منخفض، فامسك يد الأطفال الصغار. وأفضل
    ضوء في الصباح أو عند الغروب؛ أما الظهيرة فتصور فيها باتجاه الشمس وتخرج الصورة باهتة. ودورات المياه
    والمقاهي في الأسفل عند ميدان غورغاسالي. وفي الشتاء تشتد الريح على الصخرة.
  route: >-
    أنت على الضفة اليسرى: من وسط المدينة اعبر جسر باراتاشفيلي أو جسر ميتيخي واصعد منحدر ميتيخي. وأمام
    الكنيسة ساحة صغيرة تتسع لبضع سيارات، لكنها ممتلئة دائماً تقريباً وتقف فيها حافلات السياحة أيضاً. والأوثق
    هو الموقف السفلي في حديقة ريكه، ومنه عشر دقائق صعوداً سيراً، أو الأماكن المخططة نحو شارع غولوا وأفلابري.
    ومن محطة مترو أفلابري أيضاً عشر دقائق مشياً. وسيارة اقتصادية تكفي.
