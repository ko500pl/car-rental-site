ka:
  name: მეტეხის ღვთისმშობლის ეკლესია
  short: >-
    მტკვრის თავზე, კლდეზე აღმართული XIII საუკუნის ეკლესია, რომელმაც ციტადელს, ციხეს, ბერიასა და თეატრს
    გაუძლო, — ფეხქვეშ კი ძველი თბილისი გაქვთ.
  body: >-
    **„მეტეხი“ „სასახლის ირგვლივ მდებარე ადგილს“ ნიშნავს: მტკვრის თავზე აღმართულ ამ კლდეზე ოდესღაც თბილისის
    მეფეები ცხოვრობდნენ.** გადმოცემა V საუკუნეში აქ ეკლესიისა და ციხის აშენებას ვახტანგ გორგასალს მიაწერს
    და ამბობს, რომ აქვე დაკრძალეს წმინდა შუშანიკი — ქართული მწერლობის უძველესი შემორჩენილი თხზულების გმირი.
    ამათგან არაფერმა გადაურჩა 1235 წლის მონღოლთა შემოსევას. დღევანდელი ეკლესია დემეტრე II-მ დაახლოებით
    1278–1284 წლებში ააგო: აგური და თლილი ქვა, კლდის პირისკენ გაწეული სამი აფსიდი, ოთხ თავისუფლად მდგარ
    ბურჯზე დაყრდნობილი გუმბათი.


    მისი შემდგომი ბედი ქალაქის ბატონთა ჩამონათვალს ჰგავს. XVII საუკუნეში როსტომ მეფემ ეკლესია ციტადელით
    შემოზღუდა და იქ ირანელი მეომრები ჩააყენა. რუსული მმართველობის დროს ტაძარი ყაზარმად აქციეს, 1819 წელს
    კი ციტადელის ადგილას ციხე ააშენეს, რომელმაც ავი სახელი 1938 წელს დახურვამდე შეინარჩუნა; 1903 წელს
    აქ, საკნაში, ახალგაზრდა რევოლუციონერი ლადო კეცხოველი ესროლეს და მოკლეს. დიდი ტერორის წლებში ლავრენტი
    ბერიას ეკლესიის დანგრევა სურდა. პროტესტს მხატვარი დიმიტრი შევარდნაძე ჩაუდგა სათავეში და ეს სიცოცხლის
    ფასად დაუჯდა, შენობა კი გადარჩა. 1974 წელს შიდა ტიხრები მოხსნეს და შენობა ახალგაზრდულ თეატრს გადასცეს;
    ღვთისმსახურება მხოლოდ 1988 წელს დაბრუნდა — პატრიარქ ილია II-ის კამპანიისა და ზვიად გამსახურდიას შიმშილობის
    შემდეგ.


    ინტერიერი უბრალოა; აქ კლდის პირისთვის მოდიან. ტერასიდან ქვემოთ აბანოების გუმბათები ჩანს, მოპირდაპირე
    ქედზე ნარიყალა მიცოცავს, მდინარე კი მეტეხის ხიდის ქვეშ უხვევს. ეკლესიის გვერდით ბრინჯაოს ცხენზე ვახტანგ
    გორგასალი ზის — ელგუჯა ამაშუკელის 1960-იანი წლების ნამუშევარი — და დაჰყურებს ქალაქს, რომელიც, გადმოცემით,
    მან მას შემდეგ დააარსა, რაც მისი შევარდნის ნანადირევი ხოხობი ცხელ წყაროში ჩავარდა. მზის ჩასვლისას
    მოდით, როცა კლდე სპილენძისფრად იფერება და ძველ ქალაქში ფანჯრები ერთმანეთის მიყოლებით ინთება.
  tip: >-
    ნახევარი საათი საკმარისია. ეკლესიამდე რამდენიმე საფეხური ადის, ტერასა კი სწორია და სავარძელ-ეტლითაც
    მისაწვდომია. ეს მოქმედი ეკლესიაა: ქალები თავს იბურავენ და ქვედაბოლოს იცვამენ, მამაკაცები — გრძელ შარვალს;
    თავსაფრები კართან კიდია. კლდის თავზე მოაჯირი დაბალია — პატარა ბავშვებს ხელი მაგრად მოკიდეთ. საუკეთესო
    შუქი დილით და მზის ჩასვლისასაა; შუადღისას ხედი ბრტყელი და ბურუსიანია. ეკლესიასთან არც ტუალეტია და
    არც კაფე — ორივე ქვემოთ, ხიდის გაღმა, გორგასლის მოედანზეა. ზამთარში კლდეზე ქარი კბენს.
  route: >-
    მეტეხი მტკვრის მარცხენა ნაპირზეა, თავისუფლების მოედნიდან დაახლოებით 3 კილომეტრში — მანქანით 10–15
    წუთი. ჩადით გორგასლის მოედანზე, გადაკვეთეთ მეტეხის ხიდი და ეკლესიისკენ მოკლე აღმართს აუყევით. ეკლესიის
    წინ პატარა მოედანზე მხოლოდ რამდენიმე მანქანა ეტევა და მას ჩვეულებრივ ტურისტული ავტობუსები იკავებს.
    უფრო საიმედოა რიყის პარკის ფასიანი სადგომი, საიდანაც ათიოდე წუთის სავალია, ან ფასიანი ადგილები ავლაბრის
    მიმართულებით; ავლაბრის მეტროდანაც დაახლოებით ათი წუთია ფეხით. გზა ბოლომდე ასფალტია — ეკონომკლასის
    მანქანაც სავსებით საკმარისია.
en:
  name: Metekhi Church
  short: >-
    A thirteenth-century church on a cliff over the Mtkvari that survived a citadel, a prison, Beria and
    a theatre — with old Tbilisi spread out below.
  body: >-
    **Metekhi means "around the palace", and on this cliff above the Mtkvari the kings of Tbilisi once
    lived.** Tradition credits Vakhtang Gorgasali with a church and fort here in the fifth century, and
    says that St Shushanik, heroine of the oldest surviving work of Georgian literature, was laid to rest
    on the spot. Nothing of that outlived the Mongols in 1235. The church you see was raised by King Demetre
    II around 1278–84: brick and dressed stone, three apses pushing out towards the drop, a dome on four
    free-standing pillars.


    Its later life reads like a roll-call of the city's masters. In the seventeenth century King Rostom
    ringed it with a citadel held by Iranian soldiers. Under Russian rule the church became a barracks,
    and in 1819 the citadel gave way to a prison that kept its grim name until it closed in 1938; the
    young revolutionary Lado Ketskhoveli was shot in his cell here in 1903. During the Great Purges Lavrenti
    Beria wanted the church pulled down. The painter Dimitri Shevardnadze led the protest and paid for
    it with his life, but the building stood. In 1974 its interior was stripped for a youth theatre, and
    only in 1988, after a campaign led by Patriarch Ilia II and a hunger strike by Zviad Gamsakhurdia,
    did the liturgy return.


    The interior is plain; come for the edge. From the terrace the domes of the sulphur baths lie below,
    Narikala climbs the opposite ridge and the river swings beneath Metekhi bridge. Beside the church,
    Vakhtang Gorgasali sits his bronze horse, cast by Elguja Amashukeli in the 1960s, above the city he
    is said to have founded after his falcon's pheasant fell into a hot spring. Come at sunset, when the
    cliff turns copper and the old town lights up window by window.
  tip: >-
    Half an hour is enough. A few steps lead up to the church, but the terrace is flat and manageable
    with a wheelchair. This is a working church: women cover their hair and wear skirts, men long trousers,
    and scarves hang by the door. The parapet above the cliff is low — keep hold of small children. The
    light is kindest in the morning and at sunset; at midday the view is flat and hazy. There are no facilities
    at the church itself: toilets and cafés are down at Gorgasali Square, across the bridge. In winter
    the wind on the cliff bites.
  route: >-
    Metekhi stands on the left bank, about 3 km and ten to fifteen minutes' drive from Freedom Square.
    Come down to Gorgasali Square, cross Metekhi bridge and turn up the short ramp to the church. The
    little square in front holds only a handful of cars and is usually taken by tour coaches. More reliable
    is the paid car park at Rike Park, a ten-minute walk away, or the paid bays towards Avlabari; Avlabari
    metro is also about ten minutes on foot. The road is asphalt all the way, and an economy car is all
    you need.
ru:
  name: Церковь Метехи
  short: >-
    Храм XIII века на скале над Курой, переживший цитадель, тюрьму, Берию и театр, — а под ним раскинулся
    старый Тбилиси.
  body: >-
    **Метехи значит «вокруг дворца»: когда-то на этой скале над Курой жили тбилисские цари.** Предание
    приписывает Вахтангу Горгасали церковь и крепость, построенные здесь в V веке, и утверждает, что на
    этом месте похоронена святая Шушаник — героиня древнейшего из дошедших до нас памятников грузинской
    литературы. Ничто из этого не пережило монголов в 1235 году. Нынешний храм возвёл царь Деметре II
    около 1278–1284 годов: кирпич и тёсаный камень, три апсиды, выдвинутые к обрыву, купол на четырёх
    отдельно стоящих столбах.


    Дальнейшая его жизнь читается как перечень хозяев города. В XVII веке царь Ростом окружил церковь
    цитаделью с иранским гарнизоном. При российской власти храм стал казармой, а в 1819 году цитадель
    уступила место тюрьме, чьё мрачное имя жило до самого её закрытия в 1938-м; в 1903 году здесь, прямо
    в камере, застрелили молодого революционера Ладо Кецховели. В годы Большого террора Лаврентий Берия
    хотел снести церковь. Художник Димитрий Шеварднадзе возглавил протест и поплатился за него жизнью,
    но здание устояло. В 1974 году внутренние перегородки снесли и отдали здание молодёжному театру, и
    лишь в 1988-м, после кампании во главе с Патриархом Илией II и голодовки Звиада Гамсахурдии, сюда
    вернулась литургия.


    Интерьер скромен — приходить стоит ради края обрыва. С террасы видны внизу купола серных бань, Нарикала
    карабкается по противоположному гребню, а река делает петлю под Метехским мостом. Рядом с церковью
    сидит на бронзовом коне Вахтанг Горгасали, отлитый Элгуджей Амашукели в 1960-е, — над городом, который
    он, по преданию, основал, когда фазан, добытый его соколом, упал в горячий источник. Приходите на
    закате, когда скала становится медной, а старый город зажигается окно за окном.
  tip: >-
    Получаса хватит. К церкви ведут несколько ступеней, но сама терраса ровная, и на коляске по ней проехать
    можно. Храм действующий: женщины покрывают голову и надевают юбку, мужчины — длинные брюки; платки
    висят у входа. Парапет над обрывом низкий — маленьких детей держите за руку. Самый мягкий свет утром
    и на закате; в полдень вид плоский и подёрнут дымкой. У самой церкви никаких удобств нет: туалеты
    и кафе внизу, на площади Горгасали, по ту сторону моста. Зимой ветер на скале пробирает.
  route: >-
    Метехи стоит на левом берегу, примерно в 3 км и в десяти–пятнадцати минутах езды от площади Свободы.
    Спуститесь к площади Горгасали, переедьте Метехский мост и поднимитесь по короткому подъёму к церкви.
    Площадка перед ней вмещает всего несколько машин и обычно занята туристическими автобусами. Надёжнее
    платная парковка парка Рике в десяти минутах ходьбы или платные места в сторону Авлабари; от метро
    «Авлабари» тоже около десяти минут пешком. Дорога асфальтирована на всём пути, и машины эконом-класса
    вполне достаточно.
fa:
  name: کلیسای متخی
  short: >-
    کلیسایی از سدهٔ سیزدهم بر صخره‌ای بالای رود کورا که از ارگ، زندان، بریا و تئاتر جان به در برد — و
    تفلیس کهن زیر پایش گسترده است.
  body: >-
    **متخی یعنی «گرداگرد کاخ»، و روزگاری شاهان تفلیس بر همین صخرهٔ بالای رود کورا (متکواری) می‌زیستند.**
    روایت سنتی ساختن کلیسا و دژی را در این‌جا در سدهٔ پنجم به وختانگ گورگاسالی نسبت می‌دهد و می‌گوید شوشانیک
    مقدس، قهرمان کهن‌ترین اثر بازماندهٔ ادبیات گرجی، در همین نقطه به خاک سپرده شد. هیچ‌یک از این‌ها از
    هجوم مغولان در ۱۲۳۵ جان سالم به در نبرد. کلیسایی که امروز می‌بینید را شاه دمتره دوم حدود ۱۲۷۸ تا ۱۲۸۴
    برپا کرد: آجر و سنگ تراش‌خورده، سه محراب نیم‌دایره که به سوی پرتگاه پیش آمده‌اند، و گنبدی بر چهار
    ستون مستقل.


    زندگی بعدی‌اش به فهرستی از فرمانروایان شهر می‌ماند. در سدهٔ هفدهم شاه رستم گرداگردش ارگی ساخت که سربازان
    ایرانی در آن مستقر بودند. در دوران حکومت روسیه کلیسا به سربازخانه بدل شد و در ۱۸۱۹ ارگ جای خود را
    به زندانی داد که نام شومش تا بسته شدنش در ۱۹۳۸ بر سر زبان‌ها ماند؛ لادو کتسخوولی، انقلابی جوان، در
    ۱۹۰۳ در سلولش در همین‌جا با گلوله کشته شد. در سال‌های «پاکسازی بزرگ» لاورنتی بریا می‌خواست کلیسا را
    ویران کند. دیمیتری شواردنادزهٔ نقاش رهبری اعتراض را بر عهده گرفت و بهایش را با جان خود پرداخت، اما
    بنا بر پا ماند. در ۱۹۷۴ دیوارهای جداکنندهٔ درونش را برداشتند و بنا را به تئاتر جوانان سپردند و تنها
    در ۱۹۸۸، پس از کارزاری به رهبری پاتریارک ایلیای دوم و اعتصاب غذای زویاد گامساخوردیا، آیین نیایش به
    آن بازگشت.


    درون کلیسا ساده است؛ برای لبهٔ صخره بیایید. از مهتابی، گنبدهای حمام‌های گوگردی در پایین پیداست، ناریقلعه
    از یال روبه‌رو بالا می‌رود و رود زیر پل متخی پیچ می‌خورد. کنار کلیسا وختانگ گورگاسالی بر اسب مفرغی‌اش
    نشسته است، پیکره‌ای که الگوجا آماشوکلی در دههٔ ۱۹۶۰ ریخت، بر فراز شهری که به روایت افسانه آن را پس
    از افتادن قرقاولِ شکارِ شاهینش در چشمه‌ای آب‌گرم بنیاد نهاد. هنگام غروب بیایید، وقتی صخره مسی‌رنگ
    می‌شود و شهر کهن پنجره به پنجره روشن می‌شود.
  tip: >-
    نیم ساعت کافی است. چند پله تا کلیسا بالا می‌رود، اما مهتابی هموار است و با ویلچر هم می‌توان در آن
    حرکت کرد. این کلیسا فعال است: زنان موی سر را می‌پوشانند و دامن می‌پوشند، مردان شلوار بلند؛ روسری‌ها
    کنار در آویخته‌اند. دیوارهٔ کنار پرتگاه کوتاه است — دست کودکان خردسال را رها نکنید. نور صبح و غروب
    از همه دلپذیرتر است؛ نیمروز منظره تخت و مه‌آلود می‌شود. خود کلیسا هیچ امکاناتی ندارد: سرویس بهداشتی
    و کافه‌ها پایین، در میدان گورگاسالی و آن سوی پل‌اند. در زمستان باد روی صخره گزنده است.
  route: >-
    متخی در ساحل چپ رود است، حدود ۳ کیلومتر و ده تا پانزده دقیقه رانندگی از میدان آزادی. به میدان گورگاسالی
    پایین بیایید، از پل متخی بگذرید و از سربالایی کوتاه به سوی کلیسا بپیچید. میدانچهٔ جلوی کلیسا تنها
    چند خودرو جا دارد و معمولاً اتوبوس‌های گردشگری آن را پر کرده‌اند. مطمئن‌تر، پارکینگ پولی پارک ریکه
    در ده دقیقه پیاده‌روی است، یا جاهای پارک پولی به سمت اولابری؛ ایستگاه متروی اولابری هم حدود ده دقیقه
    پیاده فاصله دارد. تمام مسیر آسفالت است و خودروی کلاس اقتصادی کافی است.
he:
  name: כנסיית מטחי
  short: >-
    כנסייה מהמאה ה־13 על צוק מעל נהר המטקווארי, ששרדה מצודה, בית כלא, את בריה ותיאטרון – וטביליסי העתיקה
    פרושה למרגלותיה.
  body: >-
    **פירוש השם מטחי הוא "סביב הארמון", ועל הצוק הזה שמעל המטקווארי גרו פעם מלכי טביליסי.** המסורת מייחסת
    לווחטנג גורגסלי כנסייה ומבצר שהקים כאן במאה החמישית, ומספרת שבמקום הזה נקברה הקדושה שושניק, גיבורת
    היצירה העתיקה ביותר שנשתמרה בספרות הגאורגית. דבר מכל אלה לא שרד את המונגולים ב־1235. את הכנסייה שאתם
    רואים הקים המלך דמטרה השני בערך בשנים 1278–1284: לבנים ואבן מסותתת, שלושה אפסיסים הבולטים לעבר התהום,
    וכיפה הנשענת על ארבעה עמודים חופשיים.


    חייה המאוחרים יותר נקראים כמו רשימת שליטי העיר. במאה ה־17 הקיף אותה המלך רוסטום במצודה שבה ישבו חיילים
    איראנים. תחת השלטון הרוסי הפכה הכנסייה לקסרקטין, וב־1819 פינתה המצודה את מקומה לבית כלא ששמו המאיים
    דבק בו עד שנסגר ב־1938; המהפכן הצעיר לאדו קצחובלי נורה כאן בתאו ב־1903. בימי הטיהורים הגדולים ביקש
    לברנטי בריה להרוס את הכנסייה. הצייר דימיטרי שוורדנאדזה עמד בראש המחאה ושילם עליה בחייו, אבל המבנה
    נותר על עומדו. ב־1974 הוסרו מחיצות הפנים והמבנה נמסר לתיאטרון נוער, ורק ב־1988, אחרי מאבק בהובלת הפטריארך
    איליה השני ושביתת רעב של זביאד גמסחורדיה, חזרה אליו התפילה.


    הפנים צנוע; באים לכאן בשביל שפת הצוק. מן המרפסת נשקפות למטה כיפות מרחצאות הגופרית, נריקלה מטפסת על
    הרכס שממול, והנהר מתפתל מתחת לגשר מטחי. לצד הכנסייה רוכב וחטנג גורגסלי על סוס הברונזה שלו, פסל שיצק
    אלגוג'ה אמשוקלי בשנות ה־60, מעל העיר שעל פי המסורת ייסד אחרי שפסיון שצד הבז שלו נפל לתוך מעיין חם.
    בואו בשקיעה, כשהצוק מקבל גוון נחושת והעיר העתיקה נדלקת חלון אחר חלון.
  tip: >-
    חצי שעה מספיקה. כמה מדרגות עולות אל הכנסייה, אבל המרפסת מישורית ונגישה גם בכיסא גלגלים. זו כנסייה
    פעילה: נשים מכסות את השיער ולובשות חצאית, גברים מכנסיים ארוכים, וליד הדלת תלויות מטפחות. המעקה מעל
    הצוק נמוך – החזיקו ילדים קטנים ביד. האור הנעים ביותר הוא בבוקר ובשקיעה; בצהריים הנוף שטוח ואפוף אובך.
    ליד הכנסייה עצמה אין שירותים: שירותים ובתי קפה יש למטה בכיכר גורגסלי, מעבר לגשר. בחורף הרוח על הצוק
    חודרת לעצמות.
  route: >-
    מטחי ניצבת על הגדה השמאלית, כ־3 ק"מ ועשר עד חמש עשרה דקות נסיעה מכיכר החירות. רדו לכיכר גורגסלי, חצו
    את גשר מטחי ופנו במעלה הרמפה הקצרה אל הכנסייה. הרחבה הקטנה שלפניה מכילה מכוניות ספורות בלבד, ובדרך
    כלל אוטובוסי תיירים תופסים אותה. בטוח יותר החניון בתשלום בפארק ריקה, עשר דקות הליכה משם, או מקומות
    החנייה בתשלום בכיוון אבלברי; גם מתחנת המטרו אבלברי ההליכה נמשכת כעשר דקות. הכביש סלול לכל אורכו, ורכב
    בקטגוריית אקונומי מספיק בהחלט.
ar:
  name: كنيسة ميتيخي
  short: >-
    كنيسة من القرن الثالث عشر على جرف فوق نهر كورا، نجت من القلعة والسجن وبيريا والمسرح، وتبليسي القديمة
    ممتدة تحتها.
  body: >-
    **تعني «ميتيخي» «حول القصر»، وعلى هذا الجرف المطلّ على نهر متكفاري (كورا) عاش ملوك تبليسي ذات يوم.**
    تنسب الرواية المتوارثة إلى فاختانغ غورغاسالي كنيسةً وحصنًا أقامهما هنا في القرن الخامس، وتقول إن القديسة
    شوشانيك، بطلة أقدم عمل باقٍ في الأدب الجورجي، دُفنت في هذا الموضع. لم يصمد شيء من ذلك أمام المغول
    عام 1235. أما الكنيسة القائمة اليوم فقد شيّدها الملك ديمتري الثاني نحو 1278–1284: آجرّ وحجر منحوت،
    وثلاث حنايا بارزة نحو الهاوية، وقبة ترتكز على أربع دعائم قائمة بذاتها.


    وتبدو حياتها اللاحقة أشبه بسجلّ لأسياد المدينة المتعاقبين. ففي القرن السابع عشر أحاطها الملك رستم
    بقلعة رابط فيها جنود إيرانيون. وفي ظل الحكم الروسي صارت الكنيسة ثكنة، وفي عام 1819 حلّ محلّ القلعة
    سجنٌ ظلّ اسمه القاتم عالقًا به حتى إغلاقه عام 1938؛ وفيه قُتل الثوري الشاب لادو كيتسخوفيلي رميًا بالرصاص
    في زنزانته عام 1903. وفي سنوات «التطهير الكبير» أراد لافرنتي بيريا هدم الكنيسة، فتصدّر الرسام ديميتري
    شيفاردنادزه الاحتجاج ودفع حياته ثمنًا لذلك، لكن المبنى بقي قائمًا. وفي عام 1974 أُزيلت حواجزه الداخلية
    وسُلِّم إلى مسرح للشباب، ولم تعد إليه الصلاة إلا عام 1988، بعد حملة قادها البطريرك إيليا الثاني وإضراب
    عن الطعام خاضه زفياد غامساخورديا.


    الداخل بسيط؛ فتعالَ من أجل حافة الجرف. من الشرفة تبدو في الأسفل قباب الحمّامات الكبريتية، وتتسلق ناريكالا
    التلّ المقابل، ويلتفّ النهر تحت جسر ميتيخي. وإلى جوار الكنيسة يجلس فاختانغ غورغاسالي على حصانه البرونزي،
    وهو تمثال صبّه إلغوجا أماشوكيلي في ستينيات القرن العشرين، مشرفًا على المدينة التي يُروى أنه أسسها
    بعدما سقط تَدْرُجٌ اصطاده صقره في نبع حار. تعالَ عند الغروب، حين يكتسي الجرف لون النحاس وتضيء المدينة
    القديمة نافذةً بعد نافذة.
  tip: >-
    تكفي نصف ساعة. تصعد بضع درجات إلى الكنيسة، لكن الشرفة مستوية ويمكن التنقل فيها بكرسي متحرك. هذه كنيسة
    تُقام فيها الصلوات: تغطي النساء شعورهن ويرتدين تنانير، ويرتدي الرجال سراويل طويلة، وتُعلَّق الأوشحة
    عند الباب. الحاجز فوق الجرف منخفض، فأمسك بأيدي الأطفال الصغار. أجمل الضوء في الصباح وعند الغروب؛ أما
    عند الظهيرة فيبدو المشهد باهتًا يلفّه الضباب. لا مرافق عند الكنيسة نفسها: دورات المياه والمقاهي في
    الأسفل عند ساحة غورغاسالي، على الجانب الآخر من الجسر. وفي الشتاء تلسع الريح على الجرف.
  route: >-
    تقع ميتيخي على الضفة اليسرى، على بعد نحو 3 كم ومسافة عشر إلى خمس عشرة دقيقة بالسيارة من ساحة الحرية.
    انزل إلى ساحة غورغاسالي، واعبر جسر ميتيخي، ثم اصعد المنحدر القصير إلى الكنيسة. لا تتسع الساحة الصغيرة
    أمامها إلا لبضع سيارات، وغالبًا ما تشغلها حافلات السياح. والأضمن موقف السيارات المدفوع في حديقة ريكه،
    على بعد عشر دقائق سيرًا، أو المواقف المدفوعة باتجاه أفلاباري؛ كما تبعد محطة مترو أفلاباري نحو عشر
    دقائق سيرًا. الطريق معبّد بالكامل، وتكفيك سيارة من الفئة الاقتصادية.
