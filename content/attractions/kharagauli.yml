ka:
  name: ხარაგაული
  short: >-
    ბორჯომ-ხარაგაულის ეროვნული პარკის დასავლეთი კარიბჭე ჩხერიმელას ხეობაში — ვიზიტორთა ცენტრი, ტყიანი
    ხეობები და სარკინიგზო ისტორია.
  body: >-
    **ხარაგაული ის ადგილია, სადაც იმერეთი პარკის ბილიკებად იშლება.** პატარა დაბა ჩხერიმელას ვიწრო, ტყიან
    ხეობაში დევს და სახელით ევროპის ერთ-ერთ უდიდეს ეროვნულ პარკს — ბორჯომ-ხარაგაულს — უნაწილდება. დასახლება
    1870-იან წლებში, ფოთი-თბილისის რკინიგზის მშენებლობისას, სადგურად დაიბადა და მატარებელი დღემდე მისი
    ცხოვრების ღერძია.


    მთავარი მიზეზი ჩამოსვლისა პარკია: 1995 წელს დაარსებული და 2001 წელს გახსნილი ბორჯომ-ხარაგაული 85 000
    ჰექტარზე მეტს ფარავს — საქართველოს ტერიტორიის დაახლოებით ერთ პროცენტს. ხარაგაული მისი დასავლეთი კარიბჭეა.


    რას იძლევა დაბა:


    - **პარკის ვიზიტორთა ცენტრი** — რეგისტრაცია, უფასო რუკები და თავშესაფრების დაჯავშნა

    - **ბილიკები მარელისისა და ნუნისის მხრიდან** — წიფლნარი ტყეები, მდელოები, ველური ბუნება

    - **ხანდის ციხის ნანგრევები** მახლობლად — გადმოცემით, აქ ვახტანგ VI-ის ქორწილი გადაუხდიათ


    შემოდგომაზე ხეობა სპილენძისფრად იწვის, გაზაფხულზე კი ჩხერიმელა ადიდებულია და ტყე ხასხასაა — ორივე
    სეზონი ლაშქრობის დასაწყებად იდეალურია.
  tip: >-
    პარკში გასვლამდე ვიზიტორთა ცენტრში დარეგისტრირდი — ბილიკებზე ღამისთევა (ტურისტული თავშესაფრები, კარვის
    ადგილები) წინასწარ იჯავშნება, პიკის თვეებში რამდენიმე დღით ადრე. ცენტრი სამუშაო საათებში მუშაობს,
    ამიტომ დილით მიდი. დაბაში რამდენიმე საოჯახო სასტუმრო, პატარა მაღაზიები და ბანკომატია; სერიოზული აღჭურვილობა
    თბილისიდან წამოიღე. ზაფხულის თაკარა სიცხე აქ იშვიათია — ხეობა გრილა.
  route: >-
    თბილისიდან E60 (S1) მაგისტრალით დასავლეთისკენ რიკოთის გვირაბის გავლით, შემდეგ ძირულას ხეობაში ხარაგაულის
    მაჩვენებელთან ჩახვიდე მარჯვნივ — ბოლო 15-ოდე კილომეტრი ვიწრო, მაგრამ ასფალტიანი გზაა ჩხერიმელას გაყოლებით.
    სულ დაახლოებით 165 კმ, სამ საათამდე. საწვავი ხაშურში ან ზესტაფონის მისადგომებთან აიღე — თავად ხეობაში
    არჩევანი მწირია. დაბამდე ეკონომ-კლასის ავტომობილი საკმარისია; პარკის შიდა გზებზე (მაგ. ნუნისისკენ)
    მაღალი კლირენსი აჯობებს.
en:
  name: Kharagauli
  short: >-
    The western gateway town of Borjomi-Kharagauli National Park in the Chkherimela valley — visitor centre,
    forest valleys and railway history.
  body: >-
    **Kharagauli is where Imereti dissolves into national park trails.** The small town lies in the narrow,
    forested valley of the Chkherimela river and shares its name with one of Europe's largest national
    parks — Borjomi-Kharagauli. The settlement was born in the 1870s as a station on the Poti-Tbilisi
    railway, and the train remains the axis of local life.


    The park is the reason to come: established in 1995 and opened to visitors in 2001, Borjomi-Kharagauli
    covers more than 85,000 hectares — roughly one percent of Georgia's entire territory. Kharagauli is
    its western gateway.


    What the town gives you:


    - **The park visitor centre** — registration, free maps and booking for the mountain shelters

    - **Trailheads on the Marelisi and Nunisi side** — beech forests, high meadows and genuinely wild
    country

    - **The ruins of Khandi fortress** nearby — by tradition the wedding site of King Vakhtang VI


    In autumn the valley burns copper; in spring the Chkherimela runs full and the forest glows green.
    Both seasons are ideal for setting off on the trails.
  tip: >-
    Register at the visitor centre before entering the park — overnight stops on the trails (tourist shelters,
    camping spots) are booked in advance, several days ahead in peak months. The centre keeps office hours,
    so arrive in the morning. The town has a few family guesthouses, small shops and an ATM; bring any
    serious gear from Tbilisi. Summer heat rarely bites here — the valley stays pleasantly cool.
  route: >-
    From Tbilisi take the E60 (S1) west through the Rikoti tunnel, then in the Dzirula valley turn off
    right at the Kharagauli sign — the last 15-odd kilometres are a narrow but asphalted road along the
    Chkherimela. About 165 km in total, up to three hours. Refuel in Khashuri or near Zestafoni — choices
    inside the valley are thin. An economy car is fine as far as the town; on the park's inner roads (towards
    Nunisi, for example) higher clearance is the wiser choice.
ru:
  name: Харагаули
  short: >-
    Западные ворота национального парка Боржоми-Харагаули в долине Чхеримелы — визит-центр, лесистые ущелья
    и железнодорожная история.
  body: >-
    **Харагаули — то место, где Имеретия растворяется в тропах национального парка.** Посёлок лежит в
    узкой лесистой долине реки Чхеримела и делит имя с одним из крупнейших национальных парков Европы
    — Боржоми-Харагаули. Поселение родилось в 1870-х как станция на железной дороге Поти-Тбилиси, и поезд
    до сих пор остаётся осью здешней жизни.


    Парк — главная причина приехать: основанный в 1995 году и открытый для посетителей в 2001-м, Боржоми-Харагаули
    покрывает более 85 000 гектаров — примерно один процент всей территории Грузии. Харагаули — его западные
    ворота.


    Что даёт посёлок:


    - **Визит-центр парка** — регистрация, бесплатные карты и бронирование горных приютов

    - **Начала троп со стороны Марелиси и Нуниси** — буковые леса, высокие луга и по-настоящему дикие
    места

    - **Руины крепости Ханди** поблизости — по преданию, здесь играли свадьбу царя Вахтанга VI


    Осенью долина полыхает медью, весной Чхеримела идёт полной водой, а лес наливается зеленью — оба сезона
    идеальны для старта на маршруты.
  tip: >-
    Перед выходом в парк зарегистрируйтесь в визит-центре — ночёвки на тропах (туристические приюты, места
    под палатки) бронируются заранее, в пиковые месяцы за несколько дней. Центр работает в присутственные
    часы, так что приезжайте утром. В посёлке несколько семейных гостевых домов, маленькие магазины и
    банкомат; серьёзное снаряжение везите из Тбилиси. Летняя жара сюда почти не добирается — в долине
    приятно прохладно.
  route: >-
    Из Тбилиси по трассе E60 (S1) на запад через Рикотский тоннель, затем в долине Дзирулы поворот направо
    по указателю на Харагаули — последние километров пятнадцать идут узкой, но асфальтированной дорогой
    вдоль Чхеримелы. Всего около 165 км, до трёх часов. Заправляйтесь в Хашури или у Зестафони — в самой
    долине выбор скудный. До посёлка достаточно машины эконом-класса; на внутренних дорогах парка (например,
    к Нуниси) разумнее высокий клиренс.
fa:
  name: خاراگائولی
  short: دروازهٔ غربی پارک ملی بورجومی-خاراگائولی در درهٔ چخریملا — مرکز بازدیدکنندگان، دره‌های جنگلی
    و تاریخ راه‌آهن.
  body: >-
    **خاراگائولی جایی است که ایمرتی در مسیرهای پارک ملی حل می‌شود.** این شهرک کوچک در درهٔ باریک و جنگلی
    رود چخریملا خفته و نامش را با یکی از بزرگ‌ترین پارک‌های ملی اروپا — بورجومی-خاراگائولی — قسمت می‌کند.
    آبادی در دههٔ 1870، هنگام ساخت راه‌آهن پوتی-تفلیس، به‌صورت یک ایستگاه زاده شد و قطار هنوز محور زندگی
    اینجاست.


    دلیل آمدن، خود پارک است: بورجومی-خاراگائولی که در 1995 بنیان گرفت و در 2001 به روی بازدیدکنندگان گشوده
    شد، بیش از 85 هزار هکتار را می‌پوشاند — تقریباً یک درصد کل خاک گرجستان. خاراگائولی دروازهٔ غربی آن
    است.


    شهرک چه می‌دهد:


    - **مرکز بازدیدکنندگان پارک** — ثبت‌نام، نقشهٔ رایگان و رزرو پناهگاه‌های کوهستانی

    - **آغاز مسیرها از سمت مارلیسی و نونیسی** — جنگل‌های راش، مرغزارهای بلند و طبیعتی به‌راستی وحشی

    - **ویرانه‌های قلعهٔ خاندی** در نزدیکی — به روایت‌ها، جشن عروسی شاه واختانگ ششم اینجا برپا شده است


    پاییز دره به رنگ مس می‌سوزد و بهار چخریملا پرآب و جنگل سبزِ درخشان است — هر دو فصل برای آغاز کوه‌پیمایی
    ایده‌آل‌اند.
  tip: >-
    پیش از ورود به پارک در مرکز بازدیدکنندگان ثبت‌نام کنید — شب‌مانی در مسیرها (پناهگاه‌ها و جای چادر)
    از پیش رزرو می‌شود، در ماه‌های شلوغ چند روز جلوتر. مرکز ساعت اداری دارد، پس صبح برسید. در شهرک چند
    مهمان‌خانهٔ خانوادگی، مغازه‌های کوچک و عابربانک هست؛ تجهیزات جدی را از تفلیس بیاورید. گرمای تند تابستان
    اینجا کم‌یاب است — درهٔ خنکی است.
  route: >-
    از تفلیس با آزادراه E60 (S1) به غرب و از تونل ریکوتی بگذرید، سپس در درهٔ دزیرولا با تابلوی خاراگائولی
    به راست بپیچید — پانزده کیلومتر آخر جاده‌ای باریک اما آسفالت در امتداد چخریملاست. روی‌هم حدود 165
    کیلومتر، تا سه ساعت. در خاشوری یا حوالی زستافونی سوخت بزنید — در خود دره انتخاب اندک است. تا شهرک
    خودروی اقتصادی کافی است؛ در راه‌های داخلی پارک (مثلاً به نونیسی) شاسی‌بلند عاقلانه‌تر است.
he:
  name: חראגאולי
  short: עיירת השער המערבי של הפארק הלאומי בורג'ומי-חראגאולי בעמק הצ'חרימלה — מרכז מבקרים, עמקי יער והיסטוריה
    של רכבות.
  body: >-
    **חראגאולי היא המקום שבו אימרתי נמסה אל שבילי הפארק הלאומי.** העיירה הקטנה שוכנת בעמק הצר והמיוער
    של נהר צ'חרימלה, וחולקת את שמה עם אחד הפארקים הלאומיים הגדולים באירופה — בורג'ומי-חראגאולי. היישוב
    נולד בשנות ה-1870 כתחנה על מסילת פוטי-טביליסי, והרכבת נותרה ציר החיים המקומי עד היום.


    הפארק הוא הסיבה לבוא: בורג'ומי-חראגאולי, שהוקם ב-1995 ונפתח למבקרים ב-2001, משתרע על יותר מ-85,000
    הקטרים — בערך אחוז אחד משטחה של גאורגיה כולה. חראגאולי היא השער המערבי שלו.


    מה נותנת העיירה:


    - **מרכז המבקרים של הפארק** — רישום, מפות חינם והזמנת מקלטי ההרים

    - **ראשי מסלולים מצד מארליסי ונוניסי** — יערות אשור, כרי דשא גבוהים וטבע פראי באמת

    - **חורבות מבצר חאנדי** בקרבת מקום — לפי המסורת, כאן נחגגה חתונתו של המלך וכטנג השישי


    בסתיו העמק בוער בגוני נחושת; באביב הצ'חרימלה זורמת מלאה והיער ירוק זוהר — שתי העונות מושלמות ליציאה
    למסלולים.
  tip: >-
    לפני הכניסה לפארק הירשמו במרכז המבקרים — לינות על המסלולים (מקלטי מטיילים, חניוני קמפינג) מוזמנות
    מראש, בחודשי השיא כמה ימים קדימה. המרכז עובד בשעות משרד, אז הגיעו בבוקר. בעיירה כמה בתי הארחה משפחתיים,
    חנויות קטנות וכספומט; ציוד רציני הביאו מטביליסי. חום הקיץ כמעט לא מגיע לכאן — בעמק נעים וקריר.
  route: >-
    מטביליסי בכביש E60 (S1) מערבה דרך מנהרת ריקוטי, ואז בעמק הדזירולה פנייה ימינה בשלט לחראגאולי — כ-15
    הק״מ האחרונים הם דרך צרה אך סלולה לאורך הצ'חרימלה. בסך הכול כ-165 ק״מ, עד שלוש שעות. תדלקו בחשורי
    או ליד זסטפוני — בתוך העמק הבחירה דלה. עד העיירה מספיק רכב חסכוני; בדרכים הפנימיות של הפארק (למשל
    לנוניסי) עדיף רכב גבוה.
ar:
  name: خاراغاولي
  short: >-
    بلدة البوابة الغربية لمنتزه بورجومي-خاراغاولي الوطني في وادي تشخيريميلا — مركز زوار وأودية غابات وتاريخ
    سكك حديد.
  body: >-
    **خاراغاولي هي حيث تذوب إيميريتي في دروب المنتزه الوطني.** تقع البلدة الصغيرة في وادي نهر تشخيريميلا
    الضيق المكسو بالغابات، وتتقاسم اسمها مع أحد أكبر المنتزهات الوطنية في أوروبا — بورجومي-خاراغاولي.
    وُلدت المستوطنة في سبعينيات القرن التاسع عشر محطةً على سكة بوتي-تبليسي، وما زال القطار محور الحياة
    هنا.


    المنتزه هو سبب المجيء: تأسس بورجومي-خاراغاولي عام 1995 وفُتح للزوار عام 2001، ويغطي أكثر من 85 ألف
    هكتار — نحو واحد في المئة من أراضي جورجيا كلها. وخاراغاولي بوابته الغربية.


    ما تقدمه البلدة:


    - **مركز زوار المنتزه** — التسجيل وخرائط مجانية وحجز مآوي الجبل

    - **بدايات الدروب من جهة ماريليسي ونونيسي** — غابات زان ومروج عالية وبرّية حقيقية

    - **أطلال قلعة خاندي** القريبة — تقول الرواية إن زفاف الملك فاختانغ السادس أقيم هنا


    في الخريف يشتعل الوادي نحاساً، وفي الربيع يجري تشخيريميلا ممتلئاً وتتوهج الغابة خضرة — كلا الموسمين
    مثالي لبدء المسير.
  tip: >-
    سجّل في مركز الزوار قبل دخول المنتزه — المبيت على الدروب (مآوي السياح ومواقع الخيام) يُحجز مسبقاً،
    وقبل عدة أيام في أشهر الذروة. يعمل المركز بدوام رسمي فتعال صباحاً. في البلدة بيوت ضيافة عائلية ومتاجر
    صغيرة وصراف آلي؛ أحضر المعدات الجادة من تبليسي. حرّ الصيف نادراً ما يصل إلى هنا — فالوادي لطيف البرودة.
  route: >-
    من تبليسي عبر طريق E60 (S1) غرباً وعبر نفق ريكوتي، ثم في وادي دزيرولا انعطف يميناً عند لافتة خاراغاولي
    — آخر نحو خمسة عشر كيلومتراً طريق ضيق لكنه معبّد بمحاذاة تشخيريميلا. المجموع نحو 165 كم في ما يصل
    إلى ثلاث ساعات. تزود بالوقود في خاشوري أو قرب زيستافوني — فالخيارات داخل الوادي شحيحة. حتى البلدة
    تكفي سيارة اقتصادية؛ وعلى طرق المنتزه الداخلية (نحو نونيسي مثلاً) الأحكم سيارة مرتفعة القاعدة.
