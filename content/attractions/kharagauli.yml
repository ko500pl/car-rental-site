ka:
  name: ხარაგაული
  short: >-
    სარკინიგზო დაბა ჩხერიმელას ღრმა ხეობაში და ბორჯომ-ხარაგაულის ეროვნული პარკის დასავლეთი კარიბჭე — წიფლნარი
    იქ იწყება, სადაც ბაქანი მთავრდება.
  body: >-
    **ხარაგაული ის ადგილია, სადაც მატარებლების განრიგი ტყეს ხვდება.** დაბა XIX საუკუნის 70-იან წლებში,
    ფოთი-თბილისის ახალი რკინიგზის სადგურად დაიბადა, ჩხერიმელას ვიწრო და ღრმა ხეობაში, ზღვის დონიდან 280–400
    მეტრზე, და თავის პირველ დანიშნულებას დღემდე ვერ გასცდა. აქ ორი ათასზე ნაკლები ადამიანი ცხოვრობს (2014
    წლის აღწერით — 1965), სახლები მდინარის ორივე ნაპირს აუყვება, რკინიგზა კი ისევ ყველაფრის შუაგულზე გადის.


    დაბის სახელი თავად დაბაზე გაცილებით შორს არის ცნობილი, რადგან მას ბორჯომ-ხარაგაულის ეროვნული პარკი
    ატარებს — 1995 წელს WWF-ისა და გერმანიის მთავრობის მხარდაჭერით შექმნილი და 2001 წელს სტუმრებისთვის
    გახსნილი. მიმდებარე ნაკრძალთან ერთად დაცული ტერიტორია 85 000 ჰექტარზე მეტს მოიცავს — საქართველოს დაახლოებით
    ერთ პროცენტს. ხარაგაული მისი დასავლეთი კარიბჭეა, მარელისისა და ნუნისის ბილიკების სათავეებამდე კი აქედან
    მანქანით სულ ცოტა ხნის სავალია.


    დაბა ისე გამოიყენეთ, როგორც თავად პარკი გთავაზობთ: ჯერ ვიზიტორთა ცენტრში შეიარეთ, დარეგისტრირდით,
    აიღეთ რუკა და ბილიკის თავშესაფარი დაჯავშნეთ; მერე მარელისის ან ნუნისის მხრიდან წიფლნარში შედით, სადაც
    ერთ საათში ნამდვილ ველურ ბუნებაში აღმოჩნდებით. დაბრუნებისას ხანდის ციხე მოძებნეთ — შუა საუკუნეების
    ნანგრევი, სადაც, გადმოცემით, ქართლის მეფე ვახტანგ VI-ის ქორწილი გადაიხადეს.


    ხეობას უფრო მშვიდი ხელობაც აქვს: აქ წყაროს წყლით ამზადებენ კონიაკებს „უბისასა“ და „ნუნისს“ — პატარა
    შეხსენება იმისა, რომ იმერეთი ღვინის მხარედ რჩება ხეობის სიღრმეშიც კი.


    ოქტომბერში ფერდობები ძველი სპილენძის ფერს იღებს, აპრილში კი ჩხერიმელა თოვლის ნადნობით ხმამაღლა მოედინება.
    ორივე შემთხვევაში ხარაგაულის საუკეთესო ხედი ტყის ბილიკიდან იშლება — როცა უკან, სახურავებსა და რკინიგზას
    დაჰყურებთ.
  tip: >-
    პარკში გასვლამდე ვიზიტორთა ცენტრში დარეგისტრირდით: ბილიკების თავშესაფრები და საკარვე ადგილები წინასწარ
    იჯავშნება, ზაფხულსა და ადრეულ შემოდგომაზე — რამდენიმე დღით ადრე. ცენტრი სამუშაო საათებში მუშაობს,
    ამიტომ დილით, შუადღემდე მიდით. დაბაში რამდენიმე საოჯახო სასტუმრო, პატარა მაღაზიები და ბანკომატია,
    მაგრამ სალაშქრო აღჭურვილობის მაღაზიას ნუ ელით — კარგი ფეხსაცმელი, საწვიმარი და შუბლის ფანარი თბილისიდან
    წამოიღეთ. ხეობის ფსკერზე ივლისის შუადღე შეიძლება ცხელი და შეხუთული იყოს; სიგრილე წიფლნარში ასვლისთანავე
    იწყება. ზაფხულში ტკიპებისგან თავის დასაცავად შარვალი წინდებში ჩაიტანეთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ რიკოთის გვირაბის გავლით იარეთ. ზესტაფონამდე მაგისტრალიდან
    ძველ გზაზე გადადით, რომელიც ძირულას ჩაუყვება შორაპნისკენ, იქიდან კი აღმოსავლეთით შ55 გზას დაადექით
    — ის ძირულასა და ჩხერიმელას აღმა ხარაგაულამდე მიგიყვანთ, მაგისტრალიდან დაახლოებით 20 კილომეტრში. სულ
    დაახლოებით 186 კილომეტრია, ორ საათსა და ორმოცდაათ წუთს უნდება. გზა ბოლომდე ასფალტიანია, მაგრამ ხეობაში
    ვიწროა, მოსახვევებითა და სოფლის მოძრაობით. საწვავი ხაშურში ან ზესტაფონში ჩაასხით. დაბამდე ეკონომ-კლასის
    ავტომობილიც საკმარისია; პარკის ტყის გზებზე, ნუნისისკენ და უფრო შორს, მაღალი კლირენსი აჯობებს.
en:
  name: Kharagauli
  short: >-
    A railway town in the deep Chkherimela gorge and the western doorstep of Borjomi-Kharagauli National
    Park — the beech forest begins where the platform ends.
  body: >-
    **Kharagauli is where the train timetable meets the forest.** The town was born in the 1870s as a
    station on the new Poti–Tbilisi railway, wedged into the narrow, deep gorge of the Chkherimela at
    280–400 metres, and it has never really outgrown that first purpose. Fewer than two thousand people
    live here (1,965 at the 2014 census), houses climb both banks of the river, and the line still runs
    through the middle of everything.


    The name travels much further than the town, because it is shared with Borjomi-Kharagauli National
    Park — created in 1995 with the support of WWF and the German government, and opened to visitors in
    2001. Together with its adjoining reserve the protected area covers more than 85,000 hectares, roughly
    one per cent of Georgia. Kharagauli is its western gateway, and the Marelisi and Nunisi trailheads
    are each a short drive away.


    Use the town the way the park intends. Call first at the visitor centre to register, pick up a map
    and book a trail shelter; then walk into the beech woods from the Marelisi or Nunisi side, where the
    country turns properly wild within an hour. On the way back, look for Khandi, the ruined medieval
    fortress where, tradition holds, King Vakhtang VI of Kartli was married.


    The valley has a quieter trade, too: local brandies named Ubisa and Nunisi are made here with spring
    water, a small reminder that Imereti never quite stops being wine country, even in a gorge.


    In October the slopes turn the colour of old copper; in April the Chkherimela runs loud with snowmelt.
    Either way, the best view of Kharagauli is the one from a forest trail, looking back down at the roofs
    and the railway.
  tip: >-
    Register at the visitor centre before you head into the park: trail shelters and campsites are booked
    in advance, several days ahead in summer and early autumn. The centre keeps office hours, so arrive
    by mid-morning. The town has a few family guesthouses, small shops and an ATM, but nothing like an
    outdoor store — bring proper boots, rain gear and a head torch from Tbilisi. Down in the gorge a July
    afternoon can be hot and sticky; the cool begins once you climb into the beech forest. In summer,
    tuck trousers into socks against ticks.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnel. Before Zestafoni, leave the motorway
    for the old road down the Dzirula towards Shorapani, then turn east onto the Sh55, which follows the
    Dzirula and Chkherimela upstream to Kharagauli — about 20 km from the motorway. Around 186 km in all;
    allow roughly two hours fifty. It is asphalt throughout, but the gorge road is narrow, with bends
    and village traffic. Fill up in Khashuri or Zestafoni. An economy car is fine for the town; on the
    park's forest tracks, towards Nunisi and beyond, higher clearance is the wiser choice.
ru:
  name: Харагаули
  short: >-
    Железнодорожный городок в ущелье Чхеримелы, западные ворота Боржоми-Харагаульского парка: буковый
    лес начинается там, где кончается перрон.
  body: >-
    **Харагаули — то место, где расписание поездов встречается с лесом.** Городок родился в 1870-х годах
    как станция новой железной дороги Поти — Тбилиси, зажатая в узком, глубоком ущелье Чхеримелы на высоте
    280–400 метров, и он, по сути, так и не перерос своего первого предназначения. Здесь живёт менее двух
    тысяч человек (1965 по переписи 2014 года), дома поднимаются по обоим берегам реки, а линия до сих
    пор проходит через самое сердце города.


    Имя это известно куда шире самого городка, потому что его носит и Боржоми-Харагаульский национальный
    парк — созданный в 1995 году при поддержке WWF и правительства Германии и открытый для посетителей
    в 2001-м. Вместе с прилегающим Боржомским заповедником охраняемая территория занимает более 85 000
    гектаров — около одного процента площади Грузии. Харагаули — его западные ворота, а до начала маршрутов
    у Марелиси и Нуниси отсюда совсем недалеко на машине.


    Пользуйтесь городком так, как задумано парком: сначала загляните в визит-центр, чтобы зарегистрироваться,
    взять карту и забронировать приют на маршруте, затем уходите в буковый лес со стороны Марелиси или
    Нуниси, где дикая природа начинается уже через час пути. На обратном пути найдите Ханди — руины средневековой
    крепости, где, по преданию, венчался царь Картли Вахтанг VI.


    У долины есть и более тихий промысел: здесь на ключевой воде делают местные бренди «Убиса» и «Нуниси»
    — небольшое напоминание о том, что Имерети никогда до конца не перестаёт быть винной страной, даже
    в глубине ущелья.


    В октябре склоны становятся цвета старой меди; в апреле Чхеримела шумит от талого снега. В любом случае
    лучший вид на Харагаули — с лесной тропы, глядя вниз на крыши и железную дорогу.
  tip: >-
    Зарегистрируйтесь в визит-центре, прежде чем идти в парк: приюты и стоянки на маршрутах бронируют
    заранее, летом и в начале осени — за несколько дней. Центр работает по офисному графику, так что приходите
    не позже середины утра. В городке есть несколько семейных гостевых домов, небольшие магазины и банкомат,
    но ничего похожего на магазин туристического снаряжения — привезите из Тбилиси хорошие ботинки, дождевик
    и налобный фонарь. В глубине ущелья июльский день может быть жарким и влажным; прохлада начинается,
    когда поднимаешься в буковый лес. Летом заправляйте штаны в носки — от клещей.
  route: >-
    Из Тбилиси возьмите трассу S1 (E60) на запад, через Рикотский тоннель. Не доезжая до Зестафони, сверните
    со скоростной дороги на старую дорогу вниз по Дзируле в сторону Шорапани, затем поверните на восток
    на Ш55, которая идёт вверх по Дзируле и Чхеримеле до Харагаули — около 20 км от трассы. Всего около
    186 км; закладывайте примерно два часа пятьдесят минут. Дорога асфальтирована на всём протяжении,
    но в ущелье она узкая, с поворотами и деревенским движением. Заправляйтесь в Хашури или Зестафони.
    Для самого городка достаточно автомобиля эконом-класса; на лесных дорогах парка, в сторону Нуниси
    и дальше, разумнее выбрать машину с большим клиренсом.
fa:
  name: خاراگائولی
  short: >-
    شهر راه‌آهنی در دره‌ی ژرف چخریملا و دروازه‌ی غربی پارک ملی بورجومی-خاراگائولی — جنگل راش از همان جایی
    آغاز می‌شود که سکوی ایستگاه پایان می‌یابد.
  body: >-
    **خاراگائولی جایی است که برنامه‌ی حرکت قطارها به جنگل می‌رسد.** این شهر در دهه‌ی ۱۸۷۰ به‌عنوان ایستگاهی
    بر خط راه‌آهن تازه‌ساز پوتی–تفلیس زاده شد، در دره‌ی تنگ و ژرف چخریملا، در ارتفاع ۲۸۰ تا ۴۰۰ متری،
    و هرگز واقعاً از آن هدف نخستین فراتر نرفته است. کمتر از دو هزار نفر در آن زندگی می‌کنند (۱٬۹۶۵ نفر
    بر پایه‌ی سرشماری ۲۰۱۴)، خانه‌ها بر هر دو کرانه‌ی رود بالا می‌روند، و خط آهن هنوز از میان همه‌چیز
    می‌گذرد.


    نام این شهر بسیار فراتر از خودش سفر می‌کند، زیرا با پارک ملی بورجومی-خاراگائولی هم‌نام است — پارکی
    که در سال ۱۹۹۵ با کمک صندوق جهانی حیات‌وحش (WWF) و دولت آلمان بنیاد شد و در سال ۲۰۰۱ به روی بازدیدکنندگان
    گشوده شد. این منطقه‌ی حفاظت‌شده، همراه با ذخیره‌گاه پیوسته‌ی خود، بیش از ۸۵٬۰۰۰ هکتار را در بر می‌گیرد،
    یعنی نزدیک به یک درصد از خاک گرجستان. خاراگائولی دروازه‌ی غربی آن است، و تا سرآغاز مسیرهای مارلیسی
    و نونیسی تنها راهی کوتاه با خودرو در پیش است.


    از شهر همان‌گونه بهره ببرید که خود پارک می‌خواهد: نخست به مرکز بازدیدکنندگان سر بزنید تا ثبت‌نام کنید،
    نقشه بگیرید و پناهگاهی در مسیر رزرو کنید؛ سپس از سوی مارلیسی یا نونیسی به جنگل‌های راش پا بگذارید،
    جایی که سرزمین در کمتر از یک ساعت به‌راستی وحشی می‌شود. در راه بازگشت، سراغ خاندی را بگیرید، دژ ویرانه‌ی
    سده‌های میانه که به‌روایتی وختانگ ششم، پادشاه کارتلی، در آن ازدواج کرد.


    این دره پیشه‌ای آرام‌تر نیز دارد: براندی‌های محلی به نام‌های اوبیسا و نونیسی در اینجا با آب چشمه ساخته
    می‌شوند — یادآوری کوچکی از این‌که ایمرتی هرگز به‌تمامی سرزمین شراب بودن را از دست نمی‌دهد، حتی در
    دل یک دره.


    در اکتبر، دامنه‌ها به رنگ مسِ کهنه درمی‌آیند؛ در آوریل، چخریملا از آب برف‌های ذوب‌شده پرخروش می‌شود.
    در هر حال، بهترین چشم‌انداز خاراگائولی همان است که از یک راه جنگلی، به پشت‌بام‌ها و راه‌آهن در پایین
    چشم می‌دوزد.
  tip: >-
    پیش از رفتن به داخل پارک، در مرکز بازدیدکنندگان ثبت‌نام کنید: پناهگاه‌ها و اردوگاه‌های مسیر پیشاپیش
    رزرو می‌شوند، در تابستان و اوایل پاییز چند روز پیش‌تر. مرکز ساعات کاری اداری دارد، پس تا اواسط صبح
    برسید. شهر چند مهمان‌پذیر خانگی، مغازه‌های کوچک و یک دستگاه خودپرداز دارد، اما چیزی شبیه فروشگاه لوازم
    کوهنوردی ندارد — پوتین مناسب، لباس ضدآب و چراغ پیشانی را از تفلیس همراه بیاورید. در ژرفای دره، بعدازظهری
    در ژوئیه می‌تواند گرم و شرجی باشد؛ خنکا از همان‌جا آغاز می‌شود که به جنگل راش بالا می‌روید. در تابستان،
    برای دوری از کنه‌ها، شلوار را داخل جوراب فرو کنید.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب و از میان تونل ریکوتی بگیرید. پیش از زستافونی، از بزرگراه به
    راه قدیمی پایین دره‌ی دزیرولا به سوی شوراپانی خارج شوید، سپس به سوی شرق بر روی Sh55 بپیچید که در امتداد
    دزیرولا و چخریملا رو به بالا تا خاراگائولی می‌رود — حدود ۲۰ کیلومتر از بزرگراه. در مجموع نزدیک به
    ۱۸۶ کیلومتر؛ نزدیک به دو ساعت و پنجاه دقیقه در نظر بگیرید. تمام راه آسفالت است، اما راه درون دره تنگ
    است، با پیچ‌ها و رفت‌وآمد روستایی. در خاشوری یا زستافونی سوخت‌گیری کنید. برای خود شهر یک خودروی اقتصادی
    کافی است؛ در مسیرهای جنگلی پارک، به سوی نونیسی و پس از آن، خودرویی با ارتفاع شاسی بیشتر (فاصله‌ی بیشتر
    از زمین) انتخابی عاقلانه‌تر است.
he:
  name: חרגאולי
  short: >-
    עיירת מסילת רכבת בקניון העמוק של הצ'חרימלה, והשער המערבי של הפארק הלאומי בורז'ומי-חרגאולי — יער האשור
    מתחיל היכן שהרציף מסתיים.
  body: >-
    **חרגאולי היא המקום שבו לוח הזמנים של הרכבת פוגש את היער.** העיירה נולדה בשנות ה-1870 כתחנה על מסילת
    הרכבת החדשה פוטי–טביליסי, דחוסה בקניון הצר והעמוק של הצ'חרימלה בגובה 280–400 מטר מעל פני הים, ומעולם
    לא ממש חרגה מייעודה הראשון. פחות מאלפיים תושבים חיים כאן (1,965 לפי מפקד 2014), הבתים מטפסים על שתי
    גדות הנהר, והמסילה עדיין חוצה את מרכז הכול.


    השם נודד הרבה מעבר לעיירה עצמה, כי הוא משותף לפארק הלאומי בורז'ומי-חרגאולי — שהוקם ב-1995 בתמיכת ה-WWF
    וממשלת גרמניה, ונפתח למבקרים ב-2001. יחד עם השמורה הצמודה לו, השטח המוגן משתרע על יותר מ-85,000 הקטרים,
    כאחוז אחד משטח גאורגיה. חרגאולי היא השער המערבי שלו, ונקודות היציאה לשבילים במרליסי ובנוניסי נמצאות
    כל אחת במרחק נסיעה קצרה.


    השתמשו בעיירה כפי שהפארק עצמו מציע: היכנסו תחילה למרכז המבקרים כדי להירשם, לקבל מפה ולהזמין מקלט לינה
    בשביל; אחר כך צאו ליער האשור מכיוון מרליסי או נוניסי, שם הנוף הופך פראי לגמרי בתוך שעה. בדרך חזרה
    חפשו את חנדי, מצודה הרוסה מימי הביניים, שבה, כפי שהמסורת מספרת, נישא וחטנג השישי, מלך קרטלי.


    לעמק יש גם עיסוק שקט יותר: ברנדי מקומי בשמות אוביסה ונוניסי מיוצר כאן ממי מעיין — תזכורת קטנה לכך
    שאימרתי אינה מפסיקה לגמרי להיות ארץ יין, אפילו בתוך קניון.


    באוקטובר המדרונות נצבעים בגוון של נחושת עתיקה; באפריל הצ'חרימלה שוצפת ורועשת ממי הפשרת השלגים. כך
    או כך, הנוף הטוב ביותר על חרגאולי הוא זה שמתגלה משביל יער, המשקיף אל הגגות ומסילת הרכבת שמתחתיו.
  tip: >-
    הירשמו במרכז המבקרים לפני שאתם נכנסים לפארק: את מקלטי השביל ואתרי הקמפינג יש להזמין מראש — בקיץ ובתחילת
    הסתיו כמה ימים קודם. המרכז פתוח בשעות העבודה, אז הגיעו עד אמצע הבוקר. בעיירה יש כמה אכסניות משפחתיות,
    חנויות קטנות וכספומט, אך שום דבר שמזכיר חנות ציוד חוצות — הביאו נעליים מתאימות, ביגוד גשם ופנס ראש
    מטביליסי. בתחתית הקניון אחר צהריים ביולי יכול להיות חם ולח; הקרירות מתחילה כשמתחילים לטפס ליער האשור.
    בקיץ, הכניסו את המכנסיים לתוך הגרביים כהגנה מקרציות.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה דרך מנהרת ריקותי. לפני זסטפוני, רדו מהכביש הראשי לדרך הישנה במורד
    הדזירולה לכיוון שוראפני, ואז פנו מזרחה לכביש Sh55, שעוקב אחר הדזירולה והצ'חרימלה במעלה הזרם עד חרגאולי
    — כ-20 ק"מ מהכביש הראשי. בסך הכול כ-186 ק"מ; הקדישו כשעתיים וחמישים דקות. הדרך אספלט לכל אורכה, אך
    דרך הקניון צרה, עם עיקולים ותנועה כפרית. תדלקו בחשורי או בזסטפוני. רכב אקונומי מספיק לעיירה עצמה;
    בדרכי היער של הפארק, לכיוון נוניסי והלאה, מרווח גחון גבוה יותר הוא הבחירה הנבונה.
ar:
  name: خاراغاولي
  short: >-
    بلدة سكة حديد في وادي تشخريميلا العميق، والعتبة الغربية لحديقة بورجومي-خاراغاولي الوطنية — تبدأ غابة
    الزان حيث ينتهي رصيف المحطة.
  body: >-
    **خاراغاولي هي المكان الذي يلتقي فيه جدول القطارات بالغابة.** وُلدت البلدة في السبعينيات من القرن
    التاسع عشر كمحطة على خط سكة حديد بوتي–تبليسي الجديد، محشورة في وادي تشخريميلا الضيق والعميق على ارتفاع
    280–400 متر، ولم تتجاوز حقًا ذلك الغرض الأول. يعيش فيها أقل من ألفي نسمة (1,965 نسمة حسب تعداد 2014)،
    وتتسلق البيوت ضفتي النهر، ولا يزال الخط يعبر وسط كل شيء.


    ويتجاوز صيت الاسم البلدة نفسها بكثير، لأنه مشترك مع حديقة بورجومي-خاراغاولي الوطنية — التي أُنشئت
    عام 1995 بدعم من الصندوق العالمي للطبيعة (WWF) والحكومة الألمانية، وفُتحت للزوار عام 2001. تمتد المنطقة
    المحمية، مع المحمية الملحقة بها، على أكثر من 85,000 هكتار، أي نحو واحد بالمئة من مساحة جورجيا. خاراغاولي
    هي بوابتها الغربية، ولا تبعد نقطتا انطلاق المسارات في مارليسي ونونيسي عنها سوى مسافة قصيرة بالسيارة.


    استخدم البلدة كما تريدها الحديقة نفسها: زُر أولًا مركز الزوار لتسجّل وتأخذ خريطة وتحجز ملجأً على أحد
    المسارات، ثم ادخل غابات الزان من جهة مارليسي أو نونيسي، حيث تصبح الطبيعة برّية حقًّا في غضون ساعة.
    وفي طريق العودة ابحث عن خاندي، القلعة المتهدمة من العصور الوسطى التي تقول التقاليد إن الملك واختانغ
    السادس، ملك كارتلي، تزوّج فيها.


    للوادي حرفة أهدأ أيضًا: تُصنع هنا أنواع من البراندي المحلي تحمل اسمي أوبيسا ونونيسي بمياه النبع —
    تذكير صغير بأن إيميريتي لا تكفّ تمامًا عن كونها بلاد نبيذ، حتى في قلب وادٍ.


    في أكتوبر تكتسي السفوح لون النحاس القديم؛ وفي أبريل يعلو صوت تشخريميلا بذوبان الثلوج. وفي الحالين،
    أجمل منظر لخاراغاولي هو ذلك الذي يُرى من مسار في الغابة، بالنظر إلى الأسقف وسكة الحديد في الأسفل.
  tip: >-
    سجّل في مركز الزوار قبل التوجه إلى داخل الحديقة: تُحجز ملاجئ المسارات والمخيمات مسبقًا، بعدة أيام
    في الصيف وأوائل الخريف. يعمل المركز في ساعات الدوام الرسمي، فاحضر قبل منتصف الصباح. تضم البلدة بعض
    النُّزل العائلية ومتاجر صغيرة وصرافًا آليًا، لكن لا يوجد فيها ما يشبه متجر معدّات التنزّه — احمل معك
    حذاء مناسبًا وملابس واقية من المطر وكشافًا للرأس من تبليسي. في قعر الوادي، يمكن أن يكون بعد ظهر يوليو
    حارًا ورطبًا؛ وتبدأ البرودة فور الصعود إلى غابة الزان. في الصيف، أدخل أطراف البنطال داخل الجوارب حماية
    من القُراد.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر نفق ريكوتي. قبل زيستافوني، اخرج من الطريق السريع إلى الطريق
    القديم النازل في وادي دزيرولا نحو شوراباني، ثم انعطف شرقًا إلى طريق Sh55 الذي يتبع دزيرولا وتشخريميلا
    صعودًا حتى خاراغاولي — نحو 20 كم من الطريق السريع. المسافة الإجمالية نحو 186 كم؛ خصص نحو ساعتين وخمسين
    دقيقة. الطريق معبّد بالكامل، لكن طريق الوادي ضيق، بمنحنيات وحركة قروية. تزوّد بالوقود في خاشوري أو
    زيستافوني. تكفي سيارة اقتصادية للبلدة نفسها؛ أما على مسارات الحديقة الغابية، نحو نونيسي وما بعدها،
    فالسيارة ذات الخلوص الأرضي الأعلى هي الخيار الأحكم.
