ka:
  name: ზოტი
  short: >-
    აჭარლების მიერ დასახლებული გურული მთის სოფელი ბახმაროს გზაზე, 1904 წლის მოხატული ხის მეჩეთით, რომელსაც
    მგზავრები იშვიათად ამჩნევენ.
  body: >-
    **ზოტის ხის მეჩეთში ცისფერ კედელზე ნარინჯისფერი და წითელი ყვავილების კონები ჰყვავის, ბახმაროსკენ მიმავალთა
    უმეტესობა კი გვერდს უვლის.**


    სოფელი მესხეთის ქედის ჩრდილოეთ კალთაზე, მდინარე გუბაზეულის მარჯვენა ნაპირს მიუყვება, ჩოხატაურიდან
    ხეობის აღმა ოცდახუთიოდე კილომეტრზე. ზამთარი აქ ექვს თვეს გრძელდება. მოსახლეობის უმეტესობა აჭარელია:
    იმ ოჯახების შთამომავლები, რომლებიც 1877–1878 წლების რუსეთ-ოსმალეთის ომის დროს ზემო აჭარიდან, ღორჯომის
    თემიდან გადმოსახლდნენ. 1969 წლისთვის ზოტში სამასამდე კომლი ცხოვრობდა.


    მეჩეთი 1904 წელს აშენდა. ორსართულიანი ხის ნაგებობაა, რომელსაც გუმბათისებრი მინარეთი ადგას, სინათლე
    კი ორ რიგად განლაგებული ფანჯრებიდან შემოდის. შიგნით სამი კედლის გასწვრივ ხის ქანდარა გასდევს, სამხრეთ
    კედელში მიჰრაბია, ერთ კუთხეში კათედრა დგას. ჩუქურთმა და ფრიზი მწვანით, ფირუზისფრითა და წითლით არის
    შეფერილი, კედლებზე კი ცისფერ ფონზე ნარინჯისფერი, წითელი, მწვანე და შავი მცენარეული ორნამენტი და ყვავილების
    კონები იშლება. გადმოცემით, ეს მოხატულობა ოსტატ ჭან ომერს ეკუთვნის.


    აქ შეჩერება ღირს:


    - გუბაზეულზე გადებული ძელის ხიდისთვის

    - შუა საუკუნეების ღომის ციხის ნაშთებისთვის ადგილას, სახელად „საყდრის ყელი“, სადაც აღმოსავლეთისა და
    დასავლეთის კედლების ფრაგმენტებია შემორჩენილი

    - სანისლიისთვის, თერმული მინერალური წყლის პატარა საკურორტო ადგილისთვის, სოფლიდან თხუთმეტიოდე კილომეტრში


    სოფელთან ახლოს 2200–2400 მეტრის სიმაღლის კიდობანას მთა აღმართულა, სადაც ზოტელები ზაფხულობით საქონელს
    იალაღზე ერეკებიან.


    მგზავრების უმეტესობისთვის ზოტი ბახმაროს დიდ აღმართამდე ბოლო გაჩერებაა. ჯერ მეჩეთში შედით და ეს გზა
    სხვა ამბად გადაიქცევა: იმ ხალხის ამბად, ვინც საუკუნენახევრის წინ მთა გადმოიარა და აქ დარჩა.
  tip: >-
    მეჩეთი სალოცავია და არა მუზეუმი. ჰკითხეთ მეზობლებს, ვისთან ინახება გასაღები, შესვლისას ფეხსაცმელი
    გაიხადეთ, მკლავები და ფეხები დაიფარეთ (ქალებმა თმაც), ლოცვის დროს კი ნუ მიხვალთ. მოხატულობა მხოლოდ
    ნებართვით გადაიღეთ. ზოტის მაღაზიები პატარაა, ამიტომ საჭმელი და საწვავი ჩოხატაურში შეიძინეთ. საუკეთესო
    დრო მაისიდან ოქტომბრამდეა: ზამთარი აქ ექვს თვეს გრძელდება, ბახმარომდე გზა კი, ფაქტობრივად, მხოლოდ
    ზაფხულის გზაა. ღომის ციხის ნანგრევებს მარტო ძნელად იპოვით, ამიტომ ადგილობრივებს „საყდრის ყელი“ ჰკითხეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე იარეთ, იქიდან ს12-ით ლანჩხუთისკენ,
    შემდეგ კი შ2-ით ჩოხატაურამდე. ეს დაახლოებით 275 კმ ასფალტია. ჩოხატაურში ბახმაროს გზაზე (შ81) გადადით
    და გუბაზეულს აღმა, 20–25 კილომეტრის განმავლობაში მიჰყევით ზოტამდე. სულ დაახლოებით 300 კმ გამოდის;
    გაჩერებების ჩათვლით ხუთი-ექვსი საათი გაითვალისწინეთ. ხეობის გზა ვიწროა, საფარი კი სეზონისა და ბოლო
    სარემონტო სამუშაოების მიხედვით იცვლება: დაკერებული ასფალტი, ხრეში, წვიმის შემდეგ ორმოები. ბოლო საიმედო
    ბენზინგასამართი ჩოხატაურშია. მაღალი კლირენსის ჯიპი აქ ნამდვილად გამოგადგებათ, ბახმარომდე გასაგრძელებლად
    კი ოთხწამყვანიანი მანქანა აიღეთ.
en:
  name: Zoti
  short: >-
    A Gurian mountain village of Adjarian settlers on the Bakhmaro road, with a painted wooden mosque
    of 1904 that few drivers ever step into.
  body: >-
    **In Zoti's wooden mosque, bunches of orange and red flowers bloom on a sky-blue wall, and almost
    everyone driving up to Bakhmaro passes them by.**


    The village climbs the right bank of the Gubazeuli on the northern flank of the Meskheti Range, some
    twenty-five kilometres up the valley from Chokhatauri. Winter here lasts about six months. Most of
    its people are Adjarians, descendants of families who came over from the Ghorjomi community of Upper
    Adjara during the Russo-Turkish War of 1877–78. By 1969 Zoti counted some three hundred households.


    The mosque went up in 1904: a two-storey timber building crowned by a domed minaret, lit by two tiers
    of windows. Inside, a wooden gallery runs along three walls, the mihrab is set in the south wall and
    a minbar stands in one corner. The carving and the frieze are picked out in green, turquoise and red.
    The walls carry plant scrolls and bouquets in orange, red, green and black on that pale blue ground.
    Tradition gives the painting to a master remembered as Chan Omer.


    Worth a slower look:


    - the log bridge over the Gubazeuli

    - the remains of the medieval Ghoma fortress at a spot called Saqdris Qeli, where fragments of the
    east and west walls survive

    - Sanislia, a small spa with thermal mineral water, about fifteen kilometres away


    Close to the village rises Mount Kidobana, 2,200–2,400 metres high, where Zoti's families still take
    their herds for the summer.


    To most drivers Zoti is the last stop before the long climb to Bakhmaro. Step into the mosque first,
    and the road turns into a story about people who crossed the mountains a century and a half ago and
    stayed.
  tip: >-
    The mosque is a house of prayer, not a museum. Ask a neighbour who keeps the key, take off your shoes,
    cover arms and legs (women also their hair) and avoid prayer times. Photograph the painting only with
    permission. The shops in Zoti are small, so buy food and fuel in Chokhatauri. May to October is the
    window: winter here lasts about six months, and the road on to Bakhmaro is realistically a summer
    road. The Ghoma fortress ruins are hard to find alone, so ask locals for Saqdris Qeli.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then the S12 towards Lanchkhuti and
    the Sh2 to Chokhatauri, about 275 km of asphalt. In Chokhatauri turn onto the Sh81, the Bakhmaro road,
    and follow the Gubazeuli upstream for roughly 20–25 km to Zoti. Door to door that is about 300 km;
    allow five to six hours with stops. The valley road is narrow, and its surface changes with the seasons
    and the latest roadworks: patched asphalt, gravel and potholes after rain. Chokhatauri has the last
    reliable fuel. An SUV's ground clearance is worth having, and if you continue to Bakhmaro, take a
    4×4.
ru:
  name: Зоти
  short: >-
    Гурийская горная деревня аджарских переселенцев на дороге в Бахмаро, с расписной деревянной мечетью
    1904 года, куда мало кто из проезжающих заходит.
  body: >-
    **В деревянной мечети Зоти на небесно-голубой стене цветут гроздья оранжевых и красных цветов, и почти
    все, кто едет вверх к Бахмаро, проезжают мимо них.**


    Деревня поднимается по правому берегу Губазеули, на северном склоне Месхетского хребта, примерно в
    двадцати пяти километрах вверх по долине от Чохатаури. Зима здесь длится около шести месяцев. Большинство
    жителей — аджарцы, потомки семей, перебравшихся из общины Горджоми в Верхней Аджарии во время Русско-турецкой
    войны 1877–1878 годов. К 1969 году в Зоти насчитывалось около трёхсот домохозяйств.


    Мечеть возвели в 1904 году: двухэтажное деревянное здание, увенчанное купольным минаретом, освещённое
    двумя ярусами окон. Внутри деревянная галерея тянется вдоль трёх стен, михраб расположен в южной стене,
    а минбар стоит в одном из углов. Резьба и фриз выделены зелёным, бирюзовым и красным. На стенах —
    растительные завитки и букеты оранжевого, красного, зелёного и чёрного цветов на этом светло-голубом
    фоне. Предание приписывает роспись мастеру, известному как Чан Омер.


    Стоит задержаться и рассмотреть:

    - бревенчатый мост через Губазеули

    - остатки средневековой крепости Гома в месте под названием Сакдрис-Кели, где сохранились фрагменты
    восточной и западной стен

    - Санислия — небольшой курорт с термальной минеральной водой, примерно в пятнадцати километрах


    Рядом с деревней поднимается гора Кидобана, высотой 2200–2400 метров, куда семьи Зоти до сих пор гонят
    стада на летний выпас.


    Для большинства водителей Зоти — последняя остановка перед долгим подъёмом к Бахмаро. Зайдите сначала
    в мечеть, и дорога превратится в рассказ о людях, которые перешли горы полтора века назад — и остались.
  tip: >-
    Мечеть — дом молитвы, а не музей. Спросите у соседей, кто хранит ключ, снимите обувь, прикройте руки
    и ноги (женщинам — и волосы) и не приходите во время молитвы. Фотографируйте роспись только с разрешения.
    Магазины в Зоти маленькие, так что еду и топливо покупайте в Чохатаури. Лучшее время — с мая по октябрь:
    зима здесь длится около шести месяцев, а дорога дальше к Бахмаро фактически летняя. Руины крепости
    Гома трудно найти самостоятельно, так что спрашивайте местных про Сакдрис-Кели.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 в сторону Ланчхути
    и по Sh2 до Чохатаури — около 275 км асфальта. В Чохатаури сверните на Sh81, дорогу на Бахмаро, и
    следуйте вверх по течению Губазеули примерно 20–25 км до Зоти. От двери до двери — около 300 км; отведите
    пять-шесть часов с остановками. Дорога по долине узкая, и её покрытие меняется в зависимости от сезона
    и последних дорожных работ: латаный асфальт, гравий и выбоины после дождя. В Чохатаури — последняя
    надёжная заправка. Клиренс внедорожника пригодится, а если продолжите до Бахмаро, берите полноприводный
    автомобиль.
fa:
  name: زوتی
  short: >-
    روستایی کوهستانی در گوریا، محل سکونت مهاجران آجاریایی بر جادهٔ باخمارو، با مسجدی چوبی و رنگارنگ از
    سال ۱۹۰۴ که کمتر رانندگی به درون آن پا می‌گذارد.
  body: >-
    **در مسجد چوبی زوتی، دسته‌های گل‌های نارنجی و سرخ بر دیواری به رنگ آبیِ آسمانی شکفته‌اند، و تقریباً
    همه کسانی که به سوی باخمارو می‌روند، از کنارشان می‌گذرند.**


    روستا بر کنارهٔ راست رود گوبازئولی، بر دامنهٔ شمالی رشته‌کوه مسختی، حدود بیست‌وپنج کیلومتر در بالادست
    دره از چوخاتائوری، بالا می‌رود. زمستان اینجا نزدیک شش ماه به طول می‌انجامد. بیشتر مردمانش آجاریایی‌اند،
    از نوادگان خانواده‌هایی که در جنگ روس‌وعثمانی ۱۸۷۷–۱۸۷۸ از دهستان غورجومی در آجاریای بالا کوچ کردند.
    تا سال ۱۹۶۹، زوتی نزدیک به سیصد خانوار داشت.


    این مسجد در سال ۱۹۰۴ برپا شد: بنایی چوبی و دوطبقه، با مناره‌ای گنبددار بر فراز آن، که از دو ردیف پنجره
    نور می‌گیرد. درون آن، رواقی چوبی در امتداد سه دیوار کشیده شده، محراب در دیوار جنوبی جای دارد و منبری
    در گوشه‌ای ایستاده است. کنده‌کاری و قرنیز با رنگ‌های سبز، فیروزه‌ای و سرخ برجسته شده‌اند. دیوارها
    پر از پیچک‌های گیاهی و دسته‌گل‌هایی به رنگ نارنجی، سرخ، سبز و سیاه، بر آن زمینهٔ آبی کم‌رنگ‌اند. روایت
    این نگارگری را به استادی که به نام چان عمر یاد می‌شود، نسبت می‌دهد.


    ارزش نگاهی آرام‌تر را دارند:

    - پل چوبیِ روی رود گوبازئولی

    - بازماندهٔ قلعهٔ قرون‌وسطاییِ گوما، در محلی به نام ساکدریس‌کِلی، جایی که قطعاتی از دیوارهای شرقی
    و غربی برجای مانده‌اند

    - سانیسلیا، آب‌درمانی کوچکی با آب معدنیِ گرم، در حدود پانزده کیلومتری


    نزدیک روستا، کوه کیدوبانا، به بلندی ۲٬۲۰۰ تا ۲٬۴۰۰ متر، سربرافراشته که خانواده‌های زوتی هنوز گله‌های
    خود را در تابستان به آن‌جا می‌برند.


    برای بیشتر رانندگان، زوتی آخرین توقف پیش از سربالایی طولانی به باخمارو است. نخست به درون مسجد پا بگذارید،
    و راه به داستانی از مردمی بدل می‌شود که یک‌ونیم سده پیش از کوه‌ها گذشتند و ماندند.
  tip: >-
    این مسجد خانهٔ نیایش است، نه موزه. از همسایه‌ای بپرسید که کلید را نگه می‌دارد، کفش خود را دربیاورید،
    بازو و پا (زنان همچنین مو) را بپوشانید و از ساعت نمازها دوری کنید. نگاره را تنها با اجازه عکس بگیرید.
    مغازه‌های زوتی کوچک‌اند، پس غذا و سوخت را در چوخاتائوری بخرید. بهترین زمان سفر از مه تا اکتبر است:
    زمستان اینجا نزدیک شش ماه به طول می‌انجامد، و جادهٔ ادامه به باخمارو در عمل جاده‌ای تابستانی است.
    ویرانه‌های قلعهٔ گوما را به‌تنهایی سخت می‌توان یافت، پس از مردم محل دربارهٔ ساکدریس‌کِلی بپرسید.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار کوتایسی تا سامتردیا برانید، سپس در مسیر S12 به سوی
    لانچخوتی و Sh2 تا چوخاتائوری — حدود ۲۷۵ کیلومتر آسفالت. در چوخاتائوری به Sh81، جادهٔ باخمارو، بپیچید
    و رود گوبازئولی را رو به بالادست، حدود ۲۰ تا ۲۵ کیلومتر، تا زوتی دنبال کنید. از در تا در، این حدود
    ۳۰۰ کیلومتر است؛ با توقف‌ها پنج تا شش ساعت زمان بگذارید. جادهٔ درّه تنگ است، و رویهٔ آن با فصل‌ها
    و کارهای راه‌سازی اخیر تغییر می‌کند: آسفالت وصله‌کاری‌شده، شن‌ریزه و چاله پس از باران. چوخاتائوری
    آخرین سوخت‌گیریِ مطمئن را دارد. فاصلهٔ زیاد شاسی‌بلند از زمین به کار می‌آید، و اگر تا باخمارو ادامه
    می‌دهید، خودرویی چهارچرخ‌محرک بردارید.
he:
  name: זוטי
  short: כפר הרים גוריאני של מתיישבים אג'רים על כביש בכמארו, עם מסגד עץ צבוע מ-1904 שרק מעטים מהנוסעים
    נכנסים אליו.
  body: >-
    **במסגד העץ של זוטי פורחים אשכולות פרחים כתומים ואדומים על קיר תכול-שמיים, וכמעט כל מי שנוסע במעלה
    הדרך לבכמארו חולף על פניהם.**


    הכפר מטפס על הגדה הימנית של גובזאולי, על המדרון הצפוני של רכס מסחתי, כעשרים וחמישה קילומטרים במעלה
    העמק מצ'וחאטאורי. החורף כאן נמשך כשישה חודשים. רוב תושביו הם אג'רים, צאצאי משפחות שהגיעו מקהילת גורג'ומי
    שבאג'אריה העילית בעת מלחמת רוסיה-טורקיה של 1877–1878. עד 1969 מנתה זוטי כשלוש מאות משקי בית.


    המסגד נבנה ב-1904: מבנה עץ דו-קומתי המוכתר במינרט בעל כיפה, מואר בשתי שורות חלונות. בפנים, גלריית
    עץ עוברת לאורך שלושה קירות, המחראב בקיר הדרומי והמנבר עומד בפינה אחת. הגילוף והפריז מודגשים בירוק,
    טורקיז ואדום. הקירות עמוסים בעיטורי צמחים מסולסלים ובזרי פרחים בכתום, אדום, ירוק ושחור על אותו רקע
    תכול בהיר. המסורת מייחסת את הציור לאמן הזכור בשם צ'אן עומר.


    שווה מבט איטי יותר:

    - גשר העץ על נהר הגובזאולי

    - שרידי מבצר גומה מימי הביניים במקום הקרוי סקדריס-קלי, שבו נותרו שברי הקירות המזרחי והמערבי

    - סניסליה, אתר מרחצאות קטן עם מים מינרליים תרמיים, כחמישה עשר קילומטרים משם


    בקרבת הכפר מתנשא הר קידובנה, בגובה 2,200–2,400 מטרים, שאליו עדיין מובילות משפחות זוטי את עדריהן לקיץ.


    לרוב הנוסעים זוטי היא התחנה האחרונה לפני העלייה הארוכה לבכמארו. היכנסו אל המסגד קודם, והדרך תהפוך
    לסיפור על אנשים שחצו את ההרים לפני מאה וחמישים שנה ונשארו.
  tip: >-
    המסגד הוא בית תפילה, לא מוזיאון. שאלו שכן שמחזיק את המפתח, הסירו נעליים, כסו זרועות ורגליים (נשים
    גם שיער) והימנעו משעות התפילה. צלמו את הציור רק ברשות. החנויות בזוטי קטנות, אז קנו מזון ודלק בצ'וחאטאורי.
    העונה המתאימה היא מאי עד אוקטובר: החורף כאן נמשך כשישה חודשים, והמשך הדרך לבכמארו הוא בפועל דרך קיץ.
    שרידי מבצר גומה קשה למצוא לבד, אז שאלו את המקומיים על סקדריס-קלי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני קוטאיסי עד סמטרדיה, ואז ב-S12 לעבר לנצ'חוטי וב-Sh2
    עד צ'וחאטאורי — כ-275 ק"מ אספלט. בצ'וחאטאורי פנו ל-Sh81, כביש בכמארו, ועקבו במעלה גובזאולי כ-20–25
    ק"מ עד זוטי. מדלת לדלת זה כ-300 ק"מ; הקדישו חמש עד שש שעות עם עצירות. כביש העמק צר, ומצבו משתנה עם
    העונות ועבודות הכביש האחרונות: אספלט מתוקן, חצץ ומהמורות אחרי גשם. בצ'וחאטאורי התדלוק האחרון המהימן.
    כדאי רכב שטח עם מרווח גחון גבוה, ואם ממשיכים לבכמארו, קחו רכב עם הנעה כפולה.
ar:
  name: زوتي
  short: >-
    قرية جبلية غورية لمهاجرين أدجاريين على طريق باخمارو، فيها مسجد خشبي مطلي يعود إلى عام 1904 نادرًا
    ما يدخله السائقون.
  body: >-
    **في مسجد زوتي الخشبي، تتفتح باقات من الزهور البرتقالية والحمراء على جدار أزرق سماوي، ويعبر بها تقريبًا
    كل من يقود صعودًا إلى باخمارو دون أن يراها.**


    تتسلق القرية الضفة اليمنى لنهر غوبازئولي، على السفح الشمالي لسلسلة مسختي، على نحو خمسة وعشرين كيلومترًا
    صعودًا في الوادي من تشوخاتاوري. يدوم الشتاء هنا نحو ستة أشهر. معظم سكانها من الأدجاريين، أحفاد عائلات
    انتقلت من جماعة غورجومي في أعالي أدجارا خلال الحرب الروسية العثمانية 1877–1878. وبحلول عام 1969 كانت
    زوتي تضم نحو ثلاثمائة أسرة.


    شُيّد المسجد عام 1904: مبنى خشبي من طابقين تعلوه مئذنة مقبّبة، ويستمد إنارته من طبقتين من النوافذ.
    في الداخل تمتد شرفة خشبية على طول ثلاثة جدران، والمحراب في الجدار الجنوبي، والمنبر يقف في زاوية. النقش
    والإفريز ملوّنان بالأخضر والفيروزي والأحمر. تحمل الجدران زخارف نباتية وباقات بالبرتقالي والأحمر والأخضر
    والأسود على تلك الخلفية الزرقاء الفاتحة. ويعزو التراث الشعبي هذا الرسم إلى معلّم يُذكر باسم تشان عمر.


    تستحق نظرة متمهّلة:

    - الجسر الخشبي على نهر غوبازئولي

    - بقايا قلعة غوما من العصور الوسطى في موضع يُدعى ساكدريس كيلي، حيث بقيت أجزاء من الجدارين الشرقي والغربي

    - سانيسليا، منتجع صغير بمياه معدنية حرارية، على مسافة نحو خمسة عشر كيلومترًا


    قرب القرية يرتفع جبل كيدوبانا، بارتفاع 2200–2400 متر، حيث لا تزال عائلات زوتي تأخذ قطعانها للصيف.


    بالنسبة لمعظم السائقين، تُعدّ زوتي آخر محطة قبل الصعود الطويل إلى باخمارو. لكن ادخل المسجد أولًا،
    فيتحول الطريق إلى حكاية عن أناس عبروا الجبال قبل قرن ونصف وبقوا.
  tip: >-
    المسجد بيت للصلاة، ليس متحفًا. اسأل الجيران عمّن يحتفظ بالمفتاح، اخلع حذاءك، وغطِّ الذراعين والساقين
    (والنساء أيضًا الشعر)، وتجنّب مواعيد الصلاة. صوّر الرسم فقط بإذن. المتاجر في زوتي صغيرة، فاشترِ الطعام
    والوقود في تشوخاتاوري. أنسب وقت للزيارة من مايو إلى أكتوبر: يدوم الشتاء هنا نحو ستة أشهر، والطريق
    الممتد إلى باخمارو هو عمليًا طريق صيفي. من الصعب إيجاد أنقاض قلعة غوما بمفردك، فاسأل السكان المحليين
    عن ساكدريس كيلي.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بكوتايسي حتى سامتريديا، ثم S12 نحو لانتشخوتي وSh2 حتى تشوخاتاوري
    — نحو 275 كم من الطريق المعبّد. في تشوخاتاوري انعطف إلى Sh81، طريق باخمارو، وتابع صعودًا مع نهر غوبازئولي
    لنحو 20–25 كم حتى زوتي. من الباب إلى الباب هذا نحو 300 كم؛ خصّص خمس إلى ست ساعات مع التوقفات. طريق
    الوادي ضيق، وسطحه يتغيّر مع الفصول وأعمال الطرق الأخيرة: أسفلت مرقّع وحصى وحفر بعد المطر. تشوخاتاوري
    تضم آخر محطة وقود موثوقة. يُستحسن استخدام سيارة مرتفعة عن الأرض، وإذا تابعت إلى باخمارو فاستخدم سيارة
    دفع رباعي.
