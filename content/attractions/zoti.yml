ka:
  name: ზოტი
  short: გუბაზეულის ხეობის ბოლო სოფელი ბახმაროსკენ მიმავალ გზაზე, ტყითა და ხის სახლებით.
  body: >-
    **ზოტი ბახმაროსკენ მიმავალ გზაზე უკანასკნელი ნამდვილი სოფელია.** ის გუბაზეულის ხეობაში, ჩოხატაურიდან
    დაახლოებით ოცდახუთ კილომეტრში, დაახლოებით რვაასი მეტრის სიმაღლეზეა. აქამდე გზა შედარებით ნორმალურია;
    ზოტის ზემოთ იწყება ის მონაკვეთი, რომლის გამოც ბახმაროსკენ მხოლოდ ჯიპებით მიდიან.

    სოფელი ხეობის ორივე ნაპირზეა გაწელილი. სახლები ხისაა, მაღალ ქვის საძირკველზე აშენებული — დასავლეთ
    საქართველოს ტიპური ტიპი, აივნით მთელ ფასადზე. ეზოებში სიმინდი, ვაზი ხეზე და თხილის ბაღი. ზამთარში
    სოფელი ნახევრად იცლება, ზაფხულში კი უკან ბრუნდებიან.

    რატომ ღირს გაჩერება:

    - **გუბაზეულის მდინარე** — სუფთა, ცივი, კალმახიანი; ხიდიდან ფსკერი ჩანს

    - **ტყე** — წიფლისა და წაბლის, ბახმაროსკენ ასვლისას ის ნაძვში გადადის და ეს ცვლილება თვალით ჩანს

    - **ბოლო წერტილი**, სადაც ნორმალური მობილური კავშირი და მაღაზია ჯერ კიდევ არის

    ბახმაროსკენ მიმავალი უმეტესობა აქ ჩერდება: ან ბოლო ყავაზე, ან იმისთვის, რომ საბურავები და გზის მდგომარეობა
    შეამოწმოს. ადგილობრივები გზის ამბავს ზუსტად გეტყვიან — და მათი ინფორმაცია უფრო სანდოა, ვიდრე ნებისმიერი
    აპლიკაცია.

    ზოტი დამოუკიდებელი დანიშნულების ადგილი არაა. ის იმ ტიპის გაჩერებაა, რომელიც მარშრუტს აზრს მატებს:
    ორმოცდაათი წუთი მდინარესთან, სანამ გზა რთულდება.
  tip: >-
    ერთი-ორი საათი გზაში გაჩერებად. ბახმაროსკენ ასვლამდე აქ შეამოწმე საბურავები და ჰკითხე ადგილობრივებს
    გზის მდგომარეობა — ის კვირიდან კვირაში იცვლება. მაღაზია პატარაა, სერიოზული შესყიდვა ჩოხატაურში გააკეთე.
    მობილური კავშირი აქ ჯერ მუშაობს, ზემოთ — არა. ტუალეტი და კაფე მინიმალურია. ზამთარში გზა შეიძლება დაიხუროს.
  route: >-
    ჩოხატაურიდან აღმოსავლეთით გუბაზეულის ხეობით — თბილისიდან ჯამში 345 კმ, დაახლოებით ხუთი საათი ორმოცდახუთი
    წუთი. ჩოხატაურამდე ასფალტია, შემდეგ თანდათან უარესდება: პირველი ათი კილომეტრი დაზიანებული ასფალტია,
    შემდეგ ხრეში ორმოებით და რამდენიმე ხიდით. მაღალი კლირენსი აუცილებელია. ბოლო საწვავი ჩოხატაურშია. ბახმაროსკენ
    გაგრძელებისთვის ჯიპი სავალდებულოა.
en:
  name: Zoti
  short: The last real village in the Gubazeuli valley on the road to Bakhmaro, all forest and wooden
    houses.
  body: >-
    **Zoti is the last proper village on the road to Bakhmaro.** It lies in the Gubazeuli valley about
    twenty-five kilometres from Chokhatauri, at roughly eight hundred metres. Up to here the road is more
    or less normal; above Zoti begins the stretch that explains why people only drive to Bakhmaro in four-wheel
    drives.

    The village is strung along both banks of the valley. The houses are timber on high stone footings
    — the standard western Georgian type, with a balcony running the width of the facade. In the yards:
    maize, vines trained up trees, hazelnut plots. In winter the place half-empties; in summer people
    come back.

    Why it is worth stopping:

    - The **Gubazeuli river** — clear, cold and holding trout; from the bridge you can see the bed

    - The **forest** — beech and chestnut here, turning to spruce as you climb towards Bakhmaro, and the
    change is visible in a matter of kilometres

    - The **last point** at which mobile coverage and a shop still exist

    Most people bound for Bakhmaro stop here anyway, either for a final coffee or to check their tyres
    and ask about the road. Locals will give you an accurate account of its condition, and their information
    is more reliable than any application.

    Zoti is not a destination in itself. It is the kind of stop that gives a route its shape: fifty minutes
    by the river before the driving gets serious.
  tip: >-
    One or two hours as a stop on the way. Before climbing to Bakhmaro, check your tyres here and ask
    locals about the road, which changes from week to week. The shop is small, so do any real buying in
    Chokhatauri. Mobile coverage works here and not above. Toilets and cafes are minimal. In winter the
    road above can close entirely.
  route: >-
    From Chokhatauri head east up the Gubazeuli valley — 345 km from Tbilisi in total, about five hours
    forty-five. As far as Chokhatauri the road is asphalt; after that it degrades steadily, with ten kilometres
    of broken asphalt followed by gravel, potholes and several bridges. Good ground clearance is necessary.
    The last fuel is in Chokhatauri. To continue up to Bakhmaro a four-wheel drive is mandatory.
ru:
  name: Зоти
  short: Последнее настоящее село в ущелье Губазеули на дороге к Бахмаро — лес и деревянные дома.
  body: >-
    **Зоти — последнее полноценное село на дороге в Бахмаро.** Оно лежит в ущелье Губазеули примерно в
    двадцати пяти километрах от Чохатаури, на высоте около восьмисот метров. До сюда дорога более или
    менее нормальная; выше Зоти начинается тот участок, из-за которого в Бахмаро ездят только на внедорожниках.

    Село вытянуто по обоим берегам. Дома деревянные, на высоком каменном основании — стандартный западногрузинский
    тип, с балконом во всю ширину фасада. Во дворах кукуруза, лоза, пущенная по деревьям, фундучные участки.
    Зимой село наполовину пустеет, летом люди возвращаются.

    Почему стоит остановиться:

    - Река **Губазеули** — прозрачная, холодная, с форелью; с моста видно дно

    - **Лес** — здесь бук и каштан, а по мере подъёма к Бахмаро он сменяется елью, и эта смена видна на
    протяжении нескольких километров

    - **Последняя точка**, где ещё есть мобильная связь и магазин

    Большинство едущих в Бахмаро останавливаются здесь и так: выпить последний кофе или проверить колёса
    и расспросить про дорогу. Местные дадут точную картину её состояния, и их сведения надёжнее любого
    приложения.

    Зоти не самостоятельная цель. Это та остановка, которая придаёт маршруту форму: пятьдесят минут у
    реки перед тем, как езда станет серьёзной.
  tip: >-
    Час-два как остановка в пути. Перед подъёмом в Бахмаро проверьте здесь колёса и спросите местных о
    дороге: она меняется от недели к неделе. Магазин маленький, серьёзные закупки делайте в Чохатаури.
    Мобильная связь работает здесь и не работает выше. Туалеты и кафе минимальны. Зимой дорога выше может
    закрыться совсем.
  route: >-
    Из Чохатаури на восток по ущелью Губазеули — от Тбилиси всего 345 км, около пяти часов сорока пяти
    минут. До Чохатаури асфальт; дальше покрытие последовательно ухудшается: десять километров разбитого
    асфальта, затем гравий, ямы и несколько мостов. Высокий клиренс необходим. Последняя заправка в Чохатаури.
    Чтобы продолжить к Бахмаро, полный привод обязателен.
fa:
  name: زوتی
  short: آخرین روستای واقعی درهٔ گوبازئولی بر جادهٔ باخمارو، سراسر جنگل و خانه‌های چوبی.
  body: >-
    **زوتی آخرین روستای درست‌وحسابی بر جادهٔ باخماروست.** در درهٔ گوبازئولی، حدود بیست‌وپنج کیلومتری چوخاتائوری،
    در ارتفاع تقریبی هشتصد متر قرار دارد. تا اینجا جاده کم‌وبیش عادی است؛ بالاتر از زوتی همان بخشی آغاز
    می‌شود که روشن می‌کند چرا مردم تنها با خودروی چهار چرخ محرک به باخمارو می‌روند.

    روستا در دو کرانهٔ دره کشیده شده است. خانه‌ها چوبی و بر پی سنگی بلندند — گونهٔ رایج غرب گرجستان، با
    ایوانی به پهنای کل نما. در حیاط‌ها ذرت، تاک بالارفته بر درخت، و باغ فندق. زمستان روستا نیمه‌خالی می‌شود
    و تابستان مردم بازمی‌گردند.

    چرا ارزش توقف دارد:

    - رود **گوبازئولی** — زلال و سرد و قزل‌آلادار؛ از روی پل کف رود پیداست

    - **جنگل** — اینجا راش و شاه‌بلوط است و در صعود به باخمارو به نوئل بدل می‌شود، و این دگرگونی در چند
    کیلومتر دیده می‌شود

    - **آخرین نقطه‌ای** که آنتن تلفن و مغازه هنوز هست

    بیشتر کسانی که راهی باخمارو هستند به‌هرحال اینجا می‌ایستند؛ برای قهوهٔ آخر یا برای بررسی لاستیک‌ها
    و پرسیدن حال جاده. مردم محلی وضع جاده را دقیق می‌گویند، و اطلاعاتشان از هر برنامهٔ تلفنی معتبرتر است.

    زوتی مقصدی مستقل نیست. از آن توقف‌هایی است که به مسیر شکل می‌دهد: پنجاه دقیقه کنار رود، پیش از آنکه
    رانندگی جدی شود.
  tip: >-
    یکی دو ساعت به‌عنوان توقف بین‌راهی. پیش از صعود به باخمارو لاستیک‌ها را اینجا بررسی کنید و از اهالی
    دربارهٔ جاده بپرسید؛ وضعش هفته‌به‌هفته فرق می‌کند. مغازه کوچک است، پس خرید اصلی را در چوخاتائوری بکنید.
    آنتن تلفن اینجا کار می‌کند و بالاتر نه. سرویس بهداشتی و کافه در کمترین حد است. زمستان جادهٔ بالادست
    ممکن است کاملاً بسته شود.
  route: >-
    از چوخاتائوری به شرق در درهٔ گوبازئولی — از تفلیس روی‌هم ۳۴۵ کیلومتر، حدود پنج ساعت و چهل‌وپنج دقیقه.
    تا چوخاتائوری آسفالت است؛ پس از آن پیوسته بدتر می‌شود: ده کیلومتر آسفالت شکسته و سپس شن و چاله و چند
    پل. ارتفاع مناسب از زمین لازم است. آخرین سوخت در چوخاتائوری. برای ادامه تا باخمارو خودروی چهار چرخ
    محرک الزامی است.
he:
  name: זוטי
  short: הכפר האמיתי האחרון בעמק גובאזאולי בדרך לבאחמארו, כולו יער ובתי עץ.
  body: >-
    **זוטי הוא הכפר הראוי האחרון בדרך לבאחמארו.** הוא שוכן בעמק גובאזאולי כעשרים וחמישה קילומטרים מצ׳וחאטאורי,
    בגובה של כשמונה מאות מטרים. עד לכאן הכביש פחות או יותר תקין; מעל זוטי מתחיל הקטע שמסביר מדוע נוסעים
    לבאחמארו רק ברכבי הנעה כפולה.

    הכפר משתרע לאורך שתי גדות העמק. הבתים מעץ על יסודות אבן גבוהים — הטיפוס המערב-גאורגי הרגיל, עם מרפסת
    לרוחב כל החזית. בחצרות תירס, גפנים המטפסות על עצים וחלקות אגוזי לוז. בחורף הכפר מתרוקן למחצה, ובקיץ
    האנשים חוזרים.

    למה כדאי לעצור:

    - נהר **גובאזאולי** — צלול, קר ובו פורלים; מן הגשר רואים את הקרקעית

    - **היער** — כאן אשור וערמון, ובעלייה לבאחמארו הוא מתחלף באשוחית, והשינוי נראה בתוך כמה קילומטרים

    - **הנקודה האחרונה** שבה עדיין יש קליטה סלולרית וחנות

    רוב הנוסעים לבאחמארו עוצרים כאן ממילא, לקפה אחרון או כדי לבדוק צמיגים ולשאול על הדרך. המקומיים ימסרו
    תיאור מדויק של מצבה, והמידע שלהם אמין יותר מכל אפליקציה.

    זוטי אינו יעד בפני עצמו. זו עצירה שנותנת למסלול צורה: חמישים דקות ליד הנהר לפני שהנהיגה נעשית רצינית.
  tip: >-
    שעה או שעתיים כעצירה בדרך. לפני העלייה לבאחמארו בדקו כאן צמיגים ושאלו את המקומיים על הדרך, שמשתנה
    משבוע לשבוע. החנות קטנה, אז קניות אמיתיות עשו בצ׳וחאטאורי. הקליטה הסלולרית פועלת כאן ולא מעל. שירותים
    ובתי קפה מינימליים. בחורף הכביש מעל עלול להיסגר לגמרי.
  route: >-
    מצ׳וחאטאורי מזרחה במעלה עמק גובאזאולי — 345 ק״מ מטביליסי בסך הכול, כחמש שעות וארבעים וחמש. עד צ׳וחאטאורי
    הכביש סלול; אחר כך הוא מתדרדר בהתמדה: עשרה קילומטרים של אספלט שבור ואחריהם חצץ, בורות וכמה גשרים.
    מרווח גחון טוב הכרחי. התדלוק האחרון בצ׳וחאטאורי. להמשך אל באחמארו הנעה כפולה היא חובה.
ar:
  name: زوتي
  short: آخر قرية حقيقية في وادي غوبازاولي على طريق باخمارو، غابة وبيوت خشبية.
  body: >-
    **زوتي آخر قرية حقيقية على طريق باخمارو.** تقع في وادي غوبازاولي على نحو خمسة وعشرين كيلومتراً من
    تشوخاتاوري، على ارتفاع ثمانمئة متر تقريباً. وحتى هنا يكون الطريق عادياً إلى حد ما؛ وفوق زوتي يبدأ
    المقطع الذي يفسر لماذا لا يُقاد إلى باخمارو إلا بدفع رباعي.

    تمتد القرية على ضفتي الوادي. البيوت خشبية على أساسات حجرية عالية — النمط الشائع في غرب جورجيا، بشرفة
    تمتد بعرض الواجهة كلها. وفي الأفنية ذرة وكروم مرفوعة على الأشجار وقطع بندق. في الشتاء تخلو القرية
    نصف خلوّ، وفي الصيف يعود الناس.

    لماذا يستحق التوقف:

    - نهر **غوبازاولي** — صافٍ بارد فيه تراوت؛ ومن الجسر يُرى القاع

    - **الغابة** — زان وكستناء هنا، وتتحول إلى شربين مع الصعود نحو باخمارو، والتبدل يُرى خلال كيلومترات
    قليلة

    - **آخر نقطة** ما زالت فيها تغطية هاتف ومتجر

    ومعظم قاصدي باخمارو يقفون هنا على أي حال، لقهوة أخيرة أو لفحص الإطارات والسؤال عن الطريق. وأهل المكان
    يعطونك وصفاً دقيقاً لحاله، ومعلوماتهم أوثق من أي تطبيق.

    زوتي ليست وجهة بذاتها. إنها من الوقفات التي تمنح المسار شكله: خمسون دقيقة عند النهر قبل أن تصير القيادة
    جادة.
  tip: >-
    ساعة أو ساعتان كوقفة في الطريق. قبل الصعود إلى باخمارو افحص الإطارات هنا واسأل الأهالي عن الطريق،
    فحاله يتبدل من أسبوع لآخر. المتجر صغير، فاقضِ مشترياتك الحقيقية في تشوخاتاوري. تغطية الهاتف تعمل هنا
    ولا تعمل فوق. دورات المياه والمقاهي في حدها الأدنى. وفي الشتاء قد يُغلق الطريق الأعلى تماماً.
  route: >-
    من تشوخاتاوري شرقاً صعوداً في وادي غوبازاولي — 345 كم من تبليسي إجمالاً، نحو خمس ساعات وخمس وأربعين
    دقيقة. حتى تشوخاتاوري الطريق معبّد؛ وبعدها يتدهور باطراد: عشرة كيلومترات من إسفلت متكسر ثم حصى وحفر
    وعدة جسور. ارتفاع الهيكل ضروري. آخر وقود في تشوخاتاوري. وللمتابعة إلى باخمارو يلزم الدفع الرباعي.
