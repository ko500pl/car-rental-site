ka:
  name: ბაღდათი — მაიაკოვსკის სახლ-მუზეუმი
  short: პოეტ ვლადიმერ მაიაკოვსკის მშობლიური სახლი იმერულ დაბაში, ხანისწყლის ნაპირზე.
  body: >-
    **რუსული ავანგარდის ყველაზე ხმამაღალი პოეტი იმერეთის სოფელში დაიბადა.** ვლადიმერ მაიაკოვსკი 1893 წლის
    19 ივლისს ბაღდათში დაიბადა, სადაც მამამისი მეტყევედ მუშაობდა. ოჯახი სახლში რუსულად საუბრობდა, ბიჭი
    კი ქუჩასა და სკოლაში ქართულად — მოგვიანებით თავად წერდა: „კავკასიაში დავიბადე, მამა კაზაკია, დედა
    უკრაინელი, დედაენა კი ქართული მაქვს“.


    1906 წელს მამა უეცრად გარდაიცვალა სისხლის მოწამვლით და ოჯახი მოსკოვში გადავიდა. იქიდან იწყება ის ბიოგრაფია,
    რომელიც სახელმძღვანელოებშია: ფუტურიზმი, 1913 წლის მანიფესტი „სილა საზოგადოებრივ გემოვნებას“, „ღრუბელი
    შარვალში“, რევოლუციური პლაკატები, თეატრი, და 1930 წელს თვითმკვლელობა.


    დაბასაც თავისი ისტორია აქვს. სახელი „ბაღდათი“ სპარსული ფესვისაა და „ღვთისმიერს“ ნიშნავს. 1940 წელს
    ის მაიაკოვსკად გადაარქვეს და ეს სახელი 1991 წლამდე შემორჩა, როცა ისტორიული სახელწოდება დაუბრუნდა.


    მუზეუმი საბჭოთა პერიოდში მოეწყო. ესაა ხის სახლი აივნით, სადაც პოეტის ბავშვობის ინტერიერი, ოჯახის ფოტოები,
    პირველი გამოცემები, ავანგარდული პლაკატები და პირადი ნივთებია. ექსპოზიცია პატარაა, მაგრამ კარგად შერჩეული,
    და მასში ის ნაწილიც ჩანს, რომელიც რუსულ მუზეუმებში იშვიათია — ქართული ბავშვობა.


    ბაღდათი თავად სამი ათასამდე მოსახლის დაბაა, აჯამეთის ტყის კიდეზე, ხანისწყლის ნაპირზე. ეს ღვინის მხარეა
    და საირმისკენ მიმავალი გზაც აქედან იწყება — მუზეუმი ლოგიკურად ჯდება ერთდღიან მარშრუტში.


    თუ ერთ დღეს ამ მხარეს უთმობ, ბაღდათი კარგი ღერძია. ჩრდილოეთით აჯამეთის მუხნარია, სამხრეთით გზა ტყიან
    ხეობაში ოცდაათი კილომეტრი ადის საირმის მინერალურ წყლებამდე, დასავლეთით კი ვანი და მისი გათხრებია.
    თავად დაბაში ბაზარი, მოედანთან ორიოდე კაფე და ის ჩვეულებრივი პროვინციული სიმშვიდეა, რომელსაც მაიაკოვსკი
    მთელი ცხოვრება ხმამაღლა ეპაექრებოდა.
  tip: >-
    ერთი საათი საკმარისია. ეტიკეტები ქართულად და რუსულადაა, ინგლისური მცირე — თანამშრომლები, ჩვეულებრივ,
    სიამოვნებით ჰყვებიან. სახლი ხისაა, ვიწრო კიბით და ჭრიალა იატაკით; ლიფტი და პანდუსი არ არის. ფოტოზე
    წინასწარ ჰკითხე. ეზოში ტუალეტია, კაფე კი დაბის ცენტრში, ხუთი წუთის სავალზე. ზამთარში სახლი ცივია და
    ვიზიტორი ცოტაა — სამაგიეროდ მთელი მუზეუმი შენია.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ სამხრეთით ბაღდათის მიმართულებით — სულ დაახლოებით 215 კმ და
    სამი საათი და ხუთი წუთი. მთელი მარშრუტი ასფალტიანია; ზესტაფონიდან ბაღდათამდე ოციოდე კილომეტრი ვიწრო
    რეგიონული გზაა აჯამეთის ტყის გავლით. მუზეუმი დაბის ცენტრში, ბაღდათის ქუჩაზეა და მაჩვენებელი ნიშანი
    აქვს. პარკინგი ქუჩაშია და უფასოა. საწვავი ზესტაფონსა და ბაღდათში აიღე. ეკონომ-კლასის ავტომობილი საკმარისია.
en:
  name: Baghdati — Mayakovsky House-Museum
  short: The birthplace of the poet Vladimir Mayakovsky, in a small Imeretian town on the Khanistsqali.
  body: >-
    **The loudest poet of the Russian avant-garde was born in an Imeretian village.** Vladimir Mayakovsky
    was born in Baghdati on 19 July 1893, where his father worked as a forester. The family spoke Russian
    at home, but the boy spoke Georgian in the street and at school. He later wrote: "I was born in the
    Caucasus, my father is a Cossack, my mother is Ukrainian. My mother tongue is Georgian."


    In 1906 his father died suddenly of blood poisoning and the family moved to Moscow. From there begins
    the biography that is in the textbooks: Futurism, the 1913 manifesto *A Slap in the Face of Public
    Taste*, *A Cloud in Trousers*, the revolutionary posters, the theatre, and his suicide in 1930.


    The town has its own story. The name Baghdati has a Persian root meaning "God-given". In 1940 it was
    renamed Mayakovsky, and it kept that name until 1991, when the historical form was restored.


    The museum was set up in the Soviet period. It is the wooden house with its balcony, holding the interiors
    of the poet's childhood, family photographs, first editions, avant-garde posters and personal belongings.
    The display is small but well chosen, and it covers the part of his life that Russian museums tend
    to skip: the Georgian childhood.


    Baghdati itself is a town of about three thousand people on the Khanistsqali at the edge of the Ajameti
    forest. This is wine country, and the road up to Sairme starts here, so the museum fits neatly into
    a day's route.


    If you are making a day of this corner, Baghdati works as the hinge. North of the town is the Ajameti
    oak forest; south, the road climbs thirty kilometres up a wooded gorge to the mineral springs at Sairme;
    west lie Vani and its excavations. The town itself has a market, a couple of cafes around the square
    and exactly the ordinary provincial calm that Mayakovsky spent his life shouting at.
  tip: >-
    An hour is enough. Labels are in Georgian and Russian with limited English, though staff are usually
    happy to talk you through it. The house is wooden, with a narrow stair and creaking floors; there
    is no lift or ramp. Ask before photographing. There is a toilet in the yard, and cafes in the town
    centre five minutes away. In winter the house is cold and visitors are few, which does mean you get
    the whole museum to yourself.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then turn south towards Baghdati — about 215 km in all,
    three hours five. The whole route is asphalt; the twenty kilometres from Zestaponi to Baghdati are
    a narrow regional road through the Ajameti forest. The museum is in the town centre on Baghdati Street
    and is signposted. Street parking is free. Fuel is available in Zestaponi and Baghdati. An economy
    car is sufficient.
ru:
  name: Багдати — дом-музей Маяковского
  short: Родной дом поэта Владимира Маяковского в небольшом имеретинском городке на Ханисцкали.
  body: >-
    **Самый громкий поэт русского авангарда родился в имеретинском селе.** Владимир Маяковский родился
    в Багдати 19 июля 1893 года, где его отец служил лесничим. Дома семья говорила по-русски, но на улице
    и в школе мальчик говорил по-грузински. Позже он писал: «Я родился на Кавказе, отец — казак, мать
    — украинка. Родной язык — грузинский».


    В 1906 году отец внезапно умер от заражения крови, и семья переехала в Москву. Оттуда начинается биография,
    которая есть в учебниках: футуризм, манифест 1913 года «Пощёчина общественному вкусу», «Облако в штанах»,
    революционные плакаты, театр и самоубийство в 1930-м.


    У городка своя история. Название «Багдати» персидского корня и означает «богоданный». В 1940 году
    его переименовали в Маяковский, и это имя держалось до 1991-го, когда вернули историческую форму.


    Музей устроили в советское время. Это деревянный дом с балконом, где сохранены интерьеры детства поэта,
    семейные фотографии, первые издания, авангардные плакаты и личные вещи. Экспозиция небольшая, но отобранная
    со вкусом, и она рассказывает ту часть жизни, которую российские музеи обычно пропускают, — грузинское
    детство.


    Сам Багдати — городок примерно на три тысячи жителей на Ханисцкали, у края Аджаметского леса. Это
    винный край, и отсюда же начинается дорога вверх на Саирме, так что музей хорошо ложится в однодневный
    маршрут.


    Если вы отводите на этот угол целый день, Багдати работает как шарнир. К северу от городка — Аджаметский
    дубовый лес; на юг дорога поднимается тридцать километров по лесистому ущелью к минеральным источникам
    Саирме; на запад — Вани с его раскопками. В самом городке есть рынок, пара кафе у площади и ровно
    та обычная провинциальная тишина, с которой Маяковский всю жизнь громко спорил.
  tip: >-
    Часа достаточно. Подписи на грузинском и русском, английских мало, но сотрудники обычно охотно всё
    рассказывают. Дом деревянный, с узкой лестницей и скрипучими полами; ни лифта, ни пандуса нет. Перед
    съёмкой спросите. Туалет во дворе, кафе — в центре городка, в пяти минутах. Зимой в доме холодно и
    посетителей мало, зато весь музей ваш.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем поворот на юг в сторону Багдати — всего около 215 км, три часа
    пять минут. Вся дорога асфальтированная; двадцать километров от Зестафони до Багдати — узкая региональная
    трасса через Аджаметский лес. Музей в центре городка, на улице Багдати, есть указатель. Парковка вдоль
    улицы бесплатная. Заправки есть в Зестафони и Багдати. Машины эконом-класса достаточно.
fa:
  name: باغداتی — خانه‌موزهٔ مایاکوفسکی
  short: زادگاه شاعر ولادیمیر مایاکوفسکی، در شهرکی کوچک در ایمرتی بر کرانهٔ خانیس‌تسکالی.
  body: >-
    **پرصداترین شاعر آوانگارد روسی در روستایی در ایمرتی زاده شد.** ولادیمیر مایاکوفسکی در نوزدهم ژوئیهٔ
    ۱۸۹۳ در باغداتی به دنیا آمد، جایی که پدرش جنگلبان بود. خانواده در خانه روسی حرف می‌زد، اما پسر در
    کوچه و مدرسه گرجی. بعدها نوشت: «در قفقاز زاده شدم، پدرم قزاق است و مادرم اوکراینی. زبان مادری‌ام گرجی
    است.»


    در ۱۹۰۶ پدرش ناگهان بر اثر عفونت خون درگذشت و خانواده به مسکو رفت. از آنجا زندگی‌نامه‌ای آغاز می‌شود
    که در کتاب‌های درسی است: فوتوریسم، بیانیهٔ ۱۹۱۳ «سیلی به ذوق عمومی»، «ابری در شلوار»، پوسترهای انقلابی،
    تئاتر، و خودکشی در ۱۹۳۰.


    شهرک هم داستان خود را دارد. نام باغداتی ریشه‌ای پارسی دارد به معنای «خداداد». در ۱۹۴۰ آن را مایاکوفسکی
    نامیدند و این نام تا ۱۹۹۱ ماند، تا آنکه صورت تاریخی بازگردانده شد.


    موزه در دورهٔ شوروی برپا شد. خانه‌ای چوبی با بالکن است که فضاهای کودکی شاعر، عکس‌های خانوادگی، چاپ‌های
    نخست، پوسترهای آوانگارد و وسایل شخصی را در خود دارد. نمایش کوچک اما سنجیده است و همان بخشی از زندگی
    او را می‌پوشاند که موزه‌های روسی معمولاً از آن می‌گذرند: کودکی گرجی.


    خود باغداتی شهرکی حدود سه هزار نفری بر خانیس‌تسکالی و در کنارهٔ جنگل آجامتی است. اینجا سرزمین شراب
    است و جادهٔ بالا رفتن به سایرمه هم از همین‌جا آغاز می‌شود، پس موزه به‌خوبی در مسیر یک‌روزه می‌نشیند.


    اگر یک روز را به این گوشه اختصاص می‌دهید، باغداتی نقش لولا را بازی می‌کند. شمال شهر جنگل بلوط آجامتی
    است؛ در جنوب جاده سی کیلومتر در دره‌ای جنگلی تا چشمه‌های معدنی سایرمه بالا می‌رود؛ و در غرب وانی و
    کاوش‌هایش قرار دارد. خود شهرک بازاری دارد، دو کافه دور میدان، و دقیقاً همان آرامش معمولی ولایتی که
    مایاکوفسکی تمام عمر با فریاد به آن تاخت.
  tip: >-
    یک ساعت کافی است. برچسب‌ها گرجی و روسی‌اند و انگلیسی کم است، هرچند کارکنان معمولاً با میل توضیح می‌دهند.
    خانه چوبی است با پلکانی باریک و کف‌های صدادار؛ آسانسور و سطح شیب‌دار ندارد. پیش از عکس گرفتن بپرسید.
    سرویس بهداشتی در حیاط است و کافه‌ها در مرکز شهرک، پنج دقیقه آن‌سوتر. زمستان خانه سرد است و بازدیدکننده
    کم، که یعنی تمام موزه از آنِ شماست.
  route: >-
    از تفلیس با بزرگراه E60 تا زستافونی، سپس به جنوب و به سوی باغداتی بپیچید — روی‌هم حدود ۲۱۵ کیلومتر
    و سه ساعت و پنج دقیقه. کل مسیر آسفالت است؛ بیست کیلومتر از زستافونی تا باغداتی جاده‌ای منطقه‌ای و
    باریک از میان جنگل آجامتی است. موزه در مرکز شهرک و در خیابان باغداتی است و تابلو دارد. پارک کنار خیابان
    رایگان است. سوخت در زستافونی و باغداتی هست. خودروی اقتصادی کافی است.
he:
  name: בגדאטי — בית־המוזיאון של מיאקובסקי
  short: מקום הולדתו של המשורר ולדימיר מיאקובסקי, בעיירה אימרתית קטנה על נהר החניסצקאלי.
  body: >-
    **המשורר הרועש ביותר של האוונגרד הרוסי נולד בכפר אימרתי.** ולדימיר מיאקובסקי נולד בבגדאטי ב-19 ביולי
    1893, במקום שבו שימש אביו יערן. המשפחה דיברה רוסית בבית, אך הילד דיבר גאורגית ברחוב ובבית הספר. מאוחר
    יותר כתב: "נולדתי בקווקז, אבי קוזאק, אמי אוקראינית. שפת אמי היא גאורגית."


    ב-1906 מת אביו לפתע מהרעלת דם והמשפחה עברה למוסקבה. משם מתחילה הביוגרפיה שבספרי הלימוד: הפוטוריזם,
    המניפסט מ-1913 "סטירה לטעם הציבורי", "ענן במכנסיים", כרזות המהפכה, התיאטרון, וההתאבדות ב-1930.


    גם לעיירה יש סיפור. השם בגדאטי הוא בעל שורש פרסי שמשמעו "מתת אל". ב-1940 שונה שמה למיאקובסקי, והיא
    נשאה אותו עד 1991, אז הוחזר השם ההיסטורי.


    המוזיאון הוקם בתקופה הסובייטית. זהו בית העץ על מרפסתו, ובו חללי ילדותו של המשורר, תצלומי משפחה, מהדורות
    ראשונות, כרזות אוונגרד וחפצים אישיים. התצוגה קטנה אך נבחרה בקפידה, והיא מכסה את החלק שמוזיאונים רוסיים
    נוטים לדלג עליו — הילדות הגאורגית.


    בגדאטי עצמה היא עיירה של כשלושת אלפים תושבים על החניסצקאלי, בשולי יער אג'אמטי. זו ארץ יין, ומכאן גם
    מתחיל הכביש העולה לסאירמה, כך שהמוזיאון משתלב יפה במסלול יומי.


    אם אתם מקדישים לפינה הזאת יום שלם, בגדאטי משמשת ציר. מצפון לעיירה יער האלונים של אג'אמטי; מדרום מטפס
    הכביש שלושים ק״מ בגיא מיוער אל מעיינות המינרלים בסאירמה; ממערב ואני וחפירותיה. בעיירה עצמה יש שוק,
    שני בתי קפה סביב הכיכר, ובדיוק אותה שלווה פרובינציאלית רגילה שמיאקובסקי צעק עליה כל חייו.
  tip: >-
    שעה מספיקה. השילוט בגאורגית וברוסית והאנגלית מועטה, אך אנשי הצוות בדרך כלל שמחים להסביר. הבית עשוי
    עץ, עם מדרגות צרות ורצפות חורקות; אין מעלית ואין רמפה. שאלו לפני צילום. יש שירותים בחצר, ובתי קפה
    במרכז העיירה חמש דקות משם. בחורף קר בבית והמבקרים מעטים, וזה אומר שהמוזיאון כולו שלכם.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז פנייה דרומה לכיוון בגדאטי — כ-215 ק״מ בסך הכול, שלוש שעות וחמש
    דקות. כל המסלול סלול; עשרים הקילומטרים מזסטפוני לבגדאטי הם כביש אזורי צר דרך יער אג'אמטי. המוזיאון
    במרכז העיירה ברחוב בגדאטי ומשולט. החניה ברחוב חינם. דלק יש בזסטפוני ובבגדאטי. רכב חסכוני מספיק.
ar:
  name: باغداتي — بيت متحف ماياكوفسكي
  short: مسقط رأس الشاعر فلاديمير ماياكوفسكي، في بلدة إيميريتية صغيرة على نهر خانيستسكالي.
  body: >-
    **وُلد أعلى شعراء الطليعة الروسية صوتاً في قرية إيميريتية.** وُلد فلاديمير ماياكوفسكي في باغداتي يوم
    19 يوليو 1893، حيث كان أبوه يعمل حارساً للغابات. كانت الأسرة تتحدث الروسية في البيت، لكن الصبي كان
    يتكلم الجورجية في الشارع والمدرسة. وكتب لاحقاً: «وُلدت في القوقاز، أبي قوزاقي وأمي أوكرانية، ولغتي
    الأم جورجية.»


    في 1906 مات أبوه فجأة من تسمم الدم فانتقلت الأسرة إلى موسكو. ومن هناك تبدأ السيرة التي في الكتب المدرسية:
    المستقبلية، وبيان 1913 «صفعة للذوق العام»، و«غيمة في بنطال»، وملصقات الثورة، والمسرح، ثم انتحاره عام
    1930.


    وللبلدة حكايتها. اسم باغداتي ذو أصل فارسي يعني «هبة الله». وفي 1940 أُعيدت تسميتها ماياكوفسكي، وظلت
    تحمل الاسم حتى 1991 حين أُعيد الشكل التاريخي.


    أُنشئ المتحف في العهد السوفييتي. وهو البيت الخشبي بشرفته، ويضم فضاءات طفولة الشاعر وصور العائلة والطبعات
    الأولى وملصقات الطليعة والمقتنيات الشخصية. العرض صغير لكنه منتقى بعناية، ويغطي الجزء الذي تتجاوزه
    المتاحف الروسية عادةً: الطفولة الجورجية.


    وباغداتي نفسها بلدة نحو ثلاثة آلاف نسمة على نهر خانيستسكالي عند حافة غابة أجاميتي. هذه أرض نبيذ، ومن
    هنا أيضاً يبدأ الطريق الصاعد إلى سايرمه، فيندرج المتحف بسلاسة في مسار يوم واحد.


    إن خصصت يوماً لهذه الزاوية فباغداتي هي المفصل. شمال البلدة غابة بلوط أجاميتي؛ وجنوباً يصعد الطريق
    ثلاثين كيلومتراً في وادٍ مشجر إلى ينابيع سايرمه المعدنية؛ وغرباً واني وحفرياتها. وفي البلدة نفسها
    سوق ومقهيان حول الساحة، وتماماً ذلك السكون الإقليمي العادي الذي أمضى ماياكوفسكي عمره يصرخ في وجهه.
  tip: >-
    ساعة تكفي. البطاقات بالجورجية والروسية والإنجليزية قليلة، غير أن الموظفين يسرّهم الشرح عادةً. البيت
    خشبي بدرج ضيق وأرضيات تئنّ؛ ولا مصعد ولا منحدر. اسأل قبل التصوير. توجد دورة مياه في الفناء، والمقاهي
    في وسط البلدة على بعد خمس دقائق. وفي الشتاء يبرد البيت ويقل الزوار، ما يعني أن المتحف كله لك.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم انعطف جنوباً نحو باغداتي — نحو 215 كم إجمالاً وثلاث ساعات
    وخمس دقائق. الطريق كله معبّد؛ والعشرون كيلومتراً بين زستافوني وباغداتي طريق إقليمي ضيق يمر بغابة أجاميتي.
    المتحف في وسط البلدة في شارع باغداتي وعليه لافتة. والوقوف في الشارع مجاني. الوقود متوفر في زستافوني
    وباغداتي. وتكفي سيارة اقتصادية.
