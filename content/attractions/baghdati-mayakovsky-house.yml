ka:
  name: ბაღდათი — მაიაკოვსკის სახლ-მუზეუმი
  short: >-
    მეტყევის ხის სახლი ბაღდათში, სადაც რუსული ავანგარდის ყველაზე ხმამაღალი პოეტი, ვლადიმერ მაიაკოვსკი
    დაიბადა და ქართულად ალაპარაკდა.
  body: >-
    **რუსული ავანგარდის ყველაზე ხმამაღალმა ხმამ ლაპარაკი ქართულად ისწავლა — ბაღდათში, მეტყევის სახლში.**
    ვლადიმერ მაიაკოვსკი აქ 1893 წლის 19 ივლისს დაიბადა. მამა ბაღდათის სატყეო მეურნეობაში მუშაობდა; ოჯახში
    რუსულად საუბრობდნენ, ბიჭი კი ქუჩასა და სკოლაში ქართულად ლაპარაკობდა. წლების შემდეგ თავად ასე აჯამებდა:
    კავკასიაში დავიბადე, მამა კაზაკია, დედა უკრაინელი, პირველი ენა კი ქართული მაქვს — ჩემში სამი კულტურაა
    შეერთებული.


    ქართული თავი ერთმა ქინძისთავმა დაასრულა. 1906 წელს მამამ ქაღალდების აკინძვისას თითი ჟანგიან ქინძისთავს
    გაიკაწრა და სისხლის მოწამვლით გარდაიცვალა, დედამ კი შვილები მოსკოვში წაიყვანა. შემდეგ ის ამბავია,
    რომელიც სახელმძღვანელოებშია: ფუტურიზმი, დიდი პოემები, რევოლუციის პლაკატები და 1930 წლის აპრილის რევოლვერის
    გასროლა.


    სახლი პოეტს გადაურჩა. 1940 წელს აქ მუზეუმი გაიხსნა — იმავე წელს დაბასაც მაიაკოვსკი დაერქვა და ეს სახელი
    1991 წლამდე შერჩა. ეს გრძელი ხის სახლია აგურის ბოძებზე, გადახურული აივნითა და თაღოვანი კარებით, ჩრდილიან
    პარკში. შიგნით ოჯახის ნივთები, ფოტოები, ადრეული გამოცემები და დოკუმენტებია, და ზოგიერთი მათგანი შინ
    შემოვლითი გზით დაბრუნდა: ბაღდათიდან წასვლამდე დედამ ოჯახის ავლადიდების უმეტესი ნაწილი გაყიდა, წლების
    შემდეგ კი დაბრუნდა და ნაწილი უკან გამოისყიდა. ზოგი სამუდამოდ დაიკარგა — 1990-იან წლებში მუზეუმი გაძარცვეს
    და სხვა ნივთებთან ერთად პატეფონი და ფოტოაპარატიც გაიტაცეს. 2018 წელს, პოეტის დაბადების 125 წლისთავზე,
    სახლი განაახლეს.


    დღეს ბაღდათი დაახლოებით ორნახევარი ათასი მოსახლის მშვიდი დაბაა საირმისკენ მიმავალ გზაზე. ეს სწორედ
    ის პროვინციული სიმშვიდეა, რომელსაც მაიაკოვსკი მთელი ცხოვრება ხმამაღლა ეპაექრებოდა — და, მისივე თქმით,
    ადგილი, საიდანაც მისი პირველი ენა მოდის.
  tip: >-
    ერთი საათი საკმარისია. შესვლა დაახლოებით 5 ლარი ღირს. წარწერები ძირითადად ქართულად და რუსულადაა, თუმცა
    თანამშრომლები, თუ სთხოვთ, ოთახებს ხშირად თავად გაგატარებენ. აივანზე ციცაბო ხის კიბე ადის, პანდუსი
    არ არის. შიგნით ფოტოს გადაღებამდე ნებართვა ითხოვეთ. იმავე მუზეუმში ბაღდათის ისტორიულ-ეთნოგრაფიული
    კოლექციაცაა — ათი წუთი მასაც დაუთმეთ. სახლის გარშემო პარკი ზაფხულში გრილი დასასვენებელია; კაფეები
    დაბის ცენტრშია, მანქანით რამდენიმე წუთში ჩრდილოეთით. ზამთარში ოთახები ცივია და მუზეუმი შეიძლება მხოლოდ
    თქვენი იყოს.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთისკენ ზესტაფონამდე, დაახლოებით 185 კმ, შემდეგ სამხრეთით, შ54-ზე გადაუხვიეთ
    და ბაღდათამდე კიდევ ოციოდე კილომეტრი გაიარეთ — სულ დაახლოებით 215 კმ და სამი საათი და ხუთი წუთი. შ54
    ვიწრო, მაგრამ ასფალტიანი რეგიონული გზაა. ბაღდათში მთავარ ქუჩას სამხრეთისკენ გაჰყევით: მუზეუმი დაბის
    სამხრეთ კიდეზე, ბაღდათის ქუჩაზეა, იქ, სადაც გზა საირმისკენ იწყებს აღმართს. ქუჩაში პარკირება უფასოა.
    საწვავი ზესტაფონში ან ბაღდათში ჩაასხით. ეკონომ-კლასის მანქანა ნებისმიერ სეზონზე საკმარისია.
en:
  name: Baghdati — Mayakovsky House-Museum
  short: >-
    The forester’s house in Baghdati where Vladimir Mayakovsky, the loudest poet of the Russian avant-garde,
    was born and learned Georgian.
  body: >-
    **The loudest voice of the Russian avant-garde learned to talk in Georgian, in a forester’s house
    in Baghdati.** Vladimir Mayakovsky was born here on 19 July 1893. His father worked for the local
    forestry; the family spoke Russian at home, while the boy spoke Georgian in the street and at school.
    Years later he summed himself up: born in the Caucasus, a Cossack father, a Ukrainian mother, and
    “my first language is Georgian” — three cultures in one man.


    The Georgian chapter ended with a pin. In 1906 his father pricked his finger on a rusty one while
    filing papers and died of blood poisoning, and his mother took the children to Moscow. What followed
    is the textbook story: Futurism, the great long poems, the posters for the revolution, and the revolver
    shot of April 1930.


    The house outlived him. It opened as a museum in 1940, the same year the town itself was renamed Mayakovsky,
    a name it kept until 1991. It is a long timber house raised on brick piers, with a covered veranda
    and arched doors, set in a shady park. Inside are family belongings, photographs, early editions and
    papers, and some of them came home by a roundabout road. Before leaving, his mother sold most of the
    household; she came back years later and bought part of it back. Other pieces were lost for good when
    the museum was looted in the 1990s, a portable gramophone and a camera among them. For the poet’s
    125th birthday in 2018 the house was restored.


    Baghdati today is a quiet town of some 2,500 people on the road south to Sairme. It is exactly the
    provincial calm Mayakovsky spent his life shouting at, and, by his own account, the place his first
    language came from.
  tip: >-
    An hour is plenty. Entry is around 5 GEL. Labels are mostly in Georgian and Russian, but staff will
    often talk you through the rooms if you ask. A steep wooden stair leads up to the veranda and there
    is no ramp. Ask before photographing inside. The same museum also keeps Baghdati’s local history and
    ethnography collection, worth ten extra minutes. The park around the house is a cool place to sit
    in summer; cafés are in the town centre, a short drive north. In winter the rooms are cold and you
    may have the place to yourself.
  route: >-
    Take the E60 (S1) west from Tbilisi to Zestaponi, about 185 km, then turn south onto the Sh54 for
    the last twenty-odd kilometres to Baghdati: some 215 km and three hours five in all. The Sh54 is a
    narrow but paved regional road. In Baghdati follow the main street south; the museum is on Baghdati
    Street at the southern edge of town, where the road begins its climb towards Sairme. Street parking
    is free. Fuel in Zestaponi or Baghdati. An economy car is all you need, in any season.
ru:
  name: Багдати — Дом-музей Маяковского
  short: >-
    Дом лесничего в Багдати, где родился и выучил грузинский язык Владимир Маяковский, самый громкий поэт
    русского авангарда.
  body: >-
    **Самый громкий голос русского авангарда научился говорить по-грузински в доме лесничего в Багдати.**
    Владимир Маяковский родился здесь 19 июля 1893 года. Его отец служил в местном лесничестве; дома говорили
    по-русски, а мальчик говорил по-грузински — на улице и в школе. Спустя годы он сам подытожил: родился
    на Кавказе, отец — казак, мать — украинка, «первый язык — грузинский. Так сказать, между тремя культурами».


    Грузинская глава завершилась булавкой. В 1906 году отец укололся ржавой булавкой, подшивая бумаги,
    умер от заражения крови, и мать увезла детей в Москву. Дальше — история из учебника: футуризм, большие
    поэмы, плакаты революции и выстрел из револьвера в апреле 1930 года.


    Дом пережил его. Он открылся как музей в 1940 году — в тот же год, когда сам город переименовали в
    Маяковский; это имя он носил до 1991 года. Это длинный деревянный дом на кирпичных столбах, с крытой
    верандой и арочными дверями, стоящий в тенистом парке. Внутри — семейные вещи, фотографии, ранние
    издания и бумаги, причём часть их вернулась домой окольным путём. Перед отъездом мать продала почти
    всё имущество; спустя годы она вернулась и выкупила часть обратно. Другие вещи были утрачены навсегда,
    когда музей ограбили в 1990-е годы — среди пропавшего патефон и фотоаппарат. К 125-летию поэта в 2018
    году дом отреставрировали.


    Багдати сегодня — тихий городок примерно на 2500 жителей на дороге, ведущей на юг, к Саирме. Это в
    точности та провинциальная тишина, на которую Маяковский всю жизнь кричал, и, по его собственным словам,
    именно отсюда пришёл его первый язык.
  tip: >-
    Часа вполне достаточно. Вход — около 5 лари. Подписи в основном на грузинском и русском, но сотрудники
    часто проводят экскурсию по комнатам, если попросить. Крутая деревянная лестница ведёт на веранду,
    пандуса нет. Спрашивайте разрешения перед съёмкой внутри. В том же музее хранится краеведческая и
    этнографическая коллекция Багдати — стоит уделить ей лишние десять минут. Парк вокруг дома летом —
    прохладное место для отдыха; кафе — в центре города, в нескольких минутах езды к северу. Зимой в комнатах
    холодно, и, возможно, вы будете там одни.
  route: >-
    Двигайтесь по трассе E60 (S1) на запад от Тбилиси до Зестафони, около 185 км, затем сверните на юг
    на дорогу Ш54 и проезжайте последние двадцать с лишним километров до Багдати: всего около 215 км и
    три часа пять минут. Ш54 — узкая, но асфальтированная региональная дорога. В Багдати следуйте по главной
    улице на юг; музей — на улице Багдати, на южной окраине города, там, где дорога начинает подниматься
    в сторону Саирме. Уличная парковка бесплатна. Заправляйтесь в Зестафони или Багдати. Подойдёт автомобиль
    эконом-класса, в любое время года.
fa:
  name: باغداتی — موزه‌خانه مایاکوفسکی
  short: خانهٔ جنگل‌بان در باغداتی، جایی که ولادیمیر مایاکوفسکی، پرصداترین شاعر آوانگارد روسیه، زاده شد
    و گرجی آموخت.
  body: >-
    **پرصداترین آوای آوانگارد روسیه، در خانهٔ یک جنگل‌بان در باغداتی، زبان گرجی را آموخت.** ولادیمیر مایاکوفسکی
    در ۱۹ ژوئیه ۱۸۹۳ در همین‌جا زاده شد. پدرش برای اداره جنگل‌بانی محلی کار می‌کرد؛ در خانه به روسی سخن
    می‌گفتند، اما پسرک در خیابان و مدرسه گرجی حرف می‌زد. سال‌ها بعد او خود را چنین خلاصه کرد: زاده قفقاز،
    پدری قزاق، مادری اوکراینی، و «نخستین زبانم گرجی است» — سه فرهنگ در یک انسان.


    فصل گرجی با سنجاقی به پایان رسید. در سال ۱۹۰۶ پدرش هنگام بایگانی کاغذها انگشتش را با سنجاقی زنگ‌زده
    خراش داد و از عفونت خون درگذشت، و مادرش فرزندان را به مسکو برد. آنچه پس از آن آمد، داستانی است که
    در کتاب‌های درسی می‌خوانیم: فوتوریسم، منظومه‌های بزرگ، پوسترهای انقلاب، و صدای شلیک رولوری در آوریل
    ۱۹۳۰.


    خانه از او دیرتر زیست. در سال ۱۹۴۰ به‌عنوان موزه گشوده شد، همان سالی که خودِ شهر نیز به نام «مایاکوفسکی»
    تغییر یافت، نامی که تا سال ۱۹۹۱ بر خود داشت. این خانه‌ای چوبی و کشیده است بر پایه‌های آجری، با ایوانی
    سرپوشیده و درهایی طاق‌دار، در باغی سایه‌دار. درونش وسایل خانوادگی، عکس‌ها، چاپ‌های نخستین و کاغذها
    نگه‌داری می‌شوند، و برخی از آن‌ها از راهی پرپیچ به خانه بازگشته‌اند. مادرش پیش از رفتن بیشتر لوازم
    خانه را فروخت؛ سال‌ها بعد بازگشت و بخشی از آن را دوباره خرید. اشیای دیگر برای همیشه از دست رفتند،
    آن‌گاه که موزه در دهه ۱۹۹۰ به غارت رفت، از جمله گرامافونی قابل‌حمل و دوربینی عکاسی. برای صدوبیست‌وپنجمین
    سالگرد تولد شاعر در سال ۲۰۱۸، خانه بازسازی شد.


    باغداتی امروز شهری آرام است با نزدیک به ۲۵۰۰ تن جمعیت، بر جاده‌ای که به سوی جنوب، به سایرمه، می‌رود.
    این دقیقاً همان آرامش شهرستانی است که مایاکوفسکی تمام زندگی‌اش را بر سرش فریاد کشید، و به گفته خودش،
    همان‌جایی است که زبان نخستینش از آن برخاست.
  tip: >-
    یک ساعت زمان کافی است. ورودیه نزدیک ۵ لاری است. برچسب‌ها بیشتر به گرجی و روسی‌اند، اما کارکنان اغلب
    اگر بخواهید، شما را در اتاق‌ها همراهی می‌کنند. پله‌ای چوبی و پرشیب به ایوان می‌رسد و سطح شیب‌داری
    وجود ندارد. پیش از عکاسی درون، اجازه بگیرید. همین موزه مجموعه تاریخ محلی و مردم‌شناسی باغداتی را نیز
    نگه می‌دارد، که ارزش ده دقیقه وقت اضافه را دارد. باغ پیرامون خانه در تابستان جای خنکی برای نشستن است؛
    کافه‌ها در مرکز شهر، رانندگی کوتاهی به سوی شمال، قرار دارند. در زمستان اتاق‌ها سردند و شاید تنها بازدیدکننده
    باشید.
  route: >-
    از تفلیس بر جاده E60 (S1) به سوی غرب تا زستافونی حرکت کنید، حدود ۱۸۵ کیلومتر، سپس به سوی جنوب بر جاده
    Sh54 بپیچید برای بیست‌وچند کیلومتر پایانی تا باغداتی: در مجموع حدود ۲۱۵ کیلومتر و سه ساعت و پنج دقیقه.
    Sh54 جاده‌ای منطقه‌ای و باریک اما آسفالته است. در باغداتی خیابان اصلی را به سوی جنوب دنبال کنید؛ موزه
    در خیابان باغداتی، در کناره جنوبی شهر، جایی که جاده صعود خود را به سوی سایرمه آغاز می‌کند، قرار دارد.
    پارک خیابانی رایگان است. در زستافونی یا باغداتی سوخت‌گیری کنید. خودرویی اقتصادی در هر فصل کافی است.
he:
  name: באגדאתי — בית-מוזיאון מיאקובסקי
  short: בית היערן בבאגדאתי, שבו נולד ולדימיר מיאקובסקי, הקול הרועם ביותר של האוונגרד הרוסי, ולמד גיאורגית.
  body: >-
    **הקול הרועם ביותר של האוונגרד הרוסי למד לדבר גיאורגית, בבית יערן בבאגדאתי.** ולדימיר מיאקובסקי נולד
    כאן ב-19 ביולי 1893. אביו עבד ביערנות המקומית; בבית דיברו רוסית, ואילו הילד דיבר גיאורגית ברחוב ובבית
    הספר. שנים לאחר מכן סיכם את עצמו: נולד בקווקז, אב קוזאק, אם אוקראינית, ו'שפתי הראשונה היא גיאורגית'
    — שלוש תרבויות באדם אחד.


    הפרק הגיאורגי הסתיים בסיכת ראש. ב-1906 דקר אביו את אצבעו בסיכה חלודה בשעת סידור מסמכים, ומת מהרעלת
    דם, ואמו לקחה את הילדים למוסקבה. מה שקרה אחר כך הוא סיפור לספר לימוד: פוטוריזם, הפואמות הגדולות, כרזות
    המהפכה, ויריית האקדח באפריל 1930.


    הבית האריך ימים יותר ממנו. הוא נפתח כמוזיאון ב-1940, אותה שנה שבה שונה שם העיר עצמה למיאקובסקי, שם
    שנשא עד 1991. זהו בית עץ מוארך, בנוי על עמודי לבנים, עם מרפסת מקורה ודלתות מקושתות, בתוך פארק מוצלל.
    בפנים חפצי המשפחה, תצלומים, מהדורות ראשונות ומסמכים, וחלקם חזרו הביתה בדרך עקלקלה. לפני שעזבה מכרה
    אמו את רוב תוכן הבית; שנים לאחר מכן חזרה וקנתה חלק ממנו בחזרה. חפצים אחרים אבדו לתמיד כשהמוזיאון נשדד
    בשנות ה-90, בהם פטפון נייד ומצלמה. לרגל יום הולדתו ה-125 של המשורר ב-2018 שוחזר הבית.


    באגדאתי כיום היא עיר שלווה של כ-2,500 תושבים על הדרך הדרומית לסאירמה. זו בדיוק אותה שלווה פרובינציאלית
    שעליה צעק מיאקובסקי במשך כל חייו, ולדבריו שלו, המקום שממנו הגיעה שפתו הראשונה.
  tip: >-
    שעה מספיקה בהחלט. הכניסה כ-5 לארי. השילוט הוא בעיקר בגיאורגית וברוסית, אך הצוות מוכן לרוב להדריך אתכם
    בחדרים אם תבקשו. מדרגות עץ תלולות מובילות למרפסת ואין רמפה. בקשו רשות לפני צילום בפנים. אותו מוזיאון
    מחזיק גם באוסף ההיסטוריה המקומית והאתנוגרפיה של באגדאתי, ששווה עשר דקות נוספות. הפארק שמסביב לבית
    הוא מקום צונן לשבת בו בקיץ; בתי הקפה נמצאים במרכז העיר, נסיעה קצרה צפונה. בחורף החדרים קרים, וייתכן
    שהמקום יהיה כולו לרשותכם.
  route: >-
    נסעו בכביש E60 (S1) מטביליסי מערבה עד זסטפוני, כ-185 ק"מ, ואז פנו דרומה לכביש Sh54 לעשרים וכמה הקילומטרים
    האחרונים עד באגדאתי: בסך הכול כ-215 ק"מ ושלוש שעות וחמש דקות. Sh54 הוא כביש אזורי צר אך סלול. בבאגדאתי
    המשיכו ברחוב הראשי דרומה; המוזיאון נמצא ברחוב באגדאתי, בקצה הדרומי של העיר, במקום שבו הכביש מתחיל
    לעלות לעבר סאירמה. חנייה ברחוב חינם. תדלקו בזסטפוני או בבאגדאתי. מספיק רכב אקונומי, בכל עונה.
ar:
  name: باغداتي — بيت متحف ماياكوفسكي
  short: بيت الحَراجيّ في باغداتي، حيث وُلد فلاديمير ماياكوفسكي، أعلى صوت في الطليعة الروسية، وتعلّم الجورجية.
  body: >-
    **أعلى صوت في الطليعة الروسية تعلّم الكلام بالجورجية، في بيت حَراجيّ في باغداتي.** وُلد فلاديمير ماياكوفسكي
    هنا في 19 يوليو 1893. عمل والده في إدارة الغابات المحلية؛ وكانت الأسرة تتحدث الروسية في البيت، بينما
    تحدّث الصبيّ الجورجية في الشارع والمدرسة. لخّص نفسه بعد سنوات: وُلد في القوقاز، وأبوه قوزاقي، وأمّه
    أوكرانية، و«لغتي الأولى هي الجورجية» — ثلاث ثقافات في رجل واحد.


    انتهى الفصل الجورجي بدبّوس. في عام 1906 وخز والده إصبعه بدبّوس صدئ وهو يرتّب أوراقه، فمات بتسمّم الدم،
    وحملت أمه الأولاد إلى موسكو. وما تلا ذلك قصة يعرفها كل كتاب مدرسي: المستقبلية، والقصائد الطويلة الكبرى،
    وملصقات الثورة، وطلقة المسدس في أبريل 1930.


    عاش البيت أطول منه. افتُتح متحفًا عام 1940، وهي السنة نفسها التي أُطلق فيها على البلدة اسم ماياكوفسكي،
    اسمٌ ظلّ يحمله حتى عام 1991. إنه بيت خشبي طويل مرفوع على دعامات من الآجر، بشرفة مسقوفة وأبواب مقنطرة،
    وسط حديقة ظليلة. وفي داخله مقتنيات الأسرة والصور والطبعات الأولى والأوراق، وقد عاد بعضها إلى المنزل
    بطريق ملتوٍّ. فقد باعت أمه معظم متاع البيت قبل رحيلها، ثم عادت بعد سنوات واشترت جزءًا منه من جديد.
    وضاعت مقتنيات أخرى إلى الأبد حين نُهب المتحف في التسعينيات، ومن بينها فونوغراف محمول وكاميرا. وقد
    رُمّم البيت بمناسبة الذكرى الـ125 لميلاد الشاعر عام 2018.


    باغداتي اليوم بلدة هادئة يقطنها نحو 2500 نسمة على الطريق الجنوبي المتجه إلى سايرمي. وهي بالضبط ذلك
    الهدوء الريفي الذي صرخ ماياكوفسكي في وجهه طوال حياته، وهي كذلك، بحسب روايته، المكان الذي جاءت منه
    لغته الأولى.
  tip: >-
    تكفي ساعة واحدة. رسم الدخول نحو 5 لاري. اللافتات بالجورجية والروسية غالبًا، لكن الموظفين كثيرًا ما
    يرشدونك في الغرف إذا طلبت ذلك. يصعد درج خشبي شديد الانحدار إلى الشرفة ولا يوجد منحدر للعجلات. اطلب
    الإذن قبل التصوير في الداخل. يحتفظ المتحف نفسه أيضًا بمجموعة التاريخ المحلي والإثنوغرافيا لباغداتي،
    وهي تستحق عشر دقائق إضافية. الحديقة المحيطة بالبيت مكان منعش للجلوس في الصيف؛ وتوجد المقاهي في وسط
    البلدة على مسافة قصيرة بالسيارة شمالًا. في الشتاء تكون الغرف باردة وقد تجد المكان لك وحدك.
  route: >-
    اتبع الطريق E60 (S1) غربًا من تبليسي حتى زيستافوني، نحو 185 كم، ثم انحرف جنوبًا إلى طريق Sh54 لقطع
    العشرين كيلومترًا ونيّفًا الأخيرة حتى باغداتي: نحو 215 كم وثلاث ساعات وخمس دقائق في المجموع. طريق
    Sh54 إقليمي ضيّق لكنه معبّد. في باغداتي اتبع الشارع الرئيسي جنوبًا؛ يقع المتحف في شارع باغداتي عند
    الحافة الجنوبية للبلدة، حيث يبدأ الطريق صعوده نحو سايرمي. مواقف الشارع مجانية. تزوّد بالوقود في زيستافوني
    أو باغداتي. تكفي سيارة اقتصادية في أي فصل.
