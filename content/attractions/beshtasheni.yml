ka:
  name: ბეშთაშენი
  short: >-
    პონტოელ ბერძენთა სოფელი ტრიალეთის ზეგანზე, ანატოლიური „ხუთი ქვის“ სახელით — და იქვე, ბრინჯაოს ხანის
    კიკლოპური ნასახლარი და სამაროვანი.
  body: >-
    **ბეშთაშენის სახელი, დაახლოებით, „ხუთი ქვის სოფელს“ ნიშნავს — ის აქ ტრაპიზონის ზურგს უკან აზიდული
    მთებიდან ჩამოიტანეს.**


    სოფლის ამბავს ასე ჰყვებიან: პირველი მოსახლეები ბერძნულენოვანი ოჯახები იყვნენ არგირუპოლისიდან (დღევანდელი
    გიუმიუშხანე), მადენიდან და მიმდებარე სოფლებიდან — ოსმალეთის ტრაპიზონის მხრიდან. გზას გვიან შემოდგომით
    დაადგნენ, ზამთრამდე დანიშნულ ადგილს ვერ მიაღწიეს და ქვემო წინწყაროში დაიზამთრეს, სადაც მათმა ბავშვებმა
    ადგილობრივი ბერძნებისგან თურქული ისწავლეს. 1830 წლის გაზაფხულზე წალკის მხარეში დასახლდნენ და ცხარე
    კამათის შემდეგ სოფელს ბეშთაშის სახელი დაარქვეს. ასე ერქვა მოსულთა ერთი მცირე ჯგუფის მშობლიურ სოფელს;
    ეს ბერძნული პენდე პეტრას, „ხუთი ქვის“, თურქული ფორმაა.


    ტრიალეთის ბალახოვანი ზეგანი ბერძნებს, რომლებიც რუსეთ-თურქეთის ომების შემდეგ ოსმალთა შურისძიებას გაურბოდნენ,
    მიტოვებულ პონტოს მთებს აგონებდა. მათ შთამომავლებს წალკელ ურუმებს უწოდებენ. 2014 წლის აღწერით სოფელში
    335 მოსახლე ცხოვრობდა; ბერძნებს დღეს აქ ქართველი და აზერბაიჯანელი მეზობლებიც ჰყავთ.


    ქვები კი სახელზე გაცილებით ძველია. სოფლის ახლოს ბეშთაშენის კიკლოპური ნასახლარია — გორაკზე გაშენებული
    გამაგრებული დასახლება, ნაგები უზარმაზარი ლოდებით, როგორც სამხრეთ კავკასიის ბრინჯაოს ხანის სიმაგრეები.
    მისგან დაახლოებით 300 მეტრში, სოფლის ჩრდილო-დასავლეთით, შუა ხარაბისკენ მიმავალი გზის პირას, გერიაკ-ჩაის
    მარჯვენა ნაპირზე, არქეოლოგებმა დიმიტრი ნარიმანიშვილმა და რევაზ ვარაჩქორიამ 2015–2016 წლებში გვიანბრინჯაო–ადრერკინის
    ხანის სამაროვანი გათხარეს.


    მუზეუმს ნუ ელით: ეს ცოცხალი სოფელია 1500 მეტრზე — ვრცელი საძოვრები, ხეებში ჩამალული დაბალი სახურავები
    და შორს მოლივლივე წყლის ზოლი. ახალმოსახლეებმა „ხუთი ქვა“ თან მოიტანეს; ზეგანი კი, თურმე, საკუთარი
    ქვებით ელოდათ.
  tip: >-
    ბეშთაშენი ცოცხალი სოფელია და არა ბილეთიანი ძეგლი: მაჩვენებლებს, საინფორმაციო დაფებს ან ტურისტულ ინფრასტრუქტურას
    ნუ ელით. სამაროვანი სოფლის ჩრდილო-დასავლეთით, შუა ხარაბისკენ მიმავალ გზაზეა; მინდორში შესვლამდე ადგილობრივებს
    თავაზიანად ჰკითხეთ — საძოვრები კერძოა. 1500 მეტრზე საღამოები აგვისტოშიც გრილია, ზამთარი კი გრძელი
    და თოვლიანი. საწვავი, მაღაზია და სადილი — წალკაში. ერთი საათი საკმარისია; დღე წალკის წყალსაცავით,
    დაშბაშის კანიონითა და ტრიალეთის ლუთერანული ეკლესიით შეავსეთ — სამივე ახლოსაა.
  route: >-
    თბილისიდან წყნეთის გზით ამოდით, შ36-ით მანგლისისკენ გაემართეთ, შემდეგ კი შ31-ით ტრიალეთის ზეგანი წალკის
    მიმართულებით გადაკვეთეთ. წალკამდე რამდენიმე კილომეტრით ადრე ბეშთაშენის გადასახვევზე გადაუხვიეთ — სოფელი
    მთავარი გზიდან დაახლოებით 3 კილომეტრშია. სულ დაახლოებით 89 კილომეტრი და 1 საათი და 40 წუთი, ბოლომდე
    ასფალტით, ამიტომ ეკონომკლასის მანქანა საკმარისია. ზამთარში მანგლისსა და წალკას შორის გზა შეიძლება
    მოყინული იყოს — საზამთრო საბურავები აუცილებელია. უახლოესი საწვავი წალკაშია.
en:
  name: Beshtasheni
  short: >-
    A Pontic Greek village on the Trialeti plateau, named after 'Five Stones' in Anatolia, beside a Bronze
    Age cyclopean settlement and cemetery.
  body: >-
    **Beshtasheni means, roughly, "the village of Five Stones" — a name carried here from the mountains
    behind Trebizond.**


    The village tells its founding like this. The first settlers were Greek-speaking families from Argyroupolis
    (today's Gümüşhane), Maden and the villages around them, in the Ottoman province of Trebizond. They
    set out in late autumn, failed to reach their allotted land before winter and sat it out in Lower
    Tsintskaro, where their children picked up Turkish from the local Greeks. In the spring of 1830 they
    settled on the Tsalka plateau and, after a heated argument, named the village after Beshtash — the
    home of just one small group among them, and the Turkish form of the Greek Pende Petra, "Five Stones".


    To Greeks fleeing Ottoman reprisals after the Russo-Turkish wars, Trialeti's high grassland recalled
    the Pontic Alps they had left. Their descendants are known as the Tsalka Urums. The 2014 census counted
    335 people here; today the Greeks share the village with Georgian and Azerbaijani neighbours.


    The stones are far older than the name. Beside the village lies the Beshtasheni cyclopean settlement,
    a fortified hilltop built of huge blocks in the manner of Bronze Age strongholds across the South
    Caucasus. About 300 metres away, north-west of the village along the road to Shua Kharaba, on the
    right bank of the Geriak-Chai, archaeologists Dimitri Narimanishvili and Revaz Varachkoria excavated
    a Late Bronze–Early Iron Age cemetery in 2015–2016.


    Do not expect a museum. This is a working village at 1,500 metres: wide pasture, low roofs among trees,
    a strip of water shining in the distance. The settlers brought their Five Stones with them; the plateau,
    it turned out, had been waiting with stones of its own.
  tip: >-
    Beshtasheni is a living village, not a ticketed site, so do not count on signposts, information panels
    or visitor facilities. The excavated cemetery lies north-west of the village on the road to Shua Kharaba;
    ask locals politely before crossing fields, which are private pasture. At 1,500 metres evenings are
    cool even in August, and winters are long and snowy. Fuel, shops and a meal are in Tsalka. An hour
    is plenty; fill the day with the Tsalka Reservoir, Dashbashi Canyon and the Trialeti Lutheran church,
    all close by.
  route: >-
    From Tbilisi climb out through Tskneti, take the Sh36 to Manglisi, then the Sh31 west across the Trialeti
    plateau towards Tsalka. A few kilometres short of Tsalka, turn off for Beshtasheni; the village is
    about 3 km from the main road. In all it is about 89 km and 1 hour 40 minutes, paved throughout, so
    an economy car is fine. In winter the Manglisi–Tsalka stretch can ice over, and winter tyres are essential.
    The nearest fuel is in Tsalka.
ru:
  name: Бешташени
  short: >-
    Понтийско-греческое село на плато Триалети, названное в честь анатолийских «Пяти Камней», рядом с
    циклопическим поселением и могильником бронзового века.
  body: >-
    **Бешташени значит примерно «село Пяти Камней» — это имя принесли сюда с гор за Трапезундом.**


    Историю своего основания в селе рассказывают так. Первыми поселенцами были грекоязычные семьи из Аргируполиса
    (нынешнего Гюмюшхане), Мадена и окрестных деревень — в Трапезундской провинции Османской империи.
    Они двинулись в путь поздней осенью, не успели до зимы добраться до отведённых им земель и перезимовали
    в Нижнем Цинцкаро, где их дети переняли у местных греков турецкий язык. Весной 1830 года они осели
    на Цалкском плато и после жаркого спора назвали село по Бешташу — родине лишь одной небольшой группы
    из них; Бешташ — турецкая форма греческого Пенде Петра, «Пять Камней».


    Грекам, бежавшим от османских расправ после русско-турецких войн, высокогорные луга Триалети напоминали
    оставленные Понтийские горы. Их потомков называют цалкинскими урумами. Перепись 2014 года насчитала
    здесь 335 человек; сегодня греки живут в селе бок о бок с грузинскими и азербайджанскими соседями.


    Камни намного старше имени. Рядом с селом лежит Бешташенское циклопическое поселение — укреплённая
    вершина холма, сложенная из огромных глыб, как крепости бронзового века по всему Южному Кавказу. Примерно
    в 300 метрах от него, к северо-западу от села, по дороге на Шуа-Харабу, на правом берегу Герияк-Чая,
    археологи Димитрий Нариманишвили и Реваз Варачкория в 2015–2016 годах раскопали могильник эпохи поздней
    бронзы — раннего железа.


    Не ждите музея. Это живое село на высоте 1500 метров: широкие пастбища, низкие крыши среди деревьев,
    полоска воды, блестящая вдали. Переселенцы принесли свои Пять Камней с собой; оказалось, что плато
    давно ждало их со своими камнями.
  tip: >-
    Бешташени — живое село, а не объект с билетами, так что не рассчитывайте на указатели, информационные
    стенды или удобства для туристов. Раскопанный могильник лежит к северо-западу от села, на дороге в
    Шуа-Харабу; прежде чем идти через поля — это частные пастбища, — вежливо спросите местных. На высоте
    1500 метров вечера прохладные даже в августе, а зимы долгие и снежные. Топливо, магазины и обед —
    в Цалке. Часа хватит с лихвой; остаток дня заполните Цалкским водохранилищем, каньоном Дашбаши и лютеранской
    церковью в Триалети — всё это рядом.
  route: >-
    Из Тбилиси поднимитесь через Цкнети, по Sh36 доезжайте до Манглиси, затем по Sh31 на запад через плато
    Триалети в сторону Цалки. За несколько километров до Цалки сверните на Бешташени; село примерно в
    3 км от главной дороги. Всего около 89 км и 1 час 40 минут, асфальт на всём пути, так что подойдёт
    машина эконом-класса. Зимой участок Манглиси — Цалка может обледенеть, и зимняя резина обязательна.
    Ближайшая заправка — в Цалке.
fa:
  name: بشتاشنی
  short: >-
    روستایی از یونانیان پونتی بر فلات تریالتی، به نام «پنج سنگ» در آناتولی، در کنار سکونتگاهی سیکلوپی
    و گورستانی از عصر مفرغ.
  body: >-
    **بشتاشنی کم‌وبیش به معنای «روستای پنج سنگ» است؛ نامی که از کوهستان‌های پشت ترابوزان به اینجا آورده
    شد.**


    روستا داستان بنیادش را چنین بازمی‌گوید. نخستین ساکنان، خانواده‌هایی یونانی‌زبان از آرگیروپولیس (گوموش‌خانهٔ
    امروزی)، مادن و روستاهای پیرامون آن‌ها در ایالت ترابوزانِ عثمانی بودند. آنان اواخر پاییز به راه افتادند،
    نتوانستند پیش از زمستان به زمین‌هایی که برایشان تعیین شده بود برسند و زمستان را در تسینتسکاروی سفلی
    گذراندند؛ جایی که فرزندانشان ترکی را از یونانیان محلی آموختند. در بهار ۱۸۳۰ بر فلات تسالکا ساکن شدند
    و پس از بحثی داغ، روستا را به نام بشتاش خواندند — زادگاه تنها گروه کوچکی از میانشان، و صورت ترکیِ
    نام یونانی پنده پترا، یعنی «پنج سنگ».


    برای یونانیانی که پس از جنگ‌های روس و عثمانی از انتقام‌جویی عثمانی‌ها می‌گریختند، علفزارهای بلند تریالتی
    یادآور کوه‌های پونتی بود که پشت سر گذاشته بودند. نوادگانشان به نام اوروم‌های تسالکا شناخته می‌شوند.
    سرشماری ۲۰۱۴ در اینجا ۳۳۵ نفر را ثبت کرد؛ امروز یونانیان روستا را با همسایگان گرجی و آذربایجانی شریک‌اند.


    سنگ‌ها بسیار کهن‌تر از نام‌اند. کنار روستا سکونتگاه سیکلوپی بشتاشنی قرار دارد: تپه‌ای حصاربندی‌شده
    که با تخته‌سنگ‌های غول‌آسا ساخته شده، به شیوهٔ دژهای عصر مفرغ در سراسر قفقاز جنوبی. حدود ۳۰۰ متر دورتر،
    در شمال‌غربی روستا و در امتداد جادهٔ شوآ خارابا، بر کرانهٔ راست گریاک‌چای، باستان‌شناسان دیمیتری نریمانیشویلی
    و رواز واراچکوریا در سال‌های ۲۰۱۵ تا ۲۰۱۶ گورستانی از اواخر عصر مفرغ و اوایل عصر آهن را کاوش کردند.


    موزه‌ای در انتظارتان نیست. اینجا روستایی زنده در ارتفاع ۱۵۰۰ متری است: چراگاه‌های پهناور، بام‌های
    کوتاه میان درختان، نواری از آب که در دوردست می‌درخشد. مهاجران پنج سنگشان را با خود آوردند؛ اما معلوم
    شد فلات با سنگ‌های خودش چشم‌به‌راهشان بوده است.
  tip: >-
    بشتاشنی روستایی زنده است، نه مکانی با بلیت، پس روی تابلوی راهنما، تابلوی اطلاعات یا امکانات گردشگری
    حساب نکنید. گورستانِ کاوش‌شده در شمال‌غربی روستا و بر سر جادهٔ شوآ خارابا است؛ پیش از گذشتن از کشتزارها،
    که چراگاه خصوصی‌اند، مؤدبانه از اهالی اجازه بگیرید. در ارتفاع ۱۵۰۰ متری حتی در اوت شامگاهان خنک است
    و زمستان‌ها طولانی و پربرف. سوخت، مغازه و غذا در تسالکا پیدا می‌شود. یک ساعت بس است؛ باقی روز را با
    مخزن تسالکا، درهٔ داشباشی و کلیسای لوتری تریالتی پر کنید که همه نزدیک‌اند.
  route: >-
    از تفلیس از راه تسکنتی بالا بروید، از Sh36 تا مانگلیسی و سپس از Sh31 به سمت غرب از میان فلات تریالتی
    به سوی تسالکا بروید. چند کیلومتر پیش از تسالکا به سمت بشتاشنی بپیچید؛ روستا حدود ۳ کیلومتر با جادهٔ
    اصلی فاصله دارد. روی هم حدود ۸۹ کیلومتر و ۱ ساعت و ۴۰ دقیقه راه است، سراسر آسفالت، پس خودروی اقتصادی
    کافی است. در زمستان بخش مانگلیسی–تسالکا ممکن است یخ بزند و لاستیک زمستانی ضروری است. نزدیک‌ترین پمپ‌بنزین
    در تسالکاست.
he:
  name: בשתאשני
  short: >-
    כפר של יוונים פונטים ברמת טריאלטי, הקרוי על שם "חמש אבנים" באנטוליה, לצד יישוב קיקלופי ובית קברות
    מתקופת הברונזה.
  body: >-
    **בשתאשני פירושו, פחות או יותר, "כפר חמש האבנים" — שם שהובא לכאן מן ההרים שמאחורי טרבזון.**


    הכפר מספר את סיפור ייסודו כך. המתיישבים הראשונים היו משפחות דוברות יוונית מארגירופוליס (גומושחאנה
    של היום), ממאדן ומהכפרים שסביבן, בפרובינציה העות'מאנית טרבזון. הם יצאו לדרך בסוף הסתיו, לא הספיקו
    להגיע לפני החורף לאדמה שהוקצתה להם והעבירו אותו בצינצקרו התחתונה, שם למדו ילדיהם טורקית מן היוונים
    המקומיים. באביב 1830 התיישבו ברמת צאלקה, ולאחר ויכוח סוער קראו לכפר על שם בשתאש — מקום מוצאה של קבוצה
    קטנה אחת בלבד מביניהם, והצורה הטורקית של השם היווני פנדה פטרה, "חמש אבנים".


    ליוונים שנמלטו ממעשי הנקמה העות'מאניים אחרי המלחמות הרוסיות-טורקיות, הזכירו שטחי המרעה הגבוהים של
    טריאלטי את הרי הפונטוס שהשאירו מאחור. צאצאיהם ידועים בשם האורומים של צאלקה. במפקד 2014 נמנו כאן 335
    איש; כיום חולקים היוונים את הכפר עם שכנים גאורגים ואזרבייג'נים.


    האבנים עתיקות בהרבה מן השם. לצד הכפר שוכן היישוב הקיקלופי של בשתאשני, ראש גבעה מבוצר הבנוי מגושי אבן
    ענקיים, בדומה למעוזי תקופת הברונזה ברחבי דרום הקווקז. כ-300 מטר משם, מצפון-מערב לכפר לאורך הדרך לשוא-חראבה,
    על הגדה הימנית של הגריאק-צ'אי, חפרו הארכאולוגים דימיטרי נרימנישווילי ורבז ורצ'קוריה ב-2015–2016 בית
    קברות מתקופת הברונזה המאוחרת–תקופת הברזל הקדומה.


    אל תצפו למוזיאון. זהו כפר חי בגובה 1,500 מטר: מרעה רחב, גגות נמוכים בין העצים, רצועת מים שמנצנצת במרחק.
    המתיישבים הביאו איתם את חמש האבנים שלהם; התברר שהרמה חיכתה להם עם אבנים משלה.
  tip: >-
    בשתאשני הוא כפר חי, לא אתר בתשלום, אז אל תסמכו על שלטי הכוונה, לוחות מידע או שירותים למבקרים. בית
    הקברות שנחפר נמצא מצפון-מערב לכפר, על הדרך לשוא-חראבה; שאלו את המקומיים בנימוס לפני שאתם חוצים שדות,
    שהם שטחי מרעה פרטיים. בגובה 1,500 מטר הערבים קרירים גם באוגוסט, והחורפים ארוכים ומושלגים. דלק, חנויות
    וארוחה תמצאו בצאלקה. שעה מספיקה בהחלט; מלאו את שאר היום במאגר צאלקה, בקניון דשבאשי ובכנסייה הלותרנית
    בטריאלטי, כולם בקרבת מקום.
  route: >-
    מטביליסי עלו דרך צקנטי, סעו בכביש Sh36 עד מאנגליסי ואז בכביש Sh31 מערבה על פני רמת טריאלטי לכיוון
    צאלקה. כמה קילומטרים לפני צאלקה פנו לבשתאשני; הכפר נמצא כ-3 ק״מ מהכביש הראשי. בסך הכול כ-89 ק״מ ושעה
    ו-40 דקות, סלול לכל אורכו, כך שרכב חסכוני מספיק. בחורף הקטע מאנגליסי–צאלקה עלול להתכסות קרח, וצמיגי
    חורף הם חובה. תחנת הדלק הקרובה ביותר בצאלקה.
ar:
  name: بشتاشيني
  short: >-
    قرية لليونانيين البنطيين على هضبة ترياليتي، سُمّيت على اسم «الحجارة الخمسة» في الأناضول، بجوار مستوطنة
    سيكلوبية ومقبرة من العصر البرونزي.
  body: >-
    **تعني بشتاشيني، على وجه التقريب، «قرية الحجارة الخمسة» — وهو اسم حُمل إلى هنا من الجبال الواقعة خلف
    طرابزون.**


    تروي القرية قصة تأسيسها على هذا النحو. كان المستوطنون الأوائل أسراً ناطقة باليونانية من أرغيروبوليس
    (غوموشهانه اليوم) ومادن والقرى المحيطة بها، في ولاية طرابزون العثمانية. انطلقوا في أواخر الخريف، فلم
    يبلغوا الأرض المخصصة لهم قبل الشتاء، وقضوه في تسينتسكارو السفلى، حيث تعلّم أطفالهم التركية من اليونانيين
    المحليين. وفي ربيع 1830 استقروا على هضبة تسالكا، وبعد جدال حاد سمّوا القرية باسم بشتاش — موطن مجموعة
    صغيرة واحدة فقط منهم، والصيغة التركية للاسم اليوناني بندي بترا، أي «الحجارة الخمسة».


    وبالنسبة إلى اليونانيين الفارّين من الانتقام العثماني بعد الحروب الروسية التركية، كانت المراعي العالية
    في ترياليتي تذكّرهم بجبال البنطس التي تركوها وراءهم. ويُعرف أحفادهم باسم أوروم تسالكا. وقد أحصى تعداد
    2014 هنا 335 نسمة؛ واليوم يتقاسم اليونانيون القرية مع جيران جورجيين وأذربيجانيين.


    والحجارة أقدم من الاسم بكثير. فإلى جانب القرية تقع مستوطنة بشتاشيني السيكلوبية، وهي قمة تل محصّنة
    بُنيت من كتل ضخمة على نمط قلاع العصر البرونزي في أنحاء جنوب القوقاز. وعلى بعد نحو 300 متر، شمال غربي
    القرية على الطريق إلى شوا خارابا، وعلى الضفة اليمنى لنهر غيرياك تشاي، نقّب عالما الآثار ديميتري ناريمانيشفيلي
    وريفاز فاراتشكوريا في 2015–2016 عن مقبرة من أواخر العصر البرونزي وبداية العصر الحديدي.


    لا تتوقع متحفاً. هذه قرية حيّة على ارتفاع 1500 متر: مراعٍ واسعة، وسقوف واطئة بين الأشجار، وشريط من
    الماء يلمع في البعيد. حمل المستوطنون حجارتهم الخمسة معهم؛ ثم تبيّن أن الهضبة كانت تنتظرهم بحجارة من
    عندها.
  tip: >-
    بشتاشيني قرية حيّة لا موقع بتذاكر، فلا تعوّل على لافتات إرشادية أو لوحات معلومات أو مرافق للزوار.
    تقع المقبرة المنقّبة شمال غربي القرية على الطريق إلى شوا خارابا؛ واستأذن الأهالي بلطف قبل عبور الحقول،
    فهي مراعٍ خاصة. على ارتفاع 1500 متر تكون الأمسيات باردة حتى في أغسطس، والشتاء طويل كثير الثلوج. الوقود
    والمتاجر والطعام في تسالكا. ساعة واحدة تكفي وتزيد؛ واملأ بقية اليوم بخزان تسالكا وأخدود داشباشي والكنيسة
    اللوثرية في ترياليتي، وكلها قريبة.
  route: >-
    من تبليسي اصعد عبر تسكنيتي، واسلك Sh36 إلى مانغليسي، ثم Sh31 غرباً عبر هضبة ترياليتي باتجاه تسالكا.
    وقبل تسالكا ببضعة كيلومترات انعطف نحو بشتاشيني؛ فالقرية على بعد نحو 3 كم من الطريق الرئيسي. المسافة
    الإجمالية نحو 89 كم وساعة و40 دقيقة، والطريق معبّد بالكامل، فتكفي سيارة اقتصادية. في الشتاء قد يتجمّد
    مقطع مانغليسي–تسالكا، والإطارات الشتوية ضرورية. أقرب محطة وقود في تسالكا.
