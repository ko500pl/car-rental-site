ka:
  name: ლადო მესხიშვილის სახელობის სახელმწიფო დრამატული თეატრი
  short: >-
    ქუთაისის დრამატული დასი, რომლის ფესვები 1861 წლამდე მიდის, კოლხეთის შადრევნის უკან მდგარი მრგვალი
    შენობის 830-ადგილიან დარბაზში თამაშობს.
  body: >-
    **ქუთაისის დრამატული დასი საკუთარ სახლზე თითქმის ერთი საუკუნით უფროსია: მისი ისტორია 1861 წელს იწყება,
    ცენტრალურ მოედანზე კი კარი მხოლოდ 1955 წელს გაიღო.**


    1861 წლის 3 მარტს ქუთაისელმა სცენისმოყვარეებმა ქართულ ენაზე გიორგი ერისთავის კომედია „გაყრა“ დადგეს
    — ეს იმ ეროვნული აღორძინების ნაწილი იყო, რომელმაც საქართველოს პროფესიული თეატრი აჩუქა. 1879 წლის შემოდგომაზე
    მოყვარულები მუდმივ დასად იქცნენ და სამოცდაათ წელზე მეტ ხანს რუსთაველის გამზირზე, ხარაზოვის თეატრში
    თამაშობდნენ — იმ ადგილას, სადაც დღეს ქალაქის ოპერა დგას.


    1955 წლის 6 ნოემბერს დასი საკუთარ სახლში გადავიდა: კოლხეთის შადრევნის უკან მდგარ მრგვალ შენობაში,
    რომელიც არქიტექტორებმა მიხეილ შავიშვილმა და შალვა თავაძემ დააპროექტეს და რომელსაც 2009 წლიდან ძეგლის
    სტატუსი აქვს. შიგნით დაახლოებით 830-ადგილიანი მთავარი დარბაზია, რომელიც დღესაც იმისთვის მსახურობს,
    რისთვისაც აშენდა — რეგულარული ქართული დრამატული სპექტაკლებისთვის. თეატრი 1940 წლიდან მსახიობისა და
    რეჟისორის, ლადო მესხიშვილის (1857–1920), სახელს ატარებს — XIX და XX საუკუნეების მიჯნაზე სწორედ მან
    უხელმძღვანელა ამ დასს. ის ქვეყნის უძველეს პროფესიულ დასებს შორისაა.


    2008 წლიდან შენობაში ქუთაისის თეატრის ისტორიის პატარა მუზეუმიც მოქმედებს — სალაროში იკითხეთ, შეიძლება
    თუ არა მისი ნახვა, — თუმცა შენობა თავის ნამდვილ საქმეს სიბნელის ჩამოწოლის შემდეგ აკეთებს. იყიდეთ ბილეთი
    საღამოს სპექტაკლზე და იმ მაყურებელთა რიგს შეუერთდებით, რომელიც 1861 წლიდან მოდის.
  tip: >-
    სპექტაკლები ქართულ ენაზეა. თეატრის ისტორიის მუზეუმის შესახებ სალაროში იკითხეთ; სხვა შემთხვევაში შიგნით
    საღამოს სპექტაკლის ბილეთით მოხვდებით, ამიტომ მიმდინარე რეპერტუარი წინასწარ, ადგილზე გადაამოწმეთ. თუ
    ქართული არ იცით, აირჩიეთ კლასიკა, რომლის სიუჟეტიც უკვე გახსოვთ; კარგი დადგმა ბევრს სიტყვების გარეშეც
    გაგაგებინებთ. შენობის ფოტოსთვის საუკეთესო ადგილი წინა მოედანია, საღამოს, როცა ფასადი განათებულია.
    ცენტრში პარკირება ჩვეულებრივ შესაძლებელია, ოპერა და თეთრი ხიდი კი ფეხით ახლოსაა.
  route: >-
    ქუთაისი თბილისიდან დაახლოებით 230 კილომეტრშია, გზა დაახლოებით 3 საათსა და 20 წუთს გრძელდება. დასავლეთით
    ს1 (E60) გზატკეცილს მიჰყევით მცხეთის, გორისა და ხაშურის გავლით, რიკოთის მონაკვეთსა და ზესტაფონს იქით,
    ქუთაისამდე — გზა მთლიანად მოასფალტებულია, ბენზინგასამართი ყველა ქალაქშია. ქალაქში ცენტრისა და კოლხეთის
    შადრევნიანი ცენტრალური მოედნის მიმართულებას მიჰყევით; თეატრი უშუალოდ შადრევნის უკან დგას. მანქანა
    მიმდებარე ქუჩებში დატოვეთ და ბოლო რამდენიმე წუთი ფეხით გაიარეთ. ეკონომკლასის მანქანაც სავსებით საკმარისია.
en:
  name: Lado Meskhishvili State Drama Theatre
  short: >-
    Kutaisi's drama company, rooted in the Georgian-language stage of 1861, plays to an 830-seat hall
    in a rotund house behind the Colchis Fountain.
  body: >-
    **Kutaisi's drama company is almost a century older than its own house: its story begins in 1861,
    and its doors opened on the central square only in 1955.**


    On 3 March 1861 amateurs in Kutaisi put on Giorgi Eristavi's comedy *The Division* (*Gakra*) in Georgian
    — part of the national revival that gave Georgia a professional theatre. In the autumn of 1879 they
    became a permanent troupe, and for more than seventy years they played in the Kharazov theatre on
    Rustaveli Avenue, on the site where the opera house now stands.


    On 6 November 1955 the company left for a home of its own: the rotund building behind the Colchis
    Fountain, designed by the architects Mikheil Shavishvili and Shalva Tavadze and listed as a monument
    since 2009. Inside is a main hall of some 830 seats, still used the way it was meant to be — for regular
    drama, in Georgian. The theatre is named after the actor-director Lado Meskhishvili (1857–1920), who
    led this very company at the turn of the 20th century and whose name it has carried since 1940. It
    is among the oldest professional troupes in the country.


    A small museum of Kutaisi's theatre history has been kept inside since 2008 — ask at the box office
    whether it can be seen — but the building really earns its keep after dark. Buy a ticket for an evening
    performance and you take your seat in a line of audiences that runs back to 1861.
  tip: >-
    Performances are in Georgian. Ask at the box office about the theatre-history museum; otherwise the
    way in is a ticket for an evening performance, so check the current programme locally before you plan
    around it. If you do not speak Georgian, pick a classic whose story you already know; a strong production
    carries a long way without words. The fountain square in front is the best spot for a photograph of
    the building, lit up in the evening. Street parking in the centre is usually manageable, and the opera
    house and the White Bridge are a short walk away.
  route: >-
    Kutaisi is about 230 km from Tbilisi, roughly 3 hours 20 minutes. Take the S1 (E60) west past Mtskheta,
    Gori and Khashuri, over the Rikoti section and past Zestaponi into Kutaisi — four-lane in long stretches,
    asphalt throughout, with fuel in every town. In the city follow signs for the centre and the central
    square with the Colchis Fountain; the theatre stands directly behind it. Park in the surrounding streets
    and walk the last few minutes. An economy car is perfectly adequate.
ru:
  name: Государственный драматический театр имени Ладо Месхишвили
  short: >-
    Кутаисская драматическая труппа, чьи корни — в грузиноязычной сцене 1861 года, играет в зале на 830
    мест в круглом здании за фонтаном «Колхида».
  body: >-
    **Кутаисская драматическая труппа почти на век старше собственного дома: её история начинается в 1861
    году, а двери на центральной площади открылись лишь в 1955-м.**


    3 марта 1861 года кутаисские любители сыграли на грузинском языке комедию Георгия Эристави «Раздел»
    — это было частью национального возрождения, которое дало Грузии профессиональный театр. Осенью 1879
    года они стали постоянной труппой и больше семидесяти лет играли в театре Харазова на проспекте Руставели
    — на том месте, где сегодня стоит городской оперный театр.


    6 ноября 1955 года труппа переехала в собственный дом — круглое здание за фонтаном «Колхида», построенное
    по проекту архитекторов Михаила Шавишвили и Шалвы Тавадзе; с 2009 года оно охраняется как памятник.
    Внутри — главный зал примерно на 830 мест, который по-прежнему служит тому, для чего задуман: регулярным
    драматическим спектаклям на грузинском языке. С 1940 года театр носит имя актёра и режиссёра Ладо
    Месхишвили (1857–1920), который на рубеже XIX–XX веков сам руководил этой труппой, и считается одной
    из старейших профессиональных трупп страны.


    С 2008 года в здании работает небольшой музей истории кутаисского театра — спросите в кассе, можно
    ли его посмотреть, — но по-настоящему здание оживает после наступления темноты. Купите билет на вечерний
    спектакль — и займёте место в череде зрителей, которая тянется с 1861 года.
  tip: >-
    Спектакли идут на грузинском языке. О музее истории театра спросите в кассе; в остальном попасть внутрь
    можно по билету на вечерний спектакль, так что заранее уточните текущий репертуар на месте. Если вы
    не говорите по-грузински, выберите классику, сюжет которой уже знаете: сильная постановка многое передаёт
    и без слов. Лучшая точка для снимка здания — площадь с фонтаном перед ним, вечером, когда включена
    подсветка. С парковкой на улицах центра обычно можно справиться, а оперный театр и Белый мост — в
    нескольких минутах ходьбы.
  route: >-
    До Кутаиси от Тбилиси около 230 км, примерно 3 часа 20 минут. Двигайтесь по S1 (E60) на запад мимо
    Мцхеты, Гори и Хашури, через участок Рикоти и мимо Зестафони в Кутаиси — на длинных отрезках дорога
    четырёхполосная, асфальт на всём пути, заправки в каждом городе. В городе следуйте указателям на центр
    и на центральную площадь с фонтаном «Колхида»; театр стоит прямо за ним. Припаркуйтесь на окрестных
    улицах и пройдите последние несколько минут пешком. Машины эконом-класса вполне достаточно.
fa:
  name: تئاتر دولتی درام لادو مسخیشویلی
  short: >-
    گروه درام کوتایسی، با ریشه در صحنهٔ گرجی‌زبان ۱۸۶۱، در تالاری ۸۳۰ نفره در ساختمانی مدور پشت فوارهٔ
    کلخیس اجرا می‌کند.
  body: >-
    **گروه درام کوتایسی تقریباً یک سده از خانهٔ خودش کهن‌تر است: داستانش از ۱۸۶۱ آغاز می‌شود، اما درهایش
    بر میدان مرکزی تنها در ۱۹۵۵ گشوده شد.**


    در ۳ مارس ۱۸۶۱ گروهی از علاقه‌مندان در کوتایسی کمدی «تقسیم» اثر گیورگی اریستاوی را به زبان گرجی به
    صحنه بردند — بخشی از نوزایی ملی‌ای که تئاتر حرفه‌ای را به گرجستان داد. در پاییز ۱۸۷۹ به گروهی دائمی
    بدل شدند و بیش از هفتاد سال در تئاتر خارازوف در خیابان روستاولی اجرا کردند؛ در همان جایی که امروز
    اپرای شهر برپاست.


    در ۶ نوامبر ۱۹۵۵ گروه به خانهٔ خودش رفت: ساختمان مدوری پشت فوارهٔ کلخیس، طراحی معماران میخیل شاویشویلی
    و شالوا تاوادزه، که از ۲۰۰۹ بنای تاریخی ثبت‌شده است. درون آن تالار اصلی‌ای با حدود ۸۳۰ صندلی هست که
    هنوز همان‌گونه به کار می‌رود که از آغاز در نظر بود — برای اجرای منظم نمایش، به زبان گرجی. تئاتر از
    ۱۹۴۰ نام بازیگر و کارگردان، لادو مسخیشویلی (۱۸۵۷–۱۹۲۰)، را بر خود دارد که در آستانهٔ سدهٔ بیستم خود
    همین گروه را رهبری می‌کرد، و از کهن‌ترین گروه‌های حرفه‌ای کشور به شمار می‌آید.


    از ۲۰۰۸ موزهٔ کوچکی از تاریخ تئاتر کوتایسی در ساختمان دایر است — در گیشه بپرسید که آیا می‌توان آن
    را دید — اما این ساختمان به‌راستی پس از تاریک شدن هوا جان می‌گیرد. بلیت یک اجرای شبانه بخرید تا در
    صفی از تماشاگران بنشینید که تا ۱۸۶۱ امتداد دارد.
  tip: >-
    اجراها به زبان گرجی است. دربارهٔ موزهٔ تاریخ تئاتر در گیشه بپرسید؛ جز آن، راه ورود بلیت یک اجرای شبانه
    است، پس برنامهٔ جاری را از پیش در محل بررسی کنید. اگر گرجی نمی‌دانید، اثری کلاسیک برگزینید که داستانش
    را از پیش می‌شناسید؛ اجرای خوب حتی بی‌کلام هم بسیار چیزها را می‌رساند. میدانِ فوارهٔ روبه‌روی ساختمان
    بهترین جا برای عکس گرفتن از آن است، شب‌هنگام که چراغانی است. پارک در خیابان‌های مرکز معمولاً شدنی
    است، و اپرا و پل سفید در چند قدمی‌اند.
  route: >-
    کوتایسی حدود ۲۳۰ کیلومتر از تفلیس فاصله دارد، نزدیک به ۳ ساعت و ۲۰ دقیقه. از S1 (E60) به سوی غرب بروید،
    از کنار متسختا، گوری و خاشوری بگذرید، از بخش ریکوتی عبور کنید و پس از زستافونی وارد کوتایسی شوید —
    در بخش‌های طولانی چهارخطه، سراسر آسفالت، با پمپ بنزین در هر شهر. در شهر تابلوهای مرکز و میدان مرکزی
    با فوارهٔ کلخیس را دنبال کنید؛ تئاتر درست پشت آن است. در خیابان‌های اطراف پارک کنید و چند دقیقهٔ آخر
    را پیاده بروید. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: תיאטרון הדרמה הממלכתי על שם לאדו מסחישווילי
  short: >-
    להקת הדרמה של קוטאיסי, ששורשיה בבמה בשפה הגאורגית של 1861, מופיעה באולם בן 830 מושבים בבניין עגול
    מאחורי מזרקת קולכיס.
  body: >-
    **להקת הדרמה של קוטאיסי מבוגרת כמעט במאה שנה מהבית שלה עצמה: סיפורה מתחיל ב-1861, ודלתותיה בכיכר המרכזית
    נפתחו רק ב-1955.**


    ב-3 במרץ 1861 העלו חובבים בקוטאיסי בגאורגית את הקומדיה "החלוקה" של גיורגי אריסטאווי — חלק מן התחייה
    הלאומית שהעניקה לגאורגיה תיאטרון מקצועי. בסתיו 1879 הפכו ללהקה קבועה, ובמשך יותר משבעים שנה הופיעו
    בתיאטרון חרזוב שבשדרות רוסתאוולי, במקום שבו עומד היום בית האופרה של העיר.


    ב-6 בנובמבר 1955 עברה הלהקה לבית משלה: הבניין העגול שמאחורי מזרקת קולכיס, שתכננו האדריכלים מיכאיל
    שבישווילי ושלווה טבדזה ושמאז 2009 הוא אתר מורשת מוגן. בפנים יש אולם מרכזי של כ-830 מושבים, שעדיין
    משמש למה שנועד לו — הצגות דרמה סדירות, בגאורגית. מאז 1940 נושא התיאטרון את שמו של השחקן והבמאי לאדו
    מסחישווילי (1857–1920), שעמד בעצמו בראש הלהקה הזאת בסוף המאה ה-19 ובתחילת המאה ה-20, והוא נמנה עם
    הלהקות המקצועיות הוותיקות ביותר בגאורגיה.


    מאז 2008 פועל בבניין מוזיאון קטן לתולדות התיאטרון בקוטאיסי — שאלו בקופה אם אפשר לבקר בו — אבל הבניין
    מצדיק את קיומו באמת אחרי רדת החשכה. קנו כרטיס להצגת ערב, ותתיישבו בשורה ארוכה של קהלים שנמשכת אחורה
    עד 1861.
  tip: >-
    ההצגות בגאורגית. על המוזיאון לתולדות התיאטרון שאלו בקופה; מלבד זאת, הדרך פנימה היא כרטיס להצגת ערב,
    לכן בדקו מראש את התוכנייה העדכנית במקום. אם אינכם דוברי גאורגית, בחרו מחזה קלסי שאת עלילתו אתם כבר
    מכירים; הפקה טובה מעבירה הרבה גם בלי מילים. כיכר המזרקה שלפני הבניין היא הנקודה הטובה ביותר לצלם אותו,
    בערב, כשהוא מואר. בדרך כלל אפשר להסתדר עם חנייה ברחובות המרכז, ובית האופרה והגשר הלבן נמצאים במרחק
    הליכה קצר.
  route: >-
    קוטאיסי נמצאת כ-230 ק״מ מטביליסי, בערך 3 שעות ו-20 דקות נסיעה. סעו מערבה בכביש S1 (E60), עברו את מצחתה,
    גורי וחשורי, את קטע ריקוטי ואת זסטפוני, והיכנסו לקוטאיסי — בקטעים ארוכים הכביש בן ארבעה נתיבים, אספלט
    לכל אורכו ותחנות דלק בכל עיר. בעיר עקבו אחר השלטים למרכז ולכיכר המרכזית עם מזרקת קולכיס; התיאטרון
    עומד ממש מאחוריה. חנו ברחובות הסביבה ועשו את הדקות האחרונות ברגל. רכב מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: مسرح لادو ميسخيشفيلي الحكومي للدراما
  short: >-
    فرقة كوتايسي المسرحية، المتجذرة في المسرح الناطق بالجورجية منذ 1861، تقدم عروضها في قاعة من 830 مقعدًا
    داخل مبنى مستدير خلف نافورة كولخيس.
  body: >-
    **فرقة الدراما في كوتايسي أقدم من بيتها بقرن تقريبًا: تبدأ قصتها عام 1861، أما أبوابها على الساحة
    المركزية فلم تُفتح إلا عام 1955.**


    في 3 مارس 1861 قدّم هواة في كوتايسي بالجورجية كوميديا «القسمة» لغيورغي إريستافي — في إطار النهضة الوطنية
    التي منحت جورجيا مسرحًا محترفًا. وفي خريف 1879 صاروا فرقة دائمة، وظلوا أكثر من سبعين عامًا يقدمون
    عروضهم في مسرح خارازوف في جادة روستافيلي، في الموقع الذي تقوم فيه اليوم دار أوبرا المدينة.


    وفي 6 نوفمبر 1955 انتقلت الفرقة إلى بيت خاص بها: المبنى المستدير خلف نافورة كولخيس، من تصميم المعماريَّين
    ميخائيل شافيشفيلي وشالفا تافادزه، وهو معلم محميّ منذ 2009. في الداخل قاعة رئيسية من نحو 830 مقعدًا،
    ما زالت تؤدي ما صُمّمت له — عروضًا درامية منتظمة باللغة الجورجية. ويحمل المسرح منذ 1940 اسم الممثل
    والمخرج لادو ميسخيشفيلي (1857–1920)، الذي قاد هذه الفرقة بنفسه في مطلع القرن العشرين، ويُعدّ من أقدم
    الفرق المحترفة في البلاد.


    ومنذ 2008 يضم المبنى متحفًا صغيرًا لتاريخ المسرح في كوتايسي — اسأل في شباك التذاكر إن كان يمكن زيارته
    — لكن المبنى يثبت جدارته حقًا بعد حلول الظلام. اشترِ تذكرة لعرض مسائي، وستأخذ مقعدك في سلسلة من الجماهير
    تمتد إلى عام 1861.
  tip: >-
    العروض باللغة الجورجية. اسأل في شباك التذاكر عن متحف تاريخ المسرح؛ وفيما عدا ذلك فالطريق إلى الداخل
    تذكرة لعرض مسائي، فتحقق من البرنامج الحالي محليًا مسبقًا. وإن كنت لا تتكلم الجورجية، فاختر عملًا كلاسيكيًا
    تعرف حكايته مسبقًا؛ فالعرض المتقن يوصل الكثير حتى من دون كلمات. ساحة النافورة أمام المبنى أفضل موضع
    لتصويره، مساءً حين يُضاء. الوقوف في شوارع الوسط ممكن عادةً، ودار الأوبرا والجسر الأبيض على مسافة قصيرة
    سيرًا.
  route: >-
    تبعد كوتايسي عن تبليسي نحو 230 كم، أي قرابة 3 ساعات و20 دقيقة. اتبع الطريق S1 (E60) غربًا مرورًا بمتسخيتا
    وغوري وخاشوري، ثم عبر مقطع ريكوتي ومرورًا بزستافوني حتى كوتايسي — الطريق بأربعة مسارات في مقاطع طويلة،
    معبّد طوال المسافة، ومحطات الوقود في كل بلدة. في المدينة اتبع اللافتات إلى المركز وإلى الساحة المركزية
    ذات نافورة كولخيس؛ يقع المسرح خلفها مباشرة. اركن في الشوارع المحيطة وامشِ الدقائق القليلة الأخيرة.
    وتكفي سيارة اقتصادية تمامًا.
