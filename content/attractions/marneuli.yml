ka:
  name: მარნეული
  short: >-
    ბაზრის ქალაქი ალგეთზე, სადაც ქართული და აზერბაიჯანული ერთად ისმის, ჩაის ჩაიდნით სვამენ, ახლოს კი,
    მარაბდაზე, 1625 წელს სააკაძე ყიზილბაშებს ებრძოდა.
  body: >-
    **თბილისიდან ორმოცდაათ წუთში, მარნეულში, ქუჩის ენა იცვლება, პური იცვლება და დღის რიტმიც სხვა ხდება.**


    ქალაქი მდინარე ალგეთზე, ქვემო ქართლის ნაყოფიერ ვაკეზე დგას, სომხეთისა და აზერბაიჯანის საზღვრებთან
    ახლოს. 2014 წლის აღწერით, მისი 20 ათასი მცხოვრებიდან 83% ეთნიკური აზერბაიჯანელია. სახელიც ორგვარია:
    ქართველი მკვლევრები „მარნეულს“ მარანს უკავშირებენ, აზერბაიჯანელები კი ქალაქს სარვანს ეძახიან — სპარსული
    სიტყვისგან, რომელიც აქლემების მომვლელს ნიშნავს. 1947 წლამდე აქაურობას ბორჩალო ერქვა, ქალაქის სტატუსი
    კი მხოლოდ 1964 წელს მიიღო. მის ქუჩებში იმამ ალის მეჩეთიც დგას და წმინდა გიორგისა და ვახტანგ გორგასლის
    ეკლესიებიც.


    ეს მშვიდი ვაკე დიდი ხანია ლაშქრის გზაა. 1625 წლის 1 ივლისს, ქალაქის ჩრდილოეთით, მარაბდის ველზე, გიორგი
    სააკაძის ჯარმა ისა-ხანის ყიზილბაშთა ლაშქარი კინაღამ გატეხა, მაგრამ ბოლოს დამარცხდა და სპარსელები თბილისში
    შევიდნენ. 1918 წლის დეკემბერში ქართველები და სომხები ქალაქიდან 8 კილომეტრში, მდინარე ხრამთან შეებრძოლნენ
    ერთმანეთს; 1921 წელს თბილისისკენ მიმავალმა წითელმა არმიამ მარნეული გაიარა; 2008 წლის 8 აგვისტოს კი
    რუსულმა ავიაციამ ქალაქის აეროდრომი დაბომბა და სამი ადამიანი იმსხვერპლა.


    მაინც, აქ ჩვეულებრივი სამუშაო დღის სანახავად ჩამოდიან. ცენტრალური ბაზარი სუვენირების ბაზრობა კი არა,
    მიწათმოქმედი მხარის სავაჭრო გულია: მწვანილი სქელ კონებად, ვაკის პომიდორი და კარტოფილი, სანელებლები,
    ქსოვილი, სამეურნეო წვრილმანი. ისადილეთ იქ, სადაც ადგილობრივები სადილობენ — თონის პური, ქუთაბი, მწვადი,
    — მერე კი ჩაიხანაში ჩამოსხედით, სადაც ჩაის ჭიქით კი არა, ჩაიდნით მოგართმევენ.


    მარნეულს სანახავად დიდებული ძეგლი არ აქვს. მისი ძეგლი ყოველდღიურობაა, ორ ენაზე ნაცხოვრები.
  tip: >-
    ორი საათი ბაზარსა და აუჩქარებელ სადილს ეყოფა. დილით ჩამოდით: დახლები შუადღემდეა სავსე, ნაშუადღევს
    კი იშლება. ნაღდი ფული წვრილ კუპიურებად იქონიეთ — ბარათს ყველგან არ იღებენ; ვიწრო, ხალხმრავალ რიგებში
    ჩანთა წინ დაიჭირეთ. ადამიანების გადაღებამდე ნებართვა ითხოვეთ. ზაფხულში ვაკეზე ცხელა და ჩრდილი თითქმის
    არ არის, ამიტომ გაზაფხული და შემოდგომა უფრო ლმობიერია. რუსული ან რამდენიმე აზერბაიჯანული სიტყვა ბევრ
    კარს გაგიღებთ, ჩაიხანაში კი სტუმარს გულითადად ხვდებიან.
  route: >-
    თბილისიდან რუსთავის გზატკეცილით გადით და ფონიჭალაში ს6-ზე გადადით, მარნეულისა და სომხეთის საზღვრის
    მიმართულებით: 42 კმ, დაახლოებით 50 წუთი. ს6 მხოლოდ პირველ რამდენიმე კილომეტრზეა ოთხზოლიანი, შემდეგ
    კი დატვირთული ორზოლიანი გზა სოფლებს მიუყვება; სომხეთისა და აზერბაიჯანისკენ მიმავალი სატვირთოები ბევრია,
    ამიტომ გასწრებისას მოთმინება გამოიჩინეთ. კოდასთან წალკისკენ შ31 გადადის. მარნეულის ცენტრალური წრიდან
    სადახლოსკენ ს7 იწყება. ბენზინგასამართი სადგურები ხშირია, ბაზართან კი დილით პარკირება ძნელია. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Marneuli
  short: >-
    A market town on the Algeti where Georgian and Azerbaijani share the street, tea comes by the pot,
    and in 1625 Saakadze fought the Safavids at nearby Marabda.
  body: >-
    **Fifty minutes south of Tbilisi, in Marneuli, the language on the street changes, the bread changes,
    and so does the rhythm of the day.**


    The town stands on the Algeti river in the flat, fertile south of Kvemo Kartli, close to both the
    Armenian and the Azerbaijani border. In the 2014 census 83% of its 20,000 people were Georgian Azerbaijanis.
    Even the name comes in two versions: Georgian scholars link Marneuli to marani, the wine cellar, while
    Azerbaijanis call the town Sarvan, from a Persian word for a camel-keeper. Until 1947 it was simply
    Borchalo; it became a town only in 1964. The Imam Ali mosque and the churches of St George and Vakhtang
    Gorgasali share its streets.


    This quiet plain has long been a road for armies. On 1 July 1625, on the Marabda field just to the
    north, Giorgi Saakadze's Georgians almost broke the Safavid army of Isa Khan before being routed,
    and the Persians marched into Tbilisi. In December 1918 Georgians and Armenians fought by the Khrami,
    8 km south; in 1921 the Red Army passed through on its way to Tbilisi; and on 8 August 2008 Russian
    aircraft bombed the town's airfield, killing three people.


    Yet people come for an ordinary working day. The central market is no souvenir bazaar but the trading
    heart of a farming district: herbs in fat bunches, tomatoes and potatoes from the plain, spices, fabric,
    hardware. Eat where the locals eat — clay-oven bread, qutab, kebab — then settle into a tea house,
    where tea arrives by the pot, not the cup.


    Marneuli has no grand monument to show you. Its monument is the everyday, lived in two languages.
  tip: >-
    Two hours cover the market and an unhurried lunch. Come in the morning: stalls are fullest before
    noon and begin packing up in the afternoon. Carry cash in small notes, as cards are not accepted everywhere,
    and keep your bag in front of you in the crowded aisles. Ask before photographing people. Summer on
    the plain is hot and nearly shadeless, so spring and autumn are kinder. Russian, or a few words of
    Azerbaijani, opens doors, and tea houses welcome visitors warmly.
  route: >-
    Leave Tbilisi on the Rustavi road and at Ponichala take the S6, signed for Marneuli and the Armenian
    border: 42 km, about 50 minutes. The S6 has four lanes only for its first few kilometres; after that
    it is a busy two-lane road through a string of villages, full of lorries bound for Armenia and Azerbaijan,
    so overtake with patience. At Koda the Sh31 branches off towards Tsalka. In Marneuli the S7 to Sadakhlo
    starts at the central roundabout. Fuel stations are frequent, but parking near the market is tight
    in the morning. An economy car is all you need.
ru:
  name: Марнеули
  short: >-
    Торговый город на Алгети, где на улице звучат грузинский и азербайджанский, чай подают чайником, а
    рядом, у Марабды, в 1625 году Саакадзе бился с Сефевидами.
  body: >-
    **В пятидесяти минутах к югу от Тбилиси, в Марнеули, меняется язык улицы, меняется хлеб — и меняется
    сам ритм дня.**


    Город стоит на реке Алгети, на плоском плодородном юге Квемо-Картли, недалеко и от армянской, и от
    азербайджанской границы. По переписи 2014 года 83% из 20 000 его жителей — грузинские азербайджанцы.
    Даже имя у города двойное: грузинские учёные связывают «Марнеули» со словом «марани» — винный погреб,
    а азербайджанцы зовут город Сарван, от персидского слова, означающего погонщика верблюдов. До 1947
    года он назывался просто Борчало, а статус города получил лишь в 1964-м. На его улицах соседствуют
    мечеть имама Али и церкви Святого Георгия и Вахтанга Горгасали.


    Эта тихая равнина издавна служила дорогой для армий. 1 июля 1625 года на Марабдинском поле, чуть севернее,
    грузины Георгия Саакадзе едва не сломили сефевидское войско Иса-хана, но были разгромлены, и персы
    вошли в Тбилиси. В декабре 1918 года у реки Храми, в 8 км к югу, сражались грузины и армяне; в 1921
    году здесь прошла на Тбилиси Красная армия; а 8 августа 2008 года российская авиация бомбила городской
    аэродром — погибли три человека.


    И всё же едут сюда ради обычного рабочего дня. Центральный рынок — не сувенирный базар, а торговое
    сердце земледельческого края: пухлые пучки зелени, помидоры и картофель с равнины, пряности, ткани,
    скобяной товар. Ешьте там, где едят местные, — хлеб из глиняной печи, кутабы, кебаб, — а потом устройтесь
    в чайхане, где чай приносят чайником, а не чашкой.


    Парадного памятника Марнеули вам не покажет. Его памятник — будни, прожитые на двух языках.
  tip: >-
    Двух часов хватит на рынок и неспешный обед. Приезжайте утром: до полудня прилавки ломятся, а после
    обеда их начинают сворачивать. Возьмите наличные мелкими купюрами — карты принимают не везде — и в
    тесных рядах держите сумку перед собой. Прежде чем фотографировать людей, спросите разрешения. Летом
    на равнине жарко и почти нет тени, так что весна и осень здесь милосерднее. Русский язык или пара
    слов по-азербайджански открывают двери, а в чайханах гостям искренне рады.
  route: >-
    Выезжайте из Тбилиси по руставской дороге и у Поничалы сворачивайте на S6 — указатели на Марнеули
    и армянскую границу: 42 км, около 50 минут. Четыре полосы у S6 только на первых нескольких километрах,
    дальше это оживлённая двухполосная дорога через череду сёл, полная фур, идущих в Армению и Азербайджан,
    так что обгоняйте терпеливо. У Коды от неё ответвляется Sh31 на Цалку. В Марнеули на центральной кольцевой
    развязке начинается S7 на Садахло. Заправок по пути много, но у рынка по утрам с парковкой тесно.
    Машины эконом-класса вполне достаточно.
fa:
  name: مارنئولی
  short: >-
    شهری بازاری بر کرانهٔ آلگتی که گرجی و ترکی آذربایجانی در کوچه‌هایش به گوش می‌رسد، چای با قوری می‌آید
    و سااکادزه در ۱۶۲۵ در مارابدای نزدیکش با صفویان جنگید.
  body: >-
    **پنجاه دقیقه جنوبِ تفلیس، در مارنئولی، زبانِ کوچه عوض می‌شود، نان عوض می‌شود، و آهنگِ روز هم.**


    شهر بر کرانهٔ رود آلگتی، در جنوبِ هموار و حاصلخیز کْوِمو کارتلی، و نزدیکِ هر دو مرزِ ارمنستان و جمهوری
    آذربایجان قرار دارد. در سرشماری سال ۲۰۱۴، از ۲۰ هزار ساکن شهر ۸۳ درصد آذربایجانی‌های گرجستان بودند.
    حتی نام شهر هم دو روایت دارد: پژوهشگران گرجی «مارنئولی» را به «مارانی»، یعنی سردابِ شراب، پیوند می‌دهند
    و آذربایجانی‌ها شهر را ساروان می‌نامند، از واژهٔ فارسیِ «ساربان». نامش تا ۱۹۴۷ تنها بورچالو بود و
    عنوان شهر را فقط در ۱۹۶۴ گرفت. مسجد امام علی و کلیساهای گئورگی قدیس و واختانگ گورگاسالی در خیابان‌هایش
    همسایهٔ یکدیگرند.


    این دشتِ آرام از دیرباز گذرگاه لشکرها بوده است. در ۱ ژوئیهٔ ۱۶۲۵، در دشت مارابدا، کمی شمال‌تر، گرجیانِ
    گیورگی سااکادزه نزدیک بود سپاه صفوی به فرماندهی عیسی‌خان را درهم بشکنند، اما سرانجام تار و مار شدند
    و سپاه ایران وارد تفلیس شد. در دسامبر ۱۹۱۸ گرجی‌ها و ارمنی‌ها کنار رود خرامی، ۸ کیلومتری جنوب، جنگیدند؛
    در ۱۹۲۱ ارتش سرخ در راه تفلیس از این‌جا گذشت؛ و در ۸ اوت ۲۰۰۸ هواپیماهای روسی فرودگاه شهر را بمباران
    کردند و سه نفر کشته شدند.


    با این همه، آنچه مسافر را به این‌جا می‌کشد یک روز کاری معمولی است. بازار مرکزی بازار سوغات نیست، بلکه
    قلب تجاری یک ناحیهٔ کشاورزی است: دسته‌های پرپشت سبزی، گوجه‌فرنگی و سیب‌زمینیِ دشت، ادویه، پارچه و
    ابزار و یراق. همان‌جا غذا بخورید که مردم محل می‌خورند — نان تنوری، قوتاب، کباب — و بعد در چایخانه‌ای
    بنشینید که چای را با قوری می‌آورد، نه با استکان.


    مارنئولی بنای باشکوهی ندارد که نشانتان بدهد. بنای یادبودش زندگی روزمره است، که به دو زبان زیسته می‌شود.
  tip: >-
    دو ساعت برای بازار و ناهاری بی‌شتاب کافی است. صبح بیایید: پیش از ظهر بساط‌ها از همیشه پُرترند و بعدازظهر
    کم‌کم جمع می‌شوند. پول نقد با اسکناس خرد همراه داشته باشید، چون همه‌جا کارت نمی‌پذیرند، و در راهروهای
    شلوغ کیفتان را جلوی خود نگه دارید. پیش از عکس گرفتن از مردم اجازه بگیرید. تابستانِ دشت داغ و تقریباً
    بی‌سایه است، پس بهار و پاییز مهربان‌ترند. روسی، یا چند کلمه ترکی آذربایجانی، درها را باز می‌کند و
    چایخانه‌ها با گرمی پذیرای مهمان‌اند.
  route: >-
    از تفلیس جادهٔ روستاوی را بگیرید و در پونیچالا وارد جادهٔ S6 شوید که تابلوهایش مارنئولی و مرز ارمنستان
    را نشان می‌دهد: ۴۲ کیلومتر، حدود ۵۰ دقیقه. S6 تنها در چند کیلومتر نخست چهاربانده است؛ پس از آن جاده‌ای
    دوبانده و پرتردد است که از رشته‌ای از روستاها می‌گذرد و پر از کامیون‌هایی است که راهی ارمنستان و آذربایجان‌اند،
    پس با حوصله سبقت بگیرید. در کودا، جادهٔ Sh31 به سوی تسالکا جدا می‌شود. در مارنئولی، جادهٔ S7 به سوی
    سادَخلو از میدان مرکزی شهر آغاز می‌شود. پمپ بنزین فراوان است، اما صبح‌ها جای پارک نزدیک بازار کم است.
    خودروی کلاس اقتصادی کاملاً کافی است.
he:
  name: מרנאולי
  short: >-
    עיירת שוק על נהר האלגתי, שבה גאורגית ואזרית חולקות את הרחוב, התה מוגש בקנקן, ובמרבדה הסמוכה נלחם סאאקדזה
    ב־1625 בספווים.
  body: >-
    **חמישים דקות דרומית לטביליסי, במרנאולי, משתנה השפה ברחוב, משתנה הלחם, ומשתנה גם קצב היום.**


    העיירה שוכנת על נהר האלגתי, בדרום השטוח והפורה של קוומו קרתלי, קרוב גם לגבול ארמניה וגם לגבול אזרבייג'ן.
    במפקד 2014 היו 83% מ־20,000 תושביה אזרים, אזרחי גאורגיה. אפילו לשמה יש שתי גרסאות: חוקרים גאורגים
    קושרים את "מרנאולי" למילה "מרני", מרתף יין, ואילו האזרים קוראים לעיר סרוואן, ממילה פרסית שפירושה נוהג
    גמלים. עד 1947 נקראה פשוט בורצ'לו, ומעמד של עיר קיבלה רק ב־1964. מסגד האימאם עלי והכנסיות על שם גאורגיוס
    הקדוש ועל שם וחטנג גורגסלי ניצבים זה לצד זה ברחובותיה.


    המישור השקט הזה שימש מאז ומעולם דרך לצבאות. ב־1 ביולי 1625, בשדה מרבדה שמעט צפונה מכאן, כמעט הצליחו
    הגאורגים של גיורגי סאאקדזה לשבור את הצבא הספווי של עיסא חאן, אך לבסוף הובסו, והפרסים נכנסו לטביליסי.
    בדצמבר 1918 נלחמו גאורגים וארמנים לצד נהר החראמי, 8 ק"מ דרומה; ב־1921 עבר כאן הצבא האדום בדרכו לטביליסי;
    וב־8 באוגוסט 2008 הפציצו מטוסים רוסיים את שדה התעופה של העיר, ושלושה בני אדם נהרגו.


    ובכל זאת, מה שמביא לכאן מבקרים הוא יום עבודה רגיל. השוק המרכזי אינו בזאר מזכרות אלא הלב המסחרי של
    מחוז חקלאי: צרורות שמנים של עשבי תיבול, עגבניות ותפוחי אדמה מן המישור, תבלינים, בדים וכלי עבודה. אכלו
    איפה שהמקומיים אוכלים — לחם מתנור חרס, קוטאב, קבב — ואחר כך התיישבו בבית תה, שבו התה מגיע בקנקן ולא
    בכוס.


    אין למרנאולי אנדרטה מפוארת להראות לכם. האנדרטה שלה היא חיי היומיום, שנחיים בשתי שפות.
  tip: >-
    שעתיים מספיקות לשוק ולארוחת צהריים נינוחה. בואו בבוקר: לפני הצהריים הדוכנים עמוסים ביותר, ואחר הצהריים
    מתחילים לקפל אותם. קחו מזומן בשטרות קטנים, כי לא בכל מקום מקבלים כרטיסי אשראי, ובמעברים הצפופים החזיקו
    את התיק לפניכם. בקשו רשות לפני שאתם מצלמים אנשים. הקיץ במישור חם וכמעט נטול צל, ולכן האביב והסתיו
    נעימים יותר. רוסית, או כמה מילים באזרית, פותחות דלתות, ובבתי התה מקבלים אורחים בחום.
  route: >-
    צאו מטביליסי בכביש לרוסטאווי, ובפוניצ'אלה עלו על כביש S6, המשולט למרנאולי ולגבול ארמניה: 42 ק"מ, כ־50
    דקות. ל־S6 יש ארבעה נתיבים רק בקילומטרים הראשונים; אחר כך זהו כביש עמוס, נתיב אחד לכל כיוון, שעובר
    בשורה של כפרים ומלא משאיות בדרכן לארמניה ולאזרבייג'ן, אז עקפו בסבלנות. בקודה מתפצל ממנו כביש Sh31
    לכיוון צלקה. במרנאולי מתחיל כביש S7 לסדחלו בכיכר המרכזית. תחנות דלק יש לרוב, אבל בבוקר קשה למצוא חניה
    ליד השוק. רכב בקטגוריית אקונומי מספיק בהחלט.
ar:
  name: مارنيولي
  short: >-
    بلدة سوق على نهر ألغيتي، تتقاسم فيها الجورجية والأذربيجانية الشارع، ويُقدَّم الشاي بالإبريق، وعلى
    مقربة منها، في مارابدا، قاتل ساكادزه الصفويين عام 1625.
  body: >-
    **على بُعد خمسين دقيقة جنوب تبليسي، في مارنيولي، تتغيّر لغة الشارع، ويتغيّر الخبز، ويتغيّر معهما إيقاع
    النهار.**


    تقع البلدة على نهر ألغيتي في جنوب كفيمو كارتلي المنبسط الخصيب، قريباً من الحدود الأرمينية والأذربيجانية
    معاً. وفي تعداد عام 2014 كان 83% من سكانها العشرين ألفاً من الأذربيجانيين مواطني جورجيا. حتى اسمها
    له روايتان: يربط الباحثون الجورجيون اسم مارنيولي بكلمة "ماراني"، أي قبو النبيذ، بينما يسمّيها الأذربيجانيون
    ساروان، من كلمة فارسية تعني الجمّال. وظلّ اسمها حتى عام 1947 بورتشالو ببساطة، ولم تنل صفة المدينة
    إلا عام 1964. وفي شوارعها يتجاور مسجد الإمام علي وكنيسة القديس جاورجيوس وكنيسة فاختانغ غورغاسالي.


    لطالما كان هذا السهل الهادئ ممراً للجيوش. ففي 1 يوليو/تموز 1625، في سهل مارابدا إلى الشمال مباشرة،
    كادت قوات غيورغي ساكادزه الجورجية تكسر الجيش الصفوي بقيادة عيسى خان، قبل أن تُمنى بهزيمة ساحقة، فدخل
    الفرس تبليسي. وفي ديسمبر/كانون الأول 1918 تقاتل الجورجيون والأرمن عند نهر خرامي، على بُعد 8 كم جنوباً؛
    وفي عام 1921 مرّ الجيش الأحمر من هنا في طريقه إلى تبليسي؛ وفي 8 أغسطس/آب 2008 قصفت طائرات روسية مطار
    البلدة فقُتل ثلاثة أشخاص.


    ومع ذلك فإن ما يجذب الزائر إلى هنا هو يوم عمل عادي. فالسوق المركزي ليس بازاراً للتذكارات، بل القلب
    التجاري لمنطقة زراعية: حُزم ممتلئة من الأعشاب، وطماطم وبطاطا من السهل، وتوابل، وأقمشة، وعُدد وأدوات.
    كُل حيث يأكل أهل البلدة — خبز التنّور الطيني، والقُطاب، والكباب — ثم اجلس في مقهى شاي، حيث يصل الشاي
    بالإبريق لا بالكوب.


    ليس في مارنيولي نُصبٌ مهيب تريك إياه. نُصبها هو الحياة اليومية، تُعاش بلغتين.
  tip: >-
    تكفي ساعتان للسوق ولغداء على مهل. تعالَ صباحاً: تكون البسطات في أوج امتلائها قبل الظهر، ثم يبدأ الباعة
    بلملمتها بعده. احمل نقوداً من الفئات الصغيرة، إذ لا تُقبل البطاقات في كل مكان، وأبقِ حقيبتك أمامك
    في الممرات المزدحمة. استأذن قبل تصوير الناس. الصيف في السهل حارّ يكاد يخلو من الظل، لذا فالربيع والخريف
    ألطف. الروسية، أو بضع كلمات أذربيجانية، تفتح الأبواب، ومقاهي الشاي ترحّب بالزوار بحرارة.
  route: >-
    اخرج من تبليسي على طريق روستافي، وعند بونيتشالا انعطف إلى الطريق S6 الذي تشير لافتاته إلى مارنيولي
    والحدود الأرمينية: 42 كم، نحو 50 دقيقة. لا يتسع S6 لأربعة مسارب إلا في كيلومتراته الأولى؛ بعدها يصبح
    طريقاً مزدحماً بمسرب واحد في كل اتجاه، يعبر سلسلة من القرى ويعجّ بالشاحنات المتجهة إلى أرمينيا وأذربيجان،
    فتحلَّ بالصبر عند التجاوز. عند كودا يتفرّع منه الطريق Sh31 نحو تسالكا. وفي مارنيولي يبدأ الطريق S7
    إلى ساداخلو من الدوّار المركزي. محطات الوقود كثيرة، لكن إيجاد موقف قرب السوق صعب في الصباح. تكفيك
    سيارة من الفئة الاقتصادية.
