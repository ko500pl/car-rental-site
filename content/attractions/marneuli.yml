ka:
  name: მარნეული
  short: ქვემო ქართლის სასოფლო-სამეურნეო ცენტრი და საქართველოს აზერბაიჯანული თემის გული, დიდი ბაზრით.
  body: >-
    **მარნეული საქართველოს იმ ნაწილშია, სადაც ენა, სამზარეულო და დღის რიტმი სხვაა.** ქალაქი ქვემო ქართლის
    ნაყოფიერ ველზე დგას, თბილისიდან ორმოცდაათ წუთში, და მუნიციპალიტეტის მოსახლეობის უმრავლესობა ეთნიკური
    აზერბაიჯანელია. ქუჩაში ორივე ენა ისმის, აბრები ხშირად ორივეზეა.


    ეს ქვეყნის ბოსტანია. მარნეულის ველი საქართველოს ბაზრებს ამარაგებს ბოსტნეულით — პომიდვრით, მწვანილით,
    კარტოფილით — და გაზაფხულის პირველი მოსავალიც აქედან მოდის. სასათბურე მეურნეობა ბოლო ათწლეულში მკვეთრად
    გაიზარდა და გზისპირას პლასტმასის სათბურების მთელი ველებია. მარნეული ამავე დროს საგზაო კვანძია: აქედან
    გზა იყოფა სადახლოსა და სომხეთის საზღვრისკენ და წითელი ხიდისა და აზერბაიჯანისკენ, ამიტომ ქალაქზე გამავალი
    მოძრაობის დიდი ნაწილი სამ ქვეყანას შორის მიმავალი სატვირთოებია.


    ცენტრში დიდი ბაზარია და სწორედ ის არის მთავარი მიზეზი მოსვლისა. ეს არა სუვენირების, არამედ ნამდვილი
    სამუშაო ბაზარია: ბოსტნეულის რიგები, ხორცის სექცია, სანელებლები, ქსოვილი, სამეურნეო ნივთები. საჭმელი
    ცალკე ღირს — თონეში გამომცხვარი პური, ქუთაბი, სამსა, აზერბაიჯანული სტილის მწვადი და ჩაიხანა, სადაც
    ჩაი მოცულობით ისმევა.


    გულწრფელად: მარნეულში არქიტექტურული ძეგლი და მუზეუმი არ არის. ეს ტიპური სამხრეთკავკასიური სამუშაო
    ქალაქია — მტვრიანი, ხმაურიანი, პრაქტიკული. მაგრამ თუ თბილისში რამდენიმე დღეა ხართ და გინდათ ნახოთ,
    რომ საქართველო ერთგვაროვანი არ არის, ორმოცდაათწუთიანი გასვლა ამას ბევრ მუზეუმზე უკეთ გაჩვენებთ.
  tip: >-
    ორი საათი ბაზრისა და სადილისთვის საკმარისია. ბაზარი დილით ყველაზე ცოცხალია და შუადღის შემდეგ იშლება.
    ნაღდი ფული თან იქონიეთ — ბარათს ყველგან არ იღებენ. ბაზარში ვიწროა და ხალხმრავალი; ჩანთას თვალი ადევნეთ.
    ზაფხულში ველზე 35 გრადუსზე მეტია და ჩრდილი მცირეა. ტუალეტი ბაზრის ტერიტორიაზეა, მარტივი. ჩაიხანაში
    სტუმარს კარგად ხვდებიან, ცოტა რუსული ენაც გამოგადგებათ.
  route: >-
    თბილისიდან სამხრეთით მარნეულის მაგისტრალით — 42 კმ, დაახლოებით ორმოცდაათი წუთი. ეს არის სომხეთისა
    და აზერბაიჯანისკენ მიმავალი მთავარი გზა, ამიტომ სატვირთო მოძრაობა მკვრივია და გამოსწრება ფრთხილად
    სჭირდება. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. საწვავი მრავლადაა მარშრუტზე. ცენტრში პარკინგი
    უფასოა, მაგრამ ბაზრის ახლოს ადგილის პოვნა დილით რთულია.
en:
  name: Marneuli
  short: >-
    The agricultural centre of Kvemo Kartli and the heart of Georgia's Azerbaijani community, built around
    a large market.
  body: >-
    **Marneuli is the part of Georgia where the language, the food and the rhythm of the day all change.**
    The town sits on the fertile Kvemo Kartli plain, fifty minutes from Tbilisi, and the majority of the
    municipality's population is ethnic Azerbaijani. Both languages are spoken on the street and signs
    are often in both.


    This is the country's vegetable garden. The Marneuli plain supplies Georgian markets with tomatoes,
    herbs, potatoes and the first crops of spring. Greenhouse farming has expanded sharply over the past
    decade, and whole fields of plastic tunnels line the road in. Marneuli is also a road junction: from
    here the route divides towards Sadakhlo and the Armenian border and towards the Red Bridge and Azerbaijan,
    so much of the traffic through the town is freight moving between three countries.


    The large market in the centre is the main reason to come. It is not a souvenir market but a working
    one: rows of vegetables, a meat hall, spices, fabric, hardware. The food is worth the trip on its
    own — bread from the clay oven, qutab, samsa, Azerbaijani-style kebab, and tea houses where tea is
    drunk by the pot rather than the cup.


    Honestly: Marneuli has no architectural monument and no museum. It is a typical working South Caucasus
    town — dusty, noisy, practical. But if you have spent a few days in Tbilisi and want to see that Georgia
    is not one thing, this fifty-minute drive shows it better than most museums.
  tip: >-
    Two hours covers the market and lunch. The market is liveliest in the morning and thins out after
    midday. Carry cash — cards are not accepted everywhere. The aisles are narrow and crowded, so keep
    an eye on your bag. Summer on the plain runs above 35 degrees with little shade. Toilets exist in
    the market area and are basic. Tea houses are welcoming to visitors, and a little Russian helps.
  route: >-
    Head south from Tbilisi on the Marneuli highway — 42 km, about fifty minutes. This is the main route
    towards Armenia and Azerbaijan, so lorry traffic is heavy and overtaking needs care. The road is asphalt
    throughout and in good condition. Fuel stations are frequent along the way. Parking in the centre
    is free, but finding a space near the market in the morning takes patience.
ru:
  name: Марнеули
  short: >-
    Сельскохозяйственный центр Квемо-Картли и сердце азербайджанской общины Грузии, выросшее вокруг большого
    рынка.
  body: >-
    **Марнеули — та часть Грузии, где меняются язык, еда и ритм дня.** Город стоит на плодородной Квемо-Картлийской
    равнине, в пятидесяти минутах от Тбилиси, и большинство населения муниципалитета — этнические азербайджанцы.
    На улице звучат оба языка, вывески часто на обоих.


    Это огород страны. Марнеульская равнина снабжает грузинские рынки помидорами, зеленью, картофелем
    и первым весенним урожаем. За последнее десятилетие резко выросло тепличное хозяйство, и вдоль дороги
    тянутся целые поля плёночных теплиц. Марнеули к тому же дорожный узел: отсюда путь расходится к Садахло
    и армянской границе и к Красному мосту и Азербайджану, поэтому значительная часть транспорта через
    город — грузовики, идущие между тремя странами.


    Большой рынок в центре — главная причина приезда. Это не сувенирный, а рабочий рынок: ряды овощей,
    мясной павильон, специи, ткани, хозтовары. Еда стоит поездки сама по себе — хлеб из тонэ, кутабы,
    самса, кебаб по-азербайджански и чайханы, где чай пьют чайниками.


    Честно: в Марнеули нет ни архитектурного памятника, ни музея. Это типичный рабочий южнокавказский
    город — пыльный, шумный, практичный. Но если вы провели несколько дней в Тбилиси и хотите увидеть,
    что Грузия неоднородна, эта пятидесятиминутная поездка покажет это лучше многих музеев.
  tip: >-
    Двух часов хватит на рынок и обед. Рынок оживлённее всего утром, после полудня редеет. Берите наличные
    — карты принимают не везде. Проходы узкие и людные, следите за сумкой. Летом на равнине выше 35 градусов,
    тени мало. Туалеты на рынке есть, простые. В чайханах к гостям относятся хорошо, немного русского
    пригодится.
  route: >-
    Из Тбилиси на юг по марнеульской трассе — 42 км, примерно пятьдесят минут. Это главная дорога в сторону
    Армении и Азербайджана, поэтому грузовиков много и обгонять нужно аккуратно. Дорога асфальтированная
    и в хорошем состоянии. Заправки по пути встречаются часто. Парковка в центре бесплатная, но найти
    место у рынка утром непросто.
fa:
  name: مارنئولی
  short: مرکز کشاورزی کوهمو کارتلی و قلب جامعهٔ آذربایجانی گرجستان، شکل‌گرفته پیرامون بازاری بزرگ.
  body: >-
    **مارنئولی همان بخشی از گرجستان است که در آن زبان و خوراک و آهنگ روز، همه عوض می‌شوند.** شهر بر دشت
    حاصلخیز کوهمو کارتلی نشسته است، پنجاه دقیقه با تفلیس فاصله دارد، و بیشتر جمعیت شهرستان آذربایجانی‌تبارند.
    در خیابان هر دو زبان شنیده می‌شود و تابلوها اغلب به هر دو نوشته‌اند.


    اینجا سبزی‌کاریِ کشور است. دشت مارنئولی بازارهای گرجستان را با گوجه و سبزی و سیب‌زمینی و نخستین محصول
    بهار تأمین می‌کند. کشت گلخانه‌ای در دههٔ گذشته به‌شدت گسترش یافته و مزارعی یکسره از تونل‌های پلاستیکی
    کنار جادهٔ ورودی صف کشیده‌اند. مارنئولی در ضمن گره‌ای جاده‌ای است: از اینجا راه به سوی ساداخلو و مرز
    ارمنستان و به سوی پل سرخ و آذربایجان جدا می‌شود، پس بخش بزرگی از ترافیک عبوری شهر، باری است که میان
    سه کشور جابه‌جا می‌شود.


    بازار بزرگ مرکز شهر دلیل اصلی آمدن است. این بازار سوغات نیست، بازاری کاری است: ردیف‌های سبزی، تالار
    گوشت، ادویه، پارچه و ابزار. خوراک به‌تنهایی ارزش این راه را دارد — نان تنوری، قوتاب، سمسا، کباب به
    سبک آذربایجانی، و چایخانه‌هایی که در آنها چای را با قوری می‌نوشند نه با فنجان.


    صادقانه بگوییم: مارنئولی نه بنای تاریخی دارد نه موزه. شهری است کاری و معمول در قفقاز جنوبی — خاکی،
    پرهیاهو و عملی. اما اگر چند روزی در تفلیس بوده‌اید و می‌خواهید ببینید گرجستان یکدست نیست، این سفر
    پنجاه‌دقیقه‌ای آن را بهتر از بسیاری موزه‌ها نشان می‌دهد.
  tip: >-
    دو ساعت بازار و ناهار را می‌پوشاند. بازار صبح‌ها سرزنده‌ترین است و پس از ظهر خلوت می‌شود. پول نقد
    همراه ببرید — کارت همه‌جا پذیرفته نمی‌شود. راهروها باریک و شلوغ‌اند، پس مراقب کیف خود باشید. تابستان
    دشت از ۳۵ درجه بالاتر می‌رود و سایه کم است. سرویس بهداشتی در محوطهٔ بازار هست و ساده است. در چایخانه‌ها
    با مهمان خوب برخورد می‌کنند و اندکی روسی به کار می‌آید.
  route: >-
    از تفلیس به جنوب روی بزرگراه مارنئولی — ۴۲ کیلومتر، حدود پنجاه دقیقه. این مسیر اصلی به سوی ارمنستان
    و آذربایجان است، پس تردد کامیون سنگین است و سبقت احتیاط می‌خواهد. جاده تا انتها آسفالت و در وضعیت
    خوبی است. پمپ بنزین در طول راه فراوان است. پارک در مرکز رایگان است، اما یافتن جا نزدیک بازار در صبح
    حوصله می‌خواهد.
he:
  name: מרנאולי
  short: מרכז החקלאות של קוומו קרתלי ולב הקהילה האזרית בגאורגיה, שנבנה סביב שוק גדול.
  body: >-
    **מרנאולי היא החלק של גאורגיה שבו משתנים השפה, האוכל וקצב היום.** העיירה יושבת על מישור קוומו קרתלי
    הפורה, חמישים דקות מטביליסי, ורוב אוכלוסיית המחוז היא אזרית. שתי השפות נשמעות ברחוב והשלטים לרוב בשתיהן.


    זהו גן הירק של המדינה. מישור מרנאולי מספק לשווקי גאורגיה עגבניות, עשבי תיבול, תפוחי אדמה ואת יבולי
    האביב הראשונים. גידול בחממות התרחב מאוד בעשור האחרון, ושדות שלמים של מנהרות פלסטיק משתרעים לצד הכביש
    הנכנס. מרנאולי היא גם צומת דרכים: מכאן מתפצל הציר לכיוון סאדחלו וגבול ארמניה ולכיוון הגשר האדום ואזרבייג'ן,
    ולכן חלק ניכר מן התנועה בעיירה הוא משאות הנעים בין שלוש מדינות.


    השוק הגדול במרכז הוא הסיבה העיקרית לבוא. אין זה שוק מזכרות אלא שוק עובד: שורות ירקות, אולם בשר, תבלינים,
    בדים וכלי עבודה. האוכל שווה את הנסיעה בפני עצמו — לחם מתנור חרס, קוטאב, סמסה, קבב בסגנון אזרי, ובתי
    תה שבהם שותים תה בקנקנים ולא בכוסות.


    בכנות: אין במרנאולי אתר אדריכלי ואין מוזיאון. זו עיירת עבודה טיפוסית של דרום הקווקז — מאובקת, רועשת,
    מעשית. אך אם בילית כמה ימים בטביליסי ורוצה לראות שגאורגיה אינה דבר אחד, נסיעה של חמישים דקות מראה
    זאת טוב יותר מרוב המוזיאונים.
  tip: >-
    שעתיים מכסות את השוק וארוחת צהריים. השוק ער ביותר בבוקר ומידלדל אחרי הצהריים. קחו מזומן — כרטיסים
    אינם מתקבלים בכל מקום. המעברים צרים וצפופים, לכן שימו לב לתיק. בקיץ המישור עובר 35 מעלות ויש מעט צל.
    שירותים קיימים בשטח השוק והם בסיסיים. בבתי התה מקבלים אורחים יפה, וקצת רוסית עוזרת.
  route: >-
    צאו מטביליסי דרומה בכביש מרנאולי — 42 ק״מ, כחמישים דקות. זהו הציר הראשי לכיוון ארמניה ואזרבייג'ן,
    ולכן תנועת המשאיות כבדה והעקיפה דורשת זהירות. הכביש סלול לכל אורכו ובמצב טוב. תחנות דלק מצויות לאורך
    הדרך. החניה במרכז חינם, אך למצוא מקום ליד השוק בבוקר דורש סבלנות.
ar:
  name: مارنئولي
  short: المركز الزراعي لكفيمو كارتلي وقلب الجالية الأذربيجانية في جورجيا، قائم حول سوق كبيرة.
  body: >-
    **مارنئولي هي الجزء من جورجيا الذي تتبدل فيه اللغة والطعام وإيقاع النهار.** تجلس البلدة على سهل كفيمو
    كارتلي الخصب، على بعد خمسين دقيقة من تبليسي، وأغلب سكان البلدية من أصل أذربيجاني. وتُسمع اللغتان في
    الشارع، واللافتات غالباً بهما معاً.


    هذه بستان البلاد. يمدّ سهل مارنئولي أسواق جورجيا بالطماطم والبقول الورقية والبطاطا وأول محاصيل الربيع.
    وقد توسعت الزراعة المحمية بشدة في العقد الأخير، وتصطف حقول كاملة من الأنفاق البلاستيكية على جانبي
    طريق الدخول. ومارنئولي كذلك ملتقى طرق: فمن هنا ينقسم المسار نحو ساداخلو والحدود الأرمينية ونحو الجسر
    الأحمر وأذربيجان، ولذلك فإن جزءاً كبيراً من الحركة عبر البلدة شحن يتنقل بين ثلاث دول.


    والسوق الكبيرة في المركز هي السبب الرئيسي للمجيء. ليست سوق تذكارات بل سوق عمل: صفوف الخضار، وقاعة
    اللحم، والبهارات، والأقمشة، والعدد. والطعام وحده يستحق الرحلة — خبز من الفرن الطيني، وقوتاب، وسمسا،
    وكباب على الطريقة الأذربيجانية، وبيوت شاي يُشرب فيها الشاي بالإبريق لا بالفنجان.


    وبصراحة: لا أثر معمارياً في مارنئولي ولا متحف. إنها بلدة عمل نموذجية في جنوب القوقاز — مغبرة، صاخبة،
    عملية. لكن إن أمضيت أياماً في تبليسي وأردت أن ترى أن جورجيا ليست شيئاً واحداً، فهذه الرحلة التي تستغرق
    خمسين دقيقة تُظهر ذلك أفضل من كثير من المتاحف.
  tip: >-
    ساعتان تغطيان السوق والغداء. والسوق أنشط ما تكون صباحاً وتخفّ بعد الظهر. واحمل نقداً — فالبطاقات لا
    تُقبل في كل مكان. والممرات ضيقة مزدحمة، فانتبه لحقيبتك. وصيف السهل يتجاوز 35 درجة وظله قليل. ودورات
    المياه موجودة في نطاق السوق وهي بسيطة. وبيوت الشاي ترحب بالزائرين، وقليل من الروسية يساعد.
  route: >-
    اتجه جنوباً من تبليسي على طريق مارنئولي السريع — 42 كم، نحو خمسين دقيقة. وهذا هو المسار الرئيسي نحو
    أرمينيا وأذربيجان، فحركة الشاحنات كثيفة والتجاوز يحتاج حذراً. الطريق معبّد بكامله وبحالة جيدة. ومحطات
    الوقود متقاربة على امتداده. والوقوف في المركز مجاني، لكن إيجاد مكان قرب السوق صباحاً يحتاج صبراً.
