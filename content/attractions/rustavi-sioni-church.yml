ka:
  name: რუსთავის სიონი
  short: >-
    თავად რუსთაველების მიერ ხელით ნაკვეთი ქვიშაქვის ტაძარი, კვერცხის გულით შეზავებული დუღაბით — IX მიკრორაიონის
    ბეტონის კორპუსებს შორის.
  body: >-
    **ფოლადისთვის აშენებულ ქალაქში რუსთაველები ათი წელი ხელით აშენებდნენ ტაძარს — და დუღაბში, XI საუკუნის
    ოსტატების მსგავსად, კვერცხის გულს ურევდნენ.**


    რუსთავი ახალგაზრდა ქალაქია ძველი სახელით. მტკვრის პირას ქალაქი სულ მცირე ძვ. წ. V–IV საუკუნეებში უკვე
    იდგა და ძველი იბერიის ერთ-ერთი პოლიტიკური და ადმინისტრაციული ცენტრი იყო, ვიდრე თემურ-ლენგის ლაშქრობებმა
    საბოლოოდ არ გაანადგურა. დღევანდელი რუსთავი კი 1948 წლის 19 იანვრის დადგენილებით დაფუძნდა და მეტალურგიული
    ქარხნის ირგვლივ გაიზარდა. ტაძარი ამ გეგმაში არ ეწერა.


    სიონი მოგვიანებით და ნელა მოვიდა. მშენებლობას ათი წელი დასჭირდა, ხელმძღვანელობდა არქიტექტორი თემურ
    ბურკიაშვილი, მშენებლები კი ქალაქის მცხოვრებთაგან შეარჩიეს — უმეტესად საერო პირები, რომლებმაც ხელობა
    საქმეში ისწავლეს. ფასადისა და ინტერიერის ქვას თავად ეზიდებოდნენ, ჭრიდნენ და კვეთდნენ — მთლიანად ხელით.
    XI საუკუნის წესს ბოლომდე — კვერცხის გულამდე — მიჰყვნენ. ტაძარი 2011 წელს აკურთხეს.


    ნიმუშებს ადვილად ამოიცნობთ, თუ იცნობთ: ჯვრის ფორმის გეგმა და ფასადი რაჭის ნიკორწმინდიდან მოდის, ქვიშაქვა
    კი მცხეთის სვეტიცხოველსა და თბილისის ანჩისხატს მოგვაგონებს. კედლებს ნელა შემოუარეთ და ჩუქურთმას ახლოდან
    შეხედეთ. ეს ძველი ნაშენის რესტავრაცია კი არა, ძველებურად შესრულებული ახალი ნამუშევარია — იმ ადამიანებისა,
    რომლებიც საქმის დაწყებისას ქვისმთლელები არ იყვნენ.


    ტაძარი წრიულ გზაჯვარედინთან, მრავალსართულიან კორპუსებს შორის დგას — და სწორედ ესაა მთავარი.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი სამრევლო ტაძარია: მხრები და მუხლები დაფარული, ქალებს — თავსაფარი, კაცებს
    — ქუდი მოხდილი, ხმა — დაბალი. შიგნით გადაღებამდე ნებართვა ითხოვეთ, მსახურების დროს კი საერთოდ ნუ გადაიღებთ.
    ნახევარი საათი საკმარისია ინტერიერისთვისაც და გარედან ნელი შემოვლისთვისაც — ხელით ნაკვეთი ქვა ახლო
    მზერას იმსახურებს. მანქანა წრიულ გზაჯვარედინთან, ქუჩაზე დააყენეთ. რუსთავის ისტორიის მუზეუმი ქალაქის
    მეორე ბოლოში, 3,6 კილომეტრშია, მაგრამ ორშაბათობით დაკეტილია — ორივე სამშაბათიდან კვირამდე დაგეგმეთ.
    რუსთავი დაახლოებით 130 000 მოსახლის ქალაქია, ასე რომ, ყავასა და სადილს შორს არ მოგიწევთ ძებნა.
  route: >-
    თბილისის ცენტრიდან მარჯვენა სანაპიროს სამხრეთ-აღმოსავლეთით გაჰყევით რუსთავის გზატკეცილამდე — ს4-მდე
    (თბილისი — წითელი ხიდი), რომელიც მშრალ ველს სწორი ორმხრივი მაგისტრალით კვეთს. რუსთავის გასასვლელზე
    გადაუხვიეთ და ქალაქში IX მიკრორაიონამდე იარეთ; ტაძარი იქაურ წრიულ გზაჯვარედინთან დგას. სულ დაახლოებით
    25 კმ და 30 წუთია, დილისა და საღამოს საცობებში — ცოტა მეტი. გზა ბოლომდე ასფალტიანია, ამიტომ ნებისმიერი
    ეკონომკლასის მანქანა გამოდგება, წლის ნებისმიერ დროს; ბენზინგასამართი სადგურები ს4-ზე ბევრია. ქუჩაში
    პარკირება უფასოა.
en:
  name: Rustavi Sioni Church
  short: >-
    A sandstone church carved by hand by Rustavi's own residents, with egg yolk in the mortar, among the
    concrete blocks of the 9th microdistrict.
  body: >-
    **In a city built for steel, a group of Rustavi residents spent a decade raising a church by hand
    — and mixed egg yolk into the mortar, as masons did in the 11th century.**


    Rustavi is an old name on a young city. A town stood here on the Mtkvari at least by the 5th–4th centuries
    BC and served as a political and administrative centre of ancient Iberia until the invasions of Timur
    finished it off. The Rustavi you drive into today was declared by decree on 19 January 1948 and grew
    up around a metallurgical plant. Churches were not part of that plan.


    Sioni came later, and slowly. The work took about ten years under the architect Temur Burkiashvili,
    and the builders were chosen from among the city's residents — most of them lay people who learned
    the trade on site. They transported, cut and carved the stone for the façade and interior entirely
    by hand, following 11th-century practice down to the egg yolk. The church was consecrated in 2011.


    Its models are easy to read if you know them: the cross-shaped design and the façade take their cue
    from Nikortsminda Cathedral in Racha, while the sandstone recalls Svetitskhoveli in Mtskheta and Anchiskhati
    in Tbilisi. Walk round the walls slowly and look at the carving at arm's length. This is not restored
    old work but new work done the old way, by people who were not stonemasons when they began.


    It stands just off a roundabout, among apartment blocks — which is precisely the point.
  tip: >-
    Entry is free. It is a working parish church: shoulders and knees covered, a headscarf for women,
    hats off for men, and voices low. Ask before photographing inside, and never during a service. Half
    an hour is enough to take in the interior and walk slowly round the outside, where the hand-carved
    stone rewards a close look. Park on the street near the roundabout. The Rustavi History Museum is
    3.6 km away across town, but it is closed on Mondays — plan the pair for Tuesday to Sunday. Rustavi
    is a city of some 130,000 people, so coffee and lunch are never far.
  route: >-
    From central Tbilisi follow the right-bank embankment south-east to the Rustavi highway, the S4 (Tbilisi
    – Red Bridge), a straight dual carriageway across the dry plain. Take the exit for Rustavi and continue
    through the city to the 9th microdistrict; the church is just off the roundabout there. The whole
    trip is about 25 km and 30 minutes, a little more when commuter traffic is heavy. Asphalt all the
    way, so any economy car is fine, in any season, and fuel stations line the S4. Street parking is free.
ru:
  name: Церковь Сиони в Рустави
  short: >-
    Церковь из песчаника, которую жители Рустави вытесали своими руками, с яичным желтком в растворе —
    среди бетонных корпусов 9-го микрорайона.
  body: >-
    **В городе, построенном ради стали, группа жителей Рустави десять лет возводила церковь вручную —
    и добавляла в раствор яичный желток, как делали каменщики XI века.**


    Рустави — старое имя молодого города. Город на Мтквари стоял здесь по меньшей мере с V–IV веков до
    н. э. и был политическим и административным центром древней Иберии, пока его не добили нашествия Тимура.
    Нынешний Рустави, в который вы въезжаете, учреждён указом 19 января 1948 года и вырос вокруг металлургического
    завода. Церквей в этом плане не было.


    Сиони появилась позже — и неспешно. Работа заняла около десяти лет под руководством архитектора Темура
    Буркиашвили, а строителей набирали из жителей города; большинство из них не были профессионалами и
    осваивали ремесло прямо на стройке. Камень для фасада и интерьера они перевозили, тесали и резали
    исключительно вручную, следуя практике XI века вплоть до яичного желтка. Церковь освятили в 2011 году.


    Её образцы легко узнать, если вы их знаете: крестообразный план и фасад восходят к собору Никорцминда
    в Раче, а песчаник напоминает о Светицховели в Мцхете и Анчисхати в Тбилиси. Обойдите стены не спеша
    и рассмотрите резьбу на расстоянии вытянутой руки. Это не отреставрированная старина, а новая работа,
    сделанная по-старому людьми, которые не были каменотёсами, когда начинали.


    Она стоит в двух шагах от кольцевой развязки, среди жилых домов, — и в этом весь смысл.
  tip: >-
    Вход свободный. Это действующая приходская церковь: плечи и колени закрыты, женщинам — платок, мужчинам
    — снять головной убор, говорить вполголоса. Спрашивайте разрешения, прежде чем фотографировать внутри,
    и никогда не снимайте во время службы. Получаса хватит, чтобы осмотреть интерьер и неспешно обойти
    церковь снаружи: камень ручной резьбы стоит того, чтобы разглядеть его вблизи. Машину оставьте на
    улице у кольца. Музей истории Рустави — в 3,6 км, на другом конце города, но по понедельникам он закрыт,
    так что планируйте оба места со вторника по воскресенье. В Рустави около 130 000 жителей, так что
    кофе и обед всегда рядом.
  route: >-
    Из центра Тбилиси следуйте по правобережной набережной на юго-восток до Руставского шоссе S4 (Тбилиси
    — Красный мост) — прямой трассы с разделительной полосой через сухую равнину. Сверните на съезд к
    Рустави и проезжайте через город до 9-го микрорайона; церковь стоит в двух шагах от тамошней кольцевой
    развязки. Весь путь — около 25 км и 30 минут, чуть дольше в часы пик. Асфальт на всём пути, так что
    подойдёт любая машина эконом-класса в любое время года; заправки стоят вдоль S4. Парковка на улице
    бесплатная.
fa:
  name: کلیسای سیونی روستاوی
  short: >-
    کلیسایی از ماسه‌سنگ که ساکنان خودِ روستاوی با دست تراشیدند و در ملاتش زردهٔ تخم‌مرغ ریختند، در میان
    بلوک‌های بتنی میکرورایون نهم.
  body: >-
    **در شهری که برای فولاد ساخته شد، گروهی از ساکنان روستاوی ده سال با دست کلیسایی برپا کردند — و در
    ملاتش زردهٔ تخم‌مرغ ریختند، همان‌گونه که سنگ‌کاران سدهٔ یازدهم می‌کردند.**


    روستاوی نامی کهن است بر شهری جوان. دست‌کم از سده‌های پنجم تا چهارم پیش از میلاد شهری در این‌جا بر
    کرانهٔ رود متکواری برپا بود که کانون سیاسی و اداری ایبریای باستان به شمار می‌رفت، تا آن‌که یورش‌های
    تیمور کارش را یکسره کرد. روستاوی‌ای که امروز واردش می‌شوید با فرمانی در ۱۹ ژانویه ۱۹۴۸ پدید آمد و
    پیرامون یک کارخانهٔ ذوب‌آهن رشد کرد. کلیسا جایی در آن طرح نداشت.


    سیونی دیرتر آمد، و آهسته. کار حدود ده سال به درازا کشید، به سرپرستی معمار تِمور بورکیاشویلی، و سازندگان
    از میان ساکنان شهر برگزیده شدند — بیشترشان مردمی بی‌پیشینه در این فن که آن را همان‌جا، سر کار، آموختند.
    آنان سنگِ نما و فضای درونی را یکسره با دست جابه‌جا کردند، بریدند و تراشیدند و تا زردهٔ تخم‌مرغ از
    شیوهٔ سدهٔ یازدهم پیروی کردند. کلیسا در سال ۲۰۱۱ تقدیس شد.


    الگوهایش برای آشنایان آسان خوانده می‌شود: طرح صلیبی و نمای آن از کلیسای جامع نیکورتسمیندا در راچا
    الهام گرفته، و ماسه‌سنگش یادآور سوتیتسخوولی در متسختا و آنچیسخاتی در تفلیس است. آرام دور دیوارها قدم
    بزنید و کنده‌کاری‌ها را از فاصلهٔ یک بازو تماشا کنید. این کارِ کهنِ مرمت‌شده نیست، بلکه کاری نو است
    به شیوهٔ کهن، به دست کسانی که در آغاز سنگ‌تراش نبودند.


    کلیسا درست کنار یک میدان، در میان مجتمع‌های آپارتمانی ایستاده است — و نکتهٔ درست همین است.
  tip: >-
    ورود رایگان است. این کلیسای فعالِ یک محله است: شانه‌ها و زانوها پوشیده، روسری برای بانوان، برداشتن
    کلاه برای آقایان، و صدای آهسته. پیش از عکاسی در داخل اجازه بگیرید و هرگز هنگام مراسم عبادت عکس نگیرید.
    نیم ساعت برای دیدن فضای درون و قدم‌زدنی آرام در بیرون کافی است؛ سنگِ دست‌تراش ارزش نگاهی از نزدیک
    را دارد. خودرو را کنار خیابان نزدیک میدان پارک کنید. موزهٔ تاریخ روستاوی ۳٫۶ کیلومتر دورتر، آن سوی
    شهر است، اما دوشنبه‌ها تعطیل است؛ پس دیدن هر دو را برای سه‌شنبه تا یکشنبه بگذارید. روستاوی شهری حدود
    ۱۳۰٬۰۰۰ نفری است، پس قهوه و ناهار هیچ‌گاه دور نیست.
  route: >-
    از مرکز تفلیس از خیابان ساحلی کرانهٔ راست رود به‌سوی جنوب‌شرقی بروید تا به بزرگراه روستاوی، S4 (تفلیس
    – پل سرخ)، برسید؛ جاده‌ای دوبانده و مستقیم که از دشت خشک می‌گذرد. از خروجی روستاوی بیرون بروید و از
    میان شهر تا میکرورایون نهم ادامه دهید؛ کلیسا درست کنار میدانِ آن‌جاست. کل مسیر حدود ۲۵ کیلومتر و ۳۰
    دقیقه است، و در ساعات شلوغیِ رفت‌وآمد کمی بیشتر. سراسر راه آسفالت است، پس هر خودروی اقتصادی در هر
    فصلی از پسش برمی‌آید، و جایگاه‌های سوخت در امتداد S4 پشت سر هم‌اند. پارک کنار خیابان رایگان است.
he:
  name: כנסיית סיוני ברוסתאווי
  short: כנסיית אבן חול שתושבי רוסתאווי עצמם סיתתו בידיהם, עם חלמון ביצה בטיט, בין גושי הבטון של המיקרו-רובע
    התשיעי.
  body: >-
    **בעיר שנבנתה בשביל הפלדה, קבוצה מתושבי רוסתאווי הקדישה עשור להקמת כנסייה בעבודת יד — וערבבה חלמון
    ביצה בטיט, כפי שעשו הבנאים במאה ה-11.**


    רוסתאווי היא שם עתיק לעיר צעירה. לפחות מהמאות ה-5–4 לפני הספירה עמדה כאן עיר על גדות המטקווארי, והיא
    שימשה מרכז פוליטי ומנהלי של איבריה העתיקה עד שפלישות טימור הביאו עליה את קצה. רוסתאווי שאליה אתם נכנסים
    היום הוכרזה בצו ב-19 בינואר 1948 וצמחה סביב מפעל מטלורגי. כנסיות לא היו חלק מהתוכנית.


    סיוני הגיעה מאוחר יותר, ולאט. העבודה נמשכה כעשר שנים בהנהגת האדריכל טמור בורקיאשווילי, והבונים נבחרו
    מקרב תושבי העיר — רובם אנשים מן השורה בלי הכשרה, שלמדו את המלאכה תוך כדי עבודה. הם הובילו, חצבו וסיתתו
    את האבן לחזית ולפנים הכנסייה בעבודת יד בלבד, בהתאם לנוהג המאה ה-11, עד לחלמון הביצה. הכנסייה הוקדשה
    ב-2011.


    קל לזהות את המודלים שלה אם מכירים אותם: התוכנית בצורת צלב והחזית שואבות השראה מקתדרלת ניקורצמינדה
    ברצ'ה, ואבן החול מזכירה את סווטיצחובלי במצחתה ואת אנצ'יסחאטי בטביליסי. הקיפו את הקירות לאט והתבוננו
    בגילופים ממרחק זרוע. זו לא עבודה עתיקה ששוחזרה, אלא עבודה חדשה שנעשתה בדרך הישנה, בידי אנשים שלא היו
    סתתים כשהתחילו.


    היא עומדת ממש ליד כיכר תנועה, בין בנייני מגורים — וזה בדיוק העניין.
  tip: >-
    הכניסה חופשית. זו כנסיית קהילה פעילה: כתפיים וברכיים מכוסות, כיסוי ראש לנשים, גברים מסירים כובע, ומדברים
    בשקט. בקשו רשות לפני שמצלמים בפנים, ולעולם לא בזמן תפילה. חצי שעה מספיקה כדי להתרשם מהפנים ולהקיף
    לאט את החוץ, שם האבן המסותתת ביד שווה מבט מקרוב. חנו ברחוב ליד הכיכר. מוזיאון ההיסטוריה של רוסתאווי
    נמצא 3.6 ק"מ משם, בצד השני של העיר, אבל הוא סגור בימי שני — תכננו את שניהם לימים שלישי עד ראשון. ברוסתאווי
    כ-130,000 תושבים, כך שקפה וארוחת צהריים אף פעם לא רחוקים.
  route: >-
    ממרכז טביליסי סעו דרומה-מזרחה לאורך הכביש שעל הגדה הימנית של הנהר עד כביש רוסתאווי, S4 (טביליסי –
    הגשר האדום), כביש דו-מסלולי ישר שחוצה את המישור היבש. צאו במחלף לרוסתאווי והמשיכו דרך העיר עד המיקרו-רובע
    התשיעי; הכנסייה נמצאת ממש ליד הכיכר שם. כל הדרך כ-25 ק"מ ו-30 דקות, מעט יותר בשעות העומס. אספלט לכל
    אורך הדרך, כך שכל רכב חסכוני מתאים, בכל עונה, ותחנות דלק פזורות לאורך S4. החניה ברחוב חינם.
ar:
  name: كنيسة سيوني في روستافي
  short: >-
    كنيسة من الحجر الرملي نحتها سكان روستافي أنفسهم بأيديهم، وفي ملاطها صفار البيض، بين الكتل الخرسانية
    للحي السكني التاسع.
  body: >-
    **في مدينة شُيّدت من أجل الفولاذ، أمضت مجموعة من سكان روستافي عقدًا كاملًا يبنون كنيسة بأيديهم، ومزجوا
    صفار البيض بالملاط كما كان البنّاؤون يفعلون في القرن الحادي عشر.**


    روستافي اسمٌ قديم لمدينة فتية. فقد قامت هنا مدينة على نهر متكفاري منذ القرنين الخامس والرابع قبل الميلاد
    على الأقل، وكانت مركزًا سياسيًا وإداريًا لأيبيريا القديمة إلى أن قضت عليها غزوات تيمور. أما روستافي
    التي تدخلها اليوم فقد أُعلنت بمرسوم في 19 يناير 1948، ونمت حول مجمّع للصناعات المعدنية. ولم تكن الكنائس
    جزءًا من ذلك المخطط.


    جاءت سيوني لاحقًا، وعلى مهل. استغرق العمل نحو عشر سنوات بإشراف المهندس المعماري تيمور بوركياشفيلي،
    واختير البنّاؤون من بين سكان المدينة، ومعظمهم من غير أهل الصنعة تعلّموها في الموقع نفسه. نقلوا حجارة
    الواجهة والداخل وقطعوها ونحتوها بأيديهم وحدها، متّبعين أصول القرن الحادي عشر حتى في صفار البيض. وكُرّست
    الكنيسة عام 2011.


    نماذجها سهلة القراءة لمن يعرفها: فالتصميم الصليبي والواجهة مستوحيان من كاتدرائية نيكورتسميندا في راتشا،
    والحجر الرملي يستحضر سفيتيتسخوفيلي في متسخيتا وأنتشيسخاتي في تبليسي. دُر حول الجدران ببطء وتأمّل النقوش
    على مسافة ذراع. ليس هذا عملًا قديمًا مرمَّمًا، بل عملٌ جديد أُنجز على الطريقة القديمة، بأيدي أناسٍ
    لم يكونوا نحّاتي حجر حين بدأوا.


    تقف الكنيسة على مقربة من دوّار، بين العمارات السكنية، وهنا بالضبط تكمن الفكرة.
  tip: >-
    الدخول مجاني. هذه كنيسة رعية عاملة: غطِّ الكتفين والركبتين، وعلى النساء غطاء للرأس، وعلى الرجال خلع
    القبعات، مع خفض الصوت. استأذن قبل التصوير في الداخل، ولا تصوّر أبدًا أثناء القداس. نصف ساعة تكفي لتأمل
    الداخل والتجوّل ببطء حول المبنى من الخارج، حيث يستحق الحجر المنحوت يدويًا نظرة عن قرب. اركن سيارتك
    في الشارع قرب الدوّار. يقع متحف تاريخ روستافي على بعد 3.6 كم في الطرف الآخر من المدينة، لكنه مغلق
    أيام الاثنين، فخطّط لزيارتهما معًا بين الثلاثاء والأحد. يسكن روستافي نحو 130,000 نسمة، فالقهوة والغداء
    ليسا بعيدين أبدًا.
  route: >-
    من وسط تبليسي اتبع طريق الضفة اليمنى نحو الجنوب الشرقي حتى طريق روستافي السريع S4 (تبليسي – الجسر
    الأحمر)، وهو طريق مزدوج مستقيم يعبر السهل الجاف. اسلك مخرج روستافي وتابع عبر المدينة حتى الحي السكني
    التاسع؛ الكنيسة على مقربة من الدوّار هناك. تبلغ الرحلة كلها نحو 25 كم و30 دقيقة، وأكثر قليلًا حين
    تشتد حركة المرور في ساعات الذروة. الطريق معبّد بالكامل، فأي سيارة اقتصادية تفي بالغرض في أي فصل، ومحطات
    الوقود منتشرة على طول S4. الوقوف في الشارع مجاني.
