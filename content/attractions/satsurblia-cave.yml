ka:
  name: საწურბლიის მღვიმე
  short: >-
    კარსტული მღვიმე პრომეთეს მღვიმის მახლობლად, სადაც 13 300 წლის ძვლიდან წაკითხულმა გენომმა კავკასიელ
    მონადირე-შემგროვებელთა შტო გამოავლინა.
  body: >-
    **2013 წელს არქეოლოგებმა ამ მღვიმის იატაკიდან ადამიანის თავის ქალის ნატეხი ამოიღეს, გენეტიკოსებმა
    კი მისგან დაახლოებით 13 300 წლის წინ გარდაცვლილი მამაკაცის გენომი წაიკითხეს.**


    საწურბლია სათაფლია-წყალტუბოს კირქვულ მასივში გაჩენილი კარსტული მღვიმეა, სოფელ კუმისთავიდან 1,2 კილომეტრში,
    განათებული პრომეთეს მღვიმის მახლობლად. დაახლოებით ექვსმეტრიანი შესასვლელი 80-მეტრიან გვირაბში გადადის,
    რომელიც ციცაბოდ ეშვება მეტრიანი და უფრო მაღალი ბუნებრივი კლდოვანი საფეხურებით. შესასვლელიდან დაახლოებით
    125 მეტრში დიდი დარბაზია, 30 მეტრი 25-ზე. აქ პირველი გათხრები 1976 წელს ა. კალანდაძემ ჩაატარა.


    ადამიანები მღვიმეს ორჯერ იყენებდნენ: დაახლოებით 25 500–24 400 წლის წინ და კიდევ ერთხელ, 17 000–16
    200 წლის წინ. შუალედის სიჩუმე ბოლო გამყინვარების მაქსიმუმს ემთხვევა, როცა აქ ცხოვრებისთვის, სავარაუდოდ,
    მეტისმეტად ციოდა. მათ დატოვეს ქვისა და ძვლის იარაღები, სელის ბოჭკოები, გაპრიალებული სტალაგმიტისა და
    ძვლის საკიდები და ყვითელი, წითელი და ყავისფერი ოხრის კვალი. ძირითადად გარეულ ღორსა და კეთილშობილ ირემზე
    ნადირობდნენ, მაგრამ ტურზე, სტეპის დომბაზე, კავკასიურ ჯიხვსა და შველზეც.


    2013 წელს ნაპოვნ მამაკაცს მუქი თმა, ყავისფერი თვალები და ღია კანი ჰქონდა. რძეს ვერ ითვისებდა, მისი
    დნმ-ის დაახლოებით ორი პროცენტი კი ნეანდერტალური იყო. კოთიას კლდის 9 700 წლის წინანდელ ადამიანთან ერთად,
    რომელიც ასევე დასავლეთ საქართველოშია ნაპოვნი, ის „კავკასიელ მონადირე-შემგროვებლებს“ განსაზღვრავს.
    ამ შტომ ბრინჯაოს ხანის იამნაიას კულტურის მწყემსების წინაპრობის დაახლოებით ნახევარი შექმნა და მათი
    მეშვეობით ევროპის დიდი ნაწილის წინაპრობაში შევიდა. დღეს მცხოვრებთაგან გენეტიკურად მასთან ყველაზე ახლოს
    მდგომთა შორის ქართველები არიან.


    შუა საუკუნეებში მღვიმე თავშესაფრად გამოიყენებოდა, 2011 წლიდან კი დაცული ბუნების ძეგლია. პრომეთეს მღვიმე
    გაჩვენებთ, რისი გაკეთება შეუძლია წყალს ქვასთან. საწურბლია გაჩვენებთ, რა შეუძლია ქვას ჩვენთვის: მან
    ერთი ადამიანი ცამეტი ათასი წელი შეინახა, ვიდრე ვინმე მის წაკითხვას ისწავლიდა.
  tip: >-
    საწურბლია სამეცნიერო ძეგლია და არა ტურისტული მღვიმე. შესასვლელი რკინის კარითაა ჩაკეტილი; მთავარ დარბაზში
    ლითონის კიბე დამონტაჟებულია, მაგრამ სალარო და გამოქვეყნებული სამუშაო საათები დადასტურებული არ არის.
    ჩათვალეთ, რომ მხოლოდ ჩაკეტილ შესასვლელს ნახავთ, თუ შესვლას ადგილზე, კუმისთავში, ან იმერეთის მღვიმეების
    დაცული ტერიტორიების ადმინისტრაციის მეშვეობით არ შეათანხმებთ. ჩაიცვით ფეხსაცმელი, რომელიც არ სრიალებს:
    წვიმის შემდეგ მისასვლელი ტალახიანია. ეს დაცული ბუნების ძეგლია — არაფერი გათხაროთ, არაფერი გადაადგილოთ
    და თან არაფერი წაიღოთ. საჭმელი, ტუალეტი და ავტოსადგომი ახლომდებარე პრომეთეს მღვიმესთანაა. ორივეს ერთ
    დილაში მოასწრებთ, სურვილის შემთხვევაში კი სათაფლიაც დაამატეთ, დინოზავრების ნაკვალევითა და შუშის სადამკვირვებლო
    ბაქნით.
  route: >-
    თბილისიდან E60/ს1-ით დასავლეთისკენ, გორის, ხაშურისა და ზესტაფონის გავლით, ქუთაისამდე დაახლოებით 220
    კილომეტრია. ქალაქი გაიარეთ და შ15-ით წყალტუბოსკენ გაემართეთ, იქიდან კი პრომეთეს მღვიმის მაჩვენებლებს
    გაჰყევით კუმისთავამდე. მღვიმე სოფლიდან დაახლოებით 1,2 კილომეტრშია; ბოლო მონაკვეთი ხრეშიანი და გრუნტის
    გზაა, რომელსაც მშრალ ამინდში ეკონომ-კლასის მანქანაც გაივლის. სულ დაახლოებით 244 კმ და 3 საათი და 40
    წუთი. საწვავი ქუთაისში ან წყალტუბოში ჩაასხით. ძლიერი წვიმის შემდეგ მანქანა იქ დატოვეთ, სადაც გზა რბილდება,
    დანარჩენი კი ფეხით გაიარეთ.
en:
  name: Satsurblia Cave
  short: >-
    A karst cave beside Prometheus Cave where a 13,300-year-old bone yielded the genome that defined the
    Caucasus Hunter-Gatherers.
  body: >-
    **In 2013 archaeologists lifted a fragment of human skull from the floor of this cave, and from it
    geneticists read the genome of a man who died some 13,300 years ago.**


    Satsurblia is a karst cave in the Sataplia–Tskaltubo limestone massif, 1.2 km from Kumistavi village
    and close to the lit halls of Prometheus Cave. A mouth about six metres wide opens onto an 80-metre
    tunnel that drops steeply over natural rock steps a metre or more high. Some 125 metres in lies a
    great hall, 30 by 25 metres. A. N. Kalandadze first excavated here in 1976.


    People used the cave twice: roughly 25,500 to 24,400 years ago, and again from about 17,000 to 16,200
    years ago. The silence in between matches the Last Glacial Maximum, when the site was probably too
    cold to live in. They left stone and bone tools, flax fibres, pendants of polished stalagmite and
    bone, and traces of yellow, red and brown ochre. They hunted mainly wild boar and red deer, and also
    aurochs, steppe bison, Caucasian tur and roe deer.


    The man found in 2013 had dark hair, brown eyes and light skin. He could not digest milk, and about
    two per cent of his DNA was Neanderthal. Together with a 9,700-year-old individual from Kotias Klde,
    also in western Georgia, he defines the Caucasus Hunter-Gatherers. This lineage supplied about half
    the ancestry of the Bronze Age Yamnaya herders and, through them, entered the ancestry of much of
    Europe. Modern Georgians are among his closest living relatives.


    A medieval refuge, the cave has been a protected Natural Monument since 2011. Prometheus Cave shows
    what water can do with stone. Satsurblia shows what stone can do for us: it kept one man for thirteen
    thousand years, until someone learned to read him.
  tip: >-
    Satsurblia is a scientific site, not a show cave. The entrance is closed by an iron gate, and although
    a metal staircase has been installed in the main hall, no ticket office or published hours have been
    confirmed. Plan on seeing the gated entrance only, unless you arrange access locally in Kumistavi
    or through the Imereti Caves Protected Areas administration. Wear shoes that grip, as the approach
    is muddy after rain. This is a protected Natural Monument: dig nothing, move nothing, take nothing.
    Food, toilets and parking are at nearby Prometheus Cave. The two fit easily into one morning, and
    you can add Sataplia, with its dinosaur footprints and glass viewing platform.
  route: >-
    From Tbilisi take the E60/S1 west past Gori, Khashuri and Zestaponi to Kutaisi, about 220 km. Cross
    the city and take the Sh15 towards Tskaltubo, then follow the signs for Prometheus Cave to Kumistavi.
    The cave lies about 1.2 km from the village, and the last stretch is a gravel and dirt track that
    an economy car manages in dry weather. Allow about 244 km and 3 hours 40 minutes. Refuel in Kutaisi
    or Tskaltubo. After heavy rain, park where the track turns soft and walk the rest.
ru:
  name: Пещера Сацурблия
  short: >-
    Карстовая пещера рядом с пещерой Прометея: здесь из кости возрастом 13 300 лет прочли геном, по которому
    выделили кавказских охотников-собирателей.
  body: >-
    **В 2013 году археологи подняли с пола этой пещеры фрагмент человеческого черепа, и генетики прочли
    по нему геном мужчины, умершего около 13 300 лет назад.**


    Сацурблия — карстовая пещера в Сатаплиа-Цхалтубском известняковом массиве, в 1,2 км от села Кумистави
    и совсем рядом с освещёнными залами пещеры Прометея. Устье шириной около шести метров открывается
    в 80-метровый тоннель, который круто уходит вниз естественными каменными уступами высотой в метр и
    больше. Примерно в 125 метрах от входа лежит большой зал размером 30 на 25 метров. Первые раскопки
    здесь провёл в 1976 году А. Н. Каландадзе.


    Люди жили в пещере дважды: примерно 25 500–24 400 лет назад и снова около 17 000–16 200 лет назад.
    Молчание между этими эпохами совпадает с последним ледниковым максимумом, когда здесь, вероятно, было
    слишком холодно для жизни. После них остались каменные и костяные орудия, волокна льна, подвески из
    полированного сталагмита и кости, следы жёлтой, красной и бурой охры. Охотились они в основном на
    кабана и благородного оленя, а также на первобытного быка, степного бизона, кавказского тура и косулю.


    Мужчина, найденный в 2013 году, был темноволосым, кареглазым и светлокожим. Он не мог усваивать молоко,
    а около двух процентов его ДНК досталось от неандертальцев. Вместе с человеком из Котиас-Клде, тоже
    в Западной Грузии, чьи останки датированы 9700 годами, он определяет кавказских охотников-собирателей.
    Эта линия дала примерно половину генетического наследия скотоводов ямной культуры бронзового века,
    а через них вошла в родословную значительной части Европы. Современные грузины — одни из его ближайших
    ныне живущих родственников.


    В Средние века пещера служила убежищем, а с 2011 года охраняется как памятник природы. Пещера Прометея
    показывает, что вода может сделать с камнем. Сацурблия показывает, что камень может сделать для нас:
    он хранил одного человека тринадцать тысяч лет — пока кто-то не научился его читать.
  tip: >-
    Сацурблия — научный объект, а не туристическая пещера. Вход закрыт железной решёткой, и хотя в главном
    зале установлена металлическая лестница, ни кассы, ни опубликованных часов работы подтвердить не удалось.
    Рассчитывайте увидеть только запертый вход, если не договоритесь о посещении на месте, в Кумистави,
    или через администрацию охраняемых территорий пещер Имерети. Нужна обувь с цепкой подошвой: после
    дождя подход раскисает. Это охраняемый памятник природы: ничего не копайте, ничего не сдвигайте, ничего
    не уносите. Еда, туалеты и парковка — у соседней пещеры Прометея. Обе пещеры легко уложить в одно
    утро, а можно добавить и Сатаплиа с её следами динозавров и стеклянной смотровой площадкой.
  route: >-
    Из Тбилиси езжайте по E60/S1 на запад мимо Гори, Хашури и Зестафони до Кутаиси — около 220 км. Пересеките
    город и возьмите трассу Sh15 на Цхалтубо, а дальше по указателям к пещере Прометея доберитесь до Кумистави.
    Пещера в 1,2 км от села, и последний отрезок — гравийно-грунтовая колея, с которой в сухую погоду
    справится и машина эконом-класса. Всего закладывайте около 244 км и 3 часа 40 минут. Заправиться можно
    в Кутаиси или Цхалтубо. После сильного дождя оставьте машину там, где колея раскисает, и пройдите
    остаток пешком.
fa:
  name: غار ساتسوربلیا
  short: >-
    غاری کارستی کنار غار پرومتئوس که از استخوانی ۱۳,۳۰۰ ساله در آن، ژنومی خوانده شد که شکارچی-گردآورندگان
    قفقاز با آن تعریف شدند.
  body: >-
    **در ۲۰۱۳ باستان‌شناسان پاره‌ای از جمجمهٔ انسان را از کف این غار برداشتند و ژن‌شناسان از روی آن ژنوم
    مردی را خواندند که حدود ۱۳,۳۰۰ سال پیش مرده بود.**


    ساتسوربلیا غاری کارستی در تودهٔ آهکی ساتاپلیا–تسکالتوبو است، در ۱٫۲ کیلومتری روستای کومیستاوی و نزدیک
    تالارهای نورپردازی‌شدهٔ غار پرومتئوس. دهانه‌ای به پهنای حدود شش متر به تونلی ۸۰ متری باز می‌شود که
    با پله‌هایی طبیعی از سنگ به بلندی یک متر یا بیشتر به‌تندی پایین می‌رود. حدود ۱۲۵ متر درون غار، تالار
    بزرگی به ابعاد ۳۰ در ۲۵ متر است. نخستین کاوش را آ. ن. کالاندادزه در ۱۹۷۶ در اینجا انجام داد.


    انسان‌ها دو بار در این غار به سر بردند: تقریباً ۲۵,۵۰۰ تا ۲۴,۴۰۰ سال پیش، و بار دیگر از حدود ۱۷,۰۰۰
    تا ۱۶,۲۰۰ سال پیش. خاموشیِ میان این دو دوره با آخرین بیشینهٔ یخبندان هم‌زمان است، زمانی که این مکان
    احتمالاً برای زندگی بیش از اندازه سرد بود. از آنان ابزارهای سنگی و استخوانی، الیاف کتان، آویزهایی
    از استالاگمیت صیقل‌خورده و استخوان، و ردّی از اُخرای زرد، سرخ و قهوه‌ای به جا مانده است. بیشتر گراز
    وحشی و گوزن سرخ شکار می‌کردند، و نیز گاو وحشیِ باستانی (اوروک)، بیسون استپی، بز کوهی قفقازی (تور)
    و شوکا.


    مردی که در ۲۰۱۳ یافت شد موهای تیره، چشمان قهوه‌ای و پوست روشن داشت. نمی‌توانست شیر را هضم کند و حدود
    دو درصد دی‌ان‌ای او از نئاندرتال‌ها به ارث رسیده بود. او همراه با فردی ۹,۷۰۰ ساله از کوتیاس کلده،
    که آن هم در غرب گرجستان است، معرّف شکارچی-گردآورندگان قفقاز است. این تبار حدود نیمی از نیاکان ژنتیکی
    گله‌داران یامنایا در عصر مفرغ را فراهم کرد و از راه آنان به تبار بخش بزرگی از اروپاییان راه یافت.
    گرجی‌های امروز از نزدیک‌ترین خویشاوندان زندهٔ او به شمار می‌آیند.


    این غار که در سده‌های میانه پناهگاه بود، از ۲۰۱۱ به‌عنوان «اثر طبیعی» حفاظت می‌شود. غار پرومتئوس نشان
    می‌دهد آب با سنگ چه می‌تواند بکند. ساتسوربلیا نشان می‌دهد سنگ برای ما چه می‌تواند بکند: یک انسان را
    سیزده هزار سال نگه داشت، تا روزی که کسی خواندنش را آموخت.
  tip: >-
    ساتسوربلیا یک محوطهٔ علمی است، نه غاری برای گردشگران. دهانهٔ غار با دری آهنی بسته شده است، و گرچه
    در تالار اصلی پلکانی فلزی نصب کرده‌اند، وجود گیشهٔ بلیت یا ساعت بازدیدِ اعلام‌شده تأیید نشده است.
    برنامه‌تان را بر دیدن همان دهانهٔ دربسته بگذارید، مگر آنکه بتوانید بازدید را در محل، در کومیستاوی،
    یا از طریق ادارهٔ مناطق حفاظت‌شدهٔ غارهای ایمرتی هماهنگ کنید. کفشی با کف ضدلغزش بپوشید، چون راه رسیدن
    پس از باران گل‌آلود است. اینجا اثر طبیعی حفاظت‌شده است: چیزی را نکَنید، چیزی را جابه‌جا نکنید، چیزی
    برندارید. غذا، سرویس بهداشتی و پارکینگ در غار پرومتئوسِ نزدیک است. هر دو غار به‌راحتی در یک صبح جا
    می‌گیرند و می‌توانید ساتاپلیا را هم، با ردپای دایناسورها و سکوی تماشای شیشه‌ای‌اش، به برنامه بیفزایید.
  route: >-
    از تفلیس با جادهٔ E60/S1 رو به غرب از کنار گوری، خاشوری و زستافونی بگذرید تا به کوتایسی برسید؛ حدود
    ۲۲۰ کیلومتر. از شهر عبور کنید و جادهٔ Sh15 را به سوی تسکالتوبو بگیرید، سپس تابلوهای غار پرومتئوس را
    تا کومیستاوی دنبال کنید. غار حدود ۱٫۲ کیلومتر با روستا فاصله دارد و بخش پایانی راه جاده‌ای شنی و خاکی
    است که خودروی اقتصادی در هوای خشک از پسش برمی‌آید. روی هم حدود ۲۴۴ کیلومتر و ۳ ساعت و ۴۰ دقیقه در
    نظر بگیرید. در کوتایسی یا تسکالتوبو سوخت‌گیری کنید. پس از باران شدید، جایی که جاده نرم می‌شود پارک
    کنید و باقی راه را پیاده بروید.
he:
  name: מערת סצורבליה
  short: מערת קרסט ליד מערת פרומתאוס, שבה הפיקו מעצם בת 13,300 שנה את הגנום שעל פיו הוגדרו הציידים-לקטים
    של הקווקז.
  body: >-
    **ב-2013 הרימו ארכאולוגים מרצפת המערה הזאת שבר של גולגולת אדם, וממנו קראו גנטיקאים את הגנום של גבר
    שמת לפני כ-13,300 שנה.**


    סצורבליה היא מערת קרסט במסיב הגיר סאטאפליה–צקאלטובו, 1.2 ק״מ מהכפר קומיסטאווי וסמוך לאולמות המוארים
    של מערת פרומתאוס. פתח ברוחב של כשישה מטרים מוביל אל מנהרה באורך 80 מטרים, היורדת בתלילות במדרגות סלע
    טבעיות שגובהן מטר ויותר. כ-125 מטרים פנימה נמצא אולם גדול, 30 על 25 מטרים. את החפירה הראשונה ערך כאן
    א. נ. קלנדדזה ב-1976.


    בני אדם שהו במערה פעמיים: לפני כ-25,500 עד 24,400 שנה, ושוב לפני כ-17,000 עד 16,200 שנה. השתיקה שבין
    שתי התקופות חופפת את השיא הקרחוני האחרון, כשהמקום היה כנראה קר מכדי לחיות בו. הם הותירו אחריהם כלי
    אבן ועצם, סיבי פשתן, תליונים מזקיף מלוטש ומעצם, ועקבות של אוכרה צהובה, אדומה וחומה. הם צדו בעיקר חזירי
    בר ואיילים אדומים, וגם שורי בר קדומים (אורוקסים), ביזוני ערבות, יעלים קווקזיים (טורים) ויחמורים.


    הגבר שנמצא ב-2013 היה כהה שיער, חום עיניים ובהיר עור. הוא לא היה מסוגל לעכל חלב, וכשני אחוזים מהדנ״א
    שלו היו ממוצא ניאנדרטלי. יחד עם שרידי אדם בני 9,700 שנה מקוטיאס קלדה, גם כן במערב גאורגיה, הוא מגדיר
    את קבוצת הציידים-לקטים של הקווקז. שושלת זו תרמה כמחצית מהמוצא הגנטי של רועי היאמנאיה בתקופת הברונזה,
    ודרכם נכנסה לשושלת המוצא של חלק ניכר מאוכלוסיית אירופה. הגאורגים של היום נמנים עם קרוביו החיים הקרובים
    ביותר.


    המערה, ששימשה מקלט בימי הביניים, מוגנת מאז 2011 כמונומנט טבע. מערת פרומתאוס מראה מה מים מסוגלים לעשות
    לאבן. סצורבליה מראה מה אבן מסוגלת לעשות למעננו: היא שמרה על אדם אחד שלושה-עשר אלף שנה, עד שמישהו למד
    לקרוא אותו.
  tip: >-
    סצורבליה היא אתר מדעי, לא מערת תיירות. הפתח חסום בשער ברזל, ואף שבאולם הראשי הותקן גרם מדרגות ממתכת,
    לא אומת שיש קופה או שעות פתיחה מפורסמות. תכננו לראות רק את הפתח הסגור, אלא אם תתאמו גישה במקום, בקומיסטאווי,
    או דרך הנהלת השטחים המוגנים של מערות אימרתי. נעלו נעליים עם אחיזה טובה, כי הגישה בוצית אחרי גשם. זהו
    מונומנט טבע מוגן: אל תחפרו דבר, אל תזיזו דבר ואל תיקחו דבר. אוכל, שירותים וחניה יש במערת פרומתאוס
    הסמוכה. את שתי המערות קל לשלב בבוקר אחד, ואפשר להוסיף גם את סאטאפליה, עם עקבות הדינוזאורים ומרפסת
    התצפית מזכוכית.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי, חשורי וזסטפוני, עד קוטאיסי — כ-220 ק״מ. חצו את העיר
    ועלו על כביש Sh15 לכיוון צקאלטובו, ואז עקבו אחר השלטים למערת פרומתאוס עד קומיסטאווי. המערה נמצאת כ-1.2
    ק״מ מהכפר, והקטע האחרון הוא דרך חצץ ועפר שרכב קטן מקטגוריית אקונומי עובר בה במזג אוויר יבש. בסך הכול
    חשבו על כ-244 ק״מ ו-3 שעות ו-40 דקות. תדלקו בקוטאיסי או בצקאלטובו. אחרי גשם כבד, החנו במקום שבו הדרך
    נעשית רכה והמשיכו ברגל.
ar:
  name: كهف ساتسوربليا
  short: >-
    كهف كارستي بجوار كهف بروميثيوس، قُرئ فيه من عظمٍ عمره 13,300 عام الجينومُ الذي عُرّفت به جماعة الصيادين-الجامعين
    القوقازيين.
  body: >-
    **في عام 2013 رفع علماء الآثار من أرضية هذا الكهف قطعة من جمجمة بشرية، ومنها قرأ علماء الوراثة جينوم
    رجل مات قبل نحو 13,300 عام.**


    ساتسوربليا كهف كارستي في كتلة ساتابليا–تسكالتوبو الكلسية، على بعد 1.2 كم من قرية كوميستافي وعلى مقربة
    من القاعات المضاءة في كهف بروميثيوس. تنفتح فوّهة عرضها نحو ستة أمتار على نفق طوله 80 متراً ينحدر بشدة
    عبر درجات صخرية طبيعية يبلغ ارتفاع الواحدة منها متراً أو أكثر. وعلى بعد نحو 125 متراً من المدخل تقع
    قاعة كبرى أبعادها 30 في 25 متراً. وأول من نقّب هنا كان أ. ن. كالاندادزه عام 1976.


    استخدم البشر الكهف مرتين: قبل نحو 25,500 إلى 24,400 عام، ثم مجدداً قبل نحو 17,000 إلى 16,200 عام.
    ويتطابق الصمت بين المرحلتين مع ذروة العصر الجليدي الأخير، حين كان الموقع على الأرجح أبرد من أن يُسكن.
    وخلّفوا وراءهم أدوات من الحجر والعظم، وألياف كتان، ودلّايات من الصواعد المصقولة والعظم، وآثاراً من
    المغرة الصفراء والحمراء والبنية. وكانوا يصطادون أساساً الخنزير البري والأيل الأحمر، وكذلك الثور البري
    القديم (الأرخص) وبيسون السهوب والوعل القوقازي (الطور) واليحمور.


    وكان الرجل الذي عُثر عليه عام 2013 داكن الشعر بنيّ العينين فاتح البشرة. ولم يكن قادراً على هضم الحليب،
    ونحو اثنين في المئة من حمضه النووي موروث من إنسان نياندرتال. وهو، مع رفات فرد عمرها 9,700 عام من كوتياس
    كلده، في غرب جورجيا أيضاً، يُعرّف جماعة الصيادين-الجامعين القوقازيين. وقد أسهمت هذه السلالة بنحو نصف
    الأصول الوراثية لرعاة اليمنايا في العصر البرونزي، ومن خلالهم دخلت في أصول جزء كبير من سكان أوروبا.
    والجورجيون المعاصرون من أقرب أقربائه الأحياء.


    وقد كان الكهف ملجأً في العصور الوسطى، وهو محمي منذ 2011 بوصفه معلماً طبيعياً. كهف بروميثيوس يُريك
    ما يستطيع الماء أن يفعله بالحجر. وساتسوربليا يُريك ما يستطيع الحجر أن يفعله لنا: فقد حفظ رجلاً واحداً
    ثلاثة عشر ألف عام، إلى أن تعلّم أحدهم كيف يقرؤه.
  tip: >-
    ساتسوربليا موقع علمي لا كهف سياحي. المدخل مغلق ببوابة حديدية، ومع أن درجاً معدنياً رُكّب في القاعة
    الكبرى، لم يتأكد وجود شبّاك تذاكر أو مواعيد زيارة منشورة. خطط لرؤية المدخل المغلق وحده، ما لم ترتّب
    الدخول محلياً في كوميستافي أو عبر إدارة المناطق المحمية لكهوف إيميريتي. انتعل حذاءً جيد القبضة، فالطريق
    إليه موحل بعد المطر. هذا معلم طبيعي محمي: لا تحفر شيئاً، ولا تحرّك شيئاً، ولا تأخذ شيئاً. الطعام ودورات
    المياه والموقف في كهف بروميثيوس القريب. ويتسع صباح واحد بسهولة للكهفين، ويمكنك أن تضيف إليهما ساتابليا
    بآثار أقدام الديناصورات ومنصة المشاهدة الزجاجية.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً مروراً بغوري وخاشوري وزيستافوني حتى كوتايسي، نحو 220 كم. اعبر المدينة
    وخذ الطريق Sh15 باتجاه تسكالتوبو، ثم اتبع لافتات كهف بروميثيوس حتى كوميستافي. يقع الكهف على بعد نحو
    1.2 كم من القرية، والجزء الأخير درب من الحصى والتراب تجتازه سيارة من الفئة الاقتصادية في الطقس الجاف.
    احسب نحو 244 كم و3 ساعات و40 دقيقة إجمالاً. تزوّد بالوقود في كوتايسي أو تسكالتوبو. وبعد المطر الغزير
    اركن السيارة حيث يلين الدرب وأكمل سيراً على الأقدام.
