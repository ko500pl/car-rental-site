ka:
  name: ტვიში
  short: >-
    რიონის ხეობის პატარა სოფელი, რომლის სახელსაც ცოლიკოურისგან დაყენებული ღია ოქროსფერი თეთრი ღვინო —
    ტვიში — ატარებს.
  body: >-
    **ტვიშში ორასიოდე კაცი ცხოვრობს, მისი სახელი კი სოფელს დიდი ხანია გასცდა და ღვინის ეტიკეტებით მთელ
    საქართველოს მოედო.**


    სოფელი ზღვის დონიდან დაახლოებით 400 მეტრზე, რიონის მარჯვენა ნაპირზე დგას, იმ ხეობაში, რომელსაც მდინარე
    ალპანასა და ქუთაისს შორის მიაპობს. 2014 წლის აღწერით აქ 205 ადამიანი ცხოვრობდა. სოფლის ირგვლივ ადგილწარმოშობის
    დასახელების სულ 15 კვადრატული კილომეტრის ზონაა, რომელიც მეზობელ ალპანასაც მოიცავს, და აქაური ღვინო
    მხოლოდ ერთი თეთრი ჯიშისგან — ცოლიკოურისგან — დგება.


    ტვიში ყველაზე მეტად ბუნებრივად ნახევრად ტკბილი ღვინის სახითაა ცნობილი — შაქარს მას არ უმატებენ, —
    თუმცა უფრო მშრალსაც აყენებენ. ჭიქაში ღია ოქროსფერია, მომწვანო ელვარებით; მსხლის, ციტრუსისა და თეთრი
    ყვავილების სურნელი აქვს, თაფლის მსუბუქი კვალით. მწარმოებელთა უმეტესობა მას ქვევრში კი არა, უჟანგავი
    ფოლადის ავზებში ადუღებს, რომ ეს სიახლე შეუნარჩუნოს.


    დასავლეთით ჰორიზონტს ხვამლის კირქვის მასივი კეტავს. მის თხემზე, სავარაუდოდ XII–XIII საუკუნეებში, წმინდა
    გიორგის ეკლესია იდგა; იქ 1910 წელს ნაპოვნი წარწერა მის ქტიტორს — სვანთა ერისთავ იოანეს — ასახელებს.
    ტვიშიდან მთის მხარზე უხეში გზა გადადის ოყურეშისკენ, უსახელოურის სამშობლოსკენ, და ის მხოლოდ მაღალი
    გამავლობის მანქანისთვისაა.


    ბოლო წლებში ამ ხეობაზე ღვინოზე მეტად ნამახვანჰესის გამო ლაპარაკობდნენ: რიონის ამ მონაკვეთზე დაგეგმილმა
    ჰიდროელექტროსადგურმა მთელი მხარე გაყო.


    ტვიში დიდხანს არ დაგაყოვნებთ. ბოთლი მათგან იყიდეთ, ვინც ის დააყენა, და იმავე საღამოს გახსენით: მას
    მდინარის ამ მოსახვევის გემო აქვს.
  tip: >-
    ტვიშში ფიქსირებული საათებით მომუშავე საჯარო მარანი არ არის, ამიტომ დეგუსტაცია წინასწარ შეათანხმეთ
    ლეჩხუმელ ღვინის გიდთან, ან სოფელშივე იკითხეთ. ნაღდი ფული იქონიეთ. თავად სოფელს ერთი საათიც ეყოფა.
    ყველაზე ცოცხალი დრო შემოდგომაა, როცა ცოლიკოურს კრეფენ. ვინ დაჯდება საჭესთან, პირველ ჭიქამდე გადაწყვიტეთ
    — ნასვამ მძღოლს საქართველოში მკაცრად სჯიან. ხვამლზე ოყურეშისკენ გადამავალი გზა ნაქირავები მანქანისთვის
    არ არის: ასფალტს მიჰყევით და ცაგერის გავლით შემოუარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ქუთაისამდე, შემდეგ შ16-ით ჩრდილოეთით, რიონის ხეობით ალპანისკენ.
    ტვიში სწორედ ამ გზაზეა, ქუთაისიდან დაახლოებით 45 კილომეტრში, ალპანამდე 10 კილომეტრით ადრე. სულ დაახლოებით
    270 კმ და ოთხ საათზე ცოტა მეტია. გზა ბოლომდე ასფალტიანია და ეკონომკლასის მანქანა სავსებით საკმარისია.
    საწვავი ქუთაისში ჩაასხით. ალპანიდან შ18 ცაგერისკენ ადის — ტვიშიდან იქამდე დაახლოებით 33 კილომეტრია,
    — შ16 კი ამბროლაურისკენ გრძელდება, ასე რომ ტვიში ლეჩხუმისა თუ რაჭის ნებისმიერ მარშრუტში ადვილად ჩაჯდება.
en:
  name: Tvishi
  short: >-
    A small village in the Rioni gorge whose name belongs to Tvishi, the pale-gold white wine made from
    Tsolikouri grapes on the slopes around it.
  body: >-
    **Tvishi is a village of about two hundred people whose name long ago outgrew it and now travels on
    wine labels across Georgia.**


    It stands at around 400 metres on the right bank of the Rioni, in the gorge the river cuts between
    Alpana and Kutaisi. The 2014 census counted 205 residents. Around it lies a protected appellation
    zone of just 15 square kilometres, which also takes in neighbouring Alpana, and the wine made there
    comes from a single white grape: Tsolikouri.


    Tvishi is best known as a naturally semi-sweet wine, with no sugar added, though drier versions are
    made too. In the glass it is pale gold with a green glint, and it smells of pear, citrus and white
    flowers, with a trace of honey. Most producers ferment it in steel tanks rather than qvevri, to keep
    that freshness intact.


    To the west the limestone bulk of Khvamli closes the horizon. On its summit, probably in the 12th
    or 13th century, stood a church of St George; an inscription found there in 1910 names its donor,
    Ioane, duke of the Svans. A rough track crosses the mountain's shoulder from Tvishi towards Okureshi,
    the home of Usakhelouri, and it is for high-clearance vehicles only.


    In recent years the gorge has made the news less for its wine than for Namakhvani, a hydropower project
    planned on this stretch of the Rioni, which has divided the region.


    Tvishi will not keep you long. Buy a bottle from the people who made it and open it that evening:
    it tastes of this bend of the river.
  tip: >-
    There is no public cellar with fixed opening hours, so arrange a tasting through a Lechkhumi wine
    guide before you come, or ask in the village. Carry cash. An hour is enough for the village itself.
    Autumn, when the Tsolikouri is picked, is the liveliest time. Decide who drives before anyone tastes
    anything, because Georgia is strict about drink-driving. The track over Khvamli towards Okureshi is
    no place for a rental car: stay on the asphalt and go round by Tsageri.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh16 north up the Rioni gorge towards Alpana.
    Tvishi lies on this road about 45 km beyond Kutaisi, some 10 km short of Alpana. In all it is about
    270 km and a little over four hours. The road is asphalt throughout, and an economy car is entirely
    adequate. Fill up in Kutaisi. At Alpana the Sh18 climbs to Tsageri, about 33 km from Tvishi, while
    the Sh16 continues to Ambrolauri, so Tvishi slips easily into any Lechkhumi or Racha itinerary.
ru:
  name: Твиши
  short: >-
    Небольшое село в ущелье Риони, отдавшее своё имя «Твиши» — бледно-золотому белому вину из цоликоури
    с окрестных склонов.
  body: >-
    **Твиши — село примерно на двести человек, чьё имя давно его переросло и теперь путешествует по всей
    Грузии на винных этикетках.**


    Оно стоит на высоте около 400 метров на правом берегу Риони, в ущелье, которое река прорезает между
    Алпаной и Кутаиси. Перепись 2014 года насчитала 205 жителей. Вокруг лежит микрозона с защищённым наименованием
    места происхождения площадью всего 15 квадратных километров, куда входит и соседняя Алпана, а вино
    здесь делают из одного-единственного белого сорта — цоликоури.


    «Твиши» известно прежде всего как естественно полусладкое вино, без добавленного сахара, хотя делают
    и более сухие версии. В бокале оно бледно-золотое с зеленоватым отблеском, пахнет грушей, цитрусами
    и белыми цветами, с ноткой мёда. Большинство производителей сбраживают его в стальных ёмкостях, а
    не в квеври, чтобы сохранить эту свежесть нетронутой.


    На западе горизонт замыкает известняковая громада Хвамли. На её вершине, вероятно в XII или XIII веке,
    стояла церковь Святого Георгия; найденная там в 1910 году надпись называет имя её ктитора — Иоане,
    эристава сванов. Через отрог горы из Твиши в сторону Окуреши, родины усахелоури, ведёт разбитая грунтовка,
    и она годится только для машин с высоким клиренсом.


    В последние годы ущелье попадало в новости не столько из-за вина, сколько из-за Намахвани — гидроэнергетического
    проекта, запланированного на этом отрезке Риони, который расколол регион.


    Надолго Твиши вас не задержит. Купите бутылку у тех, кто её сделал, и откройте в тот же вечер: в ней
    — вкус этой излучины реки.
  tip: >-
    Публичного винного погреба с постоянными часами работы здесь нет, поэтому договоритесь о дегустации
    заранее через гида по винам Лечхуми или просто спросите в селе. Возьмите наличные. На само село хватит
    часа. Осень, когда собирают цоликоури, — самое оживлённое время. Решите, кто сядет за руль, прежде
    чем кто-нибудь хоть что-то попробует: в Грузии строго наказывают за вождение в нетрезвом виде. Грунтовка
    через Хвамли на Окуреши — не место для арендованной машины: держитесь асфальта и объезжайте через
    Цагери.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh16 на север вверх по ущелью Риони в сторону
    Алпаны. Твиши стоит на этой дороге примерно в 45 км за Кутаиси, километрах в десяти не доезжая Алпаны.
    Всего около 270 км и чуть больше четырёх часов. Дорога асфальтирована на всём протяжении, и машины
    эконом-класса вполне достаточно. Заправьтесь в Кутаиси. В Алпане Sh18 уходит вверх к Цагери, примерно
    в 33 км от Твиши, а Sh16 продолжается до Амбролаури, так что Твиши легко вписывается в любой маршрут
    по Лечхуми или Раче.
fa:
  name: تویشی
  short: >-
    روستایی کوچک در درهٔ ریونی که نامش اکنون از آنِ تویشی است: شراب سفیدی به رنگ طلایی روشن از انگور تسولیکوری
    دامنه‌های پیرامونش.
  body: >-
    **تویشی روستایی است با حدود دویست نفر جمعیت که نامش دیرزمانی است از خودش بزرگ‌تر شده و اکنون بر برچسب
    بطری‌های شراب در سراسر گرجستان سفر می‌کند.**


    روستا در ارتفاع حدود ۴۰۰ متری، بر کرانهٔ راست ریونی، در دره‌ای قرار دارد که رود میان آلپانا و کوتائیسی
    شکافته است. سرشماری ۲۰۱۴ شمار ساکنانش را ۲۰۵ نفر ثبت کرد. پیرامون آن منطقه‌ای با نام خاستگاهِ حمایت‌شده
    گسترده است که تنها ۱۵ کیلومتر مربع وسعت دارد و آلپانای همسایه را نیز در بر می‌گیرد، و شرابی که در
    آن ساخته می‌شود تنها از یک انگور سفید است: تسولیکوری.


    تویشی بیش از هر چیز به‌عنوان شرابی که به‌طور طبیعی نیمه‌شیرین است شناخته می‌شود، بی‌آنکه شکری به آن
    افزوده شود، هرچند گونه‌های خشک‌تری هم از آن می‌سازند. در جام، طلایی روشن است با ته‌رنگی سبز، و بوی
    گلابی، مرکبات و گل‌های سفید می‌دهد، با نشانی از عسل. بیشتر تولیدکنندگان آن را به‌جای کووری (خمره‌های
    سفالی گرجی) در مخزن‌های فولادی تخمیر می‌کنند تا همین تازگی دست‌نخورده بماند.


    در غرب، تودهٔ آهکی کوه خواملی افق را می‌بندد. بر قلهٔ آن، احتمالاً در سدهٔ دوازدهم یا سیزدهم، کلیسای
    قدیس گئورگی برپا بود؛ کتیبه‌ای که در سال ۱۹۱۰ در آنجا یافت شد، نام بانی آن را یوآنه، دوک سوان‌ها،
    آورده است. راهی خاکی و ناهموار از تویشی از شانهٔ کوه به سوی اوکورشی، زادگاه شراب اوساخلوری، می‌گذرد
    و تنها برای خودروهای شاسی‌بلند با فاصلهٔ زیاد از زمین مناسب است.


    در سال‌های اخیر نام این دره کمتر به خاطر شرابش و بیشتر به خاطر ناماخوانی بر سر زبان‌ها افتاده است:
    طرح نیروگاه برق‌آبی‌ای در همین بخش از ریونی که مردم منطقه را دو دسته کرده است.


    تویشی شما را زیاد نگه نمی‌دارد. بطری‌ای از دست کسانی که آن را ساخته‌اند بخرید و همان شب بازش کنید:
    طعم همین پیچ رودخانه را می‌دهد.
  tip: >-
    اینجا سرداب عمومی با ساعت کاری ثابت وجود ندارد؛ پس پیش از آمدن، چشیدن شراب را از طریق یک راهنمای شراب
    در لچخومی هماهنگ کنید، یا در روستا سراغ بگیرید. پول نقد همراه داشته باشید. برای خود روستا یک ساعت
    کافی است. پاییز، فصل چیدن تسولیکوری، پرجنب‌وجوش‌ترین زمان است. پیش از آنکه کسی چیزی بچشد، روشن کنید
    چه کسی رانندگی می‌کند، چون گرجستان با رانندگی پس از نوشیدن الکل سخت‌گیرانه برخورد می‌کند. راه خاکی
    خواملی به سوی اوکورشی جای خودروی اجاره‌ای نیست: روی آسفالت بمانید و از راه تساگری دور بزنید.
  route: >-
    از تفلیس از S1 (E60) به سمت غرب تا کوتائیسی بروید، سپس از Sh16 به سمت شمال در درهٔ ریونی به سوی آلپانا
    بالا بروید. تویشی روی همین جاده است، حدود ۴۵ کیلومتر پس از کوتائیسی و حدود ۱۰ کیلومتر پیش از آلپانا.
    روی هم حدود ۲۷۰ کیلومتر و کمی بیش از چهار ساعت راه است. جاده سراسر آسفالت است و خودروی اقتصادی کاملاً
    کافی است. در کوتائیسی باک را پر کنید. در آلپانا، Sh18 به سوی تساگری بالا می‌رود که حدود ۳۳ کیلومتر
    با تویشی فاصله دارد، و Sh16 تا آمبرولائوری ادامه می‌یابد؛ از این رو تویشی به‌آسانی در هر برنامهٔ سفری
    به لچخومی یا راچا جا می‌گیرد.
he:
  name: טווישי
  short: כפר קטן בערוץ הריוני ששמו שייך היום לטווישי, יין לבן בגוון זהב חיוור מענבי צוליקאורי הגדלים על
    המדרונות סביבו.
  body: >-
    **טווישי הוא כפר של כמאתיים איש, ששמו גדל ממנו מזמן ועכשיו נודד על תוויות יין ברחבי גאורגיה.**


    הכפר שוכן בגובה של כ-400 מטר על הגדה הימנית של הריוני, בערוץ שהנהר חוצב בין אלפאנה לקותאיסי. במפקד
    2014 נמנו בו 205 תושבים. סביבו משתרע אזור ייצור בעל כינוי מקור מוגן, ששטחו 15 קמ״ר בלבד והוא כולל
    גם את אלפאנה השכנה, והיין המיוצר בו עשוי מזן לבן אחד ויחיד: צוליקאורי.


    טווישי ידוע בעיקר כיין חצי-מתוק באופן טבעי, בלי תוספת סוכר, אם כי מייצרים גם גרסאות יבשות יותר. בכוס
    הוא זהוב חיוור עם ניצוץ ירקרק, והוא מדיף ריח של אגס, הדרים ופרחים לבנים, עם רמז של דבש. רוב היצרנים
    מתסיסים אותו במכלי פלדה ולא בקווברי, כדי לשמור על הרעננות הזאת בשלמותה.


    ממערב סוגר את האופק גוש הגיר של הר חוואמלי. על פסגתו, כנראה במאה ה-12 או ה-13, עמדה כנסיית גאורגיוס
    הקדוש; כתובת שנמצאה שם ב-1910 נוקבת בשם התורם שלה, יואנה, דוכס הסוואנים. דרך עפר משובשת חוצה את כתף
    ההר מטווישי לכיוון אוקורשי, מולדתו של יין האוסחלורי, והיא מתאימה רק לרכבים בעלי מרווח גחון גבוה.


    בשנים האחרונות הערוץ עלה לכותרות פחות בזכות היין ויותר בגלל נמחוואני, פרויקט הידרו-חשמלי המתוכנן על
    קטע זה של הריוני, שפילג את האזור.


    טווישי לא יעכב אתכם זמן רב. קנו בקבוק מן האנשים שעשו אותו ופתחו אותו באותו ערב: יש בו טעם של העיקול
    הזה בנהר.
  tip: >-
    אין כאן מרתף יין פתוח לקהל עם שעות פעילות קבועות, לכן תאמו טעימה מראש דרך מדריך יין באזור לצ'חומי,
    או שאלו בכפר. הביאו מזומן. לכפר עצמו מספיקה שעה. הסתיו, כשבוצרים את הצוליקאורי, הוא העונה התוססת ביותר.
    החליטו מי נוהג לפני שמישהו טועם משהו, כי בגאורגיה מחמירים מאוד בנהיגה תחת השפעת אלכוהול. דרך העפר
    מעל חוואמלי לאוקורשי אינה מקום לרכב שכור: הישארו על האספלט ועקפו דרך צאגרי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד קותאיסי, ואז בכביש Sh16 צפונה במעלה ערוץ הריוני לכיוון אלפאנה.
    טווישי נמצא על הכביש הזה כ-45 ק״מ אחרי קותאיסי, כ-10 ק״מ לפני אלפאנה. בסך הכול כ-270 ק״מ וקצת יותר
    מארבע שעות. הכביש סלול לכל אורכו, ורכב חסכוני מספיק בהחלט. תדלקו בקותאיסי. באלפאנה עולה כביש Sh18
    לצאגרי, כ-33 ק״מ מטווישי, וכביש Sh16 ממשיך לאמברולאורי, כך שטווישי משתלב בקלות בכל מסלול בלצ'חומי
    או ברצ'ה.
ar:
  name: تفيشي
  short: >-
    قرية صغيرة في وادي ريوني صار اسمها ملكاً لـ«تفيشي»، النبيذ الأبيض الذهبي الشاحب المصنوع من عنب تسوليكوري
    على المنحدرات المحيطة بها.
  body: >-
    **تفيشي قرية يسكنها نحو مئتي شخص، تجاوزها اسمها منذ زمن بعيد، وصار اليوم يسافر على ملصقات زجاجات النبيذ
    في أرجاء جورجيا.**


    تقع على ارتفاع نحو 400 متر على الضفة اليمنى لنهر ريوني، في الوادي الذي يشقّه النهر بين ألبانا وكوتايسي.
    وقد أحصى تعداد 2014 فيها 205 نسمة. ومن حولها تمتد منطقة تسمية منشأ محمية لا تزيد مساحتها على 15 كيلومتراً
    مربعاً، تشمل أيضاً ألبانا المجاورة، والنبيذ المصنوع فيها يأتي من صنف عنب أبيض واحد: تسوليكوري.


    يشتهر تفيشي قبل كل شيء بوصفه نبيذاً شبه حلو بطبيعته، بلا سكر مضاف، وإن كانت تُصنع منه أيضاً أنواع
    أكثر جفافاً. في الكأس يبدو ذهبياً شاحباً تلمع فيه خضرة خفيفة، وتفوح منه رائحة الكمثرى والحمضيات والزهور
    البيضاء، مع أثر من العسل. ويخمّره معظم المنتجين في خزانات فولاذية بدلاً من الكفيفري، الجرار الفخارية
    الجورجية، حفاظاً على تلك النضارة كاملة.


    وفي الغرب تسدّ كتلة جبل خفاملي الكلسية الأفق. وعلى قمة الجبل، في القرن الثاني عشر أو الثالث عشر على
    الأرجح، قامت كنيسة القديس جاورجيوس؛ ونقشٌ عُثر عليه هناك عام 1910 يذكر اسم واهبها، يوانه، دوق السفان.
    ويعبر مسلك وعر كتف الجبل من تفيشي نحو أوكوريشي، موطن نبيذ أوساخيلوري، وهو لا يصلح إلا للمركبات ذات
    الخلوص الأرضي المرتفع.


    وفي السنوات الأخيرة صار الوادي يتصدر الأخبار لا بسبب نبيذه بقدر ما بسبب ناماخفاني، وهو مشروع لتوليد
    الطاقة الكهرومائية مخطط له على هذا الامتداد من ريوني، أحدث انقساماً في المنطقة.


    لن تستبقيك تفيشي طويلاً. اشترِ زجاجة من الذين صنعوها وافتحها في المساء نفسه: مذاقها مذاق هذا المنعطف
    من النهر.
  tip: >-
    لا يوجد قبو نبيذ مفتوح للعموم بمواعيد عمل ثابتة، لذا رتّب جلسة تذوق مسبقاً عبر مرشد نبيذ في ليتشخومي،
    أو اسأل في القرية. احمل نقوداً. تكفي ساعة للقرية نفسها. والخريف، حين يُقطف عنب تسوليكوري، هو أكثر
    الأوقات حيوية. قرّروا من سيقود قبل أن يتذوق أحدكم أي شيء، فجورجيا صارمة في مسألة القيادة تحت تأثير
    الكحول. أما المسلك فوق خفاملي نحو أوكوريشي فليس مكاناً لسيارة مستأجرة: ابقَ على الأسفلت والتفّ عبر
    تساغيري.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً إلى كوتايسي، ثم Sh16 شمالاً صعوداً في وادي ريوني باتجاه ألبانا.
    تقع تفيشي على هذا الطريق على بعد نحو 45 كم بعد كوتايسي، ونحو 10 كم قبل ألبانا. المسافة الإجمالية نحو
    270 كم وما يزيد قليلاً على أربع ساعات. الطريق معبّد بالكامل، وتكفي تماماً سيارة اقتصادية. املأ الخزان
    في كوتايسي. في ألبانا يصعد الطريق Sh18 إلى تساغيري، على بعد نحو 33 كم من تفيشي، بينما يواصل Sh16 إلى
    أمبرولاوري، فتندرج تفيشي بسهولة في أي برنامج رحلة إلى ليتشخومي أو راتشا.
