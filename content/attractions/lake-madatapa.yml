ka:
  name: მადათაფის ტბა
  short: >-
    დაახლოებით 9 კმ² ტბა 2 108 მეტრზე, ჯავახეთის ზეგანზე, 2020 წლიდან რამსარის ჭარბტენიანი ტერიტორია:
    წყლის ფრინველების, მათ შორის იშვიათი ვარხვის, თავშესაფარი.
  body: >-
    **2 108 მეტრზე, ვულკანურ ზეგანზე, სადაც ცას მიწაზე მეტი ადგილი უჭირავს, მადათაფის ტბაა — საქართველოს
    წყლის ფრინველები აქ ბუდობენ და გადაფრენისას ისვენებენ.**


    მადათაფა ჯავახეთის ზეგნის სამხრეთ-აღმოსავლეთ ნაწილში, ნინოწმინდის მუნიციპალიტეტში მდებარეობს; მისი
    სარკე დაახლოებით 8,8 კვადრატულ კილომეტრზეა გადაჭიმული (ირგვლივ მდებარე აღკვეთილი 14 კმ²-ს მოიცავს).
    ის ზეგნის დიდ ტბებს შორისაა, თუმცა უდიდესი არ არის: ჩრდილოეთით მდებარე ფარავანი (37,5 კმ²) მასზე ოთხჯერ
    მეტია.


    მადათაფის ფასი ფრინველებშია. ის საქართველოში წყლის ფრინველების ბუდობისა და გადაფრენისას შესვენების
    ერთ-ერთი უმნიშვნელოვანესი ადგილია — მათ შორის იშვიათი ქოჩორა ვარხვისთვის. 2011 წელს ტბა აღკვეთილად
    გამოცხადდა, 2020 წლის 8 ივლისს კი რამსარის კონვენციის საერთაშორისო მნიშვნელობის ჭარბტენიან ტერიტორიად
    დარეგისტრირდა (ნომერი 2435). მადათაფის აღკვეთილი ჯავახეთის დაცული ტერიტორიების ნაწილია, ეროვნულ პარკთან
    და ქარწახის, სულდის, ხანჩალისა და ბუღდაშენის აღკვეთილებთან ერთად.


    დრამატულ პეიზაჟს ნუ მოელით: აქ არც ძეგლებია, არც ვიზიტორთა ცენტრი — მხოლოდ გრძელი ნაპირი, ფართო ცა
    და მოთმინება, რომელსაც ფრინველებზე დაკვირვება მოითხოვს.


    თუ ნაპირზე დიდხანს იჯდებით, უძრავი წყალი გაცოცხლდება: ფრინველთა გუნდი აფრინდება, წრეს დაარტყამს და
    ისევ წყალზე დაეშვება.
  tip: >-
    ტბა აღკვეთილია, ამიტომ წასვლამდე მოქმედი წესები და შესაძლო საფასური დაცული ტერიტორიების სააგენტოში
    ან ნინოწმინდის რეინჯერებთან დააზუსტეთ — ნუ ჩათვლით, რომ ეს უბრალოდ ღია ველია. ჩამოდით ივნისიდან სექტემბრამდე,
    ჯობს დილით ადრე ან საღამოს, ბინოკლითა და ტელეობიექტივით. ბუდობის ადგილებს შორიდან უყურეთ, დრონი კი
    მანქანაში დატოვეთ. 2 100 მეტრზე ზაფხულის საღამოებიც ცივია. ნაპირზე არაფერია — არც კაფე, არც საპირფარეშო,
    არც თავშესაფარი, — ამიტომ საჭმელი და წყალი ნინოწმინდიდან წამოიღეთ.
  route: >-
    თბილისიდან წყნეთისა და კოჯრის გავლით შ36 გზით მანგლისისკენ იარეთ, შემდეგ შ31 გზით წალკის ზეგანი და
    ფარავნის ტბის ნაპირი გაიარეთ ნინოწმინდამდე — გზა განახლებულია და უმეტესად მოასფალტებული. ნინოწმინდიდან
    ს11 გზით სამხრეთ-აღმოსავლეთისკენ, გორელოვკის გავლით, დაახლოებით 17 კილომეტრი იარეთ; ნაპირამდე ბოლო,
    დაახლოებით ერთკილომეტრიანი მონაკვეთი ხრეშისა და მიწის გზაა, რომელიც წვიმის შემდეგ ტალახდება. სულ დაახლოებით
    183 კილომეტრი და 3 საათი და 35 წუთია. მაღალი გამავლობის მანქანა აქ სწორი არჩევანია: ბოლო მონაკვეთი
    მოუწესრიგებელია და სველ ამინდში რბილდება. საწვავი ნინოწმინდაში ჩაასხით; ზამთარში ზეგანს ქარბუქი და
    ყინული ეუფლება.
en:
  name: Lake Madatapa
  short: >-
    A 9 km² lake at 2,108 m on the Javakheti plateau and a Ramsar wetland since 2020: one of Georgia's
    key waterbird sites, rare pelicans included.
  body: >-
    **At 2,108 metres, on a volcanic plateau where the sky takes up more room than the land, Lake Madatapa
    is where Georgia's waterbirds come to breed and to rest on passage.**


    Madatapa lies in the south-eastern part of the Javakheti plateau, in Ninotsminda municipality, its
    open water spreading over some 8.8 square kilometres (the reserve around it covers 14 km²). It is
    one of the plateau's larger lakes, but not the largest: Paravani, to the north, at 37.5 km², is more
    than four times its size.


    Its value lies in its birds. Madatapa ranks among the most important sites in Georgia for breeding
    and staging waterbirds, the rare Dalmatian pelican among them. The lake became a managed reserve in
    2011, and on 8 July 2020 it was designated a Ramsar Wetland of International Importance, site number
    2435. It belongs to the Javakheti Protected Areas, alongside the national park and the Kartsakhi,
    Sulda, Khanchali and Bugdasheni reserves.


    Come without expecting a dramatic backdrop. There are no monuments here and no visitor centre, only
    a long shoreline, a wide sky and the patience that watching birds demands.


    Sit on the shore long enough and the still water begins to stir: a line of birds lifts off, wheels,
    and settles again.
  tip: >-
    The lake is a managed reserve, so check current access rules and any fees with the Agency of Protected
    Areas or the rangers in Ninotsminda before you drive in; don't treat it as open countryside. Come
    between June and September, ideally early or late in the day, with binoculars and a long lens. Keep
    well back from nesting birds and leave the drone in the car. At 2,100 m even summer evenings turn
    cold. There is nothing at the shore, no café, toilet or shelter, so bring food and water from Ninotsminda.
  route: >-
    Leave Tbilisi through Tskneti and Kojori on the Sh36 to Manglisi, then follow the Sh31 across the
    Tsalka plateau and past Lake Paravani to Ninotsminda, a rebuilt road that is now largely asphalt.
    From Ninotsminda take the S11 south-east for about 17 km through Gorelovka; the last kilometre or
    so to the shore is a gravel and dirt track that turns greasy after rain. About 183 km and 3 h 35 min
    in all. An SUV is the right choice, because the final track is ungraded and soft when wet. Fill up
    in Ninotsminda. In winter, drifting snow and ice take over the plateau.
ru:
  name: Озеро Мадатапа
  short: >-
    Озеро около 9 км² на высоте 2108 м на Джавахетском нагорье, с 2020 года — Рамсарское угодье: ключевое
    место для водоплавающих птиц, включая редких пеликанов.
  body: >-
    **На высоте 2108 метров, на вулканическом нагорье, где небу отведено больше места, чем земле, озеро
    Мадатапа принимает водоплавающих птиц Грузии — здесь они гнездятся и отдыхают на пролёте.**


    Мадатапа лежит в юго-восточной части Джавахетского нагорья, в Ниноцминдском муниципалитете; его открытая
    вода занимает около 8,8 квадратного километра (заказник вокруг — 14 км²). Это одно из крупных озёр
    нагорья, но не самое большое: Паравани, к северу, площадью 37,5 км², больше него более чем вчетверо.


    Его ценность — в птицах. Мадатапа входит в число важнейших мест Грузии для гнездования и остановок
    водоплавающих птиц, среди них и редкий кудрявый пеликан. В 2011 году озеро стало заказником, а 8 июля
    2020 года получило статус Рамсарского угодья международного значения под номером 2435. Оно входит
    в систему Джавахетских охраняемых территорий — вместе с национальным парком и заказниками Карцахи,
    Сулда, Ханчали и Бугдашени.


    Не ждите эффектных декораций. Здесь нет ни памятников, ни визит-центра — только длинный берег, широкое
    небо и терпение, которого требует наблюдение за птицами.


    Посидите на берегу подольше — и неподвижная вода оживёт: стая птиц поднимется, сделает круг и снова
    опустится на воду.
  tip: >-
    Озеро — заказник, поэтому, прежде чем ехать, уточните действующие правила посещения и возможную плату
    в Агентстве охраняемых территорий или у рейнджеров в Ниноцминде; не относитесь к нему как к открытой
    местности. Приезжайте с июня по сентябрь, лучше рано утром или ближе к вечеру, с биноклем и длиннофокусным
    объективом. Держитесь подальше от гнездящихся птиц, а дрон оставьте в машине. На высоте 2100 м даже
    летние вечера холодные. На берегу нет ничего — ни кафе, ни туалета, ни укрытия, — так что еду и воду
    везите из Ниноцминды.
  route: >-
    Выезжайте из Тбилиси через Цхнети и Коджори по Sh36 до Манглиси, затем по Sh31 через Цалкское плато
    мимо озера Паравани до Ниноцминды — дорога перестроена и теперь почти вся асфальтирована. Из Ниноцминды
    езжайте по S11 на юго-восток около 17 км через Гореловку; последний километр или около того до берега
    — гравийно-грунтовая колея, которая после дождя становится скользкой. Всего около 183 км и 3 ч 35
    мин. Правильный выбор — внедорожник: последняя колея не грейдирована и в сырую погоду раскисает. Заправьтесь
    в Ниноцминде. Зимой нагорье во власти снежных заносов и гололёда.
fa:
  name: دریاچهٔ مداتاپا
  short: >-
    دریاچه‌ای حدود ۹ کیلومترمربعی در ارتفاع ۲۱۰۸ متری فلات جاواختی و از ۲۰۲۰ تالاب رامسر: زیستگاهی کلیدی
    برای پرندگان آبزی گرجستان، از جمله پلیکان‌های کمیاب.
  body: >-
    **در ارتفاع ۲۱۰۸ متری، بر فلاتی آتشفشانی که آسمان در آن جای بیشتری از زمین می‌گیرد، دریاچهٔ مداتاپا
    جایی است که پرندگان آبزی گرجستان برای جوجه‌آوری و برای استراحت در مسیر کوچ به آن می‌آیند.**


    مداتاپا در بخش جنوب‌شرقی فلات جاواختی، در شهرستان نینوتسمیندا، قرار دارد و پهنهٔ آب آزادش حدود ۸٫۸
    کیلومترمربع است (ذخیره‌گاه پیرامونش ۱۴ کیلومترمربع را در بر می‌گیرد). از دریاچه‌های بزرگ‌تر فلات است،
    اما بزرگ‌ترینشان نیست: پاراوانی، در شمال، با ۳۷٫۵ کیلومترمربع، بیش از چهار برابر آن وسعت دارد.


    ارزش مداتاپا در پرندگان آن است. این دریاچه از مهم‌ترین مکان‌های گرجستان برای زادآوری و توقف پرندگان
    آبزی در مسیر کوچ به شمار می‌رود، و پلیکان پاخاکستریِ کمیاب نیز در میان آن‌هاست. دریاچه در سال ۲۰۱۱
    ذخیره‌گاهی مدیریت‌شده شد و در ۸ ژوئیهٔ ۲۰۲۰ با شمارهٔ ۲۴۳۵ به‌عنوان تالاب دارای اهمیت بین‌المللی در
    کنوانسیون رامسر ثبت شد. مداتاپا بخشی از مناطق حفاظت‌شدهٔ جاواختی است، در کنار پارک ملی و ذخیره‌گاه‌های
    کارتساخی، سولدا، خانچالی و بوگداشنی.


    بی‌انتظار منظره‌ای نمایشی بیایید. اینجا نه بنای تاریخی هست و نه مرکز بازدیدکنندگان؛ تنها کرانه‌ای
    دراز، آسمانی فراخ و صبری که تماشای پرندگان می‌طلبد.


    کافی است مدتی دراز بر کرانه بنشینید تا آب آرام جان بگیرد: دسته‌ای پرنده برمی‌خیزد، چرخی می‌زند و دوباره
    بر آب می‌نشیند.
  tip: >-
    دریاچه ذخیره‌گاهی مدیریت‌شده است، پس پیش از رفتن، مقررات کنونی دسترسی و هر ورودیه‌ای را از آژانس مناطق
    حفاظت‌شده یا محیط‌بانان در نینوتسمیندا جویا شوید؛ آن را دشتی باز و بی‌صاحب فرض نکنید. بین ژوئن و سپتامبر
    بیایید، ترجیحاً صبح زود یا نزدیک غروب، با دوربین دوچشمی و لنز تله. از پرندگانِ روی لانه فاصلهٔ زیادی
    بگیرید و پهپاد را در خودرو بگذارید. در ارتفاع ۲۱۰۰ متری حتی شب‌های تابستان سرد می‌شود. کنار دریاچه
    هیچ چیز نیست — نه کافه، نه دست‌شویی، نه سرپناه — پس آب و غذا را از نینوتسمیندا بیاورید.
  route: >-
    از تفلیس از راه تسخنتی و کوجوری، با جادهٔ Sh36 به مانگلیسی بروید، سپس با Sh31 از فلات تسالکا و از
    کنار دریاچهٔ پاراوانی تا نینوتسمیندا برانید؛ این جاده بازسازی شده و اکنون بیشترش آسفالت است. از نینوتسمیندا
    جادهٔ S11 را حدود ۱۷ کیلومتر به سمت جنوب‌شرقی، از میان گورلوفکا، بروید؛ حدود یک کیلومتر پایانی تا
    ساحل راهی شنی و خاکی است که پس از باران لغزنده می‌شود. روی‌هم حدود ۱۸۳ کیلومتر و ۳ ساعت و ۳۵ دقیقه.
    خودروی شاسی‌بلند انتخاب درست است، چون راه پایانی تسطیح نشده و در هوای مرطوب گل‌آلود می‌شود. در نینوتسمیندا
    باک را پر کنید. در زمستان، کولاک و یخ‌بندان بر فلات چیره می‌شوند.
he:
  name: אגם מדאטפה
  short: >-
    אגם בשטח של כ-9 קמ"ר, בגובה 2,108 מטרים ברמת ג'אווחטי, ומאז 2020 אתר רמסר: אחד האתרים החשובים בגאורגיה
    לעופות מים, ובהם שקנאים נדירים.
  body: >-
    **בגובה 2,108 מטרים, על רמה געשית שבה השמיים תופסים יותר מקום מן האדמה, אגם מדאטפה הוא המקום שאליו
    מגיעים עופות המים של גאורגיה כדי לקנן ולנוח בדרכי הנדידה.**


    מדאטפה שוכן בחלקה הדרום-מזרחי של רמת ג'אווחטי, בתחום מחוז נינוצמינדה, ומראת המים הפתוחה שלו משתרעת
    על פני כ-8.8 קמ"ר (השמורה שסביבו משתרעת על 14 קמ"ר). זהו אחד האגמים הגדולים ברמה, אך לא הגדול שבהם:
    פרוואני, מצפון, ששטחו 37.5 קמ"ר, גדול ממנו יותר מפי ארבעה.


    ערכו טמון בציפורים. מדאטפה נמנה עם האתרים החשובים ביותר בגאורגיה לקינון ולחניית ביניים של עופות מים,
    ובהם השקנאי המסולסל הנדיר. ב-2011 הוכרז האגם שמורה מנוהלת, וב-8 ביולי 2020 הוכרז אתר רמסר — אזור לח
    בעל חשיבות בינלאומית — שמספרו 2435. הוא חלק מהשטחים המוגנים של ג'אווחטי, לצד הפארק הלאומי והשמורות
    קרצחי, סולדה, חנצ'לי ובוגדשני.


    אל תבואו בציפייה לתפאורה דרמטית. אין כאן אתרים היסטוריים ואין מרכז מבקרים, רק קו חוף ארוך, שמיים רחבים
    והסבלנות שצפייה בציפורים דורשת.


    שבו על החוף די זמן, והמים הדוממים יתעוררו: להקת ציפורים תמריא, תחוג במעגל ותשוב לנחות על המים.
  tip: >-
    האגם הוא שמורה מנוהלת, ולכן לפני שאתם נוסעים אליו בררו את כללי הגישה העדכניים ואת דמי הכניסה, אם יש,
    בסוכנות לשטחים מוגנים או אצל הפקחים בנינוצמינדה; אל תתייחסו אליו כאל שטח פתוח. בואו בין יוני לספטמבר,
    רצוי מוקדם בבוקר או לקראת ערב, עם משקפת ועדשה ארוכה. שמרו מרחק רב מציפורים מקננות והשאירו את הרחפן
    ברכב. בגובה 2,100 מטרים גם ערבי הקיץ קרים. על החוף אין דבר — לא בית קפה, לא שירותים ולא מחסה — אז
    הביאו אוכל ומים מנינוצמינדה.
  route: >-
    צאו מטביליסי דרך צקנטי וקוג'ורי בכביש Sh36 עד מנגליסי, ומשם בכביש Sh31 לרוחב רמת צאלקה, על פני אגם
    פרוואני, עד נינוצמינדה — כביש ששוקם וכיום סלול ברובו. מנינוצמינדה סעו בכביש S11 דרום-מזרחה כ-17 ק"מ
    דרך גורלובקה; הקילומטר האחרון בערך עד החוף הוא דרך חצץ ועפר שנעשית חלקלקה אחרי גשם. בסך הכול כ-183
    ק"מ ו-3 שעות ו-35 דקות. רכב שטח הוא הבחירה הנכונה, כי הדרך האחרונה אינה מוסדרת ובמזג אוויר רטוב היא
    בוצית. תדלקו בנינוצמינדה. בחורף שולטים ברמה סחף שלג וקרח.
ar:
  name: بحيرة ماداتابا
  short: >-
    بحيرة مساحتها نحو 9 كم² على ارتفاع 2108 أمتار في هضبة جافاخيتي، وموقع رامسار منذ 2020: من أهم مواقع
    الطيور المائية في جورجيا، ومنها البجع النادر.
  body: >-
    **على ارتفاع 2108 أمتار، فوق هضبة بركانية تشغل فيها السماء حيّزًا أكبر من الأرض، تستقبل بحيرة ماداتابا
    الطيور المائية في جورجيا لتعشّش فيها وتستريح في أثناء هجرتها.**


    تقع ماداتابا في الجزء الجنوبي الشرقي من هضبة جافاخيتي، ضمن بلدية نينوتسميندا، وتمتد مياهها المفتوحة
    على نحو 8.8 كيلومترات مربعة (أما المحمية المحيطة بها فتغطي 14 كم²). وهي من كبرى بحيرات الهضبة، لكنها
    ليست أكبرها: فبارافاني، إلى الشمال، بمساحتها البالغة 37.5 كم²، تفوقها بأكثر من أربعة أضعاف.


    وقيمتها في طيورها. فماداتابا من أهم المواقع في جورجيا لتعشيش الطيور المائية وتوقّفها في مواسم الهجرة،
    ومنها البجع الدلماسي النادر. وقد صارت البحيرة محمية مُدارة عام 2011، ثم أُدرجت في 8 يوليو/تموز 2020
    ضمن الأراضي الرطبة ذات الأهمية الدولية بموجب اتفاقية رامسار، تحت الرقم 2435. وهي جزء من المناطق المحمية
    في جافاخيتي، إلى جانب الحديقة الوطنية ومحميات كارتساخي وسولدا وخانتشالي وبوغداشيني.


    لا تأتِ متوقّعًا خلفية مسرحية مبهرة. فلا معالم هنا ولا مركز للزوار، بل شاطئ طويل، وسماء رحبة، والصبر
    الذي تتطلّبه مراقبة الطيور.


    اجلس على الشاطئ وقتًا كافيًا، وسيدبّ الحراك في الماء الساكن: سربٌ من الطيور يحلّق، ويدور دورة، ثم
    يحطّ على الماء من جديد.
  tip: >-
    البحيرة محمية مُدارة، لذا تحقّق من قواعد الدخول الحالية ومن أي رسوم لدى وكالة المناطق المحمية أو لدى
    الحرّاس في نينوتسميندا قبل أن تتوجّه إليها؛ ولا تعاملها كأنها أرض مفتوحة. تعالَ بين يونيو/حزيران وسبتمبر/أيلول،
    ويُفضّل في الصباح الباكر أو قرب المساء، ومعك منظار وعدسة مقرّبة. ابتعد كثيرًا عن الطيور الحاضنة، واترك
    الطائرة المسيّرة في السيارة. على ارتفاع 2100 متر تبرد حتى أمسيات الصيف. لا شيء على الشاطئ — لا مقهى
    ولا دورات مياه ولا مأوى — فاحمل الطعام والماء من نينوتسميندا.
  route: >-
    اخرج من تبليسي عبر تسخنيتي وكوجوري على الطريق Sh36 حتى مانغليسي، ثم اتبع الطريق Sh31 عبر هضبة تسالكا
    مرورًا ببحيرة بارافاني حتى نينوتسميندا، وهو طريق أُعيد بناؤه وأصبح الآن معبّدًا في معظمه. ومن نينوتسميندا
    اسلك الطريق S11 باتجاه الجنوب الشرقي نحو 17 كم عبر غوريلوفكا؛ أما الكيلومتر الأخير تقريبًا حتى الشاطئ
    فمسلك من الحصى والتراب يصبح زلقًا بعد المطر. نحو 183 كم و3 ساعات و35 دقيقة إجمالًا. سيارة الدفع الرباعي
    هي الخيار الصحيح، لأن المسلك الأخير غير مُسوّى ويتحوّل إلى وحل في الطقس الرطب. تزوّد بالوقود في نينوتسميندا.
    وفي الشتاء تسيطر على الهضبة الثلوج المنجرفة والجليد.
