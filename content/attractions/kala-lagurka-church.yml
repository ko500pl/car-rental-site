ka:
  name: კალა და ლაგურკა (წმინდა კვირიკესა და ივლიტას ეკლესია)
  short: >-
    ხუთიოდე მეტრი სიგრძის ეკლესია ენგურის ზემოთ, 1111/1112 წლებში მოხატული: აქ სვანები ყველაზე მძიმე ფიცს
    დებდნენ და ყოველ 28 ივლისს დღესაც იკრიბებიან.
  body: >-
    **ლაგურკა სულ ხუთიოდე მეტრი სიგრძისაა, ექვთიმე თაყაიშვილმა კი ის დელფოს შეადარა: რაც ძველი ბერძნებისთვის
    დელფო იყო, ის სვანებისთვის ლაგურკაა — მათი ერთობის სიმბოლო.**


    ეკლესია ენგურის მარცხენა მხარეს, კალის თემში, სოფელ ხის ზემოთ, მაღალ ბორცვზე დგას. სახელი კვირიკეს
    სვანური ფორმიდან მომდინარეობს: ყრმა მოწამე კვირიკე და მისი დედა ივლიტა კალის თემის მფარველებად ითვლებიან.
    მოყვითალო ქვით ნაგები ამ დარბაზული ეკლესიის აგების თარიღი არსად წერია — სტილის მიხედვით, ის X საუკუნის
    ბოლოდან XII საუკუნის დასაწყისამდე პერიოდს მიეკუთვნება. მოხატულობის ასაკი კი თავად კედელმა შემოგვინახა:
    დასავლეთ კედლის დაზიანებული წარწერა მას 1111 ან 1112 წლით ათარიღებს და შემომწირველებს, კალის აზნაურებს,
    ასახელებს. მხატვრის სახელი ნაწილობრივ წაშლილია, მაგრამ იფრარისა და ნაკიფარის ეკლესიებთან შედარებით
    თევდორედ აღდგება — ეს ის „მეფის მხატვარია“, ვინც ორივე ეს ტაძარიც მოხატა.


    შიგნით მხოლოდ ორი სარკმელია — ერთი აფსიდში, მეორე დასავლეთ კედელში — და მათი შუქი პირდაპირ მოხატულ
    აღმოსავლეთ და დასავლეთ კედლებს ეცემა. კონქში ვედრებაა გამოსახული: ქრისტეს უჭირავს გრაგნილი იოანეს
    სახარების სიტყვებით — „მე ვარ ნათელი სოფლისა“. კედლებზე შობა, ნათლისღება, ჯვარცმა და აღდგომაა, წმინდანები
    — ბარბარე, ეკატერინე, სტეფანე, ქრისტინე, გიორგი და თევდორე — და ორი სცენა კვირიკესა და ივლიტას წამებიდან.
    კონქისა და კანკელის მხატვრობა, რომელიც მიწისძვრამ დააზიანა, მოგვიანებით გიორგი ანტონის ძემ აღადგინა
    — ამას სამხრეთ პილასტრზე მისივე წარწერა მოგვითხრობს. საგანძურში ხელნაწერები, ჯვრები და ხატები ინახება,
    მათ შორის დიდად პატივდებული შალიანის ხატი — ჯვარცმის ბიზანტიური ჭედური გამოსახულება.


    სვანისთვის ყველაზე შეუვალი ფიცი სწორედ აქ დაცულ ხატებზე დადებული ფიცი იყო. ყოველ 28 ივლისს, კვირიკობას,
    ბორცვზე მთელი სვანეთიდან ადიან მლოცველები: ლოცვას სუფრა და ძალის ძველი შეჯიბრებები მოსდევს, მათ შორის
    მძიმე ლოდის აწევა და მხარს იქით გადაგდება — ჩვეულება, რომელსაც ზოგი მკვლევარი ქრისტიანობამდელ რიტუალებს
    უკავშირებს.


    ხუთი მეტრი ქვა და ცხრასაუკუნოვანი ფერები: სვანეთი ყველაზე ძვირფასს პატარა სივრცეში ინახავს.
  tip: >-
    ნუ დაეყრდნობით, რომ კარი ღია დაგხვდებათ: კვირიკობის (28 ივლისი) გარდა ეკლესია შეიძლება დაკეტილი იყოს.
    სოფელში იკითხეთ, ვის აქვს გასაღები — მუდმივი წესი ამაზე ვერ დავადასტურეთ. მანქანა სოფელში დატოვეთ;
    ასვლასა და დათვალიერებას დაახლოებით ერთი საათი დასჭირდება. ბილიკი ციცაბო და მოუკირწყლავია, ამიტომ
    მყარი ფეხსაცმელი აუცილებელია. შესამოსელი თავდაჭერილი იყოს: მხრები და მუხლები დაფარული, ქალებს — თავსაფარი.
    ცხრასაუკუნოვან ფრესკებს ფლეში ვნებს. ეკლესიასთან არც წყალია, არც ტუალეტი — საჭმელი, საწვავი და ნაღდი
    ფული მესტიაში მოიმარაგეთ. 28 ივლისს აქ ხალხმრავლობა, სუფრა და ნამდვილი დღესასწაული დაგხვდებათ და არა
    მშვიდი ვიზიტი.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ იარეთ, ქუთაისისა და სამტრედიის მიმართულებით, სენაკის
    გავლით ზუგდიდამდე, იქიდან კი ენგურის ხეობით მესტიამდე ადით — დაახლოებით 470 კმ და რვანახევარი საათი,
    მთლიანად ასფალტზე. საწვავი ზუგდიდში ან მესტიაში ჩაასხით: ზემოთ გასამართი აღარ არის. მესტიიდან უშგულის
    გზას აღმოსავლეთით გაუყევით დაახლოებით 30 კილომეტრი კალამდე; ეკლესია სოფელ ხის ზემოთ, ბორცვზე დგას.
    თბილისიდან სულ დაახლოებით 502 კმ და ათ საათამდე საჭესთან — რეალურად ორი დღე, მესტიაში ღამის გათევით.
    უშგულის გზა ახლა უმეტესად მოასფალტებულია, მაგრამ ვიწროა, უხეში მონაკვეთებითა და ენგურის თავზე დაუცავი
    კიდეებით, ამიტომ მაღალი გამავლობის მანქანა (კროსოვერი ან ჯიპი) ყველაზე გონივრული არჩევანია. დეკემბრიდან
    აპრილამდე თოვლი ამ გზას არასანდოს ხდის.
en:
  name: Kala and the Lagurka Church (Sts Kvirike and Ivlita)
  short: >-
    A church barely five metres long above the Enguri, frescoed in 1111/12, where Svans swore their gravest
    oaths and still gather every 28 July.
  body: >-
    **Lagurka is barely five metres long, yet Ekvtime Takaishvili likened it to Delphi: what Delphi was
    to the ancient Greeks, Lagurka is to the Svans — the symbol of their unity.**


    The church stands on a high hill above the village of Khe, in the Kala community, on the left bank
    of the Enguri. Its name is the Svan form of Kvirike: the child martyr Kvirike (Cyricus) and his mother
    Ivlita (Julitta) are Kala's patron saints. The hall of yellowish stone is dated by its style to between
    the late tenth and early twelfth centuries, but the paintings carry their own date: a damaged inscription
    on the west wall gives 1111 or 1112 and names the donors, the aznauri, or gentry, of Kala. Comparison
    with Iprari and Nakipari restores the half-lost name of the painter as Tevdore, the "king's painter"
    who decorated both.


    Two windows, one in the apse and one in the west wall, throw light straight onto the painted walls.
    In the apse Christ sits in the Deesis with a scroll from St John: "I am the light of the world." Around
    the nave run the Nativity, Baptism, Crucifixion and Resurrection; saints Barbara, Catherine, Stephen,
    Christina, George and Theodore; and the martyrdom of Kvirike and Ivlita. After an earthquake, a later
    painter, Giorgi son of Anton, restored the apse and iconostasis and signed his work. The treasury
    keeps manuscripts, crosses and the venerated Shaliani icon, a Byzantine repoussé Crucifixion.


    The most binding oath a Svan could swear was sworn on these icons. Every 28 July, at Kvirikoba, pilgrims
    from across Svaneti still climb the hill; after the prayers come a feast and old trials of strength,
    such as heaving a heavy boulder over the shoulder — a custom some scholars trace to rites older than
    Christianity.


    Five metres of stone and nine centuries of colour: Svaneti keeps its most precious things small.
  tip: >-
    Do not count on an open door: outside Kvirikoba (28 July) the church may be locked, and it is worth
    asking in the village who holds the key — we could not confirm a fixed arrangement. Park in the village
    and allow about an hour for the climb and the visit; the path is steep and unpaved, so wear proper
    shoes. Dress modestly, with shoulders and knees covered and a headscarf for women. Nine-hundred-year-old
    frescoes do not need your flash. There is no water or toilet at the church; stock up on food, fuel
    and cash in Mestia. On 28 July expect crowds and a festival, not a quiet visit.
  route: >-
    From Tbilisi take the S1 west towards Kutaisi and Samtredia, through Senaki to Zugdidi, then climb
    the Enguri gorge to Mestia — about 470 km and eight and a half hours, all asphalt. Refuel in Zugdidi
    or Mestia; there is no fuel higher up. From Mestia follow the Ushguli road east for roughly 30 km
    to Kala; the church stands on the hill above the village of Khe. In all about 502 km and just under
    ten hours at the wheel, realistically two days with a night in Mestia. The Ushguli road is now largely
    paved but narrow, with rough stretches and unguarded drops above the Enguri, so an SUV is the sensible
    choice. From December to April snow makes it unreliable.
ru:
  name: Кала и церковь Лагурка (Святых Квирике и Ивлиты)
  short: >-
    Церковь длиной едва в пять метров над Ингури, расписанная в 1111/12 году: здесь сваны давали самые
    страшные клятвы и каждый год 28 июля собираются до сих пор.
  body: >-
    **Лагурка длиной едва в пять метров, и всё же Эквтиме Такайшвили сравнивал её с Дельфами: чем Дельфы
    были для древних греков, тем Лагурка является для сванов — символом их единства.**


    Церковь стоит на высоком холме над селом Хе, в общине Кала, на левом берегу Ингури. Её название —
    сванская форма имени Квирике: мальчик-мученик Квирике (Кирик) и его мать Ивлита (Иулитта) — покровители
    Калы. Однонефный зал из желтоватого камня по стилю датируют временем между концом X и началом XII
    века, но у росписей есть собственная дата: повреждённая надпись на западной стене называет 1111 или
    1112 год и заказчиков — азнауров, то есть дворян, Калы. Сравнение с Ипрари и Накипари позволяет восстановить
    наполовину утраченное имя художника: Тевдоре, «царский художник», расписавший обе эти церкви.


    Два окна, одно в апсиде и одно в западной стене, бросают свет прямо на расписанные стены. В апсиде
    Христос восседает в Деисусе со свитком, на котором слова из Евангелия от Иоанна: «Я свет миру». По
    стенам нефа — Рождество, Крещение, Распятие и Воскресение; святые Варвара, Екатерина, Стефан, Христина,
    Георгий и Феодор; мученичество Квирике и Ивлиты. После землетрясения позднейший художник, Гиорги,
    сын Антона, восстановил апсиду и иконостас и оставил свою подпись. В ризнице хранятся рукописи, кресты
    и почитаемая Шалианская икона — византийское чеканное Распятие.


    Самую нерушимую клятву, какую только мог дать сван, приносили на этих иконах. Каждый год 28 июля,
    на Квирикобу, паломники со всей Сванетии по-прежнему поднимаются на холм; после молитв следуют застолье
    и старинные состязания в силе — например, тяжёлый валун нужно перебросить через плечо; некоторые учёные
    возводят этот обычай к обрядам древнее христианства.


    Пять метров камня и девять веков красок: самое драгоценное Сванетия хранит в малом.
  tip: >-
    Не рассчитывайте на открытую дверь: вне Квирикобы (28 июля) церковь может быть заперта, и стоит спросить
    в селе, у кого ключ, — установленного порядка нам подтвердить не удалось. Оставьте машину в селе и
    заложите около часа на подъём и осмотр; тропа крутая и грунтовая, так что наденьте нормальную обувь.
    Одевайтесь скромно: плечи и колени закрыты, женщинам — платок. Девятисотлетним фрескам ваша вспышка
    не нужна. У церкви нет ни воды, ни туалета; еду, топливо и наличные запасите в Местиа. 28 июля ждите
    толпы и праздника, а не тихого визита.
  route: >-
    Из Тбилиси поезжайте по S1 на запад, в сторону Кутаиси и Самтредиа, через Сенаки до Зугдиди, а затем
    поднимайтесь по ущелью Ингури до Местиа — около 470 км и восемь с половиной часов, всё по асфальту.
    Заправьтесь в Зугдиди или Местиа: выше заправок нет. Из Местиа следуйте по дороге на Ушгули на восток
    примерно 30 км до Калы; церковь стоит на холме над селом Хе. Всего около 502 км и почти десять часов
    за рулём — реально это два дня с ночёвкой в Местиа. Дорога на Ушгули теперь в основном асфальтирована,
    но узкая, с разбитыми участками и обрывами над Ингури без ограждений, поэтому разумный выбор — внедорожник.
    С декабря по апрель из-за снега на неё нельзя полагаться.
fa:
  name: کالا و کلیسای لاگورکا (قدیسان کویریکه و ایولیتا)
  short: >-
    کلیسایی به‌زحمت پنج‌متری بر فراز رود انگوری با نقاشی‌های ۱۱۱۱/۱۲؛ جایی که سوان‌ها سنگین‌ترین سوگندهایشان
    را می‌خوردند و هنوز هر ۲۸ ژوئیه گرد می‌آیند.
  body: >-
    **لاگورکا به‌زحمت پنج متر درازا دارد، با این همه اکوتیمه تکایشویلی آن را با دلفی مقایسه کرد: آنچه
    دلفی برای یونانیان باستان بود، لاگورکا برای سوان‌هاست — نماد یگانگی‌شان.**


    کلیسا بر تپه‌ای بلند بالای روستای خه، در دهستان کالا و بر کرانهٔ چپ رود انگوری ایستاده است. نامش صورت
    سوانیِ نام کویریکه است: کویریکه (کوریکوس)، کودکی که به شهادت رسید، و مادرش ایولیتا (ژولیتا) قدیسان
    حامی کالا هستند. این تالار تک‌فضایی از سنگ زردفام را بر پایهٔ سبک معماری‌اش به بازهٔ میان اواخر سدهٔ
    دهم و اوایل سدهٔ دوازدهم نسبت می‌دهند، اما نقاشی‌ها تاریخ خود را دارند: کتیبه‌ای آسیب‌دیده بر دیوار
    غربی سال ۱۱۱۱ یا ۱۱۱۲ را ذکر می‌کند و از بانیان، یعنی آزناورها یا نجیب‌زادگان کالا، نام می‌برد. مقایسه
    با ایپراری و ناکیپاری نام نیمه‌پاک‌شدهٔ نقاش را بازمی‌سازد: تئودوره، «نقاش شاه»، که هر دو کلیسا را
    آراسته بود.


    دو پنجره، یکی در شاه‌نشین محراب و دیگری در دیوار غربی، نور را مستقیم بر دیوارهای نقاشی‌شده می‌تابانند.
    در محراب، مسیح در صحنهٔ دیسیس نشسته و طوماری در دست دارد با سخنی از انجیل یوحنا: «من نور عالم هستم».
    گرداگرد شبستان صحنه‌های میلاد، تعمید، مصلوب شدن و رستاخیز مسیح نقش بسته‌اند؛ قدیسان باربارا، کاترین،
    استفان، کریستینا، گئورگی و تئودور؛ و شهادت کویریکه و ایولیتا. پس از زمین‌لرزه‌ای، نقاشی متأخرتر به
    نام گیورگی پسر آنتون، محراب و دیوارهٔ شمایل (ایکونوستاز) را مرمت کرد و پای کارش امضا گذاشت. در خزانهٔ
    کلیسا نسخه‌های خطی، صلیب‌ها و شمایل مقدس شالیانی نگهداری می‌شود: تصویری بیزانسی از مصلوب شدن مسیح
    با نقش برجستهٔ کوبیده بر فلز.


    الزام‌آورترین سوگندی که یک سوان می‌توانست بخورد، بر همین شمایل‌ها خورده می‌شد. هنوز هم هر سال در ۲۸
    ژوئیه، در جشن کویریکوبا، زائران از سراسر سوانتی از تپه بالا می‌روند؛ پس از دعا نوبت سور و زورآزمایی‌های
    کهن است، مانند پرتاب تخته‌سنگی سنگین از روی شانه — رسمی که برخی پژوهشگران ریشه‌اش را در آیین‌هایی
    کهن‌تر از مسیحیت می‌جویند.


    پنج متر سنگ و نه سده رنگ: سوانتی گران‌بهاترین چیزهایش را کوچک نگه می‌دارد.
  tip: >-
    به باز بودن در دل نبندید: جز در روز کویریکوبا (۲۸ ژوئیه) ممکن است کلیسا قفل باشد و بهتر است در روستا
    بپرسید کلید دست کیست — ما نتوانستیم ترتیب ثابتی را تأیید کنیم. خودرو را در روستا پارک کنید و برای
    بالا رفتن و بازدید حدود یک ساعت وقت بگذارید؛ مسیر شیب‌دار و خاکی است، پس کفش مناسب بپوشید. لباس پوشیده
    بپوشید: شانه‌ها و زانوها پوشیده و روسری برای بانوان. نقاشی‌های نهصدساله به فلاش شما نیازی ندارند.
    کنار کلیسا نه آب هست و نه سرویس بهداشتی؛ خوراک، سوخت و پول نقد را در مستیا تهیه کنید. در ۲۸ ژوئیه
    منتظر ازدحام و جشن باشید، نه بازدیدی آرام.
  route: >-
    از تفلیس جادهٔ S1 را به سمت غرب، به سوی کوتائیسی و سامتردیا، بگیرید و از سناکی بگذرید تا زوگدیدی؛
    سپس درهٔ انگوری را تا مستیا بالا بروید — حدود ۴۷۰ کیلومتر و هشت ساعت و نیم، همه آسفالت. در زوگدیدی
    یا مستیا سوخت بگیرید؛ بالاتر جایگاه سوختی نیست. از مستیا جادهٔ اوشگولی را حدود ۳۰ کیلومتر به سمت شرق
    تا کالا دنبال کنید؛ کلیسا بر تپهٔ بالای روستای خه ایستاده است. روی هم حدود ۵۰۲ کیلومتر و نزدیک به
    ده ساعت پشت فرمان، که در عمل یعنی دو روز با یک شب اقامت در مستیا. جادهٔ اوشگولی اکنون بیشترش آسفالت
    است، اما باریک است و تکه‌های ناهموار و پرتگاه‌های بی‌حفاظ بر فراز انگوری دارد؛ از این رو خودروی شاسی‌بلند
    انتخاب معقولی است. از دسامبر تا آوریل برف رفت‌وآمد در آن را غیرقابل‌اعتماد می‌کند.
he:
  name: קאלה וכנסיית לגורקה (הקדושים קוויריקה ואיווליטה)
  short: >-
    כנסייה שאורכה בקושי חמישה מטרים מעל האנגורי, שצוירה ב-1111/12; כאן נשבעו הסוואנים את שבועותיהם החמורות
    ביותר, ולכאן הם מתכנסים עד היום בכל 28 ביולי.
  body: >-
    **אורכה של לגורקה בקושי חמישה מטרים, ובכל זאת אקבתימה תקאישווילי השווה אותה לדלפי: לגורקה היא לסוואנים
    מה שהייתה דלפי ליוונים הקדמונים — סמל לאחדותם.**


    הכנסייה עומדת על גבעה גבוהה מעל הכפר חה, בתחום קהילת קאלה, על הגדה השמאלית של האנגורי. שמה הוא הצורה
    הסוואנית של השם קוויריקה: הילד הקדוש המעונה קוויריקה (קיריקוס) ואמו איווליטה (יוליטה) הם הקדושים הפטרונים
    של קאלה. מבנה האולם הפשוט, מאבן צהבהבה, מתוארך לפי סגנונו לתקופה שבין סוף המאה ה-10 לתחילת המאה ה-12,
    אך לציורים יש תאריך משלהם: כתובת פגועה על הקיר המערבי נוקבת בשנת 1111 או 1112 ומציינת את התורמים —
    האזנאורי, כלומר בני האצולה, של קאלה. השוואה לאיפרארי ולנקיפארי משחזרת את שמו של הצייר, שנמחק למחצה:
    טוודורה, "צייר המלך", שעיטר את שתיהן.


    שני חלונות, אחד באפסיס ואחד בקיר המערבי, מטילים אור ישר על הקירות המצוירים. באפסיס יושב ישו בסצנת
    הדאיסיס, ובידו מגילה ובה פסוק מהבשורה על פי יוחנן: "אני אור העולם". סביב האולם נפרשים המולד, הטבילה,
    הצליבה ותחיית ישו; הקדושים ברברה, קתרינה, סטפנוס, כריסטינה, גאורגיוס ותאודורוס; ומות הקדושים של קוויריקה
    ואיווליטה. אחרי רעידת אדמה שיקם צייר מאוחר יותר, גיורגי בן אנטון, את האפסיס ואת האיקונוסטזיס וחתם
    על עבודתו. באוצר הכנסייה שמורים כתבי יד, צלבים ואיקונת שליאני הנערצת — צליבה ביזנטית בעבודת ריקוע
    במתכת.


    השבועה המחייבת ביותר שסוואני יכול היה להישבע נשבעה על האיקונות האלה. בכל 28 ביולי, בחג קוויריקובה,
    עולים עולי רגל מכל רחבי סוואנטי אל הגבעה גם היום; אחרי התפילות באים משתה ותחרויות כוח עתיקות, כמו
    הנפת סלע כבד והשלכתו מעבר לכתף — מנהג שיש חוקרים המייחסים את מקורו לטקסים שקדמו לנצרות.


    חמישה מטרים של אבן ותשע מאות שנים של צבע: את היקר לה מכול שומרת סוואנטי בקטן.
  tip: >-
    אל תסמכו על דלת פתוחה: מחוץ לקוויריקובה (28 ביולי) הכנסייה עשויה להיות נעולה, וכדאי לשאול בכפר מי
    מחזיק במפתח — לא הצלחנו לאמת הסדר קבוע. החנו בכפר והקדישו כשעה לעלייה ולביקור; השביל תלול ולא סלול,
    אז נעלו נעליים מתאימות. התלבשו בצניעות: כתפיים וברכיים מכוסות, ומטפחת ראש לנשים. ציורי קיר בני תשע
    מאות שנה אינם זקוקים לפלאש שלכם. ליד הכנסייה אין מים ואין שירותים; הצטיידו במזון, בדלק ובמזומן במסטיה.
    ב-28 ביולי צפו להמונים ולחגיגה, לא לביקור שקט.
  route: >-
    מטביליסי סעו מערבה בכביש S1 לכיוון קוטאיסי וסמטרדיה, דרך סנאקי עד זוגדידי, ומשם טפסו בערוץ האנגורי
    עד מסטיה — כ-470 ק"מ ושמונה שעות וחצי, כולם בכביש סלול. תדלקו בזוגדידי או במסטיה; למעלה אין תחנות
    דלק. ממסטיה סעו מזרחה בדרך לאושגולי כ-30 ק"מ עד קאלה; הכנסייה ניצבת על הגבעה שמעל הכפר חה. בסך הכול
    כ-502 ק"מ וקרוב לעשר שעות מאחורי ההגה, ולמעשה יומיים עם לינה במסטיה. הדרך לאושגולי סלולה כיום ברובה,
    אך היא צרה, עם קטעים משובשים ותהומות ללא מעקה מעל האנגורי, ולכן רכב פנאי-שטח הוא הבחירה הנבונה. מדצמבר
    עד אפריל השלג הופך אותה לבלתי אמינה.
ar:
  name: كالا وكنيسة لاغوركا (القديسان كفيريكي وإيفليتا)
  short: >-
    كنيسة بالكاد يبلغ طولها خمسة أمتار فوق نهر إنغوري، رُسمت جدارياتها عام 1111/12، أقسم فيها السفان أغلظ
    أيمانهم وما زالوا يجتمعون عندها كل 28 يوليو.
  body: >-
    **بالكاد يبلغ طول لاغوركا خمسة أمتار، ومع ذلك شبّهها إكفتيمه تاكايشفيلي بدلفي: فما كانته دلفي لليونانيين
    القدماء، هو ما تمثله لاغوركا للسفان — رمز وحدتهم.**


    تقوم الكنيسة على تلة عالية فوق قرية خي، ضمن تجمّع كالا الريفي، على الضفة اليسرى لنهر إنغوري. واسمها
    هو الصيغة السفانية لاسم كفيريكي: فالطفل الشهيد كفيريكي (قرياقوس) وأمه إيفليتا (يوليطة) هما شفيعا كالا.
    يُؤرَّخ هذا المبنى ذو القاعة الواحدة، المشيّد من حجر مائل إلى الصفرة، استنادًا إلى طرازه، بالفترة
    الممتدة بين أواخر القرن العاشر ومطلع القرن الثاني عشر، أما الرسوم فتحمل تاريخها الخاص: نقش متضرر على
    الجدار الغربي يذكر عام 1111 أو 1112 ويسمّي الواهبين، وهم الأزناوري، أي نبلاء كالا. وبالمقارنة مع إيبراري
    وناكيباري يُستعاد اسم الرسام الذي امّحى نصفه: تيفدوره، "رسام الملك"، الذي زيّن الكنيستين كلتيهما.


    تُلقي نافذتان، واحدة في الحنية وأخرى في الجدار الغربي، الضوء مباشرة على الجدران المرسومة. في الحنية
    يجلس المسيح في مشهد الديسيس (الشفاعة) حاملًا لفافة عليها آية من إنجيل يوحنا: "أنا هو نور العالم".
    وتتوالى حول صحن الكنيسة مشاهد الميلاد والمعمودية والصلب والقيامة؛ والقديسون بربارة وكاترين واستفانوس
    وكريستينا وجاورجيوس وثيودوروس؛ واستشهاد كفيريكي وإيفليتا. وبعد زلزال، رمّم رسام لاحق، هو غيورغي بن
    أنطون، الحنية والأيقونسطاس ووقّع عمله. وتحفظ خزانة الكنيسة مخطوطات وصلبانًا والأيقونة المبجّلة المعروفة
    بأيقونة شالياني، وهي مشهد صلب بيزنطي منفّذ بالطَّرق البارز على المعدن.


    كانت أغلظُ يمينٍ يمكن أن يقسمها سفانيّ تُقسَم على هذه الأيقونات. وفي 28 يوليو من كل عام، في عيد كفيريكوبا،
    ما زال الحجاج من أنحاء سفانيتي كلها يصعدون التلة؛ وبعد الصلوات تأتي الوليمة ومباريات القوة القديمة،
    كرفع صخرة ثقيلة وقذفها من فوق الكتف — وهي عادة يردّها بعض الباحثين إلى طقوس أقدم من المسيحية.


    خمسة أمتار من الحجر وتسعة قرون من الألوان: سفانيتي تحفظ أثمن ما لديها في أصغر الأشياء.
  tip: >-
    لا تعوّل على باب مفتوح: ففي غير عيد كفيريكوبا (28 يوليو) قد تكون الكنيسة مقفلة، ومن المفيد أن تسأل
    في القرية عمّن يحتفظ بالمفتاح، إذ لم نتمكن من التحقق من ترتيب ثابت. اترك السيارة في القرية وخصّص نحو
    ساعة للصعود والزيارة؛ الدرب شديد الانحدار وغير معبّد، فانتعل حذاءً مناسبًا. التزم اللباس المحتشم مع
    تغطية الكتفين والركبتين، وعلى النساء تغطية الرأس. الجداريات التي يبلغ عمرها تسعمئة عام لا تحتاج إلى
    فلاش كاميرتك. لا ماء ولا دورة مياه عند الكنيسة؛ تزوّد بالطعام والوقود والنقود في ميستيا. وفي 28 يوليو
    توقّع حشودًا واحتفالًا، لا زيارة هادئة.
  route: >-
    من تبليسي اسلك الطريق S1 غربًا باتجاه كوتايسي وسامتريديا، مرورًا بسيناكي حتى زوغديدي، ثم اصعد وادي
    إنغوري حتى ميستيا — نحو 470 كم وثماني ساعات ونصف، كلها معبّدة. تزوّد بالوقود في زوغديدي أو ميستيا؛
    فلا محطات بعدهما صعودًا. من ميستيا اتبع طريق أوشغولي شرقًا نحو 30 كم حتى كالا؛ وتقوم الكنيسة على التلة
    فوق قرية خي. المجموع نحو 502 كم وقرابة عشر ساعات خلف المقود، أي عمليًا يومان مع مبيت في ميستيا. طريق
    أوشغولي معبّد اليوم في معظمه، لكنه ضيق، فيه مقاطع وعرة وحافات بلا حواجز فوق نهر إنغوري، لذا فالسيارة
    الرياضية متعددة الاستخدامات هي الخيار الحكيم. ومن ديسمبر إلى أبريل يجعله الثلج غير مضمون.
