ka:
  name: ხულუტის ციხე
  short: >-
    ორბელიანთა XVIII საუკუნის ციხე-დარბაზი ხრამის ხეობის ვიწრო ყელში, კლდეზე — შვიდსართულიანი კოშკით და
    მდინარისკენ ჩამავალი გვირაბით.
  body: >-
    **ხულუტი იმდენადვე საცხოვრებლად აშენდა, რამდენადაც საბრძოლველად — თავადის სახლი, ციხის აბჯარში გამოწყობილი,
    კლდეზე, სადაც ხრამის ღრმა ხეობა ყელივით ვიწროვდება.**


    ციხე-დარბაზი XVIII საუკუნის პირველ მესამედში ყაფლან ბარათაშვილ-ორბელიშვილმა ააგო. ორბელიანების (იგივე
    ორბელიშვილების, ყაფლანიშვილების) სამფლობელო — საორბელო, ანუ საყაფლანიშვილო — XVIII საუკუნეში ხრამისა
    და დმანისის ხეობათა დიდ ნაწილსა და ტაშირს მოიცავდა: 100-მდე ვასალი აზნაური და 2000-მდე ყმა გლეხი,
    160-მდე სოფელში. სასახლეები მათ ტანძიაში ჰქონდათ, ციხე-კოშკები — დმანისში, ქვეშსა და ხულუტში, მონასტრები
    — ფიტარეთსა და დმანისში. ამ საგვარეულოდანაა სულხან-საბა ორბელიანიც, რომელიც აქვე, ტანძიაში დაიბადა.


    ციხე ორი ნაწილისგან შედგება; თითოეულში თითო კოშკია ჩაშენებული, გალავანში კი — კიდევ ხუთი. ყოველი კოშკი,
    უპირველეს ყოვლისა, საცხოვრებელი იყო და მხოლოდ შემდეგ — საბრძოლო. ჩრდილო-დასავლეთის კოშკი კოშკისებრი
    სასახლეა: მთელ სიმაღლეზე შუაზე ჰყოფს კედელი, რომელშიც საფეხურებია ჩატანებული; ერთ მხარეს ექვსი სართულია,
    მეორეზე — შვიდი. ზედა სართულები საბრძოლოდ იყო გამიზნული, დანარჩენი — საცხოვრებლად. ყველაფერი ადგილობრივი
    კლდის ქვითაა ნაგები.


    კოშკი მდინარეს მაღალი კლდიდან დაჰყურებს. შიგნით აღმართზე ამავალი გვირაბით შედიოდნენ; გვირაბში მოწყობილი
    ერთსართულიანი სადგომი გზაჯვარედინის როლს ასრულებდა — აქედან ორ სხვა კოშკში, მდინარეზე ჩამავალ გვირაბსა
    და საპირფარეშოში გადიოდნენ. სადგომსა და კოშკს შორის მოზრდილი წყალსაცავია, ზემოთ ბანი ყოფილა, კედლებს
    კი სათოფეები რიგად მიჰყვება.


    XVIII საუკუნის ბოლოს, როცა ქვემო ქართლი მოაოხრეს, ორბელიანები თბილისში გადასახლდნენ და ხულუტი ხეობას
    დარჩა. 2006 წლიდან ის ეროვნული მნიშვნელობის ძეგლია. სათოფესთან დადექით და ხეობას ჩახედეთ: ამ ადგილის
    მთელი ლოგიკა — პირველმა დაინახე, პირველმა ესროლე — ჯერაც ქვაშია ჩაწერილი.
  tip: >-
    ხულუტი ღია ნანგრევია — არც ბილეთია, არც კარიბჭე. ბოლო აღმართი ციცაბოა, უნიშნო და მოაჯირების გარეშე:
    ჩაიცვით მყარი ფეხსაცმელი და წყალი წაიღეთ — ადგილზე არც წყალია, არც საპირფარეშო. ზედა სართულებზე ნუ
    აძვრებით და სათოფეებიდან ნუ გადაიხრებით; კლდის პირას ბავშვებს ხელი არ გაუშვათ. საუკეთესო დროა მაისიდან
    ოქტომბრამდე, მშრალ ამინდში — წვიმის შემდეგ ბილიკიც და გრუნტის გზაც სრიალებს. გამოყავით საათნახევარი.
    დაახლოებით 3 კილომეტრშია ფიტარეთის მონასტერი, ტანძიაში კი სულხან-საბა ორბელიანის ლიტერატურული მუზეუმი,
    რომელიც 1984 წელს გაიხსნა.
  route: >-
    თბილისიდან სამხრეთით, S6 გზით მარნეულამდე იარეთ, იქიდან კი დასავლეთით, ბოლნისზე გავლით, ქვეშისკენ
    გააგრძელეთ. ქვეშთან შ155-ზე (ქვეში–ძეძვნარიანი–ტანძია) გადაუხვიეთ და ტანძიისკენ აიღეთ გეზი. ბოლო მონაკვეთი
    გრუნტის გზაა, შემდეგ კი ციხემდე ციცაბო ბილიკით 15–20 წუთი ფეხით უნდა ახვიდეთ. სულ დაახლოებით 83 კილომეტრი
    და 1 საათი და 50 წუთი, ნელი ბოლო კილომეტრების ჩათვლით. იქირავეთ ჯიპი ან, სულ მცირე, მაღალი გამავლობის
    მანქანა: წვიმის შემდეგ გრუნტი ტალახად იქცევა. საწვავი მარნეულში ან ბოლნისში ჩაასხით — შემდეგ მის იმედზე
    ნუ იქნებით.
en:
  name: Khuluti Fortress
  short: >-
    An 18th-century fortified manor of the Orbeliani princes on a cliff above the Khrami, with a seven-storey
    tower and a tunnel to the river.
  body: >-
    **Khuluti was built to be lived in as much as fought from — a nobleman's house in a fortress's armour,
    on a cliff where the Khrami gorge narrows to a throat.**


    Kaplan Baratashvili-Orbelishvili raised it in the first third of the 18th century. His family, the
    Orbelianis, held a domain known as Saorbelo that in the 18th century covered much of the Khrami and
    Dmanisi valleys and Tashiri: up to 100 vassal noble families and some 2,000 serfs in about 160 villages.
    Their palaces stood at Tandzia, their tower-castles at Dmanisi, Kveshi and Khuluti, their monasteries
    at Pitareti and Dmanisi. The house also produced Sulkhan-Saba Orbeliani, born nearby in Tandzia.


    Khuluti is a tsikhe-darbazi, a fortified manor. It has two parts, each built around its own tower,
    and five more towers in the curtain wall; every one of them a home first and a battle post second,
    all of local rock. The north-west tower is a palace in tower form: a wall carrying a staircase splits
    it for its whole height, six storeys on one side and seven on the other, with the top floors kept
    for fighting.


    The tower rises from a high cliff over the river. You entered by a tunnel climbing uphill; inside
    it a single-storey room worked as a junction, with passages to two other towers, a tunnel down to
    the river and a latrine. Between that room and the tower lies a large cistern, and rows of gun loopholes
    run along the walls.


    At the end of the 18th century, with Kvemo Kartli laid waste by raids, the Orbelianis moved to Tbilisi
    and left Khuluti to the gorge. Since 2006 it has been a monument of national importance. Stand at
    a loophole and look down it: the whole logic of the place — see first, shoot first — is still written
    in the stone.
  tip: >-
    Khuluti is an open ruin with no ticket and no gate. The final climb is steep, unsigned and has no
    railings, so wear sturdy boots and carry water; there is none on site, and no toilets. Stay off the
    upper storeys, do not lean out of the loopholes, and keep children close near the cliff edge. Go between
    May and October in dry weather, since the path and the dirt track turn slick after rain. Allow an
    hour and a half. Pitareti Monastery is about 3 km away, and Tandzia has the Sulkhan-Saba Orbeliani
    Literature Museum, opened in 1984.
  route: >-
    From Tbilisi drive south on the S6 to Marneuli, then west through Bolnisi towards Kveshi. At Kveshi
    turn onto the Sh155 (Kveshi–Dzedzvnariani–Tandzia) and head for Tandzia. The last stretch is a dirt
    track, followed by a steep 15–20 minute walk up to the fortress. In all it is about 83 km and 1 hour
    50 minutes, including the slow final kilometres. Rent an SUV, or at least a high-clearance car: after
    rain the track turns to mud. Fill up in Marneuli or Bolnisi and do not count on fuel beyond.
ru:
  name: Крепость Хулути
  short: >-
    Укреплённая усадьба князей Орбелиани XVIII века на скале над Храми — с семиэтажной башней и подземным
    ходом к реке.
  body: >-
    **Хулути строили не только для обороны, но и для жизни: дворянский дом в крепостной броне, на скале,
    где ущелье Храми сужается, словно горло.**


    Каплан Бараташвили-Орбелишвили возвёл её в первой трети XVIII века. Его род, Орбелиани, владел уделом
    Саорбело, который в XVIII веке охватывал бо́льшую часть долин Храми и Дманиси, а также Ташири: до
    ста вассальных дворянских семей и около 2000 крепостных примерно в 160 сёлах. Дворцы рода стояли в
    Тандзиа, башни-замки — в Дманиси, Квеши и Хулути, монастыри — в Питарети и Дманиси. Из этого же дома
    вышел Сулхан-Саба Орбелиани, родившийся неподалёку, в Тандзиа.


    Хулути — цихе-дарбази, укреплённая усадьба. Она состоит из двух частей, каждая выстроена вокруг собственной
    башни, и ещё пять башен встроены в крепостную стену; все они прежде всего жилые и лишь затем боевые,
    и все сложены из местного камня. Северо-западная башня — дворец в облике башни: стена с лестницей
    внутри рассекает её на всю высоту, по одну сторону шесть этажей, по другую семь, а верхние ярусы отведены
    для боя.


    Башня поднимается с высокой скалы над рекой. Входили в неё по туннелю, идущему в гору; внутри одноэтажное
    помещение служило развилкой: отсюда вели ходы к двум другим башням, туннель вниз к реке и уборная.
    Между этим помещением и башней — большая цистерна, а вдоль стен тянутся ряды ружейных бойниц.


    В конце XVIII века, когда набеги опустошили Квемо-Картли, Орбелиани перебрались в Тбилиси и оставили
    Хулути ущелью. С 2006 года крепость — памятник национального значения. Встаньте у бойницы и посмотрите
    вниз: вся логика этого места — первым увидеть, первым выстрелить — до сих пор записана в камне.
  tip: >-
    Хулути — открытые руины: ни билетов, ни ворот. Последний подъём крутой, без указателей и перил, так
    что нужны крепкие ботинки и запас воды: на месте её нет, как нет и туалетов. Не поднимайтесь на верхние
    этажи, не высовывайтесь из бойниц и держите детей рядом у края обрыва. Лучшее время — с мая по октябрь,
    в сухую погоду: после дождя и тропа, и грунтовка становятся скользкими. Закладывайте полтора часа.
    Монастырь Питарети — примерно в 3 км, а в Тандзиа работает Литературный музей Сулхан-Саба Орбелиани,
    открытый в 1984 году.
  route: >-
    Из Тбилиси езжайте на юг по трассе S6 до Марнеули, затем на запад через Болниси в сторону Квеши. В
    Квеши сверните на Sh155 (Квеши — Дзедзвнариани — Тандзиа) и держите курс на Тандзиа. Последний отрезок
    — грунтовка, а за ней крутой пеший подъём к крепости на 15–20 минут. Всего около 83 км и 1 час 50
    минут, включая медленные последние километры. Берите внедорожник или хотя бы машину с высоким клиренсом:
    после дождя грунтовку развозит. Заправьтесь в Марнеули или Болниси — дальше на заправки не рассчитывайте.
fa:
  name: قلعه خولوتی
  short: >-
    عمارتی مستحکم از سدهٔ هجدهم، از آنِ شاهزادگان اوربلیانی، بر صخره‌ای بالای رود خرامی؛ با برجی هفت‌طبقه
    و تونلی که به رودخانه می‌رسد.
  body: >-
    **خولوتی را همان‌قدر برای زیستن ساختند که برای جنگیدن: خانه‌ای اشرافی در زرهِ یک دژ، بر صخره‌ای که
    درهٔ خرامی در آن‌جا مثل گلو تنگ می‌شود.**


    کاپلان باراتاشویلی-اوربلیشویلی آن را در یک‌سوم نخست سدهٔ هجدهم برپا کرد. خاندان او، اوربلیانی‌ها،
    قلمرویی به نام سائوربلو در دست داشتند که در سدهٔ هجدهم بخش بزرگی از دره‌های خرامی و دمانیسی و نیز
    تاشیری را در بر می‌گرفت: تا ۱۰۰ خاندان اشرافیِ تابع و حدود ۲۰۰۰ رعیتِ وابسته به زمین در نزدیک به ۱۶۰
    روستا. کاخ‌هایشان در تاندزیا بود، برج‌قلعه‌هایشان در دمانیسی، کوِشی و خولوتی، و صومعه‌هایشان در پیتارتی
    و دمانیسی. سولخان-سابا اوربلیانی نیز از همین خاندان برخاست؛ او در همان نزدیکی، در تاندزیا، به دنیا
    آمد.


    خولوتی یک «تسیخه-داربازی» است، یعنی عمارتی مستحکم. دو بخش دارد که هر کدام گرد برجی از آنِ خود ساخته
    شده، و پنج برج دیگر در دیوارِ حصار جا گرفته‌اند؛ همه پیش از هر چیز خانه بودند و در مرتبهٔ دوم سنگر،
    و همه از سنگ همین‌جا. برج شمال‌غربی کاخی است در قالب برج: دیواری که پلکانی را در دل خود دارد، آن را
    در سراسر ارتفاعش دو نیم می‌کند؛ در یک سو شش طبقه و در سوی دیگر هفت طبقه، و طبقه‌های بالایی ویژهٔ نبرد
    بودند.


    برج از صخره‌ای بلند بر فراز رود قد می‌کشد. ورود از راه تونلی بود که سربالا می‌رفت؛ درون آن، اتاقی
    یک‌طبقه نقش چهارراه را داشت و از آن‌جا راهروهایی به دو برج دیگر، تونلی رو به پایین تا رودخانه و یک
    مستراح راه داشت. میان این اتاق و برج آب‌انباری بزرگ است، و ردیف‌هایی از مزغل‌های تفنگ در امتداد دیوارها
    کشیده شده است.


    در پایان سدهٔ هجدهم، هنگامی که یورش‌ها کوِمو کارتلی را ویران کرده بود، اوربلیانی‌ها به تفلیس کوچ کردند
    و خولوتی را به درهٔ سپردند. از سال ۲۰۰۶ این قلعه اثری با اهمیت ملی است. کنار یکی از مزغل‌ها بایستید
    و به پایین نگاه کنید: تمام منطق این مکان — اول ببین، اول شلیک کن — هنوز بر سنگ نوشته شده است.
  tip: >-
    خولوتی ویرانه‌ای باز است، بی بلیت و بی دروازه. آخرین سربالایی تند است، بی‌نشانه و بی‌نرده؛ پس کفش
    محکم بپوشید و آب همراه داشته باشید، چون در محل نه آب هست و نه سرویس بهداشتی. به طبقه‌های بالا نروید،
    از مزغل‌ها به بیرون خم نشوید و کودکان را کنار لبهٔ صخره نزدیک خود نگه دارید. میان ماه مه و اکتبر و
    در هوای خشک بروید، چون پس از باران هم کوره‌راه و هم جاده خاکی لغزنده می‌شوند. یک ساعت و نیم وقت بگذارید.
    صومعهٔ پیتارتی حدود ۳ کیلومتر دورتر است، و در تاندزیا موزهٔ ادبیات سولخان-سابا اوربلیانی قرار دارد
    که در سال ۱۹۸۴ گشایش یافت.
  route: >-
    از تفلیس از راه S6 به‌سوی جنوب تا مارنئولی بروید، سپس به‌سوی غرب از بولنیسی بگذرید و به سمت کوِشی
    ادامه دهید. در کوِشی به جادهٔ Sh155 (کوِشی–دزدزوناریانی–تاندزیا) بپیچید و راه تاندزیا را در پیش بگیرید.
    بخش پایانی جاده‌ای خاکی است و پس از آن ۱۵ تا ۲۰ دقیقه پیاده‌روی سربالا و تند تا قلعه. روی‌هم‌رفته
    حدود ۸۳ کیلومتر و یک ساعت و ۵۰ دقیقه، با احتساب کیلومترهای کُند پایانی. یک خودروی شاسی‌بلند کرایه
    کنید، یا دست‌کم خودرویی با فاصلهٔ زیاد از زمین: پس از باران جاده خاکی گِل می‌شود. در مارنئولی یا بولنیسی
    باک را پر کنید و به سوخت‌گیری پس از آن دل نبندید.
he:
  name: מבצר חולוטי
  short: אחוזה מבוצרת של נסיכי אורבליאני מהמאה ה-18, על צוק מעל נהר חראמי, עם מגדל בן שבע קומות ומנהרה
    היורדת אל הנהר.
  body: >-
    **את חולוטי בנו כדי לגור בו לא פחות מכדי להילחם ממנו — בית אצולה בשריון של מבצר, על צוק שבו ערוץ החראמי
    נעשה צר כגרון.**


    קפלן ברטשווילי-אורבלישווילי הקים אותו בשליש הראשון של המאה ה-18. משפחתו, בית אורבליאני, החזיקה בנחלה
    שנודעה בשם סאורבלו, ושבמאה ה-18 השתרעה על רוב עמקי החראמי ודמניסי ועל טשירי: עד 100 משפחות של אצילים
    וסאלים וכ-2,000 צמיתים בכ-160 כפרים. ארמונותיהם עמדו בטנדזיה, מבצרי-המגדל שלהם בדמניסי, בקוושי ובחולוטי,
    ומנזריהם בפיטארטי ובדמניסי. מן הבית הזה יצא גם סולחאן-סאבא אורבליאני, שנולד בקרבת מקום, בטנדזיה.


    חולוטי הוא "ציחה-דרבזי", אחוזה מבוצרת. יש לו שני חלקים, כל אחד בנוי סביב מגדל משלו, ועוד חמישה מגדלים
    משולבים בחומה; כל אחד מהם היה קודם כול בית מגורים ורק אחר כך עמדת קרב, וכולם בנויים מסלע מקומי. המגדל
    הצפון-מערבי הוא ארמון בדמות מגדל: קיר שבתוכו עובר גרם מדרגות מפצל אותו לכל גובהו, שש קומות מצדו האחד
    ושבע מצדו האחר, והקומות העליונות נשמרו ללחימה.


    המגדל מתנשא מצוק גבוה מעל הנהר. נכנסו אליו דרך מנהרה שעולה במעלה המדרון; בתוכה שימש חדר חד-קומתי כצומת,
    וממנו יצאו מעברים לשני מגדלים אחרים, מנהרה היורדת אל הנהר ובית שימוש. בין החדר הזה למגדל יש בור מים
    גדול, ולאורך הקירות נמשכות שורות של חרכי ירי לרובים.


    בסוף המאה ה-18, כשפשיטות החריבו את קוומו קרתלי, עברו בני אורבליאני לטביליסי והשאירו את חולוטי לערוץ.
    מאז 2006 הוא אתר מורשת בעל חשיבות לאומית. עמדו ליד אחד מחרכי הירי והביטו למטה: כל ההיגיון של המקום
    — לראות ראשון, לירות ראשון — עדיין חקוק באבן.
  tip: >-
    חולוטי הוא חורבה פתוחה, בלי כרטיס ובלי שער. הטיפוס האחרון תלול, לא מסומן ואין בו מעקות, לכן נעלו נעליים
    יציבות וקחו מים: אין מים במקום, וגם לא שירותים. אל תעלו לקומות העליונות, אל תישענו החוצה מחרכי הירי,
    והחזיקו ילדים קרוב אליכם ליד שפת הצוק. בואו בין מאי לאוקטובר במזג אוויר יבש, כי אחרי גשם השביל ודרך
    העפר נעשים חלקלקים. הקדישו שעה וחצי. מנזר פיטארטי נמצא כ-3 ק"מ משם, ובטנדזיה פועל מוזיאון הספרות על
    שם סולחאן-סאבא אורבליאני, שנפתח ב-1984.
  route: >-
    מטביליסי סעו דרומה בכביש S6 עד מרנאולי, ומשם מערבה דרך בולניסי לכיוון קוושי. בקוושי פנו לכביש Sh155
    (קוושי–דזדזוונריאני–טנדזיה) והמשיכו לטנדזיה. הקטע האחרון הוא דרך עפר, ואחריו עלייה רגלית תלולה של
    15–20 דקות אל המבצר. בסך הכול כ-83 ק"מ ושעה ו-50 דקות, כולל הקילומטרים האחרונים והאיטיים. שכרו רכב
    שטח, או לפחות רכב עם מרווח גחון גבוה: אחרי גשם דרך העפר הופכת לבוץ. תדלקו במרנאולי או בבולניסי, ואל
    תסמכו על תחנת דלק בהמשך.
ar:
  name: قلعة خولوتي
  short: >-
    قصر محصَّن لأمراء أوربلياني من القرن الثامن عشر على جرف فوق نهر خرامي، ببرج من سبعة طوابق ونفق ينحدر
    إلى النهر.
  body: >-
    **بُنيت خولوتي لتُسكن بقدر ما بُنيت ليُقاتَل منها: بيتُ نبيلٍ في درعِ حصن، على جرفٍ يضيق عنده وادي
    خرامي كأنه حَلْق.**


    شيّدها كابلان باراتاشفيلي-أوربليشفيلي في الثلث الأول من القرن الثامن عشر. وكانت أسرته، آل أوربلياني،
    تملك إقطاعية تُعرف باسم ساوربيلو، امتدت في القرن الثامن عشر على معظم واديي خرامي ودمانيسي وعلى تاشيري:
    ما يصل إلى 100 أسرة من النبلاء التابعين ونحو 2000 من الأقنان في قرابة 160 قرية. كانت قصورهم في تاندزيا،
    وقلاعهم البرجية في دمانيسي وكفيشي وخولوتي، وأديرتهم في بيتاريتي ودمانيسي. ومن هذا البيت خرج أيضًا
    سولخان سابا أوربلياني، المولود في تاندزيا القريبة.


    خولوتي «تسيخه-دربازي»، أي قصر محصَّن. تتألف من قسمين، بُني كلٌّ منهما حول برج خاص به، وفي السور خمسة
    أبراج أخرى؛ كلٌّ منها مسكنٌ أولًا وموقعُ قتالٍ ثانيًا، وكلها من صخر المكان. أما البرج الشمالي الغربي
    فقصرٌ في هيئة برج: جدارٌ يضم درجًا يشطره على امتداد ارتفاعه كله، ستة طوابق في جهة وسبعة في الأخرى،
    وقد خُصصت الطوابق العليا للقتال.


    يرتفع البرج من جرف عالٍ فوق النهر. وكان الدخول عبر نفق يصعد في المنحدر؛ وفي داخله غرفة من طابق واحد
    كانت بمثابة ملتقى طرق، تتفرع منها ممرات إلى برجين آخرين، ونفق ينزل إلى النهر، ومرحاض. وبين هذه الغرفة
    والبرج صهريج كبير، وعلى امتداد الجدران صفوف من مزاغل البنادق.


    وفي أواخر القرن الثامن عشر، حين خرّبت الغارات كفيمو كارتلي، انتقل آل أوربلياني إلى تبليسي وتركوا خولوتي
    للوادي. ومنذ عام 2006 صارت معلماً ذا أهمية وطنية. قف عند إحدى المزاغل وانظر إلى الأسفل: منطق المكان
    كله — أن ترى أولًا وأن تطلق النار أولًا — لا يزال مكتوبًا في الحجر.
  tip: >-
    خولوتي أطلال مفتوحة بلا تذاكر ولا بوابة. الصعود الأخير شديد الانحدار، بلا لافتات ولا درابزين، فالبس
    حذاءً متينًا واحمل الماء: لا ماء في الموقع ولا دورات مياه. لا تصعد إلى الطوابق العليا، ولا تُطلّ بجسدك
    من المزاغل، وأبقِ الأطفال قريبين منك عند حافة الجرف. الأفضل أن تزورها بين مايو وأكتوبر في طقس جاف،
    لأن الممر والطريق الترابي يصبحان زلقين بعد المطر. خصّص ساعة ونصفًا. يقع دير بيتاريتي على بعد نحو 3
    كم، وفي تاندزيا متحف سولخان سابا أوربلياني للأدب، الذي افتُتح عام 1984.
  route: >-
    من تبليسي اتجه جنوبًا على الطريق S6 إلى مارنيولي، ثم غربًا عبر بولنيسي نحو كفيشي. في كفيشي انعطف إلى
    الطريق Sh155 (كفيشي – دزيدزفنارياني – تاندزيا) وتابع نحو تاندزيا. المقطع الأخير طريق ترابي، يليه صعود
    على الأقدام شديد الانحدار مدته 15–20 دقيقة حتى القلعة. المسافة الإجمالية نحو 83 كم، وتستغرق نحو ساعة
    و50 دقيقة، بما في ذلك الكيلومترات الأخيرة البطيئة. استأجر سيارة دفع رباعي، أو على الأقل سيارة ذات
    خلوص أرضي مرتفع: فبعد المطر يتحول الطريق الترابي إلى وحل. املأ الخزان في مارنيولي أو بولنيسي ولا تعوّل
    على الوقود بعدهما.
