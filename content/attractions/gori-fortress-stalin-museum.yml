ka:
  name: გორის ციხე და სტალინის მუზეუმი
  short: >-
    ციხე კლდოვან გორაზე, მტკვრისა და ლიახვის შესაყართან, მის ძირში კი სალოცავი, რომელიც გორმა თავის ყველაზე
    სადავო შვილს აუგო.
  body: >-
    **გორში ისტორიას ორჯერ უყურებთ: ერთხელ შუა საუკუნეების გალავნიდან, მეორედ — საბჭოთა სალოცავიდან.**


    ციხე ქალაქის შუაგულში, ცალკე მდგარ კლდოვან გორაზე, მტკვრისა და დიდი ლიახვის შესაყართან დგას. ვინც
    მას ფლობდა, შიდა ქართლს ფლობდა, ამიტომაც მისთვის ყველა იბრძოდა. ბორცვი ძვ. წ. I ათასწლეულის ბოლო საუკუნეებში
    უკვე გამაგრებული იყო, „გორის ციხე“ კი წყაროებში XIII საუკუნიდან იხსენიება. 1590-იან წლებში ციხე ოსმალებს
    ეპყრათ; სიმონ I-ის ცხრათვიანმა ალყამ შედეგი ვერ გამოიღო, 1599 წელს კი მეფემ დიდმარხვისას ალყის მოხსნა
    მოაჩვენა და ღამის იერიშით დაიბრუნა. როსტომ მეფემ ციხე 1630-იან წლებში აღადგინა, ერეკლე II-მ — 1774
    წელს, ის ნანგრევი კი, რასაც დღეს ხედავთ, 1920 წლის მიწისძვრამ დატოვა. რიყის ქვითა და აგურით დაკერებულ
    ოვალურ გალავანს შემოუარეთ და დასავლეთით, ყველაზე კარგად შემონახულ „ცხრაკარასთან“ მიდით.


    ქვემოთ, სტალინის გამზირზე, იოსებ სტალინის მუზეუმი დგას. მისი შენობის მშენებლობა 1951 წელს დაიწყო,
    ოფიციალურად — სოციალიზმის ისტორიის მუზეუმად; 1953 წელს, სტალინის სიკვდილის შემდეგ, ის მის მემორიალად
    იქცა და 1957 წელს ოფიციალურად მიეძღვნა. ექვსი დარბაზის ფოტოები, საჩუქრები და ტილოები სტალინის სიკვდილის
    ნიღბის თორმეტი ასლიდან ერთ-ერთით სრულდება. გარეთ კლასიკური პავილიონი ფარავს ხის სახლს, სადაც მეწაღის
    შვილი 1878 წელს დაიბადა, გვერდით კი მისი მწვანე ჯავშნიანი „პულმანი“ დგას — 83-ტონიანი ვაგონი, რომლითაც
    1941 წლიდან მგზავრობდა; მუზეუმში ის 1985 წელს დონის როსტოვიდან ჩამოიტანეს.


    მუზეუმის მოწიწებული ტონი თითქმის არ შეცვლილა. 2008 წლის აგვისტოში რუსულმა ავიაციამ გორი დაბომბა, რუსული
    ჯარი კი ქალაქში 22 აგვისტომდე იდგა. ამის შემდეგ მუზეუმის შესასვლელთან ბანერი გამოჩნდა, რომელიც ექსპოზიციას
    ისტორიის გაყალბებას უწოდებდა; 2017 წლისთვის ის აღარ იყო, გორის საკრებულომ კი ჯერ კიდევ 2012 წელს გადაწყვიტა,
    ექსპოზიცია უცვლელი დაეტოვებინა. სტალინის ძეგლი მთავარი მოედნიდან 2010 წლის 25 ივნისს აიღეს.


    ჯერ ციხეზე ადით: გალავნიდან მუზეუმის კოლონადა მოჩანს და მთელი ეს დავა ხელისგულზე გიდევთ.
  tip: >-
    მუზეუმის ბილეთი მთავარ შენობას, სახლსა და ვაგონს მოიცავს. ინგლისურენოვანი ექსკურსიები პერიოდულად იწყება;
    გიდის გარეშე ქართულ-რუსული წარწერების დიდი ნაწილი უცხოელისთვის მდუმარე რჩება. მუზეუმს საათნახევარი-ორი
    საათი დაუთმეთ, ციხეს — ერთი; ციხეზე შესვლა უფასოა. ბილიკი მოკლე, მაგრამ ციცაბოა, მოაჯირის გარეშე,
    სველი ქვა კი სრიალებს; ზაფხულში გორაზე დილით ადრე ან მზის ჩასვლისას ადით — ჩრდილი იქ არ არის. კაფეები,
    ბანკომატები და ტუალეტები სტალინის გამზირზეა.
  route: >-
    გორი თბილისიდან 86 კილომეტრშია ს1 (E60) ავტობანით — სწრაფ გზაზე დაახლოებით საათი და ათი წუთი. გორის
    მონიშნულ გასასვლელზე გადაუხვიეთ და მთავარ ქუჩას ცენტრისკენ გაჰყევით: მუზეუმი სტალინის გამზირზეა, ციხის
    გორა კი იქიდან ათი წუთის სავალზე. მანქანა მუზეუმის ახლოს დააყენეთ. გზა მთლიანად ასფალტია, ნებისმიერი
    კლასის მანქანა გამოდგება; საწვავს ავტობანზეც იშოვით და ქალაქშიც. უფლისციხე დაახლოებით 10 კილომეტრით
    აღმოსავლეთით, მტკვრის გაღმაა — ორივეს ნახვა ნახევარ დღეში იოლად მოესწრება.
en:
  name: 'Gori: Fortress and Stalin Museum'
  short: >-
    A citadel on a rock above the Mtkvari and the Liakhvi, and below it the shrine Gori built to its most
    notorious son: one town, two views of history.
  body: >-
    **Gori makes you look at history twice: once from a medieval rampart, once from a Soviet shrine.**


    The fortress rides an isolated hill in the middle of town, above the meeting of the Mtkvari and the
    Great Liakhvi. Whoever held it held Shida Kartli, so everyone fought for it. The hill was already
    fortified in the last centuries BC, and the name "Gori fortress" appears in the 13th century. In the
    1590s the Ottomans held it; King Simon I besieged it for nine months, then in 1599 feigned a Lenten
    truce and took it back in a night attack. King Rostom rebuilt it in the 1630s and Erekle II in 1774,
    and the 1920 earthquake left the ruin you see today. Walk the oval wall of river cobbles patched with
    brick to its best-preserved western section, the Tskhrakara, "Nine Gates".


    Below, on Stalin Avenue, stands the Joseph Stalin Museum. Work began in 1951, officially on a museum
    of the history of socialism; after Stalin's death in 1953 it became his memorial and was dedicated
    to him in 1957. Six halls of photographs, gifts and paintings end at one of twelve casts of his death
    mask. Outside, a classical pavilion encloses the wooden house where the cobbler's son was born in
    1878, and beside it stands his green armoured Pullman carriage, 83 tonnes, in use from 1941, brought
    here from Rostov-on-Don in 1985.


    The museum's reverent tone has barely changed. After Russian aircraft bombed Gori in August 2008 and
    troops occupied the town until 22 August, a banner at the entrance called the museum a falsification
    of history; by 2017 it was gone, and in 2012 the town council had already voted to leave the exhibition
    as it was. The Stalin statue in the main square came down on 25 June 2010.


    Climb the fortress first. From the wall you can see the museum's colonnade below, and the whole argument
    laid out between them.
  tip: >-
    The museum ticket covers the main building, the birth house and the railway carriage. English-speaking
    guides lead tours at intervals, and without one most of the Georgian and Russian labels stay silent.
    Allow one and a half to two hours for the museum and an hour for the fortress, which is free. The
    path up is short and steep with no handrail, and the stones are slippery when wet; in summer climb
    early or towards sunset, as the hill has no shade. Cafés, ATMs and toilets line Stalin Avenue.
  route: >-
    Gori is 86 km west of Tbilisi on the E60 (S1) motorway, about an hour and ten minutes on a fast road.
    Take the signed Gori exit and follow the main road into the centre: the museum is on Stalin Avenue,
    and the fortress hill is a ten-minute walk away. Park near the museum. It is asphalt all the way and
    any car will do. Fuel is easy to find on the motorway and in town. Uplistsikhe is about 10 km further
    east across the Mtkvari, so the two make an easy half-day pair.
ru:
  name: 'Гори: крепость и музей Сталина'
  short: >-
    Цитадель на скале над Мтквари и Лиахви, а под ней святилище, которое Гори возвёл своему самому печально
    известному сыну: один город, два взгляда на историю.
  body: >-
    **Гори заставляет посмотреть на историю дважды: один раз — со средневековой стены, другой — из советского
    святилища.**


    Крепость оседлала одинокий холм посреди города, над слиянием Мтквари и Большой Лиахви. Кто держал
    её, тот держал Шида-Картли, поэтому за неё воевали все. Холм укрепляли уже в последние века до нашей
    эры, а название «Горийская крепость» появляется в XIII веке. В 1590-х ею владели османы; царь Симон
    I девять месяцев держал её в осаде, а в 1599 году, изобразив перемирие на время Великого поста, отбил
    её ночным штурмом. Царь Ростом перестроил крепость в 1630-х, Ираклий II — в 1774 году, а землетрясение
    1920 года оставило те руины, что вы видите сегодня. Пройдите вдоль овальной стены из речного булыжника,
    залатанной кирпичом, к лучше всего сохранившемуся западному участку — Цхракара, «Девять ворот».


    Внизу, на проспекте Сталина, стоит Музей Иосифа Сталина. Строить его начали в 1951 году — официально
    как музей истории социализма; после смерти Сталина в 1953-м он стал его мемориалом и в 1957 году был
    посвящён ему. Шесть залов с фотографиями, подарками и картинами заканчиваются одной из двенадцати
    отливок его посмертной маски. Снаружи классический павильон укрывает деревянный домик, где в 1878
    году родился сын сапожника, а рядом стоит его зелёный бронированный пульмановский вагон — 83 тонны,
    в эксплуатации с 1941 года, привезённый сюда из Ростова-на-Дону в 1985-м.


    Почтительный тон музея почти не изменился. После того как в августе 2008 года российская авиация бомбила
    Гори, а войска занимали город до 22 августа, у входа повесили баннер, назвавший музей фальсификацией
    истории; к 2017 году его уже не было, а в 2012-м городской совет проголосовал за то, чтобы оставить
    экспозицию как есть. Памятник Сталину на главной площади сняли 25 июня 2010 года.


    Сначала поднимитесь в крепость. Со стены видна колоннада музея внизу — и весь спор, разложенный между
    ними.
  tip: >-
    Билет в музей включает главное здание, дом, где родился Сталин, и железнодорожный вагон. Англоязычные
    гиды водят экскурсии через определённые промежутки времени, и без гида большинство грузинских и русских
    подписей остаются немыми. На музей закладывайте полтора-два часа, на крепость — час; вход в неё бесплатный.
    Тропа наверх короткая и крутая, без перил, а камни в сырость скользкие; летом поднимайтесь рано утром
    или ближе к закату — тени на холме нет. Кафе, банкоматы и туалеты — вдоль проспекта Сталина.
  route: >-
    Гори в 86 км к западу от Тбилиси по автомагистрали E60 (S1) — около часа десяти минут по быстрой дороге.
    Сверните по указателю «Гори» и следуйте по главной дороге в центр: музей на проспекте Сталина, до
    крепостного холма десять минут пешком. Паркуйтесь у музея. Асфальт на всём пути, подойдёт любая машина.
    Заправки легко найти и на трассе, и в городе. Уплисцихе примерно в 10 км восточнее, за Мтквари, так
    что их удобно объединить в поездку на полдня.
fa:
  name: 'گوری: قلعه و موزهٔ استالین'
  short: >-
    دژی بر صخره‌ای بالای متکواری و لیاخوی، و در پای آن پرستشگاهی که گوری برای بدنام‌ترین فرزندش ساخت:
    یک شهر، دو نگاه به تاریخ.
  body: >-
    **گوری وادارتان می‌کند دو بار به تاریخ نگاه کنید: یک بار از فراز باروی قرون وسطایی، یک بار از درون
    پرستشگاهی شوروی.**


    قلعه بر تپه‌ای تنها در میانهٔ شهر نشسته است، بالای محل پیوند متکواری و لیاخوی بزرگ. هر که آن را در
    دست داشت شیدا کارتلی را در دست داشت، پس همه بر سرش جنگیدند. تپه در سده‌های پایانی پیش از میلاد استحکامات
    داشت و نام «قلعهٔ گوری» در سدهٔ سیزدهم پدیدار می‌شود. در دههٔ ۱۵۹۰ عثمانی‌ها آن را در اختیار داشتند؛
    شاه سیمون یکم نُه ماه آن را در محاصره گرفت، سپس در ۱۵۹۹ وانمود کرد که به احترام روزهٔ بزرگ مسیحی آتش‌بس
    برقرار است و با یورشی شبانه قلعه را پس گرفت. شاه رستم در دههٔ ۱۶۳۰ و ارکله دوم در ۱۷۷۴ آن را بازسازی
    کردند، و زلزلهٔ ۱۹۲۰ ویرانه‌ای را که امروز می‌بینید بر جا گذاشت. در امتداد باروی بیضی‌شکلِ ساخته از
    قلوه‌سنگ رودخانه، که با آجر وصله شده، تا بخش غربی که از همه سالم‌تر مانده قدم بزنید: تسخراکارا، یعنی
    «نُه دروازه».


    پایین‌تر، در خیابان استالین، موزهٔ یوسف استالین ایستاده است. ساختش در ۱۹۵۱ آغاز شد، به‌طور رسمی به‌عنوان
    موزهٔ تاریخ سوسیالیسم؛ پس از مرگ استالین در ۱۹۵۳ به یادبود او بدل شد و در ۱۹۵۷ به او اختصاص یافت.
    شش تالار پر از عکس و هدیه و نقاشی به یکی از دوازده قالبِ نقاب مرگ او ختم می‌شود. بیرون، کوشکی کلاسیک
    خانهٔ چوبی‌ای را در بر گرفته که پسر کفاش در ۱۸۷۸ در آن به دنیا آمد، و کنارش واگن پولمن زرهی سبزرنگ
    او ایستاده است: ۸۳ تن، در خدمت از ۱۹۴۱، که در ۱۹۸۵ از روستوف-نا-دونو به اینجا آورده شد.


    لحن ستایش‌آمیز موزه تقریباً تغییری نکرده است. پس از آنکه هواپیماهای روسیه در اوت ۲۰۰۸ گوری را بمباران
    کردند و نیروهایش تا ۲۲ اوت شهر را در اشغال داشتند، پلاکاردی در ورودی موزه را جعل تاریخ خواند؛ تا ۲۰۱۷
    آن پلاکارد دیگر نبود، و شورای شهر پیش‌تر، در ۲۰۱۲، رأی داده بود که نمایشگاه همان‌گونه که هست بماند.
    مجسمهٔ استالین در میدان اصلی در ۲۵ ژوئن ۲۰۱۰ پایین آورده شد.


    نخست از قلعه بالا بروید. از روی بارو ستون‌های موزه را در پایین می‌بینید، و تمام آن مجادله را که میان
    این دو گسترده است.
  tip: >-
    بلیت موزه ساختمان اصلی، خانهٔ زادگاه و واگن قطار را در بر می‌گیرد. راهنماهای انگلیسی‌زبان در فواصل
    معین تور می‌برند، و بدون راهنما بیشتر برچسب‌های گرجی و روسی زبان بسته می‌مانند. یک ساعت و نیم تا دو
    ساعت برای موزه و یک ساعت برای قلعه در نظر بگیرید؛ ورود به قلعه رایگان است. راه بالا کوتاه و پرشیب
    است و نرده ندارد، و سنگ‌ها در هوای مرطوب لغزنده‌اند؛ در تابستان صبح زود یا نزدیک غروب بالا بروید،
    چون تپه سایه ندارد. کافه، خودپرداز و سرویس بهداشتی در طول خیابان استالین هست.
  route: >-
    گوری ۸۶ کیلومتر غرب تفلیس است، روی بزرگراه E60 (S1)، حدود یک ساعت و ده دقیقه در جاده‌ای سریع. از خروجی
    «گوری» که تابلو دارد خارج شوید و جادهٔ اصلی را تا مرکز شهر دنبال کنید: موزه در خیابان استالین است
    و تا تپهٔ قلعه ده دقیقه پیاده‌روی. نزدیک موزه پارک کنید. تمام راه آسفالت است و هر خودرویی کافی است.
    سوخت در بزرگراه و در شهر به‌آسانی پیدا می‌شود. اوپلیستسیخه حدود ۱۰ کیلومتر دورتر به سمت شرق، آن سوی
    متکواری است، پس این دو به‌راحتی در یک نیم‌روز جا می‌شوند.
he:
  name: 'גורי: המבצר ומוזיאון סטלין'
  short: >-
    מצודה על סלע מעל המטקווארי והליאחווי, ולמרגלותיה המקדש שגורי הקימה לבנה הידוע לשמצה מכולם: עיר אחת,
    שני מבטים על ההיסטוריה.
  body: >-
    **גורי מכריחה אתכם להביט בהיסטוריה פעמיים: פעם מעל חומה מימי הביניים, ופעם מתוך מקדש סובייטי.**


    המבצר ניצב על גבעה בודדת באמצע העיר, מעל מפגש המטקווארי והליאחווי הגדול. מי שהחזיק בו החזיק בשידה
    קרתלי, ולכן כולם נלחמו עליו. הגבעה בוצרה כבר במאות האחרונות לפני הספירה, והשם "מבצר גורי" מופיע במאה
    ה-13. בשנות ה-90 של המאה ה-16 החזיקו בו העות'מאנים; המלך סימון הראשון צר עליו תשעה חודשים, ואז, ב-1599,
    העמיד פנים שהוא משבית את הקרבות לרגל הצום הגדול, וכבש אותו מחדש בהתקפת לילה. המלך רוסתום בנה אותו
    מחדש בשנות ה-30 של המאה ה-17, וארקלה השני ב-1774, ורעידת האדמה של 1920 השאירה את החורבה שרואים היום.
    לכו לאורך החומה הסגלגלה, העשויה אבני נהר ומטולאת בלבנים, עד לקטע המערבי השמור ביותר — צחראקארה, "תשעה
    שערים".


    למטה, בשדרת סטלין, עומד מוזיאון יוסף סטלין. העבודות החלו ב-1951, רשמית על מוזיאון לתולדות הסוציאליזם;
    אחרי מות סטלין ב-1953 הוא הפך לאתר ההנצחה שלו והוקדש לו ב-1957. שישה אולמות של תצלומים, מתנות וציורים
    מסתיימים באחת משתים-עשרה יציקות של מסכת המוות שלו. בחוץ, ביתן קלאסי עוטף את בית העץ שבו נולד בן הסנדלר
    ב-1878, ולצדו עומד קרון הפולמן המשוריין הירוק שלו — 83 טונות, בשימוש מ-1941, שהובא לכאן מרוסטוב-על-הדון
    ב-1985.


    הטון היראתי של המוזיאון כמעט לא השתנה. אחרי שמטוסים רוסיים הפציצו את גורי באוגוסט 2008 וכוחות רוסיים
    החזיקו בעיר עד 22 באוגוסט, נתלתה בכניסה כרזה שכינתה את המוזיאון זיוף של ההיסטוריה; עד 2017 היא כבר
    נעלמה, ומועצת העיר הצביעה כבר ב-2012 להשאיר את התצוגה כמות שהיא. פסל סטלין בכיכר המרכזית הורד ב-25
    ביוני 2010.


    עלו קודם למבצר. מן החומה רואים למטה את עמודי המוזיאון, ואת כל הוויכוח פרוש ביניהם.
  tip: >-
    כרטיס המוזיאון כולל את הבניין הראשי, בית ההולדת וקרון הרכבת. מדריכים דוברי אנגלית יוצאים לסיורים במרווחי
    זמן קבועים, ובלעדיהם רוב השלטים בגאורגית וברוסית נשארים אילמים. הקצו שעה וחצי עד שעתיים למוזיאון ושעה
    למבצר, שהכניסה אליו חינם. השביל למעלה קצר ותלול, בלי מעקה, והאבנים חלקלקות כשרטוב; בקיץ עלו מוקדם
    בבוקר או לקראת השקיעה, כי אין צל על הגבעה. בתי קפה, כספומטים ושירותים לאורך שדרת סטלין.
  route: >-
    גורי נמצאת 86 ק"מ מערבית לטביליסי על הכביש המהיר E60 (S1), כשעה ועשר דקות בדרך מהירה. צאו ביציאה המשולטת
    לגורי והמשיכו בכביש הראשי אל המרכז: המוזיאון בשדרת סטלין, וגבעת המבצר במרחק עשר דקות הליכה. חנו ליד
    המוזיאון. אספלט לכל אורך הדרך, וכל רכב יתאים. קל למצוא דלק על הכביש המהיר ובעיר. אופליסציחה נמצאת
    כ-10 ק"מ מזרחה, מעבר למטקווארי, כך שקל לשלב את שתיהן בחצי יום.
ar:
  name: 'غوري: القلعة ومتحف ستالين'
  short: >-
    قلعة على صخرة فوق متكفاري ولياخفي، وتحتها صرحٌ شيّدته غوري لتمجيد أشهر أبنائها سوء صيت: مدينة واحدة،
    ونظرتان إلى التاريخ.
  body: >-
    **تجعلك غوري تنظر إلى التاريخ مرتين: مرة من فوق سور من العصور الوسطى، ومرة من داخل معبد سوفييتي للتمجيد.**


    تعتلي القلعة تلاً منفرداً في وسط المدينة، فوق ملتقى متكفاري ولياخفي الكبير. من أمسك بها أمسك بشيدا
    كارتلي، ولذلك تقاتل عليها الجميع. كان التل محصناً منذ القرون الأخيرة قبل الميلاد، ويظهر اسم «قلعة
    غوري» في القرن الثالث عشر. وفي تسعينيات القرن السادس عشر كانت في يد العثمانيين؛ فحاصرها الملك سيمون
    الأول تسعة أشهر، ثم في عام 1599 تظاهر بهدنة احتراماً للصوم الكبير واستعادها بهجوم ليلي. وأعاد الملك
    روستوم بناءها في ثلاثينيات القرن السابع عشر، وإريكله الثاني عام 1774، ثم خلّف زلزال 1920 الأطلال التي
    تراها اليوم. امشِ بمحاذاة السور البيضاوي المبني من حصى النهر والمرقّع بالآجر حتى القسم الغربي الأفضل
    حفظاً، تسخراكارا، أي «البوابات التسع».


    وفي الأسفل، في جادة ستالين، يقوم متحف جوزيف ستالين. بدأ العمل فيه عام 1951، رسمياً بوصفه متحفاً لتاريخ
    الاشتراكية؛ وبعد وفاة ستالين عام 1953 صار نصبه التذكاري وكُرّس له عام 1957. ست قاعات من الصور والهدايا
    واللوحات تنتهي بواحد من اثني عشر قالباً مصبوباً لقناع وجهه بعد الموت. وفي الخارج يحيط جناح كلاسيكي
    بالبيت الخشبي الذي وُلد فيه ابن الإسكافي عام 1878، وإلى جانبه عربة البولمان المصفحة الخضراء الخاصة
    به: 83 طناً، في الخدمة منذ 1941، جُلبت إلى هنا من روستوف على الدون عام 1985.


    لم تكد تتغير نبرة التبجيل في المتحف. فبعد أن قصفت الطائرات الروسية غوري في آب/أغسطس 2008 واحتلت القوات
    الروسية المدينة حتى 22 آب/أغسطس، عُلّقت عند المدخل لافتة تصف المتحف بأنه تزوير للتاريخ؛ وبحلول عام
    2017 كانت قد اختفت، وكان مجلس المدينة قد صوّت في عام 2012 على إبقاء المعرض على حاله. وأُنزل تمثال
    ستالين في الساحة الرئيسية في 25 حزيران/يونيو 2010.


    اصعد إلى القلعة أولاً. فمن السور ترى أعمدة المتحف في الأسفل، والجدال كله مبسوطاً بينهما.
  tip: >-
    تشمل تذكرة المتحف المبنى الرئيسي وبيت الميلاد وعربة القطار. ويقود مرشدون ناطقون بالإنجليزية جولات
    على فترات، ومن دونهم تبقى معظم الشروح الجورجية والروسية صامتة. احسب ساعة ونصفاً إلى ساعتين للمتحف
    وساعة للقلعة، والدخول إليها مجاني. الدرب إلى أعلى قصير وشديد الانحدار بلا درابزين، والحجارة زلقة عند
    البلل؛ وفي الصيف اصعد باكراً أو قرب الغروب، إذ لا ظل على التل. المقاهي وأجهزة الصراف ودورات المياه
    على امتداد جادة ستالين.
  route: >-
    تقع غوري على بعد 86 كم غرب تبليسي على الطريق السريع E60 (S1)، أي نحو ساعة وعشر دقائق على طريق سريع.
    خذ مخرج غوري المعلَّم واتبع الطريق الرئيسي إلى الوسط: المتحف في جادة ستالين، وتل القلعة على بعد عشر
    دقائق سيراً. اركن قرب المتحف. الطريق مسفلت كله وأي سيارة تفي. والوقود سهل المنال على الطريق السريع
    وفي المدينة. وتقع أوبليستسيخي على بعد نحو 10 كم شرقاً عبر متكفاري، فيسهل الجمع بينهما في نصف يوم.
