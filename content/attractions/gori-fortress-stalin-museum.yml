ka:
  name: გორის ციხე და სტალინის მუზეუმი
  short: შიდა ქართლის დედაქალაქი — შუასაუკუნეების ციხე გორაზე და საბჭოთა ეპოქის ყველაზე სადავო მუზეუმი.
  body: >-
    **გორი ერთდროულად ორ განსხვავებულ ისტორიას ჰყვება.** ქალაქის ცენტრში, ბრტყელ ველზე მდგარ ცალკეულ გორაზე,
    აღმართულია **გორისციხე** — შუასაუკუნეების ციხესიმაგრე, რომლის კედლებიც ჯერ კიდევ VII საუკუნის ფენებს
    ინახავს, დღევანდელი სახე კი XVI–XVII საუკუნეებისაა. ციხე მტკვრისა და დიდი ლიახვის შესართავს აკონტროლებდა,
    ანუ ქართლის მთავარ სავაჭრო კვანძს. 1920 წლის მიწისძვრამ ის მძიმედ დააზიანა, მაგრამ კედლების პერიმეტრი
    და ხედი ქალაქზე შემორჩა.


    ქვემოთ, ცენტრალურ გამზირზე, დგას **იოსებ სტალინის მუზეუმი** — 1957 წელს გახსნილი კომპლექსი, სადაც
    სამი ნაწილია: სვეტებიანი მუზეუმის შენობა, სახლი, რომელშიც სტალინი დაიბადა (ბერძნული პორტიკით დაცული),
    და მისი პირადი სატვირთო ვაგონი.


    მუზეუმის ექსპოზიცია ძირითადად საბჭოთა ეპოქიდან შემორჩა და თითქმის უცვლელია — ეს მთავარი მიზეზია, რის
    გამოც ვიზიტი შთამბეჭდავია და ამავე დროს არაკომფორტული. რეპრესიების თემა მინიმალურად არის წარმოდგენილი;
    ერთი პატარა დარბაზი ბოლო წლებში დაემატა.


    გორი, გარდა ამისა, ჩვეულებრივი პროვინციული ქალაქია სიმპათიური ცენტრით, ბაზრით და კარგი კაფეებით. სწორედ
    აქედან იწყება უფლისციხისა და ატენის მარშრუტები — ორივე ოცი წუთის სავალზეა.


    ქალაქს ახლო წარსულიც აქვს: 2008 წლის აგვისტოს ომის დროს გორი დაბომბეს და ის რამდენიმე დღე ფრონტის
    ხაზთან აღმოჩნდა. ცენტრში დგას ამ მოვლენების მემორიალი, ქალაქის ჩრდილოეთით კი დევნილთა დასახლებაა —
    ეს კონტექსტი სტალინის მუზეუმის დათვალიერებას სულ სხვა განზომილებას აძლევს და ორივეს ერთად ნახვა უფრო
    ბევრს ხსნის, ვიდრე ცალ-ცალკე.
  tip: >-
    მუზეუმში გიდის აყვანა თითქმის სავალდებულოა — ტექსტი სტენდებზე მწირია და კონტექსტის გარეშე ბევრი რამ
    გაუგებარია; ინგლისურ და რუსულენოვან გიდებს ადგილზე იშოვი. ციხეზე ასვლა 10 წუთია ქვის ბილიკით, მოაჯირის
    გარეშე; სველ ამინდში ფრთხილად. ერთი-ორი საათი მუზეუმზე, ერთი ციხეზე. კაფეები, ბანკომატი და ტუალეტი
    სტალინის გამზირზეა. პარკინგი მუზეუმის წინ უფასოა.
  route: >-
    თბილისიდან გორამდე 86 კმ-ია E60 ავტობანით — ერთი საათი და ათი წუთი, გზა კარგი და სწრაფი. გორის მოსახვევი
    მკაფიოდ არის მონიშნული; ქალაქში შესვლის შემდეგ სტალინის გამზირს გაჰყევი, მუზეუმი და ციხე ერთმანეთისგან
    10 წუთის სავალზეა ფეხით. ავტომობილი მუზეუმის წინ დიდ მოედანზე დატოვე. ყველაფერი ასფალტია, ნებისმიერი
    კლასის მანქანა გამოდგება. საწვავი ავტობანზე ან ქალაქის შესასვლელთან აიღე; გორიდან უფლისციხემდე მხოლოდ
    15 კმ-ია.
en:
  name: 'Gori: Fortress and Stalin Museum'
  short: The capital of Shida Kartli — a medieval citadel on its hill and the most contested museum of
    the Soviet era.
  body: >-
    **Gori tells two very different stories at once.** In the middle of town, on an isolated hill rising
    from a flat plain, stands **Gori Fortress**. Its walls contain layers going back to the 7th century,
    though what you see is largely 16th and 17th century. It controlled the confluence of the Mtkvari
    and the Greater Liakhvi — the main trading knot of Kartli. The 1920 earthquake damaged it badly, but
    the perimeter walls and the view over the town survive.


    Below, on the central avenue, is the **Joseph Stalin Museum**, opened in 1957. It has three parts:
    the colonnaded museum building, the small wooden house where Stalin was born, now sheltered under
    a Greek portico, and his personal armoured railway carriage.


    The permanent display has changed little since Soviet times, which is precisely what makes a visit
    both compelling and uncomfortable. Repression is barely covered; one small room was added in recent
    years to address it, and the imbalance is impossible to miss.


    Beyond these two sights Gori is an ordinary provincial town with a pleasant centre, a market and decent
    cafés. It also works as the base for Uplistsikhe and the Ateni gorge, both within twenty minutes.
  tip: >-
    Hiring a guide in the museum is close to essential: the labelling is thin and much of the display
    makes little sense without context. English and Russian speaking guides are available on site. The
    walk up to the fortress takes about ten minutes on a stone path with no handrail, so take care when
    wet. Allow one to two hours for the museum and an hour for the citadel. Cafés, ATMs and toilets are
    on Stalin Avenue, and parking in front of the museum is free.
  route: >-
    Gori is 86 km from Tbilisi on the E60 motorway, about an hour and ten minutes on a fast, well-maintained
    road. The turn-off is clearly signed; once in town follow Stalin Avenue, with the museum and the fortress
    about ten minutes apart on foot. Leave the car on the large square in front of the museum. Everything
    is asphalt and any car category will do. Fuel is available on the motorway or at the town entrance,
    and Uplistsikhe is only 15 km further on.
ru:
  name: 'Гори: крепость и музей Сталина'
  short: Столица Шида-Картли — средневековая цитадель на холме и самый спорный музей советской эпохи.
  body: >-
    **Гори рассказывает сразу две очень разные истории.** В центре города, на отдельном холме посреди
    равнины, стоит **Горийская крепость**. В её стенах есть слои VII века, но то, что видно сегодня, —
    в основном XVI–XVII века. Крепость контролировала слияние Куры и Большой Лиахви, то есть главный торговый
    узел Картли. Землетрясение 1920 года сильно её повредило, но периметр стен и вид на город сохранились.


    Внизу, на центральном проспекте, находится **музей Иосифа Сталина**, открытый в 1957 году. Он состоит
    из трёх частей: здания музея с колоннадой, маленького деревянного дома, где Сталин родился, укрытого
    под греческим портиком, и его личного бронированного железнодорожного вагона.


    Постоянная экспозиция почти не менялась с советских времён, и именно это делает визит одновременно
    сильным и неуютным. Тема репрессий раскрыта минимально; в последние годы добавили один небольшой зал,
    и дисбаланс бросается в глаза.


    Помимо этих двух объектов Гори — обычный провинциальный город с приятным центром, рынком и неплохими
    кафе. Отсюда же удобно ехать в Уплисцихе и Атенское ущелье, оба в двадцати минутах.
  tip: >-
    Гида в музее лучше взять обязательно: подписей мало, и без пояснений экспозиция читается плохо; англо-
    и русскоязычные гиды есть на месте. Подъём в крепость занимает около десяти минут по каменной тропе
    без перил, в сырую погоду осторожнее. На музей закладывайте час-два, на крепость час. Кафе, банкоматы
    и туалеты — на проспекте Сталина, парковка перед музеем бесплатная.
  route: >-
    Гори находится в 86 км от Тбилиси по автомагистрали E60, около часа десяти по быстрой и ухоженной
    дороге. Поворот чётко обозначен; в городе двигайтесь по проспекту Сталина, музей и крепость разделяют
    примерно десять минут пешком. Машину оставьте на большой площади перед музеем. Асфальт везде, подойдёт
    автомобиль любого класса. Заправиться можно на трассе или у въезда в город, а до Уплисцихе отсюда
    всего 15 км.
fa:
  name: 'گوری: دژ و موزهٔ استالین'
  short: مرکز شیدا کارتلی — ارگی از سده‌های میانه روی تپه و بحث‌برانگیزترین موزهٔ دوران شوروی.
  body: >-
    **گوری همزمان دو داستان بسیار متفاوت را تعریف می‌کند.** در میانهٔ شهر، روی تپه‌ای منفرد که از دشتی
    هموار بالا می‌آید، **دژ گوری** ایستاده است. دیوارهایش لایه‌هایی تا سدهٔ هفتم دارند، هرچند آنچه امروز
    می‌بینید عمدتاً از سدهٔ شانزدهم و هفدهم است. دژ محل تلاقی متکواری و لیاخوی بزرگ را کنترل می‌کرد —
    گره اصلی بازرگانی کارتلی. زلزلهٔ 1920 آسیب سنگینی به آن زد، اما دیوارهای پیرامونی و منظرهٔ شهر برجا
    مانده‌اند.


    پایین‌تر، در خیابان مرکزی، **موزهٔ یوسف استالین** قرار دارد که در 1957 گشوده شد. سه بخش دارد: ساختمان
    ستون‌دار موزه، خانهٔ چوبی کوچکی که استالین در آن به دنیا آمد و امروز زیر رواقی یونانی محافظت می‌شود،
    و واگن قطار زرهی شخصی او. نمایش دائمی از دوران شوروی تا امروز کم تغییر کرده و دقیقاً همین است که بازدید
    را هم گیرا و هم ناراحت‌کننده می‌کند. سرکوب به‌سختی پوشش داده شده؛ در سال‌های اخیر یک اتاق کوچک برای
    پرداختن به آن افزوده شده و این عدم توازن به چشم می‌آید.


    جز این دو دیدنی، گوری شهری معمولی و ولایتی است با مرکزی دلپذیر، یک بازار و کافه‌های خوب. همچنین به‌عنوان
    پایگاهی برای اوپلیستسیخه و درهٔ آتنی کار می‌کند که هر دو در بیست دقیقه‌اند.
  tip: >-
    گرفتن راهنما در موزه تقریباً ضروری است: برچسب‌ها کم‌جان‌اند و بخش بزرگی از نمایش بدون زمینه معنای
    چندانی ندارد. راهنمای انگلیسی‌زبان و روسی‌زبان در محل هست. بالا رفتن به دژ حدود ده دقیقه روی مسیری
    سنگی و بدون نرده طول می‌کشد، پس در خیسی مراقب باشید. یک تا دو ساعت برای موزه و یک ساعت برای ارگ در
    نظر بگیرید. کافه، خودپرداز و سرویس بهداشتی در خیابان استالین است و پارکینگ روبه‌روی موزه رایگان.
  route: >-
    گوری 86 کیلومتر با تفلیس فاصله دارد، روی بزرگراه E60، حدود یک ساعت و ده دقیقه روی جاده‌ای سریع و خوش‌نگهداری‌شده.
    خروجی تابلوی روشنی دارد؛ در شهر خیابان استالین را دنبال کنید، جایی که موزه و دژ حدود ده دقیقه پیاده
    از هم فاصله دارند. خودرو را در میدان بزرگ روبه‌روی موزه بگذارید. همه‌جا آسفالت است و هر ردهٔ خودرویی
    مناسب. سوخت روی بزرگراه یا در ورودی شهر هست، و اوپلیستسیخه فقط 15 کیلومتر جلوتر است.
he:
  name: 'גורי: המבצר ומוזיאון סטלין'
  short: בירת שידה קרתלי — מצודה מימי הביניים על גבעתה והמוזיאון השנוי ביותר במחלוקת מן העידן הסובייטי.
  body: >-
    **גורי מספרת שני סיפורים שונים מאוד בעת ובעונה אחת.** במרכז העיר, על גבעה מבודדת המתרוממת ממישור שטוח,
    ניצב **מבצר גורי**. חומותיו מכילות שכבות המגיעות עד המאה השביעית, אף שמה שרואים היום הוא ברובו מן
    המאה ה-16 וה-17. הוא שלט על מפגש המטקווארי והליאחווי הגדול — צומת המסחר המרכזי של קרתלי. רעידת האדמה
    של 1920 פגעה בו קשות, אבל חומות ההיקף והנוף אל העיר שרדו.


    למטה, בשדרה המרכזית, נמצא **מוזיאון יוסיף סטלין**, שנפתח ב-1957. יש בו שלושה חלקים: בניין המוזיאון
    עטור העמודים, בית העץ הקטן שבו נולד סטלין, המוגן היום תחת פורטיקו יווני, וקרון הרכבת המשוריין הפרטי
    שלו. התצוגה הקבועה השתנתה מעט מאוד מאז התקופה הסובייטית, וזה בדיוק מה שהופך את הביקור למרתק ולא נוח
    כאחד. הדיכוי כמעט אינו מכוסה; בשנים האחרונות נוסף חדר קטן אחד שעוסק בו, וחוסר האיזון בולט לעין.


    מעבר לשני האתרים האלה גורי היא עיר פרובינציאלית רגילה עם מרכז נעים, שוק ובתי קפה סבירים. היא מתפקדת
    גם כבסיס לאופליסציחה ולעמק אתני, ששניהם בטווח עשרים דקות.
  tip: >-
    שכירת מדריך במוזיאון היא כמעט הכרחית: השילוט דל וחלק גדול מהתצוגה כמעט חסר משמעות בלי הקשר. מדריכים
    דוברי אנגלית ורוסית זמינים במקום. העלייה למבצר אורכת כעשר דקות בשביל אבן ללא מעקה, אז היזהרו כשרטוב.
    הקצו שעה עד שעתיים למוזיאון ושעה למצודה. בתי קפה, כספומטים ושירותים נמצאים בשדרת סטלין, והחניה מול
    המוזיאון חינם.
  route: >-
    גורי נמצאת 86 ק״מ מטביליסי על כביש E60, כשעה ועשר דקות על כביש מהיר ומתוחזק היטב. הפנייה משולטת בבירור;
    בתוך העיר עקבו אחרי שדרת סטלין, שלאורכה המוזיאון והמבצר מרוחקים כעשר דקות הליכה זה מזה. השאירו את
    הרכב בכיכר הגדולה שמול המוזיאון. הכול אספלט וכל קטגוריית רכב תתאים. דלק זמין על הכביש המהיר או בכניסה
    לעיר, ואופליסציחה נמצאת רק 15 ק״מ הלאה.
ar:
  name: 'غوري: القلعة ومتحف ستالين'
  short: عاصمة شيدا كارتلي — قلعة من العصور الوسطى على تلها وأكثر متاحف الحقبة السوفييتية إثارة للجدل.
  body: >-
    **تروي غوري قصتين مختلفتين تماماً في وقت واحد.** في وسط البلدة، على تل منعزل ينهض من سهل منبسط، تقوم
    **قلعة غوري**. تضم أسوارها طبقات تعود إلى القرن السابع، وإن كان ما تراه اليوم في معظمه من القرنين
    السادس عشر والسابع عشر. وقد تحكمت بملتقى متكفاري ولياخفي الكبير — العقدة التجارية الرئيسية لكارتلي.
    وألحق بها زلزال 1920 ضرراً بالغاً، لكن أسوارها المحيطة وإطلالتها على البلدة بقيت.


    وفي الأسفل، على الجادة المركزية، يقع **متحف جوزيف ستالين** الذي افتُتح عام 1957. وهو ثلاثة أقسام:
    مبنى المتحف ذو الأعمدة، والبيت الخشبي الصغير الذي وُلد فيه ستالين وهو اليوم محمي تحت رواق يوناني،
    وعربته السككية المصفحة الخاصة. ولم يتغير العرض الدائم كثيراً منذ الحقبة السوفييتية، وهذا بالضبط ما
    يجعل الزيارة شائقة وغير مريحة في آن. أما القمع فبالكاد يُتناول؛ وقد أُضيفت في السنوات الأخيرة غرفة
    صغيرة واحدة تعالجه، والاختلال في الميزان لا يمكن أن يفوت أحداً.


    وخارج هذين الموقعين، غوري بلدة ريفية عادية بمركز لطيف وسوق ومقاهٍ جيدة. وهي تصلح أيضاً قاعدة لأوبليستسيخي
    ووادي أتيني، وكلاهما ضمن عشرين دقيقة.
  tip: >-
    استئجار مرشد في المتحف يكاد يكون ضرورياً: فالشروح شحيحة وكثير من المعروضات لا يعني شيئاً من دون سياق.
    ويتوفر في الموقع مرشدون بالإنجليزية والروسية. والصعود إلى القلعة يستغرق نحو عشر دقائق على درب حجري
    بلا درابزين، فانتبه عند البلل. واحسب ساعة إلى ساعتين للمتحف وساعة للقلعة. والمقاهي وأجهزة الصراف ودورات
    المياه في جادة ستالين، والوقوف أمام المتحف مجاني.
  route: >-
    تبعد غوري 86 كم عن تبليسي على طريق E60 السريع، نحو ساعة وعشر دقائق على طريق سريع جيد الصيانة. والمخرج
    معلَّم بوضوح؛ وداخل البلدة اتبع جادة ستالين، حيث يفصل بين المتحف والقلعة نحو عشر دقائق سيراً. اترك
    السيارة في الساحة الكبيرة أمام المتحف. وكل شيء إسفلت وأي فئة سيارة تفي. والوقود متوفر على الطريق السريع
    أو عند مدخل البلدة، وأوبليستسيخي على بعد 15 كم فقط.
