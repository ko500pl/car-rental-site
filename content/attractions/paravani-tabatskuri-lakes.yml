ka:
  name: ფარავნისა და ტაბაწყურის ტბები
  short: ჯავახეთის ვულკანური პლატოს მაღალმთიანი ტბები ორ ათას მეტრზე, გადამფრენი ფრინველებით.
  body: >
    ჯავახეთის პლატო საქართველოს ყველაზე ნაკლებად „ტურისტული“ ლანდშაფტია: უტყეო, ღია ვულკანური ზეგანი ორი
    ათასი მეტრის სიმაღლეზე, სადაც ჰორიზონტი არაფრით იფარება. სწორედ აქ დევს ქვეყნის ორი მთავარი მაღალმთიანი
    ტბა.


    **ფარავანი საქართველოს ყველაზე დიდი ტბაა ფართობით** — დაახლოებით ოცდაჩვიდმეტი კვადრატული კილომეტრი,
    თუმცა ძალიან თხელი: ღრმა ადგილას სამ მეტრსაც ვერ სცილდება. ზამთარში იგი მთლიანად იყინება. **ტაბაწყური,
    პირიქით, ღრმაა** — ორმოც მეტრზე მეტი — და კალმახით არის ცნობილი; მისი სანაპირო უფრო ველური და ძნელად
    მისადგომია.


    ორივე ტბა გადამფრენი ფრინველების მნიშვნელოვანი გაჩერებაა: გაზაფხულსა და შემოდგომაზე აქ წეროები, ბატები,
    იხვები და პელიკნებიც კი ჩერდებიან. ჯავახეთის დაცული ტერიტორიები სწორედ ამ ჭარბტენიანი ზონების გამო
    შეიქმნა.


    რას ელოდო:


    - უსაზღვრო ღია ხედები, თითქმის სრული სიჩუმე და ძლიერი ქარი

    - სომხური და ბერძნული წარმოშობის სოფლები ნაპირებთან, ხშირად ნაკელის აგურით ნაშენი

    - პრაქტიკულად არანაირი ინფრასტრუქტურა — არც კაფე, არც ტუალეტი, არც მაღაზია ტბასთან


    ეს ადგილი მათთვისაა, ვისაც ცარიელი, დიდი სივრცე უფრო აინტერესებს, ვიდრე ღირსშესანიშნაობების ჩამონათვალი.


    ჯავახეთში მისვლა ერთი ობიექტის გულისთვის არ ღირს — ეს მხარე მთლიანობაში იკითხება. ფარავანთან ახლოს
    ფოკის სომხური სოფელი და ძველი ეკლესიებია, ხოლო ახალქალაქისა და ნინოწმინდის მიმართულებით მეგალითური
    ციხესიმაგრეები და საბჭოთა პერიოდის დასახლებები. ერთი დღე მთელ ზეგანზე უფრო ლოგიკური გეგმაა.
  tip: >-
    ფარავანი მთავარ გზას ეკვრის და მასთან მისვლა ადვილია; ტაბაწყურამდე კი ხრეშოვანი გზაა და მშრალი ამინდი
    და მაღალი კლირენსი სჭირდება. თბილად ჩაიცვი ზაფხულშიც: ორ ათას მეტრზე ქარი მუდმივია და საღამოს ტემპერატურა
    ათ გრადუსზე დაბლა ეცემა. წყალი და საკვები თან წაიღე — ნაპირზე მაღაზია არაა. საწვავი წალკაში ან ნინოწმინდაში
    აავსე. ბანაობა ცივი წყლის გამო თითქმის არავის უწევს.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით მიდიხარ წალკის გზით: ქალაქიდან გამოსვლისთანავე გზა მთაში ადის და თანდათან
    ვიწროვდება. წალკის შემდეგ ჯავახეთის პლატოზე ახვალ და ფარავანი მარცხნივ, გზის პირას გამოჩნდება. სულ
    დაახლოებით ას სამოცდათხუთმეტი კილომეტრი და სამი საათი. ასფალტი ძირითადად კარგია, თუმცა ადგილ-ადგილ
    დაზიანებული, ტაბაწყურის განშტოება კი ხრეშოვანია. ზამთარში პლატოზე თოვლი და ძლიერი ქარბუქია — ნოემბრიდან
    აპრილამდე მარშრუტი არ არის რეკომენდებული. კროსოვერი აქ საგრძნობლად უფრო კომფორტულია.
en:
  name: Lake Paravani and Lake Tabatskuri
  short: High-altitude lakes on the volcanic Javakheti plateau at around 2,000 metres, on a major bird
    migration route.
  body: >-
    The Javakheti plateau is the least touristic landscape in Georgia: a treeless volcanic tableland at
    around 2,000 metres where nothing interrupts the horizon. Two of the country's most significant high
    lakes sit on it.


    **Paravani is the largest lake in Georgia by surface area**, roughly 37 square kilometres, yet remarkably
    shallow — barely three metres at its deepest. It freezes solid in winter. **Tabatskuri is the opposite**:
    over forty metres deep, known for its trout, with a wilder and harder-to-reach shoreline.


    Both lakes are important stopovers on a migration corridor. In spring and autumn cranes, geese, ducks
    and even pelicans rest here, and the Javakheti Protected Areas were established largely to safeguard
    these wetlands.


    What to expect:


    - vast open views, near-total silence and constant wind

    - villages of Armenian and Greek origin along the shores, often built from stone and dung brick

    - essentially no infrastructure — no cafe, toilet or shop at the water


    This is a destination for travellers who want empty space rather than a checklist of monuments. Photographers
    come for the light, which on a clear day across an unbroken plateau is unlike anywhere else in the
    country.
  tip: >-
    Paravani sits directly beside the main road and is easy to reach; Tabatskuri involves a gravel track
    that needs dry weather and decent clearance. Dress warmly even in summer — at 2,000 metres the wind
    never stops and evening temperatures drop below ten degrees. Carry water and food, since there is
    no shop at the shore. Fill the tank in Tsalka or Ninotsminda. Almost nobody swims here: the water
    stays cold through the whole season.
  route: >-
    Head southwest out of Tbilisi on the Tsalka road. It climbs into the hills almost immediately and
    narrows as it goes. Beyond Tsalka you emerge onto the Javakheti plateau and Paravani appears on the
    left, right at the roadside. About 175 km and three hours in total. The asphalt is mostly reasonable
    but broken in places, and the turnoff towards Tabatskuri is gravel. In winter the plateau gets deep
    snow and severe wind — the route is not recommended between November and April. A crossover is noticeably
    more comfortable here.
ru:
  name: Озёра Паравани и Табацкури
  short: Высокогорные озёра вулканического Джавахетского плато на высоте около 2 000 метров, на пути миграции
    птиц.
  body: >
    Джавахетское плато — наименее туристический ландшафт Грузии: безлесное вулканическое нагорье на высоте
    около двух тысяч метров, где горизонт ничем не заслонён. Здесь лежат два главных высокогорных озера
    страны.


    **Паравани — крупнейшее озеро Грузии по площади**, около тридцати семи квадратных километров, но при
    этом очень мелкое: даже в глубоких местах едва достигает трёх метров. Зимой оно промерзает полностью.
    **Табацкури, наоборот, глубокое** — более сорока метров — и известно форелью; его берега более дикие
    и труднодоступные.


    Оба озера — важные остановки на миграционном коридоре. Весной и осенью здесь отдыхают журавли, гуси,
    утки и даже пеликаны, и Джавахетские охраняемые территории созданы во многом ради этих водно-болотных
    угодий.


    Чего ожидать:


    - огромные открытые виды, почти полная тишина и постоянный ветер

    - сёла армянского и греческого происхождения по берегам, часто сложенные из камня

    - практически полное отсутствие инфраструктуры: у воды нет ни кафе, ни туалета, ни магазина


    Это направление для тех, кому важнее пустое пространство, чем список достопримечательностей. Фотографы
    едут сюда за светом, который на открытом плато не похож ни на что другое в стране.


    Ехать в Джавахети ради одной точки не стоит — этот край читается только целиком. Рядом с Паравани
    лежит армянское село Пока со старыми церквями, а в сторону Ахалкалаки и Ниноцминды — мегалитические
    крепости и посёлки советского времени. Логичнее заложить целый день на всё плато сразу.
  tip: >-
    Паравани лежит прямо у трассы, доехать до него просто; к Табацкури ведёт гравийка, нужна сухая погода
    и приличный клиренс. Одевайтесь тепло даже летом: на двух тысячах метров ветер не стихает, а вечером
    температура опускается ниже десяти градусов. Воду и еду берите с собой, у берега магазинов нет. Заправляйтесь
    в Цалке или Ниноцминде. Купаться здесь почти никто не решается — вода холодная весь сезон.
  route: >-
    Из Тбилиси двигайтесь на юго-запад по дороге на Цалку: она почти сразу уходит в горы и постепенно
    сужается. За Цалкой вы выезжаете на Джавахетское плато, и Паравани появляется слева, прямо у дороги.
    Всего около 175 км и три часа. Асфальт в основном приемлемый, местами разбитый, а съезд к Табацкури
    — гравийный. Зимой на плато много снега и сильные метели, с ноября по апрель маршрут не рекомендуется.
    Кроссовер здесь заметно комфортнее седана.
fa:
  name: دریاچهٔ پاراوانی و دریاچهٔ تاباتسکوری
  short: دریاچه‌های مرتفع بر فلات آتشفشانی جاواختی در حدود 2,000 متر، روی یکی از مسیرهای اصلی مهاجرت پرندگان.
  body: >-
    فلات جاواختی کم‌گردشگرترین چشم‌انداز گرجستان است: پهنه‌ای آتشفشانی و بی‌درخت در حدود 2,000 متر که
    هیچ چیز افق آن را نمی‌شکند. دو تا از مهم‌ترین دریاچه‌های مرتفع کشور روی همین فلات نشسته‌اند. **پاراوانی
    از نظر مساحت بزرگ‌ترین دریاچهٔ گرجستان است**، نزدیک 37 کیلومتر مربع، و در عین حال به‌شکلی چشمگیر کم‌عمق
    — در عمیق‌ترین نقطه به‌زحمت سه متر — و زمستان‌ها یکسره یخ می‌بندد. **تاباتسکوری درست نقطهٔ مقابل آن
    است**: بیش از چهل متر عمق دارد، به قزل‌آلایش شهرت دارد و ساحلی وحشی‌تر و دشوارتر برای رسیدن.


    هر دو دریاچه ایستگاه‌های مهمی روی یک دالان مهاجرتی‌اند. در بهار و پاییز درنا، غاز، مرغابی و حتی پلیکان
    اینجا می‌آسایند، و مناطق حفاظت‌شدهٔ جاواختی تا حد زیادی برای پاسداری از همین تالاب‌ها ایجاد شد.


    آنچه در انتظارتان است روشن است: چشم‌اندازهای باز و بی‌انتها، سکوتی تقریباً کامل و بادی که هرگز نمی‌ایستد؛
    روستاهایی با تبار ارمنی و یونانی در امتداد ساحل که اغلب از سنگ و خشت سرگین ساخته شده‌اند؛ و عملاً
    هیچ زیرساختی — نه کافه، نه سرویس بهداشتی و نه مغازه‌ای کنار آب. اینجا مقصد کسانی است که به‌جای فهرستی
    از بناهای دیدنی، فضای خالی می‌خواهند. عکاسان برای نور می‌آیند، نوری که در روزی صاف روی فلاتی یکدست
    مانند هیچ جای دیگر این کشور نیست.
  tip: >-
    پاراوانی درست کنار جادهٔ اصلی است و رسیدن به آن آسان؛ تاباتسکوری اما راهی شنی می‌خواهد که به هوای
    خشک و ارتفاع کف مناسب نیاز دارد. حتی در تابستان گرم بپوشید — در 2,000 متر باد هرگز نمی‌ایستد و دمای
    شب زیر ده درجه می‌رود. آب و خوراک همراه ببرید، چون کنار آب مغازه‌ای نیست. باک را در تسالکا یا نینوتسمیندا
    پر کنید. تقریباً هیچ‌کس اینجا شنا نمی‌کند: آب در تمام فصل سرد می‌ماند.
  route: >-
    از تفلیس رو به جنوب‌غرب، جادهٔ تسالکا را بگیرید. جاده تقریباً بلافاصله به تپه‌ها بالا می‌رود و هرچه
    پیش می‌روید باریک‌تر می‌شود. بعد از تسالکا به فلات جاواختی می‌رسید و پاراوانی سمت چپ، درست کنار جاده،
    پدیدار می‌شود. روی هم حدود 175 کیلومتر و سه ساعت. آسفالت بیشتر جاها قابل قبول است اما جاهایی شکسته،
    و انشعاب به سوی تاباتسکوری شنی است. زمستان فلات برف سنگین و باد شدید دارد — این مسیر میان نوامبر و
    آوریل توصیه نمی‌شود. کراس‌اوور اینجا به‌مراتب راحت‌تر است.
he:
  name: אגם פאראווני ואגם טבצקורי
  short: אגמים גבוהים על רמת ג'אוואחתי הוולקנית בגובה של כ-2,000 מטר, על נתיב נדידת ציפורים מרכזי.
  body: >-
    רמת ג'אוואחתי היא הנוף הפחות תיירותי בגאורגיה: מישור וולקני חשוף מעצים בגובה של כ-2,000 מטר, שבו שום
    דבר אינו קוטע את קו האופק. שני האגמים הגבוהים החשובים ביותר במדינה שוכנים עליה. **פאראווני הוא האגם
    הגדול בגאורגיה בשטחו**, כ-37 קילומטרים רבועים, ובכל זאת רדוד להפליא — שלושה מטרים בקושי בנקודה העמוקה
    ביותר — והוא קופא לגמרי בחורף. **טבצקורי הוא ההפך הגמור**: עומק של יותר מארבעים מטר, מוניטין של דגי
    פורל, וקו חוף פראי יותר וקשה יותר להגעה.


    שני האגמים הם תחנות עצירה חשובות במסדרון נדידה. באביב ובסתיו נחים כאן עגורים, אווזים, ברווזים ואפילו
    שקנאים, והשמורות של ג'אוואחתי הוכרזו בעיקר כדי להגן על בתי הגידול הלחים האלה.


    ומה שמצפה לכם ברור: מרחבים פתוחים עצומים, שקט כמעט מוחלט ורוח שאינה פוסקת; כפרים ממוצא ארמני ויווני
    לאורך החופים, בנויים לא פעם מאבן ומלבני גללים; ולמעשה שום תשתית — אין בית קפה, אין שירותים ואין חנות
    ליד המים. זהו יעד למי שמחפש מרחב ריק ולא רשימה של מונומנטים. צלמים מגיעים לכאן בשביל האור, שביום בהיר
    מעל רמה בלתי מופרעת אינו דומה לשום מקום אחר במדינה.
  tip: >-
    פאראווני יושב ממש לצד הכביש הראשי וקל להגיע אליו; אל טבצקורי מוליכה דרך חצץ שדורשת מזג אוויר יבש וגובה
    גחון סביר. התלבשו חם גם בקיץ — בגובה 2,000 מטר הרוח אינה פוסקת והטמפרטורות בערב יורדות מתחת לעשר מעלות.
    קחו מים ואוכל, כי אין חנות על שפת המים. מלאו דלק בצלקה או בנינוצמינדה. כמעט אף אחד לא שוחה כאן: המים
    נשארים קרים לאורך כל העונה.
  route: >-
    צאו מטביליסי דרומה-מערבה בכביש צלקה. הוא מטפס אל הגבעות כמעט מיד ומצטמצם ככל שממשיכים. אחרי צלקה אתם
    עולים אל רמת ג'אוואחתי ופאראווני מופיע משמאל, ממש בצד הדרך. בסך הכול כ-175 ק״מ ושלוש שעות. האספלט
    סביר ברובו אך שבור במקומות, והפנייה לכיוון טבצקורי היא דרך חצץ. בחורף יורד על הרמה שלג עמוק ונושבת
    רוח קשה — המסלול אינו מומלץ בין נובמבר לאפריל. רכב קרוסאובר נוח כאן בהרבה.
ar:
  name: بحيرة بارافاني وبحيرة تاباتسكوري
  short: بحيرتان مرتفعتان على هضبة جافاخيتي البركانية عند نحو 2,000 متر، على أحد مسارات هجرة الطيور الكبرى.
  body: >-
    هضبة جافاخيتي أقل مشاهد جورجيا سياحية: سطح بركاني خالٍ من الأشجار عند نحو 2,000 متر لا يقطع فيه شيء
    خط الأفق. وعليها تستقر اثنتان من أهم البحيرات المرتفعة في البلاد. **بارافاني أكبر بحيرات جورجيا مساحةً**،
    نحو 37 كيلومتراً مربعاً، ومع ذلك ضحلة إلى حد لافت — بالكاد ثلاثة أمتار في أعمق نقطة — وتتجمد بالكامل
    في الشتاء. **وتاباتسكوري نقيضها تماماً**: عمقها يتجاوز أربعين متراً، وتشتهر بسمك التروتة، وشاطئها
    أكثر توحشاً وأصعب وصولاً.


    والبحيرتان محطتان مهمتان على ممر هجرة. ففي الربيع والخريف يستريح هنا الكركي والإوز والبط وحتى البجع،
    وقد أُنشئت محميات جافاخيتي أساساً لحماية هذه الأراضي الرطبة.


    وما ينتظرك هنا واضح: مساحات مفتوحة شاسعة وصمت شبه تام ورياح لا تهدأ؛ وقرى من أصل أرمني ويوناني على
    الضفاف، مبنية غالباً من الحجر وقوالب الروث؛ ولا بنية تحتية عملياً — لا مقهى ولا دورة مياه ولا متجر
    عند الماء. هذه وجهة لمن يريد الفراغ المفتوح لا قائمة من المعالم. ويأتي المصورون من أجل الضوء، فهو
    في يوم صافٍ فوق هضبة غير مقطوعة لا يشبه ضوء أي مكان آخر في البلاد.
  tip: >-
    بارافاني ملاصقة للطريق الرئيسي والوصول إليها سهل؛ أما تاباتسكوري فتتطلب مسلكاً حصوياً يحتاج طقساً
    جافاً وخلوصاً أرضياً معقولاً. البس ثياباً دافئة حتى في الصيف — فعلى 2,000 متر لا تتوقف الريح وتهبط
    حرارة المساء دون عشر درجات. احمل ماءً وطعاماً، فلا متجر عند الماء. املأ الخزان في تسالكا أو نينوتسميندا.
    ولا يكاد أحد يسبح هنا: الماء يبقى بارداً طوال الموسم.
  route: >-
    اخرج من تبليسي جنوباً غرباً على طريق تسالكا. يصعد الطريق إلى التلال فور خروجك ويضيق كلما تقدمت. وبعد
    تسالكا تخرج إلى هضبة جافاخيتي فتظهر بارافاني على اليسار، على حافة الطريق مباشرة. نحو 175 كم وثلاث
    ساعات إجمالاً. الإسفلت مقبول في معظمه لكنه متهالك في مواضع، والتفرع نحو تاباتسكوري حصوي. وفي الشتاء
    تتراكم الثلوج على الهضبة مع رياح شديدة — ولا يُنصح بالمسار بين نوفمبر وأبريل. وسيارة كروس أوفر أريح
    بوضوح هنا.
