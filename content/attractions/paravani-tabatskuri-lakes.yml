ka:
  name: ფარავნისა და ტაბაწყურის ტბები
  short: >-
    საქართველოს უდიდესი ტბა, სადაც სიღრმე 3,3 მეტრს არ აღემატება, და ღრმა, ციცაბონაპირებიანი ტაბაწყური,
    ორივე ჯავახეთის უტყეო ვულკანურ ზეგანზე, 2000 მეტრზე.
  body: >-
    **ფარავანი საქართველოს უდიდესი ტბაა, მაგრამ მის 37,5 კვადრატულ კილომეტრზე წყალი არსად არის 3,3 მეტრზე
    ღრმა.** იგი ჯავახეთის ვულკანურ მთიანეთში, სამსრისა და ჯავახეთის ქედებს შორის, ზღვის დონიდან 2073 მეტრზე
    გაწოლილა, ქვაბულში, რომელიც პლეისტოცენში წარმოიქმნა, როცა სამსრის ქედიდან ჩამოსულმა ლავის ნაკადმა
    მდინარის ხეობა გადაკეტა. აქ არც ხეა, არც თავშესაფარი. ქარი ზედაპირს მოკლე, ნაცრისფერ ტალღებად ვარცხნის
    და წყალმცენარეებს ფეხის მოკიდების საშუალებას არ აძლევს. ზამთარში ტბა იყინება, ყინულის სისქე 47-დან
    73 სანტიმეტრამდე აღწევს, სამხრეთ ბოლოდან კი მდინარე ფარავანი გაედინება და მტკვარს უერთდება.


    ნაპირის სოფლების სახელებში მოულოდნელი ისტორია იმალება. ტამბოვკა და როდიონოვკა XIX საუკუნის 40-იან
    წლებში დუხობორებმა, მეფის მიერ ამ მთიანეთში გადმოსახლებულმა რუსმა რელიგიურმა განდგომილებმა, გააშენეს;
    დღეს ტამბოვკის მცხოვრებნი თითქმის სულ სომხები არიან. სამხრეთ ნაპირზე ფოკის წმინდა ნინოს დედათა მონასტერი
    დგას.


    ფარავნიდან ჩრდილო-დასავლეთით, პირდაპირი ხაზით დაახლოებით 25 კილომეტრზე, ტაბაწყურია, თითქოს მისი საპირისპირო.
    მისი სარკე სულ 14,2 კვადრატული კილომეტრია, სიღრმე კი 40,2 მეტრს აღწევს და წყლის მოცულობით საქართველოში
    მას ტოლი არ ჰყავს. ტბა 1991 მეტრზე ძევს; მისი მაღალი, ციცაბო ნაპირები ყურეებადაა დაღარული, წყლიდან
    კი პატარა კუნძულები ამოდის. მასში კალმახი და სიგი ბინადრობს, გარშემო კი ქცია-ტაბაწყურის აღკვეთილი
    აკრავს. XVIII საუკუნეში ვახუშტი ბატონიშვილმა ჩაიწერა: „იტყვიან ტბის-ყურისას თამარ მეფემ ჰყო ტბად,
    ვინაითგან ჩანს ნარუალი“, ანუ ქციიდან გაყვანილი რუს კვალი. ეს გადმოცემაა და არა გეოლოგია: ქვაბული ლავის
    ნაკადებმა შექმნა.


    აქ ძეგლებისთვის კი არა, სივრცისთვის მოდიან. მანქანა გააჩერეთ, ძრავა ჩააქრეთ და ზეგანზე მხოლოდ ქარის
    ხმა დარჩება, წყალს რომ ეჭიდება.
  tip: >-
    ფარავანი ასფალტის გზის პირასაა და მასთან მისვლას არავითარი ძალისხმევა არ სჭირდება. ტაბაწყური ცალკე
    გასვლაა: ყველაზე ხშირად ბაკურიანიდან, ცხრაწყაროს უღელტეხილზე გადასვლით მიდიან, ხრეშიან გზაზე, რომელსაც
    მშრალი ამინდი და მაღალი კლირენსი სჭირდება. ორივე ტბის ერთ მოკლე გაჩერებაში ნახვის იმედი ნუ გექნებათ.
    ივლისშიც თბილად ჩაიცვით: 2000 მეტრზე ქარი არ წყდება, საღამოს კი ცივა. არც ერთ ნაპირზე მაღაზია და თავშესაფარი
    არ არის, ამიტომ საჭმელი და წყალი თან წაიღეთ, საწვავი წალკაში ან ნინოწმინდაში ჩაასხით. წყალი მთელი
    ზაფხული ცივია: მეთევზეები ხშირად ჩამოდიან, მობანავეები იშვიათად.
  route: >-
    თბილისიდან ყველაზე მოკლე გზა წყნეთსა და კოჯორზე გადის, Sh36-ით მანგლისამდე, შემდეგ Sh31-ით დასავლეთისკენ,
    წალკის ზეგნის გადაკვეთით, წალკამდე. იქიდან ნინოწმინდის მიმართულებით, სამხრეთ-დასავლეთისკენ იარეთ,
    სანამ მარჯვნივ ფარავანი არ გადაიშლება: დაახლოებით 135 კილომეტრია, მაგრამ მკვეთრი მოსახვევების, დაზიანებული
    ასფალტისა და გზაზე გამოსული საქონლის გამო სამი საათი გაითვალისწინეთ. ტაბაწყურისთვის ბაკურიანამდე უნდა
    ჩახვიდეთ და ცხრაწყაროს უღელტეხილზე ხრეშიანი გზით გადახვიდეთ; სწორედ აქ ამართლებს ჯიპი თავს. ნოემბრიდან
    აპრილამდე ზეგანს თოვლი და ქარბუქი იპყრობს, ეს ზაფხულის მოგზაურობაა.
en:
  name: Lake Paravani and Lake Tabatskuri
  short: >-
    Georgia's largest lake, never deeper than 3.3 metres, and deep, steep-sided Tabatskuri, both lying
    at 2,000 metres on the treeless volcanic Javakheti plateau.
  body: >-
    **Paravani is the largest lake in Georgia, and yet across its 37.5 square kilometres the water is
    nowhere deeper than 3.3 metres.** It lies at 2,073 metres on the Javakheti volcanic highland, between
    the Samsari and Javakheti ranges, in a basin formed when a Pleistocene lava flow from the Samsari
    ridge dammed a river valley. There are no trees and no shelter. The wind combs the surface into short
    grey waves and gives water plants no chance to take hold. In winter the lake freezes over, the ice
    47 to 73 centimetres thick, and the Paravani river leaves its southern end to run down to the Mtkvari.


    The shore villages carry a surprising history in their names. Tambovka and Rodionovka were founded
    in the 1840s by Doukhobors, Russian religious dissenters whom the tsar exiled to these uplands; today
    Tambovka is almost entirely Armenian. On the southern shore stands the convent of St Nino at Poka.


    Some 25 km to the north-west, as the crow flies, Tabatskuri is Paravani's opposite. Its surface is
    only 14.2 square kilometres, but it plunges to 40.2 metres and holds more water than any other lake
    in Georgia. Its shores are high and steep, cut into bays, with a few small islands, at 1,991 metres;
    trout and whitefish live in it, and the Ktsia-Tabatskuri Managed Reserve surrounds it. In the 18th
    century the geographer Vakhushti Bagrationi recorded a local belief that Queen Tamar made the lake
    herself, by leading a channel from the Ktsia river. Tradition, not geology: the basin was formed by
    lava flows.


    Come for space rather than sights. Stop the car, switch off the engine, and the only sound left on
    the plateau is the wind working at the water.
  tip: >-
    Paravani lies beside the asphalt road and needs no effort. Tabatskuri is a separate outing, most often
    reached from Bakuriani over the Tskhratskaro pass on gravel that needs dry weather and a high-clearance
    car; do not expect to see both lakes in one short stop. Dress warmly even in July: the wind never
    stops at 2,000 metres and evenings turn cold. There is no shop or shelter at either shore, so bring
    food and water and fill up in Tsalka or Ninotsminda. The water stays cold all summer; anglers come,
    swimmers rarely.
  route: >-
    The shortest way from Tbilisi climbs through Tskneti and Kojori on the Sh36 to Manglisi, then runs
    west on the Sh31 across the Tsalka plateau to Tsalka. From there keep south-west towards Ninotsminda
    until Paravani opens on your right: about 135 km, but allow three hours for tight bends, broken asphalt
    and cattle on the road. For Tabatskuri, drive to Bakuriani and cross the Tskhratskaro pass on a gravel
    track, which is where an SUV earns its keep. Between November and April snow and blizzards close in
    on the plateau; this is a summer trip.
ru:
  name: Озёра Паравани и Табацкури
  short: >-
    Крупнейшее озеро Грузии, нигде не глубже 3,3 метра, и глубокое крутобережное Табацкури — оба на высоте
    2000 метров, на безлесном вулканическом плато Джавахети.
  body: >-
    **Паравани — самое большое озеро Грузии, и всё же на всех его 37,5 квадратных километрах вода нигде
    не глубже 3,3 метра.** Оно лежит на высоте 2073 метра на Джавахетском вулканическом нагорье, между
    Самсарским и Джавахетским хребтами, в котловине, которая возникла, когда плейстоценовый лавовый поток
    с Самсарского хребта запрудил речную долину. Здесь нет ни деревьев, ни укрытия. Ветер расчёсывает
    гладь на короткие серые волны и не даёт водным растениям укорениться. Зимой озеро замерзает, лёд достигает
    толщины от 47 до 73 сантиметров, а из южной оконечности вытекает река Паравани и сбегает к Мтквари
    (Куре).


    Названия прибрежных сёл хранят неожиданную историю. Тамбовку и Родионовку в 1840-х годах основали
    духоборы — русские религиозные инакомыслящие, которых царь сослал на эти высокогорья; сегодня Тамбовка
    почти целиком армянская. На южном берегу стоит женский монастырь Святой Нино в Поке.


    Километрах в 25 к северо-западу, если считать по прямой, лежит Табацкури — полная противоположность
    Паравани. Площадь его зеркала всего 14,2 квадратного километра, зато глубина доходит до 40,2 метра,
    и воды в нём больше, чем в любом другом озере Грузии. Берега высокие и крутые, изрезанные заливами,
    в воде — несколько островков, высота над морем — 1991 метр; здесь водятся форель и сиг, а вокруг раскинулся
    Кция-Табацкурский заказник. В XVIII веке географ Вахушти Багратиони записал местное поверье: озеро
    будто бы создала сама царица Тамара, отведя канал от реки Кция. Это предание, а не геология: котловину
    сформировали лавовые потоки.


    Приезжайте сюда за простором, а не за достопримечательностями. Остановите машину, заглушите мотор
    — и единственным звуком на плато останется ветер, без устали треплющий воду.
  tip: >-
    Паравани лежит у самой асфальтовой дороги и не требует никаких усилий. Табацкури — отдельная поездка:
    чаще всего к нему едут из Бакуриани через перевал Цхратцкаро по грунтовке, для которой нужны сухая
    погода и машина с высоким клиренсом; не рассчитывайте увидеть оба озера за одну короткую остановку.
    Одевайтесь тепло даже в июле: на 2000 метрах ветер не стихает, а вечера холодные. Ни магазина, ни
    укрытия нет ни на одном берегу, поэтому возьмите еду и воду и заправьтесь в Цалке или Ниноцминде.
    Вода всё лето остаётся холодной: рыбаки сюда приезжают, купальщики — редко.
  route: >-
    Кратчайший путь из Тбилиси поднимается через Цхнети и Коджори по Sh36 к Манглиси, а затем уходит на
    запад по Sh31 через Цалкское плато в Цалку. Оттуда держите на юго-запад, в сторону Ниноцминды, пока
    справа не откроется Паравани: около 135 км, но закладывайте три часа на крутые повороты, разбитый
    асфальт и скот на дороге. К Табацкури поезжайте через Бакуриани и перевал Цхратцкаро по грунтовой
    дороге — здесь внедорожник отрабатывает свои деньги. С ноября по апрель на плато наваливаются снег
    и метели; это летняя поездка.
fa:
  name: دریاچهٔ پاراوانی و دریاچهٔ تاباتسکوری
  short: >-
    پاراوانی، بزرگ‌ترین دریاچهٔ گرجستان که هیچ‌جا از ۳٫۳ متر ژرف‌تر نیست، و تاباتسکوریِ ژرف و پرشیب؛ هر
    دو در ۲۰۰۰ متری فلات آتشفشانی و بی‌درخت جاواختی.
  body: >-
    **پاراوانی بزرگ‌ترین دریاچهٔ گرجستان است، و با این همه در سراسر ۳۷٫۵ کیلومتر مربع آن، آب هیچ‌جا از
    ۳٫۳ متر ژرف‌تر نمی‌شود.** دریاچه در ارتفاع ۲۰۷۳ متری بر فلات آتشفشانی جاواختی، میان رشته‌کوه‌های سامساری
    و جاواختی آرمیده است؛ در گودالی که وقتی گدازه‌ای در دوران پلیستوسن از ستیغ سامساری سرازیر شد و درهٔ
    رودی را بست، پدید آمد. اینجا نه درختی هست و نه پناهی. باد رویهٔ آب را به موج‌های کوتاه و خاکستری شانه
    می‌زند و به گیاهان آبزی مجال ریشه‌دواندن نمی‌دهد. در زمستان دریاچه یخ می‌بندد و ضخامت یخ به ۴۷ تا
    ۷۳ سانتی‌متر می‌رسد؛ رود پاراوانی از انتهای جنوبی آن بیرون می‌زند و به سوی رود متکواری (کورا) سرازیر
    می‌شود.


    نام روستاهای کرانه تاریخی غافلگیرکننده در خود دارد. تامبوفکا و رودیونوفکا را در دههٔ ۱۸۴۰ دوخوبورها
    بنیاد نهادند؛ دگراندیشان مذهبی روسی که تزار آنان را به این بلندی‌ها تبعید کرد. امروز تقریباً همهٔ
    ساکنان تامبوفکا ارمنی‌اند. بر کرانهٔ جنوبی، دیر بانوان نینوی قدیس در پوکا ایستاده است.


    حدود ۲۵ کیلومتر به سوی شمال‌غرب، در خط مستقیم، تاباتسکوری درست نقطهٔ مقابل پاراوانی است. سطح آن تنها
    ۱۴٫۲ کیلومتر مربع است، اما تا ۴۰٫۲ متر فرو می‌رود و از هر دریاچهٔ دیگری در گرجستان آب بیشتری در خود
    دارد. کرانه‌هایش بلند و پرشیب‌اند، با خلیجک‌های فراوان و چند جزیرهٔ کوچک، در ارتفاع ۱۹۹۱ متری؛ قزل‌آلا
    و ماهی سیگ (کورگونوس) در آن زندگی می‌کنند و ذخیره‌گاه مدیریت‌شدهٔ کتسیا-تاباتسکوری گرداگردش را گرفته
    است. در سدهٔ هجدهم، واخوشتی باگراتیونیِ جغرافی‌دان باوری محلی را ثبت کرد که می‌گفت ملکه تامار خود
    این دریاچه را ساخته است، با کشیدن آبراهه‌ای از رود کتسیا. این روایت است، نه زمین‌شناسی: گودال را جریان‌های
    گدازه شکل داده‌اند.


    برای فراخی و گستره بیایید، نه برای دیدنی‌ها. ماشین را نگه دارید، موتور را خاموش کنید؛ آن‌وقت تنها
    صدایی که بر فلات می‌ماند، باد است که بی‌وقفه آب را می‌آشوبد.
  tip: >-
    پاراوانی کنار جادهٔ آسفالته است و زحمتی ندارد. تاباتسکوری گردشی جداگانه است و بیشتر از باکوریانی و
    از راه گردنهٔ تسخراتسکارو به آن می‌رسند، روی جاده‌ای شنی که هوای خشک و خودرویی با فاصلهٔ زیاد از زمین
    می‌خواهد؛ انتظار نداشته باشید هر دو دریاچه را در یک توقف کوتاه ببینید. حتی در تیرماه (ژوئیه) گرم بپوشید:
    در ارتفاع ۲۰۰۰ متری باد هرگز نمی‌خوابد و شب‌ها سرد می‌شود. بر کرانهٔ هیچ‌کدام مغازه یا سرپناهی نیست؛
    پس آب و خوراک همراه بیاورید و در تسالکا یا نینوتسمیندا باک را پر کنید. آب تمام تابستان سرد می‌ماند:
    ماهیگیران می‌آیند، شناگران به‌ندرت.
  route: >-
    کوتاه‌ترین راه از تفلیس از تسکنتی و کوجوری بالا می‌رود و از جادهٔ Sh36 به مانگلیسی می‌رسد، سپس از
    جادهٔ Sh31 به سوی غرب، از فلات تسالکا می‌گذرد و به تسالکا می‌رسد. از آنجا به سوی جنوب‌غرب و نینوتسمیندا
    ادامه دهید تا پاراوانی در سمت راست پدیدار شود: حدود ۱۳۵ کیلومتر، اما برای پیچ‌های تند، آسفالت خراب
    و گله‌های روی جاده سه ساعت کنار بگذارید. برای تاباتسکوری به باکوریانی بروید و از گردنهٔ تسخراتسکارو
    روی جاده‌ای شنی بگذرید؛ همان‌جاست که شاسی‌بلند ارزش کرایه‌اش را نشان می‌دهد. از نوامبر تا آوریل برف
    و کولاک فلات را فرا می‌گیرد؛ این سفری تابستانی است.
he:
  name: אגם פרוואני ואגם טבאצקורי
  short: >-
    האגם הגדול בגאורגיה, שעומקו אינו עולה על 3.3 מטר, ולצדו טבאצקורי העמוק והתלול — שניהם בגובה 2,000
    מטר על רמת ג'בחטי הוולקנית והחשופה מעצים.
  body: >-
    **פרוואני הוא האגם הגדול ביותר בגאורגיה, ובכל זאת על פני 37.5 הקילומטרים הרבועים שלו עומק המים אינו
    עולה בשום מקום על 3.3 מטר.** הוא שוכן בגובה 2,073 מטר ברמה הוולקנית של ג'בחטי, בין רכס סמסרי לרכס
    ג'בחטי, באגן שנוצר כאשר זרם לבה מתקופת הפליסטוקן, שירד מרכס סמסרי, חסם עמק נהר. אין כאן עצים ואין
    מחסה. הרוח מסרקת את פני המים לגלים קצרים ואפורים ואינה מניחה לצמחי מים להיאחז. בחורף האגם קופא, עובי
    הקרח 47 עד 73 סנטימטר, ונהר פרוואני יוצא מקצהו הדרומי וזורם אל המטקוורי.


    שמות הכפרים שעל החוף נושאים היסטוריה מפתיעה. את טמבובקה ורודיונובקה ייסדו בשנות ה-40 של המאה ה-19
    הדוחובורים, פורשים דתיים רוסים שהצאר הגלה לרמות האלה; היום טמבובקה ארמנית כמעט כולה. על החוף הדרומי
    עומד מנזר הנזירות של נינו הקדושה בפוקה.


    כ-25 ק"מ צפונית-מערבית, בקו אווירי, טבאצקורי הוא ההפך הגמור מפרוואני. שטח פניו 14.2 קילומטר רבוע בלבד,
    אבל הוא צולל לעומק 40.2 מטר ומכיל יותר מים מכל אגם אחר בגאורגיה. חופיו גבוהים ותלולים, חרוצים במפרצים
    ובהם כמה איים קטנים, בגובה 1,991 מטר; חיים בו פורל וקורגון (סיג), ושמורת קציה-טבאצקורי המנוהלת מקיפה
    אותו. במאה ה-18 תיעד הגאוגרף וחושטי בגרטיוני אמונה מקומית שלפיה המלכה תמר עצמה יצרה את האגם כשהטתה
    אליו תעלה מנהר קציה. זו מסורת, לא גאולוגיה: את האגן יצרו זרמי לבה.


    באים לכאן בשביל המרחב, לא בשביל אתרים. עצרו את הרכב, כבו את המנוע, והקול היחיד שיישאר על הרמה יהיה
    הרוח המסלסלת את המים בלי הרף.
  tip: >-
    פרוואני נמצא ממש ליד הכביש הסלול ואינו דורש שום מאמץ. טבאצקורי הוא טיול נפרד: לרוב מגיעים אליו מבקוריאני
    דרך מעבר צחרצקרו, בדרך עפר שדורשת מזג אוויר יבש ורכב גבוה; אל תצפו לראות את שני האגמים בעצירה קצרה
    אחת. התלבשו חם גם ביולי: בגובה 2,000 מטר הרוח אינה פוסקת והערבים קרים. אין חנות ואין מחסה על חופי
    שני האגמים, אז הביאו אוכל ומים ותדלקו בצלקה או בנינוצמינדה. המים נשארים קרים כל הקיץ: דייגים מגיעים,
    שחיינים — לעיתים רחוקות.
  route: >-
    הדרך הקצרה ביותר מטביליסי מטפסת דרך צקנטי וקוג'ורי בכביש Sh36 אל מנגליסי, ומשם ממשיכה מערבה בכביש
    Sh31 לרוחב רמת צלקה עד העיירה צלקה. משם המשיכו דרומה-מערבה לכיוון נינוצמינדה, עד שפרוואני ייפתח מימינכם:
    כ-135 ק"מ, אבל הקצו שלוש שעות בגלל עיקולים חדים, אספלט שבור ובקר על הכביש. לטבאצקורי סעו לבקוריאני
    וחצו את מעבר צחרצקרו בדרך עפר — שם רכב שטח מצדיק את מחירו. מנובמבר עד אפריל שלג וסופות שלגים משתלטים
    על הרמה; זה טיול לקיץ.
ar:
  name: بحيرة بارافاني وبحيرة تاباتسكوري
  short: >-
    أكبر بحيرات جورجيا لا يزيد عمقها في أي موضع على 3.3 أمتار، وتاباتسكوري العميقة شديدة الانحدار؛ كلتاهما
    على ارتفاع 2000 متر فوق هضبة جافاخيتي البركانية الجرداء.
  body: >-
    **بارافاني أكبر بحيرة في جورجيا، ومع ذلك لا يزيد عمق الماء في أي موضع من مساحتها البالغة 37.5 كيلومتراً
    مربعاً على 3.3 أمتار.** تقع على ارتفاع 2073 متراً فوق مرتفعات جافاخيتي البركانية، بين سلسلتي سامساري
    وجافاخيتي، في حوض تشكّل حين سدّ تدفّقٌ من الحمم نزل من سلسلة سامساري في العصر البليستوسيني وادياً
    نهرياً. لا أشجار هنا ولا ملاذ. تمشّط الريح سطح الماء أمواجاً قصيرة رمادية، ولا تترك للنباتات المائية
    فرصة لتتشبّث. في الشتاء تتجمّد البحيرة ويبلغ سُمك الجليد ما بين 47 و73 سنتيمتراً، ويخرج نهر بارافاني
    من طرفها الجنوبي منحدراً نحو نهر متكفاري (الكورا).


    تحمل أسماء قرى الضفاف تاريخاً غير متوقّع. فقد أسّس تامبوفكا وروديونوفكا في أربعينيات القرن التاسع
    عشر الدوخوبور، وهم منشقّون دينيون روس نفاهم القيصر إلى هذه المرتفعات؛ واليوم تكاد تامبوفكا تكون أرمنية
    بالكامل. وعلى الضفة الجنوبية يقوم دير الراهبات على اسم القديسة نينو في بوكا.


    وعلى بُعد نحو 25 كم إلى الشمال الغربي، في خط مستقيم، تبدو تاباتسكوري نقيض بارافاني. فمساحة سطحها 14.2
    كيلومتراً مربعاً فقط، لكنها تغوص حتى 40.2 متراً وتحوي من الماء أكثر من أي بحيرة أخرى في جورجيا. ضفافها
    عالية شديدة الانحدار، تتخلّلها خلجان وبضع جزر صغيرة، على ارتفاع 1991 متراً؛ يعيش فيها السلمون المرقّط
    وسمك السيغ الأبيض، وتحيط بها محمية كتسيا-تاباتسكوري المُدارة. وفي القرن الثامن عشر دوّن الجغرافي فاخوشتي
    باغراتيوني اعتقاداً محلياً بأن الملكة تامار صنعت البحيرة بنفسها حين شقّت إليها قناة من نهر كتسيا.
    إنها رواية شعبية لا جيولوجيا: فالحوض صنعته تدفّقات الحمم.


    تعالَ من أجل الفضاء الرحب لا من أجل المعالم. أوقف السيارة وأطفئ المحرّك، فلا يبقى على الهضبة من صوت
    سوى الريح وهي تعبث بالماء.
  tip: >-
    بارافاني بجوار الطريق المعبّد مباشرة ولا تتطلّب أي جهد. أما تاباتسكوري فرحلة مستقلّة، يُوصَل إليها
    غالباً من باكورياني عبر ممرّ تسخراتسكارو على طريق حصوي يحتاج إلى طقس جاف وسيارة عالية عن الأرض؛ فلا
    تتوقّع أن ترى البحيرتين في توقّف قصير واحد. البس ثياباً دافئة حتى في يوليو: فعلى ارتفاع 2000 متر لا
    تهدأ الريح أبداً والأمسيات باردة. لا متجر ولا ملجأ على ضفاف أيٍّ منهما، فاحمل طعاماً وماءً واملأ خزان
    الوقود في تسالكا أو نينوتسميندا. يبقى الماء بارداً طوال الصيف: يأتيه الصيادون، ونادراً ما يأتيه السبّاحون.
  route: >-
    أقصر طريق من تبليسي يصعد عبر تسكنيتي وكوجوري على الطريق Sh36 إلى مانغليسي، ثم يتّجه غرباً على الطريق
    Sh31 عبر هضبة تسالكا حتى بلدة تسالكا. ومن هناك تابع نحو الجنوب الغربي باتجاه نينوتسميندا حتى تنفتح
    بارافاني على يمينك: نحو 135 كم، لكن خصِّص ثلاث ساعات بسبب المنعطفات الحادة والإسفلت المتكسّر والماشية
    على الطريق. أما إلى تاباتسكوري فاقصد باكورياني واعبر ممرّ تسخراتسكارو على مسلك حصوي، وهناك تُثبت سيارة
    الدفع الرباعي جدارتها. من نوفمبر إلى أبريل يطبق الثلج والعواصف الثلجية على الهضبة؛ فهذه رحلة صيفية.
